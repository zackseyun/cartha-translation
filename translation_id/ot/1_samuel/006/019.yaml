revisions:
- from: Ia menghukum mati sebagian laki-laki Bet-Semes karena mereka telah melihat ke dalam tabut Yahweh.[a] Ia menghukum mati tujuh puluh orang di antara rakyat itu, lima puluh ribu orang.[b] Rakyat itu berkabung karena Yahweh telah menghantam mereka dengan pukulan yang dahsyat.
  to: Ia menewaskan beberapa laki-laki Bet-Semes karena mereka telah melihat ke dalam tabut Yahweh.[a] Di antara rakyat itu Ia menewaskan tujuh puluh orang, lima puluh ribu orang.[b] Rakyat itu berkabung karena Yahweh telah memukul rakyat itu dengan pukulan besar.
