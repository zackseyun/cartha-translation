  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: id
  text: Ia menewaskan beberapa laki-laki Bet-Semes karena mereka telah melihat ke dalam tabut Yahweh.[a] Di antara rakyat itu Ia menewaskan tujuh puluh orang, lima puluh ribu orang.[b] Rakyat itu berkabung karena Yahweh telah memukul rakyat itu dengan pukulan besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena mereka telah melihat tabut Yahweh.” Preposisi Ibraninya dapat dipahami secara lebih umum, meskipun “melihat ke dalam” mungkin lebih sesuai dengan pelanggaran dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi, “tujuh puluh orang, lima puluh ribu orang,” suatu susunan yang sulit. Ini mungkin berarti “tujuh puluh orang dari lima puluh ribu orang” atau “lima puluh ribu ditambah tujuh puluh orang,” atau mungkin mencerminkan masalah tekstual. Sejumlah saksi kuno mendukung jumlah yang jauh lebih kecil.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia menghukum mati
  rationale: Dalam konteks penghukuman yang menimbulkan korban jiwa, bentuk dari נכה berarti memukul hingga tewas; ungkapan ini menyatakan akibat fatal secara alami dalam bahasa Indonesia.
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: sebagian laki-laki Bet-Semes
  rationale: Preposisi בְּ memberi nuansa partitif, yaitu orang-orang tertentu di antara laki-laki Bet-Semes, bukan semua penduduknya; unsur laki-laki dipertahankan dari אַנְשֵׁי.
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: karena mereka telah melihat ke dalam tabut Yahweh
  rationale: ראה dengan ב dapat berarti melihat pada atau ke dalam. Konteks pelanggaran terhadap tabut mendukung 'ke dalam', sedangkan kemungkinan 'melihat tabut' dicatat dalam catatan kaki.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Konstruksi ini secara langsung berarti tabut milik atau terkait dengan Yahweh; nama ilahi dipertahankan sebagai nama diri.
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: tujuh puluh orang ... lima puluh ribu orang
  rationale: Urutan angka dalam Teks Masoret sulit. Teks utama mempertahankan kedua kelompok angka tanpa diam-diam memilih salah satu penafsiran.
- source_word: וַיִּתְאַבְּלוּ
  choice: berkabung
  rationale: Bentuk hitpael dari אבל menyatakan perkabungan atau ratapan setelah kematian atau bencana.
- source_word: מַכָּה גְדוֹלָה
  choice: pukulan yang dahsyat
  rationale: מַכָּה berarti pukulan, hantaman, atau tulah. 'Pukulan yang dahsyat' mempertahankan kaitan leksikal dengan נכה tanpa mempersempitnya menjadi wabah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memuat nama ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Pelanggaran laki-laki Bet-Semes
  choice: melihat ke dalam tabut
  alternative: melihat tabut
  rationale: Makna preposisi Ibrani memungkinkan kedua pembacaan. Konteks mendukung 'ke dalam', tetapi alternatif yang lebih umum tetap dicatat agar ambiguitas asli tidak dihapus.
- issue: Jumlah korban yang sulit
  choice: 'mempertahankan urutan Teks Masoret: tujuh puluh orang, lima puluh ribu orang'
  alternative: tujuh puluh dari lima puluh ribu; lima puluh ribu tujuh puluh; atau jumlah yang lebih kecil menurut sejumlah saksi kuno
  rationale: Susunan Ibraninya tidak lazim dan kemungkinan mengandung masalah tekstual. Terjemahan utama tidak menyelesaikan kesulitan itu secara spekulatif; berbagai kemungkinan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama tempat dieja Bet-Semes sesuai kebiasaan Indonesia. 'Rakyat itu' dipakai untuk הָעָם dalam komunitas setempat, sedangkan repetisi verba pukul dipertahankan melalui 'menghukum mati' dan 'menghantam ... dengan pukulan' tanpa menjadikannya istilah teknis seperti wabah.
