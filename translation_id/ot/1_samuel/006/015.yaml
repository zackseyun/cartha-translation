source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: id
  text: Para orang Lewi menurunkan tabut Yahweh[a] dan peti yang menyertainya, yang berisi benda-benda emas[b], lalu meletakkan keduanya di atas batu besar itu. Orang-orang Bet-Semes mempersembahkan kurban-kurban bakaran dan menyembelih kurban-kurban[c] pada hari itu kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani ini dapat berarti benda, barang, perkakas, atau wadah yang terbuat dari emas.
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah, bahasa Ibrani memakai kata kerja dan kata benda yang berakar sama: “mengurbankan kurban-kurban”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Para orang Lewi
  rationale: Menunjuk kepada anggota suku Lewi; bentuk ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: הוֹרִידוּ
  choice: menurunkan
  rationale: Bentuk kausatif dari ירד di sini menggambarkan tindakan menurunkan tabut dan peti dari kereta.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: אֲרוֹן dalam konteks ibadah Israel lazim diterjemahkan 'tabut', sedangkan nama ilahi יהוה ditransliterasikan 'Yahweh' agar nama perjanjian itu tetap tampak.
- source_word: הָאַרְגַּז אֲשֶׁר אִתּוֹ
  choice: peti yang menyertainya
  rationale: אַרְגַּז adalah wadah yang berbeda dari tabut. 'Menyertainya' menyampaikan hubungan sederhana אִתּוֹ secara alami.
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: yang berisi benda-benda emas
  rationale: כְלֵי adalah istilah luas untuk barang, benda, perkakas, atau wadah; 'benda-benda emas' tidak menentukan bentuknya secara berlebihan.
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: lalu meletakkan keduanya di atas batu besar itu
  rationale: Objek jamak tersirat dipahami sebagai tabut dan peti. Dalam konteks ini אֶל bersama שׂים paling mungkin menunjuk penempatan pada batu, meskipun secara leksikal dapat berarti 'ke' atau 'di dekat'.
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: Orang-orang Bet-Semes
  rationale: אַנְשֵׁי secara bentuk berarti 'orang-orang/kaum laki-laki dari'. Dalam konstruksi nama tempat, ungkapan Indonesia ini secara alami menunjuk para warga atau penduduk Bet-Semes tanpa menambahkan pembatasan yang tidak pasti.
- source_word: הֶעֱלוּ עֹלוֹת
  choice: mempersembahkan kurban-kurban bakaran
  rationale: Ini merupakan ungkapan baku untuk tindakan mempersembahkan עֹלָה, kurban yang dibakar seluruhnya di atas mezbah.
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: dan menyembelih kurban-kurban
  rationale: Pilihan ini mempertahankan unsur tindakan זבח, yakni menyembelih sebagai kurban, sambil tetap terdengar wajar dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: pada hari itu bagi Yahweh
  rationale: Frasa waktu diterjemahkan langsung, sedangkan ל menandai Yahweh sebagai pihak yang menerima atau menjadi tujuan persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה. 'Yahweh' mempertahankan nama tersebut, sementara catatan kaki menyebutkan tradisi penerjemahan yang lazim.
- issue: Cakupan gender אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: Orang-orang Bet-Semes
  alternative: Para lelaki Bet-Semes
  rationale: Walaupun bentuk Ibraninya maskulin, konstruksi אַנְשֵׁי + nama tempat dapat berfungsi sebagai sebutan bagi warga atau penduduk. Konteks tidak cukup memastikan bahwa hanya laki-laki yang dimaksud, sehingga terjemahan tidak mempersempit rujukannya.
- issue: Hubungan tempat pada אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: di atas batu besar itu
  alternative: di dekat batu besar itu
  rationale: Konteks naratif mendukung batu sebagai tempat tabut dan peti diletakkan, tetapi preposisi אֶל sendiri tidak secara eksplisit berarti 'di atas'; karena itu alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah ibadah 'tabut', 'kurban', dan 'kurban bakaran' dipertahankan karena dikenal luas dan sesuai konteks. Struktur kalimat dibagi secara alami tanpa menghilangkan urutan tindakan dalam bahasa Ibrani.
