  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: id
  text: Itulah sebabnya, sampai hari ini para imam Dagon dan semua orang yang masuk ke kuil Dagon di Asdod tidak menginjak ambang pintu Dagon.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak menapaki ambang pintu Dagon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “rumah Dagon”; di sini diterjemahkan “kuil” karena yang dimaksud adalah tempat pemujaan dewa Dagon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menyatakan akibat dari peristiwa sebelumnya dengan ungkapan sebab-akibat yang alami dalam bahasa Indonesia modern.
- source_word: לֹא יִדְרְכוּ
  choice: tidak menginjak
  rationale: Verba דרך berarti menginjak atau menapaki; 'menginjak' tepat dan alami ketika objeknya ialah ambang pintu.
- source_word: כֹהֲנֵי דָגוֹן
  choice: para imam Dagon
  rationale: Menerjemahkan konstruksi kepunyaan secara lugas serta mempertahankan sebutan kultis 'imam'.
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: dan semua orang yang masuk ke kuil Dagon
  rationale: Dalam konteks ini 'rumah Dagon' adalah bangunan pemujaan; 'kuil' menyampaikan acuannya secara jelas dan wajar.
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: ambang pintu Dagon
  rationale: מִפְתָּן berarti ambang; penambahan 'pintu' menghasilkan ungkapan Indonesia yang jelas tanpa mengubah acuannya.
- source_word: בְּאַשְׁדּוֹד
  choice: di Asdod
  rationale: Preposisi lokatif menunjukkan tempat berdirinya kuil dan berlangsungnya kebiasaan tersebut.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan Indonesia yang lazim untuk kebiasaan yang terus berlangsung hingga masa narator.
