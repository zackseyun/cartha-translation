  text: וּ/פְלִשְׁתִּים֙ לָֽקְח֔וּ אֵ֖ת אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יְבִאֻ֛/הוּ מֵ/אֶ֥בֶן הָעֵ֖זֶר אַשְׁדּֽוֹדָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/001.yaml
  text: The Philistines had taken the ark of God and brought it from Ebenezer to Ashdod[a].
translation:
  language: id
  text: Orang Filistin telah mengambil tabut Allah dan membawanya dari Eben-Haezer ke Asdod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Nama kelompok bangsa diterjemahkan dengan bentuk baku dalam bahasa Indonesia. Konjungsi ו tidak dinyatakan tersendiri karena ayat ini menjadi peralihan narasi dan kalimat Indonesia tetap alami tanpa kata pembuka tambahan.
- source_word: לָקְחוּ
  choice: telah mengambil
  rationale: Bentuk perfektum Qal orang ketiga jamak dari לקח menyatakan tindakan yang sudah terjadi; 'telah mengambil' menandai latar tindakan sebelumnya sebelum tindakan membawa tabut.
- source_word: אֵת
  choice: '[penanda objek langsung tidak diterjemahkan]'
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan leksikal yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Konstruksi genitif Ibrani dipertahankan secara lugas dan alami tanpa menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: וַיְבִאֻהוּ
  choice: dan membawanya
  rationale: Bentuk Hifil wayyiqtol dari בוא dengan sufiks maskulin tunggal berarti 'dan mereka membawanya'; subjek tidak perlu diulang karena jelas, sedangkan sufiks objek dinyatakan dengan '-nya'.
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: dari Eben-Haezer
  rationale: Prefiks מִן diterjemahkan 'dari', sedangkan nama tempat ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַשְׁדּוֹדָה
  choice: ke Asdod
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Asdod, yang secara alami diterjemahkan dengan preposisi 'ke'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan tindakan dipertahankan, dengan bentuk 'telah mengambil' untuk menghubungkan ayat ini dengan peristiwa sebelumnya. Tidak diperlukan catatan kaki karena penghilangan konjungsi pembuka merupakan penyesuaian wacana yang wajar dan tidak mengubah makna.
