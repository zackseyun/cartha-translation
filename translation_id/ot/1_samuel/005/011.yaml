base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: id
  text: Mereka pun mengirim utusan untuk mengumpulkan semua penguasa orang Filistin. Mereka berkata, “Singkirkanlah tabut Allah Israel dan biarkan tabut itu kembali ke tempatnya, supaya tabut itu tidak membunuh aku dan rakyatku.” Sebab, kepanikan yang mematikan melanda seluruh kota[a]; tangan Allah sangat berat di sana[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat diterjemahkan ‘kekacauan maut’; ungkapan ini juga dapat berarti ‘kengerian yang membawa maut’ atau ‘huru-hara yang mematikan’.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ‘tangan Allah sangat berat di sana’, sebuah metafora bagi tindakan kuasa Allah yang mendatangkan hukuman berat.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי
  choice: penguasa
  rationale: Istilah ini menunjuk pada para pemimpin resmi kota-kota Filistin. ‘Penguasa’ menyampaikan kedudukan politik mereka dengan jelas tanpa menyamakan mereka secara tidak perlu dengan raja.
- source_word: שַׁלְּחוּ
  choice: Singkirkanlah
  rationale: Perintah ini bukan sekadar menyuruh mengirim tabut, melainkan menyingkirkannya dari kota karena dianggap membawa bencana.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: tabut Allah Israel
  rationale: Terjemahan ini mempertahankan hubungan kepunyaan dalam bahasa Ibrani dan jelas menunjuk kepada Allah yang disembah Israel.
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: dan biarkan tabut itu kembali ke tempatnya
  rationale: Bentuk kehendak yang mengikuti perintah dipertahankan dengan ‘biarkan’; pengulangan ‘tabut itu’ membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: supaya tabut itu tidak membunuh aku dan rakyatku
  rationale: Bentuk kausatif dari מות berarti ‘membunuh’. Pronomina tunggal ‘aku’ dan ‘rakyatku’ dipertahankan sesuai teks Ibrani meskipun para pembicara sebelumnya disebut dalam bentuk jamak.
- source_word: מְהוּמַת מָוֶת
  choice: kepanikan yang mematikan
  rationale: Frasa ini menggambarkan kekacauan atau kengerian yang berkaitan dengan maut. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur kepanikan dan akibat yang mematikan.
- source_word: בְּכָל הָעִיר
  choice: melanda seluruh kota
  rationale: Ungkapan ini menyampaikan bahwa keadaan tersebut tersebar di segenap kota; ‘melanda’ menghasilkan kalimat Indonesia yang alami.
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: tangan Allah menekan dengan sangat berat
  rationale: Metafora ‘tangan Allah’ dipertahankan, sedangkan verba ‘menekan’ membuat gambaran tentang tindakan penghukuman yang berat dapat dipahami secara alami.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini sebutan tersebut menunjuk secara khusus kepada Allah Israel yang sudah disebutkan sebelumnya.
theological_decisions:
- issue: Apakah metafora antropomorfis ‘tangan Allah’ dipertahankan atau dijelaskan sebagai kuasa maupun penghukuman Allah
  choice: 'Metafora dipertahankan: ‘tangan Allah menekan dengan sangat berat di sana.’'
  alternative: ‘Allah menghukum tempat itu dengan sangat berat.’
  rationale: Teks Ibrani secara eksplisit memakai ‘tangan’, sebuah metafora penting tentang tindakan dan kuasa ilahi. Terjemahan mempertahankannya tanpa menentukan bentuk penghukuman lebih jauh daripada yang dinyatakan teks.
- issue: Peralihan dari subjek jamak ‘mereka berkata’ kepada pronomina tunggal ‘aku dan rakyatku’
  choice: 'Pronomina tunggal dipertahankan: ‘aku dan rakyatku.’'
  alternative: ‘kami dan rakyat kami.’
  rationale: Teks Masoret memakai akhiran tunggal, mungkin mewakili ucapan seorang penguasa kota, tetapi identitas pembicaranya tidak dijelaskan. Mempertahankan bentuk tunggal menjaga ketegangan tekstual itu dan tidak menghaluskannya menjadi bentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Rakyatku’ dipilih daripada ‘bangsaku’ karena konteksnya kemungkinan seorang penguasa kota dan penduduk yang berada di bawah kepemimpinannya. Tanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
