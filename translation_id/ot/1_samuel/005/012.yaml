translation:
  language: id
  text: Para laki-laki yang tidak mati ditimpa benjolan-benjolan[a], dan jeritan kota itu naik ke langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembengkakan”; istilah Ibrani ini menunjuk pada benjolan atau pembengkakan pada tubuh. Terjemahan tradisional kadang-kadang menyebutnya “wasir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Orang-orang
  rationale: אֲנָשִׁים dapat berarti para laki-laki, tetapi dalam konteks penduduk kota yang selamat, 'orang-orang' merupakan padanan Indonesia yang alami tanpa menambahkan keterangan yang tidak ada dalam teks.
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: yang tidak mati
  rationale: Mempertahankan kontras langsung antara mereka yang mati dan mereka yang tetap hidup.
- source_word: הֻכּוּ
  choice: ditimpa
  rationale: Bentuk Hofal dari נכה bersifat pasif. 'Ditimpa' menyampaikan serangan atau malapetaka yang menimpa mereka secara alami dalam bahasa Indonesia.
- source_word: בָעֳפָלִים
  choice: penyakit benjolan
  rationale: עֳפָלִים menunjuk pada benjolan atau pembengkakan tubuh. Ungkapan ini jelas bagi pembaca modern dan tidak mempersempitnya menjadi diagnosis tertentu.
- source_word: וַתַּעַל
  choice: naik
  rationale: עלה secara harfiah menggambarkan gerak naik dan mempertahankan gambaran jeritan yang mencapai langit.
- source_word: שַׁוְעַת
  choice: jeritan
  rationale: שַׁוְעָה adalah seruan keras dalam kesusahan atau permohonan pertolongan; 'jeritan' menyampaikan intensitas itu dengan wajar.
- source_word: הָעִיר
  choice: kota itu
  rationale: Frasa konstruksi שַׁוְעַת הָעִיר secara harfiah berarti jeritan kota itu, yakni jeritan kolektif penduduknya.
- source_word: הַשָּׁמָיִם
  choice: sampai ke langit
  rationale: שָׁמַיִם berbentuk jamak dalam bahasa Ibrani, tetapi 'langit' adalah padanan idiomatis dalam bahasa Indonesia. 'Sampai ke' menjelaskan tujuan gerak naik yang tersirat oleh konteks.
