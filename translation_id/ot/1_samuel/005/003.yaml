  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: id
  text: Keesokan harinya, ketika orang-orang Asdod bangun pagi-pagi, tampaklah Dagon sudah tersungkur dengan muka menghadap tanah di depan tabut Yahweh. Lalu mereka mengambil Dagon dan mengembalikannya ke tempatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם lazim berarti bangun atau berangkat pagi-pagi; pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: אַשְׁדּוֹדִים
  choice: orang-orang Asdod
  rationale: Bentuk gentilika jamak ini menunjuk kepada penduduk Asdod. Ungkapan ini lebih wajar dan mudah dipahami daripada membentuk istilah khusus seperti 'orang Asdodi'.
- source_word: מִמָּחֳרָת
  choice: keesokan harinya
  rationale: Ungkapan waktu ini berarti hari berikutnya; 'keesokan harinya' merupakan padanan Indonesia yang ringkas dan bermartabat.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הִנֵּה mengarahkan perhatian kepada pemandangan yang mengejutkan. 'Tampaklah' mempertahankan daya naratif itu tanpa terdengar arkais secara berlebihan.
- source_word: נֹפֵל
  choice: sudah tersungkur
  rationale: Partisip ini menggambarkan keadaan Dagon yang telah jatuh ketika ditemukan. 'Sudah' menyatakan keadaan hasil, sedangkan 'tersungkur' cocok dengan posisi muka ke tanah.
- source_word: לְפָנָיו אַרְצָה
  choice: dengan muka menghadap tanah
  rationale: Secara harfiah ungkapan ini menggambarkan Dagon jatuh pada mukanya ke arah tanah. Padanan ini jelas, alami, dan mempertahankan gambaran penghinaan atau ketundukan tanpa menafsirkannya lebih jauh.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: di depan tabut Yahweh
  rationale: לִפְנֵי bersifat spasial di sini, dan 'di depan' merupakan padanan Indonesia yang langsung. אֲרוֹן diterjemahkan 'tabut' sesuai istilah Alkitab Indonesia yang lazim.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: mereka mengambil Dagon
  rationale: לקח adalah kata kerja umum 'mengambil'. Konteks menjelaskan bahwa patung itu diangkat atau ditangani, sehingga tidak perlu mempersempit maknanya.
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: mengembalikannya ke tempatnya
  rationale: Bentuk Hifil שׁוב berarti menyebabkan kembali atau mengembalikan. Bentuk pronomina Indonesia tidak memaksakan jenis kelamin dan dapat merujuk kepada Dagon sebagai dewa maupun patungnya, sesuai ambiguitas konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Transliterasi 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Rujukan kepada Dagon sebagai dewa atau patung dewa
  choice: Memakai nama 'Dagon' dan enklitik netral '-nya' tanpa menjelaskan secara eksplisit
  alternative: patung Dagon
  rationale: Teks menyebut Dagon secara langsung dan menggunakan pronomina maskulin, tetapi dalam adegan ini yang dipindahkan adalah representasi kultisnya. Terjemahan tidak menambahkan kata 'patung', sehingga ketegangan antara dewa yang dinamai dan citranya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. Susunan kalimat dibuat alami, sementara unsur kejutan pada וְהִנֵּה dan gambaran Dagon yang tersungkur tetap dipertahankan.
