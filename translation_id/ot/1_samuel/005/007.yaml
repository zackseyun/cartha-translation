  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: id
  text: Ketika orang-orang Asdod melihat bahwa keadaan memang demikian, mereka berkata, “Tabut Allah Israel tidak boleh tetap berada[a] bersama kita, sebab tangan-Nya sangat menekan[b] kita dan Dagon, allah kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai dapat berarti “duduk”, “tinggal”, “menetap”, atau “tetap berada”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tangan-Nya berlaku keras terhadap kita dan terhadap Dagon, allah kita”; ini merupakan ungkapan tentang kuasa ilahi yang mendatangkan tekanan atau hukuman berat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: Ketika orang-orang Asdod melihat
  rationale: Bentuk naratif וַיִּרְאוּ melanjutkan urutan peristiwa dan secara alami dapat dinyatakan dengan klausa waktu. אַנְשֵׁי אַשְׁדּוֹד menunjuk kepada orang-orang Asdod; ungkapan ini wajar dalam bahasa Indonesia tanpa memastikan bahwa yang dimaksud hanya para pemimpin kota.
- source_word: כִּי כֵן
  choice: bahwa keadaan memang demikian
  rationale: Ungkapan ini menunjuk kembali kepada keadaan yang baru saja diceritakan. Kata 'memang' menyampaikan penegasan כֵן secara alami.
- source_word: לֹא יֵשֵׁב
  choice: tidak boleh tetap berada
  rationale: יָשַׁב dapat berarti duduk, tinggal, menetap, atau tetap berada. Karena subjeknya tabut dan konteksnya menyangkut keberadaan tabut di Asdod, 'tetap berada' paling wajar; 'tidak boleh' menyampaikan keputusan tegas para penutur.
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: Tabut Allah Israel
  rationale: Susunan ini dekat dengan konstruksi Ibrani dan mempertahankan sebutan yang dipakai orang Filistin, sekaligus kontras dengan 'Dagon, allah kita'.
- source_word: עִמָּנוּ
  choice: bersama kita
  rationale: עִם berarti 'dengan' atau 'bersama'. Bahasa Indonesia membedakan 'kami' dan 'kita', sedangkan bahasa Ibrani tidak; dalam pernyataan kepada sesama warga Asdod, bentuk inklusif 'kita' paling alami.
- source_word: קָשְׁתָה יָדוֹ
  choice: tangan-Nya keras menimpa
  rationale: קָשְׁתָה berarti menjadi atau berlaku keras, berat, atau dahsyat. Pilihan ini mempertahankan gambaran antropomorfis tentang 'tangan' ilahi sekaligus terdengar alami dalam konteks penghukuman.
- source_word: עָלֵינוּ וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: menimpa kita dan Dagon, allah kita
  rationale: עַל di sini menyatakan arah tindakan yang merugikan. 'Menimpa' menyampaikan dampaknya pada warga Asdod dan Dagon secara sejajar. 'Allah kita' dipertahankan sebagai ucapan orang Filistin, tanpa mengubahnya menjadi 'berhala'.
theological_decisions:
- issue: Ungkapan antropomorfis קָשְׁתָה יָדוֹ tentang penghukuman ilahi
  choice: tangan-Nya keras menimpa kita
  alternative: Ia menghukum kita dengan keras
  rationale: Teks utama mempertahankan metafora 'tangan' dan tidak mereduksinya menjadi penjelasan interpretatif. Dengan demikian, tindakan aktif Allah Israel terhadap orang Asdod dan Dagon tetap tampak.
- issue: Sebutan Dagon sebagai אֱלֹהֵינוּ
  choice: Dagon, allah kita
  alternative: Dagon, berhala kita
  rationale: Terjemahan mengikuti sudut pandang para penutur Filistin. Menyebut Dagon 'berhala' akan memasukkan penilaian yang tidak terdapat dalam ucapan mereka pada ayat ini.
- issue: Pembedaan pronomina inklusif dan eksklusif dalam bahasa Indonesia
  choice: kita
  alternative: kami
  rationale: Bahasa Ibrani hanya memiliki bentuk orang pertama jamak tanpa membedakan inklusif dan eksklusif. Dalam konteks para warga Asdod yang berbicara sebagai komunitas, 'kita' paling alami, tetapi teks sumber sendiri tidak menandai pembedaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Orang-orang Asdod' dipilih daripada 'kaum lelaki Asdod' karena lebih wajar dan tidak memastikan identitas sosial mereka melampaui yang dinyatakan konteks. Kapitalisasi 'Allah Israel' dan huruf kecil pada sebutan umum 'allah kita' membedakan nama/sebutan Allah Israel dari klaim para penutur mengenai Dagon tanpa mengubah isi ucapan mereka.
