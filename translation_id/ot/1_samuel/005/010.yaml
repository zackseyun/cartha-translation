  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: id
  text: Lalu mereka mengirim tabut Allah ke Ekron. Namun, ketika tabut Allah tiba di Ekron, orang-orang Ekron berteriak, “Mereka telah membawa tabut Allah Israel kepadaku untuk membunuh aku dan rakyatku!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani memakai bentuk tunggal: “kepadaku ... aku dan rakyatku.” Seruan itu mungkin disampaikan oleh seorang pemimpin sebagai wakil Ekron, atau kota itu diperlakukan sebagai satu pribadi kolektif.'
    reason: Menjelaskan peralihan mencolok dari subjek jamak kepada ucapan orang pertama tunggal tanpa mengubah bukti teks sumber.
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Lalu mereka mengirim
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; 'mengirim' menyampaikan tindakan pemindahan tabut secara alami.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Padanan langsung dan lazim untuk konstruksi Ibrani ini.
- source_word: וַיִּזְעֲקוּ
  choice: berteriak
  rationale: Kata ini menggambarkan seruan keras dalam keadaan genting; konteks menyediakan nuansa kepanikan.
- source_word: הֵסַבּוּ אֵלַי
  choice: Mereka telah membawa ... kemari kepadaku
  rationale: Hifil dari סבב menyatakan tindakan membawa atau mengalihkan ke arah pembicara; unsur אֵלַי dipertahankan sebagai orang pertama tunggal.
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: untuk membunuh aku dan rakyatku
  rationale: Mempertahankan sufiks orang pertama tunggal pada 'aku' dan 'rakyatku', serta tujuan yang dinyatakan oleh ל prefiks.
theological_decisions:
- issue: Peralihan dari subjek jamak 'orang-orang Ekron' kepada ucapan orang pertama tunggal
  choice: Mempertahankan 'kepadaku', 'aku', dan 'rakyatku' dalam teks utama
  alternative: Menyesuaikannya menjadi 'kepada kami', 'kami', dan 'rakyat kami' agar selaras dengan subjek kolektif
  rationale: Teks Masoret secara tegas memakai bentuk orang pertama tunggal אֵלַי, הֲמִיתֵנִי, dan עַמִּי. Ketegangan gramatikal ini tidak diselaraskan secara diam-diam; kemungkinan ucapan tersebut mewakili kota atau penguasanya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Rakyatku' dipilih untuk עַמִּי karena ucapan orang pertama tunggal dengan kelompok miliknya paling alami dipahami sebagai suara seorang pemimpin atau personifikasi kota; catatan kaki menjaga ambiguitas tersebut.
