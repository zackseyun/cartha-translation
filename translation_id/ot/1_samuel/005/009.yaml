source:
  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: id
  text: Setelah mereka memindahkannya, tangan Yahweh menimpa kota itu, sehingga terjadi kepanikan yang sangat hebat. Ia memukul laki-laki di kota itu, dari yang kecil sampai yang besar, dan bengkak-bengkak[a] bermunculan pada tubuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka ditumbuhi bengkak-bengkak.” Ungkapan Ibrani menggambarkan muncul atau meletusnya pembengkakan pada tubuh; jenis penyakitnya tidak disebutkan dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: mereka memindahkannya
  rationale: Bentuk kausatif dari סבב dengan pronomina objek menunjuk pada pemindahan tabut. Pilihan ini wajar dalam bahasa Indonesia dan tidak menambahkan arah atau tujuan yang tidak disebutkan.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Metafora Ibrani bagi kuasa dan penghukuman ilahi dipertahankan, bukan diratakan menjadi sekadar tindakan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh agar nama perjanjian itu tetap tampak dalam teks.
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: kepanikan yang sangat hebat
  rationale: מְהוּמָה dapat berarti kepanikan, kekacauan, atau huru-hara. Dalam konteks hukuman yang melanda kota, 'kepanikan' paling alami, sedangkan penguatan ganda diteruskan dengan 'sangat hebat'.
- source_word: וַיַּךְ
  choice: Ia menghantam
  rationale: Subjek tunggalnya kembali kepada Yahweh. 'Menghantam' mempertahankan daya konkret verba נכה sekaligus tetap alami dalam bahasa Indonesia modern.
- source_word: אַנְשֵׁי הָעִיר
  choice: kaum laki-laki di kota itu
  rationale: Nomina Ibrani secara khusus menyebut laki-laki, sehingga unsur gender dipertahankan dan tidak digeneralisasi menjadi seluruh penduduk.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan dekat ini mempertahankan kemungkinan bahwa ungkapan tersebut mengacu pada umur, kedudukan, atau tingkat sosial tanpa menetapkan salah satunya.
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: bengkak-bengkak bermunculan pada tubuh mereka
  rationale: Gabungan verba langka dan nomina ini menggambarkan muncul atau meletusnya pembengkakan tubuh. 'Bengkak-bengkak' jelas dan tidak memaksakan diagnosis khusus seperti wasir.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Metafora tangan ilahi dalam penghakiman
  choice: tangan Yahweh menimpa kota itu
  alternative: Yahweh menghukum kota itu
  rationale: Metafora 'tangan' dipertahankan karena merupakan bagian nyata dari penggambaran teologis teks tentang kuasa aktif Yahweh; 'menimpa' menyampaikan dampak yang bersifat menghukum tanpa menghapus metafora.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan metafora 'tangan Yahweh', penyebutan khusus kaum laki-laki, dan ambiguitas ungkapan 'dari yang kecil sampai yang besar'.
