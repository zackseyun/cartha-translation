id: 1SA.5.2
reference: 1 Samuel 5:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְח֤וּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יָּבִ֥יאוּ אֹת֖/וֹ בֵּ֣ית דָּג֑וֹן וַ/יַּצִּ֥יגוּ אֹת֖/וֹ אֵ֥צֶל דָּגֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: id
  text: Lalu orang Filistin mengambil tabut Allah, membawanya ke rumah Dagon[a], dan menempatkannya di samping Dagon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "kuil Dagon". Secara harfiah, "rumah Dagon".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Verba לקח dalam rangkaian naratif ini bermakna biasa 'mengambil'; pilihan ini tidak menambahkan unsur kekerasan seperti 'merebut'.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk kelompok bangsa Filistin.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Dalam konteks sakral, אֲרוֹן secara konvensional diterjemahkan 'tabut'. Teks memakai הָאֱלֹהִים, bukan nama YHWH, sehingga 'Allah' dipertahankan.
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: membawanya
  rationale: Bentuk Hifil dari בוא lazim berarti 'membawa'; akhiran objeknya merujuk kepada tabut.
- source_word: בֵּית דָּגוֹן
  choice: rumah Dagon
  rationale: Terjemahan ini mempertahankan ungkapan harfiah Ibrani 'rumah Dagon', yang dalam konteks berarti kuil Dagon; alternatif kontekstual dijelaskan dalam catatan kaki.
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: menempatkannya
  rationale: Bentuk Hifil dari יצג berarti menaruh atau menempatkan sesuatu pada suatu posisi; 'menempatkannya' alami dan tepat dalam konteks.
- source_word: אֵצֶל דָּגוֹן
  choice: di samping Dagon
  rationale: אֵצֶל menyatakan kedekatan spasial, yakni 'di samping/dekat'. Teks hanya menyebut Dagon, sehingga tidak diperjelas menjadi 'patung Dagon' dalam teks utama.
theological_decisions:
- issue: Sebutan ilahi dalam frasa 'tabut Allah'
  choice: Allah
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan הָאֱלֹהִים, bukan YHWH. Karena itu, terjemahan mempertahankan sebutan ilahi yang benar-benar terdapat dalam ayat ini.
- issue: Acuan nama Dagon pada akhir ayat
  choice: Dagon
  alternative: patung Dagon
  rationale: Dalam konteks rumah ibadah, nama itu kemungkinan mengacu pada patung pemujaan Dagon, tetapi teks Ibrani hanya mengatakan 'Dagon'. Terjemahan mempertahankan ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'Lalu' menjaga alur naratif tanpa membuat hubungan sebab-akibat lebih tegas daripada waw berurutan dalam teks Ibrani.
