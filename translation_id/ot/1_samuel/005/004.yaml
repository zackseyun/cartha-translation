  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּקֶר֮ מִֽ/מָּחֳרָת֒ וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וְ/רֹ֨אשׁ דָּג֜וֹן וּ/שְׁתֵּ֣י כַּפּ֣וֹת יָדָ֗י/ו כְּרֻתוֹת֙ אֶל הַ/מִּפְתָּ֔ן רַ֥ק דָּג֖וֹן נִשְׁאַ֥ר עָלָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: id
  text: Ketika mereka bangun pagi-pagi keesokan harinya, ternyata Dagon sudah jatuh tertelungkup di tanah di hadapan tabut Yahweh. Kepala Dagon dan kedua telapak tangannya telah terpenggal dan tergeletak di ambang pintu; hanya Dagon yang tersisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hanya Dagon yang tersisa padanya.” Ungkapan Ibrani ini sukar; kemungkinan maksudnya hanya tubuh atau batang tubuh patung Dagon yang tersisa setelah kepala dan kedua telapak tangannya terpenggal.'
    reason: Menjelaskan ungkapan Ibrani yang ambigu tanpa memasukkan penafsiran “tubuh” atau “batang tubuh” ke dalam teks utama.
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: Ketika mereka bangun pagi-pagi keesokan harinya
  rationale: Mengungkapkan tindakan bangun dini dan waktu pada hari berikutnya secara wajar dalam bahasa Indonesia, sekaligus mempertahankan alur naratif.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Penanda ini mengarahkan perhatian pada keadaan yang mengejutkan ketika ditemukan; “ternyata” menyampaikan fungsi tersebut secara alami.
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: sudah jatuh tertelungkup di tanah
  rationale: Partisip Ibrani menggambarkan keadaan Dagon saat ditemukan. “Sudah jatuh” menunjukkan bahwa peristiwa itu telah terjadi, sedangkan “tertelungkup di tanah” menyampaikan posisi merendah di hadapan tabut.
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: di hadapan tabut Yahweh
  rationale: “Di hadapan” mempertahankan hubungan ruang sekaligus nuansa adegan penundukan, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: kedua telapak tangannya
  rationale: כַּפּוֹת secara khusus menunjuk pada telapak tangan, bukan sekadar tangan, dan שְׁתֵּי menandai keduanya.
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: telah terpenggal dan tergeletak di ambang pintu
  rationale: כְּרֻתוֹת menyatakan keadaan terpotong atau terpenggal. Preposisi אֶל dalam konteks ini menunjukkan lokasi bagian-bagian yang terpenggal; “tergeletak” ditambahkan secara minimal agar hubungan lokatifnya jelas dan alami dalam bahasa Indonesia.
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: hanya Dagon yang tersisa padanya
  rationale: Terjemahan dekat ini mempertahankan ungkapan Ibrani yang sukar dan ambigu, tanpa memasukkan “tubuh” atau “batang tubuh” langsung ke dalam teks utama. Kemungkinan maksudnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Makna klausa penutup tentang Dagon
  choice: Mempertahankan bentuk dekat “hanya Dagon yang tersisa padanya” dengan catatan kaki
  alternative: hanya tubuh/batang tubuh Dagon yang tersisa
  rationale: Klausa Ibrani secara harfiah tidak menyebut “tubuh” atau “batang tubuh”. Konteks kuat mengarah ke bagian utama patung yang masih utuh, tetapi teks utama tidak seharusnya menutup ambiguitas itu tanpa penjelasan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. “Ternyata” dipakai untuk menyampaikan daya kejut וְהִנֵּה secara alami. Klausa terakhir sengaja dibuat dekat dengan bentuk Ibrani dan dibantu catatan kaki karena maknanya tidak pasti.
