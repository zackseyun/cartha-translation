base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: id
  text: Maka mereka mengirim utusan untuk mengumpulkan semua penguasa Filistin kepada mereka. Mereka berkata, “Apa yang harus kita lakukan terhadap tabut Allah Israel?” Para penguasa itu menjawab, “Biarlah tabut Allah Israel dialihkan ke Gat[a].” Lalu mereka memindahkan tabut Allah Israel itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah tabut Allah Israel bergerak memutar ke Gat.” Kata Ibraninya menekankan gerakan atau pengalihan, tetapi tidak menjelaskan cara tabut itu diangkut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיַּאַסְפוּ
  choice: mereka mengutus orang dan mengumpulkan
  rationale: שׁלח tanpa objek dalam konteks pemanggilan menyiratkan pengutusan orang, sedangkan אָסף berarti mengumpulkan. Ungkapan ini mempertahankan kedua tindakan sambil tetap wajar dalam bahasa Indonesia.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: penguasa Filistin
  rationale: סֶרֶן adalah gelar bagi para pemimpin kota Filistin. “Penguasa” menyampaikan jabatan politik itu tanpa menyiratkan kebangsawanan turun-temurun.
- source_word: אֲלֵיהֶם
  choice: di tempat mereka
  rationale: Frasa ini menunjukkan bahwa para penguasa dikumpulkan ke tempat atau hadapan pihak yang memanggil mereka; “di tempat mereka” menyatakannya secara alami.
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: Apa yang harus kita lakukan terhadap tabut
  rationale: Bentuk imperfek orang pertama jamak menyatakan pertimbangan bersama. ל diterjemahkan secara idiomatis dengan “terhadap” agar pertanyaannya alami dan tidak menyiratkan tindakan tertentu.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini menyatakan Allah yang terkait dengan Israel; “Allah Israel” adalah bentuk baku, ringkas, dan bermartabat dalam bahasa Indonesia.
- source_word: גַּת
  choice: Gat
  rationale: Nama tempat גַּת ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: יִסֹּב / וַיַּסֵּבּוּ
  choice: dipindahkan / mereka memindahkan
  rationale: Akar סבב menekankan gerakan atau pengalihan, dan bentuk Hifil berikutnya bersifat kausatif. “Dipindahkan/memindahkan” menyampaikan pemindahan tabut ke kota lain secara alami tanpa menentukan cara pengangkutannya.
