translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah “tabut” dipertahankan sebagai istilah Alkitab yang sudah umum. Pengulangan “tabut Allah Israel” mengikuti penekanan teks Ibrani, sedangkan “bertanya” dan “menjawab” membuat fungsi ujaran eksplisit secara alami.
