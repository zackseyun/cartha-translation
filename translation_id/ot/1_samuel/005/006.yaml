  text: וַ/תִּכְבַּ֧ד יַד יְהוָ֛ה אֶל הָ/אַשְׁדּוֹדִ֖ים וַ/יְשִׁמֵּ֑/ם וַ/יַּ֤ךְ אֹתָ/ם֙ ב/עפלים אֶת אַשְׁדּ֖וֹד וְ/אֶת גְּבוּלֶֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: id
  text: Tangan Yahweh menekan orang-orang Asdod dengan berat. Ia menghancurkan mereka dan menimpakan benjolan-benjolan[a] kepada mereka, Asdod dan wilayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembengkakan-pembengkakan”; secara tradisional, sebagian menerjemahkannya secara lebih khusus sebagai “wasir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: Tangan Yahweh menekan ... dengan berat
  rationale: Mempertahankan gambaran konkret ‘tangan’ dan metafora tentang beratnya tindakan penghukuman, sambil menyusunnya secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: orang-orang Asdod
  rationale: Bentuk Ibrani menunjuk kepada penduduk Asdod; dalam konteks ini preposisinya menyatakan arah tindakan yang memusuhi atau menekan mereka.
- source_word: וַיְשִׁמֵּם
  choice: Ia menghancurkan mereka
  rationale: Kata kerja ini menyatakan tindakan yang membawa kehancuran atau keadaan porak-poranda.
- source_word: וַיַּךְ אֹתָם
  choice: menghantam mereka
  rationale: Menyampaikan tindakan pukulan atau serangan penghukuman secara kuat dan alami dalam bahasa Indonesia modern.
- source_word: בָּעֳפָלִים
  choice: dengan benjolan-benjolan
  rationale: Istilah Ibrani menunjuk pada pembengkakan atau benjolan tubuh, tetapi jenis penyakitnya tidak pasti. Pilihan umum ini tidak mempersempit maknanya secara berlebihan.
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: baik Asdod maupun wilayahnya
  rationale: 'Frasa penjelas ini menunjukkan cakupan tulah: kota Asdod beserta daerah kekuasaannya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk ‘Yahweh’ mempertahankan nama pribadi Allah Israel yang terdapat dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Identifikasi penyakit dalam בָּעֳפָלִים
  choice: benjolan-benjolan
  alternative: tumor atau wasir
  rationale: Teks menunjukkan pembengkakan tubuh, tetapi tidak memastikan diagnosis tertentu; karena itu terjemahan utama mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani tentang tangan yang berat dipertahankan tanpa memakai susunan yang terlalu harfiah dan kaku. Pengulangan ‘mereka’ mengikuti rangkaian tindakan dalam sumber, sedangkan ‘baik ... maupun ...’ memperjelas frasa cakupan pada akhir ayat.
