revisions:
- from: Tangan Yahweh menekan orang-orang Asdod dengan berat. Ia menghancurkan mereka dan menghantam mereka dengan benjolan-benjolan[a], baik Asdod maupun wilayahnya.
  to: Tangan Yahweh menekan orang-orang Asdod dengan berat. Ia menghancurkan mereka dan menimpakan benjolan-benjolan[a] kepada mereka, Asdod dan wilayahnya.
  rationale: Revisi mengganti ungkapan yang dapat menyiratkan benjolan sebagai alat pukulan dengan ungkapan Indonesia yang lazim bagi tulah yang ditimpakan. Frasa penutup disederhanakan agar tetap mencerminkan cakupan Asdod beserta wilayahnya tanpa menambahkan penekanan "baik ... maupun". Ketidakpastian makna istilah penyakit dipertahankan dalam teks utama dan catatan kaki.
