  text: וַ/יַּשְׁכֵּ֧ם שְׁמוּאֵ֛ל לִ/קְרַ֥את שָׁא֖וּל בַּ/בֹּ֑קֶר וַ/יֻּגַּ֨ד לִ/שְׁמוּאֵ֜ל לֵ/אמֹ֗ר בָּֽא שָׁא֤וּל הַ/כַּרְמֶ֨לָ/ה֙ וְ/הִנֵּ֨ה מַצִּ֥יב ל/וֹ֙ יָ֔ד וַ/יִּסֹּב֙ וַֽ/יַּעֲבֹ֔ר וַ/יֵּ֖רֶד הַ/גִּלְגָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/012.yaml
  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: id
  text: 'Pagi-pagi Samuel bangun untuk menemui Saul. Lalu Samuel diberi tahu demikian: “Saul datang ke Karmel, dan lihatlah, ia telah mendirikan sebuah tugu[a] bagi dirinya sendiri. Setelah itu ia berbalik, melanjutkan perjalanan, dan turun ke Gilgal.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebuah tangan bagi dirinya sendiri.” Di sini “tangan” merupakan ungkapan untuk penanda peringatan atau tugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Pagi-pagi Samuel bangun
  rationale: Gabungan verba ‘bangun awal’ dan keterangan ‘pada pagi hari’ disampaikan secara alami dan tanpa pengulangan yang kaku dalam bahasa Indonesia.
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Konstruksi ini menyatakan tujuan tindakan Samuel; ‘untuk menemui’ jelas dan wajar.
- source_word: וַיֻּגַּד לִשְׁמוּאֵל לֵאמֹר
  choice: Lalu Samuel diberi tahu demikian
  rationale: Bentuk pasif dipertahankan sehingga pemberi laporan tidak ditambahkan, sedangkan ‘demikian’ memperkenalkan isi laporan secara alami.
- source_word: בָּא שָׁאוּל הַכַּרְמֶלָה
  choice: Saul datang ke Karmel
  rationale: Bentuk arah pada nama tempat menunjukkan gerak menuju Karmel; ‘datang ke’ mengikuti verba Ibrani dan sesuai dalam tuturan laporan.
- source_word: וְהִנֵּה
  choice: dan lihatlah
  rationale: Partikel ini menarik perhatian kepada perkembangan yang mencolok; ‘lihatlah’ mempertahankan daya deiktisnya dalam ragam yang bermartabat.
- source_word: מַצִּיב
  choice: telah mendirikan
  rationale: Partisipel sesudah וְהִנֵּה dapat menggambarkan tindakan secara hidup atau keadaan hasilnya. Bentuk ‘telah mendirikan’ menyampaikan hasil yang kini tampak tanpa menentukan waktu lebih jauh.
- source_word: יָד
  choice: sebuah tugu
  rationale: Secara harfiah berarti ‘tangan’, tetapi di sini merupakan sebutan idiomatis bagi penanda peringatan atau monumen. ‘Tugu’ jelas bagi pembaca modern dan cocok dengan konteks.
- source_word: לּוֹ
  choice: bagi dirinya sendiri
  rationale: Pronomina datif dalam konteks ini menunjukkan bahwa Saul mendirikan tugu itu untuk dirinya sendiri.
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: ia berbalik, melanjutkan perjalanan
  rationale: Rangkaian ini menggambarkan perubahan arah lalu gerak yang berlanjut; terjemahan tersebut alami dan mempertahankan urutannya.
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: turun ke Gilgal
  rationale: Verba ירד menyatakan gerak turun, termasuk penurunan topografis menuju Gilgal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk pasif mempertahankan ketidakjelasan mengenai siapa yang menyampaikan laporan, dan ‘lihatlah’ mempertahankan penekanan wacana teks Ibrani.
