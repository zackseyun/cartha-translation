  terminology: '"Yahweh" dan "menaati suara Yahweh" tepat serta mempertahankan idiom sumber. Untuk חרם, "mengkhususkan ... untuk dimusnahkan" menyampaikan dimensi khusus istilah itu tanpa menyebutnya persembahan atau memaksakan istilah teknis denominasi.'
