base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: id
  text: Kata Saul kepada Samuel, “Tetapi aku sungguh telah menaati suara Yahweh. Aku telah menempuh jalan yang Yahweh suruh aku tempuh. Aku membawa Agag, raja Amalek, dan aku telah mengkhususkan Amalek untuk dimusnahkan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah membinasakan Amalek sama sekali” atau “Aku telah menempatkan Amalek di bawah larangan pemusnahan.” Kata kerja Ibrani ini mengandung arti mengkhususkan atau menyerahkan sesuatu untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: aku sungguh telah menaati suara
  rationale: Ungkapan שׁמע בְּקוֹל berarti mendengarkan dengan ketaatan. 'Sungguh' menyampaikan nada bantahan Saul, sedangkan 'suara' mempertahankan idiom Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: Aku telah menempuh jalan yang Yahweh tugaskan kepadaku
  rationale: '''Menempuh jalan'' mempertahankan metafora perjalanan, sementara ''tugaskan kepadaku'' menyampaikan maksud pengutusan secara alami dalam bahasa Indonesia.'
- source_word: וָאָבִיא
  choice: Aku membawa
  rationale: Bentuk hifil dari בוא menyatakan tindakan membuat datang atau membawa; unsur 'kembali' tidak dinyatakan secara eksplisit.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, raja Amalek
  rationale: Menyajikan aposisi Ibrani secara lugas dan alami.
- source_word: הֶחֱרַמְתִּי
  choice: menumpas ... sebagai persembahan yang dikhususkan untuk dimusnahkan
  rationale: חרם dalam bentuk hifil mencakup tindakan membinasakan sesuatu yang telah dikhususkan bagi pemusnahan. Rumusan ini mempertahankan tindakan nyata sekaligus dimensi sakral-yudisial istilah tersebut.
- source_word: וְאֶת עֲמָלֵק
  choice: Amalek
  rationale: Nama tunggal 'Amalek' dipertahankan sebagai sebutan kolektif bagi bangsa itu, sesuai bentuk teks Ibrani.
theological_decisions:
- issue: Makna חרם dalam konteks perang penghukuman
  choice: menumpas Amalek sebagai persembahan yang dikhususkan untuk dimusnahkan
  alternative: membinasakan Amalek sama sekali; menempatkan Amalek di bawah larangan pemusnahan
  rationale: Terjemahan utama perlu menunjukkan baik pemusnahan maupun tindakan mengkhususkan objek bagi pemusnahan. Catatan kaki menjaga alternatif yang lebih ringkas dan menghindari hilangnya daya sakral-yudisial istilah Ibrani.
- issue: Nada pembelaan diri Saul
  choice: Tetapi aku sungguh telah menaati suara Yahweh
  alternative: Aku telah menaati suara Yahweh; Sesungguhnya aku menaati suara Yahweh
  rationale: Konteks memperlihatkan sanggahan defensif. 'Tetapi' dan 'sungguh' menyampaikan daya argumentatif klausa tanpa mengubah isi pengakuan Saul.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan idiom 'menaati suara', metafora 'menempuh jalan', nama Yahweh, dan muatan khusus istilah חרם.
