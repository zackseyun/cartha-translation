translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah geografis dijelaskan tanpa memakai istilah asing “wadi” dalam teks utama. Semua penanda catatan kaki ditempatkan pada unsur terkait dalam ayat.
