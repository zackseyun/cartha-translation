  text: Saul came to the city of Amalek and lay in wait in the wadi[a][b][c].
translation:
  language: id
  text: Saul tiba di kota Amalek[c], lalu menghadang di alur sungai[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyergap di alur sungai.” Kata kerja Ibrani di sini sulit dan juga dipahami sebagai “bertikai” atau “berjuang,” tetapi konteks lebih mendukung pengertian menghadang atau penyergapan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah alur sungai musiman atau lembah sempit yang mungkin kering kecuali pada musim hujan.
    reason: cultural_note
  - marker: c
    text: Atau “kota orang Amalek.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Kata בוא dapat berarti datang, pergi, masuk, atau tiba menurut sudut pandang. Dalam alur perjalanan menuju sasaran, “tiba” merupakan ungkapan naratif Indonesia yang alami.
- source_word: עַד
  choice: di
  rationale: Dengan verba gerak, עַד menandai batas atau tujuan yang dicapai. Gabungan “tiba di” menyampaikan maknanya secara idiomatis.
- source_word: עִיר עֲמָלֵק
  choice: kota Amalek
  rationale: Frasa konstruksi ini secara langsung berarti “kota Amalek”; Amalek juga dapat menunjuk kepada bangsa Amalek, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: וַיָּרֶב
  choice: bersiap menyergap
  rationale: Bentuk Ibrani ini sulit. Konteks operasi militer mendukung pengertian mengambil posisi untuk penyergapan, tetapi kemungkinan makna “bertikai” atau “berjuang” tetap dicatat.
- source_word: בַּנָּחַל
  choice: di dasar sungai
  rationale: נחל menunjuk kepada alur air musiman atau lembah sempit yang dapat kering di luar musim hujan. “Dasar sungai” mudah dipahami dalam bahasa Indonesia, dengan penjelasan geografis dalam catatan kaki.
