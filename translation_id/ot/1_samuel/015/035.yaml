id: 1SA.15.35
reference: 1 Samuel 15:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: id
  text: Samuel tidak melihat Saul lagi sampai hari kematiannya, karena Samuel berkabung atas Saul. Yahweh menyesal[a] karena telah mengangkat Saul menjadi raja atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merasa sedih.” Kata kerja Ibrani ini dapat memiliki beberapa arti menurut konteks, termasuk “mengurungkan niat”; di sini kata itu mengungkapkan dukacita atau penyesalan Yahweh karena telah mengangkat Saul menjadi raja.
    reason: Alternatif leksikal untuk נִחָם dan pelestarian rentang maknanya.
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: tidak melihat ... lagi
  rationale: Ungkapan יָסַף dengan infinitif dan penyangkalan berarti tidak melakukan sesuatu lagi; bentuk ini alami dalam bahasa Indonesia.
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: melihat Saul
  rationale: ראה pada dasarnya berarti 'melihat'. Dalam konteks ini tersirat perjumpaan pribadi, tetapi pilihan ini mempertahankan bentuk leksikal sumber.
- source_word: עַד יוֹם מוֹתוֹ
  choice: sampai hari kematiannya
  rationale: Ungkapan ini mempertahankan nada khidmat dan ambiguitas pronominal yang terdapat dalam teks Ibrani mengenai siapa yang dimaksud oleh akhiran orang ketiga tunggal.
- source_word: הִתְאַבֵּל ... אֶל שָׁאוּל
  choice: berkabung atas Saul
  rationale: Bentuk Hitpael dari אבל menyatakan perkabungan; 'atas Saul' secara alami menyampaikan objek dukacita Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נִחָם
  choice: menyesal
  rationale: Dalam konteks klausa bahwa Yahweh telah menjadikan Saul raja, kata ini mengungkapkan penyesalan atau dukacita ilahi; 'menyesal' mempertahankan daya personal dan ketegangan teologis teks.
- source_word: הִמְלִיךְ
  choice: telah mengangkat ... menjadi raja
  rationale: Bentuk Hifil dari מלך berarti menyebabkan seseorang menjadi raja. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: '''Raja atas Israel'' merupakan ungkapan Indonesia yang wajar untuk pemerintahan kerajaan.'
theological_decisions:
- issue: Bahasa antropopatik tentang Allah dalam נִחָם
  choice: menyesal
  alternative: merasa sedih; mengurungkan niat
  rationale: Teks secara langsung menyatakan bahwa Yahweh נִחָם. 'Menyesal' paling sesuai dengan klausa sebab yang mengikutinya dan tidak melunakkan atau menyelesaikan ketegangan teologis yang ada.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Pronomina pada 'hari kematiannya' sengaja tidak diperjelas karena teks Ibrani memakai akhiran orang ketiga tunggal yang secara bentuk tidak menyebut nama acuannya.
