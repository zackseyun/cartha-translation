source:
  edition: WLC
  text: וַ/יִּקַּ֨ח הָ/עָ֧ם מֵ/הַ/שָּׁלָ֛ל צֹ֥אן וּ/בָקָ֖ר רֵאשִׁ֣ית הַ/חֵ֑רֶם לִ/זְבֹּ֛חַ לַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/גִּלְגָּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: id
  text: Namun rakyat mengambil dari hasil jarahan itu domba dan sapi, yaitu yang terbaik dari apa yang telah dikhususkan untuk dimusnahkan,[a] untuk dipersembahkan sebagai kurban kepada TUHAN, Allahmu, di Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang pertama/terutama dari apa yang dikhususkan untuk dimusnahkan”; maksudnya ialah hewan-hewan pilihan yang berada di bawah ketetapan pemusnahan dan tidak boleh disimpan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Namun ... mengambil
  rationale: Bentuk wayyiqtol meneruskan narasi, tetapi dalam konteks jawaban Saul berfungsi kontras terhadap pernyataan sebelumnya; 'Namun' mengungkapkan hubungan wacana itu tanpa mengubah tindakan dasar 'mengambil'.
- source_word: הָעָם
  choice: rakyat
  rationale: עם secara harfiah berarti 'rakyat/orang-orang'. Dalam konteks ini yang dimaksud ialah pasukan Saul, tetapi 'rakyat' mempertahankan ungkapan Ibrani dan upaya Saul mengalihkan tanggung jawab kepada mereka.
- source_word: מֵהַשָּׁלָל
  choice: dari hasil jarahan itu
  rationale: שׁלל menunjuk pada barang atau ternak rampasan perang. 'Hasil jarahan' alami dalam bahasa Indonesia modern dan artikel Ibrani tercermin melalui 'itu'.
- source_word: צֹאן וּבָקָר
  choice: domba dan sapi
  rationale: Pasangan ini menyebut ternak kecil dan ternak besar secara konkret; pilihan ini lebih langsung bagi pembaca umum daripada 'kawanan ternak kecil dan besar'.
- source_word: רֵאשִׁית
  choice: yang terbaik
  rationale: Walaupun dapat berarti 'yang pertama' atau 'bagian pertama', dalam konteks ternak rampasan kata ini menunjuk pada bagian utama atau pilihan.
- source_word: הַחֵרֶם
  choice: segala sesuatu yang telah dikhususkan untuk dimusnahkan
  rationale: חֵרֶם merujuk pada orang atau benda yang ditempatkan di bawah ketetapan khusus bagi Allah yang menuntut pemusnahan. Ungkapan ini mempertahankan bobot istilah tanpa memakai jargon yang kurang jelas.
- source_word: לִזְבֹּחַ
  choice: untuk dipersembahkan sebagai kurban
  rationale: Infinitif menyatakan tujuan. Bentuk pasif ini alami setelah penyebutan hewan dan menjelaskan bahwa hewan-hewan itu hendak dijadikan kurban.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Nama ilahi YHWH diterjemahkan dengan konvensi Indonesia 'TUHAN' dalam huruf kapital.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal dipertahankan; Saul berkata kepada Samuel 'Allahmu', bukan 'Allah kita', sehingga kemungkinan nuansa jarak tidak dihapus.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Preposisi tempat ב diterjemahkan secara wajar sebagai 'di'.
theological_decisions:
- issue: Makna חֵרֶם dalam konteks perang
  choice: segala sesuatu yang telah dikhususkan untuk dimusnahkan
  alternative: segala sesuatu yang dikhususkan; segala sesuatu yang berada di bawah larangan pemusnahan
  rationale: Pilihan ini memperjelas bahwa ternak tersebut bukan rampasan biasa, melainkan termasuk dalam ketetapan yang menuntut pemusnahan, sambil mempertahankan ketegangan bahwa Saul bermaksud mempersembahkan sebagai kurban apa yang seharusnya dimusnahkan.
- issue: Penulisan nama יהוה
  choice: TUHAN
  alternative: YHWH; Yahweh
  rationale: Konvensi Alkitab bahasa Indonesia memakai 'TUHAN' untuk nama ilahi, membedakannya dari gelar 'Tuhan'.
- issue: Ungkapan אֱלֹהֶיךָ
  choice: Allahmu
  alternative: Allah kita
  rationale: Bentuk orang kedua tunggal dalam teks sumber dipertahankan dan tidak dinormalkan secara teologis menjadi bentuk inklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dibuat alami tanpa menghilangkan upaya Saul mengalihkan kesalahan kepada rakyat, tujuan pengurbanan, atau ketegangan dalam istilah חֵרֶם.
