  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל הֶ֚רֶף וְ/אַגִּ֣ידָה לְּ/ךָ֔ אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֵלַ֖/י הַ/לָּ֑יְלָה ו/יאמרו ל֖/וֹ דַּבֵּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: id
  text: Lalu Samuel berkata kepada Saul, “Berhentilah! Aku akan memberitahukan kepadamu apa yang Yahweh firmankan kepadaku tadi malam.” Saul[a] berkata kepadanya, “Katakanlah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk tertulis dalam bahasa Ibrani berbunyi “mereka berkata kepadanya”; konteks menunjukkan bahwa yang berbicara adalah Saul seorang diri, sehingga maksudnya ialah “ia berkata kepadanya.”
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: Berhentilah!
  rationale: Imperatif רפה di sini merupakan perintah tajam agar Saul berhenti berbicara atau membela diri. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nada teguran.
- source_word: וְאַגִּידָה לְּךָ
  choice: Aku akan memberitahukan kepadamu
  rationale: Bentuk hiphil נגד berarti menyatakan atau memberitahukan. Terjemahan ini menyampaikan maksud Samuel secara alami setelah perintah sebelumnya.
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: apa yang ... firmankan
  rationale: Konstruksi ini memperkenalkan isi perkataan ilahi. 'Apa yang ... firmankan' alami dalam bahasa Indonesia; 'berfirman' dipakai karena subjeknya Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הַלָּיְלָה
  choice: tadi malam
  rationale: Dengan verba perfektif yang mendahuluinya, ungkapan waktu ini menunjuk pada malam yang baru berlalu dari sudut pandang narasi.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Saul berkata kepadanya
  rationale: Bentuk tertulis Ibrani bersifat jamak, tetapi konteks menuntut Saul sebagai penutur tunggal. Penyebutan nama memperjelas rujukan pronomina dalam bahasa Indonesia, sementara catatan kaki mempertahankan kesaksian bentuk tertulis.
- source_word: דַּבֵּר
  choice: Katakanlah
  rationale: Imperatif singkat ini mempersilakan Samuel menyampaikan pesannya. 'Katakanlah' lebih wajar dalam dialog bahasa Indonesia daripada 'Berbicaralah' dan tetap mempertahankan keringkasannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama pribadi dalam teks sumber tanpa menggantinya dengan gelar atau mengimpor penafsiran denominasi tertentu.
- issue: Ketidaksesuaian bentuk jamak וַיֹּאמְרוּ dengan konteks
  choice: Diterjemahkan secara tunggal dengan subjek Saul dan diberi catatan kaki
  alternative: Menerjemahkan secara harfiah 'mereka berkata kepadanya'
  rationale: Konteks dialog hanya menyediakan Saul sebagai penjawab Samuel. Terjemahan tunggal menghasilkan makna yang koheren, sedangkan catatan kaki menjaga transparansi mengenai bentuk tertulis Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Teguran Samuel dibuat tegas, sedangkan jawaban Saul tetap singkat sesuai bentuk Ibrani. Penanda catatan kaki ditempatkan pada nama Saul, yaitu titik yang terkait langsung dengan pembacaan tunggal terhadap bentuk tertulis jamak.
