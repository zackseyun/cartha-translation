translation:
  language: id
  text: Kemudian Saul mengalahkan orang Amalek[a] dari Hawila sampai ke jalan menuju Syur, yang berhadapan dengan Mesir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Amalek”; teks Ibrani memakai “Amalek,” nama leluhur yang digunakan secara kolektif untuk menyebut bangsanya.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang di sebelah timur Mesir” atau “yang di depan Mesir”; ungkapan Ibrani ini dapat menunjukkan tempat yang menghadap atau berhadapan dengan Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: memukul
  rationale: Kata kerja נכה pada dasarnya berarti memukul atau menghantam dan dalam konteks perang dapat berarti menyerang atau mengalahkan. 'Memukul' mempertahankan daya konkret verba tanpa memastikan lebih daripada yang dinyatakan klausa ini.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama tunggal leluhur dipakai secara kolektif untuk bangsa Amalek. Bentuk 'Amalek' paling dekat dengan teks Ibrani dan ambiguitas kolektifnya dijelaskan dalam catatan kaki.
- source_word: מֵחֲוִילָה
  choice: mulai dari Hawila
  rationale: Preposisi מִן menandai titik awal rentang geografis. 'Mulai dari Hawila' mengungkapkan fungsi ini secara alami dalam bahasa Indonesia.
- source_word: בּוֹאֲךָ שׁוּר
  choice: sampai ke arah Syur
  rationale: Ungkapan geografis idiomatis בּוֹאֲךָ berarti 'ketika orang pergi menuju' atau 'ke arah'. Dalam konstruksi rentang dari Hawila, 'sampai ke arah Syur' menyampaikan batas atau arah tujuan secara wajar.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: yang berhadapan dengan Mesir
  rationale: Ungkapan עַל־פְּנֵי dapat menunjuk lokasi di depan, menghadap, atau berseberangan dengan suatu tempat. 'Berhadapan dengan Mesir' mempertahankan keluasan makna tanpa menetapkan arah mata angin.
