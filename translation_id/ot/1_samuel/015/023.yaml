  terminology: ‘Pemberontakan’, ‘keras kepala’, ‘kejahatan’, ‘berhala rumah tangga’, ‘firman Yahweh’, dan ‘raja’ sesuai konteks. Catatan tentang terafim berguna dan tidak perlu mengandaikan rincian historis di luar teks.
