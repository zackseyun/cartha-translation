source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: id
  text: Sebab pemberontakan sama seperti dosa tenung[a], dan sikap keras kepala sama seperti kejahatan dan berhala rumah tangga[b]. Karena engkau telah menolak firman Yahweh, Ia pun telah menolak engkau sebagai raja.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosa melakukan ramalan.” Kata Ibrani קֶסֶם mencakup praktik mencari pengetahuan tersembunyi melalui cara-cara yang terlarang.
    reason: lexical_alternative
  - marker: b
    text: Ibrani תְּרָפִים (terafim), yaitu patung atau benda pemujaan dalam rumah tangga.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “Ia pun telah menolak engkau sehingga tidak lagi menjadi raja.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi teguran Samuel sebelumnya, sedangkan יַעַן kemudian menandai alasan khusus bagi hukuman terhadap Saul.
- source_word: חַטַּאת קֶסֶם
  choice: dosa bertenung
  rationale: Menyampaikan konstruksi ‘dosa tenung’ dalam ungkapan Indonesia yang alami. ‘Bertenung’ mengacu pada upaya memperoleh pengetahuan tersembunyi melalui cara yang terlarang.
- source_word: מֶרִי
  choice: pemberontakan
  rationale: Menunjukkan pembangkangan terhadap otoritas, khususnya penolakan Saul untuk menaati perintah Yahweh.
- source_word: וְאָוֶן
  choice: kejahatan
  rationale: Dalam pasangan dengan terafim, kata ini menyatakan keburukan moral, bukan sekadar kesusahan atau kesia-siaan.
- source_word: וּתְרָפִים
  choice: berhala rumah tangga
  rationale: Terafim adalah patung atau benda pemujaan yang lazim disimpan dalam lingkungan rumah tangga; terjemahan maknawi lebih mudah dipahami pembaca umum.
- source_word: הַפְצַר
  choice: sikap keras kepala
  rationale: Menggambarkan desakan yang membandel atau keengganan untuk mengalah; frasa ini alami dalam bahasa Indonesia dan sesuai dengan perilaku Saul dalam konteks.
- source_word: יַעַן
  choice: Karena
  rationale: Menandai sebab langsung bagi keputusan Yahweh terhadap Saul.
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: engkau telah menolak firman Yahweh
  rationale: Mempertahankan arti מָאַס serta pengulangan retoris kata ‘menolak’ pada klausa berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: Ia pun telah menolak engkau sebagai raja
  rationale: Mempertahankan pengulangan verba מָאַס dan menghasilkan bahasa Indonesia yang wajar, sambil mencatat nuansa preposisi מִן dalam catatan kaki.
theological_decisions:
- issue: Struktur perbandingan pada dua bagian pertama ayat
  choice: Pemberontakan disamakan dengan dosa bertenung, dan sikap keras kepala disamakan dengan kejahatan serta berhala rumah tangga.
  alternative: Pemberontakan adalah dosa tenung, dan sikap keras kepala adalah kejahatan serta terafim.
  rationale: Bahasa Ibrani tidak memakai kata eksplisit untuk ‘sama dengan’, tetapi paralelismenya mendukung hubungan perbandingan atau penyamaan pada kedua bagian. Terjemahan ini mempertahankan daya retoris tanpa memaksakan identitas ontologis yang lebih tegas daripada konteks.
- issue: Makna penolakan Saul מִמֶּלֶךְ
  choice: menolak engkau sebagai raja
  alternative: menolak engkau sehingga tidak lagi menjadi raja
  rationale: Ungkapan Ibrani dapat menyoroti penolakan Saul dari kedudukan rajanya. Teks utama mempertahankan rumusan yang lebih padat dan tidak menentukan secara berlebihan waktu pelaksanaan pencopotannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Engkau’ dipakai karena Samuel berbicara langsung kepada Saul. Paralelisme dan pengulangan ‘menolak’ dipertahankan untuk menjaga kekuatan retoris teks Ibrani.
