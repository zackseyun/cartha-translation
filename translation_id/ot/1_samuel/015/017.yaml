  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: id
  text: Lalu Samuel berkata[a], “Bukankah sekalipun engkau kecil dalam pandanganmu sendiri, engkau adalah kepala suku-suku Israel? Dan Yahweh telah mengurapi engkau menjadi raja atas Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Meskipun engkau kecil dalam pandanganmu sendiri.” Susunan bahasa Ibrani dapat dipahami dengan nuansa yang sedikit berbeda, tetapi maksudnya ialah bahwa Saul memandang dirinya kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “bukankah” menyampaikan daya tersebut secara alami dalam bahasa Indonesia.
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: sekalipun engkau kecil dalam pandanganmu sendiri
  rationale: Terjemahan ini mempertahankan nuansa konsesif serta idiom Ibrani tentang penilaian Saul terhadap dirinya sendiri, tanpa membatasi maknanya hanya pada kerendahan hati atau status sosial.
- source_word: קָטֹן
  choice: kecil
  rationale: “Kecil” mempertahankan metafora sumber mengenai kedudukan atau arti penting yang rendah dan tidak menafsirkannya secara berlebihan sebagai “tidak berarti”.
- source_word: בְּעֵינֶיךָ
  choice: dalam pandanganmu sendiri
  rationale: Ungkapan ini menyampaikan idiom Ibrani secara alami sebagai penilaian seseorang terhadap dirinya sendiri.
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: kepala suku-suku Israel
  rationale: “Kepala” mempertahankan metafora konkret רֹאשׁ sekaligus tetap dapat dipahami sebagai kedudukan pemimpin.
- source_word: וַיִּמְשָׁחֲךָ
  choice: telah mengurapi engkau
  rationale: Kata kerja משׁח secara khusus menunjuk pada tindakan pengurapan dan mempertahankan makna ritual serta kerajaan yang akan hilang jika diterjemahkan sekadar “mengangkat”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: menjadi raja atas Israel
  rationale: Bentuk ini menyatakan hasil atau tujuan pengurapan dengan jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan anak kalimat אִם קָטֹן dengan pertanyaan utama
  choice: sekalipun engkau kecil dalam pandanganmu sendiri
  alternative: meskipun engkau kecil dalam pandanganmu sendiri; ketika engkau kecil dalam pandanganmu sendiri
  rationale: Konstruksinya dapat dipahami dengan nuansa konsesif yang sedikit berbeda. Teks utama memakai “sekalipun”, sementara catatan mempertahankan alternatif “meskipun”; bacaan temporal tidak dipilih karena lebih mempersempit hubungan sintaksis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipakai untuk tuturan langsung Samuel kepada Saul. Metafora “kecil” dan “kepala” dipertahankan karena jelas dalam konteks dan mencerminkan kontras dalam teks Ibrani.
