  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: id
  text: Lalu mengapa engkau tidak menaati suara Yahweh, tetapi malah menyambar jarahan[a] dan melakukan apa yang jahat di mata Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menerkam jarahan” atau “menyerbu jarahan”; kata kerja Ibrani ini menyiratkan gerakan cepat dan penuh ketamakan menuju barang rampasan perang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: Lalu, mengapa
  rationale: Kata penghubung וְ mengaitkan pertanyaan ini dengan teguran sebelumnya; “lalu” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: menaati suara
  rationale: Dalam konteks perintah, idiom שׁמע בקול menyatakan ketaatan, bukan sekadar mendengar; “suara” mempertahankan gambaran konkret bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וַתַּעַט אֶל
  choice: malah menerkam
  rationale: Kata kerja ini menggambarkan gerakan yang cepat dan penuh nafsu ke arah hasil rampasan. “Malah” menonjolkan pertentangan dengan ketaatan yang seharusnya, sedangkan “menerkam” mempertahankan daya ungkap kata tersebut.
- source_word: הַשָּׁלָל
  choice: jarahan
  rationale: “Jarahan” adalah istilah Indonesia yang wajar untuk barang hasil rampasan perang dalam konteks ini.
- source_word: וַתַּעַשׂ הָרַע
  choice: melakukan apa yang jahat
  rationale: Ungkapan ini menyatakan tindakan yang dinilai jahat; bentuk ini alami dalam bahasa Indonesia dan mencerminkan pemakaian kata sandang pada הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora evaluatif Ibrani dan tetap jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada teguran yang tegas. Kata “engkau” dipakai karena Samuel berbicara langsung kepada Saul dalam konteks narasi yang khidmat. Penanda catatan kaki ditempatkan sesudah frasa yang memang dijelaskannya.
