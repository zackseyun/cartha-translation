  source_fidelity: 'Terjemahan secara umum mengikuti struktur dan kontras teks Ibrani dengan baik: Saul dan rakyat menyelamatkan Agag serta ternak/barang yang dinilai baik, tetapi memusnahkan yang dipandang rendah. Namun, "hewan-hewan pilihan" untuk הַמִּשְׁנִים terlalu menafsirkan istilah yang maknanya tidak pasti, khususnya sesudah frasa "yang terbaik dari". Selain itu, "semuanya" dapat secara kurang tepat mencakup Agag, sedangkan akhiran jamak Ibrani terutama merujuk pada barang/ternak yang telah disebutkan.'
  naturalness: Bahasanya baku, jelas, dan alami. "Kawanan domba dan kawanan sapi" dapat dipadatkan menjadi "domba dan sapi" tanpa kehilangan makna. Penggunaan "mishnim" dengan catatan penjelas merupakan cara yang aman untuk mempertahankan ketidakpastian leksikal dalam teks utama.
  terminology: '"Menyerahkan ... untuk dimusnahkan" merupakan padanan yang layak bagi חרם dalam konteks ini dan dipertahankan secara konsisten. Nama Saul dan Agag serta "domba-domba jantan" sudah tepat. Istilah Ibrani yang sulit, מִשְׁנִים, sebaiknya tidak diubah menjadi "pilihan" tanpa penanda ketidakpastian.'
