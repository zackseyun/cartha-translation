  text: וַ/יַּחְמֹל֩ שָׁא֨וּל וְ/הָ/עָ֜ם עַל אֲגָ֗ג וְ/עַל מֵיטַ֣ב הַ/צֹּאן֩ וְ/הַ/בָּקָ֨ר וְ/הַ/מִּשְׁנִ֤ים וְ/עַל הַ/כָּרִים֙ וְ/עַל כָּל הַ/טּ֔וֹב וְ/לֹ֥א אָב֖וּ הַחֲרִימָ֑/ם וְ/כָל הַ/מְּלָאכָ֛ה נְמִבְזָ֥ה וְ/נָמֵ֖ס אֹתָ֥/הּ הֶחֱרִֽימוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: id
  text: Namun, Saul dan rakyat membiarkan Agag hidup, juga yang terbaik dari domba dan sapi, hewan-hewan mishnim[a], domba-domba jantan, serta segala sesuatu yang baik. Mereka tidak mau menyerahkan barang-barang itu untuk dimusnahkan[b]. Sebaliknya, segala sesuatu yang dianggap hina dan tidak berharga mereka serahkan untuk dimusnahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani mishnim sulit dipastikan artinya. Kemungkinan maknanya mencakup hewan-hewan gemuk, hewan-hewan unggul, atau hewan-hewan dari kelompok atau kelahiran kedua.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai merupakan istilah teknis untuk menempatkan seseorang atau sesuatu di bawah ketetapan untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: membiarkan ... hidup
  rationale: Dalam konteks ini, kata kerja tersebut menunjuk pada tindakan tidak melaksanakan pemusnahan yang diperintahkan. Ungkapan ini menyatakan akibat praktisnya tanpa membatasi makna pada perasaan iba.
- source_word: מֵיטַב
  choice: yang terbaik dari
  rationale: Bentuk konstruksi ini menunjuk pada bagian yang dinilai paling baik atau paling unggul dari ternak yang disebutkan.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kawanan domba dan kawanan sapi
  rationale: Kedua istilah menunjuk pada dua kelompok ternak dan dibedakan secara alami dalam bahasa Indonesia.
- source_word: הַמִּשְׁנִים
  choice: hewan-hewan pilihan
  rationale: Istilah Ibrani ini langka dan maknanya tidak pasti. Terjemahan utama yang cukup umum dan sesuai dengan daftar ternak dipakai tanpa menetapkan secara pasti jenis atau umur hewannya; ketidakpastian dijelaskan dalam catatan kaki.
- source_word: הַכָּרִים
  choice: domba-domba jantan
  rationale: Istilah ini lazim menunjuk pada domba jantan, meskipun dalam konteks tertentu dapat mencakup domba jantan muda.
- source_word: לֹא אָבוּ
  choice: mereka tidak mau
  rationale: Kata kerja ini menyatakan ketidakmauan atau penolakan, sehingga menampilkan unsur kesengajaan dalam tindakan mereka.
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: menyerahkan ... untuk dimusnahkan
  rationale: Ungkapan ini mempertahankan baik gagasan penyerahan di bawah ketetapan khusus maupun hasil berupa pemusnahan, tanpa memakai jargon yang tidak lazim.
- source_word: כָל הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: segala sesuatu yang dianggap hina dan tidak berharga
  rationale: Dalam konteks rampasan, מְלָאכָה menunjuk secara kolektif pada benda atau harta. Kedua sifat berikutnya menyatakan bahwa benda-benda itu dipandang rendah dan tidak bernilai.
theological_decisions:
- issue: Makna teknis חרם dalam konteks perang
  choice: menyerahkan ... untuk dimusnahkan
  alternative: menumpas sama sekali; menempatkan di bawah larangan pemusnahan
  rationale: Pilihan ini tidak melunakkan kekerasan tindakan tersebut menjadi sekadar penyitaan, tetapi juga tidak menghilangkan unsur bahwa objek itu ditempatkan di bawah ketetapan khusus untuk dimusnahkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada khidmat. Pengulangan pada bagian akhir dipertahankan untuk menonjolkan kontras antara yang bernilai dan yang dianggap tidak berharga. Ketidakpastian הַמִּשְׁנִים tidak diselesaikan secara dogmatis, melainkan ditandai dengan catatan kaki.
