  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: id
  text: Sekarang, ampunilah kiranya dosaku[a] dan kembalilah bersamaku, supaya aku dapat bersujud[b] kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibraninya berarti “angkatlah dosaku”; dalam konteks ini, ungkapan itu berarti “ampunilah dosaku”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “supaya aku dapat menyembah Yahweh”; kata kerja Ibraninya secara harfiah menunjuk pada tindakan membungkuk atau bersujud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Membuka permohonan langsung Saul sebagai tanggapan atas teguran Samuel; unsur penghubung וְ tidak perlu dinyatakan tersendiri dalam bahasa Indonesia alami.
- source_word: שָׂא נָא
  choice: ampunilah kiranya
  rationale: נָשָׂא secara harfiah berarti mengangkat atau menanggung, tetapi bersama חַטָּאת merupakan ungkapan untuk mengampuni dosa. 'Kiranya' menyampaikan nuansa permohonan נָא dalam ragam yang bermartabat.
- source_word: אֶת חַטָּאתִי
  choice: dosaku
  rationale: Dalam pengakuan Saul, חַטָּאתִי jelas menunjuk pada dosanya, bukan persembahan penghapus dosa.
- source_word: וְשׁוּב עִמִּי
  choice: dan kembalilah bersamaku
  rationale: Mempertahankan arti dasar שׁוּב, yaitu kembali, serta permintaan Saul agar Samuel menyertainya.
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: supaya aku dapat sujud menyembah
  rationale: Bentuk verba ini menggambarkan tindakan membungkuk atau bersujud dalam penghormatan. 'Sujud menyembah' mempertahankan unsur jasmani sekaligus fungsi ibadahnya dalam konteks ini; 'supaya' menyatakan hubungan tujuan setelah imperatif.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai arah atau sasaran tindakan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama diri ilahi dan tidak mengubahnya menjadi gelar.
- issue: Cakupan makna וְאֶשְׁתַּחֲוֶה
  choice: sujud menyembah
  alternative: menyembah; bersujud
  rationale: Pilihan ini menjaga ketegangan antara tindakan fisik bersujud dan makna ibadah yang muncul karena Yahweh menjadi sasarannya, tanpa mereduksinya hanya pada salah satu sisi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ampunilah kiranya' mempertahankan nada permohonan yang mendesak namun hormat; 'sujud menyembah' mudah dipahami sekaligus dekat dengan citra konkret teks Ibrani.
