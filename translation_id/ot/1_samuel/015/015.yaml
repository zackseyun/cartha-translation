  text: וַ/יֹּ֨אמֶר שָׁא֜וּל מֵ/עֲמָלֵקִ֣י הֱבִיא֗וּ/ם אֲשֶׁ֨ר חָמַ֤ל הָ/עָם֙ עַל מֵיטַ֤ב הַ/צֹּאן֙ וְ/הַ/בָּקָ֔ר לְמַ֥עַן זְבֹ֖חַ לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/אֶת הַ/יּוֹתֵ֖ר הֶחֱרַֽמְנוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: id
  text: Lalu Saul berkata, “Mereka membawanya dari orang Amalek, sebab rakyat menyisakan yang terbaik dari kambing domba dan sapi untuk mempersembahkannya sebagai kurban kepada Yahweh, Allahmu. Tetapi selebihnya kami khususkan untuk dimusnahkan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kami musnahkan sama sekali.” Kata Ibrani yang dipakai adalah bentuk dari חָרַם, istilah khusus untuk menyerahkan sesuatu kepada pemusnahan di bawah larangan ilahi.
    reason: Menjelaskan makna teknis חרם serta alternatif terjemahan yang menekankan pelaksanaan pemusnahan.
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: Mereka membawanya
  rationale: Bentuk Hifil dari בוא dengan sufiks objek jamak merujuk kepada hewan-hewan yang dibawa; bahasa Indonesia lazim memakai pronomina objek “-nya” tanpa membedakan jumlah.
- source_word: מֵעֲמָלֵקִי
  choice: dari orang Amalek
  rationale: Bentuk gentilik ini menunjuk kepada kelompok bangsa Amalek, bukan terutama wilayahnya.
- source_word: חָמַל ... עַל
  choice: menyisakan
  rationale: Dalam konteks perintah pemusnahan, ungkapan ini berarti tidak memusnahkan hewan-hewan tersebut. “Menyisakan” menyampaikan tindakan konkretnya secara alami tanpa menekankan emosi belas kasihan.
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: ternak kambing domba dan sapi yang terbaik
  rationale: מֵיטַב menunjukkan bagian pilihan atau terbaik; צֹאן mencakup ternak kecil, terutama kambing dan domba, sedangkan בָּקָר menunjuk sapi.
- source_word: לְמַעַן זְבֹחַ
  choice: untuk mempersembahkannya sebagai kurban
  rationale: לְמַעַן menyatakan tujuan. Objek kurban tersirat dalam bahasa Ibrani dan dinyatakan melalui “-nya” agar hubungan dengan ternak yang disisakan jelas.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama ilahi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Sufiks orang kedua tunggal dipertahankan. Ucapan “Allahmu” kepada Samuel menjaga jarak retoris yang terdapat dalam perkataan Saul.
- source_word: הַיּוֹתֵר
  choice: selebihnya
  rationale: Kata ini menunjuk kepada semua yang tersisa di luar ternak terbaik yang tidak dimusnahkan.
- source_word: הֶחֱרַמְנוּ
  choice: kami khususkan untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם merupakan istilah teknis dalam konteks perang yang berarti menyerahkan sesuatu kepada kebinasaan di bawah larangan ilahi; pilihan ini mempertahankan unsur pengkhususan dan pemusnahan.
theological_decisions:
- issue: Makna חרם dalam konteks perang dan penghukuman
  choice: kami khususkan untuk dimusnahkan
  alternative: kami musnahkan sama sekali
  rationale: חרם bukan sekadar kata umum untuk membunuh atau menghancurkan, melainkan dapat menyatakan penyerahan sesuatu kepada pemusnahan berdasarkan ketetapan ilahi. Terjemahan utama mempertahankan nuansa teknis itu, sementara catatan kaki menjelaskan alternatif hasil tindakannya.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. Bentuk “Yahweh” mempertahankan fungsi nama perjanjian tersebut dan menghindari penggantiannya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Rakyat” mempertahankan cara Saul mengalihkan tanggung jawab kepada kelompok itu, sedangkan “Allahmu” sengaja tidak diubah menjadi “Allah kita” agar ketegangan retoris teks tetap terjaga.
