  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: id
  text: Lalu Samuel berkata kepadanya, “Pada hari ini Yahweh telah mengoyakkan kerajaan Israel darimu dan telah memberikannya kepada sesamamu[a], yang lebih baik daripada engkau[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rekanmu” atau “tetanggamu.”
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani “lebih baik daripada engkau” menerangkan orang yang kepadanya kerajaan itu diberikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: Lalu Samuel berkata kepadanya
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa. “Lalu” menyampaikan kelanjutan narasi secara alami tanpa memberi tekanan temporal yang berlebihan.
- source_word: קָרַע
  choice: telah mengoyakkan
  rationale: Kata kerja ini berarti merobek atau mengoyakkan dan sengaja menggemakan terkoyaknya ujung jubah Samuel pada ayat sebelumnya. Pilihan ini mempertahankan gambaran konkret tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: kerajaan Israel
  rationale: מַמְלְכוּת dapat menunjuk kepada kerajaan atau kekuasaan sebagai raja. Dalam konteks sesuatu yang dicabut dari Saul lalu diberikan kepada orang lain, “kerajaan Israel” merupakan padanan Indonesia yang alami sambil tetap mencakup wewenang kerajaan.
- source_word: מֵעָלֶיךָ
  choice: darimu
  rationale: Frasa ini menyatakan pemisahan kerajaan dari Saul. “Darimu” ringkas, alami, dan tidak menambahkan gambaran ‘dari tanganmu’ yang tidak terdapat dalam teks Ibrani.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini mempertahankan penekanan pada saat keputusan ilahi dinyatakan dan sesuai dengan ragam bahasa Alkitab yang tetap modern.
- source_word: וּנְתָנָהּ
  choice: dan memberikannya
  rationale: Pronomina objek feminin merujuk kembali kepada kerajaan. Bentuk perfektif mengikuti “telah mengoyakkan” dan menyajikan penyerahan itu sebagai keputusan yang sudah tetap.
- source_word: לְרֵעֲךָ
  choice: kepada sesamamu
  rationale: רֵעַ dapat berarti sesama, rekan, atau orang lain yang berkaitan dengan seseorang; konteks ini tidak mengharuskan makna sahabat dekat atau tetangga tempat tinggal.
- source_word: הַטּוֹב מִמֶּךָּ
  choice: yang lebih baik daripada engkau
  rationale: Adjektiva dengan מִן menyatakan perbandingan. Klausa relatif menjelaskan dengan wajar bahwa orang yang menerima kerajaan itulah yang lebih baik daripada Saul.
theological_decisions:
- issue: Apakah tindakan ilahi diterjemahkan sebagai sudah terlaksana atau masih akan terjadi
  choice: 'Bentuk selesai/dekretif: “telah mengoyakkan ... dan memberikannya”'
  alternative: 'Bentuk berorientasi masa depan: “akan mengoyakkan ... dan akan memberikannya”'
  rationale: Bentuk perfektif Ibrani dalam pernyataan penghukuman ini menyajikan pencabutan dan penyerahan kerajaan sebagai tindakan atau keputusan ilahi yang sudah pasti, meskipun perwujudan historisnya berlangsung kemudian. Terjemahan ini mempertahankan ketegangan antara ketetapan yang sudah dijatuhkan dan pelaksanaannya di masa depan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam ujaran langsung kepada raja karena sesuai dengan register teks, sedangkan metafora mengoyakkan dipertahankan agar kaitannya dengan tindakan simbolis pada ayat sebelumnya tetap terdengar.
