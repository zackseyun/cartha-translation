  text: Then the word of Yahweh came to Samuel[a], saying,
translation:
  language: id
  text: 'Kemudian firman Yahweh[a] datang kepada Samuel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְהִי
  choice: Kemudian ... datang
  rationale: Bentuk naratif ini menandai perkembangan berikutnya dalam cerita. Susunan ini wajar dalam bahasa Indonesia modern dan menghindari ungkapan kaku seperti “terjadilah”.
- source_word: דְּבַר
  choice: firman
  rationale: Dalam formula kenabian דְּבַר יְהוָה, “firman” merupakan padanan Indonesia yang lazim dan mempertahankan kaitannya dengan penyataan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל
  choice: kepada
  rationale: Kata depan ini menandai Samuel sebagai penerima firman; “kepada” adalah padanan Indonesia yang alami.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Nama pribadi ini mengikuti bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perkataan yang menyusul. “Demikian:” menyampaikan fungsi pengantar tersebut secara alami dan ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu, sedangkan catatan kaki memberi tahu pembaca tentang kebiasaan penerjemahan tradisional tanpa memasukkan pilihan denominasi tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Firman” mempertahankan corak formula kenabian, sedangkan “Kemudian ... datang” dan “demikian:” membuat susunan Ibrani terbaca alami tanpa menghilangkan urutan naratif atau fungsi pengantar ujaran.
