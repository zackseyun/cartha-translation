  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלָחֲ/ךָ֥ יְהוָ֖ה בְּ/דָ֑רֶךְ וַ/יֹּ֗אמֶר לֵ֣ךְ וְ/הַחֲרַמְתָּ֞ה אֶת הַֽ/חַטָּאִים֙ אֶת עֲמָלֵ֔ק וְ/נִלְחַמְתָּ֣ ב֔/וֹ עַ֥ד כַּלּוֹתָ֖/ם אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: id
  text: Yahweh mengutus engkau untuk suatu tugas dan berfirman, “Pergilah, khususkanlah orang-orang berdosa itu, yaitu orang-orang Amalek, untuk dimusnahkan[a]. Berperanglah melawan mereka sampai engkau membinasakan mereka seluruhnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tumpaslah sama sekali.” Kata Ibrani ini merujuk pada mengkhususkan sesuatu di bawah larangan untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ
  choice: mengutus engkau
  rationale: Bentuk naratif dari שׁלח berarti ‘mengutus’. ‘Mengutus engkau’ mempertahankan nuansa penugasan dan cocok dengan sapaan langsung Samuel kepada Saul.
- source_word: בְּדָרֶךְ
  choice: untuk menjalankan suatu tugas
  rationale: Secara harfiah berarti ‘di jalan/dalam perjalanan’, tetapi sesudah verba ‘mengutus’ frasa ini menunjuk pada tugas atau misi yang dipercayakan kepada Saul. Ungkapan ini alami dalam bahasa Indonesia tanpa mereduksinya menjadi perjalanan fisik.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif langsung dari הלך; ‘Pergilah’ merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: וְהַחֲרַמְתָּה
  choice: khususkanlah ... untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menunjuk pada penempatan sesuatu di bawah larangan khusus untuk dimusnahkan. Rumusan ini mempertahankan unsur pengkhususan dan pemusnahan, sedangkan catatan kaki menjelaskan istilah teknisnya.
- source_word: הַחַטָּאִים
  choice: orang-orang berdosa itu
  rationale: Kata ini dipakai secara substantival dan memberi penilaian moral terhadap Amalek. Terjemahan mempertahankan sebutan tersebut, bukan melunakkannya menjadi sekadar nama bangsa.
- source_word: אֶת עֲמָלֵק
  choice: yaitu orang Amalek
  rationale: ‘Amalek’ mengidentifikasi secara aposisional siapa ‘orang-orang berdosa itu’. Dalam bahasa Indonesia, ‘orang Amalek’ menyampaikan nama kolektif bangsa tersebut dengan jelas.
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: Berperanglah melawan mereka
  rationale: Pronomina Ibrani berbentuk tunggal karena merujuk pada Amalek sebagai satu kesatuan kolektif; bahasa Indonesia secara alami memakai ‘mereka’ untuk anggota bangsa itu.
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: sampai mereka habis binasa
  rationale: Akar כלה menyatakan bahwa mereka sampai pada kesudahan atau lenyap sama sekali. Ungkapan ini mempertahankan hasil total tanpa menambahkan cara pemusnahannya dan selaras dengan ketidaklangsungan konstruksi Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton, nama diri perjanjian Allah. ‘Yahweh’ mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna teknis חרם dalam perintah perang
  choice: khususkanlah ... untuk dimusnahkan
  alternative: tumpaslah sama sekali
  rationale: Pilihan utama mempertahankan ketegangan antara tindakan mengkhususkan di bawah larangan ilahi dan hasil berupa pemusnahan, tanpa memasukkan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Engkau’ dipakai karena konteksnya adalah sapaan langsung yang serius. Aposisi ‘yaitu orang Amalek’ mempertahankan hubungan antara sebutan moral dan nama bangsa. Tanda catatan kaki [a] ditempatkan tepat pada frasa yang dijelaskannya.
