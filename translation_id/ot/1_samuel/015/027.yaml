  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: id
  text: Ketika Samuel berpaling untuk pergi, Saul memegang erat ujung[a] jubah Samuel, lalu jubah itu koyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudut jubah Samuel” atau “kelim jubah Samuel”. Kata Ibrani yang dipakai dapat menunjuk pada bagian paling tepi dari pakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: berpaling
  rationale: Kata kerja סבב menyatakan Samuel berbalik atau berpaling sebagai persiapan untuk pergi; “berpaling” alami dalam konteks ini.
- source_word: לָלֶכֶת
  choice: untuk pergi
  rationale: Infinitif הלך menyatakan maksud Samuel untuk beranjak atau meninggalkan tempat itu; “untuk pergi” merupakan padanan langsung dan wajar.
- source_word: וַיַּחֲזֵק
  choice: memegang erat
  rationale: Bentuk Hifil dari חזק di sini berarti memegang dengan kuat. “Memegang erat” menyampaikan kekuatan tindakan tanpa menggunakan ungkapan yang terlalu keras.
- source_word: בִּכְנַף
  choice: ujung
  rationale: כָּנָף secara harfiah berarti “sayap” dan pada pakaian menunjuk pada bagian paling tepi, sudut, atau punca. “Ujung” adalah istilah Indonesia yang alami dan cukup luas.
- source_word: מְעִילוֹ
  choice: jubah Samuel
  rationale: מְעִיל adalah pakaian luar atau jubah. Nama “Samuel” dipakai untuk memperjelas pemilik jubah sesuai alur konteks, sebab pronomina posesif Indonesia dapat keliru dipahami sebagai merujuk kepada Saul sendiri.
- source_word: וַיִּקָּרַע
  choice: lalu jubah itu koyak
  rationale: Bentuk Nifal menyatakan bahwa pakaian itu menjadi koyak. Penyebutan kembali “jubah itu” membuat rujukan jelas, sedangkan “koyak” mempertahankan sifat pasif/intransitif peristiwanya.
theological_decisions:
- issue: Identitas pelaku yang memegang dan pemilik jubah
  choice: Saul memegang erat ujung jubah Samuel
  alternative: ia memegang erat ujung jubahnya
  rationale: Teks Ibrani memakai bentuk orang ketiga maskulin tanpa mengulang nama, tetapi konteks wacana mengidentifikasi Saul sebagai pelaku dan Samuel sebagai pemilik jubah. Nama-nama diperjelas agar pronomina “ia/jubahnya” dalam bahasa Indonesia tidak menimbulkan kesan bahwa Samuel memegang jubahnya sendiri atau bahwa Saul memegang jubah Saul.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kalimat mempertahankan urutan tindakan dalam bahasa Ibrani, sambil memperjelas para pelaku berdasarkan konteks naratif.
