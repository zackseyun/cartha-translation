id: 1SA.15.26
reference: 1 Samuel 15:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: id
  text: Lalu Samuel berkata kepada Saul, “Aku tidak akan kembali bersamamu, sebab engkau telah menolak firman Yahweh, dan Yahweh telah menolak engkau sebagai raja atas Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “Lalu” alami dalam narasi bahasa Indonesia modern.
- source_word: לֹא אָשׁוּב
  choice: Aku tidak akan kembali
  rationale: שׁוּב berarti kembali atau berbalik; konteksnya adalah penolakan Samuel untuk kembali menyertai Saul.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Padanan komitatif yang ringkas dan alami bagi עִם.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan penolakan Samuel dengan bahasa yang jelas dan bermartabat.
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: telah menolak / telah menolak
  rationale: Pengulangan verba “menolak” mempertahankan pengulangan akar מאס dan timbal balik yang disengaja dalam teks Ibrani.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר di sini menunjuk pada perkataan atau perintah yang disampaikan Yahweh; “firman” mempertahankan ungkapan alkitabiah yang lazim tanpa mempersempitnya hanya menjadi “perintah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מִהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: sebagai raja atas Israel
  rationale: Ungkapan ini menyatakan penolakan Saul dari kedudukan sebagai raja; “sebagai raja” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari menjadi raja”, sedangkan “atas Israel” mempertahankan עַל dan gagasan pemerintahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Pengulangan timbal balik akar מאס
  choice: Memakai “menolak” pada kedua klausa
  alternative: Memakai verba berbeda, misalnya “menghina” lalu “menolak”
  rationale: Pengulangan yang sama menegaskan hubungan terukur antara Saul yang menolak firman Yahweh dan Yahweh yang menolak Saul sebagai raja.
- issue: Cakupan דְּבַר יְהוָה
  choice: firman Yahweh
  alternative: perintah Yahweh; pesan Yahweh
  rationale: Konteks mencakup perintah ilahi, tetapi padanan yang lebih luas mempertahankan bentuk teks dan tidak menutup nuansa perkataan atau pesan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Aku” dan “engkau” sesuai dengan dialog naratif alkitabiah; susunan kalimat dibuat alami sambil mempertahankan kesejajaran dan pengulangan penting dalam teks Ibrani.
