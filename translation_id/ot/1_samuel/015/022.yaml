base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: id
  text: Samuel berkata, “Apakah TUHAN berkenan kepada kurban bakaran dan kurban sembelihan sama seperti ketika orang menaati suara TUHAN? Sesungguhnya, menaati lebih baik daripada kurban, dan mendengarkan lebih baik daripada lemak domba jantan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: berkenan
  rationale: Menyampaikan gagasan bahwa TUHAN menyukai atau bersukacita atas sesuatu, dengan ragam bahasa yang wajar dan bermartabat.
- source_word: עֹלוֹת וּזְבָחִים
  choice: kurban bakaran dan kurban sembelihan
  rationale: 'Membedakan dua istilah ritual Ibrani: persembahan yang dibakar seluruhnya dan kurban yang disembelih.'
- source_word: כִשְׁמֹעַ בְּקוֹל
  choice: sama seperti kepada ketaatan pada suara
  rationale: Dalam konteks ini, 'mendengar suara' mencakup tindakan menaati; bentuk ini mempertahankan gambaran 'suara TUHAN' sekaligus memperjelas maksudnya.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Berfungsi sebagai penanda penegasan yang menarik perhatian pada kesimpulan Samuel; 'Sesungguhnya' sesuai dengan register ayat yang khidmat.
- source_word: שְׁמֹעַ
  choice: menaati
  rationale: Infinitif absolut dari 'mendengar' dalam konteks teguran terhadap ketidaktaatan bermakna mendengar dengan patuh.
- source_word: לְהַקְשִׁיב
  choice: mendengarkan
  rationale: Mempertahankan paralelisme dengan 'menaati' dan menekankan perhatian yang sungguh-sungguh terhadap firman TUHAN.
- source_word: חֵלֶב אֵילִים
  choice: lemak domba jantan
  rationale: Terjemahan langsung dari unsur kurban yang dipandang bernilai dalam sistem persembahan Israel.
theological_decisions:
- issue: Perbandingan antara kurban dan ketaatan
  choice: sama seperti kepada ketaatan ... lebih baik daripada
  alternative: sama banyaknya dengan mendengar ... lebih baik daripada
  rationale: Teks tidak menolak kurban pada dirinya sendiri, tetapi menegaskan keutamaan ketaatan. Terjemahan mempertahankan ketegangan itu tanpa menyatakan bahwa seluruh ibadah kurban tidak berkenan kepada TUHAN.
- issue: Makna teologis שׁמע
  choice: menaati pada kemunculan pertama dan kedua, lalu mendengarkan dalam baris paralel
  alternative: mendengar pada semua kemunculan
  rationale: Konteks menuntut nuansa ketaatan, sementara variasi pada baris kedua mempertahankan permainan paralel antara mendengar dengan patuh dan memberi perhatian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi penerjemahan Indonesia. Struktur pertanyaan retoris dan paralelisme puitis dipertahankan.
