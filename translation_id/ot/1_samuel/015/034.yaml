  terminology: “Rama” dan “Gibea” sesuai ejaan Indonesia yang lazim. “Gibea Saul” mempertahankan bentuk nama tempat Ibrani; catatan kaki menyajikan alternatif genitif “Gibea milik Saul” tanpa menetapkannya sebagai satu-satunya analisis.
