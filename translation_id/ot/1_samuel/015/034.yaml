translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Sedangkan’ menandai peralihan kepada tindakan Saul tanpa menyiratkan pertentangan kuat. Nama tempat memakai ejaan Indonesia ‘Rama’ dan ‘Gibea’; bentuk ‘Gibea-Saul’ menjaga struktur nama dalam sumber.
