  text: Then Samuel went to Ramah[a], and Saul went up to his house in Gibeah of Saul.
translation:
  language: id
  text: Lalu Samuel pergi ke Rama, dan Saul naik ke rumahnya di Gibea Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Gibea milik Saul.” Bahasa Ibrani mempertahankan nama tempat itu dalam bentuk “Gibea Saul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur narasi dengan arti biasa ‘pergi’; padanan ini alami dan tepat dalam bahasa Indonesia.
- source_word: הָרָמָתָה
  choice: ke Rama
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Rama, yang secara alami diterjemahkan ‘ke Rama’.
- source_word: עָלָה
  choice: pulang
  rationale: Secara harfiah berarti ‘naik/pergi naik’, tetapi dalam konstruksi menuju rumah sendiri, bahasa Indonesia secara alami memakai ‘pulang’. Nuansa gerak naik dicatat dalam catatan kaki agar bukti sumber tetap terlihat.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: בַּיִת dengan sufiks orang ketiga tunggal maskulin berarti ‘rumahnya’; bentuk ini ringkas dan alami.
- source_word: גִּבְעַת שָׁאוּל
  choice: Gibea-Saul
  rationale: Rangkaian nama Ibrani dipertahankan sebagai nama tempat majemuk tanpa memutuskan secara berlebihan apakah hubungan genitifnya benar-benar menyatakan kepemilikan.
