base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: id
  text: Lalu Samuel berkata, “Bawalah Agag, raja Amalek, kepadaku.” Agag pun datang kepadanya dengan anggun[a]. Lalu Agag berkata, “Sungguh, kepahitan maut telah berlalu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani מַעֲדַנֹּת tidak pasti. Kata ini mungkin berarti “dengan anggun,” “dengan lembut,” atau menunjukkan sikap yang menyenangkan atau penuh keyakinan. Menurut penafsiran lain, kata ini berarti “dalam belenggu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: Bawalah
  rationale: Bentuk imperatif jamak Hifil dari נגשׁ memerintahkan para pengiring agar menghadapkan Agag kepada Samuel. “Bawalah” menyampaikan daya perintah itu secara alami.
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: Agag, raja Amalek
  rationale: Nama diri ditransliterasikan, sedangkan frasa konstruksi diterjemahkan sebagai aposisi yang mengidentifikasi kedudukannya.
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: datang kepadanya
  rationale: Walaupun הלך secara dasar berarti “pergi/berjalan”, sudut adegan dan perintah Samuel “kepadaku” membuat “datang kepadanya” lebih alami dalam bahasa Indonesia.
- source_word: מַעֲדַנֹּת
  choice: dengan langkah ringan
  rationale: Kata Ibrani yang hanya muncul di sini ini sulit dipastikan. Pilihan ini mempertahankan fungsi adverbial dan kemungkinan nuansa gerak yang santai, menyenangkan, atau penuh keyakinan, tanpa menjadikannya terlalu eksplisit; ketidakpastiannya dicatat dalam catatan kaki.
- source_word: אָכֵן
  choice: Sungguh
  rationale: Partikel ini menandai penegasan atau keyakinan Agag; “Sungguh” sesuai dengan ragam naratif yang bermartabat.
- source_word: סָר
  choice: telah berlalu
  rationale: Bentuk perfektum Qal dari סור berarti beralih, menyingkir, atau berlalu. Dalam bahasa Indonesia, “telah berlalu” secara alami menyatakan bahwa menurut Agag bahaya kematian sudah lewat.
- source_word: מַר הַמָּוֶת
  choice: kepahitan maut
  rationale: Ungkapan ini dipertahankan sebagai metafora yang padat dan tidak diparafrasakan menjadi sekadar “ancaman kematian”.
