  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Metafora “kepahitan maut” dipertahankan, sedangkan ketidakpastian kata מַעֲדַנֹּת tidak diselesaikan secara diam-diam tetapi ditandai pada frasa terkait.
