  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת פָּקַ֕דְתִּי אֵ֛ת אֲשֶׁר עָשָׂ֥ה עֲמָלֵ֖ק לְ/יִשְׂרָאֵ֑ל אֲשֶׁר שָׂ֥ם ל/וֹ֙ בַּ/דֶּ֔רֶךְ בַּ/עֲלֹת֖/וֹ מִ/מִּצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: id
  text: 'Beginilah firman Yahweh, Penguasa bala tentara: “Aku telah mengingat[a] apa yang dilakukan Amalek terhadap Israel, bagaimana ia menghadang Israel di jalan ketika Israel keluar dari Mesir.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah memperhitungkan,” atau, “Aku telah memperhatikan.” Kata Ibrani yang dipakai dapat berarti mengingat atau memperhatikan dengan maksud untuk bertindak, termasuk mendatangkan hukuman.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya dapat juga diterjemahkan, “bagaimana ia melawan Israel di jalan,” atau mungkin, “bagaimana ia menyergap Israel di jalan.” Israel diperlakukan sebagai satu kesatuan dalam bentuk tunggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Rumus penyampaian pesan ilahi yang baku; alami dalam bahasa Indonesia dan tetap mempertahankan bobot formal teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: צְבָאוֹת
  choice: Penguasa bala tentara
  rationale: Menyampaikan gagasan pasukan atau bala tentara dalam gelar ilahi tanpa membatasinya hanya pada tentara manusia.
- source_word: פָּקַדְתִּי
  choice: Aku telah mengingat
  rationale: Dalam konteks ini, verba פקד menunjuk pada ingatan yang disertai perhatian dan tindakan. Pilihan ini tidak lebih dahulu menyatakan penghukuman yang baru diperintahkan pada ayat berikutnya.
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: apa yang dilakukan Amalek terhadap Israel
  rationale: Terjemahan alami yang mempertahankan cakupan umum tindakan Amalek, sementara konteks menunjukkan bahwa tindakan itu bermusuhan.
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: bagaimana ia menghadang Israel di jalan
  rationale: Ungkapan Ibrani yang padat menggambarkan tindakan bermusuhan terhadap Israel dalam perjalanan. 'Menghadang' mempertahankan unsur perlawanan tanpa memastikan bahwa taktiknya adalah penyergapan.
- source_word: לוֹ ... בַּעֲלֹתוֹ
  choice: Israel ... ketika Israel keluar
  rationale: Teks Ibrani memakai pronomina maskulin tunggal untuk Israel sebagai kesatuan kolektif. Pengulangan nama menghindari ketaksaan pronomina yang tidak alami dalam bahasa Indonesia.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Padanan langsung; bersama verba עלה, ungkapan ini merujuk pada keluarnya Israel dari Mesir.
theological_decisions:
- issue: Gelar ilahi יְהוָה צְבָאוֹת
  choice: Yahweh, Penguasa bala tentara
  alternative: Yahweh Semesta Alam
  rationale: Pilihan utama mempertahankan citra צְבָאוֹת sebagai bala tentara atau pasukan dan tidak mengganti nama Yahweh dengan gelar. Kata 'Penguasa' membuat hubungan gelar itu wajar dalam bahasa Indonesia.
- issue: Hubungan antara ingatan ilahi dan penghukuman dalam פָּקַדְתִּי
  choice: Aku telah mengingat
  alternative: Aku telah memperhitungkan / Aku akan menghukum
  rationale: Verba ini dapat mencakup perhatian, ingatan yang menghasilkan tindakan, atau tindakan penghukuman. Terjemahan utama mempertahankan ketegangan itu dan membiarkan ayat berikutnya menyatakan penghukuman secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'Israel' dipilih sebagai pengganti pronomina tunggal Ibrani agar rujukannya jelas dan alami. 'Keluar dari Mesir' mengutamakan ungkapan Indonesia yang lazim untuk peristiwa eksodus daripada menerjemahkan idiom עלה secara harfiah sebagai 'naik dari Mesir'.
