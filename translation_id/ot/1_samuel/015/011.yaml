  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: id
  text: “Aku menyesal telah menjadikan Saul raja[a], sebab ia telah berbalik dan tidak lagi mengikuti Aku[b] serta tidak melaksanakan firman-Ku[c].” Lalu amarah Samuel menyala[d], dan ia berseru kepada Yahweh sepanjang malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku berdukacita karena telah menjadikan Saul raja” atau “Aku merasa sedih karena telah menjadikan Saul raja.” Kata Ibrani ini dapat mengungkapkan penyesalan atau dukacita.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia telah berbalik dari belakang-Ku,” suatu ungkapan untuk berhenti mengikuti Yahweh dan berpaling dari-Nya.
    reason: lexical_alternative
  - marker: c
    text: Atau, “tidak menggenapi perkataan-Ku” atau “tidak menaati firman-Ku.”
    reason: lexical_alternative
  - marker: d
    text: Ungkapan Ibraninya menggambarkan kemarahan yang menyala. Dalam konteks ini, sebagian orang memahaminya sebagai dukacita atau rasa sangat tidak senang.
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: Aku menyesal
  rationale: Bentuk Nifal dari נחם di sini menyatakan penyesalan dan dukacita ilahi atas pengangkatan Saul. “Aku menyesal” mempertahankan daya emosional dan evaluatif teks tanpa menyatakan bahwa Allah melakukan kesalahan moral.
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: telah menjadikan Saul raja
  rationale: Bentuk Hifil dari מלך menyatakan tindakan membuat atau menetapkan seseorang menjadi raja. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: שָׁב מֵאַחֲרַי
  choice: ia telah berbalik dari mengikuti Aku
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani tentang berbalik dari belakang seseorang, yakni berhenti mengikutinya dan meninggalkan kesetiaan kepadanya.
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: dan tidak melaksanakan firman-Ku
  rationale: הקים dengan objek “perkataan/firman” berarti menegakkan atau menggenapinya dengan tindakan. “Melaksanakan” menyampaikan bahwa Saul tidak melakukan apa yang Yahweh firmankan.
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: Lalu amarah Samuel menyala
  rationale: Ungkapan חרה ל secara leksikal menggambarkan kemarahan yang menyala. Susunan ini mempertahankan citra Ibrani sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: ia berseru kepada Yahweh
  rationale: זעק menunjuk pada seruan kuat dan mendesak, sering kali dalam kesusahan. “Berseru” menyampaikan intensitas tersebut dengan register yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: כָּל־הַלָּיְלָה
  choice: sepanjang malam
  rationale: Ungkapan ini secara alami menyatakan durasi selama seluruh malam dalam bahasa Indonesia.
theological_decisions:
- issue: Arti נִחַמְתִּי ketika diucapkan oleh Allah
  choice: Aku menyesal
  alternative: Aku berdukacita; Aku merasa sedih; Aku berubah hati
  rationale: Pilihan ini mempertahankan pernyataan kuat tentang tanggapan ilahi terhadap kegagalan Saul dan tidak menghapus ketegangan dengan ayat 29. Catatan kaki menjelaskan rentang maknanya tanpa mengisyaratkan bahwa Allah berbuat dosa atau melakukan kesalahan moral.
- issue: Tanggapan emosional Samuel dalam וַיִּחַר לִשְׁמוּאֵל
  choice: amarah Samuel menyala
  alternative: Samuel berdukacita; Samuel sangat tidak senang
  rationale: Makna leksikal idiom tersebut menunjuk pada kemarahan, sedangkan konteks dapat membuat sebagian pembaca memahami adanya dukacita atau kekecewaan mendalam. Teks utama mempertahankan makna leksikal dan catatan kaki menjaga alternatif kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pronomina yang merujuk kepada Allah memakai huruf kapital sesuai kebiasaan penulisan religius Indonesia. Citra Ibrani dipertahankan bila masih jelas dalam bahasa Indonesia, sedangkan kemungkinan makna lain ditempatkan dalam catatan kaki.
