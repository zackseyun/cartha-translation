translation_notes:
  register: Bahasa Indonesia baku yang modern dan lugas, dengan nada teguran retoris yang bermartabat. “Kambing domba” dipakai untuk mempertahankan keluasan makna צֹאן, bukan mengikuti penyempitan tradisional menjadi “domba” saja.
