base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: id
  text: Samuel berkata, “Seperti pedangmu telah membuat para perempuan kehilangan anak[a], demikian pula ibumu akan kehilangan anak di antara para perempuan.” Lalu Samuel mencincang Agag[b] di hadapan Yahweh di Gilgal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Seperti pedangmu telah membuat para perempuan berdukacita karena kehilangan anak, demikian pula ibumu akan berdukacita karena kehilangan anak di antara para perempuan.” Bahasa Ibrani memakai kata kerja yang sama dalam kedua klausa, sehingga menekankan pembalasan yang setimpal.
    reason: lexical_alternative
  - marker: b
    text: Atau “memotong-motong Agag.” Kata kerja Ibrani ini langka dan menggambarkan tindakan memotong dengan keras.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל
  choice: membuat perempuan-perempuan kehilangan anak / ibumu akan kehilangan anak
  rationale: Akar שׁכל menunjuk pada kehilangan anak dan dipakai dalam kedua klausa untuk menegaskan pembalasan yang setimpal. Pengulangan “kehilangan anak” mempertahankan kaitan verbal itu dalam bahasa Indonesia yang alami.
- source_word: חַרְבֶּךָ
  choice: pedangmu
  rationale: Terjemahan langsung yang secara wajar memungkinkan pedang menjadi metonimia bagi tindakan kekerasan Agag.
- source_word: מִנָּשִׁים
  choice: di antara perempuan-perempuan
  rationale: Preposisi מן dalam ungkapan ini paling alami dipahami sebagai “di antara,” yakni ibu Agag akan dikenal sebagai perempuan yang kehilangan anak di tengah para perempuan lainnya.
- source_word: וַיְשַׁסֵּף
  choice: mencincang
  rationale: Kata kerja yang langka dan keras ini dipahami sebagai memotong atau mencabik menjadi beberapa bagian. “Mencincang” mempertahankan daya ungkap kekerasannya tanpa memperhalus tindakan tersebut menjadi sekadar “membunuh.”
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menerjemahkan ungkapan kehadiran secara langsung dan alami serta mempertahankan nama ilahi yang terdapat dalam teks Ibrani.
- source_word: בַּגִּלְגָּל
  choice: di Gilgal
  rationale: Bentuk lokasi diterjemahkan secara idiomatis untuk tempat terjadinya tindakan.
theological_decisions:
- issue: Penggambaran eksekusi Agag yang dilakukan Samuel
  choice: Samuel secara pribadi “mencincang Agag.”
  alternative: Samuel memotong-motong Agag; Samuel membunuh Agag
  rationale: Subjek Ibrani secara tegas adalah Samuel, dan kata kerjanya lebih keras daripada sekadar “membunuh.” Terjemahan mempertahankan kekerasan teks tanpa menambahkan pembenaran teologis atau rincian yang tidak dinyatakan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama pribadi ilahi dan sejalan dengan lapisan konsultasi proyek.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan sengaja dipertahankan untuk mencerminkan kesejajaran dan pembalasan setimpal dalam bahasa Ibrani. Kekerasan tindakan tidak diperhalus, tetapi juga tidak diperhebat dengan rincian tambahan.
