revisions:
- from: Sekarang, pergilah dan seranglah Amalek,[a] lalu tumpaslah seluruh miliknya. Janganlah engkau menyayangkan dia, tetapi bunuhlah laki-laki maupun perempuan, anak kecil maupun bayi yang masih menyusu, sapi maupun kambing domba,[b] unta maupun keledai.
  to: Sekarang, pergilah dan seranglah Amalek, lalu tumpaslah[a] segala yang dimilikinya. Janganlah engkau berbelas kasihan kepadanya. Bunuhlah baik laki-laki maupun perempuan, anak kecil maupun bayi yang masih menyusu, lembu maupun domba[b], unta maupun keledai.
  rationale: 'Revisi mempertahankan bentuk tunggal kolektif Amalek dan cakupan menyeluruh daftar kategori, sambil memperbaiki padanan yang kurang tepat untuk חמל dan שׁוֹר. Catatan kaki diselaraskan dengan jangkar yang tepat: [a] pada istilah חרם dan [b] pada ‘domba’; [b] juga menjelaskan bentuk tunggal kolektif yang dimulai dengan ‘Amalek’ dalam ayat ini. Kekerasan historis teks dipertahankan tanpa penambahan penafsiran doktrinal.'
