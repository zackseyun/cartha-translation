review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk memperjelas larangan חמל sebagai larangan berbelas kasihan/menaruh iba, bukan sekadar ‘menyayangkan,’ serta untuk menempatkan jangkar catatan kaki pada kata yang benar-benar dijelaskan. ‘Lembu’ lebih tepat daripada ‘sapi’ untuk שׁוֹר, yang tidak dibatasi pada sapi betina.
  naturalness: Teks revisi tetap baku dan lugas. ‘Segala yang dimilikinya’ lebih alami daripada ‘seluruh miliknya’ ketika rujukannya adalah entitas kolektif, dan ‘baik ... maupun ...’ menyampaikan cakupan pasangan-pasangan itu dengan idiom Indonesia yang wajar.
  terminology: ‘Tumpaslah’ dapat dipertahankan sebagai padanan utama חרם bila nuansa pengabdian untuk kebinasaan dijelaskan dalam catatan. ‘Domba’ dipakai untuk שֶׂה, dengan catatan yang mempertahankan kemungkinan ‘kambing’; terjemahan utama tidak boleh memaksakan kedua hewan sekaligus.
  issues:
  - severity: medium
    issue: ‘Menyayangkan dia’ kurang tepat untuk וְלֹא תַחְמֹל עָלָיו.
    rationale: Dalam konteks ini חמל melarang belas kasihan yang menyebabkan pihak itu dibiarkan; ‘menyayangkan’ lazim berarti menyesalkan atau merasa sayang atas kehilangan dan kurang langsung menyatakan unsur belas kasihan.
  - severity: low
    issue: ‘Sapi’ terlalu sempit bagi שׁוֹר.
    rationale: שׁוֹר menunjuk hewan bovin/ternak lembu, tidak khusus sapi betina. ‘Lembu’ lebih netral dan lazim dalam register Alkitab Indonesia.
  - severity: medium
    issue: Jangkar catatan kaki tidak sesuai dengan isi catatan.
    rationale: Catatan tentang חרם harus ditambatkan pada ‘tumpaslah’, bukan ‘Amalek’. Catatan tentang bentuk tunggal kolektif harus ditambatkan pada ‘Amalek’; penjelasan kemungkinan makna שֶׂה perlu jangkar tersendiri pada ‘domba’.
