reference: 1 Samuel 15:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַתָּה֩ לֵ֨ךְ וְ/הִכִּֽיתָ֜ה אֶת עֲמָלֵ֗ק וְ/הַֽחֲרַמְתֶּם֙ אֶת כָּל אֲשֶׁר ל֔/וֹ וְ/לֹ֥א תַחְמֹ֖ל עָלָ֑י/ו וְ/הֵמַתָּ֞ה מֵ/אִ֣ישׁ עַד אִשָּׁ֗ה מֵֽ/עֹלֵל֙ וְ/עַד יוֹנֵ֔ק מִ/שּׁ֣וֹר וְ/עַד שֶׂ֔ה מִ/גָּמָ֖ל וְ/עַד חֲמֽוֹר־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: id
  text: Sekarang, pergilah dan seranglah Amalek, lalu tumpaslah[a] segala yang dimilikinya. Janganlah engkau berbelas kasihan kepadanya. Bunuhlah baik laki-laki maupun perempuan, anak kecil maupun bayi yang masih menyusu, lembu maupun domba[b], unta maupun keledai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “binasakanlah sama sekali” atau “khususkanlah untuk kebinasaan.” Kata kerja Ibrani yang diterjemahkan “tumpaslah” berarti menyerahkan sesuatu tanpa dapat ditarik kembali kepada kebinasaan di bawah penghukuman ilahi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Amalek” dan selanjutnya “kepadanya” dalam ayat ini memakai bentuk tunggal; bentuk tunggal itu mengacu kepada bangsa Amalek sebagai satu kesatuan. Kata Ibrani yang diterjemahkan “domba” dapat menunjuk kepada domba atau kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda waktu dan wacana yang membuka rangkaian perintah secara langsung.
- source_word: לֵךְ
  choice: pergilah
  rationale: Imperatif sederhana yang alami dalam bahasa Indonesia dan mempertahankan ketegasan perintah.
- source_word: וְהִכִּיתָה
  choice: seranglah
  rationale: Dalam konteks perang, נכה berarti menghantam atau menyerang; pilihan ini jelas dan tidak arkais.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Mempertahankan nama tunggal Ibrani yang di sini merujuk secara kolektif kepada bangsa Amalek.
- source_word: וְהַחֲרַמְתֶּם
  choice: tumpaslah
  rationale: חרם dalam bentuk Hifil menunjuk pada penyerahan tanpa dapat ditarik kembali kepada kebinasaan dalam penghukuman ilahi. 'Tumpaslah' menyampaikan hasil penghancuran total secara wajar; nuansa teknisnya dijelaskan dalam catatan.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: seluruh miliknya
  rationale: Ungkapan ringkas yang mencakup segala sesuatu yang menjadi kepunyaan entitas kolektif Amalek.
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: Janganlah engkau menyayangkan dia
  rationale: חמל memadukan gagasan merasa iba dan membiarkan hidup; 'menyayangkan' mempertahankan unsur belas kasihan dalam larangan tersebut.
- source_word: וְהֵמַתָּה
  choice: bunuhlah
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati; 'bunuhlah' lugas, tepat, dan sesuai konteks.
- source_word: מֵאִישׁ עַד אִשָּׁה
  choice: laki-laki maupun perempuan
  rationale: Menyatakan cakupan menyeluruh atas kedua kategori manusia dengan konstruksi Indonesia yang alami.
- source_word: מֵעֹלֵל וְעַד יוֹנֵק
  choice: anak kecil maupun bayi yang masih menyusu
  rationale: Membedakan עולל sebagai anak kecil dan יונק sebagai bayi yang menyusu.
- source_word: מִשּׁוֹר וְעַד שֶׂה
  choice: sapi maupun kambing domba
  rationale: שור adalah ternak sapi, sedangkan שה merupakan istilah kolektif bagi ternak kecil, yakni domba atau kambing; 'kambing domba' mempertahankan keluasan istilah kedua.
- source_word: מִגָּמָל וְעַד חֲמוֹר
  choice: unta maupun keledai
  rationale: Mempertahankan pasangan kategori hewan dalam bentuk distributif yang alami.
theological_decisions:
- issue: Bahasa חרם dalam konteks perang
  choice: tumpaslah, dengan penjelasan catatan kaki
  alternative: binasakanlah sama sekali; khususkanlah untuk kebinasaan
  rationale: Teks memakai istilah penghukuman yang bermuatan sakral, bukan sekadar bahasa operasi militer. Terjemahan utama dibuat wajar dalam bahasa Indonesia, sedangkan cakupan teknis dan alternatifnya dipertahankan dalam catatan.
- issue: Bentuk tunggal kolektif Amalek dan pronomina tunggal
  choice: Amalek ... dia
  alternative: orang Amalek ... mereka
  rationale: Bahasa Ibrani memperlakukan Amalek sebagai entitas kolektif tunggal. Bentuk itu dipertahankan agar bentuk sumber dan ketegangannya tidak dihapus.
- issue: Pasangan kategori manusia dan hewan
  choice: laki-laki maupun perempuan ... anak kecil maupun bayi ...
  alternative: dari laki-laki sampai perempuan ...
  rationale: Konstruksi מן ... עד menyatakan totalitas rentang. 'Maupun' menyampaikan cakupan distributif secara alami tanpa mengubah kategori yang disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung, berat, dan bermartabat. Partikel imperatif -lah mempertahankan bentuk perintah. Kekerasan teks tidak diperhalus, tetapi istilah teknis חרם diterangkan tanpa memasukkan penafsiran denominasi.
