  text: וַ/יִּתְפֹּ֛שׂ אֶת אֲגַ֥ג מֶֽלֶךְ עֲמָלֵ֖ק חָ֑י וְ/אֶת כָּל הָ/עָ֖ם הֶחֱרִ֥ים לְ/פִי חָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: id
  text: Ia menangkap Agag, raja Amalek, hidup-hidup, dan mengkhususkan seluruh rakyat untuk dibinasakan[a] dengan mata pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menumpas seluruh rakyat sampai habis.” Kata kerja Ibrani ini menunjuk pada tindakan mengkhususkan sesuatu untuk dibinasakan di bawah ketentuan ḥerem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: Ia menangkap
  rationale: Kata kerja ini menyatakan tindakan menangkap atau menguasai seseorang; “menangkap” paling wajar dalam konteks peperangan.
- source_word: אֲגַג
  choice: Agag
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ עֲמָלֵק
  choice: raja Amalek
  rationale: Mempertahankan hubungan konstruksi Ibrani secara langsung dan alami.
- source_word: חָי
  choice: hidup-hidup
  rationale: Menegaskan bahwa Agag ditangkap dalam keadaan hidup, bukan dibunuh; bentuk ini alami dalam bahasa Indonesia.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: עָם berarti “rakyat” atau “bangsa”; “seluruh rakyat” mempertahankan cakupan luas tanpa membatasinya hanya pada pasukan.
- source_word: הֶחֱרִים
  choice: dikhususkannya untuk dibinasakan
  rationale: Bentuk hiphil dari חרם menunjuk pada tindakan menempatkan sesuatu di bawah ḥerem, yakni mengkhususkannya bagi kebinasaan. Ungkapan ini mempertahankan bobot istilah tersebut tanpa memakai istilah teknis yang sukar dipahami.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani secara harfiah berarti “dengan mulut pedang”; padanan idiomatis Indonesia “dengan mata pedang” mempertahankan citra aslinya.
theological_decisions:
- issue: Bahasa חרם dalam konteks perang
  choice: dikhususkannya untuk dibinasakan
  alternative: ditumpasnya sampai habis
  rationale: Pilihan utama mempertahankan unsur pengkhususan di bawah ketentuan ḥerem sekaligus hasil berupa kebinasaan. Alternatifnya lebih lancar, tetapi meratakan istilah itu menjadi tindakan militer semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hidup-hidup” dipilih karena alami dan tegas; “sedangkan” menampilkan kontras antara nasib Agag dan nasib rakyat tanpa menambahkan hubungan yang tidak tersurat. Istilah teknis ḥerem dijelaskan hanya dalam catatan kaki.
