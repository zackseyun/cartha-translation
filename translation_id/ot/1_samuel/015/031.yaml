translation:
  language: id
  text: Lalu Samuel kembali mengikuti Saul, dan Saul sujud kepada TUHAN.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “membungkuk kepada TUHAN” atau “menyembah TUHAN.” Kata Ibrani yang dipakai dapat menunjuk pada tindakan membungkuk atau bersujud, dan dalam konteks ini juga dapat menyatakan penyembahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk dari שׁוב menunjukkan Samuel berbalik dari keputusan sebelumnya dan kembali dalam rangkaian narasi.
- source_word: אַחֲרֵי
  choice: mengikuti
  rationale: Secara harfiah berarti 'sesudah/di belakang'. Dalam konteks gerak, 'mengikuti Saul' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan gambaran Samuel pergi di belakang Saul.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud menyembah
  rationale: Bentuk dari שׁחה menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan. Karena arahnya kepada TUHAN, 'sujud menyembah' menyampaikan tindakan jasmani sekaligus makna ibadah tanpa menghilangkan salah satunya.
- source_word: לַיהוָה
  choice: TUHAN
  rationale: Preposisi ל menandai arah atau sasaran tindakan Saul. Nama ilahi יהוה diterjemahkan menurut konvensi Alkitab bahasa Indonesia sebagai 'TUHAN' dengan huruf kapital.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah וַיִּשְׁתַּחוּ harus dinyatakan terutama sebagai tindakan jasmani atau sebagai ibadah
  choice: sujud menyembah TUHAN
  alternative: bersujud kepada TUHAN; menyembah TUHAN
  rationale: Kata Ibrani dapat menunjuk pada tindakan bersujud maupun penyembahan. Karena TUHAN adalah sasaran tindakan itu, konteksnya bersifat ibadah; gabungan 'sujud menyembah' mempertahankan unsur jasmani dan religius tanpa memaksa pembaca memilih hanya salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. 'Lalu' menjaga alur naratif; 'kembali mengikuti Saul' menyatakan arah gerak tanpa menyiratkan persetujuan Samuel terhadap Saul. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
