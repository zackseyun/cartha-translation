base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: id
  text: Lalu Samuel datang menemui Saul, dan Saul berkata kepadanya, “Diberkatilah engkau oleh Yahweh[a]! Aku telah melaksanakan firman Yahweh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Diberkatilah engkau bagi Yahweh.” Ini adalah formula berkat Ibrani; terjemahan utama memahami Yahweh sebagai sumber berkat.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku telah menggenapi” atau “Aku telah menjalankan firman Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא שְׁמוּאֵל אֶל שָׁאוּל
  choice: Lalu Samuel datang menemui Saul
  rationale: Bentuk naratif וַיָּבֹא menyatakan gerak menuju Saul. Frasa 'datang menemui' alami dalam bahasa Indonesia dan menyampaikan bahwa Samuel tiba di hadapan Saul.
- source_word: וַיֹּאמֶר לוֹ שָׁאוּל
  choice: dan Saul berkata kepadanya
  rationale: Mempertahankan objek tak langsung לוֹ yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: Kiranya engkau diberkati oleh Yahweh
  rationale: Ungkapan ini merupakan formula berkat. Bentuk 'kiranya ... diberkati oleh Yahweh' menyampaikan fungsi ucapan berkat secara alami, dengan Yahweh sebagai sumber atau pelaku berkat, tanpa mempertahankan secara kaku nilai preposisi לְ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: הֲקִימֹתִי
  choice: Aku telah melaksanakan
  rationale: Bentuk hifil dari קום bersama 'firman Yahweh' berarti membuat perkataan itu berlaku atau terlaksana. 'Melaksanakan' alami dalam konteks klaim Saul bahwa ia menaati perintah ilahi.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: '''Firman'' mempertahankan cakupan דָּבָר dan ungkapan Ibrani, sementara konteks menunjukkan bahwa firman tersebut berupa perintah.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama pribadi itu dan membedakannya dari gelar.
- issue: Nuansa klaim ketaatan Saul
  choice: Aku telah melaksanakan firman Yahweh
  alternative: Aku telah menggenapi firman Yahweh; Aku telah menegakkan firman Yahweh
  rationale: Terjemahan ini mempertahankan klaim Saul sebagaimana diucapkannya tanpa mengesahkan kebenarannya; konteks berikutnya akan memperlihatkan ketegangan antara klaim dan tindakannya.
- issue: Formula berkat לַיהוָה
  choice: Kiranya engkau diberkati oleh Yahweh
  alternative: Diberkatilah engkau bagi Yahweh; Engkau diberkati oleh Yahweh
  rationale: Preposisi לְ dalam formula ini dapat dipahami dengan beberapa nuansa. Terjemahan utama mengungkapkan fungsi berkat secara wajar dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kiranya' dipakai untuk menandai fungsi formula berkat tanpa terdengar kuno; 'firman' mempertahankan corak religius teks sekaligus tetap umum dipahami.
