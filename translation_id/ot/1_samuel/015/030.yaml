  edition: WLC
  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: id
  text: Lalu ia berkata, “Aku telah berdosa. Sekarang, tolong hormatilah aku di hadapan para tua-tua bangsaku dan di hadapan Israel. Kembalilah bersamaku, supaya aku sujud kepada Yahweh, Allahmu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan aku akan sujud kepada Yahweh, Allahmu.” Bentuk Ibraninya dapat dipahami sebagai kelanjutan sederhana (“dan aku akan sujud”) atau sebagai tujuan dari permintaan sebelumnya (“supaya aku sujud”).
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Bentuk Qal perfekt orang pertama tunggal menyatakan pengakuan atas dosa yang sudah dilakukan dan masih relevan dalam keadaan saat itu.
- source_word: כַּבְּדֵנִי נָא
  choice: tolong hormatilah aku
  rationale: Imperatif Piel dari כבד meminta Samuel memberi Saul kehormatan secara terbuka; נָא dinyatakan dengan “tolong”.
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: di hadapan para tua-tua bangsaku dan di hadapan Israel
  rationale: נֶגֶד menunjukkan kehadiran atau pandangan publik. Ungkapan “bangsaku” dipertahankan karena mencerminkan perhatian Saul pada kedudukan publiknya.
- source_word: וְשׁוּב עִמִּי
  choice: Kembalilah bersamaku
  rationale: שׁוב berarti kembali atau berbalik; dalam konteks ini Saul meminta Samuel kembali menyertainya.
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: supaya aku sujud
  rationale: Bentuk dari שׁחה menunjuk pada tindakan membungkuk atau bersujud. Terjemahan ini mempertahankan tindakan fisiknya sekaligus implikasi penyembahan dalam konteks.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, sehingga nama perjanjian itu tetap tampak dalam teks.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal dipertahankan; Saul secara eksplisit berkata “Allahmu” kepada Samuel.
theological_decisions:
- issue: Pengungkapan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Ucapan Saul אֱלֹהֶיךָ
  choice: Allahmu
  alternative: Allah kita
  rationale: Akhiran orang kedua tunggal harus dipertahankan agar ketegangan naratif dan teologis dalam cara Saul berbicara tentang Allah tidak dihilangkan.
- issue: Hubungan וְהִשְׁתַּחֲוֵיתִי dengan permintaan sebelumnya
  choice: supaya aku sujud
  alternative: dan aku akan sujud
  rationale: Waw dengan bentuk perfekt dapat dipahami sebagai kelanjutan sederhana atau sebagai maksud setelah imperatif sebelumnya. Teks utama memakai hubungan tujuan yang alami dalam bahasa Indonesia, sedangkan kemungkinan kelanjutan sederhana dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Para tua-tua” dipakai untuk jabatan pemimpin masyarakat, “sujud” mempertahankan unsur tindakan fisik, dan “Allahmu” menjaga bentuk serta ketegangan dalam teks sumber.
