id: 1SA.15.29
reference: 1 Samuel 15:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם֙ נֵ֣צַח יִשְׂרָאֵ֔ל לֹ֥א יְשַׁקֵּ֖ר וְ/לֹ֣א יִנָּחֵ֑ם כִּ֣י לֹ֥א אָדָ֛ם ה֖וּא לְ/הִנָּחֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/029.yaml
  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: id
  text: Lagi pula, Kemuliaan Israel[a] tidak akan berdusta ataupun berubah pikiran[b], sebab Ia bukan manusia yang berubah pikiran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yang Kekal dari Israel,” “Kekuatan Israel,” atau “Kemenangan Israel.” Gelar Ibrani ini memiliki jangkauan makna yang luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyesal” atau “mengurungkan niat-Nya.” Kata Ibrani yang sama dipakai kembali pada akhir ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Lagi pula
  rationale: Mengungkapkan hubungan tambahan sekaligus penegasan terhadap teguran sebelumnya dalam bahasa Indonesia yang alami.
- source_word: נֵצַח יִשְׂרָאֵל
  choice: Kemuliaan Israel
  rationale: Mempertahankan bentuk gelar ilahi yang luhur tanpa membatasi נֵצַח hanya pada gagasan kekekalan, kekuatan, atau kemenangan; keluasan maknanya dicatat dalam catatan kaki.
- source_word: יְשַׁקֵּר
  choice: akan berdusta
  rationale: Padanan langsung bagi bentuk piel שקר, yang menegaskan bahwa Allah tidak berkata atau bertindak palsu.
- source_word: וְלֹא יִנָּחֵם
  choice: ataupun berubah pikiran
  rationale: נחם dalam nifal dapat berarti menyesal, mengurungkan niat, atau berubah pikiran. Pilihan ini jelas bagi pembaca modern dan tetap mempertahankan kemungkinan perubahan yang dalam konteks ini disangkal.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya secara ringkas dan wajar.
- source_word: לֹא אָדָם הוּא
  choice: Ia bukan manusia
  rationale: Menyampaikan kontras umum antara Allah dan manusia tanpa menjadikannya rujukan khusus kepada seorang laki-laki.
- source_word: לְהִנָּחֵם
  choice: yang berubah pikiran
  rationale: Mengulangi pilihan bagi akar נחם agar hubungan leksikal antara kedua kemunculannya tetap tampak.
theological_decisions:
- issue: Bahasa tentang ketetapan Allah dan penggunaan נחם
  choice: tidak akan ... berubah pikiran ... bukan manusia yang berubah pikiran
  alternative: tidak akan menyesal; tidak akan mengurungkan niat-Nya
  rationale: Terjemahan menyatakan keandalan dan tidak berubahnya keputusan Allah dalam konteks penolakan Saul, tanpa memperluas ayat ini menjadi rumusan filosofis yang melampaui konteksnya. Pengulangan ungkapan yang sama mempertahankan tekanan dan ketegangan teks.
- issue: Makna gelar ilahi נֵצַח יִשְׂרָאֵל
  choice: Kemuliaan Israel
  alternative: Yang Kekal dari Israel; Kekuatan Israel; Kemenangan Israel
  rationale: Kata נֵצַח memiliki jangkauan makna yang diperdebatkan. Teks utama memakai gelar yang luhur dan wajar, sedangkan catatan kaki mempertahankan alternatif yang sah tanpa menetapkan satu tafsiran metafisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Ia” dipakai secara konsisten untuk rujukan kepada Allah. Susunan kalimat dijaga ringkas agar penegasan dan pengulangan sumber Ibrani tetap terasa.
