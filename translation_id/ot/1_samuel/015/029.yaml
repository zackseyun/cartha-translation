  terminology: Kapitalisasi ilahi konsisten. “Kemuliaan Israel” adalah pilihan utama yang layak bagi gelar yang secara leksikal diperdebatkan, dan catatan kaki mempertahankan alternatif penting tanpa memaksakan penafsiran teologis tertentu. Catatan b juga dengan tepat menandai alternatif untuk נחם dan pengulangannya.
