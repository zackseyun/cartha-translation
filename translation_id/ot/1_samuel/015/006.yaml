  naturalness: Bahasa draf sudah baku dan jelas. “Seluruh keturunan Israel” sedikit lebih lazim daripada “semua keturunan Israel” dalam ragam Alkitab modern. Rangkaian perintah dan pilihan “menyingkir” tetap alami.
