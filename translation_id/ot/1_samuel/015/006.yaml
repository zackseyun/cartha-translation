source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: id
  text: Lalu Saul berkata kepada orang Keni[a], “Pergilah, menyingkirlah, turunlah dari tengah-tengah orang Amalek, supaya aku tidak membinasakanmu bersama mereka.[b] Sebab, engkau telah menunjukkan kebaikan kepada seluruh keturunan Israel ketika mereka keluar dari Mesir.” Maka orang Keni menyingkir dari tengah-tengah orang Amalek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal kolektif, “orang Keni”, untuk kelompok orang Keni. Perintah-perintahnya berbentuk jamak, tetapi kata ganti dalam ancaman dan alasannya berbentuk tunggal kolektif.
    reason: Menjelaskan peralihan bentuk jamak dan tunggal dalam teks Ibrani tanpa mengubah acuannya yang kolektif.
  - marker: b
    text: Atau “supaya aku tidak menyapu engkau habis bersama mereka.” Kata kerja Ibrani di sini dapat menyatakan tindakan menyingkirkan atau melenyapkan bersama-sama dalam penghukuman.
    reason: Mempertahankan alternatif idiomatis dan nuansa penghukuman dari אסף, sambil mempertahankan pelaku aktif dalam kalimat.
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: orang Keni
  rationale: Bentuk nisbah tunggal dalam bahasa Ibrani kemungkinan berfungsi secara kolektif. Bahasa Indonesia dapat mempertahankan bentuk tunggal kolektif “orang Keni”, sementara kata ganti jamak dalam ujaran menunjukkan bahwa kelompok itu disapa.
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: Pergilah, menyingkirlah, turunlah
  rationale: Tiga perintah jamak dipertahankan. “Menyingkir” menyampaikan tindakan menjauh dari bahaya, sedangkan “turun” mempertahankan gambaran gerak konkret dari ירד.
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: dari tengah-tengah orang Amalek
  rationale: Ungkapan ini secara alami menyatakan pemisahan dari komunitas Amalek. Terjemahan yang sama pada kedua kemunculan menjaga kohesi narasi.
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: supaya aku tidak membinasakan kalian bersama mereka
  rationale: Dalam konteks penghukuman, אסף dapat berarti dilenyapkan atau dibinasakan bersama pihak lain. Bentuk Indonesia jamak mengikuti perintah-perintah jamak dan sapaan kepada kelompok Keni, meskipun sufiks Ibrani pada verba berbentuk tunggal kolektif.
- source_word: חֶסֶד
  choice: kebaikan
  rationale: Dalam konteks tindakan manusia terhadap Israel, “kebaikan” alami dan tidak memaksakan gagasan perjanjian formal. Nuansa kesetiaan atau loyalitas tetap dicatat dalam catatan kaki.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: semua keturunan Israel
  rationale: Secara harfiah berarti “semua anak laki-laki Israel”, tetapi merupakan sebutan nasional bagi umat Israel secara keseluruhan. “Keturunan Israel” mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: ketika mereka keluar dari Mesir
  rationale: Secara harfiah “ketika mereka naik dari Mesir”. Dalam bahasa Indonesia, “keluar dari Mesir” lebih alami dan jelas merujuk pada peristiwa eksodus; nuansa arah naik tidak penting bagi makna utama.
- source_word: וַיָּסַר
  choice: menyingkir
  rationale: Pilihan ini mengulang akar dan padanan dari perintah סור, sehingga respons orang Keni tampak langsung menaati perkataan Saul.
theological_decisions:
- issue: Makna חֶסֶד dalam tindakan orang Keni terhadap Israel
  choice: kebaikan
  alternative: kesetiaan; kasih setia; loyalitas perjanjian
  rationale: Konteks menekankan perlakuan baik dan setia kepada Israel pada masa keluaran. “Kebaikan” menghindari penyimpulan bahwa orang Keni terikat dalam suatu perjanjian formal, sambil membiarkan nuansa kesetiaan dijelaskan dalam catatan.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; umat Israel
  rationale: Ungkapan tersebut merupakan sebutan nasional, bukan pembatasan kepada laki-laki. “Keturunan Israel” cukup dekat dengan bentuk sumber dan wajar dalam ragam Alkitab Indonesia.
- issue: Daya hukum אסף dalam ancaman Saul
  choice: membinasakan
  alternative: menyapu habis; melenyapkan; mengumpulkan
  rationale: Konteks perang dan pemusnahan Amalek menuntut makna penghukuman. “Membinasakan” menyatakan akibatnya tanpa memperhalus ancaman, sedangkan catatan mempertahankan gambaran alternatif “menyapu habis”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah berurutan dipertahankan untuk mencerminkan desakan teks Ibrani. “Orang Keni” dipakai sebagai kolektif, dengan kata ganti “kalian” agar sapaan kelompok terdengar alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
