  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: id
  text: Lalu Samuel berkata kepada Saul, “Yahweh mengutus aku untuk mengurapi engkau menjadi raja atas umat-Nya, atas Israel. Karena itu, sekarang dengarkanlah firman Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dengarkanlah suara perkataan-perkataan Yahweh.” Ungkapan Ibrani ini meminta Saul bukan sekadar mendengar, tetapi juga mengindahkan dan menaati.'
    reason: Menjelaskan bentuk khas teks Ibrani serta nuansa perintah yang tidak seluruhnya tampak dalam terjemahan yang lebih alami.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan alur narasi; ‘lalu’ merupakan penghubung naratif yang wajar dalam bahasa Indonesia.
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: Yahweh telah mengutus aku
  rationale: Kata ganti objek yang didahulukan dalam bahasa Ibrani memberi penekanan pada Samuel sebagai orang yang diutus. Susunan Indonesia ini tetap alami, sementara ‘telah mengutus’ menyatakan penugasan lampau yang sudah terlaksana dan masih menjadi dasar perkataan sekarang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לִמְשָׁחֳךָ
  choice: untuk mengurapi engkau
  rationale: Kata משׁח menunjuk pada pengurapan untuk jabatan kerajaan; ‘mengurapi’ mempertahankan istilah dan citra sumber.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Preposisi ל menandai peranan atau hasil pengurapan; ‘menjadi raja’ alami dalam bahasa Indonesia.
- source_word: עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: atas umat-Nya, atas Israel
  rationale: 'Pengulangan עַל dipertahankan untuk menjaga penekanan dan struktur aposisional teks: umat Yahweh itu adalah Israel.'
- source_word: וְעַתָּה
  choice: Karena itu, sekarang
  rationale: Ungkapan ini mengalihkan dari pengingat tentang pengangkatan Saul kepada tuntutan yang menyusul, dengan nuansa kesinambungan sekaligus konsekuensi.
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: dengarkanlah firman Yahweh
  rationale: Secara harfiah ungkapan ini berbunyi ‘dengarkanlah suara perkataan-perkataan Yahweh’, tetapi secara idiomatis menuntut bukan hanya mendengar, melainkan juga menaati. ‘Firman Yahweh’ memberi bahasa Indonesia yang wajar; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa שְׁמַע sebagai mendengar sekaligus mengindahkan
  choice: dengarkanlah
  alternative: taatilah; dengarkan dan taatilah
  rationale: ‘Dengarkanlah’ mempertahankan citra pendengaran dalam sumber dan, dalam konteks perintah, mengandung panggilan untuk mengindahkan. Menerjemahkan hanya ‘taatilah’ akan menghilangkan citra sumber, sedangkan ‘dengarkan dan taatilah’ menambahkan dua verba yang tidak dinyatakan terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai dalam ujaran langsung bernuansa Alkitabiah tanpa bentuk arkais seperti ‘dikau’. Kapital pada ‘umat-Nya’ memperjelas bahwa akhiran pronominal merujuk kepada Yahweh.
