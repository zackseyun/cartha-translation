  text: וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל שְׁמוּאֵל֙ חָטָ֔אתִי כִּֽי עָבַ֥רְתִּי אֶת פִּֽי יְהוָ֖ה וְ/אֶת דְּבָרֶ֑י/ךָ כִּ֤י יָרֵ֨אתִי֙ אֶת הָ/עָ֔ם וָ/אֶשְׁמַ֖ע בְּ/קוֹלָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: id
  text: Lalu Saul berkata kepada Samuel, “Aku telah berdosa, sebab aku telah melanggar perintah Yahweh[a] dan perkataanmu, sebab aku takut kepada rakyat dan mendengarkan suara mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menaati mereka”; secara harfiah, “mendengarkan suara mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Bentuk perfektif menyatakan pengakuan Saul atas kesalahan yang sudah dilakukan; bentuk ‘telah berdosa’ menyampaikan pengakuan itu secara wajar dalam bahasa Indonesia.
- source_word: עָבַרְתִּי
  choice: aku telah melanggar
  rationale: Dalam konteks ini, verba yang secara dasar berarti ‘melewati’ menunjuk pada pelanggaran terhadap ketetapan ilahi; ‘melanggar’ mempertahankan bobot moral dan hukumnya.
- source_word: פִּי יְהוָה
  choice: perintah Yahweh
  rationale: Ungkapan harfiah ‘mulut Yahweh’ merupakan idiom bagi apa yang Yahweh ucapkan atau perintahkan. ‘Perintah Yahweh’ jelas dan sesuai dengan konteks ketidaktaatan Saul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: דְּבָרֶיךָ
  choice: perkataanmu
  rationale: Bentuk Ibrani menunjuk pada perkataan Samuel. Dalam bahasa Indonesia, nomina ‘perkataan’ secara alami dapat mencakup bentuk jamak tanpa pengulangan.
- source_word: יָרֵאתִי
  choice: aku takut kepada
  rationale: Pilihan ini mempertahankan makna langsung verba takut dan membiarkan alasan Saul terdengar sebagaimana dinyatakannya.
- source_word: הָעָם
  choice: rakyat
  rationale: Nomina ini secara umum berarti ‘rakyat’ atau ‘orang-orang’. Walaupun dalam konteksnya mungkin terutama merujuk kepada pasukan, terjemahan tidak dipersempit tanpa keharusan.
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: dan mendengarkan suara mereka
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani ‘mendengarkan suara mereka’ serta kontras naratif antara suara Yahweh dan suara rakyat; dalam konteks, ungkapan itu menyiratkan bahwa Saul menuruti mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna idiom פִּי יְהוָה
  choice: perintah Yahweh
  alternative: mulut Yahweh atau firman Yahweh
  rationale: ‘Mulut Yahweh’ adalah bentuk harfiah, tetapi dalam konteks ini idiom tersebut merujuk kepada perintah yang dilanggar Saul. ‘Perintah’ menyampaikan maksudnya tanpa menambahkan penafsiran teologis.
- issue: Hubungan antara mendengar dan menaati dalam וָאֶשְׁמַע בְּקוֹלָם
  choice: mendengarkan suara mereka
  alternative: menaati mereka atau menuruti mereka
  rationale: Bentuk yang lebih dekat dengan teks mempertahankan metafora ‘suara’ dan ketegangan naratifnya, sedangkan implikasi ketaatan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengakuan Saul serta pengulangan kata ‘sebab’ dipertahankan agar hubungan alasan dalam teks Ibrani tetap terlihat. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
