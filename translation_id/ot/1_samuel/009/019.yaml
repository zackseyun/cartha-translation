base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: id
  text: Samuel menjawab Saul dan berkata, “Akulah pelihat[a] itu. Naiklah mendahului aku ke tempat tinggi itu, dan hari ini kalian[b] akan makan bersamaku. Pada pagi hari aku akan membiarkanmu pergi, dan aku akan memberitahukan kepadamu segala yang ada dalam hatimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nabi”. Bahasa Ibrani memakai istilah lama “pelihat”, yang dijelaskan dalam 1 Samuel 9:9 sebagai sebutan terdahulu untuk seorang nabi.
    reason: alternative_reading
  - marker: b
    text: Kata “kalian” berbentuk jamak dalam bahasa Ibrani dan kemungkinan mencakup pelayan Saul bersama Saul sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: pelihat
  rationale: Secara harfiah berarti ‘orang yang melihat’ dan merupakan sebutan lama bagi tokoh kenabian (bdk. 1 Samuel 9:9). ‘Pelihat’ mempertahankan istilah historis sumber tanpa langsung meratakannya menjadi ‘nabi’.
- source_word: הַבָּמָה
  choice: tempat pemujaan di bukit
  rationale: Istilah ini menunjuk pada tempat ibadah yang ditinggikan atau berada di ketinggian. Ungkapan ini lebih mudah dipahami pembaca modern daripada terjemahan harfiah ‘tempat tinggi’, tanpa secara khusus menambahkan unsur pengurbanan yang tidak dinyatakan oleh katanya sendiri.
- source_word: עֲלֵה לְפָנַי
  choice: Naiklah mendahului aku
  rationale: Mempertahankan gerak naik serta posisi Saul di depan Samuel, tanpa memastikan lebih jauh apakah Saul harus memimpin perjalanan.
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: dan hari ini kalian akan makan bersamaku
  rationale: Bentuk verba adalah orang kedua maskulin jamak, sehingga ‘kalian’ mempertahankan acuan kepada Saul beserta setidaknya seorang pendampingnya. Bentuk ‘akan makan’ mencerminkan rangkaian tindakan yang mengikuti perintah sebelumnya.
- source_word: וְשִׁלַּחְתִּיךָ
  choice: aku akan melepasmu pergi
  rationale: Dalam konteks ini verba berarti mengizinkan atau menyuruh Saul melanjutkan perjalanannya, bukan mengusirnya.
- source_word: בַבֹּקֶר
  choice: Pada pagi hari
  rationale: Mengikuti sumber yang hanya mengatakan ‘pada pagi hari’; kata ‘besok’ tidak ditambahkan meskipun tersirat oleh konteks.
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: segala yang ada dalam hatimu
  rationale: Mempertahankan ungkapan antropologis Ibrani yang dapat mencakup pikiran, perhatian, keinginan, dan niat Saul.
- source_word: אַגִּיד לָךְ
  choice: aku akan memberitahukan kepadamu
  rationale: Menyampaikan makna kausatif verba, yakni membuat sesuatu diketahui, dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Sebutan Samuel sebagai הָרֹאֶה
  choice: pelihat
  alternative: nabi
  rationale: Ayat ini memakai istilah lama yang secara khusus dijelaskan dalam 1 Samuel 9:9. Mempertahankan ‘pelihat’ menjaga ciri naratif dan tidak meniadakan hubungannya dengan peran nabi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina ‘aku/kamu’ sesuai dengan percakapan langsung antartokoh dalam narasi. Istilah ‘pelihat’ dipertahankan sebagai istilah historis, sedangkan ‘tempat pemujaan di bukit’ dipilih agar makna הַבָּמָה dapat dipahami tanpa memakai frasa kabur ‘tempat tinggi’.
