  naturalness: Draf umumnya jelas dan berregister modern. Namun, pengulangan ‘sebab ... karena ...’ terdengar berat, dan ‘tempat ibadah di bukit’ kurang idiomatis sekaligus terlalu menafsirkan istilah teknis Ibrani.
  terminology: ‘Kurban’ dapat dipertahankan. ‘Masyarakat’ lebih tepat daripada ‘orang banyak’ untuk לָעָם dalam konteks ini. ‘Tempat tinggi’ mempertahankan istilah kultis בָּמָה; catatan kaki menjelaskan rujukannya tanpa penilaian teologis tambahan.
  issues:
