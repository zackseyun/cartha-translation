    issue: ‘bagi orang banyak’ untuk לָעָם
    rationale: ‘Orang banyak’ lazim berarti kerumunan atau banyak orang secara tidak tentu. עָם di sini lebih wajar menunjuk komunitas penduduk yang mengambil bagian dalam kurban itu.
  - severity: medium
    issue: ‘tempat ibadah di bukit’ untuk בָּמָה
    rationale: Terjemahan ini mengubah istilah teknis ‘tempat tinggi’ menjadi deskripsi lokasi yang lebih sempit dan dapat mengesankan setiap bukit. Mempertahankan ‘tempat tinggi’ dengan catatan budaya lebih dekat kepada sumber.
  - severity: low
    issue: Rangkaian ‘sebab ... karena ...’
    rationale: Dua כִּי dalam teks Ibrani dapat diterjemahkan tanpa mempertahankan dua penghubung kausal yang berurutan secara kaku. Kalimat yang direvisi tetap menyatakan kedua fakta yang menjelaskan desakan itu.
