revisions:
- from: Gadis-gadis itu menjawab mereka, “Ya, lihat, dia ada di depanmu. Cepatlah sekarang, sebab hari ini dia datang ke kota, karena hari ini ada kurban bagi orang banyak di tempat ibadah di bukit[a].”
  to: Gadis-gadis itu menjawab mereka, “Ya, lihat, ia ada di depanmu. Cepatlah sekarang, karena hari ini ia datang ke kota dan hari ini ada kurban bagi masyarakat di tempat tinggi itu[a].”
  rationale: Revisi mengganti ‘orang banyak’ dengan ‘masyarakat’ untuk menyampaikan arti komunitas dari עָם, dan mengganti ‘tempat ibadah di bukit’ dengan ‘tempat tinggi’ agar istilah kultis בָּמָה tetap tampak dalam terjemahan. Catatan kaki menjelaskan fungsi dan karakter umum tempat itu. Kalimat sebab-akibat juga dirapikan agar alami dalam bahasa Indonesia sambil mempertahankan dua keterangan ‘hari ini’.
