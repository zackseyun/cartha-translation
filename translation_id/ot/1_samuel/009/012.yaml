base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: id
  text: Gadis-gadis itu menjawab mereka, “Ya, lihat, ia ada di depanmu. Cepatlah sekarang, karena hari ini ia datang ke kota dan hari ini ada kurban bagi masyarakat di tempat tinggi itu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk pada suatu tempat ibadah lokal, biasanya di tempat yang tinggi.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה ... וַתֹּאמַרְנָה
  choice: Gadis-gadis itu menjawab mereka
  rationale: Bentuk verba feminin jamak merujuk kepada para gadis dalam konteks sebelumnya. Bahasa Indonesia secara alami menyampaikan pasangan formula Ibrani ‘menjawab dan berkata’ cukup dengan ‘menjawab’, tanpa kehilangan fungsi dialognya.
- source_word: יֵשׁ הִנֵּה
  choice: Ya, lihat
  rationale: יֵשׁ berfungsi sebagai jawaban afirmatif atas pertanyaan sebelumnya, sedangkan הִנֵּה mengarahkan perhatian. ‘Ya, lihat’ mempertahankan kedua fungsi itu dalam bahasa Indonesia modern.
- source_word: לְפָנֶיךָ
  choice: dia ada di depanmu
  rationale: Ungkapan ini secara harfiah berarti ‘di hadapanmu/di depanmu’. Pronomina orang kedua tunggal dipertahankan sesuai bentuk Ibrani dan menunjukkan bahwa perkataan itu diarahkan khusus kepada Saul.
- source_word: מַהֵר עַתָּה
  choice: Cepatlah sekarang
  rationale: Imperatif tunggal dan keterangan waktu menyatakan desakan langsung. Pilihan ini jelas, alami, dan mempertahankan unsur ‘sekarang’.
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: sebab hari ini dia datang ke kota
  rationale: Perfect בָּא menyatakan kedatangan Samuel pada hari itu. Bentuk ‘datang’ dalam bahasa Indonesia tidak perlu diberi penanda aspek tambahan dan tetap membiarkan konteks menentukan apakah kedatangannya baru saja terjadi.
- source_word: זֶבַח
  choice: kurban
  rationale: Nomina ini menunjuk pada kurban. Unsur perjamuan komunal mungkin tersirat oleh konteks, tetapi tidak dinyatakan langsung dalam ayat ini.
- source_word: לָעָם
  choice: bagi orang banyak
  rationale: עָם di sini menunjuk kepada komunitas yang mengikuti kegiatan kurban. ‘Orang banyak’ lebih alami dalam konteks pertemuan lokal daripada ‘rakyat’, yang dapat memberi kesan politis atau nasional.
- source_word: בַּבָּמָה
  choice: di tempat ibadah di bukit
  rationale: בָּמָה adalah tempat ibadah lokal yang umumnya terletak di tempat tinggi. Ungkapan ini menyampaikan lokasi dan fungsi kultisnya secara jelas tanpa memasukkan penilaian polemis dari konteks-konteks yang lebih kemudian.
theological_decisions:
- issue: Makna בָּמָה dalam konteks kurban sebelum berdirinya Bait Allah
  choice: tempat ibadah di bukit
  alternative: bukit pengurbanan
  rationale: Pilihan ini mempertahankan fungsi tempat tersebut sebagai lokasi ibadah yang tinggi, sambil menghindari kesan bahwa ayat ini sendiri sedang mengecam praktik itu. Catatan kaki menjelaskan istilah budaya tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk sapaan tunggal ‘-mu’ dipertahankan karena verba dan pronomina Ibrani dalam ucapan ini berbentuk tunggal, meskipun para gadis menjawab Saul dan pelayannya.
