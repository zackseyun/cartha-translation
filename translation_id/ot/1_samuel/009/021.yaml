source:
  edition: WLC
  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: id
  text: Saul menjawab, “Bukankah aku orang Benyamin, dari suku yang terkecil di antara suku-suku Israel? Bukankah kaumku yang paling kecil di antara semua kaum dalam suku Benyamin? Jadi, mengapa engkau berbicara kepadaku seperti ini?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengatakan hal semacam ini kepadaku?”
    reason: Ungkapan כַּדָּבָר הַזֶּה dapat menekankan isi perkataan (“hal semacam ini”), bukan hanya caranya (“seperti ini”).
lexical_decisions:
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “bukankah” merupakan padanan Indonesia yang alami dan tepat.
- source_word: בֶן־יְמִינִי
  choice: orang Benyamin
  rationale: Ungkapan ini berfungsi sebagai sebutan kesukuan bagi seseorang yang berasal dari suku Benyamin, bukan sekadar menyatakan hubungan ayah-anak.
- source_word: מִקַּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: dari suku yang terkecil di antara suku-suku Israel
  rationale: Kata קָטֹן dapat menunjuk pada kecilnya ukuran, jumlah, atau kedudukan. Bentuk ini mempertahankan gambaran “terkecil” tanpa menentukan secara sempit jenis ketidakberartiannya.
- source_word: מִשְׁפַּחְתִּי
  choice: kaumku
  rationale: Dalam konteks susunan sosial Israel, מִשְׁפָּחָה menunjuk pada kelompok kekerabatan di bawah tingkat suku; “kaum” lebih tepat daripada keluarga inti.
- source_word: הַצְּעִרָה
  choice: yang paling kecil
  rationale: Kata ini menyatakan kedudukan atau ukuran yang kecil dibandingkan kaum-kaum lain. “Paling kecil” mempertahankan perbandingan langsung dan nada rendah hati Saul.
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: di antara semua kaum dalam suku Benyamin
  rationale: Konteks membandingkan kaum Saul dengan kelompok-kelompok kekerabatan lain di dalam Benyamin. Bentuk Indonesia ini menyampaikan hubungan sosial tersebut dengan jelas.
- source_word: וְלָמָּה
  choice: Jadi, mengapa
  rationale: Kata sambung menghubungkan pernyataan Saul tentang kecilnya suku dan kaumnya dengan pertanyaan kesimpulan; “jadi” menyampaikan daya inferensial itu secara alami.
- source_word: דִּבַּרְתָּ אֵלַי
  choice: engkau berbicara kepadaku
  rationale: Padanan ini mengikuti makna dasar דּבר dengan preposisi אֶל dan sesuai dengan tuturan langsung yang bermartabat.
- source_word: כַּדָּבָר הַזֶּה
  choice: seperti ini
  rationale: Ungkapan ini dapat menunjuk pada cara maupun isi perkataan Samuel. “Seperti ini” mempertahankan keluwesan tersebut dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata “engkau” dipakai dalam percakapan langsung sesuai register Alkitab Indonesia, sedangkan “kaum” membedakan kelompok kekerabatan dari suku dan keluarga inti.
