base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/018.yaml
  text: Then Saul approached Samuel in the midst of the gate and said[b][a], “Please tell me where the seer’s house is.”
translation:
  language: id
  text: Lalu Saul mendekati Samuel di tengah pintu gerbang dan berkata, “Tolong beri tahu saya, di manakah rumah pelihat[a] itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pelihat” adalah istilah lama bagi orang yang kemudian lebih lazim disebut nabi; lihat penjelasan narator dalam 1 Samuel 9:9.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekati
  rationale: Kata kerja נגשׁ menyatakan gerak mendekat kepada seseorang; “mendekati” alami dalam bahasa Indonesia dan mempertahankan arah gerak Saul kepada Samuel.
- source_word: בְּתוֹךְ הַשָּׁעַר
  choice: di tengah pintu gerbang
  rationale: Ungkapan ini secara harfiah berarti “di tengah pintu gerbang.” Dalam konteks kota kuno, “pintu gerbang” dapat mencakup bangunan atau kawasan gerbang, bukan hanya daun pintunya.
- source_word: הַגִּידָה נָּא לִי
  choice: Tolong beri tahu saya
  rationale: Bentuk perintah dengan נָא menyampaikan permintaan yang sopan; pilihan ini wajar dalam bahasa Indonesia modern.
- source_word: אֵי זֶה
  choice: di manakah ... itu
  rationale: Dalam konteks ini, frasa tanya tersebut meminta keterangan lokasi. Bentuk “di manakah ... itu” jelas, alami, dan sesuai dengan pertanyaan tentang arah.
- source_word: בֵּית הָרֹאֶה
  choice: rumah pelihat itu
  rationale: רֹאֶה adalah istilah lama bagi orang yang kemudian lebih lazim disebut nabi. “Pelihat” mempertahankan perbedaan istilah yang sengaja dijelaskan oleh narasi dalam 1 Samuel 9:9; konstruksi definit Ibrani diwakili oleh “itu”.
theological_decisions:
- issue: Pembedaan antara רֹאֶה (pelihat) dan istilah yang lebih umum untuk nabi
  choice: pelihat
  alternative: nabi
  rationale: Memakai “nabi” akan menghapus nuansa historis-leksikal yang secara eksplisit diterangkan dalam 1 Samuel 9:9. “Pelihat” mempertahankan istilah narasi tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Susunan kalimat dibuat alami bagi pembaca umum, sementara gambaran konkret tentang pintu gerbang dan istilah historis “pelihat” dipertahankan.
