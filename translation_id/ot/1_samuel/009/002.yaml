id: 1SA.9.2
reference: 1 Samuel 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/ל/וֹ הָיָ֨ה בֵ֜ן וּ/שְׁמ֤/וֹ שָׁאוּל֙ בָּח֣וּר וָ/ט֔וֹב וְ/אֵ֥ין אִ֛ישׁ מִ/בְּנֵ֥י יִשְׂרָאֵ֖ל ט֣וֹב מִמֶּ֑/נּוּ מִ/שִּׁכְמ֣/וֹ וָ/מַ֔עְלָ/ה גָּבֹ֖הַּ מִ/כָּל הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: id
  text: Ia mempunyai seorang anak laki-laki bernama Saul. Saul adalah seorang pemuda yang tampan[a]. Di antara orang Israel tidak ada seorang pun yang lebih tampan daripada dia. Dari bahunya ke atas, ia lebih tinggi daripada seluruh rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: elok rupanya.'
    reason: Kata Ibrani טוֹב pada dasarnya berarti 'baik' dan dalam konteks ini menggambarkan penampilan fisik Saul; 'elok rupanya' mempertahankan nuansa yang sedikit lebih luas daripada 'tampan'.
lexical_decisions:
- source_word: בֵן
  choice: anak laki-laki
  rationale: Dalam konteks keluarga Kish, kata ini menunjuk langsung kepada anak kandung laki-laki; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: bernama Saul
  rationale: Ungkapan ini menyampaikan identifikasi nama secara alami tanpa kehilangan isi konstruksi Ibrani 'dan namanya Saul'.
- source_word: בָּחוּר
  choice: pemuda
  rationale: Kata ini menggambarkan seorang laki-laki muda yang berada pada masa prima kehidupannya.
- source_word: טוֹב / וָטוֹב
  choice: tampan
  rationale: Dalam rangkaian gambaran fisik Saul dan perbandingan dengan laki-laki Israel lainnya, kata ini paling wajar dipahami sebagai penampilan yang menarik; catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: Di antara orang Israel tidak ada seorang pun
  rationale: '''Orang Israel'' merupakan padanan Indonesia yang alami bagi ungkapan idiomatis ''anak-anak Israel'', sedangkan ''seorang pun'' menyampaikan penyangkalan menyeluruh dalam konteks perbandingan Saul dengan para laki-laki Israel.'
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: Dari bahunya ke atas
  rationale: Terjemahan ini mempertahankan gambaran tubuh dalam teks Ibrani bahwa Saul menjulang di atas orang lain mulai dari bagian bahunya.
- source_word: גָּבֹהַּ מִכָּל הָעָם
  choice: ia lebih tinggi daripada seluruh rakyat
  rationale: Bentuk komparatif 'lebih tinggi' menyatakan perawakan Saul, dan 'seluruh rakyat' mempertahankan acuan kolektif הָעָם.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat pertama dipecah agar pengenalan Saul dan penggambaran dirinya mudah dipahami. Ungkapan ukuran tubuh dipertahankan cukup dekat dengan citra Ibrani, bukan diganti sepenuhnya dengan idiom Indonesia.
