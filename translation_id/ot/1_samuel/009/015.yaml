  text: וַֽ/יהוָ֔ה גָּלָ֖ה אֶת אֹ֣זֶן שְׁמוּאֵ֑ל י֣וֹם אֶחָ֔ד לִ/פְנֵ֥י בֽוֹא שָׁא֖וּל לֵ/אמֹֽר־־׃
