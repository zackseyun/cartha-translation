  text: Yahweh had revealed to Samuel one day before Saul came[a], saying,
translation:
  language: id
  text: 'Yahweh telah menyatakan kepada Samuel[a] sehari sebelum Saul datang, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyingkap telinga Samuel,” sebuah ungkapan Ibrani yang berarti menyingkapkan atau memberitahukan sesuatu kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai “Yahweh”. Waw berfungsi menghubungkan alur narasi dan tidak perlu diterjemahkan dengan kata penghubung tersendiri setelah keterangan waktu ditempatkan di awal.
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: telah menyatakan kepada Samuel
  rationale: Ungkapan harfiah “membuka telinga Samuel” adalah idiom untuk menyingkapkan atau memberitahukan sesuatu. “Telah menyatakan kepada Samuel” menyampaikan maknanya secara alami tanpa menghilangkan keterangan aspek lampau yang mendahului kejadian utama.
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: Sehari sebelum Saul datang
  rationale: Ungkapan waktu ini secara alami berarti satu hari sebelum kedatangan Saul. Penempatannya di awal menghasilkan kalimat Indonesia yang jelas dan lancar.
- source_word: לֵאמֹר
  choice: firman-Nya,
  rationale: Bentuk ini memperkenalkan perkataan langsung pada ayat berikutnya. Karena pembicaranya adalah Yahweh, “firman-Nya” lebih wajar dan bermartabat dalam bahasa Indonesia daripada terjemahan mekanis “dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; bentuk “Yahweh” mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Keterangan waktu ditempatkan di awal demi kejernihan, sedangkan idiom Ibrani dijelaskan dalam catatan kaki.
