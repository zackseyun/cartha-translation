  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: id
  text: Lalu Saul berkata kepada pelayannya, “Apa yang kaukatakan itu baik. Mari kita pergi.” Mereka pun pergi ke kota tempat orang Allah itu berada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Orang Allah” adalah gelar Ibrani yang lazim dipakai untuk seorang nabi atau orang yang berbicara atas nama Allah.
