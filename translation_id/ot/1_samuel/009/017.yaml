  text: וּ/שְׁמוּאֵ֖ל רָאָ֣ה אֶת שָׁא֑וּל וַ/יהוָ֣ה עָנָ֔/הוּ הִנֵּ֤ה הָ/אִישׁ֙ אֲשֶׁ֣ר אָמַ֣רְתִּי אֵלֶ֔י/ךָ זֶ֖ה יַעְצֹ֥ר בְּ/עַמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: id
  text: Ketika Samuel melihat Saul, Yahweh menjawabnya, “Lihat, inilah orang yang telah Kusebutkan kepadamu. Dialah yang akan memerintah umat-Ku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Dialah yang akan menahan atau mengendalikan umat-Ku.” Kata kerja Ibrani yang dipakai dapat berarti menahan, mengendalikan, atau memerintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: melihat
  rationale: Makna langsung verba ini adalah melihat; bentuk ini alami dalam urutan narasi Indonesia.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri Yahweh.
- source_word: עָנָהוּ
  choice: menjawabnya
  rationale: Mempertahankan arti dasar ענה, yakni menjawab atau menanggapi, meskipun tidak ada pertanyaan langsung dalam ayat ini.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel penunjuk perhatian ini diterjemahkan dengan seruan modern yang tetap mempertahankan daya tunjuknya.
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: inilah orang yang telah Kufirmankan kepadamu
  rationale: Menyampaikan klausa relatif secara alami dan bermartabat; 'Kufirmankan' menandai tuturan ilahi tanpa menambah isi.
- source_word: זֶה
  choice: Dialah
  rationale: Menjaga penegasan demonstratif terhadap Saul dalam bahasa Indonesia yang alami.
- source_word: יַעְצֹר
  choice: akan memerintah
  rationale: Dalam konteks penetapan Saul sebagai pemimpin, verba ini menunjuk pada pelaksanaan kendali atau pemerintahan; nuansa harfiahnya yang lebih luas dipertahankan dalam catatan kaki.
- source_word: בְּעַמִּי
  choice: umat-Ku
  rationale: Dengan verba יַעְצֹר, frasa ini menunjukkan pihak yang berada di bawah pemerintahan; relasi tersebut sudah tersirat secara alami dalam verba Indonesia 'memerintah'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Makna יַעְצֹר dalam kaitannya dengan kepemimpinan Saul
  choice: akan memerintah umat-Ku
  alternative: akan menahan / mengendalikan umat-Ku; akan memerintah atas umat-Ku
  rationale: Konteks kerajaan mendukung arti menjalankan kendali pemerintahan, tetapi verba Ibrani juga dapat berarti menahan atau mengendalikan. Ketegangan leksikal itu dicatat, bukan dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'umat-Ku' dipilih untuk עַמִּי, sedangkan 'Kufirmankan' mempertahankan suasana tuturan ilahi. Penanda catatan kaki ditempatkan setelah kalimat yang memuat istilah terkait.
