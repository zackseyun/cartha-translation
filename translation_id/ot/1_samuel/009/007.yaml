  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Pelayannya yang muda' menjaga unsur usia dan fungsi pendamping; 'abdi Allah' mempertahankan gelar tradisional tanpa menambahkan tafsiran denominasi.
