base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: id
  text: Lalu Saul berkata kepada pelayan mudanya, “Namun, jika kita pergi, apa yang akan kita bawa kepada orang itu? Roti dalam kantong-kantong kita sudah habis,[a] dan tidak ada pemberian[b] untuk dibawa kepada abdi Allah itu. Apa yang kita punya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti sudah habis dari wadah-wadah kita.” Kata yang diterjemahkan “kantong-kantong” secara umum berarti wadah atau bejana; dalam konteks ini, wadah untuk membawa bekal.
    reason: lexical_alternative
  - marker: b
    text: Atau “hadiah” atau “buah tangan”; yaitu sesuatu yang dibawa kepada orang yang dihormati.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: pelayannya yang muda
  rationale: Dalam konteks ini orang muda tersebut adalah pendamping Saul. Ungkapan ini mempertahankan unsur usia sekaligus menjelaskan perannya tanpa menyiratkan status budak.
- source_word: וְהִנֵּה
  choice: Tetapi
  rationale: Partikel ini mengarahkan perhatian pada keberatan praktis Saul. Dalam bahasa Indonesia alami, nuansa tersebut cukup diwakili oleh penghubung adversatif 'Tetapi'.
- source_word: נֵלֵךְ
  choice: jika kita pergi
  rationale: Bentuk imperfek berfungsi dalam konstruksi yang bernuansa syarat; 'jika kita pergi' menyampaikan hubungan itu secara alami.
- source_word: נָּבִיא
  choice: akan kita bawa
  rationale: Bentuk Hifil dari בוא berarti membawa sesuatu kepada seseorang. Susunan ini juga mempertahankan orientasi prospektif pertanyaan Saul.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna konkret kata Ibrani dipertahankan, meskipun dalam konteks perjalanan roti dapat mewakili bekal makanan secara lebih luas.
- source_word: כְּלִי
  choice: kantong-kantong
  rationale: Secara luas berarti wadah atau perlengkapan. Dalam konteks bekal perjalanan, 'kantong-kantong' merupakan padanan konkret dan mudah dipahami.
- source_word: תְּשׁוּרָה
  choice: pemberian
  rationale: Kata ini menunjuk pada hadiah atau buah tangan yang dibawa kepada orang yang dihormati. 'Pemberian' alami dan tidak menambahkan konotasi kurban ritual.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar bagi orang yang ditugaskan Allah. 'Abdi Allah' merupakan ungkapan Indonesia yang dikenal dan tidak menyempitkannya menjadi sekadar 'nabi'.
- source_word: מָה אִתָּנוּ
  choice: Apa yang masih kita punya?
  rationale: Idiom ini menanyakan apa yang tersedia pada mereka. Kata 'masih' membuat kaitannya dengan habisnya bekal dan tidak adanya pemberian terasa alami.
