  source_fidelity: 'Terjemahan pada dasarnya mencerminkan unsur-unsur Ibrani: Samuel berbicara kepada petugas penyedia makanan, memerintahkan agar bagian makanan yang sebelumnya telah ia berikan diserahkan/dibawa, dan mengacu pada perintah terdahulu untuk menyimpannya. Namun, bentuk “aku berkata” tidak tepat untuk tindakan tutur yang telah terjadi sebelumnya dan perlu menjadi bentuk perfek.'
  naturalness: “Yang tentangnya aku berkata kepadamu” tidak alami dalam bahasa Indonesia baku dan secara waktu tidak selaras dengan konteks. “Yang tentangnya telah kukatakan kepadamu” lebih wajar dan tetap mempertahankan pengulangan klausa relatif. “Simpanlah itu padamu” dapat dipahami, tetapi “Simpanlah itu di sisimu” lebih alami sambil tetap menyatakan gagasan Ibrani “bersamamu/di dekatmu.”
  terminology: “Juru masak” sesuai dengan konteks jamuan dan merupakan padanan modern yang baik untuk טַבָּח; catatan alternatif “penyembelih” mempertahankan kemungkinan leksikal tanpa mengganggu teks utama. “Bagian” tepat untuk מָנָה. “Bawalah” sah secara kontekstual bagi imperatif “berikanlah.”
