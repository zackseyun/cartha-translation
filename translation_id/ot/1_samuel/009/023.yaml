translation:
  language: id
  text: Lalu Samuel berkata kepada juru masak[a], “Bawalah bagian yang telah kuberikan kepadamu, yang tentangnya telah kukatakan kepadamu, ‘Simpanlah itu di sisimu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penyembelih.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: טַּבָּח
  choice: juru masak
  rationale: Dalam konteks perjamuan ini, orang tersebut bertanggung jawab menyiapkan dan menyajikan daging; ‘juru masak’ paling alami dalam bahasa Indonesia, meskipun secara leksikal kata itu juga dapat menunjuk kepada penyembelih.
- source_word: תְּנָה
  choice: Bawalah
  rationale: Secara harfiah berarti ‘berikanlah’, tetapi dalam konteks ini Samuel meminta agar bagian yang telah disimpan dibawa dan disajikan.
- source_word: מָּנָה
  choice: bagian
  rationale: Kata ini menunjuk pada jatah atau bagian makanan yang ditetapkan bagi seseorang; ‘bagian’ ringkas, alami, dan mempertahankan gagasan pembagian.
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: yang telah kuberikan kepadamu
  rationale: Mempertahankan arti langsung verba ‘memberi’ dan hubungan retrospektif dengan tindakan Samuel sebelumnya.
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: yang tentangnya aku berkata kepadamu
  rationale: Mempertahankan klausa relatif kedua dan pengulangan struktur Ibrani tanpa menyamakan perkataan itu dengan pemberian.
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: Simpanlah itu padamu
  rationale: Mengungkapkan tindakan menaruh atau menahan sesuatu tetap bersama orang itu; konteksnya menyiratkan bahwa bagian tersebut dicadangkan, sementara ‘padamu’ mempertahankan unsur עִמָּךְ.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur klausa relatif dipertahankan cukup dekat dengan bahasa Ibrani, tetapi perintah disampaikan secara idiomatis. Bentuk terikat ‘kuberikan’ dan ‘aku berkata’ mengikuti pergantian wajar antara narasi dan ujaran langsung.
