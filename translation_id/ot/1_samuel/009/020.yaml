  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: id
  text: Mengenai keledai-keledaimu yang hilang tiga hari yang lalu, jangan lagi pikirkan mereka, sebab mereka sudah ditemukan. Lagi pula, untuk siapakah segala yang didambakan Israel itu?[a] Bukankah untukmu dan untuk seluruh keluarga ayahmu?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala yang berharga di Israel.” Frasa Ibrani ini dapat merujuk pada apa yang didambakan Israel atau pada apa yang berharga di Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah ayahmu,” yaitu ungkapan bagi rumah tangga, keluarga besar, atau kaum kekerabatan, bukan hanya keluarga inti.
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: keledai-keledai
  rationale: Kata Ibrani ini secara khusus menunjuk keledai betina, tetapi jenis kelaminnya tidak penting dalam konteks ini; bentuk umum lebih alami dalam bahasa Indonesia.
- source_word: הָאֹבְדוֹת
  choice: yang hilang
  rationale: Mempertahankan keadaan hewan-hewan itu sebagai hilang atau tidak ditemukan.
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: tiga hari yang lalu
  rationale: Ungkapan waktu Ibrani ini secara idiomatis menunjuk pada tiga hari sebelumnya.
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: jangan lagi pikirkan mereka
  rationale: Mengungkapkan idiom harfiah 'jangan taruh hatimu kepada mereka' sebagai larangan untuk terus mencurahkan perhatian atau kekhawatiran; 'lagi' sesuai dengan perubahan keadaan karena keledai-keledai itu sudah ditemukan.
- source_word: נִמְצָאוּ
  choice: mereka sudah ditemukan
  rationale: Bentuk Nifal perfektif menyatakan hasil pasif yang kini berlaku.
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: untuk siapakah segala yang didambakan Israel itu?
  rationale: Menjaga daya retoris dan salah satu kemungkinan utama חֶמְדַּת, sambil memberi catatan mengenai kemungkinan makna 'segala yang berharga di Israel'.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban setuju.
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: untukmu dan untuk seluruh kaum ayahmu
  rationale: '''Kaum ayah'' mempertahankan ungkapan kekerabatan Ibrani yang lebih luas daripada keluarga inti.'
theological_decisions:
- issue: Makna pernyataan Samuel tentang חֶמְדַּת יִשְׂרָאֵל
  choice: Pernyataan retoris yang menunjuk kepada Saul dan kaum ayahnya sebagai sasaran segala yang didambakan Israel, dengan ambiguitas leksikal dijelaskan dalam catatan.
  alternative: Segala yang berharga di Israel adalah bagi Saul dan kaum ayahnya; atau ungkapan ini secara khusus menunjuk pada jabatan raja yang diinginkan Israel.
  rationale: Ayat ini tidak menyebut kerajaan atau jabatan raja secara eksplisit. Karena frasa Ibraninya padat dan dapat dipahami secara subjektif maupun objektif, terjemahan tidak memasukkan kesimpulan teologis yang lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kaum ayahmu' dipilih untuk mempertahankan cakupan sosial ungkapan Ibrani tanpa memakai terjemahan harfiah yang dapat disalahpahami sebagai bangunan rumah.
