  yaml_path: translation/ot/1_samuel/009/014.yaml
  text: So they went up to the city. As they were entering the city[a], behold, Samuel was coming out to meet them, to go up to the high place.
translation:
  language: id
  text: Lalu mereka naik ke kota itu. Ketika mereka memasuki kota itu[a], tampaklah Samuel keluar menemui mereka untuk naik ke tempat tinggi itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di tengah-tengah kota itu”; dapat juga diterjemahkan “ketika mereka berada di dalam kota itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ הָעִיר
  choice: mereka naik menuju kota itu
  rationale: Kata עלה menyatakan gerak naik, kemungkinan sesuai dengan letak kota yang lebih tinggi; 'naik menuju' alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: הֵמָּה בָּאִים בְּתוֹךְ הָעִיר
  choice: ketika mereka memasuki kota itu
  rationale: Pronomina mandiri dengan partisipel menggambarkan tindakan yang sedang berlangsung. בתוך secara harfiah berarti 'di tengah/dalam', tetapi dalam konteks gerak masuk idiomatis berarti memasuki atau berada di dalam kota; alternatif harfiah dicatat dalam catatan kaki.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Penanda wacana ini mengarahkan perhatian kepada kemunculan yang mendadak atau penting. 'Tampaklah' mempertahankan daya hidup narasi dengan ragam Indonesia yang bermartabat.
- source_word: שְׁמוּאֵל יֹצֵא לִקְרָאתָם
  choice: Samuel keluar menemui mereka
  rationale: Partisipel יֹצֵא menyajikan Samuel dalam proses keluar, sedangkan לִקְרָאתָם menyatakan gerak untuk bertemu mereka. Susunan ini alami dan tetap dekat dengan gambaran Ibrani.
- source_word: לַעֲלוֹת הַבָּמָה
  choice: untuk naik ke bukit pengurbanan
  rationale: במה adalah tempat ibadah atau pengurbanan yang ditinggikan. 'Bukit pengurbanan' menyampaikan unsur lokasi tinggi sekaligus fungsi kultisnya tanpa menyisipkan penilaian negatif.
theological_decisions:
- issue: Penerjemahan istilah tempat ibadah במה
  choice: bukit pengurbanan
  alternative: tempat tinggi; tempat ibadah di bukit
  rationale: Istilah itu menunjuk tempat ibadah dan pengurbanan yang ditinggikan dalam Israel sebelum pembangunan Bait Allah. Pilihan ini mempertahankan sifat historis dan kultisnya tanpa memasukkan penilaian teologis dari konteks lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang jelas dan bermartabat. 'Tampaklah' dipakai sebagai padanan alami bagi penanda perhatian וְהִנֵּה, sedangkan 'bukit pengurbanan' membuat istilah kultis במה dapat dipahami pembaca umum.
