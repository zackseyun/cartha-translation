  text: וַ/יֹּ֤סֶף הַ/נַּ֨עַר֙ לַ/עֲנ֣וֹת אֶת שָׁא֔וּל וַ/יֹּ֕אמֶר הִנֵּה֙ נִמְצָ֣א בְ/יָדִ֔/י רֶ֖בַע שֶׁ֣קֶל כָּ֑סֶף וְ/נָֽתַתִּי֙ לְ/אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/הִגִּ֥יד לָ֖/נוּ אֶת דַּרְכֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: id
  text: Pemuda itu menjawab Saul lagi, katanya, “Lihat, di tanganku ada seperempat syikal perak. Aku akan memberikannya kepada orang Allah itu, dan ia akan memberitahukan jalan kita[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan yang harus kita tempuh.” Secara harfiah, bahasa Ibrani berbunyi “jalan kita,” yang dapat merujuk pada rute di depan mereka atau pada tindakan yang harus mereka ambil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: menjawab ... lagi
  rationale: Ungkapan יסף dengan infinitif menyatakan tindakan yang diulangi atau dilanjutkan. Dalam konteks ini, pemuda itu kembali menjawab keberatan Saul.
- source_word: הַנַּעַר
  choice: pemuda itu
  rationale: Kata נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. “Pemuda itu” mempertahankan arti leksikal tanpa menonjolkan peran sosialnya secara berlebihan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Interjeksi ini menarik perhatian kepada sesuatu yang segera ditunjukkan atau dikemukakan; “Lihat” wajar dalam bahasa Indonesia modern.
- source_word: נִמְצָא בְיָדִי
  choice: aku punya
  rationale: Secara harfiah ungkapan ini berarti sesuatu “didapati di tanganku,” tetapi dalam konteks menyatakan kepemilikan. “Aku punya” menyampaikan maksud itu secara alami.
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: seperempat syikal perak
  rationale: Ungkapan ini menyebut seperempat dari satuan berat syikal dalam bentuk perak; transliterasi “syikal” mempertahankan satuan kuno tersebut.
- source_word: וְנָתַתִּי
  choice: Akan kuberikan itu
  rationale: Bentuk perfektif di sini menyatakan niat atau tindakan yang akan dilakukan dalam konteks percakapan.
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: kepada abdi Allah
  rationale: אִישׁ הָאֱלֹהִים adalah gelar baku bagi seorang yang ditugaskan Allah. “Abdi Allah” merupakan padanan Indonesia yang ringkas dan bermartabat tanpa secara eksplisit menggantinya dengan “nabi.”
- source_word: וְהִגִּיד לָנוּ
  choice: lalu ia akan memberitahukan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. “Memberitahukan” cocok dengan permintaan petunjuk dalam konteks ini.
- source_word: אֶת דַּרְכֵּנוּ
  choice: jalan kita
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang dapat menunjuk pada rute perjalanan maupun langkah yang patut mereka ambil.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern dan bermartabat. Sapaan orang pertama memakai “aku” sesuai percakapan antarpribadi, sedangkan istilah kuno “syikal” dipertahankan karena merupakan satuan berat perak. Ambiguitas “jalan kita” dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
