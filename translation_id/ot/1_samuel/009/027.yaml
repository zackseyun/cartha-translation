  source_fidelity: Teks dengan setia menyampaikan gerak yang sedang berlangsung, lokasi di tepi kota, perintah agar pendamping Saul berjalan di depan, pelaksanaan perintah itu, lalu perintah Samuel kepada Saul untuk berhenti sejenak agar menerima firman Allah. Nuansa kausatif וְאַשְׁמִיעֲךָ terpelihara dengan “aku akan memperdengarkan ... kepadamu.”
