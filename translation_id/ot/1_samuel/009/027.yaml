  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֗מָּה יֽוֹרְדִים֙ בִּ/קְצֵ֣ה הָ/עִ֔יר וּ/שְׁמוּאֵ֞ל אָמַ֣ר אֶל שָׁא֗וּל אֱמֹ֥ר לַ/נַּ֛עַר וְ/יַעֲבֹ֥ר לְ/פָנֵ֖י/נוּ וַֽ/יַּעֲבֹ֑ר וְ/אַתָּה֙ עֲמֹ֣ד כַּ/יּ֔וֹם וְ/אַשְׁמִיעֲ/ךָ֖ אֶת דְּבַ֥ר אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: id
  text: Ketika mereka sedang turun ke tepi kota, Samuel berkata kepada Saul, “Suruhlah pemuda itu[a] berjalan mendahului kita.” Pemuda itu pun berjalan mendahului mereka. “Tetapi engkau, berhentilah di sini sekarang[b], dan aku akan memperdengarkan firman Allah kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan itu”. Kata Ibrani נַעַר dapat merujuk pada pemuda, pembantu, atau pelayan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berdirilah sekarang/pada waktu ini”; ungkapan ini berarti berhenti dan tetap di tempat untuk sementara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: sedang turun
  rationale: Bentuk partisip menunjukkan tindakan yang sedang berlangsung dalam alur cerita; ‘sedang turun’ alami dalam bahasa Indonesia dan mempertahankan arah gerak.
- source_word: בִּקְצֵה הָעִיר
  choice: ke tepi kota
  rationale: קָצֶה menunjuk pada ujung atau tepi. ‘Tepi kota’ lebih dekat pada bentuk Ibrani daripada ‘pinggiran kota’, yang sedikit lebih interpretatif.
- source_word: אֱמֹר לַנַּעַר
  choice: Suruhlah pemuda itu
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pembantu. ‘Pemuda’ mempertahankan keluasan makna leksikal, sedangkan konteks bahwa ia adalah pelayan Saul dijelaskan sebagai alternatif dalam catatan kaki.
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: berjalan mendahului kita
  rationale: עבר dengan לִפְנֵי menyatakan gerak ke depan di hadapan orang lain. ‘Berjalan mendahului kita’ jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיַּעֲבֹר
  choice: Pemuda itu pun berjalan mendahului mereka
  rationale: Subjek tersirat dijelaskan sebagai ‘pemuda itu’ agar alur bahasa Indonesia tidak rancu; ‘pun’ menandai bahwa perintah tersebut segera dilaksanakan.
- source_word: עֲמֹד כַּיּוֹם
  choice: berhentilah di sini sekarang
  rationale: Ungkapan Ibrani secara harfiah sulit (‘berdirilah seperti hari ini/pada waktu ini’). Dalam konteks, Saul diminta berhenti dan tetap di tempat untuk saat itu; ‘di sini’ tersirat dari situasi.
- source_word: וְאַשְׁמִיעֲךָ
  choice: aku akan memperdengarkan ... kepadamu
  rationale: Bentuk Hifil dari שׁמע bersifat kausatif, yaitu ‘membuat engkau mendengar’. ‘Memperdengarkan kepadamu’ mempertahankan nuansa itu dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: דְּבַר אֱלֹהִים
  choice: firman Allah
  rationale: Dalam konteks pewahyuan kenabian, ‘firman Allah’ mempertahankan bobot teologis dan tradisi ungkapan tersebut tanpa menentukan isi pesannya lebih jauh.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Di sini אֱלֹהִים merujuk dalam arti tunggal kepada Allah Israel; ‘Allah’ adalah padanan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan rumusan pewahyuan דְּבַר אֱלֹהִים
  choice: firman Allah
  alternative: pesan Allah
  rationale: Ungkapan ini tampaknya memperkenalkan penyataan ilahi yang akan disampaikan Samuel kepada Saul. ‘Firman Allah’ menjaga resonansi kenabian dan teologis tanpa menafsirkan secara berlebihan bentuk atau isi penyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat alami tanpa menghilangkan gerak turun, pelaksanaan perintah, nuansa kausatif ‘memperdengarkan’, atau bobot kenabian ‘firman Allah’. Pronomina ‘engkau’ dipakai dalam ujaran langsung untuk menjaga register sastra Alkitab yang tetap mudah dipahami.
