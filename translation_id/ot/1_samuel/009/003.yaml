  text: וַ/תֹּאבַ֨דְנָה֙ הָ/אֲתֹנ֔וֹת לְ/קִ֖ישׁ אֲבִ֣י שָׁא֑וּל וַ/יֹּ֨אמֶר קִ֜ישׁ אֶל שָׁא֣וּל בְּנ֗/וֹ קַח נָ֤א אִתְּ/ךָ֙ אֶת אַחַ֣ד מֵֽ/הַ/נְּעָרִ֔ים וְ/ק֣וּם לֵ֔ךְ בַּקֵּ֖שׁ אֶת הָ/אֲתֹנֹֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: id
  text: Keledai-keledai betina milik Kish, ayah Saul, hilang. Maka Kish berkata kepada Saul, anaknya, “Tolong ajaklah salah seorang pemuda[a] dan bangunlah, pergilah mencari keledai-keledai itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “salah seorang pelayan” atau “salah seorang pengiring.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: hilang
  rationale: Bentuk verba ini dalam konteks tersebut menyatakan bahwa hewan-hewan itu tidak ditemukan lagi, bukan bahwa mereka mati. “Hilang” alami dan tidak menentukan penyebabnya.
- source_word: הָאֲתֹנוֹת
  choice: keledai-keledai betina
  rationale: Nomina Ibrani secara khusus menunjuk keledai betina. Bahasa Indonesia dapat menyatakannya secara wajar tanpa menjadi terlalu teknis.
- source_word: לְקִישׁ
  choice: milik Kish
  rationale: Preposisi לְ di sini menandai kepemilikan; “milik Kish” ringkas dan jelas.
- source_word: אֲבִי שָׁאוּל
  choice: ayah Saul
  rationale: Rangkaian konstruksi diterjemahkan secara langsung dan alami.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan naratif baku untuk אמר dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Mempertahankan keterangan hubungan keluarga yang secara eksplisit ada dalam teks Ibrani.
- source_word: קַח נָא אִתְּךָ
  choice: Tolong ajaklah
  rationale: נָא melembutkan perintah dan diterjemahkan dengan “tolong”; “ajaklah” secara alami menyampaikan tindakan membawa seseorang menyertai diri.
- source_word: אַחַד מֵהַנְּעָרִים
  choice: salah seorang pelayan muda
  rationale: נְעָרִים dapat berarti orang muda, pelayan, atau pengiring. Dalam rumah tangga Kish, “pelayan muda” mempertahankan unsur usia sekaligus fungsi yang tersirat; ambiguitasnya dicatat dalam catatan kaki.
- source_word: וְקוּם לֵךְ
  choice: pergilah
  rationale: Pasangan imperatif harfiah “bangunlah, pergilah” merupakan ungkapan untuk segera mulai bertindak. “Pergilah” lebih alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa Saul sedang duduk atau tidur.
- source_word: בַּקֵּשׁ
  choice: mencari
  rationale: Padanan Indonesia yang langsung, modern, dan sesuai untuk upaya menemukan hewan yang hilang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku-modern dengan gaya naratif yang lugas dan bermartabat. Bentuk jamak ulang dipakai untuk kejelasan, sedangkan rangkaian imperatif Ibrani diungkapkan secara idiomatis. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
