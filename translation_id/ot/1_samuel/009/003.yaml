  naturalness: Bahasa draf pada umumnya baku dan alami. “Bangunlah, pergilah” tetap jelas dan wajar dalam gaya naratif Indonesia, sekaligus lebih dekat pada rangkaian imperatif Ibrani.
  terminology: “Keledai-keledai betina” secara leksikal akurat. “Salah seorang pemuda” mempertahankan ambiguitas sosial נְעָרִים lebih baik daripada “pelayan muda”; kemungkinan lain dicatat dalam catatan kaki.
