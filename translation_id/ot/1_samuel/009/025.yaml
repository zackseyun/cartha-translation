  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: id
  text: Lalu mereka turun dari tempat tinggi itu ke kota,[a] dan ia berbicara dengan Saul di atap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Setelah mereka turun dari tempat tinggi itu ke kota, ia berbicara dengan Saul di atap.”'
    reason: Rangkaian verba naratif Ibrani dapat diterjemahkan sebagai dua tindakan berurutan yang setara atau, dalam bahasa Indonesia, dengan anak kalimat waktu.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: Setelah mereka turun
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. Dalam bahasa Indonesia, “setelah” menghubungkan tindakan jamak ini secara alami dengan tindakan subjek tunggal berikutnya, tanpa mengubah urutan kejadian.
- source_word: מֵהַבָּמָה
  choice: dari bukit pengurbanan
  rationale: בָּמָה menunjuk pada tempat tinggi yang digunakan untuk kegiatan ibadah atau persembahan. “Bukit pengurbanan” mempertahankan unsur ketinggian dan fungsi kultisnya tanpa menyempitkannya menjadi kuil tertentu.
- source_word: הָעִיר
  choice: menuju kota
  rationale: Dalam konstruksi dengan verba gerak, kata ini menyatakan tujuan turunnya mereka. “Menuju kota” alami dalam bahasa Indonesia dan tidak memaksakan bahwa tempat tinggi itu pasti berada di luar batas kota.
- source_word: וַיְדַבֵּר
  choice: ia berbicara
  rationale: Verba beralih dari subjek jamak ke tunggal. Pronomina “ia” mempertahankan bentuk tunggal teks Ibrani tanpa menambahkan nama subjek secara eksplisit.
- source_word: עִם שָׁאוּל
  choice: dengan Saul
  rationale: Preposisi עִם secara wajar berarti “dengan” dan memberi kesan percakapan bersama Saul, bukan semata-mata perkataan satu arah kepadanya.
- source_word: עַל הַגָּג
  choice: di atas atap rumah
  rationale: גָּג merujuk pada atap datar yang dapat digunakan sebagai tempat beraktivitas. Ungkapan ini jelas dan alami bagi pembaca Indonesia modern.
