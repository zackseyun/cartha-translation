base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: id
  text: Kemudian Samuel mengajak Saul dan pemudanya[a], lalu membawa mereka masuk ke ruang perjamuan[b]. Ia memberi mereka tempat di tempat terdepan di antara para undangan; mereka berjumlah kira-kira tiga puluh orang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pelayannya” atau “ajudannya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ruangan” atau “kamar.” Kata Ibrani ini dapat menunjuk kepada kamar, ruangan, atau balai; dalam konteks ini kemungkinan menunjuk pada tempat jamuan yang lebih besar.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dan mereka kira-kira tiga puluh orang.” Kemungkinan merujuk kepada para undangan yang hadir.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: Dalam konteks narasi, נַעַר menunjuk kepada bawahan yang menyertai Saul. 'Pelayannya' alami dalam bahasa Indonesia dan tidak mengharuskan arti budak.
- source_word: לִשְׁכָּתָה
  choice: ke ruang perjamuan
  rationale: לִשְׁכָּה dapat berarti kamar, ruangan, atau balai. Konteks jamuan dan sekitar tiga puluh undangan mendukung ruangan yang dipakai untuk perjamuan.
- source_word: מָקוֹם
  choice: tempat
  rationale: '''Tempat'' mempertahankan arti dasar kata Ibrani dan dalam konteks jamuan secara alami mencakup tempat duduk.'
- source_word: בְּרֹאשׁ
  choice: di bagian terdepan
  rationale: Ungkapan ini menandakan posisi utama atau terhormat; 'di bagian terdepan' mempertahankan gambaran posisi tanpa menambahkan rincian tentang bentuk tempat duduk.
- source_word: הַקְּרוּאִים
  choice: para undangan
  rationale: Partisip pasif dari קרא dalam konteks pesta berarti orang-orang yang telah dipanggil atau diundang; 'para undangan' ringkas dan alami.
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: mereka berjumlah kira-kira tiga puluh orang
  rationale: Klausa ini paling wajar merujuk kepada para undangan yang baru disebut. 'Orang' alami dalam bahasa Indonesia untuk jumlah kelompok, tanpa mengubah referennya.
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Walau arti dasarnya 'mengambil', dalam rangkaian tindakan ini Samuel mengajak atau membawa Saul dan pelayannya menuju ruangan; 'membawa' lebih alami dan tidak mengesankan tindakan fisik mengambil.
- source_word: וַיְבִיאֵם
  choice: masuk
  rationale: Hifil בוא berarti membawa masuk. Digabung dengan 'membawa' pada verba sebelumnya, susunan 'membawa ... masuk ke' menyampaikan kedua tindakan secara lancar tanpa pengulangan kaku.
