  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan bermartabat. 'Ruang perjamuan' memperjelas fungsi tempat berdasarkan konteks, sedangkan alternatif yang lebih harfiah dicatat. Tanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
