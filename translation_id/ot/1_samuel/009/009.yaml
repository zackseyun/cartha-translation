id: 1SA.9.9
reference: 1 Samuel 9:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: id
  text: Dahulu di Israel[a], ketika seorang laki-laki pergi untuk meminta petunjuk dari Allah, ia biasa berkata, “Mari, kita pergi kepada pelihat,” sebab orang yang pada masa kini disebut nabi dahulu disebut pelihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Pada zaman dahulu di Israel.”
    reason: Alternatif idiomatis bagi לְפָנִים yang menyatakan waktu lampau.
lexical_decisions:
- source_word: לְפָנִים
  choice: dahulu
  rationale: Adverbia temporal ini berarti “dahulu” atau “pada masa lampau.” Pilihan yang sama tercermin pada kedua kemunculannya untuk mempertahankan kontras dengan הַיּוֹם.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Frasa lokatif yang menunjukkan tempat berlakunya kebiasaan yang dijelaskan.
- source_word: כֹּה אָמַר
  choice: ia biasa berkata
  rationale: Bentuk harfiahnya “demikianlah ia berkata,” tetapi dalam konteks kebiasaan masa lampau, bahasa Indonesia alami memakai “biasa berkata.”
- source_word: הָאִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal maskulin ini dipakai secara generik. Terjemahan mempertahankan bentuk maskulinnya tanpa menganggap bahwa perkataan tersebut hanya berlaku bagi satu individu tertentu.
- source_word: בְּלֶכְתּוֹ
  choice: ketika ... pergi
  rationale: Infinitif konstruk dengan sufiks pronominal berfungsi sebagai keterangan waktu dan paling alami diterjemahkan dengan anak kalimat “ketika ... pergi.”
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: untuk meminta petunjuk dari Allah
  rationale: Dalam konteks mendatangi seorang pelihat, דָּרַשׁ menunjuk pada upaya memperoleh jawaban atau petunjuk ilahi. Pilihan ini lebih spesifik daripada sekadar “mencari Allah” dan lebih alami daripada terjemahan harfiah yang kaku.
- source_word: לְכוּ וְנֵלְכָה
  choice: Mari, kita pergi
  rationale: Ungkapan ini menyampaikan gabungan imperatif dan kohortatif sebagai ajakan bersama yang wajar dalam bahasa Indonesia.
- source_word: עַד הָרֹאֶה
  choice: kepada pelihat
  rationale: Dalam ungkapan gerak ini, עַד menandai tujuan, sedangkan רֹאֶה merupakan gelar lama bagi tokoh kenabian.
- source_word: לַנָּבִיא
  choice: nabi
  rationale: Padanan baku bagi נָבִיא. Dalam konstruksi Indonesia “disebut nabi,” artikel Ibrani tidak perlu dinyatakan dengan kata terpisah.
- source_word: הַיּוֹם
  choice: pada masa kini
  rationale: Ungkapan ini mempertahankan kontras sudut pandang narator antara istilah yang berlaku sekarang dan istilah yang dipakai dahulu.
- source_word: יִקָּרֵא
  choice: disebut
  rationale: Bentuk pasif ini menerangkan sebutan atau nama gelar; “disebut” mempertahankan sifat pasif tanpa memaksakan penafsiran tambahan.
- source_word: הָרֹאֶה
  choice: pelihat
  rationale: Padanan ringkas dan lazim untuk gelar teknis רֹאֶה, yang secara harfiah berkaitan dengan tindakan melihat.
theological_decisions:
- issue: Maskulin generik pada הָאִישׁ
  choice: seorang laki-laki
  alternative: seseorang; seorang
  rationale: Teks Ibrani memakai bentuk tunggal maskulin secara generik. Terjemahan mempertahankan ciri itu tanpa mengubahnya menjadi pernyataan tentang satu tokoh tertentu.
- issue: Makna דָּרַשׁ אֱלֹהִים dalam konteks kenabian
  choice: meminta petunjuk dari Allah
  alternative: mencari Allah; bertanya kepada Allah
  rationale: Konteks perjalanan kepada pelihat menunjukkan pencarian jawaban atau bimbingan ilahi. Rumusan ini mempertahankan nuansa konsultatif tanpa menetapkan teori tertentu tentang cara kerja nubuat.
- issue: Hubungan antara gelar “nabi” dan “pelihat”
  choice: orang yang pada masa kini disebut nabi dahulu disebut pelihat
  alternative: nabi masa kini dahulu disebut sang pelihat
  rationale: Rumusan utama mempertahankan penjelasan historis tentang perubahan sebutan dan tidak menyatakan bahwa kedua istilah selalu identik dalam setiap konteks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Pelihat” dipertahankan sebagai gelar historis yang berbeda dari “nabi,” sedangkan susunan kalimat terakhir dibuat alami tanpa menghilangkan kontras antara masa kini dan dahulu.
