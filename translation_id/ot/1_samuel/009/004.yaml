  terminology: Istilah geografis dan nama diri konsisten. "Keledai-keledai itu" jelas, idiomatis, dan tidak menambah rincian di luar konteks langsung. Catatan kaki pada ungkapan eliptis memelihara kemungkinan terjemahan harfiah tanpa mengaburkan teks utama.
