  source_fidelity: 'Terjemahan dengan tepat mengikuti urutan dan pergantian subjek dalam Ibrani: tunggal untuk Saul pada perjalanan pertama dan terakhir, jamak untuk Saul dan hambanya pada bagian tengah serta pada tindakan menemukan. "Daerah pegunungan Efraim" mencerminkan בְּהַר אֶפְרַיִם dengan baik; "wilayah" tepat untuk ketiga nama daerah. Objek tersirat pada "tidak menemukan" dijelaskan secara wajar sebagai keledai yang hilang dalam konteks, dan וָאַיִן ditafsirkan secara kontekstual sebagai ketidakhadiran keledai-keledai itu.'
