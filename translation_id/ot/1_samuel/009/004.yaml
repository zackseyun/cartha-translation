source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: id
  text: Ia berjalan melintasi daerah pegunungan Efraim dan melintasi wilayah Salisa, tetapi mereka tidak menemukan keledai-keledai itu. Kemudian mereka melintasi wilayah Saalim, tetapi keledai-keledai itu tidak ada di sana.[a] Lalu ia melintasi wilayah Benyamin, tetapi mereka tidak menemukan keledai-keledai itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tetapi tidak ada” atau “tetapi tidak ada apa-apa”; ungkapan ringkas ini dalam konteks menunjuk pada keledai-keledai yang dicari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: berjalan melintasi / melintasi
  rationale: Kata kerja עבר dengan בְ menyatakan gerak melewati atau menjelajahi suatu daerah. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan pergantian subjek tunggal serta jamak dalam bahasa Ibrani.
- source_word: בְּהַר אֶפְרַיִם
  choice: daerah pegunungan Efraim
  rationale: Dalam ungkapan geografis, הַר menunjuk kawasan berbukit atau bergunung, bukan satu gunung saja.
- source_word: אֶרֶץ שָׁלִשָׁה / אֶרֶץ שַׁעֲלִים
  choice: wilayah Salisa / wilayah Saalim
  rationale: אֶרֶץ di sini menunjuk daerah bernama. 'Wilayah' terdengar alami dan tidak menentukan status politik kawasan tersebut.
- source_word: וְלֹא מָצָאוּ
  choice: tetapi mereka tidak menemukan keledai-keledai itu
  rationale: Kata kerja berbentuk jamak menunjuk Saul dan hambanya. Objeknya tersirat dari konteks sebelumnya dan dinyatakan secara eksplisit agar jelas dalam bahasa Indonesia.
- source_word: וָאַיִן
  choice: tetapi keledai-keledai itu tidak ada di sana
  rationale: Ungkapan Ibrani ini sangat ringkas, secara harfiah 'dan tidak ada'. Terjemahan menjelaskan rujukan eliptisnya, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: אֶרֶץ יְמִינִי
  choice: wilayah Benyamin
  rationale: Bentuk gentilik יְמִינִי dalam konteks geografis paling wajar dipahami sebagai wilayah suku Benyamin.
