  text: כְּ/בֹאֲ/כֶ֣ם הָ/עִ֣יר כֵּ֣ן תִּמְצְא֣וּ/ן אֹת֡/וֹ בְּ/טֶרֶם֩ יַעֲלֶ֨ה הַ/בָּמָ֜תָ/ה לֶ/אֱכֹ֗ל כִּ֠י לֹֽא יֹאכַ֤ל הָ/עָם֙ עַד בֹּא֔/וֹ כִּֽי הוּא֙ יְבָרֵ֣ךְ הַ/זֶּ֔בַח אַחֲרֵי כֵ֖ן יֹאכְל֣וּ הַ/קְּרֻאִ֑ים וְ/עַתָּ֣ה עֲל֔וּ כִּֽי אֹת֥/וֹ כְ/הַ/יּ֖וֹם תִּמְצְא֥וּ/ן אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: id
  text: Begitu kalian memasuki kota, kalian akan menemukannya sebelum ia naik ke tempat tinggi[b] untuk makan. Orang-orang tidak akan makan sebelum ia datang, karena dialah yang memberkati kurban[c]. Sesudah itu, barulah para undangan akan makan. Jadi, naiklah sekarang, sebab hari ini[a] kalian akan menemukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «pada waktu ini». Ungkapan Ibrani כְהַיּוֹם dapat menekankan waktu yang sedang berlangsung atau kesegeraan, bukan hanya hari kalender.
    reason: lexical_alternative
  - marker: b
    text: «Tempat tinggi» adalah lokasi ibadah yang ditinggikan, tempat kurban dan perjamuan kurban diadakan.
    reason: cultural_note
  - marker: c
    text: «Memberkati kurban» kemungkinan berarti mengucapkan berkat yang berkaitan dengan perjamuan kurban sebelum para undangan makan.
    reason: cultural_note
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: Begitu kalian memasuki kota
  rationale: Konstruksi temporal dengan כ dan infinitif בוא menyatakan waktu kedatangan; “begitu” menyampaikan kedekatan waktu secara alami dalam bahasa Indonesia.
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: kalian akan menemukannya
  rationale: כֵּן menegaskan hasil atau kepastian dalam konteks ini; maknanya sudah tersampaikan secara alami tanpa padanan tersendiri yang kaku.
- source_word: בְּטֶרֶם יַעֲלֶה
  choice: sebelum ia naik
  rationale: בְּטֶרֶם menandai waktu yang mendahului, sedangkan עלה mempertahankan arah gerak ke atas.
- source_word: הַבָּמָתָה
  choice: ke tempat pemujaan di bukit
  rationale: במה menunjuk pada tempat tinggi yang digunakan untuk kegiatan kurban dan perjamuan. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada terjemahan harfiah “tempat tinggi,” sementara catatan kaki menjelaskan latar budayanya.
- source_word: לֶאֱכֹל
  choice: untuk makan
  rationale: Infinitif ini secara langsung berarti “untuk makan”; konteks berikutnya menjelaskan bahwa yang dimaksud ialah perjamuan kurban.
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: Orang-orang tidak akan makan sebelum ia datang
  rationale: Imperfek menyatakan kejadian yang akan berlangsung dalam konteks narasi. “Sebelum ia datang” merupakan ungkapan Indonesia yang alami bagi batas waktu yang dinyatakan oleh עַד.
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: karena dialah yang memberkati kurban
  rationale: Kata ganti הוּא bersifat menegaskan, sehingga diterjemahkan “dialah.” זבח tetap diterjemahkan langsung sebagai “kurban,” tanpa menyempitkannya hanya menjadi perjamuan.
- source_word: אַחֲרֵי כֵן יֹאכְלוּ הַקְּרֻאִים
  choice: Sesudah itu, barulah para undangan makan
  rationale: “Barulah” menyampaikan urutan yang ditekankan oleh אַחֲרֵי כֵן. Partisip pasif הַקְּרֻאִים berarti orang-orang yang telah diundang.
- source_word: וְעַתָּה עֲלוּ
  choice: Jadi, naiklah sekarang
  rationale: Bentuk jamak imperatif dipertahankan, dan “naiklah” menjaga nuansa arah dari עלה.
- source_word: כְהַיּוֹם
  choice: pada waktu ini juga
  rationale: Ungkapan ini dapat menekankan waktu yang sedang berlangsung atau kedekatan waktu, bukan semata-mata hari kalender. Pilihan utama menjaga nuansa kesegeraan; alternatif “hari ini” dicatat.
theological_decisions:
- issue: Makna tindakan memberkati kurban
  choice: Teks utama mempertahankan “memberkati kurban.”
  alternative: “mengucapkan berkat sebelum perjamuan kurban”
  rationale: Konteks mendukung tindakan mengucapkan berkat sebelum para undangan makan, tetapi teks Ibrani secara ringkas menyebut objeknya sebagai “kurban.” Terjemahan utama tidak mempersempit tindakan itu, sedangkan catatan menjelaskan kemungkinan praktiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai dua orang yang sedang diajak bicara. Susunan kalimat dibuat alami dan bermartabat, sementara pengulangan serta penekanan penting dalam bahasa Ibrani dipertahankan melalui “dialah” dan “barulah.”
