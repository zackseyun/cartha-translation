revisions:
- from: Begitu kalian memasuki kota, kalian akan menemukannya sebelum ia naik ke tempat pemujaan di bukit[b] untuk makan. Orang-orang tidak akan makan sebelum ia datang, karena dialah yang memberkati kurban[c]. Sesudah itu, barulah para undangan makan. Jadi, naiklah sekarang, sebab pada waktu ini juga[a] kalian akan menemukannya.
  to: Begitu kalian memasuki kota, kalian akan menemukannya sebelum ia naik ke tempat tinggi[b] untuk makan. Orang-orang tidak akan makan sebelum ia datang, karena dialah yang memberkati kurban[c]. Sesudah itu, barulah para undangan akan makan. Jadi, naiklah sekarang, sebab hari ini[a] kalian akan menemukannya.
