  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: id
  text: Pelayan itu berkata kepadanya, “Lihat, di kota ini ada seorang abdi Allah. Orang itu sangat dihormati; segala yang dikatakannya pasti terjadi. Mari kita pergi ke sana sekarang. Barangkali ia dapat memberitahukan kepada kita jalan yang perlu kita tempuh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jalan kita yang telah kita lalui.” Ungkapan ini juga dapat berarti bahwa ia akan memberi tahu mereka tentang perjalanan yang sedang mereka jalani.'
    reason: Menjaga bentuk lampau dan kemungkinan makna retrospektif dalam frasa Ibrani אֲשֶׁר הָלַכְנוּ עָלֶיהָ, yang tidak sepenuhnya terwakili oleh terjemahan kontekstual dalam teks utama.
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku dan wajar dalam bahasa Indonesia untuk seorang yang menjalankan peranan kenabian sebagai utusan Allah.
- source_word: נִכְבָּד
  choice: sangat dihormati
  rationale: Menyampaikan makna bahwa orang itu terpandang atau memiliki kehormatan besar dalam bentuk yang alami.
- source_word: בּוֹא יָבוֹא
  choice: pasti terjadi
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan bahwa setiap perkataannya benar-benar menjadi kenyataan.
- source_word: דַּרְכֵּנוּ
  choice: jalan yang perlu kita tempuh
  rationale: Dalam konteks perjalanan Saul dan pelayannya, 'jalan' dapat menunjuk arah atau langkah perjalanan mereka; terjemahan ini alami tanpa menjadikannya istilah moral atau teologis.
theological_decisions:
- issue: Sebutan bagi איש אלהים
  choice: abdi Allah
  alternative: orang Allah
  rationale: '''Abdi Allah'' mempertahankan pengertian seorang yang mengabdi dan mewakili Allah tanpa menambahkan gelar denominasi tertentu.'
- issue: Kepastian perkataan sang abdi Allah
  choice: segala yang dikatakannya pasti terjadi
  alternative: semua yang dikatakannya benar-benar datang
  rationale: Ungkapan ini menyampaikan penegasan Ibrani bahwa perkataannya menjadi kenyataan, tanpa menjelaskan secara berlebihan mekanisme nubuatnya.
- issue: Makna arah perjalanan pada akhir ayat
  choice: jalan yang perlu kita tempuh
  alternative: perjalanan yang telah kita tempuh
  rationale: Teks Ibrani secara bentuk berbicara tentang 'jalan kita yang telah kita lalui', tetapi dalam konteks permintaan petunjuk dapat dipahami sebagai arah atau kelanjutan perjalanan. Ambiguitas tekstual dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. 'Pelayan itu' memperjelas pelaku berdasarkan konteks dekat, sedangkan dialog mempertahankan nada ajakan dan harapan dalam teks Ibrani.
