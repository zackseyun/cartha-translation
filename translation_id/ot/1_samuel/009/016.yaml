  text: כָּ/עֵ֣ת מָחָ֡ר אֶשְׁלַח֩ אֵלֶ֨י/ךָ אִ֜ישׁ מֵ/אֶ֣רֶץ בִּנְיָמִ֗ן וּ/מְשַׁחְתּ֤/וֹ לְ/נָגִיד֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הוֹשִׁ֥יעַ אֶת עַמִּ֖/י מִ/יַּ֣ד פְּלִשְׁתִּ֑ים כִּ֤י רָאִ֨יתִי֙ אֶת עַמִּ֔/י כִּ֛י בָּ֥אָה צַעֲקָת֖/וֹ אֵלָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: id
  text: Besok kira-kira pada waktu seperti ini, Aku akan mengirim kepadamu seorang laki-laki dari wilayah Benyamin. Engkau harus mengurapinya menjadi pemimpin[a] atas umat-Ku Israel. Ia akan menyelamatkan umat-Ku dari tangan orang Filistin, sebab Aku telah melihat umat-Ku, karena seruan mereka telah sampai kepada-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penguasa.” Kata Ibrani yang dipakai menunjuk kepada orang yang ditetapkan untuk memimpin atau memerintah; secara tradisional juga diterjemahkan “pangeran.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah dalam bahasa Ibrani: “seruannya telah sampai kepada-Ku.” Bentuk tunggal itu merujuk kepada “umat-Ku” sebagai satu kesatuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: Besok kira-kira pada waktu seperti ini
  rationale: Ungkapan ini menunjuk pada waktu yang kurang lebih sama pada hari berikutnya. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur perkiraan.
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: Aku akan mengirim kepadamu
  rationale: Mempertahankan arah yang dinyatakan oleh אֶל, yakni pengiriman orang itu kepada Samuel.
- source_word: אִישׁ מֵאֶרֶץ בִּנְיָמִן
  choice: seorang laki-laki dari wilayah Benyamin
  rationale: אִישׁ menunjuk kepada seorang laki-laki tertentu, sedangkan אֶרֶץ dalam konteks ini berarti daerah atau wilayah suku Benyamin.
- source_word: וּמְשַׁחְתּוֹ
  choice: Engkau harus mengurapinya
  rationale: Bentuk perfektum dengan waw dalam firman ilahi ini menyampaikan tindakan yang harus dilakukan Samuel; 'harus' menyatakan daya perintah secara wajar dalam bahasa Indonesia.
- source_word: לְנָגִיד
  choice: menjadi pemimpin
  rationale: נָגִיד menunjuk kepada orang yang ditetapkan untuk memerintah atau memimpin. 'Pemimpin' mempertahankan cakupan istilah tanpa langsung menyamakannya dengan gelar 'raja'.
- source_word: וְהוֹשִׁיעַ
  choice: Ia akan menyelamatkan
  rationale: Bentuk ini menyatakan hasil atau maksud pengangkatan orang tersebut. 'Menyelamatkan' mempertahankan makna pembebasan dari ancaman.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: dari tangan orang Filistin
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'tangan' sebagai kuasa atau penguasaan, yang masih dapat dipahami dalam bahasa Indonesia.
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: sebab Aku telah memperhatikan umat-Ku
  rationale: רָאָה secara harfiah berarti 'melihat', tetapi dalam konteks penderitaan umat menyiratkan bahwa Allah melihat dan mengindahkan keadaan mereka. 'Memperhatikan' menyampaikan fungsi kontekstual itu secara alami.
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: karena seruan mereka telah sampai kepada-Ku
  rationale: Akhiran tunggal pada 'seruannya' merujuk kepada עַמִּי, sebuah nomina kolektif. Kata ganti jamak 'mereka' alami dalam bahasa Indonesia dan menjernihkan rujukannya.
theological_decisions:
- issue: Makna jabatan נָגִיד dalam kaitannya dengan Saul
  choice: pemimpin
  alternative: penguasa; raja; pangeran
  rationale: '''Pemimpin'' menyatakan bahwa Saul ditetapkan Allah atas Israel tanpa memasukkan ketepatan gelar ''raja'' sebelum istilah itu dipakai dalam konteks ini. ''Pangeran'' berpotensi menimbulkan pengertian dinasti modern yang tidak dimaksudkan.'
- issue: Nuansa רָאִיתִי sebagai tanggapan Allah terhadap penderitaan umat
  choice: Aku telah memperhatikan umat-Ku
  alternative: Aku telah melihat umat-Ku
  rationale: Pilihan ini mempertahankan gagasan bahwa Allah telah melihat keadaan umat dan menanggapinya, tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan teks.
- issue: Akhiran tunggal pada צַעֲקָתוֹ dengan anteseden kolektif
  choice: seruan mereka
  alternative: seruannya
  rationale: Bahasa Ibrani memakai bentuk tunggal karena עַמִּי berbentuk tunggal kolektif. Bahasa Indonesia lebih jelas dengan kata ganti jamak yang merujuk kepada anggota umat secara kolektif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan ilahi memakai kapitalisasi konvensional. 'Wilayah Benyamin' dipilih agar rujukan geografis jelas; metafora 'dari tangan' dipertahankan karena cukup lazim dan menjaga citra teks sumber.
