  text: הֵ֗מָּה עֹלִים֙ בְּ/מַעֲלֵ֣ה הָ/עִ֔יר וְ/הֵ֨מָּה֙ מָצְא֣וּ נְעָר֔וֹת יֹצְא֖וֹת לִ/שְׁאֹ֣ב מָ֑יִם וַ/יֹּאמְר֣וּ לָ/הֶ֔ן הֲ/יֵ֥שׁ בָּ/זֶ֖ה הָ/רֹאֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: id
  text: Ketika mereka sedang menaiki jalan menanjak menuju kota, mereka bertemu dengan beberapa perempuan muda yang sedang keluar untuk menimba air. Mereka bertanya kepada perempuan-perempuan itu, “Apakah pelihat itu ada di sini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nabi”. Teks Ibrani secara khusus memakai kata “pelihat”, sebutan lama untuk nabi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: sedang mendaki
  rationale: Partisipel dengan pronomina הֵמָּה menggambarkan tindakan yang sedang berlangsung; 'sedang mendaki' alami dalam narasi Indonesia.
- source_word: בְּמַעֲלֵה הָעִיר
  choice: jalan menuju kota
  rationale: מַעֲלֶה menunjuk pada tanjakan atau jalan mendaki. Unsur mendaki sudah dinyatakan oleh verba, sehingga frasa ini diterjemahkan alami tanpa pengulangan yang kaku.
- source_word: מָצְאוּ
  choice: bertemu dengan
  rationale: Makna dasarnya 'menemukan', tetapi dalam konteks orang-orang yang berpapasan di jalan, 'bertemu dengan' menyampaikan maksudnya secara alami.
- source_word: נְעָרוֹת
  choice: beberapa perempuan muda
  rationale: Istilah ini menunjuk pada orang-orang perempuan yang masih muda; 'perempuan muda' bersifat modern dan bermartabat. 'Beberapa' menandai bentuk jamak tanpa menentukan jumlah.
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: sedang keluar untuk menimba air
  rationale: Partisipel menyatakan tindakan yang berlangsung, sedangkan infinitif menyatakan tujuannya.
- source_word: הֲיֵשׁ בָּזֶה
  choice: Apakah ... ada di sini?
  rationale: Ungkapan ini menanyakan keberadaan seseorang di tempat tersebut; bentuk ini idiomatis dalam bahasa Indonesia.
- source_word: הָרֹאֶה
  choice: pelihat
  rationale: Kata Ibrani secara khusus berarti 'pelihat', sebutan lama bagi orang yang kemudian disebut nabi; istilah historis itu dipertahankan.
theological_decisions:
- issue: Sebutan הָרֹאֶה bagi Samuel
  choice: pelihat
  alternative: nabi
  rationale: Teks memakai istilah historis 'pelihat', bukan istilah umum 'nabi'. Mempertahankannya menjaga pembedaan leksikal dan hubungan dengan penjelasan narator dalam konteks dekat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan subjek dibuat jelas agar rujukan kepada para perempuan muda tidak rancu. Istilah 'pelihat' dipertahankan sebagai kosakata historis dan dijelaskan dalam catatan kaki.
