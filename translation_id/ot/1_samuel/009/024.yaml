  text: וַ/יָּ֣רֶם הַ֠/טַּבָּח אֶת הַ/שּׁ֨וֹק וְ/הֶ/עָלֶ֜י/הָ וַ/יָּ֣שֶׂם לִ/פְנֵ֣י שָׁא֗וּל וַ/יֹּ֨אמֶר֙ הִנֵּ֤ה הַ/נִּשְׁאָר֙ שִׂים לְ/פָנֶ֣י/ךָ אֱכֹ֔ל כִּ֧י לַ/מּוֹעֵ֛ד שָֽׁמוּר לְ/ךָ֥ לֵ/אמֹ֖ר הָ/עָ֣ם קָרָ֑אתִי וַ/יֹּ֧אכַל שָׁא֛וּל עִם שְׁמוּאֵ֖ל בַּ/יּ֥וֹם הַ/הֽוּא־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: id
  text: Kemudian juru masak mengambil potongan paha[a] beserta apa yang ada di atasnya[b], lalu meletakkannya di hadapan Saul. Ia berkata, “Lihat, bagian yang telah disimpan[c] ini sudah ditaruh di hadapanmu. Makanlah, sebab bagian itu telah disimpan untukmu bagi saat yang ditentukan, sejak aku berkata, ‘Aku telah mengundang[d] orang-orang itu.’” Maka pada hari itu Saul makan bersama Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “potongan kaki.” Kata Ibrani שׁוֹק menunjuk pada bagian kaki hewan dan dapat diterjemahkan “paha.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “paha dan apa yang ada di atasnya.” Teks tidak menjelaskan bagian yang menyertai paha itu.
    reason: lexical_alternative
  - marker: c
    text: Atau “bagian yang tersisa.” Ungkapan Ibrani dapat menunjuk pada sesuatu yang tertinggal atau pada sesuatu yang sengaja disimpan; konteks mendukung bagian yang dikhususkan bagi Saul.
    reason: alternative_reading
  - marker: d
    text: Atau “memanggil.” Dalam konteks perjamuan ini, kata Ibrani tersebut kemungkinan besar berarti “mengundang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטַּבָּח
  choice: juru masak
  rationale: Dalam konteks perjamuan kurban, orang ini menyiapkan dan menyajikan daging. ‘Juru masak’ paling alami dalam bahasa Indonesia modern, meskipun kata Ibraninya juga dapat menunjuk kepada penyembelih.
- source_word: הַשּׁוֹק
  choice: potongan paha
  rationale: Kata ini menunjuk pada bagian kaki hewan. ‘Potongan paha’ jelas sebagai bagian daging dalam konteks jamuan, tanpa mencoba menentukan potongan anatomis secara terlalu teknis.
- source_word: וְהֶעָלֶיהָ
  choice: beserta apa yang ada di atasnya
  rationale: Bahasa Ibrani tidak menyebut secara tegas benda atau bagian apa yang menyertai paha itu. Terjemahan ini mempertahankan ketidakjelasan sumber.
- source_word: הַנִּשְׁאָר
  choice: bagian yang disisakan
  rationale: Bentuk ini dapat berarti sesuatu yang tersisa ataupun yang sengaja disimpan. Konteks mengarah pada bagian yang telah dikhususkan bagi Saul, sedangkan ‘disisakan’ tetap mempertahankan kedua nuansa itu.
- source_word: שִׂים לְפָנֶיךָ
  choice: sudah ditaruh di hadapanmu
  rationale: Ungkapan ini disampaikan secara alami sebagai keadaan bagian makanan yang kini tersedia di depan Saul, alih-alih sebagai perintah harfiah yang akan terdengar janggal dalam bahasa Indonesia.
- source_word: לַמּוֹעֵד
  choice: bagi saat yang ditentukan
  rationale: מוֹעֵד menunjuk pada waktu atau kesempatan yang telah ditetapkan. Pilihan ini mempertahankan unsur perencanaan tanpa menjadikannya istilah teknis untuk hari raya.
- source_word: שָׁמוּר לְךָ
  choice: telah disimpan untukmu
  rationale: Bentuk pasif-statif ini menunjukkan bahwa bagian tersebut sebelumnya dijaga atau dikhususkan bagi Saul.
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: sejak aku berkata, ‘Aku telah mengundang orang-orang itu’
  rationale: Susunan Ibraninya padat. ‘Sejak aku berkata’ mengungkapkan hubungan temporal yang mungkin dimaksud, sedangkan ‘mengundang’ menyampaikan arti קרא yang sesuai dengan konteks perjamuan.
- source_word: עִם שְׁמוּאֵל
  choice: bersama Samuel
  rationale: Terjemahan langsung dan alami untuk persekutuan makan Saul dengan Samuel.
theological_decisions:
- issue: Identitas pembicara dalam וַיֹּאמֶר
  choice: Ia berkata
  alternative: Samuel berkata / juru masak itu berkata
  rationale: Bahasa Ibrani hanya menyatakan ‘ia berkata’. Walaupun isi ucapan sering dipahami berasal dari Samuel, menyebut nama pembicara akan menghilangkan ambiguitas gramatikal yang terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah konkret dibuat mudah dipahami, sementara ketidakjelasan mengenai bagian daging dan identitas pembicara dipertahankan. Bentuk sapaan tunggal ‘-mu’ sesuai dengan perkataan yang ditujukan kepada Saul.
