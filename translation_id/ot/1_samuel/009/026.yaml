translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Bentuk ‘katanya’ menjaga kelancaran narasi, sedangkan tanda pisah mempertahankan penegasan aposisional dalam teks Ibrani.
