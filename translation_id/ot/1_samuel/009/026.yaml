  text: וַ/יַּשְׁכִּ֗מוּ וַ/יְהִ֞י כַּ/עֲל֤וֹת הַ/שַּׁ֨חַר֙ וַ/יִּקְרָ֨א שְׁמוּאֵ֤ל אֶל שָׁאוּל֙ ה/גג לֵ/אמֹ֔ר ק֖וּמָ/ה וַ/אֲשַׁלְּחֶ֑/ךָּ וַ/יָּ֣קָם שָׁא֗וּל וַ/יֵּצְא֧וּ שְׁנֵי/הֶ֛ם ה֥וּא וּ/שְׁמוּאֵ֖ל הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: id
  text: Mereka bangun pagi-pagi. Ketika fajar mulai menyingsing,[a] Samuel memanggil Saul di atas atap itu, katanya, “Bangunlah, aku akan memberangkatkanmu.[b]” Saul pun bangun, lalu keduanya—dia dan Samuel—pergi ke luar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ketika fajar terbit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “aku akan melepasmu pergi.” Kata Ibrani yang dipakai dapat berarti menyuruh seseorang berangkat atau melepasnya pergi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: Mereka bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם menyatakan tindakan bangun atau mulai beraktivitas pada pagi hari. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: Ketika fajar mulai menyingsing
  rationale: Secara harfiah berarti ‘ketika fajar terbit/naik’. ‘Fajar mulai menyingsing’ merupakan ungkapan Indonesia yang wajar dan tetap mempertahankan gambaran datangnya fajar.
- source_word: הַגָּג
  choice: di atas atap itu
  rationale: Nomina tertentu ini menunjuk pada atap datar rumah yang disebut dalam konteks sebelumnya. Susunan kalimat dibiarkan tidak menentukan secara tegas apakah keterangan tempat itu terutama menerangkan Samuel, Saul, atau peristiwa pemanggilan secara keseluruhan.
- source_word: קוּמָה
  choice: Bangunlah
  rationale: Imperatif ini meminta Saul bangkit atau berdiri. ‘Bangunlah’ sesuai dengan konteks setelah bermalam dan terdengar alami dalam percakapan.
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: aku akan mengantarkanmu pergi
  rationale: שׁלח di sini berarti melepas, menyuruh berangkat, atau mengantar seseorang memulai perjalanan. Pilihan ini menyampaikan nuansa perpisahan dengan sopan tanpa kesan mengusir.
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: pergi ke luar
  rationale: Gabungan verba dan adverbia berarah ini berarti bergerak ke luar. Terjemahan tidak memperinci tujuan sebagai jalan atau lokasi tertentu karena teks Ibrani tidak menyatakannya.
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: keduanya—dia dan Samuel—
  rationale: Terjemahan mempertahankan aposisi Ibrani yang agak menegaskan, ‘keduanya, dia dan Samuel’; kata ‘dia’ secara alami merujuk kembali kepada Saul.
