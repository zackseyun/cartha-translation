base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: id
  text: Ketika mereka tiba di wilayah Zuf, Saul berkata kepada orang muda yang menyertainya, “Mari, kita kembali. Jangan-jangan ayahku tidak lagi memikirkan keledai-keledai itu dan mulai mengkhawatirkan kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: tiba di wilayah Zuf
  rationale: Konstruksi בוא dengan ב menyatakan tibanya mereka di suatu daerah. 'Wilayah' secara alami menyampaikan אֶרֶץ sebagai kawasan geografis, sedangkan nama Zuf dipertahankan.
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: orang muda yang menyertainya
  rationale: נַעַר pada dasarnya dapat berarti orang muda dan dalam konteks tertentu juga pelayan. Terjemahan ini mempertahankan arti leksikal tanpa menetapkan status sosial yang tidak dinyatakan secara tegas.
- source_word: לְכָה וְנָשׁוּבָה
  choice: Mari kita pulang
  rationale: Imperatif yang diikuti bentuk kohortatif menyatakan ajakan. 'Mari kita pulang' alami dalam bahasa Indonesia dan sesuai dengan maksud kembali ke rumah.
- source_word: פֶּן
  choice: Jangan-jangan
  rationale: פֶּן memperkenalkan kemungkinan yang dikhawatirkan. 'Jangan-jangan' menyampaikan nuansa kekhawatiran secara alami dalam bahasa Indonesia.
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: tidak lagi memikirkan keledai-keledai itu
  rationale: Secara harfiah ungkapan ini berarti 'berhenti dari keledai-keledai itu', yakni berhenti mencurahkan perhatian kepada mereka. Pilihan ini menyampaikan idiom tersebut tanpa menyiratkan bahwa sang ayah tidak lagi peduli.
- source_word: וְדָאַג לָנוּ
  choice: dan mulai mengkhawatirkan kita
  rationale: דאג menyatakan rasa khawatir atau cemas, dan לָנוּ menunjukkan pihak yang menjadi sasaran kekhawatiran. 'Mulai' membuat peralihan perhatian dari keledai kepada Saul dan pendampingnya jelas secara wajar.
