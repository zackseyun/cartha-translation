base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: id
  text: Ada seorang laki-laki dari suku Benyamin bernama Kish, anak Abiel, anak Zeror, anak Bekhorat, anak Afiah, anak seorang Benyamin. Ia seorang yang terpandang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang pejuang yang gagah,” “seorang yang berpengaruh,” atau “seorang yang kaya dan berkuasa.” Ungkapan Ibraninya dapat mengandung nuansa militer, sosial, atau ekonomi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ada
  rationale: Bentuk naratif ini memperkenalkan tokoh baru. “Ada” wajar dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak tersurat.
- source_word: אִישׁ מִבֶּן־יָמִין
  choice: seorang laki-laki dari suku Benyamin
  rationale: אִישׁ menunjuk seorang laki-laki, sedangkan מִבֶּן־יָמִין menyatakan asal kesukuan. Penambahan “suku” membuat maksudnya jelas dan alami bagi pembaca Indonesia.
- source_word: וּשְׁמוֹ קִישׁ
  choice: bernama Kish
  rationale: Ungkapan penamaan Ibrani dialihkan secara ringkas dan alami tanpa kehilangan informasi.
- source_word: בֶּן ... בֶּן ...
  choice: anak ... anak ...
  rationale: Pengulangan formula silsilah dipertahankan. “Anak” dapat menyatakan hubungan genealogis dalam rangkaian silsilah, meskipun pada beberapa mata rantai mungkin bermakna keturunan.
- source_word: אֲבִיאֵל / צְרוֹר / בְּכוֹרַת / אֲפִיחַ
  choice: Abiel / Zeror / Bekhorat / Afiah
  rationale: Nama-nama pribadi ditransliterasikan ke bentuk yang mudah dibaca dalam bahasa Indonesia sambil mencerminkan bentuk Ibraninya.
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: keturunan seorang Benyamin
  rationale: Frasa ini menutup silsilah dengan menandai garis keluarga tersebut sebagai orang Benyamin. “Keturunan” lebih alami daripada “anak seorang laki-laki Benyamin” pada titik penutup ini.
- source_word: גִּבּוֹר חָיִל
  choice: seorang yang terpandang
  rationale: Ungkapan ini dapat menunjuk kekuatan atau kecakapan, keberanian militer, kekayaan, maupun kedudukan sosial. Dalam pengantar keluarga Kish, “terpandang” mempertahankan keluasan makna lebih baik daripada istilah yang hanya bersifat militer.
