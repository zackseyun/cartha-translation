  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi agar silsilah mudah dipahami. Nama “Kish” dipertahankan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; bentuk “Bekhorat” mencerminkan konsonan ח pada nama Ibrani dengan lebih jelas.
