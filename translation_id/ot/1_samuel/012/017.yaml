  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: id
  text: Bukankah hari ini masa panen gandum? Aku akan berseru kepada Yahweh, dan Dia akan mendatangkan guruh[a] dan hujan. Ketahuilah dan lihatlah bahwa kejahatan kalian—yang telah kalian lakukan di mata Yahweh dengan meminta raja bagi diri kalian—sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dia akan memberikan suara-suara dan hujan.” Dalam konteks cuaca, “suara-suara” berarti guruh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan.
- source_word: קְצִיר חִטִּים הַיּוֹם
  choice: hari ini masa panen gandum
  rationale: Menyampaikan penanda waktu dan latar musim panen secara alami dalam bahasa Indonesia.
- source_word: אֶקְרָא אֶל יְהוָה
  choice: Aku akan berseru kepada Yahweh
  rationale: Kata קרא dengan אֶל menyatakan seruan atau permohonan yang diarahkan kepada Yahweh; 'berseru kepada' alami dan mempertahankan arah tindakan.
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: Dia akan mendatangkan guruh dan hujan
  rationale: נתן secara harfiah berarti 'memberikan', tetapi 'mendatangkan' lebih wajar untuk gejala cuaca. Dalam konteks badai, קֹלוֹת ('suara-suara') menunjuk kepada guruh.
- source_word: וּדְעוּ וּרְאוּ
  choice: Maka ketahuilah dan lihatlah
  rationale: Keduanya berbentuk imperatif jamak. 'Maka' menunjukkan hubungan dengan tanda yang baru diumumkan tanpa mengubah perintah menjadi sekadar pernyataan tujuan.
- source_word: רָעַתְכֶם רַבָּה
  choice: kejahatan ... sangatlah besar
  rationale: רָעָה di sini bernilai moral, sedangkan רַבָּה menegaskan besarnya pelanggaran.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan gambaran idiom Ibrani yang menyatakan penilaian Yahweh.
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: dengan meminta seorang raja bagi diri kalian
  rationale: Infinitif menjelaskan tindakan yang merupakan kejahatan tersebut; לָכֶם menekankan bahwa mereka meminta raja untuk diri mereka sendiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Penilaian moral atas permintaan akan raja
  choice: kejahatan ... sangatlah besar
  alternative: kesalahan ... besar
  rationale: רָעָה dalam konteks ini menyatakan penilaian moral yang tegas terhadap tindakan meminta raja, tetapi terjemahan tidak memperluas alasan teologis melampaui yang dikatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk memperjelas bahwa perintah dan teguran Samuel ditujukan kepada seluruh umat. Susunan klausa terakhir sedikit ditata ulang agar alami dalam bahasa Indonesia, sambil mempertahankan bahwa meminta raja merupakan kejahatan yang dinilai besar di mata Yahweh.
