  source_fidelity: 'Teks Indonesia dengan setia mempertahankan struktur pemeriksaan publik: seruan untuk memberi kesaksian, kehadiran Yahweh dan orang yang diurapi-Nya, pengulangan pertanyaan tentang pengambilan harta, penindasan, perlakuan keras, serta suap yang menyebabkan seseorang menutup mata. Nuansa kausal pada ungkapan terakhir dan janji pengembalian telah tersampaikan dengan memadai.'
  naturalness: Bahasanya baku, jelas, dan sesuai register khidmat narasi sejarah Alkitab. “Inilah aku,” “Bersaksilah menentang aku,” serta bentuk tanya berulang terdengar wajar dalam register tersebut. Pemakaian “kalian” tepat bagi audiens jamak.
  terminology: “Yahweh” konsisten dengan kebijakan yang diberikan. “Orang yang diurapi-Nya” secara tepat mempertahankan acuan historis kepada raja tanpa memasukkan pembacaan mesianik kemudian. “Suap” tepat dalam konteks pengabaian keadilan, sementara catatan kaki dengan baik memelihara kemungkinan leksikal “uang tebusan” atau “pembayaran”.
