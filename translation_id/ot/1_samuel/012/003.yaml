id: 1SA.12.3
reference: 1 Samuel 12:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנְ/נִ֣י עֲנ֣וּ בִ/י֩ נֶ֨גֶד יְהוָ֜ה וְ/נֶ֣גֶד מְשִׁיח֗/וֹ אֶת שׁוֹר֩ מִ֨י לָקַ֜חְתִּי וַ/חֲמ֧וֹר מִ֣י לָקַ֗חְתִּי וְ/אֶת מִ֤י עָשַׁ֨קְתִּי֙ אֶת מִ֣י רַצּ֔וֹתִי וּ/מִ/יַּד מִי֙ לָקַ֣חְתִּי כֹ֔פֶר וְ/אַעְלִ֥ים עֵינַ֖/י בּ֑/וֹ וְ/אָשִׁ֖יב לָ/כֶֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: id
  text: “Inilah aku. Bersaksilah menentang aku di hadapan Yahweh dan di hadapan orang yang diurapi-Nya. Lembu siapa yang pernah kuambil? Keledai siapa yang pernah kuambil? Siapa yang pernah kutindas? Siapa yang pernah kuperlakukan dengan kejam?[a] Dari tangan siapa aku pernah menerima suap[b] sehingga aku menutup mata karenanya? Aku akan mengembalikannya kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini sulit. Kata itu dapat juga dipahami sebagai “siapa yang pernah kusakiti?” atau “siapa yang pernah kuremukkan?”, dan secara luas menunjuk pada perlakuan keras atau sewenang-wenang.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “suap” dapat juga berarti “uang tebusan” atau “pembayaran”. Namun, ungkapan tentang menutup mata mendukung pengertian pembayaran korup yang membuat kejahatan diabaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Inilah aku
  rationale: Ungkapan penghadiran diri di depan umum; bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanan Ibrani.
- source_word: עֲנוּ בִי
  choice: Bersaksilah menentang aku
  rationale: Dalam suasana pertanggungjawaban hukum di hadapan Yahweh dan raja, verba ini mengajak umat memberikan kesaksian terhadap Samuel, bukan sekadar menjawabnya.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Menandai pertanggungjawaban terbuka dalam kehadiran Yahweh dan orang yang diurapi-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  rationale: Dalam konteks historis ini menunjuk kepada raja yang diurapi Yahweh; terjemahan ini mempertahankan makna tanpa mengubahnya menjadi gelar mesianik khusus.
- source_word: שׁוֹר
  choice: lembu
  rationale: Padanan umum dan tepat bagi hewan milik yang disebut dalam konteks hak kepemilikan.
- source_word: חֲמוֹר
  choice: keledai
  rationale: Padanan modern yang jelas.
- source_word: לָקַחְתִּי
  choice: pernah kuambil
  rationale: Mempertahankan pengulangan formula tuduhan dan menyatakan tindakan masa lalu yang masih relevan dalam pemeriksaan sekarang.
- source_word: עָשַׁקְתִּי
  choice: pernah kutindas
  rationale: Mencakup penindasan atau eksploitasi sosial-ekonomi tanpa mempersempitnya pada satu bentuk pelanggaran.
- source_word: רַצּוֹתִי
  choice: pernah kuperlakukan dengan kejam
  rationale: Kata yang sulit ini tampaknya menyatakan perlakuan keras atau tindakan meremukkan; frasa Indonesia ini menjaga perbedaannya dari עָשַׁקְתִּי tanpa memakai metafora yang berpotensi disalahpahami secara harfiah.
- source_word: כֹפֶר
  choice: suap
  rationale: Walaupun dapat berarti uang tebusan atau pembayaran, konteks menerima uang lalu menutup mata paling kuat menunjuk kepada pembayaran korup yang membelokkan keadilan.
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: sehingga aku menutup mata karenanya
  rationale: Mempertahankan gambaran mata dalam ungkapan Ibrani sekaligus menyatakan bahwa pembayaran itu menyebabkan pelanggaran sengaja diabaikan.
- source_word: וְאָשִׁיב לָכֶם
  choice: Aku akan mengembalikannya kepada kalian
  rationale: Objek dipahami dari barang atau pembayaran yang baru disebut; akhiran jamak pada לָכֶם diterjemahkan dengan 'kalian'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan nama itu dan membedakannya dari gelar umum.
- issue: Makna מְשִׁיחוֹ dalam konteks kerajaan Israel
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Acuan langsungnya ialah raja Israel yang telah diurapi. Pilihan ini mempertahankan hubungan leksikal dengan tindakan pengurapan tanpa secara diam-diam menjadikannya gelar eskatologis.
- issue: Kekuatan hukum dari עֲנוּ בִי
  choice: Bersaksilah menentang aku
  alternative: Jawablah aku
  rationale: Kehadiran Yahweh dan raja serta daftar kemungkinan pelanggaran memberi ujaran ini corak pemeriksaan publik dan forensik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pertanyaan retoris dan pengulangan sumber dipertahankan. Bentuk 'kalian' dipakai untuk menandai bahwa Samuel berbicara kepada orang banyak; '-Nya' mengacu kepada Yahweh.
