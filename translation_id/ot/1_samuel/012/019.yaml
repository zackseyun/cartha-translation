  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: id
  text: 'Lalu seluruh rakyat berkata kepada Samuel, “Berdoalah kepada Yahweh, Allahmu, bagi hamba-hambamu, supaya kami tidak mati. Sebab kami telah menambahkan kejahatan ini kepada segala dosa kami: meminta seorang raja bagi kami sendiri.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל הָעָם
  choice: Lalu seluruh bangsa itu berkata
  rationale: Waw konsekutif melanjutkan alur narasi, sedangkan כָל הָעָם menunjuk secara kolektif kepada bangsa Israel. 'Lalu seluruh bangsa itu berkata' alami dalam narasi Indonesia dan mempertahankan cakupan kolektifnya.
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: Berdoalah ... bagi hamba-hambamu ini
  rationale: הִתְפַּלֵּל adalah imperatif 'berdoalah'; בְּעַד menjadikan doa itu bersifat perantaraan, 'bagi/demi'. 'Hamba-hambamu ini' mempertahankan sikap hormat rakyat kepada Samuel dan membuat rujukan diri mereka alami dalam bahasa Indonesia.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'. אֱלֹהֶיךָ adalah bentuk dengan sufiks orang kedua tunggal, sehingga diterjemahkan 'Allahmu' tanpa mengubahnya menjadi 'Allah kami'.
- source_word: וְאַל נָמוּת
  choice: supaya kami tidak mati
  rationale: אַֽל dengan bentuk orang pertama jamak menyatakan hasil negatif yang dimohonkan dalam kaitan dengan doa Samuel. 'Supaya kami tidak mati' menyampaikan hubungan tujuan/hasil secara wajar tanpa menambahkan Samuel sebagai penyebab langsung kematian.
- source_word: כִּי יָסַפְנוּ עַל כָּל חַטֹּאתֵינוּ רָעָה
  choice: Sebab, di samping segala dosa kami, kami telah menambahkan kejahatan ini
  rationale: יסף dengan עַל menyatakan penambahan pada kumpulan dosa yang sudah ada. Susunan Indonesia ini mempertahankan daya kumulatif pengakuan tersebut; רָעָה diterjemahkan 'kejahatan' untuk menjaga bobot moralnya.
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: meminta seorang raja bagi diri kami sendiri
  rationale: Infinitif menjelaskan isi 'kejahatan ini'. לָנוּ dibuat eksplisit sebagai 'bagi diri kami sendiri', sehingga kepentingan diri yang terkandung dalam permintaan itu tetap terdengar.
theological_decisions:
- issue: Daya relasional ungkapan 'Yahweh, Allahmu' dalam permohonan bangsa itu kepada Samuel
  choice: 'Mempertahankan orang kedua tunggal: ''Yahweh, Allahmu'''
  alternative: '''Yahweh, Allah kami'' atau penjelasan interpretatif tentang peran Samuel'
  rationale: Teks menampilkan bangsa itu memohon perantaraan Samuel dengan menyebut Yahweh sebagai 'Allahmu'. Bentuk ini dipertahankan untuk menjaga ketegangan retoris dan rohani tanpa menyiratkan bahwa Yahweh bukan Allah Israel.
- issue: Penilaian moral atas permintaan akan raja
  choice: Menerjemahkan רָעָה sebagai 'kejahatan'
  alternative: '''kesalahan'' atau ''perbuatan buruk'''
  rationale: Dalam konteks pengakuan dosa, kata itu membawa bobot moral yang kuat. Terjemahan ini tidak menggeneralisasi semua bentuk kerajaan sebagai jahat, tetapi mempertahankan penilaian bangsa itu atas permintaan mereka dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Sapaan 'hamba-hambamu ini' mempertahankan kerendahan diri sosial tanpa terdengar terlalu arkais. Tanda koma mengapit aposisi 'Allahmu' agar hubungan antara nama ilahi dan gelar terbaca jelas.
