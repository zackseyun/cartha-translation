  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: id
  text: Lalu Samuel berkata kepada mereka, “Yahweh adalah saksi terhadap kamu[a], dan orang yang diurapi-Nya[b] adalah saksi pada hari ini, bahwa kamu tidak menemukan apa pun dalam tanganku.” Mereka menjawab[c], “Ia adalah saksi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “Yahweh adalah saksi di antara kamu” atau “bersama kamu.” Dalam konteks ini, maknanya bersifat hukum: Yahweh berdiri sebagai saksi dalam perkara yang menyangkut mereka.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud dengan “orang yang diurapi-Nya” di sini adalah raja, yaitu Saul, bukan secara langsung gelar Mesias yang muncul kemudian.
    reason: cultural_note
  - marker: c
    text: Kata kerja Ibrani pada jawaban terakhir berbentuk tunggal, “ia berkata,” tetapi dalam konteks berfungsi sebagai jawaban kolektif umat; karena itu diterjemahkan “mereka menjawab.”
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: saksi
  rationale: Nomina ini menunjuk pada saksi dalam suasana hukum atau perjanjian; konteksnya adalah pembelaan Samuel di hadapan umum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בָּכֶם
  choice: terhadap kamu
  rationale: Dalam konstruksi forensik bersama עֵד, frasa ini menyatakan bahwa Yahweh menjadi saksi dalam perkara yang menyangkut mereka; alternatif harfiahnya, 'di antara kamu' atau 'bersama kamu', dicatat dalam catatan kaki.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  rationale: Ungkapan ini merujuk kepada raja yang telah diurapi, yakni Saul, dan tidak dengan sendirinya menjadi gelar mesianik dalam konteks ini.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Pilihan ini mempertahankan nada resmi pernyataan publik Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: מְצָאתֶם
  choice: kamu tidak menemukan
  rationale: Bentuk perfektif menyatakan hasil pemeriksaan yang telah selesai sampai saat pernyataan tersebut; susunan Indonesia ini alami dalam konteks kesaksian.
- source_word: בְּיָדִי
  choice: dalam tanganku
  rationale: Idiom sumber dipertahankan karena dapat dipahami sebagai sesuatu yang berada dalam kepemilikan atau kuasa Samuel dan menjaga nuansa hukumnya.
- source_word: מְאוּמָה
  choice: apa pun
  rationale: Dengan negasi לֹא, ungkapan ini berarti tidak menemukan sesuatu apa pun.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Samuel berkata ... Mereka menjawab
  rationale: Subjek pertama diperjelas sebagai Samuel dari konteks. Verba terakhir berbentuk tunggal dalam teks Ibrani, tetapi secara kontekstual menyampaikan jawaban kolektif umat; hal itu dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna מְשִׁיחוֹ dalam konteks kerajaan yang bukan rujukan mesianik langsung
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Dalam konteks langsung, istilah tersebut merujuk kepada Saul sebagai raja yang diurapi Yahweh. Terjemahan ini mempertahankan arti leksikal tanpa memasukkan rujukan kristologis yang tidak dinyatakan langsung oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur pernyataan hukum dipertahankan, sedangkan subjek Samuel dibuat eksplisit demi kejelasan. Pronomina untuk Yahweh ditulis dengan kapital pada bentuk terikat '-Nya' sesuai kebiasaan editorial bahasa Indonesia.
