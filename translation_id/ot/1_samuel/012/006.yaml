base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: id
  text: Kemudian Samuel berkata kepada bangsa itu, “Yahweh-lah yang mengangkat Musa dan Harun[a] serta yang membawa nenek moyang kalian[b] keluar dari tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang membuat” atau “yang menjadikan Musa dan Harun.” Dalam konteks ini, kata Ibraninya kemungkinan menunjuk pada tindakan Yahweh mengangkat atau menetapkan mereka dalam tugas mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bapak-bapak kalian”; maksudnya ialah para leluhur atau nenek moyang kalian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menghasilkan alur bahasa Indonesia yang alami.
- source_word: אֶל הָעָם
  choice: kepada bangsa itu
  rationale: הָעָם menunjuk kepada umat Israel yang sedang dihimpun; “bangsa itu” mempertahankan acuannya sebagai satu kelompok tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: yang mengangkat Musa dan Harun
  rationale: Secara harfiah עָשָׂה berarti “membuat/menjadikan”, tetapi dalam konteks ini menunjuk pada tindakan Yahweh menetapkan atau membentuk kedudukan Musa dan Harun sebagai pemimpin. “Mengangkat” alami dalam bahasa Indonesia dan tidak menyiratkan penciptaan pribadi mereka.
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: serta yang membawa ... keluar
  rationale: Bentuk Hifil הֶעֱלָה berarti “membawa naik/keluar”. Dalam konteks eksodus, “membawa keluar” menyampaikan gerakan pembebasan dari Mesir secara alami dalam bahasa Indonesia.
- source_word: אֶת אֲבֹתֵיכֶם
  choice: nenek moyang kalian
  rationale: Ungkapan ini merujuk kepada generasi-generasi terdahulu Israel. “Nenek moyang” merupakan padanan Indonesia yang wajar, sedangkan “kalian” mempertahankan sapaan orang kedua jamak.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Padanan dekat bagi frasa Ibrani yang mempertahankan unsur “tanah/negeri” dalam rumusan eksodus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna עָשָׂה sehubungan dengan Musa dan Harun
  choice: mengangkat Musa dan Harun
  alternative: membuat/menjadikan Musa dan Harun
  rationale: Konteks menekankan tindakan Yahweh menetapkan mereka dalam peran kepemimpinan, bukan menciptakan mereka. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- issue: Klausa nominal yang diawali יְהוָה
  choice: Yahweh-lah yang
  alternative: Yahweh yang
  rationale: Partikel “-lah” secara alami menandai Yahweh sebagai pelaku yang ditegaskan dalam klausa nominal Ibrani tanpa menambahkan gagasan baru.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Yahweh-lah” memberi penegasan yang alami; “mengangkat” menghindari kesan keliru bahwa ayat ini berbicara tentang penciptaan Musa dan Harun. Sapaan “kalian” mempertahankan bentuk orang kedua jamak dalam bahasa Ibrani.
