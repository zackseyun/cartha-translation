source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר שְׁמוּאֵ֤ל אֶל הָ/עָם֙ אַל תִּירָ֔אוּ אַתֶּ֣ם עֲשִׂיתֶ֔ם אֵ֥ת כָּל הָ/רָעָ֖ה הַ/זֹּ֑את אַ֗ךְ אַל תָּס֨וּרוּ֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וַ/עֲבַדְתֶּ֥ם אֶת יְהוָ֖ה בְּ/כָל לְבַבְ/כֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: id
  text: Lalu Samuel berkata kepada rakyat itu, “Jangan takut.[a] Kalian telah melakukan segala kejahatan ini. Namun, jangan berhenti mengikuti Yahweh,[b] melainkan mengabdilah kepada Yahweh dengan segenap hati kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Janganlah kalian merasa takut.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “jangan menyimpang dari belakang Yahweh,” sebuah ungkapan yang berarti berhenti mengikuti-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” alami dalam narasi Indonesia tanpa memberi penafsiran sebab-akibat yang berlebihan.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat Israel yang sedang dihimpun dan disapa Samuel. “Bangsa itu” mempertahankan rujukan kolektif yang sudah tertentu dalam konteks.
- source_word: אַל תִּירָאוּ
  choice: Jangan takut
  rationale: Larangan ini berasal dari ירא dan secara langsung serta alami diterjemahkan “Jangan takut” dalam bahasa Indonesia modern.
- source_word: אַתֶּם עֲשִׂיתֶם
  choice: Kalian memang telah melakukan
  rationale: Kata ganti mandiri אַתֶּם memberi penekanan. “Memang” mempertahankan penegasan itu, sedangkan “telah melakukan” menunjukkan tindakan lampau yang akibat moralnya masih relevan.
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: segala kejahatan ini
  rationale: רָעָה di sini menyatakan keburukan moral, bukan sekadar kesalahan. “Kejahatan” mempertahankan bobot teguran Samuel.
- source_word: אַךְ
  choice: Namun
  rationale: אַךְ memberi pembatasan atau peralihan kuat setelah pengakuan akan dosa mereka. “Namun” menyampaikan hubungan adversatif-konsesif tersebut dengan alami.
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: jangan berhenti mengikuti Yahweh
  rationale: Ungkapan harfiahnya menggambarkan tindakan menyimpang dari belakang Yahweh. Terjemahan ini menyampaikan idiom itu secara alami tanpa menghilangkan gagasan mengikuti-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: melainkan layanilah Yahweh
  rationale: עבד dalam konteks perjanjian berarti melayani dengan kesetiaan. “Melainkan” menjelaskan kontras antara larangan berhenti mengikuti dan perintah positif untuk melayani.
- source_word: בְּכָל לְבַבְכֶם
  choice: dengan segenap hati kalian
  rationale: Ungkapan ini menyatakan pengabdian batin dan kesetiaan yang menyeluruh. “Segenap hati” merupakan ungkapan Indonesia yang alami dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Bobot moral רָעָה
  choice: kejahatan
  alternative: kesalahan atau keburukan
  rationale: Konteksnya adalah teguran Samuel atas tindakan berdosa bangsa itu. “Kejahatan” mempertahankan keseriusan moral teks.
- issue: Hubungan antara dosa yang telah dilakukan dan panggilan untuk tetap setia
  choice: Kalian memang telah melakukan ... Namun, jangan ...
  alternative: Walaupun kalian telah melakukan ...
  rationale: 'Susunan ini mempertahankan ketegangan teks: Samuel tidak mengecilkan kejahatan mereka, tetapi juga tidak membiarkan ketakutan menghentikan mereka dari mengikuti dan melayani Yahweh.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” dipakai karena semua kata ganti dan verba terkait berjumlah jamak dalam bahasa Ibrani. Kalimat dibuat langsung dan mudah dipahami, sementara penegasan, bobot moral, serta citra mengikuti Yahweh tetap dipertahankan.
