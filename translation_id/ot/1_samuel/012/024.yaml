  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: id
  text: Hanya takutlah kepada Yahweh dan layanilah Dia dengan setia dengan segenap hati kalian. Sebab, perhatikanlah betapa besar perbuatan-perbuatan yang telah Dia lakukan bagi kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama kalian.”
    reason: Menjaga kemungkinan makna langsung עִמָּכֶם, sementara teks utama memakai ungkapan Indonesia yang lebih alami sesuai konteks.
lexical_decisions:
- source_word: אַךְ
  choice: Hanya
  rationale: Partikel ini membatasi sekaligus menegaskan tanggapan yang semestinya diberikan Israel; “Hanya” mempertahankan daya nasihat tersebut.
- source_word: יְרָאוּ
  choice: takutlah akan
  rationale: Mempertahankan ungkapan Alkitab tentang rasa gentar, hormat, dan ketaatan kepada Allah tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: dan layanilah Dia
  rationale: עבד pada dasarnya berarti melayani atau mengabdi. “Layanilah” mempertahankan cakupan luas pelayanan dan ketaatan perjanjian, bukan hanya ibadah ritual.
- source_word: בֶּאֱמֶת
  choice: dengan setia
  rationale: Dalam konteks pelayanan kepada Yahweh, אֱמֶת menunjuk pada ketulusan, keteguhan, dan kesetiaan; “dengan setia” alami dalam bahasa Indonesia.
- source_word: בְּכָל לְבַבְכֶם
  choice: dengan segenap hatimu
  rationale: Ungkapan ini menyatakan pengabdian batin yang utuh. Bentuk orang kedua tunggal kolektif dalam bahasa Indonesia dapat menyapa seluruh umat secara langsung.
- source_word: כִּי רְאוּ
  choice: Perhatikanlah
  rationale: כִּי memberi alasan bagi nasihat sebelumnya, sedangkan רְאוּ secara idiomatis mengajak umat melihat dengan penuh pertimbangan. Pemisahan menjadi kalimat baru tetap membuat hubungan alasannya jelas melalui konteks.
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: betapa besar perbuatan yang telah dilakukan-Nya
  rationale: Bentuk hiphil dari גדל di sini secara idiomatis menggambarkan tindakan besar Allah.
- source_word: עִמָּכֶם
  choice: bagi kalian
  rationale: Walaupun arti paling langsung preposisi עִם adalah “bersama/dengan”, dalam konteks ini ungkapan tersebut dapat menyatakan tindakan Allah demi Israel. “Bagi kalian” lebih alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna takut kepada Yahweh
  choice: takutlah akan Yahweh
  alternative: hormatilah Yahweh
  rationale: “Takut” mempertahankan ketegangan teologis antara rasa gentar, hormat, dan ketaatan; “hormatilah” dapat melembutkan cakupan istilah sumber.
- issue: Cakupan pelayanan kepada Allah
  choice: layanilah Dia
  alternative: beribadahlah kepada-Nya
  rationale: “Layanilah” tidak membatasi עבד pada kegiatan ibadah ritual, tetapi tetap mencakup pengabdian dan ketaatan hidup.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Yahweh” dipertahankan sebagai nama ilahi. Kata ganti “Dia/-Nya” ditulis dengan huruf kapital menurut kebiasaan umum penerbitan Alkitab Indonesia. Pergantian “hatimu” dan “kalian” mencerminkan bahwa sufiks Ibrani keduanya jamak; “segenap hatimu” dipakai sebagai ungkapan kolektif Indonesia yang mapan, sedangkan “kalian” memperjelas sapaan kepada umat.
