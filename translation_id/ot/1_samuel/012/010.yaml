  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּזְעֲק֤וּ אֶל יְהוָה֙ ו/יאמר חָטָ֔אנוּ כִּ֤י עָזַ֨בְנוּ֙ אֶת יְהוָ֔ה וַ/נַּעֲבֹ֥ד אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/עַשְׁתָּר֑וֹת וְ/עַתָּ֗ה הַצִּילֵ֛/נוּ מִ/יַּ֥ד אֹיְבֵ֖י/נוּ וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: id
  text: Lalu mereka berseru kepada TUHAN dan berkata, “Kami telah berdosa, sebab kami telah meninggalkan TUHAN dan beribadah kepada para Baal dan para Asytoret. Tetapi sekarang, lepaskanlah kami dari tangan musuh-musuh kami, maka kami akan beribadah kepada-Mu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Lalu mereka berseru
  rationale: Kata kerja ini menyatakan seruan keras atau permohonan mendesak; 'berseru' alami dalam konteks doa memohon pertolongan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mewakili nama ilahi YHWH dengan bentuk huruf kapital yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk jamak menunjuk berbagai manifestasi atau berhala Baal; 'para Baal' mempertahankan kejamakannya.
- source_word: הָעַשְׁתָּרוֹת
  choice: para Asytoret
  rationale: Bentuk jamak dipertahankan dengan 'para'; transliterasi 'Asytoret' sesuai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: הַצִּילֵנוּ מִיַּד
  choice: lepaskanlah kami dari tangan
  rationale: Mempertahankan metafora Ibrani 'dari tangan', yakni dari kuasa atau cengkeraman musuh.
- source_word: וְנַעַבְדֶךָּ
  choice: maka kami akan beribadah kepada-Mu
  rationale: Dalam kontras dengan pelayanan kepada ilah-ilah lain, עבד berarti beribadah atau mengabdi kepada TUHAN; 'beribadah' membuat dimensi kultisnya jelas.
theological_decisions:
- issue: Hubungan pengakuan dosa dengan meninggalkan TUHAN
  choice: sebab
  alternative: karena
  rationale: כִּי di sini menyatakan alasan atau penjelasan atas pengakuan dosa. 'Sebab' mempertahankan hubungan itu tanpa menambahkan tafsiran teologis.
- issue: Makna עבד dalam janji penutup
  choice: beribadah kepada-Mu
  alternative: melayani-Mu
  rationale: Konteksnya mengontraskan ibadah kepada Baal dan Asytoret dengan kesetiaan kepada TUHAN. 'Beribadah' menjaga paralel tersebut, meskipun kata sumber juga dapat mencakup pengabdian atau pelayanan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Struktur pengakuan, permohonan, dan janji dipertahankan. Metafora 'dari tangan musuh-musuh kami' sengaja dipertahankan karena jelas dan lazim dipahami.
