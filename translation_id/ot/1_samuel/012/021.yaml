  yaml_path: translation/ot/1_samuel/012/021.yaml
  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: id
  text: Janganlah menyimpang untuk mengikuti hal-hal yang sia-sia[a], yang tidak dapat memberi manfaat atau menyelamatkan[b], sebab hal-hal itu sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal yang kosong”, “hal-hal yang tidak berguna”, atau “berhala-berhala”. Kata Ibrani tohu menunjuk kepada sesuatu yang kosong, sia-sia, atau tanpa substansi.
    reason: lexical_alternative
  - marker: b
    text: Atau “membebaskan” atau “melepaskan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: menyimpang
  rationale: Verba סור berarti menyimpang atau berbalik dari jalan yang semestinya; pilihan ini mempertahankan metafora penyimpangan dari kesetiaan yang benar.
- source_word: אַחֲרֵי
  choice: untuk mengikuti
  rationale: Secara harfiah berarti 'di belakang/setelah'; dalam bahasa Indonesia, konstruksi ini secara alami menyatakan tindakan mengikuti atau mengejar objek kesetiaan lain.
- source_word: הַתֹּהוּ / תֹהוּ
  choice: hal-hal yang sia-sia / sia-sia
  rationale: תֹהוּ menunjuk pada apa yang kosong, tak berbobot, atau tidak berguna. 'Sia-sia' mempertahankan keluasan istilah tanpa mempersempitnya secara eksplisit menjadi berhala, sekaligus menggemakan pengulangan dalam teks Ibrani.
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: yang tidak dapat memberi manfaat
  rationale: Bentuk ini menggambarkan ketidakmampuan hal-hal tersebut untuk menghasilkan faedah; ungkapan Indonesia ini jelas dan wajar.
- source_word: וְלֹא יַצִּילוּ
  choice: ataupun melepaskan
  rationale: Dalam bentuk Hifil, נצל berarti melepaskan, menyelamatkan, atau membebaskan dari bahaya. 'Melepaskan' mempertahankan nuansa pembebasan tanpa menambahkan pengertian teologis yang lebih khusus.
- source_word: הֵמָּה
  choice: semuanya itu
  rationale: Pronomina jamak ini merujuk kembali kepada objek-objek yang sia-sia; 'semuanya itu' alami dalam bahasa Indonesia dan memperjelas rujukannya.
theological_decisions:
- issue: Rujukan 'hal-hal yang sia-sia'
  choice: Dipertahankan sebagai sebutan umum bagi hal-hal kosong atau objek kepercayaan yang keliru.
  alternative: berhala-berhala
  rationale: Konteks sangat mungkin menunjuk kepada berhala, tetapi תֹהוּ sendiri lebih luas daripada istilah khusus untuk berhala. Terjemahan ini mempertahankan keluasan dan ketegangan leksikal teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang tegas dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan pengulangan תֹהוּ dan ketidakspesifikan rujukannya.
