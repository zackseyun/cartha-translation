  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּמְכֹּ֣ר אֹתָ֡/ם בְּ/יַ֣ד סִֽיסְרָא֩ שַׂר צְבָ֨א חָצ֜וֹר וּ/בְ/יַד פְּלִשְׁתִּ֗ים וּ/בְ/יַד֙ מֶ֣לֶךְ מוֹאָ֔ב וַ/יִּֽלָּחֲמ֖וּ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: id
  text: Namun, mereka melupakan Yahweh, Allah mereka, lalu Ia menjual mereka[a] ke dalam tangan Sisera, panglima tentara Hazor, ke dalam tangan orang Filistin, dan ke dalam tangan raja Moab; lalu mereka berperang melawan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyerahkan mereka.” Secara harfiah, teks Ibrani mengatakan “menjual mereka,” sebuah idiom penghakiman perjanjian yang berarti menyerahkan suatu bangsa kepada kuasa musuh-musuhnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka berperang melawan mereka.” Subjeknya paling mungkin adalah para musuh yang baru disebutkan, sedangkan objeknya adalah Israel.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: mereka melupakan
  rationale: Mempertahankan arti dasar שׁכח, ‘melupakan’; dalam konteks perjanjian kata ini juga menyiratkan pengabaian dan ketidaksetiaan tanpa perlu menambahkan tafsiran itu ke dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Bentuk konstruksi dengan sufiks pronominal secara alami menyatakan hubungan ‘Allah mereka’.
- source_word: וַיִּמְכֹּר
  choice: Ia menjual
  rationale: מכר secara harfiah berarti ‘menjual’. Metafora penghakiman ini dipertahankan karena dapat dimengerti dan menyatakan bahwa Yahweh menyerahkan Israel kepada kuasa musuh.
- source_word: בְּיַד
  choice: ke dalam tangan
  rationale: Mempertahankan citra idiom Ibrani yang berarti diserahkan ke bawah kuasa pihak lain.
- source_word: שַׂר צְבָא חָצוֹר
  choice: panglima tentara Hazor
  rationale: שַׂר צְבָא menunjuk pemimpin militer; ‘panglima tentara’ merupakan padanan Indonesia modern yang jelas dan tetap dekat dengan struktur sumber.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk etnonim yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Padanan langsung bagi rantai konstruksi Ibrani.
- source_word: וַיִּלָּחֲמוּ בָם
  choice: Mereka pun berperang melawan Israel
  rationale: Subjek jamak paling alami merujuk pada para penindas yang baru disebutkan. ‘Israel’ memperjelas rujukan sufiks jamak בָם yang jika diterjemahkan ‘mereka’ akan kabur dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek verba ‘menjual’
  choice: Yahweh sebagai subjek tersirat, dinyatakan dengan ‘Ia’
  alternative: 'Bentuk pasif: ‘mereka dijual’'
  rationale: Verba tunggal meneruskan Yahweh, Allah mereka, sebagai subjek dari klausa sebelumnya. Ini mempertahankan gambaran penghakiman ilahi yang ada dalam teks.
- issue: Daya makna ‘melupakan Yahweh’
  choice: Diterjemahkan secara langsung sebagai ‘melupakan Yahweh’
  alternative: ‘meninggalkan Yahweh’ atau ‘mengabaikan Yahweh’
  rationale: Konteks dapat memberi nuansa ketidaksetiaan terhadap perjanjian, tetapi arti langsung ‘melupakan’ menjaga ungkapan sumber dan tidak memperkuatnya secara tafsiran.
- issue: Rujukan subjek dan objek dalam klausa terakhir
  choice: Para penindas sebagai subjek dan Israel sebagai objek
  alternative: 'Mempertahankan pronomina ambigu: ‘mereka berperang melawan mereka’'
  rationale: Bentuk jamak verba paling wajar mengacu kepada Sisera/pasukan Hazor, orang Filistin, dan raja Moab beserta kekuatannya; sufiks objek mengacu kepada Israel. Penyebutan ‘Israel’ menghindari dua pronomina identik yang tidak alami dan sangat kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah sebelum klausa terakhir agar daftar panjang tetap mudah dipahami. Metafora ‘menjual ke dalam tangan’ dipertahankan untuk menjaga citra dan ketegangan teologis teks sumber.
