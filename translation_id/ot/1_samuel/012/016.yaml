  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: id
  text: Sekarang, berdirilah di tempat dan lihatlah hal besar ini yang sedang Yahweh lakukan di depan mata kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Sekarang
  rationale: Gabungan ini berfungsi sebagai penanda peralihan menuju seruan yang khidmat. Dalam bahasa Indonesia modern, “Sekarang” menyampaikan peralihan itu secara alami; unsur גַּם tidak perlu diterjemahkan secara kaku sebagai “juga”.
- source_word: הִתְיַצְּבוּ
  choice: berdirilah teguh
  rationale: Imperatif Hitpael dari יצב meminta para pendengar mengambil dan mempertahankan posisi dengan penuh perhatian. “Berdirilah teguh” mempertahankan unsur sikap tubuh sekaligus kesiapan menyaksikan tindakan Allah.
- source_word: וּרְאוּ
  choice: dan lihatlah
  rationale: Imperatif ini mengajak umat menyaksikan langsung tanda yang akan terjadi. “Lihatlah” wajar dengan objek yang mengikutinya dan membawa nada seruan.
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: perkara besar ini
  rationale: דבר dapat berarti perkataan, perkara, hal, atau peristiwa. “Perkara besar ini” cukup luas untuk mempertahankan keluwesan maknanya tanpa lebih dahulu menentukannya sebagai mukjizat atau tanda.
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: yang sedang dilakukan Yahweh
  rationale: Partisipel עֹשֶׂה menggambarkan tindakan sebagai sedang berlangsung atau segera terwujud dari sudut pandang pembicara. Bentuk “sedang dilakukan” mempertahankan daya hidup aspek tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: לְעֵינֵיכֶם
  choice: di depan mata kalian
  rationale: Ungkapan ini menekankan sesuatu yang dapat mereka saksikan sendiri. “Di depan mata kalian” alami dan mempertahankan sifat publik serta kasatmata dari peristiwa itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama יהוה secara langsung. “Yahweh” mempertahankan nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Waktu atau aspek tindakan Yahweh
  choice: sedang dilakukan
  alternative: akan dilakukan
  rationale: Partisipel Ibrani dapat merujuk pada tindakan yang tengah berlangsung atau yang segera terjadi. Terjemahan “sedang dilakukan” mengikuti bentuk sumber dan mempertahankan gambaran tindakan yang sudah bergerak menuju perwujudannya, tanpa mengabaikan konteks bahwa tandanya belum sepenuhnya tampak.
translation_notes:
  register: 'Bahasa Indonesia modern, khidmat, dan mudah dipahami. Bentuk jamak “kalian” dipakai untuk memperjelas bahwa Samuel berbicara kepada seluruh umat. Tidak ada catatan kaki karena catatan pada lapisan konsultasi Inggris tampaknya salah tempat: penandanya muncul setelah ungkapan pembuka, sedangkan isinya membahas nama ilahi; terjemahan utama sudah menampilkan “Yahweh” secara langsung.'
