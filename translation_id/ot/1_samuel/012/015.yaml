id: 1SA.12.15
reference: 1 Samuel 12:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: id
  text: Tetapi jika kamu tidak mendengarkan suara Yahweh dan memberontak terhadap perintah Yahweh, maka tangan Yahweh akan melawan kamu dan leluhurmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “leluhurmu”. Sejumlah versi kuno dan banyak penafsir membaca “rajamu”, yang sesuai dengan konteks langsung tentang peringatan Samuel kepada umat dan raja mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Menyatakan syarat yang berlawanan dengan ayat sebelumnya; bentuk ini mempertahankan unsur penghubung sekaligus daya kontrasnya.
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: kamu tidak mendengarkan suara Yahweh
  rationale: Mempertahankan idiom Ibrani 'mendengarkan suara', yang dalam konteks ini juga mengandung makna menaati, tanpa menggantinya dengan tafsiran eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara konsisten dan membedakannya dari gelar 'Tuhan'.
- source_word: וּמְרִיתֶם
  choice: dan memberontak
  rationale: Akar מרה menunjukkan perlawanan atau pembangkangan yang serius, bukan sekadar kegagalan menaati.
- source_word: אֶת פִּי יְהוָה
  choice: terhadap perintah Yahweh
  rationale: Secara harfiah berarti 'mulut Yahweh', tetapi merupakan idiom bagi apa yang difirmankan atau diperintahkan-Nya; 'perintah' jelas dan wajar dalam bahasa Indonesia.
- source_word: וְהָיְתָה יַד יְהוָה
  choice: maka tangan Yahweh akan melawan
  rationale: Mempertahankan metafora alkitabiah 'tangan Yahweh' sebagai kuasa-Nya yang bertindak dalam penghukuman; 'maka' memperjelas akibat dari syarat tersebut.
- source_word: בָּכֶם
  choice: kamu
  rationale: Dipakai sesudah 'melawan' untuk menyatakan bahwa tindakan penghukuman Yahweh tertuju kepada umat.
- source_word: וּבַאֲבֹתֵיכֶם
  choice: dan leluhurmu
  rationale: Teks Masoret berbunyi 'bapa-bapamu'; 'leluhurmu' menyampaikan rujukan kepada para pendahulu secara alami dalam bahasa Indonesia, sementara varian tekstual 'rajamu' dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama ilahi dipertahankan sebagai nama diri tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi lazim.
- issue: Frasa akhir וּבַאֲבֹתֵיכֶם
  choice: dan leluhurmu
  alternative: dan rajamu
  rationale: Teks WLC/Masoret yang menjadi sumber utama berbunyi 'leluhurmu'. Sejumlah versi kuno dan penafsir mendukung 'rajamu', yang sesuai dengan konteks dekat, sehingga alternatif itu dicatat tanpa mengubah teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom penting seperti 'mendengarkan suara' dan 'tangan Yahweh' dipertahankan karena dapat dipahami serta membawa nuansa teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dipersoalkan.
