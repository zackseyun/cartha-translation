base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: id
  text: Ketika Yakub datang ke Mesir, nenek moyang kalian berseru kepada Yahweh. Lalu Yahweh mengutus Musa dan Harun, dan keduanya membawa nenek moyang kalian keluar dari Mesir serta membuat mereka menetap di tempat ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Ketika
  rationale: Kata ini memperkenalkan anak kalimat waktu dalam penuturan sejarah Samuel; “ketika” alami dan tepat dalam bahasa Indonesia.
- source_word: בָּא ... מִצְרָיִם
  choice: datang ke Mesir
  rationale: Verba בוא menyatakan gerak menuju suatu tempat. “Datang ke Mesir” mempertahankan arah tersebut dan terdengar alami.
- source_word: וַיִּזְעֲקוּ
  choice: berseru
  rationale: זעק menyatakan seruan mendesak untuk meminta pertolongan; “berseru” mempertahankan bobot permohonan itu tanpa ungkapan yang kaku.
- source_word: אֲבוֹתֵיכֶם
  choice: nenek moyang kalian
  rationale: Secara harfiah berarti “bapak-bapak kalian”, tetapi dalam konteks sejarah bersama menunjuk para leluhur. “Nenek moyang kalian” merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditampilkan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks Musa dan Harun yang diberi tugas ilahi, “mengutus” lebih tepat daripada sekadar “mengirim” dan tidak menambahkan gagasan di luar verba sumber.
- source_word: וַיּוֹצִיאוּ
  choice: keduanya membawa ... keluar
  rationale: Verba berbentuk jamak dan secara wajar merujuk kepada Musa dan Harun. “Keduanya” memperjelas subjek dalam bahasa Indonesia tanpa mengubah acuan sumber.
- source_word: וַיֹּשִׁבוּם בַּמָּקוֹם הַזֶּה
  choice: menempatkan mereka di negeri ini
  rationale: Bentuk kausatif ישׁב berarti membuat tinggal atau menetap. Dalam konteks pemberian tempat tinggal kepada Israel, “menempatkan mereka di negeri ini” alami; “negeri” menyampaikan bahwa הַמָּקוֹם menunjuk wilayah tempat Israel menetap.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יְהוָה. “Yahweh” mempertahankan fungsi nama perjanjian itu, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Pelaku keluarnya Israel dari Mesir
  choice: Musa dan Harun sebagai pelaku gramatikal yang diutus Yahweh
  alternative: Yahweh sebagai pelaku langsung yang tidak disebut dalam verba jamak
  rationale: Dua verba jamak וַיּוֹצִיאוּ dan וַיֹּשִׁיבוּם secara gramatikal paling dekat merujuk kepada Musa dan Harun. Terjemahan mempertahankan perantaraan mereka sekaligus konteks bahwa Yahweh yang mengutus mereka.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat. “Kalian” dipakai untuk membedakan pronomina jamak Ibrani dari bentuk tunggal. Kalimat dipecah setelah seruan kepada Yahweh agar rangkaian tindakan tetap mudah dipahami. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
