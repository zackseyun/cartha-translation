source:
  edition: WLC
  text: כִּ֠י לֹֽא יִטֹּ֤שׁ יְהוָה֙ אֶת עַמּ֔/וֹ בַּ/עֲב֖וּר שְׁמ֣/וֹ הַ/גָּד֑וֹל כִּ֚י הוֹאִ֣יל יְהוָ֔ה לַ/עֲשׂ֥וֹת אֶתְ/כֶ֛ם ל֖/וֹ לְ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: id
  text: Sebab Yahweh tidak akan meninggalkan[a] umat-Nya demi nama-Nya yang agung, karena Yahweh telah berkenan[b] menjadikan kamu umat milik-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menelantarkan” atau “membuang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “telah memilih untuk menjadikan kamu umat bagi diri-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: tidak akan meninggalkan
  rationale: Kata נטש di sini berarti meninggalkan atau menelantarkan. Pilihan ini alami dalam bahasa Indonesia modern dan tetap mempertahankan bobot relasional-perjanjian dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Dalam konteks hubungan Israel dengan Yahweh, עַם menunjuk kepada umat yang menjadi milik-Nya; 'umat-Nya' merupakan padanan yang ringkas dan lazim.
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: demi nama-Nya yang agung
  rationale: בַּעֲבוּר menyatakan alasan atau pertimbangan, sedangkan frasa 'nama-Nya yang agung' mempertahankan ungkapan Ibrani tentang nama, kehormatan, dan reputasi Yahweh.
- source_word: הוֹאִיל
  choice: telah berkenan
  rationale: הוֹאִיל menyampaikan kesediaan atau keputusan yang diambil dengan kehendak. 'Telah berkenan' mempertahankan nuansa kehendak ilahi yang penuh kemurahan tanpa mempersempitnya menjadi istilah doktrinal teknis.
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: menjadikan kamu umat milik-Nya
  rationale: Konstruksi ini menyatakan tindakan Yahweh membentuk Israel menjadi umat bagi diri-Nya. 'Umat milik-Nya' membuat unsur לוֹ eksplisit secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan sebuah gelar.
- issue: Nuansa kehendak ilahi dalam הוֹאִיל
  choice: telah berkenan
  alternative: telah memilih; telah memutuskan
  rationale: Pilihan ini mempertahankan nuansa kesediaan dan keputusan Yahweh yang penuh kemurahan, tanpa memasukkan pengertian teknis tentang pemilihan yang tidak harus dituntut oleh kata tersebut.
- issue: Fungsi לוֹ dalam ungkapan tentang umat
  choice: umat milik-Nya
  alternative: umat bagi diri-Nya; umat-Nya
  rationale: לוֹ secara harfiah berarti 'bagi-Nya'. 'Umat milik-Nya' menyampaikan hubungan kepunyaan dan perjanjian dengan wajar, sementara catatan kaki mempertahankan bentuk alternatif yang lebih dekat dengan susunan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti hormat untuk Allah ditulis dengan huruf kapital. Struktur sebab–alasan–dasar kehendak pada teks Ibrani dipertahankan, dan kedua kemunculan nama Yahweh tetap diterjemahkan secara eksplisit.
