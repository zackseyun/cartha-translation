  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: id
  text: Jika kalian takut akan Yahweh, melayani-Nya, mendengarkan suara-Nya,[a] dan tidak memberontak terhadap perintah Yahweh, maka baik kalian maupun raja yang memerintah atas kalian akan mengikuti Yahweh, Allah kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mendengarkan suara-Nya” juga dapat berarti “menaati suara-Nya”, sebab dalam bahasa Ibrani mendengar sering mencakup tanggapan yang taat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bagian akhir berbunyi, “dan kalian akan ada, baik kalian maupun raja yang memerintah atas kalian, sesudah Yahweh, Allah kalian.” Fungsi tepat konstruksi Ibrani ini tidak sepenuhnya jelas; maknanya dapat menunjuk pada kesetiaan berkelanjutan kepada, atau mengikuti, Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan fungsi syarat yang jelas dalam nasihat perjanjian ini.
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: kalian takut kepada Yahweh
  rationale: Kata ירא memuat makna takut sekaligus hormat kepada Allah; 'takut kepada' mempertahankan bobot teologis ungkapan itu. Nama יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: melayani Dia
  rationale: עבד dalam hubungan dengan Allah mencakup pelayanan yang bersifat ibadah, tetapi 'melayani' mempertahankan keluasan makna sumber.
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: mendengarkan suara-Nya
  rationale: Mempertahankan citra Ibrani tentang mendengar suara, sementara catatan kaki menjelaskan bahwa ungkapan ini juga menyiratkan ketaatan.
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: dan tidak memberontak terhadap perintah Yahweh
  rationale: מרה menunjukkan pemberontakan, bukan sekadar kegagalan menaati. Secara harfiah 'mulut Yahweh' merupakan idiom bagi perintah atau perkataan-Nya.
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: kalian dan raja
  rationale: Pasangan גַּם ... וְגַם mencakup kedua pihak. Dalam bahasa Indonesia, susunan ini sudah alami tanpa harus menambahkan 'baik ... maupun'.
- source_word: אֲשֶׁר מָלַךְ עֲלֵיכֶם
  choice: yang memerintah atas kalian
  rationale: Bentuk perfektif di sini mengidentifikasi raja yang sedang berkuasa; terjemahan kini paling alami dalam bahasa Indonesia.
- source_word: וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: maka ... akan mengikuti Yahweh, Allah kalian
  rationale: Mengungkapkan hasil syarat secara wajar. 'Mengikuti' menyampaikan kesetiaan yang tersirat oleh אַחַר, tetapi bentuk Ibrani yang tidak lazim dicatat agar ambiguitasnya tetap terlihat.
theological_decisions:
- issue: Makna klausa akhir וִהְיִתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: Dipahami secara positif sebagai 'kalian dan raja ... akan mengikuti Yahweh, Allah kalian.'
  alternative: 'Secara lebih harfiah: ''kalian akan ada, baik kalian maupun raja ... di belakang Yahweh, Allah kalian,'' dengan hubungan sintaksis dan nuansa hasil yang tetap tersirat.'
  rationale: Konteks mendukung gagasan kesetiaan atau mengikuti Yahweh, tetapi bahasa Ibraninya tidak menyatakan verba 'mengikuti' secara eksplisit. Catatan kaki menjaga ketegangan tersebut tanpa membebani teks utama.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi ilahi; transliterasi 'Yahweh' mempertahankan pembedaan antara nama itu dan gelar 'Tuhan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' dipakai karena semua verba orang kedua dalam bahasa Ibrani berbentuk jamak. Huruf kapital pada 'Dia' dan enklitik '-Nya' mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
