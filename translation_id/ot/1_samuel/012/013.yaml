id: 1SA.12.13
reference: 1 Samuel 12:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: id
  text: Dan sekarang, inilah raja yang telah kalian pilih, yang telah kalian minta. Lihatlah, Yahweh telah mengangkat[a] seorang raja untuk memerintah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “telah memberikan seorang raja atas kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan unsur penghubung וְ dan penanda waktu עַתָּה sebagai peralihan menuju kesimpulan Samuel.
- source_word: הִנֵּה הַמֶּלֶךְ
  choice: inilah raja
  rationale: Ungkapan deiktis ini secara alami mengarahkan perhatian pendengar kepada raja yang hadir di hadapan mereka.
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: yang telah kalian pilih
  rationale: Bentuk perfektif orang kedua jamak menunjuk pada tindakan pilihan bangsa itu yang sudah dilakukan.
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: yang telah kalian minta
  rationale: Dalam konteks ini שׁאל berarti meminta sesuatu, yakni seorang raja; bentuk Indonesia tidak perlu menambahkan kata depan.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Kemunculan kedua הִנֵּה kembali menarik perhatian dengan penekanan, sedangkan variasi dari 'inilah' menghindari pengulangan yang kaku.
- source_word: נָתַן ... עֲלֵיכֶם מֶלֶךְ
  choice: telah mengangkat seorang raja untuk memerintah kalian
  rationale: Secara harfiah berarti 'telah memberikan seorang raja atas kalian', tetapi dalam konstruksi ini נתן dengan עַל menyatakan penempatan seorang raja dalam kedudukan berkuasa; terjemahan utama menyampaikan fungsi itu secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Peran Yahweh dalam penetapan raja
  choice: Yahweh telah mengangkat seorang raja untuk memerintah kalian
  alternative: Yahweh telah memberikan seorang raja atas kalian
  rationale: Terjemahan ini mempertahankan tindakan Yahweh sebagai pihak yang menempatkan raja dalam wewenang atas bangsa itu, tanpa menyiratkan penilaian teologis tambahan tentang persetujuan atau penolakan-Nya terhadap permintaan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Sapaan jamak diterjemahkan 'kalian' untuk mempertahankan bahwa Samuel berbicara kepada seluruh bangsa. Dua kemunculan הִנֵּה dibedakan menjadi 'inilah' dan 'lihatlah' sesuai fungsi masing-masing.
