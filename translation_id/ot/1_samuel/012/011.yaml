source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: id
  text: Lalu Yahweh mengutus Yerubaal[a], Bedan[b], Yefta, dan Samuel, dan Ia melepaskan kalian dari tangan musuh-musuh kalian di sekeliling kalian, dan kalian hidup dengan aman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yerubaal adalah nama lain Gideon (lihat Hakim-hakim 6:32; 7:1).
    reason: cross_reference
  - marker: b
    text: Identitas Bedan tidak pasti; sebagian penafsir memahaminya sebagai Barak atau, lebih jarang, Abdon.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks Ibrani dan membedakannya dari gelar umum 'Tuhan'.
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks pengutusan para pembebas Israel, 'mengutus' lebih alami dan tepat daripada 'mengirim'.
- source_word: יְרֻבַּעַל
  choice: Yerubaal
  rationale: Mempertahankan nama yang tertulis dalam teks Ibrani; identifikasinya sebagai nama lain Gideon dijelaskan dalam catatan kaki.
- source_word: בְּדָן
  choice: Bedan
  rationale: Mempertahankan bacaan teks Masoret tanpa mengubahnya menjadi Barak atau Abdon; ketidakpastian identitasnya dicatat.
- source_word: יִפְתָּח
  choice: Yefta
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Menggunakan bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: וַיַּצֵּל
  choice: melepaskan
  rationale: Mengungkapkan tindakan membebaskan dari bahaya atau kuasa musuh dan sesuai dengan idiom berikutnya, 'dari tangan'.
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: dari tangan musuh-musuh
  rationale: Mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali; ungkapan ini tetap jelas dalam bahasa Indonesia.
- source_word: מִסָּבִיב
  choice: di sekeliling kalian
  rationale: Mempertahankan makna spasial bahwa musuh-musuh berada di sekitar Israel.
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: kalian hidup dengan aman
  rationale: Menyampaikan keadaan menetap tanpa ancaman secara alami, tanpa menambahkan hubungan tujuan atau akibat yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Identitas בְּדָן
  choice: Mempertahankan 'Bedan' dalam teks utama.
  alternative: Barak atau Abdon.
  rationale: WLC membaca 'Bedan'. Karena identitas tokoh ini tidak pasti, terjemahan tidak mengharmonisasikan atau mengemendasi nama tersebut secara diam-diam.
- issue: Hubungan klausa terakhir
  choice: Menggunakan koordinasi 'dan kalian hidup dengan aman'.
  alternative: '''sehingga kalian hidup dengan aman''.'
  rationale: Konjungsi Ibrani tidak secara eksplisit menandai tujuan atau akibat; koordinasi mempertahankan keterbukaan hubungan antarklausa.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kalian' dipakai untuk menyatakan sapaan orang kedua jamak dalam teks Ibrani. Nama-nama mengikuti bentuk Indonesia yang lazim, sedangkan Yerubaal dan Bedan dipertahankan sesuai teks sumber.
