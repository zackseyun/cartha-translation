  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: id
  text: Maka sekarang, berdirilah. Aku akan berperkara dengan kalian[a] di hadapan Yahweh mengenai segala perbuatan Yahweh yang adil[b], yang telah dilakukan-Nya bagi kalian dan bagi nenek moyang kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “aku akan menghakimi kalian”, “aku akan berargumentasi dengan kalian”, atau “biarlah aku mengajukan perkaraku terhadap kalian”. Ungkapan Ibrani ini bernuansa yudisial, yaitu memasuki suatu perkara di hadapan Yahweh.
    reason: lexical_alternative
  - marker: b
    text: “Perbuatan Yahweh yang adil” menunjuk kepada tindakan-tindakan Yahweh yang memperlihatkan keadilan dan kesetiaan-Nya kepada perjanjian demi umat-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Menandai peralihan sekaligus kesimpulan retoris dari perkataan Samuel; ungkapan ini lebih lengkap daripada sekadar “sekarang”.
- source_word: הִתְיַצְּבוּ
  choice: berdirilah
  rationale: Bentuk perintah jamak ini menyuruh para pendengar mengambil tempat dalam suasana resmi; “berdirilah” alami dalam bahasa Indonesia dan tidak menambahkan lokasi yang tidak tersurat.
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: Aku akan berperkara dengan kalian
  rationale: Konstruksi ini bernuansa yudisial, yakni memasuki perkara atau mengajukan kasus bersama/lawan pihak lain, bukan semata-mata menjatuhkan hukuman.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan ungkapan kehadiran ilahi dalam suasana perjanjian dan pengadilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: mengenai segala perbuatan benar Yahweh
  rationale: Bentuk jamak צִדְקוֹת menunjuk kepada tindakan konkret yang memperlihatkan keadilan dan kesetiaan Yahweh; “perbuatan benar” mempertahankan kaitannya dengan kebenaran tanpa mempersempitnya menjadi tindakan penyelamatan saja.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dilakukan-Nya
  rationale: Menyampaikan klausa relatif dan tindakan lampau dengan bahasa Indonesia yang alami; akhiran hormat “-Nya” merujuk kepada Yahweh.
- source_word: אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: bagi kalian dan bagi nenek moyang kalian
  rationale: Walaupun preposisinya secara harfiah dapat berarti “dengan”, konteks tindakan yang menguntungkan umat mendukung “bagi”; “nenek moyang” menyampaikan makna leluhur secara wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna צִדְקוֹת יְהוָה
  choice: segala perbuatan benar Yahweh
  alternative: segala tindakan penyelamatan Yahweh; segala perbuatan adil Yahweh
  rationale: Frasa ini mencakup tindakan Yahweh yang adil dan setia kepada perjanjian. Pilihan ini mempertahankan keluasan makna sumber serta ketegangan antara keadilan dan kemurahan yang menyelamatkan.
- issue: Peran Samuel dalam וְאִשָּׁפְטָה אִתְּכֶם
  choice: Aku akan berperkara dengan kalian
  alternative: Aku akan menghakimi kalian; aku akan bertukar alasan dengan kalian
  rationale: Pilihan utama menjaga suasana forensik tanpa menyatakan bahwa Samuel sudah menjatuhkan vonis; ambiguitas cakupan tindakan yudisial dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan khidmat. Kata ganti jamak “kalian” dipakai agar jumlah jamak dalam teks sumber terlihat jelas. Tanda seru setelah perintah mencerminkan desakan ujaran tanpa menambah isi.
