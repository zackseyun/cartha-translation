  text: וְ/עַתָּ֞ה הִנֵּ֥ה הַ/מֶּ֣לֶךְ מִתְהַלֵּ֣ךְ לִ/פְנֵי/כֶ֗ם וַ/אֲנִי֙ זָקַ֣נְתִּי וָ/שַׂ֔בְתִּי וּ/בָנַ֖/י הִנָּ֣/ם אִתְּ/כֶ֑ם וַ/אֲנִי֙ הִתְהַלַּ֣כְתִּי לִ/פְנֵי/כֶ֔ם מִ/נְּעֻרַ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: id
  text: Dan sekarang, lihatlah, raja berjalan di depan kalian[a]. Aku sudah tua dan beruban[b], dan anak-anakku ada bersama kalian. Aku telah berjalan di depan kalian[c] sejak masa mudaku sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja tampil di depan kalian” atau “raja memimpin kalian.” Ungkapan Ibrani “berjalan di depan” dapat menunjuk kepada kepemimpinan di hadapan umat.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “aku telah menjadi tua dan berambut putih.”
    reason: lexical_alternative
  - marker: c
    text: Atau “aku telah tampil di depan kalian” atau “aku telah memimpin kalian.” Samuel sengaja memakai ungkapan yang sejajar dengan ungkapan tentang raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengalihkan perhatian kepada keadaan saat ini. Dalam bahasa Indonesia, “Sekarang” menyampaikan fungsi tersebut secara alami; hubungan dengan ayat sebelumnya tetap tersirat dalam alur wacana.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel penunjuk ini menarik perhatian pendengar. “Lihatlah” mempertahankan daya demonstratifnya dengan bahasa modern dan bermartabat.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tertentu ini menunjuk kepada raja yang baru ditetapkan. Bahasa Indonesia tidak memiliki kata sandang tertentu yang sepadan, sehingga “raja” sudah memadai dalam konteks.
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: berjalan di depan kalian
  rationale: Terjemahan ini mempertahankan gambaran harfiah dan ungkapan Ibrani yang juga dapat menyiratkan tampil sebagai pemimpin di hadapan umat. Bentuk partisipnya disampaikan sebagai tindakan atau peranan yang sedang berlangsung.
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: aku sudah tua dan beruban
  rationale: 'Kedua verba menyatakan keadaan yang telah dicapai: menjadi tua dan berambut putih. “Sudah tua dan beruban” alami serta mempertahankan kedua unsur tersebut.'
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: dan anak-anakku ada bersama kalian
  rationale: Ungkapan ini menyatakan kehadiran anak-anak Samuel di tengah umat. “Ada bersama kalian” menjaga arti אִתְּכֶם tanpa menambahkan penilaian tentang kedudukan mereka.
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: aku telah berjalan di depan kalian
  rationale: Pilihan yang sama dengan ungkapan sebelumnya mempertahankan kesejajaran retoris antara peranan publik raja dan peranan Samuel, tanpa mempersempit maknanya menjadi “memimpin” saja.
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: sejak masa mudaku sampai hari ini
  rationale: Ungkapan waktu ini menunjukkan rentang pelayanan Samuel dari masa mudanya hingga saat ia berbicara.
theological_decisions:
- issue: Makna ungkapan “berjalan di depan” bagi raja dan Samuel
  choice: Mempertahankan ungkapan “berjalan di depan kalian” pada kedua tempat
  alternative: “memimpin kalian” atau “tampil sebagai pemimpin kalian”
  rationale: Ungkapan Ibrani dapat menunjuk kepada peranan kepemimpinan publik, tetapi gambaran berjalan juga nyata dan sengaja diulang. Terjemahan yang sama mempertahankan ambiguitas serta kesejajaran antara raja dan Samuel.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kata ganti “aku” dan “kalian” sesuai dengan tuturan langsung Samuel kepada seluruh umat. Ungkapan kunci “berjalan di depan kalian” dipertahankan secara konsisten agar gambaran Ibrani dan kesejajaran retoris tidak hilang.
