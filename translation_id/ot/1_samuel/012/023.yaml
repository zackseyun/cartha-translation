  text: גַּ֣ם אָנֹכִ֗י חָלִ֤ילָ/ה לִּ/י֙ מֵ/חֲטֹ֣א לַֽ/יהוָ֔ה מֵ/חֲדֹ֖ל לְ/הִתְפַּלֵּ֣ל בַּעַדְ/כֶ֑ם וְ/הוֹרֵיתִ֣י אֶתְ/כֶ֔ם בְּ/דֶ֥רֶךְ הַ/טּוֹבָ֖ה וְ/הַ/יְשָׁרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: id
  text: Sedangkan aku, pantang bagiku untuk berdosa terhadap Yahweh[a] dengan berhenti mendoakan kalian. Aku akan mengajarkan[b] kepada kalian jalan yang baik dan lurus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh adalah nama ilahi yang dalam bahasa Ibrani ditulis dengan empat huruf YHWH.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “mengajarkan” juga dapat berarti membimbing atau menunjukkan arah.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: Sedangkan aku
  rationale: Ungkapan ini menonjolkan Samuel dan mengontraskan tanggung jawabnya dengan tanggung jawab umat dalam konteks sekitar.
- source_word: חָלִילָה לִּי
  choice: pantang bagiku
  rationale: Idiom ini menyatakan penolakan keras terhadap sesuatu yang dipandang tidak patut atau mengerikan; padanan ini kuat sekaligus alami dalam bahasa Indonesia.
- source_word: מֵחֲטֹא לַיהוָה
  choice: berdosa terhadap Yahweh
  rationale: Mempertahankan pernyataan bahwa kelalaian tersebut merupakan dosa yang secara pribadi ditujukan terhadap Allah, bukan sekadar kegagalan menjalankan tugas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama perjanjian dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: dengan berhenti berdoa bagi kalian
  rationale: Menjelaskan tindakan yang akan membuat Samuel berdosa, yaitu menghentikan doa syafaat demi kepentingan umat.
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: Aku akan mengajarkan kepada kalian
  rationale: Bentuk kausatif dari ירה dalam konteks ini mencakup pengajaran dan pengarahan moral; 'mengajarkan' alami dan mempertahankan unsur didaktisnya.
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: jalan yang baik dan lurus
  rationale: Mempertahankan metafora jalan sebagai cara hidup serta pasangan sifat moral 'baik' dan 'lurus'.
theological_decisions:
- issue: Apakah berhenti mendoakan umat hanya merupakan kelalaian kepemimpinan atau dosa terhadap Allah
  choice: Dinyatakan secara tegas sebagai dosa terhadap Yahweh
  alternative: Dipahami hanya sebagai kegagalan menjalankan tanggung jawab kepemimpinan
  rationale: Teks Ibrani secara langsung memakai ungkapan 'berdosa terhadap Yahweh'; bobot teologis ini tidak boleh diperlemah.
- issue: Cara menerjemahkan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi yang hadir dalam teks sumber, alih-alih menggantinya dengan gelar.
- issue: Cakupan makna וְהוֹרֵיתִי
  choice: mengajarkan
  alternative: membimbing atau menunjukkan arah
  rationale: Kata kerja ini dapat mencakup pengajaran sekaligus pengarahan. Teks utama memakai 'mengajarkan', sementara catatan kaki mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Pantang bagiku' menyampaikan penolakan keras secara alami; 'kalian' dipakai karena sapaan ditujukan kepada umat secara jamak. Metafora 'jalan yang baik dan lurus' dipertahankan.
