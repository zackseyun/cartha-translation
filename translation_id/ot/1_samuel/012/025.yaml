  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: id
  text: Namun, jika kamu terus berbuat jahat[a], baik kamu maupun rajamu akan dilenyapkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sungguh-sungguh berbuat jahat” atau “berbuat fasik”; bahasa Ibrani menegaskan verba dengan infinitif absolut.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan binasa”, “akan dibinasakan”, atau “akan disapu bersih”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Partikel ini secara harfiah berarti 'dan jika', tetapi dalam konteksnya memperkenalkan pertentangan dengan janji pada ayat sebelumnya; 'Namun, jika' menyampaikan fungsi wacananya secara alami.
- source_word: הָרֵעַ תָּרֵעוּ
  choice: kamu terus berbuat jahat
  rationale: Infinitif absolut yang diikuti verba finit dari akar רעע memberi penegasan. Ungkapan ini menyampaikan daya intensif konstruksi Ibrani secara wajar, tanpa pengulangan yang kaku.
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: kamu maupun rajamu
  rationale: Pengulangan גַּם mencakup kedua pihak dalam peringatan. Bentuk 'kamu maupun rajamu' alami dalam bahasa Indonesia dan mempertahankan penekanan inklusif itu.
- source_word: תִּסָּפוּ
  choice: akan dilenyapkan
  rationale: Bentuk nifal dari ספה dapat berarti disapu bersih, dibinasakan, atau lenyap akibat penghukuman. 'Dilenyapkan' mempertahankan nuansa pasif dan cakupan ancaman tanpa menentukan cara penghukuman.
theological_decisions:
- issue: Sifat penghukuman yang diumumkan atas bangsa itu dan rajanya
  choice: Peringatan bersama tentang penghukuman atau penyingkiran yang menimpa rakyat dan raja mereka
  alternative: Hanya kekalahan militer atau hanya kebinasaan rohani
  rationale: Ayat ini menyampaikan ancaman perjanjian secara luas tanpa menetapkan bentuk penghukumannya. Karena itu, 'akan dilenyapkan' menjaga keseriusan dan keluasan ancaman tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Sapaan jamak Ibrani diterjemahkan dengan 'kamu' sesuai pemakaian Indonesia umum; konteks menunjukkan bahwa seluruh umat disapa.
