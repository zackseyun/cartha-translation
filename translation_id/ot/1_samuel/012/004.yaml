  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: id
  text: Lalu mereka berkata, “Engkau tidak menindas kami, tidak memperlakukan kami dengan kejam, dan tidak mengambil apa pun dari tangan siapa pun.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Ibrani berbunyi, “dari tangan seorang pun, apa pun.” Dalam konteks ini, ungkapan tersebut dapat mencakup menerima pembayaran, hadiah, atau suap dari seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol meneruskan urutan narasi; “lalu” menyampaikan alurnya secara alami dalam bahasa Indonesia.
- source_word: עֲשַׁקְתָּנוּ
  choice: engkau tidak pernah menindas kami
  rationale: עשׁק menunjuk pada penindasan, pemerasan, atau eksploitasi melalui penyalahgunaan kuasa. “Menindas” mempertahankan cakupan luasnya dalam konteks pertanggungjawaban publik.
- source_word: רַצּוֹתָנוּ
  choice: memperlakukan kami dengan kejam
  rationale: רצץ secara harfiah dapat berarti meremukkan, tetapi dalam konteks ini dipakai secara metaforis untuk perlakuan keras atau sewenang-wenang. Pilihan ini mempertahankan kekuatan ungkapan tanpa menyiratkan tindakan fisik secara sempit.
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: engkau tidak pernah mengambil apa pun dari tangan siapa pun
  rationale: Terjemahan ini mempertahankan idiom konkret “dari tangan” dan tidak membatasi maksudnya secara eksplisit hanya pada suap, hadiah, atau pembayaran.
- source_word: אִישׁ
  choice: siapa pun
  rationale: Dalam klausa negatif ini, bentuk tunggal אִישׁ berfungsi secara generik; “siapa pun” merupakan padanan Indonesia yang alami dan tepat tanpa menambahkan pembatasan gender yang tidak diperlukan.
- source_word: מְאוּמָה
  choice: apa pun
  rationale: Dalam konstruksi negatif, מְאוּמָה berarti sesuatu apa pun; “apa pun” adalah ungkapan Indonesia yang paling alami.
