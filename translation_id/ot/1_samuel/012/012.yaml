revisions:
- from: Ketika kamu melihat bahwa Nahas, raja bani Amon, datang menyerang kamu, kamu berkata kepadaku, ‘Tidak! Seorang raja harus memerintah atas kami,’ padahal TUHAN, Allahmu, adalah Rajamu.[a]
  to: Ketika kamu melihat bahwa Nahas, raja orang Amon, sedang datang menyerang kamu, kamu berkata kepadaku, ‘Tidak, seorang raja akan memerintah kami,’ padahal TUHAN, Allahmu, adalah rajamu.[a]
  rationale: Revisi ini menghilangkan modalitas tambahan pada tuntutan umat, memakai ungkapan Indonesia modern yang lebih alami, dan membetulkan arah alternatif kala dalam catatan kaki sambil mempertahankan ambiguitas klausa nominal Ibrani.
