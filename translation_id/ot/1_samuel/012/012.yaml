  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: id
  text: Ketika kamu melihat bahwa Nahas, raja orang Amon, sedang datang menyerang kamu, kamu berkata kepadaku, ‘Tidak, seorang raja akan memerintah kami,’ padahal TUHAN, Allahmu, adalah rajamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “padahal TUHAN, Allahmu, dahulu adalah rajamu.” Klausa Ibrani tidak memiliki kata kerja yang menyatakan kala, sehingga dapat dipahami dalam arti kini atau lampau dari konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: Ketika kamu melihat
  rationale: Bentuk wayyiqtol memperkenalkan keadaan yang mendorong tanggapan Israel; ungkapan temporal ini alami dalam bahasa Indonesia.
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: Nahas, raja bani Amon
  rationale: Nama ditransliterasikan sebagai Nahas, sedangkan frasa etnis בְּנֵי עַמּוֹן diterjemahkan dengan sebutan Alkitabiah Indonesia yang dikenal dan tetap mudah dipahami.
- source_word: בָּא עֲלֵיכֶם
  choice: datang menyerang kamu
  rationale: Dalam konteks militer, בוא dengan עַל menyatakan gerak bermusuhan terhadap pihak lain; 'menyerang' memperjelas daya idiomatisnya tanpa menambah hasil serangan.
- source_word: לֹא כִּי
  choice: Tidak!
  rationale: לֹא menandai penolakan tegas sebelum tuntutan tandingan. Dalam bahasa Indonesia, tanda seru menyampaikan penegasan itu secara alami tanpa harus menambahkan konjungsi yang kaku.
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: Seorang raja harus memerintah atas kami
  rationale: Gabungan nomina dan verba dari akar yang sama menegaskan tuntutan akan pemerintahan raja; 'harus' mempertahankan daya desakan tersebut.
- source_word: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: padahal TUHAN, Allahmu, adalah Rajamu
  rationale: Klausa nominal Ibrani tidak memiliki kopula eksplisit. Bentuk kini 'adalah' mempertahankan kemungkinan pernyataan berkelanjutan dan terdengar alami; alternatif lampau dicatat dalam catatan kaki.
theological_decisions:
- issue: Kala kopula tersirat dalam וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: adalah Rajamu
  alternative: adalah Rajamu pada waktu itu / dahulu Rajamu
  rationale: Bahasa Ibrani tidak menyatakan kala secara eksplisit. Bentuk kini mempertahankan kemungkinan bahwa pemerintahan TUHAN tetap berlaku, sedangkan konteks naratif memungkinkan pembacaan lampau; ambiguitas ini dijaga melalui catatan kaki.
- issue: Kontras antara tuntutan akan raja manusia dan pemerintahan TUHAN
  choice: padahal
  alternative: meskipun
  rationale: '''Padahal'' secara alami menandai teguran Samuel dan pertentangan antara permintaan umat dengan kenyataan bahwa TUHAN adalah Raja mereka, tanpa menetapkan doktrin tambahan.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina tunggal 'kamu' mengikuti sapaan kolektif Ibrani kepada Israel dan konsisten dalam ayat. Nama ilahi יהוה diterjemahkan 'TUHAN' menurut konvensi umum Alkitab bahasa Indonesia.
