id: 1SA.12.1
reference: 1 Samuel 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל כָּל יִשְׂרָאֵ֔ל הִנֵּה֙ שָׁמַ֣עְתִּי בְ/קֹֽלְ/כֶ֔ם לְ/כֹ֥ל אֲשֶׁר אֲמַרְתֶּ֖ם לִ֑/י וָ/אַמְלִ֥יךְ עֲלֵי/כֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/001.yaml
  text: Then Samuel said to all Israel, “Look, I have listened to your voice in all that you have said to me, and I have made a king reign over you.”
translation:
  language: id
  text: Lalu Samuel berkata kepada seluruh Israel, “Lihatlah, aku telah mendengarkan perkataan kalian dalam segala hal yang telah kalian katakan kepadaku, dan aku telah mengangkat seorang raja untuk memerintah atas kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda perhatian yang membuka pernyataan Samuel dengan bentuk Indonesia yang wajar dan bermartabat.
- source_word: שָׁמַעְתִּי בְקֹלְכֶם
  choice: aku telah mendengarkan perkataan kalian
  rationale: Ungkapan Ibrani harfiah berarti mendengarkan suara seseorang, tetapi secara idiomatis menyatakan bahwa permintaannya didengar dan dituruti; 'perkataan kalian' menjaga citra ujaran tanpa menjadi janggal.
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: aku telah mengangkat seorang raja untuk memerintah atas kalian
  rationale: Bentuk kausatif dari מלך menyatakan bahwa Samuel menyebabkan atau menetapkan seorang raja memerintah; terjemahan ini mempertahankan unsur pemerintahan, bukan sekadar penunjukan jabatan.
theological_decisions:
- issue: Peran Samuel dalam berdirinya kerajaan
  choice: aku telah mengangkat seorang raja untuk memerintah atas kalian
  alternative: aku telah menjadikan seorang raja atas kalian
  rationale: Pilihan ini menyampaikan tindakan kausatif yang secara gramatikal dikaitkan dengan Samuel, tanpa memperluasnya menjadi klaim bahwa ia merupakan sumber tertinggi kewenangan raja.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan jamak diterjemahkan dengan 'kalian' karena Samuel berbicara kepada seluruh Israel, sedangkan 'atas kalian' mempertahankan relasi pemerintahan yang dinyatakan dalam teks Ibrani.
