  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֤א שְׁמוּאֵל֙ אֶל יְהוָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה קֹלֹ֥ת וּ/מָטָ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּירָ֨א כָל הָ/עָ֥ם מְאֹ֛ד אֶת יְהוָ֖ה וְ/אֶת שְׁמוּאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: id
  text: Lalu Samuel berseru kepada Yahweh, dan pada hari itu Yahweh mendatangkan guruh[a] dan hujan. Maka seluruh rakyat menjadi sangat takut kepada Yahweh dan Samuel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “suara-suara”; dalam konteks badai ini, kata tersebut merujuk pada guruh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: berseru kepada Yahweh
  rationale: Dalam konstruksi dengan אֶל־יְהוָה, קרא menyatakan seruan yang ditujukan kepada Allah, yakni dalam doa. “Berseru kepada” alami dalam bahasa Indonesia dan mempertahankan daya ungkap tindakan Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וַיִּתֵּן
  choice: mendatangkan
  rationale: Secara harfiah berarti “memberikan”, tetapi bersama guruh dan hujan menyatakan bahwa Yahweh menyebabkan gejala badai itu terjadi. “Mendatangkan” menyampaikan idiom tersebut secara alami.
- source_word: קֹלוֹת
  choice: guruh
  rationale: Bentuk jamak dari קוֹל secara harfiah dapat berarti “suara-suara”, tetapi dalam konteks cuaca dan bersama hujan merujuk pada bunyi guruh.
- source_word: וּמָטָר
  choice: dan hujan
  rationale: Padanan langsung yang tidak menambahkan tingkat derasnya hujan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Mempertahankan penunjukan waktu yang khusus dan alami dalam bahasa Indonesia.
- source_word: וַיִּירָא ... מְאֹד
  choice: menjadi sangat takut
  rationale: Mempertahankan unsur ketakutan yang kuat dalam ירא dan daya penegas מְאֹד, tanpa melunakkannya hanya menjadi rasa kagum.
- source_word: כָל־הָעָם
  choice: seluruh rakyat
  rationale: Dalam konteks bangsa Israel yang sedang berkumpul di hadapan Samuel, “seluruh rakyat” merupakan padanan kolektif yang wajar.
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: kepada Yahweh dan Samuel
  rationale: Kedua objek tetap berada di bawah verba yang sama, sebagaimana dalam bahasa Ibrani, tanpa menyamakan kedudukan Yahweh dan Samuel atau membagi maknanya secara tafsiriah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi.
- issue: Rasa takut yang diarahkan kepada Yahweh dan Samuel
  choice: sangat takut kepada Yahweh dan Samuel
  alternative: takut kepada Yahweh dan menghormati Samuel
  rationale: Bahasa Ibrani memakai satu verba yang sama bagi kedua objek. Terjemahan mempertahankan ketegangan itu dan tidak diam-diam membedakan takut kepada Yahweh dari hormat kepada Samuel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berseru” mempertahankan corak doa yang sungguh-sungguh; “guruh” dipilih sebagai istilah cuaca yang jelas. Susunan kalimat dipecah menjadi dua agar mudah dibaca tanpa mengubah hubungan peristiwa dalam teks.
