  text: But a messenger came to Saul, saying, “Hurry and come, for the Philistines have made a raid against the land.”
translation:
  language: id
  text: Namun, seorang utusan datang kepada Saul dan berkata, “Segeralah pergi, karena orang Filistin telah melakukan penyerbuan ke negeri itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאָךְ
  choice: Namun, seorang utusan
  rationale: מַלְאָךְ dalam konteks ini adalah pembawa berita manusia, sehingga 'utusan' lebih tepat daripada 'malaikat'. Konjungsi וּ menandai perkembangan yang berlawanan dengan pengejaran sebelumnya dan secara alami diterjemahkan 'Namun'.
- source_word: מַהֲרָה וְלֵכָה
  choice: Cepatlah datang
  rationale: Ungkapan ini merupakan desakan untuk segera bergerak menuju tempat yang memerlukan Saul. 'Cepatlah datang' mempertahankan urgensi dan arah pragmatis perintah.
- source_word: פָשְׁטוּ פְלִשְׁתִּים
  choice: orang Filistin telah menyerbu
  rationale: Kata פשט dalam konteks militer berarti menyerbu atau melakukan penyerbuan. Bentuk perfektum menunjukkan serangan itu sudah berlangsung atau telah dimulai.
- source_word: עַל הָאָרֶץ
  choice: negeri ini
  rationale: Secara harfiah berarti 'atas/terhadap negeri itu'. Dalam konteks laporan kepada raja Israel, acuannya adalah negeri Israel; 'negeri ini' terdengar alami tanpa menambahkan nama yang tidak dinyatakan.
