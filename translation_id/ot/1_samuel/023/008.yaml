  text: So Saul summoned all the people to war[a], to go down to Keilah, to besiege David and his men.
translation:
  language: id
  text: Lalu Saul mengerahkan seluruh rakyat untuk berperang,[a] untuk turun ke Kehila dan mengepung Daud beserta orang-orangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memanggil seluruh rakyat untuk bertempur.” Kata kerja Ibrani ini secara harfiah dapat berarti “membuat mendengar” dan dalam konteks ini kemungkinan menunjuk pada pemanggilan orang-orang untuk tindakan militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: mengerahkan
  rationale: Dalam bentuk Hifil, שׁמע secara harfiah dapat berarti ‘membuat mendengar’; dalam konteks mobilisasi militer, kata ini paling wajar dipahami sebagai memanggil dan mengerahkan orang untuk bertindak.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Pilihan ini mempertahankan arti harfiah ‘seluruh rakyat’ tanpa mempersempitnya menjadi ‘tentara’, meskipun konteksnya jelas merupakan pengerahan militer.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Frasa ini menyatakan tujuan pengerahan, yaitu tindakan militer; ‘untuk berperang’ alami dalam bahasa Indonesia modern.
- source_word: לָרֶדֶת
  choice: untuk pergi
  rationale: ירד secara harfiah berarti ‘turun’, tetapi dalam narasi perjalanan juga dapat berfungsi sebagai verba gerak. ‘Pergi’ lebih alami dalam bahasa Indonesia karena arah topografisnya tidak perlu ditegaskan di sini.
- source_word: קְעִילָה
  choice: Kehila
  rationale: Bentuk transliterasi nama tempat yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: לָצוּר
  choice: mengepung
  rationale: Dalam konteks militer ini, צור menunjuk pada tindakan mengepung atau melakukan pengepungan terhadap sasaran.
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: Daud beserta orang-orangnya
  rationale: אֶל menandai sasaran pengepungan. ‘Orang-orangnya’ mempertahankan keluasan אֲנָשָׁיו tanpa secara eksplisit mengubahnya menjadi ‘prajurit’.
