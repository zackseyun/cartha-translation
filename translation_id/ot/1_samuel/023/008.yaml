translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Mengerahkan’ dipakai untuk menyampaikan idiom mobilisasi militer, sementara catatan kaki mempertahankan alternatif leksikal. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
