base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: id
  text: Lalu Saul dan orang-orangnya pergi mencari Daud. Mereka memberitahukan hal itu kepada Daud, lalu ia turun ke bukit batu[a] dan tinggal di padang belantara Maon. Ketika Saul mendengarnya, ia mengejar Daud di padang belantara Maon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tebing batu” atau “batu besar”. Bahasa Ibrani tampaknya menunjuk pada suatu formasi batu yang dikenal sebagai lokasi tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: mencari Daud
  rationale: Infinitif ini menyatakan tujuan. Objeknya tidak dinyatakan dalam bahasa Ibrani, tetapi jelas dari konteks; nama 'Daud' ditambahkan agar kalimat Indonesia alami dan tidak rancu.
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Ketika hal itu diberitahukan kepada Daud
  rationale: Bentuk Ibrani secara harfiah berarti 'mereka memberitahukan kepada Daud', tetapi pelakunya tidak disebutkan. Bentuk pasif alami dalam bahasa Indonesia mempertahankan ketidakjelasan pelaku dan menghubungkan berita itu dengan tindakan Daud berikutnya.
- source_word: וַיֵּרֶד
  choice: ia turun
  rationale: Mempertahankan arah gerak ke bawah yang dinyatakan verba Ibrani; subjeknya adalah Daud berdasarkan konteks terdekat.
- source_word: הַסֶּלַע
  choice: bukit batu
  rationale: Kata selaʿ menunjuk pada batu besar, tebing, atau formasi batu yang menonjol. 'Bukit batu' terdengar alami dan cocok untuk suatu lokasi perlindungan berbatu, tanpa mempersempitnya menjadi benteng.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks naratif, verba ini menyatakan berada atau menetap untuk suatu waktu di tempat tersebut; 'tinggal' alami dan cukup luas maknanya.
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: di padang belantara Maon
  rationale: Midbar tidak harus berupa gurun pasir, melainkan kawasan liar atau tanah penggembalaan yang jarang dihuni. 'Padang belantara' mempertahankan nuansa geografis itu.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: ia mengejar
  rationale: Ungkapan Ibrani bermakna mengejar seseorang. Bahasa Indonesia secara alami merangkum unsur 'mengikuti dari belakang' dalam verba 'mengejar'.
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: Lalu Saul dan orang-orangnya pergi
  rationale: Waw konsekutif melanjutkan urutan cerita. 'Lalu' merupakan penghubung naratif yang alami; 'orang-orangnya' mempertahankan cakupan umum anashaw tanpa secara eksplisit membatasinya pada tentara.
