  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat ditransliterasikan sebagai 'Maon'. Ketidakjelasan pelaku pemberitaan dipertahankan melalui bentuk pasif.
