  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: id
  text: Sekarang, ya Raja, turunlah sesuai dengan segala keinginan hati Raja untuk turun.[a] Dan tugas kami adalah menyerahkan dia ke dalam tangan Raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang kata kerja “turun” (infinitif diikuti imperatif) untuk memberi penegasan: secara harfiah, “untuk turun, turunlah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda peralihan langsung menuju permohonan; “Sekarang” alami dalam narasi Indonesia dan cukup mewakili daya wacananya.
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: sesuai dengan segala keinginan hati Raja
  rationale: Frasa ini menyatakan kesesuaian penuh dengan hasrat batin sang raja. “Keinginan hati” menyampaikan idiom Ibrani secara alami tanpa menghilangkan gagasan keinginan yang mendalam.
- source_word: הַמֶּלֶךְ
  choice: ya Raja / Raja
  rationale: Nomina berartikel dipakai sebagai sapaan langsung. “Ya Raja” merupakan sapaan Indonesia yang jelas dan bermartabat; penyebutan berikutnya memakai “Raja” sebagai bentuk penghormatan.
- source_word: לָרֶדֶת רֵד
  choice: turunlah ... untuk turun
  rationale: Gabungan infinitif dan imperatif mengulang akar verba untuk memberi penegasan. Terjemahan mempertahankan pengulangan itu, sedangkan catatan kaki menjelaskan fungsinya.
- source_word: וְלָנוּ
  choice: Kamilah yang akan
  rationale: Bentuk ini menandai tanggung jawab atau bagian yang menjadi tugas para pembicara. Konstruksi berfokus “Kamilah” mengungkapkan penekanan tersebut secara alami.
- source_word: הַסְגִּירוֹ
  choice: menyerahkan dia
  rationale: Hifil סגר dalam konteks ini berarti memberikan seseorang ke dalam kuasa pihak lain. “Menyerahkan dia” jelas dan sesuai dengan konteks bermusuhan.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: ke dalam tangan Raja
  rationale: Mempertahankan citra idiom Ibrani tentang pemindahan seseorang ke bawah kuasa sang raja, sambil tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Sapaan “ya Raja” serta bentuk penghormatan “Raja” dipakai tanpa pronomina orang kedua. Idiom “keinginan hati” dipilih agar makna אַוַּת נַפְשְׁךָ mudah dipahami, sementara pengulangan verba dan gambaran “ke dalam tangan” dipertahankan demi kedekatan dengan sumber.
