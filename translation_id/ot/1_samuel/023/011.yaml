revisions:
- from: “Apakah orang-orang Kehila akan menyerahkan aku ke dalam tangannya[a]? Apakah Saul akan turun kemari, seperti yang telah didengar hamba-Mu? Ya Yahweh, Allah Israel, beritahukanlah kiranya kepada hamba-Mu.” Yahweh menjawab, “Ia akan turun.”
  to: “Apakah orang-orang Kehila akan menyerahkan aku ke dalam tangannya[a]? Apakah Saul akan turun, sebagaimana yang telah hamba-Mu dengar? Yahweh, Allah Israel, beritahukanlah kiranya kepada hamba-Mu.” Yahweh menjawab, “Ia akan turun.”
  rationale: Revisi membetulkan subjek dalam klausa “hamba-Mu telah mendengar,” memperhalus sapaan vokatif agar alami dalam bahasa Indonesia modern, dan menghilangkan “kemari” yang tidak eksplisit dalam sumber. Istilah penting, pertanyaan ganda, serta jawaban singkat Yahweh tetap dipertahankan.
