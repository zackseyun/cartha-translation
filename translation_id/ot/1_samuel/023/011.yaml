  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: id
  text: “Apakah orang-orang Kehila akan menyerahkan aku ke dalam tangannya[a]? Apakah Saul akan turun, sebagaimana yang telah hamba-Mu dengar? Yahweh, Allah Israel, beritahukanlah kiranya kepada hamba-Mu.” Yahweh menjawab, “Ia akan turun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam tangannya”; suatu ungkapan yang berarti ke dalam kuasa atau kendali Saul.
    reason: Menjelaskan idiom Ibrani בְיָדוֹ sambil mempertahankan gambaran “tangan” dalam teks utama.
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: akan menyerahkan aku
  rationale: Bentuk Hifil dari סגר di sini berarti menyerahkan seseorang kepada kuasa pihak lain. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa penyerahan yang membahayakan Daud.
- source_word: בַעֲלֵי קְעִילָה
  choice: orang-orang Kehila
  rationale: Dalam konteks kewargaan ini, בעלי menunjuk kepada warga atau kaum laki-laki kota Kehila, bukan secara khusus para pemilik atau penguasa. 'Orang-orang Kehila' wajar dan tidak mempersempit rujukannya hanya kepada para pemimpin.
- source_word: בְיָדוֹ
  choice: ke dalam tangannya
  rationale: Terjemahan ini mempertahankan kiasan Ibrani tentang tangan sebagai kuasa atau kendali. Kata ganti tersebut merujuk kepada Saul; makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: יֵרֵד
  choice: akan turun / akan turun kemari
  rationale: Kata ירד secara harfiah berarti turun. Dalam pertanyaan, 'kemari' memperjelas bahwa Saul bergerak menuju tempat Daud berada; dalam jawaban singkat, bentuk 'akan turun' mempertahankan susunan ringkas teks Ibrani.
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: seperti yang telah didengar hamba-Mu
  rationale: Frasa ini mempertahankan cara Daud menyebut dirinya dengan rendah hati serta menunjukkan bahwa pertanyaannya didasarkan pada laporan yang telah diterimanya.
- source_word: הַגֶּד נָא
  choice: beritahukanlah kiranya
  rationale: Partikel נָא melunakkan sekaligus menguatkan permohonan. 'Kiranya' sesuai dengan ragam doa yang khidmat tanpa menjadi kuno atau sukar dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi Allah dalam teks sumber tidak diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak mengubahnya menjadi gelar.
- issue: Jawaban ilahi hanya menjawab pertanyaan tentang kedatangan Saul
  choice: “Ia akan turun.”
  alternative: Menggabungkan jawaban mengenai Saul dan penyerahan oleh orang-orang Kehila
  rationale: Dalam ayat ini, jawaban Yahweh yang dicatat hanya יֵרֵד, yaitu 'Ia akan turun.' Jawaban atas pertanyaan pertama muncul pada ayat berikutnya, sehingga ayat ini tidak boleh diperluas.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Sapaan doa memakai 'hamba-Mu' dan 'kiranya' untuk menjaga kerendahan hati Daud. 'Turun kemari' mempertahankan unsur arah dalam ירד sekaligus terdengar alami dari sudut pandang Daud.
