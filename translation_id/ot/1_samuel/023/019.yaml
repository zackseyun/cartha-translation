base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: id
  text: Kemudian orang-orang Zif naik menghadap Saul di Gibea dan berkata, “Bukankah Daud bersembunyi di antara kami, di kubu-kubu pertahanan di kawasan berhutan[a], di bukit Hakhila, yang terletak di sebelah kanan Yesyimon[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Horesh,” jika kata Ibrani itu dipahami sebagai nama tempat dan bukan sebagai “kawasan berhutan.”
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani ini secara harfiah berarti “di sebelah kanan Yesyimon.” Dalam cara penentuan arah Ibrani, ungkapan ini mungkin berarti “di sebelah selatan Yesyimon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: datang
  rationale: Kata עלה secara harfiah menyatakan gerak naik, tetapi dalam konteks perjalanan menuju Saul, bahasa Indonesia alami cukup memakai “datang”; arah tujuan tetap dinyatakan oleh “kepada Saul di Gibea”.
- source_word: זִפִים
  choice: orang-orang Zif
  rationale: Bentuk jamak gentilisia ini menunjuk kepada penduduk Zif; “orang-orang Zif” jelas dan alami dalam bahasa Indonesia.
- source_word: הַגִּבְעָתָה
  choice: di Gibea
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Gibea. Karena konstruksinya adalah datang kepada Saul, “kepada Saul di Gibea” secara alami menunjukkan Gibea sebagai tempat Saul berada.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif yang memperkenalkan ucapan langsung dialihkan menjadi koordinasi verbal yang lebih alami dalam bahasa Indonesia.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “Bukankah” mempertahankan fungsi tersebut.
- source_word: מִסְתַּתֵּר
  choice: bersembunyi
  rationale: Partisipel hitpael dari סתר menunjukkan tindakan menyembunyikan diri yang sedang berlangsung.
- source_word: עִמָּנוּ
  choice: di antara kami
  rationale: Secara harfiah berarti “bersama kami,” tetapi konteksnya menunjuk keberadaan Daud di wilayah mereka; “di antara kami” menyampaikan nuansa itu tanpa menyiratkan persekutuan.
- source_word: בַמְּצָדוֹת
  choice: di tempat-tempat perlindungan
  rationale: מְצָדוֹת menunjuk lokasi-lokasi yang aman dan mudah dipertahankan. “Tempat-tempat perlindungan” lebih mudah dipahami daripada “benteng-benteng” dan tidak mengharuskan adanya bangunan.
- source_word: בַּחֹרְשָׁה
  choice: di daerah berhutan
  rationale: Bentuk ini dapat dipahami sebagai nomina umum yang berarti kawasan berhutan atau sebagai nama tempat Horesh. Bacaan deskriptif dipakai dalam teks, sedangkan alternatif nama tempat dipertahankan dalam catatan kaki.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: di Bukit Hakhila
  rationale: Frasa ini menunjuk lokasi topografis bernama Bukit Hakhila; “di” terdengar alami dalam bahasa Indonesia untuk lokasi tersebut.
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: yang terletak di sebelah kanan Yesyimon
  rationale: Terjemahan ini mempertahankan citra arah Ibrani secara langsung. Kemungkinan makna geografis “di sebelah selatan” dijelaskan dalam catatan kaki agar tidak menutup ambiguitas.
