  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: id
  text: Lalu Daud berkata, “Ya Yahweh[a], Allah Israel, hamba-Mu benar-benar telah mendengar bahwa Saul berusaha datang ke Kehila untuk memusnahkan kota itu karena aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani dan padanan tradisional bagi pembaca.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara alami dan tepat diterjemahkan “Allah Israel” dalam bahasa Indonesia.
- source_word: שָׁמֹעַ שָׁמַע
  choice: benar-benar telah mendengar
  rationale: Infinitif absolut bersama verba finit memberi penegasan; “benar-benar” mempertahankan intensitas itu dengan wajar.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Sebutan diri yang merendah ketika berbicara kepada Allah; “hamba-Mu” sesuai dengan konteks dan ragam bahasa.
- source_word: מְבַקֵּשׁ
  choice: berusaha
  rationale: Partisip ini menyatakan upaya atau maksud yang sedang berlangsung tanpa mengubahnya menjadi kepastian rencana.
- source_word: לָבוֹא אֶל קְעִילָה
  choice: datang ke Kehila
  rationale: Mempertahankan sudut pandang verba בוא (“datang/masuk”) dan memakai bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: לְשַׁחֵת
  choice: memusnahkan
  rationale: Dalam konteks serangan militer, kata ini mengungkapkan penghancuran berat atau menyeluruh.
- source_word: לָעִיר
  choice: kota ini
  rationale: Nomina tertentu menunjuk kepada Kehila yang sedang dibicarakan; “kota ini” alami dalam ucapan Daud dari konteks setempat.
- source_word: בַּעֲבוּרִי
  choice: karena aku
  rationale: Ungkapan ini menyatakan sebab atau alasan; “karena aku” singkat dan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang mencerminkan rekonstruksi pelafalan yang umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan “Ya” serta kapitalisasi pronomina “-Mu” mempertahankan nada doa tanpa menjadi arkais.
source_grounding:
  english_pob_role: consult_only
