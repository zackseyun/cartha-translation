  terminology: “Efod” adalah transliterasi yang tepat dan lazim. Nama “Abyatar” konsisten dengan pemakaian Indonesia. Catatan budaya secara tepat membatasi fungsi efod pada konteks naratif dan tidak memasukkan fungsi itu ke dalam teks utama.
