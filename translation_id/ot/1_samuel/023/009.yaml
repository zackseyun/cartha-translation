  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּ֣י עָלָ֔י/ו שָׁא֖וּל מַחֲרִ֣ישׁ הָ/רָעָ֑ה וַ/יֹּ֨אמֶר֙ אֶל אֶבְיָתָ֣ר הַ/כֹּהֵ֔ן הַגִּ֖ישָׁ/ה הָ/אֵפֽוֹד־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: id
  text: Ketika Daud mengetahui bahwa Saul diam-diam merencanakan kejahatan terhadapnya[a], ia berkata kepada Abyatar, imam itu, “Bawalah efod itu ke sini.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merencanakan malapetaka terhadapnya.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks kisah ini, efod adalah benda keimaman yang berkaitan dengan permohonan petunjuk dari Allah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: mengetahui
  rationale: Dalam alur narasi, bentuk ini menyatakan bahwa pada saat itu Daud memperoleh atau menyadari informasi tersebut; 'mengetahui' alami dan tidak menambahkan cara ia mendapat kabar.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi yang diketahui Daud.
- source_word: עָלָיו
  choice: terhadapnya
  rationale: Dalam konteks niat bermusuhan, preposisi ini paling alami menyatakan sasaran rencana Saul.
- source_word: מַחֲרִישׁ
  choice: diam-diam merencanakan
  rationale: Partisipel Hifil חרש di sini menunjuk pada tindakan merancang atau merencanakan secara tersembunyi dan berkelanjutan.
- source_word: הָרָעָה
  choice: malapetaka
  rationale: Kata ini dapat berarti kejahatan, kemalangan, atau bencana; 'malapetaka' mempertahankan keluasan ancaman yang direncanakan tanpa membatasinya hanya pada cedera fisik.
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: kepada Imam Abyatar
  rationale: Gelar jabatan ditempatkan sebelum nama sesuai ungkapan Indonesia yang alami dan bermartabat.
- source_word: הַגִּישָׁה
  choice: Bawalah ... ke sini
  rationale: Imperatif Hifil נגש berarti membawa mendekat atau menghadirkan; ungkapan ini alami dalam percakapan Indonesia.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Transliterasi yang lazim dipertahankan karena menunjuk pada benda atau pakaian keimaman tertentu dan tidak memiliki padanan Indonesia yang tepat.
theological_decisions:
- issue: Sifat rencana Saul dalam מַחֲרִישׁ הָרָעָה
  choice: Saul diam-diam merencanakan malapetaka terhadap Daud
  alternative: Saul merancang kejahatan terhadap Daud
  rationale: '''Malapetaka'' mempertahankan kemungkinan bahwa רָעָה menunjuk pada bahaya atau bencana yang hendak didatangkan Saul, sedangkan catatan kaki mempertahankan alternatif moral ''kejahatan''.'
- issue: Fungsi efod dalam konteks ini
  choice: Teks utama hanya memerintahkan agar efod dibawa
  alternative: Menjelaskan dalam teks utama bahwa efod dipakai untuk meminta petunjuk Allah
  rationale: Fungsi tersebut tersirat dari konteks narasi, bukan dinyatakan langsung dalam ayat ini, sehingga penjelasannya ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Nama אֶבְיָתָר ditulis 'Abyatar' mengikuti bentuk Indonesia yang lazim; istilah 'efod' dipertahankan sebagai istilah khusus. Semua penanda catatan kaki dicantumkan dalam teks utama.
