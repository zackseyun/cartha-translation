translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur kalimat dibuat alami tanpa menghilangkan perkiraan jumlah, gerak berpindah-pindah, bentuk pasif tanpa pelaku, atau ketidaktersuratan tujuan keberangkatan Saul.
