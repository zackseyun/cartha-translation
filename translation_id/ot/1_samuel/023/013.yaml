base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: id
  text: Lalu Daud bangkit bersama orang-orangnya, yang berjumlah kira-kira enam ratus orang. Mereka keluar dari Kehila dan berpindah-pindah ke mana saja mereka dapat pergi.[a] Lalu Saul diberi tahu bahwa Daud telah meloloskan diri dari Kehila, maka ia tidak lagi keluar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berjalan ke mana pun mereka berjalan.” Ungkapan Ibrani ini menekankan bahwa mereka terus bergerak dari satu tempat ke tempat lain.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidak lagi keluar” kemungkinan berarti Saul tidak lagi keluar untuk mengejar Daud setelah mendengar bahwa Daud telah lolos dari Kehila.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Qal wayyiqtol dari קום berarti ‘bangkit/berdiri’. ‘Bangkit’ mempertahankan gaya naratif dan peralihan menuju tindakan tanpa langsung menafsirkannya sebagai keberangkatan.
- source_word: וַאֲנָשָׁיו
  choice: bersama orang-orangnya
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada kelompok laki-laki yang mengikuti Daud. ‘Orang-orangnya’ alami dalam bahasa Indonesia dan tidak menambahkan istilah militer yang tidak dinyatakan secara eksplisit.
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: yang berjumlah kira-kira enam ratus orang
  rationale: Prefiks כְּ pada bilangan menyatakan perkiraan. Susunan ini memperjelas bahwa jumlah tersebut menerangkan kelompok Daud.
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: Mereka keluar dari Kehila
  rationale: Terjemahan ini mempertahankan gambaran ruang dari יצא sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: berpindah-pindah ke mana saja mereka dapat pergi
  rationale: Bentuk hitpael dan pengulangan akar הלך menggambarkan gerak yang berkelanjutan dari satu tempat ke tempat lain. Pilihan ini menyampaikan keadaan mereka yang terus bergerak tanpa memaksakan arti bahwa mereka mengembara tanpa tujuan.
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: Ketika Saul diberi tahu
  rationale: Hophal dari נגד bersifat pasif, ‘diberi tahu/dilaporkan’. Hubungan temporal dibuat alami dalam bahasa Indonesia tanpa menentukan siapa pelapornya.
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: bahwa Daud telah meloloskan diri dari Kehila
  rationale: Niphal נמלט menyatakan berhasil lolos atau menyelamatkan diri. ‘Meloloskan diri’ sesuai dengan konteks pengejaran.
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: ia pun tidak jadi berangkat
  rationale: חדל dengan infinitif berarti berhenti atau tidak meneruskan suatu tindakan. Dalam bahasa Indonesia, pilihan ini wajar untuk keberangkatan yang dibatalkan, sementara tujuan keberangkatan yang tersirat dijelaskan dalam catatan.
