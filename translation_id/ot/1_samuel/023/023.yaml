base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: id
  text: Jadi, periksalah dan cari tahulah semua tempat persembunyian tempat ia bersembunyi. Kemudian kembalilah kepadaku dengan kabar yang pasti, dan aku akan pergi bersama kalian. Jika ia berada di negeri itu, aku akan mencarinya di antara semua kaum Yehuda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara semua ribuan Yehuda”; istilah Ibrani ini mungkin menunjuk pada kaum-kaum atau kelompok-kelompok keluarga di Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: lihatlah dan cari tahulah
  rationale: Dua bentuk perintah jamak dipertahankan. Dalam konteks penyelidikan, דעוּ berarti memastikan atau memperoleh informasi, sehingga 'cari tahulah' lebih alami daripada sekadar 'ketahuilah'.
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: semua tempat persembunyian yang menjadi tempat ia menyembunyikan diri
  rationale: מַחֲבֹא diterjemahkan 'tempat persembunyian'; bentuk refleksif יִתְחַבֵּא diwakili oleh 'menyembunyikan diri'. Ungkapan relatif dan שָׁם dipertahankan secara alami melalui 'yang menjadi tempat' tanpa meniru redundansi Ibrani secara kaku.
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: Kemudian kembalilah kepadaku dengan kepastian
  rationale: Rangkaian tindakan dinyatakan dengan 'kemudian'. נָכוֹן menyampaikan informasi yang sudah pasti atau terkonfirmasi; 'dengan kepastian' mempertahankan ungkapan sumber tanpa menambah objek yang tidak tersurat.
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: dan aku akan pergi bersama kalian
  rationale: Terjemahan langsung dan alami; 'kalian' menandai bentuk jamak dari pronomina Ibrani.
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: Jika ia berada di negeri ini
  rationale: Rumus וְהָיָה אִם dinyatakan sebagai syarat alami dalam bahasa Indonesia. 'Negeri ini' menunjukkan wilayah yang sedang dibicarakan tanpa mengharuskan pembaca menafsirkan seluruh bumi.
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: aku akan mencarinya
  rationale: חפשׂ menyatakan pencarian yang saksama. 'Mencarinya' alami dalam bahasa Indonesia, sementara konteks sudah menyampaikan intensitas pengejaran.
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: di antara semua kaum Yehuda
  rationale: אַלְפֵי secara harfiah berarti 'ribuan', tetapi di sini kemungkinan menunjuk pada kelompok kekerabatan atau pembagian sosial. 'Kaum' cukup luas untuk menjaga ketidakpastian mengenai jenis unitnya.
