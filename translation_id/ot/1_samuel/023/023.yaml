revisions:
- from: Jadi, lihatlah dan cari tahulah semua tempat persembunyian yang menjadi tempat ia menyembunyikan diri. Kemudian kembalilah kepadaku dengan kepastian, dan aku akan pergi bersama kalian. Jika ia berada di negeri ini, aku akan mencarinya di antara semua kaum Yehuda.[a]
  to: Jadi, periksalah dan cari tahulah semua tempat persembunyian tempat ia bersembunyi. Kemudian kembalilah kepadaku dengan kabar yang pasti, dan aku akan pergi bersama kalian. Jika ia berada di negeri itu, aku akan mencarinya di antara semua kaum Yehuda.[a]
  rationale: Revisi mengganti konstruksi yang tidak alami dengan "tempat persembunyian tempat ia bersembunyi," yang mempertahankan gagasan tempat dan tindakan refleksif tanpa parafrasa berlebihan. "Dengan kabar yang pasti" menyatakan bahwa mereka harus kembali membawa intelijen yang terkonfirmasi. "Negeri itu" menghindari penambahan deiksis yang tidak dinyatakan dalam sumber.
