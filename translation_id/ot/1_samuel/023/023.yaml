  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk perintah jamak dibuat jelas melalui 'kalian' pada klausa berikutnya; susunan diperlancar tanpa menghilangkan urutan penyelidikan, pelaporan, dan pencarian.
