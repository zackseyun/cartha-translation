  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: id
  text: Tetapi orang-orang Daud berkata kepadanya, “Lihat, kami takut di sini di Yehuda; apalagi[a] jika kami pergi ke Kehila menghadapi barisan tempur orang Filistin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terlebih lagi jika.” Ungkapan Ibrani ini menyatakan argumen dari keadaan yang lebih ringan kepada yang lebih berat.
