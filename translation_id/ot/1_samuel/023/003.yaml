lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Tetapi ... berkata
  rationale: Waw konsekutif melanjutkan narasi, sementara “Tetapi” secara wajar menandai keberatan anak buah Daud terhadap tindakan yang diperintahkan sebelumnya.
- source_word: אַנְשֵׁי דָוִד
  choice: anak buah Daud
  rationale: Ungkapan ini alami dalam bahasa Indonesia untuk para pengikut atau pasukan di bawah pimpinan Daud, tanpa menyiratkan bahwa yang dimaksud semua laki-laki miliknya secara umum.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan daya penunjuk dan penegasan dalam seruan mereka dengan bentuk modern dan langsung.
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: di sini, di Yehuda saja kami takut
  rationale: Susunan Indonesia ini mempertahankan lokasi dan rasa takut sekaligus menyiapkan secara alami argumen dari keadaan yang lebih ringan menuju keadaan yang lebih berat.
- source_word: וְאַף כִּי
  choice: Terlebih lagi jika
  rationale: Idiom Ibrani ini menyatakan peningkatan dari yang lebih kecil kepada yang lebih besar; padanan ini jelas dan alami dalam bahasa Indonesia.
- source_word: נֵלֵךְ קְעִלָה
  choice: kami pergi ke Kehila
  rationale: Kata kerja gerak dengan nama tempat menunjukkan tujuan perjalanan.
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: menghadapi barisan tempur orang Filistin
  rationale: מַעַרְכוֹת menunjuk pada barisan atau susunan pasukan untuk bertempur; “menghadapi” menyampaikan konfrontasi yang tersirat oleh konteks.
