  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: id
  text: Daud melihat bahwa Saul telah keluar untuk mencari nyawanya, sementara Daud berada di padang belantara Zif, di Hores[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hutan” atau “di kawasan berhutan.” Kata Ibrani ini dapat dipahami sebagai kata benda umum, tetapi di sini kemungkinan besar merupakan nama tempat, Hores.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: mengetahui
  rationale: Kata ראה secara harfiah berarti ‘melihat’, tetapi dalam konteks ini menyatakan persepsi atau kesadaran Daud akan tindakan Saul. ‘Mengetahui’ lebih alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang diketahui Daud, sehingga ‘bahwa’ mencerminkan fungsi sintaksisnya.
- source_word: יָצָא
  choice: telah keluar
  rationale: יצא berarti ‘keluar’ atau ‘pergi keluar’. Bentuk ‘telah keluar’ menunjukkan bahwa Saul sudah bergerak untuk mengejar Daud ketika Daud mengetahuinya.
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: untuk memburu nyawanya
  rationale: Ungkapan ini secara harfiah berarti ‘mencari nyawanya’ dan dalam konteks menyiratkan pengejaran yang mengancam jiwa. ‘Memburu nyawanya’ mempertahankan gambaran nyawa sebagai sasaran tanpa langsung mempersempitnya menjadi ‘membunuhnya’.
- source_word: בְּמִדְבַּר זִיף
  choice: di padang belantara Zif
  rationale: מִדְבָּר menunjuk daerah liar, gersang, atau padang penggembalaan yang tidak berpenghuni; ‘padang belantara’ lebih luas dan tepat daripada ‘gurun’.
- source_word: בַּחֹרְשָׁה
  choice: di Hores[a]
  rationale: Bentuk ini dapat dipahami sebagai kata benda umum yang berarti kawasan berhutan, tetapi dalam konteks ini kemungkinan besar berfungsi sebagai nama tempat. Transliterasi ‘Hores’ mempertahankan pembacaan toponim sekaligus mencatat alternatif leksikal.
- source_word: וְדָוִד
  choice: sementara Daud berada
  rationale: Kata penghubung וְ membuka klausa keadaan yang menerangkan lokasi Daud. ‘Sementara Daud berada’ menyatakan hubungan tersebut secara alami.
