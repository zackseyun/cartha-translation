base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: id
  text: Keduanya mengikat perjanjian di hadapan Yahweh.[a] Setelah itu, Daud tetap tinggal di daerah berhutan itu,[b] sedangkan Yonatan pulang ke rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “memotong perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di Hores.” Kata Ibrani ini dapat dipahami sebagai nama tempat atau sebagai “daerah berhutan/belukar.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘memotong perjanjian’. Dalam bahasa Indonesia, ‘mengikat perjanjian’ menyampaikan tindakan membuat perjanjian secara alami sekaligus mempertahankan nuansa ikatan yang khidmat.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Bentuk ini secara ringkas dan jelas menyatakan bahwa Daud dan Yonatan bersama-sama melakukan tindakan tersebut.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan gagasan bahwa perjanjian itu dibuat dalam kehadiran ilahi serta menerjemahkan nama perjanjian יְהוָה sebagai ‘Yahweh’.
- source_word: וַיֵּשֶׁב
  choice: tetap tinggal
  rationale: Dalam konteks ini, verba tersebut menunjuk pada keberadaan yang berlanjut di suatu tempat, bukan tindakan duduk secara harfiah.
- source_word: בַּחֹרְשָׁה
  choice: di daerah berhutan itu
  rationale: Bentuk Ibrani dapat dipahami sebagai nomina umum yang berarti kawasan berhutan atau belukar. Ambiguitas bahwa kata itu mungkin nama tempat dipertahankan dalam catatan kaki.
- source_word: הָלַךְ לְבֵיתוֹ
  choice: pulang ke rumahnya
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk ‘pergi ke rumahnya’ dan sesuai dengan arah tindakan dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama ilahi tersebut tanpa menggantinya dengan gelar.
- issue: Sifat perjanjian Daud dan Yonatan
  choice: mengikat perjanjian
  alternative: membuat kesepakatan; mengadakan perjanjian
  rationale: ‘Perjanjian’ mempertahankan bobot relasional dan khidmat dari בְּרִית tanpa mempersempitnya menjadi kesepakatan biasa atau perjanjian politik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. Nama Yonatan mengikuti bentuk Indonesia yang lazim. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
