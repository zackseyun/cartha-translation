  text: David again inquired of the LORD, and the LORD answered him and said, “Rise, go down to Keilah, for I am giving the Philistines into your hand.”
translation:
  language: id
  text: Daud kembali bertanya kepada TUHAN, lalu TUHAN menjawabnya dan berfirman, “Bangkitlah, turunlah ke Kehila, sebab Aku akan menyerahkan orang Filistin ke dalam tanganmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: kembali meminta petunjuk
  rationale: Ungkapan Ibrani ini secara harfiah menyatakan bahwa Daud menambahkan lagi tindakan bertanya; dalam konteks meminta jawaban ilahi, 'kembali meminta petunjuk' terdengar alami dan tepat.
- source_word: ק֚וּם
  choice: Bersiaplah
  rationale: Imperatif harfiah 'bangkitlah' kerap berfungsi idiomatis sebagai perintah untuk segera bertindak; 'bersiaplah' wajar sebelum perintah gerak berikutnya.
- source_word: רֵד
  choice: turunlah
  rationale: Mempertahankan arah geografis yang dinyatakan secara eksplisit dalam teks sumber.
- source_word: נֹתֵן
  choice: akan menyerahkan
  rationale: Partisip Ibrani menggambarkan tindakan ilahi yang pasti atau segera; bentuk Indonesia ini menyampaikan janji kemenangan secara alami tanpa mengubah pelakunya.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan metafora Ibrani tentang penyerahan musuh ke dalam kuasa Daud.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan untuk Tetragramaton tanpa menambahkan catatan yang tidak diperlukan dalam ayat ini.
- issue: Aspek נֹתֵן dalam janji ilahi
  choice: Aku akan menyerahkan
  alternative: Aku sedang menyerahkan
  rationale: Dalam konteks perintah untuk pergi berperang, partisip ini menyatakan tindakan yang dijanjikan dengan kepastian; bentuk masa depan paling alami dalam bahasa Indonesia dan tidak menambah syarat teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dialog dipertahankan ringkas; idiom yang berpotensi kaku dibuat alami, sedangkan metafora penting 'ke dalam tanganmu' tetap dipertahankan.
