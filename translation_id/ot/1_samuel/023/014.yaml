id: 1SA.23.14
reference: 1 Samuel 23:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: id
  text: Daud tinggal di padang belantara, di kubu-kubu pertahanan; ia tinggal di daerah perbukitan di padang belantara Zif. Saul mencarinya sepanjang waktu, tetapi Allah tidak menyerahkannya ke dalam tangan Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "Allah tidak menyerahkan Daud kepada Saul." Harfiah: "tidak memberikannya ke dalam tangannya."'
    reason: Menjelaskan idiom Ibrani "memberikan ke dalam tangan" dan memperjelas bahwa "tangannya" merujuk kepada Saul tanpa memasukkan penafsiran tambahan.
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal / menetap
  rationale: ישׁב dalam konteks ini menunjukkan keberadaan yang berlanjut. Variasi alami dalam bahasa Indonesia menghindari pengulangan kaku tanpa mengubah makna.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk wilayah liar dan tidak dibudidayakan, bukan selalu gurun pasir; 'padang belantara' wajar dan tepat dalam bahasa Indonesia.
- source_word: בַּמְּצָדוֹת
  choice: di tempat-tempat perlindungan
  rationale: Bentuk jamak מְצָדוֹת menunjuk lokasi-lokasi yang terlindung dan dapat dipertahankan. Pilihan ini mudah dipahami, sementara alternatif 'kubu-kubu' lebih menekankan bangunan pertahanan.
- source_word: בָּהָר
  choice: di daerah perbukitan
  rationale: הַר dapat menunjuk gunung atau kawasan berbukit. Dalam konteks geografis Zif, 'daerah perbukitan' tidak menyiratkan satu puncak tertentu.
- source_word: בְּמִדְבַּר זִיף
  choice: di Padang Belantara Zif
  rationale: Frasa konstruksi ini menamai kawasan belantara yang terkait dengan Zif; kapitalisasi menandai nama geografis.
- source_word: וַיְבַקְשֵׁהוּ
  choice: terus mencari dia
  rationale: בקשׁ berarti mencari atau berusaha menemukan. 'Terus' bersama frasa duratif berikutnya menyampaikan pengejaran yang berkelanjutan secara alami.
- source_word: כָּל הַיָּמִים
  choice: terus
  rationale: Secara harfiah 'sepanjang hari-hari'; dalam konteks ini idiom tersebut menyatakan tindakan berulang atau terus-menerus, bukan harus setiap hari tanpa kecuali.
- source_word: וְלֹא נְתָנוֹ
  choice: tetapi ... tidak menyerahkannya
  rationale: נתן dengan frasa 'ke dalam tangan' merupakan idiom penyerahan kepada kuasa orang lain. 'Menyerahkan' menyampaikan makna idiomatis tanpa menghilangkan citra tangan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Di sini אֱלֹהִים merujuk kepada Allah Israel dan berfungsi dengan makna tunggal.
- source_word: בְּיָדוֹ
  choice: ke dalam tangan Saul
  rationale: Ungkapan Ibrani berarti berada di bawah kuasa seseorang. Nama Saul dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
theological_decisions:
- issue: Peran Allah dalam terpeliharanya Daud
  choice: Allah tidak menyerahkan Daud ke dalam tangan Saul
  alternative: Allah tidak membiarkan Saul menangkap Daud
  rationale: Teks secara langsung mengaitkan lolosnya Daud dengan tindakan Allah. Terjemahan mempertahankan atribusi itu serta idiom 'ke dalam tangan', tanpa memperluas cara kerja pemeliharaan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Padang belantara' dipilih untuk wilayah liar nonpertanian; 'tempat-tempat perlindungan' mengutamakan kejelasan bagi pembaca umum. Penanda catatan kaki [a] dicantumkan dalam teks utama.
