revisions:
- from: Daud tinggal di tempat-tempat perlindungan di padang belantara dan menetap di daerah perbukitan di Padang Belantara Zif. Saul terus mencari dia, tetapi Allah tidak menyerahkannya ke dalam tangan Saul.[a]
  to: Daud tinggal di padang belantara, di kubu-kubu pertahanan; ia tinggal di daerah perbukitan di padang belantara Zif. Saul mencarinya sepanjang waktu, tetapi Allah tidak menyerahkannya ke dalam tangan Saul.[a]
  rationale: Revisi mengganti istilah yang terlalu luas dengan istilah defensif untuk מְצָדוֹת, mempertahankan pengulangan verba sumber, dan menyesuaikan kapitalisasi geografis. Catatan kaki tetap berjangkar pada klausa akhir serta menyajikan alternatif idiomatis dan bentuk harfiahnya.
