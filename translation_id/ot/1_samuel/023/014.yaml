  naturalness: Bahasa drafnya modern dan jelas. Pengulangan verba yang berbeda untuk dua bentuk וַיֵּשֶׁב tidak salah, tetapi mempertahankan "tinggal" pada kedua kemunculan lebih dekat dengan pengulangan naratif Ibrani. "Sepanjang waktu" menyampaikan כָּל־הַיָּמִים dengan alami tanpa menjadikannya semata-mata kata keterangan tambahan.
  terminology: '"Allah", "padang belantara", "daerah perbukitan", dan "tangan Saul" sesuai register dan makna. "Kubu-kubu pertahanan" lebih tepat daripada "tempat-tempat perlindungan" karena mempertahankan nuansa defensif מְצָדוֹת. Nama "Zif" dipertahankan; "padang belantara Zif" tidak perlu dikapitalisasi sebagai seluruh nama diri.'
