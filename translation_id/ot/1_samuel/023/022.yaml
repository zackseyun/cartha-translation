base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: id
  text: “Pergilah, lakukanlah persiapan lebih lanjut. Cari tahu dan lihatlah tempatnya, tempat kakinya berada[a], dan siapa yang telah melihatnya di sana. Sebab aku diberi tahu[b], ‘Ia bertindak sangat licik.’[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat kakinya berada,” suatu ungkapan yang menunjuk pada keberadaan atau pergerakannya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab ia berkata kepadaku”; teks Ibrani tidak menyebutkan secara eksplisit siapa subjek kata “berkata.”
    reason: alternative_reading
  - marker: c
    text: Bahasa Ibrani memakai dua kata serumpun untuk penekanan, secara harfiah kira-kira, “dengan licik ia bertindak licik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ נָא
  choice: Pergilah
  rationale: Bentuk imperatif jamak diterjemahkan langsung. Partikel נָא memperhalus atau mendesakkan permintaan, tetapi tidak perlu dinyatakan tersendiri karena konteks perintah sudah jelas.
- source_word: הָכִינוּ עוֹד
  choice: lakukanlah persiapan lebih lanjut
  rationale: Bentuk Hifil dari כון menyatakan tindakan mempersiapkan atau membuat siap; עוֹד menambahkan gagasan kelanjutan atau penambahan.
- source_word: וּדְעוּ וּרְאוּ
  choice: Cari tahu dan lihatlah
  rationale: Kedua kata kerja dipertahankan untuk menyampaikan desakan kumulatif agar mereka menyelidiki dan mengamati dengan saksama.
- source_word: מְקוֹמוֹ
  choice: tempatnya
  rationale: Akhiran pronominal orang ketiga tunggal dipertahankan secara eksplisit, bukan dihilangkan menjadi sekadar ‘tempat’.
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: di mana kakinya berada
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani, sementara catatan kaki menjelaskan bahwa ungkapan tersebut menunjuk pada keberadaan atau pergerakannya.
- source_word: מִי רָאָהוּ שָׁם
  choice: siapa yang telah melihatnya di sana
  rationale: Klausa ini meminta identitas saksi atau informan yang benar-benar melihat Daud di tempat itu.
- source_word: כִּי אָמַר אֵלַי
  choice: Sebab aku diberi tahu
  rationale: Bahasa Ibrani memakai verba orang ketiga tunggal tanpa menyebut subjeknya. Bentuk pasif alami dalam bahasa Indonesia menghindari penentuan identitas penutur yang tidak dinyatakan teks.
- source_word: עָרוֹם יַעְרִם הוּא
  choice: Ia bertindak sangat licik
  rationale: Konstruksi serumpun antara עָרוֹם dan יַעְרִם memberi penekanan. ‘Sangat licik’ menyampaikan intensitas serta penilaian Saul yang bernada negatif.
theological_decisions:
- issue: Subjek yang tidak disebutkan dalam כִּי אָמַר אֵלַי
  choice: aku diberi tahu
  alternative: ia berkata kepadaku
  rationale: Terjemahan utama tidak menetapkan apakah subjek tersirat itu Daud atau orang lain. Alternatif harfiah dicantumkan dalam catatan agar ketidakjelasan bahasa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah dibuat cukup alami untuk dibaca, tetapi pengulangan verba dan gambaran ‘kakinya berada’ dipertahankan agar ciri bahasa sumber tidak hilang.
