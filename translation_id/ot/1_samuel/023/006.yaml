  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: id
  text: Ketika Abyatar anak Ahimelekh melarikan diri kepada Daud di Kehila, ia turun dengan sebuah efod di tangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah efod turun di tangannya.” Teks Ibrani memungkinkan pembacaan ini karena “efod” mendahului kata kerja “turun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika ...
  rationale: Bentuk naratif ini mengantar keadaan waktu bagi peristiwa utama. Dalam bahasa Indonesia modern, hubungan tersebut tersampaikan secara alami melalui klausa “Ketika ...” tanpa menambahkan kata waktu yang tidak dinyatakan secara eksplisit.
- source_word: בִּבְרֹחַ
  choice: ketika ... melarikan diri
  rationale: Preposisi ב dengan infinitif konstruktus menyatakan keadaan temporal; “ketika ... melarikan diri” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Bentuk nama yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: anak Ahimelekh
  rationale: Menerjemahkan konstruksi patronimik secara langsung dan wajar dalam bahasa Indonesia.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: אֶל menandai gerak menuju Daud; “kepada Daud” mempertahankan arah tersebut.
- source_word: קְעִילָה
  choice: di Kehila
  rationale: 'Nama tempat ini paling alami dipahami sebagai lokasi Daud: Abyatar melarikan diri kepada Daud yang berada di Kehila. Pembacaan ini menghindari rangkaian tujuan yang janggal dalam bahasa Indonesia.'
- source_word: אֵפוֹד
  choice: sebuah efod
  rationale: Istilah benda kultis ini dipertahankan sebagai transliterasi karena tidak ada padanan Indonesia sederhana yang mencakup kekhususan historis dan keimaman benda tersebut.
- source_word: יָרַד
  choice: ia turun
  rationale: Kata kerja ירד berarti turun. Subjek tersirat dipahami sebagai Abyatar, tetapi kemungkinan bahwa “efod” menjadi subjek dicatat dalam catatan kaki karena urutan kata Ibrani memungkinkan pembacaan itu.
- source_word: בְּיָדוֹ
  choice: sambil membawa ... di tangannya
  rationale: Ungkapan ini secara harfiah berarti “di tangannya.” Penambahan “sambil membawa” menghasilkan bahasa Indonesia yang alami sambil mempertahankan gambaran konkret benda itu berada di tangan Abyatar.
theological_decisions:
- issue: Hakikat אֵפוֹד dalam konteks ini
  choice: Mempertahankan istilah “efod” tanpa menjelaskan bendanya lebih jauh
  alternative: pakaian imam; rompi suci
  rationale: Konteks yang lebih luas memberi efod arti keimaman dan fungsi untuk meminta petunjuk, tetapi ayat ini sendiri hanya menyebut bendanya. Transliterasi menghindari penafsiran teologis yang lebih sempit daripada teks sumber.
- issue: Subjek kata kerja יָרַד
  choice: 'Abyatar sebagai subjek: “ia turun”'
  alternative: 'Efod sebagai subjek: “sebuah efod turun di tangannya”'
  rationale: Subjek manusia yang sama menghasilkan alur naratif paling alami, tetapi urutan kata Ibrani menempatkan “efod” sebelum kata kerja dan secara gramatikal memungkinkan pembacaan alternatif. Ketegangan tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. Nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia. Istilah teknis “efod” dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
