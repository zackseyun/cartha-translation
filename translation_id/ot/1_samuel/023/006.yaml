    rationale: Alternatif bukan semata-mata akibat urutan kata, melainkan pembacaan sintaktis yang mungkin karena ‘efod’ mendahului kata kerja tunggal maskulin ‘turun’. Formulasi yang direvisi mempertahankan ambiguitas tanpa mengklaim kepastian.
