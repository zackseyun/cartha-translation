  naturalness: Bahasa Indonesia sudah baku dan mudah dipahami. ‘Ia turun dengan sebuah efod di tangannya’ lebih ringkas dan lebih dekat dengan konstruksi sumber daripada ‘ia turun sambil membawa sebuah efod di tangannya’, tanpa menghilangkan makna bahwa efod itu dibawa.
  terminology: Nama Abyatar, Ahimelekh, Daud, dan Kehila konsisten dengan bentuk Alkitab Indonesia yang lazim. ‘Efod’ tepat dipertahankan sebagai istilah teknis tanpa penafsiran tambahan.
