source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יְהוֹנָתָ֣ן בֶּן שָׁא֔וּל וַ/יֵּ֥לֶךְ אֶל דָּוִ֖ד חֹ֑רְשָׁה וַ/יְחַזֵּ֥ק אֶת יָד֖/וֹ בֵּ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: id
  text: Kemudian Yonatan anak Saul bangkit dan pergi menemui Daud di Hores. Ia menguatkan tangan Daud dalam Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menguatkan tangannya dalam Allah”; maksudnya dapat juga diungkapkan, “memberinya keberanian dalam Allah.”
    reason: Menjelaskan ungkapan Ibrani yang dipertahankan dalam teks utama dan memberikan padanan idiomatis tanpa menghapus citra aslinya.
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Kata קום dalam rangkaian narasi menandai dimulainya tindakan yang disengaja. “Bangkit” mempertahankan urutan dan corak teks Ibrani.
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: Yonatan anak Saul
  rationale: Konstruksi hubungan ayah-anak diterjemahkan langsung sehingga hubungan keluarga sekaligus ketegangan politis dalam konteks tetap terlihat.
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: pergi menemui Daud
  rationale: הלך אל menunjukkan gerak menuju seseorang dan dalam konteks menyiratkan pertemuan; “pergi menemui” lebih alami dalam bahasa Indonesia daripada “pergi kepada”.
- source_word: חֹרְשָׁה
  choice: di Hores
  rationale: Bentuk ini paling mungkin menunjuk nama tempat Hores dengan akhiran lokatif, bukan sekadar kata umum untuk hutan atau daerah berhutan.
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: menguatkan tangan Daud
  rationale: Terjemahan ini mempertahankan citra ungkapan Ibrani “menguatkan tangannya”. Nama Daud dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna; arti idiomatis dijelaskan dalam catatan kaki.
- source_word: בֵּאלֹהִים
  choice: dalam Allah
  rationale: Preposisi ב dipertahankan sebagai “dalam”, yang menyatakan lingkungan atau dasar penguatan tersebut tanpa mempersempitnya menjadi “oleh” atau “melalui” Allah.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים dalam konteks ini
  choice: Allah
  alternative: TUHAN
  rationale: Teks Ibrani memakai אֱלֹהִים, bukan nama ilahi יהוה. Karena itu “Allah” mempertahankan istilah sumber dan tidak menyelaraskannya secara tidak berdasar dengan nama perjanjian “TUHAN”.
- issue: Hubungan penguatan Yonatan dengan Allah dalam frasa בֵּאלֹהִים
  choice: dalam Allah
  alternative: oleh Allah / melalui Allah
  rationale: '“Dalam Allah” mempertahankan keluasan relasi yang dinyatakan oleh preposisi ב: Allah dapat dipahami sebagai dasar atau lingkungan penguatan itu. Pilihan yang lebih instrumental akan menyelesaikan ketegangan tersebut secara lebih sempit daripada teks sumber.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat alami dengan membagi rangkaian klausa menjadi dua kalimat. Ungkapan “menguatkan tangan” sengaja dipertahankan karena penting sebagai citra sumber, sedangkan makna idiomatisnya diterangkan dalam catatan kaki.
