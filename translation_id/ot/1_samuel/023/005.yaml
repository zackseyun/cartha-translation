  text: וַ/יֵּ֣לֶךְ דָּוִד֩ ו/אנש/ו קְעִילָ֜ה וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יִּנְהַג֙ אֶת מִקְנֵי/הֶ֔ם וַ/יַּ֥ךְ בָּ/הֶ֖ם מַכָּ֣ה גְדוֹלָ֑ה וַ/יֹּ֣שַׁע דָּוִ֔ד אֵ֖ת יֹשְׁבֵ֥י קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: id
  text: Lalu Daud bersama orang-orangnya pergi ke Kehila dan berperang melawan orang Filistin. Ia menggiring pergi ternak mereka[a] dan mengalahkan mereka dengan telak[b]. Demikianlah Daud menyelamatkan[c] penduduk Kehila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membawa pergi ternak mereka.” Istilah Ibrani yang digunakan mencakup berbagai jenis hewan ternak, bukan hanya sapi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menghantam mereka dengan pukulan besar”; dapat juga diterjemahkan “menimpakan kekalahan besar kepada mereka.”
    reason: lexical_alternative
  - marker: c
    text: Atau “membebaskan” atau “melepaskan dari bahaya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשׁוֹ
  choice: Daud bersama orang-orangnya pergi
  rationale: Bentuk naratif וַיֵּלֶךְ menyatakan gerak menuju Kehila, sedangkan אֲנָשָׁיו dalam konteks militer menunjuk kepada kelompok pengikut Daud. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan Daud sebagai pelaku utama.
- source_word: קְעִילָה
  choice: Kehila
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: berperang melawan orang Filistin
  rationale: Kata kerja לחם dengan preposisi ב dalam konteks ini menyatakan pertempuran melawan pihak lawan. 'Berperang melawan' jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: menggiring pergi ternak mereka
  rationale: נהג dapat berarti menggiring atau membawa pergi hewan, dan מִקְנֶה merupakan istilah kolektif luas untuk ternak. Pilihan ini mempertahankan gambaran konkret tindakan tersebut tanpa membatasinya pada sapi.
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: mengalahkan mereka dengan telak
  rationale: Ungkapan idiomatis Ibrani secara harfiah berbicara tentang menghantam mereka dengan pukulan besar, tetapi dalam konteks pertempuran menyatakan kekalahan berat. 'Mengalahkan mereka dengan telak' menyampaikan daya ungkapan itu secara alami tanpa memastikan bahwa semuanya dibantai.
- source_word: וַיֹּשַׁע
  choice: menyelamatkan
  rationale: ישע dalam konteks militer berarti menyelamatkan atau membebaskan dari bahaya. 'Menyelamatkan' merupakan padanan langsung, jelas, dan tidak menambahkan penafsiran teologis.
- source_word: יֹשְׁבֵי קְעִילָה
  choice: penduduk Kehila
  rationale: Secara harfiah berarti orang-orang yang tinggal di Kehila. 'Penduduk Kehila' ringkas dan alami dalam bahasa Indonesia modern.
