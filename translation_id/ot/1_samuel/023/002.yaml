  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֨ל דָּוִ֤ד בַּֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אֵלֵ֣ךְ וְ/הִכֵּ֔יתִי בַּ/פְּלִשְׁתִּ֖ים הָ/אֵ֑לֶּה וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל דָּוִ֗ד לֵ֚ךְ וְ/הִכִּ֣יתָ בַ/פְּלִשְׁתִּ֔ים וְ/הוֹשַׁעְתָּ֖ אֶת קְעִילָֽהס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: id
  text: Lalu Daud meminta petunjuk kepada Yahweh, katanya, “Haruskah aku pergi dan menyerang orang-orang Filistin ini?” Yahweh berfirman kepada Daud, “Pergilah, seranglah orang-orang Filistin itu, dan selamatkanlah Kehila[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bebaskanlah Kehila.”
    reason: Alternatif ini memperjelas nuansa penyelamatan dari ancaman atau penindasan militer dalam וְהוֹשַׁעְתָּ.
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konstruksi ini, שׁאל dengan בַּיהוָה menunjuk pada tindakan mencari petunjuk ilahi, bukan sekadar mengajukan pertanyaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna konsultatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dan lapisan konsultasi yang diberikan.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan isi pertanyaan Daud secara ringkas dan alami dalam bahasa Indonesia.
- source_word: הַאֵלֵךְ
  choice: Haruskah aku pergi
  rationale: Bentuk tanya dengan imperfek menyatakan pertimbangan tentang tindakan yang perlu dilakukan. 'Haruskah' menyampaikan nuansa meminta arahan.
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: menyerang / seranglah
  rationale: Dalam konteks pertempuran, נכה berarti memukul atau menyerang. 'Menyerang' alami dan tidak terlebih dahulu memastikan hasil berupa kemenangan; pengulangan kata kerja dalam pertanyaan dan jawaban juga dipertahankan.
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: orang-orang Filistin ini
  rationale: Demonstrativa הָאֵלֶּה dipertahankan untuk menunjuk kelompok Filistin tertentu yang sedang mengancam Kehila.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif langsung diterjemahkan dengan bentuk perintah yang jelas dan wajar.
- source_word: וְהוֹשַׁעְתָּ
  choice: selamatkanlah
  rationale: Kata kerja dari akar ישׁע berarti menyelamatkan atau membebaskan dari bahaya. Dalam konteks ini, maknanya adalah penyelamatan kota secara militer.
- source_word: קְעִילָה
  choice: Kehila
  rationale: Nama tempat ditransliterasikan ke dalam ejaan yang mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut nama perjanjian ilahi secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna keselamatan dalam וְהוֹשַׁעְתָּ
  choice: selamatkanlah
  alternative: bebaskanlah
  rationale: Kata 'selamatkanlah' mempertahankan keluasan makna akar ישׁע, sedangkan konteks menjelaskan bahwa yang dimaksud ialah pembebasan Kehila dari ancaman militer, bukan pernyataan khusus tentang keselamatan rohani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Bentuk dialog dibuat langsung dan mudah dipahami; pengulangan antara pertanyaan Daud dan jawaban Yahweh dipertahankan sejauh wajar. Penanda catatan kaki [a] ditempatkan pada frasa yang benar-benar dijelaskan oleh catatan.
