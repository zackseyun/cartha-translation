  text: וַ/יֵּ֨לֶךְ שָׁא֜וּל מִ/צַּ֤ד הָ/הָר֙ מִ/זֶּ֔ה וְ/דָוִ֧ד וַ/אֲנָשָׁ֛י/ו מִ/צַּ֥ד הָ/הָ֖ר מִ/זֶּ֑ה וַ/יְהִ֨י דָוִ֜ד נֶחְפָּ֤ז לָ/לֶ֨כֶת֙ מִ/פְּנֵ֣י שָׁא֔וּל וְ/שָׁא֣וּל וַ/אֲנָשָׁ֗י/ו עֹֽטְרִ֛ים אֶל דָּוִ֥ד וְ/אֶל אֲנָשָׁ֖י/ו לְ/תָפְשָֽׂ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: id
  text: Saul berjalan di satu sisi gunung itu,[a] sedangkan Daud dan orang-orangnya berada di sisi lain gunung itu. Daud bergegas menjauh dari Saul, sementara Saul dan orang-orangnya mengepung Daud dan orang-orangnya untuk menangkap mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “Saul berjalan di sisi gunung dari sisi ini, sedangkan Daud dan orang-orangnya di sisi gunung dari sisi ini.” Terjemahan ini menyatakan kontras yang dimaksud dengan “satu sisi” dan “sisi lain”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melingkari Daud dan orang-orangnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: berjalan
  rationale: Bentuk wayyiqtol dari הלך melanjutkan narasi, tetapi dalam konteks ini gerakan Saul berlangsung bersamaan dengan gerakan Daud; 'berjalan' menyampaikan gerakan tanpa menjadikannya tindakan sesaat.
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: di satu sisi gunung itu ... di sisi lain gunung itu
  rationale: Secara harfiah kedua frasa memakai ungkapan deiktis 'dari sisi ini'. Dalam bahasa Indonesia, kontras tempat yang dimaksud lebih jelas dan wajar dinyatakan sebagai 'satu sisi' dan 'sisi lain'.
- source_word: נֶחְפָּז
  choice: bergegas
  rationale: Partisipel Nifal ini menunjukkan tindakan yang dilakukan dengan tergesa-gesa atau mendesak, tanpa harus menafsirkan keadaan batin Daud sebagai panik.
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: menjauh dari Saul
  rationale: Ungkapan ini secara harfiah berarti 'pergi dari hadapan Saul'. 'Menjauh dari Saul' alami dalam bahasa Indonesia dan mempertahankan gagasan gerak menjauh tanpa memperkuatnya menjadi 'melarikan diri'.
- source_word: עֹטְרִים
  choice: semakin mengepung
  rationale: Partisipel dari עטר menggambarkan pasukan Saul yang bergerak mengitari atau menutup ruang di sekitar Daud. 'Semakin mengepung' menyampaikan proses mereka mendekat untuk menjebaknya; 'mengepung' tetap mungkin sebagai terjemahan lebih langsung.
- source_word: לְתָפְשָׂם
  choice: untuk menangkap mereka
  rationale: Infinitif dengan akhiran pronominal menyatakan tujuan. 'Menangkap mereka' paling sesuai dengan konteks pengejaran militer.
