translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur simultan dipertahankan melalui 'sedangkan' dan 'sementara'. Pengulangan 'Daud dan orang-orangnya' dipertahankan agar rujukan tetap jelas dan dekat dengan susunan sumber.
