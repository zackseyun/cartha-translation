  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: id
  text: Lalu Daud bertanya, “Apakah penduduk Kehila akan menyerahkan[a] aku dan orang-orangku ke dalam tangan Saul[b]?” Yahweh menjawab, “Mereka akan menyerahkan engkau[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkan kepada musuh” atau “menyerahkan ke dalam kekuasaan orang lain.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam tangan Saul,” yaitu ke dalam kuasa atau kendali Saul.
    reason: idiom_explanation
  - marker: c
    text: Teks Ibrani memakai objek tunggal, “engkau.” Daud disapa sebagai pemimpin yang mewakili kelompoknya; orang-orangnya tersirat.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: akan menyerahkan / akan menyerahkan engkau
  rationale: Bentuk Hifil dari סגר dalam konteks ini berarti menyerahkan seseorang ke dalam kekuasaan pihak lain. “Menyerahkan” alami dalam bahasa Indonesia dan mempertahankan nuansa pengalihan kepada musuh.
- source_word: בַּעֲלֵי קְעִילָה
  choice: penduduk Kehila
  rationale: Dalam konteks kewargaan kota ini, frasa tersebut menunjuk kepada warga atau orang-orang Kehila, bukan secara harfiah kepada para pemilik kota. “Penduduk Kehila” jelas dan wajar tanpa membatasi rujukannya hanya kepada para pemimpin.
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: aku dan orang-orangku
  rationale: Terjemahan ini mempertahankan cakupan umum אֲנָשַׁי bagi para pengikut Daud tanpa mempersempitnya menjadi hanya prajurit.
- source_word: בְּיַד שָׁאוּל
  choice: ke dalam tangan Saul
  rationale: Ungkapan ini mempertahankan citra Ibrani “tangan,” yang secara idiomatis berarti kuasa atau kendali Saul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: יַסְגִּירוּ
  choice: Mereka akan menyerahkan engkau
  rationale: Jawaban mengulang verba dalam pertanyaan dan mempertahankan objek orang kedua tunggal dalam teks Ibrani; Daud disapa sebagai pemimpin yang mewakili kelompoknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan fungsi nama itu alih-alih menggantinya dengan gelar.
- issue: Objek tunggal dalam jawaban ilahi
  choice: engkau
  alternative: kalian / engkau dan orang-orangmu
  rationale: Bahasa Ibrani menjawab dengan objek tunggal, meskipun pertanyaan Daud menyebut dirinya dan orang-orangnya. Terjemahan mempertahankan ketegangan gramatikal ini dan menjelaskannya dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” dan “engkau” dipakai dalam dialog naratif Alkitab; idiom “ke dalam tangan Saul” dipertahankan karena mudah dipahami dan dijelaskan melalui catatan kaki.
