  source_fidelity: Terjemahan menyampaikan urutan tindakan וַיָּקֻמוּ וַיֵּלְכוּ, arah ke Zif, makna לִפְנֵי שָׁאוּל sebagai tindakan yang mendahului Saul, serta peralihan lokasi kepada Daud dan orang-orangnya. Rincian geografis—padang gurun Maon, Araba, dan lokasi di sebelah selatan Yesimon—terpelihara. Catatan kaki a dengan tepat mempertahankan arti harfiah יָמִין (‘kanan’) dan penafsiran geografisnya (‘selatan’).
