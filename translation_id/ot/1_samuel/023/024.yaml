  terminology: Nama tempat Zif, Maon, Araba, dan Yesimon konsisten sebagai transliterasi Indonesia. “Padang gurun” merupakan padanan yang layak untuk מִדְבָּר dalam konteks ini dan tidak memaksakan gambaran gurun pasir. Catatan kaki b dengan tepat mencatat kemungkinan makna leksikal Yesimon tanpa meniadakan fungsi nama tempatnya.
