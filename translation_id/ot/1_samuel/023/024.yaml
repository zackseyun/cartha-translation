language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּק֛וּמוּ וַ/יֵּלְכ֥וּ זִ֖יפָ/ה לִ/פְנֵ֣י שָׁא֑וּל וְ/דָוִ֨ד וַ/אֲנָשָׁ֜י/ו בְּ/מִדְבַּ֤ר מָעוֹן֙ בָּ/עֲרָבָ֔ה אֶ֖ל יְמִ֥ין הַ/יְשִׁימֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: id
  text: Mereka bangkit lalu pergi ke Zif mendahului Saul. Sementara itu, Daud dan orang-orangnya berada di padang gurun Maon, di Araba, di sebelah selatan[a] Yesimon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di sebelah kanan Yesimon”; dalam penggunaan geografis Ibrani, “kanan” dapat berarti “selatan”.
    reason: lexical_alternative
  - marker: b
    text: “Yesimon” juga dapat dipahami sebagai “tanah tandus” atau “daerah sunyi”, tetapi di sini kemungkinan besar berfungsi sebagai nama tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיֵּלְכוּ
  choice: Mereka bangkit lalu pergi
  rationale: Dua bentuk naratif berurutan diterjemahkan secara langsung. “Lalu” menyampaikan urutan tindakan dengan wajar dalam bahasa Indonesia.
- source_word: זִיפָה
  choice: ke Zif
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Zif.
- source_word: לִפְנֵי שָׁאוּל
  choice: mendahului Saul
  rationale: Dalam konteks perjalanan, frasa ini menyatakan bahwa mereka pergi lebih dahulu daripada Saul.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: Sementara itu, Daud dan orang-orangnya berada
  rationale: Klausa tanpa verba ini mengalihkan adegan kepada lokasi Daud. “Berada” melengkapi kalimat Indonesia, sedangkan “Sementara itu” menandai peralihan secara alami tanpa menambah pertentangan yang kuat.
- source_word: בְּמִדְבַּר מָעוֹן
  choice: di padang gurun Maon
  rationale: מִדְבָּר menunjuk wilayah liar, tandus, atau tidak dihuni; “padang gurun” merupakan padanan geografis yang alami dan tidak harus menyiratkan gurun pasir.
- source_word: בָּעֲרָבָה
  choice: di Araba
  rationale: Dengan artikel tertentu dan dalam rangkaian keterangan geografis, kata ini paling mungkin menunjuk kawasan Araba. Transliterasi mempertahankan kemungkinan nama wilayah.
- source_word: אֶל יְמִין הַיְשִׁימוֹן
  choice: di sebelah selatan Yesimon
  rationale: יָמִין secara harfiah berarti “kanan”, tetapi dalam orientasi geografis Ibrani dapat berarti “selatan”. Ungkapan Indonesia ini menyampaikan arah yang paling mungkin sambil mencatat arti harfiahnya dalam catatan kaki.
- source_word: הַיְשִׁימוֹן
  choice: Yesimon
  rationale: Kata ini kemungkinan berfungsi sebagai nama geografis dalam konteks ini, meskipun secara leksikal dapat berarti tanah tandus atau daerah sunyi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Nama-nama tempat ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia. Struktur dibuat alami tanpa menghilangkan urutan tindakan dan rincian geografis teks Ibrani.
