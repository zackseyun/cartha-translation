base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: id
  text: Kemudian mereka memberitahukan kepada Daud dengan berkata, “Lihat, orang Filistin sedang menyerang Kehila[a] dan menjarah tempat-tempat pengirikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang berperang di Kehila.” Preposisi Ibrani ini secara harfiah berarti “di,” tetapi dalam konteks militer kemungkinan besar menunjukkan bahwa orang Filistin sedang menyerang kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Kemudian orang memberitahukan kepada Daud
  rationale: Bentuk Hifil wayyiqtol dari נגד melanjutkan urutan narasi dan memiliki subjek jamak yang tidak disebutkan identitasnya. Ungkapan Indonesia dengan ‘orang’ mempertahankan pelaku tak tentu secara alami.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif konstruktus ini memperkenalkan ujaran langsung. ‘Katanya’ mempertahankan fungsi kutipan dengan gaya naratif Indonesia yang wajar.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel penunjuk ini menarik perhatian pada berita mendesak; ‘Lihat’ alami, langsung, dan tidak arkais.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Menunjuk kepada kelompok bangsa yang sudah dikenal; bentuk ‘orang Filistin’ lazim dalam bahasa Indonesia.
- source_word: נִלְחָמִים
  choice: sedang menyerang
  rationale: Partisipel Nifal dari לחם menyatakan tindakan militer yang sedang berlangsung. Dalam konteks penyelamatan kota, ‘menyerang’ menyampaikan maksud yang paling mungkin tanpa merinci taktiknya.
- source_word: בִּקְעִילָה
  choice: Kehila
  rationale: Preposisi ב secara harfiah dapat berarti ‘di/pada’, tetapi bersama verba perang dalam konteks ini kemungkinan menunjukkan kota yang menjadi sasaran. Hubungannya dinyatakan secara alami melalui verba ‘menyerang’; alternatif harfiah dicatat dalam catatan kaki.
- source_word: וְהֵמָּה
  choice: dan
  rationale: Pronomina mandiri menegaskan subjek orang Filistin. Dalam bahasa Indonesia, subjeknya tetap jelas tanpa pengulangan yang kaku, sedangkan ו diterjemahkan ‘dan’.
- source_word: שֹׁסִים
  choice: menjarah
  rationale: Partisipel ini berarti merampas atau menjarah dalam konteks peperangan; ‘menjarah’ cocok dengan perampasan hasil pertanian.
- source_word: אֶת הַגֳּרָנוֹת
  choice: tempat-tempat pengirikan
  rationale: גֹּרֶן menunjuk pada lantai atau tempat untuk mengirik. ‘Tempat-tempat pengirikan’ mempertahankan acuan konkret tanpa menggantinya dengan hasil panen yang hanya tersirat.
