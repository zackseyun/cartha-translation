translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat dieja ‘Kehila’ sesuai bentuk yang umum dalam tradisi Alkitab Indonesia. Penanda catatan kaki ditempatkan langsung sesudah nama kota yang menjadi pusat ambiguitas preposisional.
