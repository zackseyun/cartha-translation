  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו אַל תִּירָ֗א כִּ֠י לֹ֤א תִֽמְצָאֲ/ךָ֙ יַ֚ד שָׁא֣וּל אָבִ֔/י וְ/אַתָּה֙ תִּמְלֹ֣ךְ עַל יִשְׂרָאֵ֔ל וְ/אָנֹכִ֖י אֶֽהְיֶה לְּ/ךָ֣ לְ/מִשְׁנֶ֑ה וְ/גַם שָׁא֥וּל אָבִ֖/י יֹדֵ֥עַ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: id
  text: Ia berkata kepadanya, “Jangan takut, sebab tangan Saul, ayahku, tidak akan menjangkaumu.[a] Engkau akan menjadi raja atas Israel, dan aku akan menjadi yang kedua sesudahmu.[b] Bahkan Saul, ayahku, mengetahui hal ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kuasa Saul, ayahku, tidak akan menjangkaumu.” Secara harfiah bahasa Ibrani berbunyi, “tangan Saul, ayahku, tidak akan menemukanmu”; “tangan” dipakai sebagai kiasan bagi kuasa atau jangkauan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku akan menjadi orang kedua dalam pemerintahanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Ungkapan larangan yang baku dan alami dalam bahasa Indonesia modern, dengan tetap mempertahankan daya imperatif dari bentuk Ibrani.
- source_word: לֹא תִמְצָאֲךָ יַד שָׁאוּל אָבִי
  choice: tangan Saul, ayahku, tidak akan menemukanmu
  rationale: 'Mempertahankan gambaran konkret bahasa Ibrani: “tangan” sebagai kiasan bagi kuasa atau jangkauan, dan “menemukan” sebagai kata kerjanya. Karena ungkapan ini tidak sepenuhnya lazim dalam bahasa Indonesia, maknanya dijelaskan dalam catatan kaki.'
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: Engkau akan memerintah atas Israel
  rationale: Mempertahankan bentuk verba מלך dan menyatakan pemerintahan sebagai raja tanpa mengubahnya menjadi gelar nominal.
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: aku akan menjadi orang kedua setelahmu
  rationale: מִשְׁנֶה menunjukkan kedudukan kedua atau bawahan. Pilihan ini jelas dalam bahasa Indonesia dan tidak memasukkan jabatan birokratis modern yang tidak dinyatakan secara eksplisit oleh teks.
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: Bahkan Saul, ayahku, mengetahui hal itu
  rationale: כֵּן menunjuk kembali kepada isi pernyataan Yonatan. “Mengetahui hal itu” alami dan cukup jelas, sedangkan וְגַם dalam konteks ini menekankan bahwa Saul pun mengetahuinya.
theological_decisions:
- issue: Tingkat ketegasan dalam perkiraan Yonatan tentang pemerintahan Daud dan kedudukannya sendiri sebagai bawahan
  choice: Menerjemahkannya sebagai keyakinan langsung mengenai masa depan politik Daud dan kedudukan Yonatan tanpa menambahkan bahasa perjanjian atau mesianik
  alternative: Menafsirkannya secara eksplisit sebagai nubuat teologis tentang pengangkatan oleh Allah
  rationale: Ayat ini menyatakan bahwa Daud akan memerintah dan Yonatan akan menempati kedudukan kedua, tetapi dalam kalimat ini tidak ada penyebutan eksplisit tentang TUHAN. Terjemahan mempertahankan pernyataan sebagaimana adanya tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan “engkau” dipakai dalam ujaran langsung antar tokoh Alkitab; “aku” mempertahankan keakraban sekaligus kesungguhan ucapan. Idiom Ibrani yang penting dipertahankan dalam teks utama dan diterangkan melalui catatan kaki.
