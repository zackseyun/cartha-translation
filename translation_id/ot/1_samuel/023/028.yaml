  text: וַ/יָּ֣שָׁב שָׁא֗וּל מִ/רְדֹף֙ אַחֲרֵ֣י דָוִ֔ד וַ/יֵּ֖לֶךְ לִ/קְרַ֣את פְּלִשְׁתִּ֑ים עַל כֵּ֗ן קָֽרְאוּ֙ לַ/מָּק֣וֹם הַ/ה֔וּא סֶ֖לַע הַֽמַּחְלְקֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/028.yaml
  text: So Saul returned from pursuing David and went to meet the Philistines. Therefore that place was called the Rock of Division[a].
translation:
  language: id
  text: Maka Saul berhenti mengejar Daud dan pergi menghadapi orang Filistin. Itulah sebabnya tempat itu dinamai Batu Perpisahan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Batu Pemisahan" atau "Batu Pembagian". Nama tempat ini mungkin merujuk pada terpisahnya Saul dan Daud ketika Saul menghentikan pengejarannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: berhenti
  rationale: Dalam konstruksi dengan מִרְדֹף, verba שׁוּב menyatakan Saul berbalik dari atau menghentikan tindakan yang sedang dilakukan; 'berhenti mengejar' paling alami dalam bahasa Indonesia.
- source_word: מִרְדֹף אַחֲרֵי דָוִד
  choice: mengejar Daud
  rationale: רדף dalam konteks militer-naratif berarti mengejar, sedangkan מן menandai dihentikannya pengejaran itu.
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: menghadapi orang Filistin
  rationale: לקראת berarti pergi untuk menemui atau menyongsong. Dalam konteks ancaman militer Filistin, 'menghadapi' menyampaikan situasinya tanpa secara eksplisit menambahkan bahwa pertempuran langsung terjadi.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini secara alami memperkenalkan alasan pemberian nama tempat dalam bahasa Indonesia modern.
- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: tempat itu dinamai
  rationale: Bentuk jamak tanpa subjek tertentu dalam bahasa Ibrani wajar diterjemahkan sebagai pasif agar tidak menambahkan pelaku yang tidak disebutkan.
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: Batu Perpisahan
  rationale: סלע menunjuk pada batu besar atau formasi batu, sedangkan המחלקות berkaitan dengan pembagian atau perpisahan. 'Batu Perpisahan' merupakan nama tempat yang alami dan sesuai dengan berakhirnya pengejaran Saul.
