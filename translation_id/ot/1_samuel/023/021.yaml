  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: id
  text: Saul berkata, “Kiranya kalian diberkati oleh Yahweh, karena kalian telah berbelas kasihan kepadaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi; dalam bahasa Indonesia modern, kata penghubung waw tidak perlu dinyatakan dengan ‘lalu’ atau ‘dan’ di sini.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Nama pribadi ini mengikuti bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: בְּרוּכִים אַתֶּם
  choice: Kiranya kalian diberkati
  rationale: Adjektiva predikatif jamak bersama pronomina mandiri membentuk formula berkat. Bentuk ‘kiranya ... diberkati’ menyampaikan daya pengucapan berkat secara alami, bukan sekadar menyatakan keadaan.
- source_word: לַיהוָה
  choice: oleh Yahweh
  rationale: Dalam formula berkat, ל menandai hubungan atau sumber berkat; ‘oleh’ wajar dalam bahasa Indonesia dan mempertahankan nama ilahi יהוה sebagai ‘Yahweh’.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan bagi ucapan berkat Saul.
- source_word: חֲמַלְתֶּם
  choice: telah berbelas kasihan
  rationale: חמל menyatakan rasa iba atau belas kasihan dan dalam konteks tertentu dapat berimplikasi tidak membinasakan. Karena objeknya Saul, makna relasional ‘berbelas kasihan’ paling sesuai tanpa menambahkan tindakan yang tidak dinyatakan.
- source_word: עָלָי
  choice: kepadaku
  rationale: Sesudah חמל, preposisi על menandai orang yang menerima belas kasihan; ‘kepadaku’ merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar, sedangkan ‘Yehuwa’ didasarkan pada bentuk vokalisasi yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kalian’ dipakai karena אַתֶּם dan verba חֲמַלְתֶּם berbentuk jamak. Ambiguitas חמל antara belas kasihan dan tindakan menyayangkan atau tidak membinasakan dipertahankan melalui ungkapan umum ‘berbelas kasihan’, tanpa catatan kaki karena konteks tidak menuntut pemilihan arti ‘menyayangkan nyawa’.
