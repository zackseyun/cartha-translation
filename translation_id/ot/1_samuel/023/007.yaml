  source_fidelity: 'Makna pokok diterjemahkan setia: Saul menerima laporan tentang kedatangan Daud di Kehila, lalu menafsirkan posisi Daud sebagai penyerahan oleh Allah ke dalam kuasanya. Terjemahan mempertahankan ucapan Saul sebagai ucapan langsung, tanpa menjadikannya penilaian narator. Namun, pembukaan "Ketika ... berkatalah" mengubah dua peristiwa berurutan menjadi anak kalimat waktu dan terasa kurang langsung dibandingkan bentuk Ibrani.'
  naturalness: '"Diberi tahu" dan "telah mengurung dirinya" dapat dipahami, tetapi "Ketika Saul diberi tahu ... berkatalah Saul" bernuansa agak kaku dan tidak perlu. Frasa "kota yang berpintu gerbang dan berpalang" juga kurang lazim dalam bahasa Indonesia modern. "Dilaporkan kepada Saul ... Lalu Saul berkata" serta "sebuah kota dengan pintu gerbang dan palang" lebih alami dan tetap cukup dekat dengan bahasa sumber.'
  terminology: '"Allah," "Daud," dan "Kehila" sesuai register Alkitab bahasa Indonesia. Idiom "ke dalam tanganku" tepat dipertahankan dan dijelaskan melalui catatan. "Pintu gerbang dan palang" menyampaikan דלתים וּבְרִיחַ; catatan menjelaskan bentuk dual pada kata Ibrani tanpa memaksakan pembacaan teknis itu ke dalam teks utama.'
