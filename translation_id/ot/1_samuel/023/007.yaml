  text: וַ/יֻּגַּ֣ד לְ/שָׁא֔וּל כִּי בָ֥א דָוִ֖ד קְעִילָ֑ה וַ/יֹּ֣אמֶר שָׁא֗וּל נִכַּ֨ר אֹת֤/וֹ אֱלֹהִים֙ בְּ/יָדִ֔/י כִּ֚י נִסְגַּ֣ר לָ/ב֔וֹא בְּ/עִ֖יר דְּלָתַ֥יִם וּ/בְרִֽיחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: id
  text: Dilaporkan kepada Saul bahwa Daud telah datang ke Kehila. Lalu Saul berkata, “Allah telah menyerahkan dia ke dalam tanganku[a], sebab dia telah mengurung dirinya dengan masuk ke sebuah kota dengan pintu gerbang dan palang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan harfiah “ke dalam tanganku” berarti ke dalam kuasa atau kendaliku.
    reason: idiom_note
  - marker: b
    text: Maksudnya kota berbenteng yang pintu gerbangnya dapat dikunci dengan palang. Kata Ibrani untuk “pintu” berbentuk dual dan dapat menunjuk pada sepasang daun pintu gerbang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberi tahu
  rationale: Bentuk pasif kausatif menyatakan bahwa kabar itu disampaikan kepada Saul; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sudut pandang pasif.
- source_word: בָא דָוִד קְעִילָה
  choice: Daud telah datang ke Kehila
  rationale: Kata בוא berarti datang atau masuk. Dengan Kehila sebagai tujuan, 'telah datang ke Kehila' menyampaikan laporan tentang tindakan yang sudah terjadi.
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: Allah telah menyerahkan dia ke dalam tanganku
  rationale: Dalam konteks ini נכר bermakna menyerahkan. Ungkapan 'ke dalam tanganku' mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa seseorang.
- source_word: נִסְגַּר
  choice: dia telah mengurung dirinya
  rationale: Bentuk Nifal dapat dipahami secara pasif atau refleksif. Konteks ucapan Saul mendukung nuansa bahwa Daud telah menempatkan dirinya dalam keadaan terkurung, tanpa meniadakan ambiguitas bentuknya.
- source_word: לָבוֹא
  choice: dengan masuk
  rationale: Infinitif ini menerangkan bagaimana atau mengapa Daud berada dalam keadaan terkurung.
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: ke kota yang berpintu gerbang dan berpalang
  rationale: דלתים menunjuk pada daun-daun pintu gerbang kota, sedangkan בריח adalah palang pengamannya. Terjemahan ini alami dan mempertahankan gambaran kota berbenteng tanpa memaksakan jumlah palang.
theological_decisions:
- issue: Saul mengaitkan keadaan Daud dengan tindakan Allah
  choice: 'Ucapan Saul diterjemahkan langsung: ''Allah telah menyerahkan dia ke dalam tanganku.'''
  alternative: Menambahkan jarak penafsiran, misalnya 'Saul mengira bahwa Allah telah menyerahkan Daud kepadanya.'
  rationale: Teks Ibrani menyajikannya sebagai perkataan langsung Saul, bukan sebagai penegasan narator. Terjemahan tidak menambahkan dukungan ataupun sanggahan terhadap penilaian Saul.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat ditransliterasikan sebagai 'Kehila'. Struktur kalimat dibuat alami tanpa menghapus idiom penting atau ambiguitas pada ucapan Saul.
