  to: Dilaporkan kepada Saul bahwa Daud telah datang ke Kehila. Lalu Saul berkata, “Allah telah menyerahkan dia ke dalam tanganku[a], sebab dia telah mengurung dirinya dengan masuk ke sebuah kota dengan pintu gerbang dan palang[b].”
  rationale: Revisi memperbaiki alur naratif dan kealamian bahasa Indonesia tanpa mengubah makna. Bentuk refleksif "telah mengurung dirinya" dipertahankan sebagai penafsiran Saul atas tindakan Daud, sementara kemungkinan nuansa pasif dalam bentuk Ibrani tidak dipastikan secara berlebihan. Catatan kaki tetap terikat pada unsur yang tepat dan mempertahankan informasi idiomatis serta budaya yang relevan.
