  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: id
  text: Hana berbicara dalam hatinya; hanya bibirnya yang bergerak[a], tetapi suaranya tidak terdengar. Karena itu, Eli mengira Hana mabuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbicara kepada dirinya sendiri” / “berdoa dalam hati.” Secara harfiah, bahasa Ibraninya berbunyi “berbicara dalam hatinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: berbicara dalam hatinya
  rationale: Mempertahankan gambaran harfiah ungkapan Ibrani sekaligus menyampaikan bahwa Hana berbicara secara batin tanpa menyuarakannya.
- source_word: רַק
  choice: hanya
  rationale: 'Menandai pembatasan: satu-satunya tanda lahiriah yang tampak ialah gerak bibirnya.'
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: bibirnya yang bergerak
  rationale: נוּעַ di sini menunjuk pada gerakan bibir yang terlihat dan berlawanan dengan suara yang tidak terdengar.
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: tetapi suaranya tidak terdengar
  rationale: Bentuk Nifal menyatakan bahwa suaranya tidak dapat didengar; 'tetapi' mengungkapkan kontras yang tersirat antara bibir yang bergerak dan suara yang tidak terdengar.
- source_word: וַיַּחְשְׁבֶהָ
  choice: Eli mengira bahwa ia
  rationale: חשב dengan akhiran objek dan pelengkap predikatif berarti menganggap atau menyangka seseorang berada dalam keadaan tertentu.
- source_word: לְשִׁכֹּרָה
  choice: mabuk
  rationale: Adjektiva ini berarti mabuk; bentuk predikatif tersebut alami dalam bahasa Indonesia.
- source_word: וְחַנָּה הִיא
  choice: Hana
  rationale: Nama Hana cukup alami sebagai topik kalimat dalam bahasa Indonesia; tidak ditambahkan penanda waktu yang tidak terdapat dalam sumber.
