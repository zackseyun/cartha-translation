  text: וְ/גַ֣ם אָנֹכִ֗י הִשְׁאִלְתִּ֨/הוּ֙ לַֽ/יהוָ֔ה כָּל הַ/יָּמִים֙ אֲשֶׁ֣ר הָיָ֔ה ה֥וּא שָׁא֖וּל לַֽ/יהוָ֑ה וַ/יִּשְׁתַּ֥חוּ שָׁ֖ם לַ/יהוָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: id
  text: Maka, aku pun menyerahkan[a] dia kepada Yahweh. Selama ia hidup, ia diserahkan kepada Yahweh.” Lalu ia sujud menyembah Yahweh di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan ‘menyerahkan’ berasal dari akar yang sama dengan kata ‘meminta’ sebelumnya dalam pasal ini. Karena itu, ungkapan ini juga dapat diterjemahkan ‘meminjamkan’ atau ‘mempersembahkan dia kepada Yahweh.’
    reason: lexical_alternative
  - marker: b
    text: Atau, ‘Lalu mereka sujud menyembah Yahweh di sana.’ Subjek kata kerja ini tidak disebutkan secara tegas, dan tradisi penerjemahan memahaminya secara berbeda.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: menyerahkan dia
  rationale: Bentuk kausatif dari שׁאל menggemakan permintaan Hana sebelumnya. Dalam konteks ini tindakannya adalah menyerahkan atau mempersembahkan Samuel untuk melayani Yahweh; pilihan ini lebih alami daripada ‘meminjamkan dia’ dalam bahasa Indonesia, sementara permainan katanya dijelaskan dalam catatan kaki.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi menyatakan arah atau penerima penyerahan, dan nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: seumur hidupnya
  rationale: Ungkapan idiomatis Indonesia yang secara alami menyampaikan arti ‘selama ia hidup’ atau seluruh masa hidupnya.
- source_word: שָׁאוּל
  choice: diserahkan
  rationale: Berasal dari akar שׁאל yang sama dengan הִשְׁאִלְתִּהוּ. Pengulangan ‘menyerahkan/diserahkan’ mempertahankan kesejajaran bentuk, sedangkan hubungan permainan kata dengan ‘meminta’ diterangkan dalam catatan kaki.
- source_word: וַיִּשְׁתַּחוּ
  choice: ia sujud menyembah
  rationale: Kata kerja ini menggambarkan tindakan membungkuk atau merebahkan diri dalam penyembahan. ‘Sujud menyembah’ mempertahankan unsur jasmani sekaligus makna religiusnya; subjek tersiratnya tetap tidak pasti dalam konteks.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan lokatif yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; ‘Yahweh’ mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Subjek tersirat dari וַיִּשְׁתַּחוּ
  choice: ia sujud menyembah
  alternative: mereka sujud menyembah
  rationale: Bentuk Masoret lazim dipahami sebagai tunggal, tetapi orang yang dirujuk tidak disebutkan secara tegas dan tradisi penerjemahan juga mengenal bacaan jamak. Teks utama mengikuti bentuk tunggal, sedangkan alternatif jamak dipertahankan dalam catatan kaki.
- issue: Makna penyerahan Samuel kepada Yahweh
  choice: menyerahkan dia kepada Yahweh seumur hidup
  alternative: meminjamkan atau mempersembahkan dia kepada Yahweh
  rationale: Konteks menunjukkan pengabdian Samuel kepada Yahweh sepanjang hidup, tetapi permainan kata Ibrani dengan akar ‘meminta’ tidak boleh diubah menjadi rumusan doktrinal yang lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. ‘Sujud menyembah’ dipilih agar tindakan fisik dan ibadah sama-sama terdengar. Pengulangan ‘menyerahkan/diserahkan’ mempertahankan struktur Ibrani sejauh wajar, sementara catatan kaki menjelaskan permainan kata yang tidak dapat dipertahankan sepenuhnya dalam bahasa Indonesia.
