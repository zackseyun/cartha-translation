  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: id
  text: Hana berkata,[a] “Kiranya hambamu mendapat kemurahan di matamu.” Lalu perempuan itu pergi meneruskan perjalanannya dan makan. Wajahnya tidak lagi muram.[b]
  philosophy: optimal-equivalence
