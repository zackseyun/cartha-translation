    text: Dalam teks Ibrani, subjeknya hanya “ia”; nama Hana dicantumkan untuk memperjelas siapa yang berbicara.
    reason: referent_clarification
  - marker: b
    text: Secara harfiah, “wajahnya tidak lagi [demikian]”; ungkapan ini menunjukkan bahwa raut wajahnya tidak lagi memperlihatkan kemuraman.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: Kiranya ... mendapat
  rationale: Bentuk imperfek dalam ungkapan langsung ini menyatakan harapan atau permohonan yang santun. “Kiranya” menyampaikan nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: שִׁפְחָתְךָ
  choice: hambamu
  rationale: Kata Ibrani ini secara khusus menunjuk hamba perempuan dan di sini dipakai Hana sebagai sebutan diri yang merendah di hadapan Eli. “Hambamu” alami dalam sapaan hormat bahasa Indonesia; gender penuturnya sudah jelas dari konteks.
- source_word: חֵן בְּעֵינֶיךָ
  choice: mendapat kemurahan di matamu
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani tentang dipandang dengan baik, sekaligus tetap dapat dipahami oleh pembaca Indonesia modern.
- source_word: לְדַרְכָּהּ
  choice: pergi meneruskan perjalanannya
  rationale: Frasa ini menyatakan bahwa perempuan itu beranjak dan melanjutkan jalannya. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: וַתֹּאכַל
  choice: dan makan
  rationale: Bentuk naratif ini menyebut tindakan berikutnya secara sederhana. “Makan” juga mempertahankan kontras kontekstual dengan keadaannya sebelumnya ketika ia tidak mau makan.
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: Wajahnya tidak lagi muram
  rationale: Ungkapan Ibrani secara harfiah tidak menyebut kata “muram,” tetapi dalam konteks menggambarkan perubahan raut wajah Hana setelah berdoa dan menerima jawaban Eli. Pilihan ini menyampaikan makna tampak tanpa menyatakan bahwa seluruh kesedihannya telah lenyap.
