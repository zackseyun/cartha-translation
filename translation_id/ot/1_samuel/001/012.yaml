  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: id
  text: Ketika Hana terus berdoa di hadapan Yahweh, Eli memperhatikan mulutnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Formula naratif ini memperkenalkan keadaan waktu bagi tindakan berikutnya. 'Ketika' menyampaikan fungsi temporalnya secara alami dalam bahasa Indonesia tanpa ungkapan yang kaku seperti 'dan terjadilah ketika'.
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: terus berdoa
  rationale: Bentuk Hifil dari רבה bersama infinitif להתפלל menyatakan tindakan berdoa yang berlangsung atau dilakukan lama; 'terus berdoa' mempertahankan aspek berkelanjutan itu dengan wajar.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menunjukkan doa yang dipanjatkan dalam hadirat Allah. 'Di hadapan' cukup formal, alami, dan dekat dengan citra Ibraninya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: שֹׁמֵר
  choice: memperhatikan
  rationale: Partisipel Qal menunjukkan tindakan Eli yang sedang berlangsung. Dalam konteks ini, 'memperhatikan' menyampaikan pengamatan saksama secara lebih alami daripada 'menjaga'.
- source_word: אֶת פִּיהָ
  choice: mulutnya
  rationale: פֶּה secara harfiah berarti 'mulut'. Pilihan ini dipertahankan karena ayat berikutnya secara khusus menyebut bibir Hana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai tetragramaton. 'Yahweh' mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara durasi doa, lokasi relasional 'di hadapan', dan objek pengamatan Eli tetap dipertahankan.
