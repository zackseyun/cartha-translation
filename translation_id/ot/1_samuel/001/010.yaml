  text: And she was bitter in soul[b][a], and she prayed to Yahweh and wept bitterly.
translation:
  language: id
  text: Dengan hati yang sangat pedih,[a] Hana berdoa kepada Yahweh dan ia menangis dengan sangat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pahit jiwa”, ungkapan Ibrani untuk kepedihan batin yang mendalam.
    reason: lexical_alternative
  - marker: b
    text: Atau “terus menangis”. Bahasa Ibrani memakai bentuk penegasan, secara harfiah, “menangis, ia menangis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: dengan hati yang sangat pedih
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'pahit jiwa'. Terjemahan ini mempertahankan gambaran kepedihan batin sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: וַתִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk hitpael dari פלל di sini secara langsung berarti 'berdoa'; kesungguhan doanya sudah tampak dari konteks dan tangisnya.
- source_word: עַל יְהוָה
  choice: kepada Yahweh
  rationale: Dengan verba 'berdoa', עַל secara idiomatis menunjukkan pihak yang menjadi tujuan doa. 'Kepada' merupakan padanan Indonesia yang paling jelas dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וּבָכֹה תִבְכֶּה
  choice: sambil terus menangis
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan menangis. Dalam konteks ini, 'terus menangis' secara alami menyampaikan intensitas atau keberlanjutannya tanpa memasukkan kembali unsur 'pedih' ke dalam verba.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Nama Hana disebut untuk menghindari pronomina pembuka yang kaku atau ambigu dalam ayat yang berdiri sendiri. Struktur partisipial 'dengan ...' mengalir wajar dan tetap mempertahankan hubungan erat antara kepedihan, doa, dan tangis.
