  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: id
  text: Lalu Eli menjawab dan berkata, “Pergilah dengan damai, dan semoga Allah Israel mengabulkan permohonan yang telah kamuajukan kepada-Nya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab, katanya
  rationale: Kedua verba tutur dipertahankan sesuai gaya narasi Ibrani; bentuk ini tetap alami dan bermartabat dalam bahasa Indonesia.
- source_word: לְכִי לְשָׁלוֹם
  choice: Pergilah dengan damai
  rationale: Menyampaikan imperatif kepada Hana dan formula berkat/perpisahan Ibrani tanpa mempersempit maknanya hanya menjadi keselamatan perjalanan.
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan alami bagi frasa konstruksi yang menunjuk kepada Allah yang disembah Israel.
- source_word: יִתֵּן
  choice: semoga ... mengabulkan
  rationale: Dalam konteks berkat atau harapan, bentuk ini menyampaikan daya volitif verba; 'mengabulkan' secara alami berpadu dengan permohonan.
- source_word: שֵׁלָתֵךְ
  choice: permohonan
  rationale: Kata ini menunjuk pada apa yang diminta Hana dalam doa; 'permohonan' sesuai dengan konteks doa dan tetap mudah dipahami.
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: yang telah kauminta dari-Nya
  rationale: Klausa relatif dan tindakan yang telah dilakukan dipertahankan; huruf kapital pada pronomina mengikuti kebiasaan penerbitan Alkitab Indonesia dan konteks menunjukkan bahwa acuannya ialah Allah.
theological_decisions:
- issue: Acuan pronomina dalam מֵעִמּוֹ
  choice: Allah, dinyatakan sebagai 'dari-Nya'
  alternative: Memakai 'darinya' tanpa kapitalisasi dan membiarkan acuan secara grafis kurang tertentu
  rationale: Konteks langsung menyatakan bahwa Hana memohon kepada Allah; terjemahan tetap memakai pronomina seperti teks Ibrani dan tidak menggantinya dengan nama eksplisit.
- issue: Nuansa יִתֵּן
  choice: 'Harapan atau berkat: ''semoga ... mengabulkan'''
  alternative: 'Pernyataan kepastian: ''akan mengabulkan'''
  rationale: Bentuk dan konteks paling wajar menyampaikan harapan/berkat Eli, bukan jaminan narator bahwa permohonan pasti dikabulkan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan 'menjawab, katanya' mempertahankan pengulangan verba tutur Ibrani, sedangkan 'semoga ... mengabulkan' menghasilkan ungkapan doa/berkat yang alami.
