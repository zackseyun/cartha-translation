  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: id
  text: Ia bernazar dan berkata, “Ya Yahweh Semesta Alam, jika Engkau sungguh-sungguh memperhatikan penderitaan hamba-Mu ini, mengingat aku, dan tidak melupakan hamba-Mu ini, tetapi mengaruniakan kepada hamba-Mu ini seorang anak laki-laki[a], maka aku akan menyerahkannya kepada Yahweh seumur hidupnya, dan pisau cukur tidak akan menyentuh kepalanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “keturunan laki-laki” atau “keturunan manusia”; dalam konteks ini ungkapan tersebut berarti seorang anak laki-laki.'
    reason: lexical_alternative
  - marker: b
    text: Larangan pisau cukur menyentuh kepala menggemakan bahasa pengudusan khusus yang berkaitan dengan nazar nazir. Namun, ayat ini menyatakan larangan mengenai rambut itu tanpa secara langsung memakai sebutan “nazir”.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: Ia mengucapkan nazar
  rationale: Ungkapan Ibrani memakai verba dan nomina serumpun, secara harfiah ‘menazarkan nazar’. ‘Mengucapkan nazar’ menyampaikan tindakan resmi itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Semesta Alam
  rationale: Nama perjanjian יְהוָה dipertahankan sebagai ‘Yahweh’. Gelar צְבָאוֹת menunjuk pada bala atau pasukan surgawi dan seluruh tatanan yang berada di bawah kuasa-Nya; ‘Semesta Alam’ merupakan ungkapan Indonesia yang wajar dan agung tanpa membatasi rujukannya pada pasukan manusia.
- source_word: אִם רָאֹה תִרְאֶה
  choice: jika Engkau sungguh-sungguh memperhatikan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. ‘Sungguh-sungguh’ mempertahankan intensitasnya, sedangkan ‘memperhatikan’ sesuai dengan konteks permohonan agar penderitaannya dilihat dan ditanggapi.
- source_word: בָּעֳנִי
  choice: penderitaan
  rationale: Kata ini dapat mencakup kesengsaraan, penindasan, dan kehinaan. ‘Penderitaan’ cukup luas untuk mempertahankan cakupan tersebut tanpa menentukan satu penyebab tertentu.
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: hamba-Mu ini
  rationale: Nomina Ibrani secara khusus merujuk kepada hamba perempuan. Dalam bahasa Indonesia, penutur perempuan secara alami menyebut dirinya ‘hamba-Mu ini’; bentuk ini mempertahankan kerendahan diri dalam doa tanpa frasa kaku ‘hamba perempuan-Mu’.
- source_word: וּזְכַרְתַּנִי וְלֹא תִשְׁכַּח
  choice: mengingat aku, dan tidak melupakan
  rationale: Terjemahan ini mempertahankan kesejajaran retoris antara ‘mengingat’ dan ‘tidak melupakan’.
- source_word: זֶרַע אֲנָשִׁים
  choice: seorang anak laki-laki
  rationale: Secara harfiah ungkapan ini berarti ‘keturunan laki-laki/keturunan manusia’, tetapi dalam konteks permohonan Hana maksudnya adalah anak berjenis kelamin laki-laki. Makna idiomatis ditempatkan dalam teks dan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּנְתַתִּיו לַיהוָה
  choice: aku akan menyerahkannya kepada Yahweh
  rationale: Verba dasarnya berarti ‘memberikan’. ‘Menyerahkan’ terdengar alami untuk pemberian seorang anak bagi pelayanan kepada Allah dan tidak menambahkan label pentahbisan yang tidak dinyatakan oleh teks.
- source_word: כָּל יְמֵי חַיָּיו
  choice: seumur hidupnya
  rationale: Ungkapan Indonesia ini secara ringkas dan alami menyampaikan arti ‘sepanjang seluruh hari hidupnya’.
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: pisau cukur tidak akan menyentuh kepalanya
  rationale: ‘Pisau cukur’ adalah arti yang paling mungkin bagi מוֹרָה dalam konteks ini. ‘Tidak akan menyentuh kepalanya’ menyampaikan idiom Ibrani secara jelas tanpa memasukkan sebutan ‘nazir’ ke dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut dan membedakannya dari gelar umum bagi Tuhan.
- issue: Kemungkinan kaitan larangan mencukur rambut dengan nazar nazir
  choice: Mempertahankan larangan konkret dalam teks tanpa menyebut anak itu sebagai nazir
  alternative: Menerjemahkannya dengan penjelasan eksplisit bahwa anak itu akan menjadi seorang nazir
  rationale: Bahasanya menggemakan pengudusan yang berkaitan dengan nazar nazir, tetapi ayat ini sendiri hanya menyatakan penyerahan seumur hidup dan larangan pisau cukur. Terjemahan tidak memastikan identitas teologis yang tidak disebutkan secara eksplisit.
- issue: Sifat bersyarat nazar Hana
  choice: Mempertahankan rangkaian ‘jika ... maka’
  alternative: Mengubahnya menjadi permohonan dan janji dalam dua kalimat terpisah
  rationale: Struktur bersyarat Ibrani penting bagi hubungan antara permohonan Hana dan janji penyerahan anak tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Sapaan ilahi memakai kapital pada pronomina yang merujuk kepada Allah. Pengulangan ‘hamba-Mu ini’ dipertahankan untuk mencerminkan desakan dan kerendahan hati dalam doa Hana; susunan kalimat tetap mengalir secara alami bagi pembaca umum.
