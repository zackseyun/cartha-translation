  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: id
  text: Lalu Elkana, suaminya, berkata kepadanya, “Hana, mengapa engkau menangis? Mengapa engkau tidak makan? Mengapa hatimu sedih[a]? Bukankah aku lebih baik bagimu daripada sepuluh anak laki-laki?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: hatimu berduka. Secara harfiah: hatimu menjadi buruk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: Elkana, suaminya
  rationale: Mempertahankan identifikasi Elkana sebagai suami Hana dengan susunan aposisi yang wajar dalam bahasa Indonesia.
- source_word: לָמֶה
  choice: mengapa
  rationale: Kata tanya ini muncul tiga kali; pengulangannya dipertahankan demi tekanan retoris.
- source_word: תִבְכִּי
  choice: engkau menangis
  rationale: Mengungkapkan tindakan yang sedang berlangsung tanpa membuat kalimat Indonesia terasa kaku.
- source_word: לֹא תֹאכְלִי
  choice: engkau tidak makan
  rationale: Menyatakan keadaan Hana saat itu tanpa menambahkan nuansa kemauan seperti “tidak mau makan”.
- source_word: יֵרַע לְבָבֵךְ
  choice: hatimu sedih
  rationale: Ungkapan harfiahnya memakai verba “menjadi buruk” dengan “hati”; dalam konteks ini menunjuk pada kesedihan atau dukacita batin. Citra “hati” tetap dipertahankan, sedangkan alternatif harfiah dicatat dalam catatan kaki.
- source_word: הֲלוֹא
  choice: Bukankah aku
  rationale: Pertanyaan retoris Ibrani ini mengharapkan jawaban yang membenarkan pernyataan pembicara; “bukankah” mempertahankan daya retoris tersebut.
- source_word: טוֹב לָךְ
  choice: lebih baik bagimu
  rationale: Mempertahankan bahasa perbandingan Ibrani secara dekat dan tidak mempersempit maknanya hanya menjadi nilai emosional atau kegunaan.
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: daripada sepuluh anak laki-laki
  rationale: בָּנִים secara khusus berarti anak-anak laki-laki; angka sepuluh dan unsur gender dipertahankan tanpa penjelasan tambahan dalam teks.
theological_decisions:
- issue: Kekhususan gender pada בָּנִים
  choice: anak laki-laki
  alternative: anak-anak
  rationale: Bentuk Ibrani secara eksplisit maskulin jamak dan konteksnya mencerminkan nilai budaya yang dilekatkan pada keturunan laki-laki; terjemahan tidak menetralkannya.
- issue: Nada klaim Elkana dalam טוֹב לָךְ
  choice: lebih baik bagimu
  alternative: lebih berharga bagimu
  rationale: Pilihan ini mempertahankan keluasan dan ketegangan dalam klaim Elkana, tanpa menilai apakah perkataannya merupakan penghiburan yang memadai atau tanpa membatasi makna pada nilai pribadi semata.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan “engkau” dipakai untuk percakapan antarpribadi dalam narasi Alkitab. Tiga pertanyaan “mengapa” dipertahankan untuk menjaga ritme dan tekanan teks sumber.
