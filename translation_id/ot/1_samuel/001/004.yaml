translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kurban” dipilih menurut ejaan baku untuk persembahan keagamaan. Susunan kalimat dibuat alami sambil mempertahankan seluruh unsur sumber dan ambiguitas antara peristiwa naratif tertentu dan tindakan kebiasaan.
