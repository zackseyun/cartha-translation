base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: id
  text: Ketika hari itu tiba[a], Elkana mempersembahkan kurban, lalu memberikan bagian kepada Penina, istrinya, dan kepada semua anak laki-laki dan anak perempuannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setiap kali tiba hari ketika Elkana mempersembahkan kurban, ia biasa memberikan bagian”; bentuk Ibrani dapat dipahami sebagai lampau biasa, tetapi konteks mungkin menunjuk pada tindakan yang dilakukan berulang kali dalam perjamuan kurban.
    reason: Memperjelas alternatif pembacaan kebiasaan secara idiomatis sambil mempertahankan kemungkinan pembacaan lampau biasa.
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: Ketika hari itu tiba
  rationale: Ungkapan naratif ini menetapkan waktu kejadian. Terjemahan ini mempertahankan unsur temporal secara alami dalam bahasa Indonesia tanpa memakai bentuk harfiah yang kaku, “dan terjadilah pada hari itu”.
- source_word: וַיִּזְבַּח
  choice: mempersembahkan kurban
  rationale: Kata kerja זבח menunjuk pada penyembelihan atau persembahan kurban. Pilihan ini jelas dalam konteks ibadah dan lebih alami daripada sekadar “berkurban”.
- source_word: וְנָתַן
  choice: lalu memberikan
  rationale: Secara bentuk dapat dibaca sebagai tindakan lampau dalam rangkaian narasi. “Lalu” menyatakan urutan tindakan dengan alami, sementara kemungkinan bahwa ini merupakan kebiasaan berulang dijelaskan dalam catatan kaki.
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: kepada Penina, istrinya
  rationale: Urutan ini mengikuti susunan Ibrani dan tanda koma memperjelas bahwa “istrinya” menerangkan Penina.
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: dan kepada semua anak laki-laki dan anak perempuannya
  rationale: Teks Ibrani secara eksplisit menyebut anak laki-laki dan anak perempuan; rincian itu dipertahankan dan tidak diringkas menjadi “anak-anaknya”.
- source_word: מָנוֹת
  choice: bagian-bagian
  rationale: Bentuk jamak ini menunjuk pada jatah atau porsi yang dibagikan dalam perjamuan kurban. Konteks sebelumnya sudah memperjelas jenis bagiannya.
