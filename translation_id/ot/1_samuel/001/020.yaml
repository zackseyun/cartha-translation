base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: id
  text: Ketika waktunya tiba, Hana mengandung dan melahirkan seorang anak laki-laki.[a] Ia menamainya Samuel, sebab ia berkata, “Aku telah memintanya dari Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada perputaran atau siklus hari-hari,” yaitu ketika waktu yang semestinya telah tiba.
    reason: lexical_alternative
  - marker: b
    text: 'Nama “Samuel” dihubungkan di sini melalui permainan kata dengan kata kerja Ibrani שׁאל, yang berarti “meminta”: “Aku telah memintanya dari Yahweh.” Hubungan ini merupakan permainan kata, bukan etimologi nama yang pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: Ketika waktunya tiba
  rationale: Ungkapan Ibrani ini secara harfiah menunjuk pada perputaran atau genapnya hari-hari; terjemahan ini menyampaikan tibanya waktu yang semestinya secara alami dalam bahasa Indonesia.
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Padanan baku dan ringkas untuk הרה dalam kisah kelahiran.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Padanan alami dalam bahasa Indonesia yang menyampaikan dengan tepat kelahiran seorang putra.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Ia menamainya
  rationale: Rumus penamaan Ibrani dialihkan secara idiomatis tanpa kehilangan maknanya.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: sebab katanya, “Aku telah memintanya dari Yahweh.”
  rationale: Mempertahankan hubungan dengan kata kerja שׁאל, 'meminta', serta menyatakan Yahweh sebagai pihak yang darinya anak itu diminta. Frasa 'katanya' dibuat eksplisit untuk memperjelas penjelasan nama yang tersirat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung sesuai kebijakan proyek.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Penjelasan nama Samuel melalui permainan kata
  choice: Mempertahankan kata 'meminta' dalam teks utama dan menjelaskan permainan katanya dalam catatan kaki
  alternative: Memaksakan etimologi harfiah nama Samuel ke dalam teks utama
  rationale: Ayat mengaitkan שְׁמוּאֵל dengan verba שׁאל, tetapi etimologi tepat nama itu diperdebatkan. Pilihan ini menjaga kaitan bunyi dan gagasan tanpa menyatakan kepastian etimologis yang tidak diberikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan narasi dibuat alami bagi pembaca umum, sementara idiom waktu, nama ilahi, dan permainan kata Ibrani tetap terdokumentasi.
