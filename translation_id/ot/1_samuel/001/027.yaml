id: 1SA.1.27
reference: 1 Samuel 1:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: id
  text: “Untuk anak inilah aku berdoa,[a] dan Yahweh telah mengabulkan permohonanku[b] yang kuajukan kepada-Nya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengenai anak inilah aku berdoa.” Preposisi Ibrani dapat menandai perkara yang menjadi pokok doanya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “apa yang kuminta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: Untuk anak inilah
  rationale: אֶל bersama verba ‘berdoa’ dapat menunjuk kepada hal atau orang yang menjadi pokok doa. ‘Untuk anak inilah’ alami dalam bahasa Indonesia dan mempertahankan penekanan pada anak tertentu ini; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: הִתְפַּלָּלְתִּי
  choice: aku berdoa
  rationale: Bentuk ini jelas berarti ‘berdoa’. Pronomina ‘aku’ sesuai dengan perkataan langsung Hana dan bentuk orang pertama tunggal.
- source_word: וַיִּתֵּן
  choice: telah mengabulkan
  rationale: Secara harfiah verba ini berarti ‘memberikan’, tetapi dalam hubungan dengan permohonan, ‘mengabulkan’ merupakan ungkapan Indonesia yang wajar dan menyampaikan hasil tindakan Yahweh yang masih nyata ketika Hana mempersembahkan Samuel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: שְׁאֵלָתִי
  choice: permohonanku
  rationale: Nomina ini berarti permintaan atau permohonan dan memuat sufiks orang pertama tunggal. ‘Permohonanku’ sesuai dengan konteks doa serta mempertahankan unsur kepunyaannya.
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: yang kuajukan kepada-Nya
  rationale: Ungkapan ini menjelaskan permohonan yang Hana minta dari Yahweh. ‘Kuajukan kepada-Nya’ alami dalam bahasa Indonesia dengan ‘permohonan’, meskipun pengulangan akar שאל dalam bahasa Ibrani tidak dapat dipertahankan sepenuhnya tanpa menghasilkan kalimat yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar dan tanpa memasukkan kekhasan denominasi.
- issue: Hubungan anak itu dengan doa Hana
  choice: Untuk anak inilah aku berdoa
  alternative: Mengenai anak inilah aku berdoa
  rationale: Preposisi אֶל dapat menyatakan sasaran atau pokok doa. Teks utama memakai ungkapan Indonesia yang paling alami, sedangkan catatan kaki mempertahankan kemungkinan bahwa frasa itu berarti ‘mengenai’ anak tersebut.
translation_notes:
  register: Bahasa yang dipakai modern, jelas, dan tetap khidmat. ‘Aku’ sesuai dengan tuturan langsung Hana. Partikel ‘-lah’ mempertahankan penekanan demonstratif pada ‘anak ini’, sedangkan kapitalisasi pronomina ‘-Nya’ mengikuti kebiasaan baku untuk rujukan kepada Allah.
