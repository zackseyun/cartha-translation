  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: id
  text: Lalu mereka menyembelih[a] lembu jantan itu dan membawa anak laki-laki itu[b] kepada Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membunuh.” Kata kerja Ibrani ini dapat diterjemahkan secara lebih umum, tetapi “menyembelih” lebih sesuai dengan konteks kurban.
    reason: lexical_alternative
  - marker: b
    text: Atau “anak itu.” Kata Ibrani na‘ar dapat menunjuk pada anak laki-laki, anak, atau pemuda, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: Lalu mereka menyembelih
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa. Dalam konteks persembahan, “menyembelih” lebih tepat daripada “membunuh” dan tetap alami dalam bahasa Indonesia.
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר lazim menunjuk pada lembu jantan, khususnya dalam konteks kurban. Kata penunjuk “itu” menyampaikan fungsi artikel Ibrani secara alami.
- source_word: וַיָּבִיאוּ
  choice: dan membawa
  rationale: Wayyiqtol kedua meneruskan rangkaian tindakan. Koordinasi dengan “dan” menghasilkan narasi Indonesia yang lancar.
- source_word: הַנַּעַר
  choice: anak laki-laki itu
  rationale: נַעַר dapat berarti anak, anak laki-laki, atau pemuda. Karena Samuel masih sangat muda dalam konteks ini, “anak laki-laki” paling sesuai tanpa menentukan usia secara lebih sempit daripada teks.
- source_word: אֶל עֵלִי
  choice: kepada Eli
  rationale: אֶל menyatakan gerak menuju seseorang; “kepada Eli” merupakan padanan Indonesia yang langsung dan wajar.
theological_decisions:
- issue: Nuansa kurban dalam tindakan penyembelihan
  choice: Menggunakan “menyembelih” untuk mempertahankan latar persembahan yang tersirat.
  alternative: Menggunakan istilah lebih umum, “membunuh”.
  rationale: Konteks langsungnya adalah ibadah dan persembahan di Silo. “Menyembelih” mempertahankan nuansa kurban tanpa menambahkan keterangan yang tidak terdapat dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam teks Ibrani, sedangkan catatan kaki menjaga alternatif leksikal yang sungguh ada.
