base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: id
  text: Tetapi Hana menjawab, “Bukan begitu, tuanku. Aku seorang perempuan yang sangat susah hati.[a] Aku tidak minum anggur ataupun minuman memabukkan.[b] Sebaliknya, aku mencurahkan jiwaku di hadapan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang perempuan yang berat rohnya”; maksudnya, seorang perempuan yang mengalami kesusahan batin.'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah minuman beralkohol selain anggur, bukan khusus minuman keras hasil penyulingan.
    reason: historical_lexical_clarification
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: Tetapi Hana menjawab
  rationale: Bentuk ganda ‘menjawab dan berkata’ merupakan formula naratif Ibrani. Dalam bahasa Indonesia, ‘menjawab’ sudah mencakup tindakan berkata, sedangkan ‘tetapi’ menyatakan sanggahan Hana terhadap tuduhan Eli.
- source_word: לֹא אֲדֹנִי
  choice: Bukan begitu, tuanku
  rationale: לֹא menyangkal anggapan Eli, bukan sekadar menjawab pertanyaan ya-tidak. אֲדֹנִי adalah sapaan hormat kepada Eli; ‘tuanku’ mempertahankan unsur penghormatan dan bentuk posesif tanpa menjadikannya gelar ilahi.
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: seorang perempuan yang tertekan batinnya
  rationale: Ungkapan ini menggambarkan tekanan, kepedihan, atau kesusahan batin. ‘Tertekan batinnya’ menyampaikan maksud kontekstual dengan bahasa Indonesia masa kini tanpa menafsirkannya sebagai watak keras kepala.
- source_word: וְיַיִן וְשֵׁכָר
  choice: anggur ataupun minuman memabukkan
  rationale: יַיִן adalah anggur, sedangkan שֵׁכָר menunjuk minuman beralkohol selain anggur. ‘Minuman memabukkan’ menghindari kesan keliru bahwa yang dimaksud pasti minuman hasil penyulingan modern.
- source_word: לֹא שָׁתִיתִי
  choice: Aku tidak minum
  rationale: Bentuk perfektif menyangkal bahwa Hana telah meminum kedua jenis minuman itu. Dalam konteks percakapan langsung, bentuk Indonesia ‘tidak minum’ menyatakannya secara alami.
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: aku mencurahkan jiwaku
  rationale: Terjemahan ini mempertahankan citra konkret ‘mencurahkan’ dan נֶפֶשׁ ‘jiwa’, yaitu pengungkapan diri yang mendalam dalam doa, tanpa menggantinya secara interpretatif dengan ‘isi hati’.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menggambarkan tindakan yang dilakukan dalam hadirat Allah, dan nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. ‘Yahweh’ mempertahankan nama pribadi ilahi dan tidak mengubahnya menjadi gelar.
- issue: Makna ungkapan ‘mencurahkan jiwaku’
  choice: Mempertahankan metafora tanpa menjelaskan jenis atau hasil doanya
  alternative: mengungkapkan isi hatiku kepada Yahweh
  rationale: Metafora Ibrani menyampaikan penyerahan dan pengungkapan batin yang mendalam, tetapi ayat ini tidak merumuskan doktrin teknis tentang jiwa atau mekanisme doa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Tuanku’ mempertahankan kesopanan sosial Hana terhadap Eli. ‘Bukan begitu’ dibuat idiomatis sebagai sanggahan, sementara ‘mencurahkan jiwaku’ mempertahankan citra puitis Ibrani. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
