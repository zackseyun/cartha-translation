  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: id
  text: Setelah menyapihnya, Hana membawanya naik bersamanya, bersama tiga ekor sapi jantan[a], satu efa tepung, dan sekirbat anggur. Ia membawa anak itu ke rumah Yahweh di Silo. Anak itu masih kecil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “tiga ekor sapi jantan”; beberapa saksi kuno dan penafsir membaca “seekor sapi jantan berumur tiga tahun”.
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: Hana membawanya naik bersama dia
  rationale: Bentuk kausatif dari עלה mempertahankan nuansa perjalanan naik menuju tempat kudus; nama Hana ditampilkan untuk memperjelas subjek dalam bahasa Indonesia, sedangkan עִמָּהּ tetap dinyatakan.
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: Setelah menyapih anak itu
  rationale: Dalam konteks ini גמל berarti menyapih. 'Setelah' menyampaikan hubungan waktu secara alami dan sesuai dengan tindakan yang sudah selesai.
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: dengan membawa tiga ekor sapi jantan
  rationale: Teks Masoret secara langsung berbunyi 'tiga sapi jantan'. Tambahan 'membawa' membuat hubungan pengiringnya alami dalam bahasa Indonesia tanpa mengubah isi.
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: satu efa tepung
  rationale: Nama ukuran kuno אֵיפָה dipertahankan sebagai 'efa' dan קֶמַח diterjemahkan 'tepung'.
- source_word: וְנֵבֶל יַיִן
  choice: satu kirbat berisi anggur
  rationale: נֵבֶל di sini menunjuk pada wadah anggur, lazimnya kirbat. 'Berisi anggur' lebih jelas dan alami daripada ungkapan harfiah 'kirbat anggur'.
- source_word: וַתְּבִאֵהוּ בֵית יְהוָה שִׁלוֹ
  choice: Ia membawa anak itu ke rumah Yahweh di Silo
  rationale: Hifil בוא berarti 'membawa'; nama perjanjian יְהוָה ditransliterasikan 'Yahweh', dan שִׁלוֹ menjadi 'Silo' sesuai bentuk Indonesia yang lazim.
- source_word: וְהַנַּעַר נָעַר
  choice: Saat itu anak tersebut masih kecil
  rationale: Pengulangan נַעַר menekankan usia anak yang masih muda. Ungkapan Indonesia ini menyampaikan tekanannya secara alami tanpa terjemahan kaku 'anak itu seorang anak'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Jumlah dan usia hewan persembahan
  choice: tiga ekor sapi jantan
  alternative: seekor sapi jantan berumur tiga tahun
  rationale: Teks Masoret berbunyi פָרִים שְׁלֹשָׁה, 'tiga sapi jantan'. Bacaan alternatif yang didukung sejumlah saksi kuno dicatat tanpa menggantikan bacaan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar daftar bawaan dan tujuan perjalanan mudah dipahami. Istilah kuno 'efa' dan 'kirbat' dipertahankan karena menunjuk ukuran dan wadah khusus dalam dunia teks.
