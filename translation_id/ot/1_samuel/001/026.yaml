  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: id
  text: Lalu perempuan itu berkata, “Mohon, tuanku, demi hidupmu, tuanku, akulah perempuan yang dahulu berdiri di dekatmu di tempat ini untuk berdoa kepada Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: Mohon
  rationale: Partikel permohonan dalam sapaan langsung; “Mohon” menyampaikan kesungguhan dan rasa hormat secara alami.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan penuh hormat kepada Eli, bukan gelar ilahi; “Tuanku” mempertahankan jarak sosial dalam teks.
- source_word: חֵי נַפְשְׁךָ
  choice: Demi hidup Tuanku
  rationale: Ungkapan sumpah yang secara harfiah berkaitan dengan hidup/nyawa orang yang disapa. Bentuk ini mempertahankan citra sumber dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הָאִשָּׁה הַנִּצֶּבֶת
  choice: perempuan yang pernah berdiri
  rationale: Nomina tentu mengidentifikasi Hana sebagai perempuan tertentu yang dahulu berada di sana; partisipnya menyatakan keadaan berdiri pada peristiwa sebelumnya.
- source_word: עִמְּכָה בָּזֶה
  choice: di sini di dekat Tuanku
  rationale: Dalam konteks ini, עִם menunjukkan kedekatan tempat, sedangkan בָּזֶה menunjuk lokasi yang sama dengan kejadian sebelumnya.
- source_word: לְהִתְפַּלֵּל
  choice: untuk berdoa
  rationale: Infinitif menyatakan tujuan atau kegiatan Hana ketika berdiri di tempat itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi Allah.
- issue: Daya ungkapan חֵי נַפְשְׁךָ
  choice: Demi hidup Tuanku
  alternative: Selama Tuanku hidup / sesungguhnya, Tuanku
  rationale: Pilihan utama mempertahankan bentuk sumpah dan rujukan pada hidup orang yang disapa tanpa mengubahnya menjadi sekadar penegasan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Tuanku” dipakai untuk mempertahankan penghormatan Hana kepada Eli, sementara susunan kalimat dibuat alami tanpa menghilangkan pengulangan sapaan dalam bahasa Ibrani.
