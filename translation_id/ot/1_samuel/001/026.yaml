  naturalness: Teks draf dapat dipahami, tetapi “Mohon, Tuanku!” dan “di sini di dekat Tuanku” terdengar kaku dalam bahasa Indonesia modern. Susunan yang direvisi mempertahankan register khidmat dan lebih mengalir.
  terminology: “Tuanku” cocok sebagai sapaan hormat non-ilahi kepada Eli, dan “Yahweh” tepat untuk יהוה. Huruf kecil pada “tuanku” sesuai penggunaan sapaan umum dalam kalimat, tanpa mengubah hormatnya.
