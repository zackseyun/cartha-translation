source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: id
  text: Sesudah Hana makan dan minum di Silo, ia bangkit. Sementara itu, Imam Eli sedang duduk di kursi dekat tiang pintu bait Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat suci Yahweh.”
    reason: Alternatif leksikal bagi הֵיכַל; dalam konteks ini istilah tersebut dapat merujuk pada bangunan atau pusat ibadah di Silo.
lexical_decisions:
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Kata kerja קום menyatakan bahwa Hana bangun atau berdiri untuk bertindak. “Bangkit” ringkas, wajar dalam narasi, dan mempertahankan gerak tindakan tanpa menentukan apakah ia sekadar berdiri atau langsung pergi.
- source_word: אַחֲרֵי אָכְלָה ... וְאַחֲרֵי שָׁתֹה
  choice: Sesudah makan dan minum
  rationale: Dua frasa temporal paralel ini tidak menyatakan subjek secara tegas dalam bentuk yang mudah dipertahankan dalam bahasa Indonesia. Rumusan tanpa pronomina menjaga kemungkinan bahwa Hana sendiri atau rombongan keluarga yang makan dan minum, sekaligus terdengar alami.
- source_word: בְשִׁלֹה
  choice: di Silo
  rationale: Preposisi בְּ di sini menunjukkan lokasi; “di Silo” merupakan padanan langsung dan alami.
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: Sementara itu, Imam Eli sedang duduk
  rationale: Klausa ini memberi latar keadaan, bukan sekadar tindakan berikutnya. “Sementara itu” dan bentuk progresif “sedang duduk” menyampaikan fungsi sirkumstansial serta aspek duratif partisipel יֹשֵׁב.
- source_word: עַל הַכִּסֵּא
  choice: di kursi
  rationale: כִּסֵּא dapat berarti tempat duduk, kursi, atau takhta. Dalam konteks ini “kursi” wajar dan tidak memasukkan nuansa kerajaan yang tidak dituntut teks.
- source_word: עַל מְזוּזַת
  choice: dekat tiang pintu
  rationale: מְזוּזָה berarti tiang pintu. עַל dalam konteks lokasi paling alami diterjemahkan “dekat”, bukan secara harfiah “di atas”.
- source_word: הֵיכַל יְהוָה
  choice: bait Yahweh
  rationale: הֵיכָל menunjuk bangunan suci atau bait. “Bait” merupakan istilah Indonesia yang ringkas dan mapan, sedangkan alternatif “tempat suci” dicatat karena konteksnya adalah pusat ibadah di Silo sebelum pembangunan Bait Salomo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga sifatnya sebagai nama diri dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: “Yahweh” mempertahankan nama diri dalam teks sumber tanpa menggantinya dengan gelar atau memasukkan klaim teologis tambahan.
- issue: Makna הֵיכַל pada pusat ibadah di Silo
  choice: bait
  alternative: tempat suci
  rationale: “Bait” menyampaikan arti bangunan suci yang dikandung הֵיכָל. Karena tempat ini mendahului Bait Salomo dan istilah sumber juga dapat berarti tempat suci, alternatif tersebut dipertahankan dalam catatan kaki.
- issue: Subjek tindakan makan dan minum
  choice: tidak dinyatakan secara eksplisit
  alternative: Hana sendiri; mereka sekeluarga
  rationale: Bentuk Ibrani dan konteks memungkinkan lebih dari satu pemahaman. Bahasa Indonesia dapat mempertahankan ketidakjelasan itu secara alami melalui “sesudah makan dan minum”, sehingga tidak perlu memutuskan subjek secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Sementara itu” dipakai untuk menandai keterangan latar; susunan tanpa subjek pada “makan dan minum” sengaja mempertahankan ambiguitas sumber. Istilah “Imam Eli” dipilih sebagai bentuk yang alami dan mudah dipahami.
