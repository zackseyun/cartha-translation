  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: id
  text: Tetapi kepada Hana ia biasa memberikan satu bagian istimewa[a], sebab ia mengasihi Hana, dan Yahweh telah menutup rahimnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini sulit dan secara harfiah kira-kira berarti “satu bagian [dari] dua wajah/hidung”. Ungkapan ini dapat berarti “bagian ganda” atau “bagian istimewa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: Tetapi kepada Hana
  rationale: Konjungsi וּ secara harfiah berarti 'dan', tetapi dalam konteks ini menandai kontras dengan bagian-bagian yang diberikan kepada Penina dan anak-anaknya pada ayat sebelumnya.
- source_word: יִתֵּן
  choice: ia selalu memberikan
  rationale: Bentuk imperfek dalam konteks kebiasaan masa lampau menunjuk pada tindakan Elkana yang berulang setiap kali mempersembahkan kurban.
- source_word: מָנָה אַחַת אַפָּיִם
  choice: satu bagian istimewa
  rationale: Ungkapan Ibrani ini sulit dan secara harfiah kira-kira berbunyi 'satu bagian dengan dua wajah'. 'Bagian istimewa' menghasilkan bahasa Indonesia yang wajar tanpa memastikan tafsiran 'dua kali lipat'; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: כִּי אֶת־חַנָּה אָהֵב
  choice: sebab ia mengasihi Hana
  rationale: כִּי memperkenalkan alasan perlakuan khusus Elkana kepada Hana, sedangkan אָהֵב menyatakan kasihnya secara langsung.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, sesuai bukti teks sumber dan lapisan konsultasi yang diperbarui.
- source_word: סָגַר רַחְמָהּ
  choice: telah menutup kandungannya
  rationale: Ungkapan ini menyatakan bahwa Yahweh membuat Hana tidak dapat mengandung; bentuk 'telah menutup' menyampaikan keadaan latar yang sudah berlangsung.
theological_decisions:
- issue: Hubungan antara kasih Elkana dan ketidaksuburan Hana
  choice: walaupun Yahweh telah menutup kandungannya
  alternative: dan Yahweh telah menutup kandungannya
  rationale: 'Teks Ibrani memakai konjungsi biasa וְ, sehingga hubungan logisnya tidak dinyatakan secara tegas. Dalam konteks, hubungan konsesif paling mungkin: Elkana mengasihi Hana meskipun ia mandul. ''Walaupun'' menyampaikan hubungan tersebut secara alami, tetapi bacaan lebih harfiah dicatat sebagai alternatif.'
- issue: Penyebutan pelaku yang menutup kandungan Hana
  choice: Yahweh telah menutup kandungannya
  alternative: kandungannya tertutup
  rationale: Teks secara eksplisit menyebut Yahweh sebagai subjek. Terjemahan mempertahankan pernyataan teologis itu tanpa mengurangi atau memperluasnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Ia selalu memberikan' menyampaikan tindakan berulang pada masa lampau. Istilah 'kandungan' dipilih karena mudah dipahami dan sesuai dengan konteks kemampuan mengandung.
