id: 1SA.1.3
reference: 1 Samuel 1:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: id
  text: Tahun demi tahun, orang itu pergi dari kotanya ke Silo untuk sujud menyembah dan mempersembahkan kurban kepada Yahweh Bala Tentara.[a] Di sana, kedua putra Eli, yaitu Hofni dan Pinehas, adalah imam-imam Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional, “TUHAN semesta alam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָלָה
  choice: pergi
  rationale: Dalam konteks narasi ini, bentuk verba menyatakan kebiasaan pada masa lampau. Keterangan “tahun demi tahun” sudah menyampaikan aspek habitual, sehingga “pergi” terdengar alami tanpa menghilangkan maknanya. Unsur harfiah “naik” tidak dipertahankan karena dalam bahasa Indonesia tujuan ziarah lebih alami dinyatakan dengan “pergi”.
- source_word: הָאִישׁ הַהוּא
  choice: orang itu
  rationale: Demonstratif הַהוּא menunjuk kembali secara khusus kepada Elkana yang telah diperkenalkan.
- source_word: מֵעִירוֹ
  choice: dari kotanya
  rationale: עִיר berarti kota atau permukiman; “kotanya” merupakan padanan langsung dan wajar.
- source_word: מִיָּמִים יָמִימָה
  choice: tahun demi tahun
  rationale: Ungkapan idiomatis ini menunjukkan kejadian yang berulang setiap tahun.
- source_word: לְהִשְׁתַּחֲוֺת
  choice: untuk sujud menyembah
  rationale: Kata ini secara konkret menunjuk pada tindakan membungkuk atau bersujud, dan dalam konteks peribadatan menyatakan penyembahan. Gabungan ini mempertahankan tindakan jasmani sekaligus fungsinya.
- source_word: וְלִזְבֹּחַ
  choice: dan mempersembahkan kurban
  rationale: Dalam konteks ibadah, verba ini berarti menyembelih atau mempersembahkan kurban. Ungkapan ini jelas dan alami bagi pembaca modern.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: צְבָאוֹת
  choice: Panglima Bala Tentara
  rationale: Bentuk jamak צְבָאוֹת berarti bala tentara atau pasukan. Dalam rangkaian gelar ilahi, “Panglima Bala Tentara” menyampaikan bahwa Yahweh memerintah pasukan-pasukan itu, dengan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בְּשִׁלֹה
  choice: ke Silo
  rationale: Preposisi Ibrani menandai lokasi peribadatan; karena verba geraknya berbahasa Indonesia menuntut tujuan, “ke Silo” paling alami.
- source_word: וְשָׁם
  choice: Di sana
  rationale: Padanan lokatif langsung yang menghubungkan klausa kedua dengan Silo.
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: kedua anak Eli
  rationale: Mempertahankan penekanan Ibrani pada kedua anak tersebut.
- source_word: חָפְנִי וּפִנְחָס
  choice: Hofni dan Pinehas
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.
- source_word: כֹּהֲנִים לַיהוָה
  choice: melayani sebagai imam bagi Yahweh
  rationale: Teks Ibrani berupa frasa nominal “imam-imam bagi Yahweh”. Penambahan “melayani sebagai” membentuk kalimat Indonesia yang alami tanpa menambahkan jabatan atau tindakan baru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Transliterasi “Yahweh” mempertahankan nama diri dalam teks sumber dan membedakannya dari gelar umum.
- issue: Penerjemahan gelar יְהוָה צְבָאוֹת
  choice: Yahweh Panglima Bala Tentara
  alternative: Yahweh Bala Tentara; TUHAN semesta alam; TUHAN Yang Mahakuasa
  rationale: צְבָאוֹת secara leksikal merujuk pada pasukan atau bala tentara. Bentuk “Panglima Bala Tentara” menjelaskan hubungan gelar itu secara alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah dan sebutan tradisional. “Yang Mahakuasa” tidak dipilih karena lebih interpretatif daripada leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah kultis “sujud menyembah”, “kurban”, dan “imam” mempertahankan warna konteks ibadah. Penanda catatan kaki [a] ditempatkan tepat setelah gelar ilahi yang dijelaskannya.
