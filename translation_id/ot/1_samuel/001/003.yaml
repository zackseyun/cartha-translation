  naturalness: Teks pada umumnya baku, jelas, dan bernada sesuai. “Yahweh Bala Tentara” merupakan gelar yang tetap dapat dipahami dalam ragam Alkitab Indonesia modern. “Putra” dan “imam-imam” memberi pembacaan yang alami serta mempertahankan bentuk jamak predikatif Ibrani.
  terminology: “Yahweh,” “Silo,” “Hofni,” “Pinehas,” dan “kurban” sesuai. “Yahweh Bala Tentara” lebih setia daripada “Yahweh Panglima Bala Tentara”; alternatif tradisional dapat tetap dicatat di catatan kaki.
