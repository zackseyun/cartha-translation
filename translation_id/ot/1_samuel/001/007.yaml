  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: id
  text: 'Demikianlah hal itu berlangsung tahun demi tahun[a]: setiap kali Hana pergi ke rumah Yahweh[b], Penina menyakiti hati Hana, sehingga Hana menangis dan tidak makan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Begitulah yang dilakukannya tahun demi tahun.” Kata kerja Ibraninya berbentuk maskulin tunggal, sehingga dapat menunjuk kepada Elkana, tetapi kalimat ini juga dapat dipahami sebagai rangkuman keadaan yang berulang.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “di rumah Yahweh.” Dalam konteks tindakan pergi naik, ungkapan itu menyatakan tujuan, sehingga diterjemahkan “ke rumah Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: Demikianlah hal itu berlangsung
  rationale: Bentuk kata kerjanya secara harfiah maskulin tunggal, ‘ia berbuat demikian’, tetapi subjeknya tidak disebutkan dan kalimat ini dapat merangkum keadaan yang terus berulang. Pilihan ini mempertahankan fungsi rangkuman tanpa memaksakan subjek; bacaan yang menunjuk kepada Elkana dicatat dalam catatan kaki.
- source_word: שָׁנָה בְשָׁנָה
  choice: tahun demi tahun
  rationale: Ungkapan distributif Ibrani ini menyatakan kejadian yang berulang setiap tahun.
- source_word: מִדֵּי עֲלֹתָהּ
  choice: setiap kali Hana pergi
  rationale: מִדֵּי dengan infinitif menyatakan perulangan, ‘setiap kali’. Sufiks feminin menunjuk kepada Hana; namanya dinyatakan demi kejelasan dalam bahasa Indonesia.
- source_word: בְּבֵית יְהוָה
  choice: ke rumah Yahweh
  rationale: Walaupun preposisinya secara harfiah berarti ‘di/pada’, bersama gagasan ‘pergi naik’ konteksnya menunjukkan tujuan. Bahasa Indonesia secara alami memakai ‘ke’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: כֵּן תַּכְעִסֶנָּה
  choice: Penina menyakiti hatinya
  rationale: Bentuk Hifil כעס berarti membuat seseorang gusar atau menyakitkan hatinya. Subjek feminin dipahami dari konteks sebagai Penina; namanya dinyatakan untuk menghindari kerancuan pronomina Indonesia.
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: lalu Hana menangis dan tidak mau makan
  rationale: Dalam kerangka kebiasaan tahunan, bentuk-bentuk ini menyatakan akibat yang berulang. ‘Tidak mau makan’ menyampaikan penolakan makan akibat kesedihan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Subjek maskulin pada יַעֲשֶׂה
  choice: Dipahami sebagai rangkuman impersonal tentang keadaan yang berulang
  alternative: 'Subjeknya adalah Elkana: ‘Begitulah yang dilakukannya tahun demi tahun’'
  rationale: Bentuk gramatikalnya maskulin tunggal mendukung rujukan kepada Elkana, tetapi subjek tidak dinyatakan dan susunan klausa juga dapat berfungsi sebagai rangkuman idiomatis. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. Nama Hana dan Penina dinyatakan untuk memperjelas rujukan pronomina feminin yang mudah menjadi rancu dalam bahasa Indonesia. Irama kalimat mempertahankan pola kejadian tahunan dan akibat emosionalnya.
