id: 1SA.1.1
reference: 1 Samuel 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: id
  text: Ada seorang laki-laki dari Ramataim-Zofim, dari daerah perbukitan Efraim. Namanya Elkana, anak Yeroham, anak Elihu, anak Tohu, anak Zuf, orang Efrata[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “orang Efraim.” Teks Ibrani berbunyi “orang Efrata,” tetapi dalam konteks ini sebutan tersebut mungkin berfungsi sebagai penanda wilayah yang berkaitan dengan Efraim.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: Ada
  rationale: Bentuk naratif dari היה membuka kisah dengan memperkenalkan keberadaan seorang tokoh. 'Ada' alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak tersurat.
- source_word: אִישׁ אֶחָד
  choice: seorang laki-laki
  rationale: Ungkapan ini memperkenalkan seorang tokoh tertentu yang kemudian langsung disebutkan namanya. 'Seorang laki-laki' menyampaikan fungsi tersebut secara alami tanpa ungkapan 'seorang tertentu' yang kaku.
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: dari Ramataim-Zofim
  rationale: Dipertahankan sebagai nama tempat majemuk melalui transliterasi, tanpa memaksakan tafsiran atas unsur-unsur internal nama itu.
- source_word: מֵהַר אֶפְרָיִם
  choice: dari daerah perbukitan Efraim
  rationale: Dalam ungkapan kewilayahan, הַר menunjuk kawasan pegunungan atau perbukitan, bukan satu gunung tertentu. 'Daerah perbukitan' jelas dan wajar bagi pembaca Indonesia.
- source_word: וּשְׁמוֹ
  choice: Namanya
  rationale: Menyampaikan klausa Ibrani secara alami. Pemisahan menjadi kalimat baru menjaga alur pengenalan tokoh tanpa menghasilkan rangkaian klausa yang berat.
- source_word: אֶלְקָנָה
  choice: Elkana
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן ... בֶּן ... בֶּן ... בֶן
  choice: anak ... anak ... anak ... anak
  rationale: בן dalam rangkaian silsilah secara langsung berarti 'anak'. Walaupun silsilah Ibrani kadang melompati generasi, konteks ini tidak menuntut penggeneralan menjadi 'keturunan'.
- source_word: אֶפְרָתִי
  choice: seorang Efrata
  rationale: Bentuk Ibrani secara formal menunjuk orang Efrata. Karena dalam konteks ini istilah tersebut mungkin dipakai sebagai sebutan regional bagi orang Efraim, bentuk formal dipertahankan dalam teks dan alternatifnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Sebutan etnis atau geografis אֶפְרָתִי
  choice: seorang Efrata
  alternative: seorang Efraim
  rationale: Persoalan ini terutama bersifat leksikal dan geografis, tetapi berpengaruh pada pemahaman asal-usul Elkana. Bentuk Ibrani mendukung 'orang Efrata', sedangkan konteks tempat tinggal di daerah perbukitan Efraim memungkinkan pemahaman 'orang Efraim'. Ambiguitas itu tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang mudah dibaca; susunan silsilah dan ambiguitas sebutan geografis dipertahankan.
