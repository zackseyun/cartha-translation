base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: id
  text: Pagi-pagi mereka bangun dan sujud di hadapan Yahweh. Kemudian mereka kembali ke rumah mereka di Rama. Elkana mengenal Hana, istrinya,[a] dan Yahweh mengingat Hana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengenal”; sebuah ungkapan halus yang lazim dalam bahasa Ibrani untuk hubungan seksual antara suami dan istri.
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, Yahweh “mengingat” seseorang sering berarti lebih dari sekadar teringat; ungkapan ini dapat menyiratkan bahwa Ia berpaling kepadanya dengan perhatian setia dan bertindak baginya secara nyata.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: Pagi-pagi mereka bangun
  rationale: Gabungan verba שׁכם dan בַבֹּקֶר menekankan bahwa mereka bangun pada pagi hari sekali. Ungkapan “pagi-pagi” alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: dan sujud di hadapan Yahweh
  rationale: השׁתחוה menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan. “Sujud” mempertahankan tindakan jasmaniah dan nuansa penyembahannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: Kemudian mereka pulang dan tiba di rumah mereka di Rama
  rationale: Terjemahan ini mempertahankan kedua verba berurutan, yakni kembali dan tiba, serta memahami bentuk berarah הָרָמָתָה sebagai tujuan perjalanan ke Rama.
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: Elkana mengenal Hana, istrinya
  rationale: ידע secara harfiah berarti “mengenal”, tetapi di sini merupakan ungkapan halus Ibrani untuk hubungan seksual dalam perkawinan. Ungkapan sumber dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: Yahweh mengingat Hana
  rationale: זכר dipertahankan sebagai “mengingat” agar nuansa perhatian ilahi yang berlanjut pada tindakan tidak dipersempit menjadi sekadar hasil tertentu yang belum disebutkan dalam ayat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Apakah ungkapan halus seksual dibuat eksplisit
  choice: Mempertahankan “mengenal” dalam teks utama dan menjelaskannya dalam catatan kaki
  alternative: berhubungan seksual dengan atau tidur dengan
  rationale: Bahasa Ibrani sengaja memakai ungkapan halus ידע. Mempertahankannya menjaga corak sastra dan kesantunan teks tanpa menyembunyikan maknanya dari pembaca karena tersedia catatan kaki.
- issue: Makna bahwa Yahweh “mengingat” Hana
  choice: Mempertahankan kata “mengingat”
  alternative: memperhatikan Hana atau mengabulkan permohonannya
  rationale: Dalam narasi Ibrani, ingatan ilahi sering menyiratkan perhatian yang efektif, tetapi ayat ini belum menyatakan secara eksplisit tindakan atau hasil akhirnya. Terjemahan tidak mendahului alur teks.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan corak naratif yang khidmat dan mudah dipahami. Nama orang dan tempat mengikuti bentuk Indonesia yang lazim: Elkana, Hana, dan Rama. Pengulangan gerak “pulang dan tiba” dipertahankan karena mencerminkan urutan verba dalam bahasa Ibrani.'
