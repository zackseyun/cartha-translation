reference: 1 Samuel 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/ל/וֹ֙ שְׁתֵּ֣י נָשִׁ֔ים שֵׁ֤ם אַחַת֙ חַנָּ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פְּנִנָּ֑ה וַ/יְהִ֤י לִ/פְנִנָּה֙ יְלָדִ֔ים וּ/לְ/חַנָּ֖ה אֵ֥ין יְלָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: id
  text: Ia mempunyai dua istri. Yang seorang bernama Hana dan yang kedua bernama Penina. Penina mempunyai anak-anak, tetapi Hana tidak mempunyai anak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹו
  choice: Ia mempunyai
  rationale: Konstruksi kepunyaan dengan preposisi, secara harfiah 'dan padanya', diungkapkan secara wajar dalam bahasa Indonesia sebagai 'ia mempunyai'; konjungsi diserap ke dalam alur kalimat.
- source_word: שְׁתֵּי נָשִׁים
  choice: dua istri
  rationale: Dalam konteks rumah tangga ini, נָשִׁים berarti para istri, bukan sekadar perempuan.
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: Yang seorang bernama ... dan yang kedua bernama
  rationale: Ungkapan ini mempertahankan kesejajaran formula penamaan Ibrani sambil tetap alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: חַנָּה
  choice: Hana
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: פְּנִנָּה
  choice: Penina
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: Penina mempunyai anak-anak
  rationale: Klausa eksistensial-kepunyaan diterjemahkan secara idiomatis sebagai kepunyaan; יְלָדִים adalah istilah umum untuk anak-anak.
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: tetapi Hana tidak mempunyai anak
  rationale: אֵין menyatakan ketiadaan. 'Tetapi' memperjelas pertentangan yang tersirat dalam penjajaran kedua klausa tanpa menambahkan isi baru.
