base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: id
  text: Janganlah menganggap hambamu sebagai perempuan bejat[a], sebab karena banyaknya keluh kesah[b] dan kekesalanku, aku telah berbicara sampai sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan ketidakbergunaan,” sebuah idiom bagi perempuan yang secara moral tercela atau tidak terhormat.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “keluh kesah” juga dapat berarti perenungan atau curahan hati yang resah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: Janganlah menganggap ... sebagai
  rationale: Gabungan ini bersifat idiomatis dan berarti memperlakukan atau menilai seseorang sebagai sesuatu, bukan secara harfiah ‘memberikan di hadapan’.
- source_word: אֲמָתְךָ
  choice: hambamu ini
  rationale: Ungkapan ini mempertahankan sebutan diri Hana yang rendah hati; bentuk feminin sudah jelas dari konteks dan frasa berikutnya.
- source_word: בַּת בְּלִיָּעַל
  choice: perempuan dursila
  rationale: Secara harfiah ‘anak perempuan kebejatan/ketidakbergunaan’; idiom ini menunjuk kepada perempuan yang secara moral tercela atau tidak terhormat. ‘Dursila’ menyampaikan penilaian moral tanpa terjemahan harfiah yang kaku.
- source_word: מֵרֹב
  choice: karena begitu banyak
  rationale: Menyampaikan nuansa sebab sekaligus besarnya luapan batin yang melatarbelakangi perkataan Hana.
- source_word: שִׂיחִי
  choice: keluh kesah
  rationale: Dalam konteks doa Hana yang penuh tekanan, kata ini menunjuk kepada curahan batin atau keluhan yang resah; ‘keluh kesah’ alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi kemarahan.
- source_word: וְכַעְסִי
  choice: dan kekesalanku
  rationale: Kata ini dapat menunjuk kepada kejengkelan, kepedihan, atau tekanan batin akibat keadaan yang menyusahkan. ‘Kekesalan’ mempertahankan unsur kegundahan tanpa menyiratkan bahwa Hana memprovokasi orang lain.
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: Aku berbicara sampai sekarang
  rationale: Ungkapan waktu ini berarti sampai saat kini; bentuknya menjelaskan tindakan Hana yang berlangsung hingga Eli menegurnya.
theological_decisions:
- issue: Sifat sebutan בַּת בְּלִיָּעַל
  choice: perempuan dursila
  alternative: perempuan yang tidak berguna; perempuan jahat
  rationale: Pilihan ini mempertahankan bobot moral idiom Ibrani tanpa menjadikannya sebutan bagi tokoh adikodrati atau memasukkan penafsiran teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan yang hormat dan emosional. Susunan klausa terakhir dibuat alami dalam bahasa Indonesia, sementara hubungan sebab dan intensitas teks Ibrani tetap dipertahankan.
