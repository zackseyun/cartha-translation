  verdict: revise
  source_fidelity: 'Teks pada dasarnya setia pada Ibrani: Eli berbicara kepada Hana, menegurnya dengan pertanyaan temporal, lalu memerintahkannya menyingkirkan anggur. Terjemahan mempertahankan ambiguitas bentuk hitpael תִּשְׁתַּכָּרִין melalui catatan kaki dan tidak mempersempit makna menjadi hanya ‘menjadi mabuk’ atau hanya ‘berada dalam keadaan mabuk’.'
  naturalness: Frasa “akan terus mabuk” kurang alami dan ‘terus’ menambahkan penekanan duratif yang tidak perlu dalam bahasa Indonesia, khususnya setelah “Berapa lama lagi”. “Akan mabuk” lebih lancar, tetap sesuai dengan bentuk imperfek dalam pertanyaan teguran, dan ambiguitas leksikalnya telah dijaga oleh catatan kaki.
  terminology: “Eli,” “engkau,” “anggurmu,” dan “Jauhkanlah ... dari dirimu” sesuai register Alkitabiah baku modern. Perintah kedua mempertahankan citra Ibrani yang tidak lazim tanpa menafsirkan secara berlebihan sebagai pengaruh anggur atau sekadar menyingkirkan wadah minuman.
