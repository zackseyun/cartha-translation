translation:
  language: id
  text: Lalu Eli berkata kepadanya, “Berapa lama lagi engkau akan mabuk?[a] Jauhkanlah anggurmu dari dirimu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini dapat dipahami sebagai menjadi mabuk atau berada dalam keadaan mabuk.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “singkirkan anggurmu dari atasmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam bahasa Indonesia tanpa memberi urutan waktu yang terlalu tegas.
- source_word: אֵלֶיהָ
  choice: kepadanya
  rationale: Padanan langsung dan alami bagi preposisi dengan sufiks orang ketiga feminin tunggal.
- source_word: עֵלִי
  choice: Eli
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַד מָתַי
  choice: Berapa lama lagi
  rationale: Ungkapan idiomatis Indonesia yang menyampaikan pertanyaan temporal sekaligus nada teguran.
- source_word: תִּשְׁתַּכָּרִין
  choice: engkau akan terus mabuk
  rationale: Bentuk hitpael imperfek dapat menunjuk pada menjadi mabuk atau berada dalam keadaan mabuk; “terus mabuk” mempertahankan nuansa berlangsung dan tuduhan Eli tanpa memaksakan salah satu analisis.
- source_word: הָסִירִי
  choice: Jauhkanlah
  rationale: Imperatif feminin tunggal yang secara alami menyatakan perintah untuk menyingkirkan sesuatu dari diri sendiri.
- source_word: אֶת יֵינֵךְ
  choice: anggurmu
  rationale: Padanan langsung bagi frasa objek dengan sufiks orang kedua feminin tunggal.
- source_word: מֵעָלָיִךְ
  choice: dari dirimu
  rationale: Mempertahankan gambaran Ibrani “dari atas/pada dirimu” dalam bentuk Indonesia yang masih dapat dipahami, tanpa memastikan apakah yang dimaksud adalah minuman itu atau pengaruhnya.
