source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: id
  text: Namun Hana tidak ikut pergi, sebab ia berkata kepada suaminya, “Aku baru akan membawa anak itu setelah ia disapih. Lalu ia akan menghadap Yahweh[a] dan tinggal di sana untuk seterusnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut penguraian lain atau tradisi teks lain: “Lalu aku akan menghadap Yahweh, dan ia akan tinggal di sana untuk seterusnya.”'
    reason: alternative_reading
  - marker: b
    text: “Untuk seterusnya” di sini berarti bahwa Samuel dipersembahkan secara tetap untuk melayani Yahweh, yaitu sepanjang hidupnya.
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: tidak ikut pergi
  rationale: Dalam konteks ini עָלָה menunjuk pada perjalanan naik ke tempat suci di Silo. Ungkapan “tidak ikut pergi” terdengar alami dalam bahasa Indonesia dan menyatakan bahwa Hana tidak menyertai perjalanan keluarga tersebut.
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: sebab ia berkata kepada suaminya
  rationale: כִּי menjelaskan alasan Hana tidak pergi, sedangkan אִישׁ dengan sufiks dalam konteks ini berarti “suaminya”.
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: baru ... setelah anak itu disapih
  rationale: 'Konstruksi “baru ... setelah” secara alami mempertahankan daya pembatas עַד: Hana tidak akan membawanya sebelum penyapihan selesai. נַעַר di sini menunjuk kepada Samuel yang masih kecil.'
- source_word: וַהֲבִאֹתִיו
  choice: Aku ... akan membawa anak itu
  rationale: Bentuk ini menyatakan tindakan yang akan Hana lakukan sesudah Samuel disapih. Objek dinyatakan kembali sebagai “anak itu” agar kalimat Indonesia jelas.
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: Lalu ia akan menghadap Yahweh
  rationale: Bentuk Niphal ראה dalam ungkapan ibadah ini paling wajar berarti tampil atau menghadap di hadapan Allah. Subjeknya dipahami sebagai Samuel, sambil mencatat alternatif tekstual dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: וְיָשַׁב שָׁם
  choice: dan tinggal di sana
  rationale: ישׁב di sini menunjuk pada keberadaan Samuel yang berkelanjutan di tempat suci; “tinggal” jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַד עוֹלָם
  choice: untuk seterusnya
  rationale: Ungkapan ini menyatakan pengabdian yang bersifat tetap. Dalam konteks Samuel, maksud praktisnya adalah sepanjang hidupnya, bukan durasi tanpa akhir secara mutlak.
theological_decisions:
- issue: Subjek וְנִרְאָה, “akan menghadap”
  choice: 'Samuel: “ia akan menghadap Yahweh”'
  alternative: 'Hana: “aku akan menghadap Yahweh, dan ia akan tinggal di sana”'
  rationale: Teks Masoret sebagaimana ditandai paling wajar meneruskan Samuel sebagai subjek setelah Hana membawanya, dan verba tunggal berikutnya juga menunjuk kepadanya. Namun, karena tradisi teks atau penguraian lain mendukung Hana sebagai subjek verba pertama, alternatif itu dipertahankan dalam catatan kaki.
- issue: Makna עַד עוֹלָם
  choice: “untuk seterusnya,” yakni pengabdian tetap sepanjang hidup Samuel
  alternative: “selamanya” dalam arti durasi mutlak tanpa akhir
  rationale: Dalam konteks nazar dan pelayanan Samuel, ungkapan tersebut menunjuk pada pengabdian permanen selama hidupnya. Terjemahan utama mempertahankan keluasan idiom tanpa menyatakan bahwa hidup duniawinya tidak pernah berakhir.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “baru ... setelah” mempertahankan penekanan bahwa Hana tidak akan membawa Samuel sebelum ia disapih. Nama Yahweh dipertahankan, dan ambiguitas tekstual mengenai subjek “menghadap” dicatat tanpa dipaksakan ke dalam teks utama.
