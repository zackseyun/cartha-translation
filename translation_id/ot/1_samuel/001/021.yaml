  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: id
  text: Lalu Elkana pergi bersama seisi rumahnya untuk mempersembahkan kepada Yahweh kurban tahunan dan menunaikan nazarnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan nazarnya.” Dalam bahasa Ibrani, kata kerja “mempersembahkan” dipahami juga untuk bagian ini; ungkapan itu dapat dipahami sebagai persembahan yang berkaitan dengan nazarnya, atau sebagai pelaksanaan nazarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi naik
  rationale: Kata עלה berarti ‘naik’ atau ‘pergi naik’. Dalam konteks perjalanan menuju tempat ibadah di Silo, ungkapan ini mempertahankan gambaran perjalanan ziarah tanpa memakai bentuk harfiah yang kaku.
- source_word: הָאִישׁ אֶלְקָנָה
  choice: Elkana
  rationale: Secara harfiah frasa ini berbunyi ‘orang itu, Elkana’. Dalam bahasa Indonesia, nama Elkana sudah cukup untuk mengidentifikasi pelaku; penghilangan ‘orang itu’ menghasilkan kalimat yang lebih alami tanpa mengubah acuannya.
- source_word: וְכָל־בֵּיתוֹ
  choice: bersama seluruh keluarganya
  rationale: בַּיִת di sini menunjuk kepada seisi rumah atau rumah tangga, bukan bangunan. ‘Seluruh keluarganya’ jelas dan alami bagi pembaca Indonesia modern.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: untuk mempersembahkan kepada Yahweh
  rationale: זבח dalam konteks ibadah berarti mempersembahkan kurban. Objek ‘kurban tahunan’ melengkapi verba ini, sehingga ‘mempersembahkan’ terdengar alami dan tetap mempertahankan arah persembahan kepada Yahweh.
- source_word: זֶבַח הַיָּמִים
  choice: kurban tahunan
  rationale: Ungkapan harfiah ‘kurban hari-hari’ menunjuk pada kurban yang dipersembahkan secara berkala setiap tahun dalam konteks ayat ini.
- source_word: וְאֶת־נִדְרוֹ
  choice: dan menunaikan nazarnya
  rationale: Teks Ibrani secara ringkas hanya mengoordinasikan ‘nazarnya’ sebagai objek berikutnya. Dalam bahasa Indonesia, ‘menunaikan nazarnya’ mengungkapkan tindakan yang tersirat, sambil mencatat bentuk harfiahnya dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. ‘Yahweh’ mempertahankan nama perjanjian itu dan selaras dengan lapisan konsultasi yang telah diperbarui.
- issue: Hubungan נִדְרוֹ dengan tindakan mempersembahkan kurban
  choice: menunaikan nazarnya
  alternative: dan nazarnya
  rationale: Bahasa Ibrani mempertahankan konstruksi eliptis yang dapat dipahami sebagai pelaksanaan kewajiban nazar. Terjemahan utama menjelaskan tindakan tersirat demi kejelasan, sedangkan catatan kaki mempertahankan bentuk ringkas dan ambiguitas sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk ‘pergi naik’ mempertahankan unsur arah dalam teks Ibrani, sedangkan ‘seluruh keluarganya’ menyampaikan makna korporat ‘seisi rumah’ secara mudah dipahami.
