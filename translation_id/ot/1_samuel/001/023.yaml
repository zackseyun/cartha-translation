  text: וַ/יֹּ֣אמֶר לָ/הּ֩ אֶלְקָנָ֨ה אִישָׁ֜/הּ עֲשִׂ֧י הַ/טּ֣וֹב בְּ/עֵינַ֗יִ/ךְ שְׁבִי֙ עַד גָּמְלֵ֣/ךְ אֹת֔/וֹ אַ֛ךְ יָקֵ֥ם יְהוָ֖ה אֶת דְּבָר֑/וֹ וַ/תֵּ֤שֶׁב הָֽ/אִשָּׁה֙ וַ/תֵּ֣ינֶק אֶת בְּנָ֔/הּ עַד גָּמְלָ֖/הּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: id
  text: Lalu Elkana, suaminya, berkata kepadanya, “Lakukanlah apa yang kaupandang baik. Tinggallah sampai engkau menyapihnya. Hanya, kiranya Yahweh meneguhkan firman-Nya[a].” Maka perempuan itu tinggal dan menyusui putranya sampai ia menyapihnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengukuhkan” atau “menggenapi firman-Nya.” Bahasa Ibrani dapat merujuk pada janji Yahweh atau pada perkara yang baru dibicarakan dalam konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks ini אִישׁ dengan akhiran pronominal menyatakan hubungan perkawinan Elkana dengan Hana; “suaminya” merupakan padanan Indonesia yang alami dan tepat.
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: Lakukanlah apa yang kaupandang baik
  rationale: Ungkapan Ibrani ini secara harfiah berarti melakukan apa yang baik di mata seseorang. “Apa yang kaupandang baik” mempertahankan gambaran tentang penilaian pribadi sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: שְׁבִי
  choice: Tinggallah
  rationale: Bentuk perintah dari ישׁב di sini berarti tetap berada di tempatnya, bukan sekadar duduk. “Tinggallah” menyampaikan makna tersebut tanpa menambahkan lokasi yang tidak disebutkan.
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: sampai engkau menyapihnya / sampai ia menyapihnya
  rationale: Dalam konteks pengasuhan anak, גמל secara khusus menunjuk pada penyapihan. Padanan ini mempertahankan perubahan orang dari sapaan langsung ke narasi.
- source_word: אַךְ
  choice: Hanya
  rationale: אַךְ membatasi atau memberi syarat pada izin yang baru diberikan. “Hanya” mempertahankan fungsi wacana itu secara ringkas.
- source_word: יָקֵם
  choice: kiranya ... meneguhkan
  rationale: Bentuk verba ini memiliki nuansa jusif, yakni harapan atau doa. “Kiranya ... meneguhkan” mencerminkan bentuk kausatif קום sambil tidak memastikan apakah yang dimaksud ialah pengukuhan atau penggenapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama pribadi yang terdapat dalam teks sumber tidak diganti dengan gelar.
- source_word: דְּבָרוֹ
  choice: firman-Nya
  rationale: דבר dapat berarti perkataan, perkara, atau janji. “Firman-Nya” merupakan padanan langsung yang tetap membiarkan terbuka apakah acuannya adalah janji Yahweh atau perkara yang baru dibicarakan.
- source_word: וַתֵּינֶק
  choice: menyusui
  rationale: Verba ini menyatakan tindakan seorang ibu memberi susu kepada anaknya. “Menyusui” jelas, alami, dan sesuai dengan konteks.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani memakai nomina umum dengan kata sandang, bukan nama Hana. “Perempuan itu” mempertahankan bentuk rujukan sumber.
theological_decisions:
- issue: Acuan “firman-Nya” dalam perkataan Elkana
  choice: Dipertahankan sebagai “firman-Nya” tanpa menentukan apakah itu janji Yahweh atau perkara yang baru dibicarakan.
  alternative: “janji-Nya”; “firman mengenai anak itu”; atau perkataan/nazar Hana yang dikukuhkan Yahweh
  rationale: Teks Ibrani memakai דְּבָרוֹ, “firman/perkataan-Nya”, dan acuannya tidak sepenuhnya pasti. Terjemahan tidak menyelesaikan ketegangan tafsir yang dibiarkan terbuka oleh sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “kaupandang” dan “engkau” dipakai dalam dialog agar ringkas dan wajar, sedangkan “kiranya” mempertahankan nuansa harapan atau doa. Ungkapan sumber dijaga sejauh tetap mudah dipahami.
