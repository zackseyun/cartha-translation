source:
  edition: WLC
  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: id
  text: Saingannya[a] terus-menerus memancing kejengkelannya, supaya ia menjadi resah, sebab Yahweh telah menutup rahimnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “madunya”; istilah Ibrani ini menunjuk seorang perempuan dalam hubungan persaingan rumah tangga, dan dalam konteks ini ialah istri lain dari suami yang sama.
    reason: Menjelaskan makna leksikal צָרָתָהּ serta alternatif Indonesia yang mencerminkan hubungan ko-istri tanpa menghilangkan unsur persaingan.
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: berulang kali menyakiti hatinya
  rationale: Bentuk dari כעס dalam konteks ini menyatakan tindakan menimbulkan sakit hati atau kekesalan. Ungkapan “berulang kali” menyampaikan sifat kebiasaan dari tindakan itu dalam alur narasi.
- source_word: צָרָתָהּ
  choice: madunya
  rationale: Di sini צָרָה menunjuk kepada Penina sebagai istri lain dari suami yang sama sekaligus saingan Hana dalam rumah tangga. “Madu” adalah istilah Indonesia yang tepat dan ringkas untuk hubungan tersebut.
- source_word: גַּם כַּעַס
  choice: dengan sangat
  rationale: Gabungan ini memperkuat tindakan menyakiti atau membangkitkan kekesalan. “Dengan sangat” mempertahankan fungsi penegasnya tanpa mengulang kata secara kaku.
- source_word: בַּעֲבוּר הַרְּעִמָהּ
  choice: dengan maksud membuatnya gusar
  rationale: בַּעֲבוּר menyatakan tujuan. Kata kerja langka הרעימה dipahami dalam konteks sebagai menyebabkan kegelisahan atau gejolak batin; “membuatnya gusar” mempertahankan makna itu tanpa memberi kepastian palsu pada nuansa etimologisnya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan atau keadaan yang memungkinkan Hana dijadikan sasaran ejekan.
- source_word: סָגַר ... בְּעַד רַחְמָהּ
  choice: telah menutup rahimnya
  rationale: Ungkapan Ibrani ini secara idiomatis berarti bahwa kehamilan ditahan atau tidak terjadi. Bentuk “telah menutup” cocok sebagai latar penyebab dalam narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penyebutan tindakan Yahweh atas rahim Hana
  choice: Yahweh telah menutup rahimnya
  alternative: Hana tidak dapat mengandung
  rationale: Teks Ibrani secara langsung menisbatkan keadaan rahim Hana kepada Yahweh. Terjemahan mempertahankan ketegangan teologis tersebut dan tidak melunakkannya menjadi pernyataan keadaan yang tanpa pelaku.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi; transliterasi mempertahankan nama itu secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Madunya” dipilih karena lebih tepat secara budaya daripada sekadar “saingannya”, sedangkan catatan kaki mempertahankan unsur persaingan dalam istilah Ibrani. Struktur tujuan dan penyebutan langsung tindakan Yahweh dipertahankan.
