  to: Saingannya[a] terus-menerus memancing kejengkelannya, supaya ia menjadi resah, sebab Yahweh telah menutup rahimnya.
  rationale: Revisi mengganti ungkapan yang menambahkan “hati” dengan “memancing kejengkelannya,” yang lebih dekat dengan tindakan memprovokasi dalam teks Ibrani. “Saingannya” dipakai untuk mempertahankan makna utama צָרָה, sedangkan “madunya” dipertahankan sebagai alternatif dalam catatan kaki. Susunan tujuan, pengulangan/kebiasaan tindakan, ambiguitas verba langka yang berkaitan dengan kegelisahan, dan penyebutan langsung tindakan Yahweh tetap dipelihara.
