  naturalness: Kalimat draf dapat dipahami, tetapi “menyakiti hatinya dengan sangat” terasa agak berlebihan dan kurang idiomatis dibandingkan ungkapan yang langsung menyatakan provokasi. “Saingannya” juga lebih alami dalam teks utama sambil mempertahankan unsur permusuhan yang ada pada צָרָה.
  terminology: צָרָתָהּ paling aman diterjemahkan “saingannya” dalam teks utama; catatan kaki dapat menjelaskan bahwa dalam konteks ini ia adalah istri lain dari suami yang sama. “Rahimnya” dan “Yahweh” sudah tepat. Untuk הַרְּעִמָהּ, “resah” menyampaikan gangguan batin tanpa mengunci verba langka itu pada nuansa yang terlalu sempit.
