  text: Ketika diberitahukan kepada Saul bahwa Daud telah melarikan diri ke Gat, ia tidak lagi melanjutkan pencariannya terhadap Daud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: kepada Saul diberitahukan
  rationale: Bentuk pasif mempertahankan bahwa pemberi laporan tidak disebutkan, sekaligus menyatakan Saul sebagai penerima berita.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi laporan secara alami dalam bahasa Indonesia.
- source_word: בָרַח
  choice: telah melarikan diri
  rationale: Menyatakan tindakan melarikan diri yang sudah terjadi sebelum laporan itu diterima Saul.
- source_word: גַּת
  choice: ke Gat
  rationale: Walaupun preposisi tujuan tidak dinyatakan, nama tempat ini berfungsi sebagai tujuan pelarian; bahasa Indonesia secara alami memakai 'ke'.
- source_word: וְלֹא יֹסֶף עוֹד
  choice: ia tidak lagi terus
  rationale: Mengungkapkan idiom יסף + עוד sebagai penghentian tindakan yang sebelumnya berlanjut, tanpa menerjemahkan יסף secara harfiah sebagai 'menambah'.
- source_word: לְבַקְשׁוֹ
  choice: mencari Daud
  rationale: בקש berarti mencari atau berusaha menemukan. Pengulangan nama Daud menghindari kemungkinan rujukan pronomina yang kabur dalam bahasa Indonesia.
