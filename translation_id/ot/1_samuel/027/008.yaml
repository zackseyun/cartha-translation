    text: Nama kelompok ini juga dapat ditransliterasikan “orang Gerzi” atau “orang Gezri”; bentuk etnonim Ibrani ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini dapat juga diterjemahkan “sebagaimana orang datang ke Syur” atau “dalam perjalanan ke Syur.”
    reason: lexical_alternative
  revision_rationale: Revisi mempertahankan makna serbuan, ketiga kelompok etnis, masa lampau yang sangat lama, dan rentang wilayah hingga Mesir. Idiom geografis diperjelas tanpa menjadikannya sebuah "jalan" literal. Karena Syur tetap muncul dalam teks utama, penanda catatan b dipertahankan pada nama tersebut.
