  text: וַ/יַּ֤עַל דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו וַֽ/יִּפְשְׁט֛וּ אֶל הַ/גְּשׁוּרִ֥י ו/ה/גרזי וְ/הָ/עֲמָלֵקִ֑י כִּ֣י הֵ֜נָּה יֹשְׁב֤וֹת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר מֵֽ/עוֹלָ֔ם בּוֹאֲ/ךָ֥ שׁ֖וּרָ/ה וְ/עַד אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: id
  text: Lalu Daud dan orang-orangnya pergi melakukan penyerbuan terhadap orang Gesur, orang Girzi[a], dan orang Amalek. Sebab sejak dahulu kala mereka mendiami negeri itu, dari arah Syur sampai ke tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama kelompok ini juga dapat ditransliterasikan “orang Gerzi” atau “orang Gezri”; bentuk etnonim Ibrani ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: maju
  rationale: Dalam konteks gerakan pasukan, עלה dapat menyatakan gerak maju atau naik. “Maju” mempertahankan arah gerakan tanpa menimbulkan kesan bahwa ketinggian geografis merupakan pokok kalimat.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: melakukan penyerbuan terhadap
  rationale: פשט dalam konteks militer menunjuk pada ekspedisi penyerbuan atau perampasan; dengan אֶל, bahasa Indonesia secara alami memakai “terhadap” untuk sasaran yang diserang.
- source_word: הַגְּשׁוּרִי
  choice: orang Gesur
  rationale: Bentuk nisbah tunggal dipakai secara kolektif untuk kelompok penduduk; “orang Gesur” merupakan bentuk etnonim Indonesia yang ringkas dan alami.
- source_word: הגרזי
  choice: orang Girzi
  rationale: Transliterasi ini mengikuti bentuk konsonantal גרזי dalam teks yang diberikan dan memperlakukannya sebagai nama kelompok.
- source_word: הָעֲמָלֵקִי
  choice: orang Amalek
  rationale: Bentuk nisbah ini dipakai secara kolektif dan secara wajar diterjemahkan “orang Amalek” dalam bahasa Indonesia.
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: merekalah penduduk negeri itu
  rationale: Ungkapan ini menegaskan bahwa kelompok-kelompok tersebut adalah penghuni wilayah itu. Pronomina dan partisip feminin jamak dalam bahasa Ibrani dibiarkan tercermin secara kolektif, tanpa mencoba menjelaskan ketidaksesuaian gramatikalnya di dalam teks utama.
- source_word: מֵעוֹלָם
  choice: sejak dahulu kala
  rationale: Dalam konteks ini עוֹלָם menunjuk pada masa lampau yang sangat lama, bukan kekekalan metafisis.
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: dari jalan menuju Syur
  rationale: Ungkapan geografis dengan infinitif dan sufiks orang kedua lazim berarti “ketika/orang menuju Syur.” Rumusan ini menyampaikan orientasi wilayah secara alami dalam bahasa Indonesia.
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: sampai ke tanah Mesir
  rationale: ועד menandai batas atau jangkauan wilayah; “sampai ke” menyatakannya dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah kelompok memakai pola alami “orang + nama,” sedangkan bahasa militer diterjemahkan secara jelas tanpa memperhalus tindakan penyerbuan.
