  text: וַ/יֹּ֣אמֶר אָכִ֔ישׁ אַל פְּשַׁטְתֶּ֖ם הַ/יּ֑וֹם וַ/יֹּ֣אמֶר דָּוִ֗ד עַל נֶ֤גֶב יְהוּדָה֙ וְ/עַל נֶ֣גֶב הַ/יַּרְחְמְאֵלִ֔י וְ/אֶל נֶ֖גֶב הַ/קֵּינִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: id
  text: Lalu Akhis berkata[a], “Ke mana kalian menyerbu hari ini?” Daud menjawab, “Ke Negeb[b] Yehuda, ke Negeb orang Yerahmeel, dan ke Negeb orang Keni.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah kurang lebih berbunyi, “Tidakkah kalian menyerbu hari ini?” Namun, menurut konteks dan versi-versi kuno, maksud pertanyaannya ialah, “Ke mana kalian menyerbu hari ini?”
    reason: textual_variant
  - marker: b
    text: Atau “wilayah selatan Yehuda ... wilayah selatan orang Yerahmeel ... wilayah selatan orang Keni.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: Ke mana kalian menyerbu hari ini?
  rationale: Teks konsonantal memakai אַל, yang biasanya berarti ‘jangan/tidak’, sehingga secara harfiah kurang lebih berbunyi, ‘Tidakkah kalian menyerbu hari ini?’ Namun, konteks narasi dan kesaksian versi-versi kuno menunjukkan bahwa Akhis menanyakan tempat penyerbuan. Bentuk verba orang kedua jamak dipertahankan dengan ‘kalian’, dan פּשט diterjemahkan ‘menyerbu’ untuk menyampaikan tindakan penjarahan militer secara alami.
- source_word: נֶגֶב
  choice: Negeb
  rationale: Kata ini dapat berarti ‘selatan’ atau menunjuk pada kawasan gersang di selatan yang dikenal sebagai Negeb. Pengulangannya bersama nama wilayah dan kelompok mendukung pemahaman geografis ‘Negeb’, sementara alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: עַל ... וְאֶל
  choice: ke
  rationale: Dalam laporan Daud tentang sasaran penyerbuan, preposisi-preposisi ini menunjukkan arah atau sasaran tindakan. ‘Ke’ terdengar alami dalam bahasa Indonesia setelah ‘menyerbu’ dan tidak memaksakan perbedaan makna antara עַל pada dua frasa pertama dan אֶל pada frasa terakhir.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk baku bahasa Indonesia untuk nama suku dan wilayah ini.
- source_word: הַיַּרְחְמְאֵלִי
  choice: orang Yerahmeel
  rationale: Bentuk gentilik ini menunjuk kepada kaum atau keturunan Yerahmeel. ‘Orang Yerahmeel’ jelas dan alami dalam bahasa Indonesia.
- source_word: הַקֵּינִי
  choice: orang Keni
  rationale: Bentuk gentilik ini menunjuk kepada kaum Keni; ‘orang Keni’ merupakan bentuk Indonesia yang jelas dan lazim.
- source_word: וַיֹּאמֶר
  choice: berkata ... menjawab
  rationale: Pada ucapan Akhis, ‘berkata’ mempertahankan verba Ibrani yang umum. Pada giliran Daud, ‘menjawab’ menyampaikan fungsi percakapannya secara alami tanpa mengubah isi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Kalian’ mencerminkan bentuk jamak Ibrani, kemungkinan mencakup Daud beserta orang-orangnya. Nama-nama diri mengikuti bentuk yang umum dalam Alkitab bahasa Indonesia.
