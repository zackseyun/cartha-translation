translation:
  language: id
  text: Lalu Daud bangkit dan menyeberang bersama enam ratus orang yang menyertainya kepada Akhis anak Maokh, raja Gat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: berangkat
  rationale: Bentuk wayyiqtol dari קום menandai dimulainya tindakan tegas. Dalam narasi perjalanan bahasa Indonesia, 'berangkat' menyampaikan idiom ini secara alami tanpa menyusutkannya menjadi sekadar 'pergi'.
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Kata עבר berarti melintas atau menyeberang. Di sini Daud berpindah ke wilayah Filistin, sehingga 'menyeberang' mempertahankan daya arah kata sumber.
- source_word: הוּא
  choice: ia
  rationale: Pronomina mandiri itu memberi penegasan atau memperjelas bahwa Daud sendiri termasuk dalam rombongan. Susunan 'ia bersama ...' mempertahankan fungsi tersebut secara wajar.
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: bersama keenam ratus orang
  rationale: Angka ini menunjuk kepada kelompok tertentu yang telah dikenal dalam alur cerita; bentuk 'keenam ratus orang' menandai kekhususan itu dalam bahasa Indonesia.
- source_word: אֲשֶׁר עִמּוֹ
  choice: yang menyertainya
  rationale: Klausa relatif ini mengidentifikasi rombongan Daud. 'Yang menyertainya' ringkas, alami, dan tidak menambahkan hubungan di luar teks.
- source_word: אֶל
  choice: menuju
  rationale: Preposisi ini menandai gerak ke arah seseorang sebagai tujuan. 'Menuju' sesuai dengan konstruksi perjalanan dalam kalimat ini.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim dan tetap dekat dengan bentuk Ibrani.
- source_word: בֶּן מָעוֹךְ
  choice: anak Maokh
  rationale: Konstruksi patronimik diterjemahkan langsung sebagai 'anak Maokh'; ejaan Maokh mencerminkan konsonan akhir nama Ibrani.
- source_word: מֶלֶךְ גַּת
  choice: raja Gat
  rationale: Rangkaian konstruksi menyatakan jabatan Akhis sebagai raja Gat. Bentuk aposisional tanpa artikel adalah alami dalam bahasa Indonesia.
