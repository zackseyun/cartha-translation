translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ujaran langsung dipertahankan untuk mencerminkan dua kali לֵאמֹר. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya berdasarkan teks Ibrani.
