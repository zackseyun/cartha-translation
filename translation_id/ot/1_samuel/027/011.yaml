base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: id
  text: Daud tidak membiarkan seorang pun hidup, baik laki-laki maupun perempuan, untuk dibawa ke Gat. Daud berkata, “Jangan sampai mereka melaporkan tentang kami dengan mengatakan, ‘Beginilah yang dilakukan Daud, dan begitulah kebiasaannya[b] selama ia tinggal di wilayah orang Filistin[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di ladang orang Filistin”; ungkapan ini berarti wilayah atau daerah pedesaan orang Filistin.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “cara bertindaknya” atau “tata lakunya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה לֹא יְחַיֶּה
  choice: tidak membiarkan seorang pun hidup, baik laki-laki maupun perempuan
  rationale: Bentuk tunggal berpasangan berfungsi distributif dan menegaskan bahwa Daud tidak menyisakan siapa pun hidup. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan cakupan menyeluruhnya.
- source_word: לְהָבִיא גַת
  choice: untuk dibawa ke Gat
  rationale: Infinitif menyatakan tujuan. Bentuk pasif secara alami menunjukkan bahwa orang-orang yang tidak dibiarkan hidup itu tidak dapat dibawa ke Gat sebagai saksi atau tawanan.
- source_word: לֵאמֹר פֶּן
  choice: Katanya, “Jangan sampai
  rationale: לֵאמֹר mempertahankan bentuk ujaran langsung, sedangkan פֶּן menyatakan pencegahan terhadap akibat yang tidak diinginkan. 'Jangan sampai' merupakan padanan Indonesia yang wajar.
- source_word: יַגִּדוּ עָלֵינוּ
  choice: mereka melaporkan tentang kami
  rationale: Hifil נגד berarti memberi tahu atau melaporkan; עַל dengan sufiks menyatakan pokok laporan, yakni Daud dan orang-orangnya.
- source_word: כֹּה עָשָׂה דָוִד
  choice: Beginilah yang dilakukan Daud
  rationale: כֹּה memiliki daya demonstratif, menunjuk pada tindakan Daud yang akan diceritakan oleh para penyintas.
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: dan begitulah kebiasaannya
  rationale: Dalam konteks ini מִשְׁפָּט menunjuk pada pola tindakan atau kebiasaan yang tetap, bukan putusan hukum. Catatan kaki mempertahankan kemungkinan padanan leksikal lain.
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: selama ia tinggal
  rationale: Ungkapan harfiah 'sepanjang hari-hari ketika ia tinggal' menyatakan keseluruhan masa menetap; 'selama ia tinggal' menyampaikan durasi itu secara alami.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: di wilayah orang Filistin
  rationale: שָׂדֶה secara harfiah berarti 'ladang', tetapi dalam ungkapan geografis ini menunjuk pada daerah atau kawasan orang Filistin.
