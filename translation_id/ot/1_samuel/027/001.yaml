  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל לִבּ֔/וֹ עַתָּ֛ה אֶסָּפֶ֥ה יוֹם אֶחָ֖ד בְּ/יַד שָׁא֑וּל אֵֽין לִ֨/י ט֜וֹב כִּ֣י הִמָּלֵ֥ט אִמָּלֵ֣ט אֶל אֶ֣רֶץ פְּלִשְׁתִּ֗ים וְ/נוֹאַ֨שׁ מִמֶּ֤/נִּי שָׁאוּל֙ לְ/בַקְשֵׁ֤/נִי עוֹד֙ בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֔ל וְ/נִמְלַטְתִּ֖י מִ/יָּדֽ/וֹ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/001.yaml
  text: Then David said in his heart[a], “Now I will one day perish by the hand of Saul. There is nothing better for me than that I should surely escape to the land of the Philistines. Then Saul will despair of seeking me any longer in all the territory of Israel[c][b], and I will escape from his hand.”
translation:
  language: id
  text: Lalu Daud berkata dalam hatinya[a], “Suatu hari nanti aku akan binasa di tangan Saul[b]. Tidak ada yang lebih baik bagiku selain benar-benar melarikan diri ke negeri orang Filistin[c]. Dengan demikian, Saul akan menyerah untuk mencari aku lagi di seluruh wilayah Israel[d], dan aku akan lolos dari tangannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berkata kepada hatinya”; sebuah ungkapan untuk berbicara dalam batin.
    reason: idiom
  - marker: b
    text: Kata Ibrani yang diterjemahkan “binasa” juga dapat berarti “tersapu lenyap.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memakai pengulangan bentuk kata kerja untuk menegaskan tindakan melarikan diri.
    reason: source_form
  - marker: d
    text: Atau, “Saul akan putus asa untuk terus mencari aku di seluruh wilayah Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל־לִבּוֹ
  choice: dalam hatinya
  rationale: Ungkapan Ibrani ini menggambarkan perkataan batin atau perenungan pribadi. Bentuk Indonesia mempertahankan gambaran ‘hati’ dan tetap mudah dipahami.
- source_word: אֶסָּפֶה
  choice: aku akan binasa
  rationale: Bentuk Nifal dari ספה dapat berarti binasa atau tersapu lenyap. ‘Binasa’ menyampaikan ancaman kematian dengan wajar tanpa menentukan cara kematiannya.
- source_word: יוֹם אֶחָד
  choice: suatu hari nanti
  rationale: Ungkapan waktu ini menunjuk pada suatu waktu yang tidak ditentukan pada masa mendatang; terjemahan ini lebih alami daripada ‘satu hari’ dalam konteks ini.
- source_word: בְּיַד שָׁאוּל
  choice: di tangan Saul
  rationale: Ungkapan ini menyatakan kuasa atau tindakan Saul sekaligus mempertahankan citra tangan dalam teks sumber.
- source_word: אֵין לִי טוֹב כִּי
  choice: Tidak ada yang lebih baik bagiku selain
  rationale: Terjemahan ini mempertahankan bentuk penilaian komparatif dalam bahasa Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: הִמָּלֵט אִמָּלֵט
  choice: benar-benar melarikan diri
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan kuat pada tindakan melarikan diri. ‘Benar-benar’ mempertahankan penekanan itu tanpa menjadikannya perintah atau kepastian mutlak.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ke negeri orang Filistin
  rationale: Terjemahan langsung dan jelas bagi pembaca modern, dengan tetap mempertahankan sebutan geografis-etnis teks sumber.
- source_word: וְנוֹאַשׁ מִמֶּנִּי שָׁאוּל
  choice: Saul akan menyerah
  rationale: Dalam konteks ini יאשׁ berarti kehilangan harapan atau menghentikan upaya. ‘Menyerah’ menyatu secara alami dengan klausa berikutnya tentang pencarian Saul.
- source_word: לְבַקְשֵׁנִי עוֹד
  choice: untuk mencari aku lagi
  rationale: עוֹד menyatakan kelanjutan atau pengulangan pencarian; ‘lagi’ menyampaikan bahwa Saul tidak akan meneruskannya.
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: גְּבוּל di sini menunjuk pada seluruh kawasan Israel, bukan hanya garis perbatasannya.
- source_word: וְנִמְלַטְתִּי מִיָּדוֹ
  choice: aku akan lolos dari tangannya
  rationale: Terjemahan ini mempertahankan pengulangan gagasan meloloskan diri dan citra terbebas dari kuasa Saul.
