base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: id
  text: Akhis memercayai Daud dengan berkata, “Ia benar-benar telah membuat dirinya sangat dibenci di antara bangsanya, Israel, sehingga ia akan menjadi hambaku untuk selamanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: Akhis memercayai Daud
  rationale: Bentuk Hifil dari אמן dengan בְּ menyatakan kepercayaan kepada seseorang. Dalam bahasa Indonesia, objek langsung setelah “memercayai” menyampaikan makna itu secara alami.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif pengutip ini memperkenalkan ucapan atau pemikiran Akhis. “Berkata” mempertahankan bentuk pengantar kutipan tanpa menutup kemungkinan bahwa ini adalah pertimbangannya.
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: benar-benar telah membuat dirinya dibenci
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan. Verba harfiahnya memakai gambaran “berbau busuk”, tetapi secara idiomatis berarti menjadi sangat menjijikkan atau dibenci. Teks utama memakai ungkapan Indonesia yang alami, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: oleh bangsanya di Israel
  rationale: Frasa ini menunjukkan bahwa Daud dianggap telah menjadi terhina dalam pandangan bangsanya sendiri, dengan “di Israel” sebagai penjelas nasional atau geografis.
- source_word: וְהָיָה לִי
  choice: sehingga ia akan menjadi hambaku
  rationale: Waw di sini menyampaikan hasil yang disimpulkan Akhis. “Sehingga” mengungkapkan hubungan akibat itu secara alami.
- source_word: לְעֶבֶד
  choice: hamba
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini, Akhis mengharapkan ketergantungan dan pelayanan Daud yang tetap kepadanya; “hamba” mempertahankan nuansa pengabdian politik tanpa memastikan status sebagai milik.
- source_word: עוֹלָם
  choice: untuk selamanya
  rationale: Kata ini menunjuk pada masa yang terus berlangsung atau tidak terbatas. Dalam perkataan Akhis, “untuk selamanya” menyampaikan harapan akan kesetiaan permanen.
theological_decisions:
- issue: Status Daud yang diharapkan Akhis dalam istilah עֶבֶד
  choice: hamba
  alternative: budak
  rationale: Konteks menekankan pelayanan dan ketergantungan yang berkelanjutan kepada raja Filistin, bukan secara tegas status kepemilikan sebagai budak. Catatan kaki mempertahankan kemungkinan leksikal lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “memercayai” mengikuti ejaan baku. Idiom Ibrani dialihkan secara alami dalam teks utama, dengan citra harfiahnya dijelaskan dalam catatan kaki; susunan sebab-akibat dibuat jelas tanpa menghilangkan kesimpulan subjektif Akhis.
