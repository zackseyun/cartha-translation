  text: וַ/יִּתֶּן ל֥/וֹ אָכִ֛ישׁ בַּ/יּ֥וֹם הַ/ה֖וּא אֶת צִֽקְלָ֑ג לָ/כֵ֞ן הָיְתָ֤ה צִֽקְלַג֙ לְ/מַלְכֵ֣י יְהוּדָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: id
  text: Pada hari itu Akhis memberikan Ziklag kepada Daud.[a] Karena itu, Ziklag menjadi milik raja-raja Yehuda sampai hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah memakai kata ganti “kepadanya”, yang merujuk kepada Daud.
    reason: referent_clarification
  - marker: b
    text: Dapat juga diterjemahkan, “Ziklag telah menjadi milik raja-raja Yehuda sampai hari ini”; ungkapan Ibrani menunjukkan kepemilikan yang berlanjut hingga masa narator.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: memberikan
  rationale: Dalam konteks ini נתן secara alami berarti menyerahkan atau memberikan suatu kota; 'memberikan' paling lugas dan tidak menambahkan nuansa administratif yang tidak dinyatakan.
- source_word: לּוֹ
  choice: kepada Daud
  rationale: Pronomina maskulin tunggal merujuk kepada Daud dalam konteks dekat. Nama diperjelas dalam bahasa Indonesia agar rujukannya segera dipahami.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan idiomatis yang mempertahankan penunjukan waktu tertentu dalam bahasa Ibrani.
- source_word: אֶת צִקְלָג
  choice: Ziklag
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama tempat ditransliterasikan.
- source_word: לָכֵן
  choice: Karena itu
  rationale: Mengungkapkan hubungan akibat antara pemberian kota oleh Akhis dan kepemilikan berikutnya.
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: menjadi milik raja-raja Yehuda
  rationale: Konstruksi היה dengan ל menyatakan keadaan atau relasi kepemilikan. 'Menjadi milik' menghubungkan awal keadaan itu dengan pemberian yang baru disebutkan, sementara frasa berikutnya menyatakan keberlangsungannya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan baku yang mempertahankan sudut pandang retrospektif narator.
theological_decisions:
- issue: Sudut pandang historis dalam ungkapan 'sampai hari ini' dan sebutan 'raja-raja Yehuda'
  choice: Mempertahankan catatan retrospektif narator tanpa menjelaskan sejarah penyusunan teks.
  alternative: Memperluas terjemahan untuk menegaskan bahwa kalimat ini berasal dari sudut pandang zaman kerajaan Yehuda yang kemudian.
  rationale: Teks Ibrani hanya menyatakan fakta retrospektif tersebut. Terjemahan tidak seharusnya memasukkan teori kepengarangan atau redaksi.
- issue: Awal dan keberlangsungan kepemilikan Ziklag
  choice: Menerjemahkan הָיְתָה sebagai 'menjadi milik' dan mempertahankan durasi melalui 'sampai hari ini'.
  alternative: Menerjemahkan secara lebih statis sebagai 'telah menjadi milik' atau lebih harfiah sebagai 'ada bagi raja-raja Yehuda'.
  rationale: Bentuk Ibrani dapat menyoroti keadaan yang timbul dari pemberian itu dan berlanjut hingga masa narator. Terjemahan utama menyampaikan alur tersebut tanpa menyelesaikan secara berlebihan nuansa aspek katanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa mengikuti hubungan logis teks Ibrani, dengan nama Daud diperjelas demi kelancaran rujukan. Semua penanda catatan kaki ditempatkan dalam teks utama.
