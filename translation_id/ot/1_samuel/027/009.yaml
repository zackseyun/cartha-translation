  source_fidelity: 'Teks utama secara akurat mencerminkan unsur-unsur Ibrani: Daud menyerang wilayah itu, tidak membiarkan laki-laki maupun perempuan hidup, mengambil ternak dan barang, lalu kembali kepada Akhis. Urutan dua verba terakhir juga dipertahankan. Namun, alternatif dalam catatan kaki "tidak menghidupkan" tidak merupakan bahasa Indonesia yang wajar untuk makna Hifil חיה dalam konteks ini dan dapat memberi kesan ''membangkitkan/menghidupkan kembali'', bukan ''membiarkan tetap hidup''.'
