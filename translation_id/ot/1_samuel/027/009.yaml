  terminology: Nama "Akhis" konsisten dengan transliterasi Indonesia yang lazim. Istilah laki-laki dan perempuan mempertahankan pasangan eksplisit איש ואשה. Tidak ada penambahan sensasional pada penggambaran kekerasan.
