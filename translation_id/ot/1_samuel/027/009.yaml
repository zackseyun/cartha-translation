  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: id
  text: Daud menyerang negeri itu dan tidak membiarkan seorang laki-laki ataupun perempuan tetap hidup[a]. Ia mengambil kambing domba, sapi, keledai, unta, dan pakaian. Kemudian ia kembali dan datang kepada Akhis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak membiarkan seorang laki-laki atau perempuan hidup.”
    reason: Alternatif yang lebih langsung bagi bentuk Hifil יְחַיֶּה, yang dalam konteks ini berarti membiarkan atau mempertahankan hidup.
lexical_decisions:
- source_word: וְהִכָּה
  choice: menyerang
  rationale: Bentuk Hifil dari נכה dalam konteks penyerbuan dapat berarti menyerang atau memukul. “Menyerang” alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak dinyatakan teks.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אֶרֶץ di sini menunjuk pada wilayah yang dihuni kelompok sasaran, bukan bumi secara fisik. “Negeri itu” langsung dan wajar dalam konteks naratif.
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: tidak membiarkan seorang laki-laki ataupun perempuan tetap hidup
  rationale: Bentuk Hifil dari חיה berarti membiarkan atau mempertahankan hidup. Ungkapan ini menyatakan bahwa Daud tidak menyisakan orang hidup, sambil mempertahankan pasangan laki-laki dan perempuan yang disebut eksplisit dalam bahasa Ibrani.
- source_word: וְלָקַח
  choice: Ia mengambil
  rationale: לקח adalah verba umum untuk mengambil. Dalam konteks penjarahan militer, “mengambil” cukup jelas tanpa menafsirkan lebih jauh caranya.
- source_word: צֹאן
  choice: kambing domba
  rationale: צֹאן merupakan istilah kolektif untuk ternak kecil, umumnya domba dan kambing. “Kambing domba” mempertahankan cakupan istilah lebih baik daripada hanya “domba”.
- source_word: בָקָר
  choice: sapi
  rationale: בָקָר menunjuk secara kolektif pada ternak besar jenis bovina; “sapi” merupakan padanan Indonesia yang umum dan jelas.
- source_word: חֲמֹרִים
  choice: keledai
  rationale: Padanan modern dan langsung untuk bentuk jamak חֲמֹרִים; bahasa Indonesia tidak wajib menandai jamak setelah konteks daftar kolektif.
- source_word: גְמַלִּים
  choice: unta
  rationale: Padanan leksikal langsung dan alami; bentuk tanpa reduplikasi wajar dalam daftar barang rampasan.
- source_word: בְגָדִים
  choice: pakaian
  rationale: Padanan modern dan alami bagi בְגָדִים dalam daftar barang yang diambil.
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: Kemudian ia kembali dan datang
  rationale: 'Kedua verba berurutan dipertahankan untuk mencerminkan gerak narasi: kembali dari penyerbuan lalu datang kepada Akhis.'
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penggambaran tindakan kekerasan tanpa penghalusan atau penambahan
  choice: Ayat diterjemahkan secara lugas sebagai serangan mematikan dan pengambilan harta, termasuk bahwa Daud tidak membiarkan laki-laki ataupun perempuan tetap hidup.
  alternative: Menghaluskan pembunuhan sehingga tersamarkan, atau memperluasnya dengan istilah sensasional yang melampaui bunyi teks.
  rationale: Narasi memuat tindakan historis yang secara moral berat. Terjemahan tidak boleh menyamarkan atau membesar-besarkannya, tetapi harus mempertahankan pernyataan teks yang tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar tanpa menghapus pengulangan verba Ibrani. Kekerasan dinyatakan secara terus terang, tetapi tidak dibuat lebih sensasional.
