- from: Kemudian Daud berkata kepada Akhis, “Jika aku mendapat perkenanan di matamu, kiranya aku diberi tempat di salah satu kota di daerah pedesaan[a], supaya aku dapat tinggal di sana.[b] Mengapa hambamu ini harus tinggal bersamamu di kota kerajaan[c]?”
  to: Kemudian Daud berkata kepada Akhis, “Jika aku telah mendapat perkenanan di matamu, kiranya aku diberi tempat di salah satu kota di pedesaan[a], supaya aku dapat tinggal di sana.[b] Mengapa hambamu harus tinggal bersamamu di kota kerajaan[c]?”
  rationale: Revisi ini mempertahankan makna dan tingkat kesantunan permohonan Daud, sambil mencerminkan aspek perfektif kata kerja pembuka dan menghapus unsur “ini” yang tidak terdapat dalam teks Ibrani. Frasa lokasi serta catatan kaki diperhalus agar lebih alami dalam bahasa Indonesia modern dan lebih tepat secara leksikal.
