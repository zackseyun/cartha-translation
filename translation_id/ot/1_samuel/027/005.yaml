base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: id
  text: Kemudian Daud berkata kepada Akhis, “Jika aku telah mendapat perkenanan di matamu, kiranya aku diberi tempat di salah satu kota di pedesaan[a], supaya aku dapat tinggal di sana.[b] Mengapa hambamu harus tinggal bersamamu di kota kerajaan[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di salah satu kota di ladang,” yang berarti kota di daerah pedesaan, berbeda dengan kota kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan aku akan tinggal di sana.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kota kerajaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat perkenanan di matamu
  rationale: Ungkapan Ibrani baku untuk memperoleh persetujuan atau kemurahan seseorang. ‘Mendapat perkenanan’ wajar dalam bahasa Indonesia yang bermartabat, sedangkan ‘di matamu’ mempertahankan citraan aslinya.
- source_word: נָא
  choice: kiranya
  rationale: Partikel ini memperhalus permohonan. ‘Kiranya’ menyampaikan nada hormat dan memohon tanpa menjadikannya perintah tegas.
- source_word: יִתְּנוּ לִי
  choice: aku diberi
  rationale: Bentuk orang ketiga jamak dipakai secara tidak tentu dalam permohonan kepada Akhis. Bentuk pasif Indonesia mempertahankan pelaku yang tidak disebut dan terdengar lebih alami daripada ‘biarlah mereka memberiku’.
- source_word: מָקוֹם
  choice: tempat
  rationale: Padanan umum dan langsung yang tidak mempersempit maknanya menjadi lokasi atau permukiman tertentu.
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: di salah satu kota di daerah pedesaan
  rationale: Secara harfiah berarti ‘di salah satu kota di wilayah terbuka/pedesaan’ dan membentuk kontras dengan kota kerajaan. Rumusan ini alami dalam bahasa Indonesia modern.
- source_word: וְאֵשְׁבָה שָּׁם
  choice: supaya aku dapat tinggal di sana
  rationale: ישב di sini berarti menetap atau tinggal. ‘Supaya’ menyatakan hubungan tujuan yang tersirat dalam konteks, sementara catatan kaki mempertahankan kemungkinan koordinatif yang lebih harfiah.
- source_word: לָמָּה יֵשֵׁב
  choice: Mengapa ... harus tinggal
  rationale: Pertanyaan retoris ini menyampaikan alasan Daud mengajukan permohonan. ‘Harus tinggal’ menghasilkan pertanyaan yang alami tanpa menghilangkan daya retorisnya.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Ini merupakan sebutan diri yang merendah dalam tutur istana, bukan penekanan pada status perbudakan. ‘Hambamu ini’ mempertahankan nada hormat tersebut.
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: di kota kerajaan
  rationale: Terjemahan dekat dari ‘kota kerajaan’ yang menunjuk kota tempat raja berada tanpa mempersempitnya secara pasti menjadi ibu kota.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Padanan langsung yang mempertahankan gagasan kedekatan dengan Akhis di kota kerajaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tutur Daud dibuat hormat melalui ‘kiranya’ dan ‘hambamu ini’; citraan idiom Ibrani ‘di matamu’ dipertahankan karena tetap mudah dipahami. Bentuk pasif ‘aku diberi’ mengungkapkan pelaku jamak yang tidak ditentukan secara alami dalam bahasa Indonesia.
