  text: וַֽ/יְהִי֙ מִסְפַּ֣ר הַ/יָּמִ֔ים אֲשֶׁר יָשַׁ֥ב דָּוִ֖ד בִּ/שְׂדֵ֣ה פְלִשְׁתִּ֑ים יָמִ֖ים וְ/אַרְבָּעָ֥ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/007.yaml
  text: The number of days that David lived in the territory of the Philistines was a year and four months[a].
translation:
  language: id
  text: Lamanya Daud tinggal di wilayah orang Filistin adalah satu tahun empat bulan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “hari-hari dan empat bulan”; dalam rumus jangka waktu ini, “hari-hari” merupakan ungkapan untuk “satu tahun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: Lamanya ... adalah
  rationale: Ungkapan ini merangkum jangka waktu. Bentuk Indonesia yang alami menyampaikan maksud frasa Ibrani tanpa mempertahankan susunan yang kaku, seperti 'jumlah hari ... adalah'.
- source_word: אֲשֶׁר יָשַׁב דָּוִד
  choice: Daud tinggal
  rationale: Dalam konteks ini, יָשַׁב berarti menetap atau tinggal, bukan duduk secara harfiah.
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: di wilayah orang Filistin
  rationale: שְׂדֵה secara harfiah berkaitan dengan 'ladang', tetapi dalam konstruksi ini menunjuk pada negeri atau wilayah yang dikuasai orang Filistin.
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: satu tahun empat bulan
  rationale: Dalam rumus durasi ini, יָמִים dipakai secara idiomatis untuk masa satu tahun; terjemahan harfiah 'hari-hari dan empat bulan' tidak menyampaikan maksudnya dengan jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Lamanya' dipilih agar ringkasan durasi terdengar alami, sedangkan 'wilayah orang Filistin' mempertahankan acuan geografis dan kelompok bangsanya.
