  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּשֶׁב֩ דָּוִ֨ד עִם אָכִ֥ישׁ בְּ/גַ֛ת ה֥וּא וַ/אֲנָשָׁ֖י/ו אִ֣ישׁ וּ/בֵית֑/וֹ דָּוִד֙ וּ/שְׁתֵּ֣י נָשָׁ֔י/ו אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית וַ/אֲבִיגַ֥יִל אֵֽשֶׁת נָבָ֖ל הַֽ/כַּרְמְלִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: id
  text: Maka Daud tinggal bersama Akhis di Gat[a], ia dan orang-orangnya, masing-masing bersama seisi rumahnya[b]—Daud bersama kedua istrinya, Ahinoam dari Yizreel dan Abigail dari Karmel, istri Nabal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiam bersama Akhis di Gat.” Kata kerja Ibrani yang dipakai dapat berarti berdiam atau tetap berada di suatu tempat selama suatu masa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap orang dan rumahnya,” suatu ungkapan distributif yang berarti setiap orang bersama seluruh anggota rumah tangganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, berdiam, menetap, atau tinggal. Dalam konteks ini, “tinggal” menyatakan bahwa Daud berdiam di Gat selama suatu masa tanpa menyiratkan bahwa tempat itu menjadi kediaman tetapnya.
- source_word: עִם אָכִישׁ בְּגַת
  choice: bersama Akhis di Gat
  rationale: עִם menyatakan kebersamaan, sedangkan בְּ dengan nama kota menyatakan lokasi; ungkapan ini diterjemahkan secara langsung dan alami.
- source_word: הוּא וַאֲנָשָׁיו
  choice: ia dan orang-orangnya
  rationale: אֲנָשָׁיו secara harfiah berarti “orang-orangnya.” Dalam konteks, mereka adalah para pengikut bersenjata Daud, tetapi pilihan ini mempertahankan cakupan ungkapan Ibrani tanpa mempersempitnya menjadi “prajurit.”
- source_word: אִישׁ וּבֵיתוֹ
  choice: masing-masing bersama seisi rumahnya
  rationale: אִישׁ dipakai secara distributif, yaitu “masing-masing,” dan בֵּיתוֹ di sini menunjuk kepada seluruh anggota rumah tangga, bukan bangunannya.
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: bersama kedua istrinya
  rationale: Frasa ini merinci rumah tangga Daud sendiri. “Bersama” menghasilkan hubungan yang jelas dan alami dengan susunan sebelumnya.
- source_word: הַיִּזְרְעֵאלִית
  choice: dari Yizreel
  rationale: Bentuk nisbah feminin ini menunjukkan asal Ahinoam. “Dari Yizreel” lebih alami dalam bahasa Indonesia modern daripada membentuk sebutan etnis yang kaku.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: Abigail dari Karmel, istri Nabal
  rationale: הַכַּרְמְלִית berbentuk feminin dan menerangkan Abigail sebagai perempuan dari Karmel. Susunan Indonesia diatur agar hubungan ini tidak secara keliru dipahami sebagai keterangan tentang Nabal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. “Orang-orangnya” mempertahankan keluasan istilah sumber; tanda pisah menandai perincian khusus mengenai rumah tangga Daud. Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
