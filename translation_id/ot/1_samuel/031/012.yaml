  to: Lalu semua laki-laki gagah berani bangkit dan menempuh perjalanan sepanjang malam. Mereka mengambil jenazah[a] Saul dan jenazah putra-putranya dari tembok Bet-Sean, lalu tiba di Yabes[b] dan membakar jenazah-jenazah itu di sana.
