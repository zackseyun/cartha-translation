base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: id
  text: Lalu semua laki-laki gagah berani bangkit dan menempuh perjalanan sepanjang malam. Mereka mengambil jenazah[a] Saul dan jenazah putra-putranya dari tembok Bet-Sean, lalu tiba di Yabes[b] dan membakar jenazah-jenazah itu di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mayat.” Kata Ibrani ini secara khusus merujuk kepada tubuh orang yang sudah mati.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks yang lebih luas, Yabes di sini adalah Yabes-Gilead.
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: semua laki-laki yang gagah berani
  rationale: Ungkapan ini menunjuk kepada para lelaki yang cakap dan berani dalam konteks tindakan berbahaya bernuansa militer. Pilihan ini mempertahankan acuan maskulin teks sumber sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וַיָּק֜וּמוּ
  choice: bangkit
  rationale: Makna dasarnya ialah bangun atau bangkit. Dalam rangkaian narasi ini, “bangkit” mempertahankan gerak awal tindakan dan ragam yang bermartabat.
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: menempuh perjalanan sepanjang malam
  rationale: Frasa ini menyatakan perjalanan yang berlangsung semalam suntuk tanpa memastikan cara mereka bepergian. Terjemahan ini lebih alami daripada “pergi sepanjang malam” dan tidak mempersempit makna menjadi berjalan kaki.
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: jenazah ... jenazah
  rationale: Nomina ini secara khusus merujuk kepada tubuh orang yang sudah mati. “Jenazah” jelas, wajar, dan lebih bermartabat dalam narasi Indonesia daripada “mayat”; bentuknya tidak berubah untuk tunggal dan jamak.
- source_word: מֵחוֹמַת
  choice: dari tembok
  rationale: Preposisi מִן dan nomina חוֹמָה secara langsung berarti “dari tembok.” Konteks sudah menunjukkan bahwa yang dimaksud ialah tembok kota.
- source_word: בֵּית שָׁן
  choice: Bet-Sean
  rationale: Nama tempat ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: יָבֵשָׁה
  choice: tiba di Yabes
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Yabes. Dalam rangkaian perjalanan, “tiba di” menyampaikan bahwa mereka sampai ke tujuan tanpa menambahkan nama lengkap yang tidak tertulis pada ayat ini.
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: dan membakar semuanya di sana
  rationale: Kata kerja berarti “membakar,” sedangkan pronomina jamaknya mengacu kepada jenazah Saul dan anak-anaknya. “Semuanya” mempertahankan pronomina itu secara alami tanpa menafsirkan tindakan lebih jauh sebagai kremasi formal.
theological_decisions:
- issue: Acuan maskulin dalam ungkapan kolektif bagi para penyelamat
  choice: semua laki-laki yang gagah berani
  alternative: semua orang yang gagah berani
  rationale: Teks Ibrani memakai אִישׁ dan bentuk-bentuk maskulin dalam konteks sekelompok pejuang. Menyebut “laki-laki” mempertahankan kekhususan sumber tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dibagi agar mudah dipahami, sementara urutan tindakan dalam bahasa Ibrani tetap dipertahankan. Penanda catatan kaki ditempatkan tepat pada istilah yang diterangkannya.
