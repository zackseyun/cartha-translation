  yaml_path: translation/ot/1_samuel/031/005.yaml
  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: id
  text: Ketika pembawa senjatanya melihat bahwa Saul sudah mati[a], ia pun menjatuhkan diri ke atas pedangnya dan mati bersama Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mati”. Bahasa Ibrani dapat menggambarkan keadaan Saul sebagai orang yang sudah mati atau kematiannya sebagai peristiwa yang telah selesai dan menjadi dasar tindakan pembawa senjatanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Frasa konstruksi ini secara harfiah menunjuk kepada orang yang membawa perlengkapan atau senjata Saul. “Pembawa senjata” merupakan sebutan peran militer yang jelas dan lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang dilihat oleh pembawa senjata itu, bukan terutama hubungan sebab-akibat.
- source_word: מֵת
  choice: sudah mati
  rationale: Bentuk ini dapat menyatakan keadaan Saul sebagai orang yang telah mati. “Sudah mati” alami dalam narasi Indonesia dan tetap memungkinkan nuansa keadaan yang merupakan hasil peristiwa sebelumnya.
- source_word: גַּם הוּא
  choice: ia pun
  rationale: Ungkapan ini mempertahankan penekanan aditif bahwa pembawa senjata melakukan hal yang serupa menyusul Saul.
- source_word: עַל חַרְבּוֹ
  choice: ke atas pedangnya
  rationale: Pilihan ini mempertahankan gambaran harfiah tindakan menjatuhkan diri pada pedang, sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: וַיָּמָת עִמּוֹ
  choice: dan mati bersama Saul
  rationale: עִם menyatakan kebersamaan. Nama “Saul” dipakai kembali agar rujukannya jelas dalam bahasa Indonesia tanpa menambahkan gagasan tempat yang tidak dinyatakan teks.
- source_word: וַיַּרְא
  choice: Ketika ... melihat
  rationale: Bentuk naratif ini diungkapkan sebagai anak kalimat waktu untuk menghubungkan pengamatan pembawa senjata dengan tindakannya secara alami.
