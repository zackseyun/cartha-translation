  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אֶת שָׁא֖וּל וְ/אֶת בָּנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יְהוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: id
  text: Orang-orang Filistin menyusul Saul dan anak-anak lelakinya[a], lalu orang-orang Filistin menewaskan Yonatan, Abinadab, dan Malkisua[b], anak-anak lelaki Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhasil mencapai Saul dan anak-anak lelakinya” atau “terus mendesak Saul dan anak-anak lelakinya.” Kata Ibrani yang dipakai menggambarkan pengejaran dekat yang mencapai sasarannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menghantam Yonatan, Abinadab, dan Malkisua.” Dalam konteks pertempuran ini, kata tersebut tampaknya menyiratkan bahwa mereka mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
  choice: menyusul
  rationale: Dalam konteks pertempuran, verba דבק menggambarkan pengejaran dekat yang berhasil mencapai sasaran. “Menyusul” menyampaikan bahwa pasukan Filistin berhasil mencapai Saul dan anak-anaknya tanpa memakai arti harfiah yang tidak alami, seperti “melekat”.
- source_word: פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Bentuk baku dan alami dalam bahasa Indonesia untuk menyebut kelompok bangsa ini.
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: Saul dan anak-anaknya
  rationale: בָּנָיו menunjuk kepada anak-anak laki-laki Saul; dalam bahasa Indonesia, “anak-anaknya” terdengar alami dan identitas mereka sebagai laki-laki diperjelas oleh nama-nama pada klausa berikutnya.
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: Verba נכה pada dasarnya berarti memukul atau menghantam, tetapi dalam konteks pertempuran dan daftar korban ini tindakan tersebut berakibat kematian. “Menewaskan” menyampaikan hasil yang dimaksud dengan wajar, sementara catatan kaki mempertahankan nuansa leksikal harfiahnya.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi baku nama Ibrani dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲבִינָדָב
  choice: Abinadab
  rationale: Transliterasi yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: מַלְכִּי שׁוּעַ
  choice: Malkisua
  rationale: Transliterasi yang lazim dalam Alkitab bahasa Indonesia; bentuk tanpa tanda hubung lebih alami menurut kebiasaan penulisan nama Indonesia.
- source_word: בְּנֵי שָׁאוּל
  choice: anak-anak Saul
  rationale: Frasa aposisional ini dipertahankan untuk menegaskan bahwa ketiga orang yang disebutkan adalah anak Saul.
