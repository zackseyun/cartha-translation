  register: Bahasa Indonesia baku, modern, dan naratif. Kalimat dibagi menjadi dua agar jelas dan alami. Pilihan “menyusul” mempertahankan gambaran pengejaran, sedangkan “menewaskan” menyampaikan akibat tindakan dalam konteks pertempuran; alternatif yang lebih harfiah dicatat dalam catatan kaki.
