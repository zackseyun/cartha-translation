base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: id
  text: Mereka mengambil tulang-tulang mereka, lalu menguburkannya di bawah pohon tamariska[a] di Yabesh[b]. Mereka pun berpuasa selama tujuh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau cukup “tamariska”; bahasa Ibrani menyebut jenis pohonnya secara khusus.
    reason: lexical_alternative
  - marker: b
    text: Nama Yabesh di sini merupakan bentuk singkat dari Yabesh-Gilead yang disebut dalam konteks sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Mereka mengambil
  rationale: Kata לָקַח berarti ‘mengambil’. Bentuk naratif Ibrani diterjemahkan secara langsung tanpa menambahkan keterangan waktu yang tidak dinyatakan.
- source_word: עַצְמֹתֵיהֶם
  choice: tulang-tulang mereka
  rationale: Kata עֶצֶם secara konkret berarti ‘tulang’. Karena mayat-mayat itu telah dibakar dalam ayat sebelumnya, terjemahan ini dipertahankan dan tidak diperumum menjadi ‘sisa-sisa jasad’.
- source_word: וַיִּקְבְּרוּ
  choice: lalu menguburkannya
  rationale: Kata קָבַר adalah verba umum untuk ‘menguburkan’. Pronomina ‘-nya’ merujuk secara alami kepada tulang-tulang yang baru disebut.
- source_word: תַחַת
  choice: di bawah
  rationale: Padanan ini langsung, wajar, dan mempertahankan hubungan tempat yang dinyatakan teks.
- source_word: הָאֶשֶׁל
  choice: pohon tamariska
  rationale: Kata אֶשֶׁל menunjuk pada tamariska. Penambahan kata ‘pohon’ memperjelas rujukannya bagi pembaca Indonesia tanpa menghilangkan nama jenisnya.
- source_word: בְּיָבֵשָׁה
  choice: di Yabesh
  rationale: Nama tempat יָבֵשׁ ditransliterasikan ‘Yabesh’; dalam konteks ini nama tersebut merupakan bentuk singkat dari Yabesh-Gilead.
- source_word: וַיָּצֻמוּ
  choice: Mereka pun berpuasa
  rationale: Kata צוּם berarti ‘berpuasa’. Partikel ‘pun’ secara alami meneruskan rangkaian tindakan dalam narasi.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Frasa waktu ini diterjemahkan langsung; ‘selama’ membuat durasi puasa jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan khidmat. Struktur naratif dibuat alami dengan ‘lalu’ dan ‘pun’, sementara istilah konkret ‘tulang-tulang’ serta nama jenis pohon tetap dipertahankan.
