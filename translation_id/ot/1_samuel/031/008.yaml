  to: Keesokan harinya, orang Filistin datang untuk melucuti orang-orang yang tewas,[a] lalu mereka menemukan Saul dan ketiga putranya telah gugur di Gunung Gilboa.
  rationale: Revisi mengganti ungkapan yang tidak lazim dengan “melucuti,” padanan kontekstual yang langsung bagi verba Ibrani. Istilah “putranya” memelihara makna maskulin, dan “telah gugur” menghindari pengulangan yang canggung sambil mempertahankan citra kematian dalam pertempuran. Catatan kaki tetap menyediakan penjelasan konkret mengenai apa yang dilucuti.
