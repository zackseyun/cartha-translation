base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/008.yaml
  text: The next day[a], the Philistines came to strip the slain, and they found Saul and his three sons fallen on Mount Gilboa.
translation:
  language: id
  text: Keesokan harinya, orang Filistin datang untuk melucuti orang-orang yang tewas,[a] lalu mereka menemukan Saul dan ketiga putranya telah gugur di Gunung Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menanggalkan pakaian atau perlengkapan dari orang-orang yang tewas.” Kata kerja Ibrani ini merujuk pada tindakan mengambil pakaian, perlengkapan, atau baju zirah dari korban pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini menunjuk pada hari sesudah peristiwa pertempuran yang baru diceritakan; bentuk ini alami dan ringkas dalam bahasa Indonesia modern.
- source_word: לְפַשֵּׁט אֶת הַחֲלָלִים
  choice: untuk menanggalkan barang-barang dari orang-orang yang gugur
  rationale: Dalam konteks sesudah pertempuran, פשט berarti melucuti pakaian, perlengkapan, atau senjata dari korban yang tewas. Rumusan ini mempertahankan tindakan konkret tanpa menyempitkannya hanya pada pakaian atau baju zirah.
- source_word: וַיִּמְצְאוּ
  choice: mereka menemukan
  rationale: Padanan langsung bagi verba naratif yang meneruskan urutan kejadian.
- source_word: שְׁלֹשֶׁת בָּנָיו
  choice: ketiga anaknya
  rationale: בנים berarti anak laki-laki atau putra; dalam konteks ini 'anaknya' terdengar alami dan identitas mereka sudah jelas dari narasi, meski 'ketiga putranya' juga mungkin.
- source_word: נֹפְלִים
  choice: tergeletak gugur
  rationale: Partisipel ini secara harfiah berarti 'jatuh/tergeletak' dan dalam konteks perang menyatakan bahwa mereka telah gugur. Gabungan ini mempertahankan gambaran posisi tubuh sekaligus makna kematian dalam pertempuran.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: di Gunung Gilboa
  rationale: Padanan geografis yang lazim dan alami dalam bahasa Indonesia.
