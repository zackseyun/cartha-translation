translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Orang-orang yang gugur' mempertahankan konteks peperangan; 'tergeletak gugur' menjaga citra harfiah נֹפְלִים tanpa mengaburkan bahwa Saul dan anak-anaknya telah tewas.
