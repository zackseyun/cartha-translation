base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: id
  text: Lalu Saul berkata kepada pembawa senjatanya, “Hunuslah pedangmu dan tikamlah aku dengan pedang itu, agar orang-orang yang tidak bersunat ini tidak datang, menikam aku, dan memperlakukan aku dengan semena-mena[a].” Namun pembawa senjatanya tidak mau, karena ia sangat takut. Maka Saul mengambil pedang itu dan menjatuhkan diri ke atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperlakukan aku dengan hina” atau “memperlakukan aku dengan buruk.”
    reason: Verba Ibrani ini menunjuk pada perlakuan abusif atau menghinakan, tetapi bentuk tepat perlakuannya tidak dijelaskan.
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Ungkapan ini menunjuk kepada pelayan militer yang membawa perlengkapan seorang pejuang; padanan Indonesia yang lazim dan ringkas ialah “pembawa senjata”.
- source_word: שְׁלֹף
  choice: Hunuslah
  rationale: Kata perintah ini berarti mengeluarkan pedang dari sarungnya; “hunuslah” tepat, alami, dan sesuai dengan konteks militer.
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: tikamlah aku dengan pedang itu / menikam aku
  rationale: דקר menyatakan tindakan menusuk dengan senjata. Pengulangan “tikam” mempertahankan pengulangan verba Ibrani dalam perkataan Saul.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Memperkenalkan akibat yang ditakuti dan hendak dicegah oleh Saul; bentuk ini jelas dalam bahasa Indonesia modern.
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: orang-orang yang tidak bersunat ini
  rationale: Mempertahankan sebutan harfiah yang bernuansa penghinaan dan identitas perjanjian, tanpa menggantinya secara interpretatif dengan “orang Filistin”.
- source_word: וְהִתְעַלְּלוּ בִי
  choice: mempermainkan aku dengan kejam
  rationale: Bentuk verba ini dapat menyatakan perlakuan sewenang-wenang, kejam, dan menghinakan. Pilihan ini menyampaikan unsur penghinaan tanpa menentukan bentuk perlakuan yang tidak dijelaskan teks.
- source_word: וְלֹא אָבָה
  choice: tidak mau
  rationale: Menyampaikan ketidaksediaan atau penolakan secara alami dan langsung.
- source_word: כִּי יָרֵא מְאֹד
  choice: karena ia sangat takut
  rationale: Mempertahankan hubungan sebab dan penegasan מְאֹד secara lugas.
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: menjatuhkan dirinya ke atasnya
  rationale: Mengungkapkan tindakan yang disengaja secara alami dalam bahasa Indonesia, sesuai konteks, sambil tetap dekat dengan gambaran harfiah “jatuh di atasnya”.
theological_decisions:
- issue: Sifat perlakuan yang ditakuti Saul
  choice: mempermainkan aku dengan kejam
  alternative: menganiaya aku; memperlakukan aku dengan hina; menjadikan aku bahan permainan
  rationale: Teks menunjukkan perlakuan kejam dan menghinakan, tetapi tidak menetapkan apakah itu berupa penyiksaan, ejekan, atau bentuk penghinaan tertentu. Terjemahan mempertahankan keluasan makna tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah “pembawa senjata” dan “hunuslah” mempertahankan warna konteks militer tanpa terdengar kuno secara berlebihan.
