  text: וַ/יָּשִׂ֨מוּ֙ אֶת כֵּלָ֔י/ו בֵּ֖ית עַשְׁתָּר֑וֹת וְ/אֶת גְּוִיָּת/וֹ֙ תָּקְע֔וּ בְּ/חוֹמַ֖ת בֵּ֥ית שָֽׁן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: id
  text: Mereka menaruh perlengkapan perangnya[a] di rumah Asytarot[b], lalu memasang jenazahnya[c] pada tembok Bet-Sean.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “senjata-senjatanya” atau, lebih umum, “perlengkapannya”; istilah Ibrani ini dapat mencakup berbagai perlengkapan militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “kuil Asytarot.” Secara harfiah, “rumah Asytarot.” Bentuk Ibrani Asytarot berbentuk jamak dan juga dapat dialihaksarakan “para Asytoret.”
    reason: lexical_alternative
  - marker: c
    text: Atau “menancapkan” atau “mengikatkan dengan kuat.” Kata kerja Ibrani ini tidak menjelaskan dengan pasti bagaimana jenazah itu dipasang pada tembok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: Mereka menaruh
  rationale: Verba שׂוּם berarti menaruh, menempatkan, atau meletakkan; “menaruh” alami dalam narasi ini.
- source_word: כֵּלָיו
  choice: perlengkapan perangnya
  rationale: כְּלִי dapat menunjuk pada senjata, perlengkapan, atau berbagai benda. Konteks kekalahan Saul mendukung pengertian perlengkapan militer tanpa mempersempitnya hanya menjadi baju zirah atau senjata.
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: kuil Asytoret
  rationale: Secara harfiah berarti “rumah Asytoret,” tetapi dalam konteks pemujaan בֵּית menunjuk pada kuil. Bentuk nama Ibrani dipertahankan melalui transliterasi Indonesia yang lazim; bentuk morfologis עַשְׁתָּרוֹת dijelaskan dalam catatan.
- source_word: גְּוִיָּתוֹ
  choice: jenazahnya
  rationale: גְּוִיָּה di sini menunjuk pada tubuh Saul yang telah mati; “jenazah” menyatakannya secara jelas dan wajar.
- source_word: תָּקְעוּ
  choice: memakukan
  rationale: תקע dapat berarti menancapkan, memakukan, atau mengikatkan dengan kuat. “Memakukan” menyampaikan tindakan menempelkan jenazah pada tembok, sementara catatan mempertahankan ketidakpastian mengenai caranya.
- source_word: בְּחוֹמַת
  choice: pada tembok
  rationale: Dengan תקע, preposisi בְּ paling alami diterjemahkan “pada,” yakni jenazah itu dipasang atau ditancapkan pada tembok.
- source_word: בֵּית שָׁן
  choice: Bet-Sean
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia.
