  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: id
  text: Maka Saul, ketiga anaknya, pembawa senjatanya, dan semua anak buahnya[a][b] semuanya mati pada hari itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua prajuritnya.” Teks Ibrani secara harfiah berbunyi “semua orangnya”; dalam konteks pertempuran ini, ungkapan tersebut kemungkinan menunjuk pasukan atau para pengikut Saul, bukan setiap orang yang berhubungan dengannya.
    reason: lexical_alternative
  - marker: b
    text: Beberapa naskah Yunani membaca “seluruh perlengkapannya” dan bukan “semua anak buahnya.” Teks Ibrani mendukung “semua anak buahnya.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּמָת
  choice: Demikianlah ... mati
  rationale: Bentuk naratif ini melanjutkan sekaligus menyimpulkan rangkaian peristiwa sebelumnya. “Demikianlah” menyampaikan alur tersebut secara alami dalam bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: ketiga anaknya
  rationale: Menyampaikan jumlah dan sufiks kepunyaan secara ringkas dan idiomatis.
- source_word: וְנֹשֵׂא כֵלָיו
  choice: pembawa senjatanya
  rationale: Ungkapan partisipial ini secara harfiah menunjuk orang yang membawa perlengkapan atau senjata Saul. Pilihan ini jelas dan wajar dalam konteks militer kuno.
- source_word: גַּם כָּל אֲנָשָׁיו
  choice: dan semua anak buahnya
  rationale: Dalam konteks pertempuran, אֲנָשָׁיו paling mungkin menunjuk orang-orang yang berada di bawah pimpinan Saul, khususnya pasukan atau pengikut militernya. “Anak buahnya” tetap cukup luas tanpa menyatakan secara pasti bahwa semuanya tentara.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang langsung, jelas, dan alami.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Menegaskan bahwa semua tokoh yang disebutkan mati dalam peristiwa yang sama pada hari itu.
