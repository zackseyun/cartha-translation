source:
  edition: WLC
  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ אֶל שָׁא֔וּל וַ/יִּמְצָאֻ֥/הוּ הַ/מּוֹרִ֖ים אֲנָשִׁ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֥חֶל מְאֹ֖ד מֵ/הַ/מּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: id
  text: Pertempuran semakin sengit melawan Saul. Para pemanah menemukannya[a], dan ia sangat menderita akibat para pemanah itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mencapai dia" atau "mendapati dia".
    reason: lexical_alternative
  - marker: b
    text: Atau "ia sangat kesakitan karena para pemanah itu"; mungkin juga "ia terluka parah oleh para pemanah itu." Kata kerja Ibraninya sulit dan dapat menunjuk pada rasa sakit, gemetar, atau kesesakan hebat, bukan semata-mata luka fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: Pertempuran semakin sengit melawan Saul
  rationale: Ungkapan harfiahnya menyatakan bahwa pertempuran 'menjadi berat' terhadap Saul. 'Semakin sengit melawan Saul' menyampaikan meningkatnya tekanan pertempuran dengan bahasa Indonesia yang alami tanpa menghilangkan arah permusuhannya.
- source_word: וַיִּמְצָאֻהוּ
  choice: berhasil menemukan dia
  rationale: Kata kerja ini pada dasarnya berarti 'menemukan'. Dalam konteks pertempuran, bentuk ini dapat menyiratkan bahwa para pemanah berhasil menjangkau atau mendapati Saul; penambahan 'berhasil' membuat implikasi konteks itu jelas tanpa mengganti makna dasarnya.
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: para pemanah
  rationale: Teks Ibrani secara lengkap berbunyi kira-kira 'orang-orang yang menembak, orang-orang dengan busur'. 'Para pemanah' merangkum kedua unsur itu secara tepat dan alami dalam bahasa Indonesia.
- source_word: וַיָּחֶל מְאֹד
  choice: ia menjadi sangat gentar
  rationale: Kata kerja yang sulit ini dapat menunjuk pada gemetar, rasa sakit, atau kesesakan hebat, dan dalam konteks ini tidak harus menyatakan luka fisik secara eksplisit. 'Sangat gentar' mempertahankan pengertian penderitaan atau ketakutan berat, sementara kemungkinan luka fisik dicatat dalam catatan kaki.
- source_word: מֵהַמּוֹרִים
  choice: karena para pemanah itu
  rationale: Kata depan מִן dapat menyatakan sumber atau penyebab. Karena kondisi Saul diterjemahkan sebagai kegentaran, 'karena' paling alami; jika kata kerja dipahami sebagai luka fisik, frasa ini dapat berarti 'oleh para pemanah'.
theological_decisions:
- issue: Apakah kondisi Saul secara eksplisit merupakan luka fisik
  choice: Teks utama menerjemahkannya sebagai kegentaran hebat
  alternative: ia terluka parah oleh para pemanah
  rationale: Bentuk Ibraninya sulit dan dapat berkaitan dengan rasa sakit, gemetar, atau kesesakan. Konteks dan 1 Tawarikh 10:3 mendukung kemungkinan luka fisik, tetapi teks Samuel tidak menuntut agar ambiguitas itu diselesaikan demikian. Karena itu, teks utama tidak menambahkan luka secara pasti dan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa naratif modern dan bermartabat. Istilah 'para pemanah' dipakai untuk menghindari pengulangan harfiah yang janggal seperti 'orang-orang yang menembak, orang-orang dengan busur'. Ambiguitas utama pada kondisi Saul dipertahankan melalui teks utama dan catatan kaki.
