  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: id
  text: Ketika orang-orang Israel yang berada di seberang lembah[a] dan mereka yang berada di seberang Sungai Yordan melihat bahwa orang-orang Israel telah melarikan diri dan bahwa Saul serta putra-putranya telah mati, mereka meninggalkan kota-kota itu lalu melarikan diri. Kemudian orang-orang Filistin datang dan menetap di kota-kota itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sisi lain lembah”. Ungkapan Ibrani itu menunjuk sisi atau wilayah di seberang dari suatu titik pandang. Ungkapan yang sama dipakai untuk Sungai Yordan dalam kalimat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tinggal di kota-kota itu”. Kata kerja Ibrani yang digunakan dapat berarti tinggal atau menetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Kata ראה secara dasar berarti ‘melihat’. Dalam konteks ini kata tersebut menyatakan pengamatan atas peristiwa yang nyata tanpa menambahkan tafsiran seperti ‘menyadari’.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘orang-orang laki-laki Israel’. Dalam bahasa Indonesia modern, ‘orang-orang Israel’ tetap dekat dengan bentuk sumber dan dapat mencakup penduduk Israel yang disebut dalam konteks militer-geografis ini.
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: di seberang lembah
  rationale: Kata עֵבֶר menunjuk sisi atau wilayah di seberang suatu batas geografis. ‘Di seberang lembah’ alami dalam bahasa Indonesia dan mempertahankan sudut pandang relatif dalam bahasa Ibrani.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Terjemahan ini mempertahankan pengulangan ungkapan geografis yang sama. Penambahan ‘Sungai’ memperjelas nama geografis bagi pembaca Indonesia tanpa mengubah rujukannya.
- source_word: כִּי נָסוּ
  choice: bahwa ... telah melarikan diri
  rationale: Partikel כִּי memperkenalkan isi yang mereka lihat, sedangkan bentuk perfek נָסוּ menyatakan pelarian yang sudah terjadi dari sudut pandang para pengamat.
- source_word: מֵתוּ
  choice: telah mati
  rationale: Kata מות menyatakan kematian tanpa secara eksplisit menyebut cara kematian. ‘Telah mati’ mempertahankan batas informasi teks dan urutan naratifnya.
- source_word: וּבָנָיו
  choice: serta anak-anaknya
  rationale: Kata hubung menggabungkan Saul dengan anak-anaknya sebagai pihak yang juga telah mati. ‘Serta’ mengalir alami dan tetap menunjukkan koordinasi sederhana.
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: mereka meninggalkan kota-kota itu
  rationale: Kata עזב berarti meninggalkan atau menelantarkan. ‘Meninggalkan’ menyampaikan tindakan tersebut secara jelas, sedangkan ‘kota-kota itu’ mencerminkan bentuk tertentu dalam bahasa Ibrani.
- source_word: וַיָּנֻסוּ
  choice: lalu melarikan diri
  rationale: Kata נוס adalah verba umum untuk melarikan diri. ‘Lalu’ menyampaikan kelanjutan cepat dalam rangkaian naratif tanpa membuat hubungan sebab-akibat tambahan.
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: Kemudian orang-orang Filistin datang
  rationale: Kata בוא berarti datang atau masuk. ‘Datang’ cukup dekat dengan teks, sementara konteks berikutnya menjelaskan bahwa mereka menduduki permukiman yang ditinggalkan.
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: menetap di kota-kota itu
  rationale: Kata ישב dapat berarti duduk, tinggal, atau menetap. Dalam konteks kota-kota yang ditinggalkan dan kemudian dikuasai, ‘menetap’ alami dan mencerminkan kemungkinan pendudukan yang berlanjut, sambil mencatat alternatif ‘tinggal’ dalam catatan kaki.
