  to: Mereka memenggal kepala Saul dan menanggalkan perlengkapan perangnya.[a] Kemudian mereka mengirim utusan ke segala penjuru negeri orang Filistin untuk memberitakan kabar baik itu di kuil berhala-berhala mereka[b] dan kepada rakyat.
  rationale: Mengganti “kemenangan itu” dengan “kabar baik itu” agar nuansa positif dari בשר tetap diterjemahkan tanpa menentukan secara eksplisit isi kabar tersebut. Catatan kaki dan penandanya sudah tepat serta tidak memerlukan perubahan.
