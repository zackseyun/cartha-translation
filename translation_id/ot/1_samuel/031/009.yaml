base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: id
  text: Mereka memenggal kepala Saul dan menanggalkan perlengkapan perangnya.[a] Kemudian mereka mengirim utusan ke segala penjuru negeri orang Filistin untuk memberitakan kabar baik itu di kuil berhala-berhala mereka[b] dan kepada rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “baju zirahnya” atau “senjata-senjatanya.” Kata Ibrani yang dipakai dapat mencakup berbagai perlengkapan perang.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di rumah berhala-berhala mereka.” Dalam konteks ini, “rumah” dapat berarti kuil atau tempat pemujaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: memenggal kepala Saul
  rationale: Dengan רֹאשׁוֹ sebagai objek, כּרת berarti memotong hingga terpisah, sehingga 'memenggal' paling tepat. Nama 'Saul' memperjelas rujukan pronomina dari konteks sebelumnya.
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: menanggalkan perlengkapan perangnya
  rationale: פשׁט dalam konteks ini berarti melucuti atau menanggalkan, sedangkan כֵּלָיו dapat mencakup baju zirah, senjata, dan perlengkapan lain. Pilihan ini mempertahankan keluasan istilah Ibrani.
- source_word: וַיְשַׁלְּחוּ
  choice: mereka mengirim utusan
  rationale: Teks hanya menyatakan 'mereka mengirim', tanpa objek yang disebutkan. Tujuan berikutnya, yakni memberitakan kabar ke seluruh wilayah, secara wajar menyiratkan pengiriman para utusan.
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: ke segala penjuru negeri orang Filistin
  rationale: סָבִיב menyatakan penyebaran ke seluruh kawasan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan geografisnya.
- source_word: לְבַשֵּׂר
  choice: untuk memberitakan kemenangan itu
  rationale: בּשׂר menyampaikan kabar baik atau kabar kemenangan. Dalam konteks ini, kematian Saul merupakan berita kemenangan dari sudut pandang orang Filistin; terjemahan ini menghindari nuansa religius modern dari 'Injil' atau 'kabar baik'.
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: di kuil berhala-berhala mereka
  rationale: בֵּית secara harfiah berarti 'rumah', tetapi dalam konteks kultis menunjuk tempat suci atau kuil. עֲצַבִּים berarti patung-patung berhala.
- source_word: וְאֶת הָעָם
  choice: dan kepada rakyat
  rationale: 'Penanda objek אֵת meneruskan gagasan ''memberitakan'' secara eliptis: kabar itu disampaikan juga kepada rakyat.'
theological_decisions:
- issue: Sebutan bagi tempat ibadah dan objek kultis orang Filistin
  choice: kuil berhala-berhala mereka
  alternative: rumah patung-patung mereka
  rationale: Pilihan 'kuil' menyampaikan fungsi kultis בֵּית secara alami, sedangkan 'berhala' menerjemahkan עֲצַבִּים tanpa mengakui objek tersebut sebagai ilah yang nyata.
- issue: Nuansa לְבַשֵּׂר sebagai kabar baik
  choice: memberitakan kemenangan itu
  alternative: menyampaikan kabar baik itu
  rationale: Kabar tersebut baik dari sudut pandang orang Filistin karena mengumumkan kemenangan mereka. 'Kemenangan' mempertahankan nuansa itu tanpa memberi kesan bahwa narator menilai peristiwa tersebut baik secara moral atau teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Memenggal' menyampaikan tindakan secara tepat tanpa uraian berlebihan. 'Ke segala penjuru' menerjemahkan סָבִיב secara idiomatis. Semua penjelasan yang melampaui bentuk Ibrani langsung—khususnya cakupan כֵּלָיו dan arti kultis בֵּית—dipertahankan dalam catatan kaki.
