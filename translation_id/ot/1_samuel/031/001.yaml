base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: id
  text: Orang Filistin sedang berperang melawan Israel, dan para lelaki Israel melarikan diri dari orang Filistin[a] lalu gugur di Gunung Gilboa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hadapan orang Filistin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Nama bangsa diterjemahkan dengan bentuk baku bahasa Indonesia. Konjungsi ו tidak dinyatakan tersendiri karena pada awal unit narasi bahasa Indonesia tidak memerlukannya agar kesinambungan wacana tetap alami.
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: sedang berperang melawan Israel
  rationale: Bentuk partisip menunjukkan tindakan yang sedang berlangsung sebagai latar narasi; konstruksi dengan ב bersifat adversatif, sehingga diterjemahkan 'melawan'.
- source_word: וַ/יָּנֻסוּ
  choice: melarikan diri
  rationale: Dalam konteks pertempuran, נוּס berarti melarikan diri atau mundur dengan lari dari musuh.
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: Orang-orang Israel
  rationale: Ungkapan ini menunjuk kepada orang-orang lelaki Israel yang bertempur. Bentuk ini tetap dekat dengan teks tanpa menambahkan kata 'pasukan' yang tidak dinyatakan secara eksplisit.
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: dari orang Filistin
  rationale: Ini adalah padanan Indonesia yang alami bagi idiom harfiah 'dari hadapan orang Filistin'; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: dan gugur
  rationale: Kolokasi ini menyatakan bahwa mereka jatuh sebagai orang-orang yang terbunuh dalam pertempuran. 'Gugur' ringkas, wajar, dan sesuai dengan konteks militer.
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: di Gunung Gilboa
  rationale: הַר dengan nama tempat secara alami diterjemahkan 'Gunung Gilboa'; 'di' merupakan preposisi lokasi yang wajar dalam bahasa Indonesia.
