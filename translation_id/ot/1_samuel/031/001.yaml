translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama mempertahankan nuansa tindakan yang sedang berlangsung, sedangkan kalimat kedua menyampaikan rangkaian pelarian dan kematian secara lugas. Pemisahan menjadi dua kalimat meningkatkan keterbacaan tanpa mengubah hubungan naratif.
