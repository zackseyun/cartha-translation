  rationale: יֹשְׁבֵי menunjuk kepada orang-orang yang mendiami tempat itu; 'penduduk' merupakan padanan Indonesia yang alami dan tepat. Nama tempat dipertahankan sebagai satu nama majemuk.
- source_word: אֵת אֲשֶׁר עָשׂוּ
  choice: apa yang telah dilakukan
  rationale: Mewakili klausa relatif Ibrani secara langsung dan tetap menyisakan isi tindakan untuk dijelaskan dalam ayat berikutnya.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk jamak etnonim diterjemahkan dengan sebutan kelompok yang lazim dalam bahasa Indonesia.
- source_word: לְשָׁאוּל
  choice: terhadap Saul
  rationale: Preposisi לְ di sini menandai sasaran tindakan; 'terhadap' lebih alami daripada 'kepada' untuk perbuatan yang dikenakan pada Saul.
