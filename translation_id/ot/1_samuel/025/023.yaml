  naturalness: Kalimat dapat dibuat lebih idiomatis dan jelas dengan "cepat-cepat turun dari keledai itu" serta "tersungkur di hadapan Daud dengan mukanya ke tanah." Pengulangan tindakan merendahkan diri tetap perlu dipertahankan karena teks Ibrani memakai dua verba.
  terminology: '"Bersujud" dapat dipahami dalam bahasa Indonesia sebagai tindakan hormat maupun ibadah. Dalam konteks antarmanusia ini, catatan kaki perlu secara eksplisit menyatakan bahwa yang dimaksud ialah penghormatan, bukan dengan sendirinya penyembahan. "Ke tanah" lebih langsung daripada "sampai ke tanah" untuk אַרְצָה.'
