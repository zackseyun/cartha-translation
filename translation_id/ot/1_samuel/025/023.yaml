base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: id
  text: Ketika Abigail melihat Daud, ia cepat-cepat turun dari keledai itu, lalu tersungkur di hadapan Daud dengan mukanya ke tanah dan bersujud ke tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membungkuk dalam-dalam sampai ke tanah.” Kata kerja Ibrani ini dapat menunjuk pada membungkuk sangat rendah atau merebahkan diri sebagai tanda hormat. Dalam konteks ini, tindakan Abigail kepada Daud adalah penghormatan, bukan dengan sendirinya penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: melihat
  rationale: Kata ראה di sini adalah verba umum untuk melihat; bentuk ini alami dan tidak menambahkan nuansa yang tidak dinyatakan.
- source_word: וַתְּמַהֵר
  choice: segera
  rationale: מהר menyatakan tindakan yang dilakukan dengan cepat. 'Segera' mempertahankan desakan naratif dalam bahasa Indonesia modern.
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: turun dari keledainya
  rationale: ירד berarti turun; dalam konteks menunggang hewan, ungkapan ini lebih alami daripada padanan yang terlalu teknis. Sufiks posesif dipakai secara wajar dalam bahasa Indonesia meskipun Ibrani memakai kata sandang.
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל־פָּנֶיהָ
  choice: menjatuhkan diri dengan muka ke tanah di hadapan Daud
  rationale: Terjemahan ini mempertahankan tindakan merendahkan diri di hadapan Daud dan keterangan konkret bahwa wajahnya menghadap atau menyentuh tanah, tanpa menambahkan 'di kaki Daud' yang tidak terdapat dalam teks.
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: bersujud sampai ke tanah
  rationale: שׁחה menggambarkan penghormatan dengan membungkuk sangat rendah atau merebahkan diri. 'Bersujud sampai ke tanah' menyampaikan gerak tubuh tersebut dengan jelas; catatan kaki menjaga rentang maknanya.
theological_decisions:
- issue: Makna שׁחה dalam perjumpaan antarmanusia
  choice: bersujud sampai ke tanah
  alternative: membungkuk dalam-dalam sampai ke tanah
  rationale: Karena tindakan ini ditujukan kepada Daud, frasa tersebut menyatakan penghormatan atau ketundukan sosial dan tidak dengan sendirinya berarti penyembahan ilahi. Terjemahan utama mempertahankan kuatnya gerak tubuh, sedangkan catatan kaki mencegah pembacaan teologis yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian tindakan dipertahankan sesuai urutan narasi Ibrani, sementara pengulangan gerak merendahkan diri tetap dijaga karena kedua verba dalam teks menggambarkan aspek yang berdekatan tetapi tidak identik.
