  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Padang belantara' dipilih untuk מִדְבָּר, dan 'tuan kita' mempertahankan hubungan sosial dalam rumah tangga Nabal. Semua penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya.
