base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: id
  text: Namun, salah seorang pemuda itu memberi tahu Abigail, istri Nabal, katanya, “Lihat, Daud mengirim utusan dari padang belantara untuk memberi salam[a] kepada tuan kita, dan ia membentak mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk memberkati.” Dalam konteks ini, kata Ibrani yang biasanya berarti “memberkati” mengacu pada penyampaian salam atau harapan baik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “menyerang mereka dengan kata-kata.” Kata kerja Ibrani ini sangat hidup dan dapat menggambarkan tindakan menerjang atau menyambar dengan agresif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: Namun, ... Abigail
  rationale: 'Konjungsi melanjutkan narasi sekaligus menandai peralihan yang berlawanan: sesudah Nabal menolak para utusan Daud, seorang pemuda melaporkannya kepada Abigail.'
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: salah seorang dari antara para pemuda itu
  rationale: Mempertahankan arti dasar נַעַר sebagai pemuda dan hubungan partitif dalam frasa Ibrani; konteks menunjukkan bahwa mereka juga anggota rumah tangga atau pelayan Nabal.
- source_word: הִגִּיד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; pilihan ini alami dalam bahasa Indonesia dan cocok dengan pengantar tuturan langsung.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Menyampaikan fungsi pengantar tuturan Ibrani secara wajar dan ringkas dalam narasi Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian Abigail kepada laporan yang penting dan mendesak; 'Lihat' mempertahankan daya deiktiknya tanpa gaya arkais.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks manusiawi dan diplomatis ini, kata tersebut menunjuk kepada orang-orang yang membawa pesan, bukan malaikat.
- source_word: מֵהַמִּדְבָּר
  choice: dari padang belantara
  rationale: Menggambarkan daerah liar tempat Daud dan orang-orangnya berada; ungkapan ini lebih tepat daripada 'gurun' yang dapat menyiratkan hamparan pasir.
- source_word: לְבָרֵךְ
  choice: untuk memberi salam
  rationale: Walaupun ברך biasanya berarti memberkati, dalam perjumpaan sosial kata ini dapat berarti menyampaikan salam atau harapan baik; konteks ayat 6–8 mendukung fungsi sapaan hormat.
- source_word: אֶת אֲדֹנֵינוּ
  choice: kepada tuan kita
  rationale: Dalam tuturan seorang anggota rumah tangga, אֲדוֹן menunjuk kepada Nabal sebagai tuan mereka, bukan gelar ilahi.
- source_word: וַיָּעַט בָּהֶם
  choice: tetapi ia membentak mereka
  rationale: Kata kerja yang hidup ini secara harfiah dapat menggambarkan gerakan menerjang atau menyambar; dalam konteks tanggapan lisan Nabal, 'membentak' menyampaikan ledakan verbal yang kasar dan agresif. 'Tetapi' memperjelas pertentangan pragmatis tanpa mengubah urutan peristiwa.
