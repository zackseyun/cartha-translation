  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: id
  text: Lalu Daud berkata kepada Abigail, “Terpujilah Yahweh, Allah Israel, yang mengutusmu hari ini[a] untuk menemuiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hari ini”; dapat juga diterjemahkan “hari yang ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa dalam narasi. “Lalu” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: לַאֲבִיגַל
  choice: kepada Abigail
  rationale: Preposisi ל menandai orang yang menjadi tujuan perkataan; “kepada Abigail” merupakan padanan Indonesia yang wajar.
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Partisip pasif ini berfungsi sebagai rumusan berkat atau doksologi. Dalam ungkapan Indonesia mengenai Allah, “Terpujilah” menyampaikan penghormatan dan berkat dengan bahasa yang alami serta khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel. Bentuk tanpa kata sandang paling alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif mengawali klausa yang menerangkan Yahweh; “yang” adalah padanan Indonesia yang tepat.
- source_word: שְׁלָחֵךְ
  choice: mengutusmu
  rationale: Verba perfektum dengan sufiks feminin tunggal menunjuk kepada tindakan Allah yang telah mengutus Abigail. “Mengutusmu” mempertahankan nuansa penugasan yang lebih kuat daripada sekadar “mengirimmu”.
- source_word: הַיּוֹם הַזֶּה
  choice: hari ini
  rationale: Ungkapan harfiah “hari yang ini” secara idiomatis berarti “hari ini” dalam bahasa Indonesia modern.
- source_word: לִקְרָאתִי
  choice: untuk menemuiku
  rationale: Bentuk infinitif dengan preposisi menyatakan tujuan atau hasil perjumpaan Abigail dengan Daud; “untuk menemuiku” jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Makna rumusan בָּרוּךְ ketika ditujukan kepada Allah
  choice: Terpujilah
  alternative: Diberkatilah
  rationale: “Terpujilah” merupakan rumusan doksologis Indonesia yang alami dan tidak menyiratkan bahwa Allah menerima berkat dari pihak yang lebih tinggi, sedangkan unsur makna berkat tetap tercermin dalam fungsi pujian tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Urutan naratif dinyatakan dengan “Lalu”; nama ilahi dipertahankan sebagai “Yahweh”. Penanda catatan kaki ditempatkan sesudah “hari ini”, sesuai dengan frasa Ibrani yang diterangkannya.
