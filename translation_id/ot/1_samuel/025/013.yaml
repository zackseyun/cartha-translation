  text: וַ/יֹּאמֶר֩ דָּוִ֨ד לַ/אֲנָשָׁ֜י/ו חִגְר֣וּ אִ֣ישׁ אֶת חַרְבּ֗/וֹ וַֽ/יַּחְגְּרוּ֙ אִ֣ישׁ אֶת חַרְבּ֔/וֹ וַ/יַּחְגֹּ֥ר גַּם דָּוִ֖ד אֶת חַרְבּ֑/וֹ וַֽ/יַּעֲל֣וּ אַחֲרֵ֣י דָוִ֗ד כְּ/אַרְבַּ֤ע מֵאוֹת֙ אִ֔ישׁ וּ/מָאתַ֖יִם יָשְׁב֥וּ עַל הַ/כֵּלִֽים׀־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: id
  text: Lalu Daud berkata kepada orang-orangnya, “Kenakanlah pedang kalian masing-masing!” Maka setiap orang mengenakan pedangnya, dan Daud juga mengenakan pedangnya. Kira-kira empat ratus orang naik mengikuti Daud, sedangkan dua ratus orang tetap tinggal bersama perbekalan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersama barang-barang bawaan” atau “di dekat perlengkapan.”
    reason: Kata Ibrani כֵּלִים dapat menunjuk pada perbekalan, barang bawaan, atau perlengkapan, sedangkan עַל dalam konteks ini dapat berarti berada bersama atau di dekatnya.
lexical_decisions:
- source_word: חִגְרוּ
  choice: Sandanglah
  rationale: Dalam konteks militer, חגר berarti memasang atau mengenakan senjata pada ikat pinggang. “Sandanglah” konkret, ringkas, dan wajar untuk tindakan mengenakan pedang.
- source_word: אִישׁ אֶת־חַרְבּוֹ
  choice: pedang kalian masing-masing / mereka masing-masing menyandang pedangnya
  rationale: Konstruksi distributif אִישׁ ... חַרְבּוֹ menyatakan bahwa setiap orang mengenakan pedangnya sendiri. Susunan ini mempertahankan daya distributifnya dalam bahasa Indonesia alami.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: חֶרֶב secara khusus berarti “pedang”, sehingga tidak digeneralisasi menjadi “senjata”.
- source_word: גַּם
  choice: juga
  rationale: Kata ini menegaskan bahwa Daud sendiri turut mempersenjatai diri bersama orang-orangnya.
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: maju mengikuti Daud
  rationale: עלה dapat menyatakan gerak naik atau maju, sedangkan אַחֲרֵי menunjukkan gerak mengikuti di belakang. “Maju mengikuti” menyampaikan gerak rombongan secara alami tanpa memaksakan gambaran medan yang tidak disebutkan.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: kira-kira empat ratus orang
  rationale: Prefiks כ־ pada bilangan menunjukkan perkiraan, yang diterjemahkan secara jelas dengan “kira-kira”.
- source_word: יָשְׁבוּ
  choice: tetap tinggal
  rationale: Walaupun arti dasarnya dapat berupa “duduk”, dalam konteks ini kata tersebut berarti tetap berada di belakang dan tidak ikut maju.
- source_word: עַל־הַכֵּלִים
  choice: bersama perbekalan
  rationale: כֵּלִים memiliki cakupan luas, termasuk barang, perlengkapan, dan bawaan. Dalam konteks rombongan bersenjata, “perbekalan” merupakan padanan ringkas dan alami; kemungkinan lain dicatat dalam catatan kaki.
- source_word: לַאֲנָשָׁיו
  choice: kepada orang-orangnya
  rationale: אֲנָשִׁים di sini menunjuk kepada kelompok laki-laki yang menyertai Daud. “Orang-orangnya” mempertahankan hubungan tersebut tanpa menambahkan status “hamba” yang tidak dinyatakan oleh kata ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Imperatif dibuat langsung dan idiomatis, sementara pengulangan tindakan menyandang pedang dipertahankan untuk mengikuti penekanan teks Ibrani.
