revisions:
- from: Lalu Daud berkata kepada orang-orangnya, “Sandanglah pedang kalian masing-masing.” Maka mereka masing-masing menyandang pedangnya, dan Daud juga menyandang pedangnya. Kira-kira empat ratus orang maju mengikuti Daud, sedangkan dua ratus orang tetap tinggal bersama perbekalan[a].
  to: Lalu Daud berkata kepada orang-orangnya, “Kenakanlah pedang kalian masing-masing!” Maka setiap orang mengenakan pedangnya, dan Daud juga mengenakan pedangnya. Kira-kira empat ratus orang naik mengikuti Daud, sedangkan dua ratus orang tetap tinggal bersama perbekalan[a].
  rationale: Revisi memakai “kenakanlah” untuk tindakan mengenakan pedang yang lebih idiomatis, mempertahankan daya distributif dengan “setiap orang,” dan mengganti “maju” dengan “naik” agar unsur arah pada עלה tidak hilang. Makna, jumlah perkiraan, dan ambiguitas mengenai כֵּלִים tetap dipertahankan.
