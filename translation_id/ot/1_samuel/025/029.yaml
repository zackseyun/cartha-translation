revisions:
- from: Sekalipun seseorang bangkit untuk mengejar Tuanku dan mengincar nyawa Tuanku, nyawa Tuanku akan tetap terikat dengan aman dalam ikatan orang-orang hidup bersama Yahweh, Allah Tuanku.[a] Namun, nyawa musuh-musuh Tuanku akan dilontarkan-Nya dari kantong umban.[b]
  to: Sekalipun seorang laki-laki bangkit untuk mengejar Tuanku dan mengincar nyawa Tuanku, nyawa Tuanku akan terikat dalam ikatan kehidupan[a] bersama Yahweh, Allah Tuanku. Namun, nyawa musuh-musuh Tuanku akan dilontarkan-Nya dari kantong umban.[b]
  rationale: Revisi mempertahankan seluruh struktur dan citra pokok teks Ibrani, sambil memperbaiki ketepatan gender kontekstual, menghilangkan tambahan eksplisit “dengan aman,” dan memakai ungkapan Indonesia yang lebih alami untuk צְרוֹר הַחַיִּים. Letak penanda a dipindahkan ke frasa yang dijelaskannya dan isi catatan kaki diselaraskan dengan teks utama.
