base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: id
  text: Sekalipun seorang laki-laki bangkit untuk mengejar Tuanku dan mengincar nyawa Tuanku, nyawa Tuanku akan terikat dalam ikatan kehidupan[a] bersama Yahweh, Allah Tuanku. Namun, nyawa musuh-musuh Tuanku akan dilontarkan-Nya dari kantong umban.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terikat dalam ikatan orang-orang hidup.” Gambaran Ibraninya ialah sesuatu yang dibungkus atau diikat untuk disimpan dan dilindungi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tengah cekungan umban.” Kata kerjanya secara khusus menggambarkan tindakan mengumban, sebagai kontras dengan nyawa Tuanku yang terikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: Sekalipun seseorang bangkit
  rationale: Waw dengan bentuk qatal menyatakan keadaan konsesif dalam ucapan Abigail. 'Seseorang' alami dalam bahasa Indonesia dan tetap menunjukkan seorang individu, yakni pengejar konkret dalam konteks.
- source_word: לִרְדָפְךָ וּלְבַקֵּשׁ אֶת־נַפְשֶׁךָ
  choice: untuk mengejar Tuanku dan mengincar nyawa Tuanku
  rationale: '''Mengejar'' mempertahankan sifat permusuhan רדף. Dalam konteks ancaman maut, בקש את־נפש berarti berusaha mengambil nyawa; ''mengincar nyawa'' menyampaikan maksud itu secara alami tanpa mengartikannya sebagai ''jiwa'' abstrak.'
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: nyawa Tuanku
  rationale: נפש di sini menunjuk pada hidup atau nyawa David. 'Tuanku' mempertahankan sapaan hormat Abigail dan cocok dengan pronomina maskulin tunggal dalam bahasa sumber.
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: terikat dengan aman dalam ikatan orang-orang hidup
  rationale: Terjemahan ini mempertahankan permainan citra akar צרר ('terikat'/'ikatan') serta bentuk jamak substantival החיים. Tambahan 'dengan aman' menjelaskan fungsi metafora sebagai penyimpanan terlindung tanpa menghilangkan gambaran konkretnya.
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: bersama Yahweh, Allah Tuanku
  rationale: אֵת dipahami sebagai penanda kebersamaan atau persekutuan. Nama ilahi ditransliterasikan 'Yahweh', sedangkan bentuk orang kedua maskulin tunggal dipadankan dengan sapaan hormat 'Tuanku'.
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: Namun, nyawa musuh-musuh Tuanku
  rationale: נפש berbentuk tunggal tetapi berkaitan dengan 'musuh-musuh' yang jamak dan dapat dipahami secara kolektif. Bentuk tunggal 'nyawa' dalam bahasa Indonesia mempertahankan bentuk Ibrani dan kontras dengan nyawa David.
- source_word: יְקַלְּעֶנָּה
  choice: akan dilontarkan-Nya
  rationale: Verba קלע secara khusus membangkitkan tindakan mengumban. Bentuk '-Nya' menyatakan bahwa Yahweh adalah pelaku tersirat dan mempertahankan citra umban.
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: dari kantong umban
  rationale: כף secara harfiah adalah telapak atau cekungan; pada umban, kata ini menunjuk pada kantong tempat batu diletakkan. 'Kantong umban' merupakan padanan konkret dan mudah dipahami.
theological_decisions:
- issue: Kontras metaforis antara pemeliharaan David dan pembuangan musuh-musuhnya
  choice: Mempertahankan citra terikat aman dalam suatu ikatan dan dilontarkan dari umban
  alternative: Menafsirkannya secara eksplisit sebagai hidup kekal, atau meratakannya menjadi perlindungan dan kekalahan secara umum
  rationale: Bahasa Ibrani memakai dua gambaran konkret yang berlawanan. Ayat ini menegaskan pemeliharaan ilahi dan penyingkiran musuh, tetapi tidak dengan sendirinya merumuskan doktrin terperinci mengenai kehidupan sesudah mati.
- issue: Identitas pelaku dalam יְקַלְּעֶנָּה
  choice: Yahweh dipahami sebagai pelaku tersirat, dinyatakan dengan '-Nya'
  alternative: Membiarkan pelakunya tidak jelas atau menjadikan 'umban' sebagai pelaku
  rationale: Klausa sebelumnya menyebut Yahweh, Allah David, dan bentuk maskulin tunggal verba paling wajar kembali kepada-Nya, meskipun subjek tidak disebut ulang secara eksplisit.
- issue: Makna צְרוֹר הַחַיִּים
  choice: ikatan orang-orang hidup
  alternative: ikatan kehidupan
  rationale: החיים dapat dibaca sebagai bentuk substantival, 'orang-orang hidup', atau secara lebih idiomatis sebagai 'kehidupan'. Teks utama mempertahankan bentuk jamak substantival, sedangkan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Tuanku' dipakai untuk sapaan hormat Abigail kepada David dan juga dalam frasa 'Allah Tuanku'. Metafora Ibrani dipertahankan, tetapi unsur yang kurang lazim dijelaskan melalui catatan kaki.
