  - severity: medium
    issue: Hubungan sintaksis dua frasa “karena”
    rationale: Frasa לִשְׁפֹּךְ ... וּלְהוֹשִׁיעַ menjelaskan isi dari batu sandungan/penyesalan yang dihindari. Dengan titik dua dan klausa penjelas, hubungan ini lebih jelas daripada pembacaan kausal langsung.
