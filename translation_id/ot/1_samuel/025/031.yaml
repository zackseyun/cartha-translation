revisions:
- from: Dan hal ini tidak akan menjadi alasan penyesalan bagimu[a] atau batu sandungan bagi hati tuanku[b], karena menumpahkan darah tanpa alasan dan karena tuanku menuntut pembalasan bagi dirinya sendiri[c]. Apabila Yahweh berbuat baik kepada tuanku, ingatlah hambamu ini[d].
  to: 'Dan hal ini tidak akan menjadi alasan bagi tuanku untuk menyesal[a] atau batu sandungan bagi hati tuanku[b]: bahwa tuanku telah menumpahkan darah tanpa alasan dan telah melakukan pembalasan bagi dirinya sendiri[c]. Ketika Yahweh telah berbuat baik kepada tuanku, ingatlah akan hambamu perempuan ini[d].'
  rationale: Revisi memperjelas bahwa yang dimaksud ialah kemungkinan penyesalan atau gangguan batin karena David telah menumpahkan darah tanpa alasan dan mengambil pembalasan sendiri. “Melakukan pembalasan bagi dirinya sendiri” menghindari arti Indonesia yang keliru dari “menuntut pembalasan,” sementara catatan kaki tetap melestarikan arti harfiah verba Ibrani yang diperdebatkan. Penambahan “perempuan” dalam teks utama mencerminkan bentuk feminin אֲמָתֶךָ tanpa mengganggu register rendah hati Abigail.
