  naturalness: Bahasa draf umumnya baku. “Alasan penyesalan” agak kurang idiomatis dibandingkan “alasan untuk menyesal,” dan peralihan “bagimu ... hati tuanku” kurang lancar dalam satu kalimat, walaupun kedua-duanya merujuk kepada David.
  terminology: “Yahweh,” “tuanku,” dan “hambamu perempuan” sesuai dengan teks dan register. Metafora “batu sandungan bagi hati” patut dipertahankan dengan catatan. Terjemahan tindakan David perlu menyatakan tindakan pembalasan yang dilakukan sendiri, sambil catatan kaki tetap menjaga arti dasar “menyelamatkan dirinya sendiri.”
