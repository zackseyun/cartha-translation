base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/031.yaml
  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: id
  text: 'Dan hal ini tidak akan menjadi alasan bagi tuanku untuk menyesal[a] atau batu sandungan bagi hati tuanku[b]: bahwa tuanku telah menumpahkan darah tanpa alasan dan telah melakukan pembalasan bagi dirinya sendiri[c]. Ketika Yahweh telah berbuat baik kepada tuanku, ingatlah akan hambamu perempuan ini[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini jarang ditemukan. Kata itu juga dapat berarti sesuatu yang menyebabkan keguncangan, pelanggaran, atau penyesalan yang menyakitkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “batu sandungan hati”; maksudnya dapat mencakup beban batin atau hati nurani yang terganggu.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “menyelamatkan dirinya sendiri.” Dalam konteks ini, Abigail berbicara tentang David yang mengambil pembalasan ke dalam tangannya sendiri.
    reason: lexical_alternative
  - marker: d
    text: Kata Ibraninya secara khusus berarti “hambamu perempuan,” sebutan diri yang merendah yang digunakan Abigail.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפוּקָה
  choice: alasan penyesalan
  rationale: Nomina langka ini menunjuk pada sesuatu yang kemudian mengguncangkan atau menimbulkan penyesalan yang menyakitkan. Pilihan ini menyampaikan akibat moral yang Abigail ingin David hindari tanpa menutup kemungkinan nuansa lain.
- source_word: מִכְשׁוֹל לֵב
  choice: batu sandungan bagi hati
  rationale: Terjemahan ini mempertahankan metafora Ibrani secara cukup harfiah; dalam konteksnya, ungkapan itu menunjuk pada beban batin atau hati nurani yang terganggu.
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat Abigail kepada David; dalam konteks ini kata tersebut tidak menunjuk pada keilahian.
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: karena menumpahkan darah tanpa alasan
  rationale: חִנָּם di sini berarti tanpa alasan atau pembenaran yang layak, bukan sekadar tanpa imbalan.
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: karena tuanku menuntut pembalasan bagi dirinya sendiri
  rationale: Secara leksikal frasa ini dapat berarti menyelamatkan atau melepaskan dirinya sendiri, tetapi dalam alur cerita tindakan yang dimaksud ialah David memperoleh pembelaan dengan tangannya sendiri melalui kekerasan. Catatan kaki mempertahankan arti lebih harfiahnya.
- source_word: וְהֵיטִב יְהוָה
  choice: Apabila Yahweh berbuat baik
  rationale: Bentuk verbal ini berorientasi pada tindakan Yahweh yang masih akan terjadi. 'Apabila' mengungkapkan hubungan temporal-kondisional yang wajar dalam ucapan Abigail.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲמָתֶךָ
  choice: hambamu ini
  rationale: Istilah ini secara gramatikal feminin dan merupakan sebutan diri Abigail yang merendah. Ungkapan utama dibuat idiomatis dalam bahasa Indonesia, sedangkan unsur femininnya dijelaskan dalam catatan.
theological_decisions:
- issue: Makna tindakan David dalam לְהוֹשִׁיעַ ... לוֹ
  choice: menuntut pembalasan bagi dirinya sendiri
  alternative: menyelamatkan dirinya sendiri
  rationale: Konteks naratif menyoroti bahaya David mengambil pembalasan ke dalam tangannya sendiri, tetapi arti dasar verba 'menyelamatkan' tetap dicatat agar ambiguitas leksikal tidak dihapus.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'tuanku' mempertahankan sikap hormat Abigail, sedangkan 'hambamu ini' terdengar alami dalam ujaran langsung. Metafora 'batu sandungan bagi hati' sengaja dipertahankan dan diterangkan melalui catatan kaki.
