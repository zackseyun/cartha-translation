  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: id
  text: Ampunilah pelanggaran hamba perempuanmu ini, sebab Yahweh pasti akan menegakkan dinasti yang teguh bagi tuanku, karena tuanku berperang dalam peperangan Yahweh, dan kejahatan tidak akan didapati dalam dirimu seumur hidupmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: Ampunilah pelanggaran
  rationale: Ungkapan harfiah 'angkatlah/tanggunglah kiranya pelanggaran' secara idiomatis merupakan permohonan pengampunan. Bentuk imperatif bahasa Indonesia menyampaikan daya permohonannya secara wajar.
- source_word: אֲמָתֶךָ
  choice: hambamu ini
  rationale: Istilah Ibrani menunjuk pada pelayan perempuan dan dipakai Abigail sebagai ungkapan merendahkan diri. Dalam bahasa Indonesia, 'hambamu' sudah alami dalam sapaan hormat, sedangkan 'ini' memperjelas rujukan kepada si pembicara tanpa memaksakan bentuk yang kaku.
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: pasti akan membangun
  rationale: Infinitif absolut bersama verba finit memberi penegasan kuat. 'Pasti akan' mempertahankan intensifikasi itu.
- source_word: לַאדֹנִי
  choice: bagi tuanku
  rationale: Abigail menyapa Daud dengan penuh hormat. 'Tuanku' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: בַּיִת נֶאֱמָן
  choice: sebuah keluarga yang teguh
  rationale: Kata 'rumah' di sini menunjuk pada keluarga atau garis keturunan yang bertahan. 'Keluarga yang teguh' menyampaikan makna dinastik secara alami tanpa sepenuhnya menggantinya dengan istilah teknis 'dinasti'.
- source_word: מִלְחֲמוֹת יְהוָה
  choice: peperangan-peperangan Yahweh
  rationale: Bentuk jamak dipertahankan, dan konstruksi kepunyaan membiarkan relasi tepatnya—peperangan demi Yahweh atau dalam perkara-Nya—tetap tersirat.
- source_word: נִלְחָם
  choice: berperang
  rationale: Partisip Ibrani menggambarkan tindakan yang berlangsung atau menjadi ciri tuanku; bentuk Indonesia ini cocok dalam klausa tersebut.
- source_word: וְרָעָה
  choice: kejahatan
  rationale: רָעָה dapat berarti kejahatan, kemalangan, atau bahaya. 'Kejahatan' mempertahankan dimensi moral yang paling sesuai dengan seruan Abigail agar Daud tidak menumpahkan darah.
- source_word: לֹא תִמָּצֵא בְךָ
  choice: tidak akan didapati dalam dirimu
  rationale: Terjemahan ini mempertahankan konstruksi pasif dan bahasa moral internal teks tanpa mengubahnya menjadi tuduhan hukum yang lebih khusus.
- source_word: מִיָּמֶיךָ
  choice: seumur hidupmu
  rationale: Ungkapan Ibrani secara idiomatis mencakup seluruh masa hidup seseorang; padanan ini alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Makna dinastik בַּיִת נֶאֱמָן
  choice: sebuah keluarga yang teguh
  alternative: sebuah dinasti yang langgeng; sebuah rumah yang teguh
  rationale: Konteks menunjuk pada keluarga atau garis keturunan Daud yang akan diteguhkan. Terjemahan utama mengomunikasikan makna itu dengan bahasa Indonesia yang wajar, sementara catatan kaki mencatat metafora harfiah dan kemungkinan 'dinasti'.
- issue: Cakupan רָעָה
  choice: kejahatan
  alternative: malapetaka; kesalahan; bahaya
  rationale: Konteks dekat menyoroti bahaya kesalahan moral dan hutang darah. Namun kata Ibraninya luas; 'kejahatan' mempertahankan bobot moral tanpa menentukan kesalahan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'tuanku' dan bentuk 'hambamu' mempertahankan kesantunan serta kerendahan diri Abigail. Nama ilahi ditulis 'Yahweh'. Metafora 'rumah' dijelaskan dalam catatan kaki agar makna dinastiknya tidak hilang.
