  - severity: low
    issue: “peperangan-peperangan Yahweh”
    rationale: Pengulangan nomina ini kaku dalam bahasa Indonesia. Nomina kolektif “peperangan Yahweh” menyampaikan konstruksi Ibrani secara lebih wajar.
  - severity: low
    issue: Jenis kelamin אֲמָתֶךָ tidak tersurat
    rationale: “Hambamu ini” dapat dipakai secara umum, tetapi istilah sumber secara khusus adalah hamba perempuan. Penambahan “perempuan” dapat dilakukan secara alami dalam register ini.
  revised_text: Ampunilah pelanggaran hamba perempuanmu ini, sebab Yahweh pasti akan menegakkan dinasti yang teguh bagi tuanku, karena tuanku berperang dalam peperangan Yahweh, dan kejahatan tidak akan didapati dalam dirimu seumur hidupmu.
