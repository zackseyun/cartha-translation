  yaml_path: translation/ot/1_samuel/025/042.yaml
  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: id
  text: Abigail segera bangkit dan menunggang keledai, sementara lima pelayan perempuannya berjalan mengikutinya. Ia pergi mengikuti para utusan Daud dan menjadi istrinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: segera bersiap
  rationale: Gabungan verba ini menyatakan tindakan Abigail yang cepat untuk bangkit dan berangkat; 'segera bersiap' alami dalam bahasa Indonesia tanpa mempertahankan pengulangan yang kaku.
- source_word: נַעֲרֹתֶיהָ
  choice: pelayan perempuannya
  rationale: Dalam konteks rombongan Abigail, kata ini menunjuk perempuan-perempuan muda yang melayaninya, bukan sekadar perempuan muda tanpa fungsi tertentu.
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: berjalan mengikutinya
  rationale: Ungkapan harfiah 'berjalan pada kakinya' merupakan idiom untuk mengikuti atau mendampingi dengan berjalan kaki.
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: Ia mengikuti para utusan Daud
  rationale: '''Utusan'' sesuai dengan מַלְאָךְ dalam konteks manusia, sedangkan ''mengikuti'' mempertahankan urutan perjalanan di belakang mereka.'
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Ungkapan Ibrani biasa ini menyatakan bahwa Abigail menjadi istri Daud.
