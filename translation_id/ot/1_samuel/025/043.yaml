  text: וְ/אֶת אֲחִינֹ֛עַם לָקַ֥ח דָּוִ֖ד מִֽ/יִּזְרְעֶ֑אל וַ/תִּהְיֶ֛יןָ גַּֽם שְׁתֵּי/הֶ֥ן ל֖/וֹ לְ/נָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/043.yaml
  text: David also took Ahinoam of Jezreel[b][a], and both of them became his wives.
translation:
  language: id
  text: Daud juga mengambil Ahinoam dari Yizreel, dan keduanya menjadi istri-istri Daud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָקַח
  choice: mengambil
  rationale: Makna dasarnya ialah “mengambil”. Dalam konteks ini tindakan tersebut berarti mengambil seorang perempuan sebagai istri, dan klausa berikutnya memperjelas hubungan perkawinan itu.
- source_word: אֲחִינֹעַם
  choice: Ahinoam
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִיִּזְרְעֶאל
  choice: dari Yizreel
  rationale: Preposisi מִן yang melekat pada nama tempat secara langsung menyatakan asal, yaitu “dari Yizreel”.
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: dan kedua perempuan itu menjadi
  rationale: Kata kerja feminin jamak dan ungkapan “keduanya” merujuk kepada Abigail dan Ahinoam. Kata “menjadi” mempertahankan nilai verbal היה.
- source_word: לְנָשִׁים
  choice: istrinya
  rationale: Ungkapan לּוֹ לְנָשִׁים berarti mereka menjadi istri-istri baginya. Dalam bahasa Indonesia, “kedua perempuan itu menjadi istrinya” secara alami tetap menyatakan bahwa keduanya adalah istri Daud.
- source_word: גַּם
  choice: juga
  rationale: 'Partikel ini menandai tambahan: selain Abigail, Daud mengambil Ahinoam.'
theological_decisions:
- issue: Penggambaran perkawinan poligini
  choice: Ayat diterjemahkan secara deskriptif dengan menyatakan bahwa kedua perempuan itu menjadi istri Daud.
  alternative: Menggunakan ungkapan halus yang menyamarkan bahwa Daud mempunyai dua istri.
  rationale: Teks Ibrani dengan jelas menyatakan bahwa kedua perempuan tersebut menjadi istri Daud. Terjemahan tidak menyamarkan ataupun memberi penilaian moral yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. “Mengambil” mempertahankan bentuk ungkapan Ibrani, sedangkan klausa berikutnya menjelaskan makna perkawinannya. Nama tempat menggunakan bentuk “Yizreel” yang dekat dengan transliterasi Ibrani.
