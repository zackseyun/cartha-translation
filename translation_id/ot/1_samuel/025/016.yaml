  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: id
  text: Mereka adalah tembok di sekeliling kami[a], baik pada malam maupun siang hari, selama kami berada bersama mereka, sambil menggembalakan kawanan ternak itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di atas kami.” Dalam konteks ini, ungkapan tersebut menggambarkan kehadiran yang melindungi mereka seperti tembok.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani צאן adalah istilah kolektif yang dapat mencakup domba dan kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: tembok
  rationale: Mempertahankan gambaran konkret dalam bahasa Ibrani; dalam konteks ini tembok berfungsi sebagai metafora perlindungan.
- source_word: הָיוּ
  choice: bagaikan
  rationale: Secara harfiah berarti “adalah,” tetapi konstruksi metaforis “mereka adalah tembok” diungkapkan secara alami dalam bahasa Indonesia dengan “mereka bagaikan tembok,” tanpa menghilangkan citra sumber.
- source_word: עָלֵינוּ
  choice: di sekeliling kami
  rationale: Preposisi עַל biasanya berarti “di atas/atas,” tetapi bersama kata “tembok” di sini menyatakan kehadiran yang melindungi. “Di sekeliling kami” menyampaikan makna kontekstual dengan wajar.
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: baik pada malam maupun siang hari
  rationale: Konstruksi berpasangan גַּם...גַּם menekankan perlindungan yang berlangsung sepanjang malam dan siang.
- source_word: כָּל יְמֵי הֱיוֹתֵנוּ עִמָּם
  choice: selama kami bersama mereka
  rationale: Ungkapan waktu harfiah “sepanjang hari-hari keberadaan kami bersama mereka” diterjemahkan secara alami tanpa mengurangi cakupan waktunya.
- source_word: רֹעִים
  choice: menggembalakan
  rationale: Partisipel dari רעה menunjuk pada kegiatan menjaga dan merawat ternak di padang.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil dan dapat mencakup domba serta kambing; “kawanan ternak” tidak mempersempitnya hanya menjadi domba.
