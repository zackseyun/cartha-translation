  text: וַ/יְהִ֖י כַּ/עֲשֶׂ֣רֶת הַ/יָּמִ֑ים וַ/יִּגֹּ֧ף יְהוָ֛ה אֶת נָבָ֖ל וַ/יָּמֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: id
  text: Kira-kira sepuluh hari kemudian[a], Yahweh menghantam Nabal, lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setelah kira-kira sepuluh hari.” Ungkapan Ibraninya menunjukkan jangka waktu kurang lebih sepuluh hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: kemudian
  rationale: Bentuk naratif ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia, “kemudian” menyampaikan urutan secara alami tanpa terjemahan kaku “dan terjadilah”.
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: kira-kira sepuluh hari kemudian
  rationale: Prefiks כ־ menyatakan perkiraan, sedangkan keseluruhan ungkapan menunjukkan selang waktu sekitar sepuluh hari.
- source_word: וַיִּגֹּף
  choice: menghantam
  rationale: Kata נָגַף menunjuk pada tindakan memukul atau menimpakan pukulan, khususnya sebagai tindakan ilahi. “Menghantam” mempertahankan daya ungkapnya tanpa menentukan sarana atau penyakit tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶת נָבָל
  choice: Nabal
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama נָבָל ditransliterasikan menurut bentuk yang lazim.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Klausa ini menyatakan peristiwa berikut dalam urutan naratif. “Lalu ia mati” menjaga kaitan eratnya dengan tindakan Yahweh tanpa melebur kedua verba menjadi ungkapan yang lebih interpretatif seperti “menghantamnya hingga mati”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama pribadi ilahi. Bentuk “Yahweh” mempertahankan nama itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Derajat kausalitas dalam penghukuman ilahi
  choice: Yahweh menghantam Nabal, lalu ia mati
  alternative: Yahweh menghantam Nabal sampai mati
  rationale: 'Bahasa Ibrani memakai dua verba berurutan: Yahweh menghantam Nabal, kemudian Nabal mati. Terjemahan mempertahankan urutan dan kaitan tersebut tanpa melebur keduanya menjadi rumusan kausal yang lebih eksplisit daripada teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. “Kira-kira” mudah dipahami pembaca umum, sedangkan “menghantam” menjaga kekuatan verba Ibrani tanpa memakai bentuk arkais atau menyebut mekanisme kematian yang tidak dinyatakan teks.
