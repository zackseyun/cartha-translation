base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: id
  text: Haruskah aku mengambil rotiku, airku, dan daging yang telah kusembelih untuk para pencukur bulu dombaku[a], lalu memberikannya kepada orang-orang yang tidak kuketahui dari mana asal mereka?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pencukurku”; yang dimaksud ialah para pekerja yang mencukur bulu domba milik Nabal.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “dan aku akan mengambil ... dan aku akan memberikan”; bentuk verba Ibrani itu digunakan dalam pertanyaan retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי
  choice: Haruskah aku mengambil
  rationale: Bentuk qatal orang pertama tunggal dengan waw dipakai dalam pertanyaan retoris yang bernada geram; terjemahan ini menyampaikan fungsi deliberatifnya secara alami.
- source_word: לַחְמִי וְאֶת־מֵימַי
  choice: rotiku, airku
  rationale: Mempertahankan benda konkret dan pengulangan akhiran milik orang pertama yang menonjol dalam ucapan Nabal.
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: daging yang telah kusembelih
  rationale: Mengungkapkan hubungan akar kata sembelih pada nomina dan verba tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: לְגֹזְזָי
  choice: untuk para pencukur bulu dombaku
  rationale: Partisip ini berarti orang-orang yang mencukur; konteksnya adalah pencukuran bulu domba. Penyebutan domba memperjelas rujukan budaya bagi pembaca modern.
- source_word: וְנָתַתִּי לָאֲנָשִׁים
  choice: lalu memberikannya kepada orang-orang
  rationale: Kata ganti -nya merujuk secara kolektif pada perbekalan yang baru disebutkan; orang-orang mempertahankan bentuk jamak manusia tanpa menambah demonstrativa yang tidak ada dalam Ibrani.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: yang tidak kuketahui dari mana asal mereka
  rationale: Menyampaikan klaim Nabal bahwa ia tidak mengetahui identitas atau asal mereka, sambil mempertahankan susunan pertanyaan tentang asal-usul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan geram yang sesuai dengan ucapan Nabal. Bentuk kepunyaan -ku dipertahankan berulang kali untuk mencerminkan penekanan egoistis dalam teks sumber.
