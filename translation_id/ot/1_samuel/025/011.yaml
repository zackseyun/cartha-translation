  terminology: “Daging yang telah kusembelih” memadai untuk טִבְחָתִי אֲשֶׁר טָבַחְתִּי dan mempertahankan unsur penyembelihan. Catatan kaki a menjelaskan rujukan budaya secara tepat, sedangkan catatan b menjelaskan pilihan bentuk retoris dan dipasang pada lokasi yang sesuai.
