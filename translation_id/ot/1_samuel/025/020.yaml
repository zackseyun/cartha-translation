  text: וְ/הָיָ֞ה הִ֣יא רֹכֶ֣בֶת עַֽל הַ/חֲמ֗וֹר וְ/יֹרֶ֨דֶת֙ בְּ/סֵ֣תֶר הָ/הָ֔ר וְ/הִנֵּ֤ה דָוִד֙ וַ/אֲנָשָׁ֔י/ו יֹרְדִ֖ים לִ/קְרָאתָ֑/הּ וַ/תִּפְגֹּ֖שׁ אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: id
  text: Ketika Abigail sedang menunggang seekor keledai dan turun di bagian gunung yang terlindung[a], tampaklah Daud dan orang-orangnya sedang turun ke arahnya, lalu ia bertemu dengan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sisi gunung yang tersembunyi.” Frasa Ibrani ini menunjuk pada bagian gunung yang tersembunyi atau terlindung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: Ketika Abigail sedang
  rationale: Konstruksi naratif dengan היה dan partisipel memperkenalkan keadaan yang sedang berlangsung. Nama Abigail dinyatakan agar rujukan pronominal alami dan jelas dalam bahasa Indonesia.
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: menunggang keledai
  rationale: Terjemahan langsung dan wajar untuk tindakan רכב serta nomina umum חמור.
- source_word: וְיֹרֶדֶת
  choice: dan menuruni
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung; bentuk transitif ini alami dengan lokasi lereng gunung yang tersirat dalam frasa berikutnya.
- source_word: בְּסֵתֶר הָהָר
  choice: bagian gunung yang terlindung
  rationale: סֵתֶר menyatakan tempat yang tersembunyi, tertutup, atau terlindung. Pilihan ini mempertahankan gambaran topografis tanpa menentukan secara berlebihan apakah tempat itu berada di balik atau di bawah gunung.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Mempertahankan fungsi הִנֵּה yang mengarahkan perhatian pada perkembangan mendadak dalam adegan, dengan gaya naratif Indonesia yang bermartabat.
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: sedang turun ke arahnya
  rationale: לִקְרָאת dapat menunjukkan gerak menuju atau untuk menemui seseorang. 'Ke arahnya' mempertahankan arah gerak tanpa memastikan maksud pertemuan.
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: lalu ia berpapasan dengan mereka
  rationale: פגש berarti bertemu atau berjumpa. 'Berpapasan' sesuai dengan dua pihak yang bergerak saling mendekat dan menghindari pengulangan konsep 'menemui'.
