revisions:
- from: Ketika Abigail sedang menunggang keledai dan menuruni bagian gunung yang terlindung[a], tampaklah Daud dan orang-orangnya sedang turun ke arahnya, lalu ia berpapasan dengan mereka.
  to: Ketika Abigail sedang menunggang seekor keledai dan turun di bagian gunung yang terlindung[a], tampaklah Daud dan orang-orangnya sedang turun ke arahnya, lalu ia bertemu dengan mereka.
  rationale: Revisi memperbaiki relasi sintaktis frasa topografis agar mencerminkan בְּסֵתֶר הָהָר sebagai keterangan tempat bagi tindakan turun, bukan sebagai objek langsung yang dituruni. Kata "bertemu" menggantikan "berpapasan" untuk mempertahankan keluasan makna פגש. Ambiguitas mengenai lokasi tepatnya—sisi, kawasan tersembunyi, atau tempat terlindung—tetap dijaga dalam teks dan catatan kaki.
