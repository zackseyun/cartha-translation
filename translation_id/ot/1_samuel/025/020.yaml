translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Penanda perhatian הִנֵּה dipertahankan sebagai 'tampaklah', sedangkan ambiguitas topografis בְּסֵתֶר הָהָר dijaga melalui teks utama dan catatan kaki.
