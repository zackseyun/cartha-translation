base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: id
  text: 'Katakanlah begini kepadanya: ‘Semoga panjang umur![a] Damai sejahtera bagimu,[b] damai sejahtera bagi rumah tanggamu, dan damai sejahtera bagi segala yang kaumiliki.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini secara harfiah berkaitan dengan “hidup” dan kemungkinan merupakan salam atau berkat. Terjemahan lain yang mungkin ialah “kepada orang yang hidup” atau, secara lebih umum, “salam.”
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani syalom dapat mencakup damai, kesejahteraan, keutuhan, keamanan, dan kemakmuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Katakanlah
  rationale: Bentuk waw + perfek melanjutkan perintah Daud dan secara wajar dinyatakan sebagai imperatif dalam bahasa Indonesia.
- source_word: כֹּה
  choice: begini
  rationale: Memperkenalkan isi pesan langsung dengan ungkapan Indonesia yang alami.
- source_word: לֶחָי
  choice: Semoga panjang umur!
  rationale: Frasa Ibrani yang sulit ini secara harfiah berkaitan dengan ‘hidup’ dan dalam konteks kemungkinan merupakan salam atau berkat yang mendoakan kehidupan; terjemahan ini menyampaikan fungsi idiomatisnya tanpa menutupi ketidakpastiannya, yang dicatat dalam catatan kaki.
- source_word: וְאַתָּה שָׁלוֹם
  choice: Damai sejahtera bagimu
  rationale: Klausa tanpa verba ini menyatakan harapan atau berkat. Susunan ini mempertahankan bentuk ringkas dan pengulangan syalom.
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: damai sejahtera bagi rumah tanggamu
  rationale: ‘Rumah’ dalam pemakaian Ibrani mencakup seisi rumah atau keluarga; ‘rumah tangga’ menyampaikan maksud itu secara jelas dalam bahasa Indonesia modern.
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: dan damai sejahtera bagi segala yang kaumiliki
  rationale: Ungkapan ini memperluas berkat kepada seluruh milik dan segala sesuatu yang berada dalam lingkup orang yang disapa.
- source_word: שָׁלוֹם
  choice: damai sejahtera
  rationale: Padanan ini mencakup bukan hanya ketiadaan konflik, tetapi juga keadaan baik, utuh, aman, dan makmur, sambil mempertahankan pola tiga kali pengulangan dalam teks.
theological_decisions:
- issue: Makna frasa לֶחָי yang tidak pasti
  choice: Diterjemahkan secara idiomatis sebagai doa ‘Semoga panjang umur!’ dan diberi catatan kaki.
  alternative: ‘Kepada orang yang hidup,’ ‘Untuk kehidupan,’ atau salam umum seperti ‘Salam sejahtera.’
  rationale: Konteks mendukung fungsi salam atau berkat, tetapi bentuk Ibraninya tidak sepenuhnya jelas. Catatan kaki mempertahankan ambiguitas sumber dan mencegah terjemahan idiomatis dianggap sebagai satu-satunya analisis yang mungkin.
translation_notes:
  register: Bahasa modern, jelas, dan bermartabat. Pengulangan ‘damai sejahtera’ dipertahankan untuk mencerminkan struktur berkat tiga kali dalam bahasa Ibrani; ‘kaumiliki’ dipakai sebagai bentuk baku yang tetap mudah dipahami.
