revisions:
- from: Lalu orang-orang muda Daud berbalik dan menempuh jalan pulang. Mereka kembali, tiba, dan menceritakan kepadanya semua perkataan itu.[a]
  to: Lalu para pemuda Daud berbalik arah dan kembali melalui jalan mereka. Mereka datang kepada Daud dan memberitahukan kepadanya semua perkataan itu.[a]
  rationale: 'Revisi ini menghilangkan predikat “tiba” yang tidak lengkap, menghindari penambahan makna “jalan pulang,” dan tetap menyampaikan rangkaian naratif Ibrani: mereka berbalik arah, kembali, datang kepada Daud, lalu melaporkan seluruh perkataan tersebut. Catatan kaki dipertahankan dan diselaraskan dengan pilihan leksikal Indonesia yang lebih alami.'
