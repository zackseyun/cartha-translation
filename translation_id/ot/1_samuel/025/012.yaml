  text: So David’s young men turned back on their way[a], and they returned and came and told him all these words.
translation:
  language: id
  text: Lalu para pemuda Daud berbalik arah dan kembali melalui jalan mereka. Mereka datang kepada Daud dan memberitahukan kepadanya semua perkataan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “semua hal itu.” Kata Ibrani ini dapat berarti “perkataan” atau “hal/perkara”; di sini “perkataan” dipilih karena laporan itu menyangkut jawaban Nabal yang diucapkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: berbalik
  rationale: Dalam konteks perjalanan, bentuk dari הפך menunjukkan perubahan arah, bukan tindakan membalikkan sesuatu secara harfiah.
- source_word: נַעֲרֵי דָוִד
  choice: orang-orang muda Daud
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengiring. Pilihan ini mempertahankan nuansa usia/peran tanpa secara berlebihan menetapkan status mereka sebagai hamba.
- source_word: לְדַרְכָּם
  choice: menempuh jalan pulang
  rationale: Secara harfiah berarti 'ke jalan mereka'; dalam konteks berbalik arah, ungkapan Indonesia ini menyampaikan bahwa mereka mulai kembali melalui rute mereka.
- source_word: וַיָּשֻׁבוּ
  choice: mereka kembali
  rationale: Mempertahankan pernyataan eksplisit Ibrani tentang kepulangan, meskipun maknanya sebagian bertumpang tindih dengan tindakan berbalik.
- source_word: וַיָּבֹאוּ
  choice: tiba
  rationale: Dalam rangkaian gerak ini, 'tiba' secara alami menyampaikan bahwa mereka sampai kepada Daud, tanpa perlu menambahkan tujuan yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּגִּדוּ לוֹ
  choice: menceritakan kepadanya
  rationale: נגד di sini berarti memberitahukan atau melaporkan. 'Menceritakan kepadanya' alami dalam bahasa Indonesia dan sesuai dengan pelaporan jawaban Nabal.
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan itu
  rationale: דְּבָרִים dapat berarti perkataan atau hal/perkara. Konteksnya adalah laporan tentang jawaban lisan Nabal, sehingga 'perkataan' diutamakan sambil mempertahankan alternatif dalam catatan kaki.
