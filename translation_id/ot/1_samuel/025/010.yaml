translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Hamba” dipilih untuk menjaga hubungan leksikal dan sosial antara utusan Daud dan tuduhan umum Nabal; susunan kalimat dibuat alami tanpa menghilangkan nada menghina dalam dua pertanyaan retoris.
