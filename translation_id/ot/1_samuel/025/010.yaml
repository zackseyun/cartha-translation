base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: id
  text: Nabal menjawab hamba-hamba Daud dan berkata, “Siapakah Daud? Siapakah anak Isai? Sekarang ini banyak hamba yang melepaskan diri, masing-masing dari tuannya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Pada masa ini, hamba-hamba yang melepaskan diri, masing-masing dari hadapan tuannya, telah bertambah banyak.”'
    reason: Bentuk Ibrani memakai verba רַבּוּ (“telah bertambah banyak”) dan ungkapan spasial מִפְּנֵי (“dari hadapan”), yang dalam teks utama diterjemahkan secara idiomatis.
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam pertukaran percakapan naratif ini, ענה berarti menjawab atau menanggapi; “menjawab” mempertahankan rumusan naratif Ibrani secara wajar dalam bahasa Indonesia.
- source_word: עַבְדֵי דָוִד
  choice: hamba-hamba Daud
  rationale: עבד menunjuk kepada orang yang berada di bawah kuasa atau dalam pelayanan seseorang. “Hamba-hamba” transparan secara leksikal dan sesuai dengan kaitan retorisnya dengan עֲבָדִים kemudian dalam ayat ini.
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: Siapakah Daud? Siapakah anak Isai?
  rationale: Pengulangan kata tanya dipertahankan untuk menyampaikan nada meremehkan Nabal tanpa mengubahnya menjadi pernyataan eksplisit. Sebutan “anak Isai” juga dipertahankan.
- source_word: הַיּוֹם
  choice: Akhir-akhir ini
  rationale: Secara harfiah berarti “hari ini”, tetapi dalam pernyataan umum ini menunjuk pada keadaan masa kini; “akhir-akhir ini” alami dalam bahasa Indonesia dan mempertahankan keluhan Nabal tentang keadaan pada zamannya.
- source_word: רַבּוּ עֲבָדִים
  choice: banyak hamba
  rationale: רבו secara verbal berarti “telah menjadi banyak/bertambah banyak”. Dalam susunan Indonesia, “banyak hamba” menyampaikan daya kuantitatifnya dengan alami; bentuk verbal yang lebih dekat dicatat dalam catatan kaki.
- source_word: הַמִּתְפָּרְצִים
  choice: yang memisahkan diri
  rationale: Partisipel hitpael dari פרץ menggambarkan tindakan melepaskan atau menerobos keluar. Dalam konteks hamba yang meninggalkan tuannya, “memisahkan diri” menyampaikan gerak menjauh tanpa menambahkan gagasan pemberontakan terbuka yang tidak dinyatakan secara eksplisit.
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: dari tuannya masing-masing
  rationale: אישׁ berfungsi distributif, sedangkan מִפְּנֵי secara harfiah “dari hadapan” merupakan idiom keberangkatan atau penjauhan. “Dari tuannya masing-masing” alami dalam bahasa Indonesia dan tetap mempertahankan hubungan distributif.
