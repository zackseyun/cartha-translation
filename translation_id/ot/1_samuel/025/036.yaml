  text: וַ/תָּבֹ֣א אֲבִיגַ֣יִל אֶל נָבָ֡ל וְ/הִנֵּה ל/וֹ֩ מִשְׁתֶּ֨ה בְּ/בֵית֜/וֹ כְּ/מִשְׁתֵּ֣ה הַ/מֶּ֗לֶךְ וְ/לֵ֤ב נָבָל֙ ט֣וֹב עָלָ֔י/ו וְ/ה֥וּא שִׁכֹּ֖ר עַד מְאֹ֑ד וְ/לֹֽא הִגִּ֣ידָה לּ֗/וֹ דָּבָ֥ר קָטֹ֛ן וְ/גָד֖וֹל עַד א֥וֹר הַ/בֹּֽקֶר׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: id
  text: Ketika Abigail datang kepada Nabal, ternyata Nabal sedang mengadakan perjamuan di rumahnya seperti perjamuan seorang raja. Hati Nabal sedang riang, dan ia sangat mabuk. Karena itu, Abigail tidak memberitahukan apa pun kepadanya, baik hal kecil maupun besar,[a] sampai pagi menjadi terang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suatu hal, kecil maupun besar,” ungkapan yang berarti tidak memberitahukan apa pun sama sekali.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sampai fajar.” Secara harfiah: “sampai cahaya pagi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל
  choice: Ketika Abigail datang kepada Nabal
  rationale: Bentuk naratif Ibrani melanjutkan urutan kejadian; “ketika” menghubungkan kedatangan Abigail secara alami dengan keadaan yang dijumpainya tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Menjaga fungsi penunjuk dan pembuka adegan dari interjeksi Ibrani dalam ungkapan Indonesia modern yang wajar.
- source_word: מִשְׁתֶּה בְּבֵיתוֹ
  choice: sedang mengadakan perjamuan di rumahnya
  rationale: מִשְׁתֶּה menunjuk pada perjamuan atau pesta, sering disertai minum-minum. “Perjamuan” sesuai dengan suasana meriah, sedangkan kemabukan disebut secara tersendiri.
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: seperti perjamuan seorang raja
  rationale: Mempertahankan perbandingan Ibrani dan kesan kemewahan ala kerajaan tanpa menganggap raja tertentu.
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: Hati Nabal sedang riang
  rationale: Mengungkapkan idiom tentang hati yang berada dalam keadaan baik atau gembira sambil tetap mempertahankan citra “hati”; “riang” cocok dengan konteks perjamuan.
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: dan ia sangat mabuk
  rationale: Terjemahan langsung dan alami bagi kata sifat “mabuk” dengan penguat עַד מְאֹד.
- source_word: וְלֹא הִגִּידָה לוֹ דָּבָר קָטֹן וְגָדוֹל
  choice: Karena itu, Abigail tidak memberitahukan apa pun kepadanya, baik hal kecil maupun besar
  rationale: “Karena itu” menyatakan hubungan kontekstual dengan kemabukan Nabal. Frasa “apa pun” menyampaikan penyangkalan menyeluruh, sedangkan pasangan “kecil maupun besar” mempertahankan merisme Ibrani.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: sampai pagi menjadi terang
  rationale: Mempertahankan gambaran harfiah “cahaya pagi” dalam bahasa Indonesia yang dapat dipahami; alternatif idiomatis “sampai fajar” dicatat dalam catatan kaki.
