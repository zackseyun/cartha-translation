id: 1SA.25.33
reference: 1 Samuel 25:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָר֥וּךְ טַעְמֵ֖/ךְ וּ/בְרוּכָ֣ה אָ֑תְּ אֲשֶׁ֨ר כְּלִתִ֜/נִי הַ/יּ֤וֹם הַ/זֶּה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הֹשֵׁ֥עַ יָדִ֖/י לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: id
  text: Diberkatilah pertimbanganmu[a], dan diberkatilah engkau, yang pada hari ini telah menahan aku agar tidak terlibat dalam penumpahan darah[b] dan tidak menyelamatkan diriku dengan tanganku sendiri.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebijaksanaanmu” atau “daya pengertianmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “masuk ke dalam darah-darah”; ungkapan ini juga dapat mengandung arti menjadi bersalah karena menumpahkan darah.
    reason: lexical_alternative
  - marker: c
    text: Atau “membalas dendam dengan tanganku sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Diberkatilah
  rationale: Mempertahankan rumusan berkat pasif yang bersifat seruan dan selaras dengan klausa berikutnya.
- source_word: טַעְמֵךְ
  choice: pertimbanganmu
  rationale: Dalam konteks ini טַעַם menunjuk pada penilaian yang bijaksana atau daya membedakan Abigail; 'pertimbangan' alami dalam bahasa Indonesia dan tidak terlalu mempersempit maknanya.
- source_word: וּבְרוּכָה אָתְּ
  choice: dan diberkatilah engkau
  rationale: Menjaga kesejajaran dengan seruan berkat sebelumnya serta nada yang luhur.
- source_word: כְּלִתִנִי
  choice: telah menahan aku
  rationale: Menyampaikan tindakan Abigail yang mencegah atau mengekang David agar tidak melakukan kekerasan.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan penekanan temporal Ibrani dalam ungkapan Indonesia yang wajar.
- source_word: מִבּוֹא בְדָמִים
  choice: agar tidak terlibat dalam penumpahan darah
  rationale: Secara harfiah menggambarkan 'masuk ke dalam darah-darah'; 'terlibat dalam penumpahan darah' mempertahankan citra keterlibatan tanpa menghasilkan frasa Indonesia yang janggal.
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: dan tidak menyelamatkan diriku dengan tanganku sendiri
  rationale: Mempertahankan arti dasar ישׁע, 'menyelamatkan atau melepaskan,' sekaligus membiarkan konteks menunjukkan bahwa tindakan itu berupa pembalasan pribadi.
theological_decisions:
- issue: Nuansa דָּמִים sebagai penumpahan darah atau kesalahan karena darah
  choice: penumpahan darah
  alternative: kesalahan karena menumpahkan darah
  rationale: Konteks langsung menyoroti pembunuhan yang hendak dilakukan David, tetapi bentuk jamak Ibrani juga dapat menyiratkan kesalahan yang timbul karena darah tertumpah; nuansa itu dipertahankan dalam catatan kaki.
- issue: Makna tindakan tangan David dalam וְהֹשֵׁעַ יָדִי לִי
  choice: menyelamatkan diriku dengan tanganku sendiri
  alternative: membalas dendam dengan tanganku sendiri
  rationale: Terjemahan utama mempertahankan arti leksikal ישׁע dan ironi ungkapannya, sedangkan konteks pembalasan dijelaskan sebagai kemungkinan idiomatis dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kesejajaran rumusan berkat dipertahankan, sementara ungkapan Ibrani yang sukar dibuat cukup alami tanpa meniadakan ambiguitas mengenai penumpahan darah, kesalahan karena darah, dan pembalasan pribadi.
