  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: id
  text: Namun, orang-orang itu sangat baik terhadap kami. Kami tidak dipermalukan[a], dan tidak ada sesuatu pun milik kami yang hilang[b] selama kami berjalan bersama mereka ketika kami berada di padang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kami tidak dihina” atau “kami tidak diperlakukan dengan buruk.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “kami tidak kehilangan apa pun”; maksudnya, tidak ada sesuatu pun yang didapati hilang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Namun, orang-orang itu
  rationale: Konjungsi waw dipahami sebagai kontras dengan penilaian Nabal dalam konteks sebelumnya; 'orang-orang itu' merujuk kepada rombongan Daud.
- source_word: טֹבִים לָנוּ מְאֹד
  choice: sangat baik terhadap kami
  rationale: Mempertahankan ungkapan Ibrani yang sederhana dan menyatakan perlakuan yang sangat baik kepada para gembala.
- source_word: וְלֹא הָכְלַמְנוּ
  choice: Kami tidak dipermalukan
  rationale: Bentuk Hophal bersifat pasif dan secara langsung menyatakan bahwa mereka tidak dibuat malu, dihina, atau diperlakukan secara memalukan.
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: dan tidak ada sesuatu pun milik kami yang hilang
  rationale: Dalam konteks penjagaan kawanan dan harta di padang, frasa ini menyatakan bahwa mereka tidak mendapati kehilangan apa pun.
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: selama kami berjalan bersama mereka
  rationale: '''Selama'' menyampaikan keseluruhan rentang waktu, sedangkan ''berjalan bersama'' mempertahankan nuansa kegiatan atau pergaulan berkelanjutan dari bentuk Hitpael.'
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: ketika kami berada di padang
  rationale: '''Padang'' sesuai dengan latar penggembalaan dan dapat mencakup kawasan terbuka, bukan hanya sebidang lahan pertanian.'
theological_decisions: []
