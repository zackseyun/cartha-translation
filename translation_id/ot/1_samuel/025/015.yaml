  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan bentuk pasif pada הָכְלַמְנוּ atau nuansa kehilangan pada פָקַדְנוּ מְאוּמָה. Semua penanda catatan kaki dicantumkan dalam teks utama.
