  yaml_path: translation/ot/1_samuel/025/024.yaml
  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: id
  text: Ia tersungkur di kaki Daud dan berkata[a], “Akulah yang menanggung kesalahan itu, tuanku. Izinkanlah hambamu ini berbicara kepadamu, dan dengarkanlah perkataan hambamu ini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kesalahan itu tanggung jawabku, tuanku.” Ungkapan Ibraninya padat dan secara harfiah berbunyi, “Atasku, aku, tuanku, kesalahan itu.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hamba” secara khusus berbentuk feminin, yakni hamba perempuan, dan dipakai Abigail sebagai sebutan diri yang merendah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל־רַגְלָיו
  choice: Ia tersungkur di kaki Daud
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa Abigail ‘jatuh pada kakinya’, yaitu sikap memohon dan merendahkan diri. ‘Tersungkur di kaki’ alami dalam bahasa Indonesia. Nama Daud dipakai untuk memperjelas rujukan pronomina maskulin tanpa mengubah pelaku.
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: Akulah yang menanggung kesalahan itu, tuanku
  rationale: Klausa padat ini menyatakan bahwa Abigail mengambil kesalahan tersebut atas dirinya. Terjemahan ini mempertahankan tekanan pada ‘aku’ dan gagasan beban tanggung jawab, sambil tetap alami dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan ini ditujukan kepada Daud sebagai ungkapan hormat sosial, bukan kepada Tuhan. ‘Tuanku’ mempertahankan tingkat penghormatan dalam ujaran Abigail.
- source_word: וּתְדַבֶּר־נָא
  choice: Izinkanlah ... berbicara
  rationale: Partikel נָא melembutkan bentuk permohonan. ‘Izinkanlah’ menyampaikan permohonan sopan secara wajar dalam bahasa Indonesia.
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: hambamu ini
  rationale: Kata אמה secara khusus menunjuk seorang hamba perempuan dan di sini menjadi sebutan diri yang merendah. Bahasa Indonesia tidak menandai gender pada ‘hamba’; catatan kaki menjelaskan bentuk feminin sumbernya. Pengulangan dipertahankan.
- source_word: בְּאָזְנֶיךָ
  choice: kepadamu
  rationale: Secara harfiah ‘di telingamu’, suatu idiom untuk berbicara agar didengar oleh seseorang. ‘Berbicara kepadamu’ menyampaikan maknanya secara alami tanpa ungkapan Indonesia yang kaku.
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: dan dengarkanlah perkataan
  rationale: Bentuk imperatif שׁמע meminta perhatian sungguh-sungguh. ‘Dengarkanlah perkataan’ mempertahankan struktur dan nada permohonan formal sumber.
