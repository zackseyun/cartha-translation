source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יַעֲשֶׂ֤ה יְהוָה֙ לַֽ/אדֹנִ֔/י כְּ/כֹ֛ל אֲשֶׁר דִּבֶּ֥ר אֶת הַ/טּוֹבָ֖ה עָלֶ֑י/ךָ וְ/צִוְּ/ךָ֥ לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: id
  text: Dan ketika Yahweh melakukan kepada tuanku sesuai dengan segala kebaikan yang telah Ia firmankan tentang engkau[a], dan menetapkan engkau sebagai pemimpin atas Israel[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan segala kebaikan yang telah dijanjikan-Nya kepadamu.” Secara harfiah, teks Ibrani menyatakan “sesuai dengan segala ... kebaikan” yang Yahweh firmankan mengenai Daud.
    reason: lexical_alternative
  - marker: b
    text: Atau “memerintahkan” atau “menugaskan engkau menjadi pemimpin atas Israel.” Verba Ibraninya sering berarti “memerintahkan”, tetapi di sini kemungkinan menyatakan penetapan atau penugasan seseorang untuk memimpin.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Dan ketika
  rationale: Ungkapan ini memperkenalkan keadaan yang akan terjadi pada masa depan. “Dan ketika” menyampaikan fungsinya secara alami dalam bahasa Indonesia tanpa menambahkan kepastian yang tidak perlu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: לַאדֹנִי
  choice: bagi tuanku
  rationale: Sapaan hormat Abigail kepada Daud dipertahankan; “tuanku” alami dalam konteks ini dan menunjukkan sikap hormat.
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: segala kebaikan yang telah difirmankan-Nya tentang engkau
  rationale: Terjemahan ini mempertahankan unsur “kebaikan” dan verba “berfirman” tanpa secara diam-diam mempersempitnya menjadi “berjanji”, meskipun konteksnya menunjuk pada hal baik yang dijanjikan mengenai Daud.
- source_word: וְצִוְּךָ
  choice: dan menetapkan engkau
  rationale: Walaupun צוה biasanya berarti “memerintahkan”, konstruksi dengan לְנָגִיד di sini menunjuk pada penugasan atau pengangkatan ke dalam kedudukan kepemimpinan.
- source_word: לְנָגִיד עַל יִשְׂרָאֵל
  choice: sebagai pemimpin atas Israel
  rationale: נָגִיד menyatakan orang yang ditempatkan dalam kewenangan. “Pemimpin” jelas dan wajar, sedangkan “atas Israel” mempertahankan relasi kewenangan yang ditandai oleh עַל.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Nuansa דבר dalam ucapan ilahi mengenai Daud
  choice: yang telah difirmankan-Nya tentang engkau
  alternative: yang telah dijanjikan-Nya kepadamu
  rationale: Konteks memang bernuansa janji, tetapi verba Ibraninya berarti “berbicara/berfirman”. Teks utama mempertahankan bentuk yang lebih luas, sedangkan makna “berjanji” dicatat sebagai alternatif.
- issue: Arti צוה dalam penetapan Daud
  choice: menetapkan engkau sebagai pemimpin
  alternative: memerintahkan atau menugaskan engkau menjadi pemimpin
  rationale: Dalam konstruksi ini, verba tersebut kemungkinan menyatakan pengangkatan atau pemberian tugas untuk memimpin. Catatan kaki mempertahankan arti leksikal “memerintahkan” sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “tuanku” mempertahankan penghormatan Abigail kepada Daud. Struktur ayat sengaja diakhiri dengan koma karena kalimat berlanjut ke ayat berikutnya.
