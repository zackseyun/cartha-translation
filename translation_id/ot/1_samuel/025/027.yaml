  text: And now, let this gift that your servant has brought to my lord be given to the young men who follow my lord.
translation:
  language: id
  text: Sekarang, hendaklah pemberian yang dibawa hambamu ini kepada tuanku diberikan kepada orang-orang muda yang mengikuti tuanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרָכָה
  choice: pemberian
  rationale: Secara harfiah berarti ‘berkat’, tetapi dalam konteks ini menunjuk pada pemberian konkret yang dibawa Abigail; ‘pemberian’ menyampaikan fungsi kontekstualnya secara alami.
- source_word: שִׁפְחָתְךָ
  choice: hambamu
  rationale: Bentuk sapaan merendahkan diri oleh seorang perempuan kepada tuannya; bahasa Indonesia tidak perlu menandai gender pada ‘hamba’.
- source_word: הַנְּעָרִים
  choice: orang-orang muda
  rationale: Mempertahankan makna umum bagi para pemuda atau pelayan muda tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: הַמִּתְהַלְּכִים בְּרַגְלֵי אֲדֹנִי
  choice: yang mengikuti tuanku
  rationale: Ungkapan harfiah ‘yang berjalan pada kaki tuanku’ merupakan idiom bagi mereka yang menyertai atau mengikuti; terjemahan ini alami dan tepat dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Sapaan ‘tuanku’ serta ‘hambamu’ mempertahankan kesantunan dan kerendahan diri dalam ujaran Abigail.
