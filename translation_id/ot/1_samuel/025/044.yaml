source:
  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: id
  text: Saul telah memberikan Mikhal, putrinya, istri Daud, kepada Palti anak Lais, yang berasal dari Galim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: Saul
  rationale: Nama pelaku dinyatakan langsung. Konjungsi וְ tidak perlu diterjemahkan tersendiri karena hubungan naratifnya sudah jelas dalam bahasa Indonesia dan penambahan seperti “sementara itu” akan memberi nuansa temporal yang tidak dinyatakan secara eksplisit.
- source_word: נָתַן
  choice: telah memberikan
  rationale: Bentuk qatal menyatakan tindakan yang sudah selesai; “telah memberikan” secara alami menunjukkan bahwa tindakan itu telah terjadi sebelumnya dalam alur cerita.
- source_word: מִיכַל בִּתּוֹ
  choice: Mikhal, anak perempuannya
  rationale: Mempertahankan hubungan aposisional yang mengidentifikasi Mikhal sebagai anak perempuan Saul.
- source_word: אֵשֶׁת דָּוִד
  choice: yang adalah istri Daud
  rationale: Menyampaikan hubungan perkawinan yang dinyatakan oleh konstruksi Ibrani sekaligus memperjelas bahwa keterangan ini merujuk kepada Mikhal.
- source_word: לְפַלְטִי
  choice: kepada Palti
  rationale: Nama ditransliterasikan langsung dari bentuk Ibrani פַלְטִי, dan preposisi לְ diterjemahkan “kepada” sesuai dengan verba “memberikan”.
- source_word: בֶן לַיִשׁ
  choice: anak Lais
  rationale: Menyatakan patronimik secara jelas dalam bahasa Indonesia modern tanpa menambahkan unsur yang tidak terdapat dalam teks.
- source_word: אֲשֶׁר מִגַּלִּים
  choice: yang berasal dari Galim
  rationale: Frasa relatif ini mengidentifikasi daerah asal Palti; “berasal dari” merupakan padanan Indonesia yang alami bagi מִן dengan nama tempat.
theological_decisions:
- issue: Status Mikhal ketika Saul memberikannya kepada Palti
  choice: Mikhal tetap disebut “istri Daud” sebagaimana teks Ibrani
  alternative: Menjelaskan atau mengubah statusnya menjadi mantan istri Daud
  rationale: Teks secara eksplisit menyebut Mikhal אֵשֶׁת דָּוִד, “istri Daud”. Terjemahan mempertahankan ketegangan hukum dan naratif itu tanpa menafsirkannya lebih lanjut.
translation_notes:
  register: 'Bahasa Indonesia modern, jelas, dan bermartabat. Nama-nama ditransliterasikan dekat dengan bentuk Ibrani: Mikhal, Palti, Lais, dan Galim. Tidak digunakan catatan kaki karena tidak ada varian leksikal yang perlu dijelaskan kepada pembaca pada ayat ini; catatan konsultasi bahasa Inggris mengenai ejaan Palti juga tidak membedakan bentuk alternatif secara nyata.'
