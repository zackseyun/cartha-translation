  terminology: ‘Gembala-gembalamu’, ‘Karmel’, dan ‘memperlakukan dengan buruk’ sesuai konteks. Catatan kaki dengan tepat mempertahankan ranah makna harfiah ‘mempermalukan/mendatangkan malu’, sambil menjelaskan pilihan kontekstual tanpa menjadikannya satu-satunya makna.
