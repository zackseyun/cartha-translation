base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: id
  text: Sekarang aku mendengar bahwa bulu dombamu sedang dicukur. Sekarang, gembala-gembalamu yang bersama kami tidak kami perlakukan dengan buruk[a], dan tidak ada apa pun dari milik mereka yang hilang selama mereka berada di Karmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “tidak kami permalukan.” Kata Ibrani ini dapat berarti menyebabkan seseorang menanggung malu atau aib; dalam konteks ini, kata tersebut juga menyiratkan bahwa para gembala Nabal tidak diganggu atau diperlakukan dengan buruk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Mempertahankan peralihan waktu dan wacana yang mengantar permohonan Daud; kata sambung Ibrani tidak perlu diterjemahkan secara tersendiri agar bahasa Indonesia tetap alami.
- source_word: שָׁמַעְתִּי
  choice: aku mendengar
  rationale: Bentuk perfek menyatakan kabar yang telah diterima dan masih relevan; dalam bahasa Indonesia, bentuk sederhana ini alami dan cukup menyampaikan relevansi kini.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi kabar sesudah verba 'mendengar'.
- source_word: גֹזְזִים לָךְ
  choice: orang-orang sedang menggunting bulu dombamu
  rationale: Partisip dengan datif orang kedua menunjuk kegiatan pengguntingan bulu domba milik Nabal; ungkapan ini jelas bagi pembaca Indonesia tanpa menyisipkan gagasan tambahan tentang pesta.
- source_word: עַתָּה
  choice: Nah
  rationale: Kemunculan kedua berfungsi mengalihkan laporan kepada pokok desakan Daud. 'Nah' mempertahankan fungsi retoris itu tanpa pengulangan 'sekarang' yang kaku.
- source_word: הָרֹעִים אֲשֶׁר לְךָ
  choice: gembala-gembalamu
  rationale: Bentuk kepunyaan Indonesia menyampaikan secara alami arti harfiah 'para gembala yang menjadi milikmu'.
- source_word: הָיוּ עִמָּנוּ
  choice: yang bersama kami
  rationale: Menerjemahkan hubungan עִם secara langsung tanpa menentukan apakah mereka tinggal menetap atau hanya berada di wilayah yang sama.
- source_word: לֹא הֶכְלַמְנוּם
  choice: tidak kami perlakukan dengan buruk
  rationale: Dalam konteks perlindungan para gembala, bentuk Hifil dari כלם menunjuk tindakan yang mendatangkan aib atau kerugian. Terjemahan ini menyampaikan dampak praktisnya, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: dan tidak ada sesuatu pun milik mereka yang hilang
  rationale: Bentuk Nifal נפקד berarti tidak ditemukan, tidak tercatat, atau hilang. Penanda kepunyaan menjelaskan bahwa yang dimaksud ialah harta atau ternak mereka tanpa membatasi rujukannya secara berlebihan.
- source_word: כָּל יְמֵי הֱיוֹתָם
  choice: selama mereka berada
  rationale: Mengungkapkan keseluruhan rentang waktu dengan idiom Indonesia yang alami.
- source_word: בַּכַּרְמֶל
  choice: di Karmel
  rationale: Menafsirkan bentuk ini sebagai nama tempat Karmel di wilayah Yehuda, sesuai konteks narasi.
