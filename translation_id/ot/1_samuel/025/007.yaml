translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya tutur langsung yang wajar dan bermartabat. Kata ganti 'aku' dan 'engkau' dipakai sesuai percakapan dalam narasi Alkitab. Pengulangan עַתָּה dipertahankan secara fungsional melalui 'Sekarang' dan 'Nah'.
