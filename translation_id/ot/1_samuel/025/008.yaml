  to: Tanyakanlah kepada orang-orang mudamu, dan mereka akan memberitahukannya kepadamu. Maka, biarlah orang-orang muda mendapat kemurahan di matamu, sebab kami datang pada hari perayaan.[a] Berikanlah kiranya apa saja yang ada padamu[b] kepada hamba-hambamu dan kepada anakmu, Daud.
