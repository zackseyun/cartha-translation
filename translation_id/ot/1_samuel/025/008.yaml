base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: id
  text: Tanyakanlah kepada orang-orang mudamu, dan mereka akan memberitahukannya kepadamu. Maka, biarlah orang-orang muda mendapat kemurahan di matamu, sebab kami datang pada hari perayaan.[a] Berikanlah kiranya apa saja yang ada padamu[b] kepada hamba-hambamu dan kepada anakmu, Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari yang baik”; dalam konteks ini, hari perayaan pencukuran domba.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “apa yang didapati tanganmu”; maksudnya, apa saja yang dapat kauberikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: Tanyakanlah kepada orang-orang mudamu
  rationale: Bentuk perintah dipertahankan, dan נְעָרִים diterjemahkan secara leksikal sebagai “orang-orang muda”; dalam konteks, mereka adalah para pekerja atau pelayan Nabal yang dapat membenarkan perkataan utusan Daud.
- source_word: וְיַגִּידוּ לָךְ
  choice: dan mereka akan memberitahukannya kepadamu
  rationale: Bentuk Hifil dari נגד menyatakan tindakan memberitahukan atau melaporkan; akhiran “-nya” secara wajar menunjuk pada perkara yang ditanyakan.
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: Maka, biarlah orang-orang muda ini mendapat kemurahan di matamu
  rationale: Ungkapan Ibrani “mendapat kemurahan di mata” dipertahankan, sedangkan “biarlah” menyampaikan nuansa permohonan pada bentuk verba tersebut. “Ini” memperjelas bahwa yang dimaksud ialah para utusan Daud, tanpa mengubah rujukannya.
- source_word: כִּי עַל יוֹם טוֹב בָּאנוּ
  choice: sebab kami datang pada hari perayaan
  rationale: יוֹם טוֹב secara harfiah berarti “hari yang baik”, tetapi dalam konteks pesta pencukuran domba menunjuk pada hari yang meriah atau hari perayaan. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: תְּנָה נָּא
  choice: Berikanlah kiranya
  rationale: Kata “kiranya” menyampaikan permohonan sopan yang dinyatakan oleh partikel נָא bersama bentuk perintah.
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: apa saja yang tersedia di tanganmu
  rationale: Terjemahan ini mempertahankan citra “tangan” sambil menyampaikan maksud idiomatisnya, yaitu apa yang tersedia atau sanggup diberikan Nabal.
- source_word: לַעֲבָדֶיךָ
  choice: kepada hamba-hambamu ini
  rationale: Daud menyebut para utusannya sebagai “hamba-hambamu” untuk menyatakan kerendahan hati. “Ini” memperjelas rujukan dalam bahasa Indonesia.
- source_word: וּלְבִנְךָ לְדָוִד
  choice: dan kepada anakmu, Daud
  rationale: Sebutan “anakmu” dipertahankan sebagai bahasa penghormatan dan kerendahan hati, bukan sebagai pernyataan hubungan biologis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Bentuk “-lah” dan “kiranya” mempertahankan nada permohonan hormat, sementara ungkapan “mendapat kemurahan di matamu” menjaga citra khas teks Ibrani.
