  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'tuanku' serta bentuk 'hambamu' mempertahankan kesantunan dan kerendahan diri dalam adegan istana tanpa memakai susunan yang terlalu arkais. Penanda catatan kaki ditempatkan setelah seluruh permainan kata yang diterangkannya.
