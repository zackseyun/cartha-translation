base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: id
  text: 'Janganlah kiranya tuanku menghiraukan orang tak berguna ini, Nabal. Sebab, seperti namanya, demikianlah dia: Nabal namanya, dan kebebalan ada padanya.[a] Tetapi aku, hambamu, tidak melihat para pemuda yang tuanku utus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama “Nabal” berkaitan erat dengan kata Ibrani yang berarti “bebal” atau “kebebalan”; perkataan Abigail sengaja memainkan nama itu untuk menggambarkan watak Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יָשִׂים אֲדֹנִי אֶת לִבּוֹ אֶל
  choice: Kiranya tuanku tidak menghiraukan
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang menaruh hati kepada seseorang. Dalam konteks ini, 'tidak menghiraukan' menyampaikan permohonan agar Daud tidak memberi perhatian serius kepada Nabal, dengan bentuk hormat 'kiranya' dan 'tuanku'.
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: orang bejat
  rationale: בְּלִיַּעַל di sini merupakan penilaian moral tentang keburukan atau kebejatan, bukan nama diri. 'Orang bejat' merupakan ungkapan Indonesia yang alami dan kuat tanpa menjadikannya istilah demonologis.
- source_word: נָבָל
  choice: Nabal
  rationale: Sebagai nama diri, kata ini ditransliterasikan. Permainan katanya dengan gagasan kebebalan dipertahankan melalui klausa berikut dan dijelaskan dalam catatan kaki.
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: Sebab, seperti namanya, demikianlah dia
  rationale: Bentuk ini mempertahankan susunan peribahasa dan kaitan eksplisit antara nama Nabal dengan wataknya.
- source_word: וּנְבָלָה עִמּוֹ
  choice: dan kebebalan ada padanya
  rationale: נְבָלָה dapat menunjuk pada kebebalan atau perilaku tercela. 'Kebebalan' menjaga hubungan bunyi dan makna dengan nama Nabal serta tidak mempersempitnya hanya menjadi kurangnya kecerdasan.
- source_word: אֲמָתְךָ
  choice: hambamu
  rationale: Kata Ibrani secara khusus menunjuk kepada hamba perempuan. Karena penuturnya, Abigail, sudah jelas, 'hambamu' terdengar alami dalam formula merendahkan diri bahasa Indonesia tanpa mengaburkan identitas penutur.
- source_word: נַעֲרֵי
  choice: orang-orang muda
  rationale: Terjemahan ini dekat dengan arti leksikal נַעַר dan sesuai dengan konteks para pemuda atau pelayan yang diutus Daud.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Ini adalah sapaan hormat Abigail kepada Daud. 'Tuanku' mempertahankan hubungan sosial dan nada penghormatan dalam bahasa Indonesia yang dignified.
