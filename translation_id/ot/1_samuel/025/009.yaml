  terminology: “Atas nama Daud” dengan tepat menyatakan tindakan perwakilan yang terkandung dalam בְּשֵׁם דָּוִד. “Menyampaikan kepada Nabal semua perkataan itu” adalah padanan idiomatis yang tetap setia pada tindakan berbicara/menyampaikan pesan. Penanda dan isi catatan kaki selaras dengan ambiguitas kata kerja Ibrani.
