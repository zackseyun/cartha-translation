  source_fidelity: 'Terjemahan menyampaikan seluruh rangkaian tindakan Ibrani dengan baik: orang-orang Daud tiba, berbicara kepada Nabal menurut seluruh perkataan tersebut, atas nama Daud, lalu menunggu. Pilihan “menunggu” untuk וַיָּנוּחוּ merupakan penafsiran kontekstual yang wajar setelah penyampaian pesan, sementara catatan kaki secara tepat mempertahankan arti leksikal “beristirahat” dan “berhenti sejenak.”'
