  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Orang-orang muda' mempertahankan sebutan sumber, sedangkan 'menyampaikan' dan 'atas nama' memperjelas peran mereka sebagai utusan tanpa menambahkan tafsiran teologis.
