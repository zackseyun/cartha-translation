source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ֙ נַעֲרֵ֣י דָוִ֔ד וַ/יְדַבְּר֧וּ אֶל נָבָ֛ל כְּ/כָל הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/שֵׁ֣ם דָּוִ֑ד וַ/יָּנֽוּחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/009.yaml
  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: id
  text: Ketika orang-orang muda Daud tiba, mereka menyampaikan kepada Nabal semua perkataan itu atas nama Daud. Sesudah itu, mereka menunggu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka beristirahat” atau “mereka berhenti sejenak.” Kata kerja Ibrani ini biasanya berarti beristirahat atau berhenti; dalam konteks ini, kemungkinan mereka selesai berbicara lalu menantikan jawaban Nabal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: orang-orang muda Daud
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pengiring. Di sini mereka adalah utusan Daud; pilihan ini mempertahankan sebutan Ibrani tanpa membatasi maknanya pada fungsi sebagai pelayan.
- source_word: וַיָּבֹאוּ
  choice: tiba
  rationale: בוא berarti datang atau masuk. Dalam konteks perjalanan para utusan menuju Nabal, 'tiba' alami dalam narasi Indonesia dan menunjukkan bahwa mereka telah sampai.
- source_word: וַיְדַבְּרוּ אֶל נָבָל
  choice: mereka menyampaikan kepada Nabal
  rationale: Secara harfiah berarti 'mereka berbicara kepada Nabal'. Karena isi ucapan telah dikemukakan dalam ayat-ayat sebelumnya dan mereka bertindak sebagai utusan, 'menyampaikan' mengungkapkan tindakan komunikatif tersebut secara alami.
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan itu
  rationale: Ungkapan ini secara formal berarti 'sesuai dengan semua perkataan ini'. 'Semua perkataan itu' merujuk secara alami kepada pesan yang baru dikutip dan mempertahankan unsur verbal דְּבָרִים.
- source_word: בְּשֵׁם דָּוִד
  choice: atas nama Daud
  rationale: Ungkapan ini menunjukkan bahwa mereka berbicara sebagai wakil dengan kewenangan Daud. 'Atas nama Daud' merupakan padanan Indonesia yang baku dan jelas.
- source_word: וַיָּנוּחוּ
  choice: mereka menunggu
  rationale: נוח biasanya berarti beristirahat, berhenti, atau menetap. Dalam alur ini, setelah pesan selesai disampaikan, kemungkinan maksudnya ialah mereka berhenti berbicara dan menantikan tanggapan; ambiguitas leksikal dipertahankan dalam catatan kaki.
theological_decisions: []
