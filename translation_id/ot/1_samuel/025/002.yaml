base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: id
  text: Ada seorang laki-laki di Maon yang mempunyai usaha di Karmel.[a] Orang itu sangat kaya dan memiliki tiga ribu ekor domba serta seribu ekor kambing.[b] Ia sedang mencukur bulu domba-dombanya di Karmel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang pekerjaan atau harta miliknya ada di Karmel.” Kata Ibrani ini dapat mencakup pekerjaan, urusan, atau kepemilikan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang itu sangat besar,” yakni terpandang secara sosial atau ekonomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan pengenalan tokoh yang tidak tentu dalam narasi dengan ungkapan Indonesia yang alami.
- source_word: בְּמָעוֹן
  choice: di Maon
  rationale: Nama tempat ditransliterasikan.
- source_word: מַעֲשֵׂהוּ
  choice: usahanya berada
  rationale: Dalam konteks ini menunjuk pada kegiatan atau kepemilikan ekonominya di Karmel; 'usaha' cukup luas dan alami, sementara catatan kaki mempertahankan cakupan leksikal lainnya.
- source_word: בַכַּרְמֶל
  choice: di Karmel
  rationale: Menunjuk pada nama tempat Karmel, bukan kata benda umum untuk kebun atau lahan subur.
- source_word: הָאִישׁ גָּדוֹל מְאֹד
  choice: Orang itu sangat kaya
  rationale: Dalam konteks jumlah ternak yang segera disebutkan, 'sangat besar' terutama menyatakan kedudukan ekonomi; 'sangat kaya' menyampaikan makna kontekstual dengan jelas.
- source_word: וְלוֹ צֹאן שְׁלֹשֶׁת אֲלָפִים וְאֶלֶף עִזִּים
  choice: memiliki tiga ribu ekor domba serta seribu ekor kambing
  rationale: Konstruksi kepemilikan diterjemahkan secara alami; kata penggolong 'ekor' sesuai bagi ternak dalam bahasa Indonesia.
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: Pada waktu itu ia sedang mencukur bulu domba-dombanya
  rationale: Menyampaikan keadaan atau kegiatan yang tengah berlangsung; 'bulu' ditambahkan secara idiomatis karena yang dicukur adalah bulu domba, bukan tubuh dombanya.
