translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan kolektif 'seluruh Israel' dan ambiguitas lokasi 'di rumahnya' dipertahankan. Penanda catatan kaki [a] ditempatkan sesudah klausa kematian, mengikuti lapisan konsultasi, tetapi isi catatan diperjelas agar tidak seolah-olah menawarkan alternatif bagi verba 'meninggal'.
