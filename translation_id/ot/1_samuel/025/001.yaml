base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: id
  text: Samuel meninggal. Seluruh Israel berkumpul dan meratapinya[a], lalu mereka menguburkannya di rumahnya di Rama. Kemudian Daud bangkit dan turun ke padang belantara Paran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berkabung baginya.” Kata kerja Ibrani ini dapat merujuk pada ratapan atau upacara berkabung bagi orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: Samuel meninggal
  rationale: Menerjemahkan verba kematian secara langsung dan wajar; waw naratif tidak perlu selalu dinyatakan dengan kata penghubung pada awal kalimat.
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: Seluruh Israel berkumpul
  rationale: Mempertahankan ungkapan kolektif nasional כָל יִשְׂרָאֵל sambil memakai susunan Indonesia yang alami.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: meratapi dia
  rationale: ספד menunjuk pada ratapan atau upacara berkabung bagi orang mati; 'meratapi' mengungkapkan unsur ratapan dengan jelas.
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ
  choice: mereka menguburkan dia di rumahnya
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah berarti 'di rumahnya' tanpa memutuskan apakah yang dimaksud bangunan rumah atau tanah milik keluarga.
- source_word: בָּרָמָה
  choice: di Rama
  rationale: Menggunakan bentuk baku Indonesia untuk nama tempat Ramah serta preposisi lokatif yang alami.
- source_word: וַיָּקָם דָּוִד
  choice: Kemudian Daud bangkit
  rationale: קום menandai tindakan bangkit yang mengawali keberangkatan; 'kemudian' menyampaikan kelanjutan narasi.
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: pergi turun ke padang belantara Paran
  rationale: Mempertahankan arti topografis ירד, 'turun', dan menerjemahkan מִדְבָּר sebagai 'padang belantara', wilayah liar yang tidak selalu berupa gurun pasir.
