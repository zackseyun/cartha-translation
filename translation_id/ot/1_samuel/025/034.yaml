id: 1SA.25.34
reference: 1 Samuel 25:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: id
  text: Namun, demi Yahweh, Allah Israel yang hidup, yang telah mencegah aku berbuat jahat kepadamu, seandainya engkau tidak segera datang menemuiku, pasti sebelum fajar menyingsing tidak akan tersisa seorang laki-laki pun bagi Nabal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang kencing pada dinding,” suatu ungkapan kasar yang berarti “laki-laki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Partikel adversatif ini memperkenalkan pernyataan bersumpah yang berlawanan dengan akibat yang nyaris terjadi.
- source_word: חַי יְהוָה
  choice: demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan rumusan sumpah Ibrani. Bentuk 'demi ... yang hidup' menyampaikan fungsi sumpah secara alami dan khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Menerjemahkan frasa konstruksi secara langsung dan alami.
- source_word: אֲשֶׁר מְנָעַנִי
  choice: yang telah mencegah aku
  rationale: Verba ini menyatakan tindakan menahan atau mencegah; konteks menunjukkan bahwa Yahweh mencegah tindakan yang sudah diniatkan.
- source_word: מֵהָרַע אֹתָךְ
  choice: berbuat jahat kepadamu
  rationale: Pilihan ini dekat dengan bentuk Ibrani dan mempertahankan penilaian moral atas kekerasan yang hendak dilakukan, bukan sekadar akibat berupa luka.
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: seandainya engkau tidak segera datang menemuiku
  rationale: Menyampaikan kondisi kontrafaktual dengan wajar. 'Segera datang' mencakup tindakan bergegas dan datang menemui David tanpa membuat bahasa Indonesia bertele-tele.
- source_word: כִּי אִם נוֹתַר
  choice: pasti ... tidak ... akan dibiarkan hidup
  rationale: כִּי אִם menegaskan akibat kontrafaktual, sedangkan bentuk pasif נוֹתַר dipertahankan. Tambahan 'hidup' menjelaskan bahwa yang dimaksud ialah selamat dari pembantaian, bukan sekadar masih berada di tempat.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: pada waktu fajar
  rationale: Secara harfiah menunjuk pada datangnya terang pagi; 'pada waktu fajar' alami dan tepat.
- source_word: מַשְׁתִּין בְּקִיר
  choice: seorang laki-laki pun
  rationale: Ungkapan kasar harfiah 'yang kencing pada dinding' merupakan idiom yang merujuk kepada laki-laki. Maknanya disampaikan dalam teks, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְנָבָל
  choice: milik Nabal
  rationale: Preposisi menandai hubungan atau kepemilikan, yakni laki-laki yang termasuk dalam rumah tangga Nabal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama diri yang hadir dalam sumber dan membedakannya dari gelar.
- issue: Sifat tindakan David yang dicegah
  choice: berbuat jahat kepadamu
  alternative: mencelakakanmu
  rationale: Bahasa sumber menilai tindakan itu sebagai kejahatan, bukan hanya menyebut akibat fisiknya. Pilihan ini mempertahankan ketegangan bahwa David sendiri mengakui rencana pembalasannya sebagai perbuatan jahat.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kata ganti tunggal 'engkau' mempertahankan sapaan langsung kepada Abigail. Rumusan sumpah dibuat alami tanpa menghilangkan nama Yahweh; idiom kasar dijelaskan dalam catatan kaki.
