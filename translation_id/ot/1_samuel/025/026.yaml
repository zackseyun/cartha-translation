reference: 1 Samuel 25:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: id
  text: Sekarang, tuanku, demi Yahweh yang hidup dan demi hidup tuanku, karena Yahweh telah mencegah tuanku menanggung kesalahan karena menumpahkan darah dan menyelamatkan diri dengan tangan tuanku sendiri,[a] maka sekarang biarlah musuh-musuh tuanku dan orang-orang yang berusaha mencelakakan tuanku menjadi seperti Nabal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “menyelamatkan diri dengan tangan tuanku sendiri” dapat berarti lebih khusus “membalas dendam dengan tangan tuanku sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Nabal adalah nama suami Abigail; nama itu juga menggemakan kata Ibrani yang berarti “bebal.”
    reason: wordplay
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang / maka sekarang
  rationale: Ungkapan ini muncul dua kali dalam teks Ibrani. Kemunculan pertama membuka pernyataan Abigail, sedangkan yang kedua mengantar permohonannya; keduanya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat Abigail kepada Daud. Pilihan ini mempertahankan penghormatan tanpa menyiratkan bahwa Daud adalah ilahi.
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: demi Yahweh yang hidup dan demi hidup tuanku
  rationale: Ini merupakan rumusan sumpah. 'Demi ... yang hidup' dan 'demi hidup ...' terdengar wajar dalam bahasa Indonesia serta mempertahankan kedua unsur sumpah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מְנָעֲךָ
  choice: telah mencegah tuanku
  rationale: Kata kerja ini menyatakan tindakan menahan atau mencegah seseorang melakukan sesuatu.
- source_word: מִבּוֹא בְדָמִים
  choice: menanggung kesalahan karena menumpahkan darah
  rationale: Ungkapan harfiahnya berkaitan dengan 'darah' dalam bentuk jamak dan dalam konteks menunjuk bukan hanya pada pertumpahan darah, melainkan juga pada kesalahan moral yang ditimbulkannya.
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: menyelamatkan diri dengan tangan tuanku sendiri
  rationale: Terjemahan ini mempertahankan arti dasar verba 'menyelamatkan' sekaligus idiom tindakan yang dilakukan dengan tangan sendiri. Makna pembalasan dalam konteks dijelaskan dalam catatan kaki tanpa dimasukkan secara mutlak ke teks utama.
- source_word: יִהְיוּ כְנָבָל
  choice: menjadi seperti Nabal
  rationale: Nabal terutama merupakan nama orang dalam konteks ini, tetapi namanya juga menggemakan kata Ibrani yang berarti 'bebal'.
- source_word: הַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: orang-orang yang berniat mencelakakan tuanku
  rationale: Ungkapan ini berarti mencari atau merencanakan kejahatan terhadap seseorang. 'Berniat mencelakakan' menyampaikan maksudnya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti tindakan yang dicegah Yahweh
  choice: Yahweh mencegah Daud menanggung kesalahan karena pertumpahan darah dan menyelamatkan diri dengan tangannya sendiri.
  alternative: Yahweh mencegah Daud menumpahkan darah dan membalas dendam dengan tangannya sendiri.
  rationale: Teks utama mempertahankan arti leksikal ישׁע, 'menyelamatkan', sementara konteks pembalasan berdarah tetap diakui dalam catatan kaki. Dengan demikian, ketegangan antara bentuk ungkapan dan makna kontekstual tidak dihapus.
- issue: Makna Nabal
  choice: Nabal dipertahankan sebagai nama orang.
  alternative: bebal
  rationale: Rujukan langsungnya adalah suami Abigail yang bernama Nabal, tetapi permainan makna dengan kata 'bebal' dicatat agar gema bahasa Ibraninya tidak hilang.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama pribadi dalam teks sumber ditransliterasikan, bukan diganti dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'tuanku' dipakai secara konsisten untuk menjaga kesantunan Abigail kepada Daud. Struktur sumpah dibuat alami tanpa menghilangkan pengulangan וְעַתָּה dalam sumber Ibrani.
