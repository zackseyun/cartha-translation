base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/004.yaml
  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: id
  text: Ketika berada di padang belantara, Daud mendengar bahwa Nabal sedang mencukur bulu domba-dombanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dalam arti yang lebih luas, “ternak kecilnya.” Kata Ibrani צֹאן dapat merujuk secara kolektif kepada domba dan kambing, meskipun “domba-dombanya” paling sesuai dengan konteks pencukuran bulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk naratif ini menyatakan peristiwa lampau sederhana. “Mendengar” merupakan padanan langsung dan tidak menambahkan implikasi seperti “mendapat kabar” atau “mengetahui.”
- source_word: בַּמִּדְבָּר
  choice: ketika berada di padang belantara
  rationale: מִדְבָּר menunjuk pada kawasan liar atau tanah terbuka, bukan khusus gurun berpasir. Susunan ini secara alami menyatakan lokasi Daud saat mendengar kabar tersebut.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang didengar Daud.
- source_word: גֹזֵז
  choice: sedang mencukur bulu
  rationale: Partisipel Ibrani menunjukkan tindakan yang tengah berlangsung. Dalam bahasa Indonesia, bulu disebutkan secara wajar sebagai objek yang dicukur dari ternak.
- source_word: נָבָל
  choice: Nabal
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶת צֹאנוֹ
  choice: domba-dombanya
  rationale: צֹאן dapat berarti ternak kecil secara kolektif, termasuk domba dan kambing. Dalam konteks pencukuran bulu, “domba-dombanya” adalah padanan yang paling alami dan spesifik, sambil mencatat cakupan yang lebih luas dalam catatan kaki.
theological_decisions: []
