revisions:
- from: Ia bangkit, lalu bersujud dengan wajahnya ke tanah[a] dan berkata, “Lihatlah, hambamu ini bersedia menjadi budak perempuan[b] untuk membasuh kaki para hamba tuanku.”
  to: Ia bangkit lalu bersujud dengan wajah menghadap tanah[a] dan berkata, “Lihatlah, biarlah hamba perempuanmu ini menjadi budak perempuan[b] untuk membasuh kaki para hamba tuanku.”
  rationale: Revisi menghilangkan tambahan makna “bersedia,” menampilkan bentuk feminin pada istilah pertama, dan memperhalus ungkapan postur. Catatan kaki diperbarui agar alternatif leksikal dan pembedaan dua istilah hamba perempuan tetap jelas serta jangkar catatan sesuai dengan teks.
