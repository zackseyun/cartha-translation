  text: She rose and bowed with her face to the ground and said[a], “Behold[b], your servant is a maidservant to wash the feet of the servants of my lord.”
translation:
  language: id
  text: Ia bangkit lalu bersujud dengan wajah menghadap tanah[a] dan berkata, “Lihatlah, biarlah hamba perempuanmu ini menjadi budak perempuan[b] untuk membasuh kaki para hamba tuanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “merebahkan diri dengan wajah ke tanah.” Ini adalah sikap penghormatan yang sangat dalam.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai dua istilah yang berdekatan bagi hamba perempuan: “hamba perempuanmu” dan “budak perempuan.” Keduanya juga dapat diterjemahkan dengan istilah yang sama, “hamba perempuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Ia bangkit
  rationale: Bentuk wayyiqtol Qal dari קום melanjutkan urutan narasi; “bangkit” alami dan tetap bermartabat dalam bahasa Indonesia.
- source_word: וַתִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: bersujud dengan wajahnya ke tanah
  rationale: Ungkapan ini menggambarkan penghormatan mendalam dengan tubuh merendah dan wajah menghadap tanah; “bersujud” menyampaikan posturnya tanpa menentukan makna ibadah.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru deiktis ini menarik perhatian kepada pernyataan Abigail tentang dirinya. “Lihatlah” mempertahankan fungsi tersebut dalam bahasa Indonesia modern.
- source_word: אֲמָתְךָ
  choice: hambamu ini
  rationale: אָמָה adalah sebutan bagi hamba perempuan. Bentuk “hambamu” mempertahankan tutur merendah kepada David, sedangkan “ini” membantu menyampaikan daya penunjuk הִנֵּה secara alami.
- source_word: לְשִׁפְחָה
  choice: menjadi budak perempuan
  rationale: שִׁפְחָה menunjuk perempuan dalam kedudukan pelayanan yang rendah dan dapat mencakup status perbudakan. “Budak perempuan” membedakannya dari אֲמָתְךָ serta mempertahankan penguatan kerendahan diri Abigail.
- source_word: לִרְחֹץ
  choice: untuk membasuh
  rationale: Infinitif dengan לְ menyatakan tujuan; “untuk membasuh” adalah padanan langsung dan alami.
- source_word: רַגְלֵי עַבְדֵי אֲדֹנִי
  choice: kaki para hamba tuanku
  rationale: Susunan konstruksi Ibrani dipertahankan dengan ungkapan Indonesia yang alami. “Hamba” sesuai bagi para pelayan David, dan “tuanku” mempertahankan sapaan hormat Abigail.
theological_decisions:
- issue: Pembedaan istilah perempuan dalam kedudukan hamba, אמה dan שפחה
  choice: Menerjemahkan אֲמָתְךָ sebagai “hambamu ini” dan שִׁפְחָה sebagai “budak perempuan”
  alternative: Menerjemahkan keduanya dengan “hamba perempuan” atau “pelayan perempuan”
  rationale: Teks memakai dua istilah yang berdekatan tetapi tidak identik. Pembedaan dalam terjemahan mempertahankan gerak retoris Abigail yang makin merendahkan dirinya, tanpa menyimpulkan sistem hukum atau status sosialnya secara lebih terperinci daripada yang dinyatakan teks.
- issue: Makna tindakan השתחוה dalam konteks ini
  choice: “bersujud” sebagai sikap penghormatan mendalam
  alternative: “membungkuk” atau “merebahkan diri”
  rationale: Keterangan “dengan wajahnya ke tanah” menunjukkan tindakan yang lebih dalam daripada sekadar membungkuk. Dalam konteks ini tindakan tersebut merupakan penghormatan kepada David, bukan pernyataan eksplisit tentang penyembahan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Sapaan “tuanku” serta bentuk “hambamu” mempertahankan kesantunan dan kerendahan diri dalam lingkungan istana. “Budak perempuan” sengaja dipakai untuk mencerminkan perbedaan leksikal dan rendahnya kedudukan pelayanan yang ditawarkan Abigail; catatan kaki menjaga alternatif yang lebih halus.
