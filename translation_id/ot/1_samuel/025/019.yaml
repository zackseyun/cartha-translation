  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: id
  text: Ia berkata kepada para pelayannya, “Pergilah mendahului aku. Lihat, aku datang di belakang kalian.” Namun, ia tidak memberitahukan hal itu kepada Nabal, suaminya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian tindakan dalam narasi; urutannya cukup jelas tanpa konjungsi eksplisit dalam bahasa Indonesia.
- source_word: לִנְעָרֶיהָ
  choice: kepada para pelayannya
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pembantu. Dalam konteks ini mereka menjalankan perintah Abigail dan membawa pemberian, sehingga 'para pelayannya' paling jelas dan alami.
- source_word: עִבְרוּ לְפָנַי
  choice: Berjalanlah mendahului aku
  rationale: Gabungan verba עבר dan frasa לְפָנַי menyatakan gerak maju di depan Abigail. Ungkapan ini mempertahankan makna spasialnya secara alami.
- source_word: הִנְנִי אַחֲרֵיכֶם בָּאָה
  choice: Aku akan menyusul kalian
  rationale: Secara harfiah, Abigail menarik perhatian pada kenyataan bahwa ia datang di belakang mereka. 'Akan menyusul kalian' menyampaikan maksud tindakan tersebut dengan wajar dalam bahasa Indonesia tanpa mengubah urutan perjalanan.
- source_word: וּלְאִישָׁהּ נָבָל
  choice: Namun, ... kepada Nabal, suaminya
  rationale: אִישׁ dengan sufiks feminin tunggal merujuk kepada suaminya. Konjungsi diberi nilai kontras karena informasi kepada para pelayan berlawanan dengan apa yang dirahasiakan dari Nabal.
- source_word: לֹא הִגִּידָה
  choice: ia tidak memberitahukan hal itu
  rationale: Bentuk Hifil dari נגד berarti memberi tahu atau melaporkan. 'Hal itu' merupakan objek tersirat yang diperlukan agar kalimat Indonesia terasa lengkap.
