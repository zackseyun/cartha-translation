translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'ia' digunakan untuk narasi, sedangkan 'aku/kalian' digunakan dalam dialog. Terjemahan mempertahankan perbedaan antara instruksi Abigail kepada para pelayan dan tindakannya merahasiakan rencana tersebut dari Nabal.
