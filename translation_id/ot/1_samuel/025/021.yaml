  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: id
  text: Daud berkata, “Sungguh, sia-sia aku menjaga segala milik orang ini di padang gurun, sehingga tidak ada satu pun dari segala miliknya yang hilang. Ia malah membalas kebaikanku dengan kejahatan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: Sungguh, sia-sia
  rationale: אַךְ memberi penegasan, sedangkan לַשֶּׁקֶר dalam konteks ini menyatakan bahwa upaya Daud ternyata tidak menghasilkan balasan yang semestinya; frasa ini alami dan tetap dekat dengan sumber.
- source_word: שָׁמַרְתִּי
  choice: aku menjaga
  rationale: Menerjemahkan tindakan melindungi atau mengawasi milik Nabal secara langsung.
- source_word: נִפְקַד ... מְאוּמָה
  choice: tidak ada satu pun ... yang hilang
  rationale: Ungkapan pasif Ibrani berarti tidak satu barang pun didapati kurang atau tidak ada; 'yang hilang' menyampaikan maksudnya secara wajar.
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: Ia malah membalas kebaikanku dengan kejahatan
  rationale: Mempertahankan kontras tajam antara רָעָה dan טוֹבָה; 'malah' secara alami menandai balasan yang berlawanan dengan harapan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kala lampau pluskuamperfek Inggris tidak dipaksakan karena bahasa Indonesia tidak menandainya secara morfologis; konteks naratif menentukan urutan waktunya.
