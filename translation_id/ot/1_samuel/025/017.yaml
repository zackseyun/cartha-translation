language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: id
  text: Sekarang, ketahuilah hal ini dan pertimbangkanlah apa yang harus kaulakukan, sebab malapetaka telah dipastikan akan menimpa tuan kita dan seluruh rumah tangganya. Ia orang yang begitu bejat[a] sehingga tidak seorang pun dapat berbicara dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak kebejatan” atau “anak yang tidak berguna”; secara tradisional: “anak Belial.”'
    reason: Menjelaskan idiom Ibrani dan mempertahankan akses pembaca kepada bentuk harfiah serta terjemahan tradisionalnya.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan yang mendesak dalam perkataan hamba itu; bentuk ini alami dalam bahasa Indonesia tanpa perlu mempertahankan konjungsi pembuka secara mekanis.
- source_word: דְּעִי וּרְאִי
  choice: ketahuilah hal ini dan pertimbangkanlah
  rationale: Kedua imperatif feminin tunggal ditujukan kepada Abigail. 'Pertimbangkanlah' menyampaikan fungsi deliberatif ראי dalam konteks ini, bukan sekadar tindakan melihat.
- source_word: מַה תַּעֲשִׂי
  choice: apa yang harus kaulakukan
  rationale: Bentuk imperfek menunjuk pada tindakan yang kini perlu dipikirkan. 'Harus' menyampaikan urgensi praktis permohonan hamba itu tanpa menjadikannya perintah langsung.
- source_word: כָלְתָה הָרָעָה
  choice: malapetaka telah dipastikan akan menimpa
  rationale: Ungkapan ini menyatakan bahwa akibat buruk sudah tetap atau pasti. 'Malapetaka' sesuai dengan ancaman kehancuran dalam konteks, sedangkan 'telah dipastikan akan menimpa' mempertahankan gagasan hasil yang sudah ditentukan.
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: akan menimpa tuan kita dan seluruh rumah tangganya
  rationale: Arah ancaman disampaikan secara idiomatis dengan 'menimpa'. 'Rumah tangga' mencakup orang-orang yang berada di bawah tanggung jawab Nabal, bukan hanya bangunannya.
- source_word: בֶּן בְּלִיַּעַל
  choice: orang yang begitu bejat
  rationale: Idiom Ibrani ini menggambarkan seseorang yang hina secara moral dan sukar dikendalikan. 'Bejat' lebih jelas bagi pembaca Indonesia modern daripada terjemahan harfiah dan tidak menjadikan Belial sebagai nama diri.
- source_word: מִדַּבֵּר אֵלָיו
  choice: sehingga tidak seorang pun dapat berbicara dengannya
  rationale: 'Konstruksi ini menyatakan akibat: wataknya membuat orang tidak mungkin mengajaknya berbicara atau menasihatinya. Subjek umum dipertahankan dengan ''tidak seorang pun''.'
theological_decisions:
- issue: Makna idiom בֶּן בְּלִיַּעַל
  choice: orang yang begitu bejat
  alternative: anak Belial; anak kebejatan; orang yang tidak berguna
  rationale: Dalam konteks ini frasa tersebut merupakan idiom bagi orang yang hina atau bejat, bukan rujukan yang harus dipahami sebagai nama suatu sosok jahat. Terjemahan ini tidak memasukkan demonologi yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk 'kau-' dipakai sesuai ejaan baku dalam tuturan langsung. Urgensi perkataan hamba dipertahankan tanpa membuatnya terdengar terlalu resmi atau kuno.
