base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: id
  text: Abigail bergegas mengambil dua ratus roti, dua kirbat anggur, lima ekor domba yang sudah disiapkan, lima sea biji-bijian panggang[a], seratus tandan kismis, dan dua ratus kue ara. Lalu ia memuat semuanya ke atas keledai-keledai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sea adalah satuan takaran kering pada zaman dahulu.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: segera
  rationale: Kata kerja ini menyatakan tindakan bergegas. “Segera” menyampaikan urgensi narasi secara alami dalam bahasa Indonesia.
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: Ini adalah padanan langsung dan wajar bagi לקח dalam konteks mengumpulkan perbekalan.
- source_word: מָאתַיִם לֶחֶם
  choice: dua ratus roti
  rationale: לֶחֶם berarti roti; dalam bahasa Indonesia, “roti” dapat langsung dihitung setelah bilangan tanpa perlu menambahkan kata penggolong.
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: dua kirbat anggur
  rationale: נֵבֶל di sini menunjuk kepada wadah cairan dari kulit. “Kirbat” mempertahankan latar budaya kuno dan menghindari gambaran botol modern.
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: lima ekor domba yang sudah diolah
  rationale: Bentuk partisip dari עשה menunjukkan bahwa domba-domba itu telah disiapkan untuk dimakan. “Diolah” mempertahankan cakupan makna tanpa menentukan secara berlebihan apakah sudah disembelih, dibersihkan, atau dimasak.
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: lima sea biji-bijian panggang
  rationale: סְאָה adalah satuan takaran kering tertentu dan dipertahankan sebagai “sea”; קָלִי menunjuk kepada biji-bijian yang dipanggang atau disangrai. Catatan kaki menjelaskan satuan kuno tersebut.
- source_word: מֵאָה צִמֻּקִים
  choice: seratus gugus kismis
  rationale: צִמֻּקִים berarti kismis. Karena benda itu dihitung dalam daftar perbekalan, “gugus kismis” menyampaikan kelompok-kelompok kismis tanpa menyamakannya secara pasti dengan kue kismis.
- source_word: מָאתַיִם דְּבֵלִים
  choice: dua ratus kue ara
  rationale: דְּבֵלָה menunjuk kepada buah ara yang dipadatkan menjadi kue atau lempengan. “Kue ara” ringkas dan mudah dipahami.
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: Lalu ia memuat semuanya ke atas keledai-keledai
  rationale: Secara harfiah verba ini berarti menaruh atau meletakkan. Dalam konteks perbekalan dan hewan pengangkut, “memuat” mengungkapkan tindakan yang dimaksud dengan alami.
