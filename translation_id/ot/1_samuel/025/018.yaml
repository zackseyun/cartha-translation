translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah budaya kuno “kirbat” dan “sea” dipertahankan demi ketepatan historis; “sea” dijelaskan dalam catatan kaki. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar daftar perbekalan tetap mudah dibaca.
