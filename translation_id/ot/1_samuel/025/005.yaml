base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: id
  text: Lalu Daud mengutus sepuluh pemuda. Daud berkata kepada mereka, “Pergilah ke Karmel, temuilah Nabal, dan atas namaku, tanyakanlah kepadanya kabarnya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tanyakanlah kepadanya tentang kesejahteraannya.” Secara harfiah, “tanyakanlah kepadanya demi damai/kesejahteraan,” yakni sampaikan salam dan tanyakan keadaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks pengiriman para pembawa pesan, 'mengutus' alami dan lebih tepat daripada sekadar 'mengirim'.
- source_word: עֲשָׂרָה נְעָרִים
  choice: sepuluh orang muda
  rationale: נְעָרִים dapat berarti pemuda atau pelayan muda; 'orang muda' mempertahankan arti leksikal tanpa menetapkan status mereka secara berlebihan.
- source_word: עֲלוּ כַרְמֶלָה
  choice: Pergilah ke Karmel
  rationale: עלה dalam petunjuk perjalanan dapat berarti pergi naik; bahasa Indonesia lazim cukup memakai 'pergilah ke', sementara akhiran arah pada כַרְמֶלָה menunjukkan tujuan.
- source_word: וּבָאתֶם אֶל נָבָל
  choice: temuilah Nabal
  rationale: Secara harfiah 'datanglah kepada Nabal'; 'temuilah Nabal' menyampaikan maksud instruksi secara alami dari sudut pandang Daud.
- source_word: בִשְׁמִי
  choice: atas namaku
  rationale: Ungkapan ini mempertahankan gagasan bahwa para utusan berbicara dengan kewenangan atau sebagai wakil Daud.
- source_word: וּשְׁאֶלְתֶּם לוֹ ... לְשָׁלוֹם
  choice: tanyakanlah kabarnya
  rationale: Gabungan שאל dan לְשָׁלוֹם merupakan ungkapan untuk menanyakan keadaan atau kesejahteraan seseorang sebagai salam; pilihan ini alami dalam bahasa Indonesia.
