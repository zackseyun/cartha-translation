source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע דָּוִד֮ כִּ֣י מֵ֣ת נָבָל֒ וַ/יֹּ֡אמֶר בָּר֣וּךְ יְהוָ֡ה אֲשֶׁ֣ר רָב֩ אֶת רִ֨יב חֶרְפָּתִ֜/י מִ/יַּ֣ד נָבָ֗ל וְ/אֶת עַבְדּ/וֹ֙ חָשַׂ֣ךְ מֵֽ/רָעָ֔ה וְ/אֵת֙ רָעַ֣ת נָבָ֔ל הֵשִׁ֥יב יְהוָ֖ה בְּ/רֹאשׁ֑/וֹ וַ/יִּשְׁלַ֤ח דָּוִד֙ וַ/יְדַבֵּ֣ר בַּ/אֲבִיגַ֔יִל לְ/קַחְתָּ֥/הּ ל֖/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: id
  text: Ketika Daud mendengar bahwa Nabal telah mati, berkatalah ia, “Terpujilah Yahweh, yang telah membela perkaraku atas penghinaan yang dilakukan Nabal terhadapku, dan yang telah menahan hamba-Nya dari berbuat jahat.[a] Yahweh telah membalikkan kejahatan Nabal ke atas kepalanya sendiri.”[b] Kemudian Daud mengutus orang untuk berbicara kepada Abigail guna mengambilnya sebagai istrinya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mencegah hamba-Nya melakukan kejahatan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Yahweh telah mengembalikan kejahatan Nabal ke atas kepalanya,” suatu ungkapan bahwa perbuatan jahat berbalik menimpa pelakunya.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “untuk mengambilnya bagi dirinya sebagai istri,” yaitu menikahinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: Terpujilah Yahweh
  rationale: Ungkapan berkat atau pujian Ibrani ini diterjemahkan dengan rumusan Indonesia yang alami dan bernada doksologis; nama ilahi tetap ditransliterasikan sebagai Yahweh.
- source_word: רָב אֶת רִיב חֶרְפָּתִי מִיַּד נָבָל
  choice: telah membela perkaraku atas penghinaan yang dilakukan Nabal terhadapku
  rationale: Menjaga citra hukum dalam pengulangan akar ריב, sambil mengungkapkan מִיַּד secara alami sebagai tindakan yang berasal dari Nabal.
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: dan yang telah menahan hamba-Nya dari berbuat jahat
  rationale: חָשַׂךְ menyatakan tindakan menahan atau mencegah, sedangkan רָעָה di sini tetap membawa penilaian moral atas kekerasan balas dendam yang hendak dilakukan Daud.
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: Yahweh telah membalikkan kejahatan Nabal ke atas kepalanya sendiri
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang kejahatan yang kembali menimpa pelakunya, dengan catatan penjelas bagi pembaca.
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: Kemudian Daud mengutus orang untuk berbicara kepada Abigail
  rationale: Subjek tersirat dari tindakan berbicara dipahami sebagai utusan Daud. Rumusan ini tetap dekat dengan dua verba sumber dan tidak mengganti דבר dengan verba yang secara eksplisit berarti 'melamar'.
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: dan meminangnya menjadi istrinya
  rationale: Ungkapan perkawinan Ibrani 'mengambilnya bagi dirinya sebagai istri' disampaikan secara alami dalam bahasa Indonesia sesuai maksud konteks.
theological_decisions:
- issue: Penghakiman dan pemeliharaan ilahi dalam kematian Nabal
  choice: Ucapan Daud secara tegas mengaitkan pembelaan perkaranya dan akibat kejahatan Nabal dengan tindakan Yahweh.
  alternative: Menyatakan secara lebih eksplisit bahwa Yahweh mengeksekusi Nabal, atau melemahkan hubungan itu menjadi akibat alami semata.
  rationale: Teks menyajikan penafsiran Daud bahwa Yahweh membela dan membalas, tetapi ayat ini tidak perlu diperluas menjadi pernyataan umum tentang semua kematian atau penderitaan.
- issue: Bobot moral kata רָעָה dalam tindakan Daud yang dicegah
  choice: dari berbuat jahat
  alternative: dari mencelakakan orang atau dari membalas dendam
  rationale: Pilihan ini mempertahankan bobot moral istilah sumber sekaligus membiarkan konteks menjelaskan bahwa yang dimaksud ialah rencana kekerasan dan balas dendam Daud.
- issue: Hubungan antara pengutusan, pembicaraan, dan lamaran kepada Abigail
  choice: Daud mengutus orang untuk berbicara kepada Abigail dan meminangnya menjadi istrinya.
  alternative: Daud mengirim lamaran kepada Abigail; atau Daud mengutus orang dan berbicara mengenai Abigail.
  rationale: Konteks perkawinan mendukung tujuan lamaran, tetapi verba 'berbicara' tetap diwakili agar rincian gramatikal sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra hukum pada pembelaan perkara serta idiom pembalasan dipertahankan sejauh tetap mudah dipahami; ungkapan perkawinan dibuat lebih alami tanpa memasukkan rincian teologis tambahan.
