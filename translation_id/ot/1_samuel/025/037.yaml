base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: id
  text: Pada pagi harinya, ketika pengaruh anggur itu telah hilang dari Nabal[a], istrinya memberitahukan semua hal itu kepadanya. Lalu hatinya mati di dalam dirinya[b], dan ia menjadi seperti batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika anggur itu keluar dari Nabal,” maksudnya ketika ia sudah sadar dari mabuk atau ketika pengaruh anggur itu telah lenyap.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hatinya gagal di dalam dirinya.” Bahasa Ibrani memakai gambaran yang hidup, bukan diagnosis medis teknis.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: Pada pagi harinya
  rationale: Ungkapan waktu yang alami dalam narasi bahasa Indonesia dan sesuai dengan arti harfiah bahasa Ibrani.
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: ketika pengaruh anggur itu telah hilang dari Nabal
  rationale: Bahasa Ibrani secara harfiah menggambarkan anggur 'keluar dari' Nabal. Terjemahan ini mempertahankan sebagian citraan tersebut sekaligus menjelaskan secara alami bahwa efek kemabukannya telah berlalu.
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: istrinya memberitahukan ... kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan, menceritakan, atau melaporkan; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: semua hal itu
  rationale: דברים dapat berarti perkataan, perkara, atau hal-hal. Dalam konteks ini Abigail menyampaikan rangkaian kejadian sebelumnya, sehingga 'semua hal itu' paling sesuai.
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: hatinya mati di dalam dirinya
  rationale: Mempertahankan citraan kuat bahasa Ibrani tanpa mengubahnya menjadi diagnosis medis tertentu.
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: ia menjadi seperti batu
  rationale: Menyampaikan perbandingan bahasa Ibrani secara alami tanpa menentukan apakah keadaan itu berupa kelumpuhan, syok, atau kondisi medis lainnya.
theological_decisions:
- issue: Apakah keadaan Nabal harus ditafsirkan sebagai diagnosis medis tertentu
  choice: 'Mempertahankan gambaran Ibrani: ''hatinya mati di dalam dirinya, dan ia menjadi seperti batu.'''
  alternative: Menerjemahkannya sebagai serangan jantung, strok, kelumpuhan, atau kegagalan jantung.
  rationale: Teks memakai bahasa naratif yang hidup, bukan istilah medis teknis. Diagnosis yang lebih khusus akan melampaui bukti yang diberikan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Citraan utama teks Ibrani dipertahankan, sedangkan ungkapan tentang anggur dibuat cukup alami dan dijelaskan melalui catatan kaki.
