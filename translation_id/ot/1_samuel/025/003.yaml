  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: id
  text: Nama orang itu Nabal, dan nama istrinya Abigail. Perempuan itu cerdas dan cantik parasnya, tetapi laki-laki itu kasar dan jahat dalam perbuatannya. Ia seorang keturunan Kaleb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani kemungkinan berarti “seorang keturunan Kaleb,” yaitu anggota kaum Kaleb. Bentuk tertulisnya tidak biasa, dan ada kemungkinan bentuk itu dibaca dengan cara lain.
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: Nabal
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲבִגָיִל
  choice: Abigail
  rationale: Nama diri ditransliterasikan dalam bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: טוֹבַת שֶׂכֶל
  choice: cerdas
  rationale: Ungkapan ini secara harfiah menunjuk pada baiknya pengertian atau akal; 'cerdas' menyampaikan pujian atas kemampuan mentalnya secara alami dalam bahasa Indonesia modern.
- source_word: וִיפַת תֹּאַר
  choice: cantik parasnya
  rationale: Konstruksi ini menggambarkan keelokan rupa atau penampilan fisik; ungkapan ini alami, konkret, dan bermartabat.
- source_word: קָשֶׁה
  choice: kasar
  rationale: Dalam konteks watak dan hubungan antarmanusia, kata ini menggambarkan sikap keras atau kasar, bukan sekadar sesuatu yang sulit.
- source_word: רַע מַעֲלָלִים
  choice: jahat dalam perbuatannya
  rationale: מַעֲלָלִים berarti perbuatan, tindakan, atau perilaku; terjemahan ini mempertahankan cakupan umum sumber tanpa membatasinya hanya pada urusan dengan orang lain.
- source_word: כלבו
  choice: seorang keturunan Kaleb
  rationale: Pembacaan tradisional memahami bentuk yang tidak biasa ini sebagai penanda hubungan klan dengan Kaleb. 'Keturunan Kaleb' lebih mudah dipahami pembaca Indonesia daripada bentuk gentilisia yang jarang dipakai.
theological_decisions:
- issue: Penafsiran וְהוּא כלבו
  choice: Ia seorang keturunan Kaleb
  alternative: Bentuk tertulisnya tidak biasa dan mungkin dibaca dengan cara lain
  rationale: Ini terutama persoalan tekstual dan leksikal. Pemahaman genealogis atau kesukuan paling sesuai dengan pembacaan tradisional dan konteks, tetapi ketidaklaziman bentuk Ibraninya dipertahankan dalam catatan kaki agar ambiguitas tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kontras antara Abigail dan Nabal dipertahankan dengan 'tetapi'. Penanda catatan kaki ditempatkan sesudah frasa yang dipersoalkan agar acuannya jelas.
