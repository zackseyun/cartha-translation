  text: וַ/יָּבֹ֜אוּ עַבְדֵ֥י דָוִ֛ד אֶל אֲבִיגַ֖יִל הַ/כַּרְמֶ֑לָ/ה וַ/יְדַבְּר֤וּ אֵלֶ֨י/הָ֙ לֵ/אמֹ֔ר דָּוִד֙ שְׁלָחָ֣/נוּ אֵלַ֔יִ/ךְ לְ/קַחְתֵּ֥/ךְ ל֖/וֹ לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: id
  text: Lalu para pelayan Daud datang kepada Abigail di Karmel dan berkata kepadanya, “Daud mengutus kami kepadamu untuk mengambilmu menjadi istrinya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Kata בוא dapat berarti datang atau pergi menurut sudut pandang; narasi berfokus pada tibanya para utusan di tempat Abigail.
- source_word: עַבְדֵי דָוִד
  choice: para pelayan Daud
  rationale: עֶבֶד dapat berarti hamba, budak, pelayan, atau pejabat. Dalam konteks ini mereka bertindak sebagai utusan Daud, tanpa penekanan pada status perbudakan.
- source_word: הַכַּרְמֶלָה
  choice: di Karmel
  rationale: Akhiran lokatif menunjukkan gerak menuju Karmel; setelah verba kedatangan, bahasa Indonesia alami menyatakan tempat tibanya dengan 'di Karmel'.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: berkata kepadanya
  rationale: Ungkapan pengantar ujaran Ibrani ini diterjemahkan secara alami dan ringkas dalam bahasa Indonesia tanpa kehilangan fungsi naratifnya.
- source_word: שְׁלָחָנוּ
  choice: mengutus kami
  rationale: Bentuk perfektif menyatakan tindakan pengutusan yang telah dilakukan; bahasa Indonesia tidak perlu menandai aspek ini dengan unsur tambahan.
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: untuk mengambilmu menjadi istrinya
  rationale: Terjemahan ini mempertahankan verba 'mengambil' dan menyampaikan maksud perkawinan dari ungkapan Ibrani secara jelas serta alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Pelayan' dipilih daripada 'budak' karena fungsi tokoh-tokoh ini sebagai utusan; 'mengambilmu menjadi istrinya' mempertahankan bentuk ungkapan perkawinan dalam teks sumber.
