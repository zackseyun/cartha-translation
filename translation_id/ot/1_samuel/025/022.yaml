  source_fidelity: Teks utama dengan tepat mempertahankan pembacaan Masoret לְאֹיְבֵי דָוִד sebagai “kepada musuh-musuh Daud,” tanpa mengubahnya menjadi kutuk terhadap Daud atau terhadap penuturnya. Rumus sumpah, batas waktu, serta idiom maskulin yang bernada kasar tersampaikan dengan setia. Struktur “jika ... aku menyisakan ... pun” wajar dalam konteks sumpah dan menyampaikan daya negatif yang tersirat dalam rumus kutuk tersebut.
  naturalness: Bahasa Indonesia baku, modern, dan mengalir. “Kiranya Allah berbuat demikian ... bahkan lebih lagi” berfungsi baik sebagai rumus sumpah yang khidmat. “Seorang laki-laki pun” jelas dan idiomatis dalam konteks ancaman.
