  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֹּה יַעֲשֶׂ֧ה אֱלֹהִ֛ים לְ/אֹיְבֵ֥י דָוִ֖ד וְ/כֹ֣ה יֹסִ֑יף אִם אַשְׁאִ֧יר מִ/כָּל אֲשֶׁר ל֛/וֹ עַד הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: id
  text: Kiranya Allah berbuat demikian kepada musuh-musuh Daud[a], bahkan lebih lagi, jika sampai pagi aku menyisakan seorang laki-laki pun dari semua orang yang menjadi miliknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian penafsir memahami “musuh-musuh Daud” sebagai penghalusan oleh penyalin untuk “Daud” atau “aku”, sebab rumus sumpah seperti ini biasanya berupa kutuk terhadap diri orang yang bersumpah.
    reason: textual_variant
  - marker: b
    text: 'Secara harfiah: “orang yang kencing pada tembok,” ungkapan kasar dalam bahasa Ibrani yang berarti “laki-laki.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: Kiranya Allah berbuat demikian ... bahkan lebih lagi
  rationale: Ungkapan ini merupakan rumus sumpah atau kutuk Ibrani. Terjemahan ini mempertahankan daya kutuknya sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba yang menyertainya tunggal dan yang dimaksud ialah Allah yang esa dalam rumus sumpah.
- source_word: לְאֹיְבֵי דָוִד
  choice: kepada musuh-musuh Daud
  rationale: Teks Masoret berbunyi demikian, meskipun rumus sumpah biasanya mengarahkan kutuk kepada orang yang bersumpah. Bacaan yang sulit ini dipertahankan dan diterangkan dalam catatan kaki.
- source_word: אִם
  choice: jika
  rationale: Dalam konteks sumpah, kata ini memperkenalkan syarat yang membuat kutuk berlaku. Struktur bersyarat sumber dipertahankan tanpa menambahkan penjelasan ke dalam teks.
- source_word: אַשְׁאִיר
  choice: aku menyisakan
  rationale: Bentuk kausatif dari שׁאר berarti membiarkan tetap ada atau menyisakan. Pilihan ini lebih tepat daripada 'mengampuni', yang akan menambahkan tafsiran.
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: dari semua orang yang menjadi miliknya
  rationale: Secara harfiah ungkapan ini berarti 'dari semua yang ada padanya/miliknya'. Konteks dan ungkapan berikutnya menunjuk kepada orang-orang laki-laki dalam rumah tangga Nabal.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Pilihan ini mempertahankan batas waktu yang dinyatakan oleh teks Ibrani dan alami dalam bahasa Indonesia.
- source_word: מַשְׁתִּין בְּקִיר
  choice: seorang laki-laki pun
  rationale: Ungkapan Ibrani yang kasar ini secara harfiah berarti 'orang yang kencing pada tembok' dan merujuk dengan nada merendahkan kepada laki-laki. Maknanya disampaikan dengan jelas dalam teks, sedangkan bentuk harfiahnya dicatat.
theological_decisions:
- issue: Rumusan Masoret 'musuh-musuh Daud' dalam sumpah
  choice: Mempertahankan 'musuh-musuh Daud' dalam teks utama
  alternative: Menerjemahkan 'Daud' atau 'aku', dengan menganggap 'musuh-musuh Daud' sebagai penghalusan oleh penyalin
  rationale: Teks sumber yang tersedia secara eksplisit menyebut 'musuh-musuh Daud'. Kesulitan kontekstualnya tidak diselesaikan diam-diam; kemungkinan penghalusan penyalin disampaikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan tanpa menghilangkan kerasnya ancaman Daud. Rumus sumpah dipertahankan secara cukup formal, sedangkan ungkapan kasar sumber dijelaskan dalam catatan kaki agar teks utama tetap jelas bagi pembaca umum.
