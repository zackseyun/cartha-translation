base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: id
  text: Lalu Daud mengambil dari tangannya apa yang telah dibawanya kepadanya. Ia berkata kepadanya, “Pulanglah dengan damai ke rumahmu. Lihatlah, aku telah mendengarkan perkataanmu dan menerimamu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkenan kepadamu” atau “mengabulkan permintaanmu”; secara harfiah, “mengangkat wajahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח ... מִיָּדָהּ
  choice: mengambil dari tangannya
  rationale: Mempertahankan tindakan konkret ‘mengambil’ serta gambaran eksplisit ‘dari tangannya’ dalam bahasa Ibrani.
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: apa yang telah dibawanya untuk Daud
  rationale: Menyampaikan klausa relatif dengan alami; nama Daud dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: Pulanglah dengan damai ke rumahmu
  rationale: Secara harfiah עֲלִי berarti ‘naiklah’, tetapi dalam konteks perpisahan ungkapan ini menyuruh Abigail kembali ke rumah; ‘pulanglah’ menyampaikan maksudnya secara alami, sedangkan ‘dengan damai’ mempertahankan formula keselamatan dan keadaan damai.
- source_word: רְאִי
  choice: Ketahuilah
  rationale: Imperatif ini berfungsi menarik perhatian kepada pernyataan berikutnya. ‘Ketahuilah’ lebih alami daripada ‘lihatlah’ ketika objeknya berupa penegasan verbal.
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: aku telah mendengarkan perkataanmu
  rationale: Ungkapan harfiahnya ‘mendengarkan suaramu’, tetapi dalam konteks ini berarti memperhatikan dan mengindahkan perkataan Abigail. ‘Perkataanmu’ mempertahankan unsur komunikasi tanpa menjadi kaku.
- source_word: וָאֶשָּׂא פָנָיִךְ
  choice: menerima engkau
  rationale: Idiom yang secara harfiah berarti ‘mengangkat wajahmu’ menyatakan penerimaan atau pemberian perkenanan. Pilihan ini tetap berfokus pada Abigail sebagai pribadi dan tidak mempersempit maknanya hanya menjadi pengabulan permintaan.
theological_decisions:
- issue: Makna idiom וָאֶשָּׂא פָנָיִךְ
  choice: menerima engkau
  alternative: berkenan kepadamu; mengabulkan permintaanmu; secara harfiah, mengangkat wajahmu
  rationale: Teks menyatakan penerimaan/perkenanan Daud terhadap Abigail dan implikasinya bahwa permohonannya diindahkan. Terjemahan utama tidak membatasi idiom itu hanya pada salah satu nuansa, sedangkan catatan kaki mempertahankan bentuk harfiah dan alternatif maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Pulanglah’ dipilih daripada terjemahan harfiah ‘naiklah’ agar perintah perpisahan terdengar alami. Bentuk ‘menerima engkau’ sengaja sedikit lebih formal untuk mempertahankan fokus personal idiom Ibrani, dengan penjelasan pada catatan kaki.
