revisions:
- from: Lalu Daud mengambil dari tangannya apa yang telah dibawanya untuk Daud. Ia berkata kepadanya, “Pulanglah dengan damai ke rumahmu. Ketahuilah, aku telah mendengarkan perkataanmu dan menerima engkau[a].”
  to: Lalu Daud mengambil dari tangannya apa yang telah dibawanya kepadanya. Ia berkata kepadanya, “Pulanglah dengan damai ke rumahmu. Lihatlah, aku telah mendengarkan perkataanmu dan menerimamu[a].”
  rationale: Revisi membetulkan relasi penerima yang dinyatakan oleh לוֹ, mendekatkan penanda perhatian kepada רְאִי, dan memodernkan bentuk pronominal tanpa mengurangi ambiguitas idiom Ibrani pada frasa penutup. Catatan kaki dipertahankan karena secara memadai menandai alternatif makna dan bentuk harfiah idiom tersebut.
