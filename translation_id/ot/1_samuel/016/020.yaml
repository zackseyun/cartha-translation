base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: id
  text: Lalu Isai mengambil seekor keledai[a], roti, sebuah kantong kulit berisi anggur, dan seekor anak kambing. Ia mengirimkan semua itu kepada Saul melalui Daud, anaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seekor keledai, roti.” Frasa ini dapat dipahami sebagai seekor keledai yang membawa atau dimuati roti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melalui tangan Daud, anaknya,” yaitu dengan perantaraan Daud atau dengan Daud sebagai pembawa kiriman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu Isai mengambil
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: חֲמוֹר לֶחֶם
  choice: seekor keledai yang dimuati roti
  rationale: Teks Ibrani menempatkan “keledai” dan “roti” berdampingan tanpa menyatakan hubungannya secara eksplisit. Dalam konteks kiriman bekal, keledai dipahami sebagai hewan pengangkut roti; hubungan yang disuplai dalam terjemahan dijelaskan dalam catatan kaki.
- source_word: נֹאד יַיִן
  choice: sekantong kulit berisi anggur
  rationale: נֹאד adalah wadah yang dibuat dari kulit, lazimnya untuk anggur. Pilihan ini jelas bagi pembaca modern dan tidak menggantinya dengan wadah modern seperti botol.
- source_word: גְּדִי עִזִּים אֶחָד
  choice: seekor anak kambing
  rationale: Ungkapan ini menunjuk pada satu ekor kambing muda; “seekor anak kambing” menyampaikan jenis, usia, dan jumlah secara alami.
- source_word: וַיִּשְׁלַח
  choice: Ia mengirimkan semuanya
  rationale: Objek verba tersirat dari daftar pemberian sebelumnya. “Semuanya” memperjelas bahwa seluruh bekal tersebut dikirim tanpa menambah objek baru.
- source_word: בְּיַד
  choice: melalui
  rationale: Secara harfiah “melalui tangan”; ungkapan Ibrani ini menyatakan perantaraan atau orang yang membawa kiriman. “Melalui” mengungkapkan fungsi idiom tersebut secara wajar.
- source_word: דָּוִד בְּנוֹ
  choice: Daud, anaknya
  rationale: Mempertahankan urutan nama lalu keterangan hubungan sebagaimana dalam bahasa Ibrani, dengan tanda baca yang alami dalam bahasa Indonesia.
- source_word: אֶל שָׁאוּל
  choice: kepada Saul
  rationale: Preposisi arah diterjemahkan secara langsung dan alami sebagai “kepada” karena Saul adalah penerima kiriman.
