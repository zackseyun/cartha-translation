translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dibaca. Istilah wadah kulit dipertahankan untuk menjaga latar budaya kuno, sedangkan idiom בְּיַד diterjemahkan menurut fungsinya dan bentuk harfiahnya dicatat.
