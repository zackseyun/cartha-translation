base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: id
  text: Lalu ia menyuruh orang menjemputnya dan membawanya masuk. Ia berkulit kemerah-merahan, bermata indah, dan berparas elok. Yahweh berfirman, “Bangkitlah, urapilah dia, sebab inilah orangnya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sebab inilah dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: Lalu ia menyuruh orang menjemputnya dan membawanya masuk
  rationale: Rangkaian wayyiqtol melanjutkan alur cerita. Ungkapan ini menyampaikan tindakan mengutus untuk menjemput dan membawa orang yang dipanggil ke dalam, dengan bahasa Indonesia yang alami.
- source_word: אַדְמוֹנִי
  choice: berkulit kemerah-merahan
  rationale: Kata ini menunjuk pada warna kemerah-merahan pada penampilan atau kulit. Terjemahan ini menghindari penafsiran yang terlalu khusus bahwa rambutnya merah.
- source_word: עִם יְפֵה עֵינַיִם
  choice: bermata indah
  rationale: Terjemahan ringkas dan alami bagi ungkapan Ibrani yang secara langsung menggambarkan keindahan mata.
- source_word: וְטוֹב רֹאִי
  choice: dan berparas elok
  rationale: Ungkapan ini menyatakan penampilan yang sedap dipandang. 'Berparas elok' mempertahankan sifat fisik deskripsi tanpa menambahkan makna moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: קוּם מְשָׁחֵהוּ
  choice: Bangkitlah, urapilah dia
  rationale: Dua bentuk imperatif diterjemahkan secara langsung, ringkas, dan bermartabat.
- source_word: כִּי זֶה הוּא
  choice: sebab inilah orangnya
  rationale: Ungkapan ini merupakan identifikasi singkat dan tegas. Bentuk yang dipilih alami dalam bahasa Indonesia, sedangkan bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Gambaran fisik Daud
  choice: Mempertahankan seluruh gambaran sebagai ciri fisik
  alternative: Menafsirkan warna kemerah-merahan sebagai warna rambut atau memberi makna moral pada penampilannya
  rationale: Ayat ini menggambarkan penampilan luar tanpa secara eksplisit menentukan warna rambut atau mengaitkannya dengan kualitas rohani dan moral.
- issue: Identifikasi dalam כִּי זֶה הוּא
  choice: sebab inilah orangnya
  alternative: sebab inilah dia
  rationale: Pilihan utama menyampaikan identifikasi ilahi dengan bahasa Indonesia alami, sementara catatan kaki mempertahankan bentuk yang lebih dekat dengan susunan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar tanpa menghilangkan urutan tindakan. Deskripsi fisik tetap konkret dan tidak ditafsirkan secara simbolis.
