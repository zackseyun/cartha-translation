base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: id
  text: Roh TUHAN telah meninggalkan Saul, dan roh jahat[a] dari TUHAN menggentarkan Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh yang mencelakakan” atau “roh yang mendatangkan kesusahan.” Kata sifat Ibrani yang digunakan dapat berarti jahat, mencelakakan, atau membawa malapetaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Roh TUHAN
  rationale: רוּחַ dalam konteks ini menunjuk pada Roh ilahi yang sebelumnya berkuasa atas Saul. Huruf kapital membedakannya dari roh yang disebut kemudian, sedangkan nama perjanjian יְהוָה diterjemahkan menurut bentuk baku Indonesia, “TUHAN”.
- source_word: סָרָה מֵעִם
  choice: telah meninggalkan
  rationale: סוּר dengan מֵעִם menyatakan bahwa Roh itu tidak lagi menyertai Saul. “Telah meninggalkan” alami dalam bahasa Indonesia dan menyampaikan penarikan kehadiran tersebut tanpa menambahkan sebab atau cara.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
- source_word: וּבִעֲתַתּוּ
  choice: membuatnya ketakutan
  rationale: בעת menyatakan tindakan menimbulkan rasa takut atau gentar yang kuat. Ungkapan ini jelas bagi pembaca modern dan tidak memperluas maknanya menjadi siksaan fisik.
- source_word: רוּחַ רָעָה
  choice: roh jahat
  rationale: רָעָה dapat berarti jahat, buruk, mencelakakan, atau mendatangkan kesusahan. “Roh jahat” merupakan padanan langsung dan ringkas; keluasan maknanya dijaga dalam catatan kaki.
- source_word: מֵאֵת יְהוָה
  choice: dari TUHAN
  rationale: מֵאֵת menyatakan sumber atau asal. “Dari TUHAN” mempertahankan rumusan Ibrani tanpa menambahkan gagasan “diutus” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Asal roh yang menakutkan Saul dan sifatnya
  choice: roh jahat dari TUHAN
  alternative: roh yang mencelakakan atau mendatangkan kesusahan dari TUHAN
  rationale: Teks Ibrani secara eksplisit menyebut roh itu berasal “dari TUHAN.” Terjemahan mempertahankan ketegangan teologis tersebut dan tidak melunakkannya dengan menghilangkan sumber ilahinya atau menambahkan penjelasan tentang bagaimana hal itu terjadi. Kemungkinan nuansa רָעָה selain kejahatan moral dicatat sebagai alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Roh” ditulis dengan huruf kapital ketika merujuk pada Roh TUHAN, sedangkan “roh jahat” memakai huruf kecil. Struktur koordinatif ayat dipertahankan, dan tidak ditambahkan penanda waktu seperti “Pada waktu itu” karena tidak ada kata waktu yang eksplisit dalam teks sumber.
