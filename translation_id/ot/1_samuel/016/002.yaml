  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: id
  text: Samuel berkata, “Bagaimana mungkin aku pergi? Jika Saul mendengar, ia akan membunuhku.” Yahweh berfirman, “Bawalah seekor sapi betina muda[a] dan katakanlah, ‘Aku datang untuk mempersembahkan kurban kepada Yahweh.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “seekor lembu betina muda.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: Bagaimana mungkin aku pergi?
  rationale: Ungkapan tanya ini menyatakan persoalan kemungkinan praktis. Bentuk Indonesia ini alami dan mempertahankan keberatan Samuel tanpa mengubahnya menjadi pertanyaan tentang rute.
- source_word: וְשָׁמַע שָׁאוּל
  choice: Jika Saul mendengarnya
  rationale: Walaupun secara bentuk memakai waw dan verba perfektif, dalam konteks klausa ini menyatakan syarat yang tersirat; “jika” membuat hubungan itu jelas dalam bahasa Indonesia.
- source_word: וַהֲרָגַנִי
  choice: ia akan membunuhku
  rationale: Menyatakan akibat yang Samuel perkirakan akan terjadi apabila Saul mendengar kabar tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עֶגְלַת בָּקָר
  choice: seekor sapi betina muda
  rationale: Frasa ini menunjuk pada lembu muda berjenis kelamin betina. Pilihan ini lebih mudah dipahami pembaca Indonesia masa kini daripada istilah khusus “dara sapi” atau “lembu betina muda”.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: Bawalah ...
  rationale: Secara harfiah berarti mengambil di tangan, tetapi merupakan idiom untuk membawa serta; “bawalah” menyampaikan maksudnya secara wajar.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: untuk mempersembahkan kurban kepada Yahweh
  rationale: Menyampaikan tindakan penyembelihan sebagai kurban dalam konteks ibadah tanpa memberi rincian ritual yang tidak dinyatakan.
- source_word: בָּאתִי
  choice: Aku datang
  rationale: Perfek orang pertama dalam ucapan langsung ini menyatakan kedatangan beserta tujuannya. “Aku datang” alami dalam bahasa Indonesia dan tidak memaksakan pembedaan aspek yang tidak wajib.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Kejujuran pernyataan tentang tujuan kedatangan Samuel
  choice: Menerjemahkan perintah secara langsung tanpa menilai atau menjelaskan secara teologis
  alternative: Menambahkan bahwa kurban itu hanya dalih atau bahwa pernyataan itu merupakan seluruh tujuan Samuel
  rationale: Ayat ini benar-benar menyebut kurban sebagai tujuan yang harus Samuel nyatakan, tetapi tidak menguraikan hubungan antara tujuan itu dan pengurapan Daud. Terjemahan mempertahankan ketegangan naratif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” dipakai bagi ucapan Yahweh, sedangkan “berkata” bagi Samuel. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya; pada lapisan konsultasi Inggris penandanya tampak salah tempat setelah “Samuel said”.
