translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan nama “Saul” dan “Daud” dipakai untuk memperjelas pelaku karena rangkaian pronomina Ibrani dapat terasa kabur jika dialihkan secara harfiah. Ungkapan “berdiri di hadapannya” sengaja dipertahankan agar citra bahasa sumber dan nuansa pelayanan istana tetap hadir.
