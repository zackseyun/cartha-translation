  text: So David came to Saul and stood before him[a], and Saul loved him greatly, and he became his armor-bearer.
translation:
  language: id
  text: Lalu Daud datang kepada Saul dan berdiri di hadapannya. Saul sangat mengasihi Daud, dan Daud menjadi pembawa senjata Saul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembawa perlengkapan perang Saul.” Ungkapan Ibrani secara harfiah menunjuk pada orang yang membawa perlengkapan militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִד אֶל שָׁאוּל
  choice: Daud datang kepada Saul
  rationale: Kata בוא dengan אֶל menunjukkan gerak menuju seseorang; “datang kepada Saul” alami dalam bahasa Indonesia dan tidak memperinci lebih dari teks sumber.
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: berdiri di hadapannya
  rationale: Terjemahan ini mempertahankan gambaran harfiah idiom Ibrani, yang dalam konteks istana juga menyiratkan kehadiran untuk melayani seorang atasan.
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: Saul sangat mengasihi Daud
  rationale: Subjek dan objek diperjelas dari konteks untuk menghindari ketaksaan pronomina dalam bahasa Indonesia, sedangkan “sangat mengasihi” mempertahankan kuatnya rasa suka dan perkenanan Saul.
- source_word: וַיְהִי לוֹ
  choice: Daud menjadi ...-nya
  rationale: Konstruksi ini menyatakan keadaan atau kedudukan baru; “menjadi” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: נֹשֵׂא כֵלִים
  choice: pembawa senjata
  rationale: Secara harfiah ungkapan ini menunjuk pada orang yang membawa perlengkapan militer. “Pembawa senjata” jelas bagi pembaca modern dan sesuai dengan jabatan pendamping seorang pejuang atau raja.
