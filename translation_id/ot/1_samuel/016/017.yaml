  text: וַ/יֹּ֥אמֶר שָׁא֖וּל אֶל עֲבָדָ֑י/ו רְאוּ נָ֣א לִ֗/י אִ֚ישׁ מֵיטִ֣יב לְ/נַגֵּ֔ן וַ/הֲבִיאוֹתֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/017.yaml
  text: Then Saul said to his servants[a], “Please find for me a man who can play well, and bring him to me.”
translation:
  language: id
  text: Lalu Saul berkata kepada para pegawainya, “Tolong carikan aku seorang laki-laki yang pandai bermain musik[a], lalu bawalah dia kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang berbuat dengan baik dalam bermain”; maksudnya, orang yang mahir bermain musik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau pejabat. Dalam lingkungan istana Saul, “para pegawainya” menyampaikan bahwa mereka adalah orang-orang yang melayani raja tanpa memberi kesan bahwa mereka semestinya budak.
- source_word: רְאוּ נָא
  choice: Tolong carikan
  rationale: Imperatif ראה dengan partikel sopan נָא di sini secara idiomatis meminta mereka mencari atau menemukan seseorang; “tolong carikan” alami dan mempertahankan nuansa permohonan.
- source_word: לִי
  choice: aku
  rationale: 'Dengan “carikan,” pronomina ini menyatakan pihak yang berkepentingan atau menerima manfaat: carikan bagi Saul.'
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina Ibrani ini berbentuk tunggal maskulin dan dalam konteks ini menunjuk kepada seorang laki-laki; terjemahan mempertahankan informasi tersebut.
- source_word: מֵיטִיב לְנַגֵּן
  choice: yang pandai bermain musik
  rationale: Ungkapan ini secara harfiah menggambarkan orang yang ‘berbuat dengan baik dalam bermain’ dan secara idiomatis berarti mahir memainkan musik. “Bermain musik” tidak menambahkan jenis alat musik yang tidak disebut dalam ayat ini.
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: lalu bawalah dia kepadaku
  rationale: Bentuknya merupakan perintah jamak kepada para pegawai Saul. Bahasa Indonesia tidak menandai kejamakan pada verba; “dia” merujuk kepada laki-laki tunggal yang dicari.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Aku” dan “kepadaku” sesuai dengan tuturan langsung seorang raja kepada bawahannya; “tolong” mempertahankan partikel permohonan נָא. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
