base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: id
  text: Kemudian Samuel mengambil tanduk berisi minyak dan mengurapi Daud di tengah saudara-saudaranya. Roh Yahweh[b] datang dengan penuh kuasa atas Daud[a] sejak hari itu dan seterusnya. Lalu Samuel bangkit dan pergi ke Rama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “menyerbu Daud” atau “datang dengan dahsyat atas Daud.” Verba Ibraninya dapat menggambarkan datangnya Roh secara kuat dan memberi kuasa.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga ditulis, “roh Yahweh.” Naskah Ibrani tidak memakai huruf kapital untuk menandai perbedaan ini.
    reason: alternative_reading
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: tanduk berisi minyak
  rationale: קֶרֶן secara konkret berarti tanduk, kemungkinan tanduk binatang yang dipakai sebagai wadah. Ungkapan “berisi minyak” menyampaikan hubungan konstruksi Ibrani dengan alami tanpa menghilangkan gambaran bendanya.
- source_word: וַיִּמְשַׁח
  choice: mengurapi
  rationale: משׁח adalah verba baku untuk pengurapan ritual. Pilihan ini mempertahankan tindakan fisik sekaligus makna kerajaan dan teologisnya.
- source_word: בְּקֶרֶב אֶחָיו
  choice: di tengah saudara-saudaranya
  rationale: בְּקֶרֶב secara harfiah menyatakan keberadaan di tengah suatu kelompok. Konteks menunjukkan saudara-saudara laki-laki Daud, sedangkan bentuk Indonesia ini tetap alami dan tepat.
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: Roh Yahweh datang dengan penuh kuasa atas Daud
  rationale: Dalam kisah Samuel, צלח bersama רוּחַ יְהוָה menggambarkan datangnya Roh secara kuat dan memperlengkapi. “Datang dengan penuh kuasa” mempertahankan kekuatan verba tanpa menghasilkan ungkapan Indonesia yang janggal atau bernada negatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar “TUHAN”.
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: sejak hari itu dan seterusnya
  rationale: Ungkapan ini menandai awal keadaan yang terus berlangsung; pilihan tersebut jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַיָּקָם ... וַיֵּלֶךְ
  choice: berangkat dan pergi
  rationale: Dalam rangkaian naratif, קום dapat menandai bangkit untuk mulai melakukan perjalanan. “Berangkat dan pergi” menyampaikan gerakan berurutan secara alami.
- source_word: הָרָמָתָה
  choice: ke Rama
  rationale: Akhiran direktif ה menunjukkan gerak menuju tempat tersebut; nama tempatnya ditransliterasikan menurut bentuk Indonesia yang lazim, “Rama”.
theological_decisions:
- issue: Pemaknaan רוּחַ יְהוָה
  choice: Roh Yahweh
  alternative: roh Yahweh
  rationale: Konteks paling mungkin menunjuk pada kehadiran ilahi yang memberi kuasa kepada Daud, sehingga “Roh” diawali huruf kapital. Karena naskah Ibrani tidak membedakan kapitalisasi, kemungkinan pembacaan umum “roh” tetap dicatat.
- issue: Sifat pengurapan Daud di hadapan saudara-saudaranya
  choice: di tengah saudara-saudaranya
  alternative: di hadapan saudara-saudaranya
  rationale: Teks menyatakan lokasi relasional pengurapan itu tanpa menjelaskan seluruh cakupan publik atau politiknya. Terjemahan tidak menambahkan kesimpulan di luar yang dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama ilahi “Yahweh” dipertahankan. Struktur naratif dibuat mengalir tanpa menghapus daya ungkap verba Ibrani atau menutup ambiguitas pada kata רוּחַ.
