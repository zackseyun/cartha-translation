  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה בִּֽ/הְי֤וֹת רֽוּחַ אֱלֹהִים֙ אֶל שָׁא֔וּל וְ/לָקַ֥ח דָּוִ֛ד אֶת הַ/כִּנּ֖וֹר וְ/נִגֵּ֣ן בְּ/יָד֑/וֹ וְ/רָוַ֤ח לְ/שָׁאוּל֙ וְ/ט֣וֹב ל֔/וֹ וְ/סָ֥רָה מֵ/עָלָ֖י/ו ר֥וּחַ הָ/רָעָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: id
  text: Setiap kali roh Allah datang kepada Saul, Daud mengambil kecapi[a] dan memetiknya dengan tangannya. Lalu Saul merasa lega dan keadaannya membaik, dan roh yang mencelakakan[b] itu pun pergi darinya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lira.” Kata Ibrani kinnor menunjuk pada alat musik berdawai kuno yang dipetik, kemungkinan lebih menyerupai lira daripada harpa modern.
    reason: lexical_alternative
  - marker: b
    text: Atau, “roh jahat.” Kata Ibrani yang dipakai dapat berarti “jahat” atau “mencelakakan”; dalam konteks ini, ungkapan tersebut dapat menekankan dampaknya yang menyusahkan Saul.
    reason: lexical_alternative
  - marker: c
    text: Pada awal ayat teks Ibrani berbunyi “roh Allah”, sedangkan pada akhir ayat berbunyi “roh yang mencelakakan”. Terjemahan ini mempertahankan perbedaan ungkapan dalam teks Ibrani dan tidak menyelaraskan keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: Setiap kali ... datang
  rationale: Konstruksi היה dengan infinitif menunjukkan keadaan yang berulang; “setiap kali” menyampaikan makna iteratif secara alami.
- source_word: רוּחַ אֱלֹהִים
  choice: roh Allah
  rationale: Frasa Ibrani di awal ayat hanya berbunyi “roh Allah”; unsur “jahat/mencelakakan” baru muncul pada akhir ayat.
- source_word: אֶל שָׁאוּל
  choice: datang kepada Saul
  rationale: Preposisi אֶל dipertahankan secara langsung dan alami tanpa mempertegas hubungan yang tidak dinyatakan teks.
- source_word: הַכִּנּוֹר
  choice: kecapi
  rationale: כִּנּוֹר ialah alat musik petik kuno. “Kecapi” merupakan padanan Indonesia yang mudah dipahami, dengan catatan bahwa bentuk tepat alat kunonya tidak sama dengan kecapi modern.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: memetiknya dengan tangannya
  rationale: נגן dalam konteks alat musik berdawai berarti memainkan; “memetiknya” menjelaskan tindakan secara alami sambil mempertahankan ungkapan “dengan tangannya”.
- source_word: וְרָוַח לְשָׁאוּל
  choice: Saul merasa lega
  rationale: Kata kerja רָוַח menyatakan kelegaan atau kelapangan setelah tekanan.
- source_word: וְטוֹב לוֹ
  choice: keadaannya membaik
  rationale: Ungkapan itu menunjukkan bahwa keadaan Saul menjadi baik; pilihan ini alami dalam bahasa Indonesia tanpa membatasi maknanya hanya pada perasaan.
- source_word: רוּחַ הָרָעָה
  choice: roh yang mencelakakan
  rationale: רָעָה dapat berarti jahat atau mendatangkan keburukan. Dalam konteks ini, “mencelakakan” menonjolkan dampaknya tanpa menetapkan secara berlebihan watak moral roh tersebut.
- source_word: וְסָרָה מֵעָלָיו
  choice: pergi darinya
  rationale: סור menyatakan penyingkiran atau kepergian; pilihan ini jelas dan alami dalam narasi Indonesia.
theological_decisions:
- issue: Hubungan antara רוּחַ אֱלֹהִים pada awal ayat dan רוּחַ הָרָעָה pada akhir ayat
  choice: Menerjemahkan frasa pertama sebagai “roh Allah” dan frasa terakhir sebagai “roh yang mencelakakan”, tanpa menyamakannya dalam teks utama.
  alternative: Menerjemahkan frasa pertama sebagai “roh jahat dari Allah” atau frasa terakhir sebagai “roh jahat”.
  rationale: Teks Ibrani memakai dua ungkapan berbeda. Mempertahankan perbedaan itu menjaga ketegangan dan ambiguitas yang sungguh ada serta tidak memasukkan harmonisasi dari konteks terdekat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat lancar bagi pembaca umum, sementara pengulangan peristiwa, ungkapan “dengan tangannya”, dan perbedaan antara dua sebutan bagi roh tetap dipertahankan.
