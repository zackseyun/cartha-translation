  - severity: low
    issue: “Namun” memberi penanda kontras tambahan.
    rationale: Kata penghubung waw hanya melanjutkan narasi dan ujaran Samuel. Kontras dapat dipahami dari isi ujaran tanpa perlu ditandai secara eksplisit.
