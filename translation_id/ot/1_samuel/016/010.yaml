base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: id
  text: Lalu Isai menyuruh tujuh orang anaknya lewat di hadapan Samuel. Samuel berkata kepada Isai, “Yahweh tidak memilih seorang pun dari mereka ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: menyuruh ... lewat
  rationale: 'Bentuk Hifil menyatakan tindakan kausatif: Isai membuat atau menyuruh anak-anaknya lewat di hadapan Samuel. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan makna kausatif.'
- source_word: שִׁבְעַת בָּנָיו
  choice: ketujuh anaknya
  rationale: Dalam konteks narasi, frasa ini menunjuk pada tujuh anak Isai yang dihadirkan. Bentuk 'ketujuh anaknya' paling alami dalam bahasa Indonesia; konteks ayat berikutnya memperjelas bahwa masih ada anak lain yang tidak hadir.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Padanan ini mempertahankan nuansa spasial sekaligus suasana resmi ketika anak-anak Isai diperhadapkan kepada Samuel.
- source_word: לֹא בָחַר
  choice: tidak memilih
  rationale: Kata בחר berarti memilih. Bentuk lampau Ibrani dalam rangkaian percakapan ini secara alami disampaikan sebagai kesimpulan langsung dengan bentuk 'tidak memilih' dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בָּאֵלֶּה
  choice: seorang pun dari mereka ini
  rationale: Secara harfiah berarti 'di antara/dalam mereka ini'. Dalam konteks penyangkalan, ungkapan Indonesia ini secara alami menyatakan bahwa tidak satu pun dari tujuh orang tersebut dipilih.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan penyangkalan dalam לֹא בָחַר יְהוָה בָּאֵלֶּה
  choice: Yahweh tidak memilih seorang pun dari mereka ini
  alternative: Yahweh tidak memilih mereka ini
  rationale: Preposisi ב dengan kata tunjuk dalam konteks ini menyatakan pemilihan dari antara kelompok tersebut. Terjemahan yang dipilih memperjelas bahwa masing-masing calon ditolak tanpa menentukan siapa yang akhirnya dipilih.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menjaga kesinambungan narasi, sedangkan 'Namun' menandai kontras antara penyajian ketujuh anak dan keputusan Samuel. Tidak diperlukan catatan kaki karena perbedaan ungkapan dapat ditangani secara wajar di dalam teks.
