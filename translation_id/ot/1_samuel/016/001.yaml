source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: id
  text: Yahweh berfirman kepada Samuel, “Berapa lama lagi engkau akan berdukacita karena Saul, padahal Aku telah menolaknya untuk memerintah atas Israel? Isilah tandukmu dengan minyak, lalu pergilah. Aku mengutusmu kepada Isai, orang Betlehem itu, sebab Aku telah melihat seorang raja bagi-Ku di antara anak-anaknya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku telah menyediakan bagi diri-Ku seorang raja.” Kata kerja Ibrani secara harfiah berarti “melihat”, tetapi dalam konteks ini dapat menyiratkan pemilihan atau penyediaan.
    reason: Alternatif leksikal untuk idiom רָאִיתִי לִי.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: מִתְאַבֵּל אֶל שָׁאוּל
  choice: berdukacita karena Saul
  rationale: Mengungkapkan dukacita Samuel secara alami dalam bahasa Indonesia tanpa membatasi maknanya pada perkabungan karena kematian.
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל יִשְׂרָאֵל
  choice: Aku telah menolaknya sebagai raja atas Israel
  rationale: Menjaga cakupan penolakan pada jabatan Saul sebagai raja dan tidak memperluasnya menjadi pernyataan tentang seluruh keadaan rohaninya.
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: Isilah tandukmu dengan minyak
  rationale: Mempertahankan gambaran konkret tanduk yang dipakai sebagai wadah minyak pengurapan.
- source_word: אֶשְׁלָחֲךָ
  choice: Aku mengutusmu
  rationale: Bentuk kini dalam ujaran langsung menyampaikan penugasan ilahi yang sedang diberikan secara wajar dan tegas.
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: Isai, orang Betlehem itu
  rationale: Menyampaikan bentuk gentilik Ibrani secara alami sebagai keterangan asal atau identitas.
- source_word: רָאִיתִי
  choice: Aku telah melihat
  rationale: Mempertahankan arti dasar verba 'melihat' serta kemungkinan nuansa mengenali atau memilih dalam konteks, tanpa menutup ambiguitasnya di teks utama.
- source_word: בְּבָנָיו
  choice: di antara anak-anaknya
  rationale: Preposisi dipahami sebagai menunjuk salah seorang dari kelompok anak-anak Isai.
- source_word: לִי
  choice: bagi-Ku
  rationale: Mempertahankan kepentingan dan peruntukan ilahi yang dinyatakan oleh datif Ibrani.
- source_word: מֶלֶךְ
  choice: seorang raja
  rationale: Mencerminkan bentuk tak tentu dan belum menyebut identitas putra yang dimaksud.
theological_decisions:
- issue: Cakupan penolakan ilahi terhadap Saul
  choice: Aku telah menolaknya sebagai raja atas Israel
  alternative: Aku telah menolaknya sehingga ia tidak lagi memerintah atas Israel
  rationale: Pilihan ini membatasi pernyataan pada kedudukan kerajaan yang disebut teks, tanpa menyimpulkan keadaan akhir Saul di hadapan Allah.
- issue: Makna idiom רָאִיתִי לִי
  choice: Aku telah melihat seorang raja bagi-Ku
  alternative: Aku telah menyediakan bagi diri-Ku seorang raja
  rationale: Teks utama mempertahankan citra leksikal 'melihat', sementara catatan memberi makna kontekstual berupa pemilihan atau penyediaan; dengan demikian ambiguitas dan nuansa teologis tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan ejaan religius Indonesia. Kalimat panjang Ibrani dipecah secukupnya agar ujaran langsung terdengar alami tanpa mengubah hubungan logisnya.
