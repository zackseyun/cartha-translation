translation:
  language: id
  text: Lalu Saul mengirim utusan kepada Isai dan berkata, “Kirimlah kepadaku anakmu Daud, yang bersama kawanan domba.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Bentuk wayyiqtol dari שׁלח menyatakan tindakan lampau dalam alur narasi; 'mengirim' merupakan padanan Indonesia yang alami.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks manusia, מַלְאָכִים berarti orang-orang yang membawa pesan; 'utusan' jelas dan tidak memberi kesan makhluk surgawi.
- source_word: אֶל יִשָׁי
  choice: kepada Isai
  rationale: Preposisi אֶל menyatakan arah atau penerima pengutusan.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: אמר memperkenalkan ucapan langsung; 'berkata' mempertahankan struktur itu.
- source_word: שִׁלְחָה אֵלַי
  choice: Suruhlah ... datang kepadaku
  rationale: Ungkapan ini secara harfiah berarti 'kirimlah kepadaku'; susunan terpilih lebih alami dalam bahasa Indonesia ketika objeknya seorang anak yang diminta datang, tanpa menambahkan cara perjalanan.
- source_word: אֶת דָּוִד בִּנְךָ
  choice: anakmu Daud
  rationale: בִּנְךָ menerangkan hubungan Daud dengan Isai; urutan 'anakmu Daud' alami dan mempertahankan aposisi Ibrani.
- source_word: אֲשֶׁר בַּצֹּאן
  choice: yang sedang bersama kawanan domba
  rationale: בַּצֹּאן dapat menunjuk keberadaan bersama atau di tengah kawanan; 'bersama kawanan domba' mempertahankan nuansa tempat tanpa secara eksplisit menambahkan bahwa Daud sedang menggembalakannya.
