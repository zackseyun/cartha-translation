translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Partikel 'Lalu' mengalirkan rangkaian wayyiqtol tanpa membuat hubungan sebab-akibat yang lebih kuat daripada teks. Terjemahan tidak menambahkan bahwa Daud sedang menggembalakan domba, sebab hal itu hanya tersirat oleh konteks.
