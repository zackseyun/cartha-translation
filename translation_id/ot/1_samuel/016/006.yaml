base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: id
  text: Ketika mereka datang, Samuel melihat Eliab dan berkata, “Pastilah di hadapan Yahweh ada orang yang diurapi-Nya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mesias-Nya.” Kata Ibrani yang diterjemahkan “orang yang diurapi-Nya” adalah kata yang sama yang kemudian dipakai untuk “Mesias”; di sini kata itu menunjuk kepada orang yang Samuel kira telah dipilih dan diurapi Yahweh sebagai raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: Ketika mereka masuk
  rationale: Gabungan formula naratif וַיְהִי dengan בְּ plus infinitif בוא membentuk latar waktu. Ungkapan ini menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia tanpa formula arkais seperti ‘terjadilah’.
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: Samuel melihat Eliab
  rationale: ראה diterjemahkan langsung sebagai ‘melihat’. Nama ‘Samuel’ dipakai untuk memperjelas subjek yang tersirat dalam bentuk verba Ibrani dan sudah jelas dari konteks.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: אמר pada dasarnya berarti ‘berkata’. Teks Ibrani tidak secara eksplisit menyatakan bahwa ucapan itu hanya di dalam hati, sehingga terjemahan tidak menambahkan ‘dalam hatinya’.
- source_word: אַךְ
  choice: Pastilah
  rationale: Dalam konteks ini אַךְ mengungkapkan keyakinan kuat Samuel ketika melihat Eliab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: מְשִׁיחוֹ
  choice: orang yang diurapi Yahweh
  rationale: Kata מָשִׁיחַ berarti orang yang diurapi, sedangkan akhiran orang ketiga tunggal menyatakan bahwa ia milik atau ditetapkan oleh Yahweh. Ungkapan ini mempertahankan arti langsung dalam konteks pemilihan raja tanpa memasukkan makna mesianik yang lebih kemudian ke dalam teks utama.
- source_word: נֶגֶד יְהוָה
  choice: ada di hadapan Yahweh
  rationale: נֶגֶד berarti ‘di hadapan’ atau ‘di depan’. Kopula ‘ada’ ditambahkan secara wajar dalam bahasa Indonesia untuk menyampaikan klausa nominal Ibrani, sementara penyebutan Yahweh dipertahankan secara eksplisit.
theological_decisions:
- issue: Makna מְשִׁיחוֹ dalam konteks pemilihan raja
  choice: orang yang diurapi Yahweh
  alternative: Mesias Yahweh
  rationale: Dalam adegan ini Samuel mengira Eliab adalah orang yang ditetapkan Yahweh sebagai raja. Terjemahan utama mempertahankan makna historis langsung, sedangkan catatan kaki menjaga hubungan leksikal dengan istilah ‘Mesias’ tanpa memaksakan pengertian kristologis yang lebih kemudian.
- issue: Acuan dalam frasa נֶגֶד יְהוָה
  choice: di hadapan Yahweh
  alternative: di hadapan-Nya
  rationale: Teks Ibrani menyebut nama Yahweh secara eksplisit. Mengulang nama itu mempertahankan bentuk dan acuan sumber serta menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum, sementara pengulangan nama Yahweh dan ketegangan antara anggapan Samuel dengan keputusan Yahweh tetap dipertahankan.
