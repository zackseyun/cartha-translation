  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: id
  text: Undanglah Isai ke upacara kurban itu[a]. Aku akan memberitahukan kepadamu apa yang harus kaulakukan[b]. Urapilah bagi-Ku orang yang akan Kusebutkan kepadamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Panggillah Isai untuk menghadiri upacara kurban itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Aku akan menunjukkan kepadamu apa yang harus kaulakukan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “yang akan Kukatakan kepadamu”; objeknya tersirat dan menunjuk kepada orang yang harus diurapi.'
    reason: literal_rendering
lexical_decisions:
- source_word: וְקָרָאתָ
  choice: Undanglah
  rationale: Dalam konteks mengikutsertakan Isai dalam upacara kurban, קרא berarti memanggil atau mengundang. “Undanglah” paling alami dalam bahasa Indonesia dan tetap menyampaikan daya perintah.
- source_word: לְיִשַׁי
  choice: Isai
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּזָּבַח
  choice: ke upacara kurban itu
  rationale: זבח dapat menunjuk pada kurban maupun peristiwa pelaksanaannya. Dengan verba “mengundang”, yang dimaksud secara alami ialah menghadiri upacara kurban; unsur definit dalam bahasa Ibrani tercermin dalam “itu”.
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: Aku akan memberitahukan kepadamu
  rationale: Bentuk kausatif ידע berarti membuat seseorang tahu atau memberitahukan. Pronomina mandiri אָנֹכִי dipertahankan melalui penyebutan eksplisit “Aku”.
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: apa yang harus kaulakukan
  rationale: Ungkapan ini menyatakan tindakan yang akan diperintahkan kepada Samuel. “Harus” menyampaikan nuansa pengarahan ilahi secara wajar tanpa menambah rincian.
- source_word: וּמָשַׁחְתָּ
  choice: Engkau harus mengurapi
  rationale: Verba משׁח adalah istilah baku untuk pengurapan sebagai tindakan penetapan atau pengudusan. Konstruksi ini memiliki daya instruksional, yang dinyatakan dengan “harus”.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ל di sini menunjukkan bahwa pengurapan dilakukan untuk Allah atau demi tujuan-Nya. “Bagi-Ku” mempertahankan hubungan tersebut.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: orang yang akan Kusebutkan kepadamu
  rationale: Bahasa Ibrani secara harfiah merujuk kepada orang yang akan Allah katakan kepada Samuel. “Kusebutkan” secara alami menyampaikan bahwa Allah akan menentukan orangnya tanpa menambahkan jabatan tertentu.
theological_decisions:
- issue: Sifat dan tujuan pengurapan
  choice: Mempertahankan kata “mengurapi” tanpa secara eksplisit menyebut pengangkatan sebagai raja.
  alternative: Menerjemahkan secara lebih tafsiriah sebagai “mengurapi menjadi raja”.
  rationale: Konteks naratif menunjukkan pengurapan kerajaan, tetapi ayat ini sendiri tidak menyebut jabatan itu. Terjemahan membiarkan konteks menyampaikan implikasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan ilahi memakai huruf kapital sesuai konvensi umum Alkitab bahasa Indonesia. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar jelas bagi pembaca umum tanpa mengubah urutan perintah dan janji.
