base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: id
  text: Lalu Samuel berkata kepada Isai, “Apakah ini semua anak laki-lakimu?” Isai menjawab, “Masih ada yang bungsu, dan ia sedang menggembalakan kawanan domba[a].” Samuel berkata kepada Isai, “Suruhlah orang menjemputnya, sebab kita tidak akan duduk[b] sampai ia datang ke sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menggembalakan kawanan ternak kecil.” Kata Ibrani ini dapat mencakup domba dan kambing.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mengambil tempat.” Kemungkinan maksudnya ialah mereka tidak akan memulai perjamuan atau pertemuan resmi sebelum ia tiba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: Apakah semua anak laki-lakimu sudah di sini?
  rationale: Bentuk dari תמם menanyakan apakah seluruh kelompok sudah lengkap. Dalam konteks Isai memperhadapkan putra-putranya, ungkapan ini menyampaikan maksud pertanyaan secara alami tanpa menerjemahkan secara kaku sebagai ‘sudah lengkapkah orang-orang muda itu?’
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: Masih ada yang bungsu
  rationale: עוֹד שָׁאַר menyatakan bahwa satu orang masih tersisa dan belum dihadirkan, sedangkan הַקָּטָן dalam konteks keluarga paling wajar berarti anak yang paling muda.
- source_word: וְהִנֵּה
  choice: Saat ini
  rationale: Partikel ini mengarahkan perhatian pada keadaan anak bungsu pada saat itu. Bahasa Indonesia tidak selalu memerlukan padanan tersendiri seperti ‘lihatlah’; ‘saat ini’ secara alami menonjolkan informasi yang menyusul tanpa memberi kesan bahwa Isai sedang menunjuk Daud secara langsung.
- source_word: רֹעֶה בַּצֹּאן
  choice: sedang menggembalakan kawanan domba
  rationale: Partisip רֹעֶה menyatakan kegiatan yang sedang berlangsung. ‘Menggembalakan’ mempertahankan citra gembala yang penting dalam kitab Samuel, dan צֹאן adalah sebutan kolektif bagi ternak kecil, yang dalam konteks ini wajar diterjemahkan ‘kawanan domba’.
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: Suruhlah orang menjemput dia
  rationale: Gabungan perintah ‘utuslah’ dan ‘ambillah/bawalah dia’ secara idiomatis berarti menyuruh seseorang pergi membawa anak itu kemari. Terjemahan ini menghindari kesan bahwa Isai sendiri harus pergi.
- source_word: לֹא נָסֹב
  choice: kita tidak akan duduk
  rationale: Ungkapan dengan סבב di sini kemungkinan berarti mengambil tempat atau duduk untuk memulai perjamuan/pertemuan. Makna dasarnya tidak diperluas secara pasti dalam teks utama; kemungkinan konteksnya dijelaskan dalam catatan kaki.
- source_word: עַד בֹּאוֹ פֹה
  choice: sebelum ia datang ke sini
  rationale: Klausa waktu ini secara alami menyatakan bahwa mereka tidak akan duduk sampai anak bungsu tiba di tempat tersebut.
