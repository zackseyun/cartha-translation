  - severity: low
    issue: “sebelum ia datang ke sini” kurang langsung untuk עַד בֹּאוֹ פֹה.
    rationale: Dalam kalimat negatif, “sampai ia datang ke sini” dengan tepat mempertahankan batas waktu “until” tanpa mengubahnya menjadi konstruksi “before.”
  - severity: low
