  to: Lalu Samuel berkata kepada Isai, “Apakah ini semua anak laki-lakimu?” Isai menjawab, “Masih ada yang bungsu, dan ia sedang menggembalakan kawanan domba[a].” Samuel berkata kepada Isai, “Suruhlah orang menjemputnya, sebab kita tidak akan duduk[b] sampai ia datang ke sini.”
