    issue: Teks utama menyatakan «tetap melayani», sedangkan sumber memakai «berdiri di hadapanku».
    rationale: Makna pelayanan istana memang mungkin, tetapi «tetap» dan «melayani» bersama-sama membuat penafsiran kontekstual menjadi lebih eksplisit daripada sumber. Citra sumber sebaiknya dipertahankan dalam teks utama, dengan implikasi pelayanan/keberlanjutan dijelaskan dalam catatan kaki.
  - severity: low
    issue: «Ia telah mendapat perkenanan di mataku» terdengar kaku.
    rationale: Ungkapan Indonesia modern yang lebih lazim adalah «aku berkenan kepadanya», yang secara idiomatis menyampaikan bahwa Daud telah memperoleh perkenanan Saul.
