  text: Then Saul sent to Jesse[a], saying, “Please let David stand before me, for he has found favor in my eyes.”
translation:
  language: id
  text: Lalu Saul mengirim pesan kepada Isai, katanya, “Biarlah Daud berdiri di hadapanku,[a] karena aku berkenan kepadanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetap berada di hadapanku,” dengan maksud Daud terus melayani Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: Lalu Saul mengirim pesan kepada Isai, katanya
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. Karena bahasa Ibrani menyebut penerima tetapi tidak menyatakan objek yang dikirim, ‘mengirim pesan’ menyampaikan secara wajar bahwa Saul menyampaikan permintaan kepada Isai; ‘katanya’ memperkenalkan kutipan langsung.
- source_word: יַעֲמָד נָא דָוִד לְפָנַי
  choice: Biarlah Daud tetap melayani di hadapanku
  rationale: Bentuk jusif dengan נָא menyatakan permintaan sopan. Secara harfiah עמד berarti ‘berdiri’, tetapi dalam konteks istana ungkapan ‘berdiri di hadapan’ menunjuk pada pelayanan tetap kepada raja. Terjemahan ini mengungkapkan makna kontekstual sambil mempertahankan citra ‘di hadapanku’.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Saul meminta agar Daud tetap melayaninya.
- source_word: מָצָא חֵן בְּעֵינָי
  choice: ia telah mendapat perkenanan di mataku
  rationale: Ungkapan Ibrani ini berarti memperoleh penerimaan atau persetujuan seseorang. ‘Perkenanan’ sesuai dengan konteks istana, sedangkan ‘di mataku’ mempertahankan citra ungkapan sumber.
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: Daud / Saul / Isai
  rationale: Nama-nama pribadi memakai bentuk Indonesia yang mapan dalam tradisi penerjemahan Alkitab.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Biarlah’ menyampaikan permintaan sopan tanpa terdengar terlalu sehari-hari; ‘tetap melayani’ memperjelas konteks pelayanan istana.
