  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: id
  text: Lalu salah seorang dari para pelayan muda itu menjawab, “Nah, aku pernah melihat salah seorang putra Isai dari Betlehem,[a] yang pandai memainkan alat musik,[b] gagah perkasa,[c] seorang pejuang, bijaksana dalam berbicara,[d] dan elok rupanya. Yahweh menyertainya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang anak Isai, orang Betlehem.” Sebutan “orang Betlehem” menerangkan Isai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tahu bermain.” Alat musiknya tidak disebut dalam ayat ini.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani ini juga dapat berarti “seorang yang berani,” “pahlawan yang perkasa,” atau, secara lebih luas, “orang yang cakap.”
    reason: lexical_alternative
  - marker: d
    text: Atau “cerdas dalam berbagai perkara.” Kata Ibrani yang diterjemahkan “berbicara” juga dapat berarti “perkataan” atau “perkara.”
    reason: genuine_ambiguity
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים וַיֹּאמֶר
  choice: Lalu salah seorang dari para pelayan muda itu menjawab
  rationale: Dalam lingkungan istana Saul, נְעָרִים kemungkinan menunjuk kepada pelayan atau pengiring, tetapi unsur usia tetap dipertahankan dengan 'muda'. Pasangan verba 'menjawab dan berkata' dinaturalkan menjadi 'menjawab' karena fungsi ujarannya sudah jelas.
- source_word: הִנֵּה רָאִיתִי
  choice: Aku pernah melihat
  rationale: הִנֵּה menarik perhatian kepada laporan pembicara, tetapi dalam bahasa Indonesia daya itu dapat disampaikan secara alami oleh pernyataan langsung. Bentuk perfektif רָאִיתִי menyatakan pengamatan terdahulu yang menjadi dasar rekomendasi sekarang; 'pernah melihat' sesuai dengan konteks itu.
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: seorang anak Isai, orang Betlehem itu
  rationale: Ungkapan filial diterjemahkan dekat dengan bentuk Ibrani. Sebutan gentilik בֵּית הַלַּחְמִי secara gramatikal paling langsung menerangkan Isai dan dirender sebagai 'orang Betlehem itu', dengan catatan untuk memperjelas bentuk sumber.
- source_word: יֹדֵעַ נַגֵּן
  choice: pandai bermain musik
  rationale: Konstruksi ini menyatakan kecakapan memainkan alat musik. Instrumennya tidak disebut dalam ayat ini, sehingga terjemahan tidak menambahkan kecapi atau alat tertentu.
- source_word: גִּבּוֹר חַיִל
  choice: gagah perkasa
  rationale: Ungkapan tetap ini dapat menyatakan keberanian, kekuatan, atau kecakapan. 'Gagah perkasa' mempertahankan pujian yang luas tanpa menjadikannya identik dengan frasa berikutnya, 'seorang pejuang'.
- source_word: אִישׁ מִלְחָמָה
  choice: seorang pejuang
  rationale: Terjemahan ini menyampaikan arti militer ungkapan harfiah 'orang perang' dalam bahasa Indonesia yang alami.
- source_word: נְבוֹן דָּבָר
  choice: bijaksana dalam berbicara
  rationale: נְבוֹן menunjukkan pengertian atau kebijaksanaan, sedangkan דָּבָר dapat menunjuk pada perkataan maupun perkara. Pilihan ini mengikuti kemungkinan bahwa kecakapannya tampak dalam tutur katanya, sambil mencatat alternatif yang lebih luas.
- source_word: אִישׁ תֹּאַר
  choice: elok rupanya
  rationale: תֹּאַר menunjuk pada bentuk atau penampilan. 'Elok rupanya' alami, bermartabat, dan menyampaikan penilaian positif terhadap penampilannya.
- source_word: וַיהוָה עִמּוֹ
  choice: Yahweh menyertainya
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'. Klausa tanpa verba menyatakan kehadiran atau penyertaan ilahi yang berkelanjutan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi dan tidak menggantinya dengan gelar.
- issue: Makna penyertaan ilahi dalam וַיהוָה עִמּוֹ
  choice: Yahweh menyertainya
  alternative: Yahweh ada bersamanya
  rationale: '''Menyertai'' merupakan ungkapan Indonesia yang alami untuk kehadiran yang mendukung atau mengaruniakan keberhasilan, tanpa menguraikan lebih jauh sifat dukungan itu.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur daftar sifat dibuat mengalir secara alami tanpa menghilangkan urutan unsur Ibrani. Istilah-istilah arkais seperti 'sesungguhnya' dan konstruksi kaku 'menjawab dan berkata' dihindari.
