  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: id
  text: Namun Yahweh berfirman kepada Samuel, “Jangan memandang rupanya atau tinggi perawakannya, sebab Aku telah menolaknya. Cara Yahweh melihat tidak seperti cara manusia melihat:[a] manusia melihat apa yang tampak oleh mata, tetapi Yahweh melihat hati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Sebab bukan seperti yang dilihat manusia.” Ungkapan Ibrani ini eliptis; maksudnya ialah bahwa cara Yahweh melihat berbeda dari cara manusia melihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: תַּבֵּט
  choice: memandang
  rationale: Menyatakan tindakan memperhatikan atau menilai berdasarkan ciri lahiriah; alami dalam larangan ini.
- source_word: מַרְאֵהוּ
  choice: rupanya
  rationale: Mengacu pada penampilan yang terlihat dan membentuk pasangan alami dengan tinggi perawakan.
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: tinggi perawakannya
  rationale: Menyampaikan penekanan pada tinggi tubuh dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: מְאַסְתִּיהוּ
  choice: Aku telah menolaknya
  rationale: Dalam konteks pemilihan raja, verba ini berarti menolak sebagai orang yang dipilih, bukan membenci.
- source_word: הָאָדָם
  choice: manusia
  rationale: Nomina tunggal generik ini menunjuk manusia secara umum; 'manusia' inklusif dan alami dalam bahasa Indonesia modern.
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: Cara Yahweh melihat tidak seperti cara manusia melihat
  rationale: Teks Ibrani bersifat eliptis, harfiah kira-kira 'bukan seperti yang dilihat manusia'; penyebutan Yahweh dilengkapi dari kontras langsung agar jelas tanpa mengubah maksud.
- source_word: לַעֵינַיִם
  choice: apa yang tampak oleh mata
  rationale: Mempertahankan citra mata dalam ungkapan Ibrani dan menghindari penyempitan menjadi sekadar 'penampilan luar'.
- source_word: לַלֵּבָב
  choice: hati
  rationale: Mempertahankan istilah Ibrani bagi pusat batin, termasuk pikiran, kehendak, dan watak.
theological_decisions:
- issue: Kontras antara penglihatan manusia dan penglihatan ilahi
  choice: Cara Yahweh melihat tidak seperti cara manusia melihat
  alternative: Bukan seperti yang dilihat manusia
  rationale: Bentuk yang dipilih menjelaskan elipsis Ibrani secukupnya, sambil mempertahankan kontras bahwa penilaian Yahweh berbeda dari penilaian manusia.
- issue: Makna 'hati' dalam antropologi Ibrani
  choice: hati
  alternative: batin
  rationale: '''Hati'' mempertahankan metafora sumber dan tidak membatasi maknanya pada perasaan saja; dalam konteks Ibrani istilah ini mencakup pusat pikiran, kehendak, dan watak.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Namun' menandai kontras dengan konteks sebelumnya; 'berfirman' dipakai bagi tuturan ilahi. Susunan klausa dibuat alami dalam bahasa Indonesia sambil mempertahankan citra mata dan hati dari teks Ibrani.
