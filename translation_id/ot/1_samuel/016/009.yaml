  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: id
  text: Kemudian Isai menyuruh Syama lewat, lalu Samuel berkata, “Yang ini pun tidak dipilih Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: menyuruh ... lewat di hadapan Samuel
  rationale: 'Bentuk Hifil dari עבר bersifat kausatif: Isai membuat Syama lewat di hadapan orang yang menilai anak-anaknya. Penambahan “di hadapan Samuel” memperjelas relasi yang tersirat kuat oleh konteks tanpa mengubah tindakan.'
- source_word: יִשַׁי
  choice: Isai
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שַׁמָּה
  choice: Syama
  rationale: Transliterasi Indonesia yang wajar bagi nama Ibrani שַׁמָּה.
- source_word: וַיֹּאמֶר
  choice: Samuel berkata
  rationale: Secara harfiah hanya “ia berkata”, tetapi konteks langsung menunjukkan bahwa pembicaranya ialah Samuel. Penyebutan nama menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
- source_word: גַּם בָּזֶה
  choice: Yang ini pun
  rationale: גַּם menyertakan Syama bersama para calon yang sebelumnya ditolak; “pun” menyampaikan daya aditif itu secara alami, sedangkan בָּזֶה menunjuk orang yang sedang diperiksa.
- source_word: לֹא בָחַר
  choice: tidak dipilih
  rationale: בחר berarti memilih. Bentuk pasif Indonesia mempertahankan Yahweh sebagai pelaku yang muncul sesudah verba dan menghasilkan ujaran yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
- issue: Identitas subjek וַיֹּאמֶר
  choice: Samuel berkata
  alternative: ia berkata
  rationale: Bentuk Ibrani sendiri memakai subjek tersirat yang dapat diterjemahkan “ia”, tetapi konteks rangkaian ayat 6–10 mengidentifikasi Samuel sebagai pembicara. Nama disebut demi kejernihan, tanpa membawa penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dialog dibuat alami; “pun” mempertahankan hubungan dengan penolakan calon-calon sebelumnya. Tidak diperlukan catatan kaki.
