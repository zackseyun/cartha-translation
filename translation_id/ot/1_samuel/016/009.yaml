  terminology: “Isai,” “Syama,” “Samuel,” dan “Yahweh” konsisten dengan penggunaan Indonesia yang lazim serta mempertahankan nama ilahi. “Yang ini pun tidak dipilih Yahweh” menyampaikan daya aditif גַּם dan makna בחר dengan baik.
