base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: id
  text: Kemudian Isai memanggil Abinadab dan menyuruhnya lewat di hadapan Samuel. Samuel berkata, “Yang ini pun tidak dipilih Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: Kemudian Isai memanggil Abinadab
  rationale: קרא dengan אֶל dalam konteks ini berarti memanggil seseorang. Bentuk Indonesia ini alami dan tetap mengikuti alur narasi Ibrani.
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: lalu menyuruhnya lewat di hadapan Samuel
  rationale: 'Bentuk Hifil dari עבר menyatakan kausatif: Isai menyebabkan atau menyuruh Abinadab lewat di hadapan Samuel. Pilihan ini mempertahankan unsur kausatif tanpa menjadi kaku.'
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Subjek verba tidak disebutkan secara eksplisit dalam teks Ibrani. Pronomina mempertahankan bentuk naratif dan ambiguitas gramatikal sumber, walaupun konteks menunjuk kepada Samuel.
- source_word: גַּם בָּזֶה
  choice: Yang ini pun
  rationale: Partikel גַּם membawa makna tambahan, yaitu bahwa orang ini juga tidak dipilih. 'Yang ini pun' merupakan ungkapan Indonesia yang alami dan dekat dengan susunan Ibrani.
- source_word: לֹא בָחַר
  choice: tidak dipilih
  rationale: Ungkapan pasif alami dalam bahasa Indonesia mempertahankan Yahweh sebagai pelaku yang dinyatakan setelah verba serta menyampaikan hasil penilaian dalam adegan pemilihan ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama, bukan menggantinya dengan gelar.
- issue: Identitas pembicara dalam וַיֹּאמֶר
  choice: Ia berkata
  alternative: Samuel berkata
  rationale: Konteks kuat mengarah kepada Samuel, tetapi subjek tidak disebutkan secara eksplisit dalam klausa Ibrani. Pronomina menjaga ketegangan kecil antara kejelasan kontekstual dan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Nama יִשַׁי ditulis 'Isai' sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; nama lain ditulis 'Abinadab' dan 'Samuel'. Tidak diperlukan catatan kaki karena גַּם בָּזֶה dapat disampaikan secara wajar dan cukup harfiah sebagai 'Yang ini pun'.
