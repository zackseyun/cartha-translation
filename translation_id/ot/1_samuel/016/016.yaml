source:
  edition: WLC
  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: id
  text: Kiranya tuanku berkenan berkata kepada hamba-hambamu yang ada di hadapanmu supaya mereka mencari seorang yang pandai memainkan lira. Ketika roh jahat dari Allah ada padamu[a], orang itu akan memainkannya dengan tangannya, dan keadaanmu akan membaik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “roh yang mencelakakan dari Allah.” Secara harfiah, frasa Ibrani dapat berarti “roh jahat/yang mencelakakan dari atau milik Allah.”'
    reason: Menjaga ambiguitas רָעָה antara sifat jahat dan dampak yang mencelakakan, serta ambiguitas hubungan genitif אֱלֹהִים antara asal dan kepunyaan.
lexical_decisions:
- source_word: יֹאמַר נָא אֲדֹנֵינוּ
  choice: Kiranya tuanku memerintahkan
  rationale: Bentuk volitif dengan נָא menyampaikan permohonan yang sopan. Dalam konteks istana, אָמַר dapat mengacu pada pemberian perintah; pilihan ini menghasilkan bahasa Indonesia yang alami tanpa menghilangkan nada hormat kepada Saul.
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: hamba-hambamu yang ada di hadapanmu
  rationale: Ungkapan ini menunjuk kepada para pelayan istana yang hadir dan melayani di hadapan raja. Bentuk konkret bahasa Ibrani tetap dipertahankan.
- source_word: יְבַקְשׁוּ אִישׁ
  choice: untuk mencari seorang
  rationale: Kata kerja jamak menyatakan usulan agar para hamba mencari satu orang yang sesuai. Bahasa Indonesia tidak memerlukan kata tambahan yang menyiratkan hasil pencarian.
- source_word: יֹדֵעַ מְנַגֵּן
  choice: yang pandai memainkan
  rationale: Konstruksi partisipial menyatakan kecakapan, bukan sekadar pengetahuan teoritis. 'Pandai memainkan' alami dan jelas dalam bahasa Indonesia.
- source_word: כִּנּוֹר
  choice: lira
  rationale: כִּנּוֹר adalah alat musik petik kuno yang secara organologis lebih dekat dengan lira daripada harpa atau kecapi modern.
- source_word: וְהָיָה בִּהְיוֹת
  choice: Apabila
  rationale: Konstruksi temporal ini memperkenalkan keadaan yang diperkirakan akan berulang. 'Apabila' menyampaikan hubungan waktu dan kondisi secara ringkas.
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: roh jahat dari Allah
  rationale: Terjemahan ini mempertahankan arti langsung רָעָה dan hubungan asal yang dinyatakan konstruksi Ibrani. Kemungkinan arti 'roh yang mencelakakan' dicatat dalam catatan kaki agar ambiguitas leksikal tidak diselesaikan secara diam-diam.
- source_word: עָלֶיךָ
  choice: datang atasmu
  rationale: Preposisi עַל menggambarkan roh yang berada atau datang atas Saul. Ungkapan ini mempertahankan citra sumber dengan bahasa yang masih dapat dipahami.
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: orang itu akan memainkannya dengan tangannya
  rationale: Subjek diperjelas sebagai orang yang telah dicari, sedangkan objek pronominal merujuk pada lira. 'Dengan tangannya' mempertahankan ungkapan konkret Ibrani.
- source_word: וְטוֹב לָךְ
  choice: keadaanmu akan membaik
  rationale: Ungkapan Ibrani menyatakan bahwa keadaan Saul akan menjadi baik. Terjemahan ini alami dan tidak membatasi hasilnya hanya pada perasaan atau emosi.
theological_decisions:
- issue: Cara menerjemahkan רוּחַ אֱלֹהִים רָעָה tanpa meniadakan hubungan roh itu dengan Allah atau menentukan secara berlebihan sifat kejahatannya
  choice: roh jahat dari Allah
  alternative: roh yang mencelakakan dari Allah; roh jahat milik Allah
  rationale: Teks menghubungkan roh tersebut secara langsung dengan Allah, sementara hubungan genitifnya dapat dipahami sebagai asal atau kepunyaan. רָעָה dapat menunjuk pada sifat jahat atau dampak yang mencelakakan. Teks utama memakai padanan langsung, sedangkan catatan kaki mempertahankan kemungkinan semantis dan sintaktis lainnya tanpa memberikan penjelasan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'tuanku' serta bentuk 'hamba-hambamu' mempertahankan suasana istana dan hierarki sosial. Istilah 'lira' dipilih demi ketepatan alat musik kuno; konteks langsung menjelaskan bahwa alat itu dimainkan dengan tangan.
