  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: id
  text: Lalu Samuel melakukan apa yang telah difirmankan Yahweh dan datang ke Betlehem. Para tua-tua kota itu gemetar ketika menemuinya[a] dan bertanya, “Apakah kedatanganmu membawa damai?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para tua-tua kota itu gemetar untuk menemuinya.”
    reason: Susunan Ibrani dapat dipahami sebagai para tua-tua yang gemetar ketika menemui Samuel atau yang gemetar untuk menemui dia.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Padanan langsung dan wajar untuk עשה dalam rangkaian naratif; menyatakan bahwa Samuel menaati firman yang telah disampaikan tanpa menambahkan gagasan yang tidak tersurat.
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: apa yang telah Yahweh firmankan
  rationale: Menjaga acuan harfiah kepada apa yang Yahweh ‘ucapkan’; ‘telah’ memperjelas bahwa firman itu mendahului tindakan Samuel, sedangkan ‘firmankan’ sesuai dengan ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: Ia datang ke Betlehem
  rationale: בוא dapat berarti datang atau pergi; ‘datang ke Betlehem’ alami dalam sudut pandang narasi dan mempertahankan arah menuju tempat tersebut.
- source_word: וַיֶּחֶרְדוּ
  choice: gemetar
  rationale: Mempertahankan gambaran kuat חרד tentang kegentaran atau ketakutan, bukan meratakannya menjadi sekadar ‘takut’.
- source_word: זִקְנֵי הָעִיר
  choice: para tua-tua kota itu
  rationale: Menunjuk kelompok pemimpin masyarakat yang dikenal sebagai tua-tua, dengan bentuk Indonesia yang jelas dan lazim dalam konteks Alkitab.
- source_word: לִקְרָאתוֹ
  choice: saat menemuinya
  rationale: לקראת menunjuk gerak atau perjumpaan untuk menemui seseorang. Susunan ini alami dalam bahasa Indonesia sambil mempertahankan hubungan antara kegentaran mereka dan pertemuan dengan Samuel.
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: Apakah kedatanganmu membawa damai?
  rationale: Ungkapan Ibrani secara ringkas menanyakan apakah kedatangan Samuel bersifat damai. Bentuk ini alami dan mempertahankan fokus pada dampak atau maksud kedatangannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi secara langsung; ‘Yahweh’ mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna שָׁלוֹם dalam pertanyaan para tua-tua
  choice: membawa damai
  alternative: dengan maksud damai
  rationale: Konteks menunjukkan kekhawatiran tentang sifat kedatangan Samuel. ‘Membawa damai’ mempertahankan keluasan שָׁלוֹם dan tidak membatasi pertanyaan hanya pada niat batinnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. ‘Firmankan’ dan ‘tua-tua’ mempertahankan register Alkitab yang dikenal luas, sedangkan struktur kalimat dan pertanyaan dibuat alami bagi pembaca masa kini.
