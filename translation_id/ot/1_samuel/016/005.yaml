  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם לִ/זְבֹּ֤חַ לַֽ/יהוָה֙ בָּ֔אתִי הִֽתְקַדְּשׁ֔וּ וּ/בָאתֶ֥ם אִתִּ֖/י בַּ/זָּ֑בַח וַ/יְקַדֵּ֤שׁ אֶת יִשַׁי֙ וְ/אֶת בָּנָ֔י/ו וַ/יִּקְרָ֥א לָ/הֶ֖ם לַ/זָּֽבַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: id
  text: Ia berkata[a], “Damai. Aku datang untuk mempersembahkan kurban kepada Yahweh. Kuduskanlah diri kalian, lalu datanglah bersamaku ke upacara kurban itu.” Kemudian Samuel menguduskan Isai dan putra-putranya serta mengundang mereka ke upacara kurban itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semuanya baik-baik saja” atau “Aku datang dengan damai.” Bahasa Ibrani hanya berbunyi “Damai,” sebagai jaminan bahwa kedatangan Samuel tidak bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: Damai
  rationale: Nomina tanpa verba ini menjawab kekhawatiran dalam ayat sebelumnya dan berfungsi sebagai jaminan bahwa kedatangan Samuel tidak bermusuhan. Bentuk ringkas dipertahankan, sedangkan makna idiomatis dijelaskan dalam catatan kaki.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: untuk mempersembahkan kurban kepada Yahweh
  rationale: Infinitif זבח dengan ל menyatakan tujuan kedatangan Samuel. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan konteks ibadah kurban.
- source_word: הִתְקַדְּשׁוּ
  choice: Kuduskanlah dirimu
  rationale: Bentuk hitpael merujuk pada persiapan ritual untuk mengambil bagian dalam kurban. Pilihan ini mempertahankan kaitannya dengan kekudusan tanpa mempersempit makna hanya menjadi pembersihan.
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: lalu datanglah bersamaku ke upacara kurban
  rationale: Dalam rangkaian ini bentuk tersebut berdaya perintah atau undangan. 'Upacara kurban' memperjelas bahwa yang dimaksud ialah peristiwa ritual tertentu, bukan sekadar benda kurban.
- source_word: וַיְקַדֵּשׁ
  choice: Samuel menguduskan
  rationale: Bentuk piel menunjukkan tindakan mempersiapkan atau mengkhususkan Isai dan anak-anaknya secara ritual. Nama Samuel dinyatakan untuk menjernihkan subjek yang tersirat dalam bahasa Ibrani.
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: mengundang mereka ke upacara kurban
  rationale: קרא dengan ל dapat berarti memanggil, mengundang, atau menghadirkan. Dalam konteks sesudah pengudusan, 'mengundang' secara alami menyampaikan pelibatan mereka dalam upacara tanpa memberi kesan paksaan.
- source_word: יִשַׁי
  choice: Isai
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks narasi, referennya adalah putra-putra Isai. Bahasa Indonesia lazim memakai 'anak-anaknya'; jenis kelamin mereka telah jelas dari konteks luas, meskipun 'putra-putranya' juga mungkin.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Makna tindakan pengudusan
  choice: menguduskan dalam arti mempersiapkan secara ritual
  alternative: menyucikan; menahirkan
  rationale: Akar קדשׁ menekankan pengkhususan bagi partisipasi kudus. Teks tidak merinci tata cara atau hanya berbicara tentang pembersihan, sehingga terjemahan tidak menambahkan prosedur tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog mempertahankan jawaban Ibrani yang sangat ringkas, sementara catatan kaki menjelaskan fungsi idiomatisnya. 'Kurban' dipilih sebagai ejaan baku; 'upacara kurban' digunakan untuk membedakan peristiwa ritual dari persembahan itu sendiri.
