  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: id
  text: Lalu para pelayan Saul berkata kepadanya, “Lihatlah, roh jahat[a] dari Allah sedang menakut-nakuti engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roh yang mencelakakan atau menyusahkan dari Allah.” Kata Ibrani yang dipakai dapat menggambarkan roh itu sebagai jahat atau sebagai penyebab celaka atau kesusahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: עַבְדֵי שָׁאוּל
  choice: para pelayan Saul
  rationale: Dalam konteks istana, עֶבֶד menunjuk para pelayan atau abdi raja. “Para pelayan” jelas dan alami tanpa menonjolkan pengertian budak.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Padanan langsung dan idiomatis bagi preposisi dengan akhiran pronominal.
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: Ungkapan ini mengarahkan perhatian dengan nada mendesak. “Lihatlah” mempertahankan fungsi wacananya tanpa terdengar terlalu arkais; unsur נָא terserap dalam partikel penegas -lah.
- source_word: רוּחַ אֱלֹהִים
  choice: roh ... dari Allah
  rationale: Dalam konteks ini, frasa tersebut menyatakan hubungan roh itu dengan Allah sebagai sumber atau pihak yang mengutusnya. “Dari Allah” mempertahankan hubungan itu tanpa menyamakan roh tersebut dengan Roh Allah sendiri.
- source_word: רָעָה
  choice: jahat
  rationale: רָעָה dapat berarti jahat ataupun bersifat mencelakakan dan menyesakkan. “Jahat” merupakan padanan langsung, sedangkan kemungkinan makna kontekstual lainnya dicatat dalam catatan kaki.
- source_word: מְבַעִתֶּךָ
  choice: sedang membuat engkau ketakutan
  rationale: Bentuk partisip menyatakan tindakan yang berlangsung, sedangkan verba בעת mengandung gagasan ketakutan atau kengerian yang kuat. Ungkapan ini alami dalam bahasa Indonesia dan tidak selemah “mengganggu”.
theological_decisions:
- issue: Cara menerjemahkan רוּחַ אֱלֹהִים רָעָה tanpa memasukkan kesimpulan doktrinal yang tidak dinyatakan teks
  choice: roh jahat dari Allah
  alternative: roh yang mencelakakan atau menyesakkan dari Allah; roh jahat milik Allah
  rationale: Teks Ibrani menghubungkan roh itu dengan Allah dalam suatu pengertian yang tidak dijelaskan lebih lanjut. “Dari Allah” mempertahankan ketegangan tersebut, tetapi tidak menyiratkan bahwa roh itu identik dengan Roh Allah. Karena רָעָה juga dapat menggambarkan akibat yang mencelakakan atau menyesakkan, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai sesuai tuturan langsung kepada Saul. Struktur kalimat dibuat alami sambil mempertahankan hubungan eksplisit antara roh tersebut dan Allah serta aspek tindakan yang sedang berlangsung.
