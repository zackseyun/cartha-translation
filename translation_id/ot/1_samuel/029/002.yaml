base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/002.yaml
  text: And the lords of the Philistines were passing by by hundreds and by thousands[a], and David and his men were passing by at the rear with Achish.
translation:
  language: id
  text: Para penguasa Filistin berbaris lewat dalam kelompok-kelompok seratus dan seribu orang[a], dan Daud bersama orang-orangnya berbaris lewat di bagian paling belakang bersama Akhis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seratus demi seratus dan seribu demi seribu.” Ungkapan Ibrani ini mungkin merujuk pada kesatuan-kesatuan militer yang disusun dalam kelompok seratus dan seribu.
    reason: lexical_alternative
lexical_decisions:
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa orang Filistin
  rationale: סֶרֶן adalah gelar bagi penguasa tinggi negara-negara kota Filistin. 'Para penguasa' menyampaikan kedudukan politik dan militer mereka secara wajar dalam bahasa Indonesia.
- source_word: עֹבְרִים
  choice: bergerak maju
  rationale: Partisip Ibrani menggambarkan gerakan yang sedang berlangsung dalam suatu barisan. Dalam konteks pasukan, 'bergerak maju' lebih alami daripada terjemahan harfiah 'lewat'.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: dalam pasukan-pasukan beranggotakan seratus dan seribu orang
  rationale: Ungkapan ini kemungkinan menunjuk pada pembagian atau susunan kesatuan militer menurut kelompok seratus dan seribu; catatan kaki mempertahankan kemungkinan pembacaan yang lebih distributif.
- source_word: אֲנָשָׁיו
  choice: anak buahnya
  rationale: Dalam konteks ini ungkapan tersebut menunjuk pada para lelaki pengikut Daud, khususnya kelompok tempurnya. 'Anak buahnya' alami dan tidak membatasi mereka secara berlebihan sebagai tentara resmi.
- source_word: בָּאַחֲרֹנָה
  choice: paling belakang
  rationale: Kata ini menunjukkan posisi terakhir atau bagian belakang dalam barisan.
- source_word: עִם אָכִישׁ
  choice: bersama Akhis
  rationale: Menyatakan penyertaan secara sederhana dan alami.
