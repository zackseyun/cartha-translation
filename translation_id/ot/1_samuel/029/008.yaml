base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: id
  text: Daud berkata kepada Akhis, “Tetapi, apa yang telah kulakukan? Kesalahan apa yang kaudapati pada hambamu sejak hari aku mulai mengabdi kepadamu sampai hari ini, sehingga aku tidak boleh pergi dan berperang melawan musuh-musuh tuanku, sang raja?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “tuanku, sang raja” dibiarkan sebagaimana diucapkan Daud. Yang dimaksud mungkin Akhis, tetapi dalam konteks kisah ini kata-kata Daud juga mungkin sengaja bermakna ganda.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: Tetapi, apa yang telah kulakukan?
  rationale: Partikel כִּי memperkenalkan sanggahan Daud terhadap keputusan sebelumnya; “Tetapi” menyampaikan fungsi wacananya secara alami dalam bahasa Indonesia.
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: Kesalahan apa yang kaudapati pada hambamu ini
  rationale: Konstruksi מצא dengan ב dalam konteks ini menyiratkan ditemukannya kesalahan atau alasan untuk menuduh. “Kesalahan apa” mengungkapkan implikasi itu secara jelas, sedangkan “pada hambamu” tetap dekat dengan bentuk Ibrani.
- source_word: בְעַבְדְּךָ
  choice: hambamu ini
  rationale: עבד di sini merupakan sebutan merendahkan diri dalam bahasa istana, sehingga “hamba” lebih tepat daripada “budak”; “ini” membuat rujukan diri orang ketiga terdengar wajar dalam bahasa Indonesia.
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: sejak hari aku mulai mengabdi kepadamu sampai hari ini
  rationale: Ungkapan harfiahnya, “sejak hari aku berada di hadapanmu,” dalam konteks menunjuk pada masa Daud berada dalam hubungan pelayanan kepada Akhis. Pilihan ini menyampaikan makna idiomatis dan cakupan waktunya secara alami.
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: sehingga aku tidak boleh ikut berperang
  rationale: Klausa ini menyatakan akibat yang dipersoalkan Daud, yakni bahwa ia tidak diizinkan menyertai pasukan. “Ikut berperang” sesuai dengan konteks keberangkatan bersama tentara.
- source_word: בְּאֹיְבֵי
  choice: melawan musuh-musuh
  rationale: Dengan נלחם, preposisi ב menandai lawan dalam pertempuran; “melawan” adalah padanan Indonesia yang jelas dan lazim.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku, sang raja
  rationale: אֲדֹנִי adalah sapaan hormat kepada penguasa manusia. “Tuanku, sang raja” mempertahankan ragam istana dan tidak menjadikannya gelar ilahi.
theological_decisions:
- issue: Rujukan dan daya retoris frasa “musuh-musuh tuanku, sang raja”
  choice: Mempertahankan frasa itu sebagaimana diucapkan tanpa menentukan identitas “tuanku, sang raja.”
  alternative: Menafsirkannya secara tegas sebagai Akhis, atau sebagai ungkapan ambigu yang diam-diam merujuk kepada raja Israel.
  rationale: Teks Ibrani tidak menyatakan maksud batin Daud. Terjemahan perlu mempertahankan kemungkinan bahwa ucapan itu ditujukan secara langsung kepada Akhis sekaligus ketegangan naratif yang mungkin membuatnya bermakna ganda.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Bentuk “kulakukan,” “kaudapati,” dan “hambamu” mempertahankan keakraban sekaligus kesopanan percakapan istana. Penanda catatan kaki [a] ditempatkan setelah seluruh ucapan karena menjelaskan ambiguitas pada frasa penutup.
