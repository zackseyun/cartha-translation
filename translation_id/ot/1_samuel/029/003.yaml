base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: id
  text: Lalu para panglima Filistin berkata, “Ada apa dengan orang-orang Ibrani ini?” Akhis menjawab para panglima Filistin itu, “Bukankah ini Daud, hamba Saul, raja Israel, yang telah bersamaku selama berhari-hari atau bertahun-tahun? Aku tidak menemukan apa pun yang salah padanya sejak hari ia berpihak kepadaku[a] sampai hari ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sejak hari ia jatuh”; ungkapan ini dapat berarti sejak ia beralih atau membelot ke pihak Akhis.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: para panglima Filistin
  rationale: Dalam konteks pengerahan pasukan, שָׂרִים menunjuk kepada para pemimpin berpangkat tinggi; “panglima” menyampaikan fungsi militernya secara alami.
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: Untuk apa orang-orang Ibrani ini ada di sini?
  rationale: Ungkapan Ibrani ini eliptis, secara harfiah “Apa orang-orang Ibrani ini?” Bahasa Indonesia memerlukan pelengkapan agar daya pertanyaan yang mencurigai kehadiran mereka tersampaikan secara wajar.
- source_word: הָעִבְרִים
  choice: orang-orang Ibrani
  rationale: Mempertahankan sebutan etnis yang digunakan orang Filistin, bukan menggantinya dengan “orang Israel”.
- source_word: הֲלוֹא
  choice: Bukankah ini
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan.
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam hubungan istana dan politik Daud dengan Saul, “hamba” lebih tepat daripada “budak” dan tetap mempertahankan istilah sumber.
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: selama berhari-hari, bahkan bertahun-tahun
  rationale: Menyampaikan rentang waktu idiomatis dan penekanannya dalam bahasa Indonesia alami; אוֹ di sini dapat memberi nuansa koreksi atau peningkatan retoris, bukan semata-mata pilihan eksklusif.
- source_word: מְאוּמָה
  choice: kesalahan padanya
  rationale: Secara harfiah berarti “apa pun”; dalam konteks Akhis tidak menemukan sesuatu pada Daud yang menjadi alasan untuk menuduh atau menolaknya.
- source_word: מִיּוֹם נָפְלוֹ
  choice: sejak hari ia berpihak kepadaku
  rationale: נפל dalam konteks politik-militer dapat berarti beralih atau membelot ke pihak seseorang. “Berpihak kepadaku” jelas dan tidak sekeras “membelot,” sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan Indonesia yang alami bagi ungkapan waktu Ibrani tersebut.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: דָוִד
  choice: Daud
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat perpindahan Daud kepada Akhis
  choice: berpihak kepadaku
  alternative: membelot kepadaku / jatuh kepadaku
  rationale: Teks memakai idiom politik-militer yang dapat menunjukkan perpindahan kesetiaan, tetapi narasi yang lebih luas membuat ketulusan kesetiaan Daud kepada Filistin tetap tegang. Terjemahan tidak menyatakan lebih jauh bahwa Daud sungguh-sungguh mengkhianati Israel.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pertanyaan eliptis pada awal ayat dilengkapi secara minimal agar alami. Nama Akhis, Daud, dan Saul memakai bentuk yang lazim dalam Alkitab bahasa Indonesia.
