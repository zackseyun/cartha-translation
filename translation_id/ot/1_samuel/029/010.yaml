base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: id
  text: Sekarang, bangunlah pagi-pagi, engkau dan hamba-hamba tuanmu yang datang bersamamu. Ketika kalian bangun pagi-pagi dan hari mulai terang[a], pergilah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika hari mulai terang bagi kalian, pergilah” atau “pada waktu fajar, pergilah.” Frasa Ibraninya secara harfiah berbunyi “dan terang bagi kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini memperkenalkan perintah yang segera berlaku; 'Sekarang' alami dalam bahasa Indonesia dan tidak melebihkan fungsi waw penghubung.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: bangunlah pagi-pagi
  rationale: Bentuk imperatif Hifil dari שׁכם menyatakan bangun atau mulai bergerak sejak pagi; 'bangunlah pagi-pagi' langsung, alami, dan mempertahankan unsur waktu.
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: engkau dan hamba-hamba tuanmu
  rationale: Para hamba secara sintaksis turut menjadi pelaku perintah. 'Tuanmu' menunjukkan majikan manusia dalam konteks ini, bukan gelar ilahi.
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: yang datang bersamamu
  rationale: Klausa relatif ini mengidentifikasi para hamba yang menyertai Daud; bentuk lampau sederhana sesuai dengan alur narasi.
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: Ketika kalian bangun pagi-pagi
  rationale: Bentuk jamak mengacu kepada Daud beserta rombongannya. Dalam rangkaian perintah ini, penghubung dan bentuk perfektif dapat dipahami secara temporal; 'ketika' menghasilkan bahasa Indonesia yang jelas tanpa menghapus pengulangan sumber.
- source_word: וְאוֹר לָכֶם
  choice: dan hari sudah terang bagi kalian
  rationale: Ungkapan Ibrani secara harfiah berarti 'dan terang bagi kalian'. Pilihan ini mempertahankan konstruksi yang tidak biasa serta makna bahwa keberangkatan dilakukan setelah cukup terang.
- source_word: וָלֵכוּ
  choice: pergilah
  rationale: Imperatif jamak dari הלך paling langsung diterjemahkan 'pergilah'; pilihan ini tidak mempersempitnya menjadi 'tinggalkan tempat ini'.
