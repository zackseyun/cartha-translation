translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk sapaan tunggal kepada Daud, lalu 'kalian' untuk bentuk jamak yang mencakup Daud dan para pengikutnya. Pengulangan 'bangun pagi-pagi' dipertahankan karena terdapat dalam teks Ibrani.
