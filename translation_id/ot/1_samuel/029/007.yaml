  yaml_path: translation/ot/1_samuel/029/007.yaml
  text: So now[a], return and go in peace, and do not do evil in the eyes of the Philistine lords.
translation:
  language: id
  text: Jadi sekarang, kembalilah dan pergilah dengan damai, dan jangan lakukan yang jahat di mata para penguasa Filistin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan lakukan yang buruk menurut penilaian para penguasa Filistin.” Ungkapan Ibrani “di mata” menyatakan apa yang mereka nilai jahat, salah, atau tidak berkenan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mengungkapkan unsur penghubung וְ serta fungsi temporal dan wacana עַתָּה sebagai pengantar kesimpulan atau perintah.
- source_word: שׁוּב וְלֵךְ
  choice: kembalilah dan pergilah
  rationale: Mempertahankan kedua kata perintah Ibrani yang berurutan, sekalipun dalam bahasa Indonesia terdapat sedikit pengulangan yang bersifat penegasan.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Ungkapan Indonesia yang wajar untuk idiom Ibrani ini dan tetap membuka nuansa pergi dengan selamat.
- source_word: וְלֹא תַעֲשֶׂה רָע בְּעֵינֵי
  choice: Jangan lakukan apa yang dipandang buruk oleh
  rationale: Menerjemahkan idiom penilaian בְּעֵינֵי secara alami dan mencegah kalimat disalahpahami seolah-olah Akhis menuduh Daud hendak melakukan kejahatan mutlak; רָע tetap mempertahankan nuansa 'buruk/jahat' yang ditentukan dari sudut pandang para penguasa.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa Filistin
  rationale: סֶרֶן adalah gelar bagi para pemimpin utama negara-kota Filistin; 'penguasa' lebih jelas bagi pembaca Indonesia modern daripada serapan atau gelar yang kurang dikenal.
theological_decisions:
- issue: Apakah רָע menunjuk pada kejahatan moral mutlak atau tindakan yang dinilai tidak berkenan oleh para penguasa Filistin
  choice: apa yang dipandang buruk oleh para penguasa Filistin
  alternative: kejahatan di mata para penguasa Filistin
  rationale: Konstruksi בְּעֵינֵי menandai sudut pandang atau penilaian mereka. Terjemahan tidak menetapkan bahwa tindakan tersebut secara objektif merupakan dosa, tetapi tetap mempertahankan istilah evaluatif רָע.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua imperatif dipertahankan untuk mencerminkan penegasan teks Ibrani; idiom 'di mata' dijelaskan dalam catatan agar makna evaluatifnya jelas.
