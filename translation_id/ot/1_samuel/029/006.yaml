  text: וַ/יִּקְרָ֨א אָכִ֜ישׁ אֶל דָּוִ֗ד וַ/יֹּ֣אמֶר אֵ֠לָי/ו חַי יְהוָ֞ה כִּי יָשָׁ֣ר אַתָּ֗ה וְ/ט֣וֹב בְּ֠/עֵינַ/י צֵאתְ/ךָ֨ וּ/בֹאֲ/ךָ֤ אִתִּ/י֙ בַּֽ/מַּחֲנֶ֔ה כִּ֠י לֹֽא מָצָ֤אתִֽי בְ/ךָ֙ רָעָ֔ה מִ/יּ֛וֹם בֹּאֲ/ךָ֥ אֵלַ֖/י עַד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בְ/עֵינֵ֥י הַ/סְּרָנִ֖ים לֹֽא ט֥וֹב אָֽתָּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: id
  text: Lalu Akhis memanggil Daud dan berkata kepadanya, “Demi Yahweh yang hidup, engkau seorang yang berintegritas. Kepergian dan kedatanganmu bersamaku di perkemahan adalah baik dalam pandanganku[a], sebab aku tidak menemukan kejahatan apa pun padamu sejak hari engkau datang kepadaku sampai hari ini. Namun, dalam pandangan para penguasa Filistin[b], engkau tidak baik[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepergian dan kedatanganmu bersamaku di perkemahan.” Ungkapan ini dapat berarti “tingkah lakumu bersamaku di perkemahan.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani sĕrānîm (סְרָנִים), gelar khusus bagi para penguasa Filistin.
    reason: cultural_note
  - marker: c
    text: Dalam konteks ini, “engkau tidak baik” dapat berarti “engkau tidak berkenan” atau “engkau tidak dapat diterima.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan rumusan sumpah. Bentuk Indonesia ini menyampaikan daya sumpah secara alami sekaligus mempertahankan nama ilahi.
- source_word: יָשָׁר
  choice: orang yang lurus hati
  rationale: Mengungkapkan kelurusan moral dan integritas dalam bahasa Indonesia modern; lebih jelas daripada sekadar 'lurus'.
- source_word: טוֹב בְּעֵינַי
  choice: Aku memandang baik
  rationale: Mempertahankan citra penilaian melalui penglihatan secara idiomatis dan wajar dalam bahasa Indonesia.
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: kepergian dan kedatanganmu
  rationale: Mempertahankan pasangan kata Ibrani dan nuansa seluruh kegiatan Daud, sementara catatan kaki menjelaskan makna idiomatisnya.
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: bersamaku di perkemahan
  rationale: מַחֲנֶה secara langsung berarti perkemahan dan konteksnya sudah menunjukkan lingkungan militer.
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: aku tidak menemukan kejahatan apa pun padamu
  rationale: Mempertahankan bobot רָעָה sebagai kejahatan atau sesuatu yang tercela tanpa mempersempitnya menjadi kesalahan tertentu.
- source_word: מִיּוֹם בֹּאֲךָ אֵלַי עַד הַיּוֹם הַזֶּה
  choice: sejak hari engkau datang kepadaku sampai hari ini
  rationale: Bentuk ini setia pada rentang waktu teks sumber dan alami dalam bahasa Indonesia.
- source_word: סְרָנִים
  choice: para penguasa Filistin
  rationale: Istilah ini adalah gelar khas bagi penguasa kota-kota Filistin; 'penguasa' lebih alami daripada 'tuan-tuan' dan tidak membatasinya pada jabatan militer.
- source_word: לֹא טוֹב אָתָּה
  choice: engkau tidak baik
  rationale: Mempertahankan ungkapan Ibrani yang singkat dan keras serta ambiguitas antara penilaian moral dan ketidakterimaan; makna kontekstual dijelaskan dalam catatan.
theological_decisions:
- issue: Nama ilahi יְהוָה dalam sumpah yang diucapkan raja Filistin
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יהוה. Transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa mengubahnya menjadi gelar, meskipun penuturnya adalah seorang Filistin.
- issue: Apakah pujian Akhis menetapkan keadaan moral Daud secara objektif
  choice: Dipertahankan sebagai penilaian Akhis dalam dialog
  alternative: Dirumuskan sebagai pernyataan narator tentang ketidakbersalahan Daud
  rationale: Klausa berada dalam ucapan Akhis. Terjemahan tidak memperluasnya menjadi putusan teologis atau moral dari narator.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai untuk dialog naratif Alkitab yang tetap mudah dipahami. Struktur Ibrani dipertahankan ketika bermakna, sedangkan catatan kaki membantu pembaca memahami idiom dan gelar budaya.
