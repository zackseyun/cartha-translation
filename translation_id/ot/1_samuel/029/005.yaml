  yaml_path: translation/ot/1_samuel/029/005.yaml
  text: Is this not David[a], of whom they sang to one another in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: id
  text: 'Bukankah ini Daud yang tentangnya mereka bernyanyi bersahut-sahutan dalam tari-tarian[a] sambil berkata: “Saul telah menewaskan beribu-ribu, dan Daud berpuluh-puluh ribu[b]”?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mereka menjawab tentang dia dalam tari-tarian”; ungkapan ini menunjuk pada nyanyian bersahut-sahutan atau berbalasan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani dasarnya berarti “sepuluh ribu”; bentuk jamaknya juga dapat dipahami secara lebih umum sebagai “jumlah yang sangat besar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא זֶה דָוִד
  choice: Bukankah ini Daud
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan persetujuan sekaligus penunjukan yang tegas kepada Daud.
- source_word: אֲשֶׁר יַעֲנוּ לוֹ
  choice: yang tentangnya mereka berbalas nyanyi
  rationale: Kata ענה dalam konteks nyanyian dan tarian menunjuk pada nyanyian bersahut-sahutan; frasa לוֹ dipertahankan sebagai rujukan kepada Daud, yaitu “tentangnya”.
- source_word: בַּמְּחֹלוֹת
  choice: dalam tarian
  rationale: מְחֹלוֹת menunjuk pada tarian perayaan, kemungkinan tarian berkelompok atau melingkar. Bentuk ini mempertahankan latar perayaan tanpa mempersempit gambaran.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Pengantar kutipan ini diterjemahkan secara alami dalam bahasa Indonesia sambil tetap memperlihatkan bahwa syair berikut merupakan isi nyanyian.
- source_word: הִכָּה
  choice: telah menewaskan
  rationale: Dalam konteks lagu kemenangan perang, נכה menyatakan tindakan mengalahkan dengan akibat mematikan. “Menewaskan” menyampaikan makna kontekstualnya secara wajar.
- source_word: בַּאֲלָפָיו
  choice: beribu-ribu
  rationale: Ungkapan bilangan ini menyatakan jumlah musuh yang ditewaskan. “Beribu-ribu” alami dalam bahasa Indonesia dan mempertahankan kontras dengan jumlah yang lebih besar pada baris berikutnya.
- source_word: בְרִבְבֹתָו
  choice: berpuluh-puluh ribu
  rationale: רְבָבָה pada dasarnya berarti sepuluh ribu dan dalam bentuk jamak dapat menyatakan puluhan ribu atau jumlah yang amat besar. Pilihan ini mempertahankan peningkatan angka dalam paralelisme syair.
