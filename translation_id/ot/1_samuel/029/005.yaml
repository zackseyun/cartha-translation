  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “berbalas nyanyi” dipilih agar praktik nyanyian responsorial dapat dipahami pembaca umum, sedangkan paralel “beribu-ribu—berpuluh-puluh ribu” menjaga irama dan perbandingan dalam syair kemenangan.
