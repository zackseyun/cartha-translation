  text: וַ/יִּקְצְפ֨וּ עָלָ֜י/ו שָׂרֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֣אמְרוּ ל/וֹ֩ שָׂרֵ֨י פְלִשְׁתִּ֜ים הָשֵׁ֣ב אֶת הָ/אִ֗ישׁ וְ/יָשֹׁב֙ אֶל מְקוֹמ/וֹ֙ אֲשֶׁ֣ר הִפְקַדְתּ֣/וֹ שָׁ֔ם וְ/לֹֽא יֵרֵ֤ד עִמָּ֨/נוּ֙ בַּ/מִּלְחָמָ֔ה וְ/לֹא יִֽהְיֶה לָּ֥/נוּ לְ/שָׂטָ֖ן בַּ/מִּלְחָמָ֑ה וּ/בַ/מֶּ֗ה יִתְרַצֶּ֥ה זֶה֙ אֶל אֲדֹנָ֔י/ו הֲ/ל֕וֹא בְּ/רָאשֵׁ֖י הָ/אֲנָשִׁ֥ים הָ/הֵֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: id
  text: Namun, para panglima Filistin marah kepadanya. Mereka berkata kepadanya, “Suruhlah orang itu kembali. Biarlah ia kembali ke tempat ia telah kautempatkan. Jangan biarkan ia turun bersama kami ke pertempuran, agar ia tidak menjadi lawan bagi kami dalam pertempuran.[a] Dengan apa orang ini dapat memperoleh kembali perkenanan tuannya?[b] Bukankah dengan kepala orang-orang itu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שָׂטָן di sini berarti “lawan” atau “penentang,” bukan nama diri “Satan”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berbaik kembali dengan tuannya”. Ungkapan Ibrani ini berarti membuat dirinya kembali diterima oleh atasannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: marah kepadanya
  rationale: קצף menyatakan kemarahan yang kuat; “marah kepadanya” alami dalam bahasa Indonesia dan tidak melebih-lebihkan kadar yang dituntut konteks.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: para panglima Filistin
  rationale: Dalam konteks pengerahan perang, שָׂרִים paling tepat menunjuk para pemimpin atau komandan militer; “panglima” jelas dan bermartabat.
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: Suruhlah orang itu kembali
  rationale: Bentuk Hifil dari שוב bersifat kausatif, yaitu menyuruh atau membuat seseorang kembali.
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: Biarlah ia pulang ke tempat
  rationale: Ungkapan ini meneruskan perintah sebelumnya dan menyatakan hasil yang dikehendaki; “pulang” wajar untuk kembali ke tempat penempatannya.
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: yang telah kautetapkan baginya
  rationale: הפקיד dapat berarti menempatkan, menugaskan, atau menetapkan. Pilihan ini mempertahankan keluasan makna tanpa menentukan secara berlebihan jenis penugasannya.
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: Jangan biarkan ia turun bersama kami ke pertempuran
  rationale: “Turun” mempertahankan citra gerak geografis dalam ירד, sedangkan “ke pertempuran” menyampaikan fungsi frasa itu secara alami.
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: supaya ia tidak menjadi lawan bagi kami
  rationale: שָׂטָן di sini adalah nomina umum yang berarti lawan atau musuh, bukan nama diri.
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: orang ini dapat berbaik kembali dengan tuannya
  rationale: Bentuk Hitpael dari רצה dalam konteks ini menyatakan upaya memulihkan penerimaan atau perkenanan dari seorang atasan. “Berbaik kembali” menyampaikan nuansa refleksif dan pemulihan hubungan.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Kata ini menunjuk penguasa David, yakni Saul. “Tuan” mempertahankan hubungan hierarkis tanpa mengidentifikasikan referennya secara eksplisit di dalam ayat.
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: Bukankah dengan kepala orang-orang itu?
  rationale: Ungkapan Ibrani ini eliptis dan menyiratkan bahwa David dapat memperoleh kembali perkenanan Saul dengan menyerahkan kepala prajurit Filistin. Terjemahan mempertahankan bentuk retoris serta keekonomisan teks sumber.
theological_decisions:
- issue: Makna שָׂטָן
  choice: nomina umum “lawan”
  alternative: nama diri “Satan”
  rationale: Dalam narasi perang ini, kata tersebut menunjuk seseorang yang berbalik menjadi lawan dalam pertempuran. Memakainya sebagai nama diri akan memasukkan pengertian demonologis yang tidak dinyatakan teks.
- issue: Makna יִתְרַצֶּה אֶל אֲדֹנָיו
  choice: berbaik kembali dengan tuannya
  alternative: mendapatkan kembali perkenanan tuannya
  rationale: Pilihan utama mempertahankan nuansa pemulihan hubungan dan bentuk refleksif tanpa memastikan apakah tekanannya terletak pada rekonsiliasi atau penerimaan oleh sang penguasa; alternatif dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “para panglima Filistin” pada klausa kedua diringkas menjadi “mereka” agar alami dalam bahasa Indonesia tanpa mengubah pelaku. Bentuk “kautetapkan” menjaga kelancaran dialog langsung, sedangkan “turun” mempertahankan citra verbal teks Ibrani.
