base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: id
  text: Lalu pagi-pagi sekali Daud dan orang-orangnya bangun untuk berangkat dan kembali ke negeri orang Filistin. Orang Filistin pun maju ke Yizreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik ke Yizreel”; ungkapan Ibrani ini dapat mengandung nuansa topografis atau militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: pagi-pagi sekali ... bangun
  rationale: Bentuk Hifil dari שׁכם menyatakan bangun atau mulai bergerak pagi-pagi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: הוּא וַאֲנָשָׁיו
  choice: Daud dan orang-orangnya
  rationale: Frasa pronominal yang bersifat penegasan ini menunjuk kepada Daud beserta kelompok laki-laki yang mengikutinya; 'orang-orangnya' paling alami tanpa mempersempitnya menjadi pelayan atau pasukan.
- source_word: לָלֶכֶת ... לָשׁוּב
  choice: untuk berangkat dan kembali
  rationale: Kedua bentuk infinitif menyampaikan tindakan berangkat dengan tujuan kembali. 'Berangkat' menjelaskan gerak meninggalkan perkemahan tanpa menjauh dari makna dasar 'pergi'.
- source_word: בַּבֹּקֶר
  choice: pagi-pagi sekali
  rationale: Keterangan pagi dipadukan secara alami dengan verba bangun; intensitas 'sekali' menyampaikan unsur bangun dini hari pada וַיַּשְׁכֵּם tanpa pengulangan kaku.
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ke negeri orang Filistin
  rationale: '''Negeri'' mempertahankan nomina konkret אֶרֶץ, sedangkan ''orang Filistin'' merupakan sebutan etnis yang lazim dalam bahasa Indonesia.'
- source_word: וּפְלִשְׁתִּים
  choice: Sementara itu, orang Filistin
  rationale: Konjungsi menandai peralihan adegan kepada gerakan pasukan Filistin; 'sementara itu' menyampaikan alur paralel secara alami.
- source_word: עָלוּ
  choice: maju
  rationale: Dalam konteks gerakan militer menuju Yizreel, עלה dapat menyatakan maju atau bergerak naik. 'Maju' alami dalam bahasa Indonesia, sementara nuansa harfiah dicatat dalam catatan kaki.
- source_word: יִזְרְעֶאל
  choice: Yizreel
  rationale: Transliterasi Indonesia yang mempertahankan bunyi awal nama Ibrani יִזְרְעֶאל.
