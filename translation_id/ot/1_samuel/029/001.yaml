base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/001.yaml
  text: The Philistines gathered all their camps at Aphek[b][a], while Israel was encamped by the spring that is in Jezreel.
translation:
  language: id
  text: orang Filistin mengumpulkan semua perkemahan mereka[a] di Afek, sedangkan orang Israel berkemah dekat mata air[b] yang ada di Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh pasukan mereka” atau “seluruh bala tentara mereka.” Secara harfiah, “semua perkemahan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pancuran.” Kata Ibrani ini dapat merujuk pada mata air atau pancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: mengumpulkan
  rationale: Bentuk naratif dari קבץ menyatakan tindakan menghimpunkan atau mengumpulkan. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi prosedur militer tertentu.
- source_word: פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: כָּל מַחֲנֵיהֶם
  choice: seluruh pasukan mereka
  rationale: מַחֲנֶה secara harfiah dapat berarti 'perkemahan', tetapi dalam konteks militer bentuk jamaknya juga merujuk pada kelompok-kelompok pasukan. 'Seluruh pasukan mereka' menyampaikan maksud kontekstual secara alami, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: אֲפֵקָה
  choice: di Afek
  rationale: Nama tempat ditransliterasikan sebagai Afek. Akhiran arah pada bahasa Ibrani diterjemahkan secara idiomatis dengan 'di' karena peristiwa pengumpulan dipandang berlangsung di lokasi itu.
- source_word: וְיִשְׂרָאֵל
  choice: sedangkan orang Israel
  rationale: Konjungsi menghubungkan keadaan yang berlangsung serentak dan menampilkan dua kubu yang berhadapan. 'Sedangkan' menyampaikan hubungan tersebut tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: חֹנִים
  choice: berkemah
  rationale: Partisipel ini menggambarkan keadaan Israel yang sedang berkedudukan di perkemahan. 'Berkemah' alami dan sesuai dengan latar militer.
- source_word: בַּעַיִן
  choice: dekat mata air
  rationale: עַיִן dalam keterangan geografis dapat berarti mata air atau pancuran. 'Mata air' merupakan padanan modern yang paling jelas; prefiks ב diterjemahkan 'dekat' sesuai hubungan lokasi.
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: yang ada di Yizreel
  rationale: Klausa relatif ini secara langsung menunjukkan letak mata air tersebut di Yizreel.
