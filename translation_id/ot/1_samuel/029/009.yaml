  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַן אָכִישׁ֮ וַ/יֹּ֣אמֶר אֶל דָּוִד֒ יָדַ֕עְתִּי כִּ֣י ט֥וֹב אַתָּ֛ה בְּ/עֵינַ֖/י כְּ/מַלְאַ֣ךְ אֱלֹהִ֑ים אַ֣ךְ שָׂרֵ֤י פְלִשְׁתִּים֙ אָֽמְר֔וּ לֹֽא יַעֲלֶ֥ה עִמָּ֖/נוּ בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: id
  text: Akhis menjawab dan berkata kepada Daud, “Aku tahu bahwa engkau baik dalam pandanganku, seperti malaikat Allah.[a] Namun, para panglima orang Filistin telah berkata, ‘Ia tidak boleh maju bersama kami ke dalam pertempuran.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Allah.” Kata Ibrani מַלְאָךְ dapat berarti “utusan” atau “malaikat”, meskipun “malaikat Allah” merupakan pengertian yang lebih alami dalam ungkapan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab dan berkata
  rationale: Mempertahankan urutan formula dialog Ibrani secara formal, dan tetap wajar dalam ragam naratif Alkitab berbahasa Indonesia.
- source_word: יָדַעְתִּי
  choice: Aku tahu
  rationale: Bentuk perfektif di sini menyatakan penilaian Akhis yang sudah mantap dan berlaku pada saat ia berbicara.
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: engkau baik dalam pandanganku
  rationale: Mempertahankan idiom evaluatif Ibrani tanpa mempersempit maknanya hanya menjadi kesetiaan, kelayakan, atau perkenanan.
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: seperti malaikat Allah
  rationale: Dalam ungkapan ini, makna makhluk surgawi paling alami, tetapi ambiguitas מַלְאָךְ sebagai 'utusan' dipertahankan dalam catatan kaki.
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pertentangan antara penilaian pribadi Akhis dan keputusan para panglima Filistin.
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: para panglima orang Filistin
  rationale: Dalam konteks pengerahan perang, שָׂרִים menunjuk para pemimpin yang berwenang secara militer; 'panglima' alami dan tepat dalam bahasa Indonesia.
- source_word: לֹא יַעֲלֶה
  choice: Ia tidak boleh maju
  rationale: Imperfek dalam ujaran yang dilaporkan menyampaikan larangan atau keputusan. 'Maju' menangkap gerak ikut dalam ekspedisi militer tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: עִמָּנוּ בַּמִּלְחָמָה
  choice: bersama kami ke dalam pertempuran
  rationale: Menyatakan kebersamaan dan gerak menuju keterlibatan dalam pertempuran, serta mempertahankan nuansa frasa Ibrani.
theological_decisions:
- issue: Makna מַלְאַךְ אֱלֹהִים dalam perbandingan Akhis
  choice: Diterjemahkan 'malaikat Allah' sebagai perbandingan retoris yang menyatakan penghargaan atau kepercayaan yang sangat tinggi.
  alternative: '''utusan Allah'''
  rationale: מַלְאָךְ dapat berarti 'utusan' maupun 'malaikat'. Ungkapan מַלְאַךְ אֱלֹהִים paling alami dipahami sebagai 'malaikat Allah', tetapi perbandingan ini tidak menyatakan bahwa Daud secara ontologis adalah malaikat; alternatif leksikal dicatat agar ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti 'engkau' dan konstruksi 'menjawab dan berkata' mempertahankan corak dialog formal, sedangkan 'para panglima' dan 'maju ... ke dalam pertempuran' menjaga kejelasan konteks militer.
