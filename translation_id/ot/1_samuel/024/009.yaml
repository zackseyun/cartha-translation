  text: וַ/יָּ֨קָם דָּוִ֜ד אַחֲרֵי כֵ֗ן וַ/יֵּצֵא֙ מן ה/מערה וַ/יִּקְרָ֧א אַֽחֲרֵי שָׁא֛וּל לֵ/אמֹ֖ר אֲדֹנִ֣/י הַ/מֶּ֑לֶךְ וַ/יַּבֵּ֤ט שָׁאוּל֙ אַֽחֲרָ֔י/ו וַ/יִּקֹּ֨ד דָּוִ֥ד אַפַּ֛יִם אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: id
  text: Sesudah itu Daud bangkit dan keluar dari gua, lalu berseru memanggil Saul, “Tuanku, Raja!” Ketika Saul menoleh ke belakang, Daud membungkuk dengan mukanya ke tanah dan bersujud[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membungkukkan diri.” Kata Ibrani ini dapat menyatakan sujud sebagai penghormatan atau ketundukan yang mendalam; di sini tindakan itu ditujukan kepada Saul, bukan penyembahan kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Qal wayyiqtol dari קום menyatakan tindakan bangun; “bangkit” sesuai dengan gaya narasi yang wajar dan bermartabat.
- source_word: אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan waktu ini menandai urutan kejadian secara langsung.
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: keluar dari gua
  rationale: יצא berarti keluar; bentuk ini alami dalam bahasa Indonesia dan tidak memaksakan sudut pandang datang atau pergi.
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: berseru kepada Saul dari belakang
  rationale: קרא dengan אַחֲרֵי menggambarkan Daud memanggil Saul yang berada di depannya atau sedang menjauh. Pilihan ini memperjelas hubungan ruang tanpa menambahkan bahwa Saul pasti sedang berjalan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: אֲדֹנִי adalah sapaan hormat kepada penguasa, sedangkan הַמֶּלֶךְ mempertahankan gelar kerajaan; “Tuanku Raja” alami sebagai sapaan langsung.
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: Ketika Saul menoleh ke belakang
  rationale: נבט berarti memandang, dan אַחֲרָיו menunjukkan arah ke belakangnya. “Menoleh” menyampaikan gerakan yang tersirat oleh konteks dengan ringkas.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: membungkuk dengan muka sampai ke tanah
  rationale: קדד menyatakan membungkuk, sementara idiom אַפַּיִם אַרְצָה menggambarkan muka diarahkan sampai ke tanah sebagai penghormatan yang sangat dalam.
- source_word: וַיִּשְׁתָּחוּ
  choice: bersujud
  rationale: Bentuk dari שׁחה ini menyatakan tindakan merendahkan diri atau merebahkan diri dalam penghormatan. “Bersujud” mempertahankan intensitas posturnya dan membedakannya dari tindakan membungkuk sebelumnya.
theological_decisions:
- issue: Makna tindakan Daud di hadapan Saul
  choice: Sujud sebagai penghormatan dan ketundukan yang mendalam kepada raja manusia
  alternative: Menyembah Saul
  rationale: שׁחה dapat merujuk pada sujud kepada Allah maupun penghormatan kepada manusia, bergantung pada konteks. Karena objeknya Saul, terjemahan mempertahankan gerak tubuh yang kuat tanpa menyiratkan bahwa Daud memandang Saul sebagai ilahi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan dua gerak tubuh Ibrani dipertahankan melalui “membungkuk” dan “bersujud”. Sapaan “Tuanku Raja” menyampaikan penghormatan Daud tanpa terdengar kuno secara berlebihan.
