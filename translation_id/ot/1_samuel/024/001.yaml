  text: Kemudian Daud naik dari sana lalu tinggal di kubu-kubu pertahanan di En-Gedi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi ... ke tempat yang lebih tinggi
  rationale: Kata עלה menyatakan gerak naik. Ungkapan ini mempertahankan arah geraknya dalam bahasa Indonesia yang alami, tanpa menyiratkan bahwa Daud memasuki bangunan tertentu.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan deiktis yang langsung, tepat, dan alami bagi מִשָּׁם.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks perpindahan ini, ישב berarti menetap atau berdiam untuk suatu waktu; 'tinggal' tidak harus menyiratkan permukiman permanen.
- source_word: בִּמְצָדוֹת
  choice: di kubu-kubu pertahanan
  rationale: Bentuk jamak מְצָדוֹת menunjuk pada tempat-tempat yang terlindung dan mudah dipertahankan. 'Kubu-kubu pertahanan' mempertahankan gagasan defensif tanpa mengharuskan bangunan benteng formal.
- source_word: עֵין גֶּדִי
  choice: En-Gedi
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
