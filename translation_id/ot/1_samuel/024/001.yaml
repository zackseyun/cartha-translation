  source_fidelity: 'Draf ini pada umumnya setia pada unsur-unsur Ibrani: Daud bergerak dari tempat sebelumnya, kemudian berdiam di lokasi-lokasi defensif En-Gedi. Namun, “pergi ... ke tempat yang lebih tinggi” menguraikan עלה secara lebih bebas dan dapat memberi kesan bahwa tujuan yang dimaksud adalah suatu tempat tinggi yang tidak disebutkan secara eksplisit. “Naik dari sana” lebih langsung mempertahankan arah gerak dalam teks sumber.'
