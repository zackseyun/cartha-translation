  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: id
  text: Daud pun bersumpah kepada Saul. Kemudian Saul pulang ke rumahnya, tetapi Daud dan orang-orangnya naik ke kubu pertahanan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan Daud dan orang-orangnya naik ke kubu pertahanan itu.” Kata penghubung Ibrani berarti “dan”; “tetapi” dalam teks utama memperjelas kontras dalam narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע di sini berarti mengucapkan sumpah; “bersumpah” merupakan padanan langsung dan wajar dalam narasi Indonesia.
- source_word: לְשָׁאוּל
  choice: kepada Saul
  rationale: Preposisi ל menandai orang yang menerima sumpah atau janji Daud; “kepada Saul” alami dalam bahasa Indonesia.
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: Kemudian Saul pulang ke rumahnya
  rationale: ביתו secara harfiah berarti “rumahnya”; dengan verba pergi, “pulang ke rumahnya” menyampaikan gerak menuju kediaman Saul secara alami.
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: tetapi Daud dan orang-orangnya
  rationale: Konjungsi Ibrani secara formal berarti “dan”, tetapi konteks mempertentangkan tujuan Saul dengan tindakan Daud. “Orang-orangnya” sesuai untuk para pengikut Daud tanpa mempersempitnya secara berlebihan.
- source_word: עָלוּ
  choice: naik
  rationale: עלה mempertahankan arah gerak ke atas; “naik” ringkas dan idiomatis.
- source_word: הַמְּצוּדָה
  choice: tempat perlindungan itu
  rationale: מְצוּדָה menunjuk tempat pertahanan atau perlindungan yang kuat. Dalam konteks pelarian Daud di daerah liar, “tempat perlindungan” jelas dan alami, sementara artikel tertentu diterjemahkan dengan “itu”.
