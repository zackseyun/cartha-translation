  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֣ר יֹאמַ֗ר מְשַׁל֙ הַ/קַּדְמֹנִ֔י מֵ/רְשָׁעִ֖ים יֵ֣צֵא רֶ֑שַׁע וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/014.yaml
  text: As the ancient proverb says[a], ‘Wickedness comes out from the wicked,’ but my hand will not be against you.
translation:
  language: id
  text: Seperti kata peribahasa kuno[a], “Kefasikan berasal dari orang fasik.” Namun, tanganku tidak akan melawan engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seperti kata peribahasa orang-orang zaman dahulu.” Kata sifat Ibrani dapat dipahami sebagai “kuno” atau sebagai sebutan bagi “orang-orang zaman dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Seperti
  rationale: Memperkenalkan kutipan pembanding secara alami dan ringkas dalam bahasa Indonesia.
- source_word: יֹאמַר
  choice: kata
  rationale: Bentuk imperfek berfungsi secara umum dalam rumus pengutipan; ungkapan Indonesia 'seperti kata peribahasa' menyampaikan sifatnya yang tetap berlaku.
- source_word: מְשַׁל
  choice: peribahasa
  rationale: Dalam konteks ini menunjuk pada pepatah hikmat tradisional yang singkat, bukan perumpamaan panjang.
- source_word: הַקַּדְמֹנִי
  choice: kuno
  rationale: Dapat menerangkan peribahasa sebagai berasal dari zaman dahulu; kemungkinan bahwa kata ini merujuk kepada 'orang-orang zaman dahulu' dipertahankan dalam catatan kaki.
- source_word: מֵרְשָׁעִים
  choice: dari orang fasik
  rationale: Preposisi מִן menandai sumber, sedangkan bentuk jamak menyebut golongan orang yang fasik.
- source_word: יֵצֵא רֶשַׁע
  choice: Kefasikan berasal
  rationale: Menyampaikan gagasan bahwa kefasikan keluar atau timbul dari sumbernya, sekaligus mempertahankan hubungan leksikal רֶשַׁע dengan רְשָׁעִים melalui 'kefasikan/fasik'.
- source_word: וְיָדִי
  choice: Namun, tanganku
  rationale: Konjungsi dipahami secara adversatif karena tindakan Daud dikontraskan dengan isi peribahasa; metafora 'tangan' dipertahankan.
- source_word: לֹא תִהְיֶה בָּךְ
  choice: tidak akan melawan engkau
  rationale: Secara harfiah tangan Daud tidak akan berada pada/terhadap Saul; 'melawan' menjelaskan arah permusuhan tanpa menghapus metafora tangan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Fasik/kefasikan' mempertahankan permainan kata Ibrani dan kategori moral teks; 'engkau' sesuai dengan tuturan langsung bernuansa sastra. Metafora 'tanganku' tetap dipertahankan.
