  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: id
  text: Sebab, apabila seseorang mendapati musuhnya, apakah ia akan membiarkannya pergi dengan selamat?[a] Kiranya Yahweh[b] membalasmu dengan kebaikan atas apa yang kaulakukan kepadaku hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “di jalan yang baik.” Klausa ini juga dapat dibaca sebagai pernyataan: “dan membiarkannya pergi dengan selamat.”'
    reason: Frasa Ibrani menyiratkan pelepasan yang aman, sedangkan tidak adanya partikel tanya eksplisit memungkinkan pembacaan deklaratif selain pertanyaan retoris.
  - marker: b
    text: Atau, “Yahweh akan membalasmu dengan kebaikan.”
    reason: Bentuk verba Ibrani dapat dipahami sebagai harapan atau berkat maupun sebagai pernyataan tentang apa yang akan terjadi.
lexical_decisions:
- source_word: וְכִי
  choice: Sebab, jika
  rationale: Gabungan ini menghubungkan ucapan Saul dengan alasan sebelumnya sekaligus memperkenalkan keadaan umum yang bernuansa retoris.
- source_word: יִמְצָא אִישׁ
  choice: seseorang mendapati
  rationale: אִישׁ berbentuk maskulin tunggal tetapi berfungsi generik. 'Seseorang' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa mengubah cakupannya.
- source_word: אֶת אֹיְבוֹ
  choice: musuhnya
  rationale: Padanan langsung dan wajar bagi nomina 'musuh' dengan sufiks orang ketiga maskulin tunggal.
- source_word: וְשִׁלְּחוֹ
  choice: apakah ia akan membiarkannya pergi
  rationale: Dalam konteks ini verba tersebut berarti melepaskan orang yang berada dalam kuasanya. Bentuk pertanyaan retoris membuat maksud ucapan Saul alami dalam bahasa Indonesia.
- source_word: בְּדֶרֶךְ טוֹבָה
  choice: dengan selamat
  rationale: Secara harfiah frasa ini berarti 'di jalan yang baik', tetapi dalam konteks menyatakan bahwa musuh itu dilepas tanpa dicelakakan. Alternatif harfiah dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: Kiranya Yahweh membalasmu dengan kebaikan
  rationale: Yiqtol dalam ucapan Saul dapat dipahami sebagai doa atau berkat. 'Membalasmu dengan kebaikan' mempertahankan gagasan pembalasan yang sepadan dan nilai positif טוֹבָה.
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: atas apa yang kaulakukan kepadaku hari ini
  rationale: Susunan ini menyampaikan hubungan balasan yang diungkapkan תַּחַת secara idiomatis, sambil mempertahankan waktu dan Saul sebagai penerima tindakan Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; transliterasi mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya ujar יְשַׁלֶּמְךָ
  choice: Kiranya Yahweh membalasmu
  alternative: Yahweh akan membalasmu
  rationale: Dalam konteks ucapan Saul, bentuk ini wajar dipahami sebagai harapan atau berkat, tetapi bentuk Ibrani juga dapat didengar sebagai pernyataan prediktif; alternatif itu dipertahankan dalam catatan kaki.
- issue: Bentuk generik אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, pemakaiannya bersifat umum. Bahasa Indonesia secara alami memakai 'seseorang' untuk fungsi generik ini.
- issue: Bentuk retoris klausa pertama
  choice: apakah ia akan membiarkannya pergi
  alternative: ia membiarkannya pergi
  rationale: 'Konteks mendukung pertanyaan retoris: orang biasanya tidak melepaskan musuhnya tanpa mencelakakannya. Karena bahasa Ibrani tidak memakai partikel tanya eksplisit, pembacaan deklaratif tetap mungkin dan dicatat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk 'kaulakukan' mempertahankan sapaan tunggal dan memberi aliran yang ringkas. Pertanyaan retoris dipakai agar hubungan logis ucapan Saul jelas, sementara ambiguitas sintaksis dan nuansa verba dicatat tanpa dipaksakan.
