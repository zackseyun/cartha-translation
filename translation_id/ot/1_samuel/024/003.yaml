base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: id
  text: Lalu Saul membawa tiga ribu orang pilihan dari seluruh Israel dan pergi mencari Daud serta orang-orangnya di depan tebing-tebing kambing liar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tebing-tebing kambing liar”; hewan yang dimaksud mungkin lebih khusus adalah ibeks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks pengerahan pasukan, לקח berarti Saul membawa atau mengikutsertakan orang-orang itu dalam ekspedisinya; 'membawa' alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak tersurat.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: tiga ribu orang
  rationale: Ungkapan ini menghitung orang dengan bentuk yang lazim dalam bahasa Ibrani; 'tiga ribu orang' tepat dan alami.
- source_word: בָּחוּר
  choice: pilihan
  rationale: Di sini kata ini menunjuk kepada orang-orang yang dipilih atau unggul, khususnya dalam konteks militer.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dari seluruh Israel
  rationale: Menunjukkan bahwa pasukan itu dipilih dari segenap Israel.
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: pergi mencari
  rationale: Infinitif menyatakan tujuan; ungkapan ini mempertahankan struktur dan maksud pengejaran Saul secara alami.
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: Daud serta orang-orangnya
  rationale: Merujuk secara langsung kepada Daud dan para pengikutnya; 'serta' memperjelas bahwa keduanya menjadi sasaran pencarian.
- source_word: עַל פְּנֵי
  choice: di dekat
  rationale: Ungkapan ruang ini dapat berarti di hadapan, di depan, atau pada kawasan sekitar suatu bentang alam. Dalam konteks pencarian di daerah tebing, 'di dekat' alami dan tidak memaksakan gambaran geometris yang terlalu sempit.
- source_word: צוּרֵי הַיְּעֵלִים
  choice: Tebing Kambing Hutan
  rationale: צוּרֵי menunjuk tebing atau cadas, sedangkan יְעֵלִים adalah kambing liar, kemungkinan lebih khusus ibeks. Kapitalisasi memperlakukan ungkapan tersebut sebagai penanda tempat dalam narasi.
