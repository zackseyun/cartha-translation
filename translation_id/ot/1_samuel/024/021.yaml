  text: And now, look, I know that you will surely reign, and the kingdom of Israel will be established in your hand.
translation:
  language: id
  text: Sekarang, lihatlah, aku tahu bahwa engkau pasti akan memerintah sebagai raja dan bahwa kerajaan Israel akan kokoh dalam tanganmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dalam ucapan Saul secara alami; unsur penghubung waw dapat tersirat dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan penanda perhatian yang eksplisit dan sesuai dengan nada pengakuan langsung Saul.
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: engkau pasti akan menjadi raja
  rationale: Infinitif absolut bersama verba finit memberi penegasan kuat; bentuk ini menyampaikan kepastian tanpa terdengar janggal.
- source_word: וְקָמָה
  choice: dan ... akan diteguhkan
  rationale: Dalam konteks kerajaan, קום menyatakan berdiri kokoh atau menjadi mantap; bentuk pasif Indonesia mengungkap hasil peneguhan dengan wajar.
- source_word: בְּיָדְךָ
  choice: dalam tanganmu
  rationale: Mempertahankan metafora Ibrani tentang kuasa atau kendali karena jelas dan lazim dipahami dalam ragam Alkitabiah Indonesia.
- source_word: מַמְלֶכֶת יִשְׂרָאֵל
  choice: kerajaan Israel
  rationale: Padanan langsung dan baku yang mempertahankan rujukan politis-teologis teks.
theological_decisions:
- issue: Kepastian pemerintahan Daud
  choice: pasti akan menjadi raja
  alternative: sungguh akan memerintah
  rationale: Konstruksi Ibrani menegaskan kepastian. Pilihan ini tidak menambahkan alasan teologis yang tidak dinyatakan dalam ayat.
- issue: Kemantapan kerajaan di bawah Daud
  choice: kerajaan Israel akan diteguhkan dalam tanganmu
  alternative: kerajaan Israel akan berdiri kokoh di bawah kekuasaanmu
  rationale: Mempertahankan metafora 'tangan' dan nuansa pasif/hasil dari וְקָמָה tanpa menentukan secara eksplisit siapa pelaku peneguhan itu.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kata 'lihatlah' mempertahankan seruan perhatian, sedangkan 'dalam tanganmu' sengaja mempertahankan metafora sumber.
