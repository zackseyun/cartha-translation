base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: id
  text: Lalu ia berkata kepada orang-orangnya[a], “Kiranya Yahweh menjauhkan aku dari melakukan hal ini terhadap tuanku, orang yang diurapi Yahweh, dengan mengulurkan tanganku terhadapnya, sebab dialah orang yang diurapi Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih tradisional, “Yahweh kiranya melarang aku melakukan ini.” Ungkapan Ibrani ini menyatakan penolakan yang sangat kuat terhadap tindakan tersebut dalam kaitannya dengan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: Kiranya aku dijauhkan oleh Yahweh
  rationale: Ungkapan Ibrani ini menyatakan penolakan yang sangat kuat dan mengaitkannya dengan Yahweh. Rumusan ini alami dalam bahasa Indonesia serta mempertahankan Yahweh sebagai dasar penolakan, tanpa memaksakan nuansa spasial harfiah dari מִן.
- source_word: אִם אֶעֱשֶׂה
  choice: dari melakukan
  rationale: Sesudah חָלִילָה, אִם merupakan bagian dari konstruksi idiomatis yang menolak keras tindakan tersebut, bukan syarat biasa. Bahasa Indonesia paling alami mengungkapkannya dengan 'dijauhkan ... dari melakukan'.
- source_word: הַדָּבָר הַזֶּה
  choice: hal seperti ini
  rationale: דָּבָר menunjuk pada tindakan yang sedang dipertimbangkan. 'Hal seperti ini' mempertahankan keluasan istilah Ibrani dan terdengar wajar dalam konteks.
- source_word: לַאדֹנִי
  choice: terhadap tuanku
  rationale: אָדוֹן dengan sufiks orang pertama tunggal adalah sapaan hormat Daud bagi Saul. 'Tuanku' mempertahankan sikap hormat itu.
- source_word: לִמְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: מָשִׁיחַ di sini menunjuk kepada Saul sebagai raja yang telah diurapi Yahweh. Rumusan ini mempertahankan makna tindakan pengurapan tanpa memasukkan asosiasi kristologis yang belum dituntut konteks.
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: dengan mengulurkan tanganku untuk melawannya
  rationale: Terjemahan ini mempertahankan citra harfiah mengulurkan tangan sekaligus menyampaikan arah bermusuhan dari idiom tersebut tanpa mempersempitnya menjadi tindakan tertentu seperti membunuh.
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: sebab dialah orang yang diurapi Yahweh
  rationale: כִּי memberikan alasan bagi penolakan Daud. Pengulangan gelar tersebut mengikuti penekanan teks Ibrani, sedangkan 'dialah' mencerminkan penegasan pada הוּא.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai 'Yahweh' untuk mempertahankan nama pribadi yang terdapat dalam teks sumber, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Makna מְשִׁיחַ ketika diterapkan kepada Saul
  choice: orang yang diurapi Yahweh
  alternative: Mesias Yahweh
  rationale: Dalam konteks ini istilah tersebut menyatakan kedudukan Saul sebagai raja yang ditahbiskan melalui pengurapan. 'Mesias Yahweh' dapat menimbulkan asosiasi kristologis anakronistis, sedangkan 'orang yang diurapi Yahweh' mempertahankan makna kerajaan dan sakralnya.
- issue: Peran Yahweh dalam ungkapan חָלִילָה לִּי מֵיְהוָה
  choice: Yahweh dipahami sebagai dasar dan pelaku yang menjauhkan Daud dari tindakan itu
  alternative: Semoga Yahweh melarang aku
  rationale: Konstruksi Ibrani mengandung ungkapan penolakan kuat yang hubungannya dengan Yahweh sukar dipindahkan secara persis. Terjemahan utama mempertahankan kaitan itu tanpa menyatakan bahwa teks memakai verba eksplisit 'melarang'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai dalam narasi, 'tuanku' mempertahankan penghormatan Daud kepada Saul, dan pengulangan 'orang yang diurapi Yahweh' dipertahankan demi penekanan teks sumber.
