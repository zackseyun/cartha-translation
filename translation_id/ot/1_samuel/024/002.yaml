base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/002.yaml
  text: When Saul returned from pursuing the Philistines, they told him, saying, “Look, David is in the wilderness of En-gedi.”
translation:
  language: id
  text: Ketika Saul kembali setelah mengejar orang Filistin, orang-orang memberitahukan kepadanya, “Lihat, Daud ada di padang gurun En-Gedi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאַחֲרֵי פְּלִשְׁתִּים
  choice: setelah mengejar orang Filistin
  rationale: Ungkapan harfiah 'dari belakang orang Filistin' dalam konteks ini berarti kembali dari tindakan mengejar mereka; bentuk ini alami dalam bahasa Indonesia.
- source_word: וַיַּגִּדוּ לוֹ
  choice: orang memberi tahu dia
  rationale: Subjek verba berbentuk jamak tidak disebutkan. 'Orang' mempertahankan ketidakjelasan identitas para pemberi kabar tanpa menambahkan pelaku tertentu.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dari partikel Ibrani dengan ungkapan Indonesia yang langsung dan wajar.
- source_word: בְּמִדְבַּר עֵין גֶּדִי
  choice: di padang gurun En-Gedi
  rationale: מִדְבָּר menunjuk kawasan liar atau tandus, dan 'padang gurun' merupakan padanan Alkitabiah Indonesia yang jelas; nama tempat ditransliterasikan sebagai En-Gedi.
