translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan narasi dipertahankan, sedangkan formula לֵאמֹר tidak diterjemahkan secara kaku karena kutipan langsung sudah menyampaikan fungsinya secara alami.
