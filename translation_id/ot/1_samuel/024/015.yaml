  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk “engkau” dipakai karena Daud berbicara langsung kepada raja, sedangkan susunan pertanyaan dan dua gambaran penutup mempertahankan ironi serta perendahan diri dalam teks Ibrani.
