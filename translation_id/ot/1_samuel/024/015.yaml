base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: id
  text: Untuk mengejar siapakah raja Israel keluar?[a] Untuk mengejar siapakah engkau? Untuk mengejar seekor anjing mati, untuk mengejar seekor kutu saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Di belakang/setelah siapakah raja Israel keluar?” Kata Ibrani yang berarti “di belakang/setelah” diulang empat kali dalam ayat ini; dalam konteks ini kata tersebut menyatakan sasaran pengejaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: untuk mengejar siapakah
  rationale: אַחֲרֵי secara harfiah berarti “di belakang/setelah,” tetapi dalam konteks ini menunjuk pada sasaran pengejaran. Ungkapan “untuk mengejar siapakah” alami dalam bahasa Indonesia dan mempertahankan pertanyaan retoris.
- source_word: יָצָא
  choice: keluar
  rationale: Kata kerja ini berarti “keluar/pergi keluar” dan di sini menggambarkan raja yang berangkat dalam suatu pengejaran atau operasi.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: raja Israel
  rationale: Terjemahan langsung ini mempertahankan gelar yang resmi dan kontras ironis antara kedudukan Saul dan remehnya sasaran yang dikejarnya.
- source_word: אַתָּה רֹדֵף
  choice: sedang engkau kejar
  rationale: רֹדֵף menyatakan pengejaran yang sedang berlangsung dan bersifat bermusuhan. Susunan dengan “engkau” mempertahankan nada langsung dan khidmat.
- source_word: כֶּלֶב מֵת
  choice: seekor anjing mati
  rationale: Terjemahan harfiah ini mempertahankan ungkapan perendahan diri Daud dan daya retoris gambarnya.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: seekor kutu saja
  rationale: אֶחָד menekankan bahwa sasarannya hanya satu dan sama sekali tidak berarti. Kata “saja” menyampaikan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: untuk mengejar ... kejar ... [objek pengejaran tersirat]
  rationale: Bahasa Ibrani mengulang אַחֲרֵי empat kali. Karena pengulangan harfiah “di belakang” tidak alami dengan semua objek dalam bahasa Indonesia, makna pengejaran dinyatakan secara eksplisit dalam dua pertanyaan dan tetap tersirat dalam dua jawaban eliptis.
