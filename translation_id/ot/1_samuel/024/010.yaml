  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: id
  text: Lalu Daud berkata kepada Saul, “Mengapa engkau mendengarkan perkataan seseorang[a] yang berkata, ‘Lihat, Daud sedang berusaha mencelakakanmu[b]?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkataan manusia.” Kata Ibrani berbentuk tunggal dan dapat dipakai dalam arti umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Lihat, Daud sedang mengusahakan keburukan terhadapmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw konsekutif melanjutkan rangkaian peristiwa; “Lalu” menyampaikan gerak narasi secara alami dalam bahasa Indonesia.
- source_word: לְשָׁאוּל
  choice: kepada Saul
  rationale: Preposisi ל menandai orang yang menjadi tujuan perkataan Daud; “Saul” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya yang meminta alasan.
- source_word: תִשְׁמַע
  choice: engkau mendengarkan
  rationale: Dalam konteks ini שׁמע berarti memberi perhatian atau mengindahkan, bukan sekadar mendengar bunyi. “Engkau” mempertahankan sapaan tunggal dan sesuai dengan ragam Alkitab yang bermartabat.
- source_word: אֶת דִּבְרֵי אָדָם
  choice: perkataan seseorang
  rationale: אָדָם berbentuk tunggal tak tentu. “Seseorang” mempertahankan ketaktentuan dan jumlah tunggal tanpa memaksakan identitas atau jenis kelamin si penuduh.
- source_word: לֵאמֹר
  choice: yang berkata
  rationale: Infinitif ini memperkenalkan isi perkataan. Klausa relatif menghasilkan bahasa Indonesia yang alami setelah “perkataan seseorang”.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian kepada tuduhan yang menyusul; “Lihat” merupakan padanan modern dan langsung.
- source_word: מְבַקֵּשׁ
  choice: sedang berusaha
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung atau menjadi kecenderungan; “sedang berusaha” menyampaikan aspek tersebut secara alami.
- source_word: רָעָתֶךָ
  choice: mencelakakanmu
  rationale: רָעָה di sini menunjuk pada bahaya atau kemalangan yang dituduhkan hendak didatangkan kepada Saul. Bentuk verbal ini lebih alami dalam bahasa Indonesia daripada frasa nominal harfiah.
theological_decisions:
- issue: Makna dan jumlah אָדָם
  choice: seseorang
  alternative: manusia; orang-orang; seorang laki-laki
  rationale: Bentuk Ibrani adalah tunggal dan dapat bersifat umum. Konteks memungkinkan seorang penuduh tertentu atau seorang penuduh sebagai tipe, sehingga “seseorang” menjaga jumlah tunggal sekaligus tidak menentukan lebih jauh daripada teks.
- issue: Nuansa רָעָתֶךָ
  choice: mencelakakanmu
  alternative: mencari kejahatan terhadapmu; menginginkan keburukan bagimu
  rationale: Konteksnya adalah tuduhan bahwa Daud berniat mendatangkan bahaya kepada Saul. Pilihan ini menyampaikan maksud kontekstual tanpa menetapkan bahwa רָעָה hanya bermakna moral atau hanya bermakna penderitaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” dipakai untuk mempertahankan orang kedua tunggal dalam wacana langsung. Susunan kalimat dibuat alami tanpa menghilangkan bentuk tunggal אָדָם atau aspek partisipel מְבַקֵּשׁ.
