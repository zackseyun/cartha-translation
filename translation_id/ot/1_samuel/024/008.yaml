  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: id
  text: Daud menahan orang-orangnya dengan kata-kata dan tidak membiarkan mereka bangkit melawan Saul.[a] Saul pun bangkit dari gua itu lalu pergi meneruskan perjalanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Daud menegur orang-orangnya dengan keras dengan kata-kata.” Kata kerja Ibrani yang digunakan di sini jarang dan mungkin mengandung arti yang lebih kuat daripada sekadar menahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: menahan
  rationale: Kata kerja Ibrani ini jarang dan sulit ditafsirkan. Dalam konteksnya, Daud dengan tegas mencegah anak buahnya bertindak terhadap Saul. “Menahan” menyampaikan hasil tindakan itu tanpa memaksakan gambaran harfiah yang tidak pasti; nuansa yang lebih keras dicatat dalam catatan kaki.
- source_word: אֲנָשָׁיו
  choice: orang-orangnya
  rationale: Ungkapan ini menunjuk kepada para pengikut Daud yang berada bersamanya; “orang-orangnya” alami dan tepat dalam narasi Indonesia.
- source_word: בַּדְּבָרִים
  choice: dengan kata-kata
  rationale: Frasa ini menyatakan sarana yang dipakai Daud untuk menahan mereka, yakni campur tangan secara lisan, serta mempertahankan bentuk eksplisit teks Ibrani.
- source_word: וְלֹא נְתָנָם
  choice: dan tidak membiarkan mereka
  rationale: Konstruksi נתן dengan bentuk infinitif menyatakan izin; “tidak membiarkan mereka” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: bangkit melawan Saul
  rationale: Dalam konteks yang bersifat bermusuhan, קום dengan אֶל menunjuk pada tindakan terhadap Saul. “Bangkit melawan” mempertahankan citra verbal Ibrani dan tidak mempersempitnya menjadi tindakan menyerang secara khusus.
- source_word: קָם מֵהַמְּעָרָה
  choice: keluar dari gua itu
  rationale: Secara harfiah Saul “bangkit dari gua,” tetapi dalam bahasa Indonesia konteks gerak ini paling alami dinyatakan sebagai “keluar dari gua itu.” Pengulangan akar קום tidak dipertahankan karena hasil literalnya akan terasa janggal.
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: melanjutkan perjalanannya
  rationale: Ungkapan Ibrani secara harfiah berarti pergi di jalan; dalam narasi, “melanjutkan perjalanannya” secara alami menyampaikan bahwa Saul pergi meneruskan langkahnya.
