  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: id
  text: 'Hari ini engkau telah menunjukkan kebaikan yang kaulakukan kepadaku: ketika Yahweh menyerahkan aku ke dalam tanganmu,[a] engkau tidak membunuhku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyerahkan aku ke dalam kuasamu.” Secara harfiah: “menyerahkan aku ke dalam tanganmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: telah menyatakan
  rationale: Bentuk Hifil dari נגד berarti “memberitahukan, menyatakan, membuat diketahui.” “Telah menyatakan” mempertahankan unsur pengungkapan, sekaligus dapat mencakup bukti melalui tindakan David.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan temporal yang jelas dan wajar dalam bahasa Indonesia bermartabat.
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: kebaikan yang kaulakukan kepadaku
  rationale: Mencerminkan secara dekat ungkapan harfiah “kebaikan yang engkau lakukan terhadap/kepadaku” tanpa mempersempitnya menjadi sifat atau motif tertentu.
- source_word: סִגְּרַנִי
  choice: menyerahkan aku
  rationale: Dalam konteks ini סגר berarti menempatkan seseorang dalam kuasa pihak lain, yakni “menyerahkan” atau “menyerahkan ke dalam tangan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: בְּיָדְךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan metafora Ibrani tentang berada dalam kuasa seseorang; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: engkau tidak membunuhku
  rationale: Padanan langsung, jelas, dan modern bagi verba הרג yang dinegasikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar; “Yahweh” mempertahankan pembedaan tersebut tanpa memasukkan penafsiran denominasi.
- issue: Peran Yahweh dalam penyerahan Saul
  choice: ketika Yahweh menyerahkan aku ke dalam tanganmu
  alternative: ketika Yahweh membuat aku jatuh ke dalam tanganmu
  rationale: Terjemahan mempertahankan pernyataan langsung Saul bahwa Yahweh menempatkannya dalam kuasa David, tanpa menjelaskan lebih jauh sifat penyelenggaraan ilahi itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat “kaulakukan” digunakan secara baku; metafora “ke dalam tanganmu” dipertahankan karena penting bagi citra teks Ibrani dan dijelaskan dalam catatan kaki.
