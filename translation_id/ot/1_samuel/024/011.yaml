id: 1SA.24.11
reference: 1 Samuel 24:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: id
  text: Lihatlah, pada hari ini matamu sendiri telah melihat bahwa Yahweh menyerahkan engkau ke dalam tanganku di dalam gua. Ada yang berkata agar aku membunuhmu[a], tetapi aku membiarkanmu hidup[b]. Aku berkata, ‘Aku tidak akan mengulurkan tanganku untuk melawan tuanku, sebab dialah orang yang diurapi Yahweh.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan dia berkata untuk membunuhmu.” Subjek verba tunggal dalam bahasa Ibrani tidak disebutkan. Karena itu, ungkapan ini juga dapat dipahami sebagai “dan dikatakan agar aku membunuhmu” atau, menurut pembacaan lain, “dan aku berkata hendak membunuhmu.”
    reason: alternative_reading
  - marker: b
    text: Atau, “tetapi aku mengasihani engkau.” Verba Ibrani dapat menyatakan tindakan membiarkan hidup karena belas kasihan. Bentuk verbanya bukan orang pertama; subjek yang tersirat tidak dinyatakan dengan jelas dalam teks.
    reason: lexical_and_grammatical_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata seru ini mengarahkan perhatian dengan tegas; “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya deiktisnya.
- source_word: רָאוּ עֵינֶיךָ
  choice: matamu sendiri telah melihat
  rationale: Mempertahankan ungkapan Ibrani yang menampilkan mata sebagai saksi sekaligus menyampaikan penekanan bahwa Saul menyaksikannya sendiri.
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: Yahweh menyerahkan engkau ke dalam tanganku
  rationale: Gabungan נתן dan “ke dalam tanganku” menyatakan penyerahan seseorang ke dalam kuasa orang lain. “Menyerahkan” menyampaikan makna kontekstual itu secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan membedakannya dari gelar umum “Tuhan”.
- source_word: בַּמְּעָרָה
  choice: di dalam gua
  rationale: Padanan lokatif langsung dan alami.
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: Ada yang berkata agar aku membunuhmu
  rationale: Verba tunggal maskulin tidak memiliki subjek yang disebutkan. Subjek tak tentu “ada yang” mempertahankan ketidakjelasan pelaku tanpa mengubah bentuk Ibrani menjadi orang pertama.
- source_word: וַתָּחָס עָלֶיךָ
  choice: tetapi aku membiarkanmu hidup
  rationale: Dalam konteks ini verba חוס menyatakan tindakan tidak membunuh atau menyayangkan nyawa. Bentuk Indonesia ini jelas dan alami, sementara persoalan subjek serta nuansa belas kasihan dijelaskan dalam catatan.
- source_word: לֹא אֶשְׁלַח יָדִי בַּאדֹנִי
  choice: Aku tidak akan mengulurkan tanganku untuk melawan tuanku
  rationale: Mempertahankan citra idiom Ibrani tentang tindakan bermusuhan, dengan “untuk melawan” agar maknanya jelas dalam bahasa Indonesia.
- source_word: מְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: Dalam narasi ini frasa tersebut menunjuk kepada raja yang telah ditahbiskan, bukan langsung kepada gelar eskatologis “Mesias”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna מְשִׁיחַ יְהוָה dalam narasi kerajaan
  choice: orang yang diurapi Yahweh
  alternative: Mesias Yahweh
  rationale: Acuan langsungnya ialah Saul sebagai raja yang diurapi. Pilihan ini mempertahankan makna pengurapan kerajaan tanpa memasukkan pengertian mesianik eskatologis yang tidak dinyatakan secara langsung di sini.
- issue: Subjek וְאָמַר לַהֲרָגֲךָ
  choice: 'subjek tak tentu: “Ada yang berkata”'
  alternative: “aku berkata”; “dia berkata”; “dikatakan”
  rationale: Teks Masoret memakai verba orang ketiga tunggal tanpa subjek eksplisit. Terjemahan utama tidak menetapkan identitas penuturnya, dan catatan mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pronomina “engkau” dan “-mu” mempertahankan suasana tutur langsung yang khidmat; “tuanku” menyatakan penghormatan David kepada Saul sebagai atasannya. Penanda catatan ditempatkan tepat pada klausa yang diterangkannya.
