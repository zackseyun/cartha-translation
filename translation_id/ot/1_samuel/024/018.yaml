source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: id
  text: Lalu ia berkata kepada Daud, “Engkau lebih benar daripada aku,[a] sebab engkau membalas aku dengan kebaikan, sedangkan aku membalasmu dengan kejahatan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau lebih berada di pihak yang benar daripada aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל דָּוִד
  choice: Lalu ia berkata kepada Daud
  rationale: Bentuk wayyiqtol naratif diterjemahkan secara wajar dengan “Lalu ... berkata”; pronomina “ia” dipertahankan karena klausa Ibrani tidak menyebut nama Saul.
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: Engkau lebih benar daripada aku
  rationale: צַדִּיק dalam konstruksi perbandingan dapat berarti benar secara moral atau berada di pihak yang benar. “Lebih benar” alami dalam bahasa Indonesia serta mempertahankan keluasan maknanya.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi pengakuan sebelumnya; “sebab” sesuai dengan ragam bahasa yang bermartabat dan tetap mudah dipahami.
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: engkau membalas aku dengan kebaikan
  rationale: גמל dapat menyatakan memperlakukan atau membalas seseorang. “Membalas ... dengan” mempertahankan gagasan timbal balik dan paralelisme dengan klausa berikutnya, sedangkan “kebaikan” mempertahankan kontras moral dengan “kejahatan”.
- source_word: וַאֲנִי
  choice: sedangkan aku
  rationale: Kata sambung dasar ו memperoleh fungsi kontras dalam susunan paralel ini; “sedangkan” mengungkapkannya secara alami tanpa menambah isi.
- source_word: גְּמַלְתִּיךָ הָרָעָה
  choice: aku membalasmu dengan kejahatan
  rationale: Pengulangan verba “membalas” mencerminkan pengulangan גמל dalam bahasa Ibrani. “Kejahatan” mempertahankan dimensi moral רָעָה dan antitesisnya dengan הַטּוֹבָה.
theological_decisions:
- issue: Cakupan makna צַדִּיק
  choice: lebih benar daripada aku
  alternative: lebih berada di pihak yang benar daripada aku
  rationale: Terjemahan utama mempertahankan nuansa moral kata tersebut tanpa menutup kemungkinan bahwa Saul juga sedang mengakui bahwa Daud berada di pihak yang benar; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “engkau” dipakai sesuai dialog Alkitabiah yang akrab namun tetap luhur; struktur paralel “membalas ... dengan kebaikan/kejahatan” dipertahankan.
