base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: id
  text: Setelah Daud selesai menyampaikan perkataan itu kepada Saul, Saul berkata, “Apakah itu suaramu, anakku Daud?” Lalu Saul mengangkat suaranya dan menangis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Setelah ... selesai
  rationale: Konstruksi temporal ini menandai selesainya tindakan Daud sebelum respons Saul; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: לְדַבֵּר אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: menyampaikan semua perkataan itu
  rationale: Dalam konteks tuturan, דְּבָרִים menunjuk pada perkataan yang baru diucapkan. 'Menyampaikan' mengungkapkan tindakan berbicara kepada Saul secara alami, sedangkan 'semua' menyatakan cakupan demonstratif jamak dalam idiom Indonesia.
- source_word: הֲקוֹלְךָ זֶה
  choice: Apakah itu suaramu
  rationale: קוֹל berarti 'suara' dalam pertanyaan pengenalan ini. Walaupun זֶה secara harfiah dekat dengan 'ini', bahasa Indonesia lazim memakai 'itu' ketika mengenali suara yang didengar.
- source_word: בְּנִי דָוִד
  choice: anakku Daud
  rationale: Mempertahankan sapaan filial Saul dengan susunan yang alami dan penuh emosi dalam bahasa Indonesia.
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ
  choice: Lalu Saul menangis dengan suara keras
  rationale: Idiom harfiah 'mengangkat suaranya lalu menangis' menyatakan tangisan yang terdengar keras. Padanan ini alami dalam bahasa Indonesia dan mempertahankan intensitas emosinya tanpa menyiratkan bahwa Saul terlebih dahulu berpidato atau berteriak.
theological_decisions:
- issue: Sapaan Saul 'anakku Daud'
  choice: Dipertahankan sebagai bahasa relasional dan retoris.
  alternative: Menafsirkannya semata-mata sebagai gelar politik yang menunjukkan perkenanan atau hubungan patronase.
  rationale: Bahasa Ibrani secara jelas memakai istilah filial. Terjemahan mempertahankan nuansa emosional dan sosialnya tanpa menjadikannya pernyataan tentang hubungan anak kandung atau memasukkan makna doktrinal.
translation_notes:
  register: Narasi memakai bahasa Indonesia modern yang wajar, jelas, dan bermartabat. Ungkapan tangisan diterjemahkan secara idiomatis agar tidak terasa kaku, sedangkan sapaan emosional Saul dipertahankan.
