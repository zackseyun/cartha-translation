base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/006.yaml
  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: id
  text: Sesudah itu, hati Daud menegurnya[a] karena ia telah memotong ujung jubah Saul.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hati Daud memukulnya,” suatu ungkapan yang menggambarkan batin atau hati nurani yang terganggu.'
    reason: lexical_alternative
  - marker: b
    text: Atau “tepi” atau “kelim jubah Saul.” Kata Ibrani yang diterjemahkan “ujung” dapat menunjuk bagian terluar suatu pakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Penanda urutan ini menghubungkan reaksi Daud dengan tindakan sebelumnya. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan makna waktunya tanpa meniru rumus naratif Ibrani secara kaku.
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: hati Daud menegurnya
  rationale: Secara harfiah, hati Daud 'memukul' dia. 'Menegurnya' mempertahankan hati sebagai pelaku sekaligus menyampaikan fungsi idiom tersebut—pergolakan batin atau hati nurani yang menuduh—dalam bahasa Indonesia yang alami. Gambaran harfiahnya dijelaskan dalam catatan kaki.
- source_word: לֵב
  choice: hati
  rationale: '''Hati'' mempertahankan istilah konkret Ibrani yang mencakup batin dan kesadaran moral; menggantinya dengan ''hati nurani'' akan mempersempit makna secara interpretatif.'
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Konstruksi ini menyatakan alasan bagi teguran batin Daud. 'Karena' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: כָּרַת
  choice: telah memotong
  rationale: Verba ini berarti memotong atau memotong lepas. Bentuk 'telah memotong' memperjelas bahwa tindakan itu terjadi sebelum reaksi batin Daud.
- source_word: כָּנָף
  choice: ujung
  rationale: Kata ini secara dasar berarti 'sayap' dan dapat menunjuk bagian terluar pakaian, seperti ujung, tepi, atau sudut. 'Ujung' alami dan tidak sespesifik 'kelim'.
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: ujung jubah Saul
  rationale: Teks Ibrani menyebut 'ujung yang milik Saul'; kata 'jubah' dipasok dari konteks langsung ayat sebelumnya agar rujukannya jelas dan alami dalam bahasa Indonesia.
