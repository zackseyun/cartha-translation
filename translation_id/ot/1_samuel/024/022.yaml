base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: id
  text: Sekarang, bersumpahlah kepadaku demi Yahweh bahwa[a] engkau tidak akan melenyapkan keturunanku[b] sepeninggalku dan tidak akan menghapus namaku[c] dari kaum keluarga ayahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah memakai kata ‘jika’ dalam rumusan sumpah ini. Dalam konteks, kata itu memperkenalkan isi yang Saul minta agar dijanjikan Daud, yaitu ‘bahwa ... tidak’.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: ‘anak cucuku’.'
    reason: lexical_alternative
  - marker: c
    text: ‘Namaku’ di sini menunjuk pada kelangsungan dan ingatan akan garis keluarga Saul dalam kaum keluarganya.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengantar permintaan penutup Saul. ‘Sekarang’ alami dalam bahasa Indonesia modern; unsur penghubung וְ tidak perlu selalu diterjemahkan secara tersendiri.
- source_word: הִשָּׁבְעָה לִּי
  choice: bersumpahlah kepadaku
  rationale: Bentuk imperatif Nifal dari שבע dengan objek tak langsung menyatakan permintaan untuk mengucapkan sumpah; terjemahan ini langsung dan idiomatis.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Ungkapan sumpah ini memanggil nama ilahi. ‘Demi’ merupakan bentuk bahasa Indonesia yang lazim untuk bersumpah dengan menyebut pihak yang menjadi penjamin sumpah.
- source_word: אִם ... וְאִם
  choice: bahwa ... dan
  rationale: Dalam rumusan sumpah, אִם memperkenalkan isi komitmen yang diminta, bukan syarat biasa. Bahasa Indonesia membutuhkan pernyataan negatif yang jelas; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: תַּכְרִית אֶת זַרְעִי
  choice: engkau tidak akan melenyapkan keturunanku
  rationale: Hifil כרת dapat berarti menyingkirkan atau membinasakan suatu garis keturunan. זֶרַע di sini menunjuk kepada anak cucu, sehingga ‘keturunan’ lebih jelas daripada ‘benih’.
- source_word: אַחֲרָי
  choice: sepeninggalku
  rationale: Ungkapan ini bersifat temporal dan merujuk pada masa sesudah Saul tiada; ‘sepeninggalku’ menyampaikan maksud tersebut secara ringkas dan alami.
- source_word: תַּשְׁמִיד אֶת שְׁמִי
  choice: tidak akan menghapus namaku
  rationale: Hifil שמד menyatakan pemusnahan menyeluruh. Bersama ‘namaku’, ‘menghapus’ secara alami menyampaikan hilangnya kelanjutan dan ingatan atas garis keluarga Saul.
- source_word: מִבֵּית אָבִי
  choice: dari kaum keluarga ayahku
  rationale: בֵּית אָב adalah istilah kekerabatan bagi rumah tangga besar atau garis keluarga dari pihak ayah. ‘Kaum keluarga ayahku’ mempertahankan cakupan sosialnya tanpa menghasilkan ungkapan Indonesia yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה dalam rumusan sumpah
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Negasi dalam rumusan sumpah dengan אִם
  choice: bahwa engkau tidak akan ... dan tidak akan ...
  alternative: jika engkau melenyapkan ... dan jika engkau menghapus ...
  rationale: Secara harfiah אִם berarti ‘jika’, tetapi dalam rumusan sumpah Ibrani negasi atau kutuk yang menyertainya dapat dibiarkan tersirat. Karena Saul meminta jaminan agar keturunannya tidak dibinasakan, bentuk negatif eksplisit menyampaikan fungsi kalimat tanpa mengubah isi permintaannya; bentuk sumber dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. ‘Bersumpahlah kepadaku demi Yahweh’ mempertahankan kekhidmatan rumusan sumpah. ‘Sepeninggalku’ dipilih agar makna temporal jelas, sedangkan ‘kaum keluarga ayahku’ menjelaskan idiom kekerabatan Ibrani tanpa menjadi terlalu teknis.
