  text: וַ/יֹּאמְרוּ֩ אַנְשֵׁ֨י דָוִ֜ד אֵלָ֗י/ו הִנֵּ֨ה הַ/יּ֜וֹם אֲֽשֶׁר אָמַ֧ר יְהוָ֣ה אֵלֶ֗י/ךָ הִנֵּ֨ה אָנֹכִ֜י נֹתֵ֤ן אֶת איבי/ך בְּ/יָדֶ֔/ךָ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֖ר יִטַ֣ב בְּ/עֵינֶ֑י/ךָ וַ/יָּ֣קָם דָּוִ֗ד וַ/יִּכְרֹ֛ת אֶת כְּנַֽף הַ/מְּעִ֥יל אֲשֶׁר לְ/שָׁא֖וּל בַּ/לָּֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: id
  text: Lalu orang-orang Daud berkata kepadanya, “Lihat, inilah hari yang Yahweh maksudkan ketika Dia berfirman kepadamu, ‘Lihat, Aku menyerahkan musuhmu ke dalam tanganmu, dan engkau dapat bertindak terhadapnya sebagaimana yang kauanggap baik[a].’” Lalu Daud bangkit dan diam-diam memotong ujung jubah Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebagaimana yang baik dalam pandanganmu” atau “di matamu.”
    reason: Menjelaskan idiom Ibrani yang merujuk pada apa yang dianggap baik atau tepat oleh seseorang.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menghasilkan alur naratif Indonesia yang wajar.
- source_word: אַנְשֵׁי דָוִד
  choice: orang-orang Daud
  rationale: Frasa konstruksi ini menunjuk kepada para pengikut atau anak buah Daud; bentuk ini ringkas dan lazim dalam narasi Alkitab bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini muncul dua kali dan memberi penekanan deiktis. “Lihat” mempertahankan daya serunya tanpa memakai ungkapan arkais.
- source_word: הַיּוֹם
  choice: inilah hari
  rationale: Gabungan dengan הִנֵּה menandai hari tertentu sebagai saat yang dimaksud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi diterjemahkan secara langsung, bukan diganti dengan gelar.
- source_word: נֹתֵן
  choice: Aku menyerahkan
  rationale: Partisipel ini menggambarkan tindakan yang sedang atau segera diwujudkan. Dalam idiom konteks ini, “menyerahkan” lebih alami daripada “memberikan” karena seseorang diserahkan ke dalam kuasa orang lain.
- source_word: איביך
  choice: musuhmu
  rationale: Konteks, pronomina tunggal selanjutnya, dan rujukan kepada Saul mendukung bentuk tunggal.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Ungkapan ini berarti menyerahkan ke dalam kuasa seseorang; terjemahan mempertahankan citra tangan yang jelas dalam bahasa Indonesia.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: engkau dapat memperlakukannya
  rationale: Dalam konteks perkataan para pengikut Daud, bentuk ini menyatakan kebebasan atau izin bertindak, bukan perintah yang harus dilaksanakan.
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: sesuai dengan apa yang baik dalam pandanganmu
  rationale: Terjemahan mempertahankan metafora penilaian menurut pandangan seseorang sekaligus tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: וַיָּקָם
  choice: Daud bangkit
  rationale: Kata kerja naratif ini menyatakan Daud mulai bertindak; “bangkit” ringkas dan sesuai dengan register sastra yang modern.
- source_word: וַיִּכְרֹת
  choice: memotong
  rationale: Kata kerja ini menyatakan pemotongan bagian dari suatu benda; objeknya menjelaskan bahwa ujung jubah dipotong.
- source_word: בַּלָּט
  choice: diam-diam
  rationale: Adverbia ini menunjukkan tindakan yang dilakukan secara tersembunyi atau tanpa diketahui Saul.
- source_word: כְּנַף הַמְּעִיל
  choice: ujung jubah
  rationale: כָּנָף dapat berarti ujung, sudut, atau punca pakaian; “ujung jubah” alami dalam bahasa Indonesia dan tidak menentukan bentuk persis bagian kain tersebut.
theological_decisions:
- issue: Apakah perkataan tentang hari yang dijanjikan Yahweh harus disajikan sebagai nubuat ilahi yang secara objektif telah diberikan atau sebagai penafsiran orang-orang Daud
  choice: 'Teks utama mempertahankan klaim langsung orang-orang Daud: “hari yang tentangnya Yahweh berfirman kepadamu.”'
  alternative: Membuat jarak dengan klaim itu melalui parafrasa seperti “hari yang menurut mereka telah dijanjikan Yahweh.”
  rationale: Teks Ibrani hanya melaporkan ucapan orang-orang Daud. Terjemahan tidak mengesahkan ataupun menyangkal penafsiran mereka, sehingga ketegangan naratif dan teologis tetap terpelihara.
- issue: Daya modal וְעָשִׂיתָ לּוֹ
  choice: “engkau dapat memperlakukannya” sebagai kebebasan bertindak
  alternative: “engkau harus memperlakukannya” sebagai perintah atau “engkau akan memperlakukannya” sebagai prediksi
  rationale: Konteks menunjukkan bahwa orang-orang Daud memahami penyerahan musuh sebagai kesempatan bagi Daud untuk bertindak menurut penilaiannya, bukan sebagai perintah eksplisit untuk membunuh Saul.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pengulangan “Lihat” dan “Lalu” dipertahankan untuk mencerminkan penekanan serta urutan narasi Ibrani. Bentuk sapaan tunggal “engkau” digunakan dalam kutipan langsung, sedangkan nama Yahweh dipertahankan sebagai nama diri ilahi.
