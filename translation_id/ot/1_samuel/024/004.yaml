  source_fidelity: 'Terjemahan secara akurat mencerminkan urutan dan unsur pokok teks Ibrani: Saul tiba di kandang-kandang domba di tepi jalan, terdapat sebuah gua, Saul masuk untuk memenuhi eufemisme Ibrani tersebut, dan Daud beserta orang-orangnya berada di bagian terdalam gua. “Sedang duduk” tepat untuk partisip יֹשְׁבִים dalam adegan ini.'
