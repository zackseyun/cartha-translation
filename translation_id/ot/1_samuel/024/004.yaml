  text: וַ֠/יָּבֹא אֶל גִּדְר֨וֹת הַ/צֹּ֤אן עַל הַ/דֶּ֨רֶךְ֙ וְ/שָׁ֣ם מְעָרָ֔ה וַ/יָּבֹ֥א שָׁא֖וּל לְ/הָסֵ֣ךְ אֶת רַגְלָ֑י/ו וְ/דָוִד֙ וַ/אֲנָשָׁ֔י/ו בְּ/יַרְכְּתֵ֥י הַ/מְּעָרָ֖ה יֹשְׁבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: id
  text: Ia sampai ke kandang-kandang domba di tepi jalan. Di sana ada sebuah gua, lalu Saul masuk untuk buang air[a]. Sementara itu, Daud dan orang-orangnya sedang duduk di bagian paling dalam gua itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menutupi kakinya,” sebuah ungkapan halus dalam bahasa Ibrani untuk buang air.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: kandang-kandang domba
  rationale: Frasa ini menunjuk pada pagar atau tempat tertutup untuk kawanan domba. “Kandang-kandang domba” konkret, alami, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: עַל הַדֶּרֶךְ
  choice: di tepi jalan
  rationale: Frasa ini menempatkan kandang-kandang tersebut di sisi rute yang sedang dilalui Saul; “di tepi jalan” menyampaikan hubungan tempat itu secara alami.
- source_word: מְעָרָה
  choice: sebuah gua
  rationale: Ini adalah padanan baku dan langsung untuk nomina tersebut.
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: untuk buang air
  rationale: Ungkapan Ibrani ini merupakan eufemisme untuk membuang hajat. “Buang air” menyampaikan maknanya dengan wajar dan tidak kasar, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: di bagian paling dalam gua itu
  rationale: Kata יַרְכְּתֵי menunjuk pada bagian yang paling jauh atau tersembunyi. Pilihan ini mempertahankan keterangan ruang yang penting bagi adegan tersebut.
- source_word: יֹשְׁבִים
  choice: sedang duduk
  rationale: Partisip ini menggambarkan keadaan atau posisi mereka pada saat itu, bukan tempat tinggal yang menetap.
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: Ia sampai ... Saul masuk
  rationale: 'Pemilihan dua verba Indonesia yang berbeda menyampaikan gerak berurutan: Saul tiba di lokasi lalu memasuki gua, tanpa pengulangan yang kaku.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “Ia” mempertahankan kesinambungan dari konteks sebelumnya, sedangkan nama Saul disebut ketika ia memasuki gua agar pelaku tetap jelas. Penanda catatan kaki ditempatkan sesudah ungkapan yang dijelaskannya.
