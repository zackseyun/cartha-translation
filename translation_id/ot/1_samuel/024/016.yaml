revisions:
- from: Biarlah TUHAN menjadi hakim dan memutuskan perkara antara aku dan engkau. Kiranya Dia melihat, membela perkaraku, dan menghakimi aku lepas dari tanganmu.[a]
  to: Biarlah TUHAN menjadi hakim dan memutuskan perkara antara aku dan engkau. Kiranya Dia melihat dan membela perkaraku, serta menyelamatkan aku dari tanganmu.
  rationale: Revisi terbatas pada bagian akhir dan penghalusan penghubung. Terjemahan baru menghindari kesan bahwa TUHAN menghakimi penutur, sambil menyampaikan fungsi pembebasan dari ungkapan Ibrani “dari tanganmu.” Rangkaian gambaran hukum dan register pidato tetap dipertahankan.
