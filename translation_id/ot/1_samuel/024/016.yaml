  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: id
  text: Biarlah TUHAN menjadi hakim dan memutuskan perkara antara aku dan engkau. Kiranya Dia melihat dan membela perkaraku, serta menyelamatkan aku dari tanganmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: Biarlah TUHAN menjadi hakim
  rationale: Ungkapan ini menyatakan seruan agar YHWH bertindak sebagai hakim; 'biarlah' mempertahankan nuansa permohonan atau harapan.
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: dan memutuskan perkara antara aku dan engkau
  rationale: '''Memutuskan perkara'' menyampaikan tindakan yudisial שׁפט secara alami dan membedakannya dari sebutan ''hakim'' sebelumnya.'
- source_word: וְיָרֵב אֶת רִיבִי
  choice: membela perkaraku
  rationale: Rangkaian ריב idiomatis berarti memperjuangkan atau membela perkara seseorang dalam sengketa hukum.
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: dan menghakimi aku lepas dari tanganmu
  rationale: Pilihan ini mempertahankan unsur yudisial verba שׁפט sekaligus daya pembebasan konstruksi מן; kejanggalan ringan mencerminkan ungkapan Ibrani yang padat.
theological_decisions:
- issue: Peran TUHAN sebagai hakim sekaligus pembela perkara
  choice: Mempertahankan kedua gambaran yudisial tanpa menyamakannya
  alternative: Meringkasnya menjadi 'membenarkan aku'
  rationale: 'Teks secara sengaja menumpuk istilah hukum: menjadi hakim, memutuskan, melihat, membela perkara, dan menghakimi atau memberi keadilan.'
- issue: Makna וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: menghakimi aku lepas dari tanganmu, dengan catatan kaki
  alternative: membebaskan aku dari tanganmu / memberi aku keadilan terhadap engkau
  rationale: Konstruksi tersebut dapat dipahami sebagai keputusan hukum yang menghasilkan pembebasan; teks utama menjaga verba yudisial, sedangkan catatan menjelaskan hasil yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' sesuai konteks pidato langsung kepada raja, sedangkan 'TUHAN' mewakili nama ilahi YHWH. Paralelisme dan rangkaian istilah hukum dipertahankan tanpa terdengar terlalu teknis.
