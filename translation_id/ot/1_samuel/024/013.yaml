id: 1SA.24.13
reference: 1 Samuel 24:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: id
  text: Kiranya Yahweh menghakimi antara aku dan engkau, dan kiranya Yahweh menuntut balas bagiku terhadapmu. Namun, tanganku tidak akan melawan engkau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tetapi tanganku tidak akan ada padamu,” suatu ungkapan Ibrani yang berarti bahwa Daud tidak akan bertindak memusuhi Saul.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: Kiranya ... menghakimi
  rationale: Bentuk yiqtol berfungsi sebagai permohonan atau harapan (yusif), bukan sekadar pernyataan tentang masa depan. “Kiranya” menyampaikan nuansa itu secara wajar dan khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: antara aku dan engkau
  rationale: Terjemahan langsung ini mempertahankan pertentangan pribadi dan suasana pengadilan dalam bahasa Ibrani.
- source_word: וּנְקָמַנִי יְהוָה מִמֶּךָּ
  choice: dan kiranya Yahweh menuntut balas bagiku terhadapmu
  rationale: Akar נקם menyatakan pembalasan, dan sufiks orang pertama menunjukkan bahwa Yahweh diminta bertindak bagi pihak Daud. “Terhadapmu” menandai orang yang menjadi sasaran pembalasan tanpa melunakkan ungkapan menjadi sekadar pembenaran.
- source_word: וְיָדִי
  choice: Namun, tanganku
  rationale: “Tangan” dipertahankan untuk menjaga gambaran Ibrani mengenai tindakan atau kekerasan pribadi. “Namun” menyatakan kontras dengan tindakan yang Daud serahkan kepada Yahweh.
- source_word: לֹא תִהְיֶה בָּךְ
  choice: tidak akan melawan engkau
  rationale: Ungkapan ini menyatakan bahwa Daud tidak akan bertindak memusuhi Saul. Terjemahan tetap mempertahankan kata “tangan” dan menghindari parafrasa yang terlalu khusus seperti “tidak akan memukul” atau “tidak akan membunuh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Sifat permohonan Daud mengenai נקם
  choice: Daud meminta Yahweh menuntut balas baginya, sementara ia sendiri tidak bertindak melawan Saul
  alternative: Daud hanya meminta pembenaran secara yudisial tanpa unsur pembalasan
  rationale: Akar נקם membawa makna pembalasan, dan ayat ini dengan sengaja mempertentangkan tindakan Yahweh dengan penolakan Daud untuk memakai tangannya sendiri. Ketegangan teologis itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “aku” dan “engkau” dipakai untuk mempertahankan bentuk sapaan langsung dan kontras pribadi dalam teks. Susunan kalimat cukup dekat dengan bahasa sumber, tetapi pilihan “menuntut balas bagiku terhadapmu” dibuat agar makna נקם tetap tegas sekaligus dapat dipahami pembaca masa kini.
