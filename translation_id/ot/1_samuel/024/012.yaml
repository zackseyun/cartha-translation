  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: id
  text: Ayahku, lihatlah! Ya, lihatlah ujung jubahmu[a] di tanganku. Sebab, ketika aku memotong ujung jubahmu, aku tidak membunuhmu. Ketahuilah dan lihatlah bahwa tidak ada kejahatan ataupun pemberontakan[b] dalam tanganku. Aku tidak berdosa terhadapmu, tetapi engkau memburu nyawaku untuk mengambilnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tepi jubahmu” atau “sudut jubahmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pelanggaran.” Kata Ibraninya dapat mencakup pelanggaran dan pemberontakan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “memburu nyawaku untuk mengambilnya.”
    reason: literal_rendering
lexical_decisions:
- source_word: וְאָבִי
  choice: Ayahku
  rationale: Mempertahankan sapaan langsung Daud yang penuh hormat dan bernuansa hubungan kekeluargaan-politik terhadap Saul; waw pembuka tidak perlu diterjemahkan secara kaku dalam bahasa Indonesia.
- source_word: רְאֵה גַּם רְאֵה
  choice: lihatlah! Ya, lihatlah
  rationale: Pengulangan dan גַּם menyatakan penegasan yang mendesak; bentuk ini mempertahankan desakan itu secara alami.
- source_word: כְּנַף מְעִילְךָ
  choice: ujung jubahmu
  rationale: כָּנָף menunjuk bagian terluar atau tepi pakaian; 'ujung' konkret dan wajar dalam konteks potongan jubah.
- source_word: בְּיָדִי
  choice: di tanganku / dalam tanganku
  rationale: Terjemahan harfiah mempertahankan hubungan antara bukti fisik yang dipegang Daud dan tangannya sebagai gambaran tindakan atau kuasa.
- source_word: כִּי בְּכָרְתִי
  choice: Sebab, ketika aku memotong
  rationale: כִּי memperkenalkan alasan, sedangkan konstruksi בְּ dengan bentuk verbal menyatakan keadaan atau waktu tindakan.
- source_word: וְלֹא הֲרַגְתִּיךָ
  choice: aku tidak membunuhmu
  rationale: Padanan langsung dan modern bagi verba הרג, tanpa gaya arkais.
- source_word: דַּע וּרְאֵה
  choice: Ketahuilah dan lihatlah
  rationale: Kedua verba dipertahankan karena Daud meminta Saul memahami sekaligus mencermati bukti yang ada.
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: tidak ada kejahatan ataupun pemberontakan dalam tanganku
  rationale: Mempertahankan metafora 'tangan' serta cakupan moral רָעָה dan nuansa pelanggaran atau pemberontakan dalam פֶּשַׁע.
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: Aku tidak berdosa terhadapmu
  rationale: חטא dengan ל menyatakan pelanggaran terhadap seseorang; 'berdosa' mempertahankan bobot moral teks.
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: tetapi engkau memburu nyawaku untuk merenggutnya
  rationale: Mempertahankan metafora perburuan, rujukan נֶפֶשׁ sebagai nyawa, dan kontras antara ketidakbersalahan Daud dengan tindakan Saul.
theological_decisions:
- issue: Nuansa moral-politis פֶּשַׁע dalam penyangkalan Daud
  choice: pemberontakan
  alternative: pelanggaran
  rationale: Dalam konteks pembicaraan kepada raja, kata ini dapat menunjuk pelanggaran yang bersifat memberontak. 'Pemberontakan' mempertahankan dimensi politis tanpa menghapus arti moralnya; alternatif dicatat karena leksem tersebut juga dapat berarti pelanggaran.
- issue: Hubungan klausa terakhir dengan pernyataan ketidakbersalahan Daud
  choice: tetapi
  alternative: dan/meskipun
  rationale: 'Waw menandai kontras kontekstual yang kuat: Daud tidak berdosa terhadap Saul, tetapi Saul memburu nyawanya. Pilihan ini menyatakan hubungan wacana tanpa menambah alasan teologis.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung, mendesak, dan tetap penuh hormat. Pengulangan imperatif dipertahankan, demikian pula metafora tangan dan perburuan; susunan kalimat dilancarkan agar mudah dipahami pembaca umum.
