base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: id
  text: Daud menyerang mereka sejak waktu remang-remang[a] sampai petang keesokan harinya. Tidak seorang pun dari mereka lolos, kecuali empat ratus pemuda yang menunggang unta lalu melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sejak fajar”; kata Ibrani yang digunakan dapat menunjuk pada waktu remang-remang, baik menjelang pagi maupun menjelang malam. Sebagian memahami konteks ini sebagai fajar, bukan senja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: menewaskan mereka
  rationale: Dalam konteks pertempuran, נכה menyatakan tindakan menghantam atau mengalahkan dengan kekerasan. 'Menewaskan' menyampaikan kuatnya tindakan dan hasil serangan secara alami dalam bahasa Indonesia.
- source_word: מֵהַנֶּשֶׁף
  choice: sejak waktu remang-remang
  rationale: נֶשֶׁף dapat menunjuk pada cahaya remang saat fajar maupun senja. Ungkapan ini mempertahankan ketidakpastian leksikal itu, sedangkan catatan kaki menjelaskannya.
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: sampai petang keesokan harinya
  rationale: Frasa ini menunjukkan bahwa pertempuran berlangsung hingga petang pada hari berikutnya; susunan tersebut alami dan jelas dalam bahasa Indonesia.
- source_word: וְלֹא נִמְלַט מֵהֶם אִישׁ
  choice: Tidak seorang pun dari mereka lolos
  rationale: Bentuk tunggal distributif אִישׁ menyatakan keseluruhan secara tegas. 'Tidak seorang pun' merupakan padanan Indonesia yang alami tanpa mengurangi penekanan itu.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Idiom ini memperkenalkan pengecualian terhadap pernyataan menyeluruh sebelumnya.
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: empat ratus orang muda
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, orang muda, atau pelayan. Dalam konteks para pelaku tempur yang mampu menunggang unta, 'orang muda' sesuai tanpa menyiratkan bahwa mereka masih anak-anak atau berstatus pelayan.
- source_word: אֲשֶׁר רָכְבוּ עַל הַגְּמַלִּים
  choice: yang menunggang unta
  rationale: Ungkapan ini menyampaikan tindakan menaiki dan mengendarai unta dengan ringkas serta alami dalam bahasa Indonesia.
- source_word: וַיָּנֻסוּ
  choice: lalu melarikan diri
  rationale: נוּס berarti melarikan diri. Pilihan ini membedakannya dari נִמְלַט, yang diterjemahkan 'lolos', serta menunjukkan kelanjutan tindakan dalam narasi.
