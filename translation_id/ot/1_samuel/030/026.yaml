  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: id
  text: Ketika Daud tiba di Ziklag, ia mengirimkan sebagian jarahan kepada para tua-tua Yehuda, sahabat-sahabatnya, dengan pesan, “Lihatlah, ini hadiah[a] untuk kalian dari jarahan musuh-musuh Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkat”. Kata Ibrani yang digunakan berarti “berkat”, tetapi di sini menunjuk kepada hadiah berupa bagian dari jarahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ketika Daud tiba
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “ketika” secara alami menghubungkan tibanya Daud dengan tindakan berikutnya.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim.
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: ia mengirimkan sebagian jarahan
  rationale: Preposisi מִן menunjukkan bahwa yang dikirim berasal dari keseluruhan jarahan, sehingga “sebagian” memperjelas maknanya tanpa menyatakan jumlah tertentu.
- source_word: לְזִקְנֵי יְהוּדָה
  choice: kepada para tua-tua Yehuda
  rationale: Istilah ini menunjuk kepada para pemimpin yang diakui di kalangan Yehuda; “tua-tua” mempertahankan istilah sosial-politik Alkitab yang sudah dikenal.
- source_word: לְרֵעֵהוּ
  choice: sahabat-sahabatnya
  rationale: רֵעַ dapat berarti sahabat, rekan, atau sesama. Dalam konteks ini, “sahabat-sahabatnya” menyampaikan hubungan baik Daud dengan para pemimpin tersebut tanpa mempersempitnya menjadi tetangga.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Ungkapan pengantar ucapan ini diterjemahkan secara idiomatis karena barang tersebut dikirim bersama perkataan Daud.
- source_word: הִנֵּה לָכֶם
  choice: Lihatlah, ini ... untuk kalian
  rationale: הִנֵּה menarik perhatian kepada pemberian yang ada; “Lihatlah, ini” mempertahankan daya tunjuknya dalam bahasa Indonesia yang wajar.
- source_word: בְּרָכָה
  choice: hadiah
  rationale: Secara leksikal berarti “berkat”, tetapi dalam konteks pembagian barang jarahan kata ini menunjuk kepada pemberian konkret. Alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: מִשְּׁלַל
  choice: dari jarahan
  rationale: “Jarahan” menyampaikan arti barang rampasan perang dan menjaga konsistensi dengan kemunculan sebelumnya.
- source_word: אֹיְבֵי יְהוָה
  choice: musuh-musuh Yahweh
  rationale: Rangkaian konstruksi ini menyatakan bahwa mereka adalah musuh Yahweh, yakni cara Daud membingkai lawan-lawan tersebut secara teologis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna בְּרָכָה dalam konteks pembagian jarahan
  choice: hadiah
  alternative: berkat
  rationale: Referen langsungnya adalah pemberian material dari jarahan, tetapi nuansa “berkat” yang sungguh ada dalam kata Ibrani dipertahankan melalui catatan kaki agar ketegangan leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lihatlah” mempertahankan penekanan הִנֵּה tanpa memakai bentuk yang terlalu arkais; “kalian” sesuai dengan bentuk jamak לָכֶם.
