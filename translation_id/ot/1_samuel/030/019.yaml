  register: Bahasa naratif modern, jelas, dan bermartabat. Ungkapan 'dari yang kecil sampai yang besar' sengaja mempertahankan keluasan makna sumber. Struktur kalimat kedua menonjolkan bahwa Daud membawa kembali semuanya.
