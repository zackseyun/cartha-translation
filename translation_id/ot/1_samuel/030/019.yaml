base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: id
  text: Tak satu pun milik mereka yang hilang, dari yang kecil sampai yang besar, anak laki-laki maupun anak perempuan, jarahan, ataupun segala sesuatu yang telah mereka ambil untuk diri mereka sendiri[a]. Daud mengembalikan semuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Subjek “mereka” adalah orang Amalek. Secara harfiah, “segala sesuatu yang telah mereka ambil untuk diri mereka sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: hilang
  rationale: Bentuk Nifal di sini menyatakan bahwa tidak satu pun orang atau barang didapati tidak ada setelah semuanya direbut kembali. Dalam konteks ini, 'hilang' alami dan tidak harus berarti hilang untuk selamanya.
- source_word: לָהֶם
  choice: milik mereka
  rationale: 'Dativus posesif bersama נֶעְדַּר paling wajar diungkapkan dalam bahasa Indonesia sebagai kepemilikan: ''sesuatu pun milik mereka''.'
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan ini mempertahankan ungkapan merismus Ibrani tanpa menentukan apakah yang dimaksud terutama usia, kedudukan, atau cakupan umum.
- source_word: בָּנִים וּבָנוֹת
  choice: anak laki-laki maupun anak perempuan
  rationale: Bahasa Ibrani menyebut kedua kelompok secara eksplisit; bentuk ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: מִשָּׁלָל
  choice: jarahan
  rationale: Istilah ini menunjuk pada barang yang dirampas dalam penyerbuan; 'jarahan' merupakan padanan naratif yang lazim dan mudah dipahami.
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: apa pun yang telah dirampas bagi diri mereka sendiri
  rationale: Ungkapan ini mempertahankan bentuk Ibrani secara dekat, termasuk לָהֶם refleksif yang merujuk kepada para penjarah, sementara 'dirampas' membuat tindakan pengambilan dalam konteks serangan menjadi jelas.
- source_word: הַכֹּל הֵשִׁיב
  choice: Semuanya dibawa kembali
  rationale: Bentuk Hifil dari שוב menyatakan tindakan membuat sesuatu kembali; 'dibawa kembali' mempertahankan tindakan konkret dalam narasi dan penempatan awal 'Semuanya' mencerminkan penekanan objek dalam bahasa Ibrani.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
theological_decisions: []
