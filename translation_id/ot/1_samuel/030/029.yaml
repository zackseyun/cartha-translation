  text: and to those in Rakal[a], and to those in the towns of the Jerahmeelites, and to those in the towns of the Kenites.
translation:
  language: id
  text: juga kepada mereka yang di Rakal[a], kepada mereka yang di kota-kota orang Yerahmeel, dan kepada mereka yang di kota-kota orang Keni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam sebagian tradisi berbahasa Inggris, Rakal dieja “Racal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: juga kepada mereka yang berada
  rationale: Gabungan waw, lamed, dan partikel relatif dalam daftar pembagian pemberian ini menyatakan penerima berdasarkan tempat tinggal. Ungkapan ini mempertahankan fungsi datif dan hubungan lokatifnya secara alami dalam bahasa Indonesia.
- source_word: בְּרָכָל
  choice: di Rakal
  rationale: רָכָל adalah nama tempat; bentuk Rakal mengikuti transliterasi langsung dari konsonan Ibrani.
- source_word: בְּעָרֵי
  choice: di kota-kota
  rationale: עִיר dapat berarti kota atau permukiman; 'kota-kota' merupakan padanan Indonesia yang umum dan tetap mempertahankan bentuk jamaknya.
- source_word: הַיְּרַחְמְאֵלִי
  choice: orang Yerahmeel
  rationale: Walaupun bentuk Ibraninya adalah gentilisia tunggal dengan kata sandang, dalam frasa 'kota-kota orang Yerahmeel' kata itu berfungsi secara kolektif untuk kelompok masyarakat tersebut.
- source_word: הַקֵּינִי
  choice: orang Keni
  rationale: Bentuk gentilisia tunggal ini berfungsi kolektif sesudah 'kota-kota'; dalam bahasa Indonesia, 'orang Keni' secara alami dapat menunjuk kelompok itu secara keseluruhan.
