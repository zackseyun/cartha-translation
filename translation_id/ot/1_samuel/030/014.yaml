base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: id
  text: Kami menyerbu daerah Negeb orang Kereti, wilayah Yehuda, dan daerah Negeb Kaleb, lalu membakar Ziklag dengan api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: menyerbu
  rationale: Dalam konteks militer ini, verba tersebut menunjuk pada serangan perampasan. 'Menyerbu' ringkas, alami, dan mempertahankan daya tindakan verba Ibrani.
- source_word: נֶגֶב
  choice: Negeb
  rationale: Di sini kata itu menunjuk pada kawasan kering di selatan, bukan sekadar arah mata angin. Bentuk 'Negeb' sudah lazim dalam tradisi penamaan geografis Alkitab bahasa Indonesia.
- source_word: הַכְּרֵתִי
  choice: orang Kereti
  rationale: Kata ini adalah nama kelompok bangsa. 'Orang Kereti' merupakan transliterasi yang alami dalam bahasa Indonesia; variasi 'orang Kreti' dicatat dalam catatan kaki.
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: wilayah yang menjadi milik Yehuda
  rationale: Preposisi עַל melanjutkan daftar sasaran penyerbuan, sedangkan אֲשֶׁר לִיהוּדָה menyatakan kepunyaan. 'Wilayah' memperjelas rujukan teritorial tanpa membuat ungkapan menjadi kaku.
- source_word: נֶגֶב כָּלֵב
  choice: Negeb Kaleb
  rationale: Ungkapan ini kemungkinan menunjuk pada daerah selatan yang terkait dengan Kaleb atau kaumnya. Susunan nama geografis Ibrani dipertahankan secara ringkas.
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: kami membakar Ziklag dengan api
  rationale: Walaupun 'membakar dengan api' agak berulang dalam bahasa Indonesia, bentuk ini mempertahankan penyebutan eksplisit alat dalam teks Ibrani dan penekanannya yang hidup.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Transliterasi baku nama tempat ini dalam bahasa Indonesia.
