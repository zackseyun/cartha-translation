translation:
  language: id
  text: 'Ketika Daud dan orang-orangnya tiba di kota itu, tampaklah: kota itu telah dibakar dengan api, dan istri, anak laki-laki, serta anak perempuan mereka telah ditawan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: tampaklah bahwa
  rationale: Menandai apa yang terlihat ketika mereka tiba, dengan bahasa Indonesia alami sambil mempertahankan daya dramatik partikel Ibrani.
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: telah dibakar habis
  rationale: Bentuk pasif menyatakan keadaan kota akibat pembakaran; 'habis' menyampaikan intensitas idiomatis frasa 'dibakar dengan api' tanpa ungkapan Indonesia yang berlebihan.
- source_word: נִשְׁבּוּ
  choice: telah ditawan
  rationale: Bentuk pasif perfek menyatakan bahwa penawanan sudah terjadi sebelum Daud dan orang-orangnya tiba.
