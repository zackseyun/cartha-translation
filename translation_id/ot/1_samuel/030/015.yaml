  source_fidelity: Terjemahan dengan tepat mempertahankan bentuk kausatif dan arah dalam הֲתוֹרִדֵנִי serta וְאוֹרִדְךָ melalui “menuntun ... turun.” Permintaan sumpah, penegasan negatif yang tersirat dalam rumusan sumpah Ibrani, dan makna menyerahkan seseorang ke dalam kuasa tuannya tersampaikan dengan setia. “Gerombolan penjarah” secara memadai mencerminkan גדוד dalam konteks kelompok perampok/penyerbu.
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai untuk dialog naratif. Penggunaan “engkau,” “kepadaku,” dan “tuanku” konsisten serta wajar dalam register Alkitab modern yang bermartabat. “Maka aku akan” dapat menyatakan konsekuensi dari sumpah yang diminta dan tidak mengubah makna.
  terminology: “Allah” tepat untuk אֱלֹהִים dalam sumpah ini; “tuanku” tepat bagi אֲדֹנִי yang merujuk kepada majikan manusia, bukan gelar ilahi. Tidak ada istilah teologis atau nama yang memerlukan penyesuaian. Draf tidak memuat catatan kaki, sehingga tidak ada jangkar catatan kaki target yang perlu diperbaiki.
