base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: id
  text: Daud berkata kepadanya, “Maukah engkau menuntun aku turun kepada gerombolan penjarah ini?” Orang itu menjawab, “Bersumpahlah kepadaku demi Allah bahwa engkau tidak akan membunuhku ataupun menyerahkan aku ke tangan tuanku. Maka aku akan menuntun engkau turun kepada gerombolan penjarah itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: Maukah engkau menuntun aku turun
  rationale: Bentuk Hifil dari ירד bersifat kausatif dan mempertahankan arah ‘turun’. Dalam konteks ini, orang Mesir itu diminta menjadi penunjuk jalan, sehingga ‘menuntun aku turun’ alami dan tepat.
- source_word: הַגְּדוּד
  choice: gerombolan penjarah
  rationale: גדוד di sini menunjuk pada kelompok bersenjata yang bergerak untuk menjarah, yakni pasukan Amalek yang menyerbu Ziklag. ‘Gerombolan penjarah’ menyampaikan sifat kelompok itu dengan jelas dalam bahasa Indonesia modern.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: Bersumpahlah kepadaku demi Allah
  rationale: Ungkapan ini merupakan permintaan akan sumpah khidmat dengan menyebut Allah sebagai penjamin; ‘demi Allah’ merupakan padanan Indonesia yang langsung dan wajar.
- source_word: אִם תְּמִיתֵנִי
  choice: bahwa engkau tidak akan membunuhku
  rationale: Dalam rumusan sumpah, אִם menyampaikan larangan atau konsekuensi negatif secara eliptis. Bahasa Indonesia perlu menyatakan unsur ‘tidak’ agar maksud permintaan itu jelas.
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: menyerahkan aku ke tangan tuanku
  rationale: Hifil סגר berarti menyerahkan seseorang kepada kuasa pihak lain. Ungkapan ‘ke tangan’ mempertahankan idiom Ibrani mengenai kuasa atau kendali, sedangkan ‘menyerahkan’ terdengar alami.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Kata ini menunjuk kepada pemilik atau majikan manusia dari hamba Mesir itu, bukan kepada Allah. ‘Tuanku’ sesuai dengan relasi hamba dan majikan serta tetap bernada hormat.
- source_word: וְאוֹרִדְךָ
  choice: Maka aku akan menuntun engkau turun
  rationale: Bentuk Hifil dari ירד kembali menyatakan tindakan membawa atau menuntun turun. Pilihan yang sama mempertahankan kesejajaran dengan pertanyaan Daud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘engkau’ dipakai secara konsisten untuk dialog langsung. ‘Gerombolan penjarah’ dipilih agar fungsi גדוד dalam konteks ini eksplisit tanpa menjadikannya istilah militer yang terlalu teknis.
