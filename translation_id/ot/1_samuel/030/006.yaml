  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: id
  text: Daud sangat terdesak, sebab orang-orang itu berkata hendak merajamnya. Hati semua orang itu getir, masing-masing karena anak-anak lelaki dan perempuannya. Namun, Daud menguatkan dirinya dalam Yahweh, Allahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: Daud sangat terdesak
  rationale: Konstruksi impersonal dari צרר dengan לְדָוִד menyatakan bahwa keadaan menjadi sangat menyesakkan atau sulit bagi Daud; 'sangat terdesak' alami dalam bahasa Indonesia dan mempertahankan intensitas מְאֹד.
- source_word: הָעָם
  choice: orang-orang itu
  rationale: Secara leksikal berarti 'rakyat/orang-orang', tetapi dalam konteks menunjuk kepada kelompok pengikut Daud. Pilihan ini tidak mempersempitnya secara eksplisit menjadi 'pasukan' atau 'prajurit'.
- source_word: אָמְרוּ ... לְסָקְלוֹ
  choice: berkata hendak merajamnya
  rationale: Infinitif setelah אָמְרוּ mengungkapkan tindakan yang mereka bicarakan atau niatkan. 'Berkata hendak' mempertahankan unsur ujaran dan maksud tanpa menyatakan bahwa perajaman sudah dimulai.
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: Hati semua orang itu sangat getir
  rationale: Ungkapan Ibrani secara harfiah menyebut 'jiwa' kolektif yang 'getir'. 'Hati ... sangat getir' mempertahankan citra kepahitan batin sambil terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Dipakai secara distributif untuk setiap orang dalam kelompok. Konteks keluarga dan bentuk maskulin Ibrani tetap tercermin melalui akhiran posesif tunggal pada 'anak-anak ... -nya', sementara ungkapan Indonesia ini lebih alami daripada 'setiap laki-laki'.
- source_word: עַל בָּנָיו וְעַל בְּנֹתָיו
  choice: karena anak-anak lelaki dan perempuannya
  rationale: עַל di sini menandai sebab kepedihan mereka. Pembedaan 'anak-anak lelaki dan perempuan' mempertahankan kedua nomina Ibrani secara eksplisit.
- source_word: וַיִּתְחַזֵּק
  choice: menguatkan dirinya
  rationale: Bentuk hitpael memiliki daya refleksif atau medial. Terjemahan ini mempertahankan tindakan aktif Daud tanpa menjelaskan secara berlebihan bagaimana ia memperoleh kekuatan.
- source_word: בַּיהוָה אֱלֹהָיו
  choice: dalam Yahweh, Allahnya
  rationale: Preposisi בְּ dipertahankan sebagai 'dalam', yang dapat menyatakan lingkup atau sumber kekuatan, sedangkan nama perjanjian יהוה ditransliterasikan 'Yahweh' dan אֱלֹהָיו diterjemahkan 'Allahnya'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Daya ungkapan וַיִּתְחַזֵּק ... בַּיהוָה
  choice: Daud menguatkan dirinya dalam Yahweh
  alternative: Daud mendapat kekuatan dari Yahweh atau Daud meneguhkan hatinya dengan bersandar kepada Yahweh
  rationale: Pilihan utama mempertahankan bentuk refleksif/medial dari verba sekaligus preposisi בְּ, sehingga ketegangan antara tindakan Daud dan Yahweh sebagai lingkup atau sumber kekuatannya tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Merajam' dipertahankan sebagai istilah yang jelas untuk pembunuhan dengan lemparan batu. Kalimat terakhir sengaja cukup formal untuk mempertahankan ungkapan teologis dan ambiguitas sumber.
