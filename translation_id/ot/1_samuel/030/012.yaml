base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: id
  text: Mereka memberinya sepotong kue ara yang dipadatkan[a] dan dua kelompok kismis[b]. Ia pun makan, lalu rohnya kembali kepadanya[c], sebab selama tiga hari tiga malam ia tidak makan roti ataupun minum air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kue ini dibuat dari buah ara yang dipadatkan.
    reason: cultural_note
  - marker: b
    text: Bentuk kedua satuan kismis ini tidak pasti; mungkin yang dimaksud adalah dua kue kismis.
    reason: lexical_alternative
  - marker: c
    text: Atau “tenaganya pulih” atau “ia siuman kembali”; secara harfiah, “rohnya kembali kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: sepotong kue ara yang dipadatkan
  rationale: פֶלַח berarti potongan atau irisan, sedangkan דְּבֵלָה adalah buah ara yang dipadatkan menjadi kue. Ungkapan ini mempertahankan bentuk makanan kuno tersebut dengan bahasa Indonesia yang jelas.
- source_word: שְׁנֵי צִמֻּקִים
  choice: dua gumpal kismis
  rationale: צִמֻּקִים berarti kismis, tetapi bentuk pasti kedua satuan yang dihitung tidak dijelaskan. 'Gumpal' menyampaikan bahwa kismis itu dikumpulkan atau dipadatkan tanpa memastikan bahwa keduanya berbentuk kue.
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: rohnya kembali kepadanya
  rationale: Terjemahan ini mempertahankan gambaran harfiah dan ketegangan makna idiom Ibrani; dalam konteks, ungkapan itu menyatakan bahwa ia hidup atau kuat kembali.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna konkret 'roti' dipertahankan, meskipun kata Ibrani ini kadang dapat berarti makanan secara umum.
- source_word: שָׁתָה מַיִם
  choice: minum air
  rationale: Terjemahan langsung mempertahankan penyebutan air secara khusus.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: tiga hari tiga malam
  rationale: Ungkapan waktu ini diterjemahkan langsung dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna רוּחַ dalam ungkapan pemulihan
  choice: rohnya kembali kepadanya
  alternative: tenaganya pulih; ia siuman kembali
  rationale: Konteks mendukung pemulihan tenaga atau kesadaran, tetapi terjemahan utama mempertahankan ungkapan sumber tanpa menetapkan secara sempit apakah רוּחַ berarti roh, napas hidup, kesadaran, atau daya hidup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan bermartabat. Istilah konkret 'roti' dan 'air' dipertahankan, sedangkan catatan kaki menjelaskan makanan kuno dan idiom pemulihan tanpa memasukkan tafsiran denominasi.
