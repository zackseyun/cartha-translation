translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kambing domba dan sapi’ dipilih daripada istilah teknis seperti ‘ternak kecil dan ternak besar’. Struktur kalimat mempertahankan urutan tindakan dalam bahasa Ibrani, sedangkan ‘sambil berkata’ menyatakan bahwa pengumuman berlangsung ketika ternak digiring.
