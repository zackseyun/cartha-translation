base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/020.yaml
  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: id
  text: Daud mengambil semua kambing dan domba serta sapi. Mereka menggiring hewan-hewan itu di depan ternak yang lain[a], lalu berkata, “Inilah jarahan Daud.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ternak itu.” Kemungkinan besar yang dimaksud ialah ternak yang sebelumnya telah direbut kembali; hewan-hewan yang baru diambil digiring di depannya sebagai tontonan umum.'
    reason: textual_ambiguity_and_cultural_note
  - marker: b
    text: 'Atau: “Inilah hasil rampasan Daud.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja לקח dalam rangkaian narasi ini secara wajar berarti ‘mengambil’; pilihan ini tidak menambahkan unsur kekerasan yang tidak dinyatakan.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kambing domba dan sapi
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing, sedangkan בָּקָר menunjuk pada sapi. Ungkapan ini jelas dan alami bagi pembaca Indonesia.
- source_word: נָהֲגוּ
  choice: menggiring
  rationale: Dalam konteks ternak, נהג berarti membuat hewan bergerak maju dengan menggiringnya.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Mempertahankan makna ruang harfiah ‘di hadapan/di depan’ dan sesuai dengan gerak iring-iringan ternak.
- source_word: הַמִּקְנֶה הַהוּא
  choice: ternak yang lain
  rationale: Secara harfiah frasa ini berarti ‘ternak itu’. Dalam konteksnya, frasa tersebut membedakan hewan yang baru diambil dari kelompok ternak yang sudah ada atau telah direbut kembali; ‘yang lain’ menyampaikan pembedaan itu secara alami tanpa menetapkan rujukannya di dalam teks utama.
- source_word: זֶה שְׁלַל דָּוִד
  choice: Inilah jarahan Daud
  rationale: זֶה memperkenalkan identifikasi kolektif, sedangkan שְׁלַל berarti barang atau hasil yang dirampas dalam perang. ‘Jarahan’ ringkas, jelas, dan mempertahankan hubungan kepunyaan dalam konstruksi Ibrani.
