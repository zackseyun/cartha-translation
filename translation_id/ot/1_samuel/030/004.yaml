  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: id
  text: Lalu Daud dan orang-orang yang bersamanya mengangkat suara mereka dan menangis sampai mereka tidak kuat lagi menangis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sampai tidak ada lagi kekuatan dalam diri mereka untuk menangis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: mengangkat suara mereka
  rationale: Ungkapan נָשָׂא + קוֹל berarti mengangkat atau menyaringkan suara. Bentuk ini tetap alami dalam bahasa Indonesia dan mempertahankan gambaran ungkapan Ibrani.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: orang-orang yang bersamanya
  rationale: עָם pada konteks ini menunjuk kepada kelompok yang menyertai Daud. 'Orang-orang' lebih wajar daripada 'rakyat' dan tidak mempersempit makna menjadi 'pasukan' atau 'laki-laki'.
- source_word: וַיִּבְכּוּ
  choice: menangis
  rationale: בכה berarti menangis atau meratap. 'Menangis' jelas, alami, dan sesuai dengan nada dukacita narasi.
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: sampai mereka tidak kuat lagi
  rationale: Terjemahan ini menyampaikan habisnya kekuatan secara idiomatis dalam bahasa Indonesia tanpa mengubah intensitas teks.
- source_word: לִבְכּוֹת
  choice: menangis
  rationale: Pengulangan kata 'menangis' mempertahankan pengulangan akar בכה dalam teks Ibrani.
