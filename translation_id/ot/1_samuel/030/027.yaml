  yaml_path: translation/ot/1_samuel/030/027.yaml
  text: to those in Bethel[a], to those in Ramoth-negeb, and to those in Jattir—
translation:
  language: id
  text: kepada mereka yang berada di Betel, kepada mereka yang berada di Ramot-Negeb[a], dan kepada mereka yang berada di Yatir—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Ramot di Negeb,” yakni “di Ramot Selatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲשֶׁר
  choice: kepada mereka yang berada
  rationale: Gabungan ל dengan אֲשֶׁר dalam daftar ini menunjuk secara distributif kepada para penerima. Ungkapan ini mempertahankan arah pemberian sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּבֵית אֵל
  choice: di Betel
  rationale: Dalam konteks ini בֵית אֵל adalah nama tempat, bukan frasa umum 'rumah Allah'. Preposisi בְּ diterjemahkan 'di' untuk menyatakan lokasi.
- source_word: בְּרָמוֹת נֶגֶב
  choice: di Ramot-Negeb[a]
  rationale: Ungkapan ini diperlakukan sebagai nama tempat. Bentuk transliterasi mempertahankan ketidakpastian apakah נֶגֶב merupakan unsur nama wilayah atau keterangan yang berarti 'selatan'; alternatif dijelaskan dalam catatan kaki.
- source_word: בְּיַתִּר
  choice: di Yatir
  rationale: Nama tempat ini ditransliterasikan secara langsung dari bentuk Ibrani, sedangkan בְּ diterjemahkan 'di'.
- source_word: וְ
  choice: dan
  rationale: Konjungsi ini menghubungkan unsur terakhir dalam daftar penerima.
