translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'kepada mereka yang berada' mengikuti struktur distributif teks Ibrani dan memperjelas bahwa ayat ini merupakan bagian dari daftar penerima. Tanda pisah pada akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
