  text: וַ/יִּשְׁבּ֨וּ אֶת הַ/נָּשִׁ֤ים אֲשֶׁר בָּ/הּ֙ מִ/קָּטֹ֣ן וְ/עַד גָּד֔וֹל לֹ֥א הֵמִ֖יתוּ אִ֑ישׁ וַ/יִּֽנְהֲג֔וּ וַ/יֵּלְכ֖וּ לְ/דַרְכָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: id
  text: Mereka menawan para perempuan yang ada di kota itu, dari yang kecil sampai yang besar.[a] Mereka tidak membunuh seorang pun, tetapi menggiring mereka pergi, lalu meneruskan perjalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari yang muda sampai yang tua.” Ungkapan Ibrani “dari yang kecil sampai yang besar” dapat menunjuk pada seluruh kalangan tanpa kecuali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: Mereka menawan
  rationale: Verba שׁבה menunjuk pada tindakan membawa orang sebagai tawanan perang; 'menawan' ringkas, alami, dan mempertahankan nuansa militernya.
- source_word: הַנָּשִׁים
  choice: para perempuan
  rationale: Makna leksikal dasarnya ialah perempuan, bukan khusus istri; bentuk 'para perempuan' menyatakan kelompok yang dimaksud secara alami.
- source_word: אֲשֶׁר בָּהּ
  choice: yang ada di kota itu
  rationale: Pronomina feminin tunggal merujuk kembali kepada Ziklag, yaitu kota pada ayat sebelumnya. Penyebutan 'kota itu' memperjelas rujukan dalam bahasa Indonesia tanpa menambah identitas baru.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan ini mempertahankan cakupan idiom Ibrani dan tidak membatasi maknanya hanya pada usia; ungkapan itu dapat mencakup seluruh golongan tanpa kecuali.
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: Mereka tidak membunuh seorang pun
  rationale: אִישׁ berfungsi secara idiomatis sebagai individu tak tentu, sehingga 'seorang pun' lebih tepat daripada membatasinya pada laki-laki dewasa.
- source_word: וַיִּנְהֲגוּ
  choice: menggiring mereka pergi
  rationale: נהג dapat berarti menggiring atau membawa berjalan. 'Menggiring' mempertahankan unsur gerak paksa terhadap para tawanan, sementara objek tersirat dibuat eksplisit secara wajar.
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: lalu meneruskan perjalanan
  rationale: Ungkapan Ibrani ini berarti berangkat atau melanjutkan perjalanan mereka; pilihan ini alami dalam narasi Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Terjemahan mempertahankan idiom 'kecil sampai besar' di teks utama serta mencatat tafsiran berdasarkan usia dalam catatan kaki. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
