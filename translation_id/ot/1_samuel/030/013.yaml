  terminology: “Pemuda Mesir,” “hamba,” “Amalek,” dan “tuanku” konsisten dengan istilah naratif Alkitab Indonesia. “Hamba” tepat untuk עֶבֶד dalam konteks orang yang dimiliki/dikuasai tuannya, tanpa mengaburkan realitas perhambaan.
