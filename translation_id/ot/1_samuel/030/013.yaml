base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: id
  text: Daud bertanya kepadanya, “Milik siapakah engkau, dan dari manakah asalmu?” Jawabnya, “Aku seorang pemuda Mesir, hamba seorang Amalek. Tuanku meninggalkan aku karena aku jatuh sakit tiga hari yang lalu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: Milik siapakah engkau
  rationale: Ungkapan ini menanyakan kepada siapa orang itu terikat atau menjadi milik, bukan sekadar identitasnya; bentuk ini mempertahankan konteks perhambaan.
- source_word: נַעַר מִצְרִי
  choice: seorang pemuda Mesir
  rationale: נַעַר dapat menunjuk pemuda atau pelayan; karena עֶבֶד sesudahnya secara khusus menyatakan statusnya sebagai hamba, 'pemuda' menghindari pengulangan dan tetap sesuai konteks.
- source_word: עֶבֶד
  choice: hamba
  rationale: Dalam konteks kepemilikan dan ditinggalkan oleh tuannya, kata ini menyatakan orang yang berada dalam perhambaan; 'hamba' terdengar alami dan bermartabat dalam narasi Alkitab Indonesia.
- source_word: לְאִישׁ עֲמָלֵקִי
  choice: seorang Amalek
  rationale: Secara harfiah 'seorang laki-laki Amalek'; dalam bahasa Indonesia modern, 'seorang Amalek' secara ringkas menyatakan keanggotaan etnisnya.
- source_word: חָלִיתִי הַיּוֹם שְׁלֹשָׁה
  choice: aku jatuh sakit tiga hari yang lalu
  rationale: Idiom waktu Ibrani secara harfiah berkaitan dengan 'hari ini tiga'; dalam konteks ini maknanya adalah bahwa ia jatuh sakit tiga hari sebelumnya.
theological_decisions: []
