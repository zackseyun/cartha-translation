source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: id
  text: Kemudian Daud berkata kepada imam Abyatar, anak Ahimelekh, “Tolong bawakan efod itu kepadaku[a][b].” Maka Abyatar membawa efod itu kepada Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tolong dekatkan efod itu kepadaku” atau “Tolong hadirkan efod itu kepadaku.” Kata kerja Ibraninya berarti ‘membawa mendekat’ atau ‘menghadirkan’.'
    reason: lexical_alternative
  - marker: b
    text: Efod adalah benda atau pakaian suci keimaman yang digunakan dalam ibadah Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “kemudian” menyampaikan alur naratif secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Menunjukkan jabatan keagamaan Abyatar. Dalam aposisi nama diri, “Imam Abyatar” merupakan bentuk Indonesia yang alami dan jelas.
- source_word: בֶּן אֲחִימֶלֶךְ
  choice: anak Ahimelekh
  rationale: Frasa konstruksi ini menyatakan garis keturunan secara langsung.
- source_word: הַגִּישָׁה נָּא לִי
  choice: Tolong bawakan ... kepadaku
  rationale: Imperatif Hifil dari נגשׁ berarti menyebabkan sesuatu mendekat atau membawanya ke hadapan seseorang; “tolong” menyampaikan partikel kesopanan נָא.
- source_word: הָאֵפֹד
  choice: efod itu
  rationale: Istilah khusus bagi benda atau pakaian keimaman Israel dipertahankan sebagai transliterasi agar fungsi dan bentuknya tidak ditentukan secara berlebihan; artikel Ibrani disampaikan dengan “itu”.
- source_word: וַיַּגֵּשׁ
  choice: Maka ... membawa
  rationale: Mengulang akar kata dari perintah sebelumnya dan menyatakan pelaksanaannya; “maka” menunjukkan kelanjutan sebagai akibat.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: Preposisi menandai gerak menuju Daud.
theological_decisions:
- issue: Makna אֵפוֹד sebagai benda keagamaan yang berkaitan dengan pelayanan imam dan permohonan petunjuk ilahi
  choice: Mempertahankan transliterasi “efod” dalam teks utama
  alternative: pakaian imam; pakaian suci; benda suci imam
  rationale: Istilah Ibrani ini menunjuk pada benda atau pakaian keimaman tertentu. Dalam konteks ini, efod tampaknya berkaitan dengan permohonan petunjuk ilahi pada ayat berikutnya, tetapi ayat ini sendiri tidak merinci bentuk atau fungsinya. Transliterasi menjaga ketegangan dan kekhususan historis tanpa mempersempit makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisi dibuat alami, sedangkan istilah budaya “efod” dipertahankan dan dijelaskan melalui catatan kaki. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya.
