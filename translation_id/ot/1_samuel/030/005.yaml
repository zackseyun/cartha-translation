base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/005.yaml
  text: 'And David’s two wives had been taken captive: Ahinoam the Jezreelitess and Abigail[b][a], the wife of Nabal the Carmelite.'
translation:
  language: id
  text: 'Kedua istri Daud telah ditawan: Ahinoam, perempuan dari Yizreel, dan Abigail, istri Nabal yang berasal dari Karmel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: Kedua istri Daud
  rationale: Bentuk konstruk Ibrani berarti 'kedua istri Daud'. Hubungan dengan ayat sebelumnya tetap wajar dalam bahasa Indonesia tanpa harus menerjemahkan waw sebagai 'dan' pada awal kalimat.
- source_word: נִשְׁבּוּ
  choice: telah ditawan
  rationale: Bentuk nifal dari שׁבה menyatakan bahwa mereka dijadikan tawanan; 'telah' menandai tindakan yang sudah terjadi dalam alur sebelumnya.
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: Ahinoam, perempuan dari Yizreel
  rationale: Nisbah feminin menunjuk asal atau hubungan geografis Ahinoam dengan Yizreel. Ungkapan ini lebih alami dan jelas daripada membentuk sebutan nisbah yang tidak lazim dalam bahasa Indonesia.
- source_word: וַ/אֲבִיגַיִל אֵשֶׁת נָבָל
  choice: dan Abigail, istri Nabal
  rationale: Menerjemahkan rangkaian konstruk secara langsung dan alami, sambil mempertahankan keterangan identitas Abigail.
- source_word: הַֽ/כַּרְמְלִי
  choice: orang Karmel
  rationale: Nisbah maskulin ini menyatakan bahwa Nabal berasal dari atau terkait dengan Karmel. 'Orang Karmel' jelas bersifat geografis dalam bahasa Indonesia.
theological_decisions: []
