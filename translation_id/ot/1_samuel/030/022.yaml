  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: id
  text: Lalu semua orang jahat dan bejat di antara orang-orang yang telah pergi bersama Daud menjawab, “Karena mereka tidak pergi bersamaku,[a] kita tidak akan memberi mereka sedikit pun dari jarahan[b] yang telah kita rebut kembali. Masing-masing hanya boleh membawa istri dan anak-anaknya, lalu pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersamaku.” Para pembicara adalah suatu kelompok, tetapi teks Ibrani mempertahankan bentuk orang pertama tunggal di sini.
    reason: source_ambiguity
  - marker: b
    text: Atau “rampasan perang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: menjawab
  rationale: Kedua verba bersama-sama memperkenalkan tanggapan kelompok. Dalam bahasa Indonesia, satu verba 'menjawab' menyampaikan fungsi wacananya secara alami tanpa pengulangan kaku 'menjawab dan berkata'.
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: semua orang jahat dan tidak bermoral
  rationale: רָע menyatakan kejahatan moral, sedangkan בְלִיַּעַל di sini merupakan sebutan peyoratif bagi orang yang bejat atau tidak bermoral, bukan nama diri Belial.
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: di antara orang-orang yang pergi bersama Daud
  rationale: 'מִן memiliki fungsi partitif: para pembicara merupakan sebagian dari rombongan yang pergi bersama Daud.'
- source_word: לֹא הָלְכוּ עִמִּי
  choice: mereka tidak pergi bersamaku
  rationale: Mempertahankan akhiran orang pertama tunggal pada teks Ibrani, meskipun pembicara disebut sebagai kelompok dan klausa berikutnya memakai bentuk jamak.
- source_word: לֹא נִתֵּן לָהֶם
  choice: kita tidak akan memberi mereka
  rationale: Bentuk imperfek orang pertama jamak mengungkapkan tekad kelompok; 'tidak akan' alami dalam bahasa Indonesia.
- source_word: מֵהַשָּׁלָל
  choice: sedikit pun dari jarahan
  rationale: שָׁלָל adalah hasil rampasan perang; konstruksi partitif dengan negasi secara alami dinyatakan 'sedikit pun dari jarahan'.
- source_word: אֲשֶׁר הִצַּלְנוּ
  choice: yang telah kita rebut kembali
  rationale: Hifil נצל berarti melepaskan atau menyelamatkan; dalam konteks barang yang diambil perampok lalu diperoleh kembali, 'rebut kembali' menyampaikan makna kontekstualnya.
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: Masing-masing hanya boleh membawa istri dan anak-anaknya
  rationale: כִּי אִם memperkenalkan satu-satunya pengecualian. אִישׁ bersifat distributif, dan בָּנָיו dapat merujuk pada anak-anak dalam konteks keluarga.
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: lalu pergi
  rationale: Objek yang dibawa sudah dinyatakan oleh 'membawa'; 'lalu pergi' mempertahankan tindakan keberangkatan tanpa menghasilkan ungkapan Indonesia yang berlebihan.
theological_decisions:
- issue: Makna בְלִיַּעַל
  choice: tidak bermoral
  alternative: orang dursila; tidak berguna; Belial
  rationale: Dalam ayat ini kata tersebut berfungsi sebagai karakterisasi moral umum. Menerjemahkannya sebagai nama diri 'Belial' akan memasukkan asosiasi demonologis yang tidak dituntut konteks.
- issue: Peralihan orang gramatikal dalam kutipan
  choice: mempertahankan bentuk tunggal 'bersamaku' lalu jamak 'kita'
  alternative: menyeragamkan menjadi 'bersama kami'
  rationale: Teks Ibrani sungguh memuat עִמִּי, orang pertama tunggal, diikuti נִתֵּן dan הִצַּלְנוּ, orang pertama jamak. Ketegangan gramatikal ini dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Jarahan' dipilih sebagai istilah utama yang mudah dipahami; struktur ujaran dibuat alami sambil mempertahankan peralihan tunggal-jamak dalam sumber.
