base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: id
  text: Mereka menemukan seorang pria Mesir di ladang, lalu membawanya kepada Daud. Mereka memberinya roti, dan ia makan; mereka juga memberinya air untuk diminum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: Mereka menemukan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; dalam bahasa Indonesia, bentuk lampau dipahami dari konteks tanpa perlu menerjemahkan waw secara tersendiri.
- source_word: אִישׁ מִצְרִי
  choice: seorang pria Mesir
  rationale: Mempertahankan baik nomina אִישׁ maupun keterangan kebangsaan מִצְרִי dalam ungkapan Indonesia yang alami.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: Terjemahan langsung dan alami bagi שָׂדֶה; konteks tidak menuntut perluasan menjadi 'padang terbuka' atau 'daerah pedesaan'.
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: lalu membawanya kepada Daud
  rationale: לקח dengan orang sebagai objek dan tujuan yang disebut dapat berarti membawa atau mengambil; 'membawanya kepada Daud' paling alami sesuai arah geraknya.
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: Mereka memberinya roti
  rationale: לֶחֶם diterjemahkan secara khusus sebagai 'roti', tanpa memperluasnya menjadi 'makanan'.
- source_word: וַיֹּאכַל
  choice: dan ia makan
  rationale: Seperti bahasa Ibrani, terjemahan tidak menambahkan objek eksplisit; makanan yang dimaksud sudah jelas dari konteks.
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: mereka juga memberinya air minum
  rationale: Bentuk Hifil dari שׁקה berarti memberi minum; ungkapan ini alami dalam bahasa Indonesia dan menghindari kesan paksaan yang mungkin timbul dari 'membuatnya minum'.
