base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: id
  text: Daud datang kepada dua ratus orang yang sudah terlalu letih untuk terus mengikuti Daud[a] dan yang telah mereka tinggalkan di Sungai Besor. Orang-orang itu keluar menyambut Daud dan orang-orang yang bersamanya. Daud mendekati mereka dan menanyakan keadaan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang tertinggal dan tidak dapat melanjutkan perjalanan mengikuti Daud.”'
    reason: Kata Ibrani dapat menekankan keletihan atau keadaan tertinggal karena tidak sanggup meneruskan perjalanan.
  - marker: b
    text: 'Secara harfiah: “menanyakan kepada mereka tentang kesejahteraan.” Ungkapan Ibrani ini berarti menanyakan kabar atau keadaan seseorang.'
    reason: Menjelaskan idiom Ibrani yang secara harfiah memakai kata “damai/kesejahteraan”.
lexical_decisions:
- source_word: פִּגְּרוּ
  choice: sudah terlalu letih
  rationale: Kata kerja ini dalam konteks menyatakan bahwa kedua ratus orang itu kehabisan tenaga sehingga tidak mampu melanjutkan perjalanan; pilihan ini menyampaikan sebabnya secara alami tanpa sekadar menyebut mereka tertinggal.
- source_word: מִלֶּכֶת אַחֲרֵי דָוִד
  choice: untuk terus mengikuti Daud
  rationale: Konstruksi ini menunjuk pada ketidakmampuan melanjutkan perjalanan di belakang atau bersama Daud. Kata 'terus' menyatakan aspek keberlanjutan yang terhenti, sedangkan 'mengikuti Daud' alami dalam bahasa Indonesia.
- source_word: וַיֹּשִׁיבֻם
  choice: yang telah mereka tinggalkan
  rationale: Bentuk kausatifnya dapat berarti menyuruh tinggal, menempatkan, atau meninggalkan di suatu tempat. Dalam alur kisah, rombongan Daud meninggalkan mereka di sungai ketika melanjutkan perjalanan.
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: di Sungai Besor
  rationale: נַחַל dapat menunjuk pada sungai, alur sungai, atau wadi. 'Sungai Besor' jelas dan wajar bagi pembaca Indonesia serta mempertahankan nama tempatnya.
- source_word: לִקְרַאת
  choice: menyambut
  rationale: Dalam konteks orang-orang yang keluar untuk menemui rombongan yang kembali, 'menyambut' menyampaikan tindakan penerimaan secara alami.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: orang-orang yang bersamanya
  rationale: עָם di sini menunjuk pada kelompok yang menyertai Daud. 'Orang-orang' mempertahankan keluasan istilah Ibrani tanpa mempersempitnya menjadi tentara saja.
- source_word: וַיִּגַּשׁ ... אֶת הָעָם
  choice: Daud mendekati mereka
  rationale: נגשׁ berarti datang mendekat. Kata ganti 'mereka' menghindari pengulangan yang kaku, sementara tindakan mendekat tetap dibedakan dari pertanyaan sesudahnya.
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: menanyakan keadaan mereka
  rationale: Ungkapan Ibrani ini berarti menanyakan kesejahteraan atau kabar seseorang. Pilihan ini alami dalam bahasa Indonesia modern dan tetap lebih luas daripada sekadar salam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan nama Daud dipertahankan pada klausa pertama untuk mengikuti penekanan sumber, sedangkan kata ganti dipakai kemudian agar kalimat tetap alami. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
