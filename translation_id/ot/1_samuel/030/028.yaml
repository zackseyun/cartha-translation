  text: and to those in Aroer[a], and to those in Siphmoth, and to those in Eshtemoa[b],
translation:
  language: id
  text: dan kepada orang-orang di Aroer, kepada orang-orang di Sifmot, dan kepada orang-orang di Estemoa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: juga kepada orang-orang
  rationale: Rangkaian ini menggabungkan kata sambung, preposisi penerima, dan partikel relatif. Dalam konteks daftar penerima di berbagai kota, ungkapan Indonesia yang alami ialah “juga kepada orang-orang”; kata “juga” menghubungkannya dengan daftar pada ayat sebelumnya.
- source_word: בַּעֲרֹעֵר
  choice: di Aroer
  rationale: Nama tempat ditransliterasikan, sedangkan preposisi lokatif בְּ diterjemahkan “di”, yang wajar untuk nama kota dalam bahasa Indonesia.
- source_word: בְּשִׂפְמוֹת
  choice: di Sifmot
  rationale: Nama tempat ditransliterasikan secara dekat dengan bentuk Ibrani; preposisinya diterjemahkan “di”.
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: di Estemoa
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; preposisi lokatif diterjemahkan “di”.
