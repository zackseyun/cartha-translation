  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pola “kepada orang-orang di ...” dipertahankan pada setiap nama kota untuk mencerminkan pengulangan formula Ibrani dan penekanan pada kelompok penerima masing-masing tempat.
