  text: and to those in Hormah[a], and to those in Bor-ashan, and to those in Athach.
translation:
  language: id
  text: dan kepada mereka yang di Horma, kepada mereka yang di Bor-Asan[a], dan kepada mereka yang di Atakh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bor-Asan adalah nama tempat. Secara harfiah, unsur-unsur namanya dapat berarti “sumur/lubang asap”, tetapi di sini nama itu dialihaksarakan, bukan diterjemahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: juga kepada mereka yang
  rationale: Gabungan וְ + לַ + אֲשֶׁר dalam daftar pembagian ini menunjuk kepada para penerima yang berada di tempat-tempat yang disebutkan. 'Juga kepada mereka yang' mempertahankan hubungan datif dan kesinambungan daftar secara alami.
- source_word: בְּחָרְמָה
  choice: di Horma
  rationale: Nama tempat חָרְמָה dialihaksarakan sebagai 'Horma'; prefiks בְּ diterjemahkan secara lokatif dengan 'di'.
- source_word: בְּבוֹר עָשָׁן
  choice: di Bor-Asan
  rationale: Nama tempat dua unsur ini dialihaksarakan, bukan diterjemahkan. Tanda hubung menandai bahwa kedua unsur membentuk satu nama tempat.
- source_word: בַּעֲתָךְ
  choice: di Atakh
  rationale: Nama tempat עֲתָךְ dialihaksarakan sebagai 'Atakh', sedangkan prefiks lokatif diterjemahkan dengan 'di'.
