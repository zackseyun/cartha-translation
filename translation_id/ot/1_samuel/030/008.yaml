base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: id
  text: Lalu Daud meminta petunjuk kepada TUHAN, katanya, “Haruskah aku mengejar gerombolan perampok ini? Apakah aku akan menyusul mereka?” TUHAN menjawabnya, “Kejarlah, sebab engkau pasti akan menyusul mereka dan pasti akan menyelamatkan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada TUHAN
  rationale: Dalam konteks ini, verba שׁאל dengan בַּיהוָה berarti meminta jawaban atau petunjuk ilahi, bukan sekadar mengajukan pertanyaan biasa. Sebutan perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi Alkitab bahasa Indonesia.
- source_word: הַגְּדוּד
  choice: gerombolan perampok
  rationale: Kata ini dapat berarti pasukan atau gerombolan penyerbu; konteks serangan Amalek pada Ziklag mendukung pengertian gerombolan perampok.
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: Apakah aku akan menyusul mereka? / engkau pasti akan menyusul mereka
  rationale: נשׂג di sini menyatakan berhasil mencapai atau menyusul pihak yang dikejar. Konstruksi infinitif absolut dan verba finit menegaskan kepastian, diterjemahkan dengan 'pasti'.
- source_word: וְהַצֵּל תַּצִּיל
  choice: dan pasti akan menyelamatkan para tawanan
  rationale: Konstruksi infinitif absolut menegaskan hasil yang pasti. Objek tidak dinyatakan dalam teks Ibrani, tetapi konteks langsung menunjukkan orang-orang yang ditawan; penambahan eksplisit ini diperlukan agar bahasa Indonesia alami dan tidak menggantung.
theological_decisions:
- issue: Identitas penjawab dalam וַיֹּאמֶר לוֹ
  choice: TUHAN menjawabnya
  alternative: Ia menjawabnya
  rationale: Subjek tersirat secara gramatikal merujuk kepada TUHAN, yang kepada-Nya Daud meminta petunjuk. Menyebutkan TUHAN menghindari ambiguitas pronominal dalam bahasa Indonesia tanpa mengubah makna.
- issue: Objek tindakan penyelamatan
  choice: para tawanan
  alternative: engkau pasti akan menyelamatkan
  rationale: Teks Ibrani tidak menyebut objek secara eksplisit, tetapi narasi menyediakannya dengan jelas. Pilihan ini memperjelas maksud dalam bahasa Indonesia, bukan menentukan isu doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'pasti' mempertahankan penegasan ganda dalam teks Ibrani, sedangkan bentuk pertanyaan dibuat alami bagi pembaca umum.
