  source_fidelity: Draf dengan tepat menerjemahkan rentang waktu מֵהַיּוֹם הַהוּא וָמָעְלָה, subjek tersirat Daud, serta pasangan normatif חֹק dan מִשְׁפָּט. Namun, susunan sekarang membuat keterangan “sampai hari ini” secara sintaktis dapat terbaca membatasi tindakan Daud “menetapkannya”, padahal ungkapan itu menyatakan keberlakuan keadaan/ketentuan itu sampai masa narator. Pembukaan וַיְהִי (“dan demikianlah/hal itu berlaku”) juga sebaiknya dinyatakan.
  naturalness: Bahasa draf baku dan jelas, tetapi “Sejak hari itu dan seterusnya, Daud menetapkannya ... sampai hari ini” kurang tepat lingkup keterangannya dalam bahasa Indonesia. Revisi menempatkan keberlanjutan ketentuan sebagai pokok kalimat sehingga pembaca tidak memahami bahwa Daud terus menetapkan sesuatu hingga hari ini.
  terminology: “Ketetapan dan peraturan” merupakan padanan modern yang wajar untuk חֹק dan מִשְׁפָּט dalam konteks norma. Catatan kaki “keputusan hukum” menyajikan alternatif leksikal yang sah tanpa memaksakan pembacaan sempit.
