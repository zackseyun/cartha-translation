translation:
  language: id
  text: 'Demikianlah hal itu berlaku sejak hari itu dan seterusnya sampai hari ini: Daud menetapkannya sebagai ketetapan dan peraturan bagi Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Daud menetapkannya sebagai ketetapan dan keputusan hukum bagi Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: Sejak hari itu dan seterusnya
  rationale: Ungkapan Ibrani ini menandai keadaan yang mulai berlaku pada hari tersebut dan berlanjut sesudahnya. Bentuk Indonesia ini alami dan mempertahankan daya duratifnya.
- source_word: וַיְשִׂמֶהָ
  choice: Daud menetapkannya
  rationale: שׂים dalam konteks norma berarti menetapkan. Subjek tersiratnya adalah Daud berdasarkan konteks ayat sebelumnya; penyebutan namanya memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: לְחֹק
  choice: sebagai ketetapan
  rationale: חֹק menunjuk pada ketentuan yang ditetapkan dan bersifat mengikat; 'ketetapan' mempertahankan nuansa formal dan normatif.
- source_word: וּלְמִשְׁפָּט
  choice: dan peraturan
  rationale: מִשְׁפָּט memiliki rentang makna keputusan hukum, hukum, atau aturan. Dalam pasangan dengan חֹק, 'peraturan' menyampaikan norma yang mengikat secara alami dalam bahasa Indonesia.
- source_word: לְיִשְׂרָאֵל
  choice: bagi Israel
  rationale: Preposisi ל menandai pihak yang dikenai ketentuan tersebut; 'bagi Israel' tepat dan tetap formal.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan baku Ibrani ini menyatakan bahwa ketentuan tersebut masih berlaku hingga masa narator.
