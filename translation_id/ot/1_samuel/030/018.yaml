translation:
  language: id
  text: Daud merebut kembali semua yang telah diambil Amalek,[a] dan Daud menyelamatkan kedua istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyelamatkan” dalam kedua klausa. Bahasa Ibrani memakai verba yang sama, tetapi bahasa Indonesia lebih alami memakai “merebut kembali” untuk apa yang telah diambil dan “menyelamatkan” untuk kedua istri Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: merebut kembali / menyelamatkan
  rationale: Akar Ibrani yang sama dipakai dua kali. Dengan objek segala yang dirampas, “merebut kembali” wajar dalam bahasa Indonesia; dengan objek kedua istrinya, “menyelamatkan” lebih alami. Variasi ini mengikuti konteks tanpa mengaburkan kesamaan verba sumber.
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: semua yang telah dirampas Amalek
  rationale: כָּל אֲשֶׁר berarti “semua yang”; bentuk naratif לָקְחוּ menunjuk pada tindakan yang mendahului pemulihan oleh Daud. “Dirampas” mengungkapkan pengambilan sebagai jarahan dalam konteks ini.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama tunggal kolektif dalam teks Ibrani dipertahankan, bukan diubah menjadi “orang Amalek”.
- source_word: שְׁתֵּי נָשָׁיו
  choice: kedua istrinya
  rationale: Ungkapan ini mempertahankan jumlah dua dan terdengar alami dalam bahasa Indonesia.
- source_word: דָּוִד ... דָּוִד
  choice: Daud ... Daud
  rationale: Pengulangan nama Daud pada kedua klausa dipertahankan sesuai teks Ibrani untuk menjaga penekanan dan struktur ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Kedua istrinya” dipilih daripada “dua istrinya” untuk menunjuk pada dua istri Daud yang sudah dikenal dalam konteks.
