base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: id
  text: “Siapa yang akan mendengarkan kalian[a] dalam perkara ini? Sebab bagian orang yang turun ke medan pertempuran sama dengan bagian orang yang tinggal di dekat perlengkapan[b]; mereka akan berbagi sama rata.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengindahkan kalian” atau “menaati kalian.” Kata kerja Ibrani ini dapat memiliki ketiga arti tersebut, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “barang bawaan” atau “peralatan.” Istilah Ibrani ini dapat menunjuk secara luas pada barang, perkakas, perlengkapan, atau barang bawaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Siapa
  rationale: Kata tanya ini membuka sanggahan retoris Daud. Konjungsi וּ tidak perlu diterjemahkan tersendiri karena hubungan dengan ucapan sebelumnya sudah jelas dalam bahasa Indonesia.
- source_word: יִשְׁמַע לָכֶם
  choice: akan mendengarkan kalian
  rationale: שׁמע dengan ל dapat berarti mendengarkan, mengindahkan, atau menaati. ‘Mendengarkan kalian’ mempertahankan keluasan maknanya dan wajar sebagai pertanyaan retoris.
- source_word: לַדָּבָר הַזֶּה
  choice: dalam perkara ini
  rationale: דבר di sini menunjuk pada persoalan atau usul yang sedang diperdebatkan, bukan sekadar sebuah perkataan.
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi penolakan Daud terhadap usul tersebut.
- source_word: כְּחֵלֶק ... וּכְחֵלֶק
  choice: bagian ... sama dengan bagian
  rationale: Susunan perbandingan Ibrani menegaskan bahwa kedua kelompok menerima bagian yang setara. Ungkapan Indonesia ini menyampaikan perbandingan itu dengan jelas tanpa menghilangkan gagasan ‘bagian’.
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: orang yang turun ke medan pertempuran
  rationale: Terjemahan ini mempertahankan idiom Ibrani ‘turun’ sekaligus memakai ungkapan Indonesia yang alami untuk keterlibatan dalam pertempuran.
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: orang yang tinggal menjaga perlengkapan
  rationale: יֹשֵׁב secara harfiah berarti ‘duduk’ atau ‘tinggal’, sedangkan konteks menunjukkan bahwa orang-orang ini tetap di belakang bersama barang-barang. ‘Menjaga’ memperjelas fungsi kontekstual tanpa mengubah perbandingan utama.
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: mereka akan membaginya bersama-sama
  rationale: יַחְדָּו menandai kebersamaan atau kesetaraan dalam pembagian, sedangkan חלק berarti membagi atau membagikan. Bentuk ini mempertahankan tindakan pembagian hasil rampasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan berwibawa. Pertanyaan retoris dipertahankan, idiom ‘turun’ tidak diratakan menjadi sekadar ‘berperang’, dan keluasan makna istilah untuk perlengkapan dijelaskan dalam catatan kaki.
