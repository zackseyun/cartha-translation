  to: “Siapa yang akan mendengarkan kalian[a] dalam perkara ini? Sebab bagian orang yang turun ke medan pertempuran sama dengan bagian orang yang tinggal di dekat perlengkapan[b]; mereka akan berbagi sama rata.”
  rationale: Revisi menghilangkan tambahan makna “menjaga” dan mengganti penutup dengan ungkapan Indonesia yang secara jelas menyatakan pembagian yang setara, tanpa menambahkan objek yang tidak tersurat. Ambiguitas leksikal utama tetap dipelihara dalam catatan kaki.
