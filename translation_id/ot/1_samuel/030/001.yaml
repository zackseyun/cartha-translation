  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/בֹ֨א דָוִ֧ד וַ/אֲנָשָׁ֛י/ו צִֽקְלַ֖ג בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י וַ/עֲמָלֵקִ֣י פָֽשְׁט֗וּ אֶל נֶ֨גֶב֙ וְ/אֶל צִ֣קְלַ֔ג וַ/יַּכּוּ֙ אֶת צִ֣קְלַ֔ג וַ/יִּשְׂרְפ֥וּ אֹתָ֖/הּ בָּ/אֵֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: id
  text: Ketika Daud dan orang-orangnya tiba di Ziklag pada hari ketiga, orang Amalek telah menyerbu Negeb[a] dan Ziklag. Mereka telah menyerang Ziklag dan membakarnya dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wilayah selatan”; kata Ibrani negeb dapat berarti daerah selatan secara umum atau kawasan khusus yang dikenal sebagai Negeb.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: Ketika ... tiba
  rationale: Rangkaian ini memperkenalkan keadaan waktu saat Daud sampai. Bentuk “ketika ... tiba” menyampaikan fungsi naratifnya secara alami tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: וַאֲנָשָׁיו
  choice: dan orang-orangnya
  rationale: Dalam konteks ini אֲנָשִׁים menunjuk kepada para lelaki yang menyertai Daud. “Orang-orangnya” akurat dan lebih dekat dengan teks daripada penafsiran yang lebih khusus seperti “pasukannya” atau “anak buahnya”.
- source_word: צִקְלַג
  choice: Ziklag
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Padanan langsung dan alami bagi keterangan waktu tersebut.
- source_word: וַעֲמָלֵקִי
  choice: orang Amalek
  rationale: Walaupun bentuk Ibraninya tunggal kolektif, verba-verba jamak sesudahnya menunjukkan bahwa yang dimaksud ialah kelompok orang Amalek.
- source_word: פָשְׁטוּ
  choice: telah menyerbu
  rationale: Dalam konteks militer, פשט berarti melakukan penyerbuan atau serangan perampasan. “Telah” memperjelas bahwa serangan itu terjadi sebelum Daud tiba.
- source_word: אֶל נֶגֶב
  choice: Negeb
  rationale: נֶגֶב dapat menunjuk kepada kawasan geografis Negeb maupun daerah selatan secara umum. Nama “Negeb” dipakai dalam teks utama, sedangkan kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: Mereka telah menyerang Ziklag
  rationale: נכה memiliki cakupan arti memukul, menghantam, atau menyerang. Dalam konteks serangan atas sebuah kota, “menyerang” paling alami dalam bahasa Indonesia dan tidak menentukan rincian yang tidak diberikan teks.
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: dan membakarnya dengan api
  rationale: Terjemahan ini mempertahankan ungkapan eksplisit Ibrani “membakarnya dengan api” dan pronomina feminin yang merujuk kepada Ziklag diterjemahkan sebagai “-nya”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat dibagi menjadi dua agar rangkaian tindakan mudah dipahami tanpa mengubah hubungan waktunya. Bentuk lampau dengan “telah” menandai bahwa penyerbuan dan penyerangan sudah terjadi sebelum kedatangan Daud.
