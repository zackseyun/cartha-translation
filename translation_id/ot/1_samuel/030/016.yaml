base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: id
  text: Ia menuntunnya turun, dan tampaklah mereka tersebar di seluruh wilayah itu[a], sambil makan, minum, dan bersukaria atas begitu banyak hasil jarahan[b] yang telah mereka rampas dari negeri orang Filistin dan dari negeri Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terpencar di seluruh wilayah itu.” Bentuk Ibrani dapat menekankan keadaan tercerai atau penyebaran yang luas.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersukaria karena begitu banyak hasil jarahan.” Kata depan Ibrani dapat menunjukkan alasan atau hal yang menjadi dasar sukacita mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: Ia menuntunnya turun
  rationale: Bentuk Hifil dari ירד berarti menyebabkan atau membawa seseorang turun. “Menuntunnya turun” mempertahankan arah gerak dan peran orang Mesir sebagai penunjuk jalan, sedangkan pronomina sumber tetap dipertahankan tanpa menambahkan nama yang tidak ada dalam ayat.
- source_word: וְהִנֵּה
  choice: dan tampaklah
  rationale: הִנֵּה menarik perhatian kepada pemandangan yang tiba-tiba terlihat. “Tampaklah” memberi efek pengungkapan yang hidup dan tetap wajar dalam narasi Indonesia yang bermartabat.
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: mereka tersebar di seluruh wilayah itu
  rationale: Partisip pasif נְטֻשִׁים menggambarkan kelompok yang tersebar atau terpencar. “Wilayah itu” menyampaikan אֶרֶץ sebagai kawasan setempat yang terlihat oleh Daud, bukan seluruh bumi.
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: sambil makan, minum, dan bersukaria
  rationale: Ketiga partisip menggambarkan tindakan yang sedang berlangsung. “Bersukaria” menyampaikan perayaan riang tanpa meleburkan tindakan makan dan minum ke dalam satu parafrasa.
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: atas begitu banyak hasil jarahan
  rationale: “Atas” secara alami dapat menandai alasan atau hal yang menjadi dasar sukacita. “Begitu banyak hasil jarahan” menyampaikan besarnya jarahan secara idiomatis dalam bahasa Indonesia.
- source_word: אֲשֶׁר לָקְחוּ
  choice: yang telah mereka rampas
  rationale: Bentuk perfek menunjukkan tindakan perampasan yang sudah terjadi sebelum mereka bersukaria. “Rampas” sesuai dengan konteks penyerbuan dan jarahan perang.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: dari negeri orang Filistin dan dari negeri Yehuda
  rationale: Pengulangan “dari negeri” mempertahankan kesejajaran kedua frasa wilayah. “Orang Filistin” merupakan bentuk Indonesia yang jelas untuk nama bangsa, sedangkan “Yehuda” tetap menunjuk wilayah tersebut.
