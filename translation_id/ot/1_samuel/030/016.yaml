translation_notes:
  register: Bahasa Indonesia modern yang naratif dan bermartabat. Susunan tindakan dibuat mengalir dengan “sambil”, sedangkan “tampaklah” mempertahankan daya pengungkapan הִנֵּה. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
