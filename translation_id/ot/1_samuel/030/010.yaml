base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/010.yaml
  text: So David pursued[a], he and four hundred men, while two hundred men stayed behind[b], who were too exhausted to cross the Brook Besor.
translation:
  language: id
  text: Lalu Daud bersama empat ratus orang mengejar, sedangkan dua ratus orang tetap tinggal karena terlalu letih untuk menyeberangi Wadi Besor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Besor.” Kata Ibrani yang diterjemahkan “wadi” dapat merujuk pada aliran air, lembah sungai, atau dasar sungai musiman.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: melanjutkan pengejaran
  rationale: Bentuk naratif רדף berarti mengejar. Dalam konteks ayat sebelumnya, “melanjutkan pengejaran” secara alami menandakan bahwa Daud dan sebagian pasukannya meneruskan pengejaran.
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: bersama empat ratus orang
  rationale: Ungkapan harfiah “dia dan empat ratus orang” menyatakan Daud beserta kelompoknya; “bersama” menghasilkan bahasa Indonesia yang alami tanpa mengubah jumlah atau pelakunya.
- source_word: וַיַּעַמְדוּ
  choice: tetap tinggal
  rationale: עמד secara dasar berarti berdiri atau berhenti, tetapi di sini menggambarkan dua ratus orang yang tidak meneruskan perjalanan; “tetap tinggal” menyampaikan fungsi naratifnya dengan jelas.
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: karena terlalu letih untuk menyeberangi
  rationale: Dalam konteks ini פגר menggambarkan keadaan lemah atau kehabisan tenaga sehingga mereka tidak sanggup menyeberang. Terjemahan ini menyampaikan keadaan sekaligus akibatnya secara wajar.
- source_word: נַחַל הַבְּשׂוֹר
  choice: Wadi Besor
  rationale: נחל dapat menunjuk pada aliran air, lembah sungai, atau dasar sungai musiman. “Wadi” mempertahankan sifat geografis yang tidak selalu tersampaikan oleh “sungai”.
