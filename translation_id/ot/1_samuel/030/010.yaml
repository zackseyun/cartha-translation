translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kontras antara empat ratus orang yang meneruskan pengejaran dan dua ratus orang yang tertinggal. Istilah “wadi” dipakai demi ketepatan geografis dan dijelaskan dalam catatan kaki.
