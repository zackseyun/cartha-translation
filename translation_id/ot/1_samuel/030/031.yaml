  text: and to those in Hebron[a], and to all the places where David and his men had gone about.
translation:
  language: id
  text: juga kepada orang-orang di Hebron dan kepada semua tempat yang pernah didatangi[a] Daud dan anak buahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang pernah dijelajahi” atau “yang pernah mereka datangi berkeliling.” Kata kerja Ibrani menyiratkan pergerakan berulang dari satu tempat ke tempat lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְר֑וֹן
  choice: juga kepada orang-orang di Hebron
  rationale: Gabungan preposisi dan kata relatif ini secara idiomatis meneruskan daftar penerima dari ayat sebelumnya. Karena yang menerima pemberian adalah penduduknya, bukan kotanya, objek jamak yang tersirat dinyatakan sebagai “orang-orang”.
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת
  choice: dan kepada semua orang di tempat-tempat
  rationale: Bahasa Ibrani secara harfiah menyebut “semua tempat” sebagai penerima secara metonimis. Bahasa Indonesia yang alami menjelaskan bahwa yang dimaksud ialah orang-orang di tempat-tempat itu.
- source_word: אֲשֶֽׁר ... שָׁ֥ם
  choice: yang
  rationale: Unsur lokatif שָׁם tercakup secara alami dalam konstruksi relatif “di tempat-tempat yang”; menerjemahkannya lagi sebagai “di sana” akan terasa berulang.
- source_word: הִתְהַלֶּךְ
  choice: dahulu didatangi ... dalam pengembaraan mereka
  rationale: Bentuk hitpael menyiratkan pergerakan yang berulang dari satu tempat ke tempat lain. Ungkapan ini menyampaikan perjalanan berkeliling tanpa membatasinya pada tindakan berjalan kaki.
- source_word: דָּוִד הוּא וַ/אֲנָשָׁיו
  choice: Daud dan anak buahnya
  rationale: Pronomina mandiri הוּא bersifat melanjutkan atau menegaskan subjek Daud, tetapi tidak perlu diterjemahkan sebagai “sendiri” karena Daud justru disertai orang-orangnya. אֲנָשָׁיו dalam konteks ini menunjuk pada kelompok pengikut atau pasukan Daud, yang secara alami disebut “anak buahnya”.
