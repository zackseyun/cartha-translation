  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: id
  text: Lalu Daud pergi bersama keenam ratus orang yang menyertainya. Mereka sampai di Sungai Besor[a], dan orang-orang yang tertinggal tetap tinggal di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sungai Besor” juga dapat diterjemahkan “Wadi Besor,” yaitu alur sungai musiman atau jurang.
    reason: cultural_note
  - marker: b
    text: Atau, “dan orang-orang yang tersisa tetap tinggal”; secara harfiah, “dan orang-orang yang tersisa berdiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: Lalu Daud pergi bersama keenam ratus orang yang menyertainya
  rationale: Wayyiqtol menggerakkan alur narasi, sehingga 'Lalu' alami dalam bahasa Indonesia. הוּא bersifat emfatis/apposisional, tetapi konstruksi 'bersama' menyampaikan bahwa Daud dan seluruh kelompok itu berangkat tanpa menghasilkan susunan yang kaku.
- source_word: וַיָּבֹאוּ
  choice: Mereka sampai
  rationale: Bentuk jamak mencakup Daud dan orang-orangnya. 'Sampai' menyatakan tibanya mereka di tujuan antara secara alami.
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: di Sungai Besor
  rationale: נַחַל dapat menunjuk sungai kecil, alur air, atau wadi. 'Sungai Besor' mudah dipahami pembaca Indonesia, sementara catatan kaki mempertahankan nuansa geografisnya.
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: dan orang-orang yang tertinggal berhenti di sana
  rationale: הַנּוֹתָרִים menunjuk mereka yang tidak melanjutkan perjalanan, sedangkan עָמָדוּ secara harfiah berarti 'berdiri' tetapi dalam konteks perjalanan bermakna berhenti atau tetap tinggal. 'Di sana' dibuat eksplisit secara wajar dari konteks lokasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur narasi dipecah menjadi dua kalimat agar jelas tanpa menghilangkan urutan unsur Ibrani. Istilah geografis yang mudah dipahami dipakai dalam teks, dengan nuansa נַחַל dijelaskan dalam catatan kaki.
