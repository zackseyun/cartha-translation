    rationale: 'Frasa "masih tersisa" menambahkan nuansa yang tidak diperlukan, sedangkan catatan sebaiknya menyajikan alternatif yang langsung: "orang-orang yang tersisa tetap tinggal" dan bentuk harfiahnya "orang-orang yang tersisa berdiri."'
  - severity: low
