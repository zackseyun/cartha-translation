  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: id
  text: Namun Daud berkata, “Janganlah kamu melakukan hal itu, saudara-saudaraku, mengenai apa yang telah Yahweh berikan kepada kita.[a] Ia telah melindungi kita dan menyerahkan ke dalam kekuasaan kita gerombolan penyerbu yang datang menyerang kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan apa yang telah Yahweh berikan kepada kita.” Konstruksi Ibrani di sini padat dan memperkenalkan pokok perkara yang sedang dibicarakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: Jangan berbuat demikian
  rationale: Menyampaikan larangan langsung kepada sejumlah orang dengan bahasa Indonesia yang wajar dan tegas.
- source_word: אֶחָי
  choice: saudara-saudaraku
  rationale: Mempertahankan sapaan persaudaraan harfiah yang dipakai Daud kepada para prajuritnya.
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: terhadap apa yang telah Yahweh berikan kepada kita
  rationale: Konstruksi Ibrani ini padat dan memperkenalkan perkara yang sedang dibicarakan, yakni perlakuan terhadap jarahan sebagai pemberian Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat secara langsung dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: Ia telah melindungi kita
  rationale: Dalam konteks pertempuran, kata kerja שׁמר menunjuk pada penjagaan atau perlindungan yang berhasil.
- source_word: הַגְּדוּד
  choice: gerombolan penyerbu
  rationale: Dalam konteks ini גְּדוּד adalah kelompok musuh yang melakukan penyerbuan, bukan sekadar pasukan umum.
- source_word: הַבָּא עָלֵינוּ
  choice: yang datang menyerang kita
  rationale: Mengungkapkan gerak mendatangi sekaligus maksud bermusuhan dari kelompok tersebut dalam bahasa Indonesia alami.
- source_word: בְּיָדֵנוּ
  choice: ke dalam kekuasaan kita
  rationale: Menerjemahkan idiom Ibrani 'ke dalam tangan kita' berdasarkan maknanya, yaitu berada di bawah kuasa atau kendali.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk Yahweh mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung dibuat tegas tetapi tetap bernada persaudaraan. Idiom בְּיָדֵנוּ diterjemahkan secara maknawi agar langsung dipahami pembaca umum.
