id: 1SA.3.1
reference: 1 Samuel 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: id
  text: Samuel yang masih muda melayani Yahweh di hadapan Eli, dan firman Yahweh jarang pada masa itu; penglihatan tidak tersebar luas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “tidak ada penglihatan yang merebak.” Ungkapan Ibrani ini juga dapat diterjemahkan “tidak ada penglihatan yang sering terjadi.” Maksudnya, penglihatan sebagai penyataan ilahi tidak umum pada masa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר שְׁמוּאֵל
  choice: Samuel yang masih muda
  rationale: הַנַּעַר menunjuk Samuel sebagai anak atau orang muda. Ungkapan ini menyampaikan usianya secara alami tanpa menambahkan kata temporal yang tidak ada dalam teks.
- source_word: מְשָׁרֵת
  choice: melayani
  rationale: Bentuk partisipel menyatakan pelayanan yang sedang berlangsung. Dalam konteks tempat kudus, 'melayani' mempertahankan nuansa pelayanan keagamaan tanpa terdengar terlalu teknis.
- source_word: אֶת־יְהוָה
  choice: Yahweh
  rationale: Yahweh adalah pihak yang dilayani Samuel; nama perjanjian ilahi diterjemahkan secara langsung.
- source_word: לִפְנֵי עֵלִי
  choice: di hadapan Eli
  rationale: Terjemahan ini mempertahankan arti dasar לִפְנֵי, yakni 'di hadapan/dalam kehadiran', sambil membiarkan konteks menyiratkan pengawasan Eli tanpa mengubahnya secara eksplisit menjadi 'di bawah bimbingan'.
- source_word: דְבַר־יְהוָה
  choice: firman Yahweh
  rationale: Ungkapan baku ini mempertahankan konstruksi Ibrani dan menunjuk pada penyataan ilahi.
- source_word: יָקָר
  choice: jarang
  rationale: Walaupun kata ini juga dapat berarti 'berharga', konteks berikutnya menunjukkan kelangkaan penyataan; karena itu 'jarang' paling sesuai.
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: penglihatan tidak sering terjadi
  rationale: חָזוֹן dipahami secara kolektif sebagai penglihatan penyataan, sedangkan נִפְרָץ menggambarkan sesuatu yang merebak atau tersebar. Terjemahan ini menyampaikan bahwa penglihatan demikian tidak umum tanpa mempertahankan idiom yang kabur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum untuk Tuhan.
- issue: Makna kelangkaan firman dan penglihatan
  choice: Penyataan ilahi jarang terjadi
  alternative: Firman itu sangat berharga dan penglihatan tidak terbuka
  rationale: Hubungan antarklausa mendukung makna kelangkaan, tetapi terjemahan tidak menyimpulkan bahwa penyataan sama sekali berhenti.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat dibagi menjadi dua agar mudah dibaca. 'Di hadapan Eli' dipertahankan untuk menjaga keluasan makna frasa Ibrani, sedangkan 'penglihatan tidak sering terjadi' mengungkapkan idiom sumber secara jelas bagi pembaca umum.
