  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: id
  text: Yahweh terus menampakkan diri di Silo, sebab Yahweh menyatakan diri kepada Samuel di Silo melalui firman Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: terus
  rationale: Konstruksi יָסַף dengan infinitif menyatakan tindakan yang berlanjut atau terjadi kembali; “terus” alami dalam bahasa Indonesia dan menyiratkan keberulangan dalam konteks.
- source_word: לְהֵרָאֹה
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה di sini menunjuk pada manifestasi ilahi; “menampakkan diri” lebih jelas dan wajar daripada bentuk pasif harfiah “terlihat”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: di Silo
  rationale: Preposisi ב bersifat lokatif; “di Silo” merupakan ungkapan tempat yang alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan dasar penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan tersebut secara ringkas.
- source_word: נִגְלָה
  choice: menyatakan diri
  rationale: Bentuk Nifal dari גלה menyatakan penyingkapan atau manifestasi diri. Pilihan ini mempertahankan perbedaan leksikal dari לְהֵרָאֹה tanpa menentukan secara berlebihan wujud manifestasinya.
- source_word: אֶל שְׁמוּאֵל
  choice: kepada Samuel
  rationale: Padanan arah yang baku dan alami untuk אֶל dalam konstruksi ini.
- source_word: בִּדְבַר יְהוָה
  choice: melalui firman Yahweh
  rationale: 'ב dipahami secara instrumental: firman Yahweh adalah sarana penyingkapan. “Melalui” menyampaikan fungsi ini secara alami dalam bahasa Indonesia.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Sifat manifestasi ilahi
  choice: Mempertahankan bahasa penampakan dan penyataan melalui firman tanpa menentukan modusnya
  alternative: Menafsirkannya secara khusus sebagai penglihatan semata atau penampakan jasmani
  rationale: Teks memakai dua ungkapan, “menampakkan diri” dan “menyatakan diri ... melalui firman Yahweh.” Terjemahan mempertahankan keduanya tanpa memaksakan penjelasan teologis yang lebih khusus daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Susunan kalimat mempertahankan pengulangan nama Yahweh dan hubungan sebab-akibat dalam teks Ibrani. Tidak diperlukan catatan kaki karena makna instrumental בִּדְבַר dapat disampaikan langsung dengan “melalui” tanpa kehilangan ambiguitas teologis utama.
