source:
  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: id
  text: Seluruh Israel, dari Dan sampai Bersyeba, mengetahui bahwa Samuel telah diteguhkan sebagai nabi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah terbukti dapat dipercaya sebagai nabi Yahweh.” Kata Ibrani yang digunakan dapat berarti terbukti dapat dipercaya, diteguhkan, atau ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: mengetahui
  rationale: Bentuk verba ini menyatakan pengetahuan atau pengakuan yang telah tersebar luas; “mengetahui” merupakan padanan ringkas dan alami dalam konteks ini.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif nasional dipertahankan tanpa mengubahnya menjadi parafrasa “semua orang Israel”.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Merisme geografis ini menunjuk seluruh wilayah Israel; nama tempat dan bentuk ungkapannya dipertahankan.
- source_word: נֶאֱמָן
  choice: telah diteguhkan
  rationale: Partisipel Nifal dari אמן dapat menyatakan bahwa seseorang terbukti dapat dipercaya, ditetapkan, atau dikukuhkan. Dalam konteks ayat sebelumnya, ungkapan ini menyatakan bahwa kedudukan kenabian Samuel telah terbukti sah, tanpa menjadikannya istilah teknis penahbisan.
- source_word: לְנָבִיא
  choice: sebagai nabi
  rationale: Preposisi לְ menandai peran atau status; “sebagai nabi” alami dan tepat dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: nabi Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”; hubungan yang ditandai לְ diungkapkan secara idiomatis sebagai nabi yang menjadi milik atau diutus oleh Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankan nama diri tersebut.
- issue: Makna נֶאֱמָן dalam pengakuan atas Samuel
  choice: telah diteguhkan sebagai nabi
  alternative: terbukti dapat dipercaya sebagai nabi
  rationale: Konteks menekankan bahwa perkataan Samuel terbukti benar sehingga statusnya sebagai nabi diakui. Pilihan utama mempertahankan dimensi pengukuhan publik, sedangkan catatan kaki mencatat nuansa keterandalan yang juga terkandung dalam kata Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bersyeba” memakai ejaan nama Alkitab yang lazim. Koma mengapit ungkapan geografis agar kalimat mudah dibaca.
