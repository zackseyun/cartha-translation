  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: id
  text: Lalu Eli berkata kepada Samuel, “Pergilah, berbaringlah. Jika ia memanggilmu, katakanlah, ‘Berbicaralah, Yahweh, sebab hamba-Mu mendengarkan.’” Maka Samuel pergi dan berbaring di tempatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Eli berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: לֵךְ שְׁכָב
  choice: Pergilah, berbaringlah
  rationale: Dua bentuk imperatif dipertahankan sebagai dua perintah langsung tanpa menambahkan gagasan “tidur” yang hanya tersirat.
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Konstruksi ini memperkenalkan keadaan bersyarat. “Jika” mempertahankan sifat kondisional tanpa mengubahnya menjadi kepastian dengan “ketika”.
- source_word: יִקְרָא אֵלֶיךָ
  choice: Dia memanggilmu
  rationale: Subjek maskulin tunggal tersirat. Konteks menunjukkan bahwa Eli telah memahami sang pemanggil sebagai Yahweh; kapitalisasi “Dia” membantu rujukan dalam bahasa Indonesia tanpa menambahkan nama ilahi ke klausa ini.
- source_word: וְאָמַרְתָּ
  choice: katakanlah
  rationale: Dalam konstruksi sesudah syarat, bentuk ini menyampaikan instruksi sebagai konsekuensinya; imperatif Indonesia paling alami.
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Menerjemahkan imperatif secara langsung dan wajar sebagai permintaan agar sang pemanggil menyampaikan firman-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi permintaan tersebut dengan gaya yang ringkas dan bermartabat.
- source_word: שֹׁמֵעַ
  choice: mendengarkan
  rationale: Partisip ini menyatakan kesiapan yang sedang berlangsung dan perhatian aktif, lebih tepat daripada sekadar “mendengar”.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam konteks ini עבד merupakan sebutan diri yang merendah di hadapan Allah; “hamba” sesuai dengan register doa dan tidak menonjolkan status perbudakan.
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: Maka Samuel pergi dan berbaring
  rationale: Dua verba berurutan meneruskan narasi dan menyatakan bahwa Samuel melaksanakan petunjuk Eli.
- source_word: בִּמְקוֹמוֹ
  choice: di tempatnya
  rationale: Terjemahan langsung yang tidak menambahkan bahwa tempat itu “biasa” atau “khusus” baginya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan fungsi nama tersebut, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Subjek tersirat pada יִקְרָא
  choice: Dia memanggilmu
  alternative: seseorang memanggilmu
  rationale: Bahasa Ibrani tidak menyebutkan subjek secara eksplisit, tetapi konteks langsung menunjukkan bahwa Eli telah menyadari Yahweh sebagai pemanggil. Terjemahan ini mempertahankan rujukan kontekstual tanpa mengulang nama-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Bentuk sapaan “hamba-Mu” mempertahankan penghormatan kepada Allah; tanda koma dalam seruan “Berbicaralah, Yahweh” menandai sapaan langsung.
