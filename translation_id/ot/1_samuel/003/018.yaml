base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: id
  text: Lalu Samuel memberitahukan kepadanya seluruh perkataan itu dan tidak menyembunyikan apa pun darinya. Eli berkata, “Dialah Yahweh. Biarlah Dia melakukan[a] apa yang baik dalam pandangan-Nya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia akan melakukan apa yang baik dalam pandangan-Nya.” Bentuk imperfek Ibrani dapat dipahami sebagai ungkapan penyerahan, “Biarlah Dia melakukan,” atau sebagai pernyataan masa depan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “yang baik di mata-Nya,” suatu ungkapan Ibrani yang berarti apa yang baik menurut penilaian-Nya atau apa yang dipandang-Nya baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: Lalu Samuel memberitahukan kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyampaikan. “Memberitahukan” alami dalam bahasa Indonesia dan mempertahankan arah komunikasi kepada Eli.
- source_word: אֶת כָּל הַדְּבָרִים
  choice: segala firman itu
  rationale: דְּבָרִים dapat berarti perkataan atau hal-hal. Dalam konteks ini yang disampaikan ialah pesan ilahi yang baru diterima Samuel, sehingga “segala firman itu” mempertahankan unsur verbal dan cakupan keseluruhannya.
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: dan tidak menyembunyikan apa pun darinya
  rationale: כחד menyatakan tindakan menyembunyikan atau menahan informasi. Ungkapan ini mempertahankan penegasan bahwa Samuel menyampaikan semuanya tanpa kecuali.
- source_word: יְהוָה הוּא
  choice: Dialah Yahweh
  rationale: Kalimat nominal ini menempatkan nama ilahi bersama pronomina yang bersifat menegaskan. “Dialah Yahweh” ringkas, wajar, dan menyampaikan penekanan tersebut.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: apa yang baik dalam pandangan-Nya
  rationale: Terjemahan ini mempertahankan gambaran idiomatis Ibrani “yang baik di matanya” dalam bentuk Indonesia yang alami tanpa menghilangkan unsur penilaian dari sudut pandang Yahweh.
- source_word: יַעֲשֶׂה
  choice: Biarlah Dia melakukan
  rationale: Dalam tanggapan Eli terhadap berita penghukuman, bentuk imperfek ini secara kontekstual dapat mengungkapkan penerimaan atau penyerahan diri. Namun, kemungkinan arti masa depan tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar. Transliterasi “Yahweh” mempertahankan nama tersebut.
- issue: Daya ungkap יַעֲשֶׂה dalam jawaban Eli
  choice: Biarlah Dia melakukan
  alternative: Dia akan melakukan
  rationale: Konteks mendukung ungkapan penyerahan atau penerimaan terhadap keputusan Yahweh, tetapi bentuk imperfek Ibrani juga dapat dibaca sebagai pernyataan masa depan; ambiguitas ini dipertahankan melalui catatan kaki.
- issue: Identitas subjek וַיֹּאמַר
  choice: Eli berkata
  alternative: Ia berkata
  rationale: Subjek tidak disebut ulang dalam bahasa Ibrani, tetapi alur percakapan menunjukkan bahwa Eli menjawab Samuel. Menyebut “Eli” memperjelas rujukan tanpa menambahkan tafsir teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi tetap mudah dipahami. Kapitalisasi pronomina ilahi dipakai secara konsisten dalam kutipan. Susunan “Dialah Yahweh” mempertahankan penekanan teks Ibrani, sedangkan “dalam pandangan-Nya” membawa idiom sumber ke dalam ungkapan Indonesia yang wajar.
