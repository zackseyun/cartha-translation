  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָ/כֵ֥ן נִשְׁבַּ֖עְתִּי לְ/בֵ֣ית עֵלִ֑י אִֽם יִתְכַּפֵּ֞ר עֲוֺ֧ן בֵּית עֵלִ֛י בְּ/זֶ֥בַח וּ/בְ/מִנְחָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: id
  text: 'Sebab itu, Aku telah bersumpah mengenai keluarga Eli: kesalahan keluarga Eli tidak akan pernah dihapuskan melalui kurban sembelihan ataupun persembahan[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kesalahan keluarga Eli sungguh tidak akan dihapuskan.” Sesudah ungkapan “Aku telah bersumpah,” bahasa Ibrani memakai kata “jika” sebagai rumus sumpah untuk menyatakan penyangkalan yang sangat tegas.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “persembahan” sering secara khusus menunjuk pada persembahan sajian atau bijian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: Sebab itu
  rationale: Menandai akibat dari pengumuman hukuman sebelumnya secara alami dan tetap mempertahankan daya simpulan teks Ibrani.
- source_word: נִשְׁבַּעְתִּי
  choice: Aku telah bersumpah
  rationale: Bentuk perfektif menyatakan sumpah ilahi yang telah diucapkan dan tetap berlaku; bentuk ini juga mempertahankan kekhidmatan tuturan.
- source_word: לְבֵית עֵלִי
  choice: mengenai keluarga Eli
  rationale: Preposisi ל menandai sasaran atau pokok sumpah. 'Mengenai' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa sumpah itu disampaikan langsung kepada keluarga Eli.
- source_word: אִם
  choice: tidak akan pernah
  rationale: Sesudah verba bersumpah, אִם merupakan rumus sumpah yang menyatakan penyangkalan tegas, bukan syarat biasa.
- source_word: יִתְכַּפֵּר
  choice: ditebus
  rationale: Dalam konteks ini bentuk כפר menunjuk pada penghapusan kesalahan melalui sarana pendamaian. 'Ditebus' ringkas dan mudah dipahami, sementara catatan menjelaskan nuansa pendamaiannya.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: עָוֹן dapat mencakup perbuatan salah sekaligus kesalahan atau tanggungannya. 'Kesalahan' mempertahankan keluasan itu tanpa memakai istilah Indonesia yang terlalu arkais.
- source_word: בֵּית עֵלִי
  choice: keluarga Eli
  rationale: Dalam konteks hukuman turun-temurun, בַּיִת menunjuk pada keluarga atau garis keturunan Eli, bukan bangunan.
- source_word: בְּזֶבַח
  choice: dengan kurban sembelihan
  rationale: זֶבַח ialah kurban yang disembelih; preposisi ב menandai sarana. Pilihan ini membedakannya dengan מִנְחָה.
- source_word: וּבְמִנְחָה
  choice: ataupun persembahan
  rationale: מִנְחָה dapat berarti persembahan dan dalam konteks ibadah sering secara khusus berupa persembahan bahan makanan; bentuk umum dipakai dalam teks dan kekhususannya dicatat.
- source_word: עַד עוֹלָם
  choice: tidak akan pernah
  rationale: Dalam kalimat negatif ini frasa tersebut menyatakan bahwa penebusan melalui sarana yang disebutkan tidak akan terjadi untuk seterusnya; 'tidak akan pernah' adalah ungkapan Indonesia yang alami.
theological_decisions:
- issue: Cakupan hukuman atas keluarga Eli
  choice: Ayat menyatakan bahwa kesalahan keluarga Eli tidak dapat ditebus melalui kurban sembelihan atau persembahan.
  alternative: Ayat ini dapat diperluas menjadi pernyataan bahwa pengampunan ilahi dalam segala bentuk sama sekali mustahil.
  rationale: Teks secara eksplisit meniadakan daya sarana kultis yang disebutkan. Terjemahan tidak memperluasnya menjadi kesimpulan doktrinal tentang semua kemungkinan belas kasihan Allah di luar yang dinyatakan ayat.
- issue: Makna כפר dalam hubungan dengan עָוֹן
  choice: Menerjemahkannya sebagai penebusan kesalahan, dengan catatan bahwa ungkapannya juga dapat dipahami sebagai pendamaian atau penghapusan kesalahan.
  alternative: Menggunakan istilah teknis 'dieksiasi' atau menyederhanakannya menjadi 'diampuni'.
  rationale: '''Ditebus'' mempertahankan hubungan dengan sarana persembahan tanpa menyamakan seluruh makna teks dengan pengampunan batin atau memasukkan jargon yang tidak lazim.'
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapital pada 'Aku' menandai bahwa penuturnya adalah TUHAN sesuai konteks. 'Kurban' mengikuti ejaan baku; 'kurban sembelihan' membedakan זֶבַח dari מִנְחָה. Semua penanda catatan kaki dicantumkan dalam teks utama.
