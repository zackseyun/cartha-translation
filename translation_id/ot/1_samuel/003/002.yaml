base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: id
  text: Pada hari itu, Eli sedang berbaring di tempatnya. Penglihatannya[a] mulai menjadi kabur; ia tidak dapat melihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “matanya”. Bentuk Ibrani dapat dipahami secara kolektif sebagai daya lihat atau penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan ini membuka latar waktu narasi. “Pada hari itu” menerjemahkan unsur temporal secara langsung tanpa menambahkan penanda wacana yang tidak tersurat.
- source_word: שֹׁכֵב
  choice: sedang berbaring
  rationale: Bentuk partisipel menggambarkan keadaan Eli yang sedang berlangsung.
- source_word: בִּמְקֹמוֹ
  choice: di tempatnya
  rationale: Pilihan ini mempertahankan makna umum מָקוֹם dan tidak mempersempitnya menjadi “kamar”, yang tidak dinyatakan oleh teks.
- source_word: וְעֵינוֹ
  choice: Penglihatannya
  rationale: Dalam konteks ini, kata yang secara bentuk dapat dibaca “matanya” menunjuk secara kolektif pada daya lihat Eli. “Penglihatannya” alami dalam bahasa Indonesia dan selaras dengan verba jamak berikutnya tanpa menambahkan gagasan “kedua” yang tidak tersurat.
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: mulai menjadi kabur
  rationale: Terjemahan ini mempertahankan aspek permulaan sekaligus proses melemahnya penglihatan.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: ia tidak dapat melihat
  rationale: Terjemahan langsung dan wajar untuk ketidakmampuan Eli melihat.
