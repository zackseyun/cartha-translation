  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁמוּאֵ֕ל טֶ֖רֶם יָדַ֣ע אֶת יְהוָ֑ה וְ/טֶ֛רֶם יִגָּלֶ֥ה אֵלָ֖י/ו דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/007.yaml
  text: Samuel did not yet know Yahweh[b][a], and the word of Yahweh had not yet been revealed to him.
translation:
  language: id
  text: Samuel belum mengenal Yahweh[a][b], dan firman Yahweh belum dinyatakan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “belum mengenali Yahweh.” Kata Ibrani yang diterjemahkan “mengenal” dapat menunjuk pada pengenalan berdasarkan pengalaman atau hubungan, khususnya dalam kaitannya dengan penyataan ilahi.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: belum
  rationale: Adverbia ini menunjukkan bahwa keadaan atau peristiwa tersebut belum terjadi sampai pada titik ini dalam kisah. "Belum" menyampaikan makna temporal itu secara alami tanpa menambahkan kata penanda waktu yang tidak ada dalam teks sumber.
- source_word: יָדַע אֶת־יְהוָה
  choice: mengenal Yahweh
  rationale: Kata יָדַע dengan objek pribadi dapat menunjuk pada pengenalan yang bersifat relasional atau berdasarkan pengalaman, bukan sekadar mengetahui fakta. "Mengenal" mempertahankan keluasan idiom Ibrani dan tidak memaksakan satu penafsiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai "Yahweh" agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan sebuah gelar.
- source_word: יִגָּלֶה
  choice: dinyatakan
  rationale: Bentuk Nifal dari גלה di sini bermakna pasif, yakni disingkapkan atau dinyatakan kepada seseorang. "Dinyatakan" wajar dalam bahasa Indonesia dan sesuai dengan konteks pewahyuan ilahi.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Padanan alami bagi preposisi אֶל dengan sufiks orang ketiga tunggal maskulin dalam konstruksi ini.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Ungkapan ini merupakan rumusan kenabian yang lazim. "Firman Yahweh" mempertahankan idiom dan bobot teologisnya dengan lebih baik daripada padanan yang lebih interpretatif seperti "pesan dari Yahweh".
- source_word: וּשְׁמוּאֵל
  choice: Samuel
  rationale: Waw di sini menghubungkan ayat dengan konteks dan memperkenalkan keterangan penjelas. Dalam bahasa Indonesia, hubungan itu dapat disampaikan secara alami tanpa menambahkan "dan" atau penanda seperti "pada waktu itu".
theological_decisions:
- issue: Makna “Samuel belum mengenal Yahweh”
  choice: Mempertahankan ungkapan luas “belum mengenal Yahweh,” dengan catatan bahwa konteks dapat menunjuk pada pengenalan melalui penyataan langsung.
  alternative: Menafsirkan secara eksplisit bahwa Samuel sama sekali tidak tahu tentang Yahweh, belum bertobat, atau hanya belum mengenali suara Yahweh.
  rationale: Samuel telah melayani di tempat kudus di bawah pengawasan Eli, sedangkan klausa sejajar berikutnya menyatakan bahwa firman Yahweh belum dinyatakan kepadanya. Namun, terjemahan utama tidak boleh mengganti keluasan יָדַע dengan kesimpulan doktrinal yang lebih sempit; ketegangan maknanya dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kedua klausa mempertahankan pengulangan “belum” dalam teks Ibrani. Istilah “firman” dipakai karena lazim dan tepat dalam konteks penyataan kenabian.
