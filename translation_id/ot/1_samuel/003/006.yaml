  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: id
  text: Kemudian TUHAN kembali memanggil Samuel. Samuel pun bangun dan pergi kepada Eli, lalu berkata, “Aku di sini, sebab engkau memanggil aku.” Namun Eli berkata, “Aku tidak memanggilmu, anakku. Kembalilah dan berbaringlah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא עוֹד
  choice: memanggil lagi
  rationale: Gabungan verba ‘menambah/melakukan lagi’ dan עוֹד menyatakan pengulangan panggilan; bentuk alami dalam bahasa Indonesia ialah ‘memanggil lagi’.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab Indonesia yang lazim untuk Tetragramaton sambil membedakannya sebagai nama ilahi.
- source_word: הִנְנִי
  choice: Ini aku
  rationale: Ungkapan kesiapsediaan atau jawaban atas panggilan, dipertahankan secara ringkas dan idiomatis.
- source_word: כִּי
  choice: sebab
  rationale: Dalam konteks ini memperkenalkan alasan Samuel datang kepada Eli.
- source_word: בְנִי
  choice: anakku
  rationale: Sapaan akrab Eli kepada Samuel, bukan penegasan hubungan biologis.
- source_word: שׁוּב שְׁכָב
  choice: Kembalilah dan berbaringlah
  rationale: שׁוּב menyatakan kembali ke tempat sebelumnya, sedangkan שְׁכָב adalah perintah untuk berbaring.
theological_decisions:
- issue: Penyebutan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: ‘TUHAN’ merupakan padanan penerbitan Indonesia yang luas dikenal; tidak menambahkan penafsiran teologis di luar teks.
- issue: Subjek tersirat pada perkataan terakhir
  choice: Eli berkata
  alternative: ia berkata
  rationale: Nama Eli diperjelas demi keterbacaan bahasa Indonesia tanpa mengubah rujukan pronomina maskulin tunggal dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan ‘Bapak’ digunakan dalam ucapan Samuel untuk menyampaikan penghormatan kepada Eli tanpa mengesankan bahwa Eli adalah ayah biologisnya; ‘anakku’ mempertahankan kehangatan sapaan Eli.
