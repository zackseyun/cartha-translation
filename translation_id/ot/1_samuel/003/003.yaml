  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: id
  text: Pelita Allah belum padam, dan Samuel sedang berbaring di dalam rumah suci Yahweh[a], tempat Tabut Allah berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait Yahweh.” Kata Ibrani heikhal dapat berarti bait atau rumah suci; di sini yang dimaksud ialah tempat kediaman Yahweh di Silo.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: Pelita Allah
  rationale: נֵר menunjuk pada pelita, bukan cahaya secara umum. Bentuk konstruksi dengan אֱלֹהִים dipertahankan secara wajar dan kemungkinan besar merujuk pada pelita yang digunakan dalam ibadah di tempat suci.
- source_word: טֶרֶם יִכְבֶּה
  choice: belum padam
  rationale: טֶרֶם menyatakan bahwa tindakan itu belum terjadi, sedangkan כבה secara alami berarti 'padam' ketika subjeknya pelita. Konteks naratif sudah menyediakan kerangka waktu lampau.
- source_word: שֹׁכֵב
  choice: sedang berbaring
  rationale: Partisip ini menyatakan keadaan atau posisi Samuel. Terjemahan ini tidak menambahkan kesimpulan bahwa ia sudah tidur.
- source_word: הֵיכַל יְהוָה
  choice: rumah suci Yahweh
  rationale: הֵיכָל dapat berarti istana, bait, atau tempat suci. Dalam konteks tempat ibadah di Silo sebelum pembangunan Bait Salomo, 'rumah suci' terdengar alami dan menghindari kesan bahwa bangunan yang dimaksud ialah Bait Salomo.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterusaksarakan sebagai nama pribadi, bukan diganti dengan gelar 'TUHAN'.
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: tempat Tabut Allah berada
  rationale: Klausa relatif ini menunjukkan lokasi melalui keberadaan tabut. 'Tempat ... berada' menyampaikan daya lokatif שָׁם dengan jelas dan alami.
theological_decisions:
- issue: Makna הֵיכַל יְהוָה dalam konteks tempat ibadah pra-kerajaan di Silo
  choice: rumah suci Yahweh
  alternative: bait Yahweh
  rationale: Kata הֵיכָל memang dapat diterjemahkan 'bait', tetapi latarnya adalah tempat ibadah di Silo sebelum Bait Salomo. 'Rumah suci' mempertahankan makna kediaman ibadah tanpa menyamakan bangunan itu secara tidak sengaja dengan Bait Salomo; alternatif leksikal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Sedang berbaring' mempertahankan aspek partisip tanpa menafsirkan bahwa Samuel sudah tertidur. Kapitalisasi 'Tabut Allah' menandai benda ibadah tertentu.
