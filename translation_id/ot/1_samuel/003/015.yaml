  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב שְׁמוּאֵל֙ עַד הַ/בֹּ֔קֶר וַ/יִּפְתַּ֖ח אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וּ/שְׁמוּאֵ֣ל יָרֵ֔א מֵ/הַגִּ֥יד אֶת הַ/מַּרְאָ֖ה אֶל עֵלִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: id
  text: Samuel berbaring sampai pagi. Kemudian ia membuka pintu-pintu rumah Yahweh. Namun, Samuel takut memberitahukan penglihatan[a] itu kepada Eli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penampakan”. Kata Ibrani mar’ah dapat berarti penampakan atau penglihatan/penyataan. Dalam konteks penyataan kepada Samuel pada malam hari, “penglihatan” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Menerjemahkan makna dasar שׁכב, ‘berbaring’, tanpa menambahkan bahwa Samuel tertidur, yang tidak dinyatakan secara eksplisit.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Ungkapan temporal yang alami dalam bahasa Indonesia dan setia pada teks Ibrani.
- source_word: וַיִּפְתַּח
  choice: Kemudian ia membuka
  rationale: ‘Membuka’ menerjemahkan verba secara langsung; ‘kemudian’ menyampaikan urutan naratif waw-konsekutif secara alami.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Bentuk jamak dalam teks dipertahankan; ungkapan ini merujuk pada daun-daun pintu atau pintu masuk bangunan suci.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Menerjemahkan בית secara langsung sebagai ‘rumah’, bukan ‘Bait Allah’, sehingga tidak memberi kesan bangunan Bait Suci yang lebih kemudian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton.
- source_word: יָרֵא
  choice: takut
  rationale: Padanan Indonesia yang wajar dan langsung bagi keadaan emosional Samuel.
- source_word: מֵהַגִּיד
  choice: memberitahukan
  rationale: Setelah ‘takut’, konstruksi מן dengan infinitif menyatakan ketakutan untuk melakukan tindakan tersebut; ‘memberitahukan’ cocok dengan objek berupa isi penyataan.
- source_word: הַמַּרְאָה
  choice: penglihatan
  rationale: Dalam konteks penyataan malam kepada Samuel, ‘penglihatan’ merupakan padanan yang paling sesuai, sambil mengakui bahwa kata itu juga dapat berarti ‘penampakan’.
- source_word: אֶל עֵלִי
  choice: kepada Eli
  rationale: Padanan arah atau penerima yang alami setelah verba ‘memberitahukan’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; ‘Yahweh’ mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Sifat pengalaman Samuel yang disebut הַמַּרְאָה
  choice: penglihatan
  alternative: penampakan
  rationale: Konteksnya adalah penyataan ilahi pada malam hari. ‘Penglihatan’ sesuai dengan konteks kenabian, tetapi catatan kaki mempertahankan kemungkinan leksikal ‘penampakan’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menambahkan bahwa Samuel tidur. Istilah ‘rumah Yahweh’ dipilih untuk menghindari kesan anakronistis dari ‘Bait Suci’.
