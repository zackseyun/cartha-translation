  naturalness: Bahasa draf umumnya baku dan jelas. “Selama-lamanya” lebih idiomatis daripada “untuk selama-lamanya”, dan “yang ia ketahui” lebih lancar daripada “yang diketahuinya” dalam konstruksi ini.
  terminology: “Keluarganya” dapat menyampaikan idiom בֵּיתוֹ tanpa membatasi pada bangunan, meskipun cakupannya tetap dapat meliputi rumah tangga dan garis keturunan. “Mengekang” sesuai konteks כִהָה. Kapitalisasi “Aku” konsisten dengan register terjemahan.
