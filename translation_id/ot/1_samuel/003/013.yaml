  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: id
  text: Aku telah memberitahukan kepadanya bahwa Aku menghukum keluarganya selama-lamanya karena kesalahan yang ia ketahui, sebab anak-anaknya mendatangkan kutuk atas diri mereka sendiri,[a] dan ia tidak mengekang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Menurut bacaan lain yang tercermin dalam sejumlah saksi kuno dan banyak terjemahan: “anak-anaknya mengutuki Allah” atau “menghujat Allah.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: Aku telah memberitahukan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau memberitahukan. Bentuk perfektum diterjemahkan sebagai tindakan yang telah dilakukan dan tetap relevan dalam konteks ini.
- source_word: שֹׁפֵט אֲנִי
  choice: Aku menghukum
  rationale: Partisipel dengan pronomina eksplisit menyatakan tindakan yang sedang berlangsung atau sudah pasti dan segera dilaksanakan. Dalam bahasa Indonesia, bentuk kini tanpa penanda waktu menjaga ketegasan nubuat itu.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: Secara harfiah berarti 'rumahnya', tetapi dalam idiom Ibrani mencakup keluarga, seisi rumah, dan garis keturunan. 'Keluarganya' alami dalam bahasa Indonesia tanpa membatasi hanya pada bangunan atau penghuni rumah saat itu.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Mengungkapkan jangka waktu yang terus berlangsung dan mempertahankan kerasnya keputusan hukuman tersebut.
- source_word: בַּעֲוֺן
  choice: karena kesalahan
  rationale: עָוֹן dapat menunjuk pada perbuatan salah sekaligus kesalahan yang mendatangkan pertanggungjawaban. 'Kesalahan' mempertahankan bobot moralnya dalam bahasa Indonesia yang wajar.
- source_word: יָדַע
  choice: yang diketahuinya
  rationale: Terjemahan langsung ini menegaskan bahwa Eli mengetahui pelanggaran tersebut dan karena itu bertanggung jawab.
- source_word: מְקַלְלִים לָהֶם
  choice: mendatangkan kutuk atas diri mereka sendiri
  rationale: Teks Masoret sebagaimana tertulis secara alami menunjuk pada tindakan yang mendatangkan kutuk bagi diri para anak itu. Terjemahan ini mengikuti teks sumber utama sambil mencatat bacaan alternatif dalam catatan kaki.
- source_word: וְלֹא כִהָה בָּם
  choice: tetapi ia tidak mengekang mereka
  rationale: כִּהָה dapat berarti menumpulkan, melemahkan, atau menahan. Dalam konteks ini, 'mengekang' menyampaikan kegagalan Eli menghentikan atau membatasi perbuatan anak-anaknya.
theological_decisions:
- issue: Apakah frasa tentang perbuatan anak-anak Eli mengikuti teks Masoret atau bacaan alternatif dalam sejumlah saksi kuno
  choice: Teks utama berbunyi 'mendatangkan kutuk atas diri mereka sendiri'.
  alternative: '''mengutuki Allah'' atau ''menghujat Allah'''
  rationale: Teks konsonantal Masoret mendukung arti yang berkenaan dengan diri mereka sendiri, sedangkan sejumlah saksi kuno mencerminkan bacaan yang menyebut Allah. Teks utama mengikuti bukti bahasa sumber yang diberikan, dan bacaan penting lainnya dipertahankan dalam catatan kaki.
- issue: Cakupan בֵּיתוֹ dalam hukuman yang diumumkan
  choice: '''keluarganya'' dipakai tanpa mempersempit cakupannya.'
  alternative: '''seisi rumahnya'' atau ''garis keturunannya'''
  rationale: Idiom Ibrani dapat mencakup rumah tangga langsung maupun garis keluarga yang berlanjut. 'Keluarganya' menjaga keluasan makna itu secara alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Pronomina ilahi 'Aku' memakai huruf kapital. Tanda titik dua memperjelas bahwa bagian berikutnya menjabarkan kesalahan yang diketahui Eli, tanpa menghapus hubungan sebab-akibat dalam bahasa Ibrani.
