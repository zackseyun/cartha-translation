  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: id
  text: Yahweh memanggil Samuel lagi untuk ketiga kalinya. Samuel pun bangun, pergi kepada Eli, dan berkata, “Ini aku, sebab engkau memanggil aku.” Lalu Eli mengerti bahwa Yahweh memanggil anak itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: memanggil ... lagi
  rationale: Konstruksi יָסַף dengan infinitif menyatakan pengulangan tindakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kesinambungan narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בַּשְּׁלִשִׁית
  choice: untuk ketiga kalinya
  rationale: Menyatakan bahwa panggilan ini merupakan kejadian yang ketiga secara jelas dan idiomatis.
- source_word: וַיָּקָם
  choice: Samuel pun bangun
  rationale: Kata 'bangun' merupakan padanan modern yang alami; nama Samuel diulang demi kejelasan subjek dalam bahasa Indonesia.
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: pergi kepada Eli
  rationale: Menyampaikan gerak Samuel menuju Eli dengan laras naratif yang wajar dan bermartabat.
- source_word: הִנְנִי
  choice: Ini aku
  rationale: Padanan idiomatis bagi jawaban kesiapsediaan dalam konteks panggilan, tanpa diksi arkais.
- source_word: כִּי קָרָאתָ לִי
  choice: sebab Bapak memanggil aku
  rationale: כִּי menyatakan alasan Samuel datang. Sapaan 'Bapak' menyatakan bahwa verba Ibrani berorang kedua tunggal ditujukan kepada Eli dan menghasilkan dialog Indonesia yang alami.
- source_word: וַיָּבֶן
  choice: mengerti
  rationale: בין di sini menunjukkan bahwa Eli memahami siapa yang sebenarnya memanggil Samuel.
- source_word: קֹרֵא
  choice: yang memanggil
  rationale: Partisip Ibrani menunjukkan tindakan yang sedang atau berulang berlangsung; konstruksi relatif Indonesia menyampaikannya secara alami dalam konteks ini.
- source_word: לַנָּעַר
  choice: anak itu
  rationale: נַעַר mencakup rentang usia dari anak hingga pemuda. Dalam adegan ini, 'anak itu' sesuai dengan penggambaran Samuel yang masih muda tanpa menentukan usia secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan menghindari penggantiannya dengan gelar.
- issue: Penegasan subjek pada frasa כִּי יְהוָה קֹרֵא
  choice: Yahweh-lah yang memanggil
  alternative: Yahweh memanggil
  rationale: Partikel fokus '-lah' secara alami mengungkapkan kesadaran baru Eli bahwa pemanggilnya adalah Yahweh, tanpa menambahkan isi teologis yang tidak ada dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Diksi dibuat mudah dipahami pembaca umum namun tetap bermartabat. Bentuk 'Bapak' dipakai hanya dalam ucapan Samuel kepada Eli agar objek orang kedua yang tersirat dalam bentuk verba Ibrani terdengar alami; tidak ada penanda catatan kaki karena tidak diperlukan.
