  yaml_path: translation/ot/1_samuel/003/005.yaml
  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: id
  text: Ia berlari kepada Eli dan berkata, “Aku di sini, karena engkau memanggil aku.” Namun Eli berkata, “Aku tidak memanggil. Kembalilah dan berbaringlah.” Lalu Samuel pergi dan berbaring.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Aku di sini
  rationale: Ungkapan kesiapan atau jawaban atas panggilan; bentuk ini alami dalam bahasa Indonesia dan sesuai dengan konteks Samuel yang menyangka Eli memanggilnya.
- source_word: כִּי
  choice: sebab
  rationale: 'Di sini memperkenalkan alasan Samuel datang kepada Eli: ia mengira Eli telah memanggilnya.'
- source_word: שׁוּב שְׁכָב
  choice: Kembalilah dan berbaringlah
  rationale: שׁוּב menyatakan kembali ke tempat sebelumnya, sedangkan שְׁכָב adalah perintah untuk berbaring; keduanya dipertahankan secara eksplisit.
- source_word: קָרָאתָ לִּי
  choice: Bapak memanggil aku
  rationale: Bentuk verba orang kedua maskulin tunggal dan pronomina objek orang pertama dipertahankan. Sapaan 'Bapak' membuat subjek tersirat 'engkau' alami dan hormat dalam hubungan Samuel dengan Eli.
theological_decisions:
- issue: Identitas pemanggil menurut persepsi Samuel
  choice: sebab Bapak memanggil aku
  alternative: karena engkau memanggil aku
  rationale: Ayat ini menyampaikan persepsi Samuel bahwa Eli memanggilnya, tanpa mengaburkan konteks bahwa suara itu sebenarnya berasal dari TUHAN. Pilihan 'Bapak' adalah sapaan kontekstual, bukan penambahan identitas teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog dibuat alami; 'Bapak' dipakai sebagai sapaan hormat Samuel kepada Eli, sementara narasi tetap menggunakan nama dan pronomina orang ketiga.
