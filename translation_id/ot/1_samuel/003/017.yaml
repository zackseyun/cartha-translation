  to: Lalu ia berkata, “Apa firman yang Ia katakan kepadamu? Tolong jangan sembunyikan itu dariku. Beginilah kiranya Allah memperlakukanmu, bahkan lebih lagi, jika engkau menyembunyikan dariku sepatah kata pun dari seluruh firman yang Ia katakan kepadamu.”[a]
