base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: id
  text: Lalu ia berkata, “Apa firman yang Ia katakan kepadamu? Tolong jangan sembunyikan itu dariku. Beginilah kiranya Allah memperlakukanmu, bahkan lebih lagi, jika engkau menyembunyikan dariku sepatah kata pun dari seluruh firman yang Ia katakan kepadamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “jika engkau menyembunyikan dariku satu kata dari seluruh firman yang Ia katakan kepadamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: Apakah firman
  rationale: דָּבָר dapat berarti ‘perkataan’, ‘hal’, atau ‘pesan’. Dalam konteks penyataan ilahi, ‘firman’ mempertahankan kaitannya dengan tindakan Allah berbicara dan terdengar wajar dalam bahasa Indonesia.
- source_word: דִּבֶּר אֵלֶיךָ
  choice: yang disampaikan-Nya kepadamu
  rationale: Bentuk ini mengungkapkan tindakan berbicara kepada Samuel secara alami. Akhiran hormat -Nya merujuk kepada Allah, sebagaimana jelas dari konteks dekat.
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: Tolong jangan sembunyikan itu dariku
  rationale: ‘Tolong’ mencerminkan partikel permohonan נָא, sedangkan ‘sembunyikan’ menerjemahkan כחד. Kata ‘itu’ merujuk secara alami kepada firman yang baru disebut.
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: Beginilah kiranya Allah memperlakukanmu, bahkan lebih lagi
  rationale: Ini adalah rumusan sumpah yang mengandung kutuk tanpa menyebut bentuk hukumannya. Terjemahan ini mempertahankan sifat eliptis dan daya ancamnya tanpa menambahkan hukuman tertentu.
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: engkau menyembunyikan dariku sepatah kata pun dari seluruh firman
  rationale: ‘Sepatah kata pun’ mengungkapkan makna satu bagian sekecil apa pun, sedangkan pengulangan ‘firman’ mempertahankan kaitan leksikal dengan דָּבָר sebelumnya. Susunan ini lebih alami daripada terjemahan harfiah yang kaku.
theological_decisions:
- issue: Makna אֱלֹהִים dalam rumusan sumpah
  choice: Allah
  alternative: ilah-ilah
  rationale: Dalam konteks ini Eli menyerukan Allah Israel melalui rumusan sumpah Ibrani yang lazim. Bentuk gramatikal אֱלֹהִים tidak menunjuk kepada banyak ilah di sini.
- issue: Rujukan subjek dalam אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: -Nya, merujuk kepada Allah
  alternative: dia, tanpa kapitalisasi
  rationale: Konteks langsung menyatakan bahwa TUHAN berbicara kepada Samuel. Kapitalisasi mengikuti kebiasaan bahasa Indonesia ketika pronomina merujuk kepada Allah, tanpa memasukkan nama ilahi yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘engkau’ dipakai karena percakapan ini bersifat langsung dan serius. Rumusan kutuk dipertahankan secara eliptis sebagaimana dalam bahasa Ibrani; hukuman tertentu tidak dijelaskan.
