id: 1SA.3.11
reference: 1 Samuel 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל הִנֵּ֧ה אָנֹכִ֛י עֹשֶׂ֥ה דָבָ֖ר בְּ/יִשְׂרָאֵ֑ל אֲשֶׁר֙ כָּל שֹׁ֣מְע֔/וֹ תְּצִלֶּ֖ינָה שְׁתֵּ֥י אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: id
  text: Lalu TUHAN berfirman kepada Samuel, “Lihatlah, Aku akan melakukan sesuatu di Israel yang akan membuat kedua telinga setiap orang yang mendengarnya berdenging.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa; “berfirman” sesuai untuk ujaran ilahi dalam register Alkitab Indonesia yang tetap wajar.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti kebiasaan penerjemahan Indonesia untuk Tetragramaton dengan huruf kapital, tanpa memasukkan pelafalan tertentu ke dalam teks.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda perhatian dan penekanan Ibrani dengan bentuk imperatif yang alami dan bermartabat.
- source_word: אָנֹכִי עֹשֶׂה דָבָר
  choice: Aku akan melakukan sesuatu
  rationale: Partisipel dalam konteks nubuat menunjuk tindakan yang segera/akan dilakukan; דָבָר dibiarkan tidak spesifik sebagai “sesuatu” sebagaimana sumbernya.
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: akan membuat kedua telinga ... berdenging
  rationale: Ungkapan Ibrani menggambarkan reaksi mengejutkan atau menggentarkan secara fisik; citra kedua telinga dipertahankan.
theological_decisions:
- issue: Identitas nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: “TUHAN” merupakan padanan konvensional yang luas dalam Alkitab bahasa Indonesia dan tidak menetapkan rekonstruksi pelafalan nama ilahi.
- issue: Kepastian dan waktu tindakan ilahi
  choice: Aku akan melakukan
  alternative: Aku sedang melakukan / Aku hendak melakukan
  rationale: Konteks pengumuman hukuman yang segera mendukung orientasi masa depan, tanpa menambahkan rincian tentang waktunya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Citra idiomatis Ibrani dipertahankan karena tetap dapat dipahami dalam bahasa Indonesia; tidak diperlukan catatan kaki.
