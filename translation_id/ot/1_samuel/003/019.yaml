  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: id
  text: Samuel makin dewasa, dan Yahweh menyertai dia. Yahweh tidak membiarkan satu pun dari perkataannya jatuh ke tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak membiarkan satu pun dari perkataannya gagal.” Ungkapan Ibraninya secara harfiah berbunyi “tidak membiarkan satu pun dari perkataannya jatuh ke tanah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: makin dewasa
  rationale: Kata גדל dalam konteks ini menunjuk pada pertumbuhan Samuel menuju kedewasaan. Pilihan ini lebih alami daripada terjemahan harfiah 'bertumbuh' dan tidak membatasinya hanya pada pertumbuhan fisik atau peningkatan kedudukan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הָיָה עִמּוֹ
  choice: menyertai dia
  rationale: Ungkapan Indonesia yang alami untuk menyampaikan kehadiran dan perkenanan Yahweh, sesuai dengan arti idiom Ibrani 'ada bersama dia'.
- source_word: וְלֹא הִפִּיל
  choice: tidak membiarkan ... jatuh
  rationale: Mempertahankan nuansa kausatif bentuk Hifil serta gambaran idiomatis teks Ibrani.
- source_word: מִכָּל דְּבָרָיו
  choice: satu pun dari perkataannya
  rationale: Dengan negasi, frasa ini berarti tidak ada satu pun dari segala perkataan Samuel. 'Perkataannya' tetap cukup luas dan tidak mempersempit makna menjadi nubuat atau ramalan saja.
- source_word: אָרְצָה
  choice: ke tanah
  rationale: Menerjemahkan bentuk direktif secara langsung dan mempertahankan idiom Ibrani yang menggambarkan perkataan yang tidak dibiarkan gagal atau menjadi sia-sia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna idiom 'tidak membiarkan perkataannya jatuh ke tanah'
  choice: Mempertahankan idiom Ibrani dalam teks utama
  alternative: tidak membiarkan satu pun perkataannya gagal; membuat semua perkataannya menjadi kenyataan
  rationale: Konteks mendukung keandalan Samuel sebagai nabi, tetapi teks memakai ungkapan bergambar yang lebih luas. Mempertahankannya menjaga corak sastra dan tidak mempersempit makna secara teologis.
- issue: Subjek pronomina pada דְּבָרָיו
  choice: perkataannya merujuk kepada Samuel
  alternative: perkataan Yahweh
  rationale: Secara tata bahasa, anteseden terdekat dapat menimbulkan pertanyaan, tetapi konteks ayat 19–20 dan idiom tentang perkataan seorang nabi mendukung rujukan kepada Samuel; kehadiran Yahweh menjamin perkataannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Klausa panjang Ibrani dibagi menjadi dua kalimat agar jelas. Pengulangan 'Yahweh' pada kalimat kedua menggantikan pronomina tersirat dalam bahasa Indonesia untuk menghindari kesan bahwa Samuel adalah pelaku yang membiarkan perkataannya jatuh.
