  text: בַּ/יּ֤וֹם הַ/הוּא֙ אָקִ֣ים אֶל עֵלִ֔י אֵ֛ת כָּל אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל בֵּית֑/וֹ הָחֵ֖ל וְ/כַלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/012.yaml
  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: id
  text: Pada hari itu Aku akan melaksanakan segala yang telah Kufirmankan mengenai keluarganya terhadap Eli, dari awal sampai akhir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu ini menunjuk pada suatu hari tertentu pada masa mendatang dan diterjemahkan dengan bentuk yang alami dalam bahasa Indonesia.
- source_word: אָקִים אֶל עֵלִי
  choice: Aku akan melaksanakan terhadap Eli
  rationale: Bentuk kausatif dari קום, dengan firman yang telah diucapkan sebagai objeknya, menyatakan bahwa Allah akan membuat firman itu terlaksana. Dalam konteks penghukuman, אֶל menunjukkan arah tindakan kepada Eli, tetapi kemungkinan nuansa 'menggenapi bagi Eli' tetap dicatat.
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: segala yang telah Kufirmankan
  rationale: Kata 'segala' mempertahankan cakupan menyeluruh כָּל אֲשֶׁר, sedangkan 'Kufirmankan' wajar untuk ucapan ilahi yang sebelumnya telah disampaikan.
- source_word: אֶל בֵּיתוֹ
  choice: mengenai keluarganya
  rationale: Dengan verba 'berfirman', אֶל dapat menandai pokok yang dibicarakan. 'Keluarganya' lebih alami daripada terjemahan harfiah 'rumahnya', sementara keluasan makna בַּיִת dijelaskan dalam catatan kaki.
- source_word: הָחֵל וְכַלֵּה
  choice: dari awal sampai akhir
  rationale: Pasangan ungkapan ini menyatakan pelaksanaan secara tuntas. Bentuk Indonesia ini alami dan mempertahankan gagasan keseluruhan dari permulaan hingga penyelesaian.
theological_decisions:
- issue: Cakupan penghukuman atas Eli dan rumahnya
  choice: Kata בֵּיתוֹ diterjemahkan 'keluarganya' tanpa membatasi cakupannya hanya pada keluarga inti.
  alternative: Menerjemahkannya sebagai 'rumahnya', 'seisi rumahnya', 'garis keturunannya', atau 'keluarga imamnya'.
  rationale: Dalam konteks ini, בַּיִת dapat mencakup rumah tangga, garis keturunan, dan keluarga imam Eli. Teks utama memakai ungkapan Indonesia yang luas, dan catatan kaki mempertahankan rentang makna Ibraninya.
- issue: Arah pelaksanaan firman terhadap Eli
  choice: Ungkapan diterjemahkan 'melaksanakan terhadap Eli', sesuai konteks penghakiman.
  alternative: Aku akan menggenapi bagi Eli segala yang telah Kufirmankan.
  rationale: אָקִים secara harfiah mengandung gagasan membuat sesuatu berdiri atau berlaku, dan אֶל biasanya berarti 'kepada'. Konteks membuat nuansa yang merugikan Eli jelas, tetapi alternatif yang lebih dekat dengan bentuk leksikal tetap dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada pronomina ilahi mengikuti gaya teks Alkitab Indonesia yang lazim. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan keluasan makna istilah sumber.
