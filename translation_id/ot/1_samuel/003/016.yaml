  yaml_path: translation/ot/1_samuel/003/016.yaml
  text: Then Eli called Samuel and said, “Samuel, my son.” And he said, “Here I am.”
translation:
  language: id
  text: Lalu Eli memanggil Samuel dan berkata, “Samuel, anakku.” Samuel menjawab, “Ya, aku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks narasi ini, קרא berarti memanggil seseorang secara langsung; “memanggil” ringkas dan alami dalam bahasa Indonesia.
- source_word: עֵלִי
  choice: Eli
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Penanda objek langsung אֶת tidak perlu diterjemahkan, sedangkan nama diri dipertahankan dalam bentuk yang lazim.
- source_word: וַיֹּאמֶר
  choice: berkata / menjawab
  rationale: אמר secara leksikal berarti “berkata”. Pada kemunculan kedua, “menjawab” secara alami menyatakan fungsi ujaran Samuel sebagai respons tanpa mengubah isinya.
- source_word: שְׁמוּאֵל בְּנִי
  choice: Samuel, anakku
  rationale: בְּנִי secara harfiah berarti “anakku” dan mempertahankan sapaan yang hangat serta bersifat relasional.
- source_word: הִנֵּנִי
  choice: Ya, aku di sini
  rationale: Ungkapan ini menyatakan kehadiran dan kesiapan untuk menanggapi. “Ya, aku di sini” merupakan padanan Indonesia yang alami sambil mempertahankan daya ungkap idiom Ibrani.
- source_word: וַ
  choice: Lalu
  rationale: Waw konsekutif memajukan rangkaian narasi; “Lalu” menyatakan urutan peristiwa secara wajar dalam bahasa Indonesia.
