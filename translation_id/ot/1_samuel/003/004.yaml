  text: Then Yahweh called to Samuel[a], and he said, “Here I am.”
translation:
  language: id
  text: Lalu Yahweh[a] memanggil Samuel, dan ia berkata, “Aku di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; dapat juga dialihaksarakan sebagai “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Bentuk Qal wayyiqtol dari קרא melanjutkan rangkaian narasi dan dalam konteks ini menyatakan panggilan yang terdengar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֶל
  choice: Samuel sebagai objek tak langsung tanpa preposisi tersurat
  rationale: Dalam bahasa Indonesia, konstruksi 'memanggil Samuel' secara alami menyatakan orang yang menjadi sasaran panggilan.
- source_word: שְׁמוּאֵל
  choice: Samuel
  rationale: Mengikuti bentuk baku nama ini dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: dan ia menjawab
  rationale: Secara harfiah berarti 'dan ia berkata', dengan subjek tersirat yang merujuk kepada Samuel. Dalam konteks percakapan, 'menjawab' menyampaikan fungsi ujaran itu secara alami tanpa mengubah isinya.
- source_word: הִנֵּנִי
  choice: Aku di sini
  rationale: Ungkapan tanggapan yang menyatakan kehadiran dan kesiapan; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa formula jawaban.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi tersebut, sedangkan bentuk alternatif dicatat dalam catatan kaki.
- issue: Identitas subjek וַיֹּאמֶר
  choice: Samuel, dinyatakan dengan pronomina 'ia'
  alternative: 'Membiarkan subjek tersirat: ''dan berkata'''
  rationale: Konteks menunjukkan bahwa Samuellah yang menanggapi panggilan. Penyebutan pronomina diperlukan agar kalimat Indonesia jelas, tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Lalu' menandai kelanjutan narasi; 'Aku di sini' dipilih sebagai respons alami yang tetap bernuansa biblikal.
