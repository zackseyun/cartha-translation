  edition: WLC
  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: id
  text: Kemudian Yahweh datang dan berdiri di sana. Ia memanggil seperti pada waktu-waktu sebelumnya[a], “Samuel! Samuel!” Samuel berkata, “Berbicaralah, sebab hamba-Mu mendengarkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti sebelumnya.” Ungkapan Ibraninya membandingkan panggilan ini dengan kejadian-kejadian terdahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum untuk Tuhan.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Makna naratif langsung dari בוא; pilihan ini alami dan tidak menambahkan gagasan penampakan yang tidak dinyatakan oleh verba tersebut.
- source_word: וַיִּתְיַצַּב
  choice: berdiri di sana
  rationale: Bentuk hitpael dari יצב menggambarkan tindakan mengambil posisi atau berdiri; “di sana” menyampaikan kehadiran konkret yang tersirat dalam adegan.
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini קרא berarti menyapa Samuel dengan suara; “memanggil” tidak melebih-lebihkan kerasnya suara.
- source_word: כְפַעַם בְּפַעַם
  choice: seperti pada waktu-waktu sebelumnya
  rationale: Ungkapan Ibrani membandingkan panggilan ini dengan panggilan-panggilan terdahulu yang berulang; bentuk ini alami dalam bahasa Indonesia sambil mempertahankan unsur perbandingan.
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: Samuel! Samuel!
  rationale: Pengulangan nama dipertahankan sebagai panggilan pribadi yang tegas; tanda seru menandai seruan tanpa menambahkan kata.
- source_word: דַּבֵּר
  choice: Berbicaralah
  rationale: Imperatif langsung ini diterjemahkan secara jelas dan bermartabat.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan kesiapan Samuel untuk mendengar.
- source_word: שֹׁמֵעַ
  choice: mendengarkan
  rationale: Partisip ini menyatakan perhatian yang sedang berlangsung; “mendengarkan” lebih tepat daripada sekadar “mendengar” untuk kesiapan aktif Samuel.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam sapaan penuh kerendahan kepada Yahweh, עבד berfungsi sebagai ungkapan pelayanan dan ketundukan; “hamba” paling sesuai dengan konteks dan ragam bahasa Indonesia.
theological_decisions:
- issue: Gambaran antropomorfis tentang kehadiran Yahweh
  choice: Mempertahankan ungkapan konkret “datang dan berdiri di sana”
  alternative: Mengabstrakkannya menjadi “menampakkan diri” atau “menyatakan kehadiran-Nya”
  rationale: Teks Ibrani menggambarkan tindakan Yahweh secara konkret. Terjemahan tidak melunakkan atau menjelaskan gambaran tersebut secara teologis.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi mempertahankan nama khusus dalam teks sumber dan menghindari penyamaannya dengan gelar umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Bentuk “hamba-Mu” mempertahankan kesantunan serta kerendahan dalam sapaan, sedangkan urutan tindakan dan pengulangan nama Samuel tetap terlihat jelas.
