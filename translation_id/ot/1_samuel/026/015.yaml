  text: וַ/יֹּאמֶר֩ דָּוִ֨ד אֶל אַבְנֵ֜ר הֲ/לוֹא אִ֣ישׁ אַתָּ֗ה וּ/מִ֤י כָמ֨וֹ/ךָ֙ בְּ/יִשְׂרָאֵ֔ל וְ/לָ֨/מָּה֙ לֹ֣א שָׁמַ֔רְתָּ אֶל אֲדֹנֶ֖י/ךָ הַ/מֶּ֑לֶךְ כִּי בָא֙ אַחַ֣ד הָ/עָ֔ם לְ/הַשְׁחִ֖ית אֶת הַ/מֶּ֥לֶךְ אֲדֹנֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: id
  text: Daud berkata kepada Abner, “Bukankah engkau seorang laki-laki? Siapakah yang seperti engkau di Israel?[a] Jadi, mengapa engkau tidak menjaga tuanmu, sang raja? Sebab seorang dari rakyat[b] datang untuk membinasakan sang raja, tuanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapakah yang setara dengan engkau di Israel?”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang dari rakyat,” yaitu satu orang dari antara orang-orang di perkemahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: Bukankah engkau seorang laki-laki?
  rationale: Mempertahankan arti harfiah אִישׁ, ‘laki-laki’, dan bentuk pertanyaan retoris yang dipakai Daud untuk mempermalukan Abner, tanpa menambahkan sifat seperti ‘gagah berani’ yang tidak terdapat dalam teks.
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: Siapakah yang seperti engkau di Israel?
  rationale: Mempertahankan bentuk perbandingan כָמוֹךָ, ‘seperti engkau’, sekaligus menyampaikan makna bahwa Abner dipandang tidak tertandingi.
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: Lalu, mengapa engkau tidak menjaga
  rationale: שׁמר dalam konteks militer menyatakan tindakan menjaga dan melindungi. ‘Menjaga’ alami dalam bahasa Indonesia dan mencakup kewaspadaan protektif.
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: tuanmu, sang raja
  rationale: ‘Tuanmu’ mempertahankan hubungan hierarkis dalam אֲדֹנֶיךָ, sedangkan ‘sang raja’ mempertahankan aposisi dan memberi bentuk yang wajar dalam bahasa Indonesia.
- source_word: כִּי בָא אַחַד הָעָם
  choice: Sebab seorang dari rakyat datang
  rationale: Terjemahan ini mengikuti ungkapan Ibrani ‘seorang dari rakyat’ tanpa mempersempit acuannya menjadi tentara. Kata ‘datang’ mempertahankan bentuk tindakan yang dinyatakan teks.
- source_word: לְהַשְׁחִית
  choice: untuk membinasakan
  rationale: Bentuk Hifil שׁחת berarti ‘membinasakan’ atau ‘menghancurkan’. Dalam konteks ini sasarannya adalah nyawa raja, tetapi pilihan ini tidak mengganti ungkapan sumber dengan ‘membunuh’.
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: sang raja, tuanmu
  rationale: Urutan unsur Ibrani dipertahankan untuk menjaga pengulangan retoris yang menekankan tanggung jawab Abner terhadap raja yang menjadi tuannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan ‘engkau’ sesuai dengan dialog langsung dan teguran tajam. Pengulangan ‘sang raja, tuanmu’ dipertahankan sebagai tekanan retoris, bukan diperhalus.
