base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: id
  text: Lalu Daud dan Abisai mendatangi pasukan itu pada malam hari. Tampaklah Saul sedang berbaring dan tidur di dalam perkemahan[a], dengan tombaknya tertancap di tanah dekat kepalanya. Abner dan pasukan itu berbaring di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di dalam lingkaran. Kata Ibrani ini kemungkinan menunjuk pada susunan perkemahan yang berbentuk lingkaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: pasukan
  rationale: Dalam konteks militer ini, kata tersebut menunjuk kepada pasukan Saul, bukan rakyat secara umum.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Menyatakan waktu kedatangan secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Mempertahankan daya deiktis dan efek dramatis penanda naratif Ibrani dengan ragam yang tetap wajar dan bermartabat.
- source_word: שֹׁכֵב יָשֵׁן
  choice: sedang berbaring dan tidur
  rationale: Mempertahankan kedua unsur teks, yakni posisi tubuh Saul dan keadaannya yang tertidur.
- source_word: בַּמַּעְגָּל
  choice: di dalam perkemahan
  rationale: Memberikan makna kontekstual berupa kawasan atau formasi perkemahan, sambil mempertahankan kemungkinan arti harfiah dalam catatan kaki.
- source_word: חֲנִיתוֹ
  choice: tombaknya
  rationale: Istilah Indonesia yang lazim untuk senjata Saul dalam narasi ini.
- source_word: מְעוּכָה בָאָרֶץ
  choice: tertancap di tanah
  rationale: Mengungkapkan bahwa tombak itu ditekan atau ditancapkan hingga berada dalam posisi tetap di tanah.
- source_word: מְרַאֲשֹׁתָיו
  choice: dekat kepalanya
  rationale: Ungkapan Ibrani menunjuk tempat di sisi kepala seseorang; terjemahan ini alami dalam bahasa Indonesia.
- source_word: סְבִיבֹתָיו
  choice: di sekelilingnya
  rationale: Menunjukkan susunan Abner dan pasukan yang berbaring mengitari Saul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan ‘berbaring dan tidur’ dipertahankan untuk mencerminkan dua unsur ungkapan Ibrani, sedangkan ‘Tampaklah’ menjaga kejelasan dan daya hidup narasi.
