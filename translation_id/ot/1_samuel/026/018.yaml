translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat. Sapaan “tuanku” serta sebutan diri “hamba” mempertahankan suasana istana. Susunan “hambanya” sengaja dibiarkan sedikit tidak lazim demi mempertahankan bentuk orang ketiga dalam Teks Masoret, dengan penjelasan pada catatan kaki.
