  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: id
  text: Lalu ia berkata, “Mengapa tuanku mengejar hambanya[a] seperti ini? Sebab, apa yang telah kulakukan, dan kejahatan apa yang ada di tanganku[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hambanya.” Sebagian terjemahan memakai “hambamu” agar sesuai dengan sapaan langsung, tetapi Teks Masoret menggunakan bentuk orang ketiga.'
    reason: alternative_reading
  - marker: b
    text: “Di tanganku” adalah ungkapan Ibrani yang dapat menunjuk pada kesalahan, niat jahat, atau kemampuan untuk mencelakakan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan perkataan Daud. “Lalu” terdengar alami dalam narasi Indonesia tanpa memberi urutan waktu yang berlebihan.
- source_word: לָמָּה זֶּה
  choice: Mengapa ... seperti ini?
  rationale: Gabungan ini bersifat menegaskan dan dapat berarti “mengapa demikian?” Ungkapan “seperti ini” mempertahankan penekanan Ibrani dalam susunan Indonesia yang wajar.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Ini adalah sapaan hormat Daud kepada Saul sebagai atasan manusia, bukan gelar ilahi. “Tuanku” sesuai dengan suasana kerajaan dan hubungan mereka.
- source_word: רֹדֵף אַחֲרֵי
  choice: terus mengejar
  rationale: Partisip Ibrani menggambarkan pengejaran yang sedang berlangsung. “Terus mengejar” menyampaikan sifat berkelanjutan itu tanpa menambahkan tafsiran seperti “menganiaya”.
- source_word: עַבְדּוֹ
  choice: hambanya
  rationale: Teks Masoret memakai akhiran orang ketiga tunggal maskulin, secara harfiah “hambanya”. Bentuk ini dipertahankan meskipun dalam sapaan langsung bentuk “hambamu” terasa lebih lazim. “Hamba” cocok sebagai sebutan diri yang merendah di hadapan raja.
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang menjelaskan keberatan Daud.
- source_word: מֶה עָשִׂיתִי
  choice: apa yang telah kulakukan
  rationale: Terjemahan langsung yang alami; “telah” menyatakan tindakan lampau yang akibat atau relevansinya masih dipersoalkan.
- source_word: וּמַה בְּיָדִי רָעָה
  choice: dan kejahatan apa yang ada di tanganku
  rationale: Ungkapan ini mempertahankan metafora Ibrani “di tanganku”, yang menunjuk pada kesalahan, niat, atau kemampuan melakukan kejahatan. רָעָה diterjemahkan “kejahatan” agar kekuatan istilahnya tidak dilemahkan.
