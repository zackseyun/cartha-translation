source:
  edition: WLC
  text: וַ/יָּ֣קָם דָּוִ֗ד וַ/יָּבֹא֮ אֶֽל הַ/מָּקוֹם֮ אֲשֶׁ֣ר חָנָה שָׁ֣ם שָׁאוּל֒ וַ/יַּ֣רְא דָּוִ֗ד אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר שָֽׁכַב שָׁ֣ם שָׁא֔וּל וְ/אַבְנֵ֥ר בֶּן נֵ֖ר שַׂר צְבָא֑/וֹ וְ/שָׁאוּל֙ שֹׁכֵ֣ב בַּ/מַּעְגָּ֔ל וְ/הָ/עָ֖ם חֹנִ֥ים סביבת/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: id
  text: Lalu Daud bangkit dan pergi ke tempat Saul berkemah, lalu Daud melihat tempat Saul berbaring dan Abner anak Ner, panglima tentaranya. Saul sedang berbaring di dalam lingkaran perkemahan[a], sedangkan rakyat berkemah di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam lingkaran”; kemungkinan yang dimaksud ialah bagian dalam atau pusat susunan perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk naratif dari קום menandai tindakan berikutnya. 'Bangkit' mempertahankan corak naratif yang bermartabat tanpa harus menyiratkan bahwa Daud segera berangkat.
- source_word: וַיָּבֹא אֶל־הַמָּקוֹם
  choice: pergi ke tempat
  rationale: בוא dengan אֶל menyatakan gerak menuju suatu tempat. Dalam sudut pandang narasi bahasa Indonesia, 'pergi ke tempat' lebih alami daripada 'datang ke tempat'.
- source_word: חָנָה
  choice: berkemah
  rationale: Konteks sudah menempatkan peristiwa dalam urutan lampau, sehingga bahasa Indonesia tidak memerlukan bentuk khusus untuk menyatakan bahwa Saul sebelumnya mendirikan kemah di sana.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: melihat tempat
  rationale: ראה berarti melihat atau mengamati; 'melihat' merupakan padanan langsung dan wajar.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: berbaring ... sedang berbaring
  rationale: Pilihan ini membedakan bentuk perfektif yang mengidentifikasi tempat Saul berbaring dari bentuk partisipial yang menggambarkan keadaannya saat itu, tanpa mengubahnya menjadi 'tidur' yang lebih spesifik.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: juga Abner anak Ner, panglima tentaranya
  rationale: Kata 'juga' mempertahankan koordinasi Ibrani dan menghindari kesan bahwa Abner merupakan keterangan yang pasti menyatakan ia berbaring bersama Saul. 'Panglima tentaranya' adalah ungkapan Indonesia modern untuk שַׂר צְבָאוֹ.
- source_word: בַּמַּעְגָּל
  choice: di tengah lingkaran perkemahan
  rationale: מַעְגָּל secara harfiah menunjuk pada lingkaran atau susunan melingkar; dalam konteks ini kemungkinan berarti bagian dalam atau pusat formasi perkemahan. Terjemahan mempertahankan citra spasial sambil menjelaskannya secara alami.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: berkemah di sekelilingnya
  rationale: Partisipel חֹנִים dengan סְבִיבֹתָיו menggambarkan orang-orang yang mengelilingi Saul dalam keadaan berkemah.
