  to: Lalu Daud bangkit dan pergi ke tempat Saul berkemah, lalu Daud melihat tempat Saul berbaring dan Abner anak Ner, panglima tentaranya. Saul sedang berbaring di dalam lingkaran perkemahan[a], sedangkan rakyat berkemah di sekelilingnya.
