  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. 'Rakyat' dipakai untuk הָעָם dalam arti rombongan atau pasukan Saul, sementara catatan kaki mempertahankan ketidakpastian citra מַעְגָּל.
