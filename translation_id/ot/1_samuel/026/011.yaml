  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: id
  text: Kiranya Yahweh menjauhkan aku dari mengulurkan tanganku melawan orang yang diurapi oleh Yahweh[b]! Sekarang, ambillah tombak yang ada di dekat kepalanya dan kendi air itu, lalu mari kita pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Yang dimaksud ialah Saul sebagai raja yang telah diurapi oleh Yahweh. Kata Ibraninya berhubungan dengan kata “Mesias.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: Kiranya aku dijauhkan Yahweh
  rationale: Ungkapan ini menyatakan penolakan atau kejijikan yang sangat kuat dengan melibatkan Yahweh. Rumusan ini mempertahankan kemungkinan bahwa מֵיְהוָה berarti Yahweh sendiri menjauhkan tindakan itu dari Daud, tanpa mengubahnya menjadi sumpah yang lebih tegas daripada teks Ibrani.
- source_word: מִשְּׁלֹחַ יָדִי
  choice: dari mengulurkan tanganku
  rationale: Mempertahankan citra idiom Ibrani tentang mengulurkan tangan untuk melakukan tindakan bermusuhan atau menyerang.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: melawan orang yang diurapi Yahweh
  rationale: Dalam konteks ini מָשִׁיחַ menunjuk kepada Saul sebagai raja yang telah diurapi Yahweh. 'Orang yang diurapi' menjaga hubungan leksikal dengan tindakan pengurapan tanpa menjadikannya gelar 'Mesias'.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari penolakan Daud kepada perintah praktis berikutnya; bahasa Indonesia tidak memerlukan konjungsi tambahan.
- source_word: קַח נָא
  choice: ambillah
  rationale: Bentuk -lah secara alami melunakkan sekaligus menegaskan imperatif dalam bahasa Indonesia, sesuai fungsi נָא.
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: tombak yang ada di dekat kepalanya
  rationale: מְרַאֲשֹׁתָיו menunjuk lokasi di bagian kepala atau dekat kepala Saul ketika ia tidur. 'Di dekat kepalanya' jelas dan alami.
- source_word: צַפַּחַת הַמַּיִם
  choice: kendi air itu
  rationale: צַפַּחַת adalah wadah kecil untuk cairan; 'kendi air' merupakan padanan Indonesia yang umum dan mudah dipahami.
- source_word: וְנֵלֲכָה לָּנוּ
  choice: lalu mari kita pergi
  rationale: Menyampaikan bentuk kohortatif jamak sebagai ajakan untuk berangkat, sedangkan 'lalu' menunjukkan urutan tindakan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama ilahi yang terdapat dalam teks sumber dan mengikuti kebijakan proyek, tanpa menggantinya dengan gelar.
- issue: Makna מֵיְהוָה dalam formula חָלִילָה לִּי מֵיְהוָה
  choice: Yahweh sebagai pihak yang menjauhkan tindakan itu dari Daud
  alternative: demi Yahweh / di hadapan Yahweh
  rationale: Preposisi מִן dalam formula ini dapat dipahami sebagai sumber atau pihak yang mencegah, sementara sebagian penafsir menangkap nuansa seruan bersifat sumpah. Teks utama memilih konstruksi sumber yang alami dalam bahasa Indonesia, dan catatan mempertahankan alternatifnya.
- issue: Penerjemahan מָשִׁיחַ dalam konteks kerajaan Saul
  choice: orang yang diurapi
  alternative: Mesias
  rationale: Kata tersebut di sini menunjuk kepada raja historis yang diurapi Yahweh, bukan secara langsung kepada gelar eskatologis. Terjemahan ini mempertahankan makna dasarnya tanpa memasukkan klaim teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Citra Ibrani 'mengulurkan tangan' dipertahankan karena dapat dipahami dari konteks, sedangkan formula pembuka dijelaskan dengan catatan agar ambiguitas מֵיְהוָה tidak dihilangkan.
