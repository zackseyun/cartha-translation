  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: id
  text: Lalu Saul berkata, “Aku telah berdosa. Kembalilah, anakku Daud, sebab aku tidak akan mencelakaimu lagi. Pada hari ini nyawaku[a] berharga di matamu. Lihatlah, aku telah bertindak bodoh dan telah tersesat sangat jauh.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwaku.” Dalam konteks ini, kata Ibrani נֶפֶשׁ merujuk pada nyawa atau hidup Saul.
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah melakukan kekeliruan yang sangat besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Bentuk perfektif orang pertama tunggal menyatakan pengakuan langsung atas kesalahan Saul; bentuk ‘telah berdosa’ wajar dalam konteks pengakuan saat ini.
- source_word: שׁוּב
  choice: Kembalilah
  rationale: Imperatif ini mempertahankan panggilan langsung kepada Daud tanpa menentukan secara berlebihan ke mana ia harus kembali.
- source_word: בְּנִי דָוִד
  choice: anakku Daud
  rationale: Mempertahankan sapaan relasional sekaligus nama orang yang disapa.
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: aku tidak akan mencelakaimu lagi
  rationale: Bentuk Hifil dari רעע dalam konteks ini berarti mendatangkan celaka atau menyakiti seseorang; ‘mencelakaimu’ ringkas dan alami dalam bahasa Indonesia.
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Dalam konteks ini, ungkapan tersebut memperkenalkan alasan bagi janji Saul.
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: nyawaku berharga di matamu
  rationale: נֶפֶשׁ menunjuk pada nyawa Saul yang telah Daud biarkan hidup; idiom ‘berharga di matamu’ mempertahankan gambaran penilaian dalam teks Ibrani.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mencerminkan frasa demonstratif Ibrani dan sesuai dengan nada naratif yang khidmat.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian kepada pengakuan penutup Saul tanpa memakai bentuk arkais.
- source_word: הִסְכַּלְתִּי
  choice: aku telah bertindak bodoh
  rationale: Bentuk Hifil di sini menyatakan perilaku bodoh, bukan sekadar kekurangan kecerdasan.
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: dan telah sangat jauh tersesat
  rationale: שגה mempertahankan gambaran menyimpang atau tersesat, sedangkan הַרְבֵּה מְאֹד memberi penekanan kuat pada besarnya penyimpangan Saul.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam pengakuan Saul
  choice: Diterjemahkan ‘nyawaku’
  alternative: jiwaku; hidupku
  rationale: Dalam konteks naratif, Daud baru saja membiarkan Saul tetap hidup. Karena itu, נֶפֶשׁ secara konkret menunjuk pada nyawa atau hidup Saul, bukan membuat pernyataan khusus tentang hakikat jiwa.
- issue: Kekuatan pengakuan וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: telah sangat jauh tersesat
  alternative: telah melakukan kekeliruan yang sangat besar
  rationale: Pilihan utama mempertahankan metafora ‘tersesat/menyimpang’ sekaligus intensitas ungkapan Ibrani, tanpa mengurangi pengakuan Saul menjadi sekadar kesalahan kecil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan dan pengakuan dibuat langsung serta mudah dipahami; metafora Ibrani tentang tersesat dipertahankan.
