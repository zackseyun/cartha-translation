base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: id
  text: Lalu Saul mengenali suara Daud dan berkata, “Apakah ini suaramu, anakku Daud?” Daud berkata, “Ini suaraku, tuanku raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: mengenali
  rationale: Bentuk dari נכר di sini menyatakan bahwa Saul mengenali atau mengidentifikasi suara Daud. ‘Mengenali’ alami dalam bahasa Indonesia dan cocok dengan objek ‘suara Daud’.
- source_word: קוֹל
  choice: suara
  rationale: Dalam konteks pengenalan seorang penutur, קוֹל secara tepat berarti ‘suara’, bukan sekadar bunyi.
- source_word: הֲקוֹלְךָ זֶה
  choice: Apakah ini suaramu
  rationale: Terjemahan ini mempertahankan bentuk pertanyaan, kata tunjuk ‘ini’, dan fokus harfiah pada suara.
- source_word: בְּנִי
  choice: anakku
  rationale: Kata ini secara harfiah berarti ‘anakku’ dan mempertahankan bobot relasional serta ketegangan naratif ketika Saul menyapa Daud demikian.
- source_word: קוֹלִי
  choice: Ini suaraku
  rationale: Ungkapan Ibrani harfiah ‘suaraku’ merupakan jawaban tanpa kopula. ‘Ini suaraku’ melengkapi kopula yang tersirat sambil mempertahankan fokus leksikal pada suara.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: אֲדֹנִי merupakan sapaan hormat kepada manusia, sedangkan הַמֶּלֶךְ menyatakan gelar Saul. ‘Tuanku raja’ menyampaikan penghormatan dan gelar itu secara ringkas serta bermartabat.
- source_word: דָּוִד / שָׁאוּל
  choice: Daud / Saul
  rationale: Nama-nama pribadi mengikuti bentuk baku yang telah mapan dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Sapaan relasional בְּנִי dalam perkataan Saul
  choice: anakku
  alternative: anakku laki-laki; anakku sayang
  rationale: ‘Anakku’ mempertahankan bahasa kekeluargaan teks tanpa menambahkan penekanan jenis kelamin atau nuansa kasih sayang yang tidak dinyatakan. Ketegangan antara sapaan akrab Saul dan permusuhannya terhadap Daud tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dialog dibuat alami dengan ‘menjawab’ untuk וַיֹּאמֶר kedua, sementara pengulangan ‘suara’ dipertahankan karena penting dalam teks Ibrani.
