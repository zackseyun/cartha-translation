base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/014.yaml
  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: id
  text: Lalu Daud berseru kepada para prajurit dan kepada Abner anak Ner, “Tidakkah engkau menjawab, Abner?” Abner menjawab, “Siapakah engkau yang berseru kepada raja?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: para prajurit
  rationale: Dalam konteks perkemahan dan pasukan Saul, kata yang secara harfiah berarti ‘rakyat/orang-orang’ menunjuk kepada rombongan bersenjata atau pasukan.
- source_word: וַיִּקְרָא ... אֶל
  choice: berseru kepada
  rationale: Menggambarkan Daud memanggil dari kejauhan dengan suara keras; lebih tepat secara kontekstual daripada sekadar ‘memanggil’.
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: berseru kepada raja
  rationale: Mempertahankan konstruksi langsung Ibrani dan kesinambungan leksikal dengan seruan Daud sebelumnya.
