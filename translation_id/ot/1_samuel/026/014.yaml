  source_fidelity: 'Setia pada teks Ibrani. הָעָם secara harfiah berarti “orang-orang/rakyat,” tetapi dalam konteks perkemahan Saul dapat merujuk pada kelompok pasukan; “para prajurit” merupakan pemaknaan kontekstual yang wajar dan sejalan dengan jejak audit Inggris (“troops”). “Berseru kepada” tepat untuk וַיִּקְרָא ... אֶל, dan pertanyaan Abner mempertahankan relasi klausa Ibrani: “Siapakah engkau yang berseru kepada raja?”'
