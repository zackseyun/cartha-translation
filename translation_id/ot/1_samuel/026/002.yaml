base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: id
  text: Lalu Saul bangkit dan turun ke padang gurun Zif bersama tiga ribu orang pilihan Israel untuk mencari Daud di padang gurun Zif.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk naratif dari קום menandai dimulainya tindakan yang tegas. “Bangkit” mempertahankan idiom Ibrani dan tetap wajar dalam narasi Indonesia.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata ירד menyatakan gerak turun. Pilihan “turun” mempertahankan unsur arah yang terdapat dalam teks sumber.
- source_word: מִדְבַּר זִיף
  choice: padang gurun Zif
  rationale: מִדְבָּר menunjuk kawasan liar atau tandus yang tidak harus berupa gurun pasir. “Padang gurun Zif” merupakan padanan geografis yang jelas dan lazim.
- source_word: וְאִתּוֹ
  choice: bersama dia
  rationale: Frasa ini menyatakan penyertaan. Penempatannya di awal kalimat kedua mencerminkan penonjolan frasa tersebut dalam bahasa Ibrani tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: tiga ribu orang
  rationale: Terjemahan ini mempertahankan penyebutan umum “orang” dan tidak menambahkan kata “prajurit”, meskipun konteksnya bersifat militer.
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: orang pilihan dari Israel
  rationale: Ungkapan ini menunjuk orang-orang Israel yang dipilih atau diseleksi. “Dari Israel” memperjelas hubungan konstruksi itu secara alami dalam bahasa Indonesia.
- source_word: לְבַקֵּשׁ
  choice: untuk mencari
  rationale: Dalam konteks pengejaran ini, בקש berarti berusaha menemukan seseorang; “mencari” adalah padanan langsung dan alami.
- source_word: אֶת דָּוִד
  choice: Daud
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama pribadi dipertahankan dalam bentuk Indonesianya yang lazim.
- source_word: בְּמִדְבַּר זִיף
  choice: di padang gurun Zif
  rationale: Preposisi בְּ diterjemahkan “di”. Pengulangan nama lokasi dipertahankan karena juga diulang dalam teks Ibrani.
