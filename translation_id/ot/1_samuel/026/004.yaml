  text: So David sent out scouts[a], and he learned that Saul had indeed come.
translation:
  language: id
  text: Lalu Daud mengirim para pengintai, dan ia mengetahui dengan pasti bahwa Saul telah datang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan ia mengetahui bahwa Saul benar-benar telah datang.” Istilah Ibrani terakhir kemungkinan menambahkan nuansa kepastian atau peneguhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Kata kerja שׁלח berarti ‘mengirim’; bentuk naratifnya diterjemahkan secara alami sebagai kelanjutan peristiwa.
- source_word: מְרַגְּלִים
  choice: para pengintai
  rationale: Istilah ini menunjuk orang-orang yang mengintai atau melakukan pengintaian; ‘para pengintai’ alami dalam konteks militer dan tidak membawa konotasi politik yang tidak perlu.
- source_word: וַיֵּדַע
  choice: ia mendapat kepastian
  rationale: ידע pada dasarnya berarti ‘mengetahui’, tetapi setelah Daud mengirim pengintai, frasa ini menyatakan hasil verifikasi yang diterimanya.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang diketahui Daud.
- source_word: בָא
  choice: telah datang
  rationale: Bentuk perfektif menyajikan kedatangan Saul sebagai fakta yang sudah terjadi ketika Daud mengetahuinya.
- source_word: אֶל נָכוֹן
  choice: benar-benar
  rationale: Ungkapan yang sulit ini kemungkinan besar berfungsi secara adverbial dan menegaskan kepastian atau konfirmasi, bukan tujuan tempat.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk baku nama ini dalam Alkitab bahasa Indonesia.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk baku nama ini dalam Alkitab bahasa Indonesia.
