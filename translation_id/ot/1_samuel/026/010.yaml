    issue: Bentuk «ia mati» dalam konstruksi «harinya akan tiba dan ia mati»
    rationale: Walaupun dapat dipahami, bentuk ini terdengar kurang alami dalam prosa Indonesia modern sesudah dua predikat masa depan. «Ia akan mati» menyatakan daya futurum yang tersirat dalam rangkaian Ibrani secara jelas tanpa mengubah arti.
  - severity: low
    issue: Catatan kaki a menyebut teks utama sebagai «Secara harfiah» lalu hanya menguraikan maknanya
    rationale: Karena teks utama yang direvisi sudah menyatakan kedua unsur Ibrani secara langsung, catatan ini tidak diperlukan dan berpotensi menyarankan adanya perbedaan tekstual yang tidak ada.
