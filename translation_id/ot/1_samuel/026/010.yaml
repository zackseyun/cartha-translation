base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: id
  text: Lalu Daud berkata, “Demi Yahweh yang hidup, Yahweh pasti akan menghantamnya, atau harinya akan tiba dan ia akan mati, atau ia akan turun ke medan perang dan binasa.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan ini merupakan formula sumpah Ibrani. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kekuatan sumpah yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי אִם
  choice: pasti
  rationale: Dalam konteks sumpah, ungkapan ini menegaskan isi pernyataan Daud; 'pasti' menyampaikan daya penegasan tersebut secara wajar.
- source_word: יִגָּפֶנּוּ
  choice: akan menghantamnya
  rationale: Kata kerja נָגַף menunjukkan bahwa Yahweh akan menimpakan pukulan kepadanya. 'Menghantamnya' mempertahankan gambaran pukulan tanpa menentukan cara atau hasil akhirnya secara berlebihan.
- source_word: יוֹמוֹ יָבוֹא
  choice: harinya akan tiba
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menunjuk pada datangnya waktu kematian yang ditetapkan.
- source_word: וָמֵת
  choice: dan ia mati
  rationale: Bentuk ini mengikuti rangkaian Ibrani dan menyatakan hasil ketika harinya tiba tanpa menambahkan gagasan yang tidak tersurat.
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: ia akan turun ke medan perang
  rationale: '''Turun'' mempertahankan kata kerja gerak יָרַד, sedangkan ''ke medan perang'' merupakan ungkapan Indonesia yang alami.'
- source_word: וְנִסְפָּה
  choice: dan binasa
  rationale: '''Binasa'' membedakan סָפָה dari kata ''mati'' sebelumnya dan menyampaikan gagasan lenyap atau tewas dalam peperangan.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cara kematian Saul
  choice: Mempertahankan tiga kemungkinan yang dinyatakan Daud
  alternative: Menafsirkan semuanya sebagai tindakan langsung Yahweh
  rationale: Ayat ini menyandingkan pukulan Yahweh, tibanya hari Saul, dan kebinasaan dalam perang. Terjemahan tidak menyamakan atau memisahkan kemungkinan-kemungkinan itu melebihi yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula sumpah dibuat alami bagi pembaca umum, sementara idiom 'harinya akan tiba' dan gerak 'turun' dipertahankan agar citra serta ketegangan teks Ibrani tidak diratakan.
