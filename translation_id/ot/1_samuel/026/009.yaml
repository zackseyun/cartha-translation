base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: id
  text: Namun Daud berkata kepada Abisai, “Jangan binasakan dia, sebab siapakah yang dapat mengulurkan tangannya terhadap orang yang diurapi oleh Yahweh[a] dan tidak bersalah?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “orang yang diurapi” berasal dari keluarga kata yang sama dengan “Mesias.” Di sini kata itu menunjuk kepada Saul sebagai raja yang diurapi oleh Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Daud berkata
  rationale: Waw-konsekutif melanjutkan narasi, sedangkan “Namun” menyatakan pertentangan kontekstual karena Daud menolak usul Abisai untuk membunuh Saul.
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: Jangan binasakan dia
  rationale: Bentuk Hifil dari שׁחת berarti membinasakan atau merusakkan. “Binasakan” mempertahankan keluasan verba Ibrani sekaligus jelas dalam konteks ancaman maut.
- source_word: כִּי מִי
  choice: sebab siapakah yang dapat
  rationale: כִּי memperkenalkan alasan, dan pertanyaan retoris מִי menyiratkan ketidakmungkinan bertindak demikian tanpa menanggung kesalahan.
- source_word: שָׁלַח יָדוֹ
  choice: mengulurkan tangannya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang menunjuk pada tindakan menyerang atau mencelakakan seseorang.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: melawan orang yang diurapi Yahweh
  rationale: מָשִׁיחַ di sini menunjuk kepada Saul sebagai raja yang diurapi Yahweh. “Orang yang diurapi” mempertahankan arti historisnya tanpa langsung menjadikannya gelar eskatologis.
- source_word: וְנִקָּה
  choice: dan tetap tidak bersalah
  rationale: נקה menyatakan bebas dari kesalahan atau tanggungan. “Tetap tidak bersalah” mempertahankan fokus moral dan tidak mempersempit maknanya menjadi sekadar lolos dari hukuman.
theological_decisions:
- issue: Makna מְשִׁיחַ ketika dikenakan kepada Saul
  choice: orang yang diurapi Yahweh
  alternative: Mesias Yahweh
  rationale: Dalam konteks sejarah ini, istilah tersebut menunjuk kepada Saul sebagai raja yang telah diurapi Yahweh, bukan secara langsung kepada tokoh Mesias eskatologis. Catatan kaki mempertahankan hubungan leksikalnya dengan istilah “Mesias”.
- issue: Daya pertanyaan retoris tentang tidak bersalah
  choice: siapakah yang dapat ... dan tetap tidak bersalah?
  alternative: siapakah yang ... dan tidak dihukum?
  rationale: Pilihan utama mempertahankan ketegangan antara kesalahan moral dan akibat hukumnya tanpa membatasi נקה hanya pada lolos dari hukuman.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Ungkapan “mengulurkan tangannya” dipertahankan untuk mencerminkan idiom Ibrani, sementara susunan kalimat dibuat alami bagi pembaca umum.
