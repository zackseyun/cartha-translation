  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: id
  text: Jadi sekarang, jangan biarkan darahku tertumpah ke tanah jauh dari hadirat Yahweh, sebab raja Israel telah keluar untuk mencari seekor kutu saja, seperti orang memburu ayam hutan di pegunungan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּמִי
  choice: darahku
  rationale: Mempertahankan gambaran konkret tentang kematian dengan kekerasan dan kemungkinan kesalahan karena menumpahkan darah; 'nyawaku' akan terlalu menghaluskan idiom Ibraninya.
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: jangan biarkan ... tertumpah ke tanah
  rationale: Dalam bahasa Indonesia, darah secara alami dikatakan 'tertumpah'; ungkapan ini mempertahankan citra darah yang jatuh ke tanah tanpa menjadi kaku.
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: jauh dari hadirat Yahweh
  rationale: Mengungkapkan idiom spasial 'dari hadapan/wajah Yahweh' secara wajar sambil mempertahankan gagasan keterasingan dari hadirat-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: יָצָא
  choice: telah keluar
  rationale: Mempertahankan verba gerak Ibrani dan menyatakan bahwa raja berangkat melakukan pengejaran.
- source_word: לְבַקֵּשׁ
  choice: untuk mencari
  rationale: Mempertahankan arti leksikal yang luas dan membiarkan konteks menyampaikan unsur pengejaran.
- source_word: פַּרְעֹשׁ אֶחָד
  choice: seekor kutu saja
  rationale: Mempertahankan metafora merendahkan diri serta penekanan אֶחָד pada satu ekor yang tidak berarti.
- source_word: הַקֹּרֵא
  choice: ayam hutan
  rationale: Nama burung ini secara tradisional dipahami sebagai partridge; 'ayam hutan' merupakan padanan Indonesia yang mudah dipahami dalam konteks perburuan, meskipun identifikasi spesies tepatnya tidak pasti.
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: seperti orang memburu ... di pegunungan
  rationale: Menghasilkan perbandingan yang alami dalam bahasa Indonesia sambil mempertahankan tindakan pengejaran dan latar pegunungan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Makna מִנֶּגֶד פְּנֵי יְהוָה
  choice: jauh dari hadirat Yahweh
  alternative: dari hadapan Yahweh
  rationale: Pilihan utama menyampaikan idiom Ibrani secara alami dan tetap membuka nuansa geografis serta relasional, tanpa menentukan secara sempit apakah yang dimaksud adalah tanah, tempat kudus, atau perlindungan ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur dan citra Ibrani dipertahankan sejauh tetap alami; 'seekor kutu saja' menonjolkan ironi dan sikap merendahkan diri Daud.
