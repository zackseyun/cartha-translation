base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: id
  text: Yahweh akan membalas setiap orang sesuai dengan kebenaran dan kesetiaannya[a], sebab hari ini Yahweh menyerahkan engkau ke dalam tanganku, tetapi aku tidak mau mengulurkan tanganku untuk menyerang orang yang diurapi Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Yahweh akan mengembalikan kepada setiap orang kebenaran dan kesetiaannya.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Saul, raja yang diurapi oleh Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיהוָה יָשִׁיב לָאִישׁ
  choice: Yahweh akan membalas setiap orang
  rationale: Bentuk Hifil יָשִׁיב dalam konteks ini menyatakan pemberian balasan kepada masing-masing individu. 'Setiap orang' menyampaikan daya generik אִישׁ secara alami dalam bahasa Indonesia.
- source_word: אֶת צִדְקָתוֹ וְאֶת אֱמֻנָתוֹ
  choice: sesuai dengan kebenaran dan kesetiaannya
  rationale: צְדָקָה menunjuk pada kelurusan moral, sedangkan אֱמוּנָה menunjuk pada keteguhan atau kesetiaan yang nyata dalam tindakan. 'Sesuai dengan' menjelaskan hubungan ukuran balasan secara idiomatis tanpa mengubah makna dasar.
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: sebab hari ini Yahweh menyerahkan engkau ke dalam tanganku
  rationale: Klausa relatif ini menjelaskan kesempatan yang memperlihatkan kelurusan dan kesetiaan Daud. 'Ke dalam tanganku' mempertahankan metafora kuasa atau kendali dari idiom Ibrani.
- source_word: וְלֹא אָבִיתִי
  choice: tetapi aku tidak mau
  rationale: Kata אָבָה menyatakan kemauan; bentuk negatifnya berarti tidak bersedia. 'Tetapi' menampilkan kontras antara kesempatan yang diberikan dan pengekangan diri Daud.
- source_word: לִשְׁלֹחַ יָדִי
  choice: mengulurkan tanganku untuk menyerang
  rationale: Terjemahan ini mempertahankan citra tangan dalam idiom Ibrani sekaligus menjelaskan bahwa tindakan yang dimaksud adalah serangan atau kekerasan.
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: מָשִׁיחַ di sini adalah sebutan bagi Saul sebagai raja yang diurapi oleh Yahweh, bukan pemakaian langsung gelar mesianik dalam pengertian kemudian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung; bentuk 'Yahweh' mempertahankan nama tersebut.
- issue: Daya generik אִישׁ
  choice: setiap orang
  alternative: setiap laki-laki
  rationale: Dalam pernyataan umum ini אִישׁ berdaya distributif dan generik. 'Setiap orang' adalah ungkapan Indonesia yang wajar dan tidak membatasi prinsip balasan hanya kepada laki-laki.
- issue: Makna מְשִׁיחַ mengenai Saul
  choice: orang yang diurapi Yahweh
  alternative: Mesias Yahweh
  rationale: Konteks historis menunjuk kepada Saul sebagai raja yang telah diurapi. 'Mesias' dapat memasukkan kekhususan kristologis yang tidak dituntut konteks ini.
- issue: Hubungan balasan dengan kebenaran dan kesetiaan
  choice: membalas ... sesuai dengan
  alternative: mengembalikan ... kebenaran dan kesetiaannya
  rationale: Ungkapan ini menyatakan bahwa Yahweh memberi balasan menurut perilaku seseorang, bukan bahwa kualitas moral itu secara harfiah dikembalikan kepadanya. Catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dan 'aku' menjaga nuansa dialog langsung. Metafora 'ke dalam tanganku' dan 'mengulurkan tanganku' dipertahankan, dengan tujuan tindakan diperjelas melalui 'untuk menyerang'.
