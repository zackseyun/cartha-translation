  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַן דָּוִד֙ וַ/יֹּ֔אמֶר הִנֵּ֖ה ה/חנית הַ/מֶּ֑לֶךְ וְ/יַעֲבֹ֛ר אֶחָ֥ד מֵֽ/הַ/נְּעָרִ֖ים וְ/יִקָּחֶֽ/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/022.yaml
  text: David answered and said[a], “Here is the king’s spear[b]. Let one of the young men come over and take it.”
translation:
  language: id
  text: Daud menjawab dan berkata, “Ini tombak raja. Biarlah salah seorang dari antara para pemuda[b] itu datang kemari[a] dan mengambilnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyeberang kemari”; verba Ibrani yang digunakan secara harfiah berarti “lewat” atau “menyeberang.”
    reason: lexical_alternative
  - marker: b
    text: “Para pemuda” juga dapat diterjemahkan “para pelayan” atau “para pengiring”, sebab istilah Ibraninya dapat menunjuk usia muda ataupun kedudukan sebagai bawahan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam narasi Ibrani, ענה lazim memperkenalkan tanggapan. Pilihan ini mempertahankan idiom sumber dan sesuai dengan ujaran Daud sebagai jawaban.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Mempertahankan kedua verba dalam rangkaian Ibrani וַיַּעַן ... וַיֹּאמֶר tanpa membuat ungkapan Indonesia terasa tidak wajar.
- source_word: הִנֵּה
  choice: Ini
  rationale: Partikel deiktis ini menarik perhatian kepada tombak yang ada di tempat Daud; “Ini” alami dalam bahasa Indonesia modern dan mempertahankan daya tunjuknya.
- source_word: הַחֲנִית
  choice: tombak
  rationale: חֲנִית menunjuk pada senjata tikam bertangkai; “tombak” merupakan istilah Indonesia yang umum dan mudah dipahami.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Konstruksi Ibrani menyatakan hubungan kepemilikan, yang secara alami diterjemahkan sebagai “tombak raja” dalam bahasa Indonesia.
- source_word: וְיַעֲבֹר
  choice: datang kemari
  rationale: עבר secara harfiah berarti lewat atau menyeberang. Dalam konteks ini, gerak yang dimaksud ialah dari pihak Saul menuju tempat Daud; “datang kemari” menyampaikan arah itu secara alami, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: אֶחָד
  choice: salah seorang
  rationale: Numeralia ini dipakai secara substantival untuk menunjuk satu orang dari kelompok yang disebut sesudahnya.
- source_word: מֵהַנְּעָרִים
  choice: dari antara para pemuda
  rationale: נַעַר dapat menunjuk pemuda maupun pelayan atau pengiring. “Para pemuda” mempertahankan arti leksikal dasarnya tanpa menetapkan status mereka secara berlebihan; kemungkinan lain dicatat dalam catatan kaki.
- source_word: וְיִקָּחֶהָ
  choice: dan mengambilnya
  rationale: לקח adalah verba umum untuk “mengambil”; sufiks feminin merujuk kembali kepada tombak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Rumusan “menjawab dan berkata” mempertahankan pengulangan verba dalam teks Ibrani, sedangkan “datang kemari” menyampaikan arah gerak secara idiomatis.
