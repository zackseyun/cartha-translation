id: 1SA.26.24
reference: 1 Samuel 26:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: id
  text: Lihatlah, sebagaimana hidupmu berharga di mataku pada hari ini, demikianlah kiranya hidupku berharga di mata Yahweh, dan kiranya Dia melepaskan aku dari segala kesesakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebagaimana hidupmu besar di mataku ... demikianlah kiranya hidupku besar di mata Yahweh.” Dalam idiom Ibrani, “besar” di sini menyatakan nilai yang tinggi, yaitu “berharga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Menandai ajakan yang tegas untuk memperhatikan perkataan berikutnya; bentuk ini alami dalam bahasa Indonesia modern sekaligus tetap bermartabat.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: sebagaimana ... demikianlah
  rationale: Mempertahankan struktur perbandingan yang menghubungkan tindakan Daud terhadap Saul dengan harapan Daud kepada Yahweh.
- source_word: גָּדְלָה נַפְשְׁךָ בְּעֵינַי
  choice: hidupmu berharga di mataku
  rationale: Secara harfiah idiom ini memakai gagasan 'besar', tetapi dalam konteks Daud menyayangkan nyawa Saul, maknanya ialah dinilai tinggi atau berharga.
- source_word: נֶפֶשׁ
  choice: hidup
  rationale: Dalam konteks penyelamatan nyawa dan pelepasan dari bahaya, kata ini menunjuk pada hidup seseorang, bukan secara khusus jiwa sebagai unsur nonjasmani.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mempertahankan penekanan waktu dalam bahasa Indonesia yang jelas dan wajar.
- source_word: תִּגְדַּל נַפְשִׁי בְּעֵינֵי יְהוָה
  choice: kiranya hidupku berharga di mata Yahweh
  rationale: Bentuk verba dipahami sebagai harapan atau permohonan. Pengulangan 'berharga' mempertahankan kesejajaran dengan klausa sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: וְיַצִּלֵנִי
  choice: dan kiranya Dia melepaskan aku
  rationale: Bentuk kausatif נצל menyatakan tindakan menyelamatkan atau melepaskan; 'kiranya' mempertahankan nuansa harapan atau doa.
- source_word: מִכָּל צָרָה
  choice: dari segala kesesakan
  rationale: צָרָה mencakup kesusahan, tekanan, atau bahaya; 'segala kesesakan' mempertahankan keluasan dan bobot ungkapan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Hubungan antara tindakan Daud dan tindakan Yahweh yang diharapkan
  choice: Mempertahankan bentuk perbandingan dan harapan tanpa menyatakannya sebagai jaminan otomatis
  alternative: Menerjemahkannya sebagai kepastian bahwa Yahweh wajib membalas Daud secara setimpal
  rationale: Bentuk Ibrani dapat menyuarakan harapan atau doa. Teks membandingkan penghargaan Daud terhadap hidup Saul dengan penghargaan yang diharapkannya dari Yahweh, tetapi tidak perlu diubah menjadi prinsip balasan mekanis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Lihatlah' mempertahankan penekanan wacana, sedangkan 'kiranya' menyampaikan nuansa harapan atau doa. Penanda catatan kaki [a] ditempatkan pada akhir ayat karena catatan menjelaskan kedua klausa sejajar yang memakai idiom yang sama.
