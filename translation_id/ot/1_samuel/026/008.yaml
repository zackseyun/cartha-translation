base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: id
  text: Lalu Abisai berkata kepada Daud, “Hari ini Allah telah menyerahkan musuhmu ke dalam tanganmu.[a] Sekarang, izinkanlah aku menikamnya dengan tombak sampai tertancap ke tanah dalam satu tikaman saja,[b] dan aku tidak akan menikamnya untuk kedua kalinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, “Hari ini Allah telah menyerahkan musuhmu ke dalam kuasamu.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dengan tombak dan ke dalam tanah, satu kali.” Maksudnya, Abisai menawarkan untuk menikam Saul hingga tertancap ke tanah dengan satu tikaman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: telah menyerahkan
  rationale: Dalam konteks ini verba itu berarti menyerahkan seseorang ke dalam kuasa orang lain, bukan secara harfiah ‘menutup’ atau ‘mengurung’.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan ungkapan Ibrani tentang penyerahan ke dalam kuasa seseorang; catatan kaki menjelaskan maknanya.
- source_word: אַכֶּנּוּ נָא
  choice: izinkanlah aku menikamnya
  rationale: Bentuk kohortatif dengan נָא menyatakan permohonan atau kehendak Abisai. ‘Menikam’ sesuai dengan tindakan menggunakan tombak dalam konteks ini.
- source_word: בַּחֲנִית וּבָאָרֶץ
  choice: dengan tombak sampai tertancap ke tanah
  rationale: Mengungkapkan secara alami gambaran serangan yang menembus korban dan menancapkannya ke tanah, sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: פַּעַם אַחַת
  choice: dalam satu tikaman saja
  rationale: Menunjukkan bahwa satu serangan menurut Abisai akan cukup; ‘tikaman’ selaras dengan alat yang disebutkan.
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: aku tidak perlu menikamnya untuk kedua kalinya
  rationale: Verba ‘mengulangi’ bersifat eliptis; tindakan yang tersirat ialah menikam. ‘Tidak perlu’ menyampaikan keyakinan Abisai bahwa satu tikaman akan cukup.
- source_word: וַיֹּאמֶר ... אֶל
  choice: Lalu Abisai berkata kepada Daud
  rationale: Waw naratif melanjutkan urutan cerita; ‘Lalu’ merupakan padanan Indonesia yang alami.
theological_decisions:
- issue: Peran ilahi dalam keadaan Saul yang tidak berdaya
  choice: Hari ini Allah telah menyerahkan musuhmu ke dalam tanganmu
  alternative: Hari ini Allah telah menyerahkan musuhmu ke dalam kuasamu
  rationale: Terjemahan mempertahankan klaim Abisai mengenai tindakan Allah tanpa menyiratkan bahwa narator membenarkan usulnya untuk membunuh Saul.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Ungkapan ‘ke dalam tanganmu’ dipertahankan karena dapat dipahami dan menjaga citra bahasa sumber, sedangkan catatan kaki menerangkan makna idiomatisnya. Pronomina akrab tunggal ‘-mu’ sesuai dengan percakapan langsung antara Abisai dan Daud.
