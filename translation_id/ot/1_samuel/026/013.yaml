  text: וַ/יַּעֲבֹ֤ר דָּוִד֙ הָ/עֵ֔בֶר וַ/יַּעֲמֹ֥ד עַל רֹאשׁ הָ/הָ֖ר מֵֽ/רָחֹ֑ק רַ֥ב הַ/מָּק֖וֹם בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/013.yaml
  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: id
  text: Kemudian Daud menyeberang ke sisi lain dan berdiri di puncak gunung itu dari kejauhan; jarak di antara mereka sangat jauh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ruang/tempat di antara mereka besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Kata kerja עבר menyatakan gerakan melintasi atau berpindah dari satu sisi ke sisi lain; “menyeberang” alami dan mempertahankan arah geraknya.
- source_word: הָעֵבֶר
  choice: ke sisi lain
  rationale: Nomina ini menunjuk sisi seberang atau sisi yang berlawanan; “sisi lain” jelas dan wajar dalam konteks geografis narasi.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Makna dasarnya ialah “berdiri”; pilihan sederhana ini tidak menambahkan penafsiran tentang sikap atau maksud Daud.
- source_word: עַל רֹאשׁ הָהָר
  choice: di puncak gunung itu
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi dalam pemakaian topografis berarti “puncak”; artikel pada הָהָר dipertahankan dengan “gunung itu”.
- source_word: מֵרָחֹק
  choice: dari kejauhan
  rationale: Ungkapan ini menunjukkan bahwa Daud mengambil posisi pada jarak yang jauh; “dari kejauhan” alami dalam bahasa Indonesia dan mempertahankan nuansa sumber.
- source_word: רַב הַמָּקוֹם
  choice: jarak ... sangat jauh
  rationale: Secara harfiah, frasa ini menyatakan bahwa “tempat/ruang itu besar”; dalam konteks, maksudnya ialah jarak pemisah yang besar. Rumusan Indonesia ini jelas tanpa mengubah fungsi naratifnya.
- source_word: בֵּינֵיהֶם
  choice: di antara mereka
  rationale: Frasa preposisional ini menandai ruang atau jarak yang memisahkan Daud dari pihak di seberangnya.
