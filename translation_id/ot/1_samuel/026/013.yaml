  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan gagasan kejauhan dipertahankan karena terdapat dalam teks Ibrani, sementara ungkapan harfiahnya dijelaskan dalam catatan kaki.
