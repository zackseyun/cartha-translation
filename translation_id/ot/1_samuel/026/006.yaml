translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Bentuk sapaan pronominal ‘aku’ dan ‘-mu’ dipakai karena percakapan berlangsung di antara rekan, sedangkan struktur sumber dipertahankan sejauh tetap jelas dan alami.
