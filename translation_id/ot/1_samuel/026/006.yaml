  naturalness: Bahasa draft umumnya modern dan jelas. Namun, "menemui Saul, ke perkemahan itu" kurang lancar dalam bahasa Indonesia. Pembacaan idiomatis "menemui Saul di perkemahan" alami, dengan alternatif yang lebih harfiah dijelaskan dalam catatan kaki.
  terminology: Transliterasi Ahimelekh, Abisai, Zeruya, dan Yoab serta sebutan "orang Het" sudah tepat dan konsisten dengan register Alkitab bahasa Indonesia. "Perkemahan" merupakan padanan yang baik untuk הַמַּחֲנֶה.
