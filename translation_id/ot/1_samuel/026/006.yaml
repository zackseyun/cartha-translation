  to: Lalu Daud menjawab dan berkata kepada Ahimelekh, orang Het itu, dan kepada Abisai anak Zeruya, saudara Yoab, “Siapa yang akan turun bersamaku menemui Saul di perkemahan[a]?” Lalu Abisai berkata, “Aku akan turun bersamamu.”
  rationale: Revisi mengganti "mau" dengan "akan" agar bentuk verbal Ibrani tetap terbuka bagi nuansa masa depan dan kesediaan, mengganti "menjawab" Abisai dengan "berkata" sesuai verba sumber, serta melancarkan hubungan Saul dan perkemahan dalam teks utama. Catatan kaki mempertahankan struktur dua kata depan dalam bahasa Ibrani tanpa memaksakan susunan yang janggal dalam bahasa Indonesia.
