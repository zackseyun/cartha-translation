base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: id
  text: Lalu Daud menjawab dan berkata kepada Ahimelekh, orang Het itu, dan kepada Abisai anak Zeruya, saudara Yoab, “Siapa yang akan turun bersamaku menemui Saul di perkemahan[a]?” Lalu Abisai berkata, “Aku akan turun bersamamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “kepada Saul, ke perkemahan.” Dalam bahasa Ibrani, kata depan yang berarti “ke/kepada” diulang sebelum “Saul” dan “perkemahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: Lalu Daud menjawab dan berkata
  rationale: Mempertahankan formula naratif Ibrani yang memakai kedua verba, ענה dan אמר, dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: Ahimelekh, orang Het itu
  rationale: Nama diri ditransliterasikan, sedangkan penanda etnis diterjemahkan. Bentuk ini alami dan dengan jelas membedakan tokoh tersebut.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai anak Zeruya, saudara Yoab
  rationale: Hubungan keluarga dipertahankan sesuai urutan teks sumber tanpa menambahkan penafsiran mengenai garis keturunan atau fungsi kekerabatannya.
- source_word: מִי יֵרֵד אִתִּי
  choice: Siapa yang mau turun bersamaku
  rationale: Kata ירד memiliki arti arah ‘turun’. Ungkapan ‘yang mau’ secara alami menyampaikan pertanyaan tentang kesediaan calon pendamping, sementara ‘turun’ mempertahankan gambaran arah dalam teks.
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: menemui Saul, ke perkemahan itu
  rationale: Pengulangan אֶל sebelum ‘Saul’ dan ‘perkemahan’ tetap tercermin melalui dua unsur tujuan. ‘Menemui Saul’ lebih alami daripada ‘kepada Saul’ dalam konteks gerakan menuju seseorang.
- source_word: הַמַּחֲנֶה
  choice: perkemahan itu
  rationale: מחנה menunjuk tempat pasukan berkemah. ‘Perkemahan’ jelas dan alami dalam bahasa Indonesia; artikel definit Ibrani dinyatakan dengan ‘itu’.
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: Aku akan turun bersamamu
  rationale: Mengulangi verba ‘turun’ seperti dalam pertanyaan Daud dan mempertahankan penekanan eksplisit pada אֲנִי, ‘aku’.
