  text: וְ/עַתָּ֗ה יִֽשְׁמַֽע נָא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י עַבְדּ֑/וֹ אִם יְהוָ֞ה הֱסִֽיתְ/ךָ֥ בִ/י֙ יָרַ֣ח מִנְחָ֔ה וְ/אִ֣ם בְּנֵ֣י הָ/אָדָ֗ם אֲרוּרִ֥ים הֵם֙ לִ/פְנֵ֣י יְהוָ֔ה כִּֽי גֵרְשׁ֣וּ/נִי הַ/יּ֗וֹם מֵ/הִסְתַּפֵּ֜חַ בְּ/נַחֲלַ֤ת יְהוָה֙ לֵ/אמֹ֔ר לֵ֥ךְ עֲבֹ֖ד אֱלֹהִ֥ים אֲחֵרִֽים־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/019.yaml
  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: id
  text: Sekarang, kiranya tuanku, raja, mendengarkan perkataan hambanya. Jika TUHAN telah menggerakkan tuanku melawan aku, kiranya Dia berkenan menerima persembahan[a]. Namun, jika manusia yang melakukannya, mereka terkutuk di hadapan TUHAN, sebab hari ini mereka telah mengusir aku dari mendapat bagian dalam milik pusaka TUHAN[b], dengan berkata, ‘Pergilah, beribadahlah kepada ilah-ilah lain!’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kiranya Dia mencium persembahan,” suatu ungkapan untuk menerima atau berkenan pada kurban persembahan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari menggabungkan diri dengan milik pusaka TUHAN.” Ungkapan Ibrani dapat menekankan keterikatan atau keikutsertaan dalam tanah dan umat yang menjadi milik TUHAN.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai peralihan wacana menuju permohonan Daud; bahasa Indonesia tidak memerlukan penyalinan konjungsi waw secara mekanis.
- source_word: יִשְׁמַע נָא
  choice: kiranya ... mendengarkan
  rationale: Bentuk jusif dengan נָא menyampaikan permohonan sopan dan hormat, bukan perintah keras.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Sapaan istana kepada Saul; “tuanku” alami dalam bahasa Indonesia dan jelas tidak menunjuk pada keilahian.
- source_word: דִּבְרֵי עַבְדּוֹ
  choice: perkataan hambanya
  rationale: Mempertahankan gaya merendahkan diri dengan orang ketiga yang terdapat dalam bahasa Ibrani.
- source_word: אִם יְהוָה הֱסִיתְךָ בִי
  choice: Jika TUHAN telah menghasut Tuanku melawan aku
  rationale: הסית menyatakan tindakan menggerakkan atau menghasut seseorang melawan pihak lain. Pilihan ini mempertahankan daya kausatif dan ketegangan teks.
- source_word: יָרַח מִנְחָה
  choice: kiranya Dia mencium persembahan
  rationale: Terjemahan dekat atas idiom kurban Ibrani; gagasan penerimaan persembahan dijelaskan dalam catatan kaki tanpa menghapus citra antropomorfis teks.
- source_word: וְאִם בְּנֵי הָאָדָם
  choice: Namun, jika manusia yang melakukannya
  rationale: Dalam konteks ini frasa tersebut mengontraskan pelaku manusia dengan TUHAN; tambahan “yang melakukannya” membuat elipsis alami dalam bahasa Indonesia.
- source_word: אֲרוּרִים הֵם לִפְנֵי יְהוָה
  choice: terkutuklah mereka di hadapan TUHAN
  rationale: Menyampaikan pernyataan bahwa mereka berada di bawah kutuk di hadapan TUHAN, tanpa mengubahnya menjadi doa kutuk yang eksplisit.
- source_word: גֵרְשׁוּנִי
  choice: mereka telah mengusir aku
  rationale: Menunjukkan pengusiran paksa Daud dari tanah dan komunitasnya.
- source_word: מֵהִסְתַּפֵּחַ
  choice: sehingga aku tidak lagi dapat menggabungkan diri
  rationale: Hitpael dari ספח menekankan keterikatan atau penyertaan diri; terjemahan ini mempertahankan gambaran tersebut dan ambiguitas cakupannya.
- source_word: בְּנַחֲלַת יְהוָה
  choice: dengan milik pusaka TUHAN
  rationale: נחלה mencakup bagian warisan, khususnya tanah dan umat yang menjadi milik TUHAN; “milik pusaka” mempertahankan resonansi perjanjian.
- source_word: לֵאמֹר
  choice: seolah-olah berkata
  rationale: Ucapan berikut menyatakan akibat atau pesan tersirat dari tindakan para pengusir, bukan harus berarti mereka mengucapkannya secara harfiah.
- source_word: עֲבֹד אֱלֹהִים אֲחֵרִים
  choice: beribadahlah kepada ilah-ilah lain
  rationale: עבד dalam konstruksi ini berarti melayani dalam arti ibadah; “ilah-ilah” membedakannya dari penyebutan Allah Israel.
theological_decisions:
- issue: TUHAN menghasut Saul melawan Daud
  choice: Pernyataan bersyarat tentang tindakan TUHAN dipertahankan apa adanya.
  alternative: Menafsirkannya hanya sebagai izin ilahi atau, sebaliknya, menjelaskannya sebagai penyebab langsung secara dogmatis.
  rationale: Teks tidak menerangkan hubungan metafisis antara tindakan ilahi dan tanggung jawab manusia; terjemahan tidak menyelesaikan ketegangan itu.
- issue: Makna milik pusaka TUHAN
  choice: Dipertahankan sebagai ungkapan luas yang dapat mencakup tanah serta komunitas umat TUHAN.
  alternative: Membatasinya hanya pada wilayah geografis atau hanya pada akses kepada ibadah di tempat kudus.
  rationale: Konteks menghubungkan pengusiran dari tanah dengan tekanan untuk menyembah ilah lain, sehingga dimensi teritorial dan perjanjian sama-sama relevan.
- issue: Ucapan “Pergilah, beribadahlah kepada ilah-ilah lain”
  choice: Diperkenalkan dengan “seolah-olah berkata” sebagai implikasi religius pengusiran.
  alternative: Menganggap para lawan Daud pasti mengucapkan kata-kata itu secara langsung.
  rationale: לֵאמֹר dapat memperkenalkan dampak atau pesan praktis dari tindakan mereka; terjemahan menjaga kemungkinan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “tuanku raja” serta “hambanya” mempertahankan kesantunan istana dan perendahan diri Daud. Nama perjanjian יהוה ditampilkan sebagai “TUHAN” sesuai konvensi Alkitab Indonesia. Citra harfiah “mencium persembahan” dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
