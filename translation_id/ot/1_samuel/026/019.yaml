revisions:
- from: Sekarang, kiranya tuanku raja mendengarkan perkataan hambanya. Jika TUHAN telah menghasut Tuanku melawan aku, kiranya Dia mencium persembahan[a]. Namun, jika manusia yang melakukannya, terkutuklah mereka di hadapan TUHAN, sebab hari ini mereka telah mengusir aku sehingga aku tidak lagi dapat menggabungkan diri dengan milik pusaka TUHAN[b], seolah-olah berkata, ‘Pergilah, beribadahlah kepada ilah-ilah lain!’”
