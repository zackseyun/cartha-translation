    rationale: Ibrani אֲרוּרִים הֵם adalah pernyataan, “mereka terkutuk,” bukan bentuk jussive atau imperatif.
  - severity: medium
    issue: “kiranya Dia mencium persembahan” terlalu harfiah dan tidak lazim dalam bahasa Indonesia modern.
    rationale: יָרַח מִנְחָה adalah idiom penerimaan persembahan. Arti idiomatik sebaiknya tampil dalam teks utama, dengan citra harfiah dijelaskan dalam catatan kaki.
