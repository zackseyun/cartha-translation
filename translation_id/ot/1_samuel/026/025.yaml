  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: id
  text: Lalu Saul berkata kepada Daud, “Engkau diberkati, anakku Daud. Engkau pasti akan bertindak, dan pasti akan berhasil[a].” Kemudian Daud melanjutkan perjalanannya, dan Saul kembali ke tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “berbuat, engkau akan berbuat; dan mampu, engkau akan mampu.” Kedua konstruksi infinitif absolut ini menegaskan kepastian tindakan dan keberhasilan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: Engkau diberkati
  rationale: Mempertahankan bentuk pernyataan dalam formula berkat yang ditujukan langsung kepada Daud, tanpa mengubahnya menjadi doa atau harapan.
- source_word: בְּנִי דָוִד
  choice: anakku Daud
  rationale: Mempertahankan sapaan kekeluargaan atau patronal Saul dan menempatkan nama Daud sebagai aposisi secara alami dalam bahasa Indonesia.
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: Engkau pasti akan bertindak
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian tindakan Daud. 'Bertindak' menghindari penambahan objek seperti 'hal-hal besar' yang tidak dinyatakan dalam teks sumber.
- source_word: וְגַם יָכֹל תּוּכָל
  choice: dan pasti akan berhasil
  rationale: Konstruksi penegasan kedua secara harfiah menyatakan bahwa Daud sungguh akan mampu; dalam konteks ini, 'berhasil' menyampaikan kemampuan yang mencapai hasil tanpa menentukan bentuk kemenangan tertentu.
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: Kemudian Daud melanjutkan perjalanannya
  rationale: Ungkapan Ibrani ini secara idiomatis berarti Daud pergi meneruskan jalannya; pilihan ini alami sebagai penutup adegan.
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: sedangkan Saul kembali ke tempatnya
  rationale: Mempertahankan 'tempatnya' karena teks tidak secara khusus menyebut rumah; 'sedangkan' menandai arah perpisahan kedua tokoh dengan wajar.
