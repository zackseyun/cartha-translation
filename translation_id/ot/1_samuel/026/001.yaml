base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/001.yaml
  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: id
  text: Kemudian orang-orang Zif datang kepada Saul di Gibea dan berkata, “Bukankah Daud sedang bersembunyi di bukit Hakhila, yang berhadapan dengan daerah tandus[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berhadapan dengan Yesimon.” Istilah Ibrani ini dapat dipahami sebagai sebutan umum untuk daerah tandus atau sebagai nama wilayah, Yesimon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “kemudian” menyatakan perkembangan narasi secara wajar.
- source_word: הַזִּפִים
  choice: orang-orang Zif
  rationale: Bentuk ini menunjuk kepada penduduk Zif; ungkapan ini lebih alami dan mudah dipahami dalam bahasa Indonesia daripada membentuk demonim yang tidak lazim.
- source_word: הַגִּבְעָתָה
  choice: di Gibea
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Gibea, tetapi bersama frasa “datang kepada Saul”, “di Gibea” secara alami menunjukkan tempat Saul berada.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif ini memperkenalkan perkataan langsung; “dan berkata” merupakan padanan Indonesia yang alami.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan pembenaran.
- source_word: מִסְתַּתֵּר
  choice: sedang bersembunyi
  rationale: Partisipel hitpael menyampaikan tindakan Daud menyembunyikan diri yang sedang berlangsung.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: di Bukit Hakhila
  rationale: גבעה berarti bukit; “di Bukit Hakhila” merupakan ungkapan topografis yang alami dalam bahasa Indonesia.
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: yang berhadapan dengan daerah tandus
  rationale: Ungkapan geografis עַל־פְּנֵי dapat berarti “di hadapan/berhadapan dengan”, sedangkan הַיְשִׁימֹן dapat dipahami sebagai sebutan bagi daerah tandus atau sebagai nama wilayah. Terjemahan utama mempertahankan relasi spasial tanpa mempersempitnya menjadi arah mata angin.
