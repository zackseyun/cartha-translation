  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: id
  text: Lalu Daud mengambil tombak dan kendi air dari dekat kepala Saul, kemudian mereka pergi. Tidak ada seorang pun yang melihat, menyadari, atau terbangun, sebab mereka semua sedang tidur, karena tidur lelap dari Yahweh[a] telah menimpa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidur lelap Yahweh telah menimpa mereka.” Ungkapan itu menunjukkan bahwa tidur lelap tersebut berasal dari atau terjadi karena tindakan Yahweh.
    reason: Menjelaskan konstruksi genitif Ibrani dan keagenan ilahi tanpa menghapus bentuk ungkapan aslinya.
lexical_decisions:
- source_word: הַחֲנִית
  choice: tombak
  rationale: חֲנִית menunjuk pada senjata tikam berupa tombak; 'tombak' adalah padanan Indonesia yang lazim dan tepat dalam konteks ini.
- source_word: צַפַּחַת הַמַּיִם
  choice: kendi air
  rationale: צַפַּחַת adalah wadah kecil untuk cairan. 'Kendi air' konkret, alami, dan sesuai dengan konteks naratif.
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: dari dekat kepala Saul
  rationale: Bentuk ini menunjuk pada tempat di bagian kepala Saul ketika ia berbaring, bukan pada kepala atau tubuhnya secara harfiah.
- source_word: וַיֵּלְכוּ לָהֶם
  choice: kemudian mereka pergi
  rationale: Subjek jamak mencakup Daud dan Abisai; ungkapan ini menyatakan bahwa mereka beranjak pergi dari tempat itu.
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: Tidak seorang pun melihat, mengetahui, atau terbangun
  rationale: Rangkaian אין dengan partisip diterjemahkan sebagai tiga keadaan negatif yang sejajar. Bentuk ringkas ini mempertahankan isi tanpa pengulangan yang terasa kaku dalam bahasa Indonesia.
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: sebab mereka semua sedang tidur
  rationale: Klausa ini menjelaskan mengapa tindakan Daud tidak diketahui; bentuk progresif menyampaikan keadaan tidur yang sedang berlangsung.
- source_word: תַּרְדֵּמַת יְהוָה
  choice: tidur lelap dari Yahweh
  rationale: תַּרְדֵּמָה berarti tidur yang sangat dalam. Genitif dengan nama ilahi secara wajar menyatakan sumber atau penyebab, sambil mempertahankan bentuk ungkapan Ibrani.
- source_word: נָפְלָה עֲלֵיהֶם
  choice: telah menimpa mereka
  rationale: Padanan ini mempertahankan metafora 'jatuh atas' dalam bentuk Indonesia yang alami dan menunjukkan bahwa keadaan itu sudah berlangsung ketika Daud bertindak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi, bukan gelar. Transliterasi 'Yahweh' mempertahankan nama tersebut secara langsung.
- issue: Keagenan dalam תַּרְדֵּמַת יְהוָה
  choice: tidur lelap dari Yahweh telah menimpa mereka
  alternative: Yahweh telah membuat mereka tertidur lelap
  rationale: Pilihan utama mempertahankan konstruksi nomina dan metafora teks sumber sekaligus menyatakan asal ilahinya, tanpa mengubahnya menjadi klausa kausatif eksplisit.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Nama ilahi ditransliterasikan sebagai 'Yahweh'. Susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan hubungan sebab-akibat dan keagenan ilahi dalam teks Ibrani.
