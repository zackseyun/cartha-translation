id: 1SA.26.3
reference: 1 Samuel 26:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֨חַן שָׁא֜וּל בְּ/גִבְעַ֣ת הַ/חֲכִילָ֗ה אֲשֶׁ֛ר עַל פְּנֵ֥י הַ/יְשִׁימֹ֖ן עַל הַ/דָּ֑רֶךְ וְ/דָוִד֙ יֹשֵׁ֣ב בַּ/מִּדְבָּ֔ר וַ/יַּ֕רְא כִּ֣י בָ֥א שָׁא֛וּל אַחֲרָ֖י/ו הַ/מִּדְבָּֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: id
  text: Saul berkemah di Bukit Hakhila, yang berhadapan dengan Yesimon[a], di tepi jalan. Sementara itu, Daud tinggal di padang belantara dan melihat bahwa Saul telah datang menyusulnya ke padang belantara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesimon juga dapat dipahami secara umum sebagai “tanah tandus” atau “padang gurun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: berkemah
  rationale: Kata kerja חנה dalam konteks perjalanan atau militer berarti mendirikan perkemahan; 'berkemah' alami dan mempertahankan makna konkretnya.
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: di Bukit Hakhila
  rationale: גִּבְעָה berarti 'bukit', sedangkan חֲכִילָה adalah nama tempat. Nama umum diterjemahkan dan nama diri dialihaksarakan.
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: yang berhadapan dengan Yesimon
  rationale: עַל־פְּנֵי di sini menunjukkan letak yang berhadapan atau menghadap. הַיְשִׁימֹן dipertahankan sebagai nama geografis, dengan kemungkinan makna generik dicatat dalam catatan kaki.
- source_word: עַל הַדָּרֶךְ
  choice: di tepi jalan
  rationale: Dalam keterangan lokasi ini, עַל menunjukkan kedekatan dengan jalan, bukan harus tepat di atas badan jalan.
- source_word: יֹשֵׁב
  choice: tinggal
  rationale: Partisipel ישב menyatakan keadaan yang berlangsung dan dalam konteks lokasi berarti tinggal atau menetap sementara.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar dan sepi, tidak selalu gurun pasir; 'padang belantara' merupakan padanan Indonesia yang alami.
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: melihat bahwa Saul telah datang menyusulnya
  rationale: Terjemahan ini mempertahankan verba 'melihat' dan 'datang', sementara 'menyusulnya' menyampaikan nuansa אַחֲרָיו tanpa mempertegasnya menjadi istilah teknis pengejaran militer.
- source_word: הַמִּדְבָּרָה
  choice: ke padang belantara
  rationale: Akhiran arah pada מִדְבָּרָה menandakan gerak menuju atau masuk ke padang belantara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. 'Sementara itu' memperjelas peralihan subjek tanpa mengubah hubungan dasar antarklausa. Ejaan nama Ibrani disesuaikan secara konsisten untuk pembaca Indonesia.
