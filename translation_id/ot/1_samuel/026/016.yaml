source:
  edition: WLC
  text: לֹא ט֞וֹב הַ/דָּבָ֣ר הַ/זֶּה֮ אֲשֶׁ֣ר עָשִׂיתָ֒ חַי יְהוָ֗ה כִּ֤י בְנֵי מָ֨וֶת֙ אַתֶּ֔ם אֲשֶׁ֧ר לֹֽא שְׁמַרְתֶּ֛ם עַל אֲדֹנֵי/כֶ֖ם עַל מְשִׁ֣יחַ יְהוָ֑ה וְ/עַתָּ֣ה רְאֵ֗ה אֵֽי חֲנִ֥ית הַ/מֶּ֛לֶךְ וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם אֲשֶׁ֥ר מראשת/ו־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: id
  text: 'Apa yang kaulakukan ini tidak baik. Demi Yahweh yang hidup, kalian pantas dihukum mati[a], karena kalian tidak menjaga tuan kalian, orang yang diurapi Yahweh. Sekarang lihatlah: di manakah tombak raja dan kendi air yang ada di dekat kepalanya?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kalian adalah anak-anak kematian,” sebuah ungkapan Ibrani yang berarti bahwa mereka layak menerima hukuman mati.
    reason: Menjelaskan idiom Ibrani yang tidak wajar jika diterjemahkan kata demi kata dalam bahasa Indonesia.
lexical_decisions:
- source_word: לֹא טוֹב הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָ
  choice: Apa yang kaulakukan ini tidak baik
  rationale: Menyampaikan penilaian Ibrani secara langsung dan alami tanpa memperkeras לֹא טוֹב menjadi 'jahat'.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ungkapan sumpah yang alami dalam bahasa Indonesia, dengan nama ilahi יְהוָה dipertahankan sebagai Yahweh.
- source_word: בְנֵי מָוֶת אַתֶּם
  choice: kalian pantas dihukum mati
  rationale: Ungkapan harfiah 'anak-anak kematian' menyatakan bahwa mereka layak atau terancam hukuman mati; terjemahan ini menyampaikan daya yudisialnya dengan jelas.
- source_word: לֹא שְׁמַרְתֶּם עַל
  choice: tidak berjaga-jaga melindungi
  rationale: Dalam konteks pasukan pengawal, verba ini mencakup kewaspadaan dan perlindungan, bukan sekadar melihat atau mengawasi.
- source_word: אֲדֹנֵיכֶם
  choice: tuan kalian
  rationale: Merujuk kepada Saul sebagai atasan mereka; 'tuan' membedakannya dari sebutan ilahi.
- source_word: מְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: Mempertahankan makna kerajaan-sakral dari מָשִׁיחַ tanpa langsung menjadikannya gelar 'Mesias' dalam konteks ini.
- source_word: אֵי חֲנִית הַמֶּלֶךְ וְאֶת צַפַּחַת הַמַּיִם
  choice: di manakah tombak raja dan kendi air
  rationale: Menerjemahkan kedua benda bukti secara lugas; bentuk pertanyaan Indonesia tetap alami meskipun אֵי tidak berubah bentuk.
- source_word: אֲשֶׁר מְרַאֲשֹׁתָיו
  choice: yang ada di dekat kepalanya
  rationale: מְרַאֲשֹׁתָיו menunjuk lokasi di sisi atau dekat kepala Saul, bukan kepalanya sendiri.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN / Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna מְשִׁיחַ יְהוָה bagi Saul
  choice: orang yang diurapi Yahweh
  alternative: yang diurapi Yahweh / Mesias Yahweh
  rationale: Bentuk ini mempertahankan status Saul sebagai raja yang telah diurapi tanpa menyamakan pemakaian kontekstual ini dengan gelar eskatologis 'Mesias'.
- issue: Ungkapan בְנֵי מָוֶת
  choice: pantas dihukum mati
  alternative: anak-anak kematian / patut mati
  rationale: Ungkapan tersebut bersifat idiomatis dan menyatakan kelayakan menerima hukuman mati. Catatan kaki mempertahankan bentuk harfiahnya bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan khidmat. Pembedaan 'kau' kepada Abner dan 'kalian' kepada kelompok penjaga mengikuti perubahan tunggal-jamak dalam teks Ibrani.
