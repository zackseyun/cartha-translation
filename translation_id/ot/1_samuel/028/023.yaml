base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/023.yaml
  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: id
  text: Namun, Saul menolak dan berkata, “Aku tidak mau makan.” Tetapi para pelayannya bersama perempuan itu mendesaknya. Saul pun mendengarkan mereka.[a] Lalu ia bangkit dari tanah dan duduk di tempat tidur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mendengarkan suara mereka.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tempat tidur” juga dapat berarti dipan atau ranjang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Saul menolak
  rationale: מָאֵן menyatakan penolakan atau ketidaksediaan. Nama “Saul” dipakai agar subjek jelas dan alami dalam bahasa Indonesia.
- source_word: לֹא אֹכַל
  choice: Aku tidak mau makan
  rationale: Dalam konteks penolakan langsung, bentuk ini secara alami menyampaikan ketidaksediaan Saul tanpa menambahkan objek yang tidak terdapat dalam bahasa Ibrani.
- source_word: וַיִּפְרְצוּ בוֹ
  choice: terus mendesaknya
  rationale: Ungkapan פרץ ב di sini menggambarkan desakan yang kuat dan gigih, bukan tindakan menerobos secara harfiah. “Terus mendesaknya” menyampaikan intensitas idiom itu secara wajar.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: Dalam konteks rombongan raja, istilah ini menunjuk kepada orang-orang yang melayani Saul; “para hambanya” mempertahankan bentuk naratif yang lazim tanpa menonjolkan status perbudakan.
- source_word: וְגַם הָאִשָּׁה
  choice: bersama perempuan itu
  rationale: Pilihan ini mempertahankan fungsi aditif וְגַם, yakni memasukkan perempuan itu bersama para hamba sebagai pihak yang mendesak Saul.
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: Saul pun mendengarkan mereka
  rationale: Ungkapan harfiahnya adalah “mendengarkan suara mereka,” tetapi dalam bahasa Indonesia modern idiom ini paling alami diterjemahkan “mendengarkan mereka.” Konteks menunjukkan bahwa Saul menerima desakan mereka, tanpa perlu mempersempitnya menjadi “menaati.”
- source_word: מֵהָאָרֶץ
  choice: dari tanah
  rationale: אֶרֶץ di sini menunjuk pada permukaan tempat Saul sebelumnya terbaring; “tanah” merupakan padanan kontekstual yang langsung.
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: duduk di tempat tidur
  rationale: מִטָּה dapat menunjuk pada tempat tidur atau dipan. “Tempat tidur” merupakan padanan umum, sementara kemungkinan bentuk perabot lain dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Intensitas idiom Ibrani pada tindakan mendesak dipertahankan melalui kata “terus,” sedangkan idiom “mendengarkan suara mereka” dialihkan secara alami ke teks utama dan bentuk harfiahnya dicatat dalam catatan kaki.
