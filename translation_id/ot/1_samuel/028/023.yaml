    rationale: Idiom Ibrani menyatakan desakan yang kuat/tegas, tetapi tidak secara leksikal menyatakan bahwa tindakan itu berlanjut sepanjang waktu. “Mendesaknya” cukup idiomatis dan tidak menambah aspek.
  - severity: low
    issue: Catatan kaki b memakai “pembaringan” sebagai alternatif untuk tempat tidur.
    rationale: מִטָּה dapat menunjuk tempat tidur atau perabot seperti dipan/ranjang/couch. “Pembaringan” lebih mudah dipahami sebagai tempat atau keadaan berbaring, bukan jenis perabot alternatif.
