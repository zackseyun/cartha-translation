  source_fidelity: Teks utama pada dasarnya setia pada Ibrani. Namun, kata “terus” dapat menyiratkan durasi atau pengulangan yang tidak dinyatakan secara eksplisit; verba “mendesak” sendiri sudah menyampaikan daya tekan idiom וַיִּפְרְצוּ בוֹ dalam konteks ini.
  naturalness: Bahasa Indonesia baku dan naratif. “Para pelayannya” lebih lazim dalam bahasa Indonesia modern untuk עֲבָדָיו dalam konteks istana daripada “para hambanya,” tanpa mengubah makna kontekstual.
  terminology: “Perempuan itu,” “tanah,” dan “tempat tidur” tepat. Catatan tentang מִטָּה perlu menyebut alternatif furnitur yang lebih tepat; “pembaringan” tidak secara jelas menyampaikan kemungkinan ‘couch/divan’.
