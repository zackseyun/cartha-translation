base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: id
  text: Daud berkata kepada Akhis, “Kalau begitu, engkau sendiri akan mengetahui apa yang akan dilakukan hambamu.[a]” Akhis berkata kepada Daud, “Baiklah, aku akan mengangkatmu menjadi pengawal pribadiku[b] untuk seterusnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Daud juga dapat dipahami, “apa yang sanggup dilakukan hambamu.” Perkataannya sengaja tidak menjelaskan tindakan apa yang dimaksud atau kepada siapa tindakan itu ditujukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “penjaga bagi kepalaku,” yaitu pengawal yang melindungi diri atau nyawa seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Kalau begitu / Baiklah
  rationale: Dalam jawaban Daud, kata ini menarik kesimpulan dari ucapan Akhis sebelumnya, sehingga “Kalau begitu” alami. Dalam tanggapan Akhis, kata yang sama menyatakan penerimaan atau kesimpulan, sehingga “Baiklah” lebih sesuai.
- source_word: אַתָּה תֵדַע
  choice: engkau sendiri akan mengetahui
  rationale: Kata ganti אַתָּה yang dinyatakan secara eksplisit memberi penekanan pada Akhis; “engkau sendiri” mempertahankan penekanan itu.
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה עַבְדֶּךָ
  choice: apa yang akan dilakukan hambamu
  rationale: Terjemahan ini mengikuti bentuk masa depan secara dekat dan mempertahankan ketidakjelasan yang disengaja mengenai tindakan Daud serta pihak yang sungguh-sungguh akan dibelanya.
- source_word: עַבְדֶּךָ
  choice: hambamu
  rationale: Ini merupakan sebutan diri yang merendah dalam percakapan dengan penguasa, bukan penegasan status sebagai budak.
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: pengawal pribadiku
  rationale: Secara harfiah frasa ini berarti “penjaga bagi kepalaku,” tetapi secara idiomatis menunjuk kepada pengawal yang melindungi diri atau nyawa Akhis.
- source_word: אֲשִׂימְךָ
  choice: aku akan mengangkatmu menjadi
  rationale: Kata שׂים di sini menyatakan penempatan atau pengangkatan seseorang ke dalam suatu tugas.
- source_word: כָּל הַיָּמִים
  choice: untuk seterusnya
  rationale: Secara harfiah berarti “sepanjang hari-hari” dan dalam konteks ini menyatakan masa tugas yang berkelanjutan; “untuk seterusnya” alami tanpa menambahkan kata ganti yang tidak ada dalam teks Ibrani.
theological_decisions:
- issue: Ketidakjelasan komitmen Daud kepada Akhis
  choice: Mempertahankan ungkapan “apa yang akan dilakukan hambamu” tanpa menjelaskan sasaran tindakan Daud
  alternative: “apa yang sanggup dilakukan hambamu” atau penjelasan eksplisit bahwa Daud akan berperang bagi Akhis
  rationale: Teks Ibrani tidak menyebutkan apa yang akan Daud lakukan atau kepada siapa tindakannya diarahkan. Konteks naratif membiarkan jawaban itu bermakna ganda, sehingga terjemahan tidak boleh memastikan kesetiaan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku dan bermartabat dengan bentuk sapaan “engkau” serta sebutan diri “hambamu,” sesuai percakapan antara Daud dan seorang raja. Susunan kalimat dibuat alami bagi pembaca modern sambil mempertahankan penekanan dan ketidakjelasan teks Ibrani.
