  text: וּ/שְׁמוּאֵ֣ל מֵ֔ת וַ/יִּסְפְּדוּ ל/וֹ֙ כָּל יִשְׂרָאֵ֔ל וַ/יִּקְבְּרֻ֥/הוּ בָ/רָמָ֖ה וּ/בְ/עִיר֑/וֹ וְ/שָׁא֗וּל הֵסִ֛יר הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖ים מֵ/הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: id
  text: Samuel telah meninggal, dan seluruh Israel telah meratapinya serta menguburkannya di Rama, kotanya sendiri. Saul telah menyingkirkan para pemanggil arwah dan para ahli tenung[a] dari negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut istilah tradisional: “mereka yang mempunyai roh peramal dan para ahli nujum.”'
    reason: Alternatif leksikal bagi אֹבוֹת dan יִדְּעֹנִים; istilah tepat serta hubungan kedua sebutan ini diperdebatkan.
lexical_decisions:
- source_word: מֵת
  choice: telah meninggal
  rationale: Bentuk ini menyajikan kematian Samuel sebagai keadaan dan peristiwa yang sudah terjadi sebelum kisah utama berlanjut, tanpa menambahkan penanda waktu yang tidak ada dalam teks Ibrani.
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: telah meratapinya
  rationale: Kata ספד menunjuk pada ratapan atau perkabungan, khususnya dalam konteks kematian. 'Meratapinya' alami dalam bahasa Indonesia dan mempertahankan unsur perkabungan terbuka.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan ungkapan kolektif nasional dalam teks sumber tanpa mengubahnya menjadi klaim mengenai setiap orang Israel secara individual.
- source_word: וַיִּקְבְּרֻהוּ
  choice: serta menguburkannya
  rationale: Terjemahan langsung dari קבר; 'serta' menghubungkan dua tindakan lampau dalam ringkasan latar dengan lancar.
- source_word: בָרָמָה
  choice: di Rama
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: וּבְעִירוֹ
  choice: kotanya sendiri
  rationale: Frasa ini dipahami sebagai aposisi yang menjelaskan Rama. Kata 'sendiri' menyampaikan akhiran posesif secara idiomatis tanpa menganggap adanya dua lokasi pemakaman.
- source_word: הֵסִיר
  choice: telah menyingkirkan
  rationale: Kata ini cukup luas untuk mencakup pengusiran atau penindakan resmi tanpa menentukan cara yang tidak dijelaskan oleh teks.
- source_word: הָאֹבוֹת
  choice: para pemanggil arwah
  rationale: אוֹב dalam konteks ini menunjuk kepada praktisi yang berhubungan dengan orang mati. Pilihan ini jelas bagi pembaca modern dan menghindari istilah 'medium' yang kurang merata dipahami.
- source_word: הַיִּדְּעֹנִים
  choice: ahli tenung
  rationale: יִדְּעֹנִי menunjuk pada praktisi gaib yang lazim dipasangkan dengan אוֹב. 'Ahli tenung' mempertahankan pembedaan kedua kelompok tanpa memasukkan gambaran fantasi modern.
- source_word: מֵהָאָרֶץ
  choice: dari negeri itu
  rationale: Dalam konteks pemerintahan Saul, הָאָרֶץ menunjuk pada wilayah negeri Israel; 'negeri itu' alami dalam bahasa Indonesia dan tetap dekat dengan cakupan nasional teks.
theological_decisions:
- issue: Penyebutan para praktisi gaib tanpa mengimpor kategori okultisme atau cerita rakyat yang lebih kemudian
  choice: para pemanggil arwah dan ahli tenung
  alternative: orang-orang yang memiliki roh arwah dan para peramal
  rationale: Kedua istilah Ibrani menyebut praktisi terlarang, tetapi batas tepat antara kategorinya tidak sepenuhnya pasti. Terjemahan utama menyampaikan hubungan mereka dengan praktik gaib sambil mempertahankan dua sebutan yang berbeda dan tidak mendefinisikan hakikat roh-roh tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'telah' dipakai untuk menandai ringkasan latar yang mendahului peristiwa berikutnya. Istilah okultisme dibuat mudah dipahami tanpa memakai kosakata denominatif atau gambaran fantasi modern.
