base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: id
  text: Saul bertanya kepadanya, “Bagaimana rupanya?” Perempuan itu menjawab, “Seorang laki-laki tua sedang naik[a], dan ia berselubung jubah[b].” Saul pun tahu bahwa orang itu Samuel. Lalu ia membungkuk dengan wajah ke tanah dan bersujud[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sedang muncul” atau “sedang bangkit.” Bentuk partisip Ibrani menekankan gerakan ke atas yang sedang berlangsung.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mengenakan jubah.” Kata Ibraninya secara lebih hidup menggambarkan seseorang yang terbungkus atau berselubung jubah.
    reason: lexical_alternative
  - marker: c
    text: Kata kerja terakhir dapat juga diterjemahkan “membungkuk dalam-dalam” dan, dalam konteks tertentu, “menyembah.” Di sini kata itu menggambarkan tindakan bersujud di hadapan sosok yang dikenali sebagai Samuel.
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: rupanya
  rationale: תֹּאַר menunjuk pada bentuk atau penampilan yang terlihat. Pertanyaan “Bagaimana rupanya?” alami dalam bahasa Indonesia dan sesuai dengan permintaan Saul akan ciri pengenal.
- source_word: אִישׁ זָקֵן
  choice: seorang laki-laki tua
  rationale: Frasa ini secara langsung menyebut seorang laki-laki yang sudah lanjut usia. Pilihan ini jelas dan dekat dengan susunan Ibrani.
- source_word: עֹלֶה
  choice: sedang naik
  rationale: Partisip Ibrani menggambarkan gerakan ke atas yang sedang berlangsung. “Sedang naik” mempertahankan arah gerak tanpa menambahkan secara eksplisit asal gerakan yang tidak dinyatakan dalam frasa ini.
- source_word: עֹטֶה מְעִיל
  choice: ia berselubungkan jubah
  rationale: עֹטֶה menyiratkan membungkus atau menyelubungi diri, bukan sekadar mengenakan; מְעִיל adalah jubah atau mantel panjang. Pilihan ini mempertahankan gambaran khas pakaian tokoh tersebut.
- source_word: וַיֵּדַע
  choice: Saul pun tahu
  rationale: ידע pada dasarnya berarti “tahu,” dan dalam konteks ini menyatakan kesimpulan atau pengenalan Saul berdasarkan gambaran yang diberikan perempuan itu.
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: bahwa orang itu Samuel
  rationale: Ungkapan ini secara harfiah berarti “bahwa dia adalah Samuel.” “Orang itu Samuel” merupakan bentuk identifikasi yang alami dalam bahasa Indonesia setelah uraian penampilan.
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: ia membungkuk dengan wajah ke tanah
  rationale: Ungkapan Ibrani menggambarkan tindakan membungkuk dengan wajah mengarah atau sampai ke tanah. Terjemahan ini menyampaikan postur tubuh secara jelas.
- source_word: וַיִּשְׁתָּחוּ
  choice: dan bersujud
  rationale: Kata kerja ini dapat menyatakan tindakan merebahkan diri atau membungkuk dalam-dalam sebagai penghormatan, dan dalam konteks lain dapat berkaitan dengan penyembahan. “Bersujud” mempertahankan tindakan jasmaninya tanpa memastikan bahwa tindakan itu merupakan ibadah.
theological_decisions:
- issue: Apakah tindakan Saul harus diterjemahkan secara eksplisit sebagai penyembahan kepada Samuel
  choice: bersujud
  alternative: menyembah; membungkuk; memberi hormat
  rationale: שׁחה dapat menunjuk pada penyembahan atau sujud penghormatan, bergantung pada konteks. Di sini teks menekankan tindakan tubuh Saul di hadapan sosok yang dikenali sebagai Samuel. “Bersujud” mempertahankan ketegangan itu tanpa menetapkan bahwa Saul melakukan ibadah kultis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Berselubungkan jubah” dipertahankan untuk menyampaikan kekuatan gambaran Ibrani, sedangkan “bersujud” dipilih agar tindakan tubuh jelas tanpa memaksakan penilaian teologis tertentu.
