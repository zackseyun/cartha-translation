  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ ל֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּ֣ר בְּ/יָדִ֑/י וַ/יִּקְרַ֨ע יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ מִ/יָּדֶ֔/ךָ וַֽ/יִּתְּנָ֖/הּ לְ/רֵעֲ/ךָ֥ לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: id
  text: 'Yahweh telah bertindak bagi diri-Nya[a], tepat seperti yang difirmankan-Nya melalui perantaraanku[b]: Yahweh telah merenggut kerajaan itu dari tanganmu dan memberikannya kepada sesamamu, kepada Daud.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “baginya.” Karena Yahweh adalah subjeknya, ini dapat dipahami “bagi diri-Nya.” Banyak terjemahan memakai “kepadamu” atau “bagimu,” tetapi Teks Masoret berbunyi לוֹ (“baginya”), bukan לְךָ (“bagimu”).'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “melalui tanganku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיַּעַשׂ ... לוֹ
  choice: telah bertindak bagi diri-Nya
  rationale: לוֹ secara harfiah berarti “baginya”; dengan Yahweh sebagai subjek, ungkapan ini dapat dipahami “bagi diri-Nya.” Terjemahan mempertahankan bacaan Teks Masoret dan tidak diam-diam mengubahnya menjadi לְךָ, “bagimu/kepadamu.” Kata “bertindak” menghasilkan bahasa Indonesia yang lebih wajar daripada “melakukan bagi diri-Nya,” tanpa meniadakan kejanggalan dan ambiguitas teks.
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: tepat seperti yang difirmankan-Nya melalui perantaraanku
  rationale: בְּיַדִי secara idiomatis menyatakan perantaraan, secara harfiah “dengan/melalui tanganku.” “Melalui perantaraanku” menyampaikan fungsi Samuel sebagai penyampai firman secara alami dalam bahasa Indonesia.
- source_word: וַיִּקְרַע
  choice: telah merenggut
  rationale: קָרַע berarti merobek atau mengoyakkan. Dalam konteks kerajaan yang dilepaskan dari kekuasaan Saul, “merenggut” mempertahankan daya metaforanya dan terdengar alami.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: Mengacu pada kerajaan atau kekuasaan kerajaan Saul; “kerajaan itu” jelas dan wajar dalam konteks.
- source_word: מִיָּדֶךָ
  choice: dari tanganmu
  rationale: Mempertahankan gambaran Ibrani tentang kerajaan yang diambil dari kepemilikan atau kekuasaan Saul.
- source_word: וַיִּתְּנָהּ
  choice: dan memberikannya
  rationale: Akhiran feminin tunggal merujuk kembali kepada הַמַּמְלָכָה, “kerajaan itu,” yang dalam bahasa Indonesia diwakili oleh “-nya.”
- source_word: לְרֵעֲךָ
  choice: kepada sesamamu
  rationale: רֵעַ dapat berarti kawan, rekan, atau sesama. “Sesamamu” mempertahankan keluasan makna, sedangkan aposisi berikutnya mengidentifikasi orang itu sebagai Daud.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
theological_decisions:
- issue: Bacaan לוֹ dalam klausa pertama
  choice: Menerjemahkan Teks Masoret sebagai “bagi diri-Nya,” dengan catatan bahwa bentuk harfiahnya ialah “baginya.”
  alternative: “bagimu” atau “kepadamu”
  rationale: Teks Ibrani yang diberikan berbunyi לוֹ, orang ketiga maskulin tunggal, bukan לְךָ, orang kedua. Terjemahan tidak mengubah teks berdasarkan konteks atau tradisi versi lain, tetapi catatan kaki mengakui bacaan alternatif yang lazim.
- issue: Perantaraan kenabian dalam בְּיָדִי
  choice: “melalui perantaraanku”
  alternative: “melalui tanganku”
  rationale: Pilihan utama menyampaikan idiom agensi Ibrani secara jelas tanpa menambahkan ajaran mengenai mekanisme pewahyuan; bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara metafora “dari tanganmu,” nama ilahi Yahweh, serta ketegangan tekstual pada לוֹ tetap dipertahankan.
