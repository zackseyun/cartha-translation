source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: id
  text: Saul meminta petunjuk kepada Yahweh, tetapi Yahweh tidak menjawabnya, baik melalui mimpi, melalui Urim[a], maupun melalui para nabi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urim adalah sarana keimaman yang digunakan untuk mencari petunjuk ilahi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konstruksi dengan ב dan nama ilahi, שׁאל berarti mencari jawaban atau bimbingan ilahi, bukan sekadar mengajukan pertanyaan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan konteks pencarian petunjuk.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sesuai bentuk nama diri dalam teks sumber.
- source_word: וְלֹא עָנָהוּ
  choice: tetapi Yahweh tidak menjawabnya
  rationale: ענה menyatakan pemberian jawaban atas permintaan petunjuk. Konjungsi “tetapi” mengungkapkan pertentangan yang tersirat secara alami dalam konteks Indonesia.
- source_word: גַּם ... גַּם ... גַּם
  choice: baik ... maupun ...
  rationale: Sesudah klausa negatif, rangkaian ini menyatakan bahwa jawaban tidak datang melalui satu pun dari ketiga sarana yang disebutkan. Bentuk “baik ..., ..., maupun ...” menyampaikan cakupan distributif itu secara alami.
- source_word: בַּחֲלֹמוֹת
  choice: melalui mimpi
  rationale: Preposisi ב menunjukkan sarana atau perantaraan; “melalui” cocok untuk mimpi sebagai media penyataan.
- source_word: בָּאוּרִים
  choice: melalui Urim
  rationale: אוּרִים adalah istilah teknis bagi sarana keimaman untuk mencari petunjuk ilahi. Nama itu dipertahankan dan dijelaskan dalam catatan kaki agar tidak diterjemahkan secara spekulatif.
- source_word: בַּנְּבִיאִם
  choice: melalui para nabi
  rationale: Bentuk jamak berartikel menunjuk kepada para nabi sebagai perantara jawaban ilahi; “melalui” mempertahankan kesejajaran sarana dalam daftar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה. “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Makna tidak diberikannya jawaban kepada Saul
  choice: Hanya menyatakan bahwa Yahweh tidak menjawab melalui sarana-sarana yang disebutkan
  alternative: Menambahkan alasan mengapa Yahweh tidak menjawab
  rationale: Ayat ini tidak menyatakan alasan penolakan tersebut. Terjemahan mempertahankan ketegangan teologisnya dan tidak memasukkan penjelasan dari luar ayat.
- issue: Hubungan ketiga sarana pewahyuan
  choice: Ketiganya dipahami sebagai sarana yang tidak menghasilkan jawaban
  alternative: Membedakan status atau keabsahan teologis masing-masing sarana
  rationale: Pengulangan גַּם menempatkan mimpi, Urim, dan para nabi secara sejajar dalam klausa negatif; teks tidak memberi penilaian tambahan di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Meminta petunjuk” lebih mudah dipahami pembaca umum daripada “meminta keputusan ilahi”, sementara pengulangan “melalui” mempertahankan kesejajaran ketiga sarana. Catatan kaki ditempatkan langsung sesudah “Urim”, istilah yang dijelaskannya.
