  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: id
  text: Lalu Samuel berkata, “Kalau begitu, mengapa engkau bertanya kepadaku, sedangkan Yahweh telah berpaling darimu dan menjadi lawanmu[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “musuhmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: Lalu Samuel berkata
  rationale: Bentuk naratif waw-konsekutif dilukiskan secara alami dengan “Lalu,” yang menandai kelanjutan adegan tanpa membuat hubungan antarkalimat terlalu kaku.
- source_word: וְלָמָּה
  choice: Kalau begitu, mengapa
  rationale: Ungkapan ini mempertahankan daya penghubung וְ sekaligus ketajaman pertanyaan retoris לָמָּה dalam bahasa Indonesia yang wajar.
- source_word: תִּשְׁאָלֵנִי
  choice: engkau bertanya kepadaku
  rationale: שׁאל berarti bertanya atau meminta keterangan. “Bertanya kepadaku” langsung, jelas, dan sesuai dengan konteks Saul meminta petunjuk.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi yang terdapat dalam teks Ibrani tetap tampak.
- source_word: סָר מֵעָלֶיךָ
  choice: telah berpaling darimu
  rationale: סור dengan מֵעַל menyatakan menjauh atau berpaling dari seseorang. “Berpaling darimu” mempertahankan nuansa relasional dan tindakan penarikan diri.
- source_word: וַיְהִי עָרֶךָ
  choice: menjadi lawanmu
  rationale: עָר menunjuk kepada pihak yang menentang, yakni lawan atau musuh. “Lawanmu” mempertahankan gagasan pertentangan aktif tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan Yahweh dengan Saul dalam frasa וַיְהִי עָרֶךָ
  choice: menjadi lawanmu
  alternative: menjadi musuhmu; menentangmu
  rationale: Teks menyatakan pertentangan ilahi terhadap Saul dengan istilah עָר. Terjemahan tidak melunakkannya menjadi sekadar ketidaksenangan, tetapi “lawan” menjaga keluasan makna antara adversary dan enemy.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” sesuai untuk ujaran langsung dalam narasi Alkitab. Struktur pertanyaan tunggal mempertahankan hubungan sebab/keadaan dalam teks Ibrani, sementara “sedangkan” membuatnya alami dalam bahasa Indonesia.
