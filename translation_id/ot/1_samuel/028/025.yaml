  yaml_path: translation/ot/1_samuel/028/025.yaml
  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: id
  text: Kemudian perempuan itu menghidangkan makanan di hadapan Saul dan para pegawainya, lalu mereka makan. Sesudah itu mereka bangkit dan pergi pada malam itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: menghidangkan makanan
  rationale: Dalam bentuk Hifil, נגשׁ di sini berarti membawa atau menyajikan sesuatu di hadapan seseorang. Objeknya tidak dinyatakan dalam ayat ini, tetapi jelas dari konteks sebelumnya bahwa yang dimaksud ialah makanan yang telah disiapkan. Bahasa Indonesia alami memungkinkan objek kontekstual itu dinyatakan sebagai 'makanan' tanpa mengubah maksud.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Preposisi ini secara harfiah berarti 'di depan/di hadapan'. Dalam konteks menghidangkan makanan, 'di hadapan' tetap alami dan mempertahankan susunan sumber.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד dapat berarti hamba, budak, pelayan, atau orang yang mengabdi kepada seorang penguasa. Dalam konteks ini mereka adalah orang-orang yang menyertai Saul dalam dinas kerajaan; 'para pegawainya' menghindari kesan status budak yang tidak dipastikan teks sekaligus lebih tepat daripada pelayan rumah tangga.
- source_word: וַיֹּאכֵלוּ
  choice: lalu mereka makan
  rationale: Kata kerja itu menyatakan bahwa Saul dan orang-orangnya makan. Objek tidak perlu diulang karena sudah jelas dari konteks.
- source_word: וַיָּקֻמוּ
  choice: Sesudah itu mereka bangkit
  rationale: קום secara dasar berarti bangkit atau berdiri. 'Bangkit' mempertahankan unsur tindakan dalam teks dan register naratif yang bermartabat; 'sesudah itu' menyampaikan urutan waw konsekutif secara alami.
- source_word: וַיֵּלְכוּ
  choice: dan pergi
  rationale: הלך berarti pergi atau berjalan. Konteks menunjukkan keberangkatan, tetapi 'pergi' cukup alami tanpa menambahkan arah yang tidak dinyatakan.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Ungkapan Ibrani harfiahnya 'pada malam itu'; bentuk ini alami dalam bahasa Indonesia dan mempertahankan penunjukan waktu tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Objek tersirat pada וַתַּגֵּשׁ dinyatakan sebagai 'makanan' berdasarkan konteks langsung, sehingga tidak diperlukan catatan kaki. Sebutan 'perempuan itu' mengikuti subjek feminin yang berlanjut dari konteks sebelumnya tanpa menambahkan identifikasi yang tidak terdapat dalam ayat ini.
