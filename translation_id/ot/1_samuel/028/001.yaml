  text: וַֽ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וַ/יִּקְבְּצ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/צָּבָ֔א לְ/הִלָּחֵ֖ם בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֤אמֶר אָכִישׁ֙ אֶל דָּוִ֔ד יָדֹ֣עַ תֵּדַ֗ע כִּ֤י אִתִּ/י֙ תֵּצֵ֣א בַֽ/מַּחֲנֶ֔ה אַתָּ֖ה וַ/אֲנָשֶֽׁי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: id
  text: Pada masa itu, orang Filistin mengumpulkan pasukan[a] mereka untuk berperang melawan Israel. Akhis berkata kepada Daud, “Engkau tentu tahu bahwa engkau dan orang-orangmu harus ikut maju bersamaku dalam pasukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkemahan-perkemahan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Ungkapan pembuka narasi ini menandai peralihan adegan. 'Pada masa itu' alami dalam bahasa Indonesia modern tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: orang Filistin mengumpulkan pasukan mereka untuk berperang
  rationale: מַחֲנֶה secara harfiah dapat berarti 'perkemahan', tetapi dalam konteks pengerahan militer bentuk jamaknya menunjuk pada pasukan yang berhimpun. 'Pasukan' menyampaikan rujukan kontekstual secara wajar, sedangkan לַצָּבָא menyatakan tujuan militer.
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: melawan Israel
  rationale: Preposisi ב setelah verba berperang menyatakan pihak lawan; 'melawan Israel' ringkas dan jelas.
- source_word: יָדֹעַ תֵּדַע
  choice: Engkau tentu tahu
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. 'Tentu tahu' mempertahankan daya tekan itu secara idiomatis.
- source_word: אִתִּי תֵּצֵא
  choice: harus ikut denganku
  rationale: Secara bentuk berarti 'akan keluar denganku', tetapi dalam ujaran Akhis bentuk ini menyatakan tuntutan atau harapan tegas. 'Harus ikut denganku' menyampaikan daya pragmatisnya.
- source_word: בַמַּחֲנֶה
  choice: bersama pasukan
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan militer. Dalam konteks bergerak untuk berperang, 'bersama pasukan' merupakan ungkapan Indonesia yang alami dan mempertahankan arti kolektif militernya.
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: engkau dan orang-orangmu
  rationale: Mempertahankan penekanan pada Daud sendiri sekaligus para pengikutnya.
- source_word: אָכִישׁ
  choice: Akhis
  rationale: Nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
