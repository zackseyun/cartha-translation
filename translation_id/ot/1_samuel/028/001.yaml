  to: Pada masa itu, orang Filistin mengumpulkan pasukan[a] mereka untuk berperang melawan Israel. Akhis berkata kepada Daud, “Engkau tentu tahu bahwa engkau dan orang-orangmu harus ikut maju bersamaku dalam pasukan.”
