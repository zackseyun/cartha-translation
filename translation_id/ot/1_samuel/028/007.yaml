base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: id
  text: Lalu Saul berkata kepada hamba-hambanya, “Carilah bagiku seorang perempuan yang menjadi pemanggil arwah, supaya aku pergi kepadanya dan meminta petunjuk melalui dia.” Hamba-hambanya berkata kepadanya, “Ada seorang perempuan yang menjadi pemanggil arwah di En-Dor.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: seorang perempuan yang menjadi pemanggil arwah
  rationale: Ungkapan Ibrani secara harfiah menunjuk kepada perempuan yang memiliki atau menguasai 'ob', yakni pelaku praktik pemanggilan arwah. Pilihan ini alami dalam bahasa Indonesia dan tidak menyatakan bahwa klaim atau praktiknya sah.
- source_word: בַּקְּשׁוּ לִי
  choice: Carilah bagiku
  rationale: Menyampaikan imperatif 'carilah/temukanlah untukku' dengan tetap mempertahankan kepentingan Saul sebagai penerima.
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: dan meminta petunjuk melalui dia
  rationale: Preposisi בּ dapat bermakna melalui atau dengan perantara; terjemahan ini mempertahankan gagasan bahwa perempuan itu dijadikan sarana konsultasi, tanpa menentukan terlebih dahulu siapa atau apa yang benar-benar menjawab.
- source_word: הִנֵּה
  choice: Ada
  rationale: Dalam jawaban para hamba, partikel ini memperkenalkan informasi keberadaan secara idiomatis. 'Ada' lebih wajar dalam bahasa Indonesia daripada 'Lihatlah' pada konteks ini.
- source_word: עֵין דּוֹר
  choice: En-Dor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hakikat pelaku praktik אוֹב dan keberhasilan praktiknya
  choice: pemanggil arwah
  alternative: perantara arwah / perempuan yang memiliki roh peramal
  rationale: Istilah dipakai sebagai sebutan praktik atau profesi dalam narasi, bukan sebagai pengesahan teologis bahwa orang mati sungguh dapat dipanggil. Ambiguitas naratif mengenai mekanisme kejadian berikutnya tidak diselesaikan di ayat ini.
- issue: Arah tindakan Saul dalam וְאֶדְרְשָׁה בָּהּ
  choice: meminta petunjuk melalui dia
  alternative: meminta petunjuk kepadanya
  rationale: Bentuk Ibrani dengan preposisi בּ lebih mendukung perantaraan. Ini juga menghindari kesan bahwa perempuan tersebut merupakan sumber akhir petunjuk itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Hamba-hambanya' mempertahankan hubungan sosial-politik עבדים tanpa mengubahnya menjadi istilah birokratis seperti 'pegawai'. Kutipan langsung dibuat alami bagi pembaca umum.
