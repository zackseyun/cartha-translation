  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: id
  text: Yahweh juga akan menyerahkan Israel bersamamu ke tangan orang Filistin, dan besok engkau serta putra-putramu akan bersama aku.[a] Yahweh juga akan menyerahkan perkemahan[b] Israel ke tangan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersama aku dalam kematian” atau “bersama aku di dunia orang mati.” Teks Ibrani hanya mengatakan “bersama aku.”
    reason: alternative_reading
  - marker: b
    text: Atau, “pasukan.” Kata Ibrani ini dapat berarti “perkemahan” atau, dalam konteks ini, “pasukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi YHWH sebagai nama diri, sesuai bentuk yang lazim dalam proyek.
- source_word: וְיִתֵּן / יִתֵּן
  choice: akan menyerahkan
  rationale: Dalam konstruksi dengan בְּיַד, verba נתן menyatakan penyerahan ke dalam kuasa pihak lain; 'menyerahkan ... ke tangan' alami dalam bahasa Indonesia dan mempertahankan citra sumber.
- source_word: גַּם
  choice: juga
  rationale: Menyampaikan daya penambahan pada kedua pernyataan.
- source_word: עִמְּךָ
  choice: beserta engkau
  rationale: Menunjukkan bahwa Israel akan mengalami nasib yang sama dengan Saul; 'beserta engkau' jelas dan tetap dekat dengan susunan Ibrani.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ke tangan orang Filistin
  rationale: Mempertahankan idiom dan citra Ibrani tentang jatuh ke bawah kuasa orang Filistin.
- source_word: וּמָחָר
  choice: dan besok
  rationale: Konjungsi dipertahankan untuk mengikuti urutan dan penumpukan khidmat dalam nubuat.
- source_word: וּבָנֶיךָ
  choice: serta anak-anakmu
  rationale: Konteks merujuk kepada anak-anak laki-laki Saul; dalam bahasa Indonesia, 'anak-anakmu' merupakan ungkapan alami tanpa mengubah referen kontekstualnya.
- source_word: עִמִּי
  choice: bersama aku
  rationale: Mempertahankan ungkapan singkat dan ambiguitas teks tanpa menambahkan secara eksplisit 'dalam kematian' atau 'di dunia orang mati'.
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: perkemahan Israel
  rationale: Makna dasar מַחֲנֶה adalah perkemahan, meskipun dalam konteks militer kata ini juga dapat merujuk kepada pasukan; alternatif itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Arti pernyataan bahwa Saul dan anak-anaknya akan 'bersama aku'
  choice: bersama aku
  alternative: bersama aku dalam kematian; bersama aku di dunia orang mati
  rationale: Bahasa Ibrani tidak menjelaskan secara langsung keadaan atau tempat yang dimaksud. Terjemahan mempertahankan ketegangan mengenai alam kematian dan tidak memasukkan uraian metafisis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kata 'engkau' dipakai untuk sapaan tunggal kepada Saul, sedangkan idiom 'ke tangan' dipertahankan karena dapat dipahami dan mencerminkan citra bahasa sumber.
