  text: וַ/יַּ֥רְא שָׁא֖וּל אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֑ים וַ/יִּרָ֕א וַ/יֶּחֱרַ֥ד לִבּ֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: id
  text: Ketika Saul melihat perkemahan orang Filistin, ia menjadi takut, dan hatinya sangat gemetar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Kata ראה di sini menyatakan persepsi visual biasa; “melihat” merupakan padanan naratif yang alami dan langsung.
- source_word: מַחֲנֵה
  choice: perkemahan
  rationale: Kata מַחֲנֶה menunjuk pada tempat pasukan berkemah. “Perkemahan” mempertahankan gambaran konkret tanpa menggantinya dengan “pasukan” yang lebih interpretatif.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah bentuk baku dalam bahasa Indonesia untuk nama kelompok bangsa tersebut.
- source_word: וַיִּרָא
  choice: ia menjadi takut
  rationale: Kata ירא menyatakan rasa takut; bentuk “menjadi takut” menampilkan perkembangan narasi setelah Saul melihat perkemahan itu.
- source_word: וַיֶּחֱרַד
  choice: gemetar
  rationale: Kata חרד dapat menyatakan gemetar, guncangan batin, atau kengerian. “Gemetar” mempertahankan daya ungkap fisik dan emosionalnya tanpa mempersempit makna.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: Teks secara eksplisit menyebut hati sebagai pusat pengalaman batin; mempertahankan “hati” menjaga citra Ibraninya.
- source_word: מְאֹד
  choice: sangat
  rationale: Kata מְאֹד memperkuat tingkat kegentaran; “sangat” merupakan penguat yang alami dalam bahasa Indonesia modern.
