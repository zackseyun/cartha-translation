  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan klausa mempertahankan urutan naratif Ibrani, sedangkan ungkapan “hatinya sangat gemetar” sengaja menjaga citra hati sebagai pusat ketakutan batin.
