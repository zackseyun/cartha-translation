  text: וַ/יְמַהֵ֣ר שָׁא֗וּל וַ/יִּפֹּ֤ל מְלֹא קֽוֹמָת/וֹ֙ אַ֔רְצָ/ה וַ/יִּרָ֥א מְאֹ֖ד מִ/דִּבְרֵ֣י שְׁמוּאֵ֑ל גַּם כֹּ֨חַ֙ לֹא הָ֣יָה ב֔/וֹ כִּ֣י לֹ֤א אָכַל֙ לֶ֔חֶם כָּל הַ/יּ֖וֹם וְ/כָל הַ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: id
  text: Saul segera jatuh terbujur ke tanah[a] dan menjadi sangat takut karena perkataan Samuel. Ia juga tidak bertenaga karena tidak makan roti[b] sepanjang hari dan sepanjang malam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jatuh dengan seluruh panjang tubuhnya ke tanah.”'
    reason: Ungkapan Ibrani menggambarkan Saul jatuh dengan tubuh terbujur sepenuhnya.
  - marker: b
    text: Kata Ibrani untuk “roti” juga dapat dipakai dalam arti yang lebih luas, yaitu makanan.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: segera
  rationale: Secara harfiah verba ini berarti 'bergegas', tetapi di sini berfungsi menandai bahwa Saul jatuh dengan tiba-tiba; 'segera' menyampaikan daya adverbialnya secara alami tanpa menyiratkan tindakan yang disengaja.
- source_word: וַיִּפֹּל
  choice: rebah
  rationale: Makna dasarnya ialah 'jatuh'. Dalam konstruksi dengan מְלֹא קוֹמָתוֹ, 'rebah' secara alami menggambarkan tubuh Saul jatuh memanjang tanpa memperkuatnya menjadi 'pingsan'.
- source_word: מְלֹא קוֹמָתוֹ
  choice: dengan seluruh tubuhnya
  rationale: Ungkapan ini secara harfiah menunjuk pada seluruh tinggi atau panjang badannya. Pilihan ini menyampaikan bahwa Saul tergeletak sepenuh tubuh, bukan sekadar tersandung atau berlutut.
- source_word: אַרְצָה
  choice: ke tanah
  rationale: Bentuk berarah dari אֶרֶץ dalam konteks ini secara alami berarti 'ke tanah'.
- source_word: וַיִּרָא מְאֹד
  choice: menjadi sangat takut
  rationale: Ungkapan tersebut menyatakan ketakutan yang sangat kuat; bentuk naratif 'menjadi sangat takut' mempertahankan perkembangan peristiwa.
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: karena perkataan Samuel
  rationale: Preposisi מִן di sini paling wajar menyatakan sebab ketakutan Saul.
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: Ia juga tidak bertenaga
  rationale: Pilihan ini mempertahankan unsur tambahan גַּם ('juga') dan keadaan fisik Saul, tanpa menambahkan gagasan 'tersisa' yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Saul tidak bertenaga.
- source_word: לֹא אָכַל לֶחֶם
  choice: tidak makan roti
  rationale: לֶחֶם secara leksikal berarti 'roti' tetapi juga dapat merujuk lebih luas pada makanan; teks utama mempertahankan gambaran konkret sumber.
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: sepanjang hari dan sepanjang malam itu
  rationale: Pilihan ini menyampaikan keseluruhan rentang waktu. Kata 'itu' ditempatkan pada akhir rangkaian agar secara alami mencakup hari dan malam dalam konteks peristiwa tersebut.
