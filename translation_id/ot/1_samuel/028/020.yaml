translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Rebah' dipilih untuk menggambarkan jatuh sepenuh tubuh tanpa memasukkan tafsiran bahwa Saul pingsan. 'Tidak bertenaga' lebih alami daripada konstruksi nominal yang sangat harfiah, tetapi tetap dekat dengan makna sumber.
