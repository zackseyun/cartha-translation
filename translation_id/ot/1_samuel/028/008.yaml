- from: Maka Saul menyamarkan dirinya dan mengenakan pakaian lain. Lalu ia pergi bersama dua orang laki-laki. Pada malam hari mereka mendatangi perempuan itu. Saul berkata, “Tolong lakukanlah tenung bagiku melalui arwah[a], dan munculkanlah bagiku[b] orang yang akan kusebutkan kepadamu.”
  to: Maka Saul menyamarkan dirinya dan mengenakan pakaian lain. Lalu ia sendiri pergi bersama dua orang laki-laki. Pada malam hari mereka mendatangi perempuan itu. Saul berkata, “Tolong lakukanlah tenung bagiku melalui seorang medium[a], dan munculkanlah bagiku[b] orang yang akan kusebutkan kepadamu.”
  rationale: Revisi mengganti "arwah" dalam teks utama dengan "seorang medium" agar lebih sesuai dengan penggunaan אוֹב dalam konteks ini dan dengan fungsi perempuan tersebut dalam narasi. Alternatif yang berkaitan dengan arwah dipertahankan dalam catatan kaki. Penyesuaian "ia sendiri" mencerminkan penegasan eksplisit pada Saul dalam bahasa Ibrani. Makna dan ketegangan naratif mengenai praktik necromantik tidak ditafsirkan lebih jauh.
