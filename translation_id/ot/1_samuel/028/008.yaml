base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: id
  text: Maka Saul menyamarkan dirinya dan mengenakan pakaian lain. Lalu ia sendiri pergi bersama dua orang laki-laki. Pada malam hari mereka mendatangi perempuan itu. Saul berkata, “Tolong lakukanlah tenung bagiku melalui seorang medium[a], dan munculkanlah bagiku[b] orang yang akan kusebutkan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melalui arwah.” Istilah Ibrani ini dapat merujuk kepada medium yang terkait dengan konsultasi dengan orang mati, atau kepada roh yang terkait dengan praktik tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “buatlah naik bagiku,” sesuai dengan gambaran orang mati yang dipanggil naik.
    reason: source_imagery
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: menyamarkan dirinya
  rationale: 'Bentuk hitpael menyatakan tindakan refleksif: Saul mengubah penampilannya agar jati dirinya tidak dikenali.'
- source_word: בְּגָדִים אֲחֵרִים
  choice: pakaian lain
  rationale: Ungkapan ini menunjuk pada pakaian pengganti sebagai bagian dari penyamaran; pilihan ini alami dan tetap dekat dengan teks Ibrani.
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: ia pergi bersama dua orang laki-laki
  rationale: Menyampaikan bahwa Saul sendiri pergi bersama dua laki-laki tanpa menambahkan status mereka yang tidak disebutkan dalam ayat.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Padanan Indonesia yang alami untuk keterangan waktu tersebut.
- source_word: קָסֳמִי נָא לִי
  choice: Tolong lakukanlah tenung bagiku
  rationale: Kata kerja קסם menunjuk pada praktik tenung atau peramalan, sedangkan נָא memberi nuansa permohonan yang tercermin dalam 'tolong'.
- source_word: בָּאוֹב
  choice: melalui arwah
  rationale: Dalam konteks pemanggilan orang mati, אוֹב berkaitan dengan arwah dan praktik perantaraan untuk berkonsultasi dengannya. Catatan kaki mempertahankan ketidakpastian apakah istilah itu menunjuk terutama pada arwah atau mediumnya.
- source_word: וְהַעֲלִי לִי
  choice: munculkanlah bagiku
  rationale: Bentuk kausatif dari עלה secara harfiah menggambarkan membuat seseorang naik. 'Munculkanlah' terdengar wajar dalam permintaan pemanggilan orang mati, sementara citra gerak naik dicatat dalam catatan kaki.
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: orang yang akan kusebutkan kepadamu
  rationale: Klausa ini menunjuk pada orang tertentu yang identitasnya akan diberitahukan Saul kepada perempuan itu.
theological_decisions:
- issue: Istilah tentang tenung dan pemanggilan orang mati tanpa menilai kemanjurannya
  choice: Permintaan Saul diterjemahkan secara langsung sebagai melakukan tenung, memakai perantaraan arwah, dan memunculkan orang yang disebutkan.
  alternative: Menambahkan ungkapan skeptis seperti 'berpura-pura memunculkan', atau sebaliknya mempertegas mekanismenya sebagai kontak nyata dengan roh orang mati.
  rationale: Narasi melaporkan permintaan Saul dalam kerangka konseptual teks tanpa menyatakan di sini apakah praktik tersebut sungguh efektif atau bagaimana mekanismenya.
- issue: Ambiguitas makna אוֹב
  choice: Teks utama memakai 'arwah' dan catatan kaki menyebut kemungkinan rujukan kepada pemanggil arwah atau medium.
  alternative: Menerjemahkannya hanya sebagai 'medium' atau hanya sebagai 'roh peliharaan'.
  rationale: Istilah Ibrani dapat berkaitan dengan arwah yang dimintai petunjuk maupun orang yang menjadi perantaranya; catatan menjaga ambiguitas leksikal ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'tenung' dipilih karena cukup dikenal dan lebih ringkas daripada parafrasa teknis; struktur kalimat disesuaikan agar alami tanpa menambahkan penilaian teologis.
