  text: וְ/לָ/אִשָּׁ֤ה עֵֽגֶל מַרְבֵּק֙ בַּ/בַּ֔יִת וַ/תְּמַהֵ֖ר וַ/תִּזְבָּחֵ֑/הוּ וַ/תִּקַּח קֶ֣מַח וַ/תָּ֔לָשׁ וַ/תֹּפֵ֖/הוּ מַצּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: id
  text: Perempuan itu mempunyai seekor anak sapi yang digemukkan di rumah itu[a]. Ia bergegas menyembelihnya, lalu mengambil tepung, menguleninya, dan memanggang roti tidak beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak sapi yang dipelihara di kandang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: anak sapi yang digemukkan
  rationale: עֵגֶל menunjuk pada sapi muda, sedangkan מַרְבֵּק menggambarkan hewan yang digemukkan, kemungkinan dengan dipelihara di kandang.
- source_word: בַּבַּיִת
  choice: di rumahnya
  rationale: Frasa ini bersifat lokatif. Akhiran posesif tidak tersurat dalam bahasa Ibrani, tetapi dalam bahasa Indonesia 'rumahnya' secara alami menunjukkan rumah tempat perempuan itu berada tanpa mengubah acuan.
- source_word: וַתְּמַהֵר
  choice: Ia segera
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan dengan tergesa atau tanpa menunda; 'segera' wajar dalam alur narasi Indonesia.
- source_word: וַתִּזְבָּחֵהוּ
  choice: menyembelihnya
  rationale: Walaupun זבח dapat dipakai untuk penyembelihan kurban, konteks ini adalah penyiapan hidangan, sehingga 'menyembelih' mempertahankan tindakan konkret tanpa menjadikannya tindakan ritual.
- source_word: קֶמַח
  choice: tepung
  rationale: Padanan langsung dan alami untuk bahan yang kemudian dijadikan adonan dan dipanggang.
- source_word: וַתָּלָשׁ
  choice: meremasnya menjadi adonan
  rationale: Kata kerja ini menunjuk pada menguleni atau meremas bahan menjadi adonan. Bentuk ini lebih jelas bagi pembaca karena objek sebelumnya adalah tepung.
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: memanggang roti tidak beragi
  rationale: מַצּוֹת adalah bentuk jamak yang menunjuk pada roti tanpa ragi; bahasa Indonesia lazim memakai nomina kolektif 'roti tidak beragi'.
theological_decisions:
- issue: Kemungkinan nuansa kurban dalam וַתִּזְבָּחֵהוּ
  choice: menyembelihnya
  alternative: mengurbankannya
  rationale: Konteks menggambarkan penyediaan makanan bagi Saul, bukan ibadah atau persembahan. Karena itu, terjemahan tidak memasukkan nuansa ritual yang tidak dituntut oleh konteks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan Ibrani dipertahankan, tetapi rangkaian waw beruntun diungkapkan dengan pemenggalan kalimat dan penghubung yang alami. Penanda catatan kaki [a] dicantumkan tepat setelah frasa terkait.
