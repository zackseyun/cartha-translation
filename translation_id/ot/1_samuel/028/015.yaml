id: 1SA.28.15
reference: 1 Samuel 28:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לָ֥/מָּה הִרְגַּזְתַּ֖/נִי לְ/הַעֲל֣וֹת אֹתִ֑/י וַ/יֹּ֣אמֶר שָׁ֠אוּל צַר לִ֨/י מְאֹ֜ד וּ/פְלִשְׁתִּ֣ים נִלְחָמִ֣ים בִּ֗/י וֵֽ/אלֹהִ֞ים סָ֤ר מֵֽ/עָלַ/י֙ וְ/לֹֽא עָנָ֣/נִי ע֗וֹד גַּ֤ם בְּ/יַֽד הַ/נְּבִיאִם֙ גַּם בַּ֣/חֲלֹמ֔וֹת וָ/אֶקְרָאֶ֣/ה לְ/ךָ֔ לְ/הוֹדִיעֵ֖/נִי מָ֥ה אֶעֱשֶֽׂה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: id
  text: Lalu Samuel berkata kepada Saul, “Mengapa engkau mengusik aku[a] dengan membawa aku naik?” Saul menjawab, “Aku sangat terdesak. Orang Filistin sedang berperang melawan aku, dan Allah telah berpaling dariku. Ia tidak lagi menjawab aku, baik melalui para nabi[b] maupun melalui mimpi. Karena itu, aku memanggil engkau supaya engkau memberitahukan kepadaku apa yang harus kulakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menggusarkan aku.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: melalui tangan para nabi; ungkapan Ibrani ini berarti melalui perantaraan para nabi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: engkau mengusik aku
  rationale: Kata kerja רגז dalam bentuk kausatif menyatakan tindakan yang menimbulkan kegelisahan atau gangguan. “Mengusik” wajar dalam bahasa Indonesia dan tidak menentukan lebih jauh hakikat kemunculan Samuel.
- source_word: לְהַעֲלוֹת אֹתִי
  choice: dengan membawa aku naik
  rationale: Terjemahan ini mempertahankan gambaran spasial עלה, yakni membawa naik, tanpa mengalihkannya menjadi bahasa kebangkitan.
- source_word: צַר לִי מְאֹד
  choice: Aku sangat terdesak
  rationale: Ungkapan ini menyatakan tekanan dan kesesakan yang berat. “Sangat terdesak” alami dalam konteks ancaman perang serta permintaan petunjuk.
- source_word: נִלְחָמִים בִּי
  choice: sedang berperang melawan aku
  rationale: Pilihan ini mempertahankan makna tindakan militer yang ditujukan kepada Saul.
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: Allah telah berpaling dariku
  rationale: סור מעל menyatakan menjauh atau berpaling. Pilihan ini menyampaikan penarikan relasional tanpa menambahkan penjelasan metafisik.
- source_word: וְלֹא עָנָנִי עוֹד
  choice: Ia tidak lagi menjawab aku
  rationale: עוד bersama penyangkalan menunjukkan bahwa jawaban yang dahulu diterima kini tidak diberikan lagi.
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: baik melalui para nabi maupun melalui mimpi
  rationale: Pasangan “baik ... maupun ...” mencerminkan susunan גם ... גם, sedangkan ביד dipahami sebagai perantaraan atau sarana.
- source_word: וָאֶקְרָאֶה לְךָ
  choice: Karena itu, aku memanggil engkau
  rationale: קרא dengan ל dapat menyatakan memanggil atau memohon kehadiran seseorang. “Memanggil engkau” jelas dan tidak memasukkan istilah teknis okultisme yang tidak terdapat dalam klausa ini.
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: supaya engkau memberitahukan kepadaku apa yang harus kulakukan
  rationale: Bentuk Hifil ידע berarti membuat tahu atau memberitahukan; klausa berikutnya menyatakan bahwa Saul meminta petunjuk tindakan.
theological_decisions:
- issue: Identitas dan status Samuel dalam kisah pemanggilan arwah
  choice: Mengikuti penyajian langsung narasi bahwa Samuel berbicara kepada Saul.
  alternative: Menambahkan bahwa sosok itu hanya penampakan, persepsi perempuan pemanggil arwah, atau roh yang menyamar.
  rationale: Teks Ibrani secara langsung mengatakan bahwa Samuel berkata kepada Saul. Terjemahan tidak boleh menambahkan penilaian yang menyelesaikan perdebatan teologis di luar pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “engkau” yang sesuai bagi dialog langsung dalam narasi Alkitab. Susunan kalimat dibuat alami tetapi tetap mempertahankan gambaran “naik,” pengulangan sarana pewahyuan, dan ketegangan teologis narasi.
