source:
  edition: WLC
  text: וַ/יִּשָּׁ֤בַֽע לָ/הּ֙ שָׁא֔וּל בַּֽ/יהוָ֖ה לֵ/אמֹ֑ר חַי יְהוָ֕ה אִֽם יִקְּרֵ֥/ךְ עָוֺ֖ן בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: id
  text: Lalu Saul bersumpah kepadanya demi Yahweh, katanya, “Demi Yahweh yang hidup, engkau tidak akan ditimpa hukuman dalam perkara ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau tidak akan ditimpa kesalahan dalam perkara ini.” Kata Ibrani yang dipakai dapat berarti kesalahan, tanggungan kesalahan, atau hukuman sebagai akibat kesalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע lazim berarti bersumpah; pilihan ini alami dan tetap mempertahankan kekhidmatan ujaran.
- source_word: לָהּ
  choice: kepadanya
  rationale: Menyatakan objek tak langsung feminin tunggal secara wajar dalam bahasa Indonesia.
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Preposisi ב menandai nama yang dijadikan dasar atau saksi sumpah; 'demi' merupakan ungkapan sumpah yang alami dalam bahasa Indonesia.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Menyampaikan daya formula sumpah Ibrani secara alami, bukan sekadar membuat pernyataan bahwa Yahweh hidup.
- source_word: אִם
  choice: tidak
  rationale: Dalam formula sumpah, אִם memperkenalkan kutuk bersyarat yang dilesapkan dan karena itu berfungsi sebagai penyangkalan tegas.
- source_word: יִקְּרֵךְ
  choice: engkau ... akan ditimpa
  rationale: Dalam konteks ini קרא berarti sesuatu menimpa atau terjadi pada seseorang; susunan pasif ini idiomatis dalam bahasa Indonesia.
- source_word: עָוֺן
  choice: hukuman
  rationale: עָוֺן dapat berarti kesalahan, kesalahan yang diperhitungkan sebagai kesalahan, atau akibat hukumannya. Konteks jaminan Saul kepada perempuan itu terutama menunjuk pada konsekuensi hukuman.
- source_word: בַּדָּבָר הַזֶּה
  choice: karena perkara ini
  rationale: Menunjukkan bahwa perkara atau tindakan yang sedang dibicarakan menjadi alasan bagi kemungkinan hukuman.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna עָוֺן dalam sumpah Saul
  choice: hukuman
  alternative: kesalahan; kesalahan yang ditanggungkan
  rationale: Ucapan Saul menjamin bahwa perempuan itu tidak akan mengalami konsekuensi pidana karena tindakannya. Namun, karena kata Ibrani juga dapat menunjuk pada kesalahan atau tanggungan kesalahan, ambiguitas tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Lalu' menghubungkan tindakan ini dengan konteks sebelumnya; 'katanya' mempertahankan formula לֵאמֹר secara alami. Pronomina 'engkau' sesuai dengan ujaran langsung yang khidmat tanpa terasa kuno.
