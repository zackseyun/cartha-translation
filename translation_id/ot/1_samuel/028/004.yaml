id: 1SA.28.4
reference: 1 Samuel 28:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ פְלִשְׁתִּ֔ים וַ/יָּבֹ֖אוּ וַ/יַּחֲנ֣וּ בְ/שׁוּנֵ֑ם וַ/יִּקְבֹּ֤ץ שָׁאוּל֙ אֶת כָּל יִשְׂרָאֵ֔ל וַֽ/יַּחֲנ֖וּ בַּ/גִּלְבֹּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/004.yaml
  text: The Philistines gathered and came and camped at Shunem[a], and Saul gathered all Israel[b], and they camped at Gilboa.
translation:
  language: id
  text: Orang Filistin berkumpul, lalu datang dan berkemah di Sunem[a]. Saul pun mengumpulkan seluruh Israel, lalu mereka berkemah di Gilboa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendirikan perkemahan”; demikian juga pada kemunculan kedua kata “berkemah” dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “di Pegunungan Gilboa,” karena nama tempat ini merujuk pada kawasan perbukitan Gilboa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: berkumpul
  rationale: Bentuk dari קבץ menyatakan tindakan berhimpun; “berkumpul” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pengerahan pasukan tanpa memperjelasnya secara berlebihan.
- source_word: פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: וַיָּבֹאוּ
  choice: lalu datang
  rationale: Kata בוא adalah verba gerak dasar. “Datang” mempertahankan urutan naratif tanpa menambahkan arti militer seperti “maju menyerang”.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata חנה berarti mendirikan atau menempati perkemahan; “berkemah” merupakan padanan modern yang ringkas dan wajar.
- source_word: בְשׁוּנֵם
  choice: di Sunem
  rationale: Preposisi בְּ menandai lokasi; “di” adalah padanan Indonesia yang alami tanpa menentukan apakah pasukan berada tepat di dalam permukiman atau di sekitarnya.
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Bentuk kausatif-transitif dalam konteks ini menggambarkan Saul menghimpun Israel dan menjaga konsistensi dengan akar קבץ pada klausa pertama.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan ungkapan kolektif Ibrani tanpa mempersempitnya menjadi “semua laki-laki Israel” atau secara eksplisit menafsirkannya sebagai tentara.
- source_word: וַיַּחֲנוּ
  choice: lalu mereka berkemah
  rationale: Pronomina “mereka” diperlukan demi kejelasan dalam bahasa Indonesia dan merujuk kepada pasukan Israel yang telah dihimpun Saul.
- source_word: בַּגִּלְבֹּעַ
  choice: di Gilboa
  rationale: Teks Ibrani hanya menyebut Gilboa tanpa kata “gunung”; “di Gilboa” mempertahankan bentuk tersebut dan tidak menambahkan rincian topografis ke dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Rangkaian waw konsekutif disampaikan dengan “lalu” dan “pun” agar alurnya jelas tanpa mempertahankan pengulangan “dan” secara kaku. Nama tempat mengikuti bentuk Indonesia yang lazim.
