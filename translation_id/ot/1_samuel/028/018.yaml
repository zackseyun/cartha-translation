  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: id
  text: Karena engkau tidak menaati suara Yahweh dan tidak melaksanakan murka-Nya yang berkobar terhadap Amalek[a], maka Yahweh telah melakukan hal ini kepadamu hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak melaksanakan murka-Nya yang dahsyat terhadap Amalek.”
    reason: Alternatif leksikal bagi חֲרוֹן אַפּוֹ; “dahsyat” lebih idiomatis dalam beberapa konteks, sedangkan teks utama mempertahankan gambaran panas atau nyala dalam bahasa Ibrani.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Karena
  rationale: Dalam konteks ini, kata penghubung tersebut menyatakan alasan bagi hukuman atas Saul; “Karena” menyampaikan fungsi kausalnya secara wajar.
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: menaati suara Yahweh
  rationale: Ungkapan שׁמע בְּקוֹל dalam konteks perjanjian dan penghakiman berarti bukan sekadar mendengar, melainkan menaati; “menaati suara” mempertahankan baik idiom maupun maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: melaksanakan murka-Nya yang menyala-nyala
  rationale: Secara harfiah ungkapan ini berarti “melakukan panas kemurkaan-Nya” dan merujuk pada pelaksanaan perintah penghukuman ilahi terhadap Amalek. Pilihan ini mempertahankan daya konkret עשה dan gambaran panas dalam חֲרוֹן אַף.
- source_word: בַּעֲמָלֵק
  choice: terhadap Amalek
  rationale: Preposisi ini menunjukkan sasaran pelaksanaan murka; “terhadap” paling alami dalam susunan kalimat Indonesia ini.
- source_word: עַל כֵּן
  choice: maka
  rationale: Kata ini menandai akibat dari ketidaktaatan Saul dan berpasangan secara alami dengan klausa awal “Karena”.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דבר di sini menunjuk secara luas pada hukuman atau keadaan yang sedang diumumkan; “hal ini” literal sekaligus alami.
- source_word: עָשָׂה לְךָ יְהוָה
  choice: Yahweh melakukan hal ini kepadamu
  rationale: Susunan ini mempertahankan pelaku ilahi, objek yang dinyatakan secara eksplisit, dan dampaknya atas Saul tanpa menambahkan penafsiran.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Pilihan ini mempertahankan penekanan bentuk Ibrani “hari ini” secara wajar dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Pelaksanaan murka Yahweh terhadap Amalek
  choice: tidak melaksanakan murka-Nya yang menyala-nyala terhadap Amalek
  alternative: tidak melaksanakan murka-Nya yang dahsyat terhadap Amalek
  rationale: Ungkapan yang dipilih tidak mengaburkan bahwa Saul dituntut melaksanakan penghukuman yang telah diperintahkan, sekaligus mempertahankan citra panas atau nyala dalam idiom Ibrani tanpa memperluas klaim teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang lugas dan bermartabat. Kata ganti “engkau” sesuai untuk sapaan tunggal dalam konteks Alkitab, sedangkan “-Nya” merujuk kepada Yahweh.
