  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: id
  text: Sekarang, dengarkanlah juga perkataan hambamu ini[a]. Izinkan aku menyajikan sepotong roti kepadamu. Makanlah, supaya engkau mendapat kekuatan, sebab engkau harus melanjutkan perjalananmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba” secara khusus menunjuk pada seorang hamba perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar permohonan mendesak; “Sekarang” wajar dalam bahasa Indonesia tanpa perlu menambahkan kesimpulan yang tidak dinyatakan secara tegas.
- source_word: שְׁמַע נָא גַם אַתָּה
  choice: dengarkanlah juga
  rationale: Bentuk imperatif dengan נָא menyampaikan permohonan yang diperhalus, sedangkan גַם אַתָּה menegaskan bahwa Saul pada gilirannya juga diminta mendengarkan perempuan itu. Akhiran -lah membantu menyampaikan nada permohonan.
- source_word: בְּקוֹל שִׁפְחָתֶךָ
  choice: perkataan hambamu ini
  rationale: Ungkapan Ibrani harfiahnya “suara hambamu” dan secara idiomatis berarti mendengarkan atau mengindahkan perkataannya. “Hambamu ini” mempertahankan cara merendahkan diri dalam sapaan langsung; jenis kelamin khusus pada nomina Ibrani dijelaskan dalam catatan kaki.
- source_word: וְאָשִׂמָה לְפָנֶיךָ
  choice: Izinkan aku menyajikan ... kepadamu
  rationale: Bentuk kohortatif menyatakan kehendak atau tawaran yang sopan. “Izinkan aku” mengungkapkan nuansa itu secara alami, dan “menyajikan” cocok untuk menaruh makanan di hadapan seseorang.
- source_word: פַּת לֶחֶם
  choice: sepotong roti
  rationale: פַּת menunjuk pada sepotong atau sedikit roti. “Sepotong roti” jelas, alami, dan dekat dengan bentuk konkret teks.
- source_word: וֶאֱכֹל
  choice: Makanlah
  rationale: Imperatif langsung dipertahankan; pemisahan menjadi kalimat baru menghasilkan alur Indonesia yang alami.
- source_word: וִיהִי בְךָ כֹּחַ
  choice: supaya engkau mendapat kekuatan
  rationale: Klausa yusif menyatakan hasil atau tujuan yang diharapkan. Ungkapan ini alami dalam bahasa Indonesia dan tetap menunjuk pada kekuatan yang diperlukan untuk perjalanan.
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: sebab engkau harus melanjutkan perjalananmu
  rationale: כִּי memberikan alasan untuk makan, sementara bentuk imperfect mengarah pada keberangkatan yang segera. “Harus melanjutkan perjalananmu” menyampaikan kebutuhan praktis dalam konteks tanpa menentukan lebih jauh tujuan perjalanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan mendesak. Sapaan “engkau” dipertahankan agar sesuai dengan wacana naratif Alkitab dan bentuk orang kedua tunggal. Terjemahan mengutamakan kealamian tanpa menghilangkan bentuk permohonan, hubungan timbal balik pada “juga,” atau alasan yang diperkenalkan oleh כִּי.
