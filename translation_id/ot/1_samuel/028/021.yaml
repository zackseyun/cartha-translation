translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami dan rujukan kepada Saul diperjelas. Sapaan 'hambamu' mempertahankan sikap merendah tanpa terdengar arkais berlebihan; dua idiom Ibrani diterjemahkan menurut maknanya, dengan bentuk harfiah dicatat.
