base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: id
  text: Perempuan itu datang kepada Saul, dan ketika ia melihat bahwa Saul sangat ketakutan, ia berkata kepadanya, “Lihatlah, hambamu ini telah menuruti perkataanmu,[a] dan aku telah mempertaruhkan nyawaku[b] serta mendengarkan kata-kata yang kausampaikan kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hamba perempuanmu telah mendengarkan suaramu.” Ungkapan Ibrani ini berarti bahwa ia menuruti atau menaati perkataan Saul.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “aku telah menaruh nyawaku di telapak tanganku,” yaitu mempertaruhkan nyawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא הָאִשָּׁה אֶל־שָׁאוּל
  choice: Perempuan itu datang kepada Saul
  rationale: Mempertahankan sebutan umum dan definit dalam bahasa Ibrani tanpa memasukkan keterangan dari konteks bahwa ia seorang pemanggil arwah. Bentuk naratif diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: Ketika dilihatnya bahwa Saul sangat ketakutan
  rationale: נבהל dapat menyatakan keadaan terguncang, gentar, atau ketakutan; 'sangat ketakutan' menyampaikan intensitas מְאֹד dengan jelas. Nama Saul diulang agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian Saul kepada permohonan perempuan itu. 'Lihatlah' mempertahankan daya serunya dalam ragam modern yang bermartabat.
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: hambamu ini telah menuruti perkataanmu
  rationale: Ungkapan שׁמע בקול berarti mendengarkan dengan maksud menaati atau menuruti. 'Hambamu ini' menyampaikan penyebutan diri yang merendah; unsur feminin pada שִׁפְחָה dijelaskan dalam catatan.
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: aku telah mempertaruhkan nyawaku
  rationale: Ini idiom Ibrani yang berarti mengambil risiko maut. Terjemahan idiomatis dipilih agar maknanya langsung dipahami pembaca Indonesia, sedangkan citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: וָאֶשְׁמַע אֶת־דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: serta mendengarkan kata-kata yang kausampaikan kepadaku
  rationale: Menerjemahkan שׁמע dengan 'mendengarkan' dan mempertahankan hubungan klausa relatif, tanpa menyamakan sepenuhnya ungkapan ini dengan idiom ketaatan pada klausa sebelumnya.
