id: 1SA.28.12
reference: 1 Samuel 28:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: id
  text: Ketika perempuan itu melihat Samuel[a], ia berteriak dengan suara nyaring. Lalu perempuan itu berkata kepada Saul, “Mengapa engkau menipu aku? Engkau adalah Saul!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang tampak seperti Samuel.” Teks Ibrani hanya menyebut “Samuel” tanpa menjelaskan hakikat penampakan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: melihat
  rationale: Bentuk naratif dari ראה secara langsung menyatakan bahwa perempuan itu melihat; pilihan yang lebih samar seperti 'menyadari' akan menambahkan tafsiran.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani memakai sebutan umum 'perempuan itu', bukan gelar perannya sebagai pemanggil arwah.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Penanda objek langsung diikuti nama Samuel. Terjemahan mempertahankan pernyataan langsung teks tanpa menambahkan penjelasan mengenai hakikat penampakan tersebut.
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: ia berteriak dengan suara nyaring
  rationale: זעק menyatakan seruan kuat, sedangkan בְּקוֹל גָּדוֹל mempertegas kerasnya suara. Ungkapan ini alami dan tetap menjaga intensitas teks.
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: berkata
  rationale: Dalam bahasa Indonesia, penggandaan harfiah 'berkata, katanya' tidak diperlukan; satu verba menyampaikan fungsi ungkapan Ibrani dengan wajar.
- source_word: לָמָּה רִמִּיתָנִי
  choice: Mengapa engkau menipu aku?
  rationale: לָמָּה adalah pertanyaan sebab, dan bentuk piel רמה menyatakan tindakan memperdaya atau menipu. 'Menipu' merupakan padanan modern yang jelas.
- source_word: וְאַתָּה שָׁאוּל
  choice: Engkau adalah Saul!
  rationale: Pronomina אַתָּה bersifat tegas. Tanda seru menyampaikan daya pengenalan dan tuduhan itu secara alami; konjungsi וְ tidak perlu diterjemahkan secara kaku.
theological_decisions:
- issue: Apakah 'Samuel' perlu diberi kualifikasi sebagai penampakan, roh, atau sosok yang tampaknya Samuel
  choice: Mempertahankan penyebutan langsung 'Samuel' dalam teks utama
  alternative: apa yang tampak seperti Samuel; penampakan Samuel; roh Samuel
  rationale: Teks Ibrani hanya menyatakan bahwa perempuan itu melihat Samuel. Menambahkan kualifikasi dalam teks utama akan menentukan hakikat peristiwa yang tidak dijelaskan oleh ayat ini dan mengurangi ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam dialog naratif Alkitab untuk menjaga nada khidmat tanpa menjadi arkais; pemenggalan menjadi dua kalimat membuat urutan tindakan jelas dan alami.
