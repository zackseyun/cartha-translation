  to: Namun perempuan itu berkata kepadanya, “Lihat, engkau sendiri tahu apa yang telah dilakukan Saul, bahwa ia telah menyingkirkan para pemanggil arwah dan para peramal[a] dari negeri ini. Jadi, mengapa engkau memasang jerat bagi nyawaku untuk membunuhku?”
