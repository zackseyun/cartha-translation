  text: וַ/תֹּ֨אמֶר הָֽ/אִשָּׁ֜ה אֵלָ֗י/ו הִנֵּ֨ה אַתָּ֤ה יָדַ֨עְתָּ֙ אֵ֣ת אֲשֶׁר עָשָׂ֣ה שָׁא֔וּל אֲשֶׁ֥ר הִכְרִ֛ית אֶת הָ/אֹב֥וֹת וְ/אֶת הַ/יִּדְּעֹנִ֖י מִן הָ/אָ֑רֶץ וְ/לָ/מָ֥ה אַתָּ֛ה מִתְנַקֵּ֥שׁ בְּ/נַפְשִׁ֖/י לַ/הֲמִיתֵֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: id
  text: Namun perempuan itu berkata kepadanya, “Lihat, engkau sendiri tahu apa yang telah dilakukan Saul, bahwa ia telah menyingkirkan para pemanggil arwah dan para peramal[a] dari negeri ini. Jadi, mengapa engkau memasang jerat bagi nyawaku untuk membunuhku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang yang mempunyai roh pemanggil arwah dan para ahli nujum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Namun ... berkata
  rationale: Bentuk naratif melanjutkan adegan, sedangkan “Namun” menyampaikan tanggapan perempuan yang berhati-hati dan menentang permintaan Saul.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian secara tegas; “Lihat” alami dalam bahasa Indonesia modern tanpa kesan arkais.
- source_word: אַתָּה יָדַעְתָּ
  choice: engkau sendiri tahu
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan pada subjek dan tercermin dalam kata “sendiri”.
- source_word: אֵת אֲשֶׁר עָשָׂה שָׁאוּל
  choice: apa yang telah dilakukan Saul
  rationale: Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan klausa objek Ibrani.
- source_word: הִכְרִית
  choice: telah menyingkirkan
  rationale: Dalam konteks kebijakan Saul, verba ini berarti meniadakan atau menghapuskan para pelaku dari negeri itu. “Menyingkirkan” mempertahankan kekerasan tindakan tanpa menyatakan secara tidak perlu bahwa semuanya dibunuh.
- source_word: הָאֹבוֹת
  choice: para pemanggil arwah
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada pelaku yang berkaitan dengan pemanggilan atau konsultasi arwah; pilihan ini jelas bagi pembaca modern.
- source_word: הַיִּדְּעֹנִי
  choice: peramal
  rationale: Istilah ini menunjuk kepada pihak yang mengaku memiliki pengetahuan gaib. “Peramal” merupakan padanan Indonesia yang ringkas dan mudah dipahami, tanpa citra fantasi yang tidak berasal dari teks.
- source_word: מִן הָאָרֶץ
  choice: dari negeri ini
  rationale: Yang dimaksud dalam konteks ialah wilayah kekuasaan Israel. Kata “ini” membuat acuan kontekstual tersebut alami dalam bahasa Indonesia.
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: memasang jerat bagi nyawaku
  rationale: Ungkapan ini mempertahankan metafora jerat dan menyatakan bahwa hidup perempuan itu menjadi sasaran.
- source_word: לַהֲמִיתֵנִי
  choice: untuk membunuhku
  rationale: Infinitif tujuan diterjemahkan secara langsung dan alami.
theological_decisions:
- issue: Istilah bagi praktik okultisme tanpa menentukan hakikat atau keberhasilan praktik tersebut
  choice: para pemanggil arwah dan peramal
  alternative: orang-orang yang memiliki roh perantara dan orang-orang berilmu gaib
  rationale: Terjemahan utama mengidentifikasi para pelaku menurut kegiatan atau klaim mereka, tetapi tidak menyatakan apakah roh yang mereka hubungi sungguh hadir ataupun apakah kemampuan mereka nyata. Alternatif yang lebih harfiah dicatat karena kedua istilah Ibrani memiliki sejarah penafsiran dan cakupan makna yang tidak sepenuhnya pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan “engkau” sesuai dengan dialog langsung dalam konteks Alkitab. Metafora “memasang jerat bagi nyawaku” dipertahankan karena jelas dan kuat dalam bahasa Indonesia.
