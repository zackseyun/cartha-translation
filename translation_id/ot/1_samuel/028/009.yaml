  verdict: revise
  source_fidelity: 'Teks utama pada umumnya setia pada Ibrani: respons adversatif, penegasan «engkau sendiri tahu», tindakan Saul menyingkirkan para pelaku, metafora jerat terhadap nyawa, dan tujuan membunuh tetap terjaga. Namun catatan alternatif «roh perantara» tidak tepat sebagai padanan leksikal yang jelas bagi אֹבוֹת dan berpotensi mengalihkan rujukan dari para pelaku kepada roh-roh.'
  naturalness: Bahasa teks utama baku, jelas, dan bernada naratif wajar. «Para pemanggil arwah dan peramal» dapat dipahami pembaca modern; pengulangan «para» sebelum unsur kedua membuat kedua kelompok pelaku lebih jelas.
  terminology: «Pemanggil arwah» dan «peramal» adalah padanan fungsional yang hati-hati dan tidak mengesahkan klaim praktik tersebut. Catatan alternatif sebaiknya memakai istilah tradisional yang tetap menunjuk kepada pelaku, bukan «roh perantara».
