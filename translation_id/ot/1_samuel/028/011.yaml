  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה אֶת מִ֖י אַֽעֲלֶה לָּ֑/ךְ וַ/יֹּ֕אמֶר אֶת שְׁמוּאֵ֖ל הַֽעֲלִי לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: id
  text: Lalu perempuan itu berkata, “Siapa yang akan kupanggil naik[a] untukmu?” Jawabnya, “Panggillah Samuel naik untukku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membawa naik” atau “membuat naik.” Dalam konteks pemanggilan arwah ini, kata kerja Ibrani memakai gambaran seseorang yang dipanggil untuk naik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol memajukan alur narasi; “Lalu” menyampaikan urutan secara alami dalam bahasa Indonesia.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Dalam konteks, kata ini menunjuk kepada perempuan pemanggil arwah di En-Dor; bentuk definit “itu” mengacu kepada tokoh yang telah disebutkan.
- source_word: אֶת מִי
  choice: Siapa
  rationale: אֶת menandai מִי sebagai objek langsung. Bahasa Indonesia tidak membedakan bentuk subjek dan objek pada kata tanya “siapa”.
- source_word: אַעֲלֶה
  choice: harus kupanggil naik
  rationale: Hifil dari עלה secara harfiah berarti “membuat naik/membawa naik.” Dalam konteks pemanggilan arwah, “panggil naik” mempertahankan unsur pemanggilan sekaligus gambaran arah naik dalam bahasa Ibrani; “harus” membuat pertanyaan deliberatif terdengar alami.
- source_word: לָּךְ
  choice: untukmu
  rationale: 'Preposisi ל di sini bersifat benefaktif: tindakan itu dilakukan bagi Saul.'
- source_word: וַיֹּאמֶר
  choice: Jawabnya
  rationale: Dalam pertukaran langsung ini, “Jawabnya” secara alami menyampaikan bahwa Saul menanggapi pertanyaan perempuan itu, tanpa perlu mengulang subjek.
- source_word: אֶת שְׁמוּאֵל
  choice: Samuel
  rationale: Penanda objek אֶת tidak diterjemahkan, sedangkan nama שְׁמוּאֵל ditulis dalam bentuk Indonesia yang lazim, “Samuel”.
- source_word: הַעֲלִי
  choice: Panggillah ... naik
  rationale: Imperatif hifil feminin tunggal dari עלה ditujukan kepada perempuan itu. Pilihan ini konsisten dengan verba sebelumnya dan mempertahankan gambaran “naik” dari teks sumber.
- source_word: לִי
  choice: untukku
  rationale: 'Seperti לָּךְ sebelumnya, ל dipahami secara benefaktif: Saul meminta tindakan itu dilakukan baginya.'
theological_decisions:
- issue: Ungkapan nekromantik dengan verba עלה
  choice: panggil naik
  alternative: munculkan; panggil; bawa naik
  rationale: “Panggil naik” mempertahankan gambaran arah dalam verba Ibrani dan konteks tindakan pemanggilan tanpa menjelaskan mekanisme atau hakikat peristiwa secara teologis. “Munculkan” lebih idiomatis tetapi menghilangkan gambaran “naik,” sedangkan “bawa naik” dalam bahasa Indonesia dapat memberi kesan pemindahan jasmani yang terlalu kuat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk pronominal terikat “kupanggil,” “untukmu,” dan “untukku” menjaga dialog tetap alami. Ungkapan “panggil naik” sengaja mempertahankan kejanggalan ringan dari idiom Ibrani agar gambaran dan ketegangan teologis teks tidak dihapus.
