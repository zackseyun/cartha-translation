  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֥/הּ הַ/מֶּ֛לֶךְ אַל תִּֽירְאִ֖י כִּ֣י מָ֣ה רָאִ֑ית וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל אֱלֹהִ֥ים רָאִ֖יתִי עֹלִ֥ים מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: id
  text: Raja berkata kepadanya, “Jangan takut. Apa yang kaulihat?[a]” Perempuan itu berkata kepada Saul, “Aku melihat suatu sosok ilahi[b] sedang naik dari bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “apa yang telah kaulihat?” Kata kerja Ibraninya berbentuk perfektif, meskipun dalam konteks ini dapat merujuk pada apa yang sedang dilihat saat itu.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani אֱלֹהִים berbentuk jamak dan diikuti kata “naik” dalam bentuk jamak; karena itu ungkapan ini juga dapat diterjemahkan “dewa-dewa sedang naik.” Namun, kelanjutan narasi tampaknya menggambarkan satu sosok.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Teks Ibrani memakai kata benda umum dengan kata sandang, bukan nama diri. Bentuk ini mempertahankan gaya narasi; Saul disebutkan pada klausa berikutnya.
- source_word: אַל תִּירְאִי
  choice: Jangan takut
  rationale: Ini adalah larangan langsung dengan ירא. Ungkapan ini alami dalam bahasa Indonesia modern dan dekat dengan makna Ibrani.
- source_word: כִּי מָה רָאִית
  choice: Apa yang kaulihat?
  rationale: Walaupun רָאִית secara bentuk adalah perfektif dan dapat diterjemahkan 'apa yang telah kaulihat?', konteks penglihatan yang sedang berlangsung mendukung pertanyaan langsung dalam bentuk kini. כִּי tidak diterjemahkan tersendiri agar dialog tetap alami, tanpa mengubah hubungan pragmatisnya dengan kalimat penenang sebelumnya.
- source_word: הָאִשָּׁה
  choice: Perempuan itu
  rationale: Ayat ini menyebutnya hanya sebagai 'perempuan itu'. Pilihan ini tidak memasukkan label penafsiran dari konteks yang lebih luas ke dalam ayat.
- source_word: אֱלֹהִים
  choice: suatu sosok ilahi
  rationale: Kata ini berbentuk jamak dan diikuti partisip jamak, tetapi dalam konteksnya dapat menunjuk kepada penampakan adikodrati yang kemudian diperlakukan sebagai satu sosok. 'Suatu sosok ilahi' menjaga acuan supernatural tanpa menyamakannya dengan Allah atau secara mutlak menetapkan bahwa yang terlihat adalah beberapa dewa.
- source_word: עֹלִים
  choice: sedang naik
  rationale: Partisip dari עלה menyatakan gerak ke atas yang sedang berlangsung. 'Sedang naik' alami dalam bahasa Indonesia dan mempertahankan gambaran kemunculan dari bawah.
- source_word: מִן הָאָרֶץ
  choice: dari bumi
  rationale: Pilihan ini dekat dengan ungkapan Ibrani dan mempertahankan gambaran sesuatu yang naik dari bawah; 'dari dalam tanah' juga mungkin, tetapi lebih mempersempit citranya.
theological_decisions:
- issue: Cara menerjemahkan אֱלֹהִים dalam laporan perempuan itu
  choice: suatu sosok ilahi
  alternative: dewa-dewa; Allah; makhluk adikodrati
  rationale: Ayat ini melaporkan apa yang dipersepsikan perempuan itu, bukan memberikan pernyataan doktrinal langsung dari narator. Pilihan ini mempertahankan sifat adikodrati dan ketegangan antara bentuk gramatikal jamak dengan acuan yang tampaknya tunggal dalam kelanjutan narasi, tanpa menyiratkan politeisme atau mengidentifikasi penampakan itu sebagai Allah.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Dialog dibuat langsung dan mudah dipahami. Bentuk 'kaulihat' dipakai sebagai pronomina terikat baku; 'sosok ilahi' dipilih untuk menjaga ambiguitas sumber tanpa memakai istilah denominatif atau label penafsiran.
