revisions:
- from: Namun, ketika mereka hidup dalam kerajaan mereka, menikmati kebaikan-Mu yang besar yang telah Kauberikan kepada mereka, dan tinggal di negeri yang luas dan subur[a] yang telah Kausediakan bagi mereka, mereka tidak mengabdi kepada-Mu[b] dan tidak berbalik dari perbuatan-perbuatan jahat mereka.[c]
  to: Bahkan dalam kerajaan mereka, di tengah kebaikan-Mu yang besar yang telah Kauberikan kepada mereka, dan di negeri yang luas dan subur[a] yang telah Kausediakan bagi mereka, mereka tidak melayani-Mu[b] dan tidak berbalik dari perbuatan-perbuatan jahat mereka.[c]
  rationale: Revisi menghapus perluasan berupa “hidup,” “menikmati,” dan “tinggal” agar rangkaian tiga frasa dengan בְּ tetap berfungsi sebagai keadaan yang menggarisbawahi ketidaktaatan mereka di tengah berkat Allah. “Bahkan” menyampaikan tekanan kontekstual dengan wajar. “Melayani-Mu” menggantikan “mengabdi kepada-Mu” sebagai padanan yang lebih lazim dan luas untuk עבד; catatan kaki disesuaikan agar hanya memuat alternatif. Semua jangkar catatan kaki dipertahankan dan selaras dengan teks.
