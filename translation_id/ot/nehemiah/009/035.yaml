reference: Nehemiah 9:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵ֣ם בְּ/מַלְכוּתָ/ם֩ וּ/בְ/טוּבְ/ךָ֨ הָ/רָ֜ב אֲשֶׁר נָתַ֣תָּ לָ/הֶ֗ם וּ/בְ/אֶ֨רֶץ הָ/רְחָבָ֧ה וְ/הַ/שְּׁמֵנָ֛ה אֲשֶׁר נָתַ֥תָּ לִ/פְנֵי/הֶ֖ם לֹ֣א עֲבָד֑וּ/ךָ וְֽ/לֹא שָׁ֔בוּ מִ/מַּֽעַלְלֵי/הֶ֖ם הָ/רָעִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: id
  text: Bahkan dalam kerajaan mereka, di tengah kebaikan-Mu yang besar yang telah Kauberikan kepada mereka, dan di negeri yang luas dan subur[a] yang telah Kausediakan bagi mereka, mereka tidak melayani-Mu[b] dan tidak berbalik dari perbuatan-perbuatan jahat mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang luas dan gemuk”; “gemuk” merupakan gambaran bagi tanah yang subur dan kaya hasil.
    reason: cultural_note
  - marker: b
    text: Atau “mengabdi kepada-Mu” atau “beribadah kepada-Mu”; kata Ibrani ini dapat mencakup pelayanan, ketaatan, dan ibadah.
    reason: lexical_alternative
  - marker: c
    text: Atau “tidak bertobat dari perbuatan-perbuatan jahat mereka”; secara harfiah, “tidak berbalik dari perbuatan-perbuatan jahat mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: ketika mereka hidup dalam kerajaan mereka
  rationale: מַלְכוּת dapat berarti kerajaan, pemerintahan, atau kekuasaan kerajaan. Dalam konteks ini frasa tersebut menunjuk pada keadaan mereka ketika menikmati kehidupan sebagai bangsa yang berdaulat; perluasan ringan ini membuat fungsi temporal-keadaannya alami dalam bahasa Indonesia.
- source_word: וּבְטוּבְךָ הָרָב
  choice: menikmati kebaikan-Mu yang besar
  rationale: טוּב mencakup kebaikan sekaligus kelimpahan pemberian. 'Menikmati' mengungkapkan keadaan mereka di tengah kemurahan Allah tanpa membatasi maknanya hanya pada kemakmuran materi.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: yang telah Kauberikan kepada mereka
  rationale: Bentuk lampau sempurna Indonesia menandai bahwa pemberian itu mendahului keadaan yang sedang digambarkan, sambil tetap dekat dengan makna dasar נתן.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: negeri yang luas dan subur
  rationale: רְחָבָה berarti luas atau lapang, sedangkan שְׁמֵנָה secara harfiah berarti gemuk tetapi secara idiomatis menggambarkan tanah yang subur dan kaya hasil.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: yang telah Kausediakan bagi mereka
  rationale: Ungkapan harfiah 'Kauberikan di hadapan mereka' menyatakan penyediaan atau penempatan negeri itu untuk mereka. 'Kausediakan bagi mereka' menyampaikan maksud tersebut secara wajar.
- source_word: לֹא עֲבָדוּךָ
  choice: mereka tidak mengabdi kepada-Mu
  rationale: עבד dalam hubungan dengan Allah mencakup pelayanan, ketaatan, dan ibadah. 'Mengabdi' mempertahankan cakupan yang lebih luas daripada 'beribadah' saja.
- source_word: וְלֹא שָׁבוּ
  choice: dan tidak berbalik
  rationale: שׁוב berarti berbalik atau kembali. Dengan pelengkap מן, ungkapan ini secara konkret berarti meninggalkan tindakan jahat, tanpa harus menggantinya dengan istilah teologis yang lebih interpretatif.
- source_word: מִמַּעַלְלֵיהֶם הָרָעִים
  choice: dari perbuatan-perbuatan jahat mereka
  rationale: מַעֲלָלִים menunjuk pada perbuatan, tindakan, atau praktik. Bentuk ulang 'perbuatan-perbuatan' mencerminkan bentuk jamak dan tetap wajar dalam register Alkitab Indonesia.
theological_decisions:
- issue: Makna עבד ketika objeknya adalah Allah
  choice: mengabdi kepada-Mu
  alternative: beribadah kepada-Mu; melayani-Mu
  rationale: '''Mengabdi'' mempertahankan unsur ibadah, pelayanan, dan ketaatan perjanjian tanpa mempersempitnya menjadi kegiatan ibadah ritual saja.'
- issue: Makna שׁוב מן dalam konteks moral
  choice: tidak berbalik dari perbuatan-perbuatan jahat mereka
  alternative: tidak bertobat dari perbuatan-perbuatan jahat mereka
  rationale: Terjemahan 'berbalik dari' mempertahankan gambaran konkret bahasa Ibrani dan tidak diam-diam menggantinya dengan istilah teologis yang lebih khusus.
- issue: Hubungan rangkaian frasa berpreposisi dengan ketidaktaatan Israel
  choice: ketika mereka hidup ... menikmati ... dan tinggal ... mereka tidak mengabdi
  alternative: dalam kerajaan mereka ... dan dalam kebaikan-Mu ... dan di negeri ... mereka tidak mengabdi
  rationale: Rangkaian בְ menggambarkan keadaan penuh berkat tempat ketidaktaatan itu terjadi. Susunan Indonesia dibuat alami tanpa menghilangkan kontras antara kemurahan Allah dan respons umat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Sapaan ilahi memakai huruf kapital. Kalimat mempertahankan kontras retoris antara berkat Allah yang berlimpah dan ketidaktaatan umat, sambil menghindari susunan berpreposisi yang kaku.
