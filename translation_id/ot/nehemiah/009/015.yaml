  to: Engkau memberi mereka roti dari langit ketika mereka lapar dan mengeluarkan air dari batu ketika mereka haus. Engkau menyuruh mereka masuk untuk menduduki negeri yang telah Engkau janjikan dengan sumpah untuk Kauberikan kepada mereka.[a]
  rationale: Revisi menyatakan idiom Ibrani secara wajar sebagai “menjanjikan dengan sumpah” dan memindahkan gambaran harfiahnya, “mengangkat tangan,” ke catatan kaki. Dengan demikian, makna sumpah dan tujuan pemberian negeri tetap jelas, sementara ambiguitas sintaksis dalam draf dihilangkan.
