id: NEH.9.15
reference: Nehemiah 9:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/לֶחֶם מִ/שָּׁמַ֜יִם נָתַ֤תָּה לָ/הֶם֙ לִ/רְעָבָ֔/ם וּ/מַ֗יִם מִ/סֶּ֛לַע הוֹצֵ֥אתָ לָ/הֶ֖ם לִ/צְמָאָ֑/ם וַ/תֹּ֣אמֶר לָ/הֶ֗ם לָ/בוֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר נָשָׂ֥אתָ אֶת יָדְ/ךָ֖ לָ/תֵ֥ת לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: id
  text: Engkau memberi mereka roti dari langit ketika mereka lapar dan mengeluarkan air dari batu ketika mereka haus. Engkau menyuruh mereka masuk untuk menduduki negeri yang telah Engkau janjikan dengan sumpah untuk Kauberikan kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang telah Engkau mengangkat tangan-Mu untuk memberikannya kepada mereka.” “Mengangkat tangan” merupakan ungkapan Ibrani untuk bersumpah.
    reason: Menjelaskan bentuk harfiah dan makna idiom sumpah dalam bahasa Ibrani.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: roti dari langit
  rationale: Mempertahankan gambaran konkret Ibrani tanpa menggantinya dengan referen tersiratnya, yaitu manna.
- source_word: לִרְעָבָם / לִצְמָאָם
  choice: ketika mereka lapar / ketika mereka haus
  rationale: Mengungkapkan hubungan keadaan secara alami dalam bahasa Indonesia sambil mempertahankan kesejajaran kedua frasa.
- source_word: מַיִם מִסֶּלַע
  choice: air dari batu
  rationale: Mengikuti bentuk Ibrani yang tidak memakai kata sandang pada 'batu' dan tetap jelas bagi pembaca Indonesia.
- source_word: הוֹצֵאתָ
  choice: mengeluarkan
  rationale: Mencerminkan bentuk kausatif verba Ibrani secara ringkas dan alami.
- source_word: וַתֹּאמֶר לָהֶם
  choice: Engkau menyuruh mereka
  rationale: Dalam konteks verba yang diikuti dua infinitif, 'menyuruh' menyampaikan bahwa perkataan itu mengarahkan tindakan, tanpa memperkuatnya menjadi perintah formal.
- source_word: לָבוֹא לָרֶשֶׁת
  choice: masuk untuk menduduki
  rationale: '''Masuk'' mempertahankan unsur gerak pada בוא, sedangkan ''menduduki'' menyatakan tindakan memperoleh dan menguasai negeri dalam konteks ירשׁ.'
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: dengan mengangkat tangan telah Engkau janjikan
  rationale: Mempertahankan gambaran tindakan mengangkat tangan sekaligus menyampaikan fungsi idiomatisnya sebagai sumpah atau janji yang diteguhkan.
- source_word: לָתֵת לָהֶם
  choice: akan Kauberikan kepada mereka
  rationale: Menjaga isi sumpah sebagai pemberian negeri kepada mereka dan menghasilkan susunan Indonesia yang wajar.
theological_decisions:
- issue: Ungkapan sumpah Allah mengenai pemberian negeri
  choice: Mempertahankan gambaran 'mengangkat tangan' sambil menyatakan maknanya sebagai janji
  alternative: Menerjemahkan hanya secara idiomatis sebagai 'telah bersumpah'
  rationale: Pilihan ini menjaga citra antropomorfis dan warna bahasa perjanjian dalam teks Ibrani, tetapi tetap dapat dipahami secara langsung oleh pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai 'Engkau' serta bentuk terikat 'Kau-'. Kesejajaran lapar dan haus dibuat alami tanpa menghilangkan struktur pemikiran ayat.
