base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: id
  text: Maka Engkau menyerahkan mereka ke dalam tangan lawan-lawan mereka, yang menindas mereka. Namun, pada waktu mereka mengalami kesesakan, mereka berseru kepada-Mu. Engkau mendengar dari surga dan, sesuai dengan belas kasih-Mu yang berlimpah, Engkau memberikan kepada mereka para pembebas[a] yang menyelamatkan mereka dari tangan lawan-lawan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para penyelamat.” Kata Ibrani ini berasal dari kata kerja “menyelamatkan” dan di sini menunjuk kepada orang-orang yang Allah berikan untuk membebaskan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Engkau menyerahkan mereka ke dalam tangan
  rationale: נתן dalam konteks ini berarti menyerahkan ke dalam kuasa pihak lain. Ungkapan tangan dipertahankan karena gambaran kekuasaan ini jelas dan muncul kembali pada akhir ayat.
- source_word: צָרֵיהֶם
  choice: lawan-lawan mereka
  rationale: צָר menunjuk kepada pihak yang memusuhi atau menentang. Pilihan ini membedakannya dari verba berikut yang secara khusus menyatakan penindasan.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: yang menindas mereka
  rationale: Verba ini menggambarkan tindakan menghimpit, menyusahkan, atau menekan; 'menindas' menyampaikan akibatnya secara wajar dalam konteks penaklukan.
- source_word: וּבְעֵת צָרָתָם
  choice: Namun, ketika mengalami kesesakan
  rationale: 'Ungkapan temporal diterjemahkan secara alami, sedangkan ''Namun'' menyatakan kontras dalam alur: penindasan diikuti seruan kepada Allah.'
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: mereka berseru kepada-Mu
  rationale: צעק menyatakan seruan mendesak dalam keadaan susah, bukan sekadar memanggil.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: Engkau mendengar dari surga
  rationale: Lokasi sumber tindakan dipertahankan sesuai מִן, dan bentuk lampau sesuai dengan kisah retrospektif ini.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: sesuai dengan belas kasih-Mu yang berlimpah
  rationale: רחמים menyatakan belas kasih yang besar atau melimpah. Frasa ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan kelimpahannya.
- source_word: מֹשִׁיעִים
  choice: para pembebas
  rationale: Nomina partisipial dari ישׁע di sini menunjuk kepada manusia yang Allah bangkitkan sebagai sarana pembebasan. 'Para pembebas' jelas dalam konteks sejarah ini.
- source_word: וְיוֹשִׁיעוּם
  choice: yang menyelamatkan mereka
  rationale: Klausa relatif menghubungkan tindakan tersebut secara alami dengan 'para pembebas' dan mempertahankan hubungan leksikal dengan akar ישׁע.
- source_word: מִיַּד צָרֵיהֶם
  choice: dari tangan lawan-lawan mereka
  rationale: Pengulangan ungkapan 'tangan' dan 'lawan-lawan mereka' dipertahankan agar struktur pembingkai dalam bahasa Ibrani tetap tampak.
theological_decisions:
- issue: Sebutan מֹשִׁיעִים bagi manusia yang menjadi alat pertolongan Allah
  choice: para pembebas
  alternative: para penyelamat
  rationale: Keduanya mungkin secara leksikal. 'Para pembebas' menegaskan bahwa yang dimaksud ialah agen manusia yang Allah berikan, tanpa mengaburkan fakta bahwa tindakan mereka benar-benar menyelamatkan umat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital. Idiom 'ke dalam tangan' dan 'dari tangan' dipertahankan karena dapat dipahami serta membingkai ayat. Pergeseran bentuk verba Ibrani dapat menyiratkan pola yang berulang; terjemahan tidak menambahkan 'setiap kali' agar nuansa aspek itu tidak ditentukan secara berlebihan.
