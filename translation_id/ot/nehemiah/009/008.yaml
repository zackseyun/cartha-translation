    rationale: Dalam bahasa Indonesia modern, “benar” lazimnya mengacu pada kebenaran suatu pernyataan. צַדִּיק, yang menerangkan Allah sebagai dasar Ia meneguhkan firman-Nya, lebih jelas diterjemahkan “adil”; nuansa “benar/righteous” dapat dicatat sebagai alternatif.
