  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: id
  text: Engkau mendapati hatinya setia di hadapan-Mu dan mengikat perjanjian dengannya untuk memberikan kepada keturunannya negeri orang Kanaan, orang Het, orang Amori, orang Feris, orang Yebus, dan orang Girgasi[a]. Engkau telah menepati firman-Mu[b], sebab Engkau adil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada benihnya”; kata Ibrani ini berbentuk tunggal tetapi dapat menunjuk secara kolektif kepada keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau telah meneguhkan firman-Mu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “sebab Engkau benar.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָצָאתָ
  choice: Engkau mendapati
  rationale: Bentuk Qal dari מצא pada dasarnya berarti ‘menemukan/mendapati’. ‘Mendapati’ alami dalam konteks Allah mengenali keadaan batin Abraham dan tidak menyiratkan bahwa hal itu sebelumnya tidak diketahui-Nya.
- source_word: לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: hatinya setia di hadapan-Mu
  rationale: ‘Hati’ mempertahankan gambaran Ibrani tentang batin, kehendak, dan watak; נֶאֱמָן menyatakan keadaan yang dapat dipercaya atau setia; ‘di hadapan-Mu’ mempertahankan ungkapan relasional dan evaluatif לְפָנֶיךָ.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: dan mengikat perjanjian dengannya
  rationale: כרת ברית secara harfiah adalah ‘memotong perjanjian’, tetapi idiom Indonesia yang wajar dan sepadan ialah ‘mengikat perjanjian’.
- source_word: לָתֵת אֶת אֶרֶץ
  choice: untuk memberikan negeri
  rationale: Infinitif לָתֵת menyatakan isi atau tujuan perjanjian. ‘Negeri’ lebih alami daripada ‘tanah’ untuk wilayah yang dijanjikan.
- source_word: הַכְּנַעֲנִי הַחִתִּי הָאֱמֹרִי וְהַפְּרִזִּי וְהַיְבוּסִי וְהַגִּרְגָּשִׁי
  choice: orang Kanaan, orang Het, orang Amori, orang Feris, orang Yebus, dan orang Girgasi
  rationale: Bentuk-bentuk tunggal gentilik Ibrani berfungsi secara kolektif. Nama-nama baku Indonesia dipakai dengan ‘orang’ agar daftar kelompok bangsa terbaca alami.
- source_word: לְזַרְעוֹ
  choice: kepada keturunannya
  rationale: זֶרַע adalah nomina kolektif ‘benih/keturunan’. ‘Keturunannya’ menyampaikan makna kolektif dengan jelas dalam bahasa Indonesia modern.
- source_word: וַתָּקֶם אֶת דְּבָרֶיךָ
  choice: Engkau telah menepati segala firman-Mu
  rationale: קום dengan objek ‘perkataan-perkataan’ di sini menunjuk pada membuatnya tegak atau terlaksana. ‘Menepati’ menyampaikan penggenapan komitmen, sedangkan ‘segala firman-Mu’ mempertahankan bentuk jamak secara alami.
- source_word: כִּי צַדִּיק אָתָּה
  choice: sebab Engkau benar
  rationale: כִּי bersifat menjelaskan alasan. צַדִּיק mencakup kelurusan moral dan kesetiaan pada apa yang benar; ‘benar’ menjaga keluasan itu, sementara ‘adil’ tetap dicatat sebagai alternatif.
theological_decisions:
- issue: Makna צַדִּיק ketika dikenakan kepada Allah
  choice: benar
  alternative: adil
  rationale: Kedua padanan dimungkinkan. ‘Benar’ mencakup kelurusan moral dan kesetiaan perjanjian secara lebih luas; ‘adil’ dapat terdengar terutama yudisial. Alternatif dicatat agar nuansa keadilan tidak hilang.
- issue: Hubungan tindakan Allah dengan firman perjanjian-Nya
  choice: menepati segala firman-Mu
  alternative: meneguhkan segala firman-Mu
  rationale: Konteks pujian menekankan bahwa Allah mewujudkan apa yang telah difirmankan. ‘Menepati’ menyatakan realisasi itu tanpa mengubah ‘firman’ menjadi ‘janji’, sedangkan alternatif mempertahankan nuansa dasar קום, yaitu membuat tegak atau menetapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai ‘Engkau’ dengan kapitalisasi pronomina ilahi. Struktur daftar bangsa dipertahankan, sedangkan idiom Ibrani dialihkan ke ungkapan Indonesia yang alami tanpa menghilangkan ambiguitas penting.
