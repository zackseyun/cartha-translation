  naturalness: Bahasanya baku, jelas, dan bernada khidmat. “Mengikat perjanjian” serta “di hadapan-Mu” terdengar alami. Susunan kalimat direvisi sedikit agar tujuan pemberian tanah kepada keturunan Abraham lebih langsung terbaca.
  terminology: Nama bangsa dan istilah “perjanjian,” “keturunan,” serta “firman” dipertahankan. Untuk צַדִּיק, “adil” merupakan padanan Indonesia yang paling jelas dan tidak mempersempitnya menjadi sekadar kebenaran proposisional; alternatif “benar” dicatat dalam catatan kaki.
