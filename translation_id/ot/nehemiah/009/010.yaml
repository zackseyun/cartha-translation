id: NEH.9.10
reference: Nehemiah 9:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: id
  text: Engkau melakukan tanda-tanda dan mukjizat-mukjizat terhadap Firaun, terhadap semua pegawainya, dan terhadap seluruh rakyat negerinya, sebab Engkau tahu bahwa mereka bertindak angkuh terhadap mereka[a]. Demikianlah Engkau membuat nama bagi diri-Mu, seperti pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "bertindak lancang" atau "bertindak gegabah karena keangkuhan." Kata ganti "mereka" yang kedua tidak disebutkan lebih lanjut dalam bahasa Ibrani; dalam konteksnya kemungkinan besar menunjuk kepada Israel.
    reason: Mencatat rentang makna הֵזִידוּ dan menjelaskan tanpa menghapus ambiguitas referen עֲלֵיהֶם dalam teks utama.
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Engkau mengadakan
  rationale: Secara harfiah berarti 'memberikan', tetapi bersama 'tanda-tanda dan mukjizat-mukjizat' verba ini menyatakan bahwa Allah melakukan atau mendatangkan semuanya; 'mengadakan' alami dalam bahasa Indonesia dan tetap dekat dengan konstruksi sumber.
- source_word: אֹתֹת וּמֹפְתִים
  choice: tanda-tanda dan mukjizat-mukjizat
  rationale: Mempertahankan pasangan istilah yang menunjuk pada tindakan ilahi sebagai tanda yang bermakna sekaligus perbuatan luar biasa.
- source_word: בְּפַרְעֹה
  choice: terhadap Firaun
  rationale: Preposisi ב di sini menandai sasaran tindakan penghakiman. 'Terhadap' menyampaikan hubungan adversatif tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: וּבְכָל עֲבָדָיו
  choice: terhadap semua pegawainya
  rationale: Dalam lingkungan kerajaan, עֲבָדִים dapat menunjuk para pelayan atau pejabat raja. 'Pegawai' cukup luas dan lebih alami daripada 'hamba-hamba' untuk rombongan Firaun dalam konteks ini.
- source_word: וּבְכָל עַם אַרְצוֹ
  choice: terhadap seluruh rakyat negerinya
  rationale: Menyampaikan עַם sebagai rakyat dan אֶרֶץ sebagai negeri, sambil mempertahankan hubungan kepunyaan dengan Firaun.
- source_word: כִּי יָדַעְתָּ
  choice: sebab Engkau tahu
  rationale: כִּי memperkenalkan alasan, dan bentuk perfektif יָדַעְתָּ dapat diterjemahkan secara wajar sebagai pengetahuan Allah yang sudah nyata dalam peristiwa tersebut.
- source_word: הֵזִידוּ
  choice: berlaku angkuh
  rationale: Bentuk Hifil dari זוד menyatakan tindakan yang sombong, lancang, atau gegabah karena keangkuhan. 'Berlaku angkuh' jelas, bermartabat, dan mempertahankan penilaian moral teks.
- source_word: עֲלֵיהֶם
  choice: terhadap umat-Mu
  rationale: Acuan pronomina jamak paling wajar dalam konteks keluaran ialah bangsa Israel. Karena pronomina Indonesia 'mereka' akan sangat mudah disalahpahami sebagai merujuk kepada orang Mesir, acuannya dibuat eksplisit demi kejelasan.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: Engkau membuat nama-Mu termasyhur
  rationale: Ungkapan Ibrani berarti memperoleh atau menegakkan kemasyhuran. Pilihan ini mempertahankan unsur 'nama' tanpa kesan modern yang kurang pantas dari idiom 'membuat nama bagi diri sendiri'.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: seperti sampai hari ini
  rationale: Ungkapan waktu ini menegaskan bahwa kemasyhuran tersebut masih bertahan hingga masa pembicara.
theological_decisions:
- issue: Acuan עֲלֵיהֶם ('terhadap mereka')
  choice: Dinyatakan sebagai 'terhadap umat-Mu', yakni Israel.
  alternative: Mempertahankan 'terhadap mereka' dan membiarkan acuan tersirat; atau memahami keangkuhan itu terutama sebagai tindakan melawan Allah.
  rationale: Dalam kisah keluaran yang sedang dikenang, Firaun, para pegawainya, dan rakyat Mesir bertindak angkuh terhadap bangsa Israel. Eksplisitasi diperlukan dalam bahasa Indonesia karena dua kelompok jamak muncul berdekatan dan bentuk 'mereka ... terhadap mereka' akan membingungkan; ini menjelaskan acuan, bukan menambahkan ajaran tertentu.
- issue: Makna membuat nama bagi diri Allah
  choice: Diterjemahkan 'membuat nama-Mu termasyhur'.
  alternative: Terjemahan lebih harfiah 'membuat nama bagi diri-Mu'.
  rationale: Ungkapan tersebut berbicara tentang kemasyhuran Allah yang timbul dari tindakan-Nya dalam keluaran, bukan tentang pemberian nama diri baru. Terjemahan idiomatis menjaga maksud teologis tanpa memperluasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina untuk Allah mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Pengulangan 'terhadap' mempertahankan susunan retoris ayat, sedangkan 'umat-Mu' dipakai untuk mencegah ambiguitas pronomina yang tidak alami dalam bahasa sasaran.
