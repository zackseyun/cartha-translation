source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ הַ/לְוִיִּ֡ם יֵשׁ֣וּעַ וְ֠/קַדְמִיאֵל בָּנִ֨י חֲשַׁבְנְיָ֜ה שֵׁרֵֽבְיָ֤ה הֽוֹדִיָּה֙ שְׁבַנְיָ֣ה פְתַֽחְיָ֔ה ק֗וּמוּ בָּרֲכוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם מִן הָ/עוֹלָ֖ם עַד הָ/עוֹלָ֑ם וִ/יבָֽרְכוּ֙ שֵׁ֣ם כְּבוֹדֶ֔/ךָ וּ/מְרוֹמַ֥ם עַל כָּל בְּרָכָ֖ה וּ/תְהִלָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: id
  text: Lalu orang-orang Lewi—Yesua, Kadmiel, Bani, Hasabneya, Serebya, Hodia, Sebanya, dan Petahya—berkata, “Berdirilah dan pujilah Yahweh, Allahmu, dari kekal sampai kekal! Kiranya mereka memuji nama-Mu yang mulia[a], yang ditinggikan melampaui segala berkat dan pujian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nama kemuliaan-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “Kiranya mereka memuji,” dengan verba orang ketiga jamak bernuansa permohonan dan subjek yang tidak disebutkan. Sebagian terjemahan mengungkapkannya sebagai “Terpujilah nama-Mu yang mulia.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ הַלְוִיִּם
  choice: Lalu orang-orang Lewi ... berkata
  rationale: Waw-konsekutif melanjutkan alur dengan wajar; bentuk jamak dan penanda definit dipadankan secara alami dalam bahasa Indonesia.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: Yesua, Kadmiel, Bani, Hasabneya, Serebya, Hodia, Sebanya, dan Petahya
  rationale: Nama-nama ditransliterasikan ke bentuk yang wajar bagi pembaca Indonesia sambil mengikuti konsonan Ibrani.
- source_word: קוּמוּ
  choice: Berdirilah
  rationale: Imperatif jamak ini memanggil umat yang berkumpul untuk berdiri; bahasa Indonesia tidak perlu menandai jumlah pada imperatif.
- source_word: בָּרֲכוּ
  choice: pujilah
  rationale: Ketika ברך diarahkan kepada Allah, 'pujilah' menyampaikan fungsi idiomatisnya dengan alami dan menghindari kesan bahwa manusia memberikan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Akhiran orang kedua jamak ditujukan secara kolektif kepada umat; bentuk '-mu' alami dalam seruan ibadah Indonesia walaupun tidak membedakan tunggal dan jamak.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: dari selama-lamanya sampai selama-lamanya
  rationale: Mempertahankan bentuk rentang idiom Ibrani dan menyatakan kekekalan tanpa membatasinya menjadi zaman-zaman tertentu.
- source_word: וִיבָרְכוּ
  choice: Biarlah mereka memuji
  rationale: Bentuk verba adalah orang ketiga jamak dengan daya volitif. Terjemahan ini mempertahankan peralihan dari imperatif orang kedua kepada subjek orang ketiga yang tidak disebutkan, meskipun peralihannya terasa mendadak.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: nama-Mu yang mulia
  rationale: Ungkapan konstruksi harfiah 'nama kemuliaan-Mu' disampaikan secara alami sebagai nama yang bercirikan kemuliaan; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּמְרוֹמַם עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: yang ditinggikan melampaui segala ucapan berkat dan pujian
  rationale: '''Melampaui'' menyampaikan keunggulan nama Allah atas semua yang dapat diucapkan manusia; ''ucapan berkat'' menjernihkan arti בְּרָכָה dalam konteks pujian kepada Allah.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama ilahi secara langsung. Transliterasi mempertahankan perbedaan antara nama perjanjian ini dan gelar אֲדֹנָי.
- issue: Subjek וִיבָרְכוּ dan peralihan sapaan
  choice: Biarlah mereka memuji
  alternative: Terpujilah
  rationale: Teks Masoret memuat verba orang ketiga jamak, bukan bentuk tunggal yang berarti 'terpujilah'. Subjek yang tidak dinyatakan dan peralihan mendadak dipertahankan agar ketegangan gramatikal tidak diselesaikan secara diam-diam.
- issue: Makna ברך ketika Allah menjadi objek
  choice: memuji
  alternative: memberkati
  rationale: Dalam konteks manusia berbicara kepada atau tentang Allah, verba ini menyatakan pujian atau pengagungan. Pilihan ini alami dalam bahasa Indonesia tanpa menyiratkan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa ibadah yang modern dan khidmat. Bentuk nama mengikuti kebiasaan transliterasi Indonesia. Sapaan kepada umat lalu kepada Allah dipertahankan, demikian juga peralihan gramatikal yang mendadak pada klausa terakhir.
