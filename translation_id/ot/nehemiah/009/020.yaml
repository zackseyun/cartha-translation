base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: id
  text: Engkau memberikan Roh-Mu yang baik untuk mengajar mereka[a]. Engkau tidak menahan manna-Mu dari mulut mereka, dan Engkau memberikan air kepada mereka bagi dahaga mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh-Mu yang baik.” Kata Ibrani רוּחַ dapat diterjemahkan dengan kedua cara tersebut; di sini kemungkinan besar yang dimaksud ialah Roh Allah yang diberikan untuk membimbing dan mengajar Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: Roh-Mu yang baik
  rationale: רוּחַ dapat berarti roh, angin, atau napas. Dalam konteks bimbingan dan pengajaran ilahi, frasa ini paling mungkin menunjuk kepada Roh Allah. Huruf kapital menandai pembacaan tersebut, sedangkan kemungkinan 'roh-Mu yang baik' dipertahankan dalam catatan kaki.
- source_word: לְהַשְׂכִּילָם
  choice: untuk mengajar mereka
  rationale: Bentuk Hifil dari שׂכל menyatakan tindakan membuat seseorang memahami, memberi pengertian, atau mengajar. 'Mengajar mereka' alami dalam bahasa Indonesia dan mempertahankan makna kausatif dalam konteks ini.
- source_word: מַנְךָ
  choice: manna-Mu
  rationale: Nomina ini menunjuk secara khusus kepada persediaan makanan di padang gurun yang dikenal sebagai manna; istilah baku tersebut dipertahankan.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: tidak menahan ... dari mulut mereka
  rationale: מנע berarti 'menahan' atau 'tidak memberikan'. Ungkapan konkret 'dari mulut mereka' dipertahankan agar gambaran Ibrani tidak dihilangkan.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung dan alami dalam bahasa Indonesia.
- source_word: לִצְמָאָם
  choice: untuk menghilangkan dahaga mereka
  rationale: Secara harfiah berarti 'untuk/bagi dahaga mereka'. Rumusan ini menyampaikan bahwa air diberikan guna memenuhi kebutuhan mereka dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah רוּחֲךָ הַטּוֹבָה merujuk kepada Roh Allah atau dapat dibaca sebagai 'roh-Mu yang baik'
  choice: Roh-Mu yang baik
  alternative: roh-Mu yang baik
  rationale: Konteksnya menggambarkan kehadiran ilahi yang diberikan untuk mengajar Israel, sehingga rujukan kepada Roh Allah paling mungkin. Karena aksara Ibrani tidak memiliki pembedaan huruf kapital dan רוּחַ tetap memiliki rentang makna, alternatifnya dicatat tanpa menghapus ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur paralel ayat dipertahankan, termasuk gambaran konkret 'dari mulut mereka'.
