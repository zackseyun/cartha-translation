  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: id
  text: Hasil bumi negeri itu yang berlimpah[a] jatuh ke tangan raja-raja yang Engkau tetapkan atas kami karena dosa-dosa kami. Mereka berkuasa atas tubuh kami[b] dan atas ternak kami sesuka hati, dan kami berada dalam kesesakan besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasil panennya”; dalam bahasa Ibrani, akhiran -nya merujuk pada negeri yang disebut dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “diri kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ
  choice: Hasilnya
  rationale: תְּבוּאָה menunjuk pada hasil bumi atau panen. Akhiran feminin tunggal merujuk pada negeri yang disebut dalam ayat sebelumnya; bentuk “hasilnya” mempertahankan rujukan itu secara alami.
- source_word: מַרְבָּה
  choice: yang berlimpah
  rationale: Bentuk ini menyatakan kelimpahan atau pertambahan hasil; “yang berlimpah” jelas dan wajar dalam bahasa Indonesia.
- source_word: לַמְּלָכִים
  choice: jatuh ke tangan raja-raja
  rationale: Preposisi ל menunjukkan bahwa hasil negeri itu menjadi bagian atau keuntungan para raja. Ungkapan ini secara alami menyampaikan penguasaan mereka atas hasil tersebut tanpa menambahkan gagasan bahwa mereka pemiliknya secara sah.
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: yang Engkau tetapkan atas kami
  rationale: נתן dengan עַל dalam konteks ini menyatakan penempatan atau penetapan penguasa atas suatu kelompok, sekaligus mempertahankan tindakan Allah secara langsung.
- source_word: בְּחַטֹּאותֵינוּ
  choice: karena dosa-dosa kami
  rationale: Preposisi ב bersifat kausal dalam konteks ini dan menyatakan bahwa dosa umat menjadi alasan penaklukan mereka.
- source_word: גְּוִיֹּתֵינוּ
  choice: tubuh kami
  rationale: גְּוִיָּה di sini menunjuk pada tubuh atau diri jasmani orang-orang yang dikuasai, bukan pada mayat.
- source_word: מֹשְׁלִים
  choice: Mereka berkuasa
  rationale: Partisipel ini menggambarkan kekuasaan yang sedang berlangsung. “Berkuasa” cocok dengan objek berupa tubuh dan ternak serta dengan konteks penindasan.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: dan ternak kami
  rationale: בְּהֵמָה secara kolektif menunjuk pada hewan peliharaan; “ternak” merupakan padanan modern yang luas dan tepat.
- source_word: כִּרְצוֹנָם
  choice: sesuka hati
  rationale: Ungkapan ini berarti bertindak menurut kehendak mereka sendiri dan menyoroti kebebasan para penguasa menggunakan kuasa secara sewenang-wenang.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: dan kami berada dalam kesesakan yang besar
  rationale: צָרָה menyatakan kesusahan atau kesesakan berat. Susunan ini mempertahankan bobot ratapan bersama dan tetap mudah dipahami.
theological_decisions:
- issue: Tindakan Allah dalam penaklukan oleh raja-raja asing
  choice: Ayat ini menyatakan bahwa Allah menetapkan raja-raja itu atas umat karena dosa-dosa mereka.
  alternative: Allah hanya mengizinkan mereka berkuasa, atau Allah menyetujui semua tindakan para raja tersebut.
  rationale: Frasa נָתַתָּה עָלֵינוּ secara langsung menghubungkan ketundukan umat dengan tindakan penghakiman Allah. Terjemahan mempertahankan tindakan ilahi itu tanpa menyiratkan bahwa Allah membenarkan segala bentuk penindasan para raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai “Engkau”. Ungkapan “jatuh ke tangan” dipakai untuk menyampaikan bahwa hasil negeri dinikmati atau dikuasai para raja, sedangkan “kesesakan yang besar” mempertahankan nada ratapan yang kuat.
