source:
  edition: WLC
  text: וַ/תִּתֵּ֨ן לָ/הֶ֤ם מַמְלָכוֹת֙ וַ/עֲמָמִ֔ים וַֽ/תַּחְלְקֵ֖/ם לְ/פֵאָ֑ה וַ/יִּֽירְשׁ֞וּ אֶת אֶ֣רֶץ סִיח֗וֹן וְ/אֶת אֶ֨רֶץ֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן וְ/אֶת אֶ֖רֶץ ע֥וֹג מֶֽלֶךְ הַ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/022.yaml
  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: id
  text: Engkau memberikan kepada mereka kerajaan-kerajaan dan bangsa-bangsa, lalu membagi-bagikannya menurut wilayah.[a] Mereka pun mengambil alih tanah Sihon, yakni tanah milik raja Hesybon,[b] dan tanah Og, raja Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “membagi-bagikannya menurut penjuru”; ungkapan Ibrani ini dapat merujuk pada pembagian menurut daerah atau kawasan.'
    reason: Menjelaskan metafora geografis פֵאָה dan mempertahankan transparansi terhadap bentuk teks sumber.
  - marker: b
    text: 'Atau: “tanah Sihon dan tanah raja Hesybon”.'
    reason: Waw Ibrani dapat diterjemahkan sebagai penghubung “dan” atau dipahami sebagai penjelas identitas Sihon.
lexical_decisions:
- source_word: מַמְלָכוֹת וַעֲמָמִים
  choice: kerajaan-kerajaan dan bangsa-bangsa
  rationale: Mempertahankan dua nomina jamak Ibrani secara langsung dan alami dalam bahasa Indonesia.
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: lalu membagi-bagikannya menurut wilayah
  rationale: Kata פֵאָה secara harfiah berarti 'sudut/penjuru', tetapi dalam konteks pembagian wilayah dapat menunjuk kawasan atau bagian daerah. Akhiran objek jamak pada verba dipertahankan melalui '-nya', yang merujuk kepada kerajaan-kerajaan dan bangsa-bangsa.
- source_word: וַיִּירְשׁוּ
  choice: Mereka pun menduduki
  rationale: Dalam konteks tanah, ירשׁ berarti mengambil alih dan memiliki; 'menduduki' menyampaikan tindakan memperoleh penguasaan tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: חֶשְׁבּוֹן
  choice: Hesybon
  rationale: Transliterasi Indonesia yang mencerminkan konsonan Ibrani dan bentuk nama yang lazim dalam tradisi Alkitab Indonesia.
- source_word: הַבָּשָׁן
  choice: Basan
  rationale: Menggunakan bentuk nama tempat yang mapan dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara 'tanah Sihon' dan 'tanah raja Hesybon'
  choice: yaitu tanah raja Hesybon
  alternative: dan tanah raja Hesybon
  rationale: Sihon dikenal sebagai raja Hesybon, sehingga waw dapat dipahami secara penjelas/apposisional. Catatan kaki mempertahankan kemungkinan pembacaan koordinatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Bentuk ulang pada 'kerajaan-kerajaan', 'bangsa-bangsa', dan 'membagi-bagikan' mempertahankan unsur jamak serta tindakan pembagian. Kedua penanda catatan kaki muncul dalam teks utama.
