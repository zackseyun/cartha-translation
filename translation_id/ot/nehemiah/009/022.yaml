  source_fidelity: Terjemahan secara umum setia pada teks Ibrani. Namun וַיִּירְשׁוּ terutama menyatakan memperoleh/mengambil milik atau menguasai, sehingga “mengambil alih” lebih tepat dan kurang bernuansa okupasi modern daripada “menduduki”. Hubungan frasa “tanah Sihon” dan “tanah raja Hesybon” memang dapat dipahami secara eksplanatoris, tetapi teks Ibrani tetap memakai waw; catatan kaki perlu mempertahankan kemungkinan koordinatif itu.
  naturalness: Bahasa draf jelas dan berregister khidmat. “Mengambil alih” lebih alami serta netral dalam konteks perolehan penguasaan atas tanah. “Yakni tanah milik raja Hesybon” memperjelas konstruksi genitif tanpa mengubah pembacaan eksplanatoris.
  terminology: “Kerajaan-kerajaan”, “bangsa-bangsa”, “Hesybon”, dan “Basan” sesuai penggunaan Indonesia modern dan nama-nama Alkitab yang mapan. “Menurut wilayah” adalah penghalusan yang dapat diterima untuk לְפֵאָה, asalkan catatan kaki terus menyatakan bentuk harfiahnya dan ketidakpastian cakupannya.
