id: NEH.9.33
reference: Nehemiah 9:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֣ה צַדִּ֔יק עַ֖ל כָּל הַ/בָּ֣א עָלֵ֑י/נוּ כִּֽי אֱמֶ֥ת עָשִׂ֖יתָ וַ/אֲנַ֥חְנוּ הִרְשָֽׁעְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: id
  text: Namun, Engkau benar dalam segala sesuatu yang telah menimpa kami, sebab Engkau telah bertindak dengan setia, sedangkan kami telah bertindak fasik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Namun, Engkau
  rationale: Konjungsi dan pronomina ini menandai kontras antara kebenaran Allah dan kesalahan umat; “Namun” menyatakan daya adversatifnya secara wajar.
- source_word: צַדִּיק
  choice: benar
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa Allah benar secara moral dalam hubungannya dengan segala yang menimpa umat. “Benar” alami dalam bahasa Indonesia dan tetap memuat gagasan keadilan tanpa mempersempitnya.
- source_word: עַל כָּל הַ/בָּא עָלֵי/נוּ
  choice: dalam segala sesuatu yang telah menimpa kami
  rationale: Ungkapan ini menyatakan hal atau ranah yang berkenaan dengannya Allah diakui benar; terjemahan ini dekat dengan bentuk Ibrani sekaligus idiomatis.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi pengakuan sebelumnya, yaitu kesetiaan tindakan Allah yang dikontraskan dengan kefasikan umat.
- source_word: אֱמֶת עָשִׂיתָ
  choice: Engkau telah bertindak dengan setia
  rationale: Secara harfiah ungkapan ini berarti “Engkau telah melakukan kebenaran,” tetapi kolokasi tersebut menyatakan tindakan yang benar, dapat dipercaya, dan setia. Bentuk ini alami dan mempertahankan nuansa kesetiaan.
- source_word: וַ/אֲנַחְנוּ
  choice: sedangkan kami
  rationale: Konjungsi ini bersifat kontras, menempatkan kelakuan umat berlawanan dengan tindakan Allah.
- source_word: הִרְשָׁעְנוּ
  choice: telah bertindak fasik
  rationale: Bentuk Hifil menyatakan berbuat fasik atau bertindak dengan jahat; pilihan ini mempertahankan daya verbalnya dan sejajar dengan “telah bertindak dengan setia.”
theological_decisions:
- issue: Karakter Allah sehubungan dengan malapetaka yang menimpa Israel
  choice: Allah diakui benar dalam segala sesuatu yang telah menimpa umat.
  alternative: Allah adil dalam menghukum kami.
  rationale: Teks menegaskan kebenaran Allah sehubungan dengan pengalaman umat, tetapi tidak secara eksplisit merumuskan setiap peristiwa sebagai penghukuman. Terjemahan mempertahankan pengakuan dan ketegangan teologis itu tanpa menambahkan mekanisme yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Paralel kontras antara tindakan Allah dan umat dipertahankan.
