revisions:
- from: Lalu anak-anak itu datang dan menduduki negeri tersebut.[a] Engkau menundukkan penduduk negeri itu, yaitu orang-orang Kanaan, di hadapan mereka dan menyerahkan orang-orang Kanaan ke dalam tangan mereka,[b] beserta raja-raja mereka dan bangsa-bangsa di negeri itu, sehingga anak-anak itu dapat memperlakukan mereka sesuka hati.[c]
  to: Lalu anak-anak itu masuk dan mengambil alih tanah itu.[a] Engkau menundukkan di hadapan mereka penduduk tanah itu, yaitu orang-orang Kanaan, lalu menyerahkan mereka, raja-raja mereka, dan bangsa-bangsa di tanah itu ke dalam tangan anak-anak itu,[b] untuk memperlakukan mereka sesuai kehendak mereka.[c]
  rationale: Revisi mempertahankan istilah kekeluargaan dan bahasa penaklukan dari teks sumber, tetapi memilih “mengambil alih tanah” untuk menghindari konotasi sementara pada “menduduki.” Objek-objek penyerahan disusun secara eksplisit sesuai koordinasi Ibrani. Klausa terakhir diubah dari hasil/kemampuan menjadi tujuan atau keleluasaan bertindak, tanpa melunakkan kekuatan teks.
