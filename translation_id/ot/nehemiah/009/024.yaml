source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: id
  text: Lalu anak-anak itu masuk dan mengambil alih tanah itu.[a] Engkau menundukkan di hadapan mereka penduduk tanah itu, yaitu orang-orang Kanaan, lalu menyerahkan mereka, raja-raja mereka, dan bangsa-bangsa di tanah itu ke dalam tangan anak-anak itu,[b] untuk memperlakukan mereka sesuai kehendak mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak itu”; maksudnya keturunan Israel. Kata yang diterjemahkan “mengambil alih” juga dapat berarti “memiliki” atau “mewarisi”.
    reason: Menjelaskan bahasa kekeluargaan dan rentang makna ירשׁ dalam konteks penguasaan tanah.
  - marker: b
    text: Ungkapan “ke dalam tangan anak-anak itu” berarti “ke dalam kekuasaan mereka”.
    reason: Menjelaskan idiom Ibrani sambil mempertahankan citranya dalam teks utama.
  - marker: c
    text: Atau, “untuk bertindak terhadap mereka menurut kehendak mereka”.
    reason: Menjelaskan alternatif yang dekat dengan susunan dan makna ungkapan Ibrani.
lexical_decisions:
- source_word: הַבָּנִים
  choice: anak-anak itu
  rationale: Secara harfiah berarti “anak-anak” dan dalam konteks menunjuk kepada keturunan Israel yang memasuki Kanaan. Bentuk ini mempertahankan bahasa kekeluargaan teks Ibrani tanpa langsung menggantinya dengan sebutan etnis.
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: menduduki negeri tersebut
  rationale: Dalam konteks tanah, ירשׁ berarti memperoleh atau mengambil tanah sebagai milik. “Menduduki” menyampaikan tindakan mengambil alih negeri dengan jelas dalam bahasa Indonesia modern.
- source_word: וַתַּכְנַע
  choice: Engkau menundukkan
  rationale: Kata כנע di sini menggambarkan tindakan Allah membuat penduduk Kanaan takluk di hadapan Israel; “menundukkan” mempertahankan kekuatan bahasa militer-politisnya.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: penduduk negeri itu, yaitu orang-orang Kanaan
  rationale: Terjemahan ini mempertahankan sebutan penduduk negeri dan menjelaskan bahwa mereka adalah orang Kanaan, sesuai hubungan aposisional dalam bahasa Ibrani.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: menyerahkan orang-orang Kanaan ke dalam tangan mereka
  rationale: Ungkapan “ke dalam tangan” mempertahankan citra idiom Ibrani tentang penyerahan ke bawah kuasa pihak lain. Objek diulangi agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: מַלְכֵיהֶם וְאֶת עַמְמֵי הָאָרֶץ
  choice: raja-raja mereka dan bangsa-bangsa di negeri itu
  rationale: Bentuk jamak עַמְמֵי dipertahankan sebagai “bangsa-bangsa”, sedangkan akhiran pada “raja-raja mereka” secara alami merujuk kepada orang-orang Kanaan atau penduduk negeri itu.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: sehingga anak-anak itu dapat memperlakukan mereka sesuka hati
  rationale: Ungkapan ini menyampaikan bahwa pihak Israel diberi keleluasaan bertindak terhadap pihak yang ditaklukkan. Subjek disebut kembali untuk menghindari kerancuan pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan “anak-anak itu”
  choice: Keturunan Israel yang memasuki dan menduduki Kanaan
  alternative: Menerjemahkannya secara interpretatif sebagai “orang Israel”
  rationale: Bahasa Ibrani memakai istilah kekeluargaan yang meneruskan hubungan naratif dengan para leluhur. Terjemahan mempertahankan istilah itu, sedangkan catatan kaki menjelaskan rujukannya.
- issue: Kekuatan bahasa penaklukan
  choice: Mempertahankan tindakan Allah yang menundukkan dan menyerahkan penduduk Kanaan ke dalam tangan Israel
  alternative: Melunakkannya menjadi ungkapan seperti “memungkinkan mereka mengalahkan”
  rationale: Teks secara langsung menghubungkan keberhasilan penaklukan dengan tindakan Allah. Kekuatan pernyataan tersebut tidak dikurangi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara istilah kekeluargaan, bahasa penaklukan, serta idiom “ke dalam tangan” dipertahankan sejauh tetap wajar dalam bahasa Indonesia.
