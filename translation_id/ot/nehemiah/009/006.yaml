  to: Engkau sajalah Yahweh. Engkau telah menjadikan langit, bahkan langit yang tertinggi[a], beserta seluruh bala tentaranya; bumi beserta segala yang ada di atasnya; dan laut beserta segala yang ada di dalamnya. Engkau menjaga semuanya tetap hidup[b], dan bala tentara langit sujud menyembah kepada-Mu[c].
