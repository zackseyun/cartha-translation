  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: id
  text: Engkau sajalah Yahweh. Engkau telah menjadikan langit, bahkan langit yang tertinggi[a], beserta seluruh bala tentaranya; bumi beserta segala yang ada di atasnya; dan laut beserta segala yang ada di dalamnya. Engkau menjaga semuanya tetap hidup[b], dan bala tentara langit sujud menyembah kepada-Mu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “langit segala langit,” ungkapan yang berarti langit yang tertinggi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Engkau memberi hidup kepada semuanya.”'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “bala tentara surgawi sujud menyembah kepada-Mu.” Istilah Ibrani dapat merujuk pada benda-benda langit dan/atau makhluk-makhluk surgawi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתָּה הוּא יְהוָה לְבַדֶּךָ
  choice: Engkau sajalah Yahweh
  rationale: Susunan pronomina yang tegas dan לְבַדֶּךָ menyatakan eksklusivitas. “Engkau sajalah” terdengar alami dan tetap mempertahankan penekanan Ibrani, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
- source_word: עָשִׂיתָ
  choice: telah menjadikan
  rationale: Kata עשה berarti membuat atau menjadikan. “Menjadikan” sesuai dengan konteks pembentukan seluruh kosmos tanpa menggantinya dengan verba yang lebih khusus.
- source_word: הַשָּׁמַיִם שְׁמֵי הַשָּׁמַיִם
  choice: langit, bahkan langit yang tertinggi
  rationale: Ungkapan harfiah “langit segala langit” berfungsi sebagai ungkapan tingkat tertinggi. “Bahkan” memperjelas hubungan aposisional tanpa menghilangkan keluasan kosmisnya.
- source_word: וְכָל צְבָאָם
  choice: beserta seluruh bala tentaranya
  rationale: צָבָא dapat mencakup benda-benda langit dan/atau makhluk surgawi. “Bala tentara” mempertahankan keluasan istilah dan menghindari pembatasan hanya kepada bintang atau malaikat.
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: bumi beserta segala yang ada di atasnya
  rationale: Dalam daftar penciptaan ini, אֶרֶץ merujuk pada bumi secara keseluruhan. Frasa Indonesianya mengikuti relasi spasial teks sumber.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: laut beserta segala yang ada di dalamnya
  rationale: Bentuk jamak Ibrani bersifat kolektif dalam rangkaian kosmis. “Laut” merupakan bentuk generik yang alami dalam bahasa Indonesia.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: menghidupkan semuanya
  rationale: Bentuk partisipiel piel dapat berarti memberi hidup maupun mempertahankan hidup. “Menghidupkan” menjaga ambiguitas tersebut lebih baik daripada hanya “memelihara tetap hidup”.
- source_word: וּצְבָא הַשָּׁמַיִם לְךָ מִשְׁתַּחֲוִים
  choice: dan bala tentara langit sujud menyembah kepada-Mu
  rationale: מִשְׁתַּחֲוִים menggambarkan tindakan membungkuk atau sujud dalam penghormatan/penyembahan. “Sujud menyembah” menyampaikan tindakan fisik sekaligus maknanya dalam konteks ilahi.
theological_decisions:
- issue: Keunikan Yahweh
  choice: Engkau sajalah Yahweh
  alternative: Engkau adalah Yahweh, hanya Engkau
  rationale: Pilihan utama menegaskan bahwa Yahweh satu-satunya tanpa menambahkan pernyataan metafisis yang tidak dinyatakan secara eksplisit oleh susunan ayat.
- issue: Tindakan Allah terhadap seluruh ciptaan dalam מְחַיֶּה
  choice: Engkau menghidupkan semuanya
  alternative: Engkau menjaga semuanya tetap hidup
  rationale: Verba Ibrani dapat menunjuk pada pemberian hidup dan pemeliharaan hidup yang berkelanjutan. Terjemahan utama mempertahankan ketegangan semantis itu; alternatif dicatat dalam catatan kaki.
- issue: Identitas צְבָא הַשָּׁמַיִם
  choice: bala tentara langit
  alternative: penghuni surga
  rationale: Istilah sumber dapat menunjuk secara luas pada kumpulan surgawi, termasuk benda langit dan/atau makhluk surgawi. Terjemahan tidak mempersempit rujukannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Engkau” dan “-Mu” dipakai untuk sapaan langsung kepada Allah. Tanda titik koma mempertahankan struktur daftar kosmis tanpa menghasilkan kalimat yang terlalu berat.
