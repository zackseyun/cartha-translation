base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: id
  text: Engkau memberitahukan kepada mereka Sabat-Mu yang kudus, dan Engkau memberikan kepada mereka perintah-perintah, ketetapan-ketetapan, dan hukum[a] melalui Musa, hamba-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengajaran.” Kata Ibrani תּוֹרָה dapat mencakup pengajaran maupun kewajiban hukum.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan tangan Musa, hamba-Mu.” Ini adalah ungkapan yang berarti “melalui Musa, hamba-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: hari Sabat-Mu yang kudus
  rationale: Ungkapan ini menunjuk secara khusus pada Sabat sebagai ketetapan perjanjian. Penambahan “hari” membuatnya alami dalam bahasa Indonesia tanpa menghilangkan kekhususan istilah “Sabat”; bentuk קָדְשְׁךָ berfungsi secara atributif, yakni “yang kudus milik-Mu/Sabat-Mu yang kudus.”
- source_word: הוֹדַעַתָ
  choice: memberitahukan
  rationale: Bentuk Hifil dari ידע berarti menyebabkan orang mengetahui atau membuat sesuatu diketahui. “Memberitahukan” mempertahankan daya kausatifnya dan wajar dalam bahasa Indonesia.
- source_word: מִצְוֹת
  choice: perintah-perintah
  rationale: Bentuk jamak ini berarti berbagai perintah. Pengulangan bentuk jamak mempertahankan pembedaan dalam rangkaian istilah hukum.
- source_word: חֻקִּים
  choice: ketetapan-ketetapan
  rationale: Istilah ini merujuk pada ketentuan atau ketetapan yang ditetapkan. “Ketetapan-ketetapan” sesuai dengan laras hukum-perjanjian dan membedakannya dari מִצְוֹת.
- source_word: תוֹרָה
  choice: hukum
  rationale: Dalam rangkaian hukum ini, “hukum” paling sesuai dengan konteks, sedangkan cakupan makna “pengajaran” tetap dicatat dalam catatan kaki.
- source_word: צִוִּיתָ לָהֶם
  choice: Engkau memerintahkan kepada mereka
  rationale: Terjemahan verbal ini mempertahankan kekuatan langsung kata צוה, yaitu memerintah, meskipun objek-objek yang menyusul juga berupa istilah perintah.
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: melalui Musa, hamba-Mu
  rationale: Secara harfiah בְּיַד berarti “dengan/perantaraan tangan,” tetapi di sini merupakan idiom yang menyatakan perantaraan. “Melalui” menyampaikan maksud idiom itu secara alami.
theological_decisions:
- issue: Penerjemahan rangkaian מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: perintah-perintah, ketetapan-ketetapan, dan hukum
  alternative: perintah-perintah, ketentuan-ketentuan, dan pengajaran
  rationale: Ketiga unsur dipertahankan secara terpisah agar nuansa pewahyuan dan perundang-undangan perjanjian tidak dilebur. “Hukum” cocok dalam konteks ini, tetapi kemungkinan arti “pengajaran” tidak ditutup dan dicatat sebagai alternatif.
- issue: Ungkapan perantaraan בְּיַד
  choice: melalui Musa, hamba-Mu
  alternative: dengan perantaraan tangan Musa, hamba-Mu
  rationale: Ungkapan Ibrani menyatakan Musa sebagai perantara penyampaian perintah Allah, bukan mengajarkan suatu mekanisme teologis khusus. Terjemahan idiomatis mencegah pembaca salah memahami “tangan” secara harfiah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Kapitalisasi pada “Engkau,” “-Mu,” dan “Sabat” mengikuti rujukan ilahi serta nama hari khusus. Struktur rangkaian hukum dipertahankan, tetapi idiom בְּיַד diterjemahkan secara alami agar mudah dipahami.
