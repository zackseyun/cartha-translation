source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: id
  text: Sekarang, ya Allah kami—Allah yang besar, perkasa, dan dahsyat[a], yang memegang teguh perjanjian dan kasih setia—janganlah Engkau menganggap remeh segala kesusahan yang telah menimpa kami—raja-raja kami, para pemimpin kami, para imam kami, para nabi kami, para leluhur kami[b], dan seluruh umat-Mu—sejak zaman raja-raja Asyur sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menggentarkan.” Kata Ibrani ini menggambarkan Allah sebagai Pribadi yang membangkitkan rasa gentar dan hormat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapak kami”; dalam konteks ini maksudnya para leluhur bangsa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Dalam aposisi dengan 'Allah kami' dan diikuti gelar-gelar ilahi, אֵל diterjemahkan secara alami sebagai 'Allah'.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: yang besar, perkasa, dan dahsyat
  rationale: Rangkaian ini mempertahankan gelar-gelar perjanjian bagi Allah; 'dahsyat' menyampaikan rasa takut dan hormat yang ditimbulkan oleh נורא tanpa bernada percakapan.
- source_word: שׁוֹמֵר הַבְּרִית וְהַחֶסֶד
  choice: yang memegang perjanjian dan kasih setia
  rationale: Partisip שׁוֹמֵר menyatakan tindakan yang tetap berlangsung. 'Memegang perjanjian' merupakan ungkapan Indonesia yang alami untuk kesetiaan memelihara perjanjian, sedangkan 'kasih setia' mempertahankan bobot perjanjian חֶסֶד.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: janganlah menganggap ringan
  rationale: Idiom Ibrani memohon agar Allah tidak memandang kesusahan itu sebagai perkara kecil; terjemahan ini menyampaikan maksudnya dengan jelas dan wajar.
- source_word: כָּל הַתְּלָאָה אֲשֶׁר מְצָאַתְנוּ
  choice: segala kesusahan yang telah menimpa kami
  rationale: תְּלָאָה menunjuk pada kesukaran atau penderitaan, sedangkan 'menimpa' menerjemahkan idiom harfiah 'menemukan kami' secara alami.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: raja-raja kami, para pemimpin kami, para imam kami, para nabi kami, para leluhur kami
  rationale: Prefiks ל menandai pihak-pihak yang turut terkena kesusahan. שָׂרִים diterjemahkan 'para pemimpin' agar mencakup pejabat atau pembesar, dan אֲבוֹת dalam konteks sejarah bangsa diterjemahkan 'leluhur'.
- source_word: וּלְכָל עַמֶּךָ
  choice: dan seluruh umat-Mu
  rationale: Frasa ini memperluas daftar kepada seluruh komunitas milik Allah; 'umat-Mu' tepat untuk konteks umat perjanjian.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: sejak zaman raja-raja Asyur sampai hari ini
  rationale: Ungkapan ini menandai rentang kesusahan yang berawal pada masa pemerintahan raja-raja Asyur dan berlanjut hingga masa penutur.
theological_decisions:
- issue: Nuansa gelar ilahi נוֹרָא
  choice: dahsyat
  alternative: menggentarkan
  rationale: '''Dahsyat'' mempertahankan gagasan bahwa Allah membangkitkan rasa gentar dan hormat, sementara catatan menyediakan alternatif yang lebih eksplisit.'
- issue: Hubungan perjanjian dan חֶסֶד
  choice: memegang perjanjian dan kasih setia
  alternative: memelihara perjanjian dan menunjukkan kasih setia
  rationale: Terjemahan utama menjaga koordinasi dua objek dalam bahasa Ibrani tanpa mengubahnya menjadi dua tindakan yang berlainan.
- issue: Cakupan אֲבֹתֵינוּ
  choice: para leluhur kami
  alternative: bapak-bapak kami
  rationale: Dalam konteks rangkuman sejarah umat, istilah tersebut merujuk kepada generasi pendahulu. 'Leluhur' menyampaikan cakupan referensial itu tanpa menentukan bahwa hanya ayah langsung yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'ya Allah kami' menegaskan bentuk vokatif. Tanda pisah mempertahankan aposisi gelar-gelar ilahi, sedangkan daftar setelah titik dua menjelaskan pihak-pihak yang mengalami kesusahan.
