  source_fidelity: 'Makna pokoknya setia kepada teks Ibrani: doa memanggil Allah dengan tiga gelar, menyebut Dia sebagai pemelihara perjanjian dan kasih setia, lalu memohon agar seluruh kesusahan historis umat tidak dipandang kecil. Namun, konstruksi utama perlu diperjelas supaya Allah secara eksplisit menjadi subjek yang dimohonkan untuk tidak menganggap kesusahan itu remeh, dan daftar pihak yang terkena kesusahan terhubung lebih jelas.'
  naturalness: 'Bahasa draft umumnya baku dan khidmat. Akan tetapi, “janganlah menganggap ringan ...: raja-raja kami ...” kurang lancar karena titik dua dapat terdengar seperti daftar objek langsung dari “menganggap ringan,” bukan penjelas bagi “kami.” “Memegang perjanjian” juga kurang idiomatis daripada “memegang teguh perjanjian” dalam konteks kesetiaan ilahi.'
  terminology: “Allah,” “kasih setia,” “umat-Mu,” “Asyur,” dan “para leluhur kami” sesuai dengan register Alkitab bahasa Indonesia modern. “Dahsyat” dapat dipertahankan untuk נוֹרָא, dengan catatan yang menjelaskan unsur gentar dan hormat. “Para leluhur” tepat secara referensial untuk אבותינו; catatan literal “bapak-bapak kami” mempertahankan informasi bentuk sumber.
