  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: id
  text: Lihatlah, hari ini kami adalah budak.[a] Di negeri yang Engkau berikan kepada nenek moyang kami untuk memakan buahnya dan segala kebaikannya, lihatlah, kami adalah budak di negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hamba.” Kata Ibrani ini menunjuk kepada orang yang berada dalam ketundukan; di sini konteksnya menekankan keadaan umat yang tidak bebas di bawah kekuasaan asing.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di atasnya,” yaitu di negeri yang telah Engkau berikan kepada nenek moyang kami. Dalam konteks ini ungkapan tersebut bermakna lokatif: di negeri itu sendiri.'
    reason: literal_rendering
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penarik perhatian ini muncul dua kali dan memberi tekanan pada ironi keluhan. Pengulangan “lihatlah” mempertahankan daya deiktis dan retorisnya dalam bahasa Indonesia modern.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Ungkapan waktu ini menonjolkan keadaan mereka sekarang sebagai kebalikan dari tujuan semula pemberian negeri itu.
- source_word: עֲבָדִים
  choice: budak
  rationale: Dalam konteks ini kata tersebut menekankan ketundukan dan hilangnya kebebasan di bawah kekuasaan asing; “budak” menyampaikan keadaan itu lebih kuat daripada “hamba” atau “pelayan”.
- source_word: וְהָאָרֶץ
  choice: Negeri
  rationale: Bahasa Ibrani mengedepankan “negeri” dalam konstruksi yang eliptis. Pemisahan menjadi kalimat baru mempertahankan penonjolan itu tanpa menghasilkan susunan bahasa Indonesia yang kaku.
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: yang Engkau berikan kepada nenek moyang kami
  rationale: Mempertahankan sapaan langsung kepada Allah serta rujukan kepada para pendahulu Israel. “Nenek moyang” merupakan padanan Indonesia modern yang wajar untuk אֲבֹת dalam pemakaian kolektif historis ini.
- source_word: לֶאֱכֹל אֶת־פִּרְיָהּ וְאֶת־טוּבָהּ
  choice: agar mereka memakan buahnya dan menikmati segala yang baik darinya
  rationale: “Agar” menyatakan tujuan pemberian negeri. “Memakan buahnya” mempertahankan gambaran pertanian, sedangkan “segala yang baik darinya” menjaga keluasan makna טוּבָהּ tanpa membatasinya hanya pada hasil bumi. Kata “menikmati” ditambahkan demi hubungan verba yang alami dalam bahasa Indonesia.
- source_word: עָלֶיהָ
  choice: di negeri itu
  rationale: Secara harfiah berarti “di atasnya,” tetapi yang dimaksud adalah keberadaan mereka di negeri tersebut. Pengulangan “negeri itu” membuat acuan jelas dan alami sambil mempertahankan ironi bahwa mereka menjadi budak di negeri pemberian Allah sendiri.
theological_decisions:
- issue: Makna עֲבָדִים dalam ratapan perjanjian
  choice: budak
  alternative: hamba
  rationale: Ayat ini meratapi ketundukan politik umat di negeri yang dijanjikan. “Budak” mempertahankan bobot keadaan tidak bebas itu tanpa menentukan secara lebih khusus bentuk hukum atau sistem perbudakannya.
- issue: Rujukan kolektif לַאֲבֹתֵינוּ
  choice: nenek moyang kami
  alternative: bapa-bapa kami
  rationale: Dalam konteks sejarah umat, bentuk maskulin Ibrani menunjuk kepada para pendahulu mereka. “Nenek moyang kami” menyampaikan fungsi tersebut secara jelas dalam bahasa Indonesia modern tanpa mengimpor penafsiran tentang kelompok leluhur tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa-ratapan yang khidmat. Sapaan kepada Allah memakai “Engkau.” Pengulangan “lihatlah” dan “budak” dipertahankan untuk menjaga tekanan serta ironi retoris teks sumber.
