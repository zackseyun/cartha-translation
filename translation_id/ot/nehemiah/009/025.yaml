language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: id
  text: Mereka merebut kota-kota berbenteng dan tanah yang subur[a], lalu mengambil alih rumah-rumah yang penuh dengan segala hal yang baik, tempat penampungan air yang dipahat, kebun-kebun anggur, pohon-pohon zaitun, serta banyak pohon buah-buahan. Mereka pun makan sampai kenyang, menjadi gemuk, dan menikmati kebaikan-Mu yang besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tanah yang gemuk,” yaitu tanah yang kaya dan produktif.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka bersenang-senang dalam kebaikan-Mu yang besar.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: merebut
  rationale: Dalam konteks penaklukan kota, לכד berarti menangkap atau merebut; 'merebut' paling alami dan tepat dalam bahasa Indonesia.
- source_word: עָרִים בְּצֻרוֹת
  choice: kota-kota berbenteng
  rationale: בצר menunjuk pada pertahanan atau benteng; ungkapan ini jelas mempertahankan arti militernya.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: tanah yang subur
  rationale: Secara harfiah berarti 'tanah yang gemuk', sebuah idiom Ibrani bagi tanah yang kaya dan produktif.
- source_word: וַיִּירְשׁוּ
  choice: mengambil alih
  rationale: ירשׁ di sini menyatakan tindakan memperoleh dan menduduki milik setelah penaklukan, bukan pewarisan dalam pengertian modern yang sempit.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: rumah-rumah yang penuh dengan segala yang baik
  rationale: Terjemahan ini mempertahankan cakupan luas כָּל טוּב tanpa membatasinya hanya pada barang atau makanan.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: tempat-tempat penampungan air yang dipahat
  rationale: בּוֹר dalam konteks ini adalah lubang atau waduk penampung air, sedangkan חצוב berarti dipahat atau digali pada batu; bentuk deskriptif ini lebih mudah dipahami pembaca umum daripada istilah teknis.
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: kebun-kebun anggur, pohon-pohon zaitun, serta banyak pohon buah-buahan
  rationale: Daftar aset pertanian diterjemahkan secara konkret; לָרֹב paling wajar dikaitkan dengan unsur terdekat, yaitu pohon-pohon yang menghasilkan makanan.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: makan sampai kenyang
  rationale: שׂבע berarti menjadi kenyang atau puas; bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran jasmaninya.
- source_word: וַיַּשְׁמִינוּ
  choice: menjadi gemuk
  rationale: Terjemahan harfiah ini mempertahankan gambaran Ibrani tentang kemakmuran akibat makanan berlimpah tanpa menambahkan penilaian moral.
- source_word: וַיִּתְעַדְּנוּ
  choice: menikmati kelimpahan
  rationale: Hitpael עדן menyatakan hidup dalam kenikmatan atau kemewahan; 'menikmati kelimpahan' menyampaikan nuansa kemakmuran tanpa bahasa yang terlalu negatif.
theological_decisions:
- issue: Makna בְּטוּבְךָ הַגָּדוֹל dan hubungannya dengan וַיִּתְעַדְּנוּ
  choice: menikmati kelimpahan karena kebaikan-Mu yang besar
  alternative: bersenang-senang dalam kebaikan-Mu yang besar
  rationale: Frasa itu menghubungkan kenikmatan Israel dengan kemurahan Allah. 'Karena' menyampaikan kemungkinan daya kausal ב secara alami, sedangkan 'kebaikan' mempertahankan cakupan teologis טוּב yang lebih luas daripada sekadar kekayaan materi.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Struktur daftar dipertahankan, sementara idiom Ibrani dijelaskan secara alami. Kapitalisasi pada '-Mu' menandai sapaan kepada Allah menurut kebiasaan ejaan religius Indonesia.
