revisions:
- from: Bahkan ketika mereka membuat bagi diri mereka sendiri seekor anak lembu tuangan[a] dan berkata, “Inilah allahmu yang telah membawa engkau keluar dari Mesir,” mereka melakukan perbuatan-perbuatan yang sangat menghina[b].
  to: Bahkan ketika mereka membuat untuk diri mereka sendiri patung anak lembu dari logam cor[a] dan berkata, “Inilah allahmu yang telah membawa engkau keluar dari Mesir,” mereka melakukan penghinaan-penghinaan besar[b].
  rationale: Revisi memperjelas bahwa anak lembu itu adalah patung hasil pengecoran, memperlancar susunan bahasa Indonesia, dan mengganti ungkapan akhir dengan padanan yang lebih dekat pada arti serta bentuk jamak נֶאָצוֹת גְּדֹלוֹת. Ambiguitas cakupan istilah—penghujatan, penghinaan, atau tindakan yang meremehkan—tetap dipelihara melalui catatan kaki.
