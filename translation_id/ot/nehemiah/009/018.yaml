base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: id
  text: Bahkan ketika mereka membuat untuk diri mereka sendiri patung anak lembu dari logam cor[a] dan berkata, “Inilah allahmu yang telah membawa engkau keluar dari Mesir,” mereka melakukan penghinaan-penghinaan besar[b].
  philosophy: optimal-equivalence
  footnotes:
