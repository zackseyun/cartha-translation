review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: mereka membuat anak lembu cor untuk diri sendiri, menyebutnya allah yang membawa mereka keluar dari Mesir, lalu melakukan pelanggaran berat. Namun, “perbuatan-perbuatan yang sangat menghina” menggeser גְּדֹלוֹת (‘besar/hebat’) menjadi intensitas sifat ‘menghina’ dan kurang langsung mencerminkan nomina נֶאָצוֹת.'
  naturalness: Kalimatnya umumnya baku dan mudah dipahami, tetapi “membuat bagi diri mereka sendiri seekor anak lembu tuangan” agak kaku dalam bahasa Indonesia modern. “Patung anak lembu dari logam cor untuk diri mereka sendiri” lebih alami serta jelas bahwa benda itu adalah gambar/berhala hasil pengecoran.
  terminology: Huruf kecil pada “allahmu” tepat karena ini adalah klaim penyembah berhala tentang patung itu. “Penghinaan-penghinaan besar” mempertahankan keluasan נֶאָצוֹת tanpa mempersempitnya menjadi penghujatan verbal saja; alternatif “penghujatan-penghujatan besar” layak dipertahankan dalam catatan kaki.
  issues:
  - severity: medium
    issue: Padanan “perbuatan-perbuatan yang sangat menghina” untuk נֶאָצוֹת גְּדֹלוֹת
    rationale: Frasa ini tidak menyatakan bahwa penghinaan itu ‘besar’, melainkan bahwa perbuatannya ‘sangat menghina’. Selain itu, נֶאָצוֹת adalah nomina untuk tindakan/sikap penghinaan atau kejijikan terhadap Allah, bukan terutama adjektiva bagi ‘perbuatan’.
  - severity: low
    issue: “anak lembu tuangan” dan susunan “membuat bagi diri mereka sendiri”
    rationale: Keduanya dapat dimengerti, tetapi kurang alami dalam ragam Indonesia modern dan bentuk pertama dapat terdengar seolah-olah hewan, bukan benda berhala. Penambahan “patung” aman karena מַסֵּכָה menunjuk pada benda/citra yang dicor.
  revised_text: Bahkan ketika mereka membuat untuk diri mereka sendiri patung anak lembu dari logam cor[a] dan berkata, “Inilah allahmu yang telah membawa engkau keluar dari Mesir,” mereka melakukan penghinaan-penghinaan besar[b].
