    reason: alternatif_leksikal
lexical_decisions:
- source_word: אַף כִּי
  choice: Bahkan ketika
  rationale: Ungkapan ini memperkenalkan tindakan pemberontakan Israel sebagai keadaan yang sangat mencolok di tengah kemurahan Allah; terjemahan ini mempertahankan daya konsesifnya dengan bahasa Indonesia yang wajar.
- source_word: עָשׂוּ לָהֶם
  choice: mereka membuat bagi diri mereka sendiri
  rationale: 'Frasa ini mempertahankan nuansa refleksif לָהֶם: patung itu dibuat untuk kepentingan dan penyembahan mereka sendiri.'
- source_word: עֵגֶל מַסֵּכָה
  choice: seekor anak lembu tuangan
  rationale: מַסֵּכָה menunjuk pada benda atau patung yang dibentuk dengan menuangkan logam cair. ‘Anak lembu tuangan’ menyampaikan bentuk patung dan cara pembuatannya secara ringkas.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Inilah allahmu
  rationale: Kata tunjuk dan sufiks dalam bahasa Ibrani berbentuk tunggal. Huruf kecil pada ‘allah’ menandai bahwa yang dimaksud ialah berhala, tanpa melegitimasi klaim para penyembahnya.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: yang telah membawa engkau keluar dari Mesir
  rationale: Terjemahan ini mempertahankan rumusan keluaran yang dirujuk oleh ucapan tentang anak lembu itu serta menyampaikan idiom עלה + מן secara alami.
- source_word: וַיַּעֲשׂוּ
  choice: mereka melakukan
  rationale: Dengan objek berupa tindakan penghinaan, ‘melakukan’ merupakan padanan idiomatis yang tetap dekat dengan verba Ibrani.
- source_word: נֶאָצוֹת גְּדֹלוֹת
  choice: perbuatan-perbuatan yang sangat menghina
  rationale: Bentuk ini mempertahankan jamak dan cakupan makna berupa tindakan yang menunjukkan penghinaan atau sikap meremehkan, tanpa membatasi istilah tersebut hanya pada ucapan penghujatan.
theological_decisions:
- issue: Rujukan אֱלֹהֶיךָ dalam ucapan penyembah berhala
  choice: allahmu
  alternative: Allahmu
  rationale: Rujukannya adalah anak lembu tuangan. Penulisan dengan huruf kecil menjaga sifat polemis teks dan tidak menyiratkan bahwa patung itu benar-benar TUHAN, sambil tetap menerjemahkan klaim yang mereka ucapkan.
- issue: Cakupan נֶאָצוֹת sebagai pelanggaran terhadap Allah
  choice: perbuatan-perbuatan yang sangat menghina
  alternative: penghujatan-penghujatan besar
  rationale: Istilah Ibrani dapat mencakup tindakan penghinaan dan sikap meremehkan terhadap Allah, bukan hanya perkataan menghujat. Teks utama mempertahankan keluasan ini, sedangkan alternatif yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk ‘engkau’ dipakai untuk sapaan tunggal dalam kutipan. Pengulangan pada ‘perbuatan-perbuatan’ mempertahankan bentuk jamak Ibrani, sementara susunan kalimat tetap mudah dipahami.
