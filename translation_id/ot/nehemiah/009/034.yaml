  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: id
  text: Bahkan raja-raja kami, para pemimpin kami, para imam kami, dan nenek moyang kami tidak menaati hukum-Mu. Mereka tidak mengindahkan perintah-perintah-Mu dan peringatan-peringatan-Mu[a] yang dengannya Engkau telah memperingatkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesaksian-kesaksian-Mu, yang dengannya Engkau telah memperingatkan mereka.” Kata Ibrani yang dipakai berkaitan dengan kesaksian perjanjian dan juga dapat menyatakan peringatan yang khidmat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Bahkan
  rationale: Dalam rangkaian pengakuan ini, konjungsi bersama penanda objek menambahkan kelompok yang juga bersalah; “Bahkan” menyampaikan daya aditif dan penekanannya secara alami.
- source_word: מְלָכֵינוּ
  choice: raja-raja kami
  rationale: Padanan langsung bagi bentuk jamak dengan sufiks orang pertama jamak.
- source_word: שָׂרֵינוּ
  choice: para pemimpin kami
  rationale: שׂרים menunjuk para penguasa atau pejabat. “Para pemimpin” alami dalam bahasa Indonesia dan cukup luas untuk cakupan istilah Ibrani.
- source_word: כֹּהֲנֵינוּ
  choice: para imam kami
  rationale: Padanan baku bagi כֹּהֵן dalam konteks Israel.
- source_word: וַאֲבֹתֵינוּ
  choice: dan nenek moyang kami
  rationale: Secara harfiah berarti “bapa-bapa kami”, tetapi dalam konteks sejarah Israel menunjuk generasi terdahulu; “nenek moyang” merupakan ungkapan Indonesia yang alami tanpa mengubah acuannya.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: tidak menaati hukum-Mu
  rationale: עשה dengan תּוֹרָה secara idiomatis berarti melaksanakan atau menaati hukum, bukan sekadar “melakukan” hukum.
- source_word: וְלֹא הִקְשִׁיבוּ אֶל
  choice: Mereka tidak mengindahkan
  rationale: Bentuk Hifil dari קשׁב menyatakan mendengarkan dengan perhatian dan kepatuhan; “mengindahkan” menangkap unsur perhatian yang berkehendak.
- source_word: מִצְוֺתֶיךָ
  choice: perintah-perintah-Mu
  rationale: Padanan baku yang mempertahankan perbedaan istilah ini dari תּוֹרָה.
- source_word: וּלְעֵדְוֺתֶיךָ אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: dan peringatan-peringatan yang Kauberikan kepada mereka
  rationale: עֵדוֹת dan הַעִידֹתָ berasal dari medan makna kesaksian atau peringatan perjanjian. Dalam konteks ini, “peringatan-peringatan yang Kauberikan” menyampaikan fungsi teguran khidmat serta relasi instrumental frasa tersebut.
theological_decisions:
- issue: Makna תּוֹרָה
  choice: hukum-Mu
  alternative: ajaran-Mu
  rationale: Dalam pengakuan nasional dan konteks perjanjian ini, תּוֹרָה menunjuk hukum Allah yang harus ditaati, meskipun secara leksikal dapat berarti ajaran.
- issue: Makna אָבוֹת
  choice: nenek moyang kami
  alternative: bapa-bapa kami
  rationale: Acuannya adalah generasi pendahulu Israel. “Nenek moyang” menyampaikan acuan historis itu secara wajar dalam bahasa Indonesia, sedangkan “bapa-bapa” lebih harfiah.
- issue: Hubungan עֵדְוֺתֶיךָ dengan הַעִידֹתָ
  choice: peringatan-peringatan yang Kauberikan kepada mereka
  alternative: kesaksian-kesaksian-Mu yang Kausampaikan terhadap mereka
  rationale: Konteks mendukung arti peringatan atau teguran khidmat, tetapi nuansa kesaksian perjanjian tetap merupakan kemungkinan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan akhiran “kami” dan “-Mu” dipertahankan untuk mencerminkan susunan pengakuan serta kontras antara para pemimpin Israel dan ketetapan Allah.
