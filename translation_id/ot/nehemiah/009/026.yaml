  text: וַ/יַּמְר֨וּ וַֽ/יִּמְרְד֜וּ בָּ֗/ךְ וַ/יַּשְׁלִ֤כוּ אֶת תּוֹרָֽתְ/ךָ֙ אַחֲרֵ֣י גַוָּ֔/ם וְ/אֶת נְבִיאֶ֣י/ךָ הָרָ֔גוּ אֲשֶׁר הֵעִ֥ידוּ בָ֖/ם לַ/הֲשִׁיבָ֣/ם אֵלֶ֑י/ךָ וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדוֹלֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: id
  text: Namun mereka membangkang dan memberontak terhadap-Mu,[a] lalu melemparkan Taurat-Mu ke belakang punggung mereka. Mereka membunuh nabi-nabi-Mu, yang telah memperingatkan mereka agar mereka kembali kepada-Mu,[b] dan mereka melakukan penghinaan yang sangat besar terhadap-Mu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersikap tidak taat,” “berlaku angkuh,” atau “menentang”; kata Ibraninya menyiratkan perlawanan yang sengaja dan keras.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersaksi terhadap mereka”; kata Ibraninya dapat berarti memberikan kesaksian atau peringatan dengan sungguh-sungguh.
    reason: lexical_alternative
  - marker: c
    text: Atau “penistaan-penistaan besar” atau “tindakan-tindakan yang sangat menghina”; ungkapan Ibraninya dapat mencakup perbuatan maupun perkataan yang menghina Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: membangkang
  rationale: Kata מרה menyatakan perlawanan yang keras dan sengaja. “Membangkang” membedakannya dari kata berikutnya yang secara lebih langsung berarti memberontak.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: memberontak terhadap-Mu
  rationale: מרד adalah istilah yang tegas untuk pemberontakan, sedangkan בָּךְ mempertahankan arah pribadi tindakan itu terhadap Allah.
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: melemparkan ... ke belakang punggung mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani yang mengungkapkan penolakan penuh penghinaan, alih-alih meratakannya menjadi sekadar “mengabaikan”.
- source_word: תּוֹרָתְךָ
  choice: Taurat-Mu
  rationale: Dalam konteks sejarah perjanjian ini, “Taurat” merupakan istilah Indonesia yang alami dan dikenal untuk hukum atau pengajaran Allah, sekaligus mempertahankan keterkaitannya dengan Musa.
- source_word: נְבִיאֶיךָ
  choice: nabi-nabi-Mu
  rationale: Padanan baku dan tepat dalam konteks ini.
- source_word: הֵעִידוּ בָם
  choice: telah memperingatkan mereka
  rationale: Bentuk kausatif עוּד dapat berarti memberikan kesaksian dengan sungguh-sungguh atau memperingatkan. Tujuan pemulihan dalam frasa berikutnya membuat “memperingatkan” alami tanpa meniadakan nuansa kesaksian resmi.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: supaya membawa mereka kembali kepada-Mu
  rationale: 'Bentuk kausatif שוב menyatakan tujuan para nabi: membawa umat kembali kepada Allah. Susunan ini mempertahankan baik kausalitas maupun arah relasionalnya.'
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: penghinaan-penghinaan besar terhadap-Mu
  rationale: נֶאָצוֹת menunjuk pada tindakan-tindakan penghinaan atau penistaan. Padanan ini cukup luas untuk mencakup perbuatan, bukan hanya ucapan, dan objek tersiratnya diperjelas dari konteks.
theological_decisions:
- issue: Pembedaan dua kata kerja pemberontakan וַיַּמְרוּ dan וַיִּמְרְדוּ
  choice: membangkang dan memberontak
  alternative: tidak taat dan memberontak; berlaku angkuh dan memberontak
  rationale: Dua padanan berbeda mempertahankan peningkatan retoris dalam bahasa Ibrani tanpa meleburkan kedua tindakan menjadi satu.
- issue: Cakupan נֶאָצוֹת
  choice: penghinaan-penghinaan besar terhadap-Mu
  alternative: penistaan-penistaan besar; hujatan-hujatan besar; tindakan-tindakan yang sangat menghina
  rationale: Kata Ibrani lebih luas daripada hujatan verbal. Terjemahan utama mempertahankan cakupan tindakan penghinaan terhadap Allah tanpa membatasi bentuknya.
- issue: Makna הֵעִידוּ בָם
  choice: memperingatkan mereka
  alternative: bersaksi terhadap mereka; memperingatkan mereka dengan sungguh-sungguh
  rationale: Terjemahan utama mengikuti fungsi nubuat dalam konteks, sedangkan catatan kaki mempertahankan kemungkinan nuansa kesaksian resmi atau menentang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi “-Mu” dipertahankan. Gambaran konkret “ke belakang punggung mereka” sengaja dipertahankan karena jelas dan merupakan unsur retoris penting dalam teks Ibrani.
