  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: id
  text: Engkau turun di Gunung Sinai dan berbicara dengan mereka dari langit[a]. Engkau memberikan kepada mereka putusan yang adil, hukum yang benar[b], serta ketetapan dan perintah yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berbicara kepada mereka dari langit.” Preposisi Ibrani secara harfiah berarti “dengan,” tetapi dalam bahasa Indonesia kata kerja ini juga lazim diikuti “kepada.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hukum kebenaran” atau “pengajaran yang benar.” Kata Ibrani yang diterjemahkan “hukum” juga dapat berarti “pengajaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Engkau turun di atas Gunung Sinai
  rationale: Kata kerja ירד berarti ‘turun’, sedangkan עַל menandai tempat, yaitu di atas Gunung Sinai. Susunan ini alami dalam bahasa Indonesia dan mempertahankan gambaran turunnya Allah.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: dan berbicara dengan mereka dari langit
  rationale: Preposisi עִם secara harfiah berarti ‘dengan’. Terjemahan ini mempertahankan bentuk Ibrani, sementara ‘berbicara kepada mereka’ tetap merupakan kemungkinan idiomatis yang dicatat dalam catatan kaki.
- source_word: וַתִּתֵּן לָהֶם
  choice: Engkau memberi mereka
  rationale: Terjemahan langsung dan alami dari נתן dengan objek tak langsung berpreposisi ל; penyebutan ‘Engkau’ mempertahankan sapaan langsung dalam doa.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: hukum-hukum yang adil
  rationale: מִשְׁפָּטִים menunjuk pada keputusan atau ketentuan hukum, dan יְשָׁרִים menyatakan kelurusan atau keadilan. ‘Hukum-hukum yang adil’ jelas bagi pembaca modern dan mempertahankan nuansa hukum-moralnya.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: pengajaran-pengajaran yang benar
  rationale: Bentuk jamak תּוֹרוֹת dapat berarti pengajaran atau hukum. ‘Pengajaran-pengajaran’ mempertahankan keluasan makna תורה dan membedakannya dari מִשְׁפָּטִים, sedangkan אֱמֶת menyatakan kebenaran dan keterandalan.
- source_word: חֻקִּים
  choice: ketetapan-ketetapan
  rationale: Padanan ini mempertahankan nuansa ketentuan yang ditetapkan dan membedakannya dari istilah hukum lain dalam rangkaian tersebut.
- source_word: וּמִצְוֺת
  choice: perintah-perintah
  rationale: מִצְוָה secara tepat berarti perintah dan dalam konteks ini menunjuk pada perintah-perintah perjanjian.
- source_word: טוֹבִים
  choice: yang baik
  rationale: טוֹבִים berarti ‘baik’ dan secara tata bahasa mencakup pasangan terakhir, yaitu ketetapan-ketetapan dan perintah-perintah.
theological_decisions:
- issue: Pembedaan empat istilah hukum dalam daftar
  choice: Membedakan istilah-istilah itu sebagai ‘hukum-hukum’, ‘pengajaran-pengajaran’, ‘ketetapan-ketetapan’, dan ‘perintah-perintah’.
  alternative: Meringkasnya menjadi lebih sedikit istilah, atau menerjemahkan תּוֹרוֹת sebagai ‘hukum-hukum’.
  rationale: Teks Ibrani sengaja memakai beberapa kata yang berdekatan maknanya. Mempertahankan empat padanan menampilkan kekayaan pewahyuan di Sinai tanpa meleburkan semua kategori atau memasukkan pembedaan doktrinal yang tidak dinyatakan teks.
- issue: Hubungan antara turunnya Allah di Sinai dan suara dari langit
  choice: 'Mempertahankan kedua pernyataan secara berdampingan: Allah turun di atas Sinai dan berbicara dari langit.'
  alternative: Menjelaskan atau menyelaraskannya dengan menambahkan uraian tentang lokasi atau cara kehadiran Allah.
  rationale: Teks sendiri mempertahankan ketegangan gambaran antara kehadiran Allah di gunung dan firman-Nya dari langit. Terjemahan tidak menambahkan penjelasan teologis yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan bentuk jamak dipertahankan untuk mencerminkan rangkaian istilah hukum dalam bahasa Ibrani. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah hubungan antargagasannya.
