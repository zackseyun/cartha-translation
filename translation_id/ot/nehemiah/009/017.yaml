source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: id
  text: Namun, mereka menolak mendengarkan dan tidak mengingat perbuatan-perbuatan ajaib-Mu yang telah Kaulakukan di tengah-tengah mereka. Mereka berkeras kepala dan, dalam pemberontakan mereka, mengangkat seorang pemimpin untuk kembali ke perbudakan mereka. Namun, Engkau adalah Allah yang penuh pengampunan[a], penuh rahmat dan belas kasihan, panjang sabar, dan berlimpah kasih setia, dan Engkau tidak meninggalkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah pengampunan-pengampunan”; bentuk jamak ini menekankan pengampunan yang berlimpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: mereka menolak mendengarkan
  rationale: Mempertahankan makna dasar penolakan untuk mendengar, sambil membiarkan nuansa ketidaktaatan tersirat dalam konteks.
- source_word: נִפְלְאֹתֶיךָ
  choice: perbuatan-perbuatan ajaib-Mu
  rationale: Mengungkapkan tindakan luar biasa Allah secara alami dan jelas dalam bahasa Indonesia.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: yang telah Kaulakukan di tengah-tengah mereka
  rationale: עִם dapat berarti 'dengan' atau 'di tengah'; konteks menunjuk pada karya Allah yang dialami dalam lingkungan umat itu.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: mereka berkeras kepala
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan metafora Ibrani tentang menegarkan tengkuk tanpa menghasilkan ungkapan yang kaku.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: mengangkat seorang pemimpin
  rationale: Secara harfiah berarti 'menetapkan kepala' dan secara idiomatis menunjuk pada penunjukan seorang pemimpin.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: untuk kembali ke perbudakan mereka
  rationale: עַבְדוּת menunjuk pada keadaan diperbudak; pilihan ini mempertahankan kaitan dengan pengalaman Mesir.
- source_word: בְּמִרְיָם
  choice: dalam pemberontakan mereka
  rationale: Ditempatkan sebagai keterangan keadaan yang menerangkan tindakan mengangkat pemimpin.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: Allah yang suka mengampuni
  rationale: Bentuk jamak abstrak menekankan kelimpahan pengampunan. Ungkapan ini alami dalam bahasa Indonesia dan menggambarkan sifat Allah, sementara bentuk sumber dijelaskan dalam catatan kaki.
- source_word: חַנּוּן וְרַחוּם
  choice: penuh rahmat dan belas kasihan
  rationale: Membedakan nuansa kemurahan yang memberi anugerah dari belas kasih yang tergerak oleh penderitaan.
- source_word: אֶרֶךְ אַפַּיִם
  choice: panjang sabar
  rationale: Ungkapan Indonesia yang mapan untuk idiom Ibrani tentang kelambanan untuk menjadi marah.
- source_word: רַב־חֶסֶד
  choice: berlimpah kasih setia
  rationale: חֶסֶד mencakup kasih dan kesetiaan relasional; 'kasih setia' mempertahankan bobot tersebut tanpa membatasinya pada rumusan doktrinal tertentu.
- source_word: וְלֹא עֲזַבְתָּם
  choice: Engkau tidak meninggalkan mereka
  rationale: Menyampaikan makna meninggalkan atau menelantarkan secara alami, dengan daya relasional yang tetap jelas.
theological_decisions:
- issue: Penggambaran sifat Allah dalam אֱלוֹהַּ סְלִיחוֹת
  choice: Allah yang suka mengampuni
  alternative: Allah yang penuh pengampunan
  rationale: Pilihan utama menyatakan kecenderungan dan kelimpahan pengampunan Allah secara alami, tanpa membuat bentuk jamak Ibrani terdengar janggal; bentuk harfiahnya dicatat.
- issue: Makna perjanjian dalam חֶסֶד
  choice: kasih setia
  alternative: kasih yang teguh
  rationale: '''Kasih setia'' mempertahankan perpaduan kasih, loyalitas, dan keteguhan relasional, tanpa memasukkan penafsiran denominatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Idiom Ibrani dialihkan secara alami, sedangkan nuansa penting dari bentuk jamak סְלִיחוֹת dipertahankan melalui catatan kaki.
