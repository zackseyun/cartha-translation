  text: וּ/בְ/יוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/חֹ֣דֶשׁ הַ/זֶּ֗ה נֶאֶסְפ֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/צ֣וֹם וּ/בְ/שַׂקִּ֔ים וַ/אֲדָמָ֖ה עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: id
  text: Pada hari kedua puluh empat bulan ini, orang-orang Israel[a] berkumpul sambil berpuasa, mengenakan kain kabung, dan dengan tanah pada diri mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; dapat juga diterjemahkan “keturunan Israel”.
    reason: lexical_alternative
  - marker: b
    text: Tanah pada diri mereka merupakan tanda dukacita dan pertobatan. Teks Ibrani tidak menyebutkan bahwa tanah itu secara khusus diletakkan di kepala.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ הַזֶּה
  choice: Pada hari kedua puluh empat bulan ini
  rationale: Ungkapan penanggalan Ibrani memakai bilangan kardinal, tetapi dalam bahasa Indonesia tanggal dinyatakan secara alami dengan bentuk ordinal “hari kedua puluh empat”. Konjungsi awal tidak perlu diterjemahkan tersendiri dalam alur narasi Indonesia.
- source_word: נֶאֶסְפוּ
  choice: berkumpul
  rationale: Bentuk Niphal menyatakan bahwa umat datang bersama sebagai suatu perhimpunan. “Berkumpul” menyampaikan makna itu secara alami tanpa menentukan adanya pihak luar yang mengumpulkan mereka.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Secara harfiah frasa ini berarti “anak-anak lelaki Israel”, tetapi dalam konteks perhimpunan umat, ungkapan Indonesia “orang-orang Israel” lebih alami dan tidak menyiratkan bahwa hanya laki-laki yang hadir. Bentuk kekeluargaan harfiahnya dipertahankan dalam catatan kaki.
- source_word: בְּצוֹם
  choice: sambil berpuasa
  rationale: Preposisi menandai keadaan yang menyertai perhimpunan. “Sambil berpuasa” jelas dan alami dalam bahasa Indonesia.
- source_word: וּבְשַׂקִּים
  choice: mengenakan kain kabung
  rationale: Bentuk jamak menunjuk pada pakaian dari kain kasar yang dikenakan sebagai tanda dukacita atau pertobatan. Kata kerja “mengenakan” membuat tindakan itu jelas bagi pembaca modern.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: dan menaruh tanah pada tubuh mereka
  rationale: אֲדָמָה berarti tanah atau bumi, bukan secara khusus debu. Frasa sumber hanya menyatakan bahwa tanah ada pada mereka dan tidak menyebut kepala; “pada tubuh mereka” menghindari penambahan lokasi yang tidak dinyatakan.
theological_decisions:
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: anak-anak lelaki Israel / keturunan Israel
  rationale: Dalam konteks ini frasa tersebut merupakan sebutan kolektif bagi umat Israel. Terjemahan tidak membatasi perhimpunan hanya kepada laki-laki, tetapi catatan kaki menjaga bentuk harfiah sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan urutan tindakan dalam teks Ibrani, tetapi memakai ungkapan yang alami bagi pembaca umum. “Kain kabung” dipertahankan sebagai istilah Alkitab yang dikenal, dengan konteks tindakan yang memperjelas pemakaiannya.
