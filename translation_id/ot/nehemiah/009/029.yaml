id: NEH.9.29
reference: Nehemiah 9:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: id
  text: Engkau memperingatkan mereka supaya membawa mereka kembali kepada hukum-Mu. Namun, mereka bertindak lancang dan tidak mendengarkan perintah-perintah-Mu. Mereka berdosa terhadap ketetapan-ketetapan-Mu, yang jika dilakukan seseorang, ia akan hidup melalui ketetapan-ketetapan itu.[a] Mereka berpaling dengan bahu yang membangkang, mengeraskan tengkuk,[b] dan tidak mau mendengarkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan ini menggemakan Imamat 18:5. Secara lebih harfiah: “yang akan dilakukan manusia dan ia akan hidup di dalamnya.”'
    reason: cross_reference_and_literal_rendering
  - marker: b
    text: “Mengeraskan tengkuk” adalah gambaran tentang sikap keras kepala dan penolakan untuk taat.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Engkau memperingatkan mereka
  rationale: Bentuk Hifil dari עוד di sini menyatakan peringatan atau teguran yang sungguh-sungguh; 'memperingatkan' alami dalam bahasa Indonesia dan sesuai dengan konteks seruan perjanjian.
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: untuk membawa mereka kembali kepada hukum-Mu
  rationale: Hifil שׁוב berarti menyebabkan kembali, sedangkan תּוֹרָה dalam konteks perjanjian ini tepat diterjemahkan 'hukum'.
- source_word: הֵזִידוּ
  choice: mereka bertindak lancang
  rationale: זיד menunjukkan tindakan yang congkak, kurang ajar, atau dilakukan dengan kesengajaan menentang; 'bertindak lancang' mempertahankan unsur perilaku, bukan hanya sikap batin.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: tidak mendengarkan perintah-perintah-Mu
  rationale: שׁמע mencakup mendengar dengan implikasi menaati; bentuk ini mempertahankan citra mendengarkan sambil menyiratkan penolakan untuk taat.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: Mereka berdosa terhadap ketetapan-ketetapan-Mu
  rationale: מִשְׁפָּטִים menunjuk pada keputusan atau ketetapan hukum Allah. 'Ketetapan-ketetapan' lebih alami daripada 'penghakiman-penghakiman' dalam konteks ini, dan 'terhadap' mewakili relasi ב yang menandai pelanggaran.
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: yang apabila dilakukan seseorang, ia akan hidup olehnya
  rationale: אָדָם bersifat generik dan dalam bahasa Indonesia alami diterjemahkan 'seseorang'. Susunan ini mempertahankan hubungan antara melakukan ketetapan dan hidup olehnya serta gema Imamat 18:5.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: Mereka menyodorkan bahu yang membangkang
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang bahu yang menolak beban atau kuk, dengan ungkapan Indonesia yang masih dapat dipahami.
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: mengeraskan tengkuk
  rationale: Ungkapan ini mempertahankan idiom Ibrani yang lazim untuk sikap keras kepala dan pembangkangan.
- source_word: וְלֹא שָׁמֵעוּ
  choice: tidak mau mendengarkan
  rationale: '''Tidak mau'' menangkap penolakan yang disengaja dan terus-menerus dalam penutup ayat.'
theological_decisions:
- issue: Makna hidup melalui pelaksanaan ketetapan Allah
  choice: yang apabila dilakukan seseorang, ia akan hidup olehnya
  alternative: yang harus dilakukan seseorang supaya ia hidup olehnya
  rationale: Pilihan utama mengikuti susunan relatif Ibrani dan mempertahankan ketegangan teologis pernyataan serta gema Imamat 18:5 tanpa menjelaskan jenis atau cakupan 'hidup' secara dogmatis.
- issue: Cakupan אָדָם
  choice: seseorang
  alternative: manusia
  rationale: אָדָם di sini adalah nomina tunggal generik yang mencakup siapa pun; 'seseorang' menyampaikan fungsi generiknya secara tepat dan alami tanpa membatasi pada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai 'Engkau' serta akhiran '-Mu'. Metafora 'bahu yang membangkang' dan 'mengeraskan tengkuk' dipertahankan karena penting bagi daya ungkap teks, dengan idiom kedua dijelaskan dalam catatan kaki.
