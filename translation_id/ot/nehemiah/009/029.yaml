revisions:
- from: Engkau memperingatkan mereka untuk membawa mereka kembali kepada hukum-Mu. Namun, mereka bertindak lancang dan tidak mendengarkan perintah-perintah-Mu. Mereka berdosa terhadap ketetapan-ketetapan-Mu, yang apabila dilakukan seseorang, ia akan hidup olehnya.[a] Mereka menyodorkan bahu yang membangkang, mengeraskan tengkuk,[b] dan tidak mau mendengarkan.
  to: Engkau memperingatkan mereka supaya membawa mereka kembali kepada hukum-Mu. Namun, mereka bertindak lancang dan tidak mendengarkan perintah-perintah-Mu. Mereka berdosa terhadap ketetapan-ketetapan-Mu, yang jika dilakukan seseorang, ia akan hidup melalui ketetapan-ketetapan itu.[a] Mereka berpaling dengan bahu yang membangkang, mengeraskan tengkuk,[b] dan tidak mau mendengarkan.
  rationale: Revisi mengganti “menyodorkan bahu” dengan “berpaling dengan bahu yang membangkang” untuk menyampaikan fungsi idiom Ibrani sebagai penolakan yang keras kepala tanpa menghapus metaforanya. Klausa tentang hidup diperjelas dengan menyatakan kembali rujukan jamak kepada ketetapan-ketetapan. “Supaya membawa mereka kembali” mempertahankan tujuan Hifil “mengembalikan,” meskipun subjek tersiratnya tetap Allah.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:14:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya mencerminkan teks Ibrani dengan baik: peringatan untuk mengembalikan mereka kepada hukum Allah, kelancangan, penolakan untuk mendengarkan perintah, pelanggaran ketetapan, serta metafora tengkuk yang dikakukan tetap terjaga. Namun, “menyodorkan bahu” dalam bahasa Indonesia dapat menyiratkan menawarkan bahu untuk menerima beban, justru berlawanan dengan idiom Ibrani tentang penolakan yang keras kepala. Frasa tentang hidup juga perlu membuat rujukan jamak בָהֶם lebih jelas.'
  naturalness: Registernya baku dan sesuai untuk doa pengakuan dosa. “Menyodorkan bahu yang membangkang” tidak alami dan berpotensi salah dipahami. “Ia akan hidup olehnya” juga kurang jelas karena “olehnya” berbentuk tunggal, sedangkan yang dirujuk ialah ketetapan-ketetapan.
  terminology: “Hukum-Mu,” “perintah-perintah-Mu,” dan “ketetapan-ketetapan-Mu” membedakan istilah hukum Taurat secara cukup baik. “Seseorang” tepat untuk אָדָם yang generik. Metafora “mengeraskan tengkuk” layak dipertahankan; catatan kaki penjelasnya membantu.
  issues:
