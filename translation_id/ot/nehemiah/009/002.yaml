  text: וַ/יִּבָּֽדְלוּ֙ זֶ֣רַע יִשְׂרָאֵ֔ל מִ/כֹּ֖ל בְּנֵ֣י נֵכָ֑ר וַ/יַּעַמְד֗וּ וַ/יִּתְוַדּוּ֙ עַל חַטֹּ֣אתֵי/הֶ֔ם וַ/עֲוֺנ֖וֹת אֲבֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: id
  text: Kemudian keturunan Israel[a] memisahkan diri dari semua orang asing. Mereka berdiri dan mengakui dosa-dosa mereka serta kesalahan nenek moyang mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih Israel”; dapat juga diterjemahkan “anak cucu Israel.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kesalahan nenek moyang mereka”; ini dapat merujuk pada pengakuan bersama atas kesalahan leluhur.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: memisahkan diri
  rationale: Bentuk nifal di sini secara alami menyatakan tindakan refleksif oleh subjek manusia; pilihan ini mempertahankan unsur kesengajaan tanpa mengubahnya menjadi bentuk pasif.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi dalam konteks silsilah menunjuk secara kolektif kepada keturunan. 'Keturunan Israel' alami dalam bahasa Indonesia dan mempertahankan makna genealogisnya.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: dari semua orang asing
  rationale: בְּנֵי נֵכָר merupakan ungkapan bagi orang-orang asing atau yang berasal dari bangsa lain, bukan hanya anak laki-laki secara harfiah.
- source_word: וַיַּעַמְדוּ
  choice: mereka berdiri
  rationale: עמד lazim berarti 'berdiri'; terjemahan ini mempertahankan sikap tubuh yang menyertai pengakuan mereka.
- source_word: וַיִּתְוַדּוּ
  choice: mengakui
  rationale: Bentuk hitpael dari ידה dalam konteks ini berarti mengaku atau membuat pengakuan. 'Mengakui' merupakan padanan Indonesia yang lugas dan wajar.
- source_word: חַטֹּאתֵיהֶם
  choice: dosa-dosa mereka
  rationale: Bentuk jamak חטאת secara langsung menunjuk pada dosa-dosa mereka.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: kesalahan nenek moyang mereka
  rationale: עָוֹן dapat berarti kesalahan, kejahatan, rasa bersalah, atau hukuman akibat kesalahan. Dalam kesejajaran dengan 'dosa-dosa', 'kesalahan' mempertahankan perbedaan leksikal tanpa menentukan bahwa yang dimaksud semata-mata akibat hukuman; 'nenek moyang' adalah ungkapan Indonesia yang alami untuk אבות dalam konteks leluhur.
theological_decisions:
- issue: Pengakuan bersama atas kesalahan leluhur
  choice: Mereka mengakui dosa-dosa mereka sendiri serta kesalahan nenek moyang mereka.
  alternative: Ungkapan itu hanya menunjuk pada akibat kesalahan nenek moyang atau sekadar penyebutan sejarah.
  rationale: Susunan Ibrani menempatkan kedua unsur sebagai perkara yang diakui. Terjemahan mempertahankan dimensi pengakuan korporat ini tanpa menyimpulkan bahwa keturunan mewarisi kesalahan pribadi leluhur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kemudian' menjaga kesinambungan naratif; pemecahan menjadi dua kalimat membuat rangkaian tindakan jelas bagi pembaca umum. Istilah 'orang asing' dipakai secara deskriptif sesuai idiom Ibrani, tanpa menambahkan kategori etnis atau keagamaan yang tidak dinyatakan.
