reference: Nehemiah 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֣ם הִרְבִּ֔יתָ כְּ/כֹכְבֵ֖י הַ/שָּׁמָ֑יִם וַ/תְּבִיאֵ/ם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר אָמַ֥רְתָּ לַ/אֲבֹתֵי/הֶ֖ם לָ/ב֥וֹא לָ/רָֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: id
  text: Engkau membuat anak-anak mereka menjadi banyak seperti bintang-bintang di langit[a], dan Engkau membawa mereka masuk ke negeri yang telah Engkau firmankan kepada nenek moyang mereka untuk mereka masuki dan miliki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seperti bintang-bintang di langit”; ungkapan ini menggemakan janji Allah kepada para leluhur.'
    reason: cross_reference
  - marker: b
    text: Kata Ibrani yang diterjemahkan “miliki” juga dapat berarti “ambil alih” atau, dalam konteks tertentu, “warisi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: anak-anak mereka
  rationale: Dalam konteks bertambahnya jumlah suatu bangsa, בנים menunjuk pada anak-anak atau keturunan secara luas, bukan hanya anak laki-laki.
- source_word: הִרְבִּיתָ
  choice: membuat ... menjadi banyak
  rationale: Bentuk Hifil menyatakan bahwa Allah menyebabkan jumlah mereka menjadi banyak; susunan ini alami dalam bahasa Indonesia dan mempertahankan pelaku ilahi secara langsung.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: seperti bintang-bintang di langit
  rationale: Ungkapan ini dekat dengan bahasa Ibrani, mudah dipahami, dan mempertahankan gema janji Allah kepada para leluhur.
- source_word: וַתְּבִיאֵם
  choice: Engkau membawa mereka masuk
  rationale: Bentuk Hifil dari בוא berarti membawa atau menyebabkan masuk; penambahan 'masuk' memperjelas gerak ke dalam negeri itu.
- source_word: אֶל הָאָרֶץ
  choice: ke negeri
  rationale: Dalam konteks tanah yang dijanjikan kepada Israel, 'negeri' merupakan padanan Indonesia yang alami dan sesuai.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: yang telah Engkau firmankan kepada nenek moyang mereka
  rationale: '''Firmankan'' sesuai untuk perkataan Allah dalam ragam Alkitab Indonesia yang dignified; ''nenek moyang'' secara alami mencakup para leluhur.'
- source_word: לָבוֹא לָרָשֶׁת
  choice: untuk mereka masuki dan miliki
  rationale: 'Dua infinitif dipertahankan: masuk ke negeri tersebut lalu menguasai atau memilikinya. ''Miliki'' menjaga fokus konteks tanpa memaksakan arti ''warisi''.'
theological_decisions:
- issue: Gema janji kepada para leluhur
  choice: Mempertahankan ungkapan 'seperti bintang-bintang di langit' dan rujukan kepada 'nenek moyang mereka'.
  alternative: Menggunakan ungkapan bebas seperti 'amat banyak' atau menghilangkan citra bintang.
  rationale: Citra tersebut sengaja menggemakan janji Allah kepada para leluhur dan menonjolkan kesetiaan-Nya tanpa perlu menambahkan penafsiran ke dalam teks.
- issue: Makna לָרָשֶׁת
  choice: miliki
  alternative: warisi; duduki; rebut
  rationale: Kata ירשׁ dapat berarti memiliki, mengambil alih, atau mewarisi. Dalam konteks ini 'miliki' mempertahankan cakupan makna yang wajar tanpa menonjolkan salah satu mekanisme perolehan negeri secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai 'Engkau'. Susunan kalimat mempertahankan paralel tindakan Allah sekaligus menghindari kekakuan harfiah.
