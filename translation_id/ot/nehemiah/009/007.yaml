  text: אַתָּה הוּא֙ יְהוָ֣ה הָ/אֱלֹהִ֔ים אֲשֶׁ֤ר בָּחַ֨רְתָּ֙ בְּ/אַבְרָ֔ם וְ/הוֹצֵאת֖/וֹ מֵ/א֣וּר כַּשְׂדִּ֑ים וְ/שַׂ֥מְתָּ שְּׁמ֖/וֹ אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: id
  text: Engkaulah Yahweh, Allah, yang memilih Abram, membawa dia keluar dari Ur-Kasdim, dan memberinya nama Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Engkaulah
  rationale: Gabungan dua pronomina ini bersifat menegaskan identitas. Bentuk “Engkaulah” menyampaikan penekanan itu secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Yahweh, Allah
  rationale: 'Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, sedangkan הָאֱלֹהִים dipertahankan sebagai sebutan “Allah”. Tanda koma menunjukkan hubungan aposisi: Yahweh dikenali sebagai Allah yang dimaksud.'
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: memilih Abram
  rationale: Dengan verba בחר, preposisi ב menandai orang yang dipilih; bahasa Indonesia secara wajar memakai objek langsung. Nama lama “Abram” dipertahankan agar kontras dengan “Abraham” tetap tampak.
- source_word: וְהוֹצֵאתוֹ
  choice: membawa dia keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan atau membawa seseorang keluar. Ungkapan ini mempertahankan tindakan aktif Allah tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: dari Ur-Kasdim
  rationale: “Ur-Kasdim” adalah bentuk geografis yang ringkas dan lazim dipahami dalam bahasa Indonesia, serta mempertahankan nama Kasdim bagi כַּשְׂדִּים.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: dan memberinya nama Abraham
  rationale: Secara harfiah ungkapan ini berarti “menetapkan namanya Abraham”; “memberinya nama Abraham” merupakan padanan Indonesia yang alami untuk tindakan penamaan ulang.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai nama perjanjian יְהוָה. Transliterasi “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Hubungan antara יְהוָה dan הָאֱלֹהִים
  choice: Yahweh, Allah
  alternative: Yahweh adalah Allah; Yahweh Allah
  rationale: Kedua unsur berdiri dalam hubungan identifikasi atau aposisi. Terjemahan dengan koma mempertahankan keduanya tanpa mengubah frasa menjadi pernyataan teologis yang lebih eksplisit daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “Engkau” sesuai dengan sapaan langsung dalam doa, sedangkan susunan kalimat dibuat lancar bagi pembaca umum. Tidak diperlukan catatan kaki karena nama YHWH diterjemahkan langsung sebagai “Yahweh” dan tidak ada ambiguitas tekstual yang perlu dijelaskan.
