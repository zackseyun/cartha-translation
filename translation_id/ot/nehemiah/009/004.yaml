  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: id
  text: Kemudian Yesua, Bani, Kadmiel, Sebanya, Buni, Serebya, Bani, dan Kenani berdiri di tempat yang ditinggikan bagi para Lewi[a] dan berseru dengan suara nyaring kepada Yahweh, Allah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat naik/tangga para Lewi”; frasa ini dapat menunjuk pada tempat yang ditinggikan atau tangga yang berkaitan dengan para Lewi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: berdiri
  rationale: Kata kerja קום di sini menyatakan bahwa mereka mengambil posisi berdiri; “berdiri” alami dalam bahasa Indonesia dan sesuai dengan keterangan tempat yang mengikutinya.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: tempat bertingkat para Lewi
  rationale: מַעֲלֵה dapat berarti tempat naik, tangga, atau tempat yang ditinggikan. “Tempat bertingkat” menjaga gagasan ketinggian tanpa memastikan bahwa yang dimaksud adalah panggung.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Yesua, Bani, Kadmiel, Sebanya, Buni, Serebya, Bani, dan Kenani
  rationale: Nama-nama ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia. Nama Bani yang muncul dua kali dipertahankan sesuai teks Ibrani.
- source_word: וַיִּזְעֲקוּ
  choice: berseru
  rationale: זעק menyatakan seruan kuat, sering sebagai permohonan kepada Allah. “Berseru” mempertahankan intensitas sekaligus arah religius tindakan itu.
- source_word: בְּקוֹל גָּדוֹל
  choice: dengan suara nyaring
  rationale: Ungkapan ini secara harfiah berarti “dengan suara besar”; “dengan suara nyaring” merupakan padanan Indonesia yang alami dan tetap konkret.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Akhiran pronominal menunjukkan hubungan kepunyaan; “Allah mereka” adalah terjemahan langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi tanpa menggantinya dengan gelar, sementara bentuk vokalnya tetap merupakan rekonstruksi konvensional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar nama dipertahankan, termasuk pengulangan Bani. Ungkapan lokasi dibuat cukup alami tetapi tidak menghilangkan ketidakpastian bentuk fisik מַעֲלֵה.
