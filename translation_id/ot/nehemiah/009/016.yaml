base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: id
  text: Tetapi mereka, nenek moyang kami, bertindak dengan angkuh[a], mengeraskan tengkuk mereka[b], dan tidak mendengarkan[c] perintah-perintah-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bertindak dengan lancang” atau “berlaku pongah.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “mengeraskan tengkuk” berarti bersikap keras kepala atau memberontak.
    reason: cultural_note
  - marker: c
    text: 'Atau: “tidak mengindahkan” atau “tidak menaati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם וַאֲבֹתֵינוּ
  choice: Tetapi mereka dan nenek moyang kami
  rationale: Kata penghubung pertama bernuansa pertentangan dengan kemurahan Allah yang disebut sebelumnya, sedangkan kata penghubung sebelum אֲבֹתֵינוּ dipertahankan sebagai 'dan'. 'Nenek moyang' merupakan padanan Indonesia yang alami bagi para leluhur dalam identifikasi korporat ini.
- source_word: הֵזִידוּ
  choice: bertindak dengan angkuh
  rationale: Kata kerja זיד menyatakan tindakan yang lahir dari keangkuhan, kelancangan, atau sikap merasa diri berhak; frasa ini mempertahankan unsur tindakan dan penilaian moralnya.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: mengeraskan tengkuk mereka
  rationale: Padanan ini mempertahankan metafora Ibrani mengenai sikap keras kepala dan pemberontakan, sekaligus tetap dapat dipahami dalam ragam Indonesia alkitabiah yang umum.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: dan tidak mendengarkan
  rationale: Padanan ini mempertahankan arti dasar שׁמע dengan אֶל, sementara objek 'perintah-perintah-Mu' menyiratkan kegagalan untuk mengindahkan dan menaati.
- source_word: מִצְוֺתֶיךָ
  choice: perintah-perintah-Mu
  rationale: Bentuk jamak dipertahankan dan pronomina orang kedua tunggal diterjemahkan dengan bentuk sapaan kepada Allah yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Identifikasi korporat dengan generasi berdosa terdahulu
  choice: mereka dan nenek moyang kami
  alternative: mereka, yaitu nenek moyang kami
  rationale: Teks Ibrani memuat kata penghubung וַ sebelum 'nenek moyang kami'. Mempertahankan 'dan' menjaga susunan sumber yang agak tidak biasa dan tidak diam-diam menjadikannya hubungan aposisi.
- issue: Makna mendengar sebagai ketaatan
  choice: tidak mendengarkan
  alternative: tidak menaati
  rationale: Terjemahan utama mempertahankan citra mendengar dalam bahasa sumber tanpa menghilangkan implikasi ketidaktaatan; alternatif interpretatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora asli dipertahankan dengan penjelasan singkat, sedangkan bentuk 'nenek moyang' dipilih agar alami bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
