  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: id
  text: Namun, dalam belas kasihan-Mu yang besar, Engkau tidak membinasakan mereka sama sekali ataupun meninggalkan mereka,[a] sebab Engkau adalah Allah yang murah hati dan penyayang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, dalam belas kasihan-Mu yang besar, Engkau tidak menghabisi mereka atau meninggalkan mereka.”'
    reason: Alternatif ini memakai ungkapan Indonesia yang lebih padat untuk idiom עשה כלה dan mempertahankan makna luas verba עזב.
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Namun, karena belas kasihan-Mu yang melimpah
  rationale: Waw berfungsi adversatif dalam konteks, sehingga diterjemahkan “Namun”. Preposisi בְ dipahami sebagai dasar atau alasan tindakan Allah, sedangkan bentuk jamak רַחֲמִים dengan הָרַבִּים menyatakan belas kasihan yang sangat berlimpah.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: Engkau tidak membinasakan mereka sama sekali
  rationale: Idiom עשה כלה berarti menghabisi atau membawa kepada kebinasaan total. Ungkapan ini menyampaikan ancaman pemusnahan menyeluruh secara jelas dan alami dalam bahasa Indonesia.
- source_word: וְלֹא עֲזַבְתָּם
  choice: ataupun meninggalkan mereka
  rationale: עזב berarti meninggalkan, menelantarkan, atau membiarkan. “Meninggalkan” mempertahankan keluasan makna Ibrani, sedangkan “ataupun” menghubungkan kedua penyangkalan secara alami.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi tindakan Allah yang penuh belas kasihan.
- source_word: אֵל
  choice: Allah
  rationale: אֵל di sini merupakan sebutan umum bagi Allah; konteks tidak mengharuskan penambahan gagasan “Mahakuasa” atau “perkasa”.
- source_word: חַנּוּן
  choice: penuh anugerah
  rationale: חַנּוּן menggambarkan Dia yang memberikan kemurahan atau anugerah. Frasa “penuh anugerah” alami sebagai sifat Allah dan menjaga perbedaannya dari רַחוּם.
- source_word: וְרַחוּם
  choice: dan belas kasihan
  rationale: רַחוּם menyatakan sifat penyayang atau berbelas kasihan. Dalam konstruksi “Allah yang penuh anugerah dan belas kasihan”, kedua nomina sama-sama berada di bawah cakupan “penuh”, menghasilkan bahasa Indonesia yang ringkas dan wajar.
- source_word: אָתָּה
  choice: Engkau adalah
  rationale: Pronomina mandiri memberi penekanan pada Allah sebagai subjek; dalam bahasa Indonesia, kopula “adalah” membuat klausa nominal ini jelas dan bermartabat.
theological_decisions:
- issue: Rumusan sifat ilahi חַנּוּן וְרַחוּם
  choice: Allah yang penuh anugerah dan belas kasihan
  alternative: Allah yang pengasih dan penyayang
  rationale: Pilihan ini mempertahankan pembedaan leksikal antara kemurahan yang diberikan dan belas kasihan, tanpa memasukkan nuansa doktrinal tambahan. Susunannya juga menggemakan bentuk formula pengakuan tentang sifat Allah.
- issue: Daya penghubung waw pada awal ayat
  choice: 'adversatif: “Namun”'
  alternative: 'konektif sederhana: “Dan”'
  rationale: Dalam alur doa, ayat ini mempertentangkan pemberontakan Israel dengan belas kasihan Allah. “Namun” menyatakan fungsi wacana itu dengan jelas.
- issue: Cakupan כָּלָה dalam idiom עשה כלה
  choice: 'kebinasaan total: “membinasakan mereka sama sekali”'
  alternative: 'ungkapan lebih harfiah: “menghabisi mereka”'
  rationale: Idiom tersebut menunjuk pada tindakan membawa suatu kelompok kepada akhir sepenuhnya. Terjemahan ini mempertahankan bobot penghakiman tanpa menentukan cara kebinasaannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang dijelaskannya.
