source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: id
  text: Selama bertahun-tahun Engkau bersabar terhadap mereka dan memperingatkan mereka dengan Roh-Mu melalui para nabi-Mu,[a] tetapi mereka tidak mau mendengarkan. Karena itu, Engkau menyerahkan mereka ke dalam tangan bangsa-bangsa dari negeri-negeri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersaksi menentang mereka dengan Roh-Mu melalui para nabi-Mu.”'
    reason: Alternatif ini mempertahankan nuansa kesaksian atau dakwaan dalam וַתָּעַד בָּם.
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Selama bertahun-tahun Engkau bersabar terhadap mereka
  rationale: Ungkapan dengan משׁך dan עַל menyatakan diperpanjangnya masa kelonggaran atau ditundanya hukuman. Terjemahan ini menyampaikan kesabaran yang berlangsung lama secara alami dalam bahasa Indonesia.
- source_word: וַתָּעַד בָּם
  choice: dan memperingatkan mereka
  rationale: Bentuk hifil dari עוד dapat berarti memperingatkan, menegur dengan kesaksian, atau bersaksi terhadap seseorang. Dalam konteks seruan para nabi, 'memperingatkan' jelas dan alami, sementara nuansa yudisialnya dicatat dalam catatan kaki.
- source_word: בְּרוּחֲךָ
  choice: dengan Roh-Mu
  rationale: Dalam kaitannya dengan pelayanan para nabi, רוּחַ paling wajar menunjuk kepada Roh Allah sebagai sarana atau pelaku ilahi dalam penyampaian peringatan.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: melalui para nabi-Mu
  rationale: Secara harfiah 'dengan tangan para nabi-Mu'; idiom בְּיַד menyatakan perantaraan atau sarana, yang secara alami diterjemahkan 'melalui'.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: tetapi mereka tidak mau mendengarkan
  rationale: האזין berarti memasang telinga atau mendengarkan dengan sungguh-sungguh. 'Tidak mau' menyampaikan penolakan yang tersirat dalam konteks peringatan berulang.
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Karena itu, Engkau menyerahkan mereka ke dalam tangan
  rationale: Rangkaian narasi menunjukkan akibat dari penolakan mereka. 'Menyerahkan' cocok dengan idiom memberikan seseorang ke dalam kuasa pihak lain, sedangkan 'ke dalam tangan' mempertahankan citra Ibraninya.
- source_word: עַמֵּי הָאֲרָצֹת
  choice: bangsa-bangsa di berbagai negeri
  rationale: Frasa jamak ini menunjuk kepada bangsa-bangsa dari wilayah atau negeri lain. Terjemahan ini mempertahankan kemajemukan tanpa menimbulkan kesan bahwa yang dimaksud adalah seluruh bumi.
theological_decisions:
- issue: Rujukan רוּחֲךָ
  choice: Roh-Mu, yakni Roh Allah yang bekerja melalui para nabi
  alternative: roh-Mu sebagai napas atau sikap batin
  rationale: Susunan 'dengan Roh-Mu melalui para nabi-Mu' paling koheren menyatakan bahwa Roh Allah menjadi sumber atau pelaku peringatan kenabian, tanpa menambahkan rincian doktrinal yang tidak dinyatakan ayat ini.
- issue: Nuansa וַתָּעַד בָּם
  choice: memperingatkan mereka
  alternative: bersaksi menentang mereka
  rationale: Kata kerja ini memuat nuansa kesaksian yang menegur atau mendakwa. Teks utama memakai ungkapan Indonesia yang lebih langsung, sedangkan alternatif yang lebih formal dipertahankan dalam catatan kaki agar ketegangan leksikal tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina yang merujuk kepada Allah memakai huruf kapital. Struktur kalimat dibuat mudah dibaca sambil mempertahankan citra 'ke dalam tangan' dan ambiguitas leksikal utama melalui catatan kaki.
