  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: id
  text: Selama empat puluh tahun Engkau mencukupi kebutuhan mereka di padang gurun; mereka tidak kekurangan apa pun. Pakaian mereka tidak menjadi usang, dan kaki mereka tidak membengkak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bandingkan Ulangan 8:4.
    reason: cross_reference
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: Engkau mencukupi kebutuhan mereka
  rationale: Bentuk verba ini menyatakan tindakan menopang atau menyediakan kebutuhan secara berkelanjutan. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi pemeliharaan itu hanya pada makanan.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada wilayah liar, tandus, atau gurun; 'padang gurun' merupakan padanan baku dan sesuai dengan konteks perjalanan Israel.
- source_word: לֹא חָסֵרוּ
  choice: mereka tidak kekurangan apa pun
  rationale: 'Padanan idiomatis ini menyampaikan penyangkalan menyeluruh: segala kebutuhan mereka tercukupi.'
- source_word: שַׂלְמֹתֵיהֶם
  choice: Pakaian mereka
  rationale: Kata ini berarti pakaian atau kain sandang, kadang khususnya pakaian luar. 'Pakaian' jelas, wajar, dan cukup luas.
- source_word: לֹא בָלוּ
  choice: tidak menjadi usang
  rationale: Verba בלה menggambarkan sesuatu yang aus atau rusak karena pemakaian; 'menjadi usang' sesuai secara alami untuk pakaian.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: dan kaki mereka tidak membengkak
  rationale: בצק dalam konteks ini dipahami sebagai menjadi bengkak. Terjemahan ini ringkas dan mempertahankan gambaran pemeliharaan fisik.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Selama empat puluh tahun
  rationale: Konjungsi menghubungkan ayat ini dengan konteks sebelumnya, sedangkan frasa waktunya paling alami diterjemahkan 'Selama empat puluh tahun' dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Huruf kapital pada 'Engkau' mengikuti kebiasaan penulisan sapaan kepada Allah. Susunan kalimat mempertahankan tiga pernyataan tentang pemeliharaan Allah tanpa menambahkan penafsiran teologis.
