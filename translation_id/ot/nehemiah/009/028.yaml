source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: id
  text: Namun, ketika mereka mendapat ketenteraman, mereka berbuat jahat lagi di hadapan-Mu. Karena itu, Engkau meninggalkan mereka dalam kuasa musuh-musuh mereka[a], yang menguasai mereka. Lalu mereka kembali dan berseru kepada-Mu. Dari surga Engkau mendengar dan berkali-kali melepaskan mereka sesuai dengan belas kasihan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam tangan musuh-musuh mereka,” sebuah ungkapan Ibrani yang berarti berada di bawah kuasa atau kendali musuh.
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Namun, ketika mereka mendapat ketenteraman
  rationale: Konstruksi temporal ini menunjukkan keadaan ketika mereka kembali jatuh ke dalam kejahatan, tanpa menyiratkan bahwa hal itu terjadi seketika. 'Mendapat ketenteraman' mengungkapkan keadaan aman atau bebas dari tekanan.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: mereka berbuat jahat lagi
  rationale: Dengan infinitif yang mengikutinya, שׁוב menyatakan pengulangan tindakan. Ungkapan ini alami dalam bahasa Indonesia dan membedakannya dari tindakan berbalik kepada Allah pada klausa berikutnya.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Mempertahankan gambaran kehadiran atau wajah dalam bahasa Ibrani tanpa mempersempit maknanya menjadi sekadar penglihatan atau menafsirkannya langsung sebagai 'melawan-Mu'.
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: Engkau membiarkan mereka berada dalam kuasa musuh-musuh mereka
  rationale: עזב menyatakan bahwa Allah membiarkan atau meninggalkan mereka di bawah kendali musuh. Terjemahan ini mempertahankan kerasnya penghukuman tanpa menyiratkan penolakan mutlak dan permanen.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: yang menguasai mereka
  rationale: Kata kerja tersebut menunjuk pada pelaksanaan kuasa atau dominasi atas mereka; 'menguasai' tepat dan alami tanpa menambahkan gagasan penindasan yang tidak dinyatakan secara eksplisit.
- source_word: וַיָּשׁוּבוּ
  choice: Lalu mereka berbalik
  rationale: Di sini שׁוב memiliki makna leksikal berbalik atau kembali, berbeda dari pemakaian idiomatis sebelumnya yang menyatakan pengulangan kejahatan.
- source_word: וַיִּזְעָקוּךָ
  choice: dan berseru kepada-Mu
  rationale: זעק menyatakan seruan mendesak, biasanya untuk meminta pertolongan. 'Berseru' mempertahankan urgensi itu tanpa menambahkan kata-kata yang tidak ada dalam teks.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: Dari surga Engkau mendengar
  rationale: Mempertahankan penempatan frasa 'dari surga' di depan dan menyampaikan respons ilahi secara alami.
- source_word: וְתַצִּילֵם
  choice: dan ... melepaskan mereka
  rationale: נצל di sini berarti membebaskan atau menyelamatkan dari kuasa musuh. 'Melepaskan' cocok dengan konteks historis dan tidak memperluasnya menjadi keselamatan dalam arti teologis yang lebih menyeluruh.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: berkali-kali ... sesuai dengan belas kasihan-Mu
  rationale: רבות menerangkan עִתִּים ('kali/waktu'), bukan רַחֲמֶיךָ. Karena itu, gagasan banyaknya melekat pada tindakan pelepasan yang berulang, sedangkan belas kasihan Allah menjadi dasarnya.
theological_decisions:
- issue: Bahasa tentang Allah membiarkan umat berada di bawah kuasa musuh
  choice: Engkau membiarkan mereka berada dalam kuasa musuh-musuh mereka
  alternative: Engkau meninggalkan mereka ke dalam tangan musuh-musuh mereka
  rationale: Teks menggambarkan penghukuman perjanjian melalui penarikan perlindungan, bukan penelantaran mutlak. Pilihan ini menjaga ketegangan antara penghukuman Allah dan belas kasihan-Nya yang kemudian melepaskan mereka.
- issue: Aspek berulang pada klausa terakhir
  choice: Dari surga Engkau mendengar dan berkali-kali melepaskan mereka
  alternative: Dari surga Engkau berulang kali mendengar dan melepaskan mereka
  rationale: Bentuk verba dalam ringkasan historis ini dapat menyatakan tindakan lampau yang berulang. 'Berkali-kali' secara jelas menerangkan rangkaian respons dan pelepasan tanpa mengubahnya menjadi pernyataan kebiasaan yang tidak bertumpu pada peristiwa lampau.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang khidmat namun mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital. Kalimat dipecah secara wajar agar alur kejatuhan, penghukuman, pertobatan, dan pelepasan tetap jelas.
