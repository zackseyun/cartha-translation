- from: Namun, ketika mereka mendapat ketenteraman, mereka berbuat jahat lagi di hadapan-Mu. Karena itu, Engkau membiarkan mereka berada dalam kuasa musuh-musuh mereka[a], yang menguasai mereka. Lalu mereka berbalik dan berseru kepada-Mu. Dari surga Engkau mendengar dan berkali-kali melepaskan mereka sesuai dengan belas kasihan-Mu.
