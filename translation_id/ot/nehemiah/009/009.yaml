source:
  edition: WLC
  text: וַ/תֵּ֛רֶא אֶת עֳנִ֥י אֲבֹתֵ֖י/נוּ בְּ/מִצְרָ֑יִם וְ/אֶת זַעֲקָתָ֥/ם שָׁמַ֖עְתָּ עַל יַם סֽוּף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/009.yaml
  text: You saw the affliction of our fathers in Egypt[a], and you heard their cry at the Red Sea.
translation:
  language: id
  text: Engkau melihat penderitaan nenek moyang kami di Mesir dan mendengar seruan mereka di tepi Laut Merah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Laut Gelagah.” Secara tradisional diterjemahkan “Laut Merah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Engkau melihat
  rationale: Menerjemahkan secara langsung verba ראה dan mempertahankan sapaan orang kedua tunggal kepada Allah; dalam konteks ini, tindakan melihat juga menyiratkan bahwa Allah memperhatikan keadaan mereka.
- source_word: עֳנִי
  choice: penderitaan
  rationale: Kata ini mencakup kesengsaraan atau keadaan tertindas. 'Penderitaan' alami dalam bahasa Indonesia dan tidak mempersempit penyebabnya.
- source_word: אֲבֹתֵינוּ
  choice: nenek moyang kami
  rationale: Ungkapan Indonesia yang wajar untuk para leluhur komunitas; lebih alami daripada terjemahan harfiah 'bapa-bapa kami' dalam konteks historis ini.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Frasa lokatif langsung yang menunjukkan tempat penderitaan mereka.
- source_word: זַעֲקָתָם
  choice: seruan mereka
  rationale: זְעָקָה adalah seruan dalam kesusahan atau permohonan pertolongan; 'seruan' menjaga bobot makna dan kelancaran bahasa.
- source_word: שָׁמַעְתָּ
  choice: mendengar
  rationale: Terjemahan langsung yang dalam konteks doa dapat menyiratkan bahwa Allah mengindahkan seruan itu tanpa menambahkan gagasan tersebut ke teks utama.
- source_word: עַל
  choice: di tepi
  rationale: Dalam kaitan dengan lokasi perairan, עַל menunjukkan keberadaan di dekat atau pada sisi laut; 'di tepi' jelas dan alami dalam bahasa Indonesia.
- source_word: יַם סוּף
  choice: Laut Merah
  rationale: Nama geografis tradisional yang paling dikenal pembaca Indonesia. Arti leksikal Ibraninya, 'Laut Gelagah', dicantumkan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa doa yang modern, lugas, dan bermartabat. Pronomina 'Engkau' mempertahankan sapaan langsung kepada Allah; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk sapaan ilahi. Penanda catatan kaki ditempatkan tepat setelah nama laut yang dijelaskannya.
