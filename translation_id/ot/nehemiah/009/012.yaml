source:
  edition: WLC
  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: id
  text: Dengan tiang awan Engkau menuntun mereka pada siang hari, dan dengan tiang api pada malam hari untuk memberi mereka cahaya[a] di jalan yang harus mereka tempuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk menerangi jalan bagi mereka.” Secara harfiah, teks Ibrani berbunyi “untuk menerangi bagi mereka jalan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: Dengan tiang awan
  rationale: Preposisi ב dapat menyatakan sarana atau lokasi. “Dengan” secara alami menyampaikan sarana yang dipakai Allah untuk menuntun mereka tanpa menutup nuansa lokatif.
- source_word: הִנְחִיתָם
  choice: Engkau menuntun mereka
  rationale: Bentuk Hifil dari נחה di sini berarti membimbing atau menuntun. “Menuntun” sesuai dengan konteks perjalanan di padang gurun.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Ungkapan temporal ini berpasangan secara alami dengan “pada malam hari” dalam bahasa Indonesia modern.
- source_word: וּבְעַמּוּד אֵשׁ
  choice: dan dengan tiang api
  rationale: Terjemahan ini mempertahankan kesejajaran dengan “dengan tiang awan” serta nuansa instrumental dari ב.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Padanan temporal yang alami dan seimbang dengan “pada siang hari”.
- source_word: לְהָאִיר לָהֶם
  choice: untuk memberi mereka cahaya
  rationale: Infinitif Hifil dari אור menyatakan tujuan, sedangkan לָהֶם menyatakan pihak yang menerima manfaat. Ungkapan ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: אֶת הַדֶּרֶךְ
  choice: di jalan
  rationale: Secara gramatikal “jalan” adalah objek yang diterangi, tetapi konstruksi Indonesia “memberi mereka cahaya di jalan” menyampaikan maknanya dengan wajar.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: yang harus mereka tempuh
  rationale: Klausa relatif ini menunjuk rute yang dimaksudkan untuk mereka lalui. “Tempuh” lebih alami daripada terjemahan harfiah “berjalan di dalamnya” dan tetap mempertahankan gagasan arah yang ditetapkan.
theological_decisions:
- issue: Gambaran tuntunan ilahi dalam tradisi perjalanan di padang gurun
  choice: Menerjemahkannya sebagai tindakan historis Allah menuntun Israel melalui tiang awan dan tiang api.
  alternative: Menonjolkan makna simbolis tentang kehadiran ilahi atau tipologi tertentu di dalam teks utama.
  rationale: Teks Ibrani menekankan tindakan konkret Allah dalam menuntun dan menerangi perjalanan umat. Penafsiran simbolis atau tipologis tidak dimasukkan ke dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” mempertahankan bentuk orang kedua tunggal yang ditujukan kepada Allah. Struktur paralel antara siang dan malam dipertahankan.
