  text: וְ/הַ/יָּם֙ בָּקַ֣עְתָּ לִ/פְנֵי/הֶ֔ם וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָׁ֑ה וְֽ/אֶת רֹ֨דְפֵי/הֶ֜ם הִשְׁלַ֧כְתָּ בִ/מְצוֹלֹ֛ת כְּמוֹ אֶ֖בֶן בְּ/מַ֥יִם עַזִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: id
  text: Engkau membelah laut di hadapan mereka[a], dan mereka melintas di tengah laut itu di tanah kering; dan para pengejar mereka Kaulemparkan ke kedalaman, seperti batu di dalam air yang dahsyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membagi laut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: membelah
  rationale: Kata kerja בקע menggambarkan tindakan membelah atau membuka dengan belahan. “Membelah” lugas, hidup, dan alami dalam bahasa Indonesia.
- source_word: לִפְנֵיהֶם
  choice: di hadapan mereka
  rationale: Ungkapan ini secara idiomatis berarti “di hadapan” atau “di depan”; pilihan ini sesuai dengan ragam doa yang khidmat.
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: mereka berjalan melalui tengah laut
  rationale: עבר menyatakan pergerakan melintasi, sedangkan בְתוֹךְ mempertahankan gambaran bahwa mereka berada di bagian dalam atau tengah laut. “Berjalan melalui” juga berpadu alami dengan keterangan tanah kering.
- source_word: בַּיַּבָּשָׁה
  choice: di tanah kering
  rationale: Frasa ini menyatakan bahwa permukaan yang mereka lalui kering; terjemahan ini ringkas dan wajar tanpa menambahkan penjelasan.
- source_word: רֹדְפֵיהֶם
  choice: para pengejar mereka
  rationale: Partisipel dari רדף menunjuk kepada orang-orang yang sedang mengejar mereka; “para pengejar” langsung dan tepat dalam konteks keluaran.
- source_word: הִשְׁלַכְתָּ
  choice: Kaulemparkan
  rationale: Bentuk kausatif ini menyatakan tindakan melemparkan. Bentuk pronominal mempertahankan sapaan langsung kepada Allah.
- source_word: בִמְצוֹלֹת
  choice: ke kedalaman
  rationale: מְצוֹלוֹת menunjuk pada bagian-bagian laut yang dalam. “Ke kedalaman” mempertahankan arah gerak yang tersirat oleh tindakan melemparkan.
- source_word: כְּמוֹ אֶבֶן
  choice: seperti batu
  rationale: Perbandingan sederhana dalam sumber dipertahankan secara langsung dan alami.
- source_word: בְּמַיִם עַזִּים
  choice: ke dalam air yang dahsyat
  rationale: עַזִּים berarti kuat atau dahsyat. “Air yang dahsyat” mempertahankan nada luhur tanpa secara khusus menafsirkan air itu sebagai bergelora; “ke dalam” membuat hubungan gerak dalam perumpamaan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan ilahi dalam pengingatan peristiwa keluaran
  choice: 'Mempertahankan sapaan orang kedua langsung: “Engkau membelah” dan “Kaulemparkan.”'
  alternative: Mengubahnya menjadi narasi orang ketiga atau rumusan impersonal.
  rationale: Ayat ini merupakan bagian dari doa bersama yang mengenang tindakan penyelamatan Allah. Sapaan langsung mempertahankan daya pengakuan dan pujian dalam teks sumber.
- issue: Hubungan antarklausa penyelamatan dan penghukuman
  choice: Menggunakan “tetapi” sebelum tindakan terhadap para pengejar.
  alternative: Menggunakan “dan” secara seragam.
  rationale: וְ dapat menyatakan kelanjutan sekaligus kontras kontekstual. “Tetapi” secara alami menonjolkan nasib berlawanan antara umat yang melintas dan para pengejar yang dilemparkan, tanpa menambah isi teologis.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami, sesuai konteks doa. Kapitalisasi pada “Engkau” dan bentuk terikat “Kau-” menandai sapaan kepada Allah. Hanya satu catatan kaki dipakai karena alternatif yang bermakna terdapat pada בקע; frasa בַּיַּבָּשָׁה tidak mendukung alternatif “ke dalam tempat-tempat dalam” yang tercantum sebagai catatan b pada lapisan konsultasi Inggris.
