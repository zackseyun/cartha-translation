reference: Nehemiah 9:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: id
  text: Namun Engkau, dalam belas kasih-Mu yang besar[a], tidak meninggalkan mereka di padang belantara. Tiang awan tidak beranjak dari atas mereka pada siang hari untuk menuntun mereka di jalan, dan demikian juga tiang api pada malam hari tidak beranjak untuk memberi terang kepada mereka dan jalan yang akan mereka tempuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam belas kasih-Mu yang banyak”; kata Ibrani untuk “belas kasih” berbentuk jamak. Dapat juga diterjemahkan, “dalam belas kasih-Mu yang melimpah.”
    reason: Menjelaskan bentuk jamak רַחֲמִים dan penekanan הָרַבִּים tanpa mengubah keluwesan bahasa Indonesia.
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: dalam kemurahan hati-Mu yang berlimpah
  rationale: רַחֲמִים menyatakan belas kasih atau kemurahan hati; frasa ini mempertahankan gagasan kelimpahan dalam הָרַבִּים dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: עֲזַבְתָּם
  choice: tidak meninggalkan mereka
  rationale: עזב dapat berarti meninggalkan atau menelantarkan. 'Tidak meninggalkan' dekat dengan bentuk sumber dan jelas dalam bahasa Indonesia modern.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar dan gersang tempat Israel mengembara; 'padang belantara' tidak membatasi gambaran hanya pada gurun pasir.
- source_word: עַמּוּד הֶעָנָן
  choice: tiang awan
  rationale: Terjemahan langsung dan lazim yang mempertahankan kaitan dengan kisah Keluaran.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: tidak menjauh dari atas mereka
  rationale: סור berarti beralih atau menjauh, sedangkan מֵעֲלֵיהֶם mempertahankan keterangan ruang 'dari atas mereka'.
- source_word: בְּיוֹמָם
  choice: pada siang hari
  rationale: Ungkapan waktu yang alami dan sejajar dengan 'pada malam hari'.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: untuk menuntun mereka di jalan
  rationale: Hifil נחה berarti menuntun atau membimbing; 'di jalan' mencerminkan preposisi בְּ tanpa mempersempitnya menjadi jalan tertentu yang tidak dinyatakan.
- source_word: עַמּוּד הָאֵשׁ
  choice: tiang api
  rationale: Terjemahan langsung dan lazim, serta mempertahankan kesejajaran dengan 'tiang awan'.
- source_word: לְהָאִיר לָהֶם
  choice: untuk menerangi mereka
  rationale: Hifil אור berarti memberi terang atau menerangi; bentuk ini ringkas dan alami.
- source_word: וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: dan jalan yang harus mereka tempuh
  rationale: Penanda objek אֶת mendukung koordinasi 'mereka dan jalan' sebagai objek penerangan. 'Harus mereka tempuh' menyampaikan arah perjalanan tanpa menjadikannya perintah yang terlalu tegas.
theological_decisions:
- issue: Bahasa mengenai belas kasih ilahi
  choice: kemurahan hati-Mu yang berlimpah
  alternative: belas kasih-Mu yang besar; berbagai belas kasih-Mu
  rationale: Bentuk jamak Ibrani רַחֲמִים merupakan bentuk leksikal yang lazim dan disertai הָרַבִּים, yang menekankan banyaknya atau besarnya belas kasih. Terjemahan utama menyatakan kelimpahan tanpa menghasilkan frasa Indonesia yang kaku; catatan mempertahankan bentuk harfiahnya.
- issue: Hubungan sintaksis objek penerangan
  choice: menerangi mereka dan jalan yang harus mereka tempuh
  alternative: memberi mereka terang di jalan yang harus mereka tempuh
  rationale: Pengulangan אֶת sebelum הַדֶּרֶךְ paling wajar dipertahankan sebagai objek kedua yang dikoordinasikan dengan pronomina pada לָהֶם, walaupun alternatif lokatif menghasilkan bahasa sasaran yang lebih biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-doa yang khidmat. Sapaan kepada Allah memakai huruf kapital. Struktur paralel siang–malam dipertahankan, demikian pula koordinasi yang agak tidak biasa antara orang-orang dan jalan sebagai objek penerangan.
