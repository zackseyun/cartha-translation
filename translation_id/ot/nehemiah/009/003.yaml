source:
  edition: WLC
  text: וַ/יָּק֨וּמוּ֙ עַל עָמְדָ֔/ם וַֽ/יִּקְרְא֗וּ בְּ/סֵ֨פֶר תּוֹרַ֧ת יְהוָ֛ה אֱלֹהֵי/הֶ֖ם רְבִעִ֣ית הַ/יּ֑וֹם וּ/רְבִעִית֙ מִתְוַדִּ֣ים וּ/מִֽשְׁתַּחֲוִ֔ים לַ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/003.yaml
  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: id
  text: Mereka berdiri di tempat mereka[a], lalu membaca dari Kitab Taurat Yahweh, Allah mereka, selama seperempat hari[b]. Selama seperempat hari berikutnya, mereka mengaku dan bersujud kepada Yahweh, Allah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat mereka berdiri”; mungkin juga “di panggung mereka.” Ungkapan Ibraninya padat dan dapat dipahami dalam beberapa cara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperempat hari ... dan seperempat.” Jadi, seperempat hari dipakai untuk membaca, lalu seperempat hari lagi untuk mengaku dan bersujud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקוּמוּ עַל עָמְדָם
  choice: Mereka berdiri di tempat mereka
  rationale: Ungkapan Ibrani ini secara harfiah dan padat menunjuk pada tindakan berdiri di tempat atau posisi mereka. Terjemahan ini alami dalam bahasa Indonesia tanpa memastikan bahwa yang dimaksud ialah panggung.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: lalu membaca dari Kitab Taurat
  rationale: Dengan objek berupa kitab, קרא berarti membaca; preposisi ב dapat menyatakan sumber bacaan. 'Kitab Taurat' merupakan padanan Indonesia yang jelas bagi סֵפֶר תּוֹרַת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: selama seperempat hari ... selama seperempat hari berikutnya
  rationale: Kedua frasa menunjuk pada dua jangka waktu berturut-turut, masing-masing seperempat hari. 'Berikutnya' mengungkapkan elipsis dan urutan yang tersirat tanpa mengubah durasinya.
- source_word: מִתְוַדִּים
  choice: mereka mengakui dosa
  rationale: Dalam konteks pertobatan komunal, bentuk Hitpael dari ידה berarti mengaku, khususnya mengakui dosa. Penambahan objek 'dosa' membuat maksud verba alami dan jelas dalam bahasa Indonesia.
- source_word: וּמִשְׁתַּחֲוִים
  choice: dan sujud menyembah
  rationale: Verba ini memadukan gerak tubuh merendahkan diri dengan tindakan ibadah. 'Sujud menyembah' mempertahankan unsur jasmani sekaligus arah religius yang ditandai oleh לַיהוָה.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Makna מִשְׁתַּחֲוִים
  choice: sujud menyembah
  alternative: bersujud; menyembah
  rationale: Pilihan ini mempertahankan tindakan jasmani dan makna ibadah sekaligus, tanpa mengabstraksikannya menjadi 'menyembah' saja.
- issue: Objek pengakuan dalam מִתְוַדִּים
  choice: mengakui dosa
  alternative: mengaku
  rationale: Objek tidak dinyatakan secara eksplisit dalam klausa ini, tetapi konteks perhimpunan pertobatan dan pemakaian verba mendukung pengakuan dosa. Padanan ini menyampaikan pengertian itu secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibagi menjadi dua agar mudah dibaca, sementara urutan tindakan dan dua jangka waktu paralel dalam bahasa Ibrani tetap dipertahankan.
