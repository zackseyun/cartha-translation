  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: id
  text: Maka kami berdoa kepada Allah kami dan menempatkan penjaga terhadap mereka siang dan malam karena mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengadakan penjagaan terhadap mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari hadapan mereka”; dapat juga berarti “karena mereka” atau “oleh sebab mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: kami berdoa
  rationale: Bentuk hitpael dari פלל lazim berarti ‘berdoa’; ungkapan ini alami dan tidak menambahkan intensitas yang tidak dinyatakan.
- source_word: אֶל אֱלֹהֵינוּ
  choice: kepada Allah kami
  rationale: Preposisi אֶל diterjemahkan ‘kepada’, dan akhiran orang pertama jamak dipertahankan dengan ‘Allah kami’.
- source_word: וַנַּעֲמִיד מִשְׁמָר
  choice: menempatkan penjaga
  rationale: Bentuk hifil עמד menyatakan tindakan menempatkan, sedangkan מִשְׁמָר dapat menunjuk penjagaan atau kelompok penjaga; ‘menempatkan penjaga’ wajar dalam konteks pertahanan.
- source_word: עֲלֵיהֶם
  choice: untuk menghadapi mereka
  rationale: Dalam konteks permusuhan, עַל menyatakan arah penjagaan terhadap pihak lawan. ‘Untuk menghadapi mereka’ lebih alami daripada ‘atas mereka’ dan tidak menyiratkan serangan.
- source_word: יוֹמָם וָלַיְלָה
  choice: siang dan malam
  rationale: Ungkapan merismatik ini secara alami menunjukkan penjagaan terus-menerus.
- source_word: מִפְּנֵיהֶם
  choice: karena ancaman mereka
  rationale: Secara harfiah berarti ‘dari hadapan mereka’; dalam konteks, frasa ini memberi alasan penempatan penjaga. ‘Karena ancaman mereka’ memperjelas rujukan tanpa menyatakan bahwa ketakutan adalah motifnya.
theological_decisions:
- issue: Tanggapan terhadap perlawanan
  choice: Doa dan langkah pertahanan praktis disajikan sebagai dua tindakan yang sejajar.
  alternative: Menonjolkan hanya doa atau hanya kesiagaan pertahanan.
  rationale: Teks Ibrani mengoordinasikan berdoa kepada Allah dan menempatkan penjaga; terjemahan mempertahankan ketegangan ini tanpa mengutamakan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Maka’ menghubungkan tindakan ini dengan konteks sebelumnya; ‘penjaga’ mudah dipahami sebagai orang-orang yang ditugaskan berjaga.
