translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'mereka semua ... bersama-sama' sengaja mempertahankan dua unsur penegasan kolektif dalam teks Ibrani, meskipun menghasilkan sedikit pengulangan yang tetap mudah dipahami.
