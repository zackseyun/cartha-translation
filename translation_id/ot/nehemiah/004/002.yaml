  text: וַ/יִּקְשְׁר֤וּ כֻלָּ/ם֙ יַחְדָּ֔ו לָ/ב֖וֹא לְ/הִלָּחֵ֣ם בִּ/ירוּשָׁלִָ֑ם וְ/לַ/עֲשׂ֥וֹת ל֖/וֹ תּוֹעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: id
  text: Lalu mereka semua bersekongkol bersama-sama untuk datang memerangi Yerusalem dan menimbulkan kekacauan di dalamnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menimbulkan gangguan di dalamnya.” Kata Ibrani ini dapat berarti kekacauan, gangguan, atau keadaan tidak teratur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: bersekongkol
  rationale: Dalam konteks tindakan bermusuhan yang terkoordinasi, bentuk qal dari קשר menyatakan pembentukan persekongkolan atau ikatan untuk melawan pihak lain.
- source_word: כֻלָּם
  choice: mereka semua
  rationale: Bentuk berpronomina ini menekankan keseluruhan kelompok yang telah disebutkan sebelumnya.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Kata keterangan ini menegaskan bahwa tindakan tersebut dilakukan secara terkoordinasi; pengulangan makna kolektif dipertahankan karena juga terdapat dalam teks Ibrani.
- source_word: לָבוֹא
  choice: untuk datang
  rationale: Infinitif ini secara harfiah menyatakan gerak 'datang'. Unsur gerak dipertahankan dan tidak dilebur ke dalam kata 'menyerang'.
- source_word: לְהִלָּחֵם
  choice: memerangi
  rationale: Bentuk nifal dari לחם berarti terlibat dalam pertempuran. 'Memerangi' menyampaikan tindakan bermusuhan terhadap Yerusalem secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: בִּירוּשָׁלָם
  choice: Yerusalem
  rationale: Dengan verba peperangan, preposisi ב menandai sasaran tindakan; dalam bahasa Indonesia hubungan itu sudah dinyatakan secara alami oleh verba transitif 'memerangi'.
- source_word: וְלַעֲשׂוֹת
  choice: dan menimbulkan
  rationale: עשה pada konstruksi ini berarti membuat atau mendatangkan suatu keadaan. 'Menimbulkan' merupakan padanan Indonesia yang alami.
- source_word: לוֹ
  choice: di dalamnya
  rationale: Pronomina tunggal ini merujuk kembali kepada Yerusalem. Ungkapan lokatif 'di dalamnya' menyatakan bahwa keadaan tersebut hendak ditimbulkan di kota itu.
- source_word: תּוֹעָה
  choice: kekacauan
  rationale: Nomina ini dapat menunjuk pada kebingungan, gangguan, atau keadaan tidak teratur. 'Kekacauan' sesuai dengan konteks upaya menghambat pembangunan tanpa mempersempit maknanya secara berlebihan.
