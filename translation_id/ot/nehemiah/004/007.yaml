  text: וָֽ/אַעֲמִ֞יד מִֽ/תַּחְתִּיּ֧וֹת לַ/מָּק֛וֹם מֵ/אַחֲרֵ֥י לַ/חוֹמָ֖ה ב/צחחיים וָֽ/אַעֲמִ֤יד אֶת הָ/עָם֙ לְ/מִשְׁפָּח֔וֹת עִם חַרְבֹתֵי/הֶ֛ם רָמְחֵי/הֶ֖ם וְ/קַשְּׁתֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: id
  text: Lalu aku menempatkan orang-orang di bagian-bagian terendah dari tempat itu, di belakang tembok, di tempat-tempat terbuka[a]. Aku menempatkan rakyat menurut keluarga mereka, dengan pedang, tombak, dan busur mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat-tempat yang gundul/tidak terlindung.” Kata Ibrani ini jarang dipakai dan mungkin menunjuk pada bagian-bagian terbuka yang rentan terhadap serangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: aku menempatkan
  rationale: Bentuk Hifil dari עמד bersifat kausatif dan dalam konteks pertahanan berarti menempatkan atau menugaskan orang pada posisi tertentu. Kata “menempatkan” wajar dalam bahasa Indonesia dan sesuai dengan konteks militer.
- source_word: מִתַּחְתִּיּוֹת
  choice: di bagian-bagian terendah
  rationale: Bentuk jamak ini menunjuk pada bagian-bagian yang rendah atau paling rendah. Terjemahan ini mempertahankan makna ruang tanpa menentukan secara berlebihan bagaimana bagian itu rentan.
- source_word: לַמָּקוֹם
  choice: dari tempat itu
  rationale: מקום berarti tempat atau lokasi. Frasa ini dihubungkan dengan “bagian-bagian terendah” agar susunan ruang dalam bahasa Indonesia tetap jelas.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: di belakang tembok
  rationale: Ungkapan ini menyatakan posisi di sisi belakang tembok; “di belakang tembok” merupakan padanan Indonesia yang alami dan langsung.
- source_word: בצחחיים
  choice: di tempat-tempat terbuka
  rationale: Istilah jamak yang langka ini mungkin menunjuk pada tempat yang gundul, terbuka, atau tidak terlindung. “Tempat-tempat terbuka” mempertahankan kemungkinan taktis tersebut tanpa menafsirkannya semata-mata sebagai tanah kering.
- source_word: וָאַעֲמִיד אֶת־הָעָם
  choice: Aku menempatkan rakyat
  rationale: Pengulangan kata kerja dalam sumber dipertahankan untuk menonjolkan tindakan Nehemia dalam mengatur pertahanan. הָעָם di sini menunjuk pada rakyat yang dikerahkan.
- source_word: לְמִשְׁפָּחוֹת
  choice: menurut keluarga mereka
  rationale: מִשְׁפָּחוֹת dapat berarti keluarga besar atau kelompok kekerabatan. Ungkapan ini alami bagi pembaca Indonesia dan mempertahankan dasar pengelompokan sosialnya.
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: dengan pedang, tombak, dan busur mereka
  rationale: Daftar tiga jenis senjata diterjemahkan secara langsung dan urutannya dipertahankan. Sufiks milik jamak dinyatakan sekali pada akhir daftar, sesuai kelaziman bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan “aku menempatkan” mengikuti penekanan teks Ibrani. Objek “orang-orang” pada klausa pertama dipasok dari konteks karena verba Ibrani tidak menyebutkannya secara eksplisit, tetapi tindakan berikutnya jelas menyangkut pengerahan rakyat.
