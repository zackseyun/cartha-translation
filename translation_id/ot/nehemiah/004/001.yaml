revisions:
- from: Ketika Sanbalat, Tobia, orang-orang Arab, orang-orang Amon, dan orang-orang Asdod mendengar bahwa perbaikan tembok-tembok Yerusalem telah maju[a] dan bahwa bagian-bagian yang jebol mulai ditutup[b], mereka menjadi sangat marah.
  to: Ketika Sanbalat, Tobia, orang-orang Arab, orang-orang Amon, dan orang-orang Asdod mendengar bahwa perbaikan pada tembok-tembok Yerusalem telah mengalami kemajuan[a] dan bahwa bagian-bagian yang berlubang mulai ditutup[b], mereka menjadi sangat marah.
  rationale: Revisi terbatas pada dua pilihan leksikal demi kelancaran bahasa Indonesia. "Telah mengalami kemajuan" menerjemahkan gagasan bahwa pekerjaan perbaikan telah maju, sedangkan "bagian-bagian yang berlubang" menyatakan celah pada tembok yang mulai ditutup. Tidak ada perubahan pada cakupan kelompok, urutan informasi, atau kadar penegasan sumber.
