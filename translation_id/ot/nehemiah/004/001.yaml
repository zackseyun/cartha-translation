id: NEH.4.1
reference: Nehemiah 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר שָׁמַ֣ע סַנְבַלַּ֡ט וְ֠/טוֹבִיָּה וְ/הָ/עַרְבִ֨ים וְ/הָ/עַמֹּנִ֜ים וְ/הָ/אַשְׁדּוֹדִ֗ים כִּֽי עָלְתָ֤ה אֲרוּכָה֙ לְ/חֹמ֣וֹת יְרוּשָׁלִַ֔ם כִּי הֵחֵ֥לּוּ הַ/פְּרֻצִ֖ים לְ/הִסָּתֵ֑ם וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: id
  text: Ketika Sanbalat, Tobia, orang-orang Arab, orang-orang Amon, dan orang-orang Asdod mendengar bahwa perbaikan pada tembok-tembok Yerusalem telah mengalami kemajuan[a] dan bahwa bagian-bagian yang berlubang mulai ditutup[b], mereka menjadi sangat marah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pemulihan tembok-tembok Yerusalem telah naik.” Kata Ibrani yang dipakai sering berkaitan dengan penyembuhan atau pemulihan dan di sini secara kiasan menunjuk pada perbaikan tembok.
    reason: lexical_alternative
  - marker: b
    text: Atau “celah-celah mulai ditutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Ketika
  rationale: Ungkapan naratif ini memperkenalkan keadaan waktu. 'Ketika' alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak tersurat.
- source_word: שָׁמַע
  choice: mendengar
  rationale: Makna langsungnya ialah mendengar atau menerima kabar; 'mendengar' tepat dan alami dalam konteks ini.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Sanbalat, Tobia
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הָעַרְבִים
  choice: orang-orang Arab
  rationale: Menunjuk kelompok bangsa Arab; bentuk ini jelas dan wajar bagi pembaca Indonesia masa kini.
- source_word: הָעַמֹּנִים
  choice: orang-orang Amon
  rationale: Bentuk gentilik diterjemahkan secara alami sebagai kelompok orang yang berasal dari Amon.
- source_word: הָאַשְׁדּוֹדִים
  choice: orang-orang Asdod
  rationale: Menunjuk penduduk atau kelompok dari Asdod; bentuk analitis ini lebih alami daripada menciptakan gentilik Indonesia yang tidak umum.
- source_word: עָלְתָה אֲרוּכָה
  choice: perbaikan ... telah maju
  rationale: אֲרוּכָה dapat berarti pemulihan atau penyembuhan dan secara metaforis menunjuk perbaikan tembok; עָלְתָה mempertahankan gagasan bahwa pekerjaan itu meningkat atau mengalami kemajuan.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: tembok-tembok Yerusalem
  rationale: Bentuk jamak sumber dipertahankan, sementara hubungan dengan Yerusalem diungkapkan secara idiomatis.
- source_word: כִּי
  choice: bahwa
  rationale: Dalam kedua kemunculannya, kata ini paling wajar dipahami sebagai pengantar isi berita yang mereka dengar.
- source_word: הֵחֵלּוּ
  choice: mulai
  rationale: Menyatakan bahwa proses penutupan baru telah dimulai; urutan waktunya sudah jelas dari konteks kalimat.
- source_word: הַפְּרֻצִים
  choice: bagian-bagian yang jebol
  rationale: Menunjuk bagian tembok yang terbuka akibat kerusakan. Pilihan ini tepat sekaligus mudah dipahami oleh pembaca umum.
- source_word: לְהִסָּתֵם
  choice: ditutup
  rationale: Bentuk pasif menyatakan bahwa bukaan pada tembok sedang ditutup atau disumbat.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: mereka menjadi sangat marah
  rationale: Ungkapan idiomatis Ibrani tentang kemarahan diterjemahkan dengan padanan Indonesia yang alami dan kuat.
