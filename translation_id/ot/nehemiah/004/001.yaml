  source_fidelity: 'Makna pokok diterjemahkan dengan setia: semua kelompok yang disebut dalam teks Ibrani dipertahankan, berita yang mereka dengar mencakup kemajuan perbaikan tembok dan mulai tertutupnya bagian-bagian yang rusak, serta respons mereka yang sangat marah. Penanda a dan b ditempatkan pada unsur yang tepat. Namun, "perbaikan ... telah maju" kurang idiomatis dalam bahasa Indonesia untuk menyatakan kemajuan pekerjaan.'
