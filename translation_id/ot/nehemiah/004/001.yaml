  terminology: '"Sanbalat," "Tobia," "orang-orang Arab," "orang-orang Amon," dan "orang-orang Asdod" sesuai penggunaan Indonesia yang jelas. "Bagian-bagian yang jebol" dapat dipahami, tetapi "bagian-bagian yang berlubang" lebih langsung menggambarkan פרצים sebagai bukaan atau rekahan pada tembok yang sedang ditutup.'
