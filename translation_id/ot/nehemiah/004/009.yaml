source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: id
  text: Ketika musuh-musuh kami mendengar bahwa kami telah mengetahuinya[a] dan bahwa Allah telah menggagalkan rencana mereka[b], kami semua kembali ke tembok, masing-masing ke pekerjaannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bahwa hal itu telah diketahui oleh kami.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah membatalkan siasat mereka.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ungkapan Ibrani bersifat distributif: setiap pekerja kembali kepada pekerjaannya sendiri.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Dalam alur narasi ini, gabungan penanda perkembangan וַיְהִי dan klausa temporal כַּאֲשֶׁר paling alami dinyatakan dengan 'Ketika'; pembukaan terpisah seperti 'Terjadilah' akan terasa kaku dalam bahasa Indonesia modern.
- source_word: אוֹיְבֵינוּ
  choice: musuh-musuh kami
  rationale: Menyampaikan nomina dengan sufiks orang pertama jamak secara langsung dan wajar.
- source_word: כִּי נוֹדַע לָנוּ
  choice: bahwa rencana mereka telah kami ketahui
  rationale: Ungkapan Ibrani secara harfiah berarti 'bahwa [hal itu] telah diketahui oleh kami.' Bahasa Indonesia lebih alami memakai bentuk aktif, sementara objek tersirat dijelaskan dari konteks sebagai rencana mereka.
- source_word: וַיָּפֶר הָאֱלֹהִים
  choice: dan bahwa Allah telah menggagalkan
  rationale: הפר dengan objek עצה berarti membatalkan, merintangi, atau menggagalkan suatu rencana. Bentuk 'telah' menjaga urutan waktu dalam isi yang didengar para musuh.
- source_word: עֲצָתָם
  choice: rencana mereka
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, atau rencana; dalam konteks komplotan terhadap pembangunan tembok, 'rencana' paling jelas tanpa menambah nada yang tidak wajib.
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: kami semua kembali
  rationale: שוב berarti kembali, sedangkan כֻּלָּנוּ menegaskan seluruh kelompok.
- source_word: אֶל הַחוֹמָה
  choice: ke tembok
  rationale: Mengacu pada tembok Yerusalem yang sedang dibangun kembali dan telah jelas dari konteks.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: masing-masing ke pekerjaannya
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' menyampaikan fungsi itu secara alami dan tepat dalam bahasa Indonesia tanpa harus menambahkan 'orang' atau 'laki-laki'.
theological_decisions:
- issue: Tindakan Allah terhadap rencana musuh
  choice: Allah secara langsung disebut telah menggagalkan rencana mereka.
  alternative: Peristiwa itu dapat digambarkan secara tidak langsung sebagai keadaan yang kebetulan menghalangi rencana musuh.
  rationale: Teks Ibrani secara eksplisit menjadikan הָאֱלֹהִים sebagai subjek וַיָּפֶר; atribusi teologis langsung ini harus dipertahankan.
- issue: Ungkapan distributif אִישׁ
  choice: masing-masing
  alternative: masing-masing orang; setiap laki-laki
  rationale: Dalam konstruksi אִישׁ אֶל־, kata אִישׁ berfungsi distributif. 'Masing-masing' mempertahankan makna individual di antara para pekerja tanpa menetapkan lebih dari yang dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan naratif, atribusi langsung kepada Allah, atau nuansa distributif pada penutup ayat.
