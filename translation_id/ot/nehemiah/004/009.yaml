  to: Ketika musuh-musuh kami mendengar bahwa kami telah mengetahuinya[a] dan bahwa Allah telah menggagalkan rencana mereka[b], kami semua kembali ke tembok, masing-masing ke pekerjaannya[c].
  rationale: Revisi hanya mengganti “bahwa rencana mereka telah kami ketahui” dengan “bahwa kami telah mengetahuinya.” Bentuk ini tetap alami, menyatakan bahwa para musuh mengetahui kelompok Nehemia sudah mendapat informasi tersebut, dan tidak memasukkan “rencana” sebagai objek eksplisit ke dalam klausa yang dalam bahasa Ibrani tidak menyebutkannya. Bagian lain dipertahankan karena telah menyampaikan makna sumber secara tepat.
