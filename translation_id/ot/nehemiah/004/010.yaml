  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: id
  text: Sejak hari itu, separuh dari orang-orang mudaku[a] mengerjakan pekerjaan itu, sedangkan separuh lainnya memegang tombak, perisai, busur, dan baju zirah[b]. Para pemimpin berada di belakang seluruh kaum Yehuda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “orang-orang mudaku” juga dapat berarti “para pelayanku” atau “para pengikutku” dalam konteks ini.
    reason: lexical_alternative
  - marker: b
    text: “Baju zirah” adalah pelindung tubuh; bentuknya mungkin berupa baju rantai atau zirah sisik.
    reason: lexical_alternative
  - marker: c
    text: Posisi para pemimpin “di belakang” seluruh kaum Yehuda mungkin menunjukkan dukungan militer atau pengawasan terhadap para pekerja.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִן הַיּוֹם הַהוּא
  choice: Sejak hari itu
  rationale: Ungkapan ini secara idiomatis menandai keadaan yang berlangsung mulai pada hari tersebut; terjemahan ini alami dan tetap dekat dengan bahasa Ibrani.
- source_word: נְעָרַי
  choice: para pemudaku
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengikut. Bentuk 'para pemudaku' mempertahankan arti leksikal dasarnya, sementara alternatif kontekstual dicatat dalam catatan kaki.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: mengerjakan pembangunan
  rationale: מְלָאכָה berarti pekerjaan atau tugas; dalam konteks ini pekerjaan tersebut adalah pembangunan kembali tembok. 'Mengerjakan pembangunan' jelas dan wajar dalam bahasa Indonesia.
- source_word: מַחֲזִיקִים
  choice: memegang
  rationale: Partisipel Hifil dari חזק di sini menunjukkan tindakan memegang atau membawa perlengkapan senjata, tanpa perlu mempersempitnya menjadi sekadar 'bersenjata'.
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת
  choice: tombak, perisai, busur
  rationale: Ketiga istilah ini menunjuk secara langsung pada jenis senjata dan perlengkapan pertahanan yang dikenal; padanan Indonesia ini baku dan mudah dipahami.
- source_word: הַשִּׁרְיֹנִים
  choice: baju zirah
  rationale: שִׁרְיוֹן menunjuk pada pelindung tubuh, mungkin zirah sisik atau baju rantai. 'Baju zirah' cukup spesifik untuk menunjukkan pelindung tubuh tanpa menentukan konstruksinya.
- source_word: הַשָּׂרִים
  choice: para pemimpin
  rationale: שַׂר dapat berarti pemimpin, pejabat, atau panglima. 'Para pemimpin' mempertahankan keluasan istilah dan tidak secara pasti menjadikan mereka perwira militer.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: berada di belakang seluruh kaum Yehuda
  rationale: אַחֲרֵי dipertahankan dalam arti spasial 'di belakang', sedangkan בֵּית יְהוּדָה diterjemahkan sebagai ungkapan kolektif 'kaum Yehuda'. Kata 'berada' melengkapi klausa nominal tanpa menambahkan tindakan 'berdiri' yang tidak dinyatakan dalam teks.
theological_decisions:
- issue: Fungsi para pemimpin yang berada di belakang kaum Yehuda
  choice: 'Mempertahankan keterangan posisi: ''berada di belakang'''
  alternative: Menafsirkan sebagai 'mendukung' atau 'mengawasi' kaum Yehuda
  rationale: Teks menyatakan posisi dengan אַחֲרֵי tetapi tidak menjelaskan apakah fungsi mereka terutama sebagai dukungan militer, pengawasan, atau komando. Terjemahan utama mempertahankan ketegangan tersebut dan catatan kaki menjelaskan kemungkinannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur kontras 'separuh ... sedangkan separuh lainnya' memperjelas pembagian tugas. 'Kaum Yehuda' mempertahankan sifat kolektif ungkapan Ibrani tanpa memakai bentuk harfiah yang kaku 'rumah Yehuda'.
