base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: id
  text: Aku, saudara-saudaraku, anak buahku, dan para penjaga yang berada di belakangku tidak menanggalkan pakaian kami. Masing-masing tetap membawa senjatanya, bahkan untuk urusan air.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani pada klausa terakhir sulit dipahami; secara harfiah kira-kira berbunyi, “masing-masing: senjatanya, air.” Ini mungkin berarti bahwa masing-masing membawa senjata ketika pergi mengambil air, atau bahwa masing-masing tetap memegang senjatanya di tangan kanan, bahkan untuk urusan air.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: tidak menanggalkan
  rationale: Partikel negatif bersama bentuk partisip menyatakan tindakan berkelanjutan yang tidak dilakukan. Dalam bahasa Indonesia, satu negasi sesudah rangkaian subjek menyampaikan maksud itu dengan wajar tanpa meniru pengulangan Ibrani secara kaku.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Mempertahankan istilah kekerabatan harfiah, tanpa mempersempitnya menjadi kerabat jauh atau sekadar rekan.
- source_word: נְעָרַי
  choice: anak buahku
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pengiring. Dalam konteks kepemimpinan dan penjagaan Nehemia, 'anak buahku' menyatakan orang-orang yang berada di bawah arahannya tanpa menentukan usia atau status perbudakan.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: para penjaga
  rationale: Ungkapan ini menunjuk kepada orang-orang yang menjalankan tugas jaga; 'para penjaga' jelas, ringkas, dan alami dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר אַחֲרַי
  choice: yang berada di belakangku
  rationale: Mempertahankan gambaran ruang dari אַחֲרַי dan tidak memutuskan apakah mereka secara khusus mengikuti Nehemia atau ditempatkan di belakangnya.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: menanggalkan pakaian kami
  rationale: פשט dengan בגד berarti melepaskan atau menanggalkan pakaian. Pilihan ini alami sekaligus cukup dekat dengan bentuk Ibrani.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ berfungsi distributif dalam klausa ini; 'masing-masing' menyampaikan fungsi tersebut secara idiomatis.
- source_word: שִׁלְחוֹ
  choice: senjatanya
  rationale: שֶׁלַח dapat menunjuk pada senjata, khususnya senjata yang dilemparkan atau sejenis tombak. Istilah umum 'senjata' menghindari penentuan jenis yang tidak pasti.
- source_word: הַמָּיִם
  choice: ketika mengambil air
  rationale: Klausa penutup sangat singkat dan sukar. Terjemahan ini menyajikan salah satu pemahaman kontekstual yang lazim, yakni bahwa mereka tetap bersenjata saat memenuhi kebutuhan air, sambil mencatat ketidakpastiannya dalam catatan kaki.
