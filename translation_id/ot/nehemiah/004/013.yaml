base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/013.yaml
  text: And I said to the nobles[a], to the officials, and to the rest of the people, “The work is great and spread out, and we are separated along the wall, far from one another.”
translation:
  language: id
  text: Lalu aku berkata kepada para pemuka, para pejabat, dan rakyat selebihnya, “Pekerjaan ini besar dan tersebar luas, sedangkan kita terpencar di sepanjang tembok, berjauhan satu sama lain.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang dari saudaranya,” sebuah ungkapan Ibrani yang berarti “satu dari yang lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: para pemuka
  rationale: Dalam konteks Nehemia, kata ini menunjuk kepada kalangan terkemuka atau elite masyarakat. “Para pemuka” alami dalam bahasa Indonesia dan tidak membatasi mereka pada kebangsawanan turun-temurun.
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: Istilah ini menunjuk kepada para pemimpin atau administrator bawahan; “para pejabat” menyampaikan fungsi pemerintahan tanpa menetapkan pangkat khusus.
- source_word: יֶתֶר הָעָם
  choice: seluruh rakyat yang lain
  rationale: Ungkapan ini mencakup semua orang selebihnya di luar dua kelompok pemimpin yang telah disebut.
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: Pekerjaan ini besar dan tersebar luas
  rationale: “Besar” menyatakan banyaknya atau besarnya pekerjaan, sedangkan “tersebar luas” menyampaikan bahwa pekerjaan itu membentang di area yang luas.
- source_word: נִפְרָדִים
  choice: terpencar
  rationale: Partisip pasif ini menggambarkan para pekerja yang berada terpisah-pisah secara spasial, bukan perpecahan karena pertentangan.
- source_word: עַל הַחוֹמָה
  choice: di sepanjang tembok
  rationale: Preposisi עַל secara dasar dapat berarti “di atas/pada”, tetapi konteksnya menggambarkan penempatan para pekerja pada berbagai bagian sepanjang bentangan tembok.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: berjauhan seorang dari yang lain
  rationale: Terjemahan ini mempertahankan gambaran jarak dan menyampaikan fungsi timbal balik idiom Ibrani secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “aku” mengikuti narasi orang pertama Nehemia. Diksi mempertahankan gambaran spasial dalam teks Ibrani tanpa memberi kesan adanya perpecahan sosial.
