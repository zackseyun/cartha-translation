base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: id
  text: Pada waktu itu pula aku berkata kepada rakyat, “Hendaklah setiap orang dan pembantunya bermalam di dalam Yerusalem, supaya pada malam hari mereka menjadi penjaga bagi kita dan pada siang hari pekerja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Pada waktu itu juga
  rationale: Mempertahankan daya aditif גַּם dan ungkapan waktu בָּעֵת הַהִיא dalam susunan bahasa Indonesia yang alami.
- source_word: אָמַרְתִּי לָעָם
  choice: aku berkata kepada rakyat
  rationale: אָמַר diterjemahkan secara langsung sebagai 'berkata', sedangkan עָם dalam konteks pengarahan umum kepada penduduk diterjemahkan 'rakyat'.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: setiap orang bersama pembantunya
  rationale: אִישׁ bersifat distributif, sementara נַעַר di sini paling wajar menunjuk pembantu atau bawahan; kata Ibrani itu tidak memastikan usia muda.
- source_word: יָלִינוּ
  choice: bermalam
  rationale: Bentuk dari לון/לין menyatakan tinggal atau melewatkan malam dan diterjemahkan ringkas serta alami.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: di dalam Yerusalem
  rationale: בְּתוֹךְ menandai lokasi di bagian dalam kota, bukan di luar temboknya.
- source_word: וְהָיוּ לָנוּ
  choice: Dengan demikian, mereka dapat
  rationale: Koordinasi ini dalam konteks menyatakan hasil atau fungsi dari perintah agar mereka bermalam di kota, tanpa menjadikannya perintah kedua yang kaku.
- source_word: הַלַּיְלָה מִשְׁמָר
  choice: berjaga bagi kita pada malam hari
  rationale: מִשְׁמָר menyatakan penjagaan atau tugas jaga; bentuk verbal lebih alami dalam bahasa Indonesia dan tetap mempertahankan fungsi perlindungannya.
- source_word: וְהַיּוֹם מְלָאכָה
  choice: bekerja pada siang hari
  rationale: מְלָאכָה berarti pekerjaan atau kerja; bentuk verbal menghasilkan paralel malam/siang yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Paralel antara berjaga pada malam hari dan bekerja pada siang hari dipertahankan, sementara ambiguitas makna נַעַר dijelaskan dalam catatan kaki.
