review_pass:
  verdict: revise
  source_fidelity: Perintah agar setiap orang beserta pembantunya bermalam di Yerusalem diterjemahkan dengan tepat. Namun, “Pada waktu itu juga” dapat menyiratkan tindakan yang langsung terjadi, sedangkan גַּם bersifat aditif; “pula” lebih tepat. Selain itu, “mereka dapat” menyatakan kemampuan, bukan fungsi/tujuan yang dimaksud oleh klausa Ibrani.
  naturalness: Bahasa draf umumnya baku dan jelas. Susunan revisi mempertahankan kelugasan naratif serta paralel malam/siang dengan lebih dekat kepada bentuk nominal sumber.
  terminology: “Pembantu” merupakan pilihan yang dapat diterima untuk נַעַר dalam konteks ini, dengan catatan kaki yang tepat mempertahankan rentang maknanya. “Rakyat” masih dapat dipakai bagi לָעָם dalam amanat kepada komunitas itu.
  issues:
  - severity: medium
    issue: “Pada waktu itu juga”
    rationale: Dalam bahasa Indonesia, “juga” setelah keterangan waktu dapat dibaca sebagai ‘segera pada waktu itu’. Ibrani גַּם menambahkan instruksi ini pada tindakan sebelumnya, sehingga “Pada waktu itu pula” lebih aman.
  - severity: medium
    issue: “mereka dapat berjaga”
    rationale: '“Dapat” terutama menyatakan kemampuan atau kemungkinan. וְהָיוּ לָנוּ menyatakan hasil/fungsi yang dikehendaki: mereka menjadi penjaga pada malam hari dan pekerja pada siang hari.'
  revised_text: Pada waktu itu pula aku berkata kepada rakyat, “Hendaklah setiap orang dan pembantunya bermalam di dalam Yerusalem, supaya pada malam hari mereka menjadi penjaga bagi kita dan pada siang hari pekerja.”
  revised_footnotes:
