  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר תִּשְׁמְעוּ֙ אֶת ק֣וֹל הַ/שּׁוֹפָ֔ר שָׁ֖מָּ/ה תִּקָּבְצ֣וּ אֵלֵ֑י/נוּ אֱלֹהֵ֖י/נוּ יִלָּ֥חֶם לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: id
  text: Di tempat kalian mendengar bunyi sangkakala[a], berkumpullah di sana bersama kami. Allah kita akan berperang bagi kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bunyi tanduk domba jantan.” Kata Ibrani syofar secara khusus menunjuk pada alat tiup dari tanduk.'
    reason: Alternatif leksikal untuk sangkakala; syofar dapat merujuk secara lebih spesifik pada tanduk domba jantan.
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: Di tempat mana pun
  rationale: Gabungan frasa lokatif dan klausa relatif menunjuk pada lokasi mana saja tempat tanda itu terdengar. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan tempat yang konkret.
- source_word: תִּשְׁמְעוּ
  choice: kalian mendengar
  rationale: Bentuk orang kedua jamak diterjemahkan secara eksplisit dengan 'kalian'; שׁמע di sini berarti mendengar.
- source_word: קוֹל הַשּׁוֹפָר
  choice: bunyi sangkakala
  rationale: קוֹל dipertahankan sebagai 'bunyi', sedangkan שׁוֹפָר diterjemahkan 'sangkakala', istilah Indonesia yang lazim dalam konteks Alkitab untuk alat tiup pemberi tanda.
- source_word: שָׁמָּה תִּקָּבְצוּ
  choice: berkumpullah ke sana
  rationale: Adverbia berarah שָׁמָּה dan perintah Niphal jamak תִּקָּבְצוּ bersama-sama menyatakan gerak untuk berhimpun di lokasi tersebut.
- source_word: אֵלֵינוּ
  choice: bersama kami
  rationale: Bentuk Ibrani secara harfiah berarti 'kepada kami'. Dalam bahasa Indonesia, 'bersama kami' secara alami menyampaikan bahwa orang-orang itu harus berkumpul ke lokasi kelompok pembicara, sambil mempertahankan bentuk orang pertama jamak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Akhiran milik orang pertama jamak dipertahankan. 'Allah kita' adalah ungkapan Indonesia yang alami dan bermartabat.
- source_word: יִלָּחֶם לָנוּ
  choice: akan berperang bagi kita
  rationale: Kata kerja Niphal לחם menyatakan tindakan berperang, sedangkan לָנוּ menunjukkan kepentingan atau manfaat bagi umat. 'Berperang bagi kita' mempertahankan bahwa Allah sendiri adalah pelaku tindakan tersebut.
theological_decisions:
- issue: Bahasa peperangan ilahi
  choice: Allah kita akan berperang bagi kita
  alternative: Allah kita akan menolong kita berperang
  rationale: Teks Ibrani menjadikan Allah sendiri sebagai subjek tindakan berperang, bukan sekadar pihak yang membantu manusia. Terjemahan mempertahankan penekanan ini tanpa menambah penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' memperjelas bentuk jamak Ibrani; 'sangkakala' dipertahankan karena sesuai dengan konteks tanda militer dan dikenal luas oleh pembaca Alkitab.
