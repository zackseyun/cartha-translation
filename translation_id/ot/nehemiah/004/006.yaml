  text: וַֽ/יְהִי֙ כַּ/אֲשֶׁר בָּ֣אוּ הַ/יְּהוּדִ֔ים הַ/יֹּשְׁבִ֖ים אֶצְלָ֑/ם וַ/יֹּ֤אמְרוּ לָ֨/נוּ֙ עֶ֣שֶׂר פְּעָמִ֔ים מִ/כָּל הַ/מְּקֹמ֖וֹת אֲשֶׁר תָּשׁ֥וּבוּ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: id
  text: Ketika orang-orang Yahudi yang tinggal di dekat mereka datang, mereka berkata kepada kami sepuluh kali, “Dari segala arah yang kalian tuju[a], mereka akan menyerang kita[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke mana pun kalian berbalik,” atau, “ke mana pun kalian kembali.” Teks Ibrani pada bagian ini sukar; verba yang dipakai dapat berarti berbalik atau kembali.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bagian akhir berbunyi “terhadap kita.” Subjek “mereka” dan kata-kata “akan menyerang” dilengkapi berdasarkan konteks peringatan tentang musuh yang datang dari berbagai arah.
    reason: clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rangkaian naratif dengan penanda waktu memperkenalkan perkembangan baru. “Ketika” menyampaikan hubungan temporal secara alami tanpa ungkapan kaku “terjadilah ketika”.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Dalam konteks Nehemia, istilah ini menunjuk kepada komunitas Yahudi, bukan semata-mata penduduk wilayah Yudea.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: yang tinggal di dekat mereka
  rationale: Partisip dengan אֵצֶל menunjukkan tempat tinggal yang berdekatan dengan pihak-pihak yang memusuhi pembangunan tembok.
- source_word: וַיֹּאמְרוּ לָנוּ
  choice: mereka berkata kepada kami
  rationale: Terjemahan langsung dan wajar yang tidak menambahkan nuansa ‘memperingatkan’ ke dalam verba ujaran itu sendiri.
- source_word: עֶשֶׂר פְּעָמִים
  choice: sampai sepuluh kali
  rationale: Mempertahankan bilangan eksplisit Ibrani sambil mengungkapkan secara alami bahwa laporan itu disampaikan berulang kali.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: Dari segala arah
  rationale: Secara harfiah berarti “dari segala tempat,” tetapi dalam peringatan tentang serangan, ungkapan Indonesia “dari segala arah” menyampaikan fungsi spasialnya dengan jelas.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: yang kalian tuju
  rationale: שׁוב biasanya berarti berbalik atau kembali, tetapi konstruksi ini sukar dan kemungkinan menggambarkan arah mana pun yang dituju. Pilihan ini menghasilkan bahasa Indonesia yang alami sambil menandai alternatif harfiahnya dalam catatan kaki.
- source_word: עָלֵינוּ
  choice: menyerang kita
  rationale: Konteks permusuhan memberi עַל daya adversatif, “terhadap kita.” Verba serangan yang eliptis dilengkapi agar kalimat dapat dipahami dalam bahasa Indonesia.
