id: NEH.4.5
reference: Nehemiah 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: id
  text: Musuh-musuh kita berkata, “Mereka tidak akan tahu ataupun melihat sampai kita masuk ke tengah-tengah mereka[a], lalu membunuh mereka dan menghentikan pekerjaan itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרֵינוּ
  choice: musuh-musuh kita
  rationale: צַר menunjuk kepada pihak yang memusuhi atau menentang. Dalam konteks ancaman pembunuhan dan penghentian pembangunan, “musuh-musuh kita” merupakan padanan Indonesia yang alami dan tepat.
- source_word: יֵדְעוּ
  choice: mereka tidak akan tahu
  rationale: יָדַע di sini menyatakan pengetahuan atau kesadaran. “Tahu” mempertahankan ungkapan langsung bahasa Ibrani tanpa mempersempitnya menjadi sekadar “menyadari” atau “mengetahui rencana”.
- source_word: יִרְאוּ
  choice: ataupun melihat
  rationale: רָאָה secara dasar berarti “melihat”. Padanan ini mempertahankan kesejajaran retoris dengan “tahu”, sementara konteks menyampaikan nuansa “menyadari” atau “melihat kedatangan”.
- source_word: עַד אֲשֶׁר
  choice: sampai
  rationale: Gabungan ini menandai batas waktu ketidaktahuan mereka, yakni sampai para penyerang telah datang. “Sampai” adalah padanan yang ringkas dan alami.
- source_word: נָבוֹא
  choice: kita masuk
  rationale: בּוֹא dapat berarti datang atau masuk. Dengan frasa berikutnya, “masuk” secara alami menggambarkan gerakan menerobos ke tengah kelompok yang hendak diserang.
- source_word: אֶל תּוֹכָם
  choice: ke tengah-tengah mereka
  rationale: תּוֹךְ menunjuk bagian tengah atau lingkungan internal suatu kelompok. Ungkapan ini mempertahankan gambaran spasial dan daya ancam serangan mendadak.
- source_word: וַהֲרַגְנוּם
  choice: lalu membunuh mereka
  rationale: הָרַג adalah kata kerja umum untuk membunuh. “Membunuh mereka” menyampaikan ancaman secara lugas; “lalu” mengungkapkan urutan tindakan yang tersirat dalam rangkaian klausa.
- source_word: וְהִשְׁבַּתְנוּ
  choice: dan menghentikan
  rationale: Bentuk Hifil dari שׁבת berarti menyebabkan sesuatu berhenti. “Menghentikan” dengan tepat menyatakan makna kausatif tersebut.
- source_word: הַמְּלָאכָה
  choice: pekerjaan itu
  rationale: מְלָאכָה di sini merujuk kepada pekerjaan pembangunan kembali yang sudah diketahui dari konteks. “Pekerjaan itu” merupakan padanan modern yang jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan mengancam sesuai ujaran langsung. Kesejajaran “tidak akan tahu ataupun melihat” dipertahankan, sedangkan susunan klausa dibuat alami bagi pembaca Indonesia.
