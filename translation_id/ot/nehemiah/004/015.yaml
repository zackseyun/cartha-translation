  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנַ֖חְנוּ עֹשִׂ֣ים בַּ/מְּלָאכָ֑ה וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ בָּֽ/רְמָחִ֔ים מֵ/עֲל֣וֹת הַ/שַּׁ֔חַר עַ֖ד צֵ֥את הַ/כּוֹכָבִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/015.yaml
  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: id
  text: Demikianlah kami terus mengerjakan pekerjaan itu, sementara separuh dari mereka memegang tombak sejak fajar menyingsing hingga bintang-bintang bermunculan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sejak terbitnya fajar hingga keluarnya bintang-bintang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: terus mengerjakan pekerjaan itu
  rationale: Partisipel עֹשִׂים menyatakan tindakan yang berlangsung dalam konteks naratif. Ungkapan ini mempertahankan nuansa duratif, sedangkan 'pekerjaan itu' merujuk secara wajar pada pekerjaan pembangunan yang sudah diketahui dari konteks.
- source_word: וְחֶצְיָם
  choice: sementara separuh dari mereka
  rationale: Konjungsi menghubungkan dua tindakan yang berlangsung bersamaan. 'Sementara' menyatakan hubungan itu dengan jelas tanpa mengubah pembagian kelompok dalam teks.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: memegang tombak
  rationale: מַחֲזִיקִים menggambarkan tindakan memegang atau membawa secara berkelanjutan; 'memegang tombak' alami dalam bahasa Indonesia dan sesuai dengan keadaan berjaga dalam konteks.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: sejak fajar menyingsing
  rationale: Secara harfiah frasa ini menggambarkan 'terbitnya fajar'. 'Sejak fajar menyingsing' mempertahankan gambaran tersebut dalam ungkapan Indonesia yang alami.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: hingga bintang-bintang bermunculan
  rationale: Frasa Ibrani secara konkret menggambarkan keluarnya atau tampaknya bintang-bintang. Pilihan ini mempertahankan citra itu dan lebih tepat daripada penyederhanaan interpretatif seperti 'hingga malam'.
