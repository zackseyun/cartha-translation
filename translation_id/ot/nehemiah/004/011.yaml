base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: id
  text: Para pembangun di tembok dan para pengangkut beban memikul muatan[a]. Masing-masing mengerjakan pekerjaan itu dengan satu tangan, sedangkan tangan yang lain memegang senjata[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “memikul muatan” jarang dipakai dan nuansa tepatnya tidak pasti. Kata itu dapat juga dipahami sebagai “memuati diri” atau “mengangkut beban”; maksud umumnya ialah bahwa para pekerja menangani bahan bangunan sambil tetap siap bersenjata.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini dapat secara lebih khusus berarti tombak, lembing, senjata lempar, atau jenis senjata lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: para pembangun tembok
  rationale: Partisipel Qal הַבּוֹנִים dipakai secara substantival. Frasa Indonesia ini alami dan menyampaikan bahwa mereka sedang mengerjakan tembok; makna lokatif בַּחוֹמָה tercakup tanpa ungkapan kaku 'di atas tembok'.
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: dan para pengangkut muatan
  rationale: נשא dengan סבל menunjuk pada orang-orang yang membawa bahan atau beban. 'Pengangkut muatan' ringkas, konkret, dan sesuai dengan konteks pembangunan.
- source_word: עֹמְשִׂים
  choice: bekerja sambil dibebani muatan
  rationale: Partisipel yang langka ini berkaitan dengan pemuatan atau keadaan menanggung muatan. Terjemahan ini mempertahankan hubungan dengan para pengangkut sekaligus menjelaskan keadaan mereka ketika bekerja, tanpa memastikan nuansa leksikal yang tidak pasti.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: masing-masing mengerjakan pekerjaan itu dengan satu tangan
  rationale: Bentuk tunggal bersufiks berfungsi distributif dalam kelompok pekerja. 'Masing-masing' membuat fungsi itu jelas dan tetap mempertahankan gambaran satu tangan yang bekerja.
- source_word: וְאַחַת מַחֲזֶקֶת
  choice: sedangkan tangan yang lain memegang
  rationale: Partisipel feminin tunggal mengacu pada 'tangan' yang tersirat. Bahasa Indonesia perlu menyebutkan 'tangan' agar hubungan gramatikal dan kontras kedua tangan jelas.
- source_word: הַשָּׁלַח
  choice: senjata
  rationale: Istilah ini dapat menunjuk pada senjata lempar, tombak, lembing, atau jenis senjata lain. 'Senjata' mempertahankan keluasan maknanya dan tidak menentukan jenis yang tidak dipastikan konteks.
