    rationale: Partisipel langka ini memang sulit, tetapi bentuk pasif Indonesia menyatakan bahwa para pekerja dikenai beban. Dalam konteks dan jejak audit, makna aktif—memuat atau membawa muatan—lebih aman. Catatan kaki tetap diperlukan untuk mencatat ketidakpastian nuansa.
  - severity: low
    issue: Unsur lokatif בַּחוֹמָה tidak tampak dalam “pembangun tembok”
    rationale: Frasa tersebut dapat berarti orang yang membangun sebuah tembok, sedangkan teks secara harfiah menempatkan para pembangun di/pada tembok. “Para pembangun di tembok” menyampaikan unsur ini tanpa menjadi kaku.
