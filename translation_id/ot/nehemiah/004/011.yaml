translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur dua kalimat dipakai agar gambaran kerja dengan satu tangan dan kesiagaan bersenjata mudah dipahami. Ketidakpastian kata עֹמְשִׂים dan jenis הַשָּׁלַח dipertahankan melalui catatan kaki.
