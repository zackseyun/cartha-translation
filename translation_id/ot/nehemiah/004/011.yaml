- from: Para pembangun tembok dan para pengangkut muatan bekerja sambil dibebani muatan[a]. Masing-masing mengerjakan pekerjaan itu dengan satu tangan, sedangkan tangan yang lain memegang senjata[b].
  to: Para pembangun di tembok dan para pengangkut beban memikul muatan[a]. Masing-masing mengerjakan pekerjaan itu dengan satu tangan, sedangkan tangan yang lain memegang senjata[b].
  rationale: Revisi mengganti ungkapan pasif dengan “memikul muatan,” yang lebih dekat dengan kemungkinan makna aktif partisipel Ibrani sambil membiarkan ketidakpastian leksikal dijelaskan dalam catatan kaki. Unsur “di tembok” juga dipulihkan untuk mencerminkan preposisi Ibrani. Kontras antara satu tangan untuk pekerjaan dan tangan lainnya untuk senjata dipertahankan.
