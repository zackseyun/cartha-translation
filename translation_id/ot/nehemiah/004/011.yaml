  source_fidelity: Revisi diperlukan karena “dibebani muatan” memberi bentuk pasif yang tidak dinyatakan secara jelas oleh partisipel Ibrani עֹמְשִׂים, yang lebih wajar dipahami secara aktif sebagai memuat atau membawa muatan. Selain itu, “pembangun tembok” dapat dipahami sebagai pembangun secara umum dan kurang menyatakan unsur lokatif בַּחוֹמָה (“di/pada tembok”).
  naturalness: Teks draf pada umumnya baku dan jelas. Namun, “bekerja sambil dibebani muatan” terasa kurang luwes serta mengaburkan hubungan antara para pengangkut beban dan kegiatan memikul/memuat. Revisi mempertahankan kalimat yang lugas dan alami.
  terminology: “Senjata” tepat sebagai padanan umum untuk הַשָּׁלַח dan catatan kaki dengan tepat mencatat kemungkinan makna yang lebih khusus. “Memikul muatan” dipilih untuk mempertahankan tindakan aktif tanpa mengkhususkan jenis bahan atau cara pemuatan.
  issues:
