  text: And the builders each had his sword strapped at his side while they built[a], and the one blowing the trumpet was beside me.
translation:
  language: id
  text: Para pembangun itu masing-masing terus membangun dengan pedangnya terikat di pinggangnya, dan orang yang meniup sangkakala[a] berada di sampingku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: shofar, alat tiup yang biasanya dibuat dari tanduk domba jantan.'
    reason: Menjelaskan jenis alat tiup yang disebut שׁוֹפָר sambil mempertahankan "sangkakala" sebagai padanan yang mudah dipahami dalam teks utama.
lexical_decisions:
- source_word: הַבּוֹנִים / וּבוֹנִים
  choice: para pekerja yang membangun / sambil terus membangun
  rationale: Partisipel pertama berfungsi sebagai sebutan bagi para pembangun, sedangkan bentuk kedua menyatakan kegiatan yang berlangsung. Pengulangan akar בנה dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif untuk menyatakan setiap orang dalam kelompok para pembangun.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Terjemahan langsung bentuk nomina dengan pronomina milik orang ketiga tunggal.
- source_word: אֲסוּרִים
  choice: menyandang
  rationale: Bentuk pasif dari אסר menyiratkan bahwa pedang itu diikat atau dipasangkan pada tubuh. 'Menyandang' mengungkapkan keadaan siap pakai secara alami tanpa terikat pada bentuk pasif Ibrani yang tidak idiomatis dalam bahasa Indonesia.
- source_word: עַל מָתְנָיו
  choice: di pinggang
  rationale: מָתְנַיִם menunjuk bagian pinggang atau pangkal tubuh. 'Di pinggang' jelas, alami, dan lebih dekat daripada ungkapan umum 'di sisinya'.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: orang yang meniup sangkakala
  rationale: Partisipel תקע dipertahankan sebagai tindakan, sedangkan שׁוֹפָר diterjemahkan 'sangkakala' dalam teks utama agar mudah dipahami; jenis alat musiknya dijelaskan dalam catatan kaki.
- source_word: אֶצְלִי
  choice: berada di sampingku
  rationale: Bentuk ini menyatakan kedekatan tempat dengan penutur; 'di sampingku' merupakan padanan Indonesia yang alami.
