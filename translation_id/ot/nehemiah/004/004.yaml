lexical_decisions:
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama diri dipertahankan sesuai bentuk Ibrani; dalam konteks ini kemungkinan besar digunakan secara kolektif untuk masyarakat Yehuda.
- source_word: כָּשַׁל כֹּחַ
  choice: kekuatan ... sudah melemah
  rationale: Ungkapan ini menyatakan bahwa tenaga para pekerja telah merosot atau tidak lagi memadai; bentuk ini alami dalam bahasa Indonesia tanpa menghilangkan gambaran kegagalan tenaga.
- source_word: הַסַּבָּל
  choice: para pengangkut beban
  rationale: Nomina tunggal Ibrani tampaknya bersifat kolektif. Bentuk jamak bahasa Indonesia menjelaskan bahwa yang dimaksud ialah kelompok pekerja yang mengangkut material.
- source_word: הֶעָפָר
  choice: puing-puing
  rationale: Arti dasarnya adalah debu atau tanah, tetapi dalam konteks pembangunan kembali tembok kota yang runtuh, kata ini menunjuk pada timbunan reruntuhan.
- source_word: הַרְבֵּה
  choice: masih begitu banyak
  rationale: Menyampaikan kelimpahan puing secara wajar; 'masih' ditambahkan berdasarkan keadaan reruntuhan yang terus menghambat pekerjaan.
- source_word: לֹא נוּכַל
  choice: kita tidak sanggup
  rationale: Menyatakan ketidakmampuan akibat kelelahan dan banyaknya puing, bukan ketidakmauan.
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: membangun tembok ini
  rationale: Bahasa Indonesia alami memakai objek langsung. 'Ini' mengacu pada tembok yang sedang dikerjakan dan membantu membawa nuansa definit dari artikel Ibrani, tanpa menambahkan gagasan eksplisit 'kembali' yang tidak terdapat pada verba.
