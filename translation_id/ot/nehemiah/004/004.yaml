  text: And Judah said[a], “The strength of the burden-bearers has failed, and there is much rubble[b], and we are not able to build the wall.”
translation:
  language: id
  text: Lalu Yehuda berkata[a], “Tenaga para pengangkut beban sudah habis, dan puing-puing itu banyak[b]; kita tidak sanggup membangun tembok itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yehuda berkata.” Nama tunggal “Yehuda” kemungkinan mewakili penduduk Yehuda secara kolektif.
