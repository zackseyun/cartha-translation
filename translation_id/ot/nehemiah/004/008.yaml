base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: id
  text: Aku melihat, lalu aku bangkit dan berkata kepada para pemuka, para pejabat, dan rakyat selebihnya, “Jangan takut kepada mereka. Ingatlah Tuhan yang besar dan dahsyat[a], dan berperanglah membela saudara-saudara laki-laki kalian[b], anak-anak lelaki kalian, anak-anak perempuan kalian, istri-istri kalian, dan rumah-rumah kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengagumkan.” Kata Ibrani ini menggambarkan sesuatu atau seseorang yang membangkitkan rasa takjub sekaligus gentar.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “saudara-saudara laki-laki” berbentuk maskulin jamak. Setelahnya, ayat ini menyebut anak lelaki, anak perempuan, dan istri secara tersendiri.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Setelah melihat keadaan itu
  rationale: Bentuk wayyiqtol dari ראה menyatakan tindakan Nehemia melihat atau mencermati situasi sebelum bertindak. Objek tersirat diungkapkan sebagai 'keadaan itu' agar kalimat alami dalam bahasa Indonesia tanpa menentukan lebih jauh apa yang dilihatnya.
- source_word: וָאָקוּם
  choice: aku bangkit
  rationale: קום di sini menandai tindakan tegas untuk tampil dan berbicara; 'bangkit' mempertahankan daya naratifnya.
- source_word: הַחֹרִים
  choice: para pemuka
  rationale: Istilah ini menunjuk golongan terkemuka atau bangsawan. 'Para pemuka' jelas, bermartabat, dan sesuai dengan konteks kepemimpinan masyarakat.
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: סגנים menunjuk para penguasa atau administrator bawahan; 'para pejabat' merupakan padanan modern yang luas dan wajar.
- source_word: יֶתֶר הָעָם
  choice: seluruh rakyat lainnya
  rationale: Frasa ini membedakan masyarakat selebihnya dari dua kelompok pemimpin yang baru disebut.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Jangan takut kepada mereka
  rationale: Ungkapan ירא dengan מִפְּנֵי menyatakan rasa takut menghadapi lawan; padanan ini langsung dan alami.
- source_word: אֶת אֲדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי adalah gelar ilahi, bukan Tetragramaton יהוה; karena itu digunakan 'Tuhan', bukan 'TUHAN'.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: yang besar dan dahsyat
  rationale: נוֹרָא menggambarkan sosok yang membangkitkan rasa gentar sekaligus takjub. 'Dahsyat' mempertahankan kekuatan makna itu dalam bahasa Indonesia modern.
- source_word: זְכֹרוּ
  choice: Ingatlah
  rationale: Imperatif ini merupakan seruan langsung untuk mengingat siapa Tuhan sebagai dasar keberanian mereka.
- source_word: וְהִלָּחֲמוּ עַל
  choice: dan berjuanglah demi
  rationale: Dalam konteks ini עַל menyatakan kepentingan atau pembelaan terhadap orang-orang yang disebut berikutnya. 'Berjuanglah demi' menyampaikan maksud tersebut secara wajar.
- source_word: אֲחֵיכֶם
  choice: saudara-saudara kalian
  rationale: אחים berbentuk maskulin jamak dan dapat menunjuk saudara lelaki atau kerabat laki-laki; bentuk umum bahasa Indonesia dipertahankan, dengan cakupan sumber dijelaskan dalam catatan kaki.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: anak-anak lelaki kalian, anak-anak perempuan kalian, istri-istri kalian, dan rumah-rumah kalian
  rationale: Daftar konkret dan kumulatif dalam bahasa Ibrani dipertahankan, termasuk pembedaan anak lelaki dan perempuan serta bentuk jamak rumah yang dapat mencakup tempat tinggal maupun rumah tangga.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֲדֹנָי
  choice: Tuhan
  alternative: Penguasa
  rationale: Teks memakai אֲדֹנָי sebagai gelar bagi Allah, bukan nama ilahi יהוה. 'Tuhan' adalah padanan Indonesia yang lazim dan tidak mengaburkan perbedaan itu.
- issue: Makna הַנּוֹרָא
  choice: dahsyat
  alternative: mengagumkan
  rationale: Konteks mempertentangkan rasa takut kepada manusia dengan ingatan akan Allah yang membangkitkan rasa gentar. 'Dahsyat' menjaga ketegangan tersebut, sedangkan 'mengagumkan' dapat melemahkan unsur kegentaran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai secara konsisten untuk memperjelas bahwa perintah dan seluruh bentuk kepunyaan ditujukan kepada banyak orang. Susunan daftar keluarga dipertahankan agar daya retoris dan kekonkretan teks Ibrani tetap terasa.
