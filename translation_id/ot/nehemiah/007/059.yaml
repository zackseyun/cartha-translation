  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: id
  text: keturunan Sefaca[a], keturunan Hatil, keturunan Pokeret-Hazebaim[b], keturunan Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Sefaca”; demikian juga untuk nama-nama berikutnya dalam ayat ini. Dalam daftar silsilah, ungkapan Ibrani ini sering menunjuk kepada keturunan atau kelompok keluarga.
    reason: lexical_alternative
  - marker: b
    text: Nama ini juga dapat ditampilkan sebagai “Pokeret dari Zebaim”. Teks utama mempertahankan ungkapan Ibraninya sebagai satu nama keluarga.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah atau kelompok keluarga, bentuk konstruksi jamak dari בֵּן lazim menunjuk kepada garis keluarga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia modern.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: חַטִּיל
  choice: Hatil
  rationale: Nama diri atau nama keluarga ditransliterasikan tanpa diterjemahkan.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Pokeret-Hazebaim
  rationale: Ungkapan Ibrani dipertahankan sebagai nama keluarga majemuk; tanda hubung menunjukkan bahwa kedua unsurnya berkaitan erat.
- source_word: אָמֽוֹן
  choice: Amon
  rationale: Nama keluarga ditransliterasikan; dalam konteks daftar ini kata tersebut tidak diperlakukan sebagai kata benda umum.
