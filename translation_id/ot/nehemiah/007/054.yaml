  yaml_path: translation/ot/nehemiah/007/054.yaml
  text: the sons of Bazlith, the sons of Mehida, the sons of Harsha—
translation:
  language: id
  text: keturunan Bazlit, keturunan Mehida, keturunan Harsa—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga atau kaum, bentuk ini menunjuk kepada anggota garis keturunan, bukan hanya anak laki-laki langsung. 'Keturunan' alami dalam bahasa Indonesia dan mempertahankan fungsi genealogisnya.
- source_word: בַצְלִית
  choice: Bazlit
  rationale: Nama diri ini ditransliterasikan menurut bunyi Ibrani; huruf akhir ת direpresentasikan sebagai 't' sesuai kelaziman transliterasi nama ke dalam bahasa Indonesia.
- source_word: מְחִידָא
  choice: Mehida
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk 'Mehida' mencerminkan pelafalan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: חַרְשָׁא
  choice: Harsa
  rationale: Nama diri ditransliterasikan dengan 'syin' sebagai 's' dalam ejaan Indonesia; bentuk ini tidak mengesankan bahwa nama tersebut perlu diterjemahkan menurut kemungkinan makna leksikalnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan 'keturunan' dipertahankan untuk mencerminkan struktur paralel daftar dalam teks Ibrani. Tanda pisah panjang mempertahankan kesinambungan daftar ke ayat berikutnya.
