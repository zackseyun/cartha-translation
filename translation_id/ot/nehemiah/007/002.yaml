  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: id
  text: Lalu aku mengangkat Hanani, saudaraku, dan Hananya, kepala benteng, untuk memimpin Yerusalem, karena ia adalah orang yang dapat dipercaya[a] dan lebih takut kepada Allah daripada banyak orang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang yang berpegang pada kebenaran”; dapat juga diterjemahkan “orang yang setia”.
    reason: lexical_alternative
  - marker: b
    text: Kata “ia” berbentuk tunggal dan paling wajar mengacu kepada Hananya, meskipun pujian ini dapat dipahami mendukung pengangkatan kedua orang itu secara umum.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: aku mengangkat
  rationale: Dalam konteks administratif ini, צוה menyatakan pemberian tugas atau wewenang. 'Mengangkat' alami dalam bahasa Indonesia dan mempertahankan gagasan penugasan resmi.
- source_word: חֲנָנִי אָחִי
  choice: Hanani, saudaraku
  rationale: Frasa ini mengidentifikasi Hanani sebagai saudara Nehemia; susunan dengan aposisi terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Nama diri Ibrani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שַׂר הַבִּירָה
  choice: kepala benteng
  rationale: שַׂר menunjuk pemimpin atau pejabat, sedangkan בִּירָה menunjuk kompleks pertahanan atau benteng. 'Kepala benteng' cukup luas untuk tidak memastikan jabatan militer yang tidak dinyatakan secara tegas.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: untuk memimpin Yerusalem
  rationale: עַל sesudah verba penugasan menunjukkan tanggung jawab atau kewenangan atas Yerusalem. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי הוּא
  choice: karena ia
  rationale: כִּי memperkenalkan alasan pengangkatan, dan pronomina tunggal dipertahankan agar ketegangan mengenai acuannya tidak dihapus.
- source_word: כְּאִישׁ אֱמֶת
  choice: orang yang dapat dipercaya
  rationale: אֱמֶת dalam penilaian kecakapan seseorang dapat berarti kebenaran, keteguhan, atau sifat dapat dipercaya. Pilihan ini menyampaikan makna etis-administratifnya secara alami.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: dan ... takut kepada Allah
  rationale: Terjemahan langsung ini mempertahankan idiom Ibrani tentang rasa gentar dan hormat kepada Allah.
- source_word: מֵרַבִּים
  choice: lebih ... daripada banyak orang
  rationale: מן komparatif dengan רַבִּים secara harfiah membandingkan dengan 'banyak orang'; pilihan ini tidak mempersempit maknanya menjadi 'kebanyakan orang'.
theological_decisions:
- issue: Acuan pronomina tunggal dalam klausa pujian
  choice: '''Ia'' dipertahankan sebagai bentuk tunggal dan paling wajar mengacu kepada Hananya, anteseden terdekat.'
  alternative: Pujian itu dapat dipahami mendukung pengangkatan kedua orang tersebut secara umum.
  rationale: Tata bahasa Ibrani memakai pronomina dan predikat tunggal. Terjemahan tidak mengubahnya menjadi bentuk jamak, sehingga ambiguitas kontekstual tetap terpelihara.
- issue: Makna takut kepada Allah
  choice: takut kepada Allah
  alternative: saleh atau menghormati Allah
  rationale: Ungkapan langsung mempertahankan bobot teologis ירא tanpa mereduksinya hanya menjadi kesalehan umum atau rasa hormat.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Bentuk orang pertama 'aku' mengikuti suara narator Nehemia. Susunan kalimat mempertahankan pronomina tunggal serta perbandingan harfiah 'daripada banyak orang' tanpa menyelesaikan ketegangan teks.
