lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Dalam konteks daftar keluarga dan sensus, bentuk jamak konstruksi ini menunjuk pada orang-orang dari garis keluarga atau kaum tertentu. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa membatasi mereka pada anak laki-laki langsung.
- source_word: עַזְגָּד
  choice: Azgad
  rationale: Nama diri atau nama keluarga ini ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2.322 orang
  rationale: Rangkaian bilangan Ibrani menyatakan jumlah 2.322. Angka ditulis dengan tanda titik sebagai pemisah ribuan menurut kaidah bahasa Indonesia, dan “orang” ditambahkan agar jumlah sensus terbaca jelas dan alami.
