base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: id
  text: Ketika tembok itu selesai dibangun dan pintu-pintu itu sudah kupasang, para penjaga pintu gerbang, para penyanyi, dan orang-orang Lewi ditugaskan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditetapkan” atau “didaftarkan”; kata kerja Ibrani ini dapat mempunyai arti administratif yang lebih luas daripada penunjukan resmi saja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Ungkapan ini memperkenalkan keadaan waktu dalam alur narasi. “Ketika” menyampaikannya secara alami tanpa menambahkan penanda wacana yang tidak eksplisit.
- source_word: נִבְנְתָה הַחוֹמָה
  choice: tembok itu selesai dibangun
  rationale: Bentuk Nifal menyatakan tindakan pasif. Kata “selesai” membuat urutan peristiwa jelas dan alami dalam bahasa Indonesia tanpa menambahkan gagasan “dibangun kembali,” yang tidak dinyatakan oleh verba Ibrani.
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: pintu-pintunya sudah kupasang
  rationale: Bentuk Hifil dari עמד di sini berarti menyebabkan berdiri atau menempatkan pada tempatnya. Untuk daun-daun pintu, “memasang” merupakan padanan Indonesia yang wajar; “sudah” menandai bahwa pemasangan telah berlangsung sebelum penugasan berikutnya.
- source_word: וַיִּפָּקְדוּ
  choice: ditugaskan
  rationale: Bentuk Nifal dari פקד memiliki cakupan administratif yang dapat berarti ditugaskan, ditetapkan, atau didaftarkan. “Ditugaskan” cocok dengan pengaturan para petugas sesudah pembangunan tembok, sementara catatan kaki mempertahankan keluasan maknanya.
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada orang-orang yang menjaga pintu atau gerbang. Bentuk lengkap ini jelas dan alami bagi pembaca modern.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Kata yang berasal dari akar שׁיר ini secara langsung menunjuk kepada para penyanyi, sering kali dalam pelayanan ibadah.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Ini adalah sebutan kelompok keturunan Lewi. Bentuk “orang-orang Lewi” merupakan ungkapan Indonesia yang jelas dan lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan narasi Ibrani, sedangkan bentuk “kupasang” menjaga sudut pandang orang pertama secara ringkas dan alami. Pengulangan “para” dan bentuk “orang-orang Lewi” dipakai agar ketiga kelompok terbaca jelas.
