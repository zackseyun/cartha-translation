  text: 'Orang-orang dari Nebo yang lain[a]: 52 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Nebo lain.” Kata sifat Ibrani ini dapat berarti “yang lain” atau “lain”; di sini kemungkinan besar kata itu membedakan tempat ini dari tempat lain yang juga bernama Nebo.
