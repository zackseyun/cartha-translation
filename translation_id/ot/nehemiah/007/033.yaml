lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang dari
  rationale: Bentuk jamak konstruktus dari אִישׁ. Dalam daftar pendataan berdasarkan daerah asal, ungkapan alami ini menunjuk kepada anggota atau wakil keluarga yang berasal dari tempat tersebut tanpa mempersempitnya secara tidak perlu menjadi penduduk tetap.
- source_word: נְבוֹ
  choice: Nebo
  rationale: Nama tempat ditransliterasikan dan tidak diterjemahkan.
- source_word: אַחֵר
  choice: yang lain
  rationale: Kata sifat ini dapat berarti 'yang lain' atau 'sebuah ... lain'. Di sini kemungkinan besar membedakan lokasi bernama Nebo ini dari Nebo yang disebut di bagian lain daftar; terjemahan mempertahankan pembedaan tersebut.
- source_word: חֲמִשִּׁים וּשְׁנָיִם
  choice: 52 orang
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'lima puluh dan dua'; angka ditulis dengan tata numerik modern, sementara 'orang' ditambahkan secara wajar untuk memperjelas satuan dalam daftar.
