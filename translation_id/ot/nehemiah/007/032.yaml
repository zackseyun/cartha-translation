translation:
  language: id
  text: Orang-orang dari Betel dan Ai[a], berjumlah seratus dua puluh tiga orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang laki-laki dari Betel dan Ai”; dalam daftar ini istilah tersebut dapat menunjuk kepada kelompok penduduk dari kedua kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang
  rationale: Bentuk jamak konstruksi dari אִישׁ menunjuk kepada kelompok yang berasal dari tempat-tempat tersebut. Dalam bahasa Indonesia, “orang-orang” merupakan padanan alami dan tidak memaksakan jenis kelamin ketika konteksnya berupa daftar kelompok penduduk.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, bukan diterjemahkan secara harfiah sebagai “rumah Allah”.
- source_word: וְהָעָי
  choice: dan Ai
  rationale: Konjungsi diterjemahkan “dan”; artikel Ibrani pada nama tempat tidak perlu dinyatakan dalam idiom bahasa Indonesia.
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: seratus dua puluh tiga orang
  rationale: Bilangan diterjemahkan secara tepat dan alami. Kata “orang” ditambahkan setelah bilangan untuk memperjelas satuan yang dihitung dalam bahasa Indonesia.
