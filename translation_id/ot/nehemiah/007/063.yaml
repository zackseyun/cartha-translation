  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: id
  text: 'Dari antara para imam: keturunan Hobaya, keturunan Hakos, dan keturunan Barzilai, yang leluhurnya memperistri salah seorang anak perempuan Barzilai, orang Gilead itu, lalu disebut menurut nama mereka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: Dari antara para imam
  rationale: Menyampaikan makna partitif מִן dan secara alami memperkenalkan kelompok keluarga imam dalam daftar.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan keluarga, בְּנֵי menunjuk kepada garis keluarga atau kaum, bukan hanya anak laki-laki langsung.
- source_word: חֳבַיָּה
  choice: Hobaya
  rationale: Transliterasi Indonesia yang wajar untuk nama Ibrani tersebut.
- source_word: הַקּוֹץ
  choice: Hakos
  rationale: Transliterasi Indonesia yang mempertahankan unsur kata sandang pada nama keluarga imam ini.
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Transliterasi nama diri yang lazim dan digunakan secara konsisten pada kedua kemunculannya.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: yaitu orang yang memperistri salah seorang anak perempuan
  rationale: Mengungkapkan idiom perkawinan Ibrani secara jelas dan alami; anteseden tunggal klausa relatif dipahami sebagai leluhur keluarga yang disebut Barzilai.
- source_word: הַגִּלְעָדִי
  choice: orang Gilead itu
  rationale: Menyampaikan adjektiva nisbah yang menandai asal Barzilai, dengan bentuk Indonesia yang alami.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: lalu disebut dengan nama keluarga mereka
  rationale: Mempertahankan bentuk pasif dan sufiks jamak Ibrani, sambil memperjelas bahwa yang dimaksud ialah nama keluarga pihak perempuan.
theological_decisions: []
translation_notes:
  register: Bahasa daftar dibuat ringkas, bermartabat, dan mudah dipahami. 'Keturunan' dipilih daripada 'anak-anak lelaki' karena konteksnya adalah kelompok keluarga. Tanda pisah membantu menunjukkan bahwa klausa relatif menerangkan leluhur keluarga Barzilai, bukan Barzilai orang Gilead.
