lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar penduduk, bentuk jamak konstruktus ini menunjuk pada orang-orang yang berasal dari atau termasuk dalam kelompok Yerikho. 'Keturunan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'anak-anak lelaki' dan tetap mempertahankan bentuk pengelompokan Ibrani.
- source_word: יְרֵחוֹ
  choice: Yerikho
  rationale: Nama tempat ini ditulis menurut ejaan baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: 345 orang
  rationale: Rangkaian bilangan Ibrani berjumlah 345. Kata 'orang' ditambahkan secara wajar agar fungsi angka sebagai jumlah anggota kelompok jelas dalam bahasa Indonesia.
