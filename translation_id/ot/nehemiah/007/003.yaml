source:
  edition: WLC
  text: ו/יאמר לָ/הֶ֗ם לֹ֣א יִפָּֽתְח֞וּ שַׁעֲרֵ֤י יְרוּשָׁלִַ֨ם֙ עַד חֹ֣ם הַ/שֶּׁ֔מֶשׁ וְ/עַ֨ד הֵ֥ם עֹמְדִ֛ים יָגִ֥יפוּ הַ/דְּלָת֖וֹת וֶ/אֱחֹ֑זוּ וְ/הַעֲמֵ֗יד מִשְׁמְרוֹת֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם אִ֚ישׁ בְּ/מִשְׁמָר֔/וֹ וְ/אִ֖ישׁ נֶ֥גֶד בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: id
  text: Aku berkata kepada mereka, “Gerbang-gerbang Yerusalem tidak boleh dibuka sampai matahari sudah panas.[a] Selagi mereka masih berjaga, hendaklah mereka menutup pintu-pintu gerbang dan mengamankannya.[b] Tempatkanlah juga penjaga-penjaga dari antara penduduk Yerusalem,[c] masing-masing di tempat jaganya dan masing-masing di depan rumahnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai panasnya matahari”; maksudnya bukan hanya sampai matahari terbit, melainkan sampai hari sudah agak siang.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berarti “memegangnya” atau “menahannya”; dalam konteks ini maksudnya ialah mengamankan pintu-pintu setelah ditutup.
    reason: lexical_alternative
  - marker: c
    text: Atau, “tetapkanlah giliran-giliran jaga dari antara penduduk Yerusalem.” Istilah Ibrani dapat menunjuk pada para penjaga, regu atau giliran jaga, maupun tugas penjagaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם
  choice: Gerbang-gerbang Yerusalem tidak boleh dibuka
  rationale: Bentuk Nifal יִפָּתְחוּ bersifat pasif, sedangkan לֹא dalam konteks perintah menyatakan larangan, bukan sekadar ramalan.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: sebelum matahari terasa panas
  rationale: Ungkapan ini secara konkret menunjuk pada panas matahari, yakni waktu yang lebih siang daripada saat matahari baru terbit. 'Sebelum' menyampaikan batas waktu larangan secara alami dalam bahasa Indonesia.
- source_word: וְעַד הֵם עֹמְדִים
  choice: Sementara para penjaga masih bertugas
  rationale: עמד secara harfiah berarti 'berdiri', tetapi dalam konteks pengamanan kota menunjukkan bahwa orang-orang tersebut masih berada di tempat tugas.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: hendaklah mereka menutup pintu-pintu gerbang
  rationale: הגיף berarti menutup, khususnya pintu. 'Pintu-pintu gerbang' memperjelas bahwa הַדְּלָתוֹת adalah daun pintu dari gerbang yang baru disebut.
- source_word: וֶאֱחֹזוּ
  choice: dan menguncinya
  rationale: אחז pada dasarnya berarti 'memegang atau menahan'; setelah pintu ditutup, konteks menuntut tindakan mengamankannya. 'Menguncinya' merupakan ungkapan Indonesia yang wajar tanpa menyebut mekanisme khusus seperti palang.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת
  choice: Tempatkanlah juga regu-regu penjaga
  rationale: Hifil עמד berarti menempatkan atau membuat berdiri. מִשְׁמְרוֹת dapat menunjuk pada regu, giliran, atau tugas jaga; 'regu-regu penjaga' cocok dengan asal mereka dari kalangan penduduk dan tetap mempertahankan kemungkinan unsur pembagian tugas.
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: dari antara penduduk Yerusalem
  rationale: 'Frasa ini dipahami secara partitif: orang-orang yang ditugaskan menjaga dipilih dari kalangan penduduk kota.'
- source_word: אִישׁ בְּמִשְׁמָרוֹ
  choice: masing-masing di tempat jaganya
  rationale: אִישׁ digunakan secara distributif, sedangkan מִשְׁמָר dapat berarti tugas, giliran, atau tempat jaga. 'Tempat jaganya' alami dan sesuai dengan konteks penempatan.
- source_word: וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: dan masing-masing di depan rumahnya
  rationale: נֶגֶד berarti di hadapan, di depan, atau berhadapan dengan. Pilihan ini mempertahankan hubungan ruang dengan rumah masing-masing tanpa menambahkan jarak tertentu.
