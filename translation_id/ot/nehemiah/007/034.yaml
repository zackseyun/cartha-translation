  text: the sons of another Elam[a], 1,254.
translation:
  language: id
  text: 'keturunan Elam yang lain[a]: 1.254 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Elam lainnya.” Ungkapan Ibraninya membedakan kelompok ini dari keturunan Elam yang disebut sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar keluarga atau sensus, bentuk jamak konstruksi dari בֵּן menunjuk pada anggota kelompok keturunan, bukan hanya anak laki-laki langsung. “Keturunan” alami dan tepat dalam bahasa Indonesia modern.
- source_word: עֵילָם
  choice: Elam
  rationale: Nama diri dipertahankan melalui transliterasi; dalam konteks ini nama tersebut menandai suatu keluarga atau kelompok keturunan.
- source_word: אַחֵר
  choice: yang lain
  rationale: Kata ini berarti “lain/yang lain” dan di sini membedakan kelompok Elam ini dari kelompok Elam yang telah disebut sebelumnya, tanpa memaksakan arti “kedua” ke dalam teks.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1.254'
  rationale: Rangkaian bilangan Ibrani menyatakan tepat seribu dua ratus lima puluh empat; angka dipakai agar daftar sensus mudah dibaca sesuai kaidah penulisan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan layak untuk daftar sensus. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok; tanda titik mengikuti kaidah Indonesia sebagai pemisah ribuan.
