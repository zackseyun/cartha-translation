lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali ini, bentuk konstruksi tersebut memperkenalkan keluarga atau kelompok leluhur. “Keturunan” terdengar alami dalam bahasa Indonesia dan tidak membatasi maknanya pada anak kandung langsung.
- source_word: בֵסַי
  choice: Besai
  rationale: Nama diri ini ditransliterasikan secara langsung sesuai bentuk Ibrani.
- source_word: מְעוּנִים
  choice: Meunim
  rationale: Bentuk ini dapat menunjuk pada suatu kelompok etnis, tetapi dalam pola daftar ini berfungsi sebagai nama keluarga atau kelompok. Transliterasi mempertahankan ambiguitas itu.
- source_word: נפושסים
  choice: Nefusyesim
  rationale: Transliterasi ini merepresentasikan bentuk konsonantal teks WLC, termasuk bunyi ש dengan “sy”; variasi “Nefusim” terdapat dalam tradisi yang mengikuti bentuk paralel atau penyederhanaan ejaan.
