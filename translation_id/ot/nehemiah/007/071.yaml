base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: id
  text: Adapun yang diberikan oleh rakyat selebihnya[a] ialah dua puluh ribu darik emas[b], dua ribu mina perak[c], dan enam puluh tujuh tunik para imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sisa rakyat itu.” Dalam konteks ini, ungkapan tersebut membedakan rakyat yang selebihnya dari para pemberi yang telah disebutkan sebelumnya, bukan terutama menyatakan gagasan teologis tentang suatu sisa.'
    reason: lexical_alternative
  - marker: b
    text: Darik adalah uang logam emas Persia.
    reason: cultural_note
  - marker: c
    text: Mina adalah satuan berat kuno yang juga digunakan untuk menyatakan nilai uang.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: memberikan
  rationale: Konstruksi relatif-resumtif ini memperkenalkan bagian berikutnya dalam daftar sumbangan. Susunan kalimat disesuaikan agar alami dalam bahasa Indonesia, sedangkan verba umum נָתַן tetap diterjemahkan secara langsung sebagai 'memberikan'.
- source_word: שְׁאֵרִית הָעָם
  choice: selebihnya dari rakyat
  rationale: Dalam konteks daftar administratif, frasa ini menunjuk kepada bagian rakyat selain para pemberi yang telah disebutkan, bukan secara khusus kepada kelompok 'sisa' dalam pengertian teologis.
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: darik emas
  rationale: Istilah historis bagi uang logam emas Persia dipertahankan demi ketepatan, dengan keterangan singkat dalam catatan kaki.
- source_word: שְׁתֵּי רִבּוֹא
  choice: dua puluh ribu
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'dua laksa' dinyatakan dengan bentuk bilangan baku dalam bahasa Indonesia modern.
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: dua ribu mina perak
  rationale: Mina merupakan satuan berat kuno yang juga dipakai untuk menyatakan nilai. Istilah kunonya dipertahankan tanpa memaksakan padanan ukuran modern yang tidak pasti.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: tunik imam
  rationale: כֻּתֹּנֶת menunjuk pada pakaian panjang seperti tunik. Bentuk 'tunik imam' ringkas dan mempertahankan hubungan genitif tanpa menambahkan fungsi liturgis yang tidak dinyatakan.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: enam puluh tujuh
  rationale: Bilangan diterjemahkan dalam bentuk baku bahasa Indonesia modern.
theological_decisions:
- issue: Makna שְׁאֵרִית הָעָם
  choice: selebihnya dari rakyat
  alternative: sisa umat itu
  rationale: Konteksnya adalah pembagian kelompok pemberi dalam catatan administratif. Pilihan utama menghindari kesan bahwa ayat ini sedang memakai konsep teologis tentang umat yang tersisa, sambil mencatat kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Istilah historis 'darik' dan 'mina' dipertahankan serta dijelaskan melalui catatan kaki. 'Rakyat' dipilih untuk הָעָם dalam konteks daftar komunitas, dan 'tunik imam' mempertahankan jenis pakaian tanpa memperluas maknanya.
