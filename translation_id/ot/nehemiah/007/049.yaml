  text: בְּנֵי חָנָ֥ן בְּנֵי גִדֵּ֖ל בְּנֵי גָֽחַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/049.yaml
  text: the sons of Hanan[a], the sons of Giddel, the sons of Gahar—
translation:
  language: id
  text: keturunan Hanan[a], keturunan Gidel, keturunan Gahar—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Hanan”; demikian juga untuk nama-nama berikutnya. Ungkapan Ibrani ini dapat menunjuk kepada keturunan, kaum, atau garis keluarga, bukan hanya anak laki-laki langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah atau kelompok seperti ini, bentuk jamak konstruktus dari בֵּן dapat menunjuk kepada anggota garis keluarga atau kaum, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan fungsi kolektif itu secara alami dalam bahasa Indonesia.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri atau nama kaum; ditransliterasikan sesuai bentuk Ibrani.
- source_word: גִדֵּל
  choice: Gidel
  rationale: Nama diri dalam daftar para pelayan Bait Allah; ejaan Indonesia memakai satu konsonan untuk menghindari penggandaan yang tidak diperlukan.
- source_word: גָחַר
  choice: Gahar
  rationale: Nama diri; ditransliterasikan secara langsung dan wajar dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan formula daftar dipertahankan, sedangkan 'keturunan' dipilih agar makna kolektif genealogis jelas. Tanda pisah akhir mengikuti kesinambungan daftar pada teks konsultasi.
