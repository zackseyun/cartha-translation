  yaml_path: translation/ot/nehemiah/007/051.yaml
  text: the sons of Gazzam[a], the sons of Uzza, the sons of Paseah.
translation:
  language: id
  text: keturunan Gazam[a], keturunan Uza, keturunan Paseah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Gazam”; demikian juga untuk “keturunan” berikutnya. Rumus silsilah Ibrani ini dapat menunjuk pada garis keluarga yang lebih luas, bukan hanya anak-anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar silsilah, bentuk jamak konstruksi dari בֵּן dapat menunjuk pada keturunan atau anggota garis keluarga, bukan hanya anak laki-laki langsung. “Keturunan” paling alami dan tepat dalam bahasa Indonesia modern.
- source_word: גַזָּם
  choice: Gazam
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; huruf rangkap Ibrani tidak perlu digandakan dalam bentuk Indonesia.
- source_word: עֻזָּא
  choice: Uza
  rationale: Nama diri ditransliterasikan secara ringkas dan alami menurut ejaan Indonesia.
- source_word: פָסֵחַ
  choice: Paseah
  rationale: Nama diri ditransliterasikan dengan mempertahankan bunyi konsonan akhir Ibrani secara wajar dalam tradisi nama Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai dengan gaya daftar sensus. Pengulangan struktur Ibrani dipertahankan, sedangkan “keturunan” dipilih agar makna genealogisnya jelas dan alami.
