  text: 'Keturunan Binui: enam ratus empat puluh delapan orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Dalam konteks daftar sensus berdasarkan keluarga atau kaum, בְּנֵי menunjuk kepada anggota garis keluarga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan maksud ini secara alami dalam bahasa Indonesia.
- source_word: בִנּוּי
  choice: Binui
  rationale: Nama pribadi atau nama leluhur keluarga ini dialihaksarakan menurut bentuk yang lazim dan dekat dengan pelafalan Ibrani.
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁמֹנָה
  choice: enam ratus empat puluh delapan orang
  rationale: Rangkaian bilangan Ibrani berjumlah 648. Bilangan ditulis dengan kata-kata agar sesuai dengan gaya sastra, sedangkan 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka itu adalah jumlah anggota kelompok.
