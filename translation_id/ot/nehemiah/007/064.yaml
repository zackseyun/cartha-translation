  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: id
  text: Mereka mencari catatan silsilah mereka[a], tetapi catatan itu tidak ditemukan. Karena itu, mereka dinyatakan tidak layak untuk keimaman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “catatan mereka dalam daftar silsilah.” Bahasa Ibrani menunjuk pada dokumen tertulis yang digunakan untuk menetapkan garis keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka dikeluarkan dari keimaman.” Kata Ibrani ini dapat mengandung nuansa bahwa mereka dianggap tidak murni atau tercemar; dalam konteks ini akibatnya ialah ketidaklayakan bagi keimaman karena silsilah mereka tidak dapat dibuktikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Mereka
  rationale: Kata tunjuk jamak ini merujuk kembali kepada orang-orang yang baru disebutkan. Dalam bahasa Indonesia, pronomina “mereka” menghasilkan rujukan yang alami tanpa menambahkan kata benda yang tidak terdapat dalam teks.
- source_word: בִּקְשׁוּ
  choice: mencari
  rationale: Kata kerja בקשׁ berarti mencari atau berusaha menemukan; “mencari” lugas dan alami dalam konteks pemeriksaan dokumen.
- source_word: כְתָבָם הַמִּתְיַחְשִׂים
  choice: catatan tertulis tentang silsilah mereka
  rationale: כְּתָב menunjuk pada tulisan atau dokumen, sedangkan bentuk dari יחס berkaitan dengan pencatatan atau pembuktian garis keturunan. Terjemahan ini menyampaikan fungsi dokumen tersebut tanpa menentukan format administratifnya secara berlebihan.
- source_word: וְלֹא נִמְצָא
  choice: tetapi catatan itu tidak ditemukan
  rationale: Kata kerja tunggal pasif secara alami mengacu kepada catatan tertulis yang dicari, bukan kepada orang-orangnya.
- source_word: וַיְגֹאֲלוּ
  choice: mereka dinyatakan tidak layak
  rationale: Dalam konteks ini, bentuk dari גאל menyatakan bahwa mereka diperlakukan sebagai tercemar atau tidak memenuhi syarat. “Dinyatakan tidak layak” mengungkapkan akibat resminya tanpa memberi kesan bahwa teks secara eksplisit menyebut suatu upacara kenajisan.
- source_word: מִן הַכְּהֻנָּה
  choice: untuk menjadi imam
  rationale: כְּהֻנָּה berarti keimaman atau jabatan imam. Ungkapan ini menyampaikan secara alami bahwa mereka tidak diperbolehkan menjalankan kedudukan dan pelayanan imam.
theological_decisions:
- issue: Apakah וַיְגֹאֲלוּ harus diterjemahkan secara harfiah sebagai “dinajiskan” atau secara kontekstual sebagai ketidaklayakan bagi keimaman?
  choice: mereka dinyatakan tidak layak untuk menjadi imam
  alternative: mereka dianggap najis dan dikeluarkan dari keimaman
  rationale: Pilihan utama mempertahankan hasil hukum-administratif dalam konteks pembuktian silsilah, sedangkan catatan kaki mengakui nuansa dasar verba yang berkaitan dengan keadaan tercemar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar hubungan antara pencarian dokumen, kegagalan menemukannya, dan akibat bagi status keimaman mudah dipahami. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
