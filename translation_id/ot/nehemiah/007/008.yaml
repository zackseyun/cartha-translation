lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Bentuk jamak konstruksi dari בֵּן dalam daftar keluarga atau kaum. Dalam konteks ini, kata tersebut menunjuk kepada anggota garis keturunan Paros, bukan hanya anak laki-laki langsung; “keturunan” menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: פַרְעֹשׁ
  choice: Paros
  rationale: Nama diri Ibrani ditransliterasikan sesuai bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אַלְפַּיִם מֵאָה וְשִׁבְעִים וּשְׁנָיִם
  choice: 2.172 orang
  rationale: Rangkaian bilangan Ibrani berjumlah 2.172. Angka ditulis dengan digit dan tanda pemisah ribuan menurut kaidah Indonesia; “orang” memperjelas satuan yang tersirat dalam daftar sensus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar sensus. Titik dua menandai jumlah anggota kelompok, sedangkan “orang” membuat angka itu jelas bagi pembaca modern.
