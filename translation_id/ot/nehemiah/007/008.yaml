  text: 'Keturunan Paros[a]: 2.172 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Paros”; dalam daftar ini ungkapan tersebut merupakan sebutan bagi suatu garis keturunan atau kaum.
