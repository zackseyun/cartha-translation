lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar penduduk atau silsilah, bentuk jamak konstruktus ini menunjuk pada orang-orang dari garis keluarga atau kaum tertentu. “Keturunan” lebih alami dalam bahasa Indonesia daripada “anak-anak lelaki” dan tidak membatasi mereka sebagai putra langsung.
- source_word: חָשֻׁם
  choice: Hasum
  rationale: Nama diri atau nama keluarga ini ditransliterasikan menurut ejaan Indonesia; huruf Ibrani ח direpresentasikan secara sederhana dengan h.
- source_word: שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: 328 orang
  rationale: Rangkaian bilangan Ibrani berarti tepat tiga ratus dua puluh delapan. Angka dan kata “orang” menyampaikan jumlah anggota kelompok dengan ringkas dan alami dalam sebuah daftar.
