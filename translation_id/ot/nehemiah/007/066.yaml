lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: Seluruh jemaah itu
  rationale: Frasa ini mencakup keseluruhan komunitas yang terdaftar. “Jemaah” merupakan padanan alami bagi קָהָל dalam konteks umat yang berhimpun, tanpa membatasi maknanya pada pertemuan ibadah.
- source_word: כְּאֶחָד
  choice: jika dihitung sebagai satu kesatuan
  rationale: Secara harfiah berarti “sebagai satu.” Dalam ringkasan sensus ini, frasa tersebut menunjukkan bahwa seluruh jemaah dijumlahkan sebagai satu total.
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת וְשִׁשִּׁים
  choice: 42.360 orang
  rationale: Ungkapan bilangan Ibrani menyatakan empat puluh dua ribu tiga ratus enam puluh. Angka ditulis dengan format baku Indonesia, dan “orang” ditambahkan secara wajar untuk memperjelas bahwa ini jumlah manusia.
