  text: 'the sons of Delaiah, the sons of Tobiah, the sons of Nekoda: six hundred forty-two.'
translation:
  language: id
  text: 'keturunan Delaya, keturunan Tobia, keturunan Nekoda: 642 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar sensus dan silsilah, kata ini menunjukkan anggota kelompok keluarga berdasarkan garis leluhur. 'Keturunan' lebih alami dan tepat dalam bahasa Indonesia daripada 'anak-anak', karena yang dimaksud tidak harus anak kandung langsung.
- source_word: דְלָיָה
  choice: Delaya
  rationale: Nama diri ditransliterasikan ke dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: טוֹבִיָּה
  choice: Tobia
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Nama diri ditransliterasikan tanpa menerjemahkan maknanya.
- source_word: שֵׁשׁ מֵאוֹת וְאַרְבָּעִים וּשְׁנָיִם
  choice: 642 orang
  rationale: Bilangan Ibrani berarti enam ratus empat puluh dua. Penambahan 'orang' memperjelas bahwa angka tersebut adalah jumlah anggota kelompok yang didata dan sesuai dengan gaya alami daftar sensus dalam bahasa Indonesia.
