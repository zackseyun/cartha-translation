  text: הַֽ/כֹּהֲנִ֑ים בְּנֵ֤י יְדַֽעְיָה֙ לְ/בֵ֣ית יֵשׁ֔וּעַ תְּשַׁ֥ע מֵא֖וֹת שִׁבְעִ֥ים וּ/שְׁלֹשָֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/039.yaml
  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: id
  text: 'Para imam: keturunan Yedaya[a], dari keluarga Yesua[b], 973 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Yedaya”; dalam daftar silsilah, ungkapan Ibrani ini dapat berarti keturunan atau anggota suatu garis keluarga, bukan hanya anak kandung langsung.
    reason: lexical_alternative
  - marker: b
    text: Nama “Yesua” berkaitan dengan nama “Yosua”, tetapi bentuk “Yesua” lebih dekat dengan bentuk Ibrani yang dipakai dalam konteks pascapembuangan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Para imam
  rationale: Nomina jamak definit yang memperkenalkan kelompok imam dalam daftar sensus; bentuk ini lugas dan tidak menambahkan verba yang tidak terdapat dalam teks Ibrani.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks silsilah dan sensus, istilah ini dapat menunjuk pada keturunan atau anggota garis keluarga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Nama pribadi ditransliterasikan secara wajar menurut bentuk Ibrani dan kaidah nama Alkitab dalam bahasa Indonesia.
- source_word: לְבֵית יֵשׁוּעַ
  choice: dari keluarga Yesua
  rationale: בַּיִת dengan nama pribadi menunjuk pada rumah tangga atau garis keluarga, sedangkan prefiks ל menyatakan afiliasi dalam susunan daftar ini. 'Dari keluarga' alami dan jelas bagi pembaca modern.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi ini mencerminkan bentuk pascapembuangan יֵשׁוּעַ dan membedakannya dari bentuk nama Yosua.
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: 973 orang
  rationale: Rangkaian bilangan berjumlah 973; penambahan 'orang' memperjelas bahwa angka tersebut menghitung anggota kelompok tanpa mengubah makna.
