lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar sensus dan silsilah pascapembuangan, kata ini memperkenalkan kelompok keluarga atau kaum. “Keturunan” lebih alami dalam bahasa Indonesia modern daripada ungkapan harfiah “anak-anak lelaki”, tanpa membatasi kelompok itu pada generasi langsung.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Zatu” mengikuti penyesuaian ejaan yang wajar dalam bahasa Indonesia.
- source_word: שְׁמֹנֶה מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: delapan ratus empat puluh lima orang
  rationale: Rangkaian bilangan Ibrani menyatakan jumlah tepat 845. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut menghitung anggota kelompok.
