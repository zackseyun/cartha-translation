  text: the sons of Reaiah[a], the sons of Rezin, the sons of Nekoda.
translation:
  language: id
  text: anak-anak Reaya[a], anak-anak Rezin, dan anak-anak Nekoda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar silsilah ini, “anak-anak” juga dapat berarti “keturunan” atau “anggota keluarga”; demikian pula pada setiap kemunculan berikutnya dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן dipertahankan secara formal. Dalam konteks daftar silsilah, ungkapan ini dapat menunjuk bukan hanya kepada anak kandung, melainkan juga kepada keturunan atau anggota suatu keluarga.
- source_word: רְאָיָה
  choice: Reaya
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: רְצִין
  choice: Rezin
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani dan ejaan Indonesia yang lazim.
- source_word: נְקוֹדָא
  choice: Nekoda
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; vokal akhir dipertahankan tanpa menambahkan huruf h yang tidak diperlukan dalam ejaan Indonesia.
theological_decisions: []
