- source_word: מִכְמָס
  choice: Mikmas
  rationale: Nama tempat ini ditransliterasikan langsung dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: מֵאָה וְ/עֶשְׂרִים וּ/שְׁנָיִם
  choice: 122 orang
  rationale: Angka dipakai agar daftar sensus mudah dibaca; kata “orang” sesudah angka memperjelas bahwa bilangan itu menyatakan jumlah anggota kelompok.
