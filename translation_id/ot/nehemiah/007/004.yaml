  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Frasa 'penduduk di dalamnya' dipilih agar jelas bagi pembaca umum; struktur koordinatif Ibrani diperlancar tanpa mengubah kontras atau isi ayat.
