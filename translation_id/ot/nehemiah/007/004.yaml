  text: וְ/הָ/עִ֞יר רַחֲבַ֤ת יָדַ֨יִם֙ וּ/גְדוֹלָ֔ה וְ/הָ/עָ֥ם מְעַ֖ט בְּ/תוֹכָ֑/הּ וְ/אֵ֥ין בָּתִּ֖ים בְּנוּיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/004.yaml
  text: The city was wide and large[a], but the people within it were few, and no houses had been built.
translation:
  language: id
  text: Kota itu luas dan besar,[a] tetapi penduduk di dalamnya sedikit, dan tidak ada rumah yang dibangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Dan kota itu luas dan besar, dan penduduk di dalamnya sedikit, dan tidak ada rumah yang dibangun.”'
    reason: Teks utama memakai hubungan kontras yang alami dalam bahasa Indonesia, sedangkan bahasa Ibrani menyusun klausa-klausanya secara koordinatif dengan kata “dan”.
lexical_decisions:
- source_word: וְהָעִיר
  choice: Kota itu
  rationale: Nomina definit הָעִיר berarti 'kota itu'. Konjungsi וְ tidak dinyatakan tersendiri karena ayat ini secara alami berfungsi sebagai kelanjutan naratif dalam bahasa Indonesia.
- source_word: רַחֲבַת יָדַיִם
  choice: luas
  rationale: Ungkapan harfiah 'lebar tangan-tangan' menyatakan keluasan atau bentangan ruang; 'luas' merupakan padanan alami dalam bahasa Indonesia.
- source_word: וּגְדוֹלָה
  choice: dan besar
  rationale: גדול di sini menunjuk pada ukuran kota, sehingga 'besar' lebih tepat daripada pengertian status atau keagungan.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: tetapi penduduk di dalamnya hanya sedikit
  rationale: הָעָם dalam konteks jumlah penghuni kota wajar diterjemahkan 'penduduk'. 'Tetapi' menyatakan kontras yang tersirat antara kota yang besar dan jumlah penghuninya yang sedikit; 'hanya sedikit' menyampaikan מְעַט secara alami.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: dan belum ada rumah-rumah yang dibangun
  rationale: אֵין menyatakan ketiadaan, sedangkan בְּנוּיִם adalah bentuk pasif 'dibangun'. 'Belum ada' sesuai dengan konteks tahap pemulihan kota tanpa menambahkan unsur leksikal 'dibangun kembali' yang tidak dinyatakan oleh teks Ibrani.
