  text: וּ/מִ/קְצָת֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת נָתְנ֖וּ לַ/מְּלָאכָ֑ה הַ/תִּרְשָׁ֜תָא נָתַ֣ן לָ/אוֹצָ֗ר זָהָ֞ב דַּרְכְּמֹנִ֥ים אֶ֨לֶף֙ מִזְרָק֣וֹת חֲמִשִּׁ֔ים כָּתְנוֹת֙ כֹּֽהֲנִ֔ים שְׁלֹשִׁ֖ים וַ/חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: id
  text: Sebagian kepala kaum keluarga menyumbang untuk pekerjaan itu. Gubernur[a] menyumbangkan kepada perbendaharaan seribu darik emas[b], lima puluh mangkuk, dan lima ratus tiga puluh lima tunik imam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tirsyata”, sebuah gelar administratif Persia.
    reason: lexical_alternative
  - marker: b
    text: Darik adalah mata uang emas Persia.
    reason: cultural_note
  - marker: c
    text: Teks Ibrani berbunyi “lima ratus tiga puluh lima tunik imam”. Bagian sejajar dalam Ezra 2:69 berbunyi “seratus tunik imam”; sejumlah terjemahan menyelaraskan kedua bagian ini atau mengikuti tradisi teks yang berbeda.
    reason: textual_variant
lexical_decisions:
- source_word: וּמִקְצָת
  choice: Sebagian
  rationale: Mengungkapkan makna partitif, yaitu hanya sebagian dari kelompok tersebut, secara alami dalam bahasa Indonesia.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: kepala kaum keluarga
  rationale: Istilah ini menunjuk kepada para pemimpin kelompok keluarga atau kaum leluhur pada masa pascapembuangan; pilihan ini mempertahankan unsur kepemimpinan dan hubungan kekeluargaan tanpa terjemahan harfiah yang kaku.
- source_word: נָתְנוּ לַמְּלָאכָה
  choice: menyumbang untuk pekerjaan itu
  rationale: Kata kerja 'menyumbang' secara alami menyatakan pemberian bagi pekerjaan pembangunan yang dimaksud, sedangkan 'pekerjaan itu' tetap dekat dengan מְלָאכָה.
- source_word: הַתִּרְשָׁתָא
  choice: Gubernur
  rationale: Menerjemahkan gelar administratif Persia ini berdasarkan fungsinya agar langsung dipahami pembaca; bentuk gelarnya dicatat dalam catatan kaki.
- source_word: לָאוֹצָר
  choice: ke dalam perbendaharaan
  rationale: Dalam konteks penyimpanan sumbangan berharga, 'perbendaharaan' paling sesuai untuk אוֹצָר dan frasa ini mempertahankan arah pemberian yang dinyatakan oleh preposisi.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: seribu darik emas
  rationale: Darik adalah mata uang emas Persia yang dimaksud dalam konteks ini; transliterasi istilah historis menjaga ketepatan lebih baik daripada istilah umum 'keping emas'.
- source_word: מִזְרָקוֹת
  choice: bokor
  rationale: Istilah ini menunjuk kepada wadah atau mangkuk yang digunakan dalam konteks ibadah. 'Bokor' merupakan padanan Indonesia yang ringkas dan sesuai bagi wadah seremonial.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: tunik imam
  rationale: כָּתְנוֹת menunjuk kepada pakaian berbentuk tunik, dan konstruksi dengan כֹּהֲנִים menyatakan tunik yang diperuntukkan bagi para imam.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: lima ratus tiga puluh lima
  rationale: Mengikuti teks Ibrani Masoret sebagaimana dituliskan dan diberi tanda vokal, tanpa menyelaraskannya dengan angka dalam Ezra 2:69.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan daftar dalam teks Ibrani. Istilah historis 'darik' dan alternatif gelar Persia dijelaskan melalui catatan kaki; perbedaan angka dengan Ezra 2:69 dipertahankan sebagai ketegangan tekstual, bukan diselaraskan.
