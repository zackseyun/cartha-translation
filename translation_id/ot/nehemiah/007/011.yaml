translation:
  language: id
  text: Keturunan Pahat-Moab[a], dari keturunan Yesua dan Yoab, berjumlah 2.818 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Pahat-Moab ... dari anak-anak Yesua dan Yoab.” Dalam daftar keluarga seperti ini, ungkapan Ibrani “anak-anak” dapat berarti keturunan atau anggota garis keluarga, bukan hanya anak kandung langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar keluarga, kata ini menunjuk pada anggota garis keluarga atau kaum, bukan hanya anak kandung langsung. “Keturunan” menyampaikan cakupan tersebut secara alami dalam bahasa Indonesia modern.
- source_word: פַחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Nama diri ini ditransliterasikan, bukan diterjemahkan. Tanda hubung mempertahankan bentuk nama majemuk yang lazim.
- source_word: לִבְנֵי
  choice: dari keturunan
  rationale: Prefiks ל di sini menandai penggolongan atau cabang keluarga dalam kelompok Pahat-Moab. “Dari keturunan” mempertahankan hubungan genealogis tanpa memaksakan penjelasan yang lebih sempit.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi ini mencerminkan bentuk Ibrani pascapembuangan יֵשׁוּעַ dan membedakannya dari bentuk yang lebih panjang, Yosua.
- source_word: וְיוֹאָב
  choice: dan Yoab
  rationale: Kata sambung sederhana diikuti transliterasi baku nama diri.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
  choice: 2.818 orang
  rationale: Angka Ibraninya tepat berjumlah 2.818. Angka ditulis dengan digit agar daftar sensus mudah dibaca; “orang” memperjelas satuan yang tersirat oleh konteks.
