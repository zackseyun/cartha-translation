  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: id
  text: 'Inilah orang-orang dari provinsi itu yang datang dari penawanan kaum buangan[a], yang telah dibawa ke pembuangan oleh Nebukadnezar, raja Babel, dan yang kembali ke Yerusalem dan ke Yehuda, masing-masing ke kotanya sendiri[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih luwes, “dari pembuangan.” Secara lebih harfiah, teks Ibrani berbunyi “dari penawanan kaum buangan,” dengan mempertahankan dua kata benda yang berkaitan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap orang ke kotanya.” Ini merupakan ungkapan distributif yang dapat merujuk kepada para perantau yang kembali menurut keluarga atau rumah tangga masing-masing.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: orang-orang dari provinsi itu
  rationale: Secara harfiah berarti ‘anak-anak provinsi itu’, tetapi בְּנֵי di sini merupakan ungkapan keanggotaan. Pilihan ini menyampaikan bahwa mereka adalah warga atau anggota komunitas provinsi tersebut tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: הָעֹלִים
  choice: yang datang
  rationale: עלה secara harfiah menggambarkan gerakan ‘naik’, khususnya menuju negeri itu atau Yerusalem. Dalam konteks ini, ‘datang’ terdengar alami dalam bahasa Indonesia dan tetap menyatakan perpindahan para pengungsi dari tempat penawanan.
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: dari penawanan kaum buangan
  rationale: Terjemahan ini mempertahankan kedua nomina Ibrani yang berkaitan, yaitu keadaan tertawan dan kaum yang dibuang, alih-alih meratakannya menjadi satu kata ‘pembuangan’.
- source_word: אֲשֶׁר הֶגְלָה
  choice: yang telah dibuang
  rationale: Bentuk kausatif ini menyatakan bahwa Nebukadnezar memindahkan mereka secara paksa. ‘Dibuang’ sesuai dengan kosakata Alkitab Indonesia dan tidak terdengar seadministratif ‘dideportasi’.
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל
  choice: Nebukadnezar, raja Babel
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia serta mempertahankan gelar dan nama wilayahnya.
- source_word: וַיָּשׁוּבוּ
  choice: Mereka kembali
  rationale: Klausa ini menerjemahkan verba finit Ibrani secara langsung sebagai kelanjutan utama narasi, bukan meleburkannya ke dalam klausa relatif sebelumnya.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: ke Yerusalem dan ke Yehuda
  rationale: Preposisi yang diulang dalam bahasa Ibrani dipertahankan. Yehuda di sini menunjuk pada wilayah, bukan hanya suku.
- source_word: אִישׁ לְעִירוֹ
  choice: masing-masing ke kotanya sendiri
  rationale: Ungkapan distributif ini menyatakan bahwa setiap orang atau kelompok keluarga kembali ke kota asal masing-masing. Rumusan Indonesia ini alami sekaligus mempertahankan bentuk tunggal distributif.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: masing-masing ke kotanya sendiri
  alternative: setiap laki-laki ke kotanya
  rationale: Dalam konteks daftar orang yang kembali, אִישׁ berfungsi secara distributif dan dapat mewakili para kepala keluarga beserta rumah tangga mereka. ‘Masing-masing’ mempertahankan fungsi itu tanpa memberi kesan bahwa hanya laki-laki yang ikut kembali.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibagi menjadi dua kalimat agar rangkaian klausa tetap jelas, sedangkan tanda titik dua dipertahankan karena ayat berikutnya memulai daftar nama.
