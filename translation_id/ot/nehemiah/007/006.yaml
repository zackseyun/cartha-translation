  to: 'Inilah orang-orang dari provinsi itu yang datang dari penawanan kaum buangan[a], yang telah dibawa ke pembuangan oleh Nebukadnezar, raja Babel, dan yang kembali ke Yerusalem dan ke Yehuda, masing-masing ke kotanya sendiri[b]:'
