base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: id
  text: 'Beberapa kepala kaum leluhur memberikan kepada perbendaharaan untuk pekerjaan itu: dua puluh ribu darik emas[a] dan dua ribu dua ratus mina perak[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Darik adalah koin emas Persia.
    reason: cultural_note
  - marker: b
    text: Mina adalah satuan berat kuno yang juga digunakan untuk menyatakan nilai uang.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: Beberapa kepala kaum leluhur
  rationale: Prefiks מִן menyatakan 'dari antara', sehingga secara idiomatis berarti beberapa orang dari kalangan para kepala. 'Kepala kaum leluhur' mempertahankan corak genealogis-administratif ungkapan Ibrani tanpa memakai bentuk Indonesia yang kaku seperti 'kepala rumah-rumah bapa'.
- source_word: נָתְנוּ
  choice: memberikan
  rationale: Padanan langsung bagi bentuk qal perfek; tidak menambahkan nuansa khusus seperti 'menyumbangkan' yang tidak dinyatakan secara eksplisit.
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: kepada perbendaharaan untuk pekerjaan itu
  rationale: אוֹצָר adalah tempat penyimpanan harta atau dana, sedangkan הַמְּלָאכָה menunjuk pada pekerjaan yang dibiayai. Rumusan ini alami dalam bahasa Indonesia dan menyampaikan tujuan pemberian.
- source_word: דַּרְכְּמוֹנִים
  choice: dirham emas
  rationale: Istilah ini menunjuk pada koin emas Persia yang dikenal sebagai darik. 'Dirham emas' dipilih karena bentuk tersebut telah lazim dalam tradisi penerjemahan Alkitab Indonesia, sementara catatan kaki menjelaskan identitas historisnya dengan tepat.
- source_word: שְׁתֵּי רִבּוֹת
  choice: dua puluh ribu
  rationale: Ungkapan harfiahnya adalah 'dua puluh ribuan'; bentuk bilangan Indonesia yang wajar ialah 'dua puluh ribu'.
- source_word: מָנִים
  choice: mina
  rationale: Mempertahankan nama satuan berat kuno dan menghindari penggantian dengan satuan modern yang tidak tepat.
- source_word: אַלְפַּיִם וּמָאתָיִם
  choice: dua ribu dua ratus
  rationale: Bentuk bilangan baku dan alami dalam bahasa Indonesia modern.
