translation:
  language: id
  text: Keturunan Lebana[a], keturunan Hagaba, dan keturunan Salmai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Lebana”. Rumus silsilah Ibrani yang sama dipakai pada ketiga nama dalam ayat ini dan dapat berarti keturunan atau anggota suatu kaum, bukan hanya anak laki-laki langsung.
    reason: lexical_alternative
  - marker: b
    text: Dalam daftar sejajar di Ezra 2:46, nama terakhir ini berbentuk “Samlai”. Bentuk Ibrani dalam Nehemia 7:48 adalah Shalmai; dalam terjemahan ini nama itu dieja “Salmai”.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah atau kelompok, bentuk ini dapat menunjuk bukan hanya kepada anak laki-laki langsung, melainkan juga kepada garis keluarga atau anggota suatu kaum. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: לְבָנָה
  choice: Lebana
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia; huruf he pada akhir nama tidak perlu ditampilkan sebagai h.
- source_word: חֲגָבָה
  choice: Hagaba
  rationale: Nama diri ditransliterasikan menurut pelafalan Masoret dan kaidah ejaan Indonesia.
- source_word: שַׁלְמָי
  choice: Salmai
  rationale: Nama diri ini mengikuti bentuk Masoret dalam Nehemia dan ejaan nama yang alami dalam bahasa Indonesia; שׁ direpresentasikan dengan s sesuai kebiasaan ejaan nama Alkitab Indonesia.
