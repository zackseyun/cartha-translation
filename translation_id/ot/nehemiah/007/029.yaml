  text: 'the men of Kiriath-jearim[a], Kephirah, and Beeroth: 743'
translation:
  language: id
  text: 'orang-orang dari Kiryat-Yearim, Kefira, dan Beerot: 743 orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang dari
  rationale: Bentuk konstruksi jamak dari אִישׁ memperkenalkan orang-orang yang berasal dari kota-kota tersebut dalam daftar pendataan. Bahasa Indonesia tidak perlu menandai gender gramatikal di sini; pilihan ini alami dan tidak mempersempit rujukan melampaui konteks.
- source_word: קִרְיַת יְעָרִים
  choice: Kiryat-Yearim
  rationale: Nama tempat ditransliterasikan langsung dari bahasa Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: כְּפִירָה
  choice: Kefira
  rationale: Nama tempat ditransliterasikan sesuai bunyi Ibrani dan kaidah ejaan Indonesia.
- source_word: וּבְאֵרוֹת
  choice: dan Beerot
  rationale: Konjungsi וּ diterjemahkan 'dan', sedangkan nama tempat בְאֵרוֹת ditransliterasikan sebagai 'Beerot' untuk mempertahankan dua vokal e yang berasal dari bentuk Ibrani.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: 743 orang
  rationale: Bilangan Ibrani berjumlah tepat 743. Angka dipakai agar daftar sensus mudah dibaca; 'orang' ditambahkan secara alami untuk memperjelas satuannya.
theological_decisions: []
