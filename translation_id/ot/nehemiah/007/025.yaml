  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Gibeon.” Dalam daftar silsilah atau pendataan, ungkapan Ibrani ini dapat menunjuk pada kelompok keturunan atau komunitas yang lebih luas, bukan hanya anak-anak kandung laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Bentuk jamak konstruktus dari בֵּן secara harfiah berarti “anak-anak,” tetapi dalam daftar silsilah dan pendataan dapat menunjuk pada kelompok keturunan atau anggota komunitas yang lebih luas. “Keturunan” mempertahankan nuansa genealogis dalam bahasa Indonesia yang wajar.
- source_word: גִבְעוֹן
  choice: Gibeon
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: sembilan puluh lima orang
  rationale: Ungkapan bilangan ini berarti 95. Kata “orang” ditambahkan agar daftar jumlah penduduk terbaca alami dalam bahasa Indonesia tanpa mengubah maknanya.
