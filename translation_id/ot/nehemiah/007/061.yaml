source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: id
  text: Inilah orang-orang yang datang dari Tel-Melah, Tel-Harsa, Kerub, Adon[a], dan Imer, tetapi mereka tidak dapat menunjukkan keluarga pihak ayah mereka dan keturunan mereka, apakah mereka termasuk orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ezra 2:59 memakai nama “Adan”, sedangkan teks Nehemia di sini memakai “Adon”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “rumah bapak-bapak mereka”; ini adalah ungkapan Ibrani untuk keluarga menurut garis ayah. Atau, “apakah mereka berasal dari Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Inilah orang-orang yang datang
  rationale: Ungkapan ini memperkenalkan kelompok baru dalam daftar. 'Datang' menyampaikan pergerakan mereka secara alami dalam bahasa Indonesia, sedangkan unsur harfiah 'naik' akan terasa janggal tanpa penjelasan tambahan.
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: dari Tel-Melah, Tel-Harsa, Kerub, Adon, dan Imer
  rationale: Nama-nama tempat atau kelompok ditransliterasikan sesuai ejaan Indonesia. 'Adon' mengikuti teks Ibrani Nehemia, sementara Ezra 2:59 memiliki bentuk varian.
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: tetapi mereka tidak dapat menunjukkan
  rationale: '''Tetapi'' menandai kontras, sedangkan ''menunjukkan'' cocok dengan konteks silsilah tanpa membatasi tindakan itu pada pernyataan lisan atau secara eksplisit menambahkan gagasan pembuktian hukum.'
- source_word: בֵּית אֲבוֹתָם
  choice: kaum keluarga leluhur
  rationale: Ini mengungkapkan idiom genealogis Ibrani secara alami dalam bahasa Indonesia sambil mempertahankan gagasan kelompok keluarga berdasarkan garis leluhur.
- source_word: וְזַרְעָם
  choice: dan garis keturunan mereka
  rationale: Dalam konteks pencatatan silsilah, זֶרַע menunjuk pada keturunan atau garis keturunan. Pilihan ini jelas dan alami tanpa memakai terjemahan harfiah 'benih'.
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: apakah mereka berasal dari Israel
  rationale: Terjemahan ini mempertahankan bentuk sumber yang menyatakan ketidakpastian mengenai asal-usul Israel mereka; bentuk yang lebih ringkas 'apakah mereka orang Israel' dicatat sebagai alternatif.
