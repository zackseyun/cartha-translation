    issue: “kaum keluarga leluhur” untuk בֵּית אֲבוֹתָם
    rationale: Ungkapan ini dapat dipahami sebagai keluarga para leluhur secara umum, bukan unit keluarga menurut garis ayah yang dimaksud idiom Ibrani.
  - severity: low
    issue: “apakah mereka berasal dari Israel”
    rationale: Dalam bahasa Indonesia, “berasal dari Israel” dapat dibaca sebagai asal tempat. Konteksnya adalah status keturunan/keanggotaan Israel; “apakah mereka termasuk orang Israel” lebih jelas tanpa melampaui teks.
