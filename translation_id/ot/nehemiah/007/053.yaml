  text: בְּנֵי בַקְבּ֥וּק בְּנֵֽי חֲקוּפָ֖א בְּנֵ֥י חַרְחֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/053.yaml
  text: the sons of Bakbuk[a], the sons of Hakupha, the sons of Harhur—
translation:
  language: id
  text: keturunan Bakbuk[a], keturunan Hakufa, keturunan Harhur—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Bakbuk.” Dalam daftar silsilah ini, ungkapan Ibrani tersebut dapat berarti keturunan atau kelompok keluarga, bukan hanya anak-anak langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali ini, bentuk konstruksi בְּנֵי menunjuk pada kelompok keluarga atau keturunan, bukan semata-mata anak laki-laki langsung. “Keturunan” menyampaikan maksud tersebut secara wajar dalam bahasa Indonesia sambil mempertahankan pola daftar.
- source_word: בַקְבּוּק
  choice: Bakbuk
  rationale: Nama diri ditransliterasikan berdasarkan bentuk Ibrani, bukan diterjemahkan.
- source_word: חֲקוּפָא
  choice: Hakufa
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf כ dilambangkan dengan k dan פ di sini dengan f.
- source_word: חַרְחוּר
  choice: Harhur
  rationale: Nama diri ditransliterasikan; arti leksikal nama ini tidak pasti dan tidak menentukan dalam konteks daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan sesuai gaya daftar silsilah. “Keturunan” dipilih agar cakupan kelompok keluarga jelas bagi pembaca modern. Tanda pisah di akhir dipertahankan karena ayat merupakan bagian dari daftar yang berlanjut.
