  yaml_path: translation/ot/nehemiah/007/044.yaml
  text: 'The singers: the sons of Asaph[a], one hundred forty-eight.'
translation:
  language: id
  text: 'Para penyanyi: anak-anak Asaf[a], seratus empat puluh delapan orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Asaf”. Secara harfiah, “anak-anak Asaf”. Dalam sebutan silsilah atau kelompok seperti ini, ungkapan Ibrani tersebut dapat menunjuk pada garis keturunan atau keanggotaan kelompok penyanyi yang dikaitkan dengan Asaf, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisip dari שׁיר menunjuk kepada orang-orang yang bernyanyi. Dalam daftar petugas ibadah ini, “para penyanyi” alami, tepat, dan lebih khusus daripada “para pemusik”.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah atau kelompok, בְּנֵי dapat menunjuk kepada garis keluarga atau kelompok yang dikaitkan dengan seorang leluhur, bukan hanya anak kandung langsung. “Keturunan” menyampaikan maksud kontekstual dengan jelas.
- source_word: אָסָף
  choice: Asaf
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: seratus empat puluh delapan orang
  rationale: Urutan bilangan Ibrani berarti 148. Kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa ini jumlah anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas, sesuai gaya daftar sensus. Tanda titik dua mempertahankan struktur tajuk kelompok yang diikuti jumlah. Penanda catatan kaki [a] ditempatkan langsung setelah “Asaf”.
