lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar pendataan keluarga ini, bentuk konstruksi jamak dari בֵּן menunjuk pada anggota atau keturunan suatu garis keluarga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan cakupan itu secara alami dalam bahasa Indonesia.
- source_word: זַכָּי
  choice: Zakai
  rationale: Nama diri ditransliterasikan sesuai pelafalan Ibrani dan ejaan Indonesia; konsonan ganda tidak diperlukan dalam bentuk Indonesia.
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: tujuh ratus enam puluh orang
  rationale: Frasa bilangan diterjemahkan dengan kata-kata; 'orang' ditambahkan secara wajar karena angka ini menyatakan jumlah anggota kelompok keluarga.
