  text: וַ/יִּתֵּ֤ן אֱלֹהַ/י֙ אֶל לִבִּ֔/י וָ/אֶקְבְּצָ֞/ה אֶת הַ/חֹרִ֧ים וְ/אֶת הַ/סְּגָנִ֛ים וְ/אֶת הָ/עָ֖ם לְ/הִתְיַחֵ֑שׂ וָֽ/אֶמְצָ֗א סֵ֤פֶר הַ/יַּ֨חַשׂ֙ הָ/עוֹלִ֣ים בָּ/רִאשׁוֹנָ֔ה וָ/אֶמְצָ֖א כָּת֥וּב בּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: id
  text: 'Lalu Allahku menaruh dalam hatiku untuk mengumpulkan para bangsawan, para pejabat, dan rakyat agar mereka didaftarkan menurut silsilah[a]. Aku menemukan kitab daftar silsilah orang-orang yang mula-mula datang kembali[b], dan di dalamnya kudapati tertulis:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “agar mereka mendaftarkan diri menurut silsilah.” Bahasa Ibrani menunjuk kepada pencatatan resmi berdasarkan garis keturunan keluarga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang yang mula-mula naik,” yaitu rombongan awal yang kembali dari pembuangan ke Yehuda dan Yerusalem.
    reason: source_idiom
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: Lalu Allahku menaruh dalam hatiku
  rationale: Ungkapan ini mempertahankan tindakan Allah sebagai dorongan batin tanpa menentukan bahwa Nehemia menerima penyataan formal.
- source_word: וָאֶקְבְּצָה
  choice: untuk mengumpulkan
  rationale: Bentuk ini menyatakan isi atau tujuan dorongan yang Allah taruh dalam hati Nehemia dan terdengar alami dalam bahasa Indonesia.
- source_word: הַחֹרִים
  choice: para bangsawan
  rationale: Dalam konteks pemerintahan Nehemia, istilah ini menunjuk kepada golongan pemimpin atau orang terpandang, bukan sekadar orang merdeka.
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: Istilah ini menunjuk kepada para penguasa atau pelaksana pemerintahan di bawah tingkat tertinggi; 'pejabat' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְהִתְיַחֵשׂ
  choice: agar mereka didaftarkan menurut silsilah
  rationale: Bentuk hitpael dari יחס berkaitan dengan penetapan atau pendaftaran seseorang berdasarkan garis keturunan; bentuk ini tetap membuka nuansa pasif atau refleksif melalui catatan kaki.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: kitab daftar silsilah
  rationale: '''Kitab'' mempertahankan acuan kepada dokumen tertulis, sedangkan ''daftar silsilah'' menyampaikan fungsi administratif dokumen tersebut secara alami.'
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: orang-orang yang mula-mula datang kembali
  rationale: Pilihan ini menyampaikan kelompok awal yang pulang dari pembuangan. Catatan kaki mempertahankan secara lebih harfiah gambaran Ibrani tentang 'naik'.
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 'dan di dalamnya kudapati tertulis:'
  rationale: Rumusan ini mempertahankan tindakan menemukan serta berfungsi alami sebagai pengantar kepada isi daftar pada ayat-ayat berikutnya.
theological_decisions:
- issue: Bahasa tentang dorongan ilahi dalam kepemimpinan Nehemia
  choice: Allahku menaruh dalam hatiku
  alternative: Allahku mengilhamiku
  rationale: Teks Ibrani menyatakan prakarsa Allah berupa dorongan batin, tetapi tidak menjelaskan cara penyataannya. Terjemahan ini tidak melebihkannya menjadi ilham formal dan tidak pula mereduksinya menjadi gagasan pribadi Nehemia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kitab daftar silsilah' dipilih agar cukup dekat dengan bentuk Ibrani tetapi tetap jelas bagi pembaca umum; konstruksi kalimat mempertahankan prakarsa ilahi dan fungsi administratif pendaftaran.
