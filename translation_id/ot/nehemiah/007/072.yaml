language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: id
  text: Lalu para imam, orang-orang Lewi, para penjaga pintu gerbang, para penyanyi, sebagian dari rakyat, para pelayan Bait Allah[a], dan seluruh Israel tinggal di kota-kota mereka. Dan ketika bulan ketujuh tiba, anak-anak Israel[b] berada di kota-kota mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kaum Netinim, nama bagi golongan pelayan Bait Allah ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “putra-putra Israel”; ungkapan ini juga dapat diterjemahkan “orang Israel” atau “bangsa Israel”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: Kata יָשַׁב dapat berarti duduk, menetap, atau tinggal. Dalam konteks pemukiman kembali, “tinggal” alami dan tetap menyampaikan bahwa mereka mendiami kota-kota itu.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan langsung bagi bentuk jamak כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan yang jelas dan lazim dalam bahasa Indonesia bagi kelompok Lewi.
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Menunjukkan orang-orang yang bertugas menjaga pintu gerbang; lebih jelas daripada padanan yang dapat dipahami sekadar sebagai pembawa barang.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Bentuk partisip ini secara langsung menunjuk kepada mereka yang bernyanyi, khususnya dalam pelayanan Bait Allah.
- source_word: וּמִן הָעָם
  choice: sebagian dari rakyat
  rationale: Frasa ini secara harfiah berarti “dan dari rakyat” serta memiliki arti partitif, yakni sebagian dari rakyat di luar kelompok petugas yang telah disebutkan.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini menunjuk kepada golongan khusus yang ditugaskan untuk pelayanan di Bait Allah. Padanan fungsional lebih mudah dipahami, sedangkan nama tradisionalnya dicatat dalam catatan kaki.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif sumber yang merujuk kepada umat Israel.
- source_word: בְּעָרֵיהֶם
  choice: di kota-kota mereka
  rationale: עִיר dapat berarti kota atau permukiman; “kota-kota” sesuai dengan konteks daftar pemukiman dan penggunaan Alkitabiah yang umum.
- source_word: וַיִּגַּע
  choice: tiba
  rationale: Walaupun makna dasarnya “menyentuh” atau “mencapai”, bersama keterangan waktu kata ini berarti bahwa bulan tersebut tiba.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: bulan ketujuh
  rationale: Padanan langsung bagi ungkapan kalender Ibrani.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah בְּנֵי berarti “anak-anak lelaki”, tetapi dalam ungkapan tetap ini menunjuk secara kolektif kepada bangsa keturunan Israel. “Keturunan Israel” mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya laki-laki atau anak-anak.
theological_decisions:
- issue: Ungkapan kolektif bergender בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; bangsa Israel
  rationale: Ungkapan Ibrani secara harfiah berbentuk maskulin “anak-anak lelaki Israel”, tetapi berfungsi sebagai etnonim kolektif. “Keturunan Israel” mempertahankan unsur asal-usul genealogis sekaligus menghindari pembatasan yang tidak dimaksudkan kepada laki-laki saja. Arti harfiahnya tetap dicatat agar bentuk sumber dapat diaudit.
- issue: Sebutan institusional הַנְּתִינִים
  choice: para pelayan Bait Allah
  alternative: kaum Netinim
  rationale: Terjemahan fungsional membuat peran kelompok ini jelas bagi pembaca modern tanpa memasukkan tafsiran denominasi. Transliterasi tradisional dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sementara penghubung Ibrani pertama diterjemahkan “Lalu” untuk menandai kelanjutan narasi. Penghubung sebelum klausa waktu tidak diterjemahkan sebagai “dan” secara mekanis karena “Ketika ...” sudah mengungkapkan hubungan sintaksisnya dengan alami. Semua penanda catatan kaki ditempatkan tepat setelah istilah yang dijelaskan.
