  yaml_path: translation/ot/nehemiah/007/043.yaml
  text: 'The Levites: the sons of Jeshua[a], of Kadmiel, of the sons of Hodvah, seventy-four.'
translation:
  language: id
  text: 'Orang-orang Lewi: keturunan Yesua, keturunan Kadmiel, dan keturunan Hodwa[a], tujuh puluh empat orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Hodwa”. Dalam daftar silsilah, ungkapan ini dapat menunjuk pada keturunan atau kelompok keluarga yang lebih luas, bukan hanya anak-anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Orang-orang Lewi
  rationale: Nomina jamak definit yang memperkenalkan kelompok dalam daftar sensus; dipertahankan sebagai kepala daftar tanpa menambahkan verba.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks silsilah dan sensus, istilah ini dapat menunjuk pada garis keluarga yang lebih luas, bukan hanya anak kandung langsung.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi nama Ibrani pascapembuangan yang lazim dan dibedakan dari bentuk nama Yosua.
- source_word: לְקַדְמִיאֵל
  choice: dari Kadmiel
  rationale: Prefiks ל dipahami secara relasional dalam rangkaian silsilah; terjemahan ini mempertahankan hubungan antarnama tanpa menambahkan penghubung yang tidak terdapat dalam teks.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: dari keturunan Hodwa
  rationale: Rangkaian berprefiks ל diterjemahkan sebagai hubungan genealogis berlapis. 'Keturunan' menyampaikan cakupan keluarga yang mungkin lebih luas daripada anak langsung.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: 74 orang
  rationale: Bilangan sensus diterjemahkan dengan bentuk angka yang alami dalam daftar modern; 'orang' ditambahkan untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
