  text: orang-orang Betlehem dan Netofa[a], seratus delapan puluh delapan orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “laki-laki dari Betlehem dan Netofa.” Dalam daftar pendataan dan daftar orang yang kembali, ungkapan Ibrani ini lazim dipakai untuk menyebut penduduk atau orang yang berasal dari suatu tempat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang
  rationale: Bentuk jamak konstruktus dari אִישׁ ini memperkenalkan kelompok berdasarkan tempat asal dalam daftar pendataan. 'Orang-orang' terdengar alami dalam bahasa Indonesia dan, tidak seperti 'laki-laki', tidak memberi kesan bahwa angka tersebut pasti hanya menghitung pria dewasa.
- source_word: בֵית לֶחֶם
  choice: Betlehem
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: וּנְטֹפָה
  choice: dan Netofa
  rationale: Konjungsi dan nama tempat diterjemahkan secara langsung. Kedua tempat dikelompokkan di bawah satu jumlah.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: seratus delapan puluh delapan orang
  rationale: Urutan bilangan Ibrani berjumlah 188. Kata 'orang' ditambahkan setelah angka agar daftar ini terbaca alami dan jelas dalam bahasa Indonesia.
