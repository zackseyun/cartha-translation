    rationale: Teks Ibrani menyatakan seorang imam “dengan/untuk Urim dan Tumim”; bentuk ini tidak secara langsung menyatakan bahwa ia sedang menggunakan sarana tersebut. Terjemahan perlu mempertahankan keluasan itu.
  - severity: low
    issue: Penanda catatan kaki tidak mengikuti urutan kemunculan, dan keputusan leksikal tentang alternatif gelar belum tercermin dalam catatan kaki.
    rationale: Pengurutan ulang meningkatkan keterbacaan, sedangkan catatan “Tirsyata” mendukung pilihan “gubernur” tanpa membebani teks utama.
