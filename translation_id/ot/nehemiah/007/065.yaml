  text: וַ/יֹּ֤אמֶר הַ/תִּרְשָׁ֨תָא֙ לָ/הֶ֔ם אֲשֶׁ֥ר לֹא יֹאכְל֖וּ מִ/קֹּ֣דֶשׁ הַ/קֳּדָשִׁ֑ים עַ֛ד עֲמֹ֥ד הַ/כֹּהֵ֖ן לְ/אוּרִ֥ים וְ/תוּמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: id
  text: Lalu gubernur[a] berkata kepada mereka bahwa mereka tidak boleh makan dari bagian-bagian yang paling kudus[b] sampai ada seorang imam dengan Urim dan Tumim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tirsyata,” sebuah gelar administratif Persia.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah bagian-bagian persembahan yang tergolong paling kudus dan diperuntukkan bagi imam, bukan ruang Mahakudus.
    reason: cultural_note
  - marker: c
    text: Urim dan Tumim adalah sarana imamat untuk memperoleh keputusan.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: gubernur
  rationale: Gelar administratif Persia ini diterjemahkan menurut fungsinya agar jelas bagi pembaca modern; bentuk gelarnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: bahwa mereka tidak boleh makan
  rationale: Dalam konteks ini klausa tersebut menyampaikan isi larangan gubernur secara alami dalam bahasa Indonesia.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: dari bagian-bagian yang paling kudus
  rationale: Ungkapan superlatif Ibrani ini dalam konteks menyangkut bagian kudus dari persembahan yang boleh dimakan imam, bukan ruang Mahakudus.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: sampai tampil seorang imam
  rationale: Konstruksi dengan עַד menunjuk pada batas waktu mendatang; artikel pada 'imam' dapat dipahami secara generik, bukan sebagai imam tertentu yang telah disebut.
- source_word: לְאוּרִים וְתוּמִּים
  choice: yang menggunakan Urim dan Tumim
  rationale: Nama sarana penentuan ilahi ini dipertahankan sebagai istilah tradisional; 'menggunakan' menyatakan fungsi yang tersirat oleh preposisi לְ dalam konteks.
theological_decisions:
- issue: Acuan frasa 'yang paling kudus'
  choice: bagian-bagian kudus dari persembahan yang menjadi makanan imam
  alternative: ruang Mahakudus
  rationale: Konteksnya adalah kelayakan orang-orang dengan silsilah imamat yang tidak terbukti untuk memakan bagian imam, bukan hak memasuki ruang terdalam tempat kudus.
- issue: Penerjemahan gelar Persia
  choice: gubernur
  alternative: Tirsyata
  rationale: Karena ini gelar administratif dan bukan nama diri, penerjemahan fungsional memberi makna yang lebih jelas, sedangkan bentuk aslinya tetap tersedia dalam catatan kaki.
- issue: Fungsi Urim dan Tumim
  choice: seorang imam yang menggunakan Urim dan Tumim
  alternative: seorang imam dengan Urim dan Tumim
  rationale: Ungkapan ini mengacu pada imam yang dapat memperoleh keputusan melalui sarana tersebut. Terjemahan tidak menjelaskan hasil atau mekanismenya lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak boleh' menyampaikan larangan dengan wajar; 'bagian-bagian yang paling kudus' menjaga ungkapan superlatif sekaligus memperjelas bahwa yang dibicarakan adalah makanan kudus. Semua penanda catatan kaki dicantumkan dalam teks utama.
