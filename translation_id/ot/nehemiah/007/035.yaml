- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar penduduk dan silsilah pascapembuangan, bentuk ini memperkenalkan kelompok keluarga atau kaum. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia tanpa membatasi kelompok itu pada anak laki-laki langsung.
- source_word: חָרִם
  choice: Harim
  rationale: Nama orang atau kaum ini ditransliterasikan sebagai “Harim”, sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת וְעֶשְׂרִים
  choice: 320 orang
  rationale: Bilangan Ibrani berarti tiga ratus dua puluh. Angka dan kata “orang” membuat jumlah anggota kelompok jelas serta cocok dengan gaya ringkas sebuah daftar.
