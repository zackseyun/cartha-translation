  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Neziah”; demikian pula untuk Hatifa. Dalam daftar silsilah, ungkapan Ibrani ini sering berarti keturunan atau kelompok keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah pascapembuangan, bentuk ini secara harfiah berarti 'anak-anak laki-laki', tetapi lazim menunjuk pada keturunan atau kelompok keluarga. 'Keturunan' menyampaikan fungsi ungkapan itu secara alami dalam bahasa Indonesia.
- source_word: נְצִיחַ
  choice: Neziah
  rationale: Nama diri ini ditransliterasikan. Bentuk 'Neziah' cukup dekat dengan bunyi Ibrani dan selaras dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: חֲטִיפָא
  choice: Hatifa
  rationale: Nama diri ini ditransliterasikan menurut ejaan Indonesia; huruf פ di sini berbunyi /f/, sehingga 'Hatifa' lebih tepat daripada bentuk berpengaruh ejaan Inggris 'Hatipha'.
