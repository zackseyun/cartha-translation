source:
  edition: WLC
  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: id
  text: 'Keturunan[a] para hamba Salomo: keturunan Sotai, keturunan Soferet, dan keturunan Perida.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak”. Dalam daftar silsilah, ungkapan Ibrani ini dapat mencakup keturunan atau anggota suatu garis keluarga, bukan hanya anak kandung langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan daftar orang yang kembali, bentuk ini dapat menunjuk kepada garis keluarga atau kelompok keturunan, bukan hanya anak kandung langsung. “Keturunan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia modern; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עַבְדֵי
  choice: para hamba
  rationale: Dalam frasa עַבְדֵי שְׁלֹמֹה, kata ini berfungsi sebagai sebutan kelompok turun-temurun yang dikenal sebagai “hamba-hamba Salomo”. “Hamba” mempertahankan sebutan itu tanpa secara berlebihan menentukan bahwa mereka adalah budak.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: סוֹטַי
  choice: Sotai
  rationale: Nama diri ditransliterasikan menurut vokalisasi teks Ibrani.
- source_word: סוֹפֶרֶת
  choice: Soferet
  rationale: Nama keluarga ditransliterasikan, bukan diterjemahkan sebagai kata benda yang berkaitan dengan kegiatan menulis atau menghitung.
- source_word: פְרִידָא
  choice: Perida
  rationale: Nama diri ditransliterasikan dengan mempertahankan vokal akhir yang ditunjukkan oleh teks Masoret.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan sesuai dengan gaya daftar silsilah. Pengulangan “keturunan” dipertahankan untuk mencerminkan susunan paralel teks Ibrani, sedangkan “dan” ditambahkan sebelum unsur terakhir agar daftar terdengar alami.
