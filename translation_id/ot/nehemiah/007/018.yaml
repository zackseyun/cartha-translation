- source_word: אֲדֹנִיקָם
  choice: Adonikam
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia, bukan diterjemahkan maknanya.
- source_word: שֵׁשׁ מֵאוֹת שִׁשִּׁים וְשִׁבְעָה
  choice: 667 orang
  rationale: Rangkaian bilangan Ibrani berarti enam ratus enam puluh tujuh; angka dipakai agar daftar mudah dibaca, dan “orang” ditambahkan secara wajar untuk memperjelas bahwa ini jumlah anggota kelompok.
