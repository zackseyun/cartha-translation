base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/045.yaml
  text: 'The gatekeepers: the sons of Shallum[a], the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, 138.'
translation:
  language: id
  text: 'Para penjaga pintu gerbang: keturunan[a] Salum, keturunan Ater, keturunan Talmon, keturunan Akub, keturunan Hatita, dan keturunan Sobai—138 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak”; dalam daftar seperti ini, istilah Ibrani tersebut juga dapat berarti keturunan, garis keluarga, atau kelompok marga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada orang-orang yang bertugas menjaga pintu gerbang, khususnya dalam pelayanan Bait Allah. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah dan sensus pascapembuangan, istilah ini dapat menunjuk kepada garis keluarga atau kelompok marga, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan cakupan itu secara alami, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אָטֵר
  choice: Ater
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: טַלְמֹן
  choice: Talmon
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: עַקּוּב
  choice: Akub
  rationale: Transliterasi ini mengikuti bentuk nama yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: חֲטִיטָא
  choice: Hatita
  rationale: Nama diri ditransliterasikan dengan mempertahankan bentuk bunyi Ibrani secara wajar dalam bahasa Indonesia.
- source_word: שֹׁבָי
  choice: Sobai
  rationale: Nama diri ditransliterasikan dengan 's' untuk huruf שׁ, sesuai kebiasaan bahasa Indonesia.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: 138 orang
  rationale: Angka ditulis dengan numeralia agar daftar sensus mudah dibaca; 'orang' memperjelas bahwa angka tersebut merupakan jumlah anggota kelompok.
