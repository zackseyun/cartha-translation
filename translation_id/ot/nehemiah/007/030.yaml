  language: id
  text: orang-orang dari Rama dan Geba[a], enam ratus dua puluh satu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Geba”; beberapa terjemahan memakai “Gibea”, dipengaruhi oleh daftar sejajar dalam Ezra 2:26 atau karena kedua nama tempat itu mudah tertukar.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: orang-orang dari
  rationale: Bentuk konstruksi jamak dari אִישׁ dalam rumusan daftar ini menunjuk kepada orang-orang yang berasal dari atau terkait dengan kedua tempat tersebut. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak ada dalam teks.
- source_word: הָרָמָה
  choice: Rama
  rationale: Nama tempat Ibrani ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וָגָבַע
  choice: dan Geba
  rationale: Teks Ibrani yang terbaca adalah גָבַע, yaitu Geba, bukan גִּבְעָה, yaitu Gibea.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: enam ratus dua puluh satu orang
  rationale: Bilangan ditulis dengan kata-kata agar sesuai dengan gaya naratif Alkitab; kata 'orang' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas satuan yang dihitung dari frasa pembuka.
