  text: בְּנֵי בַרְק֥וֹס בְּֽנֵי סִֽיסְרָ֖א בְּנֵי תָֽמַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/055.yaml
  text: the sons of Barkos[a], the sons of Sisera, the sons of Temah.
translation:
  language: id
  text: Keturunan Barkos, keturunan Sisera, dan keturunan Tamah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Temah.”'
    reason: Bentuk transliterasi alternatif/tradisional bagi nama ini.
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar silsilah, bentuk jamak konstruktus dari בֵּן menunjuk pada anggota suatu garis keluarga atau kaum. “Keturunan” menyampaikan fungsi ini secara alami dalam bahasa Indonesia modern tanpa mengharuskan bahwa mereka semua adalah anak kandung langsung.
- source_word: בַרְקוֹס
  choice: Barkos
  rationale: Nama diri atau nama keluarga; ditransliterasikan sesuai bentuk Ibrani dan kebiasaan penulisan bahasa Indonesia.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Nama diri atau nama keluarga; bentuk “Sisera” sudah lazim dalam bahasa Indonesia.
- source_word: תָמַח
  choice: Tamah
  rationale: Vokalisasi Teks Masoret WLC, תָמַח, secara langsung mendukung bentuk “Tamah”. Bentuk “Temah” dikenal dari tradisi penamaan dan didukung oleh nama sejajar dalam Ezra 2:53, sehingga dicatat sebagai alternatif.
theological_decisions: []
translation_notes:
  register: Gaya daftar dibuat ringkas dan bermartabat. “Keturunan” dipilih daripada “anak-anak lelaki” atau “bani” agar hubungan kelompok keluarga dipahami dengan jelas oleh pembaca Indonesia modern. Penanda catatan kaki ditempatkan setelah nama yang bersangkutan.
