  text: מִ֠/לְּ/בַד עַבְדֵי/הֶ֤ם וְ/אַמְהֹֽתֵי/הֶם֙ אֵ֔לֶּה שִׁבְעַ֣ת אֲלָפִ֔ים שְׁלֹ֥שׁ מֵא֖וֹת שְׁלֹשִׁ֣ים וְ/שִׁבְעָ֑ה וְ/לָ/הֶ֗ם מְשֹֽׁרֲרִים֙ וּ/מְשֹׁ֣רֲר֔וֹת מָאתַ֖יִם וְ/אַרְבָּעִ֥ים וַ/חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/067.yaml
  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: id
  text: selain budak laki-laki dan budak perempuan mereka[a], yang berjumlah 7.337 orang. Mereka juga mempunyai 245 penyanyi laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan laki-laki dan pelayan perempuan mereka.” Istilah-istilah Ibrani ini dapat diterjemahkan secara lebih umum, tetapi dalam konteks sensus ini kemungkinan besar menunjuk kepada budak laki-laki dan perempuan yang menjadi bagian dari rumah tangga mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: selain
  rationale: Secara ringkas dan wajar menandai kelompok tambahan di luar jumlah sebelumnya dalam daftar sensus.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: budak laki-laki dan budak perempuan mereka
  rationale: Kedua istilah dapat berarti pelayan, tetapi dalam konteks pencacahan anggota rumah tangga keduanya kemungkinan besar menunjuk kepada orang-orang berstatus budak; pembedaan gender dalam bahasa Ibrani dipertahankan.
- source_word: אֵלֶּה
  choice: yang berjumlah
  rationale: Secara harfiah berarti 'ini/mereka ini', tetapi di sini menunjuk ke angka sesudahnya; ungkapan ini menghasilkan kalimat sensus yang alami dalam bahasa Indonesia.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7.337 orang
  rationale: Angka dipertahankan tepat dan ditulis menurut kaidah pemisah ribuan bahasa Indonesia; 'orang' memperjelas bahwa yang dihitung adalah manusia.
- source_word: וְלָהֶם
  choice: Mereka juga mempunyai
  rationale: Konstruksi kepunyaan Ibrani diterjemahkan secara idiomatis; 'juga' menyampaikan hubungan penambahan dengan kelompok sebelumnya.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: penyanyi laki-laki dan perempuan
  rationale: Mempertahankan pembedaan bentuk maskulin dan feminin dalam teks sumber dengan ungkapan Indonesia yang alami.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: Nilai angka dipertahankan tepat dalam format numerik modern yang sesuai bagi daftar sensus.
