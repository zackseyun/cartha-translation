  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: id
  text: Mereka yang datang bersama Zerubabel adalah Yesua, Nehemia, Azarya, Raamya[a], Nahamani, Mordekhai, Bilsan, Misperet, Bigwai, Nehum[b], dan Baana. Inilah jumlah laki-laki dari umat Israel:[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar sejajar di Ezra 2:2, nama ini tertulis Reelaya.
    reason: alternative_reading
  - marker: b
    text: Dalam daftar sejajar di Ezra 2:2, nama ini tertulis Rehum.
    reason: alternative_reading
  - marker: c
    text: Kalimat ini memperkenalkan jumlah hasil pendataan yang mulai dicantumkan pada ayat berikutnya.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: mereka yang datang bersama
  rationale: Partisipel berartikel berfungsi sebagai nomina kelompok tertentu; klausa relatif ini alami dalam bahasa Indonesia, sedangkan עִם diterjemahkan dengan ungkapan penyertaan yang wajar, 'bersama'.
- source_word: זְרֻבָּבֶל
  choice: Zerubabel
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan tetap dekat dengan nama Ibrani.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Transliterasi langsung nama pascapembuangan ini, sekaligus membedakannya dari bentuk tradisional 'Yosua' yang lazim dipakai bagi tokoh lain.
- source_word: רַעַמְיָה
  choice: Raamya
  rationale: Mengikuti bentuk Teks Masoret dalam Nehemia; perbedaan bentuk nama dalam Ezra 2:2 dipertahankan dalam catatan kaki.
- source_word: נַחֲמָנִי
  choice: Nahamani
  rationale: Transliterasi menurut bentuk Ibrani yang diberi tanda vokal.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Transliterasi Indonesia yang mewakili bunyi konsonan akhir nama Ibrani; teks tidak menyatakan bahwa orang ini sama dengan tokoh dalam kitab Ester.
- source_word: מִסְפֶּרֶת
  choice: Misperet
  rationale: Nama diri ditransliterasikan dengan akhiran t sesuai bentuk Ibrani.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Inilah jumlah laki-laki dari umat Israel
  rationale: מִסְפַּר membuka daftar jumlah, sedangkan אַנְשֵׁי secara eksplisit berarti 'laki-laki/orang-orang laki-laki'; 'dari umat Israel' mempertahankan hubungan konstruksi tanpa menjadi kaku.
theological_decisions:
- issue: Bahasa bergender dalam אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: laki-laki dari umat Israel
  alternative: orang-orang Israel; umat Israel
  rationale: Kata Ibrani אַנְשֵׁי berbentuk maskulin dan secara leksikal menunjuk kepada laki-laki. Terjemahan mempertahankan rincian itu tanpa menarik kesimpulan teologis tambahan.
- issue: Perbedaan nama dengan daftar sejajar dalam Ezra 2:2
  choice: 'Mengikuti bentuk Teks Masoret Nehemia: Raamya dan Nehum'
  alternative: Reelaya dan Rehum
  rationale: Teks utama menerjemahkan sumber Nehemia yang diberikan dan tidak menyelaraskannya secara diam-diam dengan Ezra; variasi daftar dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama ditransliterasikan secara konsisten dan cukup dekat dengan bentuk Ibrani. Susunan kalimat dibuat alami dengan 'Inilah' untuk menandai peralihan menuju daftar sensus, tanpa mengubah fungsi sintaksis teks.
