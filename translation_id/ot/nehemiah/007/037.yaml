  text: the sons of Lod[a], Hadid, and Ono, seven hundred twenty-one.
translation:
  language: id
  text: 'Orang-orang dari Lod[a], Hadid, dan Ono: tujuh ratus dua puluh satu orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Lod”. Dalam daftar silsilah seperti ini, ungkapan tersebut dapat merujuk kepada keturunan atau kelompok masyarakat yang terkait dengan Lod, Hadid, dan Ono.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam daftar orang yang kembali ini, בְּנֵי dapat menunjuk pada kelompok keturunan atau komunitas yang terkait dengan tempat-tempat tersebut. “Keturunan” menyampaikan fungsi ungkapan itu secara alami dalam bahasa Indonesia tanpa membatasi maknanya pada anak laki-laki langsung.
- source_word: לֹד
  choice: Lod
  rationale: Nama tempat ditransliterasikan langsung dari bentuk Ibrani; “Lod” lebih dekat dengan teks sumber daripada bentuk Yunani yang lebih kemudian.
- source_word: חָדִיד
  choice: Hadid
  rationale: Nama tempat ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: וְאוֹנוֹ
  choice: dan Ono
  rationale: Konjungsi וְ diterjemahkan “dan”, sedangkan nama tempat אוֹנוֹ ditransliterasikan “Ono”.
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: tujuh ratus dua puluh satu orang
  rationale: Bilangan Ibrani diterjemahkan dengan kata-kata agar sesuai dengan gaya daftar sensus; “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas bahwa angka itu adalah jumlah anggota kelompok.
