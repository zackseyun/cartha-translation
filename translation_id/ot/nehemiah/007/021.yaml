  text: 'the sons of Ater[a], of Hezekiah: ninety-eight.'
translation:
  language: id
  text: 'Keturunan Ater[a], dari Hizkia: sembilan puluh delapan orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “keturunan Ater, yaitu dari Hizkia,” yang menunjuk pada cabang tertentu dalam kaum Ater.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: keturunan
  rationale: Dalam konteks daftar silsilah dan sensus, bentuk jamak konstruktus dari בֵּן lazim menunjuk pada garis keluarga atau anggota keturunan, bukan hanya anak laki-laki langsung. 'Keturunan' menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: אָטֵר
  choice: Ater
  rationale: Nama diri atau nama keluarga ini ditransliterasikan, bukan diterjemahkan.
- source_word: לְחִזְקִיָּה
  choice: dari keluarga Hizkia
  rationale: Prefiks לְ kemungkinan menandai afiliasi atau cabang keluarga. Ungkapan ini mempertahankan hubungan Ater dengan Hizkia secara alami tanpa memastikan secara berlebihan apakah Hizkia adalah leluhur langsung atau nama cabang keluarga.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: sembilan puluh delapan orang
  rationale: Bilangan kardinal diterjemahkan dalam bentuk baku bahasa Indonesia; 'orang' ditambahkan secara wajar karena yang dihitung adalah anggota kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan bermartabat sesuai gaya daftar sensus. 'Keturunan' dipilih daripada 'anak-anak' agar tidak memberi kesan bahwa mereka semua anak langsung Ater. Tanda titik dua mempertahankan struktur pengenalan kelompok lalu jumlahnya.
