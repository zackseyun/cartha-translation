  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: id
  text: Jumlah semua pelayan Bait Allah dan keturunan para pelayan Salomo adalah 392 orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kaum Netinim,” yaitu sebutan tradisional bagi suatu kelompok pelayan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Jumlah semua
  rationale: Dalam konteks daftar sensus, כָּל memperkenalkan jumlah keseluruhan kedua kelompok; ungkapan ini alami dalam bahasa Indonesia dan memperjelas fungsi angka sebagai total.
- source_word: הַנְּתִינִים
  choice: pelayan Bait Allah
  rationale: Istilah ini menunjuk pada kelompok khusus yang bertugas dalam pelayanan di Bait Allah. Terjemahan fungsional lebih mudah dipahami daripada transliterasi, sedangkan sebutan tradisional dipertahankan dalam catatan kaki.
- source_word: וּבְנֵי
  choice: dan keturunan
  rationale: Secara harfiah berarti 'dan anak-anak lelaki', tetapi dalam nama kelompok dan daftar pascapembuangan istilah ini menunjuk pada para keturunan.
- source_word: עַבְדֵי
  choice: para pelayan
  rationale: עֶבֶד dapat berarti pelayan atau budak. Di sini kata itu menjadi bagian dari sebutan kelompok sosial-administratif, sehingga 'pelayan' tepat tanpa menentukan secara berlebihan status perbudakan mereka.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Mengikuti bentuk baku nama diri ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: 392 orang
  rationale: Bilangan Ibrani berarti tiga ratus sembilan puluh dua. Angka digunakan secara wajar dalam daftar sensus, dan 'orang' ditambahkan untuk kejelasan idiomatis.
theological_decisions: []
