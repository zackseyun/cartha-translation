  register: Bahasa Indonesia baku, modern, dan ringkas untuk konteks daftar sensus. 'Bait Allah' dipakai agar fungsi kelompok tersebut jelas, dan 'keturunan' dipilih sebagai padanan kontekstual בְּנֵי.
