  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Keturunan
  rationale: Dalam konteks daftar sensus dan kelompok keluarga, istilah ini menunjuk kepada para anggota garis keturunan atau kaum Arah. “Keturunan” lebih alami dan tidak membatasi rujukan hanya pada anak laki-laki langsung.
- source_word: אָרַח
  choice: Arah
  rationale: Nama orang atau leluhur suatu kaum; ditransliterasikan sebagai “Arah” sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: שֵׁשׁ מֵאוֹת חֲמִשִּׁים וּשְׁנָיִם
  choice: enam ratus lima puluh dua orang
  rationale: Bilangan Ibrani diterjemahkan secara langsung ke dalam bentuk bilangan baku bahasa Indonesia. Kata “orang” ditambahkan secara wajar untuk memperjelas bahwa angka tersebut adalah jumlah anggota kelompok.
