base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/046.yaml
  text: 'The temple servants: the sons of Ziha[a], the sons of Hasupha[b], the sons of Tabbaoth.'
translation:
  language: id
  text: 'Para pelayan Bait Allah[a]: bani Ziha, bani Hasufa, dan bani Tabaot.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani נְתִינִים (secara tradisional ditransliterasikan “kaum Netinim”), istilah teknis untuk suatu kelompok yang ditugaskan melayani di Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah teknis נְתִינִים menunjuk pada kelompok yang ditugaskan untuk pelayanan di Bait Allah. Terjemahan fungsional ini lebih mudah dipahami daripada sekadar mentransliterasikannya sebagai “kaum Netinim”.
- source_word: בְּנֵי
  choice: bani
  rationale: Dalam daftar silsilah, בְּנֵי memperkenalkan kelompok keturunan atau keluarga. “Bani” mempertahankan bentuk ringkas dan formal daftar tanpa membatasi maknanya hanya pada anak laki-laki langsung.
- source_word: צִחָא
  choice: Ziha
  rationale: Nama diri ditransliterasikan sedekat mungkin dengan bentuk Ibrani dan sesuai dengan ejaan Indonesia yang wajar.
- source_word: חֲשֻׂפָא
  choice: Hasufa
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani dalam ejaan Indonesia; bentuk “Hasufa” dipilih, sementara “Hashufa” tetap dicatat sebagai kemungkinan ejaan lain.
- source_word: טַבָּעוֹת
  choice: Tabaot
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; penggandaan konsonan Ibrani tidak perlu ditampilkan karena tidak lazim dan tidak membedakan makna dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas dan formal sesuai corak daftar keluarga. “Bani” dipakai berulang untuk mencerminkan struktur paralel teks Ibrani. Penanda catatan [a] ditempatkan langsung sesudah istilah yang dijelaskannya.
