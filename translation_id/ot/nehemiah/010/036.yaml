  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: id
  text: serta membawa hasil pertama dari tanah kami dan hasil pertama dari segala buah dari setiap pohon, tahun demi tahun, ke rumah Yahweh[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah Yahweh”; yang dimaksud ialah Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: serta membawa
  rationale: Konjungsi dan infinitif ini melanjutkan rangkaian kewajiban perjanjian; 'membawa' wajar dalam konteks persembahan yang dibawa ke tempat ibadah.
- source_word: בִּכּוּרֵי
  choice: hasil pertama
  rationale: Istilah ini menunjuk pada hasil paling awal yang dipersembahkan kepada Allah. 'Hasil pertama' jelas bagi pembaca modern dan tetap mempertahankan makna ritualnya.
- source_word: אַדְמָתֵנוּ
  choice: tanah kami
  rationale: אֲדָמָה menunjuk pada tanah atau lahan yang menghasilkan tanaman; 'tanah kami' alami dalam konteks pertanian dan tidak memperluas maknanya menjadi wilayah politik.
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: dan hasil pertama dari segala buah setiap pohon
  rationale: Terjemahan ini mempertahankan susunan genitif dan cakupan menyeluruh dari teks Ibrani tanpa menambahkan gagasan 'setiap jenis' yang tidak dinyatakan secara eksplisit.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: tahun demi tahun
  rationale: Ungkapan idiomatis ini menyatakan pengulangan tahunan secara teratur dan mempertahankan irama teks sumber.
- source_word: לְ/בֵית יְהוָה
  choice: ke rumah Yahweh
  rationale: Terjemahan ini mempertahankan metafora harfiah 'rumah' serta nama ilahi YHWH; dalam konteksnya, rumah itu adalah Bait Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama pribadi itu, sedangkan 'TUHAN' merepresentasikan tradisi pembacaan pengganti.
- issue: Makna בֵּית יְהוָה
  choice: rumah Yahweh
  alternative: Bait Yahweh
  rationale: '''Rumah Yahweh'' mengikuti bentuk teks sumber dan membiarkan catatan kaki menjelaskan bahwa yang dimaksud ialah Bait Allah, tanpa mengganti metafora sumber di dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dipertahankan sebagai kelanjutan daftar kewajiban dari konteks sebelumnya. Istilah 'hasil pertama' dipilih agar mudah dipahami sekaligus tetap memuat nuansa persembahan ritual.
