source:
  edition: WLC
  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: id
  text: Imam itu, seorang keturunan Harun, harus berada bersama orang-orang Lewi ketika orang-orang Lewi memungut persepuluhan. Orang-orang Lewi harus membawa sepersepuluh dari persepuluhan[a] itu ke rumah Allah kita, ke bilik-bilik di gudang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “persepuluhan dari persepuluhan,” yaitu bagian yang diberikan orang-orang Lewi dari persepuluhan yang mereka terima.
    reason: lexical_alternative
  - marker: b
    text: Atau “perbendaharaan.” Dalam konteks ini, yang dimaksud kemungkinan adalah tempat penyimpanan persepuluhan dan persembahan, bukan khusus tempat menyimpan uang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: harus menyertai
  rationale: Bentuk ini berfungsi prospektif dalam konteks ketetapan perjanjian. Ungkapan “harus menyertai” menyampaikan kewajiban sekaligus menghubungkannya secara alami dengan עִם.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: seorang imam, keturunan Harun
  rationale: Frasa ini menunjuk pada seorang imam dari garis Harun. “Keturunan Harun” lebih alami dalam bahasa Indonesia daripada ungkapan harfiah “anak Harun” untuk keanggotaan garis keturunan.
- source_word: עִם
  choice: menyertai
  rationale: Kata ini menyatakan kehadiran bersama orang-orang Lewi. Dalam konteks pengawasan atau pendampingan saat persepuluhan dipungut, “menyertai” alami tanpa menambahkan peran yang tidak dinyatakan.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: ketika mereka memungut persepuluhan
  rationale: Infinitif tersebut menyatakan tindakan mengambil atau memungut persepuluhan. Klausa temporal menghasilkan bahasa Indonesia yang jelas dan tetap dekat dengan fungsi bentuk Ibrani.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan mudah dipahami bagi kelompok suku dan pelayan ibadah ini.
- source_word: יַעֲלוּ
  choice: membawa
  rationale: Bentuk Hifil berarti membawa naik. Dalam bahasa Indonesia, “membawa” lebih alami dalam konteks tujuan ke rumah Allah; arah menuju tempat kudus sudah dinyatakan oleh frasa berikutnya.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: sepersepuluh dari persepuluhan
  rationale: Ungkapan ini menjelaskan bagian yang harus diberikan orang Lewi dari persepuluhan yang mereka terima. Padanan ini menyampaikan makna teknis dengan lebih jelas daripada bentuk sangat harfiah “persepuluhan dari persepuluhan,” yang dicatat sebagai alternatif.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: ke rumah Allah kita
  rationale: Padanan ini mempertahankan ungkapan perjanjian dan sebutan Ibrani bagi bait Allah tanpa menggantinya dengan istilah yang lebih interpretatif.
- source_word: הַלְּשָׁכוֹת
  choice: bilik-bilik
  rationale: Kata ini menunjuk pada ruang-ruang di kompleks bait Allah, khususnya ruang penyimpanan. “Bilik-bilik” mempertahankan bentuk jamak dan suasana arsitektural teks.
- source_word: לְבֵית הָאוֹצָר
  choice: gudang
  rationale: Konteksnya adalah penyimpanan persepuluhan, termasuk hasil bumi. “Gudang” lebih tepat dan tidak memberi kesan bahwa yang disimpan terutama uang.
theological_decisions:
- issue: Istilah bagi tempat penyimpanan di bait Allah
  choice: gudang
  alternative: perbendaharaan
  rationale: Konteks membahas pengelolaan persepuluhan oleh imam dan orang Lewi, kemungkinan besar termasuk hasil pertanian. “Gudang” mencerminkan fungsi tempat itu tanpa membatasi isinya pada uang atau harta berharga.
- issue: Identitas imam sebagai keturunan Harun
  choice: seorang imam, keturunan Harun
  alternative: imam itu, anak Harun
  rationale: Teks menyatakan hubungan imam dengan garis Harun. Padanan “keturunan Harun” mempertahankan syarat keimaman dalam konteks itu tanpa menyiratkan bahwa imam tersebut adalah anak kandung langsung Harun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ketetapan dibuat jelas dengan “harus,” sedangkan istilah kultis dipertahankan dalam bentuk yang mudah dimengerti pembaca umum. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskan.
