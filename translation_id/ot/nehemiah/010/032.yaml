base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: id
  text: Mengenai bangsa-bangsa di negeri itu yang membawa barang dagangan dan segala macam biji-bijian untuk dijual pada hari Sabat, kami tidak akan membeli dari mereka pada hari Sabat ataupun pada hari kudus. Kami akan membiarkan tahun ketujuh dan melepaskan setiap piutang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap tuntutan” atau “setiap pungutan”; secara harfiah, frasa Ibraninya berarti “beban/tuntutan setiap tangan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: bangsa-bangsa di negeri itu
  rationale: Mempertahankan bentuk jamak עַמֵּי dan ungkapan lokatif הָאָרֶץ, yang dalam konteks ini menunjuk pada kelompok-kelompok penduduk sekitar di luar komunitas Yehuda.
- source_word: הַמַּקָּחוֹת
  choice: barang dagangan
  rationale: Menunjuk pada barang atau komoditas yang dibawa untuk diperdagangkan; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: שֶׁבֶר
  choice: gandum
  rationale: Dalam konteks perdagangan, kata ini lazim menunjuk pada biji-bijian pangan; 'gandum' merupakan padanan Indonesia yang umum, meski cakupan sumber dapat lebih luas.
- source_word: לֹא נִקַּח מֵהֶם
  choice: kami tidak akan membeli dari mereka
  rationale: Secara harfiah berarti 'kami tidak akan mengambil dari mereka', tetapi konteks barang yang dibawa untuk dijual menuntut arti komersial 'membeli'.
- source_word: וּבְיוֹם קֹדֶשׁ
  choice: ataupun pada hari kudus
  rationale: Konjungsi diterjemahkan secara idiomatis sebagai perluasan larangan negatif; 'hari kudus' mempertahankan ungkapan Ibrani tanpa menentukan perayaan tertentu.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: kami akan membiarkan tahun ketujuh
  rationale: Kata kerja נטש dapat berarti meninggalkan atau membiarkan. Rumusan ini mempertahankan ungkapan ringkas sumber dan mengisyaratkan penghentian pemanfaatan tanah pada tahun ketujuh tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: מַשָּׁא כָל יָד
  choice: melepaskan setiap piutang
  rationale: Ungkapan Ibrani yang padat ini secara harfiah berkaitan dengan 'beban/tuntutan setiap tangan' dan dalam konteks hukum tahun ketujuh kemungkinan menunjuk pada pelepasan tuntutan utang. 'Piutang' menyoroti klaim yang dilepaskan oleh pemberi pinjaman.
theological_decisions:
- issue: Kewajiban tahun ketujuh dan arti frasa penutup
  choice: Ayat dipahami mencakup pembiaran tahun ketujuh serta pelepasan setiap piutang.
  alternative: Frasa penutup dapat diterjemahkan lebih harfiah sebagai 'setiap tuntutan tangan' atau dipahami sebagai 'setiap beban/tuntutan'.
  rationale: Konteks hukum tahun ketujuh mendukung pelepasan tuntutan utang, tetapi ungkapan מַשָּׁא כָל יָד tidak sepenuhnya transparan. Teks utama menyampaikan arti hukum-ekonominya yang paling mungkin, sedangkan catatan kaki mempertahankan ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ikrar kolektif dipertahankan dengan 'kami tidak akan' dan 'kami akan'. Istilah 'Sabat', 'hari kudus', dan 'tahun ketujuh' dibuat dekat dengan bentuk sumber tanpa penjelasan denominatif.
