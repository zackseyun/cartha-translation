  to: Mengenai bangsa-bangsa di negeri itu yang membawa barang dagangan dan segala macam biji-bijian untuk dijual pada hari Sabat, kami tidak akan membeli dari mereka pada hari Sabat ataupun pada hari kudus. Kami akan membiarkan tahun ketujuh dan melepaskan setiap piutang.[a]
  rationale: Revisi tunggal mengganti “gandum” dengan “biji-bijian” agar padanan Indonesia tidak membatasi komoditas שֶׁבֶר pada wheat. Struktur ikrar, rujukan kepada bangsa-bangsa di negeri itu, larangan membeli pada Sabat atau hari kudus, serta ketegangan makna frasa tentang piutang tetap dipertahankan.
