  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: id
  text: Kami membuang undi mengenai[a] persembahan kayu—para imam, orang Lewi, dan rakyat—untuk membawanya ke rumah Allah kami menurut kelompok-kelompok keluarga leluhur kami, pada waktu-waktu yang ditetapkan setiap tahun, untuk membakarnya di atas mazbah Yahweh, Allah kami, seperti yang tertulis dalam Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk persembahan kayu.” Kata depan Ibrani dapat dipahami dengan kedua cara tersebut; maksud umumnya ialah bahwa undian menentukan tanggung jawab untuk menyediakan kayu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Kami membuang undi
  rationale: Bentuk Hifil dari נפל bersama גּוֹרָלוֹת merupakan ungkapan baku untuk menentukan sesuatu melalui undian. “Membuang undi” alami dalam bahasa Indonesia dan mempertahankan gambaran teks Ibrani.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: mengenai[a] persembahan kayu
  rationale: עַל dapat memperkenalkan perkara yang diputuskan melalui undian, sedangkan קֻרְבַּן הָעֵצִים menunjuk pada persembahan berupa kayu untuk keperluan mazbah. Catatan kaki mempertahankan kemungkinan fungsi tujuan, “untuk persembahan kayu”.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: para imam, orang Lewi, dan rakyat
  rationale: Ketiga kelompok yang ikut membuang undi disebutkan secara eksplisit dan dipertahankan tanpa diringkas.
- source_word: לְהָבִיא
  choice: untuk membawanya
  rationale: Infinitif ini menyatakan tujuan pembuangan undi. Akhiran “-nya” secara alami merujuk kembali kepada persembahan kayu.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: ke rumah Allah kita
  rationale: Walaupun בַּיִת di sini merujuk pada Bait Allah, “rumah Allah kita” mempertahankan ungkapan Ibrani dan tetap jelas dalam konteks.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: menurut kaum keluarga leluhur kita
  rationale: Ungkapan ini menunjuk pada pembagian berdasarkan rumah leluhur atau kelompok keluarga. “Kaum keluarga leluhur” menyampaikan struktur sosial tersebut dengan bahasa Indonesia yang dapat dipahami.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: pada waktu-waktu yang ditetapkan setiap tahun
  rationale: Terjemahan ini menyampaikan jadwal yang telah ditentukan dan keberulangannya dari tahun ke tahun secara alami.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: supaya dibakar di atas mazbah
  rationale: בער dalam konteks ini menyatakan pembakaran kayu di atas mazbah. Bentuk pasif memperjelas bahwa kayulah yang dibakar tanpa menambahkan gagasan bahwa api harus terus dijaga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: seperti yang tertulis dalam Taurat
  rationale: Rumus ini merujuk pada ketentuan tertulis dalam Taurat sebagai kumpulan pengajaran yang diakui.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan sebuah gelar.
- issue: Fungsi kayu pada mazbah
  choice: supaya dibakar di atas mazbah
  alternative: supaya api tetap menyala di atas mazbah
  rationale: Konteks Taurat dapat mengisyaratkan pemeliharaan api mazbah, tetapi verba בער di sini tidak dengan sendirinya mengharuskan tambahan “tetap menyala”. Terjemahan utama mempertahankan cakupan ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “mazbah” dipertahankan karena tepat bagi konteks ibadah Israel, sedangkan “kaum keluarga leluhur” dipilih untuk menjelaskan struktur rumah leluhur tanpa terdengar terlalu teknis. Tanda pisah mempertahankan hubungan aposisional ketiga kelompok dengan subjek “kami”.
