revisions:
- from: Mereka bergabung dengan saudara-saudara mereka, yaitu para pemuka mereka,[a] lalu mengikat diri dengan kutuk dan sumpah[b] untuk hidup menurut hukum Allah, yang diberikan melalui Musa, hamba Allah itu,[c] serta untuk menaati dan melaksanakan segala perintah Yahweh, Tuhan kami, juga segala peraturan dan ketetapan-Nya.[d]
  to: Mereka bergabung dengan saudara-saudara mereka dan para pemuka mereka, lalu mengikat diri dengan kutuk dan sumpah[b] untuk hidup menurut hukum Allah, yang diberikan melalui Musa, hamba Allah,[c] serta untuk menaati dan melaksanakan segala perintah Yahweh, Tuhan kami, juga segala peraturan dan ketetapan-Nya.[d]
  rationale: Revisi memulihkan koordinasi antara “saudara-saudara mereka” dan “para pemuka mereka”, sehingga terjemahan tidak menyatakan bahwa para pemuka itu semata-mata merupakan identitas saudara-saudara tersebut. Catatan kaki a diselaraskan dengan struktur ini. “Itu” setelah “hamba Allah” dihapus sebagai unsur yang tidak perlu. Catatan a tetap disediakan sebagai alternatif leksikal, meskipun penandanya tidak ditempatkan pada teks utama karena alternatif tersebut meliputi frasa pembuka secara keseluruhan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:16:34Z'
