reference: Nehemiah 10:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַחֲזִיקִ֣ים עַל אֲחֵי/הֶם֮ אַדִּירֵי/הֶם֒ וּ/בָאִ֞ים בְּ/אָלָ֣ה וּ/בִ/שְׁבוּעָ֗ה לָ/לֶ֨כֶת֙ בְּ/תוֹרַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר נִתְּנָ֔ה בְּ/יַ֖ד מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֑ים וְ/לִ/שְׁמ֣וֹר וְ/לַ/עֲשׂ֗וֹת אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֲדֹנֵ֔י/נוּ וּ/מִשְׁפָּטָ֖י/ו וְ/חֻקָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: id
  text: Mereka bergabung dengan saudara-saudara mereka dan para pemuka mereka, lalu mengikat diri dengan kutuk dan sumpah[b] untuk hidup menurut hukum Allah, yang diberikan melalui Musa, hamba Allah,[c] serta untuk menaati dan melaksanakan segala perintah Yahweh, Tuhan kami, juga segala peraturan dan ketetapan-Nya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: '“Kutuk dan sumpah” adalah ikrar perjanjian: mereka bersumpah untuk taat dan menerima kutuk perjanjian jika melanggarnya.'
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “yang diberikan dengan perantaraan tangan Musa.”
    reason: lexical_alternative
  - marker: d
    text: “Peraturan” dapat juga diterjemahkan “keputusan hukum”, dan “ketetapan” dapat juga diterjemahkan “ketentuan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: bergabung dengan
  rationale: Dalam konteks pembaruan perjanjian, ungkapan ini menyatakan tindakan mengikatkan diri atau berpihak teguh bersama anggota lain dalam komunitas, bukan sekadar menguatkan secara fisik.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan maskulin jamak dalam bahasa Ibrani; dalam konteksnya istilah ini dapat menunjuk sesama anggota komunitas perjanjian.
- source_word: אַדִּירֵיהֶם
  choice: para pemuka mereka
  rationale: Kata ini menunjuk orang-orang terkemuka dan berkedudukan dalam komunitas. 'Para pemuka' lebih alami dalam bahasa Indonesia modern daripada 'para bangsawan' dan tidak membatasi maknanya pada kelas aristokrat.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: lalu mengikat diri dengan kutuk dan sumpah
  rationale: Mengungkapkan masuknya mereka ke dalam kewajiban perjanjian yang disahkan oleh sumpah dan disertai kutuk apabila dilanggar. Susunan ini alami dalam bahasa Indonesia sambil mempertahankan kedua unsur sumber.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: untuk hidup menurut hukum Allah
  rationale: Metafora Ibrani 'berjalan dalam' menyangkut cara hidup. 'Hidup menurut' menyampaikan maknanya secara jelas dan alami; 'hukum' sesuai dengan konteks perjanjian dan rangkaian perintah.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: yang diberikan melalui Musa
  rationale: Ungkapan harfiah 'diberikan dengan/perantaraan tangan Musa' menyatakan bahwa Musa menjadi perantara penyampaian hukum itu. 'Melalui Musa' merupakan padanan idiomatis dalam bahasa Indonesia.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: hamba Allah itu
  rationale: Di sini עֶבֶד merupakan gelar kehormatan bagi Musa. 'Hamba' lebih tepat daripada 'budak' dalam konteks gelar ini; 'itu' menandai aposisi secara alami.
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: untuk menaati dan melaksanakan
  rationale: Mempertahankan dua verba yang menekankan pemeliharaan ketaatan sekaligus pelaksanaan nyata, dengan ungkapan Indonesia yang wajar.
- source_word: מִצְוֺת ... מִשְׁפָּטָיו וְחֻקָּיו
  choice: perintah ... peraturan dan ketetapan-Nya
  rationale: Mempertahankan tiga istilah hukum yang saling berkaitan tanpa memaksakan pembedaan teknis yang lebih sempit daripada konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֲדֹנֵינוּ
  choice: Tuhan kami
  rationale: Membedakan gelar אֲדֹנֵינוּ dari nama diri Yahweh serta mempertahankan bentuk orang pertama jamak.
theological_decisions:
- issue: Nama ilahi יְהוָה dan gelar אֲדֹנֵינוּ muncul berdampingan
  choice: Yahweh, Tuhan kami
  alternative: TUHAN, Tuhan kami
  rationale: Pilihan ini mempertahankan nama perjanjian sebagai nama diri dan sekaligus membedakannya dari gelar 'Tuhan kami', tanpa meleburkan kedua unsur sumber.
- issue: Makna kutuk dalam ikrar perjanjian
  choice: mengikat diri dengan kutuk dan sumpah
  alternative: bersumpah dengan menerima kutuk
  rationale: Teks menyebut kutuk dan sumpah sebagai dua unsur ikrar. Terjemahan mempertahankan keduanya, sedangkan catatan menjelaskan sifat kutuk tersebut tanpa menambahkan akibat yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Gelar עֶבֶד bagi Musa
  choice: hamba Allah
  alternative: budak Allah
  rationale: Walaupun kata sumber dapat berarti budak atau hamba, pemakaiannya bagi Musa di sini merupakan gelar kehormatan bagi pelayan Allah; 'hamba' paling sesuai dengan fungsi tersebut.
- issue: Cakupan אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: sesama orang Israel
  rationale: Bentuk maskulin dan metafora kekerabatan dipertahankan. Konteks mungkin mencakup komunitas perjanjian secara lebih luas, tetapi terjemahan tidak menetralkan istilah sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur kalimat mempertahankan rangkaian komitmen perjanjian, sedangkan idiom Ibrani yang kurang alami dialihkan secara idiomatis dan dijelaskan dalam catatan kaki. Kapitalisasi '-Nya' dipakai sesuai kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
