lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: Ahia
  rationale: Konjungsi Ibrani וַ menghubungkan ayat ini dengan rangkaian nama sebelumnya. Dalam bahasa Indonesia, hubungan daftar itu dinyatakan secara alami dengan menempatkan “dan” sebelum nama terakhir. Nama אֲחִיָּה ditransliterasikan sebagai “Ahia”, bentuk yang wajar dalam tradisi Alkitab bahasa Indonesia.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri חָנָן ditransliterasikan langsung sebagai “Hanan”; makna etimologisnya tidak diterjemahkan dalam daftar nama.
- source_word: עָנָן
  choice: Anan
  rationale: Nama diri עָנָן ditransliterasikan sebagai “Anan”, sesuai bunyi konsonan dan vokal teks Masoret; makna namanya tidak diterjemahkan.
theological_decisions: []
