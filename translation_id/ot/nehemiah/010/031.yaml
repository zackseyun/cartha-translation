base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/031.yaml
  text: and that we will not give our daughters to the peoples of the land[b][a], nor take their daughters for our sons.
translation:
  language: id
  text: dan bahwa kami tidak akan memberikan anak-anak perempuan kami kepada bangsa-bangsa negeri itu[a], dan tidak akan mengambil[b] anak-anak perempuan mereka sebagai istri bagi anak-anak lelaki kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bangsa negeri itu.” Dalam bahasa Ibrani, kata yang diterjemahkan “bangsa-bangsa” berbentuk jamak.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata “mengambil”; dalam konteks ini, maksudnya ialah mengambil sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: dan bahwa
  rationale: Ungkapan ini menghubungkan ketetapan tersebut dengan sumpah perjanjian sebelumnya sekaligus memperkenalkan satu kewajiban tambahan.
- source_word: נִתֵּן
  choice: kami tidak akan memberikan
  rationale: Bentuk yiqtol di sini menyatakan komitmen yang akan dipegang oleh umat dalam ikrar mereka.
- source_word: בְּנֹתֵינוּ
  choice: anak-anak perempuan kami
  rationale: Terjemahan langsung ini mempertahankan bentuk jamak dan hubungan kepemilikan dalam bahasa Ibrani.
- source_word: לְעַמֵּי הָאָרֶץ
  choice: kepada bangsa-bangsa negeri itu
  rationale: Kata עַמֵּי berbentuk jamak. Pilihan ini mempertahankan kejamakan itu tanpa menambahkan penilaian seperti 'kafir' atau 'asing' yang tidak dinyatakan dalam ayat.
- source_word: נִקַּח
  choice: mengambil ... sebagai istri
  rationale: Kata לָקַח secara harfiah berarti 'mengambil', tetapi dalam konteks ini menunjuk pada mengambil seorang perempuan dalam perkawinan; tambahan 'sebagai istri' membuat maksudnya jelas dalam bahasa Indonesia.
- source_word: לְבָנֵינוּ
  choice: bagi anak-anak lelaki kami
  rationale: Bahasa Ibrani secara khusus menyebut anak lelaki, bukan anak secara umum.
theological_decisions:
- issue: Larangan perkawinan tanpa memasukkan ideologi etnis atau rasial
  choice: bangsa-bangsa negeri itu
  alternative: bangsa-bangsa kafir; bangsa-bangsa asing; penduduk negeri itu
  rationale: Ayat ini menyatakan kewajiban komunitas perjanjian dengan istilah sosial yang terdapat dalam teks. Terjemahan tidak menambahkan sebutan 'kafir' atau 'asing', sedangkan bentuk jamak 'bangsa-bangsa' mempertahankan bentuk Ibrani.
- issue: Makna נִקַּח dalam konteks perkawinan
  choice: mengambil ... sebagai istri
  alternative: mengambil; menikahi
  rationale: Pilihan ini mempertahankan unsur leksikal 'mengambil' dan sekaligus menjelaskan bahwa yang dimaksud adalah perkawinan, tanpa mengubah larangan timbal balik dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan 'memberikan ... kepada' dan 'mengambil ... sebagai istri bagi' mempertahankan kesejajaran timbal balik dalam teks Ibrani, sementara penjelasan perkawinan dibuat eksplisit agar alami dan tidak ambigu bagi pembaca masa kini.
