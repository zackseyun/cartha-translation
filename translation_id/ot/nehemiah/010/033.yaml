  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: id
  text: Kami juga menetapkan kewajiban bagi diri kami sendiri untuk memberikan sepertiga syikal setiap tahun untuk pelayanan di rumah Allah kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kami juga menetapkan kewajiban-kewajiban bagi diri kami sendiri untuk memberikan sepertiga syikal setiap tahun.”'
    reason: Bentuk מִצְוֺת secara morfologis adalah jamak, walaupun dalam konteks ini dapat dipahami secara kolektif atau abstrak sebagai satu kewajiban.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת
  choice: Kami juga menetapkan bagi diri kami kewajiban
  rationale: Bentuk Hifil dari עמד dengan עָלֵינוּ menyatakan penetapan yang mengikat diri sendiri. מִצְוֺת di sini paling wajar dipahami secara kolektif atau abstrak sebagai kewajiban, sementara catatan kaki mempertahankan kemungkinan bentuk jamak.
- source_word: לָתֵת
  choice: untuk memberikan
  rationale: Menerjemahkan נתן secara langsung tanpa mempersempitnya menjadi pembayaran.
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: sepertiga syikal
  rationale: Menyatakan pecahan dari satuan berat dan uang Ibrani secara ringkas dan tepat.
- source_word: בַּשָּׁנָה
  choice: setiap tahun
  rationale: Dalam konteks sumbangan ini, frasa tersebut menunjukkan keberulangan tahunan.
- source_word: לַעֲבֹדַת
  choice: bagi pelayanan
  rationale: עֲבֹדָה dalam konteks rumah Allah mencakup pelayanan atau pekerjaan yang berkaitan dengan ibadah; 'pelayanan' mempertahankan nuansa tersebut tanpa terlalu teknis.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: rumah Allah kami
  rationale: Mempertahankan ungkapan Ibrani secara dekat dan tidak menggantinya dengan istilah interpretatif 'Bait Allah' atau 'kuil'.
theological_decisions:
- issue: Sifat מִצְוֺת yang ditetapkan komunitas atas dirinya
  choice: kewajiban yang mengikat diri sendiri
  alternative: perintah atau kewajiban-kewajiban
  rationale: Konteksnya menggambarkan komunitas yang secara resmi mengikat diri untuk memberi sumbangan tahunan. 'Kewajiban' menyampaikan daya ikatnya tanpa menyatakan bahwa ini sekadar kebiasaan atau secara eksplisit perintah ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan tindakan komunitas yang mengikat diri sendiri serta ungkapan 'rumah Allah kami'.
