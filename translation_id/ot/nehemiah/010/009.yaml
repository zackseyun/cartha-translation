  text: מַֽעַזְיָ֥ה בִלְגַּ֖י שְׁמַֽעְיָ֑ה אֵ֖לֶּה הַ/כֹּהֲנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/009.yaml
  text: Maaziah, Bilgai, Shemaiah—these were the priests.
translation:
  language: id
  text: Maazya, Bilgai, dan Semaya—mereka inilah para imam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַֽעַזְיָה
  choice: Maazya
  rationale: Nama diri Ibrani ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; unsur akhir -yāh dipertahankan sebagai -ya.
- source_word: בִלְגַּי
  choice: Bilgai
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; bentuk Bilgai jelas dan sesuai dengan ejaan Indonesia.
- source_word: שְׁמַֽעְיָה
  choice: Semaya
  rationale: Nama diri Ibrani ditransliterasikan dengan syin sebagai s dan unsur akhir -yāh sebagai -ya, menghasilkan bentuk Indonesia yang mudah dibaca.
- source_word: אֵ֖לֶּה
  choice: mereka inilah
  rationale: Kata tunjuk jamak ini merujuk kepada nama-nama orang yang baru disebut; 'mereka inilah' menyampaikan penunjukan tersebut secara alami dan tegas dalam bahasa Indonesia.
- source_word: הַ/כֹּהֲנִֽים
  choice: para imam
  rationale: Bentuk jamak dengan artikel tertentu menunjuk kelompok imam yang diidentifikasi oleh daftar nama; 'para imam' merupakan padanan Indonesia yang alami tanpa perlu menerjemahkan artikel secara terpisah.
