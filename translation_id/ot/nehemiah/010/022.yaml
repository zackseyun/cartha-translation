lexical_decisions:
- source_word: מְשֵׁיזַבְאֵל
  choice: Meshezabeel
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Meshezabeel” mempertahankan unsur akhir -el dan memakai ejaan yang wajar dalam tradisi Alkitab bahasa Indonesia.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri Ibrani ini ditransliterasikan dengan bentuk “Zadok”, yang sudah lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: יַדּוּעַ
  choice: Yadua
  rationale: Huruf awal yod ditampilkan sebagai Y sesuai kebiasaan transliterasi nama Ibrani dalam bahasa Indonesia. Dagesh pada dalet tidak perlu dinyatakan dengan penggandaan huruf dalam ejaan Indonesia.
