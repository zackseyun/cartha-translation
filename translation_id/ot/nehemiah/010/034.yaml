id: NEH.10.34
reference: Nehemiah 10:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/לֶ֣חֶם הַֽ/מַּעֲרֶ֡כֶת וּ/מִנְחַ֣ת הַ/תָּמִ֣יד וּ/לְ/עוֹלַ֣ת הַ֠/תָּמִיד הַ/שַּׁבָּת֨וֹת הֶ/חֳדָשִׁ֜ים לַ/מּוֹעֲדִ֗ים וְ/לַ/קֳּדָשִׁים֙ וְ/לַ֣/חַטָּא֔וֹת לְ/כַפֵּ֖ר עַל יִשְׂרָאֵ֑ל וְ/כֹ֖ל מְלֶ֥אכֶת בֵּית אֱלֹהֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: id
  text: untuk roti yang ditata[a], persembahan sajian yang tetap, dan kurban bakaran yang tetap, untuk hari-hari Sabat, bulan-bulan baru, waktu-waktu yang ditetapkan[c], dan hal-hal kudus[d], serta untuk kurban penghapus dosa[e] guna mengadakan pendamaian bagi Israel[b], dan untuk segala pekerjaan di rumah Allah kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti sajian” atau “roti yang diatur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengadakan penebusan bagi Israel.”
    reason: lexical_alternative
  - marker: c
    text: “Waktu-waktu yang ditetapkan” mencakup kesempatan perayaan yang telah ditentukan.
    reason: lexical_alternative
  - marker: d
    text: Atau “persembahan-persembahan kudus” atau “hal-hal yang dikhususkan.”
    reason: lexical_alternative
  - marker: e
    text: Dalam konteks tertentu, istilah ini juga dapat dipahami sebagai “kurban pentahiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: roti yang ditata
  rationale: Ungkapan ini secara harfiah menunjuk pada roti yang diatur atau ditata di hadapan Allah. Pilihan ini alami dalam bahasa Indonesia dan tidak bergantung pada istilah tradisional yang kurang transparan.
- source_word: מִנְחַת הַתָּמִיד
  choice: persembahan sajian yang tetap
  rationale: Dalam konteks ibadah, מִנְחָה menunjuk pada persembahan berbahan hasil bumi, sedangkan תָּמִיד menyatakan keteraturan atau keberlangsungannya. 'Persembahan sajian' merupakan istilah Indonesia yang dikenal dan tidak mempersempitnya menjadi bahan tertentu saja.
- source_word: עֹלַת הַתָּמִיד
  choice: kurban bakaran yang tetap
  rationale: עֹלָה adalah kurban yang dibakar seluruhnya, dan תָּמִיד menandai pelaksanaannya secara tetap atau terus-menerus.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: untuk hari-hari Sabat, bulan-bulan baru, waktu-waktu yang ditetapkan
  rationale: Rangkaian ini dipertahankan sebagai daftar kesempatan ibadah. מוֹעֲדִים lebih luas daripada sekadar hari raya dan mencakup waktu pertemuan atau perayaan yang telah ditetapkan.
- source_word: וְלַקֳּדָשִׁים
  choice: dan hal-hal kudus
  rationale: Bentuk jamak ini luas dan dapat menunjuk pada benda, persembahan, atau urusan yang dikhususkan. Terjemahan ini menjaga keluasan maknanya.
- source_word: וְלַחַטָּאוֹת
  choice: serta untuk kurban penghapus dosa
  rationale: Dalam konteks kurban, חַטָּאת lazim menunjuk pada kurban terkait dosa dan pentahiran. Istilah Indonesia yang mapan ini mempertahankan kategori ritual tanpa menjabarkan mekanismenya.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: guna mengadakan pendamaian bagi Israel
  rationale: כפר dalam konteks ritual menyatakan tindakan pendamaian atau penebusan. 'Mengadakan pendamaian' mempertahankan bobot kultis dan teologisnya tanpa menerangkan teori tertentu.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: dan untuk segala pekerjaan di rumah Allah kita
  rationale: מְלָאכָה memiliki arti luas, yaitu pekerjaan atau tugas. 'Pekerjaan' tidak membatasinya hanya pada pelayanan liturgis.
theological_decisions:
- issue: Istilah bagi חַטָּאת dalam konteks kurban
  choice: kurban penghapus dosa
  alternative: kurban pentahiran
  rationale: Kedua nuansa mungkin hadir dalam istilah Ibrani. Teks utama memakai istilah Indonesia yang paling dikenal, sedangkan catatan kaki mempertahankan kemungkinan pemahaman sebagai kurban pentahiran.
- issue: Cakupan קֳּדָשִׁים
  choice: hal-hal kudus
  alternative: persembahan-persembahan kudus
  rationale: Bahasa Ibrani tidak secara tegas membatasi rujukannya pada persembahan. Pilihan yang luas menjaga ambiguitas teks.
- issue: Makna כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan
  rationale: Pilihan ini mempertahankan makna ritual-teologis tanpa menetapkan teori khusus tentang cara pendamaian itu berlangsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Struktur daftar dipertahankan, pengulangan kata depan dibuat secukupnya agar hubungan antarbagiannya jelas, dan istilah ritual diterjemahkan secara konsisten tanpa memasukkan penafsiran denominasi.
