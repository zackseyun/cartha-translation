  register: Bahasa Indonesia baku modern dengan nada ikrar komunal yang khidmat. Pengulangan 'kami akan membawa' dipakai untuk memperjelas dua tujuan penerima—para imam dan orang Lewi—tanpa mengubah hubungan sintaksis dasarnya. Istilah 'orang-orang Lewi', 'Bait Allah', dan 'persepuluhan' dipilih karena mapan dan mudah dipahami pembaca Alkitab Indonesia.
