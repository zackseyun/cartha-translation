  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: id
  text: Kami juga akan membawa bagian pertama dari adonan kami[a], persembahan-persembahan khusus kami, buah dari setiap pohon, anggur baru, dan minyak kepada para imam, ke bilik-bilik rumah Allah kami[b]. Kami akan membawa persepuluhan dari tanah kami kepada orang-orang Lewi, sebab orang-orang Lewilah yang memungut persepuluhan di semua kota tempat kami bekerja[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bagian pertama dari adonan kami”; yang dimaksud ialah bagian pertama yang dikhususkan sebagai persembahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “ruang-ruang penyimpanan”. Istilah Ibrani menunjuk pada ruang-ruang dalam kompleks Bait Allah, yang antara lain dipakai untuk menyimpan persembahan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di semua kota pekerjaan/pelayanan kami”. Ungkapan Ibraninya ringkas dan dapat menunjuk pada kota-kota tempat umat bekerja, mungkin terutama mengolah tanah.
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: bagian pertama dari adonan kami
  rationale: רֵאשִׁית menyatakan bagian pertama yang dipersembahkan, sedangkan עֲרִיסָה menunjuk pada adonan atau massa yang telah diremas. Terjemahan ini mempertahankan gambaran konkret tanpa memakai istilah yang terlalu teknis.
- source_word: תְּרוּמֹתֵינוּ
  choice: persembahan-persembahan khusus kami
  rationale: תְּרוּמָה adalah sumbangan atau persembahan yang dikhususkan bagi tujuan kudus. Pilihan ini jelas dalam bahasa Indonesia modern dan menghindari istilah ritual yang asing.
- source_word: פְּרִי כָל עֵץ
  choice: buah dari setiap pohon
  rationale: Terjemahan langsung ini mempertahankan daya distributif כָל dan terdengar alami dalam bahasa Indonesia.
- source_word: תִּירוֹשׁ
  choice: anggur baru
  rationale: תִּירוֹשׁ lazim menunjuk pada hasil anggur yang baru diproduksi, bukan sekadar anggur secara umum.
- source_word: יִצְהָר
  choice: minyak
  rationale: Dalam daftar hasil pertanian, istilah ini menunjuk pada minyak, biasanya minyak zaitun. 'Minyak' tidak menambahkan kekhususan yang tidak dinyatakan secara eksplisit.
- source_word: נָבִיא
  choice: kami akan membawa
  rationale: Bentuk Hifil orang pertama jamak dari בוא dalam konteks ini menyatakan ikrar atau komitmen bersama.
- source_word: לִשְׁכוֹת
  choice: bilik-bilik
  rationale: לִשְׁכּוֹת adalah ruang-ruang dalam kompleks Bait Allah. 'Bilik-bilik' mempertahankan segi arsitektural tanpa memastikan bahwa semua ruang itu semata-mata gudang.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: persepuluhan dari tanah kami
  rationale: Ungkapan ini menunjuk pada sepersepuluh dari hasil tanah. Kata 'dari' menjelaskan sumber persepuluhan secara alami dalam bahasa Indonesia.
- source_word: הַמְעַשְּׂרִים
  choice: yang memungut persepuluhan
  rationale: Partisipel dari עשר di sini menggambarkan tugas orang Lewi menerima atau mengumpulkan persepuluhan.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: di semua kota tempat kami bekerja
  rationale: עֲבֹדָה dapat berarti pekerjaan, pelayanan, atau kerja. Konteks tanah dan persepuluhan mendukung arti tempat masyarakat bekerja, mungkin khususnya dalam pertanian, tetapi terjemahan utama tidak mempersempitnya secara tegas.
