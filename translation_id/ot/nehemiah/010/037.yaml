  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: id
  text: dan anak-anak laki-laki kami yang sulung serta anak-anak sulung ternak kami[a], seperti yang tertulis dalam Taurat, dan anak-anak sulung sapi serta kambing domba kami[b], akan kami bawa ke rumah Allah kami, kepada para imam yang melayani di rumah Allah kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, sesuai dengan ketentuan Taurat mengenai anak sulung manusia dan hewan.
    reason: cross_reference
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kambing domba” dapat mencakup kambing dan domba.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: anak-anak lelaki sulung kami
  rationale: Ungkapan ini menyatakan kaum laki-laki yang sulung di antara anak-anak mereka. Bentuk jamak dipertahankan, sedangkan kata “lelaki” memperjelas rujukan בָּנִים dalam konteks ketentuan Taurat.
- source_word: וּבְהֶמְתֵּינוּ
  choice: serta anak-anak sulung ternak kami
  rationale: בְּהֵמָה mencakup hewan piaraan atau ternak secara luas; “ternak” merupakan padanan kolektif yang alami dalam bahasa Indonesia.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: seperti yang tertulis dalam Taurat
  rationale: Rumusan ini merujuk secara khusus kepada ketentuan tertulis dalam Torah; “Taurat” adalah istilah baku bahasa Indonesia.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: anak-anak sulung dari kawanan sapi serta kawanan kambing dan domba kami
  rationale: בָּקָר menunjuk terutama kepada ternak sapi, sedangkan צֹאן mencakup ternak kecil, yakni kambing dan domba. Terjemahan ini mempertahankan kedua kelompok tanpa mempersempit צֹאן hanya menjadi domba.
- source_word: לְהָבִיא
  choice: akan kami bawa
  rationale: Infinitif ini menyatakan tindakan yang menjadi komitmen umat dalam konteks perjanjian. Susunan “akan kami bawa” menghasilkan kalimat Indonesia yang alami tanpa mengubah fungsi tujuannya.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: ke rumah Allah kami
  rationale: Padanan ini mempertahankan ungkapan harfiah Ibrani dan tidak menggantinya secara interpretatif dengan “Bait Allah” atau “kuil”.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: kepada para imam yang melayani
  rationale: Partisipel הַמְשָׁרְתִים menggambarkan pelayanan yang dijalankan para imam; “yang melayani” jelas dan tetap memuat nuansa pelayanan ibadah.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: di rumah Allah kami
  rationale: Pengulangan ungkapan sumber dipertahankan untuk menjaga penekanan teks.
theological_decisions:
- issue: Apakah בֵּית אֱלֹהֵינוּ diterjemahkan secara harfiah atau secara interpretatif sebagai bait/kuil
  choice: rumah Allah kami
  alternative: Bait Allah kami
  rationale: Teks Ibrani secara harfiah berbunyi “rumah Allah kami”. Walaupun yang dimaksud ialah tempat ibadah di Yerusalem, terjemahan mempertahankan ungkapan sumber dan tidak menambahkan penafsiran yang tidak diperlukan.
- issue: Apakah ketentuan tentang anak sulung dijelaskan sebagai persembahan atau penebusan dalam teks utama
  choice: mempertahankan istilah umum “anak-anak ... sulung”
  alternative: anak-anak sulung yang harus ditebus atau dipersembahkan
  rationale: Ayat ini merujuk kepada Taurat tetapi tidak merinci dalam kalimat ini mana yang ditebus dan mana yang dipersembahkan. Terjemahan menjaga keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami dengan menempatkan “akan kami bawa” sesudah rangkaian objek, sambil mempertahankan pembukaan “dan” karena ayat ini melanjutkan daftar komitmen dari konteks sebelumnya.
