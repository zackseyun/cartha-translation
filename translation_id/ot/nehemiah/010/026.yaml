lexical_decisions:
- source_word: רְחוּם
  choice: Rehum
  rationale: Nama diri dalam daftar para pembubuh meterai. Bentuk "Rehum" mengikuti ejaan nama Alkitab yang lazim dalam bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: חֲשַׁבְנָה
  choice: Hasabna
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. "Hasabna" mencerminkan pelafalan Ibrani dalam ejaan Indonesia; huruf akhir ה tidak perlu ditampilkan sebagai h karena di sini berfungsi sebagai penanda vokal akhir.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Nama diri teoforis ini ditransliterasikan tanpa menerjemahkan maknanya. "Maaseya" mengikuti pola ejaan Indonesia, termasuk unsur akhir יָה sebagai "ya".
