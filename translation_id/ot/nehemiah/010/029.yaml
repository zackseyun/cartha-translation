source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הָ/עָ֡ם הַ/כֹּהֲנִ֣ים הַ֠/לְוִיִּם הַ/שּׁוֹעֲרִ֨ים הַ/מְשֹׁרְרִ֜ים הַ/נְּתִינִ֗ים וְֽ/כָל הַ/נִּבְדָּ֞ל מֵ/עַמֵּ֤י הָ/אֲרָצוֹת֙ אֶל תּוֹרַ֣ת הָ/אֱלֹהִ֔ים נְשֵׁי/הֶ֖ם בְּנֵי/הֶ֣ם וּ/בְנֹתֵי/הֶ֑ם כֹּ֖ל יוֹדֵ֥עַ מֵבִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: id
  text: dan sisa umat itu—para imam, orang-orang Lewi, para penjaga pintu gerbang, para penyanyi, para pelayan Bait Allah[a], dan semua orang yang telah memisahkan diri dari bangsa-bangsa negeri-negeri untuk mengikuti Taurat Allah—beserta istri-istri, anak-anak lelaki, dan anak-anak perempuan mereka, setiap orang yang mengetahui dan memahami—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Netinim, nama suatu kelompok pelayan yang ditugaskan untuk pelayanan Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: dan selebihnya dari umat itu
  rationale: שְׁאָר berarti bagian yang masih tersisa, sedangkan עָם dalam konteks perjanjian ini paling tepat diterjemahkan sebagai “umat”.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: para imam, orang-orang Lewi, para penjaga pintu gerbang, para penyanyi
  rationale: Istilah-istilah ini menunjuk pada kelompok-kelompok pelayanan yang berbeda; terjemahan mempertahankan kekhususan masing-masing.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini menunjuk pada kelompok petugas yang diberikan untuk pelayanan rumah Allah. Terjemahan berdasarkan fungsi lebih mudah dipahami daripada transliterasi “Netinim”.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת
  choice: dan semua orang yang telah memisahkan diri dari bangsa-bangsa negeri lain
  rationale: Bentuk tunggal sesudah כָל memiliki makna kolektif. “Memisahkan diri” mempertahankan tindakan sadar kelompok itu, dan “bangsa-bangsa negeri lain” menyampaikan bentuk jamak sumber secara wajar dalam bahasa Indonesia.
- source_word: אֶל תּוֹרַת הָאֱלֹהִים
  choice: untuk mengikuti Taurat Allah
  rationale: אֶל menyatakan arah keterikatan setelah pemisahan. Terjemahan idiomatis ini menunjukkan bahwa mereka memisahkan diri agar berpihak dan hidup menurut Taurat Allah, tanpa menyamakan Taurat dengan tempat tujuan harfiah.
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: beserta istri, anak laki-laki, dan anak perempuan mereka
  rationale: Daftar eksplisit dalam bahasa Ibrani dipertahankan. “Beserta” memperjelas bahwa keluarga mereka termasuk dalam kelompok yang disebut.
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: yakni setiap orang yang memiliki pengetahuan dan pengertian
  rationale: Kedua partisipel menyatakan kapasitas memahami secara sadar. Nominalisasi menghindari kesan bahwa yang dimaksud hanyalah pengetahuan pada masa lampau dan cocok dengan konteks pengikatan perjanjian.
theological_decisions:
- issue: Hubungan pemisahan dari bangsa-bangsa lain dengan Taurat Allah
  choice: untuk mengikuti Taurat Allah
  alternative: kepada Taurat Allah
  rationale: Ungkapan sumber secara harfiah berarah “kepada Taurat Allah”, tetapi bahasa Indonesia memerlukan ungkapan yang menjelaskan keberpihakan atau ketaatan. “Mengikuti” mempertahankan arah itu tanpa menambahkan gagasan perpindahan agama yang tidak dinyatakan.
- issue: Bentuk maskulin tunggal yang bermakna kolektif dalam הַנִּבְדָּל dan יוֹדֵעַ מֵבִין
  choice: semua orang yang telah memisahkan diri … setiap orang yang memiliki pengetahuan dan pengertian
  alternative: setiap laki-laki yang telah memisahkan dirinya … setiap laki-laki yang mengetahui dan memahami
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal dengan daya kolektif, sementara konteks secara tegas mencakup istri, anak laki-laki, dan anak perempuan. Bahasa Indonesia tidak menandai gender pada bentuk-bentuk ini, sehingga terjemahan kolektif menyampaikan cakupan sumber tanpa mempersempitnya.
- issue: Identitas הַנְּתִינִים
  choice: para pelayan Bait Allah
  alternative: kaum Netinim
  rationale: Terjemahan fungsional menyampaikan peran kelompok tersebut dan tidak menjadikannya jabatan teologis yang lebih khusus daripada bukti sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibiarkan berakhir dengan tanda pisah karena ayat ini secara sintaksis berlanjut ke ayat berikutnya. “Bait Allah” dipakai untuk memperjelas konteks pelayanan הַנְּתִינִים, sedangkan “Taurat” mempertahankan istilah perjanjian yang mapan.
