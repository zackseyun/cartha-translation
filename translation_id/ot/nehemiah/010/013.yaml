- source_word: זַכּוּר
  choice: Zakur
  rationale: Nama diri ditransliterasikan langsung dari bahasa Ibrani dengan ejaan yang alami dalam bahasa Indonesia; konsonan rangkap tidak diperlukan untuk mewakili pelafalan Ibrani secara wajar.
- source_word: שֵׁרֵבְיָה
  choice: Serebya
  rationale: Nama diri ditransliterasikan ke bentuk Indonesia; bunyi שׁ diwakili oleh s, sedangkan unsur akhir יָה dipertahankan secara ringkas sebagai -ya.
- source_word: שְׁבַנְיָה
  choice: Sebanya
  rationale: Nama diri ditransliterasikan sesuai pola ejaan Indonesia, dengan שׁ sebagai s dan unsur teoforis akhir יָה sebagai -ya.
