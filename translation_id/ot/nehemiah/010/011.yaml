  text: 'and their brothers: Shebaniah, Hodiah, Kelita, Pelaiah, Hanan.'
translation:
  language: id
  text: 'dan saudara-saudara mereka: Sebanya, Hodia, Kelita, Pelaya, Hanan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: dan saudara-saudara mereka
  rationale: Gabungan ו dengan אֲחֵי dan sufiks orang ketiga jamak maskulin secara langsung berarti ‘dan saudara-saudara mereka’. Dalam daftar para penanda tangan perjanjian ini, ungkapan tersebut menunjuk kepada rekan-rekan laki-laki dalam kelompok itu; terjemahan ini mempertahankan makna sumber tanpa memperluasnya menjadi istilah netral gender.
- source_word: שְׁבַנְיָה
  choice: Sebanya
  rationale: Nama diri ditransliterasikan menurut bentuk yang alami dan lazim dalam bahasa Indonesia.
- source_word: הוֹדִיָּה
  choice: Hodia
  rationale: Nama diri ditransliterasikan secara ringkas sesuai pola ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: קְלִיטָא
  choice: Kelita
  rationale: Nama diri ditransliterasikan langsung dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: פְּלָאיָה
  choice: Pelaya
  rationale: Nama diri ditransliterasikan dengan akhiran -ya, yang secara alami mewakili unsur Ibrani -yāh dalam ejaan Indonesia.
- source_word: חָנָן
  choice: Hanan
  rationale: Nama diri ditransliterasikan langsung; bentuk Hanan jelas dan lazim dalam bahasa Indonesia.
