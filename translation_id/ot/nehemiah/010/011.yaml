  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik dua dipakai untuk memperkenalkan daftar nama, dan kata ‘dan’ sebelum nama terakhir mengikuti tata daftar alami bahasa Indonesia.
