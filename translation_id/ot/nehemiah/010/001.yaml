id: NEH.10.1
reference: Nehemiah 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: id
  text: Karena semua hal ini, kami membuat perjanjian yang mengikat secara tertulis. Pada dokumen yang dimeteraikan itu tercantum nama para pemimpin kami, orang-orang Lewi kami, dan para imam kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Di atas yang dimeteraikan itu terdapat para pemimpin kami, orang-orang Lewi kami, dan para imam kami.” Teks Ibrani bersifat ringkas dan tampaknya menunjuk pada nama atau meterai mereka dalam dokumen tersebut.'
    reason: textual_clarity
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: Karena semua hal ini
  rationale: Preposisi ב dalam konteks ini paling wajar dipahami secara kausal dan merujuk kembali kepada pengakuan serta keadaan yang telah dipaparkan.
- source_word: כֹּרְתִים אֲמָנָה
  choice: kami membuat perjanjian yang mengikat
  rationale: כרת bersama אֲמָנָה memakai ungkapan pembuatan perjanjian secara harfiah 'memotong'; terjemahan ini menyampaikan komitmen resmi dan kokohnya secara alami dalam bahasa Indonesia.
- source_word: וְכֹתְבִים
  choice: secara tertulis
  rationale: Partisip ini menunjukkan bahwa perjanjian tersebut dituangkan dalam bentuk tulisan.
- source_word: וְעַל הֶחָתוּם
  choice: Pada dokumen yang dimeteraikan itu
  rationale: Frasa ini menunjuk kepada naskah resmi yang telah diberi meterai; 'dokumen' merupakan padanan modern yang jelas.
- source_word: שָׂרֵינוּ
  choice: para pemimpin kami
  rationale: Dalam konteks pascapembuangan, istilah ini menunjuk para pemuka sipil; 'pemimpin' tidak menyiratkan kedudukan kerajaan.
- source_word: לְוִיֵּינוּ
  choice: orang-orang Lewi kami
  rationale: Padanan baku bagi kelompok suku dan pelayan ibadah ini.
- source_word: כֹּהֲנֵינוּ
  choice: para imam kami
  rationale: Padanan langsung dan baku bagi kelompok imam.
theological_decisions:
- issue: Hubungan nama-nama dengan dokumen bermeterai
  choice: tercantum nama para pemimpin kami, orang-orang Lewi kami, dan para imam kami
  alternative: di atas dokumen yang dimeteraikan itu terdapat para pemimpin kami, orang-orang Lewi kami, dan para imam kami
  rationale: Teks Ibrani bersifat eliptis; konteks daftar berikutnya menunjukkan bahwa yang terdapat pada dokumen adalah nama atau meterai mereka. Penambahan 'nama' membuat maksudnya jelas tanpa menjadikan mereka secara harfiah berada di atas dokumen.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah legal-formal dipertahankan melalui 'perjanjian yang mengikat', 'dokumen', dan 'dimeteraikan', sedangkan idiom Ibrani harfiah 'memotong perjanjian' diterjemahkan secara alami.
