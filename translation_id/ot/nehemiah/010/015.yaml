  text: רָאשֵׁ֖י הָ/עָ֑ם פַּרְעֹשׁ֙ פַּחַ֣ת מוֹאָ֔ב עֵילָ֥ם זַתּ֖וּא בָּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/015.yaml
  text: 'the heads of the people: Parosh[a], Pahath-moab, Elam, Zattu, Bani.'
translation:
  language: id
  text: 'para kepala rakyat[a]: Paros, Pahat-Moab, Elam, Zatu, dan Bani.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “para pemimpin rakyat”. Secara harfiah: “kepala-kepala rakyat”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: para kepala
  rationale: Bentuk jamak konstruksi dari רֹאשׁ dipakai sebagai metafora bagi orang-orang yang berkedudukan memimpin. Frasa ini mempertahankan gambaran Ibrani, sementara catatan kaki memberikan padanan Indonesia yang lebih idiomatis.
- source_word: הָעָם
  choice: rakyat
  rationale: עַם di sini menunjuk kepada komunitas Yehuda/Yerusalem yang diwakili dalam daftar perjanjian. 'Rakyat' alami dalam konteks para kepala komunitas dan tidak mengubahnya menjadi istilah kebangsaan.
- source_word: פַּרְעֹשׁ
  choice: Paros
  rationale: Nama orang atau kaum; ditransliterasikan dengan bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: פַּחַת מוֹאָב
  choice: Pahat-Moab
  rationale: Nama majemuk ditransliterasikan dan diberi tanda hubung agar kedua unsurnya tetap tampak.
- source_word: עֵילָם
  choice: Elam
  rationale: Dalam konteks daftar ini, bentuk tersebut dipahami sebagai nama orang atau kaum, bukan nama wilayah.
- source_word: זַתּוּא
  choice: Zatu
  rationale: Nama orang atau kaum ditransliterasikan ke dalam ejaan Indonesia tanpa menggandakan konsonan yang tidak diperlukan.
- source_word: בָּנִי
  choice: Bani
  rationale: Teks konsonantal dan vokalisasi ayat ini mendukung 'Bani'; bentuk ini tidak diselaraskan dengan nama serupa di bagian lain.
theological_decisions: []
