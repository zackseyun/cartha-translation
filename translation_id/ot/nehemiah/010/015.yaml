  terminology: “Rakyat” sesuai bagi הָעָם dalam konteks komunitas yang diwakili. Bentuk nama, khususnya “Pahat-Moab,” “Zatu,” dan “Bani,” konsisten dengan transliterasi Indonesia dan tidak menyelaraskan Bani dengan nama serupa di tempat lain.
