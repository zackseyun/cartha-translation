  source_fidelity: 'Teks menerjemahkan רָאשֵׁי הָעָם secara dekat sebagai “para kepala rakyat” dan mempertahankan fungsi konstruksi serta bentuk jamaknya. Kelima nama mengikuti bentuk Ibrani dengan transliterasi Indonesia yang wajar: Paros, Pahat-Moab, Elam, Zatu, dan Bani. Tidak ada penambahan makna substantif; “dan” sebelum nama terakhir adalah pelancaran daftar yang wajar dalam bahasa Indonesia.'
