  text: And on the sealed document were Nehemiah the governor[a], son of Hacaliah[b], and Zedekiah.
translation:
  language: id
  text: 'Pada dokumen yang dimeteraikan[a] itu tercantum nama-nama berikut: Nehemia, sang gubernur[b], anak Hakhalya, dan Zedekia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk jamak, “yang dimeteraikan.” Dalam konteks ini, ungkapan itu mungkin menunjuk pada dokumen perjanjian bermeterai atau pada orang-orang yang namanya tercantum di dalamnya.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “sang Tirsyata,” sebuah gelar administratif pada zaman Persia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Pada ... itu tercantum
  rationale: Dalam konteks daftar administratif, frasa ini menunjukkan bahwa nama-nama berikut terdapat pada dokumen perjanjian; susunan ini alami dalam bahasa Indonesia.
- source_word: הַחֲתוּמִים
  choice: dokumen yang dimeteraikan
  rationale: Bentuk Ibrani secara harfiah adalah partisip pasif jamak, tetapi dalam konteks mengacu pada dokumen bermeterai atau nama-nama yang tertera padanya. Terjemahan ini mempertahankan gambaran meterai tanpa memakai istilah hukum yang terlalu teknis.
- source_word: נְחֶמְיָה
  choice: Nehemia
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַתִּרְשָׁתָא
  choice: sang gubernur
  rationale: Ini adalah gelar administratif zaman Persia. 'Gubernur' menyampaikan fungsi jabatan itu secara jelas, sedangkan bentuk gelarnya dicatat dalam catatan kaki.
- source_word: בֶּן חֲכַלְיָה
  choice: anak Hakhalya
  rationale: בֶּן adalah penanda hubungan genealogis biasa; nama חֲכַלְיָה ditransliterasikan secara dekat ke dalam ejaan Indonesia.
- source_word: וְצִדְקִיָּה
  choice: dan Zedekia
  rationale: Konjungsi menghubungkan Zedekia sebagai nama berikutnya dalam daftar.
