revisions:
- from: Sebab orang Israel dan orang Lewi akan membawa persembahan berupa gandum, anggur baru, dan minyak ke bilik-bilik tempat perkakas-perkakas tempat kudus berada, bersama para imam yang melayani, para penjaga pintu gerbang, dan para penyanyi. Kami tidak akan mengabaikan rumah Allah kami.[a]
  to: Sebab orang Israel dan orang Lewi akan membawa persembahan berupa gandum, anggur baru, dan minyak ke bilik-bilik; di sana terdapat perkakas-perkakas tempat kudus, para imam yang melayani, para penjaga gerbang, dan para penyanyi. Kami tidak akan mengabaikan rumah Allah kami.[a]
  rationale: Revisi menghilangkan “bersama” agar daftar perkakas dan petugas tetap berfungsi sebagai daftar yang dilokasikan di bilik-bilik, sebagaimana struktur Ibrani. Istilah “penjaga gerbang” juga disederhanakan demi kelancaran bahasa Indonesia. Makna janji penutup dan catatan alternatifnya dipertahankan.
