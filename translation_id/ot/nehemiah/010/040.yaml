  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: id
  text: Sebab orang Israel dan orang Lewi akan membawa persembahan berupa gandum, anggur baru, dan minyak ke bilik-bilik; di sana terdapat perkakas-perkakas tempat kudus, para imam yang melayani, para penjaga gerbang, dan para penyanyi. Kami tidak akan mengabaikan rumah Allah kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kami tidak akan meninggalkan rumah Allah kami.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְּשָׁכוֹת
  choice: bilik-bilik
  rationale: Menunjuk pada ruang-ruang samping di kompleks Bait Allah yang juga dipakai untuk penyimpanan; 'bilik-bilik' mempertahankan nuansa arsitektural tanpa mempersempit fungsinya menjadi gudang saja.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: orang Israel dan orang Lewi
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan kelompok yang dimaksud dengan wajar, sambil mempertahankan kesejajaran antara Israel dan Lewi.
- source_word: תְּרוּמַת הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: persembahan berupa gandum, anggur baru, dan minyak
  rationale: תְּרוּמָה adalah pemberian yang dikhususkan bagi keperluan kudus; konstruksi rangkaian benda paling alami dipahami sebagai persembahan yang terdiri atas hasil-hasil tersebut.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: perkakas-perkakas tempat kudus
  rationale: כְּלִי di sini menunjuk pada berbagai perlengkapan ibadah, sedangkan מִקְדָּשׁ menunjuk pada tempat kudus; pilihan ini jelas dan tidak terlalu teknis.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: para imam yang melayani
  rationale: Partisipel מְשָׁרְתִים menggambarkan para imam dalam pelaksanaan pelayanan mereka.
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Menunjuk pada petugas yang menjaga atau mengawasi pintu-pintu gerbang Bait Allah.
- source_word: לֹא נַעֲזֹב
  choice: tidak akan mengabaikan
  rationale: Dalam konteks janji untuk menyediakan persembahan dan menopang pelayanan Bait Allah, verba עזב menyatakan tidak menelantarkan atau mengabaikan, bukan sekadar tidak meninggalkan secara fisik.
theological_decisions:
- issue: Cakupan janji untuk tidak meninggalkan rumah Allah
  choice: Kami tidak akan mengabaikan rumah Allah kami
  alternative: Kami tidak akan meninggalkan rumah Allah kami
  rationale: Konteksnya adalah tanggung jawab umat untuk menopang ibadah dan kebutuhan Bait Allah. 'Mengabaikan' menyampaikan daya praktis janji itu, sementara alternatif yang lebih harfiah dicatat karena עזב juga dapat berarti 'meninggalkan'.
- issue: Hubungan sintaksis daftar petugas dengan bilik-bilik
  choice: tempat perkakas-perkakas tempat kudus berada, bersama para imam ...
  alternative: di sana terdapat perkakas-perkakas tempat kudus, para imam ...
  rationale: Bahasa Ibrani bersifat ringkas dan menempatkan perkakas serta petugas sesudah שָׁם. Terjemahan mempertahankan asosiasi lokatif tanpa menyatakan bahwa para petugas disimpan di dalam bilik-bilik seperti perkakas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Bilik-bilik' mempertahankan latar arsitektural Bait Allah; struktur kalimat dilancarkan agar daftar perkakas dan para petugas tidak menimbulkan kesan bahwa semuanya merupakan barang simpanan.
