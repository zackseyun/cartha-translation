  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: id
  text: 'Dan orang-orang Lewi: Yesua anak Azanya, Binui dari keturunan Henadad, Kadmiel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Dan orang-orang Lewi
  rationale: Konjungsi וְ dipertahankan sebagai “Dan” untuk menghubungkan ayat ini dengan daftar sebelumnya. Bentuk jamak definit הַלְוִיִּם diterjemahkan secara alami sebagai “orang-orang Lewi”; tidak ditambahkan verba karena teks Ibrani tidak memilikinya.
- source_word: וְיֵשׁוּעַ
  choice: Yesua
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia. Konjungsi pada nama ini tidak perlu dinyatakan tersendiri karena tanda titik dua sudah memperkenalkan daftar nama.
- source_word: בֶּן אֲזַנְיָה
  choice: anak Azanya
  rationale: Konstruksi silsilah בֶּן diterjemahkan dengan “anak”, sedangkan אֲזַנְיָה ditransliterasikan “Azanya” sesuai bunyi Ibraninya.
- source_word: בִּנּוּי
  choice: Binui
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Ibrani.
- source_word: מִבְּנֵי חֵנָדָד
  choice: dari keturunan Henadad
  rationale: מִן dipertahankan sebagai “dari”. Dalam konteks hubungan kaum atau marga, בְּנֵי secara alami berarti “keturunan”, bukan semata-mata anak kandung langsung.
- source_word: קַדְמִיאֵל
  choice: Kadmiel
  rationale: Nama pribadi ditransliterasikan dekat dengan bentuk Ibrani dan sesuai ejaan nama yang sudah dikenal dalam bahasa Indonesia.
