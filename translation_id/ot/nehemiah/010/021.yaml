lexical_decisions:
- source_word: מַגְפִּיעָשׁ
  choice: Magpias
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan. Bentuk “Magpias” mengikuti ejaan nama Alkitab yang wajar dalam bahasa Indonesia dan mewakili konsonan akhir שׁ dengan “s” sesuai kebiasaan Indonesia.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia; שׁ diwakili dengan “s” dan konsonan rangkap tidak dipertahankan karena tidak diperlukan dalam ejaan Indonesia.
- source_word: חֵזִיר
  choice: Hezir
  rationale: Nama diri ditransliterasikan sebagai “Hezir”; huruf ז diwakili dengan “z”, sehingga bentuk ini lebih langsung mencerminkan nama Ibrani daripada varian dengan “s”.
