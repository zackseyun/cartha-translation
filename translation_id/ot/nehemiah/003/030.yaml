  text: אחר/י הֶחֱזִ֜יק חֲנַנְיָ֣ה בֶן שֶׁלֶמְיָ֗ה וְ/חָנ֧וּן בֶּן צָלָ֛ף הַ/שִּׁשִּׁ֖י מִדָּ֣ה שֵׁנִ֑י אַחֲרָ֣י/ו הֶחֱזִ֗יק מְשֻׁלָּם֙ בֶּן בֶּ֣רֶכְיָ֔ה נֶ֖גֶד נִשְׁכָּתֽ/וֹ־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: id
  text: Sesudah dia[a], Hananya bin Selemya dan Hanun, anak keenam Zalaf, memperbaiki bagian lain[b]. Sesudah dia, Mesulam bin Berekhya memperbaiki bagian yang berhadapan dengan ruangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks tertulis dapat dibaca “sesudah aku”, tetapi tradisi pembacaan dan rumus yang berulang dalam pasal ini mendukung “sesudah dia”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “ukuran kedua”; dalam Nehemia 3 ungkapan ini menunjuk pada bagian tambahan yang diperbaiki.
    reason: lexical_alternative
lexical_decisions:
- source_word: אחר/י (אַחֲרַי / אַחֲרָיו)
  choice: Sesudah dia
  rationale: Dalam daftar pekerjaan di Nehemia 3, ungkapan ini menandai urutan atau letak pekerjaan terhadap pekerja sebelumnya. Bentuk teks tertulis pada kemunculan pertama dapat berarti “sesudah aku”, sedangkan tradisi pembacaan dan rumus berulang dalam pasal ini mendukung “sesudah dia”; ketegangan tekstual dipertahankan dalam catatan kaki.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam konteks Nehemia 3, verba ini menunjuk pada pekerjaan pemulihan tembok dan bangunan terkait; “memperbaiki” merupakan padanan Indonesia yang alami dan tepat.
- source_word: הַשִּׁשִּׁי
  choice: anak keenam
  rationale: Bilangan tingkat ini secara eliptis menerangkan kedudukan Hanun dalam keluarga Zalaf. Kata “anak” ditambahkan agar hubungan tersebut jelas dalam bahasa Indonesia.
- source_word: מִדָּה שֵׁנִי
  choice: bagian lain
  rationale: Secara harfiah berarti “ukuran kedua”, tetapi dalam daftar pembangunan ini menunjuk pada bagian tambahan yang dikerjakan. “Bagian lain” menyampaikan fungsi idiomatisnya tanpa menyiratkan pengukuran teknis.
- source_word: נֶגֶד
  choice: di depan
  rationale: Preposisi ini menyatakan lokasi yang berhadapan dengan atau tepat di muka suatu tempat; “di depan” alami dalam uraian topografis bahasa Indonesia.
- source_word: נִשְׁכָּתוֹ
  choice: kamarnya
  rationale: Nomina ini merujuk pada sebuah kamar atau ruangan, tanpa memastikan fungsi khususnya. “Kamar” mempertahankan keluasan makna itu.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Hananya / Selemya / Hanun / Zalaf / Mesulam / Berekhya
  rationale: Nama-nama pribadi ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia, bukan diterjemahkan.
