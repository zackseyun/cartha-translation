  text: וְ/אֵ֣ת שַׁ֣עַר הָ/אַשְׁפּ֗וֹת הֶחֱזִיק֙ מַלְכִּיָּ֣ה בֶן רֵכָ֔ב שַׂ֖ר פֶּ֣לֶךְ בֵּית הַכָּ֑רֶם ה֣וּא יִבְנֶ֔/נּוּ וְ/יַעֲמִיד֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָֽי/ו׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: id
  text: Malkia anak Rekhab, penguasa wilayah Bet-Hakerem, memperbaiki Gerbang Sampah.[a] Ia membangunnya dan memasang pintu-pintunya, kunci-kuncinya, dan palang-palangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Gerbang Kotoran.” Nama Ibraninya mengacu pada kotoran atau sampah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam daftar pekerjaan di Nehemia 3, verba ini berfungsi sebagai istilah untuk mengerjakan perbaikan pada bagian tembok atau gerbang tertentu. “Memperbaiki” menyampaikan fungsi kontekstual itu secara wajar.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Gerbang Sampah
  rationale: אַשְׁפּוֹת menunjuk pada kotoran atau sampah. “Gerbang Sampah” merupakan nama tempat yang jelas dan alami dalam bahasa Indonesia, sementara arti harfiahnya yang lebih kasar dicatat dalam catatan kaki.
- source_word: שַׂר פֶּלֶךְ
  choice: penguasa wilayah
  rationale: שַׂר menyatakan seorang pemimpin atau pejabat, sedangkan פֶּלֶךְ adalah wilayah administratif. Pilihan ini mempertahankan nuansa jabatan pemerintahan tanpa menentukan gelar yang lebih khusus daripada teks sumber.
- source_word: בֵּית הַכָּרֶם
  choice: Bet-Hakerem
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia, bukan diterjemahkan menjadi “Rumah Kebun Anggur”.
- source_word: הוּא יִבְנֶנּוּ
  choice: Dialah yang membangunnya
  rationale: בנה berarti “membangun”; konteksnya memang pemulihan gerbang, tetapi terjemahan tidak menambahkan unsur “kembali” yang tidak dinyatakan oleh verba. Bentuk “Dialah” mencerminkan penekanan pada הוּא.
- source_word: וְיַעֲמִיד
  choice: dan memasang
  rationale: Bentuk kausatif verba ini berarti mendirikan atau menempatkan pada posisinya. Untuk komponen gerbang, “memasang” paling alami.
- source_word: דַּלְתֹתָיו
  choice: daun-daun pintunya
  rationale: Bentuk jamak ini mengacu pada panel atau daun pintu gerbang. “Daun-daun pintunya” lebih tepat daripada sekadar “pintunya” dalam konteks konstruksi.
- source_word: מַנְעֻלָיו
  choice: pengancing-pengancingnya
  rationale: Istilah ini menunjuk pada perlengkapan untuk mengancing atau mengunci gerbang. “Pengancing” membedakannya dari palang yang disebut sesudahnya.
- source_word: וּבְרִיחָיו
  choice: serta palang-palangnya
  rationale: בְּרִיחַ adalah palang yang dipakai untuk mengamankan pintu atau gerbang. Bentuk jamak dipertahankan.
theological_decisions: []
