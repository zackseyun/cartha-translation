base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: id
  text: Sesudahnya, Barukh anak Zabbai[a] dengan penuh semangat memperbaiki[b] bagian kedua, dari sudut tembok sampai ke pintu masuk rumah Elyasib, imam besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Barukh anak Zakai,” mengikuti tradisi nama alternatif yang tercermin dalam beberapa versi.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “dengan penuh semangat memperbaiki” tidak lazim dan tampaknya menekankan semangat yang berkobar atau ketekunan Barukh yang luar biasa dalam pekerjaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pembangunan tembok, ungkapan ini menunjukkan urutan pekerjaan sekaligus letak bagian berikutnya terhadap pekerja sebelumnya.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: dengan penuh semangat memperbaiki
  rationale: הֶחֱזִיק dalam pasal ini berarti memperbaiki atau memperkuat, sedangkan הֶחֱרָה yang tidak lazim memberi penekanan pada semangat atau kesungguhan Barukh. Ungkapan ini mempertahankan penekanan tersebut dalam bahasa Indonesia yang wajar.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Barukh anak Zabai
  rationale: Nama-nama ditransliterasikan secara langsung, dan בֶּן diterjemahkan sebagai 'anak'. Bentuk konsonantal זבי mendukung 'Zabai', sementara tradisi nama alternatif dicatat dalam catatan kaki.
- source_word: מִדָּה שֵׁנִית
  choice: bagian yang kedua
  rationale: Dalam konteks Nehemia 3, frasa ini menunjuk pada bagian tembok tambahan yang menjadi tanggung jawab seseorang, bukan ukuran harfiah.
- source_word: מִן הַמִּקְצוֹעַ
  choice: mulai dari sudut tembok
  rationale: Kata benda ini menunjuk pada sudut atau titik belokan. Penambahan 'tembok' memperjelas acuan arsitektural yang tersirat oleh konteks tanpa mengubah makna.
- source_word: עַד פֶּתַח בֵּית
  choice: sampai ke pintu masuk rumah
  rationale: פֶּתַח berarti bukaan, pintu, atau jalan masuk; konteksnya kemungkinan besar adalah kediaman atau kompleks rumah secara fisik.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: Elyasib, imam besar
  rationale: הַכֹּהֵן הַגָּדוֹל adalah gelar jabatan yang lazim diterjemahkan 'imam besar'.
