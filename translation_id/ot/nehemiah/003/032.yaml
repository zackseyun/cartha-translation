base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/032.yaml
  text: And between the upper room of the corner and the Sheep Gate[a], the goldsmiths and the merchants made repairs.
translation:
  language: id
  text: Di antara ruang atas di sudut[a] dan Gerbang Domba, para tukang emas dan pedagang melakukan perbaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jalan naik di sudut” atau “kamar atas di sudut”. Kata Ibrani עֲלִיָּה dapat berarti ruang atau kamar atas maupun jalan naik; bentuk bangunan yang dimaksud tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵין
  choice: Di antara
  rationale: Ungkapan ini menandai bagian terakhir tembok yang terletak di antara dua titik; dalam bahasa Indonesia, hubungan dengan ayat sebelumnya tetap jelas tanpa harus memulai kalimat dengan "Dan".
- source_word: עֲלִיַּת הַפִּנָּה
  choice: ruang atas di sudut
  rationale: עֲלִיָּה lazimnya dapat menunjuk ruang atau bangunan bagian atas, sedangkan הַפִּנָּה berarti sudut. Terjemahan ini alami dan tidak menambahkan gagasan menara yang tidak tersurat.
- source_word: לְשַׁעַר הַצֹּאן
  choice: dan Gerbang Domba
  rationale: Preposisi לְ menandai batas kedua dalam konstruksi "di antara ... dan ...". "Gerbang Domba" merupakan nama lokasi yang jelas dan wajar dalam bahasa Indonesia.
- source_word: הֶחֱזִיקוּ
  choice: melakukan perbaikan
  rationale: Dalam Nehemia 3, verba ini secara berulang mengacu pada pekerjaan memperbaiki atau memperkuat bagian tembok. "Melakukan perbaikan" menyampaikan makna kontekstualnya secara alami.
- source_word: הַצֹּרְפִים
  choice: para tukang emas
  rationale: Istilah ini secara harfiah menunjuk para pemurni atau pengrajin logam mulia; "tukang emas" adalah sebutan pekerjaan yang umum dan sesuai konteks.
- source_word: וְהָרֹכְלִים
  choice: dan pedagang
  rationale: Kata ini menunjuk orang-orang yang berdagang atau menjajakan barang; "pedagang" adalah padanan modern yang luas dan alami.
