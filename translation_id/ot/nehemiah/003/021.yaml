  text: אַחֲרָ֣י/ו הֶחֱזִ֗יק מְרֵמ֧וֹת בֶּן אוּרִיָּ֛ה בֶּן הַקּ֖וֹץ מִדָּ֣ה שֵׁנִ֑ית מִ/פֶּ֨תַח֙ בֵּ֣ית אֶלְיָשִׁ֔יב וְ/עַד תַּכְלִ֖ית בֵּ֥ית אֶלְיָשִֽׁיב־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: id
  text: Sesudah dia, Meremot anak Uria, anak Hakos, memperbaiki suatu bagian lain[a], dari pintu masuk rumah Elyasib hingga ke ujung rumah Elyasib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian kedua.” Frasa Ibrani ini dapat berarti bagian tambahan yang dikerjakan Meremot atau, secara lebih harfiah, “bentangan kedua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pekerjaan pembangunan Nehemia 3, frasa ini menandai urutan para pekerja atau bagian pekerjaan; terjemahan ini mempertahankan alur teks tanpa membatasinya hanya pada kedekatan tempat.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Walaupun makna dasarnya berkaitan dengan menguatkan, dalam konteks Nehemia 3 verba ini secara idiomatis menunjuk pada pekerjaan memperbaiki tembok atau bangunan terkait.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Meremot anak Uria, anak Hakos
  rationale: Nama-nama ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia, dan rangkaian patronimik dipertahankan untuk kejelasan identitas.
- source_word: מִדָּה שֵׁנִית
  choice: bagian yang lain
  rationale: Dalam konteks ini frasa tersebut kemungkinan menunjuk pada bagian pekerjaan tambahan yang dikerjakan Meremot, yang sebelumnya juga disebut pada ayat 4. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih formal, 'bagian kedua.'
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: mulai dari pintu masuk rumah Elyasib
  rationale: פֶּתַח berarti bukaan, pintu, atau jalan masuk; 'pintu masuk' alami dalam deskripsi bangunan. 'Mulai dari' mengungkapkan titik awal rentang secara jelas.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: sampai ke ujung rumah Elyasib
  rationale: תַּכְלִית di sini menyatakan batas atau titik terjauh secara ruang, bukan gagasan abstrak tentang penyelesaian.
