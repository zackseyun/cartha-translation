  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/תְּקֹעִ֖ים מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֜גֶד הַ/מִּגְדָּ֤ל הַ/גָּדוֹל֙ הַ/יּוֹצֵ֔א וְ/עַ֖ד חוֹמַ֥ת הָ/עֹֽפֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: id
  text: Sesudah dia, orang-orang Tekoa memperbaiki bagian lainnya[a], berhadapan dengan menara besar yang menjorok keluar, sampai ke tembok Ofel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian kedua”. Frasa Ibraninya dapat menekankan bahwa orang-orang Tekoa memperbaiki bagian tambahan sesudah bagian yang sebelumnya mereka kerjakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pekerjaan Nehemia 3, frasa ini menandai urutan penugasan. Bentuk maskulin tunggalnya dipertahankan tanpa menentukan lebih jauh siapa acuannya.
- source_word: הֶחֱזִיקוּ
  choice: memperbaiki
  rationale: Secara harfiah berarti 'menguatkan', tetapi dalam konteks pembangunan tembok di Nehemia 3 berfungsi sebagai istilah untuk melakukan perbaikan atau pembangunan kembali.
- source_word: הַתְּקֹעִים
  choice: orang-orang Tekoa
  rationale: Bentuk gentilika ini menunjuk kepada penduduk atau orang yang berasal dari Tekoa; ungkapan ini paling alami dalam bahasa Indonesia modern.
- source_word: מִדָּה שֵׁנִית
  choice: bagian lainnya
  rationale: Menunjuk pada bagian pekerjaan tambahan yang dikerjakan kelompok yang sama. Alternatif lebih harfiah 'bagian kedua' dicatat karena שֵׁנִית dapat menekankan urutan kedua.
- source_word: מִנֶּגֶד
  choice: mulai dari depan
  rationale: Kata ini menunjukkan lokasi yang berhadapan dengan atau di depan suatu penanda. Bersama וְעַד, terjemahan ini membentuk rentang lokasi yang alami dalam bahasa Indonesia.
- source_word: הַמִּגְדָּל הַגָּדוֹל
  choice: menara besar
  rationale: Menerjemahkan kata benda dan sifatnya secara langsung dan alami.
- source_word: הַיּוֹצֵא
  choice: yang menjorok keluar
  rationale: Partisip dari יצא secara harfiah berarti 'yang keluar'; dalam konteks arsitektur menggambarkan menara yang menonjol dari garis tembok.
- source_word: וְעַד
  choice: sampai ke
  rationale: Menandai batas akhir bagian tembok yang diperbaiki.
- source_word: חוֹמַת הָעֹפֶל
  choice: tembok Ofel
  rationale: Konstruksi status constructus diterjemahkan secara alami sebagai tembok yang terkait dengan lokasi Ofel.
- source_word: הָעֹפֶל
  choice: Ofel
  rationale: Nama tempat di Yerusalem ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
