  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'mulai dari ... sampai ke ...' dipilih untuk menyampaikan rentang topografis מִנֶּגֶד ... וְעַד secara jelas; ambiguitas מִדָּה שֵׁנִית dipertahankan melalui catatan kaki.
