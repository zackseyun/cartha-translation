  naturalness: '“Orang-orang Lewi: Rehum anak Bani” merupakan bentuk daftar yang jelas dan wajar dalam bahasa Indonesia modern. “Penguasa atas separuh wilayah Kehila” menyampaikan fungsi administratif tanpa memakai istilah teknis yang kurang perlu.'
  terminology: “Orang-orang Lewi,” “anak,” “melakukan perbaikan,” dan “wilayah” konsisten dengan register naratif-administratif kitab ini. Nama Rehum, Bani, Hasabya, dan Kehila dipertahankan.
