source:
  edition: WLC
  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: id
  text: 'Sesudah dia, orang-orang Lewi: Rehum anak Bani, melakukan perbaikan. Di sebelahnya, Hasabya, penguasa atas separuh wilayah Kehila, melakukan perbaikan untuk wilayahnya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk bagiannya.” Bahasa Ibrani dapat merujuk pada wilayah di bawah wewenang Hasabya atau pada bagian pekerjaan yang ditugaskan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pembangunan tembok, frasa ini menandai urutan sekaligus kedekatan lokasi dengan pekerja yang disebut sebelumnya.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: melakukan perbaikan
  rationale: Bentuk hifil dari חזק secara harfiah berkaitan dengan membuat kuat, tetapi dalam Nehemia 3 menjadi ungkapan untuk mengerjakan perbaikan tembok.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia bagi anggota kelompok Lewi.
- source_word: רְחוּם בֶּן־בָּנִי
  choice: Rehum anak Bani
  rationale: Nama ditransliterasikan dan hubungan genealogis dipertahankan secara langsung.
- source_word: עַל יָדוֹ
  choice: Di sebelahnya
  rationale: Ungkapan harfiah 'pada tangannya' dalam konteks daftar ini menunjukkan lokasi pekerjaan yang berdampingan.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Transliterasi nama Ibrani yang wajar dalam bahasa Indonesia.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: penguasa atas setengah wilayah Kehila
  rationale: שַׂר menunjuk pejabat atau penguasa, sedangkan פֶלֶךְ di sini merupakan satuan wilayah administratif.
- source_word: לְפִלְכּוֹ
  choice: untuk wilayahnya
  rationale: Prefiks ל dapat menunjukkan tanggung jawab atau lingkup pekerjaan; terjemahan ini mempertahankan nuansa administratif tanpa menentukan apakah yang dimaksud wilayah kekuasaan atau bagian pekerjaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula berulang dalam daftar pekerja dipertahankan dengan ungkapan “melakukan perbaikan”; istilah administratif diterjemahkan secara umum agar mudah dipahami.
