base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: id
  text: Di sebelah mereka, orang-orang Tekoa melakukan perbaikan. Namun, para pemuka mereka[a] tidak mau menundukkan tengkuk mereka pada pekerjaan para tuan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang terkemuka mereka” atau “kaum bangsawan mereka.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tidak membawa tengkuk mereka ke dalam pekerjaan para tuan mereka”; suatu ungkapan tentang penolakan untuk tunduk dan ikut bekerja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Di sebelah mereka
  rationale: Ungkapan עַל־יָד dalam daftar pembangunan Nehemia menunjukkan bahwa kelompok berikutnya bekerja pada bagian yang berdekatan.
- source_word: הֶחֱזִיקוּ
  choice: mengadakan perbaikan
  rationale: Dalam konteks Nehemia 3, verba ini menunjuk pada pengerjaan atau pemulihan bagian tembok, bukan sekadar tindakan 'menguatkan' secara umum.
- source_word: הַתְּקוֹעִים
  choice: orang-orang Tekoa
  rationale: Bentuk gentilika ini menyebut penduduk atau orang yang berasal dari Tekoa; bentuk ini lebih wajar dalam bahasa Indonesia daripada transliterasi gentilika.
- source_word: וְאַדִּירֵיהֶם
  choice: para pemuka mereka
  rationale: אַדִּירֵיהֶם menunjuk pada orang-orang terkemuka, berkuasa, atau bangsawan di tengah komunitas mereka. 'Para pemuka' alami dan tidak mengandaikan gelar kebangsawanan resmi.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: tidak mau menundukkan tengkuk
  rationale: Bahasa Ibrani secara harfiah mengatakan bahwa mereka 'tidak membawa tengkuk mereka'; ungkapan ini menggambarkan penolakan untuk tunduk dan ikut memikul pekerjaan. Rumusan Indonesia mempertahankan metafora tengkuk sekaligus menyampaikan unsur penolakan.
- source_word: בַּעֲבֹדַת
  choice: untuk melakukan pekerjaan
  rationale: עֲבֹדָה dalam konteks ini adalah pekerjaan pembangunan bersama, sehingga 'pekerjaan' lebih tepat daripada 'pelayanan' yang dapat terdengar khusus keagamaan.
- source_word: אֲדֹנֵיהֶם
  choice: para penguasa mereka
  rationale: Bentuk Ibrani adalah jamak dan dapat menunjuk pada tuan, atasan, atau orang yang berwenang. 'Para penguasa mereka' mempertahankan rujukan manusia dan hierarki tanpa mengubahnya menjadi gelar ilahi tunggal.
theological_decisions:
- issue: Rujukan אֲדֹנֵיהֶם ('tuan-tuan/penguasa mereka')
  choice: Para penguasa manusia yang berwenang dalam pekerjaan pembangunan
  alternative: Memuluskan frasa itu menjadi 'pekerjaan Tuhan' atau 'pekerjaan bagi Tuhan'
  rationale: Teks Ibrani memakai bentuk jamak dengan sufiks 'mereka'. Terjemahan mempertahankan bentuk dan ketegangan sosial ini, tanpa mengubahnya menjadi rujukan ilahi tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Metafora 'tengkuk' dipertahankan karena penting bagi gambaran sikap membangkang, lalu dijelaskan dalam catatan kaki. Istilah 'para pemuka' dan 'para penguasa' membedakan dua kelompok sosial tanpa memasukkan gelar kelembagaan yang tidak dinyatakan teks.
