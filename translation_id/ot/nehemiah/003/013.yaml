  text: אֵת֩ שַׁ֨עַר הַ/גַּ֜יְא הֶחֱזִ֣יק חָנוּן֮ וְ/יֹשְׁבֵ֣י זָנוֹחַ֒ הֵ֣מָּה בָנ֔וּ/הוּ וַֽ/יַּעֲמִ֨ידוּ֙ דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ/אֶ֤לֶף אַמָּה֙ בַּ/חוֹמָ֔ה עַ֖ד שַׁ֥עַר הָ/שֲׁפֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: id
  text: Hanun bersama penduduk Zanoah memperbaiki Gerbang Lembah.[a] Mereka membangunnya dan memasang daun-daun pintunya, pengunci-penguncinya, serta palang-palangnya. Mereka juga memperbaiki tembok sepanjang seribu hasta[b] sampai ke Gerbang Sampah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperkokoh” Gerbang Lembah; verba Ibraninya dapat berarti membuat kukuh atau memperbaiki dalam konteks pembangunan kembali pada pasal ini.
    reason: lexical_alternative
  - marker: b
    text: Seribu hasta kira-kira 457 meter.
    reason: cultural_note
  - marker: c
    text: Atau “Gerbang Kotoran”; nama Ibraninya dapat menunjuk pada sampah atau kotoran yang dibuang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam konteks pembangunan kembali di Nehemia 3, verba ini menunjuk pada tindakan memperkokoh atau memperbaiki bagian bangunan yang menjadi tanggung jawab seseorang. “Memperbaiki” paling wajar dalam bahasa Indonesia, sementara nuansa “memperkokoh” dicatat dalam catatan kaki.
- source_word: שַׁעַר הַגַּיְא
  choice: Pintu Gerbang Lembah
  rationale: Frasa konstruksi ini merupakan nama sebuah gerbang kota. Bentuk ini mempertahankan unsur “lembah” dan terdengar alami sebagai nama tempat dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: penduduk Zanoah
  rationale: Partisip dari ישב berarti orang-orang yang tinggal di tempat itu. “Penduduk Zanoah” ringkas dan alami.
- source_word: הֵמָּה בָנוּהוּ
  choice: Mereka membangunnya
  rationale: Terjemahan ini mengikuti verba Ibrani “membangun” tanpa secara eksplisit menambahkan unsur “kembali”, meskipun konteks keseluruhan adalah pemulihan kota.
- source_word: וַיַּעֲמִידוּ
  choice: memasang
  rationale: Secara harfiah verba ini berarti membuat berdiri atau menempatkan pada posisinya. Untuk daun pintu dan perangkat pengamannya, “memasang” merupakan padanan Indonesia yang paling alami.
- source_word: דַּלְתֹתָיו
  choice: daun-daun pintunya
  rationale: Bentuk jamak ini menunjuk pada daun atau panel gerbang. “Daun-daun pintunya” lebih tepat daripada sekadar “pintu-pintunya” dalam konteks bangunan gerbang.
- source_word: מַנְעֻלָיו
  choice: pengunci-penguncinya
  rationale: Istilah ini menunjuk pada perangkat untuk mengancing atau mengunci gerbang. “Pengunci” cukup luas untuk tidak memaksakan gambaran kunci modern.
- source_word: בְרִיחָיו
  choice: palang-palangnya
  rationale: Kata ini menunjuk pada palang yang melintang untuk mengamankan gerbang. Padanan tersebut jelas dan lazim dalam bahasa Indonesia.
- source_word: אֶלֶף אַמָּה
  choice: seribu hasta
  rationale: Satuan kuno dipertahankan agar kekhususan teks sumber tidak digantikan oleh konversi modern yang terlampau presisi.
- source_word: בַּחוֹמָה
  choice: tembok itu
  rationale: Dalam rangkaian pekerjaan perbaikan dan keterangan batas “sampai ke”, frasa ini menunjuk pada bentangan tembok yang mereka perbaiki.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Pintu Gerbang Sampah
  rationale: Nama ini kemungkinan berkaitan dengan pembuangan sampah atau kotoran. “Pintu Gerbang Sampah” jelas, langsung, dan sesuai dengan fungsi nama tempat tersebut.
