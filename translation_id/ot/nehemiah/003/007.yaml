  text: וְ/עַל יָדָ֨/ם הֶחֱזִ֜יק מְלַטְיָ֣ה הַ/גִּבְעֹנִ֗י וְ/יָדוֹן֙ הַ/מֵּרֹ֣נֹתִ֔י אַנְשֵׁ֥י גִבְע֖וֹן וְ/הַ/מִּצְפָּ֑ה לְ/כִסֵּ֕א פַּחַ֖ת עֵ֥בֶר הַ/נָּהָֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: id
  text: Di samping mereka, Melatya, orang Gibeon, dan Yadon, orang Meronot, melakukan perbaikan, demikian juga orang-orang Gibeon dan Mizpa yang terkait dengan kedudukan gubernur wilayah Seberang Sungai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk/kepada kursi gubernur wilayah Seberang Sungai.” Hubungan frasa ini tidak pasti; frasa ini dapat menunjuk pada wilayah kekuasaan gubernur atau pada pusat kedudukan maupun kediaman resminya.'
    reason: Mempertahankan ambiguitas sintaksis dan administratif dari לְכִסֵּא פַּחַת עֵבֶר הַנָּהָר tanpa menjadikan salah satu penafsiran sebagai makna pasti dalam teks utama.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Di samping mereka
  rationale: Ungkapan עַל־יָד dalam daftar pembangunan Nehemia 3 menunjukkan letak bersebelahan; pilihan ini wajar dalam bahasa Indonesia dan mempertahankan makna ruangnya.
- source_word: הֶחֱזִיק
  choice: mengadakan perbaikan
  rationale: Dalam konteks Nehemia 3, bentuk ini menunjuk pada pekerjaan memperbaiki atau memperkuat bagian tembok, bukan sekadar memegang atau menguatkan secara umum.
- source_word: מְלַטְיָה
  choice: Melatya
  rationale: Nama pribadi ditransliterasikan dari bentuk Ibrani.
- source_word: הַגִּבְעֹנִי
  choice: orang Gibeon
  rationale: Kata nisbah ini menyatakan asal atau keterkaitan Melatya dengan Gibeon; bentuk 'orang Gibeon' alami dalam bahasa Indonesia.
- source_word: וְיָדוֹן
  choice: dan Yadon
  rationale: Nama pribadi ditransliterasikan, dengan konjungsi Ibrani dipertahankan.
- source_word: הַמֵּרֹנֹתִי
  choice: orang Meronot
  rationale: Kata nisbah ini menyatakan asal atau keterkaitan Yadon dengan Meronot.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: bersama orang-orang Gibeon dan Mizpa
  rationale: Frasa tersebut menunjuk kepada orang-orang dari kedua kota yang turut melakukan pekerjaan; 'bersama' memperjelas hubungan mereka dengan dua tokoh yang disebutkan.
- source_word: לְכִסֵּא פַּחַת
  choice: yang berada di bawah wewenang gubernur
  rationale: Secara harfiah frasa ini berbunyi 'bagi/kepada kursi gubernur'. Dalam konteks administratif Persia, 'kursi' dapat menjadi metonimia bagi kedudukan atau kekuasaan resmi gubernur. Terjemahan utama menyampaikan hubungan administratif tanpa menganggapnya sebagai takhta kerajaan.
- source_word: עֵבֶר הַנָּהָר
  choice: wilayah Seberang Sungai
  rationale: Ini adalah sebutan administratif Persia bagi daerah di sebelah barat Sungai Efrat. 'Wilayah' memperjelas fungsinya, sedangkan nama resminya dipertahankan secara harfiah.
theological_decisions:
- issue: Hubungan frasa לְכִסֵּא dengan orang-orang Gibeon dan Mizpa
  choice: yang berada di bawah wewenang gubernur
  alternative: untuk pusat kedudukan resmi gubernur
  rationale: Bahasa Ibrani memungkinkan frasa itu menunjuk pada yurisdiksi gubernur atas para pekerja atau pada pusat kedudukan resminya. Teks utama memakai pembacaan administratif yang paling alami, sementara catatan kaki mempertahankan kemungkinan lainnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'orang Gibeon/orang Meronot' dipilih daripada istilah etnik bentukan yang kurang alami. 'Seberang Sungai' diperlakukan sebagai nama administratif; catatan kaki menjaga ambiguitas frasa tentang kursi atau wewenang gubernur.
