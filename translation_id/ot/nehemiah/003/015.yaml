  to: Salun anak Kol-Hoze, kepala wilayah Mizpa, memperbaiki Gerbang Mata Air. Dialah yang membangunnya kembali dan memasang atapnya. Ia memasang pintu-pintunya, kunci-kuncinya, dan palang-palangnya.[a] Ia juga memperbaiki tembok Kolam Syelah[b] di dekat taman raja, sampai ke tangga yang menurun dari Kota Daud.
