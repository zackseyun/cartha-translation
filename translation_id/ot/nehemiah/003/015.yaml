  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: id
  text: Salun anak Kol-Hoze, kepala wilayah Mizpa, memperbaiki Gerbang Mata Air. Dialah yang membangunnya kembali dan memasang atapnya. Ia memasang pintu-pintunya, kunci-kuncinya, dan palang-palangnya.[a] Ia juga memperbaiki tembok Kolam Syelah[b] di dekat taman raja, sampai ke tangga yang menurun dari Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tertulis “mereka memasang”, tetapi menurut tradisi pembacaan teks itu dibaca “ia memasang”.
    reason: textual_variant
  - marker: b
    text: Atau “Kolam Siloah”, yang secara tradisional dikaitkan dengan Siloam. Nama Ibrani di sini ialah Syelah.
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Pintu Gerbang Mata Air
  rationale: עַיִן dapat berarti mata air sebagai sumber air. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks topografi serta sistem air Yerusalem.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam Nehemia 3, verba ini digunakan secara idiomatis untuk pekerjaan perbaikan tembok atau gerbang; 'memperbaiki' menyampaikan fungsi kontekstualnya dengan jelas.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: kepala wilayah Mizpa
  rationale: שַׂר menyatakan pemimpin atau pejabat, sedangkan פֶּלֶךְ ialah wilayah administratif. 'Kepala wilayah' jelas tanpa menentukan jabatan yang lebih khusus daripada teks.
- source_word: הוּא יִבְנֶנּוּ
  choice: Dialah yang membangunnya kembali
  rationale: Kata ganti הוּא memberi penekanan pada pelaku. Dalam konteks pemugaran, 'membangunnya kembali' lebih tepat daripada sekadar 'membangunnya'.
- source_word: וִיטַלְלֶנּוּ
  choice: memasang atapnya
  rationale: Verba טלל di sini menunjuk pada penutupan atau pemberian atap pada bangunan gerbang. Pilihan ini jelas dan alami dalam konteks arsitektur.
- source_word: דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: daun-daun pintu, pengancing, dan palang-palangnya
  rationale: דְּלָתוֹת adalah daun pintu gerbang; מַנְעֻלִים menunjuk perangkat pengancing, sedangkan בְּרִיחִים adalah palang pengaman. Pembedaan ini mempertahankan tiga unsur yang disebut dalam teks.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: tembok Kolam Syelah
  rationale: בְּרֵכָה berarti kolam, dan הַשֶּׁלַח dipertahankan sebagai nama tempat menurut bentuk Ibraninya. Nama tradisional yang lebih dikenal dijelaskan dalam catatan kaki.
- source_word: לְגַן הַמֶּלֶךְ
  choice: di dekat taman raja
  rationale: Dalam uraian topografis ini, לְ menyatakan hubungan lokasi. 'Di dekat' alami dalam bahasa Indonesia sambil menghindari kepastian berlebihan mengenai hubungan spasial yang tepat.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדֹת
  choice: sampai ke tangga yang menurun
  rationale: מַעֲלוֹת dapat berarti undakan atau tangga, dan partisipel הַיּוֹרְדֹת menjelaskan bahwa tangga itu menurun.
- source_word: מֵעִיר דָּוִיד
  choice: dari Kota Daud
  rationale: Preposisi מִן menyatakan asal atau titik pangkal; 'dari Kota Daud' mempertahankan hubungan geografis tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah secukupnya agar daftar pekerjaan bangunan mudah dipahami. Nama-nama ditransliterasikan secara dekat dari bentuk Ibrani, dan ketidakselarasan bentuk tertulis serta bentuk baca pada verba pemasangan dicatat tanpa mengganggu teks utama.
