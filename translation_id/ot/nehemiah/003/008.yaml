revisions:
- from: Di sebelahnya, Uziel bin Harhaya, seorang tukang emas, memperbaiki tembok. Di sebelahnya, Hananya, seorang peramu wewangian, juga memperbaiki tembok. Mereka memulihkan Yerusalem sampai ke Tembok Lebar.[a]
  to: Di sebelahnya, Uziel bin Harhaya, seorang tukang emas, melakukan perbaikan. Di sebelahnya, Hananya, anak seorang peramu wewangian, melakukan perbaikan. Mereka memulihkan Yerusalem sampai ke Tembok Lebar.[a]
  rationale: Revisi memulihkan unsur kekerabatan yang eksplisit bagi Hananya, menghindari penambahan objek "tembok" pada verba yang tidak menyatakannya, dan memperjelas alternatif leksikal dalam catatan kaki. Pembacaan kontekstual "memulihkan" untuk verba yang sulit tetap dipertahankan, dengan ambiguitasnya ditandai dalam catatan kaki.
