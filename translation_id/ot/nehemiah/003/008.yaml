base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: id
  text: Di sebelahnya, Uziel bin Harhaya, seorang tukang emas, melakukan perbaikan. Di sebelahnya, Hananya, anak seorang peramu wewangian, melakukan perbaikan. Mereka memulihkan Yerusalem sampai ke Tembok Lebar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka meninggalkan Yerusalem sampai ke Tembok Lebar.” Kata kerja Ibrani ini biasanya berarti “meninggalkan”, tetapi dalam konteks pembangunan kembali ini sering dipahami sebagai “memulihkan” atau “memperbaiki”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: di sebelahnya
  rationale: Dalam daftar pembangunan kembali di Nehemia 3, ungkapan ini menunjukkan letak pekerjaan seseorang bersebelahan dengan bagian sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan ruangnya.
- source_word: הֶחֱזִיק
  choice: memperbaiki tembok
  rationale: Dalam konteks pasal ini, bentuk hifil verba tersebut menunjuk pada keterlibatan dalam pekerjaan perbaikan. Objek 'tembok' dibuat tersurat agar maknanya jelas dalam bahasa Indonesia, sesuai konteks rangkaian perbaikan tembok kota.
- source_word: צֹרְפִים
  choice: seorang tukang emas
  rationale: Bentuk jamak ini menyatakan kelompok profesi yang menaungi Uziel. 'Tukang emas' adalah sebutan pekerjaan yang jelas dan lazim, meskipun kata Ibraninya juga dapat mencakup pengolah atau pemurni logam mulia.
- source_word: הָרַקָּחִים
  choice: seorang peramu wewangian
  rationale: Istilah ini menunjuk pada kelompok pembuat campuran harum, termasuk minyak wangi atau rempah-rempah. 'Peramu wewangian' lebih tepat daripada istilah modern 'apoteker' dan lebih luas daripada sekadar penjual parfum.
- source_word: וַיַּעַזְבוּ
  choice: mereka memulihkan
  rationale: Makna biasa verba ini adalah 'meninggalkan' atau 'membiarkan', tetapi dalam konteks daftar pembangunan kembali, banyak penafsir memahaminya sebagai pemulihan atau perbaikan pertahanan Yerusalem. Karena bacaan Ibraninya tetap sulit, alternatif harfiahnya dipertahankan dalam catatan kaki.
- source_word: יְרוּשָׁלַםִ
  choice: Yerusalem
  rationale: Teks Ibrani menyebut kota itu sendiri, kemungkinan sebagai metonimia bagi pertahanannya. Terjemahan tidak menggantinya dengan 'tembok Yerusalem'.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: sampai ke Tembok Lebar
  rationale: Frasa ini tampaknya merupakan nama suatu bagian pertahanan kota. Huruf kapital menandai nama tempat tersebut sambil mempertahankan arti kata sifat Ibraninya.
