translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan pola 'Di sebelahnya' dipertahankan untuk mencerminkan susunan daftar kerja dalam teks Ibrani. 'Peramu wewangian' dipilih untuk menghindari kesan bahwa profesi kuno tersebut sama dengan penjual parfum atau apoteker modern.
