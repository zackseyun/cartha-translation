base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: id
  text: Palal anak Uzai melakukan perbaikan berhadapan dengan sudut[a] dan menara yang menjorok keluar dari rumah raja yang di atas[b], yang terletak di dekat pelataran penjagaan[c]. Sesudah dia, Pedaya anak Paros melakukan perbaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pojok.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “istana bagian atas.” Secara harfiah: “rumah raja yang di atas.”'
    reason: lexical_alternative
  - marker: c
    text: Atau “pelataran tahanan.” Istilah Ibraninya dapat menunjuk pada pelataran yang dijaga dan digunakan untuk menahan orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: berhadapan dengan
  rationale: Ungkapan ini menyatakan letak bagian yang diperbaiki terhadap suatu penanda tempat. “Berhadapan dengan” mempertahankan makna spasial tanpa menentukan jarak secara berlebihan.
- source_word: הַמִּקְצוֹעַ
  choice: sudut
  rationale: Kata ini menunjuk pada sudut atau pojok suatu tembok maupun bangunan. “Sudut” wajar dalam konteks arsitektur dan tidak menyiratkan adanya menara sudut tersendiri.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: menara yang menjorok keluar
  rationale: Partisip dari יצא menggambarkan menara yang memanjang atau menonjol ke luar dari kompleks bangunan; ungkapan ini jelas bagi pembaca umum.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: dari kediaman raja bagian atas
  rationale: “Kediaman raja” mempertahankan arti dasar בית sekaligus menunjukkan bangunan kerajaan. “Bagian atas” menerjemahkan הָעֶלְיוֹן tanpa memastikan apakah yang dimaksud ialah tingkat atas atau kompleks yang letaknya lebih tinggi.
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: yang terletak di dekat pelataran penjagaan
  rationale: Frasa ini menyatakan hubungan lokasi dengan sebuah pelataran yang dijaga. “Pelataran penjagaan” menghindari penegasan bahwa tempat itu pasti penjara, meskipun fungsi penahanan mungkin tercakup.
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pembangunan ini, rumus tersebut memperkenalkan pekerja berikutnya dalam urutan pekerjaan.
- source_word: פָּלָל / אוּזַי / פְּדָיָה / פַּרְעֹשׁ
  choice: Palal / Uzai / Pedaya / Paros
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang wajar dan telah dikenal dalam bahasa Indonesia.
- source_word: '[verba yang dielipsiskan pada kedua klausa]'
  choice: memperbaiki bagian / memperbaiki bagian berikutnya
  rationale: Teks Ibrani mengandalkan verba dari konteks daftar perbaikan. Verba dan objek generik dilengkapi agar kalimat bahasa Indonesia utuh, tanpa menentukan secara sempit apakah objeknya hanya tembok atau unsur bangunan lain.
