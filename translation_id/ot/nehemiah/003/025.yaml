revisions:
- from: Palal anak Uzai memperbaiki bagian yang berhadapan dengan sudut[a] dan menara yang menjorok keluar dari kediaman raja bagian atas[b], yang terletak di dekat pelataran penjagaan[c]. Sesudah dia, Pedaya anak Paros memperbaiki bagian berikutnya.
  to: Palal anak Uzai melakukan perbaikan berhadapan dengan sudut[a] dan menara yang menjorok keluar dari rumah raja yang di atas[b], yang terletak di dekat pelataran penjagaan[c]. Sesudah dia, Pedaya anak Paros melakukan perbaikan.
  rationale: Revisi menghapus tambahan “bagian berikutnya” dan memakai “melakukan perbaikan” untuk mencerminkan verba yang dipahami dari konteks tanpa menambahkan objek yang tidak disebutkan. Frasa “rumah raja yang di atas” dipilih sebagai padanan yang lebih dekat dan alami untuk “rumah raja bagian atas,” tanpa memastikan apakah “atas” berarti tingkat bangunan atau lokasi kompleks.
