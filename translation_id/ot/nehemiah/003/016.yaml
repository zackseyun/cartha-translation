translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga kali 'sampai' dipertahankan untuk mencerminkan batas-batas pekerjaan dalam teks Ibrani. Istilah administratif dibuat jelas tanpa memperbesar skala wilayah.
