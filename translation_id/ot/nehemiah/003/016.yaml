  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: id
  text: Sesudah dia,[a] Nehemia anak Azbuk, penguasa atas setengah wilayah Bet-Zur, melakukan perbaikan hingga berhadapan dengan makam-makam Daud, hingga ke kolam yang dibuat itu, dan hingga ke rumah para pahlawan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Di sebelahnya," jika frasa ini dipahami secara spasial, bukan sebagai urutan dalam daftar perbaikan.
    reason: lexical_alternative
  - marker: b
    text: Atau "rumah para pejuang." Ungkapan Ibrani ini mungkin menunjuk pada sebuah bangunan militer, tetapi identifikasi tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pekerjaan pada Nehemia 3, frasa ini biasanya menunjukkan urutan pekerja atau bagian yang dikerjakan. Terjemahan ini mempertahankan urutan tersebut, meskipun makna spasial 'di sebelahnya' juga mungkin.
- source_word: הֶחֱזִיק
  choice: memperbaiki tembok
  rationale: Bentuk Hifil dari חזק merupakan ungkapan khas dalam pasal ini bagi pekerjaan memperbaiki atau memulihkan tembok. Objek 'tembok' dibuat tersurat agar maksudnya jelas dalam bahasa Indonesia.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: penguasa atas setengah wilayah
  rationale: שַׂר menunjuk pejabat pemerintahan atau penguasa, sedangkan פֶּלֶךְ dalam konteks administrasi zaman Persia adalah suatu wilayah administratif.
- source_word: בֵּית צוּר
  choice: Bet-Zur
  rationale: Nama tempat dialihaksarakan menurut bentuk yang lazim dan tidak diterjemahkan secara harfiah.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: sampai ke depan makam-makam Daud
  rationale: נֶגֶד menyatakan posisi berhadapan, di depan, atau di seberang. 'Ke depan' menyampaikan hubungan spasial tanpa menyiratkan bahwa pekerjaan mencapai atau memasuki kawasan makam.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: kolam buatan
  rationale: Ungkapan itu secara harfiah berarti 'kolam yang dibuat'. 'Kolam buatan' mempertahankan gagasan bahwa kolam tersebut merupakan hasil konstruksi tanpa menentukan teknik pembangunannya.
- source_word: בֵּית הַגִּבֹּרִים
  choice: rumah para kesatria
  rationale: גִּבֹּרִים dapat berarti orang-orang perkasa atau para pejuang. 'Para kesatria' menyampaikan kelompok pejuang terkemuka, sementara jenis bangunannya dibiarkan tidak pasti.
