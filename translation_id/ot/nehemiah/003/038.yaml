  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: id
  text: Kami membangun kembali tembok itu, dan seluruh tembok itu tersambung sampai setengah tingginya, sebab rakyat itu bertekad untuk bekerja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ada hati pada rakyat untuk melakukan.” Ungkapan ini menyatakan bahwa mereka bertekad dan rela mengerjakan pekerjaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Demikianlah kami membangun kembali
  rationale: Bentuk wayyiqtol orang pertama jamak melanjutkan rangkaian kisah. “Membangun kembali” sesuai dengan konteks pemulihan tembok Yerusalem, sedangkan “demikianlah” menghubungkan hasil ini dengan uraian sebelumnya secara alami.
- source_word: הַחוֹמָה
  choice: tembok itu
  rationale: חוֹמָה menunjuk pada tembok kota yang sudah diketahui dalam konteks; bentuk definitnya wajar diterjemahkan “tembok itu”.
- source_word: וַתִּקָּשֵׁר
  choice: tersambung
  rationale: Bentuk Nifal dari קשר menggambarkan bagian-bagian tembok yang telah terhubung menjadi satu rangkaian; “tersambung” mempertahankan nuansa pasif-resultatif secara ringkas.
- source_word: כָּל הַחוֹמָה
  choice: seluruh tembok itu
  rationale: כָּל dengan nomina definit menyatakan keseluruhan tembok.
- source_word: עַד חֶצְיָהּ
  choice: sampai setengah tingginya
  rationale: Secara harfiah berarti “sampai setengahnya”. Dalam konteks pembangunan tembok, yang dimaksud paling mungkin adalah setengah tinggi tembok; penyebutan “tingginya” membuat maksud tersebut jelas dalam bahasa Indonesia.
- source_word: וַיְהִי לֵב לָעָם
  choice: sebab rakyat itu memiliki hati
  rationale: Ungkapan Ibrani secara harfiah menggambarkan adanya “hati” pada rakyat, yakni tekad dan kerelaan batin. Metafora hati dipertahankan, dan “sebab” menyatakan hubungan kausal dengan kemajuan pembangunan.
- source_word: לַעֲשׂוֹת
  choice: untuk bekerja
  rationale: עשה pada dasarnya berarti “melakukan/mengerjakan”; dalam konteks pembangunan ini, “bekerja” merupakan padanan alami dan tepat.
