reference: Nehemiah 3:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַל תְּכַס֙ עַל עֲוֺנָ֔/ם וְ/חַטָּאתָ֖/ם מִ/לְּ/פָנֶ֣י/ךָ אַל תִּמָּחֶ֑ה כִּ֥י הִכְעִ֖יסוּ לְ/נֶ֥גֶד הַ/בּוֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: id
  text: Janganlah Engkau menutupi kesalahan mereka[a], dan janganlah dosa mereka dihapus dari hadapan-Mu. Sebab mereka telah membangkitkan amarah di hadapan orang-orang yang membangun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “janganlah Engkau mengampuni kedurhakaan mereka.” Gambaran harfiah dalam bahasa Ibrani ialah “janganlah Engkau menutupi kesalahan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab mereka telah membangkitkan murka-Mu di hadapan orang-orang yang membangun.” Teks Ibrani tidak menyatakan objek amarah itu secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: menutupi kesalahan mereka
  rationale: Ungkapan ini dapat bermakna menutupi dalam arti tidak memperhitungkan atau mengampuni. Terjemahan ini mempertahankan gambaran Ibrani tanpa mengaburkan maksud permohonannya.
- source_word: עֲוֺנָם
  choice: kesalahan mereka
  rationale: עָוֹן dapat menunjuk pada kejahatan sekaligus kesalahan atau tanggungannya. Dalam kesejajaran dengan 'dosa mereka', 'kesalahan' mempertahankan bobot moralnya dengan bahasa Indonesia yang wajar.
- source_word: חַטָּאתָם
  choice: dosa mereka
  rationale: חַטָּאת secara langsung berarti dosa dan membentuk kesejajaran dengan עֲוֺנָם.
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapan-Mu
  rationale: Terjemahan ini mempertahankan gambaran spasial dan relasional tentang dosa yang tidak dihapus dari hadapan Allah.
- source_word: תִּמָּחֶה
  choice: dihapus
  rationale: מחה berarti menghapus atau melenyapkan, khususnya dari catatan atau ingatan. 'Dihapus' alami dalam bahasa Indonesia dan sesuai dengan citra sumber.
- source_word: הִכְעִיסוּ
  choice: telah membangkitkan amarah
  rationale: Bentuk kausatif ini berarti menimbulkan atau membangkitkan amarah. Karena teks Ibrani tidak menyebutkan objeknya secara eksplisit, terjemahan ini juga tidak menambahkannya.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: di hadapan orang-orang yang membangun
  rationale: לְנֶגֶד terutama berarti di depan atau di hadapan. Pilihan ini mempertahankan nuansa bahwa tindakan itu dilakukan secara terbuka di depan para pembangun.
theological_decisions:
- issue: Bahasa doa kutukan mengenai dosa para musuh
  choice: Mempertahankan permohonan langsung agar Allah tidak menutupi kesalahan atau menghapus dosa mereka.
  alternative: Melunakkan menjadi 'jangan abaikan kesalahan mereka'.
  rationale: Teks Ibrani menyampaikan permohonan yang keras secara eksplisit. Ketegangan teologisnya dipertahankan tanpa pelunakan atau penjelasan doktrinal tambahan.
- issue: Objek dari tindakan membangkitkan amarah
  choice: Tidak menyebutkan secara eksplisit siapa yang dibuat marah.
  alternative: Menerjemahkan 'mereka telah membangkitkan murka-Mu'.
  rationale: Objek tidak dinyatakan dalam teks Ibrani. Walaupun Allah sangat mungkin dimaksudkan dalam konteks doa, terjemahan utama mempertahankan ketakterangan gramatikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur paralel dan kerasnya doa dipertahankan; istilah teknis atau arkais dihindari.
