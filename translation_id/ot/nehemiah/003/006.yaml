base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: id
  text: Yoyada anak Paseah dan Mesulam anak Besodeya memperbaiki Gerbang Lama.[a] Mereka memasang balok-baloknya, lalu memasang pintu-pintunya, kunci-kuncinya, dan palang-palangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “Gerbang Yesana”, jika kata kedua dipahami sebagai nama tempat, bukan kata sifat “lama”.
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: memperbaiki
  rationale: Dalam daftar pekerjaan di Nehemia 3, verba ini mengacu pada tindakan menangani dan memulihkan suatu bagian bangunan; “memperbaiki” paling alami dalam bahasa Indonesia.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Gerbang Lama
  rationale: Frasa ini paling wajar dipahami sebagai nama gerbang dengan הַיְשָׁנָה bermakna “lama”; kemungkinan bahwa unsur kedua adalah nama tempat dipertahankan dalam catatan kaki.
- source_word: קֵרֻהוּ
  choice: memasang balok-baloknya
  rationale: Verba קרה menunjuk pada pemberian penutup atau atap dengan balok. Dalam konteks bangunan gerbang, ungkapan ini menyampaikan pekerjaan pertukangan tanpa menyiratkan lebih dari yang dinyatakan teks.
- source_word: וַיַּעֲמִידוּ
  choice: lalu memasang
  rationale: Secara harfiah berarti membuat berdiri atau menempatkan pada posisinya; “memasang” merupakan padanan alami untuk komponen gerbang, sedangkan “lalu” mencerminkan urutan wayyiqtol.
- source_word: דַּלְתֹתָיו
  choice: pintu-pintunya
  rationale: Bentuk jamak cocok dengan daun-daun pintu pada sebuah gerbang dan mempertahankan pembedaan antara keseluruhan gerbang dan pintunya.
- source_word: מַנְעֻלָיו
  choice: pengancing-pengancingnya
  rationale: Istilah ini menunjuk pada perangkat pengikat atau pengunci gerbang. “Pengancing” cukup konkret namun tidak memaksakan gambaran kunci modern.
- source_word: בְרִיחָיו
  choice: palang-palangnya
  rationale: Istilah ini lazim menunjuk pada palang yang digunakan untuk mengamankan pintu atau gerbang dan dibedakan dari balok struktur yang disebut sebelumnya.
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina itu menegaskan bahwa kedua orang yang disebutlah pelaku pekerjaan berikutnya; “Mereka” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: יֽוֹיָדָע ... וּמְשֻׁלָּם
  choice: Yoyada ... dan Mesulam
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: פָּסֵחַ / בְּסוֹדְיָה
  choice: Paseah / Besodeya
  rationale: Nama patronimik ditransliterasikan, bukan diterjemahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “memasang” dipertahankan demi kejelasan dua tahap pekerjaan yang berbeda. Semua sufiks orang ketiga pada komponen gerbang diterjemahkan dengan -nya.
