  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר שָׁמַ֣ע סַנְבַלַּ֗ט כִּֽי אֲנַ֤חְנוּ בוֹנִים֙ אֶת הַ֣/חוֹמָ֔ה וַ/יִּ֣חַר ל֔/וֹ וַ/יִּכְעַ֖ס הַרְבֵּ֑ה וַ/יַּלְעֵ֖ג עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/033.yaml
  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: id
  text: Ketika Sanbalat mendengar bahwa kami sedang membangun kembali tembok itu, ia menjadi marah dan sangat geram, lalu mengejek orang-orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yehuda.” Istilah Ibrani ini dapat menunjuk pada penduduk Yehuda secara kewilayahan maupun pada orang Yahudi dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif ini memperkenalkan perkembangan baru. “Ketika” menyampaikan hubungan waktunya secara alami tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: שָׁמַע
  choice: mendengar
  rationale: Makna dasarnya ialah “mendengar”; dalam konteks ini, Sanbalat menerima kabar tentang pekerjaan tersebut.
- source_word: סַנְבַלַּט
  choice: Sanbalat
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: bahwa kami sedang membangun kembali
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung. “Membangun kembali” sesuai dengan konteks pemulihan tembok Yerusalem yang telah rusak.
- source_word: הַחוֹמָה
  choice: tembok itu
  rationale: Kata ini berarti tembok pertahanan; konteks telah menunjuk pada tembok Yerusalem, sehingga “tembok itu” jelas dan alami.
- source_word: וַיִּחַר לוֹ
  choice: ia menjadi marah
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan kemarahan yang menyala; terjemahan ini menyampaikan maknanya dengan jelas dalam bahasa Indonesia modern.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: dan sangat geram
  rationale: Kata kerja kemarahan kedua beserta kata penguatnya meningkatkan intensitas ungkapan pertama tanpa mengulang kata “marah” secara datar.
- source_word: וַיַּלְעֵג
  choice: lalu mengejek
  rationale: Kata kerja ini menunjuk pada ucapan yang mencemooh atau merendahkan. “Mengejek” ringkas, alami, dan cukup kuat.
- source_word: עַל הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Istilah ini dapat menunjuk pada orang Yahudi secara lebih luas maupun penduduk Yehuda secara kewilayahan. “Orang-orang Yahudi” paling mudah dikenali dalam konteks ini, sedangkan nuansa alternatif dipertahankan dalam catatan kaki.
