  register: Bahasa Indonesia baku, lugas, dan bermartabat. Struktur berulang dipertahankan untuk mencerminkan pola daftar pekerjaan dalam teks Ibrani. Kata “anak” dipilih daripada “bin” agar mudah dipahami secara luas, dan objek seperti “tembok” tidak dimasukkan ke dalam teks utama karena tidak disebutkan secara eksplisit dalam ayat ini.
