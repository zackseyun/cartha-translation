  text: וְ/עַל יָדָ֣/ם הֶחֱזִ֗יק מְרֵמ֤וֹת בֶּן אוּרִיָּה֙ בֶּן הַקּ֔וֹץ וְ/עַל יָדָ֣/ם הֶחֱזִ֔יק מְשֻׁלָּ֥ם בֶּן בֶּרֶכְיָ֖ה בֶּן מְשֵׁיזַבְאֵ֑ל וְ/עַל יָדָ֣/ם הֶֽחֱזִ֔יק צָד֖וֹק בֶּֽן בַּעֲנָֽא־־־ס־־־ס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: id
  text: Di sebelah mereka[b], Meremot anak Uria, anak Hakos, memperbaiki[a]. Di sebelah mereka, Mesulam anak Berekhya, anak Mesyezabeel, memperbaiki. Di sebelah mereka, Zadok anak Baana memperbaiki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperkuat.” Dalam pasal ini, kata Ibrani tersebut merupakan istilah yang berulang untuk pekerjaan memperbaiki bagian tembok atau pintu gerbang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di sisi tangan mereka,” suatu ungkapan Ibrani yang berarti “di sebelah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Di sebelah mereka
  rationale: Ungkapan Ibrani yang secara harfiah berarti “dan di sisi tangan mereka” berfungsi sebagai penanda letak yang bersebelahan dalam urutan pekerjaan pembangunan.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam pola kalimat di Nehemia 3, verba ini menyatakan pekerjaan memperkuat atau memperbaiki bagian bangunan. “Memperbaiki” alami dalam bahasa Indonesia dan tidak menambahkan objek yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: בֶּן
  choice: anak
  rationale: Dalam catatan silsilah singkat ini, makna langsung “anak” paling sesuai; konteks tidak menuntut makna yang lebih luas seperti “keturunan”.
- source_word: מְרֵמוֹת / אוּרִיָּה / הַקּוֹץ
  choice: Meremot / Uria / Hakos
  rationale: Nama-nama pribadi dialihaksarakan menurut bentuk yang wajar dan sudah dikenal dalam bahasa Indonesia.
- source_word: מְשֻׁלָּם / בֶּרֶכְיָה / מְשֵׁיזַבְאֵל
  choice: Mesulam / Berekhya / Mesezabeel
  rationale: Nama-nama pribadi dialihaksarakan secara dekat dengan bentuk Ibraninya sekaligus tetap mudah dibaca oleh pembaca Indonesia.
- source_word: צָדוֹק / בַּעֲנָא
  choice: Zadok / Baana
  rationale: Nama-nama pribadi dialihaksarakan, bukan diterjemahkan.
theological_decisions: []
