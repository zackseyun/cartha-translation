source:
  edition: WLC
  text: אחרי הֶחֱזִ֗יק מַלְכִּיָּה֙ בֶּן הַ/צֹּ֣רְפִ֔י עַד בֵּ֥ית הַ/נְּתִינִ֖ים וְ/הָ/רֹכְלִ֑ים נֶ֚גֶד שַׁ֣עַר הַ/מִּפְקָ֔ד וְ/עַ֖ד עֲלִיַּ֥ת הַ/פִּנָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: id
  text: Sesudah dia, Malkia anak tukang emas memperbaiki bagian sampai ke rumah para pelayan Bait Allah dan para pedagang, di depan Gerbang Pemeriksaan[a], dan sampai ke ruang atas di sudut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Gerbang Pendataan atau Gerbang Pengerahan. Makna nama Ibraninya tidak pasti.'
    reason: Kata מִפְקָד mempunyai rentang makna pemeriksaan, pendataan, pengerahan, atau penugasan; catatan ini mempertahankan ambiguitas nama gerbang.
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam konteks daftar pekerjaan pada tembok Yerusalem, bentuk ini menyatakan tindakan memperbaiki atau memperkuat bagian bangunan; “memperbaiki” paling alami dan konsisten dalam bahasa Indonesia.
- source_word: הַצֹּרְפִי
  choice: tukang emas
  rationale: Kata ini menunjuk kepada perajin atau pemurni logam mulia. Dalam konteks profesi Malkia, “tukang emas” merupakan padanan yang ringkas dan lazim.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini adalah sebutan bagi kelompok yang ditugaskan melayani pekerjaan tempat ibadah. Padanan fungsional ini lebih mudah dipahami daripada transliterasi, tanpa menambahkan status teologis tertentu.
- source_word: הָרֹכְלִים
  choice: para pedagang
  rationale: Bentuk jamak ini merujuk kepada pedagang, kemungkinan pedagang keliling; padanan umum “para pedagang” mempertahankan makna tanpa mempersempitnya.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Gerbang Pemeriksaan
  rationale: מִפְקָד dapat berkaitan dengan pemeriksaan, pendataan, pengerahan, atau penugasan. “Gerbang Pemeriksaan” mengikuti arti yang paling langsung sambil mempertahankan ketidakpastian melalui catatan kaki.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: ruang atas di sudut
  rationale: עֲלִיָּה menunjuk ruang atau kamar di bagian atas, sedangkan הַפִּנָּה berarti sudut. Ungkapan ini diterjemahkan secara konkret tanpa menambahkan “tembok”, yang tidak dinyatakan dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “rumah para pelayan Bait Allah dan para pedagang” mempertahankan koordinasi dalam teks Ibrani tanpa memutuskan apakah kedua kelompok memakai satu bangunan atau bangunan yang berdekatan.
