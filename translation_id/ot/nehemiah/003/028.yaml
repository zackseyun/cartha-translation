  text: Above the Horse Gate[a], the priests made repairs, each one opposite his own house.
translation:
  language: id
  text: Di atas Gerbang Kuda[a], para imam melakukan perbaikan, masing-masing di hadapan rumahnya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "gerbang kuda-kuda."
    reason: Alternatif harfiah untuk rangkaian konstruksi Ibrani, selain pembacaan "Gerbang Kuda" sebagai nama gerbang.
lexical_decisions:
- source_word: מֵעַל
  choice: Di sebelah atas
  rationale: Menunjukkan lokasi bagian tembok ini relatif terhadap bagian sebelumnya; ungkapan ini mempertahankan arah spasial tanpa menyiratkan bahwa para pekerja berada tepat di atas gerbang.
- source_word: שַׁעַר הַסּוּסִים
  choice: Gerbang Kuda
  rationale: Rangkaian konstruksi Ibrani ini paling alami diperlakukan sebagai nama tempat dalam bahasa Indonesia.
- source_word: הֶחֱזִיקוּ
  choice: mengadakan perbaikan
  rationale: Dalam konteks daftar pembangunan Nehemia 3, verba ini mengacu pada pengerjaan atau pelaksanaan perbaikan, bukan sekadar tindakan memperkuat.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak tentu diterjemahkan secara langsung dan alami.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Nomina tunggal ini berfungsi distributif, yaitu setiap orang dari kelompok para imam.
- source_word: לְנֶגֶד
  choice: di depan
  rationale: Menunjukkan bagian tembok yang berada tepat di hadapan atau berseberangan dengan rumah masing-masing; 'di depan' paling alami dalam konteks ini.
- source_word: בֵּיתוֹ
  choice: rumahnya sendiri
  rationale: Akhiran orang ketiga tunggal mengikuti pemakaian distributif אִישׁ; 'sendiri' memperjelas bahwa setiap imam bekerja di depan rumahnya masing-masing.
