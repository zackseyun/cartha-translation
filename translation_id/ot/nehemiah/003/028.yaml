  register: Bahasa Indonesia baku, modern, dan lugas. 'Mengadakan perbaikan' mempertahankan nuansa kegiatan pembangunan, sedangkan 'masing-masing di depan rumahnya sendiri' menyampaikan susunan distributif teks Ibrani secara alami.
