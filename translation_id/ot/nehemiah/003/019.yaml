id: NEH.3.19
reference: Nehemiah 3:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְחַזֵּ֨ק עַל יָד֜/וֹ עֵ֧זֶר בֶּן יֵשׁ֛וּעַ שַׂ֥ר הַ/מִּצְפָּ֖ה מִדָּ֣ה שֵׁנִ֑ית מִ/נֶּ֕גֶד עֲלֹ֥ת הַ/נֶּ֖שֶׁק הַ/מִּקְצֹֽעַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: id
  text: Di sebelahnya, Ezer bin Yesua, pejabat Mizpa, memperbaiki bagian lain[a], berhadapan dengan jalan naik menuju gudang senjata[b] di sudut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian kedua”. Frasa Ibrani ini dapat menekankan bahwa Ezer memperbaiki satu ruas tembok tambahan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tempat persenjataan” atau “senjata-senjata”. Kata Ibrani ini mungkin merujuk di sini pada tempat penyimpanan senjata.
    reason: lexical_alternative
  - marker: c
    text: Atau “belokan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: memperbaiki
  rationale: Dalam konteks Nehemia 3, verba ini mengacu pada pekerjaan membangun kembali atau memperkuat tembok; “memperbaiki” menyampaikan fungsi kontekstualnya secara alami.
- source_word: עַל יָדוֹ
  choice: Di sebelahnya
  rationale: Ungkapan ini menandai letak pekerjaan yang berdampingan dalam urutan para pekerja.
- source_word: שַׂר הַמִּצְפָּה
  choice: pejabat Mizpa
  rationale: שַׂר menunjukkan seorang pemimpin atau pemegang jabatan pemerintahan; “pejabat” tidak mengesankan jabatan kerajaan yang tidak dinyatakan teks.
- source_word: מִדָּה שֵׁנִית
  choice: bagian lain
  rationale: Frasa ini kemungkinan menunjuk pada ruas tambahan yang diperbaiki Ezer. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan alternatif harfiah “bagian kedua” dalam catatan kaki.
- source_word: מִנֶּגֶד
  choice: berhadapan dengan
  rationale: Preposisi ini menunjukkan lokasi yang menghadap atau berada di seberang suatu penanda tempat.
- source_word: עֲלֹת
  choice: jalan naik menuju
  rationale: Bentuk dari עלה dipakai sebagai nomina untuk jalur atau akses yang menanjak; ungkapan ini jelas dan alami bagi pembaca modern.
- source_word: הַנֶּשֶׁק
  choice: gudang senjata
  rationale: Nomina ini dapat berarti persenjataan, tetapi dalam keterangan topografis ini kemungkinan menunjuk pada tempat penyimpanan senjata.
- source_word: הַמִּקְצֹעַ
  choice: sudut
  rationale: Kata ini menunjuk pada sudut atau belokan dalam struktur tembok; “sudut” merupakan padanan arsitektural yang alami.
theological_decisions: []
