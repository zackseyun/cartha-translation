  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: id
  text: Sesudah dia, Zadok anak Imer melakukan perbaikan di depan rumahnya.[a] Sesudah dia, Semaya anak Sekhanya, penjaga Gerbang Timur,[b] melakukan perbaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di seberang rumahnya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “pengawas Gerbang Timur.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Formula ini menandai urutan para pekerja dan bagian pekerjaan dalam daftar perbaikan; terjemahan ini alami sekaligus dekat dengan bentuk Ibrani.
- source_word: הֶחֱזִיק
  choice: memperbaiki bagian
  rationale: Bentuk hifil dari חזק secara harfiah berkaitan dengan menguatkan, tetapi dalam konteks Nehemia 3 merupakan ungkapan untuk mengerjakan perbaikan. Kata 'bagian' memperjelas bahwa yang dimaksud ialah ruas tembok yang menjadi tanggung jawab masing-masing.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Zadok anak Imer
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia, dan ungkapan silsilah בן diterjemahkan 'anak'.
- source_word: נֶגֶד בֵּיתוֹ
  choice: di depan rumahnya
  rationale: נֶגֶד dapat berarti 'di depan' atau 'berhadapan dengan'. Pilihan ini alami untuk keterangan topografis tanpa menentukan apakah ruas itu tepat di seberang atau langsung di muka rumah.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Semaya anak Sekhanya
  rationale: Nama-nama diri ditransliterasikan agar dapat dibaca secara wajar dalam bahasa Indonesia.
- source_word: שֹׁמֵר
  choice: penjaga
  rationale: Partisip ini menyatakan peranan atau jabatan Semaya; 'penjaga' mempertahankan kemungkinan fungsi mengawasi dan menjaga gerbang.
- source_word: שַׁעַר הַמִּזְרָח
  choice: Gerbang Timur
  rationale: Frasa ini menunjuk sebuah gerbang tertentu dengan penamaan berdasarkan arah; kapitalisasi menandainya sebagai nama gerbang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan formula 'Sesudah dia' dipertahankan untuk mencerminkan struktur daftar Ibrani. Frasa 'bagian berikutnya' pada klausa terakhir dibuat eksplisit dari pola eliptis daftar agar kalimat alami dalam bahasa Indonesia.
