  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: id
  text: Di sebelahnya, orang-orang Yerikho membangun. Di sebelahnya juga Zakur, putra Imri, membangun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Di sebelahnya
  rationale: Ungkapan עַל יָד dengan akhiran pronominal menunjukkan kedekatan dalam urutan para pembangun. Bentuk “di sebelahnya” alami dalam bahasa Indonesia dan mempertahankan acuan tunggal pada klausa pertama.
- source_word: בָנוּ
  choice: membangun
  rationale: Verba בנה berarti “membangun”. Walaupun konteks luasnya adalah pemulihan tembok Yerusalem, ayat ini memakai verba biasa tanpa unsur yang secara eksplisit berarti “membangun kembali”.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: orang-orang Yerikho
  rationale: Frasa ini secara harfiah menunjuk para lelaki yang terkait dengan Yerikho. Dalam bahasa Indonesia modern, “orang-orang Yerikho” merupakan sebutan kelompok yang wajar tanpa menambahkan gagasan bahwa mereka pasti berasal dari sana.
- source_word: וְעַל יָדוֹ
  choice: dan di sebelah mereka[a]
  rationale: Teks Ibrani kembali memakai akhiran tunggal, secara harfiah “di sebelahnya”. Namun, dalam alur daftar bahasa Indonesia, “mereka” memperjelas bahwa Zakur berada sesudah kelompok orang Yerikho; catatan kaki mempertahankan informasi bentuk Ibraninya.
- source_word: בָּנָה
  choice: membangun
  rationale: Qal perfektum dari בנה diterjemahkan secara langsung sebagai “membangun”, konsisten dengan klausa pertama.
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Zakur anak Imri
  rationale: Nama ditransliterasikan ke bentuk yang mudah dibaca dalam bahasa Indonesia, sedangkan patronimik בֶּן diterjemahkan ringkas dan alami sebagai “anak”.
