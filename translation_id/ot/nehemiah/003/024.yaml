base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: id
  text: Sesudah dia, Binui anak Henadad memperbaiki bagian kedua[a], mulai dari rumah Azarya sampai ke belokan dan sampai ke sudut.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian lain”. Frasa Ibrani ini dapat menunjuk bentangan tambahan yang diperbaiki Binui atau sekadar bagian kedua sebagai suatu ukuran.
    reason: lexical_alternative
  - marker: b
    text: Kata-kata Ibrani yang diterjemahkan “belokan” dan “sudut” berkaitan makna, tetapi tidak sama; kemungkinan besar keduanya menunjuk dua unsur bangunan yang berdekatan.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Dalam daftar pekerjaan di Nehemia 3, frasa ini menandai urutan laporan. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan kedekatan ruang secara berlebihan.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Walaupun makna dasarnya berkaitan dengan menguatkan atau membuat kukuh, dalam konteks Nehemia 3 verba ini mengacu pada pekerjaan memperbaiki tembok.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Binui anak Henadad
  rationale: Nama diri ditransliterasikan, sedangkan konstruksi patronimik diterjemahkan secara wajar sebagai 'anak'.
- source_word: מִדָּה שֵׁנִית
  choice: bagian kedua
  rationale: Terjemahan ini mempertahankan unsur ordinal שֵׁנִית dan memakai 'bagian' untuk ukuran atau bentangan pekerjaan dalam konteks pembangunan tembok.
- source_word: מִבֵּית עֲזַרְיָה
  choice: mulai dari rumah Azarya
  rationale: Ungkapan ini menyatakan titik awal bentangan pekerjaan. 'Mulai dari' membuat fungsi batas tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: עַד הַמִּקְצוֹעַ
  choice: sampai ke belokan
  rationale: Nomina ini dapat menunjuk sudut, belokan, atau titik perubahan arah pada tembok. 'Belokan' membedakannya dari istilah sudut berikutnya tanpa memastikan bentuk arsitektural yang tidak dinyatakan secara tegas.
- source_word: וְעַד הַפִּנָּה
  choice: dan sampai ke sudut
  rationale: פִּנָּה lazim berarti sudut atau titik sudut. Pengulangan 'sampai ke' mempertahankan struktur dan urutan topografis teks Ibrani.
