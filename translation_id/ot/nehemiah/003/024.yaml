translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan lugas. Nama-nama mengikuti bentuk transliterasi Indonesia yang umum: Binui, Henadad, dan Azarya. Istilah arsitektural dibuat berbeda untuk mempertahankan pembedaan dalam teks Ibrani, sementara catatan kaki mengakui ketidakpastian rinci bentuk bangunannya.'
