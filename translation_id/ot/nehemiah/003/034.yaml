  text: וַ/יֹּ֣אמֶר לִ/פְנֵ֣י אֶחָ֗י/ו וְ/חֵיל֙ שֹֽׁמְר֔וֹן וַ/יֹּ֕אמֶר מָ֛ה הַ/יְּהוּדִ֥ים הָ/אֲמֵלָלִ֖ים עֹשִׂ֑ים הֲ/יַעַזְב֨וּ לָ/הֶ֤ם הֲ/יִזְבָּ֨חוּ֙ הַ/יְכַלּ֣וּ בַ/יּ֔וֹם הַ/יְחַיּ֧וּ אֶת הָ/אֲבָנִ֛ים מֵ/עֲרֵמ֥וֹת הֶ/עָפָ֖ר וְ/הֵ֥מָּה שְׂרוּפֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: id
  text: 'Ia berkata di hadapan saudara-saudaranya dan pasukan Samaria demikian: “Apa yang sedang dilakukan orang-orang Yahudi yang lemah ini? Apakah mereka akan memulihkannya bagi diri mereka sendiri?[a] Apakah mereka akan mempersembahkan kurban? Apakah mereka akan menyelesaikannya dalam sehari? Apakah mereka akan menghidupkan kembali batu-batu dari timbunan debu, padahal batu-batu itu sudah terbakar?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa Ibrani yang mendasarinya sulit. Kemungkinan terjemahan lain: “Apakah mereka akan membangunnya kembali sendiri?” atau, secara lebih harfiah, “Apakah mereka akan membiarkannya bagi diri mereka sendiri?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: di hadapan saudara-saudaranya
  rationale: לִפְנֵי menunjukkan bahwa perkataan itu disampaikan di hadapan mereka. אֶחָיו secara harfiah berarti ‘saudara-saudaranya’; sebutan ini dipertahankan meskipun dalam konteks tersebut dapat menunjuk kepada rekan-rekan atau sesama pejabatnya.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: dan pasukan Samaria
  rationale: חֵיל di sini menunjuk kepada kekuatan militer. ‘Pasukan’ alami dalam bahasa Indonesia dan tidak mengharuskan pengertian sebuah angkatan bersenjata yang terorganisasi secara modern.
- source_word: הָאֲמֵלָלִים
  choice: yang lemah
  rationale: Kata sifat ini bernada menghina dan menggambarkan keadaan yang tidak berdaya atau patut dikasihani. ‘Yang lemah’ mempertahankan inti ejekan dengan bahasa Indonesia yang jelas.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Apakah mereka akan memulihkannya bagi diri mereka sendiri?
  rationale: Frasa ini sulit. עזב biasanya berarti ‘meninggalkan’, tetapi dalam konteks ejekan terhadap pembangunan kembali, ‘memulihkannya’ menyampaikan salah satu pemahaman kontekstual utama. Unsur לָהֶם dipertahankan dengan ‘bagi diri mereka sendiri’, sementara ketidakpastian dijelaskan dalam catatan kaki.
- source_word: הֲיִזְבָּחוּ
  choice: Apakah mereka akan mempersembahkan kurban?
  rationale: זבח menunjuk pada tindakan mempersembahkan kurban. Bentuk ini jelas dan wajar bagi pembaca Indonesia serta mempertahankan pertanyaan retoris yang singkat.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Apakah mereka akan menyelesaikannya dalam sehari?
  rationale: כלה dalam bentuk ini berarti menyelesaikan atau menuntaskan. Akhiran ‘-nya’ secara alami menunjuk pada pekerjaan pemulihan tembok yang menjadi konteks.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Apakah mereka akan menghidupkan kembali batu-batu
  rationale: חיה secara harfiah berarti membuat hidup atau menghidupkan kembali. Ungkapan ini mempertahankan personifikasi tajam dalam ejekan, alih-alih meratakannya menjadi sekadar ‘memakai kembali’.
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: dari timbunan debu
  rationale: עֲרֵמוֹת berarti timbunan atau tumpukan, sedangkan עָפָר berarti debu atau tanah lepas. Terjemahan ini dekat dengan citra Ibrani tanpa langsung menafsirkannya sebagai puing-puing.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: padahal batu-batu itu sudah terbakar
  rationale: Klausa ini menyoroti keadaan batu-batu tersebut sebagai alasan tambahan untuk meremehkan upaya pembangunan. ‘Padahal’ menyatakan daya adversatif yang tersirat, sedangkan pengulangan ‘batu-batu itu’ memperjelas acuannya dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Rangkaian pertanyaan singkat dipertahankan untuk menghadirkan ejekan yang bertubi-tubi. Istilah ‘kurban’ mengikuti ejaan baku modern.
