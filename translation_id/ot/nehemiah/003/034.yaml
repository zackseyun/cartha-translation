  source_fidelity: Terjemahan pada dasarnya setia kepada teks Ibrani. Rangkaian pertanyaan ejekan, "pasukan Samaria", kurban, penyelesaian "dalam sehari", serta metafora menghidupkan kembali batu-batu dari timbunan debu yang terbakar telah dipertahankan. Frasa הֲיַעַזְבוּ לָהֶם memang sulit; pilihan kontekstual "memulihkannya bagi diri mereka sendiri" dapat diterima selama ketidakpastiannya diberi catatan kaki.
  naturalness: Kalimat pembuka "Ia berkata ... , katanya," terdengar berlebihan dan kurang luwes dalam Bahasa Indonesia baku. Menggantinya dengan "Ia berkata ... demikian:" menyampaikan pengulangan וַיֹּאמֶר secara idiomatis tanpa redundansi. Selebihnya register dan ritme pertanyaan retorisnya baik.
  terminology: '"Orang-orang Yahudi", "pasukan Samaria", dan "kurban" sesuai dengan penggunaan modern baku. "Menghidupkan kembali batu-batu" secara tepat mempertahankan metafora Ibrani, sementara "padahal batu-batu itu sudah terbakar" menyatakan keadaan batu-batu tersebut secara jelas.'
