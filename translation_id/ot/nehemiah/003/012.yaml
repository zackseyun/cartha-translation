  text: וְ/עַל יָד֣/וֹ הֶחֱזִ֗יק שַׁלּוּם֙ בֶּן הַלּוֹחֵ֔שׁ שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ יְרוּשָׁלִָ֑ם ה֖וּא וּ/בְנוֹתָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/012.yaml
  text: Next to him Shallum son of Hallohesh[a], ruler of half the district of Jerusalem, made repairs—he and his daughters.
translation:
  language: id
  text: Di sebelahnya, Salum anak Halohes, penguasa setengah wilayah Yerusalem, melakukan perbaikan—ia dan anak-anak perempuannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Di sebelahnya
  rationale: Ungkapan Ibrani ini menandai bagian pekerjaan yang bersebelahan dengan bagian pekerja sebelumnya; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan urutan topografisnya.
- source_word: הֶחֱזִיק
  choice: memperbaiki tembok itu
  rationale: Dalam konteks Nehemia 3, bentuk hiphil dari חזק mengacu pada pekerjaan memperbaiki atau membangun kembali tembok. Objek 'tembok itu' dibuat tersurat agar maknanya jelas dalam bahasa Indonesia.
- source_word: שַׁלּוּם
  choice: Salum
  rationale: Nama orang dialihaksarakan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: anak Halohes
  rationale: Nama ayah dialihaksarakan, sedangkan hubungan patronimik diterjemahkan secara alami.
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: penguasa setengah wilayah Yerusalem
  rationale: שַׂר menunjukkan pejabat atau penguasa, sedangkan פֶּלֶךְ di kitab Nehemia adalah wilayah administratif; 'wilayah' tidak melebih-lebihkan skala satuan tersebut.
- source_word: הוּא וּבְנוֹתָיו
  choice: bersama anak-anak perempuannya
  rationale: Frasa ini menyatakan bahwa Salum dan putri-putrinya ikut mengerjakan perbaikan. 'Bersama' mengungkapkan partisipasi kolektif secara alami tanpa menghilangkan penyebutan yang menonjol tentang para putrinya.
