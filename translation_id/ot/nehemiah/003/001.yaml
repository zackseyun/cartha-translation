source:
  edition: WLC
  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: id
  text: Lalu Imam Besar Elyasib bangkit bersama saudara-saudaranya, para imam, dan mereka membangun Pintu Gerbang Domba. Mereka sendiri menguduskannya[a] dan memasang pintunya. Mereka menguduskannya sampai Menara Seratus, sampai Menara Hananel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetapkannya sebagai kudus.” Kata kerja Ibrani ini dapat berarti memisahkan sesuatu sebagai kudus atau mengkhususkannya bagi tujuan suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Kata קום dalam bentuk naratif ini menandai dimulainya tindakan Elyasib. “Bangkit” mempertahankan idiom dan daya naratif Ibrani tanpa menafsirkannya secara lebih sempit sebagai “mulai bekerja”.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: Imam Besar
  rationale: Ini adalah gelar baku bagi imam tertinggi dan padanan yang mapan dalam bahasa Indonesia.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: bersama saudara-saudaranya, para imam
  rationale: Terjemahan ini mempertahankan sebutan kekerabatan “saudara-saudaranya” dan struktur aposisi yang menjelaskan bahwa mereka adalah para imam, tanpa meratakannya menjadi sekadar “rekan-rekan imam”.
- source_word: שַׁעַר הַצֹּאן
  choice: Pintu Gerbang Domba
  rationale: Frasa ini berfungsi sebagai nama sebuah gerbang kota. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan unsur konkret “domba”.
- source_word: הֵמָּה
  choice: Mereka sendiri
  rationale: Kata ganti mandiri ini bersifat menegaskan. “Mereka sendiri” mempertahankan penekanan bahwa para imam itu sendiri melakukan pengudusan.
- source_word: קִדְּשׁוּהוּ
  choice: menguduskannya
  rationale: Kata קדשׁ menyatakan tindakan memisahkan sesuatu sebagai kudus atau mempersembahkannya secara khusus. “Menguduskan” mempertahankan nuansa sakralnya, sedangkan “meresmikan” atau “mendedikasikan” dapat terdengar lebih umum.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: memasang daun-daun pintunya
  rationale: Ungkapan ini berarti menempatkan bagian-bagian pintu gerbang pada tempatnya. “Memasang daun-daun pintunya” jelas dan wajar tanpa menentukan mekanisme pemasangan secara berlebihan.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Menara Seratus
  rationale: Nama tempat ini mencerminkan konstruksi Ibrani secara ringkas dan alami dalam bahasa Indonesia, sementara makna tepat “Seratus” tetap dibiarkan terbuka sebagaimana teks sumber.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Menara Hananel
  rationale: Gelar bangunan diterjemahkan, sedangkan nama diri Hananel ditransliterasikan.
- source_word: וְעַד ... עַד
  choice: sampai ... sampai
  rationale: Pengulangan “sampai” mempertahankan penandaan batas atau jangkauan yang berulang dalam teks Ibrani.
theological_decisions:
- issue: Nuansa sakral kata קדשׁ ketika dikenakan pada gerbang
  choice: menguduskannya
  alternative: mempersembahkannya; mendedikasikannya
  rationale: Tindakan para imam mencakup pemisahan atau penetapan secara sakral, bukan hanya pekerjaan pembangunan sipil. “Menguduskan” menjaga nuansa kultis-teologis itu tanpa menjelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tindakan serta pengulangan teks Ibrani dipertahankan, sementara susunan aposisi dan istilah bangunan dibuat wajar bagi pembaca umum.
