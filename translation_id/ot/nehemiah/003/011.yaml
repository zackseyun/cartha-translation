  - severity: low
    issue: “Beserta” kurang langsung untuk penghubung aditif sebelum objek kedua.
    rationale: וְאֵת menambahkan objek yang juga diperbaiki. “Dan juga” menyatakan hubungan ini dengan lebih jelas tanpa mengubah makna.
