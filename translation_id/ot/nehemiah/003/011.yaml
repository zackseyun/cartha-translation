base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: id
  text: Malkia anak Harim dan Hasub anak Pahat-Moab memperbaiki bagian lain[a], dan juga Menara Tungku-Tungku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian kedua.” Dalam konteks ini, frasa Ibrani tersebut dapat menunjuk pada bagian tambahan yang ditugaskan untuk diperbaiki.
    reason: lexical_alternative
  - marker: b
    text: Atau “Menara Oven-Oven.” Istilah Ibraninya dapat berarti tungku atau oven.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: bagian lain
  rationale: Dalam konteks daftar perbaikan tembok di Nehemia 3, frasa ini menunjuk pada satu bagian tambahan yang dikerjakan. Pilihan ini alami dalam bahasa Indonesia, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam konteks pembangunan kembali tembok, bentuk kausatif verba ini menyatakan tindakan memperkuat atau memperbaiki bagian tembok; 'memperbaiki' paling jelas bagi pembaca modern.
- source_word: מַלְכִּיָה
  choice: Malkia
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: בֶן חָרִם
  choice: anak Harim
  rationale: Konstruksi hubungan keturunan diterjemahkan langsung dan jelas.
- source_word: וְחַשּׁוּב
  choice: dan Hasub
  rationale: Konjungsi dipertahankan dan nama diri ditransliterasikan secara wajar dalam bahasa Indonesia.
- source_word: בֶן פַּחַת מוֹאָב
  choice: anak Pahat-Moab
  rationale: Nama keluarga atau kaum majemuk dipertahankan melalui transliterasi.
- source_word: וְאֵת
  choice: beserta
  rationale: Konjungsi dan penanda objek memperkenalkan bangunan tambahan yang termasuk dalam pekerjaan mereka; 'beserta' mengungkapkan hubungan aditif itu secara ringkas.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Menara Perapian
  rationale: מִגְדָּל berarti 'menara', sedangkan תַּנּוּרִים dapat menunjuk pada tempat pembakaran, tungku, atau perapian. Bentuk ini berfungsi sebagai nama tempat dan tetap mempertahankan gambaran konkret tanpa menetapkan fungsi industri tertentu.
