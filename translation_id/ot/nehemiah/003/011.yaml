  to: Malkia anak Harim dan Hasub anak Pahat-Moab memperbaiki bagian lain[a], dan juga Menara Tungku-Tungku[b].
  rationale: Revisi mengganti “Menara Perapian” dengan “Menara Tungku-Tungku” untuk mempertahankan makna konkret dan bentuk jamak dari istilah Ibrani, serta memakai “dan juga” agar penambahan menara sebagai objek pekerjaan perbaikan dinyatakan secara jelas. Catatan kaki disesuaikan agar alternatifnya akurat dan tidak memperluas makna menjadi “tempat pembakaran”.
