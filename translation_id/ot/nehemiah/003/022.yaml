  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: id
  text: Sesudahnya, para imam, orang-orang dari dataran itu[a], melakukan perbaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wilayah.” Kata Ibrani כִּכָּר dapat berarti dataran atau kawasan berbentuk lingkaran; lokasi tepat yang dimaksud di sini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Menyampaikan urutan para pekerja dalam daftar pembangunan dengan bahasa Indonesia yang alami; kata penghubung Ibrani tidak perlu diterjemahkan tersendiri.
- source_word: הֶחֱזִיקוּ
  choice: melakukan perbaikan
  rationale: Dalam konteks Nehemia 3, bentuk verba ini secara idiomatis menunjuk pada keterlibatan dalam pekerjaan memperbaiki tembok, bukan sekadar 'memegang' atau 'menguatkan'.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan langsung bagi nomina jamak tentu ini.
- source_word: אַנְשֵׁי
  choice: orang-orang dari
  rationale: Bentuk konstruksi ini secara harfiah berarti 'orang-orang/kaum laki-laki dari'; dalam bahasa Indonesia, 'orang-orang dari' secara alami menyatakan kelompok yang berasal dari suatu wilayah tanpa menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: הַכִּכָּר
  choice: daerah sekitar
  rationale: כִּכָּר dapat menunjuk pada dataran atau kawasan berbentuk lingkaran. Dalam daftar pekerjaan di Yerusalem ini, 'daerah sekitar' mempertahankan pengertian geografis umum tanpa memastikan rujukan lokal yang memang tidak pasti.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional 'para imam, yaitu orang-orang dari...' memperjelas bahwa frasa lokasi menerangkan para imam. Penanda catatan kaki ditempatkan langsung setelah frasa yang dipersoalkan.
