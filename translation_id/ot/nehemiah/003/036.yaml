  verdict: revise
  source_fidelity: Terjemahan secara keseluruhan setia pada bentuk imperatif doa, keadaan telah menjadi objek penghinaan, pembalikan celaan kepada para pelaku, dan permohonan agar mereka dijadikan jarahan. Namun, “negeri tempat penawanan” sedikit menggeser konstruksi בְּאֶרֶץ שִׁבְיָה (‘di suatu negeri penawanan/captivity’) menjadi lokasi terjadinya penawanan. Bentuk tak tentu dalam bahasa Ibrani lebih baik ditandai dengan “suatu.”
  naturalness: Bahasanya modern, jelas, dan sesuai register doa. “Sasaran hinaan,” “celaan,” dan “jarahan” wajar. “Di suatu negeri penawanan” mempertahankan makna sumber dengan lebih langsung; meski bernuansa formal, ungkapan ini sesuai dengan gaya teks doa.
  terminology: “Allah kami” tepat untuk אֱלֹהֵינוּ; “celaan” tepat untuk חֶרְפָּה; dan “jarahan” tepat untuk בִּזָּה. Tidak ada pemaksaan penafsiran teologis atas doa imprekatoris ini.
