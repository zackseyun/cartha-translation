source:
  edition: WLC
  text: שְׁמַ֤ע אֱלֹהֵ֨י/נוּ֙ כִּֽי הָיִ֣ינוּ בוּזָ֔ה וְ/הָשֵׁ֥ב חֶרְפָּתָ֖/ם אֶל רֹאשָׁ֑/ם וּ/תְנֵ֥/ם לְ/בִזָּ֖ה בְּ/אֶ֥רֶץ שִׁבְיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: id
  text: Dengarlah, ya Allah kami, sebab kami telah menjadi sasaran hinaan. Balikkanlah celaan mereka ke atas kepala mereka sendiri, dan serahkanlah mereka sebagai jarahan di suatu negeri penawanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri penawanan.” Frasa Ibrani ini secara harfiah berarti “di suatu negeri penawanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk imperatif yang ditujukan kepada Allah; ungkapan doa yang wajar tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: אֱלֹהֵינוּ
  choice: ya Allah kami
  rationale: Bentuk dengan sufiks orang pertama jamak dan fungsi sapaan; partikel 'ya' membuat sapaan itu alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan yang mendahuluinya.
- source_word: הָיִינוּ בוּזָה
  choice: kami telah menjadi sasaran hinaan
  rationale: Secara harfiah, 'kami telah menjadi kehinaan'; pilihan ini mempertahankan aspek keadaan yang telah terjadi sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: וְהָשֵׁב
  choice: Balikkanlah
  rationale: Imperatif kausatif dari שוב; dalam idiom pembalasan celaan, maknanya ialah membuat celaan itu kembali kepada pelakunya.
- source_word: חֶרְפָּתָם
  choice: celaan mereka
  rationale: חרפה dapat berarti celaan, penghinaan, atau aib; 'celaan' mempertahankan unsur serangan verbal dan kehinaan.
- source_word: אֶל רֹאשָׁם
  choice: ke atas kepala mereka sendiri
  rationale: Mencerminkan idiom Ibrani tentang akibat yang kembali menimpa pelakunya; 'sendiri' memperjelas daya refleksif idiom tersebut tanpa mengubah makna.
- source_word: וּתְנֵם
  choice: serahkanlah mereka
  rationale: נתן dengan objek orang dan pelengkap 'sebagai jarahan' secara kontekstual berarti menyerahkan mereka kepada nasib tersebut.
- source_word: לְבִזָּה
  choice: sebagai jarahan
  rationale: 'Menjaga fungsi predikatif nomina ביזה: mereka dijadikan atau diserahkan sebagai jarahan.'
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: di negeri tempat penawanan
  rationale: Mengungkap konstruksi 'negeri penawanan' secara alami sambil menjaga ketidakpastian apakah yang dimaksud negeri tertentu atau negeri mana pun yang menjadi tempat penawanan.
theological_decisions:
- issue: Permohonan penghukuman terhadap para musuh
  choice: Mempertahankan permohonan langsung agar celaan berbalik dan para musuh diserahkan sebagai jarahan
  alternative: Melunakkannya menjadi permohonan umum agar keadilan ditegakkan
  rationale: Teks Ibrani secara eksplisit berisi doa pembalasan; terjemahan tidak boleh mengurangi ketegangan teologis atau daya imprekatorisnya.
translation_notes:
  register: Bahasa doa yang modern, lugas, dan bermartabat. Imperatif memakai akhiran -lah; istilah 'jarahan', 'celaan', dan 'penawanan' mempertahankan bobot puitis serta kerasnya permohonan asli.
