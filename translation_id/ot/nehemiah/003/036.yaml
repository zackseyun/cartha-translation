    rationale: Frasa ini dapat dipahami sebagai negeri yang menjadi tempat tindakan penawanan berlangsung, sedangkan bahasa Ibrani menyebut ‘negeri penawanan/captivity’ dan tidak memakai kata ‘tempat.’ Selain itu, nomina tak tentu אֶרֶץ paling baik tercermin dengan “suatu” dalam terjemahan ini.
