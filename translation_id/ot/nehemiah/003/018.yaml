  text: אַחֲרָי/ו֙ הֶחֱזִ֣יקוּ אֲחֵי/הֶ֔ם בַּוַּ֖י בֶּן חֵנָדָ֑ד שַׂ֕ר חֲצִ֖י פֶּ֥לֶךְ קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/018.yaml
  text: 'After him their brothers repaired: Bavvai son of Henadad[a], ruler of half the district of Keilah.'
translation:
  language: id
  text: 'Sesudahnya, saudara-saudara mereka melakukan perbaikan: Bawai anak Henadad, penguasa setengah wilayah Keila.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa tradisi teks menyebut nama ini “Binui”, bukan “Bawai”.
    reason: textual_variant
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Menyatakan urutan bagian pekerjaan dalam daftar perbaikan; frasa ini mempertahankan bentuk penanda urutan dalam bahasa Ibrani.
- source_word: הֶחֱזִיקוּ
  choice: memperbaiki bagian berikutnya
  rationale: Secara harfiah berarti 'menguatkan', tetapi dalam konteks Nehemia 3 merupakan ungkapan untuk memperbaiki tembok. 'Bagian berikutnya' memperjelas objek tersirat secara alami.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan ungkapan harfiah bahasa Ibrani, yang dalam konteks ini dapat menunjuk kepada kerabat atau rekan sebangsa mereka.
- source_word: בַּוַּי
  choice: Bawai
  rationale: Mentransliterasikan bentuk nama yang terdapat dalam teks WLC; varian 'Binui' dicatat dalam catatan kaki.
- source_word: בֶּן חֵנָדָד
  choice: anak Henadad
  rationale: Padanan Indonesia yang alami untuk konstruksi patronimik Ibrani.
- source_word: שַׂר
  choice: penguasa
  rationale: Menunjuk pejabat yang mengepalai satu wilayah administratif, bukan jabatan militer.
- source_word: חֲצִי פֶּלֶךְ
  choice: setengah wilayah
  rationale: Menunjuk separuh suatu pembagian administratif; 'wilayah' jelas dan alami dalam bahasa Indonesia modern.
- source_word: קְעִילָה
  choice: Keila
  rationale: Bentuk nama tempat yang lazim dan alami dalam ejaan Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'di bawah pimpinan' menghubungkan para pekerja dengan Bawai sebagai kepala kelompok secara alami, sementara susunan Ibrani yang aposisional tetap tercermin.
