translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat menjaga fokus pada kelompok pembangun. Istilah teknis bangunan dibuat jelas bagi pembaca umum tanpa menghilangkan perbedaan antara pengunci dan palang.
