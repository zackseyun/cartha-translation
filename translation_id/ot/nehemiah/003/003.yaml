  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: id
  text: Pintu Gerbang Ikan dibangun oleh keturunan Has-Senaa[a]. Mereka memasang atapnya dan memasang pintu-pintunya beserta alat-alat pengunci dan palang-palangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Has-Senaa”; ungkapan ini dapat menunjuk pada keluarga atau kelompok keturunan. Nama ini mungkin berhubungan dengan Senaa yang disebut di bagian lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: Pintu Gerbang Ikan
  rationale: Frasa konstruksi ini menunjuk pada sebuah gerbang kota tertentu yang berkaitan dengan ikan; bentuk ini alami sebagai nama gerbang dalam bahasa Indonesia.
- source_word: בָּנוּ
  choice: dibangun
  rationale: Verba בנה pada dasarnya berarti 'membangun'. Walaupun konteks pasal ini adalah pemulihan tembok, ayat ini tidak memakai istilah yang secara khusus berarti 'memperbaiki'.
- source_word: בְּנֵי הַסְּנָאָה
  choice: keturunan Senaa
  rationale: בני dapat berarti anak-anak secara harfiah atau anggota kelompok keluarga/klan. Dalam konteks daftar pekerja ini, 'keturunan' menyampaikan maksud kolektif dengan alami; nama ditransliterasikan sebagai Senaa, sedangkan ה pada bentuk Ibrani dipahami sebagai unsur sandang, bukan bagian yang perlu dipertahankan sebagai 'Ha-'.
- source_word: הֵמָּה
  choice: Mereka
  rationale: Pronomina mandiri menegaskan kembali kelompok pelaku, tetapi dalam bahasa Indonesia penegasan tambahan seperti 'mereka sendiri' dapat menyiratkan kontras yang tidak pasti. Memulai kalimat baru dengan 'Mereka' menjaga penonjolan subjek secara alami.
- source_word: קֵרֻהוּ
  choice: memasang balok-balok atapnya
  rationale: Dalam konteks bangunan, קרה berarti menutupi dengan atap atau memasang balok. Pilihan ini konkret dan sesuai dengan pekerjaan pada bangunan gerbang, sambil tetap mengakui kemungkinan makna yang lebih umum melalui catatan kaki.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: mendirikan daun-daun pintunya
  rationale: Ungkapan ini secara harfiah berarti membuat daun-daun pintu itu berdiri; 'mendirikan' mempertahankan gambaran sumber tanpa terlalu menentukan cara pemasangannya.
- source_word: מַנְעוּלָיו
  choice: pengunci
  rationale: Istilah ini menunjuk pada perangkat pengaman atau pengancing pintu. 'Pengunci' mempertahankan cakupan makna tanpa menyamakannya secara pasti dengan kunci modern.
- source_word: וּבְרִיחָיו
  choice: dan palang-palangnya
  rationale: בריח adalah palang yang melintang untuk mengamankan pintu gerbang; 'palang' merupakan padanan langsung dan lazim.
