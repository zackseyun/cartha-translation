base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: id
  text: Setelahnya, Benyamin dan Hasub melakukan perbaikan berhadapan dengan rumah mereka. Setelahnya, Azarya anak Maaseya, anak Ananya, melakukan perbaikan di samping rumahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Ungkapan berulang ini menandai urutan para pekerja di sepanjang tembok. Bentuk tunggal pronomina Ibrani dipertahankan, meskipun rujukannya tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: הֶחֱזִיק
  choice: memperbaiki bagian
  rationale: Dalam Nehemia 3, bentuk Hifil dari חזק merupakan ungkapan untuk turut mengerjakan perbaikan tembok. Kata “bagian” tersirat dari konteks dan membuat kalimat alami tanpa mengubah jenis pekerjaan.
- source_word: בִּנְיָמִן
  choice: Benyamin
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: חַשּׁוּב
  choice: Hasub
  rationale: Transliterasi nama Ibrani yang alami menurut kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: נֶגֶד בֵּיתָם
  choice: di depan rumah mereka
  rationale: נֶגֶד menunjukkan posisi yang berhadapan dengan atau tepat di depan sesuatu. Bentuk tunggal “rumah” dan akhiran jamak “mereka” dipertahankan.
- source_word: עֲזַרְיָה
  choice: Azarya
  rationale: Transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: anak Maaseya, anak Ananya
  rationale: Struktur silsilah Ibrani dipertahankan secara langsung tanpa menafsirkan apakah Ananya adalah ayah atau leluhur yang lebih jauh dari Maaseya.
- source_word: אֵצֶל בֵּיתוֹ
  choice: di samping rumahnya
  rationale: אֵצֶל menyatakan kedekatan tempat. “Di samping” membedakannya dari penanda urutan אַחֲרָיו dan mempertahankan acuan topografis konkret.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama mengikuti bentuk yang wajar dalam tradisi ejaan Alkitab bahasa Indonesia. Rumusan mempertahankan pengulangan formula Ibrani dan perbedaan antara lokasi “di depan” dan “di samping”. Catatan kaki pada lapisan konsultasi Inggris tidak dipakai karena hanya menawarkan variasi transliterasi bahasa Inggris dan penandanya tampak tidak berkaitan dengan nama yang dimaksud.
