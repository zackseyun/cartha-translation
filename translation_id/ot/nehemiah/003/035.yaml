base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: id
  text: Tobia, orang Amon itu, berada di sampingnya. Ia berkata, “Bahkan apa yang sedang mereka bangun itu—kalau seekor rubah[a] naik ke atasnya, rubah itu akan menjebol tembok batu mereka!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rubah” dalam beberapa konteks dapat menunjuk lebih luas kepada hewan sejenis rubah dari keluarga anjing, tetapi “rubah” merupakan terjemahan yang lazim di sini.
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan merobohkan tembok batu mereka.” Kata kerja Ibrani dapat berarti menjebol, menerobos, atau merobohkan; ungkapan ini merupakan bagian dari ejekan Tobia tentang rapuhnya tembok itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: berada di sampingnya
  rationale: Kata depan אֵצֶל dengan akhiran pronominal menyatakan kedekatan; ungkapan ini secara alami menunjukkan bahwa Tobia berada di sisi Sanbalat.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Bahkan apa yang sedang mereka bangun itu
  rationale: גַּם di sini memberi penekanan yang memperkuat nada ejekan. Kata “sedang” mencerminkan tindakan pembangunan yang masih berlangsung.
- source_word: אִם
  choice: kalau
  rationale: Partikel ini memperkenalkan syarat hipotetis. “Kalau” alami dalam ejekan langsung dan tetap mempertahankan struktur bersyarat.
- source_word: יַעֲלֶה שׁוּעָל
  choice: seekor rubah naik ke atasnya
  rationale: שׁוּעָל lazim berarti “rubah”; objek tempat yang tersirat dibuat jelas dengan “ke atasnya”, merujuk pada bangunan atau tembok itu.
- source_word: וּפָרַץ
  choice: rubah itu akan menjebol
  rationale: פרץ dapat berarti menerobos, menjebol, atau merobohkan. Subjek verba tunggal paling wajar adalah rubah yang baru disebut; pengulangan “rubah itu” menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: tembok batu mereka
  rationale: Frasa konstruksi ini secara harfiah berarti “tembok dari batu-batu mereka”; “tembok batu mereka” ringkas, alami, dan mempertahankan penyebutan bahannya.
