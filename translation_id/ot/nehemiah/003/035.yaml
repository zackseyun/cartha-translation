  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ucapan Tobia dibuat cukup lisan untuk mempertahankan daya ejeknya, tanpa memakai bahasa slang. Tanda pisah menandai peralihan dari celaan umum kepada gambaran bersyarat yang berlebihan.
