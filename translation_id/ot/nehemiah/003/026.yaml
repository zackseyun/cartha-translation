  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: id
  text: Para pelayan Bait Allah[a] tinggal di Ofel sampai ke daerah yang berhadapan dengan Pintu Air di sebelah timur dan menara yang menonjol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Netinim, sebutan bagi suatu golongan pelayan Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini menunjuk pada golongan petugas bawahan yang ditugaskan untuk pelayanan Bait Allah. Terjemahan berdasarkan fungsi lebih mudah dipahami daripada transliterasi “kaum Netinim”, sementara catatan kaki mempertahankan istilah Ibraninya.
- source_word: הָיוּ יֹשְׁבִים
  choice: tinggal
  rationale: Gabungan היה dengan partisip menyatakan keadaan tempat tinggal yang berlangsung; “tinggal” merupakan ungkapan Indonesia modern yang wajar.
- source_word: בָּעֹפֶל
  choice: di Ofel
  rationale: Ofel adalah nama kawasan tinggi berbenteng di Yerusalem. Nama tempat ditransliterasikan, dan preposisi “di” paling alami dalam bahasa Indonesia.
- source_word: עַד נֶגֶד
  choice: sampai ke tempat di depan
  rationale: Ungkapan ini menandai batas wilayah hingga lokasi yang berhadapan dengan suatu bangunan. “Di depan” mempertahankan hubungan spasial tanpa memastikan apakah yang dimaksud tepat berseberangan atau sekadar menghadapnya.
- source_word: שַׁעַר הַמַּיִם
  choice: Pintu Gerbang Air
  rationale: Rangkaian konstruksi ini adalah nama sebuah pintu gerbang kota. Bentuk tersebut jelas dan sesuai dengan pola penamaan tempat dalam bahasa Indonesia.
- source_word: לַמִּזְרָח
  choice: ke arah timur
  rationale: Frasa ini menunjukkan arah atau orientasi timur. “Ke arah timur” mempertahankan nuansa arah tanpa memaksanya menjadi lokasi statis.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: menara yang menjorok ke luar
  rationale: Secara harfiah partisip ini berarti “yang keluar”; dalam konteks arsitektur, maksudnya ialah menara yang menonjol atau memanjang keluar dari garis bangunan.
