  yaml_path: translation/ot/nehemiah/003/009.yaml
  text: Next to them[a], Rephaiah son of Hur, ruler of half the district of Jerusalem, made repairs.
translation:
  language: id
  text: Di sebelah mereka, Refaya anak Hur, penguasa atas separuh wilayah Yerusalem, melakukan perbaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguatkan”. Kata kerja Ibrani ini secara harfiah berarti “membuat kuat”, tetapi dalam pasal ini digunakan secara idiomatis untuk pekerjaan perbaikan tembok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Di sebelah mereka
  rationale: Ungkapan ini dalam Nehemia 3 menunjukkan kelompok pekerja berikutnya yang bekerja berdampingan di sepanjang tembok; bentuk ini alami dalam bahasa Indonesia dan mempertahankan urutan daftar.
- source_word: הֶחֱזִיק
  choice: melakukan perbaikan
  rationale: Bentuk Hifil dari חזק secara harfiah berarti 'menguatkan', tetapi dalam konteks pasal ini dipakai secara idiomatis untuk pekerjaan memperbaiki atau memperkuat tembok.
- source_word: רְפָיָה
  choice: Refaya
  rationale: Nama pribadi dialihaksarakan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֶן־חוּר
  choice: anak Hur
  rationale: Ungkapan patronimik baku yang mengidentifikasi Refaya sebagai anak Hur.
- source_word: שַׂר
  choice: penguasa
  rationale: Kata שַׂר menunjuk seorang pemimpin atau pejabat; 'penguasa' sesuai dengan jabatan administratif atas wilayah yang disebutkan.
- source_word: חֲצִי פֶּלֶךְ
  choice: setengah wilayah
  rationale: פֶּלֶךְ di sini merujuk pada wilayah administratif. 'Setengah wilayah' jelas bagi pembaca modern tanpa menyiratkan bahwa orang tersebut memerintah hanya separuh dari keseluruhan kota secara umum.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat tersebut dalam bahasa Indonesia.
