base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/010.yaml
  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: id
  text: Di sebelah mereka, Yedaya anak Harumaf melakukan perbaikan di depan rumahnya[a], dan di sebelahnya Hatus anak Hasabneya melakukan perbaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhadapan dengan rumahnya.”'
    reason: Alternatif ini mempertahankan kemungkinan nuansa נֶגֶד sebagai posisi yang berhadapan atau di depan rumahnya.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Di sebelah mereka
  rationale: Ungkapan עַל יָד dengan akhiran pronominal menunjukkan kedekatan lokasi dalam daftar para pekerja di Nehemia 3. Terjemahan ini alami dan mempertahankan urutan topografis.
- source_word: הֶחֱזִיק
  choice: memperbaiki
  rationale: Dalam konteks Nehemia 3, bentuk Hifil dari חזק merupakan ungkapan teknis bagi pekerjaan perbaikan atau pembangunan kembali tembok.
- source_word: יְדָיָה בֶן חֲרוּמַף
  choice: Yedaya anak Harumaf
  rationale: Konstruksi silsilah diterjemahkan secara langsung, sedangkan nama-nama ditransliterasikan sesuai bunyi Ibrani dan kaidah Indonesia.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: bagian yang berhadapan dengan rumahnya
  rationale: נֶגֶד menyatakan posisi di depan atau berhadapan dengan sesuatu. Penambahan 'bagian' memperjelas bahwa yang diperbaiki ialah bagian tembok tanpa mengubah hubungan ruang dalam teks.
- source_word: וְעַל יָדוֹ
  choice: Di sebelahnya
  rationale: Ungkapan kedekatan yang sama dipakai kembali dengan akhiran tunggal dan merujuk pada posisi pekerjaan di samping Yedaya.
- source_word: חַטּוּשׁ בֶּן חֲשַׁבְנְיָה
  choice: Hatus anak Hasabneya
  rationale: Konstruksi patronimik diterjemahkan secara langsung dan nama-nama ditransliterasikan bagi pembaca Indonesia.
- source_word: הֶחֱזִיק
  choice: juga memperbaiki tembok
  rationale: Kata 'juga' mencerminkan kesinambungan formula dengan pekerja sebelumnya, sedangkan 'tembok' memasok objek yang tersirat jelas dari konteks pasal agar kalimat Indonesia tidak menggantung.
