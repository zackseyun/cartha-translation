  text: דִּבְרֵ֥י נְחֶמְיָ֖ה בֶּן חֲכַלְיָ֑ה וַ/יְהִ֤י בְ/חֹֽדֶשׁ כסלו שְׁנַ֣ת עֶשְׂרִ֔ים וַ/אֲנִ֥י הָיִ֖יתִי בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/001.yaml
  text: The words of Nehemiah son of Hacaliah[a]. Now it happened in the month of Kislev, in the twentieth year, while I was in Susa the citadel[c][b],
translation:
  language: id
  text: Catatan Nehemia anak Hakhalya.[a] Terjadilah pada bulan Kislew, tahun kedua puluh,[b] ketika aku berada di Susan, kota benteng,[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Riwayat Nehemia anak Hakhalya.” Ungkapan Ibrani yang secara harfiah berarti “perkataan-perkataan Nehemia” dapat memperkenalkan catatan atau riwayat tertulis.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “tahun kedua puluh” dan tidak menyebutkan dalam ayat ini tahun pemerintahan siapa yang dimaksud; konteks selanjutnya menunjuk kepada Artahsasta.
    reason: cultural_note
  - marker: c
    text: Atau “benteng Susan.” Istilah Ibrani ini menunjuk pada kompleks kerajaan yang berbenteng.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: Catatan
  rationale: Dalam judul ini, bentuk jamak konstruksi dari דָּבָר memperkenalkan tulisan atau riwayat yang berkaitan dengan Nehemia. “Catatan” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “perkataan-perkataan” dan tidak membatasi isinya hanya pada ucapan.
- source_word: נְחֶמְיָה
  choice: Nehemia
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בֶּן חֲכַלְיָה
  choice: bin Hakhalya
  rationale: “Bin” merupakan ungkapan silsilah yang ringkas dan lazim dalam bahasa Indonesia; Hakhalya mentransliterasikan nama Ibrani tanpa menerjemahkannya.
- source_word: וַיְהִי
  choice: terjadilah bahwa—
  rationale: Formula naratif ini mengantar peristiwa yang baru disebut dalam ayat berikutnya. Bentuk ini mempertahankan hubungan sintaksis antarayat, dan tanda pisah menandai bahwa kalimat belum selesai pada akhir ayat 1.
- source_word: בְחֹדֶשׁ כסלו
  choice: Pada bulan Kislew
  rationale: Merender formula waktu secara alami dan mempertahankan nama bulan Ibrani sebagai transliterasi.
- source_word: שְׁנַת עֶשְׂרִים
  choice: dalam tahun kedua puluh
  rationale: Mempertahankan ketidakjelasan teks mengenai pemerintahan siapa yang menjadi patokan tahun tersebut, tanpa menambahkan nama raja.
- source_word: וַאֲנִי הָיִיתִי
  choice: ketika aku berada
  rationale: Mengungkapkan keadaan temporal sang narator dengan bahasa Indonesia yang alami.
- source_word: בְשׁוּשַׁן
  choice: di Susan
  rationale: Menggunakan bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַבִּירָה
  choice: kota benteng
  rationale: Istilah ini menunjuk pada pusat kerajaan yang berkubu atau kompleks istana berbenteng. “Kota benteng” dapat dipahami pembaca umum dan menjaga unsur pertahanannya.
theological_decisions:
- issue: Patokan “tahun kedua puluh”
  choice: Tidak menyebut Artahsasta dalam teks utama
  alternative: “tahun kedua puluh pemerintahan Raja Artahsasta”
  rationale: Ayat ini sendiri tidak menyatakan nama raja; identifikasi itu muncul dari konteks selanjutnya. Menambahkannya di sini akan menghilangkan ketidakjelasan asli.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mempertahankan sifat ayat 1 yang belum selesai secara sintaksis dan berlanjut ke ayat 2. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkan.
