id: NEH.1.9
reference: Nehemiah 1:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׁבְתֶּ֣ם אֵלַ֔/י וּ/שְׁמַרְתֶּם֙ מִצְוֺתַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם אִם יִהְיֶ֨ה נִֽדַּחֲ/כֶ֜ם בִּ/קְצֵ֤ה הַ/שָּׁמַ֨יִם֙ מִ/שָּׁ֣ם אֲקַבְּצֵ֔/ם ו/הבואתי/ם אֶל הַ/מָּק֔וֹם אֲשֶׁ֣ר בָּחַ֔רְתִּי לְ/שַׁכֵּ֥ן אֶת שְׁמִ֖/י שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/009.yaml
  text: but if you return to me and keep my commandments and do them[a], though your outcasts are at the end of the heavens, from there I will gather them and bring them to the place that I have chosen[c][b], to make my name dwell there.
translation:
  language: id
  text: Namun, jika kamu berbalik kepada-Ku, berpegang pada perintah-perintah-Ku, dan melakukannya, sekalipun orang-orangmu yang tercerai-berai[a] berada di ujung langit[b], dari sana Aku akan mengumpulkan mereka dan membawa mereka ke tempat yang telah Kupilih agar nama-Ku berdiam di sana[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orangmu yang terbuang” atau “orang-orangmu yang terserak.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “di ujung langit,” suatu ungkapan untuk jarak sejauh-jauhnya.
    reason: cultural_note
  - marker: c
    text: Atau “untuk menempatkan nama-Ku di sana.” Bahasa Ibrani mempertahankan gambaran bahwa nama Allah berdiam di tempat yang dipilih-Nya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתֶּם אֵלַי
  choice: Namun, jika kamu berbalik kepada-Ku
  rationale: שׁוּב dengan אֶל berarti ‘kembali/berbalik kepada’. Kata ‘jika’ meneruskan struktur syarat dari ayat sebelumnya, sedangkan ‘namun’ menyatakan peralihan dari peringatan kepada janji pemulihan.
- source_word: וּשְׁמַרְתֶּם מִצְוֺתַי
  choice: berpegang pada perintah-perintah-Ku
  rationale: שׁמר dalam hubungan dengan perintah menyatakan ketaatan yang memelihara dan menjalankan ketetapan. ‘Berpegang pada’ terdengar alami dalam bahasa Indonesia dan tetap dapat dibedakan dari tindakan ‘melakukannya’ pada klausa berikut.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan melakukannya
  rationale: Terjemahan ini mempertahankan unsur eksplisit ‘melakukan’ dalam bahasa Ibrani dan tidak meleburkannya dengan klausa sebelumnya.
- source_word: נִדַּחֲכֶם
  choice: orang-orangmu yang tercerai-berai
  rationale: Bentuk dari נדח menunjuk kepada orang-orang yang telah dihalau atau diserakkan. ‘Tercerai-berai’ sesuai dengan konteks pembuangan dan mempertahankan keadaan pasif mereka.
- source_word: בִּקְצֵה הַשָּׁמַיִם
  choice: di ujung langit
  rationale: Terjemahan yang cukup harfiah ini mempertahankan idiom kosmis Ibrani bagi jarak yang paling jauh. Dalam bahasa Indonesia, ‘langit’ lazim berbentuk tunggal meskipun שָׁמַיִם secara morfologis berbentuk jamak.
- source_word: מִשָּׁם אֲקַבְּצֵם
  choice: dari sana Aku akan mengumpulkan mereka
  rationale: קבץ adalah verba lazim untuk mengumpulkan kembali umat yang tercerai-berai; ‘mengumpulkan’ mempertahankan gambaran pemulihan tersebut.
- source_word: וַהֲבֹאתִים
  choice: dan membawa mereka
  rationale: Bentuk kausatif בוא secara alami diterjemahkan ‘membawa’ dalam bahasa Indonesia.
- source_word: הַמָּקוֹם אֲשֶׁר בָּחַרְתִּי
  choice: tempat yang telah Kupilih
  rationale: בחר menyatakan pilihan ilahi atas lokasi tempat kudus. ‘Telah Kupilih’ menunjukkan bahwa pilihan itu sudah dibuat dan tetap berlaku.
- source_word: לְשַׁכֵּן אֶת שְׁמִי שָׁם
  choice: untuk membuat nama-Ku berdiam di sana
  rationale: Ungkapan ini mempertahankan bentuk kausatif שכן dan gambaran khas kitab Ulangan tentang nama Allah yang berdiam di tempat pilihan-Nya, tanpa meratakannya menjadi sekadar penamaan atau peringatan.
theological_decisions:
- issue: Rumusan kehadiran ilahi pada tempat kudus
  choice: untuk membuat nama-Ku berdiam di sana
  alternative: untuk menempatkan nama-Ku di sana
  rationale: Bahasa Ibrani mempertahankan ketegangan teologis antara keterikatan nama Allah dengan tempat pilihan-Nya dan kenyataan bahwa Allah tidak dibatasi secara ruang. Terjemahan dengan ‘berdiam’ menjaga gambaran tersebut tanpa menjelaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk jamak orang kedua dalam bahasa Ibrani diterjemahkan dengan ‘kamu’ sebagai sapaan kolektif kepada umat. Kapitalisasi pronomina ilahi mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia.
