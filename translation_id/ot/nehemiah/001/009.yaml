  verdict: revise
  source_fidelity: 'Makna utama sangat setia pada teks Ibrani: struktur bersyarat yang diteruskan dari ayat sebelumnya, kembali kepada Allah, memelihara dan melakukan perintah-Nya, pengumpulan orang-orang yang diserakkan dari tempat terjauh, serta pembawaan ke tempat pilihan Allah semuanya terwakili. Ungkapan נִדָּחֲכֶם diterjemahkan secara tepat sebagai orang-orang yang tercerai-berai, dan idiom ''ujung langit'' dipertahankan. Pada klausa terakhir, ''agar nama-Ku berdiam di sana'' menyampaikan tujuan serta citra nama Allah yang berdiam tanpa membuat kausatif Ibrani terdengar janggal dalam bahasa Indonesia.'
