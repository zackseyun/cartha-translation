  terminology: Istilah 'perintah-perintah-Ku,' 'tercerai-berai,' 'mengumpulkan,' dan 'tempat yang telah Kupilih' sesuai dengan register Alkitab Indonesia modern serta setia pada istilah sumber. 'Nama-Ku berdiam' mempertahankan gambaran formula tempat kudus tanpa menafsirkan secara denominatif.
