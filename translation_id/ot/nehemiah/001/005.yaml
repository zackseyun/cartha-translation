language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אָֽנָּ֤א יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם הָ/אֵ֥ל הַ/גָּד֖וֹל וְ/הַ/נּוֹרָ֑א שֹׁמֵ֤ר הַ/בְּרִית֙ וָ/חֶ֔סֶד לְ/אֹהֲבָ֖י/ו וּ/לְ/שֹׁמְרֵ֥י מִצְוֺתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/005.yaml
  text: And I said[a], “Please, O Yahweh, God of heaven, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: id
  text: Lalu aku berkata, “Ya, Yahweh, Allah langit, Allah yang besar dan dahsyat[a], yang memegang teguh perjanjian dan kasih setia[b] terhadap orang-orang yang mengasihi-Nya dan menaati perintah-perintah-Nya,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang besar dan menggentarkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kesetiaan perjanjian”; kata Ibrani ini menunjuk pada kasih yang teguh dan loyal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan memperkenalkan isi doa; “lalu” alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אָנָּא
  choice: Ya
  rationale: Partikel permohonan dalam doa. “Ya” menyampaikan seruan memohon dengan register doa yang wajar dan bermartabat; “kiranya” kurang cocok jika berdiri langsung sebelum sapaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan membedakannya dari gelar seperti Tuhan.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Allah semesta langit
  rationale: Ungkapan konstruk ini secara harfiah dapat dipahami sebagai “Allah langit”; “semesta langit” mempertahankan bentuk jamak Ibrani sekaligus terdengar wajar sebagai gelar ilahi dalam bahasa Indonesia.
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: Allah yang besar dan dahsyat
  rationale: “Dahsyat” menyatakan bahwa Allah membangkitkan gentar dan takjub, tanpa menyiratkan bahwa Ia mengerikan secara moral.
- source_word: שֹׁמֵר
  choice: yang memegang teguh
  rationale: Partisip ini menggambarkan tindakan Allah yang terus memelihara atau menepati; “memegang teguh” alami dalam kolokasi dengan perjanjian dan kasih setia.
- source_word: הַבְּרִית וָחֶסֶד
  choice: perjanjian dan kasih setia
  rationale: Mempertahankan dua nomina yang dikoordinasikan dalam teks Ibrani. “Kasih setia” menyampaikan loyalitas kasih dalam konteks perjanjian tanpa meleburkannya ke dalam kata “perjanjian”.
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: terhadap orang-orang yang mengasihi-Nya dan menaati perintah-perintah-Nya
  rationale: Frasa לְ menandai pihak yang menerima pemeliharaan perjanjian dan kasih setia Allah. “Menaati” menyampaikan makna menjaga dengan menjalankan perintah, bukan sekadar menyimpannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menggunakan nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kesetiaan perjanjian; kemurahan; belas kasih
  rationale: Karena חֶסֶד berdampingan dengan בְּרִית, maknanya mencakup kasih yang loyal dan teguh. “Kasih setia” mempertahankan unsur kasih serta kesetiaan tanpa menjadikan hubungan keduanya terlalu teknis.
- issue: Nuansa הַנּוֹרָא
  choice: dahsyat
  alternative: menggentarkan; menakutkan
  rationale: Kata ini menyatakan bahwa Allah menimbulkan rasa takut, gentar, dan takjub. “Dahsyat” menjaga ketegangan itu dalam bahasa Indonesia modern, sedangkan “menakutkan” dapat terdengar semata-mata negatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada doa. Sapaan “Ya, Yahweh” dipilih untuk permohonan yang khidmat; struktur ayat dibiarkan berakhir dengan koma karena ayat ini membuka doa yang berlanjut pada ayat berikutnya.
