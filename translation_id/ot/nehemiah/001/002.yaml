id: NEH.1.2
reference: Nehemiah 1:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨א חֲנָ֜נִי אֶחָ֧ד מֵ/אַחַ֛/י ה֥וּא וַ/אֲנָשִׁ֖ים מִֽ/יהוּדָ֑ה וָ/אֶשְׁאָלֵ֞/ם עַל הַ/יְּהוּדִ֧ים הַ/פְּלֵיטָ֛ה אֲשֶֽׁר נִשְׁאֲר֥וּ מִן הַ/שֶּׁ֖בִי וְ/עַל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/002.yaml
  text: Hanani[a], one of my brothers, came—he and some men from Judah—and I asked them about the Jews who had escaped, who were left from the captivity[c][b], and about Jerusalem.
translation:
  language: id
  text: Hanani, salah seorang saudaraku, datang bersama beberapa orang dari Yehuda. Aku bertanya kepada mereka tentang orang-orang Yahudi[a] yang luput[b], yang masih tersisa dari pembuangan[c], dan tentang Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang Yehuda". Istilah Ibrani ini dapat menunjuk penduduk atau bangsa Yehuda maupun orang Yahudi secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau "orang-orang yang selamat" atau "kaum yang tersisa".
    reason: lexical_alternative
  - marker: c
    text: Atau "penawanan".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא menyatakan gerak dalam narasi lampau; 'datang' merupakan padanan Indonesia yang alami.
- source_word: חֲנָנִי
  choice: Hanani
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶחָד מֵאַחַי הוּא
  choice: salah seorang saudaraku
  rationale: Mempertahankan istilah kekerabatan maskulin dan gagasan bahwa Hanani termasuk di antara saudara-saudara Nehemia, tanpa memperluasnya menjadi sekadar kerabat.
- source_word: וַאֲנָשִׁים מִיהוּדָה
  choice: bersama beberapa orang dari Yehuda
  rationale: Mengungkapkan secara alami bahwa sejumlah orang dari Yehuda menyertai Hanani; jumlah pastinya tidak dinyatakan.
- source_word: וָאֶשְׁאָלֵם
  choice: Aku bertanya kepada mereka
  rationale: שׁאל di sini berarti bertanya atau meminta keterangan; rumusan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Istilah ini dapat menunjuk orang Yehuda atau bangsa Yahudi secara lebih luas; pilihan utama mengikuti makna etnokomunal yang wajar dalam konteks zaman Persia.
- source_word: הַפְּלֵיטָה
  choice: yang luput
  rationale: Nomina kolektif ini menunjuk kelompok yang berhasil lolos atau selamat; klausa relatif menghasilkan bahasa Indonesia yang alami sambil mempertahankan nuansa 'terluput'.
- source_word: אֲשֶׁר נִשְׁאֲרוּ
  choice: yang masih tersisa
  rationale: Mempertahankan makna keadaan hasil dari Niphal נִשְׁאֲרוּ, yakni mereka yang tetap ada atau tertinggal.
- source_word: מִן הַשֶּׁבִי
  choice: dari pembuangan
  rationale: שׁבי dapat berarti penawanan atau pembuangan. Dalam konteks kepulangan dari Babel, 'pembuangan' alami dan tepat, sementara alternatif dicatat dalam catatan kaki.
- source_word: וְעַל יְרוּשָׁלִָם
  choice: dan tentang Yerusalem
  rationale: Menjaga kesejajaran dengan topik pertanyaan pertama yang diperkenalkan oleh עַל.
