source:
  edition: WLC
  text: אָנָּ֣א אֲדֹנָ֗/י תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַ֠שֶּׁבֶת אֶל תְּפִלַּ֨ת עַבְדְּ/ךָ֜ וְ/אֶל תְּפִלַּ֣ת עֲבָדֶ֗י/ךָ הַֽ/חֲפֵצִים֙ לְ/יִרְאָ֣ה אֶת שְׁמֶ֔/ךָ וְ/הַצְלִֽיחָ/ה נָּ֤א לְ/עַבְדְּ/ךָ֙ הַ/יּ֔וֹם וּ/תְנֵ֣/הוּ לְ/רַחֲמִ֔ים לִ/פְנֵ֖י הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/אֲנִ֛י הָיִ֥יתִי מַשְׁקֶ֖ה לַ/מֶּֽלֶךְ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/011.yaml
  text: Please[a], Lord, let your ear be attentive to the prayer of your servant and to the prayer of your servants who delight to fear your name, and please give success to your servant today and grant him compassion before this man[c][b]. Now I was cupbearer to the king.
translation:
  language: id
  text: Ya Tuhan, kiranya telinga-Mu memperhatikan doa hamba-Mu dan doa hamba-hamba-Mu yang rindu untuk takut akan nama-Mu.[a] Kiranya Engkau membuat hamba-Mu berhasil hari ini dan mengaruniakan kepadanya belas kasihan di hadapan orang ini.[b][c] Ketika itu, aku adalah juru minuman raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang ingin menghormati nama-Mu” atau “yang suka gentar di hadapan nama-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “buatlah ia mendapat belas kasihan di hadapan orang ini” atau “karuniakanlah kepadanya kemurahan dari orang ini.” Secara harfiah, ungkapan Ibrani berbicara tentang memberikannya “untuk belas kasihan.”
    reason: lexical_alternative
  - marker: c
    text: “Orang ini” merujuk kepada raja, yang disebut pada klausa berikutnya sebagai raja yang dilayani Nehemia selaku juru minuman.
    reason: cross_reference
lexical_decisions:
- source_word: אָנָּא אֲדֹנָי
  choice: Ya Tuhan, kiranya
  rationale: אָנָּא adalah partikel permohonan yang sungguh-sungguh. Gabungan “Ya Tuhan, kiranya” menyampaikan seruan dan permohonan secara alami serta khidmat dalam bahasa Indonesia.
- source_word: תְּהִי נָא אָזְנְךָ קַשֶּׁבֶת
  choice: kiranya telinga-Mu memperhatikan
  rationale: Mempertahankan kiasan Ibrani tentang telinga yang memberi perhatian, sambil mengungkapkan permohonan agar Allah mendengarkan dengan berkenan.
- source_word: עַבְדְּךָ / עֲבָדֶיךָ
  choice: hamba-Mu / hamba-hamba-Mu
  rationale: Dalam doa ini עבד berfungsi sebagai sebutan diri yang rendah hati di hadapan Allah; “hamba” mempertahankan nuansa pengabdian tanpa menonjolkan status hukum perbudakan.
- source_word: הַחֲפֵצִים לְיִרְאָה אֶת שְׁמֶךָ
  choice: yang suka takut akan nama-Mu
  rationale: חפץ menyatakan kesukaan atau kerelaan, sedangkan ירא mencakup takut dan hormat. Rumusan ini mempertahankan ketegangan ungkapan Ibrani dan idiom teologis “takut akan nama-Mu”.
- source_word: וְהַצְלִיחָה נָּא לְעַבְדְּךָ הַיּוֹם
  choice: Kiranya buatlah hamba-Mu berhasil hari ini
  rationale: Bentuk kausatif dari צלח meminta Allah membuat usaha sang hamba berhasil; “buatlah ... berhasil” menyatakan kausalitas itu secara jelas.
- source_word: וּתְנֵהוּ לְרַחֲמִים
  choice: karuniakanlah kepadanya belas kasihan
  rationale: Terjemahan ini mempertahankan unsur נתן, “memberi/mengaruniakan,” dan רַחֲמִים, “belas kasihan,” termasuk peralihan ke orang ketiga yang terdapat dalam bahasa Ibrani.
- source_word: לִפְנֵי הָאִישׁ הַזֶּה
  choice: di hadapan orang ini
  rationale: Menerjemahkan ungkapan spasial-relasional secara dekat dan mempertahankan sebutan yang tidak langsung bagi raja.
- source_word: וַאֲנִי הָיִיתִי מַשְׁקֶה לַמֶּלֶךְ
  choice: Ketika itu, aku adalah juru minuman raja
  rationale: “Ketika itu” menandai peralihan dari doa kepada keterangan naratif. “Juru minuman raja” adalah sebutan jabatan yang jelas dan lazim.
theological_decisions:
- issue: Makna עבד dalam bahasa doa
  choice: hamba
  alternative: budak
  rationale: Konteks menonjolkan kerendahan hati dan pengabdian Nehemia beserta umat Allah, bukan status hukum perbudakan.
- issue: Makna ירא ketika diarahkan kepada nama Allah
  choice: takut akan nama-Mu
  alternative: menghormati nama-Mu; gentar di hadapan nama-Mu
  rationale: “Takut” mempertahankan keluasan ungkapan Ibrani, yang meliputi rasa gentar sekaligus hormat, tanpa mempersempitnya menjadi penghormatan saja.
- issue: Rujukan pronomina dalam וּתְנֵהוּ
  choice: kepadanya
  alternative: kepadaku
  rationale: Teks Ibrani memakai sufiks orang ketiga tunggal yang merujuk kembali kepada “hamba-Mu,” yakni Nehemia. Bentuk orang ketiga dipertahankan agar pergeseran retoris itu tidak dihapus.
translation_notes:
  register: Bahasa doa dibuat khidmat tetapi tetap modern. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Kiasan “telinga-Mu” dan ungkapan “takut akan nama-Mu” dipertahankan karena keduanya mudah dipahami dan memiliki bobot sastra-teologis.
