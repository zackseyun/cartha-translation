  text: זְכָר נָא֙ אֶת הַ/דָּבָ֔ר אֲשֶׁ֥ר צִוִּ֛יתָ אֶת מֹשֶׁ֥ה עַבְדְּ/ךָ֖ לֵ/אמֹ֑ר אַתֶּ֣ם תִּמְעָ֔לוּ אֲנִ֕י אָפִ֥יץ אֶתְ/כֶ֖ם בָּ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/008.yaml
  text: Please remember the word that you commanded your servant Moses[a], saying, ‘If you act unfaithfully[b], I will scatter you among the peoples.’
translation:
  language: id
  text: Ingatlah kiranya perkataan yang telah Kauperintahkan kepada Musa, hamba-Mu, ketika Engkau berfirman, “Jika kalian berlaku tidak setia[a], Aku akan menyerakkan kalian di antara bangsa-bangsa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak setia” atau “melanggar kesetiaan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di antara berbagai suku bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר נָא
  choice: Ingatlah kiranya
  rationale: Bentuk imperatif זְכָר menyatakan permohonan agar Allah mengingat, sedangkan נָא memberi nuansa permohonan yang hormat. “Ingatlah kiranya” alami dalam ragam doa yang khidmat.
- source_word: הַדָּבָר
  choice: firman
  rationale: דָּבָר dapat berarti perkataan, hal, atau perkara. Dalam konteks perkataan ilahi yang disampaikan kepada Musa, “firman” tepat dan tetap cukup luas.
- source_word: צִוִּיתָ
  choice: Kauperintahkan
  rationale: Kata kerja צוה secara langsung berarti memerintahkan. Bentuk dengan “Kau-” mempertahankan sapaan langsung kepada Allah.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: עבד dalam sebutan bagi Musa menunjuk pada pelayan Allah, bukan terutama status perbudakan. “Hamba-Mu” merupakan padanan yang wajar dan bermartabat.
- source_word: לֵאמֹר
  choice: dengan mengatakan
  rationale: Infinitif ini memperkenalkan isi perkataan. Padanan tersebut mempertahankan bentuk eksplisit teks Ibrani tanpa terdengar kaku.
- source_word: תִּמְעָלוּ
  choice: kalian berlaku tidak setia
  rationale: מעל menyatakan tindakan melanggar kesetiaan, khususnya dalam hubungan perjanjian. “Berlaku tidak setia” mempertahankan nuansa tindakan dan tidak mereduksinya menjadi dosa secara umum.
- source_word: אָפִיץ
  choice: Aku akan menyerakkan
  rationale: Bentuk Hifil dari פוץ berarti menyebabkan tersebar atau menyerakkan. “Menyerakkan” sesuai dengan bahasa penghukuman perjanjian dan tetap mudah dipahami.
- source_word: בָּעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak עַמִּים menunjuk pada berbagai kelompok bangsa atau suku bangsa. “Bangsa-bangsa” merupakan ungkapan Indonesia yang alami; alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Nuansa pelanggaran perjanjian dalam מעל
  choice: Jika kalian berlaku tidak setia
  alternative: Jika kalian tidak setia; Jika kalian mengkhianati kepercayaan
  rationale: Pilihan ini menjaga unsur tindakan dalam bentuk verbal Ibrani serta nuansa pelanggaran kesetiaan perjanjian, tanpa menentukan kategori hukum atau doktrin yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan wajar untuk doa. Kata ganti jamak “kalian” dipakai karena bentuk Ibraninya jamak, sementara kapitalisasi pada sapaan kepada Allah mengikuti konvensi penerbitan Alkitab bahasa Indonesia. Semua penanda catatan kaki muncul dalam teks utama.
