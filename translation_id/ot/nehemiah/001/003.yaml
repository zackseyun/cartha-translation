  text: וַ/יֹּאמְרוּ֮ לִ/י֒ הַֽ/נִּשְׁאָרִ֞ים אֲשֶֽׁר נִשְׁאֲר֤וּ מִן הַ/שְּׁבִי֙ שָׁ֣ם בַּ/מְּדִינָ֔ה בְּ/רָעָ֥ה גְדֹלָ֖ה וּ/בְ/חֶרְפָּ֑ה וְ/חוֹמַ֤ת יְרוּשָׁלִַ֨ם֙ מְפֹרָ֔צֶת וּ/שְׁעָרֶ֖י/הָ נִצְּת֥וּ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/003.yaml
  text: And they said to me[a], “The remnant there in the province who survived the captivity are in great trouble and disgrace, and the wall of Jerusalem is broken down[b], and its gates have been burned with fire.”
translation:
  language: id
  text: Mereka berkata kepadaku, “Orang-orang yang tersisa, yang selamat dari pembuangan[a], berada di sana, di provinsi itu, dalam kesusahan besar dan kehinaan. Tembok Yerusalem telah ditembus[b], dan gerbang-gerbangnya telah dibakar dengan api.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penawanan.” Kata Ibrani ini dapat menunjuk pada keadaan sebagai tawanan atau pada pembuangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah jebol” atau “telah runtuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים אֲשֶׁר נִשְׁאֲרוּ
  choice: orang-orang yang tersisa, yang selamat
  rationale: Dua bentuk dari akar שׁאר menyatakan mereka yang tertinggal setelah malapetaka. Terjemahan ini mempertahankan pengulangan maknanya tanpa terdengar kaku dalam bahasa Indonesia.
- source_word: מִן הַשְּׁבִי
  choice: dari pembuangan
  rationale: Dalam konteks kepulangan ke Yehuda, frasa ini secara alami menunjuk pada pembuangan; kemungkinan arti ‘penawanan’ tetap dicatat dalam catatan kaki.
- source_word: בַּמְּדִינָה
  choice: di provinsi itu
  rationale: Dalam konteks pemerintahan Persia, מְדִינָה adalah wilayah administratif, sehingga ‘provinsi’ merupakan padanan historis yang tepat.
- source_word: בְּרָעָה גְדֹלָה
  choice: mengalami kesusahan besar
  rationale: רָעָה di sini menyatakan keadaan buruk atau penderitaan berat, bukan kejahatan moral. Ungkapan ‘mengalami kesusahan besar’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וּבְחֶרְפָּה
  choice: dan kehinaan
  rationale: חֶרְפָּה menunjuk pada aib atau celaan publik. ‘Kehinaan’ menyampaikan keadaan sosial yang memalukan tanpa mempersempitnya menjadi perasaan subjektif semata.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: Tembok Yerusalem
  rationale: Bentuk tunggal kolektif ini menunjuk pada sistem pertahanan kota Yerusalem.
- source_word: מְפֹרָצֶת
  choice: telah jebol
  rationale: Partisip pasif dari פרץ menggambarkan tembok yang diterobos atau terbuka karena kerusakan. ‘Telah jebol’ menyatakan pelanggaran pada tembok sekaligus keadaan yang masih berlangsung.
- source_word: וּשְׁעָרֶיהָ נִצְּתוּ בָאֵשׁ
  choice: dan pintu-pintu gerbangnya telah dibakar dengan api
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang eksplisit tentang pembakaran dan menampilkan akibat sekarang dari tindakan lampau.
- source_word: וַיֹּאמְרוּ לִי
  choice: Mereka berkata kepadaku
  rationale: Bentuk naratif ini secara sederhana melanjutkan alur laporan tanpa menambahkan nuansa temporal yang tidak diperlukan.
