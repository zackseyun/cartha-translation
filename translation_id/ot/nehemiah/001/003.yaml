  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah administratif ‘provinsi’ mempertahankan latar zaman Persia. Pilihan ‘jebol’ menyampaikan kerusakan pertahanan kota secara konkret, sedangkan catatan kaki mempertahankan kemungkinan padanan lain.
