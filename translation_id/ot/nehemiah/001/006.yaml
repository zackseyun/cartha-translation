- from: Biarlah telinga-Mu memperhatikan dan mata-Mu terbuka untuk mendengarkan doa hamba-Mu yang kupanjatkan di hadapan-Mu sekarang, siang dan malam, bagi anak-anak Israel,[a] hamba-hamba-Mu, sambil mengakui dosa-dosa anak-anak Israel yang telah kami lakukan terhadap-Mu. Aku dan kaum keluargaku pun telah berdosa.
