language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תְּהִ֣י נָ֣א אָזְנְ/ךָֽ קַשֶּׁ֣בֶת וְֽ/עֵינֶ֪י/ךָ פְתֻוּח֟וֹת לִ/שְׁמֹ֣עַ אֶל תְּפִלַּ֣ת עַבְדְּ/ךָ֡ אֲשֶׁ֣ר אָנֹכִי֩ מִתְפַּלֵּ֨ל לְ/פָנֶ֤י/ךָ הַ/יּוֹם֙ יוֹמָ֣ם וָ/לַ֔יְלָה עַל בְּנֵ֥י יִשְׂרָאֵ֖ל עֲבָדֶ֑י/ךָ וּ/מִתְוַדֶּ֗ה עַל חַטֹּ֤אות בְּנֵֽי יִשְׂרָאֵל֙ אֲשֶׁ֣ר חָטָ֣אנוּ לָ֔/ךְ וַ/אֲנִ֥י וּ/בֵית אָבִ֖/י חָטָֽאנוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/006.yaml
  text: Please let your ear be attentive and your eyes open to hear the prayer of your servant that I am now praying before you day and night, for the sons of Israel, your servants, while confessing the sins of the sons of Israel that we have sinned against you. I and my father's house have sinned.
translation:
  language: id
  text: Biarlah telinga-Mu memperhatikan dan mata-Mu terbuka untuk mendengarkan doa hamba-Mu yang kupanjatkan di hadapan-Mu hari ini, siang dan malam, bagi anak-anak Israel,[a] hamba-hamba-Mu, sambil mengakui dosa-dosa anak-anak Israel yang telah kami perbuat terhadap-Mu. Aku dan keluarga ayahku telah berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “umat Israel” atau “orang-orang Israel”. Secara harfiah: “anak-anak Israel”, sebuah ungkapan kekerabatan perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהִי נָא
  choice: Biarlah
  rationale: Bentuk jusif dengan נָא menyatakan permohonan yang sopan; “Biarlah” mempertahankan daya volitif dan nada doa secara wajar dalam bahasa Indonesia.
- source_word: אָזְנְךָ קַשֶּׁבֶת וְעֵינֶיךָ פְתֻוּחוֹת
  choice: telinga-Mu memperhatikan dan mata-Mu terbuka
  rationale: Mempertahankan paralelisme antropomorfis sumber. “Memperhatikan” mengungkapkan קַשֶּׁבֶת secara alami, sedangkan “terbuka” mencerminkan bentuk partisip pasif.
- source_word: לִשְׁמֹעַ אֶל תְּפִלַּת עַבְדְּךָ
  choice: untuk mendengarkan doa hamba-Mu
  rationale: “Mendengarkan” di sini menyiratkan perhatian terhadap permohonan, dan “hamba” sesuai dengan konteks penghormatan dalam doa.
- source_word: אֲשֶׁר אָנֹכִי מִתְפַּלֵּל לְפָנֶיךָ הַיּוֹם יוֹמָם וָלַיְלָה
  choice: yang kupanjatkan di hadapan-Mu sekarang, siang dan malam
  rationale: Partisip menunjukkan tindakan yang sedang berlangsung. “Sekarang” mewakili הַיּוֹם dalam latar doa kini, sementara “siang dan malam” mempertahankan ungkapan kesinambungan.
- source_word: עַל בְּנֵי יִשְׂרָאֵל עֲבָדֶיךָ
  choice: bagi anak-anak Israel, hamba-hamba-Mu
  rationale: עַל dipahami sebagai doa bagi atau atas nama mereka. “Anak-anak Israel” mempertahankan ungkapan kekerabatan perjanjian tanpa terdengar tidak wajar dalam bahasa Indonesia.
- source_word: וּמִתְוַדֶּה
  choice: sambil mengakui
  rationale: Partisip ini sejajar dengan tindakan berdoa dan menyatakan tindakan serentak; “sambil” membuat hubungan itu jelas.
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: yang telah kami lakukan terhadap-Mu
  rationale: Dalam hubungan dengan “dosa-dosa”, rumusan ini menghasilkan bahasa Indonesia yang gramatikal serta mempertahankan arah pelanggaran kepada Allah.
- source_word: וַאֲנִי וּבֵית אָבִי חָטָאנוּ
  choice: Aku dan kaum keluargaku pun telah berdosa
  rationale: בֵית אָבִי menunjuk pada rumah atau garis keluarga pihak ayah. “Kaum keluargaku” menyampaikan cakupannya secara alami; “pun” mengungkapkan masuknya Nehemia dan keluarganya dalam pengakuan tanpa memaksakan penekanan berlebihan.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah
  choice: Mempertahankan “telinga-Mu” dan “mata-Mu”
  alternative: Memparafrasakan seluruhnya sebagai “perhatikanlah”
  rationale: Gambaran tubuh merupakan bagian dari retorika doa Ibrani dan menyatakan perhatian ilahi tanpa perlu diterangkan atau dihilangkan.
- issue: Makna בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: umat Israel / orang Israel
  rationale: Pilihan ini mempertahankan metafora kekerabatan yang eksplisit dalam teks Ibrani, sementara catatan kaki memberi padanan kolektif yang lazim.
- issue: Cakupan pengakuan dosa Nehemia
  choice: Aku dan kaum keluargaku pun telah berdosa
  alternative: bahkan aku dan keluarga ayahku telah berdosa
  rationale: Teks memasukkan Nehemia beserta בית אביו ke dalam kesalahan kolektif. “Pun” menjaga penambahan diri dan keluarganya tanpa menjadikan וַאֲנִי sebagai penekanan yang pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab Indonesia. Struktur doa dan citraan sumber dipertahankan, tetapi susunan kalimat dibuat alami bagi pembaca masa kini.
