  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan unsur-unsur Ibrani: וְהֵם sebagai penghubung bernuansa resumtif/kontrastif (“Namun, mereka”), עֲבָדֶיךָ dan עַמֶּךָ sebagai “hamba-hamba-Mu dan umat-Mu,” serta פָּדִיתָ sebagai “telah Kautebus.” Sarana ilahi, “dengan kuasa-Mu yang besar dan dengan tangan-Mu yang kuat,” mempertahankan paralelisme dan citra Ibrani. Aspek perfektif “telah” wajar dalam konteks tindakan penyelamatan masa lampau.'
