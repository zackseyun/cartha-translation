id: NEH.1.10
reference: Nehemiah 1:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הֵ֥ם עֲבָדֶ֖י/ךָ וְ/עַמֶּ֑/ךָ אֲשֶׁ֤ר פָּדִ֨יתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּד֔וֹל וּ/בְ/יָדְ/ךָ֖ הַ/חֲזָקָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/010.yaml
  text: But they are your servants and your people[b][a], whom you redeemed by your great power and by your strong hand.
translation:
  language: id
  text: Namun, mereka adalah hamba-hamba-Mu dan umat-Mu, yang telah Kautebus dengan kuasa-Mu yang besar dan dengan tangan-Mu yang kuat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “tangan-Mu yang perkasa”; secara harfiah: “tangan-Mu yang kuat”, ungkapan yang menggambarkan tindakan Allah yang penuh kuasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Namun, mereka
  rationale: 'Konjungsi menghubungkan ayat ini dengan pengakuan sebelumnya dan dalam konteks memiliki nuansa kontras: sekalipun umat itu berdosa dan tercerai-berai, mereka tetap milik Allah.'
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Kata עבד dapat berarti budak atau hamba, tetapi di sini yang ditonjolkan ialah hubungan umat dengan Allah; 'hamba-hamba' paling wajar dan sesuai dalam konteks doa.
- source_word: וְעַמֶּךָ
  choice: dan umat-Mu
  rationale: Dalam konteks perjanjian, עם menunjuk pada komunitas yang menjadi milik Allah; 'umat' menyampaikan nuansa ini secara alami.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini secara alami mengacu pada hamba-hamba dan umat Allah dalam bahasa Indonesia.
- source_word: פָּדִיתָ
  choice: telah Kautebus
  rationale: Kata פדה mengandung arti membebaskan atau memperoleh pembebasan, dan dalam konteks ini menggemakan tindakan penyelamatan Allah terhadap umat-Nya tanpa menentukan rincian teologis yang tidak dinyatakan.
- source_word: בְּכֹחֲךָ הַגָּדוֹל
  choice: dengan kuasa-Mu yang besar
  rationale: כח berarti kekuatan atau kuasa; 'kuasa' merupakan padanan alami untuk kemampuan Allah yang bekerja, sedangkan preposisi 'dengan' menyatakan sarana.
- source_word: וּבְיָדְךָ הַחֲזָקָה
  choice: dan dengan tangan-Mu yang kuat
  rationale: Terjemahan ini mempertahankan gambaran antropomorfis Ibrani tentang tindakan Allah yang penuh kuasa; 'kuat' mencerminkan חזקה secara langsung.
theological_decisions:
- issue: Bahasa penebusan dalam doa Nehemia
  choice: Kautebus
  alternative: Kaubebaskan; Kautebus dengan membayar tebusan
  rationale: Ayat ini mengingat tindakan historis Allah dalam membebaskan umat perjanjian-Nya, kemungkinan dengan gema peristiwa keluaran. 'Tebus' mempertahankan bobot teologis dan keluasan makna verba Ibrani tanpa memasukkan rincian doktrinal yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat namun mudah dipahami. Bentuk sapaan ilahi ditulis dengan kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Penempatan penanda catatan kaki mengikuti frasa 'tangan-Mu yang kuat' yang dijelaskannya.
