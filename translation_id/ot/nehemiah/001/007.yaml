base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/007.yaml
  text: We have acted very corruptly against you and have not kept the commandments[a], the statutes[b], and the judgments that you commanded your servant Moses.
translation:
  language: id
  text: Kami telah bertindak sangat jahat[a] terhadap-Mu dan tidak menaati perintah-perintah, ketetapan-ketetapan, dan peraturan-peraturan[b] yang telah Kauperintahkan kepada Musa, hamba-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kami telah bertindak dengan sangat jahat.” Teks Ibrani memakai infinitif absolut bersama verba finit untuk penegasan.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “keputusan-keputusan hukum”, “ketetapan-ketetapan hukum”, atau “hukum-hukum kasus”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲבֹל חָבַלְנוּ
  choice: Kami telah berlaku sangat jahat
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kuatnya tindakan. Ungkapan ini menyampaikan perilaku yang sangat buruk atau merusak dalam bahasa Indonesia yang alami tanpa meniru pengulangan Ibrani secara kaku.
- source_word: לָךְ
  choice: terhadap-Mu
  rationale: Preposisi ini menunjukkan bahwa pelanggaran tersebut tertuju kepada Allah. “Terhadap-Mu” alami dalam konteks pengakuan dosa dan tetap dekat dengan bentuk Ibrani.
- source_word: וְלֹא שָׁמַרְנוּ
  choice: dan tidak menaati
  rationale: Dalam hubungan dengan hukum atau perintah, שׁמר berarti memelihara, menjalankan, atau menaati. “Menaati” paling langsung dan wajar bagi pembaca modern.
- source_word: הַמִּצְוֺת
  choice: perintah-perintah
  rationale: Istilah ini menunjuk kepada kewajiban yang diperintahkan dan mempertahankan nuansa otoritas ilahi.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: חֻקִּים menunjuk kepada ketentuan yang ditetapkan. “Ketetapan-ketetapan” menjaga corak hukum dan membedakannya dari dua istilah lain.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: מִשְׁפָּטִים dapat menunjuk kepada keputusan hukum, hukum kasus, atau peraturan. “Peraturan-peraturan” dapat dipahami pembaca umum dan tidak tumpang tindih sepenuhnya dengan “ketetapan-ketetapan”.
- source_word: צִוִּיתָ אֶת מֹשֶׁה
  choice: yang Kauperintahkan kepada Musa
  rationale: Konstruksi Ibrani menyatakan bahwa Allah memberikan perintah itu kepada Musa; bentuk ini mempertahankan otoritas langsung Allah dan perantaraan Musa.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Bagi Musa dalam hubungannya dengan Allah, “hamba” merupakan padanan yang tepat dan bermartabat, dengan penekanan pada pelayanan yang diamanatkan.
theological_decisions:
- issue: Pembedaan tiga istilah hukum Taurat
  choice: perintah-perintah, ketetapan-ketetapan, serta peraturan-peraturan
  alternative: perintah, ketetapan, dan keputusan hukum
  rationale: Teks Ibrani memakai tiga istilah berbeda. Terjemahan mempertahankan tekstur hukum-perjanjian itu tanpa menjadikannya tiga kategori doktrinal yang kaku.
- issue: Arah pelanggaran dalam pengakuan dosa
  choice: terhadap-Mu
  alternative: kepada-Mu
  rationale: “Terhadap-Mu” menyampaikan bahwa perilaku Israel merupakan pelanggaran relasional kepada Allah, tetapi tidak menambahkan penjelasan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa pengakuan yang khidmat. Bentuk pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Pengulangan bentuk jamak pada tiga istilah hukum dipertahankan untuk mencerminkan artikel dan bentuk jamak Ibrani, sedangkan penekanan idiom Ibrani disampaikan dengan kata “sangat”.
