id: NEH.1.4
reference: Nehemiah 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֞י כְּ/שָׁמְעִ֣/י אֶת הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה יָשַׁ֨בְתִּי֙ וָֽ/אֶבְכֶּ֔ה וָ/אֶתְאַבְּלָ֖/ה יָמִ֑ים וָֽ/אֱהִ֥י צָם֙ וּ/מִתְפַּלֵּ֔ל לִ/פְנֵ֖י אֱלֹהֵ֥י הַ/שָּׁמָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/001/004.yaml
  text: And when I heard these words[a], I sat down and wept and mourned for days[b], and I was fasting and praying before the God of heaven.
translation:
  language: id
  text: Ketika mendengar hal-hal itu[a], aku duduk, menangis, dan berkabung selama berhari-hari. Aku terus berpuasa dan berdoa[b] di hadapan Allah semesta langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan-perkataan itu.” Kata Ibrani דְּבָרִים dapat berarti “perkataan,” “perkara,” atau “hal.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih sederhana dapat diterjemahkan “aku berpuasa dan berdoa.” Bentuk Ibraninya menggambarkan tindakan yang sedang berlangsung atau dilakukan terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעִי
  choice: Ketika mendengar
  rationale: Konstruksi naratif dengan היה dan כְּ + infinitif membentuk keterangan waktu. “Ketika mendengar” menyampaikan urutan peristiwa secara alami tanpa ungkapan kaku “terjadilah ketika”.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: hal-hal itu
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal. Dalam konteks ini frasa tersebut menunjuk pada isi laporan yang baru disampaikan; “hal-hal itu” alami dalam bahasa Indonesia dan tetap mempertahankan keluasan maknanya.
- source_word: יָשַׁבְתִּי
  choice: aku duduk
  rationale: ישׁב pada dasarnya berarti duduk, tinggal, atau menetap. Di sini tindakan fisik duduk merupakan tanggapan langsung Nehemia terhadap berita yang didengarnya.
- source_word: וָאֶבְכֶּה
  choice: menangis
  rationale: בכה adalah kata kerja umum untuk menangis. Pilihan ini tepat, alami, dan sesuai dengan suasana ratapan.
- source_word: וָאֶתְאַבְּלָה יָמִים
  choice: berkabung selama berhari-hari
  rationale: אבל menyatakan perkabungan atau dukacita yang mendalam, sedangkan יָמִים berfungsi adverbial untuk menunjukkan jangka waktu. “Selama berhari-hari” menyampaikan durasi tersebut secara wajar.
- source_word: וָאֱהִי צָם וּמִתְפַּלֵּל
  choice: Aku terus berpuasa dan berdoa
  rationale: היה yang diikuti dua partisip menyajikan tindakan yang berlangsung atau berkelanjutan. Kata “terus” mengungkapkan aspek duratif itu dengan jelas dalam bahasa Indonesia.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: לִפְנֵי berarti di depan atau di hadapan. “Di hadapan” mempertahankan nuansa berada dalam hadirat Allah dan lazim digunakan dalam konteks doa.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Allah semesta langit
  rationale: Frasa konstruksi ini merupakan gelar ilahi yang khas dalam Ezra–Nehemia. “Allah semesta langit” mempertahankan hubungan genitif tanpa menambahkan gagasan seperti “Penguasa” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֱלֹהֵי הַשָּׁמָיִם
  choice: Allah semesta langit
  alternative: Allah yang di surga
  rationale: Teks memakai gelar bagi Allah, bukan nama ilahi YHWH. Pilihan ini mempertahankan bentuk gelar serta cakupan jamak הַשָּׁמָיִם, dan tidak memasukkan nama perjanjian atau konsep tambahan yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pronomina “aku” mengikuti tuturan orang pertama Nehemia. Struktur kalimat dibagi dua agar rangkaian tindakan emosional dan ibadah terbaca jelas, sementara aspek berkelanjutan pada puasa dan doa tetap dipertahankan.
