revisions:
- from: Pada hari itu, beberapa orang ditunjuk untuk mengawasi ruang-ruang perbendaharaan[a] bagi persembahan khusus, hasil pertama, dan persepuluhan. Mereka harus mengumpulkan ke dalam ruang-ruang itu, dari ladang-ladang milik kota-kota, bagian-bagian yang ditetapkan oleh Taurat[b] bagi para imam dan orang-orang Lewi. Sebab, orang Yehuda bersukacita atas para imam dan orang-orang Lewi yang bertugas[c].
  to: Pada hari itu beberapa orang ditunjuk untuk mengawasi ruang-ruang perbendaharaan[a] bagi persembahan khusus, hasil pertama, dan persepuluhan, untuk mengumpulkan ke dalam ruang-ruang itu bagian-bagian yang ditetapkan oleh Taurat[b] bagi para imam dan orang-orang Lewi dari ladang-ladang milik kota-kota. Sebab orang Yehuda bersukacita karena para imam dan orang-orang Lewi yang bertugas[c].
  rationale: Revisi terbatas pada pemulihan fungsi infinitif Ibrani sebagai tujuan (“untuk mengumpulkan”), bukan kewajiban eksplisit, serta perbaikan idiom “bersukacita karena.” Susunan frasa tentang ladang dipindahkan agar “bagian-bagian ... dari ladang-ladang” terbaca lebih jelas dalam bahasa Indonesia tanpa mengubah cakupan makna. Semua penanda catatan kaki tetap melekat pada unsur yang dijelaskan.
