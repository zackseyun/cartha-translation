source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: id
  text: Pada hari itu beberapa orang ditunjuk untuk mengawasi ruang-ruang perbendaharaan[a] bagi persembahan khusus, hasil pertama, dan persepuluhan, untuk mengumpulkan ke dalam ruang-ruang itu bagian-bagian yang ditetapkan oleh Taurat[b] bagi para imam dan orang-orang Lewi dari ladang-ladang milik kota-kota. Sebab orang Yehuda bersukacita karena para imam dan orang-orang Lewi yang bertugas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bilik-bilik untuk perbendaharaan.” Istilah Ibraninya dapat menunjuk ruang atau bilik; di sini fungsinya sebagai tempat penyimpanan menonjol.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagian-bagian Taurat,” yaitu jatah bagi para imam dan orang-orang Lewi yang ditetapkan dalam Taurat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang berdiri.” Dalam konteks pelayanan Bait Allah, ungkapan ini berarti berdiri untuk melayani atau menjalankan tugas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: ditunjuk
  rationale: Bentuk pasif verba פקד di sini menyatakan penetapan orang untuk suatu tanggung jawab administratif.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Menunjukkan sejumlah orang yang tidak disebutkan namanya; dalam konteks ini bahasa Indonesia tidak perlu menandai jenis kelamin secara eksplisit.
- source_word: הַנְּשָׁכוֹת לָאֹצָרוֹת
  choice: ruang-ruang perbendaharaan
  rationale: Menggabungkan gagasan bilik atau ruang dengan fungsi penyimpanan harta dan persembahan, tanpa menambahkan kelompok bangunan yang terpisah.
- source_word: לַתְּרוּמוֹת
  choice: bagi persembahan khusus
  rationale: תְּרוּמָה adalah bagian yang dikhususkan dan diserahkan untuk keperluan kudus; 'persembahan khusus' lebih jelas daripada istilah teknis yang asing.
- source_word: לָרֵאשִׁית
  choice: hasil pertama
  rationale: Dalam konteks hasil pertanian, istilah ini menunjuk bagian pertama dari hasil panen yang dipersembahkan.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: dan persepuluhan
  rationale: Padanan Indonesia yang lazim dan tepat untuk pungutan sepersepuluh.
- source_word: לִכְנוֹס בָּהֶם
  choice: mengumpulkan ke dalam ruang-ruang itu
  rationale: Mempertahankan tindakan pengumpulan sekaligus arah masuk yang dinyatakan oleh preposisi dan pronomina Ibrani.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: dari ladang-ladang milik kota-kota
  rationale: Menjelaskan bahwa yang dimaksud ialah lahan pertanian yang terkait dengan kota-kota, bukan ladang yang berada di dalam kawasan perkotaan.
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: bagian-bagian yang ditetapkan oleh Taurat
  rationale: 'Mengungkapkan secara wajar hubungan genitif: bagian atau jatah yang ketentuannya terdapat dalam Taurat.'
- source_word: הָעֹמְדִים
  choice: yang bertugas
  rationale: Secara harfiah berarti 'yang berdiri', tetapi dalam lingkungan Bait Allah menunjuk mereka yang hadir untuk menjalankan pelayanan.
theological_decisions:
- issue: Makna הַתּוֹרָה dalam ketentuan bagi imam dan orang Lewi
  choice: Taurat
  alternative: hukum
  rationale: Kata itu menunjuk ketetapan dalam Taurat; transliterasi yang sudah dikenal mempertahankan warna historis tanpa membatasi maknanya pada hukum sipil.
- issue: Hubungan sukacita Yehuda dengan para pelayan Bait Allah
  choice: orang Yehuda bersukacita atas para imam dan orang-orang Lewi
  alternative: orang Yehuda senang kepada para imam dan orang-orang Lewi
  rationale: Mempertahankan ungkapan kausal dan objek sukacita tanpa menambahkan alasan atau penilaian teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami, sementara hubungan tujuan dan sebab tetap dipertahankan. 'Orang-orang Lewi' dipakai sebagai bentuk yang alami bagi khalayak umum.
