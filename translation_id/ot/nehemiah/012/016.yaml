translation_notes:
  register: Gaya ringkas dipertahankan sesuai bentuk daftar dalam teks Ibrani. Tanda titik dua memperjelas hubungan antara kaum imam dan orang yang mewakilinya. Nama עדיא dibaca sebagai Ido berdasarkan bentuk nama dalam konteks daftar ini, bukan Adaya.
