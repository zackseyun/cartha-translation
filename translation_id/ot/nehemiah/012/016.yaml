  text: for Iddo[a], Zechariah; for Ginnethon, Meshullam.
translation:
  language: id
  text: 'untuk kaum Adaya[a]: Zakharia; untuk kaum Gineton: Mesulam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar ini, bahasa Ibrani memakai kata depan ל־, yang dapat berarti “kepada”, “untuk”, atau “milik/dari”, sebelum nama-nama kaum. Di sini diterjemahkan “untuk kaum” untuk menunjukkan hubungan Zakharia dengan kaum Adaya dan Mesulam dengan kaum Gineton.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/עדיא
  choice: untuk kaum Ido
  rationale: Prefiks ל menandai hubungan perwakilan dalam daftar ini. Kata “kaum” ditambahkan secara kontekstual agar jelas bahwa Ido adalah nama keluarga imam yang diwakili, bukan orang yang menerima sesuatu.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Nama pribadi ini ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia; ia adalah wakil kaum Ido.
- source_word: לְ/גִנְּתוֹן
  choice: untuk kaum Gineton
  rationale: Sejajar dengan frasa pertama, ל dipahami sebagai penanda perwakilan atau keterkaitan dengan kaum imam tersebut.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama pribadi ditransliterasikan secara wajar ke dalam bahasa Indonesia; ia adalah wakil kaum Gineton.
