lexical_decisions:
- source_word: לְ/חִלְקִיָּה
  choice: untuk Hilkia
  rationale: 'Dalam daftar imam ini, prefiks לְ menandai hubungan atau perwakilan: Hasabya adalah wakil bagi keluarga atau kaum Hilkia. ''Untuk'' mempertahankan bentuk eliptis dan ambiguitas preposisi Ibrani.'
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia; שׁ direpresentasikan sebagai 's' sesuai konvensi nama Alkitab Indonesia.
- source_word: לִידַעְיָה
  choice: untuk Yedaya
  rationale: Seperti pada frasa pertama, prefiks לְ menunjukkan hubungan atau perwakilan dalam daftar, tanpa menjelaskan lebih jauh relasi yang hanya tersirat dalam teks.
- source_word: נְתַנְאֵל
  choice: Netanel
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang dekat dengan bunyi Ibrani.
