source:
  edition: WLC
  text: וּ/בִ/ימֵי֙ יֽוֹיָקִ֔ים הָי֥וּ כֹהֲנִ֖ים רָאשֵׁ֣י הָ/אָב֑וֹת לִ/שְׂרָיָ֣ה מְרָיָ֔ה לְ/יִרְמְיָ֖ה חֲנַנְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: id
  text: 'Pada zaman Yoyakim ada para imam yang menjadi kepala-kepala kaum keluarga: bagi Seraya, Meraya; bagi Yeremia, Hananya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: Pada zaman Yoyakim
  rationale: Ungkapan waktu Ibrani ini secara alami berarti 'pada zaman Yoyakim'; konjungsi pembuka tidak perlu diterjemahkan secara mekanis karena ayat ini melanjutkan daftar sebelumnya.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: para imam yang menjadi kepala kaum keluarga
  rationale: רָאשֵׁי menyatakan para pemimpin, sedangkan הָאָבוֹת dalam konteks silsilah menunjuk pada kelompok keluarga atau kaum leluhur, bukan sekadar ayah biologis.
- source_word: לִשְׂרָיָה ... לְיִרְמְיָה
  choice: untuk Seraya ... untuk Yeremia
  rationale: Preposisi לְ dipertahankan secara dekat sebagai 'untuk' karena hubungan tepat antara nama-nama dalam daftar ini tidak dinyatakan secara eksplisit dalam ayat.
- source_word: מְרָיָה
  choice: Meraya
  rationale: Transliterasi nama Ibrani mə·rā·yāh ke dalam bentuk Indonesia yang wajar.
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Mengikuti bentuk nama Alkitab yang lazim dalam bahasa Indonesia dan mencerminkan nama Ibrani ḥănanyāh.
theological_decisions:
- issue: Hubungan antara kepala kaum keluarga dan nama leluhur yang didahului לְ
  choice: Memakai 'untuk' tanpa menambahkan penjelasan
  alternative: Menerjemahkan 'dari kaum Seraya' atau 'mewakili Seraya'
  rationale: Teks hanya menandai hubungan dengan preposisi לְ; terjemahan yang lebih eksplisit dapat menutup ambiguitas administratif atau genealogis yang masih ada.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar dipertahankan dengan titik dua dan titik koma agar hubungan antarnama mudah dibaca.
