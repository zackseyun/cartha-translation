  text: וְ/עַל֩ שַׁ֨עַר הָ/עַ֜יִן וְ/נֶגְדָּ֗/ם עָלוּ֙ עַֽל מַעֲלוֹת֙ עִ֣יר דָּוִ֔יד בַּֽ/מַּעֲלֶ֖ה לַ/חוֹמָ֑ה מֵ/עַל֙ לְ/בֵ֣ית דָּוִ֔יד וְ/עַ֛ד שַׁ֥עַר הַ/מַּ֖יִם מִזְרָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: id
  text: Di Pintu Gerbang Mata Air[a], di depan mereka, mereka naik melalui tangga[b] Kota Daud, pada jalan menanjak menuju tembok, melewati sebelah atas rumah Daud, sampai ke Pintu Gerbang Air di sebelah timur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pintu Gerbang Sumber Air.” Kata Ibrani yang diterjemahkan “mata air” juga dapat berarti sumber air.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani dapat menunjuk tangga atau undakan, dan secara lebih umum juga dapat berarti jalan-jalan naik.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Pintu Gerbang Mata Air
  rationale: עַיִן dapat berarti mata air atau sumber air. “Pintu Gerbang Mata Air” merupakan nama tempat yang wajar dalam bahasa Indonesia dan sesuai dengan konteks topografi Yerusalem.
- source_word: וְנֶגְדָּם
  choice: lurus ke depan
  rationale: נֶגֶד dapat berarti di depan, berhadapan dengan, atau tepat di hadapan. Dalam uraian rute ini, “lurus ke depan” menyampaikan arah gerak secara alami tanpa menghilangkan hubungan spasialnya.
- source_word: עָלוּ
  choice: mereka naik
  rationale: Bentuk qal dari עלה berarti naik. Pilihan ini lugas dan mempertahankan gambaran pergerakan ke tempat yang lebih tinggi.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: tangga Kota Daud
  rationale: Bentuk jamak מַעֲלוֹת dapat menunjuk tangga atau undakan, dan dalam konteks perkotaan kemungkinan besar merupakan bangunan bertangga.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: pada jalan menanjak menuju tembok
  rationale: מַעֲלֶה menunjuk tanjakan atau jalan naik. “Menuju tembok” mempertahankan arah yang dinyatakan oleh prefiks ל dan terdengar alami dalam bahasa Indonesia.
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: melewati sebelah atas rumah Daud
  rationale: מֵעַל menyatakan posisi di atas atau pada sisi yang lebih tinggi. Dalam uraian rute, frasa ini paling wajar dipahami sebagai lintasan yang berada lebih tinggi daripada rumah Daud, tanpa mengidentifikasi rumah itu secara lebih khusus.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Pintu Gerbang Air di sebelah timur
  rationale: מִזְרָח berarti timur atau ke arah timur. Frasa ini mempertahankan kemungkinan bahwa keterangan tersebut menunjukkan letak gerbang di sisi timur.
- source_word: וְעַל
  choice: Di
  rationale: Dalam uraian topografi, עַל dapat menandai lokasi pada atau dekat suatu tempat. “Di” merupakan padanan Indonesia yang alami dan tidak memberi kesan bahwa rombongan berada secara harfiah di atas gerbang.
