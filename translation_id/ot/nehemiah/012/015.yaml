- source_word: עַדְנָא
  choice: Adna
  rationale: Nama diri Ibrani ditransliterasikan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לִ/מְרָיוֹת
  choice: untuk Merayot
  rationale: Prefiks לִ kembali menandai keluarga atau kaum imam yang diwakili oleh nama berikutnya. Bentuk Ibrani מְרָיוֹת ditransliterasikan sebagai Merayot.
- source_word: חֶלְקָי
  choice: Helkai
  rationale: Nama diri Ibrani ditransliterasikan sebagai Helkai, dengan mempertahankan bentuk nama dalam sumber.
