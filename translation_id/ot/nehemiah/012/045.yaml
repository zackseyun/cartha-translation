revisions:
- from: Mereka menjalankan tugas yang ditetapkan Allah mereka dan tugas pentahiran[a]; demikian juga para penyanyi dan para penjaga pintu gerbang[b], sesuai dengan perintah Daud dan Salomo, anaknya.
  to: Mereka menjalankan tugas pelayanan bagi Allah mereka dan tugas pentahiran[a]; demikian juga para penyanyi dan para penjaga pintu gerbang[b], sesuai dengan perintah Daud dan Salomo, putra Daud.
  rationale: Revisi menghindari penambahan bahwa Allah "menetapkan" tugas tersebut, sambil menyampaikan secara idiomatis tugas kultis yang berkenaan dengan Allah mereka. Istilah ritual "pentahiran," penjelasan elipsis, dan makna jabatan para penjaga gerbang dipertahankan. Penyebutan "putra Daud" menjelaskan rujukan בְנוֹ tanpa mengubah makna.
