source:
  edition: WLC
  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: id
  text: Mereka menjalankan tugas pelayanan bagi Allah mereka dan tugas pentahiran[a]; demikian juga para penyanyi dan para penjaga pintu gerbang[b], sesuai dengan perintah Daud dan Salomo, putra Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tugas penyucian” atau “tugas kemurnian.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya bersifat eliptis; kemungkinan besar maksudnya ialah bahwa kelompok-kelompok ini juga menjalankan tugas yang ditetapkan bagi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: menjalankan tugas yang ditetapkan
  rationale: Gabungan שׁמר dan מִשְׁמֶרֶת merupakan ungkapan tentang melaksanakan tanggung jawab yang dipercayakan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur penugasan.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Mempertahankan sufiks posesif Ibrani dan nuansa relasi umat dengan Allah tanpa menambah penekanan.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: dan tugas pentahiran
  rationale: הַטָּהֳרָה menunjuk pada pentahiran atau kemurnian ritual dalam konteks pelayanan Bait Allah. 'Pentahiran' mempertahankan dimensi ritualnya.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: demikian juga para penyanyi dan para penjaga pintu gerbang
  rationale: Frasa Ibrani ini eliptis. 'Demikian juga' secara wajar menyatakan bahwa kedua kelompok itu pun menjalankan tugas mereka, tanpa menghapus keelipsisan dari perhatian pembaca karena dicatat dalam catatan kaki.
- source_word: שֹׁעֲרִים
  choice: penjaga pintu gerbang
  rationale: Dalam konteks Bait Allah, istilah ini menunjuk pada petugas yang menjaga pintu-pintu gerbang, bukan sekadar penjaga umum.
- source_word: כְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: מִצְוָה di sini adalah ketetapan berwenang mengenai pelayanan Bait Allah; 'perintah' jelas, lazim, dan cukup formal.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: Daud dan Salomo, anaknya
  rationale: Mempertahankan urutan nama dalam teks Ibrani serta menjelaskan bahwa Salomo adalah anak Daud.
theological_decisions:
- issue: Makna הַטָּהֳרָה dalam konteks pelayanan Bait Allah
  choice: pentahiran
  alternative: kemurnian; penyucian
  rationale: Konteksnya adalah tugas liturgis dan keimaman, sehingga istilah ini terutama bernuansa ritual. 'Pentahiran' menyampaikan proses atau tata laku ritual tanpa memasukkan kategori doktrinal yang tidak dinyatakan teks.
- issue: Hubungan para penyanyi dan penjaga pintu gerbang dengan klausa sebelumnya
  choice: Mereka juga menjalankan tugas yang ditetapkan
  alternative: Mereka hanya disebut sebagai bagian dari susunan petugas tanpa pengulangan predikat
  rationale: Struktur Ibrani bersifat eliptis, tetapi konteks dan koordinasi kelompok paling wajar menunjukkan bahwa predikat sebelumnya berlaku juga bagi mereka. Ambiguitas sintaksis tetap diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Menjalankan tugas yang ditetapkan' dipilih agar idiom Ibrani mudah dipahami, sedangkan 'pentahiran' mempertahankan konteks ritual. Semua penanda catatan kaki dicantumkan dalam teks utama.
