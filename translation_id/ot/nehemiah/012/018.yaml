lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: untuk Bilga
  rationale: 'Dalam daftar para imam ini, prefiks לְ menunjukkan hubungan atau penugasan: orang yang disebut berikutnya mewakili keluarga atau kelompok tersebut. ''Untuk'' menyampaikan fungsi daftar ini secara wajar dalam bahasa Indonesia; nama Bilga ditransliterasikan.'
- source_word: שַׁמּוּעַ
  choice: Syamua
  rationale: Nama diri wakil yang berkaitan dengan keluarga atau kelompok sebelumnya; bentuk Ibrani ditransliterasikan sesuai ejaan Indonesia.
- source_word: לִֽ/שְׁמַעְיָה
  choice: untuk Semaya
  rationale: Seperti pada frasa pertama, prefiks לְ menyatakan hubungan perwakilan dalam daftar. 'Untuk' dipilih sebagai padanan Indonesia yang alami, sementara kemungkinan lebih harfiah 'dari' dicatat dalam catatan kaki.
- source_word: יְהוֹנָתָן
  choice: Yehonatan
  rationale: Teks Ibrani memakai bentuk lengkap יְהוֹנָתָן; 'Yehonatan' mempertahankan bentuk itu dan mengikuti kaidah transliterasi Indonesia, bukan memendekkannya menjadi 'Yonatan'.
