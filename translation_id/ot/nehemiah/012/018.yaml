  text: for Bilgah[a], Shammua; for Shemaiah[b], Jehonathan.
translation:
  language: id
  text: 'bagi Bilga[a]: Syamua; bagi Semaya: Yehonatan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari Bilga … dari Semaya.” Dalam daftar silsilah atau daftar perwakilan, kata depan Ibrani ini dapat diterjemahkan secara lebih harfiah demikian.
