  text: וַ/יֵּ֤לֶךְ אַחֲרֵי/הֶם֙ הוֹשַׁ֣עְיָ֔ה וַ/חֲצִ֖י שָׂרֵ֥י יְהוּדָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/032.yaml
  text: Hoshaiah and half of the officials of Judah went behind them[a].
translation:
  language: id
  text: Hosaya dan setengah dari para pemimpin Yehuda berjalan di belakang mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesudah mereka.” Bahasa Ibrani dapat menunjuk pada urutan orang-orang yang mengikuti; “di belakang mereka” memperjelas gambaran arak-arakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: berjalan
  rationale: Bentuk naratif dari הלך menyatakan gerak pada masa lampau. Dalam konteks arak-arakan, “berjalan” terdengar alami dan mempertahankan gambaran gerak fisik.
- source_word: אַחֲרֵיהֶם
  choice: di belakang mereka
  rationale: Preposisi אַחֲרֵי dengan akhiran pronominal dapat menyatakan posisi atau gerak mengikuti orang lain. “Di belakang mereka” memperjelas urutan fisik dalam arak-arakan, sedangkan “sesudah mereka” tetap merupakan kemungkinan.
- source_word: הוֹשַׁעְיָה
  choice: Hosaya
  rationale: Nama pribadi ditransliterasikan ke dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: וַחֲצִי
  choice: dan setengah dari
  rationale: חֲצִי berarti “setengah”; konjungsi prefiks menghubungkan Hosaya dengan kelompok berikutnya.
- source_word: שָׂרֵי
  choice: para pemimpin
  rationale: שַׂר dapat berarti pejabat, pemimpin, kepala, atau pangeran. “Para pemimpin” sesuai dengan konteks kepemimpinan sipil dan upacara tanpa menyiratkan bahwa mereka putra raja.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk baku bahasa Indonesia untuk nama wilayah dan suku יְהוּדָה.
