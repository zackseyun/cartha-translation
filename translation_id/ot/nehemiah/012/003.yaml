- source_word: רְחֻם
  choice: Rehum
  rationale: Nama diri; ditransliterasikan secara alami dalam ejaan Indonesia. Huruf h mempertahankan jejak konsonan ח tanpa memakai bentuk Inggris 'ch'.
- source_word: מְרֵמֹת
  choice: Meremot
  rationale: Nama diri; ditransliterasikan dari bentuk Ibrani dengan t pada akhir untuk ת, bukan mengikuti bentuk Inggris 'th'.
