  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: id
  text: Pada zaman Elyasib, Yoyada, Yohanan[a], dan Yadua, orang-orang Lewi dicatat[b] sebagai kepala-kepala kaum keluarga[c], dan para imam juga dicatat pada masa pemerintahan Darius, orang Persia itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian tradisi terjemahan memakai nama “Yonatan” di sini, tetapi teks Ibrani berbunyi “Yohanan.”
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “dituliskan” atau “didaftarkan.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepala-kepala kaum leluhur,” yaitu para pemimpin kelompok keluarga berdasarkan garis keturunan.
    reason: cultural_note
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk para anggota suku Lewi.
- source_word: בִּימֵי
  choice: Pada zaman
  rationale: Menyampaikan ungkapan waktu Ibrani secara alami sekaligus mempertahankan nuansa historisnya.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Elyasib, Yoyada, Yohanan, dan Yadua
  rationale: Nama-nama ditransliterasikan menurut bentuk Ibrani dan ejaan Indonesia; וְיוֹחָנָן mendukung 'Yohanan', bukan 'Yonatan'.
- source_word: כְּתוּבִים
  choice: dicatat
  rationale: Partisip pasif dari כתב menunjuk pada pencantuman dalam catatan tertulis, cocok dengan konteks administratif atau silsilah.
- source_word: רָאשֵׁי אָבוֹת
  choice: kepala kaum keluarga
  rationale: Padanan yang dapat dipahami pembaca modern bagi istilah teknis tentang pemimpin kelompok keluarga berdasarkan garis leluhur.
- source_word: וְהַכֹּהֲנִים
  choice: demikian juga para imam
  rationale: Klausa Ibrani bersifat eliptis; 'demikian juga' memasok secara wajar gagasan bahwa para imam pun dicatat tanpa menambahkan tindakan baru.
- source_word: עַל מַלְכוּת
  choice: pada masa pemerintahan
  rationale: Padanan idiomatis bagi keterangan kronologis yang mengacu pada masa seorang raja memerintah.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Darius, orang Persia itu
  rationale: Mempertahankan Darius sebagai nama diri dan הַפָּרְסִי sebagai sebutan etnis yang definit.
theological_decisions:
- issue: Hubungan keterangan waktu 'pada masa pemerintahan Darius' dengan klausa sebelumnya
  choice: Ditempatkan langsung sesudah 'para imam' sesuai urutan dan struktur Ibrani
  alternative: Menjadikannya keterangan waktu bagi seluruh ayat
  rationale: Teks Ibrani menempatkan frasa tersebut sesudah וְהַכֹּהֲנִים. Terjemahan ini mempertahankan kemungkinan bahwa frasa itu secara khusus menerangkan pencatatan para imam, tanpa memaksakan keterangan tersebut atas seluruh kalimat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik koma membantu mempertahankan struktur eliptis teks Ibrani serta membedakan pencatatan orang Lewi pada zaman para tokoh yang disebutkan dari pencatatan para imam pada masa pemerintahan Darius.
