lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: serta Azarya
  rationale: Konjungsi וַ melanjutkan daftar nama dari ayat sebelumnya; “serta” terasa alami karena fragmen ini merupakan kelanjutan daftar. Nama עֲזַרְיָה ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֶזְרָא
  choice: Ezra
  rationale: Nama diri ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia. Teks Ibrani tidak menaruh konjungsi sebelum nama ini.
- source_word: וּ/מְשֻׁלָּם
  choice: dan Mesulam
  rationale: Konjungsi וּ menandai unsur terakhir dalam daftar dan diterjemahkan “dan”; מְשֻׁלָּם ditransliterasikan sebagai “Mesulam” sesuai kebiasaan Indonesia.
