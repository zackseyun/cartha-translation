  source_fidelity: 'Teks Indonesia dengan tepat mengikuti pembacaan onomastik Teks Masoret: Bakbukya dan Uno disebut bersama, diikuti “saudara-saudara mereka,” dan frasa mengenai posisi mereka serta pembagian tugas. Tambahan “berdiri” adalah pelengkapan eliptis yang wajar dalam konteks daftar petugas dan tidak mengubah makna. Catatan kaki secara memadai mempertahankan kemungkinan pembacaan וענו sebagai verba.'
