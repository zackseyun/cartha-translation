  text: וּ/בַקְבֻּֽקְיָ֨ה ו/ענו אֲחֵי/הֶ֛ם לְ/נֶגְדָּ֖/ם לְ/מִשְׁמָרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/009.yaml
  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: id
  text: Bakbukya dan Uno[a], saudara-saudara mereka, berdiri berhadapan dengan mereka menurut kelompok-kelompok tugas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dan saudara-saudaranya menjawab mereka menurut kelompok-kelompok tugas,” jika וענו dibaca sebagai kata kerja, bukan sebagai nama diri Uno.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: Bakbukya
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia; konjungsi prefiks diterjemahkan dengan “dan”.
- source_word: ו/ענו
  choice: Uno
  rationale: Dipahami sebagai nama diri sesuai dengan susunan daftar orang Lewi dalam konteks ini. Konsonan yang sama juga mungkin dibaca sebagai bentuk verba; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan Ibrani beserta akhiran orang ketiga jamak tanpa mempersempitnya menjadi sekadar rekan sekelompok.
- source_word: לְנֶגְדָּם
  choice: berdiri berhadapan dengan mereka
  rationale: Frasa preposisional berarti berada di hadapan, berseberangan, atau bersesuaian dengan mereka. Kata “berdiri” dilengkapi secara wajar dari konteks penataan pelayanan.
- source_word: לְמִשְׁמָרוֹת
  choice: menurut kelompok-kelompok tugas
  rationale: Bentuk jamak מִשְׁמֶרֶת dapat menunjuk pada giliran, regu, atau pembagian tugas. Dalam konteks pelayanan bait, frasa ini menyampaikan penataan berdasarkan kelompok tugas tanpa membatasinya pada penjagaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang lugas dan bermartabat. Pengulangan “mereka” dipertahankan karena mencerminkan rujukan pronominal teks Ibrani, sedangkan “menurut kelompok-kelompok tugas” dipilih agar konteks pengaturan pelayanan dapat dipahami pembaca umum.
