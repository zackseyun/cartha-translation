id: NEH.12.7
reference: Nehemiah 12:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: סַלּ֣וּ עָמ֔וֹק חִלְקִיָּ֖ה יְדַֽעְיָ֑ה אֵ֣לֶּה רָאשֵׁ֧י הַ/כֹּהֲנִ֛ים וַ/אֲחֵי/הֶ֖ם בִּ/ימֵ֥י יֵשֽׁוּעַ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: id
  text: Salu, Amok, Hilkia, dan Yedaya. Mereka inilah para kepala imam dan saudara-saudara mereka pada zaman Yesua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesua adalah bentuk nama yang dipakai pada masa pascapembuangan dan berkaitan dengan nama Yosua.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Salu
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: עָמוֹק
  choice: Amok
  rationale: Nama diri ditransliterasikan langsung sesuai bentuk Ibrani.
- source_word: חִלְקִיָּה
  choice: Hilkia
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Transliterasi Indonesia mempertahankan bunyi awal yod sebagai 'Y'.
- source_word: רָאשֵׁי הַכֹּהֲנִים
  choice: para kepala imam
  rationale: Mempertahankan metafora Ibrani 'kepala' untuk para pemimpin di kalangan imam dan menghindari istilah teknis 'imam kepala' yang dapat membawa asosiasi kelembagaan dari masa lain.
- source_word: וַאֲחֵיהֶם
  choice: dan saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan harfiah serta ambiguitas apakah yang dimaksud saudara sedarah, kerabat, atau rekan sekelompok imam.
- source_word: בִּימֵי יֵשׁוּעַ
  choice: pada zaman Yesua
  rationale: Ungkapan waktu diterjemahkan secara alami, sedangkan nama pascapembuangan יֵשׁוּעַ ditransliterasikan sebagai Yesua.
theological_decisions:
- issue: Cakupan אֲחֵיהֶם dalam konteks kelompok imam
  choice: saudara-saudara mereka
  alternative: kerabat mereka; rekan-rekan imam mereka
  rationale: Teks Ibrani secara harfiah menyebut 'saudara-saudara mereka'. Terjemahan utama tidak mempersempit rujukannya menjadi rekan imam saja.
- issue: Makna kepemimpinan dalam רָאשֵׁי הַכֹּהֲנִים
  choice: para kepala imam
  alternative: para pemimpin imam; imam-imam kepala
  rationale: Pilihan ini mempertahankan citra leksikal sumber dan tidak menyamakan mereka secara otomatis dengan jabatan teknis 'imam-imam kepala' pada periode kemudian.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan daftar nama diikuti kalimat penjelas agar alami. Penanda catatan kaki [a] muncul dalam teks utama pada nama Yesua, yaitu unsur yang diterangkannya.
