  footnotes:
  - marker: a
    text: 'Teks Ibrani ayat ini hanya terdiri atas tiga nama diri dalam sebuah daftar: “Ido, Ginetoi, Abia.”'
    reason: cultural_note
  - marker: b
    text: Sejumlah terjemahan memakai bentuk lain untuk nama kedua, misalnya “Gineton”, kemungkinan karena dipengaruhi bentuk terkait di bagian lain. Teks Ibrani di ayat ini berbunyi Ginetoi.
    reason: alternative_reading
lexical_decisions:
- source_word: עִדּוֹא
  choice: Ido
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia; konsonan rangkap tidak perlu dipertahankan, dan alef akhir tidak menuntut vokal tambahan.
- source_word: גִנְּתוֹי
  choice: Ginetoi
  rationale: Mengikuti bentuk Masoret yang terdapat dalam ayat ini, גִנְּתוֹי, sambil menyesuaikan penggandaan konsonan dengan kebiasaan ejaan Indonesia.
- source_word: אֲבִיָּה
  choice: Abia
  rationale: Transliterasi yang lazim dan alami dalam bahasa Indonesia untuk nama Ibrani אֲבִיָּה; unsur yod tidak perlu ditampilkan sebagai huruf j seperti dalam ejaan Inggris.
