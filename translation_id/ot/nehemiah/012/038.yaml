base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: id
  text: Rombongan pengucap syukur yang kedua bergerak ke arah kiri[a]. Aku mengikuti rombongan itu dari belakang, bersama separuh rakyat, di atas tembok, mulai dari atas Menara Tungku sampai ke Tembok Lebar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rombongan syukur yang kedua” atau “paduan suara pengucap syukur yang kedua”. Istilah Ibraninya dapat menunjuk pada kelompok pengucap syukur dalam suatu arak-arakan seremonial, bukan hanya pada kegiatan bernyanyi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה
  choice: rombongan pengucap syukur
  rationale: Dalam konteks peresmian tembok, istilah ini menunjuk pada kelompok seremonial yang menyampaikan ucapan syukur sambil berarak, bukan semata-mata pada tindakan atau nyanyian syukur.
- source_word: הַשֵּׁנִית
  choice: yang kedua
  rationale: Bilangan tingkat ini menerangkan rombongan pengucap syukur.
- source_word: הַהוֹלֶכֶת
  choice: bergerak
  rationale: Bentuk partisip menggambarkan gerak rombongan yang sedang berlangsung; 'bergerak' alami untuk sebuah arak-arakan.
- source_word: לְמוֹאל
  choice: ke arah kiri
  rationale: Makna arah yang paling langsung ialah sisi kiri, selaras dengan dua rombongan yang bergerak ke arah berlawanan.
- source_word: אַחֲרֶיהָ
  choice: di belakangnya
  rationale: Ungkapan ini menunjukkan posisi Nehemia yang mengikuti rombongan tersebut.
- source_word: חֲצִי הָעָם
  choice: separuh rakyat
  rationale: Frasa konstruksi ini menyatakan setengah dari rakyat yang menyertai rombongan.
- source_word: מֵעַל לְהַחוֹמָה
  choice: di atas tembok
  rationale: Dalam konteks ini, rombongan berjalan di bagian atas tembok kota; terjemahan ini mempertahankan unsur posisi dari bahasa Ibrani.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Menara Tungku
  rationale: Nama lokasi ini secara harfiah menggabungkan 'menara' dengan bentuk jamak 'tungku'; bentuk nama diri yang ringkas dan transparan dipakai dalam bahasa Indonesia.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Tembok Lebar
  rationale: Frasa ini tampaknya merupakan nama bagian tertentu dari tembok Yerusalem, sehingga diperlakukan sebagai nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Rombongan pengucap syukur' dipilih untuk mempertahankan keluasan makna kelompok seremonial tanpa membatasi kelompok itu hanya sebagai paduan suara. Nama-nama bagian tembok ditulis sebagai nama diri.
