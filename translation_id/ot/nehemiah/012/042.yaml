source:
  edition: WLC
  text: וּ/מַעֲשֵׂיָ֨ה וּֽ/שְׁמַֽעְיָ֜ה וְ/אֶלְעָזָ֧ר וְ/עֻזִּ֛י וִֽ/יהוֹחָנָ֥ן וּ/מַלְכִּיָּ֖ה וְ/עֵילָ֣ם וָ/עָ֑זֶר וַ/יַּשְׁמִ֨יעוּ֙ הַ/מְשֹׁ֣רְרִ֔ים וְ/יִֽזְרַחְיָ֖ה הַ/פָּקִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/042.yaml
  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: id
  text: Maaseya, Semaya, Eleazar, Uzi, Yohanan, Malkia, Elam, dan Ezer. Para penyanyi memperdengarkan suara mereka[a], bersama Yizrahya, sang pengawas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bernyanyi dengan nyaring.” Kata kerja Ibrani berbentuk kausatif, secara harfiah berarti “membuat terdengar.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pejabat” atau “penanggung jawab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar dan lazim bagi pembaca Alkitab berbahasa Indonesia.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang mudah dibaca.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang sudah dikenal.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: יְהוֹחָנָן
  choice: Yohanan
  rationale: Nama diri ditransliterasikan dengan mempertahankan bentuk Ibrani yang mendasarinya.
- source_word: מַלְכִּיָּה
  choice: Malkia
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang alami.
- source_word: עֵילָם
  choice: Elam
  rationale: Dalam konteks ini kata tersebut merupakan nama orang, bukan nama wilayah.
- source_word: עָזֶר
  choice: Ezer
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: וַיַּשְׁמִיעוּ
  choice: memperdengarkan suara mereka
  rationale: Bentuk Hifil dari שמע secara harfiah menyatakan tindakan ‘membuat terdengar’. Ungkapan ini mempertahankan nuansa kausatif sekaligus terdengar alami dalam konteks para penyanyi.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Sebutan langsung bagi orang-orang yang menyanyi dalam konteks ibadah dan perarakan.
- source_word: יִזְרַחְיָה
  choice: Yizrahya
  rationale: Nama diri ditransliterasikan dengan cukup dekat pada bentuk Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: הַפָּקִיד
  choice: sang pengawas
  rationale: Kata פקיד menunjuk kepada orang yang ditunjuk untuk menjalankan tanggung jawab administratif atau pengawasan; ‘pengawas’ tidak melebih-lebihkan pangkatnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Nama-nama disesuaikan dengan pola transliterasi yang mudah dibaca oleh pembaca Indonesia. Struktur daftar dipertahankan, sedangkan ungkapan kausatif pada tindakan para penyanyi dibuat alami tanpa menghilangkan nuansa sumber.
