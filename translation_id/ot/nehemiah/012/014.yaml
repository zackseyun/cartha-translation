  text: for Malluchi[a], Jonathan; for Shebaniah, Joseph.
translation:
  language: id
  text: untuk keluarga Maluki[a], Yonatan; untuk keluarga Sebanya, Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari Maluki … dari Sebanya,” jika nama-nama berprefiks ל dipahami sebagai penanda garis keturunan, bukan pihak yang diwakili.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/מלוכי
  choice: untuk keluarga Maluki
  rationale: Prefiks ל dalam daftar para imam ini paling wajar dipahami sebagai penanda pihak yang diwakili; penambahan “keluarga” memperjelas bahwa Maluki adalah kelompok atau kaum imam yang diwakili oleh Yonatan. Ejaan Maluki mengikuti bentuk Ibrani secara wajar dalam bahasa Indonesia.
- source_word: יונתן
  choice: Yonatan
  rationale: Transliterasi baku dan mudah dikenali dalam bahasa Indonesia untuk יוֹנָתָן.
- source_word: ל/שבניה
  choice: untuk keluarga Sebanya
  rationale: Sejajar dengan frasa pertama, prefiks ל menandai keluarga atau kaum imam yang diwakili; “untuk keluarga Sebanya” menyampaikan struktur daftar dengan alami.
- source_word: יוסף
  choice: Yusuf
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia untuk יוֹסֵף.
theological_decisions: []
