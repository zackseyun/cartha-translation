  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata “keluarga” ditambahkan secara eksplisit untuk membuat fungsi representatif prefiks ל jelas bagi pembaca, tanpa menghilangkan alternatif genealogis yang dicatat dalam catatan kaki.
