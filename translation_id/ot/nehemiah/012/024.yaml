base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: id
  text: Para kepala orang Lewi ialah Hasabya, Serebya, dan Yesua anak Kadmiel; bersama saudara-saudara mereka yang berhadapan dengan mereka[a], mereka bertugas memuji dan mengucap syukur sesuai dengan perintah Daud, manusia Allah, dengan giliran jaga berhadapan dengan giliran jaga.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di seberang mereka” atau “bersesuaian dengan mereka.” Frasa ini tampaknya menggambarkan kelompok-kelompok orang Lewi yang ditempatkan saling berhadapan atau saling berpadanan dalam ibadah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “giliran jaga berhadapan dengan giliran jaga.” Ungkapan ini mungkin menunjuk kepada kelompok-kelompok pelayanan atau tempat-tempat tugas yang disusun saling berpadanan.
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: para kepala orang Lewi
  rationale: Bentuk jamak konstruktus רָאשֵׁי menunjuk kepada orang-orang yang memegang kedudukan utama. “Para kepala orang Lewi” mempertahankan metafora Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Hasabya, Serebya, dan Yesua anak Kadmiel
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam Alkitab bahasa Indonesia; hubungan בֶּן dipertahankan secara eksplisit sebagai “anak”.
- source_word: וַאֲחֵיהֶם
  choice: bersama saudara-saudara mereka
  rationale: Kata benda maskulin jamak diterjemahkan secara konkret sebagai “saudara-saudara”; kata sambung dipahami memperkenalkan kelompok yang menyertai para pemimpin yang disebutkan.
- source_word: לְנֶגְדָּם
  choice: yang berhadapan dengan mereka
  rationale: Frasa ini menyatakan posisi di hadapan, berseberangan, atau bersesuaian dengan kelompok lain. “Berhadapan dengan” mempertahankan gambaran tata letak tanpa memastikan pola nyanyian tertentu.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: memuji dan mengucap syukur
  rationale: Kedua infinitif dipertahankan sebagai dua tindakan ibadah yang berhubungan tetapi tidak dilebur menjadi satu.
- source_word: בְּמִצְוַת
  choice: sesuai dengan perintah
  rationale: Preposisi בְּ di sini menyatakan kesesuaian dengan ketetapan yang berwenang.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Daud, abdi Allah
  rationale: “Abdi Allah” merupakan ungkapan Indonesia yang alami dan bermartabat bagi gelar tradisional “manusia Allah,” yang menandakan seseorang yang mendapat tugas ilahi.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: kelompok tugas yang satu berhadapan dengan kelompok tugas yang lain
  rationale: מִשְׁמָר dapat menunjuk giliran, regu, atau kelompok yang menjalankan tugas. Terjemahan ini mempertahankan pengulangan dan hubungan antarkelompok tanpa menambahkan bahwa nyanyian mereka pasti bersahut-sahutan.
theological_decisions:
- issue: Istilah kekerabatan maskulin אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: sesama orang Lewi mereka
  rationale: Bentuk Ibrani bersifat maskulin jamak dan dalam konteks ini menunjuk kepada orang-orang Lewi laki-laki yang menjalankan pelayanan. Terjemahan konkret dipertahankan tanpa menetralkannya.
- issue: Gelar אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: manusia Allah
  rationale: “Abdi Allah” menyampaikan gelar bagi orang yang menerima tugas ilahi dalam bahasa Indonesia yang wajar, tanpa mengembangkan makna teologis di luar teks.
- issue: Frasa ibadah eliptis מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: kelompok tugas yang satu berhadapan dengan kelompok tugas yang lain
  alternative: giliran jaga berhadapan dengan giliran jaga
  rationale: Teks menunjukkan susunan kelompok pelayanan yang saling berhadapan atau bersesuaian, tetapi tidak secara eksplisit menyebut nyanyian antifonal. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dipecah setelah daftar nama agar mudah dibaca. Istilah teknis kultis dijelaskan melalui catatan kaki, sementara teks utama tetap menjaga pengulangan dan ketidakpastian frasa Ibrani.
