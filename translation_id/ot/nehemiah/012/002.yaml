lexical_decisions:
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Nama diri ditransliterasikan menurut bunyi Ibrani dan pola ejaan Indonesia; unsur akhir יָה secara wajar ditulis “ya”.
- source_word: מַלּוּךְ
  choice: Malukh
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; konsonan akhir ךְ mewakili bunyi /kh/, sehingga “kh” lebih tepat daripada ejaan Inggris “k” atau “ch”.
- source_word: חַטּוּשׁ
  choice: Hatus
  rationale: Nama diri ditransliterasikan secara alami dalam bahasa Indonesia; konsonan rangkap tidak perlu dipertahankan karena bahasa Indonesia tidak membedakan panjang konsonan, dan שׁ ditulis “s”.
