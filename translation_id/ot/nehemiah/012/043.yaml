  text: וַ/יִּזְבְּח֣וּ בַ/יּוֹם הַ֠/הוּא זְבָחִ֨ים גְּדוֹלִ֜ים וַ/יִּשְׂמָ֗חוּ כִּ֤י הָ/אֱלֹהִים֙ שִׂמְּחָ/ם֙ שִׂמְחָ֣ה גְדוֹלָ֔ה וְ/גַ֧ם הַ/נָּשִׁ֛ים וְ/הַ/יְלָדִ֖ים שָׂמֵ֑חוּ וַ/תִּשָּׁמַ֛ע שִׂמְחַ֥ת יְרוּשָׁלִַ֖ם מֵ/רָחֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: id
  text: Pada hari itu mereka mempersembahkan kurban-kurban yang besar[a] dan bersukacita, sebab Allah membuat mereka bersukacita dengan sukacita yang besar.[b] Para perempuan[c] dan anak-anak pun bersukacita, dan sukacita Yerusalem terdengar dari jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mengurbankan kurban-kurban yang besar.” Ungkapan “yang besar” juga dapat menyiratkan kurban dalam jumlah banyak atau kurban yang sangat penting.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Allah telah memberi mereka sukacita yang besar.” Secara lebih harfiah, bahasa Ibraninya mengatakan bahwa Allah membuat mereka bersukacita dengan sukacita yang besar.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “para istri,” sebab kata Ibrani yang dipakai dapat berarti “perempuan” atau “istri,” bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ בַיּוֹם הַהוּא זְבָחִים גְּדוֹלִים
  choice: Pada hari itu mereka mempersembahkan kurban-kurban yang besar
  rationale: Kata kerja זבח dalam konteks ibadah berarti mempersembahkan kurban. Ungkapan ini menghindari pengulangan yang kaku seperti 'mengurbankan kurban', sedangkan 'yang besar' mempertahankan גְּדוֹלִים tanpa mempersempit maknanya menjadi sekadar banyak atau berukuran besar.
- source_word: וַיִּשְׂמָחוּ
  choice: dan bersukacita
  rationale: Bentuk ini mempertahankan makna verbal akar שׂמח serta kohesi dengan pengulangan bahasa sukacita sepanjang ayat.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mereka bersukacita; 'sebab' alami dan bermartabat dalam prosa Indonesia.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi Israel, kata ini menunjuk kepada Allah; artikel Ibrani tidak perlu direproduksi dalam bahasa Indonesia.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: membuat mereka bersukacita dengan sukacita yang besar
  rationale: Terjemahan ini mempertahankan daya kausatif verba piel dan objek seakar yang menekankan besarnya sukacita, meskipun pengulangannya sengaja terasa lebih bercorak Ibrani.
- source_word: וְגַם הַנָּשִׁים וְהַיְלָדִים שָׂמֵחוּ
  choice: Para perempuan dan anak-anak pun bersukacita
  rationale: '''Pun'' menyampaikan daya tambah וְגַם secara alami. נָשִׁים dibiarkan sebagai ''perempuan'' karena dapat berarti perempuan atau istri, sementara יְלָדִים berarti anak-anak.'
- source_word: וַתִּשָּׁמַע שִׂמְחַת יְרוּשָׁלִַם מֵרָחוֹק
  choice: sehingga sukacita Yerusalem terdengar dari jauh
  rationale: Bentuk pasif nifal diterjemahkan 'terdengar'. Konjungsi 'sehingga' menyatakan hasil dalam alur Indonesia tanpa mengubah fakta bahwa bunyi sukacita itu terdengar dari tempat yang jauh.
theological_decisions:
- issue: Pelaku yang menimbulkan sukacita
  choice: Allah secara langsung dinyatakan membuat umat itu bersukacita.
  alternative: Allah memberi mereka sukacita yang besar.
  rationale: Bentuk piel שִׂמְּחָם bersifat kausatif. Terjemahan mempertahankan tindakan Allah secara eksplisit dan tidak melunakkannya menjadi pemberian abstrak.
- issue: Cakupan komunitas yang bersukacita
  choice: Para perempuan dan anak-anak disebut secara eksplisit sebagai bagian dari perayaan.
  alternative: Para istri dan anak-anak pun bersukacita.
  rationale: Teks menyebut kedua kelompok itu secara khusus. Karena נָשִׁים dapat berarti perempuan atau istri dan konteks tidak memastikannya, teks utama memakai arti yang lebih luas dan alternatifnya dicatat.
- issue: Hubungan klausa terakhir
  choice: Klausa terakhir disajikan sebagai hasil dari sukacita bersama yang nyaring.
  alternative: Dan sukacita Yerusalem terdengar dari jauh.
  rationale: Waw naratif dapat diterjemahkan secara berurutan atau berdasarkan hubungan wacana. 'Sehingga' alami dalam bahasa Indonesia dan tidak mengubah isi pernyataannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'bersukacita/sukacita' dipertahankan karena merupakan ciri retoris utama teks Ibrani. 'Kurban' dipakai sesuai ejaan baku dan konteks persembahan ibadah.
