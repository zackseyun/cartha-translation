source:
  edition: WLC
  text: וְ/הַ/כֹּהֲנִ֡ים אֶלְיָקִ֡ים מַעֲשֵׂיָ֡ה מִ֠נְיָמִין מִיכָיָ֧ה אֶלְיוֹעֵינַ֛י זְכַרְיָ֥ה חֲנַנְיָ֖ה בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/041.yaml
  text: 'and the priests: Eliakim[a], Maaseiah, Miniamin, Micaiah, Elioenai, Zechariah, and Hananiah, with trumpets.'
translation:
  language: id
  text: 'dan para imam: Elyakim, Maaseya, Minyamin, Mikaya, Elyoenai, Zakharia, dan Hananya, dengan trompet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הַ/כֹּהֲנִים
  choice: dan para imam
  rationale: Konjungsi וְ menghubungkan daftar ini dengan peserta arak-arakan pada ayat sebelumnya, sedangkan הַכֹּהֲנִים secara langsung berarti 'para imam'.
- source_word: אֶלְיָקִים
  choice: Elyakim
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia dengan mempertahankan bentuk Ibraninya.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Transliterasi Indonesia yang cukup dekat dengan bentuk Ibrani dan mudah dibaca.
- source_word: מִנְיָמִין
  choice: Minyamin
  rationale: Bentuk ini mengikuti susunan konsonan nama dalam teks Ibrani serta kaidah bunyi Indonesia.
- source_word: מִיכָיָה
  choice: Mikaya
  rationale: Transliterasi langsung dan alami dalam ejaan Indonesia.
- source_word: אֶלְיוֹעֵינַי
  choice: Elyoenai
  rationale: Transliterasi mempertahankan unsur bunyi utama nama Ibrani tanpa mengikuti ejaan Inggris.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Bentuk Indonesia yang lazim dan cukup dekat dengan nama Ibrani.
- source_word: חֲנַנְיָה
  choice: Hananya
  rationale: Transliterasi yang alami dalam bahasa Indonesia dan mencerminkan bentuk Ibrani.
- source_word: בַּ/חֲצֹצְרֽוֹת
  choice: dengan nafiri
  rationale: Preposisi בְּ dapat menyatakan penyertaan atau sarana; dalam konteks arak-arakan ibadah, frasa ini menunjukkan bahwa para imam membawa atau memainkan nafiri. 'Nafiri' membedakan חֲצֹצְרוֹת, trompet upacara, dari שׁוֹפָר, sangkakala tanduk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama ditransliterasikan dari bahasa Ibrani, bukan disalin dari bentuk Inggris. Ambiguitas fungsi preposisi pada frasa terakhir dipertahankan melalui ungkapan luas 'dengan nafiri'.
