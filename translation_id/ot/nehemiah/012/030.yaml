id: NEH.12.30
reference: Nehemiah 12:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽטַּהֲר֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם וַֽ/יְטַהֲרוּ֙ אֶת הָ/עָ֔ם וְ/אֶת הַ/שְּׁעָרִ֖ים וְ/אֶֽת הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: id
  text: Para imam dan orang Lewi menyucikan diri[a], lalu mereka menyucikan umat, pintu-pintu gerbang, dan tembok itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “mentahirkan diri ... mentahirkan umat, pintu-pintu gerbang, dan tembok itu.” Bahasa Ibrani memakai akar kata yang sama untuk kedua tindakan tersebut, mula-mula secara refleksif lalu secara transitif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: menyucikan diri
  rationale: Bentuk hitpael bersifat refleksif dan dalam konteks peresmian ini menunjuk pada penyucian ritual yang dijalani para imam dan orang Lewi.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan alami untuk bentuk jamak כֹּהֲנִים dalam konteks ibadah.
- source_word: וְהַלְוִיִּם
  choice: dan orang Lewi
  rationale: Sebutan yang lazim dalam bahasa Indonesia bagi kaum Lewi yang melayani dalam lingkungan bait.
- source_word: וַיְטַהֲרוּ
  choice: mereka menyucikan
  rationale: Bentuk piel bersifat transitif/faktif. Pengulangan kata 'menyucikan' mempertahankan hubungan dengan tindakan refleksif sebelumnya dan nuansa ritualnya.
- source_word: הָעָם
  choice: umat
  rationale: Dalam konteks peresmian dan ibadah, 'umat' secara alami menunjuk kepada orang banyak sebagai komunitas perjanjian tanpa mempersempitnya menjadi sekadar majelis.
- source_word: הַשְּׁעָרִים
  choice: pintu-pintu gerbang
  rationale: Padanan ini jelas dan alami bagi gerbang-gerbang pada tembok kota serta menghindari kemungkinan bahwa yang dimaksud hanya daun pintu biasa.
- source_word: הַחוֹמָה
  choice: tembok itu
  rationale: Bentuk tunggal dengan artikel menunjuk pada tembok Yerusalem yang sedang dibicarakan; 'itu' menandai kekhususan tersebut tanpa menambahkan kata 'kota'.
theological_decisions:
- issue: Sifat tindakan penyucian
  choice: penyucian ritual
  alternative: pembersihan umum atau moral
  rationale: Akar טהר dalam konteks peresmian tembok dan pelayanan para imam serta orang Lewi terutama mengacu pada keadaan tahir secara ritual, bukan sekadar kebersihan fisik atau pemurnian moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Lalu' mengungkapkan urutan tindakan secara alami. Pengulangan 'menyucikan' dipertahankan untuk mencerminkan pengulangan akar טהר dalam bahasa Ibrani.
