  source_fidelity: Terjemahan dengan tepat membedakan וַיִּטַּהֲרוּ yang refleksif ('menyucikan diri') dari וַיְטַהֲרוּ yang transitif ('menyucikan'). Urutan objek—umat, pintu-pintu gerbang, dan tembok—serta cakupan tindakan ritual dipertahankan tanpa penambahan penafsiran.
  naturalness: Bahasa Indonesia baku, jelas, dan wajar. 'Para imam dan orang Lewi' serta 'pintu-pintu gerbang' sesuai untuk register naratif-keagamaan modern. 'Lalu' menyampaikan urutan naratif בצורה alami tanpa memaksakan hubungan kausal.
  terminology: Istilah 'menyucikan' secara konsisten mempertahankan pengulangan akar טהר dan cocok dalam konteks penyucian ritual. 'Umat' dapat diterima bagi הָעָם dalam konteks komunitas Israel ini. Catatan kaki secara memadai memberi alternatif 'mentahirkan' dan menjelaskan kontras refleksif-transitif.
