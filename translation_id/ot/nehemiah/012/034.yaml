translation:
  language: id
  text: Yehuda[a], Benyamin, Semaya, dan Yeremia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, jika יְהוּדָה dipahami secara geografis dalam konteks lain, “Yudea”; di sini nama orang atau suku “Yehuda” lebih sesuai dengan daftar tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Dalam daftar nama ini, bentuk tersebut paling tepat dipahami sebagai nama orang atau suku, bukan nama wilayah. Bentuk baku Indonesia 'Yehuda' dipakai.
- source_word: בִנְיָמִן
  choice: Benyamin
  rationale: Nama diri dalam rangkaian nama; bentuk Alkitab Indonesia yang lazim dan mudah dikenali dipakai.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk Indonesia yang wajar dan selaras dengan pelafalan sumber.
- source_word: יִרְמְיָה
  choice: Yeremia
  rationale: Nama diri ini diberikan dalam bentuk baku yang sudah dikenal luas dalam bahasa Indonesia.
- source_word: וְ / וּ
  choice: dan
  rationale: Konjungsi yang berulang dalam daftar Ibrani disajikan secara alami dalam bahasa Indonesia dengan koma dan 'dan' sebelum unsur terakhir.
