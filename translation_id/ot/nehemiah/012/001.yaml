  text: וְ/אֵ֨לֶּה֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם אֲשֶׁ֥ר עָל֛וּ עִם זְרֻבָּבֶ֥ל בֶּן שְׁאַלְתִּיאֵ֖ל וְ/יֵשׁ֑וּעַ שְׂרָיָ֥ה יִרְמְיָ֖ה עֶזְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/001.yaml
  text: 'These were the priests and the Levites who came up with Zerubbabel son of Shealtiel[a], and Jeshua: Seraiah, Jeremiah, Ezra.'
translation:
  language: id
  text: 'Inilah para imam dan orang Lewi yang datang bersama Zerubabel anak Sealtiel dan Yesua[a]: Seraya, Yeremia, dan Ezra.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Yesua; dapat juga diterjemahkan Yosua jika nama itu disesuaikan dengan bentuk yang lebih umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan daftar baru secara alami dalam bahasa Indonesia sambil mempertahankan fungsi penghubung waw tanpa menambahkan penanda waktu.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam dan orang Lewi
  rationale: Padanan baku dan mudah dipahami untuk kedua kelompok pelayanan dalam konteks daftar ini.
- source_word: אֲשֶׁר עָלוּ
  choice: yang datang
  rationale: Kata עלה secara harfiah menyatakan gerak 'naik' dan dalam konteks kepulangan dari pembuangan merujuk perjalanan ke Yehuda/Yerusalem. 'Datang' terdengar alami dari sudut pandang narasi tanpa memasukkan tujuan yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: עִם
  choice: bersama
  rationale: Menyatakan penyertaan secara langsung dan alami.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Zerubabel anak Sealtiel
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan hubungan keturunan diterjemahkan langsung.
- source_word: וְיֵשׁוּעַ
  choice: dan Yesua[a]
  rationale: Mempertahankan bentuk khusus nama Ibrani יֵשׁוּעַ, bukan menormalkannya menjadi Yosua; catatan kaki mencatat alternatif tersebut.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Seraya, Yeremia, dan Ezra
  rationale: Nama-nama yang membuka daftar disajikan sebagai rangkaian nama sederhana setelah titik dua.
