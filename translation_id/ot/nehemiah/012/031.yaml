base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: id
  text: Kemudian aku membawa para pemimpin Yehuda naik ke atas tembok. Aku mengatur dua kelompok besar untuk mengucap syukur dan berarak[a]. Kelompok yang satu berjalan ke kanan di atas tembok menuju Gerbang Sampah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua ucapan syukur besar dan arak-arakan.” Dalam konteks ini, ungkapan tersebut tampaknya menunjuk pada kelompok-kelompok terorganisasi yang mengucap syukur sambil berarak.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke Gerbang Sampah.” Dalam konteks yang menunjukkan arah ini, kata depan Ibrani tersebut dapat diterjemahkan “ke” atau “menuju.”
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: aku membawa ... naik
  rationale: Bentuk Hifil orang pertama tunggal dari עלה menyatakan tindakan menyebabkan orang naik; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: שָׂרֵי יְהוּדָה
  choice: para pemimpin Yehuda
  rationale: שָׂרִים dapat berarti pembesar, pejabat, atau pemimpin. Dalam konteks sipil dan liturgis ini, 'para pemimpin' jelas serta tidak menyiratkan bahwa mereka putra raja.
- source_word: מֵעַל לַחוֹמָה
  choice: ke atas tembok
  rationale: Frasa ini menggambarkan gerak naik hingga berada di permukaan atas tembok, tempat arak-arakan berlangsung.
- source_word: וָאַעֲמִידָה
  choice: Aku menempatkan
  rationale: Bentuk Hifil dari עמד berarti membuat berdiri, menempatkan, atau mengatur pada posisi tertentu; 'menempatkan' sesuai dengan pengaturan kelompok-kelompok untuk upacara.
- source_word: תֹּודֹת גְּדוֹלֹת
  choice: dua kelompok besar yang menyanyikan syukur
  rationale: Secara harfiah berarti 'dua ucapan syukur besar', tetapi dalam konteks penahbisan ini metonimia tersebut menunjuk pada kelompok terorganisasi yang mengucap atau menyanyikan syukur.
- source_word: וְתַהֲלֻכֹת
  choice: dalam arak-arakan
  rationale: Nomina turunan הלך menunjuk pada gerak berjalan atau arak-arakan. Menghubungkannya dengan kelompok penyanyi menghasilkan bahasa Indonesia yang alami tanpa menganggapnya kelompok tambahan.
- source_word: לַיָּמִין
  choice: ke kanan
  rationale: Terjemahan langsung yang mempertahankan orientasi dalam teks dan tidak menggantinya dengan kesimpulan geografis seperti 'ke selatan'.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: menuju Gerbang Pembuangan
  rationale: אַשְׁפֹּת menunjuk pada kotoran atau sampah yang dibuang. 'Gerbang Pembuangan' merupakan nama yang jelas dan bermartabat dalam bahasa Indonesia; 'menuju' mempertahankan nuansa arah dari preposisi לְ.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dibagi menjadi tiga kalimat agar hubungan antara dua kelompok dan arah kelompok pertama mudah dipahami. Istilah 'kelompok yang menyanyikan syukur' mengungkapkan metonimia Ibrani tanpa menghilangkan unsur ucapan syukur, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
