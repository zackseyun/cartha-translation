base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: id
  text: Sebab pada zaman Daud dan Asaf dahulu ada para pemimpin para penyanyi[a], serta nyanyian pujian dan ucapan syukur kepada Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala para penyanyi”; kata “kepala” berbentuk tunggal tetapi kemungkinan digunakan secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan fungsi wacananya.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: pada zaman Daud dan Asaf
  rationale: Ungkapan waktu Ibrani diterjemahkan dengan idiom Indonesia yang alami dan tetap dekat dengan bentuk sumber.
- source_word: מִקֶּדֶם
  choice: sejak dahulu
  rationale: Menunjukkan masa lampau yang jauh atau keadaan yang telah berlaku sejak masa silam; pilihan ini alami dalam bahasa Indonesia dan menguatkan acuan kepada zaman Daud dan Asaf.
- source_word: רֹאשׁ הַמְשֹׁרְרִים
  choice: para pemimpin penyanyi
  rationale: רֹאשׁ berbentuk tunggal tetapi dapat berfungsi secara kolektif dalam konteks ini; “pemimpin” menyampaikan fungsi kepemimpinan dengan lebih alami daripada “kepala”.
- source_word: וְשִׁיר תְּהִלָּה
  choice: serta nyanyian pujian
  rationale: Kata שִׁיר berbentuk tunggal, tetapi dapat menunjuk jenis atau kumpulan nyanyian; frasa Indonesia ini mempertahankan hubungan antara nyanyian dan pujian.
- source_word: וְהֹדוֹת
  choice: dan ucapan syukur
  rationale: Bentuk ini menunjuk ungkapan atau tindakan bersyukur; “ucapan syukur” jelas dan lazim dalam konteks ibadah.
- source_word: לֵאלֹהִים
  choice: kepada Allah
  rationale: Preposisi ל menandai arah atau sasaran pujian dan ucapan syukur.
