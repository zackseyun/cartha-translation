lexical_decisions:
- source_word: לְ/סַלַּי
  choice: untuk keluarga Salai
  rationale: Dalam daftar para imam ini, prefiks לְ menandai hubungan Kalai dengan keluarga imam yang dikepalai atau dinamai menurut Salai. Penambahan “keluarga” membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia tanpa mengubah fungsi bentuk Ibraninya.
- source_word: קַלָּי
  choice: Kalai
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia; konsonan rangkap tidak perlu dipertahankan karena tidak membedakan makna dalam ejaan Indonesia.
- source_word: לְ/עָמוֹק
  choice: untuk keluarga Amok
  rationale: Seperti pada frasa pertama, prefiks לְ menandai hubungan Eber dengan keluarga imam Amok. “Untuk keluarga” cocok dengan struktur daftar perwakilan keluarga dalam konteks ayat-ayat ini.
- source_word: עֵבֶר
  choice: Eber
  rationale: Transliterasi langsung nama Ibrani עֵבֶר yang alami dalam bahasa Indonesia.
