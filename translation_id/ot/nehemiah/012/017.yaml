  text: 'Untuk Abia: Zikhri; untuk Minyamin, untuk Moadya[a]: Piltai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam beberapa tradisi tekstual terkait, nama Moadya juga dieja Maadya.
