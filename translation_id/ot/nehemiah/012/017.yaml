translation_notes:
  register: Bahasa daftar dibuat ringkas dan bermartabat. Tanda titik koma mempertahankan struktur eliptis teks Ibrani dan tidak mengisi nama yang tampaknya tidak disebut sesudah Minyamin. Penanda catatan ditempatkan pada Moadya karena catatan membahas variasi ejaan nama tersebut.
