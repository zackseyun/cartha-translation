lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: untuk Abia
  rationale: Prefiks ל menyatakan hubungan dengan keluarga atau rombongan imam dalam daftar ini. Kata “untuk” mempertahankan bentuk daftar yang ringkas tanpa menambahkan unsur yang tidak tersurat.
- source_word: זִכְרִי
  choice: Zikhri
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; huruf כ diwakili dengan “kh” agar bentuk Ibraninya tetap dikenali.
- source_word: לְ/מִנְיָמִין
  choice: untuk Minyamin
  rationale: Prefiks ל kembali menandai hubungan dalam daftar. Susunan eliptis teks Ibrani dipertahankan karena tidak ada nama wakil yang disebutkan secara jelas sesudah Minyamin.
- source_word: לְ/מוֹעַדְיָה
  choice: untuk Moadya
  rationale: Bentuk konsonantal dan vokalisasi WLC menunjuk pada nama Moadya. Transliterasi disesuaikan dengan ejaan Indonesia.
- source_word: פִּלְטָי
  choice: Piltai
  rationale: Nama diri ditransliterasikan; dalam susunan daftar, Piltai berkaitan dengan Moadya.
