id: NEH.12.47
reference: Nehemiah 12:47
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵל֩ בִּ/ימֵ֨י זְרֻבָּבֶ֜ל וּ/בִ/ימֵ֣י נְחֶמְיָ֗ה נֹֽתְנִ֛ים מְנָי֛וֹת הַ/מְשֹׁרְרִ֥ים וְ/הַ/שֹּׁעֲרִ֖ים דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ וּ/מַקְדִּשִׁים֙ לַ/לְוִיִּ֔ם וְ/הַ/לְוִיִּ֔ם מַקְדִּשִׁ֖ים לִ/בְנֵ֥י אַהֲרֹֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: id
  text: Seluruh Israel, pada zaman Zerubabel dan pada zaman Nehemia, memberikan bagian-bagian[a] bagi para penyanyi dan para penjaga pintu gerbang sesuai dengan keperluan setiap hari[b]. Mereka juga mengkhususkan bagian-bagian kudus bagi orang Lewi, dan orang Lewi mengkhususkan bagian-bagian kudus bagi keturunan Harun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatah-jatah yang telah ditetapkan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “urusan satu hari pada harinya”, yaitu apa yang diperlukan setiap hari.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud ialah para imam dari garis keturunan Harun; secara harfiah, “anak-anak Harun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Seluruh Israel
  rationale: Mempertahankan ungkapan kolektif untuk bangsa itu, sebagaimana dalam bahasa Ibrani, dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: pada zaman Zerubabel dan pada zaman Nehemia
  rationale: Mempertahankan pengulangan frasa sumber yang menekankan kedua masa kepemimpinan tersebut.
- source_word: נֹתְנִים
  choice: memberikan
  rationale: Partisipel Ibrani menggambarkan kebiasaan yang berlangsung pada masa itu; bentuk Indonesia ini dapat menyatakan tindakan berulang dalam rangkuman sejarah.
- source_word: מְנָיוֹת
  choice: bagian-bagian
  rationale: Mengacu pada jatah atau bagian persediaan yang diperuntukkan bagi para petugas ibadah; nuansa jatah yang ditetapkan dicatat dalam catatan kaki.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: para penyanyi dan para penjaga pintu gerbang
  rationale: Menyatakan dua kelompok petugas bait secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: sesuai dengan keperluan setiap hari
  rationale: Menyampaikan makna idiom Ibrani tentang penyediaan yang harus dipenuhi dari hari ke hari tanpa meniru susunannya secara kaku.
- source_word: וּמַקְדִּשִׁים
  choice: Mereka juga mengkhususkan bagian-bagian kudus
  rationale: Mempertahankan unsur kekudusan dalam akar קדשׁ sekaligus memasok objek yang tersirat dari konteks dan kesejajaran kalimat agar tindakan itu tidak disalahpahami sebagai menguduskan orang Lewi sendiri.
- source_word: לַלְוִיִּם
  choice: bagi orang Lewi
  rationale: Preposisi menandai pihak yang menerima bagian yang dikhususkan.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: dan orang Lewi mengkhususkan bagian-bagian kudus bagi keturunan Harun
  rationale: 'Mempertahankan kesejajaran tindakan: Israel mengkhususkan bagi orang Lewi, lalu orang Lewi bagi garis imam keturunan Harun.'
- source_word: בְּנֵי אַהֲרֹן
  choice: keturunan Harun
  rationale: Dalam konteks kelembagaan ini, frasa tersebut menunjuk kepada garis keturunan Harun; 'keturunan' lebih alami daripada 'anak-anak' dan tidak membatasi rujukan pada putra langsung Harun.
theological_decisions:
- issue: Makna מַקְדִּשִׁים dalam konteks dukungan bagi pelayanan bait
  choice: Diterjemahkan sebagai mengkhususkan bagian-bagian kudus bagi penerima yang disebutkan.
  alternative: Menyisihkan, mempersembahkan, atau memberikan kepada orang Lewi dan keturunan Harun.
  rationale: Akar קדשׁ membawa gagasan menjadikan atau menetapkan sesuatu sebagai kudus. Terjemahan ini mempertahankan dimensi sakralnya tanpa mereduksinya menjadi pemberian biasa, sedangkan objek 'bagian-bagian kudus' dipahami secara kontekstual dan tidak dinyatakan secara eksplisit dalam teks Ibrani.
- issue: Identitas בְנֵי אַהֲרֹן
  choice: Keturunan Harun
  alternative: Para imam keturunan Harun atau anak-anak Harun
  rationale: Frasa itu secara kelembagaan menunjuk kepada garis keimaman Harun, tetapi teks utama mempertahankan sebutan berdasarkan garis keturunan dan tidak menggantinya sepenuhnya dengan istilah interpretatif 'para imam'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'pada zaman' dipertahankan untuk mengikuti penekanan historis sumber. Istilah kelembagaan bait dijelaskan secara alami tanpa memasukkan ciri doktrinal denominasi tertentu.
