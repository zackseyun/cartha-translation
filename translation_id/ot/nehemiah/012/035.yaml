  text: וּ/מִ/בְּנֵ֥י הַ/כֹּהֲנִ֖ים בַּ/חֲצֹצְר֑וֹת זְכַרְיָ֨ה בֶן יֽוֹנָתָ֜ן בֶּן שְׁמַֽעְיָ֗ה בֶּן מַתַּנְיָה֙ בֶּן מִ֣יכָיָ֔ה בֶּן זַכּ֖וּר בֶּן אָסָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: id
  text: 'dan dari antara anak-anak para imam[a], dengan nafiri: Zakharia anak Yonatan, anak Semaya, anak Matanya, anak Mikha, anak Zakur, anak Asaf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “dan dari anak-anak para imam, dengan nafiri.”'
    reason: Menunjukkan bentuk partitif Ibrani serta alternatif yang lebih formal.
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי הַ/כֹּהֲנִים
  choice: dan dari antara keturunan para imam
  rationale: מן dengan bentuk konstruksi בנים menyatakan hubungan partitif. 'Dari antara keturunan para imam' terdengar alami dalam bahasa Indonesia dan tidak memaksakan bahwa semua nama berikut adalah anak langsung.
- source_word: בַּ/חֲצֹצְר֑וֹת
  choice: dengan nafiri
  rationale: Prefiks ב berfungsi instrumental. 'Nafiri' adalah istilah Indonesia yang lazim dalam konteks alat musik tiup upacara alkitabiah dan tidak menyiratkan sangkakala dari tanduk.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Mengikuti bentuk nama Ibrani dan konvensi nama Alkitab dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Mempertahankan pengulangan penanda silsilah Ibrani secara ringkas; dalam silsilah, istilah ini dapat menunjuk anak atau keturunan.
- source_word: יֽוֹנָתָן
  choice: Yonatan
  rationale: Transliterasi nama Ibrani yang lazim dan jelas dalam bahasa Indonesia.
- source_word: שְׁמַֽעְיָה
  choice: Semaya
  rationale: Bentuk nama yang natural menurut konvensi ejaan nama Alkitab Indonesia.
- source_word: מַתַּנְיָה
  choice: Matanya
  rationale: Transliterasi Indonesia yang mempertahankan bentuk dasar nama Ibrani.
- source_word: מִיכָיָה
  choice: Mikha
  rationale: Bentuk Indonesia yang ringkas dan lazim untuk nama ini dalam tradisi teks Nehemia.
- source_word: זַכּוּר
  choice: Zakur
  rationale: Transliterasi langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: אָסָף
  choice: Asaf
  rationale: Bentuk nama yang sudah mapan dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan silsilah dengan Asaf
  choice: Mempertahankan rangkaian 'anak' tanpa menambahkan keterangan tentang kelompok, jabatan, atau kepengarangan.
  alternative: Menafsirkan 'anak Asaf' secara eksplisit sebagai 'keturunan Asaf'.
  rationale: Teks Ibrani mengulang בֶן. Terjemahan utama mempertahankan bentuk silsilah itu, sementara catatan menjelaskan kemungkinan cakupan istilah tersebut tanpa menetapkan kesimpulan historis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Tanda titik dua mempertahankan fungsi daftar setelah penyebutan kelompok dan nafiri; rangkaian silsilah dibuat ringkas tanpa menyisipkan kata penghubung tambahan.
