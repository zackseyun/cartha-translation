source:
  edition: WLC
  text: בְּנֵ֤י לֵוִי֙ רָאשֵׁ֣י הָֽ/אָב֔וֹת כְּתוּבִ֕ים עַל סֵ֖פֶר דִּבְרֵ֣י הַ/יָּמִ֑ים וְ/עַד יְמֵ֖י יֽוֹחָנָ֥ן בֶּן אֶלְיָשִֽׁיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: id
  text: Keturunan Lewi yang menjadi kepala kaum keluarga tercatat dalam kitab catatan sejarah[a] sampai pada zaman Yohanan anak Elyasib.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kitab catatan sejarah” adalah catatan resmi atau tarikh, dan tidak harus berarti kitab Tawarikh dalam Alkitab.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: Keturunan Lewi
  rationale: Secara harfiah berarti “anak-anak Lewi,” tetapi dalam konteks silsilah dan jabatan ungkapan ini menunjuk kepada keturunan Lewi. Pilihan ini alami dalam bahasa Indonesia dan tidak menyempitkannya hanya kepada anak kandung langsung.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: kepala kaum keluarga
  rationale: Ungkapan Ibrani ini menunjuk kepada para pemimpin kelompok keluarga berdasarkan garis keturunan. “Kepala kaum keluarga” mempertahankan gagasan leluhur dan struktur keluarga dengan bahasa Indonesia yang jelas.
- source_word: כְּתוּבִים
  choice: tercatat
  rationale: Partisip pasif dari כתב menyatakan bahwa mereka telah dimasukkan ke dalam catatan tertulis. “Tercatat” menyampaikan nuansa administratif ini secara ringkas dan alami.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam kitab catatan sejarah
  rationale: Walaupun עַל secara dasar berarti “di atas,” konteks pencatatan tertulis menuntut “dalam” dalam bahasa Indonesia. דִּבְרֵי הַיָּמִים di sini menunjuk kepada tarikh atau catatan kejadian menurut waktu, bukan dengan sendirinya kepada kitab kanonik Tawarikh.
- source_word: וְעַד יְמֵי
  choice: sampai pada zaman
  rationale: Ungkapan ini menetapkan batas waktu pencatatan. “Sampai pada zaman” alami dalam bahasa Indonesia dan mempertahankan makna rentang masa, bukan hanya satu hari tertentu.
- source_word: יוֹחָנָן
  choice: Yohanan
  rationale: Bentuk ini mengikuti bunyi nama Ibrani secara langsung dan sesuai dengan ejaan nama Semitik dalam bahasa Indonesia.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: anak Elyasib
  rationale: Konstruksi patronimik ini secara langsung menyatakan bahwa Yohanan adalah anak Elyasib; ejaan “Elyasib” menyesuaikan transliterasi nama Ibrani אֶלְיָשִׁיב dengan kebiasaan bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan klausa dibuat alami tanpa menghilangkan batas waktu pencatatan atau hubungan para kepala kaum keluarga dengan keturunan Lewi.
