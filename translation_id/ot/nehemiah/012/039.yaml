base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: id
  text: dan dari atas Gerbang Efraim, di atas Gerbang Lama, di atas Gerbang Ikan, Menara Hananel, dan Menara Seratus, sampai ke Gerbang Domba; mereka berhenti di Gerbang Penjagaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka berdiri di Gerbang Penjara” atau “di Gerbang Tempat Jaga.” Teks Ibrani dapat menyatakan “berdiri” atau, dalam konteks arak-arakan, “berhenti”; nama gerbang terakhir juga dapat berkaitan dengan penjagaan, tempat jaga, atau penjara.'
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וּמֵעַל לְשַׁעַר אֶפְרַיִם
  choice: lalu di atas Pintu Gerbang Efraim
  rationale: Ungkapan ini meneruskan rute arak-arakan dari ayat sebelumnya. 'Di atas' mempertahankan gambaran bahwa rombongan bergerak di bagian atas tembok dekat gerbang.
- source_word: וְעַל
  choice: di atas
  rationale: Pengulangan preposisi עַל dipertahankan pada kedua gerbang berikutnya untuk mencerminkan struktur Ibrani dan jalur di atas tembok.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Pintu Gerbang Lama
  rationale: Terjemahan langsung dan wajar dari nama tempat ini; tidak memperluasnya menjadi 'kota lama' atau mentransliterasikannya.
- source_word: שַׁעַר הַדָּגִים
  choice: Pintu Gerbang Ikan
  rationale: Konstruksi harfiah 'gerbang ikan' dinyatakan sebagai nama tempat yang alami dalam bahasa Indonesia.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: Menara Hananel
  rationale: Nama diri Hananel dipertahankan, sedangkan מִגְדָּל diterjemahkan secara langsung sebagai 'menara'.
- source_word: מִגְדַּל הַמֵּאָה
  choice: Menara Seratus
  rationale: Terjemahan formal ini mempertahankan ketidakjelasan rujukan 'seratus' dan tidak memasukkan tafsiran yang tidak dinyatakan teks.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: sampai ke Pintu Gerbang Domba
  rationale: עַד menandai batas atau titik akhir jalur; 'sampai ke' menyampaikannya dengan alami.
- source_word: וְעָמְדוּ
  choice: kemudian mereka berhenti
  rationale: Walaupun arti dasarnya 'berdiri', dalam konteks rombongan yang sedang bergerak verba ini secara alami menunjukkan bahwa mereka berhenti pada suatu tempat.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: di Pintu Gerbang Penjagaan
  rationale: מַטָּרָה berkaitan dengan penjagaan, tempat jaga, atau penahanan. 'Penjagaan' mempertahankan nuansa keamanan tanpa memastikan bahwa gerbang ini adalah gerbang penjara.
