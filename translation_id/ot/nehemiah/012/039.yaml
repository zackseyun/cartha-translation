translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'di atas' mempertahankan topografi serta pola sumber, sementara nama-nama bangunan dibuat ringkas dan mudah dikenali. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang memiliki alternatif leksikal.
