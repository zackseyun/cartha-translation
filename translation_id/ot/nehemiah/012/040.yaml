  text: Lalu kedua paduan suara pengucap syukur itu mengambil tempat di rumah Allah[a]; demikian juga aku dan separuh pejabat yang bersama aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah: “kedua ucapan syukur.” Dalam konteks ini, ungkapan tersebut menunjuk kepada dua kelompok atau paduan suara pengucap syukur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: mengambil tempat
  rationale: Bentuk feminin jamak dari עמד merujuk kepada kedua kelompok. Dalam konteks upacara, frasa ini menyatakan bahwa mereka berhenti dan menempati posisi yang ditentukan, bukan sekadar berdiri.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: kedua paduan suara pengucap syukur
  rationale: Secara harfiah berarti 'kedua ucapan syukur', tetapi dalam konteks arak-arakan pentahbisan istilah ini secara metonimis menunjuk kepada dua kelompok penyanyi yang mengucap syukur. Pilihan ini memperjelas rujukannya tanpa menghilangkan fungsi pengucapan syukur.
- source_word: בְּבֵית הָאֱלֹהִים
  choice: di rumah Allah
  rationale: Mempertahankan ungkapan Ibrani 'rumah Allah' dan menerjemahkan בְּ secara lokatif dengan 'di', yang wajar dalam bahasa Indonesia serta tidak menentukan lebih jauh apakah posisinya tepat di dalam atau di kawasan rumah Allah.
- source_word: וַאֲנִי
  choice: bersama aku
  rationale: Koordinasi Ibrani disusun ulang secara wajar dalam bahasa Indonesia agar Nehemia tetap tergabung dengan kelompok yang mengambil tempat di rumah Allah.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: dan separuh para pejabat
  rationale: סְגָנִים menunjuk kepada para pejabat atau penguasa administratif. 'Para pejabat' merupakan padanan modern yang jelas dan cukup luas.
- source_word: עִמִּי
  choice: yang menyertaiku
  rationale: Menyampaikan hubungan pendampingan dengan Nehemia secara alami dan memperjelas bahwa separuh pejabat itu berada bersamanya.
