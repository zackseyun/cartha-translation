translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa disesuaikan agar alami, sedangkan ungkapan khas 'rumah Allah' dipertahankan. Istilah seremonial dijelaskan secukupnya melalui 'paduan suara pengucap syukur' dan catatan kaki.
