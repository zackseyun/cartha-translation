id: NEH.12.8
reference: Nehemiah 12:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: id
  text: Orang-orang Lewi ialah Yesua, Binui, Kadmiel, Serebya, Yehuda, dan Matanya[a], yang bersama saudara-saudaranya bertanggung jawab atas nyanyian syukur.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai pronomina tunggal “ia”, yang paling wajar merujuk kepada Matanya. Namun, bagian ini juga dapat dipahami secara lebih kolektif: “mereka bersama saudara-saudara mereka bertanggung jawab atas nyanyian syukur.”'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “ucapan-ucapan syukur” atau “ungkapan-ungkapan syukur”; dalam konteks ibadah, ungkapan ini kemungkinan menunjuk pada nyanyian syukur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Orang-orang Lewi ialah
  rationale: Klausa Ibrani tidak memiliki verba dan memperkenalkan daftar orang Lewi. Kata “ialah” melengkapinya secara wajar dalam bahasa Indonesia tanpa mengubah fungsinya sebagai daftar.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Yesua, Binui, Kadmiel, Serebya, Yehuda, dan Matanya
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: עַל
  choice: bertanggung jawab atas
  rationale: Dalam konteks pembagian tugas orang Lewi, preposisi ini menyatakan tanggung jawab atau pengawasan. Ungkapan ini lebih alami daripada terjemahan harfiah “di atas”.
- source_word: הֻיְּדוֹת
  choice: nyanyian syukur
  rationale: Bentuk jamak ini secara harfiah menunjuk pada ucapan atau ungkapan syukur. Dalam konteks tugas liturgis orang Lewi, “nyanyian syukur” menyampaikan makna yang paling mungkin sambil mencatat cakupan leksikalnya dalam catatan kaki.
- source_word: הוּא וְאֶחָיו
  choice: yang bersama saudara-saudaranya
  rationale: Pronomina tunggal הוּא paling wajar merujuk kepada Matanya, sedangkan וְאֶחָיו menyertakan saudara-saudara atau rekan sekelompoknya dalam tugas itu.
theological_decisions:
- issue: Rujukan pronomina tunggal הוּא sesudah daftar orang Lewi
  choice: Pronomina itu dipahami merujuk secara khusus kepada Matanya, yang menjalankan tugas tersebut bersama saudara-saudaranya.
  alternative: Frasa itu dapat dipahami secara lebih longgar sebagai keterangan kolektif tentang orang-orang Lewi yang baru disebutkan.
  rationale: Bentuk tunggal paling alami menunjuk kepada nama terakhir, Matanya. Namun, karena konstruksi daftar dapat membuka kemungkinan pemahaman kolektif, alternatif itu dipertahankan dalam catatan kaki tanpa dijadikan bacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang Lewi” mudah dipahami pembaca umum; “bertanggung jawab atas” menyampaikan fungsi pengawasan secara alami. Bentuk “saudara-saudaranya” dipertahankan karena teks Ibrani memakai istilah kekerabatan maskulin yang dalam konteks ini juga dapat menunjuk pada sesama orang Lewi.
