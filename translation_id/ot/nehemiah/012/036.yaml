  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְֽ/אֶחָ֡י/ו שְֽׁמַעְיָ֡ה וַ/עֲזַרְאֵ֡ל מִֽלֲלַ֡י גִּֽלֲלַ֡י מָעַ֞י נְתַנְאֵ֤ל וִֽ/יהוּדָה֙ חֲנָ֔נִי בִּ/כְלֵי שִׁ֥יר דָּוִ֖יד אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/עֶזְרָ֥א הַ/סּוֹפֵ֖ר לִ/פְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: id
  text: dan saudara-saudaranya, yaitu Semaya, Azareel, Milalai, Gilalai, Maai, Netaneel, Yehuda, dan Hanani, dengan alat-alat musik[a] Daud, abdi Allah, dan Ezra, ahli kitab itu, berada di depan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: alat-alat untuk nyanyian.'
    reason: Alternatif yang lebih harfiah bagi בִּכְלֵי שִׁיר, yang secara bentuk dapat dipahami sebagai ‘alat-alat nyanyian’.
lexical_decisions:
- source_word: וְאֶחָיו
  choice: bersama saudara-saudaranya
  rationale: אֶחָיו secara harfiah berarti ‘saudara-saudaranya’. Dalam konteks daftar dan arak-arakan ini, kata tersebut dapat menunjuk pada rekan-rekan satu kelompok Lewi, tetapi makna dasarnya dipertahankan.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Semaya, Azareel, Milalai, Gilalai, Maai, Netaneel, Yehuda, dan Hanani
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang wajar dan dikenal dalam bahasa Indonesia.
- source_word: בִּכְלֵי שִׁיר
  choice: dengan alat-alat musik
  rationale: כְּלֵי berarti perkakas atau alat, sedangkan שִׁיר berarti nyanyian atau musik. ‘Alat-alat musik’ merupakan ungkapan Indonesia yang alami; bentuk lebih harfiah dicatat dalam catatan kaki.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Daud, abdi Allah
  rationale: Hubungan konstruksi mengaitkan alat-alat itu dengan Daud, lalu אִישׁ הָאֱלֹהִים memberi gelar kehormatan kepadanya. ‘Abdi Allah’ merupakan ungkapan Alkitabiah Indonesia yang alami untuk gelar tersebut.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: Ezra, ahli kitab itu
  rationale: הַסּוֹפֵר menunjuk pada jabatan Ezra sebagai penulis dan ahli kitab; ‘ahli kitab’ mempertahankan pengertian peran itu dalam bahasa Indonesia.
- source_word: לִפְנֵיהֶם
  choice: berjalan di depan mereka
  rationale: Frasa ini menunjukkan posisi Ezra di depan rombongan. Kata ‘berjalan’ disuplai secara wajar dari konteks arak-arakan tanpa mengubah makna posisi.
theological_decisions:
- issue: Penerjemahan gelar אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: abdi dari Allah; orang kepunyaan Allah
  rationale: Gelar ini dikenal dalam pemakaian Alkitabiah dan menyatakan hubungan pelayanan Daud kepada Allah tanpa menambahkan klaim doktrinal yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat jelas dengan ‘yaitu’, sedangkan konteks arak-arakan dinyatakan secara alami melalui ‘berjalan di depan mereka’. Tanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
