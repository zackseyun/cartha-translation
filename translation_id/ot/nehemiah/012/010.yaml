  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֵשׁ֖וּעַ הוֹלִ֣יד אֶת יֽוֹיָקִ֑ים וְ/יֽוֹיָקִים֙ הוֹלִ֣יד אֶת אֶלְיָשִׁ֔יב וְ/אֶלְיָשִׁ֖יב אֶת יוֹיָדָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: id
  text: Yesua memperanakkan Yoyakim[a], Yoyakim memperanakkan Elyasib[b], dan Elyasib memperanakkan Yoyada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, rumus silsilah Ibrani ini berarti “Yesua menyebabkan Yoyakim lahir”; “memperanakkan” menyampaikan makna idiomatisnya.
    reason: lexical_alternative
  - marker: b
    text: Nama Yoyakim dan Yoyada juga dapat ditransliterasikan dalam bentuk yang lebih lengkap sebagai Yehoyakim dan Yehoyada.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia untuk tokoh pascapembuangan ini.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam rumus silsilah berarti menyebabkan lahir, yaitu menjadi ayah atau leluhur laki-laki; 'memperanakkan' mempertahankan bentuk rumus yang ringkas dan wajar dalam konteks silsilah Alkitab.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: יוֹיָקִים
  choice: Yoyakim
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani dalam ayat ini.
- source_word: אֶלְיָשִׁיב
  choice: Elyasib
  rationale: Nama diri ditransliterasikan menurut kaidah yang lazim dalam bahasa Indonesia.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Nama diri ditransliterasikan dari bentuk singkat yang terdapat dalam teks Ibrani dan diselaraskan dengan bentuk Yoyakim.
theological_decisions:
- issue: Cakupan hubungan dalam rumus silsilah הוֹלִיד
  choice: memperanakkan
  alternative: menjadi ayah dari
  rationale: Teks menyatakan hubungan silsilah laki-laki tanpa secara eksplisit membahas apakah setiap pasangan nama merupakan ayah-anak langsung. Terjemahan mempertahankan rumus silsilah dan tidak menambahkan kepastian yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada silsilah. Bentuk 'memperanakkan' dipilih karena tetap mudah dipahami, lebih padat daripada 'menjadi ayah dari', dan mencerminkan pengulangan formula Ibrani. Nama-nama mengikuti transliterasi Indonesia, bukan bentuk Inggris.
