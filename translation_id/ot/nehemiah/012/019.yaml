  text: for Joiarib[a], Mattenai; for Jedaiah, Uzzi.
translation:
  language: id
  text: untuk Yoyarib[a], Matenai; untuk Yedaya, Uzi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan untuk Yoyarib, Matenai; untuk Yedaya, Uzi.” Teks Ibrani memakai kata sambung yang melekat pada frasa “untuk Yoyarib”, tetapi dalam sebuah daftar kata sambung itu dapat dibiarkan tersirat dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/יוֹיָרִיב
  choice: untuk Yoyarib
  rationale: Gabungan waw dan preposisi le memperkenalkan unsur berikutnya dalam daftar, secara harfiah ‘dan untuk Yoyarib’. Dalam gaya daftar bahasa Indonesia, kata sambung dapat dibiarkan tersirat, sedangkan ‘untuk’ mempertahankan hubungan perwakilan atau asosiasi.
- source_word: מַתְּנַי
  choice: Matenai
  rationale: Nama diri ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: לִֽ/ידַֽעְיָה
  choice: untuk Yedaya
  rationale: Preposisi le menandai asosiasi dalam daftar imam ini, yaitu orang yang mewakili keluarga atau kaum Yedaya.
- source_word: עֻזִּי
  choice: Uzi
  rationale: Nama diri ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia.
theological_decisions: []
