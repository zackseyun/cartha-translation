base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/029.yaml
  text: and from Beth-gilgal[a], and from the fields of Geba and Azmaveth, for the singers had built villages for themselves around Jerusalem.
translation:
  language: id
  text: dan dari Bet-Gilgal, dan dari ladang-ladang di Geba dan Azmawet, sebab para penyanyi telah membangun permukiman-permukiman bagi mereka sendiri di sekitar Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: juga dari Bet-Gilgal
  rationale: Gabungan konjungsi dan preposisi menyatakan asal, sedangkan בֵּית הַגִּלְגָּל diperlakukan sebagai nama tempat, bukan rumah harfiah. 'Juga' mengalir alami sebagai kelanjutan daftar dari ayat sebelumnya.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: dan dari ladang-ladang di Geba dan Azmawet
  rationale: Bentuk jamak שְּׂדוֹת secara langsung berarti 'ladang-ladang' dan menunjuk wilayah pertanian yang berkaitan dengan kedua tempat tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan mengapa para penyanyi berasal dari tempat-tempat tersebut.
- source_word: חֲצֵרִים
  choice: permukiman
  rationale: Dalam konteks geografis ini, kata tersebut menunjuk kawasan hunian kecil atau desa, bukan halaman bangunan. 'Permukiman' mempertahankan cakupan makna tanpa terlalu menentukan ukuran atau bentuknya.
- source_word: בָּנוּ לָהֶם
  choice: telah membangun ... bagi diri mereka
  rationale: Terjemahan ini mempertahankan arti dasar verba 'membangun' serta nuansa refleksif לָהֶם; 'telah' menyatakan keadaan yang sudah terbentuk dan menjelaskan lokasi mereka.
- source_word: הַמְשֹׁרֲרִים
  choice: para penyanyi
  rationale: Bentuk partisip dari akar שׁיר secara khusus menunjuk orang-orang yang bernyanyi, sesuai konteks pelayanan ibadah.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: di sekitar Yerusalem
  rationale: Ungkapan ini secara alami menyatakan daerah yang mengelilingi atau berada dekat Yerusalem.
theological_decisions: []
