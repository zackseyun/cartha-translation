  source_fidelity: 'Draf pada dasarnya setia pada teks Ibrani: nama-nama tempat, fungsi sebab כִּי, subjek “para penyanyi,” tindakan membangun, dan lokasi di sekitar Yerusalem tersampaikan dengan baik. Namun, bentuk jamak חֲצֵרִים sebaiknya tampak dalam terjemahan Indonesia, dan “juga” tidak diperlukan untuk menerjemahkan konjungsi waw dalam ayat ini.'
