  naturalness: Bahasa draft pada umumnya baku dan jelas. Revisi menyederhanakan hubungan tujuan dan memakai rangkaian "dengan ... serta dengan ..." supaya struktur daftar sarana perayaan lebih jelas dan tetap alami.
