  text: וּ/בַ/חֲנֻכַּ֞ת חוֹמַ֣ת יְרוּשָׁלִַ֗ם בִּקְשׁ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל מְק֣וֹמֹתָ֔/ם לַ/הֲבִיאָ֖/ם לִֽ/ירוּשָׁלִָ֑ם לַ/עֲשֹׂ֨ת חֲנֻכָּ֤ה וְ/שִׂמְחָה֙ וּ/בְ/תוֹד֣וֹת וּ/בְ/שִׁ֔יר מְצִלְתַּ֖יִם נְבָלִ֥ים וּ/בְ/כִנֹּרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: id
  text: Pada waktu penahbisan tembok Yerusalem, mereka mencari orang-orang Lewi[a] dari semua tempat tinggal mereka untuk membawa mereka ke Yerusalem guna mengadakan penahbisan itu[b] dengan sukacita, ucapan syukur, dan nyanyian, serta dengan ceracap, gambus, dan kecapi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari orang-orang Lewi.” Dalam konteks ini, kata tersebut juga dapat dipahami sebagai “memanggil orang-orang Lewi.” Kata Ibraninya pada dasarnya berarti “mencari.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melakukan penahbisan.”'
    reason: lexical_alternative
  - marker: c
    text: Pembedaan yang tepat antara kedua alat musik petik yang diterjemahkan “gambus” dan “kecapi” tidak diketahui dengan pasti. Teks Ibrani menyebut dua alat musik petik yang berbeda.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת
  choice: Pada waktu penahbisan
  rationale: Frasa ini menetapkan waktu peristiwa. 'Penahbisan' mempertahankan makna nomina חֲנֻכָּה sebagai peresmian atau pengudusan untuk suatu tujuan.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: tembok Yerusalem
  rationale: Rangkaian konstruksi ini secara langsung menunjuk pada tembok kota Yerusalem.
- source_word: בִּקְשׁוּ
  choice: mereka mencari
  rationale: Pilihan ini mempertahankan arti dasar בקשׁ, 'mencari', tanpa mempersempitnya menjadi tindakan resmi 'memanggil', meskipun konteks menyiratkan bahwa orang-orang Lewi hendak dihimpun.
- source_word: אֶת הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Bentuk jamak definit ini secara alami diterjemahkan sebagai kelompok orang Lewi.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: dari semua tempat tinggal mereka
  rationale: Secara harfiah berarti 'dari semua tempat mereka'; dalam konteks, yang dimaksud ialah berbagai tempat mereka menetap. 'Tempat tinggal' alami dalam bahasa Indonesia tanpa menentukan jenis permukimannya.
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: untuk membawa mereka ke Yerusalem
  rationale: Bentuk Hifil dari בוא bersifat kausatif dan tepat diwakili oleh 'membawa'.
- source_word: לַעֲשֹׂת חֲנֻכָּה
  choice: supaya mereka merayakan penahbisan itu
  rationale: Secara harfiah 'melakukan penahbisan'; 'merayakan penahbisan' merupakan ungkapan Indonesia yang alami bagi pelaksanaan perayaan tersebut.
- source_word: וְשִׂמְחָה
  choice: dengan sukacita
  rationale: שִׂמְחָה menyatakan kegembiraan atau sukacita yang menyertai perayaan.
- source_word: וּבְתוֹדוֹת
  choice: ucapan syukur
  rationale: תּוֹדוֹת adalah bentuk jamak yang mengacu pada ungkapan-ungkapan syukur; nomina kolektif 'ucapan syukur' terdengar alami dalam bahasa Indonesia.
- source_word: וּבְשִׁיר
  choice: nyanyian
  rationale: שִׁיר menunjuk pada lagu atau kegiatan bernyanyi; 'nyanyian' mempertahankan bentuk nominalnya.
- source_word: מְצִלְתַּיִם
  choice: ceracap
  rationale: Istilah Indonesia ini menunjuk pada simbal atau alat musik pukul berupa sepasang kepingan logam.
- source_word: נְבָלִים וּבְכִנֹּרוֹת
  choice: gambus, dan kecapi
  rationale: Teks Ibrani menyebut dua jenis alat musik petik yang berbeda. Padanan tepat dengan alat modern tidak pasti; dua istilah Indonesia dipakai untuk mempertahankan pembedaan dalam daftar.
