  - severity: low
    issue: Frasa "diiringi ceracap, gambus, dan kecapi" dapat secara sintaktis membatasi iringan itu pada "nyanyian" saja.
    rationale: Daftar instrumen dalam Ibrani merupakan bagian dari rangkaian unsur yang menyertai penahbisan. Mengulang "dengan" menampilkan hubungan tersebut dengan lebih jelas tanpa menambah makna.
