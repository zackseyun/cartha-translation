revisions:
- from: Pada waktu penahbisan tembok Yerusalem, mereka mencari orang-orang Lewi[a] dari semua tempat tinggal mereka untuk membawa mereka ke Yerusalem, supaya mereka merayakan penahbisan itu[b] dengan sukacita, ucapan syukur, dan nyanyian, diiringi ceracap, gambus, dan kecapi[c].
  to: Pada waktu penahbisan tembok Yerusalem, mereka mencari orang-orang Lewi[a] dari semua tempat tinggal mereka untuk membawa mereka ke Yerusalem guna mengadakan penahbisan itu[b] dengan sukacita, ucapan syukur, dan nyanyian, serta dengan ceracap, gambus, dan kecapi[c].
