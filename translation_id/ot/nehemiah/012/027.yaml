  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur teks Ibrani, tetapi hubungan tujuan dan rangkaian sarana perayaan diungkapkan secara alami. 'Diiringi' menjelaskan fungsi daftar alat musik tanpa mengubah unsur isinya.
