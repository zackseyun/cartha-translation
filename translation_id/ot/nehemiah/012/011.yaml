base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: id
  text: Yoyada memperanakkan Yonatan[a], dan Yonatan memperanakkan Yadua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan terjemahan berbunyi “Yohanan”, bukan “Yonatan”. Teks Ibrani yang digunakan di sini berbunyi “Yonatan”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Konjungsi ini menghubungkan catatan silsilah dengan ayat sebelumnya. Dalam bahasa Indonesia, kesinambungannya sudah wajar tanpa membuka ayat dengan “dan”.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan kebiasaan penamaan Alkitab dalam bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti menjadi ayah atau menurunkan seseorang. “Memperanakkan” ringkas, jelas, dan mempertahankan nuansa silsilah laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani ini tidak memiliki padanan tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: יוֹנָתָן
  choice: Yonatan
  rationale: Teks WLC secara eksplisit berbunyi יוֹנָתָן, yang mendukung “Yonatan”. Varian “Yohanan” dicatat dalam catatan kaki tanpa mengganti bacaan utama.
- source_word: וְ
  choice: dan
  rationale: Konjungsi kedua menyambungkan mata rantai berikutnya dalam silsilah dan secara alami diterjemahkan “dan”.
- source_word: יַדּוּעַ
  choice: Yadua
  rationale: Nama diri ditransliterasikan secara langsung dan alami dari bentuk Ibrani.
