  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'pada zaman' dipertahankan dari struktur Ibrani. Kata 'hidup' melengkapi klausa nominal agar wajar dalam bahasa Indonesia tanpa menyatakan jabatan atau tindakan yang tidak terdapat dalam teks sumber.
