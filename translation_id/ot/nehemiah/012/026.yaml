base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: id
  text: Mereka inilah yang hidup pada zaman Yoyakim bin Yesua bin Yozadak, dan pada zaman Nehemia, sang gubernur, serta Ezra, imam dan ahli kitab.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani menyebut Ezra dengan dua gelar yang berdampingan: imam dan ahli kitab. Dapat juga diterjemahkan: “Ezra, imam-ahli kitab.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Kata tunjuk jamak ini merujuk kembali kepada orang-orang yang disebut dalam daftar sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan identitas baru.
- source_word: בִּימֵי
  choice: pada zaman
  rationale: Ungkapan idiomatis ini menempatkan orang-orang tersebut dalam suatu masa sejarah dan mempertahankan nuansa ungkapan Ibrani.
- source_word: יוֹיָקִים
  choice: Yoyakim
  rationale: Transliterasi nama tokoh imam pascapembuangan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: bin Yesua bin Yozadak
  rationale: בֶּן dalam catatan silsilah ini berarti 'anak laki-laki dari'; 'bin' menyampaikan hubungan tersebut secara ringkas dan lazim dalam nama silsilah Alkitab bahasa Indonesia.
- source_word: וּבִימֵי
  choice: dan pada zaman
  rationale: Pengulangan frasa waktu dipertahankan untuk mencerminkan struktur Ibrani dan penambahan acuan masa berikutnya.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Nehemia, sang gubernur
  rationale: פֶּחָה menunjuk kepada kepala pemerintahan provinsi dalam tata pemerintahan kekaisaran; 'gubernur' merupakan padanan modern yang jelas.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: serta Ezra, imam dan ahli kitab itu
  rationale: Dua nomina definit dalam bahasa Ibrani memberi Ezra dua gelar yang berdampingan. Terjemahan ini mempertahankan keduanya sebagai gelar bagi orang yang sama dan tetap alami dalam bahasa Indonesia.
