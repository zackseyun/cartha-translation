  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: id
  text: Keturunan para penyanyi berkumpul dari daerah di sekeliling Yerusalem[a] dan dari permukiman-permukiman orang Netofa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dataran di sekeliling Yerusalem.” Kata Ibrani כִּכָּר dapat berarti dataran, kawasan melingkar, atau daerah, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “desa-desa orang Netofa.” Kata Ibrani חַצְרֵי sering menunjuk pada permukiman kecil atau desa yang tidak bertembok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal dapat bernuansa pasif atau refleksif. Dalam bahasa Indonesia, “berkumpul” secara alami mempertahankan ketidakjelasan apakah mereka datang atas prakarsa sendiri atau dihimpunkan.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: anak-anak para penyanyi
  rationale: Terjemahan ini mempertahankan konstruksi harfiah “anak-anak para penyanyi”; dalam konteks, ungkapan itu dapat merujuk pada keturunan atau kelompok para penyanyi.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisip substantival ini secara khusus menunjuk kepada orang-orang yang bernyanyi, bukan pemusik secara umum.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: daerah di sekeliling Yerusalem
  rationale: כִּכָּר dapat berarti dataran, kawasan melingkar, atau daerah. Bersama סְבִיבוֹת, “daerah di sekeliling” menyampaikan acuan geografisnya dengan wajar tanpa memastikan bahwa wilayah itu berupa dataran.
- source_word: חַצְרֵי
  choice: permukiman-permukiman
  rationale: Dalam konteks geografis, חָצֵר lazim menunjuk pada permukiman kecil atau desa yang tidak bertembok, bukan sekadar halaman.
- source_word: נְטֹפָתִי
  choice: orang Netofa
  rationale: Bentuk gentilisia ini menunjuk kepada orang-orang yang terkait dengan Netofa. “Orang Netofa” merupakan bentuk Indonesia yang alami dan mempertahankan nuansa asal geografis tersebut.
