  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: id
  text: Matanya, Bakbukya, Obaja, Mesulam, Talmon, dan Akub adalah para penjaga, yaitu penjaga pintu gerbang, yang menjalankan tugas penjagaan di tempat-tempat penyimpanan[a] pada pintu-pintu gerbang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat-tempat pengumpulan.” Istilah Ibrani ini tidak sepenuhnya pasti; dalam konteks ini kemungkinan menunjuk tempat-tempat penyimpanan.
    reason: Mempertahankan arti dasar dan ketidakpastian אֲסֻפֵּי, sambil menjelaskan alasan terjemahan kontekstual.
lexical_decisions:
- source_word: שֹׁמְרִים שׁוֹעֲרִים מִשְׁמָר
  choice: para penjaga pintu gerbang yang bertugas jaga
  rationale: Rangkaian ini mempertahankan unsur menjaga, jabatan penjaga pintu gerbang, dan tugas jaga, tetapi menyusunnya secara wajar dalam bahasa Indonesia.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: di ruang-ruang penyimpanan pada pintu-pintu gerbang
  rationale: Dalam konteks ini אֲסֻפִּים paling mungkin menunjuk tempat barang dikumpulkan atau disimpan; bentuk jamaknya dipertahankan dan kaitannya dengan pintu-pintu gerbang dibuat jelas.
- source_word: מַתַּנְיָה וּבַקְבֻּקְיָה עֹבַדְיָה מְשֻׁלָּם טַלְמוֹן עַקּוּב
  choice: Matanya, Bakbukya, Obaja, Mesulam, Talmon, dan Akub
  rationale: Nama-nama ditransliterasikan dalam bentuk yang ringkas dan lazim dibaca oleh pembaca Indonesia.
