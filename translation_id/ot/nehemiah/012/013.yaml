  text: for Ezra[a], Meshullam; for Amariah[b], Jehohanan.
translation:
  language: id
  text: 'dari keluarga Ezra[a]: Mesulam; dari keluarga Amarya: Yohanan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari Ezra … dari Amarya.” Kata depan Ibrani dapat diterjemahkan lebih harfiah demikian, tetapi dalam daftar ini tampaknya menunjuk kepada wakil dari setiap keluarga imam.
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani ini juga dapat ditransliterasikan “Yehohanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְ/עֶזְרָא
  choice: untuk Ezra
  rationale: 'Dalam daftar kepala keluarga imam ini, prefiks לְ menandai hubungan atau perwakilan: Mesulam adalah orang yang bersesuaian dengan keluarga Ezra. Terjemahan lebih harfiah ''dari Ezra'' tetap dicatat sebagai kemungkinan.'
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Nama diri Ibrani ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: לַ/אֲמַרְיָה
  choice: untuk Amarya
  rationale: Seperti pada frasa sebelumnya, prefiks לַ menandai keluarga imam yang diwakili oleh nama berikutnya.
- source_word: יְהוֹחָנָן
  choice: Yohanan
  rationale: Transliterasi Indonesia 'Yohanan' mempertahankan bunyi dan bentuk dasar nama Ibrani יְהוֹחָנָן secara wajar; bentuk ini tidak perlu dibedakan dari penyederhanaan ejaan Inggris.
