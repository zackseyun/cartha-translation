  text: Empat kali mereka mengirimkan pesan yang sama kepadaku[a], dan aku menjawab mereka dengan jawaban yang sama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sesuai dengan hal ini” dalam kedua klausa; frasa tersebut merujuk pada pesan yang sama yang berulang kali disampaikan dan pada jawaban yang sama yang diberikan kembali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: mereka mengirim pesan ... kepadaku
  rationale: Kata kerja שׁלח berarti ‘mengirim’; objeknya tidak disebutkan secara tersurat. Dalam konteks komunikasi berulang, ‘mengirim pesan’ merupakan ungkapan Indonesia yang alami, tanpa menentukan bahwa yang dikirim adalah utusan.
- source_word: כַּדָּבָר הַזֶּה
  choice: seperti itu / dengan cara yang sama
  rationale: Secara harfiah berarti ‘menurut perkataan/hal ini’. Dalam konteks ini, frasa tersebut menunjuk pada komunikasi yang sama dan jawaban Nehemia yang tetap sama. Variasi ungkapan dipakai agar kalimat alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
- source_word: אַרְבַּע פְּעָמִים
  choice: empat kali
  rationale: Padanan langsung bagi ungkapan yang menyatakan empat kejadian berulang.
- source_word: וָאָשִׁיב אוֹתָם
  choice: dan aku menjawab mereka
  rationale: Bentuk Hifil dari שׁוב dapat berarti ‘memberikan jawaban’ dalam konteks surat-menyurat atau komunikasi. ‘Menjawab mereka’ alami dan tetap mempertahankan rujukan pronomina kepada para pengirim.
