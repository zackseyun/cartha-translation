  to: Ketika semua musuh kami mendengar hal itu dan semua bangsa di sekeliling kami melihatnya, mereka sangat kehilangan kepercayaan diri[a] dan menyadari bahwa pekerjaan ini telah dilakukan oleh Allah kami.
