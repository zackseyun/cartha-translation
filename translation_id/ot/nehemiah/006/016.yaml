source:
  edition: WLC
  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: id
  text: Ketika semua musuh kami mendengar hal itu dan semua bangsa di sekeliling kami melihatnya, mereka sangat kehilangan kepercayaan diri[a] dan menyadari bahwa pekerjaan ini telah dilakukan oleh Allah kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka sangat jatuh dalam pandangan mereka sendiri”; maksudnya, mereka sangat kehilangan kepercayaan diri atau merasa sangat direndahkan.
    reason: Menjelaskan idiom Ibrani yang tidak lazim bila diterjemahkan secara harfiah dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif וַיְהִי tidak perlu diterjemahkan secara kaku sebagai “terjadilah”; “ketika” menyampaikan peralihan waktu secara alami dalam bahasa Indonesia.
- source_word: שָׁמְעוּ
  choice: mendengar hal itu
  rationale: Objek verba tidak dinyatakan dalam bahasa Ibrani, tetapi konteks menunjuk pada selesainya tembok. “Hal itu” menjaga implikasi tersebut tanpa menjabarkannya secara berlebihan.
- source_word: כָּל אֹיְבֵינוּ
  choice: semua musuh kami
  rationale: Padanan langsung dan alami untuk frasa dengan akhiran posesif orang pertama jamak.
- source_word: וַיִּרְאוּ
  choice: melihatnya
  rationale: Bentuk ini berasal dari verba umum “melihat”; akhiran “-nya” merujuk secara alami pada hasil pekerjaan yang tampak dalam konteks.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: semua bangsa di sekeliling kami
  rationale: גּוֹיִם di sini menunjuk pada bangsa-bangsa sekitar, tanpa muatan teologis khusus yang mungkin tersirat oleh istilah lain.
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: mereka menjadi sangat kecil dalam pandangan mereka sendiri
  rationale: Terjemahan ini mempertahankan citra penurunan dalam penilaian diri sambil tetap dapat dipahami. Catatan kaki menjelaskan bentuk harfiah dan makna idiomatisnya.
- source_word: וַיֵּדְעוּ
  choice: dan menyadari
  rationale: Dalam konteks ini verba “mengetahui” menyatakan pengakuan yang timbul setelah melihat hasilnya; “menyadari” terdengar lebih alami dalam bahasa Indonesia.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: karena Allah kami
  rationale: Preposisi ini menyatakan sumber atau pelaku yang menentukan. “Karena Allah kami” mengaitkan keberhasilan pekerjaan itu dengan Allah tanpa memberi kesan bahwa manusia sama sekali tidak mengerjakannya.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: pekerjaan ini terlaksana
  rationale: Bentuk pasif Niphal dan hasil yang telah selesai disampaikan secara alami oleh “terlaksana”.
theological_decisions:
- issue: Peran Allah dalam penyelesaian pekerjaan
  choice: pekerjaan ini terlaksana karena Allah kami
  alternative: pekerjaan ini dikerjakan oleh Allah kami / pekerjaan ini terlaksana dengan pertolongan Allah kami
  rationale: Teks menegaskan bahwa Allah adalah sumber atau pelaku penentu di balik keberhasilan tersebut. Pilihan ini mempertahankan pengakuan akan peran ilahi tanpa menambahkan kata “pertolongan” yang tidak dinyatakan secara eksplisit atau menghapus keterlibatan para pekerja manusia.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat diperlancar tanpa menghilangkan urutan mendengar, melihat, merasa direndahkan, dan menyadari. Pronomina rujukan ditambahkan seperlunya agar objek yang tersirat dalam bahasa Ibrani terbaca alami.
