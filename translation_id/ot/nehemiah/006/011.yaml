  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: id
  text: Namun aku berkata, “Haruskah orang seperti aku melarikan diri? Siapakah orang seperti aku yang dapat masuk ke dalam Bait Allah[a] dan tetap hidup? Aku tidak akan masuk.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ruang suci.” Kemungkinan maksudnya bukan sekadar bersembunyi di dalam sebuah bangunan, melainkan memasuki bagian Bait Allah secara tidak semestinya bagi Nehemia. Hal ini menjelaskan ungkapan “dan tetap hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Namun aku berkata
  rationale: Waw melanjutkan narasi, tetapi dalam konteks ini jawaban Nehemia berlawanan dengan usul sebelumnya; “Namun” menyampaikan hubungan adversatif itu secara wajar.
- source_word: הָאִישׁ כָּמוֹנִי
  choice: orang seperti aku
  rationale: Frasa ini bersifat umum dalam pertanyaan retoris dan menekankan kedudukan serta tanggung jawab Nehemia, bukan menunjuk laki-laki tertentu.
- source_word: יִבְרָח
  choice: melarikan diri
  rationale: Kata kerja ini menyatakan lari karena takut atau mundur dari bahaya, dengan daya moral yang sesuai bagi penolakan Nehemia.
- source_word: וּמִי כָמוֹנִי
  choice: Siapakah orang seperti aku
  rationale: Mempertahankan pertanyaan retoris dan pengulangan penekanan pada diri Nehemia dengan susunan yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יָבוֹא
  choice: yang dapat masuk
  rationale: Klausa relatif Ibrani bersifat eliptis. “Yang dapat masuk” mempertahankan nada retoris tentang kelayakan atau kemungkinan tanpa menjadikannya sekadar pernyataan masa depan.
- source_word: הַהֵיכָל
  choice: Bait Allah
  rationale: Dalam konteks ini kata tersebut menunjuk bangunan atau ruang suci Bait Allah. “Bait Allah” jelas dan lazim, sedangkan cakupan yang lebih khusus dijelaskan dalam catatan kaki.
- source_word: וָחָי
  choice: dan tetap hidup
  rationale: Terjemahan ini mempertahankan kaitan langsung antara tindakan masuk dan akibat berupa hidup atau selamat, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לֹא אָבוֹא
  choice: Aku tidak akan masuk
  rationale: Mengulang gagasan masuk pada klausa sebelumnya dan menyampaikan penolakan tegas Nehemia.
theological_decisions:
- issue: Implikasi memasuki Bait Allah
  choice: Teks utama menyatakan bahwa Nehemia menolak masuk ke dalam Bait Allah, sementara catatan kaki menunjukkan kemungkinan bahwa yang dimaksud ialah ruang suci yang terlarang baginya.
  alternative: Nehemia hanya menolak bersembunyi di dalam bangunan itu tanpa implikasi pelanggaran aturan ibadah.
  rationale: Konteks Nehemia 6:10–13 mengisyaratkan bahwa usul itu dimaksudkan untuk membuat Nehemia berdosa dan mencemarkan namanya. Terjemahan utama tetap luas dan tidak memaksakan rincian, sedangkan catatan mempertahankan kemungkinan makna kultis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris serta pengulangan “orang seperti aku” dipertahankan untuk menjaga tekanan dan ketegangan teks sumber.
