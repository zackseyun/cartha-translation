  text: וַ/יִּשְׁלַ֨ח סַנְבַלַּ֤ט וְ/גֶ֨שֶׁם֙ אֵלַ֣/י לֵ/אמֹ֔ר לְכָ֞/ה וְ/נִֽוָּעֲדָ֥ה יַחְדָּ֛ו בַּ/כְּפִירִ֖ים בְּ/בִקְעַ֣ת אוֹנ֑וֹ וְ/הֵ֨מָּה֙ חֹֽשְׁבִ֔ים לַ/עֲשׂ֥וֹת לִ֖/י רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: id
  text: Lalu Sanbalat dan Gesyem mengirim pesan kepadaku, “Datanglah, mari kita bertemu di desa-desa[a] di dataran Ono[b].” Namun, mereka bermaksud mencelakakan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “di Kefirim”, jika kata Ibrani itu dipahami sebagai nama tempat, bukan “di desa-desa”.
    reason: alternative_reading
  - marker: b
    text: “Dataran” juga dapat diterjemahkan “lembah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim pesan
  rationale: Kata kerja ini secara harfiah berarti ‘mengutus/mengirim’. Karena לֵאמֹר memperkenalkan isi komunikasi, ‘mengirim pesan’ menyatakan maksudnya dengan wajar dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: Sanbalat dan Gesyem
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang wajar dan lazim dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: bunyinya
  rationale: Ungkapan ini memperkenalkan kutipan langsung. ‘Bunyinya’ alami setelah ‘mengirim pesan’ dan menghindari pengulangan yang kaku.
- source_word: לְכָה
  choice: Datanglah
  rationale: Walaupun berasal dari kata kerja ‘pergi/berjalan’, bentuk perintah ini berfungsi sebagai ajakan agar Nehemia datang ke tempat pertemuan.
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: mari kita bertemu
  rationale: Bentuk Nifal menyatakan pertemuan yang diatur bersama. ‘Mari kita bertemu’ menyampaikan unsur ajakan dan kebersamaan tanpa pengulangan ‘bertemu bersama’ yang kurang alami.
- source_word: בַּכְּפִירִים
  choice: di desa-desa
  rationale: Bentuk ini paling mungkin merupakan nomina umum yang berarti desa-desa atau permukiman kecil. Kemungkinan bahwa kata ini adalah nama tempat tetap dicatat dalam catatan kaki.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: di Dataran Ono
  rationale: בִּקְעָה menunjuk pada lembah luas atau dataran rendah. ‘Dataran’ cocok dengan topografi yang dimaksud, sedangkan ‘lembah’ dipertahankan sebagai alternatif.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Namun, mereka berniat
  rationale: Dalam konteks ini חֹשְׁבִים berarti merancang atau bermaksud, bukan sekadar berpikir. ‘Namun’ memperjelas pertentangan antara undangan mereka dan niat tersembunyi mereka.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: mencelakakan aku
  rationale: Ungkapan ini secara idiomatis berarti melakukan sesuatu yang jahat atau merugikan terhadap Nehemia. ‘Mencelakakan aku’ alami dan tidak menentukan bentuk bahaya yang tidak disebutkan teks.
