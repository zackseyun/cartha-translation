reference: Nehemiah 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: id
  text: Kemudian aku pergi ke rumah Semaya bin Delaya bin Mehetabeel. Ia sedang terkurung. Katanya, “Mari kita bertemu di Rumah Allah, di dalam Bait Suci[a], dan mari kita menutup pintu-pintu Bait Suci itu, sebab mereka akan datang untuk membunuhmu—pada malam hari mereka akan datang untuk membunuhmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam bangunan Bait Allah” atau “di dalam ruang kudus.” Kata Ibrani heikhal dapat menunjuk pada bangunan Bait atau ruang sucinya, bukan hanya seluruh kompleks Bait dan pelatarannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: Kemudian aku pergi
  rationale: Konjungsi dan kata ganti meneruskan alur dengan sedikit penekanan pada pelaku; ‘kemudian aku pergi’ alami dalam narasi Indonesia dan sesuai dengan sudut pandang Nehemia.
- source_word: בֵּית שְׁמַעְיָה
  choice: ke rumah Semaya
  rationale: Bentuk konstruksi dengan nama pribadi menunjuk pada kediaman Semaya; ‘rumah’ merupakan padanan Indonesia yang langsung dan alami.
- source_word: שְׁמַעְיָה בֶן דְּלָיָה בֶּן מְהֵיטַבְאֵל
  choice: Semaya bin Delaya bin Mehetabeel
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim bagi pembaca Alkitab berbahasa Indonesia, sedangkan בֶן diterjemahkan ‘bin’ secara ringkas.
- source_word: וְהוּא עָצוּר
  choice: Ia sedang terkurung
  rationale: עָצוּר dapat berarti dikurung, tertahan, atau mengasingkan diri. Bentuk pasif ‘terkurung’ mempertahankan ketidakjelasan mengenai sebab dan sifat keadaannya tanpa menambahkan bahwa ia ditahan secara resmi atau sengaja mengurung diri.
- source_word: נִוָּעֵד
  choice: Mari kita bertemu
  rationale: Bentuk Nifal ini menyampaikan ajakan untuk mengadakan pertemuan; ungkapan tersebut wajar dan jelas dalam bahasa Indonesia.
- source_word: בֵּית הָאֱלֹהִים
  choice: Rumah Allah
  rationale: Ungkapan ini merupakan sebutan bagi kompleks Bait Allah dan mempertahankan metafora Ibrani ‘rumah Allah’.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: di dalam bait suci
  rationale: הֵיכָל di sini menunjuk pada bangunan suci, bukan sekadar seluruh pelataran. ‘Bait suci’ menyampaikan ruang sakral tersebut tanpa mempersempitnya secara pasti menjadi ruang terdalam.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: lalu menutup pintu-pintu bait suci itu
  rationale: Ajakan berlanjut melalui bentuk kohortatif. Bentuk jamak ‘pintu-pintu’ mempertahankan rincian teks Ibrani.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: sebab mereka akan datang untuk membunuhmu
  rationale: Subjek jamak tidak disebutkan secara khusus dan secara alami dinyatakan dengan ‘mereka’. Bentuk ‘akan datang’ menyampaikan ancaman yang segera terjadi secara wajar dalam bahasa Indonesia.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: —pada malam hari mereka akan datang untuk membunuhmu
  rationale: Pengulangan dipertahankan untuk menyampaikan desakan dan ancaman. ‘Pada malam hari’ tidak mempersempit makna menjadi ‘malam ini’, yang tidak dinyatakan secara eksplisit dalam teks.
theological_decisions:
- issue: Makna הֵיכָל dalam konteks masuk ke ruang suci yang aksesnya terbatas
  choice: bait suci
  alternative: bangunan Bait Allah; ruang kudus
  rationale: Konteks ayat berikutnya menunjukkan bahwa yang dimaksud adalah ruang suci yang tidak patut dimasuki Nehemia, tetapi הֵיכָל sendiri tidak harus berarti ruang terdalam. Teks utama memakai ‘bait suci’ dan catatan kaki mempertahankan kemungkinan makna yang lebih teknis.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Sapaan orang kedua tunggal diterjemahkan ‘-mu’ karena Semaya berbicara langsung kepada Nehemia. Pengulangan ancaman dipertahankan demi daya retoris teks sumber.
