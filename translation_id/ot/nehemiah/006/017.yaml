  text: Also[a], in those days the nobles of Judah were sending many letters to Tobiah, and those from Tobiah were coming to them.
translation:
  language: id
  text: Juga pada masa itu, para bangsawan Yehuda mengirim banyak surat kepada Tobia, dan surat-surat dari Tobia datang kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “surat-surat mereka pergi kepada Tobia, dan yang milik Tobia datang kepada mereka.” Pada bagian kedua, kata “surat-surat” tersirat dari bagian pertama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Menandai keadaan tambahan yang berkaitan dengan rangkaian peristiwa sebelumnya dan mempertahankan daya aditif teks Ibrani.
- source_word: בַּיָּמִים הָהֵם
  choice: pada masa itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia modern dan sesuai dengan konteks naratif.
- source_word: מַרְבִּים
  choice: berkali-kali mengirim
  rationale: Dalam konstruksi dengan 'surat-surat mereka', bentuk ini menunjukkan tindakan yang banyak atau berulang, bukan sekadar keadaan statis.
- source_word: חֹרֵי יְהוּדָה
  choice: para bangsawan Yehuda
  rationale: Istilah ini menunjuk kepada kalangan pemimpin atau elite sosial Yehuda; 'bangsawan' mempertahankan nuansa kedudukan sosial-politiknya.
- source_word: אִגְּרֹתֵיהֶם
  choice: surat
  rationale: Merujuk pada korespondensi tertulis. Kepemilikan dapat dipahami dari subjek pengirim dalam bahasa Indonesia.
- source_word: הוֹלְכוֹת עַל טוֹבִיָּה
  choice: mengirim surat kepada Tobia
  rationale: Secara harfiah surat-surat itu 'pergi kepada Tobia'; ungkapan ini secara idiomatis menyatakan pengiriman korespondensi.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה
  choice: surat-surat dari Tobia
  rationale: Konstruksi eliptis ini secara harfiah berarti 'yang milik Tobia'; nomina 'surat-surat' dipasok dari klausa paralel, sementara 'dari' menyampaikan asal korespondensi yang paling mungkin.
- source_word: בָּאוֹת אֲלֵיהֶם
  choice: datang kepada mereka
  rationale: Mempertahankan gambaran gerak dalam teks sumber dan menunjukkan korespondensi timbal balik yang berlangsung.
