revisions:
- from: Ya Allahku, ingatlah Tobia dan Sanbalat sesuai dengan perbuatan-perbuatan mereka ini. Ingatlah juga Noaja, nabi perempuan itu, dan nabi-nabi lain yang berusaha membuat aku takut.[a]
  to: Ya Allahku, ingatlah Tobia dan Sanbalat sesuai dengan perbuatan mereka ini, juga Noaja, nabi perempuan itu, dan para nabi lainnya, mereka semua yang berusaha membuat aku takut.[a]
  rationale: Revisi menghapus pengulangan imperatif yang tidak diekspresikan dalam Ibrani, mengganti “nabi-nabi lain” dengan “para nabi lainnya” untuk mencerminkan יֶתֶר, dan menata ulang klausa akhir agar Noaja maupun para nabi lainnya sama-sama jelas menjadi pelaku usaha menimbulkan ketakutan. Makna permohonan agar Allah mengingat mereka menurut perbuatan mereka tetap tidak diperluas menjadi seruan penghukuman.
