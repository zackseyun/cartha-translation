reference: Nehemiah 6:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זָכְרָ֧/ה אֱלֹהַ֛/י לְ/טוֹבִיָּ֥ה וּ/לְ/סַנְבַלַּ֖ט כְּ/מַעֲשָׂ֣י/ו אֵ֑לֶּה וְ/גַ֨ם לְ/נוֹעַדְיָ֤ה הַ/נְּבִיאָה֙ וּ/לְ/יֶ֣תֶר הַ/נְּבִיאִ֔ים אֲשֶׁ֥ר הָי֖וּ מְיָֽרְאִ֥ים אוֹתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: id
  text: Ya Allahku, ingatlah Tobia dan Sanbalat sesuai dengan perbuatan mereka ini, juga Noaja, nabi perempuan itu, dan para nabi lainnya, mereka semua yang berusaha membuat aku takut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang terus berusaha mengintimidasi aku.”'
    reason: Alternatif ini menonjolkan nuansa tindakan yang berlangsung dan usaha sengaja untuk menimbulkan ketakutan dalam אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי.
lexical_decisions:
- source_word: זָכְרָה
  choice: ingatlah
  rationale: Bentuk ini merupakan permohonan langsung kepada Allah agar memperhatikan dan menanggapi perbuatan para lawan; “ingatlah” mempertahankan bentuk doa Ibrani tanpa menambahkan gagasan penghukuman secara eksplisit.
- source_word: אֱלֹהַי
  choice: Ya Allahku
  rationale: Nomina dengan sufiks orang pertama tunggal menyatakan hubungan pribadi dan berfungsi sebagai sapaan; partikel “Ya” membuat sapaan doa alami dalam bahasa Indonesia.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: Tobia dan Sanbalat
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca; prefiks ל menandai pihak yang diminta untuk diingat.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: sesuai dengan perbuatan-perbuatan mereka ini
  rationale: Prefiks כ menyatakan kesesuaian atau ukuran. Sufiks maskulin tunggal pada מַעֲשָׂיו secara gramatikal dapat menunjuk kepada satu orang, tetapi dalam konteks kedua nama tersebut diperlakukan bersama; bentuk “mereka” menyampaikan rujukan kolektif secara alami.
- source_word: וְגַם
  choice: juga
  rationale: Menandai penambahan Noaja dan kelompok nabi lain ke dalam cakupan doa.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: Noaja, nabi perempuan itu
  rationale: Bentuk feminin הַנְּבִיאָה secara eksplisit menunjukkan bahwa Noaja adalah seorang perempuan. “Nabi perempuan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: dan nabi-nabi lain
  rationale: יֶתֶר berarti bagian yang tersisa. “Nabi-nabi lain” menyampaikan bahwa kelompok tersebut berada di samping Noaja tanpa kekakuan ungkapan “sisa para nabi”.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: yang berusaha membuat aku takut
  rationale: Konstruksi הָיוּ dengan partisip menyatakan tindakan yang berlangsung, sedangkan bentuk kausatif dari ירא menunjukkan usaha menimbulkan ketakutan. Terjemahan ini menjaga aspek duratif dan kausatifnya.
theological_decisions:
- issue: Nada permohonan agar Allah mengingat para lawan
  choice: Mempertahankan permohonan agar Allah mengingat mereka sesuai dengan perbuatan mereka, tanpa menambahkan penghukuman secara eksplisit.
  alternative: “Hukumlah mereka” atau “mintalah pertanggungjawaban mereka.”
  rationale: Ayat ini bernada kutukan atau permohonan penghakiman, tetapi teks Ibrani hanya meminta Allah untuk “mengingat” mereka sesuai dengan perbuatan mereka. Terjemahan tidak boleh memperluasnya menjadi rumusan hukum yang tidak dinyatakan.
- issue: Rujukan sufiks tunggal pada “perbuatannya” setelah dua nama
  choice: Menggunakan “perbuatan-perbuatan mereka” sebagai rujukan kolektif kepada Tobia dan Sanbalat.
  alternative: “Perbuatan-perbuatannya,” yang dapat dipahami hanya merujuk kepada Sanbalat.
  rationale: Bentuk sumber memang tunggal secara morfologis, tetapi susunan kalimat mencakup kedua lawan. Bahasa Indonesia memerlukan pilihan jumlah yang lebih tegas; bentuk jamak paling sesuai dengan konteks tanpa menentukan pembagian kesalahan masing-masing.
translation_notes:
  register: Bahasa doa dibuat langsung, bermartabat, dan mudah dipahami. Pengulangan “ingatlah” pada kalimat kedua memperjelas cakupan verba Ibrani terhadap Noaja dan nabi-nabi lain. Bentuk “membuat aku takut” dipilih daripada “menakut-nakuti aku” untuk mempertahankan nuansa kausatif dengan nada yang lebih khidmat.
