  text: וַ/תִּשְׁלַם֙ הַֽ/חוֹמָ֔ה בְּ/עֶשְׂרִ֥ים וַ/חֲמִשָּׁ֖ה לֶ/אֱל֑וּל לַ/חֲמִשִּׁ֥ים וּ/שְׁנַ֖יִם יֽוֹם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/015.yaml
  text: So the wall was finished on the twenty-fifth day of Elul[b][a], in fifty-two days.
translation:
  language: id
  text: Demikianlah tembok itu selesai pada hari kedua puluh lima bulan Elul[a], dalam waktu lima puluh dua hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Elul adalah bulan keenam dalam kalender Ibrani.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: selesai
  rationale: Bentuk wayyiqtol qal dari שׁלם dengan הַחוֹמָה sebagai subjek menyatakan bahwa pembangunan tembok mencapai penyelesaian. 'Tembok itu selesai' alami dalam bahasa Indonesia dan tidak perlu diubah menjadi konstruksi pasif eksplisit.
- source_word: הַחוֹמָה
  choice: tembok itu
  rationale: Nomina definit yang dalam konteks merujuk pada tembok Yerusalem. 'Tembok itu' mempertahankan definiteness dan rujukan naratifnya.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה
  choice: pada hari kedua puluh lima
  rationale: Preposisi dengan angka membentuk ungkapan tanggal. Kata 'hari' ditambahkan secara wajar dalam bahasa Indonesia agar tanggalnya jelas.
- source_word: לֶאֱלוּל
  choice: bulan Elul
  rationale: Elul adalah nama bulan dan dipertahankan sebagai transliterasi; kata 'bulan' membuat ungkapan tanggal alami dan jelas bagi pembaca Indonesia.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: dalam waktu lima puluh dua hari
  rationale: Lamed pada frasa angka menunjukkan lamanya waktu sampai pekerjaan selesai. 'Dalam waktu' menyampaikan total durasi, bukan sekadar urutan waktu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Demikianlah' menghubungkan hasil akhir ini dengan rangkaian peristiwa sebelumnya; susunan kalimat tetap dekat dengan teks Ibrani sambil terdengar alami.
