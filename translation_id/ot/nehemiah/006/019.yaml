base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: id
  text: Mereka juga terus membicarakan kebaikan-kebaikannya di hadapanku[a], dan terus menyampaikan perkataanku kepadanya[b]. Tobia mengirim surat-surat untuk membuatku takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “perbuatan-perbuatan baiknya”, “sifat-sifat baiknya”, atau “hal-hal baik tentang dia”. Ungkapan Ibraninya lebih luas daripada perbuatan saja; dalam konteks ini mereka memuji Tobia di hadapan Nehemia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka terus membawa keluar perkataanku kepadanya”, yaitu meneruskan atau melaporkan perkataan Nehemia kepada Tobia.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Mempertahankan daya aditif kata Ibrani dan menghubungkan tindakan ini dengan rangkaian sebelumnya.
- source_word: טוֹבֹתָיו
  choice: kebaikan-kebaikannya
  rationale: Bentuk jamak substantival dari 'baik' cukup luas untuk mencakup perbuatan, sifat, atau hal-hal baik tentang Tobia; pilihan ini mempertahankan keluasan makna sumber.
- source_word: הָיוּ אֹמְרִים
  choice: terus membicarakan
  rationale: Konstruksi היה dengan partisip menyatakan tindakan lampau yang berlangsung atau berulang; 'terus' menangkap aspek tersebut secara alami.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Padanan langsung dan wajar untuk ungkapan harfiah 'di depanku', dengan arti dalam kehadiran Nehemia.
- source_word: וּדְבָרַי
  choice: perkataanku
  rationale: Dalam konteks informasi yang diteruskan kepada Tobia, דְּבָרַי paling alami merujuk pada apa yang dikatakan Nehemia.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: terus menyampaikan ... kepadanya
  rationale: Secara harfiah berarti 'terus membawa keluar ... kepadanya', tetapi dalam konteks merupakan idiom untuk meneruskan atau melaporkan informasi.
- source_word: אִגְּרוֹת
  choice: surat-surat
  rationale: Padanan Indonesia modern yang lazim untuk korespondensi tertulis; bentuk ulang menyatakan jamak.
- source_word: שָׁלַח
  choice: mengirim
  rationale: Padanan naratif yang langsung dan alami.
- source_word: לְיָרְאֵנִי
  choice: untuk menakut-nakuti aku
  rationale: Menyatakan tujuan surat-surat itu, yakni membuat Nehemia takut; bentuk 'menakut-nakuti' juga sesuai dengan jamaknya surat dan tindakan intimidasi yang berulang.
