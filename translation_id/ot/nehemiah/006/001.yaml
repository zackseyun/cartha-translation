  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: id
  text: Ketika Sanbalat, Tobia, Gesyem orang Arab, dan musuh-musuh kami yang lain mendengar bahwa aku telah membangun kembali tembok itu dan tidak ada lagi celah padanya—meskipun sampai saat itu aku belum memasang pintu-pintu pada gerbang-gerbang—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Ketika
  rationale: Ungkapan ini mengantar perkembangan narasi dan klausa waktu; “Ketika” alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: נִשְׁמַע לְסַנְבַלַּט ...
  choice: Sanbalat ... mendengar
  rationale: Bentuk pasif Ibrani secara idiomatis dialihkan menjadi konstruksi aktif dengan para penerima berita sebagai subjek.
- source_word: סַנְבַלַּט וְטוֹבִיָּה וּלְגֶשֶׁם הָעַרְבִי
  choice: Sanbalat, Tobia, Gesyem orang Arab
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca; הָעַרְבִי diterjemahkan langsung sebagai sebutan etnis.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: musuh-musuh kami yang lain
  rationale: Menyampaikan arti ‘selebihnya dari musuh kami’ secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi berita yang mereka dengar, bukan menyatakan sebab.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: aku telah membangun kembali tembok itu
  rationale: Kata kerjanya secara harfiah berarti ‘membangun’, tetapi konteksnya adalah pemulihan tembok Yerusalem yang sudah ada; ‘membangun kembali’ menyampaikan konteks tersebut dengan wajar.
- source_word: וְלֹא נוֹתַר בָּהּ פָּרֶץ
  choice: dan tidak ada lagi bagian yang berlubang
  rationale: פֶּרֶץ menunjuk pada celah atau bagian tembok yang terbuka/rusak; ungkapan ini jelas bagi pembaca umum tanpa menyiratkan lubang kecil biasa.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: meskipun sampai saat itu
  rationale: 'Dalam konteks ini גַּם memperkenalkan keterangan yang bersifat konsesif: tembok tertutup, tetapi pintu belum dipasang.'
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: aku belum memasang pintu-pintu pada gerbang-gerbangnya
  rationale: דְּלָתוֹת adalah daun/pintu gerbang, sedangkan שְׁעָרִים adalah bangunan atau bukaan gerbang; terjemahan mempertahankan pembedaan tersebut.
