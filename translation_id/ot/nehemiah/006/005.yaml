  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: id
  text: Lalu Sanbalat mengutus pelayannya kepadaku untuk kelima kalinya dengan cara yang sama, dengan sepucuk surat terbuka di tangannya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “surat yang tidak dimeteraikan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... menyuruh ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Dalam konteks pengutusan utusan kepada seseorang, ungkapan Indonesia ini menyampaikan tindakan mengirim secara alami.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל dengan sufiks orang pertama tunggal menunjukkan arah dan penerima utusan.
- source_word: סַנְבַלַּט
  choice: Sanbalat
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כַּדָּבָר הַזֶּה
  choice: dengan cara yang sama
  rationale: Ungkapan ini secara harfiah berarti 'menurut hal/perkara ini' dan merujuk kembali kepada pola pengiriman sebelumnya; terjemahan ini mempertahankan fungsi anaforisnya secara alami.
- source_word: פַּעַם חֲמִישִׁית
  choice: untuk kelima kalinya
  rationale: Ungkapan Ibrani ini menyatakan jumlah pengulangan; bentuk Indonesia ini jelas dan idiomatis.
- source_word: אֶת נַעֲרוֹ
  choice: pelayannya
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pembantu. Dalam konteks seseorang yang diutus sebagai pembawa pesan, 'pelayan' menyampaikan perannya tanpa menegaskan usia.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: sambil membawa sepucuk surat terbuka
  rationale: Konstruksi ini menggambarkan surat yang menyertai utusan. 'Sambil membawa' menghasilkan hubungan sintaksis yang alami, sedangkan 'sepucuk surat terbuka' mempertahankan gambaran surat yang tidak tertutup atau tidak dimeteraikan.
- source_word: פְּתוּחָה
  choice: terbuka
  rationale: Adjektiva ini secara harfiah berarti 'terbuka'. Dalam konteks surat, maknanya kemungkinan besar tidak dimeteraikan; nuansa itu dicatat dalam catatan kaki.
- source_word: בְּיָדוֹ
  choice: sambil membawa
  rationale: Secara harfiah berarti 'di tangannya'. Terjemahan ini menyampaikan bahwa pelayan itu membawa surat tersebut, dengan susunan yang lebih alami dalam bahasa Indonesia.
