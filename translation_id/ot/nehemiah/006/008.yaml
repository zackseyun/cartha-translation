revisions:
- from: Lalu aku mengirim pesan kepadanya, demikian, “Hal-hal yang kaukatakan itu tidak pernah terjadi. Sebaliknya, engkau mengada-adakannya[a] dari hatimu sendiri.”
  to: 'Lalu aku mengirim pesan kepadanya: “Hal-hal seperti yang kaukatakan itu tidak pernah terjadi, sebab engkau mengada-adakannya dari hatimu sendiri.”'
  rationale: Revisi mengganti penghubung yang terlalu kontras dengan penghubung kausal yang sesuai dengan כִּי, memperjelas idiom “seperti yang kaukatakan,” dan memperhalus pengantar kutipan serta alternatif catatan kaki. Makna, register, dan citra “hati” dari teks Ibrani tetap dipertahankan.
