base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: id
  text: 'Lalu aku mengirim pesan kepadanya: “Hal-hal seperti yang kaukatakan itu tidak pernah terjadi, sebab engkau mengada-adakannya dari hatimu sendiri.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו
  choice: Lalu aku mengirim pesan kepadanya
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi. Objek yang dikirim tidak disebutkan secara eksplisit, tetapi konteks menunjukkan sebuah pesan; penambahan “pesan” membuat ungkapan ini wajar dalam bahasa Indonesia tanpa mengubah maksudnya.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Infinitif pengantar kutipan ini secara alami menandai isi pesan langsung. “Demikian” mempertahankan fungsi pengantar itu dalam ragam tulis yang bermartabat.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Hal-hal ... itu tidak pernah terjadi
  rationale: היה di sini menyangkal kenyataan atau terjadinya tuduhan tersebut. “Hal-hal” mempertahankan keluasan makna דְּבָרִים, sedangkan “itu” menunjuk pada tuduhan yang baru disebutkan.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: yang kaukatakan
  rationale: Partisipel אוֹמֵר menggambarkan pernyataan yang sedang dikemukakan. Bentuk “kaukatakan” ringkas, alami, dan tetap langsung.
- source_word: כִּי
  choice: Sebaliknya
  rationale: 'Dalam konteks bantahan, כִּי mengalihkan dari penyangkalan kepada kenyataan yang berlawanan: tuduhan itu bukan kejadian nyata, melainkan hasil rekaan lawan. “Sebaliknya” menyampaikan daya kontrastif tersebut secara alami.'
- source_word: מִלִּבְּךָ
  choice: dari hatimu sendiri
  rationale: לֵב mencakup batin, pikiran, dan kehendak. “Hati” mempertahankan citra antropologis Ibrani, sementara “sendiri” memperjelas sumber pribadi tuduhan itu.
- source_word: בּוֹדָאם
  choice: engkau mengada-adakannya
  rationale: Kata kerja בדא berarti menciptakan atau mereka-reka sesuatu yang tidak benar. “Mengada-adakan” merupakan padanan Indonesia yang jelas untuk tindakan memalsukan tuduhan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku/engkau” sesuai dengan tuturan langsung dalam konteks narasi Alkitab; bentuk klitik “kau-” dan “-mu” menjaga kelancaran tanpa menghilangkan ketegasan bantahan.
