base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: id
  text: Sebab banyak orang di Yehuda terikat sumpah kepadanya[a], karena ia adalah menantu Sekhanya bin Arah, dan Yohanan, anaknya, telah memperistri[b] anak perempuan Mesulam bin Berekhya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “para pemegang sumpah kepadanya,” yakni orang-orang yang berkewajiban kepadanya berdasarkan sumpah.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mengambil anak perempuan”; dalam konteks ini, ungkapan tersebut berarti mengambilnya sebagai istri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: banyak orang di Yehuda
  rationale: רַבִּים berarti “banyak,” sedangkan בִּיהוּדָה secara alami dipahami secara lokatif, yaitu orang-orang yang berada dalam komunitas Yehuda.
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: terikat sumpah kepadanya
  rationale: Ungkapan harfiahnya adalah “pemilik suatu sumpah kepadanya” dan menunjuk pada orang-orang yang memiliki kewajiban terhadapnya berdasarkan sumpah. Pilihan ini mempertahankan unsur sumpah tanpa menentukan isi sumpah itu secara berlebihan.
- source_word: כִּי ... כִּי
  choice: Sebab ... karena
  rationale: כִּי pertama menghubungkan ayat ini sebagai penjelasan bagi konteks sebelumnya, sedangkan כִּי kedua memperkenalkan alasan bagi ikatan sumpah tersebut.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: ia adalah menantu Sekhanya
  rationale: Dalam konteks hubungan kekerabatan, חָתָן paling wajar berarti “menantu laki-laki.”
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: dan Yohanan, anaknya
  rationale: Susunan ini mempertahankan kata ganti posesif Ibrani tanpa secara eksplisit menetapkan antesedennya, sehingga ambiguitas rujukan yang mungkin dirasakan dalam teks tetap terjaga.
- source_word: לָקַח אֶת בַּת
  choice: telah memperistri anak perempuan
  rationale: Dalam konteks ini, idiom “mengambil anak perempuan” berarti mengambilnya sebagai istri. “Memperistri” menyampaikan maksud perkawinan secara alami dalam bahasa Indonesia.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: anak perempuan Mesulam bin Berekhya
  rationale: Pilihan ini mempertahankan rantai hubungan keluarga dalam bentuk yang ringkas dan lazim dalam bahasa Indonesia.
