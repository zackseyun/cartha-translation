  text: וְ/גַם נְבִיאִ֡ים הֶעֱמַ֣דְתָּ לִ/קְרֹא֩ עָלֶ֨י/ךָ בִֽ/ירוּשָׁלִַ֜ם לֵ/אמֹ֗ר מֶ֚לֶךְ בִּֽ/יהוּדָ֔ה וְ/עַתָּה֙ יִשָּׁמַ֣ע לַ/מֶּ֔לֶךְ כַּ/דְּבָרִ֣ים הָ/אֵ֑לֶּה וְ/עַתָּ֣ה לְכָ֔/ה וְ/נִֽוָּעֲצָ֖ה יַחְדָּֽו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: id
  text: Bahkan engkau telah mengangkat nabi-nabi untuk berseru tentang dirimu di Yerusalem dengan berkata, “Ada raja di Yehuda!”[a] Sekarang, hal-hal ini akan sampai kepada raja.[b] Karena itu, datanglah, dan mari kita berunding bersama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kutipan Ibraninya berbunyi ringkas, “Raja di Yehuda!” Ungkapan tanpa verba ini menyiratkan klaim bahwa ada seorang raja di Yehuda, tetapi tidak secara eksplisit menyebut Nehemia di dalam kutipan.
    reason: alternative_reading
  - marker: b
    text: Atau “kata-kata ini,” “perkara-perkara ini,” atau “laporan-laporan ini.” Kata Ibraninya dapat merujuk secara luas pada perkataan, perkara, atau laporan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bahkan
  rationale: Partikel penambah ini bernuansa penegasan dalam rangkaian tuduhan; “bahkan” menyampaikan tekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: נְבִיאִים
  choice: nabi-nabi
  rationale: Makna biasa kata ini adalah para nabi; konteks tidak memberi alasan untuk melemahkannya menjadi sekadar juru bicara atau utusan.
- source_word: הֶעֱמַדְתָּ
  choice: telah mengangkat
  rationale: Bentuk kausatif di sini menunjuk pada penempatan orang dalam suatu peran; “mengangkat” merupakan padanan Indonesia yang alami untuk penugasan resmi.
- source_word: לִקְרֹא עָלֶיךָ
  choice: untuk berseru tentang dirimu
  rationale: קרא dengan על dapat berarti membuat seruan mengenai seseorang. Terjemahan ini mempertahankan unsur ‘tentang’ tanpa menambahkan bahwa isi seruan itu secara eksplisit menyebut nama Nehemia.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: Ada raja di Yehuda!
  rationale: Klausa Ibrani ini ringkas dan tanpa verba. Rumusan tersebut mempertahankan bentuk laporan dan tuduhan tentang adanya klaim kerajaan tanpa menyisipkan nama Nehemia ke dalam kutipan.
- source_word: יִשָּׁמַע לַמֶּלֶךְ כַּדְּבָרִים הָאֵלֶּה
  choice: raja akan mendengar hal-hal seperti ini
  rationale: Bentuk pasif Ibrani secara harfiah menyatakan bahwa hal seperti ini akan didengar oleh raja. Susunan aktif dipilih agar alami dalam bahasa Indonesia, tanpa mengubah pelaku penerima kabar atau isi ancamannya.
- source_word: דְּבָרִים
  choice: hal-hal
  rationale: Kata ini dapat menunjuk pada perkataan, perkara, atau laporan. “Hal-hal” mempertahankan keluasan makna leksikalnya, sementara konteks tetap menunjukkan bahwa yang dimaksud ialah kabar atau tuduhan politik.
- source_word: לְכָה
  choice: datanglah
  rationale: Imperatif tunggal ini adalah ajakan langsung untuk datang; unsur tersebut dipertahankan secara eksplisit.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: dan mari kita berunding bersama
  rationale: Bentuk volitif menyatakan ajakan untuk saling bertukar pertimbangan. “Berunding bersama” jelas, modern, dan tetap mencerminkan tindakan bersama.
theological_decisions:
- issue: Sifat tuduhan mengenai kedudukan sebagai raja
  choice: Kutipan diterjemahkan “Ada raja di Yehuda!” tanpa menyebut Nehemia di dalam kutipan.
  alternative: “Engkaulah raja di Yehuda!” atau “Nehemia adalah raja di Yehuda!”
  rationale: Konteks mengarahkan tuduhan itu kepada Nehemia, tetapi teks kutipannya sendiri hanya berbunyi ringkas “raja di Yehuda” dan tidak menyebut nama atau pronomina. Terjemahan mempertahankan kekuatan tuduhan sekaligus tidak menambahkan rincian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi dan menekan, sesuai isi surat tuduhan. Pronomina “engkau” dipakai karena sapaan tunggal langsung. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan ajakan “datanglah” dan ketidaktersuratan subjek dalam kutipan mengenai raja.
