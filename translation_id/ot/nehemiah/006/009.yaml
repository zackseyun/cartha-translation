    rationale: Preposisi מִן di sini paling baik dipahami dalam kaitannya dengan mengendur/meninggalkan pekerjaan, bukan sekadar keadaan berlangsungnya pekerjaan atau penyebab kelelahan. Perbaikan diperlukan agar makna sumber lebih jelas.
