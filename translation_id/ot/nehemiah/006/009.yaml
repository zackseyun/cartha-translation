  to: Sebab mereka semua berusaha menakut-nakuti kami dengan berkata, “Tangan mereka akan melemah sehingga mereka berhenti mengerjakan pekerjaan itu[a], dan pekerjaan itu tidak akan selesai.” Tetapi sekarang, kuatkanlah tanganku.[b]
  rationale: Revisi memperjelas idiom “tangan mengendur dari pekerjaan” sebagai hilangnya daya untuk meneruskan pekerjaan, sambil tetap mempertahankan citra tangan dan hubungan logis dengan pekerjaan yang tidak selesai. Catatan kaki a juga dikoreksi agar tidak menyatakan secara terlalu sempit bahwa pekerjaan itu sendiri adalah penyebab kelemahan.
