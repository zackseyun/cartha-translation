base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: id
  text: Sebab mereka semua berusaha menakut-nakuti kami dengan berkata, “Tangan mereka akan melemah sehingga mereka berhenti mengerjakan pekerjaan itu[a], dan pekerjaan itu tidak akan selesai.” Tetapi sekarang, kuatkanlah tanganku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani berbicara tentang tangan yang mengendur atau melemah dari pekerjaan. Ini adalah kiasan bahwa mereka akan kehilangan kekuatan atau tekad dan berhenti mengerjakan pekerjaan itu.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir merupakan doa singkat: “Tetapi sekarang, kuatkanlah tanganku.” Ada yang memahaminya secara berbeda, tetapi vokalisasi teks Ibrani mendukung seruan langsung kepada Allah.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְיָרְאִים אֹתָנוּ
  choice: berusaha menakut-nakuti kami
  rationale: Bentuk partisip Hifil menyatakan tindakan yang sedang berlangsung untuk menimbulkan rasa takut; objek orang pertama jamak dipertahankan sebagai “kami”.
- source_word: לֵאמֹר
  choice: dengan mengatakan
  rationale: Infinitif ini lazim memperkenalkan isi perkataan atau maksud; terjemahan ini tidak menutup kemungkinan bahwa kutipan tersebut mengungkapkan niat mereka.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: Tangan mereka akan menjadi lemah
  rationale: Ungkapan Ibrani menggambarkan tangan yang mengendur sebagai kiasan bagi hilangnya kekuatan atau tekad. Citra “tangan” dipertahankan agar selaras dengan doa penutup.
- source_word: מִן־הַמְּלָאכָה
  choice: dalam pekerjaan itu
  rationale: מְלָאכָה menunjuk pada proyek pembangunan kembali; “pekerjaan itu” jelas dan wajar dalam konteks Indonesia.
- source_word: וְלֹא תֵעָשֶׂה
  choice: sehingga pekerjaan itu tidak akan terlaksana
  rationale: Bentuk Nifal menyatakan bahwa pekerjaan tersebut tidak akan dikerjakan atau diwujudkan. “Tidak akan terlaksana” menyampaikan hasil yang dimaksud secara alami.
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Frasa ini menandai peralihan yang kontras dari rencana para lawan kepada seruan singkat Nehemia.
- source_word: חַזֵּק אֶת־יָדָי
  choice: kuatkanlah tanganku
  rationale: Imperatif dan citra “tangan” dipertahankan, sekaligus menggemakan harapan para lawan agar tangan para pekerja menjadi lemah.
theological_decisions:
- issue: Peralihan dari laporan naratif kepada doa langsung
  choice: 'Klausa terakhir diterjemahkan sebagai permohonan langsung Nehemia kepada Allah: “Tetapi sekarang, kuatkanlah tanganku.”'
  alternative: Memahaminya sebagai pernyataan atau dorongan kepada diri sendiri, misalnya “Sekarang aku menguatkan tanganku.”
  rationale: Vokalisasi Masoret menunjukkan imperatif orang kedua tunggal, sehingga paling wajar dipahami sebagai doa singkat kepada Allah; ini juga sesuai dengan pola doa-doa singkat Nehemia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Citra tangan dipertahankan pada kedua bagian ayat untuk menjaga permainan ungkapan dalam teks Ibrani; bentuk “-lah” menandai permohonan langsung secara alami.
