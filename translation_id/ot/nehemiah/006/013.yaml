base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: id
  text: 'Ia disewa dengan tujuan ini: supaya aku menjadi takut, lalu bertindak demikian dan berdosa, sehingga mereka mempunyai bahan untuk mencemarkan namaku[a] dan mencela aku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan itu akan menjadi bagi mereka sebagai nama buruk.” Ungkapan Ibrani ini ringkas dan agak ambigu. Dalam konteks, dosa Nehemia akan memberi musuh-musuhnya bahan untuk mencemarkan namanya atau memfitnahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: Ia telah disewa dengan maksud
  rationale: Partisip pasif שָׂכוּר paling langsung berarti 'disewa' atau 'dibayar'. Frasa ini menyatakan tujuan perekrutan itu tanpa memperjelasnya secara berlebihan sebagai penyuapan.
- source_word: לְמַעַן אִירָא
  choice: supaya aku menjadi takut
  rationale: Bentuk imperfek sesudah לְמַעַן menyatakan hasil yang dimaksudkan, yaitu membuat Nehemia takut.
- source_word: וְאֶעֱשֶׂה כֵן וְחָטָאתִי
  choice: lalu bertindak demikian dan berdosa
  rationale: 'Terjemahan ini mempertahankan rangkaian tindakan yang dimaksudkan para lawan: rasa takut mendorong Nehemia melakukan tindakan tersebut dan dengan demikian berdosa.'
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: sehingga mereka mempunyai bahan untuk memberi aku nama buruk
  rationale: Ungkapan harfiahnya, 'dan itu menjadi bagi mereka untuk nama buruk', bersifat idiomatis. Dalam konteks, dosa Nehemia akan menjadi bahan bagi lawan-lawannya untuk merusak nama baiknya; 'nama buruk' tetap mempertahankan unsur leksikal שֵׁם.
- source_word: יְחָרְפוּנִי
  choice: mencela aku
  rationale: חרף menyatakan celaan, penghinaan, atau penistaan. 'Mencela' alami dalam bahasa Indonesia dan sesuai dengan konteks serangan terhadap reputasi.
theological_decisions:
- issue: Sifat pembayaran kepada Semaya
  choice: disewa
  alternative: disuap
  rationale: Teks menyatakan bahwa ia dibayar atau disewa, sedangkan niat jahatnya tampak dari konteks. Terjemahan utama tidak mengimpor gagasan teknis penyuapan yang tidak dinyatakan secara eksplisit oleh kata tersebut.
- issue: Makna 'nama buruk'
  choice: nama buruk yang hendak dilekatkan kepada Nehemia
  alternative: nama buruk milik para lawan
  rationale: Konteks dan tujuan akhir 'mencela aku' menunjukkan bahwa tindakan Nehemia akan dipakai untuk merusak reputasinya, walaupun susunan Ibraninya secara harfiah ringkas dan agak ambigu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tujuan diungkapkan dengan 'dengan maksud supaya' dan 'sehingga' agar alur tipu muslihat jelas. 'Ia' mempertahankan pronomina Ibrani yang tegas; acuannya adalah Semaya dari konteks sebelumnya.
