  naturalness: Bahasa draf baku dan jelas. "Kabar-kabar ini" kurang luwes dalam konteks ini; "kabar ini" secara idiomatis dapat merujuk pada keseluruhan isi tuduhan, walaupun דְּבָרִים berbentuk jamak. Penataan ulang kecil pada klausa akhir membuat hubungan "menjadi raja" dengan tuduhan yang disebut lebih jelas.
  terminology: '"Bangsa-bangsa", "orang-orang Yahudi", "memberontak", dan "raja" sesuai konteks historis-politis ayat. "Engkau" cocok dengan register surat formal. Catatan nama diperlukan karena WLC memakai bentuk Gasmu, sementara tradisi terjemahan lazim mengenal nama itu sebagai Geshem/Gesyem.'
