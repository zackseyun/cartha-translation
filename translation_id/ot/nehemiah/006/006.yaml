  to: Di dalamnya tertulis, “Di antara bangsa-bangsa sedang beredar kabar—dan Gasmu[a] juga mengatakannya—bahwa engkau dan orang-orang Yahudi bermaksud memberontak. Itulah sebabnya engkau membangun kembali tembok itu, dan menurut kabar ini engkau akan menjadi raja mereka.”
