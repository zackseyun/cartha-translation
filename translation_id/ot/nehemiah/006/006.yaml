  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: id
  text: Di dalamnya tertulis, “Di antara bangsa-bangsa sedang beredar kabar—dan Gasmu[a] juga mengatakannya—bahwa engkau dan orang-orang Yahudi bermaksud memberontak. Itulah sebabnya engkau membangun kembali tembok itu, dan menurut kabar ini engkau akan menjadi raja mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Gasmu”; tokoh ini lebih lazim disebut Gesyem atau Geshem dalam terjemahan lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: Di dalamnya tertulis
  rationale: Ungkapan partisip pasif ini memperkenalkan isi surat. Bentuk Indonesia ini alami dalam bingkai naratif dan tetap dekat dengan konstruksi Ibrani.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Kabar telah tersebar di antara bangsa-bangsa
  rationale: Bentuk Nifal dari שׁמע menunjukkan kabar yang didengar atau beredar. 'Telah tersebar' menyampaikan peredaran desas-desus secara alami, sedangkan 'bangsa-bangsa' mempertahankan cakupan etnis-politis גּוֹיִם.
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: dan Gasmu juga mengatakannya
  rationale: Nama ditransliterasikan langsung dari bentuk teks Ibrani גַשְׁמוּ. 'Juga' mencerminkan fungsi tambahan וְ, dan '-nya' memperjelas bahwa Gasmu menyatakan kabar yang sama.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: bermaksud memberontak
  rationale: חשב disertai infinitif menyatakan niat atau rencana. 'Bermaksud' alami dan tidak memperkuat tuduhan menjadi persekongkolan yang tidak dinyatakan secara eksplisit.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: 'Frasa ini menandai kesimpulan yang dituduhkan: pembangunan tembok dianggap sebagai akibat dari niat memberontak.'
- source_word: בּוֹנֶה הַחוֹמָה
  choice: membangun kembali tembok itu
  rationale: בנה pada dasarnya berarti membangun, tetapi konteks Nehemia adalah pemulihan tembok yang telah runtuh; 'membangun kembali' mengungkapkan makna kontekstual itu.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: engkau akan menjadi raja mereka
  rationale: הוה dengan לְ dapat menyatakan menjadi. Dalam tuduhan ini, bentuk tersebut menunjuk pada hasil atau tujuan yang diproyeksikan; 'akan menjadi' menjaga nuansa itu tanpa menyatakan bahwa Nehemia sudah menjadi raja.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Menurut kabar-kabar ini
  rationale: דברים secara leksikal dapat berarti perkataan atau hal-hal, tetapi di sini merujuk pada isi kabar yang baru disebut. 'Kabar-kabar' menjaga hubungan kontekstual dan ungkapan jamaknya.
theological_decisions:
- issue: Status tuduhan pemberontakan dan rencana menjadi raja
  choice: Disajikan sebagai isi kabar dalam surat, bukan sebagai fakta yang ditegaskan narator
  alternative: Menyusun kalimat seolah-olah Nehemia memang berniat memberontak dan menjadi raja
  rationale: Struktur ayat membingkai seluruh tuduhan sebagai sesuatu yang tertulis dan sedang beredar; terjemahan tidak boleh mengesahkannya sebagai fakta.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan tunggal dalam surat. Tanda pisah mengapit keterangan tambahan tentang Gasmu agar alur tuduhan tetap jelas.
