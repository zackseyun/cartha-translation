id: NEH.6.3
reference: Nehemiah 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: id
  text: Lalu aku mengirim utusan kepada mereka dengan pesan, “Aku sedang melakukan pekerjaan yang besar dan tidak dapat turun. Mengapa pekerjaan ini harus terhenti ketika aku meninggalkannya[a] dan turun menemui kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku melepaskannya.”
    reason: Alternatif yang lebih harfiah bagi אַרְפֶּהָ; dalam konteks ini maksudnya meninggalkan atau berhenti menangani pekerjaan itu.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Lalu aku mengirim
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi; “lalu” menyampaikan perkembangan itu secara alami dalam bahasa Indonesia.
- source_word: עֲלֵיהֶם
  choice: kepada mereka
  rationale: Dengan verba “mengirim” dan objek “utusan”, preposisi ini menyatakan arah kepada orang yang dituju, bukan tindakan melawan mereka.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks politik ini, kata tersebut menunjuk kepada pembawa pesan manusia, bukan makhluk surgawi.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Infinitif ini memperkenalkan isi pesan; ungkapan “dengan pesan” alami dalam bahasa Indonesia dan menghindari konstruksi kaku “dengan berkata”.
- source_word: מְלָאכָה גְדוֹלָה
  choice: pekerjaan yang besar
  rationale: Mempertahankan arti dasar “pekerjaan/tugas” dan penekanan pada kebesaran atau pentingnya proyek pembangunan kembali.
- source_word: אֲנִי עֹשֶׂה
  choice: Aku sedang melakukan
  rationale: Pronomina dan partisip menyatakan kegiatan yang sedang berlangsung.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: dan tidak dapat turun
  rationale: Menjaga gambaran spasial turun dari Yerusalem sekaligus menyatakan ketidakmampuan atau ketidaksediaan praktis Nehemia untuk pergi.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Mengapa pekerjaan ini harus terhenti
  rationale: שׁבת di sini berarti berhenti atau terhenti, bukan menjalankan Sabat; bentuk pertanyaan bersifat retoris.
- source_word: כַּאֲשֶׁר
  choice: ketika
  rationale: Konjungsi ini memperkenalkan keadaan saat pekerjaan akan terhenti; “ketika” mempertahankan hubungan temporal tanpa mempersempitnya secara berlebihan.
- source_word: אַרְפֶּהָ
  choice: aku meninggalkannya
  rationale: Bentuk kausatif רפה berarti melepaskan, membiarkan, atau meninggalkan; sufiks feminin merujuk kepada “pekerjaan”.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: dan turun menemui kalian
  rationale: Mempertahankan gerak turun dari Yerusalem; “menemui kalian” menyampaikan arah kepada para penerima pesan secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina “aku” dan “kalian” mempertahankan ujaran langsung serta pembedaan orang kedua jamak. Istilah “utusan” dipilih agar jelas bahwa yang dimaksud ialah pembawa pesan manusia.
