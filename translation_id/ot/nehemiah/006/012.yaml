  text: וָ/אַכִּ֕ירָ/ה וְ/הִנֵּ֥ה לֹֽא אֱלֹהִ֖ים שְׁלָח֑/וֹ כִּ֤י הַ/נְּבוּאָה֙ דִּבֶּ֣ר עָלַ֔/י וְ/טוֹבִיָּ֥ה וְ/סַנְבַלַּ֖ט שְׂכָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/012.yaml
  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: id
  text: Lalu aku menyadari bahwa ternyata bukan Allah yang mengutus dia; sebaliknya, ia telah menyampaikan nubuat itu melawan aku karena Tobia dan Sanbalat telah menyewanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: Lalu aku menyadari
  rationale: Bentuk ini menyatakan bahwa Nehemia sampai pada pengenalan atau kesadaran; 'menyadari' alami dalam bahasa Indonesia dan tidak menambahkan cara ia mengetahuinya.
- source_word: וְהִנֵּה
  choice: bahwa ternyata
  rationale: '''Ternyata'' menyampaikan unsur penemuan atau kesadaran mendadak dari הִנֵּה secara wajar dalam narasi Indonesia.'
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: Ia mengucapkan nubuat itu untuk menentang aku
  rationale: דִּבֶּר mengambil הַנְּבוּאָה sebagai objek internal, sedangkan עָלַי dalam konteks ini bermakna diarahkan melawan Nehemia; terjemahan mempertahankan sebutan 'nubuat' tanpa mengesahkannya sebagai nubuat ilahi.
- source_word: שְׂכָרוֹ
  choice: telah menyewa dia
  rationale: Makna langsung verba שׂכר adalah mempekerjakan dengan bayaran atau menyewa; bentuk jamak menunjuk Tobia dan Sanbalat sebagai pelaku.
theological_decisions:
- issue: Status ucapan Semaya sebagai nubuat
  choice: nubuat itu
  alternative: pesan kenabian itu / ia bernubuat
  rationale: Teks menyebut הַנְּבוּאָה tetapi sekaligus menegaskan bahwa Allah tidak mengutusnya. Terjemahan mempertahankan ketegangan itu dan tidak menyatakan bahwa pesannya benar-benar berasal dari Allah.
- issue: Hubungan sebab-akibat pada כִּי kedua
  choice: karena Tobia dan Sanbalat telah menyewa dia
  alternative: dan Tobia serta Sanbalat telah menyewa dia
  rationale: כִּי paling wajar menjelaskan alasan ia menyampaikan nubuat yang menentang Nehemia, sesuai struktur dan konteks ayat.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan pengenalan, penyangkalan pengutusan ilahi, isi tindakan, dan motif pembayaran.
