  naturalness: Bahasanya umumnya baku dan jelas. "Menyampaikan nubuat itu melawan aku" lebih idiomatis dan lebih dekat dengan struktur sumber daripada "mengucapkan nubuat itu untuk menentang aku." Penggunaan titik koma membantu memperlihatkan kontras dalam kalimat Ibrani.
  terminology: '"Allah," "nubuat," serta nama "Tobia" dan "Sanbalat" sesuai dan konsisten. "Menyewanya" menyampaikan שְׂכָרוּ dengan alami sebagai tindakan membayar/mengupah seseorang.'
