  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר צָֽלֲלוּ֩ שַׁעֲרֵ֨י יְרוּשָׁלִַ֜ם לִ/פְנֵ֣י הַ/שַּׁבָּ֗ת וָ/אֹֽמְרָ/ה֙ וַ/יִּסָּגְר֣וּ הַ/דְּלָת֔וֹת וָ/אֹ֣מְרָ֔/ה אֲשֶׁר֙ לֹ֣א יִפְתָּח֔וּ/ם עַ֖ד אַחַ֣ר הַ/שַּׁבָּ֑ת וּ/מִ/נְּעָרַ֗/י הֶֽעֱמַ֨דְתִּי֙ עַל הַ/שְּׁעָרִ֔ים לֹא יָב֥וֹא מַשָּׂ֖א בְּ/י֥וֹם הַ/שַּׁבָּֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/019.yaml
  text: When the gates of Jerusalem began to grow dark[a] before the Sabbath, I ordered the doors shut and commanded that they not be opened until after the Sabbath. I stationed some of my servants[b] at the gates so that no load[c] would be brought in on the Sabbath day.
translation:
  language: id
  text: Ketika gerbang-gerbang Yerusalem mulai gelap[a] menjelang hari Sabat, aku memerintahkan agar pintu-pintunya ditutup dan tidak dibuka sampai hari Sabat berlalu. Aku menempatkan beberapa orang pelayanku[b] di gerbang-gerbang itu supaya tidak ada muatan[c] yang dibawa masuk pada hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika bayang-bayang petang mulai menutupi gerbang-gerbang Yerusalem.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “beberapa orang pengiringku.” Istilah Ibrani ini dapat menunjuk anggota rombongan pribadi Nehemia.
    reason: lexical_alternative
  - marker: c
    text: Muatan itu mungkin mencakup barang-barang yang dibawa masuk untuk diperdagangkan, sebab konteks sekitarnya membahas perdagangan pada hari Sabat.
    reason: cultural_note
lexical_decisions:
- source_word: צָלֲלוּ
  choice: mulai menjadi gelap
  rationale: Kata kerja ini menggambarkan gerbang yang menjadi gelap atau tertutup bayang-bayang ketika petang tiba. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran teks serta penanda waktu menjelang Sabat.
- source_word: שַׁעֲרֵי יְרוּשָׁלִַם
  choice: gerbang-gerbang Yerusalem
  rationale: Bentuk jamak dan hubungan konstruksi diterjemahkan langsung dan wajar.
- source_word: לִפְנֵי הַשַּׁבָּת
  choice: menjelang hari Sabat
  rationale: Dalam konteks, frasa ini menunjuk waktu sesaat sebelum Sabat dimulai; 'menjelang' menyampaikan hubungan temporal itu secara alami.
- source_word: וָאֹמְרָה ... וָאֹמְרָה
  choice: aku memerintahkan agar ... dan ...
  rationale: Secara leksikal berarti 'aku berkata', tetapi dalam konteks tindakan gubernur, perkataan itu berfungsi sebagai perintah. Satu konstruksi perintah dalam bahasa Indonesia menghindari pengulangan yang kaku tanpa menghilangkan kedua isi perintah.
- source_word: וַיִּסָּגְרוּ הַדְּלָתוֹת
  choice: agar pintu-pintunya ditutup
  rationale: Bentuk pasif mempertahankan fokus pada daun-daun pintu gerbang dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: אֲשֶׁר לֹא יִפְתָּחוּם
  choice: dan tidak dibuka
  rationale: Bentuk ini menyampaikan larangan membuka pintu dengan jelas serta selaras dengan klausa pasif sebelumnya.
- source_word: עַד אַחַר הַשַּׁבָּת
  choice: sampai hari Sabat berlalu
  rationale: Ungkapan Indonesia ini jelas berarti bahwa pintu baru boleh dibuka setelah Sabat selesai.
- source_word: וּמִנְּעָרַי
  choice: beberapa orang pelayanku
  rationale: Dalam rombongan resmi Nehemia, נַעַר dapat menunjuk pelayan atau anggota pengiring, tidak harus orang yang masih muda. Unsur מִן menyatakan sebagian dari kelompok itu.
- source_word: הֶעֱמַדְתִּי
  choice: aku menempatkan
  rationale: Menunjukkan bahwa orang-orang tersebut ditempatkan untuk bertugas di lokasi tertentu.
- source_word: עַל הַשְּׁעָרִים
  choice: di gerbang-gerbang itu
  rationale: Preposisi עַל dalam konteks penugasan orang pada gerbang paling alami diterjemahkan 'di'; kata 'itu' mengacu kembali pada gerbang Yerusalem.
- source_word: לֹא יָבוֹא מַשָּׂא
  choice: supaya tidak ada muatan yang dibawa masuk
  rationale: Secara harfiah, 'agar tidak masuk suatu muatan'. Bentuk ini menjelaskan gerak melalui gerbang tanpa mempersempit מַשָּׂא menjadi hanya barang dagangan.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: pada hari Sabat
  rationale: Mempertahankan penyebutan eksplisit 'hari' dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan שַׁבָּת
  choice: hari Sabat
  alternative: hari perhentian
  rationale: Istilah ini menunjuk hari Sabat mingguan yang khusus dalam kehidupan perjanjian Israel, bukan sekadar hari istirahat biasa. Bentuk 'hari Sabat' sudah mapan dan dapat dipahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti orang pertama 'aku' sesuai dengan narasi memoar Nehemia. Istilah konkret 'muatan' dipertahankan agar konteks perdagangan tidak dimasukkan langsung sebagai satu-satunya tafsiran.
