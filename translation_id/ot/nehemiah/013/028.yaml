source:
  edition: WLC
  text: וּ/מִ/בְּנֵ֨י יוֹיָדָ֤ע בֶּן אֶלְיָשִׁיב֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל חָתָ֖ן לְ/סַנְבַלַּ֣ט הַ/חֹרֹנִ֑י וָ/אַבְרִיחֵ֖/הוּ מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/028.yaml
  text: And one of the sons of Joiada son of Eliashib the high priest was a son-in-law of Sanballat the Horonite[b][a], so I drove him away from me.
translation:
  language: id
  text: Salah seorang putra Yoyada, yang adalah anak Elyasib, imam besar, menjadi menantu Sanbalat, orang Horon.[a] Lalu aku mengusirnya[b] dari hadapanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih umum, “memiliki hubungan melalui perkawinan dengan Sanbalat.” Istilah Ibraninya dapat menunjuk pada hubungan melalui perkawinan; dalam konteks ini, “menantu” adalah pemahaman khusus yang paling wajar.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuatnya lari” atau “menghalaunya.” Kata kerja Ibraninya menekankan penyingkiran secara paksa, tetapi tidak menjelaskan bentuk administratif tindakan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: Salah seorang anak
  rationale: Bentuk dengan preposisi מִן menyatakan makna partitif, yaitu satu orang dari antara anak-anak Yoyada; ungkapan ini paling alami dalam bahasa Indonesia.
- source_word: יוֹיָדָע
  choice: Yoyada
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: anak Elyasib
  rationale: Konstruksi silsilah diterjemahkan secara langsung agar hubungan ayah-anak tetap jelas.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: imam besar itu
  rationale: Ini adalah padanan baku dan alami bagi gelar imam utama Israel; artikel definit menandai tokoh yang dimaksud.
- source_word: חָתָן לְסַנְבַלַּט
  choice: adalah menantu Sanbalat
  rationale: חָתָן menunjuk pada hubungan melalui perkawinan dan dalam konteks ini paling wajar dipahami sebagai menantu laki-laki, yang dalam bahasa Indonesia cukup disebut 'menantu'.
- source_word: הַחֹרֹנִי
  choice: orang Horon itu
  rationale: Sebutan asal atau kelompok ini diterjemahkan sebagai identitas berdasarkan tempat, selaras dengan ungkapan alami bahasa Indonesia.
- source_word: וָאַבְרִיחֵהוּ
  choice: Karena itu, aku mengusirnya
  rationale: Bentuk Hifil dari ברח menyatakan tindakan menyebabkan seseorang melarikan diri atau memaksanya pergi. 'Mengusir' mempertahankan unsur paksaan tanpa menetapkan bahwa ini merupakan pembuangan resmi secara hukum.
- source_word: מֵעָלָי
  choice: dari hadapanku
  rationale: Ungkapan harfiahnya berarti menjauh dari atas/dekat si pembicara dan secara idiomatis menunjuk pada penyingkiran dari hadirat atau lingkungan Nehemia.
