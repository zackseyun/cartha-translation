revisions:
- from: Salah seorang anak Yoyada anak Elyasib, imam besar itu, adalah menantu Sanbalat, orang Horon itu.[a] Karena itu, aku mengusirnya dari hadapanku.[b]
  to: Salah seorang putra Yoyada, yang adalah anak Elyasib, imam besar, menjadi menantu Sanbalat, orang Horon.[a] Lalu aku mengusirnya[b] dari hadapanku.
  rationale: Revisi mengganti penghubung kausal dengan penghubung naratif yang sesuai dengan waw Ibrani, memperjelas rujukan gelar imam besar kepada Elyasib, dan menempatkan penanda catatan kaki tepat pada unsur leksikal yang dibahas. Makna tindakan paksa dan ambiguitas terbatas dari istilah hubungan perkawinan tetap dipertahankan.
