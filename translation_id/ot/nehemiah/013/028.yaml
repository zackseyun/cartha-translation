    issue: Konjungsi 'Karena itu' menambahkan inferensi kausal.
    rationale: Teks Ibrani memakai waw naratif sebelum 'aku mengusirnya'; teks itu hanya melanjutkan peristiwa dan tidak secara eksplisit menyatakan 'oleh karena itu'.
  - severity: low
    issue: Pelekatan gelar 'imam besar' kurang jelas.
    rationale: Dalam 'Yoyada anak Elyasib, imam besar itu', pembaca Indonesia dapat mengaitkan 'imam besar' dengan Yoyada. Sumber menyebut Elyasib sebagai imam besar.
  - severity: low
    issue: Penanda catatan kaki a tidak langsung mengikuti istilah 'menantu' yang dijelaskannya.
    rationale: Memindahkannya ke sesudah 'menantu Sanbalat' membuat jangkar catatan lebih presisi dan menghindari kesan bahwa catatan itu menjelaskan 'orang Horon'.
