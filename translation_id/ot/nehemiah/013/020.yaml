  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: id
  text: Kemudian, para pedagang dan penjual segala macam barang bermalam di luar Yerusalem satu atau dua kali[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sekali dan dua kali”; maksudnya, “satu atau dua kali.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: bermalam
  rationale: Kata kerja לון berarti melewatkan malam atau menginap. “Bermalam” alami dan ringkas dalam bahasa Indonesia serta mempertahankan makna waktunya.
- source_word: הָרֹכְלִים
  choice: para pedagang
  rationale: רֹכֵל menunjuk kepada pedagang, termasuk pedagang keliling. “Para pedagang” paling wajar dalam konteks kegiatan jual beli di Yerusalem.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: dan penjual segala macam barang
  rationale: Ungkapan ini mencakup para penjual semua jenis barang dagangan. “Segala macam barang” menyampaikan cakupan luasnya dengan bahasa Indonesia modern dan alami.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: di luar Yerusalem
  rationale: מִחוּץ menyatakan lokasi di sebelah luar kota; “di luar Yerusalem” merupakan padanan langsung dan idiomatis.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: satu dua kali
  rationale: Secara harfiah ungkapan ini berbunyi “sekali dan dua kali,” tetapi berfungsi sebagai idiom untuk kejadian pada satu atau dua kesempatan. “Satu dua kali” alami dalam bahasa Indonesia dan tidak melebih-lebihkan frekuensinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bermalam” dipilih daripada “menginap” karena lebih ringkas dan sesuai dengan narasi formal. Penanda catatan kaki ditempatkan sesudah ungkapan yang dijelaskannya.
