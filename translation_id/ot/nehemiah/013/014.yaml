  text: זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י עַל זֹ֑את וְ/אַל תֶּ֣מַח חֲסָדַ֗/י אֲשֶׁ֥ר עָשִׂ֛יתִי בְּ/בֵ֥ית אֱלֹהַ֖/י וּ/בְ/מִשְׁמָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/014.yaml
  text: Remember me for this[a], my God[b], and do not wipe out my deeds of covenant faithfulness that I have done for the house of my God and for its services.
translation:
  language: id
  text: Ingatlah aku karena hal ini, ya Allahku, dan janganlah menghapus perbuatan-perbuatan setiaku[a] yang telah kulakukan bagi rumah Allahku dan bagi pemeliharaannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kebaikan-kebaikanku,” “perbuatan kasih setiaku,” atau “tindakan-tindakan kasih setiaku.” Kata Ibrani ini dapat berarti kebaikan, kesetiaan, atau kasih setia dalam hubungan perjanjian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “penjagaannya,” “tanggung jawab yang berkaitan dengannya,” atau “pelayanan-pelayanannya,” yaitu kewajiban yang berhubungan dengan rumah Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Ingatlah aku
  rationale: Ungkapan doa imperatif kepada Allah; לִי menandai orang yang diminta untuk diingat. Bentuk ini alami dan langsung dalam bahasa Indonesia.
- source_word: עַל זֹאת
  choice: karena hal ini
  rationale: עַל זֹאת menunjuk kepada tindakan yang baru saja diceritakan dan dalam konteks doa ini paling alami menyatakan alasan permohonan, tanpa menutup kemungkinan nuansa 'mengenai hal ini'.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Akhiran orang pertama tunggal dipertahankan, sedangkan 'ya' menandai sapaan langsung secara alami dan khidmat.
- source_word: וְאַל תֶּמַח
  choice: dan janganlah menghapus
  rationale: מחה berarti menghapus atau melenyapkan dari catatan/ingatan. 'Menghapus' mempertahankan metafora Ibrani dengan bahasa Indonesia yang wajar.
- source_word: חֲסָדַי
  choice: perbuatan kasih setiaku
  rationale: חסד dapat mencakup kebaikan, kesetiaan, dan loyalitas perjanjian. Dalam hubungan dengan אֲשֶׁר עָשִׂיתִי, bentuk ini menunjukkan tindakan-tindakan yang mewujudkan kasih setia tanpa meratakannya menjadi sekadar 'perbuatan baik'.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang telah kulakukan
  rationale: Klausa relatif ini menerangkan חֲסָדַי; bentuk 'telah' cocok untuk tindakan lampau yang kini dibawa ke hadapan Allah dalam doa.
- source_word: בְּבֵית אֱלֹהַי
  choice: bagi rumah Allahku
  rationale: Walaupun בְ secara dasar berarti 'di/dalam', konteks pelayanan dan pembaruan rumah Allah mendukung makna tindakan yang dilakukan demi atau bagi rumah Allah.
- source_word: וּבְמִשְׁמָרָיו
  choice: dan bagi tugas-tugas di dalamnya
  rationale: מִשְׁמָר menunjuk pada tanggung jawab, kewajiban, atau tugas yang harus dijalankan. Dalam konteks bait Allah, frasa ini mengacu pada tugas-tugas yang berkaitan dengan penyelenggaraannya.
theological_decisions:
- issue: Makna חֲסָדַי dalam doa orang pertama
  choice: perbuatan kasih setiaku
  alternative: kebaikan-kebaikanku; perbuatan setiaku; kasih setiaku
  rationale: Terjemahan mempertahankan bobot kesetiaan dan kasih dalam חסד serta kaitannya dengan tindakan nyata Nehemia, tanpa menyatakan secara lebih tegas daripada teks bahwa tindakan itu menghasilkan jasa keselamatan.
- issue: Nada permohonan agar tindakan Nehemia diingat Allah
  choice: Mempertahankan seruan langsung tanpa memperhalus unsur rujukan kepada diri sendiri
  alternative: Memparafrasakan doa agar terdengar kurang menonjolkan perbuatan Nehemia
  rationale: Teks Ibrani secara jelas meminta Allah mengingat Nehemia dan tidak menghapus tindakan kasih setianya. Ketegangan teologis itu dipertahankan, bukan diselesaikan melalui parafrasa.
- issue: Hubungan בְּ dengan rumah Allah dan tugas-tugasnya
  choice: bagi
  alternative: di; dalam; berkenaan dengan
  rationale: Pilihan 'bagi' menyampaikan bahwa tindakan itu dilakukan demi rumah Allah dan tanggung jawab yang terkait dengannya, sambil tetap dekat dengan konteks reformasi pelayanan bait.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang langsung dan khidmat. Bentuk terikat 'Allahku' dan 'kulakukan' dipakai secara alami. Istilah 'rumah Allah' dipertahankan sebagai sebutan tekstual bagi bait Allah, sedangkan 'tugas-tugas di dalamnya' dibuat jelas bagi pembaca umum tanpa membatasi מִשְׁמָר hanya pada satu jenis pelayanan.
