    rationale: Walaupun secara leksikal dapat dipertahankan, kolokasi ini kurang lazim dalam bahasa Indonesia modern. “Perbuatan-perbuatan setiaku” menyatakan bentuk jamak dan sifat tindakan tersebut secara lebih jelas; catatan kaki menjaga nuansa kasih setia/perjanjian.
