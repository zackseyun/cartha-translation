  naturalness: Bahasa doa “Ingatlah aku ... ya Allahku” serta bentuk “yang telah kulakukan” alami dan baku. “Perbuatan kasih setiaku” dapat dipahami, tetapi “perbuatan-perbuatan setiaku” lebih idiomatis dalam bahasa Indonesia modern sambil tetap mempertahankan hubungan antara חסד dan tindakan yang dilakukan.
