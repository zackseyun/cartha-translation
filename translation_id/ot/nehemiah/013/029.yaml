base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: id
  text: Ingatlah mereka, ya Allahku, karena mereka telah menajiskan keimaman dan perjanjian yang berkenaan dengan keimaman serta orang-orang Lewi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “Ingatlah mereka, ya Allahku, sehubungan dengan orang-orang yang menajiskan keimaman dan perjanjian keimaman serta orang-orang Lewi.”'
    reason: Alternatif leksikal dan sintaksis yang mempertahankan bentuk partisip substantival serta arti lebih langsung dari עַל. Susunan Ibrani pada frasa terakhir padat; hubungan tepat antara perjanjian, keimaman, dan orang-orang Lewi tidak diperinci.
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  choice: Ingatlah mereka
  rationale: Mempertahankan permohonan langsung khas doa Nehemia. Dalam konteks ini, tindakan mengingat bersifat menghakimi, tetapi nuansa negatif itu disampaikan oleh alasan yang menyusul, bukan ditambahkan ke dalam verba.
- source_word: אֱלֹהָי
  choice: ya Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal menyatakan sapaan pribadi 'Allahku'; partikel 'ya' membuat sapaan langsung itu alami dan khidmat dalam bahasa Indonesia.
- source_word: עַל
  choice: karena
  rationale: Di sini preposisi tersebut memperkenalkan dasar bagi permohonan, yakni pelanggaran mereka.
- source_word: גָּאֳלֵי
  choice: mereka telah menajiskan
  rationale: Partisip substantival dari akar גאל dalam arti 'menajiskan', bukan akar lain yang berarti 'menebus'. Klausa verbal lebih alami dalam bahasa Indonesia sambil mempertahankan sifat pelanggarannya.
- source_word: הַכְּהֻנָּה
  choice: keimaman
  rationale: Nomina abstrak ini menunjuk pada kedudukan atau lembaga imam, bukan hanya pada para imam sebagai orang.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: serta perjanjian keimaman dan orang-orang Lewi
  rationale: Susunan ini menjaga hubungan genitif dan koordinasi Ibrani tanpa menentukan secara berlebihan apakah perjanjian itu dibuat dengan para imam dan orang Lewi atau berkaitan dengan keduanya.
theological_decisions:
- issue: Apakah permohonan agar Allah mengingat mereka bersifat menguntungkan atau menghukum
  choice: Ingatan yang bersifat menghakimi berdasarkan penajisan mereka
  alternative: Permohonan netral agar Allah mengingat mereka
  rationale: Tuduhan yang langsung menyusul menunjukkan bahwa permohonan ini tidak mengharapkan perkenanan. Namun, terjemahan tetap memakai verba netral 'ingatlah' dan membiarkan klausa sebab menjelaskan arah negatifnya.
- issue: Cakupan frasa 'perjanjian keimaman dan orang-orang Lewi'
  choice: Mempertahankan koordinasi padat sebagaimana dalam bahasa Ibrani
  alternative: Menafsirkannya secara eksplisit sebagai 'perjanjian dengan para imam dan orang-orang Lewi' atau memisahkan orang Lewi sebagai objek penajisan tersendiri
  rationale: Sintaksis Ibrani memungkinkan hubungan yang padat dan tidak sepenuhnya eksplisit. Terjemahan utama tidak mengunci satu penafsiran yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Keimaman' dipilih untuk menunjuk lembaga atau kedudukan imam. Penanda catatan kaki [a] ditempatkan sesudah kalimat yang dijelaskannya.
