base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: id
  text: Lalu, haruskah kami mendengar bahwa kalian melakukan segala kejahatan besar ini—dengan berlaku tidak setia kepada Allah kita dan memperistri perempuan-perempuan asing[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat perempuan-perempuan asing tinggal”; dalam konteks ini maksudnya ialah mengambil mereka sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֶם הֲנִשְׁמַע
  choice: Jadi, haruskah kami mendengar bahwa kalian
  rationale: Bentuk Nifal הֲנִשְׁמַע secara harfiah bersifat pasif, ‘haruskah terdengar’, sedangkan וְלָכֶם dapat berarti ‘tentang kalian’. Ungkapan aktif impersonal ‘haruskah kami mendengar bahwa kalian’ menyampaikan konstruksi itu secara wajar dalam bahasa Indonesia sambil mempertahankan bentuk pertanyaan retoris. Kemungkinan bahwa frasa ini berarti ‘haruskah kami menuruti kalian’ dicatat dalam catatan kaki.
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: melakukan segala kejahatan besar ini
  rationale: ‘Melakukan’ menerjemahkan עשה secara langsung, ‘segala’ mempertahankan daya cakup כָּל, dan ‘kejahatan besar ini’ menyampaikan penilaian moral yang kuat dari frasa Ibrani tanpa mempersempit jenis pelanggarannya.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: berlaku tidak setia terhadap Allah kita
  rationale: מעל menunjuk pada pelanggaran kesetiaan atau pengkhianatan, sering kali dalam hubungan perjanjian. ‘Berlaku tidak setia’ mempertahankan bobot relasional dan teologisnya tanpa menjadikannya istilah ritual yang terlalu teknis.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: dengan memperistri perempuan-perempuan asing
  rationale: Secara harfiah bentuk Hifil לְהֹשִׁיב berarti ‘membuat tinggal/menetap’. Dalam konteks ini, membawa perempuan asing untuk tinggal dalam rumah tangga merujuk pada mengambil mereka sebagai istri. ‘Memperistri’ menyatakan maksud kontekstualnya secara alami, sedangkan arti harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Sifat pelanggaran dalam לִמְעֹל בֵּאלֹהֵינוּ
  choice: ketidaksetiaan terhadap Allah dalam hubungan perjanjian
  alternative: kesalahan umum atau pelanggaran ritual terhadap Allah
  rationale: Kata מעל secara khas mengandung gagasan mengkhianati kepercayaan atau melanggar kesetiaan. Terjemahan ‘berlaku tidak setia terhadap Allah kita’ mempertahankan bobot perjanjian itu tanpa membatasi pelanggaran tersebut hanya pada ranah ritual.
- issue: Makna pernikahan dengan נָשִׁים נָכְרִיּוֹת
  choice: memperistri perempuan-perempuan asing sebagai tindakan yang dikecam dalam konteks pasal ini
  alternative: kecaman universal berdasarkan etnisitas semata
  rationale: Ayat ini menghubungkan pernikahan tersebut dengan ketidaksetiaan kepada Allah dalam konteks komunitas pascapembuangan. Terjemahan tidak menambahkan alasan doktrinal atau etnis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. ‘Kalian’ mempertahankan sapaan orang kedua jamak; ‘Allah kita’ menjaga bahasa relasional sumber. Tanda pisah membantu memperjelas bahwa ketidaksetiaan berikutnya menjelaskan sifat kejahatan yang disebutkan.
