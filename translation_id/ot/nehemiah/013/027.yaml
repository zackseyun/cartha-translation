  source_fidelity: 'Pembacaan utama draf, “haruskah kami mendengar bahwa kalian melakukan,” merupakan pembacaan yang kuat bagi וְלָכֶם הֲנִשְׁמַע dalam konteks teguran ini: apakah perbuatan demikian harus terdengar tentang mereka. Namun, catatan kaki perlu menyatakan alternatif itu tanpa mengubah relasi sintaksis pembacaan utama. Seluruh unsur selebihnya—“segala kejahatan besar ini,” ketidaksetiaan kepada Allah, dan tindakan mengambil perempuan asing sebagai istri—tersampaikan dengan setia.'
  naturalness: Bahasa draf umumnya baku dan jelas. “Berlaku tidak setia kepada Allah kita” lebih idiomatis daripada “berlaku tidak setia terhadap Allah kita.” Mengganti tanda pisah dengan konstruksi “dengan ... dan ...” membuat hubungan kedua infinitif Ibrani lebih lancar dan eksplisit dalam bahasa Indonesia.
  terminology: “Allah kita” tepat untuk אֱלֹהֵינוּ. “Berlaku tidak setia” mempertahankan nuansa מעל sebagai pelanggaran kesetiaan tanpa memaksakan istilah teknis. “Memperistri perempuan-perempuan asing” menyampaikan makna kontekstual לְהוֹשִׁיב נָשִׁים נָכְרִיּוֹת; arti literalnya tetap dicatat.
