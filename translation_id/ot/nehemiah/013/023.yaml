id: NEH.13.23
reference: Nehemiah 13:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֣ם בַּ/יָּמִ֣ים הָ/הֵ֗ם רָאִ֤יתִי אֶת הַ/יְּהוּדִים֙ הֹשִׁ֗יבוּ נָשִׁים֙ אשדודיות עמוניות מוֹאֲבִיּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/023.yaml
  text: Also in those days I saw the Jews who had married women of Ashdod[a], Ammonite women[b], and Moabite women.
translation:
  language: id
  text: Pada masa itu juga, aku melihat orang-orang Yahudi[a] yang telah memperistri perempuan-perempuan[b] dari Asdod, Amon, dan Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang-orang Yudea".
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "telah membuat perempuan-perempuan tinggal"; dalam konteks ini ungkapan Ibrani tersebut berarti mengambil mereka sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּיָּמִים הָהֵם
  choice: Pada masa itu juga
  rationale: Ungkapan ini menambahkan satu pengamatan lagi pada laporan reformasi Nehemia. Susunan ini alami dalam bahasa Indonesia dan mempertahankan daya aditif גַּם serta penunjuk waktu בַּיָּמִים הָהֵם.
- source_word: רָאִיתִי
  choice: aku melihat
  rationale: Mempertahankan arti biasa verba 'melihat' dan nada kesaksian langsung Nehemia.
- source_word: אֶת הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Dalam konteks Ezra–Nehemia, istilah ini secara alami menunjuk komunitas Yahudi pascapembuangan; alternatif yang lebih geografis, 'orang-orang Yudea', tetap dicatat dalam catatan kaki.
- source_word: הֹשִׁיבוּ נָשִׁים
  choice: telah memperistri perempuan-perempuan
  rationale: Bentuk Hifil dari ישׁב secara harfiah berkaitan dengan membuat atau membiarkan tinggal, tetapi bersama נָשִׁים dalam konteks ini merupakan ungkapan tentang mengambil perempuan sebagai istri. 'Memperistri' menyampaikan maksudnya dengan jelas, sedangkan 'perempuan-perempuan' mempertahankan nomina sumber.
- source_word: אשדודיות עמוניות מוֹאֲבִיּוֹת
  choice: dari Asdod, Amon, dan Moab
  rationale: Ketiga bentuk tersebut adalah sebutan feminin jamak berdasarkan asal bangsa atau wilayah. Dalam bahasa Indonesia, rangkaian 'perempuan-perempuan dari ...' lebih alami daripada membentuk adjektiva etnik yang kaku.
theological_decisions:
- issue: Cakupan etnografis הַיְּהוּדִים
  choice: orang-orang Yahudi
  alternative: orang-orang Yudea
  rationale: Pilihan utama paling alami untuk komunitas etnis-keagamaan pascapembuangan, tanpa meniadakan kemungkinan nuansa geografis yang dicatat dalam catatan kaki.
- issue: Daya idiomatis הֹשִׁיבוּ נָשִׁים
  choice: telah memperistri perempuan-perempuan
  alternative: telah membuat perempuan-perempuan tinggal / telah mengambil istri
  rationale: Konteks membicarakan perkawinan dengan perempuan dari bangsa-bangsa sekitar. Terjemahan idiomatis menyatakan tindakan itu dengan jelas tanpa menambahkan penilaian teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina 'aku' mempertahankan tuturan orang pertama Nehemia; 'memperistri' jelas dan wajar untuk konteks perkawinan. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
