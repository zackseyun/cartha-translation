id: NEH.13.16
reference: Nehemiah 13:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/צֹּרִים֙ יָ֣שְׁבוּ בָ֔/הּ מְבִיאִ֥ים דָּ֖אג וְ/כָל מֶ֑כֶר וּ/מֹכְרִ֧ים בַּ/שַּׁבָּ֛ת לִ/בְנֵ֥י יְהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: id
  text: Orang-orang Tirus juga tinggal di kota itu. Mereka membawa masuk ikan dan segala macam barang dagangan, lalu menjualnya pada hari Sabat kepada orang-orang Yehuda[a], bahkan di Yerusalem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada anak-anak Yehuda.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan di Yerusalem.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: Orang-orang Tirus juga
  rationale: Menunjuk kepada penduduk atau orang yang berasal dari Tirus. Kata "juga" menyampaikan fungsi kata sambung sebagai kelanjutan daftar pelanggaran hari Sabat dalam konteks.
- source_word: יָשְׁבוּ בָהּ
  choice: tinggal di kota itu
  rationale: Kata kerja יָשְׁבוּ berarti tinggal atau berdiam. Akhiran feminin בָהּ merujuk kepada Yerusalem; "di kota itu" menyatakan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: מְבִיאִים
  choice: membawa masuk
  rationale: Bentuk partisip Hifil dari בוא menggambarkan kegiatan membawa barang masuk ke kota.
- source_word: דָּאג
  choice: ikan
  rationale: Nomina ini berarti ikan dan cocok secara langsung dalam konteks perdagangan.
- source_word: וְכָל מֶכֶר
  choice: dan segala macam barang dagangan
  rationale: מֶכֶר menunjuk kepada barang yang dijual. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan keluasan כָל tanpa menyiratkan bahwa setiap benda secara harfiah dibawa.
- source_word: וּמֹכְרִים
  choice: lalu menjualnya
  rationale: Partisip ini melanjutkan gambaran kegiatan yang berlangsung. Akhiran "-nya" secara alami merujuk kepada ikan dan barang dagangan.
- source_word: בַּשַּׁבָּת
  choice: pada hari Sabat
  rationale: Bentuk definit dalam bahasa Ibrani disampaikan dengan ungkapan Indonesia yang lazim untuk hari Sabat.
- source_word: לִבְנֵי יְהוּדָה
  choice: kepada orang-orang Yehuda
  rationale: Secara harfiah berarti "kepada anak-anak Yehuda", tetapi dalam konteks ini merupakan ungkapan kolektif bagi orang Yehuda. Terjemahan utama memakai bentuk Indonesia yang alami, sedangkan bentuk harfiah dicatat dalam catatan kaki.
- source_word: וּבִירוּשָׁלִָם
  choice: bahkan di Yerusalem
  rationale: Kata sambung ו dapat bersifat penegas dalam konteks ini. "Bahkan" menghasilkan hubungan yang alami dan menonjolkan bahwa perdagangan itu terjadi di Yerusalem sendiri; kemungkinan koordinatif tetap dicatat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar jelas bagi pembaca umum, tanpa menghilangkan kegiatan yang berkesinambungan. Istilah “hari Sabat” dipertahankan sebagai sebutan yang lazim.
