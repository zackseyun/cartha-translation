  source_fidelity: 'Teks dengan setia mencakup semua unsur Ibrani: orang Tirus yang tinggal di Yerusalem, membawa ikan dan segala jenis barang dagangan, serta menjualnya pada hari Sabat kepada orang Yehuda. Rujukan pronominal pada "di kota itu" jelas mengarah kepada Yerusalem. "Bahkan di Yerusalem" merupakan pemahaman penegas yang mungkin untuk waw konseku­tif/koordinatif terakhir, tanpa meniadakan kemungkinan koordinatif karena telah dicatat dalam catatan kaki.'
