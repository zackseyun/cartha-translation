source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: id
  text: karena mereka tidak menyambut orang Israel dengan roti dan air, dan ia menyewa Bileam untuk melawan Israel dan mengutuknya[a]. Namun, Allah kita mengubah kutuk itu menjadi berkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai bentuk tunggal, “mengutuknya,” dengan Israel dipandang sebagai satu kesatuan.
    reason: Menjelaskan bentuk objek tunggal kolektif dalam teks sumber.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: menyambut
  rationale: Dalam konteks ini, קדמ berarti keluar menemui atau menerima pihak yang datang. “Menyambut ... dengan roti dan air” alami dalam bahasa Indonesia dan tetap menunjukkan tindakan konkret, bukan sekadar menyediakan bekal.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti “anak-anak Israel,” tetapi dalam pemakaian ini menunjuk kepada bangsa atau orang Israel. “Orang Israel” merupakan padanan Indonesia yang alami dan tidak membatasi kelompok itu hanya pada laki-laki.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: dengan roti dan air
  rationale: Terjemahan ini mempertahankan kedua bekal pokok yang disebut secara khusus dalam teks Ibrani dan kaitannya dengan Ulangan 23:4.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת־בִּלְעָם
  choice: malah menyewa Bileam untuk melawan Israel
  rationale: Verba Ibrani berbentuk tunggal dan secara historis dapat merujuk kepada Balak, tetapi subjeknya tidak dinyatakan dalam ayat ini. Bahasa Indonesia memungkinkan subjek tersirat; “malah” menandai kontras dengan penyambutan yang seharusnya, sedangkan nama “Israel” menjernihkan acuan sufiks kolektif.
- source_word: לְקַלְלוֹ
  choice: dan mengutuknya
  rationale: Sufiks Ibrani benar-benar tunggal dan memperlakukan Israel sebagai satu kesatuan kolektif. Bentuk “-nya” mempertahankan ciri itu secara alami karena antesedennya dinyatakan sebagai “Israel.”
- source_word: וַיַּהֲפֹךְ
  choice: mengubah
  rationale: Dalam konstruksi perubahan dari kutuk menjadi berkat, “mengubah” merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Sufiks posesif orang pertama jamak dipertahankan dengan “kita,” yang mencakup penutur dan komunitas yang disapanya.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: kutuk itu menjadi berkat
  rationale: Ungkapan ini menyampaikan perubahan keadaan secara idiomatis. “Itu” menunjuk kembali kepada kutuk yang baru disebut melalui verba “mengutuk.”
theological_decisions:
- issue: Sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; bangsa Israel
  rationale: Walaupun bentuk Ibrani secara harfiah adalah “anak-anak Israel,” dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi umat Israel. Padanan idiomatis menghindari kesan keliru bahwa hanya anak biologis atau laki-laki yang dimaksud.
- issue: Subjek tunggal pada tindakan menyewa Bileam
  choice: 'subjek dibiarkan tersirat: “malah menyewa Bileam”'
  alternative: ia menyewa Bileam; mereka menyewa Bileam
  rationale: Bentuk verba Ibrani tunggal dapat mengacu kepada Balak dalam peristiwa yang diringkas, tetapi ayat ini tidak menyebut namanya. Membiarkan subjek tersirat mempertahankan ketegangan gramatikal tanpa mengubahnya menjadi subjek jamak.
- issue: Israel sebagai kesatuan kolektif dalam לְקַלְלוֹ
  choice: mengutuknya
  alternative: mengutuk mereka
  rationale: Sufiks objek Ibrani berbentuk tunggal. Karena “Israel” dapat diperlakukan sebagai satu kesatuan dalam bahasa Indonesia, “-nya” mempertahankan bentuk sumber tanpa mengaburkan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menyambut ... dengan roti dan air” dipilih agar konkret sekaligus alami; “malah” memperjelas pertentangan wacana tanpa menambahkan pelaku. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
