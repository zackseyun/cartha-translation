id: NEH.13.6
reference: Nehemiah 13:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/כָל זֶ֕ה לֹ֥א הָיִ֖יתִי בִּֽ/ירוּשָׁלִָ֑ם כִּ֡י בִּ/שְׁנַת֩ שְׁלֹשִׁ֨ים וּ/שְׁתַּ֜יִם לְ/אַרְתַּחְשַׁ֤סְתְּא מֶֽלֶךְ בָּבֶל֙ בָּ֣אתִי אֶל הַ/מֶּ֔לֶךְ וּ/לְ/קֵ֥ץ יָמִ֖ים נִשְׁאַ֥לְתִּי מִן הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/006.yaml
  text: But during all this I was not in Jerusalem[a], for in the thirty-second year of Artaxerxes king of Babylon I went to the king[b], and after some time I asked leave from the king.
translation:
  language: id
  text: Namun, selama semua itu aku tidak berada di Yerusalem, sebab pada tahun ketiga puluh dua pemerintahan Artahsasta, raja Babel[a], aku pergi menghadap raja. Setelah beberapa waktu[b], aku meminta izin kepada raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “raja Babel.” Sebutan ini diterjemahkan sebagaimana tertulis dan tidak diselaraskan dengan latar Kekaisaran Persia yang lebih luas.
    reason: Menjelaskan ketegangan historis dalam sebutan teks sumber tanpa mengubah teks utama.
  - marker: b
    text: Atau “pada akhir sejumlah hari” atau “setelah suatu jangka waktu.”
    reason: Menunjukkan bentuk ungkapan Ibrani dan alternatif terjemahannya.
lexical_decisions:
- source_word: וּבְכָל זֶה
  choice: Namun, selama semua itu
  rationale: Frasa ini menghubungkan ayat dengan peristiwa sebelumnya sekaligus menunjukkan bahwa Nehemia tidak hadir sepanjang masa tersebut. “Namun” menampilkan kontras, sedangkan “selama semua itu” mempertahankan nuansa waktunya.
- source_word: לֹא הָיִיתִי בִּירוּשָׁלִָם
  choice: aku tidak berada di Yerusalem
  rationale: Terjemahan langsung dan wajar untuk pernyataan tentang ketidakhadiran Nehemia pada masa lampau.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Nehemia tidak berada di Yerusalem.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא
  choice: pada tahun ketiga puluh dua pemerintahan Artahsasta
  rationale: Ungkapan tahun pemerintahan dibuat alami dalam bahasa Indonesia; kata “pemerintahan” tersirat dalam konstruksi penanggalan berdasarkan masa kekuasaan raja.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Mempertahankan sebutan yang benar-benar terdapat dalam teks Ibrani tanpa menyelaraskannya dengan latar Kekaisaran Persia.
- source_word: בָּאתִי אֶל הַמֶּלֶךְ
  choice: aku pergi menghadap raja
  rationale: בוא dapat berarti datang atau pergi menurut sudut pandang. Dalam narasi ini, “pergi menghadap” alami dan menyatakan bahwa Nehemia mendatangi raja.
- source_word: וּלְקֵץ יָמִים
  choice: setelah beberapa waktu
  rationale: Ungkapan harfiahnya, “pada akhir hari-hari,” berfungsi sebagai keterangan jangka waktu yang tidak ditentukan; terjemahan ini menyampaikan maknanya secara alami.
- source_word: נִשְׁאַלְתִּי מִן הַמֶּלֶךְ
  choice: aku meminta izin kepada raja
  rationale: Dalam konteks ini bentuk Nifal dari שאל menyatakan permintaan izin atau cuti. Terjemahan ini tidak memastikan bahwa izin tersebut langsung diberikan.
theological_decisions:
- issue: Gelar Artahsasta sebagai “raja Babel” dalam teks Ibrani
  choice: Mempertahankan “raja Babel”
  alternative: Mengganti atau menyelaraskannya menjadi “raja Persia”
  rationale: Teks sumber secara eksplisit berbunyi “raja Babel.” Terjemahan tidak menghapus ketegangan historis itu melalui harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku” mempertahankan tuturan orang pertama Nehemia. Susunan kalimat dibuat alami tanpa menghilangkan ketidakpastian waktu atau menyelaraskan gelar raja secara historis.
