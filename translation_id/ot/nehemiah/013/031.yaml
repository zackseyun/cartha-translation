base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: id
  text: Juga untuk persembahan kayu pada waktu-waktu yang telah ditetapkan[a], dan untuk hasil pertama. Ingatlah aku, ya Allahku, untuk kebaikanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan kayu itu.” Ungkapan Ibrani ini merujuk pada penyediaan kayu yang dijadwalkan untuk keperluan Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: persembahan kayu
  rationale: Ungkapan ini menunjuk pada kayu yang dipersembahkan atau disediakan secara terjadwal untuk keperluan ibadah di Bait Allah. 'Persembahan kayu' ringkas, alami, dan mempertahankan bingkai kultisnya.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: pada waktu-waktu yang telah ditetapkan
  rationale: Frasa ini menyatakan waktu-waktu tertentu yang sudah dijadwalkan atau ditentukan secara resmi.
- source_word: בִּכּוּרִים
  choice: hasil pertama
  rationale: Istilah ini menunjuk pada hasil awal panen yang diberikan kepada Allah. 'Hasil pertama' jelas bagi pembaca modern dan tidak membatasi acuannya hanya pada buah-buahan.
- source_word: זָכְרָה לִּי
  choice: Ingatlah aku
  rationale: Ini mempertahankan secara langsung rumusan doa Nehemia yang memohon agar Allah mengingat dirinya.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Bentuk sapaan dengan partikel 'ya' terdengar alami dan khidmat dalam bahasa Indonesia sambil mempertahankan hubungan pribadi yang dinyatakan bentuk posesif Ibrani.
- source_word: לְטוֹבָה
  choice: demi kebaikan
  rationale: Pilihan ini mempertahankan singkatnya ungkapan Ibrani dan tidak memastikan apakah yang dimaksud ialah perkenanan, berkat, atau hasil yang baik.
theological_decisions:
- issue: Makna kultis קֻרְבַּן הָעֵצִים
  choice: persembahan kayu
  alternative: penyediaan kayu
  rationale: Konteksnya adalah penyediaan kayu bagi ibadah di Bait Allah, tetapi kata קֻרְבַּן sendiri berarti sesuatu yang dipersembahkan. Karena itu, terjemahan mempertahankan unsur persembahan tanpa menjabarkan fungsi kayu di dalam teks utama.
- issue: Permohonan penutup לְטוֹבָה
  choice: demi kebaikan
  alternative: dengan kemurahan; untuk kebaikanku
  rationale: Teks Ibrani tidak merinci apakah Nehemia meminta agar diingat dengan perkenanan atau agar menerima manfaat. Terjemahan menjaga keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berupa fragmen lanjutan dipertahankan melalui kata 'Juga', sesuai hubungan ayat ini dengan tindakan-tindakan yang disebut sebelumnya. Tanda pisah bahasa Inggris tidak ditiru karena dua klausa pendek lebih alami dipisahkan dengan titik dalam bahasa Indonesia.
