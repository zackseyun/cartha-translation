    rationale: Partisipium ini secara harfiah menyebut mereka yang melakukan ‘pekerjaan’ tersebut. “Tugas” dapat diterima secara makna, tetapi “pekerjaan” lebih dekat pada sumber tanpa menjadi tidak alami.
