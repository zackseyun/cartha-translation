translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Orang-orang Lewi” dipakai sebagai sebutan kelompok yang mudah dipahami; “para penyanyi” dibiarkan tanpa tambahan penjelas karena konteks menentukan fungsi mereka.
