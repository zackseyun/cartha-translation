base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/010.yaml
  text: And I learned that the portions of the Levites had not been given[b][a], so the Levites and the singers who did the work had each fled to his field.
translation:
  language: id
  text: Aku mengetahui bahwa bagian yang menjadi hak orang-orang Lewi[a] tidak diberikan; lalu orang-orang Lewi dan para penyanyi yang melakukan pekerjaan itu masing-masing melarikan diri ke ladangnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jatah yang ditetapkan bagi orang-orang Lewi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “masing-masing ke ladangnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵדְעָה
  choice: Lalu aku mengetahui
  rationale: Dalam rangkaian narasi ini, ידע menyatakan bahwa Nehemia mengetahui atau mendapati keadaan tersebut; “mengetahui” mempertahankan makna dasar tanpa menjadikannya sekadar pengetahuan statis.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi dari apa yang diketahui Nehemia.
- source_word: מְנָיוֹת הַלְוִיִּם
  choice: bagian yang menjadi hak orang-orang Lewi
  rationale: מְנָיוֹת menunjuk pada bagian atau jatah sokongan yang diperuntukkan bagi orang Lewi. Ungkapan ini alami dalam bahasa Indonesia sekaligus menjelaskan relasi konstruksi Ibraninya tanpa menambahkan rincian yang tidak disebutkan.
- source_word: לֹא נִתָּנָה
  choice: tidak diberikan
  rationale: Bentuk pasif נתן dipertahankan. Bentuk verba Ibrani tunggal mungkin memandang seluruh jatah itu secara kolektif, sehingga “bagian” dalam bentuk tunggal kolektif cocok dalam bahasa Indonesia.
- source_word: וַיִּבְרְחוּ
  choice: melarikan diri
  rationale: ברח secara langsung berarti melarikan diri. Pilihan ini mempertahankan kuatnya tindakan tersebut dan tidak melemahkannya menjadi sekadar “pulang”.
- source_word: אִישׁ לְשָׂדֵהוּ
  choice: masing-masing ... ke ladangnya
  rationale: Ungkapan harfiah “seorang ke ladangnya” memiliki daya distributif; “masing-masing” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: וְהַמְשֹׁרְרִים
  choice: dan para penyanyi
  rationale: Terjemahan langsung yang memadai dalam konteks pelayanan Bait Allah tanpa menambahkan kata “Bait Allah” yang tidak eksplisit di sini.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: yang menjalankan tugas itu
  rationale: Frasa partisipial ini menerangkan orang-orang Lewi dan para penyanyi. “Menjalankan tugas” menyampaikan pekerjaan atau pelayanan yang sedang menjadi tanggung jawab mereka tanpa mempersempit jenisnya.
