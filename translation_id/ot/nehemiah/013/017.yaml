base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/017.yaml
  text: So I contended with the nobles of Judah and said to them[a], “What is this evil thing that you are doing, profaning the Sabbath day?”
translation:
  language: id
  text: Lalu aku menegur para bangsawan Yehuda dan berkata kepada mereka, “Perbuatan jahat apakah yang kalian lakukan ini, yakni mencemarkan[a] hari Sabat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menajiskan” atau “melanggar”. Kata kerja Ibrani ini mengandung arti memperlakukan sesuatu yang kudus sebagai sesuatu yang biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Lalu aku menegur
  rationale: Kata ריב di sini menggambarkan tindakan berhadapan secara tegas, berbantah, atau menyampaikan teguran. “Menegur” terdengar alami dalam bahasa Indonesia dan sesuai dengan kecaman langsung yang menyusul, sedangkan “lalu” mencerminkan kelanjutan narasi.
- source_word: חֹרֵי יְהוּדָה
  choice: para bangsawan Yehuda
  rationale: חֹרִים menunjuk kepada golongan terkemuka atau bangsawan. “Para bangsawan” mempertahankan kedudukan sosial mereka tanpa menyempitkannya menjadi jabatan pemerintahan tertentu.
- source_word: וָאֹמְרָה לָהֶם
  choice: dan berkata kepada mereka
  rationale: Terjemahan langsung dan wajar bagi kelanjutan tindakan Nehemia.
- source_word: מָה הַדָּבָר הָרָע הַזֶּה
  choice: Perbuatan jahat apa ... ini
  rationale: Dalam konteks ini דָּבָר adalah tindakan atau perkara, sedangkan רָע menyatakan penilaian moral. Susunan ini menghasilkan pertanyaan yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר אַתֶּם עֹשִׂים
  choice: yang kalian lakukan
  rationale: Bentuk partisip Ibrani menggambarkan tindakan yang sedang berlangsung. “Kalian” cocok untuk sapaan langsung kepada sekelompok orang.
- source_word: וּמְחַלְּלִים
  choice: dengan menajiskan
  rationale: חלל dalam bentuk ini berarti memperlakukan sesuatu yang kudus sebagai biasa atau tidak kudus. “Menajiskan” mempertahankan bobot kekudusan yang dilanggar; “dengan” mengungkapkan bahwa penajisan Sabat merupakan isi perbuatan jahat tersebut.
- source_word: אֶת יוֹם הַשַּׁבָּת
  choice: hari Sabat
  rationale: Padanan Indonesia yang lazim dan tetap menerjemahkan baik יוֹם maupun שַׁבָּת.
theological_decisions:
- issue: Bahasa tentang pelanggaran terhadap Sabat
  choice: menajiskan hari Sabat
  alternative: melanggar hari Sabat; mencemarkan hari Sabat
  rationale: Kata kerja Ibrani menekankan tindakan memperlakukan sesuatu yang kudus sebagai sesuatu yang biasa. “Menajiskan” mempertahankan bobot teologis kekudusan Sabat dan tidak mereduksinya menjadi pelanggaran aturan semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Para bangsawan” mempertahankan nuansa kedudukan sosial; “kalian” membuat teguran langsung terdengar alami bagi pembaca masa kini.
