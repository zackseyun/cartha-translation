  text: וָ/אָעִ֣ידָ/ה בָ/הֶ֗ם וָ/אֹמְרָ֤/ה אֲלֵי/הֶם֙ מַדּ֜וּעַ אַתֶּ֤ם לֵנִים֙ נֶ֣גֶד הַ/חוֹמָ֔ה אִם תִּשְׁנ֕וּ יָ֖ד אֶשְׁלַ֣ח בָּ/כֶ֑ם מִן הָ/עֵ֣ת הַ/הִ֔יא לֹא בָ֖אוּ בַּ/שַּׁבָּֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: id
  text: Lalu aku memperingatkan mereka dan berkata kepada mereka, “Mengapa kalian bermalam di depan tembok? Jika kalian melakukannya lagi, aku akan bertindak keras terhadap kalian.[a]” Sejak saat itu, mereka tidak datang lagi pada hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku akan mengulurkan tangan terhadap kalian.” Ungkapan Ibrani ini berarti mengambil tindakan atau menggunakan kekuatan terhadap mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָעִידָה
  choice: aku memperingatkan
  rationale: Bentuk Hifil dari עוד di sini menyatakan peringatan atau teguran sungguh-sungguh terhadap perilaku para pedagang.
- source_word: וָאֹמְרָה אֲלֵיהֶם
  choice: dan berkata kepada mereka
  rationale: Mencerminkan urutan naratif Ibrani secara alami dalam bahasa Indonesia; subjek tetap jelas dari verba sebelumnya.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami bagi kata tanya yang meminta alasan.
- source_word: לֵנִים
  choice: kalian bermalam
  rationale: Verba לון/לין berarti menginap atau melewatkan malam; 'bermalam' ringkas dan wajar.
- source_word: נֶגֶד הַחוֹמָה
  choice: di depan tembok
  rationale: נֶגֶד menunjukkan posisi di hadapan atau berseberangan dengan sesuatu. 'Di depan tembok' mempertahankan lokasi yang disebut tanpa menambahkan tafsiran 'di luar'.
- source_word: אִם תִּשְׁנוּ
  choice: Jika kalian melakukannya lagi
  rationale: שנה berarti mengulangi atau melakukan lagi; objek tersirat dipulihkan secara alami dengan '-nya'.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: aku akan bertindak keras terhadap kalian
  rationale: Ungkapan harfiah 'mengulurkan/mengirim tangan terhadap kalian' merupakan ancaman tindakan langsung atau penggunaan kekuatan. Pilihan ini menyampaikan daya ancam tanpa menentukan bentuk hukuman secara berlebihan.
- source_word: מִן הָעֵת הַהִיא
  choice: Sejak saat itu
  rationale: Ungkapan waktu ini menandai akibat yang berlanjut dari peringatan Nehemia.
- source_word: לֹא בָאוּ
  choice: mereka tidak datang lagi
  rationale: Negasi dalam konteks 'sejak saat itu' menunjukkan bahwa kedatangan tersebut berhenti; 'lagi' membuat hasil berkelanjutan itu alami dalam bahasa Indonesia.
- source_word: בַּשַּׁבָּת
  choice: pada hari Sabat
  rationale: Padanan baku dan mudah dipahami untuk שַׁבָּת.
