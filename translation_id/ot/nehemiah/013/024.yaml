  text: וּ/בְנֵי/הֶ֗ם חֲצִי֙ מְדַבֵּ֣ר אַשְׁדּוֹדִ֔ית וְ/אֵינָ֥/ם מַכִּירִ֖ים לְ/דַבֵּ֣ר יְהוּדִ֑ית וְ/כִ/לְשׁ֖וֹן עַ֥ם וָ/עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/024.yaml
  text: And half of their children spoke Ashdodite[a], and they were not able to speak Judean, but only the language of one people or another.
translation:
  language: id
  text: Separuh anak-anak mereka berbicara bahasa Asdod[a]; mereka tidak mampu berbicara bahasa Yehuda, melainkan berbicara menurut bahasa tiap-tiap bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan mereka tidak tahu berbicara bahasa Yehuda, melainkan berbicara menurut bahasa tiap-tiap bangsa.”
    reason: Alternatif idiomatis untuk ketidakmampuan atau kurangnya kecakapan praktis berbicara; frasa penutup diterjemahkan lebih dekat dengan bentuk distributif Ibrani.
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: anak-anak mereka
  rationale: בנים dalam konteks keluarga-keluarga campuran menunjuk kepada keturunan mereka secara umum, bukan hanya anak laki-laki.
- source_word: חֲצִי
  choice: separuh dari
  rationale: Menunjukkan bahwa hanya sebagian, yakni separuh, dari anak-anak itu yang sedang dibicarakan.
- source_word: מְדַבֵּר
  choice: berbicara
  rationale: Bentuk partisip menggambarkan kebiasaan atau kemampuan berbahasa; bentuk kini naratif ini wajar dalam bahasa Indonesia.
- source_word: אַשְׁדּוֹדִית
  choice: dalam bahasa Asdod
  rationale: Bentuk gentilik feminin ini menunjuk kepada bahasa yang terkait dengan Asdod; ungkapan deskriptif lebih jelas dan alami daripada membentuk adjektiva baru.
- source_word: וְאֵינָם מַכִּירִים
  choice: dan tidak mampu
  rationale: Dalam konstruksi dengan infinitif, מכיר menunjukkan pengetahuan praktis atau kemampuan melakukan sesuatu, bukan sekadar mengenali.
- source_word: לְדַבֵּר יְהוּדִית
  choice: berbicara dalam bahasa Yehuda
  rationale: יְהוּדִית menunjuk kepada bahasa orang Yehuda; pilihan ini tidak secara anakronistis menentukan bahwa yang dimaksud pasti bahasa Ibrani.
- source_word: וְכִלְשׁוֹן עַם וָעָם
  choice: melainkan dalam bahasa bangsa yang satu atau bangsa yang lain
  rationale: Ungkapan distributif עַם וָעָם menyatakan bahasa dari berbagai bangsa di sekitar mereka; rumusan ini mempertahankan ketidakspesifikan bahasa-bahasa tersebut.
