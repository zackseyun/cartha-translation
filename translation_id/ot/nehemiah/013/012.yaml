base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/012.yaml
  text: And all Judah brought the tithe of the grain[a], the new wine, and the oil into the storehouses.
translation:
  language: id
  text: Seluruh Yehuda membawa sepersepuluhan dari biji-bijian, anggur baru, dan minyak ke dalam gudang-gudang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל יְהוּדָה
  choice: Seluruh Yehuda
  rationale: כָּל dengan nama diri יְהוּדָה menunjuk secara kolektif kepada seluruh masyarakat Yehuda. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada wilayah atau penduduk.
- source_word: הֵבִיאוּ
  choice: membawa
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’ atau ‘membawa masuk’. Arah masuk sudah dinyatakan oleh frasa tujuan ‘ke dalam gudang-gudang’.
- source_word: מַעְשַׂר
  choice: sepersepuluhan
  rationale: מַעְשַׂר adalah istilah baku untuk bagian sepersepuluh yang wajib diberikan. Bentuk tunggal kolektif dari bahasa Ibrani dipertahankan secara wajar.
- source_word: הַ/דָּגָן
  choice: gandum
  rationale: דָּגָן menunjuk pada hasil biji-bijian secara umum. ‘Gandum’ merupakan padanan Alkitabiah yang umum dan mudah dipahami dalam daftar hasil pertanian ini, meski cakupan istilah Ibraninya lebih luas daripada satu jenis serealia.
- source_word: וְ/הַ/תִּירוֹשׁ
  choice: anggur baru
  rationale: תִּירוֹשׁ biasanya menunjuk pada anggur baru atau hasil anggur segar, berbeda dari istilah umum יַיִן. Terjemahan ini mempertahankan perbedaan leksikal tersebut.
- source_word: וְ/הַ/יִּצְהָר
  choice: minyak
  rationale: יִצְהָר dalam daftar hasil pertanian biasanya berarti minyak segar, lazimnya minyak zaitun. ‘Minyak’ cukup tepat dan tidak menambahkan kekhususan yang tidak dinyatakan langsung.
- source_word: לָ/אוֹצָרוֹת
  choice: ke dalam gudang-gudang
  rationale: אוֹצָרוֹת dapat berarti ruang penyimpanan atau tempat perbendaharaan. Dalam konteks gandum, anggur baru, dan minyak, ‘gudang-gudang’ paling sesuai; preposisi לָ menyatakan tujuan, dan konteks mendukung gerakan masuk.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan daftar hasil pertanian dipertahankan. Tidak diperlukan catatan kaki karena alternatif leksikal pada אוֹצָרוֹת tidak menimbulkan ambiguitas penting dalam konteks ini; catatan kaki bahasa Inggris yang ditempatkan setelah ‘grain’ tampaknya tidak selaras dengan isi catatannya tentang ‘storehouses’.
