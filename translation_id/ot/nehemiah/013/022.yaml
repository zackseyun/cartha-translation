    rationale: Kata אמר secara dasar berarti “berkata/mengatakan.” Konteks memang menunjukkan arahan, tetapi bentuk sumber tidak memakai kata kerja eksplisit untuk memerintah atau menyuruh. Menggantinya dengan “Aku berkata kepada ... supaya” menjaga nada instruktif tanpa menambah kekuatan perintah.
  revised_text: Aku berkata kepada orang-orang Lewi supaya mereka menyucikan diri dan datang menjaga pintu-pintu gerbang, supaya hari Sabat tetap kudus. Ya Allahku, ingatlah juga hal ini demi kebaikanku[a], dan kasihanilah aku sesuai dengan kelimpahan kasih setia-Mu[b].
