base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/022.yaml
  text: And I told the Levites that they should purify themselves and come to guard the gates[a], to keep the Sabbath day holy. Remember this also in my favor, my God[b], and spare me according to the greatness of your steadfast love.
translation:
  language: id
  text: Aku berkata kepada orang-orang Lewi supaya mereka menyucikan diri dan datang menjaga pintu-pintu gerbang, supaya hari Sabat tetap kudus. Ya Allahku, ingatlah juga hal ini demi kebaikanku[a], dan kasihanilah aku sesuai dengan kelimpahan kasih setia-Mu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ingatlah juga aku karena hal ini.” Ungkapan Ibraninya dapat dipahami dengan penekanan pada Nehemia atau pada perbuatan yang baru disebutkan.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani khesed, yang mencakup kasih, kesetiaan, dan kemurahan Allah yang teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לַלְוִיִּם
  choice: Aku menyuruh orang-orang Lewi
  rationale: Secara harfiah berarti ‘aku berkata kepada orang-orang Lewi’, tetapi isi perkataan itu berupa arahan administratif. ‘Menyuruh’ menyampaikan daya ujar tersebut secara alami tanpa sekuat ‘memerintahkan’.
- source_word: אֲשֶׁר יִהְיוּ מִטַּהֲרִים
  choice: menyucikan diri
  rationale: Bentuk Hitpael מִטַּהֲרִים bersifat refleksif dan menunjuk pada tindakan pemurnian diri yang diharapkan dari orang-orang Lewi.
- source_word: וּבָאִים שֹׁמְרִים הַשְּׁעָרִים
  choice: lalu datang menjaga pintu-pintu gerbang
  rationale: Rangkaian partisip menggambarkan urutan tindakan. ‘Lalu’ memperjelas urutan secara wajar, sedangkan ‘menjaga’ mempertahankan tanggung jawab aktif mereka atas gerbang-gerbang.
- source_word: לְקַדֵּשׁ אֶת יוֹם הַשַּׁבָּת
  choice: supaya hari Sabat tetap kudus
  rationale: Frasa tujuan ini secara harfiah berarti ‘untuk menguduskan hari Sabat’. Dalam konteks pencegahan perdagangan, ungkapan ini secara alami menyatakan bahwa penjagaan dilakukan agar kekudusan hari Sabat dipertahankan.
- source_word: זָכְרָה לִּי
  choice: ingatlah juga hal ini demi kebaikanku
  rationale: 'Dativ לִי mengandung makna benefaktif: Nehemia meminta agar Allah memperhitungkan perbuatannya secara baik. Karena idiom Ibraninya dapat diungkapkan dengan berfokus pada perbuatan atau pada Nehemia, alternatifnya dicatat dalam catatan kaki.'
- source_word: וְחוּסָה עָלַי
  choice: dan kasihanilah aku
  rationale: Kata חוס dapat berarti menyayangi, mengasihani, atau tidak menghukum/membinasakan. ‘Kasihanilah aku’ mempertahankan permohonan belas kasih tanpa menentukan ancaman tertentu yang darinya ia harus dilepaskan.
- source_word: כְּרֹב חַסְדֶּךָ
  choice: sesuai dengan kelimpahan kasih setia-Mu
  rationale: רֹב menyatakan kelimpahan atau kebesaran, sedangkan חֶסֶד mencakup kasih, kesetiaan, dan kemurahan yang teguh. ‘Kasih setia’ merupakan padanan Indonesia yang ringkas dan berbobot.
theological_decisions:
- issue: Makna חֶסֶד dalam permohonan belas kasih
  choice: kasih setia
  alternative: belas kasih; kasih perjanjian
  rationale: ‘Kasih setia’ mempertahankan unsur kasih dan kesetiaan Allah tanpa membatasi kata itu hanya pada emosi belas kasihan atau memasukkan istilah teknis ‘perjanjian’ yang tidak dinyatakan secara eksplisit dalam ayat ini.
- issue: Dasar permohonan Nehemia agar diingat
  choice: demi kebaikanku
  alternative: ingatlah juga aku karena hal ini
  rationale: Teks meminta Allah mengingat secara menguntungkan, tetapi tidak menguraikan doktrin pahala atau jasa. Terjemahan utama mempertahankan permohonan tersebut tanpa menyelesaikan ketegangan teologis antara perbuatan Nehemia dan kasih setia Allah yang menjadi dasar belas kasih.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Bentuk ‘Allahku’ dipertahankan sebagai sapaan pribadi, dan ‘hari Sabat’ memakai istilah Alkitab yang umum. Struktur kalimat dibuat lancar bagi pembaca umum tanpa menghilangkan urutan tindakan atau ambiguitas idiom Ibrani.
