base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/025.yaml
  text: 'So I contended with them and cursed them[a], and I struck some of the men and pulled out their hair, and I made them swear by God: “You shall not give your daughters to their sons[b], nor take any of their daughters for your sons or for yourselves.”'
translation:
  language: id
  text: Aku berbantah dengan mereka dan mengutuk mereka.[a] Aku memukul beberapa orang di antara mereka dan mencabut rambut mereka. Lalu aku menyuruh mereka bersumpah demi Allah, “Janganlah kalian memberikan anak-anak perempuan kalian kepada anak-anak lelaki mereka sebagai istri,[b] atau mengambil anak-anak perempuan mereka sebagai istri bagi anak-anak lelaki kalian ataupun bagi diri kalian sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mencerca mereka.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani memakai bentuk “jika kalian memberikan ... dan jika kalian mengambil ...”; dalam konteks sumpah, ungkapan itu berfungsi sebagai larangan tegas.
    reason: source_form
lexical_decisions:
- source_word: וָאָרִיב עִמָּם
  choice: Aku menentang mereka
  rationale: Kata ריב menyatakan tindakan berkonfrontasi atau berbantah dengan seseorang, kadang dengan nuansa mengajukan perkara. ‘Menentang’ menyampaikan konfrontasi itu secara wajar tanpa mempersempitnya menjadi teguran lisan saja.
- source_word: וָאֲקַלְלֵם
  choice: dan mengutuk mereka
  rationale: Kata קלל di sini paling langsung menyatakan pengucapan kutuk, meskipun dalam konteks ini dapat pula dipahami sebagai pencercaan atau kecaman keras.
- source_word: וָאַכֶּה מֵהֶם אֲנָשִׁים
  choice: Aku memukul beberapa orang di antara mereka
  rationale: Konstruksi dengan מִן menunjukkan bahwa yang dipukul adalah sejumlah orang dari kelompok tersebut. ‘Memukul’ mempertahankan laporan kekerasan fisik tanpa menambah tingkat keparahan yang tidak dinyatakan teks.
- source_word: וָאֶמְרְטֵם
  choice: dan mencabut rambut mereka
  rationale: מרט merujuk pada pencabutan atau penjambakan hingga rambut tercabut. Objek ‘rambut’ tersirat dalam bahasa Ibrani dan perlu dinyatakan dalam bahasa Indonesia.
- source_word: וָאַשְׁבִּיעֵם בֵּאלֹהִים
  choice: Lalu aku menyuruh mereka bersumpah demi Allah
  rationale: Bentuk kausatif שבע berarti membuat atau menyuruh seseorang bersumpah. Frasa בֵּאלֹהִים secara alami berarti ‘demi Allah’ dalam rumusan sumpah.
- source_word: אִם תִּתְּנוּ
  choice: Jangan sekali-kali kalian memberikan
  rationale: Sesudah tindakan menyuruh bersumpah, אִם memperkenalkan isi sumpah secara eliptis dengan daya larangan yang tegas. ‘Jangan sekali-kali’ mengungkapkan kekuatan sumpah itu dalam bahasa Indonesia alami.
- source_word: וְאִם תִּשְׂאוּ מִבְּנֹתֵיהֶם
  choice: atau mengambil anak-anak perempuan mereka sebagai istri
  rationale: Dalam konteks perkawinan, נשא berarti mengambil seorang perempuan sebagai istri. Penambahan ‘sebagai istri’ menjadikan maksudnya jelas tanpa mengubah isinya.
- source_word: לִבְנֵיכֶם וְלָכֶם
  choice: bagi anak-anak lelaki kalian ataupun bagi diri kalian sendiri
  rationale: Larangan mencakup baik perkawinan yang diatur bagi anak lelaki mereka maupun perkawinan bagi para lelaki itu sendiri. ‘Ataupun’ menyampaikan cakupan distributif larangan dengan wajar.
theological_decisions:
- issue: Pelaporan tindakan disipliner Nehemia yang keras
  choice: Mempertahankan secara langsung tindakan mengutuk, memukul, dan mencabut rambut
  alternative: Melunakkannya menjadi teguran lisan saja atau memperkerasnya menjadi penganiayaan berat
  rationale: Teks melaporkan tindakan fisik dan verbal yang keras. Terjemahan tidak menutupi kekerasan tersebut, tetapi juga tidak menambahkan penilaian moral atau tingkat kekerasan yang tidak dinyatakan.
- issue: Daya rumusan sumpah yang diperkenalkan dengan אִם
  choice: 'Menerjemahkannya sebagai larangan khidmat: ‘Jangan sekali-kali ...’'
  alternative: Mempertahankan bentuk harfiah ‘Jika kalian ...’
  rationale: Dalam konteks sumpah, אִם dapat memperkenalkan isi sumpah secara eliptis. Bentuk larangan menyampaikan fungsi pragmatisnya dengan jelas, sedangkan bentuk ‘jika’ tanpa pelengkap akan kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti ‘kalian’ dipakai karena semua bentuk orang kedua dalam isi sumpah bersifat jamak. Kekerasan dalam narasi disampaikan tanpa diperhalus maupun diperhebat.
