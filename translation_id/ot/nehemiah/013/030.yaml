  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: id
  text: Aku menyucikan mereka dari segala sesuatu yang asing dan menetapkan tugas-tugas[a] bagi para imam dan orang-orang Lewi, masing-masing dalam tugasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “giliran-giliran jaga” atau “penugasan pelayanan”.
    reason: מִשְׁמָרוֹת dapat menunjuk pada giliran jaga, tanggung jawab, kelompok, atau penugasan pelayanan.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: Demikianlah aku menyucikan mereka
  rationale: Bentuk piel טהר berarti membersihkan atau menyucikan. “Menyucikan” sesuai dengan konteks pembaruan umat dan pelayanan keagamaan. “Demikianlah” menyampaikan alur rangkuman/hasil dari tindakan-tindakan sebelumnya, sementara akhiran orang ketiga jamak tetap diterjemahkan “mereka” tanpa mempersempit acuannya.
- source_word: מִכָּל נֵכָר
  choice: dari segala sesuatu yang asing
  rationale: נֵכָר menunjuk pada apa yang asing atau berasal dari luar. Ungkapan ini mempertahankan keluasan teks dan tidak membatasinya hanya pada orang asing, kelompok etnis tertentu, atau perempuan asing.
- source_word: וָאַעֲמִידָה
  choice: lalu menetapkan
  rationale: Bentuk hiphil עמד di sini menyatakan tindakan menempatkan atau menetapkan secara administratif. “Menetapkan” cocok dengan tugas-tugas pelayanan yang diatur Nehemia.
- source_word: מִשְׁמָרוֹת
  choice: tugas-tugas
  rationale: Kata ini dapat berarti giliran jaga, tanggung jawab, kelompok pelayanan, atau penugasan. Dalam konteks imam dan orang Lewi, “tugas-tugas” jelas dan alami, sedangkan alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: bagi para imam dan orang-orang Lewi
  rationale: Kedua kelompok disebut secara eksplisit sesuai struktur Ibrani. Bentuk “orang-orang Lewi” merupakan sebutan Indonesia yang alami bagi kelompok tersebut.
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: masing-masing dalam pekerjaannya
  rationale: אִישׁ berfungsi distributif, yakni setiap orang dalam kelompok tersebut, dan מְלָאכָה berarti pekerjaan, tugas, atau pelayanan. Terjemahan ini mempertahankan bentuk orang ketiga tunggal sekaligus menyampaikan pembagian kerja secara wajar.
theological_decisions:
- issue: Cakupan “mereka” dan “segala sesuatu yang asing”
  choice: Tidak mempersempit “mereka” pada kelompok tertentu maupun “yang asing” pada orang asing saja.
  alternative: Aku menyucikan mereka dari semua orang asing; aku menyucikan para imam dan orang Lewi dari setiap perempuan asing.
  rationale: Bentuk Ibrani dalam ayat ini bersifat lebih luas. Konteks memang mencakup perkawinan campur dan pencemaran pelayanan imam, tetapi terjemahan tidak seharusnya memasukkan batasan yang tidak dinyatakan oleh ayat.
- issue: Makna administratif מִשְׁמָרוֹת
  choice: tugas-tugas
  alternative: giliran-giliran jaga; kelompok-kelompok pelayanan; tanggung jawab pelayanan
  rationale: Konteks mendukung pengaturan pelayanan para imam dan orang Lewi, tetapi istilah Ibrani tetap memiliki beberapa kemungkinan nuansa. Teks utama memakai ungkapan yang mudah dipahami dan catatan kaki menjaga alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menyucikan” dipilih daripada “menahirkan” agar lebih mudah dipahami pembaca umum tanpa menghilangkan dimensi kemurnian religius. Penanda catatan kaki ditempatkan sesudah “tugas-tugas”, yaitu unsur yang memang dijelaskan oleh catatan.
