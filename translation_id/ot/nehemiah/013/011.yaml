source:
  edition: WLC
  text: וָ/אָרִ֨יבָ/ה֙ אֶת הַ/סְּגָנִ֔ים וָ/אֹ֣מְרָ֔/ה מַדּ֖וּעַ נֶעֱזַ֣ב בֵּית הָ/אֱלֹהִ֑ים וָֽ/אֶ֨קְבְּצֵ֔/ם וָֽ/אַעֲמִדֵ֖/ם עַל עָמְדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: id
  text: Aku menegur para pejabat dan berkata, “Mengapa rumah Allah ditelantarkan?”[a] Lalu aku mengumpulkan mereka dan menempatkan mereka di tempat tugas masing-masing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditinggalkan.” Kata kerja pasif Ibrani dapat berarti dibiarkan atau ditinggalkan; dalam konteks ini, rumah Allah ditelantarkan karena pelayanan dan dukungannya tidak dipelihara.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “menempatkan mereka pada tempat mereka.” Ungkapan ini menunjuk kepada pengembalian orang-orang itu ke posisi atau tugas yang telah ditetapkan bagi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: Aku menegur
  rationale: Kata kerja ריב menyatakan tindakan menghadapi atau berbantah dengan pihak lain. Dalam konteks Nehemia meminta pertanggungjawaban para pejabat, “menegur” menyampaikan konfrontasi itu secara alami tanpa membatasi maknanya pada perselisihan formal.
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: סְגָנִים menunjuk kepada pemimpin atau pejabat sipil di bawah penguasa utama. “Para pejabat” jelas dan sesuai dengan konteks administratif.
- source_word: וָאֹמְרָה
  choice: dan berkata
  rationale: Bentuk naratif dari אמר menunjukkan tindakan berkata yang menyusul teguran; bahasa Indonesia secara alami tidak perlu mengulang subjek “aku”.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami bagi kata tanya yang meminta alasan.
- source_word: נֶעֱזַב
  choice: ditelantarkan
  rationale: Bentuk pasif dari עזב dapat berarti ditinggalkan atau dibiarkan. “Ditelantarkan” mempertahankan bobot tindakan membiarkan sekaligus cocok dengan konteks terabaikannya dukungan dan pelayanan rumah Allah.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ini mempertahankan ungkapan Ibrani tanpa menggantinya dengan istilah tafsiran “Bait Allah” atau “kuil Allah”.
- source_word: וָאֶקְבְּצֵם
  choice: aku mengumpulkan mereka
  rationale: קבץ berarti menghimpun atau mengumpulkan. Pronomina “mereka” dipertahankan sebagaimana teks Ibrani, tanpa memperjelas rujukannya secara berlebihan.
- source_word: וָאַעֲמִדֵם
  choice: menempatkan mereka
  rationale: Bentuk kausatif עמד di sini berarti membuat mereka berdiri atau menempatkan mereka pada posisi tertentu.
- source_word: עַל עָמְדָם
  choice: di tempat tugas masing-masing
  rationale: Ungkapan ini secara harfiah berkaitan dengan tempat mereka berdiri, tetapi dalam konteks menunjuk kepada posisi atau tugas yang ditetapkan. “Tempat tugas masing-masing” mengungkapkan fungsi tersebut dengan bahasa Indonesia yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif orang pertama dipertahankan. Istilah “rumah Allah” mengikuti bentuk sumber, sedangkan “tempat tugas masing-masing” dipilih sebagai ungkapan fungsional yang alami. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
