  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: id
  text: Bukankah karena hal-hal inilah Salomo, raja Israel, berbuat dosa? Di antara banyak bangsa tidak ada raja seperti dia. Ia dikasihi oleh Allahnya, dan Allah mengangkatnya menjadi raja atas seluruh Israel. Namun, bahkan dia pun dibuat berdosa oleh perempuan-perempuan asing[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri-istri asing.” Teks Ibrani berbunyi “perempuan-perempuan asing”; “istri-istri” sesuai dengan konteks kisah Salomo, tetapi tidak dinyatakan secara eksplisit dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Bukankah karena hal-hal inilah
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya, sekaligus menyatakan hubungan sebab dengan wajar dalam bahasa Indonesia.
- source_word: חָטָא
  choice: berbuat dosa
  rationale: Padanan baku dan jelas untuk tindakan moral-keagamaan yang dinyatakan oleh verba Ibrani.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Di antara banyak bangsa tidak ada raja seperti dia
  rationale: Mempertahankan lingkup perbandingan ant bangsa tanpa menambahkan identitas bangsa atau raja tertentu.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Ia dikasihi oleh Allahnya
  rationale: Mencerminkan bentuk pasif/adjektival dan sufiks posesif pada 'Allahnya' tanpa menggantinya dengan nama ilahi yang tidak terdapat dalam teks.
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: Allah mengangkatnya menjadi raja
  rationale: Dalam konstruksi ini נתן menyatakan penempatan atau pengangkatan dalam jabatan; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: גַּם אוֹתוֹ הֶחֱטִיאוּ
  choice: bahkan dia pun dibuat jatuh ke dalam dosa
  rationale: Mempertahankan penekanan pada Salomo serta makna kausatif bentuk Hifil, dengan ungkapan Indonesia yang alami.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: perempuan-perempuan asing
  rationale: Menerjemahkan unsur leksikal yang eksplisit secara langsung; konteks dapat menunjuk kepada istri-istri asing, tetapi kata 'istri' tidak dinyatakan dalam ayat ini.
theological_decisions:
- issue: Peran perempuan-perempuan asing dalam dosa Salomo
  choice: Teks menyatakan bahwa mereka membuat Salomo jatuh ke dalam dosa tanpa menjelaskan lebih lanjut caranya.
  alternative: Mereka menggoda Salomo atau perkawinannya mengkompromikan kesetiaannya kepada Allah.
  rationale: Bentuk kausatif Ibrani secara eksplisit menghubungkan mereka dengan dosa Salomo, tetapi ayat ini sendiri tidak merinci mekanisme atau motifnya.
- issue: Penerjemahan אֱלֹהִים
  choice: Allah
  alternative: TUHAN
  rationale: Teks memakai אֱלֹהִים, bukan nama perjanjian YHWH; karena itu 'Allah' mempertahankan pembedaan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-retoris yang bermartabat. Tanda koma mengapit gelar Salomo agar kalimat pembuka mudah dibaca. 'Allahnya' dipertahankan untuk mencerminkan sufiks posesif Ibrani, sedangkan 'dibuat jatuh ke dalam dosa' menyampaikan kausatif secara alami tanpa menambahkan penjelasan doktrinal.
