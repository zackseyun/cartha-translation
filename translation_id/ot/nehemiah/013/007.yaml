  text: וָ/אָב֖וֹא לִֽ/ירוּשָׁלִָ֑ם וָ/אָבִ֣ינָ/ה בָ/רָעָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה אֶלְיָשִׁיב֙ לְ/ט֣וֹבִיָּ֔ה לַ/עֲשׂ֥וֹת ל/וֹ֙ נִשְׁכָּ֔ה בְּ/חַצְרֵ֖י בֵּ֥ית הָ/אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/007.yaml
  text: When I came to Jerusalem[b][a], I understood the evil that Eliashib had done for Tobiah by making a chamber for him in the courts of the house of God.
translation:
  language: id
  text: Ketika aku tiba di Yerusalem, aku memahami kejahatan yang dilakukan Elyasib untuk Tobia dengan membuatkan baginya sebuah ruangan di pelataran-pelataran rumah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Rumah Allah" di sini merujuk pada bait Allah; "ruangan" juga dapat diterjemahkan "bilik".'
    reason: Menjelaskan rujukan budaya dari ungkapan בֵּית הָאֱלֹהִים dan mencatat keluasan makna נִשְׁכָּה tanpa mempersempit teks utama.
lexical_decisions:
- source_word: וָאָבוֹא לִירוּשָׁלִָם
  choice: Ketika aku tiba di Yerusalem
  rationale: Wayyiqtol meneruskan alur narasi, tetapi dalam konteks ini kedatangan menjadi latar waktu bagi kesadaran Nehemia; 'ketika' menyampaikan hubungan itu secara alami.
- source_word: וָאָבִינָה
  choice: aku memahami
  rationale: Bentuk dari בין menyatakan memahami atau menyadari. 'Memahami' mempertahankan unsur kognitif tanpa menambahkan cara informasi itu diperoleh.
- source_word: בָרָעָה
  choice: kejahatan
  rationale: רָעָה memberi penilaian moral yang tegas terhadap tindakan tersebut; 'kejahatan' menjaga bobot itu dan tidak melunakkannya menjadi sekadar kesalahan.
- source_word: אֲשֶׁר עָשָׂה אֶלְיָשִׁיב לְטוֹבִיָּה
  choice: yang telah dilakukan Elyasib demi Tobia
  rationale: Bentuk 'telah dilakukan' memperjelas bahwa tindakan Elyasib mendahului pemahaman Nehemia. לְטוֹבִיָּה menunjukkan tindakan untuk kepentingan Tobia, yang secara wajar diterjemahkan 'demi Tobia'.
- source_word: לַעֲשׂוֹת לוֹ נִשְׁכָּה
  choice: yaitu menyediakan baginya sebuah ruangan
  rationale: Infinitif menjelaskan isi atau wujud tindakan jahat itu. 'Menyediakan' sesuai dengan pembuatan atau penataan ruang bagi Tobia, sedangkan 'ruangan' mempertahankan cakupan umum נִשְׁכָּה tanpa mempersempitnya menjadi gudang.
- source_word: בְּחַצְרֵי
  choice: di pelataran-pelataran
  rationale: Bentuk jamak חַצְרֵי menunjuk pada pelataran kompleks bait; bentuk ulang mempertahankan kemajemukan sumber.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ungkapan Ibrani, yang dalam konteks menunjuk pada bait Allah, tetap alami dan menjaga citra sumber.
theological_decisions:
- issue: Penilaian moral atas tindakan Elyasib
  choice: kejahatan
  alternative: kesalahan; perbuatan buruk
  rationale: Teks secara eksplisit memakai רָעָה dan menilai tindakan itu secara moral. Terjemahan tidak boleh meredakan penilaian tersebut.
- issue: Makna 'rumah Allah' dalam konteks
  choice: Mempertahankan ungkapan 'rumah Allah' dalam teks utama
  alternative: bait Allah
  rationale: Ungkapan harfiah dapat dipahami dalam bahasa Indonesia dan mempertahankan citra teologis teks, sementara catatan menjelaskan rujukannya pada bait.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Elyasib dan Tobia. Susunan kalimat dibuat alami sambil mempertahankan urutan gagasan, penilaian moral, bentuk jamak pelataran, dan citra ''rumah Allah'' dari bahasa Ibrani.'
