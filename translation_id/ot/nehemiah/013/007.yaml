  to: Ketika aku tiba di Yerusalem, aku memahami kejahatan yang dilakukan Elyasib untuk Tobia dengan membuatkan baginya sebuah ruangan di pelataran-pelataran rumah Allah.[a]
  rationale: Revisi memakai konstruksi aktif untuk memperjelas bahwa Elyasib adalah pelaku, mengganti "demi Tobia" dengan "untuk Tobia" guna menyatakan manfaat tanpa nuansa tambahan, dan mengganti "menyediakan" dengan "membuatkan" agar lebih dekat dengan לַעֲשׂוֹת לוֹ. Makna, penilaian moral, nama, dan bentuk jamak pelataran dipertahankan.
