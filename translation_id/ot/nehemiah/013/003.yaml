base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/003.yaml
  text: And when they heard the law[a], they separated from Israel all the mixed multitude.
translation:
  language: id
  text: Ketika mereka mendengar hukum itu, mereka memisahkan seluruh kelompok campuran dari Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang keturunan campuran” atau “seluruh golongan campuran”. Kata Ibrani עֵרֶב adalah istilah kolektif untuk suatu kelompok campuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  choice: Ketika mereka mendengar
  rationale: Rangkaian naratif וַיְהִי dan konstruksi temporal כְּ dengan infinitif menyatakan peristiwa berikutnya. Dalam bahasa Indonesia, 'Ketika mereka mendengar' menyampaikan hubungan waktunya secara alami tanpa ungkapan kaku 'terjadilah'.
- source_word: הַתּוֹרָה
  choice: hukum itu
  rationale: Dalam konteks pembacaan publik pascapembuangan, תּוֹרָה menunjuk pada hukum atau pengajaran berwibawa yang baru saja dibacakan. 'Hukum itu' jelas bagi pembaca umum dan penunjuk 'itu' mengaitkannya dengan bacaan yang disebut dalam konteks.
- source_word: וַיַּבְדִּילוּ
  choice: mereka memisahkan
  rationale: Akar בדל berarti memisahkan atau membedakan. Pilihan ini mempertahankan tindakan yang dinyatakan teks tanpa menambahkan penilaian yang lebih kuat seperti 'mengusir'.
- source_word: כָל עֵרֶב
  choice: semua orang dari kelompok campuran
  rationale: עֵרֶב adalah nomina kolektif untuk kelompok atau unsur campuran. Ungkapan ini cukup alami dalam bahasa Indonesia, mempertahankan sifat kolektifnya, dan tidak memastikan bahwa yang dimaksud semata-mata keturunan campuran.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מִן menandai pemisahan, sedangkan יִשְׂרָאֵל dipertahankan sebagai nama bagi komunitas perjanjian, bukan diparafrasakan menjadi 'orang Israel'.
theological_decisions:
- issue: Rujukan 'Israel' dalam konteks kemurnian komunitas pascapembuangan
  choice: Mempertahankan 'Israel' sebagai istilah bagi komunitas perjanjian
  alternative: dari orang Israel; dari jemaah Israel
  rationale: Teks Ibrani memakai nama diri יִשְׂרָאֵל. Mempertahankannya menjaga dimensi identitas korporat dan perjanjian tanpa memasukkan kesimpulan teologis tambahan.
- issue: Identitas kelompok yang disebut עֵרֶב
  choice: kelompok campuran
  alternative: orang-orang berdarah campuran; kumpulan berbagai bangsa
  rationale: Istilah Ibrani bersifat kolektif dan maknanya dapat mencakup kelompok campuran tanpa menjelaskan secara tegas dasar pencampurannya. Terjemahan utama mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat langsung dan mudah dipahami, sementara istilah 'kelompok campuran' beserta catatan kaki menjaga keluasan makna kata Ibrani.
