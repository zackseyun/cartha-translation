source:
  edition: WLC
  text: וָ/אוֹצְרָ֣/ה עַל א֠וֹצָרוֹת שֶׁלֶמְיָ֨ה הַ/כֹּהֵ֜ן וְ/צָד֣וֹק הַ/סּוֹפֵ֗ר וּ/פְדָיָה֙ מִן הַ/לְוִיִּ֔ם וְ/עַל יָדָ֔/ם חָנָ֥ן בֶּן זַכּ֖וּר בֶּן מַתַּנְיָ֑ה כִּ֤י נֶאֱמָנִים֙ נֶחְשָׁ֔בוּ וַ/עֲלֵי/הֶ֖ם לַ/חֲלֹ֥ק לַ/אֲחֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: id
  text: Aku mengangkat Selemya, sang imam, Zadok, sang juru tulis, dan Pedaya dari antara orang Lewi sebagai penanggung jawab gudang-gudang, dengan Hanan bin Zakur bin Matanya untuk mendampingi mereka.[a] Mereka dianggap dapat dipercaya,[b] dan merekalah yang bertugas membagikan kepada saudara-saudara mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “mendampingi mereka” juga dapat berarti “di bawah arahan mereka” atau “di sisi mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dianggap setia.”
    reason: lexical_alternative
  - marker: c
    text: “Saudara-saudara” menerjemahkan istilah maskulin dalam bahasa Ibrani; di sini maksudnya ialah sesama anggota kelompok atau komunitas mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹצְרָה עַל אֹצָרוֹת
  choice: Aku mengangkat ... sebagai penanggung jawab gudang-gudang
  rationale: Kata kerja di sini menyatakan penunjukan pejabat untuk menangani אֹצָרוֹת. Dalam konteks pengumpulan dan pembagian persembahan, 'gudang-gudang' menunjuk ruang penyimpanan, sedangkan 'sebagai penanggung jawab' menyampaikan fungsi administratifnya secara alami.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: Selemya, sang imam
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dan gelar diterjemahkan tanpa menambahkan fungsi yang tidak disebutkan.
- source_word: צָדוֹק הַסֹּפֵר
  choice: Zadok, sang juru tulis
  rationale: סֹפֵר dapat berarti juru tulis atau pejabat sekretarial. 'Juru tulis' mempertahankan gelar yang luas dan tradisional tanpa mempersempit tugasnya.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: dan Pedaya dari antara orang Lewi
  rationale: Terjemahan ini mempertahankan keterangan asal atau keanggotaan kelompok yang dinyatakan dengan מִן.
- source_word: וְעַל יָדָם
  choice: dengan Hanan ... mendampingi mereka
  rationale: Ungkapan עַל יָד dapat menyatakan kedekatan dalam tugas, pendampingan, atau kedudukan di bawah arahan. 'Mendampingi mereka' menjaga relasi kerja tanpa memastikan hierarki yang tidak sepenuhnya tegas.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: Mereka dianggap dapat dipercaya
  rationale: נֶחְשָׁבוּ menyatakan penilaian atau anggapan, sedangkan נֶאֱמָנִים dalam konteks pengelolaan persediaan menekankan keandalan dan sifat dapat dipercaya.
- source_word: וַעֲלֵיהֶם לַחֲלֹק
  choice: merekalah yang bertugas membagikan persediaan
  rationale: וַעֲלֵיהֶם menandai tanggung jawab yang dibebankan kepada mereka, dan לַחֲלֹק berarti membagi atau menyalurkan bagian. 'Persediaan' dijelaskan dari konteks gudang tanpa menentukan jenis barang tertentu.
- source_word: לַאֲחֵיהֶם
  choice: kepada saudara-saudara mereka
  rationale: Terjemahan mempertahankan istilah kekerabatan maskulin jamak dalam bahasa Ibrani dan tidak mempersempit rujukannya hanya kepada orang Lewi.
theological_decisions:
- issue: Cakupan istilah אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: rekan-rekan mereka / sesama orang Lewi
  rationale: Teks memakai istilah kekerabatan maskulin jamak. Terjemahan literal mempertahankan bentuk dan kemungkinan cakupan rujukannya, sementara catatan menjelaskan bahwa dalam konteks istilah itu menunjuk sesama anggota kelompok atau komunitas.
- issue: Sifat yang dinyatakan oleh נֶאֱמָנִים
  choice: dapat dipercaya
  alternative: setia
  rationale: Keduanya mungkin secara leksikal. Dalam konteks pengelolaan dan pembagian persediaan, 'dapat dipercaya' paling langsung menyampaikan keandalan administratif tanpa meniadakan nuansa kesetiaan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan tetap mempertahankan daftar pejabat, ambiguitas relasi Hanan dengan tiga pejabat lain, penilaian atas keterpercayaan mereka, dan tanggung jawab pembagian. Nama-nama memakai bentuk Indonesia yang lazim: Selemya, Zadok, Pedaya, Hanan, Zakur, dan Matanya.'
