base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/018.yaml
  text: Did not your fathers do this[a], and our God brought all this evil on us and on this city? Yet you are adding wrath against Israel by profaning the Sabbath.
translation:
  language: id
  text: Bukankah nenek moyang kalian berbuat demikian, lalu Allah kita mendatangkan segala malapetaka ini[a] atas kita dan atas kota ini? Namun, kalian menambah murka terhadap Israel dengan mencemarkan hari Sabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala bencana ini.” Kata Ibrani רָעָה dapat berarti malapetaka atau bencana dalam konteks penghukuman ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא כֹה עָשׂוּ
  choice: Bukankah ... berbuat demikian
  rationale: Bentuk ini menyampaikan pertanyaan retoris yang mengharapkan persetujuan dan mempertahankan makna idiomatis כֹה עָשׂוּ.
- source_word: אֲבֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Dalam bahasa Indonesia modern, ungkapan ini secara alami menunjuk para leluhur, sesuai cakupan bentuk jamak Ibrani.
- source_word: וַיָּבֵא
  choice: lalu ... mendatangkan
  rationale: Bentuk kausatif בוא berarti membawa atau mendatangkan sesuatu atas pihak tertentu; “lalu” mempertahankan urutan akibat dalam konteks tanpa membuat hubungan kausalnya lebih tegas daripada teks.
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: segala malapetaka ini
  rationale: Dalam konteks penghukuman ilahi, רָעָה menunjuk bencana atau malapetaka, bukan kejahatan moral yang dilakukan Allah.
- source_word: מוֹסִיפִים חָרוֹן עַל יִשְׂרָאֵל
  choice: kamu menambah murka atas Israel
  rationale: Mempertahankan gambaran bahwa tindakan mereka menambahkan murka yang menimpa Israel, tanpa melemahkan bobot penghukuman ilahi.
- source_word: לְחַלֵּל אֶת הַשַּבָּת
  choice: dengan menajiskan hari Sabat
  rationale: חלל berarti memperlakukan sesuatu yang kudus sebagai tidak kudus; “menajiskan” menyampaikan pelanggaran terhadap kekudusan Sabat.
theological_decisions:
- issue: Makna רָעָה sebagai sesuatu yang didatangkan Allah
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Konteksnya adalah penghukuman yang menimpa umat dan kota. “Malapetaka” mempertahankan beratnya hukuman tanpa menyiratkan bahwa Allah melakukan kejahatan moral.
- issue: Kekuatan istilah חָרוֹן
  choice: murka
  alternative: amarah; amarah yang menyala-nyala
  rationale: “Murka” mempertahankan bobot teologis dari amarah ilahi dalam konteks penghukuman perjanjian dan tidak mereduksinya menjadi emosi biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pertanyaan retoris dipertahankan; hubungan antara dosa leluhur dan malapetaka dinyatakan sebagai urutan yang secara kontekstual bersifat akibat, tanpa menambahkan penjelasan doktrinal.
