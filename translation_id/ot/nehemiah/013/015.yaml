revisions:
- from: Pada masa itu, di Yehuda aku melihat orang-orang menginjak-injak buah anggur di tempat pemerasan pada hari Sabat. Ada juga yang membawa tumpukan-tumpukan gandum dan memuatnya ke atas keledai, serta membawa anggur, buah anggur, buah ara, dan segala macam muatan ke Yerusalem pada hari Sabat. Maka, aku memperingatkan mereka pada hari mereka menjual bahan makanan.
  to: Pada waktu itu aku melihat di Yehuda orang-orang menginjak anggur di tempat-tempat pemerasan pada hari Sabat, membawa tumpukan-tumpukan dan memuatnya ke atas keledai, juga membawa anggur, buah anggur, buah ara, dan segala macam muatan, lalu membawanya ke Yerusalem pada hari Sabat. Aku pun memperingatkan mereka pada hari mereka menjual bahan makanan.
  rationale: Revisi menghapus penambahan “gandum” agar arti הָעֲרֵמוֹת tetap terbuka seperti dalam sumber. Rangkaian kerja disatukan kembali, sementara “memperingatkan mereka” dipertahankan sebagai padanan kontekstual yang alami untuk tindakan resmi Nehemia melalui וָאָעִיד. Tidak diperlukan catatan kaki karena pembetulan ini dapat dinyatakan langsung dalam teks tanpa kehilangan makna.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:20Z'
