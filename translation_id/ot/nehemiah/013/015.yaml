  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: id
  text: Pada waktu itu aku melihat di Yehuda orang-orang menginjak anggur di tempat-tempat pemerasan pada hari Sabat, membawa tumpukan-tumpukan dan memuatnya ke atas keledai, juga membawa anggur, buah anggur, buah ara, dan segala macam muatan, lalu membawanya ke Yerusalem pada hari Sabat. Aku pun memperingatkan mereka pada hari mereka menjual bahan makanan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: menginjak-injak buah anggur di tempat pemerasan
  rationale: Ungkapan ini secara harfiah berbicara tentang menginjak tempat pemerasan, yakni menginjak buah anggur dalam proses pembuatan anggur. Objek tersirat dibuat eksplisit agar wajar dan jelas dalam bahasa Indonesia.
- source_word: הָעֲרֵמוֹת
  choice: tumpukan-tumpukan gandum
  rationale: Kata Ibrani berarti 'tumpukan-tumpukan'; dalam konteks hasil pertanian yang dimuat ke atas keledai, gandum merupakan pelengkap kontekstual yang masuk akal, tetapi bukan arti leksikal eksplisit kata tersebut.
- source_word: וָאָעִיד
  choice: aku memperingatkan mereka
  rationale: Bentuk verba ini dapat berarti memberi kesaksian dengan sungguh-sungguh atau memperingatkan. Dalam konteks Nehemia menegur pelanggaran hari Sabat, 'memperingatkan' menyampaikan fungsi ujarannya secara alami.
- source_word: צָיִד
  choice: bahan makanan
  rationale: Kata ini menunjuk bekal atau persediaan makanan. 'Bahan makanan' cocok dengan konteks barang yang diperjualbelikan dan tidak membatasi maknanya pada makanan siap santap.
- source_word: בְּיוֹם מִכְרָם
  choice: pada hari mereka menjual
  rationale: Mempertahankan konstruksi temporal dan pronomina jamak sumber tanpa menambahkan objek yang tidak dinyatakan dalam frasa ini.
theological_decisions:
- issue: Sifat tindakan Nehemia melalui וָאָעִיד
  choice: aku memperingatkan mereka
  alternative: aku bersaksi menentang mereka
  rationale: Konteks mendukung teguran atau peringatan resmi. Pilihan ini tidak menambah hukuman atau formula hukum tertentu yang tidak dinyatakan oleh ayat.
- issue: Penyebutan hari Sabat
  choice: hari Sabat
  alternative: hari perhentian
  rationale: Istilah baku Indonesia mempertahankan identitas historis dan religius hari tersebut tanpa menafsirkan lebih jauh kewajiban teologisnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dipecah untuk keterbacaan, sambil mempertahankan urutan pengamatan, kegiatan perdagangan, dan respons Nehemia. Tidak ada penanda catatan kaki karena tidak diperlukan.
