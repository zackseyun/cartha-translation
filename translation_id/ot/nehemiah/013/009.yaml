  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֹ֣מְרָ֔/ה וַֽ/יְטַהֲר֖וּ הַ/לְּשָׁכ֑וֹת וָ/אָשִׁ֣יבָ/ה שָּׁ֗ם כְּלֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים אֶת הַ/מִּנְחָ֖ה וְ/הַ/לְּבוֹנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/009.yaml
  text: Then I gave the order[a], and they cleansed the chambers; and I brought back there the vessels of the house of God[b], with the grain offering and the frankincense.
translation:
  language: id
  text: Lalu aku memberi perintah[a], dan mereka menahirkan bilik-bilik itu. Kemudian aku membawa kembali ke sana perlengkapan rumah Allah, beserta persembahan sajian dan kemenyan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkata” atau “memerintahkan.” Verba Ibraninya secara harfiah berarti “berkata,” tetapi dalam konteks ini perkataan tersebut merupakan perintah yang dilaksanakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Lalu aku memberi perintah
  rationale: Secara harfiah verba ini berarti “aku berkata,” tetapi dalam konteks perkataan Nehemia merupakan perintah yang langsung dilaksanakan. Pilihan ini menyatakan daya ujarannya secara alami; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: וַיְטַהֲרוּ
  choice: mereka menahirkan
  rationale: Verba טהר dapat mencakup pembersihan dari kenajisan, khususnya dalam konteks ritual. “Menahirkan” mempertahankan nuansa kultis yang dapat hilang jika diterjemahkan hanya sebagai “membersihkan.”
- source_word: הַלְּשָׁכוֹת
  choice: bilik-bilik itu
  rationale: לשכה menunjuk pada ruang atau bilik di lingkungan Bait Allah. “Bilik-bilik” cukup khusus bagi konteks bangunan suci tanpa mempersempit maknanya menjadi “gudang.”
- source_word: וָאָשִׁיבָה שָּׁם
  choice: Kemudian aku membawa kembali ke sana
  rationale: Bentuk kausatif dari שוב menyatakan tindakan membawa kembali atau memulihkan benda-benda ke tempat sebelumnya; “ke sana” mempertahankan שׁם.
- source_word: כְּלֵי בֵּית הָאֱלֹהִים
  choice: perlengkapan rumah Allah
  rationale: כְּלִי adalah istilah luas bagi perkakas, wadah, atau berbagai benda yang digunakan. “Perlengkapan” alami dalam bahasa Indonesia dan tidak membatasi rujukannya hanya pada bejana, sementara “rumah Allah” mempertahankan ungkapan Ibrani.
- source_word: אֶת הַמִּנְחָה
  choice: beserta persembahan sajian
  rationale: Dalam konteks ibadah, מִנְחָה menunjuk pada persembahan berbahan hasil bumi atau tepung. “Persembahan sajian” merupakan padanan Indonesia yang mapan dan tidak mempersempitnya menjadi biji-bijian mentah.
- source_word: וְהַלְּבוֹנָה
  choice: dan kemenyan
  rationale: לְבוֹנָה secara khusus berarti frankincense. “Kemenyan” adalah padanan Indonesia yang alami dan lebih tepat daripada istilah umum “dupa.”
theological_decisions:
- issue: Sifat penahiran bilik-bilik
  choice: menahirkan
  alternative: membersihkan
  rationale: Konteks rumah Allah memungkinkan tindakan ini mencakup penahiran ritual sekaligus pembersihan nyata. Terjemahan tidak membatasi tindakan itu pada kebersihan fisik saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menahirkan,” “bilik-bilik,” dan “persembahan sajian” mempertahankan register peribadatan tanpa membuat kalimat sulit dipahami. Penanda catatan kaki [a] dicantumkan langsung sesudah frasa yang dijelaskan.
