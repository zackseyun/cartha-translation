  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא נִקְרָ֛א בְּ/סֵ֥פֶר מֹשֶׁ֖ה בְּ/אָזְנֵ֣י הָ/עָ֑ם וְ/נִמְצָא֙ כָּת֣וּב בּ֔/וֹ אֲ֠שֶׁר לֹא יָב֨וֹא עַמֹּנִ֧י וּ/מֹאָבִ֛י בִּ/קְהַ֥ל הָ/אֱלֹהִ֖ים עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/001.yaml
  text: On that day the Book of Moses was read in the hearing of the people[c][b][a], and it was found written in it that no Ammonite or Moabite should ever enter the assembly of God.
translation:
  language: id
  text: Pada hari itu, Kitab Musa[a] dibacakan kepada rakyat, dan di dalamnya didapati tertulis bahwa orang Amon atau orang Moab tidak boleh masuk ke dalam jemaah Allah[b] untuk selama-lamanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gulungan Musa.” Kata Ibrani yang digunakan dapat berarti gulungan, kitab, atau dokumen tertulis.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “perkumpulan Allah.” Istilah Ibrani menunjuk pada komunitas yang berhimpun.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “sampai selama-lamanya”; dapat juga diterjemahkan “sepanjang masa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu ini menunjuk pada kesempatan tertentu dan diterjemahkan secara langsung serta alami.
- source_word: נִקְרָא
  choice: dibacakan
  rationale: Bentuk pasif dalam konteks pembacaan publik paling alami dinyatakan dengan 'dibacakan'; unsur lisan juga tersirat oleh frasa berikutnya.
- source_word: בְּסֵפֶר מֹשֶׁה
  choice: Kitab Musa[a]
  rationale: סֵפֶר dapat berarti kitab atau gulungan. 'Kitab Musa' jelas, lazim, dan tidak membatasi bentuk fisik naskah.
- source_word: בְּאָזְנֵי הָעָם
  choice: di hadapan seluruh rakyat
  rationale: Secara harfiah berarti 'di telinga rakyat', yakni pembacaan yang didengar oleh komunitas. 'Di hadapan seluruh rakyat' menyampaikan idiom itu secara alami; 'seluruh' mengungkapkan makna kolektif tanpa menuntut setiap individu hadir.
- source_word: וְנִמְצָא כָּתוּב בּוֹ
  choice: Di dalamnya ditemukan tulisan
  rationale: Mempertahankan susunan pasif dan rujukan kepada Kitab Musa dalam bahasa Indonesia yang lancar.
- source_word: אֲשֶׁר לֹא יָבוֹא
  choice: bahwa ... tidak boleh masuk
  rationale: Klausa ini melaporkan larangan yang tertulis; 'tidak boleh masuk' menyampaikan daya normatifnya dengan jelas.
- source_word: עַמֹּנִי וּמֹאָבִי
  choice: orang Amon atau orang Moab
  rationale: 'Dalam lingkup negasi, pasangan ini bersifat distributif: siapa pun dari salah satu kelompok tidak boleh masuk. ''Atau'' menyatakan hubungan tersebut secara alami.'
- source_word: בִּקְהַל הָאֱלֹהִים
  choice: jemaah Allah[b]
  rationale: קָהָל menunjuk pada komunitas yang berhimpun. 'Jemaah Allah' ringkas dan alami, sambil mempertahankan hubungan langsung dengan Allah tanpa memasukkan istilah gerejawi yang lebih khusus.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya[c]
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa batas dalam rumusan larangan; terjemahan tersebut mempertahankan kekuatan teks dan memungkinkan nuansanya dijelaskan dalam catatan.
theological_decisions:
- issue: Makna בִּקְהַל הָאֱלֹהִים
  choice: jemaah Allah
  alternative: perkumpulan Allah
  rationale: Pilihan ini mempertahankan makna komunitas umat yang berhimpun dan hubungan genitif dengan Allah, tanpa menyamakannya secara eksplisit dengan lembaga gereja kemudian.
- issue: Daya עַד עוֹלָם dalam rumusan pengecualian hukum
  choice: untuk selama-lamanya
  alternative: sepanjang masa
  rationale: Teks mengungkapkan pengecualian yang berkelanjutan. Pilihan ini mempertahankan ketegangan teologis dan daya mutlak ungkapan sumber, bukan membatasi durasinya melalui penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-hukum yang bermartabat. Kalimat dibagi menjadi dua agar alami dan mudah dipahami, tanpa mengubah hubungan isi. Istilah 'jemaah' dipilih dalam ejaan baku dan tidak dimaksudkan sebagai penetapan denominasi tertentu.
