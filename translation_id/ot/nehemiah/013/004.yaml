  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ/פְנֵ֣י מִ/זֶּ֔ה אֶלְיָשִׁיב֙ הַ/כֹּהֵ֔ן נָת֖וּן בְּ/לִשְׁכַּ֣ת בֵּית אֱלֹהֵ֑י/נוּ קָר֖וֹב לְ/טוֹבִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: id
  text: Sebelum itu, imam Elyasib, yang ditugaskan untuk mengawasi ruang di rumah Allah kita, mempunyai hubungan dekat dengan Tobia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “masih kerabat Tobia.” Ungkapan Ibrani ini dapat menunjukkan hubungan dekat, baik secara kekeluargaan maupun sosial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: Sebelum itu
  rationale: Ungkapan temporal ini menunjuk pada keadaan yang sudah berlangsung sebelum peristiwa sebelumnya; unsur penghubung וְ tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: imam Elyasib
  rationale: Gelar definit הַכֹּהֵן diterjemahkan secara alami sebelum nama orang dalam bahasa Indonesia.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: yang ditugaskan mengawasi salah satu ruangan di rumah Allah kita
  rationale: Bentuk pasif נָתוּן dalam konteks ini menyatakan penugasan atau tanggung jawab. לִשְׁכָּה adalah ruangan samping dalam kompleks Bait Allah dan dapat berfungsi sebagai gudang; 'salah satu ruangan' menjaga arti arsitektural tanpa menyempitkannya.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: mempunyai hubungan dekat dengan Tobia
  rationale: Ungkapan ini dapat menunjukkan kekerabatan ataupun kedekatan sosial. Pilihan ini mempertahankan cakupan makna tersebut tanpa memastikan jenis hubungannya.
theological_decisions:
- issue: Jenis hubungan antara Elyasib dan Tobia
  choice: mempunyai hubungan dekat dengan Tobia
  alternative: masih kerabat Tobia
  rationale: Teks Ibrani tidak memastikan apakah hubungan itu berupa kekerabatan atau persekutuan sosial, sehingga terjemahan utama tidak menetapkan salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Nama אֶלְיָשִׁיב ditulis 'Elyasib' dan טוֹבִיָּה ditulis 'Tobia' menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Tanda titik dipakai karena ayat disajikan tersendiri, meskipun kalimat berlanjut ke ayat berikutnya dalam konteks.
