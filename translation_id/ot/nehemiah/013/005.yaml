  text: וַ/יַּ֨עַשׂ ל֜/וֹ לִשְׁכָּ֣ה גְדוֹלָ֗ה וְ/שָׁ֣ם הָי֪וּ לְ/פָנִ֟ים נֹ֠תְנִים אֶת הַ/מִּנְחָ֨ה הַ/לְּבוֹנָ֜ה וְ/הַ/כֵּלִ֗ים וּ/מַעְשַׂ֤ר הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר מִצְוַת֙ הַ/לְוִיִּ֔ם וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים וּ/תְרוּמַ֖ת הַ/כֹּהֲנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/005.yaml
  text: He made for him a large chamber[a], where formerly they had put the grain offering, the frankincense, the vessels, and the tithe of grain, new wine, and oil—the portion commanded for the Levites, the singers[d][c][b], and the gatekeepers—and the contribution for the priests.
translation:
  language: id
  text: Ia menyediakan baginya sebuah ruang besar[a]. Sebelumnya, di sana orang biasa menyimpan[b] kurban sajian, kemenyan, berbagai perlengkapan, serta persepuluhan dari biji-bijian, anggur baru, dan minyak—bagian yang ditetapkan bagi orang Lewi, para penyanyi, dan para penjaga pintu[c]—juga persembahan khusus bagi para imam.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah ruang penyimpanan yang besar”. Kata Ibraninya dapat menunjuk pada ruang dalam kompleks Bait Allah yang digunakan untuk menyimpan barang.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dan dahulu di sana mereka biasa menaruh”. Bentuk Ibraninya menyatakan kebiasaan pada masa lampau.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “ketetapan orang Lewi, para penyanyi, dan para penjaga pintu”; dalam konteks ini tampaknya yang dimaksud ialah bagian yang menurut ketetapan diperuntukkan bagi mereka.
    reason: source_ambiguity
  - marker: d
    text: Atau “persembahan khusus para imam”. Istilah Ibraninya menunjuk pada bagian yang dipisahkan sebagai persembahan dan secara tradisional juga diterjemahkan “persembahan unjukan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: Ia menyediakan baginya
  rationale: Dalam konteks penataan ruang, עשה dengan ל dapat berarti membuat atau menyiapkan bagi seseorang. “Menyediakan” menyampaikan tindakan konkret secara alami tanpa menentukan apakah ruang itu baru dibangun atau ruang yang ada dialihfungsikan.
- source_word: לִשְׁכָּה גְדוֹלָה
  choice: sebuah ruang besar
  rationale: לִשְׁכָּה adalah ruang atau kamar dalam kompleks Bait Allah, sering kali dipakai sebagai tempat penyimpanan. “Ruang” jelas dan wajar dalam bahasa Indonesia modern, sedangkan fungsi gudangnya dijelaskan dalam catatan.
- source_word: וְשָׁם הָיוּ לְפָנִים נֹתְנִים
  choice: Sebelumnya, di sana orang biasa menyimpan
  rationale: היה dengan partisip menyatakan kebiasaan pada masa lampau, dan לְפָנִים berarti dahulu atau sebelumnya. “Orang biasa menyimpan” menangkap tindakan berulang tanpa menentukan pelaku yang tidak disebutkan.
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam konteks ibadah Bait Allah, מִנְחָה menunjuk pada persembahan berbahan hasil bumi, lazimnya biji-bijian. “Kurban sajian” mempertahankan istilah kultis dan tidak menyempitkannya menjadi sekadar pemberian umum.
- source_word: הַלְּבוֹנָה
  choice: kemenyan
  rationale: לְבוֹנָה secara khusus menunjuk pada kemenyan yang digunakan dalam ibadah dan persembahan.
- source_word: הַכֵּלִים
  choice: berbagai perlengkapan
  rationale: כֵּלִים dapat berarti bejana, perkakas, atau barang perlengkapan. Dalam konteks Bait Allah, “berbagai perlengkapan” cukup luas untuk mempertahankan cakupan istilah sumber.
- source_word: מַעְשַׂר הַדָּגָן הַתִּירוֹשׁ וְהַיִּצְהָר
  choice: persepuluhan dari biji-bijian, anggur baru, dan minyak
  rationale: מַעְשַׂר adalah bagian sepersepuluh; דָּגָן adalah hasil biji-bijian, תִּירוֹשׁ anggur baru, dan יִצְהָר minyak, biasanya minyak zaitun. Terjemahan ini mempertahankan triad hasil pertanian tanpa menambahkan jenis minyak yang tidak disebutkan.
- source_word: מִצְוַת הַלְוִיִּם וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: bagian yang ditetapkan bagi orang Lewi, para penyanyi, dan para penjaga pintu
  rationale: Secara harfiah konstruksi ini berbunyi “ketetapan/perintah orang Lewi ...”, tetapi dalam daftar persediaan maksudnya paling mungkin bagian yang menurut ketetapan diperuntukkan bagi kelompok-kelompok tersebut. “Bagian yang ditetapkan” membuat elipsis itu dapat dipahami tanpa mengubahnya menjadi beberapa bagian terpisah.
- source_word: תְרוּמַת הַכֹּהֲנִים
  choice: persembahan khusus bagi para imam
  rationale: תְּרוּמָה adalah sesuatu yang dipisahkan dan diserahkan sebagai persembahan atau sumbangan. “Persembahan khusus” dapat dipahami pembaca modern dan menjaga konteks ibadah; hubungan genitifnya dipahami sebagai peruntukan bagi para imam.
theological_decisions:
- issue: Hubungan מִצְוַת dengan orang Lewi, penyanyi, dan penjaga pintu
  choice: bagian yang ditetapkan bagi kelompok-kelompok itu
  alternative: ketetapan mengenai kelompok-kelompok itu
  rationale: Konteks daftar bahan yang disimpan mendukung pengertian bagian persediaan yang diwajibkan bagi para pelayan Bait Allah. Namun, bentuk harfiahnya tetap dicatat agar elipsis bahasa Ibrani tidak disembunyikan.
- issue: Hubungan תְרוּמַת dengan para imam
  choice: persembahan khusus bagi para imam
  alternative: persembahan khusus para imam
  rationale: Konteks pembagian persediaan mendukung makna peruntukan bagi imam, tetapi konstruksi Ibrani secara bentuk dapat juga dibaca sebagai persembahan yang dikaitkan atau dimiliki oleh para imam. Catatan mempertahankan kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat, dengan susunan kalimat yang mudah diikuti. Istilah ibadah seperti “kurban sajian”, “persepuluhan”, dan “persembahan khusus” dipertahankan karena penting bagi konteks Bait Allah, sedangkan istilah arsitektural dan perlengkapan dibuat lebih umum agar tetap jelas bagi pembaca masa kini.
