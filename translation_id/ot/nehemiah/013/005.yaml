  terminology: “Kurban sajian” sesuai konteks kultis מִנְחָה; “kemenyan” adalah padanan Indonesia yang lazim untuk לְבוֹנָה; “persepuluhan” tepat untuk מַעְשֵׂר; dan “persembahan khusus” merupakan padanan yang dapat dipahami untuk תְּרוּמָה. Catatan a–d ditempatkan pada unsur yang relevan dan menjelaskan alternatif tanpa memasukkan penafsiran denominasi.
