  text: And it displeased me greatly[b][a], and I threw all the household goods of Tobiah out of the chamber.
translation:
  language: id
  text: Hal itu sangat tidak menyenangkan bagiku, lalu aku melemparkan semua barang milik Tobia[a] ke luar dari bilik itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua perkakas dari rumah Tobia.” Istilah Ibrani yang dipakai dapat berarti barang, perkakas, perlengkapan, perabot, atau bejana.
    reason: lexical_alternative
  - marker: b
    text: Bilik tersebut adalah sebuah ruang dalam kompleks Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרַע לִי מְאֹד
  choice: Hal itu sangat tidak menyenangkan bagiku
  rationale: Mempertahankan konstruksi impersonal idiom Ibrani, yakni sesuatu dipandang sangat buruk atau tidak menyenangkan oleh Nehemia, tanpa mempersempitnya menjadi emosi tertentu seperti sedih atau marah.
- source_word: וָאַשְׁלִיכָה
  choice: aku melemparkan
  rationale: Menyampaikan tindakan yang tegas dan kuat dari verba Hifil שלך dengan bahasa Indonesia modern.
- source_word: כָּל
  choice: semua
  rationale: Mewakili cakupan menyeluruh kata Ibrani.
- source_word: כְּלֵי בֵית טוֹבִיָּה
  choice: semua barang milik keluarga Tobia
  rationale: כְּלִי dapat menunjuk pada barang, perkakas, perabot, atau perlengkapan. Dalam konteks ini, 'barang milik keluarga Tobia' alami dan cukup luas, sekaligus mempertahankan unsur בֵית yang dapat berarti rumah atau keluarga.
- source_word: הַחוּץ מִן הַלִּשְׁכָּה
  choice: ke luar dari bilik itu
  rationale: Mengungkapkan gerakan keluar dengan alami; 'bilik' mempertahankan nuansa ruang khusus dalam kompleks Bait Allah.
theological_decisions: []
translation_notes:
