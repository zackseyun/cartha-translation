  yaml_path: translation/ot/nehemiah/005/001.yaml
  text: There arose a great outcry from the people and their wives against their Jewish brothers[a].
translation:
  language: id
  text: Lalu timbullah keluhan keras dari rakyat dan istri-istri mereka terhadap saudara-saudara mereka, sesama orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesama orang Yudea.” Istilah Ibrani ini dapat merujuk kepada orang Yahudi atau orang Yudea, bergantung pada apakah yang ditekankan ialah identitas etnis-komunal atau kewilayahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: Lalu timbullah
  rationale: Bentuk wayyiqtol memperkenalkan perkembangan baru dalam alur cerita. “Lalu” menghubungkannya dengan narasi sebelumnya, sedangkan “timbullah” menyatakan munculnya suatu keadaan secara alami dalam bahasa Indonesia.
- source_word: צַעֲקַת
  choice: keluhan keras
  rationale: Kata ini menunjuk pada seruan karena kesusahan atau protes. “Keluhan keras” menyampaikan penderitaan sekaligus sifat protesnya tanpa membatasi makna pada teriakan harfiah.
- source_word: הָעָם
  choice: rakyat
  rationale: Istilah ini menunjuk secara umum kepada orang banyak dalam komunitas itu. “Rakyat” alami dalam konteks sosial ini tanpa menambahkan penentuan kelas yang tidak dinyatakan secara eksplisit.
- source_word: וּנְשֵׁיהֶם
  choice: dan istri-istri mereka
  rationale: Bentuk jamak berkonstruksi dengan sufiks ini paling wajar berarti “istri-istri mereka” dan mempertahankan penyebutan perempuan secara eksplisit sebagai pihak yang turut menyampaikan keluhan.
- source_word: גְּדוֹלָה
  choice: keras
  rationale: Kata sifat ini menyatakan besarnya atau kuatnya keluhan. Dalam kolokasi bahasa Indonesia, “keluhan keras” lebih alami daripada “keluhan besar” dan tetap menyampaikan intensitasnya.
- source_word: אֶל
  choice: terhadap
  rationale: Walaupun secara dasar berarti “kepada/ke arah,” dalam konteks pengaduan kata ini menandai sasaran protes. “Terhadap” menyampaikan fungsi tersebut tanpa membuatnya lebih bermusuhan daripada teks sumber.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Terjemahan ini mempertahankan gambaran kekerabatan yang dinyatakan teks Ibrani dan menonjolkan solidaritas komunitas yang justru dilanggar.
- source_word: הַיְּהוּדִים
  choice: sesama orang Yahudi
  rationale: Istilah ini mengidentifikasi saudara-saudara tersebut sebagai anggota komunitas Yahudi. “Sesama” membuat hubungan atributifnya jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan identitas dalam istilah יְהוּדִים
  choice: orang Yahudi
  alternative: orang Yudea
  rationale: Dalam konteks ini, “orang Yahudi” dengan baik menyampaikan identitas etnis-komunal dari kelompok perjanjian itu. Karena istilah Ibrani juga dapat menekankan asal atau identitas wilayah Yudea, kemungkinan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kemunculan keluhan sebagai perkembangan baru dalam narasi, menyebut para istri secara eksplisit, serta mempertahankan bahasa kekerabatan tanpa mengaburkan ketegangan sosial dalam ayat.
