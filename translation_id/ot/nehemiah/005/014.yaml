  to: Selain itu, sejak hari ketika ia mengangkat aku menjadi gubernur mereka di tanah Yehuda, dari tahun kedua puluh sampai tahun ketiga puluh dua pemerintahan Raja Artahsasta—dua belas tahun lamanya—aku dan saudara-saudaraku tidak memakan jatah makanan yang menjadi hak gubernur.[a]
