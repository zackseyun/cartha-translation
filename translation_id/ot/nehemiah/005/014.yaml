    rationale: Dalam bahasa Indonesia, genitif ini dapat dipahami sebagai jatah yang berasal dari gubernur. Penambahan "yang menjadi hak" memperjelas fungsi administratif yang dimaksud tanpa meniadakan citra makan dalam verba utama.
