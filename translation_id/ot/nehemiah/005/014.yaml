  naturalness: '"Sejak hari ketika ia mengangkat aku" lebih lancar dan lengkap daripada "sejak hari ia mengangkat aku." "Jatah makanan yang menjadi hak gubernur" menghilangkan ambiguitas frasa "jatah makanan gubernur" dalam bahasa Indonesia, yang dapat terbaca sebagai jatah makanan yang diberikan oleh gubernur.'
  terminology: '"Gubernur," "tanah Yehuda," "Raja Artahsasta," dan "saudara-saudaraku" sesuai dengan register Alkitab bahasa Indonesia yang baku. Catatan kaki secara tepat menjelaskan bahwa "roti gubernur" adalah idiom untuk perbekalan atau tunjangan yang lazim menjadi hak gubernur.'
