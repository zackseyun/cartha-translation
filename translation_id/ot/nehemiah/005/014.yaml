id: NEH.5.14
reference: Nehemiah 5:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: id
  text: Selain itu, sejak hari ketika ia mengangkat aku menjadi gubernur mereka di tanah Yehuda, dari tahun kedua puluh sampai tahun ketiga puluh dua pemerintahan Raja Artahsasta—dua belas tahun lamanya—aku dan saudara-saudaraku tidak memakan jatah makanan yang menjadi hak gubernur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti gubernur,” yakni makanan atau perbekalan yang biasanya menjadi hak gubernur.
    reason: Menjelaskan ungkapan administratif לֶחֶם הַפֶּחָה dan mempertahankan arti harfiahnya sebagai alternatif.
lexical_decisions:
- source_word: גַּם
  choice: Selain itu
  rationale: Menandai tambahan pada pembelaan Nehemia dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya aditifnya.
- source_word: מִיּוֹם אֲשֶׁר
  choice: sejak hari
  rationale: Menunjukkan titik awal suatu masa yang berlanjut; bentuk ini alami dalam bahasa Indonesia dan dekat dengan idiom Ibrani.
- source_word: צִוָּה אֹתִי לִהְיוֹת פֶּחָם
  choice: ia mengangkat aku menjadi gubernur
  rationale: Dalam konteks jabatan pemerintahan, צִוָּה menunjuk pada penugasan atau pengangkatan resmi. Gelar Persia פֶּחָה diterjemahkan dengan istilah Indonesia yang lazim, 'gubernur'.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: di tanah Yehuda
  rationale: Mempertahankan sebutan geografis ארץ secara langsung tanpa menafsirkannya sebagai istilah administratif 'provinsi'.
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: dari tahun kedua puluh sampai tahun ketiga puluh dua pemerintahan Raja Artahsasta
  rationale: Menyampaikan rumus penanggalan berdasarkan tahun pemerintahan raja secara jelas dalam bahasa Indonesia.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: dua belas tahun lamanya
  rationale: Merangkum rentang waktu sebelumnya sebagai keterangan aposisional yang alami.
- source_word: אֲנִי וְאַחַי
  choice: aku dan saudara-saudaraku
  rationale: Mempertahankan arti dasar אַחַי tanpa mempersempitnya menjadi pejabat atau rekan, maupun memperluasnya secara eksplisit menjadi seluruh orang Yahudi.
- source_word: לֶחֶם הַפֶּחָה
  choice: jatah makanan gubernur
  rationale: לֶחֶם secara harfiah berarti roti, tetapi dalam konteks administratif ini menunjuk pada makanan atau perbekalan yang menjadi hak gubernur. 'Jatah makanan' menyampaikan fungsi ungkapan itu dengan jelas.
- source_word: לֹא אָכַלְתִּי
  choice: tidak memakan
  rationale: Mempertahankan verba konkret 'makan' dan menyatakan kebiasaan Nehemia sepanjang masa dua belas tahun tersebut.
theological_decisions:
- issue: Cakupan אַחַי
  choice: saudara-saudaraku
  alternative: rekan-rekanku; sesama orang Yahudi
  rationale: Bentuk Ibraninya secara langsung berarti 'saudara-saudaraku', sedangkan identitas tepat kelompok itu tidak dijelaskan dalam ayat ini. Terjemahan tidak menutup ambiguitas tersebut.
- issue: Makna לֶחֶם הַפֶּחָה
  choice: jatah makanan gubernur
  alternative: roti gubernur; perbekalan gubernur
  rationale: Konteks membahas beban ekonomi yang lazim ditanggung rakyat bagi gubernur. Terjemahan idiomatis ini mempertahankan kaitan dengan makanan sekaligus menjelaskan bahwa yang dimaksud ialah jatah resmi, bukan sekadar roti.
- issue: Subjek pengangkatan dalam צִוָּה אֹתִי
  choice: ia mengangkat aku
  alternative: aku diangkat; raja mengangkat aku
  rationale: Teks memakai subjek orang ketiga tunggal tanpa menyebut namanya dalam klausa ini. 'Ia' mempertahankan rujukan implisit tersebut dan tidak menambahkan kata 'raja' ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'aku' dipakai untuk narasi orang pertama Nehemia; 'Artahsasta' mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Tanda pisah menampilkan ringkasan kronologis tanpa mengubah hubungan sintaksis ayat.
