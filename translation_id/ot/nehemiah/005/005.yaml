language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: id
  text: Sekarang, kami sama seperti saudara-saudara kami, dan anak-anak kami sama seperti anak-anak mereka.[a] Namun lihatlah, kami memperbudak anak-anak laki-laki dan perempuan kami, dan beberapa anak perempuan kami sudah diperbudak. Kami tidak berdaya, sedangkan ladang dan kebun anggur kami menjadi milik orang lain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging kami seperti daging saudara-saudara kami, anak-anak kami seperti anak-anak mereka.” Ungkapan ini menekankan kesamaan kemanusiaan dan kekerabatan mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada kekuatan bagi tangan kami, dan ladang-ladang serta kebun-kebun anggur kami bagi orang lain.” Ungkapan ini menyatakan bahwa mereka tidak mempunyai kuasa atau sarana; ladang dan kebun anggur mereka berada dalam kepemilikan orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: bukankah kami sedarah dengan saudara-saudara kami
  rationale: Ungkapan harfiah tentang 'daging' menyatakan kesamaan asal, kemanusiaan, dan kekerabatan. 'Sedarah' mempertahankan citra tubuh/kerabat dalam bahasa Indonesia yang alami.
- source_word: אַחֵינוּ
  choice: saudara-saudara kami
  rationale: Mempertahankan istilah kekerabatan Ibrani tanpa mempersempitnya menjadi kelompok etnis dalam teks.
- source_word: כִבְנֵיהֶם בָּנֵינוּ
  choice: anak-anak kami sederajat dengan anak-anak mereka
  rationale: בנים dapat mencakup anak-anak secara kolektif. 'Sederajat' menyampaikan maksud perbandingan dalam keluhan sosial ini tanpa meniadakan kesejajaran ungkapan Ibrani.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: terpaksa menyerahkan ... menjadi budak
  rationale: Konteks menunjukkan bahwa kesulitan ekonomi memaksa para orang tua memasukkan anak-anak ke dalam perbudakan utang. Pilihan ini mempertahankan unsur paksaan dan istilah perbudakan secara jelas.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: beberapa anak perempuan kami sudah diperbudak
  rationale: Partisipel pasif menyatakan bahwa sebagian anak perempuan telah dibawa ke dalam keadaan perbudakan; 'sudah diperbudak' mengungkapkan keadaan yang telah terjadi.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: kami tidak berdaya menghentikannya
  rationale: אֵל di sini dipahami sebagai 'daya/kekuatan', bukan nama ilahi. Ungkapan tersebut menyatakan bahwa mereka tidak mempunyai kuasa atau sarana untuk mengubah keadaan.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: sebab ladang dan kebun anggur kami sudah menjadi milik orang lain
  rationale: Klausa nominal menyatakan bahwa harta produktif mereka telah berada dalam kepemilikan orang lain dan secara kontekstual menjelaskan ketidakberdayaan mereka.
theological_decisions:
- issue: Bahasa kekerabatan dalam keluhan tentang ketidakadilan sosial
  choice: Gunakan 'saudara-saudara kami' dan 'anak-anak'
  alternative: Gunakan 'kaum kerabat kami' dan 'anak-anak lelaki'
  rationale: Pilihan ini mempertahankan istilah kekerabatan אַחֵינוּ, sedangkan בנים dalam perbandingan dipahami secara kolektif karena sesudahnya teks menyebut anak lelaki dan perempuan secara eksplisit.
- issue: Kekuatan istilah perbudakan
  choice: Gunakan 'budak' dan 'diperbudak'
  alternative: Gunakan 'hamba' atau 'mengabdi'
  rationale: Ayat ini menggambarkan perbudakan utang yang memaksa anak-anak masuk ke dalam status budak; istilah yang lebih lunak akan mengaburkan beratnya keadaan.
- issue: Hubungan klausa terakhir dengan ketidakberdayaan
  choice: Terjemahkan ו sebagai hubungan penjelas dengan 'sebab'
  alternative: Pertahankan koordinasi sederhana dengan 'dan'
  rationale: Bahasa Ibrani memungkinkan klausa terakhir dipahami sebagai penjelasan praktis mengapa mereka tidak berdaya. Catatan kaki mempertahankan kemungkinan struktur koordinatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Citra kekerabatan dibuat idiomatis melalui 'sedarah', sedangkan realitas perbudakan tidak diperhalus. Penanda catatan kaki ditempatkan langsung dalam teks utama.
