  terminology: “Memperbudak” dan “diperbudak” secara tepat mempertahankan kekuatan istilah perbudakan. “Anak-anak laki-laki dan perempuan” jelas dan sesuai dengan pembedaan eksplisit dalam Ibrani. “Kami tidak berdaya” menerjemahkan idiom ketidakmampuan tanpa menambahkan objek “menghentikannya.”
