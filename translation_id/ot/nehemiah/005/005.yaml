revisions:
- from: Sekarang, bukankah kami sedarah dengan saudara-saudara kami, dan anak-anak kami sederajat dengan anak-anak mereka?[a] Namun, kami terpaksa menyerahkan anak-anak lelaki dan perempuan kami menjadi budak. Bahkan, beberapa anak perempuan kami sudah diperbudak. Kami tidak berdaya menghentikannya,[b] sebab ladang dan kebun anggur kami sudah menjadi milik orang lain.
  to: Sekarang, kami sama seperti saudara-saudara kami, dan anak-anak kami sama seperti anak-anak mereka.[a] Namun lihatlah, kami memperbudak anak-anak laki-laki dan perempuan kami, dan beberapa anak perempuan kami sudah diperbudak. Kami tidak berdaya, sedangkan ladang dan kebun anggur kami menjadi milik orang lain.[b]
  rationale: Revisi menghilangkan pertanyaan retoris dan gagasan “sederajat” yang tidak tersurat, mengembalikan tindakan aktif serta keras dari akar כבשׁ dengan “memperbudak,” dan menerjemahkan idiom ketidakberdayaan tanpa menambahkan objek tindakan. Konjungsi terakhir dibuat nonkausal secara eksplisit, sementara catatan kaki memelihara citra konkret dan susunan Ibrani.
