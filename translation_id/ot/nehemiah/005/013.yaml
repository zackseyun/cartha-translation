  text: גַּם חָצְנִ֣/י נָעַ֗רְתִּי וָֽ/אֹמְרָ֡/ה כָּ֣כָה יְנַעֵ֪ר הָֽ/אֱלֹהִ֟ים אֶת כָּל הָ/אִישׁ֩ אֲשֶׁ֨ר לֹֽא יָקִ֜ים אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה מִ/בֵּית/וֹ֙ וּ/מִ֣/יגִיע֔/וֹ וְ/כָ֛כָה יִהְיֶ֥ה נָע֖וּר וָ/רֵ֑ק וַ/יֹּאמְר֨וּ כָֽל הַ/קָּהָ֜ל אָמֵ֗ן וַֽ/יְהַלְלוּ֙ אֶת יְהוָ֔ה וַ/יַּ֥עַשׂ הָ/עָ֖ם כַּ/דָּבָ֥ר הַ/זֶּֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: id
  text: Aku juga mengibaskan lipatan jubahku[a] dan berkata, “Demikianlah kiranya Allah mengibaskan setiap orang yang tidak menepati janji ini dari rumahnya dan dari hasil jerih payahnya[b]. Demikianlah kiranya ia dikibaskan hingga kosong.” Seluruh umat yang berhimpun berkata, “Amin,” lalu memuji Yahweh. Kemudian rakyat melaksanakan apa yang telah mereka janjikan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian depan jubahku.” Lipatan pakaian ini dapat dipakai untuk membawa barang; tindakan Nehemia melambangkan seseorang yang dikibaskan keluar dan kehilangan miliknya.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dari rumahnya dan dari jerih payahnya.” Kata Ibrani dapat berarti jerih payah itu sendiri atau hasil yang diperoleh darinya.
    reason: lexical_ambiguity
  - marker: c
    text: Secara harfiah, “berbuat sesuai dengan perkataan ini.” Dalam konteks ini, “perkataan” menunjuk pada komitmen yang baru saja mereka ikrarkan.
    reason: contextual_clarification
lexical_decisions:
- source_word: חָצְנִי
  choice: lipatan jubahku
  rationale: חָצֶן menunjuk pada bagian depan atau lipatan pakaian yang dapat dipakai untuk membawa barang. Pilihan ini konkret dan mendukung tindakan simbolis dalam ayat.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: mengibaskan / mengibaskan / dikibaskan
  rationale: Pengulangan akar נער dipertahankan untuk menghubungkan gerakan simbolis Nehemia dengan kutuk yang diucapkannya.
- source_word: כָּכָה
  choice: Demikianlah kiranya
  rationale: Dalam rumusan kutuk yang disertai tindakan simbolis, frasa ini menyatakan harapan atau permohonan, bukan sekadar penjelasan cara.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Bentuk ini merupakan sebutan biasa bagi Allah Israel dalam konteks tersebut.
- source_word: כָּל הָאִישׁ
  choice: setiap orang
  rationale: Bentuk tunggal maskulin Ibrani berfungsi secara representatif. Bahasa Indonesia tidak menuntut penandaan gender pada kata 'orang', sehingga makna distributif sumber tersampaikan tanpa menambahkan pembatasan yang tidak dinyatakan.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: menepati janji ini
  rationale: Dalam konteks ikrar pada ayat sebelumnya, ungkapan ini berarti melaksanakan atau meneguhkan apa yang telah diucapkan. 'Menepati janji' alami dan tepat secara kontekstual.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: dari rumah dan hasil jerih payahnya
  rationale: יְגִיעַ dapat menunjuk pada jerih payah maupun hasil yang diperoleh darinya. Konteks kutuk kehilangan mendukung 'hasil jerih payah', sementara alternatif literal dicatat.
- source_word: וָרֵק
  choice: ditinggalkan tanpa apa-apa
  rationale: רֵק berarti kosong atau tidak berisi. Ungkapan ini mengungkapkan akibat bagi orang yang dikibaskan keluar dengan lebih alami dalam bahasa Indonesia daripada menyebut orang itu 'kosong'.
- source_word: הַקָּהָל
  choice: seluruh umat yang berhimpun
  rationale: קָהָל adalah komunitas yang sedang berkumpul. Pilihan ini alami dan menghindari kesan bahwa yang dimaksud harus berupa organisasi keagamaan tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כַדָּבָר הַזֶּה
  choice: melaksanakan apa yang telah mereka janjikan
  rationale: דָּבָר menunjuk kembali kepada komitmen bersama pada konteks sebelumnya. Bentuk verbal ini alami dalam bahasa Indonesia dan memperjelas tindakan rakyat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung. Transliterasi mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan הָאִישׁ dalam כָּל הָאִישׁ
  choice: setiap orang
  alternative: setiap laki-laki
  rationale: Nomina maskulin tunggal dipakai secara distributif dan representatif. Karena kata 'orang' dalam bahasa Indonesia tidak bergender, pilihan ini mempertahankan cakupan alami ungkapan tanpa menyelesaikan teks menjadi rujukan khusus laki-laki.
- issue: Daya kutuk dalam כָּכָה יְנַעֵר הָאֱלֹהִים
  choice: Demikianlah kiranya Allah mengibaskan
  alternative: Demikianlah Allah akan mengibaskan
  rationale: Bentuk yiqtol dalam tindakan sumpah dapat membawa nuansa imprekasi. 'Kiranya' mempertahankan daya permohonan kutuk tanpa mengubahnya menjadi ramalan pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan citra 'mengibaskan/dikibaskan' sengaja dipertahankan sebagai permainan kata dan tindakan simbolis dalam teks Ibrani; ungkapan 'ditinggalkan tanpa apa-apa' dipakai agar akibat רֵק terdengar alami bagi pembaca umum.
