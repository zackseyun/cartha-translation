    issue: Urutan unsur dalam klausa kutuk kurang jelas
    rationale: Dalam “Allah mengibaskan dari rumah dan hasil jerih payahnya setiap orang,” keterangan sumber daya mendahului objek sehingga pembaca dapat sesaat memahami bahwa Allah mengibaskan sesuatu dari rumah/hasil kerja. Menempatkan “setiap orang” segera sesudah verba mempertahankan relasi sintaksis dan citra tindakan simbolis.
  - severity: low
    issue: “Ditinggalkan tanpa apa-apa” lebih interpretatif daripada predikat “kosong”
    rationale: וָרֵק secara langsung menyatakan keadaan kosong. “Hingga kosong” mempertahankan citra pengibasan dan predikat sumber secara lebih ringkas, sambil tetap idiomatis.
