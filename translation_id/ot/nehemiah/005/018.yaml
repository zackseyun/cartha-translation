  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: id
  text: Yang disiapkan untuk setiap hari ialah seekor lembu, enam ekor domba pilihan, dan burung-burung pun disiapkan untukku. Setiap sepuluh hari juga disediakan berbagai jenis anggur secara melimpah. Meskipun demikian, aku tidak menuntut jatah makanan gubernur[a], sebab pekerjaan itu berat bagi rakyat ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti gubernur”; mungkin berarti perbekalan atau jatah makanan resmi yang menjadi hak gubernur.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “sebab pekerjaan itu menjadi beban berat bagi rakyat ini.” Kata Ibrani yang dipakai dapat berarti pekerjaan, pelayanan, atau beban kerja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: Yang disiapkan untuk setiap hari
  rationale: Bentuk pasif נַעֲשֶׂה dalam konteks makanan berarti 'disiapkan'; לְיוֹם אֶחָד menyatakan jumlah yang disediakan setiap hari.
- source_word: שׁוֹר אֶחָד
  choice: seekor lembu
  rationale: שׁוֹר menunjuk hewan sapi; 'lembu' wajar dalam konteks ternak untuk konsumsi tanpa mempersempitnya menjadi sapi jantan tertentu.
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: enam ekor domba pilihan
  rationale: צֹאן adalah ternak kecil dan dalam konteks jamuan paling alami dipahami sebagai domba; בְּרֻרוֹת berarti yang dipilih atau bermutu baik.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: dan burung-burung untukku
  rationale: Kata kerja 'disiapkan' pada awal kalimat secara alami mencakup unsur ini juga; צִפֳּרִים dipertahankan secara luas sebagai 'burung-burung' tanpa menentukan jenisnya.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: Setiap sepuluh hari
  rationale: Ungkapan ini menunjukkan selang waktu yang berulang, bukan sekadar rentang sepuluh hari.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: berbagai jenis anggur dengan berlimpah
  rationale: Terjemahan ini mempertahankan cakupan בְּכָל dan jumlah besar yang dinyatakan לְהַרְבֵּה; 'anggur' di sini berarti minuman anggur sesuai יַיִן.
- source_word: לֶחֶם הַפֶּחָה
  choice: jatah makanan gubernur
  rationale: Secara harfiah 'roti gubernur', tetapi לֶחֶם dapat mewakili makanan atau perbekalan; konteks jabatan mendukung arti jatah resmi gubernur.
- source_word: לֹא בִקַּשְׁתִּי
  choice: aku tidak menuntut
  rationale: בקשׁ dapat berarti meminta atau mencari; dalam konteks hak resmi yang sengaja tidak diambil, 'tidak menuntut' menyampaikan bahwa Nehemia melepaskan klaimnya.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: sebab pekerjaan yang dibebankan kepada rakyat ini sudah berat
  rationale: עֲבֹדָה dapat berarti pekerjaan, kerja, atau pelayanan; konstruksi dengan 'atas rakyat' menunjukkan beban pekerjaan yang harus mereka tanggung. 'Sudah berat' mengungkapkan keadaan yang sedang berlaku tanpa menambah sebab baru.
theological_decisions:
- issue: Nuansa sosial-ekonomi dari penolakan Nehemia atas tunjangan resmi
  choice: Nehemia tidak menuntut jatah makanan yang melekat pada jabatan gubernur karena rakyat telah menanggung pekerjaan yang berat.
  alternative: Nehemia hanya tidak meminta roti gubernur, atau secara khusus menolak suatu pajak tertentu.
  rationale: Konteks mendukung adanya perbekalan resmi, tetapi teks tidak secara eksplisit menyebut pajak. Terjemahan ini mempertahankan kepedulian Nehemia terhadap beban rakyat tanpa menambahkan mekanisme pungutan yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah untuk kelancaran tanpa mengubah urutan gagasan. Pronomina 'aku' mengikuti suara orang pertama Nehemia; istilah 'rakyat ini' mempertahankan bentuk kolektif sumber.
