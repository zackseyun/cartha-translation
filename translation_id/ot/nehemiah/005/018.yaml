  to: Yang disiapkan untuk setiap hari ialah seekor lembu, enam ekor domba pilihan, dan burung-burung pun disiapkan untukku. Setiap sepuluh hari juga disediakan berbagai jenis anggur secara melimpah. Meskipun demikian, aku tidak menuntut jatah makanan gubernur[a], sebab pekerjaan itu berat bagi rakyat ini[b].
