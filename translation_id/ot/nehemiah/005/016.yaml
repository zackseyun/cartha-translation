base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: id
  text: Aku juga melibatkan diri dalam pekerjaan pada tembok ini,[a] dan kami tidak membeli ladang apa pun. Semua anak buahku[b] berkumpul di sana untuk pekerjaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku berpegang pada pekerjaan pada tembok ini,” yakni aku sendiri terlibat dalam pekerjaan itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang mudaku”, “para pelayanku”, atau “para pengiringku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Aku sendiri juga
  rationale: Kata “juga” mempertahankan daya aditif גַּם dan menghubungkan pernyataan ini dengan konteks sebelumnya; “sendiri” menegaskan keterlibatan pribadi yang tersirat oleh verba orang pertama berikutnya.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: untuk pekerjaan pembangunan tembok ini
  rationale: מְלָאכָה berarti pekerjaan atau tugas. Dalam konteks Nehemia, ungkapan alami dalam bahasa Indonesia ialah pekerjaan pembangunan tembok, tanpa menambahkan bahwa itu tembok kota meskipun konteks menunjukkannya.
- source_word: הֶחֱזַקְתִּי
  choice: mencurahkan tenaga
  rationale: Bentuk hifil חזק di sini menyatakan bahwa Nehemia berpegang teguh pada atau sungguh-sungguh melibatkan diri dalam pekerjaan. “Mencurahkan tenaga” menyampaikan keterlibatan aktif itu secara alami tanpa menyiratkan bahwa ia seorang diri memperkuat tembok.
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: dan kami tidak membeli ladang apa pun
  rationale: Verba קָנִינוּ adalah orang pertama jamak, sehingga “kami” dipertahankan dan tidak diselaraskan menjadi “aku”. שָׂדֶה berbentuk tunggal tetapi dalam kalimat negatif dapat diterjemahkan secara idiomatis sebagai “ladang apa pun”.
- source_word: נְעָרַי
  choice: anak buahku
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pengiring. Dalam konteks ini kata tersebut menunjuk kepada orang-orang yang berada di bawah pimpinan Nehemia; “anak buahku” wajar dalam bahasa Indonesia dan tidak menetapkan status mereka secara terlalu khusus.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: berkumpul di sana untuk mengerjakan pekerjaan itu
  rationale: Partisipel pasif קְבוּצִים menyatakan keadaan berkumpul, שָׁם dipertahankan sebagai “di sana”, dan עַל הַמְּלָאכָה menyatakan keterlibatan atau penugasan dalam pekerjaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Penanda catatan [b] ditempatkan sesudah “anak buahku”, karena catatan itu menerangkan נְעָרַי, bukan frasa tentang pembelian ladang.
