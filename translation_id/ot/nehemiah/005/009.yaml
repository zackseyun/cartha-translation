  text: ו/יאמר לֹא ט֥וֹב הַ/דָּבָ֖ר אֲשֶׁר אַתֶּ֣ם עֹשִׂ֑ים הֲ/ל֞וֹא בְּ/יִרְאַ֤ת אֱלֹהֵ֨י/נוּ֙ תֵּלֵ֔כוּ מֵ/חֶרְפַּ֖ת הַ/גּוֹיִ֥ם אוֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: id
  text: Lalu aku berkata, “Apa yang kalian lakukan itu tidak baik. Bukankah seharusnya kalian hidup dengan takut akan Allah kita karena celaan bangsa-bangsa, musuh-musuh kita?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk menghindari celaan bangsa-bangsa, musuh-musuh kita.” Preposisi Ibrani dapat dipahami sebagai menyatakan alasan atau tujuan penghindaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu aku berkata
  rationale: Waw konsekutif melanjutkan alur narasi; “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: לֹא טוֹב
  choice: tidak baik
  rationale: Mempertahankan penilaian moral langsung dalam bahasa Ibrani tanpa mempersempitnya menjadi sekadar “tidak benar” atau “tidak patut”.
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Apa yang kalian lakukan itu
  rationale: Mengungkapkan konstruksi nominal Ibrani secara wajar dan langsung, dengan “itu” yang menegaskan perilaku yang sedang ditegur.
- source_word: הֲלוֹא
  choice: Bukankah seharusnya
  rationale: Menangkap bentuk pertanyaan retoris sekaligus daya desakan moralnya.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: dengan takut akan Allah kita
  rationale: “Takut akan Allah” mempertahankan ungkapan teologis Ibrani tentang rasa gentar dan hormat kepada Allah; “dengan” menghasilkan hubungan yang alami dengan cara hidup.
- source_word: תֵּלֵכוּ
  choice: kalian hidup
  rationale: Kata kerja harfiah “berjalan” berfungsi sebagai metafora bagi perilaku atau cara hidup. “Hidup” menyampaikan maksud etisnya dengan jelas dalam bahasa Indonesia modern.
- source_word: מֵחֶרְפַּת
  choice: karena celaan
  rationale: Preposisi מִן dapat menyatakan alasan atau motivasi dalam konteks ini. “Celaan” mempertahankan unsur penghinaan publik dalam חֶרְפָּה, sementara kemungkinan makna tujuan penghindaran dicatat dalam catatan kaki.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: bangsa-bangsa, musuh-musuh kita
  rationale: “Bangsa-bangsa” sesuai dengan konteks bangsa-bangsa asing di sekitar Yehuda, dan aposisi “musuh-musuh kita” dipertahankan.
theological_decisions:
- issue: Metafora etis הלך dalam konteks takut akan Allah
  choice: Diterjemahkan “hidup” untuk menyatakan cara berperilaku
  alternative: berjalan
  rationale: Dalam bahasa Indonesia, “berjalan dengan takut akan Allah” dapat terdengar tidak alami atau mengacu pada gerak fisik. “Hidup” menyampaikan fungsi etis metafora tersebut tanpa mengurangi panggilan untuk berperilaku dalam takut akan Allah.
- issue: Hubungan מִן dengan celaan bangsa-bangsa
  choice: karena celaan bangsa-bangsa
  alternative: untuk menghindari celaan bangsa-bangsa
  rationale: Bentuk Ibrani memungkinkan nuansa sebab atau motivasi maupun tujuan penghindaran. Teks utama mempertahankan ungkapan yang lebih dekat dengan bentuk sumber, sedangkan alternatif yang lebih eksplisit dicatat tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak “kalian” memperjelas bahwa teguran ditujukan kepada sekelompok orang. Ungkapan “takut akan Allah” dipertahankan karena merupakan idiom teologis penting dan tetap mudah dipahami.
