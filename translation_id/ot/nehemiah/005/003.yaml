  text: And there were others who said[a], “We are mortgaging our fields, our vineyards, and our houses to get grain during the famine.”
translation:
  language: id
  text: Ada juga yang berkata, “Kami menjaminkan[a] ladang, kebun anggur, dan rumah kami agar kami memperoleh biji-bijian selama masa kelaparan.”
