lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Ada juga yang berkata
  rationale: Ungkapan ini memperkenalkan kelompok lain dalam rangkaian keluhan. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan fungsi wacananya.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: ladang, kebun anggur, dan rumah kami
  rationale: Ketiga istilah konkret mengenai harta milik dipertahankan; akhiran kepunyaan bersama secara alami ditempatkan pada akhir rangkaian dalam bahasa Indonesia.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: Kami menggadaikan
  rationale: Dalam konteks ini, bentuk partisip tersebut menyatakan penyerahan harta sebagai jaminan utang. 'Menggadaikan' menyampaikan makna ekonominya dengan jelas dan wajar.
- source_word: וְנִקְחָה
  choice: untuk memperoleh
  rationale: Bentuk ini menyatakan tujuan dari tindakan menggadaikan harta. 'Memperoleh' mempertahankan arti umum mengambil atau mendapatkan tanpa menambahkan gagasan membeli yang tidak dinyatakan oleh verba Ibrani.
- source_word: דָגָן
  choice: gandum
  rationale: דָגָן menunjuk pada hasil biji-bijian. Dalam konteks kebutuhan pangan di dunia Alkitab, 'gandum' merupakan ungkapan Indonesia yang konkret dan mudah dipahami, meskipun istilah sumber dapat mencakup biji-bijian secara lebih luas.
- source_word: בָּרָעָב
  choice: pada masa kelaparan
  rationale: Frasa ini menyatakan keadaan atau masa ketika mereka membutuhkan gandum, tanpa memaksakan hubungan sebab yang lebih tegas daripada teks sumber.
