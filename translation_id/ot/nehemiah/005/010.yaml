  text: וְ/גַם אֲנִי֙ אַחַ֣/י וּ/נְעָרַ֔/י נֹשִׁ֥ים בָּ/הֶ֖ם כֶּ֣סֶף וְ/דָגָ֑ן נַֽעַזְבָה נָּ֖א אֶת הַ/מַּשָּׁ֥א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: id
  text: Aku juga, saudara-saudaraku dan para pelayanku[a], memberi mereka pinjaman berupa uang dan biji-bijian. Mari kita hentikan beban ini[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang mudaku”; dalam konteks ini dapat juga berarti para pelayan atau pengiringku.
    reason: lexical_alternative
  - marker: b
    text: Atau “tuntutan ini” atau “utang ini.” Secara harfiah, “beban ini”; istilah Ibrani ini dalam konteks dapat menunjuk beban atau tuntutan finansial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Aku pun
  rationale: Menjaga daya aditif dan penekanan וְגַם, sambil menghasilkan ungkapan Indonesia yang wajar.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Mempertahankan istilah kekerabatan Ibrani dan nuansa solidaritasnya tanpa mempersempitnya menjadi kerabat sedarah saja.
- source_word: וּנְעָרַי
  choice: para pelayanku
  rationale: Dalam konteks rumah tangga dan rombongan Nehemia, נְעָרִים paling mungkin menunjuk para pelayan atau pembantunya; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: נֹשִׁים בָּהֶם
  choice: memberi mereka pinjaman
  rationale: Mengungkapkan tindakan sebagai kreditur dalam bahasa Indonesia yang alami. Nuansa menagih atau bertindak sebagai kreditur tetap tercermin dalam seruan pada klausa berikutnya.
- source_word: כֶּסֶף וְדָגָן
  choice: uang dan gandum
  rationale: Dalam konteks pinjaman, כֶּסֶף berarti uang, bukan sekadar bahan perak; דָגָן menunjuk gandum atau hasil biji-bijian.
- source_word: נַעַזְבָה נָּא
  choice: Marilah kita berhenti
  rationale: Bentuk kohortatif dengan נָא menyampaikan ajakan atau permohonan agar praktik itu dihentikan.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: penagihan ini
  rationale: Dalam konteks utang, מַשָּׁא menunjuk beban atau tuntutan finansial yang dikenakan kepada rakyat. 'Penagihan' menyampaikan tindakan kreditur tanpa menentukan secara berlebihan apakah yang dimaksud pokok utang atau bunga.
theological_decisions:
- issue: Cakupan seruan untuk menghentikan הַמַּשָּׁא
  choice: penagihan ini
  alternative: beban ini; utang ini; pemungutan bunga ini
  rationale: Ayat ini mengecam praktik finansial yang menindas, tetapi istilah Ibraninya sendiri tidak secara tegas membatasi seruan itu hanya pada bunga ataupun pada seluruh pokok utang. Terjemahan mempertahankan keluasan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “Aku pun, bersama ...” mempertahankan penekanan pada keterlibatan Nehemia sekaligus menghindari ketidakselarasan subjek-predikat dalam bahasa Indonesia. Istilah ekonomi dibuat mudah dipahami tanpa menghapus ambiguitas istilah Ibrani.
