translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Sapaan “engkau” dipakai untuk ujaran langsung tunggal, dan istilah sumpah dipertahankan karena merupakan tindakan hukum-publik dalam konteks ini.
