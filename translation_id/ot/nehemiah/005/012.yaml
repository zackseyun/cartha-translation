  text: וַ/יֹּאמְר֣וּ נָשִׁ֗יב וּ/מֵ/הֶם֙ לֹ֣א נְבַקֵּ֔שׁ כֵּ֣ן נַעֲשֶׂ֔ה כַּ/אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר וָ/אֶקְרָא֙ אֶת הַ/כֹּ֣הֲנִ֔ים וָֽ/אַשְׁבִּיעֵ֔/ם לַ/עֲשׂ֖וֹת כַּ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: id
  text: Mereka berkata, “Kami akan mengembalikannya dan tidak akan menuntut apa pun dari mereka. Kami akan melakukannya seperti yang engkau katakan.” Lalu aku memanggil para imam dan membuat mereka bersumpah untuk bertindak sesuai dengan perkataan ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan perkara ini” atau “sesuai dengan janji ini.” Kata Ibrani דָּבָר dapat berarti “perkataan,” “perkara,” atau, dalam konteks ini, komitmen yang diikrarkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: kami akan mengembalikannya
  rationale: Bentuk Hifil dari שׁוב menyatakan pengembalian milik yang sebelumnya diambil atau dituntut. Akhiran “-nya” melengkapi objek tersirat dari konteks ayat sebelumnya.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: tidak akan menuntut apa pun dari mereka
  rationale: Dalam konteks ekonomi dan hukum ini, בקש berarti menuntut atau meminta pembayaran, bukan sekadar mencari.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: Kami akan melakukan seperti yang engkau katakan
  rationale: Terjemahan ini menyampaikan persetujuan tegas untuk melaksanakan tuntutan Nehemia dengan bahasa Indonesia yang alami dan tetap dekat dengan susunan Ibrani.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: Lalu aku memanggil para imam
  rationale: קרא dengan objek langsung berarti memanggil atau menghadirkan; “lalu” mencerminkan urutan naratif.
- source_word: וָאַשְׁבִּיעֵם
  choice: menyuruh orang-orang tadi bersumpah
  rationale: Bentuk Hifil dari שבע berarti membuat atau menyuruh seseorang bersumpah. “Orang-orang tadi” memperjelas bahwa pronomina paling wajar menunjuk kepada para pemuka dan pejabat yang baru saja berjanji, bukan kepada para imam yang dipanggil untuk pelaksanaan sumpah.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: untuk bertindak sesuai dengan perkataan ini
  rationale: דָּבָר dapat berarti perkataan, perkara, atau komitmen. “Perkataan ini” menjaga bentuk sumber tanpa menutup kemungkinan bahwa yang dimaksud ialah janji yang baru diucapkan.
