  verdict: revise
  source_fidelity: Terjemahan secara umum setia pada Ibrani. Namun, “orang-orang tadi” secara interpretatif menetapkan rujukan akhiran -ם dalam וָאַשְׁבִּיעֵם kepada para pemuka/pejabat. Rujukan ini tidak dinyatakan secara eksplisit dan dapat diperdebatkan mengingat para imam baru saja disebut. Terjemahan perlu mempertahankan ketaksaan itu.
  naturalness: Bahasa Indonesia baku, lugas, dan cocok untuk narasi. “Kami akan melakukannya seperti yang engkau katakan” lebih lengkap dan alami daripada “Kami akan melakukan seperti yang engkau katakan.” “Membuat mereka bersumpah” merupakan padanan yang wajar untuk Hifil שבע serta tidak memaksakan identitas mereka.
  terminology: “Mengembalikannya,” “menuntut apa pun,” “para imam,” “bersumpah,” dan “perkataan ini” sesuai konteks dan register. Catatan kaki secara tepat menyajikan kemungkinan leksikal bagi דָּבָר tanpa menjadikan “janji” sebagai satu-satunya arti.
