  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: id
  text: Ingatlah aku, ya Allahku, dengan kebaikan, karena segala yang telah kulakukan bagi bangsa ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Ingatlah aku
  rationale: Permohonan doa dari akar זכר dengan לִי secara idiomatis berarti meminta Allah mengingat si pembicara; bentuk imperatif dipertahankan secara alami dalam bahasa Indonesia.
- source_word: אֱלֹהַי
  choice: ya Allahku
  rationale: Bentuk dengan sufiks orang pertama tunggal berfungsi sebagai sapaan langsung. Partikel “ya” menandai vokatif secara wajar dan khidmat.
- source_word: לְטוֹבָה
  choice: demi kebaikanku
  rationale: Ungkapan ini menunjuk pada ingatan ilahi yang menghasilkan kebaikan atau perkenanan bagi Nehemia. “Demi kebaikanku” alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan makna adverbial “dengan kemurahan”.
- source_word: כֹּל אֲשֶׁר
  choice: segala yang
  rationale: Mewakili konstruksi relatif yang berarti seluruh hal atau tindakan yang dimaksud.
- source_word: עָשִׂיתִי
  choice: telah kulakukan
  rationale: Bentuk perfek Ibrani merujuk pada tindakan lampau yang kini menjadi dasar permohonan; “telah” menyampaikan tinjauan retrospektif itu.
- source_word: עַל
  choice: bagi
  rationale: Dalam konteks tindakan terhadap umat, עַל menyatakan tindakan yang dilakukan untuk kepentingan atau demi mereka.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם adalah kelompok kolektif. Dalam konteks umat Yehuda, “bangsa ini” lebih alami daripada “rakyat ini” dan tetap mempertahankan bentuk tunggal kolektif serta demonstratif.
theological_decisions:
- issue: Sifat permohonan Nehemia agar Allah mengingatnya
  choice: Permohonan agar Allah mengingat Nehemia demi kebaikannya berdasarkan tindakannya bagi bangsa itu
  alternative: Permohonan pembenaran di depan umum atau pernyataan bahwa perbuatannya menghasilkan jasa di hadapan Allah
  rationale: Teks mengaitkan permohonan akan ingatan ilahi yang baik dengan tindakan Nehemia, tetapi tidak menjelaskan apakah hal itu merupakan jasa, belas kasihan, atau pembenaran publik. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Bentuk terikat “kulakukan” mempertahankan nada personal doa tanpa terasa kuno; “ya Allahku” menandai sapaan langsung.
