    rationale: '"Kemurahan" dapat menyiratkan belas kasihan, sedangkan istilah sumber lebih luas: kebaikan atau perkenanan/favorabilitas. Alternatif "dengan berkenan" lebih dekat tanpa memasukkan nuansa belas kasihan.'
