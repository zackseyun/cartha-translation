    rationale: “Setelah mempertimbangkannya” dapat dipahami dari konteks, tetapi teks sumber hanya menyatakan deliberasi internal sebelum tindakan berikutnya. “Aku mempertimbangkan dalam hati” lebih dekat dan tetap alami.
