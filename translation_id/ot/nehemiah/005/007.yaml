  to: Aku mempertimbangkan dalam hati[a], lalu aku mengajukan perkara terhadap para bangsawan dan para pejabat. Aku berkata kepada mereka, “Kalian masing-masing memungut bunga[b] dari saudara kalian sendiri.” Lalu aku menghimpun suatu sidang besar untuk menghadapi mereka.[c]
