base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: id
  text: Aku mempertimbangkan dalam hati[a], lalu aku mengajukan perkara terhadap para bangsawan dan para pejabat. Aku berkata kepada mereka, “Kalian masing-masing memungut bunga[b] dari saudara kalian sendiri.” Lalu aku menghimpun suatu sidang besar untuk menghadapi mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatiku berunding dengan/di dalam diriku.” Ini adalah ungkapan untuk mempertimbangkan atau bermusyawarah dalam diri sendiri.
    reason: idiom_clarification
  - marker: b
    text: Kata Ibrani yang dipakai dapat menunjuk pada bunga atau beban yang dikenakan dalam pemberian pinjaman.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “aku menetapkan terhadap mereka suatu sidang besar”; ungkapan ini berarti menghimpun sidang umum untuk menghadapi mereka.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: Setelah mempertimbangkannya dalam hati
  rationale: Ungkapan Ibrani ini menggambarkan pertimbangan batin sebelum bertindak. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur ‘hati’ dari teks sumber.
- source_word: וָאָרִיבָה
  choice: aku mengajukan perkara terhadap
  rationale: Verba ריב dapat berarti berselisih, menggugat, atau mengajukan perkara. Dalam konteks teguran resmi kepada para pemimpin, frasa ini mempertahankan nuansa konfrontatif sekaligus yuridis.
- source_word: הַחֹרִים
  choice: para bangsawan
  rationale: Istilah ini menunjuk pada golongan elite sosial Yehuda; ‘para bangsawan’ merupakan padanan baku dan mudah dipahami.
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: Istilah ini menunjuk pada pejabat atau penguasa administratif tanpa memastikan jabatan birokratis yang lebih khusus.
- source_word: מַשָּׁא ... נשאים
  choice: memungut bunga
  rationale: Dalam konteks utang-piutang, gabungan ini menunjuk pada pembebanan atau pemungutan bunga. ‘Memungut bunga’ menyampaikan nada tuduhan tanpa menambahkan gagasan bahwa bunganya pasti berlebihan.
- source_word: אִישׁ בְּאָחִיו
  choice: masing-masing ... dari saudara kalian sendiri
  rationale: Padanan ini mempertahankan daya distributif אִישׁ dan bahasa kekerabatan אָחִיו, yang menekankan bahwa sesama anggota umat memperlakukan satu sama lain demikian.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: aku menghimpun suatu sidang besar untuk menghadapi mereka
  rationale: Secara harfiah ungkapan ini memakai ‘memberikan/menetapkan atas mereka’, tetapi secara idiomatis berarti menghimpun pertemuan umum yang diarahkan untuk menuntut pertanggungjawaban mereka.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘aku’ mengikuti tuturan orang pertama dalam narasi Nehemia. ‘Sidang besar’ dipilih untuk קְהִלָּה גְדוֹלָה karena konteksnya adalah pertemuan umum yang bersifat resmi dan konfrontatif, bukan sekadar kerumunan.
