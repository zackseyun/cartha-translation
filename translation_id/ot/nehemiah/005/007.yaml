  naturalness: Bahasa Indonesia baku dan jelas. “Aku mempertimbangkannya dalam hati” lebih langsung daripada bentuk temporal “Setelah mempertimbangkannya dalam hati,” serta tidak menyiratkan objek yang tidak dinyatakan secara eksplisit dalam klausa Ibrani.
  terminology: “Para bangsawan,” “para pejabat,” “bunga,” dan “sidang besar” sesuai konteks. “Mengajukan perkara terhadap” layak untuk nuansa ריב yang bersifat menuntut/berperkara, tanpa menetapkan suatu prosedur pengadilan tertentu.
