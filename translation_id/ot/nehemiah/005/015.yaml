  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: id
  text: Namun, para gubernur terdahulu yang menjabat sebelum aku membebani rakyat. Mereka mengambil dari rakyat roti dan anggur, di samping empat puluh syikal perak.[a] Bahkan para pelayan mereka pun berkuasa atas rakyat.[b] Tetapi aku tidak bertindak demikian karena takut akan Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “roti dan anggur, dengan tambahan empat puluh syikal perak.” Susunan frasa Ibrani ini sukar; kemungkinan besar roti dan anggur dipungut di samping pungutan perak.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “pelayan” juga dapat berarti “pemuda” atau “pembantu pejabat.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “karena hormat kepada Allah.” Secara harfiah, “karena takut akan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: para gubernur terdahulu yang menjabat sebelum aku
  rationale: פֶּחָה adalah gubernur atau administrator provinsi pada zaman Persia. Frasa ini menunjuk kepada para pemegang jabatan sebelum Nehemia; penambahan 'menjabat' membuat hubungan itu jelas dan alami dalam bahasa Indonesia.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: membebani rakyat
  rationale: Bentuk kausatif dari כבד secara harfiah menyatakan tindakan membuat berat. 'Membebani' mempertahankan metafora Ibrani tanpa mempersempitnya menjadi satu jenis penindasan tertentu.
- source_word: וַיִּקְחוּ מֵהֶם
  choice: mereka mengambil dari rakyat
  rationale: לקח berarti 'mengambil'. Dalam konteks pungutan, ungkapan ini cukup jelas dan tetap lebih dekat dengan sumber daripada pilihan yang lebih interpretatif seperti 'memeras'.
- source_word: בְּלֶחֶם וָיַיִן
  choice: roti dan anggur
  rationale: Terjemahan konkret ini mempertahankan kedua barang yang disebutkan dalam teks, bukan menggeneralisasi לֶחֶם menjadi 'makanan'.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: di samping empat puluh syikal perak
  rationale: 'Dalam konteks ini אַחַר paling mungkin menunjukkan pungutan tambahan: roti dan anggur diambil di samping pungutan uang. Karena susunan Ibraninya sukar dan dapat dipahami secara lain, alternatif dicatat dalam catatan kaki.'
- source_word: נַעֲרֵיהֶם
  choice: para pelayan mereka
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pembantu pejabat. Dalam lingkungan pemerintahan, 'pelayan' menyampaikan kedudukan mereka sebagai bawahan tanpa memastikan usia mereka.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: berkuasa atas rakyat
  rationale: שׁלט berarti menjalankan kekuasaan atau dominasi. 'Berkuasa atas' menjaga kekuatan ungkapan itu tanpa menambahkan penilaian 'sewenang-wenang' yang tidak dinyatakan secara eksplisit oleh verba tersebut.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Tetapi aku tidak bertindak demikian
  rationale: Ungkapan ini menyatakan kontras langsung antara tindakan Nehemia dan para gubernur sebelumnya. 'Bertindak demikian' alami dalam bahasa Indonesia dan mencakup keseluruhan perilaku yang baru disebutkan.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: karena takut akan Allah
  rationale: '''Takut akan Allah'' adalah ungkapan Indonesia yang alami dan mempertahankan idiom teologis יִרְאַת אֱלֹהִים, termasuk unsur hormat, gentar, dan kesadaran akan pertanggungjawaban kepada Allah.'
theological_decisions:
- issue: Makna יִרְאַת אֱלֹהִים sebagai alasan tindakan Nehemia
  choice: karena takut akan Allah
  alternative: karena hormat kepada Allah
  rationale: 'Pilihan utama mempertahankan ketegangan dan bobot idiom sumber: rasa takut ini bukan sekadar kengerian, tetapi juga tidak dilemahkan menjadi penghormatan biasa. Catatan kaki menjelaskan cakupan maknanya tanpa mengganti ungkapan utama.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti orang pertama 'aku' mengikuti tuturan langsung Nehemia. Istilah historis 'gubernur' dan satuan 'syikal' dipertahankan. Struktur kalimat dibuat ringkas agar mudah dipahami, sementara metafora 'membebani' dan idiom 'takut akan Allah' tetap dijaga.
