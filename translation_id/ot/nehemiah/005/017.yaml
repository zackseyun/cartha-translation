  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai bahwa 'seratus lima puluh orang' menjelaskan jumlah orang Yahudi dan para pejabat. Konjungsi waw pembuka tidak diterjemahkan dengan penanda waktu seperti 'Pada waktu itu' karena teks Ibrani tidak memuat kata waktu yang eksplisit.
