base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: id
  text: Orang-orang Yahudi[a] dan para pejabat—seratus lima puluh orang—serta orang-orang yang datang kepada kami dari bangsa-bangsa di sekitar kami, makan di mejaku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang Yudea.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “makan di mejaku” menyiratkan bahwa Nehemia menyediakan makanan bagi mereka sebagai bagian dari keramahtamahan dan penyelenggaraan pemerintahannya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: Orang-orang Yahudi
  rationale: Istilah ini dapat menunjuk kepada orang Yahudi secara umum; terjemahan ini paling wajar dalam bahasa Indonesia, sementara nuansa geografis 'orang-orang Yudea' dicatat sebagai alternatif.
- source_word: וְהַסְּגָנִים
  choice: para pejabat
  rationale: Kata ini menunjuk kepada pemimpin atau administrator sipil bawahan. 'Para pejabat' jelas dan tidak terlalu mempersempitnya menjadi gelar Persia tertentu.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: seratus lima puluh orang
  rationale: Ungkapan bilangan ini menerangkan jumlah orang Yahudi dan para pejabat. 'Orang' alami dalam bahasa Indonesia dan tidak menambahkan penekanan gender yang tidak diperlukan oleh konteks.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: serta orang-orang yang datang kepada kami
  rationale: Partisipelnya secara harfiah berarti 'orang-orang yang datang'; bentuk relatif ini alami dalam narasi retrospektif bahasa Indonesia.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: dari bangsa-bangsa di sekitar kami
  rationale: '''Bangsa-bangsa'' mempertahankan istilah sumber yang luas dan menghindari muatan teologis tambahan dari pilihan seperti ''bangsa-bangsa bukan Yahudi''.'
- source_word: עַל שֻׁלְחָנִי
  choice: makan di mejaku
  rationale: Secara harfiah 'di atas/pada mejaku'; dalam konteks, ungkapan ini berarti menikmati hidangan yang disediakan Nehemia. 'Makan di mejaku' menyampaikan idiom tersebut secara alami sambil mempertahankan citra meja.
theological_decisions: []
