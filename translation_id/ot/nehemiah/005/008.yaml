  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: id
  text: Lalu aku berkata kepada mereka, “Kami telah membeli kembali saudara-saudara kami, orang-orang Yahudi yang telah dijual kepada bangsa-bangsa lain, sejauh kemampuan kami. Namun, kalian sendiri malah menjual saudara-saudara kalian, dan mereka dijual kepada kami![a]” Mereka pun terdiam dan tidak menemukan apa pun untuk dikatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa Ibrani ini singkat dan dapat juga dipahami sebagai pertanyaan retoris: “dan haruskah mereka dijual kepada kami?” Maksudnya, tindakan mereka menyebabkan sesama orang Yahudi akhirnya dijual kepada kami.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָנִינוּ
  choice: telah membeli kembali
  rationale: Dalam konteks membebaskan sesama orang Yahudi dari perhambaan di antara bangsa-bangsa lain, ungkapan ini menyampaikan pembelian kembali secara alami tanpa menambahkan muatan teologis yang tidak harus ada pada verba tersebut.
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: saudara-saudara kami, orang-orang Yahudi
  rationale: Mempertahankan istilah kekerabatan maskulin dan aposisi etnis dalam bahasa Ibrani; bentuk ulang ini juga terdengar wajar dalam bahasa Indonesia.
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: yang telah dijual kepada bangsa-bangsa lain
  rationale: גּוֹיִם merujuk pada bangsa-bangsa non-Yahudi; 'bangsa-bangsa lain' jelas dan alami dalam konteks ini, sedangkan aspek lampau sesuai dengan keadaan mereka sebelum dibeli kembali.
- source_word: כְּדֵי בָנוּ
  choice: sejauh kemampuan kami
  rationale: Ungkapan idiomatis ini menunjukkan batas kemampuan atau sumber daya yang tersedia.
- source_word: וְגַם אַתֶּם
  choice: Namun, kalian sendiri malah
  rationale: '''Kalian sendiri'' mempertahankan penekanan pada אַתֶּם, sedangkan ''malah'' menyampaikan daya tuduhan dan kontras dari וְגַם secara alami.'
- source_word: תִּמְכְּרוּ
  choice: menjual
  rationale: Bentuk Indonesia tanpa penanda waktu khusus sesuai untuk tindakan yang sedang dikecam dalam konteks langsung.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: sehingga mereka dijual kembali kepada kami
  rationale: Klausa Ibrani singkat dan sukar. Terjemahan ini menyatakan akibat ironis dari tindakan mereka tanpa mengubahnya menjadi pertanyaan eksplisit; 'kembali' ditambahkan secara kontekstual karena kelompok Nehemia sebelumnya telah membeli kembali orang-orang itu dari bangsa lain.
- source_word: וַיַּחֲרִישׁוּ
  choice: Mereka pun terdiam
  rationale: Padanan ringkas dan alami yang mempertahankan urutan naratif.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: tidak menemukan apa pun untuk dikatakan
  rationale: Mencerminkan idiom Ibrani 'tidak menemukan perkataan' sambil tetap jelas bagi pembaca modern.
theological_decisions:
- issue: Istilah kekerabatan maskulin אַחֵינוּ / אֲחֵיכֶם
  choice: saudara-saudara kami / saudara-saudara kalian
  alternative: sesama orang Yahudi kami / sesama kalian
  rationale: Istilah kekerabatan maskulin dipertahankan karena menonjolkan solidaritas komunitas dan merupakan bentuk eksplisit teks Ibrani, tanpa memperluasnya menjadi 'saudara-saudari'.
- issue: Daya klausa וְנִמְכְּרוּ לָנוּ
  choice: 'akibat ironis: “sehingga mereka dijual kembali kepada kami!”'
  alternative: 'pertanyaan retoris: “dan haruskah mereka dijual kepada kami?”'
  rationale: Teks Ibrani tidak memuat partikel tanya dan dapat dibaca sebagai akibat yang mengecam tindakan para pemuka. Namun, karena bentuknya eliptis, kemungkinan pembacaan sebagai pertanyaan retoris dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti 'kalian' dipakai karena Nehemia menegur sekelompok orang secara langsung. Tanda seru mempertahankan kuatnya teguran, sementara catatan kaki menjaga ambiguitas sintaksis klausa terakhir.
