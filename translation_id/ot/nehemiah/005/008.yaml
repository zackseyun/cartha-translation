- from: Lalu aku berkata kepada mereka, “Kami telah membeli kembali saudara-saudara kami, orang-orang Yahudi yang telah dijual kepada bangsa-bangsa lain, sejauh kemampuan kami. Namun, kalian sendiri malah menjual saudara-saudara kalian, sehingga mereka dijual kembali kepada kami![a]” Mereka pun terdiam dan tidak menemukan apa pun untuk dikatakan.
  to: Lalu aku berkata kepada mereka, “Kami telah membeli kembali saudara-saudara kami, orang-orang Yahudi yang telah dijual kepada bangsa-bangsa lain, sejauh kemampuan kami. Namun, kalian sendiri malah menjual saudara-saudara kalian, dan mereka dijual kepada kami![a]” Mereka pun terdiam dan tidak menemukan apa pun untuk dikatakan.
