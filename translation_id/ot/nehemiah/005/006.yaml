  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: id
  text: Aku menjadi sangat marah ketika aku mendengar seruan mereka dan kata-kata ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dan perkara-perkara ini." Kata Ibrani ini dapat menunjuk pada kata-kata yang diucapkan ataupun perkara yang dilaporkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: Aku menjadi marah
  rationale: Ungkapan Ibrani חרה + ל menggambarkan kemarahan yang berkobar dalam diri seseorang. Frasa ini menyampaikannya secara alami tanpa menjadi terlalu harfiah atau berlebihan.
- source_word: מְאֹד
  choice: sangat
  rationale: Kata ini memperkuat kadar kemarahan dan secara langsung serta wajar diterjemahkan dengan 'sangat'.
- source_word: כַּאֲשֶׁר
  choice: ketika
  rationale: Dalam konteks ini, kata penghubung tersebut menyatakan waktu atau keadaan yang memicu kemarahan Nehemia.
- source_word: שָׁמַעְתִּי
  choice: mendengar
  rationale: Kata kerja שמע di sini menunjuk pada tindakan mendengar keluhan dan laporan rakyat.
- source_word: זַעֲקָתָם
  choice: jeritan mereka
  rationale: זעקה adalah seruan yang lahir dari kesusahan atau protes. 'Jeritan' mempertahankan daya emosionalnya lebih baik daripada 'keluhan'.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: dan perkataan-perkataan ini
  rationale: דברים dapat berarti perkataan maupun perkara. Dalam konteks tindakan mendengar, 'perkataan-perkataan ini' merupakan arti langsung, sementara kemungkinan arti lainnya dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti orang pertama 'Aku' sesuai dengan tuturan narator tunggal. Pengulangan 'perkataan-perkataan' dipakai untuk menyampaikan bentuk jamak dan menjaga pembedaan dari alternatif 'perkara-perkara'.
