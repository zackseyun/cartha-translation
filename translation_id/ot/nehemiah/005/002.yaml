  naturalness: “Kami beserta anak-anak lelaki dan perempuan kami berjumlah banyak” terasa kaku dalam bahasa Indonesia modern, dan “Biarlah kami memperoleh” dapat terdengar sebagai permohonan izin, bukan ajakan/tekad kohortatif. Revisi memakai bentuk yang lebih idiomatis dan tetap mendesak.
  terminology: “Anak-anak lelaki dan perempuan” dapat dipahami, tetapi “anak-anak laki-laki dan perempuan” lebih lazim dalam ejaan dan pemakaian Indonesia modern. “Makanan berupa biji-bijian” mempertahankan cakupan דָּגָן tanpa menyamakannya dengan semua jenis makanan.
