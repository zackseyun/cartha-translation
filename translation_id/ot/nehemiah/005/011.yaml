source:
  edition: WLC
  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: id
  text: Kembalikanlah kepada mereka pada hari ini juga ladang, kebun anggur, kebun zaitun, dan rumah mereka, serta seperseratus[a] dari uang, gandum, anggur baru, dan minyak yang kamu tagihkan dari mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperseratus”; kemungkinan bagian yang dipungut dari uang dan hasil pertanian itu, mungkin sebagai bunga satu persen.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “yang kamu pungut dari mereka” atau “yang kamu kenakan sebagai bunga kepada mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: Kembalikanlah
  rationale: Bentuk perintah jamak kausatif dari שׁוב menuntut agar milik yang telah diambil dikembalikan; bentuk dengan -lah menyampaikan desakan secara wajar dan bermartabat.
- source_word: נָא
  choice: -lah
  rationale: Partikel permohonan atau pelunak perintah ini disampaikan melalui bentuk imperatif Indonesia dengan -lah, tanpa menambah unsur waktu yang tidak berasal dari partikel tersebut.
- source_word: כְּהַיּוֹם
  choice: pada hari ini juga
  rationale: Ungkapan ini menekankan tindakan segera; pilihan ini lebih kuat daripada sekadar 'hari ini'.
- source_word: שְׂדֹתֵיהֶם
  choice: ladang ... mereka
  rationale: Padanan langsung bagi lahan pertanian milik mereka.
- source_word: כַּרְמֵיהֶם
  choice: kebun anggur
  rationale: Padanan baku dan alami untuk lahan yang ditanami anggur.
- source_word: זֵיתֵיהֶם
  choice: kebun zaitun
  rationale: Dalam daftar properti pertanian, kata ini menunjuk pada lahan atau kebun zaitun, bukan hanya buah atau pohon secara terpisah.
- source_word: וּבָתֵּיהֶם
  choice: dan rumah mereka
  rationale: Padanan langsung yang melengkapi daftar harta tak bergerak yang harus dikembalikan.
- source_word: וּמְאַת
  choice: serta seper seratus
  rationale: Secara harfiah berarti 'seperseratus'. Bentuk pecahan dipertahankan agar teks tidak menentukan secara berlebihan mekanisme atau periode pungutannya.
- source_word: הַכֶּסֶף
  choice: uang
  rationale: כֶּסֶף dapat berarti perak atau uang; dalam konteks utang dan pungutan, fungsi ekonominya paling alami dinyatakan sebagai 'uang'.
- source_word: הַדָּגָן
  choice: gandum
  rationale: Istilah ini menunjuk hasil biji-bijian secara umum; 'gandum' merupakan padanan Indonesia yang lazim dalam daftar hasil pertanian alkitabiah, meskipun cakupan Ibraninya dapat lebih luas.
- source_word: הַתִּירוֹשׁ
  choice: anggur baru
  rationale: תִּירוֹשׁ biasanya menunjuk hasil anggur segar atau anggur baru dan dibedakan dari istilah umum untuk anggur.
- source_word: הַיִּצְהָר
  choice: minyak
  rationale: Istilah ini biasanya berarti minyak segar, terutama minyak zaitun; 'minyak' mempertahankan bentuk ringkas teks sumber.
- source_word: נֹשִׁים
  choice: yang kamu bebankan kepada mereka
  rationale: Kata kerja ini berkaitan dengan tindakan seorang pemberi pinjaman atau penagih. 'Bebankan' mempertahankan cakupan yang cukup luas tanpa memastikan bahwa yang dimaksud hanya bunga.
theological_decisions:
- issue: Makna tindakan kreditur dalam נֹשִׁים pada konteks penindasan ekonomi
  choice: yang kamu bebankan kepada mereka
  alternative: yang kamu pungut dari mereka; yang kamu kenakan sebagai bunga kepada mereka
  rationale: Konteks mengecam praktik utang yang menindas, tetapi bentuk Ibrani tidak harus dibatasi pada istilah teknis 'bunga'. Pilihan ini mempertahankan daya kecaman sekaligus ambiguitas tindakan kreditur.
- issue: Hubungan 'seperseratus' dengan uang dan hasil pertanian
  choice: seperseratus dari uang, gandum, anggur baru, dan minyak
  alternative: bunga satu persen atas uang dan hasil pertanian
  rationale: Susunan Ibrani mengaitkan 'seperseratus' dengan daftar komoditas, tetapi tidak menyebut periode atau mekanisme bunga secara eksplisit. Terjemahan mempertahankan pecahan tanpa menambahkan keterangan bulanan atau istilah riba.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Urutan daftar harta dan hasil pertanian dipertahankan. Bentuk 'pada hari ini juga' menyampaikan urgensi, sedangkan catatan kaki menjaga ambiguitas ekonomi dalam teks Ibrani.
