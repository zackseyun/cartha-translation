source:
  edition: WLC
  text: וְ/יֵשׁ֙ אֲשֶׁ֣ר אֹמְרִ֔ים לָוִ֥ינוּ כֶ֖סֶף לְ/מִדַּ֣ת הַ/מֶּ֑לֶךְ שְׂדֹתֵ֖י/נוּ וּ/כְרָמֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: id
  text: Ada juga yang berkata, “Kami telah meminjam uang[b] untuk membayar pajak raja[a] atas ladang dan kebun-kebun anggur kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “upeti raja.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “perak”; maksudnya, uang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Ada juga yang berkata
  rationale: Ungkapan ini memperkenalkan kelompok lain di antara orang-orang yang menyampaikan keluhan. Bentuk partisip Ibrani disampaikan secara wajar dalam konteks narasi lampau.
- source_word: לָוִינוּ
  choice: kami telah meminjam
  rationale: Kata kerja ini berarti meminjam atau mengambil pinjaman. Kata 'telah' menunjukkan tindakan yang sudah terjadi dan masih berdampak pada keadaan mereka.
- source_word: כֶסֶף
  choice: uang
  rationale: Secara harfiah berarti 'perak', tetapi dalam konteks ekonomi kata ini lazim merujuk pada uang.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: untuk membayar pajak raja
  rationale: Frasa ini menunjuk pada pungutan yang wajib diberikan kepada raja. Penambahan 'membayar' membuat hubungan tujuan dengan uang pinjaman jelas dan alami dalam bahasa Indonesia.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: atas ladang dan kebun-kebun anggur kami
  rationale: Ladang dan kebun anggur dipahami sebagai tanah milik mereka yang dikenai pajak; preposisi 'atas' menyampaikan hubungan itu dengan ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'Ada juga yang berkata' menjaga alur keluhan kelompok-kelompok rakyat, sedangkan 'pajak raja' dipilih sebagai padanan yang paling mudah dipahami tanpa meniadakan alternatif 'upeti' dalam catatan kaki.
