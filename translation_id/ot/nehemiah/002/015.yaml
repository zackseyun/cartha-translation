base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/015.yaml
  text: So I went up by the wadi at night and inspected the wall[a]. Then I turned back and entered by the Valley Gate[b], and returned.
translation:
  language: id
  text: Lalu aku naik melalui wadi itu pada malam hari sambil memeriksa tembok[a]. Setelah itu aku berbalik, masuk melalui Pintu Gerbang Lembah, lalu kembali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani di sini biasanya berarti “memecahkan” atau “merusakkan”, tetapi dalam konteks ini umumnya dipahami sebagai tindakan memeriksa atau mengamati tembok yang rusak.
    reason: lexical_alternative
  - marker: b
    text: “Wadi” adalah jurang atau alur air musiman; istilah ini juga dapat diterjemahkan “lembah” atau “anak sungai.”
    reason: cultural_note
lexical_decisions:
- source_word: עֹלֶה
  choice: menyusuri ... ke arah atas
  rationale: Bentuk partisip dengan היה menggambarkan tindakan yang sedang berlangsung. Ungkapan ini menyampaikan gerak naik sepanjang jalur wadi secara alami tanpa memakai kata yang terlalu formal seperti 'mendaki'.
- source_word: בַנַּחַל
  choice: wadi itu
  rationale: נחל di kawasan ini menunjuk pada jurang atau alur air musiman, bukan terutama lembah yang luas. Istilah 'wadi' mempertahankan ciri topografinya.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Ungkapan waktu yang wajar dalam bahasa Indonesia modern dan setia pada latar malam dalam teks.
- source_word: שֹׂבֵר
  choice: memeriksa
  rationale: Secara umum שבר berarti 'memecahkan' atau 'merusakkan', tetapi konteks perjalanan Nehemia di sepanjang tembok yang sudah rusak menuntut makna kontekstual 'memeriksa'. Catatan kaki mempertahankan persoalan leksikal tersebut.
- source_word: בַּחוֹמָה
  choice: tembok
  rationale: Bentuk tunggal tertentu dipertahankan; konteks menunjukkan tembok pertahanan Yerusalem.
- source_word: וָאָשׁוּב
  choice: aku berbalik
  rationale: Pada kemunculan pertama, שוב menunjukkan perubahan arah dalam rute perjalanan.
- source_word: וָאָבוֹא
  choice: masuk
  rationale: Dengan penyebutan pintu gerbang, בוא secara alami menyatakan gerak masuk melalui gerbang.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: melalui Pintu Gerbang Lembah
  rationale: Ini nama sebuah gerbang kota. Preposisi ב dalam konteks gerak masuk paling jelas diterjemahkan 'melalui'.
- source_word: וָאָשׁוּב
  choice: lalu kembali
  rationale: Kemunculan terakhir שוב merangkum kepulangan Nehemia setelah masuk lagi melalui gerbang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Wadi' dipertahankan sebagai istilah geografis yang lebih tepat daripada 'lembah' atau 'sungai'; maknanya cukup dapat dipahami dari konteks, sedangkan catatan kaki diprioritaskan untuk kesulitan leksikal pada שֹׂבֵר. Struktur 'sambil memeriksa' mempertahankan hubungan tindakan yang berlangsung bersamaan.
