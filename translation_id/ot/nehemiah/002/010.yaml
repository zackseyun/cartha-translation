id: NEH.2.10
reference: Nehemiah 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע סַנְבַלַּ֣ט הַ/חֹרֹנִ֗י וְ/טֽוֹבִיָּה֙ הָ/עֶ֣בֶד הָֽ/עַמֹּנִ֔י וַ/יֵּ֥רַע לָ/הֶ֖ם רָעָ֣ה גְדֹלָ֑ה אֲשֶׁר בָּ֥א אָדָ֔ם לְ/בַקֵּ֥שׁ טוֹבָ֖ה לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: id
  text: Ketika Sanbalat, orang Horon, dan Tobia, seorang hamba dari Amon, mendengar hal ini, mereka merasa sangat tidak senang[a] karena ada seorang laki-laki yang datang untuk mengusahakan kesejahteraan orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “hal itu menjadi kejahatan besar bagi mereka”; bahasa Ibrani mengulang rumpun kata yang berarti “buruk/jahat” untuk memberi penekanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar hal ini
  rationale: Kata kerja ini berarti “mendengar”; “hal ini” disediakan secara wajar dari konteks sebelumnya tanpa mengubah acuannya.
- source_word: הַחֹרֹנִי
  choice: orang Horon
  rationale: Sebutan nisbah ini menunjukkan asal atau keterkaitan Sanbalat dengan Horon; bentuk Indonesia yang transparan lebih alami daripada transliterasi sifat.
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: hamba orang Amon
  rationale: עֶבֶד dipertahankan sebagai “hamba,” bukan ditafsirkan sebagai “pejabat”; עַמֹּנִי menunjukkan bahwa Tobia adalah orang Amon.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: mereka merasa sangat tidak senang
  rationale: Ungkapan ini menyatakan ketidaksenangan yang kuat. Terjemahan utama dibuat idiomatis, sedangkan pengulangan rumpun kata “buruk/jahat” dalam bahasa Ibrani dicatat dalam catatan kaki.
- source_word: אָדָם
  choice: seorang laki-laki
  rationale: Dalam konteks ini kata tunggal tersebut mengacu kepada Nehemia; bentuk maskulin eksplisit dipertahankan.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: mengusahakan kesejahteraan
  rationale: Frasa ini berarti mencari atau mengupayakan apa yang baik dan bermanfaat bagi pihak lain; “mengusahakan kesejahteraan” alami dalam konteks tindakan Nehemia.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” di sini merupakan sebutan kolektif bagi bangsa Israel; “orang Israel” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna אָדָם dalam konteks ini
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Kata itu dapat berarti manusia atau orang secara umum, tetapi dalam konteks ini menunjuk kepada seorang individu laki-laki, yaitu Nehemia. Terjemahan tidak menetralkan rujukan tersebut.
- issue: Status Tobia dalam sebutan הָעֶבֶד
  choice: hamba
  alternative: pejabat
  rationale: Teks menyebut Tobia dengan kata yang berarti hamba atau budak. “Pejabat” mungkin menjelaskan fungsi sosialnya, tetapi merupakan penafsiran yang tidak dinyatakan secara langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan identitas kedua tokoh mengikuti teks Ibrani, sedangkan ungkapan ketidaksenangan diterjemahkan secara idiomatis dengan nuansa harfiahnya dipertahankan dalam catatan kaki.
