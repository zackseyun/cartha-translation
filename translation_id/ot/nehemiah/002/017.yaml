base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: id
  text: 'Lalu aku berkata kepada mereka, “Kalian melihat malapetaka[a] yang kita alami: Yerusalem sudah menjadi reruntuhan, dan pintu-pintu gerbangnya telah dibakar dengan api. Mari kita bangun kembali tembok Yerusalem supaya kita tidak lagi menjadi cela[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kesusahan” atau “kemalangan”. Kata Ibrani ini di sini menunjuk pada bencana atau keadaan buruk, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi kehinaan” atau “menjadi sasaran ejekan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה
  choice: malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada keadaan buruk atau bencana yang menimpa masyarakat, bukan pada kejahatan moral. “Malapetaka” menyampaikan beratnya keadaan itu secara alami.
- source_word: אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: yang kita alami
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan keadaan 'yang di dalamnya kita berada'. “Yang kita alami” merupakan padanan Indonesia yang alami dan mempertahankan sifat komunal penderitaan tersebut.
- source_word: חֲרֵבָה
  choice: telah menjadi reruntuhan
  rationale: Kata ini menggambarkan Yerusalem dalam keadaan hancur atau sunyi akibat kehancuran. Pilihan ini menonjolkan kondisi fisik kota tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: telah terbakar
  rationale: Bentuk pasif menyatakan bahwa gerbang-gerbang itu dilalap api. Dalam bahasa Indonesia, unsur api sudah terkandung dalam “terbakar”, sehingga terjemahan ini alami tanpa mengubah makna.
- source_word: לְכוּ
  choice: Mari
  rationale: Walaupun bentuk dasarnya berarti “pergilah”, dalam seruan ajakan ini kata tersebut mengundang tindakan bersama. “Mari” adalah padanan idiomatis yang tepat.
- source_word: וְנִבְנֶה
  choice: kita bangun kembali
  rationale: Bentuk kohortatif menyatakan tekad bersama. “Bangun kembali” sesuai dengan konteks pemulihan tembok yang sebelumnya telah ada.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: tembok Yerusalem
  rationale: Padanan ini mempertahankan hubungan konstruksi Ibrani secara ringkas dan jelas.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: supaya kita tidak lagi menjadi cela
  rationale: חֶרְפָּה mencakup kehinaan publik, cela, dan keadaan sebagai sasaran ejekan. “Menjadi cela” mempertahankan ungkapan komunal teks, sedangkan “supaya” menyampaikan nuansa tujuan atau hasil secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Kalian” dipakai karena Nehemia berbicara kepada sekelompok orang, sedangkan “kita” mempertahankan keterlibatan Nehemia dalam keadaan dan tindakan bersama.
