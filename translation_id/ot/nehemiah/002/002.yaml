id: NEH.2.2
reference: Nehemiah 2:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ לִ֨/י הַ/מֶּ֜לֶךְ מַדּ֣וּעַ פָּנֶ֣י/ךָ רָעִ֗ים וְ/אַתָּה֙ אֵֽינְ/ךָ֣ חוֹלֶ֔ה אֵ֣ין זֶ֔ה כִּי אִ֖ם רֹ֣עַֽ לֵ֑ב וָ/אִירָ֖א הַרְבֵּ֥ה מְאֹֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: id
  text: Raja berkata kepadaku, “Mengapa wajahmu muram[a], padahal engkau tidak sakit? Ini tidak lain daripada kesedihan hati[b].” Lalu aku menjadi sangat takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “wajahmu buruk”—sebuah ungkapan untuk raut wajah yang sedih atau susah.
    reason: lexical_alternative
  - marker: b
    text: Atau “kesusahan hati” atau “hati yang susah”; secara harfiah, “keburukan/kejahatan hati.” Di sini ungkapan itu menunjuk pada kesusahan batin, bukan semata-mata kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya alasan ini paling wajar dan tepat diterjemahkan dengan “mengapa” dalam bahasa Indonesia modern.
- source_word: פָּנֶיךָ רָעִים
  choice: wajahmu muram
  rationale: Secara harfiah ungkapan ini berarti “wajahmu buruk,” tetapi dalam konteks merupakan idiom bagi raut yang sedih atau susah. “Wajahmu muram” mempertahankan gambaran wajah sekaligus menyampaikan makna idiomatisnya.
- source_word: חוֹלֶה
  choice: sakit
  rationale: Padanan langsung dan alami untuk keadaan jasmani yang tidak sehat.
- source_word: וְאַתָּה אֵינְךָ חוֹלֶה
  choice: padahal engkau tidak sakit
  rationale: “Padahal” secara alami menyampaikan pertentangan antara wajah yang muram dan kenyataan bahwa Nehemia tidak sedang sakit.
- source_word: אֵין זֶה כִּי אִם
  choice: Ini tidak lain daripada
  rationale: Ungkapan ini meniadakan penjelasan lain dan menyatakan kesimpulan raja secara tegas.
- source_word: רֹעַ לֵב
  choice: kesedihan hati
  rationale: Secara harfiah berarti “keburukan/kejahatan hati,” tetapi konteks mempertentangkan penyakit jasmani dengan kesusahan batin. “Kesedihan hati” menyampaikan maksud kontekstual tanpa memberi kesan kejahatan moral.
- source_word: וָאִירָא
  choice: Lalu aku menjadi ... takut
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “lalu” menyatakan perkembangan tersebut secara alami.
- source_word: הַרְבֵּה מְאֹד
  choice: sangat
  rationale: Dua unsur penguat menekankan besarnya ketakutan Nehemia. “Sangat takut” merupakan ungkapan Indonesia yang alami dan cukup kuat.
theological_decisions:
- issue: Makna רֹעַ לֵב
  choice: kesedihan hati
  alternative: keburukan hati; kesusahan hati; hati yang susah
  rationale: Dalam konteks ini raja membedakan sakit jasmani dari keadaan batin yang tampak pada wajah Nehemia. Terjemahan utama menyatakan kesedihan batin, sedangkan catatan kaki mempertahankan keluasan ungkapan Ibrani dan mencegah pembacaan yang terlalu cepat sebagai kejahatan moral.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti “engkau” dipakai untuk dialog langsung dalam gaya Alkitab yang tetap mudah dipahami; susunan kalimat mempertahankan urutan dan tekanan narasi Ibrani.
