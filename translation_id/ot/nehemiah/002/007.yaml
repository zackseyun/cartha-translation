  text: וָ/אוֹמַר֮ לַ/מֶּלֶךְ֒ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב אִגְּרוֹת֙ יִתְּנוּ לִ֔/י עַֽל פַּחֲו֖וֹת עֵ֣בֶר הַ/נָּהָ֑ר אֲשֶׁר֙ יַעֲבִיר֔וּ/נִי עַ֥ד אֲשֶׁר אָב֖וֹא אֶל יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: id
  text: Lalu aku berkata kepada raja, “Jika raja berkenan, kiranya aku diberi surat-surat bagi para gubernur di Seberang Sungai[a], supaya mereka mengizinkan aku melintas sampai aku tiba di Yehuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seberang Sungai” adalah sebutan administratif Persia bagi wilayah di sebelah barat Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” menyatakan perkembangan narasi secara wajar dalam bahasa Indonesia.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan ini merupakan formula kesopanan di lingkungan istana. “Jika raja berkenan” alami, hormat, dan tetap mempertahankan bentuk bersyarat sumber.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: kiranya aku diberi surat-surat
  rationale: Bentuk orang ketiga jamak dipakai secara idiomatis sebagai permohonan. Konstruksi pasif dengan “kiranya” menyampaikan permohonan sopan kepada raja tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: פַּחֲווֹת
  choice: para gubernur
  rationale: Istilah ini menunjuk kepada para pejabat yang memerintah wilayah-wilayah administratif Persia; “gubernur” merupakan padanan ringkas dan jelas.
- source_word: עֵבֶר הַנָּהָר
  choice: Seberang Sungai
  rationale: Ini adalah nama administratif Persia bagi kawasan di sebelah barat Sungai Efrat. Huruf kapital menandainya sebagai sebutan wilayah, bukan sekadar keterangan arah.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: supaya mereka mengizinkan aku melintas
  rationale: Dalam konteks surat perjalanan, bentuk Hifil dari עבר menyatakan bahwa para gubernur memungkinkan atau memberi izin kepada Nehemia untuk melewati wilayah mereka.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: sampai aku tiba
  rationale: Klausa ini menyatakan batas perjalanan secara alami dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama wilayah dipertahankan sebagai “Yehuda”; “Yudea” dapat memberi kesan periode yang lebih kemudian.
theological_decisions: []
