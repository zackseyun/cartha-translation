  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֶֽעֱבֹר֙ אֶל שַׁ֣עַר הָ/עַ֔יִן וְ/אֶל בְּרֵכַ֖ת הַ/מֶּ֑לֶךְ וְ/אֵין מָק֥וֹם לַ/בְּהֵמָ֖ה לַ/עֲבֹ֥ר תַּחְתָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: id
  text: Kemudian aku meneruskan perjalanan ke Gerbang Mata Air[a] dan Kolam Raja, tetapi tidak ada tempat bagi hewan yang kutunggangi untuk lewat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Gerbang Sumber Air”. Kata Ibrani yang digunakan dapat berarti mata air atau sumber air.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi hewan di bawahku untuk lewat,” yaitu hewan yang sedang ditunggangi Nehemia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Kemudian aku meneruskan perjalanan
  rationale: Kata kerja עבר dapat berarti ‘melewati’ atau ‘berjalan terus’. Dalam kisah pemeriksaan malam ini, ungkapan ini secara alami menunjukkan kelanjutan perjalanan ke tempat berikutnya.
- source_word: שַׁעַר הָעַיִן
  choice: Gerbang Mata Air
  rationale: Dalam konteks topografi, עַיִן menunjuk pada sumber air atau mata air, bukan ‘mata’. ‘Gerbang Mata Air’ jelas dan alami dalam bahasa Indonesia.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: Kolam Raja
  rationale: בְּרֵכָה berarti kolam atau waduk. Bentuk konstruksi Ibrani diterjemahkan langsung sebagai nama tempat ‘Kolam Raja’.
- source_word: וְאֵין מָקוֹם
  choice: tetapi tidak ada tempat
  rationale: Walaupun וְ secara dasar berarti ‘dan’, konteksnya menunjukkan hambatan yang berlawanan dengan kelanjutan perjalanan, sehingga ‘tetapi’ menyampaikan hubungan antarklausa secara alami.
- source_word: לַבְּהֵמָה ... תַּחְתָּי
  choice: bagi hewan yang kutunggangi
  rationale: בְּהֵמָה adalah istilah umum untuk hewan dan tidak menyebut jenisnya. Frasa harfiah ‘hewan di bawahku’ dalam konteks ini berarti hewan yang sedang ditunggangi Nehemia; terjemahan ini alami tanpa menambahkan jenis hewan.
- source_word: לַעֲבֹר
  choice: untuk lewat
  rationale: Infinitif עבר menyatakan gerakan melewati tempat yang terhalang; ‘untuk lewat’ mempertahankan makna spasial yang sederhana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Nama-nama tempat dibuat ringkas dan bermartabat. Ungkapan harfiah yang janggal tentang hewan dijelaskan dalam catatan kaki, sementara teks utama memakai bentuk alami tanpa menentukan jenis hewannya.
