base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: id
  text: Aku berkata kepada raja, “Semoga raja hidup selama-lamanya! Mengapa wajahku tidak seharusnya tampak muram ketika kota, tempat makam leluhurku, telah menjadi reruntuhan dan pintu-pintu gerbangnya telah dilalap api?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: Aku berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan narasi lampau. Kata ganti orang pertama dipertahankan, sedangkan waw tidak perlu diterjemahkan secara terpisah karena kesinambungan narasi sudah alami dalam bahasa Indonesia.
- source_word: לַמֶּלֶךְ / הַמֶּלֶךְ
  choice: kepada raja / raja
  rationale: Kemunculan pertama menyatakan penerima perkataan; pengulangan kedua merupakan sapaan kerajaan yang penuh hormat dan tetap dipertahankan.
- source_word: לְעוֹלָם יִחְיֶה
  choice: Semoga raja hidup selama-lamanya!
  rationale: Ini adalah rumusan penghormatan dan harapan bagi raja. Bentuk “Semoga ...” alami dalam bahasa Indonesia dan mempertahankan nada istana.
- source_word: לֹא יֵרְעוּ פָנַי
  choice: wajahku tidak tampak muram
  rationale: Ungkapan Ibrani secara konkret berbicara tentang wajah yang menunjukkan kesedihan atau kesusahan. “Tampak muram” mempertahankan unsur raut wajah dan terdengar alami.
- source_word: אֲשֶׁר
  choice: sedangkan
  rationale: Dalam konteks ini kata tersebut memperkenalkan keadaan yang menjelaskan kemuraman Nehemia. “Sedangkan” menjaga hubungan keadaan dan alasan tanpa menjadikannya pernyataan sebab yang terlalu eksplisit.
- source_word: הָעִיר
  choice: kota
  rationale: Teks menyebut kota itu secara definit tanpa menamainya. Bahasa Indonesia tidak memakai artikel definit, sehingga “kota” merupakan padanan yang wajar dalam konteks.
- source_word: בֵּית קִבְרוֹת אֲבֹתַי
  choice: tempat makam leluhurku berada
  rationale: Secara harfiah frasa ini berbunyi “rumah makam-makam para bapakku,” tetapi berfungsi untuk menunjuk tempat yang terkait dengan pemakaman para leluhur. Terjemahan ini menyampaikan maksudnya secara jelas tanpa menghilangkan kaitan dengan makam leluhur.
- source_word: חֲרֵבָה
  choice: telah menjadi reruntuhan
  rationale: Kata sifat ini menggambarkan kota yang hancur atau telantar. Ungkapan tersebut alami dan kuat dalam bahasa Indonesia.
- source_word: וּשְׁעָרֶיהָ
  choice: dan pintu-pintu gerbangnya
  rationale: Bentuk jamak dan akhiran kepunyaan yang merujuk kepada kota dipertahankan secara langsung.
- source_word: אֻכְּלוּ בָאֵשׁ
  choice: telah dilalap api
  rationale: Bentuk pasif dari אכל secara kiasan menggambarkan api yang “memakan” atau menghabiskan. “Dilalap api” merupakan ungkapan Indonesia yang alami dan mempertahankan daya gambar tersebut.
