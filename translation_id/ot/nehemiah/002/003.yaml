  to: Aku berkata kepada raja, “Semoga raja hidup selama-lamanya! Mengapa wajahku tidak seharusnya tampak muram ketika kota, tempat makam leluhurku, telah menjadi reruntuhan dan pintu-pintu gerbangnya telah dilalap api?”
