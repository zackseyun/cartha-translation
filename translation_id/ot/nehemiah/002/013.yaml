base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: id
  text: Lalu, pada malam hari aku keluar melalui Gerbang Lembah, menuju Mata Air Naga[a] dan Gerbang Kotoran. Aku sedang memeriksa[b] tembok-tembok Yerusalem yang telah dijebol serta gerbang-gerbangnya yang telah dilalap api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani untuk tempat ini memakai kata tannin, yang dapat berarti “naga”, “ular”, atau makhluk sejenis; karena itu, nama ini juga dapat diterjemahkan “Mata Air Ular”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “aku sedang memeriksa” secara harfiah sulit dipahami. Dalam konteks ini, ungkapan tersebut dipahami sebagai tindakan meninjau tembok-tembok yang rusak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: Lalu ... aku keluar
  rationale: Bentuk wayyiqtol orang pertama tunggal dari יצא melanjutkan urutan narasi; “lalu” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: בְשַׁעַר הַגַּיְא
  choice: melalui Gerbang Lembah
  rationale: Dalam konteks gerak, preposisi ב paling alami berarti “melalui”; הַגַּיְא menunjuk pada lembah atau jurang dan dipertahankan sebagai nama tempat.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Berfungsi sebagai keterangan waktu dan diterjemahkan dengan ungkapan Indonesia yang jelas serta alami.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: menuju Mata Air Naga
  rationale: עֵין di sini berarti mata air. Dalam uraian rute, אֶל־פְּנֵי menunjukkan arah; תַּנִּין memiliki rentang makna naga, ular, atau makhluk sejenis, sehingga “Naga” mempertahankan daya leksikal nama itu tanpa mempersempitnya secara berlebihan.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Gerbang Kotoran
  rationale: אַשְׁפֹּת menunjuk pada kotoran atau tumpukan sampah. “Gerbang Kotoran” merupakan nama yang langsung, mudah dipahami, dan cukup dekat dengan unsur Ibraninya.
- source_word: וָאֱהִי שֹׂבֵר
  choice: Aku memeriksa
  rationale: Walaupun שבר biasanya berarti “memecahkan”, konstruksi yang sulit ini dalam konteks peninjauan malam atas tembok yang rusak paling masuk akal menyatakan tindakan mengamati atau memeriksa. Bentuk lampau sederhana lebih alami dalam narasi Indonesia.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: tembok-tembok Yerusalem
  rationale: Bentuk jamak חוֹמוֹת diterjemahkan secara eksplisit, sedangkan hubungan dengan Yerusalem dinyatakan secara alami tanpa kata depan tambahan.
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: yang telah dijebol
  rationale: Partisip pasif dari פרץ menggambarkan tembok yang telah dibuat bercelah atau diterobos; “dijebol” menyampaikan keadaan tembok pertahanan yang telah dirusak.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: dan pintu-pintu gerbangnya yang telah dilalap api
  rationale: Bentuk pasif אכל bersama api secara harfiah menggambarkan sesuatu yang “dimakan” api. “Dilalap api” mempertahankan gambaran hidup tersebut secara idiomatis dalam bahasa Indonesia.
