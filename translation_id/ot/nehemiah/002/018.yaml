  text: וָ/אַגִּ֨יד לָ/הֶ֜ם אֶת יַ֣ד אֱלֹהַ֗/י אֲשֶׁר הִיא֙ טוֹבָ֣ה עָלַ֔/י וְ/אַף דִּבְרֵ֥י הַ/מֶּ֖לֶךְ אֲשֶׁ֣ר אָֽמַר לִ֑/י וַ/יֹּֽאמְרוּ֙ נָק֣וּם וּ/בָנִ֔ינוּ וַ/יְחַזְּק֥וּ יְדֵי/הֶ֖ם לַ/טּוֹבָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: id
  text: Lalu aku memberi tahu mereka bahwa tangan Allahku menyertaiku dengan kebaikan[a], dan juga perkataan raja yang telah disampaikannya kepadaku. Mereka berkata, “Mari kita bangkit dan membangun.” Lalu mereka menguatkan tangan mereka untuk pekerjaan yang baik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan Allahku baik atasku”; dapat juga berarti “tangan Allahku berkenan kepadaku” atau “Allahku bermurah hati kepadaku.”
    reason: Menjaga idiom Ibrani dan rentang maknanya sambil memberi pembaca ungkapan Indonesia yang mudah dipahami.
  - marker: b
    text: Secara harfiah, “mereka menguatkan tangan mereka untuk kebaikan” atau “untuk yang baik.”
    reason: Menunjukkan metafora dan ketidaktersuratan objek dalam teks Ibrani; konteks menunjuk pada pekerjaan pembangunan kembali.
lexical_decisions:
- source_word: וָאַגִּיד
  choice: Lalu aku memberi tahu
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. 'Lalu' menandai urutan peristiwa, sedangkan 'memberi tahu' merupakan ungkapan Indonesia modern yang wajar untuk tindakan Nehemia melaporkan hal-hal ini kepada mereka.
- source_word: יַד אֱלֹהַי
  choice: tangan Allahku
  rationale: Metafora Ibrani tentang tindakan, kuasa, dan perkenanan Allah dipertahankan, bukan dilebur menjadi kata abstrak seperti 'pertolongan' atau 'perkenanan'.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: menyertaiku dengan kebaikan
  rationale: Ungkapan ini mempertahankan gagasan harfiah bahwa tangan Allah 'baik atas' Nehemia, tetapi mengungkapkannya secara alami dalam bahasa Indonesia. Catatan kaki mencantumkan bentuk harfiah dan alternatif semantis.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: dan juga menyampaikan perkataan raja kepadaku
  rationale: 'Dalam koordinasi dengan ''memberi tahu'', verba itu dipahami tetap berlaku pada unsur kedua: Nehemia juga menyampaikan perkataan yang telah diucapkan raja kepadanya. Rumusan ini menghindari konstruksi Indonesia yang kaku.'
- source_word: נָקוּם וּבָנִינוּ
  choice: Mari kita bangkit dan membangun
  rationale: Bentuk orang pertama jamak berfungsi sebagai ajakan atau pernyataan tekad bersama. 'Mari kita' menyampaikan daya kohortatifnya secara jelas dan alami.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: Lalu mereka menguatkan tangan mereka
  rationale: Idiom konkret Ibrani dipertahankan agar citra tangan pada bagian akhir bergaung dengan 'tangan Allahku' pada bagian awal, tanpa mengubahnya menjadi parafrasa abstrak seperti 'mereka memberanikan diri'.
- source_word: לַטּוֹבָה
  choice: untuk pekerjaan yang baik
  rationale: Secara harfiah berarti 'untuk kebaikan/yang baik'. Dalam konteks, ungkapan itu menunjuk pada usaha pembangunan kembali; 'pekerjaan yang baik' membuat rujukannya jelas tanpa mempersempit maknanya secara berlebihan.
theological_decisions:
- issue: Metafora tindakan ilahi dalam 'tangan Allahku ... baik atasku'
  choice: Mempertahankan 'tangan Allahku' dan mengungkapkan kualitasnya sebagai 'menyertaiku dengan kebaikan'
  alternative: Perkenanan Allahku menyertaiku; Allahku bermurah hati kepadaku
  rationale: Metafora 'tangan' menyatakan keterlibatan aktif Allah dan merupakan unsur teologis serta sastra penting. Terjemahan tidak membatasi tindakan itu hanya pada perkenanan batin, providensi, atau kuasa, sementara catatan kaki menjaga bentuk dan rentang makna sumber.
- issue: Makna לַטּוֹבָה pada respons umat
  choice: pekerjaan yang baik
  alternative: untuk kebaikan; untuk hal yang baik
  rationale: Konteks mengarahkan frasa tersebut kepada pembangunan kembali sebagai usaha yang baik. Namun terjemahan tidak menambahkan penilaian teologis yang lebih khusus daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Metafora 'tangan' dipertahankan pada kedua bagiannya untuk menjaga hubungan sastra dalam ayat. Susunan kalimat dibuat alami tanpa menghilangkan koordinasi antara kebaikan tangan Allah dan perkataan raja.
