  naturalness: Teks revisi memakai bahasa Indonesia baku dan naratif. “Bangun pada malam hari” mempertahankan tindakan dasar tanpa menambahkan perjalanan, sementara “tidak ada hewan bersamaku” alami dan dekat dengan struktur sumber.
  terminology: “Allahku,” “hati,” dan “Yerusalem” dipertahankan. “Hewan” tepat sebagai istilah umum untuk בְּהֵמָה dan tidak mengidentifikasi jenis tunggangan.
  issues:
