    issue: “Aku tidak membawa hewan apa pun” mengganti pernyataan eksistensial sumber.
    rationale: וּבְהֵמָה אֵין עִמִּי secara harfiah menyatakan bahwa tidak ada hewan bersama Nehemia. Terjemahan dengan “membawa” adalah inferensi yang wajar dalam konteks, tetapi kurang langsung dan mengubah fokus semantis.
  - severity: low
    issue: Pembuka kurang menampilkan dua unsur subjek secara sejajar.
    rationale: Teks Ibrani menyebut “aku dan beberapa orang bersamaku.” Pemisahan menjadi “aku ... dan beberapa orang menyertai aku” membuat keduanya lebih jelas dalam bahasa Indonesia.
