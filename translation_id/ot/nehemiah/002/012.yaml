revisions:
- from: Aku pun bangun pada malam hari bersama beberapa orang yang menyertai aku. Aku belum memberitahukan kepada siapa pun apa yang Allahku taruh dalam hatiku untuk kulakukan bagi Yerusalem.[a] Aku tidak membawa hewan apa pun selain hewan yang kutunggangi.[b]
  to: Aku pun bangun pada malam hari, dan beberapa orang menyertai aku. Aku belum memberitahukan kepada siapa pun apa yang Allahku letakkan dalam hatiku untuk kulakukan bagi Yerusalem.[a] Tidak ada hewan bersamaku selain hewan yang kutunggangi.[b]
  rationale: Revisi mempertahankan ketaktertentuan aspek partisipel dan ruang lingkup luas tindakan bagi Yerusalem. Klausa tentang hewan dikembalikan ke pernyataan “bersama aku” sebagaimana sumber, bukan tindakan membawa. Catatan kaki tetap berjangkar pada frasa yang dijelaskan dan tidak menambahkan identifikasi hewan atau bentuk wahyu.
