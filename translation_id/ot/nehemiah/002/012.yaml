  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: id
  text: Aku pun bangun pada malam hari, dan beberapa orang menyertai aku. Aku belum memberitahukan kepada siapa pun apa yang Allahku letakkan dalam hatiku untuk kulakukan bagi Yerusalem.[a] Tidak ada hewan bersamaku selain hewan yang kutunggangi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini juga dapat diterjemahkan, “apa yang sedang Allahku letakkan dalam hatiku” atau “apa yang telah Allahku letakkan dalam hatiku.”
    reason: Partisipel נֹתֵן dapat dipahami dengan nuansa berlangsung atau sebagai tindakan yang sudah menghasilkan tekad dalam konteks lampau.
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hewan” adalah istilah umum; jenis hewan tunggangannya tidak disebutkan.
    reason: Menjaga ketidakspesifikan בְּהֵמָה dan mencegah pembaca menganggap teks menyebut kuda, bagal, atau keledai tertentu.
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: Aku pun bangun pada malam hari
  rationale: Bentuk wayyiqtol dari קום melanjutkan alur narasi, sedangkan לַיְלָה menunjukkan waktu tindakan. 'Bangun' mempertahankan gambaran dasar tanpa menambahkan tindakan 'pergi' yang tidak dinyatakan secara eksplisit.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: bersama beberapa orang yang menyertai aku
  rationale: Ungkapan ini menyatakan bahwa hanya sedikit orang menyertai Nehemia. Susunan Indonesia dibuat alami sambil mempertahankan penekanan pada kelompok kecil tersebut.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Aku belum memberitahukan kepada siapa pun
  rationale: Dalam konstruksi negatif ini, לְאָדָם berarti tidak kepada seorang pun. 'Siapa pun' merupakan padanan Indonesia yang wajar dan tidak menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: apa yang Allahku taruh dalam hatiku
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang Allah yang menaruh sesuatu dalam hati tanpa mengubahnya menjadi pernyataan eksplisit tentang wahyu verbal. Bahasa Indonesia tidak perlu menandai aspek partisipel secara kaku.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: untuk kulakukan bagi Yerusalem
  rationale: Kata kerja dan preposisi Ibrani tetap luas. 'Bagi Yerusalem' mempertahankan arah tindakan demi kota itu tanpa mendahului konteks dengan menyebut pembangunan kembali.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: Aku tidak membawa hewan apa pun selain hewan
  rationale: בְּהֵמָה adalah istilah umum bagi hewan, di sini hewan tunggangan. 'Membawa' menyampaikan secara alami makna bahwa tidak ada hewan lain yang menyertainya.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: yang kutunggangi
  rationale: Padanan ini ringkas dan alami dalam bahasa Indonesia serta menyampaikan tindakan menunggang yang sedang berlangsung dalam adegan.
theological_decisions:
- issue: Dorongan ilahi dalam batin Nehemia
  choice: apa yang Allahku taruh dalam hatiku
  alternative: apa yang Allahku gerakkan dalam hatiku; apa yang telah Allahku taruh dalam hatiku
  rationale: Teks mengaitkan niat Nehemia dengan prakarsa Allah, tetapi tidak menyatakan bentuk pewahyuan tertentu. Ungkapan idiomatis ini mempertahankan hubungan antara dorongan ilahi dan tindakan manusia tanpa menjelaskannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Narasi orang pertama dipertahankan. Susunan kalimat dibuat alami tanpa mempersempit jenis hewan atau menjadikan dorongan Allah sebagai wahyu verbal eksplisit.
