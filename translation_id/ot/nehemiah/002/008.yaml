source:
  edition: WLC
  text: וְ/אִגֶּ֡רֶת אֶל אָסָף֩ שֹׁמֵ֨ר הַ/פַּרְדֵּ֜ס אֲשֶׁ֣ר לַ/מֶּ֗לֶךְ אֲשֶׁ֣ר יִתֶּן לִ֣/י עֵצִ֡ים לְ֠/קָרוֹת אֶת שַׁעֲרֵ֨י הַ/בִּירָ֤ה אֲשֶׁר לַ/בַּ֨יִת֙ וּ/לְ/חוֹמַ֣ת הָ/עִ֔יר וְ/לַ/בַּ֖יִת אֲשֶׁר אָב֣וֹא אֵלָ֑י/ו וַ/יִּתֶּן לִ֣/י הַ/מֶּ֔לֶךְ כְּ/יַד אֱלֹהַ֖/י הַ/טּוֹבָ֥ה עָלָֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: id
  text: juga sepucuk surat kepada Asaf, pengawas hutan kerajaan[a], supaya ia memberi aku kayu untuk membuat balok bagi gerbang-gerbang benteng yang terkait dengan Bait Allah[b], untuk tembok kota, dan untuk rumah yang akan kutempati[c]. Raja mengabulkan permintaanku, karena tangan Allahku yang baik menyertai aku[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “taman kerajaan” atau “kebun kerajaan”. Kata Ibrani pardes menunjuk pada kawasan kerajaan yang ditanami dan dikelola, kemungkinan termasuk pepohonan penghasil kayu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “benteng yang menjadi milik rumah itu”. “Rumah” di sini kemungkinan besar adalah Bait Allah; hubungan tepat antara benteng dan Bait Allah tidak dijelaskan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rumah yang akan kumasuki”, yakni rumah yang akan menjadi kediaman Nehemia.
    reason: translation_note
  - marker: d
    text: Secara harfiah, “sesuai dengan tangan Allahku yang baik atasku”. Ungkapan ini menggambarkan pertolongan dan pemeliharaan Allah yang penuh kemurahan.
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: sepucuk surat
  rationale: Kata ini menunjuk pada surat atau dokumen tertulis resmi. “Sepucuk surat” alami dalam bahasa Indonesia dan sesuai dengan permintaan Nehemia kepada raja.
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: pengawas hutan kerajaan
  rationale: פַּרְדֵּס dapat berarti taman, kebun, atau kawasan pepohonan yang dikelola. Karena Asaf diminta menyediakan kayu bangunan, “hutan kerajaan” paling jelas menyampaikan fungsinya dalam konteks ini tanpa meniadakan alternatif leksikal.
- source_word: יִתֶּן לִי עֵצִים
  choice: supaya ia memberi aku kayu
  rationale: עֵצִים secara harfiah dapat berarti pohon-pohon atau kayu. Dalam konteks pembangunan, “kayu” merupakan padanan Indonesia yang wajar dan tidak terlalu mempersempit maknanya.
- source_word: לְקָרוֹת
  choice: untuk memasang balok-balok
  rationale: Infinitif dari קרה berkaitan dengan pemasangan balok atau pembuatan atap. Ungkapan ini mempertahankan gambaran tindakan konstruksi tanpa membatasinya hanya pada pekerjaan atap.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: gerbang-gerbang benteng yang berada di Bait Allah
  rationale: בִּירָה menunjuk pada benteng atau kubu, sedangkan בַּיִת dalam konteks ini sangat mungkin menunjuk pada Bait Allah. Relasi אֲשֶׁר לַ menyatakan keterkaitan atau kepemilikan; bahasa utama dibuat wajar, sedangkan catatan kaki mempertahankan ketidakpastian bentuk relasinya.
- source_word: חוֹמַת הָעִיר
  choice: tembok kota
  rationale: Padanan ringkas dan alami untuk frasa konstruksi Ibrani “tembok kota itu”.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: rumah yang akan kutempati
  rationale: Secara harfiah frasa ini menyebut rumah yang akan dimasuki Nehemia. Dalam konteks, yang dimaksud adalah kediamannya; “akan kutempati” menyampaikan fungsi tersebut dalam bahasa Indonesia yang alami.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Raja mengabulkan permintaanku
  rationale: Teks Ibrani secara harfiah berbunyi “raja memberi kepadaku” tanpa menyebut objek. Dalam bahasa Indonesia, “mengabulkan permintaanku” menyampaikan elipsis itu secara wajar berdasarkan rangkaian permintaan pada ayat 7–8.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלַי
  choice: karena tangan Allahku yang baik menyertai aku
  rationale: Padanan ini mempertahankan metafora “tangan” yang penting dalam Ezra–Nehemia, sambil mengungkapkan hubungan sebab yang tersirat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pemeliharaan dan pertolongan Allah dalam ungkapan “tangan Allahku yang baik atasku”
  choice: Mempertahankan gambaran antropomorfis “tangan Allahku yang baik menyertai aku”
  alternative: karena Allah berkenan kepadaku / karena Allah menolong aku
  rationale: Metafora “tangan” menampilkan keterlibatan Allah yang aktif dalam keberhasilan Nehemia. Mempertahankannya menjaga tekstur teologis kitab tanpa menambahkan rumusan doktrinal tertentu.
- issue: Identitas הַבַּיִת pada frasa tentang benteng
  choice: Menerjemahkannya sebagai “Bait Allah” dalam teks utama, dengan catatan mengenai bentuk harfiahnya
  alternative: rumah itu
  rationale: Dalam konteks Yerusalem dan benteng yang terkait dengannya, rujukan kepada Bait Allah sangat mungkin, tetapi bentuk harfiah “rumah” dan relasi tepatnya tetap dicatat agar ketegangan leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “aku” mengikuti tutur orang pertama Nehemia; “Bait Allah” dipakai sebagai istilah yang mudah dipahami pembaca umum. Metafora sumber “tangan Allah” dipertahankan, sedangkan ungkapan konstruksi dan elipsis disampaikan secara alami.
