  text: וְ/הַ/סְּגָנִ֗ים לֹ֤א יָדְעוּ֙ אָ֣נָה הָלַ֔כְתִּי וּ/מָ֖ה אֲנִ֣י עֹשֶׂ֑ה וְ/לַ/יְּהוּדִ֨ים וְ/לַ/כֹּהֲנִ֜ים וְ/לַ/חֹרִ֣ים וְ/לַ/סְּגָנִ֗ים וּ/לְ/יֶ֨תֶר֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה עַד כֵּ֖ן לֹ֥א הִגַּֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: id
  text: Namun para pejabat tidak tahu ke mana aku pergi atau apa yang sedang kulakukan, dan sampai saat itu aku belum memberi tahu orang-orang Yahudi[a], para imam, para bangsawan, para pejabat, ataupun orang-orang lain yang mengerjakan pekerjaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang Yehuda.” Kata Ibrani יְהוּדִים dapat menunjuk penduduk Yehuda atau komunitas Yahudi secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: para pejabat
  rationale: Istilah ini menunjuk para penguasa atau pejabat bawahan; “para pejabat” jelas dalam bahasa Indonesia modern dan tidak terlalu mempersempitnya menjadi jabatan Persia tertentu.
- source_word: יָדְעוּ
  choice: tidak tahu
  rationale: Bentuk qal dari ידע secara langsung berarti “tahu”; ungkapan ini sesuai dengan gaya naratif yang lugas.
- source_word: אָנָה הָלַכְתִּי
  choice: ke mana aku pergi
  rationale: אָנָה menanyakan arah atau tujuan. Bahasa Indonesia alami memakai “ke mana”; bentuk lampau sudah jelas dari konteks narasi.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: atau apa yang sedang kulakukan
  rationale: Partisipel עֹשֶׂה dapat menyatakan tindakan yang sedang berlangsung. Waw diterjemahkan “atau” agar rangkaian setelah “tidak tahu” alami dalam bahasa Indonesia tanpa mengubah hubungan maknanya.
- source_word: לַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: יְהוּדִים dapat menunjuk orang Yahudi secara umum ataupun penduduk Yehuda. “Orang-orang Yahudi” merupakan padanan baku, dengan alternatif regional dicatat dalam catatan kaki.
- source_word: לַכֹּהֲנִים
  choice: para imam
  rationale: Padanan langsung dan baku untuk כֹּהֲנִים.
- source_word: לַחֹרִים
  choice: para bangsawan
  rationale: Dalam konteks sosial-administratif ini, חֹרִים menunjuk kalangan bangsawan atau pemuka; “para bangsawan” paling tepat dan mudah dipahami.
- source_word: וּלְיֶתֶר
  choice: ataupun orang-orang lain
  rationale: יֶתֶר berarti sisanya. Ungkapan ini alami setelah daftar kelompok dan memperjelas bahwa yang dimaksud ialah orang-orang selebihnya.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: yang akan mengerjakan pekerjaan itu
  rationale: Partisipel tunggal berdaya kolektif ini menerangkan kelompok lain yang terlibat dalam pekerjaan. Dalam konteks sebelum rencana diumumkan dan pembangunan dimulai, bentuk prospektif “akan mengerjakan” lebih alami, meski bentuk Ibrani sendiri dapat dibaca lebih umum.
- source_word: עַד כֵּן
  choice: sampai saat itu
  rationale: Frasa waktu ini menunjuk batas waktu ketika Nehemia masih merahasiakan rencananya.
- source_word: הִגַּדְתִּי
  choice: aku belum memberitahukannya
  rationale: Bentuk hiphil dari נגד berarti memberitahukan atau menyatakan. Akhiran “-nya” secara alami merujuk pada maksud atau pekerjaan yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina orang pertama “aku” mempertahankan narasi pribadi Nehemia. Pengulangan “para pejabat” dipertahankan karena kelompok itu disebut baik pada awal maupun dalam daftar penerima informasi. Penanda catatan kaki [a] ditempatkan langsung setelah padanan istilah Ibrani yang ambigu.
