base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: id
  text: Lalu raja berkata kepadaku, sementara permaisuri[a] duduk di sampingnya, “Berapa lama perjalananmu, dan kapan engkau akan kembali?” Raja berkenan mengutus aku, dan aku menetapkan suatu waktu baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri raja” atau “pendamping raja.” Istilah Ibrani ini menunjuk pada pasangan perempuan raja di lingkungan istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan baku bagi מֶלֶךְ dalam konteks penguasa kerajaan.
- source_word: הַשֵּׁגַל
  choice: permaisuri
  rationale: Istilah langka ini menunjuk pada istri atau pasangan resmi raja. “Permaisuri” alami dalam konteks istana Indonesia dan mempertahankan kedudukan kerajaannya; alternatif dijelaskan dalam catatan kaki.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: duduk di sampingnya
  rationale: Partisip dan frasa preposisional memberi keterangan keadaan yang menunjukkan posisi serta kedekatan sang permaisuri.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Berapa lama perjalananmu
  rationale: Ungkapan waktu Ibrani ini secara idiomatis menanyakan lamanya perjalanan.
- source_word: וּמָתַי תָּשׁוּב
  choice: dan kapan engkau akan kembali
  rationale: שׁוּב berarti kembali; “engkau” mempertahankan nada percakapan yang bermartabat antara raja dan Nehemia.
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ
  choice: Raja berkenan
  rationale: Ungkapan idiomatis Ibrani menyatakan persetujuan atau perkenanan raja, bukan sekadar perasaan senang.
- source_word: וַיִּשְׁלָחֵנִי
  choice: mengutus aku
  rationale: Kata kerja שלח dalam konteks pemberian tugas dan izin resmi paling tepat diterjemahkan “mengutus,” sambil tetap mencakup tindakan menyuruh pergi.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: lalu aku memberitahukan kepadanya jangka waktunya
  rationale: Secara harfiah, Nehemia “memberikan kepadanya suatu waktu.” Dalam bahasa Indonesia, konteks pertanyaan tentang lama perjalanan membuat “memberitahukan ... jangka waktunya” lebih alami tanpa menentukan apakah yang dimaksud tanggal atau durasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Permaisuri” dipilih sebagai istilah istana yang mudah dipahami. Susunan kalimat mempertahankan keterangan bahwa ia duduk di samping raja tanpa menganggapnya sebagai pembicara. “Jangka waktunya” menjaga keluwesan makna זְמָן sebagai waktu atau masa yang telah ditentukan.
