  text: So I came to Jerusalem and was there three days.
translation:
  language: id
  text: Lalu aku tiba di Yerusalem dan tinggal di sana selama tiga hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָבוֹא
  choice: Lalu aku tiba
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. 'Lalu' menyatakan perkembangan peristiwa secara alami, sedangkan 'tiba' sesuai dengan konteks tercapainya tujuan perjalanan.
- source_word: אֶל יְרוּשָׁלָם
  choice: di Yerusalem
  rationale: אֶל menandai Yerusalem sebagai tujuan gerak. Dalam bahasa Indonesia, verba 'tiba' secara idiomatis memakai preposisi 'di', bukan 'ke'.
- source_word: וָאֱהִי שָׁם
  choice: dan tinggal di sana
  rationale: Secara harfiah berarti 'dan aku berada di sana'; dengan keterangan durasi, היה menyatakan keberadaan atau tinggal untuk suatu waktu. 'Tinggal di sana' terdengar alami tanpa menambahkan gagasan menetap.
- source_word: יָמִים שְׁלֹשָׁה
  choice: selama tiga hari
  rationale: Frasa ini merupakan keterangan durasi. 'Selama' membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
