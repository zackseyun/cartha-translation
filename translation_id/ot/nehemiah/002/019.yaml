  text: וַ/יִּשְׁמַע֩ סַנְבַלַּ֨ט הַ/חֹרֹנִ֜י וְ/טֹבִיָּ֣ה הָ/עֶ֣בֶד הָֽ/עַמּוֹנִ֗י וְ/גֶ֨שֶׁם֙ הָֽ/עַרְבִ֔י וַ/יַּלְעִ֣גוּ לָ֔/נוּ וַ/יִּבְז֖וּ עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֣ר אַתֶּ֣ם עֹשִׂ֔ים הַ/עַ֥ל הַ/מֶּ֖לֶךְ אַתֶּ֥ם מֹרְדִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: id
  text: Namun, ketika Sanbalat orang Horon, Tobia, hamba asal Amon[a], dan Gesyem orang Arab mendengar hal itu, mereka mengolok-olok kami dan menghina kami. Mereka berkata, “Apa yang sedang kalian lakukan ini? Apakah kalian sedang memberontak terhadap raja?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tobia, pejabat asal Amon”; sebagian penafsir memahami sebutan ini sebagai gelar jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ketika ... mendengar hal itu
  rationale: Bentuk naratif ini melanjutkan kisah dan menghubungkan apa yang mereka dengar dengan tanggapan bermusuhan yang menyusul. Kata “hal itu” tersirat dari konteks sebelumnya.
- source_word: הַחֹרֹנִי
  choice: orang Horon
  rationale: Menjaga sebutan geografis Sanbalat dalam bentuk yang alami bagi pembaca Indonesia tanpa menentukan Horon mana yang dimaksud.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: hamba asal Amon
  rationale: “Hamba” mempertahankan makna dasar עֶבֶד tanpa memastikan apakah status Tobia adalah budak, pelayan, atau suatu jabatan; “asal Amon” menerangkan identitasnya dengan jelas.
- source_word: הָעַרְבִי
  choice: orang Arab
  rationale: Padanan langsung dan alami bagi sebutan etnis atau wilayah tersebut.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: mereka mengolok-olok ... kami
  rationale: Mengungkapkan ejekan dan cemoohan yang terkandung dalam verba Ibrani.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: menghina kami
  rationale: Padanan ringkas dan kuat bagi tindakan memandang atau memperlakukan orang dengan hina.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Apa yang sedang kalian lakukan ini?
  rationale: Ungkapan Indonesia yang alami, tetap mempertahankan nada pertanyaan tajam dan aspek tindakan yang sedang berlangsung.
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Apakah kalian sedang memberontak terhadap raja?
  rationale: Mempertahankan bentuk pertanyaan yang bersifat menuduh dan tindakan pemberontakan yang sedang dituduhkan.
theological_decisions:
- issue: Makna עֶבֶד dalam sebutan bagi Tobia
  choice: hamba
  alternative: budak; pelayan; pejabat
  rationale: Konteks tidak memastikan status sosial atau fungsi resmi Tobia. “Hamba” mempertahankan rentang makna istilah Ibrani, sedangkan kemungkinan bahwa kata itu merupakan gelar jabatan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak. Susunan kalimat diringankan menjadi dua kalimat agar daftar pelaku dan ucapan langsung mudah dipahami.
