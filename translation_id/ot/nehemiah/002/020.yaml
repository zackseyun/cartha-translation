  naturalness: '"Kemudian aku menjawab mereka, kataku" terdengar tidak lazim dan kaku dalam bahasa Indonesia modern. "Lalu aku menjawab mereka dan berkata" alami, tetap setia pada dua verba Ibrani, dan cocok dengan register naratif. "Tanda peringatan" adalah kolokasi yang lebih jelas daripada "kenangan" dalam triad ini.'
  terminology: '"Allah semesta langit," "hamba-hamba-Nya," "bagian," dan "hak" dapat dipertahankan. "Tanda peringatan" lebih baik untuk זִכָּרוֹן daripada "kenangan"; padanan ini tidak memaksakan apakah yang dimaksud ialah monumen fisik atau status/peringatan publik, dan catatan kaki dapat mencatat keluasan itu.'
