id: NEH.2.20
reference: Nehemiah 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אָשִׁ֨יב אוֹתָ֜/ם דָּבָ֗ר וָ/אוֹמַ֤ר לָ/הֶם֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם ה֚וּא יַצְלִ֣יחַֽ לָ֔/נוּ וַ/אֲנַ֥חְנוּ עֲבָדָ֖י/ו נָק֣וּם וּ/בָנִ֑ינוּ וְ/לָ/כֶ֗ם אֵֽין חֵ֧לֶק וּ/צְדָקָ֛ה וְ/זִכָּר֖וֹן בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: id
  text: Lalu aku menjawab mereka dan berkata, “Allah semesta langit, Dialah yang akan membuat kami berhasil[a]. Kami, hamba-hamba-Nya, akan bangkit dan membangun. Namun, kalian tidak mempunyai bagian, hak, ataupun tanda peringatan[b] di Yerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan memberi kami keberhasilan.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “tanda peringatan” juga dapat menunjuk pada kenangan atau kedudukan yang membuat seseorang tetap diingat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Kemudian aku menjawab mereka, kataku
  rationale: Ungkapan שׁוּב + דָּבָר berarti memberi jawaban. Bentuk ini mempertahankan kedua unsur Ibrani—menjawab dan berkata—tanpa menerjemahkannya secara harfiah dan kaku sebagai ‘mengembalikan perkataan’.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Allah semesta langit
  rationale: Ini adalah gelar ilahi khas masa pascapembuangan. ‘Semesta langit’ secara wajar mencerminkan bentuk Ibrani yang secara harfiah berarti ‘langit-langit’.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina Ibrani bersifat menegaskan; bentuk ‘Dialah’ menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: יַצְלִיחַ לָנוּ
  choice: akan membuat kami berhasil
  rationale: Bentuk kausatif dari צלח menyatakan bahwa Allah memberi atau menyebabkan keberhasilan dalam pekerjaan yang hendak dilakukan.
- source_word: עֲבָדָיו
  choice: hamba-hamba-Nya
  rationale: Dalam konteks ini עבד menekankan pengabdian dan kesetiaan kepada Allah, bukan terutama status sosial sebagai budak.
- source_word: נָקוּם וּבָנִינוּ
  choice: akan bangkit dan membangun
  rationale: ‘Bangkit’ mempertahankan nada tekad untuk mulai bertindak, sedangkan ‘membangun’ mengikuti verba Ibrani tanpa menambahkan gagasan ‘kembali’, walaupun konteksnya ialah pembangunan kembali.
- source_word: אֵין חֵלֶק
  choice: tidak mempunyai bagian
  rationale: חלק menunjuk pada bagian atau jatah yang menjadi milik seseorang; ‘bagian’ jelas dan mempertahankan susunan tiga unsur dalam pernyataan penolakan.
- source_word: וּצְדָקָה
  choice: hak
  rationale: Dalam konteks hukum-politik ini, צְדָקָה menunjuk pada hak atau tuntutan yang sah atas Yerusalem, bukan pada kebajikan moral.
- source_word: וְזִכָּרוֹן
  choice: kenangan
  rationale: Istilah ini secara harfiah menunjuk pada ingatan atau hal yang membuat seseorang tetap diingat. ‘Kenangan’ mempertahankan unsur tersebut tanpa memastikan secara berlebihan bentuk kedudukan publik yang dimaksud.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif yang baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan bagi umat yang mengabdi kepada Allah
  choice: hamba-hamba-Nya
  alternative: budak-budak-Nya
  rationale: Pokok ayat ini adalah kesetiaan dan pelayanan yang mendapat wewenang dari Allah, bukan status perbudakan secara sosial. ‘Hamba’ menyampaikan relasi pengabdian tanpa mengaburkan maksud wacana.
- issue: Makna צְדָקָה dalam rumusan penolakan
  choice: hak
  alternative: tuntutan yang sah; kebenaran
  rationale: Konteksnya menyangkal kedudukan sah para lawan di Yerusalem. ‘Kebenaran’ akan memasukkan kategori moral-teologis yang tidak dituntut oleh konteks ini.
- issue: Makna זִכָּרוֹן dalam rumusan penolakan
  choice: kenangan
  alternative: peringatan; kedudukan yang dikenang
  rationale: Kata Ibrani dapat menunjuk pada ingatan, peringatan, atau kedudukan yang tetap dikenang. Teks utama mempertahankan keluasan maknanya, sedangkan catatan kaki menyebutkan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘kalian’ dipakai karena Nehemia berbicara langsung kepada beberapa lawan. Penekanan הוּא disampaikan dengan ‘Dialah’. Tanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskannya.
