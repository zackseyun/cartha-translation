  text: וַ/יְהִ֣י בְּ/חֹ֣דֶשׁ נִיסָ֗ן שְׁנַ֥ת עֶשְׂרִ֛ים לְ/אַרְתַּחְשַׁ֥סְתְּא הַ/מֶּ֖לֶךְ יַ֣יִן לְ/פָנָ֑י/ו וָ/אֶשָּׂ֤א אֶת הַ/יַּ֨יִן֙ וָ/אֶתְּנָ֣/ה לַ/מֶּ֔לֶךְ וְ/לֹא הָיִ֥יתִי רַ֖ע לְ/פָנָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: id
  text: Pada bulan Nisan, pada tahun kedua puluh pemerintahan Raja Artahsasta, ketika anggur ada di hadapannya, aku mengambil anggur itu lalu memberikannya kepada raja. Aku belum tampak muram di hadapannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku tidak buruk di hadapannya.” Dalam konteks ini, ungkapan Ibrani tersebut berarti bahwa Nehemia tidak tampak muram atau tidak senang di hadapan raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Bentuk pembuka naratif Ibrani ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia modern, peralihan langsung kepada keterangan waktu lebih alami daripada ungkapan harfiah yang kaku seperti “terjadilah”.
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: pada bulan Nisan
  rationale: Mempertahankan bentuk penanggalan resmi dan mentransliterasikan nama bulan sebagai nama diri.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: pada tahun kedua puluh pemerintahan Raja Artahsasta
  rationale: Konstruksi ini menyatakan tahun pemerintahan raja. Penambahan “pemerintahan” membuat maksud penanggalan kerajaan jelas dan wajar dalam bahasa Indonesia.
- source_word: יַיִן לְפָנָיו
  choice: ketika anggur tersedia di hadapannya
  rationale: Klausa tanpa verba ini menggambarkan keadaan di lingkungan istana. “Tersedia” menyampaikan bahwa anggur berada di hadapan raja tanpa menambahkan cawan, yang tidak disebutkan dalam teks.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: aku mengambil anggur itu
  rationale: Dalam konteks pelayanan kepada raja, נשׂא menunjuk pada tindakan mengambil atau mengangkat anggur untuk disajikan. “Mengambil” terdengar alami dan tidak menambahkan benda seperti cawan.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: lalu memberikannya kepada raja
  rationale: Menerjemahkan נתן secara langsung, dengan objek yang sudah disebutkan pada klausa sebelumnya.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Sebelumnya, aku belum pernah tampak muram di hadapannya
  rationale: רַע secara harfiah berarti “buruk/jahat”, tetapi dalam konteks penampilan di hadapan raja mengacu pada wajah atau keadaan yang muram. “Sebelumnya” dan “belum pernah” menyampaikan hubungan waktu lampau dengan peristiwa berikutnya tanpa menjadikan kesedihan sebagai sifat batin semata.
