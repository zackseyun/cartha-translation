source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לִ/י֙ הַ/מֶּ֔לֶךְ עַל מַה זֶּ֖ה אַתָּ֣ה מְבַקֵּ֑שׁ וָֽ/אֶתְפַּלֵּ֔ל אֶל אֱלֹהֵ֖י הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/004.yaml
  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: id
  text: Lalu raja berkata kepadaku, “Apa yang engkau minta?” Maka aku berdoa kepada Allah semesta langit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: minta
  rationale: Dalam konteks pertanyaan raja mengenai permohonan konkret Nehemia, verba ini secara alami berarti “meminta” atau “memohon”; “minta” menghasilkan bahasa Indonesia yang lugas dan wajar.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Allah semesta langit
  rationale: Ungkapan ini mempertahankan konstruksi Ibrani dan cakupan jamak הַשָּׁמָיִם, sekaligus memakai sebutan Indonesia yang alami bagi Allah yang berkuasa atas seluruh langit.
- source_word: וָאֶתְפַּלֵּל
  choice: Maka aku berdoa
  rationale: Bentuk wayyiqtol menyatakan tindakan Nehemia berikutnya; “maka” mempertahankan urutan naratif dan menunjukkan doa singkat sebelum ia menjawab.
theological_decisions:
- issue: Sebutan ilahi אֱלֹהֵי הַשָּׁמָיִם
  choice: Allah semesta langit
  alternative: Allah yang di surga
  rationale: Teks menyebut Allah sebagai “Allah dari/atas langit,” bukan secara langsung “Allah yang berada di surga”; pilihan ini tidak mengubah gelar menjadi pernyataan lokasi.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata ganti “engkau” sesuai dengan percakapan langsung dalam narasi Alkitab, sementara struktur kalimat tetap mudah dipahami pembaca umum.
