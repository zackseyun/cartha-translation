base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: id
  text: Lalu aku sampai kepada para gubernur di wilayah Seberang Sungai[a] dan menyerahkan kepada mereka surat-surat raja. Raja telah mengutus para perwira pasukan dan para penunggang kuda[b] untuk menyertaiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Seberang Sungai”. Ungkapan Ibrani ini kemungkinan menunjuk kepada wilayah administratif Persia di sebelah barat Sungai Efrat, yang juga dikenal sebagai Trans-Efrat.
    reason: cultural_note
  - marker: b
    text: Atau “pasukan berkuda”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: para gubernur
  rationale: Istilah ini menunjuk kepada para pejabat pemerintahan Persia yang memimpin daerah-daerah; “gubernur” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עֵבֶר הַנָּהָר
  choice: wilayah Seberang Sungai
  rationale: Ungkapan ini merupakan sebutan administratif Persia bagi kawasan di sebelah barat Sungai Efrat. “Wilayah” memperjelas fungsi nama itu tanpa memakai istilah teknis yang kurang dikenal.
- source_word: אִגְּרוֹת
  choice: surat-surat
  rationale: Kata ini berarti korespondensi tertulis; dalam konteks ini surat-surat tersebut adalah surat resmi dari raja.
- source_word: שָׂרֵי חַיִל
  choice: para perwira pasukan
  rationale: Frasa ini menunjuk kepada para pemimpin militer. Pilihan ini mempertahankan arti jabatan militer tanpa mempersempit tingkat pangkat mereka.
- source_word: פָרָשִׁים
  choice: para penunggang kuda
  rationale: Terjemahan ini dekat dengan makna harfiahnya, yaitu orang-orang berkuda, dan tidak mengharuskan pemaknaan kolektif “pasukan berkuda”.
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Raja juga telah mengutus bersama aku
  rationale: Bentuk lampau dengan “telah” menyampaikan bahwa pengutusan pengawal itu telah terjadi sebelum Nehemia tiba, sedangkan “juga” menghubungkan keterangan pengawalan secara alami.
- source_word: וָאָבוֹא
  choice: Lalu aku sampai
  rationale: “Lalu” mempertahankan kesinambungan urutan narasi, dan “sampai” sesuai untuk kedatangan di hadapan para pejabat daerah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama administratif “Seberang Sungai” dipertahankan dengan huruf kapital, sementara keterangan “wilayah” membantu pembaca memahami bahwa yang dimaksud bukan sekadar arah geografis. Susunan kalimat mengikuti alur narasi Ibrani secara alami.
