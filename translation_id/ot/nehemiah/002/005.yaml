base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: id
  text: Lalu aku berkata kepada raja, “Jika raja berkenan dan jika hambamu ini mendapat perkenanan di hadapanmu, kiranya raja mengutus aku ke Yehuda, ke kota tempat makam leluhurku[a], supaya aku membangunnya kembali[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke kota makam-makam leluhurku.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai berarti “membangun”; “membangunnya kembali” memperjelas konteks bahwa kota itu telah menjadi reruntuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan istana ini menyatakan persetujuan atau kerelaan raja dengan nada hormat.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: dan jika hambamu ini mendapat perkenanan di hadapanmu
  rationale: Terjemahan ini mempertahankan citra berdiri di hadapan raja sekaligus menyampaikan kedudukan yang diperkenan.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Dalam sapaan kepada raja, kata ini merupakan penyebutan diri yang merendah dan hormat; “hamba” sesuai dengan ragam istana.
- source_word: תִּשְׁלָחֵנִי
  choice: utuslah aku
  rationale: “Utus” secara alami menyampaikan tindakan resmi seorang raja yang mengirim pejabatnya.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: ke kota tempat makam leluhurku
  rationale: Ungkapan ini menyampaikan makna rangkaian konstruksi Ibrani dengan wajar; אבות menunjuk para leluhur, bukan hanya ayah kandung.
- source_word: וְאֶבְנֶנָּה
  choice: supaya aku membangunnya kembali
  rationale: Bentuk kohortatif menyatakan maksud permohonan. Kata dasar berarti “membangun,” sedangkan “kembali” menjelaskan konteks kota yang telah menjadi reruntuhan.
