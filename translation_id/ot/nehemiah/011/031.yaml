base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/031.yaml
  text: And the sons of Benjamin were from Geba[a], Michmash, Aijah, and Bethel and its villages.
translation:
  language: id
  text: Keturunan Benyamin tinggal mulai dari Geba, Mikhmas, Aya[a], Betel beserta desa-desanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ai.” Bentuk Ibraninya di sini adalah עַיָּה (Aya), yang mungkin menunjuk pada tempat yang sama atau pada nama tempat yang berkaitan erat.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: Keturunan Benyamin
  rationale: Secara harfiah berarti “anak-anak Benyamin,” tetapi dalam konteks daftar permukiman menunjuk kepada anggota atau keturunan suku Benyamin. “Keturunan Benyamin” alami dalam bahasa Indonesia dan tetap mempertahankan identitas kesukuan.
- source_word: מִגָּבַע
  choice: tinggal mulai dari Geba
  rationale: Prefiks מִן menyatakan titik awal dalam rangkaian tempat. Kata “tinggal” ditambahkan dari konteks permukiman agar klausa lengkap dan wajar dalam bahasa Indonesia, sedangkan “mulai dari” mempertahankan fungsi מִן.
- source_word: מִכְמָשׂ
  choice: Mikhmas
  rationale: Transliterasi nama tempat Ibrani מִכְמָשׂ dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: וְעַיָּה
  choice: Aya[a]
  rationale: Bentuk Ibrani עַיָּה direpresentasikan sebagai “Aya.” Kemungkinan kaitannya dengan nama tempat Ai dicatat dalam catatan kaki tanpa menyamakan keduanya secara pasti.
- source_word: וּבֵית אֵל
  choice: Betel
  rationale: Bentuk nama tempat yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּבְנֹתֶיהָ
  choice: dan desa-desa di sekitarnya
  rationale: Secara harfiah “dan anak-anak perempuannya,” yaitu ungkapan bagi permukiman bawahan atau desa-desa yang bergantung pada kota utama. Terjemahan ini menyampaikan maksud geografisnya secara alami.
theological_decisions: []
