  text: וּ/בְ/צִֽקְלַ֥ג וּ/בִ/מְכֹנָ֖ה וּ/בִ/בְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/028.yaml
  text: and in Ziklag[a], and in Mekonah and its daughter villages.
translation:
  language: id
  text: juga di Ziklag, di Mekona, dan di desa-desa bawahannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, yaitu ungkapan Ibrani untuk desa-desa atau permukiman-permukiman kecil yang bergantung pada Mekona.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצִקְלַג
  choice: juga di Ziklag
  rationale: Prefiks וּ dan בְ menyambungkan daftar sebelumnya dan menandai lokasi. Nama tempat צִקְלַג ditransliterasikan sebagai “Ziklag”.
- source_word: וּבִמְכֹנָה
  choice: di Mekona
  rationale: Nama tempat מְכֹנָה ditransliterasikan menurut bentuk Ibrani sebagai “Mekona”; konjungsi berulang tidak perlu selalu dinyatakan dalam bahasa Indonesia agar daftar tetap alami.
- source_word: וּבִבְנֹתֶיהָ
  choice: dan di desa-desa bawahannya
  rationale: Secara harfiah berarti “dan di anak-anak perempuannya”, tetapi dalam konteks permukiman merupakan idiom bagi desa atau permukiman kecil yang bergantung pada kota induk. Sufiks feminin tunggal merujuk kepada Mekona.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern dan lugas; bentuk “desa-desa bawahannya” menyampaikan hubungan administratif atau ketergantungan sambil mempertahankan catatan tentang metafora Ibrani dalam catatan kaki.
