translation:
  language: id
  text: Lod dan Ono, Lembah Para Perajin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lembah Para Pekerja Terampil”; istilah Ibrani ini dapat secara lebih khusus menunjuk pada pekerja seperti pandai besi.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹד
  choice: Lod
  rationale: Nama tempat ditransliterasikan sebagai “Lod”, sesuai bentuk yang lazim dan tanpa menerjemahkannya.
- source_word: וְ/אוֹנוֹ
  choice: dan Ono
  rationale: Konjungsi וְ diterjemahkan secara langsung sebagai “dan”, sedangkan nama tempat אוֹנוֹ ditransliterasikan “Ono”.
- source_word: גֵּי
  choice: Lembah
  rationale: Bentuk konstruksi dari גַּי menunjuk pada sebuah lembah yang ditentukan oleh nomina sesudahnya. Dalam nama geografis ini, susunan Indonesia “Lembah Para Pengrajin” menyampaikan hubungan tersebut dengan wajar.
- source_word: הַחֲרָשִׁים
  choice: Para Pengrajin
  rationale: Kata ini dapat menunjuk pada para pekerja terampil atau pengrajin secara umum, dan dalam konteks tertentu pada pandai besi. Pilihan umum “Para Pengrajin” mempertahankan keluasan makna Ibrani dan cocok sebagai unsur nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama tempat dipertahankan melalui transliterasi; nama geografis “Lembah Para Pengrajin” memakai kapitalisasi untuk menunjukkan fungsi toponimik. Bentuk “pengrajin” dipilih karena sangat mudah dipahami, sementara alternatif “perajin” dicatat dalam catatan kaki.
