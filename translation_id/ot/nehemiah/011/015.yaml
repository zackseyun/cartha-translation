id: NEH.11.15
reference: Nehemiah 11:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִֽן הַ/לְוִיִּ֑ם שְׁמַעְיָ֧ה בֶן חַשּׁ֛וּב בֶּן עַזְרִיקָ֥ם בֶּן חֲשַׁבְיָ֖ה בֶּן בּוּנִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/015.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, son of Bunni.'
translation:
  language: id
  text: 'Dan dari antara orang-orang Lewi: Semaya anak Hasub[a], anak Azrikam, anak Hasabya, anak Buni.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “anak” dalam daftar silsilah kadang-kadang dapat berarti keturunan yang lebih jauh, bukan selalu hubungan langsung antara ayah dan anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: Dan dari antara
  rationale: Kata sambung וּ mengaitkan ayat ini dengan daftar sebelumnya, sedangkan מִן menyatakan bahwa nama yang disebut berasal dari kelompok orang Lewi.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Istilah ini menunjuk kepada anggota suku Lewi sebagai suatu kelompok; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: שְׁמַעְיָה
  choice: Semaya
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶן secara formal berarti 'anak', tetapi dapat pula menunjuk kepada keturunan yang lebih jauh; struktur Ibrani dipertahankan dan cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: חַשּׁוּב
  choice: Hasub
  rationale: Transliterasi nama diri yang wajar dalam bahasa Indonesia; penggandaan konsonan Ibrani tidak perlu ditampilkan.
- source_word: עַזְרִיקָם
  choice: Azrikam
  rationale: Transliterasi langsung nama diri Ibrani dalam bentuk yang mudah dibaca pembaca Indonesia.
- source_word: חֲשַׁבְיָה
  choice: Hasabya
  rationale: Transliterasi nama diri yang mengikuti pola ejaan Alkitab bahasa Indonesia dan mencerminkan unsur akhir יָה.
- source_word: בּוּנִּי
  choice: Buni
  rationale: Transliterasi nama diri yang alami dalam ejaan Indonesia tanpa penggandaan konsonan.
