id: NEH.11.11
reference: Nehemiah 11:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׂרָיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖ד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/011.yaml
  text: Seraiah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub[b], leader of the house of God.
translation:
  language: id
  text: Seraya anak Hilkia, anak Mesulam, anak Zadok, anak Merayot, anak Ahitub, pemimpin[a] rumah Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala” atau “pengawas”.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, Bait Allah.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Rumus silsilah yang berulang paling wajar diterjemahkan sebagai “anak”; meskipun silsilah Ibrani kadang dapat melompati generasi, konteks ini tidak menuntut istilah yang lebih umum seperti “keturunan”.
- source_word: נְגִיד
  choice: pemimpin
  rationale: Kata ini menunjuk kepada orang yang ditempatkan sebagai pemimpin atau penanggung jawab. “Pemimpin” jelas dalam bahasa Indonesia modern dan tidak membawa nuansa kerajaan yang terlalu kuat.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Ungkapan harfiahnya ialah “rumah Allah”. Bentuk ini tetap alami dalam bahasa Indonesia dan mempertahankan citra bahasa Ibrani, sementara rujukannya kepada Bait Allah dijelaskan dalam catatan kaki.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam frasa ini, אֱלֹהִים merujuk kepada Allah Israel dan karena itu diterjemahkan dalam bentuk tunggal sebagai “Allah”.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama memakai bentuk transliterasi yang lazim dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya: [a] sesudah “pemimpin” dan [b] sesudah “rumah Allah”.'
