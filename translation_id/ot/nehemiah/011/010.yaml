- source_word: יְדַעְיָה
  choice: Yedaya
  rationale: Transliterasi nama Ibrani yang lazim dan dekat dengan bentuk sumber.
- source_word: בֶן
  choice: anak
  rationale: Padanan langsung untuk penanda hubungan keturunan dalam daftar nama.
- source_word: יוֹיָרִיב
  choice: Yoyarib
  rationale: Transliterasi yang mempertahankan bunyi nama Ibrani secara wajar dalam ejaan Indonesia.
- source_word: יָכִין
  choice: Yakhin
  rationale: Transliterasi Indonesia yang membedakan konsonan Ibrani khaf melalui 'kh' dan tidak mengalihkannya melalui bentuk Inggris 'Jakin'.
