  yaml_path: translation/ot/nehemiah/011/009.yaml
  text: And Joel son of Zichri was overseer over them[a], and Judah son of Hassenuah was second over the city.
translation:
  language: id
  text: Yoel anak Zikhri adalah pengawas atas mereka, dan Yehuda anak Hasenua adalah pejabat kedua atas kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wakil yang bertanggung jawab atas kota itu” atau “orang kedua dalam pemerintahan kota itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקִיד
  choice: pengawas
  rationale: Kata ini menunjuk kepada orang yang ditunjuk untuk mengawasi atau mengurus; “pengawas” mempertahankan nuansa administratif tanpa mempersempitnya menjadi jabatan militer tertentu.
- source_word: עֲלֵיהֶם
  choice: mereka
  rationale: Dalam frasa “menjadi pengawas mereka,” objek ini menyatakan orang-orang yang berada di bawah pengawasan Yoel secara alami dalam bahasa Indonesia.
- source_word: מִשְׁנֶה
  choice: orang kedua
  rationale: Istilah ini menunjuk kepada pejabat berperingkat kedua atau wakil. “Orang kedua” mempertahankan keringkasan dan keterbukaan makna teks Ibrani.
- source_word: עַל הָעִיר
  choice: yang memimpin kota itu
  rationale: Preposisi ini menyatakan kewenangan atau tanggung jawab atas kota. Ungkapan ini alami dalam bahasa Indonesia dan, bersama “orang kedua,” menunjukkan kedudukan dalam pemerintahan kota.
- source_word: הַסְּנוּאָה
  choice: Hasenua
  rationale: Nama orang atau keluarga ini ditransliterasikan, dengan unsur artikel Ibrani dipertahankan sebagai bagian dari bentuk nama.
- source_word: וְ
  choice: dan
  rationale: Kata sambung dipertahankan untuk menghubungkan kedua pejabat yang disebutkan dalam ayat ini.
