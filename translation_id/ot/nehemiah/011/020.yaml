  text: וּ/שְׁאָ֨ר יִשְׂרָאֵ֜ל הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ בְּ/כָל עָרֵ֣י יְהוּדָ֔ה אִ֖ישׁ בְּ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/020.yaml
  text: And the rest of Israel[a], the priests, and the Levites were in all the cities of Judah, each in his inheritance.
translation:
  language: id
  text: Sisa orang Israel, para imam, dan orang Lewi tinggal di semua kota Yehuda, masing-masing[a] di tanah warisannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang di tanah warisannya”; bentuk tunggal ini digunakan secara distributif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר יִשְׂרָאֵל
  choice: Selebihnya dari orang Israel
  rationale: שְׁאָר menunjuk kepada bagian yang masih tersisa, dalam kontras dengan mereka yang telah disebut tinggal di Yerusalem. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan Israel sebagai nama umat.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dan wajar bagi bentuk jamak כֹּהֲנִים, yaitu golongan imam.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Padanan baku bagi anggota suku atau golongan Lewi; bentuk ini lebih alami daripada transliterasi nominal yang kurang umum bagi pembaca Indonesia.
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: di semua kota Yehuda
  rationale: Preposisi בְּ bersifat lokatif, dan frasa ini secara langsung menyatakan lokasi mereka di kota-kota wilayah Yehuda.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Walaupun secara leksikal berarti 'orang' atau 'laki-laki', di sini אִישׁ berfungsi distributif. 'Masing-masing' menyampaikan fungsi itu dengan jelas dan alami.
- source_word: בְּנַחֲלָתוֹ
  choice: di tanah warisannya
  rationale: נַחֲלָה menunjuk kepada milik pusaka atau bagian tanah yang diwariskan atau dialokasikan. Penambahan 'tanah' memperjelas konteks wilayah tanpa mereduksinya menjadi sekadar properti.
theological_decisions:
- issue: Bahasa maskulin tunggal yang berfungsi distributif
  choice: masing-masing di tanah warisannya
  alternative: setiap orang di tanah warisannya
  rationale: Bahasa Ibrani memakai אִישׁ dan sufiks maskulin tunggal secara distributif. Terjemahan ini mempertahankan gagasan kepemilikan individual tanpa menjadikan jenis kelamin lebih tegas daripada yang diperlukan oleh fungsi ungkapan tersebut.
- issue: Hubungan antara Israel, para imam, dan orang Lewi
  choice: orang Israel, para imam, dan orang Lewi
  alternative: orang Israel—yakni para imam dan orang Lewi
  rationale: Teks Ibrani menempatkan ketiga sebutan secara berurutan tanpa penanda eksplisit bahwa dua kelompok terakhir merupakan penjelasan pembatas bagi yang pertama. Tanda koma mempertahankan pembacaan daftar dan tidak memasukkan hubungan penjelas yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata kerja 'tinggal' ditambahkan secara wajar untuk mengungkapkan klausa nominal Ibrani dalam bahasa Indonesia. 'Tanah warisan' mempertahankan nuansa bagian tanah pusaka dalam konteks Yehuda.
