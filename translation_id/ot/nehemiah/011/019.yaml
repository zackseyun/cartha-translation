base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/019.yaml
  text: 'And the gatekeepers: Akkub[a], Talmon, and their brothers who kept watch at the gates, were one hundred seventy-two.'
translation:
  language: id
  text: 'Para penjaga pintu gerbang: Akub, Talmon, dan saudara-saudara mereka[a] yang berjaga di pintu-pintu gerbang, seluruhnya 172 orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat mereka” atau “rekan-rekan sekelompok mereka”; kata Ibrani yang diterjemahkan “saudara-saudara” dapat menunjuk pada kerabat laki-laki dekat atau sesama anggota kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשּׁוֹעֲרִים
  choice: para penjaga pintu gerbang
  rationale: Istilah ini menunjuk pada orang-orang yang ditugaskan menjaga atau melayani di pintu gerbang. Ungkapan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan fungsi resmi mereka.
- source_word: עַקּוּב
  choice: Akub
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: טַלְמוֹן
  choice: Talmon
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַאֲחֵיהֶם
  choice: dan saudara-saudara mereka
  rationale: Kata אָח pada dasarnya berarti 'saudara laki-laki', tetapi dalam daftar kelompok dapat pula merujuk pada kerabat atau sesama anggota kelompok. Terjemahan utama mempertahankan ungkapan Ibrani, sedangkan cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: הַשֹּׁמְרִים
  choice: yang berjaga
  rationale: Bentuk partisip ini menggambarkan tugas yang berlangsung. 'Berjaga' merupakan ungkapan Indonesia yang alami untuk pelaksanaan tugas pengamanan.
- source_word: בַּשְּׁעָרִים
  choice: di pintu-pintu gerbang
  rationale: Frasa ini menyatakan lokasi tempat mereka bertugas. Bentuk jamak dipertahankan sesuai teks Ibrani.
- source_word: מֵאָה שִׁבְעִים וּשְׁנָיִם
  choice: seluruhnya 172 orang
  rationale: Bilangan ini menyatakan jumlah keseluruhan kelompok. Penambahan 'seluruhnya' dan 'orang' membuat fungsi bilangan jelas dan alami tanpa mengubah makna.
