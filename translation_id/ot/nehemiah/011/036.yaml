  text: And from the Levites[a], divisions in Judah belonged to Benjamin.
translation:
  language: id
  text: Sebagian dari kelompok-kelompok orang Lewi di Yehuda diperuntukkan bagi Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari orang-orang Lewi, kelompok-kelompok di Yehuda diperuntukkan bagi Benyamin.” Teks Ibrani sangat ringkas; hubungan yang tepat antara “Yehuda” dan “Benyamin” tidak dinyatakan secara lengkap.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן
  choice: Sebagian dari
  rationale: Gabungan kata penghubung dan preposisi menyatakan bahwa yang dimaksud ialah sejumlah kelompok dari antara orang Lewi; dalam bahasa Indonesia, “sebagian dari” menyampaikan hubungan partitif ini secara alami.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Istilah ini secara langsung menunjuk kepada kaum Lewi; “orang Lewi” adalah padanan baku dan mudah dipahami.
- source_word: מַחְלְקוֹת
  choice: kelompok-kelompok
  rationale: Kata jamak ini menunjuk pada pembagian atau kelompok yang terorganisasi. “Kelompok-kelompok” lebih alami dalam bahasa Indonesia daripada “bagian-bagian” tanpa terlalu menentukan bentuk organisasinya.
- source_word: יְהוּדָה
  choice: di Yehuda
  rationale: Susunan Ibrani sangat ringkas. Dalam konteks daftar permukiman, hubungan lokatif dengan Yehuda masuk akal, tetapi tetap tidak sepenuhnya pasti.
- source_word: לְבִנְיָמִין
  choice: menjadi bagian dari Benyamin
  rationale: Preposisi לְ menyatakan hubungan atau peruntukan. Ungkapan ini menyampaikan kemungkinan bahwa kelompok-kelompok tersebut dikaitkan atau dialihkan kepada Benyamin tanpa menentukan mekanismenya.
