  source_fidelity: Teks utama menangkap pembagian/penugasan kelompok Lewi yang berkaitan dengan Yehuda dan Benyamin, tetapi “menjadi bagian dari Benyamin” terlalu mengarah pada penggabungan identitas atau wilayah. Preposisi לְ lebih baik dinyatakan sebagai hubungan penugasan/peruntukan, sambil mempertahankan elipsis Ibrani.
  naturalness: “Kelompok-kelompok orang Lewi” dan “di Yehuda” alami dalam bahasa Indonesia modern. “Diperuntukkan bagi Benyamin” lebih idiomatis dan lebih dekat pada relasi yang tidak diperinci daripada “menjadi bagian dari Benyamin.”
  terminology: “Orang Lewi,” “Yehuda,” dan “Benyamin” sudah tepat dan konsisten. “Kelompok-kelompok” merupakan padanan yang wajar untuk מַחְלְקוֹת dalam kalimat yang sangat ringkas ini.
