    rationale: Frasa itu dapat dibaca sebagai kelompok yang bernama Yehuda, bukan kelompok yang berkaitan dengan Yehuda. “Kelompok-kelompok di Yehuda” atau “dari Yehuda” lebih jelas, sambil catatan menjelaskan bahwa hubungan sintaktisnya tidak pasti.
