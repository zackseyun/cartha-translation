id: NEH.11.4
reference: Nehemiah 11:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִֽ/ירוּשָׁלִַ֨ם֙ יָֽשְׁב֔וּ מִ/בְּנֵ֥י יְהוּדָ֖ה וּ/מִ/בְּנֵ֣י בִנְיָמִ֑ן מִ/בְּנֵ֣י יְ֠הוּדָה עֲתָיָ֨ה בֶן עֻזִּיָּ֜ה בֶּן זְכַרְיָ֧ה בֶן אֲמַרְיָ֛ה בֶּן שְׁפַטְיָ֥ה בֶן מַהֲלַלְאֵ֖ל מִ/בְּנֵי פָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/004.yaml
  text: 'And in Jerusalem there lived some of the sons of Judah and some of the sons of Benjamin[a]. Of the sons of Judah: Athaiah son of Uzziah, son of Zechariah, son of Amariah, son of Shephatiah, son of Mahalalel[b], of the sons of Perez.'
translation:
  language: id
  text: 'Di Yerusalem tinggal sebagian dari keturunan Yehuda dan sebagian dari keturunan Benyamin.[a] Dari keturunan Yehuda: Ataya anak Uzia, anak Zakharia, anak Amarya, anak Shefatya, anak Mahalaleel, dari keturunan Peres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “keturunan Yehuda” dan “keturunan Benyamin” berarti para anggota atau keturunan dari garis kedua suku itu.
    reason: cultural_note
lexical_decisions:
- source_word: וּבִירוּשָׁלַם
  choice: Di Yerusalem
  rationale: Kata penghubung waw melanjutkan konteks sebelumnya, tetapi dalam bahasa Indonesia awal kalimat tanpa “dan” lebih alami dan tidak menghilangkan kesinambungan daftar.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: ישב dalam konteks ini menyatakan bermukim atau bertempat tinggal; “tinggal” alami dalam bahasa Indonesia modern dan tetap mempertahankan cakupan dasar katanya.
- source_word: מִבְּנֵי יְהוּדָה וּמִבְּנֵי בִנְיָמִן
  choice: sebagian dari keturunan Yehuda dan sebagian dari keturunan Benyamin
  rationale: Preposisi partitif מִן menunjukkan sebagian dari kelompok, sedangkan בְּנֵי dalam konteks suku menunjuk para anggota atau keturunan garis suku, bukan hanya anak biologis langsung.
- source_word: מִבְּנֵי יְהוּדָה
  choice: 'Dari keturunan Yehuda:'
  rationale: Kemunculan kedua memperkenalkan nama-nama dari kelompok Yehuda dan berfungsi secara alami sebagai pembuka daftar.
- source_word: עֲתָיָה
  choice: Ataya
  rationale: Transliterasi Indonesia yang mendekati bentuk Ibrani dan sesuai pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Terjemahan formal dan lazim untuk hubungan dalam silsilah; kemungkinan adanya pelompatan generasi tidak diselesaikan secara diam-diam.
- source_word: עֻזִּיָּה
  choice: Uzia
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Transliterasi modern yang menjaga bunyi konsonan Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֲמַרְיָה
  choice: Amarya
  rationale: Transliterasi yang dekat dengan bentuk Ibrani.
- source_word: שְׁפַטְיָה
  choice: Shefatya
  rationale: Transliterasi yang dekat dengan bentuk Ibrani serta mudah dibaca oleh pembaca Indonesia.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleel
  rationale: Bentuk nama yang transparan terhadap unsur-unsur bentuk Ibrani dan dikenal dalam penggunaan Alkitab Indonesia.
- source_word: פָרֶץ
  choice: Peres
  rationale: Bentuk nama yang lazim dan alami dalam ejaan bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dipertahankan secara ringkas; istilah “keturunan” dipakai agar makna kesukuan בְּנֵי jelas bagi pembaca umum, sedangkan “anak” dipertahankan dalam rantai nama untuk mencerminkan bentuk Ibrani.
