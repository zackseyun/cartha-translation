base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/014.yaml
  text: And their brothers[a], mighty men of valor, were one hundred twenty-eight; and the overseer over them was Zabdiel son of Haggedolim.
translation:
  language: id
  text: Saudara-saudara mereka, orang-orang yang gagah perkasa, berjumlah 128 orang. Pengawas mereka ialah Zabdiel bin Haggedolim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “putra orang-orang besar” atau “putra kaum bangsawan.” Ungkapan Ibrani ini mungkin merupakan frasa deskriptif, bukan nama diri.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Saudara-saudara mereka
  rationale: Secara harfiah berarti “saudara-saudara mereka” dan dalam daftar ini menunjuk kepada para anggota laki-laki yang tergabung dalam kelompok yang sama.
- source_word: גִּבּוֹרֵי חַיִל
  choice: orang-orang yang gagah perkasa
  rationale: Ungkapan ini menggambarkan orang yang kuat, cakap, dan berani. Pilihan ini mempertahankan kekuatan ungkapan Ibrani tanpa memastikan bahwa jabatan mereka khusus bersifat militer.
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: 128 orang
  rationale: Angka kardinal ini secara langsung berarti seratus dua puluh delapan; kata “orang” ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas hitungan manusia.
- source_word: וּפָקִיד עֲלֵיהֶם
  choice: Pengawas mereka ialah
  rationale: פָקִיד menunjuk kepada seseorang yang diangkat untuk mengawasi atau membawahi orang lain. “Pengawas” sesuai dengan konteks organisasi tanpa memberi kesan jabatan militer yang tidak pasti.
- source_word: זַבְדִּיאֵל
  choice: Zabdiel
  rationale: Nama pribadi ini ditransliterasikan dalam bentuk yang jelas dan lazim bagi pembaca bahasa Indonesia.
- source_word: בֶּן הַגְּדוֹלִים
  choice: bin Hagedolim
  rationale: הַגְּדוֹלִים mungkin berfungsi sebagai nama keluarga atau kelompok. Karena itu, teks utama mempertahankannya sebagai nama diri, sedangkan kemungkinan makna deskriptif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Bin” dipakai secara alami dalam silsilah laki-laki. Penanda catatan kaki ditempatkan sesudah “Hagedolim” karena catatan tersebut menjelaskan frasa בֶּן הַגְּדוֹלִים, bukan “saudara-saudara mereka”.
