source:
  edition: WLC
  text: זָנֹ֤חַ עֲדֻלָּם֙ וְ/חַצְרֵי/הֶ֔ם לָכִישׁ֙ וּ/שְׂדֹתֶ֔י/הָ עֲזֵקָ֖ה וּ/בְנֹתֶ֑י/הָ וַ/יַּחֲנ֥וּ מִ/בְּאֵֽר שֶׁ֖בַע עַד גֵּֽיא הִנֹּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/030.yaml
  text: Zanoah[a], Adullam and their villages, Lachish and its fields, Azekah and its daughter towns[b]. So they camped from Beer-sheba as far as the Valley of Hinnom.
translation:
  language: id
  text: Zanoah, Adulam beserta desa-desa mereka, Lakhis beserta ladang-ladangnya, dan Azeka beserta kota-kota bawahannya[a]. Mereka berkemah[b] dari Bersyeba sampai ke Lembah Hinom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”; maksudnya, desa-desa atau kota-kota yang bergantung pada Azeka.
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנֹחַ
  choice: Zanoah
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֲדֻלָּם
  choice: Adulam
  rationale: Nama tempat ditransliterasikan secara wajar dalam ejaan Indonesia.
- source_word: חַצְרֵיהֶם
  choice: desa-desa mereka
  rationale: Dalam daftar permukiman, חָצֵר menunjuk pada desa atau permukiman pedesaan yang terkait dengan kota-kota tersebut; pronomina jamaknya dipertahankan.
- source_word: לָכִישׁ
  choice: Lakhis
  rationale: Transliterasi nama tempat mengikuti bentuk Indonesia yang mudah dikenali.
- source_word: שְׂדֹתֶיהָ
  choice: ladang-ladangnya
  rationale: Mempertahankan arti konkret שָׂדֶה dan pronomina feminin tunggal yang merujuk kepada Lakhis.
- source_word: עֲזֵקָה
  choice: Azeka
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia.
- source_word: בְנֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Ungkapan Ibrani harfiah 'anak-anak perempuannya' merupakan idiom bagi permukiman yang bergantung pada sebuah kota induk; pilihan ini menyampaikan hubungan tersebut secara alami.
- source_word: וַיַּחֲנוּ
  choice: mereka menetap
  rationale: חנה secara dasar berarti berkemah, tetapi dalam konteks daftar penduduk yang mendiami kembali wilayah, 'menetap' menyampaikan perluasan makna kontekstualnya tanpa menghilangkan arti harfiah, yang dicatat dalam catatan kaki.
- source_word: מִבְּאֵר שֶׁבַע
  choice: dari Bersyeba
  rationale: Nama tempat memakai bentuk yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: עַד
  choice: sampai ke
  rationale: Secara alami menyatakan batas jangkauan geografis.
- source_word: גֵּיא הִנֹּם
  choice: Lembah Hinom
  rationale: Menerjemahkan unsur geografis גֵּיא dan mentransliterasikan nama Hinom.
