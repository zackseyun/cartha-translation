  text: וַ/אֲחֵי/הֶ֗ם עֹשֵׂ֤י הַ/מְּלָאכָה֙ לַ/בַּ֔יִת שְׁמֹנֶ֥ה מֵא֖וֹת עֶשְׂרִ֣ים וּ/שְׁנָ֑יִם וַ֠/עֲדָיָה בֶּן יְרֹחָ֤ם בֶּן פְּלַלְיָה֙ בֶּן אַמְצִ֣י בֶן זְכַרְיָ֔ה בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/012.yaml
  text: And their brothers[a], doers of the work for the house, were eight hundred twenty-two; and Adaiah son of Jeroham, son of Pelaliah, son of Amzi, son of Zechariah, son of Pashhur, son of Malchijah.
translation:
  language: id
  text: Dan saudara-saudara mereka yang melakukan pekerjaan untuk rumah itu[a] berjumlah 822 orang. Dan Adaya anak Yeroham, anak Pelalya, anak Amzi, anak Zakharia, anak Pasyhur, anak Malkia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang bekerja untuk Bait Allah.” Secara harfiah bahasa Ibrani berbunyi “yang melakukan pekerjaan untuk rumah itu”; dalam konteks ini, “rumah itu” merujuk kepada Bait Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: Dan saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan harfiah Ibrani. Dalam konteks ini mereka adalah sesama anggota kelompok imam, tetapi ayat ini sendiri menyebut mereka 'saudara-saudara'.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: yang melakukan pekerjaan
  rationale: Mencerminkan konstruksi partisipial Ibrani secara alami dalam bahasa Indonesia tanpa mempersempit jenis pekerjaannya.
- source_word: לַבַּיִת
  choice: untuk rumah itu
  rationale: בַּיִת secara harfiah berarti 'rumah'; konteksnya menunjuk kepada Bait Allah, tetapi sebutan eksplisit 'rumah Allah' tidak terdapat dalam teks sumber.
- source_word: שְׁמֹנֶה מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 822 orang
  rationale: Menyampaikan bilangan kardinal secara jelas dan menambahkan penggolong 'orang' yang wajar dalam bahasa Indonesia.
- source_word: וַעֲדָיָה
  choice: Lalu Adaya
  rationale: Konjungsi waw meneruskan daftar. 'Lalu' membantu menandai peralihan ke nama berikutnya secara alami.
- source_word: בֶּן
  choice: anak
  rationale: Mempertahankan rumusan silsilah standar Ibrani tanpa mengubahnya menjadi istilah yang lebih umum seperti 'keturunan'.
- source_word: יְרֹחָם / פְּלַלְיָה / אַמְצִי / זְכַרְיָה / פַּשְׁחוּר / מַלְכִּיָּה
  choice: Yeroham / Pelalya / Amzi / Zakharia / Pasyhur / Malkia
  rationale: Nama-nama pribadi dialihaksarakan dalam bentuk yang wajar dan mudah dibaca oleh pembaca Indonesia, dengan mempertahankan pembedaan nama-nama sumber.
theological_decisions:
- issue: Identitas 'rumah' dalam frasa לַבַּיִת
  choice: Teks utama mempertahankan 'rumah itu', dengan catatan bahwa konteks menunjuk kepada Bait Allah.
  alternative: Menerjemahkan langsung 'untuk Bait Allah'.
  rationale: Pilihan ini menjaga ungkapan sumber serta rujukan kontekstualnya tanpa memasukkan kata 'Allah' yang tidak eksplisit pada ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, sementara istilah kekerabatan dan ungkapan 'rumah itu' dipertahankan untuk menjaga kedekatan dengan teks Ibrani.
