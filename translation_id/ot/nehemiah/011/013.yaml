translation:
  language: id
  text: dan saudara-saudaranya, para kepala kaum keluarga[a], 242 orang; dan Amashsai anak Azarel, anak Ahzai, anak Mesilemot, anak Imer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “para kepala leluhur”; ungkapan ini menunjuk kepala-kepala kelompok keluarga atau klan yang berakar pada leluhur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Terjemahan langsung yang wajar; dalam konteks kelompok imam, bentuk jamak ini juga dapat mencakup kerabat atau rekan sekaum.
- source_word: רָאשִׁים לְאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini menunjuk para pemimpin kelompok leluhur atau keluarga besar; 'kaum keluarga' mempertahankan corak sosial-genealogisnya sekaligus alami dalam bahasa Indonesia.
- source_word: מָאתַיִם אַרְבָּעִים וּשְׁנָיִם
  choice: 242 orang
  rationale: Bilangan Ibrani berjumlah 242; 'orang' ditambahkan secara wajar untuk memperjelas bahwa ini jumlah anggota kelompok.
- source_word: וַעֲמַשְׁסַי
  choice: dan Amasai
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia; bentuk Masoretiknya lebih harfiah dapat direpresentasikan sebagai 'Amashsai'.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah, בֶּן secara normal berarti 'anak', meskipun dalam penggunaan genealogis kadang dapat mencakup keturunan.
- source_word: עֲזַרְאֵל
  choice: Azarel
  rationale: Transliterasi nama diri Ibrani yang jelas dalam bahasa Indonesia.
- source_word: אַחְזַי
  choice: Ahzai
  rationale: Transliterasi langsung bentuk Ibrani pada ayat ini.
- source_word: מְשִׁלֵּמוֹת
  choice: Mesilemot
  rationale: Transliterasi yang disesuaikan dengan ejaan Indonesia tanpa mempertahankan penggandaan konsonan yang tidak fonemis dalam bahasa Indonesia.
- source_word: אִמֵּר
  choice: Imer
  rationale: Transliterasi yang alami menurut ejaan Indonesia; nama ini juga merujuk pada keluarga imam dalam konteks tersebut.
