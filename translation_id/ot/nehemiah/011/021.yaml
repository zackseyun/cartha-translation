  yaml_path: translation/ot/nehemiah/011/021.yaml
  text: And the temple servants were living on the Ophel[a], and Ziha and Gishpa were over the temple servants.
translation:
  language: id
  text: Para pelayan Bait Allah[a] tinggal di Ofel, dan Ziha serta Gispa mengepalai para pelayan Bait Allah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Netinim, istilah khusus bagi suatu kelompok yang ditugaskan untuk melayani di Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah teknis pascapembuangan ini menunjuk pada kelompok yang ditugaskan untuk pelayanan Bait Allah. Terjemahan fungsional lebih mudah dipahami daripada transliterasi "Netinim", sambil tetap mempertahankan sifat kelembagaannya.
- source_word: יֹשְׁבִים
  choice: tinggal
  rationale: Partisip verba ישב menyatakan keadaan menetap yang sedang berlangsung; "tinggal" merupakan ungkapan Indonesia modern yang alami.
- source_word: בָּעֹפֶל
  choice: di Ofel
  rationale: עֹפֶל merupakan nama tempat atau sebutan topografis. Bahasa Indonesia secara idiomatis memakai "di" untuk lokasi tempat tinggal.
- source_word: צִיחָא
  choice: Ziha
  rationale: Nama diri ditransliterasikan secara langsung ke dalam ejaan Indonesia.
- source_word: גִשְׁפָּא
  choice: Gispa
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia; שׁ direpresentasikan dengan "s".
- source_word: עַל
  choice: mengawasi
  rationale: Dalam konteks administratif, עַל menunjukkan kewenangan atau tanggung jawab atas suatu kelompok. "Mengawasi" menyampaikan fungsi tersebut secara alami tanpa menambahkan gagasan pengangkatan yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. "Bait Allah" dipakai agar fungsi kelompok ini jelas, sementara nama diri disesuaikan dengan ejaan Indonesia. Penanda catatan kaki [a] ditempatkan setelah "Ofel" sesuai lapisan konsultasi, tetapi isi catatan menjelaskan istilah "para pelayan Bait Allah".
