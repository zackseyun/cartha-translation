  terminology: '"Pengawas", "orang-orang Lewi", "bin", "keturunan Asaf", dan "para penyanyi" sesuai register Alkitabiah Indonesia yang modern. "Rumah Allah" dipertahankan sebagai padanan dekat bagi בֵּית הָאֱלֹהִים, sambil menggunakan "di rumah Allah" dalam konstruksi pekerjaan agar maknanya tidak rancu.'
