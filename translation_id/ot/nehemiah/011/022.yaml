  to: Pengawas orang-orang Lewi di Yerusalem ialah Uzi bin Bani, bin Hasabya, bin Matanya, bin Mikha, dari keturunan Asaf, para penyanyi; ia mengawasi pekerjaan di rumah Allah.[a]
