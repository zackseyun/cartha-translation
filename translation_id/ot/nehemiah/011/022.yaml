  text: וּ/פְקִ֤יד הַ/לְוִיִּם֙ בִּ/יר֣וּשָׁלִַ֔ם עֻזִּ֤י בֶן בָּנִי֙ בֶּן חֲשַׁבְיָ֔ה בֶּן מַתַּנְיָ֖ה בֶּן מִיכָ֑א מִ/בְּנֵ֤י אָסָף֙ הַ/מְשֹׁ֣רְרִ֔ים לְ/נֶ֖גֶד מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/022.yaml
  text: And the overseer of the Levites in Jerusalem was Uzzi son of Bani[a], son of Hashabiah, son of Mattaniah, son of Mica, from the sons of Asaph, the singers, over the work of the house of God.
translation:
  language: id
  text: Pengawas orang-orang Lewi di Yerusalem ialah Uzi bin Bani, bin Hasabya, bin Matanya, bin Mikha, dari keturunan Asaf, para penyanyi; ia mengawasi pekerjaan di rumah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia bertanggung jawab atas pekerjaan di rumah Allah.” Ungkapan Ibrani dengan לְנֶגֶד dapat menyatakan pengawasan atau tanggung jawab sehubungan dengan pekerjaan di rumah Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְקִיד הַלְוִיִּם
  choice: Pengawas orang-orang Lewi
  rationale: פְקִיד menunjuk kepada pejabat yang ditetapkan untuk menjalankan pengawasan atau tanggung jawab administratif. Bentuk konstruk dengan הַלְוִיִּם dinyatakan secara alami sebagai “pengawas orang-orang Lewi”.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Preposisi בְּ di sini bersifat lokatif.
- source_word: עֻזִּי בֶן־בָּנִי בֶן־חֲשַׁבְיָה בֶן־מַתַּנְיָה בֶן־מִיכָא
  choice: Uzi bin Bani, bin Hasabya, bin Matanya, bin Mikha
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; pengulangan בֶּן dipertahankan dengan “bin” untuk memperlihatkan rantai silsilah.
- source_word: מִבְּנֵי אָסָף
  choice: dari keturunan Asaf
  rationale: Secara harfiah berarti “dari anak-anak Asaf”; “dari keturunan Asaf” menyampaikan fungsi genealogis ungkapan itu secara alami dalam bahasa Indonesia.
- source_word: הַמְשֹׁרְרִים
  choice: para penyanyi
  rationale: Partisipel ini menyebut peran kelompok Asaf dalam ibadah sebagai penyanyi; “pemusik” akan lebih luas daripada makna kata sumber.
- source_word: לְנֶגֶד מְלֶאכֶת
  choice: yang mengawasi pekerjaan
  rationale: Dalam konteks administratif ini, לְנֶגֶד menyatakan tanggung jawab atau pengawasan berkenaan dengan pekerjaan tersebut. Terjemahan ini lebih jelas daripada bentuk harfiah “di hadapan pekerjaan”, sementara alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ini mempertahankan gambaran Ibrani dan tetap alami; dalam konteksnya ungkapan tersebut merujuk kepada bait Allah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bin” dipakai secara konsisten dalam silsilah, sedangkan “rumah Allah” mempertahankan ungkapan konkret teks Ibrani. Susunan klausa relatif mempertahankan keterkaitan yang cukup terbuka antara keturunan Asaf/para penyanyi dan tanggung jawab atas pekerjaan rumah Allah.
