  text: וּ/פְתַֽחְיָ֨ה בֶּן מְשֵֽׁיזַבְאֵ֜ל מִ/בְּנֵי זֶ֤רַח בֶּן יְהוּדָה֙ לְ/יַ֣ד הַ/מֶּ֔לֶךְ לְ/כָל דָּבָ֖ר לָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/024.yaml
  text: And Pethahiah son of Meshezabel[a], from the sons of Zerah son of Judah[b], was at the king’s side for every matter concerning the people.
translation:
  language: id
  text: Petahya bin Mesyezabeel, dari antara keturunan Zerah bin Yehuda, bertugas di sisi raja[a] dalam segala urusan yang menyangkut rakyat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tangan raja”; ungkapan ini juga dapat berarti “menjadi wakil raja” atau “melayani raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk rakyat.” Frasa Ibrani dapat berarti urusan yang menyangkut rakyat atau urusan yang ditangani demi atau atas nama rakyat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְתַֽחְיָה
  choice: Petahya
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia. Konjungsi וּ tidak diterjemahkan secara eksplisit karena ayat ini merupakan lanjutan daftar dan pembukaan dengan “Dan” kurang alami dalam bahasa Indonesia modern.
- source_word: בֶּן מְשֵֽׁיזַבְאֵל
  choice: bin Mesyezabeel
  rationale: “Bin” menyampaikan hubungan genealogis secara ringkas dan lazim dalam bahasa Indonesia, sedangkan nama tersebut ditransliterasikan dari bentuk Ibrani.
- source_word: מִ/בְּנֵי זֶרַח בֶּן יְהוּדָה
  choice: dari antara keturunan Zerah bin Yehuda
  rationale: מִן menyatakan asal kelompok atau garis keturunan. “Keturunan” lebih alami daripada “anak-anak” untuk בְּנֵי dalam konteks silsilah, dan hubungan Zerah dengan Yehuda tetap dinyatakan secara eksplisit.
- source_word: לְ/יַד הַ/מֶּלֶךְ
  choice: bertugas di sisi raja
  rationale: Ungkapan harfiahnya ialah “di tangan raja” dan dapat menunjuk pada kedudukan dekat dengan raja, pelayanan resmi, atau peran sebagai wakilnya. “Bertugas di sisi raja” alami dalam bahasa Indonesia tanpa menetapkan secara sempit salah satu nuansa tersebut.
- source_word: לְ/כָל דָּבָר
  choice: dalam segala urusan
  rationale: דָּבָר di sini menunjuk pada perkara atau urusan administratif, bukan sekadar perkataan. “Segala urusan” mempertahankan cakupan luas frasa Ibrani.
- source_word: לָ/עָם
  choice: yang menyangkut rakyat
  rationale: Frasa ini paling wajar dipahami sebagai urusan yang berkaitan dengan rakyat, tetapi לְ juga memungkinkan nuansa tindakan untuk atau atas nama rakyat; kemungkinan itu dipertahankan dalam catatan kaki.
