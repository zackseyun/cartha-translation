source:
  edition: WLC
  text: וְ/אֶל הַ/חֲצֵרִ֖ים בִּ/שְׂדֹתָ֑/ם מִ/בְּנֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ בְּ/קִרְיַ֤ת הָֽאַרְבַּע֙ וּ/בְנֹתֶ֔י/הָ וּ/בְ/דִיבֹן֙ וּ/בְנֹתֶ֔י/הָ וּ/בִֽ/יקַּבְצְאֵ֖ל וַ/חֲצֵרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/025.yaml
  text: As for the villages in their fields[a], some of the sons of Judah lived in Kiriath-arba and its villages, and in Dibon and its villages[c][b], and in Jekabzeel and its settlements.
translation:
  language: id
  text: Mengenai desa-desa di tanah pertanian mereka, sebagian dari keturunan Yehuda tinggal di Kiryat-Arba[a] dan desa-desanya[b], di Dibon dan desa-desanya, serta di Yekabzeel[c] dan permukiman-permukimannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kiryat-Arba adalah nama lama Hebron; bandingkan Yosua 14:15.
    reason: cross_reference
  - marker: b
    text: Secara harfiah, “anak-anak perempuannya”; sebuah ungkapan Ibrani untuk desa-desa bawahan atau desa-desa yang bergantung pada sebuah kota.
    reason: lexical_alternative
  - marker: c
    text: Dalam beberapa bagian dan tradisi terkait, Yekabzeel juga disebut “Kabzeel”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶל הַחֲצֵרִים בִּשְׂדֹתָם
  choice: Mengenai desa-desa di ladang mereka
  rationale: וְאֶל berfungsi sebagai peralihan topik dalam daftar, sedangkan חֲצֵרִים dalam konteks geografis ini menunjuk pada permukiman pedesaan. Terjemahan ini mempertahankan unsur agraris בִּשְׂדֹתָם.
- source_word: מִבְּנֵי יְהוּדָה
  choice: sebagian dari keturunan Yehuda
  rationale: מִן bersifat partitif. Dalam bahasa Indonesia, 'keturunan Yehuda' menyampaikan sebutan kesukuan בְּנֵי יְהוּדָה secara alami tanpa membatasi rujukannya hanya kepada anak laki-laki langsung.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Kata ini menyatakan tempat kediaman; 'tinggal' merupakan padanan modern dan tidak menambahkan gagasan bahwa mereka baru mulai menetap.
- source_word: בְּקִרְיַת הָאַרְבַּע
  choice: di Kiryat-Arba
  rationale: Nama tempat ditransliterasikan; identifikasinya dengan Hebron ditempatkan dalam catatan kaki karena tidak dinyatakan dalam ayat ini.
- source_word: וּבְנֹתֶיהָ
  choice: dan desa-desa di sekitarnya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', suatu idiom untuk desa atau kota bawahan yang bergantung pada kota utama. Padanan ini alami dan jelas dalam bahasa Indonesia.
- source_word: וּבְדִיבוֹן
  choice: di Dibon
  rationale: Nama tempat ditransliterasikan.
- source_word: וּבִיקַּבְצְאֵל
  choice: di Yekabzeel
  rationale: Transliterasi mengikuti bentuk konsonantal WLC; bentuk Kabzeel dalam bagian atau tradisi terkait dicatat sebagai alternatif.
- source_word: וַחֲצֵרֶיהָ
  choice: dan permukiman-permukiman di sekitarnya
  rationale: חֲצֵרִים menunjuk pada permukiman pedesaan yang bergantung pada kota utama. 'Permukiman' juga mempertahankan perbedaan leksikal dari בָּנוֹת yang diterjemahkan 'desa-desa di sekitarnya'.
theological_decisions:
- issue: Cakupan gender dalam מִבְּנֵי יְהוּדָה
  choice: sebagian dari keturunan Yehuda
  alternative: sebagian dari anak-anak lelaki Yehuda
  rationale: Dalam konteks daftar kesukuan, בְּנֵי יְהוּדָה merupakan sebutan genealogis-kolektif bagi keturunan atau warga suku Yehuda, bukan pernyataan teologis bahwa hanya laki-laki yang tinggal di sana. 'Keturunan Yehuda' mempertahankan hubungan kesukuan tanpa menghasilkan pembatasan gender yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami dengan mengurangi pengulangan kata sambung, sementara hubungan antara kota utama dan permukiman bawahan tetap jelas. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
