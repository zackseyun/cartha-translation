  text: 'Sesudah dia, ada Gabai dan Salai: sembilan ratus dua puluh delapan orang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin dalam konteks ini, “di sampingnya,” jika frasa tersebut dipahami sebagai penunjuk tempat, bukan urutan.
