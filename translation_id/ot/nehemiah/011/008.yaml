lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Frasa ini secara harfiah berarti 'dan sesudah dia'. Dalam konteks daftar penduduk atau kaum, ungkapan ini paling wajar menunjukkan urutan dalam daftar; konjungsi Ibrani tidak perlu diterjemahkan tersendiri pada awal kalimat Indonesia.
- source_word: גַּבַּי
  choice: Gabai
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia.
- source_word: סַלָּי
  choice: Salai
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia.
- source_word: תְּשַׁע מֵאוֹת עֶשְׂרִים וּשְׁמֹנָה
  choice: sembilan ratus dua puluh delapan orang
  rationale: Bilangan Ibrani berjumlah 928. Kata 'orang' ditambahkan secara wajar karena konteks ayat sebelumnya menunjukkan penghitungan penduduk, sementara elipsis nomina lazim dalam daftar Ibrani.
