  text: For the king’s command was upon them[a], and a fixed provision for the singers[b], each day’s matter on its day.
translation:
  language: id
  text: Sebab perintah raja berlaku bagi mereka, dan ada ketetapan[a] bagi para penyanyi mengenai keperluan setiap hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “ketetapan” juga dapat berarti pengaturan yang tetap, jaminan, atau kewajiban yang telah ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “perkara satu hari pada harinya”; maksudnya mungkin bagian atau kewajiban yang harus dipenuhi hari demi hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan wacana tersebut secara alami.
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: perintah raja
  rationale: Dalam konteks administratif, frasa ini menunjuk pada titah atau arahan resmi raja; “perintah raja” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עֲלֵיהֶם
  choice: berlaku atas mereka
  rationale: Ungkapan ini menyatakan kewenangan atau kewajiban yang dikenakan kepada mereka, sekaligus mempertahankan sebagian citra preposisi Ibrani עַל.
- source_word: וַאֲמָנָה
  choice: ada ketetapan
  rationale: Nomina אֲמָנָה dapat menunjuk pada pengaturan yang tetap, jaminan, atau kewajiban yang ditetapkan. “Ketetapan” cocok dengan konteks resmi tanpa memastikan bahwa yang dimaksud khususnya tunjangan materi.
- source_word: עַל הַמְשֹׁרְרִים
  choice: bagi para penyanyi
  rationale: Dalam konteks ini, עַל paling alami dipahami sebagai menunjukkan pihak yang menjadi sasaran atau penerima pengaturan tersebut.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: mengenai keperluan setiap hari
  rationale: Idiom harfiahnya, “perkara satu hari pada harinya,” menunjuk pada apa yang dituntut atau diperlukan hari demi hari. Pilihan ini menyampaikan makna administratifnya dengan bahasa Indonesia yang alami.
