  yaml_path: translation/ot/nehemiah/011/006.yaml
  text: All the sons of Perez who lived in Jerusalem were four hundred sixty-eight valiant men[a].
translation:
  language: id
  text: Semua keturunan Peres yang tinggal di Yerusalem berjumlah 468 orang yang gagah perkasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang cakap” atau “orang-orang yang berani.” Ungkapan Ibrani ini dapat menunjuk kepada orang yang menonjol karena kekuatan, kecakapan, atau keberaniannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל בְּנֵי פֶרֶץ
  choice: Semua keturunan Peres
  rationale: Secara harfiah berarti “semua anak Peres”, tetapi dalam konteks daftar silsilah dan penduduk, בְּנֵי menunjuk kepada keturunan atau kaum Peres. “Keturunan” menyampaikan maksud itu secara alami dalam bahasa Indonesia modern.
- source_word: הַיֹּשְׁבִים בִּירוּשָׁלִָם
  choice: yang tinggal di Yerusalem
  rationale: Partisip יָשַׁב dalam konteks permukiman menyatakan tempat tinggal tetap; “tinggal” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אַרְבַּע מֵאוֹת שִׁשִּׁים וּשְׁמֹנָה
  choice: berjumlah 468
  rationale: Kata “berjumlah” membuat hubungan antara kelompok dan angka jelas serta alami dalam gaya daftar penduduk. Angka ditulis dengan numeralia agar mudah dibaca.
- source_word: אַנְשֵׁי חָיִל
  choice: orang yang gagah perkasa
  rationale: Ungkapan ini dapat menunjuk kepada orang yang menonjol dalam kekuatan, kecakapan, keberanian, atau kegagahan. “Gagah perkasa” mempertahankan nuansa pujian dan kemungkinan konteks kemiliteran tanpa mempersempitnya secara mutlak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, sesuai dengan gaya daftar penduduk. “Keturunan” dipilih daripada bentuk harfiah “anak-anak” agar hubungan genealogis tidak disalahpahami.
