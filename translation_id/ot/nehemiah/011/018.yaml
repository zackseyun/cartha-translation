lexical_decisions:
- source_word: כָּל
  choice: Jumlah semua
  rationale: Kata ini mencakup seluruh kelompok dan, dalam konteks daftar yang diikuti angka, secara alami memperkenalkan jumlah keseluruhan.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Sebutan baku dan mudah dipahami dalam bahasa Indonesia untuk kelompok לְוִיִּם.
- source_word: בְּעִיר הַקֹּדֶשׁ
  choice: di kota suci itu
  rationale: Preposisi בְּ menyatakan lokasi, sedangkan konstruksi עִיר הַקֹּדֶשׁ berarti 'kota suci'. Kata 'itu' membuat rujukan definitnya alami dalam bahasa Indonesia tanpa menambah identifikasi yang tidak dinyatakan.
- source_word: מָאתַיִם שְׁמֹנִים וְאַרְבָּעָה
  choice: 284 orang
  rationale: Urutan bilangan Ibrani menyatakan jumlah 284; penambahan 'orang' diperlukan secara idiomatis agar jumlah manusia terbaca jelas.
