  text: וְ/אֵ֖לֶּה בְּנֵ֣י בִנְיָמִ֑ן סַלֻּ֡א בֶּן מְשֻׁלָּ֡ם בֶּן יוֹעֵ֡ד בֶּן פְּדָיָה֩ בֶן ק֨וֹלָיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן אִֽיתִיאֵ֖ל בֶּן יְשַֽׁעְיָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/007.yaml
  text: 'And these were the sons of Benjamin: Sallu son of Meshullam[a], son of Joed, son of Pedaiah, son of Kolaiah, son of Maaseiah, son of Ithiel[b], son of Jeshaiah.'
translation:
  language: id
  text: Inilah keturunan Benyamin:[a] Salu anak Mesulam, anak Yoed,[b] anak Pedaya, anak Kolaya, anak Maaseya, anak Itiel, anak Yesaya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Benyamin”; ungkapan Ibrani ini dapat menunjuk secara lebih luas kepada keturunan Benyamin atau orang-orang dari suku Benyamin.'
    reason: lexical_alternative
  - marker: b
    text: Nama “Yoed” mengikuti Teks Masoret di sini. Silsilah yang sejajar dalam 1 Tawarikh 9:7 berbunyi “Hodawya”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan kelompok berikutnya dalam daftar, sambil mempertahankan fungsi penghubung dan penunjuk dari bahasa Ibrani.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Secara harfiah berarti 'anak-anak Benyamin', tetapi dalam daftar kesukuan ungkapan ini mencakup keturunan atau anggota suku Benyamin; 'keturunan' menyampaikan maksud itu secara wajar dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rangkaian silsilah ini, 'anak' merupakan padanan Indonesia yang langsung dan lazim; kemungkinan makna yang lebih luas sebagai keturunan tidak perlu dipaksakan ke dalam setiap mata rantai.
- source_word: סַלֻּא
  choice: Salu
  rationale: Transliterasi yang ringkas dan sesuai dengan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: מְשֻׁלָּם
  choice: Mesulam
  rationale: Transliterasi Indonesia yang mencerminkan bentuk Ibrani.
- source_word: יוֹעֵד
  choice: Yoed
  rationale: Mengikuti pembacaan Teks Masoret dan mencerminkan unsur konsonan serta vokal nama Ibrani.
- source_word: פְּדָיָה
  choice: Pedaya
  rationale: Transliterasi Indonesia yang mencerminkan pelafalan Ibrani.
- source_word: קוֹלָיָה
  choice: Kolaya
  rationale: Transliterasi Indonesia yang mempertahankan bentuk nama Ibrani.
- source_word: מַעֲשֵׂיָה
  choice: Maaseya
  rationale: Transliterasi Indonesia yang cukup dekat dengan vokalisasi Ibrani dan mudah dibaca.
- source_word: אִיתִיאֵל
  choice: Itiel
  rationale: Transliterasi yang alami dalam ejaan Indonesia.
- source_word: יְשַׁעְיָה
  choice: Yesaya
  rationale: Bentuk nama ini sama dengan bentuk Ibrani yang lazim dialihaksarakan sebagai Yesaya dalam bahasa Indonesia; konteks silsilah membedakan tokoh ini dari nabi yang bernama sama.
