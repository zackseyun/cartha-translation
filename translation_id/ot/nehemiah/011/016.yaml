translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum tanpa menghilangkan hubungan administratif dalam teks Ibrani. Istilah “rumah Allah” dipertahankan alih-alih diganti dengan “bait Allah” agar dekat dengan bentuk sumber.
