base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/016.yaml
  text: And Shabbethai and Jozabad[a], from the heads of the Levites, were over the outside work of the house of God.
translation:
  language: id
  text: Sabetai dan Yozabad, dua orang dari antara para kepala orang Lewi, bertanggung jawab atas pekerjaan luar bagi rumah Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pekerjaan di luar rumah Allah.” Frasa Ibrani ini dapat menunjuk pada pekerjaan luar yang berkaitan dengan rumah Allah, atau pada pekerjaan yang dilakukan di luar bagian utamanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְּתַי וְיוֹזָבָד
  choice: Sabetai dan Yozabad
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia. Kata penghubung Ibrani dipertahankan secara alami sebagai “dan” di antara kedua nama; waw pembuka tidak perlu diterjemahkan tersendiri karena ayat ini meneruskan sebuah daftar.
- source_word: עַל הַמְּלָאכָה
  choice: bertanggung jawab atas pekerjaan
  rationale: Dalam konteks pembagian tugas administratif, עַל menunjukkan kewenangan atau tanggung jawab atas suatu bidang kerja. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “berada di atas”.
- source_word: הַחִיצֹנָה
  choice: di luar
  rationale: Adjektiva ini berarti “luar/eksternal” dan kemungkinan menunjuk pada pekerjaan yang dilakukan di luar bagian utama rumah Allah, berlawanan dengan tugas di bagian dalam. Bentuk “di luar” alami sekaligus tidak mempersempit jenis pekerjaannya.
- source_word: לְבֵית הָאֱלֹהִים
  choice: rumah Allah
  rationale: בֵּית הָאֱלֹהִים secara harfiah berarti “rumah Allah” dan dalam konteks ini menunjuk pada bait Allah. Terjemahan formal ini mempertahankan ungkapan sumber; hubungan preposisionalnya tercakup dalam frasa “pekerjaan di luar rumah Allah,” sementara kemungkinan pemahaman “untuk rumah Allah” dicatat dalam catatan kaki.
- source_word: מֵרָאשֵׁי הַלְוִיִּם
  choice: yang termasuk para kepala orang Lewi
  rationale: Prefiks מִן menyatakan bahwa kedua orang itu berasal dari atau termasuk kelompok para pemimpin Lewi. “Para kepala orang Lewi” mempertahankan metafora administratif רָאשִׁים, sedangkan “yang termasuk” menghasilkan susunan Indonesia yang jelas.
