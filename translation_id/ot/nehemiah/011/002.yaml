  yaml_path: translation/ot/nehemiah/011/002.yaml
  text: And the people blessed all the men who willingly offered themselves to live in Jerusalem[a].
translation:
  language: id
  text: Rakyat itu memberkati semua laki-laki yang dengan sukarela menawarkan diri untuk tinggal di Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang secara sukarela mengajukan diri untuk tinggal di Yerusalem.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: Lalu ... memberkati
  rationale: Bentuk piel dari ברך lazim berarti 'memberkati'. Karena objeknya manusia, ungkapan ini menyatakan bahwa bangsa itu mengucapkan berkat atau menyatakan restu kepada mereka; 'memberkati' mempertahankan kaitan leksikal tersebut.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם adalah istilah kolektif bagi suatu bangsa atau umat. Dalam konteks Israel sebagai komunitas, 'bangsa itu' alami dan mempertahankan bentuk kolektifnya.
- source_word: לְכֹל הָאֲנָשִׁים
  choice: semua laki-laki
  rationale: אֲנָשִׁים berbentuk maskulin dan dalam konteks ini menunjuk kepada para laki-laki; terjemahan ini tidak menetralkan penandaan gender sumber.
- source_word: הַמִּתְנַדְּבִים
  choice: yang dengan sukarela menawarkan diri
  rationale: Bentuk hitpael dari נדב menyampaikan tindakan sukarela yang melibatkan diri sendiri. Ungkapan ini mempertahankan baik unsur kesukarelaan maupun nuansa refleksifnya.
- source_word: לָשֶׁבֶת
  choice: untuk tinggal
  rationale: ישב di sini menunjuk pada menetap atau bertempat tinggal. 'Tinggal' merupakan padanan Indonesia modern yang alami dalam konteks mengambil tempat kediaman di Yerusalem.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Padanan lokatif baku untuk nama tempat tersebut.
theological_decisions:
- issue: Cakupan gender הָאֲנָשִׁים
  choice: semua laki-laki
  alternative: semua orang
  rationale: Teks Ibrani memakai nomina maskulin אֲנָשִׁים, bukan istilah kolektif generik. Karena konteks tidak menuntut netralisasi, rujukan maskulin dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' mengalirkan narasi tanpa memberi tekanan berlebihan; 'memberkati' mempertahankan istilah teologis-leksikal sumber, sedangkan 'menawarkan diri' menjaga nuansa refleksif הַמִּתְנַדְּבִים.
