base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/005.yaml
  text: and Maaseiah son of Baruch[a], son of Col-hozeh, son of Hazaiah, son of Adaiah, son of Joiarib, son of Zechariah, son of the Shilonite.
translation:
  language: id
  text: dan Maaseya, anak Barukh, anak Kol-Hoze, anak Hazaya, anak Adaya, anak Yoyarib, anak Zakharia, anak orang Silo[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Syeloni.” Bentuk Ibrani ini dapat menunjukkan hubungan dengan Silo atau dengan kaum Selah/Syilon dalam tradisi silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מַעֲשֵׂיָה
  choice: dan Maaseya
  rationale: Konjungsi ו diterjemahkan “dan” karena ayat ini melanjutkan daftar sebelumnya; nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Kata genealogis ini dipertahankan secara konsisten sebagai “anak” untuk mencerminkan susunan berulang dalam teks Ibrani, tanpa menutup kemungkinan bahwa silsilah kuno kadang diringkas.
- source_word: בָּרוּךְ
  choice: Barukh
  rationale: Nama pribadi ditransliterasikan dengan ejaan Indonesia yang mendekati bentuk Ibrani.
- source_word: כָּל חֹזֶה
  choice: Kol-Hoze
  rationale: Bentuk ini diperlakukan sebagai nama diri majemuk, bukan diterjemahkan secara harfiah.
- source_word: חֲזָיָה
  choice: Hazaya
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: עֲדָיָה
  choice: Adaya
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: יוֹיָרִיב
  choice: Yoyarib
  rationale: Transliterasi mengikuti bentuk Ibrani yang terdapat dalam ayat ini, tanpa memperluas unsur teoforis nama tersebut.
- source_word: זְכַרְיָה
  choice: Zakharia
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang tetap mencerminkan konsonan Ibrani.
- source_word: הַ/שִּׁלֹנִי
  choice: orang Syilo
  rationale: Bentuk nisbah berartikel ini menunjukkan hubungan dengan tempat atau kelompok; “orang Syilo” merupakan padanan ringkas dan alami, sementara kemungkinan hubungan dengan kaum Syelani dijelaskan dalam catatan kaki.
