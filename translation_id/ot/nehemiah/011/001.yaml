  text: וַ/יֵּשְׁב֥וּ שָׂרֵֽי הָ/עָ֖ם בִּ/ירוּשָׁלִָ֑ם וּ/שְׁאָ֣ר הָ֠/עָם הִפִּ֨ילוּ גוֹרָל֜וֹת לְ/הָבִ֣יא אֶחָ֣ד מִן הָ/עֲשָׂרָ֗ה לָ/שֶׁ֨בֶת֙ בִּֽ/ירוּשָׁלִַ֨ם֙ עִ֣יר הַ/קֹּ֔דֶשׁ וְ/תֵ֥שַׁע הַ/יָּד֖וֹת בֶּ/עָרִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/001.yaml
  text: The officials of the people lived in Jerusalem[a], and the rest of the people cast lots to bring one out of ten to live in Jerusalem, the holy city, while nine parts remained in the towns.
translation:
  language: id
  text: Para pejabat rakyat tinggal di Yerusalem, sedangkan rakyat lainnya membuang undi untuk membawa satu dari setiap sepuluh orang agar tinggal di Yerusalem, kota kudus itu; sembilan bagian lainnya[a] tetap tinggal di kota-kota lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan sembilan tangan di kota-kota.” Kata “tangan” di sini merupakan ungkapan untuk bagian; maksudnya, sembilan bagian yang tersisa dari setiap sepuluh tetap tinggal di kota-kota lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הָעָם
  choice: para pemimpin rakyat
  rationale: שָׂרִים dapat berarti pejabat, penguasa, atau pemimpin. Dalam bahasa Indonesia, “para pemimpin rakyat” terdengar alami dan mencakup peran kepemimpinan mereka tanpa memakai istilah monarkis “pangeran”.
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: Kata ישׁב di sini menyatakan kediaman, bukan tindakan duduk. “Tinggal” merupakan padanan modern yang jelas.
- source_word: וּשְׁאָר הָעָם
  choice: rakyat lainnya
  rationale: שְׁאָר berarti bagian yang tersisa. “Rakyat lainnya” alami dalam bahasa Indonesia dan mempertahankan kontras dengan para pemimpin.
- source_word: הִפִּילוּ גוֹרָלוֹת
  choice: membuang undi
  rationale: Ini adalah ungkapan Indonesia yang lazim untuk proses menentukan pilihan dengan undian.
- source_word: לְהָבִיא
  choice: untuk mendatangkan
  rationale: Bentuk kausatif dari בוא menyatakan menyebabkan orang-orang terpilih datang. “Mendatangkan” menyampaikan daya kausatif itu dengan alami.
- source_word: אֶחָד מִן הָעֲשָׂרָה
  choice: satu dari setiap sepuluh orang
  rationale: Ungkapan ini menunjukkan perbandingan pemilihan. Penambahan “orang” tersirat dari konteks rakyat dan diperlukan agar kalimat Indonesia jelas.
- source_word: לָשֶׁבֶת
  choice: supaya tinggal
  rationale: ישׁב kembali digunakan dalam arti menetap atau berdiam. “Supaya tinggal” menyatakan tujuan dengan wajar.
- source_word: עִיר הַקֹּדֶשׁ
  choice: kota kudus itu
  rationale: Padanan langsung yang alami untuk frasa konstruksi Ibrani ini; “itu” mengidentifikasi Yerusalem yang baru saja disebut.
- source_word: וְתֵשַׁע הַיָּדוֹת
  choice: sedangkan sembilan bagian lainnya tetap tinggal
  rationale: Secara harfiah frasa ini menyebut “sembilan tangan,” tetapi יָדוֹת dipakai sebagai idiom untuk bagian-bagian. “Sembilan bagian lainnya” mempertahankan cara pengungkapan sumber, sedangkan “tetap tinggal” melengkapi predikat yang tersirat dalam bahasa Ibrani.
- source_word: בֶּעָרִים
  choice: di kota-kota lain
  rationale: עָרִים menunjuk pusat-pusat permukiman yang dikontraskan dengan Yerusalem. “Kota-kota lain” jelas dan tidak menyiratkan bahwa Yerusalem bukan sebuah kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar mudah dibaca tanpa mengubah hubungan antargagasan. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
