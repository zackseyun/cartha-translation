  yaml_path: translation/ot/nehemiah/011/026.yaml
  text: and in Jeshua[a], and in Moladah, and in Beth-pelet;
translation:
  language: id
  text: dan di Yesua, dan di Molada, dan di Bet-Pelet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Pelet secara harfiah berarti “rumah Pelet” atau mungkin “rumah pelarian”; di sini nama itu adalah nama tempat, sehingga ditransliterasikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ
  choice: dan di
  rationale: Gabungan ו dengan ב menyatakan kelanjutan daftar sekaligus lokasi. Kata penghubung pertama dan terakhir dinyatakan secara alami dalam bahasa Indonesia, sedangkan pengulangan di tengah tidak dipertahankan karena tidak diperlukan untuk menjaga struktur daftar.
- source_word: יֵשׁוּעַ
  choice: Yesua
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan. Bentuk “Yesua” mengikuti ejaan nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מוֹלָדָה
  choice: Molada
  rationale: Nama tempat ini ditransliterasikan menurut bentuk Ibraninya dengan ejaan yang alami bagi pembaca Indonesia.
- source_word: בֵית פָּלֶט
  choice: Bet-Pelet
  rationale: Nama tempat majemuk ini ditransliterasikan. Tanda hubung membantu pembaca mengenalinya sebagai satu nama tempat, bukan frasa biasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan wajar untuk sebuah daftar permukiman. Penanda catatan kaki ditempatkan setelah Bet-Pelet karena catatan tersebut menjelaskan nama itu; letaknya pada lapisan konsultasi bahasa Inggris setelah “Jeshua” tampaknya tidak sesuai dengan isi catatan.
