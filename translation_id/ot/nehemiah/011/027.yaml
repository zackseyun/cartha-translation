  yaml_path: translation/ot/nehemiah/011/027.yaml
  text: and in Hazar-shual[a], and in Beer-sheba and its villages.
translation:
  language: id
  text: dan di Hazar-Sual dan di Bersyeba serta desa-desanya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “anak-anak perempuannya,” sebuah ungkapan untuk desa atau permukiman yang berada di bawah sebuah kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֲצַר שׁוּעָל
  choice: juga di Hazar-Sual
  rationale: Konjungsi dan preposisi dinyatakan secara alami sebagai “juga di” karena ayat ini melanjutkan daftar tempat tinggal dari konteks sebelumnya. Nama tempat ditransliterasikan dengan ejaan Indonesia yang lazim, bukan diterjemahkan secara etimologis sebagai “Kampung Rubah”.
- source_word: וּ/בִ/בְאֵר שֶׁבַע
  choice: dan di Bersyeba
  rationale: Nama tempat yang sudah dikenal dipertahankan sebagai nama diri dengan ejaan Indonesia yang lazim. Konjungsi dan preposisi diterjemahkan secara langsung.
- source_word: וּ/בְנֹתֶיהָ
  choice: beserta desa-desanya
  rationale: Secara harfiah bentuk ini berarti “dan anak-anak perempuannya,” tetapi dalam pemakaian geografis menunjuk pada permukiman bawahan yang bergantung pada sebuah kota. “Desa-desanya” menyampaikan idiom tersebut dengan wajar, sedangkan “beserta” memperjelas bahwa desa-desa itu termasuk wilayah Bersyeba.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan preposisi dipertahankan pada kedua nama tempat, sedangkan idiom geografis Ibrani diterjemahkan menurut maknanya. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar dijelaskannya.
