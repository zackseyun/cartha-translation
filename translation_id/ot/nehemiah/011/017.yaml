source:
  edition: WLC
  text: וּ/מַתַּנְיָ֣ה בֶן מִ֠יכָה בֶּן זַבְדִּ֨י בֶן אָסָ֜ף רֹ֗אשׁ הַ/תְּחִלָּה֙ יְהוֹדֶ֣ה לַ/תְּפִלָּ֔ה וּ/בַקְבֻּקְיָ֖ה מִשְׁנֶ֣ה מֵ/אֶחָ֑י/ו וְ/עַבְדָּא֙ בֶּן שַׁמּ֔וּעַ בֶּן גָּלָ֖ל בֶּן ידיתון־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/017.yaml
  text: And Mattaniah son of Micah[a], son of Zabdi, son of Asaph, was the head, who began the thanksgiving in prayer; and Bakbukiah was second among his brothers; and Abda son of Shammua, son of Galal, son of Jeduthun.
translation:
  language: id
  text: Matanya bin Mikha, bin Zabdi, bin Asaf, adalah pemimpin yang memulai pengucapan syukur dalam doa[a]; Bakbukya menduduki urutan kedua di antara saudara-saudaranya; dan Abda bin Samua, bin Galal, bin Yedutun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pemimpin permulaan, yang mengucap syukur dalam doa.” Susunan bahasa Ibrani dapat menunjukkan bahwa Matanya memimpin atau memulai pengucapan syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ
  choice: pemimpin
  rationale: Dalam daftar petugas ibadah ini, kata tersebut menunjukkan kedudukan utama. 'Pemimpin' menyampaikan fungsi itu secara wajar dalam bahasa Indonesia.
- source_word: הַתְּחִלָּה
  choice: yang mengawali
  rationale: Nomina 'permulaan' berkaitan dengan רֹאשׁ dan verba sesudahnya. Bentuk verbal ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan peran Matanya sebagai pengawal atau pemula ucapan syukur.
- source_word: יְהוֹדֶה
  choice: ucapan syukur
  rationale: Dalam konteks ibadah, bentuk kausatif dari ידה paling mungkin menunjuk pada pengucapan syukur atau pujian, bukan pengakuan dosa.
- source_word: לַתְּפִלָּה
  choice: dalam doa
  rationale: Preposisi ל dipahami sebagai penanda ranah atau kesempatan liturgis; 'dalam doa' mempertahankan kaitan antara ucapan syukur dan doa tanpa menentukan bentuk ritualnya.
- source_word: מִשְׁנֶה
  choice: menduduki urutan kedua
  rationale: Istilah ini menyatakan posisi kedua atau bawahan. Ungkapan ini lebih jelas dan alami daripada hanya 'kedua' dalam bahasa Indonesia.
- source_word: מֵאֶחָיו
  choice: di antara saudara-saudaranya
  rationale: Terjemahan ini mempertahankan bahasa kelompok kekeluargaan dalam teks tanpa mempersempitnya secara tafsir menjadi sesama orang Lewi.
- source_word: יְדִיתוּן
  choice: Yedutun
  rationale: Bentuk ini mengikuti transliterasi nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Makna ידה dalam konteks ibadah
  choice: ucapan syukur
  alternative: pujian atau pengakuan
  rationale: Konteks pelayanan ibadah dan hubungan silsilah dengan Asaf lebih mendukung ucapan syukur atau pujian. 'Ucapan syukur' dipilih, sementara kemungkinan sintaksis lain dijelaskan dalam catatan tanpa memasukkan kekhasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang lazim bagi pembaca Alkitab Indonesia; struktur silsilah dan kesejajaran tiga tokoh dipertahankan.
