  text: and in En-rimmon[a], and in Zorah[b], and in Jarmuth.
translation:
  language: id
  text: dan di En-Rimon[a], dan di Zora, dan di Yarmut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama tempat Ibrani ini juga dapat ditulis Ain-Rimon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/עֵין רִמּוֹן
  choice: dan di En-Rimon
  rationale: Prefiks וּ dan בְ diterjemahkan secara langsung sebagai “dan di”. Nama tempat עֵין רִמּוֹן ditransliterasikan dalam bentuk Indonesia yang lazim, En-Rimon, bukan diterjemahkan maknanya.
- source_word: וּ/בְ/צָרְעָה
  choice: dan di Zora
  rationale: Nama tempat צָרְעָה ditransliterasikan sebagai Zora, bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia; prefiksnya tetap dinyatakan sebagai “dan di”.
- source_word: וּ/בְ/יַרְמוּת
  choice: dan di Yarmut
  rationale: Nama tempat יַרְמוּת ditransliterasikan sebagai Yarmut, mengikuti nilai konsonan awal Ibrani yod dalam ejaan Indonesia; prefiksnya diterjemahkan “dan di”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat. Pengulangan “dan di” dipertahankan karena teks Ibrani mengulang konjungsi dan preposisi pada setiap permukiman dalam daftar.
