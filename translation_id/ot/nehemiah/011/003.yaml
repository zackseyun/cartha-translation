  terminology: Yerusalem, Yehuda, Lewi, Bait Allah, dan Salomo digunakan secara konsisten. “Para pelayan Bait Allah” merupakan padanan fungsional yang baik untuk Netinim, dengan istilah Ibrani dipertahankan dalam catatan kaki.
