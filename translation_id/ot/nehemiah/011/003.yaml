source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ רָאשֵׁ֣י הַ/מְּדִינָ֔ה אֲשֶׁ֥ר יָשְׁב֖וּ בִּ/ירוּשָׁלִָ֑ם וּ/בְ/עָרֵ֣י יְהוּדָ֗ה יָֽשְׁב֞וּ אִ֤ישׁ בַּ/אֲחֻזָּת/וֹ֙ בְּ/עָ֣רֵי/הֶ֔ם יִשְׂרָאֵ֤ל הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֣ם וְ/הַ/נְּתִינִ֔ים וּ/בְנֵ֖י עַבְדֵ֥י שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/011/003.yaml
  text: 'These are the heads of the province who lived in Jerusalem[a]. But in the cities of Judah, each man lived in his own possession in their cities: Israel, the priests, the Levites, the temple servants[b], and the descendants of Solomon’s servants.'
translation:
  language: id
  text: 'Inilah para pemimpin provinsi yang tinggal di Yerusalem. Namun, di kota-kota Yehuda, setiap orang tinggal di tanah miliknya di kota-kota mereka: orang Israel[a], para imam, orang-orang Lewi, para pelayan Bait Allah[b], dan keturunan para hamba Salomo.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Israel.” Di sini nama itu tampaknya dipakai secara kolektif untuk orang Israel sebagai salah satu kelompok dalam daftar.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “kaum Netinim,” yaitu suatu golongan yang ditugaskan untuk melayani di Bait Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הַמְּדִינָה
  choice: para kepala provinsi
  rationale: Ungkapan harfiah 'kepala-kepala provinsi' menunjuk kepada para pemimpin utama. 'Para kepala provinsi' mempertahankan idiom sumber dalam bentuk Indonesia yang ringkas; 'provinsi' sesuai dengan satuan administratif zaman Persia, bukan negara modern.
- source_word: אֲשֶׁר יָשְׁבוּ בִּירוּשָׁלִָם
  choice: yang tinggal di Yerusalem
  rationale: יָשַׁב di sini menyatakan kediaman menetap; 'tinggal' alami dalam bahasa Indonesia modern.
- source_word: וּבְעָרֵי יְהוּדָה יָשְׁבוּ
  choice: Namun, di kota-kota Yehuda ... tinggal
  rationale: Waw menandai peralihan yang bersifat kontras dari Yerusalem ke kota-kota Yehuda; 'Namun' membuat hubungan wacana itu jelas tanpa menambahkan unsur waktu.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Bentuk tunggal distributif berarti setiap orang dalam kelompok. 'Masing-masing' alami dan tidak mempersempit acuan secara tidak perlu.
- source_word: בַּאֲחֻזָּתוֹ
  choice: di tanah miliknya
  rationale: אֲחֻזָּה menunjuk pada milik atau lahan yang dikuasai, sering kali turun-temurun. 'Tanah miliknya' menyampaikan dimensi konkret kepemilikan lahan dengan jelas.
- source_word: בְּעָרֵיהֶם
  choice: di kota mereka sendiri
  rationale: Frasa ini menunjukkan kota-kota tempat kelompok-kelompok tersebut masing-masing bermukim. 'Sendiri' memperjelas daya refleksif posesif dalam konteks distributif.
- source_word: יִשְׂרָאֵל
  choice: orang Israel
  rationale: Nama kolektif tanpa artikel ini paling wajar dipahami sebagai kelompok penduduk dalam daftar, bukan wilayah atau pribadi Israel. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih formal.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku untuk kelompok imam.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan mudah dipahami untuk anggota kelompok Lewi.
- source_word: הַנְּתִינִים
  choice: para pelayan Bait Allah
  rationale: Istilah ini menunjuk pada golongan khusus yang ditugaskan untuk pelayanan di Bait Allah. Terjemahan fungsional lebih jelas bagi pembaca modern; istilah Ibraninya dicatat dalam catatan kaki.
- source_word: בְּנֵי עַבְדֵי שְׁלֹמֹה
  choice: keturunan para hamba Salomo
  rationale: Dalam daftar komunitas, בְּנֵי dapat menunjuk pada kelompok keturunan, bukan hanya anak laki-laki langsung.
