  rationale: Nama tempat ini ditransliterasikan secara cukup dekat dengan bentuk Ibrani; konsonan rangkap tidak perlu dipertahankan dalam ejaan Indonesia, sedangkan unsur -ayim tetap dipertahankan sebagai bagian nama.
