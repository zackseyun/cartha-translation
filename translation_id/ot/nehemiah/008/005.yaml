id: NEH.8.5
reference: Nehemiah 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח עֶזְרָ֤א הַ/סֵּ֨פֶר֙ לְ/עֵינֵ֣י כָל הָ/עָ֔ם כִּֽי מֵ/עַ֥ל כָּל הָ/עָ֖ם הָיָ֑ה וּ/כְ/פִתְח֖/וֹ עָֽמְד֥וּ כָל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/005.yaml
  text: Ezra opened the book in the sight of all the people[a], for he was above all the people; and when he opened it, all the people stood.
translation:
  language: id
  text: Ezra membuka kitab itu di depan mata seluruh rakyat[a], karena ia berada lebih tinggi daripada seluruh rakyat. Ketika ia membukanya, seluruh rakyat berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan itu.” Kata Ibrani סֵפֶר dapat menunjuk pada dokumen tertulis dalam bentuk gulungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: membuka
  rationale: Kata kerja פתח berarti ‘membuka’. Terjemahan ini mempertahankan ungkapan umum dalam bahasa Ibrani tanpa memperjelasnya secara berlebihan menjadi ‘membentangkan gulungan’.
- source_word: הַסֵּפֶר
  choice: kitab itu
  rationale: סֵפֶר dapat menunjuk pada kitab, dokumen tertulis, atau gulungan. ‘Kitab itu’ wajar dalam konteks pembacaan Kitab Taurat, sedangkan bentuk fisiknya yang mungkin berupa gulungan dicatat dalam catatan kaki.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Ungkapan ini secara harfiah berkaitan dengan ‘mata’ dan menekankan bahwa tindakan Ezra terlihat oleh seluruh rakyat.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עָם menunjuk pada masyarakat yang sedang berkumpul. ‘Seluruh rakyat’ langsung, alami, dan mempertahankan pengulangan dalam ayat.
- source_word: כִּי מֵעַל כָּל הָעָם הָיָה
  choice: karena ia berada lebih tinggi daripada seluruh rakyat
  rationale: מֵעַל di sini menyatakan posisi fisik Ezra yang lebih tinggi, bukan kedudukan sosial. Rumusan ini membuat maksud spasialnya jelas tanpa menambahkan bahwa ia sedang berdiri.
- source_word: וּכְפִתְחוֹ
  choice: Ketika ia membukanya
  rationale: Prefiks כְּ menyatakan hubungan waktu, ‘ketika’ atau ‘sewaktu’. Pronomina ‘-nya’ secara alami merujuk kembali kepada kitab itu.
- source_word: עָמְדוּ
  choice: berdiri
  rationale: עמד berarti ‘berdiri’. Terjemahan langsung ini tidak memutuskan lebih jauh apakah rakyat baru bangkit berdiri atau memang mengambil sikap berdiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan ‘seluruh rakyat’ dipertahankan untuk mencerminkan penekanan teks Ibrani. ‘Di depan mata’ dipilih untuk mempertahankan citra visual ungkapan sumber.
