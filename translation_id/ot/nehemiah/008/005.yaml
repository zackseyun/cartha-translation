  source_fidelity: 'Terjemahan dengan setia mencerminkan semua unsur utama teks Ibrani: Ezra membuka הספר; tindakan itu terlihat oleh seluruh rakyat; Ezra berada secara fisik lebih tinggi daripada mereka; dan seluruh rakyat berdiri ketika ia membukanya. Pengulangan כָּל־הָעָם dipertahankan. Frasa “lebih tinggi” tepat menghindari kesan keunggulan sosial.'
