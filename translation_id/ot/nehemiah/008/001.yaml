id: NEH.8.1
reference: Nehemiah 8:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּאָסְפ֤וּ כָל הָ/עָם֙ כְּ/אִ֣ישׁ אֶחָ֔ד אֶל הָ֣/רְח֔וֹב אֲשֶׁ֖ר לִ/פְנֵ֣י שַֽׁעַר הַ/מָּ֑יִם וַ/יֹּֽאמְרוּ֙ לְ/עֶזְרָ֣א הַ/סֹּפֵ֔ר לְ/הָבִ֗יא אֶת סֵ֨פֶר֙ תּוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/001.yaml
  text: And all the people gathered as one man at the square that was before the Water Gate[a], and they told Ezra the scribe to bring the Book of the Law of Moses, which Yahweh had commanded Israel.
translation:
  language: id
  text: Seluruh rakyat berkumpul dengan sehati[a] di lapangan yang terletak di depan Pintu Gerbang Air. Mereka menyuruh Ezra, ahli kitab itu, membawa Kitab Taurat Musa, yang diperintahkan Yahweh kepada Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seperti satu orang laki-laki”; sebuah ungkapan yang berarti “sebagai satu kesatuan” atau “dengan satu tekad.”'
    reason: Menjelaskan idiom Ibrani sambil mempertahankan bentuk harfiahnya bagi pembaca.
lexical_decisions:
- source_word: וַיֵּאָסְפוּ כָל הָעָם
  choice: Seluruh rakyat berkumpul
  rationale: Bentuk Nifal dari אסף menyatakan tindakan berhimpun; 'seluruh rakyat' secara alami menyampaikan makna kolektif כָל הָעָם.
- source_word: כְּאִישׁ אֶחָד
  choice: dengan sehati
  rationale: Idiom harfiah 'seperti satu orang laki-laki' menekankan kesatuan tekad dan tindakan. 'Dengan sehati' menyampaikan fungsi idiom itu secara wajar dalam bahasa Indonesia; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: הָרְחוֹב
  choice: lapangan
  rationale: Kata ini menunjuk ruang terbuka umum di kota, bukan jalan dalam pengertian modern.
- source_word: לִפְנֵי שַׁעַר הַמָּיִם
  choice: di depan Pintu Gerbang Air
  rationale: Terjemahan lokatif langsung dan alami; nama tempat diperlakukan sebagai nama diri.
- source_word: וַיֹּאמְרוּ לְעֶזְרָא ... לְהָבִיא
  choice: Mereka menyuruh Ezra ... membawa
  rationale: Secara harfiah 'mereka berkata kepada Ezra untuk membawa'; dengan pelengkap infinitif, 'menyuruh ... membawa' merupakan ungkapan Indonesia yang alami tanpa menambahkan nuansa permohonan.
- source_word: הַסֹּפֵר
  choice: ahli kitab
  rationale: Dalam konteks Ezra, sebutan ini menunjukkan seorang yang terpelajar dan ahli dalam Taurat, bukan sekadar penyalin; 'ahli kitab' merupakan istilah Indonesia yang jelas dan lazim dalam register Alkitab.
- source_word: סֵפֶר תּוֹרַת מֹשֶׁה
  choice: Kitab Taurat Musa
  rationale: סֵפֶר dapat berarti kitab atau gulungan; 'Kitab Taurat Musa' ringkas, konvensional, dan tidak menambahkan klaim kepengarangan di luar konstruksi Ibrani.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: yang telah diperintahkan Yahweh kepada Israel
  rationale: Israel ditandai sebagai objek dari צוה. Susunan Indonesia ini mempertahankan hubungan gramatikal yang padat dalam bahasa Ibrani sambil membiarkan anteseden relatifnya tetap mengikuti bentuk teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Idiom kesatuan כְּאִישׁ אֶחָד
  choice: dengan sehati
  alternative: seperti satu orang laki-laki
  rationale: Terjemahan utama menyampaikan makna idiom secara alami tanpa menjadikan jenis kelamin sebagai pokok yang tidak ditekankan konteks; bentuk Ibrani harfiah dicatat agar citra sumber tetap tersedia.
- issue: Hubungan relatif dalam אֲשֶׁר צִוָּה יְהוָה אֶת יִשְׂרָאֵל
  choice: yang telah diperintahkan Yahweh kepada Israel
  alternative: yang dengannya Yahweh telah memberi perintah kepada Israel
  rationale: Teks Ibrani secara formal menghubungkan klausa relatif dengan 'Taurat Musa', tetapi konstruksinya padat. Pilihan utama mempertahankan ketegangan itu, sedangkan alternatif memperjelas pengertian instrumental dengan menambahkan unsur yang tidak tersurat.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Pemakaian nama diri menjaga pembedaan antara nama perjanjian dan gelar ilahi sebagaimana terdapat dalam sumber Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi menjadi dua untuk keterbacaan. 'Pintu Gerbang Air', 'Kitab Taurat Musa', dan 'Yahweh' memakai kapitalisasi sebagai nama atau sebutan khusus.
