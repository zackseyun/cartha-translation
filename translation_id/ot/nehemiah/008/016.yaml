base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/016.yaml
  text: So the people went out and brought them[a], and made booths for themselves, each on his roof, and in their courtyards, and in the courtyards of the house of God, and in the square of the Water Gate[b], and in the square of the Gate of Ephraim.
translation:
  language: id
  text: Maka orang-orang itu keluar dan membawa bahan-bahan itu, lalu membuat pondok-pondok[a] untuk diri mereka, masing-masing di atas atap rumahnya, di halaman mereka, di pelataran-pelataran rumah Allah, di tanah lapang di Pintu Gerbang Air[b], dan di tanah lapang di Pintu Gerbang Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat-tempat berteduh”. Kata Ibrani yang dipakai berhubungan dengan Hari Raya Pondok Daun.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tanah lapang” menunjuk kepada ruang publik terbuka atau plaza, khususnya yang terkait dengan sebuah pintu gerbang.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ הָעָם
  choice: bangsa itu pergi keluar
  rationale: Menerjemahkan tindakan naratif secara alami; הָעָם dalam konteks ini menunjuk kepada komunitas Israel sebagai satu bangsa.
- source_word: וַיָּבִיאוּ
  choice: membawa bahan-bahan itu
  rationale: Objeknya tersirat, yakni ranting dan dedaunan yang diperintahkan untuk dikumpulkan dalam ayat sebelumnya. Penambahan 'bahan-bahan' memperjelas rujukan tanpa menentukan jenisnya lagi.
- source_word: וַיַּעֲשׂוּ לָהֶם סֻכּוֹת
  choice: membuat pondok-pondok bagi mereka sendiri
  rationale: Kata סֻכּוֹת menunjuk kepada bangunan sementara dalam perayaan tersebut; 'pondok-pondok' mempertahankan hubungan leksikal dengan Hari Raya Pondok Daun, sedangkan 'bagi mereka sendiri' mencerminkan לָהֶם.
- source_word: אִישׁ עַל גַּגּוֹ
  choice: masing-masing di atas atap rumahnya
  rationale: אִישׁ bersifat distributif, 'masing-masing'; גַּג adalah atap datar yang dapat dipakai sebagai tempat mendirikan pondok. 'Rumah' dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: וּבְחַצְרֹתֵיהֶם
  choice: di halaman rumah mereka
  rationale: חָצֵר adalah halaman atau pelataran tertutup. 'Halaman rumah' membedakannya secara alami dari pelataran kompleks rumah Allah.
- source_word: וּבְחַצְרוֹת בֵּית הָאֱלֹהִים
  choice: di pelataran-pelataran rumah Allah
  rationale: Ungkapan ini menunjuk kepada area pelataran dalam kompleks Bait Suci; 'rumah Allah' mempertahankan bentuk sumber tanpa mengganti sebutannya secara interpretatif.
- source_word: וּבִרְחוֹב
  choice: di lapangan dekat
  rationale: רְחוֹב menunjuk kepada ruang publik terbuka atau plaza yang berhubungan dengan gerbang. 'Lapangan dekat' menyampaikan lokasi itu secara jelas dalam bahasa Indonesia.
- source_word: שַׁעַר הַמַּיִם
  choice: Pintu Gerbang Air
  rationale: Diperlakukan sebagai nama tempat dan diterjemahkan secara transparan.
- source_word: שַׁעַר אֶפְרָיִם
  choice: Pintu Gerbang Efraim
  rationale: Diperlakukan sebagai nama gerbang; bentuk ini alami dalam bahasa Indonesia dan mempertahankan nama Efraim.
