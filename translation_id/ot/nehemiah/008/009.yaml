  source_fidelity: 'Makna pokok diterjemahkan dengan setia: Nehemia disebut sebagai pejabat pemerintahan, Ezra memegang kedua peran imam dan ahli kitab, orang-orang Lewi mengajar umat, hari itu kudus bagi Yahweh, dan umat menangis saat mendengar kata-kata Taurat. Terjemahan ''bagi Yahweh'' wajar untuk לַיהוָה dan tidak menghilangkan relasi pengudusan hari tersebut kepada-Nya.'
  naturalness: Susunan 'Ezra, imam dan ahli kitab itu' kurang luwes dalam bahasa Indonesia modern. Kata tunjuk 'itu' tidak diperlukan dan dapat terasa seolah-olah menunjuk seorang ahli kitab tertentu, padahal kedua sebutan itu adalah gelar aposisional bagi Ezra. 'Kata-kata Taurat' juga lebih alami daripada pengulangan harfiah 'perkataan-perkataan Taurat'.
  terminology: Istilah 'Yahweh', 'imam', 'ahli kitab', 'orang-orang Lewi', 'umat', dan 'Taurat' sesuai register Alkitab bahasa Indonesia modern serta mempertahankan istilah penting sumber. Catatan atas 'Tirsyata' dan alternatif bagi 'Taurat' dipertahankan dengan jangkar yang benar.
