base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/009.yaml
  text: Then Nehemiah the governor[a], Ezra the priest and scribe, and the Levites who were instructing the people said to all the people, “This day is holy to Yahweh your God[b]. Do not mourn or weep.” For all the people were weeping as they heard the words of the law.
translation:
  language: id
  text: Lalu Nehemia, sang gubernur[a], Ezra, imam dan ahli kitab, serta orang-orang Lewi yang mengajar umat berkata kepada seluruh umat, “Hari ini kudus bagi Yahweh, Allahmu. Jangan berkabung dan jangan menangis.” Sebab seluruh umat menangis ketika mereka mendengar kata-kata Taurat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sang Tirsyata”, gelar administratif Persia.
    reason: lexical_alternative
  - marker: b
    text: Atau “kata-kata hukum” atau “kata-kata pengajaran”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: sang gubernur
  rationale: Gelar administratif zaman Persia ini diterjemahkan menurut fungsinya agar langsung dipahami; bentuk aslinya dicatat dalam catatan kaki.
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: imam dan ahli kitab itu
  rationale: Kedua nomina merupakan gelar yang menerangkan Ezra dan dipertahankan sebagai dua peran yang berkaitan.
- source_word: הַלְוִיִּם הַמְּבִינִים אֶת־הָעָם
  choice: orang-orang Lewi yang mengajar umat
  rationale: Bentuk Hifil dari בין menyatakan tindakan membuat orang mengerti atau memberi pengajaran; 'mengajar' alami dalam bahasa Indonesia.
- source_word: הַיּוֹם קָדֹשׁ הוּא
  choice: Hari ini kudus
  rationale: Predikasi lugas yang mempertahankan nuansa religius קָדֹשׁ.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa hari itu dikhususkan bagi Yahweh; 'bagi' idiomatis dan mempertahankan relasinya.
- source_word: תִּתְאַבְּלוּ
  choice: berkabung
  rationale: Kata ini menunjuk pada dukacita yang dapat disertai tindakan lahiriah, berbeda dari tindakan menangis pada klausa berikutnya.
- source_word: תִּבְכּוּ / בוֹכִים
  choice: menangis / menangis
  rationale: Padanan ini jelas dan alami, serta mempertahankan pengulangan akar kata dalam bahasa sumber.
- source_word: כְּשָׁמְעָם
  choice: ketika mereka mendengar
  rationale: Menunjukkan respons umat pada saat mendengar pembacaan; 'ketika' lebih alami daripada konstruksi harfiah yang kaku.
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: perkataan-perkataan Taurat
  rationale: Bentuk jamak דִּבְרֵי dipertahankan, sedangkan 'Taurat' sudah dikenal luas dalam bahasa Indonesia dan sesuai dengan konteks pembacaan kitab perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Nama perjanjian yang terdapat langsung dalam teks dipertahankan sebagai nama diri 'Yahweh', tanpa menggantinya dengan gelar.
- issue: Cakupan תּוֹרָה
  choice: Taurat
  alternative: hukum; pengajaran
  rationale: Dalam konteks pembacaan publik ini, 'Taurat' mempertahankan kemungkinan rujukan pada kumpulan ajaran/perintah ilahi tanpa mempersempitnya hanya menjadi hukum legal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Umat' dipilih untuk הָעָם dalam konteks komunitas perjanjian, sementara susunan daftar tokoh dibuat alami tanpa menghilangkan gelar mereka. Semua penanda catatan kaki muncul dalam teks utama.
