base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/013.yaml
  text: And on the second day[a], the heads of the fathers’ houses of all the people, the priests, and the Levites gathered to Ezra the scribe to gain insight into the words of the law.
translation:
  language: id
  text: Pada hari kedua, para kepala kaum keluarga[a] dari seluruh rakyat, para imam, dan orang-orang Lewi berkumpul menemui Ezra, ahli kitab itu, untuk memperoleh pemahaman tentang perkataan Taurat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin keluarga besar.” Secara harfiah, ungkapan Ibrani ini berbunyi “para kepala para ayah” dan menunjuk kepada para pemimpin kaum atau keluarga besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: Pada hari kedua
  rationale: Ungkapan waktu ini melanjutkan alur narasi. Dalam bahasa Indonesia, hubungan tersebut sudah alami tanpa perlu menerjemahkan waw secara tersendiri sebagai “dan”.
- source_word: נֶאֶסְפוּ
  choice: berkumpul
  rationale: Bentuk nifal jamak ini secara alami menyatakan tindakan berkumpul atau berhimpun.
- source_word: רָאשֵׁי הָאָבוֹת
  choice: para kepala kaum keluarga
  rationale: Ungkapan ini menunjuk kepada para pemimpin kelompok kekerabatan atau keluarga besar. Pilihan ini mempertahankan struktur sosial yang dimaksud sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: לְכָל הָעָם
  choice: dari seluruh rakyat
  rationale: Frasa ini menerangkan bahwa para kepala kaum keluarga tersebut berasal dari keseluruhan umat atau rakyat.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: para imam, dan orang-orang Lewi
  rationale: Kedua kelompok ini termasuk dalam daftar pihak yang berkumpul; “orang-orang Lewi” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אֶל עֶזְרָא הַסֹּפֵר
  choice: menemui Ezra, ahli kitab itu
  rationale: Preposisi אֶל menunjukkan gerak menuju Ezra, sedangkan הַסֹּפֵר menyatakan perannya sebagai ahli kitab yang terpelajar, khususnya dalam Taurat.
- source_word: וּלְהַשְׂכִּיל
  choice: untuk memperoleh pemahaman
  rationale: Infinitif hifil dari שׂכל menyatakan tujuan untuk mendapatkan pengertian atau wawasan, bukan sekadar menerima informasi.
- source_word: אֶל דִּבְרֵי הַתּוֹרָה
  choice: tentang perkataan-perkataan Taurat
  rationale: Dalam kaitannya dengan הַשְׂכִּיל, אֶל mengarahkan pemahaman kepada isi atau perkataan Taurat. Bentuk jamak “perkataan-perkataan” mempertahankan דִּבְרֵי, dan “Taurat” sesuai dengan konteks pengajaran perjanjian.
