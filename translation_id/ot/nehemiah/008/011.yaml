base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/011.yaml
  text: And the Levites were quieting all the people[a], saying, “Be still, for the day is holy[b]; do not be grieved.”
translation:
  language: id
  text: Orang-orang Lewi menenangkan seluruh rakyat dengan berkata, “Diamlah,[a] sebab hari ini kudus. Jangan bersedih.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tenanglah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Jangan berduka” atau “Jangan bersusah hati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: Orang-orang Lewi
  rationale: Sebutan baku dan alami dalam bahasa Indonesia untuk kelompok Lewi; bentuk jamak diperjelas dengan pengulangan kata.
- source_word: מַחְשִׁים
  choice: menenangkan
  rationale: Partisip ini menggambarkan tindakan yang sedang berlangsung untuk membuat orang banyak tenang atau diam. Pilihan ini wajar dalam konteks rakyat yang sedang menangis, tanpa menyatakan bahwa mereka dipaksa bungkam.
- source_word: לְכָל הָעָם
  choice: seluruh rakyat
  rationale: עם menunjuk kepada umat atau rakyat yang berkumpul, sedangkan כָל menyatakan keseluruhan.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan ucapan langsung secara alami dalam bahasa Indonesia.
- source_word: הַסּוּ
  choice: Tenanglah
  rationale: Imperatif ini memerintahkan orang banyak untuk diam atau menjadi tenang. 'Tenanglah' sesuai dengan suasana khidmat dan konteks ratapan mereka.
- source_word: כִּי הַיּוֹם קָדֹשׁ
  choice: sebab hari ini kudus
  rationale: כִּי menyatakan alasan, הַיּוֹם secara alami berarti 'hari ini' dalam konteks ini, dan קָדֹשׁ dipertahankan sebagai 'kudus' karena bobot teologisnya.
- source_word: וְאַל תֵּעָצֵבוּ
  choice: Jangan bersedih
  rationale: Bentuk larangan ini menyangkut keadaan berduka atau bersusah hati. 'Bersedih' alami dan tidak membatasi maknanya pada perkabungan ritual.
theological_decisions:
- issue: Makna קָדֹשׁ bagi hari pertemuan umat
  choice: kudus
  alternative: suci
  rationale: '''Kudus'' mempertahankan gagasan bahwa hari itu dikhususkan bagi Allah dan memiliki bobot perjanjian, bukan sekadar bernilai religius secara umum.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara tindakan berkelanjutan orang-orang Lewi, alasan kekudusan hari itu, dan nuansa kesedihan rakyat tetap dipertahankan.
