reference: Nehemiah 8:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָא ב/וֹ֩ לִ/פְנֵ֨י הָ/רְח֜וֹב אֲשֶׁ֣ר לִ/פְנֵ֣י שַֽׁעַר הַ/מַּ֗יִם מִן הָ/אוֹר֙ עַד מַחֲצִ֣ית הַ/יּ֔וֹם נֶ֛גֶד הָ/אֲנָשִׁ֥ים וְ/הַ/נָּשִׁ֖ים וְ/הַ/מְּבִינִ֑ים וְ/אָזְנֵ֥י כָל הָ/עָ֖ם אֶל סֵ֥פֶר הַ/תּוֹרָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/003.yaml
  text: And he read from it before the square that was in front of the Water Gate[a], from daybreak until midday, in the presence of the men and the women and those who could understand[c][b]; and the ears of all the people were attentive to the Book of the Law.
translation:
  language: id
  text: Ia membacanya di lapangan di depan Pintu Gerbang Air, sejak fajar[a] sampai tengah hari, di hadapan laki-laki, perempuan, dan mereka yang dapat mengerti[b]. Seluruh rakyat mendengarkan pembacaan Kitab Taurat[c] dengan saksama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sejak terang”; dapat juga diterjemahkan “sejak dini hari.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mereka yang memiliki pengertian”; kemungkinan mencakup semua orang yang cukup umur untuk memahami pembacaan itu.
    reason: lexical_alternative
  - marker: c
    text: “Kitab” dapat juga diterjemahkan “gulungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא בּוֹ
  choice: Ia membacanya
  rationale: Dalam konteks pembacaan publik dari sebuah kitab atau gulungan, קרא berarti 'membaca'. Akhiran pronominal pada בּוֹ merujuk kepada kitab yang disebut sebelumnya; bentuk 'membacanya' alami dalam bahasa Indonesia.
- source_word: לִפְנֵי הָרְחוֹב אֲשֶׁר לִפְנֵי שַׁעַר הַמַּיִם
  choice: di hadapan lapangan yang ada di depan Pintu Gerbang Air
  rationale: רְחוֹב menunjuk kepada ruang terbuka atau lapangan umum. Pengulangan לִפְנֵי dipertahankan secara wajar sebagai 'di hadapan' dan 'di depan', sedangkan nama tempat diterjemahkan menurut bentuk Indonesia yang transparan.
- source_word: מִן הָאוֹר
  choice: sejak fajar
  rationale: Ungkapan harfiahnya 'sejak terang', tetapi secara temporal menunjuk kepada awal datangnya terang atau fajar.
- source_word: עַד מַחֲצִית הַיּוֹם
  choice: sampai tengah hari
  rationale: Ungkapan ini secara alami berarti pertengahan hari; 'tengah hari' dekat dengan bentuk Ibrani dan lazim dalam bahasa Indonesia.
- source_word: נֶגֶד הָאֲנָשִׁים וְהַנָּשִׁים וְהַמְּבִינִים
  choice: di hadapan laki-laki, perempuan, dan mereka yang dapat mengerti
  rationale: נֶגֶד menandai orang-orang yang hadir sebagai pendengar. הַמְּבִינִים adalah partisip yang menunjuk kepada orang-orang yang mampu memahami, tanpa menentukan usia mereka.
- source_word: וְאָזְנֵי כָל הָעָם אֶל
  choice: Seluruh rakyat memasang telinga untuk mendengarkan
  rationale: Teks Ibrani secara harfiah menggambarkan telinga seluruh rakyat tertuju kepada kitab. Idiom Indonesia 'memasang telinga' mempertahankan gambaran konkret sekaligus menyatakan perhatian mereka dengan jelas.
- source_word: סֵפֶר הַתּוֹרָה
  choice: Kitab Taurat
  rationale: סֵפֶר dapat berarti kitab, gulungan, atau dokumen; תּוֹרָה di sini menunjuk kepada korpus perjanjian tertulis yang dibacakan. 'Kitab Taurat' merupakan istilah Indonesia yang jelas dan dikenal luas.
theological_decisions:
- issue: Arti תּוֹרָה dalam konteks pembacaan publik perjanjian
  choice: Taurat
  alternative: pengajaran; hukum
  rationale: Dalam Nehemia 8, kata itu menunjuk kepada korpus tertulis berotoritas yang dibacakan kepada umat. 'Taurat' mempertahankan identitas historis teks tersebut tanpa membatasi maknanya hanya pada peraturan hukum.
- issue: Cakupan הַמְּבִינִים
  choice: mereka yang dapat mengerti
  alternative: orang-orang yang berpengertian
  rationale: Frasa ini menyatakan kemampuan memahami dan mungkin mencakup anak-anak yang cukup umur untuk mengikuti pembacaan. Terjemahan tidak menetapkan usia atau kelompok tertentu yang tidak dinyatakan oleh teks.
- issue: Penyebutan jenis kelamin dalam kelompok pendengar
  choice: laki-laki, perempuan, dan mereka yang dapat mengerti
  alternative: semua orang yang dapat mengerti
  rationale: Teks Ibrani secara eksplisit menyebut laki-laki dan perempuan, lalu menambahkan kelompok yang ditandai oleh kemampuan memahami. Susunan itu dipertahankan tanpa dilebur menjadi sebutan umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara gambaran konkret tentang telinga yang tertuju kepada bacaan dipertahankan melalui idiom 'memasang telinga'. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
