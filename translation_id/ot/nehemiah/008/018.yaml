  text: וַ֠/יִּקְרָא בְּ/סֵ֨פֶר תּוֹרַ֤ת הָ/אֱלֹהִים֙ י֣וֹם בְּ/י֔וֹם מִן הַ/יּוֹם֙ הָֽ/רִאשׁ֔וֹן עַ֖ד הַ/יּ֣וֹם הָ/אַחֲר֑וֹן וַ/יַּֽעֲשׂוּ חָג֙ שִׁבְעַ֣ת יָמִ֔ים וּ/בַ/יּ֧וֹם הַ/שְּׁמִינִ֛י עֲצֶ֖רֶת כַּ/מִּשְׁפָּֽט׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/018.yaml
  text: And he read from the Book of the Law of God day by day[a], from the first day to the last day. And they kept the feast seven days, and on the eighth day there was a solemn assembly[c][b], according to the ordinance.
translation:
  language: id
  text: Lalu ia membaca dari Kitab Taurat Allah[a] hari demi hari, sejak hari pertama sampai hari terakhir. Mereka merayakan hari raya itu selama tujuh hari, dan pada hari kedelapan diadakan pertemuan khidmat[b], sesuai dengan ketetapan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari gulungan Taurat Allah.” Kata Ibrani סֵפֶר dapat menunjuk pada dokumen tertulis, termasuk gulungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pertemuan penutup.” Istilah Ibrani menunjuk pada pertemuan khusus yang berkaitan dengan berakhirnya hari raya.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagaimana yang ditetapkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Lalu ia membaca
  rationale: Bentuk verba Ibrani bert subjek tunggal dan, bersama בְּסֵפֶר, menunjuk pada tindakan membaca dari teks tertulis, kemungkinan besar dengan suara nyaring. Kata ganti 'ia' mempertahankan subjek tunggal tanpa menambahkan nama Ezra yang tidak disebutkan dalam ayat ini.
- source_word: בְּסֵפֶר תּוֹרַת הָאֱלֹהִים
  choice: dari Kitab Taurat Allah
  rationale: Dengan verba 'membaca', preposisi בְּ wajar diterjemahkan 'dari'. סֵפֶר dapat berarti kitab atau gulungan tertulis; 'Kitab Taurat Allah' alami dalam bahasa Indonesia dan tidak menentukan bentuk fisik naskah secara berlebihan.
- source_word: יוֹם בְּיוֹם
  choice: hari demi hari
  rationale: Ungkapan ini menyatakan tindakan yang dilakukan berulang kali setiap hari serta mempertahankan irama ungkapan Ibrani.
- source_word: מִן הַיּוֹם הָרִאשׁוֹן עַד הַיּוֹם הָאַחֲרוֹן
  choice: sejak hari pertama sampai hari terakhir
  rationale: Terjemahan ini menyampaikan rentang waktu inklusif secara jelas dan alami.
- source_word: וַיַּעֲשׂוּ חָג
  choice: Mereka merayakan hari raya itu
  rationale: Konstruksi עשה + חג berarti melaksanakan atau merayakan suatu hari raya. 'Hari raya itu' mengacu secara alami pada perayaan yang sedang dibicarakan dalam konteks.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Penambahan 'selama' merupakan ungkapan waktu yang alami dalam bahasa Indonesia dan tidak mengubah durasinya.
- source_word: עֲצֶרֶת
  choice: pertemuan raya
  rationale: Istilah ini menunjuk pada pertemuan khusus yang ditetapkan pada penutup perayaan. 'Pertemuan raya' mempertahankan bobot keagamaan istilah itu, sedangkan kemungkinan nuansa penutup dijelaskan dalam catatan kaki.
- source_word: כַּמִּשְׁפָּט
  choice: sesuai dengan ketetapan
  rationale: מִשְׁפָּט di sini menunjuk pada aturan normatif yang mengatur pelaksanaan perayaan, bukan sekadar kebiasaan.
theological_decisions:
- issue: Subjek tunggal untuk pembacaan dan subjek jamak untuk perayaan
  choice: Mempertahankan 'ia membaca' dan 'mereka merayakan'
  alternative: Menyamakan keduanya menjadi subjek jamak, misalnya 'mereka membaca'
  rationale: Bentuk-bentuk Ibrani secara sengaja membedakan seorang pembaca dari komunitas yang merayakan. Nama Ezra tidak dimasukkan ke teks ayat karena hanya tersirat dari konteks.
- issue: Makna kultis עֲצֶרֶת
  choice: pertemuan raya
  alternative: pertemuan khidmat; pertemuan penutup
  rationale: Pilihan utama menyatakan pertemuan keagamaan khusus tanpa mempersempit istilah secara berlebihan. Kemungkinan bahwa istilah itu menekankan pertemuan penutup tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat mempertahankan peralihan dari pembaca tunggal kepada umat secara jamak, sementara istilah keagamaan disampaikan dengan kosakata yang dapat dipahami pembaca umum.
