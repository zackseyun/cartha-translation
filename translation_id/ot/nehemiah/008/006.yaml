  text: וַ/יְבָ֣רֶךְ עֶזְרָ֔א אֶת יְהוָ֥ה הָ/אֱלֹהִ֖ים הַ/גָּד֑וֹל וַ/יַּֽעֲנ֨וּ כָל הָ/עָ֜ם אָמֵ֤ן אָמֵן֙ בְּ/מֹ֣עַל יְדֵי/הֶ֔ם וַ/יִּקְּד֧וּ וַ/יִּשְׁתַּחֲוֻּ֛ לַ/יהוָ֖ה אַפַּ֥יִם אָֽרְצָ/ה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/006.yaml
  text: And Ezra blessed Yahweh[a], the great God, and all the people answered, “Amen, Amen,” while lifting up their hands. Then they bowed down and worshiped Yahweh with their faces to the ground.
translation:
  language: id
  text: Lalu Ezra memuji Yahweh, Allah Yang Mahabesar. Seluruh umat menjawab, “Amin, Amin,”[a] sambil mengangkat tangan. Kemudian mereka membungkuk dan sujud menyembah Yahweh dengan wajah ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Amin, Amin,” suatu jawaban liturgis yang diulang untuk menyatakan persetujuan yang sungguh-sungguh.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memuji
  rationale: Dalam bentuk piel dengan Allah sebagai objek, ברך berarti mengucapkan berkat atau pujian kepada-Nya. “Memuji” menyampaikan makna kontekstual secara alami dalam bahasa Indonesia dan menghindari kesan bahwa Ezra memberikan berkat kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: הָאֱלֹהִים הַגָּדוֹל
  choice: Allah yang besar itu
  rationale: Mempertahankan penegasan bahwa Yahweh adalah Allah yang besar; “itu” menandai frasa definit dalam bahasa Indonesia secara wajar.
- source_word: וַיַּעֲנוּ
  choice: menjawab
  rationale: ענה memperkenalkan jawaban lisan umat terhadap pujian Ezra.
- source_word: אָמֵן אָמֵן
  choice: Amin! Amin!
  rationale: Mempertahankan istilah liturgis dan pengulangannya sebagai ungkapan persetujuan yang tegas.
- source_word: בְּמֹעַל יְדֵיהֶם
  choice: sambil mengangkat tangan
  rationale: Frasa ini menyatakan tindakan yang menyertai jawaban umat; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: וַיִּקְּדוּ
  choice: membungkuk
  rationale: קדד menunjuk pada tindakan menundukkan atau membungkukkan tubuh, dan tetap dibedakan dari tindakan sujud pada verba berikutnya.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: sujud menyembah
  rationale: Verba ini mencakup tindakan merendahkan diri secara fisik sebagai ibadah; ungkapan ini mempertahankan kedua unsur tersebut.
- source_word: אַפַּיִם אָרְצָה
  choice: dengan wajah sampai ke tanah
  rationale: Ungkapan harfiah “wajah ke arah tanah” menggambarkan sujud penuh; pilihan ini menyampaikan posturnya dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Makna ברך ketika Allah menjadi objek
  choice: memuji
  alternative: memberkati
  rationale: “Memberkati” lebih dekat pada bentuk leksikal, tetapi dalam bahasa Indonesia modern dapat memberi kesan bahwa manusia menganugerahkan berkat kepada Allah. “Memuji” menyampaikan fungsi ungkapan ini tanpa menambahkan gagasan teologis lain.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Pengulangan “Amin” serta urutan dua tindakan tubuh dipertahankan; tanda seru mengungkapkan kuatnya jawaban bersama tanpa mengubah isinya.
