source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֞ד עֶזְרָ֣א הַ/סֹּפֵ֗ר עַֽל מִגְדַּל עֵץ֮ אֲשֶׁ֣ר עָשׂ֣וּ לַ/דָּבָר֒ וַ/יַּֽעֲמֹ֣ד אֶצְל֡/וֹ מַתִּתְיָ֡ה וְ/שֶׁ֡מַע וַ֠/עֲנָיָה וְ/אוּרִיָּ֧ה וְ/חִלְקִיָּ֛ה וּ/מַעֲשֵׂיָ֖ה עַל יְמִינ֑/וֹ וּ/מִ/שְּׂמֹאל֗/וֹ פְּ֠דָיָה וּ/מִֽישָׁאֵ֧ל וּ/מַלְכִּיָּ֛ה וְ/חָשֻׁ֥ם וְ/חַשְׁבַּדָּ֖נָה זְכַרְיָ֥ה מְשֻׁלָּֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/004.yaml
  text: Ezra the scribe stood on a wooden platform that they had made for the purpose[a], and beside him stood Mattithiah, Shema, Anaiah, Uriah, Hilkiah, and Maaseiah on his right hand, and Pedaiah, Mishael, Malchijah, Hashum, Hashbaddanah, Zechariah[b], and Meshullam on his left hand.
translation:
  language: id
  text: Ezra, ahli kitab itu, berdiri di atas panggung kayu[a] yang telah mereka buat untuk keperluan itu[b]. Di sebelah kanannya berdiri Matica, Sema, Anaya, Uria, Hilkia, dan Maaseya, sedangkan di sebelah kirinya berdiri Pedaya, Misael, Malkia, Hasum, Hasbadana, Zakharia, dan Mesulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menara kayu”; maksudnya bangunan kayu yang ditinggikan sebagai tempat berdiri.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk perkara itu” atau “untuk peristiwa itu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: ahli kitab
  rationale: Dalam konteks Ezra dan Taurat, סֹפֵר menunjuk kepada orang yang terampil dalam naskah dan hukum; “ahli kitab” menyampaikan fungsi ini secara alami dalam bahasa Indonesia.
- source_word: מִגְדַּל עֵץ
  choice: panggung kayu
  rationale: Secara harfiah berarti “menara kayu”, tetapi dalam konteks pembacaan di hadapan umat, frasa ini merujuk pada bangunan kayu yang ditinggikan sebagai tempat berdiri.
- source_word: לַדָּבָר
  choice: untuk keperluan itu
  rationale: דָּבָר dapat berarti perkataan, perkara, urusan, atau hal. Di sini frasa tersebut paling wajar menunjuk pada keperluan khusus pertemuan itu, tanpa mempersempitnya menjadi satu kegiatan tertentu.
- source_word: אֶצְלוֹ
  choice: di sebelahnya
  rationale: Menunjukkan kedekatan posisi; susunan kalimat kemudian memperjelas siapa yang berada di sisi kanan dan kiri Ezra.
- source_word: עַל יְמִינוֹ / וּמִשְּׂמֹאלוֹ
  choice: di sebelah kanannya / di sebelah kirinya
  rationale: Padanan Indonesia yang alami dan tepat untuk petunjuk posisi di sisi kanan dan kiri Ezra.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Bentuk naratif ini menyatakan tindakan berdiri dan diulang bagi Ezra serta orang-orang di sisinya; terjemahan mempertahankan pengulangan gagasan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama-nama ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar daftar nama dan pembagian sisi kanan-kiri mudah dipahami tanpa menghilangkan informasi sumber.
