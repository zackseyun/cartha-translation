  text: וַֽ/יִּמְצְא֖וּ כָּת֣וּב בַּ/תּוֹרָ֑ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ בְּ/יַד מֹשֶׁ֔ה אֲשֶׁר֩ יֵשְׁב֨וּ בְנֵֽי יִשְׂרָאֵ֧ל בַּ/סֻּכּ֛וֹת בֶּ/חָ֖ג בַּ/חֹ֥דֶשׁ הַ/שְּׁבִיעִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/014.yaml
  text: And they found it written in the Law that Yahweh had commanded through Moses that the sons of Israel should dwell in booths during the feast[a], in the seventh month.
translation:
  language: id
  text: Lalu mereka menemukan tertulis dalam Taurat bahwa Yahweh telah memerintahkan melalui Musa agar orang Israel[a] tinggal di pondok-pondok pada perayaan di bulan ketujuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak-anak Israel”; secara harfiah: “anak-anak lelaki Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ כָּתוּב
  choice: mereka menemukan bahwa ... tertulis
  rationale: Menyampaikan konstruksi Ibrani ‘menemukan [sesuatu] tertulis’ secara alami dalam bahasa Indonesia tanpa menghilangkan tindakan penemuan.
- source_word: בַּתּוֹרָה
  choice: dalam Taurat
  rationale: Dalam konteks ini תּוֹרָה menunjuk pada kumpulan ajaran dan hukum Musa; ‘Taurat’ merupakan istilah Indonesia yang baku dan jelas.
- source_word: צִוָּה יְהוָה
  choice: Yahweh telah memerintahkan
  rationale: Bentuk perfektif menyatakan perintah yang sudah diberikan sebelum ditemukan dalam teks; nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan harfiah ‘dengan tangan Musa’ menyatakan perantaraan atau keagenan; ‘melalui Musa’ alami dan mempertahankan peran Musa sebagai perantara.
- source_word: יֵשְׁבוּ
  choice: tinggal
  rationale: Dalam konteks perayaan, ישׁב berarti menetap untuk sementara di tempat perlindungan, bukan sekadar duduk.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa Israel; terjemahan alami diberi catatan bentuk harfiahnya.
- source_word: בַּסֻּכּוֹת
  choice: di pondok-pondok
  rationale: סֻכּוֹת menunjuk pada tempat tinggal sementara yang dibuat untuk perayaan; ‘pondok-pondok’ konkret, mudah dipahami, dan tidak menyiratkan Kemah Suci.
- source_word: בֶּחָג
  choice: selama hari raya
  rationale: Frasa berartikel ini menunjuk pada perayaan yang sudah dikenal dalam konteks, yakni perayaan pada bulan ketujuh.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada bulan ketujuh
  rationale: Padanan temporal yang langsung dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Dalam perintah perayaan ini ungkapan tersebut berfungsi secara kolektif bagi umat Israel. Terjemahan utama dibuat alami, sedangkan bentuk harfiahnya dicatat agar ciri leksikal sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan urutan gagasan Ibrani sambil menghindari ungkapan kaku seperti ‘dengan tangan Musa’. Penanda catatan [a] ditempatkan tepat setelah frasa yang diterangkannya.
