  text: וַ/אֲשֶׁ֣ר יַשְׁמִ֗יעוּ וְ/יַעֲבִ֨ירוּ ק֥וֹל בְּ/כָל עָרֵי/הֶם֮ וּ/בִ/ירוּשָׁלִַ֣ם לֵ/אמֹר֒ צְא֣וּ הָ/הָ֗ר וְ/הָבִ֨יאוּ֙ עֲלֵי זַ֨יִת֙ וַ/עֲלֵי עֵ֣ץ שֶׁ֔מֶן וַ/עֲלֵ֤י הֲדַס֙ וַ/עֲלֵ֣י תְמָרִ֔ים וַ/עֲלֵ֖י עֵ֣ץ עָבֹ֑ת לַ/עֲשֹׂ֥ת סֻכֹּ֖ת כַּ/כָּתֽוּב־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/015.yaml
  text: and that they should proclaim and spread the message through all their cities and in Jerusalem[a], saying, “Go out to the hill country and bring branches of olive, oil tree, myrtle, palm, and other leafy trees, to make booths[b], as it is written.”
translation:
  language: id
  text: dan bahwa mereka harus mengumumkan dan menyebarkan seruan di semua kota mereka dan di Yerusalem dengan berkata, “Pergilah ke daerah pegunungan dan bawalah daun-daun pohon zaitun, daun-daun pohon minyak[a], daun-daun pohon murad, daun-daun pohon palem, dan daun-daun pohon yang berdaun lebat, untuk membuat pondok-pondok, seperti yang tertulis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “zaitun liar” atau “oleaster”. Identitas tepat tumbuhan Ibrani עֵץ שֶׁמֶן tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: dan bahwa
  rationale: Melanjutkan isi yang ditemukan tertulis dalam Taurat pada ayat sebelumnya serta mempertahankan unsur penghubung dan relatifnya.
- source_word: יַשְׁמִיעוּ וְיַעֲבִירוּ קוֹל
  choice: mereka harus mengumumkan dan menyebarkan seruan
  rationale: Mengungkapkan tindakan membuat sesuatu terdengar dan idiom ‘membuat suara/seruan lewat’ sebagai pengumuman yang diedarkan secara luas.
- source_word: בְּכָל עָרֵיהֶם וּבִירוּשָׁלַם
  choice: di seluruh kota mereka dan di Yerusalem
  rationale: Menerjemahkan cakupan semua permukiman mereka sekaligus menyebut Yerusalem secara khusus.
- source_word: צְאוּ הָהָר
  choice: Pergilah ke daerah pegunungan
  rationale: הָהָר dapat menunjuk gunung atau kawasan perbukitan/pegunungan; konteksnya adalah kawasan tempat dedaunan dikumpulkan.
- source_word: עֲלֵי
  choice: ranting-ranting
  rationale: Secara harfiah berarti ‘daun-daun’, tetapi dalam konteks bahan untuk membangun pondok, ‘ranting-ranting’ secara alami menyatakan dahan berdaun yang dikumpulkan; arti harfiahnya dicatat dalam catatan kaki.
- source_word: עֲלֵי זַיִת
  choice: ranting-ranting pohon zaitun
  rationale: Mempertahankan identifikasi tanaman zaitun dan menyampaikan bahan berdaun yang digunakan untuk pondok.
- source_word: עֵץ שֶׁמֶן
  choice: pohon minyak
  rationale: Terjemahan formal yang tidak memastikan spesies tumbuhan yang identifikasinya tidak pasti.
- source_word: הֲדַס
  choice: pohon murad
  rationale: Padanan Indonesia yang lazim bagi tanaman myrtle.
- source_word: תְמָרִים
  choice: pohon palem
  rationale: Dalam daftar dedaunan, istilah ini menunjuk palem, kemungkinan palem kurma, tanpa perlu mempersempitnya secara tidak pasti.
- source_word: עֵץ עָבֹת
  choice: pohon-pohon lain yang berdaun lebat
  rationale: עָבֹת menggambarkan pepohonan dengan dedaunan yang rimbun atau lebat; ‘lain’ membuat fungsi kategorisnya dalam daftar jelas.
- source_word: לַעֲשׂוֹת סֻכּוֹת
  choice: untuk membuat pondok-pondok
  rationale: סֻכּוֹת adalah tempat tinggal atau naungan sementara yang dibuat untuk perayaan tersebut; ‘pondok-pondok’ mempertahankan istilah bendanya.
