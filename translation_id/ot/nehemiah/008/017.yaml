id: NEH.8.17
reference: Nehemiah 8:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֣וּ כָֽל הַ֠/קָּהָל הַ/שָּׁבִ֨ים מִן הַ/שְּׁבִ֥י סֻכּוֹת֮ וַ/יֵּשְׁב֣וּ בַ/סֻּכּוֹת֒ כִּ֣י לֹֽא עָשׂ֡וּ מִ/ימֵי֩ יֵשׁ֨וּעַ בִּן נ֥וּן כֵּן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/ה֑וּא וַ/תְּהִ֥י שִׂמְחָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/017.yaml
  text: And all the assembly of those who had returned from the captivity made booths and lived in the booths[a], for the sons of Israel had not done so from the days of Jeshua son of Nun until that day. And there was very great rejoicing.
translation:
  language: id
  text: Seluruh umat yang telah kembali dari pembuangan itu membuat pondok-pondok dan tinggal di dalamnya. Sebab sejak zaman Yesua bin Nun[a] sampai hari itu, orang Israel belum pernah melakukannya demikian. Maka ada sukacita yang sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesua bin Nun, yaitu Yosua bin Nun.
    reason: Bentuk nama Ibrani dalam ayat ini adalah יֵשׁוּעַ (Yesua), sedangkan tokoh yang sama lazim dikenal sebagai Yosua.
lexical_decisions:
- source_word: הַקָּהָל
  choice: seluruh umat
  rationale: Menunjukkan komunitas yang berhimpun secara keseluruhan; alami dalam bahasa Indonesia dan tidak terlalu bernuansa kelembagaan.
- source_word: הַשָּׁבִים מִן הַשְּׁבִי
  choice: yang telah kembali dari pembuangan
  rationale: Menyampaikan partisip dan asal kepulangan dengan jelas; 'pembuangan' merupakan padanan baku bagi keadaan tertawan dan terasing yang dimaksud.
- source_word: סֻכּוֹת
  choice: pondok-pondok
  rationale: Mengacu pada tempat tinggal sementara dalam perayaan Hari Raya Pondok Daun tanpa menimbulkan asosiasi dengan Kemah Suci.
- source_word: וַיֵּשְׁבוּ בַסֻּכּוֹת
  choice: tinggal di dalamnya
  rationale: Dalam konteks perayaan, יָשַׁב berarti mendiami, bukan sekadar duduk; pronomina menghindari pengulangan yang kaku.
- source_word: כִּי לֹא עָשׂוּ ... כֵּן
  choice: Sebab ... belum pernah melakukannya demikian
  rationale: Mempertahankan keringkasan dan rujukan anaforis bahasa Ibrani, tanpa menyimpulkan bahwa hari raya itu sama sekali tidak pernah dirayakan.
- source_word: מִימֵי יֵשׁוּעַ בִּן נוּן
  choice: sejak zaman Yesua bin Nun
  rationale: Mencerminkan bentuk nama יֵשׁוּעַ yang terdapat dalam ayat ini; identifikasi dengan nama yang lebih lazim dijelaskan dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Indonesia yang alami dan baku untuk etnonim perjanjian ini serta mencakup komunitas Israel secara kolektif.
- source_word: וַתְּהִי שִׂמְחָה גְּדוֹלָה מְאֹד
  choice: Maka ada sukacita yang sangat besar
  rationale: Menerjemahkan intensitas גְּדוֹלָה מְאֹד secara langsung dan mempertahankan sifat komunal sukacita dalam konteks tersebut.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; umat Israel
  rationale: Di sini frasa tersebut berfungsi sebagai sebutan etnis kolektif, bukan penegasan jenis kelamin; 'orang Israel' tepat dan alami tanpa mengubah cakupannya.
- issue: Identitas יֵשׁוּעַ בִּן נוּן
  choice: Yesua bin Nun
  alternative: Yosua bin Nun
  rationale: Teks ayat memakai bentuk יֵשׁוּעַ. Bentuk itu dipertahankan dalam teks utama, sedangkan identitasnya dengan Yosua yang lebih dikenal dinyatakan dalam catatan kaki.
- issue: Arti klaim bahwa Israel 'belum pernah melakukannya demikian'
  choice: mempertahankan rujukan kepada cara pelaksanaan yang baru saja dijelaskan
  alternative: menyatakan bahwa hari raya itu tidak pernah dirayakan sama sekali sejak zaman Yosua
  rationale: כֵּן berarti 'demikian' dan secara alami merujuk pada pembuatan serta penempatan diri di pondok-pondok sebagaimana diceritakan; terjemahan tidak memperluas klaim melampaui bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan hubungan sebab-akibat, bentuk nama dalam teks Ibrani, dan ambiguitas terbatas pada frasa 'melakukannya demikian'.
