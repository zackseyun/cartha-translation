base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/002.yaml
  text: Then Ezra the priest brought the law before the assembly[a], both men and women, and all who could understand what they heard[b], on the first day of the seventh month.
translation:
  language: id
  text: Lalu Ezra, imam itu, membawa Taurat ke hadapan umat yang berkumpul—laki-laki, perempuan, dan semua orang yang mampu memahami apa yang mereka dengar[a]—pada hari pertama bulan ketujuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “semua orang yang mampu memahami dengan mendengar,” yaitu semua yang dapat mengerti pembacaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיא
  choice: Lalu ... membawa
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: Imam
  rationale: Gelar ini dipertahankan sebagai aposisi bagi Ezra; susunan “Imam Ezra” alami dan tetap jelas dalam bahasa Indonesia.
- source_word: הַתּוֹרָה
  choice: Kitab Taurat
  rationale: Dalam konteks pembacaan publik ini, istilah tersebut menunjuk pada Taurat Musa. “Kitab Taurat” jelas bagi pembaca umum dan mempertahankan bobot khusus istilah Ibrani.
- source_word: לִפְנֵי הַקָּהָל
  choice: ke hadapan umat yang berkumpul
  rationale: Ungkapan ini mempertahankan latar publik dan formal, sedangkan “umat yang berkumpul” mengungkapkan קָהָל secara alami tanpa memberi nuansa gerejawi yang tidak terdapat dalam teks.
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: laki-laki, perempuan
  rationale: Ungkapan Ibrani harfiah “dari laki-laki sampai perempuan” menyatakan cakupan seluruh kumpulan. Padanan ini lebih alami dalam bahasa Indonesia dan tetap menyebut kedua kelompok secara eksplisit.
- source_word: וְכֹל מֵבִין לִשְׁמֹעַ
  choice: dan semua orang yang mampu memahami apa yang mereka dengar
  rationale: Frasa ini menunjuk kepada orang-orang yang dapat mengerti melalui pendengaran, bukan sekadar dapat mendengar secara fisik. Penambahan “apa yang mereka dengar” membuat idiomnya jelas dan alami.
- source_word: בְּיוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada hari pertama bulan ketujuh
  rationale: Ini adalah padanan Indonesia yang lazim bagi rumusan tanggal Ibrani tersebut.
theological_decisions:
- issue: Cakupan berdasarkan gender dalam kumpulan itu
  choice: laki-laki, perempuan
  alternative: dari laki-laki sampai perempuan
  rationale: Teks Ibrani memakai kata benda tunggal bergender untuk menyatakan keseluruhan rentang hadirin. Terjemahan menyebut laki-laki dan perempuan secara eksplisit, tetapi memakai susunan yang alami dalam bahasa Indonesia.
- issue: Penerjemahan תּוֹרָה
  choice: Kitab Taurat
  alternative: hukum; pengajaran
  rationale: Dalam konteks ini istilah tersebut merujuk pada korpus Musa yang dibacakan di depan umum. “Kitab Taurat” mempertahankan kekhususan dan bobot perjanjiannya tanpa mempersempitnya menjadi sekadar aturan hukum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah membantu pembaca mengenali bahwa “laki-laki, perempuan, dan semua orang yang mampu memahami” menjelaskan cakupan umat yang berkumpul. Istilah “Kitab Taurat” dipilih agar rujukannya konkret dan mudah dipahami.
