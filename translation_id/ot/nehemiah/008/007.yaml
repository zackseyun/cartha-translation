base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/007.yaml
  text: And Jeshua[a], Bani, Sherebiah, Jamin, Akkub, Shabbethai, Hodiah, Maaseiah, Kelita, Azariah, Jozabad, Hanan[b], Pelaiah, and the Levites explained the law to the people, while the people remained in their places.
translation:
  language: id
  text: Yesua, Bani, Serebya, Yamin, Akub, Sabetai, Hodia, Maaseya, Kelita, Azarya, Yozabad, Hanan, Pelaya, dan orang-orang Lewi memberi pengertian kepada umat itu tentang hukum Taurat[a], sementara umat itu tetap berada di tempat mereka masing-masing.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “menjelaskan hukum Taurat kepada umat itu.” Kata kerja Ibraninya berbentuk kausatif: mereka membuat umat itu memahami hukum Taurat.'
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “sementara umat itu berada di tempat berdiri mereka.” Ungkapan ini juga dapat dipahami, “sementara umat itu berdiri di tempat mereka masing-masing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֵשׁוּעַ ... פְּלָאיָה
  choice: Yesua, Bani, Serebya, Yamin, Akub, Sabetai, Hodia, Maaseya, Kelita, Azarya, Yozabad, Hanan, Pelaya
  rationale: Nama-nama diri ditransliterasikan dengan ejaan yang wajar dan mudah dibaca dalam bahasa Indonesia, tanpa menerjemahkan maknanya.
- source_word: וְהַלְוִיִּם
  choice: dan orang-orang Lewi
  rationale: Bentuk ini mempertahankan kata penghubung Ibrani dan tidak memastikan apakah sebutan tersebut merupakan aposisi bagi semua nama atau menunjuk kelompok tambahan.
- source_word: מְבִינִים
  choice: membantu ... memahami
  rationale: Partisipel Hifil dari בין bersifat kausatif, yaitu membuat atau menyebabkan orang memahami. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fokus pada pemahaman umat.
- source_word: אֶת־הָעָם לַתּוֹרָה
  choice: membantu umat itu memahami hukum Taurat
  rationale: Susunan Indonesia disesuaikan agar alami, tetapi tetap menyampaikan bahwa umat dibuat memahami תּוֹרָה.
- source_word: לַתּוֹרָה
  choice: hukum Taurat
  rationale: Dalam konteks pembacaan kitab perjanjian, istilah ini menunjuk ajaran atau hukum ilahi yang dibacakan. 'Hukum Taurat' dikenal luas dalam bahasa Indonesia dan lebih tepat secara kontekstual daripada sekadar 'hukum'.
- source_word: וְהָעָם עַל עָמְדָם
  choice: sementara umat itu tetap berada di tempat mereka masing-masing
  rationale: Ungkapan idiomatis Ibrani menunjuk pada umat yang tetap pada tempat berdiri atau posisi mereka. Terjemahan ini alami dan tidak mengharuskan kesimpulan bahwa mereka semua terus berdiri.
