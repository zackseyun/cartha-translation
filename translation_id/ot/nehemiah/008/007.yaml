translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'umat' dipakai untuk עָם dalam konteks perhimpunan Israel; nama-nama mengikuti bentuk transliterasi yang lazim dan mudah dibaca. Ambiguitas frasa penutup mengenai tetap berada atau berdiri dipertahankan melalui catatan kaki.
