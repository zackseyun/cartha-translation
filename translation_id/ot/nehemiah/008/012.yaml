  - severity: low
    issue: Ungkapan “bagian-bagian makanan” kurang alami
    rationale: Pengulangan “bagian-bagian” terdengar kaku dalam bahasa Indonesia modern. “Jatah makanan” tetap menyampaikan arti מָנוֹת dalam konteks perayaan.
