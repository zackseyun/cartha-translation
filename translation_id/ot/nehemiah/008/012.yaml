  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם לֶ/אֱכֹ֤ל וְ/לִ/שְׁתּוֹת֙ וּ/לְ/שַׁלַּ֣ח מָנ֔וֹת וְ/לַ/עֲשׂ֖וֹת שִׂמְחָ֣ה גְדוֹלָ֑ה כִּ֤י הֵבִ֨ינוּ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר הוֹדִ֖יעוּ לָ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/012.yaml
  text: And all the people went away to eat and drink[a], to send portions, and to celebrate with great joy[b], because they had understood the words that had been made known to them.
translation:
  language: id
  text: Kemudian semua orang pergi untuk makan dan minum, mengirimkan jatah makanan[a], dan bersukacita dengan sangat, sebab mereka telah memahami perkataan[b] yang telah diberitahukan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengirimkan jatah makanan”—yakni, jatah makanan kepada orang lain sebagai bagian dari perayaan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hal-hal yang telah dijelaskan kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Lalu ... pergi
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa dan menyatakan bahwa rakyat meninggalkan perhimpunan untuk melakukan kegiatan berikutnya.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan kolektif ini mempertahankan cakupan menyeluruh dan terdengar alami dalam bahasa Indonesia.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  choice: untuk makan dan minum
  rationale: Kedua infinitif menyatakan tujuan kepergian mereka dan dapat diterjemahkan secara langsung.
- source_word: וּלְשַׁלַּח מָנוֹת
  choice: mengirimkan bagian-bagian makanan
  rationale: מָנוֹת menunjuk pada bagian atau jatah, yang dalam konteks perayaan ini berupa makanan. Penyebutan 'makanan' memperjelas maksud tanpa mengubah tindakan mengirim kepada orang lain.
- source_word: וְלַעֲשׂוֹת שִׂמְחָה גְדוֹלָה
  choice: merayakannya dengan sukacita besar
  rationale: Secara harfiah ungkapan ini berarti 'membuat sukacita besar'; bentuk idiomatis Indonesia menyampaikan tindakan perayaan dan intensitasnya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan langsung bagi tindakan dan sukacita rakyat.
- source_word: הֵבִינוּ
  choice: telah memahami
  rationale: Bentuk perfektif menyatakan pemahaman yang sudah tercapai dan menjadi dasar respons mereka.
- source_word: בַּדְּבָרִים
  choice: perkataan-perkataan
  rationale: דְּבָרִים dapat berarti perkataan atau hal-hal. Konteks pembacaan dan pengajaran Taurat mendukung 'perkataan-perkataan', sementara alternatifnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר הוֹדִיעוּ לָהֶם
  choice: yang disampaikan kepada mereka
  rationale: Hifil ידע berarti membuat tahu atau memberitahukan. 'Disampaikan' alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah caranya berupa penjelasan atau pemberitahuan.
theological_decisions:
- issue: Dasar sukacita rakyat setelah mendengar Taurat
  choice: Sukacita mereka dikaitkan langsung dengan pemahaman atas perkataan yang disampaikan kepada mereka.
  alternative: Menjabarkan respons itu secara khusus sebagai pertobatan yang berubah menjadi perayaan atau sebagai pembaruan perjanjian teknis.
  rationale: Ayat ini sendiri menegaskan hubungan sebab-akibat antara pemahaman dan respons mereka; terjemahan tidak menambahkan rumusan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat menjaga gerak naratif dan hubungan sebab-akibat. 'Seluruh rakyat' dipilih daripada 'semua orang' untuk mempertahankan nuansa kolektif עָם; 'merayakannya' memakai objek tersirat, yaitu peristiwa atau hari perayaan dalam konteks.
