  to: Lalu ia berkata kepada mereka, “Pergilah, makanlah makanan berlemak dan minumlah minuman manis. Kirimkan juga porsi makanan kepada siapa pun yang baginya tidak ada yang disiapkan[a], sebab hari ini kudus bagi Tuhan kita. Jangan bersedih, sebab sukacita Yahweh adalah benteng perlindungan kalian[b].”
