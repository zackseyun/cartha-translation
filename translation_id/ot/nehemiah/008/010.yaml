  terminology: “Kudus,” “Tuhan kita,” dan “Yahweh” digunakan secara konsisten dan membedakan gelar ilahi אדנינו dari nama ilahi יהוה. “Sukacita Yahweh” mempertahankan ambiguitas konstruktus tanpa memaksakan tafsiran. “Benteng perlindungan kalian” mempertahankan metafora מָעוֹז serta jumlah jamak penerima ujaran.
