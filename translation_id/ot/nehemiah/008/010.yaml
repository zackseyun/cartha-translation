  text: וַ/יֹּ֣אמֶר לָ/הֶ֡ם לְכוּ֩ אִכְל֨וּ מַשְׁמַנִּ֜ים וּ/שְׁת֣וּ מַֽמְתַקִּ֗ים וְ/שִׁלְח֤וּ מָנוֹת֙ לְ/אֵ֣ין נָכ֣וֹן ל֔/וֹ כִּֽי קָד֥וֹשׁ הַ/יּ֖וֹם לַ/אֲדֹנֵ֑י/נוּ וְ/אַל תֵּ֣עָצֵ֔בוּ כִּֽי חֶדְוַ֥ת יְהוָ֖ה הִ֥יא מָֽעֻזְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/008/010.yaml
  text: Then he said to them[a], “Go, eat rich food and drink sweet drinks, and send portions to anyone for whom nothing is prepared, for this day is holy to our Lord. And do not be grieved[c][b], for the joy of Yahweh is your stronghold.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Pergilah, makanlah makanan berlemak dan minumlah minuman manis. Kirimkan juga porsi makanan kepada siapa pun yang baginya tidak ada yang disiapkan[a], sebab hari ini kudus bagi Tuhan kita. Jangan bersedih, sebab sukacita Yahweh adalah benteng perlindungan kalian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada orang yang baginya tidak ada yang disiapkan.”'
    reason: Ungkapan Ibrani menunjuk kepada orang yang tidak tersedia persiapan atau hidangan perayaan baginya.
  - marker: b
    text: “Sukacita Yahweh” juga dapat dipahami sebagai sukacita di dalam Yahweh atau sukacita Yahweh sendiri.
    reason: Hubungan kata dalam frasa Ibrani חֶדְוַת יְהוָה bersifat ambigu dan tidak sepatutnya dibatasi pada satu tafsiran.
lexical_decisions:
- source_word: מַשְׁמַנִּים
  choice: makanan berlemak
  rationale: Secara harfiah menunjuk pada makanan berlemak atau kaya, yakni hidangan istimewa untuk perayaan. Ungkapan ini tetap alami dalam bahasa Indonesia dan mempertahankan citra konkret teks Ibrani.
- source_word: מַמְתַקִּים
  choice: minuman manis
  rationale: Karena mengikuti kata kerja 'minumlah', istilah bagi hal-hal manis ini secara kontekstual menunjuk pada minuman manis tanpa perlu dipersempit menjadi anggur.
- source_word: מָנוֹת
  choice: bagian-bagian makanan
  rationale: Dalam konteks perjamuan, kata ini menunjuk pada porsi hidangan yang dibagikan. Penambahan 'makanan' memperjelas maksudnya bagi pembaca Indonesia.
- source_word: לְאֵין נָכוֹן לוֹ
  choice: kepada orang yang tidak memiliki apa pun yang telah disiapkan
  rationale: Terjemahan ini mempertahankan gagasan bahwa bagi orang tersebut tidak tersedia persiapan perayaan, sekaligus mengungkapkan bentuk tunggal tak tentu secara wajar.
- source_word: קָדוֹשׁ
  choice: kudus
  rationale: Istilah baku dan berbobot untuk hari yang dikhususkan bagi Allah.
- source_word: לַאֲדֹנֵינוּ
  choice: bagi Tuhan kita
  rationale: Adon di sini merupakan gelar ilahi; 'Tuhan' adalah padanan Indonesia yang alami dan penuh hormat.
- source_word: תֵּעָצֵבוּ
  choice: jangan bersedih
  rationale: Bentuk ini menyampaikan larangan untuk berduka atau mengalami kepedihan emosional secara alami dalam bahasa Indonesia modern.
- source_word: חֶדְוַת יְהוָה
  choice: sukacita Yahweh
  rationale: Mempertahankan hubungan konstruktus Ibrani dan ambiguitas apakah sukacita itu milik Yahweh, berasal dari-Nya, atau terarah kepada-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan untuk mempertahankan nama pribadi dalam teks sumber, bukan diganti dengan sebuah gelar.
- source_word: מָעֻזְּכֶם
  choice: benteng perlindunganmu
  rationale: Kata ini menggambarkan tempat atau sumber kekuatan dan perlindungan. Padanan ini mempertahankan metafora konkret benteng serta memperjelas fungsinya.
theological_decisions:
- issue: Makna חֶדְוַת יְהוָה
  choice: sukacita Yahweh
  alternative: sukacita di dalam Yahweh; sukacita yang diberikan Yahweh; sukacita Yahweh sendiri
  rationale: Hubungan genitif dalam bahasa Ibrani tidak menentukan satu tafsiran saja. Teks utama mempertahankan bentuk yang ambigu, sedangkan catatan menyebutkan kemungkinan interpretatif utamanya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Alih aksara mempertahankan nama perjanjian yang benar-benar muncul dalam sumber Ibrani dan membedakannya dari gelar אֲדֹנֵינוּ, 'Tuhan kita', dalam ayat yang sama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk imperatif jamak diterjemahkan secara natural. 'Makanan berlemak' mempertahankan warna perjamuan kuno; 'benteng perlindungan' menjaga metafora tanpa terdengar kabur. Semua penanda catatan kaki muncul dalam teks utama.
