  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani dengan baik: makanan/minuman perayaan, pembagian porsi, kekudusan hari itu bagi Tuhan kita, larangan bersedih, dan metafora benteng dipertahankan. Namun, לְאֵין נָכוֹן לוֹ lebih tepat menyatakan bahwa tidak ada sesuatu yang disiapkan bagi seseorang, bukan terutama bahwa orang itu tidak memiliki sesuatu yang sudah disiapkan. Sufiks -כם pada מָעֻזְּכֶם juga jelas berbentuk jamak.'
