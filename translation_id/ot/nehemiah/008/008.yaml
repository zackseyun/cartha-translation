  text: They read from the book[a], from the law of God, clearly, and they gave the sense, so that they understood the reading.
translation:
  language: id
  text: Mereka membaca dengan jelas dari kitab itu, yaitu Taurat Allah,[a] lalu menjelaskan maknanya sehingga orang-orang memahami apa yang dibacakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “secara terang” atau “dengan jelas”; istilah Ibrani ini dapat menunjuk pada pembacaan yang jelas, membuat teks menjadi terang melalui penjelasan, atau mungkin menerjemahkannya bagi para pendengar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: Mereka membaca
  rationale: Dengan objek berupa kitab tertulis, קרא secara wajar berarti membaca, dalam konteks ini membaca di hadapan umum.
- source_word: בַסֵּפֶר בְּתוֹרַת הָאֱלֹהִים
  choice: dari kitab itu, yaitu Taurat Allah
  rationale: Preposisi ב bersama קרא dapat menunjukkan sumber bacaan. Frasa kedua menjelaskan kitab yang dimaksud; 'Taurat' mempertahankan pengertian tekstual-perjanjian תּוֹרָה dalam Ezra-Nehemia.
- source_word: מְפֹרָשׁ
  choice: dengan jelas
  rationale: Kata ini menyatakan tindakan membuat sesuatu jelas atau terang tanpa menentukan apakah caranya melalui pelafalan yang jelas, penjelasan, atau penerjemahan.
- source_word: וְשׂוֹם שֶׂכֶל
  choice: lalu menjelaskan maknanya
  rationale: Ungkapan harfiah 'menaruh pemahaman' menunjukkan pemberian pengertian atas teks; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan fungsi penjelasannya.
- source_word: וַיָּבִינוּ
  choice: sehingga orang-orang memahami
  rationale: Bentuk verba ini paling alami dipahami sebagai hasil dari pembacaan dan pemberian pengertian. Subjek eksplisit 'orang-orang' ditambahkan dari konteks agar bahasa Indonesia jelas tanpa mengidentifikasinya secara lebih sempit.
- source_word: בַּמִּקְרָא
  choice: apa yang dibacakan
  rationale: מִקְרָא dapat menunjuk tindakan atau isi pembacaan nyaring; frasa ini alami dan sesuai dengan konteks pembacaan di hadapan umum.
