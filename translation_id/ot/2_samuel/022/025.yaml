source:
  edition: WLC
  text: וַ/יָּ֧שֶׁב יְהוָ֛ה לִ֖/י כְּ/צִדְקָתִ֑/י כְּ/בֹרִ֖/י לְ/נֶ֥גֶד עֵינָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/025.yaml
  text: And Yahweh repaid me according to my righteousness[b][a], according to my cleanness before his eyes.
translation:
  language: id
  text: Dan Yahweh membalas kepadaku sesuai dengan kebenaranku, sesuai dengan kemurnianku[a] di depan mata-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebersihanku.” Istilah Ibrani ini menyatakan kebersihan atau kemurnian.
    reason: lexical_alternative
  - marker: b
    text: Artinya, “dalam pandangan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: Dan ... membalas
  rationale: Bentuk verba dari שוב dalam konstruksi ini menyatakan tindakan memberi balasan kepada seseorang. “Membalas” mempertahankan gagasan ganjaran setimpal tanpa membatasinya hanya pada pahala positif, sedangkan “Dan” mencerminkan penghubung וַ secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi לְ menandai penerima atau objek tidak langsung dari tindakan membalas; “kepadaku” alami dalam susunan kalimat Indonesia ini.
- source_word: כְּצִדְקָתִי
  choice: sesuai dengan kebenaranku
  rationale: צְדָקָה di sini menunjuk pada keadaan benar atau kelurusan hidup. “Kebenaranku” mempertahankan klaim orang pertama dan cakupan moral-kovenantalnya, sementara “sesuai dengan” menyampaikan daya banding כְּ.
- source_word: כְּבֹרִי
  choice: sesuai dengan kemurnianku
  rationale: בֹּר berarti kebersihan atau kemurnian. “Kemurnianku” lebih wajar untuk kualitas moral dalam bahasa Indonesia modern. Kata “tangan” tidak ditambahkan karena tidak terdapat dalam ayat ini.
- source_word: לְנֶגֶד עֵינָיו
  choice: di depan mata-Nya
  rationale: Ungkapan ini secara konkret berarti “di depan mata-Nya” dan secara idiomatis “dalam pandangan-Nya”. Terjemahan utama mempertahankan gambaran mata yang terdapat dalam bahasa Ibrani.
theological_decisions:
- issue: Klaim Daud mengenai kebenaran dan kemurniannya
  choice: Mempertahankan klaim orang pertama sebagaimana dinyatakan teks tanpa pelunakan atau penjelasan doktrinal.
  alternative: Menafsirkannya secara eksplisit sebagai kesetiaan kovenan yang relatif, bukan ketidakberdosaan mutlak.
  rationale: Teks Ibrani secara langsung menyatakan bahwa Yahweh membalas penutur sesuai dengan kebenaran dan kemurniannya. Terjemahan perlu mempertahankan ketegangan teologis ini dan tidak menyelesaikannya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “sesuai dengan” dipertahankan untuk mencerminkan kesejajaran Ibrani. Huruf kapital pada “-Nya” mengikuti kebiasaan penulisan rujukan kepada Allah dalam bahasa Indonesia.
