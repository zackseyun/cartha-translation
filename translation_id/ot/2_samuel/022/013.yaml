  text: From the brightness before him[a], coals of fire blazed forth.
translation:
  language: id
  text: Dari cahaya di hadapan-Nya[a], bara api menyala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari kilau di hadapan-Nya, bara api berkobar.”
    reason: Alternatif leksikal dan puitis bagi נֹגַהּ dan בָּעֲרוּ.
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: Dari cahaya terang
  rationale: נֹגַהּ menyatakan cahaya yang terang atau gemerlap. Frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran teofani; prefiks מִן diterjemahkan sebagai “dari” untuk menyatakan asal.
- source_word: נֶגְדּוֹ
  choice: di hadapan-Nya
  rationale: נֶגֶד dengan sufiks orang ketiga maskulin tunggal menunjuk pada apa yang berada di depan atau di hadapan-Nya. “Di hadapan-Nya” mempertahankan nuansa ruang dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: בָּעֲרוּ
  choice: menyala
  rationale: Bentuk qal dari בער berarti terbakar atau menyala. “Menyala” menyampaikan gambaran hidup tanpa menambahkan tindakan kausatif yang tidak dinyatakan secara eksplisit.
- source_word: גַּחֲלֵי אֵשׁ
  choice: bara api
  rationale: Frasa konstruksi ini secara harfiah berarti bara-bara api. “Bara api” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan citra Ibrani.
theological_decisions:
- issue: Gambaran teofani dan subjek yang tersirat
  choice: Baris ini menggambarkan bara api yang menyala dari cahaya terang di hadapan Allah, tanpa menambahkan bahwa Allah secara langsung menyalakannya.
  alternative: “Cahaya terang-Nya membuat bara api menyala.”
  rationale: Bahasa Ibrani bersifat padat dan puitis. Terjemahan mempertahankan urutan gambaran serta tidak memasukkan hubungan kausal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis dan bermartabat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas penerbitan Alkitab bahasa Indonesia; ungkapan tetap ringkas mengikuti struktur puisi Ibrani.
