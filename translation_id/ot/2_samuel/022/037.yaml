  yaml_path: translation/ot/2_samuel/022/037.yaml
  text: You widen my steps beneath me[b][a], and my ankles have not given way.
translation:
  language: id
  text: Engkau melapangkan langkahku di bawahku, dan pergelangan kakiku tidak goyah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan pergelangan kakiku tidak tergelincir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּרְחִיב
  choice: Engkau melapangkan
  rationale: Bentuk Hifil dari רחב menyatakan tindakan membuat luas atau lapang. “Melapangkan” alami dalam puisi Indonesia dan mempertahankan makna kausatif.
- source_word: צַעֲדַי
  choice: langkahku
  rationale: Kata benda צעד berarti langkah atau derap. Terjemahan ini mempertahankan gambaran konkret Ibrani tanpa menggantinya dengan “tanah”.
- source_word: תַּחְתֵּנִי
  choice: di bawahku
  rationale: Mempertahankan unsur ruang dalam teks Ibrani serta ungkapan puitis tentang ruang gerak dan pijakan yang lapang.
- source_word: וְלֹא
  choice: sehingga ... tidak
  rationale: Walaupun וְ dapat diterjemahkan secara koordinatif sebagai “dan”, dalam bahasa Indonesia hubungan hasil antara kedua klausa lebih alami dinyatakan dengan “sehingga”, tanpa menjadikannya tujuan yang eksplisit.
- source_word: מָעֲדוּ
  choice: goyah
  rationale: מעד dapat berarti tergelincir, terhuyung, atau goyah. Dengan pergelangan kaki sebagai subjek, “goyah” menyampaikan hilangnya kestabilan secara alami.
- source_word: קַרְסֻלָּי
  choice: pergelangan kakiku
  rationale: Kata ini menunjuk pada bagian pergelangan kaki, bukan kaki secara umum. Bentuk tunggal kolektif alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan “melapangkan langkahku di bawahku” sengaja mempertahankan citraan dan keunikan ungkapan Ibrani; klausa kedua dibuat alami bagi pembaca umum.
