  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָ/אֵ֖ל תָּמִ֣ים דַּרְכּ֑/וֹ אִמְרַ֤ת יְהוָה֙ צְרוּפָ֔ה מָגֵ֣ן ה֔וּא לְ/כֹ֖ל הַ/חֹסִ֥ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/031.yaml
  text: As for God[a], his way is blameless; the word of Yahweh is proven; he is a shield to all who take refuge in him.
translation:
  language: id
  text: Adapun Allah, jalan-Nya tidak bercela; firman Yahweh teruji[a]; Dia adalah perisai bagi semua orang yang berlindung kepada-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dimurnikan” atau “diuji.” Kata Ibrani ini membangkitkan gambaran logam yang dimurnikan dalam perapian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Adapun Allah
  rationale: Kata ini berarti “Allah” atau “Allah itu.” “Adapun” secara wajar menandai Allah sebagai topik pada awal klausa tanpa membuat susunan Indonesia terasa kaku.
- source_word: תָּמִים
  choice: tidak bercela
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa jalan atau tindakan Allah utuh dan tanpa cacat. “Tidak bercela” mempertahankan penilaian moral dan kualitatif tanpa menyempitkannya menjadi sekadar kesempurnaan abstrak.
- source_word: דַּרְכּוֹ
  choice: jalan-Nya
  rationale: דֶּרֶךְ dapat berarti jalan atau cara bertindak; “jalan-Nya” mempertahankan citra puitis sekaligus dapat dipahami sebagai cara Allah bertindak.
- source_word: אִמְרַת יְהוָה
  choice: firman Yahweh
  rationale: אִמְרָה menunjuk pada ucapan, perkataan, atau firman. “Firman” alami dalam ragam Alkitab Indonesia dan cukup luas untuk mempertahankan cakupan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: צְרוּפָה
  choice: teruji
  rationale: Kata ini memakai gambaran logam yang dimurnikan melalui peleburan dan dengan demikian terbukti murni. “Teruji” menyampaikan hasil metafora itu dengan jelas; gambaran pemurniannya dicatat dalam catatan kaki.
- source_word: מָגֵן
  choice: perisai
  rationale: Kata ini berarti perisai, di sini sebagai metafora bagi perlindungan Allah.
- source_word: הוּא
  choice: Dia adalah
  rationale: Pronomina Ibrani dinyatakan secara eksplisit sebagai subjek klausa nominal; “adalah” membuat hubungan predikatifnya jelas dalam bahasa Indonesia.
- source_word: לְכֹל
  choice: bagi semua orang
  rationale: Preposisi לְ di sini menyatakan relasi atau manfaat perlindungan; “bagi” merupakan padanan Indonesia yang alami.
- source_word: הַחֹסִים בּוֹ
  choice: yang berlindung kepada-Nya
  rationale: חסה berarti mencari atau mendapatkan perlindungan. “Berlindung kepada-Nya” mempertahankan citra konkret perlindungan, bukan mengubahnya menjadi gagasan abstrak tentang percaya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Daya metaforis צְרוּפָה yang menerangkan firman Yahweh
  choice: teruji
  alternative: dimurnikan, teruji kemurniannya, atau murni
  rationale: Bahasa Ibrani membangkitkan gambaran logam yang dilebur untuk dimurnikan dan diuji. “Teruji” menyampaikan bahwa firman itu telah terbukti dapat diandalkan tanpa meniadakan metafora asal, yang dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara wajar. Bentuk penghormatan “-Nya” dipakai untuk rujukan kepada Allah. Paralelisme tiga klausa dipertahankan dengan tanda titik koma.
