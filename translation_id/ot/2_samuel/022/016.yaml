base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/016.yaml
  text: Then the channels of the sea were seen[a]; the foundations of the world were laid bare at the rebuke of Yahweh[b], at the blast of the breath of his nostrils.
translation:
  language: id
  text: 'Lalu tampaklah alur-alur laut,

    dan tersingkaplah fondasi-fondasi dunia[a]

    oleh hardikan Yahweh[b],

    oleh hembusan napas dari hidung-Nya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “fondasi-fondasi dunia yang dihuni.”
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi ini secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: terlihatlah
  rationale: Bentuk Nifal dari ראה menyatakan bahwa sesuatu menjadi terlihat. Pilihan ini mempertahankan nuansa pasif sekaligus terdengar wajar dalam puisi Indonesia.
- source_word: אֲפִקֵי יָם
  choice: alur-alur laut
  rationale: אֲפִיקִים dapat menunjuk pada alur, palung, atau jalur tempat air mengalir. “Alur-alur laut” mempertahankan gambaran bagian laut yang tersingkap tanpa menafsirkannya secara lebih sempit sebagai mata air.
- source_word: יִגָּלוּ
  choice: tersingkaplah
  rationale: Bentuk Nifal dari גלה berarti dibuka, disingkapkan, atau menjadi nyata. “Tersingkaplah” menyampaikan gambaran puitis tentang dasar dunia yang terbuka.
- source_word: מֹסְדוֹת תֵּבֵל
  choice: dasar-dasar dunia
  rationale: מֹסְדוֹת berarti fondasi atau dasar, sedangkan תֵּבֵל menunjuk pada dunia, sering kali dengan nuansa dunia yang dihuni. “Dasar-dasar dunia” alami dan tetap mempertahankan cakupan kosmisnya.
- source_word: בְּגַעֲרַת
  choice: oleh hardikan
  rationale: גְּעָרָה adalah teguran keras atau hardikan. Preposisi בְּ di sini menyatakan sarana atau sebab; “oleh” mengungkapkan bahwa hardikan ilahi menyebabkan penyingkapan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan sebuah gelar.
- source_word: מִנִּשְׁמַת רוּחַ אַפּוֹ
  choice: oleh embusan napas dari lubang hidung-Nya
  rationale: Ungkapan ini menggambarkan hembusan ilahi yang dahsyat. אַף secara harfiah dapat berarti hidung atau lubang hidung dan secara kiasan kemarahan; terjemahan ini mempertahankan citra antropomorfis konkret dalam puisi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi יהוה. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna אַפּוֹ dalam gambaran napas ilahi
  choice: lubang hidung-Nya
  alternative: murka-Nya
  rationale: אַף dapat menunjuk secara harfiah pada hidung dan secara kiasan pada kemarahan. Konteks “napas/embusan” mendukung citra lubang hidung, tetapi asosiasi dengan murka tetap mungkin dan dicatat melalui keputusan ini.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis. Susunan baris mempertahankan paralelisme Ibrani antara “terlihatlah” dan “tersingkaplah,” serta antara “hardikan” dan “embusan napas.”
