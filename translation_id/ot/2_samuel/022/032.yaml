  text: For who is God besides Yahweh? And who is a rock besides our God?[a]
translation:
  language: id
  text: Sebab siapakah Allah selain Yahweh? Dan siapakah gunung batu selain Allah kita?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “siapakah Gunung Batu selain Allah kita?” Kata Ibrani yang diterjemahkan “gunung batu” sering dipakai sebagai metafora dan kadang-kadang hampir berfungsi sebagai gelar bagi Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan dasar bagi pujian sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: מִי
  choice: siapakah
  rationale: Bentuk tanya retoris yang lugas serta sesuai dengan ragam bahasa yang bermartabat.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks pernyataan monoteistis ini, kata tersebut menunjuk kepada Allah yang sejati.
- source_word: מִבַּלְעֲדֵי
  choice: selain
  rationale: Menyatakan pengecualian dan menegaskan bahwa tidak ada Allah atau gunung batu di luar Yahweh, Allah Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: וּמִי
  choice: Dan siapakah
  rationale: Menjaga hubungan serta kesejajaran puitis antara kedua pertanyaan retoris.
- source_word: צוּר
  choice: gunung batu
  rationale: Mempertahankan metafora Ibrani tentang kekokohan, keamanan, dan perlindungan; ungkapan ini lebih jelas sebagai citra alam daripada kata 'batu' saja dalam bahasa Indonesia.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Mempertahankan akhiran orang pertama jamak dan nuansa pengakuan bersama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama diri itu dan membedakannya dari sebuah gelar.
- issue: Apakah צוּר berfungsi sebagai metafora umum atau gelar
  choice: gunung batu
  alternative: Gunung Batu
  rationale: Sintaksis pertanyaan ini mendukung nomina predikatif sebagai metafora, tetapi pemakaiannya yang hampir menyerupai gelar tetap merupakan kemungkinan yang sah dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran puitis kedua pertanyaan dipertahankan; metafora sumber tidak dijelaskan di dalam teks utama.
