  text: יַרְעֵ֥ם מִן שָׁמַ֖יִם יְהוָ֑ה וְ/עֶלְי֖וֹן יִתֵּ֥ן קוֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/014.yaml
  text: Yahweh thundered from heaven[a], and the Most High gave his voice.
translation:
  language: id
  text: 'Yahweh mengguntur dari langit,

    dan Yang Mahatinggi memperdengarkan suara-Nya.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan suara-Nya”; sebuah ungkapan puitis yang sejajar dengan “mengguntur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְעֵם
  choice: mengguntur
  rationale: Bentuk Hifil dari רעם di sini menggambarkan Yahweh menghasilkan bunyi guruh. Dalam bahasa Indonesia, “mengguntur” alami, padat, dan mempertahankan gambaran teofani badai.
- source_word: מִן שָׁמַיִם
  choice: dari langit
  rationale: שָׁמַיִם dapat berarti langit atau surga. “Dari langit” paling alami dalam gambaran guruh sekaligus tetap memungkinkan nuansa tempat kediaman ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְעֶלְיוֹן
  choice: dan Yang Mahatinggi
  rationale: עֶלְיוֹן berfungsi sebagai gelar ilahi yang sejajar dengan Yahweh; “Yang Mahatinggi” mempertahankan daya superlatifnya dan merupakan ungkapan Indonesia yang lazim.
- source_word: יִתֵּן קוֹלוֹ
  choice: memperdengarkan suara-Nya
  rationale: Secara harfiah ungkapan ini berarti “memberikan suara-Nya.” “Memperdengarkan suara-Nya” menyampaikan idiom itu secara wajar dalam bahasa Indonesia serta mempertahankan kesejajarannya dengan tindakan mengguntur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara יְהוָה dan עֶלְיוֹן
  choice: Keduanya disajikan sebagai sebutan sejajar dalam puisi bagi Allah yang sama.
  alternative: Membaca “Yang Mahatinggi” semata-mata sebagai sebutan tambahan tanpa menekankan kesejajaran puitis.
  rationale: Susunan dua baris menempatkan kedua sebutan dan tindakannya dalam paralelisme, tanpa perlu menambahkan penjelasan teologis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pemenggalan dua baris menampilkan paralelisme Ibrani. Huruf kapital pada “Yang Mahatinggi” dan “suara-Nya” mengikuti pemakaian hormat yang lazim untuk rujukan kepada Allah.
