  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/צַּר לִ/י֙ אֶקְרָ֣א יְהוָ֔ה וְ/אֶל אֱלֹהַ֖/י אֶקְרָ֑א וַ/יִּשְׁמַ֤ע מֵ/הֵֽיכָל/וֹ֙ קוֹלִ֔/י וְ/שַׁוְעָתִ֖/י בְּ/אָזְנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/007.yaml
  text: In my distress I call on Yahweh[a]; I call to my God. He hears my voice from his temple[b], and my cry for help reaches his ears.
translation:
  language: id
  text: Dalam kesesakanku aku berseru kepada Yahweh; kepada Allahku aku berseru. Ia mendengar suaraku dari bait-Nya[a], dan seruanku minta tolong sampai ke telinga-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Bait” juga dapat diterjemahkan “istana” atau “tempat kudus”; dalam konteks ini kemungkinan menunjuk pada kediaman Allah di surga.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: Dalam kesesakanku
  rationale: Ungkapan ini menyatakan keadaan tertekan atau kesusahan. “Dalam kesesakanku” alami dalam bahasa Indonesia dan mempertahankan citra keadaan yang menghimpit.
- source_word: אֶקְרָא
  choice: aku berseru
  rationale: Kata kerja קרא muncul dua kali. “Berseru” cocok dengan konteks doa dalam kesesakan dan memungkinkan pengulangan Ibrani dipertahankan secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֱלֹהַי
  choice: Allahku
  rationale: Bentuk tunggal dengan akhiran orang pertama secara langsung berarti “Allahku”.
- source_word: וַיִּשְׁמַע
  choice: Ia mendengar
  rationale: Bentuk wayyiqtol secara formal bersifat lampau, tetapi dalam syair kesaksian ini bahasa Indonesia dapat memakai bentuk verba yang tidak menandai kala. Terjemahan ini tidak memaksakan penanda waktu yang tidak diwajibkan oleh tata bahasa Indonesia.
- source_word: מֵהֵיכָלוֹ
  choice: dari bait-Nya
  rationale: הֵיכָל dapat berarti bait, istana, atau tempat kudus. “Bait-Nya” mempertahankan nuansa tempat kediaman ilahi dan tetap membuka kemungkinan acuan kepada kediaman surgawi.
- source_word: קוֹלִי
  choice: suaraku
  rationale: Padanan langsung dan alami bagi bentuk nomina dengan akhiran orang pertama.
- source_word: שַׁוְעָתִי
  choice: seruanku minta tolong
  rationale: שַׁוְעָה adalah seruan yang memohon pertolongan. Frasa ini mengungkapkan fungsi seruan secara jelas tanpa menambah isi baru.
- source_word: בְּאָזְנָיו
  choice: sampai ke telinga-Nya
  rationale: Secara harfiah “di telinga-Nya”; ungkapan Indonesia ini mempertahankan gambaran jasmani sekaligus menyampaikan bahwa seruan itu didengar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Makna kediaman ilahi הֵיכָל
  choice: bait-Nya
  alternative: istana-Nya; tempat kudus-Nya
  rationale: Kata tersebut memiliki nuansa kerajaan dan peribadatan serta dapat menunjuk pada kediaman Allah di surga. “Bait-Nya” menjaga resonansi sakral tanpa menentukan lokasi secara berlebihan.
- issue: Aspek waktu וַיִּשְׁמַע
  choice: Ia mendengar
  alternative: Ia telah mendengar; lalu Ia mendengar
  rationale: Wayyiqtol mendukung pembacaan peristiwa lampau, tetapi verba Indonesia tanpa penanda kala dapat mencakupnya dan cocok dengan gaya puitis. Ambiguitas aspek tidak dipersempit secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pengulangan “aku berseru” dipertahankan untuk mencerminkan paralelisme Ibrani. Bentuk pronomina ilahi memakai huruf kapital sesuai kebiasaan penulisan religius Indonesia.
