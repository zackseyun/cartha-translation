  text: Foreigners lose heart and come trembling out of their strongholds[a][b][c].
translation:
  language: id
  text: Orang-orang asing kehilangan keberanian dan keluar dengan gemetar dari kubu-kubu pertahanan mereka[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Orang-orang asing menjadi layu.” Kata kerja Ibraninya, secara lebih harfiah, dapat berarti “layu” atau “memudar.”
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani di sini sulit dipahami; kemungkinan lain mencakup “datang dengan merendahkan diri,” “datang terpincang-pincang,” atau, secara lebih harfiah, “mengikatkan ikat pinggang mereka.”
    reason: lexical_alternative
  - marker: c
    text: Atau “dari benteng-benteng mereka”; lebih kecil kemungkinannya, “dari penjara-penjara atau tempat-tempat tertutup mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Orang-orang asing
  rationale: Frasa konstruksi ini secara harfiah berarti ‘anak-anak keasingan/orang asing’, tetapi merupakan ungkapan bagi bangsa atau orang asing. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan makna kolektifnya.
- source_word: יִבֹּלוּ
  choice: kehilangan keberanian
  rationale: Kata kerja נבל lazimnya berarti ‘layu’ atau ‘memudar’. Dalam konteks puisi kemenangan militer, maknanya secara kiasan menunjuk pada runtuhnya semangat atau daya hidup; alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: וְיַחְגְּרוּ
  choice: keluar dengan gemetar
  rationale: Bentuk ini sulit ditafsirkan. Walaupun akar חגר biasanya berarti ‘mengikatkan pada pinggang/bersiap’, dalam konteks ini bentuk tersebut dapat menggambarkan musuh yang keluar dalam ketakutan. Terjemahan ini mengikuti konteks tanpa menutupi ketidakpastian leksikal.
- source_word: מִמִּסְגְּרוֹתָם
  choice: dari kubu-kubu pertahanan mereka
  rationale: מִסְגְּרוֹת dapat menunjuk pada tempat tertutup atau tempat pengurungan. Dalam nyanyian kemenangan militer, kubu pertahanan paling sesuai dengan konteks, sementara kemungkinan lain dicatat.
