  text: With the pure you show yourself pure[a], but with the crooked you show yourself twisted.
translation:
  language: id
  text: Terhadap orang yang murni, Engkau menunjukkan diri-Mu murni; tetapi terhadap orang yang bengkok, Engkau berlaku berbelit-belit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani di sini langka dan maknanya tidak pasti. Dapat juga diterjemahkan, “Engkau bertindak cerdik” atau “Engkau berlaku berlawanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: murni
  rationale: Kata sifat ini menyatakan kemurnian atau kebersihan. “Murni” alami dalam bahasa Indonesia dan memungkinkan pengulangan akar kata pada verba berikutnya tetap terlihat.
- source_word: תִּתָּבָר
  choice: Engkau menunjukkan diri-Mu murni
  rationale: Bentuk verba ini kemungkinan bernuansa refleksif. Ungkapan ini mempertahankan hubungan akar katanya dengan נָבָר dan kesejajaran puitis ayat tersebut.
- source_word: עִקֵּשׁ
  choice: orang yang bengkok
  rationale: Kata ini menggambarkan orang yang secara moral menyimpang, sesat, atau licik. “Bengkok” mempertahankan metafora Ibrani dan menjadi lawan puitis bagi “murni”.
- source_word: תִּתַּפָּל
  choice: Engkau berlaku berbelit-belit
  rationale: Verba yang langka dan sulit ini tampaknya menggambarkan tanggapan Allah yang sepadan terhadap orang bengkok. Pilihan ini mempertahankan gambaran memutar atau berliku serta ketegangan teks, tanpa diam-diam menggantinya dengan penafsiran yang lebih lunak.
- source_word: עִם
  choice: terhadap
  rationale: Dalam kesejajaran ini preposisi tersebut menyatakan bagaimana Allah berurusan dengan golongan orang tertentu. “Terhadap” lebih alami daripada “dengan” dalam bahasa Indonesia untuk hubungan ini.
theological_decisions:
- issue: Cara menerjemahkan tanggapan Allah kepada orang bengkok tanpa menghapus ketegangan puitis teks
  choice: Engkau berlaku berbelit-belit
  alternative: Engkau bertindak cerdik; Engkau berlaku berlawanan
  rationale: Bahasa sumber memasangkan sifat orang bengkok dengan tindakan Allah yang digambarkan melalui verba langka bernuansa memutar atau berliku. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menjelaskan ketidakpastian leksikal tanpa menetapkan bahwa Allah memiliki kebengkokan moral.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “murni” dipertahankan untuk mencerminkan permainan akar kata Ibrani; “berbelit-belit” mempertahankan citra antitesisnya dan dijelaskan melalui catatan kaki.
