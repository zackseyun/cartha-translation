  text: 'And he said: “The LORD is my rock and my fortress and my deliverer for me.”'
translation:
  language: id
  text: Ia berkata, “TUHAN adalah batu karangku, bentengku, dan pembebasku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian terakhir berbunyi “dan pembebasku bagiku.”
    reason: Mencatat לִי yang eksplisit dalam teks Ibrani tanpa memaksakan penafsiran atas nuansa datifnya.
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital.
- source_word: סַלְעִי
  choice: gunung batuku
  rationale: סֶלַע menunjuk pada batu besar atau tebing batu sebagai tempat perlindungan; 'gunung batuku' merupakan ungkapan puitis yang mapan dan alami dalam bahasa Indonesia.
- source_word: מְצֻדָתִי
  choice: bentengku
  rationale: Menyampaikan gambaran tempat pertahanan atau perlindungan yang kokoh.
- source_word: מְפַלְטִי
  choice: pembebasku
  rationale: Partisipiel ini menyatakan sosok yang meluputkan atau menyelamatkan; 'pembebasku' mempertahankan bentuk pelaku.
- source_word: לִי
  choice: tidak diulang dalam teks utama
  rationale: Datif לִי menegaskan hubungan pribadi ('bagiku'), tetapi dalam bahasa Indonesia maknanya sudah dinyatakan secara alami oleh akhiran posesif '-ku' pada 'pembebasku'; nuansa bentuk Ibrani dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: TUHAN adalah konvensi pembaca Indonesia yang luas dan tidak menambahkan pelafalan nama yang tidak tertulis lengkap dalam teks konsonantal.
- issue: Dativus לִי setelah 'pembebasku'
  choice: Maknanya dijelaskan dalam catatan kaki, bukan diterjemahkan secara kaku sebagai 'pembebasku bagiku'
  alternative: dan pembebasku bagiku
  rationale: Terjemahan harfiah tersebut janggal dan redundan dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bukti bentuk sumber tanpa mengaburkan makna.
translation_notes:
  register: Puisi yang ringkas, khidmat, dan mudah dipahami. Metafora perlindungan dipertahankan, dengan susunan tiga sebutan paralel.
