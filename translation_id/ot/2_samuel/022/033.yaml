id: 2SA.22.33
reference: 2 Samuel 22:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָ/אֵ֥ל מָעוּזִּ֖/י חָ֑יִל וַ/יַּתֵּ֥ר תָּמִ֖ים דרכ/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/033.yaml
  text: God is my strong refuge[a], and he makes my way blameless.
translation:
  language: id
  text: 'Allah adalah tempat perlindunganku yang kuat,

    dan Ia membuat jalanku tidak bercela.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengikuti bentuk konsonantal secara lebih harfiah, “dan Ia membuat jalan-Nya tidak bercela.” Bagian sejajar dalam Mazmur 18:33 mendukung “jalanku.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Bentuk dengan kata sandang menunjuk kepada Allah sebagai sebutan yang sudah tertentu; dalam bahasa Indonesia, 'Allah' merupakan padanan yang alami dan lugas.
- source_word: מָעוּזִּי חָיִל
  choice: tempat perlindunganku yang kuat
  rationale: מָעוֹז menyatakan tempat atau sumber perlindungan dan kekuatan, sedangkan חָיִל menegaskan daya atau kekuatannya. Susunan ini alami dalam bahasa Indonesia dan tidak mempersempit gambaran menjadi benteng militer.
- source_word: וַיַּתֵּר
  choice: Ia membuat
  rationale: Kata kerja ini sulit ditafsirkan, tetapi dalam konstruksi ini dan berdasarkan kesejajaran dengan Mazmur 18:33, maknanya paling wajar ialah menjadikan atau menetapkan jalan dalam keadaan yang dinyatakan oleh תָּמִים.
- source_word: תָּמִים
  choice: tidak bercela
  rationale: Kata ini dapat menyatakan keutuhan, integritas, atau keadaan tanpa cela. 'Tidak bercela' mempertahankan bobot moralnya tanpa menyiratkan kesempurnaan mutlak dalam segala hal.
- source_word: דרכו
  choice: jalanku
  rationale: Bentuk konsonantal dapat dipahami sebagai 'jalan-Nya', tetapi bacaan pembanding dalam Mazmur 18:33 mendukung orang pertama, 'jalanku'. Ambiguitas tekstual dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Akhiran pronominal pada kata terakhir
  choice: Allah membuat jalan si pembicara tidak bercela ('jalanku').
  alternative: Allah membuat jalan-Nya tidak bercela.
  rationale: Teks konsonantal Samuel mendukung kemungkinan 'jalan-Nya', sedangkan bagian sejajar dalam Mazmur 18:33 mendukung 'jalanku'. Bacaan orang pertama lebih selaras dengan konteks tentang tindakan Allah bagi pemazmur, tetapi alternatif yang sungguh ada tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang sederhana dan bermartabat. Larik dibagi mengikuti dua unsur utama ayat. Kata ganti bagi Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
