id: 2SA.22.4
reference: 2 Samuel 22:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מְהֻלָּ֖ל אֶקְרָ֣א יְהוָ֑ה וּ/מֵ/אֹיְבַ֖/י אִוָּשֵֽׁעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/004.yaml
  text: I call on Yahweh[a], who is worthy of praise, and I am saved from my enemies.
translation:
  language: id
  text: Aku berseru kepada Yahweh, yang patut dipuji,[a] dan aku diselamatkan dari musuh-musuhku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dipuji” atau “yang harus dipuji.” Bentuk Ibraninya menggambarkan Yahweh sebagai Dia yang patut menerima pujian.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: yang patut dipuji
  rationale: Partisipel pasif dari הלל menerangkan Yahweh sebagai Dia yang patut menerima pujian. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya adjektival bentuk Ibrani.
- source_word: אֶקְרָא
  choice: Aku berseru kepada
  rationale: Dalam konstruksi dengan nama ilahi, קרא menyatakan tindakan memanggil atau berseru kepada Allah, bukan sekadar menyebut nama-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: וּמֵאֹיְבַי
  choice: dan ... dari musuh-musuhku
  rationale: Konjungsi ו menghubungkan klausa, sedangkan מִן menyatakan sumber atau pihak yang darinya pemazmur diselamatkan. Bentuk jamak dengan sufiks orang pertama diterjemahkan “musuh-musuhku”.
- source_word: אִוָּשֵׁעַ
  choice: aku diselamatkan
  rationale: Bentuk Nifal imperfek orang pertama tunggal dari ישׁע menyatakan bahwa penutur mengalami penyelamatan. Bentuk kini pasif cocok dengan corak kebiasaan atau kesaksian umum dalam konteks puitis ini, tanpa menutup kemungkinan nuansa prospektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Aspek waktu אִוָּשֵׁעַ
  choice: aku diselamatkan
  alternative: aku akan diselamatkan; aku memperoleh keselamatan
  rationale: Imperfek Ibrani dalam puisi dapat bernuansa kebiasaan, kini, atau prospektif. Terjemahan “aku diselamatkan” mengikuti hubungan umum antara berseru kepada Yahweh dan mengalami pembebasan, sambil mencatat bahwa nuansa masa depan tetap mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. “Berseru kepada” dipilih sebagai ungkapan doa yang alami; “musuh-musuhku” mempertahankan bentuk jamak sumber.
