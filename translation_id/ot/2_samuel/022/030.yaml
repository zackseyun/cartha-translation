  text: For by you I can run against a troop[c][b][a]; by my God I can leap over a wall.
translation:
  language: id
  text: Sebab, dengan-Mu[a] aku dapat menerjang pasukan[b]; dengan Allahku aku dapat melompati tembok[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh-Mu” atau “melalui-Mu”; preposisi Ibrani dapat menyatakan penyertaan ataupun sarana.
    reason: lexical_alternative
  - marker: b
