  terminology: “Allahku” tepat untuk אֱלֹהַי dan mempertahankan nada personal. “Pasukan” adalah padanan modern yang baik bagi גְּדוּד; kemungkinan “gerombolan penyerbu” perlu tetap dicatat. “Tembok” tepat untuk שׁוּר, dengan “kubu pertahanan” sebagai alternatif yang lebih kontekstual.
