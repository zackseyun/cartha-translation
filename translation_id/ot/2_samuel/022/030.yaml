lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata penghubung ini memperkenalkan dasar bagi pujian atau kesaksian sebelumnya; “Sebab” mempertahankan hubungan penjelas itu secara alami.
- source_word: בְכָה
  choice: dengan pertolongan-Mu
  rationale: Preposisi ב dapat menyatakan penyertaan atau sarana. Dalam konteks ini, ungkapan tersebut dipahami sebagai sarana atau pemampuan ilahi; penambahan “pertolongan” membuat maksudnya jelas dan alami dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: אָרוּץ
  choice: aku dapat menyerbu
  rationale: Bentuk imperfek orang pertama tunggal dari רוץ secara harfiah berkaitan dengan berlari, tetapi bersama objek militer גְּדוּד menyatakan gerak menyerang. “Dapat” mengungkapkan kemampuan yang dimungkinkan Allah, sedangkan “menyerbu” menghasilkan ungkapan Indonesia yang wajar.
- source_word: גְּדוּד
  choice: sepasukan orang
  rationale: Kata ini menunjuk pasukan, gerombolan, atau kelompok penyerbu. “Sepasukan orang” jelas dalam konteks perang dan tidak terlalu menentukan apakah mereka tentara resmi atau kelompok penyerbu.
- source_word: בֵּאלֹהַי
  choice: dengan pertolongan Allahku
  rationale: Preposisi yang berulang kembali dipahami sebagai sarana atau pemampuan, sementara “Allahku” mempertahankan nada pribadi teks.
- source_word: אֲדַלֶּג
  choice: aku dapat melompati
  rationale: Bentuk piel dari דלג berarti melompat atau meloncat. “Dapat melompati” mempertahankan kesejajaran dengan kemampuan pada bagian pertama.
- source_word: שׁוּר
  choice: tembok
  rationale: Dalam gambaran pertahanan militer, שׁוּר menunjuk tembok atau kubu. “Tembok” merupakan padanan langsung dan mudah dipahami.
theological_decisions:
- issue: Pemampuan ilahi dalam gambaran perang
  choice: 'Ayat ini menyatakan kemampuan yang diberikan Allah: “aku dapat menyerbu ... aku dapat melompati.”'
  alternative: 'Menerjemahkannya sebagai tindakan biasa tanpa menyatakan kemampuan secara eksplisit: “aku menyerbu ... aku melompati.”'
  rationale: Dalam puisi ini, bentuk-bentuk imperfek dapat menyatakan kemampuan atau pengalaman yang berulang karena pemampuan Allah. Pilihan ini mempertahankan penekanan bahwa keberhasilan berasal dari Allah tanpa memasukkan kesimpulan doktrinal yang melampaui ayat.
- issue: Makna preposisi ב dalam בְכָה dan בֵּאלֹהַי
  choice: 'Dipahami sebagai sarana atau pemampuan: “dengan pertolongan-Mu / dengan pertolongan Allahku.”'
  alternative: 'Dipahami sebagai penyertaan: “bersama-Mu / bersama Allahku.”'
  rationale: Kedua makna dimungkinkan secara leksikal. Konteks kesaksian tentang keberhasilan militer lebih mendukung nuansa sarana, tetapi alternatif penyertaan tetap dicatat karena ambiguitas Ibrani itu nyata.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “dengan pertolongan” dipertahankan demi kesejajaran kedua larik. “Menyerbu sepasukan orang” dipilih daripada terjemahan harfiah “berlari terhadap pasukan” agar idiom perang terbaca alami. Semua penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkan.
