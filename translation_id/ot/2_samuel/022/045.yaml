translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Susunan klausa mengikuti paralelisme syair Ibrani, sedangkan idiom yang bila diterjemahkan harfiah terasa janggal dibuat alami. Nuansa ketundukan yang enggan dipertahankan dalam teks dan alternatif ketidak-tulusan dicatat dalam catatan kaki.
