  text: The sons of foreigners come cringing to me[b][a]; at the hearing of the ear they obey me.
translation:
  language: id
  text: Orang-orang asing tunduk dengan enggan kepadaku[a]; begitu mendengar[b], mereka menaatiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berpura-pura taat kepadaku.” Kata Ibrani ini dapat menyiratkan ketundukan yang terpaksa atau tidak tulus.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pada pendengaran telinga”; maksudnya, segera setelah mereka mendengar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: Orang-orang asing
  rationale: Ungkapan harfiah 'anak-anak orang asing/negeri asing' merupakan idiom Ibrani yang menunjuk kepada orang-orang asing. Bentuk alami dalam bahasa Indonesia adalah 'orang-orang asing'.
- source_word: יִתְכַּחֲשׁוּ לִי
  choice: tunduk dengan enggan kepadaku
  rationale: Bentuk Hitpael dari כחש dalam konteks kemenangan ini menyatakan ketundukan yang terpaksa atau tidak tulus, bukan ketaatan sukarela. Terjemahan ini mempertahankan gagasan tunduk sekaligus nuansa keengganannya.
- source_word: לִשְׁמֹעַ אֹזֶן
  choice: begitu mendengar
  rationale: Idiom harfiah 'pada pendengaran telinga' menyatakan respons segera setelah mendengar. 'Begitu mendengar' menyampaikan maknanya secara alami.
- source_word: יִשָּׁמְעוּ לִי
  choice: mereka menaatiku
  rationale: שׁמע dengan ל dalam konteks ini berarti mengindahkan atau menaati, bukan sekadar mendengar.
