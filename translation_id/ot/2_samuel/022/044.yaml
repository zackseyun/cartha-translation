  text: וַֽ/תְּפַלְּטֵ֔/נִי מֵ/רִיבֵ֖י עַמִּ֑/י תִּשְׁמְרֵ֨/נִי֙ לְ/רֹ֣אשׁ גּוֹיִ֔ם עַ֥ם לֹא יָדַ֖עְתִּי יַעַבְדֻֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/044.yaml
  text: You delivered me from the strivings of my people[a]; you kept me as the head of nations[c][b]; a people I had not known served me.
translation:
  language: id
  text: Engkau melepaskan aku dari pertikaian bangsaku[a]; Engkau memelihara aku sebagai kepala bangsa-bangsa[b]; suatu bangsa yang tidak kukenal melayani aku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari perselisihan bangsaku.” Bahasa Ibrani dapat menunjuk pada pertikaian di antara bangsa Daud sendiri atau konflik yang melibatkan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau “Engkau mempertahankan aku sebagai pemimpin atas bangsa-bangsa.”
    reason: lexical_alternative
  - marker: c
    text: Atau “suatu bangsa yang tidak kukenal akan melayani aku.” Bentuk kata kerja Ibrani dalam puisi ini dapat bernuansa mendatang, berkelanjutan, atau dipahami sebagai hasil yang telah terjadi.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַתְּפַלְּטֵנִי
  choice: Engkau melepaskan aku
  rationale: Bentuk Hifil dari פלט menyatakan tindakan membuat seseorang luput atau selamat. “Melepaskan” alami dalam konteks pertolongan ilahi dan tidak terlalu menyempitkan caranya.
- source_word: מֵרִיבֵי עַמִּי
  choice: dari pertikaian bangsaku
  rationale: רִיב dapat berarti pertikaian, perselisihan, atau perbantahan. Frasa konstruksi ini tetap dibiarkan cukup luas untuk mencakup konflik internal di antara bangsa Daud maupun konflik yang melibatkan mereka.
- source_word: תִּשְׁמְרֵנִי
  choice: Engkau memelihara aku
  rationale: שׁמר berarti menjaga, memelihara, atau mempertahankan. “Memelihara” menyampaikan keberlanjutan perlindungan dan kedudukan tanpa menjadikannya sekadar tindakan sesaat.
- source_word: לְרֹאשׁ גּוֹיִם
  choice: sebagai kepala bangsa-bangsa
  rationale: רֹאשׁ dipakai secara metaforis untuk pemimpin atau penguasa, sedangkan לְ menunjukkan peran atau hasil. Metafora “kepala” dipertahankan karena jelas dan wajar dalam bahasa Indonesia.
- source_word: עַם לֹא יָדַעְתִּי
  choice: suatu bangsa yang tidak kukenal
  rationale: עַם adalah nomina kolektif tunggal, dan ידע di sini menyatakan pengenalan atau hubungan sebelumnya. Ungkapan Indonesia ini mempertahankan ketidakpastian apakah yang dimaksud pengetahuan pribadi, hubungan, atau pengakuan politik.
- source_word: יַעַבְדֻנִי
  choice: akan melayani aku
  rationale: עבד dalam konteks kerajaan dapat menunjuk pelayanan atau ketundukan politik. Bentuk imperfek mendukung nuansa mendatang atau berkelanjutan; “akan melayani” mempertahankan nuansa itu tanpa memparafrasakannya menjadi penaklukan.
theological_decisions:
- issue: Bahasa kerajaan tentang kekuasaan atas bangsa-bangsa asing
  choice: Mempertahankan makna historis-kerajaan dalam konteks nyanyian Daud.
  alternative: Menjadikannya secara eksplisit nubuat mesianik dalam teks utama.
  rationale: Konteks langsung berbicara tentang pembebasan dan pemerintahan Daud. Kemungkinan pembacaan tipologis atau mesianik dalam cakupan kanonis tidak dimasukkan ke dalam terjemahan ayat.
- issue: Waktu tindakan bangsa yang tidak dikenal
  choice: “akan melayani aku,” mengikuti kemungkinan nuansa mendatang dari imperfek Ibrani.
  alternative: “melayani aku,” sebagai tindakan lampau atau gambaran hasil yang telah dialami.
  rationale: Imperfek puitis יַעַבְדֻנִי dapat dipahami sebagai tindakan mendatang, kebiasaan, atau hasil berkelanjutan. Teks utama memilih nuansa mendatang, sedangkan alternatifnya dicatat agar ambiguitas bentuk tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan kepada Allah memakai “Engkau”; bentuk terikat “kuk kenal” diwujudkan secara baku sebagai “kukenal”. Metafora kerajaan “kepala bangsa-bangsa” dipertahankan, sementara catatan kaki memberi padanan yang lebih idiomatis.
