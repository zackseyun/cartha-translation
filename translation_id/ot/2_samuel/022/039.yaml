translation:
  language: id
  text: Aku membinasakan mereka[a] dan meremukkan mereka[b]; mereka tidak bangkit; mereka jatuh di bawah kakiku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melahap mereka”; dalam konteks peperangan, kata ini dapat berarti “membinasakan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menghancurkan mereka” atau “melukai mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲכַלֵּם
  choice: Aku menghabisi mereka
  rationale: Kata kerja אכל secara harfiah berarti ‘memakan’ atau ‘melahap’, tetapi dalam konteks permusuhan dapat berarti menghabiskan atau membinasakan. ‘Menghabisi’ mempertahankan daya bahasa peperangan tanpa terdengar tidak wajar dalam bahasa Indonesia.
- source_word: וָאֶמְחָצֵם
  choice: dan meremukkan mereka
  rationale: Kata מחץ menyatakan pukulan keras yang meremukkan, menghancurkan, atau melukai. ‘Meremukkan’ mempertahankan gambaran kekalahan yang keras dan tuntas.
- source_word: וְלֹא יְקוּמוּן
  choice: mereka tidak bangkit
  rationale: Terjemahan ini mempertahankan pernyataan langsung dalam bahasa Ibrani tanpa menambahkan arti modal ‘tidak dapat’ atau kata ‘lagi’ yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּפְּלוּ
  choice: lalu jatuh
  rationale: נפל lazim berarti ‘jatuh’. ‘Lalu’ mengungkapkan kelanjutan peristiwa yang dapat dibawa oleh waw dalam rangkaian puisi naratif.
- source_word: תַּחַת רַגְלָי
  choice: di bawah kakiku
  rationale: Ungkapan ini mempertahankan gambaran konkret tentang penaklukan dan kekalahan di bawah kaki sang pemenang.
theological_decisions:
- issue: Gambaran kekerasan dalam nyanyian kemenangan Daud
  choice: Mempertahankan bahasa orang pertama tentang penghancuran dan penaklukan musuh
  alternative: Melunakkannya menjadi ‘Aku mengalahkan mereka sepenuhnya’
  rationale: Teks Ibrani memakai dua kata kerja puitis yang keras serta gambaran musuh jatuh di bawah kaki. Terjemahan tidak melunakkan kekerasan yang memang terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Susunan kalimat dibuat ringkas untuk mempertahankan gerak kuat nyanyian kemenangan, sementara catatan kaki menjaga metafora dan keluasan makna kata-kata Ibrani.
