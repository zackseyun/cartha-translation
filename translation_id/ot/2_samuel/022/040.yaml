source:
  edition: WLC
  text: וַ/תַּזְרֵ֥/נִי חַ֖יִל לַ/מִּלְחָמָ֑ה תַּכְרִ֥יעַ קָמַ֖/י תַּחְתֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/040.yaml
  text: You armed me with strength for battle[b][a]; you caused those who rose against me to bow beneath me.
translation:
  language: id
  text: Engkau memperlengkapi aku dengan kekuatan untuk berperang[a]; Engkau membuat orang-orang yang bangkit melawan aku bertekuk lutut di bawahku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau mengikatkan kekuatan kepadaku untuk pertempuran.” Kata Ibraninya memakai gambaran mengikatkan perlengkapan pada tubuh atau membekali seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Engkau menundukkan orang-orang yang bangkit melawan aku ke bawahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּזְרֵנִי
  choice: Engkau memperlengkapi aku
  rationale: Bentuk ini menyampaikan gambaran mengikatkan perlengkapan atau membekali seseorang. 'Memperlengkapi' alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada pemberian senjata.
- source_word: חַיִל
  choice: dengan kekuatan
  rationale: חַיִל di sini menunjuk pada daya atau kemampuan yang diberikan untuk menghadapi pertempuran; 'kekuatan' paling jelas dan wajar.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Ungkapan ini menyatakan tujuan persiapan. 'Untuk berperang' lebih alami dalam kalimat Indonesia daripada 'untuk peperangan', sambil tetap mempertahankan konteks militer.
- source_word: תַּכְרִיעַ
  choice: Engkau membuat ... bertekuk lutut
  rationale: Hifil dari כרע berarti menyebabkan seseorang membungkuk, berlutut, atau jatuh tersungkur. 'Membuat ... bertekuk lutut' mempertahankan citra penundukan dengan bahasa Indonesia yang hidup.
- source_word: קָמַי
  choice: orang-orang yang bangkit melawan aku
  rationale: Terjemahan ini mempertahankan citra partisipial dari קום, yaitu mereka yang bangkit atau berdiri untuk melawan sang pembicara.
- source_word: תַּחְתֵּנִי
  choice: di bawahku
  rationale: Terjemahan harfiah ini mempertahankan gambaran lawan yang ditundukkan ke posisi di bawah sang pembicara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan 'Engkau' dipertahankan untuk menegaskan bahwa Allah adalah pelaku dalam kedua klausa. Ungkapan 'bertekuk lutut' dipakai secara konkret untuk menjaga citra כרע, bukan sekadar menyatakan kekalahan.
