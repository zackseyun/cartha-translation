translation:
  language: id
  text: Engkau telah memberikan kepadaku perisai keselamatan-Mu, dan kerendahan hati-Mu[a] menjadikan aku besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kelembutan-Mu” atau “kerelaan-Mu untuk merendahkan diri.” Ungkapan Ibrani ini sulit dan mungkin menunjuk pada Allah yang dengan murah hati merendahkan diri untuk mengangkat si pembicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Engkau memberikan
  rationale: Bentuk wayyiqtol Qal dari נתן menyatakan tindakan lampau dalam tuturan kepada Allah. Bentuk ini diterjemahkan secara wajar sebagai tindakan pemberian.
- source_word: לִי
  choice: kepadaku
  rationale: Menjaga peran penerima yang dinyatakan oleh preposisi ל tanpa membuat susunan bahasa Indonesia terasa janggal.
- source_word: מָגֵן
  choice: perisai
  rationale: Mempertahankan gambaran militer konkret dalam teks Ibrani, bukan mengabstraksikannya menjadi sekadar perlindungan.
- source_word: יִשְׁעֶךָ
  choice: keselamatan-Mu
  rationale: Mencakup gagasan penyelamatan atau pembebasan yang berasal dari Allah serta mempertahankan bentuk posesif teks sumber.
- source_word: וַעֲנֹתְךָ
  choice: dan kerendahan hati-Mu
  rationale: Ungkapan Ibrani ini sulit dan dapat menunjuk pada kerendahan, kelembutan, atau tindakan Allah yang berkenan merendahkan diri untuk menolong. Pilihan ini mempertahankan daya kejut dan ketegangan teologis teks tanpa menjelaskannya secara berlebihan.
- source_word: תַּרְבֵּנִי
  choice: menjadikan aku besar
  rationale: Bentuk Hifil dari רבה berarti membuat besar atau meningkatkan. Terjemahan ini mempertahankan sifat kausatif dan hasil berupa pengangkatan si pembicara.
theological_decisions:
- issue: Penyifatan וַעֲנֹתְךָ kepada Allah
  choice: kerendahan hati-Mu
  alternative: kelembutan-Mu; kerelaan-Mu merendahkan diri; pertolongan-Mu
  rationale: Bentuk Ibrani mengizinkan beberapa nuansa. Terjemahan utama mempertahankan gambaran teologis yang tidak biasa tentang Allah yang merendah untuk mengangkat hamba-Nya, sedangkan catatan kaki menjaga alternatif leksikal yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan paralelisme dua klausa dan gambaran konkret teks sumber.
