source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר דָּוִד֙ לַֽ/יהוָ֔ה אֶת דִּבְרֵ֖י הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/יוֹם֩ הִצִּ֨יל יְהוָ֥ה אֹת֛/וֹ מִ/כַּ֥ף כָּל אֹיְבָ֖י/ו וּ/מִ/כַּ֥ף שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/001.yaml
  text: And David spoke to Yahweh the words of this song on the day when Yahweh delivered him from the hand of all his enemies and from the hand of Saul[a].
translation:
  language: id
  text: Daud mengucapkan kepada Yahweh kata-kata nyanyian ini[a] pada hari ketika Yahweh melepaskan dia dari tangan semua musuhnya dan dari tangan Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kata-kata nyanyian ini.” Teks Ibrani mengatakan bahwa Daud “mengucapkan” kata-kata itu, bukan memakai kata kerja khusus yang berarti “menyanyikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: mengucapkan
  rationale: Kata kerja דּבר pada dasarnya berarti berbicara atau mengucapkan. Karena objeknya adalah “kata-kata nyanyian ini,” pilihan ini mempertahankan ungkapan Ibrani dan tidak mengubahnya menjadi “menyanyikan.”
- source_word: לַיהוָה / יְהוָה
  choice: kepada Yahweh / Yahweh
  rationale: Nama ilahi יהוה ditampilkan sebagai nama diri “Yahweh,” sesuai bentuk nama perjanjian dalam teks sumber.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: kata-kata nyanyian ini
  rationale: Terjemahan ini mempertahankan kedua unsur dalam bahasa Ibrani, yaitu דִּבְרֵי (“kata-kata”) dan הַשִּׁירָה (“nyanyian”), tanpa meringkasnya menjadi “nyanyian ini” saja.
- source_word: בְּיוֹם
  choice: pada hari ketika
  rationale: Ungkapan waktu ini memperkenalkan peristiwa yang menjadi latar nyanyian. Bentuk tersebut alami dalam bahasa Indonesia sekaligus mempertahankan sebutan “hari” dari teks Ibrani.
- source_word: הִצִּיל
  choice: melepaskan
  rationale: Dalam konteks ancaman musuh, bentuk kausatif dari נצל menyatakan pembebasan atau penyelamatan dari kuasa pihak lain. “Melepaskan” sesuai dengan frasa lanjutan “dari tangan.”
- source_word: מִכַּף
  choice: dari tangan
  rationale: Secara harfiah berarti “dari telapak/tangan” dan secara kiasan menunjuk pada kuasa atau cengkeraman. Terjemahan ini mempertahankan metafora sumber yang juga wajar dalam bahasa Indonesia.
- source_word: כָּל אֹיְבָיו
  choice: semua musuhnya
  rationale: Padanan langsung dan alami bagi frasa kolektif tersebut.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama pribadi yang sudah baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama itu dan membedakannya dari gelar umum “Tuhan.”
- issue: Apakah tindakan Daud diterjemahkan sebagai berbicara atau bernyanyi
  choice: mengucapkan kata-kata nyanyian ini
  alternative: menyanyikan nyanyian ini
  rationale: Walaupun isi yang menyusul adalah nyanyian, teks memakai וַיְדַבֵּר (“berbicara/mengucapkan”), bukan kata kerja khusus “bernyanyi.” Terjemahan mempertahankan ketegangan bentuk tersebut tanpa menyederhanakannya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan “mengucapkan kepada Yahweh kata-kata nyanyian ini” sengaja sedikit formal untuk mempertahankan struktur dan rincian leksikal teks Ibrani; metafora “dari tangan” juga dipertahankan.
