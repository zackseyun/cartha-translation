base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/042.yaml
  text: They cried for help[a], but there was no one to save; they cried to Yahweh, but he did not answer them.
translation:
  language: id
  text: Mereka menoleh mencari pertolongan[a], tetapi tidak ada yang menyelamatkan; mereka berseru kepada Yahweh, tetapi Ia tidak menjawab mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat berarti ‘memandang’ atau ‘menoleh’; dalam konteks ini tindakan itu menyiratkan pencarian pertolongan. Sebagian memahaminya sebagai ‘berseru meminta pertolongan’.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יִשְׁעוּ
  choice: Mereka menoleh mencari pertolongan
  rationale: Bentuk ini paling wajar dikaitkan dengan שׁעה, “menoleh/memandang,” dan dalam konteks kekalahan menyiratkan mencari pertolongan. Terjemahan ini mempertahankan gambaran menoleh sambil menyatakan implikasi kontekstualnya secara alami dalam bahasa Indonesia.
- source_word: וְאֵין מֹשִׁיעַ
  choice: tetapi tidak ada yang menyelamatkan
  rationale: וְ dipahami bernuansa pertentangan karena pencarian mereka gagal, sedangkan partisipel מֹשִׁיעַ menunjuk kepada siapa pun yang dapat menyelamatkan, bukan gelar teologis khusus.
- source_word: אֶל יְהוָה
  choice: mereka berseru kepada Yahweh
  rationale: Teks Ibrani hanya menyatakan arah, “kepada Yahweh,” dengan verba yang dilesapkan. Verba “berseru” ditambahkan dari konteks agar elipsis dapat dipahami secara alami dan paralelisme tetap jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” untuk mempertahankan rujukan langsung kepada nama perjanjian dalam teks sumber.
- source_word: וְלֹא עָנָם
  choice: tetapi Ia tidak menjawab mereka
  rationale: ענה berarti “menjawab”; subjek maskulin tunggal dipahami sebagai Yahweh dari frasa sebelumnya, dan וְ diberi nuansa pertentangan sesuai konteks.
theological_decisions:
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Tidak adanya jawaban dari Yahweh
  choice: Ia tidak menjawab mereka
  alternative: doa mereka tidak dikabulkan
  rationale: Terjemahan mempertahankan pernyataan naratif yang tegas, tetapi tidak menambahkan penjelasan teologis mengenai alasan atau sifat penolakan tersebut.
- issue: Elipsis verba sebelum אֶל יְהוָה
  choice: mereka berseru kepada Yahweh
  alternative: kepada Yahweh
  rationale: Pengulangan verba secara eksplisit diperlukan untuk kelancaran bahasa Indonesia. “Berseru” menyatakan tindakan memohon yang tersirat oleh konteks tanpa mengubah hasilnya.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Menoleh mencari pertolongan” mempertahankan citra leksikal teks Samuel sekaligus menjelaskan maksud kontekstualnya; “Ia” dikapitalisasi sebagai konvensi penghormatan yang umum, bukan sebagai penambahan makna gramatikal.
