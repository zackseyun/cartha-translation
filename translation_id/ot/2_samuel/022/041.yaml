  text: You gave me the necks of my enemies[a]; I destroyed those who hated me.
translation:
  language: id
  text: Engkau membuat musuh-musuhku lari dariku[a]; aku membinasakan mereka yang membenciku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Engkau memberikan kepadaku tengkuk musuh-musuhku,” sebuah ungkapan bahwa musuh dipukul mundur sehingga berbalik dan melarikan diri dari pemenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Nomina אֹיֵב dengan sufiks orang pertama tunggal secara langsung berarti “musuh-musuhku”; ini padanan Indonesia yang baku dan jelas.
- source_word: תַּתָּה לִּי עֹרֶף
  choice: Engkau membuat ... berbalik membelakangiku
  rationale: Secara harfiah ungkapan ini berbunyi “Engkau memberikan kepadaku tengkuk/belakang leher,” tetapi dalam konteks peperangan merupakan idiom tentang musuh yang berbalik dan melarikan diri. Terjemahan ini menyampaikan tindakan Allah dan gambaran musuh yang membelakangi sang pemenang secara alami dalam bahasa Indonesia.
- source_word: מְשַׂנְאַי
  choice: orang-orang yang membenci aku
  rationale: Partisip substantival dari שׂנא dengan sufiks orang pertama tunggal menunjuk kepada mereka yang membenci penutur. Bentuk ini mempertahankan sifat relasional dan berkelanjutan dari ungkapan Ibrani.
- source_word: וָאַצְמִיתֵם
  choice: aku membinasakan
  rationale: Bentuk Hifil dari צמת menyatakan tindakan membinasakan atau mengakhiri keberadaan pihak lawan. “Membinasakan” kuat, bermartabat, dan sesuai dengan ragam puisi peperangan.
