  text: He sent from on high[a]; he took me[b]; he drew me out of many waters.
translation:
  language: id
  text: Ia mengulurkan tangan dari tempat tinggi[a]; Ia mengambil aku; Ia menarik aku keluar dari air yang banyak.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ia mengirim dari tempat tinggi.” Kata kerja ini juga dapat berarti “Ia mengulurkan”; kata “tangan” tidak disebutkan secara eksplisit dalam bahasa Ibrani, tetapi tersirat dalam gambaran penyelamatan ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dari air yang besar” atau “dari air yang dahsyat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח מִמָּרוֹם
  choice: Ia mengulurkan tangan dari tempat tinggi
  rationale: יִשְׁלַח secara harfiah berarti ‘mengirim’ dan dapat menyatakan tindakan mengulurkan sesuatu. Karena objeknya tidak disebutkan dan konteksnya adalah penyelamatan dari air, ungkapan ini menyampaikan tindakan menjangkau dari atas tanpa mempersempit מָרוֹם menjadi ‘surga’.
- source_word: יִקָּחֵנִי
  choice: dan meraih aku
  rationale: לקח berarti ‘mengambil’. Dalam rangkaian tindakan penyelamatan ini, ‘meraih aku’ alami dalam bahasa Indonesia dan menghubungkan tindakan mengulurkan tangan dengan penarikan dari air.
- source_word: יַמְשֵׁנִי
  choice: Ia menarik aku keluar
  rationale: Bentuk Hifil dari משה berarti menarik atau mengeluarkan, khususnya dari air. Pilihan ini mempertahankan gambaran penyelamatan dari air.
- source_word: מִמַּיִם רַבִּים
  choice: dari air yang banyak
  rationale: Terjemahan ini mempertahankan arti dasar רַבִּים, yaitu ‘banyak’, serta citra puitis Ibrani; dalam konteks, ungkapan itu dapat merujuk kepada air yang besar atau dahsyat.
theological_decisions:
- issue: Gambaran pertolongan ilahi dari atas
  choice: dari tempat tinggi
  alternative: dari surga
  rationale: מָרוֹם menunjuk kepada ketinggian atau tempat tinggi. Pilihan ini mempertahankan bahasa ruang yang puitis dan tidak menjadikan istilah tersebut lebih khusus daripada teks Ibrani.
- issue: Objek tersirat pada יִשְׁלַח
  choice: mengulurkan tangan
  alternative: mengirim
  rationale: Bahasa Indonesia memerlukan ungkapan yang lebih lengkap agar rangkaian tindakan penyelamatan dapat dipahami. ‘Tangan’ tersirat oleh tindakan meraih, tetapi karena tidak disebutkan secara eksplisit dalam bahasa Ibrani, hal itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern dengan corak puitis yang khidmat. Pengulangan ‘Ia’ mempertahankan irama tiga tindakan dalam teks Ibrani; titik koma diganti dengan penghubung dan jeda kalimat agar alami tanpa menghilangkan urutannya.
