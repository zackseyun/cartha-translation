  yaml_path: translation/ot/2_samuel/022/018.yaml
  text: He rescued me from my strong enemy, from those who hated me, for they were too mighty for me.
translation:
  language: id
  text: Ia melepaskan aku dari musuhku yang kuat, dari orang-orang yang membenci aku, sebab mereka terlalu perkasa bagiku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Ia melepaskan aku
  rationale: Bentuk Hifil dari נצל menyatakan tindakan menyelamatkan atau melepaskan dari bahaya; 'melepaskan' alami dalam konteks pembebasan dari musuh.
- source_word: מֵאֹיְבִי עָז
  choice: dari musuhku yang kuat
  rationale: עָז dapat berarti kuat atau perkasa. 'Musuhku yang kuat' mempertahankan hubungan langsung antara kata sifat dan bentuk tunggal 'musuhku'.
- source_word: מִשֹּׂנְאַי
  choice: dari orang-orang yang membenci aku
  rationale: Partisipel jamak bersufiks orang pertama menunjuk kepada mereka yang membenci sang penutur.
- source_word: כִּי אָמְצוּ מִמֶּנִּי
  choice: sebab mereka terlalu perkasa bagiku
  rationale: Ungkapan komparatif harfiah 'mereka lebih kuat daripada aku' menyatakan bahwa lawan melampaui kemampuan penutur; 'terlalu perkasa bagiku' menyampaikan makna itu secara wajar.
