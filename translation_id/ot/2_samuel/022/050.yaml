  text: עַל כֵּ֛ן אוֹדְ/ךָ֥ יְהוָ֖ה בַּ/גּוֹיִ֑ם וּ/לְ/שִׁמְ/ךָ֖ אֲזַמֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/050.yaml
  text: Therefore I will praise you among the nations[a], O Yahweh, and I will sing praise to your name.
translation:
  language: id
  text: Karena itu, aku akan memuji-Mu di antara bangsa-bangsa, ya Yahweh, dan aku akan bermazmur bagi nama-Mu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan yang ditarik dari karya penyelamatan yang diuraikan sebelumnya dan terdengar alami dalam puisi Indonesia.
- source_word: אוֹדְךָ
  choice: aku akan memuji-Mu
  rationale: Bentuk verba ידה dalam konteks ibadah dapat berarti bersyukur atau memuji; 'memuji' cocok dengan paralelisme bersama tindakan bermazmur, tanpa meniadakan nuansa syukur.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Meneruskan nama ilahi yang terdapat langsung dalam teks Ibrani; partikel 'ya' menandai sapaan langsung secara alami.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם di sini menunjuk secara luas kepada bangsa-bangsa dalam lingkup internasional; pilihan ini tidak memasukkan asosiasi yang lebih sempit dari istilah 'orang-orang bukan Yahudi'.
- source_word: וּלְשִׁמְךָ
  choice: dan ... bagi nama-Mu
  rationale: Preposisi ל pada objek זמר menyatakan arah atau tujuan pujian. Ungkapan 'bagi nama-Mu' mempertahankan sebutan 'nama' sebagai identitas dan kemasyhuran yang dinyatakan.
- source_word: אֲזַמֵּר
  choice: aku akan bermazmur
  rationale: Piel זמר menyatakan bernyanyi atau memainkan musik sebagai pujian. 'Bermazmur' ringkas, bermartabat, dan lazim dipahami dalam konteks pujian alkitabiah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut Tetragramaton secara langsung. Transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna ידה dalam hubungan dengan זמר
  choice: memuji-Mu
  alternative: bersyukur kepada-Mu
  rationale: Keduanya mungkin secara leksikal. 'Memuji' dipilih karena paralelisme puisi dengan 'bermazmur', sambil mengakui bahwa verba itu dapat mengandung nuansa syukur.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Bentuk orang pertama tunggal 'aku' sesuai dengan tuturan mazmur Daud. Kapitalisasi pronomina ilahi mengikuti kebiasaan hormat dalam penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena nama Yahweh ditampilkan langsung dan tidak ada varian tekstual yang perlu dijelaskan.
