source:
  edition: WLC
  text: עִם חָסִ֖יד תִּתְחַסָּ֑ד עִם גִּבּ֥וֹר תָּמִ֖ים תִּתַּמָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/026.yaml
  text: With the faithful you show yourself faithful; with the blameless warrior you show yourself blameless.
translation:
  language: id
  text: Terhadap orang yang setia, Engkau menunjukkan diri-Mu setia; terhadap pejuang yang tak bercela, Engkau menunjukkan diri-Mu tak bercela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָסִיד
  choice: orang yang setia
  rationale: Dalam konteks pasangan kata dengan bentuk verba תִּתְחַסָּד, ungkapan ini menunjuk kepada orang yang menunjukkan kesetiaan; terjemahan ini mempertahankan pengulangan akar kata Ibrani secara alami.
- source_word: תִּתְחַסָּד
  choice: Engkau menunjukkan diri-Mu setia
  rationale: Bentuk hitpael menyatakan bagaimana Allah memperlihatkan diri-Nya dalam hubungan dengan orang yang setia, bukan sekadar menyebut sifat secara abstrak.
- source_word: גִּבּוֹר תָּמִים
  choice: pejuang yang tak bercela
  rationale: גִּבּוֹר dapat berarti orang perkasa atau pejuang; dalam konteks nyanyian Daud bernuansa militer, 'pejuang' tepat, sedangkan תָּמִים menyatakan keutuhan atau ketidakbercelaan.
- source_word: תִּתַּמָּם
  choice: Engkau menunjukkan diri-Mu tak bercela
  rationale: Terjemahan ini menjaga kesejajaran dengan klausa pertama dan permainan akar תָּמִים/תִּתַּמָּם tanpa mengubahnya menjadi klaim teologis yang lebih khusus.
theological_decisions:
- issue: Hubungan tindakan Allah dengan watak manusia
  choice: Mempertahankan formulasi relasional 'terhadap ... Engkau menunjukkan diri-Mu ...'
  alternative: Menerjemahkan seolah-olah Allah berubah mengikuti perilaku manusia
  rationale: Teks menyatakan cara Allah memperlihatkan diri-Nya dalam relasi dengan seseorang; terjemahan tidak perlu menyelesaikan ketegangan teologis mengenai ketetapan sifat Allah dan tanggapan-Nya kepada manusia.
- issue: Makna תָּמִים bagi manusia dan Allah
  choice: tak bercela
  alternative: sempurna atau tulus
  rationale: '''Tak bercela'' dapat diterapkan secara wajar baik kepada pejuang maupun kepada cara Allah menunjukkan diri-Nya, sambil mempertahankan kesejajaran leksikal dan tidak menyiratkan kesempurnaan mutlak manusia.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Struktur paralel puisi Ibrani serta pengulangan akar katanya dipertahankan sejauh alami.
