  text: כִּ֥י שָׁמַ֖רְתִּי דַּרְכֵ֣י יְהוָ֑ה וְ/לֹ֥א רָשַׁ֖עְתִּי מֵ/אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/022.yaml
  text: For I have kept the ways of Yahweh[a], and have not wickedly departed from my God.
translation:
  language: id
  text: Sebab aku telah mengikuti jalan-jalan Yahweh dan tidak berbuat jahat dengan berpaling dari Allahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan tidak berlaku fasik terhadap Allahku.” Secara harfiah, bagian akhirnya berbunyi kurang lebih, “dan aku tidak berlaku fasik dari Allahku.”
    reason: Konstruksi Ibrani menggabungkan verba “berlaku fasik/berbuat jahat” dengan preposisi “dari,” sehingga dapat menekankan berpaling dari Allah atau tindakan fasik terhadap-Nya.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan penjelas dalam syair.
- source_word: שָׁמַרְתִּי
  choice: aku telah mengikuti
  rationale: Secara harfiah berarti “aku telah menjaga/menaati.” Dalam hubungan dengan “jalan-jalan,” “mengikuti” mengungkapkan tindakan hidup sesuai dengan jalan tersebut secara wajar dalam bahasa Indonesia.
- source_word: דַּרְכֵי
  choice: jalan-jalan
  rationale: Bentuk jamak ini menunjuk pada pola hidup atau ketetapan perilaku, sambil tetap mempertahankan metafora “jalan” dalam bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְלֹא רָשַׁעְתִּי
  choice: dan tidak berbuat jahat
  rationale: רשע menyatakan tindakan fasik atau jahat. Ungkapan ini mempertahankan dimensi moral verba tanpa memakai kata “fasik” yang lebih sempit atau kurang lazim dalam tuturan umum.
- source_word: מֵאֱלֹהָי
  choice: dengan berpaling dari Allahku
  rationale: Prefiks מִן terutama berarti “dari.” Karena konstruksi dengan רשע tidak dapat diterjemahkan secara harfiah dengan wajar ke bahasa Indonesia, “dengan berpaling dari” menyatakan kejahatan sebagai tindakan menjauh dari Allah, sambil mencatat kemungkinan lain dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna רָשַׁעְתִּי מֵאֱלֹהָי
  choice: tidak berbuat jahat dengan berpaling dari Allahku
  alternative: tidak berlaku fasik terhadap Allahku
  rationale: Gabungan verba “berbuat jahat/berlaku fasik” dengan preposisi “dari” dapat dipahami sebagai tindakan jahat berupa penyimpangan dari Allah. Terjemahan utama mempertahankan unsur moral dan pemisahan, sedangkan catatan kaki menjaga kemungkinan pembacaan relasional “terhadap.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan. “Jalan-jalan” mempertahankan metafora sumber; “mengikuti” membuat kolokasinya alami. Nama “Yahweh” dipertahankan. Catatan kaki menampilkan ketidaklaziman dan ambiguitas konstruksi Ibrani tanpa membebani teks utama.
