  text: Ia melatih tanganku untuk bertempur[a], dan busur perunggu dilenturkan oleh lenganku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk berperang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “lenganku dapat melenturkan busur perunggu.” Ungkapan Ibrani secara harfiah menggambarkan busur itu dilenturkan oleh lengan pemazmur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלַמֵּד
  choice: melatih
  rationale: Partisipel dari למד menyatakan tindakan mengajar atau melatih yang berlangsung. Dalam konteks kecakapan tempur, “melatih” paling wajar dan konkret.
- source_word: יָדַי
  choice: tanganku
  rationale: Bentuk Ibrani secara harfiah berarti “tangan-tanganku”, tetapi bahasa Indonesia lazim memakai bentuk tunggal kolektif “tanganku”; citra anggota tubuh tetap dipertahankan.
- source_word: לַמִּלְחָמָה
  choice: untuk bertempur
  rationale: מִלְחָמָה dapat berarti perang atau pertempuran. Frasa verbal “untuk bertempur” alami setelah “melatih tanganku” dan mempertahankan konteks peperangan nyata.
- source_word: וְנִחַת
  choice: melenturkan
  rationale: Bentuk ini menggambarkan busur yang ditundukkan atau dilenturkan oleh kekuatan lengan. Terjemahan aktif menghasilkan bahasa Indonesia yang lugas, sementara kemungkinan ungkapan pasif dicatat dalam catatan kaki.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: busur perunggu
  rationale: קֶשֶׁת adalah busur, sedangkan נְחוּשָׁה menunjuk pada perunggu atau tembaga. “Busur perunggu” merupakan padanan ringkas dan alami yang menonjolkan kekuatan senjata itu.
- source_word: זְרֹעֹתַי
  choice: lenganku
  rationale: Bentuk Ibrani adalah jamak dengan akhiran orang pertama. Bahasa Indonesia secara idiomatis dapat memakai “lenganku” sebagai sebutan kolektif, sambil mempertahankan kesejajaran tubuh dengan “tanganku”.
theological_decisions:
- issue: Peran Allah dalam kecakapan berperang
  choice: Kecakapan dan kekuatan pemazmur untuk pertempuran dinyatakan sebagai hasil pelatihan dari Allah.
  alternative: Menafsirkannya sebagai pemberian kekuatan untuk peperangan rohani secara umum.
  rationale: Konteks nyanyian syukur kerajaan ini berbicara tentang pembebasan dan pertempuran nyata. Terjemahan tidak mengalihkan maknanya menjadi alegori rohani.
- issue: Hubungan antara lengan dan busur
  choice: Lengan pemazmur melenturkan busur perunggu sebagai gambaran kekuatan yang Allah berikan.
  alternative: Busur perunggu dilenturkan oleh lengan pemazmur.
  rationale: Kedua susunan menyampaikan hubungan tindakan yang sama, tetapi konstruksi Ibrani tidak perlu dipaksa menjadi penjelasan kemampuan eksplisit. Teks utama memakai bentuk aktif yang alami, dan bentuk pasif dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kesejajaran konkret antara tangan dan lengan dipertahankan. Bentuk tunggal “tanganku” dan “lenganku” dipilih karena lebih alami dalam bahasa Indonesia meskipun bentuk Ibraninya jamak.
