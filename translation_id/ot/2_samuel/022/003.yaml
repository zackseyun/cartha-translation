  text: אֱלֹהֵ֥י צוּרִ֖/י אֶחֱסֶה בּ֑/וֹ מָגִנִּ֞/י וְ/קֶ֣רֶן יִשְׁעִ֗/י מִשְׂגַּבִּ/י֙ וּ/מְנוּסִ֔/י מֹשִׁעִ֕/י מֵ/חָמָ֖ס תֹּשִׁעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/003.yaml
  text: my God[a], my rock, in whom I take refuge, my shield and the horn of my salvation, my stronghold and my refuge[c][b], my savior—you save me from violence.
translation:
  language: id
  text: Allahku[a], batu karangku, kepada-Nya aku berlindung; perisaiku dan tanduk keselamatanku[b], bentengku dan tempat perlindunganku, penyelamatku[c]—Engkau menyelamatkan aku dari kekerasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “Allah batu karangku.” Bentuk Ibraninya memakai konstruksi yang dapat diterjemahkan demikian; teks utama menyatakannya sebagai rangkaian gelar puitis: “Allahku, batu karangku.”'
    reason: lexical_alternative
  - marker: b
    text: “Tanduk” adalah gambaran Ibrani bagi kekuatan dan kuasa untuk menang.
    reason: cultural_note
  - marker: c
    text: Atau “pembebasku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי צוּרִי
  choice: Allahku, gunung batuku
  rationale: Bentuk konstruksi Ibrani secara harfiah dapat dipahami sebagai “Allah gunung batuku,” tetapi dalam rangkaian gelar puitis ini pembacaan aposisional terdengar alami dalam bahasa Indonesia dan tetap mempertahankan kedua gelar tersebut. Ambiguitas bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: צוּר menunjuk pada batu besar, tebing batu, atau bukit batu sebagai tempat yang kokoh dan aman. “Gunung batuku” mempertahankan metafora konkret sekaligus terdengar wajar sebagai gelar puitis dalam bahasa Indonesia.
- source_word: אֶחֱסֶה בּוֹ
  choice: kepada-Nya aku berlindung
  rationale: Kata kerja חסה berarti mencari atau memperoleh perlindungan. Susunan ini mempertahankan penekanan puitis pada Allah sebagai tujuan perlindungan.
- source_word: מָגִנִּי
  choice: perisaiku
  rationale: Padanan langsung yang mempertahankan gambaran perlindungan dalam peperangan.
- source_word: קֶרֶן יִשְׁעִי
  choice: tanduk keselamatanku
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tanduk sebagai lambang kekuatan dan kemenangan, tanpa menggantinya dengan penjelasan abstrak.
- source_word: מִשְׂגַּבִּי
  choice: bentengku
  rationale: Kata ini menunjuk pada tempat tinggi dan aman. “Bentengku” menyampaikan perlindungan serta kekokohan secara ringkas dan alami.
- source_word: וּמְנוּסִי
  choice: dan tempat perlindunganku
  rationale: Nomina ini berkaitan dengan tindakan melarikan diri menuju tempat aman. “Tempat perlindunganku” mengungkapkan fungsi tempat tersebut dengan jelas tanpa menambahkan pelaku atau keadaan yang tidak disebutkan.
- source_word: מֹשִׁעִי
  choice: penyelamatku
  rationale: Bentuk partisip dari ישׁע menyatakan pribadi yang menyelamatkan atau membebaskan. “Penyelamatku” merupakan padanan langsung dan cocok dengan rangkaian gelar puitis.
- source_word: מֵחָמָס
  choice: dari kekerasan
  rationale: חָמָס berarti kekerasan atau kejahatan yang bersifat keras. Bentuk abstrak dipertahankan karena teks tidak secara eksplisit menyebut para pelakunya.
- source_word: תֹּשִׁעֵנִי
  choice: Engkau menyelamatkan aku
  rationale: Bentuk orang kedua tunggal dengan objek orang pertama menyatakan sapaan langsung kepada Allah. Bentuk kini dalam bahasa Indonesia sesuai untuk tindakan penyelamatan yang dinyatakan secara puitis tanpa mempersempit aspek verba Ibrani.
theological_decisions:
- issue: Rangkaian metafora ilahi
  choice: 'Mempertahankan gambaran konkret: gunung batu, perisai, tanduk, dan benteng.'
  alternative: Menggantikannya dengan istilah penjelas seperti “pelindung” atau “sumber kekuatan.”
  rationale: Rangkaian metafora merupakan bagian penting dari daya puitis dan kesaksian teologis ayat ini; mengabstrakkannya akan menghilangkan tekstur teks sumber.
- issue: Makna מֹשִׁעִי
  choice: penyelamatku
  alternative: pembebasku
  rationale: Keduanya mungkin secara leksikal, tetapi “penyelamatku” secara langsung berhubungan dengan verba berikutnya, “Engkau menyelamatkan aku,” dan tidak menambahkan muatan doktrinal yang melampaui pernyataan ayat.
- issue: Hubungan sintaksis אֱלֹהֵי צוּרִי
  choice: Menyajikannya secara aposisional sebagai “Allahku, gunung batuku,” sambil mencatat bentuk harfiahnya.
  alternative: Allah gunung batuku
  rationale: Teks Ibrani mempunyai bentuk konstruksi yang tidak lazim dan memungkinkan terjemahan lebih harfiah. Teks utama memakai susunan yang jelas dan puitis dalam bahasa Indonesia, sedangkan catatan kaki menjaga ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Metafora konkret dipertahankan, sapaan ilahi memakai kapital kehormatan, dan struktur klausa dibuat mengalir bagi pembaca umum tanpa menghapus ambiguitas penting dalam bahasa Ibrani.
