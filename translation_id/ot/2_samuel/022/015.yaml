  text: וַ/יִּשְׁלַ֥ח חִצִּ֖ים וַ/יְפִיצֵ֑/ם בָּרָ֖ק ו/יהמ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/015.yaml
  text: He sent arrows and scattered them; lightning[a], and threw them into confusion.
translation:
  language: id
  text: Ia melepaskan anak-anak panah dan mencerai-beraikan mereka; Ia memancarkan kilat dan mengacaukan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kedua kata kerja itu juga dapat diterjemahkan dengan nuansa militer: “memukul mundur mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ia melepaskan
  rationale: Kata שלח pada dasarnya berarti 'mengirim', tetapi dengan objek anak panah, 'melepaskan' merupakan ungkapan Indonesia yang alami tanpa menghilangkan gambaran puitisnya.
- source_word: חִצִּים
  choice: anak-anak panah
  rationale: Padanan baku yang mempertahankan gambaran perang yang konkret.
- source_word: וַיְפִיצֵם
  choice: dan mencerai-beraikan mereka
  rationale: Bentuk kausatif ini berarti membuat tercerai-berai atau berpencar. Akhiran orang ketiga jamak paling wajar menunjuk kepada para musuh yang tersirat dari konteks.
- source_word: בָּרָק
  choice: Ia memancarkan kilat
  rationale: בָּרָק berarti kilat. Karena teks Ibrani sangat padat dan verba dari klausa sebelumnya tersirat, verba 'memancarkan' dilengkapi agar kalimat Indonesia jelas dan puitis.
- source_word: וַיְהֻמֵּם
  choice: dan mengacaukan mereka
  rationale: Kata המם menyatakan tindakan membuat bingung, gempar, atau kacau; 'mengacaukan' mempertahankan daya kausatifnya tanpa mempersempit makna menjadi kemenangan militer semata.
theological_decisions:
- issue: Rujukan akhiran pronominal pada וַיְפִיצֵם dan וַיְהֻמֵּם
  choice: Kata 'mereka' dipertahankan dan dipahami sebagai para musuh atau lawan dalam konteks mazmur.
  alternative: Objek dapat dibuat eksplisit sebagai 'musuh-musuh-Nya', tetapi itu menambahkan nomina yang tidak terdapat dalam ayat ini.
  rationale: Bahasa Ibrani memakai akhiran orang ketiga jamak, sedangkan konteks peperangan ilahi menyediakan rujukannya. Mempertahankan 'mereka' menjaga bentuk sumber dan tidak menambahkan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan puitis. Paralelisme tindakan ilahi dipertahankan, sementara verba eliptis sebelum 'kilat' dilengkapi secara wajar demi kejelasan.
