base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/043.yaml
  text: I crushed them like the dust of the earth[a]; like the mud of the streets I pounded them and trampled them down.
translation:
  language: id
  text: Aku meremukkan mereka seperti debu tanah; seperti lumpur di jalan-jalan, aku menumbuk mereka dan menginjak-injak mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “menghamparkan mereka”; kata kerja Ibrani yang terakhir dapat berarti memukul atau menekan sesuatu hingga rata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Aku meremukkan mereka
  rationale: Bentuk Qal dari שׁחק dengan sufiks orang ketiga jamak menggambarkan tindakan menghancurkan atau menggiling sampai halus. “Meremukkan” mempertahankan daya kekerasan gambaran itu dan selaras dengan perbandingan kepada debu.
- source_word: כַּעֲפַר אָרֶץ
  choice: seperti debu tanah
  rationale: עָפָר berarti debu atau tanah gembur, sedangkan אֶרֶץ di sini membentuk ungkapan genitif. “Debu tanah” alami dalam bahasa Indonesia dan mempertahankan citra Ibrani.
- source_word: כְּטִיט חוּצוֹת
  choice: seperti lumpur di jalan-jalan
  rationale: טִיט berarti lumpur atau tanah becek, dan חוּצוֹת menunjuk pada jalan-jalan atau tempat-tempat terbuka di kota. Pilihan ini jelas dan mempertahankan gambaran publik yang diinjak orang.
- source_word: אֲדִקֵּם
  choice: aku menumbuk mereka
  rationale: Bentuk Hifil dari דקק berarti menghancurkan atau menumbuk hingga halus. “Menumbuk” membedakannya dari verba pertama sambil mempertahankan perkembangan paralel yang kuat.
- source_word: אֶרְקָעֵם
  choice: dan menginjak-injak mereka
  rationale: רקע dapat berarti menghentakkan, memukul hingga rata, atau menghamparkan. Dalam konteks peperangan dan perbandingan dengan lumpur jalanan, “menginjak-injak” menyampaikan citra yang paling langsung, sementara kemungkinan makna lainnya dicatat dalam catatan kaki.
