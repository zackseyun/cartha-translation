base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/005.yaml
  text: For the waves of death surrounded me[b][a]; the torrents of worthlessness terrified me.
translation:
  language: id
  text: Sebab gelombang-gelombang maut mengepung aku[b]; arus-arus deras kebinasaan[a] menggentarkan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “arus-arus deras Belial,” jika בְלִיַּעַל dipahami sebagai nama diri, bukan sebagai nomina umum.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini dapat juga diterjemahkan “ombak-ombak pecah” atau “gelora.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan daya kausalnya secara wajar dalam bahasa Indonesia.
- source_word: אֲפָפֻנִי
  choice: mengepung aku
  rationale: Verba ini menggambarkan keadaan dikelilingi atau dihimpit dari segala sisi; “mengepung aku” kuat, alami, dan sesuai dengan ancaman dalam puisi ini.
- source_word: מִשְׁבְּרֵי
  choice: gelombang-gelombang
  rationale: Nomina ini dapat menunjuk pada ombak pecah atau gelora laut. “Gelombang-gelombang” mempertahankan citra air yang mengancam dalam bahasa Indonesia yang mudah dipahami; alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” merupakan padanan puitis dan bermartabat untuk kematian serta cocok dalam personifikasi gelombang yang mematikan.
- source_word: נַחֲלֵי
  choice: arus-arus deras
  rationale: Kata ini dapat berarti aliran, sungai musiman, atau wadi. Dalam paralelisme dengan gelombang yang mengancam, “arus-arus deras” menyampaikan gerak banjir yang kuat tanpa memerlukan istilah geografis teknis.
- source_word: בְלִיַּעַל
  choice: kebejatan
  rationale: Di sini kata tersebut paling wajar dipahami sebagai nomina umum yang menyatakan sifat jahat, tak bermoral, atau merusak, bukan sebagai nama diri. “Kebejatan” lebih alami daripada terjemahan harfiah “ketidakberhargaan” dalam frasa puitis ini.
- source_word: יְבַעֲתֻנִי
  choice: menggentarkan aku
  rationale: Verba ini menyatakan rasa ngeri atau takut yang hebat. “Menggentarkan” mempertahankan intensitasnya dalam ragam puitis yang tetap mudah dipahami.
theological_decisions:
- issue: Apakah בְלִיַּעַל diterjemahkan sebagai nama diri “Belial” atau sebagai nomina umum
  choice: Diterjemahkan sebagai nomina umum “kebejatan” dalam teks utama.
  alternative: “Belial”; juga mungkin “kehancuran” atau “kejahatan”.
  rationale: Dalam konteks puisi Ibrani ini, istilah tersebut menggambarkan kekuatan jahat atau merusak yang sejajar dengan air maut. Menjadikannya nama makhluk tertentu dapat memasukkan perkembangan demonologis yang tidak diwajibkan oleh teks. Kemungkinan nama diri tetap dicatat untuk menjaga ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Pengulangan bentuk jamak mempertahankan paralelisme Ibrani, sedangkan “maut” dan “menggentarkan” menjaga nada nyanyian tanpa menjadi arkais.
