base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/010.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: id
  text: Ia menekukkan langit lalu turun; kegelapan pekat ada di bawah kaki-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “awan gelap” untuk “kegelapan pekat”; kata Ibrani עֲרָפֶל dapat menunjuk pada kesuraman yang padat yang berkaitan dengan penampakan TUHAN.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: menekukkan
  rationale: Bentuk dari נטה dengan שָׁמַיִם sebagai objek menggambarkan Allah membuat langit melengkung atau membungkuk ke bawah. “Menekukkan” mempertahankan citra kosmis yang kuat dan alami dalam puisi Indonesia.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Bentuk Ibrani ini lazim menunjuk pada langit. Dalam bahasa Indonesia, “langit” tetap dapat membawa nuansa kosmis dan puitis tanpa perlu memakai bentuk yang kurang alami.
- source_word: וַיֵּרַד
  choice: lalu turun
  rationale: Kata ירד berarti turun. “Lalu” mengungkapkan urutan tindakan dari waw konsekutif secara wajar, sedangkan “turun” mempertahankan gerak spasial dalam penampakan ilahi.
- source_word: וַעֲרָפֶל
  choice: kegelapan pekat
  rationale: עֲרָפֶל dapat berarti kegelapan yang padat atau awan gelap yang menyertai penampakan TUHAN. “Kegelapan pekat” mempertahankan kesan gelap dan rapat tanpa menutup kemungkinan citra awan.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial yang langsung, jelas, dan alami untuk תַּחַת.
- source_word: רַגְלָיו
  choice: kaki-Nya
  rationale: Secara harfiah berarti “kaki-Nya”. Citra tubuh dipertahankan dan tidak diparafrasakan menjadi “langkah-Nya”; kapitalisasi pronomina mengikuti kebiasaan hormat dalam teks Alkitab bahasa Indonesia.
theological_decisions:
- issue: Citra antropomorfis dan spasial dalam penampakan Allah
  choice: Mempertahankan ungkapan konkret “turun” dan “di bawah kaki-Nya”.
  alternative: Menghaluskannya menjadi ungkapan nonjasmani seperti “menyatakan diri-Nya dari surga”.
  rationale: Teks Ibrani dengan sengaja melukiskan penampakan ilahi melalui bahasa puitis yang antropomorfis. Terjemahan mempertahankan ketegangan antara transendensi Allah dan gambaran tubuh serta ruang, tanpa menjelaskannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan bermartabat. Susunan klausa dibuat ringkas untuk mempertahankan gerak cepat puisi Ibrani. Penanda catatan kaki ditempatkan setelah seluruh ayat karena catatan menjelaskan frasa “kegelapan pekat” dalam klausa kedua.
