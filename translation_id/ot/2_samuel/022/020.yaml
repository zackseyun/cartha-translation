  text: וַ/יֹּצֵ֥א לַ/מֶּרְחָ֖ב אֹתִ֑/י יְחַלְּצֵ֖/נִי כִּי חָ֥פֵֽץ בִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/020.yaml
  text: He brought me out into a broad place[a]; he rescued me[b], because he delighted in me.
translation:
  language: id
  text: Ia membawa aku keluar ke tempat yang lapang[a]; Ia menyelamatkan aku, karena Ia berkenan kepadaku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke tempat yang luas/terbuka.” Gambaran Ibrani ini mempertentangkan kebebasan dan kelegaan dengan keadaan terkurung atau terdesak.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena Ia menyukai aku” atau “karena Ia bersukacita atas aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: Ia membawa aku keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan kausatif, yaitu membawa atau menyebabkan seseorang keluar. Ungkapan ini mempertahankan gambaran pembebasan dan terdengar alami dalam bahasa Indonesia.
- source_word: לַמֶּרְחָב
  choice: ke tempat yang lapang
  rationale: מֶרְחָב menunjuk pada ruang yang luas, terbuka, atau lapang, dan di sini menggambarkan kebebasan serta kelegaan sebagai lawan dari kesesakan.
- source_word: יְחַלְּצֵנִי
  choice: Ia menyelamatkan aku
  rationale: חלץ dalam bentuk Piel dapat berarti menarik keluar, melepaskan, atau menyelamatkan. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan paralelisme klausa sebelumnya.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi tindakan penyelamatan yang disebutkan sebelumnya.
- source_word: חָפֵץ בִּי
  choice: Ia berkenan kepadaku
  rationale: חפץ dengan preposisi ב menyatakan kesenangan, kerelaan, atau perkenanan terhadap seseorang. 'Berkenan kepadaku' mempertahankan nuansa relasional tanpa menambahkan dasar doktrinal yang tidak dinyatakan ayat ini.
theological_decisions:
- issue: Alasan penyelamatan ilahi
  choice: karena Ia berkenan kepadaku
  alternative: karena Ia menyukai aku / karena Ia bersukacita atas aku
  rationale: Teks menghubungkan penyelamatan Daud dengan perkenanan atau kesenangan TUHAN terhadapnya. Terjemahan ini mempertahankan hubungan sebab-akibat dan ketegangan teologis teks tanpa menjelaskannya sebagai jasa manusia atau memasukkan doktrin lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'Ia' dipakai untuk Allah sesuai kebiasaan penulisan religius Indonesia. Susunan puitis paralel dipertahankan, dan semua penanda catatan kaki dicantumkan dalam teks utama.
