base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/051.yaml
  text: He gives great salvation to his king and shows covenant faithfulness to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: id
  text: Ia memberikan keselamatan yang besar[a] kepada raja-Nya dan menunjukkan kasih setia kepada orang yang diurapi-Nya[b][c], kepada Daud dan keturunannya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “kemenangan besar” atau “pembebasan besar” bagi raja-Nya.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kasih setia” juga menyatakan kasih yang teguh dan kesetiaan dalam hubungan perjanjian.
    reason: lexical_alternative
  - marker: c
    text: “Orang yang diurapi-Nya” juga dapat diterjemahkan “Mesias-Nya”. Di sini ungkapan itu pertama-tama menunjuk kepada Daud atau raja dari garis Daud, sekaligus menggemakan janji mesianik yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: מגדיל
  choice: memberikan ... yang besar
  rationale: Bentuk partisip Hifil dari גדל secara harfiah berarti ‘membuat besar’. Dalam ungkapan bersama יְשׁוּעוֹת, terjemahan ini menyampaikan tindakan Allah yang mengaruniakan pertolongan besar dengan bahasa Indonesia yang wajar.
- source_word: יְשׁוּעוֹת
  choice: keselamatan
  rationale: Bentuk jamak Ibrani dapat menunjuk pada berbagai tindakan penyelamatan, pembebasan, atau kemenangan. Bentuk tunggal kolektif ‘keselamatan’ alami dalam bahasa Indonesia, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: מַלְכּוֹ
  choice: raja-Nya
  rationale: Menerjemahkan nomina dengan sufiks orang ketiga tunggal secara langsung dan mempertahankan hubungan antara TUHAN dengan raja keturunan Daud.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: dan menunjukkan kasih setia
  rationale: חֶסֶד mencakup kasih yang teguh, loyalitas, dan kesetiaan dalam hubungan perjanjian. ‘Kasih setia’ merupakan ungkapan Indonesia yang alami dan berbobot, sementara dimensi perjanjiannya dijelaskan dalam catatan kaki.
- source_word: לִמְשִׁיחוֹ
  choice: kepada orang yang diurapi-Nya
  rationale: Dalam konteks langsung, istilah ini menunjuk kepada Daud sebagai raja yang diurapi. Terjemahan ini mempertahankan makna leksikal dan tidak terlalu dini mengubahnya menjadi gelar khusus ‘Mesias’.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Nama pribadi dialihaksarakan dalam bentuk Indonesia yang lazim.
- source_word: וּלְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע adalah bentuk tunggal kolektif yang dapat mencakup garis keturunan. ‘Keturunannya’ alami dalam bahasa Indonesia serta mempertahankan cakupan kolektifnya.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang jelas dan khidmat untuk durasi yang terus berlangsung tanpa akhir dalam konteks janji kepada Daud.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks perjanjian dengan Daud
  choice: kasih setia
  alternative: kesetiaan perjanjian; kasih yang teguh; kasih yang loyal
  rationale: ‘Kasih setia’ menjaga unsur kasih dan loyalitas tanpa menyempitkan istilah menjadi emosi semata. Catatan kaki menyatakan secara terbuka bahwa dalam konteks ini istilah tersebut juga mengandung kesetiaan kepada perjanjian.
- issue: Penerjemahan מְשִׁיחוֹ
  choice: orang yang diurapi-Nya
  alternative: Mesias-Nya
  rationale: Acuan historis pertamanya adalah Daud atau raja dari garis Daud. Pilihan utama mempertahankan arti leksikal sekaligus membiarkan gema mesianik tetap terbuka; alternatif ‘Mesias-Nya’ dicatat tanpa menjadikannya satu-satunya penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel Ibrani dipertahankan tanpa terasa kaku. Bentuk penghormatan ilahi pada sufiks ‘-Nya’ dipakai menurut kebiasaan ortografi Alkitab bahasa Indonesia; ‘keturunannya’ memakai huruf kecil karena pronomina itu merujuk kepada Daud.
