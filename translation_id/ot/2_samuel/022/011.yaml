  text: וַ/יִּרְכַּ֥ב עַל כְּר֖וּב וַ/יָּעֹ֑ף וַ/יֵּרָ֖א עַל כַּנְפֵי רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/011.yaml
  text: He rode on a cherub and flew[a]; he appeared on the wings of the wind.
translation:
  language: id
  text: Ia menunggangi kerub lalu terbang; Ia tampak[a] di atas sayap-sayap angin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Ia terlihat” atau “Ia menampakkan diri.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: Ia menunggangi
  rationale: Bentuk Qal wayyiqtol dari רכב menyatakan tindakan mengendarai atau menunggang. “Menunggangi” alami dalam bahasa Indonesia dan mempertahankan gambaran konkret.
- source_word: עַל כְּרוּב
  choice: kerub
  rationale: Preposisi עַל menyatakan posisi di atas, sedangkan כְּרוּב adalah bentuk tunggal. Konstruksi transitif “menunggangi kerub” menyampaikan hubungan itu secara alami tanpa menambahkan penjelasan tentang makhluk surgawi tersebut.
- source_word: וַיָּעֹף
  choice: lalu terbang
  rationale: Kata kerja עוף berarti “terbang”. “Lalu” menyampaikan urutan naratif wayyiqtol secara luwes, tanpa menambahkan nuansa seperti “melayang tinggi”.
- source_word: וַיֵּרָא
  choice: Ia tampak
  rationale: Bentuk Nifal dari ראה dapat menyatakan “terlihat” atau “menampakkan diri/muncul”. “Tampak” merupakan ungkapan Indonesia yang alami dan mempertahankan sebagian ambiguitas antara keadaan terlihat dan kemunculan.
- source_word: עַל כַּנְפֵי רוּחַ
  choice: di atas sayap-sayap angin
  rationale: 'Terjemahan ini mempertahankan citra puitis harfiah: עַל sebagai “di atas”, bentuk jamak konstruksi כַּנְפֵי sebagai “sayap-sayap”, dan רוּחַ dalam konteks ini sebagai “angin”.'
theological_decisions:
- issue: Penggambaran TUHAN sebagai pejuang ilahi dalam bahasa teofani
  choice: Mempertahankan gambaran konkret bahwa Ia menunggangi kerub, terbang, dan tampak di atas sayap-sayap angin.
  alternative: Memparafrasakan ayat sebagai kedatangan atau penyataan kuasa Allah.
  rationale: Teks Ibrani memakai puisi teofanik yang hidup. Terjemahan tidak mengubahnya menjadi uraian teologis abstrak atau menjelaskan mekanisme gambaran tersebut.
- issue: Makna וַיֵּרָא sebagai bentuk Nifal
  choice: Ia tampak
  alternative: Ia terlihat; Ia menampakkan diri
  rationale: “Ia tampak” menjaga ketegangan antara arti pasif “terlihat” dan arti kemunculan “menampakkan diri”, tanpa menetapkan salah satunya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pengulangan “Ia” menegaskan subjek ilahi dan menjaga keseimbangan dua klausa. Istilah baku “kerub” dipertahankan tanpa parafrasa.
