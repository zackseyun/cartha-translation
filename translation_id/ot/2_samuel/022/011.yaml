  source_fidelity: 'Terjemahan mengikuti dengan baik urutan dan citra teks Ibrani: Ia menunggangi kerub, terbang, lalu tampak/terlihat di atas sayap-sayap angin. “Kerub” tepat untuk כְּרוּב bentuk tunggal, dan “angin” paling sesuai bagi רוּחַ dalam konteks teofani puitis ini. “Ia tampak” merupakan pilihan yang wajar untuk וַיֵּרָא (Nifal), tanpa memaksakan apakah penekanannya pada terlihat atau pada kemunculan.'
