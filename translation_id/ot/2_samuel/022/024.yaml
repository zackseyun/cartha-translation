  text: I was blameless before him[b][a], and I kept myself from my iniquity.
translation:
  language: id
  text: Aku tidak bercela di hadapan-Nya[a], dan aku menjaga diriku dari kejahatanku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku utuh bersama-Nya.” Kata Ibrani ini dapat menekankan keutuhan atau integritas, bukan hanya kebebasan dari tuduhan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari dosaku” atau “dari kesalahanku.” Kata Ibrani ini dapat berarti kejahatan, dosa, kesalahan, atau keadaan bersalah, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: Aku hidup
  rationale: Secara bentuk berarti “dan aku adalah/berada.” Dalam konteks sifat moral תָמִים, bahasa Indonesia alami memakai “aku hidup” untuk menyatakan keadaan dan perilaku yang berlangsung, tanpa perlu menerjemahkan waw secara mekanis.
- source_word: תָמִים
  choice: tanpa cela
  rationale: Menunjukkan keutuhan, integritas, atau keadaan tak bercela dalam hubungan dengan Allah; pilihan ini mempertahankan kuatnya pengakuan Daud tanpa harus menyatakan kesempurnaan mutlak tanpa dosa.
- source_word: לוֹ
  choice: di hadapan-Nya
  rationale: Pronomina ini secara harfiah dapat berarti “bagi-Nya/kepada-Nya,” tetapi di sini bernuansa relasional dan evaluatif, yakni dalam pandangan Allah.
- source_word: וָאֶשְׁתַּמְּרָה
  choice: aku menjaga diriku
  rationale: Bentuk refleksif dari שׁמר menyatakan tindakan menjaga atau mengawasi diri sendiri; terjemahan ini mempertahankan daya refleksifnya.
- source_word: מֵעֲוֺנִי
  choice: dari kesalahanku
  rationale: עָוֹן dapat menunjuk pada kesalahan, kejahatan, dosa, atau kesalahan yang mendatangkan hukuman. “Kesalahan” alami dalam bahasa Indonesia dan tetap mempertahankan akhiran orang pertama “-ku.”
theological_decisions:
- issue: Apakah pernyataan Daud menyatakan kesempurnaan mutlak tanpa dosa
  choice: Pengakuan akan integritas atau hidup yang tak bercela di hadapan Allah
  alternative: Pengakuan akan kesempurnaan moral mutlak
  rationale: תָמִים dapat menyatakan keutuhan dan integritas, bukan semata-mata ketiadaan dosa secara mutlak. Terjemahan mempertahankan pernyataan yang kuat serta ketegangan teologis teks tanpa mempersempitnya menjadi doktrin kesempurnaan tanpa dosa.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan klausa mempertahankan paralelisme puisi dan kedua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
