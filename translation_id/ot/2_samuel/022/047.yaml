  text: Yahweh lives[a], and blessed be my rock, and exalted be God, the rock of my salvation.
translation:
  language: id
  text: 'Yahweh hidup!


    Terpujilah gunung batuku!


    Ditinggikanlah Allah,


    gunung batu keselamatanku![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gunung batuku yang menyelamatkan” atau “gunung batu pembebasanku.” Hubungan frasa Ibrani ini dapat dipahami secara berbeda.'
    reason: Mempertahankan alternatif leksikal dan mengakui ambiguitas sintaksis tanpa menawarkan parafrasa Indonesia yang menyesatkan atau tidak alami.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Yahweh hidup!
  rationale: Klausa nominal Ibrani ini merupakan seruan doksologis bahwa Yahweh hidup. Susunan Indonesia yang langsung mempertahankan daya serunya tanpa mengubahnya menjadi rumusan sumpah “Demi Yahweh yang hidup”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, sesuai bentuk tetragramaton dalam teks sumber.
- source_word: וּבָרוּךְ
  choice: Terpujilah
  rationale: Dalam seruan pujian kepada Allah, bentuk ini paling alami dalam bahasa Indonesia sebagai aklamasi “Terpujilah”; “diberkatilah” akan terdengar seolah-olah pihak lain menganugerahkan berkat kepada Allah.
- source_word: צוּרִי
  choice: gunung batuku
  rationale: Metafora צוּר dipertahankan. “Gunung batu” dalam bahasa Indonesia menyampaikan batu besar yang kukuh dan lebih jelas sebagai gambaran perlindungan daripada sekadar “batuku”.
- source_word: וְיָרֻם
  choice: Ditinggikanlah
  rationale: Bentuk yusif pasif menyatakan aklamasi atau harapan. “Ditinggikanlah” mempertahankan baik nuansa volitif maupun gambaran pengagungan dalam teks Ibrani.
- source_word: אֱלֹהֵי צוּר יִשְׁעִי
  choice: Allah, gunung batu keselamatanku
  rationale: 'Frasa puitis ini dipahami secara aposisional: Allah adalah gunung batu keselamatan sang penyanyi. Tanda koma menjaga pembacaan tersebut sekaligus catatan kaki mengakui kemungkinan hubungan konstruksi yang berbeda.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Metafora צוּר bagi Allah
  choice: gunung batu
  alternative: tempat perlindungan
  rationale: Metafora konkret tentang kekukuhan dan perlindungan dipertahankan, bukan dijelaskan secara interpretatif.
- issue: Hubungan sintaksis אֱלֹהֵי צוּר יִשְׁעִי
  choice: Allah, gunung batu keselamatanku
  alternative: Allah dari gunung batu keselamatanku
  rationale: Bentuk אֱלֹהֵי secara morfologis dapat dibaca sebagai bentuk konstruksi, tetapi paralelisme puitis dan pengulangan metafora צוּר mendukung pembacaan aposisional yang lebih wajar. Ambiguitasnya dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern dengan laras puisi pujian yang khidmat. Baris-baris pendek mempertahankan paralelisme tiga seruan. Metafora “gunung batu” dipertahankan, sedangkan bentuk aklamatif “Terpujilah” dan “Ditinggikanlah” menjaga nada liturgis tanpa menjadi kuno.
