  yaml_path: translation/ot/2_samuel/022/021.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: id
  text: 'Yahweh memperlakukan aku sesuai dengan kebenaranku[a];

    sesuai dengan kebersihan tanganku[b], Ia memberi balasan kepadaku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memberi aku ganjaran sesuai dengan kebenaranku.” Kata kerja Ibrani dapat berarti memperlakukan atau memberi balasan kepada seseorang sesuai dengan perbuatannya.'
    reason: lexical_alternative
  - marker: b
    text: “Kebersihan tanganku” adalah ungkapan Ibrani yang menunjuk pada ketidakbersalahan atau kemurnian dalam tindakan.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: memperlakukan aku
  rationale: Kata kerja גמל dapat berarti memperlakukan atau memberi balasan kepada seseorang sesuai dengan perbuatannya. Pilihan ini mempertahankan keluasan maknanya, sedangkan baris sejajar memperjelas nuansa balasan yang positif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כְּצִדְקָתִי
  choice: sesuai dengan kebenaranku
  rationale: צדקה di sini menunjuk pada kelurusan atau perilaku benar pemazmur dalam konteks ini. Terjemahan langsung mempertahankan klaim orang pertama dan ketegangan teologis teks.
- source_word: כְּבֹר יָדַי
  choice: sesuai dengan kebersihan tanganku
  rationale: Terjemahan ini mempertahankan gambaran konkret dan idiom Ibrani tentang kemurnian atau ketidakbersalahan dalam tindakan.
- source_word: יָשִׁיב לִי
  choice: Ia membalas kepadaku
  rationale: Bentuk kausatif שוב di sini bermakna memberikan kembali atau membalas. Pilihan ini sesuai dengan paralelisme puitis dan tidak menentukan lebih jauh bentuk balasannya.
theological_decisions:
- issue: Apakah klaim tentang kebenaran dan tangan yang bersih menyiratkan kesempurnaan tanpa dosa atau jasa mutlak di hadapan Allah
  choice: Mempertahankan klaim langsung bahwa Yahweh bertindak sesuai dengan kebenaran dan kebersihan tindakan sang penutur dalam konteks ini.
  alternative: Melunakkan bahasa kebenaran pribadi, atau menafsirkannya sebagai klaim kesempurnaan mutlak dan keselamatan berdasarkan jasa.
  rationale: Teks Ibrani secara eksplisit memakai bentuk orang pertama untuk 'kebenaranku' dan 'tanganku'. Terjemahan tidak menghapus klaim itu, tetapi juga tidak memperluasnya menjadi pernyataan tentang kesempurnaan tanpa dosa atau dasar keselamatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Kapitalisasi “Ia” dipakai secara hormat untuk rujukan kepada Yahweh. Susunan dua baris sejajar dipertahankan, demikian pula metafora konkret “kebersihan tanganku”.
