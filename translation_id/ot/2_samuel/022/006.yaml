  text: חֶבְלֵ֥י שְׁא֖וֹל סַבֻּ֑/נִי קִדְּמֻ֖/נִי מֹֽקְשֵׁי מָֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/006.yaml
  text: The cords of Sheol surrounded me[b][a]; the snares of death confronted me.
translation:
  language: id
  text: 'Tali-tali Syeol[a] mengelilingi aku;

    jerat-jerat maut menghadang aku.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kubur” atau “alam orang mati.”
    reason: alternative_reading
  - marker: b
    text: Atau “menemui aku” atau “datang menyongsong aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי
  choice: tali-tali
  rationale: Kata חבל dapat menunjuk pada tali atau ikatan. “Tali-tali” mempertahankan gambaran puitis tentang sesuatu yang membelit dan sejajar secara alami dengan “jerat-jerat” pada baris berikutnya.
- source_word: שְׁאוֹל
  choice: Syeol
  rationale: Transliterasi ini mempertahankan istilah Ibrani bagi alam orang mati tanpa mempersempit maknanya hanya menjadi kubur atau kematian.
- source_word: סַבֻּנִי
  choice: mengelilingi aku
  rationale: Bentuk dari סבב secara langsung menyatakan tindakan mengelilingi atau mengepung; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: קִדְּמֻנִי
  choice: menghadang aku
  rationale: Dalam konteks ancaman, קדם menggambarkan sesuatu yang datang menyongsong atau menemui pembicara. “Menghadang” menyampaikan perjumpaan yang mengancam tanpa menghapus kemungkinan leksikal lainnya, yang dicatat dalam catatan kaki.
- source_word: מֹקְשֵׁי
  choice: jerat-jerat
  rationale: מוקש berarti jerat atau perangkap. “Jerat-jerat” mempertahankan citra puitis dan kesejajarannya dengan “tali-tali”.
- source_word: מָוֶת
  choice: maut
  rationale: “Maut” merupakan padanan langsung yang bermartabat dan puitis bagi מָוֶת, serta cocok dalam ungkapan “jerat-jerat maut”.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: Syeol
  alternative: kubur; alam orang mati
  rationale: Istilah Ibrani ini dapat mencakup kubur, kematian, atau alam orang mati. Mempertahankan “Syeol” menjaga keluasan dan ketegangan teologis teks tanpa menetapkan satu tafsiran saja.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Pengulangan “tali-tali” dan “jerat-jerat” mempertahankan kesejajaran puisi Ibrani; “Syeol” dipertahankan sebagai istilah sumber dan dijelaskan melalui catatan kaki.
