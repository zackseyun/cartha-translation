  text: the God who gives vengeance to me and brings peoples down under me.
translation:
  language: id
  text: Allah yang memberikan pembalasan kepadaku dan menundukkan bangsa-bangsa di bawah kekuasaanku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Frasa ini menunjuk kepada Sang Allah; 'Allah' merupakan padanan baku, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: הַנֹּתֵן נְקָמוֹת לִי
  choice: yang memberikan pembalasan kepadaku
  rationale: Mempertahankan arti harfiah konstruksi 'memberikan pembalasan-pembalasan kepadaku' dan relasi datif לִי tanpa mengubahnya menjadi 'membalaskan aku' atau 'membalas bagiku'.
- source_word: וּמוֹרִיד עַמִּים תַּחְתֵּנִי
  choice: dan menundukkan bangsa-bangsa di bawah kekuasaanku
  rationale: Secara harfiah berarti 'membawa/menurunkan bangsa-bangsa ke bawahku'; 'menundukkan ... di bawah kekuasaanku' menyampaikan citra penaklukan secara alami tanpa menghilangkan unsur 'di bawahku'.
theological_decisions:
- issue: Pelaku dan penerima pembalasan
  choice: Allah memberikan pembalasan kepada pemazmur
  alternative: Allah mengadakan pembalasan bagi pemazmur
  rationale: Preposisi לְ secara langsung berarti 'kepada/bagiku'; terjemahan utama mempertahankan bentuk datif dan tidak menentukan lebih jauh apakah pemazmur menerima kuasa untuk membalas atau menerima tindakan pembalasan Allah atas musuhnya.
- issue: Makna bangsa-bangsa berada 'di bawah' pemazmur
  choice: di bawah kekuasaanku
  alternative: di bawahku
  rationale: Ungkapan ini dipahami sebagai ketundukan politik atau militer, bukan posisi fisik semata; padanan ini tetap menjaga klaim bahwa Allah adalah pihak yang menundukkan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Paralelisme dua klausa dipertahankan; ambiguitas datif pada 'kepadaku' tidak diperjelas secara doktrinal.
