translation:
  language: id
  text: Lalu bumi terhuyung-huyung dan berguncang; dasar-dasar langit bergetar dan terguncang, karena Dia murka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַשׁ
  choice: berguncang
  rationale: Kata kerja ini menyatakan guncangan atau gempa yang kuat; “berguncang” alami dalam bahasa Indonesia dan sesuai dengan gambaran kosmis ayat ini.
- source_word: וַתִּתְגָּעַשׁ
  choice: terhuyung-huyung
  rationale: Bentuk ini menggambarkan gerakan hebat atau oleng. Pilihan ini mempertahankan pembedaan dari וַתִּרְעַשׁ dan menghadirkan dua gerak yang saling melengkapi.
- source_word: מוֹסְדוֹת הַשָּׁמַיִם
  choice: dasar-dasar langit
  rationale: Terjemahan formal yang mempertahankan kosmologi puitis teks, tanpa menggantinya dengan istilah penjelas modern.
- source_word: יִרְגָּזוּ
  choice: bergetar
  rationale: Menyampaikan gerak gemetar atau kegentaran yang dimaksud dalam konteks gejolak kosmis.
- source_word: חָרָה לוֹ
  choice: Dia murka
  rationale: Idiom Ibrani ini secara harfiah berkaitan dengan menyala atau berkobarnya kemarahan. “Murka” menyampaikan kemarahan ilahi yang kuat dalam ragam bermartabat.
theological_decisions:
- issue: Subjek pronominal dalam frasa כִּי חָרָה לוֹ
  choice: Dia
  alternative: Ia
  rationale: Referennya adalah TUHAN dari konteks sebelumnya. Huruf kapital membantu menunjukkan rujukan ilahi tanpa menambahkan nama yang tidak muncul dalam ayat ini.
- issue: Gambaran dasar-dasar langit
  choice: Mempertahankan ungkapan puitis “dasar-dasar langit”
  alternative: Menjelaskannya sebagai “fondasi dunia” atau menyesuaikannya dengan kosmologi modern
  rationale: Teks secara eksplisit menyebut dasar-dasar langit; citra kuno dan ketegangan puitisnya patut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme serta rangkaian gerak kosmis dipertahankan, sambil memakai kosakata yang mudah dipahami pembaca umum.
