  yaml_path: translation/ot/2_samuel/022/034.yaml
  text: He makes my feet like the feet of deer[b][a], and sets me secure on my heights.
translation:
  language: id
  text: Ia membuat kakinya[c] seperti kaki rusa betina[a], dan membuat aku berdiri di tempat-tempat tinggiku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti rusa-rusa betina”; gambaran ini menyiratkan kelincahan dan keteguhan pijakan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menempatkan aku di tempat-tempat tinggiku.”'
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani di sini berbunyi “kakinya,” lalu beralih kepada “aku” dan “tinggiku.” Bagian paralelnya dalam Mazmur 18:34 berbunyi “kakiku.”
    reason: textual_variant
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: membuat ... seperti
  rationale: Bentuk Piel menyatakan tindakan menyebabkan sesuatu menjadi serupa; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan perbandingan yang eksplisit.
- source_word: רגליו
  choice: kakinya
  rationale: Teks WLC memakai akhiran orang ketiga tunggal maskulin, sehingga diterjemahkan secara formal sebagai “kakinya” meskipun klausa berikutnya memakai orang pertama.
- source_word: כָּאַיָּלוֹת
  choice: seperti kaki rusa betina
  rationale: Bentuk feminin jamak menunjuk kepada rusa betina. Kata “kaki” diulang dalam bahasa Indonesia agar sasaran perbandingannya jelas dan alami.
- source_word: בָּמוֹתַי
  choice: di tempat-tempat tinggiku
  rationale: Terjemahan ini mempertahankan arti konkret “tempat-tempat tinggi” serta akhiran kepunyaan orang pertama, tanpa memberi nuansa tempat ibadah yang tidak dituntut konteks.
- source_word: יַעֲמִדֵנִי
  choice: menegakkan aku
  rationale: Bentuk Hifil dari עמד berarti menyebabkan berdiri atau menegakkan. Pilihan ini mempertahankan unsur kausatif dan kestabilan tanpa menambahkan kata “aman” yang hanya tersirat.
theological_decisions:
- issue: Pergantian pronomina dari “kakinya” menjadi “aku/tinggiku”
  choice: Mempertahankan “kakinya” sesuai teks WLC
  alternative: Mengharmoniskannya menjadi “kakiku,” seperti bacaan paralel dalam Mazmur 18:34
  rationale: Pergantian orang dalam teks Ibrani Samuel merupakan ketegangan tekstual yang nyata. Terjemahan utama tidak menyelesaikannya secara diam-diam; bacaan paralel yang lebih lancar dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Struktur paralel Ibrani dipertahankan, termasuk pergantian pronomina yang tidak biasa. “Rusa betina” dipilih untuk menyampaikan bentuk feminin Ibrani, sedangkan “menegakkan” menjaga gambaran berdiri kokoh tanpa memperluasnya menjadi parafrasa.
