  yaml_path: translation/ot/2_samuel/022/038.yaml
  text: I pursued my enemies and destroyed them[a], and I did not turn back until they were consumed.
translation:
  language: id
  text: Aku mengejar musuh-musuhku dan memusnahkan mereka; aku tidak berbalik sampai mereka habis.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sampai aku menghabisi mereka” atau “sampai mereka dilenyapkan seluruhnya.” Kata Ibrani ini dapat berarti membawa kepada kesudahan atau menghabisi sepenuhnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרְדְּפָה
  choice: Aku mengejar
  rationale: Bentuk Qal dari רדף menyatakan tindakan mengejar dalam konteks pertempuran. Bentuk lampau Indonesia mengikuti rangkaian tindakan puitis dalam konteksnya.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: אֹיֵב dengan akhiran orang pertama tunggal secara langsung berarti musuh-musuh milik atau yang memusuhi sang penutur.
- source_word: וָאַשְׁמִידֵם
  choice: dan memusnahkan mereka
  rationale: Bentuk Hifil dari שׁמד berarti membinasakan atau memusnahkan. 'Memusnahkan' mempertahankan daya kekerasan dan ketuntasan verba Ibrani tanpa memakai ungkapan percakapan.
- source_word: וְלֹא אָשׁוּב
  choice: aku tidak berbalik
  rationale: Dalam alur pengejaran militer, שׁוב paling wajar berarti berbalik atau menghentikan pengejaran, bukan sekadar pulang.
- source_word: עַד כַּלּוֹתָם
  choice: sampai mereka habis
  rationale: כלה dapat berarti selesai, habis, atau dilenyapkan sampai tuntas. Ungkapan ini mempertahankan hasil akhir yang menyeluruh sekaligus tidak memaksakan apakah akhiran pronominal dipahami sebagai pelaku atau sasaran infinitif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan lugas. Kata ganti 'Aku' mempertahankan suara pribadi sang penutur; tanda titik koma memperjelas dua rangkaian tindakan yang sejajar. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang memiliki kemungkinan terjemahan lain.
