  yaml_path: translation/ot/2_samuel/022/023.yaml
  text: For all his judgments were before me[a], and I did not turn away from his statutes.
translation:
  language: id
  text: Sebab segala keputusan-Nya ada di hadapanku, dan aku tidak menyimpang dari ketetapan-ketetapan-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darinya.” Akhiran Ibrani berbentuk feminin tunggal; dalam konteks ini kemungkinan merujuk secara kolektif kepada ketetapan-ketetapan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan kausal dan cocok dengan alur puisi.
- source_word: כָל מִשְׁפָּטָיו
  choice: segala keputusan hukum-Nya
  rationale: כָל mempertahankan cakupan menyeluruh, sedangkan מִשְׁפָּט menunjuk pada keputusan atau ketentuan hukum. Ungkapan ini tetap dibedakan dari חֻקּוֹת dalam baris sejajar.
- source_word: לְנֶגְדִּי
  choice: ada di hadapanku
  rationale: Mempertahankan metafora Ibrani tentang hukum-hukum Tuhan yang senantiasa berada dalam pandangan atau kesadaran sang pembicara.
- source_word: וְחֻקֹּתָיו
  choice: dan ketetapan-ketetapan-Nya
  rationale: חֻקּוֹת menunjuk pada peraturan atau ketetapan yang telah ditetapkan. Bentuk ini menjaga kesejajaran sekaligus perbedaannya dari מִשְׁפָּטָיו.
- source_word: לֹא אָסוּר
  choice: aku tidak menyimpang
  rationale: Kata סוּר berarti berbelok, menyingkir, atau menyimpang. “Tidak menyimpang” alami dalam bahasa Indonesia dan menyampaikan gagasan tidak meninggalkan ketetapan Tuhan.
- source_word: מִמֶּנָּה
  choice: dari ketetapan-ketetapan-Nya
  rationale: Bentuk pronominal Ibrani secara harfiah berarti “darinya” dan berbentuk feminin tunggal, tetapi dalam konteks puitis tampaknya merujuk secara kolektif pada ketetapan-ketetapan yang baru disebut. Pengulangan nomina memperjelas rujukan dalam bahasa Indonesia tanpa menyembunyikan bentuk sumber, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Pembedaan istilah hukum perjanjian
  choice: מִשְׁפָּטָיו diterjemahkan “keputusan hukum-Nya” dan חֻקֹּתָיו “ketetapan-ketetapan-Nya”.
  alternative: Menerjemahkan keduanya secara umum sebagai “hukum-hukum” atau “perintah-perintah”.
  rationale: Teks memakai dua istilah hukum yang berbeda dalam kesejajaran. Mempertahankan perbedaannya menghormati rincian bahasa sumber tanpa memasukkan penggolongan teologis yang tidak dinyatakan dalam ayat.
- issue: Rujukan pronomina מִמֶּנָּה
  choice: Dipahami secara kolektif sebagai rujukan kepada ketetapan-ketetapan Tuhan.
  alternative: Mempertahankan bentuk tunggal secara harfiah sebagai “darinya”, dengan rujukan yang tetap kurang tegas.
  rationale: Konteks terdekat mendukung rujukan kepada חֻקֹּתָיו, tetapi ketidakselarasan jumlah dan gender dalam bentuk Ibrani tidak boleh dihapus tanpa pemberitahuan; karena itu bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi hukum dipertahankan tetapi tetap dapat dipahami pembaca umum; susunan puitis Ibrani dijaga tanpa menghasilkan kalimat yang kaku.
