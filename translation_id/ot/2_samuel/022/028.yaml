  text: וְ/אֶת עַ֥ם עָנִ֖י תּוֹשִׁ֑יעַ וְ/עֵינֶ֖י/ךָ עַל רָמִ֥ים תַּשְׁפִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/028.yaml
  text: You save an afflicted people[b][a], but your eyes are on the haughty to bring them low.
translation:
  language: id
  text: Engkau menyelamatkan kaum yang tertindas[a], tetapi mata-Mu tertuju kepada orang-orang yang sombong[b]; Engkau merendahkan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum yang miskin” atau “kaum yang sengsara.” Kata Ibrani yang diterjemahkan “tertindas” dapat menunjuk kepada orang yang miskin, sengsara, tertindas, atau direndahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang-orang yang angkuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: bangsa
  rationale: Nomina kolektif tunggal ini menunjuk kepada suatu kelompok manusia. Dalam konteks nyanyian kerajaan dan keselamatan umat, “bangsa” alami dalam bahasa Indonesia, tanpa harus menyempitkannya pada pengertian negara modern.
- source_word: עָנִי
  choice: yang tertindas
  rationale: Kata sifat ini dapat berarti miskin, sengsara, tertindas, atau direndahkan. “Tertindas” mempertahankan dimensi penderitaan dan kerendahan sosial, sementara alternatif penting dicatat dalam catatan kaki.
- source_word: תּוֹשִׁיעַ
  choice: Engkau menyelamatkan
  rationale: Bentuk Hifil dari ישׁע menyatakan tindakan menyelamatkan atau melepaskan. “Menyelamatkan” ringkas, luas, dan sesuai dengan ragam puisi yang bermartabat.
- source_word: עֵינֶיךָ
  choice: mata-Mu tertuju
  rationale: Ungkapan konkret “mata-Mu” dipertahankan, sedangkan “tertuju” membuat idiomnya alami dalam bahasa Indonesia dan menyampaikan perhatian yang mengarah pada tindakan berikutnya.
- source_word: רָמִים
  choice: orang-orang yang sombong
  rationale: Bentuk dari רום secara harfiah berkaitan dengan ketinggian, tetapi dalam konteks ini menunjuk kepada mereka yang meninggikan diri. “Orang-orang yang sombong” menyampaikan makna moral dengan jelas.
- source_word: תַּשְׁפִּיל
  choice: untuk merendahkan mereka
  rationale: Bentuk Hifil dari שׁפל berarti membuat rendah atau merendahkan. Susunan ini menyampaikan arah atau hasil tatapan ilahi secara alami tanpa menghilangkan tindakan aktif Allah.
- source_word: וְ
  choice: tetapi
  rationale: Walaupun bentuk dasarnya berarti “dan”, paralelisme memperlihatkan kontras antara menyelamatkan yang tertindas dan merendahkan yang sombong; “tetapi” menyatakan hubungan itu dengan jelas.
theological_decisions:
- issue: Kontras sosial dan moral dalam עָנִי serta רָמִים
  choice: Ayat ini menggambarkan Allah menyelamatkan kelompok yang tertindas dan merendahkan orang-orang yang sombong.
  alternative: Ayat ini dapat dibaca terutama sebagai kontras antara kaum miskin dan mereka yang berkedudukan tinggi.
  rationale: Kosakata Ibrani mencakup dimensi sosial maupun moral. Teks utama mempertahankan penderitaan sosial melalui “tertindas” dan kesombongan moral melalui “sombong”, sedangkan catatan kaki menjaga cakupan alternatif עָנִי tanpa membatasi maknanya pada ekonomi saja.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan umum penerbitan Alkitab Indonesia. Struktur antitetis puisi dipertahankan dengan “tetapi”, dan idiom konkret “mata-Mu” tetap terlihat.
