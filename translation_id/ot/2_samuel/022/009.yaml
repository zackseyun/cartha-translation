base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/009.yaml
  text: Smoke went up from his nostrils[a], and consuming fire from his mouth; coals blazed from him.
translation:
  language: id
  text: Asap naik dari lubang-lubang hidung-Nya[a], dan api yang melalap keluar dari mulut-Nya; bara-bara menyala dari-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dari hidung-Nya"; kata Ibrani untuk "hidung/lubang hidung" juga dapat berarti "murka" secara idiomatis.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה
  choice: naik
  rationale: Menyatakan gerak ke atas dan mempertahankan gambaran konkret secara alami dalam bahasa Indonesia.
- source_word: עָשָׁן
  choice: asap
  rationale: Padanan baku yang tepat dalam konteks gambaran teofani.
- source_word: בְּאַפּוֹ
  choice: dari lubang hidung-Nya
  rationale: אַף dapat berarti hidung/lubang hidung atau secara idiomatis murka. Kesejajaran dengan 'dari mulut-Nya' mendukung gambaran jasmani yang konkret; preposisi diterjemahkan 'dari' sesuai arah keluarnya asap.
- source_word: וְאֵשׁ
  choice: dan api
  rationale: Mempertahankan koordinasi sederhana serta gambaran api dalam teks sumber.
- source_word: מִפִּיו
  choice: dari mulut-Nya
  rationale: Padanan langsung yang mempertahankan kesejajaran dengan 'dari lubang hidung-Nya'.
- source_word: תֹּאכֵל
  choice: melalap
  rationale: Bentuk verbal feminin tunggal ini berpadanan dengan 'api' dan menggambarkan tindakan aktif yang memakan atau menghanguskan; 'melalap' alami dan kuat secara puitis.
- source_word: גֶּחָלִים
  choice: bara
  rationale: Dalam bahasa Indonesia, 'bara' secara alami merujuk pada arang atau bahan yang masih menyala, tanpa perlu menambahkan 'api'.
- source_word: בָּעֲרוּ
  choice: menyala
  rationale: Menyampaikan pembakaran atau penyalaan dengan bahasa puitis yang jelas dan tidak berlebihan.
- source_word: מִמֶּנּוּ
  choice: dari-Nya
  rationale: Mempertahankan makna sumber atau asal dari preposisi מִן dan gambaran api yang terpancar dari tokoh ilahi.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam teofani
  choice: Mempertahankan secara konkret gambaran 'lubang hidung-Nya', 'mulut-Nya', serta asap dan api yang keluar dari-Nya.
  alternative: Menafsirkan אַף secara idiomatis sebagai 'murka-Nya' dan mengabstraksikan gambaran jasmani.
  rationale: Puisi ini menggambarkan penampakan dan kuasa ilahi melalui bahasa antropomorfis. Bentuk konkret menjaga kesejajaran Ibrani dan ketegangan teologisnya tanpa mereduksinya menjadi pernyataan abstrak tentang murka.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab bahasa Indonesia. Struktur tiga klausa dipertahankan agar daya dan kesejajaran puisi tetap terasa.
