  text: who brings me out from my enemies[a]; you exalt me above those who rise against me[b]; you deliver me from the violent man.
translation:
  language: id
  text: yang membawa aku keluar dari musuh-musuhku;[a] Engkau meninggikan aku di atas orang-orang yang bangkit melawan aku; dari orang yang melakukan kekerasan[b] Engkau menyelamatkan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dan yang membawa aku keluar dari musuh-musuhku”; kata penghubung Ibrani dapat dinyatakan secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari seorang pelaku kekerasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמוֹצִיאִי
  choice: yang membawa aku keluar
  rationale: Bentuk kausatif dari יצא mempertahankan gambaran konkret ‘membawa keluar’. Dalam kesinambungan puisi, bentuk ini paling wajar dipahami sebagai uraian relatif tentang Allah; וּ juga dapat diterjemahkan secara eksplisit sebagai ‘dan’.
- source_word: מֵאֹיְבָי
  choice: dari antara musuh-musuhku
  rationale: Preposisi מִן dengan nomina bersufiks orang pertama tunggal menyatakan pemisahan atau pelepasan. ‘Dari antara’ terdengar alami dalam bahasa Indonesia dan menyampaikan bahwa pemazmur dikeluarkan dari lingkungan atau kuasa para musuhnya.
- source_word: וּמִקָּמַי
  choice: di atas orang-orang yang bangkit melawan aku
  rationale: Bentuk dari קום dipakai secara substantival dengan nuansa permusuhan. Terjemahan ini mempertahankan citra verbal ‘bangkit’ dan kaitannya dengan מִן sesudah kata kerja רום, yang secara idiomatis menyatakan peninggian di atas lawan.
- source_word: תְּרוֹמְמֵנִי
  choice: Engkau meninggikan aku
  rationale: Bentuk orang kedua maskulin tunggal dari רום menyatakan tindakan mengangkat atau menempatkan tinggi. ‘Meninggikan aku’ mempertahankan metafora vertikal sekaligus nuansa kemenangan.
- source_word: מֵאִישׁ חֲמָסִים
  choice: dari orang yang melakukan kekerasan
  rationale: אִישׁ berbentuk tunggal, sedangkan חֲמָסִים mencirikan orang itu dengan kekerasan. Ungkapan Indonesia ini alami, tetap tunggal, dan tidak mengubahnya menjadi kelompok jamak.
- source_word: תַּצִּילֵנִי
  choice: Engkau menyelamatkan aku
  rationale: Kata נצל dalam bentuk ini berarti melepaskan atau menyelamatkan dari bahaya. ‘Menyelamatkan’ jelas bagi pembaca modern dan cocok dengan konteks ancaman kekerasan.
