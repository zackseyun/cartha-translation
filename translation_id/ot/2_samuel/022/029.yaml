  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אַתָּ֥ה נֵירִ֖/י יְהוָ֑ה וַ/יהוָ֖ה יַגִּ֥יהַּ חָשְׁכִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/022/029.yaml
  text: For you are my lamp[a], O Yahweh[b], and Yahweh lights up my darkness.
translation:
  language: id
  text: Sebab Engkaulah pelitaku[a], ya Yahweh; Yahweh menerangi kegelapanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pelitaku”; dapat juga dipahami menurut maknanya sebagai “cahayaku”. Bahasa Ibrani memakai gambaran konkret sebuah pelita.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberi dasar atau penjelasan bagi pernyataan sebelumnya tanpa mempersempitnya menjadi hubungan sebab-akibat yang terlalu tegas.
- source_word: אַתָּה
  choice: Engkaulah
  rationale: Kata ganti orang kedua tunggal yang ditujukan langsung kepada Allah; partikel -lah secara wajar menampilkan penekanan yang muncul dari penyebutan eksplisit kata ganti Ibrani.
- source_word: נֵירִי
  choice: pelitaku
  rationale: נֵירִי secara konkret berarti 'pelitaku'. Pilihan ini mempertahankan metafora benda yang menghasilkan terang, bukan mengubahnya menjadi gagasan abstrak 'cahayaku'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: יַגִּיהַּ
  choice: menerangi
  rationale: Bentuk kausatif dari נגה menyatakan membuat bercahaya atau memberi terang. 'Menerangi' alami dalam bahasa Indonesia dan mempertahankan tindakan Yahweh terhadap kegelapan pemazmur.
- source_word: חָשְׁכִּי
  choice: kegelapanku
  rationale: Mempertahankan nomina dengan sufiks orang pertama secara ringkas dan tidak menafsirkan apakah kegelapan itu menunjuk pada bahaya, kesusahan, atau keadaan batin.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan menghindari penggantiannya dengan sebuah gelar.
- issue: Makna metaforis 'kegelapanku'
  choice: Dibiarkan sebagai 'kegelapanku'
  alternative: kesusahanku atau bahaya yang mengelilingiku
  rationale: Teks tidak merinci rujukan metafora itu. Terjemahan mempertahankan keluasan maknanya dan tidak menyelesaikan ketegangan puitis secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Sapaan 'ya Yahweh' mempertahankan seruan langsung, sedangkan pengulangan nama Yahweh menjaga kesejajaran teks Ibrani. Tanda titik koma memisahkan dua klausa puitis yang erat berkaitan.
