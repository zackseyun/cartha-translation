  text: They confronted me in the day of my calamity[b][a], but Yahweh was my support.
translation:
  language: id
  text: Mereka menghadang aku pada hari malapetakaku[a], tetapi Yahweh[b] adalah penopangku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka mendatangi aku” atau “Mereka menemui aku pada hari malapetakaku.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקַדְּמֻנִי
  choice: Mereka menghadang aku
  rationale: Bentuk Piel dari קדמ dengan objek orang pertama tunggal dalam konteks permusuhan menyatakan tindakan mendatangi atau menemui secara agresif. “Menghadang” alami dalam bahasa Indonesia dan mempertahankan daya adversatifnya.
- source_word: בְּיוֹם אֵידִי
  choice: pada hari malapetakaku
  rationale: Frasa temporal בְּיוֹם paling alami diterjemahkan “pada hari,” sedangkan אֵידִי menunjuk pada bencana atau malapetaka yang menimpa pemazmur, bukan semata-mata perasaan batin.
- source_word: וַיְהִי
  choice: tetapi ... menjadi
  rationale: 'Walaupun waw secara formal dapat diterjemahkan “dan,” hubungan antarklausa di sini bersifat kontras: para musuh menghadang, tetapi Yahweh menopang. “Menjadi” mempertahankan aspek peristiwa dari וַיְהִי tanpa terasa kaku.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: מִשְׁעָן לִי
  choice: menjadi penopangku
  rationale: מִשְׁעָן adalah sesuatu yang dijadikan sandaran atau penopang. Dalam konteks metaforis, “penopangku” jelas, ringkas, dan mempertahankan citra dasar teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu tanpa mengubahnya menjadi gelar; “TUHAN” dan “Yehova” dicatat sebagai tradisi atau bentuk alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis yang sederhana dan bermartabat. Susunan kalimat dibuat alami, sedangkan metafora “penopang” dan kontras antarklausa dipertahankan.
