base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/021.yaml
  text: He also struck down an Egyptian[a], a man of impressive appearance. The Egyptian had a spear in his hand, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[b], and killed him with his own spear.
translation:
  language: id
  text: Ia juga menumbangkan seorang Mesir yang berpenampilan mengesankan.[a] Orang Mesir itu memegang tombak, dan ia turun menghadapinya dengan sebatang tongkat.[b] Ia merampas tombak itu dari tangan orang Mesir tersebut, lalu membunuhnya dengan tombaknya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang elok rupanya” atau “yang berpenampilan menonjol.” Frasa Ibrani ini secara luas merujuk pada penampilan orang Mesir tersebut. Berdasarkan bagian sejajar dalam 1 Tawarikh 11:23, sebagian orang memahaminya sebagai petunjuk bahwa tubuhnya luar biasa tinggi.
    reason: lexical_alternative
  - marker: b
    text: Atau “gada” atau “tongkat pemukul.” Kata Ibrani שֵׁבֶט dapat berarti tongkat, tongkat pemukul, gada, atau tongkat kerajaan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: menumbangkan
  rationale: Dalam konteks kepahlawanan, נכה menyatakan tindakan memukul atau menjatuhkan lawan. “Menumbangkan” memberi ringkasan kemenangan tanpa menggantikan pernyataan eksplisit kemudian bahwa orang Mesir itu dibunuh.
- source_word: אִישׁ מִצְרִי
  choice: seorang Mesir
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan identitas etnis orang tersebut tanpa kata tambahan yang tidak diperlukan.
- source_word: אשר מַרְאֶה
  choice: yang berpenampilan mengesankan
  rationale: Frasa Ibrani ini eliptis dan berkaitan dengan rupa atau penampilan yang terlihat. Pilihan ini tidak membatasi maknanya pada ketampanan atau tinggi badan.
- source_word: וּבְיַד הַמִּצְרִי חֲנִית
  choice: Orang Mesir itu memegang tombak
  rationale: Ini merupakan ungkapan kepemilikan yang alami dalam bahasa Indonesia dan mempertahankan gambaran konkret tombak di tangannya.
- source_word: וַיֵּרֶד אֵלָיו
  choice: ia turun menghadapinya
  rationale: “Turun” mempertahankan unsur gerak dalam ירד, sedangkan “menghadapinya” menyampaikan gerak mendekati lawan dalam konteks pertempuran.
- source_word: בַּשָּׁבֶט
  choice: dengan sebatang tongkat
  rationale: שֵׁבֶט dapat berarti tongkat, gada, batang, atau tongkat kerajaan. “Tongkat” merupakan pilihan luas yang tidak memastikan bahwa benda itu berbentuk gada.
- source_word: וַיִּגְזֹל
  choice: merampas
  rationale: גזל menyiratkan pengambilan dengan paksa. “Merampas” menyampaikan tindakan itu dengan jelas dalam konteks perkelahian.
- source_word: וַיַּהַרְגֵהוּ
  choice: membunuhnya
  rationale: הרג secara langsung berarti membunuh; pilihan ini jelas, lugas, dan modern.
- source_word: בַּחֲנִיתוֹ
  choice: dengan tombaknya sendiri
  rationale: Akhiran pronominal paling wajar merujuk kepada orang Mesir, pemilik tombak yang baru dirampas. “Sendiri” menonjolkan pembalikan dalam peristiwa itu tanpa mengubah acuannya.
- source_word: וְהוּא
  choice: Ia juga
  rationale: Kata sambung dan pronomina melanjutkan daftar tindakan kepahlawanan; “juga” menyampaikan hubungan penambahan secara alami.
