translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Struktur koordinatif Ibrani dipertahankan sejauh tetap alami. “Sedangkan” memperjelas pergantian pelaku dari orang Mesir yang memegang tombak kepada sang pahlawan yang turun menghadapinya, tanpa menambahkan gagasan bahwa ia hanya membawa tongkat.
