  text: But worthless men are all like thorns cast aside[a], for they cannot be taken with the hand.
translation:
  language: id
  text: Namun, semua orang bejat seperti duri yang dibuang, sebab semuanya tidak dapat diambil dengan tangan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “orang bejat” di sini berarti orang yang jahat atau tidak berguna, bukan nama diri “Belial” yang muncul dalam pemakaian pada masa kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְלִיַּעַל
  choice: orang bejat
  rationale: Dalam konteks ini, בְּלִיַּעַל menunjuk kepada orang-orang yang jahat atau tidak berguna, bukan nama diri Belial. Bentuk personal jamak diperjelas secara alami dalam bahasa Indonesia.
- source_word: כְּקוֹץ
  choice: seperti duri
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat dipahami secara kolektif dan cocok dengan acuan jamak.
- source_word: מֻנָד
  choice: yang dibuang
  rationale: Partisipel pasif ini menyatakan sesuatu yang disingkirkan atau dihalau; 'dibuang' alami dalam gambaran tentang duri dan tidak menentukan secara berlebihan cara penyingkirannya.
- source_word: כֻּלָּהַם
  choice: semua
  rationale: Mempertahankan cakupan menyeluruh dengan susunan bahasa Indonesia yang wajar.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perbandingan pada klausa sebelumnya.
- source_word: לֹא בְיָד יִקָּחוּ
  choice: duri tidak dapat diambil dengan tangan
  rationale: Ungkapan ini menyampaikan bahwa duri semacam itu tidak dipegang atau diambil langsung dengan tangan. Pengulangan 'duri' memperjelas bahwa subjek klausa ini adalah gambaran duri, bukan orang bejat.
theological_decisions:
- issue: Apakah בְּלִיַּעַל merupakan nama diri
  choice: 'Diterjemahkan sebagai sifat moral personal: ''orang bejat'''
  alternative: Belial
  rationale: Pemakaian dalam konteks Ibrani ini paling wajar merujuk kepada orang jahat atau tidak berguna; memakai 'Belial' dapat secara anakronistis mengesankan tokoh yang dipersonifikasikan dalam tradisi kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. 'Namun' mempertahankan pertentangan dengan ayat sebelumnya; 'orang bejat' tegas secara moral tetapi tetap mudah dipahami. Klausa kedua dibuat eksplisit agar acuan gramatikalnya tidak rancu.
