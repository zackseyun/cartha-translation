lexical_decisions:
- source_word: יִגְאָל
  choice: Yigal
  rationale: Nama diri Ibrani ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia; huruf awal yod direpresentasikan sebagai Y.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama dan silsilah, בֶּן secara alami menyatakan hubungan sebagai anak laki-laki; bahasa Indonesia lazim memakai bentuk ringkas 'anak'.
- source_word: נָתָן
  choice: Natan
  rationale: Nama diri Ibrani ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִצֹּבָה
  choice: dari Zoba
  rationale: Prefiks מִן paling langsung menunjukkan asal geografis, meskipun dapat pula menyatakan hubungan atau keterkaitan dengan tempat tersebut.
- source_word: בָּנִי
  choice: Bani
  rationale: Nama diri ditransliterasikan langsung; konteks daftar mendukung pemahaman sebagai nama orang.
- source_word: הַגָּדִי
  choice: orang Gad
  rationale: Bentuk nisbah ini menyatakan seseorang yang berasal dari atau termasuk suku Gad; 'orang Gad' alami, jelas, dan ringkas dalam bahasa Indonesia.
