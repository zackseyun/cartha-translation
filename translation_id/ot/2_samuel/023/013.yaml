  text: וַ/יֵּרְד֨וּ שלשים מֵ/הַ/שְּׁלֹשִׁ֣ים רֹ֗אשׁ וַ/יָּבֹ֤אוּ אֶל קָצִיר֙ אֶל דָּוִ֔ד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וְ/חַיַּ֣ת פְּלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/013.yaml
  text: Then thirty of the thirty chief men went down and came at harvest time to David[a], to the cave of Adullam[c][b], while a band of the Philistines was camped in the Valley of Rephaim.
translation:
  language: id
  text: Kemudian tiga orang dari antara Ketiga Puluh, para pemimpin[a], turun dan datang kepada Daud, ke gua Adulam, pada musim panen[b], sementara pasukan Filistin[c] sedang berkemah di Lembah Refaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam teks tertulis (ketiv) Ibrani: “tiga puluh dari ketiga puluh, kepala/pemimpin”; qere Masoret membacanya: “tiga dari ketiga puluh, kepala/pemimpin.” Ungkapan ini sulit. Frasa itu dapat menunjuk pada tiga pemimpin atau pada tiga anggota kelompok elite yang disebut “Ketiga Puluh.”'
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “menuju panen”; mungkin juga diterjemahkan “ketika panen berlangsung.”
    reason: lexical_alternative
  - marker: c
    text: Ibrani חַיַּת פְּלִשְׁתִּים, secara harfiah “makhluk hidup/binatang orang Filistin,” dipakai di sini sebagai ungkapan untuk kelompok atau pasukan militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: turun
  rationale: Kata kerja ירד menyatakan gerak turun; bentuk ringkas ini alami dalam narasi Indonesia dan mempertahankan arah geraknya.
- source_word: שלשים מֵהַשְּׁלֹשִׁים רֹאשׁ
  choice: tiga orang dari ketiga puluh pemimpin
  rationale: Bacaan Masoret yang ditradisikan dan konteks tentang tiga pahlawan mendukung 'tiga orang', sedangkan frasa selanjutnya menunjuk pada kelompok 'ketiga puluh' yang terkemuka. Kesulitan tekstualnya dicatat dalam catatan kaki.
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Kata kerja בוא dengan tujuan yang ditandai אֶל secara alami diterjemahkan 'datang' dalam alur narasi.
- source_word: אֶל קָצִיר
  choice: pada musim panen
  rationale: Secara harfiah berbentuk 'menuju panen', tetapi dalam konteks ini paling mungkin berfungsi sebagai keterangan waktu.
- source_word: אֶל דָּוִד אֶל מְעָרַת עֲדֻלָּם
  choice: kepada Daud di Gua Adulam
  rationale: Pengulangan אֶל mengaitkan kedatangan mereka dengan Daud dan lokasi gua; bahasa Indonesia yang alami menyatakan orang sebagai tujuan dan gua sebagai lokasi tanpa menambah gagasan 'menemui'.
- source_word: חַיַּת פְּלִשְׁתִּים
  choice: sepasukan orang Filistin
  rationale: חַיָּה biasanya berarti makhluk hidup atau binatang, tetapi di sini merupakan ungkapan militer untuk satu kelompok atau pasukan.
- source_word: חֹנָה
  choice: sedang berkemah
  rationale: Partisipel חנה menggambarkan keadaan yang sedang berlangsung sebagai latar bagi tindakan utama.
- source_word: בְּעֵמֶק רְפָאִים
  choice: di Lembah Refaim
  rationale: Nama tempat dipertahankan melalui transliterasi Indonesia yang lazim.
