revisions:
- from: Kemudian tiga orang dari ketiga puluh pemimpin[a] turun dan datang kepada Daud di Gua Adulam pada musim panen[b], sementara sepasukan orang Filistin[c] sedang berkemah di Lembah Refaim.
  to: Kemudian tiga orang dari antara Ketiga Puluh, para pemimpin[a], turun dan datang kepada Daud, ke gua Adulam, pada musim panen[b], sementara pasukan Filistin[c] sedang berkemah di Lembah Refaim.
  rationale: Revisi mempertahankan bacaan qere “tiga” di teks utama dan transparansi ketiv “tiga puluh” dalam catatan kaki. Ungkapan kelompok elite tidak ditafsirkan secara berlebihan; bentuk “Ketiga Puluh, para pemimpin” menjaga kepadatan dan ambiguitas Ibrani sambil tetap wajar dalam bahasa Indonesia. Diksi militer dan arah tujuan diperbaiki agar lebih idiomatis dan dekat dengan teks sumber.
