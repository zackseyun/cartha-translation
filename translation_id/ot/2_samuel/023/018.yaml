base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/018.yaml
  text: Abishai[a], the brother of Joab son of Zeruiah, was chief of the Three. He wielded his spear against three hundred and killed them[b], and he had a name among the Three.
translation:
  language: id
  text: Abisai, saudara Yoab, anak Zeruya, adalah pemimpin Tiga Orang itu.[a] Ia mengangkat tombaknya melawan tiga ratus orang dan menewaskan mereka,[b] dan ia termasyhur di antara Tiga Orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pemimpin Tiga Orang itu.” Karena kesejajaran dengan 1 Tawarikh 11:20 dan ketidakpastian tekstual dalam bagian ini, sebagian penafsir memahami kelompok ini sebagai “tiga puluh orang”.'
    reason: textual_variant
  - marker: b
    text: Atau, “mengacungkan tombaknya melawan tiga ratus orang dan menewaskan mereka.” Ungkapan Ibraninya padat; secara harfiah, “membangkitkan/mengangkat tombaknya melawan tiga ratus orang tewas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאשׁ הַשְּׁלֹשִׁי
  choice: pemimpin Tiga Orang itu
  rationale: רֹאשׁ berarti ‘kepala/pemimpin’. Bentuk berikutnya sulit secara tekstual dan leksikal, tetapi teks Masoret dalam ayat ini serta frasa בַּשְּׁלֹשָׁה mendukung pembacaan ‘Tiga Orang’. Kemungkinan ‘tiga puluh orang’ dicatat dalam catatan kaki.
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: mengayunkan tombaknya
  rationale: עוֹרֵר secara harfiah dapat berarti ‘membangkitkan/mengangkat’. Dengan tombak sebagai objek dalam konteks pertempuran, ‘mengayunkan tombaknya’ menyatakan penggunaan aktif secara alami tanpa menghilangkan citra sumber.
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: melawan tiga ratus orang dan menewaskan mereka
  rationale: חָלָל menunjuk kepada orang yang tertikam atau tewas. Ungkapan Ibraninya padat; terjemahan ini mengungkapkan implikasi tindakan secara wajar dalam bahasa Indonesia, sementara kepadatan dan alternatif harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְלוֹ שֵׁם
  choice: dan ia termasyhur
  rationale: Ungkapan harfiahnya adalah ‘dan baginya ada nama’, sebuah idiom untuk nama baik, kemasyhuran, atau reputasi. ‘Ia termasyhur’ merupakan padanan Indonesia yang alami.
- source_word: בַּשְּׁלֹשָׁה
  choice: di antara Tiga Orang itu
  rationale: Preposisi בְּ dengan bilangan di sini dipahami secara relasional, yaitu ‘di antara’. Pilihan ini mempertahankan hubungan Abisai dengan kelompok elite yang disebut dalam ayat tersebut.
- source_word: אֲבִישַׁי ... יוֹאָב ... צְרוּיָה
  choice: Abisai ... Yoab ... Zeruya
  rationale: Nama-nama diri dialihaksarakan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
