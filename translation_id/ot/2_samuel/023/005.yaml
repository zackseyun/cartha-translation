  text: כִּֽי לֹא כֵ֥ן בֵּיתִ֖/י עִם אֵ֑ל כִּי֩ בְרִ֨ית עוֹלָ֜ם שָׂ֣ם לִ֗/י עֲרוּכָ֤ה בַ/כֹּל֙ וּ/שְׁמֻרָ֔ה כִּֽי כָל יִשְׁעִ֥/י וְ/כָל חֵ֖פֶץ כִּֽי לֹ֥א יַצְמִֽיחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/005.yaml
  text: For my house is not so with God[a]; yet he has made with me an everlasting covenant, ordered in every way and kept secure[b]. For this is all my salvation and all my desire—will he not indeed make it grow?
translation:
  language: id
  text: Sebab keluargaku tidak demikian dengan Allah[a]; sebab Dia telah mengadakan perjanjian kekal denganku, yang diatur dalam segala hal dan terpelihara. Sebab seluruh keselamatanku dan segala keinginanku—tidakkah Dia akan menumbuhkannya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bukankah keluargaku demikian dengan Allah?” Banyak penafsir memahami bagian pembuka ini sebagai pertanyaan retoris positif, bukan pernyataan negatif.
    reason: alternative_reading
  - marker: b
    text: Atau, “Sebab Dia pasti akan menumbuhkannya.” Klausa terakhir dalam bahasa Ibrani sulit dipahami dan dapat dibaca sebagai pertanyaan retoris atau sebagai penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab / namun / sungguh
  rationale: Kata ini muncul berulang kali dengan fungsi wacana yang berbeda. Pada awal ayat diterjemahkan sebagai penjelasan, pada bagian tengah hubungan pertentangan dibuat alami dalam bahasa Indonesia, dan sebelum klausa akhir kekuatan penegasannya dinyatakan dengan “sungguh”.
- source_word: לֹא כֵן
  choice: tidak demikian
  rationale: Ungkapan ini dipertahankan secara cukup harfiah agar ketegangan dalam teks Ibrani tidak dihilangkan atau dijelaskan secara berlebihan.
- source_word: בֵּיתִי
  choice: keluargaku
  rationale: Dalam konteks ini “rumah” menunjuk kepada keluarga atau garis keturunan Daud. “Keluargaku” terdengar alami dalam bahasa Indonesia, sambil tetap memungkinkan nuansa rumah tangga dan keturunan dinasti.
- source_word: עִם אֵל
  choice: di hadapan Allah
  rationale: Secara harfiah berarti “dengan Allah”; ungkapan “di hadapan Allah” menyampaikan hubungan atau keadaan keluarga Daud dalam penilaian Allah secara alami dalam bahasa Indonesia.
- source_word: בְרִית עוֹלָם
  choice: perjanjian kekal
  rationale: Ini merupakan padanan baku dan jelas untuk perjanjian yang berlaku terus-menerus.
- source_word: שָׂם לִי
  choice: telah mengadakan ... denganku
  rationale: Walaupun verba dasarnya berarti “menaruh” atau “menetapkan”, konteks perjanjian paling alami dinyatakan dengan “mengadakan perjanjian denganku”.
- source_word: עֲרוּכָה בַכֹּל
  choice: diatur dalam segala hal
  rationale: Terjemahan ini mempertahankan gagasan bahwa perjanjian tersebut ditata atau ditetapkan secara menyeluruh.
- source_word: וּשְׁמֻרָה
  choice: terpelihara
  rationale: Bentuk pasifnya menunjukkan bahwa perjanjian itu dijaga atau diamankan; “terpelihara” ringkas dan wajar.
- source_word: כָל יִשְׁעִי
  choice: seluruh keselamatanku
  rationale: “Keselamatan” mempertahankan keluasan makna יֵשַׁע, yang dapat mencakup penyelamatan dan pembebasan.
- source_word: וְכָל חֵפֶץ
  choice: segala keinginanku
  rationale: חֵפֶץ dapat berarti keinginan, kesukaan, atau hal yang dikehendaki. “Keinginan” cocok dengan paralelismenya tanpa mempersempit makna.
- source_word: כִּי לֹא יַצְמִיחַ
  choice: tidakkah Dia akan menumbuhkannya?
  rationale: Klausa padat ini dipahami sebagai pertanyaan retoris positif. “Menumbuhkan” mempertahankan citra tumbuhan dan daya kausatif verba Ibrani, sedangkan pronomina “-nya” membiarkan objeknya tetap agak terbuka.
theological_decisions:
- issue: Makna klausa pembuka כִּי לֹא כֵן בֵּיתִי עִם אֵל
  choice: 'Pernyataan negatif: “keluargaku tidak demikian di hadapan Allah”'
  alternative: 'Pertanyaan retoris positif: “Bukankah keluargaku demikian di hadapan Allah?”'
  rationale: Teks Masoret sebagaimana ditandai secara langsung berbunyi negatif. Terjemahan utama mempertahankan kesulitan dan ketegangan itu, sementara pembacaan positif yang penting dicatat dalam catatan kaki.
- issue: Makna dan objek verba terakhir יַצְמִיחַ
  choice: Pertanyaan retoris yang menyatakan bahwa Allah akan menumbuhkan atau mewujudkan keselamatan dan keinginan Daud
  alternative: 'Pernyataan negatif bahwa Allah tidak akan menumbuhkannya, atau penegasan langsung: “Dia pasti akan menumbuhkannya”'
  rationale: Sintaksis Ibrani sangat padat dan dapat dipahami dengan beberapa cara. Pertanyaan retoris sesuai dengan konteks perjanjian kekal, tetapi catatan kaki tetap mengakui kemungkinan pembacaan lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Keluargaku” dipilih daripada “rumahku” agar mudah dipahami, tetapi tetap membawa kemungkinan makna rumah tangga dan garis keturunan. Citra pertumbuhan pada verba terakhir dipertahankan.
