  text: אֱלִיפֶ֥לֶט בֶּן אֲחַסְבַּ֖י בֶּן הַ/מַּֽעֲכָתִ֑י אֱלִיעָ֥ם בֶּן אֲחִיתֹ֖פֶל הַ/גִּלֹנִֽי־־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/034.yaml
  text: Eliphelet son of Ahasbai son of the Maacathite[a], Eliam son of Ahithophel the Gilonite.
translation:
  language: id
  text: Elifelet anak Ahasbai anak orang Maakha; Eliam anak Ahitofel, orang Gilo.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלִיפֶלֶט
  choice: Elifelet
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia; huruf פ tanpa dagesh direpresentasikan dengan f.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar nama dan silsilah, kata ini paling wajar menunjukkan hubungan anak laki-laki dengan ayahnya; terjemahan ringkas “anak” sesuai dengan gaya daftar.
- source_word: אֲחַסְבַּי
  choice: Ahasbai
  rationale: Nama pribadi ditransliterasikan langsung ke dalam ejaan Indonesia.
- source_word: הַמַּעֲכָתִי
  choice: seorang Maakha
  rationale: Bentuk nisbah ini menunjukkan orang yang berasal dari atau terkait dengan Maakha. Ungkapan “seorang Maakha” mempertahankan penanda asal/kelompok tanpa mengubahnya menjadi sekadar nama tempat.
- source_word: אֱלִיעָם
  choice: Eliam
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Ibrani.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia, dengan ח direpresentasikan sebagai h dan פ tanpa dagesh sebagai f.
- source_word: הַגִּלֹנִי
  choice: orang Gilo
  rationale: Bentuk nisbah dari Gilo diterjemahkan secara alami sebagai penanda asal, “orang Gilo”.
theological_decisions:
- issue: Hubungan sintaksis antara Ahasbai dan sebutan orang Maakha
  choice: 'Teks utama mengikuti urutan harfiah: “Ahasbai, anak seorang Maakha”.'
  alternative: “Ahasbai, orang Maakha”
  rationale: Rangkaian Ibrani memuat בֶּן sebelum הַמַּעֲכָתִי, tetapi susunannya dapat dipahami secara berbeda sebagai aposisi, khususnya bila dibandingkan dengan daftar sejajar dalam 1 Tawarikh 11:35–36. Ambiguitas tekstual/sintaksis dipertahankan melalui catatan kaki dan tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai bentuk daftar nama. Tanda titik koma membedakan dua nama utama dalam ayat, sedangkan koma menandai keterangan asal atau hubungan keluarga.
