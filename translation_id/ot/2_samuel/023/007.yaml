  yaml_path: translation/ot/2_samuel/023/007.yaml
  text: But the man who touches them must arm himself with iron and the shaft of a spear[c][b][a], and they must be completely burned with fire in their place.
translation:
  language: id
  text: Namun, orang yang menyentuh mereka[c] harus memperlengkapi dirinya dengan besi dan tangkai tombak[a]; mereka pasti dibakar habis dengan api di tempat mereka berada.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harus membekali dirinya dengan besi dan tangkai tombak”; secara harfiah, “harus dipenuhi dengan besi dan kayu tombak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pasti dibakar dengan api di tempat itu.” Bahasa Ibrani memakai infinitif absolut bersama verba untuk memberi penegasan.
    reason: lexical_alternative
  - marker: c
    text: Kata “mereka” merujuk kepada orang-orang durjana pada ayat sebelumnya, yang digambarkan seperti semak berduri.
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישׁ
  choice: Namun, orang yang
  rationale: Kata אִישׁ berbentuk tunggal dan digunakan secara umum untuk siapa pun yang menghadapi orang-orang durjana yang digambarkan sebagai semak berduri pada ayat sebelumnya. וְ diterjemahkan “Namun” untuk menyatakan pertentangan dalam konteks.
- source_word: יִגַּע בָּהֶם
  choice: menyentuh mereka
  rationale: נגע pada dasarnya berarti “menyentuh” atau “mengenai”; makna langsung ini sesuai dengan gambaran semak berduri yang berbahaya.
- source_word: יִמָּלֵא
  choice: harus memperlengkapi dirinya
  rationale: Bentuk Nifal ini secara harfiah berarti “dipenuhi”, tetapi bersama alat-alat yang disebut sesudahnya menyatakan bahwa orang itu harus membekali atau memperlengkapi dirinya.
- source_word: בַרְזֶל
  choice: dengan besi
  rationale: Nomina ini berarti “besi”. Teks tidak menentukan jenis alat besinya, sehingga terjemahan tidak mempersempitnya.
- source_word: וְעֵץ חֲנִית
  choice: dan tangkai tombak
  rationale: Secara harfiah frasa ini berarti “kayu tombak”, yakni bagian kayu atau tangkai tombak. “Tangkai tombak” mempertahankan gambaran konkret dengan bahasa Indonesia yang wajar.
- source_word: וּבָאֵשׁ
  choice: dengan api
  rationale: Preposisi ב dipahami secara instrumental, yaitu api sebagai sarana pembakaran.
- source_word: שָׂרוֹף יִשָּׂרְפוּ
  choice: mereka pasti dibakar habis
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama memberi penegasan. “Pasti dibakar habis” menyampaikan kepastian sekaligus tuntasnya tindakan tanpa mengubah gambaran teks.
- source_word: בַּשָּׁבֶת
  choice: di tempat mereka berada
  rationale: Bentuk yang jarang ini paling sesuai dipahami secara adverbial-lokatif dalam konteks, yakni bahwa semak berduri itu dibakar di tempatnya.
theological_decisions:
- issue: Rujukan pronomina jamak “mereka”
  choice: Mempertahankan “mereka” dalam teks dan menjelaskan acuannya dalam catatan kaki
  alternative: Mengganti langsung dengan “orang-orang durjana itu” atau “semak-semak berduri itu”
  rationale: Bahasa Ibrani memakai pronomina yang merujuk kembali kepada orang-orang durjana dalam ayat 6, yang secara metaforis disamakan dengan semak berduri. Mempertahankan pronomina menjaga hubungan dan ketegangan metaforis antarayat tanpa menafsirkan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kuno. Struktur kalimat mempertahankan gambaran semak berduri, besi, tangkai tombak, dan pembakaran, sambil memakai ungkapan alami “memperlengkapi dirinya” untuk konstruksi Ibrani yang secara harfiah berbunyi “dipenuhi”.
