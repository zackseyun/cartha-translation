source:
  edition: WLC
  text: וְ/אֵ֛לֶּה דִּבְרֵ֥י דָוִ֖ד הָ/אַֽחֲרֹנִ֑ים נְאֻ֧ם דָּוִ֣ד בֶּן יִשַׁ֗י וּ/נְאֻ֤ם הַ/גֶּ֨בֶר֙ הֻ֣קַם עָ֔ל מְשִׁ֨יחַ֙ אֱלֹהֵ֣י יַֽעֲקֹ֔ב וּ/נְעִ֖ים זְמִר֥וֹת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/001.yaml
  text: 'These are the last words of David: An oracle of David son of Jesse[a], an oracle of the man raised on high, the anointed of the God of Jacob[c][b], and the sweet singer of Israel.'
translation:
  language: id
  text: 'Inilah perkataan terakhir Daud:


    “Pernyataan Daud anak Isai[a],

    pernyataan orang yang ditinggikan,

    orang yang diurapi oleh Allah Yakub[b],

    dan pelantun merdu nyanyian-nyanyian Israel[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sabda” atau “tuturan”. Kata Ibrani ini menandai ucapan resmi dan khidmat, dan sering dipakai untuk pernyataan profetis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang diurapi milik Allah Yakub”. Di sini ungkapan itu langsung menunjuk kepada Daud, tetapi juga memiliki gema kerajaan dan mesianik.
    reason: alternative_reading
  - marker: c
    text: Atau “penyanyi merdu Israel”. Frasa Ibraninya padat; secara harfiah frasa itu menghubungkan sifat “merdu/menyenangkan” dengan “nyanyian-nyanyian Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה דִּבְרֵי דָוִד הָאַחֲרֹנִים
  choice: Inilah perkataan terakhir Daud
  rationale: Menerjemahkan ungkapan pengantar secara langsung dan alami. Kata וְ berfungsi sebagai penghubung wacana dan tidak perlu dinyatakan dengan "dan" dalam bahasa Indonesia.
- source_word: נְאֻם
  choice: pernyataan
  rationale: Menjaga fungsi istilah ini sebagai penanda tuturan resmi dan khidmat. Alternatif "sabda" atau "tuturan" dicatat karena istilah Ibrani ini sering muncul dalam pernyataan profetis.
- source_word: בֶּן יִשַׁי
  choice: anak Isai
  rationale: Bentuk patronimik biasa diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: הַגֶּבֶר
  choice: orang
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang laki-laki yang terpandang; "orang" terasa lebih alami daripada pengulangan "laki-laki" dan tidak menambahkan gagasan "pahlawan" yang tidak pasti.
- source_word: הֻקַם עָל
  choice: yang ditinggikan
  rationale: Bentuk pasif ini menyatakan pengangkatan atau peninggian. "Ditinggikan" mempertahankan citra kehormatan tanpa menentukan secara berlebihan apakah yang dimaksud ialah kedudukan politik atau kemuliaan.
- source_word: מְשִׁיחַ אֱלֹהֵי יַעֲקֹב
  choice: orang yang diurapi oleh Allah Yakub
  rationale: Menunjuk langsung kepada Daud sebagai raja yang diurapi Allah. Bentuk deskriptif mempertahankan gema mesianik tanpa mengubahnya menjadi gelar khusus dalam teks utama.
- source_word: נְעִים זְמִרוֹת יִשְׂרָאֵל
  choice: pelantun merdu nyanyian-nyanyian Israel
  rationale: Ungkapan Ibrani sangat padat dan secara harfiah menghubungkan sesuatu yang menyenangkan atau merdu dengan nyanyian Israel. Terjemahan ini mengungkapkan peran Daud secara alami sambil mempertahankan unsur nyanyian.
theological_decisions:
- issue: Apakah מְשִׁיחַ harus diterjemahkan sebagai gelar "Mesias"
  choice: orang yang diurapi
  alternative: Mesias milik Allah Yakub
  rationale: Rujukan langsung dalam rangkaian ini ialah Daud. Terjemahan deskriptif menyatakan makna historisnya dan tetap membiarkan resonansi kerajaan-mesianiknya terbuka.
- issue: Apakah נְאֻם harus secara eksplisit disebut sebagai firman ilahi
  choice: pernyataan
  alternative: sabda; tuturan ilahi
  rationale: Kata tersebut memang merupakan penanda formal yang lazim dalam ujaran profetis, tetapi di sini Daud disebut sebagai penuturnya. "Pernyataan" tidak menghapus kekhidmatannya dan juga tidak secara tersurat menambahkan sumber ilahi yang tidak disebut dalam frasa itu sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk puitis disusun dalam baris-baris pendek untuk mempertahankan struktur gelar yang sejajar. Istilah yang terlalu teknis seperti "orakel" dihindari dari teks utama, sedangkan ambiguitas penting dijaga melalui catatan kaki.
