  text: ה֣וּא קָם֩ וַ/יַּ֨ךְ בַּ/פְּלִשְׁתִּ֜ים עַ֣ד כִּֽי יָגְעָ֣ה יָד֗/וֹ וַ/תִּדְבַּ֤ק יָד/וֹ֙ אֶל הַ/חֶ֔רֶב וַ/יַּ֧עַשׂ יְהוָ֛ה תְּשׁוּעָ֥ה גְדוֹלָ֖ה בַּ/יּ֣וֹם הַ/ה֑וּא וְ/הָ/עָ֛ם יָשֻׁ֥בוּ אַחֲרָ֖י/ו אַךְ לְ/פַשֵּֽׁט׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/010.yaml
  text: He rose and struck down the Philistines until his hand grew weary and his hand clung to the sword[a]. And Yahweh brought about a great victory on that day[b], and the people returned after him only to strip the slain.
translation:
  language: id
  text: Ia bangkit dan menghantam orang-orang Filistin sampai tangannya menjadi letih, lalu tangannya melekat pada pedang. Pada hari itu Yahweh memberikan kemenangan besar[a]. Orang-orang itu kembali mengikutinya, hanya untuk melucuti orang-orang yang tewas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan besar” atau “keselamatan besar”. Istilah Ibrani ini dapat menunjuk secara luas pada tindakan penyelamatan; di sini konteksnya adalah tindakan pembebasan Yahweh yang menentukan dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, menanggalkan senjata, perlengkapan, dan barang berharga dari mereka yang gugur sesudah pertempuran.
    reason: cultural_note
lexical_decisions:
- source_word: קָם
  choice: bangkit
  rationale: Dalam narasi pertempuran, bentuk ini menandai tindakan tegas; “bangkit” ringkas dan tetap dekat dengan gambaran Ibrani.
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים
  choice: menghantam orang-orang Filistin
  rationale: נכה dalam konteks militer berarti memukul atau menyerang dengan hebat dan sering kali mematikan. “Menghantam” mempertahankan daya ungkap tanpa menyatakan secara eksplisit bahwa setiap orang yang diserang tewas.
- source_word: עַד כִּי יָגְעָה יָדוֹ
  choice: sampai tangannya letih
  rationale: יגע menyatakan keletihan atau kehabisan tenaga; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tangan sebagai subjek sebagaimana dalam teks sumber.
- source_word: וַתִּדְבַּק יָדוֹ אֶל הַחֶרֶב
  choice: tangannya ... melekat pada pedang
  rationale: דבק berarti melekat atau berpaut erat. “Melekat” mempertahankan gambaran yang hidup tanpa memaksakan penjelasan medis mengenai keadaan tangannya.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahweh memberikan
  rationale: Dengan objek abstrak תְּשׁוּעָה, עשה menyatakan bahwa Yahweh menghasilkan atau mewujudkan hasil tersebut. “Memberikan” merupakan ungkapan Indonesia yang alami dan tetap menegaskan tindakan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar, sesuai bentuk nama yang terdapat dalam teks Ibrani.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: kemenangan besar
  rationale: תְּשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. Dalam konteks pertempuran ini, “kemenangan” menyampaikan hasil konkretnya, sementara catatan kaki mempertahankan jangkauan makna yang lebih luas.
- source_word: וְהָעָם יָשֻׁבוּ אַחֲרָיו
  choice: Rakyat kembali menyusul dia
  rationale: Frasa ini menunjukkan bahwa orang banyak kembali mengikuti atau mendatangi sang pahlawan sesudah tindakannya. “Kembali menyusul dia” alami dalam bahasa Indonesia dan tidak menambahkan identitas militer yang tidak dinyatakan secara eksplisit.
- source_word: אַךְ לְפַשֵּׁט
  choice: hanya untuk melucuti orang-orang yang tewas
  rationale: Dalam konteks sesudah pertempuran, פשט menunjuk pada penanggalan senjata, perlengkapan, atau barang dari mereka yang gugur. “Melucuti” menyampaikan tindakan itu dengan tepat, sedangkan “hanya” mempertahankan pembatasan אַךְ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna תְּשׁוּעָה dalam narasi pertempuran
  choice: kemenangan
  alternative: pembebasan atau keselamatan
  rationale: Konteks langsung menunjuk pada kemenangan militer, tetapi istilah Ibrani memiliki cakupan lebih luas. Karena itu, teks utama memakai “kemenangan” dan catatan kaki mempertahankan alternatif leksikal serta nuansa tindakan penyelamatan oleh Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur Ibrani yang menonjolkan tangan dipertahankan, tetapi pengulangan posesif diringankan agar alami. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
