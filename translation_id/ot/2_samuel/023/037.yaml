base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/037.yaml
  text: Zelek the Ammonite[a], Naharai the Beerothite, armor-bearer of Joab son of Zeruiah;
translation:
  language: id
  text: Zelek, orang Amon; Naharai, orang Beerot, pembawa senjata Yoab anak Zeruya;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶלֶק
  choice: Zelek
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָעַמֹּנִי
  choice: orang Amon
  rationale: Adjektiva nisbah ini menunjukkan asal kebangsaan Zelek; 'orang Amon' merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: נַחְרַי
  choice: Naharai
  rationale: Nama diri ditransliterasikan dengan mempertahankan vokalisasi Masoret.
- source_word: הַבְּאֵרֹתִי
  choice: orang Beerot
  rationale: Bentuk nisbah geografis dari Beerot diterjemahkan secara alami sebagai 'orang Beerot'.
- source_word: נשאי כְּלֵי
  choice: pembawa senjata
  rationale: Frasa partisipial ini secara harfiah menunjuk orang yang membawa perlengkapan atau senjata; dalam konteks militer, 'pembawa senjata' jelas dan tidak mempersempit makna כְּלֵי hanya menjadi baju zirah.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Yoab anak Zeruya
  rationale: Identifikasi kekerabatan dipertahankan secara langsung dan ringkas sesuai gaya daftar Ibrani.
