  text: Hezro the Carmelite[a], Paarai the Arbite[c][b];
translation:
  language: id
  text: Hezro, orang Karmel[a]; Paarai, orang Arbi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Karmel di sini adalah nama tempat; yang dimaksud ialah orang yang berasal dari Karmel, bukan anggota tarekat Karmelit yang muncul kemudian.
    reason: cultural_note
  - marker: b
    text: Atau, “orang dari Arab”; Arab mungkin nama sebuah tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: חצרו
  choice: Hezro
  rationale: Nama diri dalam daftar para kesatria Daud; ditransliterasikan menurut bentuk Ibrani bermasoret. Bentuk ini juga lazim dalam tradisi nama Alkitab Indonesia.
- source_word: הַכַּרְמְלִי
  choice: orang Karmel
  rationale: Kata nisbah berartikel yang menunjukkan asal dari Karmel. Ungkapan ini lebih jelas dan alami dalam bahasa Indonesia daripada bentuk 'orang Karmeli', serta tidak menimbulkan asosiasi dengan tarekat Karmelit yang muncul jauh kemudian.
- source_word: פַּעֲרַי
  choice: Paarai
  rationale: Nama diri ditransliterasikan; 'Paarai' mempertahankan urutan bunyi dan vokal yang tercermin dalam penandaan Masoret.
- source_word: הָאַרְבִּי
  choice: orang Arab
  rationale: Kata nisbah berartikel, kemungkinan besar menunjukkan asal dari sebuah tempat bernama Arab. Dalam konteks ini 'Arab' adalah nama tempat; catatan kaki mencegah pembaca menyamakannya begitu saja dengan sebutan etnis modern.
