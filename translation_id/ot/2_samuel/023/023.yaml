  text: He was honored among the thirty[a], but he did not attain to the three[c][b]; and David appointed him over his bodyguard.
translation:
  language: id
  text: Ia lebih terhormat daripada ketiga puluh orang itu[a], tetapi tidak mencapai kedudukan ketiga orang itu[b]. Daud menempatkannya sebagai kepala pengawalnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia dihormati di antara ketiga puluh orang itu.” Susunan bahasa Ibrani juga dapat dipahami sebagai penempatan di dalam kelompok tersebut, bukan secara komparatif.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tetapi ia tidak sampai kepada ketiga orang itu,” yaitu tidak mencapai kedudukan kelompok elit yang terdiri dari tiga pahlawan.'
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani: “kepada mishmaath-nya.” Istilah ini dapat berarti “kepada perintah atau wewenangnya” atau “atas pengawalnya.” Terjemahan “kepala pengawalnya” mengikuti kemungkinan makna militer dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלֹשִׁים נִכְבָּד
  choice: dihormati di antara ketiga puluh orang
  rationale: Bentuk pasif נִכְבָּד menyatakan bahwa ia dihormati atau disegani. מִן dapat menunjukkan kedudukan di dalam kelompok, meskipun pembacaan komparatif juga mungkin dan dicatat dalam catatan kaki.
- source_word: וְאֶל הַשְּׁלֹשָׁה לֹא בָא
  choice: tetapi tidak mencapai kedudukan ketiga orang itu
  rationale: Secara harfiah ungkapan ini berarti 'tidak sampai kepada ketiganya'; dalam konteks daftar para pahlawan, maksudnya ialah bahwa ia tidak mencapai tingkat kelompok elit yang terdiri dari tiga orang.
- source_word: וַיְשִׂמֵהוּ דָוִד
  choice: Daud mengangkatnya
  rationale: שׂים secara dasar berarti menaruh atau menempatkan, tetapi dalam konteks penugasan jabatan paling wajar diterjemahkan 'mengangkat'.
- source_word: אֶל מִשְׁמַעְתּוֹ
  choice: untuk mengepalai pengawalnya
  rationale: מִשְׁמַעַת dapat merujuk pada perintah, kewenangan, atau orang-orang yang berada di bawah perintah. Konteks militer mendukung arti pengawal, tetapi ketidakpastian leksikal dipertahankan dalam catatan kaki.
