translation:
  language: id
  text: Abi-Albon, orang Arbat[a]; Azmawet, orang Barhum[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Abialbon” sebagai satu nama tanpa tanda hubung.
    reason: lexical_alternative
  - marker: b
    text: “Barhum” mengikuti Teks Masoretik; sebagian menghubungkan sebutan ini dengan Bahurim dan menerjemahkannya “orang Bahurim.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֲבִי עַלְבוֹן
  choice: Abi-Albon
  rationale: Nama diri ditransliterasikan. Bentuk dua unsur dipertahankan dengan tanda hubung, selaras dengan pemisahan grafis dalam teks Masoret, meskipun dapat pula ditulis sebagai satu kata.
- source_word: הָעַרְבָתִי
  choice: orang Arbat
  rationale: Bentuk nisbah berartikel yang menunjukkan asal atau keterkaitan dengan suatu tempat. Ungkapan alami bahasa Indonesia 'orang Arbat' mempertahankan sebutan geografis tanpa memastikan identifikasi tempat yang tidak pasti.
- source_word: עַזְמָוֶת
  choice: Azmawet
  rationale: Nama diri ditransliterasikan dengan bentuk yang mudah dibaca dalam bahasa Indonesia; waw direpresentasikan sebagai w dan taw tanpa dages sebagai t.
- source_word: הַבַּרְחֻמִי
  choice: orang Barhum
  rationale: Bentuk nisbah berartikel diterjemahkan secara alami sebagai penanda asal. 'Barhum' mengikuti bentuk dan vokalisasi Teks Masoret, tanpa diam-diam menyamakannya dengan Bahurim.
