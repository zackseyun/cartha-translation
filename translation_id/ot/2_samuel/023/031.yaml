translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Sebutan nisbah Ibrani dialihkan menjadi 'orang + nama tempat', bentuk yang lebih alami bagi pembaca Indonesia daripada akhiran transliterasi seperti '-i' atau padanan Inggris '-ite'. Ejaan nama mengikuti kebiasaan fonetis Indonesia sejauh tidak mengaburkan bentuk sumber.
