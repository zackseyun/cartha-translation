base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/011.yaml
  text: After him was Shammah son of Agee the Hararite. The Philistines gathered together at Lehi[a], where there was a plot of ground full of lentils, and the people fled from before the Philistines.
translation:
  language: id
  text: Sesudah dia, ada Sama anak Age, orang Harari. Orang Filistin berkumpul untuk bertempur[a]. Di sana ada sebidang ladang yang penuh lentil, dan orang-orang itu melarikan diri dari hadapan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani לַחַיָּה sulit dipastikan. Ungkapan itu mungkin berarti “untuk bertempur”; ada pula yang memahaminya sebagai “menuju suatu pasukan/kelompok” atau sebagai nama tempat, “di Lehi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Mempertahankan penghubung urutan yang ringkas dalam daftar para kesatria tanpa menambahkan verba yang tidak dinyatakan dalam bahasa Ibrani.
- source_word: שַׁמָּא בֶן־אָגֵא הָרָרִי
  choice: Sama anak Age, orang Harari
  rationale: Nama-nama ditransliterasikan secara wajar dalam bahasa Indonesia, sedangkan הָרָרִי dipertahankan sebagai sebutan asal atau kelompok, bukan ditafsirkan menjadi 'orang pegunungan'.
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Menyampaikan tindakan berhimpun secara alami dan tepat dalam konteks militer.
- source_word: לַחַיָּה
  choice: untuk bertempur
  rationale: Ungkapan Ibrani ini sulit. Dalam konteks serangan Filistin, pilihan ini menyampaikan kemungkinan fungsi militernya tanpa menjadikan kata tersebut nama tempat yang tidak pasti.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sebidang ladang
  rationale: Menyampaikan sebidang atau petak lahan secara konkret dan alami dalam bahasa Indonesia.
- source_word: מְלֵאָה עֲדָשִׁים
  choice: penuh dengan tanaman lentil
  rationale: Mengikuti gambaran harfiah 'penuh dengan lentil'; kata 'tanaman' memperjelas bahwa yang dimaksud ialah tanaman yang tumbuh di ladang, bukan lentil olahan.
- source_word: וְהָעָם
  choice: rakyat
  rationale: Mempertahankan arti umum עָם tanpa mempersempitnya secara tidak pasti menjadi pasukan Israel.
- source_word: נָס מִפְּנֵי
  choice: melarikan diri dari hadapan
  rationale: Mempertahankan idiom Ibrani dengan ungkapan Indonesia yang formal dan masih mudah dipahami.
