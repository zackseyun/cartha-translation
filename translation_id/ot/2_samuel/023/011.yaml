    rationale: מְלֵאָה עֲדָשִׁים secara harfiah berarti “penuh lentil.” Dalam konteks ladang, tanaman memang tersirat, tetapi penambahan itu tidak diperlukan.
  - severity: low
    issue: Alternatif catatan kaki “menjadi satu pasukan” kurang tepat
    rationale: Alternatif tersebut terdengar sebagai hasil tindakan “berkumpul,” bukan sebagai kemungkinan makna frasa לַחַיָּה. Catatan perlu menyebut kemungkinan “menuju suatu pasukan/kelompok” dan pembacaan nama tempat Lehi secara lebih netral.
