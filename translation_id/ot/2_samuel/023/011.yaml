  to: Sesudah dia, ada Sama anak Age, orang Harari. Orang Filistin berkumpul untuk bertempur[a]. Di sana ada sebidang ladang yang penuh lentil, dan orang-orang itu melarikan diri dari hadapan orang Filistin.
