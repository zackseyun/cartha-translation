    issue: “Rakyat” untuk וְהָעָם
    rationale: Istilah ini dapat menyiratkan warga sipil atau rakyat suatu negara. Ibrani עָם di sini tidak menentukan secara sempit apakah yang dimaksud pasukan atau orang-orang Israel yang hadir; “orang-orang itu” mempertahankan keluasan tersebut.
  - severity: low
