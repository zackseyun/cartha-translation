base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/017.yaml
  text: And he said[a], “Far be it from me, O Yahweh, that I should do this! Is it not the blood of the men who went at the risk of their lives?” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: id
  text: Ia berkata, “Jangan sekali-kali aku melakukan hal ini, ya Yahweh! Bukankah ini darah orang-orang yang pergi dengan mempertaruhkan nyawa mereka?[a]” Maka ia tidak mau meminumnya. Itulah yang dilakukan ketiga orang perkasa itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang pergi dengan nyawa mereka,” yaitu dengan menghadapi bahaya maut.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Bukankah ini darah orang-orang yang pergi dengan nyawa mereka?” Daud memperlakukan air itu seolah-olah darah mereka karena mereka mendapatkannya dengan mempertaruhkan nyawa.
    reason: alternative_reading
lexical_decisions:
- source_word: חָלִילָה לִּי יְהוָה
  choice: Jauhlah kiranya dariku, ya Yahweh
  rationale: Ungkapan חָלִילָה menyatakan penolakan atau kejijikan moral yang kuat. Bentuk ini mempertahankan seruan langsung kepada Yahweh tanpa mengubahnya menjadi permohonan agar Allah mencegah tindakan tersebut.
- source_word: מֵעֲשֹׂתִי זֹאת
  choice: untuk melakukan hal ini
  rationale: Preposisi מִן dengan infinitif sesudah חָלִילָה menyatakan penolakan untuk melakukan tindakan itu; bentuk Indonesia ini dekat dengan struktur sumber dan tetap alami.
- source_word: הֲדַם הָאֲנָשִׁים
  choice: Bukankah ini darah orang-orang
  rationale: Prefiks interogatif הֲ dipertahankan sebagai pertanyaan retoris. Kata “ini” dijelaskan oleh konteks sebagai air yang diperlakukan Daud seolah-olah darah mereka.
- source_word: בְּנַפְשׁוֹתָם
  choice: dengan mempertaruhkan nyawa mereka
  rationale: Secara harfiah berarti “dengan nyawa mereka”; dalam konteks, ungkapan ini menunjukkan bahwa mereka pergi dalam bahaya maut.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Maka ia tidak mau meminumnya
  rationale: אָבָה menyatakan kemauan atau persetujuan. “Tidak mau” mempertahankan nuansa itu, sedangkan “meminumnya” secara alami merujuk kepada air.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ketiga orang perkasa itu
  rationale: גִּבֹּרִים menunjuk kepada para pejuang unggulan Daud. “Orang perkasa” mempertahankan cakupan istilah Ibrani tanpa memasukkan gambaran khusus seperti kesatria.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama pribadi ilahi, bukan gelar. Transliterasi “Yahweh” mempertahankan nama tersebut.
- issue: Air diperlakukan sebagai darah para pejuang
  choice: Bukankah ini darah orang-orang
  alternative: Darahkah orang-orang ini?; Haruskah aku meminum darah orang-orang ini?
  rationale: Pertanyaan retoris yang ringkas dipertahankan tanpa menambahkan kata kerja “meminum” yang tidak terdapat dalam teks Masoret ayat ini. Kata “ini” disuplai secara wajar dari konteks, sambil mencatat bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Ungkapan “Jauhlah kiranya dariku” mempertahankan kekuatan penolakan dalam bahasa Ibrani, sedangkan “tidak mau” menyampaikan nuansa kemauan dalam אָבָה. Semua penanda catatan kaki muncul dalam teks utama.
