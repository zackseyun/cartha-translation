  text: And David longed and said[a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: id
  text: Daud diliputi kerinduan, lalu berkata,[a] “Siapa yang akan memberi aku minum air dari sumur Betlehem yang ada di dekat pintu gerbang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih dinamis, “Ah, seandainya ada yang memberi aku minum air dari sumur Betlehem di dekat pintu gerbang!” Bahasa Ibrani memakai pertanyaan “Siapa yang akan ...?” sebagai ungkapan kerinduan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַוֶּה
  choice: sangat ingin minum
  rationale: Bentuk hitpael dari אוה menyatakan hasrat yang kuat. Dalam konteks ini, objek hasrat dijelaskan oleh ucapan berikutnya, sehingga ‘sangat ingin minum’ terdengar alami dalam bahasa Indonesia dan tetap menyampaikan kekuatan emosinya.
- source_word: וַיֹּאמַר
  choice: berkata
  rationale: Kata kerja ini adalah verba umum untuk ‘berkata’. Teks Ibrani tidak secara eksplisit menyatakan ‘berkata dalam hati’ atau ‘berseru’, sehingga terjemahan sederhana dipertahankan.
- source_word: מִי
  choice: Siapa yang mau
  rationale: Kata tanya ‘siapa?’ di sini berfungsi sebagai ungkapan kerinduan atau harapan. ‘Siapa yang mau’ mempertahankan bentuk pertanyaan dalam bahasa Indonesia tanpa mengubahnya langsung menjadi seruan pengandaian.
- source_word: יַשְׁקֵנִי
  choice: memberiku air untuk diminum
  rationale: Bentuk hiphil dari שקה berarti memberi seseorang minum atau menyebabkan seseorang minum. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kausatifnya.
- source_word: מַיִם
  choice: air
  rationale: Padanan leksikal langsung dan wajar dalam konteks.
- source_word: מִבֹּאר
  choice: dari sumur
  rationale: בְּאֵר lazimnya menunjuk pada sumur, bukan perigi penampung atau waduk air.
- source_word: בֵּית לֶחֶם
  choice: Betlehem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: אֲשֶׁר בַּשָּׁעַר
  choice: yang ada di dekat pintu gerbang
  rationale: Frasa ini mengidentifikasi sumur yang berhubungan dengan pintu gerbang kota. ‘Di dekat pintu gerbang’ jelas dan alami, sekaligus menghindari kesan bahwa sumur itu berada di dalam struktur gerbang.
