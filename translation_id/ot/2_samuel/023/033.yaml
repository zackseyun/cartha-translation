  rationale: Nama diri Ibrani ditransliterasikan dengan penyesuaian ejaan Indonesia.
- source_word: הָאֲרָרִי
  choice: orang Arar
  rationale: Bentuk konsonantal teks Masoret mendukung Arar, bukan Harar; perbedaannya dipertahankan dan tidak diselaraskan dengan sebutan sebelumnya.
