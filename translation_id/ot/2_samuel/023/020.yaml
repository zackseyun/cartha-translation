  text: וּ/בְנָיָ֨הוּ בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חי רַב פְּעָלִ֖ים מִֽ/קַּבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת ה/אריה בְּ/ת֥וֹךְ הַ/בֹּ֖אר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/020.yaml
  text: And Benaiah son of Jehoiada[a], son of a valiant man, great in deeds, from Kabzeel—he struck down the two sons of Ariel of Moab, and he went down and struck down the lion in the midst of the pit on a snowy day.
translation:
  language: id
  text: Benaia anak Yoyada berasal dari Kabzeel. Ia adalah putra seorang gagah perkasa dan banyak melakukan perbuatan besar. Ia mengalahkan kedua Ariel[a] dari Moab. Ia juga turun ke dalam sebuah lubang dan mengalahkan seekor singa di dalamnya pada hari bersalju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani אֲרִאֵל (’ariel) di sini tidak pasti. Kata ini mungkin berarti “orang-orang seperti singa” atau “para pahlawan”, atau mungkin merupakan gelar atau nama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חי
  choice: seorang gagah perkasa
  rationale: Dalam konteks daftar para pahlawan, ungkapan ini paling wajar dipahami sebagai sebutan bagi orang yang kuat dan berani, bukan sekadar orang yang hidup.
- source_word: רַב פְּעָלִים
  choice: yang termasyhur karena perbuatan-perbuatannya
  rationale: Ungkapan ini menyatakan bahwa orang tersebut dikenal karena banyak tindakan atau prestasi besar. Pilihan ini alami dalam bahasa Indonesia dan tidak membatasi maknanya pada satu jenis tindakan tertentu.
- source_word: מִקַּבְצְאֵל
  choice: dari Kabzeel
  rationale: Preposisi מִן menunjukkan asal tempat, sehingga diterjemahkan secara langsung dengan 'dari'.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam rangkaian kisah kepahlawanan ini, נכה menyatakan tindakan memukul atau menyerang hingga lawan tewas. 'Menewaskan' menyampaikan hasil tindakan secara alami dalam bahasa Indonesia.
- source_word: שְׁנֵי אֲרִאֵל מוֹאָב
  choice: kedua Ariel dari Moab
  rationale: Makna אֲרִאֵל di sini tidak pasti. Transliterasi mempertahankan ketidakpastian teks tanpa memaksakan arti 'pahlawan', 'orang seperti singa', atau nama diri.
- source_word: יָרַד
  choice: turun ke dalam
  rationale: Kata kerja ini berarti 'turun'; tambahan 'ke dalam' dibuat eksplisit karena tujuannya adalah lubang yang disebut sesudahnya.
- source_word: הָאֲרִי
  choice: seekor singa
  rationale: Kata benda ini dengan jelas menunjuk kepada singa. Dalam bahasa Indonesia, 'seekor' adalah bentuk alami ketika hewan itu pertama kali diperkenalkan dalam kisah.
- source_word: בְּתוֹךְ הַבּוֹר
  choice: di dalam sebuah lubang ... di sana
  rationale: בּוֹר dapat berarti lubang atau sumur penampung. 'Lubang' mempertahankan arti yang lebih luas, sedangkan susunan kalimat Indonesia menghindari frasa yang kaku.
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: pada hari bersalju
  rationale: Ini menyampaikan latar waktu secara ringkas dan alami sambil mempertahankan penyebutan salju.
