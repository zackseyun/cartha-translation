  text: אֵ֛לֶּה שְׁמ֥וֹת הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑ד יֹשֵׁ֨ב בַּשֶּׁ֜בֶת תַּחְכְּמֹנִ֣י רֹ֣אשׁ הַ/שָּׁלִשִׁ֗י ה֚וּא עֲדִינ֣/וֹ ה/עצנ/ו עַל שְׁמֹנֶ֥ה מֵא֛וֹת חָלָ֖ל בְּ/פַ֥עַם אחד׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/008.yaml
  text: 'These are the names of the mighty men who belonged to David: Josheb-basshebeth[a], a Tahkemonite, chief of the Three. He was Adino the Eznite[c][b], who wielded his spear against eight hundred slain at one time.'
translation:
  language: id
  text: 'Inilah nama para pahlawan yang menyertai Daud: Yosheb-Basyebet[a], orang Tahkemoni, kepala Tiga Orang.[b] Dialah Adino, orang Ezni,[c] yang mengayunkan tombaknya terhadap delapan ratus orang hingga mereka tewas dalam satu kesempatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani ayat ini sulit. “Yosheb-Basyebet” mengikuti Teks Masoret; bagian yang sejajar dalam 1 Tawarikh 11:11 berbunyi “Yasobam, orang Hakhmoni.”
    reason: textual_variant
  - marker: b
    text: Atau “kepala tiga puluh orang,” menurut beberapa saksi kuno dan penafsir; Teks Masoret berbunyi “kepala Tiga Orang.”
    reason: alternative_reading
  - marker: c
    text: Teks Ibrani berbunyi “Adino, orang Ezni,” suatu frasa yang sangat sulit. Banyak orang memahaminya sebagai ungkapan seperti “ia mengayunkan tombaknya” atau “ia mengacungkan tombaknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּבֹּרִים
  choice: para pahlawan
  rationale: Dalam daftar pasukan elite ini, kata tersebut menunjuk kepada para pejuang perkasa. 'Para pahlawan' alami dalam bahasa Indonesia dan tetap memuat gagasan keberanian serta keperkasaan.
- source_word: אֲשֶׁר לְדָוִד
  choice: yang menyertai Daud
  rationale: Preposisi לְ menandai hubungan dengan Daud. Pilihan ini menyatakan bahwa mereka tergabung dalam kelompok Daud tanpa memberi kesan kepemilikan harfiah.
- source_word: יֹשֵׁב בַּשֶּׁבֶת
  choice: Yosheb-Basyebet
  rationale: Bentuk Teks Masoret sangat sulit, tetapi dalam konteks ini dapat dipertahankan sebagai nama diri. Bentuk yang berbeda dalam 1 Tawarikh 11:11 dicatat dalam catatan kaki, bukan dimasukkan diam-diam ke teks utama.
- source_word: תַּחְכְּמֹנִי
  choice: orang Tahkemoni
  rationale: Sebutan asal-usul atau kaum ini diterjemahkan dengan transliterasi yang wajar dalam bahasa Indonesia.
- source_word: רֹאשׁ הַשָּׁלִשִׁי
  choice: kepala dari Ketiga Orang itu
  rationale: Pilihan ini mengikuti vokalisasi Masoret yang paling langsung, yakni pemimpin kelompok tiga pahlawan elite, sambil mencatat bacaan alternatif 'tiga puluh orang'.
- source_word: עֲדִינוֹ הָעֶצְנוֹ
  choice: Adino, orang Ezni
  rationale: Frasa Ibrani ini sangat sukar. Mempertahankannya sebagai nama dan sebutan mengikuti bentuk Teks Masoret serta menghindari perbaikan teks yang bersifat dugaan; kemungkinan makna verbal dicatat dalam catatan kaki.
- source_word: עַל שְׁמֹנֶה מֵאוֹת חָלָל
  choice: menghadapi delapan ratus orang tewas
  rationale: עַל menyatakan tindakan bermusuhan terhadap mereka, sedangkan חָלָל berarti orang-orang yang terbunuh atau tewas. Susunan ini mempertahankan hasil mematikan dari pertempuran tersebut.
- source_word: בְּפַעַם אֶחָד
  choice: dalam satu pertempuran
  rationale: Ungkapan ini secara harfiah menunjuk satu kali atau satu kesempatan. Dalam konteks militer, 'dalam satu pertempuran' menyampaikan maksudnya secara alami tanpa mengubah jumlah kejadian.
- source_word: הוּא
  choice: Dialah
  rationale: Kata ganti mandiri ini menegaskan identifikasi tokoh yang baru disebut dan menghasilkan hubungan antarklausa yang jelas dalam bahasa Indonesia.
