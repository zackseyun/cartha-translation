  yaml_path: translation/ot/2_samuel/023/019.yaml
  text: Was he not more honored than the three? So he became their commander[b][a], but he did not attain to the three.
translation:
  language: id
  text: Bukankah ia lebih dihormati daripada ketiga orang itu?[a] Maka ia menjadi komandan mereka. Namun, ia tidak mencapai kedudukan ketiga orang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bukankah ia dihormati di antara ketiga orang itu?” Frasa Ibraninya dapat dipahami tanpa perbandingan, tetapi pengertian komparatif lebih sesuai dengan susunan kalimat dan bagian paralel dalam konteks ini.'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ia tidak mencapai pangkat atau kedudukan “ketiga orang itu”, yaitu golongan tertinggi di antara para kesatria Daud.
    reason: cultural_note
lexical_decisions:
- source_word: מִן הַשְּׁלֹשָׁה
  choice: daripada ketiga orang itu
  rationale: Preposisi מִן setelah נִכְבָּד paling wajar dipahami secara komparatif, yakni membandingkan kehormatan tokoh ini dengan kelompok yang dikenal sebagai “ketiga orang itu”.
- source_word: הֲכִי
  choice: Bukankah ia
  rationale: Gabungan partikel tanya הֲ dan כִּי membentuk pertanyaan retoris yang mengharapkan jawaban ya; “Bukankah” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: נִכְבָּד
  choice: lebih dihormati
  rationale: Bentuk Niphal dari כבד di sini menyatakan bahwa seseorang dipandang terhormat atau memiliki kehormatan. “Lebih dihormati” sesuai dengan konstruksi komparatif ayat ini.
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: Maka ia menjadi komandan mereka
  rationale: שַׂר dapat berarti pemimpin, kepala, atau panglima. Dalam konteks para kesatria, “komandan” merupakan padanan militer yang jelas dan modern.
- source_word: וְעַד הַשְּׁלֹשָׁה לֹא בָא
  choice: Namun, ia tidak mencapai kedudukan ketiga orang itu
  rationale: Ungkapan ini secara harfiah berbicara tentang tidak sampai kepada ketiga orang itu, tetapi dalam konteks pemeringkatan kesatria maksudnya ialah tidak mencapai kedudukan mereka. Penambahan “kedudukan” memperjelas idiom tanpa menghapus citra mencapai suatu tingkat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ketiga orang itu” mempertahankan rujukan kepada kelompok khusus dalam konteks, sedangkan “komandan” menyampaikan nuansa militer שַׂר secara alami.
