  text: וַ/יִּתְיַצֵּ֤ב בְּ/תוֹךְ הַֽ/חֶלְקָה֙ וַ/יַּצִּילֶ֔/הָ וַ/יַּ֖ךְ אֶת פְּלִשְׁתִּ֑ים וַ/יַּ֥עַשׂ יְהוָ֖ה תְּשׁוּעָ֥ה גְדוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/012.yaml
  text: But he took his stand in the middle of the field and defended it[a], and struck down the Philistines; and Yahweh brought about a great victory.
translation:
  language: id
  text: Namun, ia berdiri teguh di tengah ladang itu dan mempertahankannya. Ia mengalahkan orang-orang Filistin, dan Yahweh mendatangkan kemenangan besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembebasan besar” atau “keselamatan besar”. Istilah Ibrani ini dapat memiliki makna-makna tersebut; dalam konteks ini, istilah itu merujuk pada tindakan penyelamatan Yahweh dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצֵּב
  choice: ia berdiri teguh
  rationale: Bentuk Hitpael dari יצב menggambarkan tindakan sengaja mengambil posisi dan tetap bertahan; “berdiri teguh” alami dalam bahasa Indonesia serta sesuai dengan konteks pertempuran.
- source_word: בְּתוֹךְ הַחֶלְקָה
  choice: di tengah ladang itu
  rationale: חֶלְקָה menunjuk pada sebidang tanah; “ladang” jelas dan alami dalam konteks ini, sementara בְּתוֹךְ diterjemahkan “di tengah”.
- source_word: וַיַּצִּילֶהָ
  choice: mempertahankannya
  rationale: נצל lazim berarti menyelamatkan atau melepaskan. Akhiran feminin merujuk pada ladang itu; dalam konteks serangan musuh, “mempertahankannya” menyampaikan tindakan menyelamatkan ladang dari perebutan.
- source_word: וַיַּךְ אֶת־פְּלִשְׁתִּים
  choice: mengalahkan orang-orang Filistin
  rationale: נכה dalam konteks perang dapat berarti memukul, menewaskan, atau mengalahkan. “Mengalahkan” menyampaikan hasil serangan tanpa menentukan bahwa setiap orang Filistin dibunuh.
- source_word: וַיַּעַשׂ יְהוָה
  choice: Yahweh mendatangkan
  rationale: עשה dengan objek abstrak תְּשׁוּעָה secara idiomatis berarti menghasilkan atau mewujudkan; “mendatangkan” mempertahankan Yahweh sebagai pelaku kemenangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: kemenangan besar
  rationale: תְּשׁוּעָה dapat berarti keselamatan, pembebasan, atau kemenangan. Dalam kisah pertempuran ini, “kemenangan besar” paling langsung menyatakan makna kontekstualnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna תְּשׁוּעָה dalam konteks pertempuran
  choice: kemenangan
  alternative: pembebasan atau keselamatan
  rationale: Konteks langsungnya adalah kekalahan orang Filistin, sehingga “kemenangan” merupakan padanan paling alami. Catatan kaki mempertahankan cakupan makna Ibraninya dan penekanan bahwa tindakan penyelamatan berasal dari Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. “Ia” menjaga alur narasi, sedangkan “orang-orang Filistin” merupakan bentuk lazim bagi nama bangsa. Dua kalimat dipakai agar rangkaian tindakan tokoh dan tindakan penentu Yahweh terbaca jelas tanpa mengubah hubungan logis teks.
