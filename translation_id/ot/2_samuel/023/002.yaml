  text: ר֥וּחַ יְהוָ֖ה דִּבֶּר בִּ֑/י וּ/מִלָּת֖/וֹ עַל לְשׁוֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/002.yaml
  text: The Spirit of Yahweh spoke by me[a], and his word was on my tongue.
translation:
  language: id
  text: Roh Yahweh berbicara melalui aku[a], dan firman-Nya ada pada lidahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berbicara di dalam aku”; preposisi Ibrani di sini juga dapat menyatakan perantaraan atau sarana.
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֥וּחַ יְהוָ֖ה
  choice: Roh Yahweh
  rationale: Dalam konteks perkataan nubuat yang diilhamkan, רוּחַ paling tepat berarti “Roh,” bukan “angin” atau “napas.” Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: דִּבֶּר בִּי
  choice: berbicara melalui aku
  rationale: דִּבֶּר berarti “berbicara,” sedangkan בִּי di sini paling wajar menyatakan perantaraan atau sarana. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan bahwa David menjadi perantara perkataan ilahi.
- source_word: וּמִלָּתוֹ
  choice: dan firman-Nya
  rationale: מִלָּה berarti “kata,” “ucapan,” atau “firman.” “Firman” mempertahankan bobot konteks perkataan ilahi tanpa memperluasnya menjadi sekadar pesan.
- source_word: עַל לְשׁוֹנִי
  choice: ada pada lidahku
  rationale: Terjemahan ini mempertahankan gambaran Ibrani “pada/di atas lidahku” dengan susunan yang dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna רוּחַ dalam konteks perkataan nubuat
  choice: Roh
  alternative: napas; angin
  rationale: Konteks menyatakan tindakan ilahi dalam berbicara melalui David, sehingga “Roh” paling sesuai, tanpa menambahkan rumusan doktrinal yang tidak dinyatakan ayat ini.
- issue: Nuansa preposisi בְּ pada בִּי
  choice: melalui aku
  alternative: di dalam aku; dengan perantaraanku
  rationale: Preposisi ini dapat memiliki beberapa fungsi. Dalam paralel dengan firman yang ada pada lidah David, nuansa instrumental atau perantaraan paling kuat; catatan kaki mempertahankan alternatif yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Melalui aku” dipilih karena lebih alami daripada “dengan perantaraanku,” sedangkan “pada lidahku” sengaja mempertahankan citra puitis teks Ibrani.
