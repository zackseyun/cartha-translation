  text: אֶלְיַחְבָּא֙ הַ/שַּׁ֣עַלְבֹנִ֔י בְּנֵ֥י יָשֵׁ֖ן יְהוֹנָתָֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/032.yaml
  text: Elyahba the Shaalbonite[a], the sons of Jashen, Jonathan.
translation:
  language: id
  text: Elyahba, orang Saalbon[a], anak-anak Yasyen, Yonatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini ringkas dan sulit; secara harfiah, “Elyahba, orang Saalbon, anak-anak Yasyen, Yonatan.” Sebagian penafsir menganggap ada ketidakteraturan tekstual lalu menyusun daftar ini secara berbeda, misalnya dengan memahami “Yonatan” sebagai salah seorang dari “anak-anak Yasyen.” Terjemahan ini mempertahankan susunan teks Ibrani yang diwariskan dan tidak memperbaikinya berdasarkan dugaan.
    reason: textual_variant
lexical_decisions:
- source_word: אֶלְיַחְבָּא
  choice: Elyahba
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani, dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: הַשַּׁעַלְבֹנִי
  choice: orang Syʹalbon
  rationale: Bentuk nisbah dengan kata sandang menunjukkan orang yang berasal dari Syʹalbon/Syaalbim; ungkapan 'orang Syʹalbon' alami dalam bahasa Indonesia dan mempertahankan kaitan dengan nama tempat.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak konstruksi dari 'anak laki-laki/anak'; diterjemahkan secara transparan sebagai bentuk jamak agar kesulitan susunan teks Ibrani tidak dilenyapkan.
- source_word: יָשֵׁן
  choice: Yasyen
  rationale: Dipahami sebagai nama diri dalam rangkaian konstruksi 'anak-anak Yasyen' dan tidak diemendasi.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Nama diri memakai bentuk Indonesia yang lazim dan dekat dengan bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan nama sengaja tetap terasa janggal karena teks sumber sendiri ringkas dan sulit. Penanda aksen pada Syʹalbon membantu mencegah pembacaan rangkaian 'syaa' yang kurang jelas.
