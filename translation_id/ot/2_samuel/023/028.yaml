lexical_decisions:
- source_word: צַלְמוֹן
  choice: Zalmon
  rationale: Nama diri ditransliterasikan sebagai Zalmon, mengikuti bentuk konsonantal Ibrani dan padanan yang lazim untuk tokoh ini.
- source_word: הָאֲחֹחִי
  choice: orang Ahoah
  rationale: Bentuk nisbah dengan kata sandang menunjukkan hubungan dengan Ahoah, kemungkinan sebagai kaum atau keturunan. Ungkapan 'orang Ahoah' terdengar alami dalam daftar nama Indonesia tanpa mempersempit hubungan itu secara berlebihan.
- source_word: מַהְרַי
  choice: Maharai
  rationale: Nama diri ditransliterasikan menurut bentuk Ibraninya.
- source_word: הַנְּטֹפָתִי
  choice: orang Netofa
  rationale: Bentuk nisbah dengan kata sandang menunjukkan asal atau keterkaitan dengan Netofa. 'Orang Netofa' ringkas, alami, dan mempertahankan gaya daftar.
