  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבְקְעוּ֩ שְׁלֹ֨שֶׁת הַ/גִּבֹּרִ֜ים בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בֹּ֤אר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑ד וְ/לֹ֤א אָבָה֙ לִ/שְׁתּוֹתָ֔/ם וַ/יַּסֵּ֥ךְ אֹתָ֖/ם לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/016.yaml
  text: Then the three mighty men broke through the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But he was not willing to drink it; instead[b], he poured it out to Yahweh.
translation:
  language: id
  text: Ketiga prajurit gagah perkasa itu lalu menerobos perkemahan orang Filistin, menimba air dari sumur di Betlehem yang ada di gerbang, lalu membawanya kepada Daud. Namun, Daud tidak mau meminumnya[a]. Sebaliknya, ia mencurahkan air itu untuk TUHAN[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meminum mereka.” Bahasa Ibrani memakai akhiran jamak, yang kemungkinan merujuk pada air sebagai “air-air.”
    reason: lexical_alternative
  - marker: b
    text: Pencurahan ini ditujukan untuk TUHAN dan bernuansa persembahan curahan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: menerobos
  rationale: Kata kerja ini menggambarkan tindakan menembus pertahanan atau posisi lawan; “menerobos” menyampaikan daya paksa dan konteks militernya secara alami.
- source_word: שְׁלֹשֶׁת הַגִּבֹּרִים
  choice: ketiga kesatria itu
  rationale: גִּבּוֹרִים menunjuk kepada para pejuang utama Daud. “Kesatria” mempertahankan nuansa kelompok pejuang unggulan dengan bahasa Indonesia yang ringkas dan bermartabat.
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: perkemahan orang Filistin
  rationale: Frasa ini merujuk pada perkemahan militer milik orang Filistin; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: menimba air
  rationale: Kata kerja שׁאב lazim dipakai untuk mengambil air dari sumur; “menimba air” adalah padanan konkret dan idiomatis.
- source_word: מִבֹּאר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: dari sumur Betlehem yang berada di dekat gerbang
  rationale: Terjemahan ini mempertahankan kaitan sumur tersebut dengan Betlehem dan lokasi gerbang. “Di dekat gerbang” menyampaikan fungsi lokatif בַּשַּׁעַר tanpa memaksakan apakah sumur tepat pada atau hanya di sisi gerbang.
- source_word: וַיִּשְׂאוּ וַיָּבִאוּ אֶל דָּוִד
  choice: lalu membawa air itu kepada Daud
  rationale: Dua verba berurutan menyatakan bahwa air itu diangkat atau dibawa lalu disampaikan kepada Daud. Dalam bahasa Indonesia, satu rangkaian “membawa ... kepada” mengungkapkan tindakan itu secara alami tanpa menambah gagasan “kembali” yang tidak dinyatakan.
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: Daud tidak mau meminumnya
  rationale: אָבָה menyatakan kemauan atau persetujuan, sehingga “tidak mau” mempertahankan unsur kehendak. Air secara alami diperlakukan sebagai benda tunggal dalam bahasa Indonesia, sedangkan bentuk jamak Ibrani dijelaskan dalam catatan kaki.
- source_word: וַיַּסֵּךְ אֹתָם
  choice: ia mencurahkan air itu
  rationale: נסך berarti mencurahkan cairan dan dalam konteks ini memiliki gema persembahan curahan. Teks utama mempertahankan tindakan konkretnya, sementara catatan kaki menjelaskan nuansa ritualnya.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi ל menandai bahwa pencurahan itu ditujukan atau dipersembahkan kepada TUHAN. Nama ilahi יהוה ditampilkan sebagai “TUHAN” sesuai konvensi terjemahan.
theological_decisions:
- issue: Sifat tindakan Daud ketika mencurahkan air
  choice: Pencurahan harfiah yang didedikasikan kepada TUHAN dan mengandung nuansa persembahan curahan
  alternative: Sekadar membuang air sebagai tanda bahwa Daud menolak meminumnya, tanpa makna ritual
  rationale: Kata kerja נסך kerap dipakai untuk pencurahan yang bersifat ritual, dan frasa “bagi TUHAN” menguatkan unsur dedikasi. Namun, teks utama tidak menyebutnya secara tegas sebagai jenis korban tertentu; karena itu nuansa persembahan dijelaskan dalam catatan kaki tanpa menutup ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kesatria” dipilih untuk sebutan para pejuang unggulan Daud; alur verba diringkas secara alami tanpa menghilangkan tindakan utama. Penanda catatan kaki ditempatkan langsung pada bagian yang dijelaskannya.
