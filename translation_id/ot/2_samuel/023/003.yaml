  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָמַר֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לִ֥/י דִבֶּ֖ר צ֣וּר יִשְׂרָאֵ֑ל מוֹשֵׁל֙ בָּ/אָדָ֔ם צַדִּ֕יק מוֹשֵׁ֖ל יִרְאַ֥ת אֱלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/003.yaml
  text: 'The God of Israel has spoken[a]; the Rock of Israel has said to me: One who rules over mankind justly, ruling in the fear of God[b],'
translation:
  language: id
  text: 'Allah Israel telah berfirman;

    Gunung Batu Israel telah berkata kepadaku:

    “Orang yang memerintah manusia[a] dengan adil,

    yang memerintah dengan takut akan Allah[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat manusia.” Kata Ibrani אָדָם dapat menunjuk kepada manusia secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Sebagian penafsir memahami baris ini secara mesianik, sebagai gambaran tentang raja ideal.
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: telah berfirman
  rationale: Bentuk perfektif memperkenalkan sabda ilahi yang tetap relevan; “berfirman” wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi yang menamai Allah yang disembah Israel; bentuk ini alami dalam bahasa Indonesia.
- source_word: לִי דִבֶּר
  choice: telah berkata kepadaku
  rationale: לִי paling alami dipahami sebagai penerima perkataan, yaitu Daud; “mengenai aku” mungkin secara gramatikal dalam konteks tertentu, tetapi kurang mungkin di sini.
- source_word: צוּר יִשְׂרָאֵל
  choice: Gunung Batu Israel
  rationale: Mempertahankan metafora dan gelar ilahi צוּר, yang menyiratkan keteguhan dan perlindungan, tanpa memparafrasakannya.
- source_word: מוֹשֵׁל
  choice: orang yang memerintah
  rationale: Partisipel dipakai secara umum untuk menggambarkan siapa pun yang menjalankan pemerintahan, bukan semata-mata menyebut jabatan tertentu.
- source_word: בָּאָדָם
  choice: manusia
  rationale: אָדָם di sini bersifat kolektif dan menunjuk kepada manusia sebagai pihak yang diperintah; pilihan ini inklusif dan alami dalam bahasa Indonesia.
- source_word: צַדִּיק
  choice: dengan adil
  rationale: Walaupun secara bentuk merupakan kata sifat “adil/benar”, dalam baris puitis yang padat ini kata tersebut paling alami berfungsi menerangkan cara memerintah.
- source_word: מוֹשֵׁל יִרְאַת אֱלֹהִים
  choice: yang memerintah dengan takut akan Allah
  rationale: Mengikuti frasa partisipial kedua yang menjelaskan penguasa ideal dan mempertahankan ungkapan teologis “takut akan Allah” sebagai sikap hormat serta pertanggungjawaban di hadapan-Nya.
theological_decisions:
- issue: Pembacaan kerajaan umum atau mesianik
  choice: Teks utama menyajikannya sebagai gambaran umum tentang penguasa ideal tanpa secara eksplisit menyebut Mesias.
  alternative: Baris ini dapat dipahami memiliki makna mesianik dan pada akhirnya digenapi dalam Mesias.
  rationale: Bahasa Ibrani menyatakan prinsip tentang pemerintahan yang adil dan takut akan Allah tanpa secara eksplisit mengidentifikasi tokohnya sebagai Mesias; catatan kaki mempertahankan kemungkinan makna mesianik tanpa memaksakannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puitis dipertahankan melalui dua verba ujaran dan dua frasa “yang memerintah”. “Gunung Batu Israel” mempertahankan metafora ilahi sumber, sedangkan “takut akan Allah” memakai ungkapan teologis Indonesia yang lazim tanpa mempersempit maknanya.
