  text: Helez the Paltite[a], Ira son of Ikkesh the Tekoite;
translation:
  language: id
  text: Helez, orang Palti[a]; Ira anak Ikesh, orang Tekoa;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin "orang Peloni" menurut beberapa tradisi penerjemahan; teks Ibrani di sini paling wajar dibaca "orang Palti".
    reason: alternative_reading
lexical_decisions:
- source_word: חֶלֶץ
  choice: Helez
  rationale: Nama diri ditransliterasikan dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: הַפַּלְטִי
  choice: orang Palti
  rationale: Bentuk nisbah dengan kata sandang yang menunjukkan asal atau hubungan kelompok; 'orang Palti' secara alami mencerminkan bentuk Ibrani dalam bahasa Indonesia.
- source_word: עִירָא
  choice: Ira
  rationale: Nama diri ditransliterasikan; bentuk 'Ira' sudah alami dan dekat dengan pelafalan Ibrani.
- source_word: בֶן
  choice: anak
  rationale: Penanda hubungan keturunan; dalam daftar nama bahasa Indonesia, 'anak' merupakan padanan ringkas dan alami untuk 'putra dari'.
- source_word: עִקֵּשׁ
  choice: Ikesh
  rationale: Nama diri ditransliterasikan dengan 'sh' Ibrani direpresentasikan sebagai 'sy' tidak diperlukan menurut bentuk nama Indonesia yang ringkas; 'Ikesh' mempertahankan pengenalan bentuk tradisional.
- source_word: הַתְּקוֹעִי
  choice: orang Tekoa
  rationale: Bentuk nisbah yang menunjukkan asal dari Tekoa; ungkapan 'orang Tekoa' lebih alami daripada membentuk demonim yang tidak lazim dalam bahasa Indonesia.
