  text: These things Benaiah son of Jehoiada did[b][a], and he had a name among the three mighty men.
translation:
  language: id
  text: Hal-hal inilah yang dilakukan Benaya bin Yoyada, dan ia ternama[a] di antara ketiga pahlawan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan baginya ada nama,” yang berarti ia mempunyai nama besar; yakni, ia terkenal.'
    reason: lexical_alternative
  - marker: b
    text: Sebagian penafsir memahami ayat ini berdasarkan daftar para pejuang Daud yang lebih luas dan membandingkannya dengan bacaan “ketiga puluh”; teks Ibrani di sini berbunyi “ketiga”.
    reason: textual_variant
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: Hal-hal inilah yang dilakukan
  rationale: Kata penunjuk אֵלֶּה merujuk kembali kepada berbagai tindakan kepahlawanan yang baru diceritakan, sedangkan עָשָׂה berarti 'melakukan'. Susunan ini alami dalam bahasa Indonesia dan mempertahankan fungsi rangkumannya.
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya bin Yoyada
  rationale: Nama-nama ditransliterasikan ke bentuk yang lazim dalam Alkitab bahasa Indonesia; בֶּן menyatakan hubungan 'anak laki-laki dari' dan diterjemahkan secara ringkas dengan 'bin'.
- source_word: וְלוֹ שֵׁם
  choice: dan ia ternama
  rationale: Ungkapan Ibrani ini secara harfiah berarti 'dan baginya ada nama', yakni ia memiliki nama baik atau kemasyhuran. 'Ia ternama' menyampaikan makna idiomatisnya secara wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בִּשְׁלֹשָׁה הַגִּבֹּרִים
  choice: di antara ketiga pahlawan itu
  rationale: Teks WLC berbunyi 'di antara ketiga pahlawan'. Kata גִּבֹּרִים dalam konteks ini menunjuk kepada para kesatria atau pejuang unggulan Daud; 'pahlawan' merupakan padanan Indonesia yang alami dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan Ibrani tentang memiliki 'nama' diterjemahkan secara idiomatis dalam teks utama, sementara bentuk harfiahnya dipertahankan dalam catatan. Penanda catatan ditempatkan setelah klausa-klausa yang dijelaskannya.
