base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/029.yaml
  text: Heleb son of Baanah the Netophathite[a], Ittai son of Ribai from Gibeah of the sons of Benjamin;
translation:
  language: id
  text: Heleb bin Baana, orang Netofa; Itai bin Ribai, dari Gibea milik bani Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari Gibea bani Benyamin.”'
    reason: Menjelaskan konstruksi Ibrani yang secara harfiah menghubungkan Gibea dengan bani Benyamin, sementara teks utama mengungkapkan hubungan itu secara alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: חֵלֶב
  choice: Heleb
  rationale: Nama diri ditransliterasikan dalam bentuk yang jelas dan sesuai dengan kebiasaan ejaan nama Ibrani dalam bahasa Indonesia.
- source_word: בֶּן
  choice: bin
  rationale: Dalam daftar nama laki-laki, “bin” secara ringkas dan alami menyatakan hubungan “anak laki-laki dari” dalam bahasa Indonesia.
- source_word: בַּעֲנָה
  choice: Baana
  rationale: Nama diri ditransliterasikan tanpa akhiran h yang tidak dibunyikan dalam ejaan Indonesia.
- source_word: הַנְּטֹפָתִי
  choice: orang Netofa
  rationale: Bentuk nisbah ini menunjukkan asal atau keterkaitan dengan Netofa; ungkapan “orang Netofa” lebih alami daripada membentuk kata sifat etnis yang asing dalam bahasa Indonesia.
- source_word: אִתַּי
  choice: Itai
  rationale: Transliterasi yang alami dalam ejaan Indonesia, dengan konsonan rangkap Ibrani tidak perlu dipertahankan.
- source_word: רִיבַי
  choice: Ribai
  rationale: Nama diri ditransliterasikan secara langsung dan mudah dibaca.
- source_word: מִגִּבְעַת
  choice: dari Gibea
  rationale: Preposisi מִן menyatakan asal, sehingga “dari” mempertahankan makna sumber atau tempat asal.
- source_word: בְּנֵי בִנְיָמִן
  choice: kota suku Benyamin
  rationale: Secara harfiah berarti “anak-anak Benyamin,” tetapi dalam konteks geografis ungkapan ini mengidentifikasi Gibea sebagai kota yang terkait dengan suku Benyamin. Penambahan “kota” memperjelas hubungan sintaksis tanpa mengubah acuannya.
