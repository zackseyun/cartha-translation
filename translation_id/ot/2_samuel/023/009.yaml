  to: Sesudah dia, ada Eleazar anak Dodo,[a] anak Ahohi, salah satu dari tiga pejuang yang bersama Daud ketika mereka mencela orang Filistin yang telah berkumpul di sana untuk berperang, dan orang-orang Israel telah naik.[b]
