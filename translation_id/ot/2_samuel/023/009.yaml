  text: ו/אחר/ו אֶלְעָזָ֥ר בֶּן דדי בֶּן אֲחֹחִ֑י בִּ/שְׁלֹשָׁ֨ה גברים עִם דָּוִ֗ד בְּ/חָֽרְפָ֤/ם בַּ/פְּלִשְׁתִּים נֶאֶסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/009.yaml
  text: And after him was Eleazar son of Dodo[a], son of Ahohi, among the three mighty men with David, when they taunted the Philistines who had gathered there for battle[c][b], and the men of Israel had gone up.
translation:
  language: id
  text: Sesudah dia, ada Eleazar anak Dodo,[a] anak Ahohi, salah satu dari tiga pejuang yang bersama Daud ketika mereka mencela orang Filistin yang telah berkumpul di sana untuk berperang, dan orang-orang Israel telah naik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak Dodai, seorang Ahohi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang-orang Israel telah naik”; dalam konteks ini, ungkapan itu mungkin berarti bahwa mereka telah mundur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/אחר/ו
  choice: Sesudah dia, ada
  rationale: Mengantar tokoh berikutnya dalam urutan para kesatria; kata “ada” melengkapi klausa pengenalan yang tidak memiliki verba eksplisit dalam bahasa Ibrani.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: בֶּן דדי בֶּן אֲחֹחִי
  choice: anak Dodo, anak Ahohi
  rationale: Mempertahankan pembacaan unsur-unsur tersebut sebagai nama pribadi atau nama leluhur, sambil mencatat pembacaan alternatif dalam catatan kaki.
- source_word: בִּ/שְׁלֹשָׁה גברים
  choice: termasuk ketiga kesatria
  rationale: Menunjukkan keanggotaan Eleazar dalam kelompok tiga pejuang terkemuka; “kesatria” menyampaikan nuansa kepahlawanan militer גברים secara wajar.
- source_word: עִם דָּוִד
  choice: yang bersama Daud
  rationale: Menyatakan hubungan atau kebersamaan dengan Daud secara langsung.
- source_word: בְּ/חָֽרְפָם
  choice: ketika mereka mencela
  rationale: חרף pada dasarnya menyatakan tindakan mencela, menghina, atau menantang dengan celaan. “Mencela” mempertahankan inti maknanya tanpa mempersempitnya menjadi tindakan militer semata.
- source_word: בַּ/פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Padanan baku bagi nama bangsa tersebut dalam bahasa Indonesia.
- source_word: נֶאֶסְפוּ שָׁם לַ/מִּלְחָמָה
  choice: yang telah berkumpul di sana untuk berperang
  rationale: Bentuk Nifal menyatakan bahwa orang Filistin telah berkumpul; klausa relatif memperjelas acuannya secara alami.
- source_word: וַֽ/יַּעֲל֖וּ אִ֥ישׁ יִשְׂרָאֵֽל
  choice: sedangkan pasukan Israel telah pergi
  rationale: אישׁ יִשְׂרָאֵל dipahami secara kolektif sebagai pasukan Israel. עלה secara harfiah berarti “naik”, tetapi dalam konteks pertempuran dapat menyatakan kepergian atau mundurnya pasukan; “pergi” menjaga keluasan makna dan catatan kaki mempertahankan arti harfiahnya.
