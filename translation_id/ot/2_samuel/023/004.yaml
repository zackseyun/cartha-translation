  text: וּ/כְ/א֥וֹר בֹּ֖קֶר יִזְרַח שָׁ֑מֶשׁ בֹּ֚קֶר לֹ֣א עָב֔וֹת מִ/נֹּ֥גַהּ מִ/מָּטָ֖ר דֶּ֥שֶׁא מֵ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/023/004.yaml
  text: he is like the light of morning when the sun rises[a], a morning without clouds; from brightness, from rain[b], grass from the earth.
translation:
  language: id
  text: Ia seperti cahaya pagi ketika matahari terbit,[a] pagi tanpa awan; oleh sinar cerah sesudah hujan, rumput muda tumbuh dari bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan seperti cahaya pagi.” Baris Ibrani ini tidak menyebutkan subjek secara tersurat dan melanjutkan gambaran tentang penguasa dalam ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari kecemerlangan, dari hujan, rumput dari bumi.” Bahasa Ibrani di sini merupakan gambaran puitis yang padat tentang tumbuhan baru yang muncul sesudah hujan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְאוֹר
  choice: Ia seperti cahaya
  rationale: Gabungan konjungsi dan kata pembanding membuka perumpamaan yang melanjutkan gambaran tentang penguasa dalam ayat sebelumnya. Subjek “Ia” ditambahkan agar hubungan itu jelas dalam bahasa Indonesia.
- source_word: בֹּקֶר
  choice: pagi
  rationale: “Pagi” merupakan padanan umum dan alami, serta mempertahankan pengulangan puitis pada kedua kemunculannya.
- source_word: יִזְרַח שָׁמֶשׁ
  choice: ketika matahari terbit
  rationale: Kata kerja יזרח dapat menyatakan matahari yang terbit atau memancarkan sinarnya; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan gambaran waktu pagi.
- source_word: בֹּקֶר לֹא עָבוֹת
  choice: pagi tanpa awan
  rationale: Terjemahan ini mempertahankan bentuk gambaran Ibrani dengan susunan yang wajar dan ringkas.
- source_word: מִנֹּגַהּ
  choice: oleh sinar cerah
  rationale: נֹגַהּ berarti cahaya atau kecemerlangan. “Oleh” menyampaikan hubungan sarana atau sebab yang mungkin dimaksudkan, sementara catatan kaki mempertahankan kepadatan dan ketaksaan preposisi Ibraninya.
- source_word: מִמָּטָר
  choice: sesudah hujan
  rationale: Secara harfiah bentuk ini memakai preposisi מִן, tetapi dalam gambaran alam tersebut hujan mendahului munculnya tumbuhan. “Sesudah hujan” menyampaikan urutan gambaran secara alami tanpa menganggap struktur puitisnya sepenuhnya pasti.
- source_word: דֶּשֶׁא
  choice: rumput muda
  rationale: דֶּשֶׁא menunjuk pada rerumputan atau tumbuhan hijau yang baru tumbuh; “rumput muda” mempertahankan nuansa pertumbuhan segar.
- source_word: מֵאָרֶץ
  choice: dari bumi
  rationale: Ungkapan ini mempertahankan sumber tempat rumput muncul sekaligus menjaga nada puitis.
theological_decisions:
- issue: Subjek tersirat dalam perumpamaan
  choice: Subjek “Ia” dinyatakan sebagai penguasa benar yang dibicarakan dalam ayat 3.
  alternative: 'Membiarkannya sebagai fragmen impersonal: “Dan seperti cahaya pagi …”'
  rationale: Bahasa Ibrani bersifat eliptis, tetapi konteks langsung menunjukkan bahwa gambaran ini melanjutkan uraian tentang penguasa. Penambahan subjek hanya memperjelas hubungan sintaksis dan tidak menambahkan identifikasi teologis baru.
- issue: Hubungan unsur-unsur pada bagian akhir ayat
  choice: Bagian akhir disajikan sebagai rumput muda yang tumbuh dalam cahaya cerah sesudah hujan.
  alternative: 'Menerjemahkan secara sangat harfiah: “dari kecemerlangan, dari hujan, rumput dari bumi.”'
  rationale: Teks Ibrani sangat padat dan hubungan preposisionalnya dapat dipahami dengan lebih dari satu cara. Teks utama menyampaikan gambaran alam secara terbaca, sedangkan catatan kaki mempertahankan bentuk harfiah dan ketaksaan aslinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum, sementara elipsis dan ketaksaan pada bagian akhir dijelaskan dalam catatan kaki.
