lexical_decisions:
- source_word: בְּנָיָהוּ
  choice: Benaya
  rationale: Nama diri Ibrani disesuaikan dengan bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: פִּרְעָתֹנִי
  choice: orang Piraton
  rationale: Adjektiva nisbah ini menunjukkan asal Benaya; bahasa Indonesia secara alami menyatakannya dengan 'orang Piraton'.
- source_word: הִדַּי
  choice: Hidai
  rationale: Nama diri ditransliterasikan dari bacaan Teks Masoret kitab Samuel tanpa menggantinya dengan bentuk pada ayat paralel.
- source_word: מִנַּחֲלֵי
  choice: dari lembah-lembah sungai di
  rationale: נַחַל dapat menunjuk alur sungai musiman, jurang, atau lembah berair. 'Lembah-lembah sungai' jelas bagi pembaca Indonesia dan mempertahankan ciri geografisnya.
- source_word: גָעַשׁ
  choice: Gaas
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
