  text: Asahel the brother of Joab was among the Thirty[a]; Elhanan son of Dodo of Bethlehem.
translation:
  language: id
  text: Asael, saudara Yoab, termasuk dalam kelompok Tiga Puluh; Elhanan, anak Dodo[a], dari Betlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: “anak Dodo”; bagian sejajarnya dalam 1 Tawarikh 11:26 berbunyi “Dodai”.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲשָׂה אֵל
  choice: Asael
  rationale: Nama diri עֲשָׂהאֵל ditulis terpisah dalam teks ini, tetapi dikenali sebagai nama Asael; bentuk Indonesia mengikuti ejaan nama Alkitab yang lazim.
- source_word: אֲחִי יוֹאָב
  choice: saudara Yoab
  rationale: Rangkaian konstruksi ini menyatakan hubungan keluarga secara langsung dan alami dalam bahasa Indonesia.
- source_word: בַּשְּׁלֹשִׁים
  choice: termasuk dalam kelompok Tiga Puluh
  rationale: Preposisi ב dengan sebutan bilangan tertentu menunjukkan keanggotaan Asael dalam kelompok para kesatria yang dikenal sebagai Tiga Puluh.
- source_word: אֶלְחָנָן
  choice: Elhanan
  rationale: Nama diri ini dialihaksarakan dengan bentuk Indonesia yang lazim.
- source_word: בֶּן דֹּדֹו
  choice: anak Dodo
  rationale: Teks Masoret berbunyi דֹּדֹו, yang paling wajar dipahami sebagai nama diri Dodo; bentuk berbeda dalam bagian sejajar dicatat tanpa menyelaraskan teks utama.
- source_word: בֵּית לָחֶם
  choice: dari Betlehem
  rationale: Nama tempat ini menerangkan asal Elhanan; ungkapan 'dari Betlehem' jelas dan alami dalam konteks daftar nama.
