  text: David was then in the stronghold[a], and the garrison of the Philistines was then at Bethlehem.
translation:
  language: id
  text: Daud pada waktu itu berada di kubu pertahanan, dan garnisun Filistin pada waktu itu berada di Betlehem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: pada waktu itu
  rationale: Keterangan waktu ini muncul dua kali dalam teks Ibrani. Pengulangannya dipertahankan untuk menyampaikan pembingkaian waktu dan kesejajaran kedua klausa.
- source_word: מְצוּדָה
  choice: kubu pertahanan
  rationale: Ungkapan ini menyampaikan tempat berlindung yang kokoh dan dapat dipertahankan tanpa menentukan bentuk bangunannya secara berlebihan.
- source_word: מַצַּב
  choice: pasukan penjaga
  rationale: Dalam konteks militer ini, kata tersebut menunjuk pada pasukan yang ditempatkan untuk menjaga atau menguasai suatu lokasi; pilihan ini lebih mudah dipahami daripada istilah teknis yang sempit.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dalam bahasa Indonesia untuk kelompok bangsa ini.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Mempertahankan koordinasi langsung antara kedua klausa sebagaimana dalam teks Ibrani.
