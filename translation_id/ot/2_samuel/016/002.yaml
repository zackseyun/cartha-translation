translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Susunan daftar dibuat lancar tanpa menghilangkan hubungan tujuan pada setiap kelompok barang. Catatan kaki mempertahankan ambiguitas נְעָרִים yang dapat menunjuk usia maupun peran sosial.
