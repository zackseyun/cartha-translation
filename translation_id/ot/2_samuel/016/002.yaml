base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/002.yaml
  text: Then the king said to Ziba[a], “What are these for?” And Ziba said, “The donkeys are for the king’s household to ride on, and the bread and summer fruit are for the young men to eat[c][b], and the wine is for the weary in the wilderness to drink.”
translation:
  language: id
  text: Lalu raja bertanya kepada Ziba, “Untuk apa semua ini?” Ziba menjawab, “Keledai-keledai ini untuk ditunggangi oleh orang-orang di rumah tangga raja, roti dan buah-buahan musim panas untuk dimakan oleh orang-orang muda,[a] dan anggur untuk diminum oleh orang yang kelelahan di padang belantara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para pengiring” atau “para pelayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֵלֶּה לָּךְ
  choice: Untuk apa semua ini?
  rationale: Ungkapan Ibrani harfiah berbunyi ‘Apa ini bagimu/untukmu?’ Dalam konteks ini raja menanyakan kegunaan barang-barang yang dibawa Ziba; terjemahan ini alami dan tetap mempertahankan maksud pertanyaannya.
- source_word: הַחֲמוֹרִים
  choice: keledai-keledai ini
  rationale: Padanan Indonesia modern yang langsung untuk bentuk jamak tertentu tersebut; ‘ini’ memperjelas bahwa Ziba menunjuk barang-barang yang baru ditanyakan.
- source_word: לְבֵית הַמֶּלֶךְ
  choice: oleh keluarga raja
  rationale: בֵּית dapat merujuk pada rumah tangga atau rombongan milik raja, bukan bangunan. ‘Keluarga raja’ mudah dipahami, meskipun cakupannya dapat meliputi para anggota rumah tangga kerajaan.
- source_word: לִרְכֹּב
  choice: untuk ditunggangi
  rationale: Infinitif tujuan diterjemahkan secara idiomatis dalam bentuk pasif karena keledai menjadi sarana tunggangan bagi keluarga raja.
- source_word: הַלֶּחֶם
  choice: roti
  rationale: Mempertahankan arti leksikal biasa dan tidak memperluasnya menjadi ‘makanan’, sebab bahan makanan lain disebut tersendiri.
- source_word: הַקַּיִץ
  choice: buah-buahan musim panas
  rationale: Istilah ini menunjuk buah atau hasil bumi yang dipanen pada musim panas; bentuk umum dipertahankan karena jenis buahnya tidak dinyatakan.
- source_word: הַנְּעָרִים
  choice: orang-orang muda
  rationale: Mempertahankan arti dasar bentuk jamak ini tanpa memastikan bahwa mereka adalah pelayan, walaupun dalam konteks istilah tersebut dapat menunjuk para pengiring atau pelayan muda.
- source_word: הַיָּעֵף
  choice: orang yang kelelahan
  rationale: Kata sifat tunggal dengan artikel dapat berfungsi secara generik. Bentuk Indonesia ini mempertahankan ungkapan tunggal kolektif tanpa mengubahnya menjadi ‘siapa pun yang menjadi lelah’.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar atau tandus dan tidak harus berupa gurun pasir; ‘padang belantara’ sesuai dengan latar pelarian Daud.
