  naturalness: Bahasa naratifnya baku, jelas, dan alami. “Orang-orang di rumah tangga raja” lebih tepat daripada “keluarga raja” dan tetap wajar dalam Bahasa Indonesia modern.
  terminology: “Keledai,” “roti,” “buah-buahan musim panas,” “orang-orang muda,” dan “padang belantara” merupakan padanan yang dapat dipertahankan. Catatan kaki untuk נְעָרִים sebaiknya tidak membatasi alternatifnya pada “pelayan muda,” karena istilah Ibrani itu dapat menunjuk pengiring atau pelayan tanpa secara eksplisit menegaskan usia mereka.
