base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/018.yaml
  text: Hushai said to Absalom[a], “No, for the one whom Yahweh and this people and all the men of Israel have chosen—I will be his[c][b], and with him I will remain.”
translation:
  language: id
  text: Husai berkata kepada Absalom, “Tidak, sebab aku akan menjadi milik orang yang telah dipilih oleh Yahweh, bangsa ini, dan setiap laki-laki Israel[a], dan aku akan tetap bersamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Menurut qere, “baginya,” yang dalam konteks ini diterjemahkan “milik orang yang dipilih.” Ketiv berbunyi “tidak,” sehingga secara harfiah menghasilkan “aku tidak akan menjadi.”
    reason: textual_variant
lexical_decisions:
- source_word: לֹא כִּי
  choice: Tidak!
  rationale: Ungkapan ini membuka sanggahan tegas, lalu diikuti penjelasan. Tanda seru menghasilkan bentuk Indonesia yang alami tanpa harus menambahkan kata penghubung yang tidak mutlak diperlukan.
- source_word: אֲשֶׁר בָּחַר
  choice: orang yang telah dipilih
  rationale: Klausa relatif menunjuk kepada seseorang yang sedang dibicarakan, tetapi tetap mempertahankan keluwesan ucapan Husai tentang siapa orang itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְהָעָם הַזֶּה
  choice: rakyat ini
  rationale: Kata kolektif עָם beserta penunjuk tunggal הַזֶּה diterjemahkan secara alami sebagai 'rakyat ini'.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: dan semua orang Israel
  rationale: Ungkapan distributif harfiah 'setiap laki-laki Israel' dalam konteks politik menunjuk kepada keseluruhan orang Israel; 'semua orang Israel' alami dalam bahasa Indonesia dan tidak mempersempitnya secara tidak perlu.
- source_word: לא אֶהְיֶה
  choice: aku akan menjadi miliknya[a]
  rationale: Bacaan qere memahami לו, 'baginya/miliknya', dan cocok dengan konteks pernyataan kesetiaan. Catatan kaki mempertahankan bacaan tertulis לא yang menghasilkan kesulitan tekstual.
- source_word: וְאִתּוֹ אֵשֵׁב
  choice: dan tetap bersamanya
  rationale: Dalam konteks keterikatan dan pelayanan di istana, יָשַׁב berarti tinggal atau tetap bersama, bukan sekadar duduk.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Ambiguitas kesetiaan Husai
  choice: orang yang telah dipilih ... aku akan menjadi miliknya
  alternative: siapa pun yang dipilih ... aku akan berpihak kepadanya
  rationale: Rumusan sumber memungkinkan perkataan Husai terdengar mendukung Absalom sekaligus tetap dapat mengacu kepada Daud. Terjemahan tidak menyebut salah satu nama dan tidak menghapus ketegangan naratif tersebut.
- issue: Ketidaksesuaian ketiv dan qere pada לא/לו
  choice: mengikuti qere לו dalam teks utama
  alternative: mengikuti ketiv לא, 'aku tidak akan menjadi'
  rationale: Qere memberikan kalimat yang koheren dengan konteks dan tradisi pembacaan Masoret, sedangkan ketiv dicatat agar varian sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama חוּשַׁי ditulis 'Husai' mengikuti bentuk Indonesia yang lazim. Susunan dengan tanda pisah mempertahankan tekanan pada orang yang dipilih dan nuansa retoris ucapan Husai.
