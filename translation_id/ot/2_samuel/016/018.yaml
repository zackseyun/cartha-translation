- from: Husai berkata kepada Absalom, “Tidak! Orang yang telah dipilih oleh Yahweh, rakyat ini, dan semua orang Israel—aku akan menjadi miliknya[a] dan tetap bersamanya.”
  to: Husai berkata kepada Absalom, “Tidak, sebab aku akan menjadi milik orang yang telah dipilih oleh Yahweh, bangsa ini, dan setiap laki-laki Israel[a], dan aku akan tetap bersamanya.”
  rationale: Revisi menyatakan fungsi sanggahan disertai penjelasan dalam לֹא כִּי, mempertahankan sifat distributif-maskulin dari אִישׁ יִשְׂרָאֵל, dan memperjelas perbedaan antara qere לו serta ketiv לא. Orang yang dipilih tetap tidak disebutkan, sehingga ambiguitas naratifnya terpelihara.
