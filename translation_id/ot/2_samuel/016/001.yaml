base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/001.yaml
  text: When David had passed a little beyond the summit[a], behold, Ziba the servant of Mephibosheth was there to meet him, with a pair of saddled donkeys, and on them were two hundred loaves of bread, a hundred clusters of raisins, a hundred summer fruits[c][b], and a skin of wine.
translation:
  language: id
  text: Ketika Daud telah berjalan sedikit melewati puncak[a], tampaklah Ziba, pelayan Mefiboset[b], datang menyambutnya dengan sepasang keledai berpelana. Di atas keledai-keledai itu ada dua ratus roti, seratus tandan kismis, seratus buah musim panas[c], dan sebuah kantong kulit berisi anggur sebagai minuman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedikit lewat dari puncak”. Secara harfiah, bahasa Ibrani berbunyi “sedikit dari kepala”; “kepala” di sini dipakai untuk puncak bukit atau gunung.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “pelayan” juga dapat berarti “pemuda” atau “pendamping”; di sini konteks mendukung peran Ziba sebagai pelayan Mefiboset.
    reason: lexical_alternative
  - marker: c
    text: “Buah musim panas” mungkin secara lebih khusus menunjuk pada buah ara, tetapi istilah Ibraninya lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מֵהָרֹאשׁ
  choice: sedikit melewati puncak itu
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi dalam konteks topografis menunjuk pada puncak bukit atau gunung. Ungkapan ini menyampaikan gerak Daud hingga sedikit di seberang puncak secara alami.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Penanda wacana ini memberi kesan kemunculan mendadak dan menghidupkan adegan; “lihatlah” mempertahankan daya naratif tersebut.
- source_word: נַעַר מְפִי בֹשֶׁת
  choice: pelayan Mefiboset
  rationale: נַעַר dapat berarti “pemuda”, “pelayan”, atau “pendamping”. Hubungan Ziba dengan Mefiboset dalam konteks ini paling wajar dinyatakan sebagai “pelayan”.
- source_word: צֶמֶד חֲמֹרִים
  choice: sepasang keledai
  rationale: צֶמֶד menunjuk pada sepasang hewan, sering kali pasangan yang dipasangkan bersama. “Sepasang keledai” jelas dan tidak menyiratkan secara berlebihan bahwa keduanya sedang menarik kuk.
- source_word: חֲבֻשִׁים
  choice: berpelana
  rationale: Dalam konteks keledai yang telah disiapkan untuk perjalanan dan membawa muatan, bentuk pasif ini paling tepat diterjemahkan “berpelana” daripada “terikat”.
- source_word: מָאתַיִם לֶחֶם
  choice: dua ratus roti
  rationale: Bahasa Indonesia dapat menghitung roti secara langsung tanpa harus menambahkan satuan bentuk yang tidak dinyatakan oleh teks.
- source_word: צִמּוּקִים
  choice: gugus kismis
  rationale: Istilah ini menunjuk pada buah anggur kering yang dihimpun atau dipadatkan. “Gugus kismis” mempertahankan bentuk satuan hitung tanpa mempersempitnya secara pasti menjadi kue kismis.
- source_word: קַיִץ
  choice: buah musim panas
  rationale: Kata ini secara luas berarti hasil buah musim panas, meskipun dalam konteks tertentu dapat secara khusus menunjuk pada buah ara. Terjemahan yang lebih luas mempertahankan cakupan leksikal Ibrani.
- source_word: נֵבֶל יָיִן
  choice: sekantong kulit berisi anggur
  rationale: נֵבֶל di sini adalah wadah dari kulit. Ungkapan ini menjelaskan bahan wadah dan isinya dengan alami dalam bahasa Indonesia.
