  yaml_path: translation/ot/2_samuel/016/006.yaml
  text: And he threw stones at David and at all the servants of King David[a], while all the people and all the mighty men were at his right hand and at his left.
translation:
  language: id
  text: Ia melempari Daud dan semua pelayan Raja Daud dengan batu[a], sementara semua orang dan semua prajurit gagah berada di sebelah kanan dan kirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ia merajam Daud dan semua pelayan Raja Daud.” Namun, dalam konteks ini kata kerja Ibrani itu menggambarkan tindakan melempari mereka dengan batu, bukan pelaksanaan hukuman rajam resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: melempari ... dengan batu
  rationale: Bentuk piel dari סקל bersama בָּאֲבָנִים menyatakan tindakan berulang atau gencar melemparkan batu kepada seseorang. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa hukuman rajam resmi sedang dilaksanakan.
- source_word: עַבְדֵי
  choice: pegawai
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk kepada orang-orang yang melayani raja, termasuk pejabat dan pengiring. 'Pegawai' mempertahankan cakupan umum tersebut tanpa menyiratkan status budak.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gelar serta nama pribadi.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: עַם pada dasarnya berarti 'rakyat' atau 'orang-orang'. Dalam konteks ini, frasa tersebut menunjuk kepada rombongan yang menyertai Daud dan tidak harus dibatasi hanya pada pasukan.
- source_word: הַגִּבֹּרִים
  choice: semua pahlawan
  rationale: גִּבּוֹרִים menunjuk kepada orang-orang gagah atau prajurit perkasa, kemungkinan para pejuang pilihan Daud. 'Pahlawan' merupakan padanan Indonesia yang ringkas dan lazim dalam konteks narasi kerajaan.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: di sebelah kanan dan kiri Daud
  rationale: Akhiran pronominal maskulin tunggal paling wajar merujuk kepada Daud. Nama 'Daud' dinyatakan kembali agar rujukannya jelas dalam bahasa Indonesia, tanpa mengubah makna posisi rombongan di kedua sisinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Melempari ... dengan batu' dipilih untuk menggambarkan serangan secara konkret; 'sementara' memperjelas keadaan rombongan yang mengapit Daud. Penambahan nama Daud pada akhir ayat hanya memperjelas anteseden pronomina Ibrani.
