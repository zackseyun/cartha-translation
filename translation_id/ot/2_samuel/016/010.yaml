base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/010.yaml
  text: But the king said[a], “What have I to do with you, sons of Zeruiah? If he is cursing because Yahweh has said to him, ‘Curse David,’ then who can say, ‘Why have you done so?’”
translation:
  language: id
  text: Namun raja berkata, “Apa urusanku dengan kalian, anak-anak Zeruya? Jika ia mengutuk karena Yahweh telah berfirman kepadanya, ‘Kutukilah Daud,’[a] siapakah yang dapat berkata, ‘Mengapa engkau berbuat demikian?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab ia mengutuk karena Yahweh telah berfirman kepadanya, ‘Kutukilah Daud.’” Partikel-partikel Ibrani di sini juga dapat dipahami sebagai penjelasan, bukan sebagai syarat.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Apa urusanku dengan kalian
  rationale: Ungkapan idiomatis ini menyatakan penolakan atau pengambilan jarak. Bentuk Indonesia ini alami dan mempertahankan nada teguran kepada anak-anak Zeruya.
- source_word: בְּנֵי צְרֻיָה
  choice: anak-anak Zeruya
  rationale: Frasa konstruksi ini mengidentifikasi Yoab dan Abisai melalui ibu mereka; ejaan Zeruya mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יְקַלֵּל / קַלֵּל
  choice: mengutuk / Kutukilah
  rationale: Pilihan ini mempertahankan hubungan leksikal antara tindakan Simei dan perintah yang dikutip, serta sesuai dengan makna celaan berupa kutukan dalam konteks.
- source_word: כִּי ... וְכִי
  choice: Jika ... karena
  rationale: 'Rangkaian partikel Ibrani sulit dan dapat dipahami secara kondisional-kausal: jika ia mengutuk karena Yahweh telah menyuruhnya. Ambiguitas dengan pembacaan eksplanatoris dicatat dalam catatan kaki.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, bukan diganti dengan gelar.
- source_word: אָמַר לוֹ
  choice: telah berfirman kepadanya
  rationale: Bentuk perfektif menunjuk pada firman yang mendahului dan menjelaskan tindakan sekarang. 'Berfirman' merupakan pilihan bermartabat untuk ujaran ilahi tanpa menambah isi.
- source_word: וּמִי יֹאמַר
  choice: siapakah yang dapat berkata
  rationale: Pertanyaan retoris ini menyangkut kewenangan atau kelayakan untuk menggugat, bukan sekadar tindakan berkata pada masa depan.
- source_word: מַדּוּעַ עָשִׂיתָה כֵּן
  choice: Mengapa engkau berbuat demikian?
  rationale: Terjemahan langsung dan alami yang mempertahankan bentuk sapaan tunggal dalam kutipan.
theological_decisions:
- issue: Keterlibatan ilahi dalam kutukan Simei
  choice: Daud menyatakan kemungkinan bahwa Simei mengutuk karena Yahweh telah menyuruhnya
  alternative: 'Memahami klausa secara eksplanatoris dan lebih tegas: ''Sebab ia mengutuk karena Yahweh telah berfirman kepadanya ...'''
  rationale: Teks menyebut firman Yahweh, 'Kutukilah Daud,' tetapi hubungan sintaksis partikel כי dapat dibaca secara kondisional atau eksplanatoris. Terjemahan utama mempertahankan pembingkaian kemungkinan tanpa melemahkannya menjadi sekadar izin ilahi; alternatif dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Kalian' dipakai karena raja menyapa jamak anak-anak Zeruya, sedangkan 'engkau' mempertahankan sapaan tunggal dalam pertanyaan kutipan. Penanda catatan kaki ditempatkan setelah keseluruhan ayat karena menjelaskan konstruksi klausa tengah.
