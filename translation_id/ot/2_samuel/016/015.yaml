  yaml_path: translation/ot/2_samuel/016/015.yaml
  text: Absalom and all the people[a], the men of Israel, came to Jerusalem, and Ahithophel was with him.
translation:
  language: id
  text: Absalom dan seluruh rakyat[a], yaitu orang-orang Israel, tiba di Yerusalem. Ahitofel ada bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh rakyat, setiap orang Israel” atau “seluruh rakyat, orang-orang Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֗וֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim. Waw penghubung tidak perlu ditampilkan sebagai kata pembuka karena alur narasi Indonesia sudah jelas.
- source_word: וְ/כָל הָ/עָם֙ אִ֣ישׁ יִשְׂרָאֵ֔ל
  choice: dan seluruh rakyat[a], yaitu orang-orang Israel
  rationale: עָם diterjemahkan 'rakyat', sedangkan frasa kolektif אִישׁ יִשְׂרָאֵל dipertahankan sebagai aposisi penjelas. 'Orang-orang Israel' alami dalam bahasa Indonesia tanpa mempersempit kelompok itu menjadi tentara.
- source_word: בָּ֖אוּ יְרוּשָׁלִָ֑ם
  choice: tiba di Yerusalem
  rationale: בוא dengan tempat tujuan dapat berarti datang atau tiba; 'tiba di' merupakan ungkapan naratif Indonesia yang alami dan menyatakan tercapainya tujuan.
- source_word: וַ/אֲחִיתֹ֖פֶל אִתּֽ/וֹ
  choice: Ahitofel menyertai dia
  rationale: Klausa Ibrani bersifat eliptis; verba 'menyertai' menyampaikan bahwa Ahitofel berada bersama Absalom. Pronomina 'dia' mempertahankan rujukan kontekstual tanpa menambahkan nama yang tidak diulang dalam sumber.
