base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/003.yaml
  text: Then the king said[a], “And where is your master's son?” Ziba said to the king, “Look, he is staying in Jerusalem, for he said, ‘Today the house of Israel will restore to me the kingdom of my father.’”
translation:
  language: id
  text: Lalu raja berkata, “Dan di manakah anak tuanmu?” Ziba berkata kepada raja, “Lihat, ia masih tinggal[a] di Yerusalem, sebab ia berkata, ‘Hari ini kaum Israel akan mengembalikan kepadaku kerajaan ayahku.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tetap tinggal. Bentuk partisip Ibrani dapat menyatakan bahwa seseorang terus menetap atau tetap berada di suatu tempat, bukan hanya duduk secara harfiah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Bentuk naratif dengan waw-konsekutif melanjutkan urutan peristiwa; “lalu” menghasilkan alur Indonesia yang wajar.
- source_word: וְאַיֵּה
  choice: Dan di manakah
  rationale: Mempertahankan kata penghubung Ibrani serta pertanyaan tentang lokasi.
- source_word: בֶּן אֲדֹנֶיךָ
  choice: anak tuanmu
  rationale: אֲדֹנֶיךָ menunjuk kepada majikan Ziba dalam hubungan sosial, bukan gelar ilahi; “tuanmu” ringkas dan alami.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi deiktis yang menarik perhatian tanpa memakai ungkapan yang arkais.
- source_word: יוֹשֵׁב
  choice: masih tinggal
  rationale: Partisip dari ישׁב dalam konteks ini menyatakan keberadaan yang berlanjut atau tetap berada di suatu tempat, bukan semata-mata posisi duduk.
- source_word: כִּי אָמַר
  choice: sebab ia berkata
  rationale: כִּי memperkenalkan alasan yang Ziba berikan, sedangkan אָמַר membuka kutipan perkataan yang dinisbatkan kepada anak tuannya.
- source_word: יָשִׁיבוּ לִי
  choice: akan mengembalikan kepadaku
  rationale: Bentuk Hifil dari שוב berarti menyebabkan sesuatu kembali; ungkapan ini sesuai dengan objek berupa kerajaan.
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: “Kaum Israel” mempertahankan makna kolektif-nasional dari ungkapan harfiah “rumah Israel” dengan bahasa Indonesia yang alami.
- source_word: מַמְלְכוּת אָבִי
  choice: kerajaan ayahku
  rationale: Mempertahankan hubungan posesif sumber secara jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Perkataan Ziba mengenai motif anak tuannya
  choice: Menerjemahkan tuduhan Ziba secara langsung sebagai perkataan yang ia laporkan, tanpa mengesahkan kebenarannya.
  alternative: Menambahkan penjarakan seperti “menurut pengakuannya” atau “konon ia berkata”.
  rationale: Teks Ibrani hanya melaporkan ucapan Ziba. Menambahkan keraguan atau pengesahan akan mendahului penilaian narasi yang lebih luas dan menghilangkan ketegangan yang ada.
- issue: Identitas “ayahku” dalam kutipan
  choice: Mempertahankan bentuk umum “ayahku”.
  alternative: Memperjelasnya menjadi “kakekku, Saul” berdasarkan silsilah Mefiboset.
  rationale: Teks sumber memakai אָבִי, “ayahku,” yang dapat memakai cakupan leluhur dalam bahasa Ibrani. Terjemahan tidak mengoreksi atau mempersempit ungkapan tersebut berdasarkan konteks genealogis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dialog dibuat alami sambil mempertahankan penghubung, pelaporan berlapis, dan ungkapan kolektif teks Ibrani.
