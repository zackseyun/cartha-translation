  text: And secondly[a], whom should I serve? Should it not be before his son? As I served before your father, so I will be before you.
translation:
  language: id
  text: Kedua, kepada siapakah aku akan mengabdi? Bukankah aku akan mengabdi di hadapan anaknya[a]? Sebagaimana aku mengabdi di hadapan ayahmu, demikianlah aku akan berada di hadapanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi “di hadapan anaknya ... di hadapan ayahmu ... di hadapanmu”; dalam lingkungan istana, ungkapan ini dapat berarti mengabdi di hadapan atau di bawah kekuasaan seorang raja.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַשֵּׁנִית
  choice: Kedua
  rationale: Ungkapan ini berfungsi sebagai penanda wacana yang memperkenalkan alasan kedua; “Kedua” ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: לְמִי אֲנִי אֶעֱבֹד
  choice: kepada siapakah aku harus mengabdi
  rationale: Dalam konteks istana, עבד menyatakan pelayanan dan kesetiaan kepada penguasa. “Mengabdi” menyampaikan nuansa tersebut, sedangkan “harus” menangkap daya pertanyaan retorisnya.
- source_word: הֲלוֹא לִפְנֵי בְנוֹ
  choice: Bukankah di hadapan anaknya
  rationale: “Bukankah” mengisyaratkan jawaban yang diharapkan, sedangkan “di hadapan” mempertahankan לִפְנֵי dan kesejajarannya dengan dua kemunculan berikutnya.
- source_word: כַּאֲשֶׁר עָבַדְתִּי לִפְנֵי אָבִיךָ
  choice: Sebagaimana aku mengabdi di hadapan ayahmu
  rationale: Terjemahan ini mempertahankan perbandingan dan ungkapan istana “di hadapan,” tanpa mengubah konteks politik menjadi pelayanan keagamaan.
- source_word: כֵּן אֶהְיֶה לְפָנֶיךָ
  choice: demikianlah aku akan berada di hadapanmu
  rationale: Teks Ibrani beralih dari עבד, “mengabdi,” kepada היה, “berada/menjadi.” Pilihan ini mempertahankan peralihan kata kerja dan kesejajaran formalnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “siapakah” dan “demikianlah” menjaga nada retoris-istana, sementara pengulangan “di hadapan” mempertahankan pola sumber dan dijelaskan melalui catatan kaki.
