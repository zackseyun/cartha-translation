base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/007.yaml
  text: And Shimei said as he cursed him[a], “Get out, get out[b], man of bloodshed and worthless man!”
translation:
  language: id
  text: 'Simei berkata demikian sambil mengutuk Daud: “Enyahlah! Enyahlah, hai penumpah darah dan manusia bejat!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹה אָמַר שִׁמְעִי
  choice: Simei berkata demikian
  rationale: Ungkapan ini secara alami memperkenalkan isi perkataan Simei tanpa menerjemahkan כֹה secara kaku.
- source_word: בְּ/קַֽלְל/וֹ
  choice: sambil mengutuk Daud
  rationale: Preposisi dengan infinitif konstruk menyatakan tindakan yang berlangsung bersamaan. Akhiran orang ketiga tunggal merujuk kepada Daud dalam konteks; penyebutan namanya menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: צֵא צֵא
  choice: Enyahlah! Enyahlah
  rationale: Pengulangan imperatif menyampaikan penolakan atau pengusiran yang keras. “Enyahlah” lebih tepat menangkap daya hinaannya daripada “keluarlah” yang terlalu harfiah dan bersifat spasial.
- source_word: אִישׁ הַ/דָּמִים
  choice: hai penumpah darah
  rationale: Bentuk jamak idiomatis “darah-darah” menunjuk pada pertumpahan darah atau kesalahan karena menumpahkan darah. Pilihan ini mempertahankan tuduhan terhadap Daud tanpa menambahkan gagasan bahwa motifnya pasti haus darah.
- source_word: וְ/אִישׁ הַ/בְּלִיָּעַל
  choice: manusia bejat
  rationale: בְּלִיַּעַל di sini merupakan sebutan penghinaan bagi orang yang rendah secara moral atau tidak bermoral. “Manusia bejat” terdengar alami sebagai seruan langsung dan tidak memperlakukannya sebagai nama diri.
theological_decisions:
- issue: Makna אִישׁ הַדָּמִים
  choice: penumpah darah
  alternative: orang yang berutang darah / orang berdarah
  rationale: Ungkapan Ibrani menuduh Daud terkait pertumpahan darah atau kesalahan darah. Terjemahan tidak menentukan secara lebih sempit apakah yang terutama dimaksud adalah watak, tindakan, atau tanggung jawab hukum-moralnya.
- issue: Pemaknaan בְּלִיַּעַל
  choice: sebutan umum “manusia bejat”
  alternative: orang jahat / orang tak berguna / manusia Belial
  rationale: Dalam konteks Perjanjian Lama ini, istilah tersebut paling wajar dipahami sebagai penghinaan moral, bukan nama diri bagi sosok demonis. Menerjemahkannya sebagai “Belial” dapat memasukkan perkembangan pengertian yang tidak dituntut oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Enyahlah” mempertahankan kerasnya kutukan, sedangkan seruan “hai penumpah darah, manusia bejat” menjaga kesejajaran kedua penghinaan tanpa terasa kaku.
