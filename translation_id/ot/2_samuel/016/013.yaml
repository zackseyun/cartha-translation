base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/013.yaml
  text: So David and his men went on the road[a], while Shimei went along on the hillside opposite him, going along and cursing[c][b], and throwing stones opposite him and flinging dust.
translation:
  language: id
  text: Daud dan orang-orangnya pun berjalan di jalan itu, sedangkan Simei berjalan di lereng bukit yang berseberangan dengan Daud. Sambil terus berjalan, ia mengutuk[a], melemparkan batu ke arah Daud[b], dan menghamburkan debu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang gagasan gerak yang berkelanjutan: secara harfiah, “terus berjalan dan mengutuk.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melemparkan batu di hadapannya” atau “di seberangnya”; ungkapan yang sama untuk posisi berseberangan muncul sebelumnya dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדָּרֶךְ
  choice: di jalan itu
  rationale: דֶּרֶךְ berarti jalan atau jalur. Preposisi dan artikel tertentu menunjuk pada jalan yang sedang dilalui Daud; bentuk ini konkret dan wajar dalam bahasa Indonesia.
- source_word: בְּצֵלַע הָהָר
  choice: di lereng bukit
  rationale: צֵלַע secara harfiah menunjuk sisi atau bagian samping. Dalam gabungan ini, frasa tersebut menggambarkan lereng bukit tempat Simei bergerak sejajar dengan rombongan Daud.
- source_word: לְעֻמָּתוֹ
  choice: yang berseberangan dengan Daud / ke arah Daud
  rationale: Ungkapan ini muncul dua kali dan menyatakan posisi yang berhadapan atau berseberangan. Pada kemunculan pertama, hubungan ruang dinyatakan secara langsung; pada kemunculan kedua, konteks pelemparan paling alami dinyatakan sebagai arah lemparan, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: הֹלֵךְ ... הָלוֹךְ
  choice: berjalan ... sambil terus berjalan
  rationale: Pengulangan unsur הלך memberi nuansa tindakan yang berlanjut. Terjemahan ini mempertahankan gerak yang terus berlangsung tanpa meniru susunan Ibrani secara kaku.
- source_word: וַיְקַלֵּל
  choice: ia mengutuk
  rationale: Bentuk Piel dari קלל berarti mengutuk. Dalam rangkaian ini, tindakan tersebut berlangsung sambil Simei terus berjalan.
- source_word: וַיְסַקֵּל בָּאֲבָנִים
  choice: melemparkan batu
  rationale: סקל dengan אֲבָנִים menggambarkan tindakan melempari dengan batu. Pilihan ini tidak memberi kesan bahwa yang dimaksud pasti pelaksanaan hukuman mati dengan rajam.
- source_word: וְעִפַּר בֶּעָפָר
  choice: menghamburkan debu
  rationale: Permainan kata Ibrani dengan akar עפר menggambarkan pelemparan atau penghamburan debu/tanah lepas sebagai tindakan permusuhan. 'Menghamburkan debu' alami dan cukup hidup dalam bahasa Indonesia.
- source_word: וַאֲנָשָׁיו
  choice: orang-orangnya
  rationale: Dalam konteks ini אֲנָשִׁים mengacu pada para pengikut laki-laki Daud. 'Orang-orangnya' adalah ungkapan Indonesia yang lazim bagi rombongan atau pengikut seseorang.
- source_word: וַיֵּלֶךְ
  choice: pun berjalan
  rationale: הלך adalah verba dasar untuk pergi atau berjalan. Partikel 'pun' melanjutkan alur narasi secara alami tanpa menambahkan gagasan baru.
