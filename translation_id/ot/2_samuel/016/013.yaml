  terminology: Nama "Daud" dan "Simei" sesuai penggunaan Alkitab Indonesia yang mapan. "Orang-orangnya," "mengutuk," "melemparkan batu," dan "menghamburkan debu" tepat bagi konteks naratif dan tidak menambahkan konotasi hukuman rajam formal.
