  source_fidelity: 'Teks Indonesia secara akurat mengikuti unsur-unsur utama Ibrani: Daud dan orang-orangnya meneruskan perjalanan di jalan, Simei bergerak di lereng bukit yang berseberangan, dan tindakan mengutuk, melempar batu, serta menghamburkan debu berlangsung dalam gerak yang berkelanjutan. "Ke arah Daud" merupakan pengungkapan kontekstual yang wajar bagi לְעֻמָּתוֹ pada kemunculan kedua, sementara catatan kaki dengan tepat mempertahankan dan menjelaskan nuansa spasial ungkapan itu.'
