  text: וַ/יֹּ֤אמֶר אֲחִיתֹ֨פֶל֙ אֶל אַבְשָׁלֹ֔ם בּ֚וֹא אֶל פִּלַגְשֵׁ֣י אָבִ֔י/ךָ אֲשֶׁ֥ר הִנִּ֖יחַ לִ/שְׁמ֣וֹר הַ/בָּ֑יִת וְ/שָׁמַ֤ע כָּל יִשְׂרָאֵל֙ כִּֽי נִבְאַ֣שְׁתָּ אֶת אָבִ֔י/ךָ וְ/חָ֣זְק֔וּ יְדֵ֖י כָּל אֲשֶׁ֥ר אִתָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/021.yaml
  text: Ahithophel said to Absalom[a], “Go in to your father’s concubines, whom he left to keep the house, and all Israel will hear that you have become odious to your father[c][b], and the hands of all who are with you will be strengthened.”
translation:
  language: id
  text: Ahitofel berkata kepada Absalom, “Hampirilah gundik-gundik ayahmu[a] yang ditinggalkannya untuk menjaga rumah itu. Maka seluruh Israel akan mendengar bahwa engkau telah membuat dirimu menjijikkan bagi ayahmu[b], dan hati semua orang yang menyertaimu akan dikuatkan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “masuklah kepada”; suatu ungkapan halus untuk melakukan hubungan seksual.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani menggambarkan Absalom menjadi busuk atau menjijikkan bagi ayahnya, yakni sangat dibenci olehnya.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tangan semua orang yang menyertaimu akan dikuatkan,” sebuah ungkapan yang berarti mereka akan menjadi lebih berani atau teguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹא אֶל
  choice: Hampirilah
  rationale: Dalam konteks ini ungkapan Ibrani tersebut merupakan eufemisme bagi hubungan seksual. 'Hampirilah' mempertahankan ungkapan yang santun dan bernuansa Alkitabiah, sedangkan catatan kaki menjelaskan maksudnya.
- source_word: פִּלַגְשֵׁי
  choice: gundik-gundik
  rationale: '''Gundik'' merupakan padanan Indonesia yang ringkas dan lazim untuk perempuan yang memiliki kedudukan perkawinan sekunder dalam rumah tangga kerajaan kuno.'
- source_word: הִנִּיחַ לִשְׁמוֹר הַבָּיִת
  choice: ditinggalkannya untuk menjaga istana
  rationale: Kata 'menjaga' mempertahankan arti שמר, sedangkan 'istana' menyampaikan bahwa הַבָּיִת di sini adalah kediaman atau rumah tangga raja, bukan sekadar sebuah rumah biasa.
- source_word: וְשָׁמַע כָּל יִשְׂרָאֵל
  choice: Maka seluruh Israel akan mendengar
  rationale: Waw sesudah nasihat imperatif menyatakan hasil yang diharapkan. 'Seluruh Israel' mempertahankan sebutan kolektif bagi bangsa itu.
- source_word: נִבְאַשְׁתָּ אֶת אָבִיךָ
  choice: engkau telah membuat dirimu dibenci oleh ayahmu
  rationale: Bentuk Niphal mengungkapkan keadaan menjadi busuk, menjijikkan, atau sangat dibenci dalam pandangan pihak lain. Padanan ini alami dalam bahasa Indonesia dan mempertahankan akibat relasional-politiknya tanpa memakai ungkapan yang terlalu harfiah.
- source_word: וְחָזְקוּ יְדֵי
  choice: akan dikuatkan hatinya
  rationale: Secara harfiah teks menyebut tangan yang dikuatkan, sebuah idiom Ibrani bagi bertambahnya keberanian atau keteguhan. Idiom Indonesia 'dikuatkan hatinya' menyampaikan fungsi ungkapan itu secara alami.
- source_word: כָּל אֲשֶׁר אִתָּךְ
  choice: semua orang yang menyertaimu
  rationale: Padanan ini mempertahankan ungkapan relasional sumber tanpa mempersempitnya menjadi istilah politik tertentu seperti 'para pendukungmu'.
theological_decisions:
- issue: Eufemisme seksual dalam nasihat politik kerajaan
  choice: Memakai 'Hampirilah' dengan penjelasan eksplisit dalam catatan kaki.
  alternative: '''Tidurilah'' atau ''berhubunganlah dengan''.'
  rationale: Tindakan itu perlu terbaca sebagai hubungan seksual yang menandai perpecahan terbuka dan tak dapat ditarik kembali dengan Daud, tetapi pilihan kata utama tetap menjaga eufemisme serta keseriusan teks Ibrani.
- issue: Gambaran idiomatis tentang penguatan para pengikut Absalom
  choice: Menerjemahkan maknanya sebagai 'akan dikuatkan hatinya' sambil mencatat gambaran harfiahnya.
  alternative: '''tangan ... akan dikuatkan''.'
  rationale: Bahasa Indonesia tidak lazim memakai tangan yang dikuatkan untuk keberanian. Padanan idiomatis menyampaikan maksud tanpa kehilangan gambaran sumber karena bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama mengikuti bentuk Indonesia yang lazim, 'Ahitofel'. Pronomina 'engkau' sesuai dengan dialog naratif Alkitab. 'Istana' dipakai untuk memperjelas konteks rumah kerajaan. Eufemisme seksual dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
