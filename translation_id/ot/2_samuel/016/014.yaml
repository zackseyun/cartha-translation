  yaml_path: translation/ot/2_samuel/016/014.yaml
  text: The king and all the people who were with him arrived weary[b][a], and they refreshed themselves there.
translation:
  language: id
  text: Raja dan seluruh rakyat yang menyertainya tiba dalam keadaan letih, lalu ia memulihkan tenaganya di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lalu ia beristirahat di sana.” Bentuk kata kerja Ibraninya tunggal, “ia memulihkan tenaganya”; sebagian orang memahaminya secara kolektif, “mereka memulihkan tenaga.”'
    reason: lexical_alternative_and_grammatical_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Kata בוא dapat berarti datang atau masuk; dalam konteks tercapainya suatu tempat, "tiba" alami dan tepat.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Mempertahankan gelar definit dalam bahasa Ibrani; konteks mengacu kepada Daud tanpa perlu mengganti gelar dengan namanya.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: dan seluruh rakyat yang menyertainya
  rationale: Menyampaikan klausa relatif bahasa Ibrani secara jelas dan alami dalam bahasa Indonesia.
- source_word: עֲיֵפִים
  choice: dalam keadaan letih
  rationale: Bentuk jamak ini menggambarkan keletihan raja dan seluruh rombongannya; ungkapan ini juga melekat secara wajar pada predikat "tiba".
- source_word: וַיִּנָּפֵשׁ
  choice: lalu ia memulihkan tenaganya
  rationale: Mempertahankan bentuk verba tunggal maskulin bahasa Ibrani dan nuansa memperoleh kembali napas atau kesegaran, bukan sekadar berhenti bergerak.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan adverbia tempat yang langsung dan alami.
