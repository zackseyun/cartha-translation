  text: Then Absalom said to Ahithophel, “Give your advice. What should we do?”
translation:
  language: id
  text: Kemudian Absalom berkata kepada Ahitofel, “Berilah nasihat. Apa yang harus kita lakukan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵצָה (ʿetsah)
  choice: nasihat
  rationale: Dalam konteks musyawarah mengenai tindakan berikutnya, kata ini berarti saran atau pertimbangan untuk menentukan langkah; “nasihat” alami dan sesuai dengan konteks.
- source_word: מַה נַּעֲשֶׂה (mah naʿaseh)
  choice: Apa yang harus kita lakukan?
  rationale: Bentuk orang pertama jamak dipertahankan dengan “kita”; modalitas pertanyaan dalam bahasa Indonesia secara alami dinyatakan dengan “harus” tanpa mengubah maksud deliberatifnya.
- source_word: הָבוּ לָכֶם (havu lakhem)
  choice: Berilah
  rationale: Bahasa Ibrani memakai bentuk jamak yang secara harfiah kurang lebih berarti “berikanlah bagi kalian,” meskipun ujaran ditujukan kepada Ahitofel. Terjemahan tanpa objek atau pronomina menjaga perintah itu tetap alami tanpa memaksakan penyelesaian atas ketidakselarasan jumlah tersebut.
