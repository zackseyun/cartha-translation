  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Nama אַבְשָׁלוֹם dan אֲחִיתֹפֶל ditulis menurut bentuk Indonesia yang lazim: Absalom dan Ahitofel. Tidak diperlukan catatan kaki karena perbedaan jumlah gramatikal dapat dijaga secara netral melalui bentuk “Berilah nasihat” tanpa mengaburkan isi ayat.'
