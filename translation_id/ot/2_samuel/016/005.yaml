  text: וּ/בָ֛א הַ/מֶּ֥לֶךְ דָּוִ֖ד עַד בַּֽחוּרִ֑ים וְ/הִנֵּ֣ה מִ/שָּׁם֩ אִ֨ישׁ יוֹצֵ֜א מִ/מִּשְׁפַּ֣חַת בֵּית שָׁא֗וּל וּ/שְׁמ/וֹ֙ שִׁמְעִ֣י בֶן גֵּרָ֔א יֹצֵ֥א יָצ֖וֹא וּ/מְקַלֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/005.yaml
  text: When King David came to Bahurim[a], behold, a man came out from there, from the clan of the house of Saul, whose name was Shimei son of Gera; he came out continually, cursing as he came.
translation:
  language: id
  text: Ketika Raja Daud sampai di Bahurim, tiba-tiba seorang laki-laki keluar dari sana, dari kaum keluarga Saul. Namanya Simei anak Gera. Ia terus keluar sambil mengutuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia keluar berulang-ulang sambil mengutuk.” Bahasa Ibrani menguatkan kata kerja “keluar” dengan gabungan partisipel dan infinitif absolut, yang mungkin menunjukkan tindakan berulang atau berkelanjutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא הַמֶּלֶךְ דָּוִד
  choice: Ketika Raja Daud sampai
  rationale: Waw dengan verba perfektif melanjutkan alur cerita, sedangkan konstruksi ayat ini berfungsi sebagai latar waktu bagi kemunculan Simei. “Sampai” menyampaikan tibanya Daud secara alami.
- source_word: עַד בַּחוּרִים
  choice: di Bahurim
  rationale: עַד menandai tercapainya tempat tujuan; bersama “sampai,” bahasa Indonesia secara idiomatis memakai “di.”
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Ungkapan ini mempertahankan daya deiktis yang hidup dan menandai perkembangan mendadak dalam adegan tanpa memakai seruan yang terasa kaku.
- source_word: מִשָּׁם אִישׁ יוֹצֵא
  choice: seorang laki-laki keluar dari sana
  rationale: Partisipel יוֹצֵא menggambarkan tindakan yang sedang tampak dalam adegan; susunan ini alami dalam narasi Indonesia.
- source_word: מִמִּשְׁפַּחַת בֵּית שָׁאוּל
  choice: dari kaum keluarga istana Saul
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan, sedangkan בֵּית שָׁאוּל di sini memiliki nuansa wangsa atau keluarga kerajaan Saul. “Istana Saul” membantu menyampaikan dimensi dinastik tanpa menghilangkan hubungan keluarga.
- source_word: וּשְׁמוֹ שִׁמְעִי בֶן גֵּרָא
  choice: dan bernama Simei bin Gera
  rationale: Bentuk identifikasi Ibrani disampaikan secara ringkas dan wajar; “bin” merupakan bentuk Indonesia yang lazim untuk “anak laki-laki dari” dalam nama silsilah Alkitab.
- source_word: יֹצֵא יָצוֹא
  choice: Ia terus keluar
  rationale: Gabungan partisipel dan infinitif absolut menguatkan tindakan keluar dan mungkin menyatakan tindakan yang berulang atau berkelanjutan. “Terus” mempertahankan aspek tersebut, sementara catatan kaki mencatat alternatifnya.
- source_word: וּמְקַלֵּל
  choice: sambil mengutuk
  rationale: Partisipel ini menyatakan tindakan yang berlangsung bersamaan dengan keluarnya Simei.
