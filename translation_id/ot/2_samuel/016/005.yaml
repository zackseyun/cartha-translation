revisions:
- from: Ketika Raja Daud sampai di Bahurim, tampaklah seorang laki-laki keluar dari sana. Ia berasal dari kaum keluarga istana Saul dan bernama Simei bin Gera. Ia terus keluar sambil mengutuk.[a]
  to: Ketika Raja Daud sampai di Bahurim, tiba-tiba seorang laki-laki keluar dari sana, dari kaum keluarga Saul. Namanya Simei anak Gera. Ia terus keluar sambil mengutuk.[a]
  rationale: Revisi mengganti "istana Saul" dengan "keluarga Saul" agar setia pada pengertian kelompok kekerabatan/dinasti dalam frasa Ibrani, dan mengganti "bin Gera" dengan "anak Gera" demi keluwesan bahasa Indonesia baku. "Tiba-tiba" menyampaikan daya penandaan naratif וְהִנֵּה secara alami. Catatan kaki dipertahankan karena secara tepat menjelaskan kemungkinan daya intensif atau iteratif pada יֹצֵא יָצוֹא.
