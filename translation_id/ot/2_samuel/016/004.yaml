base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/004.yaml
  text: Then the king said to Ziba, “Look, all that belongs to Mephibosheth is yours.” And Ziba said, “I bow down; may I find favor in your eyes, my lord the king.”
translation:
  language: id
  text: Lalu raja berkata kepada Ziba, “Lihat, segala kepunyaan Mefiboset menjadi milikmu.” Ziba berkata, “Aku bersujud; kiranya aku mendapat perkenanan di matamu, tuanku raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan penanda perhatian dalam ujaran raja dengan ungkapan Indonesia yang langsung dan wajar.
- source_word: לְךָ כֹּל אֲשֶׁר לִמְפִי בֹשֶׁת
  choice: segala kepunyaan Mefiboset menjadi milikmu
  rationale: Menyampaikan konstruksi kepemilikan secara alami sambil mempertahankan cakupan menyeluruh dari כֹּל.
- source_word: הִשְׁתַּחֲוֵיתִי
  choice: Aku bersujud
  rationale: Bentuk ini secara harfiah menyatakan tindakan merendahkan diri atau bersujud di hadapan raja; terjemahan mempertahankan gestur penghormatan tersebut.
- source_word: אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: kiranya aku mendapat perkenanan di matamu
  rationale: Mempertahankan idiom Ibrani 'mendapat perkenanan di mata' dalam bentuk Indonesia yang dapat dipahami dan bernada hormat.
