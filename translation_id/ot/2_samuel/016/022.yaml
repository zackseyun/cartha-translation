  text: וַ/יַּטּ֧וּ לְ/אַבְשָׁל֛וֹם הָ/אֹ֖הֶל עַל הַ/גָּ֑ג וַ/יָּבֹ֤א אַבְשָׁלוֹם֙ אֶל פִּֽלַגְשֵׁ֣י אָבִ֔י/ו לְ/עֵינֵ֖י כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/022.yaml
  text: So they pitched the tent for Absalom on the roof[a], and Absalom went in to his father's concubines in the sight of all Israel.
translation:
  language: id
  text: Maka mereka mendirikan kemah untuk Absalom di atas atap. Absalom pun menghampiri[a] gundik-gundik ayahnya di depan mata seluruh Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini merupakan eufemisme bagi hubungan seksual.
    reason: clarification_of_euphemism
  - marker: b
    text: Dapat juga diterjemahkan “di hadapan seluruh Israel” atau “dengan disaksikan seluruh Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּטּוּ
  choice: mendirikan
  rationale: Kata kerja נטה dalam konteks kemah berarti membentangkan atau memasang kemah; “mendirikan” merupakan ungkapan Indonesia yang alami untuk tindakan ini.
- source_word: הָאֹהֶל
  choice: kemah
  rationale: Nomina ini memakai kata sandang tertentu dalam bahasa Ibrani. Bahasa Indonesia umumnya tidak perlu menandai ketakrifan itu secara khusus; konteks menunjukkan kemah yang disiapkan bagi Absalom.
- source_word: עַל הַגָּג
  choice: di atas atap
  rationale: Terjemahan langsung dan alami yang mempertahankan lokasi tindakan tersebut.
- source_word: וַיָּבֹא ... אֶל
  choice: menghampiri
  rationale: Ungkapan Ibrani ini merupakan eufemisme bagi hubungan seksual. “Menghampiri” mempertahankan gaya ungkapan yang santun dan khidmat, sementara catatan kaki menjelaskan maksudnya agar tidak disalahpahami sebagai sekadar mendatangi.
- source_word: פִּלַגְשֵׁי אָבִיו
  choice: gundik-gundik ayahnya
  rationale: Menerjemahkan hubungan konstruksi secara langsung dan mempertahankan konteks keluarga serta kerajaan.
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: di depan mata seluruh Israel
  rationale: Mencerminkan ungkapan Ibrani secara dekat sekaligus menyampaikan bahwa tindakan itu dilakukan secara terbuka dan diketahui umum.
theological_decisions:
- issue: Penerjemahan eufemisme seksual dalam konteks perebutan takhta yang sarat muatan moral
  choice: Memakai “menghampiri” dan menjelaskan makna seksualnya dalam catatan kaki.
  alternative: “menggauli” atau “tidur dengan”
  rationale: Pilihan ini mempertahankan eufemisme dan bobot sastra teks Ibrani tanpa mengaburkan maksudnya bagi pembaca modern.
- issue: Sifat terbuka tindakan Absalom
  choice: “di depan mata seluruh Israel”
  alternative: “di hadapan seluruh Israel” atau “dengan disaksikan seluruh Israel”
  rationale: Pilihan utama menjaga gambaran mata dalam teks sumber dan tidak menentukan lebih jauh bagaimana setiap orang Israel menyaksikan tindakan itu; tekanannya ialah tindakan tersebut dilakukan secara terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan “Maka” dan “pun”; eufemisme sumber dipertahankan, tetapi dijelaskan agar maknanya tetap jelas bagi pembaca umum.
