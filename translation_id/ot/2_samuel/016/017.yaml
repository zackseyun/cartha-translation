  yaml_path: translation/ot/2_samuel/016/017.yaml
  text: Absalom said to Hushai[a], “Is this your loyalty to your friend? Why did you not go with your friend?”
translation:
  language: id
  text: Absalom berkata kepada Husai, “Inikah kesetiaanmu kepada sahabatmu?[a] Mengapa kamu tidak pergi bersama sahabatmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebaikanmu” atau “kasih setiamu” untuk “kesetiaanmu” (Ibrani חֶסֶד).
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדְּךָ
  choice: kesetiaanmu
  rationale: Dalam konteks ini חֶסֶד menunjuk pada kesetiaan relasional dan politik Husai kepada Daud. “Kesetiaan” menyampaikan tuduhan Absalom secara alami tanpa mempersempit maknanya menjadi istilah perjanjian yang eksplisit.
- source_word: רֵעֶךָ
  choice: sahabatmu
  rationale: רֵעַ dapat berarti sahabat, teman, atau rekan. Di sini kata itu merujuk kepada Daud dan diulang untuk menajamkan sindiran Absalom; “sahabat” paling wajar dalam bahasa Indonesia.
- source_word: לָמָּה לֹא הָלַכְתָּ אֶת רֵעֶךָ
  choice: Mengapa kamu tidak pergi bersama sahabatmu?
  rationale: Konstruksi הלך dengan אֶת menyatakan tindakan pergi menyertai seseorang. “Pergi bersama” mempertahankan kesederhanaan verba Ibrani dan terdengar alami.
- source_word: זֶה חַסְדְּךָ אֶת רֵעֶךָ
  choice: Begitukah kesetiaanmu kepada sahabatmu?
  rationale: Klausa Ibrani ini tidak memiliki kopula dan berfungsi sebagai pertanyaan retoris bernada tidak percaya. “Begitukah” menyampaikan tantangan tersebut secara alami, sedangkan “kepada” mengungkapkan arah relasional dari אֶת.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Walaupun ujarannya berupa pertanyaan, וַיֹּאמֶר adalah verba naratif umum yang berarti “berkata”; bentuk pertanyaan tetap tampak dalam kutipan.
