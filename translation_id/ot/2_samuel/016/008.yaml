revisions:
- from: Yahweh telah menimpakan kembali kepadamu seluruh darah keluarga Saul[a], yang kedudukannya telah kauambil sebagai raja. Yahweh telah menyerahkan kerajaan itu ke tangan Absalom, anakmu. Lihatlah, engkau kini ditimpa malapetakamu sendiri[b], sebab engkau seorang penumpah darah[c].
  to: Yahweh telah menimpakan kembali kepadamu seluruh darah keluarga Saul[a], yang telah engkau gantikan sebagai raja. Yahweh telah menyerahkan kerajaan itu ke tangan Absalom, anakmu. Lihatlah, engkau kini berada dalam malapetakamu[b], sebab engkau seorang penumpah darah[c].
  rationale: Revisi mempertahankan idiom kausatif 'menimpakan kembali,' nama Yahweh, metafora 'ke tangan,' serta ketaksaan leksikal mengenai darah dan רָעָה. Rumusan bagi malapetaka kini mengikuti predikasi Ibrani tanpa tambahan 'ditimpa' atau 'sendiri.' Rumusan bagi suksesi Saul dibuat netral agar tidak menambahkan nuansa perebutan takhta. Semua jangkar catatan tetap hadir dan berurutan [a], [b], [c].
