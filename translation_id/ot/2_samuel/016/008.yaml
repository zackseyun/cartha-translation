id: 2SA.16.8
reference: 2 Samuel 16:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵשִׁיב֩ עָלֶ֨י/ךָ יְהוָ֜ה כֹּ֣ל דְּמֵ֣י בֵית שָׁא֗וּל אֲשֶׁ֤ר מָלַ֨כְתָּ֙ תחת/ו וַ/יִּתֵּ֤ן יְהוָה֙ אֶת הַ/מְּלוּכָ֔ה בְּ/יַ֖ד אַבְשָׁל֣וֹם בְּנֶ֑/ךָ וְ/הִנְּ/ךָ֙ בְּ/רָ֣עָתֶ֔/ךָ כִּ֛י אִ֥ישׁ דָּמִ֖ים אָֽתָּה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/008.yaml
  text: Yahweh has brought back upon you all the blood of the house of Saul[a], in whose place you reigned, and Yahweh has given the kingdom into the hand of Absalom your son. And look, you are in your calamity[c][b], because you are a man of bloodshed.
translation:
  language: id
  text: Yahweh telah menimpakan kembali kepadamu seluruh darah keluarga Saul[a], yang telah engkau gantikan sebagai raja. Yahweh telah menyerahkan kerajaan itu ke tangan Absalom, anakmu. Lihatlah, engkau kini berada dalam malapetakamu[b], sebab engkau seorang penumpah darah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh darah keluarga Saul.” Ungkapan Ibrani itu juga dapat berarti “seluruh pertumpahan darah keluarga Saul” atau “seluruh kesalahan darah keluarga Saul.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “engkau berada dalam kejahatanmu.” Kata Ibrani yang digunakan dapat berarti kejahatan moral ataupun malapetaka/bencana; di sini kemungkinan besar menunjuk pada malapetaka yang sedang menimpa Daud.
    reason: lexical_ambiguity
  - marker: c
    text: Secara harfiah, “seorang lelaki/orang darah.” Ungkapan ini dapat menunjuk pada orang yang ditandai oleh pertumpahan darah, kekerasan, atau kesalahan darah.
    reason: idiom_explanation
lexical_decisions:
- source_word: הֵשִׁיב עָלֶיךָ
  choice: telah menimpakan kembali kepadamu
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan sesuatu kembali; ungkapan ini mempertahankan gagasan bahwa darah atau kesalahan darah itu berbalik menimpa Daud, tanpa mempersempitnya menjadi sekadar 'membalas'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כֹּל דְּמֵי בֵית שָׁאוּל
  choice: seluruh darah keluarga Saul
  rationale: Bentuk jamak דְּמֵי secara harfiah berarti 'darah-darah' dan dalam konteks dapat menunjuk pada pertumpahan darah atau kesalahan karena menumpahkan darah. Terjemahan utama mempertahankan citra Ibrani, sedangkan alternatif dijelaskan dalam catatan.
- source_word: אֲשֶׁר מָלַכְתָּ תַּחְתָּיו
  choice: yang kedudukannya telah kauambil sebagai raja
  rationale: תַּחְתָּיו berarti 'sebagai gantinya/di tempatnya' dan merujuk kepada Saul. Rumusan ini menyampaikan pergantian takhta secara alami dalam bahasa Indonesia.
- source_word: וַיִּתֵּן ... אֶת־הַמְּלוּכָה בְּיַד
  choice: telah menyerahkan kerajaan itu ke tangan
  rationale: Mempertahankan metafora Ibrani 'ke tangan' sambil menyampaikan pemindahan kuasa atau kendali dengan jelas.
- source_word: וְהִנְּךָ
  choice: Lihatlah
  rationale: Partikel הִנֵּה menarik perhatian pendengar. 'Lihatlah' bersifat modern, jelas, dan tetap bermartabat.
- source_word: בְּרָעָתֶךָ
  choice: ditimpa malapetakamu sendiri
  rationale: רָעָה dapat berarti kejahatan moral maupun malapetaka. Konteks menunjuk pada bencana yang sedang dialami Daud, tetapi bentuk posesif dipertahankan agar kemungkinan kaitan dengan kejahatannya sendiri tidak dihapus.
- source_word: אִישׁ דָּמִים
  choice: seorang penumpah darah
  rationale: Ungkapan ini menggambarkan orang yang dicirikan oleh kekerasan atau kesalahan darah. 'Penumpah darah' alami dalam bahasa Indonesia dan mempertahankan kekuatan tuduhan Simei.
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Makna בְּרָעָתֶךָ
  choice: ditimpa malapetakamu sendiri
  alternative: berada dalam kejahatanmu sendiri
  rationale: Dalam konteks pemberontakan Absalom, perkataan Simei terutama menunjuk kepada bencana yang menimpa Daud. Namun, karena רָעָה juga dapat berarti kejahatan, catatan mempertahankan ketaksaan dan terjemahan tidak menyatakan bahwa tuduhan Simei didukung oleh narator.
- issue: Status tuduhan terhadap Daud
  choice: diterjemahkan sebagai ucapan tuduhan Simei tanpa pengesahan narator
  alternative: merumuskan tuduhan sebagai penilaian teologis objektif
  rationale: Ayat ini melaporkan perkataan Simei. Terjemahan harus mempertahankan kerasnya tuduhan tanpa diam-diam menjadikannya keputusan narator atau Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas dan bermartabat. Bentuk 'kau-' dipakai dalam ucapan langsung agar alami, sedangkan 'Yahweh' mempertahankan nama ilahi. Urutan penanda catatan dibuat [a], [b], [c], dan setiap penanda terdapat dalam teks utama.
