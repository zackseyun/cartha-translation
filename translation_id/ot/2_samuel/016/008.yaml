    issue: '"ditimpa malapetakamu sendiri" untuk בְּרָעָתֶךָ'
    rationale: Rumusan ini mengubah predikasi 'engkau berada dalam malapetakamu' menjadi peristiwa pasif dan menambahkan penekanan 'sendiri.' Perubahan tersebut tidak diperlukan untuk bahasa Indonesia dan mempersempit bentuk ungkapan sumber.
  - severity: low
    issue: '"yang kedudukannya telah kauambil sebagai raja" untuk אֲשֶׁר מָלַכְתָּ תַּחְתָּיו'
    rationale: '''Kauambil'' dapat terdengar lebih menuduh atau mengesankan perebutan. Ibrani menyatakan bahwa Daud menjadi raja menggantikan Saul; padanan yang menyatakan penggantian lebih netral dan dekat.'
  - severity: low
    issue: Penjelasan harfiah catatan c
    rationale: '"Seorang yang penuh darah" bukan penjelasan literal yang paling tepat untuk אִישׁ דָּמִים. Lebih baik menyatakan ''seorang lelaki/orang darah'' dan menjelaskan nilai idiomatiknya.'
