revisions:
- from: Kemudian Daud berkata kepada Abisai dan kepada semua pegawainya, “Lihat, anak kandungku sendiri berusaha mencabut nyawaku. Terlebih lagi sekarang orang Benyamin ini! Biarkan dia dan biarkan dia mengutuk, sebab Yahweh telah berfirman kepadanya.[a]”
  to: Kemudian Daud berkata kepada Abisai dan kepada semua hambanya, “Lihat, anakku, yang berasal dari tubuhku sendiri, berusaha mencabut nyawaku. Apalagi orang suku Benyamin ini! Biarkan dia; biarlah dia mengutuk, sebab Yahweh telah berfirman kepadanya.[a]”
  rationale: Revisi memperjelas identitas kesukuan Simei, memulihkan gaya perbandingan “apalagi,” dan memperbaiki kelancaran idiomatis. Ungkapan asal jasmaniah anak Daud dibuat lebih tampak, tetapi tetap alami dalam bahasa Indonesia. Klausa terakhir dan catatan kaki mempertahankan ambiguitas teks Ibrani mengenai isi firman Yahweh, tanpa menegaskan perintah langsung sebagai isi teks utama.
