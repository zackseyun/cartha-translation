base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/011.yaml
  text: Then David said to Abishai and to all his servants[a], “Look, my son, who came out from my own body, is seeking my life; how much more now this Benjaminite! Leave him alone, and let him curse, for Yahweh has told him to.”
translation:
  language: id
  text: Kemudian Daud berkata kepada Abisai dan kepada semua hambanya, “Lihat, anakku, yang berasal dari tubuhku sendiri, berusaha mencabut nyawaku. Apalagi orang suku Benyamin ini! Biarkan dia; biarlah dia mengutuk, sebab Yahweh telah berfirman kepadanya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan membuat maksud yang tersirat menjadi eksplisit, “sebab Yahweh telah menyuruhnya mengutuk.” Secara harfiah, teks Ibrani berbunyi, “sebab Yahweh telah berfirman kepadanya,” tanpa menyatakan isi firman itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penunjuk dan penegasan dalam ucapan Daud dengan ungkapan Indonesia yang alami.
- source_word: בְנִי אֲשֶׁר יָצָא מִמֵּעַי
  choice: anak kandungku sendiri
  rationale: Mengungkapkan keturunan jasmani langsung secara alami tanpa memakai gambaran harfiah 'keluar dari isi perutku' yang terdengar janggal dalam bahasa Indonesia.
- source_word: מְבַקֵּשׁ אֶת נַפְשִׁי
  choice: berusaha mencabut nyawaku
  rationale: Idiom Ibrani ini berarti berusaha membunuh; pilihan ini jelas sekaligus mempertahankan unsur 'nyawa' dari נֶפֶשׁ.
- source_word: וְאַף כִּי עַתָּה
  choice: Terlebih lagi sekarang
  rationale: Menjaga kekuatan retoris perbandingan Daud antara tindakan anaknya sendiri dan tindakan orang Benyamin itu.
- source_word: בֶּן הַיְמִינִי
  choice: orang Benyamin ini
  rationale: Menunjukkan anggota suku Benyamin dalam bentuk yang lazim dan mudah dipahami pembaca Indonesia.
- source_word: הַנִּחוּ לוֹ וִיקַלֵּל
  choice: Biarkan dia dan biarkan dia mengutuk
  rationale: Mempertahankan perintah jamak kepada para pengikut Daud dan kelanjutan bernuansa izin agar Simei tetap mengutuk.
- source_word: כִּי אָמַר לוֹ יְהוָה
  choice: sebab Yahweh telah berfirman kepadanya
  rationale: Mengikuti struktur Ibrani yang tidak menyebutkan secara eksplisit isi firman itu, sehingga ambiguitas aslinya tidak diselesaikan diam-diam.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana kebijakan proyek dan membedakannya dari gelar 'Tuhan'.
theological_decisions:
- issue: Apakah ucapan Daud menyatakan perintah langsung dari Yahweh atau sekadar izin/providensi ilahi
  choice: sebab Yahweh telah berfirman kepadanya
  alternative: sebab Yahweh telah menyuruhnya mengutuk
  rationale: Teks Ibrani secara langsung mengaitkan tindakan itu dengan perkataan Yahweh, tetapi tidak mengungkapkan isi perkataan tersebut. Terjemahan mempertahankan ketegangan teologis dan ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Pegawai' dipakai untuk עֲבָדִים dalam konteks rombongan kerajaan, sedangkan pengulangan 'biarkan dia' menjaga tekanan ujaran sumber.
