base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/023.yaml
  text: The counsel of Ahithophel that he gave in those days was as if one inquired of God[a]; so was all the counsel of Ahithophel both to David and to Absalom.
translation:
  language: id
  text: Nasihat yang diberikan Ahitofel pada masa itu seperti orang meminta petunjuk kepada Allah[a]; demikian pulalah segala nasihat Ahitofel, baik bagi Daud maupun bagi Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti ketika orang meminta petunjuk melalui firman Allah.” Frasa Ibrani ini dapat dipahami sebagai ungkapan untuk meminta petunjuk kepada Allah; perbandingan tersebut menekankan betapa tinggi nasihat Ahitofel dihargai.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: nasihat
  rationale: Dalam konteks penasihat kerajaan, kata ini menunjuk pada arahan atau pertimbangan yang diberikan kepada penguasa. “Nasihat” alami dalam bahasa Indonesia dan dapat dipertahankan dalam pengulangan ayat.
- source_word: יָעַץ
  choice: yang diberikan
  rationale: Frasa “nasihat yang diberikan” menyampaikan tindakan memberi nasihat secara idiomatis tanpa pengulangan janggal seperti “nasihat yang dinasihatkan”.
- source_word: בַּיָּמִים הָהֵם
  choice: pada masa itu
  rationale: Ungkapan waktu ini alami dalam bahasa Indonesia modern dan sesuai dengan rujukan pada periode tersebut.
- source_word: כַּאֲשֶׁר יִשְׁאַל בִּדְבַר הָאֱלֹהִים
  choice: seolah-olah orang meminta petunjuk Allah
  rationale: Ungkapan ini menggambarkan permintaan bimbingan ilahi. “Petunjuk Allah” menyampaikan fungsi idiomatis דְבַר הָאֱלֹהִים tanpa menyatakan bahwa nasihat Ahitofel sendiri adalah wahyu.
- source_word: כֵּן
  choice: demikianlah
  rationale: Kata ini menghubungkan kembali perbandingan sebelumnya secara ringkas dan tegas.
- source_word: כָּל עֲצַת אֲחִיתֹפֶל
  choice: segala nasihat Ahitofel
  rationale: “Segala” mencerminkan cakupan כָּל dan mempertahankan pengulangan kata “nasihat” dari bahasa sumber.
- source_word: גַּם לְדָוִד גַּם לְאַבְשָׁלֹם
  choice: baik bagi Daud maupun bagi Absalom
  rationale: Pasangan “baik ... maupun ...” secara alami mencerminkan konstruksi גַּם ... גַּם, sedangkan “bagi” menyatakan hubungan nasihat itu dengan kedua raja.
theological_decisions:
- issue: Kekuatan perbandingan dengan permintaan petunjuk ilahi
  choice: Nasihat Ahitofel dianggap seolah-olah seseorang meminta petunjuk Allah.
  alternative: Nasihat Ahitofel sama dengan firman atau wahyu Allah.
  rationale: Bahasa Ibrani membentuk perbandingan, bukan penyamaan. Kata “dianggap” dan “seolah-olah” mempertahankan tingginya wibawa nasihat itu sambil menghindari pernyataan bahwa nasihat Ahitofel merupakan wahyu ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan pengulangan “nasihat Ahitofel” tetap dipertahankan untuk mencerminkan penekanan teks Ibrani.
