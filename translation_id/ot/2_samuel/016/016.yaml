base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/016/016.yaml
  text: And when Hushai the Archite[a], David’s friend, came to Absalom, Hushai said to Absalom, “Long live the king! Long live the king!”
translation:
  language: id
  text: Ketika Husai, orang Arki, sahabat Daud, datang kepada Absalom, Husai berkata kepada Absalom, “Hidup raja! Hidup raja!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semoga raja hidup!” Bahasa Ibrani memakai seruan kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif ini mengantar peristiwa berikutnya. “Ketika” menyampaikan hubungan waktunya secara alami tanpa ungkapan harfiah yang kaku.
- source_word: בָּא
  choice: datang
  rationale: Kata kerja gerak umum ini menyatakan kedatangan Husai kepada Absalom.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, orang Arki
  rationale: Nama diri ditransliterasikan sebagai “Husai”, sedangkan bentuk gentilika הָאַרְכִּי diterjemahkan dengan ungkapan Indonesia yang alami, “orang Arki”.
- source_word: רֵעֶה דָוִד
  choice: sahabat Daud
  rationale: Frasa konstruksi ini menunjukkan hubungan pribadi dan politis Husai dengan Daud; “sahabat Daud” ringkas dan wajar dalam bahasa Indonesia.
- source_word: אֶל אַבְשָׁלוֹם
  choice: kepada Absalom
  rationale: Preposisi אֶל menunjukkan gerak atau arah menuju seseorang; “kepada Absalom” sesuai baik dalam konteks kedatangan maupun sapaan.
- source_word: וַיֹּאמֶר
  choice: berkatalah
  rationale: Bentuk ini memperkenalkan ucapan langsung; inversi “berkatalah Husai” mempertahankan corak naratif yang bermartabat dan tetap mudah dipahami.
- source_word: יְחִי הַמֶּלֶךְ
  choice: Hidup raja!
  rationale: Bentuk jusif ini merupakan seruan kerajaan. “Hidup raja!” adalah padanan idiomatis yang singkat dan kuat dalam bahasa Indonesia.
- source_word: יְחִי הַמֶּלֶךְ (diulang)
  choice: Hidup raja!
  rationale: Pengulangan dipertahankan karena terdapat dalam teks Ibrani dan memberi penekanan pada seruan publik itu, sekaligus membiarkan ketegangan naratif mengenai kesetiaan Husai tetap utuh.
theological_decisions:
- issue: Ambiguitas seruan Husai kepada Absalom
  choice: Mempertahankan seruan kerajaan tanpa penjelasan interpretatif
  alternative: Menambahkan kata-kata yang secara eksplisit menandai ironi atau maksud menipu
  rationale: Ayat ini menyajikan ucapan Husai sebagai seruan kerajaan yang lazim. Konteks yang lebih luas menyingkapkan ambiguitas strategisnya, tetapi terjemahan ayat ini tidak boleh menyelesaikan ketegangan tersebut dengan memasukkan tafsiran ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional “Husai, orang Arki, sahabat Daud” menjaga semua keterangan identitas dari teks sumber. Seruan diulang persis seperti dalam bahasa Ibrani.
