base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/007.yaml
  text: They came to the fortified city of Tyre and to all the cities of the Hivites and the Canaanites[a], and they went out to the Negev of Judah, to Beersheba.
translation:
  language: id
  text: Mereka sampai ke kota berbenteng Tirus dan ke semua kota orang Hewi dan orang Kanaan. Lalu mereka pergi ke Negeb Yehuda, ke Bersyeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian selatan Yehuda.” Kata Ibrani negev dapat menunjuk pada kawasan khusus bernama Negeb atau, secara lebih umum, daerah selatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְצַר צֹר
  choice: kota berbenteng Tirus
  rationale: מִבְצַר menunjuk pada tempat yang diperkuat atau benteng. Dalam kaitannya dengan nama Tirus, “kota berbenteng Tirus” menyampaikan ciri pertahanan kota itu secara alami tanpa membatasinya pada satu benteng saja.
- source_word: וְכָל עָרֵי הַחִוִּי וְהַכְּנַעֲנִי
  choice: dan ke semua kota orang Hewi dan orang Kanaan
  rationale: Kata depan “ke” diteruskan dari verba gerak sebelumnya agar rangkaian tujuan perjalanan jelas dalam bahasa Indonesia. Bentuk tunggal kolektif Ibrani untuk kedua nama bangsa diterjemahkan secara idiomatis sebagai “orang Hewi” dan “orang Kanaan”.
- source_word: וַיֵּצְאוּ
  choice: Lalu mereka bergerak menuju
  rationale: Secara harfiah verba ini berarti “keluar”. Dalam konteks daftar perjalanan, ungkapan ini menandai keberangkatan atau kelanjutan perjalanan menuju tahap berikutnya; “bergerak menuju” terdengar alami dan tetap mempertahankan arah geraknya.
- source_word: אֶל נֶגֶב יְהוּדָה
  choice: menuju Negeb di wilayah Yehuda
  rationale: נֶגֶב dapat menjadi nama kawasan Negeb atau berarti daerah selatan. Teks utama mempertahankan nuansa nama geografis, sedangkan “di wilayah Yehuda” memperjelas hubungan konstruksi Ibraninya tanpa menghapus kemungkinan makna umum yang dicatat dalam catatan kaki.
- source_word: בְּאֵר שָׁבַע
  choice: Bersyeba
  rationale: Bentuk nama tempat yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
