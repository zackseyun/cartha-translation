base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/018.yaml
  text: That day Gad came to David and said to him[c][b][a], “Go up and set up an altar to Yahweh on the threshing floor of Araunah the Jebusite.”
translation:
  language: id
  text: Pada hari itu Gad datang kepada Daud dan berkata kepadanya, “Naiklah dan dirikanlah sebuah mazbah bagi Yahweh di tempat pengirikan Arauna, orang Yebus itu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 1 Tawarikh 21:18, nama ini ditulis Ornan.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא secara wajar berarti ‘datang’ dengan tujuan אֶל דָּוִד, ‘kepada Daud’.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Menyampaikan penunjukan waktu tertentu secara alami dan dekat dengan bentuk Ibrani.
- source_word: עֲלֵה
  choice: Pergilah naik
  rationale: Mempertahankan unsur arah dari עלה; bentuk ganda ini masih wajar dalam bahasa Indonesia dan tidak mereduksinya sekadar menjadi ‘pergilah’.
- source_word: הָקֵם
  choice: dirikanlah
  rationale: Imperatif Hifil dari קום bermakna menyebabkan berdiri; ‘dirikanlah’ tepat dan alami untuk sebuah mazbah.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah Indonesia yang baku dan lazim dalam konteks Alkitab untuk tempat persembahan korban.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menandai peruntukan atau dedikasi; ‘bagi’ alami ketika mendirikan mazbah dan tetap menyisakan nuansa tujuan/persembahan.
- source_word: בְּגֹרֶן
  choice: di tempat pengirikan
  rationale: ב menandai lokasi; ‘di tempat pengirikan’ lebih alami dalam bahasa Indonesia daripada terjemahan spasial yang terlalu harfiah.
- source_word: ארניה
  choice: Arauna
  rationale: Mencerminkan bentuk nama dalam teks Samuel; bentuk paralel dalam Tawarikh adalah Ornan.
- source_word: הַיְבֻסִי
  choice: orang Yebus itu
  rationale: Menyampaikan gentilika dengan idiom Indonesia yang alami serta mempertahankan bentuk definit Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; ‘Yahweh’ mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Nuansa ל dalam לַיהוָה
  choice: bagi Yahweh
  alternative: kepada Yahweh
  rationale: Dalam konteks pendirian mazbah, ל dapat menyatakan dedikasi atau peruntukan. ‘Bagi Yahweh’ paling alami dalam bahasa Indonesia, sementara ‘kepada Yahweh’ tetap merupakan kemungkinan yang dekat secara formal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Mazbah’ dipertahankan sebagai istilah Alkitab yang mapan; susunan imperatif dibuat alami tanpa menghilangkan daya arah kata Ibrani עֲלֵה.
