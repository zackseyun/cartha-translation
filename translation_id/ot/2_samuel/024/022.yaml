base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/022.yaml
  text: Then Araunah said to David[a], “Let my lord the king take and offer up what is good in his eyes. Look, the oxen are for the burnt offering[b], and the threshing sledges and the implements of the oxen are for the wood.”
translation:
  language: id
  text: Lalu Arauna berkata kepada Daud, “Biarlah tuanku raja mengambil dan mempersembahkan apa yang baik menurut pandangannya.[a] Lihatlah, lembu-lembu ini untuk kurban bakaran, sedangkan papan-papan pengirik dan perlengkapan lembu ini sebagai kayu bakar.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “apa saja yang dipandangnya baik.” Secara harfiah, ungkapan Ibraninya berbunyi “yang baik di matanya.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini luas dan dapat menunjuk secara umum pada peralatan kayu yang digunakan bersama lembu, termasuk kemungkinan kuk, yang kemudian dipakai sebagai bahan bakar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח וְיַעַל
  choice: Silakan ... mengambil dan mempersembahkan
  rationale: Bentuk imperfek dalam tuturan langsung menyatakan izin atau undangan yang penuh hormat. “Silakan” menyampaikan nuansa itu secara alami, sedangkan “mempersembahkan” sesuai dengan konteks kurban.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Sapaan istana ini menggabungkan penghormatan pribadi dan gelar kerajaan; bentuk tersebut wajar dan bermartabat dalam bahasa Indonesia.
- source_word: הַטּוֹב בְּעֵינָיו
  choice: apa yang baik menurut pandangannya
  rationale: Mempertahankan ungkapan Ibrani tentang apa yang baik “di matanya” sekaligus menggunakan bentuk Indonesia yang dapat dipahami. Pronomina orang ketiga mempertahankan peralihan sudut penyebutan dalam teks Ibrani.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Berfungsi sebagai penanda wacana yang mengarahkan perhatian Daud kepada barang-barang yang ditawarkan Arauna.
- source_word: הַבָּקָר
  choice: lembu-lembu ini
  rationale: Konteks peralatan pengirikan menunjukkan hewan penarik; “lembu” lebih tepat daripada istilah umum “ternak”. Kata “ini” membuat fungsi deiktis konteks menjadi alami tanpa mengubah acuannya.
- source_word: לָעֹלָה
  choice: untuk kurban bakaran
  rationale: Menunjukkan bahwa lembu-lembu itu dimaksudkan sebagai kurban yang dibakar seluruhnya; frasa tanpa artikel lebih alami dalam bahasa Indonesia.
- source_word: הַמֹּרִגִּים
  choice: papan-papan pengirik
  rationale: Istilah ini menunjuk pada alat pengirik berupa papan atau eretan. “Papan pengirik” cukup konkret dan mudah dipahami.
- source_word: כְלֵי הַבָּקָר
  choice: perlengkapan lembu
  rationale: כְּלִי bersifat luas dan tidak memastikan bahwa yang dimaksud khususnya kuk. Terjemahan ini mempertahankan keluasan makna dan menghindari spesifikasi yang tidak pasti.
- source_word: לָעֵצִים
  choice: untuk kayu bakar
  rationale: Dalam konteks persembahan bakaran, peralatan kayu tersebut akan digunakan sebagai bahan bakar. “Kayu bakar” menyampaikan fungsi itu secara langsung dan alami.
