translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat yang sesuai bagi percakapan dengan raja. Ungkapan Ibrani dipertahankan sejauh masih jelas, sementara istilah teknis pertanian diterjemahkan secara konkret tanpa mempersempit makna yang tidak pasti.
