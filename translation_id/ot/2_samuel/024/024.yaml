  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל אֲרַ֗וְנָה לֹ֚א כִּֽי קָנ֨וֹ אֶקְנֶ֤ה מֵ/אֽוֹתְ/ךָ֙ בִּ/מְחִ֔יר וְ/לֹ֧א אַעֲלֶ֛ה לַ/יהוָ֥ה אֱלֹהַ֖/י עֹל֣וֹת חִנָּ֑ם וַ/יִּ֨קֶן דָּוִ֤ד אֶת הַ/גֹּ֨רֶן֙ וְ/אֶת הַ/בָּקָ֔ר בְּ/כֶ֖סֶף שְׁקָלִ֥ים חֲמִשִּֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/024.yaml
  text: But the king said to Araunah[a], “No, but I will surely buy it from you for a price[c][b]. I will not offer to Yahweh my God burnt offerings that cost me nothing.” So David bought the threshing floor and the cattle for fifty shekels of silver.
translation:
  language: id
  text: Namun raja berkata kepada Arauna, “Tidak! Aku pasti akan membelinya darimu dengan membayar harganya. Aku tidak akan mempersembahkan kepada Yahweh, Allahku, kurban bakaran yang kuperoleh dengan cuma-cuma.” Maka Daud membeli tempat pengirikan dan lembu-lembu itu seharga lima puluh syikal perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 1 Tawarikh 21:25, Daud membayar enam ratus syikal emas untuk lokasi itu; ayat ini menyebut lima puluh syikal perak untuk tempat pengirikan dan lembu-lembu.
    reason: cross_reference
lexical_decisions:
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Mentransliterasikan bentuk nama dalam teks Samuel secara wajar ke dalam ejaan Indonesia; bentuk Ornan terdapat dalam catatan paralel di Tawarikh.
- source_word: קָנוֹ אֶקְנֶה
  choice: Aku akan membelinya
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan tekad membeli; dalam bahasa Indonesia, penegasan itu disampaikan melalui konteks penolakan tegas dan bentuk pernyataan langsung.
- source_word: בִּמְחִיר
  choice: dengan harga penuh
  rationale: מְחִיר berarti harga atau pembayaran. 'Harga penuh' mengungkapkan kontras kontekstual dengan pemberian cuma-cuma, tanpa mengubah tindakan transaksi.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai Yahweh, sesuai bukti teks Ibrani.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk persembahan yang dibakar seluruhnya di atas mazbah.
- source_word: חִנָּם
  choice: yang kuperoleh dengan cuma-cuma
  rationale: Secara harfiah berarti 'dengan cuma-cuma/tanpa bayaran'. Subjek orang pertama dibuat eksplisit secara alami karena Daud menolak mempersembahkan barang yang tidak ia bayar.
- source_word: הַגֹּרֶן
  choice: tempat pengirikan
  rationale: Padanan konkret dan lazim bagi lokasi tempat bulir-bulir biji-bijian diirik.
- source_word: הַבָּקָר
  choice: lembu-lembu
  rationale: בָּקָר adalah istilah kolektif untuk ternak sapi dan dalam konteks ini menunjuk hewan kerja atau kurban; 'lembu-lembu' sesuai konteks dan tetap alami.
- source_word: בְּכֶסֶף שְׁקָלִים חֲמִשִּׁים
  choice: seharga lima puluh syikal perak
  rationale: Menyampaikan secara alami bahwa perak seberat lima puluh syikal merupakan harga pembelian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi mempertahankan nama diri ilahi alih-alih menggantinya dengan gelar.
- issue: Makna חִנָּם dalam kurban Daud
  choice: yang kuperoleh dengan cuma-cuma
  alternative: kurban bakaran cuma-cuma
  rationale: Ungkapan Ibrani secara gramatikal dapat dibaca sebagai mempersembahkan kurban 'dengan cuma-cuma'; pilihan utama menjelaskan implikasi konteks bahwa Daud tidak mau mempersembahkan sesuatu yang tidak dibayarnya, tanpa menjadikannya prinsip teologis umum tentang nilai kurban.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. 'Namun' mempertahankan kontras; seruan 'Tidak!' menyampaikan ketegasan לֹא כִּי. Istilah ritual dipertahankan secara jelas tanpa corak denominasi tertentu.
