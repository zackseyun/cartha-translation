base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/014.yaml
  text: Then David said to Gad[a], “I am in great distress. Let us fall, please, into the hand of Yahweh, for his mercies are many[b]; but let me not fall into the hand of man.”
translation:
  language: id
  text: Lalu Daud berkata kepada Gad, “Aku sangat tertekan. Biarlah kita jatuh ke dalam tangan Yahweh, sebab rahmat-Nya berlimpah[a]; tetapi janganlah aku jatuh ke dalam tangan manusia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebab banyak rahmat-Nya”; nomina Ibraninya berbentuk jamak. Dapat juga diterjemahkan, “sebab belas kasih-Nya berlimpah.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “ke dalam tangan manusia” berarti berada di bawah kuasa atau kendali manusia.
    reason: idiom_clarification
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: Aku sangat terdesak
  rationale: Ungkapan predikatif צַר לִי menyatakan kesesakan atau tekanan berat yang dialami Daud. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya emosional teks.
- source_word: נִפְּלָה נָּא
  choice: Biarlah kiranya kita jatuh
  rationale: Bentuk kohortatif orang pertama jamak dipertahankan sebagai “kita”, yang menunjukkan bahwa Daud menyatukan dirinya dengan bangsa itu. Partikel נָא disampaikan dengan “kiranya” sebagai permohonan.
- source_word: בְיַד יְהוָה
  choice: ke dalam tangan Yahweh
  rationale: Metafora “tangan” dipertahankan karena menyatakan kuasa atau kendali sekaligus membentuk kontras retoris dengan tangan manusia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama yang terdapat langsung dalam teks Ibrani tetap tampak.
- source_word: כִּי רַבִּים רחמיו
  choice: sebab rahmat-Nya berlimpah
  rationale: רַחֲמִים menunjuk pada belas kasih atau rahmat yang mendalam, sedangkan רַבִּים menyatakan kelimpahan. Bentuk Indonesia ini alami tanpa menghilangkan makna kuantitatif ungkapan Ibrani.
- source_word: וּבְיַד אָדָם
  choice: tetapi ... ke dalam tangan manusia
  rationale: אָדָם di sini bersifat generik dan dikontraskan dengan Yahweh. “Manusia” adalah padanan Indonesia yang alami dan mencakup umat manusia tanpa mengubahnya menjadi rujukan pada seorang laki-laki tertentu.
- source_word: אַל אֶפֹּלָה
  choice: janganlah aku jatuh
  rationale: Larangan dengan bentuk orang pertama tunggal menyatakan keinginan atau permohonan Daud. Peralihan dari “kita” ke “aku” dipertahankan sebagaimana teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankan nama itu dan membedakannya dari sebuah gelar.
- issue: Subjek jamak pada נִפְּלָה dan subjek tunggal pada אֶפֹּלָה
  choice: “kita jatuh” lalu “aku jatuh”
  alternative: Menyeragamkan keduanya menjadi “aku jatuh”
  rationale: Perubahan jumlah gramatikal merupakan ketegangan asli teks dan mungkin mencerminkan identifikasi Daud dengan rakyat sebelum ia berbicara tentang dirinya sendiri. Terjemahan tidak menyeragamkannya.
- issue: Makna אָדָם dalam kontras dengan Yahweh
  choice: manusia
  alternative: orang / tangan manusiawi
  rationale: Kata tersebut merujuk secara generik kepada manusia sebagai pihak yang memegang kuasa, bukan secara khusus kepada seorang laki-laki. “Manusia” menjaga kontras teologis antara belas kasih Yahweh dan kuasa manusia.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora tangan serta peralihan sengaja dari orang pertama jamak (“kita”) ke tunggal (“aku”) dipertahankan. “Kiranya” memberi nuansa permohonan tanpa terdengar terlalu sehari-hari.
