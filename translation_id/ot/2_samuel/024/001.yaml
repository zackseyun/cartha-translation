  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף֙ אַף יְהוָ֔ה לַ/חֲר֖וֹת בְּ/יִשְׂרָאֵ֑ל וַ/יָּ֨סֶת אֶת דָּוִ֤ד בָּ/הֶם֙ לֵ/אמֹ֔ר לֵ֛ךְ מְנֵ֥ה אֶת יִשְׂרָאֵ֖ל וְ/אֶת יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/001.yaml
  text: Again the anger of Yahweh burned against Israel[a], and he incited David against them, saying, “Go[b], count Israel and Judah.”
translation:
  language: id
  text: Murka Yahweh kembali menyala terhadap Israel,[a] lalu Ia menghasut Daud untuk melawan mereka dengan berkata, “Pergilah, hitunglah[b] Israel dan Yehuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Tawarikh 21:1 mengatakan bahwa Iblis bangkit melawan Israel dan menghasut Daud. Teks utama di sini mengikuti subjek yang paling jelas dalam bahasa Ibrani 2 Samuel dan mempertahankan ketegangan antara kedua catatan itu, bukan menyelaraskannya.
    reason: cross_reference
  - marker: b
    text: Atau “tentukanlah jumlah” atau “lakukanlah sensus terhadap Israel dan Yehuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַחֲרוֹת
  choice: kembali menyala
  rationale: Gabungan verba yang menandai tindakan berulang dengan idiom tentang murka yang menyala diterjemahkan secara alami sambil mempertahankan metafora Ibrani.
- source_word: אַף יְהוָה
  choice: murka Yahweh
  rationale: אַף secara idiomatis berarti kemarahan atau murka; 'murka' sesuai dengan ragam naratif yang bermartabat. Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam idiom ini, preposisi menandai sasaran murka. 'Terhadap' alami dan tidak berlebihan.
- source_word: וַיָּסֶת אֶת דָּוִד
  choice: lalu Ia menghasut Daud
  rationale: Bentuk kausatif סות menyatakan dorongan atau hasutan. Subjek yang paling wajar secara gramatikal adalah Yahweh, subjek klausa sebelumnya.
- source_word: בָּהֶם
  choice: untuk melawan mereka
  rationale: Frasa ini sulit dan secara harfiah berkaitan dengan 'mereka'. Pilihan ini mempertahankan orientasi permusuhan terhadap Israel tanpa menghilangkan rujukan pronominalnya.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mengantar ujaran langsung secara wajar dalam bahasa Indonesia dan tetap menghubungkan perkataan itu dengan tindakan menghasut.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif tunggal diterjemahkan dengan bentuk perintah Indonesia yang alami.
- source_word: מְנֵה
  choice: hitunglah
  rationale: Verba מנה berarti menghitung atau menentukan jumlah. 'Hitunglah' dekat dengan bentuk sumber; makna sensus dijelaskan dalam catatan.
- source_word: יִשְׂרָאֵל וְאֶת יְהוּדָה
  choice: Israel dan Yehuda
  rationale: Nama kedua entitas dipertahankan tanpa penambahan penjelasan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Pelaku yang menghasut Daud dibandingkan dengan 1 Tawarikh 21:1
  choice: Ia menghasut Daud
  alternative: seseorang menghasut Daud; Iblis menghasut Daud
  rationale: Subjek tersirat וַיָּסֶת paling alami merujuk kembali kepada Yahweh. Terjemahan utama mengikuti sintaksis 2 Samuel dan mempertahankan ketegangan dengan catatan 1 Tawarikh, bukan menyelaraskannya secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat mudah dipahami, sedangkan metafora murka yang menyala, nama ilahi Yahweh, ambiguitas teologis antarteks, dan alternatif makna sensus tetap dipertahankan.
