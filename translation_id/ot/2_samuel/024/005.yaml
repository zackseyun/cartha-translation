base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/005.yaml
  text: They crossed the Jordan and camped at Aroer[a], on the right side of the city that is in the middle of the valley of Gad[c][b], and toward Jazer.
translation:
  language: id
  text: Mereka menyeberangi Sungai Yordan lalu berkemah di Aroer, di sebelah kanan[a] kota yang terletak di tengah lembah Gad[b], dan ke arah Yaeser.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di kanan kota”. Sebagian penafsir memahami ungkapan arah ini sebagai “di sebelah selatan kota”, tetapi teks Ibrani sendiri menyebut sisi kanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah jurang Gad” atau “di tengah alur sungai musiman Gad”. Kata Ibrani yang dipakai dapat berarti lembah, jurang, atau alur sungai musiman.
    reason: lexical_alternative
  - marker: c
    text: Atau “dan ke Yaeser”. Preposisi Ibrani yang dipakai dapat menunjukkan arah menuju suatu tempat ataupun gerakan ke tempat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ אֶת־הַיַּרְדֵּן
  choice: Mereka menyeberangi Sungai Yordan
  rationale: Kata kerja עבר dengan objek Sungai Yordan secara alami berarti menyeberangi. Penyebutan 'Sungai Yordan' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַיַּחֲנוּ בַעֲרוֹעֵר
  choice: lalu berkemah di Aroer
  rationale: Kata חנה berarti mendirikan atau tinggal di perkemahan. Dalam rangkaian narasi, 'lalu' menyampaikan urutan wayyiqtol dengan lebih alami daripada pengulangan 'dan'.
- source_word: יְמִין הָעִיר
  choice: di sebelah kanan kota
  rationale: Terjemahan ini mempertahankan arti spasial dasar ימין tanpa langsung menafsirkannya sebagai arah selatan.
- source_word: אֲשֶׁר בְּתוֹךְ הַנַּחַל הַגָּד
  choice: yang terletak di tengah lembah Gad
  rationale: Klausa relatif dipahami menerangkan 'kota'. נחל dapat menunjuk lembah, jurang, atau alur sungai musiman; 'lembah' paling mudah dipahami dalam teks utama.
- source_word: וְאֶל יַעְזֵר
  choice: dan ke arah Yaezer
  rationale: Preposisi אל dapat menyatakan arah maupun tujuan. 'Ke arah' mempertahankan kemungkinan bahwa ayat ini tidak secara tegas menyatakan mereka tiba di Yaezer.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama tempat ditransliterasikan sebagai Aroer dan Yaezer; ambiguitas geografis pada 'kanan', נחל, dan אל dipertahankan melalui catatan kaki.
