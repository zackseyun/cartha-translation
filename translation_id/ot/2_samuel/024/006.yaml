  source_fidelity: 'Terjemahan ini setia pada urutan perjalanan dalam teks Ibrani: mereka tiba di Gilead, di negeri Tahtim-Hodsi, di Dan-Yaan, lalu bergerak berkeliling ke arah Sidon. “Menuju Sidon” dengan tepat tidak memaksakan bahwa Sidon sendiri telah dicapai. Nama tempat yang sangat tidak pasti dipertahankan sebagai transliterasi, sehingga tidak memasukkan emendasi geografis yang bersifat dugaan.'
