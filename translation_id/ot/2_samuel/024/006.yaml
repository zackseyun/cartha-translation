  terminology: “Negeri” tepat untuk אֶרֶץ sebagai wilayah. Ejaan Tahtim-Hodsi dan Dan-Yaan digunakan secara konsisten di teks dan catatan kaki. Catatan kaki secara tepat menandai ketidakpastian tekstual/geografis tanpa menyajikan pembacaan alternatif sebagai kepastian.
