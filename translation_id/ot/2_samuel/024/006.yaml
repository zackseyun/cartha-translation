base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/006.yaml
  text: They came to Gilead and to the land of Tahtim-hodshi[a], and they came to Dan-jaan[b], and around to Sidon.
translation:
  language: id
  text: Mereka sampai di Gilead dan di negeri Tahtim-Hodsi[a]. Kemudian mereka sampai di Dan-Yaan[b], lalu berkeliling menuju Sidon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani Tahtim-Hodsi tidak jelas. Sebagian pihak memperbaiki atau menafsirkannya sebagai “negeri orang Het di Kades” atau ungkapan serupa, tetapi nama tempat yang dimaksud tidak dapat dipastikan.
    reason: alternative_reading
  - marker: b
    text: Dan-Yaan tampaknya merupakan nama tempat, tetapi lokasi tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: mereka sampai
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan perjalanan. 'Sampai' terdengar alami dalam laporan rute dan dipertahankan pada kemunculan kedua untuk mencerminkan susunan bertahap teks Ibrani.
- source_word: הַגִּלְעָדָה
  choice: di Gilead
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Gilead; bersama verba 'sampai', bahasa Indonesia secara alami memakai 'di' untuk tempat tujuan yang dicapai.
- source_word: אֶרֶץ
  choice: negeri
  rationale: Di sini אֶרֶץ menunjuk pada suatu wilayah geografis. 'Negeri' merupakan padanan ringkas dan wajar dalam konteks daftar perjalanan.
- source_word: תַּחְתִּים חָדְשִׁי
  choice: Tahtim-Hodsi
  rationale: Ungkapan ini kabur secara tekstual dan geografis. Transliterasi mempertahankan bentuk nama tempat yang mungkin tanpa memasukkan perbaikan teks yang bersifat dugaan.
- source_word: דָּנָה יַּעַן
  choice: Dan-Yaan
  rationale: Frasa ini paling aman dipahami sebagai nama tempat. Ejaan dengan 'Y' menyesuaikan bunyi konsonan Ibrani dan kebiasaan ejaan Indonesia; unsur arah dinyatakan secara idiomatis oleh 'sampai di'.
- source_word: וְסָבִיב
  choice: lalu berkeliling
  rationale: סָבִיב menyatakan gerak memutar atau melalui daerah sekitar. Penambahan verba 'berkeliling' membuat frasa eliptis Ibrani jelas dan alami dalam bahasa Indonesia.
- source_word: אֶל צִידוֹן
  choice: menuju Sidon
  rationale: Preposisi אֶל menunjukkan arah atau tujuan. 'Menuju' mempertahankan kemungkinan arah gerak tanpa harus menyatakan bahwa Sidon telah dicapai.
