id: 2SA.24.23
reference: 2 Samuel 24:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/כֹּ֗ל נָתַ֛ן אֲרַ֥וְנָה הַ/מֶּ֖לֶךְ לַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר אֲרַ֨וְנָה֙ אֶל הַ/מֶּ֔לֶךְ יְהוָ֥ה אֱלֹהֶ֖י/ךָ יִרְצֶֽ/ךָס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/023.yaml
  text: Araunah the king gave all this to the king[a]. And Araunah said to the king[b], “May Yahweh your God accept you.”
translation:
  language: id
  text: Arauna, sang raja, memberikan semuanya itu kepada raja.[a] Lalu Arauna berkata kepada raja, “Kiranya Yahweh, Allahmu, berkenan kepadamu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani menyebut “Arauna, sang raja.” Sebagian terjemahan menghilangkan gelar itu agar Arauna tidak terkesan berstatus raja, tetapi gelar tersebut terdapat dalam teks Ibrani.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “menerima engkau” atau “mengaruniakan kemurahan kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: semuanya itu
  rationale: Menunjuk secara menyeluruh kepada benda-benda yang baru saja ditawarkan dalam konteks sebelumnya, dengan ungkapan Indonesia yang alami.
- source_word: נָתַן
  choice: memberikan
  rationale: Bentuk qatal dalam narasi dipahami sebagai tindakan lampau; bahasa Indonesia tidak menandai kala pada verba dan konteks naratif sudah membuat waktunya jelas.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Transliterasi Indonesia yang wajar untuk nama dalam kitab Samuel; bentuk Ornan dari catatan Tawarikh tidak diimpor ke sini.
- source_word: הַמֶּלֶךְ
  choice: sang raja
  rationale: Mempertahankan gelar yang secara eksplisit beraposisi dengan nama Arauna dalam teks Ibrani, sekaligus membedakannya secara alami dari penerima yang disebut 'raja'.
- source_word: לַמֶּלֶךְ
  choice: kepada raja
  rationale: Preposisi ל menandai penerima, yaitu Daud.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; 'lalu' merupakan padanan Indonesia yang alami tanpa memberi tekanan berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang tertulis dalam sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Menerjemahkan bentuk konstruk dengan sufiks orang kedua maskulin tunggal secara langsung dan alami.
- source_word: יִרְצֶךָ
  choice: berkenan kepadamu
  rationale: רצה menyatakan sikap menerima dengan kemurahan atau perkenanan; pilihan ini mempertahankan nuansa relasional dan tidak membatasi maknanya hanya pada penerimaan persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama diri ilahi; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Gelar הַמֶּלֶךְ sesudah nama Arauna
  choice: Mempertahankan 'Arauna, sang raja' dalam teks utama
  alternative: Menghilangkan gelar dan menerjemahkan 'Arauna memberikan semuanya itu kepada raja'
  rationale: Walaupun gelar ini tidak lazim dalam konteks dan dapat menimbulkan pertanyaan tentang status Arauna, teks Masoret secara eksplisit memuatnya; ketegangan tekstual tidak diselaraskan secara diam-diam.
- issue: Cakupan makna יִרְצֶךָ
  choice: berkenan kepadamu
  alternative: menerima engkau atau mengaruniakan kemurahan kepadamu
  rationale: Ungkapan ini menjaga kemungkinan makna penerimaan dan kemurahan ilahi tanpa menetapkan bahwa objek implisitnya hanya persembahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sang raja' mempertahankan gelar yang janggal tetapi eksplisit bagi Arauna, sedangkan 'raja' tanpa 'sang' menunjuk kepada Daud. Tanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
