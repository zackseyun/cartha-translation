  text: וַ/יֹּ֣אמֶר אֲרַ֔וְנָה מַדּ֛וּעַ בָּ֥א אֲדֹנִֽ/י הַ/מֶּ֖לֶךְ אֶל עַבְדּ֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜ד לִ/קְנ֧וֹת מֵ/עִמְּ/ךָ֣ אֶת הַ/גֹּ֗רֶן לִ/בְנ֤וֹת מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וְ/תֵעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/021.yaml
  text: And Araunah said[a], “Why has my lord the king come to his servant?” And David said, “To buy the threshing floor from you, to build an altar to Yahweh, so that the plague may be stopped from being upon the people.”
translation:
  language: id
  text: Lalu Arauna berkata[a], “Mengapa tuanku raja datang kepada hambanya?” Daud menjawab, “Untuk membeli tempat pengirikan darimu dan membangun mezbah bagi Yahweh, supaya wabah yang menimpa rakyat dapat dihentikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Arauna menyebut dirinya “hambanya,” suatu bentuk rujukan diri yang resmi dan merendah dalam tata krama istana. Maksudnya ialah “hambamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini menanyakan alasan kedatangan raja; “mengapa” alami dan tepat dalam bahasa Indonesia modern.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan istana yang penuh hormat sekaligus gelar kerajaan.
- source_word: עַבְדּוֹ
  choice: hambanya
  rationale: Mempertahankan bentuk orang ketiga harfiah dalam bahasa Ibrani sebagai gaya merendahkan diri di lingkungan istana; makna pragmatisnya ialah “hambamu”.
- source_word: לִקְנוֹת מֵעִמְּךָ אֶת הַגֹּרֶן
  choice: untuk membeli tempat pengirikan ini darimu
  rationale: “Membeli” menyatakan transaksi secara langsung; “tempat pengirikan” adalah padanan lazim bagi lokasi pertanian tersebut. “Ini” membuat objek tertentu itu alami dalam konteks percakapan langsung.
- source_word: לִבְנוֹת מִזְבֵּחַ
  choice: dan membangun mezbah
  rationale: Infinitif kedua menyatakan tujuan lanjutan. Penghubung “dan” menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan tujuannya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa mezbah dibangun bagi atau dipersembahkan kepada Yahweh; “bagi” alami dalam bahasa Indonesia.
- source_word: וְתֵעָצַר הַמַּגֵּפָה מֵעַל הָעָם
  choice: supaya wabah yang menimpa rakyat dapat dihentikan
  rationale: Mempertahankan nuansa tujuan/hasil dan bentuk pasif Niphal. Ungkapan “yang menimpa rakyat” menyampaikan idiom spasial מֵעַל secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa tujuan pada berhentinya wabah
  choice: supaya ... dapat dihentikan
  alternative: dan wabah itu akan berhenti
  rationale: Bentuk verba dalam konteks ini menyatakan hasil yang dimaksudkan, bukan kepastian mekanis bahwa pembangunan mezbah dengan sendirinya menjamin hasil tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “tuanku raja” serta “hambanya” mempertahankan suasana istana, sedangkan klausa akhir dibuat idiomatis tanpa menghilangkan gambaran bahwa wabah sedang menimpa rakyat.
