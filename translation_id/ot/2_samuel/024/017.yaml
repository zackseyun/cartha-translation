base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/017.yaml
  text: Then David said to the LORD, when he saw the angel striking the people, “Look, I have sinned, and I have done wrong; but these sheep—what have they done? Please let your hand be against me and against my father's house.”
translation:
  language: id
  text: Daud berkata kepada TUHAN ketika ia melihat malaikat yang sedang memukul rakyat, “Lihatlah, akulah yang telah berdosa dan akulah yang telah berbuat salah. Namun domba-domba ini, apakah yang telah mereka lakukan? Biarlah kiranya tangan-Mu menimpa aku dan keluarga ayahku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti kebiasaan baku terjemahan Alkitab bahasa Indonesia untuk nama ilahi YHWH, sekaligus selaras dengan lapisan konsultasi yang telah diaudit.
- source_word: הַמַּלְאָךְ הַמַּכֶּה בָעָם
  choice: malaikat yang sedang membinasakan rakyat
  rationale: Partisipel מַכֶּה menggambarkan tindakan yang tengah berlangsung; dalam konteks tulah maut, 'membinasakan' menyampaikan akibat tindakan itu secara alami dan tepat.
- source_word: הִנֵּה אָנֹכִי
  choice: Lihatlah, akulah
  rationale: הִנֵּה menandai seruan yang meminta perhatian, sedangkan pengulangan kata ganti orang pertama diberi penekanan dengan 'akulah'.
- source_word: הֶעֱוֵיתִי
  choice: telah berbuat salah
  rationale: Mempertahankan pembedaan dari חָטָאתִי ('telah berdosa') tanpa mempersempit maknanya menjadi satu jenis kesalahan tertentu.
- source_word: הַצֹּאן
  choice: domba-domba ini
  rationale: Metafora gembala-raja dalam teks sumber dipertahankan, dengan penunjuk 'ini' untuk unsur אֵלֶּה.
- source_word: בְבֵית אָבִי
  choice: keluarga ayahku
  rationale: Ungkapan Ibrani 'rumah ayahku' secara idiomatis menunjuk keluarga atau kaum ayah; 'keluarga ayahku' jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Tanggung jawab Daud dan penderitaan rakyat
  choice: Mempertahankan pengakuan Daud dan pertanyaan retorisnya tanpa memberi penjelasan tambahan
  alternative: Menjelaskan dalam teks bahwa rakyat sama sekali tidak bersalah atau bahwa hukuman itu semata-mata pengganti
  rationale: Teks menyuarakan permohonan Daud serta ketegangan moralnya, tetapi tidak menyelesaikan seluruh persoalan teologis dalam ayat ini.
- issue: Ungkapan 'tangan-Mu'
  choice: Mempertahankan gambaran tangan ilahi yang menimpa Daud dan keluarganya
  alternative: Mengganti dengan parafrasa seperti 'hukuman-Mu'
  rationale: Metafora antropomorfis berasal langsung dari teks dan penting bagi keterkaitan sastra dengan tindakan penghukuman sebelumnya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan emfatis 'akulah'. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia.
