  source_fidelity: 'Revisi diperlukan untuk menerjemahkan partisipel הַמַּכֶּה secara lebih langsung sebagai tindakan ‘memukul’; ‘membinasakan’ menyatakan hasil akhir yang tidak secara eksplisit dinyatakan oleh verba dalam ayat ini. Unsur-unsur lain dipertahankan: Daud berbicara kepada YHWH setelah melihat malaikat itu, pengakuan ganda atas dosa dan kesalahan, metafora ‘domba-domba ini’, serta permohonan agar tangan TUHAN menimpa dirinya dan keluarga ayahnya.'
