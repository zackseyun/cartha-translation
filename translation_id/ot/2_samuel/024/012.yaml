  to: 'Pergilah dan katakanlah kepada Daud, “Beginilah firman Yahweh: Aku menimpakan tiga hal[a] kepadamu. Pilihlah sendiri salah satunya, dan Aku akan melakukannya kepadamu.”'
  rationale: Revisi mempertajam nuansa tindakan ilahi yang ditujukan atas Daud dalam נוֹטֵל עָלֶיךָ, sambil mempertahankan nomina yang tidak dinyatakan secara eksplisit melalui "tiga hal" dan catatan kaki. Susunan pilihan dan pelaksanaannya diperbaiki agar lebih alami dalam bahasa Indonesia baku tanpa menambah penafsiran denominasi.
