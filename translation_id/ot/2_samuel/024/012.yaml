    issue: '"Aku mengajukan tiga hal kepadamu" menghaluskan citra נוֹטֵל עָלֶיךָ.'
    rationale: Verba dengan עַל menyatakan penempatan atas/penimpaan kepada Daud. Dalam konteks ini tiga hal tersebut adalah hukuman yang akan segera dirinci, sehingga "menimpakan" lebih setia tanpa perlu menyebutnya "hukuman" dalam teks utama.
  - severity: low
    issue: '"Pilihlah satu di antaranya bagimu sendiri" kurang alami dan repetitif.'
    rationale: Keterangan "bagimu sendiri" setelah objek pilihan tidak lazim; "Pilihlah sendiri salah satunya" menyampaikan datif refleksif secara lebih alami.
  - severity: low
    issue: '"Aku akan melakukannya terhadapmu" agak kaku.'
    rationale: '"Aku akan melakukannya kepadamu" adalah padanan Indonesia yang lebih lazim untuk tindakan yang diarahkan kepada seseorang dan tetap mempertahankan ambiguitas verba עשה.'
