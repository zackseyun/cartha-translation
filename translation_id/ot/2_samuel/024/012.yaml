  text: הָל֞וֹךְ וְ/דִבַּרְתָּ֣ אֶל דָּוִ֗ד כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁלֹ֕שׁ אָנֹכִ֖י נוֹטֵ֣ל עָלֶ֑י/ךָ בְּחַר לְ/ךָ֥ אַֽחַת מֵ/הֶ֖ם וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/012.yaml
  text: 'Go and speak to David[a], ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: id
  text: 'Pergilah dan katakanlah kepada Daud, “Beginilah firman Yahweh: Aku menimpakan tiga hal[a] kepadamu. Pilihlah sendiri salah satunya, dan Aku akan melakukannya kepadamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, teks Ibrani hanya berbunyi “tiga”; kata bendanya tersirat dari konteks. Terjemahan lain yang mungkin: “tiga pilihan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ וְדִבַּרְתָּ
  choice: Pergilah dan katakanlah
  rationale: Gabungan infinitif absolut dan verba finit menegaskan perintah. Bentuk ini menyampaikan urutan tindakan secara wajar dalam bahasa Indonesia.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula utusan kenabian dengan laras yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שָׁלֹשׁ
  choice: tiga hal
  rationale: Teks Ibrani hanya menyebut bilangan 'tiga'; nomina 'hal' ditambahkan karena diperlukan dalam bahasa Indonesia dan tetap lebih netral daripada 'pilihan' atau 'hukuman'.
- source_word: אָנֹכִי נוֹטֵל עָלֶיךָ
  choice: Aku mengajukan ... kepadamu
  rationale: Dalam konteks tiga perkara yang harus dipilih, terjemahan ini menyampaikan tindakan menempatkan opsi di hadapan Daud tanpa menghilangkan bahwa semuanya ditujukan kepadanya.
- source_word: בְּחַר לְךָ אַחַת מֵהֶם
  choice: Pilihlah satu di antaranya bagimu sendiri
  rationale: '''Pilihlah'' menerjemahkan בחר, sedangkan ''bagimu sendiri'' mempertahankan datif לְךָ dan tanggung jawab pribadi Daud atas pilihannya.'
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: dan Aku akan melakukannya terhadapmu
  rationale: Dalam konteks penghukuman, 'terhadapmu' menyampaikan arah yang merugikan dari tindakan itu dan menghindari kesan menguntungkan yang dapat timbul dari 'bagimu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan gelar.
- issue: Sifat tiga perkara yang diajukan kepada Daud
  choice: tiga hal
  alternative: tiga pilihan / tiga hukuman
  rationale: Ayat ini hanya menyatakan 'tiga' dan konteks selanjutnya menjelaskan isinya. 'Tiga hal' tidak terlebih dahulu membatasi maknanya sebagai opsi netral maupun secara eksplisit menamainya hukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras kenabian yang bermartabat. Bentuk perintah berakhiran -lah mempertahankan ketegasan, sedangkan susunan kalimat dijaga agar mudah dipahami pembaca umum.
