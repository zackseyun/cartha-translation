  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤ד מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יֵּעָתֵ֤ר יְהוָה֙ לָ/אָ֔רֶץ וַ/תֵּעָצַ֥ר הַ/מַּגֵּפָ֖ה מֵ/עַ֥ל יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/025.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings[a]. So Yahweh responded to the land[c][b], and the plague was restrained from Israel.
translation:
  language: id
  text: Di sana Daud membangun mezbah bagi Yahweh[c] dan mempersembahkan kurban bakaran serta kurban keselamatan[a]. Lalu Yahweh mengabulkan permohonan bagi negeri itu[b], dan tulah yang menimpa Israel pun berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan”; istilah Ibraninya juga berkaitan dengan damai, kesejahteraan, dan keutuhan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani menunjukkan bahwa Yahweh menanggapi dengan berkenan suatu permohonan mengenai atau demi negeri itu; dapat juga diterjemahkan “menjawab doa bagi negeri itu”.
    reason: alternative_reading
  - marker: c
    text: “Yahweh” menerjemahkan nama ilahi YHWH (יהוה).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִד מִזְבֵּחַ
  choice: Di sana Daud membangun mezbah
  rationale: Mengikuti urutan dan makna narasi Ibrani dengan ungkapan Indonesia yang alami; “mezbah” adalah istilah baku untuk tempat persembahan kurban.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa mezbah itu didirikan bagi atau untuk Yahweh; nama perjanjian יהוה dipertahankan sebagai “Yahweh”.
- source_word: וַיַּעַל עֹלוֹת
  choice: mempersembahkan kurban bakaran
  rationale: עלה dalam konteks kurban berarti mempersembahkan, sedangkan עֹלוֹת adalah istilah teknis bagi kurban yang dibakar seluruhnya.
- source_word: וּשְׁלָמִים
  choice: serta kurban keselamatan
  rationale: “Kurban keselamatan” mempertahankan hubungan leksikal שְׁלָמִים dengan damai, kesejahteraan, dan keutuhan tanpa membatasi maknanya hanya pada persekutuan.
- source_word: וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Lalu Yahweh mengabulkan permohonan bagi negeri itu
  rationale: Bentuk Niphal dari עתר menyatakan tanggapan yang berkenan terhadap permohonan. “Bagi negeri itu” mempertahankan לָאָרֶץ dan tidak menentukan secara berlebihan siapa yang memohon.
- source_word: וַתֵּעָצַר הַמַּגֵּפָה מֵעַל יִשְׂרָאֵל
  choice: dan tulah yang menimpa Israel pun berhenti
  rationale: Ungkapan ini menyampaikan bahwa tulah ditahan atau dihentikan dari atas Israel dalam bahasa Indonesia yang alami; “tulah” cocok dengan konteks hukuman mematikan dalam pasal ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan catatan kaki menjelaskan tradisi penulisannya.
- issue: Makna tanggapan ilahi dalam וַיֵּעָתֵר יְהוָה לָאָרֶץ
  choice: Yahweh mengabulkan permohonan bagi negeri itu
  alternative: Yahweh berkenan kepada negeri itu; Yahweh menjawab doa bagi negeri itu
  rationale: Kata kerja Ibrani mengandung gagasan bahwa Allah menanggapi permohonan dengan berkenan, meskipun ayat ini tidak menyebutkan secara eksplisit bentuk permohonan ataupun orang yang menyampaikannya. Pilihan ini mempertahankan unsur permohonan tanpa menambahkan rincian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat lancar bagi pembaca umum sambil mempertahankan istilah kurban, nama ilahi, serta nuansa bahwa kata kerja עתר menyiratkan tanggapan berkenan terhadap permohonan.
