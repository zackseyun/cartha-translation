  text: וַ/יָּבֹא גָ֥ד אֶל דָּוִ֖ד וַ/יַּגֶּד ל֑/וֹ וַ/יֹּ֣אמֶר ל֡/וֹ הֲ/תָב֣וֹא לְ/ךָ֣ שֶֽׁבַע שָׁנִ֣ים רָעָ֣ב בְּ/אַרְצֶ֡/ךָ אִם שְׁלֹשָׁ֣ה חֳ֠דָשִׁים נֻסְ/ךָ֨ לִ/פְנֵֽי צָרֶ֜י/ךָ וְ/ה֣וּא רֹדְפֶ֗/ךָ וְ/אִם הֱ֠יוֹת שְׁלֹ֨שֶׁת יָמִ֥ים דֶּ֨בֶר֙ בְּ/אַרְצֶ֔/ךָ עַתָּה֙ דַּ֣ע וּ/רְאֵ֔ה מָה אָשִׁ֥יב שֹׁלְחִ֖/י דָּבָֽר־־־׀׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/013.yaml
  text: So Gad came to David and told him[a], and said to him[c][b], “Shall seven years of famine come to you in your land? Or will you flee three months before your adversaries while they pursue you? Or shall there be three days of pestilence in your land? Now know and see what answer I should return to the one who sent me.”
translation:
  language: id
  text: Lalu Gad datang kepada Daud, memberitahukan kepadanya, dan berkata, “Apakah tujuh tahun kelaparan akan menimpa negerimu?[a] Atau engkau akan melarikan diri selama tiga bulan dari musuh-musuhmu sementara mereka mengejarmu? Atau akan terjadi wabah[b] selama tiga hari di negerimu? Sekarang, pertimbangkanlah baik-baik jawaban apa yang harus kusampaikan kepada yang mengutus aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Masoret berbunyi “tujuh tahun kelaparan”; kisah sejajar dalam 1 Tawarikh 21:12 berbunyi “tiga tahun kelaparan.”
    reason: textual_variant
  - marker: b
    text: Atau “sampar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גָד אֶל דָּוִד
  choice: Lalu Gad datang kepada Daud
  rationale: Menerjemahkan verba naratif בוא secara langsung dan wajar dalam bahasa Indonesia.
- source_word: וַיַּגֶּד לוֹ
  choice: menyampaikan pesan kepadanya
  rationale: Bentuk Hifil נגד berarti memberitahukan atau menyampaikan; 'menyampaikan pesan' menghindari pengulangan janggal dengan ujaran langsung berikutnya.
- source_word: שֶׁבַע שָׁנִים רָעָב בְּאַרְצֶךָ
  choice: tujuh tahun kelaparan akan menimpa negerimu
  rationale: רָעָב menunjuk pada bencana kelaparan, bukan sekadar rasa lapar. Susunan Indonesia ini menyatakan durasi dan dampaknya secara alami.
- source_word: נֻסְךָ לִפְנֵי צָרֶיךָ
  choice: engkau harus melarikan diri selama tiga bulan dari musuh-musuhmu
  rationale: Klausa Ibrani bersifat eliptis; terjemahan ini mempertahankan Daud sebagai pihak yang melarikan diri dan צַר sebagai musuh atau lawan.
- source_word: וְהוּא רֹדְפֶךָ
  choice: sementara mereka mengejarmu
  rationale: Pronomina tunggal Ibrani dipahami secara kolektif dengan 'musuh-musuhmu'; bentuk jamak lebih alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: דֶּבֶר
  choice: wabah
  rationale: דֶּבֶר berarti sampar, wabah, atau penyakit menular yang mematikan. 'Wabah' jelas dan alami bagi pembaca modern; alternatif 'sampar' dicatat.
- source_word: עַתָּה דַּע וּרְאֵה
  choice: Sekarang pertimbangkanlah baik-baik
  rationale: Pasangan imperatif harfiah 'ketahuilah dan lihatlah' berfungsi sebagai desakan untuk menimbang dan memutuskan; ungkapan Indonesia ini menyampaikan fungsi tersebut.
- source_word: מָה אָשִׁיב שֹׁלְחִי דָּבָר
  choice: jawaban apa yang harus kusampaikan kepada Dia yang mengutus aku
  rationale: השיב דבר merupakan idiom untuk membawa kembali jawaban. Kapitalisasi 'Dia' menunjukkan bahwa pengutus Gad adalah TUHAN dalam konteks dekat, tanpa menambahkan nama yang tidak terdapat dalam klausa ini.
theological_decisions:
- issue: Perbedaan angka dengan kisah sejajar dalam 1 Tawarikh 21:12
  choice: Teks utama menerjemahkan bacaan Masoret 'tujuh tahun kelaparan'.
  alternative: Kisah sejajar dalam 1 Tawarikh 21:12 berbunyi 'tiga tahun kelaparan'.
  rationale: WLC pada 2 Samuel 24:13 jelas membaca שֶׁבַע, 'tujuh'. Bacaan itu dipertahankan dan perbedaan kanonis tidak diselaraskan secara diam-diam, melainkan dijelaskan dalam catatan kaki.
- issue: Identitas pengutus Gad
  choice: Menerjemahkan 'Dia yang mengutus aku' dengan kapitalisasi pronomina.
  alternative: Menerjemahkan secara netral 'orang yang mengutus aku'.
  rationale: Konteks langsung ayat 11–12 mengidentifikasi pengutus sebagai TUHAN. Kapitalisasi memperjelas rujukan dalam konvensi Indonesia, tetapi tidak mengganti ungkapan partisipial Ibrani dengan nama ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga pilihan dipertahankan dengan jelas. Bentuk 'engkau' dipakai sesuai register narasi Kitab Suci, sedangkan ungkapan idiomatis dipilih untuk menghindari kekakuan harfiah.
