revisions:
- from: Namun Yoab berkata kepada raja, “Kiranya Yahweh, Allahmu, menambah jumlah rakyat seratus kali lipat dari jumlah mereka sekarang, dan kiranya tuanku raja menyaksikannya dengan mata kepala sendiri.[a] Namun, mengapa tuanku raja menginginkan hal ini?”
  to: Namun Yoab berkata kepada raja, “Kiranya Yahweh, Allahmu, menjadikan jumlah rakyat seratus kali lipat dari jumlah mereka sekarang, dan kiranya tuanku raja menyaksikannya.[a] Namun, mengapa tuanku raja menginginkan hal ini?”
  rationale: Revisi memperjelas bahwa harapan Yoab ialah jumlah rakyat menjadi seratus kali jumlah sekarang, bukan sekadar bertambah sebanyak seratus kali jumlah itu. Ungkapan idiomatis tambahan tentang "mata kepala sendiri" dihilangkan agar lebih dekat kepada sumber, sedangkan objek tersirat dan makna bahwa raja hidup untuk melihat pertambahan itu tetap dijelaskan dalam catatan kaki.
