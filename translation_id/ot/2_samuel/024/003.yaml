base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/003.yaml
  text: But Joab said to the king[a], “May Yahweh your God add to the people a hundred times as many as they are, and may the eyes of my lord the king see it. But why does my lord the king delight in this thing?”
translation:
  language: id
  text: Namun Yoab berkata kepada raja, “Kiranya Yahweh, Allahmu, menjadikan jumlah rakyat seratus kali lipat dari jumlah mereka sekarang, dan kiranya tuanku raja menyaksikannya.[a] Namun, mengapa tuanku raja menginginkan hal ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan mata tuanku raja melihat.” Objek yang dilihat tidak disebutkan dalam bahasa Ibrani; maksudnya ialah agar raja hidup untuk menyaksikan pertambahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Bentuk naratif ini melanjutkan kisah, tetapi dalam konteks jawaban Yoab menentang perintah raja; karena itu, 'Namun' menyatakan hubungan adversatif secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: וְיוֹסֵף
  choice: Kiranya ... menambah
  rationale: Dalam konteks ini bentuk tersebut mengungkapkan harapan atau berkat Yoab.
- source_word: אֶל הָעָם
  choice: jumlah rakyat
  rationale: עָם berarti 'rakyat/bangsa'. Penambahan kata 'jumlah' membuat gagasan pertambahan penduduk jelas dalam bahasa Indonesia tanpa mempersempitnya menjadi tentara.
- source_word: כָּהֵם וְכָהֵם מֵאָה פְעָמִים
  choice: seratus kali lipat dari jumlah mereka sekarang
  rationale: Ungkapan idiomatis ini mengharapkan jumlah rakyat bertambah menjadi seratus kali jumlah yang ada saat itu.
- source_word: וְעֵינֵי אֲדֹנִי הַמֶּלֶךְ רֹאוֹת
  choice: dan kiranya tuanku raja menyaksikannya dengan mata kepala sendiri
  rationale: Klausa ini menyatakan harapan agar raja hidup dan melihat pertambahan itu. Objek verba tidak dinyatakan dalam bahasa Ibrani, tetapi tersirat dari konteks.
- source_word: חָפֵץ
  choice: menginginkan
  rationale: Dalam pertanyaan keberatan ini, verba tersebut menyatakan kehendak atau keinginan raja terhadap tindakan yang diperintahkan; 'menginginkan' lebih alami daripada terjemahan harfiah 'menyenangi'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; transliterasi mempertahankan pembedaan antara nama itu dan gelar 'Tuhan'.
- issue: Nuansa חָפֵץ terhadap sensus
  choice: menginginkan hal ini
  alternative: menyenangi hal ini
  rationale: Pilihan ini mempertahankan pertanyaan Yoab mengenai kehendak raja tanpa menyimpulkan secara berlebihan bahwa raja menikmati tindakan tersebut secara emosional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan istana 'tuanku raja' mempertahankan formula penghormatan אֲדֹנִי הַמֶּלֶךְ. Ungkapan 'dengan mata kepala sendiri' dipakai secara idiomatis untuk menyampaikan penekanan pada mata raja, sementara catatan kaki mempertahankan bentuk dan ketaksaan sumber.
