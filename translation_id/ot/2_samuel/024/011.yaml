  text: וַ/יָּ֥קָם דָּוִ֖ד בַּ/בֹּ֑קֶר וּ/דְבַר יְהוָ֗ה הָיָה֙ אֶל גָּ֣ד הַ/נָּבִ֔יא חֹזֵ֥ה דָוִ֖ד לֵ/אמֹֽרפ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/011.yaml
  text: When David arose in the morning[a], the word of Yahweh had come to Gad the prophet, David’s seer, saying,
translation:
  language: id
  text: 'Ketika Daud bangun pada pagi hari, firman Yahweh telah datang[a] kepada Gad, sang nabi dan pelihat Daud, demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “firman Yahweh ada kepada Gad.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד בַּבֹּקֶר
  choice: Ketika Daud bangun pada pagi hari
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan frasa temporal Ibrani menyatakan waktunya. Kata “ketika” menghubungkan tindakan Daud dengan pewahyuan kepada Gad secara alami tanpa menghilangkan hubungan waktunya.
- source_word: וּדְבַר יְהוָה
  choice: firman Yahweh
  rationale: “Firman” mempertahankan nuansa formula pewahyuan kenabian, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: הָיָה אֶל
  choice: telah datang kepada
  rationale: Dalam formula kenabian, ungkapan harfiah “ada kepada” lazim menyatakan datangnya firman ilahi. “Telah datang” juga mencerminkan kemungkinan bahwa pewahyuan kepada Gad mendahului saat Daud bangun.
- source_word: גָּד הַנָּבִיא
  choice: Gad, sang nabi
  rationale: Nama diri dipertahankan sebagai Gad; נָבִיא diterjemahkan “nabi”. Kata “sang” menandai aposisi secara alami dalam bahasa Indonesia.
- source_word: חֹזֵה דָוִד
  choice: pelihat Daud
  rationale: “Pelihat” mempertahankan istilah jabatan חֹזֶה dan membedakannya dari “nabi”; konstruksi ini menyatakan peran Gad dalam hubungan dengan Daud.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Ungkapan ini memperkenalkan ucapan langsung yang berlanjut pada ayat berikutnya; “demikian:” alami dan jelas dalam narasi Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan waktu antara Daud bangun dan firman kepada Gad
  choice: telah datang
  alternative: datang; ada kepada
  rationale: Konteks memungkinkan pembacaan pluskuamperfek bahwa firman itu sudah datang kepada Gad ketika Daud bangun, tetapi bentuk Ibrani tidak menandai kala secara eksplisit. Catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Firman” serta “pelihat” mempertahankan istilah khas kenabian, sementara susunan kalimat dibuat mudah dipahami. Penanda catatan kaki ditempatkan langsung pada ungkapan yang dijelaskannya.
