  yaml_path: translation/ot/2_samuel/024/008.yaml
  text: They traveled throughout all the land, and at the end of nine months and twenty days they came to Jerusalem.
translation:
  language: id
  text: Mereka menjelajahi seluruh negeri itu, lalu setelah sembilan bulan dua puluh hari, mereka tiba di Yerusalem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁטוּ
  choice: mereka menjelajahi
  rationale: Bentuk dari שׁוּט menggambarkan bergerak ke sana kemari melintasi suatu wilayah. Dalam konteks perjalanan pendataan, “menjelajahi” menyampaikan cakupan perjalanan tanpa mengesankan pengembaraan tanpa tujuan.
- source_word: בְּכָל הָאָרֶץ
  choice: seluruh negeri itu
  rationale: Gabungan ב + כל + הארץ menunjukkan gerak melintasi keseluruhan wilayah yang sedang dibicarakan. “Negeri” lebih tepat daripada “bumi” dalam konteks teritorial ini, dan “itu” menandai wilayah yang telah jelas dari konteks.
- source_word: וַיָּבֹאוּ
  choice: mereka tiba
  rationale: בוא dapat berarti datang atau tiba. Karena Yerusalem disebut sebagai tujuan akhir perjalanan, “tiba” paling alami dalam bahasa Indonesia.
- source_word: מִקְצֵה
  choice: setelah
  rationale: Dalam ungkapan waktu ini, מִקְצֵה menandai berakhirnya jangka waktu. “Setelah” menyatakan bahwa kedatangan terjadi ketika masa tersebut telah genap dan lebih alami daripada terjemahan harfiah “pada akhir dari”.
- source_word: תִשְׁעָה חֳדָשִׁים וְעֶשְׂרִים יוֹם
  choice: sembilan bulan dua puluh hari
  rationale: Ini adalah ungkapan durasi langsung. Dalam bahasa Indonesia, penyebutan satu rentang waktu gabungan tanpa kata “dan” terdengar alami dan tetap tepat.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
