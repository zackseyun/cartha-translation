base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/020.yaml
  text: Araunah looked out and saw the king and his servants passing by him[a]. So Araunah went out and bowed down to the king with his face to the ground.
translation:
  language: id
  text: Arauna memandang keluar dan melihat raja beserta para pelayannya sedang mendekatinya.[a] Lalu Arauna keluar dan bersujud kepada raja dengan wajahnya ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang melewatinya” atau “sedang datang kepadanya”; ungkapan Ibrani secara harfiah menggambarkan raja dan para pelayannya bergerak dalam hubungan dengan Arauna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: menengok
  rationale: Kata kerja ini menggambarkan tindakan melihat dari suatu tempat atau melalui bukaan; “menengok” menyampaikan nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: וַיַּרְא
  choice: melihat
  rationale: 'Padanan langsung bagi ראה yang mempertahankan urutan naratif: Arauna menengok, lalu melihat.'
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam konteks kerajaan, עבד dapat menunjuk para pelayan atau pejabat yang mengiringi raja. “Para pegawai” cukup luas dan tidak memberi kesan bahwa mereka semata-mata pelayan rumah tangga.
- source_word: עֹבְרִים עָלָיו
  choice: sedang mendekatinya
  rationale: Ungkapan עבר dengan על menggambarkan gerak dalam hubungan dengan Arauna. Karena konteksnya ialah kedatangan Daud ke tempat pengirikan Arauna, “mendekatinya” menyampaikan arah gerak secara alami, sementara catatan kaki mempertahankan kemungkinan leksikal lainnya.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Padanan alami bagi יצא, sesuai dengan sudut pandang Arauna yang sebelumnya menengok dari tempatnya.
- source_word: וַיִּשְׁתַּחוּ
  choice: bersujud di hadapan
  rationale: Mengungkapkan tindakan membungkuk atau merebahkan diri sebagai penghormatan kepada raja tanpa menyiratkan penyembahan ilahi.
- source_word: אַפָּיו אָרְצָה
  choice: dengan muka sampai ke tanah
  rationale: Menyampaikan gambaran idiomatis tentang sujud penuh secara jelas dan alami.
- source_word: אֲרַוְנָה
  choice: Arauna
  rationale: Transliterasi bentuk nama yang terdapat dalam teks Ibrani kitab Samuel; “Ornan” berasal dari bentuk dalam kitab Tawarikh.
theological_decisions:
- issue: Sifat tindakan Arauna di hadapan raja
  choice: Penghormatan sipil kepada raja, diterjemahkan “bersujud di hadapan raja”
  alternative: “menyembah raja”
  rationale: Kata Ibrani ini dapat dipakai baik untuk penyembahan maupun penghormatan dengan bersujud. Karena objeknya di sini adalah Raja Daud sebagai manusia, terjemahan tersebut mempertahankan tindakan fisiknya tanpa mengesankan penyembahan ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Beserta” menjaga hubungan raja dan rombongannya, sedangkan “bersujud di hadapan” sesuai untuk penghormatan resmi kepada seorang raja.
