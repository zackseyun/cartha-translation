  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֥ה דֶּ֨בֶר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/הַ/בֹּ֖קֶר וְ/עַד עֵ֣ת מוֹעֵ֑ד וַ/יָּ֣מָת מִן הָ/עָ֗ם מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע שִׁבְעִ֥ים אֶ֖לֶף אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/015.yaml
  text: So Yahweh sent a plague on Israel from the morning until the appointed time[a], and seventy thousand men of the people died, from Dan to Beersheba.
translation:
  language: id
  text: Maka Yahweh mendatangkan wabah atas Israel sejak pagi sampai waktu yang ditetapkan[a]. Tujuh puluh ribu orang laki-laki dari antara rakyat meninggal, dari Dan sampai Bersyeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sampai waktu yang telah ditentukan." Frasa Ibrani ini dapat merujuk pada waktu yang telah ditetapkan; kemungkinan yang lebih kecil dalam konteks ini ialah "waktu pertemuan."
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: mendatangkan
  rationale: Secara harfiah berarti 'memberikan', tetapi bersama דֶּבֶר verba ini menyatakan bahwa Yahweh menyebabkan wabah menimpa Israel. 'Mendatangkan' alami dalam bahasa Indonesia dan mempertahankan pelaku ilahi secara langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga identitas personal dalam teks Ibrani dipertahankan.
- source_word: דֶּבֶר
  choice: wabah
  rationale: Istilah Indonesia modern yang jelas untuk penyakit menular mematikan dalam konteks penghukuman ini.
- source_word: בְּיִשְׂרָאֵל
  choice: atas Israel
  rationale: Menunjukkan malapetaka yang menimpa bangsa Israel; ungkapan ini alami dan sesuai dengan konteks penghukuman.
- source_word: מֵהַבֹּקֶר
  choice: sejak pagi
  rationale: Menyatakan titik awal temporal secara alami dalam bahasa Indonesia.
- source_word: וְעַד עֵת מוֹעֵד
  choice: sampai waktu yang ditetapkan
  rationale: מוֹעֵד di sini paling mungkin menunjuk waktu tertentu atau waktu yang telah ditentukan. Pilihan ini tetap cukup terbuka mengenai saat tepat yang dimaksud.
- source_word: וַיָּמָת מִן הָעָם
  choice: Dari antara rakyat ... tewaslah
  rationale: מִן־הָעָם mengidentifikasi korban sebagai orang-orang dari kalangan rakyat. 'Tewaslah' sesuai untuk kematian akibat bencana dan mempertahankan penekanan naratif.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: mulai dari Dan sampai Bersyeba
  rationale: Ungkapan geografis ini menunjukkan seluruh bentang Israel dari utara ke selatan tanpa perlu menambahkan penafsiran itu ke dalam teks.
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: tujuh puluh ribu orang laki-laki
  rationale: אִישׁ berbentuk maskulin dan digunakan secara distributif sesudah bilangan; terjemahan ini mempertahankan rincian leksikal tersebut.
theological_decisions:
- issue: Peran ilahi dalam penghukuman
  choice: Yahweh mendatangkan wabah atas Israel
  alternative: Yahweh membiarkan wabah menimpa Israel
  rationale: Teks Ibrani secara langsung menjadikan Yahweh sebagai pelaku dan tidak memakai verba yang berarti sekadar mengizinkan. Terjemahan tidak melunakkan ketegangan teologis itu.
- issue: Makna עֵת מוֹעֵד
  choice: waktu yang ditetapkan
  alternative: waktu yang tertentu; waktu pertemuan
  rationale: Dalam konteks ini, makna temporal berupa batas waktu yang telah ditetapkan paling sesuai. Karena frasa tersebut memiliki kemungkinan nuansa lain, alternatifnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat kedua mempertahankan cakupan geografis serta jumlah korban tanpa terdengar kaku. Istilah 'orang laki-laki' dipakai untuk mencerminkan אִישׁ secara eksplisit.
