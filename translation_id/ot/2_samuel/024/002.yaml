  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל יוֹאָ֣ב שַׂר הַ/חַ֣יִל אֲשֶׁר אִתּ֗/וֹ שֽׁוּט נָ֞א בְּ/כָל שִׁבְטֵ֤י יִשְׂרָאֵל֙ מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וּ/פִקְד֖וּ אֶת הָ/עָ֑ם וְ/יָ֣דַעְתִּ֔י אֵ֖ת מִסְפַּ֥ר הָ/עָֽם־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/002.yaml
  text: So the king said to Joab[a], the commander of the army who was with him, “Go about now through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know the number of the people.”
translation:
  language: id
  text: Lalu raja berkata kepada Yoab, panglima tentara yang bersama dia, “Pergilah sekarang berkeliling ke semua suku Israel, dari Dan sampai Bersyeba, dan hitunglah[a] rakyat itu, supaya aku mengetahui jumlah mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “daftarlah rakyat itu.” Kata kerja Ibrani dapat berarti menghitung atau mendaftarkan orang, kadang-kadang dalam konteks militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw-konsekutif melanjutkan rangkaian peristiwa; “lalu” alami dalam narasi Indonesia dan tetap menunjukkan urutan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar definit yang dipakai teks Ibrani dan tidak menggantinya dengan nama Daud.
- source_word: שַׂר הַחַיִל
  choice: panglima tentara
  rationale: שַׂר menyatakan pemimpin atau pejabat, sedangkan חַיִל dalam konteks ini menunjuk pada kekuatan militer. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Menyampaikan bahwa Yoab berada bersama raja tanpa menambahkan keterangan tempat yang tidak dinyatakan dalam teks.
- source_word: שׁוּט נָא
  choice: Pergilah sekarang menjelajahi
  rationale: שׁוּט menggambarkan bergerak menjelajahi suatu wilayah. נָא memberi pelunakan atau dorongan pada perintah; “sekarang” mengikuti daya ujar konteks tanpa menjadikan perintah raja terdengar terlalu santai.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: seluruh suku Israel
  rationale: Dengan verba gerak, frasa ini menunjukkan perjalanan melintasi keseluruhan wilayah suku-suku Israel.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Mempertahankan merisme geografis yang menyatakan seluruh bentang negeri, dengan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וּפִקְדוּ
  choice: dan hitunglah
  rationale: Dalam konteks ini פקד menunjuk pada pencacahan atau pendaftaran penduduk. “Hitunglah” paling jelas bagi pembaca umum, sementara kemungkinan nuansa pendaftaran dipertahankan dalam catatan kaki.
- source_word: אֶת הָעָם
  choice: rakyat itu
  rationale: עָם berarti rakyat atau bangsa secara luas. Pilihan ini tidak mempersempit acuannya menjadi tentara atau laki-laki yang sanggup berperang.
- source_word: וְיָדַעְתִּי
  choice: supaya aku mengetahui
  rationale: Dalam konteks perintah ini, bentuk tersebut menyatakan tujuan atau hasil yang dimaksudkan oleh raja.
- source_word: מִסְפַּר הָעָם
  choice: jumlah mereka
  rationale: Mengungkapkan maksud frasa konstruksi Ibrani secara alami dalam bahasa Indonesia; pronomina merujuk jelas kepada rakyat yang baru disebut.
theological_decisions:
- issue: Cakupan הָעָם dalam konteks militer-administratif
  choice: rakyat itu
  alternative: pasukan atau laki-laki yang sanggup berperang
  rationale: Walaupun Yoab adalah panglima dan sensus ini memiliki implikasi militer, teks memakai עָם, istilah umum untuk rakyat, bukan istilah khusus bagi prajurit. Terjemahan mempertahankan keluasan rujukan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan bentuk perintah langsung serta rentang geografis teks, tetapi menghindari susunan yang kaku. Penanda catatan kaki ditempatkan sesudah “hitunglah,” yaitu kata yang memiliki alternatif leksikal.
