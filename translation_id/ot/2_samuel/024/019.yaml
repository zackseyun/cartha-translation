  text: וַ/יַּ֤עַל דָּוִד֙ כִּ/דְבַר גָּ֔ד כַּ/אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/019.yaml
  text: So David went up according to the word of Gad, just as Yahweh had commanded.
translation:
  language: id
  text: Lalu Daud naik sesuai dengan perkataan Gad, tepat seperti yang diperintahkan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Lalu ... naik
  rationale: Kata kerja עָלָה menyatakan gerak naik. “Naik” mempertahankan nuansa arah dalam bahasa Indonesia yang ringkas dan wajar.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: כִּדְבַר
  choice: sesuai dengan perkataan
  rationale: Gabungan כ + דָּבָר berarti bertindak sesuai dengan perkataan atau pesan seseorang. “Perkataan” mempertahankan unsur eksplisit דָּבָר dan kaitannya dengan pesan kenabian Gad.
- source_word: גָּד
  choice: Gad
  rationale: Transliterasi baku nama nabi tersebut dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan Daud dengan perintah Yahweh; “tepat seperti” menyampaikan hubungan itu dengan jelas dan alami.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif Indonesia memungkinkan klausa yang alami sekaligus tidak menambahkan objek atau penerima perintah yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang lazim.
- issue: Penerima perintah Yahweh tidak dinyatakan secara eksplisit
  choice: seperti yang diperintahkan Yahweh
  alternative: seperti yang diperintahkan Yahweh kepada Gad
  rationale: Teks Ibrani tidak menyebutkan objek atau penerima צִוָּה dalam ayat ini. Terjemahan tidak menambahkan “kepada Gad”, sehingga ketidaktersuratan gramatikal sumber tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan gerak “naik”, perantaraan perkataan Gad, serta perintah Yahweh tanpa menambahkan penerima perintah yang tidak dinyatakan.
