base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/009.yaml
  text: 'Joab gave the number of the census of the people to the king: Israel was eight hundred thousand valiant men who drew the sword[a], and the men of Judah were five hundred thousand men.'
translation:
  language: id
  text: Yoab menyerahkan kepada raja jumlah hasil sensus rakyat itu. Di Israel ada delapan ratus ribu orang gagah perkasa yang menghunus pedang[a], dan orang-orang Yehuda berjumlah lima ratus ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bagian sejajar dalam 1 Tawarikh 21:5 mencantumkan jumlah yang berbeda: 1.100.000 untuk Israel dan 470.000 untuk Yehuda. Terjemahan di sini mengikuti teks Ibrani 2 Samuel tanpa menyelaraskan angka-angka tersebut.'
    reason: cross_reference
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: jumlah hasil sensus rakyat itu
  rationale: Rangkaian konstruksi ini menyatakan angka atau jumlah yang diperoleh dari pendataan rakyat. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan konteks sensus.
- source_word: וַתְּהִי יִשְׂרָאֵל
  choice: Di Israel ada
  rationale: Bentuk ini menyampaikan hasil penghitungan dengan lancar dalam bahasa Indonesia tanpa mengubah Israel menjadi sebutan bagi setiap individu.
- source_word: אִישׁ חַיִל
  choice: prajurit gagah berani
  rationale: Dalam konteks pendataan militer, frasa ini menunjuk kepada laki-laki yang kuat atau cakap berperang. 'Prajurit gagah berani' mempertahankan nuansa keberanian dan fungsi militernya.
- source_word: שֹׁלֵף חֶרֶב
  choice: yang dapat menghunus pedang
  rationale: Ungkapan harfiahnya adalah 'yang menghunus pedang' dan secara idiomatis menunjuk kepada orang yang siap atau cakap bertempur. Kata 'dapat' membuat fungsi ungkapan itu jelas tanpa mengganti citra konkretnya.
- source_word: וְאִישׁ יְהוּדָה
  choice: dan orang-orang Yehuda
  rationale: Kata אִישׁ berbentuk tunggal tetapi dipakai secara kolektif bersama Yehuda. Bentuk jamak Indonesia menyampaikan maksud kolektifnya secara wajar.
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף אִישׁ
  choice: berjumlah lima ratus ribu orang
  rationale: Kata אִישׁ terakhir dipertahankan sebagai 'orang', sementara 'berjumlah' menghasilkan susunan predikat yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Perbedaan angka dengan bagian sejajar dalam 1 Tawarikh 21:5
  choice: 'Mengikuti teks Masoret 2 Samuel: Israel delapan ratus ribu dan Yehuda lima ratus ribu.'
  alternative: Menyelaraskan angkanya dengan 1 Tawarikh atau menjelaskan perbedaannya sebagai kategori pasukan yang berlainan.
  rationale: Terjemahan harus menyajikan angka dalam teks sumber 2 Samuel tanpa memasukkan teori harmonisasi. Perbedaan dengan bagian sejajar disebutkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'sensus' sesuai dengan konteks pendataan, sedangkan 'menghunus pedang' mempertahankan gambaran militer konkret dari bahasa Ibrani.
