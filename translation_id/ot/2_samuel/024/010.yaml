  to: Setelah Daud menghitung rakyat, hati Daud tertegur.[a] Lalu Daud berkata kepada Yahweh, “Aku telah sangat berdosa dalam apa yang telah kulakukan. Sekarang, ya Yahweh, mohon singkirkanlah kesalahan hamba-Mu,[b] sebab aku telah bertindak sangat bodoh.”
