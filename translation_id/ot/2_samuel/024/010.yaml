base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/010.yaml
  text: After that[a], David’s heart struck him after he had counted the people. And David said to Yahweh, “I have sinned greatly in what I have done. And now, Yahweh, please take away the guilt of your servant[c][b], for I have acted very foolishly.”
translation:
  language: id
  text: Setelah Daud menghitung rakyat, hati Daud tertegur.[a] Lalu Daud berkata kepada Yahweh, “Aku telah sangat berdosa dalam apa yang telah kulakukan. Sekarang, ya Yahweh, mohon singkirkanlah kesalahan hamba-Mu,[b] sebab aku telah bertindak sangat bodoh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hati Daud memukul dia,” sebuah ungkapan yang menyatakan teguran batin atau hati nurani yang tersentuh.
    reason: cultural_note
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kesalahan” dapat berarti kejahatan, rasa bersalah, atau kadang-kadang hukuman akibat dosa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: hati Daud menuduh dirinya sendiri
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hati Daud 'memukul' dia. Padanan ini mempertahankan gambaran batin dan menyampaikan bahwa hati nuraninya menyalahkan dia dalam bahasa Indonesia yang alami.
- source_word: אַחֲרֵי כֵן סָפַר אֶת־הָעָם
  choice: setelah Daud menghitung rakyat
  rationale: Dalam susunan kalimat Ibrani, אַחֲרֵי כֵן berkaitan dengan tindakan menghitung yang mendahului reaksi hati Daud. 'Menghitung rakyat' menerjemahkan סָפַר אֶת־הָעָם secara langsung tanpa mempersempitnya menjadi prosedur sensus tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan gelar.
- source_word: חָטָאתִי מְאֹד אֲשֶׁר עָשִׂיתִי
  choice: Aku telah sangat berdosa melalui apa yang kulakukan
  rationale: Terjemahan ini mempertahankan pengakuan dosa, penegas מְאֹד, dan kaitannya dengan tindakan yang baru dilakukan Daud.
- source_word: הַעֲבֶר נָא
  choice: mohon hapuslah
  rationale: Bentuk permohonan dan makna kausatif idiomatis 'menyingkirkan/membuat berlalu' disampaikan secara jelas dan wajar.
- source_word: עֲוֺן עַבְדְּךָ
  choice: kesalahan hamba-Mu ini
  rationale: עָוֹן dapat menunjuk pada kejahatan, kesalahan atau keadaan bersalah, bahkan akibat hukuman. 'Kesalahan' cocok dengan pengakuan dan permohonan pengampunan, sementara catatan kaki menjaga keluasan maknanya.
- source_word: כִּי נִסְכַּלְתִּי מְאֹד
  choice: sebab aku telah bertindak sangat bodoh
  rationale: Padanan ini mempertahankan daya verbal tindakan yang tidak bijaksana dan penegas 'sangat'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna עָוֹן dalam permohonan Daud
  choice: kesalahan
  alternative: kejahatan, keadaan bersalah, atau hukuman
  rationale: Konteksnya adalah pengakuan dosa dan permohonan agar beban moral itu disingkirkan. 'Kesalahan' alami dalam bahasa Indonesia dan tidak membatasi istilah hanya pada hukuman; rentang maknanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Susunan awal dibuat alami sambil mempertahankan urutan bahwa penghitungan rakyat mendahului teguran hati nurani. Bentuk 'hamba-Mu' mempertahankan kerendahan diri raja di hadapan Allah.
