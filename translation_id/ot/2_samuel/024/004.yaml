  text: וַ/יֶּחֱזַ֤ק דְּבַר הַ/מֶּ֨לֶךְ֙ אֶל יוֹאָ֔ב וְ/עַ֖ל שָׂרֵ֣י הֶ/חָ֑יִל וַ/יֵּצֵ֨א יוֹאָ֜ב וְ/שָׂרֵ֤י הַ/חַ֨יִל֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ לִ/פְקֹ֥ד אֶת הָ/עָ֖ם אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/004.yaml
  text: But the king’s word prevailed against Joab and against the commanders of the army, so Joab and the commanders of the army went out from before the king to count the people of Israel.
translation:
  language: id
  text: Namun, perintah raja berlaku atas Yoab dan para panglima pasukan. Maka Yoab dan para panglima pasukan pergi dari hadapan raja untuk menghitung bangsa Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱזַק דְּבַר הַמֶּלֶךְ אֶל־יוֹאָב וְעַל שָׂרֵי הַחָיִל
  choice: titah raja lebih kuat daripada keberatan Yoab dan para panglima pasukan
  rationale: Ungkapan Ibrani menyatakan bahwa perkataan atau perintah raja mengalahkan pihak yang menentangnya. 'Titah' menangkap sifat perkataan raja sebagai perintah, sedangkan 'keberatan' dibuat tersurat secara kontekstual agar ungkapan ini alami dalam bahasa Indonesia tanpa mengubah hasil pertentangannya.
- source_word: שָׂרֵי הַחָיִל
  choice: para panglima pasukan
  rationale: שָׂרֵי berarti para pemimpin atau panglima, dan הַחַיִל dalam konteks ini merujuk pada kekuatan militer atau pasukan.
- source_word: וַיֵּצֵא ... לִפְנֵי הַמֶּלֶךְ
  choice: pergi dari hadapan raja
  rationale: Mempertahankan gambaran formal bahwa mereka keluar meninggalkan hadapan raja, dengan susunan yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: לִפְקֹד אֶת־הָעָם אֶת־יִשְׂרָאֵל
  choice: untuk menghitung umat Israel
  rationale: Dalam konteks sensus, פקד berarti menghitung atau mendata. 'Umat Israel' mencerminkan הָעָם אֶת־יִשְׂרָאֵל secara alami dan dignified.
theological_decisions:
- issue: Kekuatan titah raja terhadap Yoab dan para panglima
  choice: lebih kuat daripada keberatan
  alternative: berlaku atas / mengalahkan Yoab dan para panglima
  rationale: Pilihan ini mempertahankan adanya pertentangan yang tersirat dalam konteks dan hasil bahwa perintah raja menang, tanpa menambahkan penilaian teologis atas tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Titah' dipakai karena konteks kerajaan; 'panglima pasukan' mudah dipahami dan sesuai dengan ranah militer. Hubungan akibat pada וַיֵּצֵא dinyatakan dengan 'Karena itu'.
