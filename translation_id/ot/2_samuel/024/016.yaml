  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ יָד֨/וֹ הַ/מַּלְאָ֥ךְ יְרֽוּשָׁלִַם֮ לְ/שַׁחֲתָ/הּ֒ וַ/יִּנָּ֤חֶם יְהוָה֙ אֶל הָ֣/רָעָ֔ה וַ֠/יֹּאמֶר לַ/מַּלְאָ֞ךְ הַ/מַּשְׁחִ֤ית בָּ/עָם֙ רַ֔ב עַתָּ֖ה הֶ֣רֶף יָדֶ֑/ךָ וּ/מַלְאַ֤ךְ יְהוָה֙ הָיָ֔ה עִם גֹּ֖רֶן ה/אורנה הַ/יְבֻסִֽי׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/024/016.yaml
  text: When the angel stretched out his hand toward Jerusalem to destroy it[a], Yahweh relented concerning the calamity and said to the angel who was destroying the people, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was by the threshing floor of Araunah the Jebusite.
translation:
  language: id
  text: Ketika malaikat itu mengulurkan tangannya ke arah Yerusalem untuk memusnahkannya, Yahweh mengurungkan malapetaka itu[a] dan berfirman kepada malaikat yang sedang membinasakan bangsa itu, “Cukup! Sekarang tarik kembali tanganmu.” Malaikat Yahweh berada di dekat tempat pengirikan Arauna, orang Yebus itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Yahweh menyesal atau berubah hati mengenai malapetaka itu.” Kata Ibrani רָעָה di sini berarti malapetaka atau bencana, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Arauna disebut Ornan dalam kisah sejajar di 1 Tawarikh 21:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: mengulurkan tangannya
  rationale: Ungkapan שׁלח + יד menggambarkan tangan yang diulurkan untuk bertindak; pilihan ini alami dalam bahasa Indonesia dan mempertahankan gambaran konkretnya.
- source_word: הַמַּלְאָךְ
  choice: malaikat itu
  rationale: Dalam konteks ini tokohnya adalah utusan surgawi yang melaksanakan penghukuman, sehingga 'malaikat' lebih tepat daripada 'utusan'.
- source_word: לְשַׁחֲתָהּ
  choice: untuk memusnahkannya
  rationale: Bentuk infinitif שׁחת menyatakan tujuan tindakan yang mendatangkan kehancuran atas Yerusalem; pronomina '-nya' mempertahankan rujukan kepada kota itu.
- source_word: וַיִּנָּחֶם יְהוָה אֶל הָרָעָה
  choice: Yahweh mengurungkan malapetaka itu
  rationale: נחם bentuk nifal di sini menunjukkan bahwa Yahweh berhenti melanjutkan penghukuman, sedangkan רָעָה berarti malapetaka, bukan kejahatan moral. Rumusan utama dibuat wajar dalam bahasa Indonesia, dan bentuk Ibrani yang lebih harfiah dijelaskan dalam catatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: הַמַּשְׁחִית בָּעָם
  choice: yang sedang membinasakan bangsa itu
  rationale: Partisipel ini menyatakan tindakan yang tengah berlangsung dan paling alami disampaikan sebagai klausa relatif.
- source_word: רַב
  choice: Cukup!
  rationale: רַב berfungsi sebagai seruan singkat yang memerintahkan penghentian tindakan.
- source_word: עַתָּה הֶרֶף יָדֶךָ
  choice: Sekarang tarik kembali tanganmu
  rationale: הרף memerintahkan agar tindakan dihentikan; pilihan ini mempertahankan citra tangan sekaligus jelas bagi pembaca modern.
- source_word: וּמַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: Frasa konstruksi ini diterjemahkan langsung tanpa menentukan lebih jauh identitas teologis tokoh tersebut.
- source_word: הָיָה עִם
  choice: berada di dekat
  rationale: עִם dalam konteks lokasi menunjukkan kedekatan dengan tempat pengirikan.
- source_word: גֹּרֶן
  choice: tempat pengirikan
  rationale: Istilah ini jelas dan alami dalam bahasa Indonesia untuk lokasi pertanian tempat hasil panen diirik.
- source_word: הָאֹרְנָה הַיְבֻסִי
  choice: Arauna, orang Yebus itu
  rationale: Nama dalam teks Samuel dipertahankan sebagai Arauna, dan nisbah הַיְבֻסִי diterjemahkan sebagai identitas etnisnya.
theological_decisions:
- issue: Bahasa antropopatik tentang Allah dalam וַיִּנָּחֶם יְהוָה
  choice: Yahweh mengurungkan malapetaka itu
  alternative: Yahweh menyesal mengenai malapetaka itu
  rationale: Terjemahan utama menyatakan perubahan tindakan yang ditampilkan narasi tanpa menyiratkan kesalahan moral pada Allah. Catatan tetap memperlihatkan bahwa kata Ibraninya dapat diterjemahkan lebih harfiah sebagai 'menyesal/berubah hati', sehingga ketegangan ungkapan asli tidak dihapus.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  alternative: manifestasi ilahi atau malaikat ciptaan
  rationale: Ayat ini menyebut tokoh tersebut sebagai 'Malaikat Yahweh' tetapi tidak menetapkan penjelasan ontologisnya; terjemahan tidak memaksakan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama ilahi dipertahankan sebagai 'Yahweh'. Seruan 'Cukup!' dibuat ringkas sesuai daya perintah teks, sedangkan 'tarik kembali tanganmu' mempertahankan citra Ibrani. Penanda catatan [a] dan [b] ditempatkan pada unsur yang benar-benar dijelaskan oleh masing-masing catatan.
