  terminology: '"Yahweh" konsisten untuk יהוה. "Malaikat" tepat bagi מַלְאָךְ dalam konteks ini, dan "Malaikat Yahweh" mempertahankan konstruksi serta tidak memutuskan identitas teologis figur tersebut. Nama Samuel, "Arauna", dipertahankan dengan tepat. Catatan [a] secara tepat membedakan malapetaka/bencana dari kejahatan moral; catatan [b] tepat untuk bentuk nama sejajar dalam Tawarikh.'
