revisions:
- from: Semasa hidupnya, Absalom telah mendirikan bagi dirinya sebuah tugu batu di Lembah Raja, sebab katanya, “Aku tidak mempunyai anak laki-laki yang akan membuat namaku tetap dikenang.” Ia menamai tugu itu menurut namanya sendiri. Sampai hari ini tugu itu disebut “Tugu Absalom.”[a]
  to: Semasa hidupnya, Absalom telah mengambil sebuah tugu dan mendirikannya bagi dirinya di Lembah Raja, sebab ia berkata, “Aku tidak mempunyai anak laki-laki untuk membuat namaku dikenang.” Ia menamai tugu itu menurut namanya sendiri. Sampai hari ini tugu itu disebut “Tugu Absalom.”[a]
