  text: וְ/אַבְשָׁלֹ֣ם לָקַ֗ח וַ/יַּצֶּב ל֤/וֹ ב/חי/ו אֶת מַצֶּ֨בֶת֙ אֲשֶׁ֣ר בְּ/עֵֽמֶק הַ/מֶּ֔לֶךְ כִּ֤י אָמַר֙ אֵֽין לִ֣/י בֵ֔ן בַּ/עֲב֖וּר הַזְכִּ֣יר שְׁמִ֑/י וַ/יִּקְרָ֤א לַ/מַּצֶּ֨בֶת֙ עַל שְׁמ֔/וֹ וַ/יִּקָּ֤רֵא לָ/הּ֙ יַ֣ד אַבְשָׁלֹ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/018.yaml
  text: Absalom had taken and set up for himself in his lifetime the pillar that is in the Valley of the King[a], for he said, “I have no son to keep my name in remembrance.” So he called the pillar by his own name, and it is called Absalom’s Monument to this day.
translation:
  language: id
  text: Semasa hidupnya, Absalom telah mengambil sebuah tugu dan mendirikannya bagi dirinya di Lembah Raja, sebab ia berkata, “Aku tidak mempunyai anak laki-laki untuk membuat namaku dikenang.” Ia menamai tugu itu menurut namanya sendiri. Sampai hari ini tugu itu disebut “Tugu Absalom.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tangan Absalom.” Di sini “tangan” adalah ungkapan untuk penanda peringatan atau monumen.'
    reason: Mempertahankan bentuk harfiah nama Ibrani yang tidak biasa sambil menjelaskan makna idiomatisnya dalam konteks.
lexical_decisions:
- source_word: לָקַח וַיַּצֶּב לֹו
  choice: telah mendirikan bagi dirinya
  rationale: לָקַח yang diikuti וַיַּצֶּב membentuk ungkapan tindakan yang dalam bahasa Indonesia paling alami disampaikan tanpa menerjemahkan ‘mengambil’ secara kaku. ‘Telah’ menandai tindakan Absalom yang terjadi sebelumnya, sedangkan ‘bagi dirinya’ mempertahankan לֹו.
- source_word: בְחַיּו
  choice: Semasa hidupnya
  rationale: Ungkapan ini berarti ketika Absalom masih hidup. Penempatannya di awal kalimat menghasilkan bahasa Indonesia yang alami dan jelas.
- source_word: מַצֶּבֶת
  choice: tugu batu
  rationale: Kata ini menunjuk pada batu yang ditegakkan sebagai pilar atau penanda. ‘Tugu batu’ mempertahankan bentuk konkretnya sekaligus fungsi peringatannya.
- source_word: בְּעֵמֶק הַמֶּלֶךְ
  choice: di Lembah Raja
  rationale: Terjemahan langsung dan wajar untuk nama tempat tersebut, tanpa memastikan lokasi yang tidak dijelaskan teks.
- source_word: בַּעֲבוּר הַזְכִּיר שְׁמִי
  choice: yang akan membuat namaku tetap dikenang
  rationale: Bentuk kausatif הַזְכִּיר menyatakan tujuan agar nama Absalom terus diingat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur keberlanjutan kenangan.
- source_word: וַיִּקְרָא לַמַּצֶּבֶת עַל שְׁמוֹ
  choice: Ia menamai tugu itu menurut namanya sendiri
  rationale: Ungkapan Ibrani berarti bahwa Absalom memberi tugu itu nama yang berasal dari namanya sendiri.
- source_word: יַד אַבְשָׁלֹם
  choice: Tugu Absalom
  rationale: יַד secara harfiah berarti ‘tangan’, tetapi di sini dipakai sebagai sebutan bagi penanda atau monumen peringatan. Terjemahan maknawi ditempatkan dalam teks, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Sampai hari ini
  rationale: Ungkapan waktu baku yang menyatakan bahwa nama tersebut masih digunakan pada masa penulisan.
theological_decisions:
- issue: Pernyataan Absalom bahwa ia tidak mempunyai anak laki-laki dibandingkan dengan 2 Samuel 14:27
  choice: 'Pernyataan diterjemahkan langsung tanpa harmonisasi: ‘Aku tidak mempunyai anak laki-laki’.'
  alternative: Menjelaskannya sebagai tidak mempunyai anak laki-laki yang masih hidup atau yang layak meneruskan namanya.
  rationale: Teks ayat ini tidak memberikan penjelasan tersebut. Menambahkannya akan menyelesaikan ketegangan antarteks secara spekulatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, tanpa menghilangkan pernyataan yang menimbulkan ketegangan dengan bagian lain dalam kitab ini.
