  text: וְ/דָוִ֥ד יוֹשֵׁ֖ב בֵּין שְׁנֵ֣י הַ/שְּׁעָרִ֑ים וַ/יֵּ֨לֶךְ הַ/צֹּפֶ֜ה אֶל גַּ֤ג הַ/שַּׁ֨עַר֙ אֶל הַ֣/חוֹמָ֔ה וַ/יִּשָּׂ֤א אֶת עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה אִ֖ישׁ רָ֥ץ לְ/בַדּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/024.yaml
  text: David was sitting between the two gates[a], and the watchman went up to the roof of the gate by the wall. He lifted up his eyes and looked, and behold, a man was running alone.
translation:
  language: id
  text: Daud sedang duduk di antara kedua pintu gerbang[a]. Penjaga naik ke atap pintu gerbang di dekat tembok. Ia mengangkat pandangannya dan melihat; tampaklah seorang laki-laki berlari sendirian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara kedua bangunan gerbang.” Secara harfiah teks Ibrani berbunyi “di antara kedua pintu gerbang”, mungkin merujuk pada ruang di dalam kompleks pintu gerbang kota yang berkubu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: sedang duduk
  rationale: Bentuk partisip menggambarkan keadaan atau posisi Daud yang sedang berlangsung pada saat itu.
- source_word: בֵּין שְׁנֵי הַשְּׁעָרִים
  choice: di antara kedua pintu gerbang
  rationale: Terjemahan ini mengikuti bunyi harfiah teks Ibrani dan tidak mempersempitnya menjadi dua bangunan gerbang tertentu.
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Dalam konteks pintu gerbang dan tembok kota, istilah ini menunjuk kepada orang yang bertugas mengawasi dari tempat tinggi.
- source_word: אֶל גַּג הַשַּׁעַר אֶל הַחוֹמָה
  choice: ke atap pintu gerbang di dekat tembok
  rationale: Ungkapan ini menyatakan bahwa penjaga naik ke bagian atas bangunan gerbang yang berhubungan secara ruang dengan tembok, tanpa menetapkan rincian arsitektur yang tidak dijelaskan teks.
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Ia mengangkat pandangannya
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani tetapi lebih wajar dalam bahasa Indonesia modern daripada 'mengangkat matanya'.
- source_word: וַיַּרְא וְהִנֵּה
  choice: dan melihat; tampaklah
  rationale: Susunan ini menyampaikan tindakan melihat sekaligus daya penunjuk הִנֵּה, yang menghadirkan pemandangan itu secara mendadak kepada pembaca.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Kata benda ini berbentuk tunggal maskulin dan dalam adegan tersebut menunjuk kepada seorang pelari laki-laki.
- source_word: רָץ
  choice: berlari
  rationale: Bentuk partisip menampilkan orang itu sedang berlari ketika terlihat oleh penjaga; bersama 'tampaklah', bentuk ini alami dalam narasi Indonesia.
- source_word: לְבַדּוֹ
  choice: sendirian
  rationale: Pilihan ini menyatakan dengan jelas bahwa laki-laki itu berlari tanpa ditemani orang lain.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Kalimat dipecah agar alur pengamatan mudah diikuti, sedangkan 'tampaklah' mempertahankan daya dramatik הִנֵּה tanpa terdengar terlalu sehari-hari.
