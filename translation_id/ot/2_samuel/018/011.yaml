base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/011.yaml
  text: Then Joab said to the man who had told him[a], “Look, you saw him[b]; why then did you not strike him there to the ground? And I would have been obliged to give you ten pieces of silver and one belt.”
translation:
  language: id
  text: Lalu Yoab berkata kepada orang yang telah menyampaikan hal itu kepadanya, “Lihat, engkau telah melihatnya! Mengapa engkau tidak memukulnya hingga jatuh ke tanah di sana? Maka aku wajib memberimu sepuluh keping perak[a] dan sebuah ikat pinggang[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepuluh perak.” Satuan khususnya tidak disebutkan dalam teks Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Maka aku akan memberimu sebuah ikat pinggang.” Ungkapan Ibrani untuk seluruh klausa itu secara lebih harfiah berbunyi, “dan menjadi kewajibanku untuk memberimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּגִּיד לֹו
  choice: orang yang telah menyampaikan hal itu kepadanya
  rationale: Partisipel berartikel berfungsi sebagai sebutan bagi orang yang memberi laporan. Bentuk lampau ‘telah menyampaikan’ cocok dengan laporan yang baru saja diberikan, sedangkan ‘hal itu’ mengungkapkan objek yang tersirat dari konteks.
- source_word: וְהִנֵּה
  choice: Lihat
  rationale: Mempertahankan daya interjektif dan reaksi tajam Yoab dalam bahasa Indonesia modern tanpa memakai bentuk arkais.
- source_word: רָאִיתָ
  choice: engkau melihat dia
  rationale: Objeknya tersirat dalam bahasa Ibrani dan jelas merujuk kepada Absalom. Objek itu dinyatakan dalam bahasa Indonesia agar kalimat alami.
- source_word: הִכִּיתוֹ ... אָרְצָה
  choice: menghantamnya ... hingga jatuh ke tanah
  rationale: Menjaga citra tindakan נכה sebagai pukulan keras tanpa langsung mempersempit artinya menjadi ‘membunuh’; arah אָרְצָה dinyatakan secara alami sebagai akibat menuju tanah.
- source_word: וְעָלַי לָתֶת לְךָ
  choice: Aku tentu berkewajiban memberimu
  rationale: Konstruksi עָלַי dengan infinitif menyatakan sesuatu yang menjadi tanggungan atau kewajiban pembicara. ‘Tentu’ menyampaikan nuansa konsekuensi hipotetis dalam konteks.
- source_word: עֲשָׂרָה כֶסֶף
  choice: sepuluh keping perak
  rationale: Teks menyebut secara harfiah ‘sepuluh perak’ tanpa menyatakan satuan. ‘Keping’ melengkapi ungkapan secara alami tanpa menetapkannya sebagai syikal atau mata uang tertentu.
- source_word: חֲגֹרָה אֶחָת
  choice: sebuah ikat pinggang
  rationale: חֲגֹרָה menunjuk pada sabuk atau ikat pinggang; bentuk ini jelas dan lazim dalam bahasa Indonesia modern, sementara ‘sebuah’ secara wajar mencerminkan bilangan satu.
theological_decisions:
- issue: Daya idiom kewajiban dalam וְעָלַי לָתֶת לְךָ
  choice: Aku tentu berkewajiban memberimu
  alternative: Aku tentu akan memberimu
  rationale: Terjemahan utama mempertahankan gagasan bahwa pemberian hadiah akan menjadi tanggungan Yoab, bukan sekadar menyatakan tindakan masa depan. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih datar sesuai konteks hipotetis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘engkau’ dipakai agar sesuai dengan dialog naratif Alkitab dan teguran langsung Yoab. Susunan kalimat mempertahankan ketajaman pertanyaan Yoab serta idiom kewajiban dalam teks Ibrani.
