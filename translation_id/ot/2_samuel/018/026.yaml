base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/026.yaml
  text: Then the watchman saw another man running[a], and the watchman called to the gatekeeper and said, “Look, a man is running by himself.” And the king said, “He also brings news.”
translation:
  language: id
  text: Kemudian penjaga itu melihat seorang laki-laki lain sedang berlari[a]. Penjaga itu berseru kepada penjaga pintu gerbang dan berkata, “Lihat, ada seorang laki-laki yang berlari sendirian.” Raja berkata, “Dia juga membawa kabar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang pelari”; dalam konteks ini pelari tersebut datang sebagai pembawa berita.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Bentuk partisip dari צפה menunjuk kepada orang yang berjaga dan mengamati dari tempat pengintaian. “Penjaga” alami dalam bahasa Indonesia dan sesuai dengan latar pintu gerbang kota.
- source_word: אִישׁ אַחֵר
  choice: seorang laki-laki lain
  rationale: אִישׁ menunjuk kepada seorang laki-laki, sedangkan אַחֵר membedakannya dari pelari pertama.
- source_word: רָץ
  choice: sedang berlari
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung ketika orang itu terlihat.
- source_word: הַשֹּׁעֵר
  choice: penjaga pintu gerbang
  rationale: Istilah ini menunjuk kepada orang yang bertugas menjaga gerbang; frasa ini jelas dan wajar bagi pembaca Indonesia masa kini.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada sesuatu yang tampak pada saat itu; “Lihat” mempertahankan daya serunya tanpa bahasa arkais.
- source_word: לְבַדּוֹ
  choice: sendirian
  rationale: Ungkapan ini menyatakan bahwa pelari tersebut datang seorang diri, bukan bersama rombongan.
- source_word: גַּם זֶה
  choice: Dia juga
  rationale: Dalam konteks tuturan, bentuk ini secara alami menyatakan bahwa pelari kedua juga termasuk dalam penilaian yang sama seperti pelari pertama.
- source_word: מְבַשֵּׂר
  choice: membawa kabar
  rationale: Partisip piel dari בשׂר dapat berarti membawa atau menyampaikan berita, sering kali berita baik. “Membawa kabar” tidak menetapkan lebih jauh daripada yang dinyatakan konteks.
