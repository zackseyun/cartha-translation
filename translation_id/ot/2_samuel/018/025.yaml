translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Hubungan antarklausa dibuat alami tanpa mempertahankan setiap waw Ibrani sebagai “dan”. Ambiguitas leksikal בְּשׂוֹרָה dinilai dari konteks sebagai “kabar baik”; tidak diperlukan catatan teologis.
