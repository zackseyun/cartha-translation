  terminology: “Penjaga” sesuai untuk הַצֹּפֶה dalam konteks naratif militer/kota. “Berseru” dan “memberitahukan hal itu kepada raja” secara jelas menyampaikan pengumuman penjaga. “Kabar” mempertahankan ambiguitas leksikal בְּשׂוֹרָה tanpa memaksakan arti “kabar baik.”
