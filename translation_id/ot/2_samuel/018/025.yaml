translation:
  language: id
  text: Lalu penjaga itu berseru dan memberitahukan hal itu kepada raja. Raja berkata, “Jika ia seorang diri, ia membawa kabar.” Orang itu terus mendekat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Bentuk nominal dari צפה menunjuk kepada orang yang ditempatkan untuk mengawasi; “penjaga” alami dalam konteks tembok kota dan cukup jelas dari konteks.
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Kata ini menggambarkan penjaga yang mengangkat suara untuk menyampaikan apa yang dilihatnya; “berseru” menyatakan pengumuman dengan suara keras.
- source_word: וַיַּגֵּד לַמֶּלֶךְ
  choice: memberitahukannya kepada raja
  rationale: Bentuk Hifil dari נגד berarti memberi tahu atau melaporkan. Pronomina “-nya” secara alami merujuk pada hal yang baru saja diserukan.
- source_word: אִם לְבַדּוֹ
  choice: Jika ia sendirian
  rationale: Terjemahan ini mempertahankan pernyataan langsung mengenai keadaan pelari yang seorang diri tanpa menambahkan verba gerak yang tidak dinyatakan di sini.
- source_word: בְּשׂוֹרָה בְּפִיו
  choice: ia membawa kabar baik
  rationale: בְּשׂוֹרָה dapat berarti kabar dan sering berkonotasi kabar baik; dalam konteks ini raja menyimpulkan bahwa seorang pelari tunggal membawa berita yang menguntungkan. Ungkapan harfiah “di dalam mulutnya” dialihkan menjadi idiom Indonesia yang alami.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְקָרֵב
  choice: Sementara itu, orang itu terus mendekat
  rationale: Konstruksi infinitif absolut menyatakan tindakan yang berlanjut; “terus mendekat” menyampaikan aspek progresifnya secara alami.
