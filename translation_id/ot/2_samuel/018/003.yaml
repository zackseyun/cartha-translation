translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan ‘engkau’ dipakai karena rakyat berbicara langsung kepada raja. Struktur argumen dan pengulangan tentang musuh yang tidak memedulikan pasukan dipertahankan.
