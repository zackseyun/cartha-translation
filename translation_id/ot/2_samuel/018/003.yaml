base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/003.yaml
  text: But the people said[a], “You must not go out, for if we flee, they will not pay attention to us; and if half of us die, they will not pay attention to us. For you are worth ten thousand of us[c][b]; so now it is better that you be ready to help us from the city.”
translation:
  language: id
  text: Namun rakyat berkata, “Jangan keluar. Sebab, jika kami melarikan diri, mereka tidak akan memedulikan kami[a]. Bahkan jika separuh dari kami mati, mereka tidak akan memedulikan kami. Sebab, sekarang engkau bernilai sama dengan sepuluh ribu orang dari kami[b]. Karena itu, lebih baik engkau siap menolong kami dari kota[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka tidak akan menaruh hati kepada kami,” yaitu mereka tidak akan menganggap kami sebagai sasaran utama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sekarang engkau seperti sepuluh ribu dari kami.”
    reason: lexical_alternative
  - marker: c
    text: Frasa terakhir kemungkinan berarti bahwa Daud harus tetap berada di kota agar dapat memberikan bantuan atau pasukan tambahan bila diperlukan.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תֵצֵא
  choice: Jangan ikut berperang
  rationale: Secara harfiah berarti ‘jangan keluar’. Dalam konteks pasukan yang hendak maju ke medan perang (ayat 2–4), ungkapan ini melarang Daud ikut maju berperang; terjemahan kontekstual ini alami dan jelas.
- source_word: כִּי אִם נֹס נָנוּס
  choice: Sebab, jika kami melarikan diri
  rationale: Infinitif absolut bersama verba finit memberi penegasan pada tindakan melarikan diri. Bahasa Indonesia alami tidak memerlukan pengulangan harfiah untuk menyampaikan syarat ini.
- source_word: לֹא יָשִׂימוּ אֵלֵינוּ לֵב
  choice: mereka tidak akan memedulikan kami
  rationale: Idiom Ibrani ‘menaruh hati kepada kami’ berarti memberi perhatian atau menjadikan pihak itu sasaran kepedulian utama; ‘memedulikan’ sesuai dengan konteks militer.
- source_word: וְאִם יָמֻתוּ חֶצְיֵנוּ
  choice: Bahkan jika separuh dari kami mati
  rationale: וְאִם meneruskan dan meningkatkan argumen. ‘Bahkan jika’ mengungkapkan daya retorisnya, sedangkan ‘mati’ mempertahankan verba Ibrani tanpa menambahkan bentuk pasif ‘dibunuh’.
- source_word: כִּי עַתָּה כָמֹנוּ עֲשָׂרָה אֲלָפִים
  choice: Sebab, sekarang engkau sama berharganya dengan sepuluh ribu orang di antara kami
  rationale: Teks Masoret secara harfiah menyatakan bahwa Daud ‘seperti sepuluh ribu dari kami’. ‘Sama berharganya’ menyampaikan maksud perbandingan nilainya bagi pasukan tanpa mengubah jumlah.
- source_word: וְעַתָּה טוֹב
  choice: Karena itu, lebih baik
  rationale: טוֹב di sini menunjukkan tindakan yang lebih baik atau lebih disukai; ‘karena itu’ menghubungkan kesimpulan dengan alasan sebelumnya secara alami.
- source_word: מֵעִיר
  choice: dari kota
  rationale: Preposisi מִן menunjukkan sumber atau lokasi asal pertolongan.
- source_word: לְעָזִיר
  choice: siap menolong kami
  rationale: Bentuk ini lazim dipahami berkaitan dengan akar עזר, ‘menolong’. ‘Siap menolong’ menyatakan fungsi dukungan yang diharapkan dari Daud sambil mempertahankan unsur pertolongan.
