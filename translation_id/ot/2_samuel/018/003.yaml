  terminology: “Engkau,” “rakyat,” “kota,” dan “menolong” sesuai dengan register naratif modern. Catatan terakhir dengan tepat menandai makna operasional frasa Ibrani yang sulit tanpa menjadikannya arti eksplisit teks.
