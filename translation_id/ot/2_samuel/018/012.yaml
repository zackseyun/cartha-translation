  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ אֶל יוֹאָ֔ב ו/לא אָנֹכִ֜י שֹׁקֵ֤ל עַל כַּפַּ/י֙ אֶ֣לֶף כֶּ֔סֶף לֹֽא אֶשְׁלַ֥ח יָדִ֖/י אֶל בֶּן הַ/מֶּ֑לֶךְ כִּ֣י בְ/אָזְנֵ֜י/נוּ צִוָּ֣ה הַ/מֶּ֗לֶךְ אֹ֠תְ/ךָ וְ/אֶת אֲבִישַׁ֤י וְ/אֶת אִתַּי֙ לֵ/אמֹ֔ר שִׁמְרוּ מִ֕י בַּ/נַּ֖עַר בְּ/אַבְשָׁלֽוֹם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/012.yaml
  text: But the man said to Joab[a], “Even if I were weighing out a thousand pieces of silver on my palms, I would not put out my hand against the king’s son; for in our hearing the king commanded you and Abishai and Ittai, saying[b], ‘Guard for me the young man Absalom.’”
translation:
  language: id
  text: Namun, orang itu berkata kepada Yoab, “Sekalipun seribu keping perak ditimbang di atas telapak tanganku[a], aku tidak akan mengulurkan tanganku terhadap anak raja. Sebab, kami sendiri mendengar raja memerintahkan engkau, Abisai, dan Itai, katanya, ‘Jagalah pemuda itu, Absalom, demi Aku.’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menimbang seribu perak di atas telapak tanganku.” Ungkapan ini merujuk pada penerimaan bayaran besar yang ditimbang menurut beratnya.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani pada akhir ayat ini sulit; secara harfiah berbunyi kira-kira, “Jagalah mi pemuda itu, Absalom,” dengan mi sebagai bentuk Ibrani yang tidak jelas dalam konteks ini. Berdasarkan konteks dan perintah paralel dalam 18:5, banyak orang memahami maksudnya sebagai, “Jagalah pemuda itu, Absalom, demi Aku.”
    reason: textual_variant
lexical_decisions:
- source_word: שֹׁקֵל עַל כַּפַּי אֶלֶף כֶּסֶף
  choice: Sekalipun seribu keping perak ditimbang di atas telapak tanganku
  rationale: Bentuk partisipial dan ungkapan עַל כַּפַּי menggambarkan perak yang ditimbang sebagai bayaran pada telapak tangan si pembicara. 'Keping perak' alami dalam bahasa Indonesia dan tidak menetapkan satuan 'syikal' yang tidak disebutkan secara eksplisit.
- source_word: לֹא אֶשְׁלַח יָדִי אֶל
  choice: aku tidak akan mengulurkan tanganku untuk melawan
  rationale: Mempertahankan gambaran tangan dalam idiom Ibrani sekaligus menyampaikan makna tindakan keras atau serangan terhadap seseorang.
- source_word: בֶּן הַמֶּלֶךְ
  choice: anak raja
  rationale: Padanan konstruksi yang langsung, alami, dan mempertahankan hubungan kerajaan yang menjadi dasar penolakan orang itu.
- source_word: בְאָזְנֵינוּ
  choice: di depan telinga kami sendiri
  rationale: Mempertahankan citra konkret idiom Ibrani dan menegaskan bahwa mereka mendengar sendiri perintah itu.
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Menyatakan instruksi berotoritas dari raja secara jelas.
- source_word: שִׁמְרוּ
  choice: Jagalah
  rationale: Mencakup tindakan menjaga dan melindungi dalam konteks militer tanpa mempersempit maknanya.
- source_word: מִי בַּנַּעַר בְּאַבְשָׁלוֹם
  choice: bagiku orang muda itu, Absalom
  rationale: Mengikuti makna kontekstual perintah paralel dalam 2 Samuel 18:5, tetapi kesulitan bentuk Masoretik dipertahankan dalam catatan kaki.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Artikel Ibrani menunjuk pada orang tertentu yang sudah hadir dalam alur narasi.
- source_word: וְלֹא אָנֹכִי
  choice: Sekalipun ... aku tidak akan
  rationale: Struktur konsesif ini menyampaikan penolakan tegas si pembicara secara alami dalam bahasa Indonesia.
