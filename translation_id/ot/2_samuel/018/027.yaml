base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/027.yaml
  text: Then the watchman said[a], “I see the running of the first one is like the running of Ahimaaz the son of Zadok.” And the king said, “He is a good man[b], and he comes with good news.”
translation:
  language: id
  text: Lalu penjaga itu berkata, “Aku melihat lari orang pertama itu seperti lari Ahimaas anak Zadok.” Raja berkata, “Ia orang baik, dan ia datang membawa kabar baik[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan ia akan datang membawa kabar baik.” Bentuk kata kerja Ibrani dapat dipahami sebagai bentuk mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: penjaga
  rationale: Partisipel substantival ini menunjuk kepada orang yang berjaga dan mengamati dari tempat pengintaian; “penjaga” alami dan jelas dalam konteks narasi.
- source_word: מְרוּצַת הָרִאשׁוֹן כִּמְרֻצַת
  choice: cara orang yang pertama itu berlari seperti cara ... berlari
  rationale: Nomina מְרוּצָה menggambarkan gerak atau cara berlari yang dapat dikenali. Ungkapan ini mempertahankan perbandingan Ibrani sambil terdengar wajar dalam bahasa Indonesia.
- source_word: אֲחִימַעַץ בֶּן צָדוֹק
  choice: Ahimaas anak Zadok
  rationale: Nama ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan בֶּן diterjemahkan secara langsung sebagai “anak”.
- source_word: אִישׁ טוֹב זֶה
  choice: Ia orang baik
  rationale: Susunan harfiahnya ialah “orang baik, yang ini”; bentuk pronominal ini menyampaikan penilaian raja secara alami tanpa menambah makna.
- source_word: וְאֶל בְּשׂוֹרָה טוֹבָה יָבוֹא
  choice: dan ia datang membawa kabar baik
  rationale: Dalam konteks kedatangan seorang pembawa berita, אֶל dengan בְּשׂוֹרָה dipahami secara idiomatis sebagai datang dengan atau membawa kabar. Bentuk yiqtol dapat menyatakan kejadian yang sedang diantisipasi atau berlangsung, sehingga ambiguitas waktunya dicatat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan nominal Ibrani tentang “lari” dibuat idiomatis sebagai “cara ... berlari” tanpa menghilangkan pengamatan bahwa penjaga mengenali pelari dari gaya berlarinya. Ambiguitas aspek/waktu pada יָבוֹא dipertahankan melalui catatan kaki.
