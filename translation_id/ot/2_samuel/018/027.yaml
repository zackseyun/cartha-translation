  terminology: “Penjaga,” “Ahimaas anak Zadok,” dan “kabar baik” sesuai dengan register Alkitab bahasa Indonesia modern. “Ia orang baik” secara memadai menyampaikan אִישׁ טוֹב זֶה tanpa mempersempit maknanya menjadi penilaian moral atau teologis tertentu.
