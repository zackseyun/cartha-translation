base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/010.yaml
  text: One man saw it and told Joab[a], and said, “Look, I saw Absalom hanging in the terebinth tree.”
translation:
  language: id
  text: Seorang laki-laki melihatnya lalu memberi tahu Yoab. Katanya, “Lihat, aku melihat Absalom tergantung di pohon tarbantin[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di pohon ek.” Kata Ibrani אֵלָה dapat menunjuk kepada pohon tarbantin dan kadang diterjemahkan secara lebih umum sebagai “pohon ek.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶחָד
  choice: Seorang laki-laki
  rationale: Ungkapan ini secara harfiah menunjuk kepada satu orang laki-laki. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan rujukan tunggal serta gender gramatikal sumber.
- source_word: וַיַּרְא
  choice: melihatnya
  rationale: Kata kerjanya berarti ‘melihat’. Akhiran ‘-nya’ menyatakan objek yang tersirat dalam bahasa Ibrani, yakni keadaan Absalom yang kemudian dilaporkan.
- source_word: וַיַּגֵּד לְיוֹאָב
  choice: memberi tahu Yoab
  rationale: Ungkapan ini menyampaikan tindakan memberitahukan atau melaporkan sesuatu kepada Yoab; ‘memberi tahu’ jelas dan alami dalam narasi Indonesia modern.
- source_word: וַיֹּאמֶר
  choice: Katanya
  rationale: Bentuk naratif ini memperkenalkan ucapan langsung. ‘Katanya’ menghindari rangkaian ‘dan berkata’ yang kaku tanpa menghilangkan fungsi verba sumber.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian pendengar kepada laporan yang penting. ‘Lihat’ mempertahankan daya serunya tanpa memakai bentuk arkais.
- source_word: רָאִיתִי
  choice: aku melihat
  rationale: Bentuk perfektif melaporkan pengamatan yang telah terjadi. ‘Aku melihat’ cocok dengan ucapan langsung antarprajurit dalam konteks ini.
- source_word: תָּלוּי
  choice: tergantung
  rationale: Partisip pasif ini menggambarkan Absalom dalam keadaan tergantung atau tersuspensi; ‘tergantung’ mempertahankan keadaan itu tanpa menambahkan penjelasan mengenai caranya.
- source_word: בָּאֵלָה
  choice: di pohon tarbantin
  rationale: אֵלָה paling khusus menunjuk kepada tarbantin. Preposisi ‘di’ alami untuk menyatakan lokasi Absalom pada atau di antara bagian-bagian pohon, tanpa menentukan lebih jauh posisi tepatnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ucapan langsung memakai ‘aku’ secara alami, sedangkan istilah botani ‘tarbantin’ dipertahankan demi ketepatan sumber. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
