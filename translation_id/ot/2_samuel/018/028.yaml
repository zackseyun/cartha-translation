  text: וַ/יִּקְרָ֣א אֲחִימַ֗עַץ וַ/יֹּ֤אמֶר אֶל הַ/מֶּ֨לֶךְ֙ שָׁל֔וֹם וַ/יִּשְׁתַּ֧חוּ לַ/מֶּ֛לֶךְ לְ/אַפָּ֖י/ו אָ֑רְצָ/ה וַ/יֹּ֗אמֶר בָּרוּךְ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֤ר סִגַּר֙ אֶת הָ֣/אֲנָשִׁ֔ים אֲשֶׁר נָשְׂא֥וּ אֶת יָדָ֖/ם בַּֽ/אדֹנִ֥/י הַ/מֶּֽלֶךְ־ס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/028.yaml
  text: Ahimaaz called out and said to the king[a], “Peace!” Then he bowed down before the king with his face to the ground and said, “Blessed be Yahweh your God[b], who has delivered up the men who lifted their hand against my lord the king.”
translation:
  language: id
  text: Ahimaas berseru kepada raja, “Damai!”[a] Lalu ia bersujud di hadapan raja dengan mukanya ke tanah dan berkata, “Terpujilah Yahweh, Allahmu, yang telah menyerahkan[b] orang-orang yang mengangkat tangan melawan tuanku raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Semua baik!” Kata Ibrani syalom di sini dapat berfungsi sebagai laporan bahwa keadaan baik atau kabar yang dibawa menguntungkan, bukan hanya sebagai salam.
    reason: lexical_alternative
  - marker: b
    text: Ibrani dapat berarti “telah menyerahkan” atau “telah menyerahkan ke dalam kekuasaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Dalam konteks seorang pembawa kabar yang menghadap raja, verba ini menunjukkan bahwa Ahimaas menyampaikan laporannya dengan suara nyaring. “Berseru” alami dan ringkas dalam bahasa Indonesia.
- source_word: שָׁלוֹם
  choice: Damai!
  rationale: Kata ini dapat menjadi salam sekaligus laporan singkat bahwa keadaan baik atau hasilnya menguntungkan. “Damai!” mempertahankan kekompakan dan keluasan makna Ibraninya; kemungkinan kontekstual dijelaskan dalam catatan kaki.
- source_word: וַיִּשְׁתַּחוּ לַמֶּלֶךְ לְאַפָּיו אָרְצָה
  choice: ia bersujud di hadapan raja dengan muka sampai ke tanah
  rationale: Ungkapan ini menggambarkan penghormatan melalui gerakan tubuh yang sangat merendah. “Bersujud” sesuai dengan tindakan itu, sedangkan “dengan muka sampai ke tanah” mempertahankan gambaran fisiknya.
- source_word: בָּרוּךְ יְהוָה אֱלֹהֶיךָ
  choice: Terpujilah Yahweh, Allahmu
  rationale: “Terpujilah” menyampaikan formula pujian secara wajar dan khidmat dalam bahasa Indonesia, sementara nama ilahi ditransliterasikan sebagai “Yahweh”.
- source_word: סִגַּר
  choice: telah menyerahkan
  rationale: Dalam konteks konflik, verba ini berarti menyerahkan seseorang ke dalam kuasa pihak lain. “Menyerahkan” jelas dan idiomatis tanpa menambahkan hasil yang tidak dinyatakan secara eksplisit.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi dalam konteks ini menunjuk kelompok pelaku pemberontakan. “Orang-orang” merupakan padanan Indonesia yang alami dan tidak mengubah rujukan kontekstualnya.
- source_word: נָשְׂאוּ אֶת יָדָם
  choice: mengangkat tangan melawan
  rationale: Padanan ini mempertahankan metafora Ibrani bagi tindakan permusuhan atau pemberontakan, tanpa menggantinya dengan penafsiran abstrak.
- source_word: בַּאדֹנִי הַמֶּלֶךְ
  choice: melawan tuanku raja
  rationale: “Tuanku raja” mempertahankan sapaan istana yang hormat kepada Daud dan terdengar wajar dalam register naratif yang khidmat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Transliterasi “Yahweh” mempertahankan fungsi teks sebagai nama pribadi ilahi dan mengikuti konvensi proyek tanpa memasukkan klaim denominasi tertentu.
- issue: Makna kemenangan dalam verba סִגַּר
  choice: telah menyerahkan
  alternative: telah membebaskan dari; telah mengurung
  rationale: Bentuk dan konteks menunjuk pada penyerahan para lawan ke dalam kuasa pihak raja. Terjemahan ini tidak menetapkan lebih jauh apakah mereka ditangkap atau dibunuh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-istana yang khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan seruan singkat “Damai!”, tindakan bersujud, nama Yahweh, dan metafora “mengangkat tangan” dari teks Ibrani.
