    issue: Hubungan sintaksis antara perjumpaan dan Absalom yang menunggang bagal terpecah.
    rationale: Teks menyatakan bahwa Absalom berhadapan dengan para hamba Daud ketika ia sedang menunggang bagal. Pemisahan menjadi "Saat itu" masih dapat dipahami, tetapi kurang langsung mencerminkan konstruksi sumber.
  - severity: medium
    issue: '"Sebatang pohon besar, yaitu pohon tarbantin" tidak tepat secara semantis.'
    rationale: Tarbantin bukan keterangan lanjutan bagi pohon besar yang tidak tentu; tarbantin adalah identifikasi leksikal untuk אֵלָה. Frasa itu sebaiknya berbunyi "cabang-cabang rimbun sebatang pohon tarbantin besar."
  - severity: low
    issue: Catatan kaki tidak sepenuhnya selaras dengan cakupan frasa sumber.
    rationale: Alternatif "pohon ek" sebaiknya mencakup frasa pohon dan cabangnya, sehingga pembaca memahami bahwa alternatif tersebut untuk keseluruhan ungkapan yang diterjemahkan.
