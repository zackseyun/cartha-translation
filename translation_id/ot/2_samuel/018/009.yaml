revisions:
- from: Kebetulan Absalom berhadapan dengan anak buah Daud. Saat itu Absalom sedang menunggang bagal. Bagal itu lewat di bawah jalinan cabang-cabang sebatang pohon besar, yaitu pohon tarbantin[a], lalu kepala Absalom tersangkut pada pohon itu. Ia pun tergantung di antara langit dan bumi, sementara bagal yang ditungganginya terus berjalan.
  to: Absalom kebetulan berhadapan dengan orang-orang Daud ketika ia sedang menunggang bagal. Bagal itu melewati bawah cabang-cabang rimbun sebatang pohon tarbantin besar[a], dan kepala Absalom tersangkut pada pohon itu. Ia pun tergantung di antara langit dan bumi, sementara bagal yang ada di bawahnya terus berjalan.
  rationale: Revisi menyatukan keadaan Absalom yang sedang menunggang bagal dengan perjumpaannya dengan orang-orang Daud, memperbaiki penyebutan tarbantin sebagai jenis pohon yang dimaksud teks, dan membuat catatan kaki selaras dengan frasa yang diterjemahkan. "Yang ada di bawahnya" mempertahankan rujukan tekstual pada bagal tanpa menambahkan rincian tentang rambut Absalom.
