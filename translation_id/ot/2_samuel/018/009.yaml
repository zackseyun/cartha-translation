  text: וַ/יִּקָּרֵא֙ אַבְשָׁל֔וֹם לִ/פְנֵ֖י עַבְדֵ֣י דָוִ֑ד וְ/אַבְשָׁל֞וֹם רֹכֵ֣ב עַל הַ/פֶּ֗רֶד וַ/יָּבֹ֣א הַ/פֶּ֡רֶד תַּ֣חַת שׂוֹבֶךְ֩ הָ/אֵלָ֨ה הַ/גְּדוֹלָ֜ה וַ/יֶּחֱזַ֧ק רֹאשׁ֣/וֹ בָ/אֵלָ֗ה וַ/יֻּתַּן֙ בֵּ֤ין הַ/שָּׁמַ֨יִם֙ וּ/בֵ֣ין הָ/אָ֔רֶץ וְ/הַ/פֶּ֥רֶד אֲשֶׁר תַּחְתָּ֖י/ו עָבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/009.yaml
  text: Absalom happened to come before David’s servants while Absalom was riding on the mule. The mule went under the thick branches of a large terebinth[a], and his head got caught in the terebinth, so that he was left hanging between heaven and earth while the mule that was under him passed on.
translation:
  language: id
  text: Absalom kebetulan berhadapan dengan orang-orang Daud ketika ia sedang menunggang bagal. Bagal itu melewati bawah cabang-cabang rimbun sebatang pohon tarbantin besar[a], dan kepala Absalom tersangkut pada pohon itu. Ia pun tergantung di antara langit dan bumi, sementara bagal yang ada di bawahnya terus berjalan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di bawah cabang-cabang rimbun sebatang pohon ek besar.” Kata Ibrani אֵלָה dapat diterjemahkan lebih umum sebagai sejenis pohon besar; “tarbantin” merupakan padanan yang lebih khusus di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרֵא ... לִפְנֵי
  choice: Kebetulan ... berhadapan dengan
  rationale: Bentuk Nifal dari קרא dalam konteks ini menunjukkan pertemuan yang terjadi tanpa disengaja. Ungkapan ini menyampaikan sifat kebetulan tersebut secara alami.
- source_word: עַבְדֵי דָוִד
  choice: anak buah Daud
  rationale: Dalam konteks militer, עֲבָדִים menunjuk kepada orang-orang yang mengabdi dan bertempur di bawah pimpinan raja; 'anak buah' lebih alami daripada 'hamba-hamba' dalam adegan ini.
- source_word: רֹכֵב עַל הַפֶּרֶד
  choice: sedang menunggang bagal
  rationale: Menyampaikan konstruksi partisipial dan keadaan Absalom pada saat perjumpaan; פֶּרֶד berarti bagal tanpa penentuan jenis kelamin atau umur.
- source_word: תַּחַת שׂוֹבֶךְ הָאֵלָה הַגְּדוֹלָה
  choice: di bawah jalinan cabang-cabang sebatang pohon besar, yaitu pohon tarbantin
  rationale: שׂוֹבֶךְ menggambarkan jalinan atau kerimbunan cabang, sedangkan אֵלָה paling khusus menunjuk pada tarbantin. Susunan ini tetap jelas bagi pembaca yang mungkin tidak mengenal nama pohon tersebut.
- source_word: וַיֶּחֱזַק רֹאשׁוֹ בָאֵלָה
  choice: kepala Absalom tersangkut pada pohon itu
  rationale: Secara harfiah kepalanya tertahan kuat pada pohon. 'Tersangkut' menyampaikan kejadian tak disengaja tanpa menambahkan bahwa rambutnya yang tersangkut, sesuatu yang tidak dikatakan teks Ibrani.
- source_word: וַיֻּתַּן בֵּין הַשָּׁמַיִם וּבֵין הָאָרֶץ
  choice: Ia pun tergantung di antara langit dan bumi
  rationale: Pasif נתן di sini menyatakan keadaan Absalom yang tertinggal dalam posisi menggantung. Ungkapan Ibrani konvensional 'antara langit dan bumi' dipertahankan.
- source_word: עָבָר
  choice: terus berjalan
  rationale: Menunjukkan bahwa bagal bergerak terus setelah Absalom tersangkut; pilihan ini alami dalam narasi Indonesia.
theological_decisions:
- issue: Bagian tubuh yang tersangkut
  choice: kepala Absalom tersangkut
  alternative: rambut Absalom tersangkut
  rationale: Teks Masoret secara eksplisit menyebut רֹאשׁוֹ, 'kepalanya', bukan rambutnya. Terjemahan tidak memasukkan penjelasan tradisional yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Anak buah' dipakai untuk konteks pasukan, sedangkan 'bagal' dan 'tarbantin' mempertahankan ketepatan leksikal. Nama Absalom diulang pada klausa tentang kepala agar rujukan pronomina tidak kabur.
