base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/029.yaml
  text: And the king said[a], “Is it well with the young man Absalom?” Ahimaaz said, “I saw a great commotion when Joab sent the king’s servant and your servant, but I did not know what it was.”
translation:
  language: id
  text: Raja bertanya, “Apakah pemuda itu, Absalom, baik-baik saja?” Ahimaas menjawab, “Saya melihat keributan besar[a] ketika Yoab mengutus hamba raja dan hambamu, tetapi saya tidak tahu apa itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerumunan besar” atau “kegaduhan besar”; kata Ibrani yang dipakai dapat menunjuk pada kerumunan, bunyi gaduh, atau kegemparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: baik-baik saja
  rationale: Dalam pertanyaan ini, שָׁלוֹם menanyakan keadaan atau kesejahteraan Absalom. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya pada keselamatan fisik.
- source_word: לַנַּעַר לְאַבְשָׁלוֹם
  choice: Absalom, pemuda itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. Di sini “pemuda” sesuai dengan konteks, sedangkan susunan aposisional mempertahankan cara Daud menyebut Absalom secara tidak langsung.
- source_word: הֶהָמוֹן הַגָּדוֹל
  choice: keributan besar
  rationale: הָמוֹן dapat menunjuk pada orang banyak, bunyi gaduh, atau kegemparan. “Keributan” menangkap perpaduan gerak dan kegaduhan dalam konteks tanpa memastikan sesuatu yang tidak dinyatakan teks.
- source_word: לִשְׁלֹחַ
  choice: ketika ... mengutus
  rationale: Infinitif dengan ל paling wajar diungkapkan sebagai klausa waktu dalam bahasa Indonesia.
- source_word: עֶבֶד הַמֶּלֶךְ
  choice: hamba raja
  rationale: עֶבֶד di sini menunjuk pada bawahan atau utusan kerajaan; “hamba” sesuai dengan latar istana dan register narasi.
- source_word: וְאֶת עַבְדֶּךָ
  choice: dan hambamu
  rationale: Ungkapan ini mempertahankan formula merendahkan diri yang dipakai Ahimaas ketika menyebut dirinya di hadapan raja.
- source_word: וְלֹא יָדַעְתִּי מָה
  choice: tetapi saya tidak tahu apa yang terjadi
  rationale: Bahasa Ibrani secara harfiah berakhir dengan “aku tidak tahu apa”. Penambahan “yang terjadi” melengkapi elipsis secara alami tanpa menambah isi substantif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan “saya” dipakai dalam jawaban Ahimaas, sementara “hambamu” mempertahankan formula kesopanan istana dari teks Ibrani. Penanda catatan kaki ditempatkan sesudah frasa yang memang dijelaskannya, yaitu “keributan besar”.
