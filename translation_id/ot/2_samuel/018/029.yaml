  - severity: low
    issue: “Apa yang terjadi” sedikit memperjelas elipsis lebih jauh daripada teks sumber.
    rationale: Ibrani hanya menyatakan “aku tidak tahu apa.” “Apa itu” melengkapi tata bahasa Indonesia dengan tambahan yang lebih minimal.
