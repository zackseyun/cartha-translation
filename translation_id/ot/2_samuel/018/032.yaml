base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/032.yaml
  text: Then the king said to the Cushite[a], “Is it well with the young man Absalom?” And the Cushite said, “May the enemies of my lord the king, and all who rise up against you for evil[b], be like that young man.”
translation:
  language: id
  text: Lalu raja bertanya kepada orang Kush itu, “Apakah pemuda Absalom itu baik-baik saja?[a]” Orang Kush itu menjawab, “Semoga musuh-musuh Tuanku, ya raja, dan semua orang yang bangkit melawan Tuanku untuk mencelakakan Tuanku, menjadi seperti pemuda itu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah pemuda Absalom itu selamat?” Secara harfiah, bahasa Ibrani menanyakan kesejahteraan atau keadaan ‘damai/sejahtera’ (shalom), yang maknanya lebih luas daripada sekadar apakah ia masih hidup.
    reason: lexical_alternative
  - marker: b
    text: Orang Kush menjawab secara tidak langsung. Perkataannya menyiratkan bahwa Absalom telah mengalami nasib yang patut menimpa musuh-musuh raja, tanpa menyebutkan kematiannya secara terus terang.
    reason: cultural_note
lexical_decisions:
- source_word: הַכּוּשִׁי
  choice: orang Kush
  rationale: Bentuk nisbah ini menunjuk kepada seseorang dari Kush. “Orang Kush” mempertahankan sebutan geografis-etnis Ibrani tanpa menyamakannya secara sempit dengan identitas kebangsaan modern.
- source_word: הֲשָׁלוֹם
  choice: Apakah ... baik-baik saja?
  rationale: Kata שָׁלוֹם menanyakan keadaan, kesejahteraan, atau keselamatan Absalom secara luas. Ungkapan Indonesia ini alami dan tidak membatasi pertanyaan hanya pada apakah ia masih hidup.
- source_word: לַנַּעַר
  choice: pemuda
  rationale: נַעַר dapat berarti anak laki-laki, orang muda, atau pemuda. Karena Absalom sudah dewasa, “pemuda” lebih tepat daripada “anak” dan tetap mempertahankan cara Daud menyebutnya.
- source_word: יִהְיוּ כַנַּעַר
  choice: Biarlah ... menjadi seperti pemuda itu
  rationale: Bentuk jussif menyatakan harapan atau kutukan. Ungkapan ini mempertahankan jawaban tidak langsung orang Kush tanpa menyatakan kematian Absalom secara gamblang.
- source_word: אֹיְבֵי אֲדֹנִי הַמֶּלֶךְ
  choice: semua musuh tuanku raja
  rationale: Pilihan ini mempertahankan sapaan istana yang hormat dan hubungan kepunyaan dalam teks Ibrani.
- source_word: קָמוּ עָלֶיךָ לְרָעָה
  choice: yang bangkit melawan Tuanku dengan niat jahat
  rationale: קום על menyatakan perlawanan atau pemberontakan, sedangkan לְרָעָה menunjukkan maksud mencelakakan atau tujuan jahat. Terjemahan ini menyampaikan kedua unsur secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Jawaban orang Kush tentang nasib Absalom
  choice: 'Mempertahankan ungkapan tidak langsung: “menjadi seperti pemuda itu”'
  alternative: Menyatakan secara eksplisit bahwa Absalom telah mati
  rationale: Teks Ibrani sengaja menyampaikan nasib Absalom melalui harapan mengenai musuh-musuh raja. Menjelaskan kematiannya di dalam teks utama akan menghilangkan ketegangan dan kehalusan retoris tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Orang Kush” mempertahankan sebutan sumber; “tuanku raja” menjaga suasana istana. Huruf kapital pada “Tuanku” dalam sapaan langsung membedakannya dari frasa deskriptif “tuanku raja” dan menghindari pemakaian “Anda” yang terlalu modern.
