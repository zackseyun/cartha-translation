  naturalness: Bahasanya pada dasarnya wajar dan bermartabat. Sapaan 'tuanku raja' kurang idiomatis dalam bahasa Indonesia modern; 'Tuanku, ya raja' lebih lancar sekaligus mempertahankan register istana. Kapitalisasi 'tuanku/Tuanku' juga perlu diseragamkan dalam sapaan langsung.
  terminology: '''Orang Kush'' tepat dan tidak memaksakan padanan etnis atau kebangsaan modern. ''Pemuda'' sesuai untuk נַעַר dalam konteks Absalom. ''Baik-baik saja'' menyampaikan pertanyaan tentang keadaan/kesejahteraan dengan alami.'
  issues:
