  to: Lalu raja bertanya kepada orang Kush itu, “Apakah pemuda Absalom itu baik-baik saja?[a]” Orang Kush itu menjawab, “Semoga musuh-musuh Tuanku, ya raja, dan semua orang yang bangkit melawan Tuanku untuk mencelakakan Tuanku, menjadi seperti pemuda itu.[b]”
