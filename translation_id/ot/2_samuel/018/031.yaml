  text: וְ/הִנֵּ֥ה הַ/כּוּשִׁ֖י בָּ֑א וַ/יֹּ֣אמֶר הַ/כּוּשִׁ֗י יִתְבַּשֵּׂר֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּֽי שְׁפָטְ/ךָ֤ יְהוָה֙ הַ/יּ֔וֹם מִ/יַּ֖ד כָּל הַ/קָּמִ֥ים עָלֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/031.yaml
  text: And behold[a], the Cushite came, and the Cushite said, “Let my lord the king receive the good news[b], for Yahweh has vindicated you today from the hand of all who rose up against you.”
translation:
  language: id
  text: Lihatlah, orang Kush[a] itu datang. Orang Kush itu berkata, “Tuanku raja, terimalah kabar baik! Sebab hari ini Yahweh telah membela tuanku[b] dari tangan semua orang yang bangkit melawan tuanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “orang Etiopia.” Secara harfiah: “orang Kush.”'
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah menghakimi demi tuanku” atau “telah memberi tuanku keadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menghadirkan kedatangan utusan secara hidup dan langsung dalam alur cerita.
- source_word: הַכּוּשִׁי
  choice: orang Kush
  rationale: Menerjemahkan bentuk berartikel itu sebagai sebutan etnis, bukan nama pribadi. Pilihan ini dekat dengan bahasa Ibrani dan tidak menyamakannya secara terlalu pasti dengan wilayah Etiopia modern.
- source_word: בָּא
  choice: datang
  rationale: Padanan naratif yang sederhana dan alami untuk tindakan kedatangan.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan baku bagi verba ujaran dalam rangkaian narasi Ibrani.
- source_word: יִתְבַּשֵּׂר
  choice: Terimalah kabar baik
  rationale: Bentuk hitpael imperfek berfungsi sebagai ajakan atau perintah halus. Ungkapan ini menyampaikan pengumuman sang utusan secara wajar dalam bahasa Indonesia.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan hormat dalam lingkungan istana tanpa memberi kesan bahwa אֲדֹנִי merupakan sebutan ilahi di sini.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau isi kabar baik yang baru diumumkan.
- source_word: שְׁפָטְךָ
  choice: telah membela Tuanku
  rationale: Menangkap nuansa yudisial bahwa Yahweh bertindak mengadili demi kepentingan raja. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan alami yang mempertahankan penekanan waktu.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan citra konkret ungkapan Ibrani mengenai kuasa atau kendali pihak lawan; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: כָּל הַקָּמִים עָלֶיךָ
  choice: semua orang yang bangkit melawan Tuanku
  rationale: Mempertahankan gambaran verbal tentang orang-orang yang tampil atau memberontak melawan raja tanpa mempersempit maknanya menjadi satu jenis permusuhan saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa yudisial שְׁפָטְךָ
  choice: telah membela Tuanku
  alternative: telah menghakimi demi Tuanku atau telah memberi Tuanku keadilan
  rationale: Dalam konteks ini tindakan penghakiman Yahweh berpihak pada raja terhadap para penentangnya. Terjemahan utama menyatakan pembelaan yudisial itu, sedangkan catatan kaki menjaga ambiguitas leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “tuanku raja” mempertahankan suasana istana, sedangkan pengulangan “Tuanku” menghindari pronomina yang dapat terasa kurang hormat dalam ujaran seorang utusan kepada raja. Tanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya.
