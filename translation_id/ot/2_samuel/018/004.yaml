base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/004.yaml
  text: The king said to them[a], “What seems good in your eyes, I will do.” So the king stood beside the gate[c][b], and all the people went out by hundreds and by thousands.
translation:
  language: id
  text: Raja berkata kepada mereka[a], “Apa yang kalian pandang baik akan kulakukan.” Lalu raja berdiri di sisi gerbang[b], dan seluruh rakyat keluar menurut kelompok-kelompok seratus dan seribu orang[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Apa yang baik di mata kalian akan kulakukan.” Maksudnya ialah apa yang mereka nilai baik.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di dekat gerbang.” Bahasa Ibrani secara harfiah berbunyi “ke tangan gerbang,” yaitu ungkapan untuk tempat di sisinya.'
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, mereka keluar dalam satuan-satuan militer yang terorganisasi.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יִיטַב בְּעֵינֵיכֶם
  choice: Apa yang kalian pandang baik
  rationale: Ungkapan Ibrani secara harfiah menyebut apa yang baik 'di mata kalian' dan menyatakan penilaian mereka. 'Kalian pandang baik' mempertahankan citra penglihatan secara alami dalam bahasa Indonesia.
- source_word: אֶעֱשֶׂה
  choice: akan kulakukan
  rationale: Menerjemahkan bentuk verba secara langsung dan mempertahankan penerimaan raja terhadap usulan mereka tanpa menambahkan nuansa lain.
- source_word: אֶל יַד הַשַּׁעַר
  choice: di sisi gerbang
  rationale: Ungkapan harfiah 'pada tangan gerbang' merupakan idiom lokasi yang berarti di samping atau dekat gerbang.
- source_word: וְכָל הָעָם
  choice: seluruh rakyat
  rationale: Walaupun konteksnya militer, nomina Ibrani berarti 'rakyat/umat'. Pilihan ini mempertahankan kata sumber, sedangkan frasa berikutnya menjelaskan pengorganisasian militer mereka.
- source_word: יָצְאוּ
  choice: keluar
  rationale: Verba Ibrani bermakna umum 'keluar'. Terjemahan ini tidak menambahkan gagasan 'berbaris' yang tidak dinyatakan oleh verbanya sendiri.
- source_word: לְמֵאוֹת וְלַאֲלָפִים
  choice: dalam pasukan-pasukan beranggotakan seratus dan seribu orang
  rationale: Dalam konteks ini, angka-angka tersebut menunjuk pada satuan militer, bukan sekadar jumlah orang yang keluar. Perumusan ini menjelaskan fungsi frasa sambil mempertahankan kedua bilangan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan jamak 'kalian' memperjelas bahwa raja berbicara kepada beberapa orang. Istilah 'rakyat' mempertahankan keluasan הָעָם, sedangkan 'pasukan-pasukan' pada klausa akhir membuat konteks pengelompokan militer dapat dipahami pembaca umum.
