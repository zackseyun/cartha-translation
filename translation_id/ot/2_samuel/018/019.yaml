  text: וַ/אֲחִימַ֤עַץ בֶּן צָדוֹק֙ אָמַ֔ר אָר֣וּצָה נָּ֔א וַ/אֲבַשְּׂרָ֖ה אֶת הַ/מֶּ֑לֶךְ כִּי שְׁפָט֥/וֹ יְהוָ֖ה מִ/יַּ֥ד אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/019.yaml
  text: Then Ahimaaz the son of Zadok said[a], “Please let me run and bring news to the king[b], for Yahweh has delivered him from the hand of his enemies.”
translation:
  language: id
  text: Lalu Ahimaas anak Zadok berkata, “Izinkanlah aku berlari dan menyampaikan kabar[a] kepada raja, sebab Yahweh telah melepaskannya[b] dari tangan musuh-musuhnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyampaikan kabar baik.” Kata Ibrani yang diterjemahkan “menyampaikan kabar” sering dipakai untuk membawa kabar baik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah membela perkaranya” atau “telah memberi keadilan kepadanya.” Kata Ibrani ini dapat menekankan tindakan pengadilan Yahweh yang berpihak kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ בֶּן צָדוֹק אָמַר
  choice: Lalu Ahimaas anak Zadok berkata
  rationale: Waw meneruskan alur narasi dan secara alami diterjemahkan “Lalu”. Nama serta hubungan keluarga dipertahankan secara langsung.
- source_word: אָרוּצָה נָּא
  choice: Izinkanlah aku berlari
  rationale: Bentuk kohortatif menyatakan keinginan atau permohonan, sedangkan נָא memperhalusnya; “Izinkanlah” menyampaikan daya permohonan itu dalam bahasa Indonesia yang wajar.
- source_word: וַ/אֲבַשְּׂרָה אֶת הַ/מֶּלֶךְ
  choice: dan menyampaikan kabar kepada raja
  rationale: Bentuk piel בשׂר berarti membawa atau memberitakan kabar, sering kali kabar baik. Terjemahan netral “menyampaikan kabar” tidak menghilangkan kemungkinan konotasi baiknya.
- source_word: כִּי
  choice: bahwa
  rationale: Dalam ujaran ini כִּי dapat memperkenalkan isi kabar yang hendak disampaikan. “Bahwa” menghasilkan hubungan sintaksis yang alami dalam bahasa Indonesia.
- source_word: שְׁפָטוֹ יְהוָה
  choice: Yahweh telah membela perkaranya
  rationale: שׁפט dengan pronomina objek di konteks ini menyatakan tindakan penghakiman yang berpihak kepada raja, yakni memberi keadilan atau pembenaran kepadanya. Ungkapan ini mempertahankan nuansa yudisial.
- source_word: מִיַּד אֹיְבָיו
  choice: dan melepaskannya dari tangan musuh-musuhnya
  rationale: Frasa Ibrani secara harfiah berarti “dari tangan musuh-musuhnya”, dengan “tangan” sebagai gambaran kuasa atau kendali. Kata “melepaskannya” dibuat eksplisit agar hubungan hasil dari pembelaan hukum itu terbaca alami tanpa mengganti citra sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
theological_decisions:
- issue: Nuansa yudisial dan penyelamatan dalam שְׁפָטוֹ ... מִיַּד אֹיְבָיו
  choice: telah membela perkaranya dan melepaskannya dari tangan musuh-musuhnya
  alternative: telah memberi keadilan kepadanya dari tangan musuh-musuhnya; telah membebaskannya dari tangan musuh-musuhnya
  rationale: Kata שׁפט terutama membawa gambaran penghakiman atau pembelaan hukum, sedangkan frasa “dari tangan musuh-musuhnya” menunjukkan hasil penyelamatan. Terjemahan utama mempertahankan kedua sisi tanpa mereduksi salah satunya.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi; transliterasi mempertahankan bentuk nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Izinkanlah” menjaga kesopanan permohonan; “membela perkaranya” mempertahankan metafora yudisial; dan idiom “dari tangan” dipertahankan karena tetap mudah dipahami dalam bahasa Indonesia.
