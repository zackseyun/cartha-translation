  terminology: “Yahweh” tepat untuk יהוה sesuai kebijakan yang diberikan. “Menyampaikan kabar” merupakan padanan netral yang baik bagi בשר; kemungkinan ‘kabar baik’ layak dicatat. Untuk שפט, “melepaskannya” dipilih dalam teks utama karena konteks ‘dari tangan musuh-musuhnya’, sementara nuansa pengadilan dipertahankan dalam catatan kaki.
