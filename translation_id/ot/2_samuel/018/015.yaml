  text: Then ten young men, Joab’s armor-bearers, surrounded Absalom and struck him and killed him.
translation:
  language: id
  text: Lalu sepuluh pemuda, para pembawa senjata Yoab, mengepung Absalom, lalu memukul dan membunuhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: mengepung
  rationale: Dalam konteks penyerangan ini, סבב menunjukkan gerakan mengelilingi seseorang. 'Mengepung' menyampaikan tindakan taktis itu secara alami dalam bahasa Indonesia.
- source_word: עֲשָׂרָה נְעָרִים
  choice: sepuluh orang muda
  rationale: נְעָרִים di sini merujuk kepada bawahan militer yang masih muda, bukan anak-anak. Pilihan ini mempertahankan arti leksikal tanpa menentukan jabatan mereka secara berlebihan.
- source_word: נֹשְׂאֵי כְּלֵי יוֹאָב
  choice: para pembawa senjata Yoab
  rationale: Frasa ini secara harfiah berarti orang-orang yang membawa perlengkapan atau senjata Yoab. 'Para pembawa senjata' jelas, alami, dan tidak mempersempit כְּלִי menjadi baju zirah saja.
- source_word: וַיַּכּוּ
  choice: memukul
  rationale: נכה berarti memukul atau menghantam. 'Memukul' mempertahankan tindakan fisik yang dinyatakan teks dan tidak meleburkannya ke dalam tindakan membunuh yang disebut sesudahnya.
- source_word: וַיְמִיתֻהוּ
  choice: membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. 'Membunuhnya' merupakan padanan langsung dan alami.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ini mengikuti bentuk baku yang lazim dalam bahasa Indonesia.
