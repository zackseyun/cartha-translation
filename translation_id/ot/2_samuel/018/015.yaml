  text: וַ/יָּסֹ֨בּוּ֙ עֲשָׂרָ֣ה נְעָרִ֔ים נֹשְׂאֵ֖י כְּלֵ֣י יוֹאָ֑ב וַ/יַּכּ֥וּ אֶת אַבְשָׁל֖וֹם וַ/יְמִיתֻֽ/הוּ־׃
base_translation:
