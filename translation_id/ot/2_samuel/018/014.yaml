translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Berlama-lama' dipilih sebagai ungkapan umum untuk penundaan; 'menghunjamkan' mempertahankan daya kekerasan tindakan. Pengulangan 'jantung' sengaja dipertahankan untuk mencerminkan gaya dan permainan kata teks Ibrani.
