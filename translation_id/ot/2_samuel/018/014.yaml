  terminology: ‘Yoab’, ‘Absalom’, ‘lembing’, dan ‘tarbantin’ sesuai register Alkitab bahasa Indonesia modern. Alternatif untuk אֵלָה sebaiknya ‘pohon ek’, bukan ‘pohon pasang’, karena ‘ek’ merupakan alternatif umum yang jelas bagi pembaca modern. Catatan untuk שְׁבָטִים perlu menyebut rentang ‘tongkat/staf/tongkat kerajaan’ tanpa memperkenalkan ‘batang’ yang tidak merupakan padanan leksikal yang baik dalam konteks ini.
