base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/014.yaml
  text: Joab said[a], “Not so[b]; I will not wait before you.” Then he took three spears in his hand and drove them into the heart of Absalom while he was still alive in the heart of the terebinth.
translation:
  language: id
  text: Yoab berkata, “Tidak demikian; aku tidak akan menunggu seperti ini di hadapanmu.” Lalu ia mengambil tiga lembing[a] di tangannya dan menghunjamkannya ke jantung Absalom, ketika Absalom masih hidup di tengah pohon tarbantin[b] itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga tongkat” atau “tiga staf.” Kata Ibrani yang dipakai juga dapat berarti tongkat kerajaan, tetapi dalam konteks ini kemungkinan besar menunjuk senjata untuk menusuk.
    reason: lexical_alternative
  - marker: b
    text: Atau “pohon ek.” Kata Ibrani אֵלָה biasanya menunjuk pohon tarbantin. Secara harfiah teks Ibrani berbunyi “di jantung pohon itu”; ungkapan ini berarti “di tengah pohon itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹחִילָה לְפָנֶיךָ
  choice: aku tidak mau berlama-lama seperti ini di hadapanmu
  rationale: Bentuk hiphil dari יחל menyatakan menunggu atau menunda. Dalam konteks ini Yoab menolak untuk terus tertahan oleh keraguan orang muda itu. Ungkapan ini mempertahankan unsur כֵן ('seperti ini/demikian') dan לְפָנֶיךָ ('di hadapanmu') dalam bahasa Indonesia yang wajar.
- source_word: שְׁלֹשָׁה שְׁבָטִים
  choice: tiga lembing
  rationale: שֵׁבֶט dapat berarti tongkat, batang, atau lambang kekuasaan, tetapi konteks militer dan tindakan menghunjamkannya ke jantung menunjukkan senjata untuk menusuk. 'Lembing' menyampaikan makna kontekstual itu tanpa menghilangkan alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: וַיִּתְקָעֵם
  choice: menghunjamkannya
  rationale: תקע di sini menggambarkan tindakan menusukkan atau menancapkan benda dengan kuat. 'Menghunjamkan' menyatakan kekerasan tindakan itu secara ringkas dan alami.
- source_word: בְּלֵב אַבְשָׁלוֹם
  choice: ke jantung Absalom
  rationale: Teks Ibrani secara langsung menyebut לֵב, 'jantung/hati'. Dalam konteks serangan fisik, 'jantung' adalah padanan anatomis yang paling jelas.
- source_word: עוֹדֶנּוּ חַי
  choice: ketika Absalom masih hidup
  rationale: Klausa ini menegaskan bahwa Absalom belum mati saat Yoab menyerangnya. Nama diulangi dalam bahasa Indonesia agar rujukan pronominal tetap jelas.
- source_word: בְּלֵב הָאֵלָה
  choice: di jantung pohon tarbantin itu
  rationale: אֵלָה lazimnya menunjuk pohon tarbantin. Pemakaian 'jantung' mempertahankan pengulangan לֵב dan permainan ungkapan antara jantung Absalom dan bagian tengah pohon, meskipun dalam frasa kedua maknanya adalah 'di tengah'.
