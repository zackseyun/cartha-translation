base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/022.yaml
  text: Then Ahimaaz son of Zadok said again to Joab[a], “Whatever happens, please let me also run after the Cushite.” But Joab said, “Why would you run, my son[b], since you have no message that will bring reward?”
translation:
  language: id
  text: Kemudian Ahimaas anak Zadok kembali berkata kepada Yoab, “Apa pun yang terjadi,[a] izinkanlah aku juga berlari mengikuti orang Kus itu.” Namun Yoab berkata, “Mengapa engkau hendak berlari, anakku? Tidak ada kabar yang akan mendatangkan imbalan bagimu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini dapat juga diterjemahkan, “Bagaimanapun juga.”
    reason: lexical_alternative
  - marker: b
    text: Klausa Ibrani terakhir sulit dipastikan; mungkin juga berarti “engkau tidak membawa kabar yang akan disambut baik” atau “engkau tidak akan mendapat imbalan atas kabar itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... וַיֹּאמֶר
  choice: kembali berkata
  rationale: Ungkapan harfiahnya berarti ‘menambahkan lagi lalu berkata’ dan berfungsi untuk menunjukkan bahwa Ahimaas mengulangi permohonannya. ‘Kembali berkata’ alami dalam bahasa Indonesia dan mempertahankan fungsi wacananya.
- source_word: וִיהִי מָה
  choice: Apa pun yang terjadi
  rationale: Ungkapan idiomatis ini menyatakan tekad tanpa memedulikan akibat atau hasilnya. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אָרֻצָה נָּא
  choice: izinkanlah aku ... berlari
  rationale: Bentuk kohortatif dengan נָא menyampaikan permohonan yang sungguh-sungguh tetapi sopan. ‘Izinkanlah aku’ mengungkapkan nuansa volitif itu secara alami.
- source_word: גַם אֲנִי
  choice: aku juga
  rationale: Frasa ini menekankan keinginan Ahimaas untuk menjadi pelari tambahan selain orang Kus itu.
- source_word: הַכּוּשִׁי
  choice: orang Kus itu
  rationale: Istilah ini menerjemahkan etnonim Ibrani secara langsung dan menghindari penyamaan anakronistis dengan batas geografis Etiopia modern.
- source_word: לָמָּה זֶּה אַתָּה רָץ
  choice: Mengapa engkau hendak berlari
  rationale: Pertanyaan ini menyampaikan keberatan Yoab terhadap maksud Ahimaas untuk berlari. ‘Hendak’ sesuai dengan konteks permintaan yang belum dilaksanakan dan lebih alami daripada mempertahankan unsur demonstratif secara kaku.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan ini kemungkinan bersifat akrab atau bernada kebapakan, bukan pernyataan bahwa Ahimaas adalah anak kandung Yoab.
- source_word: וּלְכָה אֵין בְּשׂוֹרָה מֹצֵאת
  choice: Tidak ada kabar yang akan mendatangkan imbalan bagimu
  rationale: Klausa Ibrani ini eliptis dan sulit. Pilihan utama mempertahankan kemungkinan bahwa penyampaian kabar tersebut tidak akan menghasilkan keuntungan atau penghargaan bagi Ahimaas, tanpa menutup alternatif bahwa kabarnya tidak akan diterima dengan baik.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama ditulis menurut bentuk Indonesia yang lazim: Ahimaas, Zadok, dan Yoab. ‘Orang Kus’ dipakai untuk etnonim, sedangkan ‘engkau’ dan ‘anakku’ mempertahankan nada percakapan yang akrab namun tetap formal.'
