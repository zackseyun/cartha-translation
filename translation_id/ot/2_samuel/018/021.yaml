translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sebutan 'orang Kush' mempertahankan istilah dunia kuno; 'sujud memberi hormat' membedakan tindakan penghormatan kepada atasan dari penyembahan.
