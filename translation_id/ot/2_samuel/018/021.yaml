base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/021.yaml
  text: Then Joab said to the Cushite[a], “Go, tell the king what you have seen.” And the Cushite bowed down to Joab and ran.
translation:
  language: id
  text: Lalu Yoab berkata kepada orang Kush itu[a], “Pergilah, laporkan kepada raja apa yang telah kaulihat.” Orang Kush itu pun sujud memberi hormat kepada Yoab, lalu berlari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kushi” jika dipahami sebagai nama orang; secara tradisional, “orang Etiopia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  choice: orang Kush itu
  rationale: Bentuk ini mempertahankan penunjuk asal-usul atau etnis dalam bahasa Ibrani tanpa menyamakannya secara langsung dengan istilah geografis modern. Artikel tertentu diterjemahkan dengan 'itu'.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif הלך menyatakan perintah langsung untuk pergi; bentuk '-lah' alami dan tegas dalam bahasa Indonesia.
- source_word: הַגֵּד
  choice: laporkan
  rationale: Hifil imperatif נגד berarti memberitahukan atau menyampaikan laporan. Dalam konteks utusan yang menghadap raja, 'laporkan' lebih tepat daripada sekadar 'katakan'.
- source_word: אֲשֶׁר רָאִיתָה
  choice: apa yang telah kaulihat
  rationale: Menerjemahkan konstruksi relatif secara alami serta mempertahankan tindakan melihat yang sudah terjadi dan kini harus dilaporkan.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud memberi hormat
  rationale: Mengungkapkan gerakan merendahkan diri secara fisik dan fungsi penghormatan kepada Yoab tanpa menyiratkan penyembahan.
- source_word: וַיָּרֹץ
  choice: berlari pergi
  rationale: Mempertahankan arti lugas רוץ dan memperjelas bahwa ia segera berangkat menjalankan tugas.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw naratif memajukan urutan peristiwa; 'Lalu' merupakan penghubung narasi yang alami dalam bahasa Indonesia.
