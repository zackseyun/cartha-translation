base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/030.yaml
  text: The king said[a], “Turn aside; stand here.” So he turned aside and stood.
translation:
  language: id
  text: Raja berkata[a], “Menyingkirlah dan berdirilah di sini.” Maka ia menyingkir dan berdiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berbaliklah dan berdirilah di sini.” Kata kerja Ibrani ini dapat berarti berbalik secara umum, tetapi dalam konteks ini kemungkinan besar berarti menyingkir untuk memberi tempat kepada utusan berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר yang memperkenalkan ucapan langsung; “berkata” merupakan padanan Indonesia yang alami.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit yang menunjuk kepada raja yang sudah diketahui dalam konteks; bahasa Indonesia secara alami tidak memerlukan penanda definit tersendiri.
- source_word: סֹב
  choice: Menyingkirlah
  rationale: Imperatif dari סבב dapat menyatakan tindakan berbalik atau bergerak ke samping. Dalam konteks ini, raja tampaknya menyuruh pelari menepi untuk memberi tempat kepada utusan berikutnya.
- source_word: הִתְיַצֵּב
  choice: berdirilah
  rationale: Imperatif hitpael dari יצב berarti menempatkan diri atau berdiri pada suatu posisi; “berdirilah” ringkas dan alami dalam perintah ini.
- source_word: כֹּה
  choice: di sini
  rationale: Dalam konteks perintah ini, adverbia tersebut menunjuk tempat tertentu; “di sini” merupakan padanan yang paling wajar.
- source_word: וַיִּסֹּב
  choice: ia menyingkir
  rationale: Menggambarkan pelaksanaan perintah סֹב dan mempertahankan hubungan leksikal dengan “Menyingkirlah”.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Padanan naratif yang lugas bagi עמד dan sesuai dengan pelaksanaan perintah sebelumnya.
