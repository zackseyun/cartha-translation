  terminology: Nama Yoab, Abisai, Itai, dan Absalom konsisten dengan bentuk Alkitab bahasa Indonesia yang lazim. “Panglima” tepat bagi שָׂרִים dalam konteks militer. “Demi aku” dapat dipertahankan sebagai ungkapan padat untuk לִי, yang menyatakan permohonan/prihatin pribadi raja.
