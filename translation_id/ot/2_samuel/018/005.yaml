base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/005.yaml
  text: And the king commanded Joab and Abishai and Ittai[a], saying, “Deal gently for my sake with the young man Absalom.” And all the people heard when the king commanded all the commanders concerning Absalom.
translation:
  language: id
  text: Lalu raja memerintahkan Yoab, Abisai, dan Itai, katanya, “Demi aku, perlakukanlah anak muda itu, Absalom, dengan lembut.”[a] Semua orang mendengar ketika raja memberi perintah kepada semua panglima mengenai Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demi aku, perlakukanlah dengan lembut anak muda itu, Absalom.” Bahasa Ibrani merangkum permohonan pribadi raja dan penyebutan Absalom dalam ungkapan yang singkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan perintah yang berwibawa; bentuk ini alami dalam narasi Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar yang digunakan teks Ibrani tanpa menggantinya dengan nama Daud.
- source_word: אֶת יוֹאָב וְאֶת אֲבִישַׁי וְאֶת אִתַּי
  choice: Yoab, Abisai, dan Itai
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; pengulangan penanda objek tidak perlu ditampilkan.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan kutipan langsung secara alami dan tetap mempertahankan corak naratif.
- source_word: לְאַט
  choice: perlakukanlah ... dengan lembut
  rationale: Bentuk adverbial ini menyatakan kelembutan atau pengekangan dalam cara Absalom ditangani; pengungkapan verbal diperlukan dalam bahasa Indonesia.
- source_word: לִי
  choice: demi aku
  rationale: Mengungkapkan kepentingan dan permohonan pribadi Daud dengan ringkas, tanpa menjadikannya sekadar manfaat praktis.
- source_word: לַנַּעַר
  choice: orang muda itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau orang muda. Absalom sudah dewasa, sehingga pilihan ini menjaga nada kasih seorang ayah tanpa membuatnya terdengar masih kanak-kanak.
- source_word: לְאַבְשָׁלוֹם
  choice: Absalom
  rationale: Dipahami sebagai penjelasan atau identifikasi terhadap 'orang muda itu'; susunan Indonesia menempatkan nama lebih dahulu agar perintah terdengar alami.
- source_word: וְכָל הָעָם שָׁמְעוּ
  choice: Seluruh rakyat mendengar
  rationale: הָעָם secara harfiah berarti rakyat atau orang banyak. Konteksnya militer, tetapi teks menekankan bahwa perintah itu terdengar secara terbuka.
- source_word: בְּצַוֺּת
  choice: ketika ... memberi perintah
  rationale: Infinitif dengan ב menandai keadaan yang bersamaan dan paling alami diterjemahkan sebagai klausa waktu.
- source_word: כָּל הַשָּׂרִים
  choice: semua panglima
  rationale: Dalam konteks perang, שׂרים menunjuk para pemimpin militer; 'panglima' tepat dan mudah dipahami.
- source_word: עַל דְּבַר אַבְשָׁלוֹם
  choice: mengenai Absalom
  rationale: Menyampaikan arti 'tentang' atau 'berkenaan dengan' secara ringkas dan wajar.
