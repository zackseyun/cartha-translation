  to: Lalu raja memerintahkan Yoab, Abisai, dan Itai, katanya, “Demi aku, perlakukanlah anak muda itu, Absalom, dengan lembut.”[a] Semua orang mendengar ketika raja memberi perintah kepada semua panglima mengenai Absalom.
