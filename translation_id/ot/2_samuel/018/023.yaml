  text: וִ/יהִי מָ֣ה אָר֔וּץ וַ/יֹּ֥אמֶר ל֖/וֹ ר֑וּץ וַ/יָּ֤רָץ אֲחִימַ֨עַץ֙ דֶּ֣רֶךְ הַ/כִּכָּ֔ר וַֽ/יַּעֲבֹ֖ר אֶת הַ/כּוּשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/023.yaml
  text: But he said[a], “Whatever happens, let me run.” So he said to him[c][b], “Run.” Then Ahimaaz ran by the way of the plain and passed the Cushite.
translation:
  language: id
  text: Namun ia berkata, “Apa pun yang terjadi, izinkan aku berlari.” Lalu Yoab berkata kepadanya, “Larilah.” Maka Ahimaas berlari melalui jalan di dataran[a] dan mendahului orang Kus itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dataran ini kemungkinan adalah dataran Yordan.
    reason: cultural_note
  - marker: b
    text: Atau, “melewati orang Kus itu”; dalam konteks ini ungkapan Ibrani dapat berarti bahwa Ahimaas menyusul dan melampauinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי מָה אָרוּץ
  choice: Apa pun yang terjadi, izinkan aku berlari
  rationale: Ungkapan idiomatis ini menyatakan desakan Ahimaas untuk tetap berlari apa pun hasilnya. Bentuk Indonesia ini mempertahankan nuansa permohonan izin yang tersirat dalam konteks.
- source_word: רוּץ
  choice: Larilah
  rationale: Bentuk imperatif langsung dari רוץ, diterjemahkan secara wajar dan tegas.
- source_word: דֶּרֶךְ הַכִּכָּר
  choice: melalui jalan di dataran
  rationale: דֶּרֶךְ berarti jalan atau rute, sedangkan הַכִּכָּר menunjuk pada dataran, kemungkinan besar dataran Yordan. Teks utama tidak mempersempit lokasi melebihi bentuk Ibrani.
- source_word: וַיַּעֲבֹר אֶת־הַכּוּשִׁי
  choice: dan mendahului orang Kus itu
  rationale: Dalam konteks perlombaan lari, עבר dengan objek langsung menunjukkan bahwa Ahimaas melewati atau menyusul lalu berada di depan utusan Kus. 'Mendahului' alami dalam bahasa Indonesia tanpa memastikan bahwa kecepatannya saja menjadi fokus.
- source_word: הַכּוּשִׁי
  choice: orang Kus itu
  rationale: כּוּשִׁי adalah sebutan bagi orang dari Kus. 'Orang Kus' mempertahankan penunjukan etnis-geografis sumber dan menghindari penyamaan interpretatif dengan Etiopia modern.
- source_word: אֲחִימַעַץ
  choice: Ahimaas
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
