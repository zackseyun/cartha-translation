translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Pasukan Daud” dipilih daripada “hamba-hamba Daud” agar fungsi militer para pengikut Daud jelas bagi pembaca masa kini, sedangkan pengulangan “di sana” dipertahankan karena terdapat dua kali dalam teks Ibrani dan menegaskan lokasi kekalahan serta pembantaian.
