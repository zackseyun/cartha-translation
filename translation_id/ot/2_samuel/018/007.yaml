  yaml_path: translation/ot/2_samuel/018/007.yaml
  text: 'There the people of Israel were defeated before the servants of David[b][a], and the slaughter there was great on that day: twenty thousand men.'
translation:
  language: id
  text: 'Di sana bangsa Israel dikalahkan oleh pasukan Daud, dan pada hari itu korban tewas di sana sangat banyak: dua puluh ribu orang[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani: “dua puluh ribu.” Kata “orang” ditambahkan untuk memperjelas bahwa yang dimaksud ialah jumlah korban dalam konteks pertempuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגְפוּ
  choice: dikalahkan
  rationale: Bentuk Nifal dari נָגַף dalam konteks pertempuran menyatakan bahwa suatu pihak dipukul atau ditaklukkan. “Dikalahkan” menyampaikan makna militernya tanpa menyiratkan bahwa setiap orang tewas.
- source_word: עַם יִשְׂרָאֵל
  choice: bangsa Israel
  rationale: Secara harfiah berarti “umat/bangsa Israel.” Dalam konteks ini yang dimaksud ialah pihak Israel dalam pertempuran; “bangsa Israel” tetap dekat dengan ungkapan Ibrani dan wajar dalam narasi Indonesia.
- source_word: לִפְנֵי
  choice: oleh
  rationale: Dalam laporan militer, ungkapan ini menunjukkan pihak yang di hadapannya pihak lain kalah. Bahasa Indonesia secara alami menyatakan pelaku kekalahan dengan “oleh.”
- source_word: עַבְדֵי דָוִד
  choice: pasukan Daud
  rationale: Secara leksikal berarti para hamba, pengikut, atau orang bawahan Daud. Dalam adegan pertempuran ini mereka berfungsi sebagai pasukannya, sehingga “pasukan Daud” paling jelas dan alami.
- source_word: הַמַּגֵּפָה
  choice: pembantaian
  rationale: Kata ini dapat menunjuk pada pukulan, tulah, atau bencana yang mematikan. Dalam konteks pertempuran, kata ini menggambarkan banyaknya orang yang dipukul mati, sehingga “pembantaian” menyampaikan akibat mautnya.
- source_word: גְדוֹלָה
  choice: sangat besar
  rationale: Adjektiva ini berarti “besar.” Dalam susunan predikatif bahasa Indonesia, “sangat besar” menyampaikan penekanan laporan tersebut dengan wajar.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang langsung, jelas, dan alami.
- source_word: עֶשְׂרִים אָלֶף
  choice: dua puluh ribu orang
  rationale: Teks Ibrani hanya menyebut bilangannya. “Orang” ditambahkan agar jumlah korban dalam konteks pertempuran jelas dan alami dalam bahasa Indonesia.
