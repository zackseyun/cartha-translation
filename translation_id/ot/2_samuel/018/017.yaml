base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/017.yaml
  text: And they took Absalom and threw him into the great pit in the forest[a], and they set up over him a very large heap of stones. And all Israel fled[b], each man to his tent.
translation:
  language: id
  text: Lalu mereka mengambil Absalom dan melemparkannya ke dalam lubang besar di hutan itu. Mereka menumpukkan di atasnya timbunan batu yang sangat besar. Kemudian seluruh Israel melarikan diri, masing-masing ke kemahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “masing-masing ke kemahnya,” suatu ungkapan yang berarti bahwa mereka berpencar dan kembali ke tempat tinggal masing-masing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mereka mengambil
  rationale: Menerjemahkan makna naratif umum לקח secara langsung tanpa menambahkan unsur kekerasan yang tidak dinyatakan oleh verba itu.
- source_word: וַיַּשְׁלִיכוּ אֹתוֹ
  choice: melemparkannya
  rationale: שלך menyatakan pembuangan jasad secara keras; “melemparkannya” alami dalam bahasa Indonesia dan mempertahankan kesan tidak terhormat.
- source_word: בַיַּעַר אֶל הַפַּחַת הַגָּדוֹל
  choice: ke dalam lubang besar di hutan itu
  rationale: פחת berarti lubang atau cekungan; “lubang” paling jelas. “Hutan itu” mempertahankan artikel tertentu dan latar narasi.
- source_word: וַיַּצִּבוּ עָלָיו גַּל אֲבָנִים
  choice: mereka menimbuninya dengan tumpukan batu
  rationale: Secara harfiah mereka mendirikan atau menyusun sebuah tumpukan batu di atas Absalom. Ungkapan Indonesia ini menyampaikan tindakan dan posisi batu secara alami tanpa mengubah gambaran dasarnya.
- source_word: גָּדוֹל מְאֹד
  choice: yang sangat besar
  rationale: Mempertahankan penegasan ukuran melalui adjektiva yang diperkuat oleh מְאֹד.
- source_word: וְכָל יִשְׂרָאֵל
  choice: Kemudian seluruh pasukan Israel
  rationale: Dalam konteks pertempuran, kolektif “seluruh Israel” menunjuk kepada pihak Israel yang mengikuti Absalom. Penambahan “pasukan” mencegah pembaca mengira seluruh bangsa tanpa kecuali, sambil tetap menjaga rujukan kontekstual.
- source_word: נָסוּ
  choice: melarikan diri
  rationale: Padanan Indonesia yang langsung dan wajar untuk verba נוס, yang menyatakan lari karena kalah atau terancam.
- source_word: אִישׁ לְאֹהָלוֹ
  choice: masing-masing ke kemahnya
  rationale: “Masing-masing” mempertahankan fungsi distributif אִישׁ, sedangkan “kemahnya” menjaga citra harfiah ungkapan Ibrani; kemungkinan makna idiomatis dijelaskan dalam catatan.
theological_decisions:
- issue: Cakupan kolektif וְכָל יִשְׂרָאֵל
  choice: seluruh pasukan Israel
  alternative: seluruh Israel
  rationale: Konteks langsung adalah kekalahan bala tentara Absalom, sehingga “pasukan Israel” mengungkapkan referen kontekstual dan menghindari kesan bahwa setiap orang Israel melarikan diri. Namun bentuk Ibrani secara harfiah adalah “seluruh Israel.”
- issue: Ungkapan distributif maskulin אִישׁ לְאֹהָלוֹ
  choice: masing-masing ke kemahnya
  alternative: setiap orang ke kemahnya; masing-masing pulang ke rumahnya
  rationale: Dalam bahasa Indonesia, “masing-masing” menyampaikan distribusi individual secara alami tanpa perlu memasukkan penanda gender yang tidak diperlukan secara gramatikal.
- issue: Makna literal atau idiomatis לְאֹהָלוֹ
  choice: ke kemahnya
  alternative: pulang ke rumahnya
  rationale: Teks utama mempertahankan citra literal “kemah,” yang tetap dapat dipahami, sedangkan makna idiomatis sebagai tempat tinggal dicatat agar pembaca tidak menganggapnya harus selalu berupa kemah fisik.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Konjungsi dibuat alami dalam bahasa Indonesia. Bentuk pronomina “-nya” dipakai untuk menghindari pengulangan, dan catatan kaki mempertahankan tekstur idiom Ibrani.
