source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח דָּוִ֜ד אֶת הָ/עָ֗ם הַ/שְּׁלִשִׁ֤ית בְּ/יַד יוֹאָב֙ וְ֠/הַ/שְּׁלִשִׁית בְּ/יַ֨ד אֲבִישַׁ֤י בֶּן צְרוּיָה֙ אֲחִ֣י יוֹאָ֔ב וְ/הַ֨/שְּׁלִשִׁ֔ת בְּ/יַ֖ד אִתַּ֣י הַ/גִּתִּ֑י וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל הָ/עָ֔ם יָצֹ֥א אֵצֵ֛א גַּם אֲנִ֖י עִמָּ/כֶֽם־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/002.yaml
  text: 'David sent out the troops: one third under Joab[a], one third under Abishai son of Zeruiah, Joab’s brother, and one third under Ittai the Gittite. And the king said to the troops, “I myself will surely go out with you.”'
translation:
  language: id
  text: 'Daud mengerahkan pasukan itu: sepertiga di bawah komando Yoab[a], sepertiga di bawah komando Abisai anak Zeruya, saudara Yoab, dan sepertiga di bawah komando Itai, orang Gat. Raja berkata kepada pasukan itu, “Aku sendiri pasti akan turut maju bersama kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tangan Yoab”; ungkapan ini berarti “di bawah wewenang atau komando Yoab”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: mengerahkan
  rationale: Dalam konteks militer, verba ini menyatakan tindakan mengirim pasukan untuk bertempur; 'mengerahkan' alami dan tepat dalam bahasa Indonesia.
- source_word: הָעָם
  choice: pasukan itu
  rationale: Secara harfiah berarti 'rakyat/orang-orang', tetapi dalam konteks pertempuran ini menunjuk kepada kekuatan tempur Daud.
- source_word: הַשְּׁלִשִׁית / הַשְּׁלִשִׁת
  choice: sepertiga
  rationale: Bentuk yang diulang menunjuk pada masing-masing dari tiga bagian pasukan.
- source_word: בְּיַד
  choice: di bawah komando
  rationale: Ungkapan harfiah 'di tangan' merupakan idiom bagi penyerahan wewenang atau kepemimpinan; 'di bawah komando' menyampaikan maknanya secara jelas dalam konteks militer.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: Abisai anak Zeruya, saudara Yoab
  rationale: Mempertahankan kedua keterangan kekerabatan dalam susunan Indonesia yang wajar tanpa menetapkan apakah frasa terakhir menerangkan Abisai atau Zeruya secara gramatikal; berdasarkan konteks, Abisai adalah saudara Yoab.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, orang Gat
  rationale: Gentilik הַגִּתִּי mengidentifikasi Itai sebagai orang yang berasal dari Gat; bentuk ini lebih mudah dipahami daripada transliterasi 'orang Giti'.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Raja berkata
  rationale: Meneruskan alur narasi secara alami sambil mempertahankan sebutan 'raja' dari teks Ibrani.
- source_word: יָצֹא אֵצֵא
  choice: pasti akan ... maju
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan kuat; 'pasti' menyampaikan intensifikasi tersebut, sedangkan 'maju' sesuai dengan gerak keluar menuju pertempuran.
- source_word: גַּם אֲנִי
  choice: Aku sendiri ... turut
  rationale: Mempertahankan unsur penekanan pada keterlibatan pribadi raja sekaligus nuansa aditif גַּם.
- source_word: עִמָּכֶם
  choice: bersama kalian
  rationale: Menyatakan penyertaan raja dengan seluruh pasukan yang disapa; 'kalian' jelas sebagai bentuk jamak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah militer dibuat jelas bagi pembaca umum, nama-nama memakai bentuk Indonesia yang lazim, dan penegasan Ibrani dipertahankan tanpa menghasilkan ungkapan yang kaku.
