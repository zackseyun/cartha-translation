base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/008.yaml
  text: The battle spread there over the face of all the land[a], and the forest devoured more of the people that day than the sword devoured.
translation:
  language: id
  text: Di sana, pertempuran itu tersebar di seluruh wilayah[a], dan pada hari itu hutan menelan lebih banyak orang daripada yang ditelan pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pertempuran itu meluas di sana ke seluruh wilayah.” Partisipel Nifal Ibrani dapat menekankan bahwa pertempuran itu tersebar atau terpencar di berbagai tempat di kawasan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: נפצית
  choice: meluas
  rationale: Partisipel Nifal dari פוץ menggambarkan pertempuran yang tersebar atau terpencar di kawasan itu. “Meluas” alami dalam bahasa Indonesia dan menyampaikan penyebaran geografis tanpa memberi kesan bahwa pertempuran bertindak sebagai kumpulan orang.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: ke seluruh wilayah
  rationale: Ungkapan Ibrani ini menunjukkan keluasan geografis. “Seluruh wilayah” lebih wajar daripada terjemahan harfiah “di atas permukaan seluruh negeri” dan menunjukkan kawasan pertempuran setempat, bukan seluruh bumi.
- source_word: וַיֶּרֶב ... לֶאֱכֹל
  choice: menelan lebih banyak
  rationale: Konstruksi רבה dengan infinitif לֶאֱכֹל dan perbandingan מֵאֲשֶׁר menyatakan bahwa hutan menyebabkan lebih banyak korban. “Menelan lebih banyak” mempertahankan daya banding dan metafora teks.
- source_word: הַיַּעַר
  choice: hutan
  rationale: יַעַר menunjuk kawasan berhutan; “hutan” merupakan padanan baku, jelas, dan tetap hidup dalam konteks peperangan.
- source_word: בָּעָם
  choice: orang
  rationale: Dalam konstruksi komparatif ini, “lebih banyak orang” secara alami menyampaikan makna partitif, yakni jumlah korban dari antara pasukan atau rakyat.
- source_word: מֵאֲשֶׁר אָכְלָה הַחֶרֶב
  choice: daripada pedang
  rationale: Perbandingan eksplisit dipertahankan. Dalam bahasa Indonesia, elipsis verba sesudah “pedang” alami, sedangkan personifikasi dan metafora menelan tetap terbawa dari klausa sebelumnya.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan naratif langsung dan alami untuk keterangan waktu Ibrani.
