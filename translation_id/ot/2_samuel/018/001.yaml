  text: Then David mustered the people who were with him and appointed over them commanders of thousands and commanders of hundreds[a][b].
translation:
  language: id
  text: Lalu Daud memeriksa pasukan[a] yang bersamanya dan menetapkan atas mereka para pemimpin seribu dan para pemimpin seratus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rakyat.” Dalam konteks ini, yang dimaksud ialah pasukan Daud. Kata kerja Ibrani yang diterjemahkan “memeriksa” dapat berarti menghitung atau meninjau pasukan, yakni mengadakan pemeriksaan pasukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “para pemimpin satuan seribu dan para pemimpin satuan seratus.” Istilah “seribu” dapat juga menunjuk pada suatu kelompok atau satuan, bukan selalu jumlah yang tepat.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: memeriksa pasukan
  rationale: Dalam konteks militer, פקד menunjuk pada tindakan mengadakan pemeriksaan, pendataan, atau pengerahan pasukan, bukan sekadar menghitung. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan tindakan pengorganisasian yang menyusul.
- source_word: הָעָם
  choice: pasukan
  rationale: Secara harfiah berarti 'rakyat/orang-orang', tetapi dalam konteks ini jelas merujuk pada kekuatan tempur Daud. 'Pasukan' menyampaikan rujukan kontekstual secara wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang bersamanya
  rationale: Mempertahankan ungkapan relasional Ibrani tanpa mempersempitnya menjadi hubungan komando formal.
- source_word: וַיָּשֶׂם עֲלֵיהֶם
  choice: mengangkat atas mereka
  rationale: שׂים dengan עַל menyatakan penempatan atau pengangkatan seseorang untuk memimpin pihak lain. 'Mengangkat atas mereka' mempertahankan gambaran hierarkis sumber dengan bahasa yang tetap dapat dipahami.
- source_word: שָׂרֵי
  choice: para pemimpin pasukan
  rationale: שׂר berarti pemimpin atau pejabat; konteks militernya dibuat jelas dengan 'pasukan', tanpa memakai istilah pangkat modern yang terlalu spesifik.
- source_word: אֲלָפִים
  choice: seribu
  rationale: Dalam pasangan administratif militer dengan 'seratus', makna bilangan merupakan pembacaan paling langsung, meskipun אֶלֶף juga dapat merujuk pada satuan atau kelompok.
- source_word: מֵאוֹת
  choice: seratus
  rationale: Mempertahankan pasangan bilangan dan struktur organisasi militer dalam teks Ibrani.
