  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שֹּׁפָ֔ר וַ/יָּ֣שָׁב הָ/עָ֔ם מִ/רְדֹ֖ף אַחֲרֵ֣י יִשְׂרָאֵ֑ל כִּֽי חָשַׂ֥ךְ יוֹאָ֖ב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/016.yaml
  text: Then Joab blew the trumpet[a], and the people turned back from pursuing Israel[c][b], because Joab restrained the people.
translation:
  language: id
  text: Lalu Yoab meniup sangkakala[a], dan pasukan itu berhenti mengejar Israel[b], sebab Yoab menahan pasukan itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanduk”. Kata Ibrani syofar menunjuk pada tanduk yang ditiup untuk memberi isyarat, sering kali tanduk domba jantan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah pasukan Israel yang berpihak kepada Absalom.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani yang diterjemahkan “menahan” juga dapat berarti “tidak membiarkan” atau “menyayangkan”. Dalam konteks ini, Yoab menghentikan pasukannya agar tidak melanjutkan pengejaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: meniup
  rationale: Dengan שׁוֹפָר sebagai alatnya, verba תקע secara idiomatis berarti meniup atau membunyikan alat tiup untuk memberi isyarat.
- source_word: בַּשֹּׁפָר
  choice: sangkakala
  rationale: שׁוֹפָר adalah tanduk yang ditiup sebagai alat pemberi isyarat. Dalam narasi militer, “sangkakala” merupakan padanan Indonesia yang alami dan bermartabat; bentuk konkretnya dijelaskan dalam catatan kaki.
- source_word: וַיָּשָׁב הָעָם מִרְדֹף
  choice: pasukan itu berhenti mengejar
  rationale: שׁוּב dengan מִן dan bentuk infinitif menyatakan berhentinya suatu tindakan atau berbalik darinya. Dalam konteks pertempuran, הָעָם menunjuk kepada pasukan Yoab, sehingga “pasukan” lebih jelas daripada “rakyat” atau “orang-orang”.
- source_word: אַחֲרֵי יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani menyebut Israel secara langsung sebagai pihak yang dikejar. Konteks bahwa yang dimaksud ialah pasukan Israel yang berpihak kepada Absalom dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan dihentikannya pengejaran. “Sebab” jelas dan sesuai dengan ragam naratif yang bermartabat.
- source_word: חָשַׂךְ
  choice: menahan
  rationale: חשׂך dapat berarti menahan, tidak membiarkan, atau menyayangkan/menyelamatkan. Dalam konteks ini, Yoab menghentikan pasukannya agar tidak melanjutkan pengejaran; “menahan” menyampaikan tindakan itu tanpa menetapkan motifnya.
- source_word: אֶת הָעָם
  choice: pasukan itu
  rationale: Pengulangan הָעָם dipertahankan secara leksikal sebagai “pasukan itu”, yakni pasukan Yoab dalam konteks pertempuran.
theological_decisions: []
