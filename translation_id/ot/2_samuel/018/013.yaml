  text: אֽוֹ עָשִׂ֤יתִי ב/נפש/ו שֶׁ֔קֶר וְ/כָל דָּבָ֖ר לֹא יִכָּחֵ֣ד מִן הַ/מֶּ֑לֶךְ וְ/אַתָּ֖ה תִּתְיַצֵּ֥ב מִ/נֶּֽגֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/013.yaml
  text: Or if I had dealt falsely against his life, and no matter is hidden from the king, then you yourself would have stood aside.
translation:
  language: id
  text: Atau, seandainya aku bertindak curang terhadap nyawanya—dan tidak ada satu perkara pun yang tersembunyi dari raja—engkau sendiri tentu akan berdiri menjauh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tidak mau membelaku.'
    reason: Frasa Ibrani secara harfiah menggambarkan berdiri dari kejauhan atau di sisi berlawanan; dalam konteks ini dapat menyiratkan tidak memberi dukungan atau pembelaan.
lexical_decisions:
- source_word: עָשִׂיתִי בְנַפְשׁוֹ שֶׁקֶר
  choice: aku bertindak curang terhadap nyawanya
  rationale: Mempertahankan ungkapan sumber tentang tindakan khianat atau curang yang membahayakan nyawa Absalom, tanpa mempersempitnya hanya menjadi tindakan membunuh.
- source_word: וְכָל־דָּבָר לֹא־יִכָּחֵד מִן־הַמֶּלֶךְ
  choice: dan tidak ada satu perkara pun yang tersembunyi dari raja
  rationale: Menyampaikan pernyataan umum bahwa perkara apa pun tidak dapat luput dari pengetahuan raja.
- source_word: תִּתְיַצֵּב מִנֶּגֶד
  choice: akan berdiri menjauh
  rationale: Mengungkapkan posisi berjarak dan tidak memberi dukungan, sambil mempertahankan citra berdiri dalam teks Ibrani.
theological_decisions:
- issue: Apakah tindakan terhadap Absalom harus diterjemahkan secara eksplisit sebagai membunuh
  choice: bertindak curang terhadap nyawanya
  alternative: membunuhnya dengan curang
  rationale: Teks sumber menyebut tindakan curang terhadap nyawanya, sehingga terjemahan tidak mempersempit ambiguitas menjadi pembunuhan secara eksplisit.
- issue: Makna sikap Yoab dalam frasa penutup
  choice: berdiri menjauh
  alternative: tidak mau membelaku
  rationale: Pilihan utama mempertahankan metafora spasial sumber; implikasi bahwa Yoab tidak akan membela prajurit dijelaskan dalam catatan kaki, bukan dimasukkan langsung ke teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur syarat dibuat jelas dengan “seandainya” dan “tentu”, sedangkan tanda pisah mempertahankan sifat parentetis pernyataan tentang pengetahuan raja.
