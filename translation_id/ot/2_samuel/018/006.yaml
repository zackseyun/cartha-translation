  text: וַ/יֵּצֵ֥א הָ/עָ֛ם הַ/שָּׂדֶ֖ה לִ/קְרַ֣את יִשְׂרָאֵ֑ל וַ/תְּהִ֥י הַ/מִּלְחָמָ֖ה בְּ/יַ֥עַר אֶפְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/006.yaml
  text: So the troops went out into the field to meet Israel[a], and the battle took place in the forest of Ephraim.
translation:
  language: id
  text: Maka pasukan itu keluar ke medan untuk menghadapi Israel,[a] dan pertempuran berlangsung di hutan Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rakyat”; dalam konteks ini istilah tersebut menunjuk kepada pasukan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: pasukan itu
  rationale: Secara harfiah berarti 'rakyat/orang-orang', tetapi dalam konteks militer ini menunjuk kepada pasukan Daud. 'Pasukan itu' menyampaikan rujukan kontekstual secara alami.
- source_word: הַשָּׂדֶה
  choice: ke medan
  rationale: Kata ini berarti 'ladang/daerah terbuka'. Bersama verba 'keluar' dan dalam konteks pertempuran, 'ke medan' alami dalam bahasa Indonesia tanpa harus menambahkan 'medan perang' yang tidak dinyatakan secara eksplisit.
- source_word: לִקְרַאת
  choice: untuk menghadapi
  rationale: Bentuk ini berarti 'menemui/menyongsong'. Dalam konteks pertempuran, 'menghadapi' menyampaikan pertemuan yang bersifat bermusuhan tanpa memperluas makna menjadi serangan tertentu.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama bangsa dipertahankan sebagaimana bunyi teks. Dalam konteks, ini menunjuk kepada kekuatan yang berpihak kepada Absalom, tetapi ayat tersebut sendiri menyebut 'Israel'.
- source_word: הַמִּלְחָמָה
  choice: pertempuran
  rationale: Walaupun dapat berarti 'perang', di sini kata tersebut menunjuk kepada pertempuran tertentu yang sedang dikisahkan.
- source_word: וַתְּהִי
  choice: berlangsung
  rationale: Secara harfiah 'terjadi/ada'. Dengan subjek 'pertempuran', 'berlangsung' merupakan ungkapan Indonesia yang wajar dan tetap dekat dengan makna peristiwa.
- source_word: בְּיַעַר אֶפְרָיִם
  choice: di hutan Efraim
  rationale: Menerjemahkan konstruksi tempat secara langsung dan alami, tanpa mencoba menyelesaikan persoalan geografis yang tidak dijelaskan oleh teks.
