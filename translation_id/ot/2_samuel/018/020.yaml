  source_fidelity: 'Terjemahan secara setia menyampaikan struktur dan makna teks Ibrani: penolakan Yoab pada hari itu, kemungkinan menyampaikan kabar pada hari lain, larangan saat ini, serta alasan berupa kematian putra raja. Pengulangan “hari ini” dan “menyampaikan kabar” dipertahankan dengan baik.'
