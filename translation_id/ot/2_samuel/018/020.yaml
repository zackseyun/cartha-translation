  text: וַ/יֹּ֧אמֶר ל֣/וֹ יוֹאָ֗ב לֹא֩ אִ֨ישׁ בְּשֹׂרָ֤ה אַתָּה֙ הַ/יּ֣וֹם הַ/זֶּ֔ה וּ/בִשַּׂרְתָּ֖ בְּ/י֣וֹם אַחֵ֑ר וְ/הַ/יּ֤וֹם הַ/זֶּה֙ לֹ֣א תְבַשֵּׂ֔ר כִּֽי על בֶּן הַ/מֶּ֖לֶךְ מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/018/020.yaml
  text: Joab said to him[a], “You are not a bearer of news today. You may carry news on another day, but today you must not carry news, because the king’s son is dead.”
translation:
  language: id
  text: Yoab berkata kepadanya[a], “Hari ini engkau bukan pembawa kabar. Pada hari lain engkau boleh menyampaikan kabar, tetapi hari ini jangan menyampaikan kabar, karena putra raja telah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pembawa kabar baik.” Istilah Ibraninya dapat berarti kabar atau berita, yang sering kali bersifat baik, tetapi dalam konteks ini yang diberitakan adalah kematian putra raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּשֹׂרָה
  choice: pembawa kabar
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘orang kabar’; ‘pembawa kabar’ menyampaikan fungsinya secara alami dalam bahasa Indonesia tanpa memastikan bahwa kabar itu baik.
- source_word: וּבִשַּׂרְתָּ
  choice: engkau boleh menyampaikan kabar
  rationale: Dalam konteks penolakan Yoab untuk hari itu, bentuk ini paling wajar dipahami sebagai izin atau kesempatan pada hari lain.
- source_word: לֹא תְבַשֵּׂר
  choice: jangan menyampaikan kabar
  rationale: Bentuk imperfek dengan negasi di dalam ujaran langsung berfungsi sebagai larangan; bentuk ‘jangan’ alami dan tegas dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi larangan Yoab.
- source_word: בֶּן הַמֶּלֶךְ
  choice: putra raja
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara ringkas dan alami serta mempertahankan hubungan dengan raja.
- source_word: מֵת
  choice: telah mati
  rationale: Menyatakan keadaan yang dihasilkan oleh kematian sekaligus sesuai dengan peristiwa yang baru terjadi dalam konteks.
- source_word: הַיּוֹם הַזֶּה
  choice: hari ini
  rationale: Padanan modern dan alami bagi ungkapan waktu yang diulang dalam ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti ‘engkau’ dipakai dalam percakapan langsung untuk mempertahankan register Alkitab yang wajar; pengulangan ‘hari ini’ dan ‘menyampaikan kabar’ dipertahankan karena menonjol dalam teks Ibrani.
