  yaml_path: translation/ot/2_samuel/019/003.yaml
  text: So the victory on that day was turned into mourning for all the people[a], because on that day the people heard it said[b], “The king is grieved over his son.”
translation:
  language: id
  text: Maka kemenangan pada hari itu berubah menjadi perkabungan bagi seluruh rakyat[a], sebab pada hari itu rakyat mendengar kabar[b], “Raja berduka atas anaknya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pembebasan pada hari itu menjadi perkabungan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rakyat mendengar orang berkata,” suatu ungkapan untuk mendengar sebuah laporan atau kabar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּשֻׁעָה
  choice: kemenangan
  rationale: Dalam konteks pertempuran, kata ini menunjuk pada keberhasilan atau pembebasan yang diperoleh dalam perang. “Kemenangan” paling alami dalam bahasa Indonesia dan tidak memberi nuansa teologis yang tidak perlu.
- source_word: וַתְּהִי ... לְאֵבֶל
  choice: berubah menjadi perkabungan
  rationale: Ungkapan ini menyampaikan pembalikan hasil kemenangan menjadi suasana berkabung. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan daya kontras teks Ibrani.
- source_word: אֵבֶל
  choice: perkabungan
  rationale: Kata ini menunjuk pada dukacita yang dinyatakan secara sosial atau komunal; “perkabungan” sesuai dengan suasana yang meliputi seluruh rakyat.
- source_word: הָעָם
  choice: rakyat
  rationale: Teks memakai istilah umum untuk orang-orang, meskipun dalam konteks ini mereka mencakup pasukan pendukung Daud. “Rakyat” mempertahankan keluasan istilah sumber.
- source_word: כִּי שָׁמַע ... לֵאמֹר
  choice: sebab ... rakyat mendengar kabar
  rationale: Konstruksi harfiahnya, “mendengar, demikian katanya,” merupakan idiom pengantar laporan. “Mendengar kabar” menyampaikan fungsi reportatifnya secara wajar.
- source_word: נֶעֱצַב
  choice: berduka
  rationale: Bentuk Niphal menyatakan keadaan tersakiti atau berdukacita. “Berduka” ringkas, bermartabat, dan sesuai dengan kesedihan raja.
- source_word: עַל בְּנוֹ
  choice: karena anaknya
  rationale: Preposisi עַל menandai anak itu sebagai sebab atau pokok dukacita. “Karena anaknya” alami dalam bahasa Indonesia dan tidak menentukan lebih jauh sifat dukanya.
