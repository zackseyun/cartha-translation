  text: יָֽשָׁב נָ֤א עַבְדְּ/ךָ֙ וְ/אָמֻ֣ת בְּ/עִירִ֔/י עִ֛ם קֶ֥בֶר אָבִ֖/י וְ/אִמִּ֑/י וְ/הִנֵּ֣ה עַבְדְּ/ךָ֣ כִמְהָ֗ם יַֽעֲבֹר֙ עִם אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/עֲשֵׂה ל֕/וֹ אֵ֥ת אֲשֶׁר ט֖וֹב בְּ/עֵינֶֽי/ךָ־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/038.yaml
  text: Please let your servant return[a], that I may die in my own city, by the grave of my father and my mother. But here is your servant Kimham; let him cross over with my lord the king[b], and do for him what is good in your eyes.
translation:
  language: id
  text: “Izinkanlah hambamu ini kembali, supaya aku dapat meninggal di kotaku sendiri, dekat makam ayah dan ibuku.[a] Tetapi, inilah Kimham, hambamu. Biarlah ia menyeberang bersama tuanku raja, dan lakukanlah baginya apa yang baik dalam pandanganmu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama makam ayah dan ibuku”; maksudnya kemungkinan besar ialah meninggal dan dimakamkan dekat tempat pemakaman keluarganya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “apa yang berkenan kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשָׁב נָא
  choice: Izinkanlah ... kembali
  rationale: Kata kerja שׁוּב menyatakan kembali, sedangkan נָא memberi nuansa permohonan sopan. Bentuk ini alami dalam bahasa Indonesia dan sesuai dengan tuturan hormat kepada raja.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Dalam konteks istana, istilah ini merupakan penyebutan diri yang merendah di hadapan raja; 'hambamu' mempertahankan ragam hormat tanpa menonjolkan status perbudakan.
- source_word: וְאָמֻת
  choice: supaya aku dapat meninggal
  rationale: Rangkaian waw dan bentuk imperfek dipahami sebagai maksud yang mengikuti permohonan untuk kembali, yaitu agar ia dapat meninggal di kota asalnya.
- source_word: בְּעִירִי
  choice: di kotaku sendiri
  rationale: Akhiran orang pertama menyatakan kepunyaan. Kata 'sendiri' secara alami menegaskan keterikatan pribadi tanpa menambah gagasan asing.
- source_word: עִם קֶבֶר אָבִי וְאִמִּי
  choice: dekat makam ayah dan ibuku
  rationale: עִם secara harfiah berarti 'bersama', tetapi dalam konteks kematian dan pemakaman frasa ini menunjuk pada tempat di dekat makam orang tuanya. 'Dekat makam' menyampaikan maksud tersebut secara wajar sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: וְהִנֵּה
  choice: Tetapi, inilah
  rationale: הִנֵּה memperkenalkan seseorang yang kini ditawarkan sebagai pengganti, sementara 'tetapi' menyatakan kontras dengan permohonan pembicara untuk kembali.
- source_word: כִמְהָם
  choice: Kimham
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: יַעֲבֹר עִם
  choice: Biarlah ia menyeberang bersama
  rationale: Bentuk imperfek memiliki daya jusif dalam konteks permohonan. 'Menyeberang' juga mempertahankan motif penyeberangan Sungai Yordan dalam narasi.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Ungkapan ini mempertahankan sapaan istana yang hormat dan tetap alami dalam bahasa Indonesia.
- source_word: וַעֲשֵׂה לוֹ
  choice: dan lakukanlah baginya
  rationale: עשה dengan ל dapat berarti melakukan sesuatu bagi seseorang. Pilihan ini mempertahankan bentuk sumber dan tidak menyiratkan tindakan buruk terhadapnya.
- source_word: אֵת אֲשֶׁר טוֹב בְּעֵינֶיךָ
  choice: apa yang baik dalam pandanganmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang sesuatu yang baik di mata seseorang, sekaligus tetap mudah dipahami.
