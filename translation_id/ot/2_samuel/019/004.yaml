  text: So the people slipped into the city that day, as people who are ashamed slip away when they flee in battle.
translation:
  language: id
  text: Pada hari itu rakyat menyelinap masuk ke kota, seperti orang-orang yang merasa malu menyelinap pergi ketika mereka melarikan diri dalam pertempuran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְגַּנֵּב / יִתְגַּנֵּב
  choice: menyelinap masuk / menyelinap pergi
  rationale: Bentuk Hitpael dari גנב menggambarkan tindakan bergerak diam-diam agar tidak diperhatikan. Pengulangan akar yang sama dipertahankan secara alami, sementara arah gerak diperjelas oleh konteks.
- source_word: הָעָם
  choice: rakyat / pasukan
  rationale: Pada klausa pertama, 'rakyat' menunjuk kelompok pendukung Daud secara umum; dalam perbandingan yang berlatar pertempuran, 'pasukan' lebih alami dan menjelaskan orang-orang yang melarikan diri tanpa mengubah acuannya secara substantif.
- source_word: הַנִּכְלָמִים
  choice: yang dipermalukan
  rationale: Partisip Niphal menyatakan keadaan menanggung malu atau kehinaan; 'dipermalukan' mempertahankan nuansa pasif tanpa menentukan penyebabnya.
- source_word: בְּנוּסָם בַּמִּלְחָמָה
  choice: setelah melarikan diri dari pertempuran
  rationale: Infinitif dengan sufiks menyatakan keadaan atau peristiwa ketika mereka lari dalam peperangan. 'Setelah' menghasilkan urutan yang wajar dalam bahasa Indonesia dan konteks kekalahan, sedangkan 'dari pertempuran' menyampaikan gerak menjauh yang tersirat.
