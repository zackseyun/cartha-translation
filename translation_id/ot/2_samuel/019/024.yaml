  text: And the king said to Shimei[a], “You shall not die.” And the king swore to him.
translation:
  language: id
  text: Lalu raja berkata kepada Simei[a], “Engkau tidak akan mati.” Raja pun bersumpah kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih interpretatif, “Engkau tidak akan dihukum mati.” Secara harfiah teks Ibrani berbunyi, “Engkau tidak akan mati,” yang dalam konteks ini dapat berfungsi sebagai janji raja bahwa Simei tidak akan dihukum mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian tindakan naratif; “Lalu” alami dalam bahasa Indonesia modern.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit yang menunjuk kepada raja yang sudah diketahui dari konteks; bahasa Indonesia tidak memakai kata sandang tertentu.
- source_word: אֶל שִׁמְעִי
  choice: kepada Simei
  rationale: Preposisi אֶל menandai pihak yang diajak bicara, sedangkan nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: לֹא תָמוּת
  choice: Engkau tidak akan mati
  rationale: Imperfek negatif ini menyampaikan jaminan atau keputusan kerajaan. Terjemahan ini mempertahankan ungkapan harfiah dan tidak secara diam-diam mempersempitnya menjadi hukuman mati.
- source_word: וַיִּשָּׁבַע
  choice: pun bersumpah
  rationale: Bentuk Nifal dari שבע berarti bersumpah; partikel “pun” menghubungkan tindakan lanjutan secara wajar.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kembali kepada Simei dan mempertahankan hubungan tidak langsung dalam konstruksi Ibrani.
theological_decisions:
- issue: Cakupan janji kerajaan dalam לֹא תָמוּת
  choice: Engkau tidak akan mati
  alternative: Engkau tidak akan dihukum mati
  rationale: Teks Ibrani secara harfiah menyatakan bahwa Simei tidak akan mati. Dalam konteks, ucapan itu dapat berfungsi sebagai pengampunan dari eksekusi, tetapi teks utama mempertahankan keluasan dan ketegangan ungkapan aslinya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Engkau” dipakai dalam kutipan langsung untuk mempertahankan nada pernyataan kerajaan tanpa terdengar kuno berlebihan.
