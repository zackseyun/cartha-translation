base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/027.yaml
  text: And he has slandered your servant to my lord the king[a], for your servant said, ‘I will saddle the donkey for myself so that I may ride on it and go with the king,’ because your servant is lame.
translation:
  language: id
  text: Ia telah memfitnah hambamu kepada tuanku raja[a], sebab hambamu berkata, ‘Aku akan memasang pelana pada keledai itu untuk diriku, supaya aku dapat menungganginya dan pergi bersama raja,’ karena hambamu pincang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menipuku” atau “telah mengkhianatiku.” Kata kerja Ibrani ini dapat berarti menyesatkan atau bertindak curang. “Memfitnah” dipakai di sini karena konteksnya adalah laporan palsu tentang Mefiboset kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמָּנִי
  choice: telah memfitnah hambamu ini
  rationale: Bentuk piel dengan akhiran orang pertama tunggal secara harfiah mengenai tindakan terhadap ‘aku’. Dalam konteks, Mefiboset menuduh hambanya memberikan laporan palsu tentang dirinya kepada raja; ‘memfitnah’ menyampaikan pencemaran melalui laporan palsu, sementara catatan kaki mempertahankan cakupan makna ‘menipu’ atau ‘mengkhianati’.
- source_word: עַבְדִּי
  choice: hambaku
  rationale: Istilah ini menunjuk pelayan pribadi Mefiboset. ‘Hamba’ mempertahankan hubungan hierarkis dalam lingkungan istana tanpa menentukan status hukumnya secara berlebihan.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Ungkapan sapaan istana yang hormat; bentuk ini alami dan tetap menjaga nada resmi sumber.
- source_word: אֶחְבְּשָׁה לִּי הַחֲמוֹר
  choice: Aku akan memasangkan pelana pada keledai itu
  rationale: Bentuk orang pertama menyatakan niat atau tekad. ‘Memasangkan pelana’ menyampaikan makna חבש dalam konteks menyiapkan keledai untuk ditunggangi; unsur לִי tercermin dalam tujuan pribadi yang diterangkan oleh klausa berikutnya.
- source_word: וְאֶרְכַּב עָלֶיהָ
  choice: supaya aku dapat menungganginya
  rationale: Rangkaian bentuk volitif menunjukkan maksud; ‘supaya’ membuat hubungan tujuan jelas dalam bahasa Indonesia yang alami.
- source_word: וְאֵלֵךְ אֶת־הַמֶּלֶךְ
  choice: dan pergi bersama raja
  rationale: הלך dengan אֶת di sini menyatakan penyertaan, bukan arah menuju seseorang.
- source_word: פִסֵּחַ
  choice: timpang
  rationale: Kata ini secara konkret menyatakan keterbatasan berjalan. ‘Timpang’ ringkas, akurat, dan tidak menambahkan diagnosis yang tidak terdapat dalam teks.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Ini adalah sebutan diri yang merendah ketika berbicara kepada raja. ‘Ini’ menjadikannya alami dalam bahasa Indonesia tanpa mengubah fungsi kesopanannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-istana yang bermartabat. Sapaan ‘tuanku raja’ dan sebutan diri ‘hambamu ini’ mempertahankan kesantunan hierarkis tanpa terdengar terlalu arkais. Penanda catatan kaki [a] dicantumkan tepat pada klausa yang memiliki ketaksaan leksikal.
