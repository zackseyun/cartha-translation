revisions:
- from: Ia telah memfitnah hambamu ini di hadapan tuanku raja[a]. Padahal hambamu ini telah berkata, ‘Aku akan memasangkan pelana pada keledai itu supaya aku dapat menungganginya dan pergi bersama raja,’ sebab hambamu ini timpang.
  to: Ia telah memfitnah hambamu kepada tuanku raja[a], sebab hambamu berkata, ‘Aku akan memasang pelana pada keledai itu untuk diriku, supaya aku dapat menungganginya dan pergi bersama raja,’ karena hambamu pincang.
  rationale: Revisi mempertahankan ketaksaan רִמָּנִי melalui catatan kaki, memperbaiki relasi sintaksis kepada raja, menerjemahkan כִּי sebagai penjelasan, dan memakai ungkapan Indonesia modern yang lebih alami bagi keadaan pincang.
