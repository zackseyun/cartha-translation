  text: Barzillai said to the king[a], “How many are the days of the years of my life, that I should go up with the king to Jerusalem?”
translation:
  language: id
  text: Barzilai berkata kepada raja, “Berapa lamakah umurku sehingga aku harus naik bersama raja ke Yerusalem?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר paling wajar diterjemahkan dengan kata kerja ujaran umum “berkata” dalam bahasa Indonesia.
- source_word: בַּרְזִלַּי
  choice: Barzilai
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Teks Ibrani memakai kata benda umum dengan artikel, bukan nama Daud; “kepada raja” mempertahankan bentuk sumber.
- source_word: כַּמָּה
  choice: Berapa banyakkah
  rationale: Kata tanya ini bersifat kuantitatif. Bentuk tersebut juga mempertahankan daya retoris pertanyaan Barzilai.
- source_word: יְמֵי שְׁנֵי חַיַּי
  choice: hari dalam tahun-tahun hidupku
  rationale: Ungkapan berlapis dalam bahasa Ibrani dipertahankan sejauh masih dapat dipahami secara alami, tanpa meratakannya menjadi sekadar “umurku” atau menambahkan gagasan “yang tersisa”.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan retoris ini, כִּי menghubungkan usia Barzilai dengan konsekuensi atau kelayakan untuk ikut ke Yerusalem; “sehingga” menyampaikan hubungan itu secara wajar.
- source_word: אֶעֱלֶה
  choice: aku harus pergi
  rationale: Kata עלה secara harfiah menyatakan naik, khususnya menuju Yerusalem, tetapi dalam bahasa Indonesia “pergi ke Yerusalem” lebih alami. “Harus” menyampaikan nuansa modal pertanyaan retoris, bukan kewajiban teologis.
- source_word: אֶת הַמֶּלֶךְ
  choice: bersama raja
  rationale: Dalam konteks ini אֶת berfungsi menyatakan kebersamaan atau penyertaan, bukan penanda objek langsung.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk nama tempat yang baku dalam bahasa Indonesia.
