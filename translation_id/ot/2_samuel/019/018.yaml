base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/018.yaml
  text: and a thousand men from Benjamin with him[a], and Ziba, the servant of Saul’s house, with his fifteen sons and his twenty servants; they crossed the Jordan before the king.
translation:
  language: id
  text: Seribu orang dari suku Benyamin menyertainya. Ziba, pelayan keluarga Saul, juga datang bersama lima belas anak laki-lakinya dan dua puluh pelayannya. Mereka menyeberangi Sungai Yordan di depan raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan raja.” Frasa Ibrani ini dapat berarti bahwa mereka berada di hadapan raja atau menyeberang lebih dahulu daripada dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף אִישׁ עִמּוֹ מִבִּנְיָמִן
  choice: Seribu orang dari suku Benyamin menyertainya
  rationale: Ungkapan ini menunjuk kepada seribu laki-laki yang berafiliasi dengan suku Benyamin. Dalam bahasa Indonesia, “orang” wajar setelah bilangan besar, sedangkan “dari suku Benyamin” memperjelas bahwa nama itu menunjuk pada suku. “Menyertainya” mempertahankan hubungan עִמּוֹ dengan tokoh yang disebut dalam konteks sebelumnya.
- source_word: צִיבָא
  choice: Ziba
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: נַעַר בֵּית שָׁאוּל
  choice: pelayan keluarga Saul
  rationale: נַעַר dapat berarti orang muda, pembantu, atau pelayan. Peran Ziba dalam konteks kitab ini mendukung “pelayan”; בֵּית שָׁאוּל merujuk pada rumah tangga atau keluarga dinasti Saul.
- source_word: וַחֲמֵשֶׁת עָשָׂר בָּנָיו
  choice: bersama kelima belas anak laki-lakinya
  rationale: בָּנִים secara khusus berarti anak-anak lelaki. “Bersama” menyatakan dengan alami bahwa mereka termasuk rombongan Ziba.
- source_word: וְעֶשְׂרִים עֲבָדָיו
  choice: dan kedua puluh pelayannya
  rationale: עֶבֶד dapat berarti hamba atau pelayan. Konteks hanya mengidentifikasi personel rumah tangga Ziba dan tidak menekankan status hukum mereka, sehingga “pelayan” dipilih.
- source_word: וְצָלְחוּ הַיַּרְדֵּן
  choice: Mereka menyeberangi Sungai Yordan
  rationale: Dalam konstruksi dengan Yordan, צלח menyatakan gerakan menyeberang. Penambahan “Sungai” membuat nama geografis itu jelas dan alami bagi pembaca Indonesia tanpa mengubah rujukannya.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di depan raja
  rationale: לִפְנֵי dapat menyatakan posisi di hadapan seseorang maupun gerakan lebih dahulu daripadanya. “Di depan raja” mempertahankan sebagian ketaksaan spasial itu, dengan catatan kaki yang menyajikan kemungkinan lainnya.
