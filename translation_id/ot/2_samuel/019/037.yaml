  yaml_path: translation/ot/2_samuel/019/037.yaml
  text: For your servant would only cross the Jordan a little way with the king[a]; why should the king repay me with this reward?
translation:
  language: id
  text: Hamba hanya akan menemani Raja menyeberangi Sungai Yordan sebentar saja. Mengapa Raja harus membalas hamba dengan balasan ini?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membalas hamba dengan balasan ini.” Bahasa Ibrani memakai kata kerja dan kata benda dari akar yang sama (גמל), yang menegaskan gagasan pembalasan atau imbalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/מְעַט
  choice: hanya ... sampai tidak jauh
  rationale: כִּי memperkenalkan alasan penolakan Barzilai, sedangkan מְעַט membatasi sejauh mana ia akan menyertai raja. Ungkapan ini menyampaikan jarak yang pendek secara wajar dalam bahasa Indonesia.
- source_word: יַעֲבֹר ... אֶת הַ/יַּרְדֵּן אֶת הַ/מֶּלֶךְ
  choice: akan menemani Raja menyeberangi Sungai Yordan
  rationale: Bentuk imperfek menyatakan tindakan yang hendak dilakukan. אֶת sebelum הַמֶּלֶךְ berarti ‘bersama’, sehingga keseluruhan frasa menyatakan bahwa Barzilai akan turut menyeberang untuk menemani raja.
- source_word: עַבְדְּ/ךָ
  choice: hamba
  rationale: Dalam sapaan kepada raja, kata ini merupakan sebutan merendahkan diri yang lazim; ‘hamba’ mempertahankan ragam kerajaan tanpa menonjolkan arti perbudakan.
- source_word: וְ/לָמָּה
  choice: Mengapa ... harus
  rationale: Pertanyaan retoris ini menyampaikan penolakan yang sopan terhadap pemberian raja.
- source_word: יִגְמְלֵ/נִי הַ/גְּמוּלָה הַ/זֹּאת
  choice: membalas hamba dengan balasan sebesar ini
  rationale: Terjemahan ini mempertahankan pengulangan akar גמל pada verba dan nomina. ‘Sebesar ini’ menyampaikan bahwa Barzilai memandang kemurahan yang ditawarkan raja tidak sebanding dengan pendampingannya yang singkat.
