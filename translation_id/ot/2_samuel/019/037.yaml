  register: Bahasa Indonesia baku dan bermartabat dengan bentuk sapaan kerajaan ‘hamba’ dan ‘Raja’. Susunan kalimat dibuat alami bagi pembaca modern, sambil mempertahankan pertanyaan retoris dan permainan akar kata dalam bahasa Ibrani.
