  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. 'Sungai Yordan' dipakai agar nama geografis langsung jelas bagi pembaca umum; ambiguitas sintaksis tentang penyeberangan dan pengantaran dipertahankan melalui catatan kaki.
