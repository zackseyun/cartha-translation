base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/032.yaml
  text: And Barzillai the Gileadite had come down from Rogelim[a], and he crossed the Jordan with the king to send him off at the Jordan.
translation:
  language: id
  text: Barzilai, orang Gilead itu, telah turun dari Rogelim[a] dan menyeberangi Sungai Yordan bersama raja untuk melepasnya di Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “turun dari Rogelim dan menyeberang bersama raja melintasi Sungai Yordan untuk mengantarnya.” Susunan bahasa Ibrani memungkinkan beberapa cara untuk mengungkapkan bagaimana Barzilai menyertai raja dan melepasnya di sungai itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַרְזִלַּי
  choice: Barzilai
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַגִּלְעָדִי
  choice: orang Gilead itu
  rationale: Adjektiva nisbah ini menyatakan asal atau keterkaitan daerah; ungkapan ini alami dalam bahasa Indonesia dan tetap ringkas.
- source_word: יָרַד
  choice: telah turun
  rationale: Bentuk qatal mendahului rangkaian tindakan wayyiqtol berikutnya dan dapat menunjukkan bahwa perjalanan turun dari Rogelim sudah terjadi sebelum tindakan menyeberang.
- source_word: מֵרֹגְלִים
  choice: dari Rogelim
  rationale: Nama tempat ditransliterasikan dan preposisi מִן diterjemahkan secara langsung.
- source_word: וַיַּעֲבֹר אֶת הַמֶּלֶךְ הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan bersama raja
  rationale: עבר menyatakan tindakan menyeberang. Walaupun אֶת biasanya menandai objek langsung, konteks gerak dan objek 'raja' menunjukkan bahwa Barzilai menyertai raja ketika menyeberangi sungai.
- source_word: לְשַׁלְּחוֹ
  choice: untuk mengantarnya berangkat
  rationale: Infinitif ini menyatakan tujuan, yaitu menyertai raja dalam keberangkatannya atau melepasnya pergi; pilihan ini mempertahankan gagasan pengantaran sekaligus terdengar alami.
- source_word: אֶת בַּיַּרְדֵּן
  choice: dari tepi Sungai Yordan
  rationale: Frasa akhir yang sukar ini dipahami sebagai keterangan tempat pelepasan atau keberangkatan. 'Dari tepi Sungai Yordan' membuat fungsi lokasi dan arah keberangkatan jelas tanpa menjadikannya penyeberangan kedua.
