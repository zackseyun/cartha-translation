  text: וְ/עַתָּה֙ ק֣וּם צֵ֔א וְ/דַבֵּ֖ר עַל לֵ֣ב עֲבָדֶ֑י/ךָ כִּי֩ בַ/יהוָ֨ה נִשְׁבַּ֜עְתִּי כִּי אֵינְ/ךָ֣ יוֹצֵ֗א אִם יָלִ֨ין אִ֤ישׁ אִתְּ/ךָ֙ הַ/לַּ֔יְלָה וְ/רָעָ֧ה לְ/ךָ֣ זֹ֗את מִ/כָּל הָ/רָעָה֙ אֲשֶׁר בָּ֣אָה עָלֶ֔י/ךָ מִ/נְּעֻרֶ֖י/ךָ עַד עָֽתָּה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/008.yaml
  text: Now get up[a], go out, and speak to the heart of your servants, for I swear by Yahweh that if you do not go out, not a man will stay with you tonight, and this will be worse for you than all the trouble that has come upon you from your youth until now.
translation:
  language: id
  text: 'Sekarang, bangunlah, keluarlah, dan berbicaralah kepada hati hamba-hambamu[a]. Sebab, demi Yahweh, aku bersumpah: jika engkau tidak keluar, tak seorang pun akan tinggal bersamamu malam ini. Hal ini akan menjadi lebih buruk bagimu daripada segala kesusahan yang telah menimpamu sejak masa mudamu sampai sekarang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berbicaralah kepada hati hamba-hambamu,” sebuah ungkapan yang berarti berbicara dengan ramah, meneguhkan, atau membujuk mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengalihkan pembicaraan secara mendesak kepada tindakan yang harus segera dilakukan.
- source_word: קוּם צֵא
  choice: bangunlah, keluarlah
  rationale: Kedua bentuk perintah dipertahankan agar urutan tindakan dalam teks Ibrani tetap tampak.
- source_word: וְדַבֵּר עַל־לֵב
  choice: berbicaralah kepada hati
  rationale: Ungkapan Ibrani dipertahankan dalam teks utama untuk menjaga citra aslinya; catatan kaki menjelaskan nuansa berbicara dengan ramah, meneguhkan, atau membujuk.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam konteks kerajaan, istilah ini menunjuk para bawahan atau pengikut raja, bukan terutama status perbudakan.
- source_word: כִּי בַיהוָה נִשְׁבַּעְתִּי
  choice: Sebab, demi Yahweh, aku bersumpah
  rationale: Bentuk sumpah langsung disampaikan secara alami dalam bahasa Indonesia, sementara nama ilahi dipertahankan sebagai Yahweh.
- source_word: אֵינְךָ יוֹצֵא אִם
  choice: jika engkau tidak keluar
  rationale: Susunan Ibrani yang menandai syarat negatif diterjemahkan sebagai klausa bersyarat yang wajar dalam bahasa Indonesia.
- source_word: יָלִין אִישׁ אִתְּךָ הַלַּיְלָה
  choice: tak seorang pun akan tinggal bersamamu malam ini
  rationale: לין di sini berarti tinggal atau bermalam; ungkapan negatif menyeluruh diterjemahkan secara idiomatis tanpa membatasi ancaman hanya kepada satu laki-laki tertentu.
- source_word: וְרָעָה לְךָ זֹאת מִכָּל־הָרָעָה
  choice: Hal ini akan menjadi lebih buruk bagimu daripada segala kesusahan
  rationale: Konstruksi komparatif מן dipertahankan dengan 'lebih buruk ... daripada'; רעה dalam konteks ini menunjuk penderitaan atau kemalangan, sehingga 'kesusahan' lebih tepat daripada kejahatan moral.
- source_word: מִנְּעֻרֶיךָ עַד עָתָּה
  choice: sejak masa mudamu sampai sekarang
  rationale: Ungkapan ini mencakup seluruh rentang hidup Daud dari masa muda hingga krisis saat itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan selaras dengan lapisan konsultasi yang telah diperbarui.
- issue: Cakupan רעה
  choice: kesusahan
  alternative: kejahatan
  rationale: Dalam konteks riwayat penderitaan Daud, istilah ini menunjuk kemalangan atau bencana yang menimpanya, bukan terutama kejahatan moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Kata ganti 'engkau' dipakai untuk tuturan kepada raja dalam narasi Alkitab, sedangkan bentuk perintah berakhiran -lah menyampaikan desakan tanpa menjadi kasar.
