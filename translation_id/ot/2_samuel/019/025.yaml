base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/025.yaml
  text: And Mephibosheth son of Saul came down to meet the king[a]. He had not cared for his feet, nor trimmed his mustache, nor washed his clothes[c][b], from the day the king left until the day he came in peace.
translation:
  language: id
  text: Mefiboset, anak Saul, turun menemui raja. Ia tidak merawat kakinya,[a] tidak merapikan kumisnya,[b] dan tidak mencuci pakaiannya sejak hari raja pergi sampai hari raja datang dengan selamat.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mengerjakan kakinya.” Ungkapan ini mengacu pada pengabaian perawatan kaki, tetapi tindakan tepatnya tidak diketahui.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai menunjuk pada kumis atau bagian bibir atas, bukan pada seluruh janggut.
    reason: lexical_alternative
  - marker: c
    text: Atau “datang dengan damai.” Ungkapan Ibraninya dapat menyatakan kedatangan dalam keadaan aman atau sejahtera.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: turun
  rationale: Mempertahankan arti dasar verba 'turun'; konteks naratif tidak mengharuskan penambahan arah deiktis seperti 'datang turun'.
- source_word: לִקְרַאת הַמֶּלֶךְ
  choice: menemui raja
  rationale: Ungkapan ini menyatakan gerak untuk bertemu seseorang; 'menemui raja' alami dan tepat dalam bahasa Indonesia.
- source_word: וְלֹא עָשָׂה רַגְלָיו
  choice: Ia tidak merawat kakinya
  rationale: Secara harfiah berarti 'tidak mengerjakan kakinya', tetapi tindakan perawatan yang dimaksud tidak pasti. Terjemahan umum ini mempertahankan ketidakpastian tersebut.
- source_word: וְלֹא עָשָׂה שְׂפָמוֹ
  choice: tidak merapikan kumisnya
  rationale: שָׂפָם menunjuk pada rambut atau bagian bibir atas. 'Merapikan kumisnya' sesuai konteks pengabaian perawatan diri tanpa memperluas makna menjadi seluruh janggut.
- source_word: וְאֶת בְּגָדָיו לֹא כִבֵּס
  choice: tidak mencuci pakaiannya
  rationale: כִּבֵּס secara langsung berarti mencuci pakaian; ungkapan Indonesia ini jelas dan modern.
- source_word: לְמִן הַיּוֹם לֶכֶת הַמֶּלֶךְ
  choice: sejak hari raja pergi
  rationale: Infinitif לֶכֶת menandai waktu kepergian raja. 'Pergi' mempertahankan register netral verba Ibrani.
- source_word: עַד הַיּוֹם אֲשֶׁר בָּא בְשָׁלוֹם
  choice: sampai hari raja kembali dengan selamat
  rationale: Subjek pronominal diperjelas sebagai raja sesuai konteks. 'Kembali dengan selamat' menyampaikan keadaan שָׁלוֹם tanpa menambahkan gagasan 'pulang ke rumah' yang tidak tersurat.
