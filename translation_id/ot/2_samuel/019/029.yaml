source:
  edition: WLC
  text: כִּי֩ לֹ֨א הָיָ֜ה כָּל בֵּ֣ית אָבִ֗/י כִּ֤י אִם אַנְשֵׁי מָ֨וֶת֙ לַ/אדֹנִ֣/י הַ/מֶּ֔לֶךְ וַ/תָּ֨שֶׁת֙ אֶֽת עַבְדְּ/ךָ֔ בְּ/אֹכְלֵ֖י שֻׁלְחָנֶ֑/ךָ וּ/מַה יֶּשׁ לִ֥/י עוֹד֙ צְדָקָ֔ה וְ/לִ/זְעֹ֥ק ע֖וֹד אֶל הַ/מֶּֽלֶךְ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/029.yaml
  text: For all my father's house were nothing but men deserving death before my lord the king[a], yet you set your servant among those who eat at your table. So what further right do I have[b], that I should cry out any more to the king?
translation:
  language: id
  text: Sebab seluruh keluarga ayahku hanyalah orang-orang yang patut dihukum mati di hadapan tuanku raja[a], tetapi engkau menempatkan hambamu ini di antara orang-orang yang makan di mejamu. Jadi, hak apa lagi yang kumiliki[b] untuk berseru lagi kepada raja?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang maut,” yaitu orang-orang yang terancam atau patut dihukum mati.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hak” di sini berarti dasar tuntutan yang adil atau sesuatu yang layak dituntut, bukan terutama kebenaran moral pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא הָיָה ... כִּי אִם
  choice: Sebab ... hanyalah
  rationale: Konstruksi ini menyatakan pembatasan yang tegas; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan alasan dengan konteks sebelumnya.
- source_word: כָּל בֵּית אָבִי
  choice: seluruh keluarga ayahku
  rationale: Ungkapan kekerabatan Ibrani ini menunjuk pada keluarga besar atau seisi rumah ayah; 'keluarga ayahku' lebih alami daripada terjemahan harfiah 'rumah ayahku' dalam bahasa Indonesia modern.
- source_word: אַנְשֵׁי מָוֶת
  choice: orang-orang yang patut dihukum mati
  rationale: Idiom ini menunjuk pada orang yang terancam, layak, atau dapat dikenai hukuman mati, bukan orang yang sudah mati.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: di hadapan tuanku raja
  rationale: Preposisi tersebut menyatakan kedudukan mereka terhadap penilaian raja; 'di hadapan' mempertahankan nuansa relasional dan yudisial.
- source_word: וַתָּשֶׁת
  choice: tetapi engkau menempatkan
  rationale: Kata kerjanya berarti menaruh atau menempatkan. 'Tetapi' mengungkapkan kontras nyata dengan keadaan keluarga yang baru disebutkan.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Dalam konteks istana, istilah ini merupakan penyebutan diri yang merendah di hadapan raja. 'Hamba' mempertahankan ragam tutur istana dan dapat dipahami pembaca modern.
- source_word: בְּאֹכְלֵי שֻׁלְחָנֶךָ
  choice: di antara orang-orang yang makan di mejamu
  rationale: Terjemahan ini mempertahankan gambaran sosial asli tentang orang-orang yang mendapat kehormatan dan pemeliharaan di meja raja.
- source_word: וּמַה יֶּשׁ לִי עוֹד צְדָקָה
  choice: Jadi, hak apa lagi yang kumiliki
  rationale: צְדָקָה di sini berarti dasar tuntutan yang adil atau hak untuk mengajukan perkara, bukan terutama kesalehan moral pribadi.
- source_word: וְלִזְעֹק עוֹד אֶל הַמֶּלֶךְ
  choice: untuk berseru lagi kepada raja
  rationale: זעק berarti berseru, khususnya dalam keluhan atau permohonan. Pilihan ini mempertahankan daya verbal teks tanpa mempersempitnya menjadi istilah hukum 'mengajukan banding'.
theological_decisions:
- issue: Makna צְדָקָה dalam permohonan Mefiboset
  choice: hak atau dasar tuntutan yang adil
  alternative: kebenaran atau kesalehan pribadi
  rationale: Konteksnya membicarakan kedudukan Mefiboset untuk kembali mengajukan keluhan kepada raja. Karena itu, makna relasional-yudisial paling sesuai, sambil dijelaskan dalam catatan agar cakupan istilah Ibraninya tidak tersembunyi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat, dengan ragam tutur istana melalui 'tuanku raja' dan 'hambamu ini'. Kalimat mengikuti alur alasan–kontras–kesimpulan dalam teks Ibrani. Pronomina 'engkau' dipertahankan agar selaras dengan bentuk tunggal dan suasana langsung, sedangkan 'mejamu' mempertahankan citra meja kerajaan.
