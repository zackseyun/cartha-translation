base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/006.yaml
  text: Then Joab came into the house to the king and said[a], “Today you have put to shame all your servants who today saved your life, and the lives of your sons and your daughters[c][b], and the lives of your wives and your concubines.”
translation:
  language: id
  text: Lalu Yoab masuk ke dalam rumah untuk menemui raja dan berkata, “Hari ini engkau telah mempermalukan[a] semua hambamu yang hari ini telah menyelamatkan nyawamu, serta nyawa anak-anakmu, baik laki-laki maupun perempuan, juga nyawa istri-istrimu dan gundik-gundikmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “engkau telah mempermalukan wajah semua hambamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּיִת
  choice: rumah
  rationale: Secara harfiah berarti ‘rumah’; dalam konteks ini kemungkinan besar kediaman raja. Bentuk ‘masuk ke dalam rumah untuk menemui raja’ menyampaikan susunan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: הֹבַשְׁתָּ אֶת־פְּנֵי
  choice: engkau telah mempermalukan
  rationale: Ungkapan harfiahnya, ‘membuat wajah ... malu,’ merupakan idiom tentang mendatangkan rasa malu atau aib. Terjemahan ini mempertahankan daya kausatifnya dalam bahasa Indonesia alami.
- source_word: עֲבָדֶיךָ
  choice: hambamu
  rationale: Dalam konteks kerajaan dan militer, istilah ini menunjuk kepada orang-orang yang mengabdi kepada raja; ‘hamba’ mempertahankan hubungan mereka dengan raja tanpa membatasinya hanya pada pejabat.
- source_word: הַמְמַלְּטִים
  choice: yang ... telah menyelamatkan
  rationale: Partisipel ini menyatakan tindakan meluputkan dari bahaya; ‘menyelamatkan’ sesuai dengan konteks pemeliharaan nyawa.
- source_word: נַפְשְׁךָ / נֶפֶשׁ
  choice: nyawamu / nyawa
  rationale: נפש di sini mengacu pada kehidupan jasmani yang diselamatkan dari kematian, bukan ‘jiwa’ sebagai unsur nonjasmani.
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: anak-anakmu, baik laki-laki maupun perempuan
  rationale: Bahasa Ibrani menyebut ‘anak-anak lelakimu dan anak-anak perempuanmu.’ Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan kedua kelompok yang disebutkan.
- source_word: פִּלַגְשֶׁיךָ
  choice: gundik-gundikmu
  rationale: ‘Gundik’ adalah istilah Indonesia yang tepat bagi perempuan dalam ikatan yang diakui tetapi berstatus lebih rendah daripada istri; kategori sosial historis teks dipertahankan tanpa penilaian tambahan.
theological_decisions:
- issue: Penerjemahan istilah keluarga tanpa memasukkan penilaian moral
  choice: istri-istrimu dan gundik-gundikmu
  alternative: istri-istrimu dan istri-istri sekundermu
  rationale: Teks menyebut dua kategori dalam rumah tangga Daud secara langsung. Terjemahan mempertahankan pembedaan historis itu tanpa menghaluskan atau menghakiminya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan ‘engkau’ dipakai dalam kutipan kepada raja untuk mempertahankan gaya naratif Alkitab yang jelas tanpa menjadi terlalu arkais. Pengulangan ‘hari ini’ dan ‘nyawa’ dipertahankan untuk mencerminkan tekanan retoris teks Ibrani.
