base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/001.yaml
  text: Then the king was deeply shaken[a], and he went up to the chamber over the gate and wept. As he went, he said, “My son Absalom! My son, my son Absalom! If only I had died instead of you, Absalom, my son[b], my son!”
translation:
  language: id
  text: Lalu raja sangat terguncang. Ia naik ke kamar di atas pintu gerbang[a] dan menangis. Sambil berjalan, ia berkata, “Anakku Absalom! Anakku, anakku Absalom! Seandainya aku yang mati menggantikan engkau[b], Absalom, anakku, anakku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ruang atas pintu gerbang.”'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah memakai ungkapan “Siapa yang akan memberikan ...?” untuk menyatakan suatu keinginan kuat, yaitu “Seandainya” atau “Sekiranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְגַּז
  choice: sangat terguncang
  rationale: Kata kerja רגז dapat menyatakan gemetar, kegelisahan, atau guncangan batin yang hebat. Dalam konteks perkabungan ini, “sangat terguncang” menyampaikan gejolak emosi raja tanpa membatasinya pada gerakan fisik.
- source_word: עֲלִיַּת הַשַּׁעַר
  choice: kamar di atas pintu gerbang
  rationale: עֲלִיָּה menunjuk pada kamar atau ruang di bagian atas; frasa ini menggambarkan sebuah kamar dalam bangunan pintu gerbang, yang terletak di atasnya.
- source_word: וַיֵּבְךְּ
  choice: menangis
  rationale: Pilihan ini merupakan padanan Indonesia yang langsung, wajar, dan bernada khidmat bagi בכה.
- source_word: וְכֹה אָמַר בְּלֶכְתּוֹ
  choice: Sambil berjalan, ia berkata
  rationale: Terjemahan ini mempertahankan keadaan yang menyertai ucapannya—raja mengucapkan ratapan itu dalam perjalanannya—dengan susunan yang alami dalam bahasa Indonesia.
- source_word: בְּנִי
  choice: anakku
  rationale: Semua pengulangan sapaan ini dipertahankan karena merupakan unsur utama yang mengungkapkan kepedihan ratapan Daud.
- source_word: מִי יִתֵּן
  choice: Seandainya
  rationale: Ungkapan Ibrani yang secara harfiah berbentuk “siapa yang akan memberikan?” berfungsi untuk menyatakan keinginan kuat. “Seandainya” menyampaikan fungsi idiomatis itu dalam bahasa Indonesia modern.
- source_word: מוּתִי אֲנִי תַחְתֶּיךָ
  choice: aku yang mati menggantikan engkau
  rationale: Susunan ini menyatakan keinginan kontrafaktual agar sang pembicara mati sebagai pengganti orang yang telah meninggal. Kata “yang” mempertahankan penekanan pada “aku” dalam teks Ibrani.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
