base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/028.yaml
  text: He slandered your servant to my lord the king, but my lord the king is like the angel of God; so do what is good in your eyes.
translation:
  language: id
  text: Ia telah memfitnah hambamu ini kepada tuanku raja, tetapi tuanku raja seperti malaikat Allah. Jadi, lakukanlah apa yang baik dalam pandanganmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְרַגֵּל
  choice: Ia telah memfitnah
  rationale: Dalam konteks ini verba tersebut menunjuk pada penyampaian tuduhan atau laporan yang merugikan kepada raja; 'memfitnah' menyampaikan nuansa pencemaran nama baik secara alami dalam bahasa Indonesia.
- source_word: בְּעַבְדְּךָ
  choice: hambamu ini
  rationale: Ungkapan orang pertama yang merendahkan diri di hadapan raja diterjemahkan secara langsung dan wajar; 'ini' memperjelas bahwa pembicara menyebut dirinya sendiri.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: seperti malaikat Allah
  rationale: Mempertahankan perbandingan eksplisit dan istilah teologis sumber tanpa menafsirkan fungsi malaikat secara lebih sempit.
- source_word: וַעֲשֵׂה הַטּוֹב בְּעֵינֶיךָ
  choice: Jadi, lakukanlah apa yang baik dalam pandanganmu
  rationale: Mempertahankan idiom Ibrani 'baik dalam pandanganmu' sambil memakai bentuk imperatif hormat yang alami; waw dipahami sebagai kelanjutan konsekuensial dalam konteks.
theological_decisions:
- issue: Sebutan raja sebagai 'seperti malaikat Allah'
  choice: Dipertahankan secara harfiah sebagai perbandingan
  alternative: seperti seorang utusan Allah / memiliki hikmat ilahi
  rationale: Teks menyatakan perbandingan, bukan identifikasi ontologis, dan tidak menjelaskan aspek keserupaannya; ambiguitas tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, hormat, dan bermartabat. Bentuk 'tuanku raja' mempertahankan sapaan istana, sedangkan 'hambamu ini' menyampaikan kerendahan diri pembicara tanpa terasa terlalu arkais.
