  text: וַ/יֻּגַּ֖ד לְ/יוֹאָ֑ב הִנֵּ֨ה הַ/מֶּ֧לֶךְ בֹּכֶ֛ה וַ/יִּתְאַבֵּ֖ל עַל אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/002.yaml
  text: And it was reported to Joab, “Look, the king is weeping and mourning over Absalom.”
translation:
  language: id
  text: Lalu dilaporkan kepada Yoab, “Lihat, raja sedang menangis dan berkabung atas Absalom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Lalu dilaporkan
  rationale: Bentuk Hofal menyatakan bahwa informasi disampaikan kepada Yoab tanpa menyebut pelakunya. Bentuk pasif ‘dilaporkan’ mempertahankan hal itu, sedangkan ‘lalu’ meneruskan urutan narasi dari waw.
- source_word: לְיוֹאָב
  choice: kepada Yoab
  rationale: Menerjemahkan preposisi tujuan secara langsung dan mentransliterasikan nama pribadi dalam bentuk Indonesia yang lazim.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian pada isi laporan. ‘Lihat’ mempertahankan kesegeraan ungkapan tanpa memakai bentuk arkais.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar definit yang digunakan teks Ibrani untuk Daud; dalam bahasa Indonesia, nomina peran ini tidak memerlukan kata sandang tersendiri.
- source_word: בֹּכֶה
  choice: sedang menangis
  rationale: Partisip aktif menunjukkan tindakan yang sedang berlangsung; ‘sedang’ mengungkapkan aspek duratif tersebut secara alami.
- source_word: וַיִּתְאַבֵּל
  choice: dan berkabung
  rationale: Bentuk Hitpael dari אבל menggambarkan tindakan berkabung. Dalam isi laporan, tindakan ini dipahami berlangsung bersama tangisan raja.
- source_word: עַל אַבְשָׁלֹם
  choice: karena Absalom
  rationale: Dengan verba berkabung, עַל menandai orang yang menjadi sebab atau objek kedukaan. ‘Karena Absalom’ alami dalam bahasa Indonesia dan tidak menambahkan bahwa Absalom sendiri menerima tindakan tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan pasif dipertahankan karena pelapor tidak disebutkan, sedangkan ‘sedang’ memperjelas tindakan yang berlangsung. Nama אַבְשָׁלֹם ditulis ‘Absalom’ sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
