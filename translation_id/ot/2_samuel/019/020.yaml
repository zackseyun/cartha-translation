  terminology: '"Tuanku," "hambamu," "raja/Raja," dan "kesalahan" sesuai dengan register istana dan makna konteks. Kapitalisasi "Raja" dipertahankan ketika berfungsi sebagai sebutan pengganti nama dalam ujaran langsung.'
