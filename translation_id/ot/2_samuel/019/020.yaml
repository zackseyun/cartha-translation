base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/020.yaml
  text: And he said to the king[a], “Do not let my lord count me guilty, and do not remember how your servant did wrong on the day my lord the king went out from Jerusalem[b], so that the king should take it to heart.”
translation:
  language: id
  text: Lalu ia berkata kepada raja, “Janganlah Tuanku memperhitungkan kesalahanku[a], dan janganlah mengingat perbuatan salah yang dilakukan hambamu pada hari Tuanku Raja keluar dari Yerusalem, supaya Raja tidak menaruhnya dalam hati[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memperhitungkan kepadaku kesalahan”; ungkapan Ibrani ini bernuansa penghakiman atau penetapan kesalahan kepada seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menaruhnya pada hatinya”; ungkapan ini berarti memperhatikannya dengan serius atau menyimpannya dalam hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲשָׁב לִי עָוֺן
  choice: memperhitungkan kesalahanku
  rationale: Ungkapan Ibrani secara harfiah menggambarkan kesalahan yang diperhitungkan kepada seseorang. Pilihan ini mempertahankan nuansa penghakiman dan permohonan agar pelanggaran itu tidak ditanggungkan kepadanya, tetapi tetap wajar dalam bahasa Indonesia.
- source_word: עָוֺן
  choice: kesalahan
  rationale: Kata ini dapat menunjuk pada kejahatan, kesalahan, atau kesalahan yang menimbulkan tanggungan. Dalam pengakuan pribadi ini, “kesalahan” jelas dan tidak mempersempit maknanya menjadi hukuman.
- source_word: תִּזְכֹּר
  choice: mengingat
  rationale: Terjemahan langsung ini mempertahankan implikasi kontekstual bahwa mengingat kesalahan dapat berarti tetap memperkarakan atau menindaknya, tanpa menyatakannya secara berlebihan.
- source_word: הֶעֱוָה
  choice: perbuatan salah
  rationale: Bentuk verba ini menyatakan tindakan yang salah atau menyimpang. Frasa tersebut menyampaikan pengakuan atas kelakuan salah dengan bahasa Indonesia modern dan alami.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Dalam sapaan istana, istilah ini merupakan penyebutan diri yang merendah di hadapan raja. “Hambamu” mempertahankan nada hormat dan status sosial ungkapan itu.
- source_word: יָצָא ... מִירוּשָׁלָם
  choice: keluar dari Yerusalem
  rationale: Pilihan ini mengikuti gambaran gerak dalam teks Ibrani dan sesuai dengan konteks kepergian raja dari kota.
- source_word: לָשׂוּם ... אֶל לִבּוֹ
  choice: memasukkannya ke dalam hati
  rationale: Terjemahan ini cukup dekat dengan citra Ibrani “menaruh pada hati” dan dalam konteks berarti menganggap serius atau terus menyimpan kesalahan itu terhadap pelakunya.
- source_word: הַמֶּלֶךְ
  choice: raja / Raja
  rationale: Pengulangan sebutan “raja” dipertahankan sesuai gaya sapaan istana dalam bahasa sumber; huruf kapital dipakai ketika menjadi sapaan pengganti nama.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Ini adalah sapaan hormat kepada raja, bukan nama ilahi. “Tuanku” mempertahankan unsur kepemilikan orang pertama dan nada takzim.
