translation_notes:
  register: Bahasa dibuat modern, hormat, dan bermartabat. Bentuk sapaan “Tuanku” serta penyebutan diri “hambamu” mempertahankan tata krama istana. Pergeseran dari orang kedua (“Tuanku”) ke orang ketiga (“Raja”) sengaja dipertahankan karena terdapat dalam teks Ibrani.
