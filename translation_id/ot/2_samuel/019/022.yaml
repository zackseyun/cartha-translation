  text: וַ/יַּ֨עַן אֲבִישַׁ֤י בֶּן צְרוּיָה֙ וַ/יֹּ֔אמֶר הֲ/תַ֣חַת זֹ֔את לֹ֥א יוּמַ֖ת שִׁמְעִ֑י כִּ֥י קִלֵּ֖ל אֶת מְשִׁ֥יחַ יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/022.yaml
  text: But Abishai son of Zeruiah answered and said[a], “Should Shimei not be put to death for this, because he cursed Yahweh’s anointed?”
translation:
  language: id
  text: Namun Abisai anak Zeruya menjawab, “Bukankah Simei harus dihukum mati karena hal ini, sebab ia telah mengutuk orang yang diurapi Yahweh?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab
  rationale: Dalam narasi Ibrani, gabungan verba ini memperkenalkan jawaban. Bahasa Indonesia alami cukup memakai satu verba, “menjawab,” tanpa menggandakan “menjawab dan berkata”.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abisai anak Zeruya
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia; “anak” mempertahankan hubungan identifikasi dalam teks.
- source_word: הֲתַחַת זֹאת
  choice: Bukankah ... karena hal ini
  rationale: Partikel tanya הֲ dengan לֹא membentuk pertanyaan yang mengharapkan jawaban positif, sedangkan תַחַת זֹאת menyatakan dasar atau alasan tindakan tersebut.
- source_word: לֹא יוּמַת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות menunjuk pada tindakan menyebabkan seseorang mati, dalam konteks ini pelaksanaan hukuman, bukan sekadar kematian biasa.
- source_word: שִׁמְעִי
  choice: Simei
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi usul Abisai; “sebab” jelas dan sesuai dengan ragam naratif yang bermartabat.
- source_word: קִלֵּל
  choice: telah mengutuk
  rationale: Verba ini mengacu pada kutukan verbal Simei terhadap Daud. Aspek lampau dibuat jelas karena tindakan itu telah terjadi.
- source_word: מְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: Ungkapan ini menunjuk pada raja sebagai orang yang diurapi oleh Yahweh. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nama ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian dan selaras dengan lapisan konsultasi terbaru.
- issue: Makna מְשִׁיחַ sebagai jabatan kerajaan
  choice: orang yang diurapi Yahweh
  alternative: yang diurapi Yahweh
  rationale: Terjemahan ini mempertahankan arti konkret bahwa Daud adalah orang yang telah diurapi oleh Yahweh, tanpa memasukkan pengertian mesianik yang melampaui konteks langsung.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur pertanyaan retoris dipertahankan. Ungkapan rangkap Ibrani “menjawab dan berkata” diringkas secara alami menjadi “menjawab,” tanpa kehilangan fungsi wacananya.
