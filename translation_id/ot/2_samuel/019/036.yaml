base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/036.yaml
  text: I am eighty years old today[a]. Can I still distinguish between good and evil? Can your servant taste what I eat and what I drink? Can I still hear the voice of male singers and female singers? Why then should your servant still be a burden to my lord the king?
translation:
  language: id
  text: Hari ini saya berumur delapan puluh tahun. Masih dapatkah saya membedakan antara yang baik dan yang buruk?[a] Masih dapatkah hamba tuanku mengecap apa yang saya makan dan minum? Masih dapatkah saya mendengar suara para penyanyi laki-laki dan perempuan? Jadi, mengapa hamba tuanku masih harus menjadi beban bagi tuanku, raja?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang baik dan yang jahat.” Ungkapan Ibrani ini dapat menunjuk pada penilaian moral maupun kemampuan membedakan secara praktis; dalam konteks ini, usia lanjut dan melemahnya indra mendukung arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שְׁמֹנִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Hari ini umur saya delapan puluh tahun
  rationale: Ungkapan Ibrani harfiah 'anak delapan puluh tahun' merupakan idiom usia; susunan ini alami dalam bahasa Indonesia dan mempertahankan הַיּוֹם ('hari ini').
- source_word: הַאֵדַע בֵּין טוֹב לְרָע
  choice: Masih dapatkah saya membedakan yang baik dan yang buruk?
  rationale: ידע בין menyatakan kemampuan membedakan atau menilai. Dalam konteks usia lanjut dan menurunnya kemampuan indrawi, 'yang baik dan yang buruk' mempertahankan keluasan ungkapan tanpa membatasinya pada kategori moral.
- source_word: אִם יִטְעַם עַבְדְּךָ
  choice: Masih dapatkah hamba Tuan merasakan
  rationale: אִם di sini memperkenalkan pertanyaan retoris, sedangkan טעם menunjuk pada kemampuan mengecap atau merasakan makanan. 'Merasakan' terdengar alami dan mencakup persepsi rasa.
- source_word: עַבְדְּךָ
  choice: hamba Tuan
  rationale: Ini adalah sebutan diri yang sopan di hadapan raja, bukan penekanan pada status perbudakan. Kapitalisasi 'Tuan' menandai sapaan hormat kepada manusia, bukan gelar ilahi.
- source_word: אֶת אֲשֶׁר אֹכַל וְאֶת אֲשֶׁר אֶשְׁתֶּה
  choice: apa yang saya makan dan minum
  rationale: Terjemahan alami dari konstruksi relatif yang tetap mempertahankan dua kegiatan, makan dan minum.
- source_word: אֶשְׁמַע עוֹד בְּקוֹל שָׁרִים וְשָׁרוֹת
  choice: Masih dapatkah saya mendengar suara para penyanyi laki-laki dan perempuan?
  rationale: Mempertahankan עוֹד ('masih'), קוֹל ('suara'), serta pembedaan bentuk maskulin dan feminin dalam bahasa Ibrani.
- source_word: לָמָּה יִהְיֶה עַבְדְּךָ עוֹד לְמַשָּׂא
  choice: Jadi, mengapa hamba Tuan ini masih harus menjadi beban
  rationale: '''Jadi'' menyampaikan hubungan simpulan dengan pertanyaan sebelumnya; מַשָּׂא dipakai secara metaforis sebagai ''beban''.'
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku, raja
  rationale: Sapaan istana kepada raja manusia; huruf kecil pada 'tuanku' menghindari kesan bahwa ini gelar ilahi.
theological_decisions:
- issue: Cakupan ungkapan טוֹב לְרָע
  choice: yang baik dan yang buruk
  alternative: yang baik dan yang jahat
  rationale: Konteks membicarakan kemerosotan kemampuan karena usia, termasuk pengecapan dan pendengaran. Karena itu ungkapan tersebut kemungkinan besar menunjuk pada daya membedakan atau menilai secara umum, walaupun nuansa moral tetap mungkin dan dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada hormat dan bermartabat. Pergantian antara ''saya'' dan sebutan diri ''hamba Tuan'' mengikuti fungsi retoris teks: ''saya'' alami dalam pertanyaan tentang kemampuan pribadi, sedangkan ''hamba Tuan'' mempertahankan tata krama istana. Pembedaan jenis kelamin para penyanyi dipertahankan secara eksplisit.'
