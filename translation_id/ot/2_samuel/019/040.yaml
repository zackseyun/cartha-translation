  text: וַ/יַּעֲבֹ֧ר כָּל הָ/עָ֛ם אֶת הַ/יַּרְדֵּ֖ן וְ/הַ/מֶּ֣לֶךְ עָבָ֑ר וַ/יִּשַּׁ֨ק הַ/מֶּ֤לֶךְ לְ/בַרְזִלַּי֙ וַ/יְבָ֣רֲכֵ֔/הוּ וַ/יָּ֖שָׁב לִ/מְקֹמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/040.yaml
  text: All the people crossed the Jordan[a], and the king crossed over. Then the king kissed Barzillai and blessed him, and he returned to his own place.
translation:
  language: id
  text: Seluruh rakyat menyeberangi Sungai Yordan, dan raja pun menyeberang. Kemudian raja mencium Barzilai dan memberkatinya. Lalu ia kembali ke tempatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Subjek “ia kembali” paling mungkin adalah Barzilai, meskipun bahasa Ibrani tidak menyebutkannya secara eksplisit. Dapat juga diterjemahkan, “Lalu Barzilai kembali ke tempatnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberangi
  rationale: Kata עבר dalam konteks ini menunjuk pada tindakan melintasi Sungai Yordan; “menyeberangi” merupakan padanan Indonesia yang alami dan konkret.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Kata עָם berarti “rakyat” atau “orang-orang.” Dalam konteks rombongan yang menyertai raja, “seluruh rakyat” mempertahankan cakupan luas tanpa membatasinya hanya pada pasukan.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Yang diseberangi adalah Sungai Yordan. Penyebutan “Sungai” membuat rujukannya langsung jelas dan sesuai dengan kelaziman bahasa Indonesia.
- source_word: וְהַמֶּלֶךְ עָבָר
  choice: dan raja pun menyeberang
  rationale: Pengulangan akar עבר dipertahankan, sedangkan partikel “pun” membuat pengulangan itu wajar dalam narasi Indonesia.
- source_word: וַיִּשַּׁק
  choice: mencium
  rationale: Dalam bentuk dan konteks ini, נשׁק berarti “mencium,” yakni sebagai ungkapan kasih dan perpisahan.
- source_word: לְבַרְזִלַּי
  choice: Barzilai
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיְבָרֲכֵהוּ
  choice: memberkatinya
  rationale: Kata ברך secara langsung berarti “memberkati.” Terjemahan ini mempertahankan tindakan berkat tanpa mengubahnya menjadi sekadar ucapan perpisahan.
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: Lalu ia kembali ke tempatnya
  rationale: Terjemahan ini mempertahankan pronomina tunggal dan kata מָקוֹם tanpa mempersempit maknanya menjadi “rumah.” Subjeknya paling mungkin Barzilai, tetapi bahasa Ibrani membiarkannya tersirat.
theological_decisions:
- issue: Subjek tersirat dalam וַיָּשָׁב (“ia kembali”)
  choice: Mempertahankan “ia” dalam teks utama dan menjelaskan kemungkinan rujukannya dalam catatan kaki
  alternative: Menuliskan secara eksplisit, “Lalu Barzilai kembali ke tempatnya”
  rationale: Bahasa Ibrani tidak menyebut nama subjek. Barzilai adalah rujukan yang paling alami berdasarkan konteks dan anteseden terdekat, tetapi memasukkan namanya ke dalam teks utama akan menghilangkan ambiguitas gramatikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dipertahankan tanpa terasa kaku; “pun” membantu menyampaikan pengulangan tindakan menyeberang. Ambiguitas subjek pada klausa terakhir sengaja dipertahankan dan dijelaskan melalui catatan kaki.
