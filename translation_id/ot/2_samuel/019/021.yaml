  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י יָדַ֣ע עַבְדְּ/ךָ֔ כִּ֖י אֲנִ֣י חָטָ֑אתִי וְ/הִנֵּֽה בָ֣אתִי הַ/יּ֗וֹם רִאשׁוֹן֙ לְ/כָל בֵּ֣ית יוֹסֵ֔ף לָ/רֶ֕דֶת לִ/קְרַ֖את אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/021.yaml
  text: For your servant knows that I have sinned[a]. And look, I have come today as the first of all the house of Joseph[b] to come down to meet my lord the king.
translation:
  language: id
  text: Sebab hambamu ini tahu bahwa aku telah berdosa. Lihatlah, hari ini akulah yang pertama dari seluruh kaum keturunan Yusuf[a] yang datang turun untuk menyongsong tuanku raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kaum keturunan Yusuf” menunjuk pada suku-suku keturunan Yusuf, terutama kelompok suku di utara yang berkaitan dengan Efraim dan Manasye.
    reason: cultural_note
  - marker: b
    text: Frasa Ibraninya juga dapat dipahami, “akulah yang pertama dari antara seluruh kaum keturunan Yusuf yang datang turun untuk menyongsong tuanku raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi permohonan Simei dan mempertahankan hubungan logis dengan konteks sebelumnya.
- source_word: יָדַע עַבְדְּךָ
  choice: hambamu ini tahu
  rationale: Bentuk perfek menyatakan keadaan sadar pada saat berbicara; 'hambamu' merupakan sebutan diri yang hormat dalam sapaan kepada raja.
- source_word: חָטָאתִי
  choice: aku telah berdosa
  rationale: Mempertahankan bobot moral חטא serta pengakuan kini atas kesalahan yang telah dilakukan.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Ungkapan modern dan bermartabat yang tetap mempertahankan fungsi penarik perhatian tanpa memakai bentuk arkais.
- source_word: בָאתִי הַיּוֹם
  choice: hari ini akulah ... yang datang
  rationale: Menyampaikan tindakan yang telah mencapai keadaan sekarang dan menempatkan penekanan alami pada kedatangan Simei hari itu.
- source_word: רִאשׁוֹן לְכָל בֵּית יוֹסֵף
  choice: yang pertama dari seluruh kaum keturunan Yusuf
  rationale: Mengungkapkan Simei sebagai orang pertama dari kelompok kolektif itu, sambil mempertahankan kemungkinan cakupan frasa Ibrani dalam catatan kaki.
- source_word: בֵּית יוֹסֵף
  choice: kaum keturunan Yusuf
  rationale: Dalam konteks ini בֵּית menunjuk kelompok suku yang dikaitkan dengan Yusuf; ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'rumah Yusuf'.
- source_word: לָרֶדֶת
  choice: datang turun
  rationale: Mempertahankan unsur arah/topografi 'turun' dan sudut pandang gerak menuju pihak yang ditemui.
- source_word: לִקְרַאת
  choice: untuk menyongsong
  rationale: Menyatakan gerak keluar menuju seseorang untuk menemuinya, sesuai konteks penyambutan raja.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan istana yang hormat dan struktur gelar dalam bahasa Indonesia yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dalam konteks kerajaan. Kata ganti 'aku' dipakai dalam pengakuan langsung, sementara 'hambamu' dan 'tuanku raja' mempertahankan kerendahan diri serta tata krama istana. Penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
