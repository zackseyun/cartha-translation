base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/043.yaml
  text: Then every man of Judah answered the man of Israel[a], “Because the king is a close relative to me[b]. So why has this matter made you angry? Have we eaten at all at the king’s expense? Or has he given us any gift?”
translation:
  language: id
  text: Lalu semua orang Yehuda menjawab orang-orang Israel[a], “Sebab raja adalah kerabat dekat kami.[b] Jadi, mengapa kamu marah karena perkara ini? Apakah kami sedikit pun makan atas biaya raja? Atau apakah kami menerima pemberian apa pun?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah memakai bentuk tunggal, “orang Israel”, tetapi ungkapan itu merujuk secara kolektif kepada orang-orang Israel.
    reason: collective_singular
  - marker: b
    text: Secara harfiah, “raja dekat denganku”; dalam konteks ini, kedekatan itu kemungkinan besar berarti hubungan kekerabatan atau kesukuan.
    reason: lexical_alternative
  - marker: c
    text: Klausa terakhir dalam bahasa Ibrani sulit. Secara lebih harfiah dapat diterjemahkan, “Atau adakah sesuatu yang diangkat bagi kami?” Maksudnya tampaknya bahwa mereka tidak menerima pemberian atau keuntungan khusus dari raja.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן כָּל אִישׁ יְהוּדָה
  choice: Lalu semua orang Yehuda menjawab
  rationale: Bentuk naratif וַיַּעַן melanjutkan urutan peristiwa dan menyatakan tanggapan. Frasa tunggal distributif כָּל אִישׁ diterjemahkan secara alami sebagai kelompok, “semua orang Yehuda”.
- source_word: עַל אִישׁ יִשְׂרָאֵל
  choice: orang Israel
  rationale: Teks Ibrani memakai bentuk tunggal yang berfungsi secara kolektif dalam pertukaran antara kelompok Yehuda dan Israel. Ungkapan Indonesia ini mempertahankan bentuk kolektif tersebut.
- source_word: כִּי קָרוֹב הַמֶּלֶךְ אֵלַי
  choice: Sebab raja adalah kerabat dekat kami
  rationale: קָרוֹב dengan אֶל menyatakan kedekatan, yang dalam konteks ini paling mungkin merupakan kedekatan kekerabatan atau kesukuan dengan Daud. Kata ganti “kami” mengikuti suara kolektif orang Yehuda dalam bahasa Indonesia.
- source_word: וְלָמָּה זֶּה חָרָה לְךָ עַל הַדָּבָר הַזֶּה
  choice: Jadi, mengapa kamu marah karena perkara ini?
  rationale: חָרָה adalah idiom untuk menjadi marah, sedangkan דָּבָר menunjuk pada perkara yang sedang diperselisihkan. “Jadi” menyampaikan hubungan argumentatif secara alami.
- source_word: הֶאָכוֹל אָכַלְנוּ מִן הַמֶּלֶךְ
  choice: Apakah kami sedikit pun makan atas biaya raja?
  rationale: Infinitif absolut bersama verba finit memberi penegasan yang ditangkap oleh “sedikit pun”. “Dari raja” dipahami dalam konteks sebagai menikmati jamuan atau keuntungan yang ditanggung raja.
- source_word: אִם נִשֵּׂאת נִשָּׂא לָנוּ
  choice: Atau apakah kami menerima pemberian apa pun?
  rationale: Klausa ini secara tekstual dan sintaktis sulit. Dalam kesejajaran dengan pertanyaan sebelumnya, ungkapan itu menyangkal bahwa Yehuda menerima keuntungan khusus; terjemahan utama dibuat alami tanpa menutup kemungkinan pembacaan yang lebih harfiah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk sapaan “kamu” dibiarkan tanpa penanda jumlah karena bahasa Indonesia tidak membedakannya secara wajib; dalam konteks, Israel dipandang sebagai kelompok. Tanda baca menempatkan catatan akhir setelah kutipan karena catatan itu menerangkan seluruh klausa terakhir.
