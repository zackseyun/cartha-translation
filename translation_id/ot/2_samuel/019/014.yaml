  edition: WLC
  text: וְ/לַֽ/עֲמָשָׂא֙ תֹּֽמְר֔וּ הֲ/ל֛וֹא עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה כֹּ֣ה יַֽעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם לֹ֠א שַׂר צָבָ֞א תִּהְיֶ֧ה לְ/פָנַ֛/י כָּל הַ/יָּמִ֖ים תַּ֥חַת יוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/014.yaml
  text: And say to Amasa[a], ‘Are you not my bone and my flesh? May God do so to me, and more also, if you are not commander of the army before me all the days in place of Joab.’
translation:
  language: id
  text: Katakanlah kepada Amasa, ‘Bukankah engkau tulangku dan dagingku? Beginilah kiranya Allah memperlakukan aku, bahkan lebih lagi, jika engkau tidak menjadi panglima tentara di hadapanku untuk seterusnya[a], menggantikan Yoab.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh hari-hari,” suatu ungkapan untuk masa tugas yang terus berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַעֲמָשָׂא תֹּמְרוּ
  choice: Katakanlah kepada Amasa
  rationale: Bentuk orang kedua jamak menyampaikan perintah kepada para utusan. Bahasa Indonesia tidak perlu menandai kejamakan pada verba, dan bentuk ini mempertahankan daya direktifnya secara alami.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan persetujuan.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: tulangku dan dagingku
  rationale: Ungkapan kekerabatan yang hidup dan penting dipertahankan secara harfiah daripada diratakan menjadi sekadar ‘kerabatku’.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יוֹסִיף
  choice: Beginilah kiranya Allah memperlakukan aku, bahkan lebih lagi
  rationale: Mempertahankan rumusan sumpah dan tidak menjelaskan secara berlebihan bentuk hukuman yang sengaja tidak disebutkan.
- source_word: אִם לֹא
  choice: jika ... tidak
  rationale: Struktur bersyarat dalam rumusan sumpah dipertahankan, walaupun dalam konteks ini berfungsi menegaskan janji dengan sungguh-sungguh.
- source_word: שַׂר צָבָא
  choice: panglima tentara
  rationale: Menunjuk kepada pemimpin militer tertinggi dengan istilah Indonesia yang jelas dan bermartabat.
- source_word: תִּהְיֶה לְפָנַי
  choice: menjadi ... di hadapanku
  rationale: Mempertahankan gambaran Ibrani tentang jabatan yang dijalankan di hadapan dan di bawah wewenang raja tanpa mempersempitnya menjadi tafsiran administratif tertentu.
- source_word: כָּל הַיָּמִים
  choice: untuk seterusnya
  rationale: Dalam konteks pengangkatan jabatan, ungkapan harfiah ‘sepanjang hari-hari’ menyatakan masa tugas yang berkelanjutan. ‘Untuk seterusnya’ menyampaikan fungsi idiomatisnya secara wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: תַּחַת יוֹאָב
  choice: menggantikan Yoab
  rationale: תַּחַת di sini menyatakan penggantian atau suksesi, bukan kedudukan di bawah Yoab.
theological_decisions:
- issue: Bilangan gramatikal אֱלֹהִים dalam rumusan sumpah
  choice: Allah
  alternative: allah-allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, tata bahasa dan rumusan sumpah ini menunjuk kepada Allah Israel sebagai referen tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Ungkapan kekerabatan dan rumusan sumpah dipertahankan dekat dengan bentuk Ibrani, sedangkan idiom waktu diterjemahkan secara alami dan bentuk harfiahnya diberikan dalam catatan kaki.
