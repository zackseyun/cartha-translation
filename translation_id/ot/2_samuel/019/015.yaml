translation:
  language: id
  text: Ia menggerakkan hati setiap orang Yehuda sehingga mereka bersatu seperti satu orang. Lalu mereka mengirim pesan kepada raja, “Kembalilah, engkau dan semua hambamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּט אֶת־לְבַב
  choice: Ia berhasil memikat hati
  rationale: Ungkapan Ibrani secara harfiah berarti ‘mencondongkan hati’; dalam konteks ini menunjuk pada tindakan meyakinkan atau memenangkan dukungan, sehingga ‘memikat hati’ mempertahankan gambaran hati sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: כְּאִישׁ אֶחָד
  choice: sehingga mereka sepakat seperti satu orang
  rationale: Idiom ini menyatakan kesatuan sikap dan tindakan. Penambahan ‘mereka sepakat’ memperjelas fungsi idiom, sedangkan ‘seperti satu orang’ mempertahankan citra teks sumber.
- source_word: שׁוּב
  choice: Kembalilah
  rationale: Imperatif tunggal maskulin yang ditujukan kepada raja; bentuk Indonesia ini langsung dan setia pada sumber.
- source_word: עֲבָדֶיךָ
  choice: hambamu
  rationale: Dalam konteks kerajaan, ‘hamba’ mempertahankan hubungan resmi antara raja dan para pengikut atau pejabatnya tanpa mempersempit artinya.
theological_decisions:
- issue: Subjek kata kerja וַיַּט tidak disebutkan secara eksplisit dalam ayat ini.
  choice: Memakai pronomina ‘Ia’ tanpa menyebut nama.
  alternative: Menyebut ‘Daud’ atau ‘Amasa’ berdasarkan konteks ayat sebelumnya.
  rationale: Teks Ibrani hanya memberi subjek orang ketiga tunggal. Pemakaian ‘Ia’ mempertahankan rujukan kontekstual dan tidak menyelesaikan secara diam-diam kemungkinan ketidakjelasan anteseden.
- issue: Sifat pengaruh terhadap orang Yehuda.
  choice: ‘berhasil memikat hati’
  alternative: ‘mencondongkan hati’, ‘membujuk’, atau ‘memenangkan hati’.
  rationale: Pilihan ini tidak menganggap adanya tindakan ilahi langsung atau paksaan, tetapi menyampaikan keberhasilan memperoleh kesatuan dukungan sebagaimana ditunjukkan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur dibuat alami bagi pembaca umum, sambil mempertahankan metafora hati dan gambaran kesatuan ‘seperti satu orang’.
