  source_fidelity: 'Struktur dan isi pokoknya setia pada teks Ibrani: penanda perhatian, kelompok-kelompok kolektif, tuduhan metaforis ‘mencuri’, tindakan membawa menyeberang, rumah tangga raja, dan orang-orang Daud semuanya terwakili. ‘Anak buah Daud’ however narrows אַנְשֵׁי דָוִד toward subordinates or troops and is more colloquial than the source requires.'
  naturalness: Bahasa umumnya jelas dan modern. ‘Semua pengikut Daud yang bersamanya’ is more neutral and suitably dignified than ‘semua anak buah Daud yang bersamanya.’ ‘Mencuri Baginda’ is deliberately marked but defensible as a close rendering of the accusation; the footnote supplies the idiomatic contextual alternative.
  terminology: ‘Yehuda,’ ‘Sungai Yordan,’ ‘Baginda,’ and ‘raja’ are consistent and appropriate. ‘Seisi rumahnya’ adequately conveys the king’s household in this context.
