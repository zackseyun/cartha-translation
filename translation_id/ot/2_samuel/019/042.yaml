  to: Lihatlah, semua orang Israel[a] datang menghadap raja dan berkata kepadanya, “Mengapa saudara-saudara kami, orang-orang Yehuda, mencuri Baginda[b], lalu membawa raja, seisi rumahnya, dan semua pengikut Daud yang bersamanya menyeberangi Sungai Yordan?”
