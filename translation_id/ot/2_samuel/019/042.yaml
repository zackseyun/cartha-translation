  text: וְ/הִנֵּ֛ה כָּל אִ֥ישׁ יִשְׂרָאֵ֖ל בָּאִ֣ים אֶל הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֣וּ אֶל הַ/מֶּ֡לֶךְ מַדּוּעַ֩ גְּנָב֨וּ/ךָ אַחֵ֜י/נוּ אִ֣ישׁ יְהוּדָ֗ה וַ/יַּעֲבִ֨רוּ אֶת הַ/מֶּ֤לֶךְ וְ/אֶת בֵּית/וֹ֙ אֶת הַ/יַּרְדֵּ֔ן וְ/כָל אַנְשֵׁ֥י דָוִ֖ד עִמּֽ/וֹ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/042.yaml
  text: And behold[a], all the men of Israel came to the king and said to the king, “Why have our brothers, the men of Judah, stolen you away and brought the king and his household across the Jordan[b], and all David’s men with him?”
translation:
  language: id
  text: Lihatlah, semua orang Israel[a] datang menghadap raja dan berkata kepadanya, “Mengapa saudara-saudara kami, orang-orang Yehuda, mencuri Baginda[b], lalu membawa raja, seisi rumahnya, dan semua pengikut Daud yang bersamanya menyeberangi Sungai Yordan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai ungkapan kolektif maskulin, secara harfiah “setiap laki-laki Israel”; demikian pula “orang-orang Yehuda” kemudian dalam ayat ini.
    reason: cultural_note
  - marker: b
    text: Atau “membawa Baginda pergi secara diam-diam.” Kata Ibrani yang biasa berarti “mencuri” dipakai sebagai metafora untuk tindakan Yehuda membawa raja tanpa melibatkan kelompok Israel lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menarik perhatian dan memberi kesan hidup pada kemunculan rombongan Israel.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: semua orang Israel
  rationale: Bentuk tunggal אִישׁ berfungsi secara kolektif. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan כָּל.
- source_word: בָּאִים אֶל הַמֶּלֶךְ
  choice: datang menghadap raja
  rationale: ‘Menghadap’ menyampaikan gerak datang kepada raja sekaligus konteks audiensi kerajaan secara alami.
- source_word: גְּנָבוּךָ
  choice: mencuri Baginda
  rationale: Mempertahankan metafora tajam dari verba biasa ‘mencuri’; ‘Baginda’ merupakan sapaan langsung yang wajar dan hormat kepada raja dalam bahasa Indonesia.
- source_word: אַחֵינוּ אִישׁ יְהוּדָה
  choice: saudara-saudara kami, orang-orang Yehuda
  rationale: Mempertahankan bahasa kekerabatan dalam perselisihan antarkelompok Israel dan memahami אִישׁ secara kolektif.
- source_word: וַיַּעֲבִרוּ
  choice: membawa ... menyeberangi
  rationale: 'Menyatakan makna kausatif bentuk Hifil: membuat atau membawa seseorang menyeberang.'
- source_word: בֵּיתוֹ
  choice: seisi rumahnya
  rationale: Dalam konteks ini בַּיִת menunjuk kepada rumah tangga atau keluarga beserta rombongan raja, bukan bangunan.
- source_word: וְכָל אַנְשֵׁי דָוִד עִמּוֹ
  choice: dan semua anak buah Daud yang bersamanya
  rationale: ‘Anak buah Daud’ menyampaikan para pengikut atau pasukan Daud secara alami, sedangkan ‘yang bersamanya’ mempertahankan עִמּוֹ.
