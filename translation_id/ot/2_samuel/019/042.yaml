translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan “Baginda” dipakai untuk sapaan langsung kepada raja, sementara pengulangan “raja” dalam klausa berikutnya dipertahankan sesuai peralihan ungkapan dalam teks Ibrani.
