lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר paling wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Mempertahankan gelar definit dalam teks Ibrani tanpa menambahkan nama Daud.
- source_word: גַּם אֶת הַכֹּל יִקָּח
  choice: Bahkan, biarlah ia mengambil semuanya
  rationale: “Bahkan” menyampaikan penekanan גַּם, sedangkan “biarlah” menangkap daya yusif dari bentuk imperfek יִקָּח sebagai kerelaan atau izin.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: sebab
  rationale: Dalam konteks ini frasa temporal tersebut sekaligus memberikan dasar bagi kerelaan Mefiboset; “sebab” menyampaikan hubungan kausal secara alami.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan istana yang hormat dan tetap alami dalam bahasa Indonesia.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan raja, frasa ini terutama menyatakan bahwa ia tiba dengan aman dan tidak terluka; arti harfiahnya dicatat dalam catatan kaki.
- source_word: אֶל בֵּיתוֹ
  choice: di istananya sendiri
  rationale: “Istana” sesuai dengan rumah kediaman raja dalam konteks, sementara “sendiri” menonjolkan sufiks posesif dan kepulangan ke kediamannya.
