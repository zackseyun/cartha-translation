  yaml_path: translation/ot/2_samuel/019/041.yaml
  text: Then the king crossed over to Gilgal[a], and Kimham crossed over with him. And all the people of Judah escorted the king across, and also half the people of Israel.
translation:
  language: id
  text: Lalu raja menyeberang ke Gilgal, dan Kimham menyeberang bersamanya. Seluruh rakyat Yehuda mengantarkan raja menyeberang[a], demikian juga separuh rakyat Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membawa raja menyeberang” atau “menyebabkan raja menyeberang.” Dalam konteks ini, kata kerja Ibrani dengan objek langsung dapat memiliki arti kausatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Dalam konteks narasi ini, עבר menunjuk pada penyeberangan Sungai Yordan; 'menyeberang' menyampaikan gerak itu secara alami.
- source_word: הַגִּלְגָּלָה
  choice: menuju Gilgal
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak ke arah Gilgal. 'Menuju Gilgal' mempertahankan nuansa arah tanpa memastikan bahwa tujuan telah dicapai pada saat tindakan menyeberang.
- source_word: וְכִמְהָן
  choice: dan Kimham
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang dekat dengan pelafalan Ibrani.
- source_word: עָבַר עִמּוֹ
  choice: menyeberang bersamanya
  rationale: Pengulangan kata kerja עבר dipertahankan untuk menghubungkan tindakan Kimham dengan penyeberangan raja.
- source_word: וְכָל עַם יְהוּדָה
  choice: seluruh rakyat Yehuda
  rationale: עם יהודה menunjuk kepada rakyat atau kelompok dari Yehuda; 'seluruh rakyat Yehuda' jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיַּעַבְרוּ אֶת־הַמֶּלֶךְ
  choice: mengantarkan raja menyeberang
  rationale: Bentuk kata kerja dengan objek langsung di sini dapat bernuansa kausatif atau transitif. 'Mengantarkan raja menyeberang' alami dalam bahasa Indonesia dan mencakup gagasan mendampingi atau membawa raja melintasi sungai.
- source_word: וְגַם
  choice: demikian juga
  rationale: Ungkapan ini menambahkan kelompok lain yang turut berperan dan terdengar alami setelah klausa sebelumnya.
- source_word: חֲצִי עַם יִשְׂרָאֵל
  choice: separuh rakyat Israel
  rationale: Terjemahan ini mempertahankan keterangan kuantitatif serta pembedaan politis antara Yehuda dan Israel tanpa menafsirkannya lebih jauh.
