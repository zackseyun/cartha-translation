base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/030.yaml
  text: 'Then the king said to him[b][a], “Why do you keep speaking of your affairs? I have decided: you and Ziba shall divide the land.”'
translation:
  language: id
  text: Lalu raja berkata kepadanya, “Mengapa engkau masih membicarakan urusanmu? Aku telah memutuskan:[a] engkau dan Ziba harus membagi tanah itu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Aku berkata.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ladang itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya sebab diterjemahkan secara langsung dan wajar.
- source_word: תְּדַבֵּר עוֹד
  choice: engkau masih membicarakan
  rationale: Gabungan bentuk imperfek dan עוֹד menyatakan tindakan berbicara yang berlanjut atau lebih lanjut; “masih membicarakan” mempertahankan nuansa ketidaksabaran raja tanpa berlebihan.
- source_word: דְּבָרֶיךָ
  choice: urusanmu
  rationale: דָּבָר dapat berarti perkataan, perkara, atau urusan. Dalam konteks sengketa ini, “urusanmu” cukup luas dan tidak terlalu melegalkan maknanya seperti “perkaramu”.
- source_word: אָמַרְתִּי
  choice: Aku telah memutuskan
  rationale: Secara harfiah berarti “aku telah berkata,” tetapi di sini perkataan raja berfungsi sebagai putusan yang berwenang. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: אַתָּה וְצִיבָא
  choice: engkau dan Ziba
  rationale: Pronomina eksplisit dipertahankan, dan nama צִיבָא ditransliterasikan menurut bentuk Indonesia yang lazim, “Ziba”.
- source_word: תַּחְלְקוּ
  choice: harus membagi
  rationale: Bentuk imperfek dalam keputusan raja menyatakan arahan yang berwenang; “harus” menyampaikan daya perintah itu secara alami.
- source_word: הַשָּׂדֶה
  choice: tanah itu
  rationale: שָׂדֶה secara leksikal dapat berarti ladang, tetapi dalam sengketa milik ini menunjuk pada tanah atau harta pertanahan. Catatan kaki mencatat padanan yang lebih harfiah.
