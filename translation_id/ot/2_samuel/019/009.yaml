  text: וַ/יָּ֥קָם הַ/מֶּ֖לֶךְ וַ/יֵּ֣שֶׁב בַּ/שָּׁ֑עַר וּֽ/לְ/כָל הָ/עָ֞ם הִגִּ֣ידוּ לֵ/אמֹ֗ר הִנֵּ֤ה הַ/מֶּ֨לֶךְ֙ יוֹשֵׁ֣ב בַּ/שַּׁ֔עַר וַ/יָּבֹ֤א כָל הָ/עָם֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/יִשְׂרָאֵ֔ל נָ֖ס אִ֥ישׁ לְ/אֹהָלָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/009.yaml
  text: Then the king arose and sat in the gate[a]. And they told all the people, saying, “Look, the king is sitting in the gate.” Then all the people came before the king. But Israel had fled[b], each man to his tent.
translation:
  language: id
  text: Raja pun bangkit lalu duduk di pintu gerbang[a]. Kepada seluruh rakyat diberitahukan, “Lihat, raja sedang duduk di pintu gerbang.” Maka seluruh rakyat datang menghadap raja. Sementara itu,[b] orang Israel telah melarikan diri, masing-masing ke kemahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pintu gerbang kota pada zaman itu juga merupakan tempat berkumpul dan menjalankan urusan publik.
    reason: cultural_note
  - marker: b
    text: 'Atau: “Dan orang Israel melarikan diri” atau “Tetapi orang Israel telah melarikan diri.” Kata penghubung Ibrani dapat dipahami sebagai sambungan biasa ataupun sebagai peralihan yang bernuansa kontras.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “masing-masing ke kemahnya,” sebuah ungkapan untuk berpencar kembali ke tempat tinggal atau wilayah kelompoknya.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ
  choice: Raja pun bangkit
  rationale: Bentuk wayyiqtol dari קום melanjutkan rangkaian narasi. Partikel “pun” menyampaikan peralihan tindakan secara alami tanpa membuat hubungan sebab-akibat yang tidak dinyatakan.
- source_word: וַיֵּשֶׁב בַּשָּׁעַר
  choice: lalu duduk di pintu gerbang
  rationale: ישׁב berarti “duduk” dan בַּשַּׁעַר secara harfiah menunjuk lokasi di kawasan pintu gerbang, yang juga berfungsi sebagai ruang publik kota.
- source_word: וּלְכָל הָעָם הִגִּידוּ לֵאמֹר
  choice: Kepada seluruh rakyat diberitahukan
  rationale: Subjek jamak הִגִּידוּ tidak disebutkan identitasnya dan berfungsi secara tak tentu. Bentuk pasif bahasa Indonesia mengungkapkan hal itu dengan wajar; formula לֵאמֹר tidak perlu diterjemahkan tersendiri sebelum kutipan langsung.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian kepada keadaan yang sedang berlangsung; “Lihat” modern dan tetap mempertahankan daya serunya.
- source_word: יוֹשֵׁב
  choice: sedang duduk
  rationale: Partisipel menggambarkan keadaan raja yang sedang berlangsung dan dapat dilihat.
- source_word: וַיָּבֹא כָל הָעָם לִפְנֵי הַמֶּלֶךְ
  choice: Maka seluruh rakyat datang menghadap raja
  rationale: בוא לפני berarti datang ke hadapan seseorang. “Menghadap” merupakan padanan Indonesia yang alami dalam suasana audiensi publik tanpa menentukan tingkat formalitasnya secara berlebihan.
- source_word: וְיִשְׂרָאֵל נָס
  choice: Sementara itu, orang Israel telah melarikan diri
  rationale: Qatal נָס memberi latar keadaan yang telah terjadi terhadap adegan utama. וְ dapat menghubungkan klausa secara sederhana atau menandai peralihan/kontras; “Sementara itu” menjaga hubungan kontekstual tanpa memperkerasnya menjadi pertentangan mutlak.
- source_word: אִישׁ לְאֹהָלָיו
  choice: masing-masing ke kemahnya
  rationale: Ungkapan distributif maskulin tunggal secara harfiah berbicara tentang setiap orang menuju kemahnya. “Masing-masing” wajar dalam bahasa Indonesia, sedangkan “ke kemahnya” mempertahankan citra Ibrani dan idiom pembubaran.
theological_decisions:
- issue: Cakupan dan gender ungkapan distributif אִישׁ
  choice: masing-masing
  alternative: masing-masing orang laki-laki
  rationale: Dalam konstruksi distributif אִישׁ לְאֹהָלָיו, אִישׁ dapat berfungsi idiomatis sebagai “masing-masing” dalam kelompok yang disebut “Israel.” Bahasa Indonesia tidak memerlukan nomina bergender untuk mempertahankan fungsi distributifnya; konteks militer tetap terbuka tanpa menambahkan klaim bahwa hanya laki-laki yang dimaksud.
- issue: Hubungan klausa וְיִשְׂרָאֵל נָס dengan adegan sebelumnya
  choice: Sementara itu, orang Israel telah melarikan diri
  alternative: Dan orang Israel melarikan diri / Tetapi orang Israel telah melarikan diri
  rationale: Konjungsi וְ sendiri tidak menetapkan secara tegas apakah hubungannya aditif, temporal, atau kontras. Terjemahan utama menampilkan klausa sebagai informasi latar, sementara catatan mempertahankan kemungkinan pembacaan lain.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif dipertahankan tanpa kekakuan harfiah. “Rakyat” menerjemahkan הָעָם secara konsisten dalam adegan ini, sedangkan “orang Israel” membedakan kelompok yang telah tercerai-berai. Kutipan langsung dibuat alami dengan menghilangkan padanan mekanis bagi formula לֵאמֹר.
