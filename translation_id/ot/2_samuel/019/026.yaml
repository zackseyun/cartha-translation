id: 2SA.19.26
reference: 2 Samuel 19:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֛י כִּי בָ֥א יְרוּשָׁלִַ֖ם לִ/קְרַ֣את הַ/מֶּ֑לֶךְ וַ/יֹּ֤אמֶר ל/וֹ֙ הַ/מֶּ֔לֶךְ לָ֛/מָּה לֹא הָלַ֥כְתָּ עִמִּ֖/י מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/026.yaml
  text: And when he came to Jerusalem to meet the king[a], the king said to him, “Why did you not go with me, Mephibosheth?”
translation:
  language: id
  text: Ketika ia tiba di Yerusalem untuk menemui raja, raja berkata kepadanya, “Mengapa engkau tidak pergi bersamaku[a], Mefiboset?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “ikut bersamaku.” Kata Ibrani secara harfiah berarti “pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Rumus naratif ini membuka adegan baru dengan hubungan waktu. Dalam bahasa Indonesia, “Ketika” menyampaikan peralihan itu secara alami tanpa ungkapan kaku “dan terjadilah ketika”.
- source_word: בָא
  choice: ia tiba
  rationale: בוא berarti datang atau masuk; dalam konteks perjalanan menuju Yerusalem, “tiba” terdengar alami dan menyatakan sampainya tokoh tersebut.
- source_word: יְרוּשָׁלַם
  choice: Yerusalem
  rationale: Bentuk baku nama tempat ini dalam bahasa Indonesia.
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Ungkapan לקראת menyatakan gerak untuk bertemu seseorang; “untuk menemui” paling wajar dalam konteks ini.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Gelar definit yang merujuk kepada Daud dalam konteks; bahasa Indonesia tidak memakai kata sandang definit tersendiri.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: raja berkata kepadanya
  rationale: Mempertahankan verba umum אמר sebagai “berkata” dan mengungkapkan subjek “raja” secara jelas sesuai teks Ibrani.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya yang menanyakan alasan.
- source_word: לֹא הָלַכְתָּ עִמִּי
  choice: engkau tidak pergi bersamaku
  rationale: Mempertahankan arti dasar הלך, yaitu “pergi,” serta sudut pandang keberangkatan Daud. Alternatif idiomatis dicatat dalam catatan kaki.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Bentuk nama pribadi yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan “raja” yang menjaga kejelasan subjek. Sapaan “engkau” dipakai karena sesuai dengan dialog naratif Alkitab dan tetap mudah dipahami.
