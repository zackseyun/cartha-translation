base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/019.yaml
  text: The ferryboat crossed over to bring the king’s household across and to do what was good in his sight[c][b][a], and Shimei son of Gera fell before the king as he was crossing the Jordan.
translation:
  language: id
  text: Perahu penyeberangan itu menyeberang untuk membawa seisi rumah tangga raja ke seberang[b] dan melakukan apa yang baik di mata raja.[c] Ketika raja menyeberangi Sungai Yordan, Simei anak Gera menjatuhkan diri di hadapan raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jatuh di hadapan raja”; maksudnya Simei merendahkan diri di hadapan raja.'
    reason: lexical_alternative
  - marker: b
    text: “Seisi rumah tangga raja” mengacu pada orang-orang dalam keluarga atau rombongan kerajaan, bukan pada bangunan istana.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “melakukan yang baik di matanya,” yaitu melakukan apa yang dianggap baik atau berkenan oleh raja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲבָרָה
  choice: perahu penyeberangan
  rationale: Nomina ini menunjuk pada sarana untuk menyeberangi sungai; 'perahu penyeberangan' konkret, alami, dan tidak mengandaikan bentuk kapal yang lebih khusus.
- source_word: וְעָבְרָה
  choice: menyeberang
  rationale: Bentuk perfektum feminin tunggal sesuai dengan הָעֲבָרָה. Kala lampau dipahami dari konteks narasi dan tidak perlu ditandai secara khusus dalam bahasa Indonesia.
- source_word: לַעֲבִיר אֶת בֵּית הַמֶּלֶךְ
  choice: untuk membawa seisi rumah tangga raja ke seberang
  rationale: Hifil לַעֲבִיר menyatakan tindakan membuat atau membawa menyeberang, sedangkan בֵּית הַמֶּלֶךְ dalam konteks ini menunjuk pada orang-orang dalam rumah tangga atau rombongan raja, bukan bangunan istana.
- source_word: וְלַעֲשׂוֹת הַטּוֹב בְּעֵינָיו
  choice: dan melakukan apa yang baik di mata raja
  rationale: Terjemahan ini mempertahankan idiom Ibrani dan ambiguitas mengenai tindakan yang dianggap baik atau berkenan, sambil memperjelas bahwa pronomina merujuk kepada raja.
- source_word: נָפַל לִפְנֵי הַמֶּלֶךְ
  choice: sujud di hadapannya
  rationale: Ungkapan ini menggambarkan tindakan merendahkan diri atau memohon di hadapan raja. 'Sujud' menyampaikan postur dan fungsi pragmatisnya secara alami dalam bahasa Indonesia.
- source_word: בְּעָבְרוֹ בַּיַּרְדֵּן
  choice: ketika raja menyeberangi Sungai Yordan
  rationale: Infinitif dengan sufiks orang ketiga maskulin tunggal memiliki fungsi temporal. Acuan terdekat yang masuk akal ialah raja; kata 'raja' diulang agar rujukannya jelas dalam bahasa Indonesia.
