  yaml_path: translation/ot/2_samuel/019/039.yaml
  text: Then the king said[a], “Let Kimham cross over with me, and I will do for him what seems good in your eyes; and whatever you choose to lay on me, I will do for you.”
translation:
  language: id
  text: Lalu raja berkata, “Biarlah Kimham menyeberang bersama aku. Aku akan melakukan untuknya apa yang baik menurut pandanganmu. Apa pun yang kaukehendaki dariku[a], akan kulakukan untukmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “apa pun yang kaupilih atas aku.” Ungkapan Ibrani ini agak eliptis dan juga dapat dipahami, “apa pun yang kauminta dariku, akan kulakukan untukmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Waw-konsekutif melanjutkan alur cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אִתִּי יַעֲבֹר כִּמְהָם
  choice: Biarlah Kimham menyeberang bersama aku
  rationale: Bentuk imperfek berfungsi sebagai jusif, yaitu keputusan atau undangan raja. “Menyeberang” mempertahankan kosakata עבר dalam konteks penyeberangan Sungai Yordan.
- source_word: כִּמְהָם
  choice: Kimham
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: וַאֲנִי אֶעֱשֶׂה לוֹ
  choice: Aku akan melakukan baginya
  rationale: Kata עשה bersifat luas. Rumusan ini tidak mempersempit tindakan raja menjadi jenis bantuan tertentu.
- source_word: אֶת הַטּוֹב בְּעֵינֶיךָ
  choice: apa yang baik menurut pandanganmu
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan apa yang baik “di matamu”; bentuk Indonesia ini mempertahankan unsur penilaian tanpa terdengar kaku.
- source_word: וְכֹל אֲשֶׁר תִּבְחַר עָלַי
  choice: Apa pun yang kaukehendaki dariku
  rationale: Konstruksi בחר dengan עָלַי bersifat eliptis. Terjemahan ini menyampaikan tawaran Daud untuk memenuhi pilihan atau permintaan Barzilai, sementara ketidakharfiahan konstruksinya dijelaskan dalam catatan kaki.
- source_word: אֶעֱשֶׂה לָּךְ
  choice: akan kulakukan untukmu
  rationale: Menjaga janji pribadi raja kepada Barzilai dan menghasilkan susunan Indonesia yang alami.
