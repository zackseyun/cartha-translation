translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog memakai 'kalian' karena para tua-tua disapa sebagai kelompok. Pengulangan gagasan 'kediaman' dipertahankan, tetapi variasi 'istana/kediaman' dipakai agar alami dan tetap sesuai dengan keluasan makna בַּיִת.
