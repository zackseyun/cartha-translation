  text: וְ/הַ/מֶּ֣לֶךְ דָּוִ֗ד שָׁ֠לַח אֶל צָד֨וֹק וְ/אֶל אֶבְיָתָ֥ר הַ/כֹּהֲנִים֮ לֵ/אמֹר֒ דַּבְּר֞וּ אֶל זִקְנֵ֤י יְהוּדָה֙ לֵ/אמֹ֔ר לָ֤/מָּה תִֽהְיוּ֙ אַֽחֲרֹנִ֔ים לְ/הָשִׁ֥יב אֶת הַ/מֶּ֖לֶךְ אֶל בֵּית֑/וֹ וּ/דְבַר֙ כָּל יִשְׂרָאֵ֔ל בָּ֥א אֶל הַ/מֶּ֖לֶךְ אֶל בֵּיתֽ/וֹ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/012.yaml
  text: And King David sent to Zadok and to Abiathar the priests[a], saying, “Speak to the elders of Judah, saying, ‘Why should you be the last to bring the king back to his house, when the word of all Israel has come to the king, to his house?’”
translation:
  language: id
  text: Raja Daud mengirim pesan kepada Zadok dan Abyatar, para imam itu, demikian, “Berbicaralah kepada para tua-tua Yehuda dengan mengatakan, ‘Mengapa kalian menjadi yang terakhir membawa raja kembali ke rumahnya, padahal pesan seluruh Israel telah sampai kepada raja di rumahnya?[a]’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “padahal perkataan seluruh Israel telah sampai kepada raja di rumahnya.” Frasa Ibrani yang secara harfiah berarti “perkataan seluruh Israel” dapat menunjuk pada pesan, usul, seruan, atau kabar agar Daud dibawa kembali. Ungkapan “di rumahnya” menerjemahkan frasa yang secara harfiah berbunyi “ke rumahnya”; dalam konteks ini maksudnya kemungkinan pesan itu telah mencapai raja di kediamannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח אֶל
  choice: mengutus orang kepada
  rationale: Dalam konteks penyampaian pesan, frasa ini menunjukkan bahwa Daud mengirim utusan kepada Zadok dan Abyatar; ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ia memanggil mereka.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan gelar dan nama ini merupakan bentuk Indonesia yang alami bagi frasa Ibrani tersebut.
- source_word: הַכֹּהֲנִים
  choice: para imam itu
  rationale: Bentuk jamak dengan artikel menunjuk kepada Zadok dan Abyatar serta menyatakan jabatan mereka.
- source_word: דַּבְּרוּ אֶל
  choice: Berbicaralah kepada
  rationale: Mempertahankan bentuk perintah langsung dan relasi yang ditandai oleh אֶל tanpa mengubahnya menjadi kata kerja yang lebih interpretatif.
- source_word: זִקְנֵי יְהוּדָה
  choice: para tua-tua Yehuda
  rationale: Istilah baku dan mudah dipahami untuk para pemimpin komunitas atau politik Yehuda.
- source_word: לָמָּה תִהְיוּ אַחֲרֹנִים
  choice: Mengapa kalian menjadi yang terakhir
  rationale: Menyampaikan tantangan retoris dari bentuk imperfek Ibrani secara alami tanpa memaksakan nuansa waktu yang terlalu sempit.
- source_word: לְהָשִׁיב
  choice: membawa ... kembali
  rationale: Bentuk hifil dari שוב bersifat kausatif; dalam konteks ini Yehuda diminta membawa atau mengantar Daud kembali.
- source_word: אֶת הַמֶּלֶךְ אֶל בֵּיתוֹ
  choice: membawa raja kembali ke istananya
  rationale: בַּיִת dapat berarti rumah atau kediaman kerajaan. Karena subjeknya raja dan konteksnya pemulihan pemerintahan, 'istananya' terdengar alami, meski tidak dimaksudkan untuk menentukan bangunan tertentu.
- source_word: וּדְבַר כָּל יִשְׂרָאֵל
  choice: padahal pesan seluruh Israel
  rationale: דָּבָר luas maknanya, tetapi 'pesan' alami dalam konteks sesuatu yang sampai kepada raja; catatan kaki mempertahankan kemungkinan 'usul', 'seruan', atau 'kabar'.
- source_word: בָּא אֶל הַמֶּלֶךְ
  choice: telah sampai kepada raja
  rationale: Bentuk perfektif menunjukkan bahwa pesan tersebut sudah mencapai Daud; 'telah sampai' merupakan ungkapan Indonesia yang idiomatis.
- source_word: אֶל בֵּיתוֹ
  choice: di kediamannya
  rationale: Walau preposisinya secara harfiah berarti 'ke', dalam konteks tibanya pesan frasa tersebut wajar dipahami sebagai lokasi raja ketika pesan itu mencapainya. 'Kediaman' menjaga keluasan makna בַּיִת.
