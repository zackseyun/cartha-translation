- from: Kalian adalah saudara-saudaraku[a]; kalian adalah tulang dan dagingku sendiri[b]. Jadi, mengapa kalian menjadi pihak terakhir yang membawa pulang raja[c]?
  to: Kalian adalah saudara-saudaraku[a]; kalian adalah tulangku dan dagingku[b]. Jadi, mengapa kalian harus menjadi yang terakhir untuk membawa raja kembali[c]?
  rationale: Revisi mempertahankan sapaan jamak, metafora kekerabatan, hubungan inferensial, dan penyebutan “raja” dalam orang ketiga. Padanan untuk לְהָשִׁיב diubah menjadi “membawa raja kembali” agar makna kausatif ‘membuat kembali’ tetap jelas tanpa nuansa tambahan dari “pulang”; bentuk pertanyaan retoris juga dibuat lebih mendesak secara alami.
