  text: You are my brothers[a]; you are my own bone and flesh[c][b]. So why should you be the last to bring back the king?
translation:
  language: id
  text: Kalian adalah saudara-saudaraku[a]; kalian adalah tulangku dan dagingku[b]. Jadi, mengapa kalian harus menjadi yang terakhir untuk membawa raja kembali[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut maksud ungkapannya, “kaum kerabatku”; secara harfiah, “saudara-saudaraku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tulangku dan dagingku,” sebuah ungkapan Ibrani untuk hubungan darah atau kekerabatan yang dekat.
    reason: cultural_note
  - marker: c
    text: Daud menyebut dirinya sendiri dengan sebutan orang ketiga, yaitu “raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Secara harfiah berarti ‘saudara-saudaraku’. Dalam konteks ini, sapaan tersebut menyatakan hubungan kekerabatan Daud dengan orang-orang Yehuda; bentuk konkret sumber dipertahankan.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: tulang dan dagingku sendiri
  rationale: Ungkapan konkret Ibrani ini menyatakan hubungan darah atau kekerabatan yang sangat dekat. Kata ‘sendiri’ menegaskan unsur kepunyaan tanpa menghilangkan metafora sumber.
- source_word: וְלָמָה
  choice: Jadi, mengapa
  rationale: Kata penghubung dan kata tanya ini memperkenalkan seruan yang disimpulkan dari pernyataan kekerabatan sebelumnya; ‘Jadi, mengapa’ menyampaikan hubungan logis itu secara alami.
- source_word: תִּהְיוּ אַחֲרֹנִים
  choice: kalian menjadi pihak terakhir
  rationale: Bentuk imperfek dipakai dalam pertanyaan retoris yang mendesak mereka bertindak, bukan sekadar meramalkan. ‘Pihak terakhir’ memperjelas bahwa kelompok Yehuda dibandingkan dengan pihak-pihak lain.
- source_word: לְהָשִׁיב
  choice: membawa pulang
  rationale: Bentuk Hifil dari שוב berarti menyebabkan seseorang kembali. Dengan raja sebagai objek, ‘membawa pulang’ menyampaikan gerakan kembali secara langsung dan wajar.
- source_word: אֶת־הַמֶּלֶךְ
  choice: raja
  rationale: Bahasa Ibrani memakai orang ketiga, meskipun yang berbicara adalah Daud sendiri. Terjemahan mempertahankan bentuk retoris sumber.
