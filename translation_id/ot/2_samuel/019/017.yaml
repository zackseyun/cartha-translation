  text: וַ/יְמַהֵ֗ר שִׁמְעִ֤י בֶן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אֲשֶׁ֖ר מִ/בַּֽחוּרִ֑ים וַ/יֵּ֨רֶד֙ עִם אִ֣ישׁ יְהוּדָ֔ה לִ/קְרַ֖את הַ/מֶּ֥לֶךְ דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/017.yaml
  text: Shimei son of Gera[a], the Benjaminite from Bahurim, hurried and went down with the men of Judah to meet King David.
translation:
  language: id
  text: Simei anak Gera, orang Benyamin dari Bahurim, bergegas turun bersama orang-orang Yehuda[a] untuk menemui Raja Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bersama orang Yehuda”; bentuk tunggal itu dipahami secara kolektif di sini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: bergegas
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan dengan segera atau tergesa; “bergegas” alami dalam narasi Indonesia dan mempertahankan nuansa urgensinya.
- source_word: שִׁמְעִי בֶן גֵּרָא
  choice: Simei anak Gera
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan “anak” mempertahankan konstruksi patronimik Ibrani.
- source_word: בֶּן הַיְמִינִי
  choice: orang Benyamin
  rationale: Dalam konteks ini ungkapan tersebut menunjukkan asal suku Simei. “Orang Benyamin” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: אֲשֶׁר מִבַּחוּרִים
  choice: dari Bahurim
  rationale: Frasa relatif ini menyatakan tempat asal Simei; bentuk ringkas “dari Bahurim” mempertahankan maknanya secara alami.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ini secara konkret menyatakan gerakan turun, kemungkinan berkaitan dengan keadaan geografis; terjemahan mempertahankan gambaran tersebut.
- source_word: עִם אִישׁ יְהוּדָה
  choice: bersama orang-orang Yehuda
  rationale: Walaupun אִישׁ berbentuk tunggal, dalam ungkapan ini kata tersebut dipahami secara kolektif. Bentuk jamak merupakan cara paling alami untuk menyatakannya dalam bahasa Indonesia.
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Infinitif ini menyatakan tujuan gerakan menuju suatu perjumpaan; “untuk menemui” langsung dan sesuai dengan konteks.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Penempatan gelar sebelum nama sesuai dengan tata bahasa Indonesia serta mempertahankan gelar dan nama tokohnya.
