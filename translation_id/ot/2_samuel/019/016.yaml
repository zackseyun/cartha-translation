base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/016.yaml
  text: Then the king returned and came as far as the Jordan[a], and Judah came to Gilgal to go to meet the king, to bring the king across the Jordan.
translation:
  language: id
  text: Lalu raja kembali dan sampai di Sungai Yordan, dan orang Yehuda telah datang ke Gilgal untuk pergi menyambut raja dan menyeberangkan raja melintasi Sungai Yordan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk wayyiqtol dari שוב melanjutkan narasi dan dalam konteks ini menyatakan kepulangan Daud setelah pelariannya.
- source_word: וַיָּבֹא עַד הַיַּרְדֵּן
  choice: tiba di tepi Sungai Yordan
  rationale: בוא dengan עַד menyatakan gerak sampai pada batas atau lokasi. 'Di tepi' secara alami menunjukkan bahwa raja mencapai sungai tetapi belum menyeberanginya.
- source_word: וִיהוּדָה
  choice: orang-orang Yehuda
  rationale: Nama Yehuda dipakai secara kolektif untuk suku atau rakyat Yehuda; pengungkapan eksplisit ini lebih jelas dan alami dalam bahasa Indonesia.
- source_word: בָּא
  choice: telah datang
  rationale: Bentuk qatal sesudah rangkaian wayyiqtol dapat menyajikan keadaan latar atau kedatangan yang telah berlangsung pada titik narasi tersebut.
- source_word: הַגִּלְגָּלָה
  choice: ke Gilgal
  rationale: Akhiran he direktif pada nama tempat menunjukkan gerak menuju Gilgal.
- source_word: לָלֶכֶת לִקְרַאת
  choice: untuk pergi menyambut
  rationale: Terjemahan ini mempertahankan kedua unsur verba tujuan dan memakai ungkapan Indonesia yang wajar bagi tindakan pergi menemui kedatangan seorang raja.
- source_word: לְהַעֲבִיר אֶת־הַמֶּלֶךְ אֶת־הַיַּרְדֵּן
  choice: membantu raja menyeberangi Sungai Yordan
  rationale: Bentuk Hifil dari עבר berarti menyebabkan atau memungkinkan seseorang menyeberang. 'Membantu ... menyeberangi' mempertahankan makna kausatif tanpa menentukan sarana seperti perahu atau rakit.
