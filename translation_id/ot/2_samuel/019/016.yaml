  source_fidelity: Terjemahan mempertahankan urutan dasar dan fungsi latar dari qatal בָּא melalui "telah datang." Namun, "sedangkan" cenderung menyiratkan pertentangan yang tidak dinyatakan teks, dan "membantu raja menyeberangi" lebih lemah daripada Hifil הַעֲבִיר, yang menyatakan menyebabkan/mengusahakan raja menyeberang.
  naturalness: Bahasa umumnya modern dan jelas. Koordinasi sederhana dengan "dan" lebih alami dan setia daripada konjungsi kontrasif "sedangkan." "Menyeberangkan raja" adalah ungkapan Indonesia yang wajar dan tidak menentukan sarana penyeberangan.
  terminology: '"Raja," "orang Yehuda," "Gilgal," dan "Sungai Yordan" sesuai dan konsisten. "Orang Yehuda" secara wajar mengungkapkan penggunaan kolektif יהודה bagi kelompok/suku Yehuda.'
