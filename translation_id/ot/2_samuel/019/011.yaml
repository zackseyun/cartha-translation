base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/011.yaml
  text: And Absalom[a], whom we anointed over us, died in battle. So now why are you silent about bringing the king back?
translation:
  language: id
  text: Dan Absalom, yang telah kita urapi menjadi raja atas kita, telah mati dalam pertempuran. Jadi sekarang, mengapa kalian diam saja tentang mengembalikan raja?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengapa kalian diam saja tentang memulihkan raja?”'
    reason: Alternatif menerjemahkan הָשִׁיב dalam arti “memulihkan,” tanpa menambahkan konsep “kedudukan” yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama ini melanjutkan perkataan yang sedang dikutip. Konjungsi waw tidak perlu diterjemahkan secara tersendiri karena hubungan dengan kalimat sebelumnya sudah wajar dalam bahasa Indonesia.
- source_word: מָשַׁחְנוּ עָלֵינוּ
  choice: yang telah kita urapi untuk memerintah atas kita
  rationale: Kata מָשַׁח dipertahankan sebagai 'urapi' karena menunjuk pada tindakan penetapan raja. Tambahan 'untuk memerintah' mengungkapkan fungsi frasa עָלֵינוּ secara alami tanpa menghapus bobot politis-religius pengurapan.
- source_word: מֵת בַּמִּלְחָמָה
  choice: sudah tewas dalam pertempuran
  rationale: '''Tewas'' secara alami menyatakan kematian dalam konflik bersenjata, sedangkan ''sudah'' menunjukkan peristiwa yang telah selesai dan masih relevan bagi keadaan sekarang.'
- source_word: וְ/עַתָּה
  choice: Jadi sekarang
  rationale: Ungkapan ini menghubungkan kematian Absalom dengan konsekuensi praktis yang segera ditanyakan.
- source_word: מַחֲרִשִׁים
  choice: tetap diam
  rationale: Bentuk ini menyatakan sikap berdiam diri atau tidak bersuara. 'Tetap diam' mempertahankan teguran terhadap kelambanan mereka tanpa menggantinya dengan kata yang lebih interpretatif seperti 'ragu-ragu'.
- source_word: לְ/הָשִׁיב אֶת הַמֶּלֶךְ
  choice: mengenai membawa raja kembali
  rationale: Bentuk kausatif שׁוּב secara konkret berarti membuat seseorang kembali atau membawanya kembali. 'Mengenai' membuat hubungan dengan 'tetap diam' dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penggunaan kata pengurapan bagi Absalom
  choice: kita urapi untuk memerintah atas kita
  alternative: kita jadikan raja atas kita
  rationale: Walaupun Absalom tampil sebagai perebut takhta dalam alur kisah, teks memakai kata baku untuk 'mengurapi'. Mempertahankannya menghindari penilaian teologis tambahan dan menjaga ketegangan naratif.
- issue: Makna membawa raja kembali
  choice: membawa raja kembali
  alternative: memulihkan kedudukan raja
  rationale: Ungkapan utama mempertahankan gambaran konkret tentang kepulangan Daud, sedangkan catatan kaki mengakui bahwa dalam konteks kerajaan tindakan itu juga dapat berarti pemulihan kedudukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kita' mencakup pembicara dan orang-orang yang dahulu mengurapi Absalom; 'kalian' menyatakan orang kedua jamak secara jelas.
