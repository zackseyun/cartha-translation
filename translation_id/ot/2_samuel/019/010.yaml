  text: וַ/יְהִ֤י כָל הָ/עָם֙ נָד֔וֹן בְּ/כָל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מֶּ֜לֶךְ הִצִּילָ֣/נוּ מִ/כַּ֣ף אֹיְבֵ֗י/נוּ וְ/ה֤וּא מִלְּטָ֨/נוּ֙ מִ/כַּ֣ף פְּלִשְׁתִּ֔ים וְ/עַתָּ֛ה בָּרַ֥ח מִן הָ/אָ֖רֶץ מֵ/עַ֥ל אַבְשָׁלֽוֹם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/010.yaml
  text: And all the people were disputing throughout all the tribes of Israel[a], saying, “The king delivered us from the hand of our enemies, and he rescued us from the hand of the Philistines[c][b], but now he has fled from the land because of Absalom.”
translation:
  language: id
  text: Seluruh rakyat di semua suku Israel sedang berselisih pendapat[a]. Mereka berkata, “Raja telah membebaskan kita dari tangan musuh-musuh kita dan menyelamatkan kita dari tangan orang Filistin[b]. Namun sekarang ia telah melarikan diri dari negeri ini karena Absalom[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berdebat” atau “berada dalam perselisihan.” Bahasa Ibrani menunjukkan pertentangan atau perundingan yang meluas di antara suku-suku, bukan sekadar percakapan biasa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tangan musuh-musuh kita” dan “dari tangan orang Filistin.” Dalam bahasa Ibrani, “tangan” dapat berarti kuasa atau kendali seseorang.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “menjauh dari hadapan Absalom” atau “oleh karena Absalom.” Ungkapan Ibrani itu dapat menyatakan bahwa raja melarikan diri dari Absalom atau karena tekanan darinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָדוֹן
  choice: berselisih pendapat
  rationale: Partisipel Nifal ini menggambarkan perdebatan atau perselisihan yang sedang berlangsung. Ungkapan ini lebih kuat daripada sekadar ‘berdiskusi’, tetapi tetap alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: di kalangan semua suku Israel
  rationale: Frasa ini menyatakan bahwa perselisihan tersebut tersebar di seluruh komunitas suku Israel.
- source_word: הִצִּילָנוּ
  choice: telah membebaskan kita
  rationale: Kata kerja ini menyatakan pelepasan dari bahaya atau kuasa lawan. ‘Membebaskan’ cocok dengan konteks politik-militer dan membedakannya dari kata kerja berikutnya.
- source_word: מִכַּף אֹיְבֵינוּ
  choice: dari tangan musuh-musuh kita
  rationale: Metafora Ibrani ‘tangan’ bagi kuasa atau kendali dipertahankan karena dapat dipahami dalam bahasa Indonesia dan menjaga kesejajaran teks.
- source_word: מִלְּטָנוּ
  choice: menyelamatkan kita
  rationale: Pilihan ini menyampaikan tindakan meluputkan dari bahaya sambil mempertahankan perbedaan kosakata dengan הִצִּילָנוּ.
- source_word: מִכַּף פְּלִשְׁתִּים
  choice: dari tangan orang Filistin
  rationale: Metafora yang sama dipertahankan agar paralelisme Ibrani tetap terlihat.
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Dalam konteks ini penghubung tersebut menandai pertentangan antara pertolongan raja pada masa lalu dan pelariannya sekarang.
- source_word: בָּרַח
  choice: telah melarikan diri
  rationale: Bentuk perfek menyatakan tindakan yang sudah terjadi dan masih relevan terhadap keadaan sekarang.
- source_word: מִן הָאָרֶץ
  choice: dari negeri ini
  rationale: אֶרֶץ di sini menunjuk pada negeri atau wilayah, bukan bumi secara umum. ‘Negeri ini’ menyampaikan sudut pandang para penutur secara alami.
- source_word: מֵעַל אַבְשָׁלוֹם
  choice: karena Absalom
  rationale: Sesudah kata kerja ‘melarikan diri’, ungkapan ini menunjukkan bahwa Absalom menjadi penyebab atau tekanan yang membuat raja pergi. Terjemahan ini alami tanpa meniadakan nuansa menjauh dari hadapannya.
