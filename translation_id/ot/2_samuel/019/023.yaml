base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/023.yaml
  text: And David said[a], “What have I to do with you, sons of Zeruiah, that you should be an adversary to me today? Shall any man be put to death in Israel today? For do I not know that today I am king over Israel?”
translation:
  language: id
  text: Lalu Daud berkata, “Apa urusanku dengan kalian, hai anak-anak Zeruya, sehingga hari ini kalian menjadi lawanku[a]? Haruskah seseorang dihukum mati di Israel pada hari ini? Bukankah aku tahu bahwa pada hari ini akulah raja atas Israel?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebagai satan bagiku,” yaitu sebagai lawan atau penentang bagiku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי וְלָכֶם
  choice: Apa urusanku dengan kalian
  rationale: Ungkapan idiomatis Ibrani yang menyatakan penolakan atau teguran; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya retorisnya.
- source_word: בְּנֵי צְרוּיָה
  choice: hai anak-anak Zeruya
  rationale: Sapaan konkret kepada keturunan laki-laki Zeruya dipertahankan, dengan 'hai' untuk menandai sapaan langsung secara wajar.
- source_word: כִּי תִהְיוּ לִי הַיּוֹם לְשָׂטָן
  choice: sehingga hari ini kalian menjadi lawanku
  rationale: שָׂטָן di sini merupakan nomina umum yang berarti lawan atau penentang, bukan nama diri. 'Menjadi lawanku' menyampaikan fungsi mereka sebagai penghalang terhadap keputusan Daud.
- source_word: יוּמַת אִישׁ
  choice: Haruskah seseorang dihukum mati
  rationale: Bentuk kausatif-pasif menunjuk pada pelaksanaan hukuman mati, bukan sekadar kematian; 'dihukum mati' mempertahankan nuansa yudisial.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun nomina Ibrani berbentuk maskulin tunggal, dalam konteks ini maknanya generik. 'Seseorang' merupakan padanan Indonesia yang alami tanpa mempersempit rujukan.
- source_word: הֲלוֹא יָדַעְתִּי
  choice: Bukankah aku tahu
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban afirmatif.
- source_word: מֶלֶךְ עַל יִשְׂרָאֵל
  choice: raja atas Israel
  rationale: Preposisi עַל secara langsung berarti 'atas' dan menekankan kewenangan pemerintahan Daud atas Israel.
theological_decisions:
- issue: Makna שָׂטָן
  choice: nomina umum 'lawan'
  alternative: nama diri 'Iblis' atau transliterasi 'Satan'
  rationale: Dalam konteks narasi ini, kata tersebut menyatakan orang yang menentang atau menghalangi Daud. Memakainya sebagai nama diri akan memasukkan gagasan demonologis yang tidak dituntut oleh konteks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'hai anak-anak Zeruya' mempertahankan ketegasan teguran Daud; pengulangan 'pada hari ini' mempertahankan penekanan temporal dalam teks Ibrani.
