  text: וַ/יַּ֣עַן אִֽישׁ יִשְׂרָאֵל֩ אֶת אִ֨ישׁ יְהוּדָ֜ה וַ/יֹּ֗אמֶר עֶֽשֶׂר יָד֨וֹת לִ֣/י בַ/מֶּלֶךְ֮ וְ/גַם בְּ/דָוִד֮ אֲנִ֣י מִמְּ/ךָ֒ וּ/מַדּ֨וּעַ֙ הֱקִלֹּתַ֔/נִי וְ/לֹא הָיָ֨ה דְבָרִ֥/י רִאשׁ֛וֹן לִ֖/י לְ/הָשִׁ֣יב אֶת מַלְכִּ֑/י וַ/יִּ֨קֶשׁ֙ דְּבַר אִ֣ישׁ יְהוּדָ֔ה מִ/דְּבַ֖ר אִ֥ישׁ יִשְׂרָאֵֽל־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/044.yaml
  text: Then the man of Israel answered the man of Judah and said[a], “I have ten shares in the king, and in David also I have more than you[d][c][b]. Why then did you treat me lightly? Was not my word first in bringing back my king?” But the word of the men of Judah was harsher than the word of the men of Israel.
translation:
  language: id
  text: Kemudian orang Israel itu menjawab orang Yehuda itu, “Dalam hal raja, aku mempunyai sepuluh bagian; bahkan dalam hal Daud pun hakku lebih besar daripada hakmu.[a] Mengapa kamu meremehkan aku? Bukankah aku yang pertama mengusulkan agar rajaku dibawa kembali?”[b] Namun perkataan orang-orang Yehuda lebih keras daripada perkataan orang-orang Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, klausa awal berbunyi, “Sepuluh tangan ada padaku dalam raja.” “Tangan” di sini berarti bagian atau andil, kemungkinan menunjuk pada tuntutan sepuluh suku utara. Klausa berikutnya juga eliptis dan dapat diterjemahkan, “Bahkan dalam hal Daud pun tuntutanku lebih besar daripada tuntutanmu.”
    reason: cultural_note
  - marker: b
    text: Atau, “Bukankah perkataanku yang lebih dahulu tentang membawa rajaku kembali?” Klausa Ibraninya sulit; maksud utamanya ialah bahwa Israel mengaku lebih dahulu memprakarsai kepulangan raja.
    reason: alternative_reading
  - marker: c
    text: Atau, “lebih kuat” atau “lebih sengit.” Kata Ibraninya dapat menggambarkan ucapan yang keras, tajam, atau berdaya tekan lebih besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל / אִישׁ יְהוּדָה
  choice: orang Israel itu / orang Yehuda itu
  rationale: Bentuk tunggal Ibrani dipertahankan sebagai penyebutan representatif bagi masing-masing kelompok. Pada ringkasan penutup, konteks kolektif dinyatakan secara wajar dengan bentuk jamak ‘orang-orang’.
- source_word: עֶשֶׂר יָדוֹת לִי בַמֶּלֶךְ
  choice: Dalam hal raja, aku mempunyai sepuluh bagian
  rationale: יָדוֹת secara harfiah berarti ‘tangan-tangan’, tetapi dalam ungkapan ini menunjuk pada bagian atau andil. Susunan Indonesia ini menyampaikan tuntutan sepuluh suku tanpa memakai ungkapan harfiah yang kabur.
- source_word: וְגַם בְּדָוִד אֲנִי מִמְּךָ
  choice: bahkan atas Daud pun hakku lebih besar daripada hakmu
  rationale: Klausa Ibrani bersifat eliptis. Perbandingannya dipahami sebagai hak atau tuntutan sehubungan dengan Daud, bukan pernyataan umum bahwa pembicara lebih unggul.
- source_word: הֱקִלֹּתַנִי
  choice: kamu meremehkan aku
  rationale: Bentuk Hifil dari קלל menyatakan perlakuan yang menganggap seseorang ringan, tidak penting, atau rendah. ‘Meremehkan’ alami dalam bahasa Indonesia dan tidak melebihkannya menjadi kebencian.
- source_word: וְלֹא הָיָה דְבָרִי רִאשׁוֹן לִי לְהָשִׁיב אֶת מַלְכִּי
  choice: Bukankah aku yang pertama mengusulkan agar rajaku dibawa kembali?
  rationale: Klausa ini sulit dan agak eliptis. דָבָר dapat berarti perkataan, perkara, atau usul; terjemahan memilih ‘mengusulkan’ untuk menyampaikan pokok tentang siapa yang lebih dahulu memprakarsai kepulangan raja.
- source_word: מַלְכִּי
  choice: rajaku
  rationale: Akhiran orang pertama tunggal dinyatakan secara eksplisit dalam bahasa Ibrani dan penting bagi penegasan kesetiaan serta tuntutan pembicara.
- source_word: וַיִּקֶשׁ דְּבַר אִישׁ יְהוּדָה מִדְּבַר אִישׁ יִשְׂרָאֵל
  choice: perkataan orang-orang Yehuda lebih keras daripada perkataan orang-orang Israel
  rationale: קשׁה di sini menggambarkan keras atau sengitnya ucapan. Bentuk kolektif אִישׁ diterjemahkan dengan bentuk jamak pada ringkasan narator agar maknanya jelas dan alami.
