  text: לְ/אַֽהֲבָה֙ אֶת שֹׂ֣נְאֶ֔י/ךָ וְ/לִ/שְׂנֹ֖א אֶת אֹהֲבֶ֑י/ךָ כִּ֣י הִגַּ֣דְתָּ הַ/יּ֗וֹם כִּ֣י אֵ֤ין לְ/ךָ֙ שָׂרִ֣ים וַ/עֲבָדִ֔ים כִּ֣י יָדַ֣עְתִּי הַ/יּ֗וֹם כִּ֠י לא אַבְשָׁל֥וֹם חַי֙ וְ/כֻלָּ֤/נוּ הַ/יּוֹם֙ מֵתִ֔ים כִּי אָ֖ז יָשָׁ֥ר בְּ/עֵינֶֽי/ךָ־־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/007.yaml
  text: to love those who hate you and to hate those who love you[a]. For you have made it clear today that commanders and servants mean nothing to you; for I know today that if Absalom were alive and all of us were dead today[b], then it would be right in your eyes.
translation:
  language: id
  text: dengan mengasihi orang-orang yang membenci Tuanku dan membenci orang-orang yang mengasihi Tuanku. Hari ini Tuanku telah menunjukkan bahwa para panglima dan hamba tidak berarti apa-apa bagi Tuanku.[a] Sebab, hari ini saya tahu bahwa seandainya Absalom hidup dan kami semua mati hari ini,[b] hal itu akan benar di mata Tuanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “hari ini Tuanku telah menyatakan bahwa bagi Tuanku tidak ada panglima dan hamba.” Ungkapan Ibrani ini berarti bahwa mereka sama sekali tidak diperhitungkan oleh Tuanku.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sekiranya saja Absalom hidup dan kami semua mati hari ini.” Perkataan Yoab merupakan tuduhan kontrafaktual yang tajam, bukan laporan harfiah tentang perkataan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: לְאַהֲבָה אֶת שֹׂנְאֶיךָ
  choice: dengan mengasihi orang-orang yang membenci Tuanku
  rationale: Infinitif dengan ל melanjutkan tuduhan dari konteks sebelumnya. Bentuk “orang-orang yang membenci” mempertahankan daya verbal partisip Ibrani dan kontras retorisnya.
- source_word: וְלִשְׂנֹא אֶת אֹהֲבֶיךָ
  choice: dan membenci orang-orang yang mengasihi Tuanku
  rationale: Struktur sejajar dipertahankan agar antitesis tajam dalam teguran Yoab tetap terdengar.
- source_word: הִגַּדְתָּ
  choice: Tuanku telah menunjukkan
  rationale: Dalam konteks ini tindakan Daud, bukan sekadar ucapannya, menyatakan sikapnya. “Menunjukkan” menyampaikan daya kontekstual itu secara alami.
- source_word: שָׂרִים וַעֲבָדִים
  choice: para panglima dan hamba
  rationale: Dalam latar militer-kerajaan, שָׂרִים menunjuk para pemimpin militer, sedangkan עֲבָדִים mencakup orang-orang yang mengabdi kepada raja.
- source_word: אֵין לְךָ שָׂרִים וַעֲבָדִים
  choice: para panglima dan hamba tidak berarti apa-apa bagi Tuanku
  rationale: Ungkapan ini menyatakan bahwa mereka tidak diperhitungkan oleh Daud, bukan bahwa mereka secara harfiah tidak ada.
- source_word: יָדַעְתִּי
  choice: saya tahu
  rationale: Bentuk perfektif menyatakan kesimpulan Yoab pada saat berbicara; bentuk kini paling alami dalam bahasa Indonesia.
- source_word: לֹא אַבְשָׁלוֹם חַי וְכֻלָּנוּ הַיּוֹם מֵתִים
  choice: seandainya Absalom hidup dan kami semua mati hari ini
  rationale: 'Dalam konteks, susunan tersebut merupakan tuduhan kontrafaktual yang tajam: Daud seolah-olah lebih memilih Absalom tetap hidup sekalipun semua pengikut setianya mati.'
- source_word: יָשָׁר בְּעֵינֶיךָ
  choice: hal itu akan benar di mata Tuanku
  rationale: Terjemahan ini mempertahankan citra dan nuansa penilaian moral dalam idiom Ibrani, tanpa meratakannya menjadi sekadar “menyenangkan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Tuanku” dipakai karena Yoab sedang berbicara kepada raja; “saya” menjaga hubungan hormat itu. Ayat sengaja dimulai dengan “dengan” karena teks sumber merupakan kelanjutan sintaksis dari ayat sebelumnya.
