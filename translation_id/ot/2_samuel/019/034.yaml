base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/034.yaml
  text: And the king said to Barzillai[a], “You cross over with me, and I will provide for you with me in Jerusalem.”
translation:
  language: id
  text: Lalu raja berkata kepada Barzilai, “Menyeberanglah bersamaku, dan aku akan memeliharamu[a] bersamaku di Yerusalem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencukupi kebutuhanmu” atau “menyokongmu.” Kata kerja Ibrani ini berarti menyediakan apa yang dibutuhkan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan alurnya secara alami dalam bahasa Indonesia tanpa memberi penekanan temporal berlebihan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tertentu ini mengacu kepada raja dalam konteks, yaitu Daud; bahasa Indonesia tidak memakai kata sandang tertentu.
- source_word: אֶל בַּרְזִלָּי
  choice: kepada Barzilai
  rationale: Preposisi menandai pihak yang dituju oleh perkataan; nama diri ditransliterasikan secara lazim.
- source_word: אַתָּה עֲבֹר אִתִּי
  choice: Ikutlah menyeberang bersamaku
  rationale: עֲבֹר adalah imperatif ‘menyeberang’, dalam konteks perjalanan melintasi Sungai Yordan. Pronomina mandiri אַתָּה memberi penekanan pada Barzilai; “ikutlah” mengungkapkan ajakan langsung secara wajar sambil mempertahankan ‘bersamaku’.
- source_word: וְכִלְכַּלְתִּי אֹתְךָ
  choice: Aku akan menanggung kebutuhanmu
  rationale: Verba כלכל di sini menyatakan penyediaan atau pemeliharaan kebutuhan seseorang. Pilihan ini alami, konkret, dan tidak mempersempitnya hanya pada makanan.
- source_word: עִמָּדִי
  choice: di sisiku
  rationale: Ungkapan ini menunjukkan keberadaan Barzilai bersama raja. “Di sisiku” membedakannya secara alami dari אִתִּי sebelumnya, tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Preposisi ב menunjukkan lokasi, dan nama tempat memakai bentuk Indonesia yang baku.
