base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/033.yaml
  text: Barzillai was very old[a], eighty years old, and he had provided for the king during his stay in Mahanaim, for he was a very wealthy man.
translation:
  language: id
  text: Barzilai sangat tua, berumur delapan puluh tahun. Ia telah mencukupi kebutuhan raja selama raja tinggal di Mahanaim, sebab ia orang yang sangat kaya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang yang sangat terpandang” atau, secara lebih harfiah, “orang yang sangat besar.” Ungkapan Ibrani ini dapat menunjuk pada kekayaan, kedudukan, atau pengaruh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: sudah sangat tua
  rationale: Frasa ini bersifat predikatif dan menegaskan usia lanjut Barzilai. “Sudah sangat tua” alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: בֶּן שְׁמֹנִים שָׁנָה
  choice: berumur delapan puluh tahun
  rationale: Ungkapan Ibrani harfiah “anak delapan puluh tahun” diterjemahkan dengan idiom Indonesia yang wajar.
- source_word: כִלְכַּל אֶת הַמֶּלֶךְ
  choice: telah menyediakan kebutuhan raja
  rationale: Dalam konteks ini, כלכל menunjuk pada tindakan menopang atau mencukupi kebutuhan secara materi; pilihan ini menyatakan dukungan praktis tanpa membatasi bentuk bantuannya.
- source_word: בְּשִׁיבָתוֹ
  choice: selama raja tinggal
  rationale: ישב di sini berarti menetap atau tinggal. Penyebutan ulang “raja” memperjelas rujukan sufiks orang ketiga tanpa mengubah makna.
- source_word: בְמַחֲנַיִם
  choice: di Mahanaim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk sumber.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan yang menjelaskan kemampuan Barzilai mencukupi kebutuhan raja.
- source_word: אִישׁ גָּדוֹל הוּא מְאֹד
  choice: ia orang yang sangat kaya
  rationale: Secara harfiah ungkapan ini berarti “ia seorang yang sangat besar/penting.” Dalam konteks penyediaan kebutuhan raja, kekayaan merupakan makna yang paling mungkin, sementara keluasan semantiknya dicatat dalam catatan kaki.
