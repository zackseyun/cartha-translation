  text: וְ/הַ/מֶּ֨לֶךְ֙ לָאַ֣ט אֶת פָּנָ֔י/ו וַ/יִּזְעַ֥ק הַ/מֶּ֖לֶךְ ק֣וֹל גָּד֑וֹל בְּנִ/י֙ אַבְשָׁל֔וֹם אַבְשָׁל֖וֹם בְּנִ֥/י בְנִֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/019/005.yaml
  text: And the king covered his face[a], and the king cried out with a loud voice, “My son Absalom! Absalom, my son, my son!”
translation:
  language: id
  text: Lalu raja menutupi wajahnya[a] dan berseru dengan suara keras, “Anakku Absalom! Absalom, anakku, anakku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyelubungi wajahnya.” Kata kerja Ibrani ini menggambarkan tindakan menutupi wajah dalam dukacita.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאַט
  choice: menutupi
  rationale: Dalam konteks perkabungan, verba ini menyatakan tindakan menutup atau menyelubungi; “menutupi” alami dalam bahasa Indonesia dan tidak menentukan caranya secara berlebihan.
- source_word: פָּנָיו
  choice: wajahnya
  rationale: Dengan penanda objek langsung dan tindakan dalam konteks perkabungan, makna konkret “wajahnya” jelas dimaksudkan.
- source_word: וַיִּזְעַק
  choice: berseru
  rationale: Verba ini menyatakan seruan nyaring. “Berseru” mempertahankan kekuatan ungkapan tanpa menambahkan nuansa ratapan tertentu yang tidak dinyatakan secara eksplisit.
- source_word: קוֹל גָּדוֹל
  choice: dengan suara keras
  rationale: Ungkapan Ibrani harfiah “dengan suara besar” secara idiomatis berarti suara yang keras; bentuk frasa dan tekanannya tetap terpelihara.
- source_word: בְּנִי
  choice: anakku
  rationale: Nomina maskulin tunggal dengan sufiks orang pertama ini secara khusus menunjuk Absalom sebagai anak laki-laki Daud. “Anakku” tepat dan kuat secara emosional.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama pribadi ditransliterasikan sesuai bentuk baku bahasa Indonesia.
- source_word: pengulangan אַבְשָׁלוֹם / בְּנִי
  choice: “Anakku Absalom! Absalom, anakku, anakku!”
  rationale: Semua pengulangan dipertahankan karena menyampaikan kesedihan yang sangat mendalam; tanda baca membuat ratapan ini alami dalam bahasa Indonesia tanpa menghaluskannya.
