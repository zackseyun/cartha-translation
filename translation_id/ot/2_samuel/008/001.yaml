  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/יַּ֥ךְ דָּוִ֛ד אֶת פְּלִשְׁתִּ֖ים וַ/יַּכְנִיעֵ֑/ם וַ/יִּקַּ֥ח דָּוִ֛ד אֶת מֶ֥תֶג הָ/אַמָּ֖ה מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/001.yaml
  text: And after this[a], David struck the Philistines and subdued them, and David took Metheg-ammah from the hand of the Philistines.
translation:
  language: id
  text: Sesudah itu, Daud mengalahkan orang Filistin dan menundukkan mereka. Daud mengambil Meteg-Ama[a] dari tangan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini berarti “kekang kota induk”, tetapi makna ungkapan itu sulit dipastikan. Frasa ini mungkin secara kiasan menunjuk pada penguasaan atas kota utama. Bandingkan 1 Tawarikh 18:1, yang menyebut Gat beserta kota-kota di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan ini menandai kelanjutan waktu dalam kisah. “Sesudah itu” alami dalam bahasa Indonesia modern tanpa mempertahankan secara kaku unsur “terjadilah”.
- source_word: וַיַּךְ
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נכה dapat menyatakan tindakan memukul atau mengalahkan. “Mengalahkan” menyampaikan makna militernya secara alami, sedangkan verba berikutnya menyatakan akibat politiknya.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku bahasa Indonesia untuk nama kelompok bangsa ini.
- source_word: וַיַּכְנִיעֵם
  choice: menundukkan mereka
  rationale: Bentuk Hifil dari כנע berarti membuat tunduk atau membawa ke bawah kekuasaan. Pilihan ini mempertahankan hasil militer-politis dari tindakan Daud.
- source_word: וַיִּקַּח
  choice: merebut
  rationale: לקח pada dasarnya berarti “mengambil”, tetapi dalam konteks perang dan penguasaan wilayah, “merebut” merupakan padanan Indonesia yang lebih alami.
- source_word: מֶתֶג הָאַמָּה
  choice: Meteg-Haama
  rationale: Frasa Ibrani ini sangat sulit dan mungkin merupakan ungkapan kiasan, tetapi maksud tepatnya tidak pasti. Transliterasi menghindari penetapan tafsir yang belum pasti dalam teks utama; kemungkinan maknanya dijelaskan dalam catatan kaki.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tentang kepemilikan atau kekuasaan dan tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan dua verba militer dipertahankan untuk membedakan kekalahan orang Filistin dari keadaan mereka yang kemudian ditundukkan. Nama yang tidak pasti ditransliterasikan dan diterangkan melalui catatan kaki.
