  yaml_path: translation/ot/2_samuel/008/003.yaml
  text: David struck down Hadadezer son of Rehob[a], king of Zobah[c][b], when he went to restore his power at the River.
translation:
  language: id
  text: Daud mengalahkan Hadadezer anak Rehob[a], raja Zoba, ketika ia pergi untuk memulihkan kekuasaannya[b] di Sungai itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Hadadezer”; beberapa tradisi teks dan bagian sejajarnya dalam 1 Tawarikh berbunyi “Hadarezer”.
    reason: textual_variant
  - marker: b
    text: Atau “untuk merebut kembali kendalinya” atau “untuk memulihkan wilayah kekuasaannya”; secara harfiah, “untuk mengembalikan tangannya”.
    reason: lexical_alternative
  - marker: c
    text: Yang dimaksud kemungkinan besar ialah Sungai Efrat.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּךְ
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נכה menyatakan tindakan memukul yang berujung pada kekalahan. 'Mengalahkan' alami dalam bahasa Indonesia dan tidak menyatakan secara berlebihan bahwa Hadadezer dibunuh.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Nama pribadi ditransliterasikan sesuai bentuk teks WLC; bentuk alternatif 'Hadarezer' dicatat dalam catatan kaki.
- source_word: בֶּן רְחֹב
  choice: anak Rehob
  rationale: Konstruksi patronimik diterjemahkan langsung dan alami.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Rangkaian konstruksi diterjemahkan secara langsung; nama tempat צוֹבָה ditransliterasikan sebagai 'Zoba' sesuai kebiasaan ejaan Indonesia.
- source_word: בְּלֶכְתּוֹ
  choice: ketika ia pergi
  rationale: Infinitif dengan prefiks ב menyatakan keadaan waktu. Terjemahan ini mempertahankan hubungan temporal, sedangkan acuan pronomina tetap mengikuti ambiguitas terbatas dalam bentuk Ibrani.
- source_word: לְהָשִׁיב יָדוֹ
  choice: untuk menegakkan kembali kekuasaannya
  rationale: Secara harfiah ungkapan ini berarti 'mengembalikan tangannya'. Dalam konteks politik dan militer, 'tangan' merupakan idiom bagi kuasa atau kendali. 'Menegakkan kembali kekuasaannya' menyampaikan idiom itu tanpa mempersempitnya menjadi wilayah kekuasaan tertentu.
- source_word: בִּנְהַר
  choice: di Sungai itu
  rationale: נהר dipakai secara absolut dan kemungkinan besar menunjuk kepada Sungai Efrat. Teks utama mempertahankan sebutan generik yang terdapat dalam bahasa Ibrani, sementara identifikasinya diberikan dalam catatan kaki.
