translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami bagi pembaca umum, dengan idiom politik-militer Ibrani diterjemahkan menurut maknanya. Sebutan 'Sungai itu' dipertahankan untuk tidak memasukkan identifikasi Efrat langsung ke dalam teks utama. Semua penanda catatan kaki ditempatkan dalam teks.
