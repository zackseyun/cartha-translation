  text: וַ/יִּמְלֹ֥ךְ דָּוִ֖ד עַל כָּל יִשְׂרָאֵ֑ל וַ/יְהִ֣י דָוִ֗ד עֹשֶׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה לְ/כָל עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/015.yaml
  text: So David reigned over all Israel[a], and David was administering justice and righteousness to all his people.
translation:
  language: id
  text: Demikianlah Daud memerintah atas seluruh Israel. Daud senantiasa menegakkan keadilan dan kebenaran bagi seluruh rakyatnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Dalam pernyataan rangkuman ini, מלך menunjuk pada pelaksanaan pemerintahan Daud sebagai raja, bukan sekadar saat ia naik takhta.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: atas seluruh Israel
  rationale: Kata depan עַל bersama מלך menandai wilayah atau umat yang diperintah; 'seluruh Israel' mempertahankan cakupan menyeluruh teks.
- source_word: וַיְהִי ... עֹשֶׂה
  choice: senantiasa menegakkan
  rationale: Konstruksi ויהי dengan partisipel menyatakan tindakan yang berlangsung atau menjadi kebiasaan. 'Senantiasa' menyampaikan aspek tersebut secara alami, sedangkan 'menegakkan' sesuai dengan konteks pemerintahan.
- source_word: מִשְׁפָּט
  choice: keadilan
  rationale: Dalam konteks kerajaan dan pemerintahan, מִשְׁפָּט mengacu pada penyelenggaraan keadilan, bukan hanya suatu putusan pengadilan.
- source_word: וּצְדָקָה
  choice: kebenaran
  rationale: צְדָקָה menyatakan kelurusan moral atau apa yang benar. 'Kebenaran' mempertahankan pembedaan dari מִשְׁפָּט tanpa meleburkan kedua istilah itu.
- source_word: לְכָל עַמּוֹ
  choice: bagi seluruh rakyatnya
  rationale: ל di sini menyatakan pihak yang menerima manfaat dari pemerintahan tersebut. 'Rakyatnya' alami dalam konteks raja dan tetap mencerminkan sufiks orang ketiga tunggal.
theological_decisions:
- issue: Pasangan ungkapan kerajaan מִשְׁפָּט וּצְדָקָה
  choice: keadilan dan kebenaran
  alternative: keadilan dan apa yang benar
  rationale: Dua nomina dipertahankan secara berbeda untuk menyatakan sekaligus keadilan hukum dan kelurusan moral yang mencirikan pemerintahan raja yang ideal; terjemahan tidak menyamakan keduanya atau mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Demikianlah' menandai fungsi ayat sebagai rangkuman naratif. 'Senantiasa menegakkan' menyampaikan tindakan pemerintahan yang berlangsung dan menjadi kebiasaan tanpa menghasilkan susunan yang kaku.
