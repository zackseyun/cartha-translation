  yaml_path: translation/ot/2_samuel/008/018.yaml
  text: Benaiah son of Jehoiada was over the Kerethites and the Pelethites, and David’s sons were priests.[a]
translation:
  language: id
  text: Benaya anak Yoyada mengepalai orang Kereti dan orang Peleti,[a] dan anak-anak Daud adalah imam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani di sini sangat ringkas: secara harfiah, “Dan Benaya anak Yoyada dan orang Kereti dan orang Peleti.” Hubungan kepemimpinan tersirat dari konteks; bandingkan 1 Tawarikh 18:17.'
    reason: ellipsis_and_parallel_evidence
  - marker: b
    text: Atau “pejabat utama” atau “pejabat kerajaan”. Kata Ibrani yang dipakai biasanya berarti “imam”, tetapi sebagian orang memahaminya di sini dalam arti jabatan istana yang lebih luas karena konteksnya adalah pemerintahan kerajaan.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנָיָהוּ בֶּן יְהוֹיָדָע
  choice: Benaya anak Yoyada
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; בֶּן diterjemahkan secara alami sebagai “anak”.
- source_word: וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: orang Kreti dan orang Pleti
  rationale: Keduanya merupakan sebutan kelompok. Transliterasi mempertahankan bentuk Ibrani tanpa memastikan lebih jauh identitas etnis atau fungsi militernya.
- source_word: וּבְנָיָהוּ ... וְהַכְּרֵתִי וְהַפְּלֵתִי
  choice: Benaya ... mengepalai orang Kreti dan orang Pleti
  rationale: Teks Masoret berbentuk sangat ringkas dan hanya merangkaikan nama Benaya dengan kedua kelompok itu. Hubungan kepemimpinan dibuat eksplisit agar kalimat wajar dalam bahasa Indonesia, berdasarkan konteks daftar pejabat dan rumusan paralel dalam 1 Tawarikh 18:17.
- source_word: כֹּהֲנִים
  choice: imam
  rationale: Ini adalah arti leksikal biasa dari kata Ibrani tersebut. Walaupun konteks pemerintahan memungkinkan pengertian pejabat istana, arti dasarnya dipertahankan dalam teks utama agar ketegangan dalam sumber tidak diselesaikan secara diam-diam.
- source_word: הָיוּ
  choice: adalah
  rationale: Bentuk kata kerja היה berfungsi sebagai kopula “adalah/merupakan”; “adalah” menyampaikan predikasi itu secara langsung dan alami.
theological_decisions:
- issue: Anak-anak Daud disebut כֹּהֲנִים meskipun mereka tidak dikenal sebagai imam Lewi yang melayani dalam ibadah.
  choice: Teks utama mempertahankan “imam”.
  alternative: “pejabat utama” atau “pejabat kerajaan”
  rationale: “Imam” adalah arti lazim kata Ibrani. Kemungkinan makna jabatan istana dicatat dalam catatan kaki, bukan dimasukkan ke teks utama, sehingga ketegangan historis dan teologis dalam ayat tetap terlihat.
- issue: Hubungan Benaya dengan orang Kreti dan Pleti tidak dinyatakan melalui kata kerja dalam teks Masoret ayat ini.
  choice: Mengeksplisitkan hubungan itu dengan “mengepalai”.
  alternative: Menerjemahkan secara sangat harfiah sebagai rangkaian “Benaya ... dan orang Kreti dan orang Pleti”.
  rationale: Daftar pejabat dalam konteks serta paralel 1 Tawarikh 18:17 mendukung hubungan kepemimpinan. Catatan kaki menjaga keterlacakan terhadap bentuk ringkas teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anak” dipilih daripada “bin” demi keterbacaan umum; “orang Kreti” dan “orang Pleti” mempertahankan sebutan kelompok secara transparan. Struktur “sedangkan” memperjelas peralihan antara dua jabatan tanpa menambah kontras teologis.
