  text: וַ/יָּ֨שֶׂם בֶּ/אֱד֜וֹם נְצִבִ֗ים בְּ/כָל אֱדוֹם֙ שָׂ֣ם נְצִבִ֔ים וַ/יְהִ֥י כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑ד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/014.yaml
  text: He placed garrisons in Edom[a]; throughout all Edom he placed garrisons, and all Edom became servants to David[b]. And Yahweh gave David victory wherever he went.
translation:
  language: id
  text: Ia menempatkan garnisun di Edom; di seluruh Edom ia menempatkan garnisun. Seluruh Edom pun menjadi taklukan Daud[a]. Yahweh memberi Daud kemenangan ke mana pun ia pergi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh Edom menjadi hamba-hamba bagi Daud”; nama bangsa dipakai secara kolektif untuk penduduknya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yahweh menyelamatkan” atau “melepaskan Daud ke mana pun ia pergi.” Dalam konteks militer, ungkapan itu menyatakan bahwa Yahweh memberinya kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם / שָׂם
  choice: menempatkan
  rationale: Kata שׂים berarti menaruh, menetapkan, atau menempatkan. Dalam konteks penguasaan wilayah, 'menempatkan' wajar dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: נְצִבִים
  choice: pasukan-pasukan penjaga
  rationale: Dalam konteks penaklukan militer, bentuk jamak ini kemungkinan menunjuk pada garnisun atau pasukan yang ditempatkan untuk mengendalikan wilayah. Pilihan ini lebih mudah dipahami pembaca umum daripada istilah serapan 'garnisun', sambil tetap mempertahankan kemungkinan nuansa militer.
- source_word: בֶּאֱדוֹם / בְּכָל אֱדוֹם
  choice: di Edom / di seluruh Edom
  rationale: Preposisi ב menyatakan lokasi, sedangkan בְכָל memberi cakupan menyeluruh.
- source_word: וַיְהִי כָל אֱדוֹם עֲבָדִים לְדָוִד
  choice: Seluruh Edom pun menjadi taklukan Daud
  rationale: Ungkapan Ibrani secara harfiah menyebut seluruh Edom sebagai עבדים bagi Daud. Dalam konteks politik dan militer, 'menjadi taklukan' menyampaikan keadaan tunduk dan wajib mengabdi tanpa memaksakan pengertian perbudakan perseorangan.
- source_word: וַיּוֹשַׁע
  choice: memberi ... kemenangan
  rationale: Bentuk Hifil dari ישׁע dapat berarti menyelamatkan, melepaskan, atau memberi kemenangan. Dalam rangkuman peperangan ini, 'memberi kemenangan' mengungkapkan makna kontekstual dan mempertahankan Yahweh sebagai pelaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ke mana pun ia pergi
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan diterjemahkan secara alami tanpa mempersempit הָלָךְ menjadi 'berperang' atau 'berbaris'.
theological_decisions:
- issue: Arti politik עֲבָדִים dalam penaklukan Edom
  choice: menjadi taklukan Daud
  alternative: menjadi hamba-hamba Daud / menjadi budak-budak Daud
  rationale: Teks menegaskan ketundukan Edom kepada Daud, tetapi tidak secara tegas menentukan bentuk pengabdian setiap orang Edom. 'Taklukan' mempertahankan nuansa ketundukan nasional tanpa melunakkan kenyataan dominasi.
- issue: Makna keselamatan dalam וַיּוֹשַׁע
  choice: Yahweh memberi Daud kemenangan
  alternative: Yahweh menyelamatkan/melepaskan Daud
  rationale: Konteks militer mendukung makna kemenangan, sementara catatan kaki mempertahankan cakupan leksikal 'menyelamatkan' atau 'melepaskan'.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi; transliterasi mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'di Edom ... di seluruh Edom' dipertahankan karena merupakan penekanan yang nyata dalam teks Ibrani. 'Pasukan-pasukan penjaga' dipilih untuk kejernihan umum; 'garnisun' merupakan padanan teknis yang mungkin.
