base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/004.yaml
  text: David captured from him 1,700 horsemen and 20,000 foot soldiers[a]. Then David hamstrung all the chariot horses[c][b], but left enough for 100 chariots.
translation:
  language: id
  text: Daud menawan 1.700 prajurit berkuda dan 20.000 prajurit infanteri darinya.[a] Lalu Daud memotong urat kaki semua kuda penarik kereta perang,[b] tetapi menyisakan cukup banyak kuda untuk seratus kereta perang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “1.700 prajurit berkuda”. Bagian sejajar dalam 1 Tawarikh 18:4 berbunyi “7.000 prajurit berkuda”.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “seluruh pasukan kereta perang”. Karena tindakan yang disebutkan adalah memotong urat kaki, yang dimaksud ialah kuda-kuda penarik kereta perang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “tetapi menyisakan dari antaranya untuk seratus kereta perang”.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: menawan
  rationale: Kata kerja לכד dalam konteks perang berarti menangkap atau merebut. “Menawan” secara alami menyatakan bahwa pasukan musuh ditangkap.
- source_word: מִמֶּנּוּ
  choice: dari pihaknya
  rationale: Akhiran tunggal merujuk kepada raja yang dikalahkan. “Dari pihaknya” mempertahankan acuan tunggal itu sekaligus terdengar lebih wajar dalam bahasa Indonesia daripada “dari dia” ketika objeknya adalah pasukan.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת פָּרָשִׁים
  choice: 1.700 orang pasukan berkuda
  rationale: פָּרָשִׁים menunjuk kepada orang-orang berkuda atau pasukan kavaleri. Angka mengikuti teks Masoret kitab Samuel; perbedaan dalam 1 Tawarikh 18:4 dicatat dalam catatan kaki.
- source_word: וְעֶשְׂרִים אֶלֶף אִישׁ רַגְלִי
  choice: 20.000 orang prajurit berjalan kaki
  rationale: Ungkapan ini secara harfiah berarti orang yang berjalan kaki dan dalam konteks militer menunjuk kepada pasukan infanteri. Bentuk yang dipilih jelas bagi pembaca umum.
- source_word: וַיְעַקֵּר
  choice: memotong urat kaki
  rationale: Dalam konteks ini עקר berarti melumpuhkan kuda dengan memotong urat kakinya. Ungkapan ini lebih konkret dan mudah dipahami daripada istilah teknis atau arkais.
- source_word: אֶת כָּל הָרֶכֶב
  choice: semua kuda penarik kereta perang itu
  rationale: רֶכֶב biasanya berarti kereta perang atau pasukan kereta, tetapi yang dapat dipotong urat kakinya adalah kudanya. Terjemahan menyatakan rujukan metonimis yang tersirat tanpa mengubah tindakan.
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: menyisakan cukup banyak kuda untuk seratus kereta perang
  rationale: יתר bentuk hifil berarti menyisakan atau membiarkan tetap ada. Dalam konteks ini jumlah yang disisakan dipahami sebagai kuda yang cukup untuk mengoperasikan seratus kereta perang.
