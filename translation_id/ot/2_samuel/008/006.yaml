  text: וַ/יָּ֨שֶׂם דָּוִ֤ד נְצִבִים֙ בַּ/אֲרַ֣ם דַּמֶּ֔שֶׂק וַ/תְּהִ֤י אֲרָם֙ לְ/דָוִ֔ד לַ/עֲבָדִ֖ים נוֹשְׂאֵ֣י מִנְחָ֑ה וַ/יֹּ֤שַׁע יְהוָה֙ אֶת דָּוִ֔ד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and Aram became servants to David, bringing tribute[c][b]. And Yahweh gave David victory wherever he went.
translation:
  language: id
  text: Daud menempatkan garnisun-garnisun di Aram-Damaskus[a]. Aram menjadi hamba Daud dengan membawa upeti[b]. Yahweh memberi Daud kemenangan ke mana pun ia pergi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Aram yang berpusat di Damaskus.” Nama Ibraninya adalah “Aram”, yang secara tradisional juga disebut “Siria”.
    reason: lexical_alternative
  - marker: b
    text: Atau “membawa pemberian”. Kata Ibrani yang dipakai dapat berarti pemberian, persembahan, atau upeti; di sini kemungkinan besar maksudnya pembayaran dari bangsa taklukan.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “Yahweh menyelamatkan atau melepaskan Daud ke mana pun ia pergi.” Dalam konteks peperangan, tindakan itu berarti memberinya kemenangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: menempatkan
  rationale: Verba שׂים berarti menaruh atau menempatkan; dalam konteks penguasaan wilayah, “menempatkan” wajar untuk pasukan penjaga.
- source_word: נְצִבִים
  choice: pasukan-pasukan penjaga
  rationale: Dalam konteks penaklukan militer, istilah ini kemungkinan menunjuk pada garnisun, yakni pasukan yang ditempatkan untuk menjaga dan menguasai wilayah. Pilihan ini lebih mudah dipahami pembaca umum daripada “garnisun”, sambil mempertahankan kemungkinan kolektifnya.
- source_word: בַּאֲרַם דַּמֶּשֶׂק
  choice: di Aram-Damaskus
  rationale: Frasa Ibrani menunjuk pada wilayah atau kerajaan Aram yang berpusat di Damaskus. Bentuk berhubung mempertahankan nama Aram dan menghindari ungkapan Indonesia yang kaku seperti “Aram dari Damaskus”.
- source_word: וַתְּהִי אֲרָם לְדָוִד לַעֲבָדִים
  choice: Orang Aram pun menjadi hamba Daud
  rationale: Bentuk tunggal kolektif “Aram” merujuk kepada bangsa atau negeri itu. “Orang Aram” lebih alami dalam bahasa Indonesia, sedangkan “menjadi hamba” mempertahankan metafora ketundukan politis dari עֲבָדִים.
- source_word: נוֹשְׂאֵי מִנְחָה
  choice: membawa upeti
  rationale: מִנְחָה dapat berarti pemberian, persembahan, atau upeti. Dalam hubungan antara penguasa dan bangsa taklukan, “upeti” paling tepat secara kontekstual.
- source_word: וַיֹּשַׁע
  choice: memberi ... kemenangan
  rationale: Bentuk kausatif dari ישׁע menyatakan tindakan menyelamatkan atau melepaskan. Dalam rangkaian kemenangan militer ini, “memberi kemenangan” menyampaikan akibatnya dengan jelas, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: ke mana pun ia pergi
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dari keberhasilan Daud dan diterjemahkan secara idiomatis tanpa mempersempitnya hanya pada gerak pasukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna עֲבָדִים dalam konteks hubungan antarbangsa
  choice: hamba
  alternative: taklukan atau budak
  rationale: “Hamba” mempertahankan citra leksikal teks sekaligus dapat menyatakan ketundukan politis. “Taklukan” lebih interpretatif, sedangkan “budak” dapat terlalu mengarahkan pembaca pada perbudakan individual.
- issue: Makna kausatif וַיֹּשַׁע dalam konteks perang
  choice: memberi Daud kemenangan
  alternative: menyelamatkan atau melepaskan Daud
  rationale: Konteks militer mendukung hasil berupa kemenangan, tetapi terjemahan alternatif yang lebih harfiah tetap dicatat agar nuansa tindakan penyelamatan ilahi tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Pasukan-pasukan penjaga” dipilih agar makna militer נְצִבִים mudah dipahami tanpa meniadakan ketidakpastian apakah istilah itu dapat mencakup pejabat atau pos pendudukan. Nama “Aram” dan “Yahweh” dipertahankan dekat dengan teks sumber.
