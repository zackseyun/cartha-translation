id: 2SA.8.11
reference: 2 Samuel 8:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּם אֹתָ֕/ם הִקְדִּ֛ישׁ הַ/מֶּ֥לֶךְ דָּוִ֖ד לַֽ/יהוָ֑ה עִם הַ/כֶּ֤סֶף וְ/הַ/זָּהָב֙ אֲשֶׁ֣ר הִקְדִּ֔ישׁ מִ/כָּל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר כִּבֵּֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/011.yaml
  text: King David also dedicated them to Yahweh[b][a], along with the silver and the gold that he had dedicated from all the nations that he had subdued.
translation:
  language: id
  text: Raja Daud juga mengkhususkan semuanya itu[a] bagi Yahweh, bersama dengan perak dan emas yang telah ia khususkan dari segala bangsa yang telah ditundukkannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Semuanya itu” menunjuk kepada barang-barang yang disebut dalam ayat sebelumnya.
    reason: cross_reference
  - marker: b
    text: Atau “ditaklukkannya”. Kata Ibrani ini dapat berarti membawa bangsa-bangsa ke bawah kekuasaan dengan kekuatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Menyatakan tambahan terhadap tindakan yang disebut dalam ayat sebelumnya.
- source_word: אֹתָם
  choice: semuanya itu
  rationale: Pronomina ini menunjuk kembali kepada barang-barang yang disebut pada ayat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan jenis barang tertentu.
- source_word: הִקְדִּישׁ
  choice: mengkhususkan ... bagi
  rationale: Kata ini menyatakan tindakan memisahkan atau menetapkan sesuatu sebagai milik suci bagi Allah. Pilihan ini mempertahankan nuansa kultis tanpa menyiratkan bahwa barang-barang itu langsung dipakai sebagai kurban.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan gelar dan nama yang baku serta alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: עִם
  choice: bersama dengan
  rationale: Menghubungkan barang-barang dari ayat sebelumnya dengan perak dan emas yang telah lebih dahulu dikhususkan.
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: perak dan emas
  rationale: Padanan alami bagi kedua logam berharga yang dimaksud; bahasa Indonesia tidak memerlukan penanda definit yang terpisah.
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: yang telah ia khususkan
  rationale: Bentuk ini mencerminkan bahwa tindakan tersebut telah berlangsung dalam rangkaian kemenangan sebelumnya.
- source_word: מִכָּל הַגּוֹיִם
  choice: dari segala bangsa
  rationale: מִן menyatakan sumber, dan גּוֹיִם dalam konteks militer-politik ini paling tepat diterjemahkan sebagai bangsa-bangsa.
- source_word: אֲשֶׁר כִּבֵּשׁ
  choice: yang telah ditundukkannya
  rationale: כּבש berarti membawa pihak lain ke bawah kekuasaan, biasanya dengan kekuatan. 'Menundukkan' mempertahankan cakupan ini tanpa memastikan aneksasi permanen.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi Allah dan membedakannya dari gelar umum.
- issue: Makna kultis הִקְדִּישׁ bagi barang rampasan atau pemberian
  choice: mengkhususkan bagi Yahweh
  alternative: menguduskan; mempersembahkan kepada Yahweh
  rationale: '''Mengkhususkan'' menyampaikan bahwa barang-barang itu ditetapkan sebagai milik suci bagi Yahweh, tanpa mempersempit maknanya menjadi kurban ritual atau sekadar pemberian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'khususkan' dipertahankan untuk mencerminkan pengulangan הִקְדִּישׁ dalam teks Ibrani. Nama ilahi ditulis 'Yahweh', dan semua penanda catatan kaki ditempatkan langsung dalam teks utama.
