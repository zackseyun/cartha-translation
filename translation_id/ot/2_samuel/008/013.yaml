  text: וַ/יַּ֤עַשׂ דָּוִד֙ שֵׁ֔ם בְּ/שֻׁב֕/וֹ מֵ/הַכּוֹת֥/וֹ אֶת אֲרָ֖ם בְּ/גֵיא מֶ֑לַח שְׁמוֹנָ֥ה עָשָׂ֖ר אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/013.yaml
  text: And David made a name for himself when he returned from striking down Aram in the Valley of Salt—eighteen thousand men[a].
translation:
  language: id
  text: Daud menjadi termasyhur ketika ia kembali setelah mengalahkan Aram di Lembah Garam—delapan belas ribu orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah saksi tekstual dan bagian sejajar dalam 1 Tawarikh 18:12 menunjuk kepada “Edom”, bukan “Aram”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעַשׂ דָּוִד שֵׁם
  choice: Daud menjadi termasyhur
  rationale: Ungkapan Ibrani harfiah 'membuat nama' berarti memperoleh nama besar atau kemasyhuran. 'Menjadi termasyhur' menyampaikan makna idiomatis itu secara alami dalam bahasa Indonesia modern tanpa menambahkan pelaku yang memberinya kemenangan.
- source_word: בְּשֻׁבוֹ
  choice: ketika ia kembali
  rationale: Preposisi dengan infinitif konstruk dan sufiks berfungsi temporal; terjemahan ini mempertahankan hubungan waktu dalam narasi.
- source_word: מֵהַכּוֹתוֹ
  choice: setelah mengalahkan
  rationale: Secara bentuk berarti 'dari memukul/menghantamnya', yakni tindakan yang darinya Daud kembali. Dalam konteks perang, 'setelah mengalahkan' alami dan tidak mengharuskan bahwa Daud sendiri membunuh seluruh jumlah yang disebut.
- source_word: אֶת אֲרָם
  choice: Aram
  rationale: Teks WLC/Masoret yang diberikan membaca Aram. Nama kuno ini dipertahankan dan tidak diganti dengan istilah geopolitik modern.
- source_word: בְּגֵיא מֶלַח
  choice: di Lembah Garam
  rationale: Nama tempat dengan preposisi ב diterjemahkan secara langsung dan wajar sebagai lokasi pertempuran.
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: delapan belas ribu orang
  rationale: Teks menyebut angka tanpa nomina eksplisit. 'Orang' melengkapi unsur yang tersirat oleh konteks militer dan lebih alami daripada angka yang berdiri sendiri.
theological_decisions:
- issue: Identitas pihak yang dikalahkan
  choice: Aram dalam teks utama
  alternative: Edom
  rationale: Teks Masoret 2 Samuel 8:13 yang diberikan berbunyi 'Aram', sedangkan sejumlah saksi tekstual dan bagian sejajar dalam 1 Tawarikh 18:12 menunjuk kepada 'Edom'. Bacaan sumber utama dipertahankan, dan alternatif penting dicatat tanpa menyelesaikan ketegangan tekstual secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan idiomatis diterjemahkan menurut maknanya agar mudah dipahami, sedangkan nama kuno dan varian tekstual yang penting dipertahankan secara transparan.
