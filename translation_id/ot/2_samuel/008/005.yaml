base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: id
  text: Lalu orang Aram dari Damsyik[b] datang untuk menolong Hadadezer[a], raja Zoba, dan Daud menewaskan dua puluh dua ribu orang Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Hadadezer ditulis “Hadarezer” dalam beberapa bagian lain dan sejumlah terjemahan.
    reason: alternative_reading
  - marker: b
    text: 'Ibrani: Aram, bukan sebutan tradisional “Suriah”; di sini istilah itu merujuk kepada orang Aram dari kerajaan yang berpusat di Damsyik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur narasi lampau dan paling wajar diterjemahkan dengan 'datang'.
- source_word: אֲרַם דַּמֶּשֶׂק
  choice: orang Aram dari Damsyik
  rationale: אֲרַם dapat menunjuk kepada bangsa atau pemerintahan Aram; karena verba Ibrani berbentuk tunggal kolektif dan konteksnya menyangkut pasukan, ungkapan ini diterjemahkan secara alami sebagai 'orang Aram dari Damsyik' tanpa memakai sebutan geopolitik yang lebih kemudian, 'Suriah'.
- source_word: לַעְזֹר
  choice: untuk menolong
  rationale: עזר secara langsung berarti menolong atau membantu; 'menolong' jelas dan alami dalam konteks dukungan militer.
- source_word: לַהֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Nama ini ditransliterasikan sesuai bentuk konsonantal pada ayat ini; variasi 'Hadarezer' dicatat dalam catatan kaki.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Rangkaian konstruksi ini secara alami berarti 'raja Zoba' dalam bahasa Indonesia.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Dalam konteks pertempuran dan diikuti jumlah orang, נכה menyatakan tindakan memukul hingga jatuh atau membunuh; 'menewaskan' menyampaikan hasil mematikan yang tersirat kuat tanpa menambahkan keterangan tentang cara kematian.
- source_word: בַּאֲרָם
  choice: orang Aram
  rationale: Dengan נכה, preposisi ב menandai kelompok yang menjadi sasaran. Karena jumlah berikutnya memakai אִישׁ, bahasa Indonesia yang alami ialah 'orang Aram'.
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: dua puluh dua ribu orang
  rationale: Frasa bilangan ini secara eksplisit memuat אִישׁ, 'orang/laki-laki'. Dalam konteks militer, 'orang' mempertahankan penghitungan individu tanpa menambahkan kata 'prajurit', yang tidak tertulis.
