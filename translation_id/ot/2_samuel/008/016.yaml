  text: And Joab son of Zeruiah was over the army[b][a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: id
  text: Yoab anak Zeruya memimpin pasukan[a], dan Yosafat anak Ahilud adalah pencatat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berada di atas pasukan”; maksudnya, memegang komando atas pasukan.
    reason: lexical_alternative
  - marker: b
    text: “Pencatat” adalah pejabat istana yang kemungkinan bertugas menyimpan catatan dan melaporkan berbagai perkara kepada raja. Istilah ini juga dapat diterjemahkan “sekretaris”.
    reason: cultural_note
lexical_decisions:
- source_word: עַל הַצָּבָא
  choice: memimpin pasukan
  rationale: Dalam daftar pejabat, frasa ini menyatakan wewenang atau tanggung jawab atas angkatan bersenjata. “Memimpin pasukan” alami dalam bahasa Indonesia dan tetap dekat dengan fungsi administratif-militer yang dimaksud.
- source_word: מַזְכִּיר
  choice: pencatat kerajaan
  rationale: Kata ini menunjuk pada jabatan istana yang berkaitan dengan pencatatan dan penyampaian perkara kepada raja. “Pencatat kerajaan” menghindari kesan modern dari “sekretaris” dan tidak membatasi tugasnya pada penulisan sejarah seperti yang mungkin tersirat oleh “penulis riwayat”.
- source_word: בֵּן
  choice: anak
  rationale: Dalam pengenalan silsilah, בֵּן secara langsung berarti “anak” dan mempertahankan gaya ringkas daftar pejabat.
- source_word: וְ / וִ
  choice: dan
  rationale: Kata sambung ini menghubungkan kedua pejabat dalam sebuah daftar sederhana.
- source_word: יוֹאָב / צְרוּיָה / יְהוֹשָׁפָט / אֲחִילוּד
  choice: Yoab / Zeruya / Yosafat / Ahilud
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, sesuai dengan gaya daftar pejabat. Bentuk “memimpin pasukan” dipilih agar alami bagi pembaca modern, sedangkan “pencatat kerajaan” mempertahankan sifat jabatan istana tanpa memasukkan pengertian kelembagaan modern yang terlalu khusus.
