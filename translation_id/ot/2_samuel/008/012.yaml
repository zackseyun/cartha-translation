    text: 'Bahasa Ibrani: “Aram”; secara tradisional diterjemahkan “Siria”.'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani secara harfiah: “anak-anak Amon”.'
    reason: lexical_alternative
  - marker: c
    text: Dalam beberapa bagian lain, nama ini dieja “Hadarezer”.
    reason: textual_variant
lexical_decisions:
- source_word: מֵאֲרָם
  choice: dari Aram
  rationale: Mempertahankan nama Ibrani bagi wilayah dan bangsa Aram; sebutan tradisional “Siria” merupakan padanan geografis yang lebih kemudian.
- source_word: וּמִמּוֹאָב
  choice: Moab
  rationale: Nama bangsa atau wilayah ini sudah baku dalam bahasa Indonesia; preposisi “dari” pada awal deret berlaku juga bagi unsur ini.
- source_word: וּמִבְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan ini mencerminkan bentuk harfiah “anak-anak Amon” sekaligus menjadi sebutan etnis yang alami dan dikenal dalam bahasa Indonesia.
- source_word: וּמִפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Padanan etnonim yang jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וּמֵעֲמָלֵק
  choice: Amalek
  rationale: Teks memakai nama diri עֲמָלֵק, bukan bentuk gentilik eksplisit; “Amalek” mempertahankan bentuk sumber dan dapat menunjuk lingkup bangsa atau wilayahnya.
- source_word: וּמִשְּׁלַל
  choice: dan dari jarahan
  rationale: שָׁלָל berarti barang yang dirampas dalam perang; “jarahan” merupakan nomina Indonesia yang alami dalam konteks ini.
- source_word: הֲדַדְעֶזֶר
  choice: Hadadezer
  rationale: Transliterasi mengikuti bentuk konsonantal yang terdapat dalam ayat ini.
- source_word: בֶּן רְחֹב
  choice: anak Rehob
  rationale: Menerjemahkan konstruksi hubungan ayah-anak secara langsung dan alami.
- source_word: מֶלֶךְ צוֹבָה
  choice: raja Zoba
  rationale: Gelar kerajaan diterjemahkan langsung, sedangkan nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
