base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/002.yaml
  text: He struck Moab and measured them with a line[a], making them lie down on the ground. He measured off two lengths of line for death and a full length of line to keep alive. So Moab became David’s servants[b], bringing tribute.
translation:
  language: id
  text: Ia mengalahkan Moab dan mengukur mereka dengan tali pengukur[a], dengan menyuruh mereka berbaring di tanah. Ia mengukur dua ukuran tali untuk dibunuh dan satu ukuran tali penuh untuk dibiarkan hidup. Demikianlah orang Moab menjadi hamba-hamba Daud[b] dan membawa upeti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali.”
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani menggambarkan Daud mengukur orang-orang Moab ketika mereka berbaring di tanah: dua ukuran yang diukur ditetapkan untuk dibunuh, sedangkan satu ukuran tali penuh dibiarkan hidup.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ אֶת־מוֹאָב
  choice: Ia mengalahkan Moab
  rationale: Dalam konteks peperangan, נכה menyatakan tindakan memukul atau menaklukkan musuh. 'Mengalahkan' adalah ungkapan Indonesia yang wajar tanpa menentukan bahwa seluruh bangsa itu dimusnahkan.
- source_word: וַיְמַדְּדֵם בַּחֶבֶל
  choice: dan mengukur mereka dengan tali
  rationale: Piel מדד berarti 'mengukur', sedangkan חבל adalah tali yang dipakai sebagai alat ukur. Terjemahan ini mempertahankan gambaran konkret dan keras dalam bahasa Ibrani.
- source_word: הַשְׁכֵּב אֹתָם אַרְצָה
  choice: setelah menyuruh mereka berbaring di tanah
  rationale: Bentuk kausatif menyatakan bahwa Daud menyuruh atau membuat mereka berbaring. 'Setelah' menyajikan urutan prosedurnya secara alami dalam bahasa Indonesia.
- source_word: וַיְמַדֵּד שְׁנֵי חֲבָלִים לְהָמִית
  choice: Ia mengukur dua bagian tali untuk dibunuh
  rationale: שְׁנֵי חֲבָלִים menunjuk pada dua bagian yang ditentukan dengan ukuran tali. Bentuk pasif 'untuk dibunuh' menjelaskan bahwa orang-orang dalam kedua bagian itulah yang dijatuhi kematian.
- source_word: וּמְלֹא הַחֶבֶל לְהַחֲיוֹת
  choice: dan satu bagian sepanjang tali untuk dibiarkan hidup
  rationale: מְלֹא הַחֶבֶל secara harfiah adalah ukuran penuh tali, tanpa angka yang tertulis. 'Satu bagian sepanjang tali' menyampaikan kontras dengan dua bagian sebelumnya, sedangkan לְהַחֲיוֹת berarti membiarkan atau menjaga tetap hidup.
- source_word: וַתְּהִי מוֹאָב לְדָוִד לַעֲבָדִים
  choice: Demikianlah orang Moab menjadi hamba-hamba Daud
  rationale: Dalam konteks politik, עֲבָדִים menunjukkan bangsa taklukan yang tunduk kepada raja. 'Hamba-hamba' mempertahankan istilah sumber tanpa mempersempitnya menjadi perbudakan perseorangan.
- source_word: נֹשְׂאֵי מִנְחָה
  choice: dan membawa upeti
  rationale: Dalam hubungan antarkerajaan, מִנְחָה berarti upeti yang dibawa bangsa taklukan, bukan persembahan ibadah.
theological_decisions:
- issue: Perlakuan Daud terhadap orang Moab dalam rumusan pengukuran
  choice: Mempertahankan gambaran pengukuran secara konkret serta pembagian untuk dibunuh dan dibiarkan hidup.
  alternative: Menafsirkannya hanya sebagai kiasan penaklukan, atau menyatakan secara eksplisit bahwa dua pertiga dibunuh dan sepertiga dibiarkan hidup.
  rationale: Teks Ibrani menggambarkan prosedur yang nyata dan keras, tetapi tidak menyebut pecahan secara langsung. Terjemahan tidak melunakkan tindakan itu dan juga tidak menambahkan perhitungan yang hanya tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara gambaran pengukuran dan kekerasan teks sumber tetap dipertahankan.
