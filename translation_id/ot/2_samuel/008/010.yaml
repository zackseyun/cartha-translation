source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח תֹּ֣עִי אֶת יֽוֹרָם בְּנ֣/וֹ אֶל הַ/מֶּֽלֶךְ דָּ֠וִד לִ/שְׁאָל ל֨/וֹ לְ/שָׁל֜וֹם וּֽ/לְ/בָרֲכ֗/וֹ עַל֩ אֲשֶׁ֨ר נִלְחַ֤ם בַּ/הֲדַדְעֶ֨זֶר֙ וַ/יַּכֵּ֔/הוּ כִּי אִ֛ישׁ מִלְחֲמ֥וֹת תֹּ֖עִי הָיָ֣ה הֲדַדְעָ֑זֶר וּ/בְ/יָד֗/וֹ הָי֛וּ כְּלֵֽי כֶ֥סֶף וּ/כְלֵֽי זָהָ֖ב וּ/כְלֵ֥י נְחֹֽשֶׁת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/010.yaml
  text: Then Toi sent Joram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Toi; and in his hand were articles of silver, articles of gold[b], and articles of bronze.
translation:
  language: id
  text: Lalu Toi mengutus Yoram, anaknya, kepada Raja Daud untuk menanyakan keadaannya dan memberkatinya[a], karena Daud telah berperang melawan Hadadezer dan mengalahkannya. Sebab, Hadadezer telah berperang melawan Toi. Yoram membawa[b] barang-barang dari perak, emas, dan perunggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “memberkatinya” juga dapat dipahami sebagai “mengucapkan selamat kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di tangannya ada”; maksudnya, ia membawa barang-barang itu bersamanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח תֹּעִי
  choice: Lalu Toi mengutus
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami. Nama תֹּעִי ditransliterasikan sebagai “Toi” sesuai bentuk dalam Samuel.
- source_word: יֽוֹרָם בְּנוֹ
  choice: Yoram, anaknya
  rationale: Mengikuti nama Ibrani dan mempertahankan hubungan keluarga secara jelas dalam bahasa Indonesia.
- source_word: לִשְׁאָל לוֹ לְשָׁלוֹם
  choice: untuk menanyakan keadaannya
  rationale: Ungkapan harfiahnya berkaitan dengan menanyakan “damai” seseorang, yaitu kabar atau kesejahteraannya. “Menanyakan keadaannya” merupakan padanan idiomatis yang wajar dan tidak menambah makna.
- source_word: וּלְבָרֲכוֹ
  choice: dan memberkatinya
  rationale: Mempertahankan arti dasar ברך. Dalam konteks diplomatik, tindakan ini juga dapat mencakup ucapan selamat; kemungkinan itu dicatat dalam catatan kaki.
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: karena Daud telah berperang melawan Hadadezer dan mengalahkannya
  rationale: Subjek tersirat diperjelas sebagai Daud agar rujukan pronomina tidak membingungkan. נכה dalam konteks peperangan menyatakan bahwa Daud memukul atau menundukkan Hadadezer; “mengalahkannya” menyampaikan hasil militernya secara alami.
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעִי הָיָה הֲדַדְעָזֶר
  choice: Sebab, Hadadezer telah berperang melawan Toi
  rationale: Ungkapan Ibrani yang padat, secara harfiah menyebut Hadadezer “seorang yang berperang-perang dengan Toi.” Padanan ini menyampaikan permusuhan militer tanpa memaksakan apakah yang dimaksud satu perang atau serangkaian perang.
- source_word: וּבְיָדוֹ הָיוּ
  choice: Yoram membawa
  rationale: Secara harfiah, “di tangannya ada.” Dalam konteks utusan yang datang menghadap raja, ungkapan itu berarti barang-barang tersebut dibawanya. Nama Yoram dipakai untuk memperjelas rujukan, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב וּכְלֵי נְחֹשֶׁת
  choice: barang-barang dari perak, emas, dan perunggu
  rationale: כְּלִי adalah istilah luas untuk barang, benda, perkakas, atau bejana, sehingga “barang-barang” menjaga keluasan maknanya. נְחֹשֶׁת dalam konteks ini paling tepat dipahami sebagai perunggu.
