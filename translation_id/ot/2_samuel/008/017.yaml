  text: וְ/צָד֧וֹק בֶּן אֲחִיט֛וּב וַ/אֲחִימֶ֥לֶךְ בֶּן אֶבְיָתָ֖ר כֹּהֲנִ֑ים וּ/שְׂרָיָ֖ה סוֹפֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/017.yaml
  text: Zadok son of Ahitub and Ahimelech son of Abiathar were priests[b][a], and Seraiah was secretary.
translation:
  language: id
  text: Zadok anak Ahitub dan Ahimelekh anak Abyatar adalah para imam,[a] dan Seraya adalah sekretaris.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabat utama” atau “para pejabat kerajaan.” Sebagian orang memahami istilah Ibrani ini dalam arti jabatan istana yang lebih luas karena ayat ini mencantumkan para pejabat Daud.
    reason: lexical_alternative
  - marker: b
    text: Atau “juru tulis.” Istilah Ibrani ini menunjuk pejabat yang bertanggung jawab atas urusan tulis-menulis atau administrasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam daftar pejabat yang menyebut silsilah langsung, kata ini paling wajar berarti ‘anak’, bukan sekadar ‘keturunan’.
- source_word: אֲחִיטוּב
  choice: Ahitub
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲחִימֶלֶךְ
  choice: Ahimelekh
  rationale: Nama diri ditransliterasikan secara dekat dengan bentuk Ibrani sekaligus mengikuti pola ejaan Indonesia.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: כֹּהֲנִים
  choice: imam-imam
  rationale: Makna utama dan paling umum dari bentuk jamak ini adalah ‘imam-imam’. Kemungkinan makna jabatan istana yang lebih luas dicatat dalam catatan kaki karena konteksnya merupakan daftar pejabat Daud.
- source_word: שְׂרָיָה
  choice: Seraya
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca bahasa Indonesia.
- source_word: סוֹפֵר
  choice: sekretaris
  rationale: Dalam lingkungan istana, istilah ini menunjuk pejabat yang menangani penulisan dan administrasi. ‘Sekretaris’ menyampaikan fungsi jabatan itu dengan bahasa modern; ‘juru tulis’ tetap dicatat sebagai alternatif.
theological_decisions:
- issue: Makna כֹּהֲנִים dalam daftar pejabat kerajaan
  choice: imam-imam
  alternative: para pejabat utama; para pejabat kerajaan
  rationale: Arti baku istilah Ibrani ini adalah ‘imam-imam’. Konteks administratif membuka kemungkinan arti yang lebih luas, tetapi tidak cukup kuat untuk menggantikan makna utama dalam teks; kemungkinan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami dengan menambahkan ‘adalah’, yang tersirat dalam klausa nominal Ibrani. Bentuk ulang ‘imam-imam’ mempertahankan jamak eksplisit tanpa mengubahnya menjadi gelar kolektif.
