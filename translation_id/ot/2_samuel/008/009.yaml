  text: וַ/יִּשְׁמַ֕ע תֹּ֖עִי מֶ֣לֶךְ חֲמָ֑ת כִּ֚י הִכָּ֣ה דָוִ֔ד אֵ֖ת כָּל חֵ֥יל הֲדַדְעָֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/009.yaml
  text: When Toi king of Hamath heard that David had struck down all the army of Hadadezer,[a]
translation:
  language: id
  text: Ketika Toi, raja Hamat, mendengar bahwa Daud telah memukul kalah seluruh pasukan Hadadezer,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bagian paralel dalam 1 Tawarikh 18:9 menyebut nama raja itu “Tou”. Teks Ibrani di sini menyebutnya “Toi”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk naratif dari שׁמע menyatakan peristiwa berikutnya. “Mendengar” merupakan padanan langsung dan alami; konteks membuatnya bermakna menerima kabar.
- source_word: תֹּעִי
  choice: Toi
  rationale: Nama pribadi ditransliterasikan mengikuti bentuk teks Ibrani pada ayat ini. Bentuk berbeda dalam bagian paralel dicatat dalam catatan kaki.
- source_word: מֶלֶךְ חֲמָת
  choice: raja Hamat
  rationale: Rangkaian konstruksi ini secara langsung menyatakan jabatan Toi dan kerajaan yang dipimpinnya. “Hamat” adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi kabar yang didengar Toi, bukan alasan sebab-akibat.
- source_word: הִכָּה
  choice: telah memukul kalah
  rationale: Dalam konteks perang, נכה berarti memukul atau menewaskan hingga pihak lawan dikalahkan. “Memukul kalah” mempertahankan gambaran konkret verba Ibrani sekaligus terdengar wajar dalam bahasa Indonesia dan tidak menentukan bahwa setiap prajurit dibunuh.
- source_word: אֵת כָּל חֵיל
  choice: seluruh pasukan
  rationale: חַיִל di sini menunjuk pada kekuatan atau angkatan perang. “Seluruh pasukan” jelas, alami, dan mempertahankan cakupan כָּל.
- source_word: הֲדַדְעָזֶר
  choice: Hadadezer
  rationale: Transliterasi nama pribadi Ibrani yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan anak kalimat dipertahankan karena ayat ini berlanjut ke tindakan Toi pada ayat berikutnya; tanda koma menandai kelanjutan tersebut. Ungkapan “memukul kalah” menjaga unsur tindakan keras dalam הִכָּה tanpa mempersempit maknanya menjadi pembunuhan total.
