  yaml_path: translation/ot/2_samuel/008/007.yaml
  text: And David took the shields of gold that belonged to the servants of Hadadezer and brought them to Jerusalem[a].
translation:
  language: id
  text: Daud mengambil perisai-perisai emas[a] yang ada pada para pegawai Hadadezer, lalu membawanya ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perisai-perisai dari emas”. Menurut pandangan minoritas, istilah Ibrani ini dapat berarti “tabung anak panah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Dalam narasi, לקח lazim berarti “mengambil”. Pilihan ini cukup luas dan tidak menambahkan nuansa kekerasan yang tidak dinyatakan secara eksplisit.
- source_word: שִׁלְטֵי הַזָּהָב
  choice: perisai-perisai emas
  rationale: שׁלטים secara tradisional dipahami sebagai perisai atau perlengkapan pertahanan. Bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan konstruksi Ibrani; usulan minoritas “tabung-tabung anak panah” dicatat dalam catatan kaki.
- source_word: אֲשֶׁר הָיוּ אֶל
  choice: yang dibawa oleh
  rationale: Secara harfiah, ungkapan ini menyatakan bahwa benda-benda tersebut “ada pada/bersama” para pegawai. Dalam konteks perlengkapan kerajaan atau militer, “dibawa oleh” mengungkapkan asosiasi itu secara alami tanpa memastikan kepemilikan pribadi mereka.
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: para pegawai Hadadezer
  rationale: עֲבָדִים dapat berarti hamba, pelayan, bawahan, atau pejabat. Dalam konteks raja dan perlengkapan militernya, “para pegawai” menghindari kesan budak rumah tangga dan tetap cukup luas.
- source_word: וַיְבִיאֵם
  choice: lalu membawanya
  rationale: Bentuk Hifil dari בוא berarti “membawa”. Pronomina -ם merujuk kepada kumpulan perisai, yang secara alami dapat dirujuk dengan “-nya” dalam bahasa Indonesia.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Yang dibawa oleh” mempertahankan nuansa asosiasi dari אֲשֶׁר הָיוּ אֶל tanpa secara tegas menjadikannya milik pribadi para pegawai. Penanda catatan kaki ditempatkan sesudah “Yerusalem” agar mencakup alternatif leksikal dalam ayat.
