base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/008/008.yaml
  text: And from Betah and from Berothai[a], cities of Hadadezer[c][b], King David took very much bronze.
translation:
  language: id
  text: Dari Betah dan dari Berotai[a], kota-kota Hadadezer, Raja Daud mengambil perunggu[b] dalam jumlah yang sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Catatan sejajar dalam 1 Tawarikh 18:8 menyebut tempat-tempat ini Tibhat dan Kun; teks Ibrani ayat ini berbunyi Betah dan Berotai.
    reason: cross_reference
  - marker: b
    text: Atau “tembaga”; istilah Ibrani dapat berarti tembaga atau perunggu, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בֶּטַח
  choice: Dari Betah
  rationale: Nama tempat mengikuti bentuk Teks Masoret pada ayat ini. Konjungsi awal tidak perlu dinyatakan dengan “dan” dalam bahasa Indonesia karena ayat ini melanjutkan narasi sebelumnya dan kalimat tetap mengalir alami.
- source_word: וּ/מִ/בֵּרֹתַי
  choice: dan Berotai
  rationale: Bentuk nama tempat ditransliterasikan sesuai בֵּרֹתַי; preposisi מִן berlaku sejajar dengan tempat pertama dan diterjemahkan secara alami.
- source_word: עָרֵי הֲדַדְעָזֶר
  choice: kota-kota milik Hadadezer
  rationale: Rangkaian konstruksi menyatakan bahwa kota-kota itu berada dalam kepemilikan atau kekuasaan Hadadezer. “Milik” menyampaikan hubungan tersebut tanpa menentukan sifat administratifnya secara lebih sempit.
- source_word: לָקַח
  choice: mengambil
  rationale: Dipertahankan dalam arti dasarnya, “mengambil,” agar tidak mempersempit makna menjadi merebut kota ataupun menjarah bahan tertentu.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan gelar diikuti nama merupakan bentuk idiomatis dan bermartabat dalam bahasa Indonesia.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah Ibrani dapat menunjuk pada tembaga atau perunggu. Dalam konteks logam rampasan yang kemudian dikaitkan dengan perlengkapan Bait Allah, “perunggu” merupakan pilihan kontekstual yang wajar, sementara kemungkinan “tembaga” dicatat dalam catatan kaki.
- source_word: הַרְבֵּה מְאֹד
  choice: dalam jumlah yang sangat besar
  rationale: Ungkapan ini menekankan kuantitas yang luar biasa; terjemahan tersebut alami dalam bahasa Indonesia dan mempertahankan intensitasnya.
