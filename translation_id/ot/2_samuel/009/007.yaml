  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ דָוִ֜ד אַל תִּירָ֗א כִּ֣י עָשֹׂה֩ אֶעֱשֶׂ֨ה עִמְּ/ךָ֥ חֶ֨סֶד֙ בַּֽ/עֲבוּר֙ יְהוֹנָתָ֣ן אָבִ֔י/ךָ וַ/הֲשִׁבֹתִ֣י לְ/ךָ֔ אֶֽת כָּל שְׂדֵ֖ה שָׁא֣וּל אָבִ֑י/ךָ וְ/אַתָּ֗ה תֹּ֥אכַל לֶ֛חֶם עַל שֻׁלְחָנִ֖/י תָּמִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/007.yaml
  text: David said to him[a], “Do not be afraid, for I will surely show you kindness for the sake of Jonathan your father, and I will restore to you all the land of Saul your father[c][b], and you shall always eat bread at my table.”
translation:
  language: id
  text: Daud berkata kepadanya, “Jangan takut, sebab aku pasti akan menunjukkan kasih setia[a] kepadamu demi Yonatan, ayahmu. Aku akan mengembalikan kepadamu seluruh tanah milik Saul, kakekmu[b], dan engkau akan selalu makan di mejaku[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kasih setia” juga dapat diterjemahkan “kebaikan”, “kemurahan”, atau “kasih yang teguh”; dalam konteks ini kata tersebut mencakup kesetiaan dalam suatu ikatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Saul, ayahmu”. Kata Ibrani untuk “ayah” juga dapat berarti leluhur; Saul adalah kakek Mefiboset.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “selalu makan roti di mejaku”, suatu ungkapan yang menunjukkan pemeliharaan tetap dan persekutuan meja.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Ungkapan larangan yang langsung, alami, dan mempertahankan nada penghiburan Daud.
- source_word: כִּי עָשֹׂה אֶעֱשֶׂה
  choice: sebab aku pasti akan menunjukkan
  rationale: Bentuk infinitif absolut yang disertai verba finit menegaskan kepastian tindakan; “pasti” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Dalam konteks ini, tindakan baik Daud bersumber pada kesetiaannya terhadap ikatan dengan Yonatan. “Kasih setia” mempertahankan unsur kasih, loyalitas, dan tindakan nyata tanpa membatasi istilah itu pada rumusan doktrinal tertentu.
- source_word: בַּעֲבוּר יְהוֹנָתָן אָבִיךָ
  choice: demi Yonatan, ayahmu
  rationale: “Demi” menyampaikan alasan yang bersifat relasional, sedangkan aposisi “ayahmu” mengikuti hubungan yang dinyatakan teks.
- source_word: וַהֲשִׁבֹתִי לְךָ
  choice: Aku akan mengembalikan kepadamu
  rationale: Bentuk Hifil dari שוב di sini menunjuk pada pemulihan atau pengembalian milik kepada penerimanya.
- source_word: כָּל שְׂדֵה שָׁאוּל
  choice: seluruh tanah milik Saul
  rationale: Kata שָׂדֶה berbentuk tunggal tetapi dapat bermakna kolektif; konteksnya menunjuk pada tanah atau harta pertanahan Saul, bukan hanya satu petak ladang.
- source_word: שָׁאוּל אָבִיךָ
  choice: Saul, kakekmu
  rationale: Kata Ibrani אָב dapat merujuk pada leluhur. Karena Mefiboset adalah anak Yonatan, Saul adalah kakeknya; terjemahan ini menjelaskan hubungan yang dimaksud, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: תֹּאכַל לֶחֶם עַל שֻׁלְחָנִי תָּמִיד
  choice: engkau akan selalu makan di mejaku
  rationale: Ungkapan harfiah “makan roti di mejaku” merupakan idiom tentang jamuan, pemeliharaan, dan persekutuan meja yang berkelanjutan. Terjemahan ini alami dan tetap mempertahankan gambaran meja kerajaan.
theological_decisions:
- issue: Nuansa perjanjian dalam חֶסֶד
  choice: kasih setia
  alternative: kebaikan; kemurahan; kasih yang teguh; kesetiaan pada ikatan perjanjian
  rationale: Konteks menghubungkan kemurahan Daud kepada Mefiboset dengan kesetiaannya kepada Yonatan. “Kasih setia” mencakup dimensi relasional dan loyal tanpa menjadikan satu penafsiran teologis sebagai satu-satunya makna.
- issue: Hubungan Saul dengan Mefiboset dalam אָבִיךָ
  choice: kakekmu dalam teks utama, dengan bentuk harfiah dijelaskan dalam catatan
  alternative: ayahmu; leluhurmu
  rationale: Bahasa Ibrani memakai istilah luas yang dapat berarti ayah atau leluhur. Bahasa Indonesia modern biasanya memahami “ayah” sebagai orang tua langsung, sehingga “kakekmu” menghindari kesalahpahaman faktual tanpa menyembunyikan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti “aku–engkau” dipakai untuk tuturan kerajaan yang tetap mudah dipahami; susunan kalimat dibuat alami tanpa menghilangkan penegasan, hubungan keluarga, dan gambaran meja dalam teks Ibrani.
