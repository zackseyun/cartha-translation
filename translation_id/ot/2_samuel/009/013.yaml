base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/013.yaml
  text: And Mephibosheth lived in Jerusalem[a], because he always ate at the king’s table[b]. Now he was lame in both his feet.
translation:
  language: id
  text: Mefiboset tinggal di Yerusalem karena ia selalu makan di meja raja. Ia pincang pada kedua kakinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשֵׁב
  choice: tinggal
  rationale: Dalam konteks nama kota, bentuk partisip ini menyatakan tempat menetap, bukan tindakan duduk secara harfiah.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini paling wajar dipahami sebagai pengantar alasan mengapa Mefiboset tinggal di Yerusalem.
- source_word: שֻׁלְחַן הַמֶּלֶךְ
  choice: meja raja
  rationale: Ungkapan konstruksi Ibrani ini diterjemahkan secara alami dan tetap mempertahankan gambaran tentang pemeliharaan serta persekutuan di lingkungan kerajaan.
- source_word: תָּמִיד ... אֹכֵל
  choice: selalu makan
  rationale: Bentuk partisip bersama תָּמִיד menyatakan kebiasaan yang berlangsung secara teratur; frasa ini alami dalam bahasa Indonesia.
- source_word: פִסֵּחַ
  choice: timpang
  rationale: Pilihan ini merupakan padanan langsung yang bermartabat bagi keadaan fisik yang disebutkan dalam teks.
- source_word: שְׁתֵּי רַגְלָיו
  choice: kedua kakinya
  rationale: Menerjemahkan secara tepat ungkapan harfiah 'dua kakinya' dalam susunan bahasa Indonesia yang alami.
- source_word: וְהוּא
  choice: Ia
  rationale: Waw memperkenalkan keterangan penutup mengenai keadaan Mefiboset; pemisahan menjadi kalimat baru menyampaikan alur tersebut secara alami tanpa perlu menerjemahkan konjungsi secara kaku.
