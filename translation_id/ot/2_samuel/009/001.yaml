  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/כִ֣י יֶשׁ ע֔וֹד אֲשֶׁ֥ר נוֹתַ֖ר לְ/בֵ֣ית שָׁא֑וּל וְ/אֶעֱשֶׂ֤ה עִמּ/וֹ֙ חֶ֔סֶד בַּ/עֲב֖וּר יְהוֹנָתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/001.yaml
  text: David said[a], “Is there still anyone left of the house of Saul, that I may show kindness to him for Jonathan’s sake?”
translation:
  language: id
  text: Daud berkata, “Masih adakah orang dari keluarga Saul yang tersisa, yang dapat kutunjukkan kebaikan[a] kepadanya demi Yonatan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih setia” atau “kesetiaan perjanjian”; kata Ibrani ini sering menyatakan kebaikan yang setia atau loyal, bukan sekadar perasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: אמר adalah verba naratif umum untuk ‘berkata’. Meskipun ucapan berikutnya berupa pertanyaan, bentuk sumber tetap paling tepat diterjemahkan ‘berkata’.
- source_word: הֲכִי יֶשׁ עוֹד
  choice: Masih adakah
  rationale: Gabungan partikel tanya dengan יֶשׁ עוֹד menanyakan apakah seseorang masih ada; ‘Masih adakah’ alami dan ringkas dalam bahasa Indonesia.
- source_word: אֲשֶׁר נוֹתַר
  choice: orang yang tersisa
  rationale: נותר menunjuk kepada orang yang masih hidup atau tetap ada; ‘tersisa’ mempertahankan gagasan penyintas tanpa mempersempitnya secara berlebihan.
- source_word: לְבֵית שָׁאוּל
  choice: dari keluarga Saul
  rationale: בית di sini mengacu pada keluarga atau wangsa Saul, bukan bangunan. ‘Keluarga Saul’ paling mudah dipahami pembaca modern dan tetap memuat makna rumah tangga dinastik.
- source_word: וְאֶעֱשֶׂה עִמּוֹ חֶסֶד
  choice: Aku hendak menunjukkan kasih setia kepadanya
  rationale: עשה dengan חסד merupakan ungkapan untuk melakukan atau menunjukkan kebaikan yang setia. ‘Hendak’ menyampaikan maksud Daud, sedangkan ‘kasih setia’ mempertahankan unsur kebaikan dan loyalitas.
- source_word: בַּעֲבוּר יְהוֹנָתָן
  choice: demi Yonatan
  rationale: בעבור menyatakan alasan atau kepentingan seseorang; ‘demi Yonatan’ idiomatis dan menunjukkan bahwa tindakan Daud didasarkan pada hubungannya dengan Yonatan.
theological_decisions:
- issue: Nuansa חֶסֶד dalam tindakan Daud terhadap keluarga Saul
  choice: kasih setia
  alternative: kebaikan; kemurahan; kesetiaan perjanjian
  rationale: Dalam konteks hubungan Daud dengan Yonatan, חסד melampaui kebaikan sesaat dan mencakup loyalitas yang diwujudkan dalam tindakan. ‘Kasih setia’ menjaga keluasan ini tanpa secara eksplisit memasukkan istilah teknis ‘perjanjian’ ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk ‘Masih adakah’ menjaga sifat pertanyaan, ‘keluarga Saul’ menjelaskan makna dinastik בית secara wajar, dan ‘kasih setia’ mempertahankan bobot relasional חסד.
