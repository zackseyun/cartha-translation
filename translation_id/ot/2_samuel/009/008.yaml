translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Sapaan “engkau” mempertahankan bentuk tunggal dan cocok untuk ujaran langsung kepada raja; “hamba” mempertahankan bahasa penghormatan istana. Citra Ibrani yang keras tetap dipertahankan tanpa diperhalus.
