  text: וַ/יֹּ֤אמֶר צִיבָא֙ אֶל הַ/מֶּ֔לֶךְ כְּ/כֹל֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ אֶת עַבְדּ֔/וֹ כֵּ֖ן יַעֲשֶׂ֣ה עַבְדֶּ֑/ךָ וּ/מְפִיבֹ֗שֶׁת אֹכֵל֙ עַל שֻׁלְחָנִ֔/י כְּ/אַחַ֖ד מִ/בְּנֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/011.yaml
  text: Ziba said to the king[a], “According to all that my lord the king commands his servant[b], so your servant will do.” And Mephibosheth ate at my table like one of the king’s sons.
translation:
  language: id
  text: Ziba berkata kepada raja, “Segala yang diperintahkan tuanku raja kepada hambanya akan hamba lakukan.” Mefiboset makan di mejaku[a] seperti salah seorang anak raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mejaku.” Pergeseran ke orang pertama dalam teks Ibrani sulit dijelaskan. Sejumlah terjemahan, dengan dukungan beberapa versi kuno, memakai “meja raja.”'
    reason: Menjelaskan kesulitan sudut pandang dalam teks Masoret dan mencatat pembacaan alternatif tanpa menghapus bentuk sumber dari teks utama.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara alami memperkenalkan ucapan langsung dengan 'berkata'.
- source_word: כְּכֹל אֲשֶׁר יְצַוֶּה
  choice: Segala yang diperintahkan
  rationale: Mengungkapkan cakupan menyeluruh dan perintah raja secara wajar dalam bahasa Indonesia tanpa kehilangan daya komprehensif frasa Ibrani.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Sapaan istana yang hormat; 'tuanku' merupakan padanan Indonesia yang alami bagi אֲדֹנִי dalam konteks menghadap raja.
- source_word: עַבְדּוֹ / עַבְדֶּךָ
  choice: hambanya / hamba
  rationale: Dalam konteks ini עבד adalah sebutan merendahkan diri dalam pelayanan kerajaan. Pergeseran orang ketiga ke orang pertama dipertahankan secara idiomatis melalui 'hambanya' dan 'hamba'.
- source_word: כֵּן יַעֲשֶׂה
  choice: akan hamba lakukan
  rationale: Menyampaikan janji ketaatan yang terkandung dalam bentuk imperfek dan korelasi כֵּן secara alami.
- source_word: אֹכֵל
  choice: makan
  rationale: Partisipel dapat menyatakan keadaan atau kebiasaan yang berlangsung; bentuk 'makan' dalam konteks naratif Indonesia cukup luwes untuk menyatakan pengaturan tetap tanpa memaksakan aspek progresif.
- source_word: עַל שֻׁלְחָנִי
  choice: di mejaku
  rationale: Mempertahankan sufiks orang pertama tunggal pada teks Masoret, sementara 'di meja' adalah ungkapan Indonesia yang wajar untuk persekutuan makan.
- source_word: כְּאַחַד מִבְּנֵי הַמֶּלֶךְ
  choice: seperti salah seorang anak raja
  rationale: Mempertahankan perbandingan dan kedudukan kekeluargaan/kerajaan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penutur frasa 'mejaku' pada klausa terakhir
  choice: Mempertahankan bentuk orang pertama 'mejaku' sesuai teks Masoret.
  alternative: Menerjemahkan 'di meja raja' berdasarkan pembacaan klausa sebagai ringkasan narator dan dukungan sejumlah versi kuno.
  rationale: Teks Ibrani WLC secara eksplisit berbunyi שֻׁלְחָנִי, 'mejaku'. Pergeseran sudut pandang memang sulit, tetapi mengubahnya menjadi 'meja raja' akan meniadakan ketegangan tekstual. Teks utama mempertahankan bentuk MT dan catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan 'tuanku raja' serta sebutan diri 'hamba' mempertahankan nuansa istana tanpa terdengar terlalu arkais. Nama מְפִיבֹשֶׁת ditulis 'Mefiboset' sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
