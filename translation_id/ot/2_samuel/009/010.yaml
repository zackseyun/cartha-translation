  to: Engkau, anak-anakmu, dan budak-budakmu harus menggarap tanah itu baginya. Kamu harus membawa hasil panennya, dan hasil itu akan menjadi makanan[a] bagi anak tuanmu, lalu ia akan memakannya. Tetapi Mefiboset, anak tuanmu, akan selalu makan di mejaku.” Ziba mempunyai lima belas anak laki-laki dan dua puluh budak.
