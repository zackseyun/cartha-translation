  - severity: low
    issue: Pilihan sapaan "Kamu"
    rationale: Tidak salah, tetapi "Engkau" lebih sesuai dengan register titah kerajaan dalam terjemahan Indonesia baku, sambil tetap modern dan mudah dipahami.
