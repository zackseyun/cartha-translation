  text: וְ/עָבַ֣דְתָּ לּ֣/וֹ אֶֽת הָ/אֲדָמָ֡ה אַתָּה֩ וּ/בָנֶ֨י/ךָ וַ/עֲבָדֶ֜י/ךָ וְ/הֵבֵ֗אתָ וְ/הָיָ֨ה לְ/בֶן אֲדֹנֶ֤י/ךָ לֶּ֨חֶם֙ וַ/אֲכָל֔/וֹ וּ/מְפִיבֹ֨שֶׁת֙ בֶּן אֲדֹנֶ֔י/ךָ יֹאכַ֥ל תָּמִ֛יד לֶ֖חֶם עַל שֻׁלְחָנִ֑/י וּ/לְ/צִיבָ֗א חֲמִשָּׁ֥ה עָשָׂ֛ר בָּנִ֖ים וְ/עֶשְׂרִ֥ים עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/010.yaml
  text: You and your sons and your servants shall work the land for him[a], and you shall bring in the produce, and it shall be bread for your master's son, and he shall eat it. But Mephibosheth, your master's son, shall always eat bread at my table. Now Ziba had fifteen sons and twenty servants.
translation:
  language: id
  text: Engkau, anak-anakmu, dan budak-budakmu harus menggarap tanah itu baginya. Kamu harus membawa hasil panennya, dan hasil itu akan menjadi makanan[a] bagi anak tuanmu, lalu ia akan memakannya. Tetapi Mefiboset, anak tuanmu, akan selalu makan di mejaku.” Ziba mempunyai lima belas anak laki-laki dan dua puluh budak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti”; kata Ibrani ini juga dapat berarti makanan atau persediaan pangan dalam konteks ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַדְתָּ לּוֹ אֶת הָאֲדָמָה
  choice: harus menggarap tanah itu baginya
  rationale: Kata עבד dengan objek אֲדָמָה menunjuk pada pekerjaan pertanian untuk kepentingan Mefiboset. “Menggarap tanah” alami dalam bahasa Indonesia dan mempertahankan penerima manfaatnya.
- source_word: אַתָּה וּבָנֶיךָ וַעֲבָדֶיךָ
  choice: kamu, anak-anakmu, dan budak-budakmu
  rationale: עֲבָדִים di sini menunjuk pada tenaga kerja rumah tangga yang berada dalam status perbudakan, bukan sekadar pegawai atau pelayan biasa.
- source_word: וְהֵבֵאתָ
  choice: membawa masuk hasil panennya
  rationale: Objek verba “membawa masuk” tersirat dari konteks penggarapan tanah. “Hasil panennya” menjelaskan rujukan tersebut tanpa menambahkan gagasan baru.
- source_word: וְהָיָה לְבֶן אֲדֹנֶיךָ לֶּחֶם וַאֲכָלוֹ
  choice: agar anak tuanmu mempunyai makanan dan dapat memakannya
  rationale: לֶחֶם secara harfiah berarti “roti”, tetapi dalam konteks ini dapat berarti makanan atau persediaan pangan. Susunan Indonesia ini menyampaikan fungsi hasil panen dan mempertahankan pronomina objek pada וַאֲכָלוֹ.
- source_word: וּמְפִיבֹשֶׁת ... יֹאכַל תָּמִיד לֶחֶם עַל שֻׁלְחָנִי
  choice: Tetapi Mefiboset ... akan selalu makan di mejaku
  rationale: Kata penghubung ו dipahami sebagai pertentangan kontekstual, sedangkan ungkapan “makan di mejaku” secara alami menyatakan pemeliharaan dan persekutuan tetap di meja raja.
- source_word: וּלְצִיבָא חֲמִשָּׁה עָשָׂר בָּנִים וְעֶשְׂרִים עֲבָדִים
  choice: Ziba mempunyai lima belas anak laki-laki dan dua puluh budak
  rationale: Klausa tanpa verba ini memberikan informasi latar; “mempunyai” dipasok sesuai tata bahasa Indonesia. בָּנִים diterjemahkan khusus sebagai anak laki-laki, dan עֲבָדִים sebagai budak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “kamu” mengikuti sapaan langsung raja kepada Ziba. Istilah “budak” dipakai untuk mempertahankan status sosial-ekonomi yang dinyatakan oleh עֶבֶד, sedangkan idiom makan di meja raja disampaikan secara alami.
