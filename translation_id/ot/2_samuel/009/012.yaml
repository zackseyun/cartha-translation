  text: וְ/לִ/מְפִיבֹ֥שֶׁת בֵּן קָטָ֖ן וּ/שְׁמ֣/וֹ מִיכָ֑א וְ/כֹל֙ מוֹשַׁ֣ב בֵּית צִיבָ֔א עֲבָדִ֖ים לִ/מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/012.yaml
  text: Mephibosheth had a young son[a], and his name was Mica[b]. And all who lived in the house of Ziba were servants to Mephibosheth.
translation:
  language: id
  text: Mefiboset mempunyai seorang anak laki-laki yang masih kecil, bernama Mikha. Semua orang yang tinggal di rumah Ziba[a] adalah hamba[b] Mefiboset.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seluruh isi rumah Ziba.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hamba” juga dapat berarti “budak,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְפִיבֹשֶׁת
  choice: Mefiboset mempunyai
  rationale: Konstruksi לְ yang menyatakan kepunyaan dialihkan secara wajar ke dalam bahasa Indonesia dengan “mempunyai”; waw pembuka dipahami sebagai penghubung alur dan tidak perlu diterjemahkan secara mekanis.
- source_word: בֵּן קָטָן
  choice: seorang anak laki-laki yang masih kecil
  rationale: בֵּן berarti “anak laki-laki/putra,” sedangkan קָטָן dalam konteks ini menunjuk pada usia muda atau keadaan masih kecil, bukan perawakan.
- source_word: וּ/שְׁמ/וֹ מִיכָא
  choice: bernama Mikha
  rationale: Ungkapan ini secara harfiah berarti “dan namanya Mikha.” Bentuk “bernama Mikha” alami dalam bahasa Indonesia dan mempertahankan identifikasi anak tersebut. Ejaan “Mikha” mengikuti bentuk nama Ibrani מִיכָא dan kelaziman nama Alkitab dalam bahasa Indonesia.
- source_word: וְ/כֹל מוֹשַׁב בֵּית צִיבָא
  choice: Semua orang yang tinggal di rumah Ziba
  rationale: מוֹשַׁב berkaitan dengan tempat tinggal atau mereka yang mendiami suatu tempat. Terjemahan ini mengungkapkan secara jelas rujukan kolektifnya tanpa membatasi makna hanya pada keluarga sedarah.
- source_word: עֲבָדִים
  choice: hamba
  rationale: עֶבֶד dapat menunjuk kepada hamba atau budak. Dalam konteks penataan pelayanan rumah tangga bagi Mefiboset, “hamba” cocok sebagai teks utama, sedangkan kemungkinan “budak” dipertahankan dalam catatan kaki.
- source_word: לִ/מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Sesudah kata “hamba,” hubungan yang ditandai לְ dapat dinyatakan secara alami sebagai “hamba Mefiboset,” yakni orang-orang yang melayani dia, tanpa harus menambahkan kata depan.
