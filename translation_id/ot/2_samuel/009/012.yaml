translation_notes:
  register: 'Bahasa Indonesia modern yang lugas dan bermartabat. Nama diri memakai bentuk yang lazim dalam Alkitab bahasa Indonesia: Mefiboset, Mikha, dan Ziba. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan; susunan penanda pada lapisan konsultasi Inggris tampaknya tidak sesuai dengan isi catatannya.'
