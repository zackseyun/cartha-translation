base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/004.yaml
  text: The king said to him, “Where is he?” Ziba said to the king, “Look, he is in the house of Machir son of Ammiel, in Lo-debar.”
translation:
  language: id
  text: Raja bertanya kepadanya, “Di manakah dia?” Ziba menjawab kepada raja, “Dia ada di rumah Makhir anak Amiel, di Lo-Debar.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Dia ada
  rationale: Dalam jawaban langsung ini, הִנֵּה berfungsi menunjukkan atau menegaskan keberadaan orang yang ditanyakan. Bahasa Indonesia alami tidak memerlukan seruan harfiah seperti “Lihatlah”; nuansanya terwakili oleh jawaban tegas “Dia ada”.
- source_word: בֵּית מָכִיר
  choice: di rumah Makhir
  rationale: Menerjemahkan konstruksi tempat secara langsung dan mempertahankan nama diri Ibrani dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בְּלוֹ דְבָר
  choice: di Lo-Debar
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan, karena berfungsi sebagai toponim.
