translation:
  language: id
  text: Lalu Raja Daud mengutus orang untuk menjemput dia dari rumah Makhir anak Amiel di Lo-Debar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu Raja Daud mengutus dan mengambil dia dari rumah Makhir anak Amiel, dari Lo-Debar.” Urutan kata Ibrani memakai dua kata kerja, “mengutus” dan “mengambil dia,” yang dalam konteks ini dapat diungkapkan secara idiomatis sebagai “mengutus orang untuk menjemput dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata kerja שׁלח berarti “mengutus/mengirim.” Dalam konteks ini, objek yang diutus tidak disebutkan, sehingga “mengutus orang” menyampaikan maksud Ibrani secara wajar dalam bahasa Indonesia tanpa menentukan siapa utusan itu.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Ungkapan aposisional Ibrani paling alami diterjemahkan sebagai gelar diikuti nama.
- source_word: וַיִּקָּחֵהוּ
  choice: untuk menjemput dia
  rationale: לקח secara dasar berarti “mengambil,” tetapi setelah “mengutus” dalam konteks ini menunjuk pada tindakan membawa orang tersebut kepada raja. “Menjemput dia” menghasilkan urutan yang alami dalam bahasa Indonesia sambil mempertahankan hubungan kedua verba; kemungkinan terjemahan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: מִבֵּית
  choice: dari rumah
  rationale: בַּיִת dapat berarti rumah fisik maupun rumah tangga. “Rumah” mempertahankan ambiguitas itu secara cukup alami dalam konteks Indonesia.
- source_word: מָכִיר בֶּן עַמִּיאֵל
  choice: Makhir anak Amiel
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dan dekat dengan bunyi Ibrani; konstruksi patronimik בֶּן diterjemahkan “anak.”
- source_word: מִלּוֹ דְבָר
  choice: di Lo-Debar
  rationale: Lo-Debar dipahami sebagai nama tempat. Walaupun Ibrani mengulang preposisi מִן (“dari”), dalam bahasa Indonesia frasa ini secara alami menjelaskan lokasi rumah Makhir dengan “di”; bentuk lebih harfiah dicatat sebagai alternatif.
