  text: וַ֠/יָּבֹא מְפִיבֹ֨שֶׁת בֶּן יְהוֹנָתָ֤ן בֶּן שָׁאוּל֙ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל עַל פָּנָ֖י/ו וַ/יִּשְׁתָּ֑חוּ וַ/יֹּ֤אמֶר דָּוִד֙ מְפִיבֹ֔שֶׁת וַ/יֹּ֖אמֶר הִנֵּ֥ה עַבְדֶּֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/006.yaml
  text: Mephibosheth son of Jonathan, son of Saul, came to David and fell on his face and bowed down. David said, “Mephibosheth,” and he said, “Here is your servant.”
translation:
  language: id
  text: Mefiboset, anak Yonatan, cucu Saul, datang menghadap Daud. Ia tersungkur dengan wajah ke tanah lalu sujud. Daud berkata, “Mefiboset!” Ia menjawab, “Inilah hambamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: anak Yonatan, cucu Saul
  rationale: Bahasa Ibrani memakai ‘anak ... anak ...’; dalam bahasa Indonesia, ‘cucu Saul’ menyampaikan hubungan silsilah secara alami dan tepat.
- source_word: אֶל דָּוִד
  choice: menghadap Daud
  rationale: Dalam konteks kedatangan seorang bawahan kepada raja, ‘menghadap’ lebih alami daripada sekadar ‘kepada’, tanpa menambah gagasan baru.
- source_word: וַיִּפֹּל עַל פָּנָיו וַיִּשְׁתָּחוּ
  choice: Ia sujud dengan muka sampai ke tanah
  rationale: Kedua verba menggambarkan tindakan merendahkan diri dengan menjatuhkan diri pada wajah lalu bersujud; terjemahan ini menyatukannya secara alami sambil mempertahankan gambaran fisiknya.
- source_word: הִנֵּה עַבְדֶּךָ
  choice: Inilah hambamu
  rationale: Mempertahankan unsur penunjuk הִנֵּה dan ungkapan penghormatan orang pertama ‘hambamu’ dalam bentuk Indonesia yang ringkas dan bermartabat.
theological_decisions: []
