  text: וַ/יִּקְרָ֣א הַ/מֶּ֗לֶךְ אֶל צִיבָ֛א נַ֥עַר שָׁא֖וּל וַ/יֹּ֣אמֶר אֵלָ֑י/ו כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה לְ/שָׁאוּל֙ וּ/לְ/כָל בֵּית֔/וֹ נָתַ֖תִּי לְ/בֶן אֲדֹנֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/009.yaml
  text: Then the king called Ziba[a], Saul’s servant, and said to him[c][b], “All that belonged to Saul and to all his house I have given to your master’s son.”
translation:
  language: id
  text: Kemudian raja memanggil Ziba, pelayan Saul,[a] dan berkata kepadanya, “Segala sesuatu yang menjadi milik Saul dan seluruh rumah tangganya[b] telah kuberikan kepada anak tuanmu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani נַעַר juga dapat diterjemahkan “anak muda” atau “pengiring”; di sini kemungkinan besar menunjuk pada seorang pelayan atau anggota rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan kepada seluruh rumahnya.” Dalam konteks ini, “rumah” dapat mencakup rumah tangga Saul beserta harta atau tanah miliknya.
    reason: lexical_alternative
  - marker: c
    text: “Anak tuanmu” menunjuk kepada Mefiboset. Ia adalah anak Yonatan dan cucu Saul; kata “anak” dapat dipakai dengan cakupan keturunan yang lebih luas.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: pelayan
  rationale: Walaupun kata ini dapat berarti “anak muda,” dalam konteks rumah tangga Saul kata tersebut menunjuk pada kedudukan Ziba sebagai pelayan atau pengikut rumah tangga.
- source_word: כֹּל אֲשֶׁר הָיָה לְשָׁאוּל
  choice: Segala sesuatu yang dahulu menjadi milik Saul
  rationale: Ungkapan harfiah “yang ada pada Saul” menyatakan kepemilikan; pilihan ini menyampaikannya dengan jelas dalam bahasa Indonesia modern.
- source_word: וּלְכָל בֵּיתוֹ
  choice: dan seisi rumahnya
  rationale: Kata בַּיִת dapat mencakup rumah tangga, keluarga, atau harta keluarga. “Seisi rumahnya” mempertahankan keluasan makna tanpa membatasinya hanya pada bangunan atau keluarga inti.
- source_word: נָתַתִּי
  choice: telah kuberikan
  rationale: Bentuk perfektif menyatakan tindakan yang sudah dilakukan dan hasilnya tetap berlaku ketika raja berbicara.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: kepada anak tuanmu
  rationale: Terjemahan ini mempertahankan bentuk relasional teks Ibrani. “Tuan” menunjuk pada atasan manusia, bukan gelar ilahi, sedangkan “anak” mempertahankan istilah kekerabatan yang dipakai teks.
- source_word: וַיִּקְרָא ... וַיֹּאמֶר
  choice: Kemudian ... memanggil ... lalu berkata
  rationale: Rangkaian waw-konsekutif memajukan alur cerita; “kemudian” dan “lalu” menghasilkan narasi Indonesia yang alami.
theological_decisions:
- issue: Identitas “anak tuanmu”
  choice: Mempertahankan ungkapan “anak tuanmu” dalam teks utama
  alternative: Menggantikannya dengan “Mefiboset” atau “keturunan tuanmu”
  rationale: Teks Ibrani memakai בֵּן (“anak”) dan tidak menyebut nama dalam ayat ini. Catatan menjelaskan rujukannya tanpa menghapus bentuk dan kemungkinan cakupan istilah kekerabatan dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan istilah sosial dan kekerabatan teks Ibrani. Bentuk terikat “kuberikan” dipakai secara wajar dalam ujaran langsung raja.
