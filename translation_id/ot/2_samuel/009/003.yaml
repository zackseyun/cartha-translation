revisions:
- from: Lalu raja berkata, “Apakah masih ada orang yang tersisa dari keluarga Saul, supaya aku dapat menunjukkan kepadanya kasih setia Allah[a]?” Ziba berkata kepada raja, “Masih ada seorang anak laki-laki Yonatan yang kedua kakinya tidak dapat berfungsi dengan baik[b].”
  to: Lalu raja berkata, “Apakah masih ada orang yang tersisa dari keluarga Saul, supaya aku dapat menunjukkan kebaikan Allah[a] kepada orang itu?” Ziba berkata kepada raja, “Masih ada seorang putra Yonatan yang pincang pada kedua kakinya[b].”
  rationale: Revisi mempertahankan makna naratif dan ambiguitas yang wajar dalam חֶסֶד אֱלֹהִים, sambil memakai susunan Indonesia yang lebih alami. Keterangan tentang keadaan putra Yonatan dibuat lebih dekat dengan נְכֵה רַגְלָיִם dan catatan kaki dibersihkan dari klaim harfiah atau alternatif yang terlalu spesifik.
