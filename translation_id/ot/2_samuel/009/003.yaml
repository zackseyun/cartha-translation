base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/003.yaml
  text: Then the king said[a], “Is there still anyone left of the house of Saul, that I may show him the kindness of God?” Ziba said to the king, “There is still a son of Jonathan[b], crippled in his feet.”
translation:
  language: id
  text: Lalu raja berkata, “Apakah masih ada orang yang tersisa dari keluarga Saul, supaya aku dapat menunjukkan kebaikan Allah[a] kepada orang itu?” Ziba berkata kepada raja, “Masih ada seorang putra Yonatan yang pincang pada kedua kakinya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih setia Allah”; frasa ini juga dapat menunjuk pada kebaikan yang mencerminkan Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang mengalami gangguan pada kedua kakinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֶפֶס עוֹד אִישׁ
  choice: Apakah masih ada orang yang tersisa
  rationale: Pertanyaan ini menanyakan apakah masih ada seseorang yang hidup atau tersisa; susunan positif ini alami dalam bahasa Indonesia dan tidak menimbulkan ambiguitas dari pertanyaan negatif.
- source_word: לְבֵית שָׁאוּל
  choice: dari keluarga Saul
  rationale: בֵּית di sini menunjuk pada keluarga atau garis keturunan Saul, bukan bangunan fisik; 'keluarga Saul' jelas dan wajar bagi pembaca modern.
- source_word: וְאֶעֱשֶׂה עִמּוֹ
  choice: supaya aku dapat menunjukkan kepadanya
  rationale: Dengan חֶסֶד, verba עשה secara idiomatis diterjemahkan 'menunjukkan'; bentuk kohortatif menyatakan maksud atau keinginan raja.
- source_word: חֶסֶד אֱלֹהִים
  choice: kasih setia Allah
  rationale: חֶסֶד mencakup kebaikan, kasih, dan kesetiaan relasional; 'kasih setia' mempertahankan bobot istilah itu, sedangkan konstruksi dengan אֱלֹהִים dibiarkan sebagai genitif yang tidak dipersempit.
- source_word: עוֹד בֵּן לִיהוֹנָתָן
  choice: Masih ada seorang anak laki-laki Yonatan
  rationale: Terjemahan ini mempertahankan penekanan bahwa seorang keturunan Yonatan masih ada; 'anak laki-laki' memperjelas בֵּן tanpa menyatakan usia.
- source_word: נְכֵה רַגְלָיִם
  choice: yang kedua kakinya tidak dapat berfungsi dengan baik
  rationale: Ungkapan ini menyampaikan keterbatasan fisik pada kedua kaki secara jelas, akurat, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nuansa חֶסֶד אֱלֹהִים
  choice: kasih setia Allah
  alternative: kebaikan Allah; kasih perjanjian Allah; kasih setia yang berkenan kepada Allah
  rationale: Konstruksi Ibrani dapat menunjuk pada kasih setia yang berasal dari Allah, mencerminkan sifat Allah, atau sangat besar. Teks utama mempertahankan bentuk genitif yang luas dan tidak menentukan satu tafsiran secara eksklusif; catatan kaki menyatakan kemungkinannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah disabilitas dirumuskan secara netral dan tidak merendahkan. Nama יהונתן ditulis 'Yonatan' menurut kelaziman ejaan Alkitab bahasa Indonesia.
