  text: וּ/לְ/בֵ֨ית שָׁא֥וּל עֶ֨בֶד֙ וּ/שְׁמ֣/וֹ צִיבָ֔א וַ/יִּקְרְאוּ ל֖/וֹ אֶל דָּוִ֑ד וַ/יֹּ֨אמֶר הַ/מֶּ֧לֶךְ אֵלָ֛י/ו הַ/אַתָּ֥ה צִיבָ֖א וַ/יֹּ֥אמֶר עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/009/002.yaml
  text: The house of Saul had a servant whose name was Ziba[a], and they called him to David. And the king said to him, “Are you Ziba?” And he said, “Your servant.”
translation:
  language: id
  text: Keluarga Saul mempunyai seorang hamba bernama Ziba. Mereka memanggilnya menghadap Daud. Raja bertanya kepadanya, “Apakah engkau Ziba?” Ia menjawab, “Hambamu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih lengkap, “Aku hambamu.” Jawaban Ibraninya berbentuk elipsis: “Hambamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/בֵית שָׁאוּל
  choice: Keluarga Saul mempunyai
  rationale: Ungkapan berpreposisi ini menyatakan kepemilikan atau keterkaitan. Dalam bahasa Indonesia, bentuk alami yang tetap dekat dengan maknanya ialah “Keluarga Saul mempunyai”; waw awal tidak perlu diberi penanda waktu yang tidak tersurat.
- source_word: עֶבֶד
  choice: seorang hamba
  rationale: עֶבֶד dapat berarti budak atau hamba. Dalam konteks ini, Ziba adalah bawahan dalam lingkungan rumah tangga Saul; “hamba” mempertahankan kedudukan sosialnya tanpa memastikan secara berlebihan status hukum perbudakannya.
- source_word: וּ/שְׁמ/וֹ צִיבָא
  choice: bernama Ziba
  rationale: Ungkapan harfiah “dan namanya Ziba” wajar dan ringkas diterjemahkan “bernama Ziba” dalam narasi Indonesia modern.
- source_word: וַ/יִּקְרְאוּ ל/וֹ אֶל דָּוִד
  choice: Mereka memanggilnya menghadap Daud
  rationale: קרא dengan tujuan אֶל־דָּוִד menyatakan pemanggilan ke hadapan Daud. “Menghadap” memperjelas situasi audiensi kerajaan secara alami tanpa mengubah pelaku jamak yang tidak disebutkan identitasnya.
- source_word: הַ/מֶּלֶךְ
  choice: Raja
  rationale: Gelar definit ini merujuk kepada Daud. Dalam bahasa Indonesia, “Raja” dapat digunakan tanpa artikel karena definitnya sudah jelas dari konteks.
- source_word: הַ/אַתָּה צִיבָא
  choice: Apakah engkau Ziba?
  rationale: Partikel tanya הֲ dan pronomina אַתָּה membentuk pertanyaan identitas langsung. “Engkau” sesuai dengan suasana naratif yang khidmat dan percakapan kerajaan.
- source_word: עַבְדֶּךָ
  choice: Hambamu
  rationale: Jawaban Ibrani berbentuk elipsis, secara harfiah “hambamu”. Bentuk ini dipertahankan untuk menjaga keringkasan dan sikap merendah dalam bahasa istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hamba” dan “engkau” mempertahankan suasana percakapan kerajaan. Susunan kalimat dibuat alami bagi pembaca masa kini, sementara jawaban eliptis Ziba tetap dipertahankan dan dijelaskan melalui catatan kaki.
