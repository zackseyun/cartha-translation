base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/012.yaml
  text: Then David went and took the bones of Saul and the bones of Jonathan his son from the citizens of Jabesh-gilead[a], who had stolen them from the public square of Beth-shan[c][b], where the Philistines had hung them on the day the Philistines struck down Saul on Gilboa.
translation:
  language: id
  text: Lalu Daud pergi dan mengambil tulang-tulang Saul dan tulang-tulang Yonatan, anaknya, dari penduduk Yabesh-Gilead, yang telah mencuri tulang-tulang itu dari lapangan kota Bet-Sean, tempat orang Filistin menggantung tulang-tulang itu pada hari orang Filistin menewaskan Saul di Gilboa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata "menggantung" juga dapat diterjemahkan "memajang"; dalam pembacaan yang lebih kuat, "memancangkan." Kata Ibraninya sendiri paling langsung berarti "menggantung."
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמוֹת
  choice: tulang-tulang
  rationale: Nomina Ibrani ini secara harfiah berarti tulang-tulang; bentuk konkret tersebut tetap wajar dalam konteks pengambilan dan penguburan jenazah.
- source_word: בַּעֲלֵי יָבֵישׁ גִּלְעָד
  choice: penduduk Yabesh-Gilead
  rationale: Dalam konstruksi dengan nama tempat, בַּעֲלֵי menunjuk pada orang-orang atau penduduk yang terkait dengan kota itu, bukan para pemilik secara harfiah.
- source_word: גָּנְבוּ
  choice: telah mencurinya
  rationale: Verba ini berarti mencuri; 'telah' menunjukkan bahwa tindakan penduduk Yabesh-Gilead terjadi sebelum Daud mengambil tulang-tulang itu.
- source_word: מֵרְחֹב בֵּית שַׁן
  choice: dari lapangan kota Bet-Sean
  rationale: רְחֹב menunjuk pada ruang terbuka atau lapangan umum di kota; 'lapangan kota' alami dan jelas dalam bahasa Indonesia.
- source_word: תלו/ם שם
  choice: menggantung mereka
  rationale: Bentuk teks yang ditampilkan merepresentasikan verba תלה, yang arti langsungnya adalah menggantung. Terjemahan ini tidak mempersempit makna menjadi 'menusuk pada tiang' ataupun memperluasnya menjadi sekadar 'memajang'.
- source_word: הַכּוֹת ... אֶת שָׁאוּל
  choice: menewaskan Saul
  rationale: Dalam konteks kekalahan dan kematian Saul, נכה dengan Saul sebagai objek menyatakan pukulan mematikan; 'menewaskan' jelas dan idiomatis.
- source_word: בַּגִּלְבֹּעַ
  choice: di Gilboa
  rationale: Teks hanya menyebut Gilboa tanpa kata 'gunung'; preposisi Indonesia 'di' menyatakan lokasi tanpa menambahkan unsur yang tidak eksplisit.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonatan, anaknya
  rationale: Aposisi Ibrani dipertahankan. Dalam konteks terdekat, pronomina merujuk kepada Saul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama tempat ditransliterasikan sebagai Yabesh-Gilead, Bet-Sean, dan Gilboa. Kalimat relatif panjang sumber dipecah menjadi dua kalimat agar rujukan pelaku jelas tanpa mengubah urutan peristiwa.
