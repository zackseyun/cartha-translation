  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תְּהִי ע֧וֹד מִלְחָמָ֛ה לַ/פְּלִשְׁתִּ֖ים אֶת יִשְׂרָאֵ֑ל וַ/יֵּ֨רֶד דָּוִ֜ד וַ/עֲבָדָ֥י/ו עִמּ֛/וֹ וַ/יִּלָּחֲמ֥וּ אֶת פְּלִשְׁתִּ֖ים וַ/יָּ֥עַף דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/015.yaml
  text: And there was war again between the Philistines and Israel[a], and David went down with his servants with him, and they fought against the Philistines, and David grew weary.
translation:
  language: id
  text: Peperangan kembali terjadi antara orang Filistin dan Israel. Daud turun bersama hamba-hambanya[a], lalu mereka berperang melawan orang Filistin. Daud pun menjadi letih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orangnya.” Dalam bahasa Ibrani tertulis “hamba-hambanya,” ungkapan umum bagi orang-orang yang melayani seorang raja, termasuk para pengikut militernya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: Peperangan kembali terjadi
  rationale: Mengungkapkan munculnya kembali keadaan perang secara alami dalam bahasa Indonesia, dengan עוֹד dipahami sebagai pengulangan permusuhan.
- source_word: לַפְּלִשְׁתִּים אֶת יִשְׂרָאֵל
  choice: antara orang Filistin dan Israel
  rationale: Konstruksi Ibrani menyatakan dua pihak yang saling berhadapan; bentuk 'antara ... dan ...' jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Mempertahankan arti dasar ירד serta kemungkinan nuansa geografis atau gerak menuju medan pertempuran.
- source_word: וַעֲבָדָיו עִמּוֹ
  choice: bersama hamba-hambanya
  rationale: Menyampaikan baik עֲבָדָיו maupun עִמּוֹ tanpa pengulangan yang kaku; dalam konteks kerajaan dan militer, para hamba ini adalah orang-orang yang melayani raja dan dapat mencakup pengikut militernya.
- source_word: וַיִּלָּחֲמוּ אֶת פְּלִשְׁתִּים
  choice: mereka berperang melawan orang Filistin
  rationale: Padanan langsung dan alami untuk tindakan ikut bertempur melawan pihak Filistin.
- source_word: וַיָּעַף
  choice: menjadi letih
  rationale: 'Menjaga nuansa ingresif verba tersebut: Daud sampai pada keadaan letih atau lemah dalam pertempuran.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mengalir sebagai narasi, sambil mempertahankan pengulangan perang, gerak Daud yang 'turun', konteks pelayanan kerajaan pada עֲבָדָיו, serta keadaan Daud yang mulai letih.
