  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד הַ/גִּבְעֹנִ֗ים וַ/יֹּקִיעֻ֤/ם בָּ/הָר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יִּפְּל֥וּ שבעתים יָ֑חַד ו/הם הֻמְת֜וּ בִּ/ימֵ֤י קָצִיר֙ בָּ/רִ֣אשֹׁנִ֔ים תחלת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/009.yaml
  text: He gave them into the hand of the Gibeonites[a], and they hanged them on the mountain before Yahweh, and the seven of them fell together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
translation:
  language: id
  text: Ia menyerahkan mereka ke dalam tangan orang-orang Gibeon[a]. Orang-orang Gibeon menggantung mereka di gunung itu di hadapan Yahweh, dan ketujuh orang itu rebah bersama-sama. Mereka dihukum mati pada hari-hari pertama musim panen, yaitu pada awal panen jelai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyulakan mereka” atau “memajang mereka di depan umum.” Kata kerja Ibrani ini dapat mengacu secara lebih luas pada penggantungan atau pemajangan secara terbuka, bukan hanya pada menggantung dalam arti sempit pada masa kini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Ia menyerahkan mereka ke dalam tangan
  rationale: Gabungan נתן dengan בְּיַד merupakan idiom penyerahan ke dalam kuasa atau kendali pihak lain. 'Menyerahkan' menyampaikan daya yuridisnya, sedangkan 'ke dalam tangan' mempertahankan gambaran Ibraninya yang masih mudah dipahami dalam bahasa Indonesia.
- source_word: הַגִּבְעֹנִים
  choice: orang-orang Gibeon
  rationale: Bentuk ini secara alami menyebut kelompok penduduk atau keturunan Gibeon dalam bahasa Indonesia.
- source_word: וַיֹּקִיעֻם
  choice: menggantung mereka
  rationale: Kata kerja יקע menunjuk pada eksekusi atau pemajangan tubuh secara terbuka, mungkin dengan menggantung atau menyulakan. Pilihan utama dibuat alami bagi pembaca, sementara ketidakpastian mengenai caranya dipertahankan dalam catatan kaki.
- source_word: בָּהָר
  choice: di gunung
  rationale: Mencerminkan nomina tunggal definit הַר tanpa mempersempitnya menjadi bukit atau kawasan pegunungan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan makna tindakan yang dilakukan di hadapan atau dalam kehadiran ilahi serta nama diri perjanjian יהוה.
- source_word: וַיִּפְּלוּ שבעתים יָחַד
  choice: dan ketujuh orang itu rebah bersama-sama
  rationale: '''Ketujuh orang itu'' menyampaikan nilai numeriknya, sedangkan ''rebah'' mempertahankan citra Ibrani tentang jatuh dalam kematian tanpa menambahkan hubungan akibat yang tidak dinyatakan.'
- source_word: הֻמְתוּ
  choice: mereka dihukum mati
  rationale: Bentuk Hophal dari מות bersifat kausatif-pasif, yakni dibuat mati atau dijatuhi kematian; dalam konteks eksekusi, 'dihukum mati' merupakan padanan Indonesia yang tepat.
- source_word: בִּימֵי קָצִיר בָּרִאשֹׁנִים
  choice: pada hari-hari pertama musim panen
  rationale: Menyampaikan kerangka waktu pada bagian awal musim panen dengan bahasa Indonesia yang wajar.
- source_word: תחלת קְצִיר שְׂעֹרִים
  choice: yaitu pada awal panen jelai
  rationale: Frasa ini menjelaskan secara lebih khusus masa panen yang dimaksud. 'Yaitu' membuat hubungan penjelas tersebut alami tanpa mengubah isinya.
theological_decisions:
- issue: Cara eksekusi yang dinyatakan oleh יקע
  choice: Teks utama memakai 'menggantung mereka', dengan catatan bahwa kata Ibrani juga dapat berarti menyulakan atau memajang tubuh secara terbuka.
  alternative: menyulakan mereka; memajang tubuh mereka di depan umum
  rationale: Konteksnya adalah eksekusi publik yang memiliki arti yudisial dan perjanjian di hadapan Yahweh, tetapi kata Ibraninya tidak menetapkan secara pasti teknik eksekusi menurut pengertian modern. Catatan mempertahankan ketegangan leksikal ini.
- issue: Makna לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  alternative: dalam kehadiran Yahweh
  rationale: Terjemahan formal ini mempertahankan kemungkinan dimensi spasial, kultis, dan yudisial tanpa menentukan salah satunya secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Idiom 'ke dalam tangan' dipertahankan karena dapat dipahami dan membawa nuansa penyerahan ke dalam kuasa. Nama ilahi diterjemahkan 'Yahweh'. Istilah 'jelai' dipilih sebagai nama baku barley.
