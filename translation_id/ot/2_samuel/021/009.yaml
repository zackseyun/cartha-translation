revisions:
- from: Ia menyerahkan mereka ke dalam tangan orang-orang Gibeon[a]. Mereka menggantung mereka di gunung di hadapan Yahweh, dan ketujuh orang itu rebah bersama-sama. Mereka dihukum mati pada hari-hari pertama musim panen, yaitu pada awal panen jelai.
  to: Ia menyerahkan mereka ke dalam tangan orang-orang Gibeon[a]. Orang-orang Gibeon menggantung mereka di gunung itu di hadapan Yahweh, dan ketujuh orang itu rebah bersama-sama. Mereka dihukum mati pada hari-hari pertama musim panen, yaitu pada awal panen jelai.
  rationale: Revisi ini terutama memperjelas referensi pelaku dengan mengganti pronomina pertama pada kalimat kedua menjadi “Orang-orang Gibeon,” sehingga pembaca Indonesia tidak mengira tujuh orang itu menggantung diri mereka sendiri atau satu sama lain. “Gunung itu” mencerminkan bentuk definit Ibrani secara wajar. Catatan kaki dirapikan agar tetap mempertahankan ketidakpastian mengenai cara eksekusi/pemajangan tanpa mengandaikan bahwa tindakan itu pasti dilakukan terhadap mayat.
