base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/016.yaml
  text: And Ishbi-benob[a], who was among the descendants of Rapha, whose spear weighed three hundred shekels of bronze, and who was girded with a new sword[c][b], said that he would strike down David.
translation:
  language: id
  text: Isbi-Benob[a], salah seorang keturunan Rafa[b], tombaknya seberat tiga ratus syikal perunggu. Ia menyandang pedang baru[c] dan berkata bahwa ia akan menyerang Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama Ibrani ini tidak pasti. “Isbi-Benob” mengikuti pemahaman tradisional; kemungkinan lain mencakup “Yesbi-Benob” atau pembagian konsonan yang berbeda.
    reason: textual_variant
  - marker: b
    text: Atau “salah seorang yang dilahirkan bagi Rafa”; ungkapan ini mungkin menunjuk kepada kaum raksasa yang berkaitan dengan orang-orang Refaim.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani hanya berbunyi “baru”; kata benda yang dimaksud tidak disebutkan dan secara tradisional dipahami sebagai “pedang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וישבו בְּנֹב
  choice: Isbi-Benob
  rationale: Bentuk konsonantal dan pembagian katanya sulit. Mengikuti pemahaman tradisional sebagai nama diri paling sesuai dengan rangkaian nama para pejuang dalam konteks, sambil mempertahankan ketidakpastiannya dalam catatan kaki.
- source_word: אֲשֶׁר בִּילִידֵי הָרָפָה
  choice: salah seorang keturunan Rafa
  rationale: Ungkapan ini menunjukkan garis keturunan atau kelompok asal. Nama Rafa dipertahankan sebagai nama diri dan tidak langsung ditafsirkan sebagai 'raksasa'.
- source_word: וּמִשְׁקַל קֵינוֹ
  choice: memiliki tombak ... seberat
  rationale: Dalam konteks pertempuran, קֵין secara tradisional dipahami sebagai tombak atau bagian tombak. Susunan kalimat diubah agar alami dalam bahasa Indonesia tanpa mengubah informasi berat senjata.
- source_word: שְׁלֹשׁ מֵאוֹת מִשְׁקַל נְחֹשֶׁת
  choice: perunggu seberat tiga ratus syikal
  rationale: Syikal dipertahankan sebagai satuan berat kuno, sedangkan נְחֹשֶׁת diterjemahkan 'perunggu', bahan yang paling sesuai dalam konteks perlengkapan perang.
- source_word: וְהוּא חָגוּר חֲדָשָׁה
  choice: Ia menyandang pedang baru
  rationale: Teks Ibrani hanya menyebut kata sifat feminin 'baru' tanpa nomina yang diterangkannya. 'Pedang' adalah pelengkap tradisional yang paling masuk akal dalam konteks, tetapi elipsis tersebut dijelaskan dalam catatan kaki.
- source_word: וַיֹּאמֶר לְהַכּוֹת אֶת דָּוִד
  choice: berkata bahwa ia akan menewaskan Daud
  rationale: Terjemahan ini mempertahankan verba 'berkata' dan menyampaikan maksud serangan dalam konteks perang. 'Menewaskan' menyatakan akibat mematikan tanpa memakai istilah yang bernuansa pembunuhan kriminal.
