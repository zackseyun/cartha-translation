    rationale: Teks menyatakan bahwa Rizpa tidak membiarkan burung di langit “hinggap/menetap pada mereka” pada siang hari, ataupun binatang liar di padang pada malam hari. Mengganti tindakan kedua dengan “mendekati” merupakan penambahan interpretatif.
