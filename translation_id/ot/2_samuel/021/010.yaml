  text: וַ/תִּקַּ֣ח רִצְפָּה֩ בַת אַיָּ֨ה אֶת הַ/שַּׂ֜ק וַ/תַּטֵּ֨/הוּ לָ֤/הּ אֶל הַ/צּוּר֙ מִ/תְּחִלַּ֣ת קָצִ֔יר עַ֛ד נִתַּךְ מַ֥יִם עֲלֵי/הֶ֖ם מִן הַ/שָּׁמָ֑יִם וְ/לֹֽא נָתְנָה֩ ע֨וֹף הַ/שָּׁמַ֜יִם לָ/נ֤וּחַ עֲלֵי/הֶם֙ יוֹמָ֔ם וְ/אֶת חַיַּ֥ת הַ/שָּׂדֶ֖ה לָֽיְלָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/010.yaml
  text: Then Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock[a], from the beginning of harvest until water was poured on them from the heavens. And she did not allow the birds of the sky to rest on them by day, nor the wild animals of the field by night.
translation:
  language: id
  text: Lalu Rizpa, anak perempuan Aya, mengambil kain kabung dan membentangkannya untuk dirinya di atas batu itu sejak awal musim panen sampai air tercurah atas mereka dari langit.[a] Pada siang hari ia tidak membiarkan burung-burung di langit hinggap pada mereka, ataupun binatang-binatang liar di padang pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai hujan turun atas mereka dari langit.” Secara lebih harfiah, teks Ibrani berbunyi “sampai air tercurah atas mereka dari langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׂק
  choice: kain kabung
  rationale: Dalam konteks perkabungan, שַׂק menunjuk pada kain kasar yang dikenakan atau digunakan sebagai tanda duka; 'kain kabung' merupakan padanan Alkitabiah Indonesia yang jelas dan bermartabat.
- source_word: וַתַּטֵּהוּ לָהּ אֶל הַצּוּר
  choice: membentangkannya bagi dirinya di atas batu itu
  rationale: נטה dengan kain sebagai objek berarti membentangkan atau merentangkannya. לָהּ dipertahankan sebagai 'bagi dirinya', sedangkan אֶל הַצּוּר secara kontekstual menunjuk tempat kain itu dibentangkan.
- source_word: הַצּוּר
  choice: batu itu
  rationale: צוּר berarti batu atau batu besar; artikel definit Ibrani dipertahankan dengan 'itu', tanpa menambahkan identifikasi lokasi yang tidak dinyatakan teks.
- source_word: מִתְּחִלַּת קָצִיר
  choice: sejak awal musim panen
  rationale: Teks hanya menyebut awal panen dan tidak menentukan jenis tanaman. 'Musim panen' alami dalam bahasa Indonesia dan menjaga cakupan makna sumber.
- source_word: עַד נִתַּךְ מַיִם עֲלֵיהֶם מִן הַשָּׁמָיִם
  choice: sampai air tercurah atas mereka dari langit
  rationale: Padanan ini mempertahankan citra harfiah נתך, 'tercurah', dan menyisakan kemungkinan bahwa yang dimaksud ialah hujan tanpa menggantinya secara diam-diam.
- source_word: עוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: Ini merupakan ungkapan Ibrani lazim untuk burung; padanan tersebut alami dalam bahasa Indonesia dan tetap mempertahankan citra ruangnya.
- source_word: לָנוּחַ עֲלֵיהֶם
  choice: hinggap pada mereka
  rationale: Dalam konteks burung, נוח berarti turun, menetap, atau hinggap. 'Hinggap' lebih tepat dan alami daripada 'beristirahat'.
- source_word: חַיַּת הַשָּׂדֶה
  choice: binatang-binatang liar di padang
  rationale: Frasa ini menunjuk kepada satwa liar darat. 'Di padang' mempertahankan unsur שׂדה tanpa memakai ungkapan Indonesia yang kaku.
- source_word: וְלֹא נָתְנָה
  choice: ia tidak membiarkan
  rationale: נתן diikuti infinitif berfungsi idiomatis dengan arti mengizinkan atau membiarkan; pilihan ini alami bagi pembaca modern.
- source_word: יוֹמָם ... לָיְלָה
  choice: pada siang hari ... pada malam hari
  rationale: Padanan ini mempertahankan kontras waktu secara jelas dan alami.
