  terminology: “Rizpa,” “Aya,” “kain kabung,” dan “binatang liar di padang” dapat dipertahankan. “Hinggap pada mereka” tepat untuk nuansa נוח dalam konteks ini dan dapat mencakup tindakan burung maupun hewan liar yang mendatangi/menetap pada mayat.
