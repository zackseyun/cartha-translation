  register: Bahasa naratif modern, jelas, dan bermartabat. Kalimat panjang Ibrani dibagi agar mudah dipahami. Frasa 'Ia berada di sana' mengungkapkan secara alami durasi tindakan berjaga yang tersirat oleh rangkaian klausa, sedangkan pengulangan 'ia tidak membiarkan' memperjelas bahwa larangan berlaku baik terhadap burung maupun binatang liar.
