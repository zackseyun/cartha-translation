  terminology: Yahweh dan Gibeon dipertahankan. «Keluarganya» dapat mencakup rumah tangga atau wangsa dalam konteks ini; catatan kaki memperjelas cakupan istilah Ibrani. «Penumpahan darah» lebih tepat daripada «utang darah» untuk menyatakan bloodguilt tanpa menambahkan nuansa balas dendam atau kewajiban pembayaran.
