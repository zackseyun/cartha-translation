    rationale: Idiom Ibrani menyatakan rumah/keluarga yang bercela atau bersalah karena penumpahan darah. «Utang darah» dalam bahasa Indonesia dapat menyiratkan tuntutan pembalasan atau kewajiban yang tidak dinyatakan secara eksplisit oleh frasa ini.
