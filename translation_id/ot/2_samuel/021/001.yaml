source:
  edition: WLC
  text: וַ/יְהִ֣י רָעָב֩ בִּ/ימֵ֨י דָוִ֜ד שָׁלֹ֣שׁ שָׁנִ֗ים שָׁנָה֙ אַחֲרֵ֣י שָׁנָ֔ה וַ/יְבַקֵּ֥שׁ דָּוִ֖ד אֶת פְּנֵ֣י יְהוָ֑ה וַ/יֹּ֣אמֶר יְהוָ֗ה אֶל שָׁאוּל֙ וְ/אֶל בֵּ֣ית הַ/דָּמִ֔ים עַל אֲשֶׁר הֵמִ֖ית אֶת הַ/גִּבְעֹנִֽים־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/001.yaml
  text: There was a famine in the days of David for three years[a], year after year. And David sought the face of Yahweh, and Yahweh said, “It is because of Saul and his bloodguilty house[b], because he put the Gibeonites to death.”
translation:
  language: id
  text: Pada zaman Daud terjadi kelaparan selama tiga tahun, tahun demi tahun. Daud memohon petunjuk kepada Yahweh[a], lalu Yahweh berfirman, “Ini karena Saul dan keluarganya yang bersalah karena penumpahan darah[b], sebab ia telah membunuh orang Gibeon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencari wajah Yahweh.” Ungkapan ini juga dapat diterjemahkan “mencari Yahweh” atau “bertanya kepada Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah darah-darah,” yaitu keluarga atau wangsa yang bersalah karena penumpahan darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam konteks ini kata tersebut menunjuk pada kekurangan pangan berat yang melanda negeri, bukan sekadar rasa lapar.
- source_word: שָׁלֹשׁ שָׁנִים שָׁנָה אַחֲרֵי שָׁנָה
  choice: selama tiga tahun—tahun demi tahun
  rationale: Mempertahankan baik keterangan jumlah tiga tahun maupun pengulangan idiomatis yang menekankan kesinambungannya.
- source_word: וַיְבַקֵּשׁ ... אֶת־פְּנֵי יְהוָה
  choice: mencari wajah Yahweh
  rationale: Terjemahan yang dekat dengan idiom Ibrani dan tetap dapat dipahami; dalam konteks, maksudnya ialah mencari petunjuk atau jawaban dari Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים
  choice: karena Saul dan keluarganya yang menanggung utang darah
  rationale: Konteks menuntut fungsi kausal. 'Keluarga' mengungkapkan arti בית sebagai rumah tangga atau wangsa, sedangkan 'menanggung utang darah' menyampaikan pertanggungjawaban moral atas penumpahan darah.
- source_word: עַל אֲשֶׁר הֵמִית אֶת־הַגִּבְעֹנִים
  choice: sebab ia telah membunuh orang-orang Gibeon
  rationale: Subjek tunggal paling wajar merujuk kepada Saul sebagai pelaku utama; 'membunuh' menyampaikan tindakan menyebabkan kematian secara langsung dan jelas.
theological_decisions:
- issue: Pengungkapan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama diri dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Hubungan Saul dengan בֵּית הַדָּמִים
  choice: Saul dan keluarganya yang menanggung utang darah
  alternative: Saul dan kaum penumpah darah itu; atau Saul dan rumah penumpahan darah
  rationale: בית secara kontekstual menunjuk keluarga atau wangsa, sementara idiom 'darah-darah' menyatakan kesalahan akibat penumpahan darah. Rumusan ini tidak membatasi kesalahan hanya kepada Saul, tetapi tetap membiarkan ayat menyebutnya sebagai pelaku utama.
- issue: Fungsi אֶל dalam jawaban ilahi
  choice: karena
  alternative: terhadap atau atas Saul
  rationale: Jawaban Yahweh menjelaskan penyebab kelaparan. Bahasa Indonesia memerlukan hubungan kausal yang eksplisit agar fungsi pernyataan itu jelas, meskipun bentuk Ibraninya secara harfiah memakai preposisi 'kepada/terhadap'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Idiom penting dari bahasa Ibrani dipertahankan dalam teks bila masih dapat dipahami, lalu dijelaskan melalui catatan kaki. Pengulangan 'selama tiga tahun—tahun demi tahun' sengaja dipertahankan untuk mencerminkan penekanan sumber.
