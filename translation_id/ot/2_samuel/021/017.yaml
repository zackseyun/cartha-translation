  text: וַ/יַּֽעֲזָר ל/וֹ֙ אֲבִישַׁ֣י בֶּן צְרוּיָ֔ה וַ/יַּ֥ךְ אֶת הַ/פְּלִשְׁתִּ֖י וַ/יְמִיתֵ֑/הוּ אָ֣ז נִשְׁבְּעוּ֩ אַנְשֵׁי דָוִ֨ד ל֜/וֹ לֵ/אמֹ֗ר לֹא תֵצֵ֨א ע֤וֹד אִתָּ֨/נוּ֙ לַ/מִּלְחָמָ֔ה וְ/לֹ֥א תְכַבֶּ֖ה אֶת נֵ֥ר יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/017.yaml
  text: But Abishai son of Zeruiah came to his aid[a], struck the Philistine, and killed him. Then David’s men swore to him, saying, “You must not go out with us to battle any longer, lest you extinguish the lamp of Israel.”
translation:
  language: id
  text: Namun Abisai anak Zeruya menolongnya, lalu memukul orang Filistin itu dan membunuhnya. Kemudian orang-orang Daud bersumpah kepadanya, “Jangan lagi engkau pergi berperang bersama kami, supaya engkau tidak memadamkan pelita Israel.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terang Israel.” Secara harfiah teks Ibrani berbunyi “pelita,” sebuah metafora bagi peranan penting Daud dalam kehidupan dan kestabilan bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזָר לוֹ
  choice: datang menolongnya
  rationale: Kata kerja עזר berarti ‘menolong’ atau ‘membantu’. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan campur tangan Abisai dalam pertempuran tanpa menambahkan gagasan bahwa ia pasti ‘menyelamatkan’ Daud.
- source_word: אֲבִישַׁי בֶּן צְרוּיָה
  choice: Abisai anak Zeruya
  rationale: Nama diri ditransliterasikan menurut kebiasaan Alkitab bahasa Indonesia, sedangkan בֶּן diterjemahkan secara langsung sebagai ‘anak’.
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: lalu memukul orang Filistin itu
  rationale: נכה berarti ‘memukul’ atau ‘menghantam’. Karena verba berikutnya secara eksplisit menyatakan kematian, ‘memukul’ menghindari pengulangan makna yang akan timbul dari ‘menewaskan’ atau ‘memukul mati’.
- source_word: וַיְמִיתֵהוּ
  choice: dan membunuhnya
  rationale: Bentuk hifil dari מות di sini menyatakan menyebabkan kematian; ‘membunuhnya’ merupakan padanan modern yang langsung dan wajar.
- source_word: אָז נִשְׁבְּעוּ אַנְשֵׁי דָוִד לוֹ
  choice: Kemudian orang-orang Daud bersumpah kepadanya
  rationale: נשבע menyatakan pengambilan sumpah. ‘Orang-orang Daud’ mempertahankan hubungan konstruksi Ibrani, dan ‘bersumpah kepadanya’ menyampaikan bahwa sumpah itu ditujukan kepada Daud.
- source_word: לֹא תֵצֵא עוֹד אִתָּנוּ לַמִּלְחָמָה
  choice: Jangan lagi engkau maju bersama kami ke medan perang
  rationale: Bentuk imperfek dalam laporan sumpah ini memiliki daya larangan yang tegas. ‘Jangan lagi’ alami dalam bahasa Indonesia, sementara ‘maju ... ke medan perang’ sesuai dengan konteks keberangkatan untuk bertempur.
- source_word: וְלֹא תְכַבֶּה
  choice: supaya engkau tidak memadamkan
  rationale: Walaupun secara bentuk diawali konjungsi ‘dan’, klausa ini menyatakan akibat yang hendak dicegah. ‘Supaya ... tidak’ menyampaikan hubungan tersebut secara alami tanpa mengubah maksud.
- source_word: נֵר יִשְׂרָאֵל
  choice: pelita Israel
  rationale: נֵר secara konkret berarti ‘pelita’. Mempertahankan citra itu menjaga metafora Ibrani tentang peranan vital Daud bagi kehidupan dan kestabilan bangsa.
theological_decisions:
- issue: Sebutan metaforis bagi Daud sebagai terang penopang Israel
  choice: Mempertahankan metafora ‘pelita Israel’ dalam teks utama
  alternative: terang Israel; harapan Israel
  rationale: Teks Ibrani memakai benda konkret נֵר, bukan penjelasan abstrak. ‘Pelita’ mempertahankan gambaran sastra dan muatan teologis-kerajaan tanpa menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora utama dan ketegasan sumpah dalam sumber Ibrani dipertahankan.
