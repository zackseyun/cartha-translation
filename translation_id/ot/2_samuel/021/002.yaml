base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/002.yaml
  text: So the king called the Gibeonites and spoke to them[a]. Now the Gibeonites were not from the sons of Israel, but from the remnant of the Amorites; and the sons of Israel had sworn to them[c][b]. But Saul had sought to strike them down in his zeal for the sons of Israel and Judah.
translation:
  language: id
  text: Lalu raja memanggil orang-orang Gibeon dan berbicara kepada mereka. Orang-orang Gibeon itu bukanlah orang Israel,[a] melainkan sisa bangsa Amori.[b] Orang Israel telah bersumpah kepada mereka, tetapi Saul berusaha membunuh mereka dalam semangatnya demi orang Israel dan Yehuda.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bukan dari antara anak-anak Israel”; maksudnya, mereka bukan orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang Amori yang masih tersisa.”'
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “semangat” juga dapat berarti “kecemburuan,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא הַמֶּלֶךְ לַגִּבְעֹנִים
  choice: Lalu raja memanggil orang-orang Gibeon
  rationale: Mempertahankan sebutan 'raja' tanpa menambahkan nama Daud; 'memanggil' menyampaikan tindakan memanggil mereka menghadap dengan wajar dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: dan berbicara kepada mereka
  rationale: Secara harfiah 'berkata kepada mereka'; 'berbicara kepada mereka' mengalir alami sesudah 'memanggil' tanpa menambah makna.
- source_word: לֹא מִבְּנֵי יִשְׂרָאֵל הֵמָּה
  choice: bukan keturunan Israel
  rationale: Ungkapan ini mempertahankan gagasan asal-usul keluarga dalam בני ישראל dan lebih alami daripada terjemahan harfiah 'anak-anak lelaki Israel'.
- source_word: מִיֶּתֶר הָאֱמֹרִי
  choice: sisa orang Amori
  rationale: יֶתֶר menunjuk kepada bagian yang masih tersisa; bentuk kolektif tunggal הָאֱמֹרִי secara idiomatis diterjemahkan 'orang Amori'.
- source_word: נִשְׁבְּעוּ לָהֶם
  choice: telah bersumpah kepada mereka
  rationale: Aspek tindakan lampau yang mendahului upaya Saul dinyatakan dengan 'telah'; frasa ini tidak menambahkan objek sumpah yang tidak dinyatakan dalam teks.
- source_word: וַיְבַקֵּשׁ שָׁאוּל לְהַכֹּתָם
  choice: tetapi Saul berusaha membunuh mereka
  rationale: בקש dengan infinitif menyatakan usaha atau ikhtiar, sedangkan נכה dalam konteks pemusnahan kelompok berarti membunuh, bukan sekadar memukul. 'Tetapi' menonjolkan pertentangan dengan sumpah sebelumnya.
- source_word: בְּקַנֹּאתוֹ לִבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: karena semangatnya bagi orang Israel dan Yehuda
  rationale: קנא di sini paling wajar menunjuk kepada gairah atau semangat partisan demi Israel dan Yehuda; 'bagi' menjaga arah kepentingan yang dinyatakan oleh ל.
theological_decisions:
- issue: Penerjemahan בני ישראל sebagai sebutan kebangsaan
  choice: keturunan Israel / orang Israel
  alternative: anak-anak Israel / bangsa Israel
  rationale: Pada kemunculan pertama, 'keturunan Israel' menjaga unsur asal-usul dalam kontras dengan sisa orang Amori. Pada kemunculan berikutnya, 'orang Israel' merupakan sebutan kebangsaan alami dalam bahasa Indonesia dan menghindari kesan bahwa hanya laki-laki yang dimaksud.
- issue: Nuansa קנא dalam motif Saul
  choice: semangat
  alternative: kecemburuan
  rationale: Konteks menunjukkan gairah partisan atau nasional demi Israel dan Yehuda, bukan iri hati. Namun, kata 'semangat' tidak dengan sendirinya membenarkan tindakan Saul; ketegangan moral teks tetap dipertahankan, dan alternatif leksikal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Etnonim diterjemahkan sebagai 'orang-orang Gibeon' dan 'orang Amori'; konstruksi latar belakang dibuat sebagai kalimat tersendiri agar mudah dipahami. Semua penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskan.
