id: 2SA.21.7
reference: 2 Samuel 21:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּחְמֹ֣ל הַ/מֶּ֔לֶךְ עַל מְפִי בֹ֖שֶׁת בֶּן יְהוֹנָתָ֣ן בֶּן שָׁא֑וּל עַל שְׁבֻעַ֤ת יְהוָה֙ אֲשֶׁ֣ר בֵּֽינֹתָ֔/ם בֵּ֣ין דָּוִ֔ד וּ/בֵ֖ין יְהוֹנָתָ֥ן בֶּן שָׁאֽוּל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/007.yaml
  text: But the king spared Mephibosheth son of Jonathan[a], son of Saul, because of the oath of Yahweh that was between them, between David and Jonathan son of Saul.
translation:
  language: id
  text: Namun, raja membiarkan Mefiboset, anak Yonatan, anak Saul, tetap hidup karena sumpah Yahweh[a] yang ada di antara mereka, yaitu antara Daud dan Yonatan, anak Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “sumpah Yahweh” kemungkinan berarti sumpah yang diucapkan dalam nama Yahweh antara Daud dan Yonatan.
    reason: Menjelaskan kemungkinan makna konstruksi Ibrani tanpa menghapus ambiguitasnya dari teks utama.
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: membiarkan ... tetap hidup
  rationale: Dalam konteks ini, חמל berarti tidak membunuh atau tidak menyerahkan seseorang untuk dibunuh. Ungkapan ini menyampaikan tindakan konkret sang raja dengan bahasa Indonesia yang wajar, sekaligus tetap mencerminkan belas kasihan yang mendasarinya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Sebutan definit ini mengacu kepada Daud, tetapi terjemahan mempertahankan gelar yang digunakan teks Ibrani dan tidak menggantinya dengan nama.
- source_word: מְפִיבֹשֶׁת
  choice: Mefiboset
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בֶּן יְהוֹנָתָן בֶּן שָׁאוּל
  choice: anak Yonatan, anak Saul
  rationale: Pengulangan struktur genealogis בֶּן dipertahankan, alih-alih mengubah unsur kedua menjadi 'cucu Saul'.
- source_word: עַל
  choice: karena
  rationale: Preposisi ini memperkenalkan alasan tindakan raja; 'karena' menyampaikan hubungan sebab secara alami.
- source_word: שְׁבֻעַת יְהוָה
  choice: sumpah Yahweh
  rationale: 'Terjemahan formal ini mempertahankan ambiguitas konstruksi Ibrani: dapat dipahami sebagai sumpah yang berkaitan dengan Yahweh, terutama sumpah yang diucapkan dalam nama-Nya, tanpa menjadikannya secara pasti sumpah yang diucapkan oleh Yahweh sendiri.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֲשֶׁר בֵּינֹתָם
  choice: yang ada di antara mereka
  rationale: Klausa relatif ini mempertahankan gambaran sumpah yang berlaku di antara kedua pihak.
- source_word: בֵּין דָּוִד וּבֵין יְהוֹנָתָן
  choice: yaitu antara Daud dan Yonatan
  rationale: '''Yaitu'' menjelaskan rujukan kata ''mereka'', sedangkan pengulangan preposisi Ibrani disampaikan secara alami dalam bahasa Indonesia tanpa mengubah hubungan timbal balik kedua pihak.'
theological_decisions:
- issue: Makna שְׁבֻעַת יְהוָה ('sumpah Yahweh')
  choice: Mempertahankan ungkapan formal 'sumpah Yahweh' dalam teks utama; catatan menjelaskan kemungkinan bahwa sumpah itu diucapkan dalam nama Yahweh.
  alternative: Sumpah yang diberikan atau diucapkan oleh Yahweh sendiri.
  rationale: Dalam konteks perjanjian antara Daud dan Yonatan, ungkapan ini kemungkinan besar menunjuk kepada sumpah yang diteguhkan dengan memanggil Yahweh sebagai saksi. Namun, teks utama tidak menutup kemungkinan gramatikal lainnya.
- issue: Rujukan הַמֶּלֶךְ ('raja')
  choice: Mempertahankan 'raja'.
  alternative: Mengganti gelar dengan nama 'Daud'.
  rationale: Konteks menunjukkan bahwa raja itu adalah Daud, tetapi bentuk eksplisit teks sumber adalah gelar 'raja'.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ungkapan 'membiarkan ... tetap hidup' dipilih agar makna naratif 'tidak menyerahkan untuk dibunuh' mudah dipahami. Struktur silsilah dan sebutan 'raja' dipertahankan demi kedekatan dengan teks Ibrani.
