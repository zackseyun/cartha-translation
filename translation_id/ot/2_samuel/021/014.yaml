  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְבְּר֣וּ אֶת עַצְמוֹת שָׁא֣וּל וִ/יהוֹנָֽתָן בְּ֠נ/וֹ בְּ/אֶ֨רֶץ בִּנְיָמִ֜ן בְּ/צֵלָ֗ע בְּ/קֶ֨בֶר֙ קִ֣ישׁ אָבִ֔י/ו וַֽ/יַּעֲשׂ֔וּ כֹּ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יֵּעָתֵ֧ר אֱלֹהִ֛ים לָ/אָ֖רֶץ אַֽחֲרֵי כֵֽן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/014.yaml
  text: They buried the bones of Saul and of Jonathan his son in the land of Benjamin[a], in Zela, in the tomb of Kish his father. They did all that the king had commanded, and after that God responded to the plea for the land.
translation:
  language: id
  text: Mereka menguburkan tulang-tulang Saul dan Yonatan, putra Saul, di wilayah Benyamin, di Zela, dalam makam Kish, ayah Saul. Mereka melakukan segala sesuatu yang diperintahkan raja. Sesudah itu, Allah mengabulkan permohonan bagi negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Allah berkenan menerima permohonan mengenai negeri itu” atau “Allah menjawab doa bagi negeri itu.” Kata kerja Ibraninya menyiratkan tanggapan yang berkenan terhadap suatu permohonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Mereka menguburkan
  rationale: Bentuk wayyiqtol dari קבר menyatakan tindakan lampau dalam rangkaian narasi. Konjungsi Ibrani tidak diterjemahkan secara mekanis agar alur bahasa Indonesia tetap alami.
- source_word: עַצְמוֹת
  choice: tulang-tulang
  rationale: Menerjemahkan makna konkret kata עֶצֶם secara langsung; lebih dekat dengan teks daripada 'jenazah' atau 'sisa-sisa jasad'.
- source_word: שָׁאוּל וִיהוֹנָתָן בְּנוֹ
  choice: Saul dan Yonatan, anaknya
  rationale: Mempertahankan hubungan bahwa Yonatan adalah anak Saul. Tanda koma membantu mencegah pembacaan bahwa sebutan itu merupakan bagian dari nama.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  choice: di wilayah Benyamin
  rationale: Kata אֶרֶץ di sini menunjuk daerah suku Benyamin; 'wilayah' lebih alami daripada 'tanah' dalam bahasa Indonesia modern.
- source_word: בְּצֵלָע
  choice: di Zela
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dan struktur lokatif Ibrani dipertahankan.
- source_word: בְּקֶבֶר קִישׁ אָבִיו
  choice: dalam makam Kish, ayah Saul
  rationale: קֶבֶר dapat berarti kubur atau makam; 'makam' cocok bagi tempat pemakaman keluarga. Acuan sufiks 'ayahnya' dijelaskan sebagai Saul agar tidak menimbulkan ambiguitas semu dalam susunan bahasa Indonesia.
- source_word: וַיַּעֲשׂוּ כֹּל אֲשֶׁר צִוָּה הַמֶּלֶךְ
  choice: Mereka melakukan segala sesuatu yang diperintahkan raja
  rationale: Menyampaikan seluruh isi klausa relatif dengan susunan Indonesia yang wajar tanpa menambahkan pelaku yang tidak dinyatakan pada verba 'memerintahkan'.
- source_word: וַיֵּעָתֵר אֱלֹהִים
  choice: Allah mengabulkan permohonan
  rationale: Bentuk nifal dari עתר menyiratkan tanggapan yang berkenan terhadap permohonan. 'Mengabulkan permohonan' menangkap nilai semantis itu tanpa menambahkan identitas orang yang berdoa.
- source_word: לָאָרֶץ
  choice: bagi negeri itu
  rationale: Preposisi ל menyatakan kepentingan atau sasaran manfaat; 'bagi negeri itu' menyampaikan bahwa tanggapan ilahi berkenaan dengan negeri tersebut.
- source_word: אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan temporal ini menandai bahwa tanggapan Allah terjadi setelah tindakan-tindakan sebelumnya.
theological_decisions:
- issue: Makna וַיֵּעָתֵר אֱלֹהִים לָאָרֶץ
  choice: Allah mengabulkan permohonan bagi negeri itu
  alternative: Allah berkenan menerima permohonan mengenai negeri itu; Allah menjawab doa bagi negeri itu
  rationale: Walaupun nomina 'permohonan' tidak tertulis tersendiri, verba nifal עתר secara leksikal menyatakan bahwa Allah berkenan menanggapi permohonan. Terjemahan ini tidak memperluasnya menjadi 'memulihkan' atau 'menyembuhkan negeri', dan tidak menentukan siapa yang mengajukan permohonan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama diri memakai bentuk Indonesia yang umum: Saul, Yonatan, Benyamin, Zela, dan Kish. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar mudah dipahami tanpa mengubah urutan peristiwa.'
