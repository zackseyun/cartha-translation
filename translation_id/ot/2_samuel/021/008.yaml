source:
  edition: WLC
  text: וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֶת שְׁ֠נֵי בְּנֵ֨י רִצְפָּ֤ה בַת אַיָּה֙ אֲשֶׁ֣ר יָלְדָ֣ה לְ/שָׁא֔וּל אֶת אַרְמֹנִ֖י וְ/אֶת מְפִבֹ֑שֶׁת וְ/אֶת חֲמֵ֗שֶׁת בְּנֵי֙ מִיכַ֣ל בַּת שָׁא֔וּל אֲשֶׁ֥ר יָלְדָ֛ה לְ/עַדְרִיאֵ֥ל בֶּן בַּרְזִלַּ֖י הַ/מְּחֹלָתִֽי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/008.yaml
  text: So the king took the two sons of Rizpah daughter of Aiah[a], whom she had borne to Saul—Armoni and Mephibosheth—and the five sons of Michal daughter of Saul, whom she had borne to Adriel son of Barzillai the Meholathite.
translation:
  language: id
  text: Lalu raja mengambil kedua anak laki-laki Rizpa, anak perempuan Aya, yang telah ia lahirkan bagi Saul, yaitu Armoni dan Mefiboset, serta kelima anak laki-laki Mikhal, anak perempuan Saul[a], yang telah ia lahirkan bagi Adriel, anak Barzilai, orang Mehola.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah naskah dan penafsir kuno membaca “Merab” dan bukan “Mikhal”; bandingkan 1 Samuel 18:19, yang menyebut bahwa Adriel menikahi Merab, anak perempuan Saul.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu ... mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan perkembangan peristiwa secara wajar dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Teks Ibrani memakai gelar dengan artikel tertentu. Dalam konteks bahasa Indonesia, “raja” sudah menunjuk kepada tokoh yang dikenal, yaitu Daud, tanpa mengganti gelar itu dengan namanya.
- source_word: שְׁנֵי בְּנֵי
  choice: kedua anak laki-laki
  rationale: Frasa konstruksi dengan bilangan menunjuk pada dua anak yang dimaksud; “kedua” alami untuk kelompok tertentu dalam konteks ini.
- source_word: רִצְפָּה בַת אַיָּה
  choice: Rizpa anak Aya
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan בַת diterjemahkan secara langsung sebagai “anak” tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: אֲשֶׁר יָלְדָה לְשָׁאוּל
  choice: yang telah dilahirkannya bagi Saul
  rationale: Verba ילד dengan ל menandai Saul sebagai ayah; bentuk “telah dilahirkannya” menyatakan tindakan yang mendahului peristiwa utama.
- source_word: אַרְמֹנִי
  choice: Armoni
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
- source_word: מְפִבֹשֶׁת
  choice: Mefiboset
  rationale: Nama diri memakai bentuk Indonesia yang lazim; silsilah dalam ayat ini membedakannya dari anak Yonatan yang bernama sama.
- source_word: חֲמֵשֶׁת בְּנֵי
  choice: kelima anak laki-laki
  rationale: Frasa ini menunjuk pada kelompok tertentu yang berjumlah lima dan menjadi objek kedua dari tindakan raja.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikhal anak Saul
  rationale: Teks WLC berbunyi “Mikhal”; bacaan itu dipertahankan dalam teks utama, sedangkan persoalan dengan 1 Samuel 18:19 dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר יָלְדָה לְעַדְרִיאֵל
  choice: yang telah dilahirkannya bagi Adriel
  rationale: Konstruksi yang sama dengan klausa sebelumnya diterjemahkan secara konsisten, dengan Adriel ditandai sebagai ayah.
- source_word: בֶּן בַּרְזִלַּי
  choice: anak Barzilai
  rationale: Patronimik Ibrani diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: הַמְּחֹלָתִי
  choice: orang Mehola
  rationale: Adjektiva gentilisia/geografis diterjemahkan secara transparan sebagai orang yang berasal dari Mehola.
theological_decisions:
- issue: Ketegangan tekstual/historis mengenai Mikhal sebagai ibu anak-anak Adriel
  choice: Mempertahankan “Mikhal” dalam teks utama sesuai WLC dan mencantumkan varian “Merab” dalam catatan kaki.
  alternative: Menerjemahkan “Merab anak Saul” dalam teks utama untuk menyelaraskannya dengan 1 Samuel 18:19.
  rationale: Teks sumber Ibrani yang diberikan membaca “Mikhal”, sehingga terjemahan tidak mengharmonisasikannya secara diam-diam. Namun, karena 1 Samuel 18:19 menyebut Merab sebagai istri Adriel dan terdapat dukungan manuskrip serta penafsir kuno bagi “Merab”, persoalan itu perlu dinyatakan dengan transparan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur paralel Ibrani dipertahankan, tetapi urutan frasa dibuat alami. Istilah “anak laki-laki” dipakai untuk memperjelas בְּנֵי, sedangkan “orang Mehola” lebih mudah dipahami daripada bentuk gentilisia yang kurang lazim.
