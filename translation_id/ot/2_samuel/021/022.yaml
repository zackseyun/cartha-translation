  text: אֶת אַרְבַּ֥עַת אֵ֛לֶּה יֻלְּד֥וּ לְ/הָ/רָפָ֖ה בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖ד וּ/בְ/יַ֥ד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/022.yaml
  text: These four were born to the Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: id
  text: Keempat orang ini adalah keturunan Rafa di Gat,[a] dan mereka tewas oleh tangan Daud dan oleh tangan hamba-hambanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan sang Rafa”, “keturunan sang raksasa”, atau “keturunan kaum Refaim”. Bahasa Ibrani tampaknya menunjuk kepada garis keturunan atau kelompok yang dikaitkan dengan Rafa di Gat.
    reason: alternative_reading
lexical_decisions:
- source_word: אַרְבַּעַת אֵלֶּה
  choice: keempat orang ini
  rationale: Bahasa Indonesia alami memerlukan nomina penggolong dalam konteks ini; 'orang' tersirat dari rujukan kepada empat tokoh laki-laki dalam bagian sebelumnya.
- source_word: יֻלְּדוּ
  choice: dilahirkan
  rationale: Bentuk pasif dari ילד menyatakan kelahiran atau keturunan; 'dilahirkan' mempertahankan bentuk pasif dan hubungan asal-usul.
- source_word: לְהָרָפָה
  choice: bagi Rafa
  rationale: Mempertahankan Rafa sebagai nama atau gelar leluhur/kaum tanpa memutuskan apakah yang dimaksud ialah seorang raksasa atau kaum Refaim.
- source_word: בְּגַת
  choice: di Gat
  rationale: Padanan lokatif langsung dan wajar dalam bahasa Indonesia.
- source_word: וַיִּפְּלוּ
  choice: mereka tewas
  rationale: Dalam konteks pertempuran, נפל menyatakan gugur atau mati. 'Tewas' menyampaikan makna kontekstual secara alami, meski citra harfiah 'jatuh' tidak dipertahankan.
- source_word: בְיַד
  choice: oleh tangan
  rationale: Mempertahankan idiom Ibrani yang menyatakan pelaku, sekaligus tetap dapat dipahami dalam ragam Alkitabiah Indonesia.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: Padanan langsung yang sesuai bagi para pengikut atau pelayan Daud dalam konteks kerajaan dan militer.
theological_decisions:
- issue: Identitas הָרָפָה
  choice: Rafa sebagai nama atau sebutan leluhur/kaum
  alternative: '''raksasa itu'' atau ''kaum Refaim'''
  rationale: Bentuk Ibrani dapat menunjuk kepada tokoh, gelar, atau garis keturunan yang dikaitkan dengan para raksasa di Gat. Teks utama mempertahankan nama 'Rafa', sementara catatan kaki menyajikan kemungkinan lain.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Idiom 'oleh tangan' dipertahankan untuk mencerminkan bentuk Ibrani; ambiguitas identitas Rafa dijaga melalui transliterasi dan catatan kaki.
