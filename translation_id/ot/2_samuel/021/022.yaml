    issue: Frasa 'dilahirkan bagi Rafa'
    rationale: Preposisi 'bagi' tidak menyatakan asal-usul atau keturunan secara wajar dalam bahasa Indonesia. Ibrani לְהָרָפָה dalam konteks ini menunjukkan bahwa keempat orang itu termasuk garis/keturunan Rafa.
  - severity: low
    issue: Catatan kaki tidak mencantumkan alternatif nama 'Rafa' secara eksplisit dan terlalu menyempitkan penjelasan
    rationale: Sumber Inggris mencantumkan pembacaan 'to Rapha' di samping alternatif lain. Selain itu, identitas הָרָפָה diperdebatkan; penjelasan sebaiknya menyatakan kemungkinan garis keturunan/kelompok yang dikaitkan dengan Rafa tanpa menetapkan bahwa itu pasti 'para raksasa'.
