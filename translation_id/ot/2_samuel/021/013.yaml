translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pergantian subjek dari tunggal ('Ia') ke jamak ('mereka') dipertahankan sesuai bentuk verba Ibrani. Penanda catatan kaki ditempatkan langsung sesudah istilah yang diterangkan.
