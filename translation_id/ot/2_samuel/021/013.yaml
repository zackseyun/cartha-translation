  text: He brought up from there the bones of Saul and the bones of Jonathan his son[a], and they gathered the bones of those who had been impaled.
translation:
  language: id
  text: Dari sana ia mengangkat tulang-tulang Saul dan tulang-tulang Yonatan, anaknya. Lalu mereka mengumpulkan tulang-tulang orang-orang yang telah dipancangkan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “digantung” atau “yang dipertontonkan.” Kata Ibrani ini menunjuk kepada orang-orang yang dihukum mati dan yang jasadnya dipertontonkan di tempat umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: membawa naik
  rationale: Bentuk kausatif dari עלה menyatakan membawa sesuatu naik. Ungkapan ini mempertahankan arah gerak yang terdapat dalam bahasa Ibrani, yakni mengangkat atau membawa tulang-tulang itu dari tempat tersebut.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan deiktis yang langsung, alami, dan sesuai dengan konteks pengambilan tulang-tulang dari tempat yang disebut sebelumnya.
- source_word: עַצְמוֹת
  choice: tulang-tulang
  rationale: Kata Ibrani secara konkret berarti tulang-tulang; pilihan ini lebih tepat daripada istilah umum seperti 'jenazah' atau 'sisa-sisa jasad'.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonatan, anaknya
  rationale: Mempertahankan susunan aposisional Ibrani dan menjelaskan bahwa Yonatan adalah anak Saul tanpa menambah tafsiran.
- source_word: וַיַּאַסְפוּ
  choice: mereka mengumpulkan
  rationale: Bentuk verba ini adalah orang ketiga jamak. Subjek jamak dipertahankan dan tidak diselaraskan secara keliru dengan verba tunggal sebelumnya.
- source_word: הַמּוּקָעִים
  choice: orang-orang yang telah dipancang
  rationale: Istilah ini menunjuk kepada orang-orang yang dihukum mati dan jasadnya dipajang pada tiang atau pancang. 'Dipancang' mempertahankan gambaran konkret tanpa memastikan secara berlebihan cara kematiannya; kemungkinan terjemahan lain dijelaskan dalam catatan kaki.
