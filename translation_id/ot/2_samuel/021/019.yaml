revisions:
- from: Lalu sekali lagi terjadi perang melawan orang Filistin di Gob. Elhanan anak Yaare-Oregim, orang Betlehem itu, menewaskan Goliat, orang Gat itu,[a] dan gagang tombaknya seperti kayu penggulung pada alat tenun.[b]
  to: Lalu terjadi lagi peperangan di Gob melawan orang Filistin. Elhanan, anak Yaare-Oregim[a], orang Betlehem itu, menewaskan Goliat, orang Gat itu[b]. Batang tombaknya seperti palang tenun.
  rationale: Revisi ini mempertahankan secara penuh bacaan Masoret dalam teks utama, termasuk pernyataan yang sulit bahwa Elhanan menewaskan Goliat. Catatan kaki ditambatkan pada unsur teks yang benar dan tetap menyajikan ketegangan dengan 1 Tawarikh sebagai persoalan tekstual, bukan sebagai koreksi diam-diam. Istilah untuk batang tombak dan palang tenun diperbaiki agar lebih setia pada bahasa Ibrani serta lebih wajar dalam bahasa Indonesia modern.
