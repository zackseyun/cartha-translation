  text: וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים וַ/יַּ֡ךְ אֶלְחָנָן֩ בֶּן יַעְרֵ֨י אֹרְגִ֜ים בֵּ֣ית הַלַּחְמִ֗י אֵ֚ת גָּלְיָ֣ת הַ/גִּתִּ֔י וְ/עֵ֣ץ חֲנִית֔/וֹ כִּ/מְנ֖וֹר אֹרְגִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/019.yaml
  text: And there was again war at Gob with the Philistines[a], and Elhanan son of Jaare-oregim the Bethlehemite struck down Goliath the Gittite[b], and the shaft of his spear was like a weaver’s beam.
translation:
  language: id
  text: Lalu terjadi lagi peperangan di Gob melawan orang Filistin. Elhanan, anak Yaare-Oregim[a], orang Betlehem itu, menewaskan Goliat, orang Gat itu[b]. Batang tombaknya seperti palang tenun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani “Yaare-Oregim” sulit dipahami. Sebagian orang berpendapat bahwa kata oregim (“para penenun”) tersalin secara tidak sengaja dari akhir ayat ini.
    reason: textual_variant
  - marker: b
    text: '1 Tawarikh 20:5 memuat bacaan berbeda: Elhanan menewaskan Lahmi, saudara Goliat. Banyak penafsir menganggap teks Samuel di sini memuat bacaan yang sukar atau rusak, dan karena itu menyelaraskannya dengan 1 Tawarikh.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּגוֹב
  choice: di Gob
  rationale: Preposisi בְּ dengan nama tempat menunjukkan lokasi pertempuran; dalam bahasa Indonesia paling wajar diterjemahkan “di”.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה dengan objek seorang pejuang menyatakan tindakan memukul hingga tewas; “menewaskan” menyampaikan hasil tersebut secara alami.
- source_word: יַעְרֵי אֹרְגִים
  choice: Yaare-Oregim
  rationale: Nama sulit dalam teks Masoret dipertahankan melalui transliterasi dan tidak diselaraskan diam-diam dengan 1 Tawarikh 20:5.
- source_word: בֵּית הַלַּחְמִי
  choice: orang Betlehem itu
  rationale: Bentuk nisbah ini secara wajar menunjuk kepada orang yang berasal dari Betlehem.
- source_word: אֵת גָּלְיָת הַגִּתִּי
  choice: Goliat, orang Gat itu
  rationale: Teks Masoret dengan jelas menempatkan Goliat orang Gat sebagai objek langsung; ketegangan dengan bagian lain dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: וְעֵץ חֲנִיתוֹ
  choice: gagang tombaknya
  rationale: עֵץ secara harfiah berarti kayu, tetapi dalam hubungan dengan tombak menunjuk pada batang atau gagang kayunya; “gagang tombak” mudah dipahami pembaca umum.
- source_word: כִּמְנוֹר אֹרְגִים
  choice: seperti kayu penggulung pada alat tenun
  rationale: מְנוֹר menunjuk pada bagian kayu besar alat tenun, kemungkinan balok atau penggulung; ungkapan ini mempertahankan gambaran mengenai ukuran gagang tombak tanpa memakai istilah teknis yang terlalu asing.
theological_decisions:
- issue: Ketegangan dengan kisah Daud membunuh Goliat dalam 1 Samuel 17 dan bacaan paralel 1 Tawarikh 20:5
  choice: Teks utama mempertahankan bacaan Masoret bahwa Elhanan menewaskan Goliat, orang Gat.
  alternative: 'Menerjemahkan secara selaras: Elhanan menewaskan Lahmi, saudara Goliat, orang Gat.'
  rationale: Sumber Ibrani yang diberikan secara eksplisit menyebut Goliat sebagai objek. Ketegangan tekstual tidak diselesaikan secara diam-diam, tetapi diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat mengikuti alur Ibrani tanpa menjadi kaku. Bacaan Masoret yang sulit dipertahankan dalam teks utama, sedangkan varian dan kemungkinan kerusakan teks dijelaskan melalui catatan kaki.
