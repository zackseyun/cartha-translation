base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/005.yaml
  text: They said to the king[a], “The man who consumed us, and who planned against us[b], so that we should be destroyed from having a place within all the territory of Israel—”
translation:
  language: id
  text: Mereka berkata kepada raja, “Orang yang menghabisi kami dan yang menyusun rencana melawan kami[a], sehingga kami dimusnahkan dan tidak dapat bertahan di seluruh wilayah Israel[b]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang merancang siasat terhadap kami.” Kata kerja Ibrani ini dapat berarti merencanakan atau merancang siasat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari berdiri atau menempatkan diri di seluruh wilayah Israel,” yaitu tidak dapat terus memiliki tempat di mana pun di Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּלָּנוּ
  choice: menghabisi kami
  rationale: Bentuk Piel dari כלה menyatakan tindakan membawa sesuatu sampai pada akhirnya atau melenyapkannya. “Menghabisi kami” mempertahankan daya tuduhan dalam konteks upaya Saul memusnahkan orang Gibeon.
- source_word: דִּמָּה לָנוּ
  choice: membuat rencana untuk melawan kami
  rationale: Dalam konteks ini דמה berarti merancang atau merencanakan, sedangkan לָנוּ bernuansa merugikan atau memusuhi. Terjemahan ini mempertahankan gagasan perencanaan tanpa menentukan secara berlebihan rincian rencananya.
- source_word: נִשְׁמַדְנוּ
  choice: supaya kami dimusnahkan
  rationale: Bentuk Nifal dari שׁמד menyatakan dimusnahkan atau dilenyapkan. “Supaya” menyampaikan hubungan tujuan atau hasil yang tersirat dalam rangkaian klausa Ibrani.
- source_word: מֵהִתְיַצֵּב
  choice: tidak lagi mendapat tempat
  rationale: Secara harfiah ungkapan ini berarti tidak dapat berdiri atau menempatkan diri. Dalam konteks keberlangsungan suatu kelompok di negeri Israel, “tidak lagi mendapat tempat” menyampaikan hilangnya keberadaan yang tetap tanpa membatasinya pada sikap tubuh.
- source_word: בְּכָל גְּבֻל יִשְׂרָאֵל
  choice: di seluruh wilayah Israel
  rationale: גְּבוּל di sini menunjuk pada kawasan atau wilayah kekuasaan, bukan hanya garis perbatasan. “Seluruh wilayah Israel” mempertahankan cakupan menyeluruhnya.
- source_word: הָאִישׁ
  choice: Orang
  rationale: Nomina definit ini menunjuk kembali kepada Saul. Dalam bahasa Indonesia, “orang yang ... itu” diwujudkan secara alami dengan “Orang yang ...—” dalam konstruksi terputus yang dilanjutkan oleh ayat berikutnya.
