  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ אַֽחֲרֵי כֵ֔ן וַ/תְּהִי ע֧וֹד הַ/מִּלְחָמָ֛ה בְּ/ג֖וֹב עִם פְּלִשְׁתִּ֑ים אָ֣ז הִכָּ֗ה סִבְּכַי֙ הַ/חֻ֣שָׁתִ֔י אֶת סַ֕ף אֲשֶׁ֖ר בִּ/ילִדֵ֥י הָ/רָפָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/018.yaml
  text: After this[a], there was again war with the Philistines at Gob, and then Sibbecai the Hushathite struck down Saph[b], who was among the descendants of Rapha.
translation:
  language: id
  text: Sesudah itu, kembali terjadi perang melawan orang Filistin di Gob. Pada waktu itu Sibkhai, orang Husa, menewaskan Saf[a], yang termasuk keturunan Rafa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani di sini namanya Saf; bagian paralel dalam 1 Tawarikh 20:4 menyebutnya Sipai.
    reason: textual_variant
  - marker: b
    text: 'Atau: “yang termasuk keturunan raksasa itu.” Ungkapan Ibrani ini dapat menunjuk kepada Rafa sebagai nama leluhur atau kepada garis keturunan kaum raksasa/Refaim.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan peralihan waktu ini secara alami menyatakan urutan peristiwa tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: וַתְּהִי עוֹד הַמִּלְחָמָה
  choice: kembali terjadi perang
  rationale: Menjaga makna עוֹד bahwa peperangan terjadi lagi, sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: בְּגֹב
  choice: di Gob
  rationale: Preposisi ב menandai lokasi pertempuran; 'di' merupakan padanan Indonesia yang alami.
- source_word: עִם פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: Dalam konteks perang, עִם menunjukkan pihak lawan; 'orang Filistin' adalah sebutan etnis yang lazim.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai peristiwa berikutnya dalam rangkaian narasi dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam daftar pertempuran ini, נכה menyatakan tindakan mengalahkan seorang pejuang dengan akibat kematian. 'Menewaskan' menyampaikan daya tempurnya secara alami tanpa memakai ungkapan arkais.
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: Sibkhai, orang Husa
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani, sedangkan nisbah הַחֻשָׁתִי diterjemahkan secara alami sebagai 'orang Husa'.
- source_word: סַף
  choice: Saf
  rationale: Mengikuti bacaan Teks Masoret pada ayat ini. Bentuk nama yang berbeda dalam bagian paralel dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בִּילִדֵי הָרָפָה
  choice: yang termasuk keturunan Rafa
  rationale: Bentuk jamak יְלִדֵי dapat menunjuk pada keturunan atau anggota suatu garis keluarga. Terjemahan ini mempertahankan Rafa sebagai nama leluhur tanpa menutup kemungkinan pembacaan 'raksasa'.
theological_decisions:
- issue: Apakah הָרָפָה merupakan nama diri 'Rafa' atau sebutan 'raksasa'
  choice: Rafa sebagai nama diri atau leluhur suatu garis keturunan
  alternative: raksasa; orang Refaim
  rationale: Susunan 'termasuk keturunan ...' mendukung pengertian garis keturunan, tetapi bentuk Ibraninya memungkinkan hubungan dengan tradisi tentang kaum raksasa atau Refaim. Teks utama mempertahankan nama Rafa, sedangkan kemungkinan lain dicatat agar ketegangan penafsirannya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama-nama ditransliterasikan mendekati bentuk Ibrani; nisbah diterjemahkan secara komunikatif. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
