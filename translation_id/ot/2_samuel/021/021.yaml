  text: וַ/יְחָרֵ֖ף אֶת יִשְׂרָאֵ֑ל וַ/יַּכֵּ֨/הוּ֙ יְה֣וֹנָתָ֔ן בֶּן שמעי אֲחִ֥י דָוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/021.yaml
  text: And he defied Israel[a], and Jonathan the son of Shimei, David’s brother, struck him down.
translation:
  language: id
  text: Ia menantang Israel, lalu Yonatan, anak Simei[a] yang adalah saudara Daud, menewaskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan bagian sejajar dalam 1 Tawarikh 20:7 memakai nama “Simea” atau “Simeah”, bukan “Simei”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: menantang
  rationale: Dalam konteks pertempuran, חרף menunjuk pada ucapan menghina yang sekaligus merupakan tantangan terbuka. “Menantang” menyampaikan daya permusuhan itu secara alami dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Objeknya adalah Israel sebagai satu bangsa; bentuk kolektif ini dipertahankan tanpa diperluas menjadi “orang Israel”.
- source_word: וַיַּכֵּהוּ
  choice: menewaskannya
  rationale: נכה pada dasarnya berarti memukul atau menghantam, tetapi dalam konteks pertarungan ini tindakan tersebut berakibat fatal. “Menewaskannya” menyatakan hasil yang dimaksud secara ringkas dan wajar.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama yang lazim dan sesuai dengan ejaan Indonesia.
- source_word: בֶּן שמעי
  choice: anak Simei
  rationale: Mengikuti bentuk nama שמעי dalam teks Ibrani yang diberikan, sedangkan varian “Simea” dicatat dalam catatan kaki.
- source_word: אֲחִי דָוִד
  choice: yang adalah saudara Daud
  rationale: Frasa ini menerangkan Simei sebagai saudara Daud. Susunan ini memperjelas hubungan kekerabatan dalam bahasa Indonesia tanpa mengubah isinya.
