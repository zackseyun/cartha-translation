base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/004.yaml
  text: The Gibeonites said to him[a], “We have no claim for silver or gold against Saul or against his house, and it is not for us to put any man in Israel to death.” Then he said[b], “What do you say that I should do for you?”
translation:
  language: id
  text: Orang-orang Gibeon berkata kepadanya, “Kami tidak menuntut perak atau emas dari Saul ataupun keluarganya,[a] dan bukan hak kami untuk menghukum mati siapa pun di Israel.”[b] Lalu Daud berkata, “Apa yang kalian katakan harus kulakukan bagi kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perkara antara kami dengan Saul dan keluarganya bukanlah perkara perak atau emas.” Ungkapan Ibraninya idiomatis dan kemungkinan besar mengacu pada ganti rugi berupa uang.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kami tidak berhak menghukum mati siapa pun di Israel.” Secara harfiah, ungkapan Ibrani ini eliptis; dalam konteksnya, ungkapan tersebut kemungkinan menyatakan bahwa mereka tidak memiliki wewenang untuk menghukum mati seorang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין לִי כֶּסֶף וְזָהָב עִם שָׁאוּל וְעִם בֵּיתוֹ
  choice: Kami tidak menuntut perak atau emas dari Saul ataupun keluarganya
  rationale: Ungkapan Ibrani ini idiomatis dan dalam konteksnya menunjuk pada tuntutan ganti rugi berupa uang, bukan sekadar kepemilikan perak atau emas. Bentuk tunggal לִי dipahami secara korporatif karena orang-orang Gibeon berbicara sebagai kelompok.
- source_word: עִם
  choice: dari
  rationale: Dalam konteks tuntutan atau sengketa, עִם menandai pihak yang darinya ganti rugi dapat dituntut. Bahasa Indonesia alami memakai 'menuntut ... dari'.
- source_word: וְאֵין לָנוּ אִישׁ לְהָמִית בְּיִשְׂרָאֵל
  choice: dan bukan hak kami untuk membunuh siapa pun di Israel
  rationale: Klausa eliptis ini paling mungkin menyatakan bahwa mereka tidak memiliki wewenang atau hak untuk menghukum mati seorang Israel, bukan bahwa tidak ada orang yang dapat mereka bunuh.
- source_word: אִישׁ
  choice: siapa pun
  rationale: Di sini אִישׁ bersifat generik. 'Siapa pun' menyampaikan cakupan tersebut secara alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מָה אַתֶּם אֹמְרִים אֶעֱשֶׂה לָכֶם
  choice: Apa yang kalian minta untuk kulakukan bagi kalian?
  rationale: Pertanyaan Ibrani yang ringkas meminta orang-orang Gibeon menyatakan tindakan atau syarat yang mereka kehendaki. 'Minta' mengungkapkan maksud pragmatisnya dengan jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk bentuk jamak אַתֶּם/לָכֶם agar jumlahnya jelas; 'keluarga' menerjemahkan בַּיִת dalam arti wangsa atau rumah tangga Saul. Nama Daud ditambahkan pada klausa terakhir untuk memperjelas pergantian penutur yang hanya ditandai oleh bentuk verba maskulin tunggal dalam bahasa Ibrani.
