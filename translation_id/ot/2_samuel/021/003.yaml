  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/גִּבְעֹנִ֔ים מָ֥ה אֶעֱשֶׂ֖ה לָ/כֶ֑ם וּ/בַ/מָּ֣ה אֲכַפֵּ֔ר וּ/בָרְכ֖וּ אֶת נַחֲלַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/003.yaml
  text: David said to the Gibeonites[a], “What shall I do for you, and with what shall I make atonement[b], that you may bless the inheritance of Yahweh?”
translation:
  language: id
  text: Daud berkata kepada orang-orang Gibeon, “Apa yang harus kulakukan bagi kalian, dan dengan apa aku harus mengadakan pendamaian, supaya kalian memberkati milik pusaka Yahweh[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kalian akan memberkati milik pusaka Yahweh.” Bentuk Ibraninya dapat dibaca lebih harfiah sebagai klausa sejajar; teks utama mengungkapkan makna tujuan atau hasil yang tampaknya dimaksudkan dalam konteks. “Milik pusaka Yahweh” merujuk kepada Israel, umat yang menjadi milik Yahweh.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar memperkenalkan ucapan Daud; ‘berkata’ tidak mempersempitnya menjadi tindakan bertanya saja.
- source_word: הַגִּבְעֹנִים
  choice: orang-orang Gibeon
  rationale: Bentuk nisbah jamak ini menunjuk kepada kelompok penduduk Gibeon; bentuk Indonesia ini jelas dan lazim.
- source_word: מָה אֶעֱשֶׂה לָכֶם
  choice: Apa yang harus kulakukan bagi kalian
  rationale: Kata tanya dengan bentuk imperfek menyatakan pertimbangan mengenai tindakan yang perlu dilakukan. ‘Harus kulakukan’ alami dalam bahasa Indonesia dan mempertahankan pertanyaan terbuka.
- source_word: וּבַמָּה
  choice: dan dengan apa
  rationale: Mempertahankan nuansa sarana atau alat dari preposisi ב, bukan menggeneralisasinya menjadi sekadar ‘bagaimana’.
- source_word: אֲכַפֵּר
  choice: aku harus mengadakan pendamaian
  rationale: Piel כפר di sini menyangkut penghapusan kesalahan berat dan pemulihan hubungan akibat pelanggaran perjanjian. ‘Mengadakan pendamaian’ mempertahankan bobot teologis-reparatif tanpa menyiratkan hanya permintaan maaf.
- source_word: וּבָרְכוּ
  choice: supaya kalian memberkati
  rationale: Konjungsi dengan bentuk volitif paling wajar dipahami dalam konteks sebagai tujuan atau hasil yang diharapkan dari tindakan Daud.
- source_word: נַחֲלַת יְהוָה
  choice: milik pusaka Yahweh
  rationale: נחלה berarti pusaka atau bagian milik yang diwariskan; dalam konteks ini menunjuk kepada Israel sebagai umat milik Yahweh. ‘Milik pusaka’ mengungkapkan baik unsur kepemilikan maupun citra warisan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna כפר dalam konteks utang darah dan pelanggaran perjanjian
  choice: mengadakan pendamaian
  alternative: mengadakan pemulihan; menebus kesalahan
  rationale: Pilihan ini menjaga dimensi penghapusan kesalahan dan pemulihan di hadapan Allah serta pihak yang dirugikan, tanpa membatasinya pada ganti rugi sosial.
- issue: Fungsi klausa akhir וּבָרְכוּ אֶת נַחֲלַת יְהוָה
  choice: 'tujuan/hasil: ‘supaya kalian memberkati milik pusaka Yahweh’'
  alternative: 'koordinasi langsung: ‘dan berkatilah milik pusaka Yahweh’'
  rationale: Dalam konteks, Daud menanyakan tindakan yang akan membuat orang Gibeon beralih dari tuntutan akibat kesalahan menuju pemberkatan Israel. Namun, bentuk Ibraninya juga memungkinkan pembacaan sebagai klausa koordinatif, sehingga alternatif itu dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak ‘kalian’ dipakai karena Daud berbicara kepada kelompok orang Gibeon; bentuk terikat ‘kulakukan’ menjaga kelancaran ujaran langsung. Istilah ‘mengadakan pendamaian’ mempertahankan bobot religius כפר sambil tetap dapat dipahami pembaca umum.
