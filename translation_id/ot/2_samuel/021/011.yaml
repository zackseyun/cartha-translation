  text: וַ/יֻּגַּ֖ד לְ/דָוִ֑ד אֵ֧ת אֲשֶׁר עָשְׂתָ֛ה רִצְפָּ֥ה בַת אַיָּ֖ה פִּלֶ֥גֶשׁ שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/011.yaml
  text: And it was reported to David what Rizpah daughter of Aiah, Saul’s concubine, had done.
translation:
  language: id
  text: Lalu diberitahukan kepada Daud apa yang telah dilakukan Rizpa, anak perempuan Aya, gundik Saul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: Lalu diberitahukan
  rationale: Bentuk pasif dari נגד menyatakan bahwa suatu laporan disampaikan; bentuk pasif dipertahankan, sedangkan “Lalu” menghubungkannya dengan alur narasi.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi ל menandai penerima laporan dan secara wajar diterjemahkan “kepada”.
- source_word: אֵת אֲשֶׁר
  choice: apa yang
  rationale: Penanda objek bersama partikel relatif memperkenalkan isi laporan; “apa yang” merupakan padanan Indonesia yang alami.
- source_word: עָשְׂתָה
  choice: telah dilakukan
  rationale: Bentuk perfektif menunjuk pada tindakan Rizpa yang sudah terjadi sebelum laporan disampaikan.
- source_word: רִצְפָּה
  choice: Rizpa
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dan sesuai ejaan Indonesia.
- source_word: בַת אַיָּה
  choice: anak perempuan Aya
  rationale: Ungkapan patronimik diterjemahkan langsung dan jelas, sekaligus menghindari kemungkinan “anak” dipahami sebagai anak laki-laki.
- source_word: פִּלֶגֶשׁ שָׁאוּל
  choice: gundik Saul
  rationale: Rangkaian konstruksi menyatakan status dan hubungan Rizpa dengan Saul; “gundik” mempertahankan sebutan sosial teks tanpa penghalusan.
theological_decisions: []
