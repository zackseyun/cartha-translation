base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/021/020.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six and six, twenty-four in number[c][b]; he also was born to the Rapha.
translation:
  language: id
  text: Terjadi lagi perang di Gat. Di sana ada seorang yang bertubuh sangat besar[a]. Setiap tangan dan setiap kakinya memiliki enam jari[b], seluruhnya berjumlah dua puluh empat. Ia juga keturunan Rafa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang berukuran”; maksudnya mungkin seorang yang sangat besar atau tinggi.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “jari-jari tangannya dan jari-jari kakinya, enam dan enam.” Ungkapan itu, bersama jumlah dua puluh empat, menyatakan enam jari pada setiap tangan dan setiap kaki.
    reason: clarification
  - marker: c
    text: 'Secara harfiah: “dilahirkan bagi Rafa.” Ini dapat berarti bahwa ia berasal dari keturunan Rafa, mungkin berkaitan dengan kaum Refaim yang dikenal bertubuh besar.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִלְחָמָה
  choice: perang
  rationale: Nomina ini menunjuk pada peperangan atau konflik bersenjata; “perang” sesuai dengan konteks rangkaian konflik yang berulang.
- source_word: בְּגַת
  choice: di Gat
  rationale: Preposisi בְּ menyatakan lokasi; “di Gat” merupakan padanan Indonesia yang alami.
- source_word: אִישׁ מדין
  choice: seorang yang bertubuh sangat besar
  rationale: Ungkapan ini berkaitan dengan ukuran tubuh yang luar biasa. Terjemahan ini menyampaikan maknanya secara alami tanpa mempertahankan ungkapan harfiah yang kabur, “seorang berukuran.”
- source_word: אֶצְבְּעֹת יָדָיו ... אֶצְבְּעֹת רַגְלָיו
  choice: jari-jari tangan dan jari-jari kakinya
  rationale: Bahasa Ibrani menyebut secara eksplisit jari tangan dan jari kaki; bahasa Indonesia juga membedakan keduanya dengan ungkapan ini.
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: masing-masing enam
  rationale: Pengulangan angka enam berlaku pada jari tangan dan jari kaki, dan jumlah keseluruhan dua puluh empat menunjukkan enam pada tiap tangan dan tiap kaki. “Masing-masing enam” menyatakannya dengan jelas dan alami.
- source_word: עֶשְׂרִים וְאַרְבַּע מִסְפָּר
  choice: seluruhnya berjumlah dua puluh empat
  rationale: Frasa ini merangkum jumlah semua jari tangan dan kaki; padanan ini dekat dengan makna teks dan jelas bagi pembaca.
- source_word: יֻלַּד לְהָרָפָה
  choice: lahir sebagai keturunan Rafa
  rationale: Bentuk pasif ילד dengan לְ menyatakan hubungan kelahiran atau garis keturunan. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan Rafa sebagai sebutan nama atau leluhur.
theological_decisions:
- issue: Identitas הָרָפָה
  choice: Rafa sebagai sebutan leluhur atau garis keturunan
  alternative: raksasa; kaum Refaim
  rationale: Klausa ini terutama menyatakan asal-usul, bukan sekadar ukuran tubuh. Mempertahankan “Rafa” menghindari memasukkan identifikasi “raksasa” atau “Refaim” secara pasti ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Struktur ayat dipecah menjadi beberapa kalimat agar mudah dibaca, sementara pengulangan peperangan, ukuran tubuh yang luar biasa, rincian dua puluh empat jari, dan ambiguitas identitas Rafa tetap dipertahankan.
