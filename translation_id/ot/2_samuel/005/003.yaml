  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹ֣ת לָ/הֶם֩ הַ/מֶּ֨לֶךְ דָּוִ֥ד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֧וּ אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and King David made a covenant with them at Hebron before Yahweh[b], and they anointed David king over Israel.
translation:
  language: id
  text: Maka semua tua-tua Israel datang menghadap raja di Hebron. Raja Daud mengikat perjanjian[a] dengan mereka di Hebron di hadapan Yahweh,[b] lalu mereka mengurapi Daud menjadi raja atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memotong perjanjian”, sebuah ungkapan Ibrani yang berarti mengikat atau membuat perjanjian.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di hadirat Yahweh”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Bentuk Qal wayyiqtol dari בוא melanjutkan rangkaian narasi dan secara wajar berarti ‘datang’, dengan tujuan dinyatakan oleh frasa berikutnya.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: semua tua-tua Israel
  rationale: Mempertahankan cakupan כָּל dan makna זִקְנֵי sebagai para pemimpin senior atau wakil Israel.
- source_word: אֶל הַמֶּלֶךְ חֶבְרוֹנָה
  choice: menghadap raja di Hebron
  rationale: Akhiran penunjuk arah pada חֶבְרוֹנָה menyatakan gerak menuju Hebron. Ungkapan ‘datang menghadap raja di Hebron’ alami dalam bahasa Indonesia dan menunjukkan bahwa mereka datang kepada raja yang berada di sana.
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah idiom Ibraninya berarti ‘memotong perjanjian’. ‘Mengikat perjanjian’ merupakan ungkapan Indonesia yang alami dan tetap menyampaikan tindakan perjanjian yang resmi serta khidmat.
- source_word: לָהֶם
  choice: dengan mereka
  rationale: Dalam konstruksi כרת ברית, preposisi ini menyatakan pihak yang bersama-sama terikat dalam perjanjian.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Terjemahan ini mempertahankan latar resmi dan sakral perjanjian serta mengikuti bentuk nama ilahi dalam sumber.
- source_word: וַיִּמְשְׁחוּ
  choice: mereka mengurapi
  rationale: Dalam konteks kerajaan, משׁח menunjuk pada tindakan pengurapan untuk menetapkan seseorang sebagai raja.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: menjadi raja atas Israel
  rationale: Menyampaikan penetapan Daud pada jabatan raja dan kekuasaannya atas Israel tanpa memperluas makna sumber.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan gelar dan nama ini merupakan padanan Indonesia yang alami bagi konstruksi aposisional Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: ‘Yahweh’ mempertahankan nama diri ilahi dalam teks sumber dan mengikuti ketentuan proyek, tanpa menggantinya dengan gelar.
- issue: Bobot istilah בְּרִית
  choice: perjanjian
  alternative: kesepakatan
  rationale: ‘Perjanjian’ mempertahankan bobot politik, sakral, dan relasional istilah Ibrani dalam konteks penetapan raja; ‘kesepakatan’ terlalu lemah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Tua-tua’ dipertahankan sebagai istilah kepemimpinan komunal yang lazim dalam konteks Alkitab, sedangkan ‘menghadap’ membuat arah kedatangan kepada raja terdengar alami. Penanda wacana ‘Maka’ dan ‘lalu’ mencerminkan urutan naratif tanpa membuat kalimat terasa kaku.
