  text: וְ/אֵ֗לֶּה שְׁמ֛וֹת הַ/יִּלֹּדִ֥ים ל֖/וֹ בִּ/ירוּשָׁלִָ֑ם שַׁמּ֣וּעַ וְ/שׁוֹבָ֔ב וְ/נָתָ֖ן וּ/שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/014.yaml
  text: 'These are the names of those born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: id
  text: 'Inilah nama anak-anak yang lahir baginya di Yerusalem: Syamua, Syobab, Natan, dan Salomo.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar dalam bahasa Indonesia; waw pembuka tidak perlu diterjemahkan tersendiri.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Bentuk jamak konstruksi ini memperkenalkan nama-nama dalam daftar; setelah 'inilah', bentuk 'nama' alami dalam bahasa Indonesia.
- source_word: הַיִּלֹּדִים
  choice: anak-anak yang lahir
  rationale: Partisipel pasif ini secara harfiah berarti 'mereka yang dilahirkan'. Dalam konteks keturunan Daud, 'anak-anak yang lahir' jelas dan alami tanpa mempersempit bentuk Ibrani menjadi 'anak-anak lelaki'.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ini menyatakan hubungan orang tua dalam ungkapan Ibrani tentang anak yang lahir bagi seseorang.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Frasa lokatif yang menyatakan tempat kelahiran.
- source_word: שַׁמּוּעַ
  choice: Syamua
  rationale: Transliterasi nama Ibrani dengan ejaan yang sesuai bagi pembaca Indonesia.
- source_word: שׁוֹבָב
  choice: Syobab
  rationale: Transliterasi langsung dengan ejaan Indonesia.
- source_word: נָתָן
  choice: Natan
  rationale: Bentuk nama yang lazim dan sesuai dengan transliterasi Indonesia.
- source_word: שְׁלֹמֹה
  choice: Salomo
  rationale: Bentuk baku nama ini dalam tradisi Alkitab bahasa Indonesia.
