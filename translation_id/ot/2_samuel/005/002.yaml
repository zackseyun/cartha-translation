  text: גַּם אֶתְמ֣וֹל גַּם שִׁלְשׁ֗וֹם בִּ/הְי֨וֹת שָׁא֥וּל מֶ֨לֶךְ֙ עָלֵ֔י/נוּ אַתָּ֗ה הייתה מוציא ו/ה/מבי אֶת יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר יְהוָ֜ה לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּ֛ה תִּהְיֶ֥ה לְ/נָגִ֖יד עַל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/002.yaml
  text: Also previously[a], when Saul was king over us, you were the one who led Israel out and brought them in. And Yahweh said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over Israel.’
translation:
  language: id
  text: Jauh sebelumnya[a], ketika Saul masih menjadi raja kami, engkaulah yang memimpin Israel keluar dan membawa mereka masuk[b]. Yahweh berfirman kepadamu, ‘Engkau akan menggembalakan umat-Ku Israel, dan engkau akan menjadi pemimpin[c] atas Israel.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kemarin dan kemarin dulu”; sebuah ungkapan Ibrani yang berarti “dahulu” atau “sejak beberapa waktu sebelumnya”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “membawa Israel keluar dan membawa mereka masuk”; sebuah ungkapan Ibrani tentang memimpin bangsa dalam berbagai urusan mereka, khususnya dalam peperangan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “penguasa”. Kata Ibrani yang dipakai berbeda dari kata yang lazim untuk “raja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֶתְמוֹל גַּם שִׁלְשׁוֹם
  choice: Dahulu juga
  rationale: Ungkapan ini secara harfiah menyebut ‘kemarin dan hari sebelumnya’, tetapi secara idiomatis berarti dahulu atau sebelumnya. ‘Dahulu juga’ alami dalam bahasa Indonesia dan mempertahankan גַּם sebagai penghubung dengan ayat sebelumnya.
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ
  choice: ketika Saul menjadi raja atas kami
  rationale: Konstruksi ב dengan infinitif membentuk klausa waktu. ‘Menjadi raja atas kami’ menyampaikan keadaan Saul sebagai raja tanpa memperluas makna.
- source_word: אַתָּה
  choice: engkaulah
  rationale: Pronomina mandiri bersifat emfatis; partikel -lah mengungkapkan penekanan itu secara wajar dan bermartabat.
- source_word: מוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: memimpin Israel keluar dan membawa mereka masuk
  rationale: Terjemahan ini mempertahankan citra keluar-masuk sekaligus menjelaskan fungsi kepemimpinan yang tersirat. ‘Mereka’ merujuk secara alami kepada bangsa Israel.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh berfirman
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’. ‘Berfirman’ sesuai dengan register narasi Kitab Suci Indonesia ketika Allah berbicara.
- source_word: תִרְעֶה
  choice: Engkau akan menggembalakan
  rationale: Kata רעה memakai metafora penggembalaan bagi pemerintahan. Bentuk ini mempertahankan citra kerajaan-pastoral dalam sumber.
- source_word: נָגִיד
  choice: pemimpin
  rationale: נָגִיד menunjuk orang yang ditetapkan sebagai pemimpin atau penguasa dan berbeda dari kata biasa untuk ‘raja’. ‘Pemimpin’ jelas dalam bahasa Indonesia serta tidak menyiratkan gelar turun-temurun seperti ‘pangeran’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Metafora kerajaan dalam תִרְעֶה
  choice: menggembalakan
  alternative: memerintah
  rationale: Sumber menggambarkan tugas raja melalui penggembalaan. Mempertahankan metafora menjaga tekstur teologis bahwa pemimpin merawat dan menuntun umat Allah.
- issue: Perbedaan נָגִיד dari istilah umum untuk raja
  choice: pemimpin
  alternative: penguasa
  rationale: ‘Pemimpin’ mempertahankan gagasan penunjukan kepada kepemimpinan tanpa menyamakan נָגִיד dengan מֶלֶךְ (‘raja’). Catatan kaki memberi alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. ‘Engkau’ dipakai dalam kutipan ilahi dan sapaan resmi; ‘kami’ mengikuti sudut pandang para tua-tua Israel. Susunan penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
