  rationale: Nama diri Ibrani ditransliterasikan sebagai “Elyada”; konjungsi ו dipahami sebagai bagian dari rangkaian nama dan diungkapkan melalui susunan daftar Indonesia yang alami.
- source_word: וֶ/אֱלִיפָלֶט
  choice: dan Elifelet
  rationale: Konjungsi terakhir diterjemahkan “dan” sesuai kaidah daftar dalam bahasa Indonesia; nama Ibrani ditransliterasikan sebagai “Elifelet” tanpa menerjemahkan makna etimologisnya.
