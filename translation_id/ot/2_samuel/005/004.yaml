  text: David was thirty years old when he began to reign[b][a], and he reigned forty years.
translation:
  language: id
  text: Daud berumur tiga puluh tahun ketika ia mulai memerintah, dan ia memerintah selama empat puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: berumur tiga puluh tahun
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'anak tiga puluh tahun' merupakan idiom baku untuk menyatakan usia; terjemahan idiomatis ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Preposisi ב pada bentuk infinitif konstruk מלך dengan sufiks orang ketiga tunggal maskulin menyatakan waktu naik takhta atau awal pemerintahan dalam rumusan masa pemerintahan.
- source_word: מָלָךְ
  choice: ia memerintah
  rationale: Kata kerja מלך menyatakan pelaksanaan pemerintahan sebagai raja; 'memerintah' merupakan padanan Indonesia yang tepat dan alami dalam ringkasan masa pemerintahan.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Numeralia dan nomina ini menyatakan lamanya pemerintahan; 'selama' memperjelas fungsi duratif secara alami tanpa menambah makna.
- source_word: דָּוִד
  choice: Daud
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
