  yaml_path: translation/ot/2_samuel/005/021.yaml
  text: And they left their idols there[b][a], and David and his men carried them away.
translation:
  language: id
  text: Mereka meninggalkan berhala-berhala mereka di sana[b], lalu Daud dan orang-orangnya membawa berhala-berhala itu pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 Tawarikh 14:12 menambahkan bahwa Daud memberi perintah, lalu berhala-berhala itu dibakar. Di sini teks Ibrani Samuel hanya mengatakan bahwa Daud dan orang-orangnya membawa berhala-berhala itu pergi.
    reason: cross_reference
  - marker: b
    text: Atau “patung-patung mereka.” Istilah Ibrani ini menunjuk pada patung atau gambar untuk pemujaan; “berhala-berhala” memperjelas maksudnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: mereka meninggalkan
  rationale: Kata kerja עזב di sini menggambarkan pasukan Filistin yang mundur dan meninggalkan benda-benda mereka; “meninggalkan” alami dan tidak menambahkan maksud yang tidak dinyatakan.
- source_word: שָׁם
  choice: di sana
  rationale: Adverbia tempat ini diterjemahkan secara langsung dan mempertahankan alur narasi.
- source_word: עֲצַבֵּיהֶם
  choice: berhala-berhala mereka
  rationale: Nomina ini dapat berarti patung atau gambar kultis. Dalam konteks keagamaan ini, “berhala-berhala” menyatakan fungsi benda-benda tersebut dengan jelas, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: וַיִּשָּׂאֵם
  choice: mengangkutnya pergi
  rationale: נשא dapat berarti mengangkat, membawa, atau mengangkut. “Mengangkutnya pergi” sesuai dengan tindakan fisik yang dinyatakan serta tidak menentukan tujuan atau tindakan selanjutnya.
- source_word: דָּוִד וַאֲנָשָׁיו
  choice: Daud dan anak buahnya
  rationale: Ungkapan ini secara harfiah berarti “Daud dan orang-orangnya.” Dalam konteks rombongan tempur, “anak buahnya” merupakan ungkapan Indonesia yang alami tanpa mempersempit mereka secara eksplisit menjadi tentara.
theological_decisions:
- issue: Hubungan dengan kisah sejajar dalam 1 Tawarikh 14:12 yang menyebut pembakaran berhala
  choice: Menerjemahkan teks Masoret 2 Samuel sebagai “mengangkutnya pergi” tanpa menyelaraskannya dengan Tawarikh
  alternative: Menyiratkan bahwa berhala-berhala itu langsung dibakar atau menerjemahkan tindakan tersebut sebagai pemusnahan
  rationale: Teks Ibrani 2 Samuel hanya menyatakan bahwa Daud dan anak buahnya membawa benda-benda itu pergi. Keterangan bahwa Daud memerintahkan pembakarannya berasal dari kisah sejajar dan dipertahankan dalam catatan kaki, bukan dimasukkan ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Anak buahnya” dipilih sebagai padanan alami untuk “orang-orangnya” dalam konteks pasukan, sedangkan “mengangkutnya pergi” mempertahankan keluasan makna tindakan tanpa menyelaraskan ayat ini dengan kisah sejajar.
