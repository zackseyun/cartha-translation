  text: בְּ/חֶבְרוֹן֙ מָלַ֣ךְ עַל יְהוּדָ֔ה שֶׁ֥בַע שָׁנִ֖ים וְ/שִׁשָּׁ֣ה חֳדָשִׁ֑ים וּ/בִ/ירוּשָׁלִַ֣ם מָלַ֗ךְ שְׁלֹשִׁ֤ים וְ/שָׁלֹשׁ֙ שָׁנָ֔ה עַ֥ל כָּל יִשְׂרָאֵ֖ל וִ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/005.yaml
  text: In Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
translation:
  language: id
  text: Di Hebron ia memerintah atas Yehuda selama tujuh tahun enam bulan, dan di Yerusalem ia memerintah atas seluruh Israel dan Yehuda selama tiga puluh tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּחֶבְרוֹן
  choice: Di Hebron
  rationale: Preposisi ב menyatakan lokasi; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: מָלַךְ
  choice: ia memerintah
  rationale: Bentuk qatal dalam konteks ini merangkum masa pemerintahan, bukan hanya saat naik takhta.
- source_word: עַל יְהוּדָה
  choice: atas Yehuda
  rationale: עַל bersama מָלַךְ menunjukkan rakyat atau wilayah yang diperintah; pilihan ini mempertahankan bentuk dan makna sumber.
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: selama tujuh tahun enam bulan
  rationale: Keterangan 'selama' memperjelas durasi secara alami tanpa mengubah isinya.
- source_word: וּבִירוּשָׁלַם
  choice: dan di Yerusalem
  rationale: Gabungan konjungsi dan preposisi memperkenalkan lokasi kedua pemerintahannya.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ שָׁנָה
  choice: selama tiga puluh tiga tahun
  rationale: Angka Ibrani dialihkan ke bentuk bilangan baku bahasa Indonesia, dengan 'selama' untuk menyatakan durasi.
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: atas seluruh Israel dan Yehuda
  rationale: Mempertahankan penyebutan kedua unsur politik dalam kerajaan itu; כָּל diterjemahkan 'seluruh' dan tidak ditafsirkan sebagai penyamaan Israel dengan Yehuda.
