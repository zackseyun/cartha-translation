id: 2SA.5.24
reference: 2 Samuel 5:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִ֠/יהִי ב/שמע/ך אֶת ק֧וֹל צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים אָ֣ז תֶּחֱרָ֑ץ כִּ֣י אָ֗ז יָצָ֤א יְהוָה֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת בְּ/מַחֲנֵ֥ה פְלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/024.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then act decisively, for then Yahweh has gone out before you to strike down the camp of the Philistines.
translation:
  language: id
  text: Apabila engkau mendengar bunyi derap langkah di pucuk-pucuk pohon balsam[a], bertindaklah dengan tegas, sebab pada saat itu Yahweh telah maju mendahuluimu untuk menyerang perkemahan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon baka”; jenis pohon yang dimaksud oleh kata Ibrani ini tidak diketahui dengan pasti. Terjemahan lama kadang-kadang memakai “pohon murbei”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי בְשָׁמְעֲךָ
  choice: Apabila engkau mendengar
  rationale: Konstruksi וִיהִי dengan infinitif בְשָׁמְעֲךָ memperkenalkan keadaan waktu yang akan datang. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan temporalnya.
- source_word: קוֹל צְעָדָה
  choice: bunyi derap langkah
  rationale: קוֹל berarti bunyi atau suara, sedangkan צְעָדָה menunjuk pada langkah atau gerak berbaris. 'Derap langkah' menyampaikan nuansa gerakan teratur dalam konteks militer tanpa menentukan siapa yang melangkah.
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: di pucuk-pucuk pohon balsam
  rationale: רָאשֵׁי adalah bentuk jamak yang berarti bagian atas atau pucuk. הַבְּכָאִים merupakan nama pohon yang spesies tepatnya tidak pasti; 'pohon balsam' adalah padanan leksikal yang lazim, sementara ketidakpastian itu dicatat dalam catatan kaki.
- source_word: אָז תֶּחֱרָץ
  choice: bertindaklah dengan tegas
  rationale: Dalam konteks ini חרץ menyatakan tindakan yang sigap, kuat, dan menentukan. Padanan ini mempertahankan desakan untuk bertindak tanpa membatasinya hanya pada kecepatan.
- source_word: יָצָא יְהוָה לְפָנֶיךָ
  choice: Yahweh telah maju mendahuluimu
  rationale: Perfect יָצָא menggambarkan tindakan Yahweh yang sudah dimulai ketika tanda terdengar. 'Maju mendahuluimu' menyampaikan gerakan keluar ke medan perang dan makna לְפָנֶיךָ bahwa Yahweh pergi di depan Daud.
- source_word: לְהַכּוֹת בְּמַחֲנֵה פְלִשְׁתִּים
  choice: untuk menyerang perkemahan orang Filistin
  rationale: נכה dalam bentuk kausatif dan konteks perang menyatakan tindakan memukul atau menyerang, sedangkan מַחֲנֶה secara langsung berarti perkemahan dan secara kontekstual mencakup pasukan yang berkemah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan mengikuti bukti pelafalan yang paling luas diterima, tanpa menggantinya dengan gelar.
- issue: Yahweh maju lebih dahulu dalam pertempuran
  choice: telah maju mendahuluimu
  alternative: akan maju mendahuluimu; maju di depanmu
  rationale: Bentuk perfect יָצָא dipertahankan sebagai tindakan yang telah dimulai pada saat Daud mendengar tanda. Terjemahan ini tidak menghapus ketegangan antara tindakan ilahi yang mendahului dan tindakan tegas yang tetap diperintahkan kepada Daud.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' dipakai karena tuturan langsung ditujukan kepada satu orang. Ungkapan 'bunyi derap langkah' mempertahankan citra adikodrati yang terdengar di pucuk pohon tanpa menjelaskannya secara spekulatif.
