  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ כָּל שִׁבְטֵ֧י יִשְׂרָאֵ֛ל אֶל דָּוִ֖ד חֶבְר֑וֹנָ/ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר הִנְ/נ֛וּ עַצְמְ/ךָ֥ וּֽ/בְשָׂרְ/ךָ֖ אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/001.yaml
  text: Then all the tribes of Israel came to David at Hebron and said[a], “Look[b], we are your bone and your flesh.”
translation:
  language: id
  text: Kemudian semua suku Israel datang kepada Daud di Hebron[a] dan berkata, “Lihatlah, kami ini tulangmu dan dagingmu.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Hebron”; bentuk Ibrani nama “Hebron” memakai akhiran penunjuk arah.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “tulangmu dan dagingmu” menyatakan hubungan darah yang dekat atau identitas sebagai satu keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia, sedangkan “datang” merupakan arti langsung verba בוא.
- source_word: כָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: semua suku Israel
  rationale: Ungkapan ini bersifat kolektif dan menunjuk seluruh kesatuan suku-suku Israel.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: Preposisi אֶל menandai gerak menuju seseorang; “kepada Daud” merupakan padanan langsung dan alami.
- source_word: חֶבְרֹנָה
  choice: di Hebron
  rationale: Akhiran penunjuk arah pada nama tempat dapat berarti “ke Hebron”, tetapi karena gerak menuju Daud sudah dinyatakan, “kepada Daud di Hebron” secara alami mempertahankan Daud sebagai tujuan dan Hebron sebagai lokasi. Alternatif sumber dicatat dalam catatan kaki.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: dan berkata
  rationale: Formula ujaran Ibrani ini secara idiomatis cukup diterjemahkan “dan berkata”; menerjemahkan kedua unsurnya secara terpisah akan terasa kaku dan berlebihan.
- source_word: הִנּוּ
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian secara tegas. “Lihatlah” mempertahankan daya deiktisnya dalam ragam Indonesia modern yang bermartabat.
- source_word: עַצְמְךָ וּבְשָׂרְךָ
  choice: tulangmu dan dagingmu
  rationale: Terjemahan ini mempertahankan urutan dan metafora Ibrani yang menyatakan hubungan darah serta identitas kekeluargaan.
- source_word: אֲנָחְנוּ
  choice: kami ini
  rationale: Klausa nominal Ibrani tidak memakai kopula. “Kami ini” menyampaikan identifikasi yang ditekankan secara alami; “kami” juga tepat karena para suku berbicara kepada Daud yang tidak termasuk dalam kelompok penutur.
theological_decisions:
- issue: Rumus kekerabatan dan daya politis-teologisnya
  choice: kami ini tulangmu dan dagingmu
  alternative: kami adalah kaum keluargamu; kami adalah bangsamu sendiri
  rationale: Ungkapan harfiah mempertahankan metafora kekeluargaan yang mendasari permohonan politik mereka kepada Daud. Parafrasa dapat mempersempit atau terlalu menjelaskan hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan metafora kekerabatan sumber. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
