  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֤ל דָּוִד֙ בַּֽ/יהוָ֔ה וַ/יֹּ֖אמֶר לֹ֣א תַעֲלֶ֑ה הָסֵב֙ אֶל אַ֣חֲרֵי/הֶ֔ם וּ/בָ֥אתָ לָ/הֶ֖ם מִ/מּ֥וּל בְּכָאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/023.yaml
  text: So David inquired of Yahweh[a], and he said, “You shall not go up; circle around behind them, and come against them opposite the balsam trees.”
translation:
  language: id
  text: Lalu Daud meminta petunjuk kepada Yahweh, dan Yahweh menjawab, “Jangan maju. Ambillah jalan memutar ke belakang mereka, lalu datanglah menyerang mereka dari arah yang berhadapan dengan pohon-pohon baka[a] itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon balsam”; menurut terjemahan tradisional, “pohon-pohon murbei.” Jenis pohon yang dimaksud oleh kata Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konteks keputusan militer, שׁאל dengan בַּיהוָה berarti mencari petunjuk ilahi, bukan sekadar mengajukan pertanyaan.
- source_word: לֹא תַעֲלֶה
  choice: Jangan maju dari sini
  rationale: עלה secara harfiah berarti 'naik/pergi naik', tetapi dalam konteks gerakan pasukan bermakna maju menyerang; 'dari sini' membantu mengungkap kontras dengan perintah mengambil rute memutar tanpa menentukan arah geografis.
- source_word: הָסֵב אֶל אַחֲרֵיהֶם
  choice: Berputarlah ke belakang mereka
  rationale: Ungkapan ini memerintahkan manuver memutar menuju bagian belakang posisi musuh.
- source_word: וּבָאתָ לָהֶם
  choice: datanglah menyerang mereka
  rationale: בוא dengan ל dalam konteks peperangan memiliki nuansa mendatangi pihak lawan; 'menyerang' menyatakan maksud adversatifnya secara alami.
- source_word: מִמּוּל
  choice: dari arah yang berhadapan dengan
  rationale: מִמּוּל menunjukkan posisi atau arah di seberang/depan sesuatu. Rumusan ini mempertahankan hubungan spasial dengan pepohonan.
- source_word: בְּכָאִים
  choice: pohon-pohon baka
  rationale: Jenis pohon yang dimaksud tidak dapat dipastikan. Transliterasi 'baka' menghindari penetapan spesies secara berlebihan, sedangkan kemungkinan identifikasinya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; bentuk 'Yahweh' mempertahankan nama diri tersebut tanpa menggantinya dengan gelar.
- issue: Subjek וַיֹּאמֶר setelah Daud meminta petunjuk
  choice: Ia menjawab
  alternative: Yahweh berfirman
  rationale: Bentuk Ibrani secara harfiah hanya menyatakan 'dan ia berkata', dengan Yahweh sebagai rujukan wajar dari konteks. Kata 'menjawab' membuat hubungan wacana alami tanpa menambahkan formula 'berfirman' yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah taktis dibuat jelas bagi pembaca umum, sedangkan ketidakpastian nama pohon dipertahankan melalui transliterasi dan catatan kaki.
