  text: וַ/יֵּ֣דַע דָּוִ֔ד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל וְ/כִי֙ נִשֵּׂ֣א מַמְלַכְתּ֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/012.yaml
  text: And David knew that Yahweh had established him as king over Israel[a], and that he had exalted his kingdom for the sake of his people Israel.
translation:
  language: id
  text: Daud pun mengetahui bahwa Yahweh telah mengukuhkannya sebagai raja atas Israel, dan bahwa Dia telah meninggikan kerajaannya demi umat-Nya, Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “demi umat Daud, Israel,” jika akhiran “-Nya” dipahami merujuk kepada Daud, bukan kepada Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: mengetahui
  rationale: Kata ידע menyatakan mengetahui atau menjadi sadar. “Mengetahui” merupakan padanan langsung yang tetap wajar dalam gaya naratif.
- source_word: הֱכִינוֹ
  choice: telah meneguhkan dia
  rationale: Bentuk Hifil dari כון berarti membuat teguh, menetapkan, atau mengukuhkan. Dalam konteks kerajaan, “meneguhkan dia” menyampaikan bahwa Yahweh mengokohkan kedudukan Daud sebagai raja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan, bukan diganti dengan gelar.
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: sebagai raja atas Israel
  rationale: Preposisi ל menandai jabatan atau peran, sedangkan עַל dalam konteks kerajaan menunjukkan lingkup pemerintahan.
- source_word: נִשֵּׂא
  choice: telah meninggikan
  rationale: Bentuk dari נשׂא di sini menyatakan pengangkatan atau peninggian. “Meninggikan” mempertahankan citra dan nuansa kerajaan dalam teks sumber.
- source_word: מַמְלַכְתּוֹ
  choice: kerajaannya
  rationale: ממלכה dapat berarti kerajaan, pemerintahan, atau kekuasaan kerajaan. “Kerajaannya” adalah padanan yang langsung dan cukup luas.
- source_word: בַּעֲבוּר
  choice: demi
  rationale: Ungkapan ini menunjukkan tujuan atau kepentingan penerima manfaat. “Demi” menyampaikannya secara ringkas dan alami dalam bahasa Indonesia.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: umat-Nya, Israel
  rationale: Susunan aposisional ini mengidentifikasi Israel sebagai umat milik Yahweh menurut rujukan yang paling mungkin. Tanda koma memperjelas bahwa “Israel” menjelaskan “umat-Nya”.
theological_decisions:
- issue: Anteseden akhiran pronominal pada עַמּוֹ (“umat-Nya”)
  choice: 'Akhiran itu dipahami merujuk kepada Yahweh: “umat-Nya, Israel.”'
  alternative: 'Akhiran itu dapat dipahami merujuk kepada Daud: “rakyatnya, Israel.”'
  rationale: 'Yahweh adalah pelaku dalam klausa sebelumnya: Dia meneguhkan Daud dan meninggikan kerajaannya. Karena itu, rujukan kepada Israel sebagai umat Yahweh paling alami dalam konteks ini. Namun, tata bahasa memungkinkan pronomina itu dikaitkan dengan Daud, sehingga kemungkinan tersebut dipertahankan dalam catatan kaki.'
- issue: Anteseden akhiran pada מַמְלַכְתּוֹ (“kerajaannya”)
  choice: Akhiran dipahami merujuk kepada Daud, sedangkan subjek tindakan tetap Yahweh.
  alternative: Secara bentuk, rangkaian pronominal dapat terasa tidak eksplisit, tetapi konteks kerajaan Daud mendukung rujukan kepada Daud.
  rationale: Yahweh meneguhkan Daud sebagai raja; karena itu, kerajaan yang ditinggikan secara paling alami adalah kerajaan Daud. Huruf kecil pada “kerajaannya” membedakannya dari “Dia” dan “umat-Nya,” yang merujuk kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Lalu” menjaga alur waw konsekutif tanpa membuat kalimat kaku. Kapitalisasi “Dia” dan “umat-Nya” menunjukkan rujukan kepada Yahweh; “kerajaannya” merujuk kepada Daud. Catatan kaki ditempatkan setelah “Israel” dan penandanya hadir dalam teks utama.
