  text: וּ/פְלִשְׁתִּ֖ים בָּ֑אוּ וַ/יִּנָּטְשׁ֖וּ בְּ/עֵ֥מֶק רְפָאִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/018.yaml
  text: And the Philistines came and spread out in the Valley of Rephaim[a].
translation:
  language: id
  text: Orang Filistin datang dan menyebar di Lembah Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggelar pasukan” di Lembah Refaim.
    reason: Alternatif ini menyatakan secara lebih eksplisit kemungkinan nuansa militer dari וַיִּנָּטְשׁוּ.
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: Orang Filistin
  rationale: Nama bangsa פְלִשְׁתִּים diterjemahkan dengan bentuk baku bahasa Indonesia. Konjungsi ו tidak dinyatakan tersendiri karena ayat ini dalam bahasa Indonesia tetap mengalir alami tanpa kata pembuka “dan”.
- source_word: בָּאוּ
  choice: datang
  rationale: Bentuk qal perfektif dari בוא dalam alur narasi secara alami berarti “datang”.
- source_word: וַ/יִּנָּטְשׁוּ
  choice: menyebar
  rationale: Dalam konteks gerakan pasukan, נטשׁ menggambarkan mereka mengambil posisi meluas di suatu wilayah. “Menyebar” mempertahankan gambaran tersebut tanpa menambahkan istilah militer yang terlalu teknis.
- source_word: בְּ/עֵמֶק
  choice: di Lembah
  rationale: Preposisi ב bersifat lokatif, sedangkan עֵמֶק berarti “lembah”. Huruf kapital dipakai karena unsur ini merupakan bagian dari nama tempat.
- source_word: רְפָאִים
  choice: Refaim
  rationale: Dalam nama tempat עֵמֶק רְפָאִים, nama tersebut ditransliterasikan menurut ejaan Indonesia, bukan diterjemahkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pilihan “menyebar” mudah dipahami pembaca umum, sementara kemungkinan makna militer yang lebih teknis dipertahankan dalam catatan kaki.
