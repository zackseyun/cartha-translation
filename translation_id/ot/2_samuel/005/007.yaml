  text: וַ/יִּלְכֹּ֣ד דָּוִ֔ד אֵ֖ת מְצֻדַ֣ת צִיּ֑וֹן הִ֖יא עִ֥יר דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/007.yaml
  text: But David captured the stronghold of Zion[a], that is, the City of David.
translation:
  language: id
  text: Namun, Daud merebut kubu pertahanan Sion[a], yaitu Kota Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benteng Sion.” Istilah Ibrani ini menunjuk pada tempat kuat yang dibentengi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Kata kerja לכד dalam konteks militer berarti menangkap atau menguasai suatu tempat. “Merebut” alami dalam bahasa Indonesia dan menyampaikan bahwa tempat itu dikuasai melalui penaklukan.
- source_word: וַ
  choice: Namun
  rationale: Waw konsekutif melanjutkan narasi, tetapi dalam konteks ini juga menandai kontras ringan dengan keyakinan orang Yebus pada ayat sebelumnya. “Namun” mengungkapkan fungsi wacana itu secara wajar.
- source_word: מְצֻדַת
  choice: kubu pertahanan
  rationale: Nomina מְצוּדָה menunjuk pada tempat kuat yang dibentengi. “Kubu pertahanan” jelas bagi pembaca modern dan tidak terlalu menentukan bentuk arsitekturnya.
- source_word: צִיּוֹן
  choice: Sion
  rationale: Nama tempat ini dialihaksarakan menurut bentuk Indonesia yang sudah mapan.
- source_word: הִיא
  choice: yaitu
  rationale: Pronomina mandiri ini berfungsi secara aposisional untuk mengidentifikasi kubu pertahanan Sion dengan frasa sesudahnya. “Yaitu” menyampaikan fungsi penjelas tersebut dengan alami.
- source_word: עִיר דָּוִד
  choice: Kota Daud
  rationale: Frasa konstruksi ini merupakan sebutan tempat. “Kota Daud” mempertahankan hubungan kepemilikan/asosiasi dan mengikuti bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat ringkas sesuai narasi sejarah; “Namun” mempertahankan kontras kontekstual, sedangkan “kubu pertahanan” menyampaikan arti militer tanpa mempersempitnya pada jenis bangunan tertentu.
