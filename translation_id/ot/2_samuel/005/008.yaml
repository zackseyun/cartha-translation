    issue: “hendaklah ia mencapai” memberi nuansa modal tambahan.
    rationale: וְיִגַּע dapat diterjemahkan secara berurutan sebagai “dan mencapai”; penerjemahan sebagai perintah eksplisit tidak perlu dan kurang selaras dengan audit trail bahasa sumber.
  - severity: medium
    issue: “juga orang lumpuh dan orang buta” menafsirkan konjungsi sumber.
    rationale: Teks Ibrani memakai וְאֶת ... וְאֶת, sementara fungsi tepat frasa itu diperselisihkan. “Dan” mempertahankan ambiguitas lebih baik daripada “juga.”
  - severity: low
    issue: “tidak boleh masuk” dapat dibaca sebagai larangan normatif.
    rationale: Imperfek negatif dalam pepatah lebih aman diterjemahkan “tidak akan masuk,” tanpa menyatakan secara berlebihan bahwa ini suatu larangan yang sedang diberlakukan.
  - severity: low
    issue: Penanda catatan tentang sintaks sulit ditempatkan di akhir seluruh kutipan.
    rationale: Memindahkannya ke frasa “orang lumpuh dan orang buta” memperjelas jangkar catatan tanpa mengubah makna.
