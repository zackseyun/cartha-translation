review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena “hendaklah ia mencapai” menambahkan nuansa perintah/jusif yang tidak perlu dipastikan oleh bentuk Ibrani berwaw itu. Selain itu, “juga” lebih menafsirkan hubungan sintaktis daripada konjungsi וְ (“dan”). Klausa tersebut memang sengaja dibiarkan sulit, sebagaimana teks Masoret.
  naturalness: Bahasa naratif lainnya baku dan jelas. Klausa dalam ucapan Daud tetap terasa terputus dalam bahasa Indonesia, tetapi ini merupakan konsekuensi yang tepat dari sintaks Ibrani yang sangat padat dan dipaparkan dalam catatan kaki. “Tidak akan masuk” lebih dekat dengan pernyataan pepatah/prospektif daripada “tidak boleh masuk,” yang dapat terdengar sebagai larangan eksplisit.
  terminology: “Orang Yebus,” “saluran air,” “jiwa Daud,” dan “rumah” dapat dipertahankan. Istilah “orang lumpuh” dan “orang buta” mencerminkan substantiva Ibrani tanpa memperluasnya menjadi penilaian normatif. Catatan tentang kemungkinan “kediaman raja atau istana” tepat, dan tidak mengidentifikasikan rumah itu dengan bait suci.
  issues:
