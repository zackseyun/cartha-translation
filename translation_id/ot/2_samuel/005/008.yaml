  text: וַ/יֹּ֨אמֶר דָּוִ֜ד בַּ/יּ֣וֹם הַ/ה֗וּא כָּל מַכֵּ֤ה יְבֻסִי֙ וְ/יִגַּ֣ע בַּ/צִּנּ֔וֹר וְ/אֶת הַ/פִּסְחִים֙ וְ/אֶת הַ֣/עִוְרִ֔ים שנאו נֶ֣פֶשׁ דָּוִ֑ד עַל כֵּן֙ יֹֽאמְר֔וּ עִוֵּ֣ר וּ/פִסֵּ֔חַ לֹ֥א יָב֖וֹא אֶל הַ/בָּֽיִת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/008.yaml
  text: And David said on that day[a], “Whoever strikes the Jebusites and reaches the water shaft, and the lame and the blind, whom David’s soul hates.” Therefore they say[c][b], “The blind and the lame shall not come into the house.”
translation:
  language: id
  text: Pada hari itu Daud berkata, “Siapa pun yang menyerang orang Yebus dan mencapai saluran air[a], dan orang lumpuh serta orang buta[c] yang dibenci jiwa Daud.” Itulah sebabnya orang berkata, “Orang buta dan orang lumpuh tidak akan masuk ke dalam rumah[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “poros air”, “terowongan”, atau “selokan”. Kata Ibrani ini mungkin menunjuk pada suatu bagian sistem air, tetapi arti tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “rumah” mungkin berarti kediaman raja atau istana.
    reason: lexical_alternative
  - marker: c
    text: Susunan kalimat Ibrani pada bagian tantangan Daud sangat sulit. Sebagian orang memahami kata-kata tentang “orang lumpuh dan orang buta” sebagai bagian dari ejekan orang Yebus dalam ayat sebelumnya, bukan sebagai objek dalam tantangan Daud.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַכֵּה יְבֻסִי
  choice: Siapa pun yang menyerang orang Yebus
  rationale: כָּל dengan partisipel berfungsi sebagai rumusan tantangan tak tentu. יְבֻסִי berbentuk tunggal kolektif/gentilik, sehingga 'orang Yebus' wajar dalam bahasa Indonesia.
- source_word: וְיִגַּע
  choice: hendaklah ia mencapai
  rationale: נגע berarti 'menyentuh/mencapai'. Dalam konteks penyerbuan dan dengan בַּצִּנּוֹר, 'mencapai' paling alami; bentuk 'hendaklah' membuat tantangan yang eliptis dapat dipahami tanpa mengartikan verba ini sebagai 'menyerang'.
- source_word: בַּצִּנּוֹר
  choice: saluran air
  rationale: צִנּוֹר adalah istilah topografis yang sukar dan mungkin menunjuk pada bagian sistem air, lorong, atau poros air. 'Saluran air' jelas dan tidak terlalu menentukan bentuk bangunannya.
- source_word: וְאֶת הַפִּסְחִים וְאֶת הָעִוְרִים
  choice: juga orang lumpuh dan orang buta
  rationale: Kedua adjektiva dipakai secara substantival. 'Juga' menandai hubungan objek yang mungkin tersirat dalam sintaks Ibrani yang sangat padat, tetapi catatan kaki mempertahankan ketidakpastian susunannya.
- source_word: שנאו נֶפֶשׁ דָּוִד
  choice: yang dibenci jiwa Daud
  rationale: Ungkapan harfiahnya menyebut 'jiwa Daud' sebagai subjek yang membenci. Bentuk ini mempertahankan idiom, intensitas, dan ketegangan teks sumber tanpa melunakkannya menjadi sekadar 'yang dibenci Daud'.
- source_word: עַל כֵּן יֹאמְרוּ
  choice: Itulah sebabnya orang berkata
  rationale: Ungkapan ini memperkenalkan perkataan umum. 'Orang berkata' mempertahankan subjek tak tentu dari bentuk Ibrani.
- source_word: עִוֵּר וּפִסֵּחַ
  choice: Orang buta dan orang lumpuh
  rationale: Walaupun bentuk Ibraninya tunggal, ungkapan ini bersifat generik dan menunjuk pada golongan; bentuk Indonesia ini alami tanpa harus memakai penanda jamak.
- source_word: לֹא יָבֹא אֶל הַבָּיִת
  choice: tidak boleh masuk ke dalam rumah
  rationale: בַּיִת secara dasar berarti 'rumah' tetapi dalam konteks dapat menunjuk pada kediaman raja. 'Rumah' tidak memaksakan arti 'istana'; 'tidak boleh' menyampaikan daya modal dari bentuk imperfek dalam pepatah tersebut.
theological_decisions:
- issue: Kebencian Daud terhadap 'orang lumpuh dan orang buta'
  choice: Mempertahankan perkataan sulit 'yang dibenci jiwa Daud' tanpa pelunakan.
  alternative: Menganggap seluruh frasa itu hanya mengacu pada ejekan orang Yebus dalam ayat sebelumnya, atau memparafrasakannya agar kebencian tidak dinisbatkan kepada Daud.
  rationale: Teks Masoret secara langsung memuat ungkapan keras ini, meskipun sintaks keseluruhan klausa sulit. Terjemahan tidak memperluasnya menjadi ajaran umum tentang disabilitas atau akses ke tempat ibadah.
- issue: Hubungan sintaksis 'orang lumpuh dan orang buta' dengan tantangan Daud
  choice: Menempatkannya dalam ucapan Daud sebagai unsur yang mengikuti perintah mencapai saluran air, sambil menandai kesulitan sintaksis dalam catatan.
  alternative: Memahaminya sebagai kutipan atau gema ejekan orang Yebus dari ayat sebelumnya.
  rationale: Susunan ini mengikuti urutan paling langsung dalam teks Masoret, tetapi tidak menyembunyikan bahwa konstruksinya terputus dan memungkinkan pembacaan lain.
- issue: Makna 'rumah' dalam pepatah penutup
  choice: Memakai 'rumah' dan tidak menentukan bahwa yang dimaksud ialah istana atau tempat ibadah.
  alternative: Menerjemahkan 'istana' berdasarkan konteks kediaman raja.
  rationale: הַבָּיִת tidak menyebut bait suci dan tidak secara eksplisit menentukan istana. Terjemahan yang lebih umum mencegah penarikan kesimpulan teologis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah 'orang lumpuh' dan 'orang buta' dipakai untuk mencerminkan sebutan substantival dalam teks kuno, bukan sebagai pernyataan normatif tentang penyandang disabilitas. Semua penanda catatan kaki ditempatkan dalam teks utama.
