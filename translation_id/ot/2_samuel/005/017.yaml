translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar tanpa menghilangkan urutan tindakan, arah gerak, atau keluasan makna verba Ibrani. Penanda catatan kaki ditempatkan sesudah padanan הַמְּצוּדָה, sesuai pokok catatannya.
