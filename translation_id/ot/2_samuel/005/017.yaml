base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/017.yaml
  text: When the Philistines heard that they had anointed David king over Israel[a], all the Philistines went up to seek David. When David heard of it, he went down to the stronghold.
translation:
  language: id
  text: Ketika orang-orang Filistin mendengar bahwa Daud telah diurapi menjadi raja atas Israel, semua orang Filistin pergi naik untuk mencari Daud. Ketika Daud mendengarnya, ia turun ke kubu pertahanan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benteng.” Istilah Ibrani ini menunjuk pada tempat yang dibentengi atau kubu yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dalam bahasa Indonesia untuk nama kelompok bangsa ini.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi berita yang didengar orang Filistin, yaitu pengurapan Daud.
- source_word: מָשְׁחוּ
  choice: telah diurapi
  rationale: Verba ini berarti 'mengurapi'; bentuk pasif alami dalam bahasa Indonesia dan 'telah' menunjukkan bahwa pengurapan itu mendahului reaksi orang Filistin, tanpa perlu menyatakan pelaku yang tidak disebutkan.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Menyatakan kedudukan yang diberikan kepada Daud melalui pengurapan secara alami dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Preposisi עַל dalam konteks kerajaan menyatakan kekuasaan Daud atas Israel.
- source_word: וַיַּעֲלוּ
  choice: bergerak naik
  rationale: Mempertahankan makna dasar עלה, 'naik', sambil memakai ungkapan naratif yang dapat dipahami sebagai pergerakan pasukan tanpa menambahkan tujuan seperti menyerang.
- source_word: כָל פְּלִשְׁתִּים
  choice: semua orang Filistin
  rationale: Menerjemahkan כָל secara langsung dan mempertahankan penekanan pada keseluruhan kelompok yang bergerak.
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: untuk mencari Daud
  rationale: בקש berarti 'mencari'; pilihan ini mempertahankan keluasan maknanya dan tidak mempersempit maksud mereka menjadi menangkap atau membunuh.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Ketika Daud mendengarnya
  rationale: Objek yang tersirat dinyatakan dengan '-nya' secara alami, dan 'ketika' memperjelas urutan narasi.
- source_word: וַיֵּרֶד
  choice: ia turun
  rationale: Mempertahankan makna konkret ירד, 'turun', tanpa menambahkan tindakan lain.
- source_word: הַמְּצוּדָה
  choice: benteng pertahanan
  rationale: מצודה menunjuk pada tempat berkubu yang kuat; ungkapan ini jelas dan wajar bagi pembaca Indonesia modern.
