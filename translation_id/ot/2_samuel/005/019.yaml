  to: Lalu Daud meminta petunjuk kepada Yahweh dengan berkata, “Haruskah aku maju melawan orang Filistin? Apakah Engkau akan menyerahkan mereka ke tanganku?” Yahweh berfirman kepada Daud, “Majulah, sebab Aku pasti akan menyerahkan orang Filistin ke tanganmu.”
