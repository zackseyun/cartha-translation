base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/019.yaml
  text: And David inquired of Yahweh[a], saying, “Should I go up against the Philistines? Will you give them into my hand?” And Yahweh said to David, “Go up, for I will certainly give the Philistines into your hand.”
translation:
  language: id
  text: Lalu Daud meminta petunjuk kepada Yahweh dengan berkata, “Haruskah aku maju melawan orang Filistin? Apakah Engkau akan menyerahkan mereka ke tanganku?” Yahweh berfirman kepada Daud, “Majulah, sebab Aku pasti akan menyerahkan orang Filistin ke tanganmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konteks ini שׁאל ב־ menunjuk pada tindakan mencari petunjuk ilahi. Ungkapan ini alami dalam bahasa Indonesia tanpa menentukan cara atau sarana konsultasinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dalam teks Ibrani dipertahankan sebagai nama diri, sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַאֶעֱלֶה ... עֲלֵה
  choice: Haruskah aku maju ... Majulah
  rationale: עלה secara harfiah berarti naik atau pergi naik, tetapi dalam konteks militer berarti bergerak maju menghadapi musuh. 'Maju/Majulah' mempertahankan pengulangan verba sekaligus terdengar wajar.
- source_word: אֶל פְּלִשְׁתִּים
  choice: melawan orang Filistin
  rationale: Preposisi אֶל menunjukkan gerak menuju pihak lawan; konteks militer menuntut padanan relasional 'melawan' dalam bahasa Indonesia.
- source_word: הֲתִתְּנֵם בְּיָדִי
  choice: Apakah Engkau akan menyerahkan mereka ke dalam tanganku?
  rationale: Ungkapan נתן ביד adalah idiom kemenangan dan penguasaan. 'Menyerahkan ... ke dalam tanganku' mempertahankan citra tangan serta dapat dipahami secara alami.
- source_word: כִּי נָתוֹן אֶתֵּן
  choice: sebab Aku pasti akan menyerahkan
  rationale: Infinitif absolut נָתוֹן diikuti verba finit אֶתֵּן memberi penegasan kuat; 'pasti akan' menyampaikan kepastian tersebut dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu secara eksplisit dan tidak menggantinya dengan gelar.
- issue: Sifat permintaan Daud kepada Allah
  choice: meminta petunjuk
  alternative: bertanya
  rationale: Pilihan ini menyatakan bahwa Daud mencari arahan ilahi, tetapi tidak menentukan ritual, perantara, atau metode pewahyuan yang tidak disebutkan dalam ayat.
- issue: Janji kemenangan dalam idiom 'memberikan ke dalam tangan'
  choice: menyerahkan ... ke dalam tangan
  alternative: memberi kemenangan atas
  rationale: Terjemahan mempertahankan metafora sumber dan kepastian tindakan ilahi tanpa menghapus idiom menjadi penjelasan teologis semata.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan kepada Allah memakai kapital kehormatan. Pengulangan 'maju/Majulah' dan idiom 'ke dalam tangan' dipertahankan untuk mencerminkan struktur serta citra Ibrani.
