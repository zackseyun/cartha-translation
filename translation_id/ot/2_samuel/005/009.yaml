base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/009.yaml
  text: So David lived in the stronghold and called it the City of David[a]. And David built all around from the Millo inward.
translation:
  language: id
  text: Lalu Daud tinggal di benteng itu dan menamainya Kota Daud. Daud membangun di sekelilingnya, mulai dari Milo ke arah dalam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dari Milo dan ke arah dalam,” atau “dari Milo menuju bagian dalam.” Milo mungkin adalah nama sebuah struktur atau timbunan teras yang dikenal di Yerusalem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja יָשַׁב dalam konteks ini menyatakan bahwa Daud menetap atau berdiam di benteng yang telah direbut; 'tinggal' alami dalam bahasa Indonesia modern.
- source_word: בַּמְּצֻדָה
  choice: di benteng itu
  rationale: מְצֻדָה menunjuk pada tempat berkubu atau benteng. Bentuk definit dalam bahasa Ibrani dinyatakan secara alami dengan 'itu' dalam konteks ini.
- source_word: וַיִּקְרָא לָהּ
  choice: menamainya
  rationale: Konstruksi קרא ל dalam konteks ini menyatakan pemberian nama. 'Menamainya' lebih alami daripada terjemahan harfiah 'menyebutnya'.
- source_word: עִיר דָּוִד
  choice: Kota Daud
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga huruf kapital dipakai.
- source_word: וַיִּבֶן
  choice: membangun
  rationale: בנה pada dasarnya berarti 'membangun'; konteks tidak mengharuskan makna yang lebih khusus seperti 'memperkuat' atau 'membangun kembali'.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: סָבִיב menunjukkan pembangunan yang berlangsung mengelilingi kawasan tersebut. Sufiks '-nya' memperjelas acuan secara alami tanpa mengubah isi.
- source_word: מִן הַמִּלּוֹא
  choice: mulai dari Milo
  rationale: מִלּוֹא tampaknya merupakan istilah teknis atau nama struktur/topografi di Yerusalem yang acuannya tidak pasti; transliterasi mempertahankan ketidakpastian itu.
- source_word: וָבָיְתָה
  choice: ke arah dalam
  rationale: Bentuk berakhiran direktif ini paling mungkin menyatakan arah menuju bagian dalam, tetapi rincian topografinya tetap tidak pasti.
