  text: וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ וַֽ/אֲנָשָׁי/ו֙ יְר֣וּשָׁלִַ֔ם אֶל הַ/יְבֻסִ֖י יוֹשֵׁ֣ב הָ/אָ֑רֶץ וַ/יֹּ֨אמֶר לְ/דָוִ֤ד לֵ/אמֹר֙ לֹא תָב֣וֹא הֵ֔נָּה כִּ֣י אִם הֱסִֽירְ/ךָ֗ הַ/עִוְרִ֤ים וְ/הַ/פִּסְחִים֙ לֵ/אמֹ֔ר לֹֽא יָב֥וֹא דָוִ֖ד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/006.yaml
  text: And the king and his men went to Jerusalem[a], to the Jebusites, the inhabitants of the land. And they said to David, “You will not come in here, for even the blind and the lame will turn you away,” saying[b], “David will not come in here.”
translation:
  language: id
  text: Raja dan orang-orangnya pergi ke Yerusalem, kepada orang Yebus, penduduk negeri itu. Orang Yebus berkata[a] kepada Daud, “Engkau tidak akan masuk ke sini, sebab bahkan orang buta dan orang timpang akan menghalau engkau[b].” Mereka berkata, “Daud tidak akan masuk ke sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “ia berkata” dalam bentuk tunggal. Bentuk tunggal ini tampaknya dipakai secara kolektif untuk orang Yebus.
    reason: textual_variant
  - marker: b
    text: 'Teks Ibrani pada bagian ini sulit. Secara lebih harfiah, frasa itu dapat dibaca, “kecuali engkau menyingkirkan orang buta dan orang timpang.” Dalam konteksnya, perkataan ini tampaknya merupakan ejekan: orang Yebus menganggap kota itu begitu aman sehingga orang buta dan orang timpang pun dapat menghalau Daud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif dari הלך menyatakan tindakan pergi tanpa dengan sendirinya menentukan bahwa mereka berbaris atau menyerang.
- source_word: הַמֶּלֶךְ וַאֲנָשָׁיו
  choice: raja beserta anak buahnya
  rationale: Ungkapan ini mempertahankan hubungan antara raja dan orang-orang yang menyertainya; konteksnya bersifat militer, tetapi kata Ibraninya tidak secara khusus berarti ‘tentara’.
- source_word: אֶל הַיְבֻסִי יוֹשֵׁב הָאָרֶץ
  choice: ke tempat orang Yebus yang mendiami negeri itu
  rationale: Bentuk tunggal gentilik dipahami secara kolektif. Susunan ini menyampaikan arah perjalanan ke wilayah orang Yebus tanpa memperkuat אֶל menjadi ‘menyerang’.
- source_word: וַיֹּאמֶר
  choice: Orang Yebus berkata
  rationale: Kata kerja Ibrani berbentuk tunggal, selaras dengan sebutan kolektif ‘orang Yebus’; pengulangan subjek dalam bahasa Indonesia memperjelas penutur ejekan itu.
- source_word: לֹא תָבוֹא הֵנָּה
  choice: Engkau tidak akan masuk ke sini
  rationale: Bentuk imperfek mengungkapkan penolakan atau keyakinan yang tegas. ‘Masuk’ sesuai dengan konteks kota berkubu.
- source_word: הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: bahkan orang buta dan orang timpang akan menghalau engkau
  rationale: Akhiran orang kedua pada bentuk verbal dapat dipahami sebagai objek, sehingga kedua kelompok itu menjadi pelaku yang mengusir Daud. Kata ‘bahkan’ menyatakan daya ejekan yang tersirat dalam konteks, sementara kesulitan gramatikal dicatat dalam catatan kaki.
- source_word: לֵאמֹר לֹא יָבוֹא דָוִד הֵנָּה
  choice: Mereka berkata, “Daud tidak akan masuk ke sini.”
  rationale: Terjemahan langsung mempertahankan pengulangan retoris dan ucapan langsung dalam teks Ibrani.
theological_decisions:
- issue: Sebutan terhadap penyandang disabilitas muncul dalam ejekan orang Yebus
  choice: Mempertahankan ungkapan konkret ‘orang buta dan orang timpang’ sebagai isi ejekan yang dilaporkan
  alternative: Memparafrasakannya sebagai ‘orang-orang kami yang paling lemah’
  rationale: Teks melaporkan ejekan pihak Yebus, bukan memberikan penilaian umum terhadap penyandang disabilitas. Mempertahankan istilah konkret menjaga transparansi terhadap sumber dan tidak mengubahnya menjadi metafora interpretatif.
- issue: Subjek dan fungsi sintaksis dalam frasa הֱסִירְךָ הַעִוְרִים וְהַפִּסְחִים
  choice: Memahami Daud sebagai objek yang akan dihalau oleh ‘orang buta dan orang timpang’
  alternative: ‘kecuali engkau menyingkirkan orang buta dan orang timpang’
  rationale: Bacaan utama menghasilkan ejekan yang koheren dalam konteks keyakinan orang Yebus akan pertahanan kota, tetapi struktur Ibraninya memang sulit sehingga alternatif literal dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Anak buahnya’ dipakai sebagai ungkapan umum bagi orang-orang di bawah pimpinan raja tanpa membatasi mereka secara eksplisit pada tentara. Pengulangan ucapan dipertahankan untuk mencerminkan retorika teks Ibrani.
