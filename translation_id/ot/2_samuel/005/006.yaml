revisions:
- from: Raja beserta anak buahnya pergi ke Yerusalem, ke tempat orang Yebus yang mendiami negeri itu. Orang Yebus berkata kepada Daud, “Engkau tidak akan masuk ke sini, sebab bahkan orang buta dan orang timpang akan menghalau engkau[a].” Mereka berkata, “Daud tidak akan masuk ke sini.”
  to: Raja dan orang-orangnya pergi ke Yerusalem, kepada orang Yebus, penduduk negeri itu. Orang Yebus berkata[a] kepada Daud, “Engkau tidak akan masuk ke sini, sebab bahkan orang buta dan orang timpang akan menghalau engkau[b].” Mereka berkata, “Daud tidak akan masuk ke sini.”
  rationale: Revisi mengembalikan rujukan langsung kepada orang Yebus sebagai penduduk negeri itu, memakai register yang lebih netral untuk אַנָשָׁיו, dan menambahkan catatan berjangkar tepat pada verba tunggal Ibrani. Pembacaan utama atas ejekan dipertahankan bersama catatan tentang ambiguitas sintaksisnya.
