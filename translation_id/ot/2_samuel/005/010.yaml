  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖ד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֛ה אֱלֹהֵ֥י צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/010.yaml
  text: And David went on[a], growing greater, and Yahweh, the God of hosts, was with him.
translation:
  language: id
  text: Daud terus bertambah besar[a], dan Yahweh, Allah Semesta Alam, menyertai dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi semakin besar.” Ungkapan Ibrani menekankan pertumbuhan yang berlangsung terus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... הָלוֹךְ וְגָדוֹל
  choice: terus bertambah besar
  rationale: Gabungan bentuk finit וַיֵּלֶךְ dengan infinitif absolut הָלוֹךְ dan וְגָדוֹל menyatakan perkembangan yang berlangsung terus. Ungkapan ini menyampaikan makna idiomatisnya secara alami tanpa menerjemahkan verba 'berjalan/pergi' secara harfiah.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan membedakannya dari gelar.
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Allah Semesta Alam
  rationale: Ungkapan Indonesia yang dikenal luas untuk gelar ilahi ini dan cukup luas untuk mencakup bala tentara atau segala kekuatan yang berada di bawah kuasa-Nya, tanpa mempersempit acuannya menjadi hanya pasukan bumi atau pasukan surgawi.
- source_word: עִמּוֹ
  choice: menyertai dia
  rationale: Menyampaikan kehadiran Yahweh bersama Daud dalam ungkapan Indonesia yang langsung dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan gelar אֱלֹהֵי צְבָאוֹת
  choice: Allah Semesta Alam
  alternative: Allah bala tentara; Allah para tentara surgawi
  rationale: Acuan צְבָאוֹת tidak dijelaskan lebih sempit dalam ayat ini. Pilihan ini mempertahankan keluasan gelar dan menghindari penentuan bahwa yang dimaksud khusus pasukan bumi atau surga.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara aspek perkembangan berkelanjutan dalam ungkapan Ibrani dipertahankan. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
