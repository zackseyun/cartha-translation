revisions:
- from: Lalu Daud tiba di Baal-Perazim[a], dan di sana Daud mengalahkan mereka. Ia berkata, “Yahweh telah menerobos barisan musuh-musuhku di hadapanku seperti air yang menerobos.” Karena itu, ia menamai tempat itu Baal-Perazim.
  to: Lalu Daud tiba di Baal-Perazim[a], dan di sana Daud mengalahkan mereka. Ia berkata, “Yahweh telah menerobos musuh-musuhku di hadapanku seperti terjangan air.” Karena itu, ia menamai tempat itu Baal-Perazim.
  rationale: Revisi menghapus unsur "barisan" yang tidak ada dalam bahasa sumber. Simile air diperhalus agar alami dalam bahasa Indonesia dan lebih dekat dengan gambaran suatu terjangan atau jebolnya air, sementara permainan kata Ibrani dipertahankan sejauh mungkin melalui "menerobos" dan dijelaskan di catatan kaki.
