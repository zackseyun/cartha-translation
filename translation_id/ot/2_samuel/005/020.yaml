  naturalness: Teks revisi memakai bahasa Indonesia baku dan naratif. "Seperti terjangan air" adalah idiom yang lebih alami untuk כְּפֶרֶץ מָיִם daripada "seperti air yang menerobos," sambil catatan kaki menjelaskan permainan kata yang tidak dapat dipertahankan sepenuhnya dalam bentuk yang sama.
  terminology: Yahweh dipertahankan untuk יהוה. Baal-Perazim dipertahankan sebagai nama tempat. "Mengalahkan mereka" cukup mencakup daya militer וַיַּכֵּם tanpa menyatakan secara berlebihan bahwa semua lawan tewas.
