  text: וַ/יָּבֹ֨א דָוִ֥ד בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִד֒ וַ/יֹּ֕אמֶר פָּרַ֨ץ יְהוָ֧ה אֶת אֹיְבַ֛/י לְ/פָנַ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/020.yaml
  text: So David came to Baal-perazim[a], and there David struck them down. He said[b], “Yahweh has broken through my enemies before me like a breakthrough of waters.” Therefore he called the name of that place Baal-perazim.
translation:
  language: id
  text: Lalu Daud tiba di Baal-Perazim[a], dan di sana Daud mengalahkan mereka. Ia berkata, “Yahweh telah menerobos musuh-musuhku di hadapanku seperti terjangan air.” Karena itu, ia menamai tempat itu Baal-Perazim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Perazim terdengar seperti “tuan/penguasa penerobosan” atau “tempat penerobosan.” Nama ini menggemakan perkataan Daud bahwa Yahweh telah “menerobos” musuh-musuhnya; ungkapan “terjangan air” juga memakai kata Ibrani yang berkaitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: Baal-Perazim
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan. Bentuk ini juga memungkinkan catatan kaki menjelaskan permainan kata dengan פָּרַץ dan פֶּרֶץ.
- source_word: וַיַּכֵּם
  choice: mengalahkan mereka
  rationale: Dalam konteks pertempuran, נכה menunjukkan tindakan memukul atau menundukkan lawan. 'Mengalahkan' terdengar alami dalam bahasa Indonesia dan tidak memastikan bahwa setiap orang dibunuh.
- source_word: פָּרַץ
  choice: telah menerobos barisan
  rationale: פָּרַץ berarti menerobos atau mendobrak. Penambahan 'barisan' memperjelas objek personal 'musuh-musuhku' secara idiomatis tanpa menghilangkan citra penerobosan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, sesuai bentuk Ibrani dan tanpa menggantinya dengan gelar.
- source_word: אֹיְבַי
  choice: musuh-musuhku
  rationale: Padanan langsung dan wajar bagi nomina jamak dengan sufiks orang pertama tunggal.
- source_word: לְפָנַי
  choice: di hadapanku
  rationale: Ungkapan ini mempertahankan citra bahwa Yahweh membuka jalan di depan Daud dalam konteks pertempuran.
- source_word: כְּפֶרֶץ מָיִם
  choice: seperti air yang menerobos
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mengulang akar gagasan 'menerobos', sehingga permainan kata Ibrani tetap terdengar sejauh mungkin.
- source_word: קָרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: ia menamai tempat itu
  rationale: Ini adalah padanan Indonesia yang alami bagi idiom Ibrani 'memanggil nama tempat itu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan tindakan וַיַּכֵּם
  choice: mengalahkan mereka
  alternative: memukul kalah mereka atau menewaskan mereka
  rationale: Kata kerja ini bersifat keras dan berkonteks perang, tetapi ayat ini sendiri tidak harus menyatakan bahwa semua lawan dibunuh; 'mengalahkan' menjaga cakupan itu tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Permainan kata Ibrani dipertahankan melalui pengulangan 'menerobos', sedangkan penjelasan arti nama tempat diberikan dalam catatan kaki.
