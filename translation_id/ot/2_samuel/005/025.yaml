id: 2SA.5.25
reference: 2 Samuel 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ דָּוִד֙ כֵּ֔ן כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יְהוָ֑ה וַ/יַּךְ֙ אֶת פְּלִשְׁתִּ֔ים מִ/גֶּ֖בַע עַד בֹּאֲ/ךָ֥ גָֽזֶר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/025.yaml
  text: And David did so[a], just as Yahweh had commanded him[b], and he struck down the Philistines from Geba as far as Gezer.
translation:
  language: id
  text: Daud melakukan hal itu tepat seperti yang diperintahkan Yahweh kepadanya, lalu ia mengalahkan orang Filistin dari Geba[a] sampai ke Gezer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani Masoret berbunyi “Geba”. Sejumlah terjemahan memakai nama tempat lain karena pertimbangan varian teks atau bagian paralel.
    reason: textual_variant
  - marker: b
    text: Secara harfiah, “sampai engkau tiba di Gezer”, yaitu sampai ke jalan masuk atau sekitar Gezer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כֵּן
  choice: melakukan hal itu
  rationale: Gabungan עשה dan כֵּן secara idiomatis berarti melakukan apa yang baru saja diperintahkan; pilihan ini alami dalam bahasa Indonesia dan tetap merujuk pada petunjuk sebelumnya.
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: tepat seperti yang diperintahkan ... kepadanya
  rationale: Kata 'tepat' menyampaikan kesesuaian erat yang dinyatakan כַּאֲשֶׁר, sedangkan bentuk pasif Indonesia menjaga alur kalimat tetap jelas dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיַּךְ
  choice: mengalahkan
  rationale: Dalam konteks pertempuran, נכה menyatakan tindakan memukul atau menundukkan musuh. 'Mengalahkan' menyampaikan hasil militer secara alami tanpa memakai ungkapan arkais atau memastikan bahwa setiap orang dibunuh.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini merupakan sebutan etnis baku dalam bahasa Indonesia.
- source_word: מִגֶּבַע
  choice: dari Geba
  rationale: Teks Masoret secara langsung menyebut Geba (גֶּבַע); nama tempat itu dipertahankan meskipun terdapat perbedaan tekstual atau penyelarasan dengan bagian paralel.
- source_word: עַד בֹּאֲךָ גָזֶר
  choice: sampai ke Gezer
  rationale: Ungkapan harfiahnya menunjuk pada kedatangan atau jalan masuk menuju Gezer dan secara idiomatis menyatakan batas geografis. Terjemahan utama dibuat ringkas dan alami, sementara bentuk ungkapan sumber dijelaskan dalam catatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Pemakaian 'Yahweh' mempertahankan nama diri dalam teks Ibrani dan tidak menggantinya dengan sebuah gelar, tanpa menambahkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Kata 'lalu' mempertahankan kesinambungan rangkaian tindakan, dan semua catatan ditempatkan pada unsur teks yang dijelaskannya.
