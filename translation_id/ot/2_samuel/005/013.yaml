  source_fidelity: Terjemahan mempertahankan urutan pokok, pengulangan עוֹד (“lagi”), pembedaan antara gundik dan istri, serta konstruksi kelahiran pasif “lahir ... bagi Daud.” “Dari Yerusalem” mencerminkan bentuk teks Ibrani מִירוּשָׁלִַם, sementara catatan kaki dengan tepat mencatat kemungkinan pembacaan lokatif.
