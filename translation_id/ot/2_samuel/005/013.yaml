  terminology: “Gundik” dan “istri” merupakan padanan yang tepat dan harus tetap dibedakan. “Anak-anak lelaki dan perempuan” secara memadai mempertahankan “anak-anak laki-laki dan anak-anak perempuan” tanpa memasukkan penilaian terhadap tindakan Daud.
