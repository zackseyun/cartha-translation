  text: וַ/יִּקַּח֩ דָּוִ֨ד ע֜וֹד פִּֽלַגְשִׁ֤ים וְ/נָשִׁים֙ מִ/יר֣וּשָׁלִַ֔ם אַחֲרֵ֖י בֹּא֣/וֹ מֵ/חֶבְר֑וֹן וַ/יִּוָּ֥לְדּוּ ע֛וֹד לְ/דָוִ֖ד בָּנִ֥ים וּ/בָנֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/013.yaml
  text: And David took more concubines and wives in Jerusalem after he came from Hebron[a], and more sons and daughters were born to David.
translation:
  language: id
  text: Kemudian Daud mengambil lagi gundik-gundik dan istri-istri dari Yerusalem[a] setelah ia datang dari Hebron. Lalu lahirlah lagi bagi Daud anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di Yerusalem.” Secara harfiah teks Ibrani berbunyi “dari Yerusalem,” yang mungkin menunjukkan tempat Daud mengambil mereka setelah ia pindah ke sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Dalam konteks ini, לקח menyatakan mengambil perempuan sebagai istri atau gundik. 'Mengambil' mempertahankan kelugasan teks tanpa menambahkan penilaian.
- source_word: עוֹד
  choice: lagi
  rationale: 'Kedua pemunculannya menandai penambahan: Daud mengambil perempuan tambahan dan kemudian memperoleh anak-anak tambahan.'
- source_word: פִּלַגְשִׁים
  choice: para gundik
  rationale: '''Gundik'' adalah padanan baku yang mempertahankan pembedaan eksplisit dari para istri.'
- source_word: וְנָשִׁים
  choice: dan istri
  rationale: Dalam rangkaian dengan 'gundik' dan konteks rumah tangga kerajaan, נָשִׁים berarti para istri, bukan sekadar perempuan.
- source_word: מִירוּשָׁלִַם
  choice: dari Yerusalem
  rationale: Preposisi מִן secara formal berarti 'dari'. Terjemahan utama mempertahankan bentuk Ibrani yang agak sukar, sementara kemungkinan makna lokasi dijelaskan dalam catatan kaki.
- source_word: אַחֲרֵי בֹּאוֹ מֵחֶבְרוֹן
  choice: setelah ia datang dari Hebron
  rationale: Ungkapan temporal ini menyatakan bahwa tindakan tersebut terjadi sesudah Daud datang dari Hebron.
- source_word: וַיִּוָּלְדוּ
  choice: lahirlah
  rationale: Bentuk Nifal dari ילד secara alami berarti 'lahir' dan tidak perlu diubah menjadi rumusan kausatif.
- source_word: לְדָוִד
  choice: bagi Daud
  rationale: Preposisi לְ dalam formula kelahiran menandai hubungan anak-anak itu dengan Daud; 'bagi Daud' mempertahankan konstruksi tersebut secara wajar dalam bahasa Indonesia.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Padanan ini mempertahankan penyebutan kedua jenis kelamin secara eksplisit dan terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penceritaan tentang poligami Daud
  choice: Menerjemahkan secara deskriptif tanpa penilaian moral tambahan.
  alternative: Menambahkan kata-kata yang menyiratkan persetujuan atau kecaman.
  rationale: Ayat Ibrani ini hanya melaporkan tindakan Daud dan kelahiran anak-anaknya tanpa komentar moral eksplisit; terjemahan tidak boleh memasukkan penilaian teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sedangkan kejanggalan preposisi Ibrani dipertahankan dalam teks utama dan diterangkan melalui catatan kaki.
