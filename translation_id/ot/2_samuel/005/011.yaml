  text: וַ֠/יִּשְׁלַח חִירָ֨ם מֶֽלֶךְ צֹ֥ר מַלְאָכִים֮ אֶל דָּוִד֒ וַ/עֲצֵ֣י אֲרָזִ֔ים וְ/חָרָשֵׁ֣י עֵ֔ץ וְ/חָֽרָשֵׁ֖י אֶ֣בֶן קִ֑יר וַ/יִּבְנֽוּ בַ֖יִת לְ/דָוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/005/011.yaml
  text: And Hiram king of Tyre sent messengers to David[a], and cedar logs, and craftsmen of wood, and craftsmen of stone walling[b]; and they built a house for David.
translation:
  language: id
  text: Hiram, raja Tirus, mengirim kepada Daud para utusan, juga kayu aras, tukang kayu, dan tukang batu untuk pekerjaan tembok[a]. Mereka membangun sebuah rumah bagi Daud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tukang batu.” Frasa Ibrani itu secara harfiah memuat kata “batu” dan “tembok.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebuah istana bagi Daud.” Kata Ibrani yang secara harfiah berarti “rumah” dapat menunjuk istana dalam konteks kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Padanan naratif yang baku dan alami untuk שׁלח.
- source_word: חִירָם
  choice: Hiram
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ צֹר
  choice: raja Tirus
  rationale: Menerjemahkan rantai konstruksi Ibrani secara langsung; 'Tirus' adalah bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: מַלְאָכִים dapat menunjuk utusan biasa maupun utusan diplomatik; 'utusan' mempertahankan cakupan maknanya tanpa mempersempitnya.
- source_word: וַעֲצֵי אֲרָזִים
  choice: kayu aras
  rationale: Ungkapan Ibrani secara idiomatis menunjuk bahan kayu dari pohon aras. 'Kayu aras' alami dalam bahasa Indonesia dan tidak menetapkan bentuk bahan itu secara lebih khusus daripada sumber.
- source_word: חָרָשֵׁי עֵץ
  choice: tukang kayu
  rationale: Padanan Indonesia yang alami untuk para perajin yang bekerja dengan kayu.
- source_word: חָרָשֵׁי אֶבֶן קִיר
  choice: tukang batu untuk membangun tembok
  rationale: Frasa yang sulit ini memuat unsur 'batu' dan 'tembok'. Terjemahan ini mempertahankan keduanya sekaligus menyampaikan fungsi para pekerja itu secara alami.
- source_word: וַיִּבְנוּ
  choice: Mereka membangun
  rationale: Bentuk naratif jamak merujuk secara wajar kepada para pekerja yang dikirim atau disediakan Hiram.
- source_word: בַיִת
  choice: sebuah rumah
  rationale: Makna dasar בַיִת adalah 'rumah'. Dalam konteks kerajaan kata ini dapat berarti istana, tetapi makna kontekstual itu tidak dimasukkan secara diam-diam ke dalam teks utama.
- source_word: לְדָוִד
  choice: bagi Daud
  rationale: Menyatakan penerima manfaat bangunan itu secara ringkas dan alami.
theological_decisions:
- issue: Apakah בַיִת harus diterjemahkan sebagai rumah atau istana
  choice: sebuah rumah
  alternative: sebuah istana
  rationale: Teks Ibrani memakai kata umum untuk 'rumah', sedangkan konteks Daud sebagai raja memungkinkan arti 'istana'. Teks utama mempertahankan makna leksikal dasarnya, dan kemungkinan kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar diperlancar tanpa menghilangkan unsur apa pun dari teks Ibrani. Istilah keahlian dibuat mudah dipahami oleh pembaca umum, sedangkan ambiguitas 'rumah/istana' dipertahankan melalui catatan kaki.
