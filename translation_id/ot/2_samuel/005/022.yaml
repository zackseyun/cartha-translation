lexical_decisions:
- source_word: וַיֹּסִפוּ עוֹד ... לַעֲלוֹת
  choice: kembali maju
  rationale: Gabungan יסף, עוֹד, dan infinitif עלה menyatakan pengulangan gerakan naik atau gerak maju pasukan. “Kembali maju” alami dalam narasi militer Indonesia dan tidak terlalu harfiah.
- source_word: פְּלִשְׁתִּים
  choice: Orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: וַיִּנָּטְשׁוּ
  choice: mengambil posisi
  rationale: Dalam konteks pengerahan pasukan di sebuah lembah, verba ini kemungkinan menggambarkan pasukan yang menempatkan atau membentangkan diri di suatu kawasan. Pilihan ini mempertahankan nuansa militer tanpa memaksakan gambaran tertentu.
- source_word: בְּעֵמֶק רְפָאִים
  choice: di Lembah Refaim
  rationale: עֵמֶק berarti “lembah,” sedangkan רְפָאִים di sini merupakan nama tempat dan ditransliterasikan sebagai “Refaim.”
