  text: Orang-orang Filistin maju lagi dan menyebar di Lembah Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengambil posisi,” “mengerahkan diri,” atau “melancarkan serbuan.” Kata kerja Ibrani ini kemungkinan menggambarkan orang-orang Filistin yang tersebar atau mengambil posisi di seluruh lembah.
