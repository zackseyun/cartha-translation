  text: Ibhar[a], Elishua, Nepheg, and Japhia.
translation:
  language: id
  text: Yibhar[a], Elisua, Nefeg, dan Yafia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani mengulang kata “dan” sebelum setiap nama: “dan Yibhar dan Elisua dan Nefeg dan Yafia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחָר
  choice: Yibhar
  rationale: Nama diri ditransliterasikan dengan mempertahankan bunyi awal yod sebagai Y, sesuai pola transliterasi yang mudah dipahami dalam bahasa Indonesia.
- source_word: אֱלִישׁוּעַ
  choice: Elisua
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang wajar; bunyi שׁ diwakili dengan s dan ע akhir tidak ditandai secara khusus.
- source_word: נֶפֶג
  choice: Nefeg
  rationale: Nama diri ditransliterasikan secara langsung; huruf פ tanpa dagesh diwakili dengan f.
- source_word: יָפִיעַ
  choice: Yafia
  rationale: Nama diri ditransliterasikan dengan Y untuk yod awal dan tanpa penandaan khusus bagi ע akhir.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan setiap nama. Dalam daftar bahasa Indonesia, pengulangannya disajikan secara idiomatis dengan koma dan satu kata 'dan' sebelum nama terakhir; bentuk sumber dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Ejaan nama mengikuti transliterasi yang dekat dengan bunyi Ibrani sekaligus mudah dibaca oleh pembaca Indonesia.
