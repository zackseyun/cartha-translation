base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/010.yaml
  text: Now therefore[a], the sword shall never depart from your house[b], because you have despised me and have taken the wife of Uriah the Hittite to be your wife.
translation:
  language: id
  text: Maka sekarang, pedang tidak akan pernah menjauh dari rumahmu[a], sebab engkau telah menghina Aku[b] dan mengambil istri Uria, orang Het itu, menjadi istrimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rumahmu”; kata Ibrani untuk “rumah” dapat mencakup keluarga, rumah tangga, dan garis keturunan atau dinasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menghina Aku”; pelanggaran terhadap Uria dan istrinya dinyatakan sebagai penghinaan terhadap Allah sendiri.
    reason: theological_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: Karena itu, sekarang
  rationale: 'Gabungan ini mempertahankan unsur konsekuensial dan temporal: hukuman berikut mengalir dari dakwaan sebelumnya.'
- source_word: לֹא תָסוּר ... עַד עוֹלָם
  choice: tidak akan pernah menyingkir
  rationale: Dengan 'pedang' sebagai subjek, סור menyatakan beranjak atau menyingkir; עַד עוֹלָם memberi daya duratif yang secara alami diungkapkan dengan 'tidak akan pernah'.
- source_word: חֶרֶב
  choice: pedang
  rationale: Mempertahankan citra Ibrani tentang kekerasan bersenjata dan hukuman yang terus melanda keluarga atau garis keturunan Daud.
- source_word: מִבֵּיתְךָ
  choice: dari keluargamu
  rationale: Dalam konteks ini בַּיִת menunjuk kepada 'rumah' dalam arti keluarga, rumah tangga, atau garis keturunan. 'Keluargamu' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan keluasan maknanya.
- source_word: עֵקֶב כִּי
  choice: sebab
  rationale: Menyampaikan hubungan sebab antara tindakan Daud dan hukuman yang diumumkan secara jelas dan wajar.
- source_word: בְזִתָנִי
  choice: engkau telah menghina Aku
  rationale: בזה menyatakan penghinaan atau sikap meremehkan. Bentuk 'Aku' mempertahankan objek ilahi orang pertama yang eksplisit.
- source_word: וַתִּקַּח
  choice: dan mengambil
  rationale: Mengungkapkan tindakan selesai yang dikoordinasikan dengan dakwaan sebelumnya tanpa membuat susunan Indonesia terasa kaku.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: istri Uria, orang Het itu
  rationale: Mempertahankan penekanan pada ikatan perkawinan perempuan itu dengan Uria serta identitas Uria sebagai orang Het.
- source_word: לִהְיוֹת לְךָ לְאִשָּׁה
  choice: menjadi istrimu
  rationale: Padanan Indonesia yang alami bagi ungkapan Ibrani tentang mengambil seseorang sebagai istri.
theological_decisions:
- issue: Rujukan kata ganti orang pertama dalam בְזִתָנִי
  choice: Menghina Aku
  alternative: Menghina firman atau perintah TUHAN
  rationale: Teks Ibrani secara eksplisit memakai akhiran orang pertama tunggal. Terjemahan mempertahankan bobot bahwa tindakan terhadap Uria dan istrinya dipandang sebagai penghinaan terhadap Allah sendiri, tanpa menambahkan objek yang tidak tertulis.
- issue: Cakupan בֵּיתְךָ
  choice: Keluargamu, dengan catatan mengenai rumah tangga dan garis keturunan
  alternative: Rumahmu; rumah tanggamu; dinastimu
  rationale: Istilah Ibrani dapat mencakup keluarga, rumah tangga, dan garis kerajaan. Teks utama dibuat alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga keluasan dan ambiguitas aslinya.
- issue: Daya waktu עַד עוֹלָם dalam pengumuman hukuman
  choice: Tidak akan pernah menyingkir
  alternative: Tidak akan menyingkir untuk selama-lamanya
  rationale: Ungkapan tersebut menyatakan masa depan yang terus berlangsung dalam formula hukuman. Pilihan ini mempertahankan kekuatannya tanpa konstruksi Indonesia yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' sesuai dengan wacana kenabian langsung; kapitalisasi 'Aku' menandai bahwa pembicara yang dirujuk adalah Allah. Struktur kalimat mempertahankan hubungan antara dakwaan dan hukuman sambil tetap alami bagi pembaca umum.
