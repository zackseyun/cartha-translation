  source_fidelity: 'Terjemahan secara umum setia pada teks Ibrani: Yoab mengutus orang kepada Daud, melaporkan pertempuran melawan Raba dan perebutan עיר המים. Namun, “kota perairan” kurang tepat dan kurang alami sebagai padanan konstruksi harfiah “kota air/air-air” (עִיר הַמָּיִם), karena “perairan” dalam bahasa Indonesia lazimnya menunjuk wilayah atau badan air, bukan unsur penentu sebuah kota.'
  naturalness: “Lalu”, “mengirim para utusan”, “telah berperang melawan”, dan “telah merebut” adalah bahasa Indonesia modern yang lugas. “Kota air” sengaja agak harfiah karena istilah Ibrani ini tidak sepenuhnya jelas; catatan kaki memberi alternatif dan konteks tanpa menjadikannya kepastian.
  terminology: Nama Yoab, Daud, dan Raba konsisten dengan bentuk Indonesia yang lazim. Istilah militer “merebut” sesuai untuk לָכַדְתִּי. “Kota air” mempertahankan ambiguitas ungkapan geografis/situs tersebut lebih baik daripada “kota perairan”.
