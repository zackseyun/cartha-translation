  text: Then Joab sent messengers to David and said[a], “I have fought against Rabbah; I have also captured the city of waters.”
translation:
  language: id
  text: Lalu Yoab mengirim para utusan kepada Daud dan berkata, “Aku telah berperang melawan Raba; aku juga telah merebut kota air[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kota perairan”; kemungkinan merujuk pada bagian Raba yang menguasai pasokan airnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks manusiawi ini, kata tersebut menunjuk kepada orang-orang yang diutus membawa laporan, bukan malaikat.
- source_word: נִלְחַמְתִּי בְרַבָּה
  choice: Aku telah berperang melawan Raba
  rationale: Ungkapan ini menggambarkan tindakan militer terhadap kota Raba; bentuk perfektif diterjemahkan dengan “telah” karena Yoab melaporkan tindakan yang sudah dilakukan dan masih relevan.
- source_word: רַבָּה
  choice: Raba
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; identifikasi lengkapnya sebagai Raba bani Amon sudah jelas dari konteks.
- source_word: גַּם
  choice: juga
  rationale: “Juga” mempertahankan fungsi aditif yang menghubungkan perebutan kota dengan peperangan sebelumnya.
- source_word: לָכַדְתִּי
  choice: aku ... telah merebut
  rationale: “Merebut” merupakan ungkapan militer Indonesia yang alami untuk penguasaan sebuah kota melalui serangan.
- source_word: עִיר הַמָּיִם
  choice: kota perairan
  rationale: Terjemahan ini mempertahankan bentuk ungkapan Ibrani secara cukup transparan tanpa memastikan apakah yang dimaksud adalah seluruh kota, kawasan tertentu, atau bagian yang menguasai sumber air.
