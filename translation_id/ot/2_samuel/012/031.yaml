  text: וְ/אֶת הָ/עָ֨ם אֲשֶׁר בָּ֜/הּ הוֹצִ֗יא וַ/יָּ֣שֶׂם בַּ֠/מְּגֵרָה וּ/בַ/חֲרִצֵ֨י הַ/בַּרְזֶ֜ל וּֽ/בְ/מַגְזְרֹ֣ת הַ/בַּרְזֶ֗ל וְ/הֶעֱבִ֤יר אוֹתָ/ם֙ ב/מלכן וְ/כֵ֣ן יַעֲשֶׂ֔ה לְ/כֹ֖ל עָרֵ֣י בְנֵֽי עַמּ֑וֹן וַ/יָּ֧שָׁב דָּוִ֛ד וְ/כָל הָ/עָ֖ם יְרוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/031.yaml
  text: And he brought out the people who were in it and put them to work with saws[a], iron picks, and iron axes, and made them labor at the brick kiln. Thus he did to all the cities of the Ammonites[c][b]. Then David and all the people returned to Jerusalem.
translation:
  language: id
  text: Ia membawa keluar penduduk yang ada di dalam kota itu, lalu mempekerjakan mereka secara paksa dengan gergaji, beliung besi, dan kapak besi[a], serta menyuruh mereka bekerja di tempat pembakaran batu bata.[b][c] Demikianlah yang dilakukannya terhadap semua kota-kota orang Amon. Kemudian Daud dan seluruh rakyat kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menempatkan mereka pada gergaji, perkakas besi yang tajam, dan alat pemotong besi.” Nama-nama perkakas itu tidak dapat dipastikan dengan tepat.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani sulit. Secara tradisional bagian ini diterjemahkan, “membuat mereka melewati tempat pembakaran batu bata”; sebagian orang memahaminya sebagai hukuman mati, bukan kerja paksa.
    reason: alternative_reading
  - marker: c
    text: Bandingkan 1 Tawarikh 20:3, kisah sejajar yang ungkapannya juga sulit.
    reason: cross_reference
lexical_decisions:
- source_word: הוֹצִיא
  choice: membawa keluar
  rationale: Bentuk hifil dari יצא lazim berarti ‘membawa keluar’ atau ‘menuntun keluar’; pilihan ini mempertahankan makna kausatif secara alami.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: penduduk yang ada di dalam kota itu
  rationale: Secara harfiah berarti ‘rakyat/orang-orang yang ada di dalamnya’. ‘Penduduk’ memperjelas bahwa yang dimaksud ialah orang-orang di kota yang baru disebut tanpa menambahkan identitas yang tidak ada dalam teks.
- source_word: וַיָּשֶׂם
  choice: lalu mempekerjakan mereka dengan
  rationale: Secara harfiah berarti ‘menaruh/menempatkan’. Dalam rangkaian perkakas ini, ungkapan tersebut dapat dipahami sebagai penugasan kerja paksa; ketidakpastian dan kemungkinan tafsiran yang lebih keras dipertahankan dalam catatan kaki.
- source_word: בַּמְּגֵרָה
  choice: dengan gergaji
  rationale: מְגֵרָה berarti ‘gergaji’. Bentuk tunggal dapat berfungsi secara kolektif atau instrumental.
- source_word: בַחֲרִצֵי הַבַּרְזֶל
  choice: beliung besi
  rationale: Istilah חֲרִצֵי sulit dipastikan dan dapat menunjuk pada perkakas tajam atau alat pengirik. ‘Beliung besi’ merupakan padanan konkret yang masuk akal dalam daftar perkakas, sementara ketidakpastiannya dinyatakan dalam catatan.
- source_word: בְמַגְזְרֹת הַבַּרְזֶל
  choice: kapak besi
  rationale: Kata ini menunjuk secara umum pada alat pemotong. ‘Kapak besi’ menghasilkan daftar perkakas yang wajar, tetapi bukan identifikasi yang pasti.
- source_word: וְהֶעֱבִיר אֹתָם
  choice: serta menyuruh mereka bekerja
  rationale: Bentuk hifil dari עבר secara harfiah berarti ‘membuat mereka lewat’. Dalam konteks penaklukan dan frasa berikutnya, teks utama memahaminya sebagai pengerahan tenaga kerja, tetapi arti harfiah dan kemungkinan hukuman mati dicatat.
- source_word: במלכן
  choice: di tempat pembakaran batu bata
  rationale: Bentuk Ibraninya merupakan masalah tekstual/leksikal yang sulit. Berdasarkan konteks dan perbandingan dengan 1 Tawarikh 20:3, teks utama memilih pengertian yang berkaitan dengan pembuatan batu bata, tanpa menutup kemungkinan tafsiran lain.
- source_word: וְכֵן יַעֲשֶׂה
  choice: Demikianlah yang dilakukannya
  rationale: Ungkapan ini merangkum perlakuan Daud terhadap kota-kota Amon dengan gaya naratif Indonesia yang alami.
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: terhadap semua kota bani Amon
  rationale: ‘Bani Amon’ adalah sebutan etnis yang baku dan mudah dipahami dalam bahasa Indonesia Alkitabiah modern.
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: kembali ke Yerusalem
  rationale: Ini merupakan pemakaian naratif biasa dari שוב dengan tujuan tempat.
theological_decisions:
- issue: Apakah Daud menghukum mati para tawanan Amon dengan perkakas dan tempat pembakaran, atau mengerahkan mereka sebagai tenaga kerja paksa
  choice: Daud mengerahkan mereka sebagai tenaga kerja paksa dengan perkakas dan di tempat pembakaran batu bata
  alternative: Daud menghukum mati mereka dengan gergaji dan perkakas besi serta membuat mereka melewati tempat pembakaran batu bata
  rationale: Susunan dengan וַיָּשֶׂם dan וְהֶעֱבִיר ... במלכן memungkinkan lebih dari satu penafsiran. Teks utama mengikuti pembacaan kerja paksa karena cocok dengan konteks penundukan penduduk dan dapat dibandingkan dengan 1 Tawarikh 20:3. Namun, karena bahasa Ibraninya benar-benar sulit, pembacaan hukuman mati tidak dihapus dan dinyatakan secara terbuka dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Penduduk’ dan ‘tempat pembakaran batu bata’ dipilih demi kejelasan bagi pembaca umum; ‘bani Amon’ dipertahankan sebagai sebutan etnis yang sudah dikenal. Teks utama mengalir alami, sementara ambiguitas leksikal dan ketegangan mengenai kerja paksa atau hukuman mati dipertahankan melalui catatan kaki.
