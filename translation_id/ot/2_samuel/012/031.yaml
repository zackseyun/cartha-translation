  to: Ia membawa keluar penduduk yang ada di dalam kota itu, lalu mempekerjakan mereka secara paksa dengan gergaji, beliung besi, dan kapak besi[a], serta menyuruh mereka bekerja di tempat pembakaran batu bata.[b][c] Demikianlah yang dilakukannya terhadap semua kota-kota orang Amon. Kemudian Daud dan seluruh rakyat kembali ke Yerusalem.
