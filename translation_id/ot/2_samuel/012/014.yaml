id: 2SA.12.14
reference: 2 Samuel 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֗פֶס כִּֽי נִאֵ֤ץ נִאַ֨צְתָּ֙ אֶת אֹיְבֵ֣י יְהוָ֔ה בַּ/דָּבָ֖ר הַ/זֶּ֑ה גַּ֗ם הַ/בֵּ֛ן הַ/יִּלּ֥וֹד לְ/ךָ֖ מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/014.yaml
  text: Nevertheless[a], because by this matter you have utterly scorned the enemies of Yahweh, the son born to you will surely die.
translation:
  language: id
  text: Namun[a], karena melalui perkara ini engkau telah sangat menghina musuh-musuh Yahweh, anak laki-laki yang lahir bagimu itu pasti akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Banyak terjemahan mengartikan klausa ini, “engkau telah memberi musuh-musuh Yahweh kesempatan untuk menghina” atau “untuk menghujat.” Arti tersebut mengikuti pembacaan interpretatif atau perbaikan teks atas bahasa Ibrani yang sulit ini.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶפֶס
  choice: Namun
  rationale: Menandai pertentangan kuat terhadap pernyataan pengampunan sebelumnya, dengan bentuk yang alami dalam bahasa Indonesia modern.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan bagi akibat yang diumumkan.
- source_word: נִאֵץ נִאַצְתָּ
  choice: engkau telah sangat menghina
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan; 'sangat menghina' mempertahankan intensitas serta makna penghinaan.
- source_word: אֶת אֹיְבֵי יְהוָה
  choice: musuh-musuh Yahweh
  rationale: Mengikuti sintaksis teks Masoret yang tersedia, dengan frasa ini sebagai objek langsung tindakan Daud.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: בַּדָּבָר הַזֶּה
  choice: melalui perkara ini
  rationale: דבר menunjuk pada perkara atau perbuatan yang sedang dibicarakan; 'melalui' menyampaikan fungsi instrumental preposisi secara alami.
- source_word: גַּם
  choice: itu
  rationale: Daya tambah atau penegasannya disampaikan secara idiomatis oleh susunan akibat; tidak diterjemahkan secara mekanis sebagai 'juga'.
- source_word: הַבֵּן הַיִּלּוֹד לְךָ
  choice: anak laki-laki yang lahir bagimu itu
  rationale: Mempertahankan arti spesifik בֵּן dan bentuk partisip pasif, sekaligus memakai susunan Indonesia yang jelas.
- source_word: מוֹת יָמוּת
  choice: pasti akan mati
  rationale: Infinitif absolut bersama bentuk imperfek menegaskan kepastian kematian.
theological_decisions:
- issue: Subjek dan objek dalam klausa yang menyebut musuh-musuh Yahweh
  choice: 'Mengikuti teks Masoret: tindakan Daud sangat menghina musuh-musuh Yahweh.'
  alternative: Daud telah memberi musuh-musuh Yahweh kesempatan untuk menghina atau menghujat Yahweh; atau, melalui emendasi lain, Daud telah menghina Yahweh.
  rationale: Bentuk konsonantal dan vokalisasi WLC yang diberikan paling langsung menempatkan 'musuh-musuh Yahweh' sebagai objek verba. Karena bacaan ini sulit dalam konteks, bacaan interpretatif yang umum dicatat dalam catatan kaki, bukan disisipkan diam-diam ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Kata ganti 'engkau' dipakai untuk sapaan tunggal dalam konteks kenabian; nama ilahi ditulis 'Yahweh'. Catatan kaki mempertahankan ketegangan tekstual tanpa menyelesaikannya secara diam-diam.
