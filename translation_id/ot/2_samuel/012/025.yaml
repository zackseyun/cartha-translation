base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/025.yaml
  text: And he sent word through Nathan the prophet[a], and he called his name Jedidiah[b], because of Yahweh.
translation:
  language: id
  text: Ia mengirim pesan melalui Nabi Natan[a], lalu menamai anak itu Yedidya[b] karena Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui tangan Nabi Natan.”
    reason: lexical_alternative
  - marker: b
    text: Yedidya mungkin berarti “yang dikasihi Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ia mengirim pesan
  rationale: Kata kerja ini secara harfiah berarti “mengirim”. Karena tidak ada objek yang disebutkan dan tindakan itu dilakukan melalui Nabi Natan, “mengirim pesan” menyatakan tindakan komunikasi yang tersirat tanpa mengubah pelakunya.
- source_word: בְּיַד נָתָן הַנָּבִיא
  choice: melalui Nabi Natan
  rationale: Ungkapan harfiah “melalui tangan Nabi Natan” merupakan idiom Ibrani yang menyatakan perantaraan. “Melalui Nabi Natan” alami dalam bahasa Indonesia dan mempertahankan fungsi Natan sebagai perantara.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: menamai anak itu
  rationale: Ungkapan Ibrani “memanggil namanya” secara idiomatis berarti memberi nama. “Menamai anak itu” jelas dan alami, serta menghindari ketidakjelasan rujukan kata ganti.
- source_word: יְדִידְיָהּ
  choice: Yedidya
  rationale: Nama diri ini ditransliterasikan menurut pola bunyi Ibrani yang wajar dalam bahasa Indonesia. Maknanya dijelaskan dalam catatan kaki, bukan dimasukkan ke dalam teks utama.
- source_word: בַּעֲבוּר
  choice: karena
  rationale: Kata ini menyatakan alasan atau dasar penamaan. “Karena” mempertahankan hubungan alasan tersebut dengan ringkas, tanpa memperluas maksud yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Subjek kata kerja “mengirim” dan “menamai”
  choice: Keduanya merujuk kepada Yahweh, yang disebut sebagai subjek dalam konteks langsung ayat sebelumnya.
  alternative: Kata kerja kedua dapat dipahami dengan Natan sebagai subjek terdekat, atau dengan Daud sebagai pemberi nama.
  rationale: 'Rangkaian sintaksis paling alami meneruskan Yahweh sebagai subjek: Ia mengirim pesan melalui Natan dan memberi nama Yedidya. Namun, karena subjek tidak disebutkan ulang dalam bahasa Ibrani, terjemahan memakai “Ia” dan tidak menambahkan penjelasan teologis lebih jauh.'
- issue: Hubungan frasa “karena Yahweh” dengan penamaan
  choice: Dipertahankan sebagai alasan yang dinyatakan secara ringkas dalam teks sumber.
  alternative: “demi Yahweh” atau “oleh karena Yahweh”
  rationale: Frasa Ibrani dapat menyatakan alasan atau kepentingan. “Karena Yahweh” mempertahankan ketegangan semantisnya dan selaras dengan konteks bahwa Yahweh mengasihi anak itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Nabi Natan” lebih alami daripada “Natan sang nabi”. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya; urutan catatan disesuaikan dengan isi masing-masing, bukan mengikuti ketidaksesuaian penanda pada lapisan konsultasi Inggris.
