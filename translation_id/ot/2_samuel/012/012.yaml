id: 2SA.12.12
reference: 2 Samuel 12:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֥י אַתָּ֖ה עָשִׂ֣יתָ בַ/סָּ֑תֶר וַ/אֲנִ֗י אֶעֱשֶׂה֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל וְ/נֶ֥גֶד הַ/שָּֽׁמֶשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/012.yaml
  text: For you did it in secret[a], but I will do this thing before all Israel and before the sun.
translation:
  language: id
  text: Sebab engkau melakukannya secara tersembunyi, tetapi Aku akan melakukan hal ini di hadapan seluruh Israel dan di depan matahari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di siang bolong”; secara harfiah, “di depan matahari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi hukuman yang diumumkan pada ayat sebelumnya dan mempertahankan daya penjelas konjungsi Ibrani.
- source_word: עָשִׂיתָ
  choice: engkau melakukannya
  rationale: Kata kerja ini menunjuk kembali kepada pelanggaran Daud tanpa menyebutkannya lagi; akhiran -nya mempertahankan sifat eliptis tersebut secara wajar dalam bahasa Indonesia.
- source_word: בַסָּתֶר
  choice: secara tersembunyi
  rationale: Mengungkapkan tindakan yang dilakukan dalam kerahasiaan dan mempertahankan kontras dengan hukuman terbuka yang menyusul.
- source_word: וַאֲנִי
  choice: tetapi Aku
  rationale: Walaupun waw dapat berarti sekadar 'dan', konteksnya menyatakan kontras kuat antara tindakan Daud yang tersembunyi dan tindakan Allah yang terbuka.
- source_word: אֶעֱשֶׂה
  choice: akan melakukan
  rationale: Bentuk ini menyampaikan tindakan ilahi yang akan datang dalam pengumuman hukuman.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: Ungkapan ini mempertahankan penunjukan kepada tindakan penghukuman yang baru saja diumumkan tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: נֶגֶד כָּל יִשְׂרָאֵל
  choice: di hadapan seluruh Israel
  rationale: Menyampaikan arti berada di depan atau dalam pandangan seluruh Israel serta menegaskan sifat publik tindakan itu.
- source_word: וְנֶגֶד הַשָּׁמֶשׁ
  choice: dan di depan matahari
  rationale: Mempertahankan citra harfiah dan mencolok dari bahasa Ibrani, sedangkan makna idiomatisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pelaku hukuman yang diumumkan
  choice: 'Mempertahankan pelaku ilahi orang pertama: ''Aku akan melakukan hal ini'''
  alternative: Aku akan menyebabkan hal ini dilakukan
  rationale: Bahasa Ibrani memakai kata kerja orang pertama secara langsung. Meskipun hukuman itu terlaksana melalui peristiwa sejarah, ayat ini sendiri menyatakan tindakan Allah dan tidak sepatutnya diperhalus menjadi kausatif tidak langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'engkau' sesuai untuk ujaran langsung nabi kepada Daud, sedangkan 'Aku' menandai pembicara ilahi. Ungkapan harfiah 'di depan matahari' dipertahankan dalam teks utama untuk menjaga citra sumber dan ambiguitas idiomatisnya; padanan yang lebih alami dijelaskan dalam catatan kaki.
