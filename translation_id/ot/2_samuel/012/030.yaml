  text: וַ/יִּקַּ֣ח אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וּ/מִשְׁקָלָ֨/הּ כִּכַּ֤ר זָהָב֙ וְ/אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑ד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/030.yaml
  text: He took the crown of their king from his head[a]. Its weight was a talent of gold, and in it was a precious stone, and it was placed on David’s head[b]. He brought out the spoil of the city in very great quantity.
translation:
  language: id
  text: Ia mengambil mahkota raja mereka dari kepalanya[a]. Beratnya satu talenta emas[b], dan pada mahkota itu terdapat sebuah batu berharga. Mahkota itu lalu dikenakan di kepala Daud. Ia mengangkut jarahan kota itu dalam jumlah yang sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mahkota Milkom” (juga dieja “Malkam”), jika מַלְכָּם dipahami sebagai nama dewa orang Amon, bukan “raja mereka”.
    reason: alternative_reading
  - marker: b
    text: Talenta adalah satuan berat yang sangat besar, sering diperkirakan sekitar 34 kilogram, meskipun standar berat pada zaman dahulu berbeda-beda.
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: mahkota
  rationale: Dalam konteks kerajaan, kata ini menunjuk pada mahkota atau perhiasan kepala kebesaran; “mahkota” merupakan padanan Indonesia yang paling wajar.
- source_word: מַלְכָּם
  choice: raja mereka
  rationale: Bentuk ini secara morfologis dapat dipahami sebagai “raja mereka”, dan frasa berikutnya tentang mengambil mahkota dari kepalanya mendukung pemahaman tersebut. Kemungkinan nama Milkom dipertahankan dalam catatan kaki.
- source_word: מֵעַל רֹאשׁוֹ
  choice: dari kepalanya
  rationale: Padanan ini menyampaikan gerak pengambilan dari atas kepala secara alami dalam bahasa Indonesia tanpa ungkapan yang kaku.
- source_word: כִּכַּר זָהָב
  choice: satu talenta emas
  rationale: כִּכָּר adalah satuan berat kuno yang lazim disebut “talenta”; catatan kaki menjelaskan perkiraan nilainya.
- source_word: וְאֶבֶן יְקָרָה
  choice: dan pada mahkota itu terdapat sebuah batu berharga
  rationale: Bahasa Ibrani secara harfiah hanya berbunyi “dan sebuah batu berharga”. Penyebutan kembali mahkota memperjelas hubungan frasa itu secara alami tanpa menentukan secara berlebihan bagaimana batu tersebut dipasang.
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִד
  choice: Mahkota itu lalu dikenakan pada kepala Daud
  rationale: Klausa tersebut menyatakan bahwa mahkota itu kemudian berada di kepala Daud; bentuk pasif “dikenakan” mengungkapkan peristiwa itu dengan wajar tanpa menyebut pelaku yang tidak dinyatakan.
- source_word: וּשְׁלַל הָעִיר
  choice: jarahan kota itu
  rationale: שָׁלָל menunjuk pada barang rampasan perang; “jarahan” jelas dan lazim dalam narasi sejarah.
- source_word: הוֹצִיא
  choice: mengangkut
  rationale: Dalam konteks barang jarahan yang dikeluarkan dari kota, “mengangkut” menyampaikan tindakan memindahkan atau membawa keluar secara alami.
- source_word: הַרְבֵּה מְאֹד
  choice: dalam jumlah yang sangat besar
  rationale: Ungkapan ini menegaskan kelimpahan jarahan dan diterjemahkan dengan idiom Indonesia yang jelas.
theological_decisions:
- issue: Apakah מַלְכָּם berarti “raja mereka” atau merupakan nama dewa orang Amon, Milkom/Malkam
  choice: raja mereka
  alternative: Milkom (juga dapat dieja Malkam)
  rationale: Morfologi teks yang diberikan dan acuan pada “kepalanya” mendukung pembacaan sebagai raja manusia. Namun, karena pembacaan sebagai nama dewa Amon merupakan kemungkinan leksikal yang dikenal, alternatif itu dicantumkan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Nama Daud mengikuti bentuk Indonesia yang lazim. Istilah teknis kuno “talenta” dipertahankan dan dijelaskan melalui catatan kaki.
