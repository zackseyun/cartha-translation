  text: וְ/עַתָּ֣ה מֵ֗ת לָ֤/מָּה זֶּה֙ אֲנִ֣י צָ֔ם הַ/אוּכַ֥ל לַ/הֲשִׁיב֖/וֹ ע֑וֹד אֲנִי֙ הֹלֵ֣ךְ אֵלָ֔י/ו וְ/ה֖וּא לֹֽא יָשׁ֥וּב אֵלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/023.yaml
  text: But now he is dead. Why should I fast any longer? Can I bring him back again? I am going to him[a], but he will not return to me.
translation:
  language: id
  text: Namun sekarang ia sudah mati. Mengapa aku harus berpuasa lagi? Dapatkah aku membawanya kembali? Aku akan pergi kepadanya[a], tetapi ia tidak akan kembali kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sedang menuju kepadanya.” Partisipel Ibrani dapat menyatakan masa depan yang pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Penanda wacana ini mengontraskan tindakan Daud setelah kematian anak itu dengan tindakannya sebelumnya.
- source_word: מֵת
  choice: ia sudah mati
  rationale: Bentuk predikatif menyatakan keadaan yang kini telah terjadi; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: לָמָּה זֶּה אֲנִי צָם
  choice: Mengapa aku harus berpuasa
  rationale: Menyampaikan daya retoris ungkapan Ibrani secara alami tanpa menerjemahkan זֶּה secara kaku.
- source_word: עוֹד
  choice: lagi
  rationale: Pada pertanyaan pertama, kata ini menunjukkan kelanjutan puasa yang kini tidak lagi dianggap berguna.
- source_word: הַאוּכַל
  choice: Dapatkah aku
  rationale: Menyatakan kemampuan atau kemungkinan dalam pertanyaan retoris.
- source_word: לַהֲשִׁיבוֹ עוֹד
  choice: membawanya kembali
  rationale: Bentuk kausatif dari שוב berarti menyebabkan dia kembali; dalam konteks kematian, terjemahan ini jelas tanpa menambahkan penjelasan tentang mekanismenya. Makna עוֹד tercakup secara alami dalam 'kembali'.
- source_word: אֲנִי הֹלֵךְ אֵלָיו
  choice: Aku akan pergi kepadanya
  rationale: Partisipel הֹלֵךְ dapat menyatakan masa depan yang pasti. Bentuk 'akan pergi' terdengar alami dalam bahasa Indonesia, sementara alternatif yang lebih dekat dengan bentuk partisipel dicatat dalam catatan kaki.
- source_word: וְהוּא לֹא יָשׁוּב אֵלַי
  choice: tetapi ia tidak akan kembali kepadaku
  rationale: Imperfek שוב paling wajar menyatakan masa depan di sini, dan 'tetapi' memperjelas kontras antara arah perjalanan Daud dan ketidakmungkinan anak itu kembali.
theological_decisions:
- issue: Apakah perkataan Daud menyiratkan pertemuan sadar dengan anak yang meninggal dalam kehidupan sesudah kematian
  choice: Menerjemahkan secara langsung 'Aku akan pergi kepadanya' tanpa menentukan hakikat kepergian tersebut selain bahwa Daud kelak juga akan mati.
  alternative: Memahaminya sebagai pernyataan tentang pertemuan pribadi dengan anak itu setelah kematian, atau hanya sebagai kepergian Daud ke alam orang mati.
  rationale: Teks Ibrani hanya menyatakan bahwa Daud akan pergi kepada anak itu, sedangkan anak itu tidak akan kembali kepadanya. Terjemahan tidak boleh memperluasnya menjadi doktrin khusus tentang keadaan sesudah kematian atau keselamatan bayi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'ia' dan bentuk 'kepadanya/kepadaku' menjaga kelancaran serta register naratif Alkitab tanpa terdengar terlalu arkais.
