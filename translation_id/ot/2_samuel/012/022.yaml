source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בְּ/עוֹד֙ הַ/יֶּ֣לֶד חַ֔י צַ֖מְתִּי וָֽ/אֶבְכֶּ֑ה כִּ֤י אָמַ֨רְתִּי֙ מִ֣י יוֹדֵ֔עַ יחנ/ני יְהוָ֖ה וְ/חַ֥י הַ/יָּֽלֶד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/022.yaml
  text: He said[a], “While the child was still alive, I fasted and wept, because I said, ‘Who knows? Yahweh may be gracious to me, and the child may live.’”
translation:
  language: id
  text: Ia berkata, “Ketika anak itu masih hidup, aku berpuasa dan menangis, sebab aku berkata, ‘Siapa tahu? Yahweh berkenan kepadaku dan anak itu akan hidup.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעוֹד הַיֶּלֶד חַי
  choice: Selama anak itu masih hidup
  rationale: Ungkapan ini menyatakan keadaan yang terus berlangsung pada masa lampau; bentuk Indonesia ini alami dan mempertahankan nuansa ‘masih hidup’.
- source_word: צַמְתִּי וָאֶבְכֶּה
  choice: aku berpuasa dan menangis
  rationale: Kedua verba diterjemahkan langsung dengan ungkapan Indonesia yang lazim dan sesuai dengan suasana dukacita.
- source_word: כִּי אָמַרְתִּי
  choice: sebab pikirku
  rationale: כִּי memperkenalkan alasan tindakan Daud, sedangkan אָמַרְתִּי dalam konteks ini dapat secara alami merujuk pada perkataan dalam hati.
- source_word: מִי יוֹדֵעַ
  choice: Siapa tahu?
  rationale: Idiom Indonesia ini mempertahankan ketidakpastian sekaligus harapan yang dinyatakan oleh bahasa Ibrani.
- source_word: יְחָנֵּנִי
  choice: berkenan mengasihani aku
  rationale: Bentuk dari חנן menyatakan tindakan memberikan belas kasih atau kemurahan; ‘berkenan’ membantu menyampaikan sifat kemungkinan tanpa menjadikannya pasti.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan sebuah gelar.
- source_word: וְחַי הַיָּלֶד
  choice: sehingga anak itu tetap hidup
  rationale: Klausa ini menyatakan hasil yang diharapkan, bukan kepastian; ‘sehingga’ menghubungkannya dengan tindakan belas kasih Yahweh dan ‘tetap hidup’ sesuai dengan konteks anak yang saat itu masih hidup.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Tingkat kepastian dalam harapan Daud
  choice: Siapa tahu? Yahweh berkenan mengasihani aku sehingga anak itu tetap hidup.
  alternative: Yahweh akan mengasihani aku dan anak itu akan hidup.
  rationale: מִי יוֹדֵעַ menandai ketidakpastian. Terjemahan tidak mengubah harapan Daud menjadi keyakinan atau janji yang pasti.
- issue: Hubungan antara kemurahan Yahweh dan hidupnya anak
  choice: sehingga anak itu tetap hidup
  alternative: dan anak itu mungkin hidup
  rationale: Waw dapat dipahami sebagai hasil yang diharapkan. ‘Sehingga’ mempertahankan hubungan logis itu, sementara konteks ‘Siapa tahu?’ tetap menaungi seluruh harapan dengan ketidakpastian.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. ‘Sebab pikirku’ dipilih agar ujaran batin terdengar wajar, sedangkan ‘Siapa tahu?’ mempertahankan idiom serta ketegangan teologis sumber.
