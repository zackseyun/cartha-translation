  to: Ia berkata, “Ketika anak itu masih hidup, aku berpuasa dan menangis, sebab aku berkata, ‘Siapa tahu? Yahweh berkenan kepadaku dan anak itu akan hidup.’”
  rationale: Revisi mempertahankan ketidakpastian dan harapan dalam ujaran Daud, menerjemahkan verba ‘aku berkata’ secara langsung, serta tidak memaksakan hubungan kausal antara kemurahan Yahweh dan hidup anak itu. Dalam bahasa Indonesia, “Siapa tahu?” secara wajar menaungi klausa harapan yang mengikutinya, sehingga “akan hidup” tidak menyatakan kepastian mandiri.
