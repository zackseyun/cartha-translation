  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל נָתָ֔ן חָטָ֖אתִי לַֽ/יהוָ֑ה וַ/יֹּ֨אמֶר נָתָ֜ן אֶל דָּוִ֗ד גַּם יְהוָ֛ה הֶעֱבִ֥יר חַטָּאתְ/ךָ֖ לֹ֥א תָמֽוּת־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/013.yaml
  text: Then David said to Nathan[a], “I have sinned against Yahweh.” And Nathan said to David, “Yahweh also has taken away your sin[b]; you shall not die.”
translation:
  language: id
  text: Lalu Daud berkata kepada Natan, “Aku telah berdosa terhadap Yahweh.” Natan berkata kepada Daud, “Yahweh juga telah menyingkirkan dosamu[a]; engkau tidak akan mati[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah membuat dosamu berlalu” atau “telah menghapus dosamu.” Kata kerja Ibrani ini secara harfiah berarti “telah menyebabkan berlalu,” dan di sini menunjuk pada disingkirkannya dosa beserta tanggungannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau tidak akan dihukum mati.” Teks Ibrani hanya mengatakan “engkau tidak akan mati,” meskipun konteks hukumnya mungkin menyiratkan bahwa Daud dibebaskan dari hukuman mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Lalu Daud berkata ... Natan berkata
  rationale: Rangkaian naratif waw-konsekutif disampaikan secara alami dalam bahasa Indonesia dengan “Lalu” pada klausa pertama; pengulangan “berkata” mempertahankan struktur teks Ibrani tanpa membuat kalimat kaku.
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Bentuk Qal perfek orang pertama tunggal menyatakan pengakuan atas perbuatan yang sudah dilakukan dan tetap relevan pada saat Daud berbicara.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Dengan verba חטא, preposisi ל menyatakan pihak yang terhadapnya dosa dilakukan. “Terhadap” merupakan ungkapan Indonesia yang alami dan tepat dalam konteks pengakuan dosa.
- source_word: גַּם
  choice: juga
  rationale: Pilihan ini mempertahankan daya penghubung dan penegasan kata Ibrani tanpa mempersempit nuansanya menjadi “sungguh” atau “bahkan”.
- source_word: הֶעֱבִיר
  choice: telah menyingkirkan
  rationale: Bentuk Hifil dari עבר secara harfiah berarti menyebabkan berlalu. Dalam hubungan dengan dosa, “menyingkirkan” menyampaikan tindakan ilahi yang menghapus tanggungan dosa tanpa menjelaskan mekanismenya secara berlebihan.
- source_word: חַטָּאתְךָ
  choice: dosamu
  rationale: Dalam konteks ini kata tersebut menunjuk langsung kepada dosa yang baru saja Daud akui. “Kesalahanmu” mungkin menangkap nuansa tanggungan, tetapi kurang langsung.
- source_word: לֹא תָמוּת
  choice: engkau tidak akan mati
  rationale: Bentuk imperfek yang dinegasikan menyatakan bahwa Daud tidak akan mati. Terjemahan ini tidak menambahkan gagasan “dihukum mati,” yang mungkin tersirat oleh konteks hukum tetapi tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Makna pengampunan dalam הֶעֱבִיר חַטָּאתְךָ
  choice: Yahweh telah menyingkirkan dosamu
  alternative: Yahweh telah membuat dosamu berlalu; Yahweh telah menghapus dosamu
  rationale: Ungkapan ini menyatakan bahwa Yahweh menyingkirkan dosa Daud dan bahwa Daud tidak akan mati, tetapi ayat ini tidak menerangkan mekanisme pendamaian. Pilihan tersebut mempertahankan ketegangan itu tanpa memasukkan penjelasan teologis dari luar ayat.
- issue: Sifat pernyataan לֹא תָמוּת
  choice: engkau tidak akan mati
  alternative: engkau tidak akan dihukum mati
  rationale: Konteks dapat mengarah pada pembebasan dari hukuman mati, tetapi teks Ibrani hanya menyebut bahwa Daud tidak akan mati. Terjemahan utama mempertahankan keluasan pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Pronomina “aku” mempertahankan sifat pribadi pengakuan Daud, sedangkan “engkau” memberi bobot pada jawaban kenabian. Nama ilahi ditransliterasikan sebagai “Yahweh.”
