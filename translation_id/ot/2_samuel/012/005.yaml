base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/005.yaml
  text: Then David burned with anger against the man greatly[a], and he said to Nathan, “As Yahweh lives, the man who has done this is a son of death!”
translation:
  language: id
  text: Lalu amarah Daud berkobar hebat terhadap orang itu. Ia berkata kepada Natan, “Demi Yahweh yang hidup, orang yang melakukan hal itu patut dihukum mati![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak kematian,” yaitu orang yang layak atau patut menerima hukuman mati.'
    reason: Menjelaskan idiom Ibrani בֶן מָוֶת dan mempertahankan bentuk harfiahnya bagi pembaca.
lexical_decisions:
- source_word: וַיִּחַר אַף דָּוִד ... מְאֹד
  choice: amarah Daud berkobar hebat
  rationale: Ungkapan Ibrani menggambarkan amarah yang menyala, sedangkan מְאֹד memperkuat intensitasnya. Frasa ini mempertahankan gambaran tersebut dalam bahasa Indonesia yang alami.
- source_word: בָּאִישׁ
  choice: terhadap orang itu
  rationale: Preposisi menandai sasaran amarah Daud, dan bentuk definit merujuk kepada orang kaya dalam perumpamaan Natan.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ini adalah rumusan sumpah yang khidmat. Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan nama ilahi Yahweh.
- source_word: כִּי
  choice: pernyataan langsung tanpa padanan tersendiri
  rationale: Di sini כִּי memperkenalkan isi pernyataan yang diteguhkan dengan sumpah; dalam bahasa Indonesia maknanya paling alami disampaikan langsung.
- source_word: בֶן מָוֶת
  choice: patut dihukum mati
  rationale: Idiom harfiahnya 'anak kematian', tetapi maknanya ialah seseorang yang layak atau patut menerima hukuman mati. Padanan idiomatis menghindari ungkapan Indonesia yang kabur, sementara bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: הָעֹשֶׂה זֹאת
  choice: yang melakukan hal itu
  rationale: Partisip Ibrani mengidentifikasi pelaku berdasarkan tindakannya; klausa relatif ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menyebut nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar.
- issue: Penerjemahan idiom בֶן מָוֶת
  choice: patut dihukum mati
  alternative: anak kematian; layak mati
  rationale: Ungkapan itu menyatakan kelayakan menerima hukuman mati, bukan hubungan keturunan secara harfiah. Terjemahan idiomatis memberi makna yang jelas tanpa menentukan apakah hukuman itu sungguh akan dilaksanakan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Amarah ... berkobar hebat' mempertahankan citra serta intensitas Ibrani; rumusan sumpah tetap bernada serius dan yudisial.
