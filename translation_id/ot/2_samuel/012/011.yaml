  source_fidelity: Terjemahan pada umumnya setia. “Malapetaka” tepat untuk רָעָה dalam konteks penghukuman, dan “dari keluargamu sendiri” menyampaikan pengertian בית sebagai lingkup rumah tangga. Namun, לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת secara harfiah berarti “di hadapan matahari ini” atau “di depan matahari ini,” bukan terutama “di bawah cahaya matahari ini.”
  naturalness: Bahasanya modern, baku, dan bernada khidmat. “Memberikannya” dapat menimbulkan ketidakselarasan karena rujukannya ialah “istri-istrimu” yang jamak; “menyerahkan mereka” lebih jelas dan alami dalam konteks ini.
  terminology: “Yahweh,” “firman,” “malapetaka,” dan eufemisme “tidur dengan” digunakan secara konsisten dan sesuai register. “Orang yang dekat denganmu” merupakan pilihan yang wajar untuk רֵעֶךָ dan mempertahankan keluasan leksikalnya.
