    rationale: Ungkapan Ibrani berbunyi “di hadapan/di depan matahari ini” dan menekankan keterbukaan di bawah pandangan matahari. “Di bawah cahaya” menyampaikan waktu siang, tetapi kurang mempertahankan konstruksi dan citra konkret sumber.
  - severity: low
