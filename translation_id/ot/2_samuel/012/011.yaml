base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/011.yaml
  text: 'Thus says Yahweh: Behold[a], I am raising up disaster against you from your own house, and I will take your wives before your eyes and give them to your neighbor[b], and he will lie with your wives in the sight of this sun.'
translation:
  language: id
  text: 'Beginilah firman Yahweh: “Lihatlah, Aku akan mendatangkan malapetaka kepadamu dari keluargamu sendiri. Aku akan mengambil istri-istrimu di depan matamu dan menyerahkan mereka kepada orang yang dekat denganmu[a]. Ia akan tidur dengan istri-istrimu di hadapan matahari ini[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesamamu,” “rekanmu,” atau “sahabatmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di hadapan matahari ini,” yakni secara terbuka dan terang-terangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan rumusan baku berita kenabian secara wajar dan khidmat dalam bahasa Indonesia serta menampilkan nama ilahi.
- source_word: הִנְנִי
  choice: Lihatlah, Aku akan
  rationale: Menjaga fungsi partikel sebagai penarik perhatian; konstruksi partisipial Ibrani dipadankan dengan bentuk futur yang alami karena menunjuk tindakan yang segera dinyatakan Allah.
- source_word: מֵקִים עָלֶיךָ רָעָה
  choice: mendatangkan malapetaka kepadamu
  rationale: Dalam konteks penghukuman, רָעָה berarti bencana atau malapetaka, bukan kejahatan moral. 'Mendatangkan' menyampaikan tindakan kausatif secara alami.
- source_word: מִבֵּיתֶךָ
  choice: dari keluargamu sendiri
  rationale: בַּיִת di sini menunjuk rumah tangga atau dinasti Daud, bukan semata-mata bangunan; 'sendiri' menegaskan bahwa sumber malapetaka itu berasal dari lingkup rumah tangganya.
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang tindakan yang terjadi dalam pengetahuan dan pandangan Daud.
- source_word: לְרֵעֶיךָ
  choice: kepada orang yang dekat denganmu
  rationale: רֵעַ dapat berarti sesama, rekan, sahabat, atau orang dekat. Ungkapan ini menjaga keluasan makna sekaligus cocok dengan seorang tertentu dalam lingkaran dekat Daud.
- source_word: וְשָׁכַב עִם נָשֶׁיךָ
  choice: Ia akan tidur dengan istri-istrimu
  rationale: Dalam bahasa Indonesia modern, 'tidur dengan' merupakan ungkapan yang jelas namun tidak kasar untuk hubungan seksual, sepadan dengan eufemisme Ibrani.
- source_word: לְעֵינֵי הַשֶּׁמֶשׁ הַזֹּאת
  choice: di bawah cahaya matahari ini
  rationale: Menjaga citra matahari yang konkret sambil menyampaikan bahwa perbuatan itu akan berlangsung secara terbuka pada siang hari.
theological_decisions:
- issue: Makna רָעָה dalam tindakan penghukuman Allah
  choice: malapetaka
  alternative: kejahatan
  rationale: Konteksnya adalah hukuman berupa bencana yang menimpa Daud. Terjemahan ini mempertahankan bahwa Yahweh berdaulat mendatangkan hukuman tanpa menyatakan bahwa Ia melakukan kejahatan moral.
- issue: Cakupan מִבֵּיתֶךָ
  choice: dari keluargamu sendiri
  alternative: dari rumahmu sendiri
  rationale: Ancaman itu muncul dari rumah tangga atau keluarga kerajaan Daud. Pilihan ini menghindari salah pengertian bahwa sumbernya sekadar sebuah tempat atau bangunan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ujaran langsung diberi tanda petik. Pronomina untuk Yahweh memakai huruf kapital menurut kelaziman penerbitan Alkitab Indonesia. Istilah seksual disampaikan dengan eufemisme yang jelas tetapi tidak vulgar.
