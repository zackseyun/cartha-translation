lexical_decisions:
- source_word: לְעָשִׁיר
  choice: Orang kaya itu
  rationale: Konstruksi לְ dengan הָיָה menyatakan kepunyaan. Bentuk definit dipilih karena tokoh ini sudah diperkenalkan bersama orang miskin pada ayat sebelumnya dan kini dikontraskan dengannya.
- source_word: הָיָה
  choice: mempunyai
  rationale: Walaupun secara harfiah berarti 'ada', bersama לְ bentuk ini secara idiomatis menyatakan kepemilikan; 'mempunyai' jelas dan alami dalam bahasa Indonesia modern.
- source_word: צֹאן
  choice: kambing domba
  rationale: Kata kolektif ini menunjuk ternak kecil, terutama domba dan kambing. 'Kambing domba' mempertahankan cakupan yang lebih tepat daripada hanya 'domba'.
- source_word: וּבָקָר
  choice: dan sapi
  rationale: בָּקָר menunjuk ternak besar dari jenis lembu; 'sapi' merupakan padanan umum dan alami dalam bahasa Indonesia.
- source_word: הַרְבֵּה מְאֹד
  choice: sangat banyak
  rationale: Ungkapan ini menegaskan jumlah yang amat besar; 'sangat banyak' mempertahankan intensitasnya dengan bahasa yang lugas.
