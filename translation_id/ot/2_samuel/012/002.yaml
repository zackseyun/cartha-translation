  yaml_path: translation/ot/2_samuel/012/002.yaml
  text: The rich man had very many sheep and cattle[a].
translation:
  language: id
  text: Orang kaya itu mempunyai banyak sekali kambing domba dan sapi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seorang kaya mempunyai banyak sekali kambing domba dan sapi.”
