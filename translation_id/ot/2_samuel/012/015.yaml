base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/015.yaml
  text: Then Nathan went to his house[a], and Yahweh struck the child whom Uriah’s wife had borne to David[c][b], and it became sick.
translation:
  language: id
  text: Kemudian Natan pulang ke rumahnya. Lalu Yahweh memukul[a] anak yang telah dilahirkan oleh istri Uria bagi Daud[b], dan anak itu jatuh sakit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menulahi” atau “menimpakan malapetaka kepada.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “istri Uria”; teks sengaja tidak menyebut namanya, Batsyeba, di sini.
    reason: cultural_note
  - marker: c
    text: 'Atau: “dan anak itu menjadi sakit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ נָתָן אֶל בֵּיתוֹ
  choice: Kemudian Natan pulang ke rumahnya
  rationale: Rangkaian wayyiqtol melanjutkan alur cerita. Secara harfiah ungkapan itu berarti 'pergi ke rumahnya'; 'pulang ke rumahnya' menyampaikan gerak menuju rumah sendiri secara alami dalam bahasa Indonesia.
- source_word: וַיִּגֹּף
  choice: menulahi
  rationale: Kata נָגַף menyatakan tindakan memukul atau mendatangkan malapetaka yang mencelakakan. 'Menulahi' mempertahankan tindakan langsung Yahweh dan dampak buruknya tanpa menentukan jenis penyakit tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הַיֶּלֶד
  choice: anak
  rationale: Dalam konteks ini yang dimaksud adalah anak Daud yang masih kecil; 'anak' merupakan padanan Indonesia yang tepat dan wajar.
- source_word: אֲשֶׁר יָלְדָה אֵשֶׁת אוּרִיָּה לְדָוִד
  choice: yang dilahirkan istri Uria bagi Daud
  rationale: Mempertahankan klausa relatif serta sebutan sengaja 'istri Uria', tanpa menggantinya dengan nama Batsyeba. Bentuk pasif alami menghindari konstruksi Indonesia yang janggal.
- source_word: וַיֵּאָנַשׁ
  choice: sehingga anak itu jatuh sakit
  rationale: Verba tersebut menunjukkan anak itu menjadi sakit. 'Jatuh sakit' menyatakan timbulnya keadaan sakit; 'sehingga' memperjelas akibat tindakan sebelumnya tanpa menambahkan tingkat keparahan yang baru disebut dalam ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama pribadi Allah dalam teks Ibrani dan membedakannya dari sebuah gelar.
- issue: Pelaku yang menyebabkan penderitaan anak
  choice: Yahweh menulahi anak itu
  alternative: anak itu ditimpa penyakit
  rationale: Teks Ibrani secara langsung menyatakan Yahweh sebagai pelaku; terjemahan tidak melunakkan atau mengaburkan agensi tersebut.
- issue: Sebutan bagi ibu anak itu
  choice: istri Uria
  alternative: Batsyeba
  rationale: Teks sengaja memakai hubungan pernikahannya dengan Uria, bukan namanya; ketegangan moral dan naratif ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang lugas dan bermartabat. 'Menulahi' dipakai dalam makna baku mendatangkan celaka, sementara catatan kaki menyediakan padanan yang lebih harfiah. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
