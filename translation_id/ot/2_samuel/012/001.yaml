id: 2SA.12.1
reference: 2 Samuel 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אֶת נָתָ֖ן אֶל דָּוִ֑ד וַ/יָּבֹ֣א אֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁנֵ֣י אֲנָשִׁ֗ים הָיוּ֙ בְּ/עִ֣יר אֶחָ֔ת אֶחָ֥ד עָשִׁ֖יר וְ/אֶחָ֥ד רָֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/001.yaml
  text: Then Yahweh sent Nathan to David. He came to him and said to him[a], “There were two men in one city, one rich and one poor.”
translation:
  language: id
  text: 'Kemudian Yahweh mengutus Natan kepada Daud. Natan datang kepadanya dan berkata, “Ada dua orang di sebuah kota[a]: yang satu kaya dan yang lain miskin.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ada dua orang di satu kota.” Dapat juga dipahami: “Dua orang tinggal di sebuah kota.”'
    reason: Menunjukkan bentuk harfiah בְּעִיר אֶחָת dan kemungkinan pengungkapan kontekstual הָיוּ tanpa memasukkan makna ‘tinggal’ ke dalam teks utama.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks Yahweh memberi Natan suatu misi kepada Daud, שׁלח secara alami berarti ‘mengutus’, bukan sekadar ‘mengirim’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת נָתָן
  choice: Natan
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama נתן ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: Preposisi אֶל menunjukkan tujuan pengutusan. ‘Kepada’ tidak menambahkan gagasan permusuhan yang tidak dinyatakan oleh preposisi itu.
- source_word: וַיָּבֹא אֵלָיו
  choice: Natan datang kepadanya
  rationale: בוא אֶל berarti datang atau pergi kepada seseorang. Nama ‘Natan’ diulangi agar rujukan subjek jelas dan alami dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata
  rationale: Penerima perkataan sudah jelas dari ‘kepadanya’; mengulanginya sebagai ‘berkata kepadanya’ terasa kaku dalam bahasa Indonesia.
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dua orang
  rationale: אֲנָשִׁים mengacu pada dua laki-laki, tetapi ‘dua orang’ merupakan ungkapan Indonesia yang paling wajar; jenis kelamin keduanya tersirat dari konteks kisah.
- source_word: הָיוּ
  choice: ada
  rationale: Bentuk היה di sini bersifat eksistensial dan paling langsung diterjemahkan ‘ada’, tanpa menambahkan makna ‘tinggal’.
- source_word: בְּעִיר אֶחָת
  choice: di sebuah kota
  rationale: Secara harfiah ‘di satu kota’; ‘di sebuah kota’ menyampaikan pengenalan lokasi tak tentu secara alami dalam bahasa Indonesia.
- source_word: אֶחָד עָשִׁיר
  choice: yang satu kaya
  rationale: Klausa nominal Ibrani dilengkapi secara idiomatis dengan struktur korelatif Indonesia ‘yang satu ...’.
- source_word: וְאֶחָד רָאשׁ
  choice: dan yang lain miskin
  rationale: רָאשׁ berarti miskin atau melarat. ‘Miskin’ memberikan kontras paling langsung dengan ‘kaya’, sedangkan ‘yang lain’ menghindari pengulangan kaku ‘yang satu ... yang satu lagi’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk ‘Yahweh’ mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Kalimat dibuat lugas serta mudah dibacakan. Pengulangan nama Natan dipakai untuk memperjelas subjek; bentuk eksistensial ‘ada’ mempertahankan kedekatan dengan susunan Ibrani.
