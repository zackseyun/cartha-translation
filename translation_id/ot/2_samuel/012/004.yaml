base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/004.yaml
  text: A traveler came to the rich man[a], and he spared taking from his own flock and from his own herd to prepare for the traveler who had come to him. So he took the ewe lamb of the poor man and prepared it for the man who had come to him.
translation:
  language: id
  text: Seorang musafir datang kepada orang kaya itu.[a] Orang kaya itu enggan mengambil dari kawanan dombanya atau kawanan sapinya sendiri untuk menyiapkan makanan bagi tamu yang datang kepadanya. Sebaliknya, ia mengambil anak domba betina milik orang miskin itu dan menyiapkannya bagi orang yang datang kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai sebutan-sebutan yang berkaitan tetapi berbeda bagi pengunjung itu: mula-mula orang yang sedang dalam perjalanan, kemudian orang yang diterima sebagai tamu, dan akhirnya “orang yang datang kepadanya”.'
    reason: lexical_distinction
lexical_decisions:
- source_word: הֵלֶךְ
  choice: musafir
  rationale: Kata ini menunjuk kepada orang yang sedang dalam perjalanan. “Musafir” alami dalam bahasa Indonesia dan membedakannya dari istilah berikutnya yang lebih menekankan penerimaan sebagai tamu.
- source_word: וַיַּחְמֹל
  choice: enggan
  rationale: Verba ini biasanya berarti menyayangkan, mengasihani, atau tidak tega, tetapi objeknya tidak dinyatakan di sini. Dalam konteks ini, maksudnya ialah orang kaya itu menahan diri dan tidak rela mengambil dari ternaknya sendiri. “Enggan” menyampaikan daya idiomatis itu tanpa menyisipkan objek belas kasihan yang tidak disebutkan.
- source_word: מִצֹּאנוֹ וּמִבְּקָרוֹ
  choice: dari kawanan domba atau kawanan sapinya sendiri
  rationale: 'Kedua nomina Ibrani bersifat kolektif. “Kawanan domba” dan “kawanan sapi” mempertahankan gambaran tersebut, sedangkan “sendiri” menyatakan sufiks kepunyaan dan menegaskan kontras moral. Konjungsi diterjemahkan “atau” secara idiomatis dalam lingkup penyangkalan: ia tidak mau mengambil dari salah satu di antara kedua kelompok ternaknya.'
- source_word: לַעֲשׂוֹת / וַיַּעֲשֶׂהָ
  choice: untuk diolah / mengolahnya
  rationale: Dalam konteks penyediaan makanan, עשה berarti menyiapkan hewan itu sebagai hidangan. “Mengolah” cukup jelas tanpa menentukan cara memasak yang tidak dinyatakan, serta mempertahankan pengulangan verba Ibrani.
- source_word: לָאֹרֵחַ
  choice: bagi tamu
  rationale: אָרֵחַ dapat berarti tamu atau orang yang sedang bepergian. Dalam konteks keramahtamahan, “tamu” alami dan sekaligus mempertahankan perbedaan leksikal dari הֵלֶךְ pada awal ayat.
- source_word: כִּבְשַׂת
  choice: anak domba betina
  rationale: Bentuk Ibrani secara khusus menunjuk kepada domba muda betina. Terjemahan ini mempertahankan jenis kelamin dan usia hewan secara jelas bagi pembaca modern.
- source_word: הָאִישׁ הָרָאשׁ
  choice: orang miskin itu
  rationale: רָאשׁ menunjuk kepada orang miskin atau berkekurangan. “Orang miskin” merupakan padanan yang jelas dan menonjolkan kontras dengan orang kaya.
- source_word: הַבָּא לוֹ / הַבָּא אֵלָיו
  choice: yang datang kepadanya / orang yang datang kepadanya
  rationale: Partisipel berartikel menggambarkan orang yang tiba. Pada kemunculan terakhir, “orang” mempertahankan אִישׁ dan menghindari penyamaan penuh ketiga sebutan pengunjung dalam teks Ibrani.
