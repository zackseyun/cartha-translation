translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat. “Musafir” dipilih karena ringkas dan masih umum dipahami; “enggan” menghindari ungkapan yang terlalu harfiah atau terlalu percakapan. Struktur kalimat dipecah agar jelas, sementara peralihan dari ternak milik sendiri kepada anak domba orang miskin ditegaskan dengan “Sebaliknya”.
