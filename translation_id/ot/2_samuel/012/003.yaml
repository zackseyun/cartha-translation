  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָ/רָ֣שׁ אֵֽין כֹּ֗ל כִּי֩ אִם כִּבְשָׂ֨ה אַחַ֤ת קְטַנָּה֙ אֲשֶׁ֣ר קָנָ֔ה וַ/יְחַיֶּ֕/הָ וַ/תִּגְדַּ֥ל עִמּ֛/וֹ וְ/עִם בָּנָ֖י/ו יַחְדָּ֑ו מִ/פִּתּ֨/וֹ תֹאכַ֜ל וּ/מִ/כֹּס֤/וֹ תִשְׁתֶּה֙ וּ/בְ/חֵיק֣/וֹ תִשְׁכָּ֔ב וַ/תְּהִי ל֖/וֹ כְּ/בַֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/003.yaml
  text: But the poor man had nothing except one little ewe lamb[a], which he had bought. He kept it alive, and it grew up with him and with his children together; it would eat from his morsel and drink from his cup and lie in his bosom[c][b], and it was like a daughter to him.
translation:
  language: id
  text: Namun, orang miskin itu tidak mempunyai apa-apa selain seekor anak domba betina kecil[a] yang telah dibelinya. Ia memelihara anak domba itu, dan anak domba itu tumbuh bersama-sama dengannya dan anak-anaknya[c]. Anak domba itu makan dari suapannya, minum dari cawannya, dan berbaring di pangkuannya[b]. Baginya, anak domba itu seperti seorang anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seekor anak domba betina, satu yang kecil.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di pelukannya” atau “dekat dadanya.” Kata Ibrani dapat menunjuk pangkuan, dada, atau tempat dalam pelukan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “anak-anak lelakinya” atau “putra-putranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: orang miskin
  rationale: Nomina ini menunjuk kepada orang yang miskin atau berkekurangan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan orang kaya dalam konteks.
- source_word: אֵין כֹּל כִּי אִם
  choice: tidak mempunyai apa-apa selain
  rationale: Ungkapan ini menyatakan ketiadaan total dengan satu pengecualian.
- source_word: כִּבְשָׂה אַחַת קְטַנָּה
  choice: seekor anak domba betina kecil
  rationale: כִּבְשָׂה secara khusus adalah anak domba betina; 'seekor' menyatakan jumlah tunggal dan 'kecil' mempertahankan nuansa קְטַנָּה.
- source_word: אֲשֶׁר קָנָה
  choice: yang telah dibelinya
  rationale: קנה di sini paling wajar berarti membeli atau memperoleh; bentuk lampau mendahului tindakan pemeliharaan berikutnya.
- source_word: וַיְחַיֶּהָ
  choice: Ia memelihara anak domba itu
  rationale: Bentuk kausatif dari חיה dapat berarti menjaga tetap hidup atau menghidupi; 'memelihara' secara alami mencakup perawatan yang membuatnya tetap hidup tanpa menghilangkan konteks pengasuhan.
- source_word: וַתִּגְדַּל עִמּוֹ וְעִם בָּנָיו יַחְדָּו
  choice: anak domba itu tumbuh bersama dia dan anak-anaknya
  rationale: '''Tumbuh bersama'' menyampaikan kehidupan bersama dalam rumah tangga. בָּנָיו secara bentuk berarti ''anak-anak lelakinya'', tetapi dalam konteks keluarga bahasa Indonesia ''anak-anaknya'' alami dan tidak mengharuskan penyempitan yang tidak penting bagi gambaran ini.'
- source_word: מִפִּתּוֹ
  choice: dari suapannya
  rationale: פַּת dapat berarti potongan atau suapan roti/makanan; 'suapannya' mempertahankan gambaran bahwa domba itu berbagi makanan pribadi si miskin.
- source_word: מִכֹּסוֹ
  choice: dari cawannya
  rationale: Terjemahan langsung yang mempertahankan gambaran keakraban dalam berbagi minuman.
- source_word: בְחֵיקוֹ תִשְׁכָּב
  choice: berbaring di pangkuannya
  rationale: חֵיק dapat menunjuk dada, pelukan, atau pangkuan; 'di pangkuannya' alami dalam bahasa Indonesia untuk gambaran kasih sayang rumah tangga, sedangkan תִשְׁכָּב tetap diterjemahkan 'berbaring' tanpa menentukan bahwa domba itu tidur.
- source_word: וַתְּהִי לוֹ כְּבַת
  choice: Baginya, anak domba itu seperti seorang anak perempuan
  rationale: Mempertahankan perbandingan eksplisit serta daya emosional hubungan kekeluargaan.
theological_decisions:
- issue: Gambaran domestik yang memanusiakan anak domba
  choice: Mempertahankan bahasa kekeluargaan dan keakraban secara langsung
  alternative: Melunakkan gambaran sebagai sekadar hewan peliharaan
  rationale: Bahasa Ibrani sengaja meningkatkan daya emosional perumpamaan dengan menggambarkan anak domba sebagai anggota keluarga yang dikasihi.
- issue: Cakupan בָּנָיו
  choice: anak-anaknya
  alternative: anak-anak lelakinya
  rationale: Bentuk Ibrani secara formal maskulin, tetapi dalam adegan rumah tangga ini 'anak-anaknya' merupakan padanan Indonesia yang wajar. Alternatif formal dicatat dalam catatan kaki agar bukti sumber tetap transparan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan 'anak domba itu' dipertahankan demi kejelasan rujukan dan daya emosional; citra makanan, cawan, pangkuan, dan anak perempuan diterjemahkan secara konkret.
