  text: The elders of his house stood beside him to raise him up from the ground[a], but he was unwilling[b], and he would not eat bread with them.
translation:
  language: id
  text: Para tua-tua dari rumah tangganya berdiri di dekatnya untuk membuatnya bangkit dari tanah, tetapi ia tidak mau dan ia tidak makan roti bersama mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי בֵיתוֹ
  choice: para tua-tua di istananya
  rationale: Secara harfiah berarti 'para tua-tua rumahnya'. Dalam konteks Daud sebagai raja, 'istananya' secara wajar menunjuk pada lingkungan atau rumah tangga kerajaan, bukan semata-mata bangunan atau keluarga.
- source_word: וַיָּקֻמוּ ... עָלָיו
  choice: berdiri di dekatnya
  rationale: קום menyatakan tindakan berdiri atau bangkit, sedangkan עָלָיו secara harfiah dapat berarti 'di atas/dekat dia'. Dalam adegan ini, 'di dekatnya' menyampaikan posisi para pelayan tanpa menyiratkan bahwa mereka menginjak atau berada tepat di atas Daud.
- source_word: לַהֲקִימוֹ מִן הָאָרֶץ
  choice: untuk membangunkannya dari tanah
  rationale: Bentuk kausatif קום berarti membuat seseorang bangkit. 'Membangunkannya dari tanah' alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa Daud sedang terbaring atau tersungkur di tanah.
- source_word: וְלֹא אָבָה
  choice: tetapi ia tidak mau
  rationale: אָבָה menyatakan kemauan atau persetujuan. 'Tidak mau' mempertahankan nuansa ketidakbersediaan tanpa memperkuatnya menjadi penolakan keras.
- source_word: וְלֹא בָרָא אִתָּם לָחֶם
  choice: dan tidak makan bersama mereka
  rationale: Secara harfiah ungkapan ini menyebut makan roti bersama mereka, tetapi 'makan' merupakan padanan idiomatis yang alami bagi tindakan menyantap makanan secara umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Para tua-tua di istananya' dipilih agar ungkapan Ibrani 'tua-tua rumahnya' dipahami sebagai pejabat senior rumah tangga kerajaan. Susunan kalimat mempertahankan rangkaian tindakan dan ketidakmauan Daud.
