  naturalness: '"Para tua-tua dari rumah tangganya" dan "membuatnya bangkit dari tanah" adalah bahasa Indonesia modern yang jelas dan tetap cukup formal untuk narasi Alkitab. "Berdiri di dekatnya" merupakan penyesuaian kontekstual yang alami untuk עָלָיו tanpa membuat klaim posisi fisik yang berlebihan.'
