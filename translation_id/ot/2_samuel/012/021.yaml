base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/021.yaml
  text: Then his servants said to him[a], “What is this thing that you have done? While the child was alive, you fasted and wept; but when the child died, you got up and ate bread.”
translation:
  language: id
  text: Lalu para pegawainya berkata kepadanya, “Apakah yang telah Tuan lakukan ini? Ketika anak itu masih hidup, Tuan berpuasa dan menangis. Tetapi ketika anak itu mati, Tuan bangun dan makan roti[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan roti”; dalam bahasa Ibrani, ungkapan ini dapat berarti makan atau bersantap.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan urutan cerita; “lalu” menghasilkan alur naratif yang alami dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: Dalam konteks istana, עֶבֶד menunjuk para pelayan atau abdi raja. “Hamba” mempertahankan hubungan pelayanan tanpa menonjolkan status perbudakan.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר עָשִׂיתָה
  choice: Apa yang telah Tuan lakukan ini?
  rationale: Terjemahan ini mempertahankan bentuk pertanyaan dan keterkejutan para hamba, tanpa mengubahnya menjadi pertanyaan sebab seperti “mengapa.” “Tuan” memberi sapaan yang wajar kepada raja dalam bahasa Indonesia tanpa menyisipkan gelar khusus.
- source_word: בַּעֲבוּר הַיֶּלֶד חַי
  choice: Ketika anak itu masih hidup
  rationale: Dalam konteks pertentangan dengan kematian anak pada klausa berikutnya, frasa ini secara alami menyatakan keadaan waktu. “Anak” sesuai dengan konteks seorang bayi.
- source_word: צַמְתָּ וַתֵּבְךְּ
  choice: Tuan berpuasa dan menangis
  rationale: Kedua verba diterjemahkan langsung dengan padanan baku dan bermartabat.
- source_word: וְכַאֲשֶׁר מֵת הַיֶּלֶד
  choice: Tetapi ketika anak itu mati
  rationale: “Tetapi” memperjelas pertentangan retoris yang dibentuk oleh konteks, sedangkan “mati” mempertahankan sifat dinamis verba Ibrani.
- source_word: קַמְתָּ
  choice: Tuan bangun
  rationale: “Bangun” adalah padanan modern dan alami untuk tindakan beranjak dari keadaan sebelumnya; kata ini tidak memberi nuansa teologis tambahan.
- source_word: וַתֹּאכַל לָחֶם
  choice: dan makan roti
  rationale: Terjemahan mempertahankan gambaran konkret bahasa Ibrani. Catatan kaki menjelaskan bahwa frasa itu juga merupakan ungkapan umum untuk makan atau bersantap.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan “Tuan” mencerminkan hubungan para hamba dengan raja secara alami, sementara susunan pertanyaan tetap dekat dengan bentuk Ibrani. Kalimat panjang dibagi pada titik pertentangan agar mudah dipahami.
