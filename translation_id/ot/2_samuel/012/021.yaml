  to: Lalu para pegawainya berkata kepadanya, “Apakah yang telah Tuan lakukan ini? Ketika anak itu masih hidup, Tuan berpuasa dan menangis. Tetapi ketika anak itu mati, Tuan bangun dan makan roti[a].”
