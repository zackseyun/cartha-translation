base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/020.yaml
  text: Then David got up from the ground[a], washed, anointed himself, and changed his clothes. He went into the house of Yahweh and bowed down. Then he went to his house, asked, and they set bread before him, and he ate.
translation:
  language: id
  text: Kemudian Daud bangkit dari tanah, membasuh diri, mengoleskan minyak pada tubuhnya, dan berganti pakaian. Ia masuk ke rumah Yahweh dan bersujud[a]. Setelah itu, ia pergi ke rumahnya dan meminta; mereka menghidangkan roti kepadanya, lalu ia makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah.” Kata Ibrani ini dapat menunjuk pada tindakan sujud secara fisik sebagai ungkapan hormat atau penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם ... מֵהָאָרֶץ
  choice: bangkit dari tanah
  rationale: Menggambarkan tindakan Daud bangun dari tempat ia berbaring dalam perkabungan; 'tanah' sesuai dengan konteks konkret.
- source_word: וַיִּרְחַץ
  choice: membasuh diri
  rationale: רחץ dapat berarti mencuci atau mandi; 'membasuh diri' mempertahankan keluasan makna dan cocok dalam rangkaian tindakan mengakhiri perkabungan.
- source_word: וַיָּסֶךְ
  choice: mengoleskan minyak pada tubuhnya
  rationale: סוך menunjuk pada pemakaian minyak pada tubuh; terjemahan ini jelas dan tidak membangkitkan konotasi upacara pengurapan jabatan.
- source_word: וַיְחַלֵּף שִׂמְלֹתוֹ
  choice: berganti pakaian
  rationale: Ungkapan Indonesia yang alami untuk tindakan mengganti pakaian yang dikenakan.
- source_word: בֵּית יְהוָה
  choice: rumah Yahweh
  rationale: Mempertahankan ungkapan Ibrani untuk tempat ibadah serta nama ilahi יהוה sebagai Yahweh.
- source_word: וַיִּשְׁתָּחוּ
  choice: sujud
  rationale: Kata ini mempertahankan tindakan fisik membungkuk atau merebahkan diri dengan hormat tanpa menghapus makna penyembahan yang dimungkinkan konteks.
- source_word: וַיִּשְׁאַל
  choice: meminta makanan
  rationale: Teks Ibrani tidak menyebutkan objek, tetapi klausa berikutnya menunjukkan bahwa yang diminta adalah makanan; objek dinyatakan agar kalimat Indonesia tidak terasa menggantung.
- source_word: לֶחֶם
  choice: roti
  rationale: Mempertahankan arti leksikal dasar לֶחֶם, meskipun kata itu juga dapat mewakili makanan secara umum.
- source_word: וַיָּשִׂימוּ לוֹ לֶחֶם
  choice: mereka menghidangkan roti kepadanya
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan subjek jamak tak tentu.
- source_word: וַיֹּאכַל
  choice: ia makan
  rationale: Menyampaikan penutup narasi secara langsung dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Makna וַיִּשְׁתָּחוּ di rumah Yahweh
  choice: sujud
  alternative: menyembah
  rationale: '''Sujud'' mempertahankan tindakan jasmani yang dinyatakan verba Ibrani, sedangkan konteks rumah Yahweh memungkinkan tindakan itu dipahami sebagai penyembahan; alternatif dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian tindakan dibuat mengalir secara naratif; istilah 'mengoleskan minyak pada tubuhnya' dipilih untuk menghindari salah pengertian bahwa Daud sedang menerima pengurapan jabatan.
