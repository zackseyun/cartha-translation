  text: And he must repay the ewe lamb fourfold[a], because he did this thing and because he had no pity.
translation:
  language: id
  text: Ia harus membayar ganti rugi untuk anak domba betina itu empat kali lipat, karena ia telah melakukan hal ini dan karena ia tidak merasa iba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menyayangkan.” Kata kerja Ibrani ini dapat menekankan tindakan menahan diri agar tidak mencelakakan, atau tindakan yang lahir dari rasa iba.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכִּבְשָׂה
  choice: anak domba betina itu
  rationale: Nomina Ibrani כִּבְשָׂה secara khusus menunjuk kepada anak domba betina; bentuk definit mempertahankan rujukan kepada hewan dalam perumpamaan.
- source_word: יְשַׁלֵּם
  choice: harus mengganti
  rationale: Bentuk piel dari שׁלם menyatakan penggantian atau pembayaran kembali. Kata 'harus' menyampaikan daya putusan hukum dalam ucapan Daud.
- source_word: אַרְבַּעְתָּיִם
  choice: empat kali lipat
  rationale: Bentuk bilangan ini menyatakan penggantian sebesar empat kali, dan ungkapan tersebut alami dalam bahasa Indonesia modern.
- source_word: עֵקֶב אֲשֶׁר
  choice: karena
  rationale: Frasa ini memperkenalkan alasan bagi hukuman yang baru dinyatakan.
- source_word: עָשָׂה אֶת־הַדָּבָר הַזֶּה
  choice: ia telah melakukan hal ini
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tanpa mempersempit דָּבָר secara berlebihan menjadi istilah hukum tertentu.
- source_word: לֹא חָמָל
  choice: ia tidak berbelas kasihan
  rationale: חמל dapat menyatakan rasa iba yang membuat seseorang menahan diri dari mencelakakan atau tidak menyayangkan. Dalam konteks ini, 'tidak berbelas kasihan' menyampaikan sisi moral ungkapan itu secara jelas dan wajar.
