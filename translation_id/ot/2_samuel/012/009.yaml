id: 2SA.12.9
reference: 2 Samuel 12:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַדּ֜וּעַ בָּזִ֣יתָ אֶת דְּבַ֣ר יְהוָ֗ה לַ/עֲשׂ֣וֹת הָ/רַע֮ ב/עינ/ו אֵ֣ת אוּרִיָּ֤ה הַֽ/חִתִּי֙ הִכִּ֣יתָ בַ/חֶ֔רֶב וְ/אֶ֨ת אִשְׁתּ֔/וֹ לָקַ֥חְתָּ לְּ/ךָ֖ לְ/אִשָּׁ֑ה וְ/אֹת֣/וֹ הָרַ֔גְתָּ בְּ/חֶ֖רֶב בְּנֵ֥י עַמּֽוֹן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/009.yaml
  text: Why have you despised the word of Yahweh[a], to do what is evil in his sight? You struck down Uriah the Hittite with the sword, and took his wife for yourself as a wife[c][b], and killed him with the sword of the Ammonites.
translation:
  language: id
  text: Mengapa engkau meremehkan firman Yahweh[a] dengan melakukan apa yang jahat di mata-Nya? Uria, orang Het itu, kautewaskan dengan pedang; istrinya kauambil menjadi istrimu sendiri[b]; dan dia kaubunuh dengan pedang orang Amon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menghina firman Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mengambil istrinya bagimu sebagai istri”; susunan ini menekankan bahwa David mengambil istri Uria untuk dirinya sendiri.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dengan pedang anak-anak Amon,” yakni David menyebabkan Uria mati melalui pasukan Amon.'
    reason: cultural_note
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya langsung yang mempertahankan daya tuduhan retoris Natan.
- source_word: בָּזִיתָ
  choice: engkau meremehkan
  rationale: בזה menyatakan sikap memandang rendah atau menghina; 'meremehkan' alami dalam bahasa Indonesia dan tetap lebih kuat daripada sekadar 'tidak menaati'.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: Mempertahankan ungkapan Ibrani דְּבַר dan nama perjanjian יְהוָה, tanpa mempersempit maknanya hanya menjadi satu perintah tertentu.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינָיו
  choice: dengan melakukan apa yang jahat di mata-Nya
  rationale: Infinitif dipahami sebagai tindakan yang memperlihatkan penghinaan tersebut; rumusan 'jahat di mata-Nya' mempertahankan idiom penilaian ilahi.
- source_word: הִכִּיתָ בַחֶרֶב
  choice: kautewaskan dengan pedang
  rationale: נכה di sini mengacu pada tindakan yang berujung pada kematian. 'Tewaskan' mempertahankan tindakan keras sekaligus membedakannya dari הָרַגְתָ pada klausa berikut.
- source_word: לָקַחְתָּ לְּךָ לְאִשָּׁה
  choice: istrinya kauambil menjadi istrimu sendiri
  rationale: Kata 'sendiri' menyampaikan unsur לְךָ, yakni pengambilan untuk kepentingan David, sementara 'menjadi istrimu' mempertahankan לְאִשָּׁה.
- source_word: הָרַגְתָּ
  choice: kaubunuh
  rationale: Padanan langsung bagi הרג; konteks telah menyatakan kesalahan moral David sehingga tidak perlu mempersempitnya menjadi istilah hukum tertentu.
- source_word: בְּחֶרֶב בְּנֵי עַמּוֹן
  choice: dengan pedang orang Amon
  rationale: Mempertahankan metafora instrumental dan pengulangan 'pedang'; frasa itu menyatakan bahwa pasukan Amon menjadi perantara kematian Uria.
- source_word: אוּרִיָּה הַחִתִּי
  choice: Uria, orang Het itu
  rationale: Bentuk nama dan sebutan etnis yang lazim dalam bahasa Indonesia; 'itu' menandai identifikasi definit dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, bukan gelar; 'Yahweh' mempertahankan nama perjanjian itu secara langsung.
- issue: Hubungan antara penghinaan terhadap firman dan perbuatan jahat
  choice: dengan melakukan
  alternative: untuk melakukan
  rationale: לַעֲשׂוֹת dapat dibaca sebagai tujuan atau akibat/penjelasan. Dalam tuduhan ini, 'dengan melakukan' secara alami menyatakan bahwa perbuatan David merupakan wujud penghinaan, tanpa meniadakan kaitan erat yang ada dalam bahasa Ibrani.
- issue: Tanggung jawab David atas kematian Uria melalui orang Amon
  choice: dia kaubunuh dengan pedang orang Amon
  alternative: dia dibunuh oleh pedang orang Amon
  rationale: Subjek gramatikal tetap David. Terjemahan ini mempertahankan penegasan teologis-moral bahwa penggunaan perantara asing tidak menghapus tanggung jawabnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran kenabian yang lugas dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan langsung yang serius; bentuk terikat 'kautewaskan', 'kauambil', dan 'kaubunuh' menjaga ritme tuduhan. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskan.
