  yaml_path: translation/ot/2_samuel/012/016.yaml
  text: And David sought God on behalf of the boy[b][a]. David fasted a fast, and he went in and spent the night and lay on the ground.
translation:
  language: id
  text: Lalu Daud mencari Allah bagi anak itu.[a] Daud menjalankan puasa,[b] lalu masuk, bermalam, dan berbaring di tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “mencari Allah” mengandung arti mencari pertolongan-Nya dengan sungguh-sungguh; dapat juga diterjemahkan “memohon kepada Allah bagi anak itu.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, bahasa Ibrani memakai kata kerja dan kata benda seakar: “berpuasa suatu puasa,” suatu ungkapan yang menegaskan tindakan berpuasa.'
    reason: source_form
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: mencari
  rationale: Kata בקש menyatakan tindakan mencari dengan sungguh-sungguh dan, dalam konteks ini, mengandung nuansa permohonan kepada Allah. “Mencari” mempertahankan ungkapan Ibrani tanpa mempersempitnya menjadi “memohon” saja.
- source_word: אֶת־הָאֱלֹהִים
  choice: Allah
  rationale: הָאֱלֹהִים adalah objek langsung tindakan Daud; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: בְּעַד
  choice: demi
  rationale: Preposisi בְּעַד di sini menyatakan tindakan bagi kepentingan orang lain. “Demi” menyampaikan maksud perantaraan itu secara ringkas dan alami.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: Dalam konteks ini נַעַר menunjuk kepada putra Daud yang masih kecil dan sedang sakit. “Anak itu” alami dalam bahasa Indonesia serta tidak memberi kesan usia yang lebih tua seperti “pemuda”.
- source_word: וַיָּצָם ... צוֹם
  choice: menjalankan puasa
  rationale: Bahasa Ibrani memakai verba dan nomina seakar, secara harfiah “berpuasa suatu puasa.” “Menjalankan puasa” mempertahankan unsur verbal dan nominal secara lebih alami daripada bentuk harfiah yang janggal dalam bahasa Indonesia.
- source_word: וּבָא
  choice: masuk
  rationale: בוא dalam rangkaian narasi ini berarti datang atau masuk. Konteks mengarah pada gerakan memasuki suatu tempat, meskipun tempatnya tidak disebutkan.
- source_word: וְלָן
  choice: bermalam
  rationale: לון berarti melewatkan malam atau tinggal semalam. “Bermalam” adalah padanan modern yang ringkas dan tepat.
- source_word: וְשָׁכַב אָרְצָה
  choice: berbaring di tanah
  rationale: שכב menyatakan berbaring, sedangkan ארצה mengarah ke tanah. Terjemahan ini mempertahankan postur Daud tanpa mengganti “tanah” dengan “lantai,” yang tidak disebutkan dalam teks.
theological_decisions:
- issue: Sifat tindakan Daud terhadap Allah
  choice: mencari Allah
  alternative: memohon kepada Allah
  rationale: Konteks jelas mengandung permohonan bagi anaknya, tetapi verba בקש sendiri lebih luas. Terjemahan mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan nuansa kontekstualnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Anak itu” dipilih daripada “anak laki-laki itu” karena konteks sudah mengidentifikasi anak Daud dan bahasa Indonesia tidak wajib menandai gender pada nomina ini. Rangkaian verba dipertahankan tanpa menyimpulkan secara eksplisit bahwa Daud berbaring sepanjang malam.
