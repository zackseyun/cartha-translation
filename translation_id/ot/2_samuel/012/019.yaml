base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/019.yaml
  text: When David saw that his servants were whispering[a], David understood that the child was dead. So David said to his servants, “Is the child dead?” And they said, “He is dead.”
translation:
  language: id
  text: Ketika Daud melihat bahwa para pelayannya sedang berbisik-bisik, ia mengerti bahwa anak itu sudah mati. Lalu Daud bertanya kepada para pelayannya, “Apakah anak itu sudah mati?” Mereka menjawab, “Sudah mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Makna umum ראה di sini adalah melihat keadaan yang kemudian menimbulkan kesadaran; “melihat” langsung dan wajar dalam narasi Indonesia.
- source_word: עֲבָדָיו
  choice: para pelayannya
  rationale: Dalam konteks istana, עֶבֶד menunjuk kepada orang-orang yang melayani raja; “pelayan” lebih tepat secara kontekstual daripada istilah yang menekankan status perbudakan.
- source_word: מִתְלַחֲשִׁים
  choice: sedang berbisik-bisik
  rationale: Bentuk partisipel hitpael dari לחש menggambarkan percakapan lirih di antara mereka; bentuk ulang “berbisik-bisik” menyampaikan tindakan timbal balik itu secara alami.
- source_word: וַיָּבֶן
  choice: mengerti
  rationale: בין menyatakan bahwa Daud menarik kesimpulan dari perilaku para pelayannya; “mengerti” jelas, alami, dan tidak menambahkan kepastian di luar teks.
- source_word: הַיָּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki; konteksnya adalah putra Daud yang masih sangat kecil, sehingga “anak itu” paling wajar dan tepat.
- source_word: מֵת
  choice: sudah mati
  rationale: מֵת menyatakan keadaan mati. Dalam bahasa Indonesia, “sudah mati” secara alami menunjukkan bahwa kematian telah terjadi dan sesuai baik dalam laporan maupun pertanyaan.
- source_word: הֲמֵת הַיֶּלֶד
  choice: Apakah anak itu sudah mati?
  rationale: Partikel tanya הֲ dan predikat מֵת menanyakan apakah anak itu berada dalam keadaan mati; terjemahan ini mempertahankan bentuk pertanyaannya dengan wajar.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: bertanya ... menjawab
  rationale: Secara leksikal אמר berarti “berkata”, tetapi fungsi ujaran dalam konteks ini jelas berupa pertanyaan dan jawaban; padanan ini lebih alami dalam bahasa Indonesia tanpa mengubah isi.
