base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/028.yaml
  text: Now gather the rest of the troops[a], camp against the city, and capture it, lest I capture the city and it be called by my name.
translation:
  language: id
  text: “Sekarang, kumpulkanlah sisa pasukan, berkemahlah di sekitar kota itu, dan rebutlah kota itu. Jangan sampai aku sendiri merebut kota itu, lalu namaku dikaitkan dengan kota itu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani menyatakan, “namaku disebut atasnya.” Ungkapan ini menunjukkan bahwa nama, kehormatan, atau pengakuan atas penaklukan kota itu akan dikaitkan dengan Yoab.
    reason: Menjelaskan idiom Ibrani tanpa membatasi maknanya pada penamaan resmi kota menurut Yoab.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini memperkenalkan tindakan berikutnya yang mendesak; ‘Sekarang’ alami dalam bahasa Indonesia modern.
- source_word: אֱסֹף
  choice: kumpulkanlah
  rationale: Bentuk perintah dari אסף berarti mengumpulkan; akhiran ‘-lah’ menyampaikan perintah secara wajar dan bermartabat.
- source_word: יֶתֶר הָעָם
  choice: sisa pasukan
  rationale: Dalam konteks pengepungan, עָם menunjuk pada kekuatan tempur yang masih bersama Daud, bukan rakyat secara umum.
- source_word: וַחֲנֵה עַל הָעִיר
  choice: berkemahlah mengepung kota itu
  rationale: חנה berarti berkemah, sedangkan עַל dalam konteks militer menunjukkan sikap bermusuhan terhadap kota. Ungkapan ini mempertahankan unsur berkemah sekaligus membuat konteks pengepungan jelas.
- source_word: וְלָכְדָהּ
  choice: dan rebutlah kota itu
  rationale: לכד lazim berarti merebut atau menangkap dalam peperangan; ‘merebut kota’ merupakan ungkapan Indonesia yang tepat.
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Menyampaikan peringatan atau hasil yang hendak dihindari secara alami dalam bahasa Indonesia modern.
- source_word: אֶלְכֹּד אֲנִי
  choice: aku sendiri yang merebutnya
  rationale: Pronomina eksplisit אֲנִי memberi penekanan pada pelaku; ‘aku sendiri yang’ mempertahankan penekanan tersebut.
- source_word: וְנִקְרָא שְׁמִי עָלֶיהָ
  choice: lalu namaku diserukan atas kota itu
  rationale: Pilihan ini mempertahankan citra idiom Ibrani bahwa nama seseorang ‘diserukan atas’ kota, tanpa mempersempit maknanya hanya menjadi penamaan kota. Catatan kaki menjelaskan implikasi pengakuan atau kehormatan atas penaklukan.
