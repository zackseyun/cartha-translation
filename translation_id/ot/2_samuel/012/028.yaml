translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk perintah memakai ‘-lah’. Sapaan ‘aku’ dipertahankan sesuai tuturan langsung Yoab kepada Daud. Idiom pada klausa terakhir sengaja diterjemahkan cukup dekat dengan teks sumber dan dijelaskan melalui catatan kaki.
