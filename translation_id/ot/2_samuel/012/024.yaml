  text: וַ/יְנַחֵ֣ם דָּוִ֗ד אֵ֚ת בַּת שֶׁ֣בַע אִשְׁתּ֔/וֹ וַ/יָּבֹ֥א אֵלֶ֖י/הָ וַ/יִּשְׁכַּ֣ב עִמָּ֑/הּ וַ/תֵּ֣לֶד בֵּ֗ן ו/יקרא אֶת שְׁמ/וֹ֙ שְׁלֹמֹ֔ה וַ/יהוָ֖ה אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/024.yaml
  text: Then David comforted Bathsheba his wife[a], and he went in to her and lay with her. She bore a son, and he named him Solomon[b]. And Yahweh loved him.
translation:
  language: id
  text: Kemudian Daud menghibur Batsyeba, istrinya. Daud mendatangi dia dan tidur dengannya.[a] Batsyeba melahirkan seorang anak laki-laki, dan Daud menamainya Salomo. Yahweh mengasihi anak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mendatangi dia dan tidur dengannya” berarti bahwa Daud melakukan hubungan seksual dengan Batsyeba.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְנַחֵם
  choice: menghibur
  rationale: Bentuk piel dari נחם di sini menyatakan tindakan memberi penghiburan setelah kedukaan akibat kematian anak mereka. “Menghibur” alami dalam bahasa Indonesia dan tidak menambahkan tafsiran yang tidak dinyatakan teks.
- source_word: בַּת שֶׁבַע אִשְׁתּוֹ
  choice: Batsyeba, istrinya
  rationale: Nama pribadi disesuaikan dengan bentuk Indonesia yang lazim, dan keterangan eksplisit bahwa Batsyeba adalah istri Daud dipertahankan.
- source_word: וַיָּבֹא אֵלֶיהָ וַיִּשְׁכַּב עִמָּהּ
  choice: Daud menghampirinya lalu tidur dengannya
  rationale: Ungkapan ini merujuk pada hubungan seksual. Terjemahan mempertahankan ungkapan naratif yang halus dan bermartabat, sedangkan catatan kaki menjelaskan maksudnya.
- source_word: וַתֵּלֶד בֵּן
  choice: Batsyeba melahirkan seorang anak laki-laki
  rationale: “Melahirkan seorang anak laki-laki” merupakan padanan Indonesia yang alami dan jelas. Nama Batsyeba diulangi untuk menghindari ketidakjelasan akibat rangkaian pronomina.
- source_word: וַיִּקְרָא אֶת שְׁמוֹ שְׁלֹמֹה
  choice: Daud menamainya Salomo
  rationale: Bentuk verba tunggal maskulin menunjuk kepada Daud sebagai pemberi nama. “Menamainya” adalah padanan alami bagi idiom Ibrani yang secara harfiah berarti “memanggil namanya”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֲהֵבוֹ
  choice: mengasihi anak itu
  rationale: אהב berarti mengasihi atau mencintai. “Mengasihi” sesuai dengan ragam naratif Alkitab yang modern dan bermartabat; “anak itu” memperjelas acuan sufiks maskulin kepada bayi yang baru lahir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama ilahi dan membedakannya dari gelar.
- issue: Subjek yang memberi nama kepada Salomo
  choice: Daud
  alternative: Membiarkan subjek tersirat sebagai “ia”
  rationale: Verba Ibrani berbentuk tunggal maskulin, sehingga bukan Batsyeba—subjek feminin pada klausa sebelumnya—yang dimaksud secara gramatikal. Penyebutan “Daud” membuat informasi gramatikal itu jelas dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi agar rangkaian tindakan mudah dipahami. Nama “Batsyeba” dan “Salomo” mengikuti bentuk yang lazim dalam tradisi bahasa Indonesia, sementara ungkapan seksual diterjemahkan secara halus dan dijelaskan dalam catatan kaki.
