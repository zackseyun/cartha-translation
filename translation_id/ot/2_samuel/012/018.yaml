  terminology: “Anak itu,” “para pelayan Daud,” dan “meninggal” sesuai konteks. Istilah untuk tindakan yang dikhawatirkan perlu tetap terbuka, tanpa memutuskan bahwa Daud akan berbuat jahat, bereaksi secara emosional, atau mencelakai dirinya sendiri.
