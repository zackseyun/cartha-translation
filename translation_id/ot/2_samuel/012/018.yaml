base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/018.yaml
  text: And on the seventh day the child died. And David’s servants were afraid to tell him that the child was dead[a], for they said, “Behold, while the child was still alive, we spoke to him, and he did not listen to our voice. How then can we say to him, ‘The child is dead’? He may do harm.”
translation:
  language: id
  text: Pada hari ketujuh, anak itu meninggal. Para pelayan Daud takut memberi tahu dia bahwa anak itu sudah meninggal, sebab mereka berkata, “Lihatlah, ketika anak itu masih hidup, kita berbicara kepadanya, tetapi dia tidak mendengarkan kita. Bagaimana kita dapat mengatakan kepadanya, ‘Anak itu sudah meninggal’? Ia mungkin melakukan tindakan yang membahayakan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini singkat dan tidak menyebutkan tindakan apa yang mereka takutkan. Dapat juga diterjemahkan, “ia mungkin berbuat jahat,” “ia mungkin bereaksi buruk,” atau mungkin, “ia mungkin mencelakai dirinya sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Menyampaikan peralihan waktu dalam rangkaian narasi secara alami tanpa ungkapan kaku seperti 'terjadilah'.
- source_word: וַיָּמָת הַיָּלֶד
  choice: anak itu meninggal
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki; 'anak' paling sesuai dengan konteks bayi dalam kisah ini.
- source_word: וַיִּרְאוּ עַבְדֵי דָוִד
  choice: Para pelayan Daud takut
  rationale: ירא di sini menyatakan rasa takut atau cemas, bukan rasa hormat.
- source_word: לְהַגִּיד לוֹ כִּי מֵת הַיֶּלֶד
  choice: memberi tahu dia bahwa anak itu sudah meninggal
  rationale: Mengungkapkan isi berita secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הִנֵּה בִהְיוֹת הַיֶּלֶד חַי
  choice: Ketika anak itu masih hidup
  rationale: הִנֵּה berfungsi menyoroti keadaan yang menjadi dasar pertimbangan mereka; dalam dialog Indonesia, penekanan itu cukup terwakili oleh susunan kalimat tanpa padanan harfiah yang kaku.
- source_word: דִּבַּרְנוּ אֵלָיו וְלֹא שָׁמַע בְּקוֹלֵנוּ
  choice: kita sudah berbicara kepadanya, tetapi dia tidak mendengarkan kita
  rationale: Padanan ini mempertahankan tindakan berbicara dan kegagalan Daud untuk mengindahkan mereka, dengan ungkapan yang alami.
- source_word: וְאֵיךְ נֹאמַר אֵלָיו
  choice: Bagaimana kita dapat mengatakan kepadanya
  rationale: Mempertahankan bentuk pertanyaan retoris yang menyatakan kecemasan para pelayan.
- source_word: וְעָשָׂה רָעָה
  choice: Jangan-jangan dia berbuat sesuatu yang buruk
  rationale: Mengungkapkan kekhawatiran mengenai tindakan buruk atau berbahaya tanpa menentukan bentuk maupun sasaran tindakan itu.
theological_decisions:
- issue: Makna tindakan dalam וְעָשָׂה רָעָה
  choice: Tindakan buruk atau berbahaya yang tidak ditentukan
  alternative: Daud akan mencelakai dirinya sendiri; Daud akan berbuat jahat; Daud akan bereaksi buruk
  rationale: Teks Ibrani tidak menyebut objek atau bentuk tindakan yang dikhawatirkan. Terjemahan utama dan catatan kaki mempertahankan keterbukaan ini tanpa memasukkan diagnosis psikologis atau penilaian moral yang lebih khusus daripada sumbernya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti 'kita' dipakai dalam ucapan para pelayan karena mencakup sesama pembicara, sedangkan 'dia' menjaga tuturan tetap alami dan mudah dipahami.
