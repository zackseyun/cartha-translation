base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/007.yaml
  text: 'Then Nathan said to David[a], “You are the man! Thus says Yahweh, the God of Israel: I anointed you king over Israel, and I delivered you from the hand of Saul.”'
translation:
  language: id
  text: 'Lalu Natan berkata kepada Daud, “Engkaulah orang itu![a] Beginilah firman Yahweh, Allah Israel: Akulah yang mengurapi engkau menjadi raja atas Israel, dan Akulah yang melepaskan engkau dari tangan Saul.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Engkaulah orangnya!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אַתָּה הָאִישׁ
  choice: Engkaulah orang itu!
  rationale: Klausa tanpa verba ini sangat tegas dan menjadi puncak perumpamaan Natan. Partikel “-lah” mempertahankan penekanan pada אַתָּה, sedangkan “orang itu” secara alami menunjuk kepada tokoh dalam perumpamaan; catatan kaki menyimpan bentuk harfiah dengan artikel definit.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ini adalah rumusan baku seorang utusan kenabian. “Beginilah firman” mempertahankan ragam resmi dan khidmat serta cocok ketika diikuti nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini diterjemahkan secara ringkas dan wajar sebagai gelar relasional, tanpa menambahkan unsur yang tidak ada dalam bahasa Ibrani.
- source_word: אָנֹכִי ... וְאָנֹכִי
  choice: Akulah ... dan Akulah
  rationale: Pengulangan pronomina mandiri bersifat menegaskan. Pengulangan “Akulah” mempertahankan tekanan bahwa Yahweh sendiri melakukan kedua tindakan itu.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  choice: mengurapi engkau menjadi raja
  rationale: משׁח dalam konteks kerajaan berarti mengurapi untuk jabatan, dan לְמֶלֶךְ menyatakan hasil atau kedudukan pengangkatan tersebut.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: עַל bersama jabatan raja menyatakan lingkup pemerintahan atau wewenang.
- source_word: הִצַּלְתִּיךָ
  choice: melepaskan engkau
  rationale: Bentuk kausatif נצל di sini berarti membebaskan atau menyelamatkan dari ancaman dan kekuasaan musuh. “Melepaskan” cocok dengan idiom berikutnya tanpa memberi nuansa soteriologis yang tidak diperlukan.
- source_word: מִיַּד שָׁאוּל
  choice: dari tangan Saul
  rationale: Ungkapan “dari tangan” mempertahankan metafora Ibrani tentang kuasa atau kendali dan tetap jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi secara langsung dan tidak menggantinya dengan gelar.
- issue: Penekanan tindakan ilahi dalam אָנֹכִי ... וְאָנֹכִי
  choice: Akulah ... dan Akulah
  alternative: Aku ... dan Aku
  rationale: Pronomina mandiri yang diulang memberi penekanan retoris pada tindakan Yahweh; bentuk “Akulah” menyampaikan tekanan itu tanpa menambah pelaku atau gagasan baru.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan ragam kenabian resmi. “Engkau” dipakai karena konteks teguran langsung yang khidmat; susunan kalimat mempertahankan daya tuding, pengulangan penegas, dan metafora utama teks Ibrani.
