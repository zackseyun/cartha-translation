  text: And Joab fought against Rabbah of the Ammonites and captured the royal city[a].
translation:
  language: id
  text: Yoab berperang melawan Raba bani Amon dan merebut kota kerajaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kota ibu kota.” Secara harfiah, bahasa Ibrani berbunyi “kota kerajaan” atau “kota pemerintahan kerajaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֶם
  choice: berperang melawan
  rationale: Bentuk Nifal dari לחם menyatakan keterlibatan dalam pertempuran; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arah permusuhannya.
- source_word: רַבַּת בְּנֵי עַמּוֹן
  choice: Raba, kota orang Amon
  rationale: Raba adalah nama tempat, sedangkan בְּנֵי עַמּוֹן merupakan sebutan etnis-geopolitis. Penambahan aposisi 'kota' memperjelas hubungan yang dalam bahasa Ibrani dapat dinyatakan secara ringkas, tanpa mengubah acuannya.
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: לכד dalam konteks militer berarti menangkap, menguasai, atau merebut. 'Merebut' paling wajar untuk sebuah kota yang dikuasai melalui peperangan.
- source_word: עִיר הַמְּלוּכָה
  choice: kota kerajaan
  rationale: Frasa ini secara harfiah berarti 'kota kerajaan/kekuasaan raja'. 'Kota kerajaan' mempertahankan bentuk dan ambiguitas Ibrani lebih baik daripada penafsiran yang lebih spesifik seperti 'ibu kota'.
