  source_fidelity: 'Teks dengan tepat mengikuti urutan dan isi Ibrani: Daud mengumpulkan כָּל־הָעָם, pergi ke Raba, berperang melawannya, dan merebutnya. “Seluruh rakyat” mempertahankan cakupan leksikal עָם tanpa mempersempitnya menjadi istilah militer dalam teks utama; catatan kaki dengan tepat menyatakan alternatif kontekstual “seluruh pasukan.”'
