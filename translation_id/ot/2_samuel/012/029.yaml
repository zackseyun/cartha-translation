  text: וַ/יֶּאֱסֹ֥ף דָּוִ֛ד אֶת כָּל הָ/עָ֖ם וַ/יֵּ֣לֶךְ רַבָּ֑תָ/ה וַ/יִּלָּ֥חֶם בָּ֖/הּ וַֽ/יִּלְכְּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/029.yaml
  text: Then David gathered all the people and went to Rabbah and fought against it and captured it[a].
translation:
  language: id
  text: Kemudian Daud mengumpulkan seluruh rakyat[a], lalu pergi ke Raba. Ia berperang melawan kota itu dan merebutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh pasukan”; secara harfiah, “seluruh rakyat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Kata kerja אסף berarti membawa orang-orang bersama. 'Mengumpulkan' mempertahankan makna dasarnya tanpa mempersempitnya menjadi pengerahan militer formal.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Secara harfiah frasa ini berarti 'seluruh rakyat'. Dalam konteks perang, yang dimaksud kemungkinan ialah pasukan yang menyertai Daud, tetapi teks Ibrani memakai עָם, bukan istilah militer yang lebih khusus.
- source_word: רַבָּתָה
  choice: ke Raba
  rationale: Nama tempat רַבָּה disertai akhiran penunjuk arah, sehingga 'ke Raba' menyampaikan gerak menuju kota tersebut. Bentuk 'Raba' mengikuti transliterasi Indonesia yang wajar.
- source_word: וַיִּלָּחֶם בָּהּ
  choice: berperang melawan kota itu
  rationale: Kata kerja לחם dengan ב menyatakan tindakan berperang melawan sasaran. 'Kota itu' menjelaskan rujukan sufiks feminin kepada Raba secara alami dalam bahasa Indonesia.
- source_word: וַיִּלְכְּדָהּ
  choice: merebutnya
  rationale: Dalam konteks peperangan terhadap sebuah kota, לכד berarti menangkap, menguasai, atau merebut. 'Merebutnya' merupakan ungkapan Indonesia yang alami dan tepat.
