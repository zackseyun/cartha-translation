  text: וָ/אֶתְּנָ֨/ה לְ/ךָ֜ אֶת בֵּ֣ית אֲדֹנֶ֗י/ךָ וְ/אֶת נְשֵׁ֤י אֲדֹנֶ֨י/ךָ֙ בְּ/חֵיקֶ֔/ךָ וָ/אֶתְּנָ֣/ה לְ/ךָ֔ אֶת בֵּ֥ית יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וְ/אִ֨ם מְעָ֔ט וְ/אֹסִ֥פָה לְּ/ךָ֖ כָּ/הֵ֥נָּה וְ/כָ/הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/012/008.yaml
  text: And I gave you your master's house and your master's wives into your bosom[a], and I gave you the house of Israel and Judah; and if that had been too little[b], I would have added to you such and such things.
translation:
  language: id
  text: Aku telah memberikan kepadamu seisi rumah tuanmu dan istri-istri tuanmu ke dalam pangkuanmu.[a] Aku juga telah memberikan kepadamu kaum Israel dan Yehuda. Seandainya semua itu masih terlalu sedikit, Aku tentu akan menambahkan bagimu hal-hal seperti ini dan seperti itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam dadamu” atau “ke dalam pangkuanmu.” Ungkapan Ibrani ini menyiratkan penerimaan atau kepemilikan yang intim.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini dapat juga dipahami, “hal-hal seperti ini dan seperti itu”; maksudnya, tambahan lebih banyak dari jenis yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Aku telah memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan pemberian yang telah dilakukan dalam rangkaian penuturan. Bentuk ini juga menegaskan pemberian-pemberian sebelumnya kepada Daud.
- source_word: בֵּית אֲדֹנֶיךָ
  choice: seisi rumah tuanmu
  rationale: בַּיִת dapat menunjuk rumah, seisi rumah, rumah tangga, atau lingkungan dinasti. 'Seisi rumah' terdengar alami dalam bahasa Indonesia dan tetap mempertahankan cakupan luas rumah kerajaan Saul tanpa membatasinya hanya pada bangunan.
- source_word: נְשֵׁי אֲדֹנֶיךָ
  choice: istri-istri tuanmu
  rationale: Terjemahan langsung dari frasa konstruksi tersebut. 'Tuanmu' membedakan אֲדֹנֶיךָ yang merujuk kepada Saul dari gelar ilahi.
- source_word: בְּחֵיקֶךָ
  choice: ke dalam pelukanmu
  rationale: חֵיק secara harfiah berarti dada atau pangkuan dan dalam konteks ini mengungkapkan penerimaan atau kepemilikan yang intim. 'Ke dalam pelukanmu' mempertahankan metafora itu dengan ungkapan Indonesia yang wajar.
- source_word: בֵּית יִשְׂרָאֵל וִיהוּדָה
  choice: kaum Israel dan Yehuda
  rationale: בֵּית di sini menunjuk komunitas atau ranah pemerintahan Israel dan Yehuda. 'Kaum' menyampaikan makna kolektif tersebut secara alami tanpa mempersempitnya menjadi kerajaan semata.
- source_word: וְאִם מְעָט
  choice: Seandainya semua itu masih terlalu sedikit
  rationale: Ungkapan bersyarat ini menyatakan kemungkinan bahwa segala pemberian tadi dianggap tidak mencukupi. 'Seandainya' dan 'masih terlalu sedikit' menyampaikan daya hipotetisnya secara idiomatis.
- source_word: וְאֹסִפָה לְּךָ
  choice: Aku tentu akan menambahkan bagimu
  rationale: Bentuk dari יסף berarti menambah. 'Tentu akan' menyampaikan akibat dalam pernyataan bersyarat, sedangkan 'bagimu' mempertahankan penerima tindakan.
- source_word: כָּהֵנָּה וְכָהֵנָּה
  choice: hal-hal seperti itu, bahkan lebih banyak lagi
  rationale: Pasangan demonstratif ini merupakan ungkapan idiomatis bagi tambahan sejenis dalam jumlah lebih besar. Terjemahan mempertahankan ketidakpastian mengenai benda-benda yang dimaksud sambil menyampaikan unsur penambahan.
theological_decisions:
- issue: Apakah pemberian istri-istri Saul harus diterjemahkan sebagai persetujuan ilahi atas hubungan perkawinan tertentu
  choice: Teks menyatakan bahwa istri-istri tuan Daud diberikan 'ke dalam pelukanmu' tanpa menjelaskan sifat setiap hubungan atau menambahkan penilaian moral.
  alternative: Menafsirkan secara khusus sebagai 'harem tuanmu' atau melunakkannya menjadi 'perempuan-perempuan dalam keluarga tuanmu dipercayakan kepadamu'.
  rationale: Bahasa Ibrani menyatakan pemindahan yang berkaitan dengan suksesi dan kepemilikan kerajaan, tetapi tidak menguraikan status setiap perempuan. Terjemahan mempertahankan ketegangan dalam pernyataan itu tanpa mengesahkan atau menyangkal implikasi teologis yang tidak dijelaskan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-profetis yang lugas dan bermartabat. Pengulangan 'memberikan kepadamu' dipertahankan untuk mencerminkan tekanan retoris teks Ibrani, sementara 'Aku juga' membuat hubungan antarklausa alami. Huruf kapital pada 'Aku' mengikuti rujukan kepada Allah.
