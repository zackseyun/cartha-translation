base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/019.yaml
  text: I am one of the peaceable and faithful in Israel. You are seeking to destroy a city[a], and a mother in Israel. Why would you swallow up the inheritance of Yahweh?
translation:
  language: id
  text: Aku termasuk orang-orang yang hidup damai dan setia di Israel. Engkau berusaha membinasakan sebuah kota dan seorang ibu di Israel.[a] Mengapa engkau hendak menelan habis warisan Yahweh?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah kota yang menjadi ibu di Israel,” yang mungkin menunjuk kepada kota penting atau kota yang menaungi di Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֻמֵי אֱמוּנֵי יִשְׂרָאֵל
  choice: orang-orang yang hidup damai dan setia di Israel
  rationale: Bentuk-bentuk jamak tersebut menunjuk pada suatu kelompok yang bercirikan kedamaian dan kesetiaan. Ungkapan ini alami dalam bahasa Indonesia, sementara kata “termasuk” menyampaikan bahwa penutur mengidentifikasikan dirinya sebagai salah seorang dari kelompok itu.
- source_word: מְבַקֵּשׁ לְהָמִית
  choice: berusaha membinasakan
  rationale: Secara harfiah berarti berusaha atau bermaksud menyebabkan kematian. Karena objeknya adalah kota, “membinasakan” lebih wajar daripada “membunuh” dan tetap menyampaikan ancaman penghancuran yang mematikan.
- source_word: עִיר וְאֵם בְּיִשְׂרָאֵל
  choice: sebuah kota, bahkan sebuah kota yang menjadi ibu di Israel
  rationale: Hubungan antara “kota” dan “ibu” kemungkinan bersifat penjelas atau aposisional. “Bahkan” membuat hubungan itu dapat dipahami dalam bahasa Indonesia tanpa menghilangkan metafora ibu; susunan yang lebih harfiah dicatat dalam catatan kaki.
- source_word: תְבַלַּע
  choice: menelan habis
  rationale: Mempertahankan citra konkret kata kerja בלע, yang dalam konteks pengepungan menggambarkan pemusnahan total.
- source_word: נַחֲלַת יְהוָה
  choice: milik pusaka Yahweh
  rationale: “Milik pusaka” menyampaikan sesuatu yang menjadi bagian atau kepunyaan khusus Yahweh dan mempertahankan nuansa perjanjian dari נַחֲלָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, selaras dengan lapisan konsultasi proyek dan membedakannya dari gelar umum “Tuhan”.
theological_decisions:
- issue: Metafora “ibu di Israel”
  choice: Mempertahankan metafora dan memahami frasa itu secara aposisional sebagai kota yang menjadi ibu di Israel.
  alternative: 'Menerjemahkan secara koordinatif: “sebuah kota dan seorang ibu di Israel.”'
  rationale: Bahasa Ibrani memungkinkan ketegangan sintaksis, tetapi konteks paling mungkin menggambarkan kota itu sendiri sebagai “ibu”, yakni kota penting atau kota yang menaungi. Catatan kaki mempertahankan alternatif bentuk yang lebih harfiah.
- issue: Israel sebagai milik pusaka Yahweh
  choice: Mempertahankan ungkapan kepunyaan “milik pusaka Yahweh”.
  alternative: Menggeneralisasikannya menjadi “umat Yahweh” atau “negeri Yahweh”.
  rationale: Ungkapan sumber sengaja memakai bahasa warisan atau pusaka dan mengandung klaim bahwa Israel adalah kepunyaan khusus Yahweh; makna itu tidak boleh dipersempit hanya menjadi umat atau wilayah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “aku/engkau” mempertahankan ketegangan dialog langsung. Metafora “menelan habis” dan “ibu di Israel” dipertahankan, sedangkan sintaksis Ibrani yang padat dibuat lebih alami tanpa menghapus kemungkinan penafsirannya.
