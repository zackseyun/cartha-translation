  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Struktur daftar pejabat dipertahankan, sedangkan kopula yang tersirat dalam bahasa Ibrani dinyatakan secara alami dalam klausa kedua. Istilah jabatan dibuat mudah dipahami oleh pembaca modern.
