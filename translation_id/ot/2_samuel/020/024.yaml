base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/024.yaml
  text: Adoram was over the forced labor[a], and Jehoshaphat the son of Ahilud was the recorder.
translation:
  language: id
  text: Adoram mengepalai kerja wajib[a], dan Yosafat anak Ahilud adalah panitera kerajaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengerahan tenaga kerja”; istilah Ibraninya menunjuk pada tenaga kerja wajib bagi negara, bukan pajak biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹרָם
  choice: Adoram
  rationale: Nama pribadi ditransliterasikan secara langsung dan selaras dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: עַל
  choice: mengepalai
  rationale: Dalam konteks administrasi kerajaan, kata ini menunjukkan kewenangan atau pengawasan atas suatu bidang; 'mengepalai' menyampaikan fungsi jabatan itu secara alami dan ringkas.
- source_word: הַמַּס
  choice: kerja wajib
  rationale: Dalam konteks kerajaan, מַס menunjuk pada pengerahan tenaga kerja yang diwajibkan negara, bukan sekadar pajak uang. 'Kerja wajib' jelas bagi pembaca modern dan tidak mengharuskan istilah teknis asing.
- source_word: יְהוֹשָׁפָט
  choice: Yosafat
  rationale: Menggunakan bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן אֲחִילוּד
  choice: anak Ahilud
  rationale: Menerjemahkan konstruksi patronimik Ibrani secara langsung dan alami dalam bahasa Indonesia.
- source_word: הַמַּזְכִּיר
  choice: panitera kerajaan
  rationale: Gelar ini menunjuk kepada pejabat istana yang menangani catatan dan memorandum negara. 'Panitera kerajaan' lebih tepat daripada 'penulis sejarah' dan memperjelas konteks istana tanpa menyamakannya begitu saja dengan sekretaris biasa.
