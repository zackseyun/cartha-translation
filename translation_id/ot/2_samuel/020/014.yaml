source:
  edition: WLC
  text: וַֽ/יַּעֲבֹ֞ר בְּ/כָל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל אָבֵ֛לָ/ה וּ/בֵ֥ית מַעֲכָ֖ה וְ/כָל הַ/בֵּרִ֑ים ו/יקלהו וַ/יָּבֹ֖אוּ אַף אַחֲרָֽי/ו־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/014.yaml
  text: He passed through all the tribes of Israel to Abel and Beth-maacah[b][a], and all the Berites assembled and also followed after him.
translation:
  language: id
  text: Ia melewati seluruh wilayah suku-suku Israel sampai ke Abel dan Bet-Maakha. Semua orang Beri[a] berkumpul dan turut mengikuti dia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “semua orang Beri.” Sejumlah terjemahan memakai “semua orang Bikhri” dan menghubungkan kelompok ini dengan Syeba anak Bikhri berdasarkan konteks. Namun, Teks Masoret di sini lebih langsung menunjang bacaan “orang Beri.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “dan mereka pun datang sesudah dia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: Ia melewati
  rationale: Bentuk naratif dari עבר menyatakan gerakan melintasi suatu wilayah; 'melewati' menyampaikan tindakan bergerak melalui daerah-daerah suku Israel.
- source_word: בְּכָל שִׁבְטֵי יִשְׂרָאֵל
  choice: seluruh wilayah suku-suku Israel
  rationale: Preposisi ב bersifat lokatif-distributif dalam konteks ini. Penambahan 'wilayah' memperjelas bahwa yang dilintasi ialah daerah suku-suku tersebut, bukan orang-orangnya.
- source_word: אָבֵלָה
  choice: sampai ke Abel
  rationale: Akhiran ה direktif menunjukkan arah menuju Abel; 'sampai ke' menyatakannya secara alami dalam bahasa Indonesia.
- source_word: וּבֵית מַעֲכָה
  choice: dan Bet-Maakha
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan dan tidak diterjemahkan secara harfiah sebagai 'rumah Maakha'.
- source_word: וְכָל הַבֵּרִים
  choice: Semua orang Beri
  rationale: Teks Masoret paling langsung menunjang sebutan kelompok בֵּרִים. 'Orang Beri' mempertahankan bentuk nama yang tidak pasti tanpa menyamakannya secara diam-diam dengan Bikhri.
- source_word: ויקלהו
  choice: berkumpul
  rationale: Bentuk yang dimaksud dalam tradisi teks dipahami dari akar קהל dan menyatakan bahwa kelompok itu berhimpun; 'berkumpul' alami dan tepat dalam narasi Indonesia.
- source_word: וַיָּבֹאוּ אַף אַחֲרָיו
  choice: dan turut mengikuti dia
  rationale: Secara harfiah ungkapan ini berarti 'dan mereka pun datang sesudah dia'; dalam konteks gerakan bersama, 'turut mengikuti dia' menyampaikan idiom tersebut sambil mempertahankan fungsi אַף melalui 'turut'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama tempat ditulis 'Abel' dan 'Bet-Maakha'. Pronomina 'Ia' mempertahankan rujukan orang ketiga yang tidak disebutkan namanya dalam ayat ini. Kedua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
