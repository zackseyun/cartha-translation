base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/017.yaml
  text: He came near to her[a], and the woman said, “Are you Joab?” He said, “I am.” Then she said to him, “Listen to the words of your servant.” He said, “I am listening.”
translation:
  language: id
  text: Lalu ia mendekati perempuan itu, dan perempuan itu bertanya, “Apakah engkau Yoab?” Ia menjawab, “Benar.” Kemudian perempuan itu berkata kepadanya, “Dengarkanlah perkataan hamba perempuanmu[a].” Ia menjawab, “Aku mendengarkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelayan perempuanmu.” Istilah Ibrani ini adalah sebutan diri feminin yang menyatakan kerendahan dan pelayanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַב אֵלֶיהָ
  choice: ia mendekati perempuan itu
  rationale: Bentuk qal wayyiqtol dari קרב dengan אֶל menyatakan gerak mendekat ke arah perempuan itu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan maksud tertentu.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Dalam konteks ini אִשָּׁה menunjuk kepada perempuan dewasa yang sedang berbicara, bukan secara khusus kepada seorang istri.
- source_word: הַאַתָּה יוֹאָב
  choice: Apakah engkau Yoab?
  rationale: Partikel tanya dan pronomina mandiri membentuk pertanyaan langsung untuk memastikan identitas. 'Engkau' mempertahankan bentuk tunggal dan cocok dengan ragam naratif yang bermartabat.
- source_word: אָנִי
  choice: Benar
  rationale: Pronomina mandiri ini merupakan jawaban singkat yang mengukuhkan identitas. Dalam dialog bahasa Indonesia, 'Benar' lebih alami daripada 'Aku' atau 'Aku adalah' dan tidak menambah isi substantif.
- source_word: שְׁמַע
  choice: Dengarkanlah
  rationale: Imperatif שמע di sini meminta perhatian aktif. 'Dengarkanlah' menyampaikan permintaan itu secara alami dan santun.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruksi דְּבָרִים secara harfiah menunjuk pada kata-kata atau perkataan. Bentuk kolektif 'perkataan' alami dalam bahasa Indonesia dan mempertahankan citra verbal sumber.
- source_word: אֲמָתֶךָ
  choice: hambamu ini
  rationale: אָמָה adalah sebutan diri feminin yang menyatakan kerendahan dan kedudukan sebagai pelayan. 'Hambamu' merupakan bentuk idiomatis dalam bahasa Indonesia; kata 'ini' memperjelas bahwa perempuan itu merujuk kepada dirinya sendiri tanpa mengubah makna.
- source_word: שֹׁמֵעַ אָנֹכִי
  choice: Aku mendengarkan
  rationale: Partisipel aktif disertai pronomina menandakan perhatian yang sedang berlangsung. 'Aku mendengarkan' mempertahankan aspek progresif tersebut secara wajar.
