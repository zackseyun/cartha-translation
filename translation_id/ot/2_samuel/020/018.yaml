base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/018.yaml
  text: Then she said[a], “They used to say in former times[b], ‘Let them surely ask at Abel,’ and so they ended the matter.”
translation:
  language: id
  text: Kemudian perempuan itu berkata, “Dahulu orang biasa berkata, ‘Hendaklah mereka bertanya di Abel,’ dan dengan demikian mereka menyelesaikan perkara.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani ayat ini sulit dan dapat juga diterjemahkan, “Dahulu orang sungguh-sungguh berkata, ‘Hendaklah mereka sungguh-sungguh bertanya di Abel,’ dan demikianlah mereka mengakhirinya.” Kedua klausa memakai konstruksi Ibrani yang menegaskan kata kerja; kata kerja terakhir secara harfiah dapat berarti “menyelesaikan” atau “mengakhiri.”
    reason: lexical_alternative
  - marker: b
    text: “Abel” adalah bentuk singkat dari Abel-Bet-Maakha, kota yang sedang dikepung dalam konteks ini.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֹּאמֶר לֵאמֹר
  choice: Kemudian perempuan itu berkata
  rationale: Bentuk wayyiqtol meneruskan urutan narasi, sedangkan לֵאמֹר secara alami diwakili oleh tanda petik untuk memperkenalkan ucapan langsung.
- source_word: דַּבֵּר יְדַבְּרוּ בָרִאשֹׁנָה
  choice: Dahulu orang biasa berkata
  rationale: Infinitif absolut dengan bentuk imperfek memberi penegasan dan, dalam konteks pepatah tentang kebiasaan masa lampau, paling alami dinyatakan sebagai ujaran yang biasa diucapkan dahulu.
- source_word: שָׁאֹל יְשָׁאֲלוּ
  choice: Mintalah nasihat
  rationale: Konstruksi infinitif absolut ditambah imperfek menegaskan tindakan bertanya atau meminta petunjuk. Dalam konteks nama kota yang termasyhur karena kebijaksanaan, 'meminta nasihat' menyampaikan maksudnya secara wajar, sementara unsur penegasan dijelaskan dalam catatan.
- source_word: בְּאָבֵל
  choice: di Abel
  rationale: Nama ini menunjuk kepada kota Abel-Bet-Maakha dalam bentuk singkat; preposisi בְּ secara wajar diterjemahkan 'di'.
- source_word: וְכֵן הֵתַמּוּ
  choice: dan dengan demikian mereka menyelesaikan perkara itu
  rationale: וְכֵן menyatakan cara atau hasil, sedangkan bentuk Hifil dari תמם berarti membawa sesuatu kepada penyelesaian. Objek 'perkara itu' tersirat dan ditambahkan agar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ujaran lama dibuat bernuansa pepatah tanpa menjadi arkais. Penanda catatan kaki ditempatkan sesudah keseluruhan ayat karena catatan [a] membahas ambiguitas seluruh susunan kalimat dan [b] menjelaskan nama tempat.
