  text: וַ/יֹּ֤אמֶר יוֹאָב֙ לַ/עֲמָשָׂ֔א הֲ/שָׁל֥וֹם אַתָּ֖ה אָחִ֑/י וַ/תֹּ֜חֶז יַד יְמִ֥ין יוֹאָ֛ב בִּ/זְקַ֥ן עֲמָשָׂ֖א לִ/נְשָׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/009.yaml
  text: Joab said to Amasa[a], “Is it well with you, my brother?” And Joab took hold of Amasa’s beard with his right hand to kiss him.
translation:
  language: id
  text: Yoab berkata kepada Amasa[a], “Apakah keadaanmu baik, saudaraku?” Lalu dengan tangan kanannya Yoab memegang janggut Amasa untuk menciumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Memegang janggut dan mencium merupakan gerak-gerik yang berkaitan dengan salam akrab; dalam konteks ini, tindakan tersebut merupakan tipu daya.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁלוֹם
  choice: Apakah keadaanmu baik
  rationale: Ungkapan ini menanyakan kesejahteraan atau keadaan damai seseorang. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan bentuk pertanyaan, bukan meratakannya menjadi sekadar salam.
- source_word: אָחִי
  choice: saudaraku
  rationale: Akhiran posesif orang pertama tunggal dipertahankan. Sapaan ini menyampaikan keakraban yang tampak, yang dalam konteks ternyata menipu.
- source_word: וַתֹּחֶז
  choice: memegang
  rationale: Kata kerja ini berarti memegang atau mencengkeram. 'Memegang' tidak lebih dahulu menyiratkan kekerasan yang baru tampak jelas pada ayat berikutnya.
- source_word: יַד יְמִין יוֹאָב
  choice: dengan tangan kanannya Yoab
  rationale: Susunan ini mempertahankan rincian bahwa tangan kanan Yoab melakukan tindakan tersebut dan tetap wajar dalam narasi Indonesia.
- source_word: בִּזְקַן עֲמָשָׂא
  choice: janggut Amasa
  rationale: Bentuk kepunyaan langsung merupakan padanan Indonesia yang alami dan mempertahankan rincian budaya dalam tindakan penyambutan.
- source_word: לִנְשָׁק לוֹ
  choice: untuk menciumnya
  rationale: 'Infinitif dengan ל menyatakan tujuan: Yoab memegang janggut Amasa dengan maksud menciumnya.'
