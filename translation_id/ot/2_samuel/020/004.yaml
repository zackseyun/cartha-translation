translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Engkau” dipertahankan untuk sapaan langsung dalam konteks kerajaan; susunan kalimat dibuat alami tanpa menghilangkan penekanan pada Amasa.
