base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/004.yaml
  text: Then the king said to Amasa[a], “Call the men of Judah together for me within three days, and you, remain here.”
translation:
  language: id
  text: Lalu raja berkata kepada Amasa, “Kumpulkanlah orang-orang Yehuda[a] untukku dalam waktu tiga hari, dan engkau sendiri, tetaplah di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai ungkapan kolektif maskulin, secara harfiah “orang Yehuda”. Dalam konteks ini, ungkapan itu mungkin merujuk kepada para laki-laki Yehuda yang dapat dikerahkan, tetapi teks tidak secara eksplisit menyebut mereka “prajurit”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tentu ini merujuk kepada Daud dalam konteks, tetapi penerjemahan tetap mempertahankan gelarnya dan tidak menggantinya dengan nama diri.
- source_word: הַזְעֶק
  choice: Panggillah ... berkumpul
  rationale: Imperatif Hifil dari זעק di sini menyatakan tindakan mengerahkan atau memanggil orang agar berkumpul. Ungkapan ini alami sekaligus mempertahankan nuansa kausatif.
- source_word: לִי
  choice: untukku
  rationale: Preposisi ini menandai tindakan yang dilakukan bagi kepentingan atau atas perintah raja.
- source_word: אֶת אִישׁ יְהוּדָה
  choice: orang-orang Yehuda
  rationale: אִישׁ berbentuk tunggal tetapi dipakai secara kolektif. Pilihan ini mempertahankan rujukan kepada kelompok laki-laki tanpa menambahkan istilah “prajurit” yang tidak dinyatakan secara eksplisit.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: dalam tiga hari
  rationale: Dalam konteks perintah, frasa waktu ini menunjukkan tenggat penyelesaian pemanggilan, bukan lamanya kegiatan.
- source_word: וְאַתָּה
  choice: dan engkau sendiri
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan. “Engkau sendiri” menyampaikan penekanan itu tanpa mengubah koordinasi menjadi pertentangan yang lebih kuat.
- source_word: פֹּה
  choice: di sini
  rationale: Padanan langsung dan alami bagi adverbia tempat.
- source_word: עֲמֹד
  choice: harus tetap berada
  rationale: Walaupun arti dasarnya “berdiri”, dalam instruksi ini verba tersebut berarti tetap atau menunggu di tempat. Bentuk “harus” membuat daya imperatifnya jelas dalam bahasa Indonesia.
