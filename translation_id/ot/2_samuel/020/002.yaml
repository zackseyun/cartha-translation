  terminology: Nama Daud, Seba, Bikri, Yehuda, Yordan, dan Yerusalem sudah sesuai pemakaian Alkitab Indonesia. “Berpaut pada raja mereka” secara alami mempertahankan metafora דבק tanpa menambahkan penafsiran teologis.
