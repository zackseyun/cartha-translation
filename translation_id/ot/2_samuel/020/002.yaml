  text: וַ/יַּ֜עַל כָּל אִ֤ישׁ יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י דָוִ֔ד אַחֲרֵ֖י שֶׁ֣בַע בֶּן בִּכְרִ֑י וְ/אִ֤ישׁ יְהוּדָה֙ דָּבְק֣וּ בְ/מַלְכָּ֔/ם מִן הַ/יַּרְדֵּ֖ן וְ/עַד יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/002.yaml
  text: So every man of Israel went up from following David to follow Sheba son of Bichri[a], but the men of Judah held fast to their king[b], from the Jordan to Jerusalem.
translation:
  language: id
  text: Maka setiap orang Israel pergi meninggalkan Daud untuk mengikuti Seba anak Bikri[a], tetapi orang-orang Yehuda tetap berpaut pada raja mereka, dari Sungai Yordan sampai ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik dari mengikuti Daud, mengikuti Seba anak Bikri.” Pengulangan ungkapan “mengikuti” menunjukkan peralihan kesetiaan dari Daud kepada Seba.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi
  rationale: Secara harfiah berarti “naik”, tetapi dalam konteks naratif ini menyatakan keberangkatan atau peralihan untuk mengikuti Seba. “Pergi” alami dalam bahasa Indonesia tanpa menambahkan arah geografis yang tidak dijelaskan.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: setiap orang Israel
  rationale: Mempertahankan bentuk distributif tunggal kolektif Ibrani, yang secara harfiah berarti “setiap orang Israel”.
- source_word: מֵאַחֲרֵי דָוִד
  choice: berhenti mengikuti Daud
  rationale: Ungkapan ini secara kontekstual menunjukkan bahwa mereka meninggalkan posisi sebagai pengikut Daud; “berhenti mengikuti” menyampaikan perpindahan kesetiaan dengan jelas.
- source_word: אַחֲרֵי שֶׁבַע בֶּן בִּכְרִי
  choice: mengikuti Seba anak Bikri
  rationale: Pengulangan אַחֲרֵי menunjukkan bahwa kesetiaan mereka beralih kepada Seba. “Mengikuti” mempertahankan citra dan makna relasional sumber.
- source_word: וְאִישׁ יְהוּדָה
  choice: tetapi orang-orang Yehuda
  rationale: Bentuk tunggal dipakai secara kolektif. Kata hubung “tetapi” mengungkapkan pertentangan kontekstual dengan tindakan orang Israel.
- source_word: דָּבְקוּ
  choice: tetap berpaut
  rationale: דבק menggambarkan tindakan melekat atau berpegang erat dan dalam konteks ini mengandung kesetiaan. “Tetap berpaut” mempertahankan metafora konkret tanpa mereduksinya menjadi penjelasan semata.
- source_word: בְמַלְכָּם
  choice: pada raja mereka
  rationale: Dengan דבק, preposisi ב secara alami diterjemahkan “pada”; sufiks jamak merujuk kepada raja orang-orang Yehuda, yaitu Daud.
- source_word: מִן הַיַּרְדֵּן וְעַד יְרוּשָׁלִָם
  choice: dari Sungai Yordan sampai ke Yerusalem
  rationale: Menyampaikan rentang perjalanan sebagaimana dinyatakan teks. Penambahan “Sungai” membuat nama Yordan jelas dan alami bagi pembaca Indonesia.
