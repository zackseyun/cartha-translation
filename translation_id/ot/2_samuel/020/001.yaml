reference: 2 Samuel 20:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֨ם נִקְרָ֜א אִ֣ישׁ בְּלִיַּ֗עַל וּ/שְׁמ֛/וֹ שֶׁ֥בַע בֶּן בִּכְרִ֖י אִ֣ישׁ יְמִינִ֑י וַ/יִּתְקַ֣ע בַּ/שֹּׁפָ֗ר וַ֠/יֹּאמֶר אֵֽין לָ֨/נוּ חֵ֜לֶק בְּ/דָוִ֗ד וְ/לֹ֤א נַֽחֲלָה לָ֨/נוּ֙ בְּ/בֶן יִשַׁ֔י אִ֥ישׁ לְ/אֹהָלָ֖י/ו יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/001.yaml
  text: There happened to be there a worthless man[a], whose name was Sheba son of Bichri, a Benjaminite. He blew the trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents[d][c][b], O Israel!”
translation:
  language: id
  text: Di sana ada seorang durjana[a] bernama Syeba bin Bikri, seorang dari suku Benyamin. Ia meniup sangkakala[b] lalu berkata, “Kita tidak mendapat bagian dari Daud dan tidak mendapat warisan dari anak Isai. Setiap orang ke kemahnya, hai Israel!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang dursila,” “orang tidak berguna,” atau secara lebih harfiah, “seorang Belial.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: syofar, yaitu tanduk yang ditiup sebagai alat pemberi isyarat; menurut tradisi biasanya dibuat dari tanduk domba jantan.'
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “Setiap orang ke kemahnya.” Ini adalah ungkapan distributif yang menyerukan agar masing-masing orang pergi ke rumah atau perkemahannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִקְרָא
  choice: kebetulan ada
  rationale: Dalam konstruksi naratif dengan שָׁם, bentuk ini berfungsi secara eksistensial untuk memperkenalkan tokoh; 'kebetulan ada' alami dalam bahasa Indonesia dan tidak memberi kesan bahwa tokoh itu sedang dinamai.
- source_word: אִישׁ בְּלִיַּעַל
  choice: seorang bajingan
  rationale: Ungkapan ini mencirikan orang yang bejat, tidak berguna, atau durjana. 'Bajingan' menyampaikan celaan moral yang kuat dan mudah dipahami, tanpa menjadikan Belial nama diri.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Syeba bin Bikri
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; 'bin' secara ringkas mempertahankan hubungan ayah-anak.
- source_word: אִישׁ יְמִינִי
  choice: seorang dari suku Benyamin
  rationale: Frasa ini menunjukkan afiliasi kesukuan, bukan sekadar wilayah asal.
- source_word: וַיִּתְקַע בַּשֹּׁפָר
  choice: Ia meniup sangkakala
  rationale: שׁוֹפָר adalah terompet dari tanduk yang dipakai untuk memberi isyarat umum. 'Sangkakala' mempertahankan nuansa alat isyarat kuno; bahan alat dijelaskan dalam catatan kaki.
- source_word: אֵין לָנוּ חֵלֶק בְּדָוִד
  choice: Kita tidak mendapat bagian dalam Daud
  rationale: חֵלֶק berarti bagian atau jatah. Ungkapan sumber sengaja dipertahankan karena menyatakan penolakan atas keterlibatan atau kepentingan dalam pemerintahan Daud.
- source_word: וְלֹא נַחֲלָה לָנוּ בְּבֶן יִשַׁי
  choice: dan tidak memiliki warisan dalam anak Isai
  rationale: '''Warisan'' mempertahankan citra נַחֲלָה serta gema pembagian milik, meskipun di sini digunakan sebagai klaim politik.'
- source_word: בְּבֶן יִשַׁי
  choice: dalam anak Isai
  rationale: Penyebutan Daud berdasarkan ayahnya, tanpa gelar kerajaan, mempertahankan nada meremehkan dalam seruan tersebut.
- source_word: אִישׁ לְאֹהָלָיו
  choice: Setiap orang, pulanglah ke kemahnya masing-masing
  rationale: Terjemahan ini menyampaikan idiom distributif harfiah 'masing-masing ke kemahnya' sebagai seruan agar setiap orang meninggalkan Daud dan kembali ke tempatnya.
- source_word: יִשְׂרָאֵל
  choice: hai Israel
  rationale: Bentuk ini menyampaikan fungsi vokatif sebagai seruan langsung kepada Israel.
theological_decisions:
- issue: Apakah בְּלִיַּעַל merupakan nama diri 'Belial' atau sebutan deskriptif
  choice: 'Sebutan deskriptif: ''bajingan'''
  alternative: '''seorang pengikut Belial'' atau ''orang dursila'''
  rationale: Dalam konteks ini ungkapan tersebut mencela watak Syeba dan tidak menuntut pemahaman Belial sebagai tokoh roh atau nama diri. Terjemahan deskriptif menghindari masuknya perkembangan demonologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat, dengan irama seruan politik yang kuat. Bentuk 'bajingan' sengaja tegas untuk mencerminkan celaan אִישׁ בְּלִיַּעַל, sedangkan catatan kaki menyediakan alternatif yang lebih formal. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
