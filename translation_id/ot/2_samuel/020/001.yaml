  naturalness: '"Bajingan" terasa cukup kasar dan percakapan untuk register naratif Alkitab modern yang bermartabat. "Tidak mendapat bagian dalam Daud" dan "memiliki warisan dalam anak Isai" juga kurang idiomatis dalam bahasa Indonesia. Revisi mempertahankan metafora politik sumber sambil membuatnya lebih alami.'
