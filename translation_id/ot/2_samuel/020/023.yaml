  text: Joab was over all the army of Israel[a], and Benaiah son of Jehoiada was over the Cherethites and the Pelethites.
translation:
  language: id
  text: Yoab mengepalai seluruh tentara Israel, dan Benaya anak Yoyada mengepalai orang Kereti[a] dan orang Peleti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “orang Kereti.” Bentuk tepat nama kelompok ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Yoab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Konjungsi pembuka tidak dinyatakan tersendiri karena ayat ini merupakan butir lanjutan dalam daftar pejabat dan bahasa Indonesia tidak memerlukannya.
- source_word: אֶל כָּל הַ/צָּבָא יִשְׂרָאֵל
  choice: mengepalai seluruh tentara Israel
  rationale: Dalam rumusan administratif tanpa verba ini, אֶל menyatakan kedudukan atau wewenang. Verba 'mengepalai' menyampaikan fungsi komando secara alami; כָּל dan צָבָא diterjemahkan sebagai 'seluruh tentara'.
- source_word: וּ/בְנָיָה בֶּן יְהוֹיָדָע
  choice: sedangkan Benaya anak Yoyada
  rationale: Nama-nama ditransliterasikan dalam bentuk Indonesia. 'Sedangkan' menandai peralihan sejajar kepada pejabat berikutnya tanpa memberi makna waktu yang tidak ada dalam teks.
- source_word: עַל ה/כרי
  choice: mengepalai orang Kreti[a]
  rationale: עַל dalam daftar jabatan menyatakan kewenangan. Nama kelompok כרי ditransliterasikan karena identitas dan bentuk tepatnya tidak pasti; bentuk tunggal Ibrani dipahami secara kolektif.
- source_word: וְ/עַל הַ/פְּלֵתִי
  choice: dan orang Pleti
  rationale: Frasa ini sejajar dengan kelompok sebelumnya dan berbagi verba 'mengepalai'. Nama kelompok ditransliterasikan, sementara bentuk tunggal Ibrani dipahami secara kolektif.
