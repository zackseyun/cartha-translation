  source_fidelity: Struktur jabatan dan cakupan "seluruh tentara Israel" tersampaikan dengan tepat. Namun, "sedangkan" dapat menyiratkan pertentangan yang tidak ditandai oleh waw Ibrani, dan bentuk nama kelompok pertama serta catatannya perlu diselaraskan dengan transliterasi yang lebih tepat dari הַכְּרֵתִי/varian ejaannya.
  naturalness: '"Mengepalai" dan "anak" merupakan bahasa Indonesia modern yang alami untuk daftar pejabat. Koordinasi sederhana dengan "dan" lebih setia dan lebih netral daripada "sedangkan" dalam konteks ini.'
  terminology: Yoab, Benaya, dan Yoyada dapat dipertahankan. Untuk kelompok itu, "orang Kereti" dan "orang Peleti" adalah bentuk transliterasi Indonesia yang lebih lengkap dan lazim. Catatan "orang Keri" tidak memadai sebagai padanan alternatif bagi bentuk yang dimaksud; alternatifnya sebaiknya "orang Kereti" bila teks utama memakai "Kreti".
