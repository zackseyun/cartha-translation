  - severity: medium
    issue: Catatan kaki "orang Keri"
    rationale: Bentuk ini menghilangkan unsur -t- yang relevan bagi nama kelompok dalam tradisi pembacaan/transliterasi. Catatan tidak dengan jelas menjelaskan alternatif transliterasi yang dipersoalkan.
  - severity: low
    issue: Ejaan "Kreti" dan "Pleti"
    rationale: Bentuk "Kereti" dan "Peleti" lebih transparan sebagai transliterasi nama kelompok dan lebih selaras dengan penggunaan Alkitab bahasa Indonesia yang lazim.
