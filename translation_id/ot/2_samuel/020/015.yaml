base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/015.yaml
  text: They came and besieged him in Abel-beth-maacah[a], and they cast up a siege ramp against the city, and it stood against the rampart[c][b]; and all the people who were with Joab were destroying it to bring down the wall.
translation:
  language: id
  text: Mereka datang dan mengepung dia[a] di Abel-Bet-Maakha. Mereka menimbun sebuah tanggul pengepungan menuju kota itu, dan tanggul itu ditempatkan pada kubu pertahanan[b]. Seluruh pasukan yang menyertai Yoab sedang melakukan penghancuran untuk merobohkan tembok itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengepung dia”; kata ganti maskulin tunggal itu kemungkinan menyoroti Syeba sebagai sasaran, meskipun kota tempat ia berlindunglah yang dikepung.
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani ini dapat menunjuk pada kubu, tanggul pertahanan, atau bangunan pertahanan luar. Hubungan tepat antara tanggul pengepungan dan kubu itu tidak sepenuhnya jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka datang
  rationale: Bentuk naratif dari בוא menyatakan kedatangan pasukan; ungkapan ini alami dan langsung dalam bahasa Indonesia.
- source_word: וַיָּצֻרוּ עָלָיו
  choice: mengepung dia
  rationale: צור dengan עַל berarti mengepung. Akhiran maskulin tunggal dipertahankan sebagai “dia”, kemungkinan menunjuk kepada Syeba sebagai sasaran pengejaran di dalam kota, tanpa menghaluskannya menjadi “kota itu”.
- source_word: בְּאָבֵלָה בֵּית הַמַּעֲכָה
  choice: di Abel-Bet-Maakha
  rationale: Nama tempat dialihaksarakan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: וַיִּשְׁפְּכוּ סֹלְלָה
  choice: Mereka menimbun sebuah tanggul pengepungan
  rationale: שׁפך secara harfiah berarti mencurahkan, tetapi dalam konteks pengepungan menggambarkan penimbunan tanah; סֹלְלָה adalah tanggul atau landaian pengepungan.
- source_word: אֶל הָעִיר
  choice: menuju kota itu
  rationale: אֶל menyatakan arah ke atau menuju kota. Pilihan ini mempertahankan arti spasial tanpa menghilangkan konteks permusuhan.
- source_word: וַתַּעֲמֹד בַּחֵל
  choice: tanggul itu berdiri pada kubu pertahanan
  rationale: Kata kerja feminin paling wajar merujuk kembali kepada סֹלְלָה. חֵל dapat menunjuk pada bangunan pertahanan luar, kubu, atau tanggul pertahanan; “kubu pertahanan” menjaga keluasan maknanya. Preposisi בְּ diterjemahkan secara formal sebagai “pada” karena hubungan fisiknya tidak sepenuhnya pasti.
- source_word: וְכָל הָעָם אֲשֶׁר אֶת יוֹאָב
  choice: Seluruh pasukan yang menyertai Yoab
  rationale: הָעָם secara harfiah “rakyat/orang-orang”, tetapi konteksnya adalah kekuatan militer Yoab. Frasa eliptis dengan אֶת menyatakan kebersamaan atau penyertaan.
- source_word: מַשְׁחִיתִם
  choice: sedang merusaknya
  rationale: Partisipel Hifil maskulin jamak menggambarkan tindakan penghancuran yang sedang berlangsung. Akhiran objek tunggal dipertahankan sebagai “-nya” agar ketidakjelasan acuannya tidak diselesaikan secara diam-diam.
- source_word: לְהַפִּיל הַחוֹמָה
  choice: untuk merobohkan tembok itu
  rationale: Bentuk Hifil dari נפל berarti menyebabkan jatuh; “merobohkan” merupakan padanan Indonesia yang alami dalam konteks pengepungan.
