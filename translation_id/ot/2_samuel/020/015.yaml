revisions:
- from: Mereka datang dan mengepung dia di Abel-Bet-Maakha[a]. Mereka menimbun sebuah tanggul pengepungan menuju kota itu, dan tanggul itu berdiri pada kubu pertahanan[b]. Seluruh pasukan yang menyertai Yoab sedang merusaknya untuk merobohkan tembok itu.
  to: Mereka datang dan mengepung dia[a] di Abel-Bet-Maakha. Mereka menimbun sebuah tanggul pengepungan menuju kota itu, dan tanggul itu ditempatkan pada kubu pertahanan[b]. Seluruh pasukan yang menyertai Yoab sedang melakukan penghancuran untuk merobohkan tembok itu.
  rationale: Revisi mengganti ungkapan yang tidak idiomatis “berdiri pada” dengan “ditempatkan pada,” yang tetap menyatakan posisi tanggul tanpa menentukan secara berlebihan apakah ia menempel, berada di dalam, atau berhadapan dengan pertahanan luar. Klausa akhir diubah agar objek penghancuran yang tidak dinyatakan secara eksplisit dalam Ibrani tidak keliru dihubungkan dengan tanggul. Penanda catatan kaki a dipindahkan ke “dia,” unsur yang memang dibahas oleh catatan tersebut.
