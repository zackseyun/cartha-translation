translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Susunan yang agak tidak lazim pada 'datang ke hadapan mereka' dipertahankan untuk menjaga keluasan makna teks Ibrani, lalu dijelaskan melalui catatan kaki. Istilah 'pakaian perang' dipilih berdasarkan rentang makna leksikal dan konteks bersenjata, bukan sebagai tambahan doktrinal.
