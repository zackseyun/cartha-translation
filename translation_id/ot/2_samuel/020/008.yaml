  text: הֵ֗ם עִם הָ/אֶ֤בֶן הַ/גְּדוֹלָה֙ אֲשֶׁ֣ר בְּ/גִבְע֔וֹן וַ/עֲמָשָׂ֖א בָּ֣א לִ/פְנֵי/הֶ֑ם וְ/יוֹאָ֞ב חָג֣וּר מִדּ֣/וֹ לְבֻשׁ֗/וּ ו/על/ו חֲג֥וֹר חֶ֨רֶב֙ מְצֻמֶּ֤דֶת עַל מָתְנָי/ו֙ בְּ/תַעְרָ֔/הּ וְ/ה֥וּא יָצָ֖א וַ/תִּפֹּֽל־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/008.yaml
  text: When they were by the great stone that is in Gibeon[a], Amasa came before them. Now Joab was dressed in his military garment, and over it was a belt with a sword fastened to his waist in its sheath; and as he went out[c][b], it fell.
translation:
  language: id
  text: Ketika mereka berada di dekat batu besar yang ada di Gibeon, Amasa datang ke hadapan mereka.[a] Yoab mengenakan pakaian perangnya,[b] dan di atas pakaian itu ada ikat pinggang dengan sebilah pedang yang terpasang pada pinggangnya dalam sarungnya. Ketika ia keluar, pedang itu terjatuh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Amasa datang menemui mereka.” Secara harfiah, bahasa Ibrani berbunyi “datang ke hadapan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pakaiannya” atau “pakaian yang dikenakannya.” Kata Ibrani yang dipakai dapat merujuk pada pakaian khusus atau pakaian perang.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “benda itu terjatuh.” Bentuk verba feminin dalam bahasa Ibrani paling mungkin merujuk pada pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם הָאֶבֶן הַגְּדוֹלָה
  choice: Ketika mereka berada di dekat batu besar
  rationale: Dalam keterangan lokasi, עִם dapat menyatakan keberadaan di dekat suatu tempat. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna ruangnya.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: yang ada di Gibeon
  rationale: Klausa relatif ini menunjukkan lokasi batu tersebut; bentuk ini wajar untuk penanda tempat dalam narasi.
- source_word: וַעֲמָשָׂא בָּא לִפְנֵיהֶם
  choice: Amasa datang ke hadapan mereka
  rationale: Terjemahan ini mempertahankan arti dasar לִפְנֵי, yakni 'di hadapan/di depan', tanpa memastikan apakah maksud kontekstualnya ialah datang menemui mereka.
- source_word: חָגוּר מִדּוֹ לְבֻשׁוֹ
  choice: Yoab mengenakan pakaian perangnya
  rationale: מַד dapat menunjuk pakaian khusus, termasuk pakaian militer. Konteks Yoab yang bersenjata mendukung 'pakaian perang', sementara catatan kaki mempertahankan kemungkinan arti yang lebih umum.
- source_word: וְעָלָיו חֲגוֹר
  choice: di atas pakaian itu ada ikat pinggang
  rationale: Terjemahan ini menyampaikan lapisan pakaian dan ikat pinggang secara jelas tanpa mengulang bentuk Ibrani secara kaku.
- source_word: חֶרֶב מְצֻמֶּדֶת עַל מָתְנָיו בְּתַעְרָהּ
  choice: dengan sebilah pedang yang tersarung dan terpasang pada pinggangnya
  rationale: מְצֻמֶּדֶת menyatakan pedang itu terpasang erat, מָתְנַיִם merujuk daerah pinggang/panggul, dan בְּתַעְרָהּ menunjukkan bahwa pedang berada dalam sarungnya.
- source_word: וְהוּא יָצָא
  choice: Ketika ia maju
  rationale: Secara harfiah verba ini berarti 'keluar/pergi ke luar', tetapi dalam adegan ini 'maju' menyampaikan gerak Yoab dengan alami. Hubungan waktunya dengan jatuhnya pedang dinyatakan melalui 'ketika'.
- source_word: וַתִּפֹּל
  choice: pedang itu terjatuh
  rationale: Bentuk verba feminin paling mungkin merujuk kepada חֶרֶב, 'pedang', yang juga berjenis feminin. Penyebutan nomina memperjelas rujukannya dalam bahasa Indonesia.
