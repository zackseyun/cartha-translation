  to: Ketika mereka berada di dekat batu besar yang ada di Gibeon, Amasa datang ke hadapan mereka.[a] Yoab mengenakan pakaian perangnya,[b] dan di atas pakaian itu ada ikat pinggang dengan sebilah pedang yang terpasang pada pinggangnya dalam sarungnya. Ketika ia keluar, pedang itu terjatuh.[c]
