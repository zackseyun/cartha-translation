  text: וַ/עֲמָשָׂ֛א מִתְגֹּלֵ֥ל בַּ/דָּ֖ם בְּ/ת֣וֹךְ הַֽ/מְסִּלָּ֑ה וַ/יַּ֨רְא הָ/אִ֜ישׁ כִּֽי עָמַ֣ד כָּל הָ/עָ֗ם וַ/יַּסֵּב֩ אֶת עֲמָשָׂ֨א מִן הַֽ/מְסִלָּ֤ה הַ/שָּׂדֶה֙ וַ/יַּשְׁלֵ֤ךְ עָלָי/ו֙ בֶּ֔גֶד כַּ/אֲשֶׁ֣ר רָאָ֔ה כָּל הַ/בָּ֥א עָלָ֖י/ו וְ/עָמָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/012.yaml
  text: Amasa was wallowing in blood in the middle of the highway. When the man saw that all the people were stopping[a], he moved Amasa from the highway into the field and threw a garment over him, because he saw that everyone who came upon him stopped.
translation:
  language: id
  text: Amasa berguling-guling dalam darah di tengah jalan raya.[a] Ketika orang itu melihat bahwa semua orang berhenti, ia memindahkan Amasa dari jalan raya ke ladang dan melemparkan sehelai pakaian ke atas Amasa, sebab ia melihat bahwa setiap orang yang menjumpainya berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggeliat-geliat dalam darah.” Kata kerja Ibrani secara lebih harfiah berarti “berguling-guling” dan di sini tampaknya menggambarkan gerakan Amasa ketika ia tergeletak terluka parah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְגֹּלֵל
  choice: berguling-guling
  rationale: Bentuk Hitpolel dari גלל menggambarkan gerakan berulang Amasa ketika tergeletak terluka parah. “Berguling-guling” mempertahankan gambaran konkret verba Ibrani tanpa memasukkan penafsiran yang tidak dinyatakan secara eksplisit.
- source_word: בַּדָּם
  choice: dalam darah
  rationale: Bahasa Ibrani secara harfiah memakai bentuk tentu, tetapi “dalam darah” lebih alami dalam bahasa Indonesia dan tidak menambahkan “darahnya”, yang tidak dinyatakan.
- source_word: בְּתוֹךְ הַמְסִלָּה
  choice: di tengah jalan raya
  rationale: מְסִלָּה menunjuk pada jalan utama atau jalan yang ditinggikan; “jalan raya” menyampaikan bahwa ini jalur umum utama, sedangkan בְּתוֹךְ diterjemahkan jelas sebagai “di tengah”.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Kata sandang Ibrani menunjuk kepada orang tertentu yang sudah dapat dikenali dari konteks, sehingga “orang itu” lebih tepat daripada “seorang.”
- source_word: כִּי עָמַד כָּל הָעָם
  choice: bahwa semua orang berhenti
  rationale: עמד di sini menyatakan bahwa orang-orang terhenti karena melihat Amasa di jalan. Bentuk sederhana “berhenti” alami dalam narasi Indonesia dan mempertahankan cakupan כָּל.
- source_word: וַיַּסֵּב
  choice: ia memindahkan
  rationale: Bentuk Hifil dari סבב menyatakan bahwa orang itu menyingkirkan Amasa dari jalan. “Memindahkan” tidak menentukan caranya, berbeda dari “menyeret” yang akan menambahkan rincian.
- source_word: מִן הַמְסִלָּה הַשָּׂדֶה
  choice: dari jalan raya ke ladang
  rationale: Susunan ini menyatakan perpindahan dari jalan menuju ladang di sebelahnya. “Ke ladang” menyampaikan tujuan tanpa harus menambahkan bahwa ia dibawa jauh masuk ke dalam ladang.
- source_word: וַיַּשְׁלֵךְ עָלָיו בֶּגֶד
  choice: menutupi Amasa dengan sehelai pakaian
  rationale: Secara harfiah ungkapan ini berarti melemparkan sehelai pakaian ke atasnya. Dalam konteks, tindakan itu berfungsi menutupi tubuh Amasa; terjemahan ini alami sekaligus mempertahankan בֶּגֶד sebagai pakaian umum, bukan jenis khusus seperti jubah.
- source_word: כָּל הַבָּא עָלָיו
  choice: setiap orang yang menjumpainya
  rationale: Frasa tersebut menggambarkan orang yang tiba dan mendapati Amasa di tempat itu. “Menjumpainya” menyampaikan pertemuan di jalan tanpa menyiratkan bahwa mereka sengaja datang kepadanya.
- source_word: וְעָמָד
  choice: berhenti
  rationale: 'Pengulangan עמד menggemakan pernyataan sebelumnya: setiap orang yang mendapati Amasa terhenti. “Berhenti” merupakan padanan modern yang paling jelas.'
