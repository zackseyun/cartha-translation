  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama “Amasa” diulang pada klausa penutupan tubuh untuk menghindari ambiguitas pronomina, karena “orang itu” juga menjadi pelaku dalam kalimat yang sama.
