base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/006.yaml
  text: Then David said to Abishai[a], “Now Sheba son of Bichri will do us more harm than Absalom. You, take your lord’s servants and pursue after him, lest he find fortified cities for himself and escape from our sight.”
translation:
  language: id
  text: Lalu Daud berkata kepada Abisai, “Sekarang Seba anak Bikri akan lebih mencelakakan kita daripada Absalom. Engkau, bawalah hamba-hamba tuanmu dan kejarlah dia, jangan sampai ia mendapatkan kota-kota berbenteng untuk dirinya lalu luput dari pandangan kita.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibraninya berbunyi kira-kira “melepaskan mata kita”, sebuah ungkapan yang berarti “luput dari pandangan kita” atau “mengelabui kita”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרַע לָנוּ
  choice: akan lebih mencelakakan kita
  rationale: Dalam konteks ini, verba רעע menyatakan tindakan yang mendatangkan celaka atau kesusahan, bukan kejahatan moral secara abstrak. Bentuk ini juga mempertahankan perbandingan dengan Absalom.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba anak Bikri
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִן אַבְשָׁלוֹם
  choice: daripada Absalom
  rationale: Preposisi מִן berfungsi sebagai penanda perbandingan; 'daripada' menyampaikan hubungan itu secara langsung tanpa menambahkan unsur yang tidak dinyatakan.
- source_word: אַתָּה קַח
  choice: Engkau, bawalah
  rationale: Pronomina mandiri אַתָּה memberi penekanan pada Abisai. Kata 'Engkau' dipertahankan, sedangkan imperatif קַח diterjemahkan 'bawalah' sesuai objek berupa para hamba yang harus disertakan.
- source_word: עַבְדֵי אֲדֹנֶיךָ
  choice: hamba-hamba tuanmu
  rationale: Ungkapan ini mempertahankan bahasa hierarkis sumber. 'Tuanmu' merujuk kepada Daud sebagai tuan Abisai, tanpa memasukkan gagasan status perbudakan yang bukan pokok ayat ini.
- source_word: וּרְדֹף אַחֲרָיו
  choice: dan kejarlah dia
  rationale: רדף dalam konteks militer berarti mengejar. Bahasa Indonesia tidak memerlukan padanan terpisah untuk אַחֲרָיו agar maknanya tersampaikan secara alami.
- source_word: פֶּן
  choice: supaya jangan
  rationale: פֶּן memperkenalkan hal yang dikhawatirkan atau hendak dicegah. 'Supaya jangan' akurat, alami, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: מָצָא לוֹ עָרִים בְּצֻרוֹת
  choice: ia mendapatkan kota-kota berbenteng bagi dirinya
  rationale: מָצָא secara dasar berarti menemukan atau mendapatkan, sedangkan לוֹ menyatakan keuntungan bagi dirinya. Terjemahan ini mempertahankan keduanya tanpa mempersempit makna menjadi sekadar mencari perlindungan.
- source_word: וְהִצִּיל עֵינֵינוּ
  choice: lalu luput dari pandangan kita
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'melepaskan/menyelamatkan mata kita', tetapi secara idiomatis berarti lolos dari pengamatan. 'Luput dari pandangan kita' mempertahankan citra penglihatan dalam bahasa Indonesia yang alami.
