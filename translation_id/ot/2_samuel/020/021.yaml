base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/021.yaml
  text: That is not the matter[a]. Rather, a man from the hill country of Ephraim, Sheba son of Bichri by name, has raised his hand against the king, against David. Hand him over alone, and I will withdraw from the city.” And the woman said to Joab, “Look[b], his head will be thrown to you over the wall.”
translation:
  language: id
  text: “Bukan itu persoalannya. Sebaliknya, ada seorang dari daerah pegunungan Efraim[a], namanya Seba bin Bikri. Ia telah mengangkat tangannya[b] melawan raja, melawan Daud. Serahkan hanya dia, maka aku akan mundur dari kota ini.” Perempuan itu berkata kepada Yoab, “Lihatlah, kepalanya akan dilemparkan kepadamu melintasi tembok.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari Pegunungan Efraim.” Ungkapan Ibrani menunjuk pada kawasan pegunungan Efraim.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini secara harfiah berarti “mengangkat tangannya”; maksudnya, ia telah memberontak.
    reason: idiom_explanation
lexical_decisions:
- source_word: לֹא כֵן הַדָּבָר
  choice: Bukan begitu masalahnya
  rationale: Ungkapan ini menyangkal anggapan perempuan itu sebelumnya dengan bahasa Indonesia yang alami, tanpa mengikuti susunan Ibrani secara kaku.
- source_word: כִּי
  choice: Sebaliknya
  rationale: Sesudah penyangkalan, kata ini memperkenalkan penjelasan yang membetulkan anggapan sebelumnya.
- source_word: מֵהַר אֶפְרַיִם
  choice: dari daerah pegunungan Efraim
  rationale: Ungkapan geografis ini lazim menunjuk pada kawasan perbukitan atau pegunungan Efraim, bukan hanya satu gunung.
- source_word: שֶׁבַע בֶּן בִּכְרִי שְׁמוֹ
  choice: namanya Seba bin Bikri
  rationale: Mempertahankan rumus penamaan Ibrani dalam bentuk yang ringkas dan wajar bagi pembaca Indonesia.
- source_word: נָשָׂא יָדוֹ
  choice: telah mengangkat tangannya
  rationale: Citra idiom Ibrani dipertahankan dalam teks, sedangkan makna pemberontakannya dijelaskan dalam catatan kaki.
- source_word: בַּמֶּלֶךְ בְּדָוִד
  choice: melawan raja, melawan Daud
  rationale: Pengulangan kata depan dipertahankan untuk mencerminkan penekanan dan aposisi dalam bahasa Ibrani.
- source_word: תְּנוּ אֹתוֹ לְבַדּוֹ
  choice: Serahkan hanya dia
  rationale: Menyatakan tuntutan agar satu orang itu saja diserahkan, dalam susunan bahasa Indonesia yang alami.
- source_word: וְאֵלְכָה מֵעַל הָעִיר
  choice: maka aku akan mundur dari kota ini
  rationale: Dalam konteks pengepungan, tindakan yang dimaksud ialah menarik pasukan dan meninggalkan posisi di sekitar kota.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini memperkenalkan jaminan yang tegas; pilihan ini lebih sesuai daripada seruan visual karena kepala itu belum dilemparkan saat perempuan tersebut berbicara.
- source_word: רֹאשׁוֹ מֻשְׁלָךְ אֵלֶיךָ בְּעַד הַחוֹמָה
  choice: kepalanya akan dilemparkan kepadamu dari atas tembok
  rationale: Partisipel pasif bersama הִנֵּה menyatakan tindakan yang segera akan terjadi. Dalam konteks ini, kepala itu dilemparkan melintasi tembok ke arah Yoab.
