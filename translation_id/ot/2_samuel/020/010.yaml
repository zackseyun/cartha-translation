  text: וַ/עֲמָשָׂ֨א לֹֽא נִשְׁמַ֜ר בַּ/חֶ֣רֶב אֲשֶׁ֣ר בְּ/יַד יוֹאָ֗ב וַ/יַּכֵּ/הוּ֩ בָ֨/הּ אֶל הַ/חֹ֜מֶשׁ וַ/יִּשְׁפֹּ֨ךְ מֵעָ֥י/ו אַ֛רְצָ/ה וְ/לֹא שָׁ֥נָה ל֖/וֹ וַ/יָּמֹ֑ת וְ/יוֹאָב֙ וַ/אֲבִישַׁ֣י אָחִ֔י/ו רָדַ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/010.yaml
  text: But Amasa was not on guard against the sword that was in Joab’s hand[a], and he struck him with it in the belly, and his entrails spilled out to the ground; he did not strike him again, and he died. Then Joab and Abishai his brother pursued Sheba son of Bichri.
translation:
  language: id
  text: Namun, Amasa tidak waspada terhadap pedang yang ada di tangan Yoab. Yoab menyerangnya dengan pedang itu pada perutnya[a], sehingga isi perut Amasa tertumpah ke tanah. Yoab tidak menyerangnya lagi, dan Amasa mati. Kemudian Yoab dan Abisai, saudaranya, mengejar Seba anak Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada tulang rusuk kelimanya.” Namun, istilah Ibrani itu dalam konteks ini kemungkinan besar merujuk secara umum pada perut atau bagian abdomen.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמַר
  choice: tidak waspada
  rationale: Bentuk Nifal di sini menyatakan bahwa Amasa tidak berjaga-jaga atau tidak menyadari ancaman, bukan bahwa ia tidak dilindungi oleh orang lain.
- source_word: חֶרֶב
  choice: pedang
  rationale: Padanan baku dan langsung bagi חֶרֶב dalam konteks senjata yang dipegang Yoab.
- source_word: בְּיַד יוֹאָב
  choice: di tangan Yoab
  rationale: Ungkapan ini bersifat konkret dan menunjukkan bahwa pedang tersebut sedang dipegang Yoab.
- source_word: וַיַּכֵּהוּ בָהּ
  choice: Yoab menikam ... dengan pedang itu
  rationale: Secara leksikal נכה berarti memukul atau menghantam, tetapi dalam konteks pedang yang menembus perut dan menumpahkan isi perut, 'menikam' merupakan ungkapan Indonesia yang paling alami dan jelas. Nama Yoab diulang untuk menghindari ketidakjelasan pelaku.
- source_word: אֶל הַחֹמֶשׁ
  choice: perutnya
  rationale: חֹמֶשׁ dalam kisah-kisah pembunuhan di Samuel menunjuk pada daerah perut atau abdomen; terjemahan tradisional 'tulang rusuk kelima' tidak pasti dan dicatat sebagai alternatif.
- source_word: וַיִּשְׁפֹּךְ מֵעָיו אַרְצָה
  choice: sehingga isi perutnya tertumpah ke tanah
  rationale: Mengungkapkan akibat luka secara gamblang namun tetap bermartabat. 'Isi perut' lebih alami dalam bahasa Indonesia modern daripada istilah teknis atau sangat kasar.
- source_word: וְלֹא שָׁנָה לוֹ
  choice: Yoab tidak menikamnya untuk kedua kalinya
  rationale: Ungkapan Ibrani secara harfiah berarti bahwa Yoab tidak mengulanginya terhadap Amasa; tindakan yang tersirat dibuat eksplisit dari konteks. Nama Yoab menghindari kerancuan pronomina.
- source_word: וַיָּמֹת
  choice: Amasa pun mati
  rationale: Menjaga urutan narasi dan memperjelas subjek dalam bahasa Indonesia.
- source_word: רָדַף אַחֲרֵי
  choice: mengejar
  rationale: Padanan Indonesia yang lazim untuk pengejaran dalam konteks militer.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba anak Bikri
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
