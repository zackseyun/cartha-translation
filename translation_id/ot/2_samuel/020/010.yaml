  terminology: Nama Yoab, Abisai, Seba, dan Bikri konsisten dan lazim. 'Pedang,' 'perut,' dan 'isi perut' sesuai register. Catatan kaki mempertahankan alternatif leksikal tanpa menjadikannya makna utama.
