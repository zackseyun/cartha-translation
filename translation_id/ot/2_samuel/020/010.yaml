revisions:
- from: Namun Amasa tidak waspada terhadap pedang yang ada di tangan Yoab, lalu Yoab menikam perutnya dengan pedang itu[a] sehingga isi perutnya tertumpah ke tanah. Yoab tidak menikamnya untuk kedua kalinya, dan Amasa pun mati. Kemudian Yoab dan Abisai, saudaranya, mengejar Seba anak Bikri.
  to: Namun, Amasa tidak waspada terhadap pedang yang ada di tangan Yoab. Yoab menyerangnya dengan pedang itu pada perutnya[a], sehingga isi perut Amasa tertumpah ke tanah. Yoab tidak menyerangnya lagi, dan Amasa mati. Kemudian Yoab dan Abisai, saudaranya, mengejar Seba anak Bikri.
  rationale: Revisi kecil ini mempertahankan ketegasan dan gambaran kekerasan teks, tetapi memakai 'menyerangnya' untuk mencerminkan keluasan kata kerja Ibrani נכה, yang tidak dengan sendirinya menetapkan cara serangan sebagai tikaman. 'Pada perutnya' mencerminkan preposisi Ibrani dan tetap alami. Catatan kaki tetap diperlukan karena makna tepat חֹמֶשׁ diperdebatkan.
