base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/013.yaml
  text: As soon as he had been removed from the highway[a], every man passed on after Joab to pursue Sheba son of Bichri.
translation:
  language: id
  text: Segera setelah mayat itu disingkirkan dari jalan raya[a], semua orang bergerak maju mengikuti Yoab untuk mengejar Seba anak Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari jalan” atau “dari badan jalan.” Kata Ibrani מְסִלָּה dapat berarti jalan raya atau jalan utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Segera setelah
  rationale: Ungkapan ini memperkenalkan klausa waktu; konteks narasi menunjukkan bahwa pasukan langsung bergerak kembali sesudah penghalang disingkirkan.
- source_word: הֹגָה
  choice: mayat itu disingkirkan
  rationale: Bentuk Hofal menyatakan tindakan pasif, yaitu sesuatu dibuat berpindah. Nomina 'mayat' dijelaskan oleh konteks ayat sebelumnya dan membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: מִן הַמְסִלָּה
  choice: dari jalan raya
  rationale: מְסִלָּה dapat menunjuk pada jalan utama atau jalan yang ditinggikan; 'jalan raya' mempertahankan nuansa jalan utama tanpa menyiratkan jalan bebas hambatan modern.
- source_word: עָבַר
  choice: meneruskan perjalanan
  rationale: Dalam konteks ini verba tersebut menggambarkan pasukan yang kembali bergerak maju setelah penghalang disingkirkan.
- source_word: כָּל אִישׁ
  choice: semua prajurit
  rationale: Frasa singular distributif ini merujuk kepada seluruh anggota pasukan. 'Semua prajurit' alami dalam bahasa Indonesia dan mempertahankan konteks militernya.
- source_word: אַחֲרֵי יוֹאָב
  choice: mengikuti Yoab
  rationale: Preposisi ini menunjukkan bahwa pasukan bergerak di belakang atau sebagai pengikut Yoab; 'mengikuti' menyampaikan hubungan itu secara alami.
- source_word: לִרְדֹּף
  choice: untuk mengejar
  rationale: Infinitif menyatakan tujuan gerakan pasukan, sedangkan 'mengejar' sesuai dengan konteks pengejaran militer.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Seba anak Bikri
  rationale: Bentuk patronimik Ibrani dipertahankan langsung dan disajikan menurut ejaan nama Alkitab yang lazim dalam bahasa Indonesia.
