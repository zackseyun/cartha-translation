  terminology: Nama Yoab, Kereti, Peleti, Yerusalem, Syeba, dan Bikri ditransliterasikan secara konsisten. "Semua pahlawan" dapat menyampaikan גִּבֹּרִים dalam konteks pasukan dan merupakan diksi Alkitab Indonesia yang lazim. Catatan kaki pada Kereti berjangkar dengan benar dan memberi alternatif ejaan tanpa menafsirkan identitas kelompok itu secara spekulatif.
