  text: וַ/יֵּצְא֤וּ אַֽחֲרָי/ו֙ אַנְשֵׁ֣י יוֹאָ֔ב וְ/הַ/כְּרֵתִ֥י וְ/הַ/פְּלֵתִ֖י וְ/כָל הַ/גִּבֹּרִ֑ים וַ/יֵּֽצְאוּ֙ מִ/יר֣וּשָׁלִַ֔ם לִ/רְדֹּ֕ף אַחֲרֵ֖י שֶׁ֥בַע בֶּן בִּכְרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/007.yaml
  text: Joab’s men[a], the Kerethites, the Pelethites, and all the mighty men went out after him. They went out from Jerusalem to pursue Sheba son of Bichri.
translation:
  language: id
  text: Orang-orang Yoab, orang Kereti[a], orang Peleti, dan semua pahlawan berangkat mengikuti dia. Mereka keluar dari Yerusalem untuk mengejar Syeba anak Bikri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga sering ditulis “orang Kreti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ ... אַחֲרָיו
  choice: berangkat mengikuti dia
  rationale: Ungkapan ini menunjukkan bahwa pasukan bergerak mengikuti orang yang disebut dalam konteks. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan kata ganti yang referennya ditentukan oleh konteks.
- source_word: אַנְשֵׁי יוֹאָב
  choice: orang-orang Yoab
  rationale: Frasa konstruksi ini menunjuk kepada orang-orang yang berada di bawah pimpinan Yoab. Bentuk ini dekat dengan bahasa Ibrani dan wajar dalam bahasa Indonesia.
- source_word: הַכְּרֵתִי
  choice: orang Kereti
  rationale: Nama kelompok pasukan kerajaan ini ditransliterasikan, bukan diterjemahkan secara spekulatif.
- source_word: הַפְּלֵתִי
  choice: orang Peleti
  rationale: Nama kelompok yang lazim dipasangkan dengan orang Kereti dipertahankan sebagai transliterasi.
- source_word: כָל הַגִּבֹּרִים
  choice: semua pahlawan
  rationale: Dalam konteks militer, גִּבּוֹרִים menunjuk kepada para pejuang yang perkasa. 'Pahlawan' merupakan padanan Indonesia yang ringkas, bermartabat, dan lazim dalam teks Alkitab.
- source_word: מִירוּשָׁלִַם
  choice: dari Yerusalem
  rationale: Padanan langsung yang menyatakan titik keberangkatan.
- source_word: לִרְדֹּף אַחֲרֵי
  choice: untuk mengejar
  rationale: Konstruksi ini menyatakan tujuan, yakni mengejar seseorang; 'untuk mengejar' alami dan tepat dalam bahasa Indonesia.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Syeba anak Bikri
  rationale: Patronimik Ibrani dipertahankan dengan bentuk Indonesia yang ringkas dan lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Koordinasi daftar dipertahankan tanpa menambahkan hubungan yang tidak dinyatakan dalam teks Ibrani. Kata ganti 'dia' sengaja dipertahankan agar referennya tetap mengikuti konteks, sebagaimana dalam sumber.
