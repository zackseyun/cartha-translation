  source_fidelity: 'Teks Indonesia menyampaikan dua tindakan וַיֵּצְאוּ dengan tepat: rombongan orang Yoab bergerak mengikuti dia, lalu mereka keluar dari Yerusalem untuk mengejar Syeba anak Bikri. Kata ganti "dia" mempertahankan referen yang tidak dijelaskan ulang dalam ayat Ibrani. "Berangkat mengikuti" merupakan padanan idiomatis yang memadai untuk יצא ... אחרי, dan "untuk mengejar" tepat untuk לִרְדֹּף אַחֲרֵי.'
