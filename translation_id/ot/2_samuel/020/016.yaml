  text: Then a wise woman called out from the city, “Listen! Listen! Please tell Joab, ‘Come near to here, so that I may speak with you.’”
translation:
  language: id
  text: Lalu seorang perempuan bijaksana berseru dari kota itu, “Dengarlah! Dengarlah! Tolong sampaikan kepada Yoab, ‘Mendekatlah ke sini supaya aku dapat berbicara denganmu.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה חֲכָמָה
  choice: seorang perempuan bijaksana
  rationale: Menerjemahkan ungkapan Ibrani secara langsung dan wajar, dengan mempertahankan sifat kebijaksanaan tokoh tersebut.
- source_word: מִן הָעִיר
  choice: dari dalam kota itu
  rationale: Konteks pengepungan menunjukkan bahwa perempuan itu berseru dari dalam kota; kata 'itu' menandai kota yang telah disebut dalam konteks.
- source_word: שִׁמְעוּ שִׁמְעוּ
  choice: Dengarlah! Dengarlah!
  rationale: Pengulangan imperatif dipertahankan untuk menyampaikan seruan mendesak kepada para pendengar.
- source_word: אִמְרוּ נָא
  choice: Tolong katakan
  rationale: Partikel נָא menyampaikan permohonan sopan; 'tolong' alami dalam bahasa Indonesia modern.
- source_word: קְרַב עַד הֵנָּה
  choice: Mendekatlah ke sini
  rationale: Menyampaikan perintah agar Yoab datang mendekati tempat perempuan itu tanpa ungkapan Indonesia yang kaku.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: supaya aku dapat berbicara denganmu
  rationale: 'Bentuk kohortatif dalam rangkaian ini menyatakan tujuan: perempuan itu meminta Yoab mendekat agar ia dapat berbicara kepadanya.'
