  text: So Amasa went to summon Judah[a], but he delayed beyond the appointed time that he had set for him.
translation:
  language: id
  text: Lalu Amasa pergi untuk memanggil orang-orang Yehuda agar berkumpul[a], tetapi ia terlambat melewati waktu yang telah ditetapkan Daud baginya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk mengerahkan orang-orang Yehuda.” Kata Ibrani ini dapat berarti memanggil orang-orang agar segera berkumpul dan, dalam konteks ini, kemungkinan mencakup pengerahan pasukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif dari הלך menyatakan tindakan Amasa berikutnya; “pergi” merupakan padanan Indonesia yang alami dan langsung.
- source_word: לְהַזְעִיק
  choice: untuk memanggil ... agar berkumpul
  rationale: Bentuk Hifil dari זעק di sini berarti memanggil orang-orang supaya segera berkumpul. Ungkapan ini mempertahankan unsur penghimpunan tanpa membatasi maknanya hanya pada pengerahan militer.
- source_word: אֶת יְהוּדָה
  choice: orang-orang Yehuda
  rationale: “Yehuda” dipakai secara kolektif bagi penduduk atau pasukan Yehuda. Dalam bahasa Indonesia, “orang-orang Yehuda” memperjelas bahwa yang dipanggil adalah manusianya, bukan wilayahnya.
- source_word: וייחר
  choice: ia terlambat
  rationale: Dalam konteks ini אחר menunjukkan bahwa Amasa melewati batas waktu yang ditentukan; “terlambat” lebih alami daripada ungkapan harfiah seperti “berlambat-lambat”.
- source_word: מִן הַמּוֹעֵד
  choice: melampaui waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu yang ditentukan, sedangkan מִן setelah אחר menyatakan bahwa batas itu terlewati.
- source_word: אֲשֶׁר יְעָדוֹ
  choice: yang telah ditetapkan Daud baginya
  rationale: יעד berarti menetapkan, dengan akhiran orang ketiga tunggal maskulin yang merujuk kepada Amasa. Subjek tersiratnya paling wajar adalah Daud dari ayat sebelumnya; nama Daud dinyatakan agar rujukan pronominal alami dan jelas dalam bahasa Indonesia.
