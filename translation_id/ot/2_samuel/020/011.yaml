translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Anak buah” dipakai dalam arti bawahan pasukan. Nama Amasa dieksplisitkan agar rujukan pronomina Ibrani jelas dalam bahasa Indonesia; “mayat” mengikuti konteks langsung bahwa Amasa telah mati.
