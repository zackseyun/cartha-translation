  to: Salah seorang anak buah Yoab berdiri di sisi Amasa dan berkata, “Siapa yang mendukung Yoab dan siapa yang berpihak kepada Daud, ikutlah Yoab!”[a]
  rationale: Revisi menghilangkan tambahan “mayat” yang tidak eksplisit dalam ayat, sambil tetap menyebut Amasa untuk memperjelas rujukan pronomina berdasarkan konteks langsung. “Di sisi” lebih baik mempertahankan gambaran עָמַד עָלָיו daripada “di dekat,” dan pembukaan diperhalus agar lebih idiomatis. Catatan kaki tetap ditempatkan pada seruan akhir dan secara tepat menjelaskan elipsis “di belakang Yoab.”
