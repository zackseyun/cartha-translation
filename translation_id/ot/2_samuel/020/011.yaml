  text: And one of Joab’s young men stood over him and said[a], “Whoever favors Joab, and whoever is for David[b], follow Joab!”
translation:
  language: id
  text: Salah seorang anak buah Yoab berdiri di sisi Amasa dan berkata, “Siapa yang mendukung Yoab dan siapa yang berpihak kepada Daud, ikutlah Yoab!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian terakhir berbunyi, “di belakang Yoab.” Dalam konteks ini, ungkapan tersebut merupakan ajakan untuk mengikuti Yoab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ ... מִנַּעֲרֵי יוֹאָב
  choice: Seorang dari antara anak buah Yoab
  rationale: אִישׁ menyatakan seorang yang tidak disebut namanya, sedangkan נַעַר dalam konteks pasukan dapat berarti bawahan atau pengikut, bukan semata-mata pemuda. “Anak buah” wajar dalam bahasa Indonesia dan cocok dengan konteks militer.
- source_word: עָמַד עָלָיו
  choice: berdiri di dekat mayat Amasa
  rationale: עמד dengan על dapat berarti berdiri di atas, di dekat, atau di sisi seseorang. Konteks ayat sebelumnya menunjukkan bahwa pronomina itu merujuk kepada Amasa yang sudah tewas; penyebutan eksplisit menghindari pronomina Indonesia yang kabur tanpa memaksakan bahwa orang itu secara harfiah menginjak atau tepat berada di atas tubuhnya.
- source_word: מִי אֲשֶׁר חָפֵץ בְּיוֹאָב
  choice: Siapa yang mendukung Yoab
  rationale: חָפֵץ pada seruan penghimpunan ini menyatakan keberpihakan atau dukungan kepada Yoab. “Mendukung” menyampaikan maksudnya secara alami tanpa nuansa harfiah “menyenangi” yang dapat disalahpahami.
- source_word: וּמִי אֲשֶׁר לְדָוִד
  choice: dan siapa yang berpihak kepada Daud
  rationale: לְדָוִד menyatakan kepunyaan, kesetiaan, atau keberpihakan kepada Daud. “Berpihak kepada” mempertahankan nuansa politik dan militer.
- source_word: אַחֲרֵי יוֹאָב
  choice: ikutlah Yoab
  rationale: Secara harfiah frasa ini berarti “di belakang/sesudah Yoab,” tetapi sebagai seruan eliptis artinya adalah mengikuti Yoab. Bentuk imperatif “ikutlah” membuat seruan itu lengkap dan alami dalam bahasa Indonesia.
