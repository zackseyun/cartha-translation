  text: and Sheva was secretary[a], and Zadok and Abiathar were priests.
translation:
  language: id
  text: Dan Syeva adalah sekretaris[a], dan Zadok serta Abyatar adalah imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "juru tulis." Istilah Ibrani ini dapat menunjuk kepada juru tulis kerajaan atau sekretaris; di sini "sekretaris" dipakai untuk memperjelas jabatan administratif tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שיא
  choice: Syewa
  rationale: Nama diri ditransliterasikan langsung dari bentuk konsonantal teks WLC; bentuk ini dapat dibandingkan dengan variasi nama dalam daftar pejabat yang sejajar, tetapi teks ayat ini paling wajar diwakili sebagai Syewa.
- source_word: סֹפֵר
  choice: sekretaris
  rationale: Kata ini menunjuk kepada pejabat tulis-menulis atau kesekretariatan dalam pemerintahan kerajaan. 'Sekretaris' menjelaskan fungsi administratifnya dalam bahasa Indonesia modern, sementara 'juru tulis' dipertahankan sebagai alternatif dalam catatan kaki.
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶבְיָתָר
  choice: Abyatar
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: כֹּהֲנִים
  choice: imam
  rationale: Padanan baku bagi bentuk jamak yang menyatakan jabatan keimaman Zadok dan Abyatar; bahasa Indonesia tidak perlu menandai jamak secara morfologis karena dua nama sudah menjelaskannya.
- source_word: וְ
  choice: dan; sedangkan
  rationale: Konjungsi yang berulang menghubungkan unsur-unsur daftar. Variasi 'sedangkan' pada klausa kedua membuat susunan daftar alami dalam bahasa Indonesia tanpa mengubah hubungan koordinatifnya.
