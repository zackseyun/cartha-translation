  text: And Ira the Jairite also was priest to David[a].
translation:
  language: id
  text: Dan Ira, orang Yair itu, juga adalah imam bagi Daud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat utama” atau “penasihat kerajaan”. Kata Ibrani ini secara harfiah berarti “imam”, tetapi dalam beberapa konteks kerajaan mungkin menunjuk seorang pejabat tinggi istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Gabungan kata penghubung dan partikel penambah menyatakan kelanjutan sekaligus penambahan. Dalam bahasa Indonesia, “juga” secara alami mempertahankan nuansa penambah; hubungan dengan daftar sebelumnya sudah tersirat oleh konteks.
- source_word: עִירָא
  choice: Ira
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: הַיָּאִרִי
  choice: orang Yair itu
  rationale: Bentuk nisbah ini menunjukkan hubungan dengan Yair, yang dapat berupa asal-usul atau keanggotaan kaum. “Orang Yair” mempertahankan hubungan tersebut tanpa mempersempitnya menjadi keturunan biologis semata.
- source_word: הָיָה
  choice: menjadi
  rationale: Dalam pemberitahuan mengenai jabatan, bentuk lampau dari היה menyatakan bahwa Ira berkedudukan atau bertugas demikian. “Menjadi” terdengar alami dalam bahasa Indonesia tanpa harus menyiratkan secara tegas saat pengangkatannya.
- source_word: כֹהֵן
  choice: imam
  rationale: Makna leksikal langsung kata Ibrani ini adalah “imam”. Kemungkinan bahwa kata itu menunjuk pejabat tinggi istana dipertahankan dalam catatan kaki, bukan dimasukkan sebagai penyempitan interpretatif ke dalam teks utama.
- source_word: לְדָוִד
  choice: bagi Daud
  rationale: Preposisi ל menyatakan hubungan atau pelayanan kepada Daud. “Bagi Daud” alami dalam bahasa Indonesia dan tetap membiarkan fungsi tepat Ira terbuka.
theological_decisions:
- issue: Makna כֹהֵן dalam konteks istana kerajaan
  choice: Mempertahankan “imam” dalam teks utama
  alternative: pejabat utama; penasihat kerajaan
  rationale: Walaupun dalam beberapa konteks kerajaan istilah ini mungkin menunjuk pejabat tinggi yang dekat dengan raja, arti dasarnya adalah “imam”. Teks utama mempertahankan arti langsung tersebut, sedangkan kemungkinan fungsi administratif dicatat sebagai alternatif agar ketegangan dan ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mengikuti gaya daftar pejabat, sambil menghindari istilah denominasi dan tidak memastikan fungsi istana yang masih ambigu.
