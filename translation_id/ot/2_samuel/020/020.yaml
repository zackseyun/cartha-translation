  text: Yoab menjawab, “Jauh dari padaku, jauh dari padaku, bahwa aku menelan atau membinasakan!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן יוֹאָב וַיֹּאמַר
  choice: Yoab menjawab
  rationale: Rangkaian verba naratif Ibrani secara harfiah berbunyi ‘Yoab menjawab dan berkata’. Dalam bahasa Indonesia, ‘menjawab’ sudah memperkenalkan ujaran secara alami tanpa mengubah fungsi naratifnya.
- source_word: חָלִילָה חָלִילָה לִי
  choice: Pantang bagiku, pantang bagiku
  rationale: Ungkapan ini menyatakan penolakan yang sangat tegas. Pengulangan dipertahankan untuk membawa penekanan teks Ibrani, sedangkan ‘pantang bagiku’ menyampaikan bahwa tindakan tersebut sama sekali tidak dapat diterima oleh Yoab.
- source_word: אִם ... וְאִם
  choice: menelan atau
  rationale: Sesudah חָלִילָה, partikel אִם memperkenalkan tindakan yang ditolak, bukan syarat biasa. Dalam bahasa Indonesia, konstruksi infinitif setelah ‘pantang bagiku’ menyampaikan hubungan itu secara wajar, dan וְאִם menghubungkan tindakan kedua sebagai alternatif sejajar.
- source_word: אֲבַלַּע
  choice: menelan
  rationale: Verba בלע secara harfiah berarti ‘menelan’. Pilihan ini mempertahankan gambaran hidup dalam bahasa Ibrani, yang dalam konteks pengepungan bermakna menghabisi atau melindas.
- source_word: אַשְׁחִית
  choice: membinasakan
  rationale: Bentuk Hifil dari שׁחת berarti menyebabkan kehancuran atau membinasakan. ‘Membinasakan’ jelas dan sesuai dengan konteks ancaman militer.
