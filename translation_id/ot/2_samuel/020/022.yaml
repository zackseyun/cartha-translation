base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/022.yaml
  text: Then the woman went to all the people in her wisdom[a], and they cut off the head of Sheba son of Bichri and threw it to Joab. Then he blew the trumpet, and they dispersed from the city, each man to his tent; and Joab returned to Jerusalem to the king.
translation:
  language: id
  text: Lalu perempuan itu mendatangi seluruh rakyat dengan kebijaksanaannya. Mereka memenggal kepala Syeba bin Bikri dan melemparkannya kepada Yoab. Kemudian Yoab meniup sangkakala, lalu mereka berpencar menjauhi kota itu, masing-masing pergi ke kemahnya.[a] Yoab pun kembali ke Yerusalem menghadap raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang ke kemahnya”; ungkapan baku untuk membubarkan diri dan kembali ke tempat masing-masing.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה
  choice: perempuan itu menemui
  rationale: Bentuk בוא dapat berarti datang atau pergi menurut sudut pandang. Dalam alur ini, “menemui” secara alami menyatakan gerak perempuan itu kepada seluruh rakyat tanpa memaksakan sudut pandang ruang.
- source_word: אֶל כָּל הָעָם
  choice: seluruh rakyat
  rationale: עָם merujuk secara luas kepada orang-orang kota yang terlibat dalam tanggapan itu; “rakyat” tetap netral dan sesuai konteks.
- source_word: בְּחָכְמָתָהּ
  choice: dengan kebijaksanaannya
  rationale: Mempertahankan unsur nomina dan nuansa cara atau sarana pada preposisi ב, sekaligus menghasilkan bahasa Indonesia yang wajar.
- source_word: וַיִּכְרְתוּ אֶת רֹאשׁ
  choice: memenggal kepala
  rationale: Dalam konteks kepala sebagai objek, frasa ini menyatakan pemenggalan; ungkapan Indonesia ini jelas dan langsung.
- source_word: שֶׁבַע בֶּן בִּכְרִי
  choice: Syeba bin Bikri
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan patronimik Ibrani.
- source_word: וַיַּשְׁלִכוּ אֶל יוֹאָב
  choice: melemparkannya kepada Yoab
  rationale: Menyampaikan tindakan dan arah atau penerima secara alami; pronomina merujuk kepada kepala yang baru disebut.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Yoab meniup sangkakala
  rationale: Subjek tunggal paling dekat secara konteks adalah Yoab. “Sangkakala” merupakan padanan Indonesia yang dikenal untuk שׁוֹפָר.
- source_word: וַיָּפֻצוּ מֵעַל הָעִיר
  choice: orang-orangnya membubarkan diri dari kota itu
  rationale: Kata kerja menyatakan pasukan yang berpencar setelah pengepungan dihentikan. “Orang-orangnya” memperjelas rujukan jamak kepada pasukan Yoab tanpa menyiratkan kepanikan.
- source_word: אִישׁ לְאֹהָלָיו
  choice: masing-masing pulang ke kemahnya
  rationale: Menerjemahkan idiom secara dekat dan alami; catatan kaki menjelaskan bahwa ungkapan itu dapat berarti kembali ke tempat masing-masing.
- source_word: וְיוֹאָב שָׁב יְרוּשָׁלִַם אֶל הַמֶּלֶךְ
  choice: Yoab pun kembali ke Yerusalem menghadap raja
  rationale: “Menghadap raja” secara idiomatis menyampaikan gerak אל menuju kehadiran raja, tanpa menambahkan isi pertemuan.
