revisions:
- from: Lalu perempuan itu menemui seluruh rakyat dengan kebijaksanaannya. Mereka memenggal kepala Syeba bin Bikri dan melemparkannya kepada Yoab. Kemudian Yoab meniup sangkakala, lalu orang-orangnya membubarkan diri dari kota itu dan masing-masing pulang ke kemahnya.[a] Yoab pun kembali ke Yerusalem menghadap raja.
  to: Lalu perempuan itu mendatangi seluruh rakyat dengan kebijaksanaannya. Mereka memenggal kepala Syeba bin Bikri dan melemparkannya kepada Yoab. Kemudian Yoab meniup sangkakala, lalu mereka berpencar menjauhi kota itu, masing-masing pergi ke kemahnya.[a] Yoab pun kembali ke Yerusalem menghadap raja.
  rationale: Revisi menghilangkan tambahan kepemilikan pada subjek jamak dan memperjelas bahwa kelompok itu menarik diri dari kota yang dikepung. Struktur naratif, nama-nama, tindakan kekerasan yang dinyatakan sumber, dan idiom tentang kembali ke kemah tetap dipertahankan.
