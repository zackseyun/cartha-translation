translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah ungkapan yang benar-benar dijelaskannya.
