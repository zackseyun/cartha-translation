source:
  edition: WLC
  text: וַ/יָּבֹ֨א דָוִ֣ד אֶל בֵּית/וֹ֮ יְרֽוּשָׁלִַם֒ וַ/יִּקַּ֣ח הַ/מֶּ֡לֶךְ אֵ֣ת עֶֽשֶׂר נָשִׁ֣ים פִּלַגְשִׁ֡ים אֲשֶׁ֣ר הִנִּיחַ֩ לִ/שְׁמֹ֨ר הַ/בַּ֜יִת וַֽ/יִּתְּנֵ֤/ם בֵּית מִשְׁמֶ֨רֶת֙ וַֽ/יְכַלְכְּלֵ֔/ם וַ/אֲלֵי/הֶ֖ם לֹא בָ֑א וַ/תִּהְיֶ֧ינָה צְרֻר֛וֹת עַד י֥וֹם מֻתָ֖/ן אַלְמְנ֥וּת חַיּֽוּת־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/020/003.yaml
  text: When David came to his house at Jerusalem[a], the king took the ten women, the concubines whom he had left to keep the house, and put them in guarded custody and provided for them, but he did not go in to them. So they were kept confined until the day of their death[c][b], living as widows.
translation:
  language: id
  text: Ketika Daud tiba di istananya di Yerusalem, raja itu mengambil kesepuluh gundik yang telah ditinggalkannya untuk menjaga istana itu. Ia menempatkan mereka dalam rumah tahanan[a] dan mencukupi kebutuhan mereka, tetapi tidak menghampiri mereka[b]. Demikianlah mereka tetap dikurung sampai hari kematian mereka, hidup sebagai janda[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah penjagaan” atau “rumah penahanan.”
    reason: lexical_alternative
  - marker: b
    text: “Menghampiri mereka” adalah ungkapan halus bahasa Ibrani untuk melakukan hubungan seksual.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah, ungkapan Ibraninya berarti kira-kira “kejandaan selagi hidup”: mereka hidup seperti janda meskipun Daud masih hidup.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: istananya
  rationale: Dalam konteks kediaman kerajaan Daud di Yerusalem, 'istana' menyampaikan makna kontekstual בַּיִת secara alami; 'rumahnya' juga mungkin, tetapi kurang menunjukkan konteks kerajaan.
- source_word: פִּלַגְשִׁים
  choice: gundik
  rationale: Istilah ini menunjuk pada perempuan yang diakui dalam rumah tangga sebagai pasangan dengan status perkawinan lebih rendah; 'gundik' adalah padanan Indonesia yang ringkas dan lazim dalam konteks Alkitab.
- source_word: הִנִּיחַ לִשְׁמֹר הַבַּיִת
  choice: ditinggalkannya untuk menjaga istana itu
  rationale: שׁמר berarti menjaga atau mengawasi; terjemahan ini mempertahankan tugas yang diberikan kepada para perempuan itu dan memahami הַבַּיִת sebagai kediaman kerajaan.
- source_word: בֵּית מִשְׁמֶרֶת
  choice: rumah tahanan
  rationale: Secara harfiah berarti 'rumah penjagaan/penahanan' dan menunjukkan tempat pengurungan di bawah pengawasan. Padanan ini lebih konkret daripada sekadar 'tahanan'.
- source_word: וַיְכַלְכְּלֵם
  choice: mencukupi kebutuhan mereka
  rationale: Kata kerja ini berarti menopang atau menyediakan kebutuhan hidup; frasa Indonesia ini alami dan menyatakan pemeliharaan materi secara berkelanjutan.
- source_word: וַאֲלֵיהֶם לֹא בָא
  choice: tidak lagi menghampiri mereka
  rationale: Ungkapan Ibrani בוא אל merupakan eufemisme hubungan seksual dalam konteks ini. 'Menghampiri' mempertahankan sifat eufemistisnya, sedangkan 'lagi' wajar secara kontekstual karena mereka adalah gundik Daud, tanpa menyatakan lebih dari kelanjutan hubungan yang dihentikan.
- source_word: צְרֻרוֹת
  choice: tetap dikurung
  rationale: Partisip pasif ini menggambarkan keadaan berkelanjutan sebagai orang yang ditutup atau dikurung; 'tetap' mempertahankan daya resultatif dan duratifnya.
- source_word: עַד יוֹם מֻתָן
  choice: sampai hari kematian mereka
  rationale: Terjemahan langsung yang mempertahankan konstruksi nominal bahasa Ibrani.
- source_word: אַלְמְנוּת חַיּוּת
  choice: menjalani hidup sebagai janda
  rationale: Ungkapan Ibrani yang tidak biasa ini secara harfiah berkenaan dengan 'kejandaan selagi hidup'; pilihan ini menyampaikan paradoks bahwa mereka hidup seperti janda meskipun Daud masih hidup.
theological_decisions:
- issue: Penilaian moral dan status sosial atas perlakuan Daud terhadap para gundiknya
  choice: 'Menerjemahkan secara deskriptif dan mempertahankan kerasnya keadaan mereka: ditahan, dinafkahi, tidak lagi digauli, dan hidup seperti janda.'
  alternative: Menggambarkannya semata-mata sebagai perlindungan, atau menambahkan kecaman moral yang tidak dinyatakan secara eksplisit dalam ayat.
  rationale: Teks menceritakan tindakan Daud dan akibatnya bagi para perempuan tanpa memberikan penilaian moral langsung. Terjemahan tidak boleh membenarkan ataupun menambahkan penghukuman yang tidak tertulis.
- issue: Makna eufemistis וַאֲלֵיהֶם לֹא בָא
  choice: Mempertahankan eufemisme dalam teks utama dengan 'tidak lagi menghampiri mereka' dan menjelaskannya dalam catatan kaki.
  alternative: Menerjemahkan secara eksplisit 'tidak lagi berhubungan seksual dengan mereka'.
  rationale: Bentuk eufemistis sumber patut dipertahankan, tetapi pembaca modern perlu dibantu agar maknanya tidak terlewat.
- issue: Keadaan אַלְמְנוּת חַיּוּת
  choice: Menyatakan bahwa mereka menjalani hidup sebagai janda, bukan bahwa mereka secara hukum benar-benar menjadi janda.
  alternative: Menerjemahkan 'menjadi janda' tanpa penjelasan.
  rationale: Daud masih hidup; ungkapan tersebut secara paradoks menggambarkan keadaan seperti janda, bukan kematian suami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Istana' dipakai untuk kediaman kerajaan agar konteks jelas; 'rumah tahanan' mempertahankan citra konkret bahasa Ibrani. Susunan kalimat dibuat lancar bagi pembaca umum tanpa melunakkan pengurungan para perempuan tersebut.
