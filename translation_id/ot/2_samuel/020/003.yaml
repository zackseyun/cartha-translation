  naturalness: Bahasanya umumnya baku dan jelas. "Raja itu" sedikit lebih alami daripada pengulangan "raja" setelah nama Daud. "Hidup sebagai janda" lebih ringkas dan alami daripada "menjalani hidup sebagai janda", sambil tetap mempertahankan bahwa ini adalah keadaan seperti janda, bukan status janda literal.
  terminology: '"Gundik", "istana", "rumah tahanan", dan "mencukupi kebutuhan mereka" merupakan pilihan yang dapat diterima dalam konteks ini. "Rumah tahanan" menyampaikan unsur tempat pengurungan dalam בֵּית מִשְׁמֶרֶת, dan catatan kaki secara tepat mencatat harfiahnya. Catatan tentang eufemisme dan "kejandaan selagi hidup" juga sesuai.'
