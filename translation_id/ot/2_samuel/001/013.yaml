  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל הַ/נַּ֨עַר֙ הַ/מַּגִּ֣יד ל֔/וֹ אֵ֥י מִ/זֶּ֖ה אָ֑תָּה וַ/יֹּ֕אמֶר בֶּן אִ֛ישׁ גֵּ֥ר עֲמָלֵקִ֖י אָנֹֽכִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/013.yaml
  text: David said to the young man who told him[a], “Where are you from?” And he said, “I am the son of an Amalekite sojourner.”
translation:
  language: id
  text: Daud berkata kepada orang muda yang menyampaikan kabar itu kepadanya, “Dari mana asalmu?” Ia menjawab, “Aku anak seorang pendatang, seorang Amalek.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku anak seorang pendatang; aku orang Amalek.” Frasa Ibrani ini dapat dipahami sebagai mengidentifikasi ayahnya sebagai seorang pendatang yang adalah orang Amalek, atau sebagai mengaitkan si pembicara sendiri—melalui keturunannya—dengan seorang pendatang Amalek.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: orang muda
  rationale: Kata נַעַר menunjuk kepada seorang laki-laki muda dan tidak dengan sendirinya menyatakan bahwa ia seorang pelayan. “Orang muda” alami dan sesuai dengan konteks.
- source_word: הַמַּגִּיד לוֹ
  choice: yang menyampaikan kabar itu kepadanya
  rationale: Partisipel dari נגד mengidentifikasi dia sebagai pembawa berita kepada Daud. Frasa ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֵי מִזֶּה
  choice: Dari mana asalmu?
  rationale: Ungkapan tanya ini menanyakan tempat atau latar asal seseorang. Bentuk ini wajar dalam bahasa Indonesia modern.
- source_word: בֶּן אִישׁ
  choice: anak seorang
  rationale: Frasa konstruksi ini secara harfiah berarti “anak seorang laki-laki”; dalam bahasa Indonesia, “anak seorang” mempertahankan hubungan keturunan tanpa kekakuan yang tidak perlu.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang tinggal di negeri atau di tengah masyarakat lain. “Pendatang” mudah dipahami dan tidak membawa konotasi hukum modern yang berlebihan.
- source_word: עֲמָלֵקִי
  choice: Amalek
  rationale: Dalam frasa “pendatang Amalek”, nama etnis ini secara alami menerangkan asal pendatang tersebut. Bentuk “Amalek” lazim sebagai penanda bangsa dalam bahasa Indonesia.
- source_word: אָנֹכִי
  choice: Aku
  rationale: Kata ganti mandiri ini menegaskan pengenalan diri si pembicara; kopula tidak diperlukan dalam kalimat nominal bahasa Indonesia.
theological_decisions:
- issue: Hubungan sintaksis עֲמָלֵקִי dengan גֵּר dan identitas si pembicara
  choice: Teks utama memahami frasa itu sebagai “anak seorang pendatang Amalek”, sehingga ayahnya diidentifikasi sebagai pendatang asal Amalek.
  alternative: Frasa itu dapat dipahami lebih luas sebagai “anak seorang pendatang asing; aku orang Amalek”, yang mengaitkan sebutan Amalek secara langsung dengan si pembicara.
  rationale: Urutan kata Ibrani memungkinkan lebih dari satu pengelompokan sintaksis. Terjemahan utama mengikuti pembacaan yang paling langsung, sedangkan catatan kaki mempertahankan ambiguitas mengenai apakah “orang Amalek” terutama menerangkan sang ayah atau si pembicara.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang muda” menghindari dugaan status pelayan, sedangkan “pendatang” menyampaikan kedudukan גֵּר tanpa memakai istilah yang terasa kuno. Penanda catatan kaki ditempatkan langsung sesudah frasa yang memiliki ambiguitas.
