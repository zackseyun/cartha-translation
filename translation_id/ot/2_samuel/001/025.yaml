base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/025.yaml
  text: How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights[a].
translation:
  language: id
  text: Betapa para pahlawan telah gugur di tengah pertempuran! Yonatan tewas di tempat-tempat tinggimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bukit-bukitmu”. Ungkapan Ibrani ini dapat menunjuk kepada daerah yang tinggi; dalam ratapan ini, kemungkinan besar negeri Israel disapa secara puitis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Betapa
  rationale: Memperkenalkan seruan ratapan, bukan pertanyaan. “Betapa” mempertahankan daya puitis dan seruan emosionalnya dalam bahasa Indonesia.
- source_word: נָפְלוּ
  choice: telah gugur
  rationale: Bentuk perfektif menyatakan peristiwa yang sudah terjadi; “gugur” wajar bagi kematian para pejuang dan mempertahankan citra jatuh dalam ratapan.
- source_word: גִבֹּרִים
  choice: para pahlawan
  rationale: Merujuk kepada orang-orang perkasa dan gagah berani. “Para pahlawan” alami dalam ratapan kepahlawanan tanpa menentukan pangkat militer.
- source_word: בְּתוֹךְ הַמִּלְחָמָה
  choice: di tengah pertempuran
  rationale: Mempertahankan nuansa berada di tengah berlangsungnya konflik, bukan sekadar ‘dalam perang’ secara umum.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַל
  choice: di
  rationale: Preposisi lokatif ini secara alami diterjemahkan “di” sebelum frasa tempat dalam bahasa Indonesia.
- source_word: בָּמוֹתֶיךָ
  choice: tempat-tempat tinggimu
  rationale: Menjaga bentuk jamak, citra topografis, dan sufiks orang kedua tunggal. Pilihan ini juga mempertahankan kemungkinan leksikal ‘bukit-bukit/tempat-tempat tinggi’ tanpa langsung memberi makna kultis.
- source_word: חָלָל
  choice: terbunuh
  rationale: Menunjuk kepada orang yang dibunuh atau tewas, bukan sekadar terluka. Predikat “terbunuh” menyampaikan daya predikatif yang tersirat sesudah nama Yonatan.
theological_decisions:
- issue: Rujukan sufiks orang kedua tunggal pada בָּמוֹתֶיךָ
  choice: Dipertahankan sebagai ‘tempat-tempat tinggimu’, dengan kemungkinan sapaan puitis kepada negeri Israel
  alternative: Tempat-tempat tinggi milik Yonatan sendiri, atau secara lebih khusus bukit-bukit Israel
  rationale: Konteks ratapan mendukung personifikasi negeri atau bentang alam Israel, tetapi ayat ini sendiri tidak menyebut referennya secara eksplisit. Terjemahan mempertahankan sufiks Ibrani dan catatan menjelaskan kemungkinan rujukannya tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan khidmat. Paralelisme ratapan dipertahankan, sedangkan ‘Betapa’ menandai seruan emosional. Bentuk ‘tempat-tempat tinggimu’ dipilih untuk menjaga ambiguitas teks Ibrani; catatan kaki memberi padanan topografis yang lebih alami.
