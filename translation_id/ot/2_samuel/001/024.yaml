  register: Bahasa puitis dan bermartabat dipertahankan melalui sapaan “Hai putri-putri Israel” dan ungkapan “merah kirmizi nan mewah,” tetapi susunan kalimat dibuat alami bagi pembaca Indonesia modern. Pemenggalan baris mengikuti kesejajaran puisi ratapan Ibrani.
