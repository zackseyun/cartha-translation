  text: בְּנוֹת֙ יִשְׂרָאֵ֔ל אֶל שָׁא֖וּל בְּכֶ֑ינָה הַ/מַּלְבִּֽשְׁ/כֶ֤ם שָׁנִי֙ עִם עֲדָנִ֔ים הַֽ/מַּעֲלֶה֙ עֲדִ֣י זָהָ֔ב עַ֖ל לְבוּשְׁ/כֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/024.yaml
  text: Daughters of Israel[a], weep over Saul, who clothed you in scarlet with luxuries[b], who put ornaments of gold on your clothing.
translation:
  language: id
  text: 'Hai putri-putri Israel, menangislah karena Saul,


    yang memakaikan pakaian kirmizi dengan kemewahan[a] kepada kalian,


    yang menaruh perhiasan emas[b] pada pakaian kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “dengan kenikmatan,” “dengan pakaian indah,” atau “dengan perhiasan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “perhiasan dari emas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: putri-putri Israel
  rationale: Mempertahankan sapaan langsung dan citra puitis harfiah bahasa Ibrani; dalam konteks ini ungkapan tersebut ditujukan kepada kaum perempuan Israel.
- source_word: אֶל שָׁאוּל
  choice: karena Saul
  rationale: Dengan seruan untuk menangis atau meratap, אֶל menandai Saul sebagai orang yang kematiannya menjadi sebab ratapan. 'Karena Saul' wajar dalam bahasa Indonesia dan tidak menyiratkan bahwa tangisan diarahkan kepadanya.
- source_word: בְּכֶינָה
  choice: menangislah
  rationale: Bentuk imperatif feminin jamak menyerukan para perempuan Israel untuk menangisi Saul; 'menangislah' jelas, alami, dan sesuai dengan konteks nyanyian ratapan.
- source_word: הַמַּלְבִּשְׁכֶם שָׁנִי
  choice: yang mengenakan pakaian merah kirmizi ... kepada kalian
  rationale: Partisipel berartikel merujuk kembali kepada Saul. 'Merah kirmizi' menyampaikan warna atau kain mahal yang dimaksud שָׁנִי, sedangkan konstruksi 'mengenakan ... kepada kalian' mempertahankan Saul sebagai pemberi pakaian.
- source_word: עִם עֲדָנִים
  choice: nan mewah
  rationale: עֲדָנִים dapat menunjuk pada kemewahan, kesenangan, pakaian indah, atau perhiasan. 'Nan mewah' menghasilkan baris Indonesia yang alami sambil menghubungkannya dengan pakaian merah kirmizi; keluasan maknanya dicatat dalam catatan kaki.
- source_word: הַמַּעֲלֶה עֲדִי זָהָב
  choice: yang menghiasi ... dengan perhiasan emas
  rationale: Secara idiomatis, עלה di sini berarti menaruh atau memasang di atas, sedangkan עֲדִי זָהָב adalah perhiasan dari emas. 'Menghiasi ... dengan' menyampaikan tindakan itu secara alami tanpa menghilangkan bendanya.
- source_word: עַל לְבוּשְׁכֶן
  choice: pakaian kalian
  rationale: Menunjukkan bahwa perhiasan emas itu dipasang pada pakaian para perempuan; 'pakaian' merupakan padanan modern dan luas bagi לְבוּשׁ.
