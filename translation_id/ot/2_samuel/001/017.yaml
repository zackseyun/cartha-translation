  text: Then David sang this lament over Saul and over Jonathan his son,[a]
translation:
  language: id
  text: Lalu Daud melantunkan ratapan ini atas Saul dan atas Yonatan, anak Saul:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “meratapkan ratapan ini”; kata kerja dan kata benda Ibrani membentuk ungkapan resmi untuk menyampaikan ratapan kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: Lalu ... melantunkan ratapan
  rationale: Kata kerja קונן menunjuk pada tindakan menyampaikan atau membawakan ratapan resmi. “Melantunkan ratapan” mengungkapkan sifat performatifnya tanpa secara tegas menambahkan bahwa ratapan itu dinyanyikan.
- source_word: הַקִּינָה הַזֹּאת
  choice: ratapan ini
  rationale: קִינָה adalah ratapan resmi, khususnya bagi orang mati; penunjuk הַזֹּאת diterjemahkan langsung sebagai “ini”.
- source_word: עַל
  choice: atas
  rationale: Dalam konteks perkabungan, עַל menandai orang yang menjadi pokok ratapan. “Atas” mempertahankan hubungan ini secara ringkas dan wajar dalam ragam bahasa yang bermartabat.
- source_word: שָׁאוּל
  choice: Saul
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal merujuk kepada Saul dan mengidentifikasi Yonatan sebagai anak Saul; bahasa sumber tidak memberi penekanan tambahan.
- source_word: וַ
  choice: Lalu
  rationale: Waw dengan bentuk wayyiqtol meneruskan urutan narasi; “Lalu” alami dalam bahasa Indonesia modern.
