translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ia” dipakai untuk narasi, sedangkan “aku” dan “kamu” dipertahankan dalam percakapan langsung agar alami. Ambiguitas bentuk verba Ibrani pada klausa kedua dijelaskan dalam catatan kaki, bukan disembunyikan.
