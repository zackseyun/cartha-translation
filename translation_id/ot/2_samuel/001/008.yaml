base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/008.yaml
  text: He said to me[a], ‘Who are you?’ And I said to him, ‘I am an Amalekite.’
translation:
  language: id
  text: Ia berkata kepadaku[a], “Siapa kamu?” Lalu aku berkata kepadanya, “Aku orang Amalek.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam klausa kedua, teks Ibrani secara harfiah berbunyi “lalu ia berkata”; berdasarkan konteks, maksudnya ialah “lalu aku berkata”, karena orang itu sedang menceritakan jawabannya sendiri kepada Saul.
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. Bahasa Indonesia tidak perlu mempertahankan kata penghubung ו secara eksplisit pada awal kalimat.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi ל dengan sufiks orang pertama tunggal menandai orang yang menjadi tujuan perkataan.
- source_word: מִי אַתָּה
  choice: Siapa kamu?
  rationale: Ungkapan tanya Ibrani tanpa kopula ini secara alami diterjemahkan sebagai pertanyaan identitas dalam bahasa Indonesia.
- source_word: ויאמר
  choice: Lalu aku berkata
  rationale: Teks tertulis berbentuk orang ketiga tunggal, tetapi konteks tuturan dan אֵלָיו menunjukkan bahwa pemuda itu sedang menceritakan jawabannya sendiri kepada Saul. Catatan kaki mempertahankan bentuk harfiah teks Ibrani.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks orang ketiga laki-laki tunggal menunjukkan bahwa jawaban itu ditujukan kepada Saul.
- source_word: עֲמָלֵקִי אָנֹכִי
  choice: Aku orang Amalek
  rationale: Nomina gentilis mengidentifikasi asal kelompok atau bangsa. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penegasan melalui pronomina אָנֹכִי.
