  source_fidelity: Teks Indonesia menyampaikan seruan ratapan אֵיךְ dengan tepat melalui “Betapa,” mempertahankan makna kematian/kekalahan dalam “telah gugur,” dan menerjemahkan וַיֹּאבְדוּ serta כְּלֵי מִלְחָמָה tanpa mempersempit ambiguitasnya. “Alat-alat perang” mencakup peralatan militer secara cukup luas dan dapat tetap dibaca baik secara harfiah maupun sebagai kiasan puitis.
