  text: אֵ֚יךְ נָפְל֣וּ גִבּוֹרִ֔ים וַ/יֹּאבְד֖וּ כְּלֵ֥י מִלְחָמָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/027.yaml
  text: How the mighty have fallen[b][a], and the weapons of war have perished!
translation:
  language: id
  text: 'Betapa para pahlawan telah gugur,

    dan alat-alat perang telah binasa![a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perlengkapan perang” atau “senjata perang.” Frasa Ibrani ini mencakup peralatan militer secara luas, bukan hanya senjata untuk menyerang.
    reason: lexical_alternative
  - marker: b
    text: “Alat-alat perang” mungkin merupakan sebutan kiasan bagi Saul dan Yonatan sebagai kekuatan tempur Israel, tetapi ungkapan ini juga dapat dipahami secara harfiah.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיךְ
  choice: Betapa
  rationale: Dalam ratapan ini, kata tersebut menyatakan seruan dukacita, bukan pertanyaan. “Betapa” terdengar alami dalam puisi Indonesia dan mempertahankan daya seru refrein.
- source_word: נָפְלוּ
  choice: telah gugur
  rationale: Kata kerja ini berarti jatuh, tetapi dalam konteks kematian para pejuang, “gugur” merupakan padanan Indonesia yang alami dan bermartabat; “telah” mempertahankan nuansa hasil dari bentuk perfektif.
- source_word: גִבּוֹרִים
  choice: para pahlawan
  rationale: Istilah ini menunjuk kepada orang-orang perkasa atau pejuang. “Para pahlawan” mempertahankan ragam puitis dan cocok dengan Saul serta Yonatan dalam konteks ratapan.
- source_word: וַיֹּאבְדוּ
  choice: telah binasa
  rationale: Kata אבד dapat berarti binasa, lenyap, atau hilang. “Telah binasa” sesuai dengan nada ratapan sekaligus membiarkan frasa berikut dipahami secara harfiah maupun kiasan.
- source_word: כְּלֵי מִלְחָמָה
  choice: alat-alat perang
  rationale: כְּלֵי mencakup benda, perlengkapan, atau peralatan, sehingga frasa ini lebih luas daripada senjata ofensif saja. “Alat-alat perang” cukup alami dan mempertahankan keluasan makna sumber.
theological_decisions:
- issue: Apakah “alat-alat perang” harfiah atau kiasan
  choice: Terjemahan utama mempertahankan ungkapan konkret tanpa menentukan acuannya.
  alternative: Ungkapan itu dapat menunjuk secara kiasan kepada Saul dan Yonatan sebagai kekuatan tempur Israel, atau secara harfiah kepada perlengkapan perang.
  rationale: Teks Ibrani memungkinkan kedua pembacaan; menentukan salah satunya dalam teks utama akan menghilangkan ambiguitas puitis yang asli.
translation_notes:
  register: Bahasa Indonesia modern yang puitis, ringkas, dan bermartabat. Pemenggalan dua baris mempertahankan bentuk seruan penutup ratapan. Penanda catatan kaki [a] dan [b] ditempatkan sesudah frasa yang diterangkan.
