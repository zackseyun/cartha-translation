  yaml_path: translation/ot/2_samuel/001/015.yaml
  text: Then David called one of the young men and said[a], “Come near; strike him down.” So he struck him, and he died.
translation:
  language: id
  text: Lalu Daud memanggil salah seorang dari orang-orang muda itu dan berkata, “Mendekatlah, hantam dia.”[a] Maka orang itu memukulnya, dan ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “serang dia” atau “serbu dia” untuk “hantam dia” (פְּגַע בּוֹ). Verba Ibrani ini dapat menunjuk pada serangan keras secara lebih umum; dalam konteks ini hasil yang mematikan menjadi jelas dari kalimat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks narasi ini, קרא berarti memanggil seseorang; pilihan ini wajar dan tidak memberi kesan resmi yang berlebihan.
- source_word: לְאַחַד מֵהַנְּעָרִים
  choice: salah seorang dari antara orang-orang muda itu
  rationale: נְעָרִים dapat berarti orang-orang muda, pelayan, atau pengiring. Terjemahan ini mempertahankan sebutan usia/status dalam bahasa Ibrani tanpa mengubahnya menjadi jabatan tertentu.
- source_word: גַּשׁ
  choice: Mendekatlah
  rationale: Imperatif נגשׁ berarti datang mendekat atau menghampiri; bentuk ini ringkas, alami, dan sesuai dengan urutan perintah.
- source_word: פְּגַע בּוֹ
  choice: serang dia sampai mati
  rationale: פגע dengan ב dapat berarti menyerang atau menghantam. Konteks menunjukkan bahwa perintah ini dimaksudkan mematikan, sedangkan pilihan 'serang' tetap mempertahankan cakupan leksikal verba yang tidak secara harfiah sama dengan verba biasa untuk 'membunuh'.
- source_word: וַיַּכֵּהוּ
  choice: orang muda itu menyerangnya
  rationale: נכה berarti memukul atau menyerang. 'Menyerangnya' mengungkapkan tindakan dengan alami, sedangkan klausa berikut tetap menyatakan akibatnya secara tersendiri.
- source_word: וַיָּמֹת
  choice: dan ia pun mati
  rationale: מות adalah verba umum untuk mati. 'Pun' secara alami menandai hasil dalam rangkaian narasi tanpa melebur tindakan dan akibat menjadi satu verba.
