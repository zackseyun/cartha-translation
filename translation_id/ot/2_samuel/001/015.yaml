translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'orang-orang muda' dipertahankan untuk mencerminkan istilah sumber, sementara pelaku pada klausa berikut diperjelas secara alami sebagai 'orang muda itu'. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
