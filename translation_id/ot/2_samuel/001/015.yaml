  to: Lalu Daud memanggil salah seorang dari orang-orang muda itu dan berkata, “Mendekatlah, hantam dia.”[a] Maka orang itu memukulnya, dan ia mati.
  rationale: Revisi menghapus “sampai mati” dari perintah agar tidak mengantisipasi hasil yang secara eksplisit disampaikan dalam klausa berikutnya. “Hantam dia” mempertahankan daya kekerasan פְּגַע בּוֹ tanpa menerjemahkannya sebagai “bunuh dia.” Subjek kedua diringkas menjadi “orang itu,” yang wajar dalam narasi dan tetap merujuk kepada salah seorang dari orang-orang muda tadi.
