  variant: modern standard Indonesian
source:
  edition: WLC
  text: צַר לִ֣/י עָלֶ֗י/ךָ אָחִ/י֙ יְה֣וֹנָתָ֔ן נָעַ֥מְתָּ לִּ֖/י מְאֹ֑ד נִפְלְאַ֤תָה אַהֲבָֽתְ/ךָ֙ לִ֔/י מֵ/אַהֲבַ֖ת נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/026.yaml
  text: I am distressed over you[a], my brother Jonathan; you were very pleasant to me. Your love to me was wonderful, surpassing the love of women.
translation:
  language: id
  text: Aku berdukacita atasmu, Yonatan, saudaraku! Engkau sangat menyenangkan bagiku. Kasihmu kepadaku sungguh luar biasa, melebihi kasih perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lebih daripada kasih perempuan.” Frasa Ibrani ini dapat dipahami sebagai kasih yang diberikan perempuan atau kasih kepada perempuan. Perbandingan puitis itu sendiri tidak menentukan secara tepat sifat kasih yang dibandingkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: צַר לִי עָלֶיךָ
  choice: Aku berdukacita karena engkau
  rationale: Ungkapan ini menyatakan kesesakan atau dukacita pribadi atas Yonatan. 'Berdukacita karena engkau' alami dalam ratapan bahasa Indonesia dan mempertahankan hubungan עַל dengan orang yang diratapi.
- source_word: אָחִי
  choice: saudaraku
  rationale: Mempertahankan arti harfiah 'saudaraku' sekaligus memungkinkan nuansa kedekatan yang kuat tanpa mempersempitnya menjadi sekadar teman.
- source_word: יְהוֹנָתָן
  choice: Yonatan
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: נָעַמְתָּ לִּי מְאֹד
  choice: Engkau sangat menyenangkan bagiku
  rationale: נעם menyatakan sifat menyenangkan atau membawa kegembiraan; terjemahan ini dekat dengan bentuk Ibrani dan tidak menambahkan nuansa romantis yang tidak dinyatakan.
- source_word: נִפְלְאָתָה
  choice: sungguh luar biasa
  rationale: Kata ini menyatakan sesuatu yang menakjubkan atau luar biasa. 'Sungguh' menyampaikan daya penegas dalam ungkapan puitis tersebut.
- source_word: אַהֲבָתְךָ לִי
  choice: Kasihmu kepadaku
  rationale: Mempertahankan kata umum untuk kasih serta arah relasional yang ditandai oleh לִי.
- source_word: מֵאַהֲבַת נָשִׁים
  choice: melebihi kasih perempuan
  rationale: מִן membentuk perbandingan, sedangkan frasa 'kasih perempuan' sengaja dibiarkan umum karena bahasa Ibrani tidak memastikan apakah yang dimaksud ialah kasih dari perempuan atau kasih kepada perempuan.
theological_decisions:
- issue: Makna perbandingan dengan 'kasih perempuan'
  choice: Mempertahankan pernyataan perbandingan secara umum tanpa menentukan sifat seksual, romantis, atau platonisnya.
  alternative: Kasih Yonatan melampaui kasih romantis kepada perempuan; atau kasih yang diberikan perempuan; atau ungkapan ini semata-mata bahasa puitis dalam ratapan.
  rationale: Teks Ibrani menyatakan bahwa kasih Yonatan luar biasa dalam perbandingan dengan 'kasih perempuan', tetapi konstruksinya tidak menentukan arah atau kategori kasih itu. Terjemahan utama dan catatan kaki mempertahankan ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat dengan bentuk sapaan 'engkau' yang sesuai untuk ratapan puitis. Tanda seru setelah sapaan menandai intensitas ratapan tanpa menambah isi.
