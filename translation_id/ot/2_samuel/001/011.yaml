  text: Then David took hold of his clothes and tore them[a], and so did all the men who were with him.
translation:
  language: id
  text: Lalu Daud memegang pakaiannya dan mengoyakkannya[a]; demikian juga semua orang yang bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mengoyakkan pakaian merupakan tanda dukacita.
    reason: cultural_context
lexical_decisions:
- source_word: וַיַּחֲזֵק
  choice: memegang
  rationale: Dalam ungkapan ini, verba חזק menyatakan tindakan memegang pakaian sebelum mengoyakkannya. 'Memegang' alami dalam bahasa Indonesia dan tidak menambahkan kesan kekerasan yang tidak harus ada.
- source_word: בְּבִגְדוֹ
  choice: pakaiannya
  rationale: Nomina בגד berbentuk tunggal dengan sufiks orang ketiga maskulin tunggal. 'Pakaiannya' mempertahankan bentuk tunggal sumber dan tetap alami dalam konteks tindakan berkabung.
- source_word: וַיִּקְרָעֵם
  choice: mengoyakkannya
  rationale: Verba קרע berarti mengoyakkan. Walaupun sufiks pada bentuk Masoretik tampak plural, acuannya mengikuti 'pakaiannya'; dalam bahasa Indonesia, '-nya' tidak membedakan tunggal dan jamak sehingga ambiguitas bentuk tidak perlu dipaksakan.
- source_word: וְגַם
  choice: demikian juga
  rationale: Gabungan konjungsi dan partikel aditif memperluas tindakan Daud kepada semua orang yang menyertainya. 'Demikian juga' menyampaikan elipsis verba secara wajar.
- source_word: כָּל הָאֲנָשִׁים
  choice: semua orang
  rationale: אֲנָשִׁים di sini menunjuk pada rombongan laki-laki yang bersama Daud. Dalam bahasa Indonesia, 'orang' merupakan padanan biasa dan tidak menyiratkan perubahan jenis kelamin para pelaku.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang bersamanya
  rationale: Padanan langsung dan alami untuk klausa relatif yang mengidentifikasi para pendamping Daud.
