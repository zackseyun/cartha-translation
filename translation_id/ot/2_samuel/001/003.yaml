base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/003.yaml
  text: David said to him[a], “Where have you come from?” He said to him, “I have escaped from the camp of Israel.”
translation:
  language: id
  text: Daud berkata kepadanya, “Dari mana kamu datang?” Jawabnya, “Aku berhasil meloloskan diri dari perkemahan Israel.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵי מִזֶּה
  choice: Dari mana
  rationale: Ungkapan ini menanyakan asal atau tempat keberangkatan. “Dari mana” alami dalam bahasa Indonesia dan secara langsung mempertahankan unsur sumber yang dinyatakan oleh מִן.
- source_word: תָּבוֹא
  choice: kamu datang
  rationale: Bentuk imperfek dalam pertanyaan langsung ini mengacu pada gerakan yang baru terjadi. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga “kamu datang” menyampaikan maknanya secara wajar tanpa menambahkan penanda waktu yang tidak diperlukan.
- source_word: מִמַּחֲנֵה יִשְׂרָאֵל
  choice: dari perkemahan Israel
  rationale: מַחֲנֶה menunjuk pada perkemahan, khususnya perkemahan pasukan. “Perkemahan Israel” mempertahankan konstruksi sumber dan konteks militernya.
- source_word: נִמְלָטְתִּי
  choice: Aku berhasil meloloskan diri
  rationale: Bentuk Nifal dari מלט menyatakan keberhasilan lolos dari bahaya. “Berhasil meloloskan diri” memperjelas aspek keberhasilan yang terkandung dalam verba tanpa menentukan cara pelariannya.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: berkata ... Jawabnya
  rationale: Kemunculan pertama dipertahankan sebagai “berkata”, sedangkan yang kedua diterjemahkan “Jawabnya” agar dialog alami dalam bahasa Indonesia; konteks jelas menunjukkan bahwa perkataan kedua merupakan jawaban.
- source_word: דָּוִד
  choice: Daud
  rationale: Nama ini menggunakan bentuk baku yang telah mapan dalam tradisi Alkitab bahasa Indonesia.
