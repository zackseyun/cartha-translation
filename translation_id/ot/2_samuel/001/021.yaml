  source_fidelity: 'Terjemahan setia pada struktur dan isi teks Ibrani: sapaan kepada pegunungan Gilboa, harapan negatif mengenai embun, hujan, dan ladang-ladang, alasan yang diperkenalkan oleh ''Sebab'', serta pengulangan puitis ''perisai ... perisai Saul'' semuanya dipertahankan. ''Dinodai'' merupakan padanan yang layak bagi נִגְעַל dalam konteks kehinaan perisai setelah pertempuran. Frasa terakhir secara wajar dirujukkan kepada perisai dan tidak dipaksakan menjadi gelar bagi Saul.'
