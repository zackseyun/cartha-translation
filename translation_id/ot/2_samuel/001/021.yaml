  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָרֵ֣י בַ/גִּלְבֹּ֗עַ אַל טַ֧ל וְ/אַל מָטָ֛ר עֲלֵי/כֶ֖ם וּ/שְׂדֵ֣י תְרוּמֹ֑ת כִּ֣י שָׁ֤ם נִגְעַל֙ מָגֵ֣ן גִּבּוֹרִ֔ים מָגֵ֣ן שָׁא֔וּל בְּלִ֖י מָשִׁ֥יחַ בַּ/שָּֽׁמֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/021.yaml
  text: Mountains of Gilboa[a], let there be no dew or rain upon you, nor fields of offerings; for there the shield of the mighty was defiled, the shield of Saul[b], not anointed with oil.
translation:
  language: id
  text: Hai gunung-gunung Gilboa, jangan ada embun atau hujan di atasmu, dan jangan ada ladang-ladang persembahan[a]. Sebab di sanalah perisai para pahlawan dinodai, perisai Saul[b], yang tidak diurapi dengan minyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ladang-ladang yang subur,” “ladang-ladang hasil pertama,” atau “ladang-ladang persembahan khusus.” Frasa Ibraninya sulit; kata yang diterjemahkan “persembahan” sering menunjuk pada sesuatu yang dikhususkan bagi Allah.
    reason: lexical_alternative
  - marker: b
    text: Frasa terakhir kemungkinan menerangkan perisai Saul yang tidak lagi digosok dengan minyak, sebagaimana lazim dilakukan untuk menyiapkan dan merawat perisai, bukan menerangkan Saul sebagai “orang yang diurapi.”
    reason: cultural_note
lexical_decisions:
- source_word: הָרֵי בַגִּלְבֹּעַ
  choice: Hai gunung-gunung Gilboa
  rationale: Bentuk konstruksi ini merupakan sapaan langsung dalam ratapan. Partikel “Hai” menyatakan vokatif secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: אַל טַל וְאַל מָטָר עֲלֵיכֶם
  choice: jangan ada embun atau hujan di atasmu
  rationale: אַל dalam ungkapan kutuk atau harapan negatif diterjemahkan sebagai larangan/harapan negatif. Pronomina tunggal “-mu” memperlakukan kawasan pegunungan Gilboa sebagai satu kesatuan yang disapa.
- source_word: וּשְׂדֵי תְרוּמֹת
  choice: dan jangan ada ladang-ladang persembahan
  rationale: Frasa Ibrani ini sulit. תְרוּמוֹת lazim menunjuk pada sesuatu yang dikhususkan sebagai persembahan. Penambahan “jangan ada” membuat hubungan eliptis dengan אַל jelas dalam bahasa Indonesia tanpa menghapus ambiguitas leksikalnya.
- source_word: כִּי שָׁם
  choice: Sebab di sanalah
  rationale: Menyatakan alasan bagi kutuk sebelumnya; partikel “-lah” mempertahankan penekanan pada lokasi itu.
- source_word: נִגְעַל
  choice: dinodai
  rationale: Bentuk Nifal dapat menyatakan bahwa sesuatu dicemarkan atau diperlakukan secara hina. “Dinodai” cocok dengan kehinaan perisai yang tergeletak sesudah kekalahan tanpa menentukan secara berlebihan sifat pencemarannya.
- source_word: מָגֵן גִּבּוֹרִים
  choice: perisai para pahlawan
  rationale: גִּבּוֹרִים menunjuk pada orang-orang perkasa atau pejuang. “Para pahlawan” mempertahankan laras puitis ratapan.
- source_word: מָגֵן שָׁאוּל
  choice: perisai Saul
  rationale: 'Pengulangan appositional dipertahankan: dari perisai para pahlawan secara umum kepada perisai Saul secara khusus.'
- source_word: בְּלִי מָשִׁיחַ בַּשָּׁמֶן
  choice: yang tidak diurapi dengan minyak
  rationale: Frasa ini paling wajar menerangkan perisai yang tidak lagi digosok atau dilumuri minyak. “Diurapi” mempertahankan gambaran harfiah Ibrani, sedangkan catatan kaki menjelaskan praktik pemeliharaan perisai.
theological_decisions:
- issue: Kemungkinan מָשִׁיחַ dipahami sebagai gelar teologis “yang diurapi”
  choice: 'Dipahami sebagai tindakan mengolesi perisai dengan minyak: “yang tidak diurapi dengan minyak.”'
  alternative: Memahami frasa itu sebagai keterangan tentang Saul selaku orang yang diurapi.
  rationale: Kedekatan frasa dengan “perisai Saul” serta penyebutan minyak mendukung praktik mengolesi perisai kulit. Terjemahan ini tidak memasukkan gelar mesianik atau klaim teologis yang tidak dituntut konteks, tetapi catatan kaki mengakui kemungkinan kebingungan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puitis dan khidmat yang sesuai untuk ratapan. Pengulangan “perisai” dipertahankan untuk menjaga struktur puisi Ibrani. Ambiguitas frasa tentang ladang dan pengurapan perisai tidak diselesaikan secara dogmatis; alternatif utama dicatat dalam catatan kaki.
