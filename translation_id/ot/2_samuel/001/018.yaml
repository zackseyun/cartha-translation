  text: וַ/יֹּ֕אמֶר לְ/לַמֵּ֥ד בְּנֵֽי יְהוּדָ֖ה קָ֑שֶׁת הִנֵּ֥ה כְתוּבָ֖ה עַל סֵ֥פֶר הַ/יָּשָֽׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/018.yaml
  text: 'and said that the sons of Judah should be taught “The Bow.” Behold, it is written in the Book of Jashar:'
translation:
  language: id
  text: 'Ia berkata agar orang-orang Yehuda diajari menggunakan busur[a]. Sesungguhnya, hal itu tertulis dalam Kitab Orang Jujur[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Busur,” sebagai judul ratapan yang menyusul. Teks Ibrani dapat juga dipahami sebagai perintah untuk mengajar orang-orang Yehuda menggunakan busur.
    reason: Mempertahankan ambiguitas sintaksis dan kontekstual dari קָשֶׁת tanpa menetapkan pembacaan judul dalam teks utama.
  - marker: b
    text: Harfiah, “Kitab Yasyar” atau “Kitab Orang Jujur”; sebuah kitab kuno yang dirujuk juga dalam Yosua 10:13.
    reason: Menjelaskan bahwa frasa ini adalah nama/judul sumber kuno dan bahwa bentuk serta identitas tepatnya tidak pasti.
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan ini merujuk secara kolektif kepada orang-orang Yehuda; “keturunan” alami dalam bahasa Indonesia dan tidak membatasi pada anak laki-laki harfiah.
- source_word: קָשֶׁת
  choice: “Busur”
  rationale: Secara leksikal berarti “busur”. Dalam konteks ini kemungkinan merupakan judul nyanyian ratapan yang menyusul, sehingga ditandai dengan tanda petik tanpa menambahkan kata “nyanyian” yang tidak ada dalam teks.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Mempertahankan penanda perhatian dalam bahasa Ibrani dengan ungkapan Indonesia yang bermartabat dan sesuai bagi pengantar kutipan tertulis.
- source_word: סֵפֶר הַיָּשָׁר
  choice: Kitab Orang Jujur
  rationale: Menerjemahkan arti nama Ibrani secara transparan; bentuk tunggal kolektif “Orang Jujur” mempertahankan kemungkinan makna gelar kitab.
theological_decisions:
- issue: Apakah קָשֶׁת merupakan objek latihan memanah atau judul ratapan
  choice: Diperlakukan sebagai judul, “Busur”
  alternative: “mengajari keturunan Yehuda menggunakan busur”
  rationale: Susunan ayat dan rujukan kepada kitab sumber mendukung pembacaan sebagai judul nyanyian, tetapi terjemahan tetap hanya menampilkan kata “Busur” agar tidak menghapus ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur pengantar dipertahankan sebagai pembuka menuju ratapan pada ayat berikutnya; tanda titik dua menandai kutipan yang menyusul.
