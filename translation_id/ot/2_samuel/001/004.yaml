  text: וַ/יֹּ֨אמֶר אֵלָ֥י/ו דָּוִ֛ד מֶה הָיָ֥ה הַ/דָּבָ֖ר הַגֶּד נָ֣א לִ֑/י וַ֠/יֹּאמֶר אֲשֶׁר נָ֨ס הָ/עָ֜ם מִן הַ/מִּלְחָמָ֗ה וְ/גַם הַרְבֵּ֞ה נָפַ֤ל מִן הָ/עָם֙ וַ/יָּמֻ֔תוּ וְ/גַ֗ם שָׁא֛וּל וִ/יהוֹנָתָ֥ן בְּנ֖/וֹ מֵֽתוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/004.yaml
  text: David said to him[a], “What happened? Please tell me.” He said, “The people fled from the battle, and many of the people also fell and died[c][b]; and Saul and Jonathan his son are also dead.”
translation:
  language: id
  text: Daud bertanya kepadanya, “Apa yang terjadi? Tolong, beritahukan kepadaku.” Orang itu menjawab, “Pasukan itu melarikan diri dari pertempuran. Banyak dari mereka juga gugur dan mati,[a] dan Saul serta Yonatan, anak Saul, juga sudah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam laporan pertempuran, “gugur” menerjemahkan ungkapan Ibrani yang secara harfiah berarti “jatuh”; kata berikutnya, “mati”, menegaskan hasilnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה הָיָה הַדָּבָר
  choice: Apa yang terjadi?
  rationale: Ungkapan harfiah ‘apa yang terjadi dengan perkara itu?’ dalam konteks ini meminta laporan tentang jalannya peristiwa; bentuk ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: הַגֶּד נָא לִי
  choice: Tolong ceritakan kepadaku
  rationale: Imperatif הַגֶּד berarti ‘ceritakan/laporkan’, sedangkan נָא memberi nuansa permohonan atau desakan yang sopan.
- source_word: אֲשֶׁר נָס הָעָם מִן הַמִּלְחָמָה
  choice: Rakyat melarikan diri dari pertempuran
  rationale: נָס menyatakan tindakan melarikan diri, dan הָעָם menunjuk secara kolektif kepada rakyat atau pasukan Israel; ‘rakyat’ mempertahankan padanan yang luas tanpa mempersempitnya menjadi tentara saja.
- source_word: וְגַם הַרְבֵּה נָפַל מִן הָעָם וַיָּמֻתוּ
  choice: Banyak dari antara mereka juga gugur dan tewas
  rationale: Dalam konteks perang, נָפַל berarti ‘gugur’ atau ‘roboh karena dipukul’, sementara וַיָּמֻתוּ secara eksplisit menyatakan bahwa mereka mati. Kedua unsur dipertahankan agar dua verba Ibrani tidak dilebur.
- source_word: וְגַם שָׁאוּל וִיהוֹנָתָן בְּנוֹ מֵתוּ
  choice: dan Saul serta Yonatan, anaknya, juga sudah mati
  rationale: Bentuk ‘sudah mati’ menyampaikan hasil kini dari kematian yang dilaporkan dan mempertahankan penegasan גַם serta keterangan בְּנוֹ.
