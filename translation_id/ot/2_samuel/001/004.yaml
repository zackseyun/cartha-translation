  register: Bahasa Indonesia modern, alami, dan bermartabat. Dialog dibuat jelas dengan ‘orang itu menjawab’ untuk menghindari pengulangan pronomina yang kaku. ‘Rakyat’ mempertahankan keluasan הָעָם, sedangkan ‘gugur dan tewas’ menjaga dua verba sumber beserta citra perangnya.
