source:
  edition: WLC
  text: אַל תַּגִּ֣ידוּ בְ/גַ֔ת אַֽל תְּבַשְּׂר֖וּ בְּ/חוּצֹ֣ת אַשְׁקְל֑וֹן פֶּן תִּשְׂמַ֨חְנָה֙ בְּנ֣וֹת פְּלִשְׁתִּ֔ים פֶּֽן תַּעֲלֹ֖זְנָה בְּנ֥וֹת הָ/עֲרֵלִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/020.yaml
  text: Do not tell it in Gath[a]; do not proclaim the news in the streets of Ashkelon, lest the daughters of the Philistines rejoice[b], lest the daughters of the uncircumcised exult.
translation:
  language: id
  text: Jangan beritakan itu[a] di Gat; jangan kabarkan di jalan-jalan Askelon, agar putri-putri Filistin tidak bersukacita, agar putri-putri orang-orang yang tidak bersunat[b] tidak bersorak-sorai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kata “itu” tidak dinyatakan dalam teks Ibrani, tetapi tersirat dari konteks: kabar tentang gugurnya Saul dan Yonatan.'
    reason: implicit_object
  - marker: b
    text: Secara harfiah, “orang-orang yang tidak bersunat.” Dalam konteks ini, sebutan polemis tersebut merujuk kepada Filistin dan menegaskan perbedaan identitas perjanjian yang dikaitkan dengan sunat.
    reason: covenantal_term
lexical_decisions:
- source_word: תַּגִּידוּ
  choice: beritakan itu
  rationale: Bentuk dari נגד berarti ‘memberitahukan, melaporkan, menyatakan’. ‘Beritakan’ sesuai dengan konteks kabar tentang gugurnya Saul dan Yonatan; ‘itu’ menyatakan objek yang tersirat dalam bahasa Ibrani.
- source_word: בְגַת
  choice: di Gat
  rationale: Preposisi lokatif בְ diterjemahkan ‘di’, dan nama kota גַת ditransliterasikan secara lazim sebagai ‘Gat’.
- source_word: תְּבַשְּׂרוּ
  choice: kabarkan
  rationale: Bentuk piel dari בשר berarti membawa atau mengumumkan kabar. ‘Kabarkan’ alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan ‘beritakan’.
- source_word: בְּחוּצֹת אַשְׁקְלוֹן
  choice: di jalan-jalan Askelon
  rationale: חוּצוֹת dapat menunjuk jalan-jalan atau tempat-tempat terbuka di kota. ‘Jalan-jalan’ mempertahankan latar pengumuman di ruang publik.
- source_word: פֶּן
  choice: supaya ... jangan
  rationale: פֶּן memperkenalkan akibat atau tujuan negatif. Susunan ‘supaya ... jangan’ lebih alami dalam bahasa Indonesia modern daripada bentuk yang terlalu harfiah.
- source_word: תִּשְׂמַחְנָה
  choice: bersukacita
  rationale: Kata שמח menyatakan kegembiraan. ‘Bersukacita’ sesuai dengan ragam ratapan yang luhur.
- source_word: בְּנוֹת פְּלִשְׁתִּים
  choice: anak-anak perempuan orang Filistin
  rationale: Terjemahan ini mempertahankan ungkapan puitis harfiah ‘anak-anak perempuan’ dan identitas kolektif orang Filistin tanpa mengubahnya menjadi istilah yang lebih umum.
- source_word: תַּעֲלֹזְנָה
  choice: bersorak-sorai
  rationale: Kata עלז menggambarkan kegembiraan yang meluap. ‘Bersorak-sorai’ mempertahankan peningkatan intensitas dibandingkan ‘bersukacita’.
- source_word: בְּנוֹת הָעֲרֵלִים
  choice: anak-anak perempuan orang-orang yang tidak bersunat
  rationale: עֲרֵלִים secara harfiah berarti ‘orang-orang yang tidak bersunat’. Terjemahan ini mempertahankan sebutan polemis yang terkait dengan identitas perjanjian tanpa menggantinya dengan cercaan umum.
theological_decisions:
- issue: Penerjemahan sebutan perjanjian עֲרֵלִים
  choice: orang-orang yang tidak bersunat
  alternative: orang kafir; orang najis
  rationale: Istilah Ibrani secara langsung merujuk pada sunat dan dengan demikian membawa muatan identitas perjanjian. Terjemahan harfiah mempertahankan ketegangan teologis dan daya retoris teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar namun tetap bernada luhur dan puitis. Kesejajaran kedua larangan dan kedua klausa akibat negatif dipertahankan; perbedaan intensitas antara ‘bersukacita’ dan ‘bersorak-sorai’ juga dijaga.
