  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan klausa mempertahankan urutan waktu sumber sambil menghindari formula pembuka yang terasa kaku. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
