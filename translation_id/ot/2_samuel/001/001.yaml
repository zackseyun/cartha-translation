base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/001.yaml
  text: After the death of Saul[a], when David had returned from striking down the Amalekites, David stayed in Ziklag two days.
translation:
  language: id
  text: Setelah Saul meninggal dan setelah Daud kembali setelah mengalahkan orang Amalek[a], Daud tinggal di Ziklag selama dua hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: “Amalek”, yaitu sebutan kolektif bagi orang Amalek.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Formula naratif ini menandai kelanjutan cerita. Dalam bahasa Indonesia modern, hubungan naratif sudah tersampaikan secara alami oleh klausa waktu tanpa perlu menambahkan “maka terjadilah”.
- source_word: אַחֲרֵי מוֹת שָׁאוּל
  choice: Setelah Saul meninggal
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia daripada “setelah kematian Saul”, dengan makna temporal yang sama.
- source_word: וְדָוִד שָׁב
  choice: dan Daud telah kembali
  rationale: Kata “telah” menunjukkan bahwa kepulangan Daud mendahului tindakan utama, yaitu ia tinggal di Ziklag; “dan” mempertahankan hubungan sintaksis Ibrani tanpa membuat kalimat kaku.
- source_word: מֵהַכּוֹת
  choice: dari mengalahkan
  rationale: Dalam konteks operasi militer, נכה menunjukkan tindakan menyerang atau memukul jatuh. “Mengalahkan” menyampaikan hasil militernya secara wajar tanpa menyiratkan pemusnahan total.
- source_word: אֶת הָעֲמָלֵק
  choice: orang Amalek
  rationale: Nama tunggal kolektif עמלק merujuk kepada kelompok etnis. “Orang Amalek” merupakan bentuk kolektif yang alami dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Karena durasinya hanya dua hari, “tinggal” tepat untuk keberadaan sementara dan tidak menyiratkan permukiman permanen.
- source_word: בְּצִקְלָג
  choice: di Ziklag
  rationale: Padanan lokatif langsung dan bentuk nama tempat yang lazim.
- source_word: יָמִים שְׁנָיִם
  choice: selama dua hari
  rationale: Penambahan “selama” menyatakan akusatif durasi secara alami dan jelas dalam bahasa Indonesia.
