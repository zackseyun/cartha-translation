  yaml_path: translation/ot/2_samuel/001/019.yaml
  text: Your glory[a], O Israel[b], lies slain on your heights! How the mighty have fallen!
translation:
  language: id
  text: Kemuliaan[a], hai Israel, tergeletak tewas di tempat-tempat tinggimu[b]! Betapa orang-orang perkasa telah gugur!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani צְבִי juga dapat diterjemahkan “keindahan” atau “keagungan”; sebagian memahaminya secara lebih konkret sebagai “kijang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bukit-bukitmu” atau “tempat-tempat tinggimu.” Di sini “tempat-tempat tinggimu” dipahami secara topografis; konteksnya tidak menuntut arti tempat ibadah di bukit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּבִי
  choice: Kemuliaanmu
  rationale: צְבִי dapat berarti keindahan, semarak, atau kemuliaan, dan secara konkret juga kijang. Dalam nyanyian ratapan tentang Saul dan Yonatan, makna kiasan “kemuliaan” paling sesuai. Akhiran posesif “-mu” menyatakan bahwa Israel sedang disapa dan menghasilkan ungkapan Indonesia yang wajar, meskipun posesif itu tidak dinyatakan secara eksplisit pada kata Ibrani ini.
- source_word: יִשְׂרָאֵל
  choice: hai Israel
  rationale: Nama diri dipertahankan, sedangkan “hai” memperjelas sapaan langsung dalam ratapan.
- source_word: עַל
  choice: di
  rationale: Preposisi ini menunjukkan lokasi. “Di” paling alami dalam bahasa Indonesia bersama “tempat-tempat tinggimu”.
- source_word: בָּמוֹתֶיךָ
  choice: tempat-tempat tinggimu
  rationale: בָּמוֹת menunjuk pada tempat atau ketinggian yang menjulang. Pilihan ini mempertahankan arti topografis serta akhiran orang kedua tunggal tanpa dengan sendirinya menafsirkannya sebagai tempat ibadah.
- source_word: חָלָל
  choice: tergeletak tewas
  rationale: Kata ini menunjuk pada seseorang yang dibunuh atau tewas. “Tergeletak tewas” menyampaikan keadaan korban yang terbunuh dan cocok dengan gambaran puitis di lokasi kematian.
- source_word: אֵיךְ
  choice: Betapa
  rationale: Kata ini membuka seruan ratapan. “Betapa” mempertahankan daya seru dan terdengar wajar dalam ragam puitis Indonesia.
- source_word: נָפְלוּ
  choice: telah gugur
  rationale: Bentuk perfektif menggambarkan peristiwa yang sudah terjadi dan masih menjadi pokok ratapan. “Gugur” sesuai untuk kematian tokoh-tokoh perkasa dalam pertempuran.
- source_word: גִבּוֹרִים
  choice: orang-orang perkasa
  rationale: גִבּוֹרִים dapat berarti orang perkasa, pahlawan, atau pejuang. “Orang-orang perkasa” mempertahankan keluasan maknanya dan tidak mempersempitnya hanya kepada status kepahlawanan atau jabatan militer.
theological_decisions:
- issue: Identitas הַצְּבִי sebagai kemuliaan, keindahan, atau kijang
  choice: Kemuliaanmu
  alternative: Keindahan itu; kijang itu
  rationale: Konteks ratapan mendukung sebutan kiasan bagi Saul dan Yonatan sebagai kemuliaan Israel, tetapi kemungkinan leksikal lain tetap dicatat dan tidak dihapus.
- issue: Makna בָּמוֹתֶיךָ sebagai bentang alam atau tempat ibadah
  choice: tempat-tempat tinggimu
  alternative: bukit-bukitmu; bukit-bukit pengurbananmu
  rationale: Konteks kematian di medan perang mendukung arti topografis. Terjemahan ini tidak memasukkan konotasi kultis yang tidak dituntut oleh ayat.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis digunakan untuk mempertahankan corak ratapan. Susunan kalimat tetap mudah dipahami, sedangkan “hai,” “betapa,” dan pengulangan bunyi pada “tergeletak tewas” memberi tekanan emosional tanpa memakai ragam arkais.
