base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/016.yaml
  text: Then David said to him[a], “Your blood is on your own head, for your own mouth has testified against you, saying[b], ‘I myself killed Yahweh’s anointed.’”
translation:
  language: id
  text: 'Lalu Daud berkata kepadanya, “Darahmu ada di atas kepalamu sendiri,[a] sebab mulutmu sendiri telah bersaksi melawanmu,[b] dengan mengatakan: ‘Aku sendirilah yang membunuh orang yang diurapi oleh Yahweh.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan bentuk yang lebih formal, “Darahmu tertimpa ke atas kepalamu.” Ungkapan Ibrani ini menyatakan bahwa ia sendiri bertanggung jawab atas kematiannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “mulutmu telah memberikan kesaksian yang memberatkanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu Daud berkata kepadanya
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita. “Lalu” menghasilkan alur naratif Indonesia yang alami, sedangkan “kepadanya” menerjemahkan אֵלָיו secara eksplisit.
- source_word: דָּמֶיךָ עַל רֹאשֶׁךָ
  choice: Darahmu tertanggung atas kepalamu sendiri
  rationale: Ungkapan yudisial ini mempertahankan citra darah dan kepala dalam bahasa Ibrani sekaligus menyatakan bahwa orang itu sendiri bertanggung jawab atas kematiannya. “Sendiri” memperjelas daya refleksif idiom tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi putusan Daud dan sesuai dengan nada yudisial ayat tersebut.
- source_word: פִּיךָ
  choice: mulutmu sendiri
  rationale: Metonimia anggota tubuh dipertahankan karena teks Ibrani menekankan bahwa perkataan orang itu sendiri menjadi kesaksian yang memberatkannya.
- source_word: עָנָה בְךָ
  choice: telah bersaksi melawanmu
  rationale: Dalam konteks hukum, ענה dengan ב menunjuk pada pemberian kesaksian yang memberatkan seseorang. Pilihan ini menyampaikan makna forensiknya dengan jelas.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mengantar isi kesaksian secara alami dalam bahasa Indonesia.
- source_word: אָנֹכִי
  choice: Aku sendirilah
  rationale: Pronomina mandiri אָנֹכִי bersifat emfatis. Bentuk “sendirilah” mempertahankan penekanan pada pengakuan yang memberatkan diri sendiri.
- source_word: מֹתַתִּי
  choice: membunuh
  rationale: Bentuk verba ini menyatakan tindakan menyebabkan kematian; “membunuh” adalah padanan Indonesia yang langsung dan alami dalam pengakuan tersebut.
- source_word: מְשִׁיחַ יְהוָה
  choice: orang yang diurapi Yahweh
  rationale: Frasa konstruksi ini merupakan sebutan bagi Saul sebagai raja yang telah diurapi. Menerjemahkannya sebagai “orang yang diurapi” mempertahankan makna tindakan pengurapan tanpa mengimpor asosiasi mesianik yang lebih kemudian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan melalui transliterasi “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Makna מְשִׁיחַ dalam konteks kerajaan Saul
  choice: orang yang diurapi
  alternative: mesias
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Saul sebagai raja yang ditahbiskan melalui pengurapan. Menerjemahkan maknanya menghindari masuknya asosiasi kristologis yang tidak dinyatakan secara langsung dalam narasi ini.
- issue: Tanggung jawab atas kematian dalam idiom darah dan kepala
  choice: mempertahankan citra idiom Ibrani
  alternative: Engkau sendiri bertanggung jawab atas kematianmu
  rationale: Citra “darah” dan “kepala” memiliki bobot yudisial-teologis dalam teks. Terjemahan utama mempertahankannya, sedangkan catatan kaki menjelaskan maksud idiom itu tanpa menghapus ketegangannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara citra penting bahasa Ibrani, penekanan pronominal, dan nama ilahi dipertahankan.
