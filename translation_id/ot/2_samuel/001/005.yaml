  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata ganti “kamu” dipakai dalam percakapan langsung karena Daud berbicara kepada satu orang muda; tidak ada penanda kesopanan khusus dalam teks sumber.
