  text: Then David said to the young man who told him, “How do you know that Saul and Jonathan his son are dead?”
translation:
  language: id
  text: Lalu Daud bertanya kepada pemuda yang menyampaikan kabar kepadanya, “Bagaimana kamu tahu bahwa Saul dan Yonatan, anak Saul, sudah mati?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Daud bertanya
  rationale: Waw-konsekutif melanjutkan urutan narasi. Karena ujaran langsungnya berupa pertanyaan, “bertanya” merupakan padanan alami dalam bahasa Indonesia tanpa mengubah fungsi tuturan.
- source_word: הַנַּעַר
  choice: orang muda
  rationale: נַעַר lazim menunjuk seorang pemuda atau orang muda; konteksnya adalah pembawa kabar yang cukup dewasa untuk melaporkan peristiwa di medan perang.
- source_word: הַמַּגִּיד לוֹ
  choice: yang menyampaikan kabar itu kepadanya
  rationale: Partisip ini menerangkan orang muda tersebut sebagai pihak yang sedang memberikan laporan kepada Daud. “Menyampaikan kabar” mempertahankan nuansa pelaporan.
- source_word: אֵיךְ
  choice: Bagaimana
  rationale: Kata ini membuka pertanyaan tentang dasar atau cara orang muda itu memperoleh pengetahuannya.
- source_word: יָדַעְתָּ
  choice: kamu tahu
  rationale: Bentuk perfektif Ibrani merujuk pada pengetahuan yang telah diperoleh, tetapi ungkapan Indonesia yang paling alami untuk menanyakan dasar pengetahuan saat ini ialah “Bagaimana kamu tahu”.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang diketahui.
- source_word: מֵת
  choice: sudah mati
  rationale: Walaupun predikat Ibraninya berbentuk tunggal di depan subjek majemuk, maknanya mencakup Saul dan Yonatan. “Sudah mati” menyatakan keadaan hasil secara alami dalam bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal mengacu kepada Saul dan mengidentifikasi Yonatan sebagai anak Saul.
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saul dan Yonatan
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
