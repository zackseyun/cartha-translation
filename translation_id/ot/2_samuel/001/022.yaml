base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/022.yaml
  text: From the blood of the slain[a], from the fat of the mighty, Jonathan’s bow did not turn back[b], and Saul’s sword did not return empty.
translation:
  language: id
  text: 'Dari darah orang-orang yang terbunuh,

    dari lemak para pahlawan,[a]

    busur Yonatan tidak mundur,[b]

    dan pedang Saul tidak kembali dengan tangan kosong.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Lemak” juga dapat menyiratkan bagian yang terbaik atau paling berisi, sehingga memperkuat gambaran keberhasilan dalam pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak menarik diri.” Kata kerja Ibrani ini dapat berarti mundur atau berbalik ke belakang.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדַּם חֲלָלִים
  choice: Dari darah orang-orang yang terbunuh
  rationale: מִן dipertahankan sebagai “dari,” sementara חֲלָלִים menunjuk kepada mereka yang tewas dalam pertempuran. Ungkapan ini mempertahankan citra puitis bahwa senjata Yonatan tidak menjauh dari darah korban.
- source_word: מֵחֵלֶב גִּבּוֹרִים
  choice: dari lemak para kesatria
  rationale: חֵלֶב secara harfiah berarti “lemak” dan dapat menyiratkan bagian yang paling berisi atau terbaik; terjemahan harfiah mempertahankan gambaran jasmani dan intensitas puisi. גִּבּוֹרִים diterjemahkan “para kesatria” untuk menyatakan pejuang yang gagah dalam laras yang luhur.
- source_word: קֶשֶׁת יְהוֹנָתָן
  choice: busur Yonatan
  rationale: Hubungan konstruksi Ibrani diterjemahkan secara alami dan ringkas sebagai kepunyaan.
- source_word: לֹא נָשׂוֹג אָחוֹר
  choice: tidak mundur
  rationale: נסוג dengan אָחוֹר menyatakan mundur atau menarik diri. “Tidak mundur” alami dalam bahasa Indonesia dan mempertahankan personifikasi busur tanpa menjelaskan dampaknya secara berlebihan.
- source_word: וְחֶרֶב שָׁאוּל
  choice: dan pedang Saul
  rationale: Bentuk kepunyaan diterjemahkan secara ringkas dan sejajar dengan “busur Yonatan.”
- source_word: לֹא תָשׁוּב רֵיקָם
  choice: tidak kembali dengan kosong
  rationale: Ungkapan ini berarti tidak kembali tanpa hasil. Bentuk “dengan kosong” mempertahankan personifikasi dan kesejajaran puitis sumber, meski sedikit lebih luhur daripada tuturan sehari-hari.
