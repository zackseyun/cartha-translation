base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/023.yaml
  text: Saul and Jonathan[a], beloved and pleasant in their lives, were not parted in their death; they were swifter than eagles[c][b], they were stronger than lions.
translation:
  language: id
  text: Saul dan Yonatan, yang dikasihi dan yang menyenangkan semasa hidup mereka, tidak berpisah, bahkan dalam kematian mereka. Mereka lebih cepat daripada rajawali,[a] lebih kuat daripada singa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “burung nasar.” Kata Ibrani ini dapat menunjuk lebih luas pada burung pemangsa besar.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “lebih perkasa daripada singa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאוּל וִיהוֹנָתָן
  choice: Saul dan Yonatan
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַנֶּאֱהָבִים
  choice: yang dikasihi
  rationale: Bentuk pasif/adjektival dari אהב menyatakan bahwa Saul dan Yonatan adalah orang-orang yang dikasihi; pilihan ini alami dan tetap bernada puitis.
- source_word: וְהַנְּעִימִם
  choice: dan menyenangkan
  rationale: נעים menunjuk pada sifat menyenangkan, elok, atau menawan. 'Menyenangkan' mempertahankan kesejajaran dengan 'dikasihi' tanpa membatasinya pada kecantikan fisik atau kebajikan moral.
- source_word: בְּחַיֵּיהֶם
  choice: semasa hidup mereka
  rationale: Mengungkapkan lingkup waktu dengan bahasa Indonesia yang alami dan mempertahankan kontras dengan kematian.
- source_word: וּבְמוֹתָם לֹא נִפְרָדוּ
  choice: tidak terpisahkan dalam kematian mereka
  rationale: Menyampaikan bentuk Nifal dari פרד dan paralel puitis hidup-kematian. Ungkapan ini tidak menentukan apakah yang dimaksud terutama kematian bersama atau kesatuan dalam kematian.
- source_word: מִנְּשָׁרִים קַלּוּ
  choice: mereka lebih cepat daripada rajawali
  rationale: Dalam perbandingan ini קלל menyatakan kecepatan atau keringanan gerak. נשר secara tradisional dan wajar diterjemahkan 'rajawali', meskipun dapat menunjuk lebih luas pada burung pemangsa besar.
- source_word: מֵאֲרָיוֹת גָּבֵרוּ
  choice: lebih kuat daripada singa
  rationale: גבר menyatakan kekuatan atau keunggulan; 'lebih kuat' jelas dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Nada ratapan Daud atas Saul dan Yonatan
  choice: Mempertahankan pujian puitis dan penuh hormat kepada Saul dan Yonatan bersama-sama.
  alternative: Mengurangi pujian karena kegagalan Saul sebelumnya, atau meningkatkannya menjadi penilaian bahwa mereka tanpa cela.
  rationale: Ayat ini merupakan ratapan pemakaman. Terjemahan perlu mempertahankan retorika penghormatan teks tanpa menghapus ketegangan dengan gambaran Saul dalam narasi yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis, dengan paralelisme hidup-kematian serta rajawali-singa dipertahankan. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
