  text: And he said to me[a], ‘Please stand over me and put me to death, for anguish has seized me[b], though my life is still in me.’
translation:
  language: id
  text: Lalu ia berkata kepadaku, “Tolong berdirilah di atasku dan bunuhlah aku, sebab kesakitan telah mencengkeramku,[a] meskipun nyawaku masih ada di dalam diriku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kejang-kejang telah mencengkeramku”; kata Ibrani yang diterjemahkan “kesakitan” jarang dipakai dan arti tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab seluruh nyawaku masih ada di dalam diriku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: Lalu ia berkata kepadaku
  rationale: Wayyiqtol melanjutkan alur narasi; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: עֲמָד נָא עָלַי
  choice: Tolong berdirilah di dekatku
  rationale: נָא menyatakan permohonan, sedangkan עמד dengan על di sini menggambarkan mengambil posisi di dekat atau di atas orang yang terbaring. “Di dekatku” terdengar alami dan tidak memberi kesan harfiah berdiri di atas tubuhnya.
- source_word: וּמֹתְתֵנִי
  choice: dan bunuhlah aku
  rationale: Bentuk kausatif dari מות berarti menyebabkan kematian. “Bunuhlah aku” langsung, jelas, dan sesuai dengan konteks medan pertempuran.
- source_word: אֲחָזַנִי הַשָּׁבָץ
  choice: kesakitan telah mencengkeramku
  rationale: אחז berarti menggenggam atau mencengkeram. Karena שׁבץ merupakan kata langka yang maknanya tidak pasti, “kesakitan” mempertahankan cakupan makna yang luas tanpa menetapkan diagnosis fisik tertentu.
- source_word: כִּי כָל עוֹד נַפְשִׁי בִּי
  choice: meskipun nyawaku masih ada di dalam diriku
  rationale: נפש di sini menunjuk pada nyawa atau kehidupan. “Meskipun” menyampaikan hubungan konsesif yang paling wajar dalam konteks, sementara ungkapan “masih ada di dalam diriku” mempertahankan citra Ibrani.
