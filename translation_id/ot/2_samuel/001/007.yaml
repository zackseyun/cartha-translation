  text: He turned around and saw me[a], and he called to me, and I said, “Here I am.”
translation:
  language: id
  text: Ia menoleh ke belakang dan melihatku[a]. Lalu ia memanggilku, dan aku berkata, “Aku di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Ia berpaling ke belakangnya.” Ungkapan ini berarti bahwa ia berpaling untuk melihat ke arah belakang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אַחֲרָיו
  choice: Ia menoleh ke belakang
  rationale: Gabungan פנה dan אַחֲרָיו secara harfiah menggambarkan tindakan berpaling ke arah belakang. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur arah yang terdapat dalam teks Ibrani.
- source_word: וַיִּרְאֵנִי
  choice: dan melihat aku
  rationale: Bentuk ראה dengan akhiran orang pertama tunggal secara langsung berarti 'melihat aku'.
- source_word: וַיִּקְרָא אֵלַי
  choice: Lalu ia berseru kepadaku
  rationale: קרא dengan אֶל berarti memanggil atau berseru kepada seseorang. 'Berseru kepadaku' sesuai dengan konteks komunikasi dari jarak tertentu tanpa menyiratkan pemanggilan resmi.
- source_word: וָאֹמַר
  choice: dan aku menjawab
  rationale: Secara leksikal אמר berarti 'berkata', tetapi dalam urutan percakapan ini ucapan tersebut merupakan jawaban atas seruan; 'menjawab' lebih alami dalam narasi Indonesia tanpa mengubah makna.
- source_word: הִנֵּנִי
  choice: Aku di sini
  rationale: Ungkapan presentatif ini menyatakan kesiapan atau kehadiran pembicara. 'Aku di sini' merupakan padanan Indonesia yang jelas dan wajar, sambil mempertahankan bentuk jawaban langsung.
