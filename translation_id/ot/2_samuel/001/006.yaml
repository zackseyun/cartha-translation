  to: Pemuda yang menyampaikan kabar itu kepadanya berkata, “Aku kebetulan berada di Gunung Gilboa[a]. Di sana Saul sedang bersandar pada tombaknya, dan di sana kereta-kereta serta para penunggang kuda telah menyusulnya[b].”
