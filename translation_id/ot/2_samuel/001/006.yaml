base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/006.yaml
  text: And the young man who told him said[a], “I happened to be on Mount Gilboa, and behold, Saul was leaning on his spear, and behold[c][b], the chariots and the horsemen were closing in on him.”
translation:
  language: id
  text: Pemuda yang menyampaikan kabar itu kepadanya berkata, “Aku kebetulan berada di Gunung Gilboa[a]. Di sana Saul sedang bersandar pada tombaknya, dan di sana kereta-kereta serta para penunggang kuda telah menyusulnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Ibrani ini menegaskan bahwa kehadirannya di sana terjadi secara kebetulan: “Aku benar-benar kebetulan berada di Gunung Gilboa.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “telah mencapainya,” “sedang menekan dari dekat,” atau “sedang mengejarnya dengan ketat.” Istilah “kereta-kereta” juga dapat dipahami sebagai pasukan kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר
  choice: orang muda
  rationale: Menunjuk kepada seorang pemuda, yakni pembawa kabar dari Amalek; pilihan ini alami dan tidak menyiratkan bahwa ia anak kecil atau pelayan.
- source_word: הַמַּגִּיד לוֹ
  choice: yang menyampaikan kabar itu kepadanya
  rationale: Partisipel נגד secara atributif mengidentifikasi orang muda tersebut sebagai pemberi laporan kepada Daud.
- source_word: נִקְרֹא נִקְרֵיתִי
  choice: Kebetulan aku berada
  rationale: Gabungan infinitif absolut dan verba finit dari קרה menegaskan bahwa keberadaannya di sana terjadi secara kebetulan; bentuk Indonesia ini menyampaikan idiom tersebut dengan wajar.
- source_word: בְּהַר הַגִּלְבֹּעַ
  choice: di Gunung Gilboa
  rationale: Padanan geografis baku dan alami dalam bahasa Indonesia untuk keberadaan di kawasan gunung bernama Gilboa.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Mempertahankan fungsi הִנֵּה sebagai penanda yang mengarahkan perhatian secara hidup kepada pemandangan yang dilaporkan, tanpa memakai bentuk arkais yang kurang alami.
- source_word: נִשְׁעָן
  choice: sedang bersandar pada
  rationale: Partisipel Nifal dari שען menggambarkan Saul menopang dirinya pada tombaknya.
- source_word: חֲנִיתוֹ
  choice: tombaknya
  rationale: חֲנִית berarti tombak atau lembing; 'tombak' adalah istilah umum yang jelas dalam konteks militer.
- source_word: הָרֶכֶב
  choice: kereta-kereta
  rationale: רֶכֶב dapat bersifat kolektif dan di sini menunjuk kepada pasukan kereta; bentuk jamak konkret mudah dipahami pembaca umum.
- source_word: בַעֲלֵי הַפָּרָשִׁים
  choice: para penunggang kuda
  rationale: Ungkapan ini secara idiomatis menunjuk kepada orang-orang berkuda; padanan ini lebih transparan daripada istilah institusional 'kavaleri'.
- source_word: הִדְבִּקֻהוּ
  choice: sedang mendesaknya
  rationale: Hifil dari דבק dapat berarti menyusul, mencapai, atau mengejar dengan rapat. Konteks memungkinkan tekanan yang sedang berlangsung, sehingga 'sedang mendesaknya' mempertahankan dinamika itu.
