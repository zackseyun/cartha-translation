source:
  edition: WLC
  text: וָ/אֶעֱמֹ֤ד עָלָי/ו֙ וַ/אֲמֹ֣תְתֵ֔/הוּ כִּ֣י יָדַ֔עְתִּי כִּ֛י לֹ֥א יִֽחְיֶ֖ה אַחֲרֵ֣י נִפְל֑/וֹ וָ/אֶקַּ֞ח הַ/נֵּ֣זֶר אֲשֶׁ֣ר עַל רֹאשׁ֗/וֹ וְ/אֶצְעָדָה֙ אֲשֶׁ֣ר עַל זְרֹע֔/וֹ וָ/אֲבִיאֵ֥/ם אֶל אֲדֹנִ֖/י הֵֽנָּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/010.yaml
  text: So I stood over him and put him to death[a], because I knew that he would not live after he had fallen. Then I took the crown that was on his head and the armlet that was on his arm[b], and I brought them here to my lord.
translation:
  language: id
  text: Lalu aku berdiri di atasnya dan membunuhnya[a], sebab aku tahu bahwa ia tidak akan tetap hidup setelah ia jatuh. Kemudian aku mengambil mahkota yang ada di kepalanya dan gelang lengan yang ada di lengannya[b], lalu kubawa semuanya kemari kepada tuanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ini adalah laporan orang Amalek kepada Daud. Bandingkan 1 Samuel 31:4–5 untuk kisah sebelumnya tentang kematian Saul.
    reason: cross_reference
  - marker: b
    text: Atau “gelang.” Istilah Ibrani ini menunjuk pada perhiasan yang dikenakan pada lengan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱמֹד עָלָיו
  choice: aku berdiri di dekatnya
  rationale: Dalam konteks Saul yang telah jatuh, frasa ini menggambarkan orang Amalek berdiri dekat dan menghadap tubuh Saul. Terjemahan harfiah “berdiri di atasnya” dalam bahasa Indonesia dapat keliru dipahami sebagai menginjak tubuhnya.
- source_word: וַאֲמֹתְתֵהוּ
  choice: membunuhnya
  rationale: Bentuk kausatif dari מות menyatakan secara langsung bahwa penutur mengaku menyebabkan kematian Saul. “Membunuhnya” jelas, wajar, dan tidak memperhalus klaim itu.
- source_word: כִּי יָדַעְתִּי כִּי לֹא יִחְיֶה
  choice: sebab aku tahu bahwa ia tidak akan tetap hidup
  rationale: Ungkapan ini mempertahankan alasan yang dikemukakan penutur dan menyampaikan לֹא יִחְיֶה tanpa mengubahnya menjadi pernyataan tentang ketidakmungkinan bertahan hidup.
- source_word: אַחֲרֵי נִפְלוֹ
  choice: setelah jatuh
  rationale: Konstruksi infinitif dari נפל diterjemahkan secara temporal dan ringkas; subjeknya jelas dari konteks.
- source_word: הַנֵּזֶר
  choice: mahkota
  rationale: Di sini נֵזֶר menunjuk pada perhiasan kepala kerajaan Saul. “Mahkota” merupakan padanan Indonesia modern yang paling jelas.
- source_word: וְאֶצְעָדָה
  choice: gelang lengan
  rationale: Benda ini dikenakan pada זְרֹעוֹ, yaitu lengannya. “Gelang lengan” lebih tepat daripada hanya “gelang,” yang lazimnya dipahami dikenakan pada pergelangan tangan.
- source_word: זְרֹעוֹ
  choice: lengannya
  rationale: זְרוֹעַ berarti “lengan”; konteks tidak menuntut arti yang lebih sempit seperti lengan bawah.
- source_word: וָאֲבִיאֵם ... הֵנָּה
  choice: lalu membawanya kemari
  rationale: Bentuk naratif lampau diterjemahkan selaras dengan rangkaian tindakan sebelumnya, sedangkan הֵנָּה dinyatakan dengan “kemari,” yakni menuju tempat penutur dan Daud berada.
- source_word: אֶל אֲדֹנִי
  choice: kepada tuanku
  rationale: אֲדֹנִי di sini adalah sapaan hormat kepada Daud sebagai atasan manusia, bukan gelar ilahi.
theological_decisions:
- issue: Klaim naratif mengenai kematian Saul
  choice: Ucapan orang Amalek diterjemahkan secara langsung sebagai klaim bahwa ia membunuh Saul.
  alternative: Memperlunak pernyataannya sebagai bualan atau dusta agar selaras secara eksplisit dengan 1 Samuel 31:4–5.
  rationale: Ayat ini menyajikan laporan langsung dari orang Amalek. Ketegangan dengan kisah sebelumnya harus dipertahankan, bukan diselesaikan di dalam teks terjemahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina “ia” dan sapaan “tuanku” mempertahankan register hormat tanpa memberi kesan bahwa אֲדֹנִי merupakan gelar ilahi. Penanda catatan kaki ditempatkan pada klaim pembunuhan dan pada istilah “gelang lengan” agar sesuai dengan isi masing-masing catatan.
