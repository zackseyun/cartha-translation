source:
  edition: WLC
  text: וַֽ/יִּסְפְּדוּ֙ וַ/יִּבְכּ֔וּ וַ/יָּצֻ֖מוּ עַד הָ/עָ֑רֶב עַל שָׁא֞וּל וְ/עַל יְהוֹנָתָ֣ן בְּנ֗/וֹ וְ/עַל עַ֤ם יְהוָה֙ וְ/עַל בֵּ֣ית יִשְׂרָאֵ֔ל כִּ֥י נָפְל֖וּ בֶּ/חָֽרֶב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/012.yaml
  text: They mourned[a], wept, and fasted until evening for Saul, for Jonathan his son, for the people of Yahweh, and for the house of Israel[b], because they had fallen by the sword.
translation:
  language: id
  text: Mereka meratap, menangis, dan berpuasa sampai petang karena Saul, Yonatan anaknya, umat Yahweh, dan rumah Israel, sebab mereka telah gugur oleh pedang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְפְּדוּ
  choice: mereka meratap
  rationale: Kata kerja ספד menunjuk pada tindakan meratapi orang mati. “Meratap” mempertahankan unsur dukacita yang dinyatakan secara lahiriah dan membedakannya dari “menangis” yang menyusul.
- source_word: וַיִּבְכּוּ
  choice: menangis
  rationale: בכה secara langsung berarti menangis; pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan urutan tindakan dalam teks Ibrani.
- source_word: וַיָּצֻמוּ
  choice: berpuasa
  rationale: צום adalah istilah lazim untuk tidak makan sebagai tindakan dukacita atau ibadah.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Frasa ini menyatakan batas waktu berlangsungnya ratapan, tangisan, dan puasa.
- source_word: עַל
  choice: karena
  rationale: עַל yang berulang memperkenalkan orang dan kelompok yang menjadi alasan dukacita. “Karena” paling alami dalam susunan kalimat Indonesia ini, tanpa mengubahnya menjadi keterangan tentang kematian mereka.
- source_word: יְהוֹנָתָן בְּנוֹ
  choice: Yonatan, anaknya
  rationale: Aposisi Ibrani mengidentifikasi Yonatan sebagai anak Saul. Tanda koma membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: עַם יְהוָה
  choice: umat Yahweh
  rationale: Frasa konstruksi ini secara langsung menyatakan umat yang menjadi milik Yahweh dan mempertahankan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: Secara harfiah “rumah Israel”; “kaum Israel” merupakan ungkapan kolektif yang lebih alami dalam bahasa Indonesia sambil mempertahankan makna korporatnya.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi dukacita yang dilakukan mereka.
- source_word: נָפְלוּ
  choice: mereka telah gugur
  rationale: נפל berarti “jatuh”, tetapi dalam konteks kematian dalam pertempuran, “gugur” adalah padanan Indonesia yang alami dan tetap mempertahankan metafora kematian perang.
- source_word: בֶּחָרֶב
  choice: oleh pedang
  rationale: Padanan ini mempertahankan gambaran konkret pedang sebagai alat kematian dan tidak meratakannya menjadi sekadar “dalam pertempuran”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan sebuah gelar.
- issue: Hubungan antara “umat Yahweh” dan “kaum Israel”
  choice: Mempertahankan keduanya sebagai dua unsur yang dikoordinasikan
  alternative: Menggabungkannya menjadi satu sebutan bagi Israel
  rationale: Teks Ibrani mengulangi וְעַל sebelum kedua frasa. Terjemahan tidak menyamakan atau memisahkan keduanya secara teologis melampaui bentuk teks.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pengulangan “karena” dipertahankan untuk mencerminkan pengulangan עַל dan memberi bobot retoris pada setiap pihak yang diratapi. “Petang” dipilih daripada “malam” agar batas waktunya tetap sesuai dengan הָעָרֶב.
