  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אֵלָ֖י/ו דָּוִ֑ד אֵ֚יךְ לֹ֣א יָרֵ֔אתָ לִ/שְׁלֹ֨חַ֙ יָֽדְ/ךָ֔ לְ/שַׁחֵ֖ת אֶת מְשִׁ֥יחַ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/014.yaml
  text: Then David said to him[b][a], “How were you not afraid to put out your hand to destroy Yahweh’s anointed?”
translation:
  language: id
  text: Lalu Daud berkata kepadanya, “Bagaimana[a] engkau sampai tidak takut mengulurkan tanganmu untuk membinasakan orang yang diurapi Yahweh[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Mengapa engkau tidak takut ...?” Kata Ibrani אֵיךְ secara harfiah berarti “bagaimana” dan di sini menyatakan teguran yang penuh keterkejutan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, raja yang dikuduskan melalui pengurapan oleh Yahweh; dalam konteks ini ialah Saul.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw berurutan melanjutkan rangkaian peristiwa; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Frasa preposisional berpronomina ini menunjuk kepada pembawa kabar orang Amalek tersebut.
- source_word: אֵיךְ
  choice: Bagaimana
  rationale: Mempertahankan bentuk pertanyaan Ibrani yang secara harfiah berarti “bagaimana” dan di sini mengungkapkan keterkejutan serta teguran keras.
- source_word: יָרֵאתָ
  choice: engkau sampai tidak takut
  rationale: Kata kerja ירא menyatakan rasa takut atau gentar. Unsur “sampai” membuat teguran retorisnya wajar dalam bahasa Indonesia tanpa menghilangkan bentuk pertanyaannya.
- source_word: לִשְׁלֹחַ יָדְךָ
  choice: mengulurkan tanganmu
  rationale: Mempertahankan gambaran idiom Ibrani tentang mengarahkan tangan untuk bertindak terhadap seseorang; konteks dan frasa berikutnya menjelaskan bahwa tindakannya bersifat mematikan.
- source_word: לְשַׁחֵת
  choice: untuk membinasakan
  rationale: שׁחת mencakup tindakan menghancurkan atau membinasakan. Dalam konteks ini tindakan itu menyebabkan kematian, tetapi “membinasakan” mempertahankan cakupan leksikal yang lebih luas daripada sekadar “membunuh”.
- source_word: מְשִׁיחַ
  choice: orang yang diurapi
  rationale: Dalam konteks sejarah ini istilah tersebut menunjuk kepada Saul sebagai raja yang ditahbiskan dengan pengurapan, bukan langsung kepada gelar mesianik yang berkembang kemudian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi Allah Israel.
- issue: Makna מְשִׁיחַ ketika diterapkan kepada Saul
  choice: orang yang diurapi Yahweh
  alternative: yang diurapi Yahweh; mesias Yahweh
  rationale: Ungkapan ini menandai Saul sebagai raja yang dikuduskan melalui pengurapan oleh Yahweh. Terjemahan “orang yang diurapi” menghindari pemasukan makna kristologis yang tidak dinyatakan langsung oleh konteks ini.
- issue: Daya retoris אֵיךְ
  choice: Bagaimana engkau sampai tidak takut ...?
  alternative: Mengapa engkau tidak takut ...?
  rationale: Pilihan utama mempertahankan pertanyaan “bagaimana” sekaligus menyampaikan nada tercengang dan mencela; alternatif “mengapa” lebih idiomatis tetapi lebih menafsirkan hubungan logisnya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Pronomina “engkau” dipakai untuk mempertahankan sapaan tunggal langsung dalam teguran Daud. Susunan “mengulurkan tanganmu” sengaja mempertahankan citra idiom Ibrani, sedangkan “orang yang diurapi Yahweh” menjelaskan fungsi bentuk konstruksi tanpa menjadikannya gelar mesianik teknis.
