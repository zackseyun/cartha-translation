  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וְ/הִנֵּה֩ אִ֨ישׁ בָּ֤א מִן הַֽ/מַּחֲנֶה֙ מֵ/עִ֣ם שָׁא֔וּל וּ/בְגָדָ֣י/ו קְרֻעִ֔ים וַ/אֲדָמָ֖ה עַל רֹאשׁ֑/וֹ וַ/יְהִי֙ בְּ/בֹא֣/וֹ אֶל דָּוִ֔ד וַ/יִּפֹּ֥ל אַ֖רְצָ/ה וַ/יִּשְׁתָּֽחוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/001/002.yaml
  text: On the third day[a], behold, a man came from the camp, from Saul, with his clothes torn and dirt on his head. And when he came to David[c][b], he fell to the ground and bowed down.
translation:
  language: id
  text: Pada hari ketiga, tampaklah seorang laki-laki datang dari perkemahan Saul,[a] dengan pakaiannya terkoyak dan tanah di atas kepalanya.[b] Ketika ia sampai kepada Daud, ia menjatuhkan diri ke tanah dan sujud.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari bersama Saul” atau “dari sisi Saul.” Ungkapan Ibrani menunjukkan hubungan atau keberadaan bersama Saul, bukan bahwa Saul pasti mengutus orang itu secara langsung.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanah di atas kepalanya,” suatu tanda dukacita atau perkabungan.
    reason: cultural_note
  - marker: c
    text: Atau “bersujud.” Kata ini dapat menyatakan penghormatan yang mendalam, ketundukan, atau penghormatan resmi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Frasa waktu diterjemahkan secara langsung; bentuk naratif וַיְהִי tidak memerlukan penanda seperti “maka” atau “adapun” dalam bahasa Indonesia modern.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Mempertahankan fungsi penunjuk yang menghadirkan tokoh baru secara hidup, tetapi lebih alami dalam narasi Indonesia modern daripada “lihatlah”.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Menunjukkan bahwa tokoh tersebut seorang manusia laki-laki tunggal, sesuai bentuk dan konteks sumber.
- source_word: מִן־הַמַּחֲנֶה מֵעִם שָׁאוּל
  choice: dari perkemahan, dari pihak Saul
  rationale: 'Mempertahankan kedua unsur sumber: asal dari perkemahan dan hubungan atau kedekatan dengan Saul. “Dari pihak Saul” tidak menyiratkan bahwa Saul secara langsung mengutusnya.'
- source_word: וּבְגָדָיו קְרֻעִים
  choice: dengan pakaiannya terkoyak
  rationale: Ungkapan alami yang mempertahankan gambaran pakaian dalam keadaan robek sebagai tanda perkabungan.
- source_word: וַאֲדָמָה עַל־רֹאשׁוֹ
  choice: dan tanah di atas kepalanya
  rationale: אֲדָמָה secara harfiah berarti tanah; terjemahan ini mempertahankan gambaran konkret dan menjelaskan makna budayanya dalam catatan kaki.
- source_word: בְּבֹאוֹ אֶל־דָּוִד
  choice: Ketika ia sampai kepada Daud
  rationale: Menyampaikan keadaan waktu dari konstruksi infinitif secara alami dalam bahasa Indonesia.
- source_word: וַיִּפֹּל אַרְצָה
  choice: ia menjatuhkan diri ke tanah
  rationale: Mengungkapkan gerakan turun ke tanah secara alami; konteks menunjukkan tindakan yang disengaja menjelang sujud.
- source_word: וַיִּשְׁתָּחוּ
  choice: dan sujud
  rationale: Menyampaikan tindakan merendahkan tubuh sebagai penghormatan atau ketundukan tanpa secara khusus menetapkannya sebagai penyembahan.
theological_decisions:
- issue: Apakah tindakan וַיִּשְׁתָּחוּ berarti penyembahan kepada Daud
  choice: sujud
  alternative: menyembah; membungkuk hormat
  rationale: Kata Ibrani dapat menunjukkan penghormatan, ketundukan, atau penyembahan menurut konteks. Di sini objeknya Daud, sehingga “sujud” mempertahankan tindakan dan ketegangan maknanya tanpa menyatakan bahwa orang itu menyembah Daud sebagai ilahi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan narasi dibuat alami tanpa menambahkan penanda wacana yang tidak eksplisit. Istilah “perkemahan,” “tanah,” dan “sujud” mempertahankan citra konkret sumber, sedangkan catatan kaki menjaga ambiguitas hubungan dengan Saul dan nuansa tindakan penghormatan.
