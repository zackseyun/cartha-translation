source:
  edition: WLC
  text: וַ/יַּ֧עַן אִתַּ֛י אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר חַי יְהוָ֗ה וְ/חֵי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כִּ֠י אִם בִּ/מְק֞וֹם אֲשֶׁ֥ר יִֽהְיֶה שָּׁ֣ם אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ אִם לְ/מָ֨וֶת֙ אִם לְ/חַיִּ֔ים כִּי שָׁ֖ם יִהְיֶ֥ה עַבְדֶּֽ/ךָ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/021.yaml
  text: Then Ittai answered the king and said[a], “As Yahweh lives, and as my lord the king lives, surely in whatever place my lord the king may be, whether for death or for life[b], there your servant will be.”
translation:
  language: id
  text: Lalu Itai menjawab raja dan berkata, “Demi Yahweh yang hidup dan demi tuanku raja yang hidup,[a] di mana pun tuanku raja berada, entah untuk kematian atau untuk kehidupan,[b] di sanalah hambamu akan berada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ini adalah rumusan sumpah Ibrani yang khidmat: “Demi Yahweh yang hidup dan demi tuanku raja yang hidup.”'
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “entah untuk kematian atau untuk kehidupan.” Frasa ini juga dapat diterjemahkan “baik mati maupun hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אִתַּי אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: Lalu Itai menjawab raja, katanya
  rationale: Mempertahankan struktur naratif jawaban dan pengantar ujaran dalam bahasa Indonesia yang wajar; nama אִתַּי ditransliterasikan sebagai Itai.
- source_word: חַי יְהוָה וְחֵי אֲדֹנִי הַמֶּלֶךְ
  choice: Demi Yahweh yang hidup dan demi tuanku raja yang hidup
  rationale: Ungkapan sumpah Ibrani diterjemahkan dengan formula Indonesia 'demi ... yang hidup', sambil mempertahankan nama ilahi Yahweh dan kesejajaran kedua bagiannya.
- source_word: כִּי אִם
  choice: (tidak dinyatakan sebagai kata tersendiri)
  rationale: Dalam konteks sumpah, unsur ini memberi penegasan pada pernyataan berikutnya. Daya penegasannya tersampaikan oleh formula sumpah dan susunan deklaratif; penambahan 'sungguh' akan terasa berat dalam bahasa Indonesia.
- source_word: בִּמְקוֹם אֲשֶׁר יִהְיֶה שָּׁם
  choice: di mana pun ... berada
  rationale: Menyampaikan lokasi yang terbuka dan tidak ditentukan dengan ungkapan Indonesia yang alami.
- source_word: אִם לְמָוֶת אִם לְחַיִּים
  choice: entah menuju kematian atau kehidupan
  rationale: Menjaga kesejajaran dan preposisi לְ tanpa mempersempit ungkapan menjadi sekadar akibat; frasa ini menyatakan kesetiaan dalam kemungkinan mati maupun hidup.
- source_word: עַבְדֶּךָ
  choice: hambamu
  rationale: Dalam konteks berbicara kepada raja, kata ini merupakan sebutan diri yang merendah dan hormat, bukan penekanan pada status perbudakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya sumpah חַי יְהוָה
  choice: Demi Yahweh yang hidup
  alternative: Yahweh hidup; sebagaimana Yahweh hidup
  rationale: Pilihan ini mengomunikasikan secara langsung bahwa perkataan Itai merupakan sumpah khidmat, bukan sekadar pernyataan tentang kehidupan Allah.
- issue: Cakupan אִם לְמָוֶת אִם לְחַיִּים
  choice: entah menuju kematian atau kehidupan
  alternative: baik mati maupun hidup; entah harus mati atau tetap hidup
  rationale: Terjemahan mempertahankan ketegangan dan keringkasan ungkapan Ibrani tanpa menentukan apakah kematian atau kehidupan adalah keadaan, tujuan, atau hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'tuanku raja' serta sebutan diri 'hambamu' mempertahankan hubungan hormat antara Itai dan Daud tanpa terdengar terlalu arkais.
