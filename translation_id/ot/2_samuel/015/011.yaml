  text: וְ/אֶת אַבְשָׁל֗וֹם הָלְכ֞וּ מָאתַ֤יִם אִישׁ֙ מִ/יר֣וּשָׁלִַ֔ם קְרֻאִ֖ים וְ/הֹלְכִ֣ים לְ/תֻמָּ֑/ם וְ/לֹ֥א יָדְע֖וּ כָּל דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/011.yaml
  text: Two hundred men from Jerusalem went with Absalom[a], invited, and they went innocently, not knowing anything.
translation:
  language: id
  text: Dua ratus laki-laki dari Yerusalem pergi bersama Absalom. Mereka adalah orang-orang yang diundang dan pergi tanpa curiga[a], tanpa mengetahui apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tulus” atau “dalam kepolosan mereka”; ungkapan Ibrani ini menunjukkan bahwa mereka pergi tanpa menaruh curiga dan tidak mengetahui rencana Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... אֶת־אַבְשָׁלוֹם
  choice: pergi bersama Absalom
  rationale: Kata הָלַךְ berarti pergi atau berjalan; dengan אֶת־אַבְשָׁלוֹם, frasa ini menyatakan bahwa mereka menyertai Absalom.
- source_word: מָאתַיִם אִישׁ
  choice: dua ratus orang
  rationale: אִישׁ sesudah bilangan menghitung individu laki-laki, tetapi dalam bahasa Indonesia modern, 'orang' merupakan bentuk hitungan yang paling alami dan tidak menghilangkan informasi penting dalam konteks ini.
- source_word: מִירוּשָׁלַםִ
  choice: dari Yerusalem
  rationale: Preposisi מִן menunjukkan asal atau sumber.
- source_word: קְרֻאִים
  choice: orang-orang yang diundang
  rationale: Partisip pasif dari קרא di sini berarti orang yang telah dipanggil atau diundang; bentuk ini mempertahankan status mereka tanpa menambahkan secara eksplisit bahwa mereka tamu perjamuan.
- source_word: וְהֹלְכִים
  choice: dan pergi
  rationale: Partisip ini melanjutkan gambaran tentang keadaan mereka ketika menyertai Absalom; konstruksi verbal ringkas terdengar alami dalam narasi Indonesia.
- source_word: לְתֻמָּם
  choice: tanpa curiga
  rationale: Dalam konteks klausa berikutnya, ungkapan ini menunjukkan ketulusan atau kepolosan karena mereka tidak mengetahui rencana Absalom. 'Tanpa curiga' menyampaikan keadaan tidak menyadari maksud tersembunyi itu.
- source_word: וְלֹא יָדְעוּ כָּל־דָּבָר
  choice: tanpa mengetahui apa pun
  rationale: Klausa ini menjelaskan bahwa mereka sama sekali tidak mengetahui perkara atau rencana yang sedang berlangsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat dipecah menjadi dua agar rangkaian partisip Ibrani terbaca alami. Ambiguitas לְתֻמָּם antara ketulusan, kepolosan, dan sikap tanpa curiga dipertahankan melalui catatan kaki.
