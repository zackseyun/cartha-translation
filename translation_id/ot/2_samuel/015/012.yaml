source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח אַ֠בְשָׁלוֹם אֶת אֲחִיתֹ֨פֶל הַ/גִּֽילֹנִ֜י יוֹעֵ֣ץ דָּוִ֗ד מֵֽ/עִיר/וֹ֙ מִ/גִּלֹ֔ה בְּ/זָבְח֖/וֹ אֶת הַ/זְּבָחִ֑ים וַ/יְהִ֤י הַ/קֶּ֨שֶׁר֙ אַמִּ֔ץ וְ/הָ/עָ֛ם הוֹלֵ֥ךְ וָ/רָ֖ב אֶת אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/012.yaml
  text: And Absalom sent for Ahithophel the Gilonite[a], David’s counselor, from his city, from Giloh, while he was offering the sacrifices. And the conspiracy grew strong[c][b], and the people kept increasing with Absalom.
translation:
  language: id
  text: Absalom menyuruh memanggil Ahitofel, orang Gilo[a], penasihat Daud, dari kotanya, yaitu Gilo, ketika ia mempersembahkan kurban-kurban. Persekongkolan itu semakin kuat[b], dan orang-orang terus bertambah banyak bersama Absalom.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Gilo,” yakni orang yang berasal dari Gilo. Atau, “Absalom mengutus Ahitofel”; dalam konteks ini, verba tersebut kemungkinan berarti bahwa Absalom memanggilnya untuk bergabung dalam pemberontakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “komplotan itu semakin kuat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rakyat terus berjalan dan menjadi banyak bersama Absalom,” sebuah ungkapan yang menunjukkan bahwa jumlah orang yang bersamanya terus bertambah. Kata “ia” dalam bagian sebelumnya secara formal tidak menyebut apakah yang dimaksud Absalom atau Ahitofel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: menyuruh orang memanggil
  rationale: Dengan objek berupa orang dan dalam konteks perekrutan bagi pemberontakan, verba ini paling wajar dipahami sebagai tindakan menyuruh seseorang untuk memanggil Ahitofel, bukan mengutus Ahitofel ke suatu tempat.
- source_word: הַגִּלֹנִי
  choice: orang Gilo
  rationale: Bentuk nisbah ini menyatakan asal Ahitofel dari Gilo; 'orang Gilo' alami dalam bahasa Indonesia dan mempertahankan identifikasi tersebut.
- source_word: יוֹעֵץ דָּוִד
  choice: yang menjadi penasihat Daud
  rationale: Mengungkapkan hubungan konstruksi Ibrani dan peran politik Ahitofel terhadap Daud secara jelas dan alami.
- source_word: מֵעִירוֹ מִגִּלֹה
  choice: dari kotanya, yaitu Gilo
  rationale: Mempertahankan baik kata umum 'kotanya' maupun nama tempat Gilo, sekaligus membuat hubungan aposisionalnya jelas dalam bahasa Indonesia.
- source_word: בְּזָבְחוֹ אֶת־הַזְּבָחִים
  choice: sementara Absalom mempersembahkan kurban-kurban
  rationale: Konstruksi preposisi dengan infinitif menunjukkan tindakan yang berlangsung bersamaan. Subjek dinyatakan sebagai Absalom karena sufiks tunggalnya secara kontekstual paling mungkin merujuk kepadanya, sambil menghindari ambiguitas pronomina Indonesia.
- source_word: הַקֶּשֶׁר
  choice: persekongkolan
  rationale: Dalam konteks pemberontakan terorganisasi terhadap Daud, kata ini menunjuk pada komplotan atau konspirasi politik; 'persekongkolan' jelas dan alami.
- source_word: אַמִּץ
  choice: semakin kuat
  rationale: Bersama וַיְהִי, bentuk ini menggambarkan perkembangan kekuatan persekongkolan, bukan sekadar keadaan statis.
- source_word: הוֹלֵךְ וָרָב
  choice: semakin banyak
  rationale: Rangkaian ini menyatakan pertambahan yang terus berlangsung; 'semakin banyak' menyampaikan daya duratif idiom Ibrani secara ringkas.
- source_word: הָעָם
  choice: orang
  rationale: Dalam klausa Indonesia, 'semakin banyak orang' secara alami menyatakan jumlah rakyat atau pengikut yang terus bertambah.
- source_word: אֶת אַבְשָׁלוֹם
  choice: berpihak kepada Absalom
  rationale: אֶת di sini menyatakan kebersamaan atau persekutuan. Dalam konteks pemberontakan, 'berpihak kepada' memperjelas kesetiaan politik tanpa mengubah maksud.
theological_decisions:
- issue: Subjek tindakan mempersembahkan kurban dalam בְּזָבְחוֹ
  choice: Absalom
  alternative: Ahitofel atau rujukan pronominal yang dibiarkan tersirat
  rationale: Subjek gramatikal klausa utama adalah Absalom, dan alur konteks menggambarkan tindakan Absalom di Hebron. Namun bentuk Ibraninya hanya memakai sufiks orang ketiga tunggal, sehingga catatan kaki mempertahankan kemungkinan ambiguitas formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. 'Kurban' dipakai untuk זֶבַח dalam konteks persembahan kultis. Struktur sumber dipertahankan sejauh alami, sedangkan idiom הוֹלֵךְ וָרָב dijelaskan melalui terjemahan komunikatif dan catatan kaki.
