  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia kepada teks Ibrani. Namun, frasa akhir perlu menyatakan secara lebih jelas bahwa kedua putra itu menyertai pihak yang dirujuk oleh akhiran jamak Ibrani, bukan sekadar menjadi pelengkap bagi kata kerja “kembalilah” yang ditujukan kepada Zadok seorang diri.
  naturalness: Bahasa umumnya baku dan alami. Peralihan dari “engkau” kepada “kalian” dapat dipertahankan karena Ibrani memang memakai bentuk tunggal lalu jamak, tetapi hubungan frasa “bersama kedua anak kalian” kurang eksplisit dalam bahasa Indonesia.
  terminology: “Imam Zadok,” “pelihat,” “Ahimaas,” “Yonatan,” dan “Abyatar” sesuai register Alkitab Indonesia dan konsisten dengan bentuk nama yang lazim. Catatan kaki sebaiknya memberi alternatif tanpa menambahkan nuansa retoris “Bukankah” yang tidak perlu.
