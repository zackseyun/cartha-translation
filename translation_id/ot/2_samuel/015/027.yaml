base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/027.yaml
  text: Then the king said to Zadok the priest[a], “Are you a seer? Return to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan son of Abiathar.”
translation:
  language: id
  text: 'Kemudian raja berkata kepada Imam Zadok, “Apakah engkau seorang pelihat?[a] Kembalilah ke kota dengan selamat, dan kedua anak kalian menyertai kalian: Ahimaas, anakmu, dan Yonatan, anak Abyatar.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Apakah engkau melihat?” Kata Ibrani yang dipakai dapat menunjuk kepada seorang “pelihat” atau kepada tindakan melihat atau memahami.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Kemudian raja berkata
  rationale: Waw naratif melanjutkan alur cerita; “kemudian” wajar dalam narasi Indonesia modern.
- source_word: הֲרוֹאֶה אַתָּה
  choice: Apakah engkau seorang pelihat?
  rationale: Mempertahankan kemungkinan bahwa רֹאֶה menunjuk kepada pelihat, sekaligus menandai bentuk interogatif הֲ; kemungkinan makna melihat atau memahami dicatat dalam catatan kaki.
- source_word: שֻׁבָה הָעִיר
  choice: Kembalilah ke kota
  rationale: Bentuk imperatif שוב dengan he direktif menyatakan perintah untuk kembali menuju kota.
- source_word: בְּשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan, שָׁלוֹם terutama menyatakan keadaan aman dan sejahtera; ungkapan ini lebih alami daripada terjemahan harfiah “dalam damai”.
- source_word: שְׁנֵי בְנֵיכֶם אִתְּכֶם
  choice: bersama kedua anak kalian
  rationale: Akhiran jamak pada “anak kalian” dan “bersama kalian” mencakup Zadok dan Abyatar; bahasa Indonesia perlu mempertahankan rujukan jamak tersebut.
- source_word: וַאֲחִימַעַץ בִּנְךָ וִיהוֹנָתָן בֶּן־אֶבְיָתָר
  choice: Ahimaas, anakmu, dan Yonatan, anak Abyatar
  rationale: Kedua nama menjelaskan secara aposisional siapa kedua anak yang dimaksud, sambil mempertahankan identitas ayah masing-masing.
theological_decisions:
- issue: Status Zadok sebagai רֹאֶה
  choice: Pertanyaan diterjemahkan “Apakah engkau seorang pelihat?”
  alternative: “Bukankah engkau dapat melihat?” atau “Engkau melihat, bukan?”
  rationale: Bentuk Ibrani memungkinkan רֹאֶה dipahami sebagai sebutan “pelihat” atau sebagai bentuk verbal yang berkaitan dengan melihat atau memahami. Teks utama mengikuti pembacaan nominal-interogatif tanpa menutup alternatifnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam dialog naratif Alkitab; “kalian” dipertahankan untuk akhiran jamak Ibrani yang merujuk kepada Zadok dan Abyatar. Ejaan nama mengikuti bentuk Indonesia yang lazim: Ahimaas, Yonatan, dan Abyatar.'
