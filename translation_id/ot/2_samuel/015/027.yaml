  to: 'Kemudian raja berkata kepada Imam Zadok, “Apakah engkau seorang pelihat?[a] Kembalilah ke kota dengan selamat, dan kedua anak kalian menyertai kalian: Ahimaas, anakmu, dan Yonatan, anak Abyatar.”'
