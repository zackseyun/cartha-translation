reference: 2 Samuel 15:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֥א חוּשַׁ֛י רֵעֶ֥ה דָוִ֖ד הָ/עִ֑יר וְ/אַבְשָׁלֹ֔ם יָבֹ֖א יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/037.yaml
  text: So Hushai[a], David’s friend, came into the city, as Absalom was entering Jerusalem.
translation:
  language: id
  text: Demikianlah Husai, sahabat Daud, tiba di kota itu ketika Absalom sedang memasuki Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan Absalom masuk ke Yerusalem.” Konjungsi Ibrani juga dapat dipahami sebagai penghubung urutan biasa, dan kata kerjanya dapat diterjemahkan dengan bentuk lampau sederhana.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba di
  rationale: Kata בוא dapat berarti datang atau masuk. Dengan tujuan הָעִיר, “tiba di kota itu” menyampaikan gerak menuju kota secara alami tanpa mengulang “memasuki” pada klausa berikutnya.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: רֵעֶה דָוִד
  choice: sahabat Daud
  rationale: רֵעֶה berarti sahabat, teman, atau rekan. “Sahabat Daud” langsung dan tidak menambahkan jabatan resmi seperti penasihat.
- source_word: הָעִיר
  choice: kota itu
  rationale: Nomina Ibrani bersifat definit; “kota itu” mempertahankan penyebutan umum dalam teks, meskipun konteksnya menunjuk kepada Yerusalem.
- source_word: וְאַבְשָׁלֹם
  choice: ketika Absalom
  rationale: Konjungsi ו di sini dapat menghubungkan klausa yang berlatarkan waktu bersamaan. “Ketika” menyatakan hubungan temporal secara wajar dalam bahasa Indonesia, sementara kemungkinan urutan sederhana dicatat dalam catatan kaki.
- source_word: יָבֹא
  choice: sedang memasuki
  rationale: Bentuk yiqtol sesudah wayyiqtol sebelumnya dapat dipahami sebagai tindakan yang sedang berlangsung atau berbarengan. “Sedang memasuki” mempertahankan perbedaan aspek tersebut.
- source_word: יְרוּשָׁלִָם
  choice: Yerusalem
  rationale: Menggunakan bentuk baku nama tempat ini dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. “Demikianlah” menghubungkan ayat ini dengan hasil rencana pada konteks sebelumnya; “sahabat” mempertahankan relasi tanpa menjadikannya jabatan resmi. Penanda catatan kaki ditempatkan setelah kalimat yang memiliki pembacaan alternatif.
