  text: וַ/יָּבֹא֙ הַ/מַּגִּ֔יד אֶל דָּוִ֖ד לֵ/אמֹ֑ר הָיָ֛ה לֶב אִ֥ישׁ יִשְׂרָאֵ֖ל אַחֲרֵ֥י אַבְשָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/013.yaml
  text: Then a messenger came to David[a], saying, “The hearts of the men of Israel are with Absalom.”
translation:
  language: id
  text: Lalu datanglah seorang pembawa kabar kepada Daud dan berkata, “Hati orang-orang Israel telah berpihak kepada Absalom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu datanglah
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur narasi dengan tindakan lampau; 'lalu datanglah' merupakan ungkapan naratif Indonesia yang wajar dan bermartabat.
- source_word: הַמַּגִּיד
  choice: seorang pembawa kabar
  rationale: Partisipel Hifil ini menunjuk kepada orang yang membawa atau menyampaikan laporan. Meskipun bentuk Ibraninya definit, dalam konteks ini bahasa Indonesia secara alami memperkenalkan tokoh tersebut dengan 'seorang'.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif konstruk ini memperkenalkan ujaran langsung. 'Dan berkata' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dengan mengatakan'.
- source_word: הָיָה לֶב
  choice: Hati ... telah berpihak
  rationale: Secara harfiah konstruksi ini menyebut 'hati' yang telah berada 'di belakang' Absalom. Dalam konteks politik, hati menunjuk pada kehendak atau kesetiaan; bentuk tunggal dipertahankan sebagai ungkapan kolektif yang alami dalam bahasa Indonesia.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: אִישׁ berbentuk tunggal tetapi berfungsi kolektif. 'Orang-orang Israel' mempertahankan rujukan kepada warga Israel tanpa memaksakan pembatasan militer yang tidak dinyatakan secara eksplisit.
- source_word: אַחֲרֵי
  choice: berpihak kepada
  rationale: Arti dasarnya 'di belakang/mengikuti', tetapi dalam ungkapan ini menyatakan kesetiaan atau dukungan politik. 'Berpihak kepada' menyampaikan makna idiomatis itu dengan jelas.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
