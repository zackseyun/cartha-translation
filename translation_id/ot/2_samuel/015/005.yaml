source:
  edition: WLC
  text: וְ/הָיָה֙ בִּ/קְרָב אִ֔ישׁ לְ/הִשְׁתַּחֲוֺ֖ת ל֑/וֹ וְ/שָׁלַ֧ח אֶת יָד֛/וֹ וְ/הֶחֱזִ֥יק ל֖/וֹ וְ/נָ֥שַׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/005.yaml
  text: And whenever a man came near to bow down to him[a], he would reach out his hand, take hold of him, and kiss him.
translation:
  language: id
  text: Setiap kali seorang laki-laki mendekat untuk bersujud kepadanya[a], Absalom mengulurkan tangannya, memegang orang itu, lalu menciumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi hormat kepadanya.” Kata kerja Ibrani ini dapat menunjuk pada tindakan bersujud sebagai tanda hormat, tidak selalu pada penyembahan dalam arti religius yang sempit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Setiap kali ... Absalom ...
  rationale: Dalam konteks narasi, waw + היה memperkenalkan tindakan yang biasa atau berulang. Konstruksi “Setiap kali” menyampaikan aspek kebiasaan itu secara alami dalam bahasa Indonesia.
- source_word: בִּקְרָב
  choice: mendekat
  rationale: Bentuk dari קרב menunjukkan gerak mendekati atau datang dekat; “mendekat” ringkas dan wajar.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina Ibrani ini berbentuk tunggal maskulin. Pilihan ini mempertahankan penandaan gender sumber dan tetap dapat dipahami secara wajar dalam adegan tersebut.
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: untuk bersujud kepadanya
  rationale: השתחוה menunjuk pada tindakan membungkuk rendah atau bersujud sebagai penghormatan. “Bersujud” mempertahankan gerak tubuh tanpa menyatakan bahwa tindakan itu pasti merupakan penyembahan religius.
- source_word: וְשָׁלַח אֶת יָדוֹ
  choice: mengulurkan tangannya
  rationale: Ungkapan dengan שׁלח dan “tangan” berarti mengulurkan tangan; padanan ini alami dalam bahasa Indonesia.
- source_word: וְהֶחֱזִיק לוֹ
  choice: memegang orang itu
  rationale: Bentuk hiphil החזיק di sini berarti memegang atau meraih seseorang. “Memegang” sesuai dengan gestur sosial dalam konteks dan menghindari kesan keras dari “menangkap” atau “mencengkeram.”
- source_word: וְנָשַׁק לוֹ
  choice: lalu menciumnya
  rationale: נשק berarti “mencium.” Kata “lalu” mengalirkan urutan tindakan secara alami tanpa menambahkan penafsiran atas makna sosial ciuman itu.
theological_decisions:
- issue: Apakah השתחוה berarti penyembahan religius atau penghormatan sosial
  choice: bersujud kepadanya, dengan catatan bahwa ini dapat menjadi penghormatan
  alternative: memberi hormat kepadanya
  rationale: Konteksnya adalah penghormatan kepada Absalom, tetapi kata Ibrani tetap menggambarkan tindakan bersujud. Teks utama mempertahankan gerak fisik, sedangkan catatan kaki menjaga keluasan maknanya dan mencegah pembacaan religius yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama “Absalom” diulangi sebagai subjek agar rujukan pronomina tidak rancu dalam bahasa Indonesia; “orang itu” juga digunakan untuk menghindari rangkaian pronomina yang kabur. Penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
