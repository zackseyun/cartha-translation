reference: 2 Samuel 15:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל אִתַּ֣י הַ/גִּתִּ֔י לָ֧/מָּה תֵלֵ֛ךְ גַּם אַתָּ֖ה אִתָּ֑/נוּ שׁ֣וּב וְ/שֵׁ֤ב עִם הַ/מֶּ֨לֶךְ֙ כִּֽי נָכְרִ֣י אַ֔תָּה וְ/גַם גֹּלֶ֥ה אַתָּ֖ה לִ/מְקוֹמֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/019.yaml
  text: Then the king said to Ittai the Gittite[a], “Why are you also going with us? Return and stay with the king[c][b], for you are a foreigner and also an exile from your own place.”
translation:
  language: id
  text: Lalu raja berkata kepada Itai, orang Gat, “Mengapa engkau juga pergi bersama kami?[a] Kembalilah dan tinggallah bersama raja,[b] sebab engkau orang asing dan juga orang buangan dari tempat asalmu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Mengapa engkau juga akan pergi bersama kami?”
    reason: Bentuk verba Ibrani dapat dipahami sebagai tindakan yang sedang berlangsung atau yang akan dilakukan.
  - marker: b
    text: Sebutan “raja” mungkin merujuk pada penguasa yang memerintah di Yerusalem; teks Ibrani tidak menyebutkan secara tegas siapa yang dimaksud.
    reason: Referen gelar “raja” dibiarkan implisit dalam teks sumber.
  - marker: c
    text: 'Secara lebih harfiah: “dan engkau juga orang buangan ke tempatmu.” Susunan Ibraninya padat dan dapat menekankan keadaan Itai yang terusir serta hubungannya dengan tempat asalnya.'
    reason: Preposisi dan susunan frasa Ibrani memungkinkan terjemahan harfiah yang janggal, sehingga alternatifnya perlu dicatat.
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Lalu raja berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Lalu” menghasilkan alur naratif Indonesia yang wajar, sedangkan “raja” mempertahankan gelar yang dipakai teks Ibrani tanpa menggantinya dengan nama Daud.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, orang Gat
  rationale: Nama diri ditransliterasikan sebagai “Itai”; sebutan nisbah הַגִּתִּי diterjemahkan secara alami sebagai “orang Gat”, yakni orang yang berasal dari Gat.
- source_word: לָמָּה תֵלֵךְ גַּם אַתָּה אִתָּנוּ
  choice: Mengapa engkau juga pergi bersama kami?
  rationale: Bentuk imperfek dapat menyatakan tindakan yang sedang atau segera dilakukan. “Juga” mempertahankan גַּם, dan pertanyaannya tetap langsung serta pribadi.
- source_word: שׁוּב וְשֵׁב
  choice: Kembalilah dan tinggallah
  rationale: Kedua bentuk imperatif dipertahankan. Dalam konteks ini, ישׁב berarti tinggal atau menetap, bukan sekadar duduk.
- source_word: עִם הַמֶּלֶךְ
  choice: bersama raja
  rationale: Ungkapan Ibrani dipertahankan secara formal. Referen “raja” tidak disebutkan secara eksplisit, sehingga terjemahan tidak menggantinya dengan nama atau penjelasan tertentu.
- source_word: נָכְרִי
  choice: orang asing
  rationale: Mengungkapkan status Itai sebagai orang yang bukan penduduk asli tanpa memberi kesan bahwa ia sekadar orang yang tidak dikenal.
- source_word: וְגַם גֹּלֶה אַתָּה
  choice: dan juga orang buangan
  rationale: גֹּלֶה menunjuk kepada orang yang terusir, terasing, atau hidup dalam pembuangan. “Orang buangan” jelas dan sesuai dengan konteks perpindahan tempat.
- source_word: לִמְקוֹמֶךָ
  choice: dari tempat asalmu
  rationale: Secara harfiah preposisi לְ biasanya berarti “ke/kepada”, tetapi susunan kalimatnya padat dan sukar. Dalam hubungan dengan “orang buangan”, “dari tempat asalmu” menyampaikan status keterpisahan Itai dengan jelas; bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen “raja” dalam perintah “tinggallah bersama raja”
  choice: Mempertahankan sebutan “raja” tanpa menentukan siapa yang dimaksud
  alternative: “bersama Raja Absalom”, “bersama raja di Yerusalem”, atau “bersamaku sebagai raja”
  rationale: Teks Ibrani mengulangi gelar הַמֶּלֶךְ dan tidak menyebutkan nama referennya. Menjaga ungkapan ini apa adanya mempertahankan ambiguitas naratif dan menghindari keputusan tafsir yang tidak dinyatakan teks.
- issue: Hubungan orang buangan dengan לִמְקוֹמֶךָ
  choice: “orang buangan dari tempat asalmu” dalam teks utama, disertai alternatif harfiah dalam catatan kaki
  alternative: “orang buangan ke tempatmu”
  rationale: Susunan Ibrani sangat padat. Terjemahan utama mengungkapkan keadaan Itai sebagai orang yang terusir dari tempat asalnya, tetapi catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah dengan preposisi “ke”.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “engkau” dipakai karena tuturan langsung bersifat personal dan sesuai dengan register narasi Alkitab. Kalimat mempertahankan pengulangan gelar “raja” serta ambiguitas referennya.
