  source_fidelity: 'Terjemahan mengikuti teks Ibrani dengan baik: imperatif untuk mengembalikan tabut ke kota, syarat ''mendapat perkenanan di mata Yahweh'', serta dua tindakan Yahweh—membawa Daud kembali dan memperlihatkan objek serta kediamannya. ''Tabut Allah'' tepat mempertahankan אֱלֹהִים, sedangkan ''Yahweh'' tepat untuk יהוה.'
  naturalness: Bahasa Indonesia modern, jelas, dan bernada layak bagi narasi Alkitab. 'Bawalah kembali', 'mendapat perkenanan di mata Yahweh', dan 'memperlihatkan kepadaku' semuanya wajar dalam register formal. Pengulangan 'tabut itu' membuat rujukan pronomina Ibrani jelas tanpa mengubah makna.
  terminology: Istilah 'tabut Allah', 'Yahweh', dan 'tempat kediamannya' konsisten dengan sumber dan menghindari anakronisme seperti 'bait'. Kapitalisasi 'Ia/Dia/Nya' dalam rujukan alternatif kepada Allah sesuai konvensi Indonesia yang lazim. Catatan kaki secara memadai mempertahankan kemungkinan rujukan yang lebih berpusat pada Allah.
