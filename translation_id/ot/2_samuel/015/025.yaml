  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ לְ/צָד֔וֹק הָשֵׁ֛ב אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים הָ/עִ֑יר אִם אֶמְצָ֥א חֵן֙ בְּ/עֵינֵ֣י יְהוָ֔ה וֶ/הֱשִׁבַ֕/נִי וְ/הִרְאַ֥/נִי אֹת֖/וֹ וְ/אֶת נָוֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/025.yaml
  text: Then the king said to Zadok[a], “Return the ark of God to the city. If I find favor in the eyes of Yahweh, he will bring me back and let me see it and its dwelling place.”
translation:
  language: id
  text: Lalu raja berkata kepada Zadok, “Bawalah kembali tabut Allah ke kota. Jika aku mendapat perkenanan di mata Yahweh, Ia akan membawaku kembali dan memperlihatkan kepadaku tabut itu serta tempat kediamannya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperlihatkan kepadaku Dia serta tempat kediaman-Nya.” Bahasa Ibraninya dapat dipahami dengan rujukan yang lebih berpusat pada Allah, meskipun anteseden terdekatnya adalah “tabut Allah”.
    reason: alternative_reading
lexical_decisions:
- source_word: הָשֵׁב
  choice: Bawalah kembali
  rationale: Bentuk imperatif kausatif dari שוב ditujukan kepada Zadok; frasa ini secara alami menyampaikan perintah agar tabut dibawa kembali.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Teks Ibrani secara eksplisit memakai אֱלֹהִים, sehingga diterjemahkan 'Allah' tanpa diselaraskan menjadi sebutan ilahi lain.
- source_word: הָעִיר
  choice: ke kota
  rationale: Walaupun tidak memakai preposisi tertulis, konteks sesudah verba gerak memberi arah tujuan; 'ke kota' wajar dalam bahasa Indonesia.
- source_word: אִם אֶמְצָא חֵן בְּעֵינֵי יְהוָה
  choice: Jika aku mendapat perkenanan di mata Yahweh
  rationale: Mempertahankan idiom Ibrani 'mendapat perkenanan di mata' sekaligus memakai nama diri Yahweh untuk יהוה.
- source_word: וֶהֱשִׁבַנִי
  choice: Ia akan membawaku kembali
  rationale: Bentuk Hifil dengan sufiks orang pertama tunggal menyatakan bahwa Yahweh akan menyebabkan Daud kembali, yakni membawanya kembali.
- source_word: וְהִרְאַנִי
  choice: dan memperlihatkan kepadaku
  rationale: Bentuk Hifil dari ראה berarti 'membuat melihat' atau 'memperlihatkan'; pilihan ini alami dan tetap dekat dengan struktur sumber.
- source_word: אֹתוֹ
  choice: tabut itu
  rationale: Pronomina maskulin tunggal paling langsung merujuk kepada 'tabut', anteseden terdekat; nomina diulangi agar rujukannya jelas dalam bahasa Indonesia.
- source_word: נָוֵהוּ
  choice: tempat kediamannya
  rationale: נוה dapat berarti tempat tinggal atau kediaman. Terjemahan ini tidak secara anakronistis menyebut bait dan mempertahankan kemungkinan rujukan pronominal yang tersirat.
theological_decisions:
- issue: Rujukan frasa אֹתוֹ וְאֶת־נָוֵהוּ
  choice: Dalam teks utama, frasa dipahami sebagai 'tabut itu serta tempat kediamannya'.
  alternative: 'Frasa dapat dipahami secara lebih berpusat pada Allah: ''Dia serta tempat kediaman-Nya''.'
  rationale: Anteseden langsung אֹתוֹ ialah tabut Allah, tetapi bentuk maskulin pronomina dan hubungan tabut dengan kehadiran Allah memungkinkan nuansa rujukan kepada Allah. Catatan kaki mempertahankan ambiguitas ini tanpa menetapkan tafsir teologis secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'. Ungkapan idiomatis Ibrani dipertahankan sejauh tetap jelas bagi pembaca umum.
