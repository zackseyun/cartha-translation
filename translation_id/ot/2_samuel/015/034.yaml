  terminology: ‘Hamba’, ‘nasihat’, dan ‘Ahitofel’ tepat dalam register naratif-kerajaan. Sapaan ‘ya raja’ dipertahankan sebagai vokatif, dengan huruf kecil karena ini gelar umum dalam ujaran langsung.
