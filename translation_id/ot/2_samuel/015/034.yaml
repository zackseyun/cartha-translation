source:
  edition: WLC
  text: וְ/אִם הָ/עִ֣יר תָּשׁ֗וּב וְ/אָמַרְתָּ֤ לְ/אַבְשָׁלוֹם֙ עַבְדְּ/ךָ֨ אֲנִ֤י הַ/מֶּ֨לֶךְ֙ אֶֽהְיֶ֔ה עֶ֣בֶד אָבִ֤י/ךָ וַֽ/אֲנִי֙ מֵ/אָ֔ז וְ/עַתָּ֖ה וַ/אֲנִ֣י עַבְדֶּ֑/ךָ וְ/הֵפַרְתָּ֣ה לִ֔/י אֵ֖ת עֲצַ֥ת אֲחִיתֹֽפֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/034.yaml
  text: But if you return to the city and say to Absalom, ‘I will be your servant, O king; as I was your father’s servant in the past, so now I will be your servant,’ then you will frustrate Ahithophel’s counsel for me.
translation:
  language: id
  text: Tetapi, jika engkau kembali ke kota dan berkata kepada Absalom, ‘Aku akan menjadi hambamu, ya raja. Sebagaimana dahulu aku menjadi hamba ayahmu, demikian juga sekarang aku akan menjadi hambamu,’ maka engkau akan menggagalkan nasihat Ahitofel demi kepentinganku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Konteks menyatakan pertentangan dengan rencana sebelumnya; ‘jika’ mempertahankan bentuk syarat.
- source_word: עַבְדְּךָ ... עֶבֶד ... עַבְדֶּךָ
  choice: hambamu ... hamba ... hambamu
  rationale: Mengulangi istilah ‘hamba’ sebagaimana teks Ibrani dan mempertahankan bahasa kesetiaan politis.
- source_word: מֵאָז וְעַתָּה
  choice: Dahulu ... dan sekarang
  rationale: Menyampaikan kontras waktu secara alami tanpa menambahkan hubungan perbandingan yang tidak dinyatakan secara eksplisit.
- source_word: וְהֵפַרְתָּ
  choice: maka engkau dapat menggagalkan
  rationale: Dalam konteks rencana Daud, verba ini berarti membatalkan atau menggagalkan; ‘dapat’ menyampaikan fungsi hasil dari syarat tanpa menjadikannya janji mutlak.
- source_word: עֲצַת אֲחִיתֹפֶל
  choice: nasihat Ahitofel
  rationale: ‘Nasihat’ mencakup saran atau rancangan strategis dalam konteks istana.
- source_word: לִי
  choice: demi aku
  rationale: Menyatakan bahwa tindakan Husai dilakukan untuk kepentingan Daud.
theological_decisions:
- issue: Ucapan penyamaran Husai kepada Absalom
  choice: Diterjemahkan langsung sebagai ucapan yang diperintahkan Daud, tanpa penilaian moral tambahan.
  alternative: Menjelaskannya sebagai dusta atau siasat yang dibenarkan/dikecam.
  rationale: Ayat ini melaporkan strategi Daud tetapi tidak secara eksplisit memberi penilaian teologis atau etis.
- issue: Hubungan antara pelayanan dahulu dan sekarang
  choice: ‘Dahulu aku adalah hamba ayahmu, dan sekarang aku akan menjadi hambamu.’
  alternative: ‘Sebagaimana dahulu aku adalah hamba ayahmu, demikianlah sekarang aku akan menjadi hambamu.’
  rationale: Teks Masoret memuat urutan ‘dan aku dahulu ... dan sekarang ...’, sehingga kontras temporal dipertahankan tanpa mempertegas konstruksi perbandingan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘ya Raja’ mempertahankan bentuk vokatif, sedangkan pronomina ‘engkau’ sesuai dengan dialog naratif yang luhur namun tetap mudah dipahami.
