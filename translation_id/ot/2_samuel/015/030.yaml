translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan struktur yang tetap mudah dipahami. Pengulangan Ibrani dipertahankan melalui 'terus mendaki' agar penekanannya terdengar tanpa membuat kalimat terasa kaku. Semua penanda catatan kaki ditempatkan dalam teks utama.
