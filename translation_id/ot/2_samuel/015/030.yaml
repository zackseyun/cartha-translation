base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/030.yaml
  text: And David was going up the ascent of the Mount of Olives[a], going up and weeping, with his head covered, and he was walking barefoot. And all the people who were with him each covered his head, and they went up[c][b], weeping as they went.
translation:
  language: id
  text: Daud sedang mendaki tanjakan Bukit Zaitun; sambil mendaki ia menangis. Kepalanya tertutup, dan ia berjalan tanpa alas kaki. Semua orang yang menyertainya masing-masing menutupi kepalanya,[a] lalu mereka terus mendaki sambil menangis.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang menutupi kepalanya”; bentuk tunggal dalam bahasa Ibrani dipakai secara distributif.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang gagasan mendaki untuk memberi penekanan dan membuat adegan terasa hidup: “mereka mendaki, terus mendaki dan menangis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֵה הַזֵּיתִים
  choice: lereng Bukit Zaitun
  rationale: מַעֲלֵה menunjuk pada tempat atau jalan menanjak. Dalam konteks nama tempat yang sudah mapan, 'lereng Bukit Zaitun' alami dalam bahasa Indonesia dan mempertahankan gambaran topografis.
- source_word: עֹלֶה ... עֹלֶה וּבוֹכֶה
  choice: mendaki ... sambil terus mendaki, ia menangis
  rationale: Pengulangan partisip Ibrani menggambarkan tindakan yang sedang berlangsung dengan jelas. Kata 'terus' mempertahankan penekanan itu tanpa menghasilkan pengulangan Indonesia yang kaku.
- source_word: בֹּכֶה
  choice: menangis
  rationale: '''Menangis'' menyampaikan arti emosional dan fisik yang langsung tanpa menambahkan nuansa ratapan ritual.'
- source_word: וְרֹאשׁ לוֹ חָפוּי
  choice: kepalanya tertutup
  rationale: Terjemahan ini mempertahankan keadaan yang dinyatakan teks tanpa menentukan bahan atau cara kepalanya ditutupi.
- source_word: יָחֵף
  choice: tanpa alas kaki
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia modern untuk keadaan berjalan dengan kaki telanjang.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: semua orang yang menyertainya
  rationale: הָעָם di sini dapat menunjuk secara umum kepada rombongan Daud; 'orang' tidak mempersempitnya menjadi pasukan.
- source_word: חָפוּ אִישׁ רֹאשׁוֹ
  choice: menutupi kepala masing-masing
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' mengungkapkan bahwa setiap orang menutupi kepalanya dengan wajar dalam bahasa Indonesia.
- source_word: וְעָלוּ עָלֹה וּבָכֹה
  choice: mereka terus mendaki sambil menangis
  rationale: Konstruksi verba finit dengan infinitif absolut menegaskan tindakan yang berlanjut. 'Terus mendaki' mempertahankan daya penekanan, sedangkan 'sambil menangis' menunjukkan tindakan yang berlangsung bersamaan.
