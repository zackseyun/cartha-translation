  text: Para hamba raja berkata kepada raja, “Apa pun yang Tuanku Raja pilih, kami adalah hamba-hambamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר memperkenalkan ucapan langsung; “berkata” merupakan padanan naratif yang lugas dan alami.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: para hamba raja
  rationale: Dalam konteks istana, עבד menunjuk para pelayan atau pengikut resmi raja. “Hamba” mempertahankan nuansa kesetiaan dan pengabdian tanpa menegaskan status budak.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Padanan langsung bagi preposisi arah yang menandai pihak yang diajak bicara.
- source_word: כְּכֹל אֲשֶׁר יִבְחַר
  choice: apa pun yang dipilih
  rationale: Ungkapan Ibrani secara harfiah berarti “sesuai dengan segala yang dipilih”; bentuk ini secara alami menyampaikan kesiapan untuk mengikuti pilihan raja sepenuhnya.
- source_word: יִבְחַר
  choice: dipilih
  rationale: בחר berarti memilih atau menentukan pilihan. Bentuk pasif Indonesia memungkinkan “Tuanku Raja” tetap menjadi pelaku yang diletakkan sesudah verba secara alami.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan istana yang hormat; “Tuanku Raja” mempertahankan bentuk orang pertama pada אֲדֹנִי dan terdengar wajar serta bermartabat dalam bahasa Indonesia.
- source_word: הִנֵּה עֲבָדֶיךָ
  choice: kami, hamba-hambamu, siap melaksanakannya
  rationale: הִנֵּה menyatakan kehadiran dan kesiapan. Dalam konteks ini, frasa tersebut bukan sekadar menunjukkan lokasi, melainkan menyerahkan diri untuk menaati pilihan raja; “siap melaksanakannya” membuat fungsi pragmatis itu jelas, sedangkan “hamba-hambamu” mempertahankan pengulangan akar עבד.
