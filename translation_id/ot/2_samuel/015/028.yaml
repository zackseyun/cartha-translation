  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak diterjemahkan “kalian” agar jumlah gramatikal jelas; “aku” dipakai sesuai tuturan langsung Daud. Varian ketiv-qere pada ב/עברות dipertahankan secara transparan melalui catatan kaki.
