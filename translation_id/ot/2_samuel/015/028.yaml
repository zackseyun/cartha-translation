  text: See[b][a], I will wait at the fords of the wilderness until word comes from you to inform me.
translation:
  language: id
  text: Perhatikan, aku akan menunggu di tempat-tempat penyeberangan di padang belantara[a] sampai kabar dari kalian sampai kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tertulis, “di tempat-tempat penyeberangan.” Tradisi pembacaan Masoret berbunyi, “di dataran-dataran padang belantara.”
    reason: textual_variant
lexical_decisions:
- source_word: רְאוּ
  choice: Ketahuilah
  rationale: Imperatif jamak ini berfungsi menarik perhatian. “Ketahuilah” menyampaikan daya langsungnya secara wajar dalam bahasa Indonesia modern.
- source_word: אָנֹכִי
  choice: aku
  rationale: Kata ganti mandiri memberi penekanan pada pembicara; konteks dan susunan kalimat sudah cukup membawa penekanan itu tanpa tambahan refleksif yang kaku.
- source_word: מִתְמַהְמֵהַּ
  choice: akan menunggu
  rationale: Partisipel hitpael menyatakan berlama-lama atau menunda. Dalam konteks ini Daud sengaja tetap di tempat sambil menantikan kabar, sehingga “akan menunggu” menyampaikan fungsi ungkapannya dengan alami.
- source_word: בְּעַבְרוֹת
  choice: di tempat-tempat penyeberangan
  rationale: Bentuk jamak ini menunjuk pada tempat-tempat untuk menyeberang. Terjemahan ini mempertahankan bentuk jamak dan tidak memaksakan bahwa semuanya pasti berupa arungan sungai.
- source_word: הַמִּדְבָּר
  choice: padang belantara
  rationale: Istilah ini menunjuk wilayah liar atau terbuka, bukan khusus gurun berpasir; “padang belantara” jelas dan wajar dalam register Alkitab modern.
- source_word: עַד בּוֹא דָבָר
  choice: sampai datang kabar
  rationale: Dalam konteks ini דָבָר berarti kabar atau pesan. “Datang kabar” merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: מֵעִמָּכֶם
  choice: dari kalian
  rationale: Ungkapan preposisional ini menyatakan asal kabar, yaitu dari orang-orang yang disapa; bentuk jamak “kalian” mempertahankan jumlah gramatikal.
- source_word: לְהַגִּיד לִי
  choice: untuk disampaikan kepadaku
  rationale: Infinitif hifil dari נגד berarti memberitahukan atau menyampaikan. Bentuk pasif ini mengalir alami setelah “kabar” dan mempertahankan tujuan penyampaian kepada Daud.
