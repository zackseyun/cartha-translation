  text: David said to him[a], “If you pass on with me, you will be a burden to me.”
translation:
  language: id
  text: Daud berkata kepadanya, “Jika engkau ikut pergi bersamaku, engkau akan menjadi beban bagiku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר ... דָּוִד
  choice: Daud berkata
  rationale: Bentuk naratif dengan waw-konsekutif melanjutkan alur cerita; dalam bahasa Indonesia modern, hubungan itu sudah wajar tanpa harus menambahkan ‘Lalu’ atau ‘Dan’.
- source_word: לוֹ
  choice: kepadanya
  rationale: Mempertahankan pronomina yang eksplisit dalam bahasa Ibrani tanpa memasukkan nama Husai, yang hanya diketahui dari konteks sekitar.
- source_word: אִם
  choice: Jika
  rationale: Menyatakan syarat secara langsung dan alami.
- source_word: עָבַרְתָּ אִתִּי
  choice: engkau ikut pergi bersamaku
  rationale: עבר secara dasar berarti ‘melintas/melewati’, tetapi dalam konteks ini menunjuk pada tindakan menyertai Daud dalam perjalanan selanjutnya. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan gerak serta kebersamaan.
- source_word: וְהָיִתָ עָלַי לְמַשָּׂא
  choice: engkau akan menjadi beban bagiku
  rationale: Konstruksi היה + על menyatakan dampak atau tanggungan yang menimpa Daud, sedangkan מַשָּׂא berarti beban; terjemahan ini jelas, idiomatis, dan dekat dengan bentuk sumber.
