source:
  edition: WLC
  text: וַ/יָּ֨שֶׁב צָד֧וֹק וְ/אֶבְיָתָ֛ר אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים יְרוּשָׁלִָ֑ם וַ/יֵּשְׁב֖וּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/029.yaml
  text: So Zadok and Abiathar returned the ark of God to Jerusalem, and they stayed there.
translation:
  language: id
  text: Jadi Zadok dan Abyatar membawa kembali tabut Allah ke Yerusalem, lalu mereka tinggal di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: membawa kembali
  rationale: 'Bentuk Hifil dari שׁוב bersifat kausatif dan transitif: Zadok dan Abyatar membawa tabut itu kembali. Ungkapan ini alami dalam bahasa Indonesia dan membuat objek verba tetap jelas.'
- source_word: צָדוֹק
  choice: Zadok
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְאֶבְיָתָר
  choice: dan Abyatar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, dengan konjungsi dipertahankan.
- source_word: אֶת אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Teks Ibrani hanya menyebut 'tabut Allah'; terjemahan tidak menambahkan unsur 'perjanjian' yang tidak terdapat dalam ayat ini.
- source_word: יְרוּשָׁלָם
  choice: ke Yerusalem
  rationale: Preposisi 'ke' menyatakan arah gerak menuju Yerusalem yang tersirat oleh verba dan konteks.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: lalu mereka tinggal di sana
  rationale: Dalam konteks naratif, ישׁב menyatakan bahwa mereka tetap berada di tempat itu. 'Tinggal di sana' alami dan mudah dipahami; 'lalu' menandai kelanjutan peristiwa.
