  text: וְ/דָוִד֙ הִגִּ֣יד לֵ/אמֹ֔ר אֲחִיתֹ֥פֶל בַּ/קֹּשְׁרִ֖ים עִם אַבְשָׁל֑וֹם וַ/יֹּ֣אמֶר דָּוִ֔ד סַכֶּל נָ֛א אֶת עֲצַ֥ת אֲחִיתֹ֖פֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/031.yaml
  text: And it was told David[a], saying, “Ahithophel is among the conspirators with Absalom.” And David said, “O Yahweh, please turn Ahithophel’s counsel into foolishness.”
translation:
  language: id
  text: Lalu Daud diberi tahu, “Ahitofel termasuk di antara orang-orang yang bersekongkol dengan Absalom.” Daud pun berkata, “Ya Yahweh, jadikanlah kiranya nasihat Ahitofel bodoh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gagalkanlah nasihat Ahitofel.” Secara lebih harfiah, bahasa Ibrani memohon agar nasihat Ahitofel dijadikan bodoh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּיד
  choice: seseorang memberi tahu
  rationale: Bentuk Hifil dari נגד berarti ‘memberi tahu’ atau ‘melaporkan’. Karena bahasa Ibrani tidak menyebutkan pelakunya, ‘seseorang’ mempertahankan ketidakpastian subjek sekaligus menghasilkan bahasa Indonesia yang alami.
- source_word: לֵאמֹר
  choice: diperkenalkan langsung oleh kutipan
  rationale: Infinitif לֵאמֹר menandai isi laporan. Dalam bahasa Indonesia modern, fungsi ini lebih alami dinyatakan langsung dengan kutipan daripada dengan ‘dengan berkata’.
- source_word: בַּקֹּשְׁרִים
  choice: termasuk di antara orang-orang yang bersekongkol
  rationale: Bentuk partisip jamak dari קשר menunjuk kepada kelompok pelaku persekongkolan; pilihan ini menyampaikan keanggotaan Ahitofel dalam kelompok tersebut.
- source_word: עִם
  choice: dengan
  rationale: Preposisi ini menyatakan hubungan atau keberpihakan bersama Absalom secara langsung.
- source_word: סַכֶּל
  choice: buatlah ... menjadi kebodohan
  rationale: Imperatif Piel ini memohon agar nasihat Ahitofel dijadikan bodoh atau gagal guna. Terjemahan ini mempertahankan gambaran leksikal ‘kebodohan’ tanpa membatasi maknanya hanya pada kegagalan praktis.
- source_word: נָא
  choice: kiranya
  rationale: Partikel permohonan ini memberi nuansa doa dan desakan yang sopan; ‘kiranya’ sesuai dengan register doa yang dignified dalam bahasa Indonesia.
- source_word: עֲצַת
  choice: nasihat
  rationale: עֵצָה berarti nasihat atau pertimbangan, di sini khususnya nasihat strategis Ahitofel. ‘Nasihat’ alami dan tetap cukup berbobot dalam konteks politik.
- source_word: יְהוָה
  choice: Ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’; partikel ‘Ya’ menandai sapaan langsung dalam doa secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam sapaan langsung
  choice: Ya Yahweh
  alternative: Ya TUHAN
  rationale: Teks sumber memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut, sedangkan ‘Ya’ menandai vokatif dalam bahasa Indonesia.
- issue: Cakupan makna סַכֶּל terhadap nasihat Ahitofel
  choice: buatlah ... menjadi kebodohan
  alternative: gagalkanlah nasihat Ahitofel
  rationale: Ungkapan yang lebih harfiah mempertahankan ketegangan antara membuat nasihat tampak bodoh dan membuatnya tidak efektif; ‘gagalkanlah’ hanya mengungkapkan akibat praktisnya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Formula laporan Ibrani diungkapkan sebagai ‘seseorang memberi tahu’ tanpa menetapkan identitas pelapor. Sapaan doa memakai ‘Ya Yahweh’, dan partikel נָא diterjemahkan ‘kiranya’ untuk menjaga nada permohonan.
