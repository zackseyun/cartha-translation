  to: Lalu Daud diberi tahu, “Ahitofel termasuk di antara orang-orang yang bersekongkol dengan Absalom.” Daud pun berkata, “Ya Yahweh, jadikanlah kiranya nasihat Ahitofel bodoh.”[a]
