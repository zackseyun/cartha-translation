base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/018.yaml
  text: And all his servants were passing by at his side[a], and all the Cherethites, and all the Pelethites, and all the Gittites—six hundred men who had come on foot with him from Gath—were passing on before the king.
translation:
  language: id
  text: Semua hambanya melewati di sisinya. Semua orang Kreti, orang Pleti, dan orang Gat—enam ratus orang yang mengikuti dia dari Gat[a]—melintas di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang datang bersama dia dari Gat.” Secara harfiah, bahasa Ibrani berbunyi “yang datang dengan kakinya dari Gat,” suatu ungkapan yang dapat menunjuk pada orang-orang yang menyertai atau mengikuti seseorang dalam rombongannya, dan mungkin juga pada perjalanan dengan berjalan kaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: semua hambanya
  rationale: עֶבֶד dapat berarti hamba, pelayan, pengikut, atau pejabat kerajaan. “Hambanya” mempertahankan arti dasarnya tanpa mempersempit kelompok itu menjadi pejabat atau tentara.
- source_word: עֹבְרִים עַל יָדוֹ
  choice: berjalan lewat di sisinya
  rationale: Ungkapan עַל יָד menunjukkan posisi di sisi seseorang. Pilihan ini mempertahankan gambaran ruang sekaligus wajar dalam bahasa Indonesia.
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: orang Kreti, orang Pleti
  rationale: Keduanya merupakan sebutan kelompok yang bertugas dalam rombongan Daud; nama kelompok ditransliterasikan dan tidak ditafsirkan sebagai jabatan tertentu.
- source_word: הַגִּתִּים
  choice: orang Gat
  rationale: Istilah ini menunjuk kepada orang-orang yang berasal dari Gat. “Orang Gat” lebih langsung dan alami dalam bahasa Indonesia daripada membentuk etnonim baru.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: enam ratus orang
  rationale: אִישׁ dipakai sebagai kata penghitung bagi laki-laki dewasa. Konteksnya bersifat militer, tetapi “tentara” tidak dinyatakan secara eksplisit.
- source_word: אֲשֶׁר בָּאוּ בְרַגְלוֹ מִגַּת
  choice: yang datang bersamanya dengan berjalan kaki dari Gat
  rationale: Frasa בְרַגְלוֹ secara harfiah berkaitan dengan “kakinya” dan secara idiomatis dapat berarti menyertai atau mengikuti seseorang. Terjemahan ini mempertahankan gambaran berjalan kaki tanpa menutup kemungkinan makna mengiringi.
- source_word: עֹבְרִים עַל פְּנֵי הַמֶּלֶךְ
  choice: berjalan lewat di hadapan raja
  rationale: עַל פְּנֵי berarti “di hadapan” atau “di depan.” Pilihan ini sesuai dengan gambaran rombongan yang bergerak melewati raja.
