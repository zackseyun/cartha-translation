translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Hamba” dipertahankan sebagai istilah umum bagi pengikut raja, sedangkan nama kelompok disajikan menurut bentuk yang lazim dalam bahasa Indonesia. Tanda pisah memperjelas bahwa enam ratus orang itu adalah orang-orang Gat.
