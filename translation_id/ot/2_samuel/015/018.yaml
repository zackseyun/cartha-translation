revisions:
- from: Semua hambanya berjalan lewat di sisinya. Semua orang Kreti, orang Pleti, dan orang Gat—enam ratus orang yang datang bersamanya dengan berjalan kaki dari Gat[a]—berjalan lewat di hadapan raja.
  to: Semua hambanya melewati di sisinya. Semua orang Kreti, orang Pleti, dan orang Gat—enam ratus orang yang mengikuti dia dari Gat[a]—melintas di hadapan raja.
  rationale: Revisi memperjelas bahwa enam ratus orang Gat merupakan para pengikut Daud dari Gat, tanpa memaksakan salah satu sisi dari idiom Ibrani. Catatan kaki mempertahankan pembacaan yang lebih harfiah dan ambiguitas idiomatisnya. Pilihan "melewati" dan "melintas" menghasilkan gaya modern yang lebih alami sambil mempertahankan dua ungkapan ruang dalam teks sumber.
