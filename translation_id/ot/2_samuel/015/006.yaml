base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/006.yaml
  text: Absalom did this to all Israel who came to the king for judgment[a], and Absalom stole the hearts of the men of Israel.
translation:
  language: id
  text: Absalom berbuat demikian kepada semua orang Israel yang datang kepada raja untuk memperoleh keputusan hukum. Demikianlah Absalom mencuri hati para lelaki Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merebut hati para lelaki Israel.” Bahasa Ibrani secara harfiah berbunyi “mencuri hati,” suatu gambaran tentang memperoleh kesetiaan secara tersembunyi atau manipulatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אַבְשָׁלוֹם כַּדָּבָר הַזֶּה
  choice: Absalom berbuat demikian
  rationale: Ungkapan ini menunjuk kembali kepada tindakan Absalom yang berulang kali dilakukan sebagaimana diceritakan dalam ayat sebelumnya. “Berbuat demikian” alami dalam bahasa Indonesia dan tidak menambahkan tafsiran.
- source_word: לְכָל יִשְׂרָאֵל
  choice: kepada semua orang Israel
  rationale: Preposisi לְ menyatakan pihak yang menjadi sasaran tindakan Absalom; “kepada” mempertahankan arah relasional itu.
- source_word: אֲשֶׁר יָבֹאוּ
  choice: yang datang
  rationale: Bentuk imperfek dalam narasi ini menggambarkan tindakan yang lazim atau berulang pada masa lampau; konteks sudah membuat sifat berulangnya jelas.
- source_word: לַמִּשְׁפָּט אֶל הַמֶּלֶךְ
  choice: kepada raja untuk memperoleh keputusan hukum
  rationale: מִשְׁפָּט di sini menunjuk kepada putusan atau penyelesaian perkara secara yudisial. Susunan Indonesia ini menyampaikan tujuan kedatangan serta raja sebagai otoritas yang dituju.
- source_word: וַיְגַנֵּב
  choice: mencuri
  rationale: Kata גנב secara harfiah berarti “mencuri.” Pilihan ini mempertahankan metafora tajam tentang Absalom yang mendapatkan kesetiaan secara tersembunyi atau manipulatif.
- source_word: אֶת לֵב
  choice: hati
  rationale: Bahasa Ibrani memakai bentuk tunggal kolektif “hati.” Bahasa Indonesia dapat mempertahankan bentuk ini secara alami dalam ungkapan “mencuri hati.”
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: para lelaki Israel
  rationale: אַנְשֵׁי secara bentuk berarti “orang-orang lelaki dari.” Terjemahan ini mempertahankan ungkapan maskulin sumber, meskipun dalam konteksnya ungkapan tersebut mungkin mewakili masyarakat Israel secara lebih luas.
theological_decisions:
- issue: Cakupan gender dalam אַנְשֵׁי יִשְׂרָאֵל
  choice: para lelaki Israel
  alternative: orang-orang Israel; bangsa Israel
  rationale: Teks Ibrani memakai nomina maskulin “lelaki.” Terjemahan utama mempertahankan bentuk bergender itu tanpa memastikan apakah pemakaiannya di sini secara representatif mencakup seluruh masyarakat.
- issue: Metafora perolehan kesetiaan dalam וַיְגַנֵּב אֶת לֵב
  choice: mencuri hati
  alternative: merebut hati; mengambil hati
  rationale: Terjemahan harfiah mempertahankan penilaian negatif dan kesan adanya tipu daya atau manipulasi, tanpa mereduksinya menjadi sekadar tindakan mendapatkan dukungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. “Keputusan hukum” memperjelas konteks peradilan tanpa memakai istilah teknis yang sulit. Penanda catatan kaki ditempatkan tepat sesudah metafora yang dijelaskannya.
