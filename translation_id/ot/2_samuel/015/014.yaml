base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/014.yaml
  text: Then David said to all his servants who were with him in Jerusalem[a], “Arise, and let us flee, for there will be no escape for us from Absalom. Hurry to depart[c][b], lest he quickly overtake us and bring disaster upon us and strike the city with the edge of the sword.”
translation:
  language: id
  text: Lalu Daud berkata kepada semua pegawainya yang bersama dia di Yerusalem, “Bangkitlah, mari kita melarikan diri! Sebab, tidak akan ada jalan untuk lolos bagi kita dari Absalom. Bergegaslah pergi, agar ia tidak segera menyusul kita, mendatangkan malapetaka atas kita, dan menyerang kota itu dengan pedang.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan mulut pedang.” Ungkapan Ibrani ini berarti serangan dengan pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  choice: pegawainya
  rationale: Dalam lingkungan istana, kata ini menunjuk para bawahan atau pelayan kerajaan Daud; 'pegawai' alami dalam bahasa Indonesia dan tidak menyiratkan status budak secara berlebihan.
- source_word: קוּמוּ וְנִבְרָחָה
  choice: Bangkitlah, mari kita melarikan diri!
  rationale: Imperatif diikuti kohortatif menyampaikan desakan untuk bertindak serta ajakan yang mencakup Daud sendiri.
- source_word: פְלֵיטָה
  choice: jalan lolos
  rationale: Nomina ini merujuk pada kemungkinan untuk selamat dengan meloloskan diri, bukan secara khusus pada pembebasan ilahi.
- source_word: מַהֲרוּ לָלֶכֶת
  choice: Bergegaslah pergi
  rationale: Ungkapan ini mempertahankan perintah mendesak sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: וְהִשִּׂגָנוּ
  choice: menyusul kita
  rationale: Dalam konteks pengejaran, bentuk kausatif verba ini berarti mencapai atau menyusul pihak yang melarikan diri.
- source_word: וְהִדִּיחַ עָלֵינוּ אֶת־הָרָעָה
  choice: mendatangkan malapetaka atas kita
  rationale: רָעָה di sini berarti bencana atau kemalangan yang menimpa, bukan kejahatan moral.
- source_word: וְהִכָּה הָעִיר לְפִי חָרֶב
  choice: menumpas penduduk kota dengan mata pedang
  rationale: Kota sebagai objek serangan secara metonimis mencakup penduduknya; 'dengan mata pedang' mempertahankan idiom pembantaian dengan pedang tanpa memberi kesan bahwa bangunan kota dipukul secara harfiah.
