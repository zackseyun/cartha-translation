base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/035.yaml
  text: Are not Zadok and Abiathar the priests there with you? And whatever matter you hear from the king’s house, you shall report to Zadok and Abiathar the priests.
translation:
  language: id
  text: Bukankah Zadok dan Abyatar, para imam, ada di sana bersamamu? Segala perkara yang kaudengar dari istana raja harus kausampaikan kepada Zadok dan Abyatar, para imam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Imam Zadok dan Imam Abyatar
  rationale: Nomina jamak tentu ini menerangkan kedua nama. Dalam bahasa Indonesia, pengulangan gelar sebelum setiap nama terdengar alami dan memperjelas bahwa keduanya imam.
- source_word: כָל הַדָּבָר
  choice: segala perkara
  rationale: Mempertahankan unsur דָּבָר sebagai 'perkara', bukan sekadar 'apa pun', sehingga cakupan informasi atau urusan yang didengar tetap tampak.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: dari istana raja
  rationale: Secara harfiah 'dari rumah raja'; dalam konteks pusat kediaman dan pemerintahan kerajaan, 'istana raja' merupakan padanan Indonesia yang alami.
- source_word: תַּגִּיד
  choice: harus kausampaikan
  rationale: Bentuk yiqtol dalam rangkaian instruksi dipahami sebagai kewajiban atau perintah; 'sampaikan' cocok untuk meneruskan informasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pertanyaan retoris dipertahankan. Bentuk pronomina terikat 'bersamamu', 'kaudengar', dan 'kausampaikan' menjaga sapaan tunggal kepada Husai tanpa terasa kaku.
