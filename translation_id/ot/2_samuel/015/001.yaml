  text: וַֽ/יְהִי֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יַּ֤עַשׂ ל/וֹ֙ אַבְשָׁל֔וֹם מֶרְכָּבָ֖ה וְ/סֻסִ֑ים וַ/חֲמִשִּׁ֥ים אִ֖ישׁ רָצִ֥ים לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/001.yaml
  text: After this[a], Absalom made for himself a chariot and horses[b], and fifty men running before him.
translation:
  language: id
  text: Sesudah itu, Absalom menyediakan bagi dirinya sebuah kereta dan kuda-kuda, serta lima puluh orang yang berlari di depannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lima puluh orang yang berlari di depannya merupakan pengiring bergaya kerajaan dan menunjukkan bagaimana Absalom meninggikan dirinya di hadapan umum.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מֵאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Mengungkapkan formula naratif Ibrani secara wajar dalam bahasa Indonesia modern sambil mempertahankan kaitan waktunya.
- source_word: וַיַּעַשׂ לוֹ
  choice: menyediakan bagi dirinya
  rationale: Dalam konteks kereta, kuda, dan para pelari, עשה dengan לו dapat menunjuk pada membuat atau mengadakan bagi diri sendiri. Pilihan ini mempertahankan nuansa refleksif tanpa menyiratkan bahwa Absalom membuat semua itu dengan tangannya sendiri.
- source_word: מֶרְכָּבָה וְסֻסִים
  choice: sebuah kereta dan kuda-kuda
  rationale: Terjemahan langsung yang tidak menambahkan sebutan 'kerajaan'; bentuk jamak 'kuda-kuda' membedakannya dengan jelas dari verba 'berkuda'.
- source_word: וַחֲמִשִּׁים אִישׁ רָצִים לְפָנָיו
  choice: serta lima puluh orang yang berlari di depannya
  rationale: Mempertahankan jumlah, gambaran tindakan partisipial, dan posisi mereka di depan Absalom dalam susunan Indonesia yang alami.
theological_decisions:
- issue: Simbolisme politik rombongan Absalom
  choice: Menggambarkan kereta, kuda-kuda, dan lima puluh pelari tanpa secara eksplisit menyebutnya iring-iringan kerajaan.
  alternative: Absalom membentuk iring-iringan bergaya kerajaan bagi dirinya.
  rationale: Tindakan tersebut menyiratkan ambisi dan pengagungan diri bergaya raja, tetapi teks Ibrani menyajikannya secara deskriptif. Implikasi itu dipertahankan tanpa dimasukkan sebagai tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'menyediakan bagi dirinya' dipilih untuk mencakup kemungkinan makna membuat atau mengadakan, sedangkan struktur ayat tetap ringkas dan deskriptif.
