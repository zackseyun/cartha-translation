  text: תְּמ֣וֹל בּוֹאֶ֗/ךָ וְ/הַ/יּ֞וֹם אנוע/ך עִמָּ֨/נוּ֙ לָ/לֶ֔כֶת וַ/אֲנִ֣י הוֹלֵ֔ךְ עַ֥ל אֲשֶׁר אֲנִ֖י הוֹלֵ֑ךְ שׁ֣וּב וְ/הָשֵׁ֧ב אֶת אַחֶ֛י/ךָ עִמָּ֖/ךְ חֶ֥סֶד וֶ/אֱמֶֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/020.yaml
  text: You came only yesterday[a], and today should I make you wander with us, while I go wherever I can go? Return, and take your brothers back with you[c][b]. May steadfast love and faithfulness be with you.
translation:
  language: id
  text: Engkau baru datang kemarin, dan hari ini haruskah aku membuatmu mengembara bersama kami, sedangkan aku sendiri pergi entah ke mana? Kembalilah dan ajaklah saudara-saudaramu kembali bersamamu.[a] Semoga kasih setia dan kesetiaan menyertaimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudaramu” mungkin menunjuk kepada kerabat, rekan, atau orang-orang Itai yang datang bersamanya.
    reason: cultural_note
  - marker: b
    text: Bahasa Ibrani hanya berbunyi “kasih setia dan kesetiaan,” tanpa verba yang dinyatakan. Dalam konteks ini, frasa tersebut dipahami sebagai ucapan berkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּמוֹל בּוֹאֶךָ
  choice: Engkau baru datang kemarin
  rationale: Ungkapan ini secara harfiah menyatakan bahwa kedatangan Itai terjadi kemarin. Kata “baru” secara alami menonjolkan bahwa ia belum lama tiba, sesuai alasan pertanyaan Daud.
- source_word: אֲנוּעֲךָ עִמָּנוּ לָלֶכֶת
  choice: haruskah aku membuatmu mengembara bersama kami
  rationale: Bentuk kausatif dari נוע dipertahankan dengan “membuatmu mengembara,” yang menyampaikan gerak tanpa kepastian akibat pelarian Daud.
- source_word: וַאֲנִי הוֹלֵךְ עַל אֲשֶׁר אֲנִי הוֹלֵךְ
  choice: sedangkan aku sendiri pergi entah ke mana
  rationale: Bahasa Ibrani bersifat eliptis, secara harfiah kira-kira “aku pergi ke mana aku pergi.” “Entah ke mana” menyampaikan ketidakpastian pelarian Daud tanpa menentukan tujuan atau keharusan yang tidak dinyatakan.
- source_word: שׁוּב וְהָשֵׁב
  choice: Kembalilah dan bawalah ... pulang
  rationale: Imperatif pertama menyuruh Itai kembali; bentuk Hifil kedua bersifat kausatif, yaitu membawa orang-orangnya kembali. “Pulang” alami dalam konteks Indonesia.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Terjemahan mempertahankan istilah kekerabatan harfiah, sambil memberi catatan bahwa dalam konteks istilah ini dapat menunjuk kepada rekan atau orang-orang Itai.
- source_word: חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  rationale: Pasangan istilah ini menyatakan kasih atau kebaikan yang teguh dan sifat dapat dipercaya. Terjemahan ini mempertahankan bobot relasionalnya dan tidak mempersempitnya menjadi rumusan denominasi tertentu.
theological_decisions:
- issue: Fungsi frasa penutup חֶסֶד וֶאֱמֶת yang tidak memiliki verba eksplisit
  choice: Semoga kasih setia dan kesetiaan menyertaimu
  alternative: kasih setia dan kesetiaan
  rationale: Konteks mendukung pemahaman sebagai ucapan berkat atau harapan. “Semoga ... menyertaimu” memasok verba yang tersirat secara wajar, tetapi tidak menentukan secara eksplisit apakah sumber berkat itu Allah atau manusia.
- issue: Ketidakpastian tujuan pelarian Daud
  choice: aku sendiri pergi entah ke mana
  alternative: aku pergi ke mana aku pergi
  rationale: Pilihan utama menyampaikan daya ungkapan Ibrani yang eliptis dan keadaan Daud yang tidak menentu, tanpa mengubahnya menjadi gagasan “ke mana aku harus pergi” atau klaim teologis mengenai penentuan ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau” yang bermartabat. Struktur pertanyaan retoris dan ketidakpastian pelarian Daud dipertahankan. Tanda catatan kaki [a] dan [b] muncul dalam teks utama.
