  revised_text: 'Lihatlah, di sana bersama mereka ada kedua putra mereka: Ahimaas, putra Zadok, dan Yonatan, putra Abyatar. Melalui kedua putra itu, kirimkanlah kepadaku segala hal yang kalian dengar.'
