base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/036.yaml
  text: 'Look[a], their two sons are there with them: Ahimaaz for Zadok, and Jonathan for Abiathar[b]. You shall send to me by their hand every matter that you hear.'
translation:
  language: id
  text: 'Lihatlah, di sana bersama mereka ada kedua putra mereka: Ahimaas, putra Zadok, dan Yonatan, putra Abyatar. Melalui kedua putra itu, kirimkanlah kepadaku segala hal yang kalian dengar.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian secara tegas; “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya deiktiknya.
- source_word: שָׁם עִמָּם
  choice: di sana bersama mereka
  rationale: Gabungan adverbia dan frasa preposisional menunjukkan bahwa kedua anak itu berada di tempat yang sama dengan para imam.
- source_word: שְׁנֵי בְנֵיהֶם
  choice: kedua anak mereka
  rationale: Frasa konstruksi ini menunjuk kepada dua anak milik dua orang yang telah disebutkan, yaitu Zadok dan Abyatar.
- source_word: אֲחִימַעַץ לְצָדוֹק וִיהוֹנָתָן לְאֶבְיָתָר
  choice: Ahimaas, anak Zadok, dan Yonatan, anak Abyatar
  rationale: Lamed menyatakan hubungan kepunyaan atau kekerabatan dalam konteks. Penyebutan “anak” secara eksplisit menghasilkan bahasa Indonesia yang jelas dan wajar tanpa mengubah maksud sumber.
- source_word: וּשְׁלַחְתֶּם
  choice: kirimkanlah
  rationale: Bentuk verba dalam konteks instruksi memiliki daya perintah; akhiran “-lah” menyampaikan arahan dengan wajar dan bermartabat.
- source_word: בְּיָדָם
  choice: melalui kedua anak itu
  rationale: Secara harfiah berarti “dengan/perantaraan tangan mereka,” sebuah idiom Ibrani untuk sarana atau perantara. Terjemahan ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: כָּל דָּבָר
  choice: setiap kabar
  rationale: דָּבָר dapat berarti perkataan, hal, atau perkara. Dalam konteks pengiriman informasi, “setiap kabar” paling alami sambil tetap mencakup segala informasi yang didengar.
- source_word: אֲשֶׁר תִּשְׁמָעוּ
  choice: yang kalian dengar
  rationale: Terjemahan langsung verba שׁמע mempertahankan gambaran menerima informasi melalui pendengaran; bentuk jamak “kalian” sesuai dengan subjek Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama diri disesuaikan dengan bentuk Indonesia yang lazim. Idiom “melalui tangan mereka” dinaturalkan menjadi “melalui kedua anak itu” agar tidak terasa janggal, sedangkan bentuk jamak orang kedua dipertahankan dengan “kalian” karena Daud berbicara kepada Zadok dan Abyatar.
