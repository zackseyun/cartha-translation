base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/032.yaml
  text: When David came to the summit[a], where he worshiped God, behold[b], Hushai the Archite came to meet him with his tunic torn and dirt on his head.
translation:
  language: id
  text: Ketika Daud tiba di puncak[a], tempat ia menyembah Allah, tampaklah[b] Husai, orang Arki, datang menemuinya dengan bajunya terkoyak dan tanah di atas kepalanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk kata kerja Ibrani juga dapat diterjemahkan, “tempat ia biasa menyembah Allah”; bentuk ini dapat menunjuk pada tindakan kebiasaan ataupun tindakan tunggal dalam konteks lampau.
    reason: lexical_alternative
  - marker: b
    text: “Tampaklah” menerjemahkan penanda naratif Ibrani yang menyoroti kemunculan Husai secara mendadak.
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: puncak
  rationale: Secara harfiah berarti 'kepala', tetapi dalam konteks topografis menunjuk pada bagian teratas bukit atau pendakian; 'puncak' alami dan tepat dalam bahasa Indonesia.
- source_word: אֲשֶׁר יִשְׁתַּחֲוֶה שָׁם לֵאלֹהִים
  choice: tempat ia menyembah Allah
  rationale: Bentuk imperfek dapat menyatakan tindakan pada waktu itu maupun kebiasaan. Terjemahan ini mempertahankan ketidakpastian aspek tanpa menambahkan 'biasa' atau 'dahulu', sementara 'menyembah Allah' menyampaikan idiom membungkuk di hadapan Allah secara alami.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel naratif ini menyoroti kemunculan Husai secara mendadak. 'Tampaklah' mempertahankan daya dramatik dalam ragam Indonesia yang bermartabat tanpa memakai seruan yang kaku.
- source_word: לִקְרָאתוֹ
  choice: datang menemuinya
  rationale: Ungkapan ini menunjukkan gerak menuju seseorang untuk berjumpa; verba 'datang' dipasok secara wajar dari konteks.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, orang Arki
  rationale: 'Nama pribadi ditransliterasikan menurut bentuk Indonesia, sedangkan nisba הָאַרְכִּי dinyatakan secara alami sebagai asal atau kelompok: ''orang Arki''.'
- source_word: קָרוּעַ כֻּתָּנְתּוֹ
  choice: dengan jubahnya terkoyak
  rationale: כֻּתֹּנֶת adalah pakaian tubuh seperti tunik atau jubah. 'Jubah' lebih mudah dipahami pembaca umum, dan 'terkoyak' menyatakan keadaan hasil yang menjadi tanda perkabungan.
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: dan tanah di atas kepalanya
  rationale: אֲדָמָה berarti tanah atau bumi, bukan khusus debu. Terjemahan harfiah-alami ini mempertahankan gambaran tindakan berkabung.
theological_decisions:
- issue: 'Aspek יִשְׁתַּחֲוֶה: tindakan sederhana atau kebiasaan'
  choice: tempat ia menyembah Allah
  alternative: tempat ia biasa menyembah Allah
  rationale: Bentuk Ibrani memungkinkan nuansa kebiasaan, tetapi tidak mengharuskannya. Teks utama tidak menentukan salah satu, dan catatan kaki menyatakan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum sambil mempertahankan penanda dramatik, gambaran perkabungan, dan ambiguitas aspek verba Ibrani.
