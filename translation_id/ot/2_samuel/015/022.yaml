base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/022.yaml
  text: Then David said to Ittai, “Go on and cross over.” So Ittai the Gittite crossed over, along with all his men and all the little ones who were with him.
translation:
  language: id
  text: Lalu Daud berkata kepada Itai, “Pergilah dan menyeberanglah.” Maka Itai, orang Gat itu, menyeberang bersama semua anak buahnya dan semua anak kecil yang menyertainya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ וַעֲבֹר
  choice: Pergilah dan menyeberanglah
  rationale: Mempertahankan dua perintah Ibrani secara alami dalam bahasa Indonesia; konteks menunjukkan perintah untuk terus maju dan menyeberangi tempat yang sedang dilalui rombongan.
- source_word: אִתַּי הַגִּתִּי
  choice: Itai, orang Gat itu
  rationale: Demonim הַגִּתִּי dinyatakan dengan bentuk Indonesia yang jelas dan lazim, yaitu orang yang berasal dari Gat.
- source_word: כָל אֲנָשָׁיו
  choice: semua anak buahnya
  rationale: Dalam konteks pemimpin pasukan, אֲנָשָׁיו menunjuk kepada orang-orang di bawah pimpinan Itai; 'anak buahnya' lebih wajar daripada 'orang-orangnya' tanpa mempersempitnya secara pasti menjadi tentara.
- source_word: כָל הַטַּף
  choice: semua anak kecil
  rationale: הַטַּף biasanya menunjuk anak-anak kecil atau kaum kecil dalam rombongan; pilihan ini mempertahankan pembedaan dari para lelaki Itai.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Menyampaikan arti 'yang bersama dia' secara idiomatis dan menghindari pengulangan kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dan pengulangan verba 'menyeberang' dipertahankan agar sesuai dengan narasi Ibrani.
