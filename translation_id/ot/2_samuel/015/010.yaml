base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/010.yaml
  text: Then Absalom sent spies throughout all the tribes of Israel, saying, “As soon as you hear the sound of the trumpet, then say, ‘Absalom has become king in Hebron.’”
translation:
  language: id
  text: Kemudian Absalom mengirim mata-mata ke semua suku Israel dengan pesan, “Begitu kalian mendengar bunyi sangkakala, katakanlah, ‘Absalom telah menjadi raja di Hebron!’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְרַגְּלִים
  choice: para penyusup
  rationale: Dalam konteks rencana rahasia Absalom, istilah ini menunjuk orang-orang yang dikirim secara tersembunyi untuk menyebarkan pesan terkoordinasi. 'Para penyusup' lebih alami daripada 'mata-mata' karena tugas yang disebutkan bukan mengumpulkan informasi.
- source_word: כְּשָׁמְעֲכֶם
  choice: begitu kalian mendengar
  rationale: Menyampaikan konstruksi temporal yang berarti saat atau segera setelah mereka mendengar bunyi sangkakala.
- source_word: קוֹל הַשֹּׁפָר
  choice: bunyi sangkakala
  rationale: שׁוֹפָר adalah alat tiup tanduk untuk memberi isyarat; 'sangkakala' merupakan padanan Alkitabiah Indonesia yang dikenal dan sesuai dengan konteks proklamasi kerajaan.
- source_word: מָלַךְ
  choice: telah menjadi raja
  rationale: Bentuk perfek dapat menyatakan bahwa Absalom telah naik atau dinyatakan sebagai raja, bukan sekadar sedang memerintah; pilihan ini mempertahankan nuansa proklamasi kudeta.
theological_decisions:
- issue: Status klaim kerajaan Absalom
  choice: ‘Absalom telah menjadi raja di Hebron!’
  alternative: ‘Absalom memerintah di Hebron!’
  rationale: Teks melaporkan semboyan yang diperintahkan Absalom, bukan mengesahkan keabsahan teologis pemerintahannya. 'Telah menjadi raja' menyampaikan klaim naik takhta tanpa menambahkan legitimasi ilahi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak informal-netral 'kalian' memperjelas bahwa perintah ditujukan kepada banyak utusan. 'Berserulah' dipakai agar tindakan mengumumkan semboyan secara terbuka tersampaikan secara alami.
