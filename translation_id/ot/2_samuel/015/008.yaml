  text: כִּי נֵ֨דֶר֙ נָדַ֣ר עַבְדְּ/ךָ֔ בְּ/שִׁבְתִּ֥/י בִ/גְשׁ֛וּר בַּ/אֲרָ֖ם לֵ/אמֹ֑ר אִם ישיב יְשִׁיבֵ֤/נִי יְהוָה֙ יְר֣וּשָׁלִַ֔ם וְ/עָבַדְתִּ֖י אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/008.yaml
  text: For your servant made a vow while I was dwelling in Geshur in Aram[a], saying, ‘If Yahweh indeed brings me back to Jerusalem[c][b], then I will serve Yahweh.’
translation:
  language: id
  text: 'Sebab hambamu ini telah bernazar ketika aku tinggal di Gesur, di Aram, demikian: “Jika Yahweh benar-benar membawa aku kembali[a] ke Yerusalem, aku akan beribadah kepada Yahweh.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menegaskan tindakan ini dengan memakai dua bentuk dari akar kata kerja yang sama; dapat juga diterjemahkan, “Jika Yahweh sungguh-sungguh membawa aku kembali.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku akan melayani Yahweh.” Kata Ibrani dapat menunjuk kepada pelayanan kepada Allah, termasuk dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר נָדַר
  choice: telah bernazar
  rationale: Konstruksi serumpun harfiah berarti ‘menazarkan nazar’ dan memberi penegasan. Dalam bahasa Indonesia modern, ‘telah bernazar’ menyampaikan maknanya secara wajar; unsur kesungguhan juga tampak dari isi nazar.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Dalam sapaan kepada raja, ungkapan ini merupakan sebutan diri yang merendah dan hormat. ‘Hambamu ini’ mempertahankan ragam istana tanpa menonjolkan pengertian perbudakan.
- source_word: בְּשִׁבְתִּי
  choice: ketika aku tinggal
  rationale: Infinitif dengan preposisi menandai waktu dan keadaan yang berlangsung. ‘Ketika aku tinggal’ alami dalam bahasa Indonesia dan tetap dekat dengan teks.
- source_word: בִגְשׁוּר בַּאֲרָם
  choice: di Gesur, di Aram
  rationale: Terjemahan ini mempertahankan kedua penanda lokasi dan tidak menentukan hubungan geografis atau politisnya lebih jauh daripada bunyi Ibrani.
- source_word: אִם ישיב יְשִׁיבֵנִי
  choice: Jika Yahweh benar-benar membawa aku kembali
  rationale: Infinitif absolut yang diikuti bentuk verba dari akar שוב menegaskan tindakan kembali. ‘Benar-benar’ menyampaikan penegasan itu, sedangkan ‘membawa aku kembali’ mempertahankan arah kausatif menuju Yerusalem.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai ‘Yahweh’ untuk mempertahankan nama diri yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וְעָבַדְתִּי אֶת יְהוָה
  choice: aku akan beribadah kepada Yahweh
  rationale: Dalam hubungan dengan Allah, עבד dapat berarti melayani-Nya melalui ibadah. Dalam konteks nazar untuk kembali ke Yerusalem, ‘beribadah kepada’ merupakan ungkapan Indonesia yang alami, sementara kemungkinan arti lebih luas dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi. ‘Yahweh’ mempertahankan ciri tersebut tanpa menggantinya dengan gelar.
- issue: Makna עבד ketika objeknya Yahweh
  choice: beribadah kepada Yahweh
  alternative: melayani Yahweh
  rationale: Konteks nazar dan kepulangan ke Yerusalem mendukung nuansa ibadah, tetapi verba Ibrani juga dapat mencakup pelayanan yang lebih luas; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Hambamu ini’ mempertahankan kesantunan istana. Susunan kutipan dibuat alami, dan penegasan Ibrani dinyatakan dengan ‘benar-benar’. Semua penanda catatan kaki muncul dalam teks utama.
