  text: The king went out[a], and all the people with him on foot, and they halted at the distant house.
translation:
  language: id
  text: Raja keluar, dan seluruh rakyat mengikutinya; lalu mereka berhenti di rumah yang jauh itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin nama tempat, “Bet-Merhak”. Frasa Ibrani ini dapat dipahami sebagai “rumah yang jauh/terpencil”; banyak penafsir memahaminya secara deskriptif sebagai “rumah terakhir”, yaitu rumah terluar di pinggir kota.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk naratif dari יצא menyatakan tindakan keluar atau berangkat; “keluar” merupakan padanan langsung dan wajar dalam konteks kepergian Daud.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina tentu ini merujuk kepada Daud dalam konteks; bahasa Indonesia secara alami dapat memakai gelar tersebut tanpa artikel.
- source_word: וְכָל הָעָם
  choice: bersama seluruh rakyat
  rationale: עָם menunjuk kepada rombongan yang menyertai raja. “Rakyat” mempertahankan cakupan yang luas dan tidak membatasinya hanya kepada pasukan.
- source_word: בְּרַגְלָיו
  choice: yang berjalan kaki mengikutinya
  rationale: Secara harfiah berarti “pada/di kakinya”, tetapi dalam konteks ini menyatakan rombongan yang mengikuti raja, kemungkinan dengan berjalan kaki. Terjemahan ini menyampaikan unsur pengiringan dan cara bergerak secara alami.
- source_word: וַיַּעַמְדוּ
  choice: lalu mereka berhenti
  rationale: עמד secara dasar berarti “berdiri”, tetapi dalam kisah perjalanan dapat berarti berhenti atau mengambil tempat. “Berhenti” paling sesuai dengan alur gerak dalam ayat ini.
- source_word: בֵּית הַמֶּרְחָק
  choice: rumah yang jauh itu
  rationale: Terjemahan ini dekat dengan arti unsur-unsur Ibraninya, “rumah kejauhan/keterpencilan”, dan menghindari penetapan pasti bahwa yang dimaksud ialah rumah terakhir atau sebuah nama tempat.
