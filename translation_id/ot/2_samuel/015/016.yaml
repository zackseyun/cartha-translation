base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/016.yaml
  text: So the king went out[a], and all his household after him on foot; and the king left ten women, concubines, to keep the house.
translation:
  language: id
  text: Lalu raja keluar, dan seluruh anggota rumah tangganya mengikutinya dengan berjalan kaki.[a] Raja meninggalkan sepuluh perempuan, yaitu para gundiknya, untuk menjaga rumah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan seluruh rumah tangganya pada kakinya.” Ungkapan Ibrani ini menunjukkan bahwa mereka mengikutinya dengan berjalan kaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: pergi keluar
  rationale: Bentuk naratif dari יצא menyatakan gerak keluar atau keberangkatan. 'Pergi keluar' mempertahankan gambaran gerak konkret dalam bahasa Indonesia yang wajar.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan baku bagi מלך. Walaupun yang dimaksud ialah Daud, teks Ibrani memakai gelarnya.
- source_word: וְכָל בֵּיתוֹ
  choice: dan seluruh isi rumahnya
  rationale: בַּיִת dengan sufiks di sini menunjuk kepada orang-orang dalam rumah tangga raja, bukan bangunannya. 'Isi rumah' alami dan membedakannya dari הַבָּיִת pada akhir ayat.
- source_word: בְּרַגְלָיו
  choice: mengikutinya dengan berjalan kaki
  rationale: Secara harfiah berarti 'pada/di kakinya', tetapi dalam konteks ini merupakan ungkapan yang menggambarkan mereka mengikuti raja dengan berjalan kaki. Terjemahan ini menyampaikan kedua unsur makna secara jelas.
- source_word: וַיַּעֲזֹב
  choice: meninggalkan
  rationale: עזב di sini berarti membiarkan atau meninggalkan orang di belakang. 'Menelantarkan' akan memberi nuansa negatif yang terlalu kuat.
- source_word: עֶשֶׂר נָשִׁים פִּלַגְשִׁים
  choice: sepuluh perempuan, yaitu para gundiknya
  rationale: Susunan aposisi Ibrani memuat baik 'perempuan' maupun 'gundik'. 'Yaitu' menjadikan hubungan aposisional itu jelas dan alami dalam bahasa Indonesia.
- source_word: לִשְׁמֹר
  choice: untuk menjaga
  rationale: שׁמר dapat berarti menjaga, mengawasi, atau memelihara. 'Menjaga' paling langsung dan tetap mencakup perlindungan serta pemeliharaan tempat itu.
- source_word: הַבָּיִת
  choice: istana
  rationale: Dalam konteks kerajaan, bangunan yang ditinggalkan adalah kediaman raja. 'Istana' menghindari kerancuan dengan 'isi rumahnya' dan menyampaikan rujukan kontekstual secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur aposisi dipertahankan secara alami; istilah 'gundik' dipakai sebagai padanan historis yang ringkas bagi פִּילֶגֶשׁ. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
