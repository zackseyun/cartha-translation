source:
  edition: WLC
  text: וְ/הִשְׁכִּים֙ אַבְשָׁל֔וֹם וְ/עָמַ֕ד עַל יַ֖ד דֶּ֣רֶךְ הַ/שָּׁ֑עַר וַ/יְהִ֡י כָּל הָ/אִ֣ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִיב֩ לָ/ב֨וֹא אֶל הַ/מֶּ֜לֶךְ לַ/מִּשְׁפָּ֗ט וַ/יִּקְרָ֨א אַבְשָׁל֤וֹם אֵלָי/ו֙ וַ/יֹּ֗אמֶר אֵֽי מִ/זֶּ֥ה עִיר֙ אַ֔תָּה וַ/יֹּ֕אמֶר מֵ/אַחַ֥ד שִׁבְטֵֽי יִשְׂרָאֵ֖ל עַבְדֶּֽ/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/002.yaml
  text: Absalom would rise early and stand beside the road to the gate. Whenever any man had a dispute and came to the king for judgment[a], Absalom would call to him and say, “From what city are you?” And he would say, “Your servant is from one of the tribes of Israel.”
translation:
  language: id
  text: Absalom biasa bangun pagi-pagi dan berdiri di tepi jalan menuju gerbang. Setiap kali seseorang mempunyai sengketa dan datang kepada raja untuk meminta putusan[a], Absalom memanggilnya dan bertanya, “Kamu berasal dari kota mana?” Orang itu menjawab, “Hambamu ini berasal dari salah satu suku Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempunyai perkara hukum” untuk “mempunyai sengketa”; kata Ibrani רִיב dapat berarti sengketa, pengaduan, atau perkara hukum dalam konteks peradilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁכִּים
  choice: biasa bangun pagi-pagi
  rationale: Bentuk ini menyatakan bangun dini hari; konteks berulang dalam ayat mendukung ungkapan kebiasaan, bukan satu kejadian saja.
- source_word: וְעָמַד
  choice: berdiri
  rationale: Makna dasarnya ialah berdiri; bersama ungkapan kebiasaan sebelumnya, kata ini menggambarkan tindakan Absalom yang dilakukan berulang kali.
- source_word: עַל יַד
  choice: di tepi
  rationale: Idiom Ibrani ini berarti di sisi atau di dekat; 'di tepi' alami untuk posisi seseorang terhadap jalan.
- source_word: דֶּרֶךְ הַשָּׁעַר
  choice: jalan menuju gerbang
  rationale: Frasa konstruksi ini menunjuk pada jalan atau jalur pendekatan ke gerbang.
- source_word: וַיְהִי כָּל הָאִישׁ אֲשֶׁר יִהְיֶה לּוֹ רִיב
  choice: Setiap kali seseorang mempunyai sengketa
  rationale: Susunan ini memperkenalkan keadaan yang berulang. רִיב dapat berarti sengketa, pengaduan, atau perkara hukum; 'sengketa' mempertahankan keluasan maknanya dalam konteks peradilan.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ לַמִּשְׁפָּט
  choice: datang kepada raja untuk meminta putusan
  rationale: מִשְׁפָּט di sini menunjuk pada keputusan atau penghakiman yudisial; 'meminta putusan' jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּקְרָא ... אֵלָיו
  choice: Absalom memanggilnya
  rationale: Kata kerja ini berarti memanggil atau berseru kepada seseorang, tanpa harus menyiratkan pemanggilan resmi.
- source_word: אֵי מִזֶּה עִיר אַתָּה
  choice: Kamu berasal dari kota mana?
  rationale: Pertanyaan ini menanyakan kota asal; susunan tersebut langsung dan alami dalam bahasa Indonesia modern.
- source_word: מֵאַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: berasal dari salah satu suku Israel
  rationale: Jawaban itu menyebut asal kesukuan, bukan memberikan nama kota; 'berasal dari' membuat hubungan tersebut jelas tanpa mengatasi ketidakselarasan pertanyaan dan jawaban.
- source_word: עַבְדֶּךָ
  choice: Hambamu ini
  rationale: Dalam konteks ini kata tersebut merupakan sebutan diri yang merendah ketika berbicara kepada putra raja, bukan penegasan status perbudakan.
