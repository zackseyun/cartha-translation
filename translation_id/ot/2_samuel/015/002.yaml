translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk 'biasa' dan 'setiap kali' menampilkan tindakan berulang. Sapaan 'kamu' sesuai dengan cara Absalom menyapa orang biasa, sedangkan 'Hambamu ini' mempertahankan jawaban hormat orang tersebut.
