base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/023.yaml
  text: And all the land was weeping with a loud voice[a], and all the people were crossing over. The king also crossed over the Kidron Valley[b], and all the people were crossing over on the road toward the wilderness.
translation:
  language: id
  text: Seluruh negeri menangis dengan suara nyaring, dan seluruh rakyat menyeberang. Raja pun menyeberangi Lembah Kidron[a], dan seluruh rakyat menyeberang melalui jalan menuju padang gurun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Lembah Kidron: secara tradisional, “Sungai Kidron.” Kata Ibrani נַחַל dapat berarti wadi, jurang, lembah, atau aliran air musiman.'
    reason: cultural_note
  - marker: b
    text: Atau, “menyeberang melalui jalan ke padang gurun.” Susunan ungkapan Ibrani ini padat.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָאָרֶץ
  choice: seluruh negeri
  rationale: Frasa ini secara harfiah berarti “seluruh negeri/tanah” dan di sini secara kolektif menggambarkan penduduk serta wilayah yang diliputi perkabungan. Ungkapan Ibrani dan personifikasinya dipertahankan.
- source_word: בּוֹכִים קוֹל גָּדוֹל
  choice: menangis dengan suara nyaring
  rationale: קוֹל גָּדוֹל secara harfiah berarti “suara besar/nyaring” dan menggambarkan ratapan yang terdengar keras. Bentuk jamak partisip sesuai dengan subjek kolektif, tetapi dalam bahasa Indonesia bentuk verba tidak perlu dibedakan menurut jumlah.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עָם berarti “rakyat” atau “orang-orang.” Dalam konteks ini cakupannya adalah rombongan yang mengikuti Daud secara luas, bukan hanya pasukan.
- source_word: עֹבְרִים / עֹבֵר
  choice: menyeberang / menyeberangi
  rationale: Akar עבר di sini menunjukkan gerakan menyeberangi batas geografis atau lembah. Pengulangan verba Ibrani dipertahankan, sedangkan “terus” pada penyebutan terakhir menyampaikan tindakan partisip yang sedang berlangsung.
- source_word: בְּנַחַל קִדְרוֹן
  choice: menyeberangi Lembah Kidron
  rationale: נַחַל dapat menunjuk pada wadi, jurang, lembah, atau aliran musiman. “Lembah Kidron” jelas dan wajar dalam bahasa Indonesia modern tanpa memastikan bahwa air sedang mengalir.
- source_word: עַל פְּנֵי דֶרֶךְ אֶת הַמִּדְבָּר
  choice: melalui jalan menuju padang gurun
  rationale: Susunan Ibraninya padat dan dapat menggambarkan pergerakan di sepanjang atau ke arah jalan yang menuju padang gurun. Terjemahan ini menyampaikan arah gerakan tanpa menghilangkan unsur “jalan”.
