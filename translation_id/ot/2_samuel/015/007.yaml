  text: וַ/יְהִ֕י מִ/קֵּ֖ץ אַרְבָּעִ֣ים שָׁנָ֑ה וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ אֶל הַ/מֶּ֔לֶךְ אֵ֣לֲכָה נָּ֗א וַ/אֲשַׁלֵּ֛ם אֶת נִדְרִ֛/י אֲשֶׁר נָדַ֥רְתִּי לַֽ/יהוָ֖ה בְּ/חֶבְרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/007.yaml
  text: And at the end of forty years, Absalom said to the king, “Please let me go and pay the vow that I vowed to the LORD in Hebron.”
translation:
  language: id
  text: Setelah berlalu empat puluh tahun, Absalom berkata kepada raja, “Izinkanlah aku pergi ke Hebron dan menunaikan nazar yang telah kuucapkan kepada TUHAN.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֵּץ אַרְבָּעִים שָׁנָה
  choice: Setelah berlalu empat puluh tahun
  rationale: Menyampaikan ungkapan waktu Ibrani secara alami tanpa mengubah angka yang terdapat dalam WLC.
- source_word: אֵלֲכָה נָּא
  choice: Izinkanlah aku pergi
  rationale: Partikel נָא menyatakan permohonan sopan; dalam konteks berbicara kepada raja, bentuk izin paling alami dalam bahasa Indonesia.
- source_word: וַאֲשַׁלֵּם אֶת־נִדְרִי
  choice: dan menunaikan nazar
  rationale: Kata שׁלם dalam konstruksi ini berarti memenuhi atau melaksanakan kewajiban nazar, bukan membayar uang secara harfiah.
- source_word: לַיהוָה
  choice: kepada TUHAN
  rationale: Memakai bentuk baku tradisional bahasa Indonesia untuk nama ilahi YHWH.
- source_word: בְּחֶבְרוֹן
  choice: ke Hebron
  rationale: Dalam konteks permohonan untuk pergi, Hebron dipahami sebagai tempat tujuan untuk menunaikan nazar; susunan Indonesia dibuat jelas dan alami.
theological_decisions:
- issue: Angka empat puluh tahun yang sulit secara kronologis
  choice: Mempertahankan “empat puluh tahun” sesuai teks WLC
  alternative: “empat tahun” berdasarkan pembacaan varian dalam sejumlah saksi kuno
  rationale: Terjemahan utama mengikuti teks sumber yang ditetapkan pengguna dan tidak memperbaiki kesulitan kronologis secara diam-diam.
- issue: Makna pemenuhan nazar
  choice: “menunaikan nazar”
  alternative: “membayar nazar”
  rationale: “Menunaikan” menyatakan pemenuhan kewajiban religius secara tepat dan tidak menyiratkan pembayaran uang.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Sapaan permohonan dibuat sopan sesuai konteks istana, sementara istilah “nazar” dipertahankan karena lazim dan tepat dalam register keagamaan Indonesia.
