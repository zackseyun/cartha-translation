translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan ‘Sekiranya’ mempertahankan nada keinginan retoris Absalom; istilah hukum dibuat jelas tanpa menjadi terlalu teknis.
