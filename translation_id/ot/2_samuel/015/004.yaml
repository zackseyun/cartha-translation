  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְשָׁל֔וֹם מִי יְשִׂמֵ֥/נִי שֹׁפֵ֖ט בָּ/אָ֑רֶץ וְ/עָלַ֗/י יָב֥וֹא כָּל אִ֛ישׁ אֲשֶֽׁר יִהְיֶה לּ/וֹ רִ֥יב וּ/מִשְׁפָּ֖ט וְ/הִצְדַּקְתִּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/004.yaml
  text: Then Absalom would say[a], “If only I were appointed judge in the land! Then every man who has a dispute or a case could come to me[c][b], and I would give him justice.”
translation:
  language: id
  text: Lalu Absalom biasa berkata[a], “Sekiranya aku diangkat menjadi hakim di negeri ini! Setiap orang[b] yang mempunyai sengketa atau perkara hukum dapat datang kepadaku, dan aku akan memberinya keadilan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Lalu Absalom berkata.” Konteks menunjukkan bahwa ia biasa mengucapkan hal ini berulang kali.
    reason: aspectual_alternative
  - marker: b
    text: Ungkapan Ibrani secara gramatikal berbentuk maskulin tunggal, tetapi di sini digunakan secara umum untuk siapa pun yang mempunyai perkara hukum.
    reason: lexical_alternative
  - marker: c
    text: Atau “aku akan menyatakan dia benar” atau “aku akan memenangkan perkaranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Absalom biasa berkata
  rationale: Bentuk naratif ini, dalam konteks tindakan Absalom yang berulang, paling wajar dipahami sebagai perkataan yang biasa ia ucapkan, bukan hanya satu kali.
- source_word: מִי יְשִׂמֵנִי
  choice: Sekiranya aku diangkat
  rationale: Secara harfiah berbentuk pertanyaan ‘Siapa yang akan mengangkat aku?’, tetapi dalam konteks ini berfungsi sebagai ungkapan keinginan. Bentuk pasif tidak menambahkan pelaku yang tidak disebutkan.
- source_word: שֹׁפֵט
  choice: hakim
  rationale: Kata ini menunjuk kepada orang yang mengadili perkara, sesuai dengan konteks sengketa dan proses hukum.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: ‘Negeri’ menyampaikan cakupan wilayah pemerintahan dengan alami dalam bahasa Indonesia; ‘ini’ merujuk pada negeri tempat Absalom sedang berbicara.
- source_word: כָּל אִישׁ
  choice: setiap orang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, ungkapan ini bersifat generik dan mencakup siapa pun yang membawa perkara.
- source_word: רִיב וּמִשְׁפָּט
  choice: sengketa atau perkara hukum
  rationale: Pasangan kata ini menggambarkan perselisihan atau perkara yang memerlukan keputusan hukum tanpa menjadikannya dua kategori yang terlalu teknis.
- source_word: וְהִצְדַּקְתִּיו
  choice: aku akan memberinya keadilan
  rationale: Dalam konteks pengadilan, bentuk kausatif dari צדק dapat berarti membenarkan, menyatakan benar, atau memenangkan pihak tersebut. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pemberian putusan yang adil, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
