  text: וְ/אִם֙ כֹּ֣ה יֹאמַ֔ר לֹ֥א חָפַ֖צְתִּי בָּ֑/ךְ הִנְ/נִ֕י יַֽעֲשֶׂה לִּ֕/י כַּ/אֲשֶׁ֥ר ט֖וֹב בְּ/עֵינָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/026.yaml
  text: But if he says[a], ‘I take no pleasure in you,’ here I am[b]; let him do to me as seems good in his eyes.
translation:
  language: id
  text: Namun, jika Ia berkata, “Aku tidak berkenan kepadamu,” inilah aku; biarlah Ia memperlakukan aku menurut apa yang baik di mata-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut apa yang baik di mata-Nya,” suatu ungkapan yang berarti “menurut apa yang dipandang-Nya baik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Konjungsi ini memperkenalkan kemungkinan yang berlawanan dengan ayat sebelumnya, sambil tetap mempertahankan sifat bersyaratnya.
- source_word: כֹּה יֹאמַר
  choice: Ia berkata
  rationale: כֹּה berfungsi secara idiomatis untuk memperkenalkan ucapan langsung dan tidak memerlukan padanan tersendiri dalam bahasa Indonesia.
- source_word: לֹא חָפַצְתִּי בָּךְ
  choice: Aku tidak berkenan kepadamu
  rationale: Ungkapan ini menyampaikan makna tidak merasa senang atau tidak menaruh kesukaan kepada seseorang; 'tidak berkenan' alami dalam konteks hubungan Allah dengan Daud tanpa mengubahnya menjadi sekadar keinginan.
- source_word: הִנְנִי
  choice: lihatlah, aku siap
  rationale: Formula penyataan diri ini bukan hanya menunjukkan keberadaan, melainkan kesiapan dan penyerahan diri. Bentuk ini mempertahankan unsur penarik perhatian sekaligus membuat maksudnya jelas dalam bahasa Indonesia.
- source_word: יַעֲשֶׂה לִּי
  choice: Biarlah Ia memperlakukan aku
  rationale: Bentuk ini mengungkapkan penyerahan diri yang rela terhadap tindakan Allah; 'memperlakukan aku' lebih alami daripada terjemahan harfiah 'melakukan kepadaku'.
- source_word: כַּאֲשֶׁר טוֹב בְּעֵינָיו
  choice: menurut apa yang baik di mata-Nya
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani 'baik di matanya'; catatan kaki menjelaskan makna idiomatisnya.
theological_decisions:
- issue: Acuan pronomina orang ketiga tunggal
  choice: Pronomina 'Ia' dan '-Nya' dipertahankan dengan acuan kepada TUHAN berdasarkan konteks
  alternative: Mengganti pronomina secara eksplisit dengan 'TUHAN'
  rationale: Teks Ibrani memakai bentuk orang ketiga tanpa mengulang nama ilahi. Pronomina mempertahankan bentuk sumber, sedangkan konteks ayat sebelumnya menjelaskan acuannya.
- issue: Nuansa penyerahan diri dalam הִנְנִי dan יַעֲשֶׂה לִּי
  choice: 'Diterjemahkan sebagai kesiapan dan izin yang berserah: ''lihatlah, aku siap. Biarlah Ia memperlakukan aku'''
  alternative: 'Terjemahan lebih harfiah: ''Lihatlah aku; kiranya Ia melakukan kepadaku'''
  rationale: Pilihan utama menyampaikan sikap Daud tanpa menambahkan kepastian, persetujuan moral, atau ajaran teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai agar acuan dalam kutipan langsung jelas menurut kebiasaan ejaan Alkitab bahasa Indonesia, tanpa mengganti pronomina sumber dengan nama ilahi.
