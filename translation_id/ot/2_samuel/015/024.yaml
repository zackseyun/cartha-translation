  to: Dan lihatlah, Zadok juga ada di sana bersama semua orang Lewi yang bersamanya, yang mengusung tabut perjanjian Allah. Mereka meletakkan tabut Allah[b], lalu Abyatar naik[c] sampai semua orang selesai menyeberang dari kota itu.[a]
