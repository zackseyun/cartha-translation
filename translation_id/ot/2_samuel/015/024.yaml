  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה גַם צָד֜וֹק וְ/כָֽל הַ/לְוִיִּ֣ם אִתּ֗/וֹ נֹֽשְׂאִים֙ אֶת אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים וַ/יַּצִּ֨קוּ֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים וַ/יַּ֖עַל אֶבְיָתָ֑ר עַד תֹּ֥ם כָּל הָ/עָ֖ם לַ/עֲב֥וֹר מִן הָ/עִֽיר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/015/024.yaml
  text: And look[a], Zadok also came, and all the Levites with him, carrying the ark of the covenant of God. And they set down the ark of God[c][b], and Abiathar went up until all the people had finished crossing over from the city.
translation:
  language: id
  text: Dan lihatlah, Zadok juga ada di sana bersama semua orang Lewi yang bersamanya, yang mengusung tabut perjanjian Allah. Mereka meletakkan tabut Allah[b], lalu Abyatar naik[c] sampai semua orang selesai menyeberang dari kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah Yerusalem.
    reason: cross_reference
  - marker: b
    text: Atau “menurunkan tabut Allah” atau “menempatkan tabut Allah di sana”. Verba Ibrani ini dapat menunjuk pada tindakan meletakkan, menurunkan, atau menempatkannya.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani secara harfiah menyatakan “naik”. Arah dan nuansa tepat gerakan ini dalam alur cerita tidak pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Penanda wacana ini mengarahkan perhatian kepada kemunculan adegan baru. “Tampaklah” mempertahankan daya penunjuknya dalam bahasa Indonesia yang bermartabat tanpa memakai ungkapan yang terlalu kuno.
- source_word: גַם צָדוֹק וְכָל הַלְוִיִּם אִתּוֹ
  choice: Zadok juga ada di sana bersama semua orang Lewi yang menyertai dia
  rationale: גַם diterjemahkan secara aditif dengan “juga”; אִתּוֹ paling wajar mengacu kepada Zadok. Kata “ada di sana” melengkapi klausa nominal Ibrani secara alami tanpa menambahkan tindakan yang tidak dinyatakan secara eksplisit.
- source_word: נֹשְׂאִים
  choice: mereka mengusung
  rationale: Partisip ini menggambarkan tindakan orang-orang Lewi. “Mengusung” sesuai untuk membawa benda suci secara bersama-sama dan tetap mudah dipahami.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: tabut perjanjian Allah
  rationale: Mempertahankan seluruh rangkaian konstruksi Ibrani serta istilah baku “tabut” dan “perjanjian”.
- source_word: וַיַּצִּקוּ אֶת אֲרוֹן הָאֱלֹהִים
  choice: Mereka menurunkan tabut Allah
  rationale: Dalam konteks, verba langka ini menunjuk pada tindakan meletakkan atau menempatkan tabut. “Menurunkan” secara alami menggambarkan tabut yang dibawa lalu diletakkan, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: וַיַּעַל אֶבְיָתָר
  choice: lalu Abyatar naik
  rationale: Mempertahankan arti dasar עלה, yaitu bergerak naik, tanpa mengubahnya menjadi kegiatan keimaman yang tidak dinyatakan oleh teks.
- source_word: עַד תֹּם כָּל הָעָם לַעֲבוֹר
  choice: sampai seluruh rakyat selesai menyeberang
  rationale: Mengubah ungkapan temporal Ibrani menjadi klausa Indonesia yang alami sambil mempertahankan batas akhir tindakan dan gagasan perpindahan melintasi suatu tempat.
- source_word: מִן הָעִיר
  choice: dari kota itu
  rationale: Artikel definit Ibrani diterjemahkan secara kontekstual dengan “itu”. Identitas kota tidak dimasukkan ke dalam teks utama, tetapi dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas “kota itu”
  choice: Teks utama tetap memakai “kota itu”.
  alternative: “dari Yerusalem”
  rationale: Bahasa Ibrani hanya menyebut “kota itu”. Konteks menunjuk kepada Yerusalem, tetapi mengganti ungkapan sumber dengan nama kota akan menghilangkan bentuk asli teks.
- issue: Makna gerak dalam וַיַּעַל אֶבְיָתָר
  choice: “Abyatar naik”
  alternative: “Abyatar datang naik” atau “Abyatar mempersembahkan kurban”
  rationale: Bentuk dari עלה paling langsung menyatakan gerak naik. Arah dan nuansa naratifnya tidak sepenuhnya jelas, sehingga terjemahan tidak menetapkan tafsiran yang lebih khusus.
- issue: Subjek pembawa tabut
  choice: Semua orang Lewi yang menyertai Zadok digambarkan mengusung tabut.
  alternative: Zadok dan semua orang Lewi secara eksplisit dijadikan subjek bersama
  rationale: Partisip jamak mendukung kelompok orang Lewi sebagai pelaku, sedangkan hubungan sintaksis dengan Zadok tetap dapat mencakup kehadirannya tanpa memaksakan rincian tentang apakah ia sendiri ikut mengangkat tabut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama אֶבְיָתָר ditransliterasikan “Abyatar”. Istilah “tabut perjanjian Allah” mempertahankan ragam khidmat yang lazim dipahami. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang diterangkannya.
