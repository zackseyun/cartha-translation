  text: Then Absalom said to him[a], “Look, your claims are good and right[b], but there is no one from the king to hear you.”
translation:
  language: id
  text: Lalu Absalom berkata kepadanya, “Lihat, perkaramu[a] itu baik dan benar, tetapi tidak ada seorang pun dari pihak raja yang mendengarkanmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani דָּבָר dapat berarti “perkataan”, “hal”, atau, dalam konteks hukum, “perkara”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada bagimu seorang pendengar dari pihak raja”, yaitu tidak ada orang yang diberi wewenang oleh raja untuk mendengarkan perkara itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אַבְשָׁלוֹם
  choice: Lalu Absalom berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan urutan secara wajar, sedangkan “kepadanya” mempertahankan objek pronominal Ibrani.
- source_word: רְאֵה
  choice: Lihat
  rationale: Imperatif ini berfungsi sebagai penarik perhatian dalam percakapan. “Lihat” alami dalam bahasa Indonesia modern dan tetap mempertahankan bentuk seruan langsung.
- source_word: דְבָרֶךָ
  choice: perkaramu
  rationale: Dalam konteks orang-orang yang datang untuk memperoleh keputusan hukum, דָּבָר menunjuk pada perkara yang diajukan, bukan sekadar perkataan.
- source_word: טוֹבִים וּנְכֹחִים
  choice: baik dan benar
  rationale: Ungkapan ini mempertahankan penilaian luas “baik” serta gagasan kelurusan atau ketepatan dalam וּנְכֹחִים tanpa mempersempitnya menjadi istilah hukum teknis.
- source_word: וְשֹׁמֵעַ אֵין לְךָ מֵאֵת הַמֶּלֶךְ
  choice: tetapi tidak ada seorang pun dari pihak raja yang mau mendengarkanmu
  rationale: Partisip שֹׁמֵעַ berarti orang yang mendengar, dalam konteks ini orang yang menerima dan memeriksa perkara. מֵאֵת הַמֶּלֶךְ menyatakan asal atau kewenangan dari pihak raja. “Mau” menyampaikan ketiadaan orang yang tersedia untuk menerima perkara, bukan menegaskan bahwa raja sendiri menolak mendengar.
