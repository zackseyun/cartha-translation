  yaml_path: translation/ot/2_samuel/015/009.yaml
  text: The king said to him, “Go in peace.” So he arose and went to Hebron.
translation:
  language: id
  text: Raja berkata kepadanya, “Pergilah dengan damai.” Lalu ia bangkit dan pergi ke Hebron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר yang memperkenalkan ucapan langsung; “berkata” merupakan padanan baku dan alami.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina tertentu ini menunjuk kepada raja yang telah dikenal dalam konteks, yaitu Daud; nama tidak ditambahkan karena teks Ibrani mempertahankan gelarnya.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Imperatif dari הלך; bentuk “pergilah” alami dalam perintah langsung dan sesuai dengan ragam bahasa naratif yang bermartabat.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Ungkapan idiomatis yang dapat berfungsi sebagai restu ketika seseorang pergi; padanan ini mempertahankan unsur שָׁלוֹם tanpa mempersempitnya menjadi sekadar keadaan tanpa konflik.
- source_word: וַיָּקָם
  choice: ia bangkit
  rationale: Kata קום menandai tindakan bangun atau bangkit sebagai awal rangkaian tindakan; “bangkit” mempertahankan bentuk eksplisit teks dengan ragam yang wajar dan bermartabat.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Kata kerja gerak naratif biasa; “pergi” menyampaikan makna langsung dan mengikuti urutan sesudah ia bangkit.
- source_word: חֶבְרוֹנָה
  choice: ke Hebron
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Hebron, yang secara alami dinyatakan dengan preposisi “ke”.
