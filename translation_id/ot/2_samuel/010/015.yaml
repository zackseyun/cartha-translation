base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/015.yaml
  text: When Aram saw that it had been defeated before Israel[a], they gathered together.
translation:
  language: id
  text: Ketika orang Aram melihat bahwa mereka telah dikalahkan oleh Israel, mereka berkumpul bersama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Dalam hubungan dengan tindakan berikutnya, 'Ketika ... melihat' mengungkapkan nuansa waktu secara alami.
- source_word: אֲרָם
  choice: orang Aram
  rationale: Nama tunggal 'Aram' dipakai secara kolektif untuk bangsa atau pasukan Aram. Bahasa Indonesia alami menyatakan pelaku jamak itu dengan 'orang Aram'.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang mereka lihat atau sadari, bukan alasan sebab-akibat.
- source_word: נִגַּף
  choice: telah dikalahkan
  rationale: Bentuk Nifal dalam konteks pertempuran menyatakan bahwa mereka mengalami kekalahan; pilihan ini jelas tanpa menambahkan cara kekalahan yang tidak dinyatakan.
- source_word: לִפְנֵי
  choice: oleh
  rationale: Dalam konteks kekalahan perang, ungkapan harfiah 'di hadapan Israel' secara idiomatis menunjukkan pihak yang mengalahkan. 'Oleh Israel' paling alami dan jelas dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk lazim bahasa Indonesia.
- source_word: וַיֵּאָסְפוּ
  choice: mereka berkumpul
  rationale: Nifal dari אָסַף berarti berkumpul atau menghimpunkan diri; 'berkumpul' mempertahankan makna tanpa mempersempitnya menjadi penyusunan kembali pasukan.
- source_word: יָחַד
  choice: bersama
  rationale: Kata keterangan ini berarti 'bersama-sama' atau 'sebagai satu'; 'bersama' menghasilkan kalimat yang alami dan tetap eksplisit.
