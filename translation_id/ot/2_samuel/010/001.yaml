  text: After this, the king of the Ammonites died, and Hanun his son became king in his place.
translation:
  language: id
  text: Sesudah itu, raja orang Amon meninggal, lalu Hanun, anaknya, menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: raja bani Amon
  rationale: Ungkapan ini secara harfiah berarti ‘raja keturunan Amon’; ‘bani Amon’ merupakan sebutan etnis yang ringkas, wajar, dan dikenal dalam bahasa Indonesia Alkitabiah.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks pergantian sesudah kematian ayahnya, verba ini menyatakan bahwa Hanun mulai memerintah sebagai raja; ‘menjadi raja’ menyampaikan peralihan itu secara alami.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Secara idiomatis berarti ‘di tempatnya’ dalam konteks suksesi kerajaan; ‘menggantikan dia’ jelas dan alami tanpa menambah informasi.
