  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵֽי עַמּ֜וֹן אֶל חָנ֣וּן אֲדֹֽנֵי/הֶ֗ם הַֽ/מְכַבֵּ֨ד דָּוִ֤ד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַֽחֲמִ֑ים הֲ֠/לוֹא בַּ/עֲב֞וּר חֲק֤וֹר אֶת הָ/עִיר֙ וּ/לְ/רַגְּלָ֣/הּ וּ/לְ/הָפְכָ֔/הּ שָׁלַ֥ח דָּוִ֛ד אֶת עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/003.yaml
  text: And the princes of the Ammonites said to Hanun their lord[a], “Is David honoring your father in your sight because he has sent comforters to you? Has not David sent his servants to you in order to search the city, to spy it out[c][b], and to overthrow it?”
translation:
  language: id
  text: Para pemimpin bani Amon berkata kepada Hanun, tuan mereka, “Apakah menurutmu Daud menghormati ayahmu karena ia telah mengutus para utusan untuk menghiburmu?[a] Bukankah Daud mengutus para hambanya kepadamu untuk menyelidiki kota itu, memata-matainya, dan meruntuhkannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Para utusan ini dikirim untuk menyampaikan belasungkawa dan menghibur Hanun setelah ayahnya meninggal.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי בְנֵי עַמּוֹן
  choice: para pemimpin bani Amon
  rationale: שָׂרִים dapat berarti para pembesar, pejabat, atau pemimpin. 'Para pemimpin' alami dalam bahasa Indonesia dan tetap mempertahankan latar politik istana.
- source_word: אֲדֹנֵיהֶם
  choice: tuan mereka
  rationale: אדון di sini adalah gelar manusia yang berwenang, bukan gelar ilahi. 'Tuan mereka' mempertahankan hubungan hierarkis dengan Hanun.
- source_word: הַמְכַבֵּד ... בְּעֵינֶיךָ
  choice: menurutmu ... benar-benar menghormati
  rationale: כבד berarti menunjukkan hormat, sedangkan בְּעֵינֶיךָ secara harfiah 'di matamu' menyatakan penilaian Hanun. Susunan Indonesia ini menyampaikan idiom dan nada skeptis pertanyaan tersebut secara alami.
- source_word: מְנַחֲמִים
  choice: orang-orang untuk menghiburmu
  rationale: Bentuk partisip ini menunjuk kepada para utusan yang datang menyampaikan penghiburan setelah kematian ayah Hanun. Ungkapan verbal lebih alami daripada 'para penghibur' dalam konteks diplomatik Indonesia.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan dan tepat menyampaikan kecurigaan para pemimpin Amon.
- source_word: חֲקוֹר אֶת הָעִיר
  choice: menyelidiki kota ini
  rationale: חקר berarti mencari tahu atau menyelidiki secara saksama. 'Kota ini' wajar dalam ujaran yang diarahkan kepada penguasanya, meskipun bahasa Ibrani secara formal memakai bentuk definit 'kota itu/kota tersebut'.
- source_word: וּלְרַגְּלָהּ
  choice: memata-matainya
  rationale: רגל dalam bentuk Piel berarti mengintai atau memata-matai; sufiks feminin mengacu kepada kota.
- source_word: וּלְהָפְכָהּ
  choice: meruntuhkannya
  rationale: הפך dapat berarti membalikkan, menumbangkan, atau meruntuhkan. Dalam konteks ancaman militer terhadap kota, 'meruntuhkannya' jelas tanpa menambahkan gagasan penghancuran total.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: עבד di sini menunjuk kepada orang-orang dalam pelayanan raja yang bertindak sebagai utusan. 'Para pegawai' menghindari kesan perbudakan yang tidak dituntut konteks dan tetap menyatakan kedudukan mereka di bawah Daud.
theological_decisions:
- issue: Kecurigaan politik dalam ucapan para pemimpin, bukan penilaian narator
  choice: Mempertahankan tuduhan sebagai dua pertanyaan retoris yang skeptis.
  alternative: Mengubahnya menjadi pernyataan langsung bahwa Daud memang bermaksud memata-matai dan meruntuhkan kota.
  rationale: Teks melaporkan dugaan para pemimpin Amon dan tidak mengesahkannya sebagai fakta. Bentuk pertanyaan menjaga jarak antara suara tokoh dan suara narator.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Bani Amon' mempertahankan sebutan kolektif-etnis yang lazim dalam Alkitab Indonesia. Pertanyaan pertama ditata secara idiomatis dengan 'menurutmu' dan 'benar-benar' untuk membawa fungsi בְּעֵינֶיךָ serta nada skeptis konstruksi Ibrani tanpa menjadikan tuduhan itu fakta.
