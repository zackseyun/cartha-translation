  yaml_path: translation/ot/2_samuel/010/007.yaml
  text: When David heard[a], he sent Joab and all the army of the mighty men.
translation:
  language: id
  text: Ketika Daud mendengar hal itu, ia mengutus Yoab beserta seluruh pasukan, yaitu para pejuang yang gagah perkasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh pasukan para pejuang yang gagah perkasa.” Frasa Ibrani dapat dipahami sebagai keterangan penjelas—“seluruh pasukan, yaitu para pejuang yang gagah perkasa”—atau sebagai hubungan kepunyaan/penentuan—“seluruh pasukan para pejuang yang gagah perkasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע דָּוִד
  choice: Ketika Daud mendengar hal itu
  rationale: Bentuk wayyiqtol menyatakan urutan narasi dan secara alami dapat diterjemahkan dengan anak kalimat waktu. Objek verba tidak dinyatakan dalam ayat ini; 'hal itu' dipakai sebagai rujukan kontekstual yang wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח
  choice: ia mengutus
  rationale: Verba שׁלח dalam konteks pengiriman seorang panglima bersama pasukan paling alami diterjemahkan 'mengutus'.
- source_word: אֶת יוֹאָב
  choice: Yoab
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama diri ditransliterasikan sebagai 'Yoab'.
- source_word: וְאֵת כָּל הַצָּבָא
  choice: beserta seluruh pasukan
  rationale: צָבָא di sini menunjuk pada kekuatan militer; 'pasukan' merupakan padanan modern yang jelas. 'Beserta' menghubungkan Yoab dan pasukan sebagai dua objek yang diutus.
- source_word: הַגִּבֹּרִים
  choice: para pejuang yang gagah perkasa
  rationale: גִּבּוֹרִים menunjuk kepada orang-orang kuat atau pejuang gagah. Pilihan ini mempertahankan nuansa keberanian dan kecakapan perang tanpa memastikan bahwa mereka merupakan korps elite tertentu.
