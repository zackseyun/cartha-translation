  text: וַ/יֵּֽצְאוּ֙ בְּנֵ֣י עַמּ֔וֹן וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה פֶּ֣תַח הַ/שָּׁ֑עַר וַ/אֲרַ֨ם צוֹבָ֤א וּ/רְחוֹב֙ וְ/אִֽישׁ ט֣וֹב וּ/מַֽעֲכָ֔ה לְ/בַדָּ֖/ם בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/008.yaml
  text: Then the sons of Ammon came out and drew up for battle at the entrance of the gate[b][a], while Aram of Zobah and Rehob and the men of Tob and Maacah were by themselves in the field.
translation:
  language: id
  text: Lalu bani Amon keluar dan mengatur barisan untuk berperang di pintu gerbang, sedangkan orang Aram dari Zoba dan Rehob, serta orang-orang dari Tob dan Maakha, berada terpisah di padang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Aram dari Zoba dan Rehob, serta orang-orang dari Ish-Tob dan Maakha.” Teks Ibrani אִישׁ טוֹב dapat berarti “orang-orang dari Tob” atau dipahami sebagai nama tempat “Ish-Tob”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ בְּנֵי עַמּוֹן
  choice: Lalu bani Amon keluar
  rationale: Ungkapan etnonim Ibrani secara harfiah berarti 'anak-anak Amon'. Dalam bahasa Indonesia Alkitabiah modern, 'bani Amon' mempertahankan bentuk sumber dengan tetap ringkas dan mudah dipahami; 'keluar' cocok dengan gerakan pasukan dari kota.
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: mengatur barisan untuk berperang
  rationale: Konstruksi ini merupakan idiom militer tentang menempatkan pasukan dalam formasi tempur. Pilihan ini menyampaikan tindakan taktisnya secara alami.
- source_word: פֶּתַח הַשָּׁעַר
  choice: di pintu gerbang
  rationale: Secara harfiah menunjuk pada bukaan atau jalan masuk gerbang. 'Di pintu gerbang' merupakan ungkapan Indonesia yang alami dan cukup tepat untuk lokasi tersebut.
- source_word: וַאֲרַם צוֹבָא וּרְחוֹב
  choice: sedangkan orang Aram dari Zoba dan Rehob
  rationale: אֲרַם dapat menunjuk kepada Aram atau orang Aram. Konteks pasukan sekutu mendukung bentuk personal 'orang Aram'; 'sedangkan' memperjelas kontras posisi tanpa mengubah hubungan antarklausa.
- source_word: וְאִישׁ טוֹב
  choice: serta orang-orang Tob
  rationale: Frasa ini dapat dipahami sebagai orang-orang dari Tob atau sebagai nama tempat Ish-Tob. Teks utama memakai pengertian kontingen dari Tob, sambil mempertahankan kemungkinan nama tempat dalam catatan kaki.
- source_word: וּמַעֲכָה
  choice: dan Maakha
  rationale: Nama diri ditransliterasikan sebagai Maakha menurut bentuk Ibraninya.
- source_word: לְבַדָּם בַּשָּׂדֶה
  choice: berada terpisah di padang
  rationale: לְבַדָּם menandakan bahwa pasukan sekutu mengambil posisi tersendiri dari bani Amon. שָׂדֶה diterjemahkan dekat dengan arti dasarnya, 'padang', tanpa menambahkan sifat 'terbuka' yang hanya tersirat oleh kontras lokasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'bani' mempertahankan tekstur etnonim Ibrani yang lazim dalam bahasa Indonesia Alkitabiah; susunan kalimat memperjelas dua posisi pasukan tanpa menghilangkan ambiguitas nama Ish-Tob.
