  text: וַ/יִּגַּ֣שׁ יוֹאָ֗ב וְ/הָ/עָם֙ אֲשֶׁ֣ר עִמּ֔/וֹ לַ/מִּלְחָמָ֖ה בַּֽ/אֲרָ֑ם וַ/יָּנֻ֖סוּ מִ/פָּנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/013.yaml
  text: Then Joab and the people who were with him advanced to battle against Aram[a], and they fled before him.
translation:
  language: id
  text: Lalu Yoab dan pasukan yang menyertainya maju untuk bertempur melawan Aram[a], dan orang-orang Aram melarikan diri dari hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Aram”; maksudnya, pasukan Aram.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: maju
  rationale: Secara harfiah berarti “mendekat”, tetapi bersama לַמִּלְחָמָה dalam konteks militer, kata ini menyatakan gerak maju untuk menghadapi pertempuran.
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: dan pasukan yang menyertainya
  rationale: עָם secara dasar berarti “rakyat/orang-orang”, tetapi dalam konteks ini jelas menunjuk kepada pasukan tempur Yoab. “Pasukan yang menyertainya” alami dan tepat dalam bahasa Indonesia.
- source_word: לַמִּלְחָמָה
  choice: untuk bertempur
  rationale: Ungkapan ini menyatakan tujuan gerak maju, yakni memasuki atau menghadapi pertempuran.
- source_word: בַּאֲרָם
  choice: melawan Aram
  rationale: Teks Ibrani memakai nama diri tunggal “Aram”. Dalam konteks perang, nama itu mewakili pasukan Aram; bentuk nama aslinya dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: וַיָּנֻסוּ
  choice: orang-orang Aram melarikan diri
  rationale: נוּס berarti “melarikan diri”. Subjek jamaknya tersirat dari pihak Aram yang baru disebut; penyebutan ulang “orang-orang Aram” menghindari ketidakjelasan pronomina dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מִפָּנָיו
  choice: dari hadapannya
  rationale: Terjemahan ini mempertahankan idiom Ibrani “dari hadapan/wajahnya”; akhiran tunggal mengacu kepada Yoab sebagai pemimpin pasukan.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
