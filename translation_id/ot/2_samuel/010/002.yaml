  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כַּ/אֲשֶׁר֩ עָשָׂ֨ה אָבִ֤י/ו עִמָּדִ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֨ח דָּוִ֧ד לְ/נַחֲמ֛/וֹ בְּ/יַד עֲבָדָ֖י/ו אֶל אָבִ֑י/ו וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י דָוִ֔ד אֶ֖רֶץ בְּנֵ֥י עַמּֽוֹן־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, just as his father showed kindness to me.” So David sent by the hand of his servants to comfort him concerning his father, and David’s servants came into the land of the Ammonites.
translation:
  language: id
  text: Daud berkata, “Aku akan menunjukkan kebaikan kepada Hanun anak Nahas, sebagaimana ayahnya telah menunjukkan kebaikan kepadaku.” Lalu Daud mengutus para pelayannya untuk menghibur Hanun berkenaan dengan ayahnya.[a] Para pelayan Daud pun tiba di negeri bani Amon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, untuk menyampaikan belasungkawa kepadanya atas kematian ayahnya.
    reason: Menjelaskan ungkapan Ibrani yang secara harfiah berarti menghibur dia berkenaan dengan ayahnya; konteksnya adalah dukacita karena kematian sang ayah.
lexical_decisions:
- source_word: חֶסֶד
  choice: kebaikan
  rationale: Dalam konteks hubungan diplomatik ini, kata tersebut menunjuk pada perlakuan baik yang disertai kesetiaan atau kemurahan. “Kebaikan” alami dalam bahasa Indonesia dan sesuai untuk kedua kemunculannya.
- source_word: חָנוּן בֶּן נָחָשׁ
  choice: Hanun anak Nahas
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, sedangkan hubungan filial diterjemahkan secara langsung dan jelas.
- source_word: כַּאֲשֶׁר
  choice: sebagaimana
  rationale: Menandai perbandingan dan sifat timbal balik tindakan itu dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: עָשָׂה ... חֶסֶד
  choice: menunjukkan kebaikan
  rationale: Ungkapan ini menyampaikan idiom Ibrani secara alami tanpa mengurangi gagasan tindakan baik terhadap pihak lain.
- source_word: לְנַחֲמוֹ
  choice: untuk menghibur Hanun
  rationale: Bentuk infinitif ini berarti memberi penghiburan, khususnya dalam suasana dukacita. Nama “Hanun” diulangi agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: אֶל אָבִיו
  choice: sehubungan dengan ayahnya
  rationale: Terjemahan ini mempertahankan hubungan yang cukup umum dalam teks Ibrani dan tidak memasukkan kata “kematian” ke dalam teks utama, meskipun konteks jelas menunjuk pada penyampaian belasungkawa.
- source_word: בְּיַד עֲבָדָיו
  choice: mengutus para pegawainya
  rationale: Ungkapan harfiah “melalui tangan para hambanya” menyatakan perantaraan. Dalam bahasa Indonesia, “mengutus para pegawainya” menyampaikan fungsi mereka sebagai utusan secara alami.
- source_word: עַבְדֵי דָוִד
  choice: para pegawai Daud
  rationale: Dalam konteks istana dan misi diplomatik, “pegawai” lebih alami daripada “hamba” dan tetap menyatakan orang-orang yang berada dalam pelayanan Daud.
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: negeri bani Amon
  rationale: “Bani Amon” adalah sebutan etnis yang dikenal dalam tradisi bahasa Indonesia dan secara dekat mencerminkan ungkapan Ibrani “anak-anak Amon”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tuturan langsung memakai “Aku” sesuai ujaran seorang raja, sedangkan narasi mempertahankan bentuk ringkas. Ambiguitas gramatikal yang penting tidak ada; implikasi kematian ayah Hanun dijelaskan dalam catatan kaki alih-alih ditambahkan secara eksplisit ke teks utama.
