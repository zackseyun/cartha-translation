  to: Ketika orang Amon menyadari bahwa mereka telah menjadi menjijikkan bagi Daud[a], orang Amon itu mengirim dan menyewa orang Aram dari Bet-Rehob dan orang Aram dari Zoba[b], dua puluh ribu prajurit infanteri, serta raja Maakha dengan seribu orang dan orang-orang Tob[c], dua belas ribu orang.
