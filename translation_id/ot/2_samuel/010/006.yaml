source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י נִבְאֲשׁ֖וּ בְּ/דָוִ֑ד וַ/יִּשְׁלְח֣וּ בְנֵֽי עַמּ֡וֹן וַ/יִּשְׂכְּרוּ֩ אֶת אֲרַ֨ם בֵּית רְח֜וֹב וְ/אֶת אֲרַ֣ם צוֹבָ֗א עֶשְׂרִ֥ים אֶ֨לֶף֙ רַגְלִ֔י וְ/אֶת מֶ֤לֶךְ מַֽעֲכָה֙ אֶ֣לֶף אִ֔ישׁ וְ/אִ֣ישׁ ט֔וֹב שְׁנֵים עָשָׂ֥ר אֶ֖לֶף אִֽישׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/006.yaml
  text: When the sons of Ammon saw that they had become odious to David[a], the sons of Ammon sent and hired the Arameans of Beth-rehob and the Arameans of Zobah, twenty thousand foot soldiers, and the king of Maacah with one thousand men, and the men of Tob[c][b], twelve thousand men.
translation:
  language: id
  text: Ketika orang Amon menyadari bahwa mereka telah menjadi menjijikkan bagi Daud[a], orang Amon itu mengirim dan menyewa orang Aram dari Bet-Rehob dan orang Aram dari Zoba[b], dua puluh ribu prajurit infanteri, serta raja Maakha dengan seribu orang dan orang-orang Tob[c], dua belas ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka telah menjadi bau busuk bagi Daud.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Aram”; secara tradisional juga diterjemahkan “Siria” atau “orang Siria”.'
    reason: lexical_alternative
  - marker: c
    text: Atau mungkin “Is-Tob”, jika frasa Ibrani dipahami sebagai nama tempat atau kelompok; di sini dipahami sebagai orang-orang dari Tob.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: menyadari
  rationale: Secara harfiah berarti 'melihat', tetapi dalam konstruksi 'melihat bahwa' verba ini menyatakan pengenalan akan keadaan; 'menyadari' alami dalam narasi Indonesia.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ungkapan harfiah 'anak-anak Amon' merupakan sebutan etnis; 'orang Amon' lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: נִבְאֲשׁוּ בְּדָוִד
  choice: telah menjadi bau busuk bagi Daud
  rationale: Mempertahankan metafora bau yang tajam dalam bahasa Ibrani sekaligus dapat dipahami sebagai keadaan yang sangat menjijikkan atau dibenci oleh Daud.
- source_word: וַיִּשְׁלְחוּ
  choice: mengirim utusan
  rationale: Objek verba tidak dinyatakan, tetapi tindakan mengirim mendahului penyewaan pasukan; penambahan implisit 'utusan' membuat hubungan tindakan jelas dan wajar tanpa mengubah maksud.
- source_word: וַיִּשְׂכְּרוּ
  choice: menyewa
  rationale: Dalam konteks militer, verba ini menunjuk pada pembayaran untuk memperoleh bantuan pasukan.
- source_word: אֲרַם בֵּית רְחוֹב
  choice: orang Aram di Bet-Rehob
  rationale: אֲרַם dipahami sebagai kelompok etnis Aram, sedangkan Bet-Rehob adalah wilayah asal mereka; bentuk ini alami dalam bahasa Indonesia.
- source_word: אֲרַם צוֹבָא
  choice: orang Aram di Zoba
  rationale: Menerjemahkan etnonim Aram secara langsung dan mempertahankan Zoba sebagai nama tempat.
- source_word: עֶשְׂרִים אֶלֶף רַגְלִי
  choice: dua puluh ribu prajurit berjalan kaki
  rationale: רַגְלִי menunjuk pada pasukan pejalan kaki; frasa ini jelas bagi pembaca umum dan mempertahankan pembedaan militernya.
- source_word: מֶלֶךְ מַעֲכָה
  choice: raja Maakha
  rationale: Konstruksi Ibrani berarti raja dari wilayah Maakha; dalam bahasa Indonesia, 'raja Maakha' secara alami menyatakan penguasa wilayah itu.
- source_word: אֶלֶף אִישׁ
  choice: seribu orang
  rationale: Terjemahan langsung untuk jumlah pasukan yang menyertai raja Maakha.
- source_word: אִישׁ טוֹב
  choice: orang dari Tob
  rationale: Dalam konteks daftar pasukan, frasa ini paling mungkin menunjuk pada orang-orang dari tempat bernama Tob, meskipun pembacaan sebagai nama gabungan 'Is-Tob' tetap mungkin.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: dua belas ribu orang
  rationale: Terjemahan langsung yang mempertahankan angka dan gaya pencatatan pasukan.
