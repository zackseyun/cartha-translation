  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹאָ֗ב כִּֽי הָיְתָ֤ה אֵלָי/ו֙ פְּנֵ֣י הַ/מִּלְחָמָ֔ה מִ/פָּנִ֖ים וּ/מֵֽ/אָח֑וֹר וַ/יִּבְחַ֗ר מִ/כֹּל֙ בְּחוּרֵ֣י ב/ישראל וַֽ/יַּעֲרֹ֖ךְ לִ/קְרַ֥את אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/009.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose from all the choice men of Israel and arrayed them to meet Aram.
translation:
  language: id
  text: Ketika Yoab melihat bahwa barisan pertempuran menghadangnya dari depan dan dari belakang, ia memilih orang-orang dari antara seluruh prajurit pilihan Israel[a], lalu mengatur mereka dalam formasi tempur untuk menghadapi Aram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ia memilih dari antara semua orang pilihan Israel.” Dalam konteks ini, yang dimaksud ialah para prajurit pilihan.
    reason: lexical_alternative
  - marker: b
    text: “Aram” di sini menunjuk pada pasukan Aram.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Mempertahankan arti dasar ראה dan gaya naratif Ibrani; dalam konteks ini penglihatan itu juga mencakup kesadaran akan keadaan taktis.
- source_word: פְּנֵי הַמִּלְחָמָה
  choice: barisan pertempuran
  rationale: Secara harfiah berarti 'muka pertempuran', tetapi dalam konteks militer menunjuk pada front atau barisan tempur yang menghadapi Yoab.
- source_word: הָיְתָה אֵלָיו
  choice: menghadangnya
  rationale: Mengungkapkan bahwa barisan musuh berada atau diarahkan melawan Yoab, dengan bahasa Indonesia yang alami dan sesuai konteks militer.
- source_word: מִפָּנִים וּמֵאָחוֹר
  choice: dari depan dan dari belakang
  rationale: Mempertahankan kontras ruang dalam teks dan menunjukkan bahwa Yoab terancam dari dua arah.
- source_word: וַיִּבְחַר מִכֹּל בְּחוּרֵי בְיִשְׂרָאֵל
  choice: ia memilih orang-orang dari antara seluruh prajurit pilihan Israel
  rationale: מִכֹּל menyatakan pemilihan dari suatu keseluruhan, sedangkan בְּחוּרֵי dalam konteks ini menunjuk pada para pejuang pilihan; rumusan ini tidak menentukan jumlah yang dipilih.
- source_word: וַיַּעֲרֹךְ
  choice: mengatur mereka dalam formasi tempur
  rationale: Dalam konteks militer, ערך berarti menyusun atau menempatkan pasukan secara teratur untuk berperang.
- source_word: לִקְרַאת אֲרָם
  choice: untuk menghadapi Aram
  rationale: לִקְרַאת di sini menyatakan gerak atau penempatan untuk berhadapan dengan lawan; 'menghadapi' alami dalam konteks pertempuran.
- source_word: אֲרָם
  choice: Aram
  rationale: Mempertahankan nama yang dipakai teks Ibrani dan tidak menggantinya dengan nama geografis dari masa yang lebih kemudian.
