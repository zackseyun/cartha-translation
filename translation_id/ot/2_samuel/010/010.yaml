  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַֽ/יַּעֲרֹ֕ךְ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/010.yaml
  text: And the rest of the people he put under the command of Abishai his brother[c][b][a], and he drew them up to meet the sons of Ammon.
translation:
  language: id
  text: Sisa pasukan itu dipercayakannya kepada Abisai, saudaranya,[a] lalu Yoab menyusun mereka dalam formasi tempur[c] untuk menghadapi bani Amon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “diberikannya ke dalam tangan Abisai, saudaranya,” yaitu diserahkan di bawah wewenang Abisai.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “orang-orang Amon.” Ibrani: “bani Amon.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “mengatur mereka” atau “menempatkan mereka dalam barisan perang.” Kata Ibrani ini menunjuk pada penyusunan pasukan dalam formasi pertempuran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: sisa pasukan
  rationale: Secara harfiah berarti “sisa rakyat/orang-orang,” tetapi dalam konteks pembagian kekuatan perang, הָעָם menunjuk kepada pasukan. “Sisa pasukan” menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: נָתַן בְּיַד
  choice: dipercayakannya kepada
  rationale: Ungkapan harfiahnya “memberikan ke dalam tangan,” yakni menyerahkan kepada wewenang atau pimpinan seseorang. Bentuk ini mempertahankan gagasan penyerahan tanggung jawab tanpa terjemahan harfiah yang kaku.
- source_word: אַבְשַׁי
  choice: Abisai
  rationale: Mengikuti bentuk nama yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Hubungan keluarga antara Yoab dan Abisai dinyatakan secara eksplisit dalam teks Ibrani dan dipertahankan.
- source_word: וַיַּעֲרֹךְ
  choice: lalu Abisai mengatur mereka dalam barisan tempur
  rationale: Dalam konteks militer, ערך berarti menyusun pasukan dalam formasi pertempuran. Subjek “Abisai” dinyatakan kembali untuk memperjelas pergantian subjek yang tersirat dalam bahasa Ibrani.
- source_word: לִקְרַאת
  choice: untuk menghadapi
  rationale: Kata ini berarti bergerak menuju pertemuan dengan; dalam konteks perang, “menghadapi” secara alami menyampaikan perjumpaan yang bersifat bermusuhan.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Mencerminkan ungkapan Ibrani “anak-anak Amon” dengan bentuk kolektif yang masih wajar dan bermartabat dalam bahasa Indonesia.
