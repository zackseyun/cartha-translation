translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pronomina “aku—engkau” mempertahankan percakapan langsung antartokoh tanpa terdengar terlalu formal. Istilah “pertolongan” dipahami secara militer, bukan sebagai penegasan doktrinal.
