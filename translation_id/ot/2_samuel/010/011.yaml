base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/011.yaml
  text: He said[a], “If Aram is too strong for me, then you shall help me; but if the Ammonites are too strong for you[b], then I will go to help you.”
translation:
  language: id
  text: Ia berkata, “Jika Aram lebih kuat daripada aku[a], engkau akan menolong aku[b]. Namun, jika orang Amon lebih kuat daripada engkau, aku akan pergi menolong engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jika Aram mengalahkan aku”; demikian juga pada bagian berikutnya mengenai orang Amon.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “maka engkau akan menjadi pertolongan bagiku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֱזְקוּ
  choice: lebih kuat daripada
  rationale: Dalam konteks pertempuran, חזק dengan מן menyatakan bahwa satu pihak lebih kuat atau mengungguli pihak lain. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa perbandingan.
- source_word: אֲרָם
  choice: pasukan Aram
  rationale: אֲרָם menunjuk kepada Aram; penambahan “pasukan” disimpulkan secara langsung dari konteks militer dan mencegah kesan bahwa wilayah geografis itu sendiri bertindak.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan harfiah “anak-anak Amon” merupakan sebutan etnis. “Bani Amon” adalah bentuk Indonesia yang ringkas, lazim, dan bermartabat.
- source_word: וְהָיְתָה לִּי לִישׁוּעָה
  choice: pasukanmu harus datang menolong aku
  rationale: יְשׁוּעָה di sini berarti pertolongan atau penyelamatan konkret di medan perang, bukan istilah teologis abstrak. Bentuk feminin tunggal וְהָיְתָה tampaknya merujuk kepada unsur kolektif yang tersirat, yakni pasukan di bawah pimpinan Abisai; “pasukanmu” membuat acuan itu jelas tanpa mengubah tindakan yang dimaksud.
- source_word: וְהָלַכְתִּי לְהוֹשִׁיעַ לָךְ
  choice: aku akan pergi menolong engkau
  rationale: הלך dengan infinitif menyatakan gerak yang bertujuan, sedangkan הושיע dalam konteks ini berarti memberi pertolongan atau menyelamatkan dari tekanan musuh. “Pergi menolong” mempertahankan kedua unsur tersebut.
