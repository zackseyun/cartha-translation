review_pass:
  verdict: revise
  source_fidelity: Draf secara umum menangkap kondisi timbal balik dalam konteks pertempuran. Namun, “pasukan Aram,” “pasukanmu,” dan khususnya “harus datang” menambahkan unsur yang tidak dinyatakan dalam teks Ibrani. וְהָיְתָה לִּי לִישׁוּעָה menyatakan bahwa lawan bicara akan menjadi/bertindak sebagai pertolongan, bukan kewajiban untuk datang; sementara וְהָלַכְתִּי baru secara eksplisit menyebut pergi pada klausa kedua.
  naturalness: “Jika Aram lebih kuat daripada aku ...” dan “aku akan pergi menolong engkau” sangat alami dalam bahasa Indonesia modern. “Orang Amon” lebih lazim dan netral daripada “bani Amon” dalam register modern umum. Bentuk “engkau” tetap cocok untuk dialog naratif yang bermartabat.
  terminology: Nama Aram dipertahankan, bukan diganti “Suriah.” “Orang Amon” menyampaikan בני עמון sebagai sebutan bangsa/kelompok tanpa membawa register kekerabatan “bani.” “Pertolongan” tepat untuk ישועה dalam koordinasi militer dan tidak memaksakan konotasi teologis.
  issues:
  - severity: medium
    issue: Penambahan “pasukan” dan “harus datang” pada klausa pertama.
    rationale: Teks hanya menyebut Aram dan mengatakan kepada lawan bicara, “engkau akan menjadi pertolongan bagiku.” Tidak ada kata untuk “pasukan,” modalitas “harus,” atau verba gerak “datang” dalam klausa ini. Tambahan tersebut mempersempit subjek dan memperluas tindakan.
  - severity: low
    issue: “Bani Amon” kurang natural untuk sasaran bahasa Indonesia modern standar.
    rationale: Walaupun dapat dipahami, “orang Amon” adalah sebutan etnonim yang lebih umum dan netral dalam prosa Indonesia modern.
  - severity: low
    issue: Catatan b mengklaim bahwa subjek “pasukanmu” tersirat dalam bahasa Ibrani.
    rationale: Subjek orang kedua memang tersirat pada bentuk verba, tetapi “pasukanmu” bukan unsur tersirat yang pasti. Catatan perlu mempertahankan ketidakpastian itu, bukan menetapkan rujukan kolektif.
  revised_text: Ia berkata, “Jika Aram lebih kuat daripada aku[a], engkau akan menolong aku[b]. Namun, jika orang Amon lebih kuat daripada engkau, aku akan pergi menolong engkau.”
