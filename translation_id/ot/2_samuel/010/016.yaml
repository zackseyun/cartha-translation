base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/016.yaml
  text: Hadadezer sent and brought out the Arameans who were beyond the River[a], and they came to Helam[c][b], with Shobak the commander of Hadadezer’s army before them.
translation:
  language: id
  text: Hadadezer mengirim dan membawa keluar orang-orang Aram dari seberang Sungai[a]. Mereka tiba di Helam, dengan Sobakh[b], panglima tentara Hadadezer, berada di depan mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud adalah dari seberang Sungai Efrat.
    reason: cultural_note
  - marker: b
    text: Atau “Sobak”.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “di depan mereka” kemungkinan berarti bahwa ia memimpin mereka atau berada di barisan terdepan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata kerja ini berarti ‘mengutus/mengirim’. Bahasa Indonesia biasanya memerlukan objek; ‘orang’ menyatakan perantara yang tersirat tanpa menentukan identitasnya.
- source_word: וַיֹּצֵא אֶת אֲרָם
  choice: menyuruh keluar orang-orang Aram
  rationale: Bentuk kausatif יצא menyatakan bahwa Hadadezer menyebabkan pasukan Aram keluar. ‘Menyuruh keluar’ mempertahankan daya kausatif tanpa mempersempitnya menjadi sekadar ‘menghimpun’.
- source_word: אֲרָם
  choice: orang-orang Aram
  rationale: Dalam konteks perang, istilah ini menunjuk kepada orang atau pasukan Aram, bukan hanya wilayah Aram. Bentuk ini juga menghindari asosiasi anakronistis dari sebutan ‘Siria’.
- source_word: מֵעֵבֶר הַנָּהָר
  choice: dari seberang Sungai
  rationale: Terjemahan ini mempertahankan ungkapan sumber ‘dari seberang Sungai’; identifikasi Sungai Efrat diberikan dalam catatan kaki.
- source_word: וַיָּבֹאוּ חֵילָם
  choice: mereka tiba di Helam
  rationale: Kata kerja בוא menyatakan kedatangan, sedangkan חֵילָם diperlakukan sebagai nama tempat. ‘Tiba di’ alami dalam narasi Indonesia.
- source_word: וְשׁוֹבַךְ
  choice: Sobakh
  rationale: Transliterasi ini mencerminkan konsonan akhir כְ sebagai ‘kh’; bentuk ‘Sobak’ dicatat sebagai alternatif.
- source_word: שַׂר צְבָא
  choice: panglima tentara
  rationale: Ungkapan konstruksi ini menunjuk kepada pemimpin militer. ‘Panglima tentara’ jelas, ringkas, dan sesuai dengan ragam narasi sejarah.
- source_word: לִפְנֵיהֶם
  choice: berada di depan mereka
  rationale: Terjemahan ini mempertahankan arti spasial harfiah serta ambiguitasnya; dalam konteks militer ungkapan itu mungkin berarti bahwa Sobakh memimpin mereka.
