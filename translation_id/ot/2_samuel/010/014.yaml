id: 2SA.10.14
reference: 2 Samuel 10:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנֻ֨סוּ֙ מִ/פְּנֵ֣י אֲבִישַׁ֔י וַ/יָּבֹ֖אוּ הָ/עִ֑יר וַ/יָּ֣שָׁב יוֹאָ֗ב מֵ/עַל֙ בְּנֵ֣י עַמּ֔וֹן וַ/יָּבֹ֖א יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/014.yaml
  text: And when the sons of Ammon saw that Aram had fled[a], they fled before Abishai and entered the city[c][b]. Then Joab returned from against the sons of Ammon and came to Jerusalem.
translation:
  language: id
  text: Ketika orang Amon melihat bahwa Aram telah melarikan diri, mereka pun melarikan diri dari hadapan Abisai dan masuk ke kota. Lalu Yoab mundur dari pertempuran melawan orang Amon[a] dan pergi ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Amon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: orang Amon
  rationale: Secara harfiah berarti 'anak-anak Amon', tetapi dalam konteks kebangsaan ungkapan ini secara alami merujuk kepada orang Amon; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: רָאוּ כִּי
  choice: melihat bahwa
  rationale: Mempertahankan ungkapan persepsi dalam bahasa Ibrani tanpa mengubahnya menjadi penafsiran yang lebih kuat seperti 'menyadari'.
- source_word: נָס
  choice: telah melarikan diri
  rationale: Bentuk qatal menyatakan tindakan Aram yang sudah terjadi ketika orang Amon melihatnya.
- source_word: אֲרָם
  choice: Aram
  rationale: Mempertahankan nama bangsa/wilayah dalam teks Ibrani dan menghindari sebutan 'Siria' yang berpotensi anakronistis; dalam konteks, nama tunggal ini bersifat kolektif.
- source_word: וַיָּנֻסוּ מִפְּנֵי אֲבִישַׁי
  choice: mereka pun melarikan diri dari hadapan Abisai
  rationale: Ungkapan 'dari hadapan' mempertahankan nuansa harfiah מִפְּנֵי sekaligus dapat dipahami sebagai mundur menghadapi pasukan Abisai.
- source_word: וַיָּבֹאוּ הָעִיר
  choice: masuk ke kota
  rationale: Padanan Indonesia yang alami untuk gerak memasuki kota berbenteng tertentu yang sudah diketahui dari konteks.
- source_word: וַיָּשָׁב יוֹאָב מֵעַל בְּנֵי עַמּוֹן
  choice: Lalu Yoab mundur dari pertempuran melawan orang Amon
  rationale: Dalam konteks militer, שׁוב dengan מֵעַל menunjukkan bahwa Yoab berbalik atau menarik diri dari serangan terhadap orang Amon; terjemahan ini menyampaikan maksud frasa Ibrani secara alami.
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: dan pergi ke Yerusalem
  rationale: Kata בוא dapat berarti datang atau pergi menurut sudut pandang narasi. 'Pergi' paling alami dalam bahasa Indonesia karena Yoab bergerak dari medan perang menuju Yerusalem tanpa menyiratkan secara eksplisit hal yang tidak dinyatakan oleh verba ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama 'Aram' dipertahankan sesuai sumber Ibrani. Susunan naratif dibuat alami tanpa menghilangkan urutan tindakan atau nuansa penarikan diri Yoab dari pertempuran.
