  text: וַ/יָּ֣נָס אֲרָם֮ מִ/פְּנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜ד מֵ/אֲרָ֗ם שְׁבַ֤ע מֵאוֹת֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֨ת שׁוֹבַ֧ךְ שַׂר צְבָא֛/וֹ הִכָּ֖ה וַ/יָּ֥מָת שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/018.yaml
  text: Aram fled from before Israel[a], and David killed seven hundred charioteers and forty thousand horsemen from Aram. He also struck down Shobach, the commander of their army[b], and he died there.
translation:
  language: id
  text: Orang Aram melarikan diri dari hadapan Israel. Daud membunuh, dari pihak Aram, tujuh ratus anggota pasukan kereta perang[a] dan empat puluh ribu penunggang kuda. Ia juga menewaskan Syobakh, panglima tentaranya[b], lalu Syobakh mati di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tujuh ratus kereta/pasukan kereta.” Referen tepatnya mungkin pasukan yang menggunakan kereta perang. Dalam 1 Tawarikh 19:18 tertulis “tujuh ribu kereta.”
    reason: textual_variant
  - marker: b
    text: 'Kata Ibrani memakai akhiran tunggal: “panglima tentaranya.” Rujukan akhiran itu tidak dinyatakan secara eksplisit dalam ayat ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס אֲרָם מִפְּנֵי יִשְׂרָאֵל
  choice: Orang Aram melarikan diri dari hadapan Israel
  rationale: אֲרָם dipahami secara kolektif sebagai orang Aram. Ungkapan מִפְּנֵי menunjukkan mundur atau melarikan diri ketika menghadapi musuh; “dari hadapan” mempertahankan gambaran Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיַּהֲרֹג דָּוִד
  choice: Daud membunuh
  rationale: הרג secara langsung berarti membunuh. Pilihan ini jelas dan membedakannya dari נכה pada bagian selanjutnya.
- source_word: שְׁבַע מֵאוֹת רֶכֶב
  choice: tujuh ratus orang dari pasukan kereta
  rationale: רֶכֶב dapat berarti kereta perang atau pasukan kereta. Karena verba “membunuh” mengarah pada korban manusia, “orang dari pasukan kereta” menyampaikan referen militer yang masuk akal tanpa mengubah angka atau menyamakan teks ini dengan 1 Tawarikh 19:18.
- source_word: וְאַרְבָּעִים אֶלֶף פָּרָשִׁים
  choice: empat puluh ribu pasukan berkuda
  rationale: פָּרָשִׁים menunjuk kepada para penunggang kuda atau kavaleri; “pasukan berkuda” merupakan padanan Indonesia yang alami dalam konteks militer.
- source_word: וְאֵת שׁוֹבַךְ
  choice: Syobakh
  rationale: Transliterasi mengikuti vokalisasi Masoret dan menampilkan konsonan שׁ dengan bentuk “Sy” yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: שַׂר צְבָאוֹ
  choice: panglima tentaranya
  rationale: שַׂר dalam konteks ini berarti pemimpin militer, sedangkan צָבָא berarti tentara. Akhiran tunggal -וֹ dipertahankan dengan “-nya” agar ambiguitas rujukannya tidak dihapus.
- source_word: הִכָּה
  choice: menewaskan
  rationale: נכה berarti memukul atau menghantam dan dalam konteks ini menghasilkan kematian. “Menewaskan” alami dalam narasi pertempuran dan membedakannya dari הרג sebelumnya.
- source_word: וַיָּמָת שָׁם
  choice: lalu Syobakh mati di sana
  rationale: Nama Syobakh diulangi supaya subjek pronominal tidak rancu dalam bahasa Indonesia, sedangkan “di sana” mempertahankan שָׁם tanpa menambahkan lokasi atau keadaan yang tidak disebutkan.
theological_decisions:
- issue: Rujukan akhiran tunggal pada צְבָאוֹ
  choice: tentaranya
  alternative: tentara mereka
  rationale: Teks Ibrani memakai akhiran orang ketiga maskulin tunggal, yang dapat menunjuk kepada seorang penguasa Aram yang tersirat dalam konteks lebih luas. Bentuk Indonesia “-nya” mempertahankan ketunggalan dan tidak mengubahnya menjadi jamak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah militer dibuat alami tanpa menghapus kesulitan tekstual pada רֶכֶב atau ambiguitas akhiran tunggal pada צְבָאוֹ.
