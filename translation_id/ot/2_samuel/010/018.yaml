revisions:
- from: Orang Aram melarikan diri dari hadapan Israel. Daud membunuh tujuh ratus orang dari pasukan kereta[a] dan empat puluh ribu pasukan berkuda dari antara orang Aram. Ia juga menewaskan Syobakh, panglima tentaranya[b], lalu Syobakh mati di sana.
  to: Orang Aram melarikan diri dari hadapan Israel. Daud membunuh, dari pihak Aram, tujuh ratus anggota pasukan kereta perang[a] dan empat puluh ribu penunggang kuda. Ia juga menewaskan Syobakh, panglima tentaranya[b], lalu Syobakh mati di sana.
  rationale: Revisi menempatkan “dari pihak Aram” agar cakupannya meliputi kedua jumlah korban, mengganti istilah kolektif “pasukan berkuda” dengan “penunggang kuda,” dan mempertahankan ambiguitas tekstual mengenai pasukan kereta serta akhiran tunggal pada “tentaranya.”
