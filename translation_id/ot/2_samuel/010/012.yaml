base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/012.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: id
  text: Jadilah kuat, dan marilah kita menguatkan diri[a] demi bangsa kita dan demi kota-kota Allah kita. Kiranya Yahweh melakukan apa yang baik di mata-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “marilah kita menunjukkan diri kuat” atau “marilah kita menjadi kuat.” Kata kerja Ibrani ini berbentuk refleksif dan dapat menyatakan tindakan menunjukkan kekuatan atau menguatkan diri.
    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh akan melakukan apa yang baik di mata-Nya.” Bentuk Ibraninya dapat dibaca sebagai pernyataan tentang apa yang akan terjadi, meskipun di sini diterjemahkan sebagai harapan yang menyerahkan hasilnya kepada kehendak Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: Kuatkanlah hatimu
  rationale: Imperatif Qal orang kedua maskulin tunggal ini merupakan seruan langsung agar teguh atau kuat. Ungkapan Indonesia ini alami dalam konteks keberanian menghadapi pertempuran.
- source_word: וְנִתְחַזַּק
  choice: dan marilah kita menguatkan hati
  rationale: Bentuk Hitpael kohortatif orang pertama jamak membawa nuansa refleksif, yakni meneguhkan atau menunjukkan diri kuat. Pengulangan ungkapan menjaga kesejajaran dengan seruan sebelumnya.
- source_word: בְּעַד
  choice: demi
  rationale: Dalam konteks militer, preposisi ini menyatakan tindakan untuk membela atau bagi kepentingan pihak lain; 'demi' ringkas dan wajar dalam bahasa Indonesia.
- source_word: עַמֵּנוּ
  choice: bangsa kita
  rationale: עַם menunjuk kepada umat atau bangsa, bukan secara khusus tentara. 'Bangsa kita' mempertahankan cakupan komunitas yang luas dan sejajar dengan kota-kota Allah.
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: kota-kota Allah kita
  rationale: Terjemahan ini mempertahankan rantai konstruksi Ibrani dan kaitan teologis kota-kota itu dengan Allah Israel.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' untuk mempertahankan nama perjanjian yang hadir secara eksplisit dalam teks.
- source_word: יַעֲשֶׂה הַטּוֹב בְּעֵינָיו
  choice: Kiranya Yahweh melakukan apa yang baik di mata-Nya
  rationale: Yiqtol sesudah rangkaian ajakan dapat dipahami sebagai harapan yang menyerahkan hasil kepada kehendak Allah. Idiom 'baik di mata-Nya' dipertahankan dekat dengan bahasa sumber.
theological_decisions:
- issue: Pemaknaan yiqtol יַעֲשֶׂה sebagai harapan atau masa depan sederhana
  choice: Kiranya Yahweh melakukan apa yang baik di mata-Nya
  alternative: Yahweh akan melakukan apa yang baik di mata-Nya
  rationale: Dalam konteks sesudah seruan dan ajakan, bentuk ini wajar dipahami secara jussif sebagai ungkapan penyerahan kepada kehendak Yahweh, tetapi bentuk Ibraninya juga memungkinkan pembacaan masa depan sederhana; ambiguitas itu dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kuatkanlah hati' dipilih sebagai ungkapan alami untuk keberanian dalam konteks perang, sedangkan idiom teologis 'baik di mata-Nya' dipertahankan agar dekat dengan teks Ibrani.
