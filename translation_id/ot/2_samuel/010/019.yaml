base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/019.yaml
  text: When all the kings who were servants of Hadadezer saw that they had been defeated before Israel, they made peace with Israel and served them. So Aram was afraid to save the sons of Ammon anymore.
translation:
  language: id
  text: Ketika semua raja yang menjadi bawahan Hadadezer melihat bahwa mereka telah dikalahkan oleh Israel, mereka berdamai dengan Israel dan mengabdi kepada mereka. Maka orang Aram takut lagi menolong orang Amon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: yang menjadi bawahan Hadadezer
  rationale: Dalam konteks para raja, עבד menunjuk pada kedudukan takluk atau vasal; 'bawahan' lebih alami dan tepat daripada 'hamba'.
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: telah dikalahkan oleh Israel
  rationale: Ungkapan Ibrani harfiah 'dipukul/dikalahkan di hadapan Israel' secara idiomatis menyatakan kekalahan oleh Israel.
- source_word: וַיַּשְׁלִמוּ אֶת־יִשְׂרָאֵל
  choice: mereka berdamai dengan Israel
  rationale: Bentuk dari akar שלם dengan objek אֶת menyatakan tindakan mengadakan perdamaian.
- source_word: וַיַּעַבְדוּם
  choice: mengabdi kepada mereka
  rationale: Akhiran jamak merujuk kepada Israel sebagai kelompok; 'mengabdi' mempertahankan gagasan ketundukan/pelayanan politik.
- source_word: לְהוֹשִׁיעַ
  choice: menolong
  rationale: Dalam konteks bantuan militer kepada bani Amon, 'menolong' paling alami; makna dasarnya dapat mencakup menyelamatkan atau memberi kemenangan.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan tradisional dan ringkas dalam bahasa Indonesia untuk keturunan atau bangsa Amon.
