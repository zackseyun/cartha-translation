  source_fidelity: 'Terjemahan dengan setia mencerminkan rangkaian verba Ibrani: laporan yang disampaikan kepada Daud tanpa menyebut pelapor, penghimpunan seluruh Israel, penyeberangan Yordan, kedatangan di Helam, dan pengerahan orang Aram untuk berperang melawan Daud. “Orang Aram” merupakan padanan idiomatis yang tepat bagi kolektif אֲרָם, dan “melawannya” secara jelas menyampaikan daya permusuhan konstruksi עִם dalam konteks perang.'
