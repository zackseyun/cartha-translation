  text: וַ/יֻּגַּ֣ד לְ/דָוִ֗ד וַ/יֶּאֱסֹ֤ף אֶת כָּל יִשְׂרָאֵל֙ וַ/יַּעֲבֹ֣ר אֶת הַ/יַּרְדֵּ֔ן וַ/יָּבֹ֖א חֵלָ֑אמָ/ה וַ/יַּעַרְכ֤וּ אֲרָם֙ לִ/קְרַ֣את דָּוִ֔ד וַ/יִּלָּחֲמ֖וּ עִמּֽ/וֹס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, and came to Helam. Then Aram drew up in battle formation to meet David and fought with him.
translation:
  language: id
  text: Ketika hal itu diberitahukan kepada Daud, ia mengumpulkan seluruh Israel, menyeberangi Sungai Yordan, dan tiba di Helam. Orang Aram pun mengatur barisan untuk menghadapi Daud, lalu berperang melawannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berperang dengannya”; dalam ungkapan Ibrani ini maksudnya adalah berperang melawan dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִד
  choice: Ketika hal itu diberitahukan kepada Daud
  rationale: Bentuk pasif mempertahankan bahwa pemberi laporan tidak disebutkan. Kata “hal itu” secara wajar merujuk pada peristiwa sebelumnya tanpa menambahkan isi laporan.
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: ia mengumpulkan seluruh Israel
  rationale: Mempertahankan sebutan kolektif “Israel” tanpa mempersempitnya menjadi “tentara Israel,” meskipun konteksnya adalah pengerahan untuk perang.
- source_word: וַיַּעֲבֹר אֶת הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Dalam bahasa Indonesia, penambahan penjelas geografis “Sungai” membuat ungkapan alami dan jelas, sedangkan tindakan עָבַר diterjemahkan langsung sebagai “menyeberangi.”
- source_word: וַיָּבֹא חֵלָמָה
  choice: dan tiba di Helam
  rationale: Akhiran penunjuk arah pada חֵלָמָה menyatakan gerak menuju Helam; “tiba di” menyampaikan hasil perjalanan secara alami dalam konteks ini.
- source_word: וַיַּעַרְכוּ אֲרָם
  choice: Orang Aram pun mengatur barisan
  rationale: עָרַךְ dalam konteks militer berarti menyusun atau mengatur pasukan dalam formasi. “Orang Aram” mengungkapkan kolektif אֲרָם secara alami dalam bahasa Indonesia.
- source_word: לִקְרַאת דָּוִד
  choice: untuk menghadapi Daud
  rationale: לִקְרַאת pada dasarnya berarti bergerak untuk menemui seseorang; dalam konteks pertempuran, “menghadapi” menyampaikan pertemuan yang bersifat bermusuhan tanpa berlebihan.
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: lalu berperang melawannya
  rationale: Konstruksi verba perang dengan עִם secara harfiah dapat berbunyi “berperang dengannya,” tetapi dalam konteks ini berarti bertempur sebagai lawan. “Melawannya” menghindari kesan bahwa mereka berperang di pihak Daud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang ringkas dan bermartabat. Istilah kolektif “seluruh Israel” dipertahankan, sedangkan konteks militer disampaikan secara alami tanpa menambahkan kata “tentara” yang tidak terdapat dalam teks Ibrani.
