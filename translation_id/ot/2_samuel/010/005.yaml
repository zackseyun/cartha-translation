translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan jamak ‘kalian’ dipakai karena perintah ditujukan kepada beberapa orang. Nama tempat mengikuti bentuk Indonesia yang lazim, ‘Yerikho’.
