base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/005.yaml
  text: When they told David[a], he sent to meet them, for the men were greatly humiliated. And the king said, “Stay at Jericho until your beards have grown[b], and then return.”
translation:
  language: id
  text: Ketika hal itu diberitahukan kepada Daud, ia mengutus orang untuk menemui mereka[a], sebab orang-orang itu sangat dipermalukan[b]. Raja berkata, “Tinggallah di Yerikho sampai janggut kalian tumbuh kembali[c], kemudian kembalilah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ia mengutus untuk menemui mereka.” Teks Ibrani tidak menyebutkan secara eksplisit siapa yang diutus.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sangat mendapat malu” atau “sangat terhina.” Istilah Ibraninya menekankan keadaan dipermalukan atau dibuat mendapat malu.
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “sampai janggut kalian tumbuh.” Kata “kembali” tersirat dari konteks.'
    reason: implicit_context
lexical_decisions:
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: Ketika hal itu diberitahukan kepada Daud
  rationale: Bentuk Hifil dari נגד berarti ‘memberitahukan’ atau ‘melaporkan’. Pelakunya tidak disebutkan secara khusus dalam bahasa Ibrani; bentuk pasif bahasa Indonesia mempertahankan ketidakjelasan itu dan tetap alami.
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: ia mengutus orang untuk menemui mereka
  rationale: Secara harfiah konstruksi ini berarti ‘ia mengutus untuk menemui mereka’. Bahasa Indonesia memerlukan objek yang wajar bagi ‘mengutus’; ‘orang’ menyatakan implikasi tindakan tersebut tanpa menentukan bahwa mereka adalah pembawa pesan resmi.
- source_word: כִּי הָיוּ הָאֲנָשִׁים נִכְלָמִים מְאֹד
  choice: sebab orang-orang itu sangat dipermalukan
  rationale: כִּי menyatakan alasan, sedangkan bentuk Nifal נִכְלָמִים menggambarkan keadaan dipermalukan atau dibuat mendapat malu. ‘Sangat’ menerjemahkan מְאֹד dan mempertahankan intensitasnya.
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: Raja berkata
  rationale: Gelar ‘raja’ dipertahankan sebagaimana teks Ibrani; dalam konteks, yang dimaksud ialah Daud. Urutan narasi tetap jelas tanpa harus selalu menerjemahkan waw sebagai ‘dan’.
- source_word: שְׁבוּ בִירֵחוֹ
  choice: Tinggallah di Yerikho
  rationale: Dalam konteks ini ישׁב berarti tinggal atau menetap sementara, bukan sekadar duduk. ‘Di Yerikho’ merupakan ungkapan lokasi yang alami dalam bahasa Indonesia.
- source_word: עַד יְצַמַּח זְקַנְכֶם
  choice: sampai janggut kalian tumbuh kembali
  rationale: צמח berarti tumbuh atau bertunas. Kata ‘kembali’ tersirat oleh konteks janggut yang telah dicukur dan menghasilkan bahasa Indonesia yang alami, sementara catatan kaki memberi bentuk yang lebih harfiah.
- source_word: וְשַׁבְתֶּם
  choice: kemudian pulanglah
  rationale: שׁוב berarti kembali. Karena mereka sedang berada di Yerikho dan diperintahkan kembali sesudah janggut tumbuh, ‘pulanglah’ menyampaikan arah gerak secara alami; ‘kemudian’ menjelaskan urutan yang sudah terkandung dalam konstruksi dengan ‘sampai’.
