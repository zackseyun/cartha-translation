  text: וַ/יִּקַּ֨ח חָנ֜וּן אֶת עַבְדֵ֣י דָוִ֗ד וַ/יְגַלַּח֙ אֶת חֲצִ֣י זְקָנָ֔/ם וַ/יִּכְרֹ֧ת אֶת מַדְוֵי/הֶ֛ם בַּ/חֵ֖צִי עַ֣ד שְׁתֽוֹתֵי/הֶ֑ם וַֽ/יְשַׁלְּחֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/010/004.yaml
  text: So Hanun took David’s servants[a], shaved off half of their beards, cut off their garments in the middle up to their buttocks, and sent them away.
translation:
  language: id
  text: Lalu Hanun mengambil para pelayan Daud, mencukur separuh janggut mereka, memotong pakaian mereka di tengah hingga setinggi bokong mereka,[a] lalu mengirim mereka pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hingga bagian belakang tubuh mereka” atau “hingga daerah kemaluan mereka.” Istilah Ibrani yang digunakan di sini jarang muncul, sehingga rujukan anatominya tidak pasti. Maksudnya ialah Hanun mempermalukan mereka dengan memotong pakaian mereka sangat pendek sehingga tubuh mereka tersingkap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: menangkap
  rationale: Dalam konteks perlakuan paksa terhadap para utusan, לקח lebih alami diterjemahkan 'menangkap' daripada sekadar 'mengambil', tanpa harus memakai kata yang lebih keras seperti 'menyergap'.
- source_word: עַבְדֵי דָוִד
  choice: para pegawai Daud
  rationale: עבד dapat berarti hamba, budak, atau pejabat kerajaan. Dalam konteks ini mereka adalah utusan yang melayani raja; 'pegawai Daud' menyampaikan kedudukan mereka tanpa menyiratkan perbudakan.
- source_word: וַיְגַלַּח אֶת חֲצִי זְקָנָם
  choice: mencukur separuh janggut mereka
  rationale: Ungkapan ini menunjukkan bahwa sebagian janggut setiap orang dicukur sebagai tindakan penghinaan; terjemahan ini lugas dan alami.
- source_word: וַיִּכְרֹת אֶת מַדְוֵיהֶם
  choice: memotong pakaian mereka
  rationale: כרת berarti memotong atau memotong lepas, sedangkan מַדְוֵי menunjuk pada pakaian tanpa memastikan jenisnya. Bahasa Indonesia tidak perlu menambahkan 'hingga putus' karena batas potong dijelaskan sesudahnya.
- source_word: בַּחֵצִי
  choice: pada bagian tengah
  rationale: Frasa ini menunjuk pada lokasi pemotongan di titik tengah pakaian dan mempertahankan gambaran spasial teks Ibrani.
- source_word: עַד שְׁתוֹתֵיהֶם
  choice: sampai ke pantat mereka
  rationale: שְׁתוֹת adalah istilah langka yang tampaknya menunjuk pada bagian bawah tubuh, kemungkinan pantat atau daerah kemaluan. 'Pantat' paling langsung dan sesuai dengan konteks penghinaan, sementara ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: וַיְשַׁלְּחֵם
  choice: menyuruh mereka pergi
  rationale: שלח di sini berarti melepas atau mengirim mereka pergi setelah dipermalukan; ungkapan ini alami dalam alur narasi Indonesia.
