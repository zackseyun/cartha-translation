translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata 'pantat' dipakai karena jelas dan tidak terlalu klinis; catatan kaki mempertahankan ketidakpastian istilah Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
