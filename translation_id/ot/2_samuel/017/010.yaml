  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Perumpamaan hati singa dipertahankan, sementara metafora Ibrani tentang hati yang 'luluh' disampaikan dengan ungkapan Indonesia yang alami, 'tawar hati'; bentuk harfiahnya dicatat dalam catatan kaki.
