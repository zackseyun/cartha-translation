base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/010.yaml
  text: Even the valiant man whose heart is like a lion’s heart will utterly melt[a], for all Israel knows that your father is a mighty man[b], and that the men with him are valiant men.
translation:
  language: id
  text: Bahkan orang gagah berani yang hatinya seperti hati singa pun akan benar-benar tawar hati[a], sebab seluruh Israel tahu bahwa ayahmu adalah seorang pahlawan dan bahwa orang-orang yang bersamanya adalah orang-orang gagah berani.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “akan luluh, luluh”; suatu bentuk penegasan yang berarti “akan benar-benar luluh” atau “pasti kehilangan keberanian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן חַיִל
  choice: orang gagah berani
  rationale: Ungkapan harfiah 'anak kekuatan/keperkasaan' menunjuk kepada seorang yang bercirikan keberanian dan kecakapan tempur. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal.
- source_word: לִבּוֹ כְּלֵב הָאַרְיֵה
  choice: yang hatinya seperti hati singa
  rationale: Mempertahankan perumpamaan dan gambaran singa dari teks Ibrani tanpa memadatkannya menjadi kata sifat.
- source_word: הִמֵּס יִמָּס
  choice: akan benar-benar tawar hati
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. 'Tawar hati' menyampaikan secara alami metafora luluhnya keberanian, sedangkan 'benar-benar' mempertahankan penekanannya.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi pernyataan sebelumnya.
- source_word: יֹדֵעַ כָּל יִשְׂרָאֵל
  choice: seluruh Israel tahu
  rationale: Menyampaikan pengetahuan umum yang sudah mapan secara lugas dan alami.
- source_word: גִבּוֹר
  choice: seorang pahlawan
  rationale: Dalam konteks militer, kata ini menggambarkan Daud sebagai pejuang yang perkasa. 'Pahlawan' mempertahankan daya nominalnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: וּבְנֵי חַיִל
  choice: orang-orang gagah berani
  rationale: Mempertahankan hubungan leksikal dengan bentuk tunggal בֶּן חַיִל sebelumnya serta menyatakan keberanian dan kecakapan para pengikut Daud.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertainya
  rationale: Ungkapan relatif ini secara ringkas dan alami menjelaskan orang-orang yang berada bersama Daud.
