base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/021.yaml
  text: After they had gone, they came up out of the well and went and told King David. They said to David, “Get up and cross over the water quickly, for this is what Ahithophel has advised against you.”
translation:
  language: id
  text: Setelah mereka pergi, mereka keluar dari sumur itu lalu pergi dan memberitahukannya kepada Raja Daud. Mereka berkata kepada Daud, “Bangunlah dan segeralah menyeberangi air itu, sebab demikianlah Ahitofel telah memberi nasihat untuk melawan kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי לֶכְתָּם
  choice: Setelah mereka pergi
  rationale: Menerjemahkan ungkapan waktu secara langsung dan alami; ‘mereka’ merujuk kepada orang-orang yang baru saja meninggalkan lokasi dalam konteks sebelumnya.
- source_word: וַיַּעֲלוּ מֵהַבְּאֵר
  choice: keluar dari sumur itu
  rationale: Secara harfiah berarti ‘naik dari sumur’; dalam bahasa Indonesia, ‘keluar dari sumur’ lebih alami dan tetap menyampaikan gerakan dari dalam ke luar.
- source_word: קוּמוּ
  choice: Bersiaplah
  rationale: Imperatif jamak harfiah ‘bangkitlah’; dalam konteks perintah untuk segera bergerak, ‘bersiaplah’ terdengar alami tanpa melemahkan desakan.
- source_word: אֶת־הַמַּיִם
  choice: sungai
  rationale: Secara harfiah ‘air itu’; konteks pelarian Daud menunjuk pada Sungai Yordan, sehingga ‘sungai’ mengungkapkan referen geografis tanpa harus menambahkan nama yang tidak terdapat dalam ayat.
- source_word: כָּכָה יָעַץ עֲלֵיכֶם
  choice: beginilah nasihat Ahitofel untuk mencelakakan kalian
  rationale: עַל dalam konteks permusuhan bermakna nasihat atau rancangan yang ditujukan melawan Daud dan para pengikutnya; ‘untuk mencelakakan’ menyampaikan daya adversatifnya secara jelas.
theological_decisions:
- issue: Sifat nasihat Ahitofel terhadap Daud
  choice: untuk mencelakakan kalian
  alternative: terhadap kalian / melawan kalian
  rationale: Teks menggambarkan nasihat yang bermusuhan, bukan nasihat yang diberikan demi kepentingan Daud. Pilihan ini mempertahankan arah permusuhan tanpa memasukkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama Yonatan dan Ahimaas dieksplisitkan dari konteks dekat untuk menghindari rujukan pronominal yang kabur dalam bahasa Indonesia; bentuk jamak ‘kalian’ mempertahankan bahwa perintah dan ancaman ditujukan kepada Daud beserta rombongannya.
