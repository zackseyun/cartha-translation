base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/003.yaml
  text: and I will bring back all the people to you[a], as when all return, the man whom you seek will be gone; all the people will be at peace.
translation:
  language: id
  text: Aku akan membawa seluruh rakyat kembali kepadamu.[a] Setelah orang yang kaucari itu disingkirkan, semua orang akan kembali; seluruh rakyat akan hidup dalam damai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada klausa ini sulit dan eliptis; secara harfiah kira-kira, “seperti kembalinya semua, orang yang kaucari.” Dalam konteksnya, maksudnya tampaknya bahwa penyingkiran satu orang yang dicari itu akan memungkinkan semua orang lainnya kembali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָשִׁיבָה
  choice: Aku akan membawa ... kembali
  rationale: 'Bentuk hifil dari שׁוב bersifat kausatif: pembicara akan menyebabkan rakyat kembali, bukan sekadar kembali sendiri.'
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עָם berarti ‘rakyat’ atau ‘bangsa’; dalam konteks ini ‘seluruh rakyat’ mempertahankan cakupan umum tanpa mempersempitnya menjadi tentara.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Menyatakan arah kembalinya rakyat kepada Absalom dengan bentuk Indonesia yang alami.
- source_word: כְּשׁוּב הַכֹּל
  choice: Ketika semua orang kembali
  rationale: Frasa Ibrani ini sulit dan eliptis. Terjemahan ini mempertahankan gagasan kembalinya semua orang tanpa menjadikan salah satu rekonstruksi sintaksis sebagai kepastian.
- source_word: הָאִישׁ אֲשֶׁר אַתָּה מְבַקֵּשׁ
  choice: orang yang kaucari itu
  rationale: Mempertahankan acuan tunggal dan tertentu kepada orang yang menjadi sasaran, yaitu Daud dalam konteks.
- source_word: יִהְיֶה שָׁלוֹם
  choice: akan hidup dalam damai
  rationale: שָׁלוֹם di sini menunjuk pada keadaan damai dan sejahtera setelah konflik berakhir; ungkapan ini alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara kematian orang yang dicari dan kembalinya rakyat
  choice: orang yang kaucari itu tidak akan ada lagi
  alternative: kembalinya semua orang adalah seperti orang yang kaucari
  rationale: Teks Ibrani sangat eliptis. Konteks ayat sebelumnya menunjukkan bahwa Ahitofel bermaksud membunuh Daud seorang diri lalu membawa rakyat kembali. Terjemahan menyampaikan implikasi konteks itu, sementara catatan kaki menjaga ketidakpastian bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Rakyat’ dipilih untuk עָם, sedangkan bentuk ‘kaucari’ menjaga kelancaran tuturan langsung. Ambiguitas sintaksis Ibrani dijelaskan dalam catatan kaki.
