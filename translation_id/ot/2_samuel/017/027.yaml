  text: וַ/יְהִ֕י כְּ/ב֥וֹא דָוִ֖ד מַחֲנָ֑יְמָ/ה וְ/שֹׁבִ֨י בֶן נָחָ֜שׁ מֵ/רַבַּ֣ת בְּנֵֽי עַמּ֗וֹן וּ/מָכִ֤יר בֶּן עַמִּיאֵל֙ מִ/לֹּ֣א דְבָ֔ר וּ/בַרְזִלַּ֥י הַ/גִּלְעָדִ֖י מֵ/רֹגְלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/027.yaml
  text: When David came to Mahanaim, Shobi son of Nahash from Rabbah of the Ammonites, and Machir son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim,
translation:
  language: id
  text: Ketika Daud tiba di Mahanaim, Sobi anak Nahas dari Raba, kota bani Amon, Makhir anak Amiel dari Lo-Debar, dan Barzilai, orang Gilead dari Rogelim,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: Ketika ... tiba
  rationale: Bentuk naratif וַיְהִי mengantar perkembangan baru, sedangkan כ dengan infinitif בוא menyatakan waktu. Dalam bahasa Indonesia, “Ketika ... tiba” menyampaikan hubungan temporal secara alami tanpa penanda wacana tambahan yang tidak eksplisit.
- source_word: מַחֲנָיְמָה
  choice: di Mahanaim
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mahanaim. Dengan verba “tiba”, preposisi Indonesia yang alami ialah “di”.
- source_word: שֹׁבִי בֶן נָחָשׁ
  choice: Sobi anak Nahas
  rationale: Nama diri ditransliterasikan sesuai bentuk Indonesia yang lazim, dan patronimik בן diterjemahkan secara langsung sebagai “anak”.
- source_word: מֵרַבַּת בְּנֵי עַמּוֹן
  choice: dari Raba, kota bani Amon
  rationale: Rabat/Raba adalah nama kota, sedangkan בני עמון merupakan sebutan etnis-politis. Penambahan generik “kota” memperjelas hubungan nama tempat tanpa mengubah acuannya.
- source_word: מָכִיר בֶן עַמִּיאֵל
  choice: Makhir anak Amiel
  rationale: Nama diri ditransliterasikan dan konstruksi patronimik dipertahankan.
- source_word: מִלֹּא דְבָר
  choice: dari Lo-Debar
  rationale: Nama tempat ditransliterasikan dengan tanda hubung agar kedua unsurnya terbaca sebagai satu nama.
- source_word: בַרְזִלַּי הַגִּלְעָדִי
  choice: Barzilai, orang Gilead
  rationale: Adjektiva gentilik הַגִּלְעָדִי menyatakan asal atau identitas wilayah; “orang Gilead” alami dan jelas dalam bahasa Indonesia.
- source_word: מֵרֹגְלִים
  choice: dari Rogelim
  rationale: Nama tempat ditransliterasikan dan preposisi sumber מ diterjemahkan sebagai “dari”.
