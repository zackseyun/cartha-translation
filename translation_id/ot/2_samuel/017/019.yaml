  text: Then the woman took a covering and spread it over the mouth of the well[a], and scattered crushed grain on it[b], and the matter was not known.
translation:
  language: id
  text: Lalu perempuan itu mengambil sebuah penutup dan membentangkannya di atas mulut sumur. Ia menghamparkan biji-bijian yang ditumbuk di atasnya[a], dan tidak ada hal apa pun yang diketahui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biji-bijian yang diremukkan”; istilah Ibrani ini mengacu pada hasil biji-bijian yang ditumbuk atau diremukkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan tidak ada sesuatu pun yang diketahui.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: אִשָּׁה dapat berarti ‘perempuan’ atau ‘istri’. Dalam konteks ini yang dimaksud ialah perempuan pemilik rumah yang sudah disebutkan, sehingga ‘perempuan itu’ paling alami dan tidak menambahkan penafsiran.
- source_word: הַמָּסָךְ
  choice: sebuah penutup
  rationale: מָסָךְ menunjuk pada penutup, tirai, atau tabir. ‘Sebuah penutup’ sesuai dengan fungsi benda itu dalam penyamaran tanpa menentukan bahannya.
- source_word: עַל פְּנֵי הַבְּאֵר
  choice: di atas mulut sumur
  rationale: Ungkapan ini secara harfiah berarti ‘di atas permukaan/wajah sumur’; dalam bahasa Indonesia, ‘mulut sumur’ secara alami menunjuk pada lubang sumur yang ditutupi.
- source_word: וַתִּשְׁטַח
  choice: menghamparkan
  rationale: Verba שׁטח berarti membentangkan atau menghamparkan. ‘Menghamparkan’ menggambarkan tindakan menyebarkan bahan pangan itu di atas penutup.
- source_word: הָרִפוֹת
  choice: gandum tumbuk
  rationale: רִפוֹת mengacu pada biji-bijian yang ditumbuk atau diremukkan. ‘Gandum tumbuk’ mudah dipahami dan mempertahankan gambaran hasil pertanian dalam adegan ini.
- source_word: וְלֹא נוֹדַע דָּבָר
  choice: dan tidak ada sesuatu pun yang diketahui
  rationale: Terjemahan ini mempertahankan konstruksi pasif dan sambungan sederhana dengan וְ, tanpa mengubahnya menjadi hubungan tujuan atau akibat yang tidak dinyatakan secara eksplisit.
