  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan tindakan serta konstruksi pasif pada klausa terakhir dipertahankan, sementara ungkapan ruang dialihkan secara idiomatis menjadi ‘mulut sumur’.
