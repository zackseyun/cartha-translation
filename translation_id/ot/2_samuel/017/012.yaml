  to: Lalu kita akan mendatanginya di salah satu tempat ia ditemukan, dan kita akan menetap di atasnya seperti embun jatuh ke tanah. Tidak seorang pun akan tersisa darinya ataupun dari semua orang yang bersamanya—bahkan seorang pun tidak.
