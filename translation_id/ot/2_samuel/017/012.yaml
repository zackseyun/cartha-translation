    text: Atau "hinggap padanya." Kata Ibrani itu secara harfiah berarti "menetap" atau "beristirahat"; dalam gambaran militer ini, kata tersebut menggambarkan serangan yang menutupi lawan secara menyeluruh.
    reason: lexical_alternative
