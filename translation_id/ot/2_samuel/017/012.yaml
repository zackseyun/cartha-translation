review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada umumnya menangkap rangkaian rencana penyerangan, citra embun, dan penegasan bahwa tidak ada yang tersisa. Namun, "dibiarkan hidup" lebih sempit dan lebih kausatif daripada נוֹתַר, "tersisa/tinggal."
  naturalness: Kalimat pembuka dan perbandingan embun cukup alami. Klausa terakhir lebih lancar dan langsung dalam bahasa Indonesia bila memakai "tersisa" serta "bersamanya," bukan "Dari dia ... yang menyertainya."
  terminology: '"Meliputinya" secara kontekstual dapat menyampaikan cakupan menyeluruh, tetapi kurang mempertahankan makna dasar נוּחַ, "menetap/hinggap." "Menetap di atasnya" mempertahankan perbedaan yang disengaja dari יִפֹּל, "jatuh," dalam perumpamaan embun. Catatan kaki perlu menyajikan alternatif itu tanpa mengklaim makna yang melampaui teks.'
  issues:
  - severity: medium
    issue: '"tidak seorang pun akan dibiarkan hidup" untuk וְלֹא נוֹתַר'
    rationale: Bentuk Nifal יתר berarti "tidak akan tersisa/tinggal." Walaupun konteksnya kekalahan mematikan, "dibiarkan hidup" menambahkan gagasan tindakan mengizinkan dan membatasi makna pada hidup.
  - severity: low
    issue: '"meliputinya" untuk וְנַחְנוּ עָלָיו'
    rationale: Pilihan ini masuk akal secara kontekstual, tetapi menggeser verba "menetap/beristirahat pada" menjadi hasil cakupan. Terjemahan utama dapat mempertahankan verba tersebut, sementara catatan menjelaskan daya gambarnya.
  revised_text: Lalu kita akan mendatanginya di salah satu tempat ia ditemukan, dan kita akan menetap di atasnya seperti embun jatuh ke tanah. Tidak seorang pun akan tersisa darinya ataupun dari semua orang yang bersamanya—bahkan seorang pun tidak.
  revised_footnotes:
