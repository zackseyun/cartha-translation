  text: וּ/בָ֣אנוּ אֵלָ֗י/ו ב/אחת הַ/מְּקוֹמֹת֙ אֲשֶׁ֣ר נִמְצָ֣א שָׁ֔ם וְ/נַ֣חְנוּ עָלָ֔י/ו כַּ/אֲשֶׁ֛ר יִפֹּ֥ל הַ/טַּ֖ל עַל הָ/אֲדָמָ֑ה וְ/לֹֽא נ֥וֹתַר בּ֛/וֹ וּ/בְ/כָל הָ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ גַּם אֶחָֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/012.yaml
  text: Then we will come upon him in one of the places where he is found[a], and we will settle on him just as the dew falls on the ground; and not one will be left of him and of all the men who are with him—not even one.
translation:
  language: id
  text: Lalu kita akan mendatanginya di salah satu tempat ia ditemukan, dan kita akan menetap di atasnya seperti embun jatuh ke tanah. Tidak seorang pun akan tersisa darinya ataupun dari semua orang yang bersamanya—bahkan seorang pun tidak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאנוּ אֵלָיו
  choice: Lalu kita akan mendatanginya
  rationale: בוא dengan אֶל pada konteks rencana penyerangan menyatakan gerak mendekati sasaran dengan maksud bermusuhan. 'Mendatanginya' mempertahankan verba gerak tanpa menambahkan verba serangan yang tidak tersurat.
- source_word: בְאַחַת הַמְּקוֹמוֹת אֲשֶׁר נִמְצָא שָׁם
  choice: di salah satu tempat ia ditemukan
  rationale: Terjemahan ini mempertahankan bentuk pasif נִמְצָא serta cakupan tak tentu 'salah satu tempat', tanpa menambahkan modalitas.
- source_word: וְנַחְנוּ עָלָיו
  choice: dan kita akan meliputinya
  rationale: נוּחַ secara harfiah berarti beristirahat, menetap, atau hinggap di atas. Dalam perumpamaan militer dengan embun, 'meliputinya' menyampaikan cakupan yang menyeluruh secara alami sambil tidak menyamakan verba ini dengan נפל, 'jatuh', pada klausa berikutnya.
- source_word: כַּאֲשֶׁר יִפֹּל הַטַּל עַל הָאֲדָמָה
  choice: seperti embun jatuh ke tanah
  rationale: Mempertahankan citra dan verba נפל secara langsung serta menghasilkan ungkapan Indonesia yang alami.
- source_word: וְלֹא נוֹתַר בּוֹ וּבְכָל הָאֲנָשִׁים אֲשֶׁר אִתּוֹ גַּם אֶחָד
  choice: Dari dia dan semua orang yang menyertainya, tidak seorang pun akan dibiarkan hidup—seorang pun tidak
  rationale: יתר dalam bentuk Nifal berarti tersisa atau bertahan. Dalam konteks pemusnahan pasukan, 'dibiarkan hidup' menyatakan akibat yang dimaksud; pengulangan 'seorang pun tidak' mempertahankan tekanan גַּם אֶחָד.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kita' dipakai karena pembicara mengikutsertakan para pendengarnya dalam rencana. Citra embun dipertahankan, demikian pula perbedaan antara נוח ('menetap/hinggap') dan נפל ('jatuh').
