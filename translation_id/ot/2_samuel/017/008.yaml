base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/008.yaml
  text: Hushai said[a], “You know your father and his men, that they are mighty men and bitter of soul, like a bear robbed of her cubs in the field. And your father is a man of war[b]; he will not spend the night with the troops.”
translation:
  language: id
  text: Husai berkata, “Engkau mengenal ayahmu dan orang-orangnya. Mereka adalah orang-orang perkasa dan sangat garang[a], seperti beruang betina di padang yang kehilangan anak-anaknya. Ayahmu juga seorang pejuang, dan ia tidak akan bermalam bersama pasukan itu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “getir jiwa”; dapat juga diterjemahkan “ganas” atau “pahit hati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ia tidak akan bermalam bersama rakyat itu.” Dalam konteks ini, “rakyat” kemungkinan menunjuk pada pasukan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִבֹּרִים
  choice: orang-orang perkasa
  rationale: Menyatakan kekuatan dan keberanian, khususnya dalam konteks pertempuran, tanpa mempersempitnya menjadi jabatan militer tertentu.
- source_word: מָרֵי נֶפֶשׁ
  choice: hati mereka getir
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang kepahitan batin yang dalam, yang dalam konteks ini menyiratkan keganasan dan kemarahan.
- source_word: כְּדֹב שַׁכּוּל
  choice: seperti beruang betina ... yang kehilangan anak-anaknya
  rationale: Menyampaikan gambaran induk beruang yang menjadi sangat berbahaya karena kehilangan anak-anaknya; bentuk betina dibuat jelas secara wajar dalam bahasa Indonesia.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: Padanan lokatif yang langsung dan alami untuk kawasan terbuka.
- source_word: אִישׁ מִלְחָמָה
  choice: seorang pejuang
  rationale: Menggambarkan Daud sebagai orang yang terampil dan berpengalaman dalam peperangan dengan ungkapan Indonesia yang alami.
- source_word: לֹא יָלִין אֶת־הָעָם
  choice: ia tidak akan bermalam bersama pasukan itu
  rationale: Kata kerja berarti bermalam atau menginap; dalam konteks militer, הָעָם paling wajar menunjuk pada pasukan yang menyertai Daud. Ungkapan bersama mempertahankan pemahaman kontekstual atas אֶת.
- source_word: יָדַעְתָּ
  choice: Engkau mengenal
  rationale: Dalam konteks ini yang dimaksud bukan sekadar mengetahui fakta, melainkan mengenal watak dan kemampuan ayah serta orang-orangnya.
- source_word: אֲנָשָׁיו
  choice: orang-orangnya
  rationale: Mempertahankan keluasan ungkapan Ibrani sambil membiarkan konteks menunjukkan bahwa mereka adalah para pengikut yang bertempur bersama Daud.
