lexical_decisions:
- source_word: וַיִּחַן
  choice: berkemah
  rationale: Kata kerja חנה dalam bentuk wayyiqtol menyatakan tindakan mendirikan atau menempati perkemahan; “berkemah” alami dalam bahasa Indonesia modern dan sesuai dengan konteks militer.
- source_word: יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Nama “Israel” di sini dipakai secara kolektif bagi pasukan atau rakyat Israel yang bersama Absalom. “Orang Israel” menyampaikan fungsi kolektif itu secara alami tanpa menambahkan penafsiran khusus tentang pasukan.
- source_word: וְאַבְשָׁלֹם
  choice: dan Absalom
  rationale: Konjungsi menghubungkan Absalom dengan Israel sebagai subjek gabungan, sementara nama tokoh dipertahankan dalam bentuk Indonesia yang lazim.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: wilayah Gilead
  rationale: Frasa אֶרֶץ diikuti nama tempat dapat berarti tanah atau wilayah suatu daerah. “Wilayah Gilead” jelas dan idiomatis dalam bahasa Indonesia serta mempertahankan cakupan geografisnya.
