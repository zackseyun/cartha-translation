  text: וַ/יַּ֤רְא אֹתָ/ם֙ נַ֔עַר וַ/יַּגֵּ֖ד לְ/אַבְשָׁלֹ֑ם וַ/יֵּלְכוּ֩ שְׁנֵי/הֶ֨ם מְהֵרָ֜ה וַ/יָּבֹ֣אוּ אֶל בֵּֽית אִ֣ישׁ בְּ/בַחוּרִ֗ים וְ/ל֥/וֹ בְאֵ֛ר בַּ/חֲצֵר֖/וֹ וַ/יֵּ֥רְדוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/018.yaml
  text: But a young man saw them and told Absalom[a], so the two of them went quickly and came to the house of a man in Bahurim, who had a well in his courtyard, and they went down there.
translation:
  language: id
  text: Namun, seorang pemuda melihat mereka lalu memberi tahu Absalom. Karena itu, mereka berdua segera pergi dan tiba di rumah seorang laki-laki di Bahurim. Di halaman rumahnya ada sebuah sumur, dan mereka turun ke sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “turun ke dalam sumur itu.”
    reason: Ungkapan Ibrani secara harfiah berbunyi “turun ke sana,” tetapi tempat yang dimaksud dalam konteks dapat dinyatakan secara eksplisit sebagai sumur.
lexical_decisions:
- source_word: נַעַר
  choice: seorang pemuda
  rationale: Kata ini dapat menunjuk kepada anak laki-laki, pemuda, atau pelayan. Dalam konteks ini, ia bertindak cukup mandiri untuk mengamati dan melapor, sehingga “pemuda” paling wajar tanpa memastikan usia atau statusnya.
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti menyampaikan atau melaporkan sesuatu. “Memberi tahu” alami dalam bahasa Indonesia modern dan sesuai dengan konteks.
- source_word: שְׁנֵיהֶם
  choice: mereka berdua
  rationale: Ungkapan Ibrani secara tegas menyatakan bahwa yang dimaksud adalah dua orang.
- source_word: מְהֵרָה
  choice: segera
  rationale: Kata ini menyatakan tindakan yang dilakukan dengan cepat atau tergesa-gesa. “Segera” menyampaikan desakan situasi dengan lancar.
- source_word: בֵּית אִישׁ
  choice: rumah seorang laki-laki
  rationale: Terjemahan ini mempertahankan ketidakpastian identitas orang tersebut dan mengikuti konstruksi Ibrani secara alami.
- source_word: בְּבַחוּרִים
  choice: di Bahurim
  rationale: Bahurim adalah nama tempat; preposisi lokasi paling alami diterjemahkan “di”.
- source_word: בְאֵר
  choice: sumur
  rationale: Makna lazim בְּאֵר adalah sumur. Walaupun “perigi” mungkin, “sumur” lebih umum dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: בַּחֲצֵרוֹ
  choice: di halaman rumahnya
  rationale: חָצֵר menunjuk pada halaman atau area tertutup yang terkait dengan rumah. “Halaman rumah” lebih alami bagi pembaca Indonesia daripada “pelataran” atau “halaman dalam” yang dapat terlalu spesifik.
- source_word: וַיֵּרְדוּ שָׁם
  choice: mereka turun ke sana
  rationale: Teks Ibrani secara harfiah menyebut “ke sana,” bukan secara eksplisit “ke dalam sumur itu.” Terjemahan ini mempertahankan sedikit keimplisitan sumber, sementara konteks menunjukkan tempat yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” menandai perkembangan yang berlawanan dengan upaya sebelumnya agar mereka tidak terlihat, sedangkan kalimat dipecah untuk menjaga kejelasan tanpa mengubah urutan peristiwa.
