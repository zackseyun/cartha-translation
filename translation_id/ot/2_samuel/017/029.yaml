base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/029.yaml
  text: and honey and curds and sheep and cheese from the herd they brought near for David and for the people who were with him to eat[a], for they said[c][b], “The people are hungry and weary and thirsty in the wilderness.”
translation:
  language: id
  text: Mereka juga membawa madu, dadih[a], ternak kecil[b], dan keju dari susu sapi[c] kepada Daud serta kepada orang-orang yang bersamanya untuk dimakan. Sebab mereka berkata, “Orang-orang itu lapar, lelah, dan haus di padang belantara.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mentega”. Kata Ibrani ini dapat menunjuk secara lebih umum kepada hasil olahan susu; dalam konteks ini kemungkinan besar yang dimaksud adalah dadih, bukan mentega modern.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, kata Ibrani ini adalah sebutan kolektif untuk ternak kecil dan dapat mencakup domba maupun kambing.
    reason: lexical_alternative
  - marker: c
    text: Arti tepat ungkapan Ibrani ini tidak pasti. Tampaknya yang dimaksud adalah hasil olahan susu dari ternak sapi, kemungkinan keju.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַשׁ
  choice: madu
  rationale: Makna lazim kata ini adalah madu; meskipun dapat mencakup cairan manis seperti sirop dalam konteks tertentu, 'madu' paling wajar dalam daftar perbekalan ini.
- source_word: חֶמְאָה
  choice: dadih
  rationale: Istilah ini menunjuk pada hasil olahan susu dan dalam konteks kuno lebih mungkin berupa susu yang dikentalkan atau diasamkan daripada mentega modern.
- source_word: צֹאן
  choice: kambing domba
  rationale: Nomina kolektif ini dapat mencakup domba dan kambing; 'kambing domba' mempertahankan cakupan yang lebih luas daripada hanya 'domba'.
- source_word: שְׁפוֹת בָּקָר
  choice: keju dari susu sapi
  rationale: Ungkapan Ibrani yang langka ini tampaknya menunjuk pada hasil olahan susu ternak besar. Terjemahan ini konkret dan alami, sambil menandai ketidakpastian leksikal dalam catatan kaki.
- source_word: הִגִּישׁוּ
  choice: mereka bawa kepada
  rationale: Dalam konteks penyediaan makanan, verba kausatif ini secara alami berarti membawa atau menyajikan kepada seseorang; 'mereka bawa kepada' jelas dalam bahasa Indonesia modern.
- source_word: לְדָוִד וְלָעָם אֲשֶׁר אִתּוֹ
  choice: kepada Daud dan rakyat yang menyertainya
  rationale: Mempertahankan kedua penerima dan klausa relatif dengan susunan Indonesia yang wajar.
- source_word: לֶאֱכֹל
  choice: untuk dimakan
  rationale: Infinitif ini menyatakan tujuan; bentuk pasif idiomatis karena makanan tersebut dibawa sebagai santapan bagi Daud dan rombongannya.
- source_word: כִּי אָמְרוּ
  choice: Sebab, kata mereka
  rationale: כִּי memberi alasan bagi tindakan sebelumnya, sedangkan אָמְרוּ memperkenalkan ucapan langsung.
- source_word: רָעֵב וְעָיֵף וְצָמֵא
  choice: lapar, lelah, dan haus
  rationale: Mempertahankan tiga keadaan secara lugas dan berirama tanpa menambah intensitas yang tidak tersurat.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר dapat menunjuk daerah liar atau tandus yang jarang dihuni, bukan semata-mata gurun pasir; 'padang belantara' mempertahankan keluasan itu.
