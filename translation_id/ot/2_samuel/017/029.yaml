  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat. Pengulangan konjungsi Ibrani dalam daftar diringkas menurut kaidah alami bahasa Indonesia, sedangkan triad 'lapar, lelah, dan haus' dipertahankan. 'Rakyat' dipilih untuk עָם dalam konteks rombongan Daud.
