  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּ֨ה עַתָּ֤ה הֽוּא נֶחְבָּא֙ בְּ/אַחַ֣ת הַ/פְּחָתִ֔ים א֖וֹ בְּ/אַחַ֣ד הַ/מְּקוֹמֹ֑ת וְ/הָיָ֗ה כִּ/נְפֹ֤ל בָּ/הֶם֙ בַּ/תְּחִלָּ֔ה וְ/שָׁמַ֤ע הַ/שֹּׁמֵ֨עַ֙ וְ/אָמַ֔ר הָֽיְתָה֙ מַגֵּפָ֔ה בָּ/עָ֕ם אֲשֶׁ֖ר אַחֲרֵ֥י אַבְשָׁלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/009.yaml
  text: Look[a], right now he is hidden in one of the pits or in one of the other places. And when some of them fall at the first attack, whoever hears it will say[b], ‘There has been a slaughter among the people who follow Absalom.’
translation:
  language: id
  text: Lihat, saat ini ia sedang bersembunyi di salah satu lubang[a] atau di suatu tempat lain. Ketika beberapa orang dari mereka gugur dalam serangan pertama, siapa pun yang mendengarnya akan berkata, “Telah terjadi pembantaian[b] di antara pasukan yang mengikuti Absalom.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cekungan.” Kata Ibrani ini dapat menunjuk pada lubang, cekungan, atau tempat persembunyian serupa di medan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kekalahan besar” atau “pukulan hebat.” Kata Ibrani ini di sini menunjuk pada jatuhnya korban dalam pertempuran, bukan wabah penyakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה עַתָּה
  choice: Lihat, saat ini
  rationale: Ungkapan ini menarik perhatian secara hidup sekaligus menekankan keadaan yang sedang berlangsung dengan segera.
- source_word: נֶחְבָּא
  choice: sedang bersembunyi
  rationale: Partisipel Nifal menggambarkan keadaan tersembunyi; pilihan ini wajar dalam bahasa Indonesia dan tidak menambahkan lokasi atau cara persembunyiannya.
- source_word: בְּאַחַת הַפְּחָתִים
  choice: di salah satu lubang
  rationale: פְּחָתִים dapat menunjuk pada lubang atau cekungan di medan yang dapat dijadikan tempat persembunyian.
- source_word: בְּאַחַד הַמְּקוֹמֹת
  choice: di suatu tempat lain
  rationale: Kata 'lain' menyatakan alternatif yang diperkenalkan oleh אוֹ tanpa menentukan jenis tempatnya.
- source_word: כִּנְפֹל בָּהֶם בַּתְּחִלָּה
  choice: ketika beberapa orang dari mereka gugur dalam serangan pertama
  rationale: Dalam konteks pertempuran, ungkapan ini menunjuk pada jatuhnya korban di antara kelompok tersebut pada bentrokan awal; subjek individualnya tetap tidak ditentukan.
- source_word: הַשֹּׁמֵעַ
  choice: siapa pun yang mendengarnya
  rationale: Partisipel berartikel ini bersifat umum dan paling alami diterjemahkan sebagai siapa pun yang menerima kabar itu.
- source_word: מַגֵּפָה
  choice: pembantaian
  rationale: Dalam konteks militer, kata ini berarti pukulan berat atau penumpasan yang menimbulkan korban, bukan wabah penyakit.
- source_word: הָעָם אֲשֶׁר אַחֲרֵי אַבְשָׁלֹם
  choice: pasukan yang mengikuti Absalom
  rationale: אַחֲרֵי menyatakan keberpihakan atau kepengikutan; dalam konteks ini הָעָם adalah orang-orang yang menjadi kekuatan tempur Absalom.
