  register: Bahasa Indonesia baku modern dengan nada naratif-militer yang lugas dan bermartabat. Istilah 'pasukan' dipakai untuk menjelaskan fungsi kontekstual הָעָם tanpa memasukkan rincian organisasi militer yang tidak ada dalam teks.
