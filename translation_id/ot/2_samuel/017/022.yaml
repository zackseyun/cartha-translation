base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/022.yaml
  text: Then David arose[a], and all the people who were with him, and they crossed the Jordan. By morning light, not one was missing who had not crossed the Jordan.
translation:
  language: id
  text: Kemudian Daud bangkit bersama semua orang yang bersamanya, lalu mereka menyeberangi Sungai Yordan. Hingga fajar menyingsing[a], tidak ada seorang pun yang belum menyeberangi Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjelang fajar.” Secara harfiah, ungkapan Ibrani berarti “hingga cahaya pagi” dan menunjukkan batas waktu selesainya penyeberangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד
  choice: Kemudian Daud bangkit
  rationale: Bentuk naratif קום menyatakan bahwa Daud bangkit untuk bertindak. “Bangkit” mempertahankan arti dasar verba dan tetap wajar dalam ragam narasi yang bermartabat.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: bersama seluruh rakyat yang menyertainya
  rationale: הָעָם menunjuk kepada seluruh kelompok yang bersama Daud, bukan hanya laki-laki dewasa. Susunan ini menggabungkan subjek-subjek verba “bangkit” secara alami dalam bahasa Indonesia.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: lalu mereka menyeberangi Sungai Yordan
  rationale: עבר dengan objek langsung יַרְדֵּן berarti menyeberangi Yordan. Penambahan “Sungai” memberi kejelasan geografis yang alami tanpa mengubah acuannya.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Ketika pagi mulai terang
  rationale: Ungkapan ini mempertahankan citra אוֹר, “terang/cahaya,” sekaligus menyatakan waktu saat penyeberangan telah selesai. Nuansa batas waktu juga dapat dipahami sebagai “menjelang fajar,” sehingga alternatif itu dicatat.
- source_word: עַד אַחַד לֹא נֶעְדָּר אֲשֶׁר לֹא עָבַר
  choice: tidak seorang pun didapati belum menyeberangi
  rationale: Susunan Ibrani menegaskan secara negatif bahwa tidak ada satu orang pun yang gagal menyeberang. “Didapati belum” menyampaikan gagasan נֶעְדָּר dan klausa relatif negatif secara alami tanpa mengubahnya menjadi pernyataan positif semata.
