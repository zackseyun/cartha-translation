  yaml_path: translation/ot/2_samuel/017/004.yaml
  text: The proposal seemed good in the eyes of Absalom and in the eyes of all the elders of Israel[a].
translation:
  language: id
  text: Usul itu dipandang baik oleh Absalom dan oleh semua tua-tua Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Perkara itu dianggap tepat oleh Absalom dan oleh semua tua-tua Israel.”
    reason: Menampilkan alternatif leksikal yang lebih dekat kepada bentuk umum הַדָּבָר dan kemungkinan nuansa 'tepat' pada וַיִּישַׁר, tanpa menyiratkan bahwa usul tersebut benar secara moral.
lexical_decisions:
- source_word: וַיִּישַׁר
  choice: dipandang baik
  rationale: Dalam konstruksi dengan בְּעֵינֵי, verba ישר di sini menyatakan penilaian bahwa sesuatu dianggap baik atau berkenan, bukan bahwa hal itu benar secara moral.
- source_word: הַדָּבָר
  choice: usul itu
  rationale: Dalam konteks narasi, kata ini menunjuk pada nasihat atau rencana yang baru saja diajukan; 'usul itu' menyampaikan acuannya secara alami dan jelas.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: oleh ... dan oleh
  rationale: Ungkapan Ibrani harfiah 'di mata' menyatakan penilaian atau persetujuan. Bentuk pasif 'dipandang baik oleh' mempertahankan makna evaluatifnya dalam bahasa Indonesia yang alami, sedangkan pengulangan 'oleh' mencerminkan kesejajaran sumber.
- source_word: אַבְשָׁלֹם
  choice: Absalom
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Menerjemahkan kuantor secara langsung dan wajar.
- source_word: זִקְנֵי
  choice: tua-tua
  rationale: Menunjuk kepada para pemimpin atau anggota dewan yang diakui, bukan sekadar orang-orang lanjut usia; 'tua-tua' merupakan istilah alkitabiah yang mapan dan dapat dipahami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mengikuti bentuk baku nama bangsa tersebut dalam bahasa Indonesia.
theological_decisions: []
