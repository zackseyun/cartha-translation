  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan memakai bentuk idiomatis 'dipandang baik' alih-alih mempertahankan secara harfiah ungkapan 'di mata', serta mempertahankan kesejajaran kedua pihak yang menyetujui.
