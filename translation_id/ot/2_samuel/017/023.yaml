base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/023.yaml
  text: When Ahithophel saw that his counsel had not been followed[a], he saddled the donkey, arose, and went to his house in his city. He gave orders to his household, then hanged himself and died[c][b]; and he was buried in his father's tomb.
translation:
  language: id
  text: Ketika Ahitofel melihat bahwa nasihatnya tidak dilaksanakan[a], ia memasang pelana pada keledai itu, lalu bangkit dan pergi ke rumahnya di kotanya. Ia memberi perintah kepada seisi rumahnya[b], kemudian menggantung diri[c] dan mati. Ia dikuburkan dalam makam ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “nasihatnya tidak dilakukan.” Dapat juga diterjemahkan “nasihatnya tidak dituruti.”'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga dipahami: “Ia mengatur urusan rumahnya.” Bahasa Ibrani secara lebih harfiah mengatakan bahwa ia memberi perintah kepada rumahnya, yaitu seisi rumahnya.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “mencekik diri.” Verba Ibrani dapat menggambarkan kematian karena tergantung atau tercekik; dalam konteks ini tindakan itu merupakan bunuh diri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצָתוֹ
  choice: nasihatnya
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, atau rencana. Dalam konteks keputusan politik dan militer ini, “nasihatnya” mempertahankan sifatnya sebagai saran strategis.
- source_word: לֹא נֶעֶשְׂתָה
  choice: tidak dilaksanakan
  rationale: Secara harfiah berarti “tidak dilakukan.” “Tidak dilaksanakan” secara wajar menyatakan bahwa nasihat Ahitofel tidak diwujudkan, tanpa mempersempitnya hanya pada tindakan mendengarkan atau menerima.
- source_word: וַיַּחֲבֹשׁ אֶת־הַחֲמוֹר
  choice: ia memasang pelana pada keledai itu
  rationale: חבש dalam kaitannya dengan keledai berarti memasang pelana atau menyiapkannya untuk ditunggangi. Artikel tentu pada הַחֲמוֹר dipertahankan sebagai “keledai itu”; teks tidak memakai sufiks posesif.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: lalu berangkat
  rationale: Gabungan verba naratif “bangkit lalu pergi” secara alami dapat dinyatakan “berangkat” dalam bahasa Indonesia, tanpa mengubah arah perjalanan yang dijelaskan sesudahnya.
- source_word: אֶל־בֵּיתוֹ אֶל־עִירוֹ
  choice: pulang ke rumahnya di kotanya
  rationale: Dua frasa tujuan menunjuk rumahnya dan kota tempat rumah itu berada. “Pulang” wajar karena tujuannya adalah rumahnya sendiri, sedangkan “di kotanya” mempertahankan unsur kedua.
- source_word: וַיְצַו אֶל־בֵּיתוֹ
  choice: ia memberi pesan kepada seisi rumahnya
  rationale: Frasa ini secara dekat menyatakan bahwa ia memberikan perintah atau pesan kepada rumah tangganya. Pilihan ini menghindari menjadikan tafsiran idiomatis “membereskan urusan rumahnya” sebagai satu-satunya arti.
- source_word: וַיֵּחָנַק
  choice: menggantung diri
  rationale: Bentuk Niphal dalam konteks ini bersifat refleksif dan menggambarkan bunuh diri. Verba tersebut dapat menunjuk mati karena tercekik atau tergantung; “menggantung diri” merupakan ungkapan Indonesia yang alami, sementara alternatifnya dicatat.
- source_word: בְּקֶבֶר אָבִיו
  choice: dalam makam ayahnya
  rationale: קֶבֶר dapat berarti kubur atau makam. “Makam” sesuai dengan tempat penguburan keluarga dan tetap mempertahankan rujukan tunggal kepada ayahnya.
theological_decisions:
- issue: Cara kematian Ahitofel
  choice: menggantung diri
  alternative: mencekik diri / mati tercekik
  rationale: Konteks jelas menggambarkan tindakan bunuh diri, tetapi verba Ibrani tidak harus menentukan secara teknis apakah kematian terjadi karena tergantung atau tercekik. Teks utama memakai ungkapan alami dan catatan kaki menjaga keluasan leksikalnya.
- issue: Tindakan terhadap rumah tangganya sebelum mati
  choice: memberi pesan kepada seisi rumahnya
  alternative: mengatur urusan rumahnya
  rationale: Teks Ibrani secara formal menyebut pemberian perintah atau pesan kepada rumahnya. Makna mengatur urusan keluarga atau harta mungkin tersirat, tetapi tidak ditegaskan sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. “Ia” dipakai untuk alur narasi, “seisi rumahnya” untuk rumah tangga, dan susunan kalimat dipecah agar rangkaian tindakan tetap jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
