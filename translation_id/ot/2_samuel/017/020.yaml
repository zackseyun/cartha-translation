base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/020.yaml
  text: Absalom’s servants came to the woman at the house and said[a], “Where are Ahimaaz and Jonathan?” The woman said to them, “They crossed over the brook of water.” They searched, but did not find them, so they returned to Jerusalem.
translation:
  language: id
  text: Para hamba Absalom datang ke rumah itu dan bertanya kepada perempuan itu, “Di manakah Ahimaas dan Yonatan?” Perempuan itu menjawab mereka, “Mereka sudah menyeberangi aliran air itu[a].” Mereka mencari keduanya, tetapi tidak menemukan mereka. Lalu mereka kembali ke Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “aliran air itu” tidak lazim dan makna tepatnya tidak pasti; mungkin juga berarti “anak sungai itu” atau “saluran air itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אַבְשָׁלוֹם
  choice: para hamba Absalom
  rationale: Dalam konteks ini עֶבֶד menunjuk pada orang-orang yang melayani atau menjalankan perintah Absalom. ‘Para hamba’ mempertahankan istilah naratif Alkitab yang wajar tanpa menegaskan status perbudakan yang tidak menjadi pokok ayat.
- source_word: אֶל הָאִשָּׁה הַבַּיְתָה
  choice: kepada perempuan itu di rumahnya
  rationale: אִשָּׁה di sini merujuk kepada perempuan yang telah disebut sebelumnya, sedangkan bentuk berakhiran arah pada הַבַּיְתָה menunjukkan gerak menuju rumah. Ungkapan Indonesia ini alami dan tidak memaksakan bahwa mereka masuk ke dalam rumah.
- source_word: אַיֵּה
  choice: Di manakah
  rationale: Kata tanya ini menanyakan lokasi. Bentuk Indonesia tidak perlu membedakan kesesuaian tunggal atau jamak.
- source_word: עָבְרוּ
  choice: sudah menyeberangi
  rationale: עָבַר lazim berarti melintas atau menyeberang. ‘Sudah’ secara alami menandai tindakan yang menurut jawaban perempuan itu telah terjadi.
- source_word: מִיכַל הַמָּיִם
  choice: aliran air itu
  rationale: Frasa Ibrani ini tidak lazim dan arti tepat unsur מִיכַל tidak pasti. ‘Aliran air’ mempertahankan gagasan tentang suatu jalur atau aliran air tanpa menentukan apakah itu anak sungai, saluran, atau jenis aliran tertentu.
- source_word: וַיְבַקְשׁוּ וְלֹא מָצָאוּ
  choice: Mereka mencari keduanya, tetapi tidak menemukannya
  rationale: בקשׁ dalam konteks ini berarti mencari orang. Objek tersirat dijelaskan sebagai ‘keduanya’ agar alami dalam bahasa Indonesia, dan ‘tetapi’ menyatakan hasil pencarian yang berlawanan dengan harapan.
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: Lalu mereka kembali ke Yerusalem
  rationale: שׁוב berarti kembali. ‘Lalu’ menyampaikan urutan narasi tanpa membuat hubungan sebab-akibat lebih tegas daripada teks Ibrani.
