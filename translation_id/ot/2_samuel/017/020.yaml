translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama אַחִימַעַץ ditulis ‘Ahimaas’ dan יְהוֹנָתָן ditulis ‘Yonatan’ sesuai bentuk yang mudah dibaca dalam bahasa Indonesia. Ambiguitas jenis aliran air dipertahankan dan dijelaskan dalam catatan kaki.
