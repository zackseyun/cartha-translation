  text: וַ/יֹּ֤אמֶר אַבְשָׁלוֹם֙ וְ/כָל אִ֣ישׁ יִשְׂרָאֵ֔ל טוֹבָ֗ה עֲצַת֙ חוּשַׁ֣י הָ/אַרְכִּ֔י מֵ/עֲצַ֖ת אֲחִיתֹ֑פֶל וַ/יהוָ֣ה צִוָּ֗ה לְ/הָפֵ֞ר אֶת עֲצַ֤ת אֲחִיתֹ֨פֶל֙ הַ/טּוֹבָ֔ה לְ/בַ/עֲב֗וּר הָבִ֧יא יְהוָ֛ה אֶל אַבְשָׁל֖וֹם אֶת הָ/רָעָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/014.yaml
  text: Then Absalom and all the men of Israel said[a], “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For Yahweh had ordained to frustrate the good counsel of Ahithophel[b], so that Yahweh might bring disaster on Absalom.
translation:
  language: id
  text: Lalu Absalom dan semua orang Israel berkata, “Nasihat Husai, orang Arki itu, lebih baik daripada nasihat Ahitofel.” Sebab Yahweh telah menetapkan untuk menggagalkan nasihat Ahitofel yang baik itu,[a] supaya Yahweh mendatangkan malapetaka atas Absalom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah memerintahkan agar nasihat Ahitofel yang baik itu digagalkan.” Kata Ibrani yang diterjemahkan “menetapkan” biasanya berarti “memerintahkan”; di sini kata itu menggambarkan keputusan Yahweh yang membuat nasihat tersebut tidak berhasil.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “malapetaka” juga dapat berarti “kejahatan”, “kemalangan”, atau “bencana”; di sini maksudnya ialah celaka atau kehancuran yang akan menimpa Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: וְכָל אִישׁ יִשְׂרָאֵל
  choice: dan semua orang Israel
  rationale: אִישׁ berbentuk tunggal tetapi digunakan secara kolektif. “Semua orang Israel” alami dan tetap mencerminkan kelompok yang ikut menyatakan penilaian itu.
- source_word: טוֹבָה ... מֵעֲצַת
  choice: lebih baik daripada nasihat
  rationale: Adjektiva טוֹבָה memperoleh arti komparatif melalui konstruksi dengan מִן; bahasa Indonesia secara wajar memakai “lebih baik daripada”.
- source_word: עֲצַת
  choice: nasihat
  rationale: עֵצָה dalam konteks ini menunjuk pada nasihat strategis yang diberikan kepada penguasa. “Nasihat” lebih umum dan alami daripada “wejangan” atau “pertimbangan”.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, orang Arki itu
  rationale: הָאַרְכִּי adalah sebutan asal atau kelompok. Bentuk “orang Arki” jelas bagi pembaca Indonesia dan mempertahankan artikel penentu secara wajar dengan “itu”.
- source_word: צִוָּה
  choice: telah menetapkan
  rationale: Verba ini lazim berarti “memerintahkan”, tetapi dalam konteks tindakan ilahi terhadap berlakunya suatu nasihat, “menetapkan” menyampaikan keputusan efektif tanpa mengharuskan adanya penerima perintah yang disebutkan.
- source_word: לְהָפֵר
  choice: untuk menggagalkan
  rationale: Bentuk Hifil dari פרר di sini berarti membuat nasihat tidak berhasil atau tidak berlaku; “menggagalkan” tepat dalam konteks strategi.
- source_word: עֲצַת אֲחִיתֹפֶל הַטּוֹבָה
  choice: nasihat Ahitofel yang baik itu
  rationale: Terjemahan mempertahankan penilaian eksplisit teks bahwa nasihat Ahitofel itu baik, yakni baik atau efektif sebagai strategi, tanpa mengubahnya menjadi penilaian moral.
- source_word: לְבַעֲבוּר הָבִיא
  choice: supaya ... mendatangkan
  rationale: Ungkapan ini menyatakan tujuan atau hasil yang dimaksudkan. “Supaya” mempertahankan hubungan tersebut dengan jelas dan alami.
- source_word: הָרָעָה
  choice: malapetaka
  rationale: Dalam konteks ini רָעָה menunjuk pada keburukan yang menimpa seseorang—bencana, keruntuhan, atau celaka—bukan kejahatan moral. “Malapetaka” sesuai dengan konteks penghukuman atas Absalom.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, sesuai bentuk Tetragramaton dalam teks sumber.
theological_decisions:
- issue: Cara menggambarkan tindakan ilahi dalam צִוָּה לְהָפֵר
  choice: Yahweh telah menetapkan untuk menggagalkan
  alternative: Yahweh telah memerintahkan untuk menggagalkan
  rationale: “Menetapkan” cocok dengan konteks penentuan ilahi yang efektif, tetapi catatan kaki mempertahankan arti leksikal yang lebih lazim, “memerintahkan”. Terjemahan tidak menjelaskan mekanisme providensi lebih jauh daripada teks.
- issue: Penilaian terhadap nasihat Ahitofel
  choice: nasihat Ahitofel yang baik itu
  alternative: nasihat Ahitofel yang jitu itu
  rationale: Kata “baik” mempertahankan ketegangan bahwa strategi yang menguntungkan pemberontakan Absalom tetap dinilai baik dalam arti strategis. Terjemahan tidak mengubahnya menjadi penilaian moral maupun meniadakan evaluasi sumber.
- issue: Makna הָרָעָה sebagai tindakan Yahweh
  choice: malapetaka
  alternative: kejahatan
  rationale: Konteks menunjukkan bencana atau celaka yang ditimpakan kepada Absalom. Pilihan ini menyampaikan makna kontekstual tanpa menyimpulkan bahwa Yahweh menghasilkan kejahatan moral.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Absalom, Husai, Ahitofel, dan Arki. Struktur kalimat mempertahankan hubungan sebab dan tujuan dalam teks Ibrani tanpa menjadi kaku.'
