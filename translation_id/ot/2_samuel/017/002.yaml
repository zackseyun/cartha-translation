  register: Bahasa Indonesia baku, modern, dan lugas dengan nada naratif-militer yang bermartabat. Pronomina orang pertama tunggal memakai 'aku' sesuai tuturan langsung dalam narasi. Idiom Ibrani diterjemahkan menurut maknanya dalam teks utama dan bentuk harfiahnya dicatat dalam catatan kaki.
