review_pass:
  verdict: revise
  source_fidelity: Draf umumnya setia kepada teks Ibrani. Namun, "rakyat" dapat menyiratkan penduduk/anggota suatu negara, sedangkan הָעָם di sini menunjuk pada semua orang atau pasukan yang bersama raja. Selain itu, "menewaskan raja seorang diri" secara normal dapat dipahami bahwa pembicara bertindak seorang diri, bukan bahwa raja menjadi satu-satunya sasaran, sehingga fokus לְבַדּוֹ perlu diperjelas.
  naturalness: Bahasa draf pada umumnya baku dan lancar. "Semua orang yang bersamanya" lebih idiomatis dan lebih tepat dalam konteks pengejaran militer daripada "seluruh rakyat yang menyertainya." "Raja itu saja" dengan jelas melekat pada objek dan menghindari ambiguitas sintaktis.
  terminology: '"Letih" dan "lemah" menyampaikan יָגֵעַ serta רְפֵה יָדַיִם secara alami; catatan kaki mempertahankan citra idiomatik "lemah tangan." "Membuatnya panik" memadai untuk bentuk kausatif חרד. "Menewaskan" dapat dipertahankan dalam konteks serangan ini, dan "raja itu" mempertahankan nomina definit tanpa menyisipkan nama Daud.'
  issues:
  - severity: medium
    issue: '"Seluruh rakyat" untuk כָּל הָעָם אֲשֶׁר אִתּוֹ'
    rationale: Dalam konteks ini frasa tersebut merujuk kepada orang-orang yang bersama sang raja, bukan rakyat dalam arti populasi atau warga negara. "Semua orang yang bersamanya" mempertahankan cakupan dan relasi frasa Ibrani secara lebih tepat.
  - severity: high
    issue: '"Raja seorang diri" ambigu'
    rationale: Dalam bahasa Indonesia, frasa itu lazimnya menerangkan subjek "aku" (aku seorang diri menewaskan raja). Ibrani לְבַדּוֹ menegaskan bahwa raja itulah satu-satunya sasaran setelah para pengikutnya lari. "Raja itu saja" mengungkapkan penekanan tersebut.
  revised_text: Aku akan mendatanginya ketika ia letih dan lemah[a]. Aku akan membuatnya panik, sehingga semua orang yang bersamanya akan melarikan diri. Kemudian aku akan menewaskan raja itu saja.
  revised_footnotes:
