  to: Aku akan mendatanginya ketika ia letih dan lemah[a]. Aku akan membuatnya panik, sehingga semua orang yang bersamanya akan melarikan diri. Kemudian aku akan menewaskan raja itu saja.
  rationale: Revisi mengganti istilah yang terlalu bernuansa politis dengan rujukan yang sesuai bagi rombongan raja, serta memperjelas bahwa raja—bukan penutur—yang menjadi sasaran tunggal. Struktur, nada militer, dan ambiguitas yang tidak perlu tidak ditambahkan; catatan kaki tetap ditambatkan pada padanan idiom Ibrani.
