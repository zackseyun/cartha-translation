base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/002.yaml
  text: I will come upon him while he is weary and weak-handed[a], and I will throw him into panic, so that all the people who are with him will flee; then I will strike down the king alone.
translation:
  language: id
  text: Aku akan mendatanginya ketika ia letih dan lemah[a]. Aku akan membuatnya panik, sehingga semua orang yang bersamanya akan melarikan diri. Kemudian aku akan menewaskan raja itu saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lemah tangan,” sebuah ungkapan untuk berkurangnya kekuatan atau keberanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבוֹא עָלָיו
  choice: Aku akan mendatanginya
  rationale: בוא dengan עַל dalam konteks ini menyatakan gerak mendatangi seseorang dengan maksud menyerang. Pilihan ini mempertahankan gambaran verbal Ibrani, sementara nuansa permusuhannya jelas dari konteks.
- source_word: יָגֵעַ
  choice: letih
  rationale: Kata sifat ini menunjukkan keletihan akibat pengerahan tenaga; 'letih' alami dan tepat untuk keadaan pasukan dalam konteks militer.
- source_word: וּרְפֵה יָדַיִם
  choice: lemah semangat
  rationale: Ungkapan harfiahnya 'lemah tangan' atau 'kendur tangan', sebuah idiom yang dapat menunjuk pada hilangnya daya atau keberanian. 'Lemah semangat' menyampaikan makna idiomatis secara wajar dalam bahasa Indonesia; citra harfiahnya dipertahankan dalam catatan kaki.
- source_word: וְהַחֲרַדְתִּי אֹתוֹ
  choice: Aku akan membuatnya panik
  rationale: Bentuk hifil dari חרד bersifat kausatif, yakni membuat seseorang gemetar atau ketakutan. 'Membuatnya panik' menyampaikan daya kausatif dan cocok dengan suasana serangan mendadak.
- source_word: וְנָס כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: sehingga seluruh rakyat yang menyertainya akan melarikan diri
  rationale: 'Kata sambung Ibrani memungkinkan hubungan akibat. ''Sehingga'' memperjelas alur wajar: kepanikan raja mengakibatkan orang-orang yang bersamanya melarikan diri.'
- source_word: וְהִכֵּיתִי
  choice: aku akan menewaskan
  rationale: Dalam konteks serangan yang menjadikan raja sasaran tunggal, נכה menyiratkan pukulan mematikan. 'Menewaskan' menyampaikan hasil tersebut secara alami tanpa menambahkan rincian cara pembunuhan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini menunjuk kepada sang raja, yaitu Daud dalam konteks, tetapi gelar teks dipertahankan dan nama tidak disisipkan.
- source_word: לְבַדּוֹ
  choice: seorang diri
  rationale: Frasa ini menekankan bahwa raja akan terpisah dari para pengikutnya dan menjadi sasaran tunggal. 'Seorang diri' mempertahankan fokus pada keterisolasiannya.
