base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/015.yaml
  text: Then Hushai said to Zadok and to Abiathar the priests[a], “This and that is what Ahithophel advised Absalom and the elders of Israel, and this and that is what I have advised.”
translation:
  language: id
  text: Kemudian Husai berkata kepada Zadok dan Abyatar, para imam, “Ahitofel memberikan nasihat begini dan begitu kepada Absalom dan para tua-tua Israel[a], tetapi aku sendiri memberikan nasihat begini dan begitu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang secara harfiah berarti “seperti ini dan seperti itu”; ungkapan ini menyampaikan pokok isi nasihat tanpa mengulanginya kata demi kata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “Kemudian” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל־צָדוֹק וְאֶל־אֶבְיָתָר הַכֹּהֲנִים
  choice: kepada Zadok dan Abyatar, para imam itu
  rationale: Frasa aposisional “para imam itu” menerangkan kedua nama dan mempertahankan bentuk jamak Ibrani.
- source_word: כָּזֹאת וְכָזֹאת
  choice: begini dan begitu
  rationale: Ungkapan Indonesia ini secara alami menyampaikan idiom Ibrani yang merangkum isi perkataan atau nasihat tanpa mengulangnya kata demi kata.
- source_word: יָעַץ
  choice: menasihati
  rationale: Dalam konteks politik ini, verba tersebut berarti memberikan nasihat atau pertimbangan strategis; “menasihati” ringkas dan wajar dalam narasi Indonesia.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Mempertahankan sebutan kelembagaan bagi para pemuka Israel tanpa mengubahnya menjadi sekadar orang-orang lanjut usia.
- source_word: יָעַצְתִּי אָנִי
  choice: aku sendiri menasihati mereka
  rationale: “Aku sendiri” mempertahankan penekanan dari pronomina mandiri אָנִי; “mereka” melengkapi objek yang dipahami dari klausa sejajar sebelumnya.
