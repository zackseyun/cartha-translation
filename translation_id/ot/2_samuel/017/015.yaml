revisions:
- from: Kemudian Husai berkata kepada Zadok dan Abyatar, para imam itu, “Ahitofel menasihati Absalom dan para tua-tua Israel begini dan begitu[a], sedangkan aku sendiri menasihati mereka begini dan begitu.”
  to: Kemudian Husai berkata kepada Zadok dan Abyatar, para imam, “Ahitofel memberikan nasihat begini dan begitu kepada Absalom dan para tua-tua Israel[a], tetapi aku sendiri memberikan nasihat begini dan begitu.”
  rationale: Revisi mempertahankan idiom berulang dan penekanan pada "aku sendiri," sambil menghilangkan objek tersirat yang ditambahkan pada klausa kedua. Susunan "memberikan nasihat begini dan begitu kepada" memperjelas bahwa idiom itu merangkum isi nasihat, bukan cara menasihati. Aposisi "para imam" cukup menerangkan kedua nama tanpa demonstratif tambahan, dan catatan kaki kini menjelaskan idiom secara tepat.
