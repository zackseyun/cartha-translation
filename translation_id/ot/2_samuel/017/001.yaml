  source_fidelity: Teks Indonesia secara akurat menyampaikan urutan naratif וַיֹּאמֶר, usul sopan kohortatif אֶבְחֲרָה נָּא, jumlah “dua belas ribu orang,” serta tindakan mengejar Daud pada malam itu. “Lalu aku akan bangkit dan mengejar” merupakan pengungkapan Indonesia yang wajar bagi rangkaian kohortatif Ahitofel, tanpa menambahkan rincian militer yang tidak dinyatakan eksplisit.
