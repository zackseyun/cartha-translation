  text: וַ/יֹּ֥אמֶר אֲחִיתֹ֖פֶל אֶל אַבְשָׁלֹ֑ם אֶבְחֲרָ֣ה נָּ֗א שְׁנֵים עָשָׂ֥ר אֶ֨לֶף֙ אִ֔ישׁ וְ/אָק֛וּמָה וְ/אֶרְדְּפָ֥ה אַחֲרֵי דָוִ֖ד הַ/לָּֽיְלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/001.yaml
  text: Then Ahithophel said to Absalom[a], “Please let me choose twelve thousand men, and let me arise and pursue David tonight.”
translation:
  language: id
  text: Kemudian Ahitofel berkata kepada Absalom, “Izinkanlah aku memilih dua belas ribu orang, lalu aku akan bangkit dan mengejar Daud malam ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “kemudian” menyatakan urutan secara alami dalam bahasa Indonesia modern.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל־אַבְשָׁלֹם
  choice: kepada Absalom
  rationale: Preposisi אֶל secara alami diterjemahkan “kepada” ketika memperkenalkan lawan bicara.
- source_word: אֶבְחֲרָה נָּא
  choice: Izinkanlah aku memilih
  rationale: Kohortatif dengan נָא menyampaikan permohonan atau usul yang sopan; pilihan ini alami dan tetap mempertahankan nuansa meminta izin.
- source_word: שְׁנֵים עָשָׂר אֶלֶף אִישׁ
  choice: dua belas ribu orang
  rationale: Secara harfiah menyebut “orang”; konteksnya memang militer, tetapi teks tidak memakai istilah khusus untuk prajurit.
- source_word: וְאָקוּמָה
  choice: lalu aku akan bangkit
  rationale: קוּם berarti “bangkit”; dalam konteks ini menunjuk pada mulai bertindak. “Lalu” menandai urutan tindakan dengan wajar.
- source_word: וְאֶרְדְּפָה אַחֲרֵי דָוִד
  choice: dan mengejar Daud
  rationale: רדף dengan אַחֲרֵי menyatakan pengejaran terhadap seseorang; bahasa Indonesia cukup menyatakannya dengan “mengejar Daud” tanpa unsur tambahan yang berlebihan.
- source_word: הַלָּיְלָה
  choice: malam ini
  rationale: Kata benda dengan artikel menunjuk pada malam yang sedang atau segera dihadapi; “malam ini” merupakan padanan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Izinkanlah aku” mempertahankan kesopanan usul Ahitofel, sedangkan “bangkit” menjaga citra leksikal Ibrani tanpa terdengar terlalu arkais.
