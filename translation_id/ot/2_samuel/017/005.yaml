  text: Then Absalom said[a], “Please call Hushai the Archite also, and let us hear what he too has to say.”
translation:
  language: id
  text: Lalu Absalom berkata, “Tolong panggil juga Husai, orang Arki, dan mari kita dengarkan juga apa yang hendak dikatakannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” menyampaikan gerak naratif itu secara wajar dalam bahasa Indonesia.
- source_word: קְרָא נָא
  choice: Tolong panggil
  rationale: Kata perintah dengan partikel נָא memberi nuansa permintaan yang diperhalus; “Tolong panggil” alami dan jelas.
- source_word: גַּם
  choice: juga
  rationale: גַּם pertama menambahkan Husai sebagai orang lain yang perlu dipanggil setelah nasihat Ahitofel didengar.
- source_word: חוּשַׁי הָאַרְכִּי
  choice: Husai, orang Arki itu
  rationale: Nama diri ditransliterasikan sebagai “Husai”; bentuk nisbah הָאַרְכִּי diterjemahkan secara transparan sebagai “orang Arki itu”.
- source_word: וְנִשְׁמְעָה
  choice: supaya kita mendengar
  rationale: Kohortatif orang pertama jamak menyatakan ajakan atau maksud bersama; dalam konteks ini “supaya kita mendengar” menghubungkan pemanggilan dengan tujuannya secara alami.
- source_word: מַה בְּפִיו
  choice: apa yang hendak dikatakannya
  rationale: Secara harfiah ungkapan ini berarti “apa yang ada di mulutnya”, sebuah idiom bagi pendapat atau perkataan yang akan disampaikan. Pilihan ini mengungkapkan maknanya tanpa mempertahankan idiom yang janggal dalam bahasa Indonesia.
- source_word: גַּם הוּא
  choice: '... juga'
  rationale: גַּם kedua menegaskan bahwa perkataan Husai pun perlu didengar; “juga” pada akhir klausa mempertahankan daya tambah tersebut secara wajar.
