translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Susunan mempertahankan dua unsur גַּם: Husai juga dipanggil, dan pendapatnya juga didengar. Tidak diperlukan catatan kaki karena idiom Ibrani diterjemahkan langsung dan tidak memuat ambiguitas penting yang perlu dipertahankan.'
