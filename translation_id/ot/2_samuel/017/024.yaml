  text: Then David came to Mahanaim, and Absalom crossed the Jordan, he and all the men of Israel with him.
translation:
  language: id
  text: Lalu Daud tiba di Mahanaim, dan Absalom bersama seluruh laki-laki Israel yang menyertainya menyeberangi Sungai Yordan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: tiba
  rationale: Bentuk Qal perfektum dari בוא menyatakan bahwa Daud sampai di tempat tujuan; “tiba” alami dalam narasi Indonesia dan menyampaikan tercapainya tujuan.
- source_word: מַחֲנָיְמָה
  choice: di Mahanaim
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Mahanaim. Bersama verba “tiba”, bahasa Indonesia secara idiomatis memakai “di” untuk tempat tujuan yang telah dicapai.
- source_word: עָבַר אֶת־הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: עבר dengan objek “Yordan” berarti melintasi sungai itu. Penambahan “Sungai” memperjelas nama geografis secara alami tanpa mengubah makna.
- source_word: הוּא וְכָל־אִישׁ יִשְׂרָאֵל עִמּוֹ
  choice: bersama seluruh laki-laki Israel yang menyertainya
  rationale: Konstruksi ini menyebut Absalom dan secara kolektif semua laki-laki Israel yang bersamanya. Susunan Indonesia ini menghindari bentuk kaku “dia dan ... bersamanya” sambil mempertahankan rujukan maskulin dan hubungan penyertaan.
- source_word: כָל־אִישׁ יִשְׂרָאֵל
  choice: seluruh laki-laki Israel
  rationale: אִישׁ berbentuk tunggal kolektif sesudah כָל dan merujuk pada kaum laki-laki Israel yang berpihak kepada Absalom; “laki-laki” mempertahankan cakupan maskulin teks, tidak memperluasnya menjadi seluruh rakyat.
- source_word: וְ
  choice: Lalu / sedangkan
  rationale: Waw pertama melanjutkan alur narasi dan wajar diterjemahkan “Lalu”. Waw kedua menghubungkan tindakan Absalom yang berlangsung sebagai perkembangan sejajar atau kontras ringan, sehingga “sedangkan” alami dalam konteks ini.
