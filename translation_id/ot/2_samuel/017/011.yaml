base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/011.yaml
  text: But I advise that all Israel be surely gathered to you[a], from Dan to Beersheba, as numerous as the sand that is by the sea, and that you yourself go into battle.
translation:
  language: id
  text: Namun, aku menasihatkan agar seluruh Israel benar-benar dikumpulkan kepadamu, dari Dan sampai Bersyeba, sebanyak pasir di tepi laut, dan engkau sendiri maju ke medan pertempuran.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “wajahmu berjalan dalam pertempuran,” sebuah ungkapan yang berarti bahwa engkau sendiri maju ke medan pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Namun
  rationale: Dalam konteks ini partikel tersebut memperkenalkan usul tandingan Husai terhadap rencana Ahitofel; 'Namun' menyampaikan daya adversatifnya secara alami.
- source_word: יָעַצְתִּי
  choice: aku menasihatkan
  rationale: Berasal dari יעץ, 'menasihati/memberi pertimbangan'; bentuk kini menyampaikan fungsi ujaran dalam pidato langsung.
- source_word: הֵאָסֹף יֵאָסֵף
  choice: benar-benar dikumpulkan
  rationale: Gabungan infinitif absolut dan verba finit mengintensifkan tindakan pengumpulan.
- source_word: עָלֶיךָ
  choice: kepadamu
  rationale: Dengan אסף, preposisi על menunjukkan bahwa pasukan dihimpunkan kepada atau di bawah pimpinan Absalom.
- source_word: כָל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan kolektif yang mempertahankan cakupan menyeluruh dalam retorika Husai.
- source_word: מִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Merisme geografis yang menunjuk seluruh wilayah Israel; nama tempat disajikan menurut bentuk Indonesia yang lazim.
- source_word: כַּחוֹל אֲשֶׁר עַל הַיָּם לָרֹב
  choice: sebanyak pasir di tepi laut
  rationale: Menyampaikan perbandingan mengenai jumlah yang amat besar sambil mempertahankan citra pasir dan laut.
- source_word: וּפָנֶיךָ הֹלְכִים
  choice: engkau sendiri maju
  rationale: Secara harfiah 'wajahmu pergi'; idiom ini menegaskan kehadiran pribadi Absalom, sedangkan 'maju' sesuai dengan konteks militer.
- source_word: בַּקְרָב
  choice: dalam pertempuran
  rationale: קרב di sini menunjuk pertempuran; frasa tersebut menyatakan bahwa Absalom sendiri turut maju dalam pertempuran.
