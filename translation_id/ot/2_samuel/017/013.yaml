base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/013.yaml
  text: And if he withdraws into a city[a], then all Israel will bring ropes to that city[b], and we will drag it to the wadi until not even a small stone is found there.
translation:
  language: id
  text: Jika ia berlindung di sebuah kota, seluruh Israel akan membawa tali-tali ke kota itu, lalu kita akan menyeretnya sampai ke wadi[a], hingga di sana tidak ditemukan batu kecil satu pun[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wadi ialah alur sungai musiman atau lembah sempit yang biasanya kering; dapat juga diterjemahkan “sungai kecil” atau “lembah sungai”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bahkan batu kecil pun”. Ini merupakan gambaran hiperbolis tentang kehancuran total.
    reason: figurative_language
lexical_decisions:
- source_word: יֵאָסֵף
  choice: mengundurkan diri ke dalam
  rationale: Bentuk nifal dari אסף dalam konteks militer ini menggambarkan Daud yang mundur atau berlindung di dalam sebuah kota. Ungkapan ini lebih alami daripada terjemahan harfiah “dikumpulkan”.
- source_word: וְהִשִּׂיאוּ ... חֲבָלִים
  choice: akan membawa tali-tali
  rationale: Kata kerja ini menyatakan tindakan membawa atau mengangkut, sedangkan חֲבָלִים menunjuk pada tali-tali yang dipakai dalam gambaran hiperbolis untuk menarik kota.
- source_word: וְסָחַבְנוּ אֹתוֹ
  choice: Kita akan menyeret kota itu
  rationale: סחב berarti menyeret atau menghela. Acuan kata ganti maskulin אֹתוֹ tidak sepenuhnya pasti karena “kota” berjenis feminin; konteks gambaran penghancuran mendukung acuan kepada kota, sementara kemungkinan “dia” dicatat dalam catatan kaki.
- source_word: הַנַּחַל
  choice: wadi
  rationale: נחל dapat menunjuk pada alur sungai musiman, jurang berair, atau sungai kecil. “Wadi” mempertahankan ciri geografis khas kawasan itu, dengan penjelasan dalam catatan kaki.
- source_word: גַּם צְרוֹר
  choice: satu batu kecil pun
  rationale: צְרוֹר di sini menunjuk pada batu kecil atau kerikil. Susunan “tidak ... satu ... pun” menyampaikan penegasan hiperbolis bahwa kota itu akan dimusnahkan sama sekali.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas. “Mengundurkan diri” menyampaikan gerakan mundur dalam konteks militer; “tali-tali” mempertahankan bentuk jamak konkret; dan istilah geografis “wadi” dijelaskan agar tetap mudah dipahami.
