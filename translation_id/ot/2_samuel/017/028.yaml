lexical_decisions:
- source_word: מִשְׁכָּב
  choice: tempat tidur
  rationale: Nomina ini dapat menunjuk pada tempat atau perlengkapan untuk berbaring; dalam daftar perbekalan, 'tempat tidur' merupakan padanan konkret dan alami.
- source_word: סַפּוֹת
  choice: baskom
  rationale: Bentuk jamak ini kemungkinan menunjuk pada wadah rumah tangga, yakni baskom atau mangkuk; 'baskom' sesuai dengan konteks perbekalan.
- source_word: כְלִי יוֹצֵר
  choice: perkakas tembikar
  rationale: Secara harfiah berarti perkakas atau wadah buatan tukang periuk; ungkapan ini menunjuk pada barang-barang keramik.
- source_word: חִטִּים
  choice: gandum
  rationale: Padanan baku bagi jenis serealia ini.
- source_word: שְׂעֹרִים
  choice: jelai
  rationale: Padanan Indonesia modern bagi barley.
- source_word: קֶמַח
  choice: tepung
  rationale: Istilah ini menunjuk pada biji-bijian yang telah digiling.
- source_word: קָלִי
  choice: biji-bijian panggang
  rationale: Istilah makanan ini menunjuk pada biji-bijian yang dipanggang atau disangrai; kedua kemunculannya diterjemahkan sama untuk mempertahankan pengulangan Ibrani.
- source_word: פּוֹל
  choice: kacang babi
  rationale: Istilah ini kemungkinan khusus menunjuk pada fava bean atau broad bean; 'kacang babi' adalah nama Indonesianya.
- source_word: עֲדָשִׁים
  choice: lentil
  rationale: Padanan baku dan mudah dipahami bagi legum tersebut.
