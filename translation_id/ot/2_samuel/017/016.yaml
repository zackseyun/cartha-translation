    issue: “Seberangilah tempat itu” menambahkan objek “tempat itu.”
    rationale: Teks Ibrani hanya memerintahkan untuk menyeberang; objek atau lokasi yang tepat tidak disebutkan dalam frasa ini. Penambahan tersebut tidak diperlukan dan dapat memberi kesan rujukan lokasi yang lebih tegas daripada sumber.
  - severity: medium
    issue: “Seluruh rakyat yang menyertainya” dapat menyempitkan atau menggeser makna עָם.
    rationale: Dalam konteks ini עָם menunjuk seluruh kelompok yang bersama raja, bukan rakyat kerajaan pada umumnya. “Semua orang yang bersama dia” mempertahankan keluasan dan rujukan klausa relatif.
  - severity: low
    issue: “Ditelan habis” menambahkan unsur “habis.”
    rationale: Verba pasif יְבֻלַּע mempertahankan citra ditelan; “habis” adalah intensifikasi tambahan yang tidak perlu.
