base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/016.yaml
  text: Now send quickly and tell David[a], saying, ‘Do not stay tonight at the fords of the wilderness, but be sure to cross over, lest the king and all the people who are with him be swallowed up.’
translation:
  language: id
  text: 'Sekarang, kirimlah segera orang untuk memberi tahu Daud: “Jangan bermalam malam ini di dataran gurun[a], tetapi pastikanlah untuk menyeberang, supaya raja dan semua orang yang bersama dia tidak ditelan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di tempat-tempat penyeberangan di padang gurun.” Ungkapan Ibrani ini biasanya dapat berarti dataran rendah atau dataran tandus; konteks berikutnya menekankan tindakan menyeberang.'
    reason: Menjaga alternatif geografis yang dimungkinkan konteks tanpa menggantikan makna leksikal utama dalam teks.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini memperkenalkan tindakan mendesak berikutnya; “Sekarang” alami dan mempertahankan kesan segera.
- source_word: שִׁלְחוּ מְהֵרָה
  choice: cepatlah kirim orang
  rationale: Bentuk perintah jamak dan keterangan cara menyatakan urgensi. Penambahan “orang” menjelaskan objek tersirat dari tindakan mengirim dalam bahasa Indonesia.
- source_word: וְהַגִּידוּ לְדָוִד לֵאמֹר
  choice: untuk memberi tahu Daud
  rationale: Menyampaikan fungsi rumus pembawa pesan secara alami tanpa mempertahankan “dengan berkata” yang terasa kaku dan berlebihan dalam bahasa Indonesia.
- source_word: אַל תָּלֶן הַלַּיְלָה
  choice: Jangan bermalam malam ini
  rationale: לון berarti tinggal atau bermalam; pilihan ini tepat, jelas, dan mempertahankan keterangan waktu eksplisit.
- source_word: בְּעַרְבוֹת הַמִּדְבָּר
  choice: di dataran gurun
  rationale: עֲרָבוֹת secara leksikal menunjuk dataran rendah atau dataran tandus. Konteks penyeberangan memungkinkan tafsiran lokasi penyeberangan, tetapi teks utama mempertahankan makna leksikal yang paling langsung dan mencatat alternatifnya.
- source_word: וְגַם עָבוֹר תַּעֲבוֹר
  choice: Seberangilah tempat itu tanpa menunda-nunda
  rationale: Infinitif absolut diikuti verba finit memberi penegasan kuat pada perintah menyeberang. “Tanpa menunda-nunda” mengungkapkan daya penegasan itu secara wajar; “tempat itu” tidak menentukan secara berlebihan apa yang diseberangi.
- source_word: פֶּן
  choice: supaya ... tidak
  rationale: Mengungkapkan peringatan atau akibat yang hendak dihindari dengan bentuk Indonesia yang alami.
- source_word: יְבֻלַּע
  choice: ditelan habis
  rationale: Mempertahankan citra kuat dari verba pasif בלע, yang dalam konteks ancaman militer menyiratkan dibinasakan atau dilanda sepenuhnya.
- source_word: לַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar politik yang dipakai teks Ibrani, bukan menggantinya dengan nama Daud.
- source_word: וּלְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: dan seluruh rakyat yang menyertainya
  rationale: עָם lebih luas daripada “pasukan”; “rakyat” menjaga keluasan makna, sedangkan “yang menyertainya” menerjemahkan klausa relatif dengan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang mendesak dan bermartabat. Struktur rumus pembawa pesan disederhanakan agar alami, sementara penegasan Ibrani dan citra “ditelan” dipertahankan.
