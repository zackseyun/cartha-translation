  to: 'Sekarang, kirimlah segera orang untuk memberi tahu Daud: “Jangan bermalam malam ini di dataran gurun[a], tetapi pastikanlah untuk menyeberang, supaya raja dan semua orang yang bersama dia tidak ditelan.”'
