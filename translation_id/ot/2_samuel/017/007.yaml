  text: Then Hushai said to Absalom[a], “The counsel that Ahithophel has given this time is not good.”
translation:
  language: id
  text: Lalu Husai berkata kepada Absalom, “Nasihat yang diberikan Ahitofel kali ini tidak baik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan urutan naratif secara alami dalam bahasa Indonesia modern.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל־אַבְשָׁלוֹם
  choice: kepada Absalom
  rationale: Preposisi אֶל dengan verba berkata secara alami diterjemahkan “kepada”; nama diri dipertahankan dalam bentuk Indonesia yang lazim.
- source_word: לֹא טוֹבָה
  choice: tidak baik
  rationale: Mempertahankan penilaian luas dan langsung dari bahasa Ibrani tanpa mempersempitnya menjadi “tidak bijaksana” atau “tidak tepat”.
- source_word: הָעֵצָה
  choice: nasihat
  rationale: עֵצָה dapat berarti nasihat, pertimbangan, atau rencana. “Nasihat” alami dalam bahasa Indonesia dan sesuai dengan peran Ahitofel sebagai penasihat, sambil tetap memungkinkan muatan strategis konteksnya.
- source_word: אֲשֶׁר יָעַץ
  choice: yang diberikan
  rationale: Ungkapan ini secara idiomatis melengkapi “nasihat” dalam bahasa Indonesia dan menghindari pengulangan kaku seperti “nasihat yang dinasihatkan”.
- source_word: אֲחִיתֹפֶל
  choice: Ahitofel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּפַּעַם הַזֹּאת
  choice: kali ini
  rationale: Padanan idiomatis yang ringkas dan tepat untuk frasa yang berarti “pada kali/ kesempatan ini”.
