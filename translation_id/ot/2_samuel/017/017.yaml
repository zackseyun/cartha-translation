translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “akan ... lalu ... akan” mempertahankan sifat prosedural rangkaian tindakan, sedangkan “tidak bisa terlihat” menjaga unsur ketidakmampuan dalam teks Ibrani tanpa mengubahnya menjadi larangan eksplisit.
