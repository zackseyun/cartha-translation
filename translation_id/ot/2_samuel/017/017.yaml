  to: Yonatan dan Ahimaas berada[a] di En-Rogel. Pelayan perempuan itu[b] pergi memberi tahu mereka, lalu mereka pergi memberi tahu Raja Daud, karena mereka tidak dapat terlihat ketika memasuki kota.
  rationale: Revisi memindahkan jangkar catatan kaki a kepada verba yang dibahas, menghindari pembacaan masa depan yang tidak perlu melalui penghapusan “akan”, dan memperhalus ungkapan pasif tentang terlihat saat memasuki kota. Makna dan ambiguitas aspek/tata cara tindakan dalam teks sumber tetap dipertahankan.
