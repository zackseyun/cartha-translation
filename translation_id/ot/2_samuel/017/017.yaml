base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/017.yaml
  text: Jonathan and Ahimaaz were standing at En-rogel[a], and a female servant would go and tell them, and they would go and tell King David[b], for they could not be seen entering the city.
translation:
  language: id
  text: Yonatan dan Ahimaas berada[a] di En-Rogel. Pelayan perempuan itu[b] pergi memberi tahu mereka, lalu mereka pergi memberi tahu Raja Daud, karena mereka tidak dapat terlihat ketika memasuki kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri”; dalam konteks ini ungkapan tersebut kemungkinan berarti bahwa mereka tetap berada atau ditempatkan di sana.
    reason: lexical_alternative
  - marker: b
    text: Ibrani שִׁפְחָה menunjuk secara khusus kepada seorang pelayan perempuan; kata ini juga dapat diterjemahkan “hamba perempuan” atau “budak perempuan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹמְדִים
  choice: berada
  rationale: Partisipel עמד secara harfiah berarti “berdiri”, tetapi bersama keterangan tempat dalam konteks ini menyatakan bahwa mereka tetap berada atau ditempatkan di sana. “Berada” alami dalam bahasa Indonesia dan tidak memberi kesan bahwa postur tubuh mereka adalah pokok kalimat.
- source_word: בְּעֵין רֹגֵל
  choice: di En-Rogel
  rationale: Nama tempat ditransliterasikan, sedangkan preposisi lokatif בְּ diterjemahkan dengan “di”.
- source_word: הַשִּׁפְחָה
  choice: pelayan perempuan itu
  rationale: שִׁפְחָה secara khusus menunjuk pelayan perempuan dan dapat pula mengandung status budak. Artikel tertentu dipertahankan dengan “itu”, yang menunjukkan seorang pelayan yang sudah dikenal dalam rangkaian kisah.
- source_word: וְהָלְכָה ... וְהֵם יֵלְכוּ
  choice: akan pergi ... lalu mereka akan pergi
  rationale: Rangkaian bentuk verba ini menjelaskan prosedur penyampaian pesan yang direncanakan atau berulang, bukan hanya satu tindakan lampau yang sudah selesai.
- source_word: וְהִגִּידָה לָהֶם ... וְהִגִּידוּ
  choice: menyampaikan pesan kepada mereka ... menyampaikannya
  rationale: Bentuk Hifil dari נגד berarti memberi tahu atau melaporkan. “Menyampaikan pesan” memperjelas mata rantai komunikasi tanpa menambahkan isi pesan.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: kepada Raja Daud
  rationale: Gelar dan nama diterjemahkan dalam susunan Indonesia yang alami.
- source_word: כִּי לֹא יוּכְלוּ
  choice: karena mereka tidak bisa
  rationale: כִּי memperkenalkan alasan bagi pengaturan tersebut, sedangkan יכל menyatakan ketidakmampuan atau ketidakmungkinan dalam keadaan itu.
- source_word: לְהֵרָאוֹת לָבוֹא הָעִירָה
  choice: terlihat memasuki kota
  rationale: Infinitif Nifal ראה menyatakan terlihat atau tertangkap pandang, dan akhiran arah pada עִירָה menunjukkan gerak menuju atau masuk ke kota.
