base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/006.yaml
  text: When Hushai came to Absalom[a], Absalom said to him, “Ahithophel has spoken in this way. Should we do as he says? If not, you speak.”
translation:
  language: id
  text: Ketika Husai datang kepada Absalom, Absalom berkata kepadanya, “Ahitofel telah berkata seperti ini. Haruskah kita melaksanakan perkataannya?[a] Jika tidak, engkau, berbicaralah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Haruskah kita bertindak sesuai dengan perkataannya?” Secara lebih harfiah, bahasa Ibrani berbunyi “Haruskah kita melakukan perkataannya?”, yaitu melaksanakan nasihat Ahitofel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Dalam narasi, bentuk wayyiqtol dari בוא melanjutkan alur dan, bersama אֶל אַבְשָׁלוֹם, secara alami berarti datang kepada Absalom.
- source_word: חוּשַׁי
  choice: Husai
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיֹּאמֶר ... לֵאמֹר
  choice: berkata
  rationale: Bahasa Indonesia tidak perlu menggandakan verba pengantar ujaran; 'berkata' menyampaikan konstruksi Ibrani ini secara wajar.
- source_word: כַּדָּבָר הַזֶּה דִּבֶּר
  choice: telah menyampaikan nasihatnya seperti itu
  rationale: Frasa ini menunjuk pada isi atau cara usul Ahitofel yang baru saja disampaikan. 'Nasihatnya' memperjelas acuan dalam konteks tanpa mengubah maksud.
- source_word: הֲנַעֲשֶׂה
  choice: Haruskah kita melaksanakan
  rationale: Partikel tanya dan bentuk orang pertama jamak menyatakan pertimbangan bersama; 'haruskah kita' alami dalam bahasa Indonesia modern.
- source_word: אֶת דְּבָרוֹ
  choice: perkataannya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang secara harfiah berarti 'perkataannya', dalam arti menjalankan nasihat atau usulnya.
- source_word: אִם אַיִן
  choice: Jika tidak
  rationale: Ungkapan idiomatis ini menghadirkan pilihan yang berlawanan secara ringkas.
- source_word: אַתָּה דַבֵּר
  choice: engkaulah yang berbicara
  rationale: Pronomina mandiri אַתָּה memberi penekanan pada Husai; bentuk 'engkaulah' mempertahankan penekanan tersebut dengan register yang pantas.
