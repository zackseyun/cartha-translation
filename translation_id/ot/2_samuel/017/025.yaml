base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/017/025.yaml
  text: And Absalom set Amasa over the army in place of Joab. Now Amasa was the son of a man whose name was Ithra the Israelite[a], who had gone in to Abigail the daughter of Nahash, sister of Zeruiah, Joab’s mother.
translation:
  language: id
  text: Absalom mengangkat Amasa menjadi panglima pasukan menggantikan Yoab. Amasa adalah anak seorang bernama Yitra, orang Israel,[a] yang telah menggauli Abigail anak perempuan Nahas, saudara perempuan Zeruya, ibu Yoab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Yitra, orang Israel.” Dalam 1 Tawarikh 2:17 tertulis “Yeter, orang Ismael.”
    reason: textual_variant
lexical_decisions:
- source_word: שָׂם ... עַל הַצָּבָא
  choice: mengangkat ... menjadi panglima pasukan
  rationale: Dalam konteks penetapan pemimpin militer, ungkapan ini secara alami menyatakan pengangkatan Amasa untuk memegang komando atas pasukan.
- source_word: תַּחַת יוֹאָב
  choice: menggantikan Yoab
  rationale: תַּחַת di sini menunjukkan penggantian jabatan, bukan posisi ruang.
- source_word: בֶן אִישׁ וּשְׁמוֹ יִתְרָא
  choice: anak seorang bernama Yitra
  rationale: Menyampaikan konstruksi Ibrani yang tidak tentu dengan bahasa Indonesia yang ringkas dan alami.
- source_word: הַיִּשְׂרְאֵלִי
  choice: orang Israel
  rationale: Mengikuti teks Masoret WLC; perbedaan dengan 1 Tawarikh 2:17 dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בָּא אֶל
  choice: yang telah menghampiri
  rationale: Mempertahankan ungkapan halus bagi hubungan seksual tanpa membuatnya terlalu eksplisit atau mengartikannya sekadar sebagai kunjungan.
- source_word: אֲבִיגַל בַּת נָחָשׁ
  choice: Abigail anak perempuan Nahas
  rationale: Menerjemahkan hubungan keturunan secara langsung dan jelas.
- source_word: אֲחוֹת צְרוּיָה אֵם יוֹאָב
  choice: saudara perempuan Zeruya, ibu Yoab
  rationale: Mempertahankan rangkaian keterangan dan identifikasi Zeruya sebagai ibu Yoab.
