  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk ulang “hamba-hambamu” memperjelas jamak, sedangkan “hambamu” mempertahankan bentuk tunggal untuk Uria. Tanda titik koma mempertahankan peralihan menuju laporan klimaks tentang Uria.
