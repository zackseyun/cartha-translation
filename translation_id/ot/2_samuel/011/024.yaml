  text: The archers shot at your servants from atop the wall[a], and some of the king’s servants died[b]; your servant Uriah the Hittite also died.
translation:
  language: id
  text: Para pemanah menembaki hamba-hambamu dari atas tembok, lalu beberapa hamba raja tewas; hambamu Uria, orang Het itu, juga tewas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah mati,” yang mencerminkan bentuk statif Ibrani pada klausa terakhir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַמּוֹרִים
  choice: Para pemanah menembaki
  rationale: Kata kerja ירה dalam konteks militer berarti menembak, sedangkan bentuk partisipelnya menunjuk kepada para pemanah. Bentuk “menembaki” secara alami menyatakan serangan yang diarahkan kepada sasaran.
- source_word: אֶל עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: אֶל menandai arah atau sasaran tembakan. עֲבָדֶיךָ dipertahankan sebagai “hamba-hambamu” untuk menjaga bahasa penghormatan dalam lingkungan istana, bukan disederhanakan menjadi “orang-orangmu”.
- source_word: מֵעַל הַחוֹמָה
  choice: dari atas tembok
  rationale: Ungkapan ini menunjukkan bahwa tembakan datang dari posisi di atas tembok kota; terjemahan ini alami dan mempertahankan gambaran ruangnya.
- source_word: וַיָּמֻתוּ מֵעַבְדֵי הַמֶּלֶךְ
  choice: lalu beberapa hamba raja tewas
  rationale: Preposisi מִן paling wajar dipahami secara partitif, yakni sebagian dari para hamba raja. “Tewas” sesuai dengan kematian dalam pertempuran dan tidak mengurangi makna sumber.
- source_word: וְגַם עַבְדְּךָ אוּרִיָּה הַחִתִּי
  choice: hambamu Uria, orang Het itu, juga
  rationale: “Hambamu” mempertahankan sapaan hormat kepada raja; וְגַם diterjemahkan “juga” untuk menandai laporan tambahan yang memuncak pada kematian Uria. החתי diterjemahkan dengan sebutan baku Indonesia “orang Het”.
- source_word: מֵת
  choice: tewas
  rationale: Bentuk statif ini secara harfiah dapat berarti “sudah mati,” tetapi dalam laporan naratif tentang pertempuran, “tewas” merupakan padanan Indonesia yang alami dan selaras dengan klausa sebelumnya.
