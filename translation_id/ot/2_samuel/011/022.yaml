  text: So the messenger went and came and told David all that Joab had sent him to say[a].
translation:
  language: id
  text: Lalu utusan itu pergi dan tiba, kemudian memberitahukan kepada Daud semua yang Yoab perintahkan kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “semua yang Yoab mengutusnya.” Dalam konteks ini, ungkapan tersebut berarti semua yang Yoab mengutus dia untuk sampaikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan itu
  rationale: Dalam konteks manusia dan komunikasi militer, מַלְאָךְ berarti orang yang diutus membawa pesan, bukan malaikat.
- source_word: וַיֵּלֶךְ ... וַיָּבֹא
  choice: pergi, dan setelah tiba
  rationale: Rangkaian ini mempertahankan kedua tindakan dalam bahasa Ibrani, tetapi memakai susunan Indonesia yang alami dan menghindari ungkapan kaku 'pergi dan datang'.
- source_word: וַיַּגֵּד לְדָוִד
  choice: ia menyampaikan kepada Daud
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; 'menyampaikan' sesuai dengan konteks penyampaian pesan resmi.
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari כָּל dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: שְׁלָחוֹ יוֹאָב
  choice: disuruh Yoab untuk disampaikannya
  rationale: Secara harfiah frasa ini berarti 'Yoab mengutusnya/mengirimnya', tetapi konteks menunjukkan isi yang dipercayakan kepada utusan untuk disampaikan. Perumusan ini membuat implikasi komunikatif tersebut jelas tanpa mengubah maksud.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi לְ menandai penerima laporan; nama diri ditulis menurut bentuk baku Indonesia.
