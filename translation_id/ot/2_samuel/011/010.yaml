base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/010.yaml
  text: They told David[a], saying, “Uriah did not go down to his house.” So David said to Uriah[b], “Have you not come from a journey? Why did you not go down to your house?”
translation:
  language: id
  text: Orang-orang memberi tahu Daud, “Uria tidak turun ke rumahnya[a].” Lalu Daud berkata kepada Uria, “Bukankah engkau datang dari perjalanan[b]? Mengapa engkau tidak turun ke rumahmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “turun ke rumahnya/rumahmu.” Dalam konteks ini, ungkapan tersebut berarti pergi pulang, barangkali dari tempat yang lebih tinggi atau dari kawasan istana ke tempat tinggalnya.
    reason: cultural_note
  - marker: b
    text: Atau “dari jalan.” Ungkapan Ibrani ini dapat berarti dari perjalanan atau sehabis bepergian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Orang-orang memberi tahu
  rationale: Bentuk hifil dari נגד berarti memberi tahu atau melaporkan. Subjek jamak tidak disebutkan secara khusus, sehingga 'orang-orang' mempertahankan ketidakjelasan identitas mereka secara wajar dalam bahasa Indonesia.
- source_word: לְדָוִד לֵאמֹר
  choice: Daud, [diikuti ujaran langsung]
  rationale: לֵאמֹר berfungsi memperkenalkan ujaran. Dalam bahasa Indonesia modern, maknanya tersampaikan secara alami melalui tanda baca tanpa perlu menerjemahkannya secara kaku sebagai 'dengan berkata'.
- source_word: לֹא יָרַד אוּרִיָּה אֶל בֵּיתוֹ
  choice: Uria tidak turun ke rumahnya
  rationale: ירד secara harfiah berarti 'turun'. Terjemahan ini mempertahankan idiom Ibrani dan pengulangannya yang penting dalam adegan tersebut.
- source_word: בֵּיתוֹ / בֵּיתֶךָ
  choice: rumahnya / rumahmu
  rationale: בַּיִת menunjuk pada rumah sebagai tempat tujuan, sekaligus mengandung implikasi kehidupan rumah tangga. 'Rumah' mempertahankan bentuk konkret dan pengulangan teks sumber.
- source_word: וַיֹּאמֶר
  choice: Lalu Daud berkata
  rationale: Waw konsekutif melanjutkan rangkaian cerita. 'Lalu' merupakan penghubung naratif yang alami dan tidak menambahkan hubungan sebab-akibat yang terlalu kuat.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel tanya negatif ini mengharapkan jawaban yang membenarkan. 'Bukankah' menyampaikan daya retoris tersebut secara idiomatis.
- source_word: מִדֶּרֶךְ
  choice: dari perjalanan
  rationale: דֶּרֶךְ secara leksikal berarti jalan atau perjalanan; dalam ungkapan ini, 'dari perjalanan' menyampaikan maksudnya dengan jelas.
- source_word: בָא
  choice: baru datang
  rationale: בוא berarti 'datang'. Kata 'baru' menyampaikan konteks kedatangan yang baru terjadi dan membuat pertanyaan alami dalam bahasa Indonesia, tanpa mengubahnya menjadi 'kembali'.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk pertanyaan mengenai alasan.
- source_word: לֹא יָרַדְתָּ אֶל בֵּיתֶךָ
  choice: engkau tidak turun ke rumahmu
  rationale: Mempertahankan verba 'turun' serta pengulangan bentuk sebelumnya, sehingga pola dan ketegangan naratif teks Ibrani tetap terdengar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Pronomina 'engkau' dipakai dalam dialog naratif untuk menjaga nada sastra tanpa menjadi kuno. Ungkapan 'turun ke rumah' sengaja dipertahankan dan dijelaskan secara implisit oleh konteks; terjemahan menjaga pengulangan Ibrani.
