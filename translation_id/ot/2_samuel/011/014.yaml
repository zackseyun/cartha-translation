  text: In the morning[a], David wrote a letter to Joab and sent it by the hand of Uriah.
translation:
  language: id
  text: Pada pagi hari, Daud menulis sepucuk surat kepada Yoab dan mengirimkannya melalui Uria.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan Uria” atau “melalui perantaraan Uria.” Secara harfiah, bahasa Ibrani berbunyi “melalui tangan Uria,” sebuah ungkapan yang menunjukkan perantaraan atau penyampaian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pada pagi hari
  rationale: Rangkaian naratif וַיְהִי dilanjutkan oleh keterangan waktu. Dalam bahasa Indonesia, “Pada pagi hari” menyampaikan peralihan waktu dan alur secara alami tanpa formula harfiah yang kaku.
- source_word: וַיִּכְתֹּב
  choice: menulis
  rationale: Padanan langsung dan wajar bagi tindakan menulis dalam narasi.
- source_word: סֵפֶר
  choice: sepucuk surat
  rationale: Walaupun סֵפֶר dapat berarti dokumen tertulis secara umum, konteks pengiriman kepada Yoab menunjukkan surat. Kata penggolong “sepucuk” merupakan ungkapan Indonesia yang alami.
- source_word: אֶל יוֹאָב
  choice: kepada Yoab
  rationale: Preposisi אֶל menandai penerima surat; “kepada” adalah padanan Indonesia yang tepat.
- source_word: וַיִּשְׁלַח
  choice: mengirimkannya
  rationale: Akhiran “-nya” merujuk secara alami kepada surat yang baru disebutkan.
- source_word: בְּיַד אוּרִיָּה
  choice: melalui tangan Uria
  rationale: Ungkapan ini mempertahankan citra harfiah Ibrani sekaligus menyampaikan perantaraan atau pembawaan. Bentuk tersebut juga menjaga ironi bahwa Uria sendiri membawa surat itu.
