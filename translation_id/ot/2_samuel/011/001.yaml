source:
  edition: WLC
  text: וַ/יְהִי֩ לִ/תְשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מַּלְאֿכִ֗ים וַ/יִּשְׁלַ֣ח דָּוִ֡ד אֶת יוֹאָב֩ וְ/אֶת עֲבָדָ֨י/ו עִמּ֜/וֹ וְ/אֶת כָּל יִשְׂרָאֵ֗ל וַ/יַּשְׁחִ֨תוּ֙ אֶת בְּנֵ֣י עַמּ֔וֹן וַ/יָּצֻ֖רוּ עַל רַבָּ֑ה וְ/דָוִ֖ד יוֹשֵׁ֥ב בִּ/ירוּשָׁלִָֽם׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/001.yaml
  text: At the turn of the year[a], at the time when kings go out to battle, David sent Joab, his servants with him, and all Israel. They devastated the Ammonites and besieged Rabbah[b], but David remained in Jerusalem.
translation:
  language: id
  text: Pada pergantian tahun[a], ketika para raja maju berperang[b], Daud mengutus Yoab bersama para abdinya dan seluruh Israel. Mereka memporak-porandakan orang Amon dan mengepung Raba, tetapi Daud tetap tinggal di Yerusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada kembalinya tahun”; kemungkinan besar menunjuk pada musim semi, saat kegiatan perang biasanya dimulai kembali.
    reason: cultural_note
  - marker: b
    text: Bentuk Ibrani ini juga dapat dipahami sebagai “ketika para utusan keluar.” Namun, konteks peperangan sangat mendukung pembacaan “ketika para raja maju berperang.”
    reason: alternative_reading
lexical_decisions:
- source_word: לִתְשׁוּבַת הַשָּׁנָה
  choice: pada pergantian tahun
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada berbalik atau kembalinya tahun. Pilihan ini mempertahankan idiom waktunya tanpa langsung menggantinya dengan penafsiran musiman 'pada musim semi'.
- source_word: לְעֵת צֵאת הַמַּלְאֿכִים
  choice: ketika para raja biasanya maju berperang
  rationale: Konteks pengerahan pasukan, musim peperangan, dan ironi bahwa Daud justru tinggal di Yerusalem mendukung pengertian 'raja-raja'. Kata 'biasanya' menyatakan kebiasaan yang tersirat, sedangkan 'maju berperang' mengungkapkan maksud militer dari 'keluar' secara alami dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Padanan naratif yang wajar untuk tindakan seorang raja yang mengirim panglima dan para bawahannya menjalankan tugas.
- source_word: עֲבָדָיו
  choice: orang-orangnya
  rationale: Istilah Ibrani mencakup para abdi atau bawahan dalam dinas kerajaan. 'Orang-orangnya' tetap luas dan alami serta tidak mempersempit mereka menjadi pejabat atau perwira saja.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan ungkapan kolektif Ibrani, yang dalam konteks ini menunjuk kepada kekuatan tempur Israel tanpa menambahkan kata 'pasukan' ke teks utama.
- source_word: וַיַּשְׁחִתוּ
  choice: memporak-porandakan
  rationale: Bentuk kausatif verba שׁחת menyatakan tindakan penghancuran. Pilihan ini kuat dalam konteks perang tetapi tidak menyiratkan pemusnahan total, sebab pengepungan masih berlanjut.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Padanan etnonim yang alami dalam bahasa Indonesia untuk ungkapan harfiah 'anak-anak Amon'.
- source_word: וַיָּצֻרוּ עַל רַבָּה
  choice: mengepung Raba
  rationale: Verba צור dengan על secara langsung menyatakan pengepungan sebuah kota.
- source_word: יוֹשֵׁב
  choice: tetap tinggal
  rationale: Partisipel ini secara harfiah berarti duduk atau tinggal. Dalam kontras naratifnya, maksudnya ialah Daud tidak ikut maju bersama pasukan, sehingga 'tetap tinggal' menyampaikan daya ungkap tersebut secara alami.
- source_word: בִּירוּשָׁלִָם
  choice: di Yerusalem
  rationale: Bentuk baku nama tempat dalam bahasa Indonesia.
theological_decisions:
- issue: Pembacaan frasa musim peperangan לְעֵת צֵאת הַמַּלְאֿכִים
  choice: ketika para raja biasanya maju berperang
  alternative: ketika para utusan keluar
  rationale: Teks tertulis dapat dipahami sebagai 'para utusan', tetapi konteks militer, ungkapan sejajar, dan alur yang menonjolkan ketidakhadiran Daud mendukung pembacaan tradisional 'para raja'. Alternatif yang sungguh ada tetap dicatat agar ambiguitas tekstual tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Diksi dijaga tetap lugas serta bermartabat; 'maju berperang' dan 'tetap tinggal' mempertahankan kontras yang membentuk ironi naratif.
