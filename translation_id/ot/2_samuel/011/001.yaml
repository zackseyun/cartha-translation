    text: Secara harfiah, “pada kembalinya tahun”; kemungkinan besar menunjuk pada musim semi, saat kegiatan perang biasanya dimulai kembali.
    reason: cultural_note
  - marker: b
    text: Bentuk Ibrani ini juga dapat dipahami sebagai “ketika para utusan keluar.” Namun, konteks peperangan sangat mendukung pembacaan “ketika para raja maju berperang.”
    reason: alternative_reading
  revision_rationale: Revisi menghilangkan tambahan makna “biasanya,” memperjelas bahwa para abdi itu adalah milik Daud, dan memperhalus catatan alternatif tanpa menghilangkan ambiguitas pembacaan. Selebihnya, pilihan draf dipertahankan karena setia pada teks sumber dan alami dalam bahasa Indonesia baku.
