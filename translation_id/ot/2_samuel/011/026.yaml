  text: וַ/תִּשְׁמַע֙ אֵ֣שֶׁת אֽוּרִיָּ֔ה כִּי מֵ֖ת אוּרִיָּ֣ה אִישָׁ֑/הּ וַ/תִּסְפֹּ֖ד עַל בַּעְלָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/026.yaml
  text: When Uriah’s wife heard that Uriah her husband was dead[a], she mourned for her husband.
translation:
  language: id
  text: Ketika istri Uria mendengar bahwa Uria, suaminya, telah mati[a], ia meratapi suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sudah meninggal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: mendengar
  rationale: Kata kerja שׁמע dalam bentuk qal lazim berarti “mendengar”; dalam konteks ini, kata tersebut juga secara wajar menyiratkan menerima kabar tanpa perlu diperluas menjadi “mengetahui”.
- source_word: אֵשֶׁת אוּרִיָּה
  choice: istri Uria
  rationale: Frasa konstruksi ini paling alami dan tepat diterjemahkan sebagai hubungan perkawinan dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi kabar yang didengarnya, sehingga “bahwa” mencerminkan fungsi sintaksisnya.
- source_word: מֵת
  choice: telah mati
  rationale: מֵת menyatakan keadaan mati; setelah kata “mendengar”, “telah mati” alami dalam bahasa Indonesia dan menyampaikan bahwa kematian itu sudah terjadi.
- source_word: אוּרִיָּה אִישָׁהּ
  choice: Uria, suaminya
  rationale: Aposisi Ibrani dipertahankan secara alami dengan menyebut nama lalu hubungan perkawinannya.
- source_word: וַתִּסְפֹּד
  choice: ia meratapi
  rationale: ספד menunjuk pada tindakan berkabung atau meratap bagi orang mati; “meratapi” menjaga unsur tindakan dukacita yang lebih khusus daripada sekadar merasa sedih.
- source_word: עַל
  choice: —
  rationale: Makna preposisi עַל terserap secara idiomatis dalam verba transitif “meratapi”, sehingga tidak memerlukan padanan terpisah.
- source_word: בַּעְלָהּ
  choice: suaminya
  rationale: Dalam konteks perkawinan, בַּעַל secara langsung berarti “suami”; makna lain seperti “tuan” atau “pemilik” tidak sesuai di sini.
