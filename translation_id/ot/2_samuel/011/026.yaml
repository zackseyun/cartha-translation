translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat alami dan bermartabat. Aposisi “Uria, suaminya” mempertahankan bentuk sumber tanpa terdengar kaku; “meratapi” menyampaikan perkabungan atas orang mati secara ringkas.
