  text: Then Joab sent word and told David all the news of the battle[a].
translation:
  language: id
  text: Lalu Yoab mengutus seorang utusan untuk melaporkan kepada Daud seluruh berita tentang pertempuran itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala hal ihwal pertempuran itu.” Secara harfiah, bahasa Ibraninya berbunyi “segala perkataan pertempuran itu,” sebuah ungkapan untuk rincian atau laporan tentang pertempuran tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim kabar
  rationale: Secara harfiah berarti “mengirim”. Bersama verba pelaporan berikutnya, ungkapan ini secara wajar menyatakan bahwa Yoab mengirimkan sebuah laporan, kemungkinan melalui seorang utusan.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Bentuk baku nama diri ini dalam bahasa Indonesia.
- source_word: וַיַּגֵּד
  choice: melaporkan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan, menyatakan, atau melaporkan. Dalam konteks militer, “melaporkan” paling alami dan tepat.
- source_word: לְדָוִד
  choice: kepada Daud
  rationale: Preposisi לְ menyatakan penerima laporan dan diterjemahkan secara alami dengan “kepada”.
- source_word: אֵת כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: seluruh berita tentang pertempuran itu
  rationale: דִּבְרֵי secara harfiah berarti “perkataan-perkataan” atau “hal-hal”, tetapi dalam konteks pelaporan menunjuk pada berita, rincian, atau laporan mengenai pertempuran. Pilihan ini menyampaikan idiom Ibrani secara jelas tanpa menghilangkan cakupan “seluruh”.
- source_word: הַמִּלְחָמָה
  choice: pertempuran itu
  rationale: מִלְחָמָה dapat berarti perang atau pertempuran. Konteksnya adalah aksi militer tertentu, dan artikel tertentu הַ cocok diungkapkan dengan “itu”.
