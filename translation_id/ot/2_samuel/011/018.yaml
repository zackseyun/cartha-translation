translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. “Mengirim kabar dan melaporkan” mempertahankan kedua verba Ibrani sambil memperjelas bahwa yang dikirim adalah laporan; “berita” dipakai secara netral dalam arti informasi atau kabar, bukan program media.
