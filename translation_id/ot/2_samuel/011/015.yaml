base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/015.yaml
  text: He wrote in the letter[a], saying, "Set Uriah at the front of the hardest fighting, then withdraw from behind him so that he may be struck down and die."
translation:
  language: id
  text: Ia menulis dalam surat itu demikian, “Tempatkan Uria di garis depan pertempuran yang paling sengit.[a] Lalu mundurlah dari belakangnya, supaya ia terkena serangan dan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat pertempuran paling sengit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Ia menulis
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan tindakan lampau; kata sambung awal tidak perlu dinyatakan agar narasi Indonesia tetap alami.
- source_word: בַּסֵּפֶר
  choice: dalam surat itu
  rationale: Dalam konteks ini סֵפֶר adalah pesan tertulis yang dikirim Daud melalui Uria, sehingga 'surat' lebih tepat daripada arti luas 'kitab' atau 'dokumen'.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Infinitif kutipan ini memperkenalkan isi surat; 'demikian' merupakan pengantar kutipan yang ringkas dan wajar dalam bahasa Indonesia.
- source_word: הָבוּ אֶת אֽוּרִיָּה
  choice: Tempatkan Uria
  rationale: Imperatif jamak הָבוּ memerintahkan penempatan Uria pada posisi tertentu; 'tempatkan' mempertahankan nada perintah dan register yang bermartabat.
- source_word: אֶל מוּל פְּנֵי הַמִּלְחָמָה הַחֲזָקָה
  choice: di barisan depan, di tempat pertempuran paling sengit
  rationale: מוּל פְּנֵי menunjukkan posisi yang berhadapan langsung atau paling depan, sedangkan הַמִּלְחָמָה הַחֲזָקָה menunjuk pada pertempuran yang berat atau sengit. Rumusan ini menyampaikan posisi taktis dan intensitas pertempuran secara alami.
- source_word: וְשַׁבְתֶּם מֵאַחֲרָיו
  choice: Lalu mundurlah dari belakangnya
  rationale: שׁוּב di sini berarti berbalik atau mundur, dan מֵאַחֲרָיו secara khusus menyatakan bahwa pasukan di belakang Uria harus meninggalkannya tanpa perlindungan.
- source_word: וְנִכָּה
  choice: supaya ia terkena serangan
  rationale: Bentuk nifal dari נכה menyatakan bahwa Uria akan terkena pukulan atau serangan. Pilihan ini mempertahankan tindakan tersebut tanpa meleburkannya dengan verba berikutnya, 'mati'.
- source_word: וָמֵת
  choice: dan mati
  rationale: Verba terpisah ini dipertahankan untuk menampilkan dengan jelas tujuan mematikan dari perintah tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk perintah jamak Ibrani diterjemahkan dengan imperatif Indonesia yang tidak menandai jumlah. Tanda catatan kaki ditempatkan pada frasa yang memiliki alternatif leksikal, bukan sesudah kata 'surat'.
