  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל הַ/מַּלְאָ֗ךְ כֹּֽה תֹאמַ֤ר אֶל יוֹאָב֙ אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּֽי כָ/זֹ֥ה וְ/כָ/זֶ֖ה תֹּאכַ֣ל הֶ/חָ֑רֶב הַחֲזֵ֨ק מִלְחַמְתְּ/ךָ֧ אֶל הָ/עִ֛יר וְ/הָרְסָ֖/הּ וְ/חַזְּקֵֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/025.yaml
  text: Then David said to the messenger[a], “Thus you shall say to Joab, ‘Do not let this matter be evil in your eyes, for the sword devours one as well as another[c][b]. Strengthen your attack against the city and overthrow it.’ And encourage him.”
translation:
  language: id
  text: 'Lalu Daud berkata kepada utusan itu, “Katakanlah kepada Yoab begini: ‘Janganlah hal ini kaupandang buruk,[a] sebab pedang melahap yang satu maupun yang lain.[b] Gencarkanlah seranganmu terhadap kota itu dan runtuhkanlah kota itu.’ Berilah dia semangat.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Janganlah hal ini menjadi jahat di matamu.” Dapat juga diterjemahkan, “Janganlah hal ini membuatmu kesal.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah berbunyi, “sebab begini dan begitu pedang melahap,” yang menyatakan bahwa pedang membunuh orang yang satu maupun yang lain.
    reason: idiom_explanation
  - marker: c
    text: Atau, “Kuatkanlah dia.” Kata “dia” kemungkinan besar merujuk kepada Yoab.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada seorang pembawa berita manusia, bukan makhluk surgawi. “Utusan” wajar dan tepat dalam bahasa Indonesia.
- source_word: כֹּה תֹאמַר
  choice: Katakanlah ... begini
  rationale: Ungkapan ini merupakan formula untuk menyampaikan pesan secara langsung. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan fungsi formula tersebut.
- source_word: אַל יֵרַע בְּעֵינֶיךָ אֶת הַדָּבָר הַזֶּה
  choice: Janganlah hal ini kaupandang buruk
  rationale: Terjemahan ini mempertahankan gambaran penilaian “di matamu” melalui kata “pandang”, termasuk nuansa moral dari רָע, tanpa menjadi kaku dalam bahasa Indonesia.
- source_word: כִּי כָזֹה וְכָזֶה תֹּאכַל הֶחָרֶב
  choice: sebab pedang melahap yang satu maupun yang lain
  rationale: “Melahap” mempertahankan metafora vivid dari אָכַל, sedangkan “yang satu maupun yang lain” menyampaikan ungkapan idiomatis כָזֹה וְכָזֶה tentang korban perang yang tidak dapat dipastikan atau dibeda-bedakan.
- source_word: הַחֲזֵק מִלְחַמְתְּךָ אֶל הָעִיר
  choice: Gencarkanlah seranganmu terhadap kota itu
  rationale: Secara harfiah frasa ini menyuruh Yoab menguatkan pertempurannya terhadap kota. Dalam konteks pengepungan, “gencarkanlah seranganmu” menyampaikan tindakan militer yang dimaksud dengan bahasa Indonesia yang alami.
- source_word: וְהָרְסָהּ
  choice: dan runtuhkanlah kota itu
  rationale: Kata kerja הָרַס berarti merobohkan atau menghancurkan. Objek “kota itu” diulangi agar rujukan akhiran feminin tunggal dalam bahasa Ibrani tetap jelas dalam bahasa Indonesia.
- source_word: וְחַזְּקֵהוּ
  choice: Berilah dia semangat
  rationale: Perintah ini ditujukan kepada utusan dan akhiran maskulin tunggal paling wajar merujuk kepada Yoab. Dalam konteks pesan yang menguatkan hati, “berilah dia semangat” lebih alami daripada terjemahan harfiah “kuatkanlah dia”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Metafora “pedang melahap” dipertahankan, sementara perintah militer diterjemahkan secara idiomatis. Tanda kutip membedakan perkataan Daud kepada utusan dari pesan yang harus disampaikan kepada Yoab.
