base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/012.yaml
  text: Then David said to Uriah[a], “Stay here today also, and tomorrow I will send you away.” So Uriah stayed in Jerusalem that day and the next day.
translation:
  language: id
  text: Lalu Daud berkata kepada Uria, “Tinggallah di sini hari ini juga, dan besok aku akan menyuruhmu pergi.” Maka Uria tinggal di Yerusalem pada hari itu dan keesokan harinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: שֵׁב בָּזֶה
  choice: Tinggallah di sini
  rationale: Dalam konteks ini, ישׁב berarti tetap berada sementara di suatu tempat, bukan sekadar duduk; בָּזֶה bersifat deiktis, yaitu “di sini”.
- source_word: גַּם הַיּוֹם
  choice: hari ini juga
  rationale: “Juga” mempertahankan fungsi גַּם, yakni menambahkan hari itu kepada waktu Uria sudah berada di Yerusalem.
- source_word: וּמָחָר אֲשַׁלְּחֶךָּ
  choice: dan besok aku akan menyuruhmu pergi
  rationale: שׁלח berarti mengutus atau menyuruh pergi. Dalam konteks ini, frasa tersebut menyatakan bahwa Daud akan melepas Uria untuk pergi pada hari berikutnya.
- source_word: וַיֵּשֶׁב
  choice: Maka ... tinggal
  rationale: “Tinggal” menjaga hubungan leksikal dengan perintah sebelumnya, sedangkan “maka” menyampaikan kelanjutan dan akibat dalam narasi.
- source_word: בַּיּוֹם הַהוּא וּמִמָּחֳרָת
  choice: pada hari itu dan keesokan harinya
  rationale: Ungkapan ini menunjuk pada hari tersebut dan hari sesudahnya. “Keesokan harinya” jelas dan alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “hari” dipertahankan agar urutan waktu tetap jelas, dan sapaan orang kedua tunggal diterjemahkan secara alami tanpa menambahkan gelar atau unsur penafsiran.
