  text: So when Joab was watching the city[a], he stationed Uriah in the place where he knew the mighty men were.
translation:
  language: id
  text: Ketika Yoab mengawasi kota itu, ia menempatkan Uria di tempat yang ia ketahui terdapat para pejuang tangguh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang perkasa” atau “prajurit-prajurit kuat.” Frasa Ibrani אַנְשֵׁי חַיִל di sini mengacu kepada para petempur yang cakap atau menakutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹר ... אֶל־הָעִיר
  choice: ketika ... mengawasi kota itu
  rationale: Infinitif dengan בְּ membentuk klausa waktu. Dalam konteks pengepungan, שׁמר dengan אֶל menunjuk pada pengamatan atau pemantauan kota; 'mengawasi' alami dalam bahasa Indonesia tanpa mempersempit makna menjadi tindakan menyerang.
- source_word: וַיִּתֵּן אֶת־אוּרִיָּה
  choice: ia menempatkan Uria
  rationale: נתן secara harfiah berarti 'memberikan/meletakkan', tetapi dalam konteks pengerahan pasukan berarti menempatkan seseorang pada posisi tertentu.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Padanan langsung yang tetap alami; nuansa posisi militer sudah tersampaikan melalui verba 'menempatkan'.
- source_word: יָדַע
  choice: diketahuinya
  rationale: Mempertahankan arti umum ידע, 'mengetahui', dan secara alami menghubungkannya dengan lokasi yang dimaksud.
- source_word: אַנְשֵׁי חַיִל
  choice: para pejuang tangguh
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada orang-orang yang cakap dan kuat dalam pertempuran. 'Pejuang tangguh' jelas bagi pembaca modern dan tidak mengesankan gelar teknis bagi pasukan elit Daud.
- source_word: שָׁם
  choice: dijaga oleh
  rationale: Adverbia lokatif 'di sana' terserap secara idiomatis dalam klausa relatif tentang tempat itu; bentuk 'dijaga oleh' menjelaskan keberadaan para pejuang pada lokasi tersebut tanpa mengubah fungsi lokatif.
- source_word: וַיְהִי
  choice: ketika
  rationale: Dalam rangkaian narasi, וַיְהִי bersama klausa infinitif memperkenalkan keadaan waktu; 'ketika' menghasilkan alur Indonesia yang wajar tanpa ungkapan kaku 'terjadilah'.
