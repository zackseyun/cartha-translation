  text: וַ/יֹּ֨אמֶר אוּרִיָּ֜ה אֶל דָּוִ֗ד הָ֠/אָרוֹן וְ/יִשְׂרָאֵ֨ל וִֽ/יהוּדָ֜ה יֹשְׁבִ֣ים בַּ/סֻּכּ֗וֹת וַ/אדֹנִ֨/י יוֹאָ֜ב וְ/עַבְדֵ֤י אֲדֹנִ֨/י עַל פְּנֵ֤י הַ/שָּׂדֶה֙ חֹנִ֔ים וַ/אֲנִ֞י אָב֧וֹא אֶל בֵּיתִ֛/י לֶ/אֱכֹ֥ל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׁכַּ֣ב עִם אִשְׁתִּ֑/י חַיֶּ֨/ךָ֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ אִֽם אֶעֱשֶׂ֖ה אֶת הַ/דָּבָ֥ר הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/011.yaml
  text: Uriah said to David[a], “The ark, and Israel and Judah, are staying in shelters, and my lord Joab and the servants of my lord are camped in the open field. Shall I then go to my house to eat and to drink and to lie with my wife? As surely as you live, and as your soul lives[c][b], I will not do this thing.”
translation:
  language: id
  text: Uria berkata kepada Daud, “Tabut itu, orang Israel, dan Yehuda sedang tinggal di pondok-pondok[a], sedangkan tuanku Yoab dan para hamba tuanku sedang berkemah di padang terbuka. Masakan aku pulang ke rumah untuk makan, minum, dan berbaring dengan istriku? Demi hidupmu dan demi nyawamu[b], aku tidak akan melakukan hal itu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pondok-pondok”; istilah ini menunjuk pada tempat tinggal atau tempat berteduh sementara di medan perang.
    reason: lexical_alternative
  - marker: b
    text: 'Ini adalah formula sumpah Ibrani: “Demi hidupmu dan demi hidupmu sendiri, jika aku melakukan hal ini.” Kata “jika” dalam formula ini menyatakan penolakan yang sangat tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: Tabut itu
  rationale: Teks Ibrani hanya menyebut ‘tabut’ dengan kata sandang. ‘Tabut itu’ mempertahankan bentuk tersebut tanpa menambahkan ‘Allah’ atau ‘perjanjian’ yang tidak terdapat dalam ayat ini.
- source_word: יֹשְׁבִים בַּסֻּכּוֹת
  choice: tinggal di pondok-pondok sementara
  rationale: סֻכּוֹת menunjuk pada pondok atau tempat berteduh sementara; pilihan ini membedakannya dari kemah dan menyampaikan keadaan darurat di medan perang.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sebutan hormat untuk manusia dalam konteks ini; ‘tuanku’ alami dan mempertahankan hubungan sosial yang tersirat.
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: di padang terbuka
  rationale: Ungkapan ini secara harfiah berarti ‘di atas permukaan padang’ dan menekankan keadaan terbuka di luar tempat tinggal.
- source_word: חֹנִים
  choice: berkemah
  rationale: Partisip ini menggambarkan keberadaan pasukan yang sedang menetap dalam perkemahan.
- source_word: וַאֲנִי אָבוֹא אֶל בֵּיתִי
  choice: Masakan aku pulang ke rumah
  rationale: Bentuk pertanyaan retoris menyatakan keberatan dan penolakan Uria; ‘masakan’ menyampaikan daya retoris tersebut secara wajar dalam bahasa Indonesia.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׁכַּב עִם אִשְׁתִּי
  choice: untuk makan, minum, dan berbaring dengan istriku
  rationale: Rangkaian tindakan dipertahankan. ‘Berbaring dengan istriku’ menjaga eufemisme seksual Ibrani secara jelas tetapi bermartabat.
- source_word: חַיֶּךָ וְחֵי נַפְשֶׁךָ
  choice: Demi hidupmu dan demi nyawamu
  rationale: Pilihan ini mempertahankan formula sumpah ganda dan unsur נֶפֶשׁ tanpa membuat ungkapannya terlalu harfiah atau janggal.
- source_word: אִם אֶעֱשֶׂה אֶת הַדָּבָר הַזֶּה
  choice: aku tidak akan melakukan hal itu
  rationale: Sesudah formula sumpah, אִם merupakan bentuk eliptis yang menyatakan penyangkalan kuat; terjemahan eksplisit ini menyampaikan maksudnya dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas tabut
  choice: Tidak memperluas ‘tabut’ menjadi ‘Tabut Allah’ atau ‘Tabut Perjanjian’.
  alternative: Tabut Allah; Tabut Perjanjian
  rationale: Referennya dapat diketahui dari konteks, tetapi gelar yang diperluas tidak terdapat dalam teks Ibrani ayat ini.
- issue: Formula sumpah eliptis
  choice: Menerjemahkan akibat pragmatisnya sebagai penolakan tegas.
  alternative: 'Menerjemahkan secara harfiah: ‘jika aku melakukan hal itu’.'
  rationale: Terjemahan harfiah tanpa unsur yang dilesapkan dapat disalahpahami sebagai kalimat bersyarat yang tidak selesai; konteks dan tata bahasa sumpah Ibrani menuntut makna negatif yang kuat.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. ‘Masakan’ dipakai untuk menyampaikan pertanyaan retoris yang bernada keberatan, sedangkan ‘berbaring dengan istriku’ mempertahankan eufemisme sumber. Semua penanda catatan kaki muncul dalam teks utama.
