translation:
  language: id
  text: 'Perempuan itu mengandung, lalu ia mengirimkan kabar kepada Daud: “Aku hamil.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Bentuk dari הרה menyatakan mulai atau menjadi hamil. Dalam konteks ini, “mengandung” ringkas, alami, dan mempertahankan aspek peristiwa tanpa perlu menambahkan keterangan.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: אִשָּׁה dapat berarti “perempuan” atau “istri”. Klausa ini merujuk kembali kepada Batsyeba tanpa secara eksplisit menonjolkan statusnya sebagai istri, sehingga “perempuan itu” paling langsung mencerminkan bahasa Ibrani.
- source_word: וַתִּשְׁלַח וַתַּגֵּד לְדָוִד
  choice: lalu menyuruh orang menyampaikan kepada Daud
  rationale: Secara harfiah rangkaian ini berbunyi “lalu ia mengutus dan memberitahukan kepada Daud”. Karena yang dikirim tersirat sebagai utusan atau pesan, ungkapan Indonesia ini menyampaikan maksudnya secara alami tanpa menyatakan bahwa Batsyeba sendiri menemui Daud.
- source_word: הָרָה אָנֹכִי
  choice: Aku hamil
  rationale: Adjektiva predikatif הָרָה dengan pronomina אָנֹכִי menyatakan keadaan kini. “Aku hamil” merupakan padanan modern yang langsung dan wajar.
