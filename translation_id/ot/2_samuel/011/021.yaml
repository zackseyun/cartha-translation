  text: מִֽי הִכָּ֞ה אֶת אֲבִימֶ֣לֶךְ בֶּן יְרֻבֶּ֗שֶׁת הֲ/לֽוֹא אִשָּׁ֡ה הִשְׁלִ֣יכָה עָלָי/ו֩ פֶּ֨לַח רֶ֜כֶב מֵ/עַ֤ל הַֽ/חוֹמָה֙ וַ/יָּ֣מָת בְּ/תֵבֵ֔ץ לָ֥/מָּה נִגַּשְׁתֶּ֖ם אֶל הַֽ/חוֹמָ֑ה וְ/אָ֣מַרְתָּ֔ גַּ֗ם עַבְדְּ/ךָ֛ אוּרִיָּ֥ה הַ/חִתִּ֖י מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/021.yaml
  text: Who struck down Abimelech son of Jerubbesheth? Was it not a woman who threw an upper millstone on him from the wall[a], so that he died at Thebez? Why did you go near the wall?’ Then you shall say[c][b], ‘Your servant Uriah the Hittite is dead also.’
translation:
  language: id
  text: “Siapa yang menewaskan Abimelekh anak Yerubeset[a]? Bukankah seorang perempuan melemparkan batu kilangan bagian atas[b] dari atas tembok sehingga mengenainya, dan ia mati di Tebes[c]? Mengapa kalian mendekati tembok?” Maka katakanlah, “Hamba-Mu, Uria orang Het itu, juga sudah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “Yerubeset”; bandingkan Hakim-Hakim 9:1, yang memakai nama “Yerubaal”.
    reason: alternative_reading
  - marker: b
    text: Atau “sebuah pecahan batu kilangan”; ungkapan Ibraninya kemungkinan menunjuk pada batu kilangan bagian atas.
    reason: lexical_alternative
  - marker: c
    text: Lihat Hakim-Hakim 9:53 untuk peristiwa yang dirujuk di sini.
    reason: cross_reference
lexical_decisions:
- source_word: הִכָּה
  choice: menewaskan
  rationale: Kata kerja ini pada dasarnya berarti ‘memukul’, tetapi dalam konteks ini pukulan tersebut menyebabkan kematian. ‘Menewaskan’ menyampaikan hasil fatalnya secara alami tanpa menghilangkan hubungan dengan serangan yang disebutkan.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבֶּשֶׁת
  choice: Abimelekh bin Yerubeset
  rationale: Mengikuti bentuk nama dalam teks Ibrani WLC, יְרֻבֶּשֶׁת, tanpa menyelaraskannya secara diam-diam dengan ‘Yerubaal’ dalam Hakim-Hakim 9.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Bentuk tanya negatif ini mengharapkan jawaban yang membenarkan pernyataan tersebut; ‘bukankah’ mempertahankan daya retorisnya dalam bahasa Indonesia.
- source_word: פֶּלַח רֶכֶב
  choice: batu kilangan bagian atas
  rationale: Ungkapan ini kemungkinan menunjuk pada batu kilangan atas, sebagaimana konteks paralelnya dalam Hakim-Hakim 9:53. Karena פֶּלַח juga dapat dipahami sebagai potongan atau pecahan, kemungkinan itu dicatat dalam catatan kaki.
- source_word: מֵעַל הַחוֹמָה
  choice: dari atas tembok
  rationale: מֵעַל menyatakan gerak dari posisi di atas; terjemahan ini mempertahankan gambaran bahwa benda itu dijatuhkan dari bagian atas tembok.
- source_word: לָמָּה נִגַּשְׁתֶּם אֶל הַחוֹמָה
  choice: Mengapa kalian mendekati tembok?
  rationale: נגשׁ berarti mendekat. Bentuk jamak pada kata kerja dipertahankan dengan ‘kalian’, dan nada teguran tetap terbaca dari pertanyaannya.
- source_word: וְאָמַרְתָּ
  choice: Maka katakanlah
  rationale: Bentuk ini merupakan instruksi kepada pembawa pesan tentang apa yang harus dikatakannya jika raja mengajukan teguran tersebut.
- source_word: עַבְדְּךָ
  choice: Hambamu
  rationale: Dalam sapaan kepada raja, עבד merupakan sebutan tunduk yang wajar diterjemahkan ‘hamba’, bukan pernyataan yang harus dipersempit menjadi status budak.
- source_word: גַּם
  choice: juga
  rationale: 'Mempertahankan makna aditif: kematian Uria merupakan tambahan pada laporan tentang korban-korban lain.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk ‘kalian’ dipakai untuk menandai orang kedua jamak dalam pertanyaan, sedangkan ‘hambamu’ mempertahankan register sapaan kepada raja. Ejaan nama mengikuti transliterasi Indonesia yang mudah dibaca.
