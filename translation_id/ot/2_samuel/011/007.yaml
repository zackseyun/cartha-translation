translation:
  language: id
  text: Ketika Uria datang kepada Daud, Daud menanyakan keadaan Yoab, keadaan pasukan, dan keadaan perang itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... אֵלָיו
  choice: datang menghadap Daud
  rationale: Secara harfiah berarti ‘datang kepadanya’. Dalam konteks pemanggilan Uria oleh raja, ‘menghadap Daud’ alami dalam bahasa Indonesia dan memperjelas rujukan pronomina tanpa mengubah peristiwa.
- source_word: וַיִּשְׁאַל
  choice: menanyakan
  rationale: Kata שׁאל menyatakan tindakan bertanya atau mencari keterangan; ‘menanyakan’ cocok dengan rangkaian objek yang mengikutinya.
- source_word: לִשְׁלוֹם
  choice: keadaan ... dan jalannya
  rationale: Dalam konstruksi ini שָׁלוֹם menunjuk pada keadaan atau kesejahteraan. ‘Keadaan’ wajar bagi Yoab dan pasukan, sedangkan ‘jalannya’ menyampaikan secara idiomatis keadaan peperangan tanpa mengartikan שָׁלוֹם sebagai ‘damai’.
- source_word: יוֹאָב
  choice: Yoab
  rationale: Nama diri ditransliterasikan menurut konvensi Alkitab bahasa Indonesia.
- source_word: הָעָם
  choice: pasukan
  rationale: Walaupun עָם secara umum berarti ‘rakyat/bangsa’, konteks medan perang menunjukkan orang-orang yang berada bersama Yoab, yakni pasukan.
- source_word: הַמִּלְחָמָה
  choice: peperangan
  rationale: מִלְחָמָה dapat berarti perang, peperangan, atau pertempuran. ‘Peperangan’ cocok untuk kampanye militer yang sedang berlangsung dan berpadu alami dengan ‘jalannya’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan Ibrani לִשְׁלוֹם dipertahankan secara semantis, tetapi diragamkan secara idiomatis menjadi ‘keadaan’ untuk orang/pasukan dan ‘jalannya’ untuk peperangan. Nama Daud ditambahkan sebagai rujukan eksplisit bagi akhiran pronominal ‘kepadanya’ agar jelas dalam ayat yang berdiri sendiri.
