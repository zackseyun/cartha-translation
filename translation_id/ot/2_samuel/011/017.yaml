base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/017.yaml
  text: The men of the city came out and fought against Joab[a], and some of the people among David’s servants fell[b]; Uriah the Hittite also died.
translation:
  language: id
  text: Orang-orang kota itu keluar lalu berperang melawan Yoab, dan beberapa orang dari antara hamba-hamba Daud gugur[a]; Uria, orang Het itu, juga tewas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rakyat, dari hamba-hamba Daud,” suatu ungkapan partitif yang berarti bahwa beberapa orang dari antara hamba-hamba Daud gugur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Kata kerja יצא menyatakan gerak keluar. Bahasa Indonesia tidak perlu memilih secara deiktis antara ‘datang keluar’ dan ‘pergi keluar’, sehingga ‘keluar’ mempertahankan makna sumber secara alami.
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Ungkapan konstruksi ini secara harfiah berarti ‘orang-orang kota’. Dalam konteks pertempuran mereka jelas laki-laki yang bertempur, tetapi ‘orang-orang kota itu’ lebih alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak dinyatakan.
- source_word: וַיִּלָּחֲמוּ אֶת יוֹאָב
  choice: berperang melawan Yoab
  rationale: Ungkapan perang dengan אֶת di sini menunjukkan tindakan bermusuhan terhadap Yoab dan pasukannya; ‘melawan’ menyampaikan relasi tersebut dengan jelas.
- source_word: וַיִּפֹּל
  choice: gugur
  rationale: Dalam konteks pertempuran, נפל merupakan idiom bagi korban yang tewas. ‘Gugur’ mempertahankan idiom militer itu dan lebih wajar daripada terjemahan harfiah ‘jatuh’.
- source_word: מִן הָעָם מֵעַבְדֵי דָוִד
  choice: beberapa orang dari pasukan Daud
  rationale: Dua frasa dengan מִן bersifat partitif dan menunjuk kepada sejumlah orang dalam kelompok Daud yang sedang bertempur. ‘Pasukan Daud’ menyampaikan referen kontekstual secara ringkas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיָּמָת גַּם אוּרִיָּה הַחִתִּי
  choice: Uria orang Het itu juga tewas
  rationale: גַּם dipertahankan sebagai ‘juga’, yang menonjolkan bahwa Uria termasuk di antara korban. ‘Tewas’ alami untuk kematian dalam pertempuran, sedangkan ‘orang Het’ adalah sebutan etnis yang lazim.
