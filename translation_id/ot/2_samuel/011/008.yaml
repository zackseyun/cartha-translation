  naturalness: Teks draf pada umumnya baku dan jelas. Namun, “kiriman dari raja dibawa menyusul dia” terdengar agak kaku serta memperkenalkan bentuk pasif yang tidak dinyatakan dalam bahasa Ibrani. “Sebuah kiriman dari raja menyusulnya” lebih alami dalam narasi Indonesia dan mempertahankan gagasan bahwa kiriman itu pergi setelah Uria.
  terminology: “Daud,” “Uria,” “istana raja,” dan “basuhlah kakimu” sesuai dengan register naratif Alkitab bahasa Indonesia modern. Catatan budaya untuk “basuhlah kakimu” perlu ditambahkan dan ditautkan pada ungkapan itu, sebab ungkapan literal ini dapat menyiratkan penyegaran diri setelah perjalanan atau pulang untuk menetap/beristirahat.
