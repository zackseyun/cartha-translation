  yaml_path: translation/ot/2_samuel/011/008.yaml
  text: Then David said to Uriah[a], “Go down to your house and wash your feet.” So Uriah went out from the king’s house[b], and a present from the king went out after him.
translation:
  language: id
  text: Lalu Daud berkata kepada Uria, “Turunlah ke rumahmu dan basuhlah kakimu.[b]” Uria pun keluar dari istana raja, lalu sebuah kiriman dari raja menyusulnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian dari raja” atau “jatah dari raja.” Istilah Ibraninya dapat merujuk pada sesuatu yang dibawa atau dikirim, termasuk pemberian atau jatah.
    reason: lexical_alternative
  - marker: b
    text: “Basuhlah kakimu” adalah ungkapan harfiah yang juga dapat menyiratkan penyegaran diri atau pulang untuk beristirahat setelah perjalanan.
    reason: cultural_note
lexical_decisions:
- source_word: רֵד
  choice: Pergilah
  rationale: Kata kerja ירד secara harfiah berarti ‘turunlah’, tetapi dalam bahasa Indonesia arah turun tidak pasti jelas dan ‘pergilah’ lebih alami tanpa mengubah tindakan yang diperintahkan.
- source_word: לְבֵיתְךָ
  choice: ke rumahmu
  rationale: Mempertahankan arti konkret בַּיִת dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: וּרְחַץ רַגְלֶיךָ
  choice: dan basuhlah kakimu
  rationale: Mempertahankan ungkapan konkret Ibrani, termasuk kemungkinan makna penyegaran diri atau beristirahat di rumah, tanpa memasukkan implikasi itu ke teks utama.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: dari istana raja
  rationale: Secara harfiah ‘dari rumah raja’; dalam konteks kediaman resmi tempat Uria menghadap Daud, ‘istana raja’ adalah padanan Indonesia yang jelas dan alami.
- source_word: מַשְׂאַת הַמֶּלֶךְ
  choice: kiriman dari raja
  rationale: מַשְׂאֵת dapat menunjuk pada sesuatu yang dibawa atau dikirim, termasuk pemberian atau jatah. ‘Kiriman’ mempertahankan keluasan makna itu dan sesuai dengan konstruksi bahwa benda tersebut menyusul Uria.
- source_word: אַחֲרָיו
  choice: menyusul dia
  rationale: Menyampaikan gerak ‘setelah/di belakangnya’ secara alami dalam rangkaian naratif Indonesia.
