    rationale: Teks Ibrani menyatakan bahwa kiriman raja “keluar/pergi” sesudah Uria. Mengatakan kiriman itu “menyusulnya” menyampaikan urutan dan gerak tersebut dengan lebih alami tanpa menyatakan pelaku pembawanya.
