translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. ‘Basuhlah kakimu’ dipertahankan sebagai ungkapan konkret yang bermartabat; ‘istana raja’ dipilih agar rujukan tempat jelas. Penanda catatan kaki ditempatkan setelah klausa yang memuat istilah ambigu.
