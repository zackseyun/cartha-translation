base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/002.yaml
  text: Then at evening time David arose from his bed and walked on the roof of the king’s house[a], and from the roof he saw a woman bathing[b]; and the woman was very beautiful in appearance.
translation:
  language: id
  text: Pada waktu petang, Daud bangun dari tempat tidurnya lalu berjalan-jalan di atas atap istana raja. Dari atas atap itu ia melihat seorang perempuan sedang mandi; perempuan itu sangat cantik rupanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לְעֵת הָעֶרֶב
  choice: Menjelang petang
  rationale: Ungkapan ini secara alami menyatakan latar waktu sekaligus meneruskan alur narasi; unsur וַיְהִי tidak perlu diterjemahkan secara kaku sebagai 'terjadilah'.
- source_word: וַיָּקָם ... מֵעַל מִשְׁכָּבוֹ
  choice: bangun dari tempat tidurnya
  rationale: מִשְׁכָּב adalah tempat untuk berbaring dan dalam konteks ini paling wajar diterjemahkan 'tempat tidur', tanpa harus menentukan bentuk perabotnya.
- source_word: וַיִּתְהַלֵּךְ
  choice: berjalan-jalan
  rationale: Bentuk hitpael menyiratkan gerak yang berlangsung atau berulang; 'berjalan-jalan' menangkap nuansa itu secara ringkas tanpa menambahkan motif.
- source_word: עַל גַּג בֵּית הַמֶּלֶךְ
  choice: di atas atap istana raja
  rationale: Secara harfiah berarti 'atap rumah raja', tetapi dalam konteks kediaman kerajaan, 'istana raja' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: וַיַּרְא אִשָּׁה רֹחֶצֶת
  choice: ia melihat seorang perempuan sedang mandi
  rationale: Partisip רֹחֶצֶת menunjukkan tindakan yang sedang berlangsung; 'sedang mandi' menyampaikannya secara alami.
- source_word: מֵעַל הַגָּג
  choice: Dari atas atap itu
  rationale: Frasa ini paling alami dipahami sebagai titik pandang Daud. Penempatan pada awal klausa mempertahankan rincian ruang dengan jelas.
- source_word: טוֹבַת מַרְאֶה מְאֹד
  choice: sangat elok parasnya
  rationale: Ungkapan ini menekankan penampilan yang menyenangkan atau indah. 'Sangat elok parasnya' mempertahankan fokus visual dengan ragam bahasa naratif yang bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Istana raja' dipilih sebagai padanan kontekstual bagi בֵּית הַמֶּלֶךְ; susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan atau titik pandang dari atap.
