  text: And he commanded the messenger[a], saying, “When you have finished telling the king all the news of the battle,”
translation:
  language: id
  text: Lalu Yoab memberi perintah kepada utusan itu, katanya, “Setelah engkau selesai menyampaikan kepada raja seluruh kabar tentang pertempuran itu,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Lalu Daud memberi perintah
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan צוה menyatakan pemberian perintah. Subjek tersirat diperjelas sebagai Daud berdasarkan konteks dekat agar wajar dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: הַמַּלְאָךְ
  choice: utusan itu
  rationale: Dalam konteks laporan militer, מַלְאָךְ menunjuk kepada pembawa pesan manusia, bukan malaikat. 'Utusan' merupakan padanan yang alami dan bermartabat.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Ungkapan ini memperkenalkan ucapan langsung. 'Katanya' mempertahankan fungsi naratifnya secara alami dalam bahasa Indonesia.
- source_word: כְּכַלּוֹתְךָ
  choice: Setelah engkau selesai
  rationale: Prefiks כ dengan infinitif konstruktus membentuk anak kalimat waktu. 'Setelah ... selesai' menyampaikan urutan tindakan tanpa menambahkan gagasan kesegeraan.
- source_word: כָּל דִּבְרֵי הַמִּלְחָמָה
  choice: seluruh kabar tentang pertempuran itu
  rationale: Secara harfiah ungkapan ini berarti seluruh perkataan atau perkara pertempuran. Dalam konteks seorang utusan yang melapor kepada raja, 'seluruh kabar tentang pertempuran' secara idiomatis menyatakan laporan lengkap tanpa terjemahan kaku 'semua perkataan'.
- source_word: לְדַבֵּר אֶל הַמֶּלֶךְ
  choice: menyampaikan kepada raja
  rationale: Secara leksikal berarti berbicara kepada raja, tetapi dalam konteks ini tindakannya ialah menyampaikan laporan. Pilihan ini alami dalam bahasa Indonesia dan tidak mengubah isi yang disampaikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti 'engkau' dipakai karena seorang atasan berbicara langsung kepada utusannya. Ayat dibiarkan berakhir dengan koma karena ucapan dan kalimat bersyarat berlanjut ke ayat berikutnya.
