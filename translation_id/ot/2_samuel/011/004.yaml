source:
  edition: WLC
  text: וַ/יִּשְׁלַח֩ דָּוִ֨ד מַלְאָכִ֜ים וַ/יִּקָּחֶ֗/הָ וַ/תָּב֤וֹא אֵלָי/ו֙ וַ/יִּשְׁכַּ֣ב עִמָּ֔/הּ וְ/הִ֥יא מִתְקַדֶּ֖שֶׁת מִ/טֻּמְאָתָ֑/הּ וַ/תָּ֖שָׁב אֶל בֵּיתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/004.yaml
  text: So David sent messengers and took her[a], and she came to him, and he lay with her. Now she was purifying herself from her uncleanness. Then she returned to her house.
translation:
  language: id
  text: Lalu Daud mengirim para utusan untuk mengambil perempuan itu. Perempuan itu datang kepadanya, lalu Daud tidur dengannya. Saat itu perempuan itu sedang menyucikan diri dari kenajisannya[a]. Kemudian perempuan itu kembali ke rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia telah menyucikan diri dari kenajisannya.” Bahasa Ibrani dapat dipahami sebagai catatan latar tentang pentahiran ritual sesudah menstruasi.
    reason: Mempertahankan kemungkinan bahwa klausa partisipial itu dipahami sebagai keterangan latar dengan tindakan yang telah selesai, dan menjelaskan konteks ritual tanpa menambahkan penilaian mengenai perempuan itu.
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Bentuk naratif dari שלח secara langsung menyatakan bahwa Daud mengutus atau mengirim orang; “mengirim” alami dalam bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: מַלְאָכִים di sini berarti para pembawa pesan atau orang suruhan, bukan malaikat; bentuk ulang menyatakan jamak dengan jelas.
- source_word: וַיִּקָּחֶהָ
  choice: mengambil perempuan itu
  rationale: Mempertahankan daya ungkap langsung לקח dan narasi Ibrani yang singkat serta berbobot, tanpa memperhalusnya menjadi sekadar “menjemput” atau menambahkan rincian bahwa ia dibawa.
- source_word: וַתָּבֹוא אֵלָיו
  choice: Perempuan itu datang kepadanya
  rationale: Terjemahan langsung verba gerak בוא dengan אֶל; tidak menambahkan makna atau sikap yang tidak dinyatakan teks.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: Daud tidur dengannya
  rationale: “Tidur dengan” merupakan ungkapan Indonesia yang wajar untuk hubungan seksual dan mempertahankan ungkapan halus Ibrani; nama Daud diulang agar pelaku tetap jelas.
- source_word: וְהִיא מִתְקַדֶּשֶׁת מִטֻּמְאָתָהּ
  choice: Saat itu perempuan itu sedang menyucikan diri dari kenajisannya
  rationale: Partisipel Hitpael memberi informasi latar yang sedang berlangsung. “Menyucikan diri” menyampaikan tindakan pentahiran ritual, sedangkan “kenajisan” mempertahankan kategori ritual טֻמְאָה.
- source_word: וַתָּשָׁב אֶל־בֵּיתָהּ
  choice: Kemudian ia kembali ke rumahnya
  rationale: Menyampaikan kelanjutan urutan naratif secara alami dan mempertahankan makna konkret בַּיִת sebagai “rumah”.
theological_decisions:
- issue: Fungsi dan waktu klausa tentang pentahiran ritual
  choice: 'Diterjemahkan sebagai informasi latar yang sedang berlangsung: “Saat itu perempuan itu sedang menyucikan diri dari kenajisannya.”'
  alternative: “Ia telah menyucikan diri dari kenajisannya.”
  rationale: Bentuk partisipel Ibrani paling langsung mendukung keadaan atau tindakan latar, tetapi hubungan waktunya dengan tindakan sebelumnya dapat dipahami sebagai pentahiran yang telah dilakukan. Terjemahan utama mempertahankan aspek partisipial, sedangkan catatan kaki menyimpan kemungkinan pembacaan lampau selesai. Klausa ini dipahami dalam kategori kenajisan ritual, tanpa menyatakan penilaian tambahan tentang kesalahan atau ketidakbersalahan perempuan itu.
- issue: Cara menggambarkan tindakan Daud terhadap perempuan itu
  choice: Mempertahankan ungkapan ringkas “mengambil perempuan itu” tanpa menjelaskan tingkat paksaan atau persetujuan.
  alternative: “menyuruh menjemput perempuan itu” atau “membawa perempuan itu”
  rationale: לקח berarti “mengambil” dan dalam konteks ini dapat mencakup tindakan melalui para utusan. Terjemahan tidak boleh menghapus ketimpangan kuasa dalam narasi ataupun menambahkan rincian mengenai persetujuan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang ringkas dan bermartabat. “Perempuan itu” dipakai untuk memperjelas rujukan pronomina tanpa memasukkan nama Batsyeba yang tidak muncul dalam ayat ini. “Tidur dengannya” dipilih sebagai ungkapan alami namun tidak vulgar; “kenajisan” menandai konteks ritual.
