  source_fidelity: 'Terjemahan pada umumnya mengikuti urutan dan isi teks Ibrani: Daud mengutus, mengambil perempuan itu, perempuan itu datang kepadanya, Daud tidur dengannya, terdapat keterangan latar mengenai pentahiran ritual, lalu perempuan itu pulang. Namun, catatan kaki yang ada mencantumkan alternatif “mengambil dia,” yang bukan varian makna atau pembacaan yang bermakna dari teks sumber, dan jangkar catatan kaki ditempatkan pada frasa tindakan mengambil padahal isi catatan yang bernilai tekstual berkaitan dengan klausa pentahiran.'
