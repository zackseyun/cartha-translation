  text: So David sent word to Joab, “Send Uriah the Hittite to me.” And Joab sent Uriah to David.
translation:
  language: id
  text: 'Lalu Daud mengirim pesan kepada Yoab: “Kirimkanlah Uria, orang Het itu, kepadaku.” Lalu Yoab mengirim Uria kepada Daud.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל יוֹאָב
  choice: Lalu Daud menyampaikan kepada Yoab
  rationale: Secara harfiah שׁלח berarti 'mengirim'. Karena objek pengiriman tidak disebutkan dan langsung diikuti isi perintah, 'menyampaikan kepada' secara alami menyatakan bahwa Daud mengirim pesan atau perintah kepada Yoab tanpa menambahkan objek yang tidak tersurat.
- source_word: שְׁלַח אֵלַי
  choice: Suruhlah ... datang kepadaku
  rationale: Imperatif שׁלח dengan אֵלַי secara harfiah berarti 'kirimlah kepadaku'. Dalam bahasa Indonesia, ketika objeknya orang, 'suruhlah ... datang kepadaku' mengungkapkan arah dan daya perintah dengan jelas serta wajar.
- source_word: אֶת אוּרִיָּה הַחִתִּי
  choice: Uria, orang Het itu
  rationale: Nama אוּרִיָּה ditransliterasikan sebagai 'Uria'; bentuk gentilis הַחִתִּי diterjemahkan dengan istilah Indonesia yang lazim, 'orang Het'. Partikel penanda objek langsung אֶת tidak diterjemahkan.
- source_word: וַיִּשְׁלַח יוֹאָב אֶת אוּרִיָּה אֶל דָּוִד
  choice: Maka Yoab menyuruh Uria pergi kepada Daud
  rationale: Pengulangan שׁלח dipertahankan secara semantis dengan 'menyuruh ... pergi', ungkapan Indonesia yang alami untuk tindakan Yoab mengutus Uria kepada Daud. 'Maka' menandai kelanjutan dan pelaksanaan perintah dalam alur narasi.
