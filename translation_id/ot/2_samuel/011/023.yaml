base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/023.yaml
  text: The messenger said to David[a], “The men were stronger than we were, and they came out against us into the open field[b]; but we pressed them back as far as the entrance of the gate.”
translation:
  language: id
  text: Utusan itu berkata kepada Daud, “Orang-orang itu lebih kuat daripada kami[a]. Mereka keluar menyerang kami di medan terbuka, tetapi kami mendesak mereka mundur[b] sampai ke pintu gerbang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang-orang itu mengalahkan kami.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kami berada di atas mereka,” suatu idiom yang berarti bahwa kami menekan mereka atau mengambil tindakan menyerang mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: utusan
  rationale: Dalam konteks laporan militer ini, kata tersebut menunjuk kepada kurir manusia, bukan makhluk surgawi.
- source_word: כִּי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini memperkenalkan isi laporan dan secara alami sudah terwakili oleh awal kutipan langsung dalam bahasa Indonesia.
- source_word: גָבְרוּ עָלֵינוּ
  choice: lebih kuat daripada kami
  rationale: Ungkapan dengan עַל menyatakan bahwa pihak lawan lebih unggul atau menang atas mereka; bentuk komparatif ini mempertahankan nuansa sumber.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Terjemahan ini mengikuti kata Ibrani yang umum, tanpa mempersempitnya menjadi 'para prajurit', sementara konteks tetap menunjukkan bahwa mereka adalah pasukan lawan.
- source_word: וַיֵּצְאוּ אֵלֵינוּ הַשָּׂדֶה
  choice: mereka keluar menyerang kami di medan terbuka
  rationale: Konteks menggambarkan para pembela kota keluar untuk menghadapi pasukan Daud; 'menyerang' menyampaikan arah yang bermusuhan, dan 'medan terbuka' menjelaskan lokasi pertempuran secara alami.
- source_word: וַנִּהְיֶה עֲלֵיהֶם
  choice: kami mendesak mereka mundur
  rationale: Secara harfiah, 'kami berada di atas/melawan mereka'; dalam konteks militer, ungkapan ini menunjukkan bahwa pasukan Daud berbalik menekan lawan hingga ke gerbang.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: sampai ke pintu gerbang
  rationale: Frasa ini menyatakan batas pengejaran atau desakan, yakni hingga bukaan atau jalan masuk gerbang kota.
