  text: וְ/הָיָ֗ה אִֽם תַּעֲלֶה֙ חֲמַ֣ת הַ/מֶּ֔לֶךְ וְ/אָמַ֣ר לְ/ךָ֔ מַדּ֛וּעַ נִגַּשְׁתֶּ֥ם אֶל הָ/עִ֖יר לְ/הִלָּחֵ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר יֹר֖וּ מֵ/עַ֥ל הַ/חוֹמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/020.yaml
  text: And if the king’s anger rises and he says to you[a], ‘Why did you go so near the city to fight? Did you not know what they would shoot from the wall?’
translation:
  language: id
  text: Dan jika raja menjadi marah dan berkata kepadamu, “Mengapa kalian mendekati kota itu untuk berperang? Tidakkah kalian tahu apa yang akan mereka tembakkan dari atas tembok[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “apa yang akan mereka lontarkan dari atas tembok.” Kata kerja Ibrani ini dapat mengacu lebih umum pada tindakan melontarkan proyektil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Dan jika
  rationale: Mempertahankan hubungan naratif waw dan memperkenalkan keadaan bersyarat secara wajar dalam bahasa Indonesia.
- source_word: תַּעֲלֶה חֲמַת הַמֶּלֶךְ
  choice: amarah raja memuncak
  rationale: חֵמָה menyatakan amarah yang hebat, sedangkan עלה secara harfiah berarti naik; 'memuncak' menyampaikan gambaran dan intensitasnya secara alami.
- source_word: וְאָמַר לְךָ
  choice: dan ia berkata kepadamu
  rationale: Bentuk ini merupakan bagian dari skenario yang diproyeksikan dalam kalimat bersyarat. Bentuk Indonesia ini tetap alami tanpa harus menandai kala secara eksplisit.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan lazim untuk kata tanya yang meminta alasan.
- source_word: נִגַּשְׁתֶּם אֶל הָעִיר
  choice: kalian mendekati kota itu
  rationale: נגשׁ berarti mendekat. Pronomina jamak 'kalian' mempertahankan bentuk orang kedua jamak Ibrani, sementara 'kota itu' sesuai dengan definiteness teks.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Infinitif ini menyatakan tujuan tindakan mendekati kota; 'berperang' tepat untuk konteks operasi militer.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Tidakkah kalian tahu
  rationale: Mempertahankan pertanyaan retoris negatif yang mengharapkan jawaban afirmatif.
- source_word: אֵת אֲשֶׁר יֹרוּ
  choice: bahwa mereka akan menembak
  rationale: ירה dalam Hifil dapat berarti menembakkan atau melontarkan proyektil. 'Menembak' cocok dengan pemakaian militernya, tetapi objek yang ditembakkan tidak dinyatakan dalam teks sumber.
- source_word: מֵעַל הַחוֹמָה
  choice: dari atas tembok
  rationale: Mengungkapkan unsur מֵעַל, yaitu gerakan dari posisi di atas atau pada bagian atas tembok, tanpa menambah rincian yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas. Pilihan 'amarah ... memuncak' alami dan tetap mempertahankan gambaran naiknya amarah. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
