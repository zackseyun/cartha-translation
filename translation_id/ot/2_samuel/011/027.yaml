  to: Setelah masa berkabung itu berlalu, Daud mengutus orang untuk membawa perempuan itu ke rumahnya. Perempuan itu menjadi istrinya dan melahirkan seorang anak laki-laki baginya. Namun, perbuatan Daud itu jahat di mata Yahweh.[a]
