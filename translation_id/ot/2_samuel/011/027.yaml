base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/027.yaml
  text: When the mourning was over[a], David sent and brought her into his house, and she became his wife and bore him a son. But the thing that David had done was evil in the eyes of Yahweh.
translation:
  language: id
  text: Setelah masa berkabung itu berlalu, Daud mengutus orang untuk membawa perempuan itu ke rumahnya. Perempuan itu menjadi istrinya dan melahirkan seorang anak laki-laki baginya. Namun, perbuatan Daud itu jahat di mata Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menyenangkan di hadapan Yahweh.” Teks Ibrani secara harfiah berbunyi, “jahat di mata Yahweh,” dan mengungkapkan penilaian moral Yahweh atas perbuatan Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵבֶל
  choice: masa berkabung
  rationale: Kata ini menunjuk pada perkabungan sesudah kematian Uria, termasuk masa dan praktik sosialnya, bukan hanya perasaan duka batin.
- source_word: וַיַּעֲבֹר
  choice: itu berlalu
  rationale: Dengan הָאֵבֶל sebagai subjek, ungkapan ini secara alami menyatakan bahwa masa perkabungan telah lewat.
- source_word: וַיִּשְׁלַח דָּוִד וַיַּאַסְפָהּ אֶל־בֵּיתוֹ
  choice: Daud menyuruh orang membawa perempuan itu ke rumahnya
  rationale: Terjemahan ini menyampaikan rangkaian tindakan Daud—mengutus lalu membawa Batsyeba masuk ke rumah tangganya—dengan bahasa Indonesia yang alami tanpa menambahkan pelaku tertentu.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Perempuan itu menjadi istrinya
  rationale: Konstruksi Ibrani menandai perubahan status menjadi istri Daud.
- source_word: וַתֵּלֶד לוֹ בֵּן
  choice: melahirkan seorang anak laki-laki baginya
  rationale: Mempertahankan objek tidak langsung לוֹ dan menyatakan jenis kelamin anak sebagaimana בֵּן.
- source_word: הַדָּבָר אֲשֶׁר עָשָׂה דָוִד
  choice: perbuatan Daud itu
  rationale: דָּבָר dalam konteks ini merujuk pada tindakan atau perkara yang dilakukan Daud; bentuk ringkas ini alami dalam bahasa Indonesia.
- source_word: וַיֵּרַע ... בְּעֵינֵי
  choice: jahat di mata
  rationale: Mempertahankan kekuatan penilaian moral verba Ibrani sekaligus metafora evaluatif 'di mata'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Kekuatan penilaian moral atas tindakan Daud
  choice: jahat di mata Yahweh
  alternative: tidak menyenangkan di hadapan Yahweh
  rationale: Bentuk וַיֵּרַע menyampaikan penilaian bahwa tindakan itu jahat, bukan sekadar bahwa Yahweh secara subjektif tidak menyukainya; metafora 'di mata' juga dipertahankan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama pribadi yang terdapat dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Masa berkabung” memperjelas dimensi waktunya; “perempuan itu” mempertahankan rujukan konteks tanpa memasukkan nama yang tidak muncul dalam ayat ini. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan olehnya.
