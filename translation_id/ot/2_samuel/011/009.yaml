  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan setia: Uria tidur/bermalam, lokasinya di pintu masuk rumah raja, bersama semua hamba tuannya, dan ia tidak turun ke rumahnya. “Istana” adalah padanan kontekstual yang sah untuk בֵּית הַמֶּלֶךְ, dengan bentuk harfiah dipertahankan dalam catatan kaki. “Turun ke rumahnya” dengan tepat mempertahankan verba יָרַד tanpa meniadakan citra spasialnya.'
