  yaml_path: translation/ot/2_samuel/011/009.yaml
  text: But Uriah slept at the entrance of the king’s house with all the servants of his lord[d][c][b][a], and did not go down to his house.
translation:
  language: id
  text: Tetapi Uria tidur di pintu masuk istana[a] bersama semua hamba tuannya, dan tidak turun ke rumahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “rumah raja”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan tidak pulang”. Secara harfiah: “dan tidak turun ke rumahnya”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: tidur
  rationale: Kata kerja שׁכב dapat berarti berbaring atau tidur. Dalam konteks ini, “tidur” secara wajar menyampaikan bahwa Uria bermalam di sana tanpa memperluas makna teks.
- source_word: פֶּתַח
  choice: di pintu masuk
  rationale: פֶּתַח menunjuk pada bukaan, pintu, atau jalan masuk. “Di pintu masuk” mempertahankan keterangan tempat tanpa mengandaikan daun pintu tertentu.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana
  rationale: Secara harfiah ungkapan ini berarti “rumah raja”, tetapi dalam konteks kerajaan yang dimaksud ialah kediaman resmi raja. “Istana” merupakan padanan Indonesia yang alami dan tepat; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֵת כָּל עַבְדֵי אֲדֹנָיו
  choice: bersama semua hamba tuannya
  rationale: אֵת di sini menyatakan kebersamaan. “Hamba” mempertahankan hubungan pelayanan dalam lingkungan kerajaan, sedangkan “tuannya” menyampaikan hierarki sosial dan merujuk kepada Daud tanpa nuansa ilahi.
- source_word: וְלֹא יָרַד אֶל בֵּיתוֹ
  choice: dan tidak turun ke rumahnya
  rationale: Terjemahan ini mempertahankan verba konkret ירד, “turun”, serta בֵּיתוֹ, “rumahnya”, alih-alih meratakannya menjadi sekadar “pulang”.
