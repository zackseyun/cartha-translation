base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/003.yaml
  text: So David sent and inquired about the woman, and someone said, “Is this not Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?”
translation:
  language: id
  text: Lalu Daud mengutus orang untuk mencari tahu tentang perempuan itu. Seseorang berkata, “Bukankah dia Batsyeba, anak perempuan Eliam, istri Uria, orang Het?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד
  choice: Lalu Daud mengutus orang
  rationale: Kata kerja 'mengutus' dipertahankan, sedangkan objek yang tersirat diungkapkan sebagai 'orang' agar alami dalam bahasa Indonesia.
- source_word: וַיִּדְרֹשׁ לָאִשָּׁה
  choice: untuk mencari tahu tentang perempuan itu
  rationale: Dalam konteks ini, דרשׁ berarti menyelidiki atau meminta keterangan mengenai identitas perempuan tersebut; 'mencari tahu tentang' menyampaikan maksud itu secara alami.
- source_word: וַיֹּאמֶר
  choice: Seseorang berkata
  rationale: Bentuk maskulin tunggal tidak menyebutkan subjek secara eksplisit. Terjemahan ini mempertahankan bahwa penuturnya tidak teridentifikasi dan tidak menyiratkan bahwa Daud yang berbicara.
- source_word: הֲלוֹא זֹאת
  choice: Bukankah dia
  rationale: Partikel הֲלוֹא membentuk pertanyaan yang mengharapkan pengakuan atau persetujuan; 'dia' wajar untuk menunjuk perempuan yang sedang dibicarakan.
- source_word: בַּת שֶׁבַע
  choice: Batsyeba
  rationale: Transliterasi nama Ibrani בַּת־שֶׁבַע yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בַּת אֱלִיעָם
  choice: anak perempuan Eliam
  rationale: Menerjemahkan hubungan kekerabatan secara eksplisit dan alami.
- source_word: אֵשֶׁת אוּרִיָּה הַחִתִּי
  choice: istri Uria orang Het itu
  rationale: Menjaga identitasnya sebagai istri Uria dan menerjemahkan nisba הַחִתִּי dengan bentuk Indonesia yang lazim.
theological_decisions:
- issue: Identitas subjek וַיֹּאמֶר ('dan ia berkata')
  choice: Seseorang berkata
  alternative: Ia berkata / Daud berkata
  rationale: Subjek gramatikal tidak disebutkan. Konteks paling wajar menunjuk kepada orang yang menjawab pertanyaan Daud, tetapi identitasnya tetap tidak diketahui; karena itu Daud tidak dijadikan penutur.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan tindakan, identitas Batsyeba, atau statusnya sebagai istri Uria.
