base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/011/013.yaml
  text: David invited him[a], and he ate and drank before him, and he made him drunk. In the evening he went out to lie on his bed with the servants of his lord[d][c][b], but he did not go down to his house.
translation:
  language: id
  text: Daud memanggil Uria[a]. Uria pun makan dan minum di hadapan Daud[b], lalu Daud membuatnya mabuk. Pada petang hari, Uria keluar untuk berbaring di tempat tidurnya bersama hamba-hamba tuannya[c], tetapi ia tidak turun ke rumahnya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Daud menyuruh Uria datang.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di hadapannya,” yaitu di hadapan Daud atau dalam kehadirannya.
    reason: referent_clarification
  - marker: c
    text: “Tuannya” di sini adalah Daud.
    reason: referent_clarification
  - marker: d
    text: Teks Ibrani memakai kata “turun.” Kata arah ini dipertahankan, bukan disederhanakan menjadi “pulang.”
    reason: source_form
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: Daud memanggil Uria
  rationale: Konstruksi קרא dengan ל dapat berarti memanggil seseorang atau menyuruh orang datang. Dalam bahasa Indonesia, “memanggil Uria” alami dan tetap mempertahankan tindakan Daud tanpa mempersempitnya menjadi undangan sosial.
- source_word: וַיֹּאכַל לְפָנָיו וַיֵּשְׁתְּ
  choice: Uria pun makan dan minum di hadapan Daud
  rationale: לְפָנָיו secara harfiah berarti “di hadapannya.” Nama Daud diulangi untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיְשַׁכְּרֵהוּ
  choice: Daud membuatnya mabuk
  rationale: 'Bentuk Hifil bersifat kausatif: Daud menyebabkan Uria menjadi mabuk. Terjemahan ini mempertahankan peran aktif dan kesengajaan Daud.'
- source_word: בָעֶרֶב
  choice: Pada petang hari
  rationale: Ungkapan waktu ini menandai tahap berikutnya dalam narasi; “pada petang hari” jelas, wajar, dan bermartabat.
- source_word: לִשְׁכַּב בְּמִשְׁכָּבוֹ
  choice: untuk berbaring di tempat tidurnya
  rationale: Terjemahan ini mempertahankan tindakan “berbaring” tanpa menyimpulkan bahwa Uria benar-benar tidur. מִשְׁכָּב dapat menunjuk pada tempat berbaring atau tempat tidur.
- source_word: עִם עַבְדֵי אֲדֹנָיו
  choice: bersama hamba-hamba tuannya
  rationale: Frasa ini mempertahankan struktur kepunyaan bahasa Ibrani dan sebutan אֲדֹנָיו, yang dalam konteks merujuk kepada Daud.
- source_word: וְאֶל בֵּיתוֹ לֹא יָרָד
  choice: tetapi ia tidak turun ke rumahnya
  rationale: Kata kerja arah ירד dipertahankan sebagai “turun,” sesuai pengulangannya dalam konteks sekitar. “Tetapi” menyatakan pertentangan naratif yang tersirat oleh rangkaian kalimat.
