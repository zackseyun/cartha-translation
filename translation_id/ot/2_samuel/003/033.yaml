base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/033.yaml
  text: And the king lamented over Abner and said[a], “Should Abner die as a fool dies?”
translation:
  language: id
  text: Raja meratapi Abner dan berkata,[a] “Haruskah Abner mati seperti orang bebal mati?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Seperti kematian orang bebal, haruskah Abner mati?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקֹנֵן
  choice: meratapi
  rationale: Kata kerja קונן menunjuk pada penyampaian ratapan bagi orang mati. “Meratapi” alami dalam bahasa Indonesia dan tetap menunjukkan tindakan meratap, bukan sekadar merasa sedih.
- source_word: אֶל אַבְנֵר
  choice: Abner
  rationale: Dengan kata kerja ratapan, אֶל menandai orang yang menjadi sasaran ratapan. Dalam bahasa Indonesia, hubungan ini sudah dinyatakan secara idiomatis oleh verba transitif “meratapi Abner”.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Nomina definit ini merujuk kepada Daud dalam konteks narasi. Karena ayat berdiri dalam kesinambungan wacana, “Raja” mempertahankan sebutan sumber tanpa menggantinya dengan nama diri.
- source_word: וַיֹּאמַר
  choice: berkata
  rationale: Ini adalah verba naratif biasa untuk berbicara dan secara langsung memperkenalkan kutipan ratapan.
- source_word: הַכְּמוֹת ... יָמוּת
  choice: Haruskah ... mati seperti ... mati?
  rationale: Susunan Ibrani secara harfiah membandingkan kematian Abner dengan kematian orang bebal. Bentuk pertanyaan retoris ini menyampaikan nada protes dan dukacita sambil mempertahankan unsur perbandingan.
- source_word: נָבָל
  choice: orang bebal
  rationale: נָבָל mencakup kebebalan yang bersifat moral dan tercela, bukan sekadar kurang cerdas. “Orang bebal” mempertahankan gema alkitabiah dan nuansa moral tersebut.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
