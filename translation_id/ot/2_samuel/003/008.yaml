base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/008.yaml
  text: Then Abner became very angry because of Ish-bosheth’s words[a], and he said, “Am I a dog’s head that belongs to Judah? To this day I have shown covenant loyalty to the house of Saul your father, to his brothers, and to his friends, and have not delivered you into David’s hand; yet today you charge me with guilt concerning this woman.”
translation:
  language: id
  text: Abner menjadi sangat marah karena perkataan Isyboset itu, lalu berkata, “Apakah aku ini kepala anjing milik Yehuda?[a] Sampai hari ini aku telah bertindak setia terhadap keluarga Saul, ayahmu, terhadap saudara-saudaranya dan sahabat-sahabatnya. Aku tidak menyerahkan engkau ke tangan Daud, tetapi hari ini engkau malah menuduhku bersalah dalam perkara perempuan ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepala anjing milik Yehuda,” suatu ungkapan penghinaan yang sulit. Maksudnya mungkin kurang lebih “orang hina yang memihak Yehuda,” tetapi terjemahan utama mempertahankan metafora dan ketaksaan teks Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְאַבְנֵר מְאֹד
  choice: Abner menjadi sangat marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah yang menyala. Pilihan ini menyampaikan maknanya secara wajar sekaligus mempertahankan intensitas מְאֹד.
- source_word: עַל דִּבְרֵי אִישׁ בֹּשֶׁת
  choice: karena perkataan Isyboset itu
  rationale: עַל menyatakan sebab kemarahan, sedangkan bentuk jamak דִּבְרֵי dapat diterjemahkan secara idiomatis dengan nomina kolektif ‘perkataan’ dalam bahasa Indonesia.
- source_word: הֲרֹאשׁ כֶּלֶב אָנֹכִי אֲשֶׁר לִיהוּדָה
  choice: Apakah aku ini kepala anjing milik Yehuda?
  rationale: Metafora penghinaan ‘kepala anjing’ dan hubungan sintaksisnya dengan Yehuda dipertahankan agar ungkapan Ibrani yang sulit ini tidak dipersempit menjadi satu tafsiran.
- source_word: הַיּוֹם אֶעֱשֶׂה חֶסֶד
  choice: Sampai hari ini aku telah bertindak setia
  rationale: Dalam pembelaan Abner, הַיּוֹם yang pertama merangkum tindakannya hingga saat kini dan berkontras dengan הַיּוֹם berikutnya. חֶסֶד di sini menunjuk pada kesetiaan nyata dalam hubungan politik dan kekeluargaan, bukan sekadar keramahan.
- source_word: עִם בֵּית שָׁאוּל אָבִיךָ
  choice: terhadap keluarga Saul, ayahmu
  rationale: ‘Keluarga Saul’ menyampaikan cakupan dinasti dari בֵּית, dan ‘terhadap’ sesuai dengan idiom Indonesia ‘bertindak setia terhadap’.
- source_word: אֶל אֶחָיו וְאֶל מֵרֵעֵהוּ
  choice: terhadap saudara-saudaranya dan sahabat-sahabatnya
  rationale: Terjemahan ini mempertahankan arti dasar ‘saudara’ dan ‘sahabat/teman dekat’ tanpa mempersempitnya menjadi golongan tertentu.
- source_word: וְלֹא הִמְצִיתִךָ בְּיַד דָּוִד
  choice: Aku tidak menyerahkan engkau ke tangan Daud
  rationale: Ungkapan ‘ke tangan’ dipertahankan karena alami dalam ragam Alkitab Indonesia dan menyatakan penyerahan ke bawah kekuasaan Daud.
- source_word: וַתִּפְקֹד עָלַי עֲוֺן הָאִשָּׁה
  choice: tetapi hari ini engkau malah menuduh aku bersalah karena perempuan itu
  rationale: פקד על bersama עָוֺן berarti meminta pertanggungjawaban atau mendakwa karena kesalahan. ‘Malah’ menampilkan kontras retoris dengan kesetiaan yang baru saja ditegaskan, sedangkan ‘perempuan itu’ mempertahankan rujukan teks tanpa menambahkan nama Rizpa.
