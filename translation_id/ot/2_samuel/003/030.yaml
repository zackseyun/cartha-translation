base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/030.yaml
  text: So Joab and Abishai his brother killed Abner because he had killed Asahel their brother at Gibeon in the battle[a].
translation:
  language: id
  text: Jadi, Yoab dan Abisai, saudara Yoab, membunuh Abner karena Abner telah membunuh Asael, saudara mereka, di Gibeon dalam pertempuran itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan Yoab dan Abisai, saudara Yoab, membunuh Abner.” Kata penghubung Ibrani dapat diterjemahkan secara sederhana sebagai “dan”; “jadi” menonjolkan kaitan penjelas dengan konteks di sekitarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְגוּ לְאַבְנֵר
  choice: membunuh Abner
  rationale: Kata הרג menyatakan tindakan membunuh tanpa dengan sendirinya menetapkan kategori hukum seperti pembunuhan berencana; ל menandai objek dalam konstruksi ini.
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Gabungan ini memperkenalkan alasan tindakan tersebut; 'karena' merupakan padanan Indonesia yang alami dan tepat.
- source_word: הֵמִית
  choice: telah membunuh
  rationale: Bentuk kausatif dari מות menyatakan menyebabkan kematian. 'Telah' memperjelas bahwa kematian Asael mendahului pembunuhan Abner.
- source_word: אָחִיו / אֲחִיהֶם
  choice: saudaranya / saudara mereka
  rationale: Yang pertama menyatakan bahwa Abisai adalah saudara Yoab; yang kedua bahwa Asael adalah saudara Yoab dan Abisai. Hubungan keluarga dipertahankan karena menjadi bagian penting dari alasan tindakan mereka.
- source_word: בְּגִבְעוֹן
  choice: di Gibeon
  rationale: Preposisi ב menandai tempat; 'di Gibeon' adalah ungkapan lokasi yang wajar dalam bahasa Indonesia.
- source_word: בַּמִּלְחָמָה
  choice: dalam pertempuran itu
  rationale: Artikel Ibrani menunjuk kepada pertempuran tertentu yang telah dikenal dari konteks narasi; 'itu' mempertahankan kekhususan tersebut.
- source_word: וְ / וַ
  choice: Jadi
  rationale: Konjungsi menghubungkan ayat ini dengan konteks sebelumnya secara merangkum atau menjelaskan. 'Jadi' menyampaikan hubungan wacana itu secara alami; terjemahan lebih harfiah 'Dan' tetap mungkin.
theological_decisions:
- issue: Penilaian hukum atau moral atas tindakan Yoab dan Abisai
  choice: membunuh
  alternative: membunuh dengan keji / membunuh secara tidak sah
  rationale: Ayat ini menyatakan tindakan serta alasannya, tetapi memakai הרג dan tidak secara eksplisit memberi klasifikasi hukum. Terjemahan tidak menambahkan penilaian yang tidak dinyatakan oleh kata sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama orang serta hubungan persaudaraan dipertahankan secara eksplisit. Pengulangan nama Abner dan tanda koma pada keterangan aposisi digunakan untuk menghindari ketaksaan rujukan kata ganti.
