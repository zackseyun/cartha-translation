base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/015.yaml
  text: So Ish-bosheth sent and took her from her husband[b][a], from Paltiel the son of Laish.
translation:
  language: id
  text: Lalu Isyboset mengutus orang untuk mengambil Mikhal dari suaminya,[a] dari Paltiel[b] anak Lais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari laki-laki itu.” Dalam konteks, yang dimaksud ialah suami Mikhal.'
    reason: lexical_alternative
  - marker: b
    text: Dalam bagian terkait, nama ini juga muncul dalam bentuk singkat “Palti”; teks Ibrani di sini memakai bentuk “Paltiel”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: menyuruh orang
  rationale: Bentuk naratif dari שׁלח secara harfiah berarti ‘mengutus’. Karena objek yang diutus tidak disebutkan, frasa ini menyatakan secara alami bahwa Isyboset mengirim orang untuk melaksanakan pengambilan, tanpa menentukan jumlah atau identitas mereka.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isyboset
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim dan konsisten dengan pemakaian Alkitab bahasa Indonesia.
- source_word: וַיִּקָּחֶהָ
  choice: mengambil Mikhal
  rationale: לקח dengan sufiks feminin berarti ‘mengambil dia’. Nama Mikhal disebutkan demi kejelasan rujukan dalam bahasa Indonesia; verba netral ‘mengambil’ tidak menambahkan gagasan kekerasan yang tidak dinyatakan oleh teks.
- source_word: מֵעִם אִישׁ
  choice: dari suaminya
  rationale: Secara harfiah berbunyi ‘dari laki-laki itu’. Dalam konteks, אִישׁ menunjuk kepada pasangan perkawinan Mikhal, sehingga ‘suaminya’ menyampaikan makna relasional secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מֵעִם פַּלְטִיאֵל
  choice: yaitu Paltiel
  rationale: Pengulangan מֵעִם memperjelas bahwa laki-laki atau suami yang dimaksud ialah Paltiel. ‘Yaitu’ menyampaikan hubungan aposisional itu secara wajar dalam bahasa Indonesia.
- source_word: פַּלְטִיאֵל
  choice: Paltiel
  rationale: Nama ini mengikuti bentuk lengkap teks Masoret pada ayat ini, bukan bentuk singkat Palti yang terdapat dalam bagian terkait.
- source_word: בֶּן־לוש
  choice: anak Lais
  rationale: בֶּן menyatakan hubungan anak laki-laki dengan ayahnya. לוש direpresentasikan dengan bentuk nama Indonesia yang lazim, ‘Lais’.
theological_decisions:
- issue: Status hubungan Mikhal dengan Paltiel
  choice: suaminya
  alternative: laki-laki itu
  rationale: Konteks naratif mengidentifikasi Paltiel sebagai pasangan perkawinan Mikhal, tetapi terjemahan ini tidak memutuskan persoalan teologis atau legal mengenai keabsahan relatif pernikahannya dengan Daud dan Paltiel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara makna harfiah אִישׁ dan variasi bentuk nama Paltiel dipertahankan melalui catatan kaki.
