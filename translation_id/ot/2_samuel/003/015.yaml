  rationale: Revisi mengganti “menyuruh orang” dengan “mengutus orang” agar lebih dekat dengan arti dasar שׁלח, sambil tetap menghasilkan kalimat Indonesia yang idiomatis. Pengulangan “dari” dipulihkan untuk mencerminkan pengulangan מֵעִם. Penanda catatan kaki tentang Palti/Paltiel dipindahkan ke Paltiel. Catatan kaki a mempertahankan alternatif harfiah tanpa memaksakan penilaian mengenai status legal atau teologis hubungan Mikhal.
