  text: וַ/יְדַבֵּ֥ר גַּם אַבְנֵ֖ר בְּ/אָזְנֵ֣י בִנְיָמִ֑ין וַ/יֵּ֣לֶךְ גַּם אַבְנֵ֗ר לְ/דַבֵּ֞ר בְּ/אָזְנֵ֤י דָוִד֙ בְּ/חֶבְר֔וֹן אֵ֤ת כָּל אֲשֶׁר טוֹב֙ בְּ/עֵינֵ֣י יִשְׂרָאֵ֔ל וּ/בְ/עֵינֵ֖י כָּל בֵּ֥ית בִּנְיָמִֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/019.yaml
  text: Abner also spoke in the hearing of Benjamin[b][a], and Abner also went to speak in the hearing of David at Hebron all that seemed good in the eyes of Israel and in the eyes of the whole house of Benjamin.
translation:
  language: id
  text: Abner juga berbicara kepada orang Benyamin, dan ia juga pergi ke Hebron untuk menyampaikan kepada Daud segala sesuatu yang dipandang baik oleh Israel dan oleh seluruh kaum Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala sesuatu yang baik di mata Israel dan di mata seluruh kaum Benyamin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָזְנֵי
  choice: kepada
  rationale: Ungkapan harfiahnya, 'di telinga', merupakan idiom untuk berbicara kepada atau dalam pendengaran seseorang. 'Kepada' paling alami dalam bahasa Indonesia dan sesuai pada kedua kemunculannya.
- source_word: בִנְיָמִין
  choice: orang Benyamin
  rationale: Nama Benyamin dipakai secara kolektif bagi suku atau warganya; 'orang Benyamin' memperjelas rujukan tanpa menambahkan gagasan baru.
- source_word: לְדַבֵּר
  choice: untuk menyampaikan
  rationale: Dalam klausa kedua, objeknya berupa isi yang disampaikan. 'Menyampaikan' menghasilkan susunan Indonesia yang alami sekaligus mempertahankan arti dasar tindakan berbicara.
- source_word: בְּחֶבְרוֹן
  choice: ke Hebron
  rationale: Walaupun preposisi Ibrani sendiri berarti 'di', konstruksi dengan verba 'pergi' dan tujuan berbicara kepada Daud paling alami ditata sebagai gerak menuju Hebron dalam bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר טוֹב בְּעֵינֵי
  choice: segala sesuatu yang dipandang baik oleh
  rationale: Pilihan ini menerjemahkan idiom 'baik di mata' secara alami, tetapi tetap mempertahankan unsur penilaian atau penerimaan dari pihak Israel dan kaum Benyamin.
- source_word: כָּל בֵּית בִּנְיָמִן
  choice: seluruh kaum Benyamin
  rationale: '''Kaum'' mempertahankan nuansa kesatuan kekerabatan dan politik dari ''rumah Benyamin'' dengan bahasa Indonesia yang lebih wajar daripada terjemahan harfiah ''rumah''.'
- source_word: גַּם ... גַּם
  choice: juga ... lalu
  rationale: Kemunculan pertama dipertahankan dengan 'juga'. Yang kedua dinyatakan melalui kelanjutan naratif 'lalu' dan pengulangan subjek dihindari agar kalimat Indonesia tidak kaku; unsur penambahan tetap terbaca dari rangkaian tindakan Abner.
