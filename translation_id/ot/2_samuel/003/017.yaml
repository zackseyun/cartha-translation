  terminology: Nama Abner dan Daud konsisten dengan bentuk Indonesia yang lazim. Istilah "para tua-tua Israel" secara tepat mempertahankan rujukan kepada para pemimpin/penatua komunal, dan "raja atas kalian" mempertahankan relasi pemerintahan dalam teks sumber.
