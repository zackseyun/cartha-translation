  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Para tua-tua Israel’ mempertahankan sebutan kepemimpinan komunal dalam teks sumber; ‘kalian’ dipakai karena Abner berbicara langsung kepada kelompok tersebut.
