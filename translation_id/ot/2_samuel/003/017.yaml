  text: וּ/דְבַר אַבְנֵ֣ר הָיָ֔ה עִם זִקְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר גַּם תְּמוֹל֙ גַּם שִׁלְשֹׁ֔ם הֱיִיתֶ֞ם מְבַקְשִׁ֧ים אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עֲלֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/017.yaml
  text: Abner had spoken with the elders of Israel, saying, “For some time you have been seeking David to be king over you.”
translation:
  language: id
  text: Abner telah berbicara dengan para tua-tua Israel. Katanya, “Sudah sejak beberapa waktu lalu kalian menginginkan Daud menjadi raja atas kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּדְבַר אַבְנֵר הָיָה עִם
  choice: Abner telah berbicara dengan
  rationale: Ungkapan ini menyatakan bahwa Abner telah berkomunikasi atau berunding dengan para tua-tua; bentuk Indonesia ini alami dan tetap mempertahankan nuansa percakapan timbal balik dari עִם (‘dengan’).
- source_word: גַּם תְּמוֹל גַּם שִׁלְשֹׁם
  choice: Sudah sejak beberapa waktu lalu
  rationale: Secara harfiah, ‘baik kemarin maupun sebelumnya’; ungkapan Ibrani ini idiomatis dan menunjuk pada waktu lampau atau suatu keinginan yang telah berlangsung selama beberapa waktu.
- source_word: מְבַקְשִׁים אֶת דָּוִד לְמֶלֶךְ
  choice: menginginkan Daud menjadi raja
  rationale: מְבַקְשִׁים dapat berarti mencari atau menghendaki. Dalam konteks penetapan raja, ‘menginginkan’ menyampaikan maksudnya dengan wajar tanpa menyiratkan bahwa Daud tidak diketahui keberadaannya.
- source_word: עֲלֵיכֶם
  choice: atas kalian
  rationale: Mempertahankan gambaran pemerintahan dan kewenangan yang terdapat dalam preposisi Ibrani.
theological_decisions: []
