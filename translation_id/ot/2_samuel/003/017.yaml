  verdict: approve
  source_fidelity: Teks Indonesia dengan tepat menyampaikan bahwa Abner telah berbicara dengan para tua-tua Israel dan mengutip perkataannya. Ungkapan "Sudah sejak beberapa waktu lalu" merupakan padanan idiomatis yang memadai untuk גַּם תְּמוֹל גַּם שִׁלְשֹׁם, yang secara harfiah menyebut "kemarin dan sebelumnya" dan dalam konteks ini menunjuk pada keinginan yang sudah berlangsung. "Menginginkan Daud menjadi raja atas kalian" menangkap מְבַקְשִׁים ... לְמֶלֶךְ עֲלֵיכֶם tanpa menambahkan penafsiran.
