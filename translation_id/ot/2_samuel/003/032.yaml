base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/032.yaml
  text: They buried Abner in Hebron[a], and the king lifted up his voice and wept at Abner’s grave, and all the people wept.
translation:
  language: id
  text: Mereka menguburkan Abner di Hebron. Lalu raja mengangkat suaranya dan menangis di makam Abner[a], dan seluruh rakyat pun menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke arah makam Abner.” Preposisi Ibrani secara lebih harfiah dapat menyatakan arah, tetapi dalam konteks ini dapat dipahami secara idiomatis sebagai ratapan di makam Abner.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ
  choice: Mereka menguburkan
  rationale: Bentuk Qal wayyiqtol orang ketiga jamak dari קבר menyatakan tindakan naratif berurutan. Konjungsi awal tidak diterjemahkan tersendiri agar pembukaan ayat alami dalam bahasa Indonesia.
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Preposisi ב menandai lokasi; 'di Hebron' merupakan padanan Indonesia yang alami.
- source_word: וַיִּשָּׂא ... אֶת־קוֹלוֹ וַיֵּבְךְּ
  choice: menangis dengan suara nyaring
  rationale: Ungkapan harfiah 'mengangkat suaranya dan menangis' menyatakan ratapan yang terdengar keras. Padanan ini mempertahankan makna idiomatis secara alami tanpa menghilangkan unsur suara.
- source_word: אֶל־קֶבֶר אַבְנֵר
  choice: di dekat makam Abner
  rationale: אֶל biasanya berarti 'ke/menuju', tetapi dalam konteks ratapan di tempat pemakaman dapat menunjukkan hubungan setempat. 'Di dekat' alami dalam bahasa Indonesia sekaligus tidak terlalu tegas mengubahnya menjadi preposisi lokasi biasa.
- source_word: וַיִּבְכּוּ כָּל־הָעָם
  choice: seluruh rakyat pun menangis
  rationale: Kata בכה diterjemahkan konsisten sebagai 'menangis'. Partikel 'pun' secara alami menandai bahwa rakyat ikut menangis dalam rangkaian narasi.
