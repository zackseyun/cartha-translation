  yaml_path: translation/ot/2_samuel/003/002.yaml
  text: Sons were born to David in Hebron[a], and his firstborn was Amnon, by Ahinoam the Jezreelitess.
translation:
  language: id
  text: Di Hebron lahirlah anak-anak lelaki bagi Daud, dan anak sulungnya ialah Amnon, dari Ahinoam, perempuan dari Yizreel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perempuan Yizreel.”
    reason: alternatif leksikal untuk sebutan asal feminin Ibrani
lexical_decisions:
- source_word: ו/ילדו
  choice: lahir
  rationale: Bentuk ini menyatakan bahwa anak-anak dilahirkan bagi Daud tanpa menjadikan para ibu sebagai subjek eksplisit. "Lahir" alami dalam bahasa Indonesia dan mempertahankan fokus pada peristiwa kelahiran.
- source_word: לְ/דָוִד
  choice: bagi Daud
  rationale: Preposisi ל menyatakan hubungan bahwa anak-anak itu lahir sebagai anak-anak Daud. "Bagi Daud" mempertahankan konstruksi genealogis sumber dengan jelas.
- source_word: בָּנִים
  choice: anak-anak lelaki
  rationale: Kata Ibrani ini secara khusus menunjuk kepada anak laki-laki, bukan anak secara umum.
- source_word: בְּ/חֶבְרוֹן
  choice: di Hebron
  rationale: Preposisi ב dipakai secara lokatif; padanan langsung dan alami ialah "di Hebron".
- source_word: וַ/יְהִי
  choice: ialah
  rationale: Dalam konteks ini kata kerja tersebut memperkenalkan identitas anak sulung Daud. Kopula "ialah" menghasilkan kalimat Indonesia yang jelas tanpa menerjemahkan waw naratif secara berlebihan.
- source_word: בְכוֹר/וֹ
  choice: anak sulungnya
  rationale: בכור menunjuk kepada anak pertama menurut urutan kelahiran dan dapat mengandung arti penting dalam keluarga; "anak sulungnya" mempertahankan nuansa itu.
- source_word: אַמְנוֹן
  choice: Amnon
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לַ/אֲחִינֹעַם
  choice: dari Ahinoam
  rationale: Dalam daftar kelahiran ini, ל menandai hubungan keibuan. "Dari Ahinoam" ringkas dan tetap mempertahankan susunan genealogis tanpa menambahkan kata yang tidak eksplisit dalam sumber.
- source_word: הַ/יִּזְרְעֵאלִת
  choice: perempuan asal Yizreel
  rationale: Bentuk nisbah feminin ini mengidentifikasi Ahinoam sebagai perempuan yang berasal dari Yizreel. Ungkapan ini alami dan mudah dipahami dalam bahasa Indonesia modern.
