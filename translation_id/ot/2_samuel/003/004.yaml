  text: וְ/הָ/רְבִיעִ֖י אֲדֹנִיָּ֣ה בֶן חַגִּ֑ית וְ/הַ/חֲמִישִׁ֖י שְׁפַטְיָ֥ה בֶן אֲבִיטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/004.yaml
  text: the fourth[a], Adonijah son of Haggith; and the fifth, Shephatiah son of Abital.
translation:
  language: id
  text: yang keempat[a], Adonia, anak Hagit; dan yang kelima, Sefaca, anak Abital.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani dimulai dengan “dan yang keempat”, sebagai kelanjutan daftar dari ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרְבִיעִי
  choice: yang keempat
  rationale: Kata sifat bilangan bertingkat dengan konjungsi prefiks. Dalam bahasa Indonesia, pembukaan ayat tanpa “dan” lebih alami sebagai kelanjutan daftar dari ayat sebelumnya, sementara urutannya tetap dipertahankan.
- source_word: אֲדֹנִיָּה
  choice: Adonia
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶן
  choice: anak
  rationale: Bentuk konstruksi ini menunjukkan hubungan keturunan langsung; “anak” merupakan padanan genealogis yang ringkas dan alami.
- source_word: חַגִּית
  choice: Hagit
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan bahasa Indonesia.
- source_word: וְהַחֲמִישִׁי
  choice: dan yang kelima
  rationale: Konjungsi dipertahankan karena menghubungkan unsur kedua dengan unsur pertama dalam ayat ini.
- source_word: שְׁפַטְיָה
  choice: Sefaca
  rationale: Nama diri memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲבִיטָל
  choice: Abital
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam bahasa Indonesia.
