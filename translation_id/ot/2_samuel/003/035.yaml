  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣א כָל הָ/עָ֗ם לְ/הַבְר֧וֹת אֶת דָּוִ֛ד לֶ֖חֶם בְּ/ע֣וֹד הַ/יּ֑וֹם וַ/יִּשָּׁבַ֨ע דָּוִ֜ד לֵ/אמֹ֗ר כֹּ֣ה יַעֲשֶׂה לִּ֤/י אֱלֹהִים֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י אִם לִ/פְנֵ֧י בֽוֹא הַ/שֶּׁ֛מֶשׁ אֶטְעַם לֶ֖חֶם א֥וֹ כָל מְאֽוּמָה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/035.yaml
  text: Then all the people came to urge David to eat bread while it was still day[a], but David swore, saying, “May God do so to me, and more also[b], if before the sun goes down I taste bread or anything at all.”
translation:
  language: id
  text: Kemudian seluruh rakyat datang untuk membujuk Daud agar makan roti selagi hari masih siang[a]. Namun Daud bersumpah, katanya, “Kiranya Allah berbuat demikian kepadaku, bahkan lebih lagi[b], jika sebelum matahari terbenam aku mencicipi roti atau apa pun juga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti”; di sini kata itu juga dapat berarti makanan secara umum, tetapi terjemahan mempertahankan istilah konkretnya.
    reason: lexical_alternative
  - marker: b
    text: 'Ini adalah rumusan kutuk diri yang lazim dalam sumpah: “Kiranya Allah berbuat demikian kepadaku, bahkan lebih lagi.” Hukuman yang dimaksud tidak disebutkan dalam bahasa Ibrani.'
    reason: cultural_note
lexical_decisions:
- source_word: לְהַבְרוֹת
  choice: membujuk ... agar makan
  rationale: Bentuk Hifil ini dalam konteks perkabungan menunjuk pada usaha memberi atau membuat seseorang makan. 'Membujuk Daud agar makan' menyampaikan tindakan rakyat secara wajar tanpa menghilangkan objek konkret yang menyusul.
- source_word: לֶחֶם
  choice: roti
  rationale: Walaupun לֶחֶם dapat berarti makanan secara umum, 'roti' mempertahankan gambaran konkret bahasa Ibrani dan tetap jelas dalam konteks puasa perkabungan.
- source_word: בְּעוֹד הַיּוֹם
  choice: selagi hari masih siang
  rationale: Ungkapan ini menyatakan bahwa hari belum berakhir dan mengantisipasi penyebutan matahari terbenam pada bagian berikutnya.
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Padanan langsung dan wajar bagi tindakan mengucapkan sumpah yang khidmat.
- source_word: כֹּה יַעֲשֶׂה לִּי אֱלֹהִים וְכֹה יֹסִיף
  choice: Kiranya Allah berbuat demikian kepadaku, bahkan lebih lagi
  rationale: Rumusan kutuk diri dalam sumpah ini dipertahankan tanpa menentukan hukuman yang memang tidak disebutkan dalam bahasa Ibrani.
- source_word: כִּי אִם
  choice: jika
  rationale: Dalam rumusan sumpah, ungkapan ini memperkenalkan syarat yang mendatangkan kutuk diri; 'jika' menyampaikan fungsinya secara alami.
- source_word: לִפְנֵי בּוֹא הַשֶּׁמֶשׁ
  choice: sebelum matahari terbenam
  rationale: Ini merupakan padanan idiomatis yang jelas bagi ungkapan harfiah tentang 'datangnya' matahari, yakni terbenamnya matahari.
- source_word: אֶטְעַם
  choice: aku mencicipi
  rationale: Makna harfiahnya 'mengecap/mencicipi'; pilihan ini mempertahankan penekanan bahwa Daud tidak akan menyantap sedikit pun.
- source_word: אוֹ כָל מְאוּמָה
  choice: atau apa pun juga
  rationale: Ungkapan ini memperluas larangan dari roti kepada segala sesuatu dan menegaskan sifatnya yang menyeluruh.
theological_decisions:
- issue: Rumusan kutuk diri dalam sumpah
  choice: 'Mempertahankan rumusan tidak langsung: ''Kiranya Allah berbuat demikian kepadaku, bahkan lebih lagi'''
  alternative: Menjelaskannya sebagai 'Kiranya Allah menghukum aku dengan berat'
  rationale: Teks Ibrani sengaja tidak menyebut bentuk hukumannya. Terjemahan mempertahankan ketidakjelasan itu dan tidak menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Seluruh rakyat' sesuai bagi כָל הָעָם dalam konteks publik; 'membujuk ... agar makan' alami bagi pembaca umum. Susunan sumpah dibuat formal untuk mempertahankan kekhidmatan dan keasingan budaya rumusan Ibrani.
