base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/010.yaml
  text: to transfer the kingdom from the house of Saul and to establish the throne of David over Israel and over Judah[a], from Dan to Beer-sheba.
translation:
  language: id
  text: untuk memindahkan kerajaan itu dari wangsa Saul dan menegakkan takhta Daud atas Israel dan atas Yehuda, dari Dan sampai Bersyeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dari Dan sampai Bersyeba” berarti seluruh negeri dari utara sampai selatan.
    reason: cultural_note
lexical_decisions:
- source_word: לְהַעֲבִיר
  choice: untuk memindahkan
  rationale: Bentuk Hifil menyatakan tindakan membuat kerajaan beralih dari satu pemegang kepada pemegang lain; 'memindahkan' jelas dan tetap dekat dengan gambaran Ibrani.
- source_word: הַמַּמְלָכָה
  choice: kerajaan itu
  rationale: Kata ini menunjuk pada kerajaan atau kekuasaan kerajaan; artikel tertentu dinyatakan secara alami dengan 'itu' dalam konteks kalimat yang berlanjut.
- source_word: מִבֵּית שָׁאוּל
  choice: dari keluarga Saul
  rationale: '''Keluarga'' dapat dipahami pembaca modern sebagai garis keluarga atau wangsa Saul, tanpa menghilangkan nuansa dinastis dari ungkapan ''rumah Saul''.'
- source_word: וּלְהָקִים
  choice: dan menegakkan
  rationale: Dalam konteks politik, bentuk Hifil berarti mendirikan atau mengukuhkan; 'menegakkan' berpadu alami dengan objek 'takhta'.
- source_word: אֶת כִּסֵּא דָוִד
  choice: takhta Daud
  rationale: Metafora konkret 'takhta' dipertahankan karena menyatakan wewenang kerajaan tanpa mengabstraksikannya menjadi sekadar pemerintahan.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה
  choice: atas Israel dan atas Yehuda
  rationale: Pengulangan preposisi עַל dipertahankan untuk mencerminkan cakupan politik yang dibedakan atas Israel dan Yehuda.
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Ungkapan geografis ini mencakup negeri dari ujung utara sampai ujung selatan; bentuk langsungnya tetap jelas dalam bahasa Indonesia.
- source_word: בְּאֵר שָׁבַע
  choice: Bersyeba
  rationale: Bentuk nama tempat ini sudah lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Bahasa dinastis dalam 'keluarga Saul' dan gambaran kerajaan dalam 'takhta Daud'
  choice: Mempertahankan konsep garis keluarga Saul dan metafora konkret takhta Daud.
  alternative: Menerjemahkan secara abstrak sebagai 'wangsa Saul' dan 'pemerintahan Daud'.
  rationale: Teks berbicara tentang pengalihan kekuasaan kerajaan dengan bahasa keluarga dan takhta. Terjemahan ini mempertahankan tekstur dinastis serta kerajaan tanpa menambahkan klaim teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan infinitif dipertahankan karena ayat ini merupakan kelanjutan dari sumpah dalam ayat sebelumnya. Pengulangan 'atas' sengaja dipertahankan untuk mengikuti penekanan teks Ibrani.
