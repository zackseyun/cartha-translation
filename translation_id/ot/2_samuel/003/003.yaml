base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/003.yaml
  text: his second, Kileab, by Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah daughter of Talmai king of Geshur.
translation:
  language: id
  text: anaknya yang kedua, Kileab, dari Abigail, istri Nabal, orang Karmel; dan yang ketiga, Absalom, anak Maakha, putri Talmai, raja Gesur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִשְׁנֵהוּ
  choice: anaknya yang kedua
  rationale: Secara harfiah berarti 'dan yang keduanya'; penambahan 'anaknya' memperjelas unsur yang tersirat dari daftar anak-anak dalam konteks tanpa mengubah makna.
- source_word: כִלְאָב
  choice: Kileab
  rationale: Transliterasi nama Ibrani menurut bentuk konsonan dan pelafalan yang lazim dalam bahasa Indonesia.
- source_word: הַכַּרְמְלִי
  choice: orang Karmel
  rationale: Nisbah ini menunjukkan bahwa Nabal berasal dari atau terkait dengan Karmel, bukan kota Karmel yang lebih terkenal di wilayah utara.
- source_word: מַעֲכָה
  choice: Maakha
  rationale: Transliterasi nama diri perempuan Ibrani dengan mempertahankan bunyi konsonan akhir kh.
- source_word: גְּשׁוּר
  choice: Gesur
  rationale: Transliterasi nama kerajaan Geshur dalam bentuk yang alami bagi pembaca Indonesia.
