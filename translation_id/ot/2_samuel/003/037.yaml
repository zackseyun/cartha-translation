base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/037.yaml
  text: So all the people and all Israel knew on that day that it was not from the king to put Abner son of Ner to death[a].
translation:
  language: id
  text: Maka pada hari itu seluruh rakyat dan seluruh Israel mengetahui bahwa tindakan membunuh Abner anak Ner itu bukan berasal dari raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “hal itu bukan berasal dari raja untuk membunuh Abner anak Ner.” Mungkin juga berarti, “raja tidak memerintahkannya.” Bahasa Ibrani menekankan sumber atau asal tindakan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדְעוּ
  choice: mengetahui
  rationale: Bentuk Qal wayyiqtol dari ידע menyatakan bahwa mereka mengetahui atau menyadari fakta tersebut; "mengetahui" wajar dalam rangkuman naratif ini.
- source_word: כָל הָעָם
  choice: seluruh rakyat
  rationale: עם di sini menunjuk kepada orang banyak secara umum; "seluruh rakyat" jelas dan sesuai dengan konteks kerajaan.
- source_word: וְכָל יִשְׂרָאֵל
  choice: dan seluruh Israel
  rationale: Mempertahankan ungkapan kolektif nasional dalam bahasa Ibrani dan membedakannya dari rakyat yang hadir.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan alami yang mempertahankan penekanan waktu dalam narasi.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang diketahui oleh rakyat dan Israel.
- source_word: לֹא הָיְתָה מֵהַמֶּלֶךְ
  choice: bukan berasal dari raja
  rationale: Mempertahankan gagasan sumber atau asal yang dinyatakan oleh מן tanpa langsung memperluasnya menjadi pernyataan hukum tentang ketidakbersalahan.
- source_word: לְהָמִית
  choice: keputusan untuk membunuh
  rationale: Infinitif Hifil dari מות berarti menyebabkan mati. Penambahan "keputusan" memberi acuan yang alami bagi verba feminin הָיְתָה dan membuat idiom sumber dapat dipahami, tetapi karena nomina itu tersirat, alternatif yang lebih harfiah dicatat.
- source_word: אֶת אַבְנֵר בֶּן נֵר
  choice: Abner anak Ner
  rationale: Nama diri ditransliterasikan, sedangkan hubungan genealogis בן diterjemahkan secara langsung dan alami.
theological_decisions:
- issue: Tingkat implikasi tentang tanggung jawab Daud atas kematian Abner
  choice: Ayat menyatakan bahwa keputusan untuk membunuh Abner tidak berasal dari raja.
  alternative: Raja tidak bersalah atas kematian Abner; atau raja tidak memerintahkan pembunuhan Abner.
  rationale: Bahasa Ibrani menekankan sumber atau asal perkara, bukan secara eksplisit kategori hukum tentang ketidakbersalahan maupun perintah resmi. Terjemahan mempertahankan klaim yang lebih terbatas itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. "Maka" menghubungkan ayat ini dengan tanggapan Daud dalam konteks sebelumnya. Ungkapan "bukan berasal dari raja" sengaja dipertahankan agar ketegangan dan cakupan pernyataan Ibrani tidak dipersempit menjadi penyangkalan perintah semata.
