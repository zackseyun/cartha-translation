base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/016.yaml
  text: Her husband went with her[a], walking and weeping behind her as far as Bahurim. Then Abner said to him, “Go[b], return.” So he returned.
translation:
  language: id
  text: Suaminya pergi bersamanya[a], sambil terus berjalan dan menangis di belakangnya sampai ke Bahurim. Lalu Abner berkata kepadanya, “Pergilah, kembalilah.”[b] Maka ia pun kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa berikutnya menjelaskan bahwa ia mengikuti perempuan itu dari belakang.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani memuat dua perintah: “Pergilah, kembalilah”; secara idiomatis dapat diterjemahkan “Pulanglah” atau “Kembalilah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Dalam konteks ini, אִישׁ dengan akhiran orang ketiga feminin tunggal secara khusus menunjuk kepada suami perempuan itu; “suaminya” alami dan tepat dalam bahasa Indonesia.
- source_word: הָלוֹךְ וּבָכֹה
  choice: berjalan ... sambil terus menangis
  rationale: Susunan infinitif absolut dan bentuk terkait menggambarkan tindakan yang berlangsung terus; “sambil terus menangis” menyampaikan aspek duratif secara alami.
- source_word: אַחֲרֶיהָ
  choice: di belakangnya
  rationale: Ungkapan ini secara spasial menggambarkan sang suami mengikuti perempuan itu dari belakang; alternatif yang mungkin ialah “mengikutinya”.
- source_word: עַד בַּחֻרִים
  choice: sampai ke Bahurim
  rationale: עַד dengan nama tempat menandai batas perjalanan; “sampai ke” merupakan ungkapan Indonesia yang alami.
- source_word: בַּחֻרִים
  choice: Bahurim
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan.
- source_word: לֵךְ שׁוּב
  choice: Pergilah, kembalilah
  rationale: Dua bentuk imperatif dalam bahasa Ibrani dipertahankan agar tekanan perintah gandanya tidak hilang, meskipun secara idiomatis dapat dipahami sebagai “Kembalilah.”
- source_word: וַיָּשֹׁב
  choice: Maka ia pun kembali
  rationale: Bentuk naratif ini melanjutkan alur dan menyatakan respons langsung terhadap perintah Abner; “maka ... pun” alami dalam narasi Indonesia.
