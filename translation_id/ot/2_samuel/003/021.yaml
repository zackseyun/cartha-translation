  text: וַ/יֹּ֣אמֶר אַבְנֵ֣ר אֶל דָּוִ֡ד אָק֣וּמָה וְֽ/אֵלֵ֡כָה וְ/אֶקְבְּצָה֩ אֶל אֲדֹנִ֨/י הַ/מֶּ֜לֶךְ אֶת כָּל יִשְׂרָאֵ֗ל וְ/יִכְרְת֤וּ אִתְּ/ךָ֙ בְּרִ֔ית וּ/מָ֣לַכְתָּ֔ בְּ/כֹ֥ל אֲשֶׁר תְּאַוֶּ֖ה נַפְשֶׁ֑/ךָ וַ/יְּשַׁלַּ֥ח דָּוִ֛ד אֶת אַבְנֵ֖ר וַ/יֵּ֥לֶךְ בְּ/שָׁלֽוֹם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/021.yaml
  text: Abner said to David[a], “I will arise and go, and I will gather all Israel to my lord the king, so that they may make a covenant with you, and you shall reign over all that your soul desires.” Then David sent Abner away[c][b], and he went in peace.
translation:
  language: id
  text: Abner berkata kepada Daud, “Aku akan bangkit dan pergi untuk mengumpulkan seluruh Israel kepada tuanku, raja, supaya mereka mengadakan perjanjian dengan tuanku.[a] Lalu tuanku akan memerintah atas segala yang tuanku kehendaki.[b]” Kemudian Daud melepas Abner pergi, dan Abner pun pergi dengan damai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian dengan tuanku,” sebuah ungkapan Ibrani untuk mengadakan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “atas segala yang diinginkan jiwamu.”
    reason: lexical_alternative
  - marker: c
    text: “Pergi dengan damai” adalah ungkapan Ibrani yang menunjukkan bahwa Abner berangkat dengan aman dan dalam hubungan yang damai.
    reason: cultural_note
lexical_decisions:
- source_word: אָקוּמָה וְאֵלֵכָה
  choice: Aku akan bangkit dan pergi
  rationale: Dua bentuk kohortatif menyatakan tekad Abner. Terjemahan ini mempertahankan kedua tindakan dan daya retorisnya tanpa menambahkan unsur waktu yang tidak dinyatakan.
- source_word: וְאֶקְבְּצָה ... אֶת כָּל יִשְׂרָאֵל
  choice: mengumpulkan seluruh Israel
  rationale: קבץ berarti mengumpulkan atau menghimpun; dalam konteks ini yang dimaksud ialah membawa suku-suku Israel bersama-sama secara politis kepada Daud.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: kepada tuanku raja
  rationale: Preposisi אֶל dipahami secara terarah. 'Tuanku raja' mempertahankan sapaan istana yang hormat dan sesuai dengan pemakaian orang pertama oleh Abner.
- source_word: וְיִכְרְתוּ אִתְּךָ בְּרִית
  choice: supaya mereka mengikat perjanjian dengan Tuanku
  rationale: Ungkapan כרת ברית secara harfiah berarti 'memotong perjanjian', tetapi dalam bahasa Indonesia 'mengikat perjanjian' menyampaikan idiom pembuatan perjanjian secara alami dan tetap mempertahankan citra ikatan.
- source_word: וּמָלַכְתָּ
  choice: Lalu Tuanku akan memerintah
  rationale: Kata kerja מלך menunjuk pada pelaksanaan pemerintahan sebagai raja. 'Memerintah' alami dalam bahasa Indonesia, sedangkan konteks telah menjelaskan kedudukan Daud sebagai raja.
- source_word: בְּכֹל אֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: atas segala yang Tuanku inginkan
  rationale: נפשׁ di sini menunjuk pada diri batin sebagai pusat keinginan. Ungkapan utama dibuat alami dalam bahasa Indonesia, sedangkan bentuk Ibrani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיְשַׁלַּח דָּוִד אֶת אַבְנֵר
  choice: Daud melepas Abner pergi
  rationale: Dalam konteks ini שלח berarti menyuruh pergi atau melepas seseorang setelah pertemuan. Pilihan ini menyatakan bahwa Daud mengizinkan dan mengantar kepergian Abner, bukan sekadar mengutusnya.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: Abner pun pergi dengan damai
  rationale: Nama Abner diulang demi kejelasan acuan dalam bahasa Indonesia. 'Pergi dengan damai' mempertahankan idiom Ibrani yang menyiratkan kepergian aman dan hubungan yang damai.
theological_decisions:
- issue: Bahasa perjanjian
  choice: mengikat perjanjian dengan Tuanku
  alternative: memotong perjanjian dengan Tuanku; mengadakan perjanjian dengan Tuanku
  rationale: Ayat ini berbicara tentang pembentukan perjanjian politik. 'Mengikat perjanjian' adalah ungkapan Indonesia yang jelas dan tidak memasukkan pengertian teologis tambahan, sementara arti harfiah idiom Ibrani dicatat.
- issue: Pemaknaan נפשׁ dalam ungkapan keinginan
  choice: segala yang Tuanku inginkan
  alternative: segala yang diinginkan jiwa Tuanku; segala yang dikehendaki hati Tuanku
  rationale: Di sini נפשׁ berfungsi sebagai diri atau pusat keinginan. Terjemahan utama menghindari ungkapan Indonesia yang kaku dan tidak menggantinya dengan 'hati', yang tidak terdapat dalam teks sumber; bentuk harfiahnya tetap tersedia dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Sapaan 'Tuanku' dipakai secara konsisten untuk mencerminkan penghormatan Abner kepada Daud sebagai raja. Struktur kalimat menjaga urutan tindakan dalam bahasa Ibrani, tetapi menghindari kekakuan yang tidak perlu.
