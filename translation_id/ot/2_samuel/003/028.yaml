  text: וַ/יִּשְׁמַ֤ע דָּוִד֙ מֵ/אַ֣חֲרֵי כֵ֔ן וַ/יֹּ֗אמֶר נָקִ֨י אָנֹכִ֧י וּ/מַמְלַכְתִּ֛/י מֵ/עִ֥ם יְהוָ֖ה עַד עוֹלָ֑ם מִ/דְּמֵ֖י אַבְנֵ֥ר בֶּן נֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/028.yaml
  text: Afterward[a], when David heard of it, he said[b], “I and my kingdom are forever innocent before Yahweh of the blood of Abner son of Ner.”
translation:
  language: id
  text: Sesudah itu[a], ketika Daud mendengar hal tersebut, ia berkata, “Aku dan kerajaanku untuk selama-lamanya tidak bersalah di hadapan Yahweh atas darah Abner anak Ner.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Setelah kejadian itu” atau “Kemudian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “dari darah-darah Abner,” sebuah ungkapan yang menunjuk pada tanggung jawab atas penumpahan darah Abner.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan waktu ini berarti ‘sesudah itu/kemudian’ dan menghubungkan pernyataan Daud dengan peristiwa yang baru saja diceritakan.
- source_word: וַיִּשְׁמַע דָּוִד
  choice: ketika Daud mendengar hal tersebut
  rationale: Kata kerja שׁמע berarti ‘mendengar’. ‘Hal tersebut’ menyatakan secara alami bahwa yang didengar ialah peristiwa sebelumnya, tanpa menambahkan informasi baru.
- source_word: נָקִי
  choice: tidak bersalah
  rationale: Kata ini menyatakan keadaan bebas dari kesalahan atau tanggung jawab dalam konteks hukum dan moral.
- source_word: אָנֹכִי וּמַמְלַכְתִּי
  choice: Aku dan kerajaanku
  rationale: Terjemahan ini mempertahankan penyangkalan tanggung jawab oleh Daud secara pribadi maupun oleh kerajaan yang dipimpinnya.
- source_word: מֵעִם יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menggambarkan kedudukan Daud dalam penilaian Yahweh sebagai saksi dan hakim.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menegaskan bahwa pernyataan bebas dari kesalahan itu berlaku terus-menerus.
- source_word: מִדְּמֵי
  choice: atas darah
  rationale: Bentuk harfiahnya ialah ‘dari darah-darah’, suatu idiom Ibrani yang menunjuk pada pertanggungjawaban atas penumpahan darah. Kata ‘atas’ membuat hubungan tanggung jawab itu wajar dalam bahasa Indonesia, sementara ‘darah’ mempertahankan citra konkret sumber.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner bin Ner
  rationale: ‘Bin’ merupakan bentuk patronimik yang ringkas, lazim, dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan pernyataan tidak bersalah
  choice: Aku dan kerajaanku
  alternative: Aku dan dinastiku; aku dan pemerintahan kerajaanku
  rationale: Teks mengaitkan Daud dan מַמְלַכְתִּי tanpa menjelaskan apakah yang terutama dimaksud ialah wilayah politik, pemerintahan, atau dinasti. ‘Kerajaanku’ mempertahankan keluasan makna tersebut tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan kalimat dijaga tetap alami, sementara ungkapan hukum-moral ‘tidak bersalah di hadapan Yahweh’ dan citra konkret ‘darah Abner’ dipertahankan.
