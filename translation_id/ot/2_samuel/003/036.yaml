base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/036.yaml
  text: And all the people recognized it[a], and it was good in their eyes; for everything the king did was good in the eyes of all the people.
translation:
  language: id
  text: Seluruh rakyat menyadari hal itu,[a] dan hal itu baik dalam pandangan mereka, sebagaimana segala sesuatu yang dilakukan raja baik dalam pandangan seluruh rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenali hal itu” atau “memahami hal itu.”
    reason: Verba Ibrani dapat menunjuk pada tindakan mengenali, mengetahui, atau menyadari sesuatu; objeknya tersirat dari konteks.
lexical_decisions:
- source_word: הִכִּירוּ
  choice: menyadari hal itu
  rationale: Bentuk Hifil dari נכר dapat berarti mengenali, mengetahui, atau menyadari. Dalam konteks ini, rakyat menangkap ketulusan sikap Daud mengenai kematian Abner; objeknya tersirat dari konteks.
- source_word: וַיִּיטַב בְּעֵינֵיהֶם
  choice: hal itu baik dalam pandangan mereka
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani tentang penilaian atau persetujuan, sekaligus tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה הַמֶּלֶךְ
  choice: Segala sesuatu yang dilakukan raja memang
  rationale: כְּכֹל di sini menghubungkan persetujuan rakyat terhadap tindakan ini dengan penilaian mereka terhadap segala tindakan raja. Partikel 'memang' mengungkapkan hubungan penegasan atau penjelasan secara alami tanpa memasukkan nama Daud yang tidak terdapat dalam teks.
- source_word: טוֹב
  choice: baik
  rationale: Pilihan umum ini mempertahankan pengulangan akar makna 'baik' dalam ayat dan tidak mempersempitnya menjadi hanya 'menyenangkan' atau 'benar'.
theological_decisions: []
