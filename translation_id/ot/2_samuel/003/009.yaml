revisions:
- from: Beginilah kiranya Allah bertindak terhadap Abner, bahkan lebih lagi, jika aku tidak melakukan bagi Daud seperti yang telah Yahweh sumpahkan kepadanya—ya, demikianlah akan kulakukan baginya.[a]
  to: Beginilah kiranya Allah melakukan hal itu terhadap Abner, bahkan lebih lagi, sebab seperti yang telah Yahweh sumpahkan kepada Daud, demikianlah akan kulakukan baginya—
  rationale: 'Terjemahan direvisi untuk mengikuti teks Ibrani secara lebih langsung: formula kutuk diri dipertahankan, כִּי diterjemahkan “sebab,” perbandingan כַּאֲשֶׁר ... כֵּן dipertahankan dengan “seperti ... demikianlah,” dan imperfek אֶעֱשֶׂה diterjemahkan futuris sebagai tekad, “akan kulakukan.” Pungtuasi akhir tetap berupa tanda pisah karena kalimat berlanjut ke ayat 10.'
