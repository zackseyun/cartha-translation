base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/009.yaml
  text: May God do so to Abner[a], and more also, if, just as Yahweh has sworn to David, so I do for him—
translation:
  language: id
  text: Beginilah kiranya Allah melakukan hal itu terhadap Abner, bahkan lebih lagi, sebab seperti yang telah Yahweh sumpahkan kepada Daud, demikianlah akan kulakukan baginya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים לְאַבְנֵר וְכֹה יֹסִיף לוֹ
  choice: Beginilah kiranya Allah bertindak terhadap Abner, bahkan lebih lagi
  rationale: Ungkapan ini merupakan rumusan sumpah Ibrani yang memohon hukuman ilahi atas diri si pembicara. Nama Abner dipertahankan dalam orang ketiga, sebagaimana teks sumber, sedangkan 'bahkan lebih lagi' menyampaikan unsur penguatan dalam וְכֹה יֹסִיף לוֹ.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam rumusan sumpah ini, kata tersebut menunjuk kepada Allah dalam bentuk tunggal, bukan kepada banyak ilah.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לְדָוִד
  choice: seperti yang telah Yahweh sumpahkan kepada Daud
  rationale: '''Seperti yang'' mempertahankan hubungan perbandingan, sedangkan ''telah ... sumpahkan'' menyatakan tindakan lampau yang tetap relevan bagi tekad Abner.'
- source_word: כִּי כֵן אֶעֱשֶׂה לוֹ
  choice: ya, demikianlah akan kulakukan baginya
  rationale: Bentuk imperfek אֶעֱשֶׂה dipahami berdaya futuris karena menyatakan tekad Abner. Kata ganti 'baginya' mempertahankan acuan pronominal teks Ibrani tanpa mengganti nama secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan dua klausa yang diawali כִּי dalam rumusan sumpah
  choice: jika aku tidak melakukan ... ya, demikianlah akan kulakukan
  alternative: sebab, seperti Yahweh telah bersumpah ... demikianlah akan kulakukan
  rationale: Dalam konteks rumusan kutuk diri, כִּי dapat berfungsi memperkenalkan syarat yang secara idiomatis mengandung penyangkalan tersirat ('jika aku tidak'). Terjemahan utama menyampaikan daya sumpah tersebut, sementara catatan kaki mencatat susunan yang lebih harfiah dan kemungkinan pembacaan lain.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Rumusan 'Beginilah kiranya Allah bertindak ...' mempertahankan daya kutuk diri tanpa memakai ungkapan yang terlalu arkais. Tanda pisah mengikuti kalimat sumber yang berlanjut ke ayat berikutnya.
