source:
  edition: WLC
  text: וְ/הַ/שִּׁשִּׁ֣י יִתְרְעָ֔ם לְ/עֶגְלָ֖ה אֵ֣שֶׁת דָּוִ֑ד אֵ֛לֶּה יֻלְּד֥וּ לְ/דָוִ֖ד בְּ/חֶבְרֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/005.yaml
  text: and the sixth[a], Ithream, by Eglah, David’s wife. These were born to David in Hebron.
translation:
  language: id
  text: dan yang keenam, Yitream, dari Egla, istri Daud.[a] Inilah anak-anak yang lahir bagi Daud di Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “istri Daud”. Dalam konteks ini, ungkapan tersebut menyebut Egla sebagai salah seorang istri Daud, bukan sebagai satu-satunya istri Daud.
    reason: Menjelaskan bahwa bentuk tunggal dalam frasa Ibrani tidak dimaksudkan untuk meniadakan istri-istri Daud yang lain.
lexical_decisions:
- source_word: וְהַשִּׁשִּׁי
  choice: dan yang keenam
  rationale: Kata bilangan bertingkat dengan kata penghubung melanjutkan daftar anak-anak Daud dari ayat-ayat sebelumnya. Kata “anak” tersirat dari konteks.
- source_word: יִתְרְעָם
  choice: Yitream
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: לְעֶגְלָה
  choice: dari Egla
  rationale: Dalam rumusan daftar kelahiran ini, לְ menandai ibu. “Dari Egla” menyampaikan hubungan maternal secara ringkas dan alami.
- source_word: אֵשֶׁת דָּוִד
  choice: istri Daud
  rationale: Frasa konstruksi ini secara harfiah berarti “istri Daud”. Bentuk ini tidak dengan sendirinya menyatakan bahwa Egla adalah satu-satunya istri Daud.
- source_word: אֵלֶּה
  choice: Inilah anak-anak
  rationale: Kata penunjuk merangkum daftar sebelumnya. “Anak-anak” ditambahkan karena jelas tersirat oleh konteks dan membuat kalimat bahasa Indonesia lebih alami.
- source_word: יֻלְּדוּ
  choice: yang lahir
  rationale: Bentuk pasif dari ילד dalam rumusan silsilah paling langsung menyatakan kelahiran, tanpa menambahkan penafsiran mengenai pelakunya.
- source_word: לְדָוִד
  choice: bagi Daud
  rationale: 'Dalam keterangan silsilah, ילד dengan לְ menyatakan hubungan orang tua: mereka lahir bagi Daud.'
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Kata depan ini menyatakan tempat kelahiran mereka.
theological_decisions:
- issue: Apakah אֵשֶׁת דָּוִד menyatakan Egla sebagai satu-satunya istri Daud?
  choice: istri Daud
  alternative: salah seorang istri Daud
  rationale: Terjemahan utama mempertahankan bentuk ringkas bahasa Ibrani. Konteks menunjukkan bahwa Egla adalah salah seorang dari beberapa istri Daud, tetapi unsur “salah seorang” tidak dinyatakan secara eksplisit dalam frasa sumber.
translation_notes:
  register: Bahasa dibuat ringkas, bermartabat, dan mudah dipahami. Struktur awal dipertahankan sebagai kelanjutan daftar dari ayat sebelumnya; penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
