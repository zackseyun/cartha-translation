base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/001.yaml
  text: The war between the house of Saul and the house of David was prolonged[a], and David kept growing stronger[b], while the house of Saul kept growing weaker.
translation:
  language: id
  text: Peperangan antara keluarga Saul[b] dan keluarga Daud berlangsung lama[a], sementara Daud semakin kuat dan keluarga Saul semakin lemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “panjang”; maksudnya, perang itu berlangsung dalam waktu yang lama.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “keluarga” secara harfiah berarti “rumah” dan dapat menunjuk pada rumah tangga, garis keluarga, atau wangsa yang berkuasa. Di sini maknanya mencakup unsur keluarga dan politik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה אֲרֻכָּה
  choice: Peperangan ... berlangsung lama
  rationale: Adjektiva אֲרֻכָּה secara harfiah berarti 'panjang' dan di sini menyatakan durasi. 'Berlangsung lama' alami dalam bahasa Indonesia dan tidak menyiratkan bahwa seseorang sengaja memperpanjang perang.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: antara keluarga Saul dan keluarga Daud
  rationale: בֵּית secara harfiah berarti 'rumah', tetapi dalam konteks ini menunjuk pada keluarga besar atau garis keluarga beserta kekuatan politiknya. 'Keluarga' mudah dipahami dan catatan kaki mempertahankan keluasan maknanya.
- source_word: וְדָוִד הֹלֵךְ וְחָזֵק
  choice: Daud semakin kuat
  rationale: Konstruksi הֹלֵךְ dengan predikat berikutnya menyatakan perkembangan yang terus berlangsung; 'semakin kuat' menyampaikan progresi itu secara ringkas dan alami.
- source_word: וּבֵית שָׁאוּל הֹלְכִים וְדַלִּים
  choice: keluarga Saul semakin lemah
  rationale: Ungkapan ini membentuk kontras progresif dengan menguatnya Daud. דַלִּים di sini menunjukkan berkurangnya kekuatan dan kedudukan, bukan kemiskinan ekonomi.
theological_decisions:
- issue: Cakupan istilah בֵּית dalam konflik antara Saul dan Daud
  choice: keluarga
  alternative: wangsa; dinasti; kaum
  rationale: Teks Ibrani dapat mencakup hubungan keluarga sekaligus kubu atau kekuasaan politik. 'Keluarga' menjaga unsur kekerabatan tanpa membatasi makna hanya pada dinasti resmi; keluasan politiknya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat memperjelas pertentangan antara kekuatan Daud yang meningkat dan keluarga Saul yang melemah. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
