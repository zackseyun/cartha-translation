base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/034.yaml
  text: Your hands were not bound[a], and your feet were not put into bronze fetters; as one falls before sons of injustice, so you have fallen. And all the people wept over him even more.
translation:
  language: id
  text: 'Tanganmu tidak terikat,

    dan kakimu tidak dimasukkan ke dalam belenggu perunggu.

    Seperti orang yang jatuh di hadapan orang-orang jahat,[a]

    demikianlah engkau telah jatuh.

    Lalu seluruh rakyat makin menangisi dia.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan anak-anak kejahatan”; maksudnya, di hadapan orang-orang jahat atau para pelaku kejahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶךָ לֹא אֲסֻרוֹת
  choice: Tanganmu tidak terikat
  rationale: Bentuk pasif אֲסֻרוֹת menyatakan keadaan terikat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan seorang tahanan.
- source_word: וְרַגְלֶיךָ לֹא לִנְחֻשְׁתַּיִם הֻגָּשׁוּ
  choice: dan kakimu tidak dipasung dengan belenggu perunggu
  rationale: נְחֻשְׁתַּיִם menunjuk pada belenggu kaki dari tembaga atau perunggu, sedangkan הֻגָּשׁוּ dalam konteks ini berarti dimasukkan atau dikenakan pada belenggu. 'Dipasung dengan belenggu perunggu' menyampaikan fungsi dan bahannya.
- source_word: כִּנְפוֹל
  choice: Seperti orang yang jatuh
  rationale: Infinitif dengan כְּ menyatakan perbandingan umum. Penambahan 'orang yang' menghasilkan bahasa Indonesia yang wajar tanpa menentukan subjek secara lebih khusus.
- source_word: לִפְנֵי בְנֵי עַוְלָה
  choice: di hadapan orang-orang jahat
  rationale: Ungkapan harfiah 'anak-anak kejahatan/kelaliman' merupakan idiom Ibrani bagi orang-orang jahat atau pelaku kejahatan. Terjemahan idiomatis dipilih dalam teks, sementara bentuk harfiahnya dicatat.
- source_word: נָפָלְתָּ
  choice: demikianlah engkau telah gugur
  rationale: Kata נפל dapat berarti jatuh, tetapi dalam ratapan atas orang yang dibunuh, 'gugur' menyampaikan kematian secara wajar dan bermartabat. Bentuk perfektifnya dipertahankan dengan 'telah'.
- source_word: וַיֹּסִפוּ כָל הָעָם לִבְכּוֹת עָלָיו
  choice: Lalu seluruh rakyat menangisi dia dengan semakin pilu
  rationale: Konstruksi יסף + infinitif dapat berarti melanjutkan atau menambah tindakan. Dalam konteks ratapan yang membangkitkan tangisan lebih lanjut, frasa ini menyampaikan intensifikasi tanpa memakai ungkapan Indonesia yang kaku.
theological_decisions: []
translation_notes:
  register: Bahasa ratapan dibuat puitis, khidmat, dan mudah dipahami. Paralelisme antarbait dipertahankan. 'Engkau' dipakai karena sesuai dengan tuturan ratapan yang bermartabat; 'rakyat' menerjemahkan הָעָם dalam konteks komunitas Israel.
