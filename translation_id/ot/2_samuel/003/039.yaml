  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָנֹכִ֨י הַ/יּ֥וֹם רַךְ֙ וּ/מָשׁ֣וּחַ מֶ֔לֶךְ וְ/הָ/אֲנָשִׁ֥ים הָ/אֵ֛לֶּה בְּנֵ֥י צְרוּיָ֖ה קָשִׁ֣ים מִמֶּ֑/נִּי יְשַׁלֵּ֧ם יְהוָ֛ה לְ/עֹשֵׂ֥ה הָ/רָעָ֖ה כְּ/רָעָתֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/039.yaml
  text: And I am still weak today[a], though anointed king; and these men, the sons of Zeruiah, are too harsh for me[b]. May Yahweh repay the evildoer according to his evil.
translation:
  language: id
  text: Hari ini aku masih lemah[a], sekalipun aku telah diurapi menjadi raja, sedangkan orang-orang ini, anak-anak Zeruya, terlalu keras bagiku. Kiranya Yahweh membalas orang yang berbuat jahat setimpal dengan kejahatannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “lemah” juga dapat berarti “lunak” atau “lembut”; di sini tampaknya menunjuk pada kelemahan atau kerentanan Daud.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Yahweh akan membalas orang yang berbuat jahat setimpal dengan kejahatannya.” Bentuk kata kerja Ibraninya dapat pula dipahami sebagai pernyataan masa depan.
    reason: alternative_reading
lexical_decisions:
- source_word: רַךְ
  choice: lemah
  rationale: Dalam konteks ini, Daud menyatakan ketidakberdayaan atau kerentanan praktisnya terhadap anak-anak Zeruya. “Lemah” menyampaikan maksud itu dengan lebih jelas daripada arti harfiah lain seperti “lunak” atau “lembut”.
- source_word: וּמָשׁוּחַ מֶלֶךְ
  choice: sekalipun aku telah diurapi menjadi raja
  rationale: 'Dua keadaan yang disandingkan dalam bahasa Ibrani mengandung pertentangan: Daud lemah meskipun berstatus sebagai raja yang telah diurapi. Kata “sekalipun” membuat hubungan itu wajar dalam bahasa Indonesia tanpa mengubah isinya.'
- source_word: בְּנֵי צְרוּיָה
  choice: anak-anak Zeruya
  rationale: Ungkapan kekeluargaan ini dipertahankan karena merupakan sebutan khas bagi Yoab dan saudara-saudaranya serta memiliki daya retoris dalam konteks.
- source_word: קָשִׁים מִמֶּנִּי
  choice: terlalu keras bagiku
  rationale: Kata קָשִׁים dapat menunjuk pada sifat keras, bengis, atau kekuatan yang sulit dihadapi. Terjemahan ini mempertahankan keluasan maknanya dan keluhan Daud bahwa ia tidak sanggup menangani mereka.
- source_word: יְשַׁלֵּם
  choice: Kiranya ... membalas
  rationale: Bentuk imperfek ini secara kontekstual dapat menyatakan harapan atau permohonan agar keadilan ilahi dijalankan. Kemungkinan sebagai pernyataan masa depan tetap dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: לְעֹשֵׂה הָרָעָה
  choice: orang yang berbuat jahat
  rationale: Frasa partisipial Ibrani menunjuk kepada pelaku kejahatan. Bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: כְּרָעָתוֹ
  choice: setimpal dengan kejahatannya
  rationale: Ungkapan ini menyatakan pembalasan yang sepadan dengan kejahatan pelaku. “Setimpal dengan” menyampaikan gagasan proporsional yang terkandung dalam preposisi כְּ.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Transliterasi mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Daya pernyataan penutup Daud
  choice: 'Harapan atau permohonan: “Kiranya Yahweh membalas ...”'
  alternative: 'Pernyataan masa depan: “Yahweh akan membalas ...”'
  rationale: Dalam konteksnya, Daud menyerahkan pembalasan kepada Allah; bentuk Ibraninya dapat dipahami sebagai harapan atau sebagai pernyataan masa depan. Terjemahan utama memilih nuansa harapan, sedangkan kemungkinan prediktif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pertentangan antara kelemahan Daud dan kedudukannya sebagai raja yang telah diurapi. Istilah “terlalu keras bagiku” sengaja mempertahankan ketegangan antara kekerasan watak anak-anak Zeruya dan ketidakmampuan Daud menghadapi mereka.
