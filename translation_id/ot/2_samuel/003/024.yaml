base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/024.yaml
  text: Then Joab came to the king and said[a], “What have you done? Look, Abner came to you. Why is this—you sent him away, and he has gone on his way?”
translation:
  language: id
  text: Kemudian Yoab datang menghadap raja dan berkata, “Apa yang telah kaulakukan? Lihat, Abner datang kepadamu. Mengapa engkau sampai membiarkannya pergi, dan ia benar-benar sudah pergi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk “ia pergi, pergi,” yaitu susunan penegasan yang berarti bahwa ia sungguh-sungguh atau sepenuhnya telah pergi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Kemudian Yoab datang menghadap raja
  rationale: Rangkaian wayyiqtol melanjutkan alur cerita; “kemudian” alami dalam narasi Indonesia. “Menghadap raja” mengungkapkan kedatangan kepada raja secara idiomatis dalam konteks istana.
- source_word: מֶה עָשִׂיתָה
  choice: Apa yang telah kaulakukan?
  rationale: Bentuk perfektif menyatakan tindakan yang sudah dilakukan dan akibatnya masih menjadi pokok teguran Yoab.
- source_word: הִנֵּה
  choice: Lihat,
  rationale: Kata ini menarik perhatian dengan tegas; “lihat” modern dan langsung tanpa nuansa arkais.
- source_word: בָא אַבְנֵר אֵלֶיךָ
  choice: Abner datang kepadamu
  rationale: Terjemahan langsung yang mempertahankan fakta utama dalam protes Yoab.
- source_word: לָמָּה זֶּה
  choice: Mengapa sampai
  rationale: Ungkapan ini lebih tajam daripada pertanyaan “mengapa” biasa. “Mengapa sampai” mempertahankan nada heran sekaligus menuduh dengan bahasa Indonesia yang alami.
- source_word: שִׁלַּחְתּוֹ
  choice: engkau membiarkannya pergi
  rationale: Piel שלח di sini menunjuk pada melepaskan atau mengizinkan seseorang pergi; pilihan ini menghindari kesan bahwa Daud memerintahkan Abner melakukan suatu tugas.
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: dan sekarang ia benar-benar sudah pergi
  rationale: Gabungan verba finit dengan infinitif absolut menegaskan keberangkatan Abner. “Benar-benar sudah pergi” menyampaikan tindakan yang tuntas dan penekanannya secara wajar.
