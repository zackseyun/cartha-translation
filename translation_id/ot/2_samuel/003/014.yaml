  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח דָּוִד֙ מַלְאָכִ֔ים אֶל אִֽישׁ בֹּ֥שֶׁת בֶּן שָׁא֖וּל לֵ/אמֹ֑ר תְּנָ֤/ה אֶת אִשְׁתִּ/י֙ אֶת מִיכַ֔ל אֲשֶׁר֙ אֵרַ֣שְׂתִּי לִ֔/י בְּ/מֵאָ֖ה עָרְל֥וֹת פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/014.yaml
  text: Then David sent messengers to Ish-bosheth son of Saul[a], saying, “Give me my wife Michal[b], whom I betrothed to myself for a hundred Philistine foreskins.”
translation:
  language: id
  text: Kemudian Daud mengirim para utusan kepada Isyboset anak Saul dengan pesan, “Serahkan kepadaku istriku, Mikhal, yang telah kupinang bagi diriku dengan seratus kulit khatan orang Filistin.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “yang kuperoleh sebagai istriku dengan seratus kulit khatan orang Filistin.” Secara lebih harfiah, teks Ibrani berbunyi, “yang kupinang bagi diriku.”
    reason: lexical_alternative
  - marker: b
    text: Lihat 1 Samuel 18:25–27 mengenai Daud memperoleh Mikhal dengan menyerahkan kulit khatan orang Filistin sebagai harga pengantin yang dituntut Saul.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kemudian Daud mengirim
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “kemudian” menyatakan urutan secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks manusia, kata ini menunjuk kepada orang-orang yang membawa pesan; “utusan” alami dan tetap sesuai dengan fungsi mereka.
- source_word: אֶל אִישׁ בֹּשֶׁת בֶּן שָׁאוּל
  choice: kepada Isyboset anak Saul
  rationale: Nama diri dialihaksarakan dalam bentuk yang lazim dalam bahasa Indonesia, sedangkan aposisi “anak Saul” dipertahankan dekat dengan struktur Ibrani.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Ungkapan ini memperkenalkan kutipan langsung. “Dengan pesan” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dengan berkata”.
- source_word: תְּנָה
  choice: Serahkan kepadaku
  rationale: Imperatif נתן menyatakan tuntutan langsung. Dalam konteks meminta seseorang dikembalikan, “serahkan kepadaku” lebih tepat daripada sekadar “berikan kepadaku”.
- source_word: אֶת אִשְׁתִּי אֶת מִיכַל
  choice: istriku, Mikhal
  rationale: Objek kedua merupakan aposisi yang mengidentifikasi istri tersebut sebagai Mikhal.
- source_word: אֲשֶׁר אֵרַשְׂתִּי לִי
  choice: yang telah kupinang bagi diriku
  rationale: ארשׂ secara khusus berkaitan dengan peminangan atau pertunangan. “Bagi diriku” mempertahankan unsur לִי dan penegasan klaim Daud, tanpa mengubahnya menjadi istilah perkawinan yang lebih umum.
- source_word: בְּמֵאָה
  choice: dengan seratus
  rationale: Preposisi ב menandai sarana atau harga peminangan. “Dengan” mempertahankan bentuk ungkapan sumber dan dapat dipahami sebagai harga pengantin.
- source_word: עָרְלוֹת פְּלִשְׁתִּים
  choice: kulit khatan orang Filistin
  rationale: Terjemahan konkret ini mempertahankan sifat mengerikan dari harga pengantin yang disebutkan dalam sumber. Bentuk “orang Filistin” menyampaikan nomina kolektif secara alami.
theological_decisions:
- issue: Istilah status perkawinan Mikhal
  choice: Mempertahankan “istriku” untuk אִשְׁתִּי dan “telah kupinang” untuk אֵרַשְׂתִּי.
  alternative: Menghaluskan keduanya menjadi “yang kunikahi” atau menerjemahkan keseluruhan klaim sebagai “yang kuperoleh sebagai istri.”
  rationale: Teks Ibrani menyandingkan klaim Daud bahwa Mikhal adalah istrinya dengan dasar klaim berupa peminangan dan harga pengantin. Ketegangan hukum-relasional ini dipertahankan, bukan diselaraskan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “kupinang” mudah dipahami pembaca umum sekaligus menjaga kekhususan istilah pertunangan. Ungkapan yang keras dalam sumber tidak diperhalus.
