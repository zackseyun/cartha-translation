  text: Then the king said to his servants[a], “Do you not know that a prince and a great man has fallen today in Israel?”
translation:
  language: id
  text: Lalu raja berkata kepada para pegawainya, “Bukankah kalian tahu bahwa hari ini seorang pemimpin[a] dan tokoh besar telah gugur di Israel?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang panglima,” “seorang penguasa,” atau “seorang pembesar.” Kata Ibrani שַׂר dapat menunjuk kepada pemimpin, panglima, penguasa, atau pejabat tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menghasilkan alur bahasa Indonesia yang alami.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina definit ini merujuk kepada Daud dalam konteks, tetapi namanya tidak perlu ditambahkan ke dalam teks.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk kepada orang-orang yang melayani raja. “Para pegawainya” alami dalam bahasa Indonesia dan tidak secara khusus menyatakan bahwa mereka budak atau pejabat tinggi.
- source_word: הֲלוֹא תֵדְעוּ
  choice: Bukankah kalian tahu
  rationale: Gabungan partikel tanya dan negasi membentuk pertanyaan retoris yang mengharapkan persetujuan. “Kalian” memperjelas bahwa sapaan ini berbentuk jamak.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang seharusnya mereka ketahui.
- source_word: שַׂר
  choice: pemimpin
  rationale: שַׂר dapat berarti pemimpin, panglima, penguasa, pejabat tinggi, atau pangeran. Dalam konteks Abner, “pemimpin” mempertahankan cakupan militer-politiknya tanpa menyiratkan keturunan kerajaan.
- source_word: וְגָדוֹל
  choice: dan orang besar
  rationale: Kata sifat גָדוֹל dipakai secara substantival untuk menekankan kebesaran atau kedudukan penting Abner. Ungkapan ini mempertahankan dua sebutan yang dihubungkan oleh וְ.
- source_word: נָפַל
  choice: telah gugur
  rationale: “Gugur” merupakan ungkapan bahasa Indonesia yang wajar dan bermartabat untuk kematian seorang tokoh dalam konteks ini; “telah” menonjolkan akibat peristiwa yang baru terjadi.
- source_word: הַיּוֹם הַזֶּה
  choice: hari ini
  rationale: Padanan alami dalam bahasa Indonesia modern untuk ungkapan harfiah “pada hari ini”.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi בְּ menunjukkan lingkup bangsa atau wilayah tempat kehilangan besar itu terjadi.
