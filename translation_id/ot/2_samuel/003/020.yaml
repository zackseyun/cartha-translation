  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨א אַבְנֵ֤ר אֶל דָּוִד֙ חֶבְר֔וֹן וְ/אִתּ֖/וֹ עֶשְׂרִ֣ים אֲנָשִׁ֑ים וַ/יַּ֨עַשׂ דָּוִ֧ד לְ/אַבְנֵ֛ר וְ/לַ/אֲנָשִׁ֥ים אֲשֶׁר אִתּ֖/וֹ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/020.yaml
  text: Abner came to David at Hebron[a], and twenty men were with him. And David made a feast for Abner and for the men who were with him.
translation:
  language: id
  text: Abner datang kepada Daud di Hebron bersama dua puluh orang. Lalu Daud mengadakan perjamuan[a] bagi Abner dan bagi orang-orang yang menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat perjamuan”; dapat juga diterjemahkan “menyiapkan jamuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata kerja בוא dapat berarti ‘datang’, ‘pergi’, atau ‘tiba’ menurut sudut pandang. Karena Daud di Hebron menjadi tujuan dan pusat adegan, ‘datang’ paling alami.
- source_word: אֶל דָּוִד חֶבְרוֹן
  choice: kepada Daud di Hebron
  rationale: Walaupun sebelum חֶבְרוֹן tidak ada preposisi tersurat, dalam konteks nama tempat itu menunjukkan lokasi Daud; ‘di Hebron’ menyampaikan hubungan ini secara wajar dalam bahasa Indonesia.
- source_word: וְאִתּוֹ עֶשְׂרִים אֲנָשִׁים
  choice: bersama dua puluh orang
  rationale: Ungkapan Ibrani ini tidak memakai verba dan secara harfiah berarti ‘dan bersamanya dua puluh orang’. ‘Bersama dua puluh orang’ ringkas, alami, dan mempertahankan jumlah serta hubungan pendampingan.
- source_word: וַיַּעַשׂ ... מִשְׁתֶּה
  choice: mengadakan perjamuan
  rationale: Gabungan עשה dan מִשְׁתֶּה secara idiomatis menunjuk pada penyelenggaraan jamuan. ‘Mengadakan perjamuan’ alami dan bermartabat, tanpa melebihkan unsur minum yang dapat tersirat dalam מִשְׁתֶּה.
- source_word: לְאַבְנֵר וְלָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: bagi Abner dan bagi orang-orang yang menyertainya
  rationale: Pengulangan ‘bagi’ mencerminkan pengulangan preposisi ל dalam bahasa Ibrani, sedangkan ‘yang menyertainya’ mempertahankan ungkapan eksplisit sumber tanpa mengubahnya menjadi bentuk posesif ‘anak buahnya’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang alami dan bernada naratif. Penanda catatan kaki ditempatkan sesudah ‘perjamuan’, yaitu pada unsur yang dijelaskan oleh catatan leksikal; penempatannya sesudah ‘Hebron’ dalam lapisan konsultasi Inggris tampaknya tidak sesuai dengan isi catatan.
