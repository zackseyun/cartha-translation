revisions:
- from: Ketika Abner kembali ke Hebron, Yoab menariknya ke samping, ke bagian dalam pintu gerbang, untuk berbicara empat mata dengannya. Di sana Yoab menghantam bagian perutnya[a], sehingga ia mati, karena darah Asael, saudaranya.
  to: Ketika Abner kembali ke Hebron, Yoab menariknya ke tengah pintu gerbang untuk berbicara dengannya secara pribadi. Di sana Yoab menghantam perutnya[a], sehingga ia mati, karena darah Asael, saudara Yoab.
  rationale: Revisi memperjelas bahwa Asael ialah saudara Yoab, memperlancar pengungkapan gerakan menuju bagian dalam pintu gerbang, dan menggunakan ungkapan yang lebih netral untuk percakapan pribadi. Catatan kaki diperjelas agar alternatif tradisional dan penjelasan idiomatisnya tidak tercampur. Makna, urutan naratif, dan ambiguitas leksikal ungkapan Ibrani yang sulit tetap dijaga.
