base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/027.yaml
  text: When Abner returned to Hebron[a], Joab drew him aside into the middle of the gate to speak with him privately, and there he struck him in the belly, so that he died, for the blood of Asahel his brother.
translation:
  language: id
  text: Ketika Abner kembali ke Hebron, Yoab menariknya ke tengah pintu gerbang untuk berbicara dengannya secara pribadi. Di sana Yoab menghantam perutnya[a], sehingga ia mati, karena darah Asael, saudara Yoab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Terjemahan tradisional: “pada tulang rusuk kelima”; ungkapan Ibrani ini tampaknya menunjuk daerah perut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Verba שׁוב menyatakan bahwa Abner kembali ke Hebron setelah sebelumnya disuruh pergi.
- source_word: וַיַּטֵּהוּ
  choice: menariknya ke samping
  rationale: Bentuk hifil dari נטה di sini menunjukkan bahwa Yoab mengalihkan Abner dari jalannya ke tempat tersendiri; pilihan ini mempertahankan unsur arah dalam verba tersebut.
- source_word: אֶל־תּוֹךְ הַשַּׁעַר
  choice: ke bagian dalam pintu gerbang
  rationale: תּוֹךְ menunjuk bagian tengah atau interior, sedangkan שַׁעַר dapat berarti bangunan atau kawasan pintu gerbang. Ungkapan ini dekat dengan bahasa Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: לְדַבֵּר אִתּוֹ בַּשֶּׁלִי
  choice: untuk berbicara empat mata dengannya
  rationale: בַּשֶּׁלִי merupakan ungkapan sulit yang kemungkinan menyiratkan ketenangan, keleluasaan, atau sifat pribadi. Dalam konteks ini, “berbicara empat mata” menyampaikan percakapan pribadi tanpa menentukan nuansa yang lebih jauh.
- source_word: וַיַּכֵּהוּ שָׁם הַחֹמֶשׁ
  choice: Di sana Yoab menghantam bagian perutnya
  rationale: נכה berarti memukul atau menghantam; “menghantam” cocok untuk pukulan mematikan tanpa menambahkan senjata yang tidak disebutkan. חֹמֶשׁ dalam kisah kematian ini menunjuk kawasan perut, meskipun secara tradisional diterjemahkan “tulang rusuk kelima.” Subjek Yoab diulang demi kejelasan.
- source_word: וַיָּמָת
  choice: sehingga ia mati
  rationale: Bentuk naratif ini melanjutkan akibat langsung dari hantaman tersebut. “Sehingga” menyampaikan hubungan sebab-akibat secara alami dalam bahasa Indonesia.
- source_word: בְּדַם עֲשָׂהאֵל אָחִיו
  choice: karena darah Asael, saudaranya
  rationale: Preposisi בְּ dapat menyatakan sebab atau motif. Rumusan ini mempertahankan ungkapan darah dan nuansa pembalasan hukum tanpa menambahkan penilaian teologis. “Saudaranya” juga mempertahankan bentuk relasional teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Berbicara empat mata” dipakai sebagai ungkapan umum untuk percakapan pribadi; struktur akhir sengaja mempertahankan ungkapan ringkas “karena darah Asael” dari teks Ibrani. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
