base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/025.yaml
  text: You know Abner son of Ner[a], that he came to deceive you, and to learn your going out and your coming in[b], and to learn all that you are doing.
translation:
  language: id
  text: Engkau tahu bahwa Abner anak Ner datang untuk memperdaya engkau, untuk mencari tahu keluar masukmu[a], dan untuk mencari tahu segala sesuatu yang sedang kaulakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluarmu dan masukmu,” sebuah ungkapan yang mencakup seluruh pergerakan atau kegiatan seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Engkau mengenal
  rationale: Bentuk perfektif Qal orang kedua tunggal maskulin dapat menyatakan keadaan kini. Dalam konteks ini, Yoab menegaskan bahwa Daud mengetahui watak atau maksud Abner; 'mengenal' lebih alami daripada 'mengetahui Abner'.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner anak Ner
  rationale: Nama diri ditransliterasikan dan ungkapan keturunan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: Ia
  rationale: Partikel ini memperkenalkan isi yang seharusnya diketahui Daud. Hubungannya disampaikan secara alami dengan memulai kalimat penjelas baru, tanpa memaksakan padanan konjungsi yang kaku.
- source_word: לְפַתֹּתְךָ
  choice: untuk memperdaya engkau
  rationale: Kata פתה dapat berarti membujuk, memikat, atau menipu. Konteks tuduhan politik dan militer mendukung nuansa manipulasi bermusuhan, yang secara tepat disampaikan oleh 'memperdaya'.
- source_word: בָּא
  choice: Ia datang
  rationale: Bentuk perfektif merujuk pada kedatangan Abner yang baru saja terjadi; bentuk lampau dipahami secara wajar dari konteks naratif bahasa Indonesia.
- source_word: לָדַעַת
  choice: untuk mengetahui
  rationale: Infinitif ini menyatakan tujuan memperoleh informasi. 'Mengetahui' mempertahankan hubungan leksikal dengan ידע tanpa terdengar janggal.
- source_word: מוֹצָאֲךָ ... מְבוֹאֶךָ
  choice: keluar masukmu
  rationale: Ungkapan berpasangan ini dipertahankan secara ringkas dan idiomatis dalam bahasa Indonesia, menunjuk pada seluruh pergerakan atau kegiatan Daud.
- source_word: כָּל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: segala sesuatu yang sedang kaulakukan
  rationale: Partisipel עֹשֶׂה mendukung tindakan yang sedang berlangsung; 'sedang kaulakukan' menyampaikan kegiatan Daud yang menjadi sasaran pengamatan.
