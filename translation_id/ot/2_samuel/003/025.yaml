  register: Bahasa Indonesia baku modern dengan sapaan 'engkau' yang sesuai bagi percakapan langsung dalam narasi Alkitab. Susunan kalimat dibuat alami dan bermartabat, sementara idiom Ibrani 'keluar masuk' dipertahankan serta dijelaskan dalam catatan kaki.
