    issue: Klausa pengantar כִּי tidak diterjemahkan secara eksplisit.
    rationale: 'Dalam Ibrani, כִּי mengawali isi yang Daud diklaim sudah ketahui: Abner datang untuk tujuan-tujuan tersebut. Memisahkannya menjadi “Ia datang” melemahkan hubungan ini.'
  - severity: low
    issue: Catatan kaki a tidak selaras dengan penempatan penanda dan memperkenalkan alternatif yang kurang tepat.
    rationale: Penanda a ditempatkan pada “Ner”, tetapi catatan membahas seluruh “Engkau mengenal ...”; selain itu, alternatif tersebut mengaburkan bahwa yang diketahui ialah maksud kedatangan Abner sebagaimana dijelaskan sesudah כִּי.
  revised_text: Engkau tahu bahwa Abner anak Ner datang untuk memperdaya engkau, untuk mencari tahu keluar masukmu[a], dan untuk mencari tahu segala sesuatu yang sedang kaulakukan.
