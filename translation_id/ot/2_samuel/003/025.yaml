  to: Engkau tahu bahwa Abner anak Ner datang untuk memperdaya engkau, untuk mencari tahu keluar masukmu[a], dan untuk mencari tahu segala sesuatu yang sedang kaulakukan.
  rationale: Revisi memulihkan hubungan antara “Engkau tahu” dan klausa yang diperkenalkan oleh כִּי dengan “bahwa.” “Mencari tahu” menyampaikan tujuan Abner memperoleh informasi, sementara “keluar masukmu” mempertahankan idiom Ibrani dan dijelaskan dalam catatan kaki. Catatan a lama dihapus karena tidak diperlukan dan kurang selaras dengan teks serta penandanya.
