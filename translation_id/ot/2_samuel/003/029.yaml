  text: יָחֻ֨לוּ֙ עַל רֹ֣אשׁ יוֹאָ֔ב וְ/אֶ֖ל כָּל בֵּ֣ית אָבִ֑י/ו וְֽ/אַל יִכָּרֵ֣ת מִ/בֵּ֣ית יוֹאָ֡ב זָ֠ב וּ/מְצֹרָ֞ע וּ/מַחֲזִ֥יק בַּ/פֶּ֛לֶךְ וְ/נֹפֵ֥ל בַּ/חֶ֖רֶב וַ/חֲסַר לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/029.yaml
  text: May it fall on the head of Joab and on all his father’s house[a], and may there never be cut off from the house of Joab one who has a discharge, or is leprous, or holds a staff, or falls by the sword[b], or lacks bread.
translation:
  language: id
  text: Kiranya itu menimpa kepala Yoab dan seluruh keluarga ayahnya, dan kiranya dari keluarga Yoab tidak pernah terputus orang yang mengalami lelehan tubuh, yang menderita penyakit kulit[a], yang memegang gelendong[b], yang tewas oleh pedang, atau yang kekurangan makanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara tradisional diterjemahkan “kusta”, tetapi dapat mencakup berbagai penyakit kulit serius dan tidak harus berarti penyakit Hansen.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang bersandar pada tongkat”. Arti ungkapan Ibrani ini tidak pasti; kata yang diterjemahkan “gelendong” biasanya menunjuk pada alat untuk memintal.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: יָחֻלוּ עַל רֹאשׁ
  choice: Kiranya itu menimpa kepala
  rationale: Bentuk ini menyampaikan kutukan atau harapan penghukuman, sedangkan “itu” secara wajar menunjuk pada pertumpahan darah atau kesalahan yang disebut dalam ayat sebelumnya. Ungkapan “menimpa kepala” mempertahankan idiom Ibrani tentang tanggung jawab dan pembalasan.
- source_word: בֵּית אָבִיו
  choice: seluruh keluarga ayahnya
  rationale: Mengungkapkan rumah tangga atau kaum leluhur dari pihak ayah dalam bahasa Indonesia yang alami tanpa mempersempitnya hanya pada rumah fisik.
- source_word: אַל יִכָּרֵת מִבֵּית יוֹאָב
  choice: kiranya dari keluarga Yoab tidak pernah terputus
  rationale: Mempertahankan gambaran Ibrani tentang berbagai malapetaka yang tidak pernah berhenti atau lenyap dari garis keluarga Yoab.
- source_word: זָב
  choice: orang yang mengeluarkan lelehan
  rationale: Menunjuk pada orang yang mengalami lelehan tubuh yang menjadikannya najis menurut ketentuan ritual; pilihan ini mempertahankan istilah konkret tanpa menebak diagnosis medis tertentu.
- source_word: מְצֹרָע
  choice: yang menderita penyakit kulit yang menajiskan
  rationale: Istilah Ibrani mencakup berbagai penyakit kulit serius dan tidak identik secara pasti dengan penyakit Hansen yang kini disebut kusta.
- source_word: מַחֲזִיק בַּפֶּלֶךְ
  choice: yang memegang alat pemintal
  rationale: פֶּלֶךְ paling langsung menunjuk pada alat untuk memintal. Terjemahan konkret dipertahankan karena makna sosial atau kondisi fisik yang tersirat tidak pasti; kemungkinan “tongkat” dicatat dalam catatan kaki.
- source_word: נֹפֵל בַּחֶרֶב
  choice: yang tewas oleh pedang
  rationale: Menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia sekaligus mempertahankan citra pedang.
- source_word: חֲסַר לָחֶם
  choice: yang kekurangan makanan
  rationale: לֶחֶם secara harfiah berarti roti, tetapi dalam konteks ini mewakili makanan atau nafkah secara umum; “kekurangan makanan” lebih alami dan jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Sifat perkataan Daud
  choice: Harapan penghukuman atau kutukan terhadap Yoab dan keluarganya
  alternative: Pernyataan prediktif tentang apa yang kelak terjadi
  rationale: Bentuk verba dan susunan kalimat paling wajar dipahami sebagai ucapan kutukan (“kiranya”), bukan sekadar ramalan netral.
- issue: Acuan subjek tersirat dalam יָחֻלוּ
  choice: “Itu” menunjuk secara kontekstual pada kesalahan atau pertumpahan darah Abner
  alternative: Subjek jamak yang dinyatakan secara harfiah sebagai “semuanya”
  rationale: Bahasa sumber tidak menyebut ulang nomina acuannya. Kata “itu” mempertahankan hubungan dengan ayat sebelumnya tanpa menentukan secara berlebihan apakah yang menimpa ialah kesalahan, darah, atau kutukannya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Susunan kutukan dipertahankan dengan “kiranya”; istilah medis tidak dibuat lebih spesifik daripada bahasa Ibrani, dan ketidakpastian pada פֶּלֶךְ dijaga melalui catatan kaki.
