source:
  edition: WLC
  text: וְ/עַתָּ֖ה עֲשׂ֑וּ כִּ֣י יְהוָ֗ה אָמַ֤ר אֶל דָּוִד֙ לֵ/אמֹ֔ר בְּ/יַ֣ד דָּוִ֣ד עַבְדִּ֗/י הוֹשִׁ֜יעַ אֶת עַמִּ֤/י יִשְׂרָאֵל֙ מִ/יַּ֣ד פְּלִשְׁתִּ֔ים וּ/מִ/יַּ֖ד כָּל אֹיְבֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/018.yaml
  text: Now then[a], do it, for Yahweh has spoken concerning David, saying, ‘By the hand of my servant David I will save my people Israel from the hand of the Philistines and from the hand of all their enemies.’
translation:
  language: id
  text: 'Sekarang, lakukanlah itu, sebab Yahweh telah berfirman tentang Daud: “Dengan perantaraan Daud, hamba-Ku, Aku akan menyelamatkan[a] umat-Ku Israel dari tangan orang Filistin dan dari tangan semua musuh mereka.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Daud, hamba-Ku, akan menyelamatkan umat-Ku Israel dari tangan orang Filistin dan dari tangan semua musuh mereka.” Bentuk Ibraninya dapat dipahami dengan Daud sebagai subjek gramatikal, bukan dengan Yahweh sebagai pembicara yang bertindak melalui Daud.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda peralihan yang mendesak dari pembicaraan sebelumnya menuju tindakan; dalam bahasa Indonesia, “Sekarang” secara alami membawa daya temporal sekaligus desakan kontekstual.
- source_word: עֲשׂוּ
  choice: lakukanlah itu
  rationale: Bentuk imperatif maskulin jamak memerintahkan para tua-tua Israel untuk melaksanakan tindakan yang baru dibicarakan. Partikel “-lah” mempertahankan ketegasan perintah dengan ragam yang wajar dan bermartabat.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi perintah sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אָמַר אֶל דָּוִד לֵאמֹר
  choice: telah berfirman mengenai Daud, demikian
  rationale: Dalam konteks ini, perkataan yang menyusul berbicara tentang Daud sebagai hamba yang dipakai Yahweh. “Mengenai Daud” menyampaikan fungsi kontekstual אֶל, sedangkan “telah berfirman” menunjukkan bahwa firman terdahulu menjadi dasar tindakan sekarang.
- source_word: בְּיַד דָּוִד עַבְדִּי
  choice: Dengan perantaraan Daud, hamba-Ku
  rationale: Ungkapan בְּיַד menyatakan sarana atau perantaraan. “Dengan perantaraan” terdengar alami dalam bahasa Indonesia dan mempertahankan pembedaan antara tindakan ilahi dan peranan Daud sebagai alat yang ditetapkan.
- source_word: הוֹשִׁיעַ
  choice: Aku akan menyelamatkan
  rationale: Dalam alur ucapan ilahi, terjemahan utama memahami Yahweh sebagai pelaku utama yang menyelamatkan dengan perantaraan Daud. Karena bentuk Ibraninya membuka kemungkinan pembacaan lain, alternatifnya dicatat dalam catatan kaki.
- source_word: עַמִּי יִשְׂרָאֵל
  choice: umat-Ku Israel
  rationale: Mempertahankan kepemilikan perjanjian dan nama bangsa dalam susunan Indonesia yang alami.
- source_word: מִיַּד פְּלִשְׁתִּים וּמִיַּד כָּל אֹיְבֵיהֶם
  choice: dari tangan orang Filistin dan dari tangan semua musuh mereka
  rationale: Mempertahankan pengulangan ungkapan Ibrani “dari tangan,” yang menyatakan kuasa atau penguasaan musuh, serta cakupan menyeluruh כָּל.
theological_decisions:
- issue: Subjek tindakan penyelamatan dalam הוֹשִׁיעַ
  choice: 'Yahweh sebagai pembicara dan pelaku utama: “Aku akan menyelamatkan ... dengan perantaraan Daud.”'
  alternative: 'Daud sebagai subjek: “Daud, hamba-Ku, akan menyelamatkan umat-Ku Israel.”'
  rationale: Konteks kutipan ilahi dan frasa בְּיַד דָּוִד עַבְדִּי mendukung pemahaman bahwa Yahweh menyelamatkan melalui Daud. Namun, bentuk Ibrani dapat dipahami dengan Daud sebagai subjek gramatikal; karena itu ketegangan tersebut tidak dihapus, melainkan didokumentasikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Lakukanlah itu” mempertahankan ketegasan perintah; “dengan perantaraan” mengungkapkan idiom sarana secara alami, sedangkan pengulangan “dari tangan” dipertahankan untuk menjaga tekstur sastra Ibrani.
