base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/031.yaml
  text: Then David said to Joab and to all the people who were with him[a], “Tear your clothes, gird yourselves with sackcloth, and mourn before Abner.” And King David was walking behind the bier.
translation:
  language: id
  text: Lalu Daud berkata kepada Yoab dan kepada seluruh rakyat yang menyertainya, “Koyakkanlah pakaian kalian, kenakanlah kain kabung, dan merataplah di depan Abner.” Raja Daud berjalan di belakang usungan jenazah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “usungan jenazah” biasanya berarti “tempat tidur” atau “pembaringan”; di sini kata itu menunjuk pada usungan tempat jenazah Abner dibawa.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ בִגְדֵיכֶם
  choice: Koyakkanlah pakaian kalian
  rationale: Bentuk imperatif jamak ini menggambarkan tindakan mengoyakkan pakaian sebagai tanda perkabungan. ‘Koyakkanlah’ mempertahankan tindakan konkret, sedangkan ‘pakaian kalian’ alami dalam bahasa Indonesia modern.
- source_word: וְחִגְרוּ שַׂקִּים
  choice: kenakanlah kain kabung
  rationale: Secara harfiah verba itu berarti mengikatkan atau mengenakan pada pinggang. Dalam konteks perkabungan, ungkapan Indonesia ‘mengenakan kain kabung’ menyampaikan tindakan ritualnya secara jelas dan alami.
- source_word: וְסִפְדוּ
  choice: dan merataplah
  rationale: ספד menunjuk pada ratapan atau perkabungan resmi bagi orang mati. ‘Merataplah’ lebih spesifik daripada sekadar ‘berdukalah’ dan sesuai dengan konteks arak-arakan jenazah.
- source_word: לִפְנֵי אַבְנֵר
  choice: di depan Abner
  rationale: 'Terjemahan ini mempertahankan ungkapan spasial harfiah dan ambiguitas sumber: yang dimaksud dalam konteks ialah berjalan dan meratap di depan Abner, yakni di depan jenazah atau usungan yang membawanya.'
- source_word: וְהַמֶּלֶךְ דָּוִד
  choice: Raja Daud sendiri
  rationale: Gelar dan nama diterjemahkan secara alami. ‘Sendiri’ menonjolkan kontras bahwa sang raja mengambil tempat di belakang usungan, tanpa mengubah isi proposisional.
- source_word: הֹלֵךְ אַחֲרֵי
  choice: berjalan di belakang
  rationale: Partisipel הֹלֵךְ menyajikan tindakan yang sedang berlangsung dalam arak-arakan, dan אַחֲרֵי memiliki arti spasial ‘di belakang’.
- source_word: הַמִּטָּה
  choice: usungan jenazah
  rationale: מִטָּה biasanya berarti tempat tidur atau pembaringan, tetapi dalam konteks pemakaman ini menunjuk pada sarana tempat jenazah dibawa. ‘Usungan jenazah’ tepat dan mudah dipahami pembaca Indonesia.
