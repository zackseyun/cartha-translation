translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘kalian’ dipakai karena perintah ditujukan kepada Yoab dan seluruh rakyat. Istilah ‘kain kabung’ dipertahankan sebagai ungkapan Alkitab yang lazim, sedangkan ‘usungan jenazah’ dipilih agar makna dalam konteks pemakaman langsung jelas.
