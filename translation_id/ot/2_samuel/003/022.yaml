base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/022.yaml
  text: And behold[a], David’s servants and Joab came in from a raid and brought much plunder with them. But Abner was not with David in Hebron, because he had sent him away[b], and he had gone in peace.
translation:
  language: id
  text: Dan lihatlah[a], para hamba Daud dan Yoab datang dari penyerbuan dengan membawa banyak jarahan. Namun, Abner tidak bersama Daud di Hebron, sebab Daud telah menyuruhnya pergi, dan ia telah pergi dengan damai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini menarik perhatian kepada perkembangan baru dalam cerita.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “pergi dengan damai” berarti bahwa Abner berangkat dengan selamat dan dalam hubungan baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Pada saat itu
  rationale: Menandai perkembangan baru dalam alur cerita secara alami dalam bahasa Indonesia modern; ungkapan ini mempertahankan fungsi penarik perhatian tanpa memakai bentuk arkais seperti 'lihatlah'.
- source_word: עַבְדֵי דָוִד
  choice: para hamba Daud
  rationale: Dalam konteks ini עֶבֶד menunjuk kepada orang-orang yang mengabdi kepada Daud, termasuk para pengikut atau pejabatnya, bukan dengan sendirinya menekankan perbudakan.
- source_word: וְיוֹאָב בָּא
  choice: dan Yoab kembali
  rationale: Kata kerja Ibrani berbentuk tunggal meskipun rangkaian subjek mencakup para hamba Daud dan Yoab. 'Kembali' menyampaikan gerak pulang ke lokasi cerita setelah penyerbuan.
- source_word: מֵהַגְּדוּד
  choice: dari penyerbuan
  rationale: גְּדוּד dapat menunjuk kepada pasukan atau gerombolan penyerbu maupun kegiatan penyerbuan. Penyebutan jarahan pada klausa berikutnya mendukung makna kegiatan penyerbuan.
- source_word: וְשָׁלָל רָב עִמָּם הֵבִיאוּ
  choice: dengan membawa banyak jarahan
  rationale: Terjemahan alami yang mempertahankan gagasan bahwa rombongan itu membawa pulang sejumlah besar barang hasil rampasan.
- source_word: וְאַבְנֵר אֵינֶנּוּ עִם דָּוִד בְּחֶבְרוֹן
  choice: Namun, Abner sudah tidak bersama Daud di Hebron
  rationale: Kata penghubung diterjemahkan secara kontrastif karena ayat membandingkan kedatangan Yoab dengan ketidakhadiran Abner. 'Sudah tidak' memperjelas keadaan pada saat rombongan tiba.
- source_word: כִּי שִׁלְּחוֹ
  choice: sebab Daud telah menyuruhnya pergi
  rationale: Subjek pronominalnya secara kontekstual adalah Daud. Nama Daud dinyatakan untuk menghindari ketaksaan rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיֵּלֶךְ בְּשָׁלוֹם
  choice: dan ia telah pergi dengan damai
  rationale: Mempertahankan idiom Ibrani dan urutan waktu yang mendahului kedatangan Yoab; ungkapan itu mencakup keberangkatan secara aman dan dalam hubungan baik.
