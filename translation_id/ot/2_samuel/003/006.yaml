  text: While the war continued between the house of Saul and the house of David[a], Abner was strengthening himself in the house of Saul.
translation:
  language: id
  text: Selama peperangan antara keluarga Saul dan keluarga Daud terus berlangsung, Abner sedang memperkuat kedudukannya[a] dalam keluarga Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Abner sedang menjadi kuat dalam keluarga Saul.” Kata kerja Ibrani dapat berarti menjadi kuat atau memperkuat diri; bentuk refleksifnya di sini mungkin menunjukkan bahwa Abner sedang memperkokoh kedudukannya sendiri dalam keluarga Saul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בִּהְיוֹת הַמִּלְחָמָה
  choice: Selama peperangan ... terus berlangsung
  rationale: Konstruksi ב + infinitif היה membentuk klausa waktu yang duratif. Ungkapan ini menyampaikan berlangsungnya peperangan secara alami tanpa menambahkan kata waktu eksplisit yang tidak terdapat dalam sumber.
- source_word: בֵּין בֵּית שָׁאוּל וּבֵין בֵּית דָּוִד
  choice: antara keluarga Saul dan keluarga Daud
  rationale: Dalam konteks ini בֵּית menunjuk kepada keluarga besar beserta pihak politik yang terkait. 'Keluarga' lebih alami bagi pembaca Indonesia daripada 'rumah', tetapi tetap tidak mempersempit maknanya menjadi 'dinasti' saja.
- source_word: וְאַבְנֵר
  choice: Abner
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָיָה מִתְחַזֵּק
  choice: semakin memperkuat kedudukannya
  rationale: Bentuk hitpael dari חזק dapat menyatakan menjadi kuat atau menguatkan diri. Dalam konteks politik keluarga Saul, pilihan ini secara alami menyampaikan bahwa Abner sedang mengonsolidasikan kekuasaannya sendiri, sambil mempertahankan nuansa progresif.
- source_word: בְּבֵית שָׁאוּל
  choice: di dalam keluarga Saul
  rationale: Preposisi ב menandai lingkungan tempat Abner menjadi semakin kuat, yaitu lingkup keluarga dan kubu politik Saul.
