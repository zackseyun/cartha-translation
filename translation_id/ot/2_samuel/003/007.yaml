reference: 2 Samuel 3:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/שָׁא֣וּל פִּלֶ֔גֶשׁ וּ/שְׁמָ֖/הּ רִצְפָּ֣ה בַת אַיָּ֑ה וַ/יֹּ֨אמֶר֙ אֶל אַבְנֵ֔ר מַדּ֥וּעַ בָּ֖אתָה אֶל פִּילֶ֥גֶשׁ אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/007.yaml
  text: Saul had a concubine whose name was Rizpah daughter of Aiah. And Ish-bosheth said to Abner[a], “Why did you go in to my father’s concubine?”
translation:
  language: id
  text: Saul mempunyai seorang gundik bernama Rizpa anak Aya. Lalu Isyboset berkata kepada Abner, “Mengapa engkau menghampiri gundik ayahku?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih jelas, “Mengapa engkau berhubungan seksual dengan gundik ayahku?” Teks Ibrani secara harfiah memakai ungkapan “datang kepada,” sebuah eufemisme seksual yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשָׁאוּל
  choice: Saul mempunyai
  rationale: Konstruksi ל yang menyatakan kepunyaan diterjemahkan secara alami dalam bahasa Indonesia dengan “mempunyai”; waw menghubungkan informasi latar tanpa perlu diberi penanda temporal.
- source_word: פִּלֶגֶשׁ / פִּילֶגֶשׁ
  choice: gundik
  rationale: Istilah ini mempertahankan kategori sosial dalam teks Ibrani dan merupakan padanan baku yang ringkas dalam bahasa Indonesia.
- source_word: וּשְׁמָהּ רִצְפָּה בַת אַיָּה
  choice: bernama Rizpa anak Aya
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan nama serta patronimik perempuan tersebut.
- source_word: וַיֹּאמֶר אֶל אַבְנֵר
  choice: Lalu Isyboset berkata kepada Abner
  rationale: Subjek verba tersirat dalam bahasa Ibrani, tetapi konteks ayat sebelumnya mengidentifikasinya sebagai Isyboset; penyebutan namanya mencegah ketaksaan dalam bahasa Indonesia.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan interogatif langsung dan alami dalam bahasa Indonesia modern.
- source_word: בָּאתָה אֶל
  choice: engkau menghampiri
  rationale: Dalam konteks seorang perempuan, konstruksi ini merupakan eufemisme seksual. “Menghampiri” menjaga bentuk halus dan sebagian ketaksaan ungkapan sumber, sedangkan catatan kaki menjelaskan maksudnya.
- source_word: פִּילֶגֶשׁ אָבִי
  choice: gundik ayahku
  rationale: Rangkaian kepunyaan diterjemahkan secara langsung dan alami.
theological_decisions:
- issue: Implikasi politis dan seksual dari tindakan Abner
  choice: Tidak dijelaskan di dalam teks utama
  alternative: Menambahkan bahwa Abner mengklaim takhta atau memperkosa gundik itu
  rationale: Ayat ini hanya memuat tuduhan Isyboset dengan eufemisme seksual; motif, persetujuan, dan makna politisnya tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Rizpa, Aya, Isyboset, dan Abner. Penanda catatan kaki ditempatkan setelah seluruh pertanyaan karena catatan menjelaskan eufemisme dalam klausa tersebut.'
