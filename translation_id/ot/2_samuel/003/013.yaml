base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/013.yaml
  text: 'He said[a], “Good. I will make a covenant with you. Only one thing I ask of you: You shall not see my face unless you first bring Michal, Saul’s daughter, when you come to see my face.”'
translation:
  language: id
  text: 'Ia berkata, “Baik. Aku akan mengikat perjanjian denganmu. Hanya satu hal yang kuminta darimu: Engkau tidak boleh menghadap aku kecuali jika, ketika engkau datang menghadap aku, engkau membawa Mikhal, anak perempuan Saul.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kedua ungkapan yang diterjemahkan “menghadap aku” berbunyi “melihat wajahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Baik
  rationale: Berfungsi sebagai jawaban persetujuan singkat atas usul Abner dan mempertahankan keringkasan bahasa Ibrani.
- source_word: אֶכְרֹת ... בְּרִית
  choice: Aku akan mengikat perjanjian
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk idiom Ibrani harfiah 'memotong perjanjian', serta mempertahankan bobot formal perjanjian.
- source_word: אַךְ דָּבָר אֶחָד אָנֹכִי שֹׁאֵל מֵאִתְּךָ
  choice: Hanya satu hal yang kuminta darimu
  rationale: Menyampaikan pembatasan dan satu syarat yang diajukan Daud dengan susunan Indonesia yang alami.
- source_word: לֹא תִרְאֶה אֶת פָּנַי
  choice: Engkau tidak boleh menghadap aku
  rationale: Idiom harfiah 'melihat wajahku' dalam konteks ini menunjuk pada datang menghadap atau memperoleh audiensi; 'menghadap aku' menyampaikan fungsi idiom itu secara wajar.
- source_word: כִּי אִם לִפְנֵי הֱבִיאֲךָ
  choice: sebelum engkau membawa
  rationale: Menyatakan syarat temporal bahwa Mikhal harus dibawa lebih dahulu. Dalam konstruksi negatif ini, 'sebelum' secara alami menyampaikan maksud tersebut.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikhal, anak perempuan Saul
  rationale: Mempertahankan identifikasi eksplisit dalam teks Ibrani dengan bentuk aposisi Indonesia yang jelas.
- source_word: בְּבֹאֲךָ לִרְאוֹת אֶת פָּנָי
  choice: ketika engkau datang menghadap aku
  rationale: Mempertahankan pengulangan gagasan menghadap Daud dan hubungan temporal dari konstruksi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “aku/engkau” mempertahankan tuturan langsung yang tegas tanpa terdengar terlalu sehari-hari. Idiom Ibrani dijelaskan dalam catatan kaki agar makna audiensi tetap alami dalam teks utama sekaligus bentuk sumber tetap terlihat.
