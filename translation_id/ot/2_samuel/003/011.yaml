  yaml_path: translation/ot/2_samuel/003/011.yaml
  text: And he could no longer answer Abner a word[a], because he feared him.
translation:
  language: id
  text: Ia tidak sanggup lagi menjawab Abner sepatah kata pun[a], karena ia takut kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjawab apa pun kepada Abner.” Ungkapan Ibraninya secara harfiah berarti “menjawab Abner suatu kata.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל
  choice: sanggup
  rationale: Kata kerja ini menyatakan kemampuan atau kesanggupan; dalam klausa negatif, “tidak sanggup” alami dalam bahasa Indonesia dan tetap dekat dengan sumber.
- source_word: עוֹד
  choice: lagi
  rationale: 'Bersama negasi, kata ini menunjukkan bahwa keadaan sebelumnya tidak berlanjut: “tidak ... lagi.”'
- source_word: לְהָשִׁיב
  choice: menjawab
  rationale: Bentuk Hifil dari שוב di sini dipakai secara idiomatis dengan arti menjawab atau membalas perkataan.
- source_word: אֶת־אַבְנֵר
  choice: Abner
  rationale: Penanda objek langsung diikuti nama diri; nama tersebut dipertahankan dalam bentuk baku Indonesia.
- source_word: דָּבָר
  choice: sepatah kata pun
  rationale: Secara harfiah berarti “sebuah kata/perkara”; dalam konteks negatif, “sepatah kata pun” mempertahankan citra kata sekaligus terdengar alami.
- source_word: מִיִּרְאָתוֹ
  choice: karena ia takut
  rationale: Frasa dengan מִן dan nomina “ketakutan” menyatakan sebab; bentuk klausal ini jelas dan idiomatis.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Pronomina objek merujuk kepada Abner; setelah “takut,” bahasa Indonesia baku menggunakan “kepada.”
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Pronomina “ia” mempertahankan rujukan tokoh dari konteks tanpa menambahkan nama yang tidak terdapat dalam ayat. Ungkapan “sepatah kata pun” dipilih agar idiom Ibrani tetap terasa sekaligus alami bagi pembaca Indonesia.
