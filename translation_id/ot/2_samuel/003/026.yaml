base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/026.yaml
  text: Then Joab went out from David and sent messengers after Abner[a], and they brought him back from the well of Sirah. But David did not know it.
translation:
  language: id
  text: Lalu Yoab pergi meninggalkan Daud dan mengirim utusan untuk menyusul Abner. Mereka membawa Abner kembali dari sumur Sira.[a] Namun, Daud tidak mengetahui hal itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Bor-Sira,” jika ungkapan Ibrani itu dipahami sebagai nama tempat, bukan “sumur Sira.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא יוֹאָב מֵעִם דָּוִד
  choice: Sesudah Yoab meninggalkan Daud
  rationale: Ungkapan ini menyatakan bahwa Yoab pergi dari hadapan atau kebersamaannya dengan Daud. 'Meninggalkan Daud' merupakan ungkapan Indonesia yang wajar dan tetap mempertahankan gerak menjauh dalam bahasa Ibrani.
- source_word: מַלְאָכִים
  choice: beberapa utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada manusia yang diutus, bukan malaikat. 'Utusan' adalah padanan yang jelas; 'beberapa' menyampaikan bentuk jamak secara alami.
- source_word: אַחֲרֵי אַבְנֵר
  choice: untuk menyusul Abner
  rationale: Kata depan ini menunjukkan gerakan mengikuti atau mengejar seseorang. 'Menyusul' sesuai dengan konteks pemanggilan Abner kembali tanpa melebihkan nuansa permusuhan.
- source_word: וַיָּשִׁבוּ אֹתוֹ
  choice: Mereka membawa Abner kembali
  rationale: Bentuk kausatif dari שוב berarti menyebabkan seseorang kembali. Nama 'Abner' diulang agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: מִבּוֹר הַסִּרָה
  choice: dari sumur Sira
  rationale: בּוֹר dapat berarti lubang, perigi, atau sumur. 'Sumur Sira' merupakan padanan yang alami, sementara kemungkinan bahwa seluruh ungkapan adalah nama tempat dipertahankan dalam catatan kaki.
- source_word: וְדָוִד לֹא יָדָע
  choice: Namun, Daud tidak mengetahui hal itu
  rationale: '''Namun'' menyampaikan kontras dalam konteks, sedangkan ''hal itu'' membuat objek pengetahuan tersirat menjadi jelas tanpa menambahkan isi baru.'
