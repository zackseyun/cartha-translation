base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/023.yaml
  text: When Joab and all the army that was with him arrived, they told Joab, saying, “Abner son of Ner came to the king, and he sent him away, and he went in peace.”
translation:
  language: id
  text: Ketika Yoab dan seluruh pasukan yang bersamanya tiba, mereka memberi tahu Yoab, “Abner anak Ner telah datang kepada raja. Raja menyuruhnya pergi, dan ia pergi dengan damai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאוּ
  choice: tiba
  rationale: Dalam konteks kembalinya Yoab dan pasukannya, ‘tiba’ menyampaikan selesainya perjalanan dengan lebih alami daripada sekadar ‘datang’.
- source_word: הַצָּבָא
  choice: pasukan
  rationale: Istilah ini menunjuk kepada kekuatan bersenjata yang menyertai Yoab; ‘pasukan’ merupakan padanan Indonesia yang wajar.
- source_word: וַיְשַׁלְּחֵהוּ
  choice: Raja menyuruhnya pergi
  rationale: Bentuk kausatif menyatakan bahwa raja melepas atau menyuruh Abner pergi. Subjek ‘raja’ dibuat eksplisit dalam bahasa Indonesia agar rujukan pronominal tetap jelas tanpa menambah informasi baru.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan cakupan makna שָׁלוֹם, yakni pergi dalam keadaan damai, aman, dan tanpa gangguan, tanpa mempersempitnya hanya menjadi keselamatan fisik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rumus לֵאמֹר tidak diterjemahkan secara mekanis karena fungsi pengantar ucapannya sudah dinyatakan oleh tanda kutip. Subjek jamak tak bernama pada וַיַּגִּדוּ diterjemahkan ‘orang-orang’ agar tidak keliru dipahami sebagai Yoab dan pasukannya sendiri.
