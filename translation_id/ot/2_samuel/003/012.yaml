base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/003/012.yaml
  text: Then Abner sent messengers to David on his behalf[a], saying, “To whom does the land belong?” saying, “Make your covenant with me, and behold[b], my hand is with you to bring all Israel over to you.”
translation:
  language: id
  text: 'Kemudian Abner mengirim utusan kepada Daud atas namanya[a], dengan pesan: “Milik siapakah negeri ini?” dan “Ikatlah perjanjian denganku; lihat, tanganku ada di pihakmu[b] untuk membawa seluruh Israel berpihak kepadamu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Milik siapakah negeri ini?” Teks Ibrani di bagian ini sangat ringkas dan susunannya dapat dipahami berbeda; pertanyaan itu mungkin menyiratkan klaim mengenai siapa yang berhak memerintah.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “tanganku bersamamu,” suatu ungkapan yang menyatakan bahwa dukungan atau kekuasaan Abner ada di pihak Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: תחתו
  choice: atas namanya
  rationale: Dalam konteks pengutusan utusan, bentuk ini paling wajar dipahami sebagai tindakan yang dilakukan atas nama Abner, sambil tetap mengakui bahwa teks Ibrani sukar dan dapat dikaitkan dengan kalimat berikutnya.
- source_word: לְמִי אָרֶץ
  choice: Milik siapakah negeri ini?
  rationale: Mempertahankan pertanyaan retoris yang ringkas tentang kepemilikan atau hak memerintah tanpa mengubahnya menjadi pernyataan eksplisit.
- source_word: כָּרְתָה בְרִיתְךָ אִתִּי
  choice: Buatlah perjanjianmu denganku
  rationale: Ungkapan כרת ברית berarti membuat atau mengikat perjanjian; sufiks orang kedua pada בְרִיתְךָ dipertahankan melalui 'perjanjianmu'.
- source_word: וְהִנֵּה יָדִי עִמָּךְ
  choice: Lihatlah, tanganku akan menyertaimu
  rationale: Metafora 'tangan' dipertahankan sebagai lambang dukungan dan kemampuan Abner, sedangkan bentuk futuratif sesuai dengan janji bantuan dalam konteks.
- source_word: לְהָסֵב אֵלֶיךָ
  choice: untuk membawa ... berpihak kepadamu
  rationale: Menyampaikan perpindahan kesetiaan politik secara alami dalam bahasa Indonesia.
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Padanan baku untuk entitas bangsa atau suku-suku Israel secara kolektif.
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Konteks politik menunjukkan para pembawa pesan manusia, bukan makhluk surgawi.
theological_decisions:
- issue: Makna pertanyaan retoris לְמִי אָרֶץ
  choice: 'Dipertahankan sebagai pertanyaan langsung: “Milik siapakah negeri ini?”'
  alternative: Menafsirkannya sebagai pernyataan bahwa negeri itu berada dalam kuasa Abner, atau sebagai pertanyaan eksplisit tentang siapa yang berhak memerintah.
  rationale: Bahasa Ibrani ringkas dan eliptis; pertanyaan langsung mempertahankan ketegangan antara kepemilikan negeri, kekuasaan politik, dan hak Daud untuk memerintah.
- issue: Gambaran “tanganku menyertaimu”
  choice: Metafora tangan dipertahankan dan dijelaskan dalam catatan kaki.
  alternative: Diratakan menjadi “aku akan mendukungmu.”
  rationale: Metafora asli membawa nuansa dukungan sekaligus kuasa untuk bertindak, sehingga tidak sebaiknya dihilangkan dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan harfiah לֵאמֹר ... לֵאמֹר tidak ditiru secara kaku; “dengan pesan” dan “Ia juga berkata” menjaga dua unsur ujaran dengan alur Indonesia yang alami. Ambiguitas politik pada pertanyaan Abner tetap dipertahankan.
