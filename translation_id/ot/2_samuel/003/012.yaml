revisions:
- from: Kemudian Abner mengirim utusan kepada Daud atas namanya[a] dengan pesan, “Milik siapakah negeri ini?” Ia juga berkata, “Buatlah perjanjianmu denganku. Lihatlah, tanganku akan menyertaimu[b] untuk membawa seluruh Israel berpihak kepadamu.”
  to: 'Kemudian Abner mengirim utusan kepada Daud atas namanya[a], dengan pesan: “Milik siapakah negeri ini?” dan “Ikatlah perjanjian denganku; lihat, tanganku ada di pihakmu[b] untuk membawa seluruh Israel berpihak kepadamu.”'
  rationale: Revisi hanya memperbaiki ketepatan idiom “tangan” dan kejelasan pengantar dua bagian pesan. Pertanyaan tentang negeri tetap dibiarkan sebagai pertanyaan retoris, tanpa memutuskan apakah Abner sedang mengajukan klaim pribadi atau membicarakan hak memerintah. Catatan kaki a juga diselaraskan dengan letak jangkar pada “atas namanya,” agar tidak keliru seolah-olah menjadi alternatif bagi pertanyaan tentang negeri.
