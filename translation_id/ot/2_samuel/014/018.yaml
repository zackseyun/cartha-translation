    issue: '"yang akan kutanyakan kepadamu"'
    rationale: Bentuk futur "akan" tidak dinyatakan oleh partisipel שֹׁאֵל, yang dalam konteks ujaran langsung paling aman diterjemahkan "yang kutanyakan kepadamu". Revisi ini mempertahankan aspek yang tidak terlalu dispesifikkan oleh bahasa sumber.
  - severity: low
    issue: Pengantar ujaran hanya memakai "menjawab"
    rationale: Walau pemadatan dapat diterima dalam bahasa Indonesia, וַיַּעַן ... וַיֹּאמֶר secara eksplisit menyatakan "menjawab dan berkata". Mempertahankan keduanya aman dan tetap alami dalam register naratif Alkitab.
