  text: Then the king answered and said to the woman[a], “Please do not hide from me anything that I ask you.” And the woman said, “Please speak[b], my lord the king.”
translation:
  language: id
  text: Raja menjawab dan berkata kepada perempuan itu, “Tolong jangan sembunyikan dariku apa pun yang kutanyakan kepadamu.” Perempuan itu berkata, “Silakan berbicara, tuanku raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab
  rationale: Dalam formula percakapan Ibrani, kedua verba bersama-sama memperkenalkan jawaban. Bahasa Indonesia alami cukup memakai satu verba ujaran, sehingga tidak perlu diterjemahkan secara kaku sebagai ‘menjawab dan berkata’.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Menunjuk kembali kepada perempuan dari Tekoa dalam konteks, bukan kepada hubungan sebagai istri.
- source_word: אַל נָא תְכַחֲדִי מִמֶּנִּי
  choice: Tolong jangan sembunyikan dariku
  rationale: ‘Tolong’ menyampaikan nuansa permohonan נָא, sedangkan ‘sembunyikan dariku’ mempertahankan gambaran leksikal verba dan preposisinya.
- source_word: דָּבָר
  choice: apa pun
  rationale: Dalam larangan negatif, padanan idiomatis bagi ‘suatu hal/perkara’ adalah ‘apa pun’.
- source_word: אֲשֶׁר אָנֹכִי שֹׁאֵל אֹתָךְ
  choice: yang akan kutanyakan kepadamu
  rationale: Partisipel Ibrani berkaitan dengan pertanyaan yang segera hendak diajukan raja; bentuk futur dekat alami dalam konteks Indonesia dan tidak mengubah isi pertanyaan.
- source_word: יְדַבֶּר נָא
  choice: Silakan berbicara
  rationale: Yusif orang ketiga merupakan bentuk penghormatan. ‘Silakan berbicara’ mengungkapkan izin atau undangan yang sopan tanpa konstruksi Indonesia yang kaku.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Mempertahankan sapaan istana dan gelar kerajaan dalam bentuk Indonesia yang ringkas dan bermartabat.
