  yaml_path: translation/ot/2_samuel/014/016.yaml
  text: For the king will hear[b][a], to deliver his servant from the hand of the man who would destroy me and my son together from the inheritance of God.
translation:
  language: id
  text: Sebab raja akan mendengarkan dan menyelamatkan hamba perempuannya dari tangan orang yang hendak melenyapkan aku dan anakku sekaligus dari pusaka Allah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Pusaka Allah” mungkin berarti bagian pusaka yang Allah karuniakan di tengah Israel; mungkin juga berarti pusaka atau milik yang menjadi kepunyaan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menerangkan alasan atau keyakinan perempuan itu berdasarkan perkataannya dalam ayat sebelumnya.
- source_word: יִשְׁמַע
  choice: akan mendengarkan
  rationale: Pilihan ini mempertahankan makna dasar 'mendengar/mendengarkan' sekaligus memungkinkan frasa berikutnya menyatakan tindakan raja sebagai tanggapan.
- source_word: לְהַצִּיל
  choice: dan melepaskan
  rationale: Bentuk kausatif verba ini berarti menyelamatkan atau melepaskan dari kuasa seseorang. Kata 'dan' menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa mengubah tindakan yang diharapkan dari raja.
- source_word: אֲמָתוֹ
  choice: hamba perempuannya
  rationale: Nomina Ibrani ini secara khusus berjenis feminin dan merupakan sebutan merendah perempuan itu bagi dirinya di hadapan raja.
- source_word: מִכַּף הָאִישׁ
  choice: dari tangan orang
  rationale: Ungkapan 'dari tangan' mempertahankan idiom Ibrani bagi kuasa atau cengkeraman seseorang dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: לְהַשְׁמִיד
  choice: yang hendak melenyapkan
  rationale: Infinitif ini menyatakan maksud bermusuhan orang tersebut. 'Melenyapkan' mencakup pembinasaan kedua orang itu serta terhapusnya garis keluarga mereka.
- source_word: יַחַד
  choice: sekaligus
  rationale: Kata ini menegaskan bahwa ibu dan anaknya sama-sama menjadi sasaran.
- source_word: מִנַּחֲלַת אֱלֹהִים
  choice: dari milik pusaka Allah
  rationale: Terjemahan ini dekat dengan susunan Ibrani dan menjaga kemungkinan bahwa frasa tersebut menunjuk pada pusaka yang dianugerahkan Allah maupun pada umat atau milik kepunyaan Allah.
theological_decisions:
- issue: Makna נַחֲלַת אֱלֹהִים ('milik pusaka Allah')
  choice: Mempertahankan ungkapan yang dapat menunjuk pada bagian pusaka yang Allah karuniakan dalam Israel
  alternative: Milik kepunyaan Allah sendiri, khususnya umat-Nya
  rationale: Konteksnya menyangkut ancaman terhapusnya garis keluarga dan hilangnya bagian mereka di tengah Israel, tetapi konstruksi Ibraninya tidak menutup kemungkinan makna bahwa Israel adalah milik pusaka Allah.
translation_notes:
  register: Bahasa dibuat modern, khidmat, dan mudah dipahami. Ungkapan istana 'hamba perempuannya' mempertahankan cara perempuan itu menyebut dirinya dengan rendah hati, sedangkan 'dari tangan' dan 'milik pusaka Allah' mempertahankan citra serta ketegangan makna teks Ibrani.
