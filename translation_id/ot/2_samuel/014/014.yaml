source:
  edition: WLC
  text: כִּי מ֣וֹת נָמ֔וּת וְ/כַ/מַּ֨יִם֙ הַ/נִּגָּרִ֣ים אַ֔רְצָ/ה אֲשֶׁ֖ר לֹ֣א יֵאָסֵ֑פוּ וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת לְ/בִלְתִּ֛י יִדַּ֥ח מִמֶּ֖/נּוּ נִדָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/014.yaml
  text: For we must surely die and are like water poured out on the ground[a], which cannot be gathered up again. Yet God does not take away life[b], but devises plans so that the banished one will not remain banished from him.
translation:
  language: id
  text: Sebab kita pasti mati dan menjadi seperti air yang tertumpah ke tanah, yang tidak dapat dikumpulkan kembali. Namun, Allah tidak mengambil nyawa[a], melainkan merancang berbagai cara agar orang yang terbuang tidak tetap terbuang dari-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah tidak memihak seseorang.” Klausa Ibrani ini sulit dan dapat dipahami dengan cara lain.
    reason: alternative_reading
  - marker: b
    text: Atau, “agar orang yang terbuang tidak dihalau dari-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperlihatkan bahwa perkataan ini menjadi alasan bagi permohonan perempuan itu dalam konteks sebelumnya.
- source_word: מוֹת נָמוּת
  choice: kita pasti mati
  rationale: Gabungan infinitif absolut dan bentuk verba menegaskan kepastian kematian; ungkapan ini menyampaikan penekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: וְכַמַּיִם הַנִּגָּרִים אַרְצָה
  choice: dan menjadi seperti air yang tertumpah ke tanah
  rationale: Perumpamaan ini menggambarkan keadaan yang tidak dapat dipulihkan setelah kematian dan mengalir alami menuju klausa berikutnya.
- source_word: אֲשֶׁר לֹא יֵאָסֵפוּ
  choice: yang tidak dapat dikumpulkan kembali
  rationale: Bentuk pasif menunjukkan bahwa air yang tertumpah itu tidak dapat diperoleh kembali; kata 'kembali' menyatakan implikasi konteks tanpa mengubah gambaran aslinya.
- source_word: וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Namun, Allah tidak mengambil nyawa
  rationale: Dalam konteks kematian dan pemulihan orang yang terbuang, frasa sulit ini paling mungkin merujuk pada Allah yang tidak mengambil nyawa. 'Namun' menandai peralihan kontras, sedangkan alternatif tentang keberpihakan dipertahankan dalam catatan kaki.
- source_word: וְחָשַׁב מַחֲשָׁבוֹת
  choice: melainkan merancang berbagai cara
  rationale: Konstruksi serumpun ini menyatakan tindakan memikirkan atau merancang dengan sengaja. 'Berbagai cara' terdengar alami dan sesuai dengan gagasan sarana pemulihan.
- source_word: לְבִלְתִּי יִדַּח
  choice: agar ... tidak tetap terbuang
  rationale: Bentuk Niphal dari נדח dapat menunjuk pada keadaan dihalau atau terbuang. Dalam konteks pemulihan, terjemahan ini menyampaikan bahwa keadaan keterasingan itu hendak diakhiri.
- source_word: מִמֶּנּוּ נִדָּח
  choice: orang yang terbuang ... dari-Nya
  rationale: Susunan Ibrani yang padat diungkapkan secara alami sambil mempertahankan bentuk tunggal dan relasi keterasingan dari Allah.
theological_decisions:
- issue: Makna וְלֹא יִשָּׂא אֱלֹהִים נֶפֶשׁ
  choice: Allah tidak mengambil nyawa
  alternative: Allah tidak memihak seseorang
  rationale: Frasa Ibrani ini sulit secara sintaksis dan semantis. Bacaan utama paling sesuai dengan alur dari kepastian kematian menuju tindakan Allah untuk memulihkan orang yang terbuang, tetapi kemungkinan makna tentang keberpihakan tetap didokumentasikan.
- issue: Nuansa לְבִלְתִּי יִדַּח מִמֶּנּוּ נִדָּח
  choice: agar orang yang terbuang tidak tetap terbuang dari-Nya
  alternative: agar orang yang terbuang tidak dihalau dari-Nya
  rationale: Bacaan utama menonjolkan berakhirnya keadaan pembuangan dalam konteks permohonan untuk pemulihan. Terjemahan yang lebih langsung dengan verba 'dihalau' tetap diberikan karena bentuk Ibraninya juga dapat dipahami sebagai tindakan pasif.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pilihan 'terbuang' mempertahankan hubungan dengan tema pengasingan, sedangkan bentuk '-Nya' menunjukkan bahwa rujukan terdekatnya ialah Allah. Semua alternatif penting dari klausa-klausa Ibrani yang sulit dipertahankan dalam catatan kaki.
