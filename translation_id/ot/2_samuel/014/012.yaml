  text: Then the woman said[a], “Please let your servant speak a word to my lord the king.” And he said, “Speak.”
translation:
  language: id
  text: Lalu perempuan itu berkata, “Izinkanlah hambamu[a] berbicara sepatah kata kepada tuanku, ya raja.” Raja itu berkata, “Bicaralah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “hamba perempuanmu”; juga dapat diterjemahkan “budak perempuanmu.” Bentuknya feminin dan merupakan ungkapan merendahkan diri ketika berbicara kepada seorang penguasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” menyatakan kesinambungan naratif secara alami dalam bahasa Indonesia.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Dalam konteks ini, frasa tersebut menunjuk kepada perempuan yang sedang berbicara kepada raja.
- source_word: תְּדַבֶּר נָא
  choice: Izinkanlah ... menyampaikan
  rationale: Bentuk permohonan dengan נָא menyatakan permintaan sopan dan penuh hormat kepada raja; “Izinkanlah” menangkap daya ilokusi tersebut.
- source_word: שִׁפְחָתְךָ
  choice: hambamu perempuan
  rationale: Kata ini secara eksplisit berjenis feminin dan merupakan ungkapan merendahkan diri dalam sapaan istana. Pilihan ini mempertahankan nuansa feminin yang ada dalam bahasa Ibrani.
- source_word: אֶל אֲדֹנִי הַמֶּלֶךְ
  choice: kepada tuanku, ya raja
  rationale: אֲדֹנִי merupakan sapaan hormat kepada manusia, sedangkan הַמֶּלֶךְ mengidentifikasi orang yang disapa sebagai raja. Bentuk vokatif ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: דָּבָר
  choice: sepatah kata
  rationale: Secara harfiah berarti “kata” atau “perkara.” Ungkapan “sepatah kata” mempertahankan idiom permohonan singkat dengan bahasa Indonesia yang wajar.
- source_word: וַיֹּאמֶר
  choice: Raja menjawab
  rationale: Subjek maskulin tersirat merujuk kepada raja. “Menjawab” memperjelas hubungan dialog tanpa mengubah isi ujaran.
- source_word: דַּבֵּרִי
  choice: Bicaralah
  rationale: Imperatif feminin tunggal yang secara langsung memberi perempuan itu izin untuk berbicara.
