  text: וַ/יִּשְׁלַ֨ח אַבְשָׁל֜וֹם אֶל יוֹאָ֗ב לִ/שְׁלֹ֤חַ אֹת/וֹ֙ אֶל הַ/מֶּ֔לֶךְ וְ/לֹ֥א אָבָ֖ה לָ/ב֣וֹא אֵלָ֑י/ו וַ/יִּשְׁלַ֥ח עוֹד֙ שֵׁנִ֔ית וְ/לֹ֥א אָבָ֖ה לָ/בֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/029.yaml
  text: So Absalom sent for Joab to send him to the king[a], but he was not willing to come to him. So he sent again a second time, but he was not willing to come.
translation:
  language: id
  text: Lalu Absalom mengirim pesan kepada Yoab agar Yoab mengutus Absalom menghadap raja, tetapi Yoab tidak bersedia datang kepadanya. Absalom mengirim pesan kepadanya lagi untuk kedua kalinya, tetapi Yoab tidak bersedia datang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אַבְשָׁלוֹם אֶל יוֹאָב
  choice: Absalom menyuruh orang memanggil Yoab
  rationale: Secara harfiah שׁלח berarti 'mengutus', tetapi dengan אֶל יוֹאָב dan klausa tujuan sesudahnya, ungkapan ini berarti Absalom mengirim orang atau pesan untuk memanggil Yoab. Rumusan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Absalom sendiri pergi.
- source_word: לִשְׁלֹחַ אֹתוֹ אֶל הַמֶּלֶךְ
  choice: untuk mengutusnya menghadap raja
  rationale: Frasa infinitif ini menyatakan tujuan. Pronomina objek secara gramatikal merujuk kepada Absalom, sedangkan 'menghadap raja' menyampaikan arah kepada raja secara alami tanpa menjelaskan lebih jauh peran perantaraan Yoab.
- source_word: וְלֹא אָבָה לָבוֹא אֵלָיו
  choice: tetapi Yoab tidak bersedia datang kepadanya
  rationale: אָבָה berarti 'bersedia' atau 'berkenan'; bentuk negatifnya dipertahankan sebagai 'tidak bersedia', yang tidak sekeras 'menolak'. Nama Yoab digunakan untuk memperjelas anteseden pronomina yang dapat terasa kabur dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח עוֹד שֵׁנִית
  choice: Absalom menyuruh orang memanggilnya lagi untuk kedua kalinya
  rationale: Baik עוֹד ('lagi') maupun שֵׁנִית ('untuk kedua kalinya') tercermin agar penekanan pengulangan dalam bahasa Ibrani tetap tampak.
- source_word: וְלֹא אָבָה לָבוֹא
  choice: tetapi Yoab tetap tidak bersedia datang
  rationale: Pengulangan struktur sumber dipertahankan. 'Tetap' secara wajar menyampaikan keberlanjutan sikap Yoab pada panggilan kedua.
