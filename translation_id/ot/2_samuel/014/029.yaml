translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama pelaku diulang seperlunya untuk mencegah ketaksaan pronomina. Tidak ada catatan kaki karena alternatif 'menolak' tidak diperlukan untuk memahami teks dan 'tidak bersedia' lebih dekat dengan nilai leksikal sumber.
