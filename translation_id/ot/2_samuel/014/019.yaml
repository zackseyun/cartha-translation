base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/019.yaml
  text: Then the king said[a], “Is the hand of Joab with you in all this?” And the woman answered and said, “As your soul lives, my lord the king, no one can turn to the right or to the left from anything that my lord the king has spoken, for your servant Joab himself commanded me[b], and he himself put all these words into the mouth of your female servant.”
translation:
  language: id
  text: Lalu raja bertanya, “Apakah Yoab terlibat bersamamu dalam semua ini?” Perempuan itu menjawab, “Demi hidup Tuanku, ya Raja,[a] tidak ada seorang pun yang dapat menyimpang ke kanan ataupun ke kiri[b] dari segala yang telah Tuanku Raja katakan. Sebab Yoab, hambamu, dialah yang memerintahkan aku, dan dialah yang memberikan semua perkataan ini untuk diucapkan oleh hamba perempuanmu ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Hiduplah jiwamu.” Ini adalah rumus sumpah Ibrani yang berarti, “Demi hidupmu” atau “Sesungguhnya, demi hidupmu.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menyimpang ke kanan ataupun ke kiri” adalah idiom Ibrani yang berarti menyimpang dari, membantah, atau mengelakkan apa yang telah dikatakan raja.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיַד יוֹאָב אִתָּךְ
  choice: Apakah Yoab terlibat bersamamu
  rationale: Secara harfiah ungkapan ini menanyakan apakah “tangan Yoab” menyertai perempuan itu. Kata “tangan” menyatakan peran, kuasa, atau keterlibatan; terjemahan ini menyampaikan maksud idiom tersebut secara wajar dalam bahasa Indonesia.
- source_word: בְּכָל זֹאת
  choice: dalam semua ini
  rationale: Frasa ini menunjuk kepada seluruh perkara atau siasat yang sedang dibicarakan.
- source_word: חֵי נַפְשְׁךָ
  choice: Demi hidup Tuanku
  rationale: Ini adalah rumus sumpah yang secara harfiah berbunyi “demi hidup jiwamu.” Pilihan ini mempertahankan bentuk sumpah sambil tetap wajar dalam bahasa Indonesia.
- source_word: אִם אִישׁ לְהֵמִין וּלְהַשְׂמִיל
  choice: tidak mungkin orang menyimpang ke kanan ataupun ke kiri
  rationale: Dalam konteks sumpah, אִם memperkenalkan penyangkalan tegas. Metafora arah dipertahankan, sedangkan “menyimpang” memperjelas bahwa perkataan raja tidak dapat dibantah atau dielakkan.
- source_word: מִכֹּל אֲשֶׁר דִּבֶּר
  choice: dari segala yang telah ... katakan
  rationale: Preposisi מִן berkaitan dengan tindakan menyimpang dari perkataan raja; “katakan” merupakan padanan Indonesia yang alami.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Dalam sapaan istana, istilah ini menyatakan kedudukan bawahan atau pelayan dan secara alami diterjemahkan “hamba.”
- source_word: צִוָּנִי
  choice: memerintahkan aku
  rationale: Kata kerja ini menyatakan pemberian perintah dan mempertahankan otoritas Yoab dalam peristiwa tersebut.
- source_word: שָׂם בְּפִי
  choice: menaruh ... ke dalam mulut
  rationale: Ungkapan konkret Ibrani untuk memberikan kata-kata yang harus diucapkan dipertahankan karena maknanya masih dapat dipahami dalam bahasa Indonesia.
- source_word: שִׁפְחָתְךָ
  choice: hambamu perempuan ini
  rationale: Bentuk feminin dibedakan dari עַבְדְּךָ dan tetap disampaikan sebagai sebutan diri yang merendah di hadapan raja.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan ini
  rationale: Konteks menunjukkan bahwa Yoab membekali perempuan itu dengan ucapan tertentu, sehingga “perkataan” lebih tepat daripada “hal-hal.”
