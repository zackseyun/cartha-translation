  text: So Absalom lived in Jerusalem for two years[a], and he did not see the king's face.
translation:
  language: id
  text: Maka Absalom tinggal di Yerusalem selama dua tahun penuh, dan ia tidak melihat wajah raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak melihat wajah raja.” Ungkapan Ibrani ini berarti bahwa Absalom tidak mendapat audiensi atau akses pribadi kepada raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks ini, verba ישׁב menyatakan bahwa Absalom menetap atau berdiam di suatu tempat selama kurun waktu tertentu; 'tinggal' merupakan padanan Indonesia yang alami.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Mengikuti bentuk nama yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: בִּירוּשָׁלִַם
  choice: di Yerusalem
  rationale: Frasa preposisional lokatif yang diterjemahkan langsung dengan nama tempat yang lazim dalam bahasa Indonesia.
- source_word: שְׁנָתַיִם יָמִים
  choice: selama dua tahun penuh
  rationale: Ungkapan harfiahnya 'dua tahun, hari-hari'; unsur יָמִים menegaskan rentang dua tahun yang utuh. 'Dua tahun penuh' menyampaikan daya idiomatis itu secara ringkas.
- source_word: וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: tetapi ia tidak menghadap raja
  rationale: Secara harfiah, 'dan wajah raja tidak dilihatnya.' Dalam konteks istana, melihat wajah raja berarti memperoleh akses atau audiensi pribadi. 'Tidak menghadap raja' menyampaikan idiom itu dengan wajar dalam bahasa Indonesia; 'tetapi' memperjelas kontras naratif tanpa mengubah hubungan dasar antarklausa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ungkapan istana 'menghadap raja' dipilih karena alami bagi pembaca Indonesia, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki. Penanda catatan ditempatkan setelah klausa yang diterangkannya.
