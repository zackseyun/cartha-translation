  source_fidelity: Draf dengan tepat menerjemahkan perempuan dari Tekoa, permohonan kepada raja, serta objek tersirat «aku» dalam הוֹשִׁיעָה. Namun, dua verba tindakan dalam teks Ibrani, «jatuh/tersungkur dengan muka ke tanah» (וַתִּפֹּל עַל־אַפֶּיהָ אַרְצָה) dan «bersujud/membungkuk» (וַתִּשְׁתָּחוּ), sebaiknya keduanya dinyatakan, bukan dilebur menjadi satu tindakan saja.
  naturalness: «Ia menjatuhkan diri dengan muka ke tanah dan bersujud» adalah bahasa Indonesia modern yang jelas dan mempertahankan urutan dua tindakan penghormatan/permohonan. Sapaan «ya raja» wajar dan tidak perlu kapitalisasi gelar umum.
  terminology: «Perempuan dari Tekoa», «bersujud», dan «Selamatkanlah aku» tepat, bernada bermartabat, dan tidak memaksakan makna ibadah pada tindakan penghormatan di hadapan raja.
