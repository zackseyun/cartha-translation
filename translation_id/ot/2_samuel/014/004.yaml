base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/004.yaml
  text: Then the woman from Tekoa spoke to the king[a]. She fell with her face to the ground and bowed down, and she said, “Save me[b], O king!”
translation:
  language: id
  text: Lalu perempuan dari Tekoa itu berkata kepada raja[a]. Ia menjatuhkan diri dengan muka ke tanah dan bersujud, lalu berkata, “Selamatkanlah aku, ya raja!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “perempuan Tekoa itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani: “Selamatkanlah, ya raja!” Objek “aku” tersirat dalam permohonan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקֹעִית
  choice: perempuan dari Tekoa itu
  rationale: Bentuk nisbah הַתְּקֹעִית menunjukkan asal atau keterkaitannya dengan Tekoa. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan identifikasi geografisnya.
- source_word: וַתֹּאמֶר ... אֶל הַמֶּלֶךְ
  choice: berkata kepada raja
  rationale: Kata אָמַר secara langsung berarti 'berkata'. Terjemahan ini juga mempertahankan pengulangan verba yang sama sebelum permohonan langsung.
- source_word: וַתִּפֹּל עַל־אַפֶּיהָ אַרְצָה וַתִּשְׁתָּחוּ
  choice: Ia sujud dengan muka sampai ke tanah
  rationale: Dua tindakan yang berdekatan—jatuh dengan muka ke tanah dan membungkukkan diri—membentuk gambaran bersujud. Rumusan ini alami dan bermartabat tanpa mengartikannya secara khusus sebagai ibadah.
- source_word: הוֹשִׁיעָה
  choice: Selamatkanlah aku
  rationale: Imperatif dari יָשַׁע menyatakan permohonan mendesak untuk diselamatkan. Objek 'aku' tersirat dalam konteks dan perlu dinyatakan agar alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: ya Raja
  rationale: Nomina dengan artikel dipakai sebagai sapaan langsung kepada raja. 'Ya Raja' mempertahankan nada formal dan mendesak.
