  - severity: low
    issue: «Raja» sebagai sapaan umum dikapitalisasi.
    rationale: Dalam penggunaan modern baku, «raja» sebagai jabatan/sapaan umum lazim ditulis huruf kecil; perubahan ini tidak memengaruhi makna.
