  to: Sekarang aku datang untuk menyampaikan perkara ini kepada tuanku raja, karena rakyat telah membuat aku takut.[a] Maka hambamu ini berkata, ‘Izinkanlah aku berbicara kepada raja. Barangkali raja akan melakukan apa yang dikatakan hamba perempuannya.’[b]
  rationale: Revisi hanya menghilangkan penyempitan makna pada verba ‘melakukan’ dan menampilkan istilah feminin ‘hamba perempuan’ dalam bagian akhir. Struktur, register hormat, dan ketidakpastian permohonan tetap dipertahankan.
