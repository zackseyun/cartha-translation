  text: וְ֠/עַתָּה אֲשֶׁר בָּ֜אתִי לְ/דַבֵּ֨ר אֶל הַ/מֶּ֤לֶךְ אֲדֹנִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה כִּ֥י יֵֽרְאֻ֖/נִי הָ/עָ֑ם וַ/תֹּ֤אמֶר שִׁפְחָֽתְ/ךָ֙ אֲדַבְּרָה נָּ֣א אֶל הַ/מֶּ֔לֶךְ אוּלַ֛י יַעֲשֶׂ֥ה הַ/מֶּ֖לֶךְ אֶת דְּבַ֥ר אֲמָתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/015.yaml
  text: And now I have come to speak this matter to my lord the king[a], because the people have frightened me. And your servant said, ‘Please let me speak to the king[b]; perhaps the king will do the word of his servant.’
translation:
  language: id
  text: Sekarang aku datang untuk menyampaikan perkara ini kepada tuanku raja, karena rakyat telah membuat aku takut.[a] Maka hambamu ini berkata, ‘Izinkanlah aku berbicara kepada raja. Barangkali raja akan melakukan apa yang dikatakan hamba perempuannya.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “karena rakyat membuat aku takut.” Bentuk verba Ibraninya bersifat kausatif, bukan berarti bahwa rakyat takut kepadanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “raja akan melakukan perkataan hamba perempuannya.” Frasa ini dapat merujuk pada permohonan atau perkara yang diajukannya, tanpa secara khusus menyatakan bahwa raja pasti mengabulkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengalihkan perhatian kepada penjelasan pembicara saat ini; dalam bahasa Indonesia, “Sekarang” sudah menyampaikan fungsi penghubung dan temporal secara wajar.
- source_word: אֲשֶׁר בָּאתִי לְדַבֵּר
  choice: aku datang untuk menyampaikan
  rationale: Mempertahankan gagasan datang dengan tujuan berbicara, sedangkan “menyampaikan” cocok dengan perkara yang diajukan kepada raja.
- source_word: אֶל הַמֶּלֶךְ אֲדֹנִי
  choice: kepada tuanku raja
  rationale: Mempertahankan gelar raja dan sapaan hormat אֲדֹנִי dalam susunan yang alami dan bermartabat.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: perkara ini
  rationale: דָּבָר di sini menunjuk kepada kasus atau persoalan yang diajukan, bukan sekadar satu kata atau ucapan.
- source_word: כִּי יֵרְאֻנִי הָעָם
  choice: karena rakyat telah membuat aku takut
  rationale: Bentuk kausatif verba ירא menyatakan bahwa rakyat menyebabkan perempuan itu merasa takut, bukan bahwa rakyat takut kepadanya.
- source_word: וַתֹּאמֶר שִׁפְחָתְךָ
  choice: Maka hambamu ini berkata
  rationale: Ungkapan orang ketiga untuk diri sendiri merupakan bahasa merendahkan diri di hadapan raja; “hambamu ini” terdengar alami sekaligus mempertahankan nuansa hormat.
- source_word: אֲדַבְּרָה נָּא אֶל הַמֶּלֶךְ
  choice: Izinkanlah aku berbicara kepada raja
  rationale: Kohortatif dengan נָא menyatakan tekad atau permintaan sopan; “Izinkanlah” menyampaikan daya volitif itu secara idiomatis.
- source_word: אוּלַי
  choice: Siapa tahu
  rationale: Mengungkapkan harapan yang belum pasti secara alami dalam bahasa Indonesia; “barangkali” juga mungkin, tetapi kurang menangkap nada harapan dalam konteks permohonan.
- source_word: יַעֲשֶׂה הַמֶּלֶךְ אֶת דְּבַר אֲמָתוֹ
  choice: raja akan mengabulkan permohonan hambanya ini
  rationale: Secara harfiah berarti raja akan ‘melakukan perkataan’ hamba perempuannya. Dalam konteks menghadap raja, maksud idiomatisnya ialah memenuhi atau mengabulkan permohonan; catatan kaki mempertahankan bentuk harfiahnya.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan hormat, dengan pronomina “aku” dalam tuturan perempuan itu serta ungkapan istana “tuanku raja” dan “hambamu ini”. Terjemahan mengutamakan kesepadanan optimal: struktur dan nuansa sumber dipertahankan sejauh tetap wajar bagi pembaca Indonesia masa kini.'
