  text: And the king said[a], “Whoever speaks to you, bring him to me, and he will never touch you again.”
translation:
  language: id
  text: Lalu raja berkata, “Siapa pun yang berbicara kepadamu, bawalah dia kepadaku, dan ia tidak akan menyentuhmu lagi[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia tidak akan lagi menyentuhmu”; kata Ibrani ini secara harfiah berarti “menyentuh,” tetapi dalam konteks ini dapat menyiratkan gangguan atau tindakan mencelakakan, bukan sekadar sentuhan fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan baku untuk מֶלֶךְ; dalam bahasa Indonesia, konteks telah membuat tokohnya tentu sehingga artikel Ibrani tidak perlu dinyatakan tersendiri.
- source_word: הַמְדַבֵּר אֵלַיִךְ
  choice: siapa pun yang berbicara kepadamu
  rationale: Partisip berartikel berfungsi substantival, secara harfiah 'orang yang berbicara kepadamu'. 'Siapa pun yang berbicara kepadamu' secara alami menyampaikan cakupan terbuka dari perintah raja.
- source_word: וַהֲבֵאתוֹ אֵלַי
  choice: bawalah dia kepadaku
  rationale: Bentuk Hifil dari בוא bersifat kausatif, yaitu membuat seseorang datang; dalam bahasa Indonesia wajar diterjemahkan 'bawalah dia'.
- source_word: לֹא יֹסִיף עוֹד
  choice: tidak akan ... lagi
  rationale: Gabungan יסף dan עוד menyatakan bahwa tindakan tidak akan diteruskan atau diulangi; konstruksi Indonesia 'tidak akan ... lagi' menyampaikan makna itu dengan alami.
- source_word: לָגַעַת בָּךְ
  choice: mengusikmu
  rationale: נגע secara dasar berarti 'menyentuh', tetapi dalam konteks perlindungan hukum ini menyiratkan sentuhan bermusuhan, gangguan, atau tindakan merugikan. 'Mengusikmu' mempertahankan keluasan implikasi itu tanpa membatasinya pada sentuhan fisik atau secara tegas menaikkannya menjadi kekerasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' mempertahankan alur naratif waw-konsekutif. Bentuk 'kepadamu' dan 'kepadaku' dipilih untuk register Alkitab yang tetap wajar dan mudah dipahami.
