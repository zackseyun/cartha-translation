base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/022.yaml
  text: Then Joab fell with his face to the ground[a], bowed down, and blessed the king. Joab said, “Today your servant knows that I have found favor in your eyes, my lord the king, because the king has done the word of his servant.”
translation:
  language: id
  text: Lalu Yoab tersungkur dengan wajahnya ke tanah, sujud, dan memberkati raja. Yoab berkata, “Hari ini hambamu tahu bahwa aku telah mendapat kemurahan di matamu, tuanku, raja, karena raja telah melakukan perkataan hambanya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah melakukan perkataan hambanya.”
    reason: Menjelaskan bahwa frasa ini menerjemahkan ungkapan Ibrani secara dekat; dalam konteksnya, tindakan raja itu dapat mencakup pengabulan permintaan Yoab.
lexical_decisions:
- source_word: וַיִּפֹּל ... אֶל־פָּנָיו אַרְצָה
  choice: tersungkur dengan muka ke tanah
  rationale: Mengungkapkan gerak dan sikap tubuh dalam idiom Ibrani secara jelas dan alami, tanpa mengurangi unsur muka dan tanah.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud
  rationale: Dalam konteks istana, kata ini menunjukkan penghormatan dengan membungkuk atau merendahkan diri di hadapan raja; 'sujud' mempertahankan kuatnya gerakan tanpa menyatakan bahwa Yoab menyembah raja sebagai ilah.
- source_word: וַיְבָרֶךְ אֶת־הַמֶּלֶךְ
  choice: memberkati raja
  rationale: Mempertahankan arti lazim bentuk piel ברך dengan objek manusia. Konteksnya dapat menyiratkan ucapan syukur atau doa baik, tetapi teks menyatakan tindakan memberkati.
- source_word: הַיּוֹם יָדַע עַבְדְּךָ
  choice: Pada hari ini hambamu tahu
  rationale: Menjaga ungkapan waktu dan sebutan diri yang merendah dalam bahasa istana. Bentuk perfektif 'tahu' menyatakan kesadaran yang kini diteguhkan oleh tindakan raja.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku telah mendapat kemurahan di mata ...
  rationale: Mempertahankan citra idiom Ibrani 'menemukan kemurahan di mata' sambil menggunakan susunan Indonesia yang dapat dipahami.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: Tuanku Raja
  rationale: Sapaan hormat yang alami dalam bahasa Indonesia dan sesuai dengan suasana istana, tanpa memberi nuansa ilahi.
- source_word: אֲשֶׁר עָשָׂה הַמֶּלֶךְ אֶת דְּבַר עַבְדּוֹ
  choice: sebab raja telah mengabulkan permintaan hambanya
  rationale: אֲשֶׁר berfungsi menjelaskan dasar keyakinan Yoab. Ungkapan harfiah 'melakukan perkataan hambanya' secara kontekstual berarti memenuhi permintaan Yoab; terjemahan idiomatis ditempatkan dalam teks, sedangkan bentuk harfiahnya dicatat.
theological_decisions:
- issue: Penghormatan kepada raja manusia
  choice: Menggunakan 'sujud' dan 'Tuanku Raja' sebagai bahasa penghormatan istana.
  alternative: Menerjemahkan tindakan itu dengan istilah yang secara eksplisit berarti penyembahan ilahi.
  rationale: Konteks menunjukkan penghormatan kepada penguasa manusia, bukan pernyataan bahwa raja adalah ilah. Terjemahan mempertahankan kuatnya tindakan jasmani tanpa mensakralkannya.
- issue: Makna tindakan raja terhadap perkataan hambanya
  choice: Menggunakan makna kontekstual 'mengabulkan permintaan hambanya' dalam teks dan memberi bentuk harfiah dalam catatan kaki.
  alternative: Menulis 'melakukan perkataan hambanya' dalam teks utama.
  rationale: Ungkapan sumber tetap transparan melalui catatan kaki, sedangkan teks utama menyampaikan maksudnya secara alami tanpa menambahkan unsur teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Istilah 'hamba' serta sapaan 'Tuanku Raja' mempertahankan ragam hormat istana. Pengulangan gerak 'tersungkur ... sujud' dipertahankan karena sumber menyebutkan keduanya.
