  text: וַ/תֹּ֜אמֶר הָ/אִשָּׁ֤ה הַ/תְּקוֹעִית֙ אֶל הַ/מֶּ֔לֶךְ עָלַ֞/י אֲדֹנִ֥/י הַ/מֶּ֛לֶךְ הֶ/עָוֺ֖ן וְ/עַל בֵּ֣ית אָבִ֑/י וְ/הַ/מֶּ֥לֶךְ וְ/כִסְא֖/וֹ נָקִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/009.yaml
  text: Then the woman from Tekoa said to the king[a], “On me, my lord the king, be the guilt, and on my father’s house; but the king and his throne are innocent.”
translation:
  language: id
  text: Lalu perempuan dari Tekoa itu berkata kepada raja, “Akulah, ya tuanku raja, yang menanggung kesalahan itu[a], begitu pula keluarga ayahku; tetapi raja dan takhtanya tidak bersalah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat berarti kesalahan, rasa bersalah, atau tanggungan/akibat kesalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה הַתְּקוֹעִית
  choice: perempuan dari Tekoa itu
  rationale: Bentuk gentilisia Ibrani menunjukkan asal perempuan itu. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan identifikasi geografisnya.
- source_word: עָלַי
  choice: Biarlah ... kutanggung
  rationale: Preposisi dengan sufiks orang pertama ditempatkan di depan untuk penekanan. Bentuk ini menyampaikan kesediaan perempuan itu memikul tanggung jawab secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: ya tuanku raja
  rationale: Sapaan istana ini mempertahankan penghormatan dan kedudukan raja tanpa terdengar kaku secara berlebihan.
- source_word: הֶעָוֺן
  choice: kesalahan
  rationale: עָוֹן dapat merujuk pada kesalahan, kebersalahan, atau tanggungan akibat pelanggaran. Dalam konteks hukum ini, “kesalahan” mempertahankan keluasan makna tanpa membatasinya hanya pada hukuman.
- source_word: וְעַל בֵּית אָבִי
  choice: juga keluarga ayahku
  rationale: Secara harfiah berarti “dan atas rumah ayahku.” “Keluarga ayahku” menyampaikan cakupan keluarga atau wangsa yang dimaksud secara lebih alami dalam bahasa Indonesia.
- source_word: וְהַמֶּלֶךְ וְכִסְאוֹ
  choice: tetapi raja dan takhtanya
  rationale: Waw menyatakan kontras antara pihak yang menanggung kesalahan dan pihak yang dibebaskan darinya. “Takhta” dipertahankan sebagai metonimia bagi kekuasaan atau pemerintahan kerajaan.
- source_word: נָקִי
  choice: tidak bersalah
  rationale: Adjektiva ini menyatakan bebas dari kesalahan atau tanggungan dalam konteks hukum. Bentuk tunggal Ibrani sesudah subjek majemuk diterjemahkan secara idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan bahwa raja bebas dari kesalahan
  choice: raja dan takhtanya tidak bersalah
  alternative: raja dan takhtanya bebas dari tanggungan
  rationale: Pernyataan ini terbatas pada tanggung jawab hukum atau moral dalam perkara yang sedang dibicarakan, bukan klaim bahwa raja sempurna secara moral. Terjemahan mempertahankan daya hukum ungkapan itu tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Susunan kalimat menjaga penekanan pada kesediaan perempuan itu menanggung kesalahan, sementara sapaan “ya tuanku raja” mempertahankan nuansa istana.
