  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ שִׁפְחָ֣תְ/ךָ֔ יִֽהְיֶה נָּ֛א דְּבַר אֲדֹנִ֥/י הַ/מֶּ֖לֶךְ לִ/מְנוּחָ֑ה כִּ֣י כְּ/מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים כֵּ֣ן אֲדֹנִ֤/י הַ/מֶּ֨לֶךְ֙ לִ/שְׁמֹ֨עַ֙ הַ/טּ֣וֹב וְ/הָ/רָ֔ע וַֽ/יהוָ֥ה אֱלֹהֶ֖י/ךָ יְהִ֥י עִמָּֽ/ךְ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/017.yaml
  text: Then your servant said[a], ‘Please let the word of my lord the king bring rest, for my lord the king is like the angel of God, to hear the good and the evil[b]. And may Yahweh your God be with you.’
translation:
  language: id
  text: Lalu hambamu berkata, “Kiranya perkataan tuanku raja mendatangkan ketenteraman, sebab tuanku raja seperti malaikat Allah[a] dalam hal mendengar yang baik dan yang jahat.[b] Semoga Yahweh, Allahmu, menyertaimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Allah”; kata Ibrani yang sama dapat berarti “malaikat” atau “utusan”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “mendengar yang baik dan yang jahat”; dalam konteks ini ungkapan tersebut dapat berarti memahami, membedakan, atau menilai antara yang baik dan yang jahat.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחָתְךָ
  choice: hambamu
  rationale: Secara harfiah menunjuk kepada hamba perempuan. Dalam permohonan resmi kepada raja, “hambamu” merupakan ungkapan merendahkan diri yang alami dalam bahasa Indonesia; jenis kelamin penutur sudah jelas dari konteks.
- source_word: יִהְיֶה נָּא
  choice: kiranya ... mendatangkan
  rationale: Bentuk jusif dengan נָא menyatakan permohonan yang sopan. “Kiranya” mempertahankan nada hormat dan penuh permohonan.
- source_word: דְּבַר אֲדֹנִי הַמֶּלֶךְ
  choice: perkataan tuanku raja
  rationale: דָּבָר dapat berarti perkataan, perkara, atau keputusan. “Perkataan” tetap dekat dengan bentuk Ibrani, sementara konteks menunjukkan bahwa yang dimaksud ialah keputusan atau titah raja.
- source_word: לִמְנוּחָה
  choice: mendatangkan ketenteraman
  rationale: Kata benda ini menyatakan istirahat, kelegaan, atau keadaan tenteram. Ungkapan pilihan menyampaikan maksud bahwa keputusan raja akan menenangkan dan menyelesaikan persoalan.
- source_word: כְּמַלְאַךְ הָאֱלֹהִים
  choice: seperti malaikat Allah
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat. Dalam perbandingan yang meninggikan kemampuan raja ini, “malaikat” paling wajar, sedangkan kemungkinan “utusan” dipertahankan dalam catatan kaki.
- source_word: לִשְׁמֹעַ הַטּוֹב וְהָרָע
  choice: dalam mendengar yang baik dan yang jahat
  rationale: Terjemahan ini mempertahankan kata “mendengar” dan pasangan “yang baik dan yang jahat” dari teks Ibrani. Konteks yudisial memungkinkan makna memahami, membedakan, atau menilai, yang dijelaskan tanpa dipaksakan ke dalam teks utama.
- source_word: וַיהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, dan hubungan posesif “Allahmu” dipertahankan.
- source_word: יְהִי עִמָּךְ
  choice: semoga ... menyertaimu
  rationale: Ungkapan jusif berkat ini diterjemahkan secara alami dalam bahasa Indonesia dengan “semoga ... menyertaimu”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama pribadi tersebut tanpa menggantinya dengan gelar.
- issue: Makna מַלְאָךְ dalam perbandingan dengan raja
  choice: malaikat
  alternative: utusan
  rationale: Konteks membandingkan daya pengertian raja dengan sosok surgawi, sehingga “malaikat” paling mungkin. Namun, arti leksikal “utusan” tetap dicatat sebagai kemungkinan.
- issue: Makna ungkapan mendengar yang baik dan yang jahat
  choice: mempertahankan citra harfiah “mendengar”
  alternative: membedakan atau menilai yang baik dan yang jahat
  rationale: Teks Ibrani memakai שׁמע, “mendengar”. Dalam konteks raja sebagai hakim, ungkapan itu mungkin menunjuk pada kemampuan memahami dan menilai. Terjemahan utama mempertahankan citra sumber, sedangkan catatan menjelaskan daya idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat. “Tuanku raja” mempertahankan bahasa istana, sedangkan “hambamu” menyampaikan sikap merendahkan diri tanpa kekakuan yang tidak perlu. Susunan kalimat dibuat alami, tetapi citra penting teks Ibrani—khususnya “mendengar yang baik dan yang jahat”—dipertahankan.
