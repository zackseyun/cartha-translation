  terminology: Nama "Yoab" tepat. "Raja," "kata-kata," dan istilah tindakan tutur digunakan secara konsisten dan netral. Catatan kaki berjangkar tepat pada "seperti ini" sebagai penanda konteks ucapan yang kemudian dijelaskan, serta menjelaskan idiom tanpa membebankan penafsiran doktrinal.
