  source_fidelity: Terjemahan dengan setia menyampaikan urutan instruksi dalam bentuk direktif kepada perempuan itu, gerak menghadap raja, berbicara kepadanya menurut perkataan/cara yang ditentukan, dan tindakan Yoab yang secara idiomatis menyediakan kata-kata bagi perempuan itu. "Menghadap raja" merupakan padanan kontekstual yang wajar bagi אֶל־הַמֶּלֶךְ tanpa mengubah makna.
