  text: וּ/בָאת֙ אֶל הַ/מֶּ֔לֶךְ וְ/דִבַּ֥רְתְּ אֵלָ֖י/ו כַּ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יָּ֧שֶׂם יוֹאָ֛ב אֶת הַ/דְּבָרִ֖ים בְּ/פִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/003.yaml
  text: Then go to the king and speak to him in this way[a]. And Joab put the words in her mouth.
translation:
  language: id
  text: Kemudian, pergilah menghadap raja dan berbicaralah kepadanya seperti ini.[a] Lalu Yoab menaruh kata-kata itu dalam mulut perempuan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “menaruh kata-kata dalam mulutnya” berarti bahwa Yoab memberitahukan kepadanya perkataan yang harus ia ucapkan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָאת
  choice: Kemudian, pergilah
  rationale: Bentuk perfektum orang kedua feminin tunggal dalam rangkaian instruksi menyatakan tindakan berikutnya; bentuk imperatif Indonesia menyampaikan daya perintah dengan wajar.
- source_word: אֶל־הַמֶּלֶךְ
  choice: menghadap raja
  rationale: Secara harfiah berarti bergerak kepada raja. Dalam konteks istana, 'menghadap raja' alami dan tetap menyatakan gerak menuju hadiratnya.
- source_word: וְדִבַּרְתְּ אֵלָיו
  choice: dan berbicaralah kepadanya
  rationale: Mempertahankan arti biasa דבר dengan אֶל, yakni berbicara kepada seseorang, serta daya instruksinya.
- source_word: כַּדָּבָר הַזֶּה
  choice: seperti ini
  rationale: Ungkapan ini menunjuk pada cara sekaligus isi perkataan yang harus disampaikan; 'seperti ini' ringkas dan tidak membatasi ambiguitas itu.
- source_word: וַיָּשֶׂם
  choice: Lalu ... menaruh
  rationale: שׂים berarti menaruh atau menempatkan. 'Lalu' menandai kelanjutan narasi dengan alami.
- source_word: אֶת־הַדְּבָרִים
  choice: kata-kata itu
  rationale: Bentuk jamak konkret merujuk pada perkataan tertentu yang Yoab sediakan, bukan sekadar suatu urusan.
- source_word: בְּפִיהָ
  choice: dalam mulut perempuan itu
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani. Penyebutan 'perempuan itu' memperjelas rujukan akhiran feminin dalam bahasa Indonesia.
