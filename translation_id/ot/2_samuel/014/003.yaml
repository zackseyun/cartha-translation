translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Bentuk 'pergilah' dan 'berbicaralah' mempertahankan instruksi langsung kepada perempuan itu; idiom sumber dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
