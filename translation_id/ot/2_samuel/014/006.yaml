base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/006.yaml
  text: And your servant had two sons[a], and the two of them fought in the field, and there was no one to separate them[b]; then the one struck the other and killed him.
translation:
  language: id
  text: Hamba perempuanmu mempunyai dua anak laki-laki. Keduanya berkelahi di ladang, dan tidak ada seorang pun yang melerai mereka[a]. Lalu yang seorang memukul yang lain dan membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada seorang pun yang menyelamatkan di antara mereka,” yakni tidak ada orang yang turun tangan untuk memisahkan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשִׁפְחָתְךָ
  choice: Hambamu ini
  rationale: שִׁפְחָה secara leksikal menunjuk kepada hamba perempuan, tetapi di sini dipakai oleh seorang perempuan sebagai sebutan diri yang merendah di hadapan raja. 'Hambamu ini' alami dalam bahasa Indonesia, mempertahankan sikap hormat, dan konteks sudah menunjukkan bahwa penuturnya perempuan.
- source_word: שְׁנֵי בָנִים
  choice: dua anak laki-laki
  rationale: בָנִים di sini secara khusus berarti dua keturunan laki-laki; 'anak laki-laki' lebih tepat daripada 'anak-anak'.
- source_word: וַיִּנָּצוּ
  choice: berkelahi
  rationale: Bentuk ini menyatakan pertikaian yang bersifat fisik. 'Berkelahi' sesuai dengan konteks yang berakhir dengan kematian.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: Padanan lokatif yang langsung, alami, dan tepat.
- source_word: וְאֵין מַצִּיל בֵּינֵיהֶם
  choice: tidak ada seorang pun yang melerai mereka
  rationale: מַצִּיל secara harfiah adalah orang yang melepaskan atau menyelamatkan; dalam konteks perkelahian, maksudnya orang yang turun tangan untuk memisahkan kedua pihak.
- source_word: וַיַּכּוֹ הָאֶחָד אֶת הָאֶחָד
  choice: yang seorang memukul yang lain
  rationale: נכה berarti memukul atau menghantam. Ungkapan ini mempertahankan pola 'yang satu ... yang lain' tanpa menentukan alat atau jumlah pukulan.
- source_word: וַיָּמֶת אֹתוֹ
  choice: dan membunuhnya
  rationale: Walaupun berasal dari מות, konstruksi dengan objek langsung di sini bermakna menyebabkan dia mati; 'membunuhnya' merupakan ungkapan Indonesia yang jelas dan wajar.
