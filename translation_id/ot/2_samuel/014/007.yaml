source:
  edition: WLC
  text: וְ/הִנֵּה֩ קָ֨מָה כָֽל הַ/מִּשְׁפָּחָ֜ה עַל שִׁפְחָתֶ֗/ךָ וַ/יֹּֽאמְרוּ֙ תְּנִ֣י אֶת מַכֵּ֣ה אָחִ֗י/ו וּ/נְמִתֵ֨/הוּ֙ בְּ/נֶ֤פֶשׁ אָחִי/ו֙ אֲשֶׁ֣ר הָרָ֔ג וְ/נַשְׁמִ֖ידָה גַּ֣ם אֶת הַ/יּוֹרֵ֑שׁ וְ/כִבּ֗וּ אֶת גַּֽחַלְתִּ/י֙ אֲשֶׁ֣ר נִשְׁאָ֔רָה לְ/בִלְתִּ֧י שום לְ/אִישִׁ֛/י שֵׁ֥ם וּ/שְׁאֵרִ֖ית עַל פְּנֵ֥י הָ/אֲדָמָֽה־־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/007.yaml
  text: And look[a], the whole family has risen up against your servant and said, ‘Give up the one who struck his brother, so that we may put him to death for the life of his brother whom he killed; and we will destroy the heir also.’ Thus they would quench my remaining ember[b], leaving my husband neither name nor remnant on the face of the earth.
translation:
  language: id
  text: Lihatlah, seluruh kaum keluarga bangkit melawan hambamu ini dan berkata, ‘Serahkan orang yang memukul saudaranya itu, supaya kami membunuh dia sebagai ganti nyawa saudaranya yang telah dibunuhnya. Kami juga akan memusnahkan ahli waris itu.’ Dengan demikian, mereka akan memadamkan bara apiku yang masih tersisa[a], sehingga suamiku tidak lagi mempunyai nama ataupun keturunan yang tersisa di muka bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bara apiku yang masih tersisa.” Bara yang masih menyala menjadi gambaran bagi satu-satunya keturunan dan harapan terakhir dari garis keluarga perempuan itu.
    reason: cultural_note
  - marker: b
    text: “Nama ataupun keturunan yang tersisa” menunjuk pada kelangsungan nama dan garis keluarga suaminya, bukan sekadar nama baiknya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian pada perkembangan yang mencemaskan. 'Lihatlah' mempertahankan daya retorisnya dalam bahasa Indonesia modern.
- source_word: כָל הַמִּשְׁפָּחָה
  choice: seluruh kaum keluarga
  rationale: מִשְׁפָּחָה di sini menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum keluarga' menyampaikan cakupan itu secara wajar.
- source_word: שִׁפְחָתֶךָ
  choice: hambamu ini
  rationale: Secara harfiah berarti hamba perempuan milikmu, tetapi dalam sapaan kepada raja berfungsi sebagai sebutan diri yang merendah. Bentuk Indonesia tidak perlu menandai gender karena penuturnya sudah jelas dari konteks.
- source_word: קָמָה ... עַל
  choice: bangkit melawan
  rationale: Ungkapan ini menyatakan tindakan bermusuhan, bukan sekadar berdiri.
- source_word: תְּנִי
  choice: Serahkan
  rationale: Dalam konteks tuntutan penghukuman, kata ini meminta perempuan itu menyerahkan anaknya kepada kaum keluarga.
- source_word: מַכֵּה אָחִיו
  choice: orang yang memukul saudaranya itu
  rationale: Partisipel נכה tidak langsung diterjemahkan sebagai 'pembunuh', sehingga urutan ungkapan Ibrani tetap terpelihara sebelum kematian disebut secara eksplisit.
- source_word: וּנְמִתֵהוּ בְּנֶפֶשׁ אָחִיו
  choice: supaya kami membunuh dia sebagai ganti nyawa saudaranya
  rationale: Menyampaikan maksud tindakan dan idiom pembalasan nyawa dengan nyawa tanpa menambahkan penilaian hukum yang tidak dinyatakan.
- source_word: וְנַשְׁמִידָה גַּם אֶת הַיּוֹרֵשׁ
  choice: Kami juga akan memusnahkan ahli waris itu
  rationale: Mempertahankan kerasnya kata שׁמד dan menyatakan bahwa anak yang masih hidup adalah pewaris.
- source_word: וְכִבּוּ אֶת גַּחַלְתִּי אֲשֶׁר נִשְׁאָרָה
  choice: mereka akan memadamkan bara apiku yang masih tersisa
  rationale: Metafora bara yang masih hidup dipertahankan karena menggambarkan satu-satunya keturunan dan harapan yang tersisa.
- source_word: שֵׁם וּשְׁאֵרִית
  choice: nama ataupun keturunan yang tersisa
  rationale: '''Nama'' dipertahankan sebagai konsep tersendiri, sedangkan שְׁאֵרִית dijelaskan sebagai garis keturunan yang masih bertahan sesuai konteks keluarga.'
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: di muka bumi
  rationale: Padanan alami dan bermartabat yang mempertahankan cakupan ungkapan Ibrani.
theological_decisions:
- issue: Makna 'nama dan yang tersisa' dalam kelangsungan rumah tangga
  choice: nama ataupun keturunan yang tersisa
  alternative: nama ataupun sisa
  rationale: Konteks pewaris dan bara terakhir menunjukkan kelangsungan nama serta garis keluarga. Terjemahan menjelaskan referen שְׁאֵרִית tanpa menyamakan 'nama' hanya dengan reputasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tuturan langsung tetap bernada mendesak; metafora bara dipertahankan. 'Kaum keluarga' dipakai untuk kelompok kerabat luas, dan 'hambamu ini' mempertahankan kerendahan diri dalam sapaan kepada raja.
