translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang alami dan mudah dipahami. Ungkapan kelahiran dialihkan menjadi pernyataan hubungan keluarga agar tidak menimbulkan kesan biologis yang keliru dalam bahasa sasaran; deskripsi kecantikan tetap mempertahankan rujukan kepada paras atau penampilan.
