base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/027.yaml
  text: Three sons and one daughter were born to Absalom[a], and her name was Tamar. She was a woman beautiful in appearance.
translation:
  language: id
  text: Tiga anak laki-laki dan seorang anak perempuan lahir bagi Absalom. Nama anak perempuan itu Tamar. Ia seorang perempuan yang cantik parasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּלְדוּ לְאַבְשָׁלוֹם
  choice: Absalom mempunyai
  rationale: Konstruksi Nifal ילד dengan ל menyatakan bahwa anak-anak lahir bagi Absalom, yakni hubungan orang tua-anak. Ungkapan “Absalom mempunyai” menyampaikan makna itu secara alami dalam bahasa Indonesia tanpa memberi kesan bahwa Absalom sendiri yang melahirkan.
- source_word: שְׁלוֹשָׁה בָנִים
  choice: tiga anak laki-laki
  rationale: בָנִים di sini secara khusus berarti anak-anak laki-laki, sehingga unsur gender dipertahankan.
- source_word: וּבַת אַחַת
  choice: dan seorang anak perempuan
  rationale: Angka אַחַת dalam konstruksi ini secara wajar diterjemahkan dengan kata sandang numeralia “seorang” dalam bahasa Indonesia.
- source_word: וּשְׁמָהּ תָּמָר
  choice: Nama anak perempuannya itu Tamar
  rationale: Akhiran feminin tunggal pada שְׁמָהּ merujuk kepada anak perempuan yang baru disebut. Penyebutan ulang “anak perempuannya itu” memperjelas rujukan secara alami.
- source_word: הִיא הָיְתָה אִשָּׁה
  choice: Ia seorang perempuan
  rationale: אִשָּׁה menunjuk kepada seorang perempuan dewasa. Pronomina mandiri הִיא dipertahankan melalui “Ia” tanpa menambahkan penekanan yang tidak perlu.
- source_word: יְפַת מַרְאֶה
  choice: yang cantik parasnya
  rationale: Ungkapan Ibrani ini menggambarkan kecantikan jasmani atau penampilan. “Cantik parasnya” alami, bermartabat, dan tetap mencerminkan unsur מַרְאֶה.
- source_word: תָּמָר
  choice: Tamar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
