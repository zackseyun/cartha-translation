  text: So Joab arose and went to Geshur[a], and brought Absalom to Jerusalem.
translation:
  language: id
  text: Lalu Yoab bangkit dan pergi ke Gesur. Ia membawa Absalom ke Yerusalem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membawa Absalom kembali ke Yerusalem.” Konteks menunjukkan bahwa Absalom pulang dari pengasingan, tetapi kata “kembali” tidak dinyatakan secara eksplisit dalam verba Ibrani.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk dari קום menggerakkan alur dengan arti bangun atau berdiri untuk bertindak. “Bangkit” mempertahankan irama naratif yang bermartabat tanpa menafsirkannya secara berlebihan sebagai langsung berangkat.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך dalam narasi sederhana lazim berarti “pergi”; pilihan ini alami dan tidak menambahkan nuansa perjalanan yang tidak dinyatakan.
- source_word: גְּשׁוּרָה
  choice: ke Gesur
  rationale: Akhiran penunjuk arah -ה menyatakan gerak menuju Gesur, yang secara alami diterjemahkan dengan preposisi “ke”.
- source_word: וַיָּבֵא
  choice: membawa
  rationale: Bentuk Hifil dari בוא berarti menyebabkan datang, yakni “membawa”. Konteks memungkinkan arti “membawa kembali”, tetapi unsur “kembali” tidak dinyatakan secara eksplisit oleh verba Ibrani.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: Penanda objek langsung diikuti nama diri; bentuk nama Indonesia yang lazim adalah “Absalom”.
- source_word: יְרוּשָׁלִָם
  choice: ke Yerusalem
  rationale: Walaupun tidak ada preposisi tersendiri dalam teks Ibrani, sintaksis menunjukkan Yerusalem sebagai tujuan dari tindakan membawa; bahasa Indonesia secara alami menandainya dengan “ke”.
- source_word: וַ
  choice: Lalu / dan / Ia
  rationale: Rangkaian waw-konsekutif menyusun tindakan secara berurutan. “Lalu” membuka kelanjutan narasi secara alami, “dan” menghubungkan dua tindakan pertama, sedangkan kalimat baru dengan “Ia” menghindari rangkaian konjungsi yang kaku tanpa mengubah urutan tindakan.
