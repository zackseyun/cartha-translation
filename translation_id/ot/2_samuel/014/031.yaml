base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/031.yaml
  text: Then Joab arose and went to Absalom’s house and said to him[a], “Why have your servants set my field on fire?”
translation:
  language: id
  text: Lalu Yoab bangkit dan pergi ke rumah Absalom. Ia berkata kepadanya, “Mengapa hamba-hambamu membakar ladang milikku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: Lalu Yoab bangkit
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. 'Lalu' menyatakan kesinambungan peristiwa, sedangkan 'bangkit' mempertahankan ungkapan naratif Ibrani dengan bahasa Indonesia yang tetap wajar dan bermartabat.
- source_word: וַיָּבֹא אֶל אַבְשָׁלוֹם הַבָּיְתָה
  choice: pergi ke rumah Absalom
  rationale: Akhiran arah pada הַבָּיְתָה menunjukkan tujuan, yaitu ke rumah. Dalam konteks, rumah itu adalah kediaman Absalom; susunan ini paling alami dalam bahasa Indonesia.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya yang menanyakan alasan.
- source_word: הִצִּיתוּ
  choice: membakar
  rationale: Bentuk Hifil dari יצת berarti menyalakan atau membuat terbakar. Dalam konstruksi dengan ladang dan api, 'membakar' menyampaikan tindakan sengaja secara alami tanpa kehilangan daya kausatifnya.
- source_word: עֲבָדֶךָ
  choice: hamba-hambamu
  rationale: Walaupun bentuk nomina secara morfologis tunggal, verba הִצִּיתוּ berbentuk jamak sehingga acuannya kolektif atau jamak. 'Hamba-hambamu' mempertahankan hubungan sosial yang dinyatakan teks tanpa memperkerasnya menjadi 'budak-budakmu'.
- source_word: הַחֶלְקָה אֲשֶׁר לִי
  choice: ladang milikku
  rationale: חֶלְקָה menunjuk sebidang atau petak tanah, dan אֲשֶׁר לִי menegaskan bahwa tanah itu milik Yoab. 'Ladang milikku' ringkas, alami, dan tetap mempertahankan penegasan kepemilikan dalam teks.
- source_word: בָּאֵשׁ
  choice: membakar
  rationale: Secara harfiah berarti 'dengan api' sebagai sarana. Dalam bahasa Indonesia, gagasan itu sudah terkandung secara idiomatis dalam verba 'membakar', sehingga pengulangan 'dengan api' tidak diperlukan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang sederhana dan bermartabat. 'Bangkit' mempertahankan warna narasi sumber, sementara 'membakar ladang milikku' menyampaikan konstruksi Ibrani secara alami. Tidak ada ambiguitas teologis khusus yang memerlukan catatan kaki.
