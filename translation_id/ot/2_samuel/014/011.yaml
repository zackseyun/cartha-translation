base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/011.yaml
  text: Then she said[a], “Please let the king remember Yahweh your God, so that the avenger of blood may not continue to destroy, and they may not destroy my son.” And he said, “As Yahweh lives[b], not one hair of your son shall fall to the ground.”
translation:
  language: id
  text: Lalu perempuan itu berkata, “Kiranya raja mengingat Yahweh, Allahmu, agar penuntut darah[a] tidak terus mendatangkan kebinasaan dan agar mereka tidak memusnahkan anakku.” Raja menjawab, “Demi Yahweh yang hidup, sehelai rambut anakmu pun tidak akan jatuh ke tanah[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Penuntut darah adalah kerabat dekat yang bertanggung jawab menuntut pembalasan atas kematian anggota keluarganya; dapat juga diterjemahkan “pembalas darah”.
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan Ibrani ini merupakan jaminan perlindungan penuh: anak itu tidak akan dibiarkan mengalami celaka.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יִזְכָּר נָא
  choice: Kiranya raja mengingat
  rationale: Bentuk yusif dengan נָא menyatakan permohonan yang sopan dan penuh hormat. “Kiranya” mempertahankan nada permohonan kepada raja tanpa menjadikannya perintah langsung.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה dialihaksarakan sebagai “Yahweh”, sedangkan akhiran posesif pada אֱלֹהֶיךָ dipertahankan sebagai “Allahmu”.
- source_word: מֵהַרְבּוֹת גֹּאֵל הַדָּם לְשַׁחֵת
  choice: agar penuntut darah tidak terus mendatangkan kebinasaan
  rationale: Konstruksi מן dengan infinitif kausatif רבה menyampaikan gagasan mencegah tindakan penghancuran berlanjut atau bertambah. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan aspek berkelanjutan tanpa menentukan secara berlebihan bagaimana kehancuran itu “diperbanyak”.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Istilah ini menunjuk kerabat yang berkewajiban menuntut pembalasan atas darah anggota keluarganya. “Penuntut darah” ringkas, bermartabat, dan mempertahankan konsep hukum-kekerabatan Ibrani; penjelasannya diberikan dalam catatan kaki.
- source_word: וְלֹא יַשְׁמִידוּ אֶת־בְּנִי
  choice: dan mereka tidak memusnahkan anakku
  rationale: Subjek jamak yang tidak dinyatakan secara eksplisit dipertahankan dengan “mereka”, sehingga terjemahan tidak membatasi para pelaku hanya pada satu orang. שׁמד diterjemahkan “memusnahkan” untuk mencerminkan daya ungkapnya yang kuat.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ini adalah rumusan sumpah. “Demi Yahweh yang hidup” menyampaikan fungsi sumpah secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: אִם יִפֹּל מִשַּׂעֲרַת בְּנֵךְ אָרְצָה
  choice: sehelai pun rambut anakmu tidak akan jatuh ke tanah
  rationale: Sesudah rumusan sumpah, אִם berfungsi sebagai penyangkalan yang tegas. Ungkapan rambut yang tidak jatuh ke tanah dipertahankan karena jelas dan hidup dalam bahasa Indonesia, dengan makna idiomatis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi khusus יְהוָה. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan membedakannya dari gelar umum.
- issue: Arti tindakan raja “mengingat Yahweh”
  choice: Mempertahankan kata “mengingat” tanpa menambahkan tindakan tertentu
  alternative: memohon kepada Yahweh / bertindak dengan mengingat Yahweh
  rationale: זכר dapat mengandung implikasi bertindak berdasarkan apa yang diingat, tetapi ayat ini tidak menyebut secara eksplisit apakah raja harus bersumpah, berdoa, atau mengambil tindakan hukum tertentu. Terjemahan mempertahankan keluasan maknanya.
- issue: Identitas subjek jamak dalam “mereka tidak memusnahkan”
  choice: mereka
  alternative: para penuntut darah / kaum keluarganya
  rationale: Teks Ibrani memakai verba jamak tanpa menyebut subjeknya. Mempertahankan “mereka” menghindari penentuan identitas para pelaku yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Kiranya” menandai permohonan hormat kepada raja, sedangkan “Demi Yahweh yang hidup” mempertahankan kekuatan rumusan sumpah. Struktur yang berpotensi ambigu dalam bahasa Ibrani tidak dijelaskan secara berlebihan di dalam teks utama.
