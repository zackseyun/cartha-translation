base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/033.yaml
  text: Then Joab came to the king and told him[a], and he called for Absalom. So he came to the king and bowed himself with his face to the ground before the king[b], and the king kissed Absalom.
translation:
  language: id
  text: Kemudian Yoab menghadap raja dan memberitahukan kepadanya. Lalu raja memanggil Absalom[a]. Absalom pun datang menghadap raja dan sujud kepadanya dengan muka ke tanah di hadapan raja. Kemudian raja mencium Absalom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyuruh memanggil Absalom.”'
    reason: Alternatif ini menonjolkan nuansa panggilan resmi untuk datang menghadap.
  - marker: b
    text: Ciuman raja kemungkinan menandakan perdamaian atau pulihnya perkenanan, meskipun teks hanya menyatakan bahwa raja mencium Absalom.
    reason: Catatan budaya dan naratif menjelaskan kemungkinan arti tindakan itu tanpa memasukkannya ke dalam terjemahan utama.
lexical_decisions:
- source_word: וַיָּבֹא יוֹאָב אֶל־הַמֶּלֶךְ
  choice: Yoab menghadap raja
  rationale: Dalam konteks istana, frasa ini menyatakan bahwa Yoab datang ke hadapan raja. “Menghadap raja” alami dalam bahasa Indonesia dan mempertahankan arah gerak serta suasana resmi.
- source_word: וַיַּגֶּד לוֹ
  choice: menyampaikan hal itu kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. Objek laporannya tidak dinyatakan dalam bahasa Ibrani, sehingga “hal itu” hanya berfungsi sebagai pelengkap alami tanpa merinci isi laporan.
- source_word: וַיִּקְרָא אֶל־אַבְשָׁלוֹם
  choice: ia memanggil Absalom
  rationale: קרא אל dapat berarti memanggil atau menyuruh seseorang datang. Kata ganti “ia” mempertahankan ketidaktersuratan subjek dalam bahasa Ibrani, meskipun konteks paling wajar menunjuk kepada raja.
- source_word: וַיִּשְׁתַּחוּ לוֹ
  choice: sujud kepadanya
  rationale: Bentuk שחה di sini menggambarkan penghormatan dengan membungkuk sampai ke tanah. “Sujud” ringkas, bermartabat, dan diperjelas oleh frasa berikutnya mengenai muka yang sampai ke tanah.
- source_word: עַל־אַפָּיו אַרְצָה
  choice: dengan muka sampai ke tanah
  rationale: Secara harfiah berarti “pada mukanya, ke arah tanah.” Pilihan ini menyampaikan postur merendahkan diri secara penuh dalam bahasa Indonesia yang alami.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Padanan baku dan alami bagi לפני dalam adegan istana.
- source_word: וַיִּשַּׁק הַמֶּלֶךְ לְאַבְשָׁלוֹם
  choice: raja mencium Absalom
  rationale: נשק menyatakan tindakan mencium secara harfiah. Terjemahan langsung mempertahankan tindakan naratif tanpa memasukkan tafsiran maknanya ke dalam teks utama.
theological_decisions:
- issue: Makna ciuman raja
  choice: Diterjemahkan secara harfiah sebagai tindakan mencium.
  alternative: Menjelaskannya dalam teks utama sebagai tanda perdamaian atau pemulihan kedudukan.
  rationale: Ciuman itu kemungkinan menandakan penerimaan kembali atau pemulihan perkenanan, tetapi teks Ibrani hanya menyatakan bahwa raja mencium Absalom. Tafsiran maknanya ditempatkan dalam catatan agar ketegangan naratif tetap terpelihara.
- issue: Subjek וַיִּקְרָא, “lalu ia memanggil”
  choice: Memakai kata ganti “ia” tanpa menyebut nama subjek.
  alternative: Menulis secara eksplisit, “Lalu raja memanggil Absalom.”
  rationale: Konteks sangat mungkin menunjuk kepada raja, tetapi bentuk Ibraninya tidak mengulangi subjek. Kata ganti mempertahankan tingkat keterusterangan dan sedikit ambiguitas teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Menghadap raja” dan “di hadapan raja” mempertahankan suasana istana; “sujud” dipakai dalam arti postur penghormatan yang dijelaskan oleh frasa “dengan muka sampai ke tanah.”
