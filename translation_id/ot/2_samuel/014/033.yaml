  verdict: revise
  source_fidelity: Secara umum setia pada urutan dan isi Ibrani. Namun, “menyampaikan hal itu kepadanya” menambahkan objek eksplisit (“hal itu”) yang tidak ada dalam teks; “memberitahukan kepadanya” lebih dekat. Subjek dalam “Lalu ia memanggil” secara sintaktis merujuk paling wajar kepada raja dan dapat dinyatakan untuk kejelasan tanpa menambah makna.
  naturalness: Bahasanya umumnya alami dan berregister baik. “Dengan muka sampai ke tanah” dapat dipahami, tetapi “dengan muka ke tanah” lebih idiomatis serta dekat dengan gambaran Ibrani. Pengulangan “raja” dalam adegan istana wajar.
  terminology: Nama Yoab dan Absalom konsisten. “Sujud” dapat diterima bagi postur penghormatan di sini karena segera diperjelas oleh “dengan muka ke tanah”; tidak perlu diberi muatan ibadah. Catatan ciuman mempertahankan kehati-hatian tafsir.
