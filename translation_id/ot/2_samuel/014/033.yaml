    rationale: Rangkaian naratif dan konteks jelas menunjuk kepada raja sebagai subjek וַיִּקְרָא. Menyebut “raja” mencegah kemungkinan pembaca mengira Yoab yang memanggil, tanpa menafsirkan melampaui teks.
