id: 2SA.14.20
reference: 2 Samuel 14:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְ/בַ/עֲב֤וּר סַבֵּב֙ אֶת פְּנֵ֣י הַ/דָּבָ֔ר עָשָׂ֛ה עַבְדְּ/ךָ֥ יוֹאָ֖ב אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/אדֹנִ֣/י חָכָ֗ם כְּ/חָכְמַת֙ מַלְאַ֣ךְ הָ/אֱלֹהִ֔ים לָ/דַ֖עַת אֶֽת כָּל אֲשֶׁ֥ר בָּ/אָֽרֶץ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/020.yaml
  text: In order to change the course of the matter[a], your servant Joab did this thing. But my lord is wise, with the wisdom of the angel of God[b], to know all that is in the land.
translation:
  language: id
  text: Untuk mengubah arah perkara ini[a], hambamu Yoab melakukan hal ini. Namun, tuanku bijaksana, dengan hikmat seperti hikmat malaikat Allah, sehingga mengetahui segala sesuatu yang ada di negeri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memutar atau mengubah wajah perkara itu”; dapat juga berarti “membalikkan keadaan perkara itu” atau “mengubah tampaknya perkara itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “segala sesuatu yang ada di bumi.” Dalam konteks ini, “negeri” kemungkinan menunjuk wilayah atau kerajaan, bukan seluruh dunia.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַעֲבוּר
  choice: Untuk
  rationale: Menandai tujuan tindakan Yoab secara alami dan tepat dalam bahasa Indonesia.
- source_word: סַבֵּב אֶת־פְּנֵי הַדָּבָר
  choice: mengubah arah perkara ini
  rationale: Mengungkapkan maksud idiom Ibrani tentang mengubah cara perkara itu berjalan atau ditangani, sambil mempertahankan unsur perubahan arah. Metafora harfiahnya dijelaskan dalam catatan kaki.
- source_word: עָשָׂה ... אֶת־הַדָּבָר הַזֶּה
  choice: melakukan hal ini
  rationale: Padanan langsung dan alami; menghindari pengulangan kata 'perkara' yang terasa kaku dalam bahasa Indonesia.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Sesuai dengan ungkapan merendahkan diri dalam bahasa istana dan mempertahankan bentuk orang kedua tunggal.
- source_word: וַאדֹנִי
  choice: Namun, tuanku
  rationale: Konjungsi dipahami sebagai peralihan yang agak kontras dari penjelasan tentang Yoab kepada pujian atas kebijaksanaan raja.
- source_word: חָכָם
  choice: bijaksana
  rationale: Padanan umum yang sesuai dengan konteks kemampuan raja untuk memahami dan menilai perkara.
- source_word: כְּחָכְמַת מַלְאַךְ הָאֱלֹהִים
  choice: dengan hikmat seperti hikmat malaikat Allah
  rationale: Mempertahankan perbandingan eksplisit serta pengulangan akar 'bijaksana/hikmat' dalam teks Ibrani. Bahasa Indonesia tidak mewajibkan artikel tertentu atau tak tentu, sehingga tidak menentukan apakah yang dimaksud satu malaikat tertentu.
- source_word: לָדַעַת
  choice: sehingga mengetahui
  rationale: Mengungkapkan hasil atau kemampuan yang timbul dari hikmat tersebut dengan lebih alami daripada bentuk tujuan yang kaku.
- source_word: כָּל אֲשֶׁר בָּאָרֶץ
  choice: segala sesuatu yang ada di negeri
  rationale: Dalam konteks kerajaan Daud, 'negeri' lebih mungkin menunjuk wilayah atau kerajaan daripada seluruh bumi, tetapi alternatifnya tetap dicatat.
theological_decisions:
- issue: Rujukan 'malaikat Allah'
  choice: Dipertahankan sebagai perbandingan yang memuji hikmat luar biasa sang raja.
  alternative: Pernyataan bahwa Daud memiliki pengetahuan ilahi atau bahwa yang dimaksud adalah satu malaikat tertentu.
  rationale: Ungkapan ini merupakan bahasa perbandingan dalam pujian istana. Terjemahan tidak mengubahnya menjadi klaim tentang hakikat Daud atau kemahatahuannya, dan tidak memaksakan ketentuan yang tidak harus dinyatakan dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hormat sesuai percakapan di hadapan raja. Bentuk 'hambamu' dan 'tuanku' mempertahankan kesantunan istana tanpa menjadi terlalu arkais.
