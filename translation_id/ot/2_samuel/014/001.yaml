id: 2SA.14.1
reference: 2 Samuel 14:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֖דַע יוֹאָ֣ב בֶּן צְרֻיָ֑ה כִּֽי לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/001.yaml
  text: Joab son of Zeruiah knew that the king’s heart was toward Absalom[a].
translation:
  language: id
  text: Yoab, anak Zeruya, tahu bahwa hati raja tertuju kepada Absalom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “raja merindukan Absalom”; ungkapan Ibraninya ringkas dan secara lebih umum dapat dipahami sebagai “hati raja tertuju kepada Absalom.” Ada juga yang memahaminya secara negatif, “hati raja menentang Absalom,” meskipun konteks berikutnya lebih mendukung kecenderungan positif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: tahu
  rationale: Bentuk wayyiqtol dari ידע melanjutkan alur narasi. 'Tahu' menyampaikan makna langsung tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: יוֹאָב בֶּן צְרֻיָה
  choice: Yoab, anak Zeruya
  rationale: Nama-nama ditransliterasikan menurut kelaziman Alkitab bahasa Indonesia; frasa konstruk diterjemahkan secara alami.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang diketahui Yoab.
- source_word: לֵב הַמֶּלֶךְ
  choice: hati raja
  rationale: '''Hati'' mempertahankan ungkapan antropologis Ibrani yang menunjuk pada sikap batin, kehendak, atau perasaan.'
- source_word: עַל
  choice: tertuju kepada
  rationale: Preposisi ini dalam ungkapan eliptis tersebut dapat menunjukkan arah sikap hati. 'Tertuju kepada' alami dalam bahasa Indonesia dan tidak menentukan secara mutlak apakah sikap itu berupa kerinduan, perhatian, atau permusuhan.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Ambiguitas sikap hati raja terhadap Absalom
  choice: hati raja tertuju kepada Absalom
  alternative: raja merindukan Absalom; hati raja menentang Absalom
  rationale: Bahasa Ibraninya ringkas dan tidak menyatakan secara eksplisit apakah sikap Daud positif atau negatif. Terjemahan utama mempertahankan arah sikap tanpa menuntaskan ambiguitas, sedangkan catatan kaki mencatat kemungkinan yang lebih spesifik dan menunjukkan bahwa konteks berikutnya lebih mendukung kecenderungan positif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Koma pada aposisi 'anak Zeruya' membantu keterbacaan. Ungkapan 'hati ... tertuju kepada' mempertahankan citra bahasa sumber sekaligus tetap alami.
