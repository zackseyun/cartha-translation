  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk perintah berakhiran -lah menjaga keluwesan dan kesantunan. Istilah budaya dijelaskan dalam catatan tanpa mengganti gambaran konkret teks Ibrani.
