  text: וַ/יִּשְׁלַ֤ח יוֹאָב֙ תְּק֔וֹעָ/ה וַ/יִּקַּ֥ח מִ/שָּׁ֖ם אִשָּׁ֣ה חֲכָמָ֑ה וַ/יֹּ֣אמֶר אֵ֠לֶי/הָ הִֽתְאַבְּלִי נָ֞א וְ/לִבְשִׁי נָ֣א בִגְדֵי אֵ֗בֶל וְ/אַל תָּס֨וּכִי֙ שֶׁ֔מֶן וְ/הָיִ֕ית כְּ/אִשָּׁ֗ה זֶ֚ה יָמִ֣ים רַבִּ֔ים מִתְאַבֶּ֖לֶת עַל מֵֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/002.yaml
  text: So Joab sent to Tekoa and took from there a wise woman[a], and he said to her, “Please pretend to be mourning, and please put on mourning clothes, and do not anoint yourself with oil[d][c][b], but be like a woman who has been mourning for the dead many days.”
translation:
  language: id
  text: Lalu Yoab mengutus ke Tekoa dan mendatangkan dari sana seorang perempuan bijaksana.[a] Ia berkata kepadanya, “Berpura-puralah berkabung,[b] kenakanlah pakaian berkabung,[c] dan jangan oleskan minyak pada tubuhmu.[d] Jadilah seperti seorang perempuan yang telah berkabung selama berhari-hari karena seseorang yang meninggal.”[e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “bijaksana” juga dapat berarti cakap atau cerdik dalam bertindak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berkabunglah.” Konteks menunjukkan bahwa Yoab menyuruh perempuan itu berperan sebagai orang yang berkabung.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pakaian-pakaian perkabungan.”
    reason: lexical_alternative
  - marker: d
    text: Tidak mengoleskan minyak pada tubuh merupakan tanda perkabungan, sebagai kebalikan dari kebiasaan merawat dan menyegarkan diri.
    reason: cultural_note
  - marker: e
    text: Secara harfiah, “seperti seorang perempuan yang selama banyak hari berkabung atas orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקוֹעָה
  choice: Tekoa
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: אִשָּׁה חֲכָמָה
  choice: seorang perempuan bijaksana
  rationale: Mempertahankan makna dasar חֲכָמָה tanpa mempersempitnya menjadi sekadar cerdik atau lihai; konteks memperlihatkan kecakapannya menjalankan rencana Yoab.
- source_word: הִתְאַבְּלִי נָא
  choice: Berpura-puralah berkabung
  rationale: Verba Ibrani berarti berkabung, sedangkan konteks naratif menunjukkan bahwa Yoab memintanya menampilkan diri sebagai orang yang berkabung dalam suatu penyamaran. Unsur נָא tercermin dalam bentuk permintaan yang santun, meskipun bahasa Indonesia tidak memerlukan kata 'tolong' pada setiap perintah.
- source_word: וְלִבְשִׁי נָא בִגְדֵי אֵבֶל
  choice: kenakanlah pakaian berkabung
  rationale: Ungkapan ini secara harfiah menunjuk pada pakaian yang dikenakan dalam masa berkabung; bentuk Indonesia ini alami dan tetap dekat dengan sumber.
- source_word: וְאַל תָּסוּכִי שֶׁמֶן
  choice: jangan oleskan minyak pada tubuhmu
  rationale: סוך dengan שֶׁמֶן berarti mengoleskan minyak pada tubuh untuk perawatan atau penyegaran. Pilihan ini lebih jelas bagi pembaca modern daripada 'mengurapi dirimu'.
- source_word: וְהָיִית כְּאִשָּׁה
  choice: Tampillah seperti seorang perempuan
  rationale: Secara harfiah 'jadilah seperti seorang perempuan'; 'tampillah' menyampaikan bahwa petunjuk itu menyangkut penampilan dan peran yang harus diperlihatkan.
- source_word: זֶה יָמִים רַבִּים
  choice: sudah lama
  rationale: Idiom ini menunjuk pada jangka waktu yang panjang. 'Sudah lama' menyampaikan daya duratifnya secara wajar dalam bahasa Indonesia.
- source_word: מִתְאַבֶּלֶת עַל מֵת
  choice: berkabung karena seseorang yang meninggal
  rationale: Partisipel menggambarkan keadaan berkabung yang berlangsung, sedangkan מֵת berbentuk tunggal tak tentu. Pilihan ini mempertahankan ketidaktentuan itu dengan bahasa Indonesia yang alami.
