  text: In all Israel there was not a man as handsome as Absalom[a], so highly praised; from the sole of his foot to the crown of his head there was no blemish in him.
translation:
  language: id
  text: Di seluruh Israel tidak ada seorang pun yang setampan Absalom dan begitu dipuji karena ketampanannya. Dari telapak kakinya sampai ke puncak kepalanya tidak ada cacat pada tubuhnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְאַבְשָׁלוֹם
  choice: setampan Absalom
  rationale: Prefiks כְּ menyatakan perbandingan; bersama klausa negatif, ungkapan ini menegaskan bahwa tidak ada seorang pun yang menyamai Absalom dalam ketampanan.
- source_word: לֹא הָיָה אִישׁ יָפֶה בְּכָל יִשְׂרָאֵל
  choice: Di seluruh Israel tidak ada seorang pun yang setampan
  rationale: Susunan ini secara alami menyampaikan perbandingan superlatif dalam bahasa Indonesia, yakni tidak ada laki-laki di seluruh Israel yang menyamai ketampanannya.
- source_word: לְהַלֵּל מְאֹד
  choice: begitu dipuji
  rationale: Infinitif dengan מְאֹד menyatakan pujian dalam kadar yang luar biasa. Bentuk pasif mempertahankan fokus teks pada Absalom sebagai orang yang menerima pujian tanpa menambahkan pelaku.
- source_word: מִכַּף רַגְלוֹ
  choice: dari telapak kakinya
  rationale: כַּף ketika dipakai untuk kaki secara idiomatis menunjuk telapak kaki.
- source_word: וְעַד קָדְקֳדוֹ
  choice: sampai ke puncak kepalanya
  rationale: קָדְקֹד menunjuk bagian paling atas atau puncak kepala; pilihan ini jelas dan alami bagi pembaca modern.
- source_word: לֹא הָיָה בוֹ מוּם
  choice: tidak ada cacat pada tubuhnya
  rationale: מוּם di sini menunjuk cacat atau cela jasmani. Penambahan 'tubuhnya' memperjelas lingkup fisik yang sudah ditetapkan oleh ungkapan dari kaki sampai kepala.
