base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/030.yaml
  text: Then he said to his servants[a], “Look, Joab’s field is next to mine, and he has barley there. Go and set it on fire.” So Absalom’s servants set the field on fire.
translation:
  language: id
  text: Lalu ia berkata kepada para pelayannya, “Lihat, ladang Yoab berada di samping ladangku[a], dan ia mempunyai tanaman jelai di sana. Pergilah dan bakarlah ladang itu.” Maka para pelayan Absalom membakar ladang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ladang Yoab ada di sisiku,” sebuah ungkapan yang berarti bahwa ladang itu berada di samping atau berdekatan dengan ladang Absalom.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְקַת
  choice: ladang
  rationale: Dalam konteks ini kata tersebut menunjuk pada sebidang tanah pertanian milik Yoab; “ladang” merupakan padanan Indonesia yang paling wajar.
- source_word: אֶל יָדִי
  choice: di samping ladangku
  rationale: Ungkapan harfiahnya berarti “di dekat tanganku,” tetapi dalam konteks letak tanah menyatakan bahwa ladang Yoab berbatasan atau berdekatan dengan ladang Absalom.
- source_word: שְׂעֹרִים
  choice: tanaman jelai
  rationale: Bentuk jamak ini menunjuk pada jelai sebagai tanaman yang berada di ladang. “Tanaman jelai” memperjelas konteks pertanian tanpa menyiratkan bahwa yang dimaksud adalah biji-bijian yang sudah dipanen.
- source_word: וְהוּצִיתִהָ / וַיַּצִּתוּ
  choice: bakarlah ladang itu / membakar ladang itu
  rationale: Bentuk kausatif verba יצת berarti menyulut atau membuat sesuatu terbakar. “Membakar” menyampaikan tindakan itu secara alami dalam bahasa Indonesia, dan pengulangannya mempertahankan hubungan langsung antara perintah dan pelaksanaannya.
- source_word: עֲבָדָיו / עַבְדֵי אַבְשָׁלוֹם
  choice: para pelayannya / para pelayan Absalom
  rationale: עבד dapat berarti budak, hamba, atau pelayan. Konteks istana ini tidak menekankan status keterikatan mereka, sehingga “pelayan” tepat tanpa menentukan status sosial secara berlebihan.
- source_word: רְאוּ
  choice: Lihat
  rationale: Imperatif ini menarik perhatian para pelayan kepada ladang yang berdekatan; “Lihat” alami dalam ujaran langsung.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif gerak ini mendahului perintah untuk membakar ladang dan diterjemahkan secara langsung.
