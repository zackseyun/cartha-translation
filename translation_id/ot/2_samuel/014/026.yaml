translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Tanda pisah mempertahankan sisipan penjelas dalam bahasa Ibrani, sedangkan kalimat terakhir dipecah agar berat rambut mudah dipahami.
