  text: וּֽ/בְ/גַלְּח/וֹ֮ אֶת רֹאשׁ/וֹ֒ וְֽ֠/הָיָה מִ/קֵּ֨ץ יָמִ֤ים לַ/יָּמִים֙ אֲשֶׁ֣ר יְגַלֵּ֔חַ כִּֽי כָבֵ֥ד עָלָ֖י/ו וְ/גִלְּח֑/וֹ וְ/שָׁקַל֙ אֶת שְׂעַ֣ר רֹאשׁ֔/וֹ מָאתַ֥יִם שְׁקָלִ֖ים בְּ/אֶ֥בֶן הַ/מֶּֽלֶךְ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/026.yaml
  text: 'Whenever he cut the hair of his head—at the end of every year he would cut it[a], because it was heavy on him—when he cut it, he weighed the hair of his head: two hundred shekels by the king’s stone.'
translation:
  language: id
  text: Setiap kali Absalom memangkas rambut kepalanya—pada akhir setiap tahun ia memangkasnya karena rambut itu terasa berat baginya—ia menimbang rambut kepalanya yang telah dipangkas itu. Beratnya dua ratus syikal menurut batu timbangan raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut batu milik raja,” yaitu menurut standar berat kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְגַלְּחוֹ אֶת־רֹאשׁוֹ
  choice: Setiap kali Absalom memangkas rambut kepalanya
  rationale: Bentuk infinitif dalam konteks kebiasaan menyatakan tindakan berulang. Nama “Absalom” dipakai untuk memperjelas subjek dalam bahasa Indonesia. “Memangkas rambut” lebih alami daripada ungkapan harfiah “mencukur kepalanya” dan tidak mengharuskan arti mencukur sampai gundul.
- source_word: וְהָיָה מִקֵּץ יָמִים לַיָּמִים
  choice: pada akhir setiap tahun
  rationale: Ungkapan Ibrani ini menunjuk pada selang waktu yang teratur dan dalam konteks ini paling wajar dipahami sebagai tindakan tahunan.
- source_word: כִּי־כָבֵד עָלָיו
  choice: karena rambut itu terasa berat baginya
  rationale: Mempertahankan gambaran Ibrani tentang rambut yang berat, sambil memperjelas acuan pronominanya.
- source_word: וְשָׁקַל אֶת־שְׂעַר רֹאשׁוֹ
  choice: ia menimbang rambut kepalanya yang telah dipangkas itu
  rationale: Mengungkapkan tindakan penimbangan secara jelas dan mempertahankan penyebutan “rambut kepalanya” dari teks sumber.
- source_word: מָאתַיִם שְׁקָלִים
  choice: dua ratus syikal
  rationale: Syikal di sini merupakan satuan berat, bukan mata uang; transliterasi mempertahankan satuan kuno tanpa memasukkan perkiraan modern yang tidak pasti.
- source_word: בְּאֶבֶן הַמֶּלֶךְ
  choice: menurut batu timbangan raja
  rationale: Menerjemahkan אֶבֶן secara konkret sebagai “batu timbangan” sekaligus menyampaikan bahwa yang dimaksud ialah standar berat resmi milik raja.
