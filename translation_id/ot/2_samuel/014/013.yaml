  text: וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה וְ/לָ֧/מָּה חָשַׁ֛בְתָּה כָּ/זֹ֖את עַל עַ֣ם אֱלֹהִ֑ים וּ/מִ/דַּבֵּ֨ר הַ/מֶּ֜לֶךְ הַ/דָּבָ֤ר הַ/זֶּה֙ כְּ/אָשֵׁ֔ם לְ/בִלְתִּ֛י הָשִׁ֥יב הַ/מֶּ֖לֶךְ אֶֽת נִדְּחֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/013.yaml
  text: Then the woman said[a], “Why then have you planned such a thing against the people of God? For in speaking this word, the king is like one who is guilty[b], because the king has not brought back his banished one.”
translation:
  language: id
  text: Lalu perempuan itu berkata, “Kalau begitu, mengapa Raja merencanakan[a] hal semacam ini terhadap umat Allah? Dengan mengucapkan perkataan ini, Raja seperti orang yang bersalah[b], karena Raja tidak membawa kembali orangnya yang terbuang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memikirkan” atau “merancang”.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, perkataan Raja sendiri menempatkan dia seperti orang yang bersalah karena ia tidak membawa kembali orangnya yang terbuang. Secara harfiah, “orangnya yang terbuang”; ungkapan ini dapat juga dipahami sebagai “orang yang dibuangnya”.
    reason: alternative_reading
lexical_decisions:
- source_word: חָשַׁבְתָּה
  choice: merencanakan
  rationale: Kata חשב dapat berarti memikirkan, merancang, atau merencanakan. Dalam teguran ini, “merencanakan” menyampaikan tindakan atau kebijakan yang disengaja, bukan sekadar pikiran batin.
- source_word: כָּזֹאת
  choice: hal semacam ini
  rationale: Ungkapan ini menunjuk pada tindakan yang tersirat dalam perumpamaan sebelumnya; terjemahan ini wajar dalam bahasa Indonesia dan mempertahankan daya tuduhnya.
- source_word: עַל עַם אֱלֹהִים
  choice: terhadap umat Allah
  rationale: Kata depan עַל dalam konstruksi ini bernuansa merugikan atau menentang. “Terhadap” mempertahankan kemungkinan nuansa itu tanpa membuat ungkapannya lebih keras daripada bahasa Ibrani.
- source_word: וּמִדַּבֵּר הַמֶּלֶךְ הַדָּבָר הַזֶּה
  choice: Dengan mengucapkan perkataan ini, Raja
  rationale: 'Prefiks מ pada infinitif dapat dipahami secara instrumental atau sirkumstansial: melalui perkataannya sendiri, raja menempatkan dirinya dalam kedudukan orang bersalah.'
- source_word: כְּאָשֵׁם
  choice: seperti orang yang bersalah
  rationale: Prefiks כְּ menyatakan perbandingan. Terjemahan ini mempertahankan bentuk perbandingan dan tidak mengubahnya menjadi pernyataan bersalah yang lebih langsung.
- source_word: לְבִלְתִּי
  choice: karena ... tidak
  rationale: Dalam konteks ini konstruksi tersebut memberikan dasar bagi tuduhan perempuan itu; bentuk kausal ini jelas dan alami dalam bahasa Indonesia.
- source_word: הָשִׁיב
  choice: membawa pulang
  rationale: Bentuk Hifil dari שוב berarti membawa kembali atau memulihkan. Karena yang dimaksud ialah seseorang dalam pembuangan, “membawa pulang” paling konkret dan alami.
- source_word: נִדְּחוֹ
  choice: orang yang telah diasingkannya
  rationale: Partisip pasif dari נדח menunjuk kepada orang yang disingkirkan atau dibuang. Terjemahan ini mempertahankan bentuk tunggal dan kaitannya dengan raja, meski hubungan sufiksnya dijelaskan dalam catatan.
theological_decisions:
- issue: Cakupan ungkapan “umat Allah”
  choice: Mempertahankan ungkapan “umat Allah” tanpa mempersempitnya menjadi Absalom saja.
  alternative: Israel; atau Absalom dan keluarga kerajaan.
  rationale: Teks Ibrani secara eksplisit memakai עַם אֱלֹהִים. Dalam konteksnya, perlakuan raja terhadap anaknya berdampak pada umat perjanjian, tetapi terjemahan tidak perlu menyelesaikan keluasan retorika itu.
- issue: Sifat kesalahan raja dalam כְּאָשֵׁם
  choice: 'Mempertahankan perbandingan: “seperti orang yang bersalah.”'
  alternative: “Raja bersalah” atau “Raja menjadi bersalah.”
  rationale: Bahasa Ibrani memakai כְּ, sehingga ucapan perempuan itu menempatkan raja dalam posisi yang serupa dengan orang bersalah tanpa menghapus bentuk retoris perbandingannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “Raja” untuk orang kedua yang kemudian disebut sebagai raja dalam orang ketiga. Diksi dibuat lugas dan bermartabat; bentuk perbandingan serta keluasan frasa “umat Allah” dipertahankan.
