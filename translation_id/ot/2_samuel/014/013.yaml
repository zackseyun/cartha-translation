  source_fidelity: 'Terjemahan umumnya setia pada teks Ibrani: bentuk pertanyaan retoris, makna adversatif “terhadap umat Allah”, perbandingan dalam כְּאָשֵׁם, dan bentuk tunggal נִדָּחוֹ dipertahankan. Namun, “yang telah diasingkannya” menetapkan raja sebagai pelaku pengasingan secara lebih eksplisit daripada bentuk posesif Ibrani “orangnya yang terbuang”. “Membawa kembali” juga lebih netral dan lebih tepat daripada “membawa pulang”, sebab teks tidak secara eksplisit menyebut rumah atau kampung halaman.'
