translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan orang pertama dan kedua tunggal dipertahankan sesuai percakapan langsung. Susunan kutipan bertingkat dibuat jelas, sementara citra Ibrani “melihat wajah raja” dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
