  text: וַ/יֹּ֣אמֶר אַבְשָׁל֣וֹם אֶל יוֹאָ֡ב הִנֵּ֣ה שָׁלַ֣חְתִּי אֵלֶ֣י/ךָ לֵ/אמֹ֡ר בֹּ֣א הֵ֠נָּה וְ/אֶשְׁלְחָה֩ אֹתְ/ךָ֨ אֶל הַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר לָ֤/מָּה בָּ֨אתִי֙ מִ/גְּשׁ֔וּר ט֥וֹב לִ֖/י עֹ֣ד אֲנִי שָׁ֑ם וְ/עַתָּ֗ה אֶרְאֶה֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/אִם יֶשׁ בִּ֥/י עָוֺ֖ן וֶ/הֱמִתָֽ/נִי־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/032.yaml
  text: Absalom said to Joab[a], “Look, I sent word to you, saying, ‘Come here, so that I may send you to the king, to say, “Why have I come from Geshur? It would be better for me still to be there.”’ Now then, let me see the king’s face; and if there is guilt in me[b], let him put me to death.”
translation:
  language: id
  text: 'Absalom berkata kepada Yoab, “Lihatlah, aku sudah mengirim pesan kepadamu: ‘Datanglah kemari, supaya aku dapat mengutusmu kepada raja untuk berkata, “Mengapa aku datang dari Gesur? Lebih baik bagiku jika aku masih berada di sana.”[a]’ Sekarang, biarlah aku melihat wajah raja.[b] Jika aku bersalah, biarlah ia membunuhku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Seandainya aku masih di sana, itu lebih baik bagiku.” Klausa Ibraninya bersifat eliptis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melihat wajah raja,” sebuah ungkapan yang berarti menghadap atau diperkenankan hadir di hadapan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Berfungsi sebagai penanda wacana yang menarik perhatian Yoab kepada pokok keluhan Absalom; bentuk ini alami dan tetap tegas dalam bahasa Indonesia modern.
- source_word: שָׁלַחְתִּי אֵלֶיךָ
  choice: aku sudah mengirim pesan kepadamu
  rationale: Dalam konteks ini, konstruksi tersebut menunjuk pada pengiriman pesan atau panggilan, bukan pengiriman suatu benda. Kata “sudah” menandai tindakan yang telah dilakukan dan masih relevan.
- source_word: בֹּא הֵנָּה
  choice: Datanglah kemari
  rationale: Padanan langsung dan alami bagi imperatif disertai keterangan penunjuk tempat.
- source_word: וְאֶשְׁלְחָה אֹתְךָ אֶל הַמֶּלֶךְ
  choice: supaya aku dapat mengutusmu kepada raja
  rationale: Bentuk kohortatif sesudah panggilan menyatakan tujuan; “supaya” mengungkapkan hubungan itu dengan jelas.
- source_word: לָמָּה בָּאתִי מִגְּשׁוּר
  choice: Mengapa aku datang dari Gesur?
  rationale: Mempertahankan bentuk aktif orang pertama dari teks Ibrani dan keluhan Absalom mengenai kepulangannya dari Gesur, tanpa mengubahnya menjadi pasif.
- source_word: טוֹב לִי עוֹד אֲנִי שָׁם
  choice: Lebih baik bagiku jika aku masih berada di sana
  rationale: Klausa Ibrani bersifat eliptis. Terjemahan ini melengkapi perbandingan yang tersirat sambil mempertahankan unsur “masih” dan maksud Absalom bahwa tinggal di Gesur lebih baik.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari keluhan Absalom kepada tuntutannya, tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan.
- source_word: אֶרְאֶה פְּנֵי הַמֶּלֶךְ
  choice: biarlah aku melihat wajah raja
  rationale: Mempertahankan gambaran harfiah Ibrani, yang dalam konteks berarti diizinkan menghadap dan bertemu dengan raja.
- source_word: עָוֺן
  choice: bersalah
  rationale: Menyampaikan gagasan kesalahan atau culpabilitas dalam tantangan bernuansa hukum ini tanpa memakai istilah teologis yang terlalu sempit.
- source_word: וֶהֱמִתָנִי
  choice: biarlah ia menghukum mati aku
  rationale: Mengungkapkan bentuk kausatif “membuat aku mati” dengan ungkapan Indonesia yang wajar dan bernada serius, sesuai konteks keputusan raja.
