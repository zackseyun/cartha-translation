translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Urutan dialog dipertahankan, sedangkan penghubung Ibrani וַ diterjemahkan sesuai kelaziman narasi Indonesia dan tidak selalu ditampilkan sebagai ‘dan’.
