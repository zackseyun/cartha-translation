  yaml_path: translation/ot/2_samuel/014/005.yaml
  text: The king said to her[a], “What is the matter?” She said, “Indeed, I am a widow[b], and my husband has died.”
translation:
  language: id
  text: Raja berkata kepadanya, “Ada apa denganmu?” Perempuan itu menjawab, “Sungguh, aku ini seorang janda[a]; suamiku telah meninggal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aduhai, aku ini seorang janda.”
    reason: Partikel אֲבָל dapat dipahami sebagai penegasan (“sungguh”) atau, dalam konteks kesusahan perempuan itu, sebagai seruan ratapan (“aduhai”).
lexical_decisions:
- source_word: מַה לָּךְ
  choice: Ada apa denganmu?
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘apa bagimu’ dan dalam konteks menanyakan keadaan atau masalah yang sedang dihadapi seseorang. ‘Ada apa denganmu?’ alami dalam bahasa Indonesia dan mempertahankan arah pertanyaan kepada perempuan itu.
- source_word: אֲבָל
  choice: Sungguh
  rationale: Di sini partikel ini berfungsi sebagai penegasan, bukan terutama sebagai kata penghubung pertentangan ‘tetapi’. ‘Sungguh’ mempertahankan daya penegasannya; nuansa ratapan juga mungkin dan dicatat dalam catatan kaki.
- source_word: אִשָּׁה אַלְמָנָה
  choice: aku ini seorang janda
  rationale: Gabungan kata ‘perempuan’ dan ‘janda’ paling wajar diterjemahkan ‘seorang janda’. Kata ‘ini’ membantu menyampaikan penekanan pada pernyataan identitas tanpa menambahkan isi baru.
- source_word: וַיָּמָת אִישִׁי
  choice: suamiku telah meninggal
  rationale: Dalam konteks ini אִישִׁי berarti ‘suamiku’. Bentuk ‘telah meninggal’ menyatakan peristiwa kematian sekaligus akibatnya yang masih berlaku, tanpa mengubah verba menjadi pernyataan statif.
- source_word: הַמֶּלֶךְ
  choice: Raja
  rationale: Padanan langsung bagi nomina definit; dalam konteks narasi bahasa Indonesia, ‘Raja’ secara alami merujuk kepada raja yang telah diketahui.
- source_word: וַתֹּאמֶר
  choice: Perempuan itu menjawab
  rationale: Karena tuturan ini merupakan tanggapan langsung atas pertanyaan raja, ‘menjawab’ alami dalam bahasa Indonesia. Subjek eksplisit ‘perempuan itu’ memperjelas pergantian penutur.
