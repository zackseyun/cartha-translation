base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/021.yaml
  text: Then the king said to Joab[a], “Behold now, I have done this thing. Go, bring back the young man Absalom.”
translation:
  language: id
  text: Lalu raja berkata kepada Yoab, “Lihatlah, aku telah melakukan hal ini. Pergilah, bawalah pulang pemuda itu, Absalom.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara wajar dalam narasi Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar definit sumber tanpa menggantinya dengan nama pribadi.
- source_word: הִנֵּה נָא
  choice: Lihatlah, sekarang
  rationale: “Lihatlah” mempertahankan fungsi הִנֵּה sebagai penarik perhatian, sedangkan “sekarang” mencerminkan נָא dalam konteks ini tanpa memakai ungkapan arkais.
- source_word: עָשִׂיתִי אֶת־הַדָּבָר הַזֶּה
  choice: aku telah melakukan hal ini
  rationale: Mempertahankan ungkapan Ibrani yang luas dan relatif harfiah, tanpa mempersempitnya menjadi “mengabulkan permintaan ini,” meskipun makna itu tersirat oleh konteks.
- source_word: וְלֵךְ
  choice: Pergilah
  rationale: Imperatif diterjemahkan secara langsung dan alami; hubungan dengan pernyataan sebelumnya sudah jelas dari urutan kalimat.
- source_word: הָשֵׁב
  choice: bawalah pulang
  rationale: 'Bentuk hifil dari שוב bersifat kausatif: Yoab harus membuat Absalom kembali. “Bawalah pulang” menyampaikan kepulangan dari pembuangan secara alami.'
- source_word: הַנַּעַר
  choice: orang muda itu
  rationale: נַעַר dapat menunjuk anak laki-laki, pemuda, pelayan, atau orang muda. Karena Absalom sudah dewasa, pilihan ini menghindari kesan bahwa ia masih anak-anak serta mempertahankan nuansa relasional.
- source_word: אֶת אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama pribadi ditransliterasikan menurut bentuk Indonesia yang lazim; hubungan aposisional dengan “orang muda itu” dipertahankan.
