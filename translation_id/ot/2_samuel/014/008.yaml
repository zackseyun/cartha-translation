  text: Then the king said to the woman[a], “Go to your house, and I will give orders concerning you.”
translation:
  language: id
  text: Lalu raja berkata kepada perempuan itu, “Pergilah ke rumahmu. Aku akan memberikan perintah berkenaan denganmu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aku akan memberikan perintah tentang urusanmu” atau “Aku akan memberikan perintah demi kepentinganmu.” Preposisi Ibrani ini dapat dipahami lebih dari satu cara; raja akan mengeluarkan perintah yang berkenaan dengan perempuan itu atau urusannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung bagi nomina tentu; dalam bahasa Indonesia ketentuan tidak memerlukan kata sandang.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Dalam konteks, kata ini menunjuk kepada perempuan dari Tekoa yang sedang berbicara dengan Daud.
- source_word: לְכִי לְבֵיתֵךְ
  choice: Pulanglah ke rumahmu
  rationale: Imperatif feminin tunggal הָלַךְ secara harfiah berarti “pergilah”; karena tujuannya adalah rumahnya sendiri, “pulanglah” lebih alami dan tetap mempertahankan maksud sumber.
- source_word: וַאֲנִי
  choice: Aku akan
  rationale: Pronomina eksplisit memberi sedikit penekanan kepada tindakan raja; subjek “Aku” mempertahankannya secara wajar.
- source_word: אֲצַוֶּה
  choice: memberi perintah
  rationale: Bentuk piel dari צוה berarti memerintah atau memberikan perintah dan sesuai dengan kewenangan raja.
- source_word: עָלָיִךְ
  choice: mengenai perkaramu
  rationale: Dengan צוה, preposisi עַל dapat menandai orang atau urusan yang menjadi pokok perintah. “Mengenai perkaramu” menyampaikan konteks permohonan perempuan itu tanpa menyatakan secara pasti bahwa perintah tersebut demi kepentingannya.
