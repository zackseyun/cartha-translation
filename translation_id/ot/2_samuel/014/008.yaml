translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Pulanglah” dipilih agar perintah menuju rumah sendiri terdengar alami; “perkaramu” memperjelas rujukan kontekstual tanpa menghilangkan ambiguitas preposisi Ibrani, yang dicatat dalam catatan kaki.
