  naturalness: Bahasa draf umumnya baku dan alami. “Pulanglah” dapat diterima, tetapi “Pergilah ke rumahmu” lebih dekat dengan imperatif Ibrani tanpa menambahkan nuansa ‘pulang’. “Aku akan memberikan perintah berkenaan denganmu” bersifat formal tetapi tetap wajar dalam register naratif kerajaan.
  terminology: “Raja,” “perempuan itu,” dan “memberikan perintah” sesuai. Catatan kaki perlu memakai alternatif Indonesia yang lebih idiomatis dan menjelaskan bahwa frasa Ibrani dapat merujuk kepada perempuan itu atau urusannya, tanpa menjadikan ‘demi kepentinganmu’ sebagai makna utama.
