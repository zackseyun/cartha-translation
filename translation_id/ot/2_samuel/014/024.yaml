base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/014/024.yaml
  text: But the king said[a], “Let him turn aside to his own house, and let him not see my face.” So Absalom turned aside to his own house and did not see the king’s face.
translation:
  language: id
  text: Namun raja berkata, “Biarlah ia pergi ke rumahnya; ia tidak boleh menghadap aku[a].” Maka Absalom pergi ke rumahnya dan tidak menghadap raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jangan melihat wajahku” dan “tidak melihat wajah raja”; ungkapan ini berarti hadir di hadapan seseorang atau diterima untuk menghadapnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסֹּב / וַיִּסֹּב (סבב)
  choice: pulang
  rationale: Dalam konstruksi dengan אֶל־בֵּיתוֹ, verba ini menunjukkan Absalom diarahkan berbalik menuju rumahnya. “Pulang” mengungkapkan gerakan itu secara alami dalam bahasa Indonesia, dan pengulangannya dipertahankan dalam perintah serta pelaksanaannya.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Padanan langsung dan alami untuk nomina בַּיִת dengan sufiks posesif orang ketiga tunggal.
- source_word: וּפָנַי ... לֹא יִרְאֶה / וּפְנֵי הַמֶּלֶךְ לֹא רָאָה
  choice: jangan menghadap aku / tidak menghadap raja
  rationale: Secara harfiah ungkapan Ibrani berarti “jangan melihat wajahku / tidak melihat wajah raja.” Dalam konteks istana, “menghadap” secara alami menyampaikan makna hadir di hadapan raja atau diterima olehnya, sekaligus mempertahankan pengulangan ungkapan dalam kedua klausa.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan baku untuk מֶלֶךְ. Dalam bahasa Indonesia, nomina ini tidak memerlukan artikel tertentu.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw naratif dapat menyatakan urutan atau, sesuai konteks, kontras ringan. “Namun” menandai bahwa meskipun Absalom diizinkan kembali, raja tetap menolak menerimanya.
theological_decisions:
- issue: Ungkapan harfiah “melihat wajah” dibandingkan ungkapan idiomatis tentang diterima menghadap raja
  choice: Menggunakan “menghadap” dalam teks utama dan mencatat bentuk harfiahnya dalam catatan kaki
  alternative: “Jangan melihat wajahku ... tidak melihat wajah raja”
  rationale: “Menghadap” merupakan idiom Indonesia yang alami untuk hadir di hadapan seorang penguasa dan tidak menambahkan kesimpulan teologis. Catatan kaki menjaga transparansi terhadap citra konkret dan pengulangan dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Paralel antara perintah raja dan pelaksanaannya dipertahankan melalui pengulangan “pulang ke rumahnya” dan “menghadap”.
