  text: כִּ֣י הַ/מַּגִּיד֩ לִ֨/י לֵ/אמֹ֜ר הִנֵּה מֵ֣ת שָׁא֗וּל וְ/הֽוּא הָיָ֤ה כִ/מְבַשֵּׂר֙ בְּ/עֵינָ֔י/ו וָ/אֹחֲזָ֣/ה ב֔/וֹ וָ/אֶהְרְגֵ֖/הוּ בְּ/צִֽקְלָ֑ג אֲשֶׁ֥ר לְ/תִתִּ/י ל֖/וֹ בְּשֹׂרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/010.yaml
  text: When someone told me[a], saying, ‘Look, Saul is dead,’ and he thought he was bringing good news in his own eyes[b], I seized him and killed him in Ziklag—that was the reward I gave him for his news.
translation:
  language: id
  text: Ketika seseorang memberi tahu aku[a], katanya, ‘Lihat, Saul sudah mati,’ dan ia menganggap dirinya membawa kabar baik, aku menangkapnya dan membunuhnya di Ziklag. Itulah upah yang kuberikan kepadanya atas kabarnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “orang yang memberi tahu aku, ‘Lihat, Saul sudah mati,’ sedangkan dalam pandangannya sendiri ia seperti seorang pembawa kabar baik.”'
    reason: lexical_alternative
  - marker: b
    text: 'Klausa terakhir dalam bahasa Ibrani berbentuk eliptis dan kemungkinan bernada ironis: kematiannya, bukan bayaran yang diharapkannya, menjadi satu-satunya “upah” yang diterima pembawa berita itu.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam konteks ini, partikel tersebut memperkenalkan suatu kejadian khusus sebagai dasar bagi perkataan Daud; makna waktu-keadaan paling alami dinyatakan dengan ‘Ketika’.
- source_word: הַמַּגִּיד לִי לֵאמֹר
  choice: seseorang memberi tahu aku, katanya
  rationale: Partisipel berartikel secara harfiah berarti ‘orang yang memberi tahu aku’. ‘Seseorang memberi tahu aku’ alami dalam bahasa Indonesia, sedangkan ‘katanya’ mempertahankan pengantar ujaran langsung.
- source_word: הִנֵּה מֵת שָׁאוּל
  choice: ‘Lihat, Saul sudah mati,’
  rationale: הִנֵּה berfungsi menarik perhatian dan wajar diterjemahkan ‘Lihat’. Bentuk מֵת menyatakan keadaan/hasil, yang tersampaikan dengan ‘sudah mati’.
- source_word: וְהוּא הָיָה כִמְבַשֵּׂר בְּעֵינָיו
  choice: dan ia menganggap dirinya membawa kabar baik
  rationale: Secara harfiah, orang itu ‘seperti pembawa kabar baik dalam pandangannya sendiri’. Ungkapan ‘menganggap dirinya’ menyampaikan idiom בְּעֵינָיו secara alami tanpa menghilangkan bahwa penilaian itu berasal dari si pembawa berita.
- source_word: וָאֹחֲזָה בוֹ
  choice: aku menangkapnya
  rationale: Kata אָחַז berarti memegang atau menangkap dengan kuat; ‘menangkapnya’ sesuai dengan tindakan Daud terhadap orang itu.
- source_word: וָאֶהְרְגֵהוּ
  choice: dan membunuhnya
  rationale: Kata kerja ini secara langsung berarti membunuh; terjemahan tersebut tidak menambahkan nuansa yudisial yang tidak dinyatakan secara eksplisit.
- source_word: בְּצִקְלָג
  choice: di Ziklag
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: אֲשֶׁר לְתִתִּי לוֹ בְּשֹׂרָה
  choice: Itulah upah yang kuberikan kepadanya atas kabarnya
  rationale: Klausa Ibrani bersifat eliptis dan ironis. בְּשֹׂרָה dapat berkaitan dengan kabar baik maupun imbalan bagi pembawa kabar. ‘Upah ... atas kabarnya’ membuat ironi dapat dipahami tanpa mengubah hukuman mati menjadi kabar baik yang Daud berikan.
