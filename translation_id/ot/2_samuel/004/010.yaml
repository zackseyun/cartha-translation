translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk ‘aku’ dan akhiran ‘-ku’ dipakai karena Daud berbicara langsung. Susunan dibuat alami sambil mempertahankan ironi dan ketidaklengkapan tersirat pada klausa penutup Ibrani.
