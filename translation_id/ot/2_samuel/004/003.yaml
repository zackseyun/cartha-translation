translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama tempat ditransliterasikan sebagai Beerot dan Gitaim. Pilihan 'pendatang' mudah dipahami pembaca umum sekaligus menjaga nuansa sosial גָּרִים sebagai orang yang bermukim di luar komunitas asalnya.
