  text: But the Beerothites fled to Gittaim and have lived there as sojourners to this day[a].
translation:
  language: id
  text: Orang-orang Beerot melarikan diri ke Gitaim dan tinggal di sana sebagai pendatang sampai hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tinggal di sana sebagai penduduk pendatang sampai hari ini.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיִּבְרְחוּ
  choice: melarikan diri
  rationale: Bentuk Qal dari ברח menyatakan tindakan melarikan diri. Bentuk lampau dipahami dari konteks narasi tanpa perlu penanda aspektual tambahan dalam bahasa Indonesia.
- source_word: הַבְּאֵרֹתִים
  choice: Orang-orang Beerot
  rationale: Bentuk gentilik jamak ini menunjuk kepada penduduk atau kelompok yang berasal dari Beerot; ungkapan ini lebih alami daripada membentuk nama etnis baru dalam bahasa Indonesia.
- source_word: גִּתָּיְמָה
  choice: ke Gitaim
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Gitaim, yang secara alami diterjemahkan dengan preposisi 'ke'.
- source_word: וַיִּהְיוּ שָׁם
  choice: menetap di sana
  rationale: Secara harfiah berarti 'berada di sana', tetapi bersama גָּרִים dan keterangan waktu sampai hari ini, frasa ini menggambarkan keadaan bermukim yang berlanjut.
- source_word: גָּרִים
  choice: sebagai pendatang
  rationale: Kata ini menunjuk pada orang yang tinggal di tengah masyarakat yang bukan komunitas asalnya. 'Pendatang' mempertahankan nuansa bukan penduduk asli tanpa kesan bahwa keberadaan mereka pasti hanya sementara.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan idiomatis baku untuk ungkapan Ibrani yang menyatakan kelanjutan hingga masa pencerita.
- source_word: וַ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan dua tindakan dalam keterangan latar ini. 'Dan' mempertahankan hubungan dasar tanpa menambahkan kontras yang tidak dinyatakan secara tegas.
