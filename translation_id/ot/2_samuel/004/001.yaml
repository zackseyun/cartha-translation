  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע בֶּן שָׁא֗וּל כִּ֣י מֵ֤ת אַבְנֵר֙ בְּ/חֶבְר֔וֹן וַ/יִּרְפּ֖וּ יָדָ֑י/ו וְ/כָל יִשְׂרָאֵ֖ל נִבְהָֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/001.yaml
  text: When Saul’s son heard that Abner had died in Hebron[a], his hands became weak, and all Israel was alarmed.
translation:
  language: id
  text: Ketika anak Saul mendengar bahwa Abner telah mati di Hebron, kedua tangannya menjadi lemah[a], dan seluruh Israel menjadi gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kedua tangannya menjadi lemah,” sebuah ungkapan untuk kehilangan kekuatan atau keberanian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן שָׁאוּל
  choice: anak Saul
  rationale: Mempertahankan penyebutan tidak langsung dalam teks Ibrani tanpa menambahkan nama Isyboset yang tidak muncul dalam ayat ini.
- source_word: כִּי מֵת אַבְנֵר
  choice: bahwa Abner telah mati
  rationale: כִּי memperkenalkan isi kabar yang didengar, sedangkan bentuk perfek מֵת menyatakan kematian yang telah terjadi sebelum kabar itu didengar.
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Mewakili pemakaian lokatif biasa dari preposisi בְּ dengan nama tempat.
- source_word: וַיִּרְפּוּ יָדָיו
  choice: kedua tangannya menjadi lemah
  rationale: Mempertahankan metafora jasmani dari ungkapan Ibrani, termasuk bentuk jamak 'tangan', sambil menjelaskan melalui catatan kaki bahwa ungkapan itu menunjuk pada hilangnya kekuatan atau keberanian.
- source_word: כָל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan sebutan kolektif nasional sebagaimana dalam teks sumber.
- source_word: נִבְהָלוּ
  choice: menjadi gentar
  rationale: Mengungkapkan keadaan terguncang, cemas, atau kehilangan ketenangan tanpa mempersempit maknanya menjadi rasa takut yang ekstrem.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan “Ketika ... mendengar bahwa ...”, sementara metafora Ibrani dipertahankan dalam teks dan diterangkan dalam catatan kaki. Penanda catatan ditempatkan sesudah ungkapan yang dijelaskannya, bukan sesudah “Hebron”.
