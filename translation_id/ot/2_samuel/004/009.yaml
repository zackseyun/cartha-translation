base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/009.yaml
  text: But David answered Rekab and Baanah his brother[a], the sons of Rimmon the Beerothite, and said to them, “As Yahweh lives, who has redeemed my life out of every distress,
translation:
  language: id
  text: Tetapi Daud menjawab Rekab dan Baana, saudaranya, putra-putra Rimon, seorang Beerot, dan berkata kepada mereka, “Demi Yahweh[a] yang hidup, yang telah menebus hidupku dari segala kesesakan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang sering ditransliterasikan “Yahweh”; banyak terjemahan menuliskannya “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan konvensi penerjemahan tanpa menyatakan pelafalan kuno sebagai kepastian.
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Kata ענה dalam bentuk naratif ini lazim memperkenalkan jawaban dalam percakapan; “menjawab” mempertahankan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: רֵכָב וְאֶת־בַּעֲנָה אָחִיו
  choice: Rekab dan Baana, saudaranya
  rationale: Nama-nama diri ditransliterasikan. Bentuk tunggal אָחִיו paling wajar menyatakan bahwa Baana adalah saudara Rekab.
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: anak-anak Rimon, orang Beerot itu
  rationale: Ungkapan ini menyebut mereka sebagai putra-putra Rimon dan mengidentifikasi Rimon sebagai orang Beerot. Susunan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Ini merupakan rumusan sumpah yang khidmat. “Demi ... yang hidup” menyampaikan fungsi idiom Ibrani secara alami tanpa menghilangkan penegasan bahwa Yahweh hidup.
- source_word: פָּדָה
  choice: telah menebus
  rationale: פדה menyatakan pembebasan dengan nuansa penebusan; “telah menebus” mempertahankan bobot leksikalnya dan relevansi tindakan itu bagi keadaan Daud sekarang.
- source_word: נַפְשִׁי
  choice: hidupku
  rationale: נפש di sini menunjuk pada nyawa atau diri Daud yang terancam, bukan secara khusus unsur rohani yang terpisah dari tubuh.
- source_word: מִכָּל־צָרָה
  choice: dari setiap kesesakan
  rationale: צָרָה berarti kesusahan, tekanan, atau kesesakan. “Setiap kesesakan” mempertahankan cakupan כָּל dan cocok dengan konteks pembebasan Daud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi YHWH. Bentuk “Yahweh” mempertahankan nama pribadi itu, sementara catatan kaki mengakui konvensi terjemahan lain dan ketidakpastian pelafalan kunonya.
- issue: Makna נַפְשִׁי
  choice: hidupku
  alternative: jiwaku; diriku
  rationale: Dalam konteks Daud dilepaskan dari bahaya, istilah tersebut terutama berarti hidup atau nyawanya. Pilihan ini menghindari pemaksaan antropologi dualistis ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Pengulangan formula Ibrani “menjawab ... dan berkata kepada mereka” dipertahankan, tetapi dibagi menjadi dua kalimat agar alami. Tanda koma penutup dipertahankan karena sumpah Daud berlanjut ke ayat berikutnya.
