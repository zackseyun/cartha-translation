base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/007.yaml
  text: They came into the house while he was lying on his bed in his bedroom[a], and they struck him and put him to death. Then they removed his head, took his head[c][b], and went by way of the Arabah all night.
translation:
  language: id
  text: Mereka masuk ke dalam rumah itu ketika ia sedang berbaring di tempat tidurnya, di kamar tidurnya[a]. Mereka memukulnya dan membunuhnya. Kemudian mereka memenggal kepalanya[b], mengambil kepalanya, lalu menempuh perjalanan melalui Araba[c] sepanjang malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kamar tempat ia tidur.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani secara harfiah berarti “menyingkirkan” atau “mengambil”; dalam konteks ini, kata itu menunjuk pada pemenggalan.
    reason: lexical_alternative
  - marker: c
    text: Araba adalah kawasan lembah retakan dan dataran yang mencakup daerah Lembah Yordan; teks Ibrani memakai nama geografis.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ הַבַּיִת
  choice: Mereka masuk ke dalam rumah
  rationale: Kata kerja בוא dengan הַבַּיִת menyatakan gerak masuk; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gerak naratif.
- source_word: וְהוּא שֹׁכֵב עַל מִטָּתוֹ
  choice: ketika Isyboset sedang berbaring di tempat tidurnya
  rationale: Klausa ini bersifat sirkumstansial. Nama Isyboset dijelaskan dari konteks agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: בַּחֲדַר מִשְׁכָּבוֹ
  choice: di kamar tidurnya
  rationale: Secara harfiah menunjuk pada kamar tempat ia berbaring atau tidur; 'kamar tidur' merupakan padanan modern yang wajar.
- source_word: וַיַּכֻּהוּ וַיְמִתֻהוּ
  choice: Mereka memukul dia dan membunuhnya
  rationale: 'Dua verba Ibrani dipertahankan sebagai dua tindakan: נכה berarti memukul atau menghantam, sedangkan bentuk kausatif מות berarti menyebabkan mati. ''Membunuhnya'' alami dan tepat bagi verba kedua.'
- source_word: וַיָּסִירוּ אֶת רֹאשׁוֹ
  choice: mereka memenggal kepalanya
  rationale: Verba Hifil סור secara leksikal berarti menyingkirkan atau melepaskan; dalam konteks kepala dari tubuh, 'memenggal' menyampaikan tindakan yang tersirat dengan jelas. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: וַיִּקְחוּ אֶת רֹאשׁוֹ
  choice: membawa kepalanya
  rationale: לקח berarti mengambil; dalam rangkaian perjalanan, 'membawa' menyatakan bahwa kepala itu mereka bawa serta, sambil mempertahankan pengulangan 'kepalanya' dari teks Ibrani.
- source_word: וַיֵּלְכוּ דֶּרֶךְ הָעֲרָבָה
  choice: berjalan melalui Araba
  rationale: דֶּרֶךְ diikuti nama tempat menyatakan rute. 'Melalui Araba' alami dalam bahasa Indonesia dan mempertahankan nama geografis.
- source_word: כָּל הַלָּיְלָה
  choice: sepanjang malam
  rationale: Padanan idiomatis langsung untuk durasi seluruh malam.
