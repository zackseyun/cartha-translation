  register: Bahasa naratif modern, lugas, dan bermartabat. Urutan dua tindakan para pelaku dipertahankan, sedangkan idiom istirahat tengah hari dijelaskan secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
