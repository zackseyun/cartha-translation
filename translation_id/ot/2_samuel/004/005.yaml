  text: וַ/יֵּ֨לְכ֜וּ בְּנֵֽי רִמּ֤וֹן הַ/בְּאֵֽרֹתִי֙ רֵכָ֣ב וּ/בַעֲנָ֔ה וַ/יָּבֹ֨אוּ֙ כְּ/חֹ֣ם הַ/יּ֔וֹם אֶל בֵּ֖ית אִ֣ישׁ בֹּ֑שֶׁת וְ/ה֣וּא שֹׁכֵ֔ב אֵ֖ת מִשְׁכַּ֥ב הַֽ/צָּהֳרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/005.yaml
  text: The sons of Rimmon the Beerothite[a], Rekab and Baanah, went and came to the house of Ish-bosheth in the heat of the day[b], while he was lying down for his midday rest.
translation:
  language: id
  text: Rekab dan Baana, putra-putra Rimon, orang Beerot itu, pergi lalu tiba di rumah Isyboset pada waktu hari sedang panas-panasnya, sementara Isyboset sedang berbaring untuk beristirahat pada tengah hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbaring pada tengah hari,” yaitu beristirahat pada tengah hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רִמּוֹן הַבְּאֵרֹתִי
  choice: anak-anak Rimon, orang Beerot itu
  rationale: בְּנֵי secara harfiah berarti 'anak-anak lelaki' dan dalam konteks ini Rekab serta Baana disebut sebagai anak Rimon; nisba הַבְּאֵרֹתִי diterjemahkan secara alami sebagai 'orang Beerot itu'.
- source_word: רֵכָב וּבַעֲנָה
  choice: Rekab dan Baana
  rationale: Nama-nama ditransliterasikan secara dekat dan wajar dalam ejaan Indonesia; huruf ayin pada akhir בַּעֲנָה tidak perlu ditandai dalam teks umum.
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: pergi dan tiba
  rationale: Dua verba gerak dalam rangkaian naratif dipertahankan. 'Tiba' lebih alami daripada pengulangan 'pergi dan datang' dalam bahasa Indonesia, tanpa menambahkan gagasan bahwa mereka sudah memasuki rumah.
- source_word: כְּחֹם הַיּוֹם
  choice: pada saat hari sedang panas-panasnya
  rationale: Ungkapan ini menunjuk pada waktu ketika panas hari mencapai puncaknya. Terjemahan ini alami dan mempertahankan gambaran panas tanpa menyederhanakannya menjadi sekadar 'siang hari'.
- source_word: בֵּית אִישׁ־בֹּשֶׁת
  choice: rumah Isyboset
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung sebagai kepemilikan; nama pribadi ditransliterasikan, bukan diterjemahkan.
- source_word: וְהוּא שֹׁכֵב אֵת מִשְׁכַּב הַצָּהֳרָיִם
  choice: Ketika itu Isyboset sedang berbaring untuk beristirahat pada tengah hari
  rationale: Klausa ini menyatakan keadaan Isyboset saat mereka tiba. Ungkapan harfiah 'berbaringnya tengah hari' dijadikan bahasa Indonesia yang wajar tanpa mempersempit maknanya menjadi 'tidur siang'.
