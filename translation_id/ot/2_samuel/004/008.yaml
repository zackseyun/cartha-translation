source:
  edition: WLC
  text: וַ֠/יָּבִאוּ אֶת רֹ֨אשׁ אִֽישׁ בֹּ֥שֶׁת אֶל דָּוִד֮ חֶבְרוֹן֒ וַ/יֹּֽאמְרוּ֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּֽה רֹ֣אשׁ אִֽישׁ בֹּ֗שֶׁת בֶּן שָׁאוּל֙ אֹֽיִבְ/ךָ֔ אֲשֶׁ֥ר בִּקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וַ/יִּתֵּ֣ן יְ֠הוָה לַֽ/אדֹנִ֨/י הַ/מֶּ֤לֶךְ נְקָמוֹת֙ הַ/יּ֣וֹם הַ/זֶּ֔ה מִ/שָּׁא֖וּל וּ/מִ/זַּרְעֽ/וֹ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/008.yaml
  text: They brought the head of Ish-bosheth to David at Hebron[a], and said to the king, “Here is the head of Ish-bosheth son of Saul, your enemy, who sought your life. Yahweh has given my lord the king vengeance today on Saul and on his offspring.”
translation:
  language: id
  text: Mereka membawa kepala Isyboset kepada Daud di Hebron, lalu berkata kepada raja, “Inilah kepala Isyboset, anak Saul, musuhmu yang berusaha mencabut nyawamu. Pada hari ini Yahweh telah memberikan kepada tuanku, raja, pembalasan[a] terhadap Saul dan keturunannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pembalasan-pembalasan” (bentuk jamak), yang dapat berfungsi sebagai bentuk intensif dengan arti “pembalasan” atau “tindakan-tindakan pembalasan.”
    reason: Menjelaskan bentuk jamak Ibrani נְקָמוֹת yang diterjemahkan dengan nomina tunggal kolektif dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: Mereka membawa
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Kata penghubung awal tidak dinyatakan agar narasi Indonesia mengalir alami tanpa menghilangkan urutan tindakan.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Konteks menunjukkan kepala secara fisik, bukan penggunaan metaforis.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isyboset
  rationale: Nama pribadi mengikuti bentuk Masoret dalam ayat ini dan disesuaikan dengan ejaan Indonesia.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Menggunakan bentuk baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: וַיֹּאמְרוּ אֶל הַמֶּלֶךְ
  choice: lalu berkata kepada raja
  rationale: Menyampaikan kelanjutan tindakan dan pengantar ujaran langsung secara alami; subjek jamak tetap dipahami dari kalimat sebelumnya.
- source_word: הִנֵּה
  choice: Inilah
  rationale: Mempertahankan fungsi penunjukan langsung dalam bentuk Indonesia yang modern dan wajar.
- source_word: אֹיִבְךָ
  choice: musuhmu
  rationale: Padanan langsung bagi nomina dengan akhiran orang kedua tunggal.
- source_word: בִּקֵּשׁ אֶת נַפְשֶׁךָ
  choice: berusaha mencabut nyawamu
  rationale: Ungkapan Ibrani berarti berupaya mengambil nyawa seseorang. Pilihan ini jelas dalam bahasa Indonesia dan tetap mempertahankan unsur 'nyawa'.
- source_word: וַיִּתֵּן יְהוָה
  choice: Yahweh telah memberikan
  rationale: Bentuk tindakan selesai disampaikan sebagai peristiwa lampau dengan hasil yang kini mereka tunjukkan; nama ilahi ditransliterasikan sebagai Yahweh.
- source_word: לַאדֹנִי הַמֶּלֶךְ
  choice: kepada tuanku raja
  rationale: Mempertahankan sapaan istana dengan akhiran orang pertama tunggal dan membedakan tuan manusia dari nama ilahi.
- source_word: נְקָמוֹת
  choice: pembalasan
  rationale: Bentuk sumber adalah jamak, tetapi di sini berfungsi intensif atau menunjuk tindakan-tindakan pembalasan; bentuk tunggal kolektif lebih alami dalam bahasa Indonesia, dengan bentuk Ibrani dijelaskan dalam catatan kaki.
- source_word: מִשָּׁאוּל וּמִזַּרְעוֹ
  choice: terhadap Saul dan keturunannya
  rationale: Preposisi מן setelah nomina pembalasan dipahami sebagai sasaran pembalasan; זֶרַע merupakan nomina kolektif bagi keturunan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. Transliterasi Yahweh mempertahankan nama itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Status klaim para pembunuh bahwa Yahweh memberikan pembalasan
  choice: Dipertahankan sebagai klaim dalam ujaran langsung tanpa penilaian tambahan
  alternative: Menambahkan kata yang menandai bahwa persetujuan ilahi itu hanya dugaan atau klaim palsu
  rationale: Ayat ini melaporkan perkataan mereka, bukan komentar eksplisit narator. Penilaian terhadap klaim tersebut muncul dari konteks berikutnya dan tidak boleh dimasukkan ke dalam terjemahan ayat ini.
- issue: Cakupan pembalasan terhadap Saul dan keturunannya
  choice: Mempertahankan frasa “terhadap Saul dan keturunannya” tanpa memperhalus ketegangan teologisnya
  alternative: Mengubahnya menjadi pembalasan hanya terhadap Saul atau hanya terhadap Isyboset
  rationale: Ujaran para pembunuh secara eksplisit mencakup Saul dan keturunannya; terjemahan tidak menyempitkan atau mengesahkan klaim mereka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan ujaran istana, nama ilahi, dan ketegangan bahwa pernyataan tentang pembalasan berasal dari para pembunuh.
