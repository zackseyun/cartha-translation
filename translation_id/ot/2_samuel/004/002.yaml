translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat Ibrani yang panjang dibagi agar mudah dipahami. Istilah militer diterjemahkan secara fungsional, sedangkan nama orang dan tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
