  text: וּ/שְׁנֵ֣י אֲנָשִׁ֣ים שָׂרֵֽי גְדוּדִ֣ים הָי֪וּ בֶן שָׁא֟וּל שֵׁם֩ הָ/אֶחָ֨ד בַּֽעֲנָ֜ה וְ/שֵׁ֧ם הַ/שֵּׁנִ֣י רֵכָ֗ב בְּנֵ֛י רִמּ֥וֹן הַ/בְּאֶֽרֹתִ֖י מִ/בְּנֵ֣י בִנְיָמִ֑ן כִּ֚י גַּם בְּאֵר֔וֹת תֵּחָשֵׁ֖ב עַל בִּנְיָמִֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/002.yaml
  text: 'Saul’s son had two men who were commanders of raiding bands: the name of the one was Baanah[a], and the name of the second was Rechab, sons of Rimmon the Beerothite, from the sons of Benjamin; for Beeroth also was considered part of Benjamin.'
translation:
  language: id
  text: Anak Saul mempunyai dua orang yang menjadi pemimpin pasukan penyerbu. Yang seorang bernama Baana, dan yang kedua bernama Rekhab. Mereka adalah anak-anak Rimon, orang Beerot, dari keturunan Benyamin, sebab Beerot juga diperhitungkan sebagai bagian dari Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dianggap termasuk Benyamin.”
    reason: Menjaga alternatif untuk תֵּחָשֵׁב עַל־בִּנְיָמִן, yang dapat menyatakan bahwa Beerot dianggap termasuk atau berafiliasi dengan Benyamin.
lexical_decisions:
- source_word: שְׁנֵי אֲנָשִׁים
  choice: dua orang
  rationale: Ungkapan ini menunjuk kepada dua laki-laki; dalam bahasa Indonesia, “dua orang” paling alami karena identitas mereka segera disebutkan.
- source_word: שָׂרֵי גְדוּדִים
  choice: pemimpin pasukan penyerbu
  rationale: שָׂרֵי berarti para pemimpin atau komandan, sedangkan גְדוּדִים dalam konteks ini menunjuk pada kelompok bersenjata yang melakukan penyerbuan, bukan semata-mata satuan tentara resmi.
- source_word: בֶן שָׁאוּל
  choice: Anak Saul
  rationale: Frasa konstruk tunggal ini mengacu kepada Isyboset dari konteks sebelumnya; nama tidak ditambahkan agar terjemahan tetap mengikuti bentuk sumber.
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: Yang seorang bernama ... dan yang kedua bernama
  rationale: Menyampaikan rumusan penamaan Ibrani secara alami sambil mempertahankan pembedaan “yang seorang” dan “yang kedua”.
- source_word: בְּנֵי רִמּוֹן
  choice: anak-anak Rimon
  rationale: Mempertahankan keterangan hubungan keturunan langsung bagi Baana dan Rekhab.
- source_word: הַבְּאֶרֹתִי
  choice: orang Beerot
  rationale: Adjektiva gentilika ini menyatakan asal atau identitas Rimon sebagai orang dari Beerot; bentuk ini lebih wajar dalam bahasa Indonesia daripada transliterasi gentilika.
- source_word: מִבְּנֵי בִנְיָמִן
  choice: dari keturunan Benyamin
  rationale: Idiom “anak-anak Benyamin” diungkapkan sebagai keturunan atau anggota suku Benyamin dalam bahasa Indonesia modern.
- source_word: כִּי גַּם
  choice: sebab ... juga
  rationale: Menandai klausa penjelas yang menerangkan mengapa orang Beerot dapat disebut berasal dari keturunan Benyamin.
- source_word: תֵּחָשֵׁב עַל בִּנְיָמִן
  choice: dianggap termasuk wilayah Benyamin
  rationale: Bentuk pasif חשׁב menyatakan bahwa Beerot diperhitungkan atau dipandang berafiliasi dengan Benyamin; “wilayah” memperjelas bahwa Beerot adalah tempat, tanpa mengubah afiliasi kesukuannya.
