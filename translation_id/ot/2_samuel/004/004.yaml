  text: וְ/לִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל בֵּ֖ן נְכֵ֣ה רַגְלָ֑יִם בֶּן חָמֵ֣שׁ שָׁנִ֣ים הָיָ֡ה בְּ/בֹ֣א שְׁמֻעַת֩ שָׁא֨וּל וִ/יהֽוֹנָתָ֜ן מִֽ/יִּזְרְעֶ֗אל וַ/תִּשָּׂאֵ֤/הוּ אֹֽמַנְתּ/וֹ֙ וַ/תָּנֹ֔ס וַ/יְהִ֞י בְּ/חָפְזָ֥/הּ לָ/נ֛וּס וַ/יִּפֹּ֥ל וַ/יִּפָּסֵ֖חַ וּ/שְׁמ֥/וֹ מְפִיבֹֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/004.yaml
  text: Jonathan son of Saul had a son crippled in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel[a], and his nurse picked him up and fled. And as she hurried to flee, he fell and became lame. His name was Mephibosheth.
translation:
  language: id
  text: Yonatan anak Saul mempunyai seorang anak laki-laki yang cacat pada kedua kakinya.[a] Anak itu berumur lima tahun ketika kabar tentang Saul dan Yonatan datang dari Yizreel. Pengasuhnya mengangkatnya lalu melarikan diri. Dalam ketergesaannya untuk melarikan diri, anak itu jatuh dan menjadi timpang. Namanya Mefiboset.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini berarti “terkena pada kedua kaki”; dapat juga diterjemahkan “timpang pada kedua kakinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכֵה רַגְלָיִם
  choice: yang kedua kakinya cacat
  rationale: Ungkapan ini secara harfiah menggambarkan orang yang terkena gangguan pada kaki. Bentuk dual רַגְלָיִם menunjuk pada kedua kaki; 'cacat' menyatakan keterbatasan fisik secara ringkas tanpa menentukan keadaan medis yang tidak dijelaskan teks.
- source_word: בֶּן חָמֵשׁ שָׁנִים
  choice: berumur lima tahun
  rationale: Padanan usia yang alami dalam bahasa Indonesia modern dan tepat menyampaikan arti ungkapan Ibrani.
- source_word: בְּבֹא שְׁמֻעַת שָׁאוּל וִיהוֹנָתָן
  choice: ketika kabar tentang Saul dan Yonatan datang
  rationale: Konstruksi infinitif dengan בְּ diterjemahkan sebagai klausa waktu. 'Tentang' mempertahankan ketidakjelasan isi kabar tanpa secara eksplisit menambahkan bahwa mereka telah tewas.
- source_word: מִיִּזְרְעֶאל
  choice: dari Yizreel
  rationale: Menyatakan asal datangnya kabar secara langsung; 'Yizreel' mengikuti transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
- source_word: אֹמַנְתּוֹ
  choice: pengasuhnya
  rationale: Kata ini menunjuk kepada perempuan yang mengasuh dan membesarkan anak; 'pengasuh' lebih jelas bagi pembaca Indonesia modern daripada istilah yang dapat disalahpahami sebagai perawat medis.
- source_word: וַתִּשָּׂאֵהוּ
  choice: mengangkat dia
  rationale: Menjaga arti dasar tindakan mengangkat atau membawa anak itu sebelum melarikan diri.
- source_word: וַתָּנֹס
  choice: lalu melarikan diri
  rationale: Menyampaikan urutan naratif dan arti tindakan melarikan diri tanpa menambahkan bahwa pelarian itu berhasil.
- source_word: בְּחָפְזָהּ לָנוּס
  choice: ketika pengasuhnya bergegas melarikan diri
  rationale: Menyampaikan keadaan tergesa-gesa dan tujuan pelarian. Subjek nomina diulang demi kejelasan dalam bahasa Indonesia.
- source_word: וַיִּפֹּל
  choice: anak itu terjatuh
  rationale: Bentuk maskulin tunggal menunjuk kepada anak tersebut, bukan pengasuh perempuan; subjek dibuat eksplisit agar tidak ambigu dalam bahasa Indonesia.
- source_word: וַיִּפָּסֵחַ
  choice: menjadi timpang
  rationale: Menyampaikan perubahan keadaan sebagai akibat jatuh, sesuai nuansa verba Ibrani.
