  text: וְ֠/הֵנָּה בָּ֜אוּ עַד תּ֤וֹךְ הַ/בַּ֨יִת֙ לֹקְחֵ֣י חִטִּ֔ים וַ/יַּכֻּ֖/הוּ אֶל הַ/חֹ֑מֶשׁ וְ/רֵכָ֛ב וּ/בַעֲנָ֥ה אָחִ֖י/ו נִמְלָֽטוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/006.yaml
  text: And there they came into the midst of the house[a], taking wheat, and they struck him in the belly. Then Rekab and Baanah his brother escaped.
translation:
  language: id
  text: Mereka pun masuk sampai ke bagian dalam rumah itu untuk mengambil gandum, lalu menghantam perutnya[a]. Kemudian Rekhab dan Baana, saudaranya, meloloskan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional juga diterjemahkan “di bawah rusuk kelima”. Ungkapan Ibrani ini kemungkinan besar menunjuk secara lebih umum pada daerah perut atau abdomen.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵנָּה
  choice: Mereka pun
  rationale: Gabungan penghubung dan penunjuk ini menggerakkan narasi ke tindakan berikutnya. Partikel “pun” menyampaikan perkembangan itu secara alami tanpa memakai seruan arkais seperti “lihatlah”.
- source_word: בָּאוּ עַד תּוֹךְ הַבַּיִת
  choice: masuk sampai ke bagian dalam rumah itu
  rationale: בָּאוּ menyatakan gerak masuk dalam konteks ini, sedangkan עַד תּוֹךְ menekankan bahwa mereka mencapai bagian interior rumah, bukan sekadar ambangnya.
- source_word: לֹקְחֵי חִטִּים
  choice: untuk mengambil gandum
  rationale: Frasa partisipial ini eliptis. Terjemahan ini wajar dalam bahasa Indonesia dan tetap membiarkan terbuka apakah mengambil gandum merupakan tujuan nyata atau dalih untuk masuk; unsur penipuan tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: וַיַּכֻּהוּ
  choice: lalu menghantam ...-nya
  rationale: נכה pada dasarnya berarti memukul atau menghantam. Pilihan ini mempertahankan tindakan kekerasan yang dinyatakan teks tanpa menggantinya dengan akibatnya, yaitu membunuh, atau menambahkan senjata tertentu.
- source_word: אֶל הַחֹמֶשׁ
  choice: perutnya
  rationale: חֹמֶשׁ menunjuk daerah perut atau abdomen. Bentuk dengan sufiks milik menghasilkan ungkapan Indonesia yang alami, “menghantam perutnya”.
- source_word: וְרֵכָב וּבַעֲנָה אָחִיו
  choice: Kemudian Rekhab dan Baana, saudaranya
  rationale: Konjungsi dialihkan menjadi “Kemudian” agar urutan narasi jelas. אָחִיו menerangkan Baana sebagai saudara Rekhab; koma membantu mencegah kekaburan dalam bahasa Indonesia.
- source_word: נִמְלָטוּ
  choice: meloloskan diri
  rationale: Bentuk Nifal dari מלט menyatakan berhasil luput atau melarikan diri. “Meloloskan diri” menampilkan keberhasilan tersebut secara jelas.
theological_decisions: []
