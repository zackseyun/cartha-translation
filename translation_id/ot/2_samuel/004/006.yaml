  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Ejaan nama “Rekhab” dan “Baana” dipakai sebagai transliterasi yang mudah dibaca. Penanda catatan kaki ditempatkan langsung sesudah kata yang diterangkannya.
