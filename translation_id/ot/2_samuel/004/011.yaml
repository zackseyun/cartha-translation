  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֞ף כִּֽי אֲנָשִׁ֣ים רְשָׁעִ֗ים הָרְג֧וּ אֶת אִישׁ צַדִּ֛יק בְּ/בֵית֖/וֹ עַל מִשְׁכָּב֑/וֹ וְ/עַתָּ֗ה הֲ/ל֨וֹא אֲבַקֵּ֤שׁ אֶת דָּמ/וֹ֙ מִ/יֶּדְ/כֶ֔ם וּ/בִעַרְתִּ֥י אֶתְ/כֶ֖ם מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/011.yaml
  text: How much more[a], when wicked men have killed a righteous man in his own house on his bed[b], should I not now require his blood from your hand and purge you from the land?
translation:
  language: id
  text: Terlebih lagi, jika orang-orang fasik telah membunuh orang benar di rumahnya sendiri, di atas tempat tidurnya, bukankah sekarang aku harus menuntut darahnya dari tangan kalian[a] dan melenyapkan kalian dari negeri ini?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti “menuntut darahnya dari tangan kalian,” yaitu meminta pertanggungjawaban kalian atas penumpahan darahnya.
    reason: lexical_alternative
  - marker: b
    text: “Melenyapkan kalian dari negeri ini” berarti menyingkirkan para pembunuh melalui penghukuman, bukan sekadar melakukan pemurnian ritual.
    reason: cultural_note
lexical_decisions:
- source_word: אַף כִּי
  choice: Terlebih lagi, ketika
  rationale: Ungkapan ini melanjutkan penalaran dari perkara yang lebih ringan pada ayat sebelumnya kepada perkara yang lebih berat dalam ayat ini.
- source_word: אֲנָשִׁים רְשָׁעִים
  choice: orang-orang fasik
  rationale: Menjaga kecaman moral yang tegas dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הָרְגוּ
  choice: membunuh
  rationale: Menerjemahkan verba umum untuk membunuh tanpa memasukkan nuansa leksikal yang lebih khusus, meskipun konteks menunjukkan pembunuhan keji.
- source_word: אִישׁ צַדִּיק
  choice: seorang yang benar
  rationale: Mempertahankan nilai dasar צַדִּיק serta implikasi kontekstual bahwa korban tidak patut dibunuh secara demikian.
- source_word: בְּבֵיתוֹ עַל מִשְׁכָּבוֹ
  choice: di rumahnya sendiri, di atas tempat tidurnya
  rationale: Menyatakan lokasi secara langsung dan menonjolkan kekejian pembunuhan terhadap korban di ruang pribadinya.
- source_word: הֲלוֹא אֲבַקֵּשׁ אֶת דָּמוֹ מִיֶּדְכֶם
  choice: bukankah aku harus menuntut darahnya dari tangan kalian
  rationale: Mempertahankan ungkapan hukum Ibrani yang konkret tentang pertanggungjawaban atas penumpahan darah; catatan kaki menjelaskan maknanya.
- source_word: וּבִעַרְתִּי אֶתְכֶם מִן הָאָרֶץ
  choice: dan melenyapkan kalian dari negeri ini
  rationale: Mengungkapkan penyingkiran melalui penghukuman, bukan sekadar perpindahan tempat atau tindakan pemurnian ritual.
theological_decisions:
- issue: Apakah ungkapan hukum tentang darah harus diperjelas sebagai pembalasan atau dipertahankan dalam bentuk idiom Ibrani
  choice: Mempertahankan ungkapan “menuntut darahnya dari tangan kalian” dalam teks utama
  alternative: meminta pertanggungjawaban kalian atas darahnya; membalaskan darahnya kepada kalian
  rationale: Bentuk ini menjaga gambaran yuridis dan konkret dalam bahasa Ibrani serta tidak mempersempit tindakan Daud menjadi pembalasan pribadi semata.
- issue: Makna penyingkiran para pembunuh dari negeri
  choice: melenyapkan kalian dari negeri ini
  alternative: membersihkan negeri ini dari kalian; menyingkirkan kalian dari negeri ini
  rationale: Konteks menunjuk pada penghukuman mati secara yudisial. Pilihan ini menyampaikan akibatnya dengan jelas tanpa menyiratkan pemurnian ritual semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang tegas. Bentuk jamak “kalian” dipakai karena Daud berbicara kepada dua orang, sedangkan idiom “dari tangan kalian” mempertahankan citra hukum sumber Ibrani. Tanda seru memisahkan pernyataan a fortiori dari pertanyaan retoris yang menyusul.
