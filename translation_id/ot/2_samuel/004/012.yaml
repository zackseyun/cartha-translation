  text: וַ/יְצַו֩ דָּוִ֨ד אֶת הַ/נְּעָרִ֜ים וַ/יַּהַרְג֗וּ/ם וַֽ/יְקַצְּצ֤וּ אֶת יְדֵי/הֶם֙ וְ/אֶת רַגְלֵי/הֶ֔ם וַ/יִּתְל֥וּ עַל הַ/בְּרֵכָ֖ה בְּ/חֶבְר֑וֹן וְ/אֵ֨ת רֹ֤אשׁ אִֽישׁ בֹּ֨שֶׁת֙ לָקָ֔חוּ וַ/יִּקְבְּר֥וּ בְ/קֶֽבֶר אַבְנֵ֖ר בְּ/חֶבְרֽוֹן־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/004/012.yaml
  text: Then David commanded the young men[a], and they killed them and cut off their hands and their feet and hung them by the pool at Hebron. But they took the head of Ish-bosheth and buried it in the tomb of Abner at Hebron.
translation:
  language: id
  text: Lalu Daud memerintahkan orang-orang muda itu[a], dan mereka membunuh kedua orang itu, memotong tangan dan kaki mereka, lalu menggantung mereka di dekat kolam[b] di Hebron. Mereka mengambil kepala Isyboset dan menguburkannya di makam Abner di Hebron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pelayan itu” atau “anak buahnya”.
    reason: Kata Ibrani dapat menunjuk kepada orang-orang muda maupun para pelayan atau pengikut yang menjalankan perintah seorang pemimpin.
  - marker: b
    text: Atau “di atas kolam”.
    reason: Preposisi Ibrani עַל dapat menunjukkan posisi di atas sesuatu atau dipakai secara lebih luas untuk lokasi di dekatnya.
lexical_decisions:
- source_word: וַיְצַו דָּוִד אֶת הַנְּעָרִים
  choice: Lalu Daud memerintahkan orang-orang muda itu
  rationale: Bentuk naratif וַיְצַו melanjutkan urutan peristiwa, sehingga diterjemahkan “Lalu ... memerintahkan”. הַנְּעָרִים secara harfiah menunjuk kepada orang-orang muda, tetapi dalam konteks juga dapat berarti para pelayan atau anak buah.
- source_word: וַיַּהַרְגוּם
  choice: Mereka membunuh kedua orang itu
  rationale: הרג adalah kata umum untuk membunuh. Akhiran jamak merujuk kepada dua pembunuh Isyboset yang disebut dalam konteks sebelumnya; “kedua orang itu” memperjelas rujukan tanpa mengubah makna.
- source_word: וַיְקַצְּצוּ אֶת יְדֵיהֶם וְאֶת רַגְלֵיהֶם
  choice: memotong tangan dan kaki mereka
  rationale: קצץ berarti memotong atau memenggal bagian tubuh. Bahasa Indonesia tidak perlu mengulang kata ganti pada kedua anggota tubuh untuk mempertahankan makna yang sama.
- source_word: וַיִּתְלוּ עַל הַבְּרֵכָה
  choice: lalu menggantung mayat mereka di dekat kolam
  rationale: תלה berarti menggantung. Objek tersiratnya adalah tubuh kedua orang yang baru dibunuh, sehingga “mayat mereka” dinyatakan agar jelas dalam bahasa Indonesia. עַל dapat menunjukkan posisi pada/di atas sesuatu atau, secara lebih luas, lokasi di dekatnya; terjemahan utama memilih pengertian lokasi yang alami dalam konteks.
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Preposisi בְּ secara wajar diterjemahkan “di” untuk lokasi kota, pada kedua kemunculannya.
- source_word: רֹאשׁ אִישׁ בֹּשֶׁת
  choice: kepala Isyboset
  rationale: Rangkaian konstruksi Ibrani ini secara langsung berarti kepala milik Isyboset. Nama ditransliterasikan dalam bentuk Indonesia yang lazim dan mudah dibaca.
- source_word: וְאֵת ... לָקָחוּ
  choice: Namun, mereka mengambil
  rationale: לקח adalah verba umum “mengambil”. Konjungsi diterjemahkan “Namun” untuk menyatakan kontras naratif antara perlakuan terhadap para pembunuh dan penguburan kepala Isyboset secara terhormat.
- source_word: וַיִּקְבְּרוּ בְקֶבֶר אַבְנֵר
  choice: dan menguburkannya di makam Abner
  rationale: Objek tersiratnya adalah kepala Isyboset. קֶבֶר dapat berarti kubur atau makam; “makam” sesuai untuk tempat pemakaman seorang tokoh bernama dan memberi register yang wajar.
theological_decisions:
- issue: Penilaian moral dan teologis atas tindakan Daud
  choice: Menyampaikan tindakan Daud dan anak buahnya secara langsung tanpa menambahkan penilaian moral.
  alternative: Menggunakan istilah yudisial yang lebih interpretatif, seperti “mengeksekusi” atau “menghukum mati”.
  rationale: Ayat ini melaporkan perintah, pembunuhan, pemotongan anggota tubuh, dan pemajangan mayat, tetapi tidak menyatakan penilaian teologis secara eksplisit. Terjemahan mempertahankan ketegangan dan kekerasan narasi tanpa membenarkan atau mengecamnya dengan kata-kata tambahan.
- issue: Kontras perlakuan terhadap para pembunuh dan kepala Isyboset
  choice: Menggunakan “Namun” untuk menandai kontras wacana tanpa menambahkan motif.
  alternative: Menerjemahkan waw hanya dengan “dan”.
  rationale: Urutan Ibrani beralih dari pemajangan mayat para pembunuh kepada penguburan kepala Isyboset di makam Abner. “Namun” menyampaikan kontras yang hadir dalam susunan narasi, tetapi tidak menyimpulkan alasan teologis atau politiknya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kekerasan dalam teks tidak diperhalus, tetapi objek tersirat “mayat” dinyatakan untuk kejelasan. Susunan kalimat dipecah agar mudah dipahami pembaca umum tanpa menghilangkan urutan naratif.
