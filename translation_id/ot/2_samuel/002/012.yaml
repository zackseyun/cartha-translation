  text: וַ/יֵּצֵא֙ אַבְנֵ֣ר בֶּן נֵ֔ר וְ/עַבְדֵ֖י אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֑וּל מִֽ/מַּחֲנַ֖יִם גִּבְעֽוֹנָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/012.yaml
  text: Then Abner son of Ner[a], and the servants of Ish-bosheth son of Saul, went out from Mahanaim to Gibeon.
translation:
  language: id
  text: Kemudian Abner bin Ner dan para hamba Isyboset[a] bin Saul berangkat dari Mahanaim menuju Gibeon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Orang yang sama disebut “Esybaal” dalam 1 Tawarikh 8:33; 9:39.
    reason: Nama dalam teks Ibrani ayat ini adalah “Isyboset”, sedangkan kitab Tawarikh mempertahankan bentuk nama alternatif “Esybaal” bagi orang yang sama.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kemudian ... berangkat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Kata kerja sumber berbentuk tunggal karena mendahului subjek gabungan, sedangkan bahasa Indonesia secara alami memakai satu bentuk kata kerja yang tidak menandai jumlah. “Berangkat” menyampaikan tindakan meninggalkan Mahanaim menuju Gibeon.
- source_word: אַבְנֵר בֶּן נֵר
  choice: Abner bin Ner
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dan בֶּן diterjemahkan “bin” sebagai penanda patronimik yang ringkas dan umum dipahami.
- source_word: וְעַבְדֵי
  choice: dan para hamba
  rationale: עֶבֶד dapat berarti hamba, pelayan, pejabat, atau pengikut. “Para hamba” mempertahankan keluasan istilah sumber tanpa menentukan secara berlebihan pangkat atau fungsi mereka dalam konteks politik-militer ini.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isyboset
  rationale: Teks Masoret berbunyi אִישׁ בֹּשֶׁת. Bentuk “Isyboset” mengikuti transliterasi nama yang lazim bagi pembaca Alkitab berbahasa Indonesia; bentuk paralelnya dalam Tawarikh dijelaskan dalam catatan kaki.
- source_word: בֶּן שָׁאוּל
  choice: bin Saul
  rationale: Patronimik diterjemahkan langsung dan konsisten dengan frasa sebelumnya.
- source_word: מִמַּחֲנַיִם
  choice: dari Mahanaim
  rationale: Prefiks מִן menyatakan titik asal, sehingga diterjemahkan “dari”; nama tempat ditransliterasikan sebagai “Mahanaim”.
- source_word: גִּבְעֹנָה
  choice: menuju Gibeon
  rationale: Akhiran ה arah menyatakan gerak ke arah suatu tempat. “Menuju Gibeon” mempertahankan nuansa arah tanpa memastikan lebih daripada yang dinyatakan bentuk Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani secara alami. “Para hamba” dipertahankan agar hubungan mereka dengan Isyboset tetap terbuka sebagaimana istilah sumber, sementara “menuju” mencerminkan penanda arah pada nama Gibeon.
