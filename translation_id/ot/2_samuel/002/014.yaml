base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/014.yaml
  text: Then Abner said to Joab, “Please let the young men arise and compete before us.” And Joab said, “Let them arise.”
translation:
  language: id
  text: Lalu Abner berkata kepada Yoab, “Biarlah orang-orang muda itu bangkit dan bertanding di hadapan kita.” Yoab menjawab, “Biarlah mereka bangkit.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּעָרִים
  choice: orang-orang muda itu
  rationale: Istilah ini menunjuk para pemuda atau prajurit muda dalam konteks; terjemahan ini mempertahankan cakupan dasarnya tanpa mempersempitnya secara tidak perlu.
- source_word: וִישַׂחֲקוּ
  choice: bertanding
  rationale: Walaupun akar שׂחק dapat berarti bermain atau bersenda gurau, konteks perjumpaan bersenjata yang segera menjadi mematikan mendukung arti bertanding; pilihan ini tetap tidak secara eksplisit mendahului hasil pertarungan.
- source_word: לְפָנֵינוּ
  choice: di hadapan kita
  rationale: Menerjemahkan ungkapan ruang secara langsung dan wajar dalam bahasa Indonesia.
- source_word: יָקֻמוּ
  choice: Biarlah mereka bangkit
  rationale: Mempertahankan pengulangan kata kerja קום dan nuansa persetujuan atau izin dalam jawaban Yoab.
