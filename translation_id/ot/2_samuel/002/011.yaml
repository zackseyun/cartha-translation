lexical_decisions:
- source_word: וַיְהִי מִסְפַּר הַיָּמִים
  choice: Lamanya ... adalah
  rationale: Ungkapan harfiah 'jumlah hari-hari itu' menyatakan jangka waktu. Bentuk ini menyampaikan fungsi kalimat rangkuman secara alami dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר הָיָה דָוִד מֶלֶךְ
  choice: Daud menjadi raja
  rationale: Konstruksi relatif ini menghubungkan jangka waktu dengan masa pemerintahan Daud; 'menjadi raja' alami dan tidak menambahkan penafsiran.
- source_word: בְּחֶבְרוֹן
  choice: di Hebron
  rationale: Preposisi בְּ menandai lokasi pemerintahan Daud.
- source_word: עַל בֵּית יְהוּדָה
  choice: atas kaum Yehuda
  rationale: '''Kaum Yehuda'' mempertahankan pengertian kolektif בֵּית tanpa memberi kesan bahwa yang dimaksud hanya sebuah rumah tangga harfiah.'
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: tujuh tahun enam bulan
  rationale: Padanan langsung dan alami untuk jangka waktu yang disebutkan.
