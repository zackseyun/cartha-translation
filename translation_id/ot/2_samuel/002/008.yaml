  text: וְ/אַבְנֵ֣ר בֶּן נֵ֔ר שַׂר צָבָ֖א אֲשֶׁ֣ר לְ/שָׁא֑וּל לָקַ֗ח אֶת אִ֥ישׁ בֹּ֨שֶׁת֙ בֶּן שָׁא֔וּל וַ/יַּעֲבִרֵ֖/הוּ מַחֲנָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/008.yaml
  text: But Abner son of Ner[a], the commander of Saul’s army, took Ish-bosheth son of Saul and brought him over to Mahanaim.
translation:
  language: id
  text: Namun, Abner anak Ner, panglima tentara Saul, membawa Isyboset[a], anak Saul, menyeberang ke Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Isyboset disebut Esybaal dalam 1 Tawarikh 8:33 dan 9:39.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַבְנֵר
  choice: Namun, Abner
  rationale: Konjungsi וְ secara dasar berarti “dan”, tetapi di sini menandai kontras naratif dengan pengangkatan Daud oleh kaum Yehuda dalam ayat sebelumnya; “namun” menyampaikan hubungan itu secara alami.
- source_word: בֶּן נֵר
  choice: anak Ner
  rationale: Konstruksi patronimik Ibrani diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: שַׂר צָבָא אֲשֶׁר לְ/שָׁאוּל
  choice: panglima tentara Saul
  rationale: שַׂר צָבָא menunjuk kepala atau panglima pasukan; frasa ini mempertahankan hubungan tentara tersebut dengan Saul secara ringkas dan jelas.
- source_word: לָקַח
  choice: membawa
  rationale: לָקַח memiliki arti dasar “mengambil”, tetapi bersama tindakan berikutnya terhadap seorang tokoh, “membawa” lebih alami dalam bahasa Indonesia tanpa menambahkan kesan kekerasan yang tidak dinyatakan.
- source_word: אֶת אִישׁ בֹּשֶׁת
  choice: Is-Boset
  rationale: Nama dalam teks Masoret ditransliterasikan menurut bentuk Ibrani yang tampil dalam ayat ini, bukan diterjemahkan artinya.
- source_word: וַ/יַּעֲבִרֵ/הוּ
  choice: menyeberang
  rationale: Bentuk Hifil dari עבר berarti menyebabkan seseorang lewat atau menyeberang. Dalam konstruksi “membawa ... menyeberang”, nuansa kausatifnya terpelihara tanpa menentukan rute yang tidak disebutkan.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Nama tempat ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, sementara ungkapan “membawa ... menyeberang” mempertahankan makna kausatif secara alami. Penanda catatan kaki ditempatkan setelah nama tujuan karena catatan menjelaskan identitas Is-Boset dalam keseluruhan ayat.
