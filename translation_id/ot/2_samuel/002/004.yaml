  text: וַ/יָּבֹ֨אוּ֙ אַנְשֵׁ֣י יְהוּדָ֔ה וַ/יִּמְשְׁחוּ שָׁ֧ם אֶת דָּוִ֛ד לְ/מֶ֖לֶךְ עַל בֵּ֣ית יְהוּדָ֑ה וַ/יַּגִּ֤דוּ לְ/דָוִד֙ לֵ/אמֹ֔ר אַנְשֵׁי֙ יָבֵ֣ישׁ גִּלְעָ֔ד אֲשֶׁ֥ר קָבְר֖וּ אֶת שָׁאֽוּל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/004.yaml
  text: Then the men of Judah came[a], and there they anointed David king over the house of Judah. And they told David, saying, "The men of Jabesh-gilead were the ones who buried Saul."
translation:
  language: id
  text: Lalu datanglah orang-orang Yehuda[a], dan di sana mereka mengurapi Daud menjadi raja atas kaum Yehuda. Kemudian mereka memberi tahu Daud bahwa orang-orang Yabesh-Gilead telah menguburkan Saul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laki-laki Yehuda.”
    reason: Menunjukkan bentuk maskulin dari אַנְשֵׁי, yang dalam konteks ini dapat merujuk kepada para anggota atau wakil Yehuda.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datanglah
  rationale: Bentuk naratif dari בוא menyatakan kedatangan; bentuk inversi dengan -lah alami dalam narasi Indonesia dan tidak memaksakan sudut pandang ‘pergi’.
- source_word: אַנְשֵׁי יְהוּדָה
  choice: orang-orang Yehuda
  rationale: Ungkapan ini menunjuk para anggota atau wakil laki-laki dari Yehuda. ‘Orang-orang Yehuda’ merupakan ungkapan gentilik yang paling alami dalam bahasa Indonesia; nuansa harfiah ‘laki-laki’ dicatat dalam catatan kaki.
- source_word: וַיִּמְשְׁחוּ
  choice: mengurapi
  rationale: Dalam konteks kerajaan, משׁח adalah tindakan mengurapi seseorang sebagai raja dan mengandung makna politik serta keagamaan yang perlu dipertahankan.
- source_word: לְמֶלֶךְ
  choice: menjadi raja
  rationale: Sesudah ‘mengurapi’, bahasa Indonesia secara alami memakai ‘menjadi raja’ untuk menyatakan jabatan yang diberikan kepada Daud.
- source_word: עַל בֵּית יְהוּדָה
  choice: atas kaum Yehuda
  rationale: ‘Kaum’ mempertahankan pengertian korporat dan kesukuan dari בֵּית tanpa menghasilkan ungkapan Indonesia yang kaku seperti ‘rumah Yehuda’.
- source_word: וַיַּגִּדוּ לְדָוִד לֵאמֹר
  choice: Kemudian mereka memberi tahu Daud
  rationale: Hifil נגד berarti memberi tahu atau melaporkan. Unsur לֵאמֹר tidak diterjemahkan terpisah karena kutipan langsung sudah menjalankan fungsi ‘dengan berkata’ secara alami dalam bahasa Indonesia.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: Orang-orang Yabesh-Gilead
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan אַנְשֵׁי diterjemahkan dengan ungkapan gentilik alami ‘orang-orang’.
- source_word: אֲשֶׁר קָבְרוּ אֶת שָׁאוּל
  choice: -lah yang menguburkan Saul
  rationale: Partikel fokus ‘-lah’ menampilkan daya identifikasional yang mungkin terkandung dalam klausa relatif Ibrani, tanpa menambah pelaku atau motif yang tidak disebutkan.
theological_decisions:
- issue: Bahasa kolektif bergender dalam אַנְשֵׁי
  choice: Memakai ‘orang-orang’ dalam teks utama dan mencatat arti harfiah ‘laki-laki’
  alternative: ‘laki-laki Yehuda’ dan ‘laki-laki Yabesh-Gilead’
  rationale: Kata Ibrani berbentuk maskulin, tetapi dalam konstruksi gentilik dapat menunjuk kelompok atau para wakil suatu tempat. Pilihan utama menjaga bahasa Indonesia tetap wajar, sedangkan catatan kaki mempertahankan akses pembaca kepada bentuk bergender sumber.
- issue: Makna korporat בֵּית יְהוּדָה
  choice: kaum Yehuda
  alternative: rumah Yehuda; suku Yehuda; Yehuda
  rationale: ‘Kaum’ mempertahankan cakupan kelompok kekerabatan atau kesatuan suku tanpa mempersempitnya menjadi wilayah semata atau memaksakan arti bangunan harfiah.
- issue: Daya identifikasional klausa אֲשֶׁר קָבְרוּ
  choice: Orang-orang Yabesh-Gileadlah yang menguburkan Saul
  alternative: Orang-orang Yabesh-Gilead yang menguburkan Saul
  rationale: Bentuk dengan ‘-lah’ menyampaikan penegasan identitas yang mungkin dimaksudkan oleh laporan itu. Karena bahasa Ibrani juga dapat dipahami sebagai klausa relatif sederhana, alternatif dicatat dan ambiguitas tidak ditutup.
translation_notes:
  register: 'Bahasa naratif modern, bermartabat, dan mudah dipahami. Bentuk ‘datanglah’ memberi alur narasi yang wajar; ‘memberi tahu’ lebih alami daripada mempertahankan rumus ‘berkata demikian’. Nama diri memakai ejaan Indonesia: Daud, Yehuda, Yabesh-Gilead, dan Saul.'
