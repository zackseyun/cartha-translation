reference: 2 Samuel 2:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַבְנֵ֣ר וַֽ/אֲנָשָׁ֗י/ו הָֽלְכוּ֙ בָּֽ/עֲרָבָ֔ה כֹּ֖ל הַ/לַּ֣יְלָה הַ/ה֑וּא וַ/יַּעַבְר֣וּ אֶת הַ/יַּרְדֵּ֗ן וַ/יֵּֽלְכוּ֙ כָּל הַ/בִּתְר֔וֹן וַ/יָּבֹ֖אוּ מַחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/029.yaml
  text: And Abner and his men traveled through the Arabah all that night[a], crossed the Jordan, went through all the Bithron, and came to Mahanaim.
translation:
  language: id
  text: Abner dan orang-orangnya berjalan melalui Araba sepanjang malam itu, menyeberangi Sungai Yordan, melintasi seluruh Bitron[a], lalu tiba di Mahanaim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “melintasi seluruh daerah jurang/lembah”; istilah Ibrani Bitron dapat merupakan nama tempat atau sebutan geografis deskriptif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֲרָבָה
  choice: melalui Araba
  rationale: עֲרָבָה di sini kemungkinan menunjuk kawasan geografis Lembah Yordan/Araba dalam rute perjalanan, bukan sekadar dataran biasa; bentuk nama dipertahankan.
- source_word: כָּל הַלַּיְלָה הַהוּא
  choice: sepanjang malam itu
  rationale: Ungkapan ini menyatakan perjalanan yang berlangsung selama seluruh malam; frasa Indonesia ini alami dan mempertahankan unsur penunjuk 'itu'.
- source_word: וַיַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: menyeberangi Sungai Yordan
  rationale: Kata kerja עבר dengan Yordan sebagai objek langsung menyatakan tindakan menyeberangi sungai; penambahan 'Sungai' memperjelas referen secara alami dalam bahasa Indonesia.
- source_word: כָּל הַבִּתְרוֹן
  choice: melintasi seluruh Bitron
  rationale: הַבִּתְרוֹן mungkin merupakan nama tempat atau kawasan, meskipun dapat pula dipahami secara deskriptif sebagai daerah jurang atau lembah yang terbelah. Transliterasi menjaga ketidakpastian itu.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan tidak diterjemahkan.
- source_word: הָלְכוּ / וַיֵּלְכוּ / וַיָּבֹאוּ
  choice: berjalan ... melintasi ... tiba
  rationale: Rangkaian verba gerak dipertahankan dengan padanan Indonesia yang alami dan memperlihatkan perkembangan perjalanan menuju kedatangan.
- source_word: וַאֲנָשָׁיו
  choice: orang-orangnya
  rationale: Secara harfiah berarti 'orang-orangnya'. Konteksnya bersifat militer, tetapi 'prajurit-prajuritnya' akan menambahkan penafsiran yang tidak dinyatakan langsung.
