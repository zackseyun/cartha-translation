  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama geografis Araba, Bitron, Yordan, dan Mahanaim dipertahankan; ambiguitas geografis pada Bitron dijelaskan dalam catatan kaki.
