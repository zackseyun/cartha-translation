  text: וְ/עַתָּ֕ה יַֽעַשׂ יְהוָ֥ה עִמָּ/כֶ֖ם חֶ֣סֶד וֶ/אֱמֶ֑ת וְ/גַ֣ם אָנֹכִ֗י אֶעֱשֶׂ֤ה אִתְּ/כֶם֙ הַ/טּוֹבָ֣ה הַ/זֹּ֔את אֲשֶׁ֥ר עֲשִׂיתֶ֖ם הַ/דָּבָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/006.yaml
  text: And now may Yahweh show you steadfast love and faithfulness[a]. And I also will do this good to you[c][b], because you have done this thing.
translation:
  language: id
  text: Sekarang, kiranya Yahweh menunjukkan kasih setia dan kesetiaan kepada kalian.[a] Aku pun akan melakukan kebaikan ini bagi kalian[b] karena kalian telah melakukan hal ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh akan menunjukkan kasih setia dan kesetiaan kepada kalian.” Kata kerja Ibraninya dapat dipahami sebagai harapan atau berkat, maupun sebagai pernyataan tentang masa depan.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kebaikan ini”; dapat juga diterjemahkan “tindakan baik ini”.
    reason: lexical_alternative
  - marker: c
    text: “Hal ini” merujuk pada tindakan yang disebut dalam ayat sebelumnya, yaitu menguburkan Saul.
    reason: cross_reference
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini menghubungkan ucapan berkat Daud dengan pujiannya pada ayat sebelumnya; dalam bahasa Indonesia, “Sekarang” sudah menyampaikan peralihan yang berkesinambungan secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap terlihat.
- source_word: יַעַשׂ
  choice: kiranya ... menunjukkan
  rationale: Bentuk imperfek ini paling wajar dipahami secara yusif sebagai harapan atau berkat. Kata “menunjukkan” alami dalam bahasa Indonesia ketika objeknya adalah kasih setia dan kesetiaan.
- source_word: עִמָּכֶם
  choice: kepada kalian
  rationale: Secara harfiah berarti “dengan kalian”, tetapi bersama tindakan menunjukkan kasih setia, bahasa Indonesia secara alami memakai “kepada kalian”. Bentuk “kalian” memperjelas bahwa orang kedua berbentuk jamak.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Pilihan ini mempertahankan unsur kasih, kebaikan, dan loyalitas relasional dalam חֶסֶד tanpa mempersempitnya menjadi istilah doktrinal tertentu.
- source_word: וֶאֱמֶת
  choice: dan kesetiaan
  rationale: Dalam pasangan חֶסֶד וֶאֱמֶת, אֱמֶת menunjuk pada keteguhan atau dapat dipercayanya seseorang dalam relasi, sehingga “kesetiaan” lebih tepat daripada “kebenaran” yang abstrak.
- source_word: וְגַם אָנֹכִי
  choice: Aku pun
  rationale: '“Pun” mempertahankan unsur tambahan dan penekanan pada kata ganti orang pertama: Yahweh diharapkan bertindak demikian, dan Daud juga akan berbuat baik kepada mereka.'
- source_word: אֶעֱשֶׂה אִתְּכֶם הַטּוֹבָה הַזֹּאת
  choice: akan melakukan kebaikan ini kepada kalian
  rationale: Ungkapan ini mempertahankan objek harfiah “kebaikan ini” serta arah tindakan kepada para penerima, tanpa menyamakannya dengan חֶסֶד pada klausa sebelumnya.
- source_word: אֲשֶׁר עֲשִׂיתֶם הַדָּבָר הַזֶּה
  choice: karena kalian telah melakukan hal ini
  rationale: Klausa ini memberi alasan bagi tanggapan Daud. “Hal ini” mempertahankan rujukan demonstratif kepada tindakan yang disebut dalam ayat sebelumnya.
theological_decisions:
- issue: 'Daya bentuk יַעַשׂ: doa/harapan atau pernyataan masa depan'
  choice: 'Diterjemahkan sebagai harapan berkat: “kiranya Yahweh menunjukkan”.'
  alternative: “Yahweh akan menunjukkan” sebagai pernyataan masa depan.
  rationale: Dalam konteks Daud memberkati orang-orang Yabesh-Gilead, daya yusif cocok dengan ucapan berkat. Namun, karena bentuk Ibraninya juga dapat dibaca sebagai pernyataan masa depan, kemungkinan itu dicatat dalam catatan kaki dan tidak disembunyikan.
- issue: Hubungan tindakan Daud dengan tindakan penduduk Yabesh-Gilead
  choice: Diterjemahkan sebagai tindakan baik Daud yang didasarkan pada perbuatan mereka, tanpa menyebutnya secara eksplisit sebagai pahala atau pembalasan jasa.
  alternative: Memparafrasakan klausa sebagai “Aku pun akan membalas kebaikan kalian.”
  rationale: Teks menyatakan bahwa Daud akan melakukan “kebaikan ini” karena mereka telah melakukan “hal ini”, tetapi tidak memakai istilah teknis untuk pahala. Terjemahan tidak menambahkan kerangka teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat digunakan. “Kalian” dipilih untuk menyatakan bentuk jamak dengan jelas. Susunan kalimat mempertahankan pengulangan kata kerja “melakukan” dalam teks Ibrani sejauh masih alami, dan membedakan “kasih setia” dari “kebaikan”.
