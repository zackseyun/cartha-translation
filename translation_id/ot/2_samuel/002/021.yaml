  text: וַ/יֹּ֧אמֶר ל֣/וֹ אַבְנֵ֗ר נְטֵ֤ה לְ/ךָ֙ עַל יְמִֽינְ/ךָ֙ א֣וֹ עַל שְׂמֹאלֶ֔/ךָ וֶ/אֱחֹ֣ז לְ/ךָ֗ אֶחָד֙ מֵֽ/הַ/נְּעָרִ֔ים וְ/קַח לְ/ךָ֖ אֶת חֲלִצָת֑/וֹ וְ/לֹֽא אָבָ֣ה עֲשָׂהאֵ֔ל לָ/ס֖וּר מֵ/אַחֲרָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/021.yaml
  text: Then Abner said to him[a], “Turn aside to your right or to your left, and seize one of the young men for yourself, and take his gear for yourself.” But Asahel was not willing to turn aside from following him.
translation:
  language: id
  text: Lalu Abner berkata kepadanya, “Menyimpanglah ke sebelah kananmu atau ke sebelah kirimu, tangkaplah salah seorang dari orang-orang muda itu bagi dirimu, dan ambillah perlengkapannya bagi dirimu[a].” Namun Asael tidak mau beralih dari mengejarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “baju zirahnya.” Istilah Ibrani ini tampaknya menunjuk pada perlengkapan yang dilucuti dari seorang petarung yang dikalahkan; benda tepat yang dimaksud tidak sepenuhnya pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטֵה
  choice: Menyimpanglah
  rationale: Dalam konteks pengejaran, imperatif ini meminta Asael meninggalkan arah yang sedang ditempuh; ‘menyimpanglah’ mempertahankan gagasan beralih dari jalur pengejaran.
- source_word: עַל יְמִינְךָ אֹו עַל שְׂמֹאלֶךָ
  choice: ke kanan atau ke kirimu
  rationale: Ungkapan ini mempertahankan sapaan orang kedua tunggal dan terdengar alami dalam bahasa Indonesia.
- source_word: וֶאֱחֹז לְךָ
  choice: tangkaplah
  rationale: Kata אחז berarti memegang atau menangkap dengan kuat; ‘tangkaplah’ sesuai dengan konteks pertempuran, sedangkan nuansa kepentingan diri disampaikan oleh frasa berikutnya.
- source_word: אֶחָד מֵהַנְּעָרִים
  choice: salah seorang dari antara orang-orang muda itu
  rationale: Terjemahan ini mempertahankan arti dasar נְעָרִים tanpa mempersempitnya secara tidak pasti menjadi pelayan atau prajurit.
- source_word: וְקַח לְךָ אֶת חֲלִצָתוֹ
  choice: ambillah perlengkapannya untuk dirimu
  rationale: חֲלִצָה di sini kemungkinan menunjuk pada perlengkapan yang dilucuti dari seorang petarung; ‘perlengkapan’ cukup luas untuk menjaga ketidakpastian benda yang dimaksud.
- source_word: וְלֹא אָבָה
  choice: tidak mau
  rationale: Ungkapan ini menyampaikan ketiadaan kemauan atau persetujuan secara alami tanpa menambahkan tingkat ketegasan yang tidak dinyatakan.
- source_word: לָסוּר מֵאַחֲרָיו
  choice: berhenti mengejarnya
  rationale: Secara harfiah berarti beralih dari belakangnya; dalam konteks ini idiom Indonesianya adalah berhenti mengejar dia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk ‘kirimu’ dipilih untuk mempertahankan sapaan langsung; ‘orang-orang muda’ menjaga keluasan istilah sumber; dan ‘perlengkapan’ menghindari kepastian semu antara baju zirah, pakaian, dan barang rampasan.
