translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Lawan' dipilih daripada 'kawan' agar tidak menyiratkan persahabatan dalam konteks pertarungan. Penanda catatan kaki [a] ditempatkan pada unsur pertama yang berkaitan dengan rangkaian tindakan, mengikuti data konsultasi, meskipun isi catatan menjelaskan nama tempat.
