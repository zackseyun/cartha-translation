base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/016.yaml
  text: Each man seized his companion by the head[a], and his sword was in his companion’s side, so they fell together. Therefore that place, which is in Gibeon, was called Helkath-hazzurim.
translation:
  language: id
  text: Masing-masing menangkap kepala lawannya, dan pedangnya berada di sisi lawannya. Lalu mereka jatuh bersama-sama. Karena itu, tempat tersebut, yang berada di Gibeon, dinamai Helkat-Hazurim[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Helkat-Hazurim adalah transliterasi nama tempat Ibrani. Arti tepatnya tidak pasti; usulan maknanya mencakup “Ladang Sisi-Sisi”, “Ladang Pedang-Pedang Tajam”, dan makna-makna serupa lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲזִקוּ אִישׁ בְּרֹאשׁ רֵעֵהוּ
  choice: Masing-masing menangkap kepala lawannya
  rationale: Bentuk distributif אִישׁ menyatakan bahwa setiap peserta bertindak terhadap pasangan tandingnya. חזק di sini menunjukkan tindakan memegang dengan paksa; רֵעַ dalam konteks pertarungan berarti pihak pasangan atau lawan, bukan sahabat.
- source_word: וְחַרְבּוֹ בְּצַד רֵעֵהוּ
  choice: dan menikamkan pedangnya ke rusuk lawannya
  rationale: Klausa Ibrani ini padat dan tanpa verba eksplisit. Dalam konteks laga maut, bahasa Indonesia memerlukan verba agar hubungan tindakannya jelas. צַד menunjuk sisi tubuh; 'rusuk' merupakan ungkapan alami tanpa menentukan organ tertentu.
- source_word: וַיִּפְּלוּ יַחְדָּו
  choice: Lalu mereka jatuh bersama-sama
  rationale: יַחְדָּו menekankan bahwa kedua pihak jatuh serentak atau bersama; 'lalu' melanjutkan urutan narasi secara alami.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Karena itu, tempat ... tersebut dinamai
  rationale: Pelaku verba tunggal tidak disebutkan dan dapat diterjemahkan secara impersonal. Bentuk pasif Indonesia mempertahankan ketidakjelasan pelaku, sedangkan 'Karena itu' menyatakan kaitan penamaan dengan peristiwa sebelumnya.
- source_word: חֶלְקַת הַצֻּרִים
  choice: Helkat-Hazurim
  rationale: Nama tempat ditransliterasikan karena arti unsur צֻרִים tidak pasti dan diperdebatkan. Bentuk ini mengikuti ejaan yang mudah dibaca dalam bahasa Indonesia tanpa menetapkan satu etimologi.
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: tempat di Gibeon tersebut
  rationale: Klausa relatif mengidentifikasi lokasi tempat bernama itu. Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa tempat tersebut berada di Gibeon.
