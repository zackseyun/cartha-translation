  text: But David’s servants struck down three hundred and sixty men from Benjamin and from Abner’s men[a].
translation:
  language: id
  text: Namun, orang-orang Daud memukul orang-orang dari suku Benyamin dan orang-orang Abner; 360 orang tewas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan orang-orang Daud ...” Kata sambung Ibrani dapat diterjemahkan sederhana sebagai “dan”; teks utama memakai “namun” untuk menunjukkan kontras dengan laporan jumlah korban pada ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַבְדֵי דָוִד
  choice: Namun, anak buah Daud
  rationale: Kata sambung וְ pada dasarnya berarti “dan”, tetapi di sini dapat menyatakan kontras dengan jumlah korban di pihak Daud pada ayat sebelumnya. עַבְדֵי dalam konteks perang menunjuk kepada orang-orang yang mengabdi dan bertempur bagi Daud; “anak buah” lebih alami daripada “hamba” atau “budak” dalam bahasa Indonesia modern.
- source_word: הִכּוּ ... מֵתוּ
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה menyatakan tindakan memukul atau merobohkan lawan, sedangkan מֵתוּ menegaskan bahwa mereka mati. “Menewaskan” menyampaikan tindakan beserta akibat mautnya secara ringkas dan alami tanpa pengulangan yang janggal.
- source_word: מִ/בִּנְיָמִן
  choice: dari suku Benyamin
  rationale: מִן menandai kelompok asal para korban. Penambahan “suku” memperjelas bahwa Benyamin di sini adalah identitas kesukuan, bukan seorang individu.
- source_word: וּ/בְ/אַנְשֵׁי אַבְנֵר
  choice: dan dari kalangan pasukan Abner
  rationale: Frasa ini menunjuk kepada orang-orang yang berada di bawah pimpinan Abner. “Dari kalangan” mencerminkan בְ secara alami, sedangkan “pasukan” sesuai dengan konteks para pejuang.
- source_word: שְׁלֹשׁ מֵאוֹת וְ/שִׁשִּׁים אִישׁ
  choice: 360 orang
  rationale: Bentuk angka diterjemahkan langsung; אִישׁ sesudah angka menyatakan jumlah orang yang menjadi korban.
