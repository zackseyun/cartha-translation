base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/026.yaml
  text: Then Abner called to Joab and said[a], “Must the sword devour forever? Do you not know that it will be bitter in the end? How long will it be before you tell the people to turn back from following their brothers?”
translation:
  language: id
  text: Lalu Abner berseru kepada Yoab, katanya, “Apakah pedang akan melahap tanpa henti? Tidakkah engkau tahu bahwa pada akhirnya akibatnya akan pahit? Berapa lama lagi sebelum engkau menyuruh orang-orang berbalik dari mengejar saudara-saudara mereka[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “berbalik dari mengikuti saudara-saudara mereka.”'
    reason: Mencerminkan secara lebih dekat frasa Ibrani מֵאַחֲרֵי, secara harfiah ‘dari setelah/di belakang’; dalam konteks ini frasa itu menunjuk pada penghentian pengejaran.
lexical_decisions:
- source_word: הֲלָנֶצַח
  choice: untuk selama-lamanya
  rationale: Ungkapan ini membentuk pertanyaan retoris tentang berlangsungnya pembantaian tanpa akhir; pilihan ini alami dalam bahasa Indonesia dan mempertahankan tekanannya.
- source_word: תֹּאכַל חֶרֶב
  choice: pedang terus melahap
  rationale: Mempertahankan personifikasi Ibrani, yaitu pedang sebagai pelaku yang ‘memakan’ atau ‘melahap’, sambil memakai ungkapan Indonesia yang hidup dan mudah dipahami.
- source_word: מָרָה תִהְיֶה בָּאַחֲרוֹנָה
  choice: pada akhirnya akibatnya akan pahit
  rationale: ‘Pahit’ mempertahankan metafora sumber, sedangkan ‘akibatnya’ memperjelas rujukan subjek tersirat secara alami tanpa menentukan secara sempit bentuk kepahitan itu.
- source_word: וְעַד מָתַי
  choice: Berapa lama lagi sebelum
  rationale: Menyampaikan pertanyaan mengenai penundaan tindakan dengan susunan yang wajar dalam bahasa Indonesia modern.
- source_word: לֹא תֹאמַר לָעָם
  choice: engkau menyuruh orang-orang itu
  rationale: אמר dalam konteks ini menyampaikan arahan kepada kelompok yang bertempur. ‘Menyuruh’ sesuai konteks tanpa menaikkannya menjadi istilah teknis seperti ‘memerintahkan’; ‘orang-orang itu’ tetap dekat dengan הָעָם tanpa menambahkan kepemilikan yang tidak tersurat.
- source_word: לָשׁוּב מֵאַחֲרֵי
  choice: berbalik dan berhenti mengejar
  rationale: Mengungkapkan tindakan kembali atau berbalik sekaligus makna kontekstual berhenti mengikuti dari belakang dalam pengejaran militer.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Mempertahankan bahasa kekeluargaan sumber dan daya emosionalnya karena sesama orang Israel sedang saling memerangi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Metafora ‘pedang melahap’ dan ‘akibatnya pahit’ dipertahankan, sedangkan ungkapan gerak Ibrani dijelaskan secara alami sebagai berbalik dan berhenti mengejar.
