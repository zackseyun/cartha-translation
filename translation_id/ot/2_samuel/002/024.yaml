base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/024.yaml
  text: Joab and Abishai pursued Abner[a], and the sun went down; and they came as far as the hill of Ammah[b], which is opposite Giah on the way to the wilderness of Gibeon.
translation:
  language: id
  text: Yoab dan Abisai mengejar Abner, dan matahari terbenam. Mereka sampai sejauh Bukit Ama, yang berhadapan dengan Giah[a], di jalan menuju padang gurun Gibeon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di depan Giah"; ungkapan Ibrani dapat menunjukkan posisi di depan atau berhadapan dengan suatu tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau "melalui jalan menuju padang gurun Gibeon"; bahasa Ibrani dapat menekankan jalan atau rute yang ditempuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵי אַבְנֵר
  choice: mengejar Abner
  rationale: Kata kerja רדף dalam konteks narasi militer berarti mengejar; unsur אַחֲרֵי secara wajar tercakup dalam konstruksi bahasa Indonesia ini.
- source_word: וְהַשֶּׁמֶשׁ בָּאָה
  choice: ketika matahari terbenam
  rationale: Ungkapan Ibrani harfiah 'matahari datang' merupakan idiom bagi terbenamnya matahari. 'Ketika' menghubungkan keterangan waktu secara alami tanpa mengubah urutan peristiwa.
- source_word: וְהֵמָּה בָּאוּ עַד
  choice: mereka sampai di
  rationale: עַד bersama nama tempat menandai batas atau titik terjauh yang dicapai; 'sampai di' merupakan ungkapan naratif Indonesia yang alami.
- source_word: גִּבְעַת אַמָּה
  choice: bukit Ama
  rationale: Rangkaian konstruksi menunjuk bukit bernama Ama. Bentuk ringkas ini alami dalam penamaan geografis bahasa Indonesia.
- source_word: אֲשֶׁר עַל־פְּנֵי גִיחַ
  choice: yang berhadapan dengan Giah
  rationale: עַל־פְּנֵי dapat menggambarkan lokasi di depan atau berhadapan dengan tempat lain. Pilihan ini mempertahankan hubungan geografis tanpa menetapkan arah mata angin.
- source_word: דֶּרֶךְ מִדְבַּר גִּבְעוֹן
  choice: di jalan menuju padang gurun Gibeon
  rationale: דֶּרֶךְ dapat berarti jalan atau rute; terjemahan ini menyatakan rute menuju kawasan padang gurun yang berkaitan dengan Gibeon.
- source_word: יוֹאָב / אֲבִישַׁי / אַבְנֵר / אַמָּה / גִּיחַ / גִּבְעוֹן
  choice: Yoab / Abisai / Abner / Ama / Giah / Gibeon
  rationale: Nama orang dan tempat ditransliterasikan dengan bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
