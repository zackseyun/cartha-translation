  text: Asael mengejar Abner[a], dan ia tidak berbelok ke kanan ataupun ke kiri dalam mengikuti Abner.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bagian terakhir berbunyi: “dari belakang Abner.”'
    reason: Keterangan ini mempertahankan kemungkinan leksikal מֵאַחֲרֵי אַבְנֵר (“dari belakang/di belakang Abner”) tanpa menghasilkan susunan alternatif yang rancu dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: mengejar
  rationale: Kata kerja רדף menyatakan pengejaran yang aktif dan berkelanjutan; “mengejar” merupakan padanan Indonesia yang alami dan tepat dalam narasi ini.
- source_word: אַחֲרֵי אַבְנֵר
  choice: Abner
  rationale: Sesudah verba “mengejar”, nama objek dapat langsung mengikutinya dalam bahasa Indonesia; unsur “di belakang” sudah terkandung dalam tindakan mengejar.
- source_word: וְלֹא נָטָה
  choice: tidak menyimpang
  rationale: נטה di sini berarti berbelok atau menyimpang dari arah yang sedang ditempuh. “Tidak menyimpang” mempertahankan gambaran tentang jalur pengejaran.
- source_word: לָלֶכֶת
  choice: dalam mengikuti
  rationale: Infinitif לָלֶכֶת berkaitan dengan gerak atau perjalanan. Dalam konteks ini, “dalam mengikuti” menghubungkannya secara alami dengan pengejaran Abner tanpa menambahkan tindakan baru.
- source_word: עַל הַיָּמִין וְעַל הַשְּׂמֹאול
  choice: ke kanan ataupun ke kiri
  rationale: Ungkapan ini dipertahankan sebagai idiom arah yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: מֵאַחֲרֵי אַבְנֵר
  choice: dalam mengikuti Abner
  rationale: Secara harfiah frasa ini berarti “dari belakang Abner” atau “dari mengikuti Abner”; pilihan ini menyampaikan bahwa Asael tidak beralih dari jalur pengejarannya.
- source_word: עֲשָׂהאֵל / אַבְנֵר
  choice: Asael / Abner
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
