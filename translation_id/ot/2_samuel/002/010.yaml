  text: בֶּן אַרְבָּעִ֨ים שָׁנָ֜ה אִֽישׁ בֹּ֣שֶׁת בֶּן שָׁא֗וּל בְּ/מָלְכ/וֹ֙ עַל יִשְׂרָאֵ֔ל וּ/שְׁתַּ֥יִם שָׁנִ֖ים מָלָ֑ךְ אַ֚ךְ בֵּ֣ית יְהוּדָ֔ה הָי֖וּ אַחֲרֵ֥י דָוִֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/010.yaml
  text: Ish-bosheth son of Saul was forty years old when he began to reign over Israel[a], and he reigned two years[c][b]. But the house of Judah followed David.
translation:
  language: id
  text: Isyboset[a], anak Saul, berumur empat puluh tahun ketika ia mulai memerintah atas Israel, dan ia memerintah selama dua tahun. Namun, kaum Yehuda[b] berpihak kepada Daud.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini berbentuk Isyboset dalam teks Masoret pada ayat ini; bandingkan bentuk terkait Esybaal dalam tradisi lain.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “keluarga Yehuda,” yaitu sebutan kolektif bagi suku atau komunitas politik Yehuda.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “berada di belakang Daud” atau “mengikuti Daud”; ungkapan Ibrani ini menyatakan dukungan atau kesetiaan kepadanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אַרְבָּעִים שָׁנָה
  choice: berumur empat puluh tahun
  rationale: Ungkapan usia Ibrani ini diterjemahkan secara idiomatis dan tepat dalam bahasa Indonesia modern.
- source_word: אִישׁ בֹּשֶׁת
  choice: Isyboset
  rationale: Bentuk ini mengikuti nama yang terdapat dalam teks Masoret pada ayat ini serta ejaan Indonesia yang mudah dibaca; bentuk terkait, Esybaal, dicatat dalam catatan kaki.
- source_word: בְּמָלְכוֹ
  choice: ketika ia mulai memerintah
  rationale: Konstruksi ini menyatakan waktu ketika usia raja disebut dalam rumusan pemerintahan. Kata 'mulai' membuat hubungan waktunya alami dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: atas Israel
  rationale: Dalam konteks kerajaan, preposisi עַל menunjukkan pihak yang berada di bawah kekuasaan raja.
- source_word: וּשְׁתַּיִם שָׁנִים מָלָךְ
  choice: dan ia memerintah selama dua tahun
  rationale: Terjemahan ini mempertahankan rumusan masa pemerintahan sekaligus memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: אַךְ
  choice: Namun
  rationale: Kata ini menandai kontras antara kekuasaan Isyboset atas Israel dan keberpihakan Yehuda kepada Daud.
- source_word: בֵּית יְהוּדָה
  choice: kaum Yehuda
  rationale: Secara harfiah berarti 'keluarga/kaum Yehuda' dan berfungsi sebagai sebutan kolektif bagi suku atau komunitas politik Yehuda. 'Kaum Yehuda' mempertahankan sifat kolektifnya tanpa terasa kaku.
- source_word: הָיוּ אַחֲרֵי דָוִד
  choice: berpihak kepada Daud
  rationale: Ungkapan harfiah 'berada di belakang/mengikuti Daud' dalam konteks ini menyatakan dukungan atau kesetiaan politik. 'Berpihak kepada' menyampaikan maknanya tanpa menentukan kadar kesetiaan lebih jauh.
