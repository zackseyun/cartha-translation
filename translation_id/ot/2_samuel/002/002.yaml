base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/002.yaml
  text: 'So David went up there[a], and also his two wives: Ahinoam the Jezreelite and Abigail, the wife of Nabal the Carmelite.'
translation:
  language: id
  text: 'Daud pun naik ke sana bersama kedua istrinya: Ahinoam, perempuan Yizreel, dan Abigail, istri Nabal—Nabal itu orang Karmel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל שָׁם
  choice: naik ke sana
  rationale: Kata kerja עלה menyatakan gerak naik atau menuju tempat yang lebih tinggi, sedangkan שָׁם menunjuk tempat tujuan yang telah disebut dalam konteks.
- source_word: וְגַם שְׁתֵּי נָשָׁיו
  choice: bersama kedua istrinya
  rationale: Dalam konteks perjalanan, ungkapan ini menambahkan kedua istri Daud sebagai orang-orang yang ikut pergi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan jumlah serta hubungan kepemilikan.
- source_word: אֲחִינֹעַם הַיִּזְרְעֵלִית
  choice: Ahinoam, perempuan Yizreel
  rationale: Kata nisbah feminin הַיִּזְרְעֵלִית menunjukkan asal Ahinoam dari Yizreel. 'Perempuan Yizreel' jelas dan wajar bagi pembaca Indonesia.
- source_word: וַאֲבִיגַיִל אֵשֶׁת נָבָל
  choice: dan Abigail, istri Nabal
  rationale: Terjemahan ini mempertahankan cara teks Ibrani mengenali Abigail melalui hubungannya dengan Nabal, walaupun dalam alur cerita ia kemudian menjadi istri Daud.
- source_word: הַכַּרְמְלִי
  choice: orang Karmel
  rationale: Kata nisbah maskulin ini menerangkan Nabal sebagai orang yang berasal dari Karmel; pilihan ini lebih alami dalam bahasa Indonesia daripada bentuk transliterasi gelar.
