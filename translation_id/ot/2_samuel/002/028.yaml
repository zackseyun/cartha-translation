  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְקַ֤ע יוֹאָב֙ בַּ/שּׁוֹפָ֔ר וַ/יַּֽעַמְדוּ֙ כָּל הָ/עָ֔ם וְ/לֹֽא יִרְדְּפ֥וּ ע֖וֹד אַחֲרֵ֣י יִשְׂרָאֵ֑ל וְ/לֹֽא יָסְפ֥וּ ע֖וֹד לְ/הִלָּחֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/028.yaml
  text: Then Joab blew the trumpet[a], and all the people stood still, and they no longer pursued Israel or continued to fight.
translation:
  language: id
  text: Lalu Yoab meniup sangkakala[a]. Seluruh pasukan berhenti; mereka tidak lagi mengejar Israel dan tidak melanjutkan pertempuran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tanduk"; kata Ibrani שׁוֹפָר merujuk pada tanduk yang digunakan sebagai alat pemberi isyarat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַע
  choice: meniup
  rationale: Dengan בַּשּׁוֹפָר, verba תקע secara idiomatis berarti meniup atau membunyikan alat pemberi isyarat. "Meniup" alami dalam bahasa Indonesia dan mempertahankan tindakan konkret.
- source_word: בַּשּׁוֹפָר
  choice: sangkakala
  rationale: שׁוֹפָר adalah tanduk yang digunakan sebagai alat pemberi isyarat. "Sangkakala" merupakan padanan Indonesia yang lazim dalam konteks Alkitab tanpa menentukan bahannya secara lebih khusus daripada teks sumber.
- source_word: וַיַּעַמְדוּ כָּל הָעָם
  choice: Seluruh pasukan berhenti
  rationale: עמד secara harfiah berarti berdiri, tetapi dalam konteks pengejaran militer menyatakan bahwa mereka berhenti atau menghentikan gerak. הָעָם secara leksikal berarti rakyat/orang-orang, namun di sini jelas menunjuk pasukan Yoab; "pasukan" menyampaikan acuan kontekstual secara wajar.
- source_word: יִרְדְּפוּ עוֹד אַחֲרֵי יִשְׂרָאֵל
  choice: tidak lagi mengejar Israel
  rationale: רדף אחרי berarti mengejar, sedangkan negasi dengan עוֹד menghasilkan arti "tidak lagi". Nama kolektif "Israel" dipertahankan sebagaimana teks Ibrani.
- source_word: וְלֹא יָסְפוּ עוֹד לְהִלָּחֵם
  choice: dan tidak melanjutkan pertempuran
  rationale: יסף dengan infinitif berarti menambah, meneruskan, atau kembali melakukan sesuatu. Dalam konteks ini, klausa menyatakan bahwa mereka tidak meneruskan pertempuran; rumusan ini juga menjaga kemungkinan bahwa tindakan perang secara keseluruhan dihentikan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Sangkakala" dipertahankan sebagai istilah yang dikenal luas, sementara catatan kaki menjelaskan bentuk konkret alat itu. "Pasukan" dipilih daripada "orang-orang" karena konteks militernya tegas dan agar pembaca tidak salah memahami kelompok yang berhenti.
