  naturalness: Bahasa draf jelas dan modern. “Naik” tetap wajar dalam konteks perjalanan menuju kota-kota Yehuda dan lebih baik mempertahankan idiom arah serta pengulangan yang disengaja dalam teks sumber.
  terminology: “Yahweh,” “Yehuda,” dan “Hebron” konsisten. Catatan kaki untuk Yahweh tepat dan jangkar [a] ditempatkan pada kemunculan pertama nama ilahi.
