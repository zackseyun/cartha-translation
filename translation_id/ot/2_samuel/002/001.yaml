  to: Sesudah itu, Daud meminta petunjuk kepada Yahweh[a], katanya, “Haruskah aku naik ke salah satu kota di Yehuda?” Yahweh menjawabnya, “Naiklah.” Lalu Daud bertanya, “Ke manakah aku harus naik?” Jawab-Nya, “Ke Hebron.”
