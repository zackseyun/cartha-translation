  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וַ/יִּשְׁאַל֩ דָּוִ֨ד בַּֽ/יהוָ֤ה לֵ/אמֹר֙ הַ/אֶעֱלֶ֗ה בְּ/אַחַת֙ עָרֵ֣י יְהוּדָ֔ה וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלָ֖י/ו עֲלֵ֑ה וַ/יֹּ֧אמֶר דָּוִ֛ד אָ֥נָה אֶעֱלֶ֖ה וַ/יֹּ֥אמֶר חֶבְרֹֽנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/001.yaml
  text: After this[a], David inquired of Yahweh, saying, “Shall I go up into one of the cities of Judah?” And Yahweh said to him, “Go up.” Then David said, “Where shall I go up?” And he said, “To Hebron.”
translation:
  language: id
  text: Sesudah itu, Daud meminta petunjuk kepada Yahweh[a], katanya, “Haruskah aku naik ke salah satu kota di Yehuda?” Yahweh menjawabnya, “Naiklah.” Lalu Daud bertanya, “Ke manakah aku harus naik?” Jawab-Nya, “Ke Hebron.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan ini menandai peralihan waktu dalam narasi. “Sesudah itu” alami dalam bahasa Indonesia modern dan tetap mempertahankan kaitannya dengan peristiwa sebelumnya.
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konteks ini, konstruksi שׁאל dengan nama ilahi berarti mencari arahan ilahi, bukan sekadar mengajukan pertanyaan biasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif ini memperkenalkan isi pertanyaan Daud. “Katanya” menyampaikan fungsi tersebut secara ringkas dan wajar.
- source_word: הַאֶעֱלֶה
  choice: Haruskah aku pergi
  rationale: Bentuk tanya ini meminta keputusan atau izin ilahi. “Haruskah” mengungkapkan nuansa tersebut; “pergi” lebih alami dalam pertanyaan bahasa Indonesia daripada mempertahankan idiom geografis “naik” secara kaku.
- source_word: בְּאַחַת עָרֵי יְהוּדָה
  choice: ke salah satu kota di Yehuda
  rationale: Frasa ini menunjuk gerak menuju satu kota di wilayah Yehuda. Susunan ini jelas dan idiomatis dalam bahasa Indonesia.
- source_word: עֲלֵה
  choice: Pergilah ke sana
  rationale: Imperatif itu memerintahkan Daud melakukan perjalanan yang ditanyakannya. Tambahan “ke sana” memperjelas bahwa jawaban mengizinkan perjalanan ke wilayah Yehuda tanpa menyebut tujuan spesifik terlebih dahulu.
- source_word: אָנָה אֶעֱלֶה
  choice: Ke mana aku harus pergi?
  rationale: אָנָה menanyakan tujuan. Bentuk ini alami dalam dialog Indonesia dan tetap menunjukkan bahwa Daud meminta lokasi tertentu.
- source_word: חֶבְרֹנָה
  choice: Ke Hebron
  rationale: Akhiran direktif pada nama tempat menandakan gerak menuju Hebron; bahasa Indonesia menyatakannya dengan preposisi “ke”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk “Yahweh” mempertahankan nama itu dan diberi catatan agar pembaca mengenali padanan tradisionalnya.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Dialog dibuat alami bagi pembaca Indonesia masa kini. Idiom arah עלה diterjemahkan menurut fungsi kontekstualnya sebagai “pergi”, sementara hubungan dengan tujuan wilayah Yehuda tetap jelas.
