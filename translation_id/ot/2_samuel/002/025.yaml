base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/025.yaml
  text: Then the sons of Benjamin gathered together behind Abner[a], became one band[b], and took their stand on the top of one hill.
translation:
  language: id
  text: Lalu orang-orang Benyamin berkumpul di belakang Abner[a], menjadi satu kelompok[b], dan mengambil posisi di puncak sebuah bukit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengikuti Abner.” Ungkapan Ibrani ini dapat menunjukkan posisi (“di belakang”) atau mengikuti dan berpihak kepada Abner.
    reason: lexical_alternative
  - marker: b
    text: Atau “satu rombongan” atau “satu pasukan.” Kata Ibrani ini menunjuk kepada suatu kelompok yang terhimpun dan bersatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: berkumpul
  rationale: Bentuk hitpael dari קבץ menyatakan tindakan berkumpul secara kolektif; “berkumpul” alami dalam narasi perang dan sesuai dengan tindakan menghimpun diri kembali.
- source_word: בְנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan harfiah “anak-anak Benyamin” menunjuk kepada kelompok suku. “Keturunan Benyamin” mempertahankan unsur kekerabatan tanpa memberi kesan bahwa mereka semua anak langsung Benyamin.
- source_word: אַחֲרֵי אַבְנֵר
  choice: di belakang Abner
  rationale: אַחֲרֵי dapat menunjukkan posisi di belakang maupun tindakan mengikuti. Dalam konteks pertempuran, pilihan ini mempertahankan gambaran spasial sekaligus memungkinkan nuansa bahwa mereka berhimpun di bawah pimpinan Abner.
- source_word: לַאֲגֻדָּה אֶחָת
  choice: menjadi satu pasukan
  rationale: אֲגֻדָּה menggambarkan kelompok yang terikat atau bersatu. “Pasukan” sesuai dengan konteks militer, sedangkan “satu” mempertahankan penekanan pada kesatuan mereka.
- source_word: וַיַּעַמְדוּ
  choice: mengambil posisi
  rationale: Dalam narasi pertempuran, עמד menyatakan bahwa mereka berdiri atau menempatkan diri untuk bertahan; “mengambil posisi” menyampaikan fungsi ini dengan bahasa Indonesia yang wajar.
- source_word: עַל רֹאשׁ גִּבְעָה אֶחָת
  choice: di puncak sebuah bukit
  rationale: רֹאשׁ dalam pemakaian topografis berarti “puncak.” Bentuk אֶחָת di sini dapat dinyatakan secara alami dengan “sebuah,” karena bukit itu belum diidentifikasi secara khusus.
