  text: וְ/יוֹאָ֨ב בֶּן צְרוּיָ֜ה וְ/עַבְדֵ֤י דָוִד֙ יָֽצְא֔וּ וַֽ/יִּפְגְּשׁ֛וּ/ם עַל בְּרֵכַ֥ת גִּבְע֖וֹן יַחְדָּ֑ו וַ/יֵּ֨שְׁב֜וּ אֵ֤לֶּה עַל הַ/בְּרֵכָה֙ מִ/זֶּ֔ה וְ/אֵ֥לֶּה עַל הַ/בְּרֵכָ֖ה מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/013.yaml
  text: And Joab the son of Zeruiah and the servants of David went out and met them together by the pool of Gibeon. And these sat on one side of the pool[a], and those on the other side of the pool.
translation:
  language: id
  text: 'Lalu Yoab, anak Zeruya, dan para hamba Daud keluar dan bersama-sama bertemu dengan mereka di dekat kolam Gibeon[a]. Lalu mereka duduk: pihak yang satu di satu sisi kolam itu dan pihak yang lain di sisi yang lain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “waduk Gibeon”; kata Ibrani ini dapat menunjuk pada kolam buatan atau tempat penampungan air.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: Lalu Yoab
  rationale: Konjungsi naratif Ibrani disampaikan dengan “Lalu”, yang alami dalam narasi Indonesia dan menunjukkan kelanjutan peristiwa tanpa memperberat gaya.
- source_word: בֶּן צְרוּיָה
  choice: anak Zeruya
  rationale: Sebutan kekerabatan diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: וְ/עַבְדֵי דָוִד
  choice: dan para hamba Daud
  rationale: “Hamba” mempertahankan hubungan leksikal dengan עבד dan tidak mempersempit maknanya menjadi “prajurit”, meskipun konteksnya bersifat militer.
- source_word: יָצְאוּ
  choice: keluar
  rationale: Menerjemahkan verba umum יצא secara langsung tanpa menambahkan gagasan ‘berbaris’ yang tidak dinyatakan.
- source_word: וַֽ/יִּפְגְּשׁ֛וּ/ם
  choice: dan bertemu dengan mereka
  rationale: Akhiran pronominal objek merujuk kepada Abner dan orang-orangnya dari ayat sebelumnya; “bertemu dengan mereka” alami dan tetap netral mengenai sifat pertemuan itu.
- source_word: עַל בְּרֵכַת גִּבְעוֹן
  choice: di tepi kolam Gibeon
  rationale: Konteks menempatkan kedua kelompok pada sisi-sisi yang berlawanan; “di tepi” menyampaikan lokasi di dekat kolam secara alami. בְּרֵכָה dapat berarti kolam atau waduk, sehingga alternatif dicatat dalam catatan kaki.
- source_word: יַחְדָּו
  choice: berhadapan
  rationale: Dalam konteks dua kelompok yang bertemu lalu duduk pada sisi berlawanan, “berhadapan” menyampaikan bahwa mereka hadir bersama di tempat yang sama sekaligus memperjelas tata ruang tanpa menyiratkan pertempuran.
- source_word: וַ/יֵּשְׁבוּ
  choice: Mereka duduk
  rationale: ישב dalam adegan ini paling langsung berarti duduk; subjek jamak dibuat eksplisit agar kalimat Indonesia mengalir alami.
- source_word: אֵלֶּה ... וְ/אֵלֶּה
  choice: kelompok yang satu ... dan kelompok yang lain
  rationale: Bahasa Indonesia kurang alami memakai pasangan demonstratif harfiah “yang ini ... yang itu” sebagai subjek manusia; “kelompok yang satu ... kelompok yang lain” mempertahankan kontras kedua pihak tanpa menentukan identitas mereka lebih jauh.
- source_word: עַל הַ/בְּרֵכָה מִ/זֶּה ... עַל הַ/בְּרֵכָה מִ/זֶּה
  choice: di sisi kolam yang ini ... di sisi kolam yang itu
  rationale: Ungkapan Ibrani menunjuk dua sisi yang berlawanan. Terjemahan ini mempertahankan deiksis “ini/itu” sambil menyatakan hubungan spasial dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah “para hamba Daud” dipertahankan meski konteksnya militer, sedangkan susunan kelompok diperjelas secara alami tanpa menambahkan penafsiran teologis.
