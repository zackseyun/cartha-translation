base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/030.yaml
  text: And Joab returned from pursuing Abner[a], and he gathered all the people. When they were counted, nineteen men of David’s servants were missing, besides Asahel.
translation:
  language: id
  text: Setelah berhenti mengejar Abner, Yoab kembali dan mengumpulkan seluruh pasukannya. Ketika mereka dihitung, sembilan belas orang dari antara hamba-hamba Daud tidak ada, belum termasuk Asael.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “sembilan belas orang dan Asael.” Susunan ini menunjukkan bahwa Asael dihitung sebagai tambahan di luar kesembilan belas orang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב מֵאַחֲרֵי אַבְנֵר
  choice: kembali setelah mengejar Abner
  rationale: שׁוב berarti kembali, sedangkan מֵאַחֲרֵי dalam konteks pertempuran menunjukkan bahwa Yoab kembali dari pengejarannya terhadap Abner. Ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan hubungan dengan bentuk Ibrani.
- source_word: וַיִּקְבֹּץ אֶת כָּל הָעָם
  choice: dan mengumpulkan seluruh pasukannya
  rationale: עָם secara dasar berarti rakyat atau orang-orang, tetapi dalam konteks ini menunjuk kepada rombongan tempur di bawah Yoab. 'Pasukannya' menyampaikan rujukan kontekstual secara jelas dan alami.
- source_word: וַיִּפָּקְדוּ
  choice: Ketika mereka dihitung
  rationale: Bentuk nifal dari פקד di sini menyatakan bahwa orang-orang itu dihitung atau didata setelah pertempuran. Klausa temporal menghasilkan alur narasi Indonesia yang wajar.
- source_word: מֵעַבְדֵי דָוִד
  choice: dari antara para hamba Daud
  rationale: עֶבֶד berarti hamba atau pelayan dan dalam lingkungan kerajaan juga dapat menunjuk kepada orang-orang yang mengabdi sebagai prajurit. 'Para hamba Daud' mempertahankan transparansi leksikal.
- source_word: תִּשְׁעָה עָשָׂר אִישׁ
  choice: sembilan belas orang
  rationale: Terjemahan langsung bilangan dan אִישׁ; 'orang' terdengar alami setelah angka dalam bahasa Indonesia, sementara konteks menunjukkan bahwa mereka adalah laki-laki dalam pasukan.
- source_word: וַעֲשָׂה אֵל
  choice: belum termasuk Asael
  rationale: Teks yang disajikan memisahkan secara ortografis nama Asael; konteks dan susunan 'sembilan belas orang dan Asael' menunjukkan bahwa Asael merupakan korban tambahan di luar kesembilan belas orang itu. 'Belum termasuk' menyampaikan hubungan penjumlahan tersebut dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'pasukannya' dipakai sesuai konteks militer; 'para hamba Daud' dipertahankan untuk mencerminkan istilah sumber. Penanda catatan kaki ditempatkan setelah klausa yang menjelaskan jumlah korban.
