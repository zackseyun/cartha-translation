  yaml_path: translation/ot/2_samuel/002/003.yaml
  text: And David brought up the men who were with him[a], each man with his household, and they settled in the towns of Hebron.
translation:
  language: id
  text: Daud membawa naik orang-orang yang bersamanya, masing-masing bersama seisi rumahnya, lalu mereka menetap di kota-kota Hebron.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di kota-kota di wilayah Hebron.” Ungkapan Ibrani ini mungkin menunjuk kepada permukiman-permukiman yang termasuk kawasan Hebron, bukan hanya pusat kotanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנָשָׁיו אֲשֶׁר עִמּוֹ
  choice: orang-orang yang bersamanya
  rationale: Ungkapan ini secara harfiah menunjuk kepada ‘orang-orangnya yang bersama dia’. Terjemahan ini wajar dalam bahasa Indonesia dan tetap menunjukkan rombongan Daud tanpa pengulangan posesif yang kaku.
- source_word: הֶעֱלָה
  choice: membawa ... naik ke sana
  rationale: Bentuk Hifil dari עלה berarti membawa atau menyuruh naik. Kata ‘naik’ mempertahankan nuansa perjalanan menuju Hebron di daerah perbukitan, sedangkan ‘ke sana’ membuat arah geraknya alami berdasarkan konteks ayat sebelumnya.
- source_word: אִישׁ וּבֵיתוֹ
  choice: masing-masing bersama seisi rumahnya
  rationale: אִישׁ berfungsi distributif, yakni setiap orang secara tersendiri, sedangkan בֵּיתוֹ mencakup rumah tangga, bukan semata-mata bangunan rumah. ‘Seisi rumahnya’ merupakan ungkapan Indonesia yang alami dan cukup luas.
- source_word: וַיֵּשְׁבוּ
  choice: lalu mereka menetap
  rationale: Dalam konteks perpindahan tempat tinggal, ישב menyatakan bahwa mereka tinggal atau bermukim di tempat itu. ‘Menetap’ menangkap hasil perpindahan tersebut.
- source_word: בְּעָרֵי חֶבְרוֹן
  choice: di kota-kota di wilayah Hebron
  rationale: Bentuk jamak עָרֵי berarti kota-kota atau permukiman-permukiman. Tambahan penjelas ‘di wilayah’ menyampaikan kemungkinan bahwa yang dimaksud ialah permukiman yang termasuk kawasan Hebron, bukan beberapa kota besar yang semuanya bernama Hebron.
- source_word: חֶבְרוֹן
  choice: Hebron
  rationale: Nama tempat ini ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
