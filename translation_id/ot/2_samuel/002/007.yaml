  text: וְ/עַתָּ֣ה תֶּחֱזַ֣קְנָה יְדֵי/כֶ֗ם וִֽ/הְיוּ֙ לִ/בְנֵי חַ֔יִל כִּי מֵ֖ת אֲדֹנֵי/כֶ֣ם שָׁא֑וּל וְ/גַם אֹתִ֗/י מָשְׁח֧וּ בֵית יְהוּדָ֛ה לְ/מֶ֖לֶךְ עֲלֵי/הֶֽם׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/007.yaml
  text: Let your hands be strong[a], and be valiant men, for your lord Saul is dead, and the house of Judah also has anointed me king over them.
translation:
  language: id
  text: Sekarang, hendaklah tangan kalian kuat[a] dan jadilah orang-orang yang gagah berani, sebab tuan kalian, Saul, telah mati. Aku pun telah diurapi oleh kaum Yehuda menjadi raja atas mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berbunyi “hendaklah tangan kalian kuat.” Ini adalah idiom untuk kekuatan, keberanian, dan keteguhan, sering kali dalam konteks keprajuritan.
    reason: Menjelaskan idiom Ibrani secara tepat tanpa menambahkan tindakan tertentu atau mengubah sapaan langsung.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: עַתָּה adalah penanda waktu yang eksplisit, sehingga diterjemahkan “Sekarang”; waw penghubung tidak perlu ditampilkan tersendiri karena hubungan dengan konteks sudah alami dalam bahasa Indonesia.
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: hendaklah tangan kalian kuat
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani tentang tangan yang kuat, dengan bentuk ajakan yang sesuai dengan nuansa yusif.
- source_word: וִהְיוּ לִבְנֵי חַיִל
  choice: dan jadilah orang-orang yang gagah berani
  rationale: בְּנֵי חַיִל menunjuk kepada orang yang berani, tangguh, dan cakap, sering dalam konteks keprajuritan; “orang-orang yang gagah berani” alami dan sesuai dengan kelompok laki-laki yang disapa.
- source_word: כִּי מֵת אֲדֹנֵיכֶם שָׁאוּל
  choice: sebab tuan kalian, Saul, telah mati
  rationale: כִּי bersifat menjelaskan alasan. “Tuan” menyampaikan kedudukan Saul sebagai penguasa yang dihormati, sedangkan “telah mati” menyatakan tindakan yang selesai dan relevan bagi keadaan saat itu.
- source_word: וְגַם אֹתִי מָשְׁחוּ בֵית יְהוּדָה
  choice: Aku pun telah diurapi oleh kaum Yehuda
  rationale: Bentuk pasif mempertahankan penekanan pada אֹתִי, “aku,” bersama גַם, tanpa mengaburkan bahwa בֵית יְהוּדָה adalah pelaku. “Kaum Yehuda” mengungkapkan sebutan kolektif “keluarga/rumah Yehuda” secara wajar dalam bahasa Indonesia.
- source_word: לְמֶלֶךְ עֲלֵיהֶם
  choice: menjadi raja atas mereka
  rationale: Frasa ini menyatakan jabatan yang diterima melalui pengurapan dan tetap mempertahankan hubungan pemerintahan yang dinyatakan oleh “atas mereka”.
theological_decisions:
- issue: Ungkapan maskulin לִבְנֵי חַיִל
  choice: orang-orang yang gagah berani
  alternative: orang-orang perkasa; hendaklah kalian berani
  rationale: Konteksnya adalah para laki-laki Yabesh-Gilead yang bertindak dalam lingkungan militer dan politik. Terjemahan tidak menetralkan ungkapan menjadi sifat abstrak saja, tetapi bahasa Indonesia tidak memerlukan kata “laki-laki” untuk mempertahankan rujukan kontekstual tersebut.
- issue: Gelar אֲדֹנֵיכֶם bagi Saul
  choice: tuan kalian
  alternative: penguasa kalian; junjungan kalian
  rationale: Istilah ini adalah gelar hormat bagi penguasa manusia, bukan nama ilahi. “Tuan kalian” menjaga nuansa kesetiaan politik tanpa memasukkan makna kristologis atau ilahi.
- issue: Cakupan גַם dalam וְגַם אֹתִי
  choice: Aku pun telah diurapi
  alternative: kaum Yehuda juga telah mengurapi aku
  rationale: Letak גַם bersama pronomina objek אֹתִי paling langsung menyoroti David sebagai pihak yang juga mengalami pengurapan. Susunan “Aku pun” mempertahankan fokus itu tanpa menentukan hubungan teologis lebih jauh antara kematian Saul dan pengangkatan David.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan Ibrani berbentuk jamak. Kalimat kedua dibuat pasif agar penekanan sumber pada “aku pun” tetap terasa.
