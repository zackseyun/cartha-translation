base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/023.yaml
  text: But he refused to turn aside[a], so Abner struck him in the belly with the butt end of the spear, and the spear came out behind him; and he fell there and died on the spot. And everyone who came to the place where Asahel had fallen and died stood still.
translation:
  language: id
  text: Namun, Asael menolak berpaling. Karena itu, Abner menghantam perutnya[a] dengan pangkal tombak. Tombak itu menembus dan keluar dari belakang tubuhnya. Asael jatuh di sana dan mati di tempat itu. Setiap orang yang tiba di tempat Asael jatuh dan mati berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani חֹמֶשׁ secara tradisional diterjemahkan “rusuk kelima” dalam sejumlah terjemahan lama, tetapi dalam konteks ini kemungkinan besar menunjuk secara lebih umum pada perut atau rongga perut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן לָסוּר
  choice: Asael menolak berbelok
  rationale: מָאֵן menyatakan penolakan, sedangkan סוּר berarti berbelok atau menyimpang dari arah semula. Nama Asael dipakai untuk memperjelas rujukan pelaku dalam bahasa Indonesia tanpa menambahkan isi baru.
- source_word: וַיַּכֵּהוּ
  choice: menghantam
  rationale: נכה berarti memukul atau menyerang. 'Menghantam' sesuai dengan serangan keras memakai pangkal tombak dan tidak secara keliru menyatakan bahwa ujung tombaklah yang dipakai.
- source_word: בְּאַחֲרֵי הַחֲנִית
  choice: dengan pangkal tombak
  rationale: Ungkapan ini menunjuk bagian belakang tombak. 'Pangkal tombak' merupakan ungkapan Indonesia yang alami dan jelas, berbeda dari mata tombak.
- source_word: אֶל הַחֹמֶשׁ
  choice: bagian perutnya
  rationale: חֹמֶשׁ adalah istilah anatomi yang sukar dipastikan. Dalam konteks ini, 'bagian perut' menyampaikan daerah tubuh yang dimaksud tanpa mempertahankan tafsiran tradisional 'rusuk kelima' sebagai sesuatu yang pasti.
- source_word: וַתֵּצֵא הַחֲנִית מֵאַחֲרָיו
  choice: Tombak itu menembus dan keluar dari belakang tubuhnya
  rationale: Teks menggambarkan tombak keluar dari sisi belakang tubuh Asael. Kata 'menembus' membuat hubungan tindakan dan akibat jelas dalam bahasa Indonesia, sementara 'belakang tubuhnya' tetap dekat dengan ungkapan Ibrani yang tidak menyebut punggung secara eksplisit.
- source_word: וַיָּמָת תַּחְתָּו
  choice: mati di tempat itu
  rationale: תַּחְתָּו secara harfiah berkaitan dengan tempat di bawah atau pada posisinya dan dalam konteks ini berarti ia mati tepat di tempat ia jatuh. 'Di tempat itu' alami dan tidak melebihkan unsur kecepatan yang tidak dinyatakan secara langsung.
- source_word: וַיַּעֲמֹדוּ
  choice: berhenti di sana
  rationale: עמד di sini menggambarkan orang-orang yang menghentikan gerak mereka ketika tiba di lokasi itu. 'Berhenti di sana' menyampaikan tindakan tersebut secara alami tanpa menambahkan keadaan batin seperti tertegun.
