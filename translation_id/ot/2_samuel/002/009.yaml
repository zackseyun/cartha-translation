base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/009.yaml
  text: and made him king over Gilead[a], over the Ashurites, over Jezreel, over Ephraim, over Benjamin, and over all Israel.
translation:
  language: id
  text: Ia mengangkatnya menjadi raja atas Gilead, atas orang-orang Asyur[a], atas Yizreel, atas Efraim, atas Benyamin, dan atas seluruh Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang Asyur.” Sebagian memahami kata ini sebagai “Asyer,” yang merujuk pada suku atau wilayah Asyer.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּמְלִכֵהוּ
  choice: Ia mengangkatnya menjadi raja
  rationale: Bentuk Hifil dari מלך dengan akhiran orang ketiga tunggal maskulin menyatakan tindakan menjadikan atau menobatkan seseorang sebagai raja. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: אֶל / עַל
  choice: atas
  rationale: Dalam konteks pengangkatan raja dengan wilayah dan kelompok sebagai objek, kedua preposisi menunjukkan lingkup kekuasaan. 'Atas' menyampaikan pemerintahan atau dominion secara wajar.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Bentuk nama wilayah yang lazim dalam bahasa Indonesia.
- source_word: הָאֲשׁוּרִי
  choice: orang Asyur
  rationale: Teks Masoret menunjuk pada bentuk gentilisia tunggal berartikel yang dapat dipakai secara kolektif. Karena bentuk ini sulit dan mungkin dipahami sebagai 'Asyer', bacaan teks dipertahankan dalam teks utama dan alternatifnya dicatat dalam catatan kaki.
- source_word: יִזְרְעֶאל
  choice: Yizreel
  rationale: Transliterasi Ibrani yang sesuai untuk nama tempat ini dan mudah dikenali dalam bahasa Indonesia.
- source_word: אֶפְרַיִם
  choice: Efraim
  rationale: Bentuk baku nama suku dalam tradisi bahasa Indonesia.
- source_word: בִּנְיָמִן
  choice: Benyamin
  rationale: Bentuk baku nama suku dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל כֻּלֹּה
  choice: seluruh Israel
  rationale: כֻּלֹּה menegaskan cakupan Israel secara utuh; 'seluruh Israel' ringkas, alami, dan tepat.
theological_decisions:
- issue: Identitas הָאֲשׁוּרִי
  choice: orang Asyur
  alternative: Asyer, yakni suku atau wilayah Asyer
  rationale: Teks utama mengikuti vokalisasi Teks Masoret tanpa mengoreksinya secara diam-diam, sedangkan kemungkinan bahwa bentuk itu merujuk kepada Asyer dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'atas' dipertahankan untuk mencerminkan susunan wilayah dan kelompok dalam teks Ibrani serta menegaskan luas pemerintahan.
