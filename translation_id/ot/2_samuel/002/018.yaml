base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/018.yaml
  text: 'The three sons of Zeruiah were there: Joab[a], Abishai, and Asahel. And Asahel was swift on his feet like one of the gazelles that are in the field.'
translation:
  language: id
  text: 'Ketiga anak Zeruya ada di sana: Yoab, Abisai, dan Asael. Asael cepat berlari, seperti salah seekor kijang di padang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti salah seekor gazel di padang.” Kata Ibrani צְבִי dapat diterjemahkan lebih luas sebagai hewan liar sejenis rusa, meskipun “gazel” merupakan padanan yang lebih khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: ada di sana
  rationale: Ungkapan ini menyatakan kehadiran mereka di tempat kejadian; bentuk ini alami dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: שְׁלֹשָׁה בְּנֵי צְרוּיָה
  choice: ketiga anak Zeruya
  rationale: Bentuk 'ketiga' menunjukkan kelompok tiga orang tertentu yang kemudian disebutkan satu per satu.
- source_word: יוֹאָב וַאֲבִישַׁי וַעֲשָׂהאֵל
  choice: Yoab, Abisai, dan Asael
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: קַל בְּרַגְלָיו
  choice: sangat cepat berlari
  rationale: Secara harfiah berkaitan dengan ringan atau cepat pada kakinya, tetapi dalam konteks ini idiom tersebut menyatakan kecepatan berlari. 'Sangat' menyampaikan sifat menonjol yang ditegaskan oleh perumpamaan berikutnya.
- source_word: כְּאַחַד הַצְּבָיִם
  choice: seperti salah satu kijang
  rationale: צְבִי paling tepat menunjuk pada gazel atau sejenis kijang liar yang terkenal cepat; 'kijang' merupakan padanan umum yang alami bagi pembaca Indonesia.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: di padang
  rationale: Padanan ringkas ini mempertahankan gambaran satwa liar di kawasan terbuka tanpa mempersempit makna שָׂדֶה secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kalimat kedua tidak diawali 'dan' karena kesinambungan narasi sudah jelas dalam bahasa Indonesia. Istilah 'kijang' dipakai dalam teks utama karena lebih mudah dipahami, sementara padanan zoologis yang lebih khusus dicatat dalam catatan kaki.
