  text: וַ/תְּהִ֧י הַ/מִּלְחָמָ֛ה קָשָׁ֥ה עַד מְאֹ֖ד בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יִּנָּ֤גֶף אַבְנֵר֙ וְ/אַנְשֵׁ֣י יִשְׂרָאֵ֔ל לִ/פְנֵ֖י עַבְדֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/017.yaml
  text: The battle was very fierce that day[b][a], and Abner and the men of Israel were defeated before the servants of David.
translation:
  language: id
  text: Pada hari itu pertempuran berlangsung sangat sengit[a], dan Abner serta orang-orang Israel dikalahkan di hadapan hamba-hamba Daud[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertempuran pada hari itu sangat berat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “hamba-hamba Daud”; dalam konteks ini yang dimaksud ialah pasukan atau para pengikut Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּלְחָמָה
  choice: pertempuran
  rationale: Dalam konteks ini מִלְחָמָה menunjuk pada satu pertempuran tertentu, bukan perang berkepanjangan.
- source_word: קָשָׁה עַד מְאֹד
  choice: sangat sengit
  rationale: קָשָׁה berarti keras atau berat; ketika menerangkan pertempuran, 'sangat sengit' menyampaikan intensitas ungkapan עַד מְאֹד secara alami.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Terjemahan langsung dan wajar untuk ungkapan waktu Ibrani ini.
- source_word: וַיִּנָּגֶף
  choice: dikalahkan
  rationale: Bentuk Nifal נָגַף dalam konteks militer berarti mengalami kekalahan di hadapan pihak lawan, bukan sekadar terluka secara jasmani.
- source_word: אַבְנֵר
  choice: Abner
  rationale: Nama diri dialihaksarakan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאַנְשֵׁי יִשְׂרָאֵל
  choice: serta orang-orang Israel
  rationale: Mempertahankan unsur אַנְשֵׁי, 'orang-orang/laki-laki dari', tanpa menambahkan secara eksplisit bahwa mereka adalah prajurit, meskipun konteks menunjukkan pasukan.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan idiom Ibrani bagi kekalahan militer di depan atau oleh pasukan lawan.
- source_word: עַבְדֵי דָוִד
  choice: hamba-hamba Daud
  rationale: Terjemahan formal עַבְדֵי yang mempertahankan hubungan pengabdian kepada Daud; dalam konteks ini istilah tersebut menunjuk kepada orang-orang yang bertugas sebagai pasukannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Berlangsung sangat sengit' dipakai agar predikasi Ibrani terdengar alami, sedangkan 'di hadapan' dan 'hamba-hamba Daud' mempertahankan citra serta istilah sumber; catatan kaki menjelaskan makna militernya.
