base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/015.yaml
  text: 'So they arose and crossed over by number: twelve for Benjamin and for Ish-bosheth the son of Saul[d][c][b][a], and twelve from the servants of David.'
translation:
  language: id
  text: 'Maka mereka bangkit dan menyeberang dengan jumlah yang telah dihitung: dua belas orang dari pihak Benyamin dan Isyboset, anak Saul,[a][b][c] dan dua belas orang dari para hamba Daud.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melewati” atau “bergerak ke seberang.” Kata Ibrani ini dapat menyatakan gerakan melintasi atau menuju tempat yang ditentukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “untuk Benyamin dan untuk Isyboset.” Preposisi Ibrani ini dapat menyatakan afiliasi atau pihak; dapat juga diterjemahkan “dari Benyamin dan dari pihak Isyboset.”
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani di sini memakai nama “Isyboset”; dalam bagian lain dari tradisi Perjanjian Lama terdapat bentuk nama yang berkaitan, “Esbaal.”
    reason: alternative_reading
  - marker: d
    text: Atau “dari hamba-hamba Daud” atau, lebih interpretatif, “dari orang-orang Daud.” Kata Ibrani yang diterjemahkan “hamba” dalam konteks kerajaan dan militer dapat menunjuk para pengikut atau prajurit yang melayani Daud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: mereka bangkit
  rationale: Bentuk naratif dari קום menyatakan tindakan berikutnya; “bangkit” mempertahankan corak narasi Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיַּעַבְרוּ
  choice: maju
  rationale: עבר dapat berarti menyeberang, lewat, atau bergerak ke tempat yang dituju. Dalam konteks para peserta tampil menuju arena perkelahian, “maju” terdengar alami tanpa memastikan adanya penyeberangan geografis.
- source_word: בְמִסְפָּר
  choice: menurut jumlah yang ditetapkan
  rationale: Ungkapan ini menunjukkan bahwa para peserta tampil sesuai hitungan yang telah disepakati. Perumusan ini lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah “menurut jumlah”.
- source_word: שְׁנֵים עָשָׂר
  choice: dua belas orang
  rationale: Kata “orang” ditambahkan secara wajar karena yang dihitung adalah para peserta laki-laki.
- source_word: לְבִנְיָמִן וּלְאִישׁ בֹּשֶׁת
  choice: mewakili Benyamin dan Isyboset
  rationale: Preposisi ל menandai pihak atau afiliasi. “Mewakili” menyampaikan fungsi kedua belas orang dalam pertandingan, sambil tetap memberi catatan tentang kemungkinan terjemahan yang lebih harfiah.
- source_word: בֶּן שָׁאוּל
  choice: anak Saul
  rationale: Sebutan hubungan keluarga diterjemahkan langsung dan alami.
- source_word: מֵעַבְדֵי דָוִד
  choice: dari para hamba Daud
  rationale: עבדים secara harfiah berarti “hamba-hamba”, tetapi dalam konteks kerajaan dan militer dapat menunjuk para pengikut atau prajurit yang mengabdi kepada Daud.
