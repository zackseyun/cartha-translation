  naturalness: Bahasa draf umumnya jelas dan bernada naratif modern. Revisi memakai “menyeberang” untuk memelihara makna verba sumber, dan “dengan jumlah yang telah dihitung” sebagai padanan Indonesia yang lebih wajar tanpa menyatakan bahwa jumlah itu telah ditetapkan.
