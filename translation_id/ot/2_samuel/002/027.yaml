base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/027.yaml
  text: Joab said[a], “As God lives, if you had not spoken, then from the morning the people would have gone up[b], each from following his brother.”
translation:
  language: id
  text: Kata Yoab, “Demi Allah yang hidup, seandainya engkau tidak berbicara, maka pasukan itu tentu sudah sejak pagi[a] beranjak[b], masing-masing berhenti mengikuti saudaranya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: dari pagi; dapat juga diterjemahkan: sejak pagi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau secara lebih harfiah: pergi naik. Dalam konteks ini, ungkapan itu dapat menunjuk pada menarik diri dan menghentikan pengejaran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי הָאֱלֹהִים
  choice: Demi Allah yang hidup
  rationale: Ungkapan sumpah baku ini dipertahankan dalam bentuk yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: לוּלֵא דִּבַּרְתָּ
  choice: seandainya engkau tidak berbicara
  rationale: Bentuk ini menyampaikan syarat kontrafaktual dan mempertahankan verba umum 'berbicara' tanpa menambahkan objek yang tidak disebutkan dalam bahasa Ibrani.
- source_word: כִּי אָז
  choice: tentulah baru
  rationale: Gabungan ini menandai akibat dalam pernyataan kontrafaktual; 'tentulah' menyampaikan penegasan, sedangkan 'baru' membuat hubungan waktunya alami dalam konteks.
- source_word: מֵהַבֹּקֶר
  choice: pada pagi hari
  rationale: Dalam konteks penghentian pengejaran, frasa ini paling wajar dipahami sebagai batas waktu, yakni baru pada pagi hari. Bentuk harfiahnya dan kemungkinan 'sejak pagi' dipertahankan dalam catatan kaki.
- source_word: נַעֲלָה
  choice: mundur
  rationale: Dalam konteks militer, verba ini menunjuk pada pasukan yang beranjak atau menarik diri sehingga pengejaran berhenti. Catatan kaki mempertahankan gambaran dasar 'pergi naik'.
- source_word: אִישׁ מֵאַחֲרֵי אָחִיו
  choice: masing-masing berhenti mengejar saudaranya
  rationale: Secara harfiah ungkapan ini berarti 'masing-masing dari belakang saudaranya'. Dalam konteks, maksudnya ialah berhenti mengikuti atau mengejar sesama orang Israel; kata 'saudaranya' dipertahankan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' sesuai dengan ujaran langsung antarpemimpin. Susunan kalimat dibuat alami tanpa menghilangkan bentuk sumpah, sifat kontrafaktual, atau gambaran persaudaraan dalam teks Ibrani.
