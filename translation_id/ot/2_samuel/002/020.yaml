  yaml_path: translation/ot/2_samuel/002/020.yaml
  text: Abner turned behind him and said[a], “Are you Asahel?” And he said, “I am.”
translation:
  language: id
  text: Abner menoleh ke belakang dan berkata, “Engkaukah Asael?” Asael menjawab, “Akulah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֶן
  choice: menoleh
  rationale: Dalam konteks pengejaran, פנה menyatakan tindakan berbalik atau menoleh; bersama אַחֲרָיו, pilihan ini secara alami menggambarkan Abner menoleh ke arah orang di belakangnya.
- source_word: אַחֲרָיו
  choice: ke belakang
  rationale: Ungkapan ini mempertahankan arah spasial teks Ibrani, yaitu ke bagian belakang Abner.
- source_word: הֲאַתָּה זֶה
  choice: Engkaukah
  rationale: Gabungan partikel tanya, pronomina, dan demonstrativa berfungsi sebagai pertanyaan identifikasi. Dalam bahasa Indonesia, “Engkaukah Asael?” menyampaikan fungsi itu secara ringkas dan wajar tanpa menerjemahkan זֶה secara kaku.
- source_word: עֲשָׂהאֵל
  choice: Asael
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אָנֹכִי
  choice: Ya, aku
  rationale: Pronomina mandiri ini menjadi jawaban lengkap yang menegaskan identitas. Penambahan “Ya” membuat jawaban eliptis tersebut alami dalam bahasa Indonesia tanpa mengubah maksudnya.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, ringkas, dan bermartabat. “Engkau” mempertahankan ragam sapaan tunggal yang sesuai dengan narasi Alkitab, sedangkan “menoleh ke belakang” menyampaikan gerakan dalam adegan pengejaran secara alami.
