revisions:
- from: Mereka mengangkat jenazah Asael dan menguburkannya di makam ayahnya[a] yang berada di Betlehem. Kemudian Yoab dan anak buahnya berjalan sepanjang malam, dan hari menjadi terang bagi mereka ketika mereka tiba di Hebron.[b]
  to: Mereka membawa jenazah Asael dan menguburkannya di makam ayahnya[a], yang berada di Betlehem. Kemudian Yoab dan orang-orangnya melakukan perjalanan sepanjang malam, dan fajar menyingsing bagi mereka di Hebron.[b]
  rationale: Revisi menghapus "ketika mereka tiba" agar tidak menambahkan tindakan yang tidak dinyatakan oleh teks Ibrani. Ungkapan idiomatis tentang datangnya terang diterjemahkan secara alami sebagai "fajar menyingsing", sementara catatan kaki mempertahankan bentuk harfiahnya. Istilah pembawaan tubuh dan sebutan bagi orang-orang Yoab juga diperhalus untuk ketepatan serta register baku modern.
