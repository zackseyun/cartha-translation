base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/032.yaml
  text: They carried Asahel and buried him in his father's tomb[a], which was at Bethlehem. Then Joab and his men traveled all night[b], and daybreak came upon them at Hebron.
translation:
  language: id
  text: Mereka membawa jenazah Asael dan menguburkannya di makam ayahnya[a], yang berada di Betlehem. Kemudian Yoab dan orang-orangnya melakukan perjalanan sepanjang malam, dan fajar menyingsing bagi mereka di Hebron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kubur ayahnya.” Kata Ibrani קֶבֶר dapat berarti kubur atau makam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menjadi terang bagi mereka di Hebron.” Ungkapan Ibrani ini dapat diterjemahkan, “fajar menyingsing bagi mereka di Hebron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת־עֲשָׂהאֵל
  choice: Mereka mengangkat jenazah Asael
  rationale: נשא berarti mengangkat atau membawa. Penambahan eksplisit 'jenazah' wajar dalam bahasa Indonesia dan menjelaskan bahwa tubuh Asael dibawa untuk dimakamkan tanpa mengubah maksud konteks.
- source_word: וַיִּקְבְּרֻהוּ
  choice: menguburkannya
  rationale: קבר adalah kata kerja biasa untuk menguburkan seseorang.
- source_word: בְּקֶבֶר אָבִיו
  choice: di makam ayahnya
  rationale: קֶבֶר dapat menunjuk pada kubur maupun makam atau tempat pemakaman keluarga. 'Makam' alami untuk tempat penguburan seseorang dalam konteks ini, sementara alternatif 'kubur' dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בֵּית לָחֶם
  choice: yang berada di Betlehem
  rationale: Klausa relatif Ibrani menyatakan lokasi makam; 'berada di' melengkapinya secara alami dalam bahasa Indonesia.
- source_word: וַיֵּלְכוּ כָל־הַלַּיְלָה
  choice: berjalan sepanjang malam
  rationale: הלך berarti pergi atau berjalan. 'Berjalan sepanjang malam' mempertahankan gambaran gerak melalui darat tanpa menambahkan gagasan barisan militer yang tidak dinyatakan secara eksplisit.
- source_word: יוֹאָב וַאֲנָשָׁיו
  choice: Yoab dan anak buahnya
  rationale: אֲנָשָׁיו secara harfiah berarti 'orang-orangnya'. Dalam konteks pasukan, 'anak buahnya' merupakan ungkapan Indonesia yang alami dan tidak membatasi mereka secara berlebihan hanya sebagai prajurit formal.
- source_word: וַיֵּאֹר לָהֶם
  choice: hari menjadi terang bagi mereka
  rationale: Terjemahan ini dekat dengan idiom Ibrani 'menjadi terang bagi mereka' dan mempertahankan bentuk ungkapan sumber; makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: בְּחֶבְרוֹן
  choice: ketika mereka tiba di Hebron
  rationale: Preposisi ב menempatkan terangnya hari di Hebron. 'Ketika mereka tiba' menyampaikan hubungan lokatif dan arah perjalanan secara alami, tetapi karena verba 'tiba' tersirat dan bukan dinyatakan, hal itu dicatat sebagai alternatif interpretatif dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Asael, Yoab, Betlehem, dan Hebron. Struktur idiom אור dipertahankan cukup dekat dengan sumber, sedangkan catatan kaki menjelaskan maknanya.'
