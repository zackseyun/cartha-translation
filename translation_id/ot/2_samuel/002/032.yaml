  naturalness: 'Teks revisi memakai bahasa Indonesia baku modern dan naratif: "melakukan perjalanan sepanjang malam" serta "fajar menyingsing bagi mereka" terdengar alami tanpa mengorbankan bentuk atau makna sumber.'
