base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/022.yaml
  text: Abner said again to Asahel[a], “Turn aside from following me. Why should I strike you to the ground? Then how could I lift up my face to Joab your brother?”
translation:
  language: id
  text: Abner berkata lagi kepada Asael, “Berhentilah mengikutiku. Mengapa aku harus memukulmu hingga jatuh ke tanah? Lalu, bagaimana aku dapat mengangkat mukaku[a] di hadapan Yoab, saudaramu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagaimana aku dapat menghadapi Yoab, saudaramu?” Bahasa Ibrani secara harfiah berbunyi, “bagaimana aku dapat mengangkat mukaku kepada Yoab, saudaramu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד אַבְנֵר לֵאמֹר
  choice: Abner berkata lagi
  rationale: Ungkapan harfiah ‘menambahkan lagi untuk berkata’ menyatakan bahwa Abner berbicara sekali lagi; ‘berkata lagi’ alami dan mempertahankan unsur pengulangannya.
- source_word: סוּר לְךָ מֵאַחֲרָי
  choice: Berhentilah mengejar aku
  rationale: Secara harfiah berarti ‘berpalinglah dari belakangku.’ Dalam konteks Asael sedang memburu Abner, ‘berhentilah mengejar aku’ menyampaikan maksud spasial dan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: לָמָּה אַכֶּכָּה אַרְצָה
  choice: Mengapa aku harus memukulmu hingga jatuh ke tanah?
  rationale: Bentuk verba dapat berarti ‘memukul’ atau ‘merobohkan,’ sedangkan אַרְצָה berarti ‘ke tanah.’ Terjemahan ini mempertahankan gambaran serangan yang menjatuhkan Asael tanpa secara eksplisit menggantinya dengan ‘membunuh,’ meskipun akibat maut tersirat oleh konteks.
- source_word: וְאֵיךְ אֶשָּׂא פָנַי
  choice: Lalu bagaimana aku dapat mengangkat mukaku
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani ‘mengangkat muka,’ yang menyatakan kesanggupan menghadap seseorang tanpa rasa malu; catatan kaki menjelaskan makna idiomatisnya.
- source_word: אֶל יוֹאָב אָחִיךָ
  choice: di hadapan Yoab, saudaramu
  rationale: Preposisi אֶל menunjuk kepada orang yang harus dihadapi Abner. ‘Di hadapan’ membuat ungkapan ‘mengangkat muka’ jelas dan alami. אָחִיךָ diterjemahkan ‘saudaramu’ tanpa menentukan kakak atau adik, karena teks Ibrani tidak menyatakannya.
- source_word: עֲשָׂהאֵל / אַבְנֵר / יוֹאָב
  choice: Asael / Abner / Yoab
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab berbahasa Indonesia.
