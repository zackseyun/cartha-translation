base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/002/005.yaml
  text: Then David sent messengers to the men of Jabesh-gilead and said to them[a], “Blessed are you by Yahweh, because you have shown this kindness to your lord, to Saul[b], and have buried him.”
translation:
  language: id
  text: Lalu Daud mengirim utusan kepada orang-orang Yabesh-Gilead dan berkata kepada mereka, “Kalian diberkati oleh Yahweh, karena kalian telah melakukan kebaikan setia ini kepada tuan kalian, yaitu Saul, dan telah menguburkannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks narasi ini kata tersebut menunjuk kepada manusia yang diutus Daud, bukan makhluk surgawi.
- source_word: אַנְשֵׁי יָבֵישׁ גִּלְעָד
  choice: orang-orang Yabesh-Gilead
  rationale: Ungkapan Ibrani secara harfiah berarti 'laki-laki Yabesh-Gilead'; dalam bahasa Indonesia, 'orang-orang' secara alami menyebut warga atau para tokoh kota yang bertindak menguburkan Saul tanpa mengaburkan rujukan kelompoknya.
- source_word: בְּרֻכִים אַתֶּם לַיהוָה
  choice: Kalian diberkati oleh Yahweh
  rationale: Partisip pasif בְּרֻכִים menyatakan keadaan diberkati, bukan secara eksplisit sebuah permohonan; 'oleh Yahweh' menyampaikan Yahweh sebagai sumber berkat, sambil mencatat kemungkinan nuansa relasional dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: חֶסֶד
  choice: kesetiaan
  rationale: Dalam konteks penghormatan kepada raja yang telah wafat, tindakan penguburan merupakan perbuatan loyal; 'kesetiaan' lebih jelas menangkap unsur loyalitas dalam חֶסֶד daripada sekadar 'kebaikan'.
- source_word: אֲדֹנֵיכֶם
  choice: tuan kalian
  rationale: Istilah ini menyatakan kedudukan Saul sebagai penguasa mereka; 'tuan' mempertahankan bentuk tunggal dan nuansa penghormatan.
- source_word: עִם שָׁאוּל
  choice: Saul
  rationale: Aposisi Ibrani menjelaskan bahwa 'tuan kalian' adalah Saul; tanda koma dalam bahasa Indonesia menyampaikan hubungan ini secara alami.
- source_word: וַתִּקְבְּרוּ אֹתוֹ
  choice: dengan menguburkan dia
  rationale: Penguburan menjelaskan tindakan kesetiaan yang baru disebut; konstruksi 'dengan' membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memuat Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Daya ungkapan בְּרֻכִים אַתֶּם לַיהוָה
  choice: Kalian diberkati oleh Yahweh
  alternative: Kiranya kalian diberkati Yahweh; Kalian adalah orang-orang yang diberkati bagi Yahweh
  rationale: Bentuk Ibrani adalah partisip pasif yang paling langsung menyatakan keadaan diberkati. Preposisi ל dapat dipahami sebagai penanda sumber/agen dalam formula ini, meski nuansa 'bagi Yahweh' tetap mungkin dan dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Kalian' dipakai karena Daud berbicara kepada kelompok. Nama tempat ditulis 'Yabesh-Gilead' agar kedua unsur nama tetap terbaca sebagai satu nama majemuk.
