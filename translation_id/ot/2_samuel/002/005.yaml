  to: Lalu Daud mengirim utusan kepada orang-orang Yabesh-Gilead dan berkata kepada mereka, “Kalian diberkati oleh Yahweh, karena kalian telah melakukan kebaikan setia ini kepada tuan kalian, yaitu Saul, dan telah menguburkannya.”
