base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/021.yaml
  text: Because of your word and according to your heart[a], you have done all this greatness[c][b], to make your servant know it.
translation:
  language: id
  text: Oleh karena firman-Mu[a] dan sesuai dengan hati-Mu[b], Engkau telah melakukan seluruh kebesaran ini[c] untuk membuat hamba-Mu mengetahuinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi firman-Mu” atau “oleh karena janji-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sesuai dengan hati-Mu,” yaitu sesuai dengan maksud atau kehendak-Mu sendiri.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memakai bentuk tunggal, “seluruh kebesaran ini”; beberapa terjemahan mengungkapkannya sebagai “semua hal besar ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲבוּר דְּבָרְךָ
  choice: Oleh karena firman-Mu
  rationale: בַּעֲבוּר menyatakan sebab atau dasar, sedangkan דָּבָר tetap diterjemahkan secara luas sebagai “firman”; dalam konteks ini kata tersebut dapat merujuk pada apa yang telah Allah ucapkan, termasuk janji-Nya.
- source_word: וּכְלִבְּךָ
  choice: dan sesuai dengan hati-Mu
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang hati sebagai pusat maksud, kehendak, atau keinginan, tanpa menggantinya dengan penafsiran yang lebih abstrak.
- source_word: עָשִׂיתָ
  choice: Engkau telah melakukan
  rationale: Bentuk perfektif menunjukkan tindakan yang telah dilaksanakan dan masih relevan dalam doa Daud.
- source_word: אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: seluruh kebesaran ini
  rationale: Nomina Ibrani berbentuk tunggal dan abstrak. Terjemahan ini mempertahankan kebesaran itu sebagai satu kesatuan, bukan mengubahnya menjadi jamak “hal-hal besar”.
- source_word: לְהוֹדִיעַ
  choice: untuk membuat ... mengetahuinya
  rationale: Bentuk Hifil dari ידע bersifat kausatif, yaitu “menyebabkan seseorang mengetahui”; susunan ini mempertahankan nuansa tersebut.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, istilah ini merupakan ungkapan yang wajar bagi sikap rendah hati Daud di hadapan Allah.
theological_decisions:
- issue: Acuan “firman-Mu” dalam konteks perjanjian
  choice: firman-Mu
  alternative: janji-Mu; apa yang telah Kaukatakan
  rationale: Konteksnya mendukung pengertian janji Allah kepada Daud, tetapi kata Ibrani tetap lebih luas. “Firman-Mu” mempertahankan keluasan itu tanpa mempersempitnya menjadi kategori teologis tertentu.
- issue: Bahasa antropomorfis dalam “sesuai dengan hati-Mu”
  choice: Mempertahankan ungkapan “hati-Mu”
  alternative: sesuai dengan kehendak-Mu; sesuai dengan keinginan-Mu
  rationale: Teks Ibrani berbicara tentang maksud batin Allah dengan metafora hati. Mempertahankannya menjaga bentuk dan ketegangan bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi dipakai sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Ungkapan “seluruh kebesaran ini” sengaja mempertahankan nomina abstrak tunggal dari bahasa Ibrani, sementara struktur “membuat ... mengetahuinya” menjaga daya kausatif verba sumber.
