source:
  edition: WLC
  text: וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֣ה צְבָא֔וֹת אֱלֹהִ֖ים עַל יִשְׂרָאֵ֑ל וּ/בֵית֙ עַבְדְּ/ךָ֣ דָוִ֔ד יִהְיֶ֥ה נָכ֖וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/026.yaml
  text: And may your name be magnified forever[a], saying[b], ‘Yahweh of hosts is God over Israel,’ and may the house of your servant David be established before you.
translation:
  language: id
  text: Kiranya nama-Mu diagungkan untuk selama-lamanya[a], sehingga orang berkata, “Yahweh, Penguasa bala tentara, adalah Allah yang berkuasa atas Israel.” Kiranya rumah[b] hamba-Mu Daud tetap teguh di hadapan-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya nama-Mu dinyatakan besar untuk selama-lamanya.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah”. Di sini kata itu merujuk pada keluarga, keturunan, atau wangsa Daud, bukan hanya sebuah bangunan.
    reason: cultural_note
lexical_decisions:
- source_word: וְיִגְדַּל שִׁמְךָ
  choice: Kiranya nama-Mu diagungkan
  rationale: Bentuk verba dalam konteks doa menyatakan harapan atau permohonan. Bentuk pasif alami dalam bahasa Indonesia menyampaikan bahwa nama Allah dinyatakan besar atau mulia tanpa memberi kesan bahwa nama itu bertambah secara harfiah.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar dan bermartabat untuk keberlangsungan tanpa akhir.
- source_word: לֵאמֹר
  choice: sehingga orang berkata
  rationale: Dalam konteks ini לֵאמֹר memperkenalkan pengakuan yang akan diucapkan. Perumusan eksplisit ini lebih alami dalam bahasa Indonesia daripada bentuk harfiah 'dengan berkata' dan tetap menjaga hubungan dengan kutipan berikutnya.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Penguasa Bala Tentara
  rationale: Nama ilahi dipertahankan sebagai Yahweh. צְבָאוֹת menunjuk kepada bala tentara atau kumpulan pasukan; 'Penguasa Bala Tentara' menyampaikan daya gelar ilahi ini dengan lebih jelas dalam bahasa Indonesia modern daripada konstruksi kaku 'Yahweh bala tentara'.
- source_word: אֱלֹהִים עַל יִשְׂרָאֵל
  choice: adalah Allah atas Israel
  rationale: Preposisi עַל paling wajar menyatakan kekuasaan atau kedaulatan atas Israel, sambil mempertahankan bentuk pengakuan dalam teks.
- source_word: וּבֵית עַבְדְּךָ דָוִד
  choice: Kiranya keluarga hamba-Mu Daud
  rationale: בַּיִת dalam konteks janji kepada Daud merujuk pada rumah tangga, keturunan, atau wangsa. 'Keluarga' dapat dipahami pembaca modern dan catatan kaki mempertahankan cakupan dinastiknya.
- source_word: יִהְיֶה נָכוֹן
  choice: tetap teguh
  rationale: Gabungan היה dan נָכוֹן menyatakan keadaan yang mantap, kukuh, atau terjamin. 'Tetap teguh' alami dalam doa dan tidak menuntut agen pasif yang tidak disebutkan.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Padanan langsung dan alami yang mempertahankan nuansa relasional serta kehadiran Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna בַּיִת dalam janji kepada Daud
  choice: keluarga, dengan penjelasan bahwa maknanya mencakup keturunan atau wangsa
  alternative: rumah; dinasti
  rationale: Yang dimaksud bukan semata-mata bangunan, melainkan keluarga dan garis kerajaan Daud. 'Keluarga' alami dalam teks utama, sedangkan catatan kaki menjaga cakupan dinastik dan permainan gagasan 'rumah' dalam pasal ini.
- issue: Daya bentuk verba וְיִגְדַּל dan יִהְיֶה
  choice: 'diterjemahkan sebagai permohonan: ''Kiranya ...'''
  alternative: 'pernyataan masa depan: ''akan ...'''
  rationale: Konteks doa Daud mendukung daya volitif atau permohonan, tetapi tidak menambahkan kepastian teologis yang melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan luas dalam teks keagamaan Indonesia. Struktur doa dipertahankan dengan 'Kiranya', sedangkan ungkapan Ibrani yang berpotensi kabur dijelaskan seperlunya melalui catatan kaki.
