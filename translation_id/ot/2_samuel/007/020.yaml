  text: וּ/מַה יּוֹסִ֥יף דָּוִ֛ד ע֖וֹד לְ/דַבֵּ֣ר אֵלֶ֑י/ךָ וְ/אַתָּ֛ה יָדַ֥עְתָּ אֶֽת עַבְדְּ/ךָ֖ אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/020.yaml
  text: And what more can David say to you? You know your servant[a], Lord GOD.
translation:
  language: id
  text: Dan apa lagi yang dapat Daud katakan kepada-Mu? Engkau mengenal hamba-Mu, ya Tuhan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Adonai YHWH, yaitu gelar “Tuhan” yang diikuti nama ilahi “Yahweh”.'
    reason: Menjelaskan susunan gelar majemuk dalam teks sumber dan alasan bentuk "Tuhan Yahweh".
lexical_decisions:
- source_word: וּמַה יוֹסִיף דָּוִד עוֹד לְדַבֵּר אֵלֶיךָ
  choice: Dan apa lagi yang dapat Daud katakan kepada-Mu?
  rationale: Gabungan יסף, עוֹד, dan infinitif לדבר secara idiomatis menyatakan penambahan ucapan lebih lanjut. Terjemahan ini mempertahankan pertanyaan retoris dan kesinambungan wacana melalui "Dan".
- source_word: וְאַתָּה יָדַעְתָּ
  choice: Engkau mengenal
  rationale: Bentuk perfektif Ibrani menyatakan pengetahuan yang telah pasti dan tetap berlaku. "Mengenal" lebih sesuai daripada sekadar "mengetahui" karena objeknya adalah pribadi, yaitu hamba Allah.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, עבד merupakan sebutan diri yang merendah di hadapan Allah. "Hamba" alami dalam bahasa Indonesia dan mempertahankan nuansa pengabdian.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar "Tuhan", sedangkan יהוה adalah nama ilahi. Keduanya dipertahankan secara berbeda agar bentuk majemuk dalam sumber tetap terlihat dan pengulangan "Tuhan TUHAN" dihindari.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה dalam gelar majemuk אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan TUHAN; Tuhan Yang Mahakuasa
  rationale: Memakai "Yahweh" mempertahankan nama perjanjian yang terdapat langsung dalam teks Ibrani, sementara "Tuhan" mewakili אֲדֹנָי. Pilihan ini tidak melebur nama diri menjadi gelar umum.
- issue: Makna יָדַעְתָּ terhadap pribadi
  choice: mengenal
  alternative: mengetahui
  rationale: Teks dapat mencakup pengetahuan Allah yang mendalam tentang Daud tanpa perlu menambahkan "sepenuhnya" atau penjelasan teologis yang tidak tersurat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Susunan pertanyaan dibuat alami tanpa menghilangkan kesinambungan yang ditandai וּ.
