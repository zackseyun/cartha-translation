base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/014.yaml
  text: I will be a father to him[a], and he will be a son to me. When he commits iniquity, I will discipline him with the rod of men and with the blows of the sons of man.
translation:
  language: id
  text: Aku akan menjadi bapa baginya, dan ia akan menjadi anak bagi-Ku. Apabila ia berbuat salah, Aku akan mendisiplinkannya dengan tongkat manusia dan dengan pukulan manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “dengan pukulan anak-anak manusia.” Ungkapan Ibrani ini berarti pukulan manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: Aku akan menjadi bapa baginya
  rationale: Mempertahankan susunan relasional/predikatif Ibrani dan tetap wajar serta bermartabat dalam bahasa Indonesia.
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: dan ia akan menjadi anak bagi-Ku
  rationale: Mencerminkan rumusan timbal balik perjanjian tanpa menghaluskannya menjadi sekadar bentuk posesif.
- source_word: אֲשֶׁר בְּהַעֲוֺתוֹ
  choice: Apabila ia berbuat salah
  rationale: אֲשֶׁר di sini memperkenalkan keadaan yang mungkin terjadi, sedangkan bentuk dari עוה menyatakan tindakan menyimpang atau berbuat salah. 'Apabila' mempertahankan nuansa temporal-kondisional tanpa memastikan bahwa pelanggaran itu pasti terjadi.
- source_word: וְהֹכַחְתִּיו
  choice: Aku akan mendisiplinkannya
  rationale: Hifil יכח dalam konteks tongkat dan pukulan menunjuk pada koreksi yang bersifat mendidik, bukan hanya teguran lisan.
- source_word: בְּשֵׁבֶט אֲנָשִׁים
  choice: dengan tongkat manusia
  rationale: Terjemahan dekat ini mempertahankan metafora dan membiarkan terbuka apakah yang dimaksud ialah sarana manusiawi atau hukuman melalui manusia.
- source_word: וּבְנִגְעֵי בְּנֵי אָדָם
  choice: dan dengan pukulan anak-anak manusia
  rationale: Menjaga bentuk ungkapan Ibrani בני אדם, sementara catatan kaki memberikan padanan Indonesia yang lebih idiomatis.
theological_decisions:
- issue: Cakupan janji hubungan bapa-anak dalam garis kerajaan Daud dan pemakaiannya secara mesianik kemudian
  choice: Menerjemahkan ayat dalam makna historis langsung mengenai keturunan atau raja dari garis Daud tanpa menambahkan penafsiran mesianik secara eksplisit.
  alternative: Menyatakan pembacaan mesianik langsung di dalam teks utama.
  rationale: Konteks langsung berbicara tentang keturunan Daud yang dapat berbuat salah dan didisiplinkan. Bahasa ayat dipertahankan agar penggunaan teologisnya yang lebih luas tetap mungkin tanpa dimasukkan secara paksa ke dalam terjemahan.
- issue: Nuansa אֲשֶׁר sebelum tindakan berbuat salah
  choice: Apabila
  alternative: Ketika; jika
  rationale: '''Apabila'' secara alami memuat nuansa waktu sekaligus kondisi dalam bahasa Indonesia dan tidak menegaskan kepastian pelanggaran seperti ''ketika'', maupun menjadikannya syarat formal setajam ''jika''.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. 'Bapa' dipilih untuk relasi perjanjian, sedangkan 'anak-anak manusia' dipertahankan sebagai ungkapan formal dengan penjelasan idiomatis dalam catatan kaki.
