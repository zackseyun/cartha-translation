  text: וַ/יֹּ֤אמֶר הַ/מֶּ֨לֶךְ֙ אֶל נָתָ֣ן הַ/נָּבִ֔יא רְאֵ֣ה נָ֔א אָנֹכִ֥י יוֹשֵׁ֖ב בְּ/בֵ֣ית אֲרָזִ֑ים וַֽ/אֲרוֹן֙ הָֽ/אֱלֹהִ֔ים יֹשֵׁ֖ב בְּ/ת֥וֹךְ הַ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/002.yaml
  text: And the king said to Nathan the prophet[a], “See now, I dwell in a house of cedar, but the ark of God dwells within curtains.”
translation:
  language: id
  text: Lalu raja berkata kepada Nabi Natan, “Lihatlah, aku tinggal di rumah dari kayu aras, sedangkan tabut Allah berada di dalam tirai-tirai kemah[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di dalam sebuah tirai.” Istilah Ibrani ini dapat menunjuk pada tirai atau lembaran penutup kemah dan dapat dipakai secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam narasi Indonesia tanpa menafsirkan urutan secara berlebihan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Mempertahankan gelar definit dalam konteks tanpa menyisipkan nama Daud yang tidak muncul dalam ayat.
- source_word: נָתָן הַנָּבִיא
  choice: Nabi Natan
  rationale: Susunan gelar di depan nama terasa alami dan bermartabat dalam bahasa Indonesia.
- source_word: רְאֵה נָא
  choice: Lihatlah
  rationale: Partikel -lah secara alami menyampaikan imperatif yang diperhalus oleh נָא, sebagai ungkapan penarik perhatian.
- source_word: אָנֹכִי יוֹשֵׁב
  choice: aku tinggal
  rationale: יוֹשֵׁב dalam konteks ini menunjuk pada tempat kediaman; “tinggal” lebih alami daripada “duduk” dan tidak melebihkan penekanan pronomina mandiri אָנֹכִי.
- source_word: בְּבֵית אֲרָזִים
  choice: di istana dari kayu aras
  rationale: Secara harfiah berarti rumah dari kayu aras; dalam konteks tempat tinggal raja, “istana” menyampaikan fungsi bangunan secara alami, sementara bahannya tetap dinyatakan.
- source_word: וַאֲרוֹן הָאֱלֹהִים
  choice: sedangkan tabut Allah
  rationale: Konjungsi berfungsi kontrastif antara kediaman raja dan tempat tabut; “sedangkan” menyatakan kontras itu dengan jelas.
- source_word: יֹשֵׁב בְּתוֹךְ הַיְרִיעָה
  choice: berada di dalam kain-kain kemah
  rationale: יְרִיעָה menunjuk pada lembaran kain, tirai, atau penutup kemah. Bentuk jamak idiomatis dalam bahasa Indonesia menggambarkan tempat tabut di tengah penutup-penutup kemah tanpa menggeneralisasikannya hanya menjadi “kemah”.
theological_decisions:
- issue: Tempat beradanya tabut Allah
  choice: berada di dalam kain-kain kemah
  alternative: berada di dalam kemah
  rationale: Terjemahan mempertahankan gambaran konkret יְרִיעָה sebagai kain atau penutup kemah dan tidak memasukkan gagasan teologis tentang bait yang belum dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Aku” dipakai dalam ujaran raja karena sesuai dengan pronomina orang pertama dan tetap alami. Tidak diperlukan catatan kaki karena nuansa leksikal יְרִיעָה dapat disampaikan secara cukup jelas dalam teks utama.
