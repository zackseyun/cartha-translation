revisions:
- from: Namun kasih setia-Ku[a] tidak akan beralih darinya, seperti ketika Aku menarik kasih setia-Ku dari Saul, yang telah Kusingkirkan dari hadapanmu[b].
  to: Namun kasih setia-Ku[a] tidak akan menjauh darinya, seperti Aku telah menjauhkannya dari Saul, yang telah Kusingkirkan dari hadapanmu[b].
  rationale: 'The revision makes the first verbal image more natural and source-specific in Indonesian: God''s steadfast love will not move away from the promised descendant. It also renders the comparative clause without the added temporal word “ketika,” while retaining the supplied object “kasih setia-Ku” through the pronoun “-nya” for clear Indonesian expression. The final phrase and its footnote continue to preserve the Hebrew ambiguity concerning Saul''s removal “from before” David.'
  reviewer_model: gpt-5.6-terra
