source:
  edition: WLC
  text: וְ/חַסְדִּ֖/י לֹא יָס֣וּר מִמֶּ֑/נּוּ כַּ/אֲשֶׁ֤ר הֲסִרֹ֨תִי֙ מֵ/עִ֣ם שָׁא֔וּל אֲשֶׁ֥ר הֲסִרֹ֖תִי מִ/לְּ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/015.yaml
  text: But my steadfast love will not depart from him[a], as I removed it from Saul[b], whom I removed from before you.
translation:
  language: id
  text: Namun kasih setia-Ku[a] tidak akan menjauh darinya, seperti Aku telah menjauhkannya dari Saul, yang telah Kusingkirkan dari hadapanmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemurahan-Ku” atau “kesetiaan perjanjian-Ku.” Istilah Ibraninya menunjuk pada kasih yang teguh dan loyal dalam suatu hubungan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang telah Kusingkirkan dari hadapanmu.” Ungkapan ini dapat menunjuk pada penyingkiran Saul dari kedudukannya dalam hubungannya dengan Daud, bukan sekadar kepergian secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: kasih setia-Ku
  rationale: חֶסֶד di sini menunjuk pada kasih yang teguh dan kesetiaan relasional dalam konteks perjanjian. “Kasih setia” merupakan ungkapan Indonesia yang alami dan mempertahankan bobot tersebut.
- source_word: יָסוּר מִמֶּנּוּ
  choice: tidak akan beralih darinya
  rationale: סור dapat berarti beralih, pergi, atau disingkirkan. Dengan “kasih setia-Ku” sebagai subjek, “beralih darinya” mempertahankan gambaran bahwa kasih itu tidak akan meninggalkan keturunan Daud yang dimaksud.
- source_word: כַּאֲשֶׁר הֲסִרֹתִי מֵעִם שָׁאוּל
  choice: seperti ketika Aku menarik kasih setia-Ku dari Saul
  rationale: Objek הֲסִרֹתִי tersirat dari klausa sebelumnya, yaitu kasih setia Allah. Objek itu diulang dalam bahasa Indonesia demi kejelasan tanpa mengubah makna sumber.
- source_word: אֲשֶׁר הֲסִרֹתִי מִלְּפָנֶיךָ
  choice: yang telah Kusingkirkan dari hadapanmu
  rationale: Ungkapan ini mempertahankan citra harfiah “dari hadapanmu” serta hubungan verbal dengan tindakan Allah menyingkirkan Saul, tanpa membatasinya secara eksplisit hanya pada pencopotan dari jabatan raja.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks perjanjian dengan Daud
  choice: kasih setia
  alternative: belas kasihan; kemurahan; kesetiaan perjanjian
  rationale: “Kasih setia” mencakup kasih dan loyalitas Allah tanpa memasukkan rumusan teologis yang lebih sempit daripada teks.
- issue: Arti “dari hadapanmu” dalam penyingkiran Saul
  choice: Mempertahankan ungkapan “dari hadapanmu”
  alternative: dari hadiratmu; dari kedudukannya sebagai raja di hadapanmu
  rationale: Bahasa Ibrani menyatakan hubungan penyingkiran Saul dengan Daud, tetapi tidak menjabarkannya. Terjemahan ini menjaga keterbukaan tersebut dan tidak menambahkan penafsiran jabatan secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab berbahasa Indonesia. Pengulangan “kasih setia-Ku” dipakai untuk memperjelas objek yang tersirat dalam bahasa Ibrani.
