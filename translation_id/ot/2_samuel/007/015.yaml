    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang telah Kusingkirkan dari hadapanmu.” Ungkapan ini dapat menunjuk pada penyingkiran Saul dari kedudukannya dalam hubungannya dengan Daud, bukan sekadar kepergian secara fisik.
    reason: lexical_alternative
