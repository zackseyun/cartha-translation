revisions:
- from: Siapakah yang seperti umat-Mu, seperti Israel, satu-satunya bangsa di bumi yang Allah datangi untuk ditebus-Nya menjadi umat bagi diri-Nya sendiri, untuk membuat nama bagi diri-Nya, dan untuk melakukan bagi kalian hal-hal besar dan dahsyat[a] bagi negeri-Mu di hadapan umat-Mu, yang telah Kautebus bagi diri-Mu sendiri dari Mesir[b], dari bangsa-bangsa dan dewa-dewa mereka?
