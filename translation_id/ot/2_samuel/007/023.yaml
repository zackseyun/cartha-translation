    issue: Ambiguitas pada “untuk ditebus-Nya”
    rationale: Dalam bahasa Indonesia, bentuk pasif dengan sufiks -Nya setelah subjek “Allah” dapat dibaca sebagai ‘agar Allah ditebus’. Ibrani לִפְדּוֹת לוֹ לְעָם menyatakan bahwa Allah pergi untuk menebus umat itu bagi diri-Nya sendiri. Bentuk aktif dengan pronomina objek “menebusnya” menyampaikan relasi tersebut dengan jelas.
