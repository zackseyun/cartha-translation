  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִ֤י כְ/עַמְּ/ךָ֙ כְּ/יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁ֣ר הָלְכֽוּ אֱ֠לֹהִים לִ/פְדּֽוֹת ל֨/וֹ לְ/עָ֜ם וְ/לָ/שׂ֧וּם ל֣/וֹ שֵׁ֗ם וְ/לַ/עֲשׂ֨וֹת לָ/כֶ֜ם הַ/גְּדוּלָּ֤ה וְ/נֹֽרָאוֹת֙ לְ/אַרְצֶ֔/ךָ מִ/פְּנֵ֣י עַמְּ/ךָ֗ אֲשֶׁ֨ר פָּדִ֤יתָ לְּ/ךָ֙ מִ/מִּצְרַ֔יִם גּוֹיִ֖ם וֵ/אלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/023.yaml
  text: And who is like your people[a], like Israel, the one nation on the earth whom God went to redeem for himself as a people, to make a name for himself, and to do for you great and fearsome things for your land before your people, whom you redeemed for yourself from Egypt[b], from nations and their gods?
translation:
  language: id
  text: Siapakah yang seperti umat-Mu, seperti Israel, satu-satunya bangsa di bumi yang Allah datangi untuk menebusnya bagi diri-Nya sendiri sebagai umat, untuk membuat nama bagi diri-Nya sendiri, dan untuk melakukan bagi kalian hal-hal besar dan dahsyat[a] bagi negeri-Mu di hadapan umat-Mu, yang telah Kautebus bagi diri-Mu sendiri dari Mesir[b], dari bangsa-bangsa dan dewa-dewa mereka?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hal-hal besar dan menakutkan.” Istilah Ibrani ini dapat menunjuk pada perbuatan yang membangkitkan kekaguman, kegentaran, atau ketakutan.
    reason: lexical_alternative
  - marker: b
    text: 'Klausa penutup dalam bahasa Ibrani sulit. Kemungkinan lain: “dari Mesir, bangsa-bangsa dan dewanya” atau “dari Mesir, bangsa-bangsa dan dewa-dewa.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ כְיִשְׂרָאֵל
  choice: Siapakah yang seperti umat-Mu, seperti Israel
  rationale: Mempertahankan pertanyaan retoris tentang ketakterbandingan serta struktur penegasan yang menyebut Israel secara khusus.
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: satu-satunya bangsa di bumi
  rationale: Mengungkapkan tekanan kontekstual pada keunikan Israel dengan bahasa Indonesia yang alami.
- source_word: אֲשֶׁר הָלְכוּ אֱלֹהִים
  choice: yang Allah datangi
  rationale: Bentuk אֱלֹהִים dipahami sebagai Allah Israel; ungkapan ini mempertahankan gambaran konkret bahwa Allah pergi atau datang bertindak bagi umat itu.
- source_word: לִפְדּוֹת לוֹ לְעָם
  choice: untuk ditebus-Nya menjadi umat bagi diri-Nya sendiri
  rationale: Mempertahankan bahasa penebusan dan tujuan relasional-kovenantal dari tindakan tersebut.
- source_word: וְלָשׂוּם לוֹ שֵׁם
  choice: untuk membuat nama bagi diri-Nya
  rationale: Mencerminkan idiom Ibrani tentang memperoleh nama atau kemasyhuran melalui perbuatan besar.
- source_word: וְלַעֲשׂוֹת לָכֶם
  choice: dan untuk melakukan bagi kalian
  rationale: Mempertahankan לָכֶם, bentuk orang kedua jamak dalam Teks Masoret, tanpa mengemendasinya.
- source_word: הַגְּדוּלָּה וְנֹרָאוֹת
  choice: hal-hal besar dan dahsyat
  rationale: נוראות menunjuk pada perbuatan yang membangkitkan ketakutan sekaligus rasa gentar dan kagum; 'dahsyat' mempertahankan rentang itu secara alami.
- source_word: לְאַרְצְךָ מִפְּנֵי עַמְּךָ
  choice: bagi negeri-Mu di hadapan umat-Mu
  rationale: Mempertahankan sufiks orang kedua tunggal dan nuansa spasial מִפְּנֵי, meskipun rangkaian sintaksis ayat ini padat.
- source_word: אֲשֶׁר פָּדִיתָ לְּךָ מִמִּצְרַיִם
  choice: yang telah Kautebus bagi diri-Mu sendiri dari Mesir
  rationale: Mengulang akar פדה secara konsisten dan mempertahankan unsur kepemilikan dalam לְּךָ.
- source_word: גּוֹיִם וֵאלֹהָיו
  choice: dari bangsa-bangsa dan dewa-dewa mereka
  rationale: Menampilkan pembacaan kontekstual yang paling masuk akal, sambil mencatat ketidakpastian sintaksis dan bentuk sufiksnya dalam catatan kaki.
theological_decisions:
- issue: Jumlah dan rujukan אֱלֹהִים
  choice: Allah, yakni Allah Israel
  alternative: dewa-dewa
  rationale: Konteks doa berbicara tentang tindakan unik Allah Israel dalam menebus umat-Nya. Bentuk plural morfologis tidak mengharuskan arti plural di sini.
- issue: Peralihan pronomina antara לָכֶם, לְאַרְצְךָ, עַמְּךָ, dan פָּדִיתָ
  choice: Mempertahankan 'bagi kalian' lalu bentuk tunggal 'negeri-Mu', 'umat-Mu', dan 'Kautebus'
  alternative: Menyeragamkan semuanya sebagai sapaan tunggal atau menghilangkan 'bagi kalian'
  rationale: Pergantian jumlah terdapat dalam Teks Masoret dan tidak boleh diam-diam dihapus, walaupun hasilnya menimbulkan ketegangan dalam bahasa sasaran.
- issue: Frasa penutup גּוֹיִם וֵאלֹהָיו yang sulit
  choice: '''dari bangsa-bangsa dan dewa-dewa mereka'' sebagai unsur-unsur yang disingkirkan di hadapan Israel'
  alternative: '''dari Mesir, bangsa-bangsa dan dewanya'' atau ''dari Mesir, bangsa-bangsa dan dewa-dewa'''
  rationale: Pilihan utama sesuai dengan konteks keluaran dan penaklukan, tetapi kerumitan gramatikal teks Ibrani tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam doa yang khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah dipakai sesuai kebiasaan penerbitan Alkitab Indonesia. Bentuk 'kalian' sengaja dipertahankan untuk menandai orang kedua jamak pada לָכֶם, sedangkan bentuk tunggal di sekitarnya tetap dipertahankan.
