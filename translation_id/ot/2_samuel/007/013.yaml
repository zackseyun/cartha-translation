id: 2SA.7.13
reference: 2 Samuel 7:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ה֥וּא יִבְנֶה בַּ֖יִת לִ/שְׁמִ֑/י וְ/כֹנַנְתִּ֛י אֶת כִּסֵּ֥א מַמְלַכְתּ֖/וֹ עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/013.yaml
  text: He will build a house for my name[a], and I will establish the throne of his kingdom forever.
translation:
  language: id
  text: Dialah yang akan membangun rumah bagi nama-Ku[a], dan Aku akan meneguhkan takhta kerajaannya untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bait bagi nama-Ku.” Teks Ibrani berbunyi “rumah bagi nama-Ku,” yang mempertahankan permainan kata dalam pasal ini antara bait dan wangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina orang ketiga tunggal maskulin ini dinyatakan secara eksplisit dalam bahasa Ibrani. “Dialah” secara wajar mempertahankan penandaan subjek tersebut dalam konteks janji.
- source_word: יִבְנֶה
  choice: akan membangun
  rationale: Bentuk imperfek Qal orang ketiga tunggal maskulin dari בנה menunjuk pada tindakan mendatang dalam konteks janji.
- source_word: בַּיִת
  choice: rumah
  rationale: Makna dasarnya ialah “rumah”; dalam konteks ini yang dimaksud adalah tempat suci atau bait, tetapi “rumah” mempertahankan permainan kata dalam pasal ini antara rumah ibadah dan wangsa/keluarga kerajaan.
- source_word: לִשְׁמִי
  choice: bagi nama-Ku
  rationale: Ungkapan ini mempertahankan idiom Ibrani ל + “nama-Ku” tanpa menjabarkan makna teologisnya secara berlebihan.
- source_word: וְכֹנַנְתִּי
  choice: dan Aku akan meneguhkan
  rationale: Dalam rangkaian janji ini bentuk tersebut berfungsi futur dan menyatakan tindakan membuat takhta itu kukuh atau tetap.
- source_word: כִּסֵּא
  choice: takhta
  rationale: Dalam konteks kerajaan, kata ini secara langsung berarti takhta sebagai lambang pemerintahan.
- source_word: מַמְלַכְתּוֹ
  choice: kerajaannya
  rationale: Kata ini menunjuk pada kerajaan atau kekuasaan rajawi miliknya; bentuk posesif dipertahankan secara langsung.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Dalam konteks janji perjanjian ini, ungkapan tersebut menyatakan keberlangsungan yang kekal dan tidak dilemahkan menjadi sekadar waktu yang sangat lama.
theological_decisions:
- issue: Apakah בַּיִת diterjemahkan secara harfiah sebagai “rumah” atau secara interpretatif sebagai “bait”
  choice: rumah
  alternative: bait
  rationale: Rujukan langsungnya ialah tempat suci yang kelak dibangun, tetapi struktur sastra dan teologis pasal ini bergantung pada makna ganda “rumah” sebagai bangunan ibadah dan wangsa. Pilihan “rumah” mempertahankan ketegangan dan permainan kata itu.
- issue: Daya ungkap עַד עוֹלָם dalam janji kepada Daud
  choice: untuk selama-lamanya
  alternative: untuk waktu yang sangat lama
  rationale: Dalam konteks perjanjian ini, frasa tersebut membawa bobot janji yang terus berlaku; terjemahan tidak mempersempitnya menjadi durasi panjang yang tidak pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. “Meneguhkan takhta” dipilih sebagai ungkapan kerajaan yang alami dan dekat dengan citra sumber.
