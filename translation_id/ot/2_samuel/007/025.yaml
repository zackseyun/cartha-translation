  to: Sekarang, ya Yahweh Allah, teguhkanlah untuk selama-lamanya perkataan[a] yang telah Engkau ucapkan mengenai hamba-Mu dan mengenai rumahnya[b], dan lakukanlah seperti yang telah Engkau ucapkan.
