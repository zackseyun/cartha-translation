source:
  edition: WLC
  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ הָקֵ֖ם עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/025.yaml
  text: And now[a], Yahweh God, confirm forever the word that you have spoken concerning your servant and concerning his house[b], and do as you have spoken.
translation:
  language: id
  text: Sekarang, ya Yahweh Allah, teguhkanlah untuk selama-lamanya perkataan[a] yang telah Engkau ucapkan mengenai hamba-Mu dan mengenai rumahnya[b], dan lakukanlah seperti yang telah Engkau ucapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "janji yang telah Engkau ucapkan."
    reason: lexical_alternative
  - marker: b
    text: '"Rumahnya" di sini mencakup rumah kerajaan atau dinasti Daud, bukan sekadar rumah tangganya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini mengalihkan doa Daud kepada permohonan berdasarkan firman Allah yang baru disebutkan; 'Sekarang' alami dan mempertahankan fungsi peralihannya.
- source_word: יְהוָה אֱלֹהִים
  choice: ya Yahweh Allah
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah'. Partikel 'ya' menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: דָּבָר di sini menunjuk pada apa yang telah Allah ucapkan. 'Perkataan' mempertahankan ungkapan Ibrani tanpa mempersempitnya secara interpretatif menjadi 'janji'.
- source_word: דִּבַּרְתָּ
  choice: telah Engkau ucapkan
  rationale: Bentuk perfektif mengacu pada ucapan Allah sebelumnya yang tetap menjadi dasar permohonan. 'Telah ... ucapkan' menyampaikan relevansi berkelanjutannya dan cocok dengan objek 'perkataan'.
- source_word: עַל
  choice: tentang
  rationale: Dalam konstruksi ini עַל menandai pokok ucapan Allah. 'Tentang' tepat, alami, dan mudah dipahami.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan, עֶבֶד merupakan sebutan kerendahan hati dan pelayanan di hadapan Allah; 'hamba' sesuai dengan konteks dan register.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: בַּיִת secara harfiah berarti 'rumah', tetapi dalam konteks ini menunjuk terutama pada garis keturunan atau wangsa Daud. 'Keluarganya' tetap alami dalam bahasa Indonesia, sementara makna dinastis dijelaskan dalam catatan kaki.
- source_word: הָקֵם
  choice: teguhkanlah
  rationale: Bentuk Hifil imperatif dari קום meminta Allah membuat perkataan-Nya berdiri teguh atau berlaku tetap. 'Teguhkanlah' sesuai ketika objeknya adalah 'perkataan'.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Idiom ini menyatakan keberlangsungan tanpa akhir; bentuk ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: וַעֲשֵׂה
  choice: dan lakukanlah
  rationale: Terjemahan langsung ini mempertahankan keluasan makna עשה tanpa menambahkan objek atau menafsirkan secara eksplisit sebagai 'genapilah'.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: seperti yang telah Engkau ucapkan
  rationale: Pilihan ini mempertahankan pengulangan akar דבר dan menegaskan permohonan agar tindakan Allah sesuai dengan ucapan-Nya sendiri.
theological_decisions:
- issue: Apakah הַדָּבָר perlu diterjemahkan secara interpretatif sebagai 'janji'
  choice: perkataan
  alternative: janji
  rationale: Konteksnya memang berkaitan dengan janji perjanjian Allah, tetapi teks secara eksplisit menyebut 'perkataan' yang telah Dia ucapkan. Pilihan utama mempertahankan keluasan leksikal dan membiarkan daya janji muncul dari konteks.
- issue: Apakah בֵּיתוֹ perlu dibuat eksplisit sebagai 'dinastinya'
  choice: keluarganya
  alternative: dinastinya; rumahnya
  rationale: Makna dinastis sangat penting dalam 2 Samuel 7, tetapi istilah בַּיִת juga sengaja mempertahankan hubungan antara rumah, keluarga, dan wangsa. 'Keluarganya' cukup alami dalam teks utama, sedangkan cakupan kerajaan atau dinastinya dinyatakan dalam catatan.
translation_notes:
  register: Bahasa doa dibuat modern, khidmat, dan mudah dipahami. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Pengulangan 'telah Engkau ucapkan' dipertahankan untuk mencerminkan pengulangan dalam teks Ibrani.
