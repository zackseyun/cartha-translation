  source_fidelity: 'Makna pokok diterjemahkan dengan setia: ungkapan Ibrani tentang ‘membuka telinga’ dijelaskan sebagai penyingkapan, janji untuk membangun ‘rumah’ dipertahankan tanpa mempersempit maknanya, dan idiom ‘menemukan hatinya’ diterjemahkan sebagai keberanian untuk berdoa. Namun, nama ilahi YHWH sebaiknya mengikuti konvensi proyek yang tercermin dalam audit bahasa Inggris, yakni ‘TUHAN’, bukan transliterasi ‘Yahweh’.'
