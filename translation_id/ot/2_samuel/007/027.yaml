  text: כִּֽי אַתָּה֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל גָּלִ֜יתָה אֶת אֹ֤זֶן עַבְדְּ/ךָ֙ לֵ/אמֹ֔ר בַּ֖יִת אֶבְנֶה לָּ֑/ךְ עַל כֵּ֗ן מָצָ֤א עַבְדְּ/ךָ֙ אֶת לִבּ֔/וֹ לְ/הִתְפַּלֵּ֣ל אֵלֶ֔י/ךָ אֶת הַ/תְּפִלָּ֖ה הַ/זֹּֽאת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/027.yaml
  text: For you[a], O Yahweh of hosts, God of Israel, have revealed this to your servant, saying[c][b], ‘I will build you a house.’ Therefore your servant has found it in his heart to pray this prayer to you.
translation:
  language: id
  text: Sebab Engkau, ya TUHAN semesta alam, Allah Israel, telah menyatakan hal ini kepada hamba-Mu[a] dengan berfirman, “Aku akan membangun rumah bagimu.”[b] Itulah sebabnya hamba-Mu mendapat keberanian[c] untuk memanjatkan doa ini kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah membuka telinga hamba-Mu”, sebuah ungkapan Ibrani yang berarti menyatakan atau menyingkapkan sesuatu kepada seseorang.
    reason: lexical_alternative
  - marker: b
    text: “Rumah” di sini juga dapat menunjuk kepada keluarga kerajaan atau wangsa.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “telah menemukan hatinya”, yakni mendapat keberanian atau keteguhan hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Semesta Alam
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”. Gelar צְבָאוֹת dipertahankan dalam bentuk Indonesia yang dikenal dan bermartabat, tanpa membatasinya hanya pada bala tentara manusia.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan langsung bentuk konstruksi Ibrani yang mempertahankan identitas perjanjian Allah dengan Israel.
- source_word: גָּלִיתָה אֶת אֹזֶן עַבְדְּךָ
  choice: telah menyatakan hal ini kepada hamba-Mu
  rationale: Ungkapan harfiahnya, “membuka telinga hamba-Mu”, merupakan idiom untuk menyingkapkan atau memberitahukan sesuatu. Terjemahan utama menyampaikan maknanya secara alami, sedangkan bentuk harfiah dicatat dalam catatan kaki.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kerajaan ini, “hamba-Mu” secara wajar mengungkapkan kerendahan dan pengabdian Daud di hadapan Allah.
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Mempertahankan fungsi pengantar kutipan serta menyesuaikan verba ujaran dengan pihak yang berbicara, yaitu Allah.
- source_word: בַּיִת אֶבְנֶה לָּךְ
  choice: Aku akan membangun rumah bagimu
  rationale: Kata “rumah” dipertahankan agar ambiguitas penting antara rumah secara fisik dan wangsa atau keturunan tetap terdengar dalam konteks perjanjian Daud.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menyatakan hubungan sebab-akibat antara penyingkapan janji Allah dan keberanian Daud untuk berdoa.
- source_word: מָצָא ... אֶת לִבּוֹ
  choice: mendapat keberanian
  rationale: Idiom harfiahnya adalah “menemukan hatinya”; dalam konteks ini maknanya ialah memperoleh keberanian atau keteguhan untuk berdoa.
- source_word: לְהִתְפַּלֵּל אֵלֶיךָ אֶת הַתְּפִלָּה הַזֹּאת
  choice: untuk memanjatkan doa ini kepada-Mu
  rationale: Terjemahan Indonesia yang alami dan bermartabat bagi tindakan menyampaikan doa yang sedang diucapkan Daud kepada Allah.
theological_decisions:
- issue: Idiom penyingkapan ilahi
  choice: telah menyatakan hal ini kepada hamba-Mu
  alternative: telah membuka telinga hamba-Mu
  rationale: Bentuk harfiah akan kabur bagi banyak pembaca Indonesia. Pilihan utama menyampaikan tindakan penyingkapan Allah tanpa menambahkan isi yang tidak ada dalam teks.
- issue: Makna בַּיִת (“rumah”)
  choice: rumah
  alternative: keturunan; wangsa; istana; bait
  rationale: Dalam konteks perjanjian Daud, kata ini memiliki resonansi dinasti sekaligus mempertahankan permainan makna dengan bangunan. Terjemahan tidak mempersempitnya menjadi salah satu pengertian saja.
- issue: Idiom hati dan keberanian untuk berdoa
  choice: mendapat keberanian
  alternative: menemukan hatinya; tergerak hatinya
  rationale: Pilihan ini menyampaikan daya idiom Ibrani sebagai keberanian atau keteguhan untuk menghadap Allah, tanpa menafsirkannya sekadar sebagai dorongan perasaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan “hamba-Mu” atau ambiguitas teologis kata “rumah”.
