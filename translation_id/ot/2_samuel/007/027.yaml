  terminology: ‘Allah Israel’, ‘hamba-Mu’, dan ‘rumah’ tepat. ‘TUHAN semesta alam’ lebih konsisten dengan konvensi penerjemahan nama YHWH yang menggunakan ‘LORD’ dalam audit Inggris serta dengan pemakaian Alkitab Indonesia yang mapan.
