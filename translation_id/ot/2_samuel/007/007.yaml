id: 2SA.7.7
reference: 2 Samuel 7:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל בְּנֵ֣י יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר צִוִּ֗יתִי לִ/רְע֛וֹת אֶת עַמִּ֥/י אֶת יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לָ֛/מָּה לֹֽא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/007.yaml
  text: In all the places where I have walked among all the sons of Israel[a], did I ever speak a word to one of the tribes of Israel, whom I commanded to shepherd my people Israel, saying, ‘Why have you not built me a house of cedar?’
translation:
  language: id
  text: 'Di segala tempat Aku berjalan di antara seluruh bani Israel, pernahkah Aku mengatakan sepatah kata pun kepada salah satu suku Israel[a] yang Kuperintahkan untuk menggembalakan umat-Ku Israel, demikian: ‘Mengapa kalian tidak membangun bagi-Ku rumah dari kayu aras?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “salah satu dari suku-suku Israel”; bagian sejajar dalam 1 Tawarikh 17:6 berbunyi “para hakim Israel”, yang tampaknya mencerminkan para pemimpin yang ditugaskan menggembalakan umat.
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: Aku berjalan
  rationale: Mempertahankan gambaran konkret tentang TUHAN yang bergerak menyertai umat-Nya, bukan menetap di satu tempat.
- source_word: בְּכֹל אֲשֶׁר ... בְּכָל בְּנֵי יִשְׂרָאֵל
  choice: Di mana pun ... di tengah seluruh bani Israel
  rationale: Ungkapan ini menyampaikan keluasan tempat dalam kaitannya dengan gambaran berjalan, sekaligus kehadiran Allah di tengah umat perjanjian.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Istilah Indonesia yang lazim dan cukup transparan bagi sebutan kebangsaan harfiah 'anak-anak lelaki Israel', tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: pernahkah Aku mengatakan sepatah kata pun
  rationale: Mempertahankan penegasan dari konstruksi serumpun Ibrani serta daya retoris pertanyaannya.
- source_word: אַחַד שִׁבְטֵי יִשְׂרָאֵל
  choice: salah satu suku Israel
  rationale: Menerjemahkan teks Masoret secara langsung; ketegangan dengan klausa tentang tugas menggembalakan dan bacaan sejajar dicatat dalam catatan kaki.
- source_word: אֲשֶׁר צִוִּיתִי לִרְעוֹת
  choice: yang Kuperintahkan untuk menggembalakan
  rationale: Kata 'menggembalakan' mempertahankan metafora pastoral bagi kepemimpinan dan pemeliharaan umat.
- source_word: עַמִּי אֶת יִשְׂרָאֵל
  choice: umat-Ku Israel
  rationale: Mempertahankan konstruksi aposisional yang menyatakan kepunyaan perjanjian sekaligus identitas umat.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Pengantar kutipan dibuat alami dalam bahasa Indonesia tanpa menghilangkan hubungan eksplisit dengan perkataan berikutnya.
- source_word: לָמָּה לֹא בְנִיתֶם לִי בֵּית אֲרָזִים
  choice: Mengapa kalian tidak membangun bagi-Ku rumah dari kayu aras?
  rationale: Kata 'kalian' mempertahankan bentuk jamak Ibrani, sedangkan 'rumah dari kayu aras' menyampaikan bahan bangunan secara alami.
theological_decisions:
- issue: Sebutan perjanjian yang secara harfiah bergender
  choice: bani Israel
  alternative: orang Israel; umat Israel
  rationale: Dalam konteks ini בְּנֵי יִשְׂרָאֵל merupakan sebutan nasional bagi seluruh umat. 'Bani Israel' mempertahankan bentuk tradisional yang dekat dengan ungkapan sumber namun tetap dipahami secara kolektif.
- issue: Ketegangan tekstual antara 'suku-suku' dan para pemimpin
  choice: salah satu suku Israel
  alternative: salah seorang hakim/pemimpin Israel
  rationale: Teks WLC untuk Samuel berbunyi 'suku-suku'. Walaupun klausa menggembalakan dan teks sejajar dalam 1 Tawarikh 17:6 menunjuk kepada pemimpin, bacaan alternatif tidak dimasukkan diam-diam ke dalam teks utama.
- issue: Acuan klausa relatif 'yang Kuperintahkan'
  choice: Ketaksaan gramatikal dipertahankan sesudah 'salah satu suku Israel'
  alternative: Menjelaskan bahwa yang diperintahkan adalah para pemimpin suku
  rationale: Teks Masoret menghubungkan bentuk 'suku' dengan tugas menggembalakan secara tegang. Terjemahan tidak menambahkan subjek pemimpin yang tidak dinyatakan secara eksplisit dalam teks Samuel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital. 'Bani Israel' dipilih sebagai sebutan kolektif yang umum, sedangkan 'kalian' mempertahankan bentuk jamak dalam pertanyaan langsung.
