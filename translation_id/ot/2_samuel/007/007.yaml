revisions:
- from: 'Di mana pun Aku berjalan di tengah seluruh bani Israel, pernahkah Aku mengatakan sepatah kata pun kepada salah satu suku Israel[a] yang Kuperintahkan untuk menggembalakan umat-Ku Israel, demikian: ‘Mengapa kalian tidak membangun bagi-Ku rumah dari kayu aras?’'
  to: 'Di segala tempat Aku berjalan di antara seluruh bani Israel, pernahkah Aku mengatakan sepatah kata pun kepada salah satu suku Israel[a] yang Kuperintahkan untuk menggembalakan umat-Ku Israel, demikian: ‘Mengapa kalian tidak membangun bagi-Ku rumah dari kayu aras?’'
  rationale: Revisi terbatas pada ketepatan cakupan frasa pembuka dan presisi catatan kaki. Bacaan Masoret “salah satu [dari] suku-suku Israel” tetap dipertahankan dalam teks utama, termasuk ketegangan sintaktisnya dengan klausa “yang Kuperintahkan untuk menggembalakan”; alternatif dari 1 Tawarikh hanya dicatat dalam catatan kaki.
