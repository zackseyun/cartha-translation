  source_fidelity: 'Teks Indonesia menyampaikan semua unsur utama Ibrani dengan setia: peralihan וְעַתָּה, sapaan majemuk אֲדֹנָי יְהוִה, penegasan bahwa Allah adalah Allah, firman yang benar/andal, serta tindakan Allah yang telah berbicara kepada hamba-Nya mengenai hal baik ini. “Segala firman-Mu benar” adalah pemakaian yang wajar untuk bentuk jamak דְבָרֶיךָ dan predikat אֱמֶת; catatan kaki dengan tepat menjaga kemungkinan nuansa futuris dan ‘dapat dipercaya’ dari יִהְיוּ אֱמֶת.'
