  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י יְהוִ֗ה אַתָּה הוּא֙ הָֽ/אֱלֹהִ֔ים וּ/דְבָרֶ֖י/ךָ יִהְי֣וּ אֱמֶ֑ת וַ/תְּדַבֵּר֙ אֶֽל עַבְדְּ/ךָ֔ אֶת הַ/טּוֹבָ֖ה הַ/זֹּֽאת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/028.yaml
  text: And now[a], Lord GOD, you are God, and your words are true[b], and you have spoken this good thing to your servant.
translation:
  language: id
  text: Sekarang, ya Tuhan Yahweh, Engkaulah Allah. Segala firman-Mu benar[a], dan Engkau telah menyampaikan hal yang baik ini kepada hamba-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “segala firman-Mu akan terbukti benar” atau “segala firman-Mu dapat dipercaya.”
    reason: Bentuk kata kerja Ibrani dapat bernuansa kini atau mendatang, sedangkan אֱמֶת dapat menyatakan kebenaran maupun keterandalan.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini mengalihkan doa Daud kepada penegasan dan permohonan berdasarkan firman Allah. Dalam bahasa Indonesia, “Sekarang” menyampaikan peralihan itu secara alami tanpa perlu mempertahankan kata sambung secara kaku.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar “Tuhan”, sedangkan יהוה adalah nama ilahi. “Tuhan Yahweh” mempertahankan kedua unsur dan membedakannya dengan jelas.
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: Engkaulah Allah
  rationale: Partikel -lah secara alami menyampaikan penekanan konstruksi pronominal Ibrani tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: דְבָרֶיךָ
  choice: segala firman-Mu
  rationale: Bentuk Ibrani ini jamak. “Segala firman-Mu” mempertahankan cakupan jamak secara alami; “firman-Mu” tanpa “segala” dapat terdengar tunggal, sedangkan “perkataan-perkataan-Mu” terasa kaku.
- source_word: יִהְיוּ אֱמֶת
  choice: benar
  rationale: Dalam konteks ini, אֱמֶת menyatakan kebenaran sekaligus keterandalan firman Allah. Predikat “benar” merupakan ungkapan Indonesia yang alami, sementara kemungkinan aspek “akan terbukti benar” dicatat dalam catatan kaki.
- source_word: וַתְּדַבֵּר
  choice: Engkau telah menyampaikan
  rationale: Kata kerjanya berarti berbicara dan menunjuk kepada hal baik yang sebelumnya Allah firmankan kepada Daud. “Menyampaikan” cocok dengan objek berupa hal yang baik tanpa mempersempitnya menjadi “berjanji”.
- source_word: אֶל עַבְדְּךָ
  choice: kepada hamba-Mu
  rationale: Dalam doa kerajaan ini, עֶבֶד adalah sebutan Daud bagi dirinya di hadapan Allah. “Hamba” mempertahankan sikap tunduk dan merupakan padanan Indonesia yang wajar.
- source_word: הַטּוֹבָה הַזֹּאת
  choice: hal yang baik ini
  rationale: Frasa Ibrani secara harfiah menunjuk kepada “yang baik ini” dengan nomina tersirat. Pilihan ini mempertahankan keluasan rujukannya dan tidak mempersempitnya menjadi “janji” atau “berkat”.
theological_decisions:
- issue: Penerjemahan nama ilahi dalam אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH
  rationale: Bentuk Ibrani memadukan gelar אֲדֹנָי dengan nama perjanjian יהוה. “Tuhan Yahweh” mempertahankan nama ilahi dan menghindari pengaburan kedua unsur menjadi dua gelar.
- issue: Nilai kala dan makna יִהְיוּ אֱמֶת
  choice: Segala firman-Mu benar
  alternative: Segala firman-Mu akan terbukti benar / dapat dipercaya
  rationale: Bentuk imperfek dapat dibaca sebagai pernyataan yang berlaku terus atau berorientasi ke depan. Konteks doa mendukung pengakuan akan kebenaran firman Allah, tetapi nuansa futuris dan keterandalan tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai “Engkau” dan sufiks hormat “-Mu”. Struktur kalimat dibagi dua agar doa mudah dibaca, sementara penekanan asli dipertahankan melalui “Engkaulah” dan “segala”.
