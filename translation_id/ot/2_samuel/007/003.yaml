source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל הַ/מֶּ֔לֶךְ כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ לֵ֣ךְ עֲשֵׂ֑ה כִּ֥י יְהוָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/003.yaml
  text: And Nathan said to the king[a], “Go, do all that is in your heart, for Yahweh is with you.”
translation:
  language: id
  text: Lalu Natan berkata kepada raja, “Pergilah, lakukanlah segala yang ada dalam hatimu,[a] sebab Yahweh menyertaimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala yang terlintas dalam pikiranmu.” Secara harfiah, “segala yang ada dalam hatimu”; dalam ungkapan Ibrani ini, “hati” dapat menunjuk pada niat, kehendak, atau pikiran batin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan perkembangan cerita secara alami dalam bahasa Indonesia.
- source_word: נָתָן
  choice: Natan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Teks Ibrani memakai nomina umum dengan kata sandang, bukan nama Daud; terjemahan ini tidak menambahkan identifikasi dari konteks.
- source_word: כֹּל אֲשֶׁר בִּלְבָבְךָ
  choice: segala yang ada dalam hatimu
  rationale: Ungkapan ini mencakup niat, kehendak, atau tekad batin. Bentuk idiomatis “dalam hatimu” mempertahankan citra Ibrani dan tetap mudah dipahami.
- source_word: לֵךְ עֲשֵׂה
  choice: Pergilah, lakukanlah
  rationale: Dua bentuk imperatif menyatakan dorongan atau izin untuk bertindak. Bentuk ini mempertahankan susunan ringkas teks sumber.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi nasihat Natan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan sebuah gelar.
- source_word: עִמָּךְ
  choice: menyertaimu
  rationale: Pilihan ini secara alami menyatakan kehadiran dan dukungan dalam bahasa Indonesia tanpa mempersempit resonansi teologisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menggunakan Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi Allah dan tidak menggantinya dengan gelar.
- issue: Makna kehadiran Yahweh dalam עִמָּךְ
  choice: menyertaimu
  alternative: berada di pihakmu
  rationale: “Menyertaimu” mempertahankan makna kehadiran dan dukungan tanpa mengubah perkataan Natan menjadi klaim yang lebih sempit bahwa Allah menyetujui setiap rencana raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif dengan akhiran -lah memberi nada dorongan yang wajar; “raja” dibiarkan sebagai nomina umum sesuai teks sumber.
