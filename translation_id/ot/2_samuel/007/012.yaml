  text: כִּ֣י יִמְלְא֣וּ יָמֶ֗י/ךָ וְ/שָֽׁכַבְתָּ֙ אֶת אֲבֹתֶ֔י/ךָ וַ/הֲקִימֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יֵצֵ֖א מִ/מֵּעֶ֑י/ךָ וַ/הֲכִינֹתִ֖י אֶת מַמְלַכְתּֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/012.yaml
  text: When your days are fulfilled and you lie down with your fathers[a], I will raise up your offspring after you, who will come from your own body[b], and I will establish his kingdom.
translation:
  language: id
  text: Apabila hari-harimu telah genap dan engkau berbaring bersama nenek moyangmu, Aku akan membangkitkan keturunanmu[a] sesudah engkau, yang berasal dari tubuhmu sendiri,[b] dan Aku akan meneguhkan kerajaannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “keturunan” secara harfiah berarti “benih” dan dapat menunjuk kepada keturunan secara kolektif ataupun kepada seorang keturunan sebagai wakil.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari bagian dalam tubuhmu”; suatu ungkapan yang berarti berasal dari tubuhmu sendiri, yakni keturunan biologismu.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִמְלְאוּ יָמֶיךָ
  choice: Apabila hari-harimu telah genap
  rationale: כִּי di sini memperkenalkan keadaan waktu pada masa depan. Ungkapan 'hari-harimu telah genap' mempertahankan gambaran Ibrani tentang berakhirnya masa hidup dengan bahasa Indonesia yang khidmat dan dapat dipahami.
- source_word: וְשָׁכַבְתָּ אֶת־אֲבֹתֶיךָ
  choice: dan engkau berbaring bersama nenek moyangmu
  rationale: Terjemahan ini mempertahankan ungkapan halus Ibrani bagi kematian dan perhimpunan dengan para leluhur tanpa menjabarkannya secara berlebihan.
- source_word: וַהֲקִימֹתִי
  choice: Aku akan membangkitkan
  rationale: Bentuk kausatif dari קום, dengan keturunan sebagai objek, menunjuk pada tindakan menghadirkan seorang penerus. 'Membangkitkan' mempertahankan motif suksesi.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: '''Keturunan'' merupakan padanan Indonesia yang wajar bagi זֶרַע dan tetap dapat menunjuk kepada garis keturunan secara kolektif ataupun seorang wakil tunggal.'
- source_word: אַחֲרֶיךָ
  choice: sesudah engkau
  rationale: Ungkapan ini menyampaikan urutan waktu sekaligus suksesi setelah Daud.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: yang akan keluar dari tubuhmu sendiri
  rationale: Ungkapan Ibrani secara harfiah menyebut bagian dalam tubuh dan menegaskan asal biologis. Padanan ini jelas dalam bahasa Indonesia modern tanpa memakai ungkapan arkais.
- source_word: וַהֲכִינֹתִי
  choice: dan Aku akan meneguhkan
  rationale: Hifil כון berarti membuat kokoh atau menetapkan. 'Meneguhkan' mempertahankan nuansa menjadikan kerajaan itu kukuh.
- source_word: מַמְלַכְתּוֹ
  choice: kerajaannya
  rationale: מַמְלָכָה dapat menunjuk pada kerajaan atau pemerintahan kerajaan; 'kerajaannya' merupakan padanan paling langsung dalam konteks janji dinasti.
theological_decisions:
- issue: Cakupan זַרְעֲךָ dalam janji kepada Daud
  choice: keturunanmu
  alternative: seorang keturunanmu
  rationale: Bentuk Ibrani dapat berfungsi secara kolektif atau menunjuk kepada seorang wakil tunggal. 'Keturunanmu' mempertahankan keterbukaan itu, sementara bentuk tunggal pada 'kerajaannya' mencerminkan kelanjutan tata bahasa ayat tanpa memaksakan pembatasan teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Citra sumber dipertahankan dalam 'hari-harimu telah genap' dan 'berbaring bersama nenek moyangmu', sedangkan idiom anatomi dijernihkan menjadi 'dari tubuhmu sendiri'. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
