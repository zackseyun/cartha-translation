  text: But that night the word of Yahweh came to Nathan[a], saying,
translation:
  language: id
  text: 'Namun, pada malam itu firman Yahweh datang kepada Natan, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Namun, ... datang
  rationale: Bentuk naratif ini melanjutkan kisah. Dalam konteks dekat, “Namun” secara wajar menandai pertentangan dengan persetujuan Natan pada ayat sebelumnya, sedangkan verba “datang” ditempatkan pada rumusan pewahyuan berikutnya.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Ungkapan ini menunjuk malam tertentu yang langsung mengikuti peristiwa sebelumnya; “pada malam itu” merupakan bentuk Indonesia yang alami dan tepat.
- source_word: וַיְהִי דְּבַר יְהוָה
  choice: firman Yahweh datang
  rationale: Secara harfiah konstruksi ini memakai verba “terjadi/ada,” tetapi dalam rumusan kenabian bahasa Indonesia, “firman ... datang” menyampaikan bahwa pewahyuan ilahi diterima tanpa mengganti “firman” dengan istilah yang lebih umum seperti “pesan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: אֶל נָתָן
  choice: kepada Natan
  rationale: Preposisi אֶל menandai penerima pewahyuan; “kepada Natan” adalah ungkapan Indonesia modern yang alami.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi ucapan yang menyusul. “Demikian:” lebih alami dalam bahasa Indonesia daripada “dengan berkata” atau “mengatakan,” dan titik dua menunjukkan bahwa perkataan langsung berlanjut pada ayat berikutnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur diringkas secara wajar tanpa menghilangkan pertentangan naratif, waktu kejadian, rumusan pewahyuan, penerima, atau pengantar ucapan.
