  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תְּכ֣וֹנֵֽן לְ֠/ךָ אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/024.yaml
  text: And you established your people Israel for yourself to be your people forever[a], and you, Yahweh[b], became their God.
translation:
  language: id
  text: Engkau menetapkan umat-Mu Israel bagi-Mu sendiri untuk menjadi umat-Mu selama-lamanya, dan Engkau, Yahweh[a], telah menjadi Allah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani terdapat nama ilahi YHWH, yang di sini ditulis “Yahweh”.
    reason: alternative_reading
  - marker: b
    text: Atau “adalah Allah mereka.” Bahasa Ibrani dapat dipahami secara statif, tetapi “telah menjadi Allah mereka” lebih menonjolkan pembentukan hubungan perjanjian dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּכוֹנֵן
  choice: menetapkan
  rationale: Bentuk verba dari כון di sini menyatakan tindakan membuat kukuh atau menetapkan. “Menetapkan” alami dalam bahasa Indonesia dan sesuai dengan konteks pembentukan hubungan perjanjian.
- source_word: לְךָ ... לְךָ לְעָם
  choice: bagi-Mu sendiri untuk menjadi umat-Mu
  rationale: Pengulangan לְךָ menekankan bahwa Israel dikhususkan sebagai milik Yahweh. Terjemahan ini mempertahankan baik penekanan relasional maupun pengulangannya.
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Menerjemahkan hubungan kepunyaan dan aposisi nama bangsa secara langsung dan wajar.
- source_word: עַד עוֹלָם
  choice: selama-lamanya
  rationale: Mengungkapkan keberlangsungan tanpa batas dalam konteks perjanjian dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan tidak menggantinya dengan gelar.
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: telah menjadi Allah mereka
  rationale: Konstruksi היה dengan ל dapat menyatakan terjalinnya atau berlakunya suatu hubungan. Dalam konteks penetapan Israel sebagai umat Yahweh, “telah menjadi Allah mereka” mempertahankan daya verbal dan timbal balik rumusan perjanjian.
theological_decisions:
- issue: Rumusan timbal balik hubungan perjanjian
  choice: umat-Mu ... Engkau ... telah menjadi Allah mereka
  alternative: umat-Mu ... Engkau ... adalah Allah mereka
  rationale: Pilihan utama mempertahankan pasangan perjanjian—Israel sebagai umat Yahweh dan Yahweh sebagai Allah Israel—serta kemungkinan nuansa pembentukan hubungan dalam הָיִיתָ. Alternatif statif tetap dicatat karena bentuk Ibrani juga dapat dipahami sebagai keadaan yang berlaku.
- issue: Penyajian nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memuat nama diri ilahi יהוה. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan ilahi “Engkau” dan akhiran pronominal kapital. Susunan kalimat mempertahankan pengulangan relasional dalam bahasa Ibrani, tetapi tetap alami dan mudah dipahami.
