  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna Ibrani: וַתְּכוֹנֵן sebagai tindakan menetapkan/mengukuhkan; pengulangan לְךָ dipertahankan dalam relasi kepunyaan; עַמְּךָ יִשְׂרָאֵל diterjemahkan tepat; dan עַד עוֹלָם dinyatakan sebagai durasi permanen. “Telah menjadi Allah mereka” merupakan pembacaan kontekstual yang sah untuk הָיִיתָ לָהֶם לֵאלֹהִים, sementara catatan kaki dengan tepat menjaga kemungkinan pembacaan statif.'
