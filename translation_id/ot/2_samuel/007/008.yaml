  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗ד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מֵ/אַחַ֖ר הַ/צֹּ֑אן לִֽ/הְי֣וֹת נָגִ֔יד עַל עַמִּ֖/י עַל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/008.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people, over Israel.'
translation:
  language: id
  text: 'Jadi, beginilah yang harus kaukatakan kepada hamba-Ku Daud: Beginilah firman Yahweh Semesta Alam: Akulah yang telah mengambilmu dari padang penggembalaan[a], dari belakang kawanan domba, untuk menjadi pemimpin[b] atas umat-Ku, atas Israel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kandang domba”. Kata Ibrani ini dapat menunjuk padang penggembalaan atau tempat kawanan berdiam.
    reason: lexical_alternative
  - marker: b
    text: Atau “penguasa” atau “pangeran”. Istilah Ibrani ini menunjuk orang yang diangkat untuk memimpin atau memerintah, tanpa harus memakai gelar khusus “raja”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi
  rationale: Ungkapan ini menandai peralihan sekaligus konsekuensi dalam amanat ilahi; “Jadi” alami dalam bahasa Indonesia dan mempertahankan daya penghubung wacananya.
- source_word: כֹּה תֹאמַר
  choice: beginilah yang harus kaukatakan
  rationale: Menerjemahkan formula penyampaian pesan secara alami sambil mempertahankan daya perintah bentuk imperfek.
- source_word: לְעַבְדִּי לְדָוִד
  choice: kepada hamba-Ku Daud
  rationale: “Hamba” sesuai dengan sebutan kehormatan relasional bagi Daud di hadapan Allah; aposisi dibuat alami dalam bahasa Indonesia tanpa mengulang preposisi.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Formula kenabian baku ini bermartabat, ringkas, dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Semesta Alam
  rationale: Nama perjanjian dipertahankan sebagai “Yahweh”; צְבָאוֹת diterjemahkan dengan gelar Indonesia yang mapan dan tidak membatasi acuannya hanya pada bala tentara duniawi atau surgawi.
- source_word: אֲנִי לְקַחְתִּיךָ
  choice: Akulah yang mengambil engkau
  rationale: Konstruksi “Akulah” mempertahankan penekanan pada pronomina אֲנִי, sedangkan “mengambil” mencerminkan makna langsung לקח dalam konteks pemilihan dan pengangkatan.
- source_word: מִן הַנָּוֶה
  choice: dari padang penggembalaan
  rationale: נָוֶה dapat menunjuk tempat merumput atau tempat kawanan berdiam; pilihan ini paling jelas dalam konteks pekerjaan Daud sebagai gembala.
- source_word: מֵאַחַר הַצֹּאן
  choice: dari belakang kawanan domba
  rationale: Mempertahankan citra harfiah Daud berjalan di belakang kawanan tanpa menggantinya dengan tafsiran yang lebih umum seperti “menggembalakan”.
- source_word: נָגִיד
  choice: pemimpin
  rationale: נָגִיד menunjuk orang yang diangkat untuk memimpin atau memerintah, tetapi tidak identik dengan gelar khusus “raja”; “pemimpin” menjaga keluasan itu.
- source_word: עַל עַמִּי עַל יִשְׂרָאֵל
  choice: atas umat-Ku, atas Israel
  rationale: Pengulangan עַל dipertahankan untuk menjaga penekanan dan irama teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Penerjemahan עֶבֶד sebagai sebutan bagi Daud
  choice: hamba
  alternative: budak
  rationale: Dalam konteks ini istilah tersebut merupakan sebutan relasional dan kehormatan bagi Daud di hadapan Allah, bukan penekanan pada status perbudakan.
- issue: Penerjemahan gelar צְבָאוֹת
  choice: Semesta Alam
  alternative: Bala Tentara atau bala tentara surgawi
  rationale: Acuan gelar dapat dipahami secara luas; “Semesta Alam” mempertahankan gelar ilahi yang bermartabat tanpa mempersempitnya secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kaukatakan” menjaga kelancaran amanat langsung; kapitalisasi pronomina ilahi mengikuti kebiasaan penghormatan bahasa Indonesia. Pengulangan “atas” sengaja dipertahankan demi struktur dan penekanan teks sumber.
