base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/005.yaml
  text: 'Go and say to my servant David[a], ‘Thus says Yahweh: Would you build a house for me to dwell in?’'
translation:
  language: id
  text: 'Pergilah dan katakanlah kepada hamba-Ku Daud, “Beginilah firman Yahweh: Engkaukah yang akan membangun bagi-Ku sebuah rumah untuk Kudiami?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Apakah engkau hendak membangun bagi-Ku sebuah rumah untuk Kudiami?” Pertanyaan Ibrani ini menekankan kata “engkau” dan bersifat retoris.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif langsung kepada Natan. Partikel -lah mempertahankan daya perintah sekaligus memberi ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְאָמַרְתָּ
  choice: dan katakanlah
  rationale: Waw berurutan dengan bentuk perfektum sesudah imperatif berfungsi sebagai perintah lanjutan; karena itu diterjemahkan sebagai imperatif kedua.
- source_word: עַבְדִּי אֶל דָּוִד
  choice: kepada hamba-Ku Daud
  rationale: עֶבֶד dalam sapaan kerajaan-perjanjian kepada Daud paling tepat berarti 'hamba', bukan menekankan status budak. Nama Daud berfungsi sebagai aposisi dan disampaikan secara alami tanpa mengulang kata depan.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Mempertahankan formula pembawa pesan kenabian dalam ungkapan Indonesia yang baku dan khidmat; nama ilahi יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: הַאַתָּה
  choice: Engkaukah yang akan
  rationale: Partikel tanya yang melekat pada pronomina menonjolkan subjek. Konstruksi 'Engkaukah yang akan' mempertahankan tekanan dan sifat retoris pertanyaan Ibrani.
- source_word: תִּבְנֶה לִּי בַיִת
  choice: membangun bagi-Ku sebuah rumah
  rationale: Kata 'rumah' mempertahankan arti בַּיִת dan permainan kata penting dalam pasal ini antara rumah bagi Yahweh dan rumah bagi Daud; 'sebuah' membuat objek takrif-nol ini alami dalam bahasa Indonesia.
- source_word: לְשִׁבְתִּי
  choice: untuk Kudiami
  rationale: Infinitif konstruk dengan sufiks orang pertama tunggal menyatakan tujuan, yaitu rumah untuk didiami oleh Yahweh. Bentuk ini ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. Transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Arti בַיִת dalam konteks tempat kediaman ilahi
  choice: rumah
  alternative: Bait; bait suci
  rationale: Walaupun yang dimaksud adalah bangunan tempat ibadah, 'rumah' mempertahankan istilah Ibrani dan ketegangan sastra-teologis dalam perikop, khususnya permainan kata dengan 'rumah' atau wangsa Daud.
- issue: Daya pertanyaan הַאַתָּה תִּבְנֶה
  choice: Engkaukah yang akan membangun
  alternative: Apakah engkau akan membangun
  rationale: Susunan terpilih menjaga penekanan pada 'engkau' dan nuansa pertanyaan retoris tanpa menentukan secara berlebihan apakah tekanannya terutama pada identitas pembangun atau niat membangun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam kenabian yang khidmat tetapi mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. 'Rumah' sengaja dipertahankan agar hubungan sastra dalam seluruh pasal tetap terlihat.
