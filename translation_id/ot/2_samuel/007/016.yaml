  yaml_path: translation/ot/2_samuel/007/016.yaml
  text: And your house and your kingdom shall be made sure forever before me[b][a]; your throne shall be established forever.
translation:
  language: id
  text: Keluargamu[b] dan kerajaanmu akan tetap teguh untuk selama-lamanya di hadapanmu[a]; takhtamu akan berdiri kukuh untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah saksi tekstual berbunyi “di hadapan-Ku.”
    reason: textual_variant
  - marker: b
    text: “Keluarga” di sini berarti keluarga kerajaan, yaitu dinasti atau garis keturunan raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶאְמַן
  choice: akan tetap teguh
  rationale: Bentuk nifal dari אמן menyatakan keadaan yang dibuat atau terbukti kokoh, terjamin, dan bertahan. Ungkapan ini alami dalam bahasa Indonesia serta tetap membedakannya dari נָכוֹן pada bagian akhir ayat.
- source_word: בֵּיתְךָ
  choice: keluargamu
  rationale: Dalam konteks janji kerajaan, בַּיִת menunjuk kepada keluarga atau garis keturunan raja, bukan terutama bangunan. “Keluarga” lebih mudah dipahami pembaca Indonesia daripada “wangsa,” sementara nuansa dinasti dijelaskan dalam catatan kaki.
- source_word: וּמַמְלַכְתְּךָ
  choice: dan kerajaanmu
  rationale: מַמְלָכָה di sini menunjuk kepada kerajaan atau kekuasaan kerajaan. “Kerajaanmu” merupakan padanan langsung dan wajar dalam konteks perjanjian dengan Daud.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan keberlangsungan tanpa akhir. Pengulangannya pada akhir ayat dipertahankan demi penekanan sebagaimana dalam bahasa Ibrani.
- source_word: לְפָנֶיךָ
  choice: di hadapanmu
  rationale: Teks Ibrani WLC yang diberikan berbentuk orang kedua tunggal maskulin, yaitu “di hadapanmu.” Varian “di hadapan-Ku” dicatat tanpa menggantikan bacaan teks utama.
- source_word: כִּסְאֲךָ
  choice: takhtamu
  rationale: כִּסֵּא secara harfiah berarti takhta dan sekaligus melambangkan pemerintahan raja; kedua nuansa itu terpelihara dalam padanan ini.
- source_word: יִהְיֶה נָכוֹן
  choice: akan berdiri kukuh
  rationale: Gabungan היה dan נָכוֹן menyatakan bahwa takhta itu akan berada dalam keadaan mantap atau terjamin. “Berdiri kukuh” alami, mempertahankan gambaran kestabilan, dan membedakannya dari וְנֶאְמַן sebelumnya.
theological_decisions:
- issue: Bahasa janji dinasti dan kemungkinan makna mesianis
  choice: Mempertahankan istilah keluarga, kerajaan, dan takhta dalam makna historis-dinastis tanpa menyatakan penggenapan mesianis secara eksplisit.
  alternative: Menerjemahkan בֵּיתְךָ langsung sebagai “dinastimu” atau menambahkan bahasa yang secara eksplisit menunjuk kepada penggenapan mesianis.
  rationale: Dalam konteks langsung, ayat ini menjanjikan kelangsungan garis kerajaan Daud. Makna teologis yang lebih luas tetap mungkin, tetapi tidak dimasukkan secara eksplisit ke dalam terjemahan melebihi yang dikatakan teks Ibrani.
- issue: Varian tekstual pada לְפָנֶיךָ
  choice: Menerjemahkan teks WLC “di hadapanmu” dalam teks utama.
  alternative: Mengikuti sejumlah saksi tekstual yang berbunyi “di hadapan-Ku.”
  rationale: Bacaan orang kedua merupakan bacaan eksplisit dalam sumber Ibrani yang diberikan. Karena orang pertama cocok dengan konteks ucapan ilahi dan didukung sejumlah saksi, bacaan itu dipertahankan dalam catatan kaki sebagai varian yang bermakna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Keluarga” dipilih agar mudah dipahami, dengan makna dinastis diterangkan dalam catatan kaki. Pengulangan “untuk selama-lamanya” dipertahankan untuk mencerminkan penekanan teks Ibrani.
