  text: וּ/לְ/מִן הַ/יּ֗וֹם אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וַ/הֲנִיחֹ֥תִי לְ/ךָ֖ מִ/כָּל אֹיְבֶ֑י/ךָ וְ/הִגִּ֤יד לְ/ךָ֙ יְהוָ֔ה כִּי בַ֖יִת יַעֲשֶׂה לְּ/ךָ֥ יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/011.yaml
  text: and from the day that I appointed judges over my people Israel[a]. And I have given you rest from all your enemies. Yahweh also declares to you that Yahweh will make a house for you.
translation:
  language: id
  text: dan sejak hari ketika Aku mengangkat hakim-hakim atas umat-Ku Israel. Aku telah memberimu ketenteraman dari semua musuhmu. Yahweh pun menyatakan kepadamu bahwa Yahweh akan membuat sebuah rumah bagimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat sebuah rumah bagimu.” “Rumah” di sini dapat menyiratkan wangsa atau dinasti kerajaan, sambil menggemakan keinginan Daud untuk membangun sebuah rumah (bait) bagi Yahweh.
    reason: Menjelaskan padanan harfiah יַעֲשֶׂה בַּיִת dan mempertahankan permainan makna antara bangunan dan wangsa tanpa menetapkan salah satunya secara berlebihan.
lexical_decisions:
- source_word: וּלְמִן הַיּוֹם
  choice: dan sejak hari
  rationale: Gabungan kata depan ini menunjuk pada titik awal dalam waktu yang berlanjut dari kalimat sebelumnya. “Sejak hari” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dari hari”.
- source_word: צִוִּיתִי שֹׁפְטִים
  choice: Aku mengangkat hakim-hakim
  rationale: Walaupun צוה pada dasarnya berarti “memerintahkan”, dalam konstruksi ini kata tersebut mengacu pada penetapan atau pengangkatan para hakim untuk memimpin Israel.
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: atas umat-Ku Israel
  rationale: Kata depan עַל menyatakan lingkup kewenangan para hakim; “atas” mempertahankan hubungan pemerintahan itu.
- source_word: וַהֲנִיחֹתִי לְךָ מִכָּל אֹיְבֶיךָ
  choice: Aku akan memberimu ketenteraman dari semua musuhmu
  rationale: Bentuk kausatif נוח berarti memberi ketenteraman atau kelegaan. Dalam rangkaian janji pada konteks langsung, bentuk ini paling tepat dipahami dengan orientasi masa depan; “ketenteraman dari” menyatakan pembebasan dari ancaman para musuh.
- source_word: וְהִגִּיד לְךָ יְהוָה
  choice: Yahweh pun menyatakan kepadamu
  rationale: נגד bentuk Hifil berarti memberitahukan atau menyatakan. Partikel “pun” secara alami menangkap daya penghubung וְ sekaligus peralihan menuju pernyataan ilahi yang berikut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כִּי בַיִת יַעֲשֶׂה לְּךָ יְהוָה
  choice: bahwa Yahweh akan mendirikan sebuah rumah bagimu
  rationale: “Rumah” mempertahankan metafora dan permainan makna בַּיִת antara bangunan dan garis keturunan kerajaan. “Mendirikan” merupakan padanan Indonesia yang wajar untuk tindakan membentuk atau menegakkan rumah tersebut tanpa secara eksplisit membatasinya pada bangunan fisik.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה; bentuk “Yahweh” mempertahankan nama pribadi itu.
- issue: Makna בַּיִת dalam janji kepada Daud
  choice: rumah, dengan implikasi wangsa kerajaan tetap terbuka
  alternative: wangsa, keluarga kerajaan, atau bait
  rationale: Konteks mengarah pada dinasti Daud, tetapi pilihan kata Ibrani sengaja menggemakan keinginan Daud untuk membangun rumah bagi Yahweh. Menerjemahkannya langsung sebagai “wangsa” atau “bait” akan menghilangkan salah satu lapisan makna.
- issue: Waktu tindakan וַהֲנִיחֹתִי
  choice: 'masa depan: “Aku akan memberimu”'
  alternative: 'masa lampau/hasil kini: “Aku telah memberimu”'
  rationale: Dalam konteks sintaksis, klausa ini berada dalam rangkaian janji yang berorientasi ke masa depan. Terjemahan masa depan menjaga alur wacana, meskipun bentuk perfek Ibrani secara tersendiri dapat tampak sebagai tindakan yang sudah tuntas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang khidmat tetapi mudah dipahami. Awal ayat sengaja memakai “dan” karena klausa pertama melanjutkan kalimat dari ayat sebelumnya. Akhiran hormat pada “umat-Ku” mengikuti rujukan kepada Allah. Penanda catatan kaki ditempatkan sesudah “bagimu”, yaitu pada istilah yang dijelaskannya.
