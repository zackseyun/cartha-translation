    rationale: Walaupun implikasi dinastik kuat dalam konteks, pernyataan tersebut terlalu menentukan salah satu lapisan permainan kata. Catatan sebaiknya menyatakan kemungkinan/nuansa dinastik sambil mempertahankan gema rumah/bait.
