  text: וָ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥תָ/ה אֶת כָּל אֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤תִֽי לְ/ךָ֙ שֵׁ֣ם גָּד֔וֹל כְּ/שֵׁ֥ם הַ/גְּדֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/009.yaml
  text: And I was with you wherever you went[a], and I cut off all your enemies from before you. And I will make for you a great name[b], like the name of the great ones who are on the earth.
translation:
  language: id
  text: Aku telah menyertai engkau ke mana pun engkau pergi dan telah melenyapkan semua musuhmu dari hadapanmu. Aku akan membuat namamu besar[a], seperti nama orang-orang besar yang ada di bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membuat bagimu nama yang besar.” Dalam bahasa Ibrani, “nama” dapat berarti reputasi atau kemasyhuran.
    reason: lexical_alternative
  - marker: b
    text: Atau “di negeri.” Kata Ibrani yang sama dapat berarti bumi atau negeri.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: Aku menyertai engkau
  rationale: Mengungkapkan kehadiran sekaligus dukungan ilahi dengan bahasa Indonesia yang alami; bentuk lampau dipahami dari rangkaian tindakan yang sedang dikenang.
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: ke mana pun engkau pergi
  rationale: Padanan idiomatis yang mempertahankan cakupan menyeluruh ungkapan Ibrani.
- source_word: וָאַכְרִתָה
  choice: melenyapkan
  rationale: Dalam bentuk Hifil, כרת di sini berarti menyingkirkan atau membinasakan. 'Melenyapkan' mempertahankan daya ungkapnya tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan citra ruang harfiah 'dari depan/wajahmu' dan menyatakan bahwa para musuh disingkirkan dari jalan atau hadapan Daud.
- source_word: וְעָשִׂיתִי לְךָ שֵׁם גָּדוֹל
  choice: Aku akan membuat namamu besar
  rationale: Bentuk yang alami dalam bahasa Indonesia serta mempertahankan idiom 'nama' sebagai reputasi atau kemasyhuran. Nuansa benefaktif לְךָ terwakili dalam tindakan Allah bagi Daud.
- source_word: כְּשֵׁם הַגְּדֹלִים
  choice: seperti nama orang-orang besar
  rationale: Pengulangan 'nama' mempertahankan kesejajaran Ibrani. 'Orang-orang besar' tidak membatasi jenis kelamin dan dapat mencakup tokoh-tokoh yang berkuasa atau termasyhur.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: yang ada di bumi
  rationale: Dalam perbandingan luas dengan tokoh-tokoh besar, 'bumi' paling sesuai, sementara kemungkinan arti 'negeri' dicatat dalam catatan kaki.
theological_decisions:
- issue: Nilai waktu וְעָשִׂיתִי dalam konteks janji ilahi
  choice: Aku akan membuat namamu besar
  alternative: Aku telah membuat namamu besar
  rationale: Walaupun bentuknya qatal, alur wacana beralih dari tindakan Allah pada masa lalu kepada janji-Nya bagi Daud. Bentuk mendatang paling jelas menyampaikan fungsi promissoris ini tanpa meniadakan kemungkinan bahwa penggenapannya sudah mulai dialami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai sesuai konteks firman Allah kepada Daud. Ungkapan 'dari hadapanmu' sengaja mempertahankan citra Ibrani, sedangkan 'membuat namamu besar' menghindari susunan yang kaku tanpa menghilangkan idiom alkitabiah.
