id: 2SA.7.10
reference: 2 Samuel 7:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י לְ/יִשְׂרָאֵ֤ל וּ/נְטַעְתִּי/ו֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹֽא יֹסִ֤יפוּ בְנֵֽי עַוְלָה֙ לְ/עַנּוֹת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/010.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], so that they may dwell in their own place and be disturbed no more. And the sons of wickedness shall no longer afflict them, as formerly.
translation:
  language: id
  text: Aku akan menetapkan suatu tempat bagi umat-Ku Israel dan menanam mereka, sehingga mereka dapat tinggal di tempat mereka sendiri dan tidak lagi diganggu. Orang-orang jahat[a] tidak akan lagi menindas mereka seperti dahulu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak kejahatan” atau “anak-anak kelaliman.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Aku akan menetapkan
  rationale: Kata שׂוּם pada dasarnya berarti 'menaruh/menempatkan'; dengan מָקוֹם sebagai objek dalam konteks janji ini, 'menetapkan suatu tempat' menyampaikan tindakan Allah yang menentukan tempat bagi Israel.
- source_word: מָקוֹם
  choice: suatu tempat
  rationale: Makna dasarnya ialah 'tempat'. Pilihan ini tidak mempersempitnya menjadi 'tanah air' dan tetap mencakup gagasan permukiman yang aman.
- source_word: לְעַמִּי לְיִשְׂרָאֵל
  choice: bagi umat-Ku Israel
  rationale: Kedua frasa ini bersifat aposisional; terjemahan ini mempertahankan baik hubungan kepunyaan perjanjian maupun nama Israel.
- source_word: וּנְטַעְתִּיו
  choice: dan menanam mereka
  rationale: Bentuk Ibrani memakai sufiks tunggal maskulin untuk Israel sebagai kelompok. Bahasa Indonesia secara alami memakai 'mereka', sedangkan 'menanam' mempertahankan metafora tentang pemantapan yang kokoh.
- source_word: וְשָׁכַן
  choice: sehingga mereka dapat tinggal
  rationale: Verba tunggal mengikuti Israel sebagai nomina kolektif. 'Sehingga' menyatakan hasil dari tindakan menanam tanpa mengubah pokok janji.
- source_word: תַּחְתָּיו
  choice: di tempat mereka sendiri
  rationale: Dalam konteks permukiman, תַּחַת dapat bersifat idiomatis, yakni berada tetap pada tempatnya sendiri, bukan sekadar 'di bawahnya' secara ruang.
- source_word: יִרְגַּז
  choice: diganggu
  rationale: רגז dapat berarti gemetar, terguncang, atau terusik. Bentuk pasif 'diganggu' sesuai dengan konteks ancaman dari para penindas dan alami dalam bahasa Indonesia.
- source_word: בְנֵי עַוְלָה
  choice: orang-orang jahat
  rationale: Ungkapan harfiahnya 'anak-anak kejahatan/kelaliman', sebuah idiom Ibrani bagi orang yang berbuat jahat. Terjemahan idiomatis menghindari kesan hubungan keturunan yang tidak dimaksudkan; bentuk harfiah dicatat dalam catatan kaki.
- source_word: לְעַנּוֹתוֹ
  choice: menindas mereka
  rationale: ענה dalam bentuk Piel dapat berarti menindas, menyengsarakan, atau merendahkan. Dalam konteks perlakuan bermusuhan terhadap Israel, 'menindas' paling langsung dan wajar.
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: seperti dahulu
  rationale: Frasa ini membandingkan keadaan yang dijanjikan dengan masa penindasan sebelumnya; 'seperti dahulu' ringkas dan alami.
theological_decisions:
- issue: Israel sebagai nomina kolektif tunggal dengan verba dan sufiks tunggal
  choice: Menggunakan pronomina jamak 'mereka' dalam bahasa Indonesia
  alternative: 'Mempertahankan personifikasi tunggal: ''menanam dia ... dia tinggal ... menindas dia'''
  rationale: Bahasa Ibrani lazim memperlakukan suatu bangsa sebagai bentuk kolektif tunggal. Bentuk jamak dalam bahasa Indonesia memperjelas bahwa yang dimaksud ialah umat Israel dan merupakan keputusan kebahasaan, bukan penafsiran doktrinal.
- issue: Ungkapan idiomatis בְנֵי עַוְלָה
  choice: Menerjemahkan secara idiomatis sebagai 'orang-orang jahat' dengan bentuk harfiah dalam catatan kaki
  alternative: Memakai bentuk harfiah 'anak-anak kejahatan' dalam teks utama
  rationale: Dalam bahasa Indonesia, bentuk harfiah mudah disalahpahami sebagai asal-usul atau hubungan keluarga. Terjemahan idiomatis menyampaikan rujukan kepada para pelaku kejahatan sambil mempertahankan bentuk sumber melalui catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum Alkitab bahasa Indonesia. Metafora 'menanam' dipertahankan, sedangkan idiom yang akan kabur bila diterjemahkan harfiah dijelaskan melalui catatan kaki.
