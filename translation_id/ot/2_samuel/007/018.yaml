reference: 2 Samuel 7:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔ד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִ֣י אָנֹכִ֞י אֲדֹנָ֤/י יְהוִה֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/018.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, Lord GOD, and what is my house, that you have brought me this far?”
translation:
  language: id
  text: Kemudian Raja Daud masuk dan duduk di hadapan Yahweh, lalu berkata, “Siapakah aku, ya Tuhan Yahweh, dan siapakah keluargaku,[a] sehingga Engkau telah membawa aku sampai sejauh ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahku.” Di sini kata “rumah” dapat mencakup keluarga, rumah tangga, dan garis keturunan atau dinasti Daud. Kata ini juga menggemakan penggunaan “rumah” berulang kali dalam pasal ini.
    reason: Menjelaskan cakupan semantis בַּיִת dan mempertahankan permainan kata penting dalam 2 Samuel 7.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Verba בוא menyatakan gerak masuk ke suatu tempat. Konteks tidak menyebutkan lokasinya, sehingga terjemahan ini mempertahankan gerak konkret tanpa menambah keterangan.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan gelar serta nama pribadi.
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: Dalam rangkaian tindakan masuk lalu berbicara, makna fisik 'duduk' paling sesuai daripada 'tinggal'.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan di hadapan atau dalam hadirat seseorang; ungkapan Indonesia ini ringkas dan dekat dengan bentuk sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, sesuai sumber Ibrani dan kebijakan istilah proyek.
- source_word: מִי אָנֹכִי
  choice: Siapakah aku
  rationale: Ungkapan tanya retoris ini menyatakan kerendahan hati Daud dan terdengar wajar serta khidmat dalam bahasa Indonesia.
- source_word: אֲדֹנָי יְהוִה
  choice: ya Tuhan Yahweh
  rationale: אֲדֹנָי berfungsi sebagai sapaan gelar dan יְהוִה sebagai nama ilahi. Bentuk ini mempertahankan kedua unsur tanpa menghasilkan pengulangan 'Tuhan TUHAN' yang kurang jelas dalam teks biasa.
- source_word: וּמִי בֵיתִי
  choice: dan apakah keluargaku
  rationale: Secara harfiah terdapat 'dan siapa rumahku', tetapi בַּיִת di sini menunjuk kepada keluarga, rumah tangga, atau garis keturunan Daud. 'Keluargaku' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan permainan tematis kata 'rumah' dalam pasal ini.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan retoris ini כִּי menghubungkan rendahnya kedudukan Daud dengan tindakan Allah yang membawanya sampai pada tahap tersebut; 'sehingga' menyampaikan hubungan itu secara alami.
- source_word: הֲבִיאֹתַנִי
  choice: Engkau telah membawa aku
  rationale: Bentuk Hifil dari בוא bersifat kausatif, yaitu 'membawa'. Pronomina hormat dikapitalisasi menurut kelaziman bahasa Indonesia untuk sapaan kepada Allah.
- source_word: עַד הֲלֹם
  choice: sampai sejauh ini
  rationale: Ungkapan ini menunjuk pada tahap atau kedudukan yang telah dicapai Daud hingga saat itu. Terjemahan tersebut mempertahankan nuansa perjalanan maupun kemajuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama perjanjian dan mengikuti kebijakan istilah proyek tanpa menggantinya dengan gelar.
- issue: Makna בֵיתִי dalam tanggapan Daud
  choice: keluargaku dalam teks utama, dengan 'rumahku' dijelaskan dalam catatan kaki
  alternative: rumahku; rumah tanggaku; dinastiku
  rationale: Yang dimaksud melampaui bangunan fisik dan mencakup keluarga, rumah tangga, serta garis keturunan. 'Keluargaku' mudah dipahami pembaca modern, sedangkan catatan kaki menjaga kaitan sastra-teologis dengan permainan kata 'rumah' sepanjang pasal.
- issue: Hubungan אֲדֹנָי dengan יְהוִה
  choice: ya Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan Yahweh tanpa partikel sapaan
  rationale: Terjemahan ini membedakan gelar אֲדֹנָי dari nama יְהוִה dan mencerminkan bahwa Daud sedang menyapa Allah secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Urutan tindakan Ibrani dipertahankan tanpa menentukan tempat Daud masuk. Sapaan ilahi dibuat jelas, dan ambiguitas tematis kata 'rumah' dipelihara melalui catatan kaki.
