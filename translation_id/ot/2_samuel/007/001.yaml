revisions:
- from: Ketika raja telah tinggal di rumahnya[a] dan Yahweh telah memberinya ketenteraman dari semua musuh di sekelilingnya,
  to: Ketika raja tinggal di rumahnya[a] dan Yahweh telah mengaruniakan keamanan kepadanya terhadap semua musuhnya di sekelilingnya,
  rationale: Revisi mengganti “ketenteraman” dengan “keamanan” agar konteks kelegaan dari musuh lebih nyata, serta menata ulang bagian akhir agar cakupan “di sekelilingnya” dan relasinya dengan keamanan yang diberikan Yahweh tidak mudah disalahpahami. Catatan kaki dan penandanya tetap tepat, dan koma akhir dipertahankan karena kalimat berlanjut ke ayat 2.
