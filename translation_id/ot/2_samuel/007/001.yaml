  text: וַ/יְהִ֕י כִּי יָשַׁ֥ב הַ/מֶּ֖לֶךְ בְּ/בֵית֑/וֹ וַ/יהוָ֛ה הֵנִֽיחַ ל֥/וֹ מִ/סָּבִ֖יב מִ/כָּל אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/001.yaml
  text: When the king was living in his house[a], and Yahweh had given him rest on every side from all his enemies,
translation:
  language: id
  text: Ketika raja tinggal di rumahnya[a] dan Yahweh telah mengaruniakan keamanan kepadanya terhadap semua musuhnya di sekelilingnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istananya”. Secara harfiah, teks Ibrani berbunyi “rumahnya”; kata “rumah” dipertahankan karena juga mengantisipasi permainan kata selanjutnya dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Rumus naratif ini memperkenalkan keadaan waktu bagi peristiwa berikutnya. 'Ketika' wajar dalam bahasa Indonesia modern tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: יָשַׁב
  choice: telah tinggal
  rationale: Dalam konteks ini verba tersebut menyatakan keadaan menetap atau berdiam, bukan tindakan duduk secara harfiah. Bentuk 'telah tinggal' juga sesuai dengan keadaan yang mendahului tindakan pada ayat berikutnya.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Gelar definit sumber dipertahankan; teks menyebut jabatan sang tokoh, bukan nama Daud.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: '''Rumah'' mempertahankan arti dasar בַּיִת dan menyiapkan permainan makna ''rumah'' yang penting dalam pasal ini; nuansa kediaman kerajaan tidak dimasukkan ke dalam teks utama.'
- source_word: וַיהוָה
  choice: dan Yahweh
  rationale: Konjungsi antarklausa dipertahankan, dan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: הֵנִיחַ לוֹ
  choice: telah memberinya ketenteraman
  rationale: Bentuk kausatif menyatakan bahwa Yahweh memberikan keadaan aman atau bebas dari gangguan. 'Ketenteraman' terdengar alami dan mencakup kelegaan dari peperangan.
- source_word: מִסָּבִיב מִכָּל אֹיְבָיו
  choice: dari semua musuh di sekelilingnya
  rationale: Susunan ini menyampaikan bahwa ketenteraman itu berkaitan dengan seluruh musuh yang mengelilinginya, sambil tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani menggunakan nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa kediaman kerajaan pada בַּיִת
  choice: rumah
  alternative: istana
  rationale: '''Rumah'' lebih dekat dengan bentuk Ibrani dan mempertahankan permainan kata yang berkembang kemudian antara rumah Daud, rumah bagi Yahweh, dan wangsa Daud.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya. Penanda catatan kaki [a] ditempatkan tepat setelah kata yang dijelaskan.
