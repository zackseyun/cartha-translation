  naturalness: “Sebab sejak hari Aku membawa orang Israel keluar dari Mesir sampai hari ini, Aku tidak pernah tinggal dalam sebuah rumah” alami dan baku. “Sebaliknya, Aku terus berjalan ke sana kemari dalam kemah dan dalam Kemah Suci” juga alami, sambil mempertahankan susunan dan kontras sumber.
  terminology: “Orang Israel” merupakan padanan kolektif yang wajar bagi בְּנֵי יִשְׂרָאֵל. Dalam konteks tempat ibadah portabel, מִשְׁכָּן sebaiknya diterjemahkan “Kemah Suci”; catatan kaki dapat mencatat arti leksikal “kediaman/tempat tinggal.”
