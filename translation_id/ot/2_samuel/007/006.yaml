base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/006.yaml
  text: For I have not dwelt in a house from the day I brought up the sons of Israel out of Egypt to this day[b][a], but I have been moving about in a tent and in a tabernacle.
translation:
  language: id
  text: Sebab sejak hari Aku membawa orang Israel keluar dari Mesir sampai hari ini, Aku tidak pernah tinggal dalam sebuah rumah. Sebaliknya, Aku terus berjalan ke sana kemari dalam kemah dan dalam Kemah Suci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dalam kemah dan dalam kediaman”; kata Ibrani מִשְׁכָּן berarti “kediaman” atau “tempat tinggal” dan, dalam konteks ini, merujuk pada Kemah Suci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי בְּבַיִת
  choice: tinggal dalam sebuah rumah
  rationale: ישׁב dalam konteks tempat tinggal berarti “tinggal” atau “berdiam.” “Sebuah rumah” mempertahankan bentuk tak tentu dan tidak langsung menafsirkannya sebagai bait.
- source_word: לְמִיּוֹם הַעֲלֹתִי
  choice: sejak hari Aku membawa ... keluar
  rationale: Frasa ini menandai titik awal waktu, sedangkan bentuk kausatif עלה menyatakan tindakan Allah membawa Israel keluar dari Mesir.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan idiomatis Ibrani ini menunjuk kepada bangsa keturunan Israel secara keseluruhan; “orang Israel” alami dalam bahasa Indonesia modern dan tidak membatasi rujukannya hanya pada laki-laki.
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan Indonesia yang lugas bagi ungkapan temporal yang memperpanjang keadaan tersebut hingga waktu ujaran.
- source_word: וָאֶהְיֶה מִתְהַלֵּךְ
  choice: terus berpindah-pindah
  rationale: Konstruksi dengan partisipel Hitpael menyampaikan keadaan bergerak atau berpindah yang berlangsung terus, berlawanan dengan menetap dalam rumah.
- source_word: בְּאֹהֶל וּבְמִשְׁכָּן
  choice: dengan kemah sebagai kediaman-Ku
  rationale: Pasangan אהל dan משכן secara harfiah adalah “dalam kemah dan dalam kediaman.” Susunan Indonesia ini mempertahankan kedua unsur semantis tanpa memberi kesan keliru bahwa Allah berpindah di antara dua bangunan terpisah.
theological_decisions:
- issue: Identitas בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam pemakaian ini, ungkapan tersebut adalah sebutan kolektif bagi bangsa Israel. Pilihan idiomatis menghindari salah paham bahwa hanya anak-anak atau kaum laki-laki yang dimaksud.
- issue: Hubungan אֹהֶל dan מִשְׁכָּן
  choice: kemah sebagai kediaman-Ku
  alternative: dalam kemah dan dalam Kemah Suci
  rationale: משכן secara leksikal berarti “kediaman/tempat tinggal” dan dalam konteks kultis dapat menunjuk Kemah Suci. Teks Ibrani tetap menyandingkan dua nomina; terjemahan utama membacanya sebagai gambaran kemah yang menjadi kediaman Allah, sambil mencatat terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Struktur temporal didahulukan agar rentang waktu terdengar alami, sementara aspek berkelanjutan dinyatakan dengan “tidak pernah” dan “terus”.
