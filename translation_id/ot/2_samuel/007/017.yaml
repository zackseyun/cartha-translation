  text: According to all these words and according to all this vision[a], so Nathan spoke to David.
translation:
  language: id
  text: Sesuai dengan semua perkataan ini dan sesuai dengan seluruh penglihatan ini[a], demikianlah Natan berbicara kepada Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wahyu”. Istilah Ibrani ini menunjuk pada pewahyuan kenabian yang sering diterima dalam bentuk penglihatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל
  choice: sesuai dengan semua
  rationale: Awalan כְּ menyatakan kesesuaian, sedangkan כֹל berarti 'semua'. Ungkapan ini mempertahankan struktur Ibrani dan menegaskan bahwa laporan Natan selaras sepenuhnya dengan pesan yang diterimanya.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan ini
  rationale: דְּבָרִים dapat berarti 'perkataan', 'hal', atau 'perkara'. Dalam konteks pesan ilahi yang disampaikan Natan, 'perkataan' paling tepat mempertahankan isi verbalnya.
- source_word: וּכְכֹל
  choice: dan sesuai dengan seluruh
  rationale: Pengulangan frasa preposisional dipertahankan untuk mencerminkan kesejajaran dan penekanan dalam bahasa Ibrani; 'seluruh' dipakai secara alami karena menerangkan penglihatan sebagai satu kesatuan.
- source_word: הַחִזָּיוֹן הַזֶּה
  choice: penglihatan ini
  rationale: חִזָּיוֹן menunjuk pada penglihatan yang bersifat pewahyuan. 'Penglihatan' merupakan padanan langsung dan tidak memperluas makna secara interpretatif.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן merangkum perbandingan sebelumnya dan menunjukkan bahwa Natan menyampaikan pesan tepat sebagaimana diterimanya.
- source_word: דִּבֶּר
  choice: berbicara
  rationale: דבר adalah verba umum untuk berbicara. 'Berbicara kepada' mempertahankan bentuk naratif sumber dan hubungan dengan 'perkataan' sebelumnya.
- source_word: נָתָן
  choice: Natan
  rationale: Nama Ibrani disesuaikan dengan bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: אֶל דָּוִד
  choice: kepada Daud
  rationale: אֶל menunjukkan arah ujaran kepada seseorang; 'kepada Daud' adalah padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Sifat pewahyuan kenabian dalam חִזָּיוֹן
  choice: penglihatan
  alternative: penyataan
  rationale: Istilah Ibrani secara eksplisit menunjuk pada penglihatan pewahyuan. 'Penglihatan' mempertahankan cara pewahyuan yang dinyatakan teks, sedangkan catatan kaki mengakui bahwa maknanya juga dapat diungkapkan sebagai 'penyataan'.
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Kesejajaran frasa Ibrani dipertahankan tanpa menghasilkan susunan yang terlalu kaku; 'demikianlah' memberi penutup yang wajar bagi konstruksi perbandingan tersebut.
