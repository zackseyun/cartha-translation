  text: וַ/תִּקְטַן֩ ע֨וֹד זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֣/י יְהוִ֔ה וַ/תְּדַבֵּ֛ר גַּ֥ם אֶל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵֽ/רָח֑וֹק וְ/זֹ֛את תּוֹרַ֥ת הָ/אָדָ֖ם אֲדֹנָ֥/י יְהוִֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/019.yaml
  text: And even this was too small in your eyes[a], Lord GOD; you have also spoken of your servant’s house for a long time to come, and this is the law of man[c][b], Lord GOD.
translation:
  language: id
  text: Bahkan hal ini pun terlalu kecil di mata-Mu, ya Tuhan ALLAH. Engkau juga telah berfirman tentang rumah hamba-Mu[b] hingga masa yang jauh[a]. Dan inilah pengajaran bagi manusia[c], ya Tuhan ALLAH.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hingga kepada yang jauh”; maksudnya dapat menunjuk pada masa depan yang jauh.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “rumah” dapat berarti rumah tangga, keluarga, atau dinasti.
    reason: lexical_alternative
  - marker: c
    text: 'Bagian akhir ayat ini sulit dalam bahasa Ibrani. Terjemahan lain yang mungkin: “inilah piagam bagi umat manusia,” “inilah hukum atau adat manusia,” atau “inilah pengajaran mengenai umat manusia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְטַן עוֹד זֹאת בְּעֵינֶיךָ
  choice: Bahkan hal ini pun terlalu kecil di mata-Mu
  rationale: Mempertahankan idiom Ibrani tentang sesuatu yang dinilai 'kecil di mata' seseorang. 'Terlalu kecil' menyampaikan bahwa janji sebelumnya dipandang belum seberapa dalam kemurahan Allah.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan ALLAH
  rationale: Mengikuti kelaziman terjemahan Indonesia untuk gelar majemuk Adonai YHWH, sambil membedakannya dari penyebutan biasa nama ilahi.
- source_word: וַתְּדַבֵּר גַּם אֶל
  choice: Engkau juga telah berfirman tentang
  rationale: Dalam konteks ini firman tersebut berkenaan dengan keluarga atau wangsa Daud. 'Berfirman' wajar dipakai ketika Allah menjadi subjek.
- source_word: בֵּית עַבְדְּךָ
  choice: keluarga hamba-Mu
  rationale: Secara harfiah berarti 'rumah hamba-Mu', tetapi בַּיִת di sini mencakup keluarga dan wangsa. 'Keluarga' alami dalam bahasa Indonesia, sedangkan keluasan maknanya dipertahankan dalam catatan.
- source_word: לְמֵרָחוֹק
  choice: untuk masa yang masih jauh
  rationale: Ungkapan 'kepada/hingga yang jauh' dalam konteks ini menunjuk pada masa depan yang jauh.
- source_word: תּוֹרַת
  choice: pengajaran
  rationale: תּוֹרָה dapat berarti pengajaran, hukum, atau ketetapan. 'Pengajaran' mempertahankan keluasan makna dan tidak mempersempit frasa sulit ini menjadi hukum legal semata.
- source_word: הָאָדָם
  choice: manusia
  rationale: אָדָם dengan kata sandang dapat merujuk kepada manusia atau umat manusia. 'Manusia' mempertahankan bentuk kolektif yang wajar dalam bahasa Indonesia tanpa memasukkan tafsiran khusus.
theological_decisions:
- issue: Makna frasa sulit וְזֹאת תּוֹרַת הָאָדָם
  choice: Dan inilah pengajaran bagi manusia
  alternative: Dan inilah piagam bagi umat manusia; dan inilah hukum/adat manusia; dan inilah pengajaran mengenai umat manusia
  rationale: Susunan Ibraninya sangat sulit dan memungkinkan beberapa hubungan makna. Teks utama mengikuti unsur leksikalnya secara dekat tanpa memasukkan tafsiran dinastik atau mesianik tertentu; pilihan lain dicatat agar ketegangan asli tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai “Engkau” dan akhiran “-Mu”. Metafora “di mata-Mu” dipertahankan karena tetap alami, sedangkan “rumah” dialihkan menjadi “keluarga” dalam teks utama dan dijelaskan dalam catatan.
