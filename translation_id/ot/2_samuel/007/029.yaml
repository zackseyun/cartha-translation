base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/029.yaml
  text: And now[a], please be willing and bless the house of your servant, that it may continue before you forever. For you, Lord Yahweh, have spoken[c][b], and by your blessing the house of your servant will be blessed forever.
translation:
  language: id
  text: Sekarang, sudilah memberkati rumah hamba-Mu[a], supaya rumah itu tetap ada di hadapan-Mu untuk selama-lamanya. Sebab Engkau, Tuhan Yahweh[b], telah berfirman, dan oleh berkat-Mu rumah hamba-Mu akan diberkati untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah hamba-Mu”; dalam konteks ini dapat berarti rumah tangga, keluarga, garis keturunan, atau dinasti.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai gabungan gelar dan nama אֲדֹנָי יְהוִה (Adonai YHWH), “Tuhan Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹאֵל וּבָרֵךְ
  choice: sudilah memberkati
  rationale: Kata הוֹאֵל mengungkapkan kesediaan atau perkenanan dalam permohonan. “Sudilah” menyampaikan nada hormat dan memohon secara alami dalam bahasa Indonesia, sedangkan “memberkati” menerjemahkan imperatif וּבָרֵךְ tanpa parafrasa berlebihan.
- source_word: בֵּית עַבְדְּךָ
  choice: keluarga hamba-Mu
  rationale: בַּיִת secara harfiah berarti “rumah”, tetapi dalam konteks ini mencakup keluarga, garis keturunan, atau dinasti Daud. “Keluarga” paling mudah dipahami dalam bahasa Indonesia modern, sementara catatan kaki mempertahankan keluasan makna Ibraninya.
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: supaya keluarga itu tetap ada di hadapan-Mu untuk selama-lamanya
  rationale: Ungkapan ini secara harfiah berarti “untuk ada selama-lamanya di hadapan-Mu”. “Tetap ada” menyampaikan keberlangsungan tanpa menambahkan gagasan “diteguhkan” yang tidak dinyatakan langsung oleh היה.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  rationale: Terjemahan ini mempertahankan gabungan gelar אֲדֹנָי dan nama perjanjian יְהוִה, serta menghindari bentuk rancu “Tuhan TUHAN”.
- source_word: דִּבַּרְתָּ
  choice: telah berfirman
  rationale: Bentuk perfektif menunjuk kepada firman Allah yang sudah diucapkan dan tetap menjadi dasar keyakinan Daud. “Berfirman” sesuai untuk ujaran ilahi dalam ragam Indonesia yang bermartabat.
- source_word: וּמִבִּרְכָתְךָ יְבֹרַךְ
  choice: dan oleh berkat-Mu ... akan diberkati
  rationale: Preposisi מִן dipahami sebagai sumber atau sarana berkat. Bentuk pasif imperfektif יְבֹרַךְ diterjemahkan dengan masa depan “akan diberkati”.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyampaikan keberlangsungan tanpa akhir dalam konteks janji perjanjian dengan ragam yang alami dan khidmat.
theological_decisions:
- issue: Makna בַּיִת dalam janji kepada Daud
  choice: keluarga hamba-Mu, dengan catatan tentang arti harfiah dan dinastis
  alternative: rumah hamba-Mu; dinasti hamba-Mu
  rationale: Konteksnya menyangkut garis keturunan dan pemerintahan Daud, tetapi kata Ibrani “rumah” sengaja memiliki cakupan rumah tangga, keluarga, dan dinasti. Teks utama dibuat alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga ketegangan maknanya.
- issue: Penyebutan nama ilahi dalam אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan TUHAN; Tuhan Yang Berdaulat
  rationale: “Tuhan Yahweh” membedakan gelar dari nama diri ilahi dan mempertahankan bentuk sumber tanpa memasukkan gelar tafsiran tambahan.
- issue: Arti “di hadapan-Mu”
  choice: mempertahankan ungkapan di hadapan-Mu tanpa menjelaskannya sebagai perkenanan atau pengawasan
  alternative: dalam perkenanan-Mu; di bawah pengawasan-Mu
  rationale: Ungkapan sumber dapat menyiratkan kehadiran dan perkenanan Allah, tetapi tidak menentukan hanya satu nuansa; karena itu ambiguitasnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “sudilah” mempertahankan nada permohonan yang hormat; kapitalisasi pada sapaan kepada Allah dipakai secara konsisten. Pengulangan “keluarga hamba-Mu” dipertahankan agar hubungan antarklausa tetap jelas dan sejalan dengan pengulangan dalam teks Ibrani.
