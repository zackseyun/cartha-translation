  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֥ן גָּדַ֖לְתָּ אֲדֹנָ֣/י יְהוִ֑ה כִּֽי אֵ֣ין כָּמ֗וֹ/ךָ וְ/אֵ֤ין אֱלֹהִים֙ זֽוּלָתֶ֔/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/007/022.yaml
  text: Therefore you are great[a], Lord GOD, for there is none like you, and there is no God besides you[b], according to all that we have heard with our ears.
translation:
  language: id
  text: Karena itu, Engkau sungguh besar, ya Tuhan YAHWEH,[a] sebab tidak ada yang seperti Engkau dan tidak ada Allah selain Engkau,[b] sesuai dengan segala yang telah kami dengar dengan telinga kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Adonai YHWH, yaitu gelar “Tuhan” diikuti nama ilahi YHWH.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “tidak ada allah kecuali Engkau” atau “tidak ada Allah di luar Engkau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan dari tindakan dan janji Allah yang disebutkan sebelumnya, sambil mempertahankan hubungan logis dengan konteks.
- source_word: גָּדַלְתָּ
  choice: Engkau sungguh besar
  rationale: Bentuk perfektum dapat menyatakan keadaan atau pengakuan akan kebesaran. Partikel 'sungguh' membuat seruan pujian ini alami dalam bahasa Indonesia tanpa mengubahnya menjadi klaim bahwa Allah baru menjadi besar.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  rationale: Mempertahankan gelar אֲדֹנָי dan nama ilahi יהוה sebagai dua unsur yang berbeda. Bentuk ini menghindari 'Tuhan TUHAN' dan tidak menyamarkan nama perjanjian.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi pengakuan tentang kebesaran Allah.
- source_word: אֵין כָּמוֹךָ
  choice: tidak ada yang seperti Engkau
  rationale: Menyampaikan ungkapan ketakterbandingan secara langsung dan alami.
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: dan tidak ada Allah selain Engkau
  rationale: זוּלָתֶךָ menyatakan pengecualian, yakni 'selain', 'kecuali', atau 'di luar'. Huruf kapital pada 'Allah' sesuai dengan pengakuan eksklusif dalam konteks ini tanpa menambahkan uraian filosofis.
- source_word: בְּכֹל אֲשֶׁר שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: sesuai dengan segala yang telah kami dengar dengan telinga kami
  rationale: Mempertahankan nilai preposisi ב sebagai tolok ukur kesaksian yang diterima serta idiom Ibrani yang menekankan pendengaran langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi dalam אֲדֹנָי יְהוִה
  choice: Tuhan YAHWEH
  alternative: Tuhan ALLAH; Tuhan Yang Berdaulat; Tuhan Yahweh
  rationale: Teks memadukan gelar 'Tuhan' dengan nama ilahi YHWH. 'Tuhan YAHWEH' mempertahankan kedua unsur tersebut dan membedakan nama ilahi dari sebutan umum, sedangkan catatan kaki menjelaskan bentuk Ibraninya.
- issue: Eksklusivitas ilahi dalam אֵין אֱלֹהִים זוּלָתֶךָ
  choice: tidak ada Allah selain Engkau
  alternative: tidak ada allah kecuali Engkau; tidak ada Allah di luar Engkau
  rationale: Terjemahan mempertahankan pengakuan langsung bahwa tidak ada Allah selain YHWH, tanpa memperluasnya menjadi rumusan teologis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital sesuai kelaziman religius Indonesia. Struktur paralel Ibrani dipertahankan, demikian pula ungkapan konkret 'dengan telinga kami'. Nama YAHWEH ditulis dengan huruf kapital untuk menandai Tetragramaton dan membedakannya dari gelar 'Tuhan'.
