  source_fidelity: Terjemahan dengan setia menyampaikan hubungan inferensial עַל־כֵּן (“Karena itu”), pengakuan akan kebesaran Allah, alasan yang diperkenalkan כִּי (“sebab”), ketakterbandingan-Nya, eksklusivitas אֱלֹהִים זוּלָתֶךָ, serta dasar pengakuan “sesuai dengan segala yang telah kami dengar dengan telinga kami.” “Sungguh besar” adalah pengungkapan Indonesia yang wajar bagi pengakuan doxologis גָּדַלְתָּ dan tidak secara aman mengubah makna.
