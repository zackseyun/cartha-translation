  text: וַ/יָּבֹ֖אוּ עַד גֹּ֣רֶן נָכ֑וֹן וַ/יִּשְׁלַ֨ח עֻזָּ֜א אֶל אֲר֤וֹן הָֽ/אֱלֹהִים֙ וַ/יֹּ֣אחֶז בּ֔/וֹ כִּ֥י שָׁמְט֖וּ הַ/בָּקָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/006.yaml
  text: When they came to Nacon’s threshing floor[a], Uzza reached out to the ark of God and took hold of it[b], because the oxen stumbled.
translation:
  language: id
  text: Ketika mereka sampai di tempat pengirikan Nakon[a], Uza mengulurkan tangannya ke arah tabut Allah dan memegangnya, sebab lembu-lembu itu tergelincir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau mungkin: “tempat pengirikan Nakhon”; atau, meskipun kurang mungkin: “tempat pengirikan yang kokoh/tetap.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “terpeleset”; mungkin juga: “membuatnya hampir terbalik” atau “membiarkannya terlepas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: tempat pengirikan
  rationale: Istilah ini menunjuk pada tempat terbuka untuk mengirik biji-bijian; 'tempat pengirikan' merupakan padanan Indonesia yang alami dan jelas.
- source_word: נָכוֹן
  choice: Nakon
  rationale: Bentuk ini paling wajar dipahami sebagai nama diri yang menerangkan tempat pengirikan, meskipun kemungkinan makna adjektival dipertahankan dalam catatan kaki.
- source_word: וַיִּשְׁלַח
  choice: mengulurkan tangannya
  rationale: Dalam konteks gerakan menuju suatu benda, verba ini berarti mengulurkan atau menjangkau; penyebutan 'tangannya' mengungkapkan anggota tubuh yang tersirat secara alami dalam bahasa Indonesia.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Frasa lengkap dipertahankan agar identifikasi sakral tabut tetap eksplisit sebagaimana dalam teks Ibrani.
- source_word: וַיֹּאחֶז בּוֹ
  choice: memegangnya
  rationale: Padanan ini menyampaikan tindakan mencengkeram atau menahan tabut tanpa menambahkan kesan kekerasan.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini menyatakan alasan tindakan Uza; 'sebab' alami dalam narasi Indonesia dan mempertahankan hubungan kausal.
- source_word: שָׁמְטוּ
  choice: tergelincir
  rationale: Verba ini dapat berarti tergelincir, terlepas, atau membuat sesuatu hampir jatuh. Dengan lembu-lembu sebagai subjek, 'tergelincir' mempertahankan ketidakpastian tentang mekanisme persisnya tanpa menjelaskan secara berlebihan.
- source_word: הַבָּקָר
  choice: lembu-lembu
  rationale: Dalam konteks pengangkutan dengan kereta, kata ini menunjuk pada hewan penarik; 'lembu-lembu' lebih tepat daripada istilah umum 'ternak'.
theological_decisions:
- issue: Penyebab tindakan Uza
  choice: Uza bertindak sebab lembu-lembu itu tergelincir.
  alternative: Lembu-lembu itu membuat tabut hampir terbalik atau membiarkannya terlepas.
  rationale: Teks Ibrani hanya menyebut klausa sebab dengan lembu-lembu sebagai subjek dan verba yang bermakna tergelincir atau melepaskan. Terjemahan tidak memastikan bahwa tabut benar-benar miring atau hampir jatuh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Ejaan nama 'Uza' dan 'Nakon' disesuaikan dengan pola pelafalan Indonesia; ambiguitas verba terakhir dipertahankan melalui catatan kaki.
