  text: וְ/הָיָה֙ אֲר֣וֹן יְהוָ֔ה בָּ֖א עִ֣יר דָּוִ֑ד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִד֙ מְפַזֵּ֤ז וּ/מְכַרְכֵּר֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/016.yaml
  text: As the ark of Yahweh was coming into the city of David[a], Michal daughter of Saul looked out through the window and saw King David leaping and whirling before Yahweh, and she despised him in her heart.
translation:
  language: id
  text: Ketika tabut Yahweh sedang memasuki Kota Daud, Mikhal, anak perempuan Saul, memandang ke luar melalui jendela dan melihat Raja Daud melompat-lompat dan berputar-putar[a] di hadapan Yahweh, lalu ia memandang rendah Daud dalam hatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kedua kata kerja Ibrani menggambarkan gerakan perayaan yang penuh semangat: melompat-lompat dan berputar-putar di hadapan Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה ... בָּא
  choice: Ketika ... memasuki
  rationale: Konstruksi ini membentuk latar waktu bagi tindakan Mikhal. “Ketika” menyampaikan hubungan temporal secara alami, sedangkan “memasuki” mempertahankan gerak tabut menuju dan masuk ke kota.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi diterjemahkan langsung; nama ilahi dipertahankan sebagai nama diri.
- source_word: עִיר דָּוִד
  choice: Kota Daud
  rationale: Nama tempat yang sudah menjadi sebutan khusus diterjemahkan secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: מִיכַל בַּת שָׁאוּל
  choice: Mikhal, anak perempuan Saul
  rationale: Identitas relasional ini dipertahankan karena penting dalam narasi; bentuk aposisi alami dalam bahasa Indonesia.
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: memandang dari balik jendela
  rationale: Ungkapan ini menggambarkan Mikhal melihat keluar melalui jendela tanpa menambahkan arah vertikal yang tidak dinyatakan secara pasti.
- source_word: הַמֶּלֶךְ דָּוִד
  choice: Raja Daud
  rationale: Susunan gelar dan nama yang lazim dalam bahasa Indonesia.
- source_word: מְפַזֵּז
  choice: melompat-lompat
  rationale: Kata kerja langka ini menunjuk pada gerakan melompat yang penuh semangat; bentuk ulang menyampaikan gerakan yang berlangsung dan berulang.
- source_word: מְכַרְכֵּר
  choice: berputar-putar
  rationale: Pilihan ini mempertahankan gambaran gerak berputar dan tidak meleburkan kedua kata kerja menjadi istilah umum “menari”.
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: lalu dalam hatinya ia memandang rendah Daud
  rationale: Terjemahan ini mempertahankan penilaian batin yang menghina atau meremehkan, sekaligus menjadikan rujukan pronomina jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Sikap batin Mikhal terhadap Daud
  choice: memandang rendah Daud dalam hatinya
  alternative: membenci Daud dalam hatinya
  rationale: Kata בּזה menyatakan penghinaan atau peremehan. “Memandang rendah” mempertahankan nuansa penilaian menghina tanpa mempersempitnya menjadi perasaan benci semata.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami tanpa mengubah urutan adegan. Nama “Mikhal” mengikuti bentuk Ibrani, dan nama ilahi ditransliterasikan sebagai “Yahweh”.
