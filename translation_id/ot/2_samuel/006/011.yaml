  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן יְהוָ֜ה בֵּ֣ית עֹבֵ֥ד אֱדֹ֛ם הַ/גִּתִּ֖י שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת עֹבֵ֥ד אֱדֹ֖ם וְ/אֶת כָּל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/011.yaml
  text: And the ark of Yahweh remained in the house of Obed-edom the Gittite for three months[b][a], and Yahweh blessed Obed-edom and all his household.
translation:
  language: id
  text: Tabut Yahweh tetap berada di rumah Obed-Edom, orang Gat,[a] selama tiga bulan. Yahweh memberkati Obed-Edom dan seluruh rumah tangganya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang Giti,” yaitu orang yang berasal dari atau terkait dengan Gat.'
    reason: cultural_note
  - marker: b
    text: Atau “seluruh rumahnya.” Kata Ibrani untuk “rumah” dapat merujuk secara luas pada keluarga atau seluruh lingkungan domestiknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tetap berada
  rationale: Kata kerja יָשַׁב dapat berarti duduk, tinggal, atau tetap berada. Karena subjeknya tabut dan disertai keterangan jangka waktu, “tetap berada” menyampaikan keberadaan yang berlanjut secara alami tanpa memberi kesan bahwa tabut bertempat tinggal seperti manusia.
- source_word: אֲרוֹן יְהוָה
  choice: Tabut Yahweh
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung. “Tabut” merupakan istilah baku untuk אֲרוֹן dalam konteks ini, sedangkan nama ilahi dipertahankan sebagai “Yahweh”.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: di rumah Obed-Edom
  rationale: Di sini בֵּית menunjuk pada tempat fisik tempat tabut berada. Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַגִּתִּי
  choice: orang Gat
  rationale: Adjektiva nisbah ini menyatakan hubungan Obed-Edom dengan Gat. “Orang Gat” lebih mudah dipahami pembaca Indonesia, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: selama tiga bulan
  rationale: “Selama” merupakan cara alami dalam bahasa Indonesia untuk memperkenalkan keterangan durasi.
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: בָּרַךְ adalah kata kerja baku yang berarti “memberkati”; konteks tidak menuntut parafrasa yang lebih interpretatif.
- source_word: אֶת עֹבֵד אֱדֹם וְאֶת כָּל בֵּיתוֹ
  choice: Obed-Edom dan seluruh rumah tangganya
  rationale: Dalam pemakaian ini, בֵּיתוֹ dapat mencakup keluarga beserta lingkungan domestiknya. “Seluruh rumah tangganya” alami dalam bahasa Indonesia dan mempertahankan cakupan yang luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi ilahi. Bentuk “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Cakupan berkat atas כָּל בֵּיתוֹ
  choice: seluruh rumah tangganya
  alternative: seluruh rumahnya
  rationale: Ungkapan Ibrani dapat menunjuk secara luas pada keluarga dan lingkungan domestik, bukan hanya bangunan. Terjemahan utama mempertahankan cakupan sosial ini tanpa menentukan secara lebih sempit siapa atau apa saja yang termasuk.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat dipakai agar hubungan durasi dan tindakan berkat terbaca jelas. Istilah “tetap berada” menghindari personifikasi yang berlebihan, sedangkan “rumah tangga” menyampaikan makna sosial בַּיִת dalam klausa terakhir.
