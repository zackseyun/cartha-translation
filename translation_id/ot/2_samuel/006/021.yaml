  text: וַ/יֹּ֣אמֶר דָּוִד֮ אֶל מִיכַל֒ לִ/פְנֵ֣י יְהוָ֗ה אֲשֶׁ֨ר בָּֽחַר בִּ֤/י מֵֽ/אָבִי/ךְ֙ וּ/מִ/כָּל בֵּית֔/וֹ לְ/צַוֺּ֨ת אֹתִ֥/י נָגִ֛יד עַל עַ֥ם יְהוָ֖ה עַל יִשְׂרָאֵ֑ל וְ/שִׂחַקְתִּ֖י לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/021.yaml
  text: David said to Michal[a], “It was before Yahweh, who chose me above your father and above all his house, to appoint me ruler over the people of Yahweh, over Israel—and I celebrated before Yahweh.”
translation:
  language: id
  text: Daud berkata kepada Mikhal, “Di hadapan Yahweh, yang telah memilih aku dan bukan ayahmu ataupun seluruh keluarganya, serta mengangkat aku sebagai pemimpin atas umat Yahweh, atas Israel, aku bersukaria di hadapan Yahweh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku menari di hadapan Yahweh.” Kata kerja Ibrani di sini lebih luas daripada istilah yang khusus berarti menari dan dapat menunjuk pada tindakan riang atau perayaan.
    reason: Menjaga alternatif leksikal yang dikenal dari konteks dan tradisi terjemahan tanpa mempersempit arti kata Ibrani dalam teks utama.
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan tindakan dalam kehadiran Yahweh. Bentuk yang sama dipertahankan pada kedua kemunculannya untuk menjaga penekanan ayat.
- source_word: אֲשֶׁר בָּחַר בִּי מֵאָבִיךְ וּמִכָּל בֵּיתוֹ
  choice: yang telah memilih aku dan bukan ayahmu ataupun seluruh keluarganya
  rationale: Sesudah verba 'memilih', מן menyatakan pihak yang tidak dipilih dalam perbandingan. Rumusan 'dan bukan ... ataupun ...' lebih alami dalam bahasa Indonesia daripada 'di atas', sekaligus mempertahankan kontras antara Daud dan wangsa Saul.
- source_word: לְצַוֹּת אֹתִי
  choice: serta mengangkat aku
  rationale: Dalam konstruksi dengan jabatan berikutnya, verba ini menyampaikan penugasan atau pengangkatan kepada suatu kedudukan, bukan sekadar pemberian perintah.
- source_word: נָגִיד
  choice: pemimpin
  rationale: Kata ini menunjuk orang yang ditempatkan dalam kewenangan. 'Pemimpin' jelas dan wajar dalam bahasa Indonesia tanpa menyamakan istilah ini begitu saja dengan kata 'raja'.
- source_word: עַל עַם יְהוָה עַל יִשְׂרָאֵל
  choice: atas umat Yahweh, atas Israel
  rationale: Pengulangan עַל dipertahankan, dan 'Israel' dibiarkan sebagai aposisi yang menjelaskan umat Yahweh.
- source_word: וְשִׂחַקְתִּי
  choice: aku merayakannya
  rationale: שׂחק di sini menggambarkan tindakan riang atau perayaan dan lebih luas daripada verba yang secara lebih khusus menggambarkan tarian dalam konteks sebelumnya. Akhiran '-nya' secara alami menunjuk tindakan di hadapan Yahweh yang sedang dibicarakan, tanpa mempersempitnya menjadi tarian saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi dalam teks Ibrani dan konsisten pada ketiga kemunculannya dalam ayat.
- issue: Apakah שׂחק harus diterjemahkan secara khusus sebagai menari
  choice: aku merayakannya
  alternative: aku menari; aku bersukaria
  rationale: Verba tersebut dapat menyatakan tindakan bermain, bersukaria, atau merayakan. Karena ayat-ayat sebelumnya memakai verba lain untuk gerak tari, terjemahan utama mempertahankan cakupan yang lebih luas; kemungkinan 'menari' dicatat dalam catatan kaki.
- issue: Hubungan pemilihan Daud dengan ayah Mikhal dan seluruh keluarganya
  choice: memilih aku dan bukan ayahmu ataupun seluruh keluarganya
  alternative: memilih aku daripada ayahmu dan seluruh keluarganya; memilih aku melebihi ayahmu dan seluruh keluarganya
  rationale: Konteksnya mengontraskan pilihan Yahweh atas Daud dengan Saul dan wangsanya. Rumusan ini menyatakan penggantian pilihan secara jelas tanpa menyiratkan sekadar peringkat nilai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Mikhal', 'Yahweh', dan pengulangan 'atas' mempertahankan ciri teks sumber. Tanda pisah menandai klausa penjelas yang panjang agar ucapan Daud tetap mudah diikuti.
