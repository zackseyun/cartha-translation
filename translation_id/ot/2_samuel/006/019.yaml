base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/019.yaml
  text: He distributed to all the people[a], to the whole multitude of Israel, from man to woman, to each person one loaf of bread, one portion of meat, and one raisin cake. Then all the people went away[b], each to his house.
translation:
  language: id
  text: Ia membagikan kepada seluruh rakyat, kepada segenap orang banyak Israel, dari laki-laki sampai perempuan,[a] kepada setiap orang sebuah roti, satu porsi daging,[b] dan satu kue kismis. Kemudian seluruh rakyat pergi, masing-masing ke rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari laki-laki sampai perempuan,” suatu ungkapan yang mencakup seluruh orang yang berkumpul, baik laki-laki maupun perempuan.
    reason: cultural_note
  - marker: b
    text: Atau “satu takaran” atau “satu porsi.” Kata Ibrani אֶשְׁפָּר jarang dipakai dan maknanya tidak pasti. Banyak penafsir memahaminya sebagai satu porsi daging, terutama berdasarkan kisah sejajar dalam 1 Tawarikh 16:3.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַלֵּק
  choice: Ia membagikan
  rationale: Bentuk piel dari חלק dalam konteks ini menyatakan tindakan membagikan jatah kepada orang banyak; “membagikan” alami dan konkret dalam bahasa Indonesia.
- source_word: לְכָל הָעָם / לְכָל הֲמוֹן יִשְׂרָאֵל
  choice: kepada seluruh rakyat, kepada seluruh orang banyak Israel
  rationale: Kedua ungkapan dipertahankan untuk mencerminkan penegasan dan kepenuhan teks Ibrani, tanpa meleburkannya menjadi satu frasa.
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: baik laki-laki maupun perempuan
  rationale: Ungkapan harfiah “dari laki-laki sampai perempuan” menyatakan cakupan seluruh orang yang berkumpul. Bentuk “baik ... maupun ...” menyampaikan fungsi idiom itu secara wajar.
- source_word: לְאִישׁ
  choice: kepada setiap orang
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, konteks langsung menyebut laki-laki dan perempuan; “setiap orang” menyampaikan daya distributifnya tanpa membatasi pada laki-laki.
- source_word: חַלַּת לֶחֶם אַחַת
  choice: satu roti bundar
  rationale: חַלָּה menunjuk pada roti atau kue roti berbentuk tertentu. “Roti bundar” konkret dan membedakannya dari kue kismis yang disebut kemudian.
- source_word: אֶשְׁפָּר אֶחָד
  choice: satu porsi daging
  rationale: אֶשְׁפָּר adalah kata langka dan maknanya diperdebatkan. Dalam konteks hidangan dan berdasarkan paralel 1 Tawarikh 16:3, porsi makanan—kemungkinan daging—merupakan pemahaman yang paling masuk akal, tetapi ketidakpastiannya dicatat.
- source_word: אֲשִׁישָׁה אֶחָת
  choice: satu kue kismis
  rationale: אֲשִׁישָׁה lazim dipahami sebagai kue dari buah yang dipadatkan, khususnya kismis; “kue kismis” merupakan padanan Indonesia yang jelas.
- source_word: וַיֵּלֶךְ כָּל הָעָם אִישׁ לְבֵיתוֹ
  choice: Sesudah itu, seluruh rakyat pulang, masing-masing ke rumahnya
  rationale: Klausa ini menggambarkan bubarnya rakyat setelah pembagian. “Pulang” secara alami mencakup gerak menuju rumah, sementara “masing-masing” mempertahankan bentuk distributif tunggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan “kepada seluruh” dipertahankan demi penegasan sumber. Pronomina “Ia” merujuk kepada Daud dari konteks ayat sebelumnya. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
