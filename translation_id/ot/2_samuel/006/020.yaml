base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/020.yaml
  text: Then David returned to bless his household[a]. But Michal daughter of Saul came out to meet David and said, “How honored the king of Israel was today, uncovering himself today in the sight of the servant girls of his servants[c][b], as one of the vulgar fellows shamelessly uncovers himself!”
translation:
  language: id
  text: Kemudian Daud pulang untuk memberkati seisi rumahnya. Namun, Mikhal, anak perempuan Saul, keluar menemui Daud dan berkata, “Betapa terhormatnya raja Israel hari ini, ketika ia menyingkapkan dirinya hari ini di depan mata budak-budak perempuan milik para hambanya[a], sebagaimana salah seorang dari orang-orang tak berguna menyingkapkan dirinya tanpa malu[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani dapat juga diterjemahkan “para pelayan perempuan dari para hambanya.” Istilah yang dipakai menunjuk perempuan berstatus rendah dan bergantung, termasuk budak perempuan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sebagaimana salah seorang dari orang-orang tak berguna benar-benar menyingkapkan dirinya.” Pengulangan bentuk kata Ibrani menegaskan tindakan itu; “tanpa malu” menyampaikan nada penghinaan Mikhal.'
    reason: source_structure
lexical_decisions:
- source_word: לְבָרֵךְ אֶת־בֵּיתוֹ
  choice: untuk memberkati seisi rumahnya
  rationale: בֵּיתוֹ secara harfiah berarti ‘rumahnya’, tetapi dalam konteks tindakan memberkati menunjuk kepada orang-orang dalam rumah tangga Daud. ‘Seisi rumahnya’ alami dalam bahasa Indonesia dan tetap mempertahankan cakupan kolektif itu.
- source_word: מִיכַל בַּת־שָׁאוּל
  choice: Mikhal, anak perempuan Saul
  rationale: Bentuk ini mempertahankan penekanan naratif pada identitas Mikhal sebagai anak Saul.
- source_word: מַה־נִּכְבַּד הַיּוֹם
  choice: Betapa terhormatnya ... hari ini!
  rationale: כבד memuat gagasan kehormatan atau kemuliaan. Terjemahan ini mempertahankan makna leksikal sekaligus membiarkan konteks dan tanda seru menyampaikan sindiran Mikhal, tanpa menggantinya dengan parafrasa yang secara eksplisit menyebut ejekan.
- source_word: נִגְלָה
  choice: menyingkapkan dirinya
  rationale: Nifal dari גלה di sini berarti membuat diri tersingkap atau terlihat. ‘Menyingkapkan dirinya’ mempertahankan ketaksaan mengenai seberapa jauh tubuh Daud terlihat dan tidak menyatakan bahwa ia telanjang sepenuhnya.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Padanan ini mempertahankan idiom Ibrani dan menekankan bahwa tindakan itu terjadi secara terbuka dalam pandangan orang lain.
- source_word: אַמְהוֹת עֲבָדָיו
  choice: budak-budak perempuan milik para hambanya
  rationale: אַמְהוֹת menunjuk perempuan berstatus budak atau pelayan terikat, sedangkan עֲבָדָיו berarti para hamba atau budak Daud. Susunan ini mempertahankan hubungan kepemilikan/ketergantungan dalam frasa Ibrani serta penghinaan berdasarkan status sosial yang tersirat dalam ucapan Mikhal.
- source_word: כְּהִגָּלוֹת נִגְלוֹת
  choice: menyingkapkan dirinya tanpa malu
  rationale: Gabungan bentuk infinitif dan bentuk terkait menegaskan tindakan penyingkapan. Bahasa Indonesia tidak memiliki padanan struktural langsung; ‘tanpa malu’ menyampaikan daya penegas dan penilaian menghina dalam konteks, sambil dijelaskan sebagai unsur kontekstual dalam catatan.
- source_word: אַחַד הָרֵקִים
  choice: salah seorang lelaki tak bermartabat
  rationale: רֵקִים secara harfiah menggambarkan orang-orang ‘kosong’ atau ‘tak berguna’, yakni orang yang dipandang hina dan tidak terhormat. ‘Lelaki tak bermartabat’ menyampaikan kontras sosial dan retoris dengan raja secara alami serta bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Tingkat ketelanjangan yang dituduhkan kepada Daud
  choice: menyingkapkan dirinya
  alternative: menelanjangi dirinya / membuka auratnya
  rationale: Kata Ibrani גלה menyatakan penyingkapan, tetapi ayat ini tidak dengan sendirinya menentukan bahwa Daud telanjang sepenuhnya atau bahwa alat kelaminnya terlihat. Pilihan utama mempertahankan ketaksaan tersebut.
- issue: Status sosial אַמְהוֹת
  choice: budak-budak perempuan
  alternative: para pelayan perempuan / dayang-dayang
  rationale: Istilah Ibrani dapat merujuk kepada pelayan perempuan, tetapi juga menandai status ketergantungan atau perbudakan. Dalam ejekan Mikhal, rendahnya status sosial para perempuan itu penting, sehingga ‘budak-budak perempuan’ mempertahankan ketajaman konteks tanpa melunakkannya.
- issue: Sindiran Mikhal
  choice: mempertahankan kata pujian ‘terhormat’ sebagai sindiran kontekstual
  alternative: Betapa memalukannya raja Israel hari ini!
  rationale: Teks Ibrani memakai kata yang secara leksikal berarti dihormati atau mulia. Mengubahnya menjadi ‘memalukan’ akan menjelaskan sindiran tetapi menghilangkan ironi verbal asli.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ucapan Mikhal dibuat tajam tetapi tidak slang. Repetisi ‘hari ini’ dipertahankan karena muncul dua kali dalam bahasa Ibrani dan memperkuat sindirannya. Nama מִיכַל ditransliterasikan sebagai ‘Mikhal’ agar membedakan konsonan Ibrani kh (כ) dari bunyi k biasa.
