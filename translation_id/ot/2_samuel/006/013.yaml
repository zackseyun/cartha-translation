  yaml_path: translation/ot/2_samuel/006/013.yaml
  text: And when those carrying the ark of Yahweh had gone six steps[b][a], he sacrificed an ox and a fattened calf.
translation:
  language: id
  text: Ketika para pengusung tabut Yahweh telah melangkah enam langkah[a], ia[b] mempersembahkan sebagai kurban seekor lembu dan seekor hewan yang digemukkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “enam tapak.”
    reason: lexical_alternative
  - marker: b
    text: Subjeknya tidak disebutkan secara tersurat dalam bahasa Ibrani; dalam konteks, kemungkinan besar yang dimaksud adalah Daud.
    reason: ambiguity
  - marker: c
    text: Secara harfiah, “hewan yang digemukkan”; secara tradisional dipahami di sini sebagai anak lembu yang digemukkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: “Tabut” adalah istilah baku dan wajar untuk peti kudus itu, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” sesuai bentuk nama dalam teks Ibrani.
- source_word: כִּי
  choice: ketika
  rationale: Dalam konstruksi naratif וַיְהִי כִּי, kata ini memperkenalkan keadaan waktu; “ketika” paling alami dalam bahasa Indonesia.
- source_word: צָעֲדוּ נֹשְׂאֵי
  choice: para pengusung ... telah melangkah
  rationale: Partisipel נֹשְׂאֵי menunjuk kepada orang-orang yang membawa tabut, dan צָעֲדוּ menyatakan gerak dengan langkah. Bentuk “telah melangkah” menandai bahwa enam langkah itu mendahului tindakan kurban.
- source_word: שִׁשָּׁה צְעָדִים
  choice: enam langkah
  rationale: Terjemahan langsung yang jelas; “langkah” dapat menunjuk baik tindakan melangkah maupun satuan jarak berdasarkan langkah.
- source_word: וַיִּזְבַּח
  choice: ia mengurbankan
  rationale: Kata kerja tunggal ini berarti menyembelih atau mempersembahkan sebagai kurban. Pronomina “ia” mempertahankan subjek tersirat dalam bahasa Ibrani tanpa memasukkan nama Daud ke dalam teks utama.
- source_word: שׁוֹר
  choice: seekor lembu
  rationale: שׁוֹר adalah sebutan umum bagi ternak sapi dan dalam konteks ini wajar diterjemahkan “lembu” tanpa menentukan jenis kelaminnya secara lebih sempit.
- source_word: מְרִיא
  choice: seekor hewan tambun
  rationale: Kata ini menunjuk kepada hewan yang digemukkan atau tambun, tetapi tidak menyebut spesiesnya. Terjemahan umum mempertahankan keluasan makna teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu secara langsung dan sejalan dengan keputusan yang diberikan.
- issue: Identitas subjek וַיִּזְבַּח
  choice: ia, dengan catatan bahwa dalam konteks kemungkinan besar Daud
  alternative: Daud mengurbankan
  rationale: Bahasa Ibrani hanya menandai subjek orang ketiga tunggal dan tidak menyebut nama dalam ayat ini. Memakai “ia” mempertahankan bentuk tersebut, sementara catatan membantu pembaca mengikuti konteks tanpa menghapus unsur tersiratnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Pengusung” dipilih karena ringkas dan sesuai untuk pembawaan benda kudus; “mengurbankan” mempertahankan makna ritual tanpa ungkapan yang bertele-tele.
