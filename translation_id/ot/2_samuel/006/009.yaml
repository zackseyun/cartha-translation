base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/009.yaml
  text: And David feared Yahweh that day[a], and he said, “How can the ark of Yahweh come to me?”
translation:
  language: id
  text: Pada hari itu Daud takut kepada Yahweh, lalu ia berkata, “Bagaimana mungkin[a] tabut Yahweh datang kepadaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bagaimana tabut Yahweh akan datang kepadaku?” Susunan ini dapat menyatakan ketidakpastian praktis ataupun rasa takut atau rasa tidak layak setelah kematian Uza.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: takut kepada
  rationale: Bentuk qal dari ירא dalam konteks kematian Uza menyatakan reaksi takut yang kuat terhadap Yahweh. Pilihan ini mempertahankan daya emosional dan objek langsung dalam bahasa Ibrani, tanpa mempersempitnya menjadi sekadar rasa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh agar nama pribadi Allah dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: אֵיךְ יָבֹא
  choice: bagaimana mungkin ... datang
  rationale: Dalam konteks sesudah kematian Uza, pertanyaan ini dapat menyiratkan bahwa Daud meragukan kemungkinan atau kelayakan tabut itu datang kepadanya. Kata 'mungkin' menangkap tekanan tersebut, sementara catatan kaki mempertahankan bentuk harfiah yang berorientasi ke masa depan.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Menerjemahkan preposisi dan sufiks orang pertama secara langsung tanpa menambahkan gagasan 'ke rumahku' atau 'ke tempatku' yang tidak dinyatakan.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Frasa konstruksi diterjemahkan secara ringkas dan transparan, dengan mempertahankan nama ilahi.
theological_decisions:
- issue: Makna takut Daud terhadap Yahweh
  choice: takut kepada Yahweh
  alternative: gentar di hadapan Yahweh; menghormati Yahweh
  rationale: Konteks penghakiman atas Uza mendukung rasa takut nyata, tetapi terjemahan ini tidak meniadakan dimensi rasa hormat yang dapat terkandung dalam ירא.
- issue: Nuansa pertanyaan Daud
  choice: Bagaimana mungkin tabut Yahweh datang kepadaku?
  alternative: Bagaimana tabut Yahweh akan datang kepadaku?
  rationale: Pilihan utama menyampaikan kegentaran dan kemungkinan rasa tidak layak setelah kematian Uza. Catatan kaki menjaga bentuk yang lebih harfiah dan ambiguitas antara ketidakpastian praktis dengan ketakutan atau rasa tidak layak.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; bentuk 'Yahweh' mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Lalu katanya' mempertahankan alur naratif tanpa kekakuan berlebih. Istilah 'tabut' dipertahankan karena merupakan sebutan baku dan mudah dikenali untuk benda kudus ini.
