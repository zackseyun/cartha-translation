  text: וּ/נְקַלֹּ֤תִי עוֹד֙ מִ/זֹּ֔את וְ/הָיִ֥יתִי שָׁפָ֖ל בְּ/עֵינָ֑/י וְ/עִם הָֽ/אֲמָהוֹת֙ אֲשֶׁ֣ר אָמַ֔רְתְּ עִמָּ֖/ם אִכָּבֵֽדָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/022.yaml
  text: And I will make myself even more contemptible than this[a], and I will be lowly in my own eyes; but with the servant girls of whom you have spoken, with them I will be honored.
translation:
  language: id
  text: Aku akan menjadi lebih hina lagi daripada ini dan aku akan menjadi rendah dalam pandanganku sendiri. Namun, bersama para budak perempuan yang kaubicarakan itu, aku akan dihormati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְקַלֹּתִי
  choice: Aku akan menjadi lebih hina lagi
  rationale: Bentuk Nifal dari קלל menyatakan menjadi atau dipandang rendah/hina. Ungkapan ini mempertahankan nuansa kehormatan–kehinaan dan tidak memaksakan makna refleksif ‘menghinakan diri’.
- source_word: עוֹד מִזֹּאת
  choice: daripada ini
  rationale: Bersama ‘lebih ... lagi’, frasa ini menyampaikan kesinambungan sekaligus perbandingan dengan tindakan Daud yang dikecam Mikhal.
- source_word: וְהָיִיתִי שָׁפָל בְּעֵינָי
  choice: dan menjadi rendah dalam pandanganku sendiri
  rationale: Terjemahan ini mempertahankan metafora kerendahan serta idiom Ibrani ‘di mataku’, yang menunjuk pada penilaian diri.
- source_word: הָאֲמָהוֹת
  choice: budak-budak perempuan
  rationale: אָמָה menunjuk pada perempuan berstatus rendah dalam rumah tangga, sering kali seorang budak. Pilihan ini mempertahankan dimensi status sosial yang penting bagi kontras ayat tersebut.
- source_word: אֲשֶׁר אָמַרְתְּ
  choice: yang kaubicarakan itu
  rationale: Ungkapan alami dalam bahasa Indonesia yang merujuk kembali kepada perempuan-perempuan yang disebut Mikhal pada ayat sebelumnya.
- source_word: עִמָּם
  choice: di antara ... itu
  rationale: Secara harfiah berarti ‘bersama mereka’. Dalam konteks ini, ‘di antara’ mengungkapkan lingkungan sosial tempat Daud akan memperoleh kehormatan tanpa menjadikan para perempuan itu secara tegas sebagai pelaku tindakan.
- source_word: אִכָּבֵדָה
  choice: aku akan dihormati
  rationale: Bentuk Nifal dari כבד menyatakan menerima atau dipandang memiliki kehormatan, berlawanan langsung dengan ‘menjadi lebih hina’.
theological_decisions:
- issue: Istilah status sosial untuk אָמָהוֹת
  choice: budak-budak perempuan
  alternative: pelayan-pelayan perempuan; hamba-hamba perempuan
  rationale: Pilihan ini mempertahankan rendahnya status sosial para perempuan tersebut, yang merupakan bagian penting dari ketegangan antara kehinaan dan kehormatan dalam ucapan Daud.
- issue: Sifat tindakan dalam וּנְקַלֹּתִי
  choice: menjadi lebih hina
  alternative: merendahkan diriku lebih lagi
  rationale: Bentuk Ibraninya dapat dipahami sebagai keadaan atau penilaian yang diterima Daud. Terjemahan utama tidak mengunci teks pada tindakan refleksif yang disengaja, meskipun konteks mendukung unsur perendahan diri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Kau-’ dipakai sesuai gaya narasi langsung yang alami. Kontras antara hina/rendah dan dihormati dipertahankan, sementara hubungan עִמָּם disampaikan sebagai lingkup sosial ‘di antara’.
