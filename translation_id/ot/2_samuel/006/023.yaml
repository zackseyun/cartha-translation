  text: וּ/לְ/מִיכַל֙ בַּת שָׁא֔וּל לֹֽא הָ֥יָה לָ֖/הּ יָ֑לֶד עַ֖ד י֥וֹם מוֹתָֽ/הּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/023.yaml
  text: And Michal the daughter of Saul had no child until the day of her death[a].
translation:
  language: id
  text: Dan Mikhal, anak perempuan Saul, tidak mempunyai anak sampai hari kematiannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan”; kata Ibrani ini dapat berarti anak secara umum, bukan khusus anak laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מִיכַל
  choice: Dan Mikhal
  rationale: Gabungan kata penghubung dan preposisi memperkenalkan Mikhal sebagai pokok kalimat sambil mengaitkan ayat ini dengan narasi sebelumnya. “Dan Mikhal” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: בַּת שָׁאוּל
  choice: anak perempuan Saul
  rationale: Frasa konstruksi ini secara langsung menyatakan hubungan keturunan Mikhal dengan Saul. Bentuk ini jelas dan tidak seformal “putri Saul,” yang juga dapat berkonotasi gelar kerajaan.
- source_word: לֹא הָיָה לָהּ
  choice: tidak mempunyai
  rationale: Bahasa Ibrani secara harfiah memakai ungkapan kepemilikan “tidak ada padanya.” Dalam bahasa Indonesia, “tidak mempunyai” menyampaikan maknanya secara wajar.
- source_word: יָלֶד
  choice: anak
  rationale: Nomina tunggal ini dapat menunjuk kepada anak secara umum dan tidak harus berarti anak laki-laki. “Anak” mempertahankan cakupan tersebut secara alami.
- source_word: עַד יוֹם מוֹתָהּ
  choice: sampai hari kematiannya
  rationale: Terjemahan ini dekat dengan ungkapan temporal Ibrani dan menyatakan bahwa keadaan itu berlangsung sepanjang hidup Mikhal tanpa menambahkan kesimpulan di luar teks.
theological_decisions:
- issue: Makna keadaan tanpa anak “sampai hari kematiannya”
  choice: 'Mempertahankan ungkapan temporal secara langsung: “sampai hari kematiannya.”'
  alternative: Mengungkapkan secara interpretatif bahwa Mikhal tidak pernah mempunyai anak seumur hidupnya.
  rationale: Ungkapan Ibrani menegaskan keadaan Mikhal sepanjang hidupnya. Terjemahan langsung mempertahankan bentuk dan tekanannya tanpa menimbulkan gagasan bahwa sesuatu terjadi sesudah kematian atau menjadikannya dasar bagi kesimpulan teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama מִיכַל ditransliterasikan “Mikhal” agar mencerminkan konsonan akhir Ibrani. Penanda catatan kaki ditempatkan tepat setelah kalimat terkait.
