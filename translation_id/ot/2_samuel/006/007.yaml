  source_fidelity: 'Teks Indonesia secara setia mencerminkan unsur-unsur utama Ibrani: murka Yahweh menyala terhadap Uza, Allah memukulnya di sana, sebab yang dinyatakan dengan istilah Ibrani yang sukar, kematiannya di sana, dan lokasinya di samping tabut Allah. Pengulangan “di sana” serta peralihan dari “Yahweh” ke “Allah” dipertahankan. “Karena kesalahan itu” merupakan padanan yang cukup netral bagi עַל הַשַּׁל dan tidak memaksakan penafsiran tertentu.'
