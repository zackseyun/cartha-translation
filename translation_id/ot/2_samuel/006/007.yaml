source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/עֻזָּ֔ה וַ/יַּכֵּ֥/הוּ שָׁ֛ם הָ/אֱלֹהִ֖ים עַל הַ/שַּׁ֑ל וַ/יָּ֣מָת שָׁ֔ם עִ֖ם אֲר֥וֹן הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/007.yaml
  text: And the anger of Yahweh burned against Uzzah[a], and God struck him there for the error, and he died there beside the ark of God.
translation:
  language: id
  text: Murka Yahweh pun menyala terhadap Uza. Allah memukulnya di sana karena kesalahan itu[a], dan ia mati di sana di samping tabut Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena tindakan gegabah itu,” “karena tindakan tidak hormat itu,” atau mungkin “karena ia mengulurkan tangannya.” Frasa Ibraninya sulit dan telah dipahami dengan beberapa cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: Murka ... pun menyala
  rationale: Ungkapan Ibrani menggambarkan murka sebagai sesuatu yang menyala. Terjemahan ini mempertahankan citra tersebut dengan bahasa Indonesia yang wajar dan khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּעֻזָּה
  choice: terhadap Uza
  rationale: Dalam ungkapan tentang murka, preposisi ini menandai orang yang menjadi sasaran murka.
- source_word: וַיַּכֵּהוּ
  choice: Allah memukulnya
  rationale: Kata kerja נכה berarti memukul atau menghantam. Bentuk ini tidak mendahului keterangan berikutnya bahwa Uza mati.
- source_word: שָׁם
  choice: di sana
  rationale: Pengulangan keterangan tempat dipertahankan pada kedua kemunculannya untuk mencerminkan penekanan narasi.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Teks sumber beralih dari nama Yahweh kepada sebutan Elohim; variasi itu dipertahankan.
- source_word: עַל הַשַּׁל
  choice: karena kesalahan itu
  rationale: Kata שַׁל sangat jarang dan maknanya tidak pasti. Pilihan ini menyampaikan adanya pelanggaran tanpa menentukan secara berlebihan sifat atau mekanismenya.
- source_word: וַיָּמָת
  choice: dan ia mati
  rationale: Rangkaian narasi diterjemahkan secara langsung tanpa menambahkan hubungan akibat yang tidak dinyatakan secara eksplisit.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: di samping tabut Allah
  rationale: Dalam konteks tempat, עִם secara alami berarti berada di sisi atau dekat tabut, bukan menyertainya dalam perjalanan.
theological_decisions:
- issue: Penyebab kematian Uza dalam frasa sulit עַל הַשַּׁל
  choice: karena kesalahan itu
  alternative: karena tindakan gegabah itu; karena tindakan tidak hormat itu; mungkin karena ia mengulurkan tangannya
  rationale: Istilah Ibraninya langka dan tidak pasti. Teks utama mempertahankan pernyataan bahwa penghukuman berkaitan dengan suatu kesalahan, sedangkan catatan kaki membuka kemungkinan penafsiran lain tanpa menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Nama Uzzah disesuaikan menjadi bentuk Indonesia “Uza”; nama ilahi dipertahankan sebagai “Yahweh.”
