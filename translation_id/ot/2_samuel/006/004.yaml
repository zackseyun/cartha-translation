  text: וַ/יִּשָּׂאֻ֗/הוּ מִ/בֵּ֤ית אֲבִֽינָדָב֙ אֲשֶׁ֣ר בַּ/גִּבְעָ֔ה עִ֖ם אֲר֣וֹן הָ/אֱלֹהִ֑ים וְ/אַחְי֕וֹ הֹלֵ֖ךְ לִ/פְנֵ֥י הָ/אָרֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/004.yaml
  text: They carried it from the house of Abinadab[a], which was on the hill, with the ark of God, and Ahio was walking before the ark.
translation:
  language: id
  text: Mereka mengangkutnya dari rumah Abinadab yang ada di bukit[a], bersama dengan tabut Allah, dan Ahio berjalan di depan tabut itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di Gibeah.” Kata Ibrani גִּבְעָה dapat dibaca sebagai kata benda umum yang berarti “bukit” atau sebagai nama tempat “Gibeah.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: Mereka mengangkutnya
  rationale: Bentuk jamak dengan akhiran objek tunggal maskulin berarti mereka membawa atau memindahkannya. 'Mengangkutnya' alami dalam konteks pemindahan tabut tanpa menyatakan secara berlebihan bagaimana benda itu dibawa.
- source_word: מִבֵּית אֲבִינָדָב
  choice: dari rumah Abinadab
  rationale: Preposisi מִן menyatakan sumber atau tempat asal pemindahan, sedangkan בֵּית אֲבִינָדָב adalah konstruksi kepunyaan yang lugas.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: yang ada di bukit
  rationale: גִּבְעָה dapat berarti bukit atau nama tempat Gibeah. Dengan artikelnya dan karena klausa ini menerangkan rumah Abinadab, arti nomina umum 'bukit' dipilih dalam teks utama; kemungkinan nama tempat dipertahankan dalam catatan kaki.
- source_word: עִם אֲרוֹן הָאֱלֹהִים
  choice: bersama dengan tabut Allah
  rationale: עִם menandai penyertaan. Ungkapan ini mempertahankan susunan sumber secara cukup dekat dan tetap wajar dalam bahasa Indonesia.
- source_word: וְאַחְיוֹ
  choice: dan Ahio
  rationale: Nama diri ditransliterasikan sebagai Ahio, sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הֹלֵךְ
  choice: berjalan
  rationale: Partisipel ini menggambarkan tindakan yang sedang berlangsung bersamaan dengan pengangkutan tabut. Dalam rangkaian kalimat bahasa Indonesia, 'berjalan' menyampaikan aspek duratif itu secara alami.
- source_word: לִפְנֵי הָאָרוֹן
  choice: di depan tabut itu
  rationale: לִפְנֵי adalah ungkapan ruang yang berarti di hadapan atau di depan. 'Di depan' jelas dan alami untuk menggambarkan posisi dalam iring-iringan; 'itu' menandai tabut yang sudah disebut.
