  source_fidelity: Draf mempertahankan urutan dua verba, nama tempat yang tidak pasti, tujuan membawa tabut, dan gelar ilahi dengan cukup setia. Namun, הִשָּׁם dalam לְהַעֲלוֹת מִשָּׁם secara aman dapat dicerminkan sebagai “membawa naik dari sana”; penghilangan nuansa “naik” tidak diperlukan. Rumusan penamaan yang padat tetap tidak boleh diuraikan secara dogmatis.
  naturalness: “Seluruh rakyat yang menyertainya” kurang tepat untuk הָעָם dalam konteks rombongan dan terdengar seperti seluruh populasi kerajaan; “semua orang yang menyertainya” lebih alami dan proporsional. Tanda pisah membantu pembaca Indonesia memahami aposisi “Nama itu, nama Yahweh ...” tanpa menghilangkan kekompakan rumusan Ibrani.
  terminology: “Tabut Allah,” “Yahweh,” “Bala Tentara,” dan “kerub-kerub” dapat dipertahankan. Koma pada “Yahweh, Penguasa Bala Tentara” menandai gelar sebagai aposisi dan membuat hubungan sintaktisnya lebih jelas dalam bahasa Indonesia.
