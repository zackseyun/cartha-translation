  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֣קָם וַ/יֵּ֣לֶךְ דָּוִ֗ד וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ מִֽ/בַּעֲלֵ֖י יְהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵ֚ת אֲר֣וֹן הָ/אֱלֹהִ֔ים אֲשֶׁר נִקְרָ֣א שֵׁ֗ם שֵׁ֣ם יְהוָ֧ה צְבָא֛וֹת יֹשֵׁ֥ב הַ/כְּרֻבִ֖ים עָלָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/002.yaml
  text: David arose and went[a], with all the people who were with him, from Baale-judah to bring up from there the ark of God, which is called by the Name, the name of Yahweh of Armies[d][c][b], who is enthroned above the cherubim.
translation:
  language: id
  text: Lalu Daud bangkit dan pergi bersama semua orang yang menyertainya dari Baale-Yehuda[a] untuk membawa naik dari sana tabut Allah, yang disebut dengan Nama itu—nama Yahweh, Penguasa Bala Tentara[b]—yang bertakhta di atas kerub-kerub[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Baala di Yehuda.” Bentuk Ibrani di sini tidak biasa dan mungkin menunjuk pada suatu tempat yang berkaitan dengan Kiryat-Yearim.'
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “yang atasnya nama Yahweh, Penguasa Bala Tentara, diserukan.” Rumusan Ibraninya padat dan hubungan antarkatanya dapat dipahami lebih dari satu cara.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang berdiam di antara kerub-kerub.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: bangkit dan pergi
  rationale: Mempertahankan kedua verba berurutan dalam narasi Ibrani; 'bangkit' menandai dimulainya tindakan, sedangkan 'pergi' menyatakan gerakannya.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: bersama seluruh rakyat yang menyertainya
  rationale: Menyatakan bahwa seluruh kelompok itu ikut bersama Daud, sambil mempertahankan cakupan כָל.
- source_word: מִבַּעֲלֵי יְהוּדָה
  choice: dari Baale-Yehuda
  rationale: Konteks paling mendukung pembacaan sebagai nama tempat, meskipun bentuk Ibraninya tidak biasa; ketidakpastian dipertahankan dalam catatan kaki.
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: untuk membawa dari sana
  rationale: Hifil עלה berarti membawa naik; dalam bahasa Indonesia, 'membawa dari sana' lebih alami di sini tanpa kehilangan tujuan pemindahan tabut.
- source_word: אֵת אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Padanan baku, jelas, dan sesuai konteks naratif bagi tabut perjanjian.
- source_word: אֲשֶׁר נִקְרָא שֵׁם שֵׁם
  choice: yang disebut dengan Nama itu, yaitu nama
  rationale: Mempertahankan pengulangan שֵׁם dan sifat rumusan penamaan yang padat, tanpa mengubahnya menjadi sekadar pernyataan kepemilikan.
- source_word: יְהוָה צְבָאוֹת
  choice: Yahweh Penguasa Bala Tentara
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh. Gelar צְבָאוֹת diterjemahkan secara bermakna dan idiomatis, mencakup bala tentara surgawi maupun militer tanpa memakai istilah tradisional yang kini kurang transparan.
- source_word: יֹשֵׁב הַכְּרֻבִים עָלָיו
  choice: yang bertakhta di atas kerub-kerub
  rationale: Dalam teologi tabut, יֹשֵׁב menunjuk pada kedudukan sebagai Raja. 'Di atas' sesuai dengan gambaran kerub pada tabut, sementara alternatif 'berdiam di antara' dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama diri tersebut dan membedakannya dari gelar.
- issue: Penerjemahan gelar צְבָאוֹת
  choice: Penguasa Bala Tentara
  alternative: semesta alam
  rationale: Pilihan ini mempertahankan unsur pasukan atau bala tentara dalam istilah Ibrani dan tetap alami dalam bahasa Indonesia; 'semesta alam' lazim tetapi memperluas makna ke seluruh kosmos.
- issue: Rumusan penamaan tabut yang padat
  choice: yang disebut dengan Nama itu, yaitu nama Yahweh
  alternative: yang atasnya nama Yahweh diserukan
  rationale: Teks utama menjaga kekhidmatan serta pengulangan 'nama' tanpa memastikan secara berlebihan hubungan sintaksis yang memang padat; pembacaan lebih harfiah disediakan dalam catatan.
- issue: Makna יֹשֵׁב dalam hubungan dengan kerub-kerub
  choice: yang bertakhta di atas kerub-kerub
  alternative: yang berdiam di antara kerub-kerub
  rationale: Konteks tabut dan kerajaan ilahi mendukung nuansa bertakhta, tetapi verba itu juga dapat berarti duduk atau berdiam sehingga alternatifnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur ganda 'bangkit dan pergi' serta pengulangan 'Nama ... nama' dipertahankan untuk mencerminkan gaya dan ketegangan sintaksis Ibrani, sedangkan susunan kalimat dibuat tetap mudah dipahami pembaca umum.
