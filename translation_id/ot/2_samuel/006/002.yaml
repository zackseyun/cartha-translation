    rationale: הָעָם dapat diterjemahkan “orang-orang”; “semua orang yang menyertainya” mempertahankan seluruh cakupan kelompok tanpa menyiratkan seluruh rakyat Israel.
  - severity: low
    issue: Aposisi dalam rumusan “Nama itu” perlu ditandai lebih jelas.
    rationale: Tanda pisah mempertahankan pengulangan nama dan ketidaklaziman rumusan sumber, tetapi mencegah pembacaan Indonesia yang tersendat.
