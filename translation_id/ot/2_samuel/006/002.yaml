  to: Lalu Daud bangkit dan pergi bersama semua orang yang menyertainya dari Baale-Yehuda[a] untuk membawa naik dari sana tabut Allah, yang disebut dengan Nama itu—nama Yahweh, Penguasa Bala Tentara[b]—yang bertakhta di atas kerub-kerub[c].
