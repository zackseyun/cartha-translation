base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/008.yaml
  text: And David was angry because Yahweh had broken out against Uzzah[a], and he called that place Perez-uzzah to this day.
translation:
  language: id
  text: Daud menjadi marah karena Yahweh telah menerjang Uza[a]. Ia menamai tempat itu Peres-Uza; nama itu tetap dipakai sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Peres-Uza kira-kira berarti “terjangan terhadap Uza.” Dalam bahasa Ibrani, nama ini menggemakan permainan kata antara verba yang diterjemahkan “menerjang” dan nomina serumpun yang berarti “terjangan” dalam ungkapan tentang tindakan Yahweh terhadap Uza.
    reason: Menjelaskan permainan kata antara verba פָּרַץ, nomina serumpun פֶּרֶץ, dan nama tempat פֶּרֶץ עֻזָּה yang tidak dapat dipertahankan sepenuhnya secara alami dalam teks utama.
lexical_decisions:
- source_word: וַיִּחַר לְדָוִד
  choice: Daud menjadi marah
  rationale: Ungkapan חרה ל menyatakan timbulnya kemarahan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kekuatan emosi teks tanpa menjelaskan sasaran kemarahan yang tidak dinyatakan secara eksplisit.
- source_word: עַל אֲשֶׁר פָּרַץ יְהוָה פֶּרֶץ בְּעֻזָּה
  choice: karena Yahweh telah menerjang Uza
  rationale: Konstruksi ini menyatakan alasan kemarahan Daud dan tindakan ilahi yang mendadak serta menghancurkan. “Menerjang” menyampaikan daya verba פרץ secara alami; pengulangan verba dan nomina serumpun dalam bahasa Ibrani dijelaskan dalam catatan kaki karena peniruannya secara harfiah akan terasa janggal dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: Maka ia menamai tempat itu
  rationale: Ini adalah rumusan pemberian nama. “Menamai” jelas dan alami dalam bahasa Indonesia modern.
- source_word: פֶּרֶץ עֻזָּה
  choice: Peres-Uza
  rationale: Nama tempat ditransliterasikan, sedangkan arti dan permainan katanya diterangkan dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: dan nama itu tetap dipakai sampai hari ini
  rationale: Ungkapan temporal Ibrani menerangkan bahwa nama tersebut masih berlaku sampai masa penulis. Penambahan eksplisit “nama itu tetap dipakai” menghindari kesan bahwa Daud terus-menerus melakukan tindakan menamai.
theological_decisions:
- issue: Tindakan Yahweh dalam penghukuman
  choice: Yahweh telah menerjang Uza
  alternative: Uza mengalami malapetaka dari Yahweh
  rationale: Teks Ibrani secara langsung menjadikan Yahweh pelaku tindakan terhadap Uza. Terjemahan tidak melunakkan tindakan itu menjadi akibat impersonal atau kecelakaan.
- issue: Sasaran kemarahan Daud
  choice: Daud menjadi marah karena Yahweh telah menerjang Uza
  alternative: Daud marah kepada Yahweh
  rationale: Bahasa Ibrani menyatakan penyebab kemarahan Daud, tetapi tidak secara eksplisit memakai penanda yang memastikan kepada siapa kemarahan itu ditujukan. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan kemarahan Daud, tindakan langsung Yahweh, nama tempat, atau rumusan “sampai hari ini.”
