  text: וַ/יֻּגַּ֗ד לַ/מֶּ֣לֶךְ דָּוִד֮ לֵ/אמֹר֒ בֵּרַ֣ךְ יְהוָ֗ה אֶת בֵּ֨ית עֹבֵ֤ד אֱדֹם֙ וְ/אֶת כָּל אֲשֶׁר ל֔/וֹ בַּ/עֲב֖וּר אֲר֣וֹן הָ/אֱלֹהִ֑ים וַ/יֵּ֣לֶךְ דָּוִ֗ד וַ/יַּעַל֩ אֶת אֲר֨וֹן הָ/אֱלֹהִ֜ים מִ/בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם עִ֥יר דָּוִ֖ד בְּ/שִׂמְחָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/012.yaml
  text: And it was reported to King David[a], saying, “Yahweh has blessed the house of Obed-edom and all that belongs to him because of the ark of God.” So David went and brought up the ark of God from the house of Obed-edom to the city of David with rejoicing.
translation:
  language: id
  text: Kemudian diberitahukan kepada Raja Daud, “Yahweh telah memberkati rumah Obed-Edom dan segala miliknya karena Tabut Allah.” Lalu Daud pergi dan membawa naik Tabut Allah dari rumah Obed-Edom ke Kota Daud dengan sukacita.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: dikabarkan
  rationale: Bentuk Hofal pasif tidak menyebutkan siapa pembawa berita; “dikabarkan” mempertahankan sifat impersonal itu secara alami dalam bahasa Indonesia.
- source_word: לַמֶּלֶךְ דָּוִד
  choice: kepada Raja Daud
  rationale: Menyampaikan gelar dan nama dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: בֵּרַךְ יְהוָה
  choice: Yahweh telah memberkati
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan hasilnya relevan bagi laporan tersebut; “telah memberkati” menyampaikan nuansa ini.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: keluarga Obed-Edom
  rationale: Pada klausa berkat, בֵּית menunjuk pada rumah tangga atau keluarga Obed-Edom, bukan terutama bangunannya; pada klausa asal pengangkutan, kata yang sama diterjemahkan “rumah” karena acuannya bersifat tempat.
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: dan segala miliknya
  rationale: Ungkapan ringkas dan alami yang mencakup segala sesuatu yang menjadi kepunyaan Obed-Edom.
- source_word: בַּעֲבוּר
  choice: karena
  rationale: 'Menyatakan hubungan sebab: berkat itu dikaitkan dengan kehadiran Tabut Allah.'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: Tabut Allah
  rationale: Istilah baku dan jelas untuk peti suci tersebut; kapitalisasi menandai benda khusus dalam narasi.
- source_word: וַיֵּלֶךְ דָּוִד וַיַּעַל
  choice: Maka Daud pergi dan mengangkut
  rationale: “Maka” menunjukkan kelanjutan yang bersifat tanggapan terhadap berita, sedangkan “mengangkut” menyampaikan tindakan membawa tabut naik menuju Kota Daud tanpa ungkapan Indonesia yang kaku.
- source_word: בְּשִׂמְחָה
  choice: dengan sukacita
  rationale: Padanan alami dan bermartabat untuk kegembiraan yang menyertai pengangkutan tabut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. “Yahweh” mempertahankan nama tersebut, sementara “TUHAN” merupakan penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan bermartabat. Struktur laporan langsung dipertahankan, sementara לֵאמֹר tidak diterjemahkan secara terpisah karena tanda kutip sudah menjalankan fungsi pengantar ujaran dalam bahasa Indonesia.
