  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghapus pengulangan dalam teks Ibrani. Istilah tradisional 'tabut' dipertahankan, sedangkan 'pedati' dipilih untuk menggambarkan kendaraan beroda yang ditarik hewan.
