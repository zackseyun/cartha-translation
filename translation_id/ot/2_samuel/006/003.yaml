  text: וַ/יַּרְכִּ֜בוּ אֶת אֲר֤וֹן הָֽ/אֱלֹהִים֙ אֶל עֲגָלָ֣ה חֲדָשָׁ֔ה וַ/יִּשָּׂאֻ֔/הוּ מִ/בֵּ֥ית אֲבִינָדָ֖ב אֲשֶׁ֣ר בַּ/גִּבְעָ֑ה וְ/עֻזָּ֣א וְ/אַחְי֗וֹ בְּנֵי֙ אֲבִ֣ינָדָ֔ב נֹהֲגִ֖ים אֶת הָ/עֲגָלָ֥ה חֲדָשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/003.yaml
  text: They set the ark of God on a new cart and brought it from the house of Abinadab[a], which was on the hill; and Uzzah and Ahio, the sons of Abinadab, were driving the new cart.
translation:
  language: id
  text: Mereka menempatkan tabut Allah di atas sebuah pedati baru, lalu membawanya dari rumah Abinadab[a] yang berada di atas bukit. Uza dan Ahyo, putra-putra Abinadab, mengemudikan pedati baru itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang berada di Gibea,” jika frasa Ibrani ini dipahami sebagai nama tempat, bukan sebagai keterangan topografis.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: menempatkan ... di atas
  rationale: Bentuk kausatif dari רכב menyatakan membuat sesuatu naik atau menaruhnya pada kendaraan; ungkapan ini alami untuk tabut yang diletakkan di atas pedati.
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: tabut Allah
  rationale: Dalam konteks ini אֲרוֹן adalah sebutan baku bagi tabut kudus; 'tabut Allah' mempertahankan makna rujukannya.
- source_word: אֶל עֲגָלָה חֲדָשָׁה
  choice: di atas sebuah pedati baru
  rationale: Walaupun אֶל pada dasarnya menunjukkan arah, konteks penempatan pada kendaraan paling wajar dinyatakan dengan 'di atas'; עֲגָלָה diterjemahkan 'pedati' sebagai kendaraan beroda yang ditarik hewan.
- source_word: וַיִּשָּׂאֻהוּ
  choice: lalu membawanya
  rationale: נשא dapat berarti mengangkat, mengangkut, atau membawa. 'Membawanya' mempertahankan cakupan makna tanpa menyiratkan bahwa tabut dipikul dengan tangan, sebab tabut berada di atas pedati.
- source_word: מִבֵּית אֲבִינָדָב
  choice: dari rumah Abinadab
  rationale: Padanan langsung dan alami bagi frasa konstruksi Ibrani.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: yang berada di atas bukit
  rationale: Dengan artikel pada גִּבְעָה, bacaan topografis 'di atas bukit' paling langsung; kemungkinan bahwa kata itu merupakan nama tempat tetap dicatat dalam catatan kaki.
- source_word: וְעֻזָּא וְאַחְיוֹ
  choice: Uza dan Ahyo
  rationale: Nama-nama pribadi ditransliterasikan ke dalam ejaan Indonesia modern berdasarkan bentuk Ibraninya.
- source_word: בְּנֵי אֲבִינָדָב
  choice: anak-anak Abinadab
  rationale: בְּנֵי paling wajar menunjuk kepada putra-putra Abinadab dalam narasi ini; bentuk jamak Indonesia 'anak-anak' alami dan tidak mengharuskan pengulangan jenis kelamin yang sudah tersirat oleh nama tokoh.
- source_word: נֹהֲגִים
  choice: mengemudikan
  rationale: Partisipel נהג berarti menuntun atau mengendalikan hewan maupun kendaraan; dengan pedati sebagai objek, 'mengemudikan' paling sesuai.
- source_word: הָעֲגָלָה חֲדָשָׁה
  choice: pedati baru itu
  rationale: Pengulangan frasa sumber dipertahankan demi penekanan naratif dan kesinambungan leksikal.
