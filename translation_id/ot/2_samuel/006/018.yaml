revisions:
- from: Setelah Daud selesai mempersembahkan kurban bakaran dan kurban persembahan damai, ia memberkati rakyat itu dalam nama Yahweh Semesta Alam.[a]
  to: Setelah Daud selesai mempersembahkan kurban bakaran dan kurban keselamatan, ia memberkati rakyat itu dalam nama Yahweh Bala Tentara.
  rationale: Revisi mengganti padanan interpretatif "Semesta Alam" dengan "Bala Tentara" agar gelar יהוה צבאות mencerminkan leksikon Ibrani secara langsung. Catatan kaki tidak diperlukan karena terjemahan utama sudah menyampaikan citra dasar sumber. Istilah untuk שְׁלָמִים diringkaskan menjadi "kurban keselamatan," padanan Indonesia yang lazim bagi jenis kurban tersebut.
