  text: וַ/יְכַ֣ל דָּוִ֔ד מֵ/הַעֲל֥וֹת הָ/עוֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֣רֶךְ אֶת הָ/עָ֔ם בְּ/שֵׁ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/018.yaml
  text: When David had finished offering the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh of hosts.
translation:
  language: id
  text: Setelah Daud selesai mempersembahkan kurban bakaran dan kurban keselamatan, ia memberkati rakyat itu dalam nama Yahweh Bala Tentara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַל
  choice: selesai
  rationale: Bentuk wayyiqtol dari כלה menyatakan rampungnya tindakan sebelumnya; konstruksi “setelah ... selesai” menghasilkan urutan naratif yang alami dalam bahasa Indonesia.
- source_word: מֵהַעֲלוֹת
  choice: mempersembahkan
  rationale: Infinitif Hifil עלה setelah כלה dalam konteks kurban berarti menyelesaikan tindakan mempersembahkan kurban.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar di atas mazbah; bentuk tunggal teks Ibrani dipertahankan.
- source_word: וְהַשְּׁלָמִים
  choice: dan kurban persembahan damai
  rationale: שְׁלָמִים menunjuk pada kurban yang berkaitan dengan damai, kesejahteraan, dan persekutuan. Pilihan ini mempertahankan unsur makna damai tanpa membatasi istilah itu hanya pada satu aspek.
- source_word: וַיְבָרֶךְ
  choice: ia memberkati
  rationale: ברך berarti memberkati; bentuk verbal sederhana sesuai dengan teks sumber.
- source_word: אֶת־הָעָם
  choice: rakyat itu
  rationale: עָם menunjuk kepada umat atau rakyat yang sedang berhimpun; “rakyat itu” alami dalam konteks Daud sebagai raja.
- source_word: בְּשֵׁם
  choice: dalam nama
  rationale: בְּשֵׁם menyatakan nama yang dipanggil atau otoritas yang mendasari berkat; “dalam nama” mempertahankan bentuk dan nuansa sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: צְבָאוֹת
  choice: Semesta Alam
  rationale: Dalam gelar ilahi יהוה צבאות, ungkapan Indonesia “Yahweh Semesta Alam” bersifat alami dan dikenal luas. Catatan kaki mempertahankan hubungan harfiahnya dengan bala tentara atau pasukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi, sehingga transliterasi “Yahweh” mempertahankan pembedaan antara nama tersebut dan gelar אֲדֹנָי.
- issue: Makna gelar יהוה צבאות
  choice: Yahweh Semesta Alam
  alternative: Yahweh Bala Tentara
  rationale: “Semesta Alam” merupakan ungkapan Indonesia yang wajar untuk gelar ini dan mengomunikasikan kekuasaan ilahi yang luas, sedangkan catatan kaki menjaga citra leksikal צבאות sebagai bala tentara atau pasukan tanpa menetapkan secara sempit apakah yang dimaksud pasukan surgawi atau duniawi.
- issue: Makna שְׁלָמִים
  choice: kurban persembahan damai
  alternative: kurban persekutuan
  rationale: Istilah Ibrani mencakup nuansa damai, kesejahteraan, dan persekutuan. “Kurban persembahan damai” menjaga hubungan leksikal dengan שלום, sementara alternatif “kurban persekutuan” menonjolkan fungsi jamuan komunalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur “Setelah ... selesai” memperjelas urutan tindakan tanpa menambah isi. Istilah kurban dipertahankan sebagai kosakata ritual yang umum dipahami.
