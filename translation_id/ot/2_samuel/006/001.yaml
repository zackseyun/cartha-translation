translation:
  language: id
  text: Daud kembali mengumpulkan semua orang-orang pilihan dari antara Israel, sebanyak tiga puluh ribu orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang muda”. Kata Ibrani בָּחוּר dapat menunjuk kepada orang muda atau kepada orang yang dipilih/unggul. Dalam konteks ini, makna “orang-orang pilihan” tampaknya paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד
  choice: kembali
  rationale: Gabungan יסף + עוד menyatakan pengulangan tindakan; “kembali” alami dalam narasi bahasa Indonesia.
- source_word: אֶת כָּל
  choice: semua
  rationale: אֶת menandai objek langsung, sedangkan כָּל menyatakan keseluruhan kelompok; “semua” menyampaikan cakupan itu secara wajar.
- source_word: בָּחוּר
  choice: orang pilihan
  rationale: Dalam konteks pengerahan kelompok besar, בָּחוּר dapat menunjuk kepada orang-orang terpilih atau unggul, meskipun dapat pula berarti orang muda. Terjemahan ini mempertahankan nuansa pemilihan yang paling sesuai dengan konteks.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi בְּ diterjemahkan secara langsung sebagai “di”; frasa ini menyatakan lingkungan tempat seluruh kelompok pilihan itu dihimpun, tanpa memaksakan hubungan partitif.
- source_word: שְׁלֹשִׁים אָלֶף
  choice: tiga puluh ribu orang
  rationale: Bilangan diterjemahkan langsung; “orang” ditambahkan secara wajar untuk memperjelas bahwa angka itu menghitung kelompok manusia yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang pilihan” menjaga kemungkinan makna militer atau kelompok unggul tanpa memakai istilah teknis; catatan kaki mempertahankan ambiguitas leksikal Ibrani.
