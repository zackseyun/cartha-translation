  text: וַ/יָּבִ֜אוּ אֶת אֲר֣וֹן יְהוָ֗ה וַ/יַּצִּ֤גוּ אֹת/וֹ֙ בִּ/מְקוֹמ֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָטָה ל֖/וֹ דָּוִ֑ד וַ/יַּ֨עַל דָּוִ֥ד עֹל֛וֹת לִ/פְנֵ֥י יְהוָ֖ה וּ/שְׁלָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/017.yaml
  text: They brought in the ark of Yahweh and set it in its place[a], inside the tent that David had pitched for it. And David offered burnt offerings and peace offerings before Yahweh.
translation:
  language: id
  text: Mereka membawa masuk tabut Yahweh dan menempatkannya di tempatnya, di dalam kemah yang telah didirikan Daud untuknya. Lalu Daud mempersembahkan korban bakaran dan korban keselamatan[a] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “korban persekutuan” atau “korban kesejahteraan.”
    reason: Istilah Ibrani שְׁלָמִים memiliki alternatif padanan yang menonjolkan nuansa persekutuan atau kesejahteraan.
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: אֲרוֹן dalam konteks ibadah Israel secara lazim diterjemahkan “tabut,” sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: וַיָּבִאוּ
  choice: Mereka membawa masuk
  rationale: Bentuk Hifil dari בוא menyatakan bahwa mereka membawa tabut masuk ke lokasi yang telah disiapkan.
- source_word: וַיַּצִּגוּ אֹתוֹ בִּמְקוֹמוֹ
  choice: dan menempatkannya di tempatnya
  rationale: יצג menyatakan tindakan menaruh atau menegakkan sesuatu pada posisi tertentu; pengulangan “menempatkannya di tempatnya” mempertahankan susunan dan penekanan teks Ibrani.
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: di dalam kemah
  rationale: בְּתוֹךְ menunjukkan lokasi di bagian dalam; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִד
  choice: yang telah didirikan Daud untuknya
  rationale: נטה ketika digunakan untuk kemah berarti membentangkan atau mendirikan. “Telah didirikan” menunjukkan bahwa kemah itu sudah disiapkan sebelum tabut dibawa masuk; “untuknya” merujuk kepada tabut.
- source_word: וַיַּעַל דָּוִד
  choice: Lalu Daud mempersembahkan
  rationale: עלה dalam konteks kurban berarti mempersembahkan kurban, bukan sekadar membawa naik.
- source_word: עֹלוֹת
  choice: korban-korban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar; bentuk jamaknya dipertahankan.
- source_word: וּשְׁלָמִים
  choice: dan korban-korban keselamatan
  rationale: שְׁלָמִים menunjuk kurban yang berkaitan dengan keselamatan, kesejahteraan, dan persekutuan. “Korban keselamatan” merupakan istilah yang dikenal, sementara alternatif yang menonjolkan nuansa lain dicatat dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי secara harfiah berarti “di depan” atau “di hadapan”; dalam konteks ibadah, “di hadapan Yahweh” menyampaikan makna kehadiran ilahi secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa istilah kurban שְׁלָמִים
  choice: korban-korban keselamatan
  alternative: korban-korban persekutuan; korban-korban kesejahteraan
  rationale: Istilah Ibrani memiliki cakupan makna yang berhubungan dengan keadaan utuh atau sejahtera serta persekutuan dalam perjamuan kurban. Teks utama memakai istilah yang dikenal tanpa menutup alternatif nuansanya, yang disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan serta pengulangan “menempatkannya di tempatnya” dipertahankan sedekat mungkin dengan teks Ibrani, sedangkan istilah ritual dibuat mudah dikenali oleh pembaca umum.
