base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/010.yaml
  text: So David was not willing to bring the ark of Yahweh to himself into the City of David[b][a], but David turned it aside to the house of Obed-edom the Gittite.
translation:
  language: id
  text: Daud tidak bersedia membawa tabut Yahweh kepada dirinya ke Kota Daud[a], tetapi ia mengalihkannya ke rumah Obed-Edom, orang Gat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “naik menuju Kota Daud.” Preposisi Ibrani dapat menyatakan gerak menuju, termasuk gerak naik ke suatu tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang Giti.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: bersedia
  rationale: Kata ini menyatakan kemauan atau persetujuan. Dalam bentuk negatif, “tidak bersedia” mempertahankan nuansa keputusan Daud tanpa memperkuatnya menjadi penolakan yang keras.
- source_word: לְהָסִיר אֵלָיו
  choice: membawa ... ke tempatnya
  rationale: Secara harfiah ungkapan ini berarti memindahkan atau menyingkirkan sesuatu ke arahnya. Dalam konteks pemindahan tabut ke pusat kedudukan Daud, pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan rujukan kepada Daud.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: Bentuk konstruksi diterjemahkan secara langsung, dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: עַל עִיר דָוִד
  choice: di Kota Daud
  rationale: Preposisi עַל dalam konteks gerak dapat menunjukkan tujuan atau gerak naik menuju suatu tempat. Susunan “ke tempatnya di Kota Daud” menyampaikan tujuan secara alami; kemungkinan nuansa “naik ke” dicatat dalam catatan kaki.
- source_word: וַיַּטֵּהוּ
  choice: mengalihkannya
  rationale: Bentuk dari נטה di sini berarti mengarahkan atau membelokkan ke tujuan lain. “Mengalihkannya” jelas dan wajar untuk pemindahan tabut.
- source_word: בֵּית עֹבֵד אֱדֹם
  choice: rumah Obed-Edom
  rationale: בֵּית dapat berarti rumah atau keluarga seisi rumah. Karena tabut ditempatkan di sebuah kediaman, “rumah” merupakan arti yang paling langsung.
- source_word: הַגִּתִּי
  choice: orang Gat
  rationale: Kata nisbah ini menunjuk kepada seseorang yang berasal dari atau terkait dengan Gat. “Orang Gat” lebih mudah dipahami pembaca Indonesia daripada transliterasi “orang Giti”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. “Tidak bersedia” menjaga nuansa kemauan; “mengalihkannya” menghindari ungkapan kaku sambil mempertahankan kontras antara tujuan semula dan tempat tabut akhirnya dibawa.
