lexical_decisions:
- source_word: מַעֲלִים
  choice: membawa naik
  rationale: Partisipel Hifil dari עלה menggambarkan tindakan yang sedang berlangsung. Dalam bahasa Indonesia, bentuk tanpa penanda aspek eksplisit tetap alami dalam narasi, sedangkan 'membawa naik' mempertahankan arah geraknya.
- source_word: בֵּית יִשְׂרָאֵל
  choice: kaum Israel
  rationale: Secara harfiah ungkapan ini berarti 'rumah Israel', tetapi 'kaum Israel' lebih alami dalam bahasa Indonesia dan tetap mempertahankan nuansa Israel sebagai kesatuan umat atau keluarga besar.
- source_word: אֲרוֹן יְהוָה
  choice: tabut Yahweh
  rationale: אֲרוֹן merujuk pada tabut kudus, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh' agar nama perjanjian itu tetap tampak.
- source_word: תְרוּעָה
  choice: sorak-sorai
  rationale: Kata ini dapat menunjuk pada seruan keras, pekik, atau aklamasi penuh kegembiraan. 'Sorak-sorai' cocok dengan suasana perayaan dan membedakannya dari bunyi sangkakala yang disebut sesudahnya.
- source_word: קוֹל שׁוֹפָר
  choice: bunyi sangkakala
  rationale: קוֹל berarti 'bunyi' dan שׁוֹפָר adalah alat tiup dari tanduk, kerap berupa tanduk domba jantan. 'Sangkakala' merupakan padanan Indonesia yang wajar, dengan sifat alatnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri ilahi tanpa menggantinya dengan gelar, sambil tidak memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Demikianlah' menghubungkan ayat ini dengan rangkaian peristiwa sebelumnya; 'kaum Israel' menghindari ungkapan harfiah yang kaku, 'rumah Israel'. Semua penanda catatan kaki dicantumkan dalam teks utama.
