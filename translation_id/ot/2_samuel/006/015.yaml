  text: So David and all the house of Israel were bringing up the ark of Yahweh with shouting and with the sound of the horn[a][b].
translation:
  language: id
  text: Daud dan segenap kaum Israel membawa naik tabut Yahweh dengan sorak-sorai[a] dan bunyi sangkakala[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan pekik kegembiraan”; istilah Ibrani ini dapat berarti seruan atau aklamasi riang.'
