base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/005.yaml
  text: And David and all the house of Israel were celebrating before Yahweh with all kinds of cypress wood instruments[a], and with lyres, harps, tambourines, rattles[c][b], and cymbals.
translation:
  language: id
  text: Daud dan seluruh kaum Israel bersukaria[b] di hadapan Yahweh dengan segala macam alat musik dari kayu sanobar[a], juga dengan lira, harpa, rebana, kerincingan[c], dan simbal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan segala kayu sanobar.” Ungkapan Ibrani ini sulit dan kemungkinan menunjuk pada beragam alat musik yang terbuat dari kayu tersebut. Jenis pohon yang dimaksud juga tidak pasti; mungkin sanobar, eru, atau pohon sejenis.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “bermain,” “bersenang-senang,” atau “merayakan.” Kata Ibraninya menggambarkan kegiatan meriah yang penuh kegembiraan.
    reason: lexical_alternative
  - marker: c
    text: Identitas alat ini tidak pasti. Mungkin yang dimaksud ialah kerincingan, sistrum, atau alat perkusi lain yang dibunyikan dengan diguncangkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: bersukaria
  rationale: Bentuk piel dari שׂחק di sini menggambarkan kegiatan meriah dan penuh kegembiraan dalam arak-arakan. “Bersukaria” menyampaikan suasana perayaan tanpa membatasinya hanya pada bermain musik atau menari.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: Ungkapan ini mempertahankan pengertian Israel sebagai komunitas bangsa, tetapi lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah “seluruh rumah Israel”.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ini adalah padanan alami bagi idiom yang menyatakan tindakan dalam hadirat Yahweh; nama ilahi dipertahankan sebagai nama diri.
- source_word: בְּכֹל עֲצֵי בְרוֹשִׁים
  choice: dengan segala macam alat musik dari kayu sanobar
  rationale: Teks Ibrani secara harfiah menyebut “dengan segala kayu sanobar” dan bersifat eliptis. Konteks daftar alat musik mendukung kata “alat musik” sebagai unsur tersirat, sementara catatan kaki mempertahankan kesulitan teks dan ketidakpastian jenis pohonnya.
- source_word: כִנֹּרוֹת
  choice: lira
  rationale: כִּנּוֹר menunjuk pada alat musik petik jenis lira; “lira” lebih tepat secara organologis daripada “harpa” atau “kecapi”.
- source_word: נְבָלִים
  choice: harpa
  rationale: נֵבֶל adalah alat musik petik yang dibedakan dari כִּנּוֹר. Identifikasi tepatnya tidak pasti, tetapi “harpa” merupakan padanan modern yang mudah dipahami.
- source_word: תֻפִּים
  choice: rebana
  rationale: תֹּף adalah genderang bingkai yang dimainkan dengan tangan. “Rebana” merupakan padanan Indonesia yang dikenal luas dan sesuai dengan bentuk umum alat tersebut.
- source_word: מְנַעַנְעִים
  choice: alat derik
  rationale: Istilah langka ini tampaknya menunjuk pada alat perkusi yang dibunyikan dengan diguncangkan. “Alat derik” menyatakan cara menghasilkan bunyinya tanpa memastikan identifikasi yang tidak dapat dibuktikan.
- source_word: צֶלְצֶלִים
  choice: simbal
  rationale: Konteks mendukung alat perkusi logam yang dibenturkan; “simbal” adalah istilah Indonesia modern yang jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. “Seluruh kaum Israel” mempertahankan nuansa korporat ungkapan Ibrani. Istilah alat musik dipilih agar mudah dimengerti sekaligus cukup tepat; ketidakpastian pada frasa kayu sanobar dan alat derik dijelaskan dalam catatan kaki.
