base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/006/014.yaml
  text: And David was dancing with all his might before Yahweh[b][a], and David was wearing a linen ephod.
translation:
  language: id
  text: Daud menari-nari[a] dengan segenap kekuatannya di hadapan Yahweh, dan Daud mengenakan efod dari linen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berputar-putar” atau “melompat-lompat”; kata Ibrani menggambarkan gerakan perayaan yang penuh semangat.
    reason: lexical_alternative
  - marker: b
    text: Efod adalah pakaian khas dalam pelayanan imam atau ibadah; di sini Daud digambarkan mengenakan efod yang terbuat dari linen.
    reason: cultural_note
lexical_decisions:
- source_word: מְכַרְכֵּר
  choice: menari-nari
  rationale: Bentuk partisip ini menggambarkan gerakan tubuh yang penuh semangat dalam perayaan. “Menari-nari” alami dalam bahasa Indonesia dan mempertahankan kesan gerakan yang berlangsung serta bersemangat tanpa menentukan secara berlebihan apakah Daud berputar-putar atau melompat-lompat.
- source_word: בְּכָל עֹז
  choice: dengan segenap kekuatannya
  rationale: Ungkapan ini menyatakan pengerahan tenaga sepenuhnya. Pilihan ini jelas, wajar, dan mempertahankan intensitas teks Ibrani.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam kehadiran”. “Di hadapan Yahweh” ringkas dan mempertahankan latar ibadah dalam ayat ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: חָגוּר
  choice: mengenakan
  rationale: Bentuk ini menunjukkan bahwa Daud sedang berpakaian atau dilengkapi dengan pakaian tersebut. “Mengenakan” merupakan padanan Indonesia modern yang alami.
- source_word: אֵפוֹד
  choice: efod
  rationale: Efod adalah pakaian khas dalam lingkungan ibadah Israel dan tidak mempunyai padanan Indonesia yang tepat. Transliterasi mempertahankan istilah teknisnya.
- source_word: בָּד
  choice: linen
  rationale: Di sini kata tersebut menunjuk pada bahan linen. “Linen” mempertahankan jenis bahannya tanpa menambahkan mutu seperti “linen halus”, yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Ayat ini secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi ilahi dalam teks sumber, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan bentuk pelafalan tradisional yang berbeda.
- issue: Makna pemakaian efod oleh Daud
  choice: Menerjemahkan deskripsi pakaian tanpa menyatakan bahwa Daud menjabat sebagai imam
  alternative: Menjelaskan efod sebagai bukti bahwa Daud menjalankan jabatan imam
  rationale: Teks hanya menyatakan bahwa Daud mengenakan efod dari linen. Karena implikasi jabatan atau fungsi khusus tidak dijelaskan dalam ayat ini, terjemahan tidak menambahkan kesimpulan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan nama “Daud” dipertahankan karena terdapat dalam teks Ibrani. “Menari-nari” menyampaikan gerakan perayaan yang berkelanjutan, sementara catatan kaki mempertahankan kemungkinan nuansa gerak lainnya.
