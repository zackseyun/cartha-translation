translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar alur reaksi raja dan keadaan para pegawainya mudah dipahami. Penanda catatan kaki ditempatkan langsung sesudah tindakan mengoyakkan pakaian yang dijelaskannya.
