base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/031.yaml
  text: Then the king arose[a], tore his garments, and lay on the ground, and all his servants were standing with their garments torn.
translation:
  language: id
  text: Lalu raja bangkit, mengoyakkan pakaiannya,[a] dan membaringkan diri di tanah. Semua pegawainya berdiri dengan pakaian terkoyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mengoyakkan pakaian merupakan ungkapan dukacita, kengerian, atau perkabungan yang lazim dalam Alkitab Ibrani.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk Qal wayyiqtol dari קום melanjutkan urutan narasi dan menggambarkan reaksi raja yang segera; “bangkit” alami sekaligus bermartabat dalam konteks ini.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Nomina tentu ini menunjuk kepada tokoh raja yang sudah dikenal dalam konteks, yaitu Daud; gelar dipertahankan tanpa menggantinya dengan nama pribadi.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: mengoyakkan pakaiannya
  rationale: קרע dengan בגדיו merupakan ungkapan lazim untuk tindakan merobek pakaian sebagai tanda dukacita atau keterkejutan. “Mengoyakkan” mempertahankan tindakan yang disengaja, sedangkan “pakaian” merupakan padanan Indonesia modern yang wajar.
- source_word: וַיִּשְׁכַּב אַרְצָה
  choice: membaringkan diri di tanah
  rationale: שכב menyatakan berbaring, sedangkan אַרְצָה dengan akhiran direktif menunjukkan gerak menuju tanah. Bentuk refleksif ini menyampaikan bahwa raja merebahkan dirinya sendiri ke tanah.
- source_word: וְכָל־עֲבָדָיו
  choice: semua pegawainya
  rationale: עֲבָדִים dalam lingkungan istana dapat merujuk kepada para pelayan atau pejabat yang melayani raja. “Pegawai” cukup luas untuk konteks kerajaan tanpa menentukan jabatan mereka secara berlebihan.
- source_word: נִצָּבִים
  choice: berdiri
  rationale: Partisipel Niphal dari נצב menggambarkan keadaan yang sedang berlangsung dalam adegan tersebut; bahasa Indonesia dapat menyatakannya secara alami dengan “berdiri”.
- source_word: קְרֻעֵי בְגָדִים
  choice: dengan pakaian terkoyak
  rationale: Partisipel pasif קרע dengan בְגָדִים menggambarkan keadaan pakaian sesudah dikoyakkan. “Terkoyak” mempertahankan nuansa resultatif tersebut.
