base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/015.yaml
  text: Then Amnon hated her with very great hatred[a], because the hatred with which he hated her was greater than the love with which he had loved her. And Amnon said to her, “Get up, go.”
translation:
  language: id
  text: Lalu Amnon membenci Tamar dengan kebencian yang sangat besar, sebab kebenciannya kepada Tamar lebih besar daripada cintanya kepada Tamar dahulu. Amnon berkata kepadanya, “Bangun, pergi!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Bangun, pergi.” Dua perintah singkat ini menyampaikan pengusiran Amnon yang kasar; beberapa terjemahan mengungkapkan maksudnya dengan “Pergilah” atau “Pergi dari sini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂנָאֶהָ אַמְנוֹן
  choice: Lalu Amnon membenci Tamar
  rationale: Waw konsekutif melanjutkan alur narasi dan secara wajar diterjemahkan “Lalu”. Sufiks feminin “dia/nya” merujuk kepada Tamar; penyebutan namanya membuat acuan jelas dalam bahasa Indonesia.
- source_word: שִׂנְאָה גְּדוֹלָה מְאֹד
  choice: dengan kebencian yang amat besar
  rationale: Ungkapan ini menegaskan cara dan intensitas kebencian. Terjemahan mempertahankan pengulangan akar kata “membenci/kebencian” serta penumpukan penekanan dalam bahasa Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan kausal bagi pernyataan sebelumnya; “sebab” alami dan bermartabat dalam narasi Indonesia.
- source_word: גְדוֹלָה הַשִּׂנְאָה אֲשֶׁר שְׂנֵאָהּ מֵאַהֲבָה אֲשֶׁר אֲהֵבָהּ
  choice: kebenciannya terhadap Tamar lebih besar daripada cinta yang sebelumnya ia rasakan terhadapnya
  rationale: Preposisi מִן menyatakan perbandingan. “Sebelumnya” menunjukkan bahwa cinta itu mendahului kebencian tanpa memaksakan lebih dari urutan konteks. “Ia rasakan” menghasilkan bahasa Indonesia yang lebih alami untuk cinta, meski sedikit mengurangi pengulangan verbal sumber.
- source_word: קוּמִי לֵכִי
  choice: Bangun, pergi!
  rationale: Dua imperatif feminin tunggal diterjemahkan secara singkat dan langsung untuk mempertahankan kerasnya pengusiran Amnon.
theological_decisions:
- issue: Penyebutan perasaan Amnon sebagai cinta
  choice: cinta
  alternative: hasrat
  rationale: Teks sumber memakai אַהֲבָה dari akar אהב, sehingga diterjemahkan secara langsung sebagai “cinta”. Menggantinya dengan “hasrat” akan menafsirkan sifat perasaan Amnon dan menghilangkan ketegangan naratif yang terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “membenci/kebencian” sengaja dipertahankan untuk mencerminkan penekanan Ibrani, sedangkan susunan klausa dibuat alami bagi pembaca Indonesia. Penanda catatan kaki ditempatkan sesudah kutipan yang diterangkannya.
