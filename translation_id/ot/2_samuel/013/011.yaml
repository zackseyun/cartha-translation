base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/011.yaml
  text: When she brought it near to him to eat[a], he seized her and said to her, “Come, lie with me, my sister.”
translation:
  language: id
  text: Ketika Tamar mendekatkan makanan itu kepadanya untuk dimakan[a], Amnon memegangnya dengan kuat dan berkata kepadanya, “Kemarilah, tidurlah denganku, saudariku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika Tamar mendekat kepadanya untuk makan.” Kata kerja Ibrani dapat berarti bahwa Tamar mendekat atau bahwa ia mendekatkan makanan itu kepada Amnon.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: Tamar mendekatkan makanan itu
  rationale: Bentuk hiphil dari נגשׁ dapat berarti ‘mendekatkan’ atau, menurut kemungkinan lain, dipahami sebagai tindakan mendekat. Konteks penyajian makanan mendukung ‘mendekatkan makanan itu’; nama dan objek tersirat dinyatakan agar alami dalam bahasa Indonesia, sementara ambiguitas dicatat dalam catatan kaki.
- source_word: אֵלָיו לֶאֱכֹל
  choice: kepadanya untuk dimakan
  rationale: Frasa tujuan Ibrani dipertahankan secara ringkas. Bentuk pasif Indonesia menjelaskan bahwa makanan itulah yang hendak dimakan tanpa menentukan lebih jauh daripada konteks.
- source_word: וַיַּחֲזֶק בָּהּ
  choice: Amnon mencengkeram dia
  rationale: חזק dengan ב menunjukkan tindakan memegang kuat-kuat. ‘Mencengkeram’ menyampaikan unsur paksaan secara wajar; nama subjek dipakai untuk kejelasan karena pronomina orang ketiga bahasa Indonesia tidak menandai gender.
- source_word: בּוֹאִי
  choice: Mari
  rationale: Imperatif feminin tunggal בואי secara harfiah berarti ‘datanglah’, tetapi bersama perintah berikutnya berfungsi sebagai ajakan mendesak. ‘Mari’ terdengar alami dan tetap langsung.
- source_word: שִׁכְבִי עִמִּי
  choice: tidurlah denganku
  rationale: שכב עם merupakan idiom seksual. Dalam bahasa Indonesia modern, ‘tidur dengan’ menyampaikan makna seksual dengan jelas dan bermartabat, tanpa melembutkan tuntutan tersebut.
- source_word: אֲחוֹתִי
  choice: adikku
  rationale: אחותי berarti ‘saudara perempuanku’. Tamar adalah adik perempuan Amnon, dan ‘adikku’ merupakan sapaan kekerabatan yang paling alami dalam konteks Indonesia serta mempertahankan daya moral narasi.
theological_decisions:
- issue: Penerjemahan perintah seksual tanpa penghalusan eufemistis
  choice: tidurlah denganku
  alternative: berbaringlah denganku
  rationale: Ungkapan Ibrani merupakan idiom seksual yang jelas. ‘Tidurlah denganku’ mempertahankan makna seksual dalam bahasa Indonesia modern, sedangkan ‘berbaringlah denganku’ dapat terdengar hanya sebagai posisi tubuh.
- issue: Pemertahanan sapaan kekerabatan
  choice: adikku
  alternative: saudara perempuanku
  rationale: Sapaan kekerabatan harus tetap eksplisit karena memperkuat beratnya pelanggaran dalam narasi. ‘Adikku’ menyatakan hubungan itu secara alami dan sesuai dengan urutan usia tokoh.
translation_notes:
  register: Bahasa Indonesia baku-modern, lugas, dan bermartabat. Nama tokoh digunakan untuk menghindari ketidakjelasan pronomina; kekerasan tindakan dan sifat seksual perintah tidak diperhalus. Penanda catatan kaki [a] hadir dalam teks utama.
