base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/010.yaml
  text: Then Amnon said to Tamar[a], “Bring the food into the inner room, so that I may eat from your hand.” So Tamar took the cakes she had made and brought them into the inner room to Amnon her brother.
translation:
  language: id
  text: Lalu Amnon berkata kepada Tamar, “Bawalah makanan itu ke kamar dalam[a], supaya aku dapat makan dari tanganmu.” Tamar pun mengambil kue-kue yang telah dibuatnya dan membawanya kepada Amnon, saudara laki-lakinya, ke kamar dalam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamar” saja. Kata Ibrani חֶדֶר menunjuk pada kamar di bagian dalam; “kamar dalam” dipilih untuk mencerminkan suasana yang lebih tertutup.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאִי
  choice: Bawalah
  rationale: Bentuk imperatif feminin tunggal dari בוא dalam pemakaian kausatif; Amnon menyuruh Tamar membawa makanan ke tempat lain.
- source_word: הַבִּרְיָה
  choice: makanan itu
  rationale: Nomina ini menunjuk pada makanan yang telah disiapkan; pilihan umum ini tidak mendahului penyebutan khusus tentang kue-kue pada klausa berikutnya.
- source_word: הַחֶדֶר / הֶחָדְרָה
  choice: ke kamar dalam
  rationale: חֶדֶר menunjuk pada kamar di bagian dalam, sedangkan akhiran direktif pada bentuk kedua menyatakan gerak masuk. Terjemahan yang sama pada kedua kemunculan mempertahankan penekanan naratif pada tempat yang lebih tertutup.
- source_word: וְאֶבְרֶה
  choice: supaya aku dapat makan
  rationale: Bentuk ini berasal dari ברה, yang dalam konteks berarti makan atau menyantap makanan; 'supaya' menyampaikan hubungan tujuan setelah perintah.
- source_word: מִיָּדֵךְ
  choice: dari tanganmu
  rationale: Terjemahan harfiah ini mempertahankan idiom Ibrani dan sifat pribadi dari permintaan Amnon.
- source_word: הַלְּבִבוֹת
  choice: kue-kue
  rationale: Istilah ini menunjuk pada kue khusus yang dibuat Tamar dalam konteks sebelumnya; bentuk jamak mengikuti teks Ibrani.
- source_word: אָחִיהָ
  choice: saudaranya
  rationale: Hubungan kekerabatan disebut secara eksplisit dalam bahasa Ibrani dan penting bagi daya naratif serta moral ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Partikel 'pun' memperjelas kelanjutan tindakan tanpa menambah makna baru. 'Kamar dalam' mempertahankan kemungkinan nuansa ruang interior dan dipakai konsisten pada kedua kemunculan.
