  terminology: '''Kamar dalam'' merupakan padanan yang layak dan konsisten untuk חֶדֶר; catatan kaki dengan tepat mempertahankan alternatif ''kamar''. ''Makanan itu'', ''dari tanganmu'', dan ''kue-kue'' juga sesuai konteks dan tingkat kekhususan istilah Ibrani.'
