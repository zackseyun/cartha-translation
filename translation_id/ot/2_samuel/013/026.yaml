  terminology: Nama Absalom dan Amnon dipertahankan. "Saudaraku" tepat untuk istilah kekerabatan אָחִי dan tidak menambahkan penafsiran seperti "adik" atau "kakak." Tidak ada istilah teologis khusus dalam ayat ini.
