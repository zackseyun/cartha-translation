  yaml_path: translation/ot/2_samuel/013/026.yaml
  text: Then Absalom said[a], “If not, please let my brother Amnon go with us.” But the king said to him, “Why should he go with you?”
translation:
  language: id
  text: Lalu Absalom berkata[a], “Jika tidak, mohon izinkanlah saudaraku Amnon pergi bersama kami.” Tetapi raja berkata kepadanya, “Mengapa ia harus pergi bersamamu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lengkap, “Jika Ayah tidak mau pergi, mohon izinkanlah saudaraku Amnon pergi bersama kami.” Ungkapan Ibrani "jika tidak" bersifat eliptis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata / Tetapi ... bertanya
  rationale: Waw konsekutif melanjutkan alur narasi. “Lalu” wajar untuk ucapan pertama, sedangkan “Tetapi” menandai tanggapan raja yang berkeberatan. Kata kerja yang sama diterjemahkan “bertanya” pada klausa kedua karena langsung diikuti pertanyaan.
- source_word: וָלֹא
  choice: Jika Ayah tidak mau
  rationale: Ungkapan Ibrani ini eliptis dan merujuk pada penolakan raja dalam konteks sebelumnya. Penyebutan “Ayah” membuat lawan bicara tersirat menjadi jelas dan mempertahankan hubungan Absalom dengan raja; bentuk eliptis dicatat dalam catatan kaki.
- source_word: נָא
  choice: izinkanlah
  rationale: Partikel permohonan yang sopan diwujudkan secara alami melalui bentuk permintaan “izinkanlah” dalam bahasa Indonesia.
- source_word: יֵלֶךְ
  choice: izinkanlah ... pergi / harus pergi
  rationale: Yusif dalam permohonan Absalom diterjemahkan dengan bentuk izin, sementara imperfek dalam pertanyaan retoris raja diterjemahkan “harus pergi”.
- source_word: אִתָּנוּ
  choice: bersama kami
  rationale: Padanan langsung untuk preposisi komitatif dengan sufiks orang pertama jamak.
- source_word: אַמְנוֹן אָחִי
  choice: Amnon, saudara saya
  rationale: Urutan nama lalu hubungan kekerabatan mengikuti susunan Ibrani dan tetap alami dalam bahasa Indonesia. “Saya” sesuai dengan permohonan yang sopan kepada raja.
- source_word: לָמָה
  choice: Mengapa
  rationale: Padanan interogatif yang langsung dan alami.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Sufiks orang kedua tunggal merujuk kepada Absalom; “-mu” alami dalam ucapan ayah kepada anak.
