  naturalness: Bahasa draf umumnya modern dan mengalir. “Mereka menangis dengan suara nyaring” merupakan pengungkapan yang alami untuk idiom ‘mengangkat suara dan menangis’. “Menangis dengan sangat hebat” lebih dekat kepada penegasan Ibrani tanpa menambah cara menangis tertentu.
  terminology: “Putra-putra raja” mempertahankan rujukan maskulin jamak dari teks sumber dan sesuai dengan register naratif yang bermartabat. “Pegawai” tetap dapat diterima sebagai padanan luas bagi עֲבָדָיו dalam konteks istana.
