base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/036.yaml
  text: And as soon as he finished speaking[a], behold, the king’s sons came, and they raised their voices and wept. The king also, and all his servants, wept with very great weeping.
translation:
  language: id
  text: Begitu ia selesai berbicara, tampaklah putra-putra raja datang. Mereka menangis dengan suara nyaring. Raja dan semua pegawainya juga menangis dengan sangat hebat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menangis dengan tangisan yang sangat hebat,” suatu ungkapan Ibrani yang menegaskan kuatnya tangisan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: Begitu ia selesai berbicara
  rationale: Rumus naratif dengan anak kalimat waktu diterjemahkan secara idiomatis. “Begitu” menyampaikan urutan kejadian yang langsung tanpa mempertahankan bentuk Ibrani yang kaku.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini menarik perhatian kepada kedatangan yang terjadi pada saat itu; “tampaklah” mempertahankan daya hidup narasi dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: anak-anak raja
  rationale: Frasa konstruksi ini secara langsung menunjuk kepada para putra raja; dalam konteks, “anak-anak raja” alami dan tidak perlu mempersempit makna dengan penjelasan tambahan.
- source_word: בָּאוּ
  choice: datang
  rationale: Padanan langsung bagi verba gerak yang sesuai dengan alur narasi.
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: Mereka menangis dengan suara nyaring
  rationale: Ungkapan harfiah “mengangkat suara mereka dan menangis” adalah idiom ratapan keras. Terjemahan ini menyampaikan tindakan dan kuatnya suara secara alami.
- source_word: וְגַם הַמֶּלֶךְ וְכָל עֲבָדָיו
  choice: Raja dan semua pegawainya pun
  rationale: “Pun” menyampaikan unsur tambahan וְגַם. Dalam lingkungan istana, “pegawai” cukup luas untuk para pelayan atau anggota rombongan kerajaan tanpa menentukan jabatan mereka secara berlebihan.
- source_word: בָּכוּ בְּכִי גָּדוֹל מְאֹד
  choice: menangis tersedu-sedu
  rationale: Konstruksi kata kerja dan nomina serumpun menegaskan hebatnya tangisan. Ungkapan Indonesia ini menyampaikan ratapan yang sangat kuat secara alami; bentuk Ibraninya dijelaskan dalam catatan kaki.
