  terminology: '"Memerkosanya" merupakan istilah modern yang jelas untuk konteks ini dan tidak menyamarkan kekerasan seksual. Catatan c sebaiknya memakai "merendahkan" atau "melanggar" sebagai padanan rentang leksikal ענה; "menodai" membawa nuansa tambahan yang kurang langsung. Karena "dia" dapat ambigu bila berdiri sendiri, pengulangan "Tamar" secara aman memperjelas rujukan tanpa mengubah makna.'
