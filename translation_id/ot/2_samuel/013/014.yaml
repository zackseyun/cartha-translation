  text: But he would not listen to her[a], and he was stronger than she was[c][b], and he violated her and lay with her.
translation:
  language: id
  text: Namun, ia tidak mau mendengarkan Tamar[a]. Ia lebih kuat daripada Tamar[b], dan ia memerkosanya[c] serta berhubungan seksual dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “mendengarkan suaranya.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “ia mengalahkannya.”
    reason: lexical_alternative
  - marker: c
    text: Verba Ibrani ini dapat berarti “merendahkan” atau “melanggar”; dalam konteks ini yang dimaksud adalah pemerkosaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: tidak mau
  rationale: Dengan negasi dan infinitif, verba ini menyatakan penolakan yang disengaja; “tidak mau” alami dalam bahasa Indonesia dan mempertahankan unsur kehendak.
- source_word: לִשְׁמֹעַ בְּקוֹלָהּ
  choice: mendengarkannya
  rationale: Ungkapan Ibrani harfiah berarti “mendengarkan suaranya,” tetapi dalam konteks ini bermakna mengindahkan permohonannya.
- source_word: וַיֶּחֱזַק מִמֶּנָּה
  choice: ia lebih kuat daripada dia
  rationale: Terjemahan ini mempertahankan bentuk perbandingan dan urutan tindakan dalam teks, tanpa meleburkannya langsung menjadi “ia mengalahkan dia dengan kekerasan.”
- source_word: וַיְעַנֶּהָ
  choice: memerkosanya
  rationale: Dalam konteks kekerasan seksual ini, bentuk verba ענה menunjuk pada perendahan atau pelanggaran seksual secara paksa. “Memerkosanya” menyatakan tindakan tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: menidurinya
  rationale: Ini adalah ungkapan Ibrani bagi hubungan seksual. “Menidurinya” mempertahankan idiom tersebut, sedangkan konteks dan verba sebelumnya menjelaskan bahwa tindakan itu dilakukan secara paksa.
