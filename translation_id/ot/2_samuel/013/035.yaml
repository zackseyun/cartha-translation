  text: וַ/יֹּ֤אמֶר יֽוֹנָדָב֙ אֶל הַ/מֶּ֔לֶךְ הִנֵּ֥ה בְנֵֽי הַ/מֶּ֖לֶךְ בָּ֑אוּ כִּ/דְבַ֥ר עַבְדְּ/ךָ֖ כֵּ֥ן הָיָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/035.yaml
  text: Then Jonadab said to the king[a], “Look, the king’s sons have come; as your servant said, so it has happened.”
translation:
  language: id
  text: Lalu Yonadab berkata kepada raja, “Lihat, putra-putra raja sudah datang. Seperti yang dikatakan hambamu, demikianlah yang terjadi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia modern.
- source_word: יֽוֹנָדָב
  choice: Yonadab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Merujuk kepada Raja Daud sebagai manusia; “raja” tidak perlu diawali huruf kapital di tengah kalimat.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian kepada kedatangan yang kini tampak; “Lihat” mempertahankan daya langsungnya tanpa memakai ungkapan arkais.
- source_word: בְנֵי הַמֶּלֶךְ
  choice: putra-putra raja
  rationale: Rangkaian konstruksi diterjemahkan secara alami. Bentuk jamak penting karena konteksnya menegaskan bahwa para putra raja, bukan hanya satu orang, telah kembali.
- source_word: בָּאוּ
  choice: sudah datang
  rationale: Bentuk perfektif melaporkan kedatangan yang kini telah menjadi kenyataan; “sudah datang” alami dalam adegan langsung ini.
- source_word: כִּדְבַר עַבְדְּךָ
  choice: Seperti yang dikatakan hambamu
  rationale: דבר dalam konstruksi ini menunjuk pada apa yang telah dikatakan. “Hambamu” mempertahankan penyebutan diri yang sopan dalam lingkungan istana.
- source_word: כֵּן הָיָה
  choice: demikianlah yang terjadi
  rationale: Ungkapan ini mengukuhkan bahwa kenyataan sesuai dengan perkataan sebelumnya, sekaligus mempertahankan pola korelatif כִּ...כֵּן, “seperti ... demikianlah”.
