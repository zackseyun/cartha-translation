base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/033.yaml
  text: Now let not my lord the king take this matter to heart[a], saying, ‘All the king’s sons are dead,’ for Amnon alone is dead.
translation:
  language: id
  text: Sekarang, janganlah Tuanku, raja, menganggap bahwa semua putra raja telah mati, sebab hanya Amnon yang telah mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “janganlah ... menaruh perkara ini pada/ke dalam hatinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengawali koreksi Yonadab; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: אַל יָשֵׂם ... אֶל לִבּוֹ
  choice: janganlah ... memasukkan ... ke dalam hati
  rationale: Mempertahankan gambaran idiom Ibrani tentang menaruh atau memasukkan sesuatu ke dalam hati, sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: tuanku raja
  rationale: Sapaan istana yang hormat dan ringkas; akhiran -ku mempertahankan unsur orang pertama pada אֲדֹנִי.
- source_word: דָּבָר
  choice: perkara ini
  rationale: Dalam konteksnya menunjuk pada berita atau anggapan bahwa semua anak raja telah mati; 'perkara' cukup luas untuk mempertahankan cakupan katanya.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan isi perkataan atau anggapan yang tidak boleh diterima raja sebagai benar, tanpa mengubahnya secara khusus menjadi proses batin.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: Semua anak raja
  rationale: Menerjemahkan frasa konstruksi secara langsung; konteks menunjukkan anak-anak laki-laki raja, tetapi bahasa Indonesia lazim memakai 'anak' ketika jenis kelamin sudah jelas dari konteks.
- source_word: מֵתוּ
  choice: telah mati
  rationale: Menyatakan hasil dari kematian yang dilaporkan dan sesuai dengan konteks berita yang baru diterima.
- source_word: כִּי אִם
  choice: Sebab, hanya
  rationale: 'Menyampaikan fungsi korektif dan eksklusif konstruksi tersebut: bukan semua anak raja, melainkan Amnon saja.'
- source_word: לְבַדּוֹ
  choice: hanya
  rationale: Menegaskan eksklusivitas bahwa Amnon seorang saja yang mati.
- source_word: מֵת
  choice: yang mati
  rationale: Menghasilkan ungkapan Indonesia yang alami setelah 'hanya Amnon' dan mempertahankan kontras dengan laporan sebelumnya.
