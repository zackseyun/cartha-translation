base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/020.yaml
  text: Then Absalom her brother said to her[a], “Has Amnon your brother been with you? But now, my sister, keep silent; he is your brother. Do not take this matter to heart.” So Tamar remained, devastated[b], in the house of Absalom her brother.
translation:
  language: id
  text: Lalu Absalom, kakaknya, berkata kepadanya[a], “Apakah Amnon, saudara laki-lakimu, pernah bersamamu? Sekarang, adikku, diamlah. Dia adalah saudara laki-lakimu. Jangan ambil perkara ini ke hati.” Maka Tamar tinggal di rumah Absalom, kakaknya, dalam keadaan hancur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apakah Amnon, saudara laki-lakimu, pernah bersamamu?” Ini adalah ungkapan tidak langsung yang dalam konteks ini mengacu pada kekerasan seksual.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “terlantar” atau “dalam keadaan desolasi.” Kata Ibrani ini menggambarkan kehancuran, keterlantaran, atau keterpanaan yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיהָ
  choice: kakaknya
  rationale: Bahasa Ibrani hanya menyatakan ‘saudaranya’, tetapi konteks silsilah menunjukkan Absalom adalah kakak Tamar. Bahasa Indonesia lazim menuntut pilihan kakak/adik; ‘kakak’ membuat relasi jelas tanpa mengubah identitas tokoh.
- source_word: הַאֲמִינוֹן
  choice: Amnon
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: הָיָה עִמָּךְ
  choice: telah bersama denganmu
  rationale: Mempertahankan ungkapan tidak langsung dalam bahasa Ibrani yang, dalam konteks ini, menunjuk secara halus kepada kekerasan seksual.
- source_word: הַחֲרִישִׁי
  choice: diamlah
  rationale: Imperatif ini memerintahkan Tamar untuk tidak berbicara; ‘diamlah’ ringkas, tegas, dan alami dalam bahasa Indonesia.
- source_word: אָחִיךְ הוּא
  choice: Dia saudaramu
  rationale: Mempertahankan alasan singkat dan mengganggu yang dikemukakan Absalom berdasarkan hubungan keluarga, tanpa melunakkan atau menjelaskannya.
- source_word: אַל תָּשִׁיתִי אֶת לִבֵּךְ לַדָּבָר הַזֶּה
  choice: Jangan masukkan perkara ini ke dalam hatimu
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang menaruh sesuatu pada hati, sekaligus tetap dapat dipahami sebagai larangan untuk terus memikirkannya atau membiarkannya membebani batin.
- source_word: וַתֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja ini dapat berarti duduk, menetap, atau tinggal. Dalam konteks rumah Absalom, ‘tinggal’ paling alami dan tetap dekat dengan makna sumber.
- source_word: שֹׁמֵמָה
  choice: dalam keadaan hancur
  rationale: Kata ini menggambarkan kehancuran, keterlantaran, atau keterpanaan yang mendalam. ‘Dalam keadaan hancur’ menyampaikan kerusakan batin dan sosial Tamar dalam bahasa Indonesia modern.
- source_word: בֵּית אַבְשָׁלוֹם
  choice: di rumah Absalom
  rationale: Mempertahankan latar rumah tangga yang konkret dengan susunan Indonesia yang alami.
theological_decisions:
- issue: Ungkapan tidak langsung untuk kekerasan seksual
  choice: Mempertahankan ‘telah bersama denganmu’ dalam teks utama.
  alternative: ‘telah menodaimu’ atau ‘telah menidurimu’.
  rationale: Bahasa sumber menggunakan ungkapan halus dan tidak menyebut tindakan itu secara eksplisit. Terjemahan mempertahankan pengendalian diksi tersebut, sedangkan konteks narasi dan catatan kaki menjelaskan acuannya.
- issue: Ucapan Absalom tentang hubungan keluarga
  choice: Menerjemahkan secara langsung, ‘Dia saudaramu.’
  alternative: Menambahkan penjelasan seperti ‘bagaimanapun juga, dia saudaramu’.
  rationale: Teks Ibrani memberi pernyataan singkat tanpa partikel eksplisit yang berarti ‘bagaimanapun juga’. Bentuk langsung menjaga ketegangan moral dalam ucapan Absalom dan tidak menyisipkan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan sumber yang tidak langsung dipertahankan, sementara catatan kaki memberi kejelasan. Sapaan ‘adikku’ mencerminkan bentuk feminin ‘saudariku’ dalam konteks relasi kakak-adik dan terdengar alami dalam bahasa Indonesia.
