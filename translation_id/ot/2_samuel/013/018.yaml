base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/018.yaml
  text: She was wearing a richly ornamented robe[a], for this is how the virgin daughters of the king used to dress. Then his attendant put her outside and bolted the door behind her.
translation:
  language: id
  text: Tamar mengenakan jubah berlengan panjang[a], sebab demikianlah biasanya putri-putri raja yang masih perawan berpakaian. Lalu pelayan Amnon mengeluarkannya dan mengunci pintu di belakangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah berhias indah”, “jubah beraneka warna”, atau “jubah panjang”; arti tepat istilah untuk pakaian ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת פַּסִּים
  choice: jubah panjang berlengan
  rationale: Frasa ini menunjuk pada pakaian khas atau istimewa, tetapi arti tepat פַּסִּים tidak pasti. Pilihan ini mengikuti kemungkinan bahwa pakaian itu panjang hingga pergelangan tangan atau kaki, sedangkan tafsiran lain dicantumkan dalam catatan kaki.
- source_word: כִּי כֵן תִּלְבַּשְׁןָ
  choice: sebab demikianlah biasanya ... berpakaian
  rationale: Konstruksi ini menjelaskan kebiasaan berpakaian; kata 'biasanya' menyampaikan aspek habitual secara wajar dalam bahasa Indonesia.
- source_word: בְנוֹת הַמֶּלֶךְ הַבְּתוּלֹת
  choice: putri-putri raja yang masih perawan
  rationale: Terjemahan ini mempertahankan baik kedudukan mereka sebagai putri raja maupun keterangan eksplisit bahwa mereka perawan.
- source_word: מְעִילִים
  choice: berpakaian
  rationale: Bentuk jamak ini kemungkinan menunjuk pada jubah atau pakaian luar. Dalam klausa penjelas, maknanya disampaikan secara idiomatis tanpa mengulang kata 'jubah' secara kaku.
- source_word: מְשָׁרְתוֹ
  choice: pelayan Amnon
  rationale: Pronomina Ibrani berarti 'pelayannya', yakni pelayan pribadi Amnon. Nama Amnon digunakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וַיֹּצֵא אוֹתָהּ הַחוּץ
  choice: menyuruhnya keluar
  rationale: Bentuk kausatif menyatakan bahwa pelayan itu membuat Tamar keluar. Pilihan ini mempertahankan tindakan pengusiran tanpa menambahkan gambaran kekerasan fisik yang tidak dinyatakan secara eksplisit.
- source_word: וְנָעַל הַדֶּלֶת אַחֲרֶיהָ
  choice: mengunci pintu di belakangnya
  rationale: נעל berarti mengunci atau memasang palang; 'mengunci' merupakan padanan Indonesia yang alami dan mencerminkan kesengajaan tindakan itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Tamar dan Amnon dipakai untuk memperjelas rujukan pronomina dalam konteks ayat tunggal. Ambiguitas istilah pakaian dipertahankan melalui catatan kaki.
