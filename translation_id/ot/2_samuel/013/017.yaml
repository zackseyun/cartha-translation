translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ucapan Amnon dipertahankan singkat, kasar, dan menjauhkan. Kata ganti '-nya' pada 'melayaninya' merujuk kepada Amnon, sedangkan pada 'di belakangnya' merujuk kepada Tamar; konteks membedakan keduanya.
