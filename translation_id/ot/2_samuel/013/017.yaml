  text: Then he called his young man who served him and said[a], “Please send this one away from me, outside[b], and bolt the door behind her.”
translation:
  language: id
  text: Lalu ia memanggil orang muda yang melayaninya dan berkata, “Tolong usir orang ini ke luar dari hadapanku, lalu palanglah pintu di belakangnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעֲרוֹ מְשָׁרְתוֹ
  choice: orang muda yang melayaninya
  rationale: Mempertahankan arti נַעַר sebagai orang muda sekaligus daya deskriptif מְשָׁרְתוֹ sebagai orang yang melayani Amnon.
- source_word: שִׁלְחוּ נָא
  choice: Tolong usir
  rationale: Dalam konteks ini שׁלח berarti menyuruh pergi atau mengeluarkan, sedangkan נָא memberi nuansa permintaan yang menyertai perintah. 'Tolong usir' alami dalam bahasa Indonesia dan mempertahankan kerasnya tindakan tersebut.
- source_word: זֹאת
  choice: orang ini
  rationale: Demonstrativa feminin tunggal itu menunjuk kepada Tamar secara menjauhkan dan menghina. 'Orang ini' tidak menambahkan sebutan 'perempuan', tetapi tetap jelas dan bernada merendahkan dalam konteks.
- source_word: מֵעָלַי
  choice: dari hadapanku
  rationale: Ungkapan harfiahnya 'dari atasku/dekatku'; dalam konteks pengusiran, 'dari hadapanku' menyampaikan tuntutan agar Tamar disingkirkan dari keberadaannya.
- source_word: הַחוּצָה
  choice: ke luar
  rationale: Bentuk berarah ini berarti menuju ke luar; 'ke luar' mempertahankan gerak yang tersirat, bukan sekadar lokasi.
- source_word: וּנְעֹל
  choice: lalu palanglah
  rationale: נעל dapat berarti memalang, mengancing, atau mengunci. 'Palanglah' sesuai dengan bentuk pengamanan pintu pada dunia kuno dan mempertahankan perintah langsung.
- source_word: אַחֲרֶיהָ
  choice: di belakangnya
  rationale: Dalam hubungan dengan menutup atau memalang pintu, padanan Indonesia yang idiomatis ialah 'di belakangnya'.
