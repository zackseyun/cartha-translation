id: 2SA.13.1
reference: 2 Samuel 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י אַֽחֲרֵי כֵ֗ן וּ/לְ/אַבְשָׁל֧וֹם בֶּן דָּוִ֛ד אָח֥וֹת יָפָ֖ה וּ/שְׁמָ֣/הּ תָּמָ֑ר וַ/יֶּאֱהָבֶ֖/הָ אַמְנ֥וֹן בֶּן דָּוִֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/001.yaml
  text: After this[a], Absalom son of David had a beautiful sister whose name was Tamar, and Amnon son of David loved her.
translation:
  language: id
  text: Sesudah itu, Absalom, anak Daud, mempunyai seorang saudara perempuan yang cantik bernama Tamar. Amnon, anak Daud, mencintainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tergila-gila kepadanya” atau “menginginkannya”. Kata Ibrani yang digunakan adalah kata biasa untuk “mencintai”, tetapi kelanjutan kisah menunjukkan bahwa perasaan Amnon itu telah menyimpang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Gabungan formula naratif וַיְהִי dan keterangan waktu אַחֲרֵי כֵן menandai kelanjutan peristiwa. 'Sesudah itu' alami dalam bahasa Indonesia dan mempertahankan hubungan waktunya tanpa terjemahan kaku 'dan terjadilah'.
- source_word: וּלְאַבְשָׁלוֹם בֶּן דָּוִד
  choice: Absalom, anak Daud, mempunyai
  rationale: Konstruksi kepunyaan dengan לְ paling alami diterjemahkan memakai 'mempunyai'. Sebutan 'anak Daud' dipertahankan karena diulang bagi kedua tokoh laki-laki dan menonjolkan hubungan dalam keluarga kerajaan.
- source_word: אָחוֹת יָפָה
  choice: seorang saudara perempuan yang cantik
  rationale: '''Saudara perempuan'' menerjemahkan אָחוֹת secara jelas, sedangkan יָפָה menunjuk pada kecantikan. ''Seorang'' diperlukan secara alami dalam konstruksi Indonesia ini.'
- source_word: וּשְׁמָהּ תָּמָר
  choice: bernama Tamar
  rationale: Ungkapan ringkas 'bernama Tamar' menyampaikan klausa penamaan Ibrani secara tepat dan alami.
- source_word: וַיֶּאֱהָבֶהָ
  choice: mencintainya
  rationale: אהב adalah verba umum untuk 'mencintai'. Meskipun kelanjutan kisah memperlihatkan hasrat Amnon yang rusak, pilihan ini mempertahankan istilah sumber dan ketegangan naratifnya.
- source_word: אַמְנוֹן בֶּן דָּוִד
  choice: Amnon, anak Daud
  rationale: Sebutan patronimik dipertahankan untuk mencerminkan pengulangan sumber dan menegaskan kaitan keluarga kerajaan.
theological_decisions:
- issue: Pemaknaan אהב dalam kisah yang bermuatan moral
  choice: mencintainya
  alternative: menginginkannya / tergila-gila kepadanya
  rationale: Ayat ini memakai kata Ibrani biasa untuk kasih atau cinta tanpa penjelas moral. Teks utama tidak mendahului penilaian yang baru menjadi jelas dalam narasi berikutnya; alternatif penafsiran dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Kalimat dibagi menjadi dua agar hubungan antartokoh mudah dipahami, sementara pengulangan 'anak Daud' tetap dipertahankan. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskan.
