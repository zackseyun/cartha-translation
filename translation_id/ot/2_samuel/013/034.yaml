    rationale: Teks Ibrani menyatakan secara berurutan bahwa penjaga itu mengangkat matanya, melihat, lalu 'lihatlah' ada banyak orang. Terjemahan revisi mempertahankan urutan dan daya penanda perhatian tanpa membuatnya kaku.
  - severity: low
    issue: '"melalui jalan" kurang menangkap nilai מִדֶּרֶךְ.'
    rationale: Preposisi מִן lebih dekat dengan 'dari' atau 'dari arah'. Karena sintaks spasialnya padat dan anteseden akhiran '-nya' tidak pasti, catatan kaki tetap diperlukan.
