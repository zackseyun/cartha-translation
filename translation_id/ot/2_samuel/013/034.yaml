  yaml_path: translation/ot/2_samuel/013/034.yaml
  text: But Absalom fled[a]. And the young man who was watching lifted up his eyes and saw, and behold, many people were coming by the road behind him[c][b], from the side of the mountain.
translation:
  language: id
  text: 'Namun Absalom melarikan diri. Lalu orang muda yang berjaga itu mengangkat pandangannya dan melihat: tampak banyak orang sedang datang dari arah jalan di belakangnya, dari sisi gunung.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani tentang arah kedatangan mereka padat, dan hubungan ruangnya tidak sepenuhnya jelas. Dapat juga diterjemahkan, “dari jalan di belakangnya, dari lereng gunung.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Kata kerja ברח menyatakan tindakan lari untuk menyelamatkan diri; bentuk ini alami dalam narasi Indonesia dan mempertahankan daya naratifnya.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַנַּעַר הַצֹּפֶה
  choice: orang muda yang berjaga itu
  rationale: 'Terjemahan ini mempertahankan kedua unsur frasa: נַעַר sebagai orang muda dan צֹפֶה sebagai orang yang sedang berjaga atau mengawasi, tanpa menetapkannya sebagai jabatan resmi.'
- source_word: וַיִּשָּׂא ... אֶת עֵינוֹ
  choice: melayangkan pandangannya
  rationale: Ungkapan Indonesia ini menyampaikan idiom Ibrani ‘mengangkat matanya’ secara alami tanpa menghasilkan kalimat yang kaku.
- source_word: וַיַּרְא וְהִנֵּה
  choice: tampaklah olehnya
  rationale: Bentuk ini menyampaikan tindakan melihat sekaligus daya penarik perhatian dari הִנֵּה dalam ragam naratif Indonesia yang bermartabat.
- source_word: עַם רַב
  choice: banyak orang
  rationale: Pilihan ini langsung menyampaikan jumlah besar tanpa menambahkan kesan kerumunan resmi yang tidak dinyatakan teks.
- source_word: הֹלְכִים
  choice: sedang datang
  rationale: Walaupun הלך secara dasar berarti pergi atau berjalan, dari sudut pandang orang yang berjaga kelompok itu sedang mendekat; ‘datang’ merupakan padanan deiktis yang alami.
- source_word: מִדֶּרֶךְ אַחֲרָיו מִצַּד הָהָר
  choice: melalui jalan di belakangnya, dari sisi gunung
  rationale: Terjemahan utama mengikuti susunan spasial teks sedekat mungkin, sementara catatan kaki mempertahankan ketidakpastian hubungan unsur-unsurnya.
