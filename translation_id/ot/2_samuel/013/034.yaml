revisions:
- from: Namun Absalom melarikan diri. Ketika orang muda yang berjaga itu melayangkan pandangannya, tampaklah olehnya banyak orang sedang datang melalui jalan di belakangnya, dari sisi gunung.[a]
  to: 'Namun Absalom melarikan diri. Lalu orang muda yang berjaga itu mengangkat pandangannya dan melihat: tampak banyak orang sedang datang dari arah jalan di belakangnya, dari sisi gunung.[a]'
  rationale: Revisi memulihkan urutan tindakan dalam teks Ibrani ('mengangkat pandangannya dan melihat') serta fungsi וְהִנֵּה melalui "tampak", menghindari subordinasi temporal yang tidak diperlukan, dan memakai "dari arah jalan" untuk lebih mencerminkan מִדֶּרֶךְ tanpa menyelesaikan ketidakjelasan spasial yang memang ada.
