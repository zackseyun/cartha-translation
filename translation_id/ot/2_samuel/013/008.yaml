translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan alur naratif yang alami. “Saudara laki-laki” dipilih alih-alih “kakak” atau “adik” agar tidak menambahkan urutan usia yang tidak dinyatakan teks. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
