base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/008.yaml
  text: So Tamar went to the house of her brother Amnon[a], while he was lying down. She took the dough, kneaded it, shaped it into cakes in his sight[b], and cooked the cakes.
translation:
  language: id
  text: Lalu Tamar pergi ke rumah Amnon, saudara laki-lakinya, ketika Amnon sedang berbaring. Ia mengambil adonan, menguleninya, membentuknya menjadi kue-kue[a] di depan mata Amnon, lalu memasak[b] kue-kue itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membentuknya menjadi kue-kue berbentuk hati.” Verba dan nomina Ibrani yang dipakai di sini jarang ditemukan dan mungkin menunjuk pada bentuk yang berkaitan dengan kata “hati”.
    reason: lexical_alternative
  - marker: b
    text: Atau “merebus”. Verba Ibrani ini dapat secara khusus berarti “merebus”, meskipun juga dapat dipakai dengan arti yang lebih umum, yaitu “memasak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ
  choice: Lalu ... pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” alami dalam bahasa Indonesia dan tidak menambahkan hubungan sebab-akibat yang lebih kuat daripada teks.
- source_word: בֵּית אַמְנוֹן
  choice: ke rumah Amnon
  rationale: Dengan verba gerak, frasa ini secara alami menyatakan tujuan kedatangan Tamar.
- source_word: אָחִיהָ
  choice: saudara laki-lakinya
  rationale: Menyatakan hubungan kekerabatan dan jenis kelamin tanpa mengasumsikan apakah Amnon lebih tua atau lebih muda, sesuatu yang tidak dinyatakan oleh kata Ibrani.
- source_word: וְהוּא שֹׁכֵב
  choice: yang sedang berbaring
  rationale: Klausa ini menggambarkan keadaan Amnon ketika Tamar datang; “berbaring” lebih dekat kepada teks daripada penafsiran “berada di tempat tidur”.
- source_word: הַבָּצֵק
  choice: adonan
  rationale: Padanan Indonesia yang lazim untuk adonan yang akan diuleni dan dimasak.
- source_word: וְתָלֹשׁ
  choice: menguleninya
  rationale: Verba לוש lazim menunjuk pada tindakan menguleni adonan; sufiks objek dinyatakan secara alami dengan “-nya”.
- source_word: וַתְּלַבֵּב
  choice: membentuknya menjadi kue
  rationale: Verba langka ini berkaitan dengan nama makanan pada klausa berikutnya. Terjemahan ini menyampaikan tindakan membentuk adonan tanpa memastikan bentuk hati yang masih tidak pasti.
- source_word: לְעֵינָיו
  choice: di depan mata Amnon
  rationale: Ungkapan ini berarti dalam pandangannya atau di tempat ia dapat melihat. Nama Amnon diulang agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: וַתְּבַשֵּׁל
  choice: memasak
  rationale: בשל dapat berarti memasak secara umum dan sering secara khusus merebus. Kata “memasak” mempertahankan cakupan yang lebih luas dalam teks utama.
- source_word: הַלְּבִבוֹת
  choice: kue-kue itu
  rationale: Nomina langka ini menunjuk pada makanan yang baru dibentuk Tamar. “Kue” mudah dipahami dan tidak mengunci etimologi atau bentuk yang tidak pasti.
