base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/019.yaml
  text: Then Tamar put ashes on her head[a], tore the robe of many colors that was on her, put her hand on her head, and went away, going and crying out.
translation:
  language: id
  text: Lalu Tamar menaruh abu di atas kepalanya dan mengoyakkan jubah panjang yang dikenakannya[a]. Ia menaruh tangannya di atas kepala, lalu berjalan pergi sambil terus berseru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah berhias” atau “jubah beraneka warna”; secara tradisional, “jubah mahaindah.” Arti ungkapan Ibraninya tidak pasti. Dalam konteks ini, ungkapan tersebut mengacu pada pakaian khas yang dikenakan putri-putri raja yang masih perawan (lihat ayat 18).
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵפֶר
  choice: abu
  rationale: Kata ini menunjuk pada abu yang dipakai sebagai tanda perkabungan; bentuk tunggal kolektif "abu" alami dalam bahasa Indonesia.
- source_word: וַתִּקַּח ... עַל רֹאשָׁהּ
  choice: menaruh abu di atas kepalanya
  rationale: Ungkapan Ibrani menggambarkan tindakan menaruh abu di kepala sebagai tanda dukacita; terjemahan ini mempertahankan tindakan konkret secara alami.
- source_word: כְתֹנֶת הַפַּסִּים
  choice: jubah panjang
  rationale: Arti tepat פַּסִּים tidak pasti. "Jubah panjang" mempertahankan salah satu kemungkinan utama—pakaian yang menjulur sampai pergelangan—tanpa memasukkan gagasan warna yang tidak dinyatakan secara pasti oleh bahasa Ibrani; catatan kaki mempertahankan alternatifnya.
- source_word: אֲשֶׁר עָלֶיהָ
  choice: yang dikenakannya
  rationale: Ini merupakan ungkapan Indonesia yang alami untuk klausa relatif yang secara harfiah berarti "yang ada padanya".
- source_word: קָרָעָה
  choice: mengoyakkan
  rationale: Pilihan ini menyampaikan tindakan merobek pakaian sebagai ungkapan dukacita dengan ragam yang bermartabat.
- source_word: וַתָּשֶׂם יָדָהּ עַל רֹאשָׁהּ
  choice: menaruh tangannya di atas kepala
  rationale: Terjemahan harfiah mempertahankan gerak tubuh yang menandakan dukacita dan kehinaan tanpa menafsirkannya secara berlebihan.
- source_word: וַתֵּלֶךְ הָלוֹךְ וְזָעָקָה
  choice: berjalan pergi sambil terus menjerit
  rationale: Bentuk infinitif absolut bersama verba berhingga memberi nuansa tindakan yang berlangsung terus. "Sambil terus" mempertahankan nuansa duratif itu secara alami.
- source_word: זָעָקָה
  choice: menjerit
  rationale: Verba ini menyatakan seruan keras. "Menjerit" mempertahankan intensitasnya tanpa menentukan isi seruan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi dua agar rangkaian tindakan mudah dipahami. Kata "terus" mempertahankan aspek duratif ungkapan Ibrani, sedangkan catatan kaki menjaga ketidakpastian leksikal כְתֹנֶת הַפַּסִּים.
