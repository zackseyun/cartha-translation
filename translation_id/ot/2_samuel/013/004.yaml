base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/004.yaml
  text: He said to him[a], “Why are you so gaunt, son of the king, morning after morning? Will you not tell me?” And Amnon said to him, “I love Tamar[b], the sister of my brother Absalom.”
translation:
  language: id
  text: Ia berkata kepadanya, “Mengapa engkau begitu kurus, hai putra raja, pagi demi pagi[a]? Tidakkah engkau mau memberitahuku?” Amnon berkata kepadanya, “Aku mencintai Tamar[b], saudara perempuan Absalom, saudaraku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap pagi”; secara lebih harfiah, “pagi demi pagi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku jatuh cinta kepada Tamar.” Bahasa Ibrani secara lebih harfiah berbunyi, “Aku mencintai Tamar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini secara langsung menanyakan sebab; “Mengapa” alami dan tepat dalam bahasa Indonesia modern.
- source_word: כָּכָה דַּל
  choice: tampak begitu lesu
  rationale: דַּל di sini menggambarkan keadaan fisik yang merosot atau lemah, bukan kemiskinan. “Tampak begitu lesu” menyampaikan kondisi yang terlihat tanpa menambahkan bahwa keadaannya pasti makin parah dari hari ke hari.
- source_word: בֶּן הַמֶּלֶךְ
  choice: hai putra raja
  rationale: Mempertahankan sapaan harfiah dan daya retoris ungkapan Ibrani; “hai” memperjelas fungsi vokatifnya secara wajar.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: pagi demi pagi
  rationale: Pengulangan kata “pagi” menyatakan kejadian berulang. “Pagi demi pagi” mempertahankan bentuk dan nuansa itu dengan bahasa Indonesia yang alami.
- source_word: הֲלוֹא תַּגִּיד לִי
  choice: Tidakkah engkau mau memberitahuku?
  rationale: הֲלוֹא membentuk pertanyaan yang mengharapkan tanggapan positif dan bernada mendesak; rumusan ini mempertahankan dorongan tersebut.
- source_word: אֲחוֹת אַבְשָׁלֹם אָחִי
  choice: saudara perempuan Absalom, saudaraku
  rationale: Mempertahankan susunan relasional dan aposisi Ibrani, yakni bahwa Tamar adalah saudara perempuan Absalom dan Absalom disebut sebagai saudara Amnon.
- source_word: אֲנִי אֹהֵב
  choice: Aku mencintai
  rationale: אָהֵב adalah verba umum untuk mengasihi atau mencintai. Terjemahan ini tidak memasukkan penilaian moral atau penafsiran psikologis yang baru menjadi jelas dari konteks kisah selanjutnya.
theological_decisions:
- issue: Cara menerjemahkan pernyataan Amnon tentang Tamar
  choice: Aku mencintai Tamar
  alternative: Aku jatuh cinta kepada Tamar; Aku menginginkan Tamar
  rationale: Teks memakai verba umum אָהֵב, “mengasihi/mencintai.” Terjemahan utama mempertahankan pernyataan itu apa adanya, sedangkan “menginginkan” akan menafsirkan motif Amnon berdasarkan perkembangan narasi dan bukan hanya berdasarkan klausa ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti “engkau” dan “aku” mempertahankan percakapan langsung yang akrab tanpa menjadi kasar. Susunan “saudara perempuan Absalom, saudaraku” sengaja mempertahankan penekanan relasional teks Ibrani.
