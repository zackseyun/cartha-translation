  text: וַ/יֹּ֤אמֶר ל/וֹ֙ יְה֣וֹנָדָ֔ב שְׁכַ֥ב עַל מִשְׁכָּבְ/ךָ֖ וְ/הִתְחָ֑ל וּ/בָ֧א אָבִ֣י/ךָ לִ/רְאוֹתֶ֗/ךָ וְ/אָמַרְתָּ֣ אֵלָ֡י/ו תָּ֣בֹא נָא֩ תָמָ֨ר אֲחוֹתִ֜/י וְ/תַבְרֵ֣/נִי לֶ֗חֶם וְ/עָשְׂתָ֤ה לְ/עֵינַ/י֙ אֶת הַ/בִּרְיָ֔ה לְמַ֨עַן֙ אֲשֶׁ֣ר אֶרְאֶ֔ה וְ/אָכַלְתִּ֖י מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/005.yaml
  text: Jehonadab said to him[a], “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let Tamar my sister come and give me food, and let her prepare the meal in my sight[c][b], so that I may watch and eat from her hand.’”
translation:
  language: id
  text: Yonadab berkata kepadanya, “Berbaringlah di tempat tidurmu dan berpura-puralah sakit.[a] Ketika ayahmu datang menjengukmu, katakan kepadanya, ‘Izinkanlah Tamar, saudariku, datang dan memberiku makanan,[b] serta menyiapkan hidangan[c] di depan mataku, supaya aku dapat melihatnya dan makan dari tangannya.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpura-pura menderita sakit.” Kata kerja Ibrani di sini berarti membuat diri tampak sakit.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “roti”; dalam bahasa Ibrani kata ini juga dapat berarti makanan secara umum.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini tampaknya menunjuk pada makanan yang disiapkan khusus bagi orang sakit atau orang yang sedang memulihkan diri.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁכַב עַל מִשְׁכָּבְךָ
  choice: Berbaringlah di tempat tidurmu
  rationale: Ungkapan ini secara alami menunjuk pada tindakan berbaring di tempat tidur; terjemahan ini langsung dan wajar dalam bahasa Indonesia modern.
- source_word: וְהִתְחָל
  choice: berpura-puralah sakit
  rationale: Bentuk hitpael dalam konteks siasat Yonadab menyatakan bahwa Amnon harus menampilkan diri seolah-olah sakit, bukan sungguh-sungguh membuat dirinya jatuh sakit.
- source_word: וּבָא אָבִיךָ לִרְאוֹתֶךָ
  choice: Ketika ayahmu datang menjengukmu
  rationale: Rangkaian instruksi paling alami dinyatakan dengan anak kalimat waktu. 'Menjenguk' sesuai dengan konteks seorang ayah yang datang melihat anaknya yang tampak sakit.
- source_word: תָּבֹא נָא
  choice: Izinkanlah ... datang
  rationale: Partikel נָא memberi nuansa permohonan sopan, sedangkan permintaan kepada sang ayah menyangkut izin agar Tamar datang.
- source_word: תָמָר אֲחוֹתִי
  choice: Tamar, saudariku
  rationale: '''Saudariku'' mempertahankan hubungan yang dinyatakan teks tanpa menambahkan urutan usia yang tidak disebutkan oleh bahasa Ibrani.'
- source_word: וְתַבְרֵנִי לֶחֶם
  choice: memberiku makanan
  rationale: Kata kerja ברה di sini berhubungan dengan pemberian makanan atau pemulihan tenaga melalui makanan. Pilihan ini juga membedakannya dari עשה, 'menyiapkan/membuat', yang muncul sesudahnya.
- source_word: וְעָשְׂתָה לְעֵינַי אֶת הַבִּרְיָה
  choice: serta menyiapkan hidangan di depan mataku
  rationale: Terjemahan ini mempertahankan tindakan menyiapkan makanan dan unsur penglihatan dalam לְעֵינַי. 'Hidangan' cocok untuk makanan yang disiapkan bagi orang sakit tanpa terlalu mempersempit maknanya.
- source_word: לְמַעַן אֲשֶׁר אֶרְאֶה
  choice: supaya aku dapat melihatnya
  rationale: Bahasa Ibrani secara harfiah menyatakan 'supaya aku dapat melihat' tanpa objek tersurat. Akhiran '-nya' diperlukan untuk kelancaran bahasa Indonesia dan secara kontekstual merujuk pada penyiapan hidangan atau hidangan itu, tanpa menentukan lebih jauh.
- source_word: וְאָכַלְתִּי מִיָּדָהּ
  choice: dan makan dari tangannya
  rationale: Ungkapan ini mempertahankan unsur penting bahwa Amnon hendak menerima dan memakan makanan itu langsung dari tangan Tamar.
