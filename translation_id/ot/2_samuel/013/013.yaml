id: 2SA.13.13
reference: 2 Samuel 13:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֗י אָ֤נָה אוֹלִיךְ֙ אֶת חֶרְפָּתִ֔/י וְ/אַתָּ֗ה תִּהְיֶ֛ה כְּ/אַחַ֥ד הַ/נְּבָלִ֖ים בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּה֙ דַּבֶּר נָ֣א אֶל הַ/מֶּ֔לֶךְ כִּ֛י לֹ֥א יִמְנָעֵ֖/נִי מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/013.yaml
  text: As for me[a], where could I carry my disgrace? And you—you would be like one of the fools in Israel. So now, please speak to the king[c][b], for he will not withhold me from you.
translation:
  language: id
  text: Dan aku, ke manakah dapat kubawa aibku ini?[a] Dan engkau akan menjadi seperti salah seorang dari orang-orang bejat[b] di Israel. Jadi sekarang, tolong berbicaralah kepada raja,[c] sebab ia tidak akan menolak memberikanku kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kehinaanku” atau “cela yang kutanggung.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti salah seorang dari orang-orang bodoh.” Dalam konteks ini, kata Ibrani נְבָלִים menunjuk pada orang yang tidak tahu malu atau bobrok secara moral, bukan terutama pada orang yang kurang cerdas.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, “ia tidak akan menolak memberikan aku kepadamu.” Perkataan Tamar mungkin merupakan permohonan yang sungguh-sungguh atau upaya putus asa untuk menunda Amnon.
    reason: alternative_reading
lexical_decisions:
- source_word: אָנָה
  choice: ke mana
  rationale: Kata tanya ini berkaitan dengan verba gerak berikutnya dan membentuk pertanyaan retoris tentang ke mana Tamar dapat membawa atau menyingkirkan aibnya.
- source_word: אוֹלִיךְ
  choice: harus kubawa
  rationale: Bentuk kausatif dari הלך mempertahankan metafora gerak, yakni membawa aib yang akan terus melekat padanya; 'harus' menyampaikan kebuntuan dalam pertanyaan retoris secara alami.
- source_word: חֶרְפָּתִי
  choice: aibku ini
  rationale: חֶרְפָּה menunjuk pada kehinaan atau cela sosial di hadapan orang lain. 'Aib' ringkas, alami, dan kuat dalam bahasa Indonesia.
- source_word: כְּאַחַד הַנְּבָלִים
  choice: seperti salah seorang yang bejat
  rationale: נָבָל dalam konteks ini terutama menyatakan kebobrokan moral dan tindakan memalukan, bukan sekadar kekurangan intelektual. 'Orang bejat' menangkap kecaman etis tersebut.
- source_word: דַּבֶּר נָא
  choice: tolong bicaralah
  rationale: Imperatif dengan partikel permohonan נָא diterjemahkan sebagai permintaan mendesak namun tetap wajar dalam bahasa Indonesia modern.
- source_word: יִמְנָעֵנִי מִמֶּךָּ
  choice: ia tidak akan menahan aku darimu
  rationale: Terjemahan ini mempertahankan citra dan susunan idiom Ibrani tanpa secara eksplisit menambahkan gagasan pemberian dalam perkawinan.
theological_decisions:
- issue: Maksud permohonan Tamar kepada raja
  choice: Ucapan Tamar diterjemahkan secara langsung tanpa memastikan apakah usul itu sungguh dapat diwujudkan atau hanya siasat untuk menunda serangan Amnon.
  alternative: Menerjemahkannya secara eksplisit sebagai keyakinan bahwa Daud akan memberikan Tamar kepada Amnon untuk dinikahi, atau sebagai dalih Tamar semata-mata.
  rationale: Ayat ini tidak menerangkan apakah permohonan tersebut sah secara hukum, realistis secara politik, atau bersifat taktis. Ambiguitas naratif perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada mendesak dan bermartabat. Metafora membawa aib dan ungkapan menahan seseorang dipertahankan, sementara 'bejat' dipilih agar bobot moral נָבָל jelas bagi pembaca umum.
