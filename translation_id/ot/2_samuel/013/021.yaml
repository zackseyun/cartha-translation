  text: וְ/הַ/מֶּ֣לֶךְ דָּוִ֔ד שָׁמַ֕ע אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יִּ֥חַר ל֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/021.yaml
  text: When King David heard all these things[a], he was very angry.
translation:
  language: id
  text: Ketika Raja Daud mendengar semua hal itu, ia menjadi sangat marah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Lalu Raja Daud mendengar semua perkara itu, dan hal itu sangat menyala baginya,” maksudnya, “amarahnya berkobar hebat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/מֶּלֶךְ
  choice: Ketika Raja
  rationale: Dalam alur narasi, וְ menghubungkan tindakan ini dengan peristiwa sebelumnya dan secara alami dapat diungkapkan sebagai hubungan waktu dalam bahasa Indonesia. מֶלֶךְ dengan kata sandang diterjemahkan 'Raja' sebagai gelar Daud.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: שָׁמַע
  choice: mendengar
  rationale: Makna dasarnya adalah 'mendengar'; dalam konteks ini Daud menerima kabar mengenai kejadian tersebut.
- source_word: אֵת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung dalam bahasa Ibrani yang tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: כָּל הַ/דְּבָרִים הָ/אֵלֶּה
  choice: semua hal itu
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal-hal. Di sini frasa tersebut menunjuk pada seluruh kejadian yang baru diceritakan; 'semua hal itu' alami dan tetap cukup luas.
- source_word: וַ/יִּחַר ל֖/וֹ
  choice: ia menjadi marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan sesuatu yang 'menyala' padanya dan secara idiomatis menyatakan timbulnya kemarahan. 'Menjadi marah' menyampaikan perubahan keadaan yang tersirat tanpa menambahkan kata 'amarah' sebagai subjek yang tidak dinyatakan secara eksplisit.
- source_word: מְאֹד
  choice: sangat
  rationale: Kata keterangan penguat yang lazim dan alami dalam bahasa Indonesia modern.
