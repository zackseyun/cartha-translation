  yaml_path: translation/ot/2_samuel/013/016.yaml
  text: But she said to him[a], “No, because this great wrong of sending me away is greater than the other that you did to me.” But he would not listen to her.
translation:
  language: id
  text: Tetapi perempuan itu berkata kepadanya[a], “Jangan! Kejahatan besar ini—mengusir aku—lebih besar daripada kejahatan lain yang telah kauperbuat terhadapku.” Namun, Amnon tidak mau mendengarkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Jangan, karena kejahatan besar ini—mengusir aku—lebih besar daripada kejahatan lain yang telah kauperbuat terhadapku.” Bahasa Ibraninya padat dan sulit, sehingga hubungan tepat antara “Jangan” dan kalimat berikutnya tidak sepenuhnya pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: Jangan!
  rationale: Partikel ini lazim menyatakan larangan. Dalam ujaran eliptis Tamar, bentuk “Jangan!” mempertahankan daya protesnya dan kemungkinan bahwa kata ini membuka larangan yang sintaksisnya terdesak.
- source_word: אוֹדֹת
  choice: Sebab
  rationale: Dalam susunan Ibrani yang padat dan sulit, kata ini memperkenalkan alasan atau perkara yang menjadi dasar keberatan Tamar; “Sebab” menghasilkan hubungan yang wajar dalam bahasa Indonesia.
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: kejahatan besar
  rationale: רָעָה di sini menunjuk pada perbuatan yang jahat secara moral dan merugikan. “Kejahatan besar” mempertahankan unsur גְּדוֹלָה secara eksplisit.
- source_word: מֵאַחֶרֶת אֲשֶׁר עָשִׂיתָ עִמִּי
  choice: lebih buruk daripada kejahatan lain yang telah kauperbuat terhadapku
  rationale: אַחֶרֶת berbentuk feminin tunggal dan mengacu pada kejahatan lain yang tersirat. Ungkapan komparatifnya dipertahankan tanpa menentukan lebih jauh daripada teks sumber.
- source_word: לְשַׁלְּחֵנִי
  choice: mengusir aku
  rationale: Kata kerja שׁלח dalam konteks ini berarti menyuruh pergi atau mengusir. Infinitif dengan sufiks orang pertama diperlakukan sebagai tindakan yang sedang dipersoalkan.
- source_word: וְלֹא אָבָה לִשְׁמֹעַ לָהּ
  choice: Namun, Amnon tidak mau mendengarkannya
  rationale: אָבָה menyatakan kemauan atau penolakan; “tidak mau” mempertahankan unsur kehendak. Nama Amnon dipakai untuk memperjelas subjek dalam bahasa Indonesia, yang tidak memiliki pembedaan gender pada pronomina orang ketiga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ucapan Tamar mempertahankan nada protes yang mendesak. “Kejahatan” dipilih untuk menjaga bobot moral רָעָה, sedangkan “lebih buruk” merupakan ungkapan komparatif yang lebih alami dalam konteks penilaian moral. Penambahan nama Amnon hanya memperjelas rujukan pronominal, bukan menambah pelaku baru.
