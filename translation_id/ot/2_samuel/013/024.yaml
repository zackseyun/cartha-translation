  text: Then Absalom came to the king and said, “Look, your servant has shearers. Please let the king and his servants go with your servant.”
translation:
  language: id
  text: Lalu Absalom datang menghadap raja dan berkata, “Lihatlah, hambamu sedang mengadakan pencukuran bulu domba. Kiranya raja dan para pegawainya datang bersama hambamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה־נָא
  choice: Tuanku
  rationale: Dalam konteks permohonan kepada raja, rangkaian ini membuka ujaran dengan sopan dan menarik perhatian. Sapaan “Tuanku” menyampaikan sikap hormat secara alami tanpa menerjemahkan partikel secara kaku sebagai “lihatlah kiranya”.
- source_word: גֹזְזִים
  choice: sedang mengadakan pengguntingan bulu domba
  rationale: Bentuk partisip jamak secara harfiah menunjuk para penggunting, tetapi dalam konteks budaya ini menyatakan berlangsungnya kegiatan pengguntingan bulu domba di tempat Absalom. Kata “domba” dibuat eksplisit agar maknanya jelas dalam bahasa Indonesia.
- source_word: עַבְדֶּךָ
  choice: hambamu
  rationale: Mempertahankan sebutan diri penuh hormat yang dipakai Absalom ketika berbicara kepada raja.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Yang dimaksud ialah orang-orang yang melayani dan mendampingi raja; “pegawai” membedakannya dari sebutan diri seremonial Absalom sebagai “hambamu” dan terdengar wajar dalam konteks istana.
- source_word: יֵלֶךְ־נָא
  choice: Kiranya ... datang
  rationale: Partikel נָא menandai permohonan sopan. Karena tujuannya adalah tempat Absalom, verba gerak paling alami diterjemahkan “datang” dari sudut pandang pengundang.
