  text: וַ/תֹּ֣אמֶר ל֗/וֹ אַל אָחִ/י֙ אַל תְּעַנֵּ֔/נִי כִּ֛י לֹא יֵֽעָשֶׂ֥ה כֵ֖ן בְּ/יִשְׂרָאֵ֑ל אַֽל תַּעֲשֵׂ֖ה אֶת הַ/נְּבָלָ֥ה הַ/זֹּֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/012.yaml
  text: She said to him[a], “No, my brother, do not violate me, for such a thing is not done in Israel[b]. Do not do this disgraceful thing.”
translation:
  language: id
  text: Ia berkata kepadanya, “Jangan, saudaraku! Jangan nodai aku[a], sebab hal seperti itu tidak dilakukan di Israel. Jangan lakukan perbuatan keji ini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “jangan permalukan aku” atau, sesuai konteksnya, “jangan perkosa aku.” Kata kerja Ibrani ini dapat mencakup pelanggaran seksual sekaligus penghinaan dan aib.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tindakan yang memalukan ini” atau “perbuatan yang keterlaluan ini.” Istilah Ibraninya menunjuk pada tindakan yang secara moral sangat tercela, bukan sekadar tindakan bodoh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר לוֹ
  choice: Ia berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Bahasa Indonesia tidak memerlukan kata penghubung eksplisit di sini.
- source_word: אַל אָחִי
  choice: Jangan, saudaraku!
  rationale: אַל pertama merupakan seruan penolakan mendesak, sedangkan אָחִי menyatakan hubungan keluarga yang penting bagi konteks. “Saudaraku” mempertahankan makna tanpa menentukan apakah yang dimaksud kakak atau adik.
- source_word: אַל תְּעַנֵּנִי
  choice: Jangan nodai aku
  rationale: Dalam konteks kekerasan seksual, bentuk Piel dari ענה mencakup gagasan pelanggaran seksual sekaligus penghinaan. “Nodai” mempertahankan kedua nuansa itu tanpa mempersempitnya hanya menjadi satu aspek.
- source_word: כִּי לֹא יֵעָשֶׂה כֵן בְּיִשְׂרָאֵל
  choice: sebab hal seperti itu tidak dilakukan di Israel
  rationale: 'Bentuk Nifal impersonal menyatakan norma moral bersama: tindakan demikian bukan sesuatu yang dilakukan di tengah Israel.'
- source_word: אַל תַּעֲשֵׂה אֶת הַנְּבָלָה הַזֹּאת
  choice: Jangan lakukan perbuatan keji ini
  rationale: נְבָלָה menunjuk pada tindakan yang secara moral memalukan dan sangat keterlaluan, bukan sekadar kebodohan. “Perbuatan keji” menyampaikan bobot moral tersebut dalam bahasa Indonesia masa kini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Seruan Tamar dibuat mendesak tanpa menambahkan unsur kesopanan yang tidak dinyatakan dalam teks. Pilihan “saudaraku” menjaga hubungan kekerabatan tanpa menambahkan urutan usia; “nodai” mempertahankan ketegangan antara kekerasan seksual dan penghinaan yang terkandung dalam verba Ibrani.
