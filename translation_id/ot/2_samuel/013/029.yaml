revisions:
- from: Maka orang-orang muda Absalom melakukan terhadap Amnon seperti yang diperintahkan Absalom.[a] Lalu semua anak laki-laki raja bangkit, masing-masing menaiki bagalnya, dan melarikan diri.
  to: Maka para pemuda Absalom memperlakukan Amnon seperti yang diperintahkan Absalom.[a] Lalu semua putra raja berdiri, masing-masing menaiki bagalnya, lalu melarikan diri.
  rationale: Revisi memperbaiki idiom bahasa Indonesia tanpa menambahkan tindakan ke dalam teks utama. Kata "memperlakukan" menyampaikan tindakan terhadap Amnon secara tersirat, sebagaimana Ibrani, sedangkan catatan kaki memberi konteks dari ayat sebelumnya dengan lebih tepat. "Para pemuda" mempertahankan keluasan makna נער, dan "putra raja" lebih langsung serta alami dalam register naratif baku.
