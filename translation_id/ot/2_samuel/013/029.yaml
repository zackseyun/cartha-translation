base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/029.yaml
  text: So Absalom’s young men did to Amnon as Absalom had commanded[a]. Then all the king’s sons arose[b], and each mounted his mule and fled.
translation:
  language: id
  text: Maka para pemuda Absalom memperlakukan Amnon seperti yang diperintahkan Absalom.[a] Lalu semua putra raja berdiri, masing-masing menaiki bagalnya, lalu melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “memperlakukan Amnon seperti yang diperintahkan Absalom.” Ayat sebelumnya menyatakan perintah itu: ketika hati Amnon gembira karena anggur, mereka harus memukulnya lalu membunuhnya. “Para pemuda” juga dapat diterjemahkan “para pelayan” atau “para pengiring” Absalom.'
    reason: cross_reference; lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי אַבְשָׁלוֹם
  choice: orang-orang muda Absalom
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pengiring. Pilihan ini mempertahankan bentuk leksikal Ibrani tanpa memastikan status rumah tangga mereka; dalam konteks, mereka bertindak sebagai orang-orang suruhan Absalom.
- source_word: וַיַּעֲשׂוּ לְאַמְנוֹן
  choice: melakukan terhadap Amnon
  rationale: Ungkapan עשה dengan ל menyatakan tindakan yang dilakukan terhadap Amnon. Terjemahan ini mempertahankan keringkasan teks dan membiarkan perintah eksplisit pada ayat sebelumnya menjelaskan tindakan kekerasan tersebut.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: seperti yang diperintahkan
  rationale: Klausa ini menyatakan bahwa tindakan mereka sesuai dengan perintah Absalom sebelumnya.
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Mencerminkan tindakan segera para anak raja dengan ragam naratif yang wajar dan bermartabat.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: semua anak laki-laki raja
  rationale: בָּנִים dalam konteks ini secara khusus menunjuk kepada putra-putra Raja Daud; 'anak laki-laki' jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיִּרְכְּבוּ אִישׁ עַל פִּרְדּוֹ
  choice: masing-masing menaiki bagalnya
  rationale: אִישׁ dipakai secara distributif, 'masing-masing', sedangkan פֶּרֶד berarti bagal. Susunan ini ringkas dan alami.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: נוּס menyatakan pelarian mendesak dari bahaya; 'melarikan diri' merupakan padanan Indonesia yang jelas dan tepat.
