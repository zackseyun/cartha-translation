source:
  edition: WLC
  text: וּ/לְ/אַמְנ֣וֹן רֵ֗עַ וּ/שְׁמ/וֹ֙ יֽוֹנָדָ֔ב בֶּן שִׁמְעָ֖ה אֲחִ֣י דָוִ֑ד וְ/י֣וֹנָדָ֔ב אִ֥ישׁ חָכָ֖ם מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/003.yaml
  text: Amnon had a friend[a], whose name was Jonadab son of Shimeah, David’s brother; and Jonadab was a very shrewd man.
translation:
  language: id
  text: Amnon mempunyai seorang sahabat bernama Yonadab, anak Simea, yang adalah saudara Daud. Yonadab adalah orang yang sangat cerdik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sangat bijaksana” atau “sangat pandai.” Kata Ibrani yang digunakan dapat menunjuk pada hikmat atau kecakapan secara luas; “cerdik” dipilih karena dalam kelanjutan kisah, kecakapan Yonadab tampak melalui nasihat yang secara moral buruk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַמְנוֹן רֵעַ
  choice: Amnon mempunyai seorang sahabat
  rationale: Ungkapan Ibrani dengan לְ menyatakan kepunyaan atau keadaan; dalam bahasa Indonesia paling alami diungkapkan dengan 'mempunyai'. רֵעַ berarti sahabat, teman, atau rekan; 'sahabat' sesuai dengan relasi pribadi yang diperkenalkan dalam narasi.
- source_word: וּשְׁמוֹ יוֹנָדָב
  choice: bernama Yonadab
  rationale: Rumus penamaan Ibrani harfiah 'dan namanya Yonadab' dialihkan secara alami dan ringkas menjadi 'bernama Yonadab' tanpa kehilangan informasi.
- source_word: בֶּן שִׁמְעָה אֲחִי דָוִד
  choice: anak Simea, saudara Daud
  rationale: Rangkaian ini mengidentifikasi Yonadab sebagai anak Simea dan Simea sebagai saudara Daud. Tanda koma mempertahankan hubungan genealogis tersebut dengan jelas.
- source_word: אִישׁ חָכָם מְאֹד
  choice: orang yang sangat cerdik
  rationale: חָכָם dapat berarti bijaksana, pandai, atau cerdik. Konteks selanjutnya memperlihatkan kecakapan Yonadab dalam nasihat yang secara moral buruk, sehingga 'cerdik' mempertahankan kemampuan intelektual tanpa memberi penilaian moral positif yang tidak pasti. אִישׁ tidak perlu diterjemahkan 'laki-laki' karena identitas maskulin Yonadab sudah jelas dan 'orang' lebih alami dalam predikasi ini.
theological_decisions:
- issue: Nilai moral kata חָכָם dalam penggambaran Yonadab
  choice: cerdik
  alternative: bijaksana; pandai
  rationale: Teks menyatakan kecakapan luar biasa, tetapi kata itu sendiri tidak harus menyetujui moral tindakannya. 'Cerdik' menjaga ketegangan antara kemampuan dan penggunaan kemampuan tersebut dalam kelanjutan kisah.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Ibrani ditransliterasikan dalam bentuk Indonesia yang lazim: Yonadab, Simea, dan Daud. Struktur kalimat dipecah menjadi dua agar hubungan genealogis dan penilaian terhadap Yonadab mudah dipahami.'
