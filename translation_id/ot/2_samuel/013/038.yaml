  text: But Absalom fled and went to Geshur[b][a], and he was there three years.
translation:
  language: id
  text: Tetapi[a] Absalom melarikan diri dan pergi ke Gesur, lalu tinggal di sana selama tiga tahun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Absalom melarikan diri dan pergi ke Gesur.” Konjungsi Ibrani dapat diterjemahkan sebagai “dan” atau “tetapi” sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan ia berada di sana tiga tahun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְשָׁל֥וֹם
  choice: Tetapi Absalom
  rationale: Konjungsi ו dapat berarti “dan” atau, sesuai konteks naratif, “tetapi”. Di sini “tetapi” menandai peralihan yang sedikit kontras dari ayat sebelumnya tanpa mengubah alur.
- source_word: בָּרַ֖ח
  choice: melarikan diri
  rationale: Kata ברח berarti lari atau melarikan diri dari bahaya. “Melarikan diri” alami dalam bahasa Indonesia dan menyampaikan bahwa Absalom pergi untuk menyelamatkan diri.
- source_word: וַ/יֵּ֣לֶךְ
  choice: dan pergi
  rationale: Kata הלך dalam rangkaian narasi berarti “pergi”. Gabungan “melarikan diri dan pergi” mempertahankan dua verba Ibrani.
- source_word: גְּשׁ֑וּר
  choice: Gesur
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַ/יְהִי שָׁ֖ם
  choice: lalu tinggal di sana
  rationale: Secara harfiah berarti “dan ia berada di sana”, tetapi bersama keterangan waktu tiga tahun, “tinggal di sana” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: שָׁלֹ֥שׁ שָׁנִֽים
  choice: selama tiga tahun
  rationale: Preposisi “selama” membuat fungsi frasa sebagai keterangan durasi jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan mempertahankan kedua tindakan dalam teks Ibrani, sedangkan “tinggal” dan “selama” dipakai agar keterangan durasi terdengar alami.
