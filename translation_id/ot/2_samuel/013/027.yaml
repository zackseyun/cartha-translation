  text: But Absalom pressed him[a], so he sent Amnon and all the king’s sons with him.
translation:
  language: id
  text: Namun, Absalom terus mendesaknya[a], sehingga raja menyuruh Amnon dan semua putra raja pergi bersama Absalom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Absalom terus membujuknya” atau “Absalom berhasil mendesaknya.” Ungkapan Ibrani ini lebih kuat daripada sekadar permintaan dan menunjukkan desakan yang gigih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרָץ בּוֹ
  choice: Absalom terus mendesaknya
  rationale: Ungkapan idiomatis dengan פרץ dan preposisi ב menunjukkan desakan yang kuat dan berulang, bukan arti harfiah ‘menerobos’. ‘Terus mendesaknya’ wajar dalam bahasa Indonesia dan mempertahankan daya tekan ungkapan itu.
- source_word: אַבְשָׁלוֹם
  choice: Absalom
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּשְׁלַח
  choice: raja mengutus
  rationale: Dalam konteks ini, subjeknya adalah Daud, sang raja, yang akhirnya mengabulkan permintaan dan menyuruh para putranya pergi. Penyebutan ‘raja’ memperjelas subjek yang tersirat tanpa memasukkan nama yang tidak terdapat dalam ayat.
- source_word: אִתּוֹ
  choice: pergi bersamanya
  rationale: Secara harfiah berarti ‘bersamanya’, dengan Absalom sebagai rujukan pronomina. Penambahan ‘pergi’ diperlukan agar kalimat Indonesia mengalir alami dan arah tindakan tetap jelas.
- source_word: אֶת אַמְנוֹן
  choice: Amnon
  rationale: Penanda objek langsung tidak diterjemahkan; nama diri dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאֵת כָּל בְּנֵי הַמֶּלֶךְ
  choice: dan semua anak raja
  rationale: Frasa konstruksi ini secara langsung berarti semua putra raja. ‘Anak raja’ merupakan ungkapan alami dan bermartabat dalam bahasa Indonesia; konteks memperjelas bahwa yang dimaksud adalah putra-putranya.
