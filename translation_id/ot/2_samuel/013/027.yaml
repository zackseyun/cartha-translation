translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Partikel ‘Namun’ mempertahankan pertentangan dengan penolakan pada ayat sebelumnya. Subjek ‘raja’ dibuat eksplisit untuk menghindari ketidakjelasan pergantian pelaku, sedangkan rujukan ‘bersamanya’ tetap mempertahankan bentuk pronominal teks Ibrani.
