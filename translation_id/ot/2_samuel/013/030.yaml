  text: וַֽ/יְהִי֙ הֵ֣מָּה בַ/דֶּ֔רֶךְ וְ/הַ/שְּׁמֻעָ֣ה בָ֔אָה אֶל דָּוִ֖ד לֵ/אמֹ֑ר הִכָּ֤ה אַבְשָׁלוֹם֙ אֶת כָּל בְּנֵ֣י הַ/מֶּ֔לֶךְ וְ/לֹֽא נוֹתַ֥ר מֵ/הֶ֖ם אֶחָֽד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/030.yaml
  text: While they were on the way[a], the report came to David, saying, “Absalom has struck down all the king’s sons, and not one of them is left.”
translation:
  language: id
  text: 'Ketika mereka masih dalam perjalanan, sampailah sebuah kabar[a] kepada Daud: “Absalom telah membunuh semua putra raja; tidak seorang pun dari mereka yang tersisa.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laporan” atau “desas-desus”; kata Ibrani ini dapat menunjuk pada kabar yang belum dipastikan kebenarannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵמָּה בַדֶּרֶךְ
  choice: Ketika mereka masih dalam perjalanan
  rationale: Rumus naratif וַיְהִי bersama pronomina dan frasa preposisional memberi latar waktu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keadaan yang sedang berlangsung.
- source_word: הַשְּׁמֻעָה
  choice: sebuah kabar
  rationale: שְׁמוּעָה dapat berarti kabar, laporan, atau desas-desus. Karena berita ini belum terverifikasi dan kemudian dikoreksi, “kabar” mempertahankan kenetralan dan ambiguitas leksikalnya.
- source_word: בָאָה אֶל דָּוִד
  choice: sampailah ... kepada Daud
  rationale: Menyampaikan secara alami gambaran Ibrani bahwa kabar itu datang atau mencapai Daud.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Dalam bahasa Indonesia, tanda titik dua secara alami memperkenalkan isi perkataan langsung tanpa perlu memakai bentuk kaku “dengan mengatakan”.
- source_word: הִכָּה
  choice: telah membunuh
  rationale: Dalam konteks laporan bahwa tidak seorang pun tersisa, נכה menyatakan tindakan memukul hingga mati. “Membunuh” menyampaikan maksud fatalnya secara jelas dan alami.
- source_word: כָּל בְּנֵי הַמֶּלֶךְ
  choice: semua putra raja
  rationale: “Putra” mempertahankan rujukan khusus kepada anak-anak laki-laki raja dan sesuai dengan ragam narasi yang bermartabat.
- source_word: וְלֹא נוֹתַר מֵהֶם אֶחָד
  choice: tidak seorang pun dari mereka yang tersisa
  rationale: Mencerminkan makna bentuk Niphal יתר, yaitu tetap hidup atau masih ada, dengan susunan Indonesia yang wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur temporal diperlancar tanpa menghilangkan urutan narasi, sedangkan catatan kaki mempertahankan ketidakpastian yang terkandung dalam istilah Ibrani untuk kabar tersebut.
