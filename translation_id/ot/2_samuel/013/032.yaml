translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “tuanku” mempertahankan nada hormat di lingkungan istana. Struktur kutipan langsung dipertahankan untuk membedakan laporan yang dibantah Yonadab dari ucapannya sendiri.
