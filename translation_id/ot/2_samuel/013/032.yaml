  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֡עַן יוֹנָדָ֣ב בֶּן שִׁמְעָ֨ה אֲחִֽי דָוִ֜ד וַ/יֹּ֗אמֶר אַל יֹאמַ֤ר אֲדֹנִ/י֙ אֵ֣ת כָּל הַ/נְּעָרִ֤ים בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הֵמִ֔יתוּ כִּֽי אַמְנ֥וֹן לְ/בַדּ֖/וֹ מֵ֑ת כִּֽי עַל פִּ֤י אַבְשָׁלוֹם֙ הָיְתָ֣ה שׂוּמָ֔ה מִ/יּוֹם֙ עַנֹּת֔/וֹ אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/032.yaml
  text: Then Jonadab son of Shimeah[a], David’s brother, answered and said, “Let not my lord say, ‘They have killed all the young men, the king’s sons,’ for Amnon alone is dead[b]. For this had been determined by Absalom from the day he violated Tamar his sister.”
translation:
  language: id
  text: Lalu Yonadab, anak Simea, saudara laki-laki Daud, menjawab dan berkata, “Janganlah tuanku berkata, ‘Mereka telah membunuh semua pemuda, yaitu anak-anak raja,’ sebab hanya Amnon yang mati. Hal ini telah ditetapkan oleh Absalom[a] sejak hari Amnon memperkosa[b] Tamar, saudara perempuannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga diterjemahkan, “telah ditetapkan menurut perkataan (atau perintah) Absalom,” yakni sesuai dengan tekad Absalom yang sudah bulat.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani dapat juga diterjemahkan “merendahkan” atau “mempermalukan”; dalam konteks ini yang dimaksud adalah pemerkosaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab dan berkata
  rationale: Mempertahankan bentuk ganda khas narasi Ibrani dengan bahasa Indonesia formal yang tetap mudah dipahami.
- source_word: אֲחִי דָוִד
  choice: saudara laki-laki Daud
  rationale: Menunjukkan bahwa Simea, bukan Yonadab, adalah saudara Daud, serta menyatakan jenis kelamin yang tersirat oleh bentuk Ibrani.
- source_word: אַל יֹאמַר אֲדֹנִי
  choice: Janganlah tuanku berkata
  rationale: Menyampaikan larangan halus sekaligus sapaan hormat kepada raja.
- source_word: הַנְּעָרִים בְּנֵי הַמֶּלֶךְ
  choice: semua pemuda, yaitu anak-anak raja
  rationale: Kata נְעָרִים menunjuk kepada para pemuda; frasa berikutnya menjelaskan identitas mereka sebagai anak-anak raja.
- source_word: אַמְנוֹן לְבַדּוֹ מֵת
  choice: hanya Amnon yang mati
  rationale: Menyampaikan penekanan eksklusif לְבַדּוֹ secara alami dalam bahasa Indonesia.
- source_word: עַל פִּי אַבְשָׁלוֹם הָיְתָה שׂוּמָה
  choice: Hal ini telah ditetapkan oleh Absalom
  rationale: Menyampaikan suatu keputusan atau niat yang sudah tetap, sambil mempertahankan Absalom sebagai sumbernya; nuansa 'perkataan/perintah' dicatat dalam catatan kaki.
- source_word: מִיּוֹם עַנֹּתוֹ אֵת תָּמָר
  choice: sejak hari Amnon memperkosa Tamar
  rationale: Dalam konteks 2 Samuel 13, bentuk Piel ענה merujuk pada kekerasan seksual terhadap Tamar. Nama Amnon dinyatakan agar subjek tindakan tidak disalahpahami sebagai Absalom.
- source_word: אֲחֹתוֹ
  choice: saudara perempuannya
  rationale: Terjemahan langsung bentuk posesif Ibrani; Tamar adalah saudara perempuan Amnon dan Absalom dalam hubungan keluarga yang diceritakan pasal ini.
