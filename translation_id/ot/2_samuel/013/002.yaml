base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/002.yaml
  text: Amnon was so distressed that he made himself sick because of Tamar his sister[a], for she was a virgin[b], and it seemed impossible in Amnon’s eyes to do anything to her.
translation:
  language: id
  text: Amnon begitu tertekan karena Tamar, saudara perempuannya, sehingga ia jatuh sakit[a]. Sebab Tamar adalah seorang perawan, dan Amnon menganggap mustahil untuk melakukan apa pun terhadapnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini dapat dipahami sebagai “menjadi sakit” atau, secara refleksif, “membuat dirinya sendiri sakit.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang secara harfiah berbunyi, “hal itu terlalu menakjubkan/sulit dalam pandangan Amnon,” adalah idiom yang berarti bahwa Amnon tidak melihat cara yang memungkinkan untuk bertindak terhadap Tamar.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֶר
  choice: begitu tertekan
  rationale: Bentuk dari יצר dalam konteks ini menggambarkan tekanan atau kesesakan batin yang dialami Amnon; ungkapan ini alami dalam bahasa Indonesia dan menghubungkannya dengan akibat berupa sakit.
- source_word: לְהִתְחַלּוֹת
  choice: hingga jatuh sakit
  rationale: Hitpael dari חלה dapat dipahami sebagai menjadi sakit atau membuat diri sendiri sakit. Terjemahan utama menyatakan hasil tanpa memastikan bahwa Amnon sengaja membuat dirinya sakit; kemungkinan refleksif dicatat dalam catatan kaki.
- source_word: בַּעֲבוּר
  choice: karena
  rationale: Dalam konteks ini preposisi tersebut menyatakan sebab, bukan tujuan atau manfaat.
- source_word: אֲחֹתוֹ
  choice: saudarinya
  rationale: Istilah kekerabatan ini dipertahankan karena hubungan mereka sangat penting bagi makna dan kengerian moral kisah tersebut.
- source_word: בְתוּלָה
  choice: masih perawan
  rationale: בתולה secara langsung menunjuk pada seorang perempuan yang perawan. Kata 'masih' menghasilkan ungkapan Indonesia yang wajar tanpa menambahkan status perkawinan yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּפָּלֵא בְּעֵינֵי אַמְנוֹן
  choice: Amnon merasa mustahil
  rationale: Idiom Ibrani ini menyatakan bahwa dari sudut pandang Amnon tindakan tersebut berada di luar kemungkinan atau terlalu sulit dilakukan. Terjemahan ini menyampaikan perspektifnya dengan bahasa Indonesia alami.
- source_word: לַעֲשׂוֹת לָהּ מְאוּמָה
  choice: melakukan apa pun terhadapnya
  rationale: Frasa ini secara harfiah berarti melakukan sesuatu atau apa pun kepadanya. 'Terhadapnya' mempertahankan ketidakjelasan tindakan yang dimaksud tanpa mendahului kejahatan yang kemudian terjadi.
