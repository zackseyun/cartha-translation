  text: וַ/תִּקַּ֤ח אֶת הַ/מַּשְׂרֵת֙ וַ/תִּצֹ֣ק לְ/פָנָ֔י/ו וַ/יְמָאֵ֖ן לֶ/אֱכ֑וֹל וַ/יֹּ֣אמֶר אַמְנ֗וֹן הוֹצִ֤יאוּ כָל אִישׁ֙ מֵֽ/עָלַ֔/י וַ/יֵּצְא֥וּ כָל אִ֖ישׁ מֵ/עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/009.yaml
  text: Then she took the pan and poured them out before him[a], but he refused to eat. And Amnon said[b], “Send everyone out from me.” So everyone went out from him.
translation:
  language: id
  text: Kemudian ia mengambil wadah itu dan menuangkan isinya di hadapan Amnon.[a] Namun, Amnon menolak makan. Lalu Amnon berkata, “Suruh semua orang[b] pergi dari hadapanku!” Maka semua orang pun pergi dari hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyajikan isinya di hadapan Amnon.” Kata kerja Ibraninya secara harfiah berarti “menuangkan,” tetapi di sini dipakai dalam konteks menghidangkan makanan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “setiap laki-laki”; dalam konteks ini maksudnya semua orang yang hadir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂרֵת
  choice: wadah itu
  rationale: Kata ini menunjuk pada wadah untuk memasak atau menyajikan makanan. “Wadah” mempertahankan keluasan maknanya dan terdengar alami dalam bahasa Indonesia.
- source_word: וַתִּצֹק לְפָנָיו
  choice: menuangkan isinya di hadapan Amnon
  rationale: Kata kerja יצק secara konkret berarti “menuangkan.” Penyebutan “isinya” membuat objek yang tersirat dapat dipahami dalam bahasa Indonesia tanpa mengubah tindakan sumber.
- source_word: וַיְמָאֵן לֶאֱכוֹל
  choice: Amnon menolak makan
  rationale: מָאֵן menyatakan penolakan yang disengaja, bukan sekadar tidak berselera.
- source_word: הוֹצִיאוּ
  choice: Suruh ... pergi
  rationale: Bentuk kausatif imperatif berarti menyuruh orang-orang yang hadir keluar atau menjauh. Ungkapan ini alami sebagai perintah dalam bahasa Indonesia.
- source_word: כָל אִישׁ
  choice: semua orang
  rationale: Secara harfiah frasa ini berarti “setiap laki-laki,” tetapi dalam rumusan pengusiran ini berfungsi secara kolektif bagi semua orang yang hadir.
- source_word: מֵעָלַי / מֵעָלָיו
  choice: dari hadapanku / dari hadapannya
  rationale: Ungkapan Ibrani ini secara idiomatis berarti menjauh dari kehadiran seseorang. Pilihan ini juga mempertahankan kesejajaran antara perintah dan pelaksanaannya.
theological_decisions: []
