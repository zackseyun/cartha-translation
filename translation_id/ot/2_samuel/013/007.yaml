base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/007.yaml
  text: Then David sent word to Tamar at home[a], saying, “Please go to the house of your brother Amnon and prepare the food for him.”
translation:
  language: id
  text: 'Lalu Daud mengirim pesan kepada Tamar di rumah[a]: “Pergilah ke rumah Amnon, saudaramu, dan siapkanlah makanan untuknya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke rumah.” Akhiran arah pada kata Ibrani dapat menunjuk tempat tujuan; dalam konteks ini frasa tersebut tampaknya menyatakan bahwa Tamar berada di rumah ketika Daud mengirim pesan kepadanya. Mungkin yang dimaksud adalah kediaman kerajaan.
    reason: Menjelaskan bentuk Ibrani הַבַּיְתָה dan kemungkinan kontekstual tanpa menetapkan “istana” dalam teks utama.
lexical_decisions:
- source_word: וַיִּשְׁלַח דָּוִד אֶל תָּמָר
  choice: Daud mengirim pesan kepada Tamar
  rationale: Kata kerja שׁלח pada dasarnya berarti ‘mengutus/mengirim’. Karena diikuti אֶל dengan nama orang dan לֵאמֹר yang memperkenalkan isi pesan, ‘mengirim pesan kepada’ menyampaikan maksud konstruksi ini secara alami dalam bahasa Indonesia.
- source_word: הַבַּיְתָה
  choice: di istana
  rationale: Bentuk dengan akhiran arah secara harfiah menunjuk ‘ke rumah’. Dalam konteks narasi (ay. 8), rumah yang dimaksud adalah kediaman Daud, yakni istana; frasa ini paling masuk akal menunjukkan tempat Tamar berada ketika pesan disampaikan. Karena ungkapan Ibrani tetap dapat dipahami secara lebih umum, alternatif dicatat dalam catatan kaki.
- source_word: לְכִי נָא
  choice: Pergilah
  rationale: Imperatif feminin tunggal לְכִי diperhalus oleh partikel נָא. Akhiran ‘-lah’ membuat perintah ini terdengar lebih halus dan wajar dalam bahasa Indonesia tanpa perlu menambahkan ‘tolong’, yang dapat memberi nuansa permohonan lebih kuat.
- source_word: בֵּית אַמְנוֹן אָחִיךְ
  choice: ke rumah Amnon, kakakmu
  rationale: Rangkaian konstruksi berarti ‘rumah Amnon, saudara laki-lakimu’. ‘Kakakmu’ dipilih karena Amnon adalah putra sulung Daud dan dengan demikian lebih tua daripada Tamar; aposisi mempertahankan penyebutan hubungan keluarga secara alami.
- source_word: וַעֲשִׂי לוֹ הַבִּרְיָה
  choice: dan siapkanlah makanan untuknya
  rationale: עשה bermakna luas ‘membuat/mengerjakan’, tetapi dalam konteks makanan paling alami diterjemahkan ‘menyiapkan’. הַבִּרְיָה menunjuk makanan, khususnya hidangan bagi orang sakit atau yang sedang memulihkan diri; kata umum ‘makanan’ tidak menetapkan bentuk hidangan yang tidak disebutkan ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Bentuk ‘-lah’ mempertahankan nada perintah yang diperhalus. ‘Istana’ memperjelas kediaman kerajaan berdasarkan konteks dekat, sedangkan arti harfiah dipertahankan dalam catatan kaki. Penanda catatan kaki [a] dicantumkan tepat setelah frasa terkait.
