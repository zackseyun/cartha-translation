  text: וְ/אַבְשָׁל֣וֹם בָּרַ֔ח וַ/יֵּ֛לֶךְ אֶל תַּלְמַ֥י בֶּן עמיחור מֶ֣לֶךְ גְּשׁ֑וּר וַ/יִּתְאַבֵּ֥ל עַל בְּנ֖/וֹ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/037.yaml
  text: But Absalom fled and went to Talmai son of Ammihur[a], king of Geshur. And he mourned for his son all the days.
translation:
  language: id
  text: Namun, Absalom melarikan diri dan pergi ke Talmai, anak Amihur, raja Gesur. Daud terus-menerus berkabung atas anaknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְשָׁלוֹם בָּרַח
  choice: Namun, Absalom melarikan diri
  rationale: Kata penghubung וְ menyatakan peralihan yang kontras dalam alur cerita, sehingga “Namun” wajar dalam bahasa Indonesia. בָּרַח diterjemahkan langsung sebagai “melarikan diri”.
- source_word: וַ/יֵּלֶךְ אֶל
  choice: dan pergi kepada
  rationale: Ungkapan naratif ini secara langsung menyatakan bahwa Absalom pergi menemui atau mencari perlindungan pada Talmai; “pergi kepada” mempertahankan bentuk sumber tanpa penjelasan tambahan.
- source_word: תַּלְמַי בֶּן עמיחור
  choice: Talmai bin Amihur
  rationale: Nama-nama diri dialihaksarakan menurut kebiasaan Indonesia, dan בֶּן dalam silsilah atau patronimik diterjemahkan ringkas sebagai “bin”.
- source_word: מֶלֶךְ גְּשׁוּר
  choice: raja Gesur
  rationale: Rangkaian konstruksi Ibrani mengidentifikasi Talmai sebagai raja Gesur; bentuk tanpa kata sandang paling alami dalam bahasa Indonesia.
- source_word: וַ/יִּתְאַבֵּל
  choice: Ia berkabung
  rationale: Bentuk Hitpael dari אבל menunjuk pada tindakan berkabung. Subjeknya tunggal tetapi tidak disebutkan secara eksplisit, sehingga pronomina “Ia” mempertahankan ketakterangan gramatikal itu.
- source_word: עַל בְּנ/וֹ
  choice: karena anaknya
  rationale: Dalam konteks perkabungan, עַל menyatakan orang yang menjadi sebab perkabungan. “Karena anaknya” alami dalam bahasa Indonesia dan tidak menambahkan nama yang tidak terdapat dalam klausa Ibrani.
- source_word: כָּל הַ/יָּמִים
  choice: sepanjang waktu
  rationale: Idiom harfiah “seluruh hari-hari” menyatakan perkabungan yang terus berlangsung. “Sepanjang waktu” menyampaikan maknanya secara alami tanpa menyiratkan secara pasti “seumur hidupnya”.
theological_decisions:
- issue: Identitas subjek וַיִּתְאַבֵּל (“berkabung”)
  choice: Mempertahankan subjek tersirat dengan “Ia” dan memberi catatan bahwa konteks menunjuk kepada Daud
  alternative: Menyebut “Daud berkabung” langsung dalam teks utama
  rationale: Bahasa Ibrani tidak menyebut nama subjek pada klausa ini. Konteks mendukung Daud, tetapi memasukkan namanya ke dalam teks utama akan menghapus ketakterangan sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Bin” dipakai sebagai bentuk patronimik yang ringkas dan lazim dalam terjemahan nama kuno. Pronomina “Ia” menjaga ambiguitas asli, sedangkan catatan kaki memberi penjelasan kontekstual tanpa memasukkannya ke dalam teks.
