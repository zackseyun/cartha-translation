- from: Namun, Absalom melarikan diri dan pergi kepada Talmai bin Amihur, raja Gesur. Ia berkabung[a] karena anaknya sepanjang waktu.
  to: Namun, Absalom melarikan diri dan pergi ke Talmai, anak Amihur, raja Gesur. Daud terus-menerus berkabung atas anaknya.
  rationale: Revisi memperjelas subjek perkabungan sebagai Daud karena rujukan kontekstualnya jelas dan karena pronomina Indonesia dalam draf justru menciptakan salah rujuk kepada Talmai. Diksi tujuan perjalanan, patronimik, dan objek perkabungan juga dinaturalkan tanpa mengubah makna. Catatan kaki dihapus karena setelah Daud disebutkan dalam teks, catatan tentang subjek tersirat tidak lagi sesuai dengan bentuk terjemahan dan tidak memiliki jangkar yang diperlukan.
