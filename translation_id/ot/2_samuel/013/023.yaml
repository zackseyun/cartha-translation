base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/023.yaml
  text: It happened after two full years that Absalom had sheep shearers at Baal-hazor[a], which is near Ephraim, and Absalom invited all the king’s sons.
translation:
  language: id
  text: Setelah genap dua tahun[a], Absalom mengadakan pencukuran domba di Baal-Hazor, yang dekat Efraim, dan ia mengundang semua putra raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "setelah dua tahun hari-hari"; sebuah ungkapan Ibrani yang menyatakan masa dua tahun penuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁנָתַיִם יָמִים
  choice: Setelah genap dua tahun
  rationale: Ungkapan Ibrani harfiah “dua tahun hari-hari” menyatakan masa dua tahun yang lengkap; “setelah genap dua tahun” menyampaikan idiom itu secara alami dalam bahasa Indonesia.
- source_word: גֹזְזִים לְאַבְשָׁלוֹם
  choice: Absalom mengadakan pengguntingan bulu domba
  rationale: Partisip גֹזְזִים menunjuk kepada para penggunting atau kegiatan menggunting domba. Dalam konteks ini, konstruksi dengan לְאַבְשָׁלוֹם berarti kegiatan itu diselenggarakan bagi atau oleh Absalom; ungkapan Indonesia ini menyampaikan peristiwa yang dimaksud tanpa menyiratkan bahwa Absalom sendiri yang menggunting.
- source_word: בְּבַעַל חָצוֹר
  choice: di Baal-Hazor
  rationale: Nama tempat ditransliterasikan, sedangkan preposisi lokasi בְּ diterjemahkan secara wajar dengan “di”.
- source_word: אֲשֶׁר עִם אֶפְרָיִם
  choice: yang dekat Efraim
  rationale: עִם secara dasar berarti “dengan”, tetapi pada keterangan geografis ini menunjukkan kedekatan lokasi; “dekat” paling alami dan sesuai konteks.
- source_word: וַיִּקְרָא
  choice: mengundang
  rationale: Makna dasar verba ini ialah “memanggil”, tetapi dalam konteks perayaan pengguntingan domba, daya pragmatisnya ialah mengundang orang untuk hadir.
- source_word: לְכָל בְּנֵי הַמֶּלֶךְ
  choice: semua putra raja
  rationale: Terjemahan langsung dan alami dari frasa konstruksi tersebut; “putra” mempertahankan rujukan kepada anak laki-laki raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Alur naratif וַיְהִי tidak diberi padanan “adapun” atau “maka” yang berlebihan; hubungan waktunya sudah terungkap melalui “Setelah genap dua tahun”. Nama בַּעַל חָצוֹר ditulis “Baal-Hazor” agar kedua unsur nama tempat terbaca jelas.
