  text: וַ/יִּשְׁכַּ֥ב אַמְנ֖וֹן וַ/יִּתְחָ֑ל וַ/יָּבֹ֨א הַ/מֶּ֜לֶךְ לִ/רְאֹת֗/וֹ וַ/יֹּ֨אמֶר אַמְנ֤וֹן אֶל הַ/מֶּ֨לֶךְ֙ תָּֽבוֹא נָ֞א תָּמָ֣ר אֲחֹתִ֗/י וּ/תְלַבֵּ֤ב לְ/עֵינַ/י֙ שְׁתֵּ֣י לְבִב֔וֹת וְ/אֶבְרֶ֖ה מִ/יָּדָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/006.yaml
  text: So Amnon lay down and pretended to be sick. When the king came to see him[a], Amnon said to the king, “Please let Tamar my sister come and make two cakes before my eyes, so that I may eat from her hand.”
translation:
  language: id
  text: Lalu Amnon berbaring dan berpura-pura sakit. Ketika raja datang menjenguknya, Amnon berkata kepada raja, “Izinkanlah Tamar, saudara perempuanku, datang dan membuat dua buah kue[a] di depan mataku, supaya aku dapat makan dari tangannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua penganan” atau “dua pastri”; jenis makanan yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Dalam konteks ini Amnon mengambil posisi sebagai orang sakit. “Berbaring” alami dalam bahasa Indonesia dan tidak menambahkan gagasan bahwa ia benar-benar tidur.
- source_word: וַיִּתְחָל
  choice: berpura-pura sakit
  rationale: Bentuk verba dan konteks rencana penipuan menunjukkan bahwa Amnon menampilkan diri sebagai orang sakit, bukan benar-benar jatuh sakit.
- source_word: לִרְאֹתוֹ
  choice: menjenguknya
  rationale: Secara harfiah berarti “melihatnya”, tetapi dalam konteks seorang raja mendatangi orang yang dikira sakit, “menjenguknya” menyampaikan maksud tindakan itu secara alami.
- source_word: תָּבוֹא נָא
  choice: Izinkanlah ... datang
  rationale: Partikel נָא memberi nuansa permohonan sopan. Ungkapan ini wajar sebagai permintaan Amnon kepada raja.
- source_word: תָּמָר אֲחֹתִי
  choice: Tamar, saudara perempuanku
  rationale: “Saudara perempuan” mempertahankan hubungan yang dinyatakan teks tanpa menentukan apakah Tamar lebih tua atau lebih muda.
- source_word: וּתְלַבֵּב
  choice: membuat
  rationale: Verba langka ini berkaitan dengan pembuatan makanan yang disebut לְבִבוֹת. Karena tindakan kulinernya tidak pasti, “membuat” merupakan pilihan yang aman dan alami.
- source_word: לְעֵינַי
  choice: di depan mataku
  rationale: Pilihan ini mempertahankan unsur penglihatan yang konkret dan menegaskan keinginan Amnon agar Tamar membuat makanan itu dalam pandangannya.
- source_word: שְׁתֵּי לְבִבוֹת
  choice: dua buah kue
  rationale: Istilah לְבִבוֹת menunjuk pada sejenis makanan olahan, kemungkinan kue atau pastri, tetapi bentuk dan jenis tepatnya tidak pasti. “Kue” cocok untuk teks utama, sedangkan ketidakpastian dicatat dalam catatan kaki.
- source_word: וְאֶבְרֶה
  choice: supaya aku dapat makan
  rationale: Verba ברה di sini berkaitan dengan makan atau menerima makanan, khususnya dalam konteks orang sakit. Terjemahan ini jelas dan mempertahankan hubungan tujuan.
- source_word: מִיָּדָהּ
  choice: dari tangannya
  rationale: Terjemahan ini mempertahankan ungkapan tunggal dalam bahasa Ibrani serta nuansa pelayanan langsung dan pribadi yang diminta Amnon.
theological_decisions: []
translation_notes:
  register: Bahasa naratif dibuat modern, jelas, dan bermartabat. Kata ganti “aku” dipakai dalam percakapan keluarga kerajaan tanpa menambahkan sapaan yang tidak terdapat dalam teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah “kue”, yaitu kata yang dijelaskan.
