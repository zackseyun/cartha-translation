  text: וַ/יְצַו֩ אַבְשָׁל֨וֹם אֶת נְעָרָ֜י/ו לֵ/אמֹ֗ר רְא֣וּ נָ֠א כְּ/ט֨וֹב לֵב אַמְנ֤וֹן בַּ/יַּ֨יִן֙ וְ/אָמַרְתִּ֣י אֲלֵי/כֶ֔ם הַכּ֧וּ אֶת אַמְנ֛וֹן וַ/הֲמִתֶּ֥ם אֹת֖/וֹ אַל תִּירָ֑אוּ הֲ/ל֗וֹא כִּ֤י אָֽנֹכִי֙ צִוִּ֣יתִי אֶתְ/כֶ֔ם חִזְק֖וּ וִ/הְי֥וּ לִ/בְנֵי חָֽיִל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/028.yaml
  text: 'Then Absalom commanded his young men[a], saying, “Please watch: when Amnon’s heart is merry with wine, and I say to you, ‘Strike Amnon,’ then kill him. Do not fear. Have I not myself commanded you? Be strong, and be men of valor.”'
translation:
  language: id
  text: Lalu Absalom memerintahkan orang-orang mudanya, katanya, “Perhatikanlah, ketika hati Amnon menjadi gembira karena anggur[a], dan aku berkata kepada kalian, ‘Pukullah Amnon,’ bunuhlah dia. Jangan takut. Bukankah aku sendiri yang memerintahkan kalian? Berteguhlah dan jadilah laki-laki pemberani!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika hati Amnon baik karena anggur”; maksudnya, ketika anggur membuatnya gembira atau senang.
    reason: Menjelaskan idiom Ibrani tanpa menyimpulkan bahwa Amnon sudah mabuk berat.
lexical_decisions:
- source_word: נְעָרָיו
  choice: orang-orang muda yang mengiringinya
  rationale: נַעַר dapat berarti orang muda, pelayan, pengiring, atau anak buah. Ungkapan ini mempertahankan unsur usia sekaligus menjelaskan bahwa mereka adalah para pengiring pribadi Absalom yang menerima perintahnya.
- source_word: רְאוּ נָא
  choice: Perhatikanlah!
  rationale: Imperatif ראה dengan partikel נָא merupakan seruan agar mereka sungguh memperhatikan saat yang akan menjadi tanda. 'Perhatikanlah!' alami dan tegas dalam bahasa Indonesia modern.
- source_word: כְּטוֹב לֵב אַמְנוֹן בַּיַּיִן
  choice: ketika hati Amnon menjadi gembira karena anggur
  rationale: Terjemahan ini mempertahankan gambaran idiomatis Ibrani tentang hati yang menjadi 'baik/gembira' oleh anggur tanpa mempertegasnya menjadi mabuk berat.
- source_word: הַכּוּ אֶת אַמְנוֹן
  choice: Hantamlah Amnon
  rationale: נכה berarti memukul atau menghantam dan, dalam konteks tertentu, menyerang. 'Hantamlah' mempertahankan perintah awal, sedangkan klausa berikutnya menyatakan hasil mematikannya.
- source_word: וַהֲמִתֶּם אֹתוֹ
  choice: bunuhlah dia
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. Imperatif bahasa Indonesia menyampaikan perintah langsung yang dimaksud.
- source_word: אַל תִּירָאוּ
  choice: Jangan takut!
  rationale: Larangan langsung ini diterjemahkan secara ringkas dan wajar, dengan kekuatan nada perintah tetap terjaga.
- source_word: הֲלוֹא כִּי אָנֹכִי צִוִּיתִי אֶתְכֶם
  choice: Bukankah aku sendiri yang telah memerintahkan kalian?
  rationale: Pertanyaan retoris dipertahankan, dan 'aku sendiri' menyatakan penekanan pada אָנֹכִי serta tanggung jawab dan otoritas Absalom.
- source_word: חִזְקוּ
  choice: Kuatkanlah diri
  rationale: Imperatif חזק menyerukan keteguhan dan keberanian. 'Kuatkanlah diri' lebih alami sebagai seruan kepada beberapa orang dalam konteks ini daripada sekadar 'jadilah kuat'.
- source_word: וִהְיוּ לִבְנֵי חָיִל
  choice: jadilah laki-laki yang gagah berani
  rationale: בני חיל adalah ungkapan bagi laki-laki yang berani, tangguh, dan cakap, dengan nuansa kemiliteran. Terjemahan ini mempertahankan unsur maskulin dan seruan keberaniannya.
theological_decisions:
- issue: Ungkapan maskulin dalam לִבְנֵי חָיִל
  choice: jadilah laki-laki yang gagah berani
  alternative: jadilah orang-orang yang berani
  rationale: Teks Ibrani secara eksplisit memakai ungkapan maskulin dan menyapa para pengiring laki-laki Absalom. Bentuk maskulin dipertahankan agar latar sosial dan bentuk sumber tidak diratakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas dan bermartabat. Bentuk 'kalian' dipakai karena Absalom berbicara kepada sekelompok pengiring. Tanda seru mencerminkan rangkaian perintah yang mendesak.
