    issue: Tambahan “yang mengiringinya”
    rationale: Klausa relatif ini tidak terdapat dalam teks sumber. Walaupun para נְעָרִים memang merupakan pengiring atau anak buah dalam konteksnya, terjemahan sebaiknya tidak menetapkan fungsi itu sebagai keterangan eksplisit.
  - severity: low
    issue: “Kuatkanlah diri” kurang langsung untuk חִזְקוּ
    rationale: Bentuk imperatif Ibrani adalah seruan agar mereka kuat atau teguh, bukan terutama perintah refleksif untuk menguatkan diri.
  - severity: low
    issue: “Hantamlah” bernuansa lebih kasar dan kolokial
    rationale: “Pukullah” lebih netral dalam bahasa Indonesia baku dan tetap membedakan tindakan memukul dari perintah eksplisit berikutnya, “bunuhlah dia.”
