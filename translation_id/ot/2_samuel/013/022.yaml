  text: וְ/לֹֽא דִבֶּ֧ר אַבְשָׁל֛וֹם עִם אַמְנ֖וֹן לְ/מֵ/רָ֣ע וְ/עַד ט֑וֹב כִּֽי שָׂנֵ֤א אַבְשָׁלוֹם֙ אֶת אַמְנ֔וֹן עַל דְּבַר֙ אֲשֶׁ֣ר עִנָּ֔ה אֵ֖ת תָּמָ֥ר אֲחֹתֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/022.yaml
  text: And Absalom did not speak with Amnon[a], either bad or good[b], because Absalom hated Amnon because he had violated Tamar his sister.
translation:
  language: id
  text: Absalom tidak mengatakan apa pun kepada Amnon, baik yang buruk maupun yang baik,[a] karena Absalom membenci Amnon sebab ia telah melakukan kekerasan seksual terhadap Tamar,[b] saudara perempuannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari yang buruk sampai yang baik”; ungkapan ini berarti Absalom tidak mengatakan apa pun kepada Amnon.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah merendahkan Tamar.” Dalam konteks ini, kata Ibrani tersebut mengacu pada pelanggaran seksual yang dilakukan Amnon terhadap Tamar.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... עִם
  choice: berbicara kepada
  rationale: Ungkapan dengan דִבֶּר dan עִם berarti berbicara dengan atau kepada seseorang. Dalam konteks ini, 'berbicara kepada' alami dalam bahasa Indonesia dan tidak memperluas makna melampaui teks.
- source_word: לְמֵרָע וְעַד טוֹב
  choice: baik tentang yang buruk maupun yang baik
  rationale: Merisme ini mencakup segala jenis perkataan. Susunan tersebut mempertahankan kedua kutub ungkapan Ibrani, sedangkan catatan kaki menjelaskan makna idiomatisnya.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Absalom tidak berbicara kepada Amnon.
- source_word: שָׂנֵא
  choice: membenci
  rationale: Padanan langsung yang mempertahankan kuatnya sikap Absalom dalam narasi.
- source_word: עַל דְּבַר אֲשֶׁר
  choice: sebab
  rationale: Dalam konteks ini frasa tersebut menyatakan alasan kebencian Absalom; 'sebab' menghasilkan bahasa Indonesia yang wajar tanpa mengubah hubungan kausalnya.
- source_word: עִנָּה
  choice: telah menodai
  rationale: Dalam konteks serangan seksual pada pasal ini, verba tersebut menunjuk pada pelanggaran dan penghinaan seksual. 'Menodai' menyampaikan pelanggaran itu secara jelas, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: אֲחֹתוֹ
  choice: adiknya
  rationale: Akhiran pronominal merujuk kepada Absalom. Tamar adalah saudara perempuan Absalom; berdasarkan urutan anak-anak Daud dalam narasi, 'adiknya' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Sifat pelanggaran terhadap Tamar
  choice: menodai
  alternative: merendahkan; memperkosa
  rationale: Konteks dengan jelas menunjukkan pelanggaran seksual, tetapi verba עִנָּה sendiri memiliki cakupan 'merendahkan/menghinakan/menindas'. 'Menodai' menyatakan kekerasan seksual dalam konteks ini tanpa menjadikan verba pada ayat ini semata-mata sebuah istilah hukum yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur idiom Ibrani dipertahankan dalam teks utama, lalu maknanya dijelaskan dalam catatan kaki. Pengulangan nama Absalom dipertahankan untuk kejernihan dan kedekatan dengan sumber.
