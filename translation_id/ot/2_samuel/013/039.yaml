base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/039.yaml
  text: And King David longed to go out to Absalom, for he was comforted concerning Amnon, since he was dead.
translation:
  language: id
  text: Raja Daud rindu pergi menemui Absalom[a], sebab ia telah terhibur sehubungan dengan Amnon, karena Amnon telah mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada awal ayat ini sulit. Kata kerja feminin "berakhir/menjadi habis" tidak sesuai secara tata bahasa dengan "Raja Daud" yang maskulin. Secara harfiah, bagian itu kira-kira berbunyi, "Raja Daud ... selesai/berhenti untuk pergi kepada Absalom." Banyak penafsir memahami bahwa kata seperti "jiwa" atau "hasrat" Daud tersirat, sehingga maknanya ialah bahwa Daud rindu pergi kepada Absalom. Sebagian lainnya memahami atau memperbaiki teks itu menjadi bahwa Daud berhenti pergi mengejar Absalom.
    reason: Menjaga ambiguitas tekstual dan gramatikal Ibrani sambil menerangkan dasar pembacaan utama yang didukung konteks.
lexical_decisions:
- source_word: וַתְּכַל ... לָצֵאת אֶל
  choice: sangat rindu untuk pergi menemui
  rationale: Konstruksi Ibrani ini sulit dan secara harfiah memakai bentuk feminin dari כָּלָה, tetapi dalam konteksnya paling wajar dipahami sebagai hasrat atau kerinduan Raja Daud untuk mendatangi Absalom. Kata “menemui” menyampaikan arah kepada seseorang secara alami dalam bahasa Indonesia.
- source_word: נִחַם עַל
  choice: mendapat penghiburan mengenai
  rationale: Mempertahankan gagasan bahwa Daud telah terhibur atau pulih sehubungan dengan Amnon tanpa mempersempitnya menjadi penafsiran psikologis tertentu.
- source_word: כִּי מֵת
  choice: karena Amnon telah mati
  rationale: Nama Amnon diulangi agar rujukan subjek jelas dan alami dalam bahasa Indonesia; bentuk perfektif diterjemahkan “telah mati”.
theological_decisions:
- issue: Makna klausa pembuka yang secara gramatikal sulit
  choice: Raja Daud sangat rindu untuk pergi menemui Absalom
  alternative: Raja Daud berhenti pergi mengejar Absalom
  rationale: Konteks sesudah masa perkabungan dan pembacaan tradisional yang memasok gagasan “jiwa/hasrat” mendukung arti kerinduan, tetapi ketidakpastian teks tetap dicatat dalam catatan kaki dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Sangat rindu” mudah dipahami pembaca umum, sedangkan catatan kaki menjelaskan kesulitan teks tanpa membebani ayat utama.
