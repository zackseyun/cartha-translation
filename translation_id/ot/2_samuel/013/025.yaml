base_translation:
  language: en
  yaml_path: translation/ot/2_samuel/013/025.yaml
  text: But the king said to Absalom, “No, my son, please let us not all go, lest we be a burden on you.” And he pressed him, but he was not willing to go; so he blessed him.
translation:
  language: id
  text: Namun raja berkata kepada Absalom, “Jangan, anakku. Janganlah kita semua pergi, supaya kami tidak menjadi beban bagimu.” Absalom mendesaknya, tetapi raja tidak mau pergi; lalu ia memberkatinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל בְּנִי אַל נָא נֵלֵךְ כֻּלָּנוּ
  choice: “Jangan, anakku. Janganlah kita semua pergi”
  rationale: Larangan ganda dipertahankan secara alami dalam bahasa Indonesia; נָא memberi nuansa permohonan yang dalam konteks ini cukup tersirat oleh bentuk halus 'janganlah'.
- source_word: וְלֹא נִכְבַּד עָלֶיךָ
  choice: “supaya kami tidak menjadi beban bagimu”
  rationale: Secara harfiah berarti agar kami tidak menjadi berat atasmu; idiom Indonesia 'menjadi beban bagimu' menyampaikan maksudnya dengan jelas.
- source_word: וַיִּפְרָץ בּוֹ
  choice: “Absalom terus mendesaknya”
  rationale: Bentuk ini menyatakan desakan kuat atau berulang. Nama Absalom dinyatakan kembali agar pergantian subjek dalam rangkaian pronomina Ibrani jelas bagi pembaca Indonesia.
- source_word: וְלֹא אָבָה לָלֶכֶת
  choice: “tetapi raja tidak mau pergi”
  rationale: אָבָה menunjukkan ketidaksediaan atau keengganan. Subjek 'raja' dieksplisitkan untuk mencegah salah tafsir.
- source_word: וַיְבָרֲכֵהוּ
  choice: “lalu ia memberkatinya”
  rationale: Menerjemahkan verba ברך secara langsung dan mempertahankan pronomina sebagaimana teks sumber.
theological_decisions:
- issue: Makna tindakan raja ketika 'memberkati' Absalom
  choice: “lalu ia memberkatinya”
  alternative: “lalu ia mengucapkan selamat jalan kepadanya”
  rationale: Teks memakai ברך, 'memberkati'. Kemungkinan fungsi sosialnya tidak dijadikan parafrasa agar cakupan makna dan nuansa teks tetap terpelihara.
- issue: Rujukan pronomina pada klausa terakhir
  choice: 'Pronomina dipertahankan: “ia memberkatinya”'
  alternative: “raja memberkati Absalom”
  rationale: Konteks paling wajar menunjuk kepada raja sebagai pelaku dan Absalom sebagai penerima, tetapi bentuk pronominal sumber tetap dipertahankan tanpa penjelasan tambahan yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat jelas bagi pembaca umum dengan mengeksplisitkan subjek pada pergantian pelaku, tanpa menambah isi. Tidak ada penanda catatan kaki karena ayat ini tidak memerlukan catatan tekstual atau leksikal untuk publikasi.
