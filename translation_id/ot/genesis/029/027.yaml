  source_fidelity: 'Terjemahan pada dasarnya setia pada Ibrani: imperatif untuk menyelesaikan pekan pernikahan, janji pemberian perempuan yang lain, dan syarat kerja tujuh tahun tambahan semuanya terwakili. Bentuk pasif “akan diberikan kepadamu” dengan catatan alternatif aktif secara baik mempertahankan bentuk feminin tunggal Ibrani serta nuansa kontekstualnya.'
