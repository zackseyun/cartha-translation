base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: id
  text: Genapilah pekan pernikahan perempuan ini[a], lalu perempuan yang satu lagi ini juga akan diberikan kepadamu[b] sebagai imbalan atas pekerjaan yang akan kaulakukan untukku selama tujuh tahun lagi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “genapilah pekan dari yang ini”; frasa tersebut menunjuk pada pekan pernikahan menurut adat pada masa itu.
    reason: cultural_note
  - marker: b
    text: Atau, “lalu kami akan memberikan perempuan yang satu lagi ini juga kepadamu.” Bentuk Ibraninya secara formal adalah orang ketiga feminin tunggal, tetapi dalam konteksnya merupakan janji Laban untuk memberikan anak perempuannya yang lain juga.
    reason: lexical_alternative
  - marker: c
    text: Atau, “yang akan kaulakukan bersamaku.” Kata kerja Ibraninya dapat berarti “bekerja” atau “melayani,” dan preposisinya secara harfiah berarti “dengan aku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: Genapilah
  rationale: Bentuk imperatif dari מלא memerintahkan Yakub untuk menuntaskan masa tertentu; “genapilah” mempertahankan daya perintah dan cocok dengan ungkapan waktu.
- source_word: שְׁבֻעַ זֹאת
  choice: pekan pernikahan perempuan ini
  rationale: Secara harfiah berarti “pekan dari yang ini”; dalam konteksnya menunjuk pada pekan adat pernikahan Lea. “Perempuan ini” menjelaskan rujukan demonstratif feminin tanpa menyebut nama yang tidak ada dalam ayat.
- source_word: וְנִתְּנָה לְךָ
  choice: lalu ... akan diberikan kepadamu
  rationale: Bentuk Ibraninya secara formal orang ketiga feminin tunggal dan secara idiomatis bernuansa pasif atau tak tentu. Terjemahan pasif mempertahankan bentuk itu sekaligus tetap alami dalam bahasa Indonesia.
- source_word: גַּם אֶת זֹאת
  choice: perempuan yang satu lagi ini juga
  rationale: Demonstratif feminin ini menunjuk kepada Rahel. Frasa “yang satu lagi” membedakannya dengan jelas dari perempuan yang disebut sebelumnya, sedangkan “juga” mempertahankan גַּם.
- source_word: בַּעֲבֹדָה
  choice: sebagai imbalan atas pekerjaan
  rationale: Preposisi dengan nomina עֲבֹדָה menyatakan syarat atau imbalan dalam kesepakatan kerja tersebut.
- source_word: תַּעֲבֹד עִמָּדִי
  choice: yang akan kaulakukan padaku
  rationale: עבד dapat berarti bekerja atau melayani. Dalam pengaturan antara Yakub dan Laban, ungkapan ini secara alami menyampaikan pekerjaan yang dilakukan bagi Laban; “padaku” menangkap fungsi kontekstual עִמָּדִי tanpa terjemahan kaku “bersamaku”.
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: selama tujuh tahun lagi
  rationale: Ungkapan ini secara alami menyatakan tambahan masa tujuh tahun yang berbeda dari masa sebelumnya.
