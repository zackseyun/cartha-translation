translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Lalu” meneruskan rangkaian tindakan dalam narasi; “mengadakan perjamuan” dipilih sebagai ungkapan Indonesia yang alami.
