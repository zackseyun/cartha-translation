  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: id
  text: Lalu Laban mengumpulkan semua laki-laki di tempat itu dan mengadakan perjamuan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua orang di tempat itu.” Secara lebih harfiah, bahasa Ibrani berbunyi “semua laki-laki di tempat itu”; bentuk maskulin dipertahankan dalam teks utama karena kemungkinan menunjuk kepada para lelaki setempat yang diundang ke perayaan pernikahan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “perjamuan” sering dipakai untuk jamuan perayaan dan dapat menyiratkan bahwa minum-minum merupakan bagian dari acara itu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Dalam konteks narasi ini, אסף berarti menghimpun orang-orang ke satu tempat. “Mengumpulkan” alami dalam bahasa Indonesia modern dan tetap dekat dengan tindakan konkret dalam bahasa Ibrani.
- source_word: לָבָן
  choice: Laban
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: semua laki-laki di tempat itu
  rationale: אַנְשֵׁי adalah bentuk jamak konstruksi maskulin dari אִישׁ, secara harfiah menunjuk kepada “laki-laki.” Dalam konteks ini kemungkinan yang dimaksud ialah para lelaki setempat yang diundang ke perayaan pernikahan. “Di tempat itu” menyampaikan relasi konstruksi secara alami tanpa mempersempit הַמָּקוֹם menjadi “kota.”
- source_word: וַיַּעַשׂ
  choice: mengadakan
  rationale: עשה adalah verba luas yang berarti melakukan atau membuat. Bersama מִשְׁתֶּה, padanan idiomatis bahasa Indonesia “mengadakan perjamuan” lebih alami daripada “membuat perjamuan,” tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: מִשְׁתֶּה menunjuk kepada jamuan perayaan yang sering mencakup minum-minum. “Perjamuan” ringkas, bermartabat, dan sesuai dengan konteks pesta pernikahan.
