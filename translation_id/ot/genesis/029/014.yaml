  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: id
  text: Lalu Laban berkata kepadanya, “Sungguh, engkau adalah tulangku dan dagingku.”[a] Yakub pun tinggal bersamanya selama sebulan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “tulangku dan dagingku” berarti kerabat sedarah atau keluarga dekat.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “sebulan hari-hari”; maksudnya dapat diungkapkan sebagai “selama sebulan” atau “sebulan penuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” memberi alur yang alami dalam bahasa Indonesia.
- source_word: אַךְ
  choice: Sungguh
  rationale: Dalam konteks ini partikel tersebut menegaskan pengakuan Laban akan hubungan kekerabatan, bukan membatasinya.
- source_word: עַצְמִי וּבְשָׂרִי
  choice: tulangku dan dagingku
  rationale: Ungkapan kekerabatan Ibrani dipertahankan secara harfiah agar citra dan gaung antarteksnya tidak hilang; maknanya dijelaskan dalam catatan kaki.
- source_word: וַיֵּשֶׁב עִמּוֹ
  choice: Yakub pun tinggal bersamanya
  rationale: ישׁב di sini menyatakan bahwa Yakub menetap sementara bersama Laban. Nama “Yakub” dipakai untuk memperjelas rujukan pronomina yang dapat terasa kabur dalam bahasa Indonesia.
- source_word: חֹדֶשׁ יָמִים
  choice: selama sebulan
  rationale: Ungkapan harfiah “sebulan hari-hari” merupakan idiom durasi; “selama sebulan” menyampaikan artinya secara alami tanpa mengharuskan penekanan “sebulan penuh.”
