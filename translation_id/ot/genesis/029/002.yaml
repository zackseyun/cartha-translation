translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Pengulangan 'lihatlah' dipertahankan demi kejelasan dramatis teks Ibrani. 'Kambing domba' digunakan sebagai padanan inklusif untuk צֹאן, dan ungkapan 'lubang sumur' dipilih agar alami bagi pembaca umum.
