base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: id
  text: Ia melihat[a], dan lihatlah, ada sebuah sumur di padang. Dan lihatlah, di sana ada tiga kawanan domba yang sedang berbaring di dekat sumur itu[b], sebab dari sumur itulah orang biasa memberi minum kawanan-kawanan itu[c]. Di atas bukaan sumur itu ada sebuah batu besar[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ia memandang.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atasnya”; dalam konteks ini maksudnya di dekat sumur itu.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan, “mereka memberi minum kawanan-kawanan itu.” Bentuk Ibrani tidak menyebutkan siapa tepatnya yang melakukannya dan dapat menunjukkan tindakan yang biasa dilakukan.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “di atas mulut sumur itu”; “mulut sumur” menunjuk pada bukaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ia melihat
  rationale: Bentuk wayyiqtol dari ראה melanjutkan alur cerita dan secara langsung memperkenalkan apa yang dilihat Yakub. 'Melihat' alami dalam bahasa Indonesia; nuansa memandang dicatat sebagai alternatif.
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: dan lihatlah ... dan lihatlah
  rationale: Pengulangan partikel הִנֵּה dipertahankan untuk menjaga daya tunjuk dan kejelasan dramatis narasi Ibrani.
- source_word: בְאֵר בַּשָּׂדֶה
  choice: sebuah sumur di padang
  rationale: בְאֵר berarti sumur, sedangkan שָׂדֶה dapat berarti ladang atau daerah terbuka. 'Padang' sesuai dengan latar penggembalaan dan tetap ringkas.
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: tiga kawanan kambing domba
  rationale: עֵדֶר berarti kawanan, dan צֹאן menunjuk ternak kecil yang dapat mencakup domba serta kambing. 'Kambing domba' mempertahankan keluasan istilah sumber.
- source_word: רֹבְצִים
  choice: sedang berbaring
  rationale: Partisipel רבץ menggambarkan hewan yang berbaring atau beristirahat. 'Sedang berbaring' mempertahankan gambaran konkret.
- source_word: עָלֶיהָ
  choice: di dekat sumur itu
  rationale: Secara harfiah preposisi ini dapat berarti 'di atasnya', tetapi dalam konteks kawanan dan sumur, makna lokatif yang wajar ialah berada di dekat sumur.
- source_word: יַשְׁקוּ
  choice: orang biasa memberi minum
  rationale: Bentuk Hifil dari שׁקה berarti memberi minum. Subjek jamak dalam bahasa Ibrani tidak disebutkan secara khusus, sedangkan bentuk yiqtol dalam konteks ini wajar menyatakan kebiasaan; 'orang biasa' menjaga kedua unsur itu tanpa menentukan pelaku.
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: Batu di atas lubang sumur itu besar
  rationale: Frasa idiomatis 'mulut sumur' dinaturalkan menjadi 'lubang sumur', sementara struktur klausa deskriptif dan letak batu tetap dipertahankan.
