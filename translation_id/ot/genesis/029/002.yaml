    issue: '"Tiga kawanan kambing domba" tidak lazim.'
    rationale: Dalam bahasa Indonesia modern, gabungan tersebut bukan bentuk yang paling jelas untuk kelompok ternak. "Tiga kawanan domba" lebih alami dan tetap sesuai konteks pastoral, tanpa menetapkan rincian yang tidak diperlukan teks.
