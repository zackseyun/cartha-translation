base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: id
  text: Mereka menjawab, “Kami tidak dapat melakukannya sebelum semua kawanan ternak berkumpul dan batu itu digulingkan dari mulut sumur[b]. Setelah itu barulah kami memberi minum kawanan ternak[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “domba-domba”; kata Ibrani צֹאן dapat menunjuk secara kolektif pada ternak kecil, terutama domba dan kambing.
    reason: lexical_alternative
  - marker: b
    text: “Mulut sumur” berarti bukaan sumur.
    reason: source_idiom
lexical_decisions:
- source_word: נוּכַל
  choice: kami tidak dapat melakukannya
  rationale: Bentuk יכל orang pertama jamak menyatakan ketidakmampuan. Kata ‘melakukannya’ melengkapi ungkapan eliptis Ibrani secara wajar dalam bahasa Indonesia, dengan tindakan yang dimaksud dijelaskan oleh konteks.
- source_word: יֵאָסְפוּ
  choice: berkumpul
  rationale: Bentuk nifal אסף di sini menyatakan bahwa kawanan-kawanan itu terkumpul atau berkumpul; bentuk aktif-intransitif ini alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: הָעֲדָרִים
  choice: semua kawanan ternak
  rationale: עדר menunjuk pada kawanan hewan ternak, khususnya ternak kecil. ‘Kawanan ternak’ mempertahankan cakupan leksikal tanpa membatasinya hanya pada domba.
- source_word: וְגָלֲלוּ אֶת־הָאֶבֶן
  choice: orang-orang menggulingkan batu itu
  rationale: גלל berarti menggulingkan. Subjek jamak dalam bahasa Ibrani tidak disebutkan secara khusus; ‘orang-orang’ mempertahankan sifat tak tentu itu dan menghindari kesan bahwa kawanan ternaklah yang menggulingkan batu.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: dari mulut sumur
  rationale: פִּי secara harfiah berarti ‘mulut’ dan merupakan gambaran Ibrani bagi lubang atau bukaan sumur. Ungkapan ini tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan citra sumber.
- source_word: וְהִשְׁקִינוּ
  choice: setelah itu barulah kami memberi minum
  rationale: Bentuk hifil שקה berarti memberi minum. ‘Setelah itu barulah’ menyampaikan urutan dan pembatasan tindakan yang tersirat oleh עַד אֲשֶׁר serta jeda utama sebelum klausa terakhir.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: צאן adalah sebutan kolektif bagi ternak kecil, terutama domba dan kambing. ‘Kawanan ternak’ mempertahankan keluasan makna tersebut.
theological_decisions: []
