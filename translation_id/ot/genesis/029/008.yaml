  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Elipsis sumber dilengkapi secara minimal agar ujaran alami, sedangkan ungkapan konkret ‘mulut sumur’ dipertahankan dan dijelaskan dalam catatan kaki.
