  choice: ke negeri orang-orang Timur
  rationale: Secara bentuk berarti 'ke negeri anak-anak/orang-orang timur'. Dalam bahasa Indonesia, 'orang-orang Timur' mempertahankan sebutan kolektif-geografis tanpa memberi kesan bahwa yang dimaksud hanya keturunan biologis langsung.
