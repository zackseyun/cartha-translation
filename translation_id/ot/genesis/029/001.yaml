  rationale: Ungkapan harfiah 'Yakub mengangkat kakinya' merupakan idiom yang menyatakan bahwa ia mulai atau meneruskan perjalanan. Dalam konteks sesudah peristiwa di Betel, 'melanjutkan perjalanannya' menyampaikan maknanya secara alami.
