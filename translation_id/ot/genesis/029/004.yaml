  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: id
  text: Yakub berkata kepada mereka, “Saudara-saudaraku,[a] dari mana kalian berasal?” Mereka berkata, “Kami dari Haran.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudaraku” di sini adalah sapaan persaudaraan yang sopan kepada para lelaki itu, bukan berarti mereka tentu saudara kandung Yakub.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: berkata kepada mereka
  rationale: Kata kerja אמר adalah kata umum untuk berbicara, sedangkan לָהֶם menandai pihak yang diajak bicara. Terjemahan ini dekat dengan bentuk Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi ini memakai bentuk baku yang dikenal luas dalam bahasa Indonesia.
- source_word: אַחַי
  choice: Saudara-saudaraku
  rationale: Secara harfiah berarti 'saudara-saudaraku'. Bentuk ini mempertahankan unsur kepunyaan dan sapaan jamak maskulin, tanpa menyatakan bahwa mereka pasti saudara kandung.
- source_word: מֵאַיִן אַתֶּם
  choice: dari mana kalian berasal?
  rationale: מֵאַיִן menanyakan asal, dan אַתֶּם adalah pronomina orang kedua jamak maskulin. 'Dari mana kalian berasal?' merupakan ungkapan Indonesia modern yang jelas dan alami.
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: Bentuk jamak dari אמר tetap diterjemahkan dengan kata kerja umum 'berkata'; konteksnya sudah menunjukkan bahwa ujaran itu merupakan jawaban.
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: Kami dari Haran
  rationale: מִן menandai asal, sedangkan אֲנָחְנוּ berarti 'kami'. Bahasa Indonesia tidak memerlukan kopula, sehingga bentuk ini ringkas dan alami.
