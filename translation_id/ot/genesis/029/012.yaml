  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: id
  text: Yakub memberi tahu Rahel bahwa ia adalah kerabat ayah Rahel dan anak Ribka.[a] Lalu Rahel berlari dan memberi tahu ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “saudara laki-laki ayah Rahel”. Kata “saudara” di sini dipakai untuk kerabat laki-laki dekat; secara khusus, Yakub adalah keponakan Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti menyampaikan atau memberitahukan; ungkapan ini alami dalam narasi Indonesia modern.
- source_word: כִּי
  choice: bahwa
  rationale: Kedua kemunculannya memperkenalkan isi yang disampaikan Yakub.
- source_word: אֲחִי אָבִיהָ
  choice: kerabat ayahnya
  rationale: Secara harfiah berarti 'saudara laki-laki ayahnya', tetapi אָח dapat dipakai lebih luas untuk kerabat laki-laki. Dalam hubungan keluarga yang disebutkan narasi, Yakub adalah keponakan Laban, sehingga 'kerabat' menyampaikan maksud ungkapan tanpa memberi informasi yang keliru.
- source_word: בֶן רִבְקָה
  choice: anak Ribka
  rationale: Terjemahan langsung dan alami bagi hubungan anak dengan ibunya; konteks telah menunjukkan bahwa Yakub laki-laki.
- source_word: וַתָּרָץ
  choice: berlari
  rationale: רץ secara langsung menyatakan tindakan berlari dan mempertahankan gerak narasi yang hidup.
- source_word: וַתַּגֵּד
  choice: memberi tahu
  rationale: Menggunakan padanan yang sama dengan verba pertama untuk menjaga konsistensi naratif.
- source_word: לְאָבִיהָ
  choice: ayahnya
  rationale: Padanan langsung dan alami bagi frasa berpreposisi tersebut.
