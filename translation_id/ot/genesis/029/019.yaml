  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: id
  text: Laban berkata[a], “Lebih baik kuberikan dia kepadamu daripada memberikan dia kepada laki-laki lain. Tinggallah bersamaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Baik bagiku memberikan dia kepadamu daripada memberikan dia kepada laki-laki lain.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar memperkenalkan perkataan langsung dengan ‘berkata’.
- source_word: טוֹב
  choice: lebih baik
  rationale: Dalam konstruksi perbandingan dengan מִן, טוֹב menyatakan bahwa pilihan pertama lebih baik daripada pilihan kedua.
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: kuberikan dia kepadamu
  rationale: Infinitif dengan akhiran orang pertama tunggal dinyatakan sebagai klausa verbal alami dalam bahasa Indonesia; pronomina feminin tetap diterjemahkan ‘dia’ tanpa menambahkan hubungan yang tidak disebutkan dalam ayat.
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: daripada kuberikan kepada laki-laki lain
  rationale: מִן dan infinitif membentuk unsur kedua dalam perbandingan. Objek ‘dia’ dipahami dari klausa sebelumnya dan tidak perlu diulang agar kalimat Indonesia tetap alami.
- source_word: אִישׁ אַחֵר
  choice: laki-laki lain
  rationale: Pilihan ini mempertahankan arti eksplisit teks Ibrani tanpa mempersempitnya menjadi ‘suami lain’.
- source_word: שְׁבָה
  choice: tinggallah
  rationale: Dalam konteks ini imperatif ישׁב berarti tetap atau tinggal di suatu tempat, bukan sekadar duduk.
- source_word: עִמָּדִי
  choice: bersamaku
  rationale: Ungkapan ini menyatakan keberadaan yang berlanjut bersama Laban dan diterjemahkan secara langsung serta alami.
