  yaml_path: translation/ot/genesis/029/029.yaml
  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: id
  text: Lalu Laban memberikan Bilha, hamba perempuannya, kepada Rahel, putrinya, untuk menjadi hamba perempuan Rahel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Lalu ... memberikan
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan tindakan lampau; “lalu” dan “memberikan” menyampaikan fungsi serta makna dasarnya secara alami.
- source_word: לָבָן
  choice: Laban
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לְרָחֵל
  choice: kepada Rahel
  rationale: Preposisi לְ menandai Rahel sebagai penerima pemberian.
- source_word: בִּתּוֹ
  choice: anak perempuannya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal merujuk kepada Laban; “anak perempuannya” jelas dan alami dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung Ibrani tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: שִׁפְחָתוֹ
  choice: hambanya
  rationale: שִׁפְחָה menunjuk kepada hamba perempuan. Bahasa Indonesia tidak wajib menandai gender pada kata “hamba”; identitas Bilha dan konteks sudah menjelaskannya, sedangkan “hamba perempuan” terasa kurang alami.
- source_word: לָהּ לְשִׁפְחָה
  choice: untuk menjadi hamba Rahel
  rationale: Gabungan ini menyatakan peran Bilha bagi Rahel. Pengulangan nama “Rahel” menghindari ambiguitas pronomina dalam bahasa Indonesia dan menyampaikan relasi tujuan/peran secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mempertahankan bahwa Laban memberikan Bilha kepada Rahel dan bahwa Bilha kemudian berkedudukan sebagai hamba Rahel. Istilah “hamba” dipilih sebagai padanan ringkas dan alami bagi שִׁפְחָה tanpa menambahkan usia atau rincian status yang tidak dinyatakan secara eksplisit.
