  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan 'paras dan perawakan' dipilih agar terdengar alami dalam bahasa Indonesia, meskipun bahasa Ibrani menyebut bentuk/perawakan lebih dahulu lalu penampilan. Ambiguitas רַכּוֹת dipertahankan melalui catatan kaki.
