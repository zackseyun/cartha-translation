  yaml_path: translation/ot/genesis/029/017.yaml
  text: Leah’s eyes were soft[a], but Rachel was beautiful in form and appearance.
translation:
  language: id
  text: Lea bermata lembut[a], tetapi Rahel berperawakan indah dan berparas elok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sayu,” “halus,” atau “lemah.” Kata sifat Ibrani ini dapat menyiratkan kelembutan atau kehalusan; nuansa tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: mata
  rationale: Bentuk konstruksi jamak ini secara langsung menunjuk pada mata Lea, bukan penampilannya secara umum.
- source_word: רַכּוֹת
  choice: lembut
  rationale: Kata sifat ini dapat berarti lembut atau halus, dan mungkin juga dipahami sebagai lemah. Pilihan 'lembut' mempertahankan arti dasarnya tanpa memasukkan penilaian negatif yang belum tentu dimaksudkan.
- source_word: יְפַת תֹּאַר
  choice: perawakan yang indah
  rationale: Ungkapan ini menggambarkan bentuk atau sosok tubuh. 'Perawakan yang indah' alami dalam bahasa Indonesia dan tetap membedakannya dari paras.
- source_word: וִיפַת מַרְאֶה
  choice: paras yang indah
  rationale: מַרְאֶה menunjuk pada penampilan yang terlihat; dalam konteks ini, 'paras' menyampaikan kecantikan yang tampak dan mempertahankan pasangan deskripsi dengan perawakan.
- source_word: וְ
  choice: tetapi
  rationale: Walaupun secara formal berarti 'dan', kata sambung ini berfungsi kontras dalam konteks, dengan menyandingkan ciri Lea dan Rahel.
