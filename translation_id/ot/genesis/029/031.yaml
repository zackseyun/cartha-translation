  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤רְא יְהוָה֙ כִּֽי שְׂנוּאָ֣ה לֵאָ֔ה וַ/יִּפְתַּ֖ח אֶת רַחְמָ֑/הּ וְ/רָחֵ֖ל עֲקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: id
  text: Ketika TUHAN melihat bahwa Lea dibenci, Ia membuka rahimnya, tetapi Rahel mandul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital.
- source_word: שְׂנוּאָה
  choice: dibenci
  rationale: Mempertahankan arti kuat bentuk pasif Ibrani, bukan memperlunaknya menjadi “tidak dicintai”.
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: Ia membuka rahimnya
  rationale: Mempertahankan gambaran idiomatis sumber bahwa TUHAN membuat Lea dapat mengandung; “rahim” menerjemahkan רֶחֶם secara langsung.
- source_word: עֲקָרָה
  choice: mandul
  rationale: Padanan alami dan tepat untuk keadaan tidak dapat mempunyai anak dalam konteks ini.
theological_decisions:
- issue: Kekuatan ungkapan tentang sikap terhadap Lea
  choice: dibenci
  alternative: tidak dicintai
  rationale: Teks Ibrani memakai שְׂנוּאָה, “dibenci.” Terjemahan mempertahankan ketegangan ungkapan itu tanpa menafsirkannya sebagai sekadar kurang dicintai.
- issue: Tindakan ilahi atas kesuburan Lea
  choice: Ia membuka rahimnya
  alternative: Ia membuatnya dapat mengandung
  rationale: Ungkapan sumber dipertahankan karena jelas dalam konteks dan tidak menghapus metafora teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan kalimat mempertahankan kontras antara keadaan Lea dan Rahel; kata ganti “Ia” merujuk kepada TUHAN.
