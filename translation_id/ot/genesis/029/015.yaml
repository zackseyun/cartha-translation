  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: id
  text: Lalu Laban berkata kepada Yakub, “Hanya karena engkau kerabatku[a], masakan engkau bekerja untukku tanpa upah? Katakanlah kepadaku berapa upahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saudaraku”; di sini dipakai dalam arti yang lebih luas, yaitu kerabat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: Hanya karena
  rationale: 'Menandai dasar retoris pertanyaan Laban: hubungan kekerabatan tidak seharusnya menjadi alasan bagi Yakub untuk bekerja tanpa upah.'
- source_word: אָחִי
  choice: kerabatku
  rationale: Secara harfiah berarti ‘saudaraku’, tetapi di sini menunjuk pada hubungan kekerabatan yang lebih luas; Yakub adalah keponakan Laban.
- source_word: וַעֲבַדְתַּנִי
  choice: masakan engkau bekerja untukku
  rationale: Kata kerja עבד dalam konteks ini menunjuk pada pekerjaan bagi Laban. ‘Masakan’ menyampaikan daya retoris konstruksi Ibrani secara alami.
- source_word: חִנָּם
  choice: tanpa upah
  rationale: Dalam konteks pembicaraan tentang imbalan kerja, ungkapan ini secara jelas berarti bekerja tanpa menerima bayaran.
- source_word: הַגִּידָה לִּי
  choice: Katakanlah kepadaku
  rationale: Menerjemahkan bentuk imperatif dan objek tak langsung dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: berapa upah yang kauinginkan
  rationale: Secara bentuk dapat berarti ‘apa upahmu’, tetapi konteksnya adalah penetapan upah. Pilihan ini menyampaikan bahwa Laban meminta Yakub menyebutkan imbalan yang dikehendakinya tanpa mengubahnya menjadi pertanyaan langsung terpisah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk ‘engkau’ dipakai untuk dialog naratif, sedangkan ‘kauinginkan’ menjaga kelancaran kalimat. Ambiguitas kekerabatan dijelaskan melalui catatan kaki.
