  source_fidelity: Sebagian besar setia pada teks Ibrani. “Kerabatku” dengan catatan kaki secara tepat menangkap אָחִי dalam konteks ini, dan pertanyaan retoris tentang kerja tanpa upah tersampaikan baik. Namun, “upah yang kauinginkan” menambahkan unsur keinginan Yakub yang tidak dinyatakan secara leksikal; teks hanya meminta Yakub menyebutkan atau menjelaskan upahnya.
  naturalness: Bahasa terjemahan alami dan bermartabat. “Masakan engkau bekerja untukku tanpa upah?” merupakan pertanyaan retoris yang wajar. “Katakanlah kepadaku berapa upahmu” lebih langsung dan setia daripada bentuk yang menyatakan keinginan Yakub.
  terminology: “Upah” tepat untuk מַשְׂכֻּרְתֶּךָ, dan “tanpa upah” tepat untuk חִנָּם. “Kerabatku” adalah padanan modern yang baik; catatan kaki dengan benar mencatat makna harfiah “saudaraku.”
