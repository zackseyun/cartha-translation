base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: id
  text: Ketika Yakub melihat Rahel[a], anak perempuan Laban, saudara laki-laki ibunya, serta kawanan ternak milik Laban, saudara laki-laki ibunya, Yakub mendekat, menggulingkan batu dari atas mulut sumur itu, lalu memberi minum kawanan ternak milik Laban, saudara laki-laki ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mengulang frasa “saudara laki-laki ibunya” tiga kali dalam ayat ini, sehingga menonjolkan hubungan keluarga Yakub dengan Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rumus naratif ini mengantar peristiwa berikutnya dengan hubungan waktu. 'Ketika' menyampaikan fungsi itu secara alami tanpa terjemahan kaku 'terjadilah ketika'.
- source_word: רָאָה
  choice: melihat
  rationale: Kata kerja ini secara langsung menyatakan persepsi visual.
- source_word: בַּת לָבָן
  choice: anak perempuan Laban
  rationale: Ungkapan ini mengidentifikasi Rahel berdasarkan hubungan keluarganya dengan Laban; bentuk 'anak perempuan' jelas dan wajar dalam bahasa Indonesia.
- source_word: אֲחִי אִמּוֹ
  choice: saudara laki-laki ibunya
  rationale: Pilihan ini mempertahankan ungkapan hubungan keluarga yang eksplisit serta pengulangannya tiga kali, alih-alih memadatkannya menjadi 'pamannya'.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: Kata ini menunjuk ternak kecil secara kolektif, yang dapat meliputi domba dan kambing. 'Kawanan ternak' mempertahankan cakupan tersebut tanpa membatasi jenis hewannya.
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Kata kerja ini menggambarkan gerakan Yakub menuju sumur dan tempat tindakan berikutnya.
- source_word: וַיָּגֶל
  choice: menggulingkan
  rationale: Akar גלל menyatakan tindakan menggulingkan atau menggelindingkan; 'menggulingkan' mempertahankan gambaran konkret pemindahan batu.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: dari mulut sumur itu
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'mulut' untuk bukaan sumur sekaligus menyatakan bahwa batu dipindahkan dari atas bukaan tersebut.
- source_word: וַיַּשְׁקְ
  choice: memberi minum
  rationale: Bentuk kausatif kata kerja שׁקה berarti memberi air atau memberi minum. Untuk ternak, 'memberi minum' jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur kalimat mempertahankan pengulangan hubungan keluarga dalam teks Ibrani, meskipun terasa lebih repetitif daripada gaya Indonesia biasa. Penanda catatan kaki [a] ditempatkan sesudah nama Rahel.
