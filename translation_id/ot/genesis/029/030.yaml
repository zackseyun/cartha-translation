  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: id
  text: Yakub juga tidur dengan Rahel[a], dan ia lebih mencintai Rahel daripada Lea. Lalu ia bekerja pada Laban selama tujuh tahun lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "masuk kepada Rahel"; ini adalah ungkapan Ibrani yang dalam konteks ini berarti tidur dengan Rahel.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: Yakub juga menghampiri Rahel
  rationale: Dalam konteks perkawinan, בוא אל merupakan ungkapan halus yang menyiratkan masuk ke tempat tidur dan menggenapi perkawinan. 'Menghampiri' mempertahankan kehalusan serta implikasi seksualnya tanpa menjadi terlalu gamblang; 'juga' menerjemahkan גַּם.
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: ia lebih mencintai Rahel
  rationale: Kata אָהַב berarti 'mencintai'. Unsur perbandingan dinyatakan bersama מִלֵּאָה, sehingga 'lebih mencintai ... daripada ...' alami dalam bahasa Indonesia.
- source_word: מִלֵּאָה
  choice: daripada Lea
  rationale: 'Preposisi מִן di sini paling wajar menandai perbandingan sesudah verba kasih: Rahel dicintai lebih daripada Lea. Kemungkinan nuansa ''dan bukan Lea'' dicatat dalam catatan kaki.'
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: ia bekerja pada Laban
  rationale: עבד dapat berarti bekerja atau melayani. Walaupun עִמּוֹ secara harfiah 'bersamanya', konteks menunjukkan Yakub meneruskan pekerjaan di bawah Laban; penyebutan nama memperjelas anteseden dalam bahasa Indonesia.
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: selama tujuh tahun lagi
  rationale: Ungkapan ini menunjukkan tambahan masa tujuh tahun; 'tujuh tahun lagi' merupakan padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Sifat perbandingan kasih Yakub kepada Rahel dan Lea
  choice: lebih mencintai Rahel daripada Lea
  alternative: mencintai Rahel dan bukan Lea
  rationale: מִן paling alami berfungsi komparatif dalam konteks ini. Namun, karena konstruksinya dapat dipahami secara kontras, alternatif tersebut dipertahankan dalam catatan kaki tanpa menyimpulkan bahwa Yakub sama sekali tidak mengasihi Lea.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Menghampiri' dipakai sebagai ungkapan halus; nama 'Yakub' dan 'Laban' dinyatakan agar rujukan pronomina jelas dalam ayat yang berdiri sendiri.
