id: GEN.29.28
reference: Genesis 29:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַ/יְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַ/יִּתֶּן ל֛/וֹ אֶת רָחֵ֥ל בִּתּ֖/וֹ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/028.yaml
  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: id
  text: Yakub pun berbuat demikian dan menyelesaikan masa tujuh hari itu[a]. Kemudian Laban memberikan Rahel, anak perempuannya, kepadanya untuk menjadi istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pekan perkawinan itu”; ungkapan Ibrani secara harfiah menunjuk pada suatu masa tujuh, yang di sini kemungkinan besar adalah tujuh hari pesta perkawinan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: Yakub pun berbuat demikian
  rationale: Mengungkapkan acuan balik כֵּן kepada perintah Laban pada ayat sebelumnya secara alami tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: וַיְמַלֵּא
  choice: menyelesaikan
  rationale: Bentuk piel dari מלא di sini berarti menuntaskan suatu jangka waktu.
- source_word: שְׁבֻעַ זֹאת
  choice: masa tujuh hari itu
  rationale: שְׁבֻעַ menunjuk pada satu masa tujuh, yang dalam konteks ini kemungkinan besar merupakan pekan pesta perkawinan; terjemahan ini mempertahankan arti dasarnya tanpa terlalu cepat menafsirkan.
- source_word: וַיִּתֶּן לוֹ
  choice: Kemudian Laban memberikan ... kepadanya
  rationale: Subjek tersiratnya adalah Laban dari konteks sebelumnya. Menyebut namanya memperjelas pelaku, sedangkan 'kemudian' menyampaikan urutan narasi.
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: Rahel, anak perempuannya
  rationale: Menerjemahkan objek langsung beserta keterangan hubungan keluarga secara lugas dan alami.
- source_word: לוֹ לְאִשָּׁה
  choice: kepadanya untuk menjadi istrinya
  rationale: Konstruksi ini menyatakan pemberian seorang perempuan dalam perkawinan; pilihan ini jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah 'masa tujuh hari' dipakai untuk mempertahankan keluasan ungkapan Ibrani, sementara konteks perkawinan dijelaskan dalam catatan kaki.
