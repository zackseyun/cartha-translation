  - severity: medium
    issue: '"bekerja padamu" tidak idiomatis.'
    rationale: Dalam bahasa Indonesia modern, seseorang "bekerja untuk" seseorang. Bentuk "padamu" berpotensi mengganggu kelancaran dan tidak diperlukan demi kesetiaan sumber.
  - severity: low
