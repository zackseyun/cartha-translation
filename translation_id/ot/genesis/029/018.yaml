  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: id
  text: Yakub mencintai Rahel, lalu berkata, “Aku akan bekerja untukmu selama tujuh tahun demi Rahel, putrimu yang lebih muda.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: mengasihi
  rationale: Kata kerja אָהַב secara langsung menyatakan kasih atau cinta. “Mengasihi” mempertahankan makna leksikal tanpa menambahkan nuansa khusus seperti “jatuh cinta”.
- source_word: וַיֹּאמֶר
  choice: lalu berkata
  rationale: Kata אמר memperkenalkan ucapan langsung; “lalu” secara alami menyampaikan kesinambungan naratif dari waw konsekutif.
- source_word: אֶעֱבָדְךָ
  choice: Aku akan bekerja padamu
  rationale: Dalam konteks ini עבד menunjuk pada pekerjaan yang dilakukan Yakub bagi Laban. “Bekerja padamu” alami dalam bahasa Indonesia dan tidak menyiratkan jabatan keagamaan atau perbudakan seperti yang mungkin ditimbulkan oleh “melayani”.
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: Terjemahan langsung; “selama” memperjelas bahwa frasa tersebut menyatakan jangka waktu.
- source_word: בְּרָחֵל
  choice: untuk mendapatkan Rahel
  rationale: Preposisi ב di sini menandai dasar atau imbalan bagi pekerjaan Yakub. Ungkapan ini menjelaskan maksud perjanjian perkawinan secara wajar tanpa memakai bahasa jual-beli yang terlalu kuat.
- source_word: בִּתְּךָ
  choice: anakmu
  rationale: Dalam konteks keluarga, bentuk feminin “putrimu” juga tepat, tetapi nama Rahel dan keterangan berikutnya sudah membuat jenis kelaminnya jelas; “anakmu” merupakan bahasa Indonesia modern yang alami.
- source_word: הַקְּטַנָּה
  choice: yang lebih muda
  rationale: Walaupun secara dasar berarti “kecil”, dalam perbandingan antarsaudara kata ini berarti “lebih muda”, berlawanan dengan Lea sebagai kakaknya.
