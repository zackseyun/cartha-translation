  text: Then Jacob kissed Rachel[a], and he lifted up his voice and wept.
translation:
  language: id
  text: Lalu Yakub mencium Rahel[a], lalu ia mengangkat suaranya dan menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memberi salam kepada Rahel dengan ciuman.” Kata Ibrani ini biasanya berarti “mencium”, tetapi dalam konteks ini ciuman itu mungkin merupakan salam keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: mencium
  rationale: Bentuk qal dari נשׁק secara langsung berarti ‘mencium’. Dalam konteks ini tindakan tersebut dapat berfungsi sebagai salam kekeluargaan, tetapi terjemahan utama mempertahankan tindakan konkretnya.
- source_word: לְרָחֵל
  choice: Rahel
  rationale: Preposisi ל menandai orang yang dicium; dalam bahasa Indonesia, konstruksi yang alami ialah ‘mencium Rahel’, tanpa menerjemahkan preposisinya secara tersendiri.
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: dengan suara keras
  rationale: Idiom harfiah ‘mengangkat suaranya’ menunjukkan tangisan yang terdengar atau nyaring. Ungkapan ‘menangis dengan suara keras’ menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: וַיֵּבְךְּ
  choice: menangis
  rationale: Kata בכה berarti ‘menangis’ atau ‘meratap’; ‘menangis’ merupakan padanan umum yang tepat tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: וַ
  choice: Lalu ... kemudian
  rationale: Rangkaian waw-konsekutif memajukan urutan tindakan. ‘Lalu’ dan ‘kemudian’ menghasilkan narasi Indonesia yang lancar tanpa pengulangan ‘dan’.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, wajar, dan bermartabat. Idiom Ibrani tentang ‘mengangkat suara’ diterjemahkan menurut maknanya agar mudah dipahami, sedangkan ambiguitas fungsi ciuman dipertahankan dalam catatan kaki.
