  text: And Laban gave Zilpah his female servant to Leah his daughter as a female servant[a][b].
translation:
  language: id
  text: Laban memberikan Zilpa, hamba perempuannya, kepada Lea, anak perempuannya, untuk menjadi hamba perempuan Lea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “hamba perempuan” menunjuk pada seorang pelayan perempuan dengan status bergantung, yang kemungkinan berada dalam kondisi perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Bentuk naratif dari נתן secara langsung berarti “memberikan”; pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan tafsiran.
- source_word: לָהּ
  choice: kepada Lea
  rationale: Secara harfiah berarti “kepadanya”, tetapi rujukannya dijelaskan oleh frasa berikutnya, לְלֵאָה בִתּוֹ. Menyebut “Lea” menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שִׁפְחָתוֹ
  choice: hambanya
  rationale: שִׁפְחָה menunjuk pada seorang perempuan berstatus pelayan yang bergantung dan kemungkinan diperbudak. “Hamba” mempertahankan status sosial itu dengan bahasa yang ringkas dan wajar; jenis kelaminnya sudah jelas dari Zilpa.
- source_word: לְלֵאָה בִתּוֹ
  choice: kepada Lea, anak perempuannya
  rationale: Preposisi לְ menandai penerima, sedangkan בִתּוֹ merupakan aposisi yang mengidentifikasi Lea sebagai anak perempuan Laban.
- source_word: שִׁפְחָה
  choice: untuk menjadi hamba Lea
  rationale: Nomina terakhir menyatakan peran Zilpa dalam pemberian itu. Bentuk ini menghindari pengulangan yang kaku dan memperjelas hubungan yang sudah tersirat oleh konstruksi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Hamba” dipilih daripada “budak perempuan” dalam teks utama agar alami tanpa menghapus kemungkinan status perbudakan, yang dijelaskan dalam catatan kaki. Tanda koma dipakai untuk menandai aposisi dengan jelas.
