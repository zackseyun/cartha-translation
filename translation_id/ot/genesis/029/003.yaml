  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: id
  text: Semua kawanan biasanya berkumpul di sana. Para gembala lalu menggulingkan batu itu dari lubang sumur, memberi minum kawanan domba dan kambing, kemudian mengembalikan batu itu ke tempatnya di atas lubang sumur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: biasanya berkumpul
  rationale: Bentuk imperfek Nifal dalam konteks ini menggambarkan kebiasaan berulang pada masa lampau; frasa ini menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: כָל הָעֲדָרִים
  choice: semua kawanan
  rationale: עֲדָרִים menunjuk pada kelompok-kelompok ternak dalam latar penggembalaan; 'kawanan' mempertahankan bentuk jamaknya tanpa membatasi secara tidak perlu pada satu jenis hewan.
- source_word: וְגָלֲלוּ
  choice: lalu menggulingkan
  rationale: Kata kerja ini melukiskan tindakan menggulirkan atau menggulingkan batu; 'menggulingkan' mempertahankan gambaran konkret dan urutan kebiasaan.
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: dari lubang sumur
  rationale: Secara harfiah berarti 'dari atas mulut sumur'; 'lubang sumur' adalah padanan idiomatis yang jelas dalam bahasa Indonesia.
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: memberi minum kawanan ternak
  rationale: Bentuk Hifil שׁקה berarti memberi minum atau menyebabkan minum, sedangkan צֹאן adalah nomina kolektif bagi ternak kecil; terjemahan ini menjaga sifat kolektifnya.
- source_word: וְהֵשִׁיבוּ
  choice: kemudian mengembalikan
  rationale: Bentuk Hifil שוב berarti menyebabkan kembali; untuk batu, 'mengembalikan' merupakan padanan Indonesia yang alami.
- source_word: עַל פִּי הַבְּאֵר לִמְקֹמָהּ
  choice: ke tempatnya di atas lubang sumur
  rationale: Ungkapan ini menyatakan bahwa batu dikembalikan ke posisi semula yang menutupi atau berada di atas lubang sumur.
theological_decisions: []
