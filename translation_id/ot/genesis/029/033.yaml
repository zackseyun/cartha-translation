source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר כִּֽי שָׁמַ֤ע יְהוָה֙ כִּֽי שְׂנוּאָ֣ה אָנֹ֔כִי וַ/יִּתֶּן לִ֖/י גַּם אֶת זֶ֑ה וַ/תִּקְרָ֥א שְׁמ֖/וֹ שִׁמְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: id
  text: Lalu ia mengandung lagi dan melahirkan seorang anak laki-laki. Ia berkata, “Karena Yahweh telah mendengar bahwa aku dibenci[a], Ia juga telah memberikan anak ini kepadaku.” Maka ia menamai anak itu Simeon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak dicintai” atau “kurang dicintai.” Kata Ibraninya secara harfiah berarti “dibenci”, tetapi dalam konteks ini dapat menunjukkan bahwa ia ditolak atau kurang dicintai dibandingkan dengan yang lain.
    reason: lexical_alternative
  - marker: b
    text: Nama Simeon terdengar seperti kata Ibrani yang berarti “mendengar”.
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Lalu ia mengandung lagi
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan עוֹד menyatakan pengulangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan sumber.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: Menyampaikan ילד + בן secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: כִּי שָׁמַע יְהוָה
  choice: Karena Yahweh telah mendengar
  rationale: כִּי memperkenalkan alasan yang diberikan Lea. Bentuk 'telah mendengar' menyatakan tindakan yang sudah terjadi dan hasilnya masih relevan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: bahwa aku dibenci
  rationale: שְׂנוּאָה secara leksikal berarti 'dibenci'. Terjemahan utama mempertahankan kekuatan ungkapan Ibrani, sementara kemungkinan makna relasional atau komparatif dijelaskan dalam catatan kaki.
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: Dia juga memberikan anak ini kepadaku
  rationale: גַּם dan אֶת זֶה menyatakan tambahan, yakni anak yang baru lahir. Penyebutan 'anak' membuat rujukannya alami dan jelas dalam bahasa Indonesia.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Maka ia menamai anak itu
  rationale: Mengungkapkan idiom Ibrani 'memanggil namanya' dengan bentuk Indonesia yang alami tanpa kehilangan fungsi formula penamaan.
- source_word: שִׁמְעוֹן
  choice: Simeon
  rationale: Memakai bentuk nama yang lazim dalam Alkitab bahasa Indonesia; permainan bunyinya dengan kata Ibrani untuk 'mendengar' dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Gambaran Lea tentang kedudukannya dalam hubungannya dengan Yakub
  choice: aku dibenci
  alternative: aku tidak dicintai; aku kurang dicintai
  rationale: Teks memakai kata kuat שְׂנוּאָה. Konteks dapat menunjukkan penolakan atau kasih yang lebih kecil secara relatif, tetapi teks utama mempertahankan daya leksikal dan ketegangan naratif sumber.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks secara langsung memakai Tetragramaton. Bentuk 'Yahweh' mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan kekuatan kata 'dibenci' dan permainan nama Simeon tetap dipertahankan melalui catatan kaki.
