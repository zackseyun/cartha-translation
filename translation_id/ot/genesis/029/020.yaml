  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: id
  text: Yakub bekerja selama tujuh tahun untuk Rahel, dan tahun-tahun itu terasa baginya seperti hanya beberapa hari karena cintanya kepada Rahel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: bekerja
  rationale: Dalam konteks ini עבד menunjuk pada pekerjaan yang dilakukan Yakub sebagai kewajiban untuk memperoleh Rahel sebagai istri. 'Bekerja' lebih alami dalam bahasa Indonesia modern daripada 'melayani', sementara hubungan kontraktualnya dijelaskan oleh konteks dan frasa berikutnya.
- source_word: בְּרָחֵל
  choice: untuk mendapatkan Rahel
  rationale: Preposisi ב di sini menandai pihak yang demi atau sebagai imbalan untuknya pekerjaan itu dilakukan. 'Untuk mendapatkan Rahel' menyampaikan maksud perjanjian perkawinan secara jelas tanpa memberi kesan bahwa Yakub bekerja melayani Rahel secara langsung.
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: Ungkapan waktu ini diterjemahkan secara langsung; 'selama' membuat durasi pekerjaan jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: tahun-tahun itu terasa baginya
  rationale: Ungkapan harfiah 'di matanya' menyatakan persepsi subjektif. 'Terasa baginya' menyampaikan idiom tersebut secara wajar dan tetap mempertahankan sudut pandang Yakub.
- source_word: כְּיָמִים אֲחָדִים
  choice: seperti beberapa hari saja
  rationale: אֲחָדִים dalam konstruksi ini berarti 'beberapa'. Partikel 'saja' secara alami mengungkapkan kesan singkat yang dimaksud tanpa mengubah perbandingan Ibraninya.
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: karena cintanya kepada Rahel
  rationale: Prefiks ב menyatakan sebab atau keadaan yang melatarbelakangi persepsi Yakub. Nama 'Rahel' diulangi agar rujukan jelas dan kalimat tetap alami dalam bahasa Indonesia.
