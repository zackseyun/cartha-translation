  source_fidelity: 'Terjemahan dengan setia mempertahankan urutan dan daya ujaran Ibrani: penanda perhatian (הֵן), idiom bahwa masih banyak waktu siang tersisa, pernyataan bahwa belum tiba waktu mengumpulkan ternak, serta dua perintah untuk memberi minum kawanan dan kemudian menggembalakannya. Pembedaan antara מִקְנֶה yang lebih luas (“ternak”) dan צֹאן, kawanan ternak kecil, juga terjaga secara memadai.'
  naturalness: Bahasanya modern, lugas, dan wajar dalam bahasa Indonesia. “Hari masih panjang,” “Belum waktunya ternak dikumpulkan,” dan “Berilah kawanan itu minum” jelas dan idiomatis. “Pergilah menggembalakannya” dapat merujuk secara kolektif kepada “kawanan itu” dan sesuai dengan konteks penggembalaan.
  terminology: “Ternak” tepat untuk מִקְנֶה; “kawanan” memadai untuk צֹאן tanpa secara tidak perlu membatasi rujukan kepada domba saja. “Menggembalakan” merupakan padanan yang baik bagi רעה dalam konteks membawa kawanan untuk makan rumput/dituntun.
