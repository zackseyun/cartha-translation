  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur perintah dipertahankan, demikian pula pembedaan antara istilah umum מִקְנֶה (“ternak”) dan istilah khusus kolektif צֹאן (“kawanan” ternak kecil).
