  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: id
  text: Lalu ia berkata, “Lihat, hari masih panjang. Belum waktunya ternak dikumpulkan. Berilah kawanan itu minum, lalu pergilah menggembalakannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Kata seru deiktis ini menarik perhatian pada keadaan yang sedang tampak; “Lihat” wajar dalam bahasa Indonesia modern dan mempertahankan daya wacananya.
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: hari masih panjang
  rationale: Ungkapan Ibrani harfiah menyatakan bahwa hari masih “besar/panjang,” yakni masih banyak waktu siang yang tersisa. Ungkapan Indonesia ini mempertahankan citra dan maksud temporalnya.
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: Belum waktunya ternak dikumpulkan
  rationale: עֵת menunjuk waktu yang tepat, הֵאָסֵף berbentuk pasif (“dikumpulkan”), dan מִקְנֶה merupakan istilah kolektif luas untuk hewan ternak.
- source_word: הַשְׁקוּ
  choice: Berilah ... minum
  rationale: Bentuk imperatif Hifil dari שׁקה berarti memberi minum atau menyebabkan minum. Pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: הַצֹּאן
  choice: kawanan itu
  rationale: צֹאן adalah istilah kolektif untuk ternak kecil, terutama domba dan kambing. “Kawanan” mempertahankan cakupan tersebut tanpa membatasinya hanya pada domba.
- source_word: וּלְכוּ רְעוּ
  choice: lalu pergilah menggembalakannya
  rationale: 'Dua bentuk imperatif ini menyatakan urutan tindakan: pergi sesudah memberi minum, kemudian membawa atau menjaga kawanan saat merumput. “Menggembalakannya” mencakup tindakan menuntun dan membiarkan ternak merumput.'
