language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: id
  text: Ia mengandung lagi dan melahirkan seorang anak laki-laki. Katanya, “Sekarang, kali ini suamiku akan berpaut kepadaku,[a] karena aku telah melahirkan tiga anak laki-laki baginya.” Oleh sebab itu, anak itu dinamai Lewi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan bergabung denganku” atau “akan melekat kepadaku.” Kata Ibrani ini berbunyi mirip dengan nama Lewi.
    reason: Menampilkan alternatif leksikal dan menjelaskan permainan kata yang tidak sepenuhnya dapat dipertahankan dalam terjemahan.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Ia mengandung lagi
  rationale: Mengungkapkan הרה dan עוֹד secara langsung dan wajar dalam narasi kelahiran bahasa Indonesia.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: Padanan alami bagi idiom Ibrani yang berarti melahirkan seorang putra.
- source_word: עַתָּה הַפַּעַם
  choice: Sekarang, kali ini
  rationale: Mempertahankan kedua unsur penegas עַתָּה dan הַפַּעַם tanpa menambahkan gagasan 'akhirnya' yang tidak tersurat.
- source_word: יִלָּוֶה
  choice: akan berpaut
  rationale: Bentuk Niphal dari לוה menyatakan menjadi terikat atau tergabung; 'berpaut' cocok untuk kedekatan relasional dan membantu mempertahankan permainan bunyi dengan Lewi.
- source_word: אִישִׁי אֵלַי
  choice: suamiku akan berpaut kepadaku
  rationale: Dalam konteks perkawinan אִישִׁי berarti 'suamiku', sedangkan אֵלַי menunjukkan arah 'kepadaku'.
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: karena aku telah melahirkan tiga anak laki-laki baginya
  rationale: Menjaga hubungan alasan, relevansi kini dari tindakan yang selesai, pronomina לוֹ, dan jumlah tiga anak laki-laki.
- source_word: עַל כֵּן
  choice: Oleh sebab itu
  rationale: Ungkapan Indonesia yang jelas dan bermartabat untuk rumus penjelasan pemberian nama.
- source_word: קָרָא שְׁמוֹ
  choice: anak itu dinamai
  rationale: Verba maskulin tunggal tidak menyebut subjek penama secara eksplisit. Bentuk pasif menghindari penentuan apakah penamanya laki-laki atau perempuan; 'anak itu' membuat rujukan pronominal alami dalam bahasa Indonesia.
- source_word: לֵוִי
  choice: Lewi
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia dan mempertahankan kaitannya dengan permainan kata Ibrani.
theological_decisions:
- issue: Permainan kata antara יִלָּוֶה dan לֵוִי
  choice: Memakai 'berpaut' dalam teks dan menjelaskan hubungan bunyinya dengan nama Lewi dalam catatan kaki.
  alternative: akan bergabung denganku / akan melekat kepadaku
  rationale: Teks menghubungkan harapan Lea tentang kedekatan suaminya dengan penamaan Lewi. Terjemahan perlu mempertahankan hubungan itu tanpa mengubahnya menjadi pernyataan doktrinal atau memastikan nuansa yang lebih sempit daripada bahasa sumber.
- issue: Subjek dalam קָרָא שְׁמוֹ
  choice: Menggunakan konstruksi pasif 'anak itu dinamai'.
  alternative: ia menamainya / Lea menamainya / suaminya menamainya
  rationale: Bahasa Ibrani memakai verba maskulin tunggal tanpa subjek eksplisit. Bentuk pasif mempertahankan ketidakjelasan identitas pemberi nama.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya naratif yang sederhana dan bermartabat. 'Berpaut' sedikit lebih tinggi daripada bahasa percakapan, tetapi tetap mudah dipahami dan berguna untuk mempertahankan nuansa relasional serta permainan kata. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
