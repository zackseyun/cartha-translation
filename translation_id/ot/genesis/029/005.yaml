  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Apakah kalian mengenal Laban, putra Nahor?” Mereka menjawab, “Kami mengenalnya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “Kami mengenal”; objek “dia” tersirat dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Ia berkata kepada mereka
  rationale: Bentuk naratif וַיֹּאמֶר melanjutkan rangkaian peristiwa. Kata ganti “Ia” mempertahankan subjek tersirat dari konteks, sedangkan לָהֶם berarti “kepada mereka”.
- source_word: הֲיְדַעְתֶּם
  choice: Apakah kalian mengenal
  rationale: Dalam konteks ini, ידע menanyakan apakah para gembala mengenal seseorang. “Mengenal” menyampaikan makna hubungan atau perkenalan pribadi secara alami dalam bahasa Indonesia.
- source_word: לָבָן
  choice: Laban
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן נָחוֹר
  choice: anak Nahor
  rationale: בֶּן secara langsung berarti “anak laki-laki/anak”; “anak Nahor” merupakan pengenal genealogis yang alami dan tidak memperluasnya menjadi “keturunan”.
- source_word: וַיֹּאמְרוּ יָדָעְנוּ
  choice: Mereka menjawab, “Kami mengenalnya”
  rationale: Dalam dialog bahasa Indonesia, “menjawab” secara alami menyampaikan fungsi וַיֹּאמְרוּ sebagai tanggapan. Bentuk “mengenalnya” mengulang makna akar ידע dan menyatakan objek yang tersirat dalam bahasa Ibrani.
