  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: id
  text: Ia mengandung lagi dan melahirkan seorang anak laki-laki. Ia berkata, “Kali ini aku akan memuji Yahweh.” Oleh karena itu, ia menamai anak itu Yehuda.[a] Sesudah itu, ia tidak lagi melahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama *Yehuda* terdengar mirip dengan kata kerja Ibrani yang berarti “memuji” atau “mengucap syukur.”
    reason: Menjelaskan permainan bunyi dalam bahasa Ibrani antara nama יְהוּדָה dan kata kerja ידה, yang tidak dapat dipertahankan sepenuhnya dalam terjemahan Indonesia.
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: Ia mengandung lagi
  rationale: Kata הרה menyatakan mengandung atau menjadi hamil, sedangkan עוֹד menandai pengulangan dalam rangkaian kelahiran ini. Ungkapan ini alami dan ringkas dalam narasi Indonesia.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: Ungkapan ini menyatakan kelahiran seorang putra. 'Anak laki-laki' lebih alami bagi pembaca Indonesia modern daripada 'putra' dalam konteks naratif ini.
- source_word: הַפַּעַם
  choice: Kali ini
  rationale: Frasa ini menunjuk pada peristiwa sekarang dengan membandingkannya secara tersirat dengan kelahiran-kelahiran sebelumnya, tanpa menambahkan nuansa 'akhirnya' yang tidak dinyatakan.
- source_word: אוֹדֶה
  choice: aku akan memuji
  rationale: Bentuk hiphil dari ידה dapat berarti memuji atau mengucap syukur. 'Akan memuji' mempertahankan bentuk deklaratif dan kaitan bunyinya dengan nama Yehuda.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עַל כֵּן
  choice: Oleh karena itu
  rationale: Ungkapan ini memperjelas hubungan sebab-akibat antara pernyataan perempuan itu dan pemberian nama kepada anaknya.
- source_word: קָרְאָה שְׁמוֹ
  choice: ia menamai anak itu
  rationale: Ini merupakan padanan Indonesia yang idiomatis bagi ungkapan harfiah 'ia menyebut namanya', dengan acuan objek yang tetap jelas.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama Ibrani ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; catatan kaki menjelaskan permainan bunyi dengan kata kerja ידה.
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: Sesudah itu, ia berhenti melahirkan anak
  rationale: Konstruksi עמד dengan מן dan infinitif menyatakan berhentinya suatu kegiatan. Padanan ini lengkap dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
- issue: Cakupan makna אוֹדֶה
  choice: aku akan memuji
  alternative: aku akan mengucap syukur kepada
  rationale: Kata ידה dalam bentuk ini dapat mencakup pujian dan ucapan syukur. 'Memuji' sesuai dengan konteks penamaan dan permainan bunyi, sementara alternatifnya dicatat agar keluasan makna tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan naratif yang mudah dipahami. Penanda catatan kaki ditempatkan pada nama Yehuda karena catatan tersebut menjelaskan permainan kata pada nama itu.
