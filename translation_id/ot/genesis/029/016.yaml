  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel 'nama ... dan nama ...' dipertahankan, sementara konstruksi kepemilikan Ibrani dialihkan secara idiomatis. Tidak diperlukan catatan kaki karena konstruksi tersebut dapat diterjemahkan jelas tanpa kehilangan ambiguitas penting.
