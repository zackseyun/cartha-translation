base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: id
  text: Laban mempunyai dua anak perempuan; nama yang lebih tua ialah Lea, dan nama yang lebih muda ialah Rahel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְלָבָן
  choice: Laban mempunyai
  rationale: Konstruksi kepemilikan Ibrani yang secara harfiah berarti 'dan bagi Laban [ada]' secara alami menyatakan bahwa Laban mempunyai sesuatu. Konjungsi waw tidak perlu diberi penanda waktu seperti 'pada waktu itu'.
- source_word: שְׁתֵּי בָנוֹת
  choice: dua anak perempuan
  rationale: Padanan langsung dan alami untuk frasa bilangan dengan nomina ini.
- source_word: שֵׁם
  choice: nama ... adalah
  rationale: Pengulangan rumus identifikasi 'nama' dipertahankan pada kedua klausa agar kesejajaran struktur Ibrani tetap tampak.
- source_word: הַגְּדֹלָה
  choice: yang sulung
  rationale: Dalam konteks dua saudari, kata ini menunjuk kepada yang lebih tua; 'yang sulung' alami karena hanya ada dua anak perempuan dan menandai urutan kelahiran.
- source_word: לֵאָה
  choice: Lea
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְשֵׁם
  choice: dan nama
  rationale: Konjungsi dan rumus nominal yang diulang dipertahankan untuk mencerminkan kesejajaran sumber.
- source_word: הַקְּטַנָּה
  choice: yang bungsu
  rationale: Dalam konteks saudari kandung, kata ini berarti yang lebih muda, bukan lebih kecil secara fisik; 'yang bungsu' merupakan pasangan alami bagi 'yang sulung' ketika hanya dua anak disebut.
- source_word: רָחֵל
  choice: Rahel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
