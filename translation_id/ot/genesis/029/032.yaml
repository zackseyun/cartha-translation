id: GEN.29.32
reference: Genesis 29:32
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: id
  text: Lea mengandung dan melahirkan seorang anak laki-laki. Ia menamainya Ruben,[a] sebab ia berkata, “Karena Yahweh telah melihat penderitaanku, sekarang suamiku akan mencintaiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ruben berbunyi mirip dengan ungkapan Ibrani yang berarti “lihat, seorang anak laki-laki” dan di sini dikaitkan dengan perkataan Lea bahwa Yahweh “telah melihat” penderitaannya.
    reason: Permainan kata Ibrani antara רְאוּבֵן (Ruben), רְאוּ בֵן ('lihat, seorang anak laki-laki'), dan רָאָה ('telah melihat') tidak dapat dipertahankan sepenuhnya dalam terjemahan utama.
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Kata kerja הרה menyatakan mulai hamil atau mengandung; bentuk ini ringkas dan alami dalam narasi kelahiran Indonesia.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Ungkapan ילד dengan בֵּן adalah ungkapan baku tentang kelahiran anak laki-laki; terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Ia menamainya
  rationale: Ini menyampaikan rumus pemberian nama Ibrani secara alami tanpa mengaburkankan hubungan dengan permainan kata yang dijelaskan dalam catatan kaki.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; permainan bunyinya dengan kata 'melihat' dijelaskan dalam catatan kaki.
- source_word: כִּי אָמְרָה
  choice: sebab katanya
  rationale: כִּי memperkenalkan alasan pemberian nama; 'sebab katanya' mempertahankan hubungan penjelasannya dengan ringkas.
- source_word: כִּי רָאָה יְהוָה
  choice: Yahweh telah melihat
  rationale: Bentuk perfektif רָאָה secara alami diterjemahkan 'telah melihat', dengan hasil tindakan itu menjadi dasar harapan Lea.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּעָנְיִי
  choice: penderitaanku
  rationale: עֳנִי dapat menunjuk pada kesengsaraan, penderitaan, atau keadaan tertindas; 'penderitaanku' alami, berbobot, dan sesuai dengan konteks penolakan yang dialami Lea.
- source_word: כִּי עַתָּה
  choice: Sekarang
  rationale: Dalam klausa kedua, כִּי dapat dipahami sebagai penegas atau penghubung yang tidak perlu dinyatakan tersendiri dalam bahasa Indonesia; עַתָּה jelas menandai harapan baru Lea.
- source_word: יֶאֱהָבַנִי אִישִׁי
  choice: suamiku akan mencintaiku
  rationale: אִישִׁי berarti 'suamiku' dalam konteks perkawinan, dan bentuk imperfektif יֶאֱהָבַנִי menyatakan harapan Lea mengenai masa sesudah kelahiran anak itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Kekuatan pernyataan Lea tentang kasih suaminya
  choice: suamiku akan mencintaiku
  alternative: tentulah sekarang suamiku akan mencintaiku
  rationale: Teks menyatakan harapan atau keyakinan Lea, tetapi tidak mengharuskan penambahan penegas 'tentulah'. Terjemahan mempertahankan ketegangan naratif tanpa memastikan bahwa harapan itu akan terpenuhi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama ilahi, alur sebab-akibat, harapan emosional Lea, dan permainan kata pemberian nama dipertahankan sejauh mungkin.
