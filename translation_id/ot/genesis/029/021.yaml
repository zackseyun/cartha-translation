  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב אֶל לָבָן֙ הָבָ֣/ה אֶת אִשְׁתִּ֔/י כִּ֥י מָלְא֖וּ יָמָ֑/י וְ/אָב֖וֹאָה אֵלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/021.yaml
  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: id
  text: Kemudian Yakub berkata kepada Laban, “Berikanlah istriku kepadaku, sebab waktuku sudah genap, supaya aku dapat masuk kepadanya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “masuk kepadanya”; ungkapan halus untuk menggenapi pernikahan melalui hubungan suami istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Berikanlah ... kepadaku
  rationale: Bentuk permintaan/perintah kepada Laban. Unsur ‘kepadaku’ dibuat eksplisit agar wajar dalam bahasa Indonesia dan sesuai dengan konteks penyerahan pengantin.
- source_word: אֶת אִשְׁתִּי
  choice: istriku
  rationale: אִשָּׁה dapat berarti ‘perempuan’ atau ‘istri’; dalam konteks perjanjian pernikahan dan masa kerja yang telah diselesaikan, ‘istriku’ paling tepat.
- source_word: כִּי מָלְאוּ יָמָי
  choice: sebab waktuku sudah genap
  rationale: Secara harfiah, ‘hari-hariku telah penuh/genap’, yakni masa yang telah disepakati. ‘Waktuku sudah genap’ mempertahankan gambaran penggenapan tanpa menambahkan ‘masa kerja’ ke dalam teks utama.
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: supaya aku dapat menghampirinya
  rationale: בוא אל merupakan ungkapan halus Ibrani untuk hubungan seksual dalam rangka menggenapi pernikahan. ‘Menghampirinya’ mempertahankan kesantunan dan maksud tujuan klausa tersebut dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Waktuku sudah genap’ mempertahankan idiom sumber secara wajar, sedangkan ‘menghampirinya’ menjaga sifat eufemistis teks Ibrani. Penanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskan.
