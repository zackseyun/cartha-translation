  text: While he was still speaking with them[a], Rachel came with her father’s flock, for she was a shepherdess.
translation:
  language: id
  text: Ketika Yakub masih berbicara dengan mereka, Rahel datang bersama kawanan ternak milik ayahnya, sebab ia seorang penggembala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab ia seorang penggembala perempuan.” Bentuk partisip Ibrani yang menerangkan Rahel adalah feminin dan menyatakan perannya sebagai orang yang menggembalakan kawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: Ketika Yakub masih berbicara dengan mereka
  rationale: Ungkapan dengan partisip menandakan tindakan yang sedang berlangsung ketika peristiwa berikutnya terjadi. Nama Yakub dipakai untuk memperjelas rujukan pronomina maskulin yang tersirat dalam bahasa Ibrani.
- source_word: וְרָחֵל בָּאָה
  choice: Rahel datang
  rationale: Bentuk naratif בָּאָה melanjutkan alur dengan menyatakan kedatangan Rahel; 'datang' merupakan padanan Indonesia yang alami.
- source_word: עִם הַצֹּאן אֲשֶׁר לְאָבִיהָ
  choice: bersama kawanan ternak milik ayahnya
  rationale: צֹאן dapat mencakup domba dan kambing, sehingga 'kawanan ternak' lebih aman daripada membatasinya menjadi kawanan domba. Klausa kepemilikan dipertahankan secara eksplisit.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan mengapa Rahel datang bersama kawanan tersebut.
- source_word: רֹעָה הִוא
  choice: dialah yang menggembalakannya
  rationale: Partisip feminin menyatakan peran atau kegiatan Rahel sebagai penggembala. Susunan ini alami dalam bahasa Indonesia, mempertahankan penekanan pronomina הִוא, dan tidak memerlukan bentuk nomina bergender.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku-modern dengan gaya naratif yang wajar dan bermartabat. Nama רָחֵל ditulis 'Rahel' menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
