  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: id
  text: Ketika pagi tiba, ternyata itu Lea. Yakub berkata kepada Laban, “Apa yang telah kaulakukan kepadaku ini? Bukankah aku bekerja padamu untuk Rahel? Jadi, mengapa engkau menipuku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Ketika pagi tiba
  rationale: Mengungkapkan penanda waktu Ibrani secara alami dalam bahasa Indonesia tanpa menambah rincian.
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: ternyata perempuan itu Lea
  rationale: ‘Ternyata’ menyampaikan daya kejut הִנֵּה dalam konteks penemuan mendadak; ‘perempuan itu’ mempertahankan pronomina feminin הִוא dan membuat rujukannya jelas secara alami.
- source_word: בְרָחֵל עָבַדְתִּי עִמָּךְ
  choice: untuk mendapatkan Rahel aku bekerja padamu
  rationale: Preposisi בְּ menunjukkan bahwa Rahel adalah imbalan atau tujuan kerja Yakub; ‘bekerja padamu’ merupakan ungkapan Indonesia yang wajar untuk עבד עם dalam konteks pelayanan kerja.
- source_word: רִמִּיתָנִי
  choice: engkau menipuku
  rationale: Menerjemahkan tindakan memperdaya atau menipu secara langsung dan sesuai dengan tuduhan Yakub.
