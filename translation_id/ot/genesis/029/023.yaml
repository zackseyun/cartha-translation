  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: id
  text: Ketika hari sudah petang, Laban mengambil Lea, anak perempuannya, lalu membawanya kepada Yakub. Yakub pun menghampiri Lea[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang secara harfiah berarti “ia masuk kepada perempuan itu” merupakan ungkapan halus yang lazim untuk hubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Ketika hari sudah petang
  rationale: Ungkapan ini menetapkan waktu peristiwa dalam rangkaian narasi. Bentuk Indonesia ini alami dan mempertahankan arti 'pada waktu petang'.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata לקח di sini menyatakan tindakan membawa Lea untuk malam perkawinan; 'mengambil' mempertahankan ungkapan narasi tanpa menambahkan motif.
- source_word: לֵאָה בִתּוֹ
  choice: Lea, anak perempuannya
  rationale: Aposisi Ibrani dipertahankan secara alami dalam bahasa Indonesia dan memperjelas hubungan Lea dengan pelaku, yakni Laban.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: lalu membawanya kepada Yakub
  rationale: Bentuk Hifil dari בוא berarti 'membawa'. Nama Yakub dipakai untuk menjernihkan rujukan pronomina dalam bahasa Indonesia tanpa mengubah referennya.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Yakub pun menghampiri Lea
  rationale: Secara harfiah ungkapan ini berarti 'masuk/datang kepada dia', tetapi dalam konteks ini merupakan ungkapan halus konvensional untuk hubungan seksual. 'Menghampiri' menjaga sifat eufemistisnya; catatan kaki menjelaskan maknanya.
