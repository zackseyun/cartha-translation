  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: id
  text: Laban berkata, “Di tempat kami tidak biasa orang menikahkan anak perempuan yang lebih muda sebelum yang sulung.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָבָן
  choice: Laban berkata
  rationale: Bentuk naratif וַיֹּאמֶר paling wajar diterjemahkan dengan ‘berkata’; nama לָבָן ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: tidak biasa orang
  rationale: Bentuk pasif impersonal ini menyatakan kebiasaan atau praktik sosial, bukan ketidakmungkinan. Ungkapan ‘tidak biasa orang’ menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: בִּמְקוֹמֵנוּ
  choice: di tempat kami
  rationale: Mempertahankan gambaran konkret ‘tempat kami’ sekaligus dapat dipahami sebagai lingkungan atau daerah tempat adat itu berlaku.
- source_word: לָתֵת
  choice: menikahkan
  rationale: Secara harfiah berarti ‘memberikan’, tetapi dalam konteks ini objeknya adalah anak perempuan yang diberikan dalam pernikahan. ‘Menikahkan’ mengungkapkan makna kontekstual secara jelas dan alami.
- source_word: הַצְּעִירָה
  choice: anak perempuan yang lebih muda
  rationale: Adjektiva feminin ini digunakan secara substantival. Penyebutan ‘anak perempuan’ memperjelas rujukannya yang tersirat dalam bahasa Ibrani.
- source_word: לִפְנֵי
  choice: sebelum
  rationale: Menandai urutan atau prioritas, sehingga ‘sebelum’ merupakan padanan langsung dan alami.
- source_word: הַבְּכִירָה
  choice: yang sulung
  rationale: Bentuk feminin בְּכִירָה menunjuk kepada anak perempuan sulung. ‘Yang sulung’ mempertahankan penekanan pada urutan kelahiran dan membentuk kontras alami dengan ‘yang lebih muda’.
