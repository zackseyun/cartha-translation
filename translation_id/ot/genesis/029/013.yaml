  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: id
  text: Ketika Laban mendengar kabar tentang Yakub[a], keponakannya[b], ia berlari menemui Yakub, memeluk dan menciumnya, lalu membawanya ke rumahnya. Kemudian Yakub menceritakan semua hal itu kepada Laban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “laporan mengenai Yakub.” Ungkapan Ibrani menunjuk pada kabar atau laporan tentang Yakub.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak laki-laki saudara perempuannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: ketika ... mendengar
  rationale: Kata depan כ dengan bentuk infinitif konstruk שׁמע membentuk klausa waktu. ‘Ketika ... mendengar’ alami dalam bahasa Indonesia dan tidak melebih-lebihkan kesegeraan tindakan.
- source_word: שֵׁמַע יַעֲקֹב
  choice: kabar tentang Yakub
  rationale: שֵׁמַע di sini berarti kabar atau laporan mengenai Yakub, bukan sekadar tindakan mendengar.
- source_word: בֶּן אֲחֹתוֹ
  choice: keponakannya
  rationale: Dalam bahasa Indonesia modern, ‘keponakannya’ paling alami; catatan kaki mempertahankan keterangan Ibrani yang lebih spesifik bahwa Yakub adalah anak laki-laki saudara perempuan Laban.
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: ia berlari menemui Yakub
  rationale: לִקְרָאתוֹ berarti pergi untuk bertemu atau menyongsongnya. Nama Yakub diulang agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: וַיְחַבֶּק לוֹ וַיְנַשֶּׁק לוֹ
  choice: memeluk dan menciumnya
  rationale: Terjemahan langsung ini sesuai dengan sambutan kekeluargaan dalam konteks tanpa menambahkan nuansa lain.
- source_word: וַיְבִיאֵהוּ אֶל בֵּיתוֹ
  choice: membawanya ke rumahnya
  rationale: Bentuk kausatif בוא berarti ‘membawa’, dan אֶל בֵּיתוֹ berarti ‘ke rumahnya’. Subjek rangkaian tindakan tetap Laban.
- source_word: וַיְסַפֵּר לְלָבָן
  choice: Kemudian Yakub menceritakan ... kepada Laban
  rationale: Subjek verba Ibrani tidak dinyatakan, tetapi secara kontekstual adalah Yakub. Menyebut namanya memperjelas pergantian subjek dari Laban kepada Yakub.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua hal itu
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal-hal. Dalam konteks ini ungkapan tersebut merujuk luas pada hal-hal yang Yakub ceritakan.
