  register: Bahasa naratif modern, jelas, dan bermartabat. Nama Yakub disebut kembali untuk menghindari ketidakjelasan rujukan, sedangkan hubungan kekerabatan diringkas secara alami sebagai ‘keponakannya’ dengan rincian harfiah dalam catatan kaki.
