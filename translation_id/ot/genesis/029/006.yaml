  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: id
  text: Ia bertanya kepada mereka, “Apakah ia baik-baik saja?”[a] Mereka menjawab, “Ia baik-baik saja. Lihat, Rahel, anak perempuan Laban, sedang datang bersama kawanan ternak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah keadaannya baik?” Kata Ibrani syalom di sini merujuk pada keadaan atau kesejahteraan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: Apakah ia baik-baik saja?
  rationale: Ungkapan ini menanyakan keadaan atau kesejahteraan Laban, bukan kedamaian dalam arti abstrak. Bentuk ini alami dalam bahasa Indonesia modern.
- source_word: שָׁלוֹם
  choice: Ia baik-baik saja
  rationale: Jawaban tersebut menggemakan pertanyaan sebelumnya dan menegaskan bahwa keadaan Laban baik.
- source_word: וְהִנֵּה
  choice: Lihat
  rationale: Kata ini mengarahkan perhatian kepada sesuatu yang tampak pada saat itu; “Lihat” mempertahankan daya penunjuknya secara alami.
- source_word: רָחֵל
  choice: Rahel
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִּתּוֹ
  choice: anak perempuannya
  rationale: Akhiran pronominal merujuk kepada Laban dan hubungan keluarganya dipertahankan secara eksplisit.
- source_word: בָּאָה
  choice: sedang datang
  rationale: Bentuk ini menggambarkan tindakan yang sedang terlihat berlangsung dalam adegan tersebut.
- source_word: עִם הַצֹּאן
  choice: bersama kawanan ternak
  rationale: צֹאן adalah sebutan kolektif bagi ternak kecil, biasanya domba dan kambing; “kawanan ternak” menghindari pembatasan yang tidak dinyatakan oleh teks.
