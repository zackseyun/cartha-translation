translation:
  language: id
  text: Setelah peristiwa-peristiwa itu, istri tuannya mengarahkan pandangannya kepada Yusuf[a] dan berkata, “Tidurlah denganku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengangkat matanya kepada Yusuf,” sebuah ungkapan yang dalam konteks ini menunjukkan perhatian yang terarah dan penuh hasrat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah semua itu
  rationale: Ungkapan ini memperkenalkan perkembangan berikutnya dalam narasi. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan arti harfiah ‘sesudah hal-hal ini’.
- source_word: וַתִּשָּׂא ... אֶת עֵינֶיהָ אֶל
  choice: memandang ... dengan penuh hasrat
  rationale: Secara harfiah, idiom Ibrani ini berarti ‘mengangkat matanya kepada’. Dalam konteks ajakan seksual yang langsung menyusul, ungkapan itu menunjukkan perhatian yang terarah dan berhasrat, bukan sekadar melihat.
- source_word: אֵשֶׁת אֲדֹנָיו
  choice: istri tuannya
  rationale: Rangkaian konstruksi ini menyebut perempuan tersebut berdasarkan hubungannya dengan tuan Yusuf. Bentuk ini ringkas, alami, dan mempertahankan rujukan posesifnya.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: ‘Yusuf’ adalah bentuk nama Ibrani yang telah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שִׁכְבָה עִמִּי
  choice: Tidurlah denganku
  rationale: Perintah ini merupakan ajakan seksual langsung. Dalam bahasa Indonesia modern, ‘tidur dengan’ menyampaikan makna seksualnya secara alami dan jelas tanpa menambahkan rincian yang tidak ada dalam teks.
