translation_notes:
  register: 'Bahasa Indonesia modern yang lugas dan bermartabat. Nama “Yusuf” dan sebutan “perempuan itu” digunakan untuk menghindari ketidakjelasan pronomina, sedangkan pengulangan “pakaiannya” mempertahankan kaitan naratif dengan teks Ibrani. Penanda catatan kaki ditempatkan pada unsur yang benar: [a] untuk pakaian dan [b] untuk ajakan seksual.'
