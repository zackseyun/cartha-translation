  text: Then she grabbed him by his garment[a], saying[b], “Lie with me!” But he left his garment in her hand and fled and went outside.
translation:
  language: id
  text: Lalu perempuan itu memegang pakaian Yusuf[a] dan berkata, “Tidurlah denganku!”[b] Namun Yusuf meninggalkan pakaiannya di tangan perempuan itu, lalu melarikan diri dan keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah Yusuf”; kata Ibrani yang dipakai merupakan istilah umum untuk sehelai pakaian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Berbaringlah denganku!” Dalam konteks ini, ungkapan Ibrani tersebut merupakan ajakan untuk berhubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפְּשֵׂהוּ
  choice: mencengkeram Yusuf
  rationale: Kata תפשׂ menyatakan tindakan memegang dengan kuat. “Mencengkeram” menyampaikan tindakan fisik yang mendadak dan kuat; nama Yusuf dipakai agar rujukan pelaku dan sasaran tetap jelas dalam bahasa Indonesia.
- source_word: בְּבִגְדוֹ / בִּגְדוֹ
  choice: pada pakaiannya / pakaiannya
  rationale: בגד merupakan istilah umum untuk pakaian dan tidak menentukan jenisnya. “Pakaian” mempertahankan keluasan makna itu; “mencengkeram Yusuf pada pakaiannya” juga mempertahankan bahwa perempuan itu menangkap Yusuf dengan memegang pakaiannya.
- source_word: לֵאמֹר
  choice: sambil berkata
  rationale: Infinitif ini memperkenalkan ujaran langsung. “Sambil berkata” alami dalam bahasa Indonesia dan menunjukkan bahwa perkataan itu menyertai tindakan mencengkeram.
- source_word: שִׁכְבָה עִמִּי
  choice: Tidurlah denganku!
  rationale: Ungkapan שׁכב עם adalah ajakan seksual. “Tidurlah denganku” merupakan eufemisme seksual yang jelas dan alami dalam bahasa Indonesia modern, sementara arti harfiahnya dijelaskan dalam catatan kaki.
- source_word: וַיַּעֲזֹב
  choice: meninggalkan
  rationale: עזב di sini menyatakan bahwa Yusuf membiarkan pakaiannya tetap berada dalam genggaman perempuan itu. “Meninggalkan” mempertahankan bentuk ringkas narasi Ibrani.
- source_word: בְּיָדָהּ
  choice: di tangan perempuan itu
  rationale: יד secara harfiah berarti “tangan”. Penyebutan “perempuan itu” menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: נוס menyatakan pelarian yang mendesak. “Melarikan diri” mengungkapkan intensitas tindakan tersebut secara alami.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: ke luar
  rationale: יצא dengan החוצה menunjukkan gerak dari bagian dalam menuju luar. Setelah “melarikan diri”, “ke luar” menyampaikan arah itu tanpa pengulangan yang kaku.
