base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/004.yaml
  text: And Joseph found favor in his eyes and served him[c][b][a], and he appointed him over his house and put all that he had into his hand.
translation:
  language: id
  text: Yusuf mendapat perkenanan di mata tuannya dan melayani dia. Tuannya mengangkat Yusuf untuk mengurus rumah tangganya dan menyerahkan segala miliknya ke dalam tangan Yusuf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “ke dalam tangannya” berarti bahwa segala milik tuannya dipercayakan kepada wewenang dan pengurusan Yusuf.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְצָא ... חֵן בְּעֵינָיו
  choice: mendapat perkenanan di mata tuannya
  rationale: Mempertahankan ungkapan Ibrani ‘mendapat perkenanan di mata’ dalam bentuk yang masih wajar dalam bahasa Indonesia. ‘Tuannya’ memperjelas rujukan pronomina kepada Potifar berdasarkan konteks langsung.
- source_word: וַיְשָׁרֶת אֹתוֹ
  choice: melayani dia
  rationale: שרת di sini menunjuk pada pelayanan pribadi Yusuf kepada tuannya; ‘melayani’ merupakan padanan langsung dan alami.
- source_word: וַיַּפְקִדֵהוּ עַל בֵּיתוֹ
  choice: Tuannya mengangkat Yusuf untuk mengurus rumah tangganya
  rationale: Bentuk kausatif פקד menyatakan pemberian tugas atau wewenang pengawasan. ‘Rumah tangga’ menangkap cakupan בַּיִת sebagai seluruh urusan kediaman dan orang-orang di dalamnya, bukan hanya bangunan.
- source_word: וְכָל יֶשׁ־לוֹ
  choice: segala miliknya
  rationale: Menyampaikan secara ringkas cakupan menyeluruh dari segala sesuatu yang dimiliki Potifar.
- source_word: נָתַן בְּיָדוֹ
  choice: menyerahkan ... ke dalam tangan Yusuf
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang penyerahan sesuatu ke dalam tangan seseorang, sambil menyebut Yusuf agar rujukannya tidak rancu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama ‘Yusuf’ dan sebutan ‘tuannya’ diulang untuk menghindari rangkaian pronomina yang rancu dalam bahasa Indonesia, tanpa mengubah pelaku dalam teks sumber. Idiom ‘ke dalam tangan’ dipertahankan dan dijelaskan dalam catatan kaki.
