  text: And when he heard that I had raised my voice and cried out[b][a], he left his garment beside me and fled and went outside.
translation:
  language: id
  text: Ketika dia mendengar bahwa aku meninggikan suaraku dan berteriak[a], dia meninggalkan pakaiannya di dekatku[b], lalu melarikan diri dan keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengangkat suaraku dan berseru.”
    reason: lexical_alternative
  - marker: b
    text: Atau “meninggalkan pakaiannya bersamaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְשָׁמְעוֹ
  choice: Ketika dia mendengar
  rationale: Rumus naratif וַיְהִי dengan כְּ dan bentuk infinitif berfungsi sebagai anak kalimat waktu; terjemahan ini alami dalam bahasa Indonesia tanpa menghilangkan urutan peristiwa.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang didengarnya, sehingga 'bahwa' paling sesuai dengan sintaksis.
- source_word: הֲרִימֹתִי קוֹלִי
  choice: aku meninggikan suaraku
  rationale: Ungkapan ini cukup alami dalam bahasa Indonesia dan mempertahankan gambaran harfiah idiom Ibrani.
- source_word: וָאֶקְרָא
  choice: dan berteriak
  rationale: Dalam konteks tuduhan tentang seruan minta tolong, קרא menunjuk pada seruan keras; 'berteriak' menyampaikan urgensinya tanpa menambahkan isi seruan.
- source_word: וַיַּעֲזֹב בִּגְדוֹ
  choice: dia meninggalkan pakaiannya
  rationale: Bentuk tunggal בגד dipertahankan dengan 'pakaiannya', istilah Indonesia yang wajar dan tidak menentukan jenis pakaian secara berlebihan.
- source_word: אֶצְלִי
  choice: di sisiku
  rationale: Pilihan ini menyatakan kedekatan fisik sambil mempertahankan kemungkinan nuansa 'padaku/bersamaku' melalui catatan kaki.
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: נוס menyatakan tindakan lari untuk menyelamatkan diri atau menjauh dengan segera.
- source_word: וַיֵּצֵא הַחוּצָה
  choice: dan pergi ke luar
  rationale: Terjemahan ini mempertahankan unsur gerak dan arah keluar yang dinyatakan oleh verba serta bentuk berarah הַחוּצָה.
