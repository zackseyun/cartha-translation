  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian tindakan dipertahankan dengan 'lalu' agar alur naratif alami. Kata ganti 'dia' tidak menentukan gender secara gramatikal, tetapi rujukannya jelas dari konteks.
