revisions:
- from: Yahweh menyertai Yusuf[a], sehingga ia menjadi orang yang berhasil. Ia tinggal di rumah tuannya, orang Mesir itu.
  to: Yahweh menyertai Yusuf, dan ia menjadi orang yang berhasil[a]; ia berada di rumah tuannya, orang Mesir itu.
  rationale: Revisi mengganti konjungsi kausal dengan “dan” untuk mempertahankan koordinasi naratif sumber, mengganti “tinggal” dengan “berada” agar tidak mempersempit arti, dan memindahkan catatan alternatif leksikal ke frasa yang diterangkannya.
