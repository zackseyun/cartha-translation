base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/002.yaml
  text: Yahweh was with Joseph[a], and he became a successful man; and he was in the house of his Egyptian master.
translation:
  language: id
  text: Yahweh menyertai Yusuf, dan ia menjadi orang yang berhasil[a]; ia berada di rumah tuannya, orang Mesir itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “makmur.” Partisipel Ibrani ini dapat menunjuk pada seseorang yang berhasil atau makmur.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar Tuhan.
- source_word: אֶת יוֹסֵף
  choice: menyertai Yusuf
  rationale: Dalam konstruksi ini, אֶת menyatakan kehadiran Yahweh bersama Yusuf; 'menyertai' merupakan ungkapan Indonesia yang alami dan memuat nuansa kehadiran serta pertolongan.
- source_word: אִישׁ מַצְלִיחַ
  choice: orang yang berhasil
  rationale: אִישׁ merujuk kepada Yusuf, sedangkan partisipel מַצְלִיחַ menyatakan bahwa ia berhasil atau mengalami keberhasilan. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit makna pada kemakmuran materi.
- source_word: בְּבֵית אֲדֹנָיו
  choice: di rumah tuannya
  rationale: Mempertahankan arti konkret 'di rumah' dan menerjemahkan אֲדֹנָיו menurut hubungan kuasa dalam konteks perbudakan sebagai 'tuannya'.
- source_word: הַמִּצְרִי
  choice: orang Mesir itu
  rationale: Bentuk berartikel dapat dipahami sebagai keterangan aposisional bagi tuannya; susunan ini alami dalam bahasa Indonesia dan mempertahankan penandaan definit.
- source_word: וַיְהִי ... וַיְהִי ... וַיְהִי
  choice: menyertai ... sehingga ia menjadi ... Ia tinggal
  rationale: Mengalihkan rangkaian wayyiqtol ke alur naratif Indonesia yang wajar. 'Sehingga' menyatakan hubungan hasil yang tersirat antara penyertaan Yahweh dan keberhasilan Yusuf tanpa menghapus urutan klausa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Hubungan penyertaan Yahweh dengan keberhasilan Yusuf
  choice: sehingga ia menjadi orang yang berhasil
  alternative: dan ia menjadi orang yang berhasil
  rationale: Konteks dan urutan klausa mendukung nuansa hasil, tetapi terjemahan tidak menambahkan uraian tentang mekanisme berkat atau membatasi keberhasilan pada kekayaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Yahweh' dipertahankan sebagai nama ilahi; 'tuannya' mencerminkan relasi kuasa dalam konteks. Tanda titik membagi rangkaian klausa agar mudah dibaca tanpa mengubah isi pokok.
