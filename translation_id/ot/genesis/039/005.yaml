revisions:
- from: Sejak ia mengangkat Yusuf untuk mengurus rumahnya dan segala miliknya,[a] Yahweh memberkati rumah orang Mesir itu karena Yusuf. Berkat Yahweh ada atas segala miliknya,[b] baik yang di rumah maupun yang di ladang.
  to: Sejak saat ia menempatkan Yusuf untuk mengurus rumahnya dan segala miliknya,[a] Yahweh memberkati rumah orang Mesir itu karena Yusuf. Berkat Yahweh ada atas segala miliknya,[b] yang ada di rumah dan di ladang.
  rationale: Revisi memperjelas penanda waktu מֵאָז dan memakai "menempatkan" untuk הִפְקִיד, yang lebih dekat dengan tindakan menyerahkan Yusuf ke dalam tanggung jawab atas rumah dan milik tuannya. Bagian akhir disederhanakan menjadi "yang ada di rumah dan di ladang" agar tetap konkret dan dekat pada struktur sumber.
