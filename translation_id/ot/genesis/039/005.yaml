  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֡י מֵ/אָז֩ הִפְקִ֨יד אֹת֜/וֹ בְּ/בֵית֗/וֹ וְ/עַל֙ כָּל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית הַ/מִּצְרִ֖י בִּ/גְלַ֣ל יוֹסֵ֑ף וַ/יְהִ֞י בִּרְכַּ֤ת יְהוָה֙ בְּ/כָל אֲשֶׁ֣ר יֶשׁ ל֔/וֹ בַּ/בַּ֖יִת וּ/בַ/שָּׂדֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/005.yaml
  text: And from the time he appointed him over his house and over all that he had[a], Yahweh blessed the Egyptian’s house because of Joseph, and Yahweh’s blessing was on all that he had[b], in the house and in the field.
translation:
  language: id
  text: Sejak saat ia menempatkan Yusuf untuk mengurus rumahnya dan segala miliknya,[a] Yahweh memberkati rumah orang Mesir itu karena Yusuf. Berkat Yahweh ada atas segala miliknya,[b] yang ada di rumah dan di ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sejak saat itu, ketika ia memercayakan rumahnya dan segala miliknya kepada Yusuf.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “atas segala yang ada padanya, di rumah dan di ladang.”'
    reason: previous_rendering
lexical_decisions:
- source_word: מֵאָז
  choice: Sejak
  rationale: Menandai titik waktu sejak keadaan berikutnya mulai berlangsung; bentuk ini alami dalam bahasa Indonesia.
- source_word: הִפְקִיד אֹתוֹ בְּבֵיתוֹ וְעַל כָּל אֲשֶׁר יֶשׁ לוֹ
  choice: ia mengangkat Yusuf untuk mengurus rumahnya dan segala miliknya
  rationale: Bentuk Hifil הפקיד menyatakan pemberian tanggung jawab atau pengawasan. Nama 'Yusuf' dipakai untuk memperjelas rujukan pronomina yang dapat terasa kabur dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Mempertahankan arti langsung ברך dan penyandaran berkat itu kepada Yahweh, bukan hanya akibat berupa kemakmuran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: בֵּית הַמִּצְרִי
  choice: rumah orang Mesir itu
  rationale: Menerjemahkan konstruksi posesif secara alami; dalam konteks, 'rumah' dapat mencakup rumah tangga dan harta kediamannya.
- source_word: בִּגְלַל יוֹסֵף
  choice: karena Yusuf
  rationale: בגלל menandai sebab atau alasan secara langsung.
- source_word: בִּרְכַּת יְהוָה
  choice: Berkat Yahweh
  rationale: Mempertahankan konstruksi yang secara eksplisit menyatakan sumber berkat.
- source_word: בְּכָל אֲשֶׁר יֶשׁ לוֹ בַּבַּיִת וּבַשָּׂדֶה
  choice: atas segala miliknya, baik yang di rumah maupun yang di ladang
  rationale: Menyampaikan cakupan berkat atas seluruh milik orang Mesir itu, dalam ranah rumah dan ladang, sambil menjaga gambaran konkret teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Hubungan Yusuf dengan berkat atas rumah orang Mesir
  choice: karena Yusuf
  alternative: demi Yusuf
  rationale: בגלל secara langsung menyatakan sebab. Terjemahan ini tidak menentukan lebih jauh mekanisme atau dasar teologis berkat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mengurus' menyampaikan tanggung jawab administratif dengan jelas bagi pembaca umum. Penambahan 'baik ... maupun ...' memperjelas bahwa rumah dan ladang bersama-sama menunjukkan cakupan seluruh miliknya.
