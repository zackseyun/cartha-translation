base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/008.yaml
  text: But he refused and said to his master's wife[a], "Look, my master does not concern himself with what is in the house[c][b], and everything that belongs to him he has put into my hand."
translation:
  language: id
  text: Namun, Yusuf menolak dan berkata kepada istri tuannya, “Lihatlah, tuanku tidak mengurusi apa pun yang ada di rumah,[a] dan segala miliknya telah ia serahkan ke dalam tanganku.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tuanku tidak mengetahui bersamaku apa yang ada di rumah.” Ungkapan ini berarti bahwa tuannya menyerahkan urusan rumah tangga kepada Yusuf dan tidak mengurusinya sendiri.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah ia percayakan kepadaku.” Secara harfiah: “telah ia taruh ke dalam tanganku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: Namun, Yusuf menolak
  rationale: Kata kerja ini berarti ‘menolak’. ‘Namun’ menyampaikan pertentangan dengan ajakan pada ayat sebelumnya, sedangkan nama Yusuf dicantumkan agar subjek tetap jelas dan alami dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר אֶל־אֵשֶׁת אֲדֹנָיו
  choice: dan berkata kepada istri tuannya
  rationale: Terjemahan alami bagi frasa konstruksi Ibrani yang tetap mempertahankan hubungan Yusuf dengan tuannya.
- source_word: הֵן
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada penjelasan berikutnya; ‘Lihat’ merupakan padanan modern yang langsung dan wajar.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Dalam konteks rumah tangga ini, kata tersebut menunjuk kepada majikan Yusuf. ‘Tuanku’ menjaga nuansa hubungan sosial tanpa menyiratkan sebutan ilahi.
- source_word: לֹא יָדַע אִתִּי מַה בַּבָּיִת
  choice: tidak mengurusi apa pun yang ada di rumah ini karena aku yang menanganinya
  rationale: Ungkapan harfiahnya, ‘tidak mengetahui bersamaku apa yang ada di rumah’, menyatakan bahwa sang tuan menyerahkan urusan rumah kepada Yusuf dan karena itu tidak perlu menanganinya sendiri. Rumusan ini menyampaikan makna idiomatis tanpa mempertahankan susunan yang kabur dalam bahasa Indonesia.
- source_word: וְכֹל אֲשֶׁר יֶשׁ־לוֹ
  choice: segala miliknya
  rationale: Frasa ini mencakup seluruh kepunyaan tuan Yusuf; bentuk ini ringkas dan alami.
- source_word: נָתַן בְּיָדִי
  choice: telah diserahkannya ke dalam tanganku
  rationale: Pilihan ini mempertahankan gambaran konkret bahasa Ibrani tentang penyerahan ke dalam tangan seseorang, yang menunjukkan kepercayaan sekaligus wewenang.
