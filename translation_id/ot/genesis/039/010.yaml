  text: וַ/יְהִ֕י כְּ/דַבְּרָ֥/הּ אֶל יוֹסֵ֖ף י֣וֹם י֑וֹם וְ/לֹא שָׁמַ֥ע אֵלֶ֛י/הָ לִ/שְׁכַּ֥ב אֶצְלָ֖/הּ לִ/הְי֥וֹת עִמָּֽ/הּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/010.yaml
  text: And it happened[a], as she spoke to Yosef day after day, that he did not listen to her, to lie beside her or to be with her.
translation:
  language: id
  text: 'Maka, ketika perempuan itu berbicara kepada Yusuf hari demi hari, Yusuf tidak mengindahkannya: ia tidak mau berbaring di dekatnya[a] atau berada bersamanya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbaring dengannya.” Dalam konteks ini, ungkapan Ibrani dapat bermakna seksual. “Berbaring di dekatnya” mempertahankan ungkapan kedekatan dalam teks Ibrani, sementara frasa berikutnya, “berada bersamanya,” tetap memiliki tekanannya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבְּרָהּ
  choice: Ketika perempuan itu berbicara
  rationale: וַיְהִי melanjutkan alur narasi, sedangkan כְּדַבְּרָהּ membentuk keterangan waktu. Dalam bahasa Indonesia, 'ketika' menyampaikan hubungan ini secara alami tanpa ungkapan pembuka yang kaku.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk 'Yusuf' merupakan transliterasi Ibrani yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Pengulangan kata יוֹם menyatakan tindakan yang terus berulang; 'hari demi hari' mempertahankan tekanan pada kegigihan perempuan itu.
- source_word: וְלֹא שָׁמַע אֵלֶיהָ
  choice: Yusuf tidak mendengarkannya
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. 'Tidak mendengarkannya' mempertahankan keluasan makna dan, dalam konteks ini, menyiratkan penolakan.
- source_word: לִשְׁכַּב אֶצְלָהּ
  choice: untuk berbaring di sisinya
  rationale: שׁכב dapat berarti berbaring dan dalam konteks tertentu mengandung arti seksual, sedangkan אֵצֶל menunjuk kedekatan. Terjemahan ini mempertahankan gambaran ruang dan tidak meleburkannya dengan frasa berikutnya.
- source_word: לִהְיוֹת עִמָּהּ
  choice: atau berada bersamanya
  rationale: Secara harfiah berarti 'berada dengan dia'. Pilihan ini mempertahankan cakupan luasnya, yakni Yusuf menolak bukan hanya hubungan seksual, tetapi juga keberadaan yang dekat atau berkompromi dengannya.
theological_decisions:
- issue: Apakah לִשְׁכַּב אֶצְלָהּ harus dinyatakan secara eksplisit sebagai hubungan seksual
  choice: Memakai 'berbaring di sisinya' dalam teks utama dan menjelaskan kemungkinan makna seksual dalam catatan kaki.
  alternative: berhubungan seksual dengannya / tidur dengannya
  rationale: Konteks rayuan jelas memberi nuansa seksual, tetapi ungkapan Ibrani tetap memakai bahasa berbaring dan disusul frasa tersendiri, 'berada bersamanya'. Terjemahan dan catatan menjaga keduanya tanpa mempersempit teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Subjek 'Yusuf' diulang pada klausa utama agar rujukannya jelas. 'Perempuan itu' mempertahankan pronomina feminin dalam sumber tanpa menambahkan gelar yang tidak terdapat dalam ayat ini.
