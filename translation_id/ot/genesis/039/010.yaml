review_pass:
  verdict: revise
  source_fidelity: 'Draf pada dasarnya mencerminkan urutan dan dua frasa infinitif Ibrani: penolakan Yusuf terhadap perempuan itu, baik untuk berbaring dekat dengannya maupun untuk berada bersamanya. Namun, konstruksi Indonesia “tidak mendengarkannya untuk berbaring” tidak dapat secara wajar menyatakan hubungan antara שָׁמַע אֵלֶיהָ dan infinitif berikutnya. Kata kerja “mengindahkan” lebih tepat dalam konteks penolakan ajakan dan memungkinkan maksud klausa diterjemahkan dengan jelas.'
  naturalness: Perlu revisi sedang. “Untuk berbaring” setelah “tidak mendengarkannya” terdengar tidak idiomatis dan sementara dapat terbaca seolah-olah Yusuf tidak mendengarkan sambil berbaring. Penggunaan “ia tidak mau” menghasilkan kalimat modern dan jelas tanpa menambahkan rincian doktrinal atau naratif.
  terminology: “Yusuf” adalah bentuk nama yang baku dalam bahasa Indonesia. “Hari demi hari” tepat untuk יוֹם יוֹם. “Berbaring di dekatnya” secara lebih alami menyatakan אֶצְלָהּ daripada “di sisinya,” sambil mempertahankan kemungkinan nuansa seksual dalam catatan kaki. “Berada bersamanya” menjaga keluasan לִהְיוֹת עִמָּהּ.
  issues:
  - severity: medium
    issue: Hubungan sintaksis antara “tidak mendengarkannya” dan “untuk berbaring” tidak idiomatis dalam bahasa Indonesia.
    rationale: Dalam teks Ibrani, penolakan untuk mendengarkan/mengindahkan perempuan itu diikuti oleh dua infinitif yang menjelaskan hal yang ditolaknya. Bahasa Indonesia memerlukan penghubung atau perumusan ulang agar tidak menghasilkan infinitif yang menggantung.
  - severity: low
    issue: “Berbaring di sisinya” kurang alami untuk keterangan kedekatan אֵצֶל.
    rationale: “Di dekatnya” menyampaikan kedekatan spasial secara lebih lazim dalam bahasa Indonesia dan tidak mempersempitnya menjadi posisi tubuh tertentu.
