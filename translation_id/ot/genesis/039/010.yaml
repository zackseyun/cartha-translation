revisions:
- from: Ketika perempuan itu berbicara kepada Yusuf hari demi hari, Yusuf tidak mendengarkannya untuk berbaring di sisinya[a] atau berada bersamanya.
  to: 'Maka, ketika perempuan itu berbicara kepada Yusuf hari demi hari, Yusuf tidak mengindahkannya: ia tidak mau berbaring di dekatnya[a] atau berada bersamanya.'
  rationale: Revisi memperbaiki sintaksis Indonesia dengan menerjemahkan שָׁמַע אֵלֶיהָ secara kontekstual sebagai “tidak mengindahkannya” dan menjadikan kedua infinitif sebagai isi penolakan Yusuf. Makna yang disengketakan atau bernuansa seksual tetap tidak dipaksakan dalam teks utama dan dijelaskan dalam catatan kaki. “Maka” secara ringan menandai kelanjutan naratif וַיְהִי tanpa memakai ungkapan yang kaku.
