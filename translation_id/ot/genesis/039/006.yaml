base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/006.yaml
  text: So he left all that he had in Joseph’s hand[a], and he knew nothing with him except the food that he ate[b]. Now Joseph was handsome in form and handsome in appearance.
translation:
  language: id
  text: Maka Potifar menyerahkan segala miliknya ke dalam tangan Yusuf[a]. Ia tidak mengurus apa pun yang berada di bawah tanggung jawab Yusuf, kecuali makanan yang dimakannya[b]. Adapun Yusuf bertubuh bagus dan berwajah tampan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam tangan Yusuf”; maksudnya, ke dalam kuasa dan tanggung jawab Yusuf.
    reason: idiom
  - marker: b
    text: Secara harfiah, “ia tidak mengetahui apa pun bersamanya, kecuali roti yang dimakannya.” Kata “roti” di sini mungkin berarti makanan secara umum.
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: menyerahkan
  rationale: Secara dasar berarti 'meninggalkan', tetapi dalam konteks pengelolaan rumah tangga berarti membiarkan atau memercayakan segala miliknya di bawah tanggung jawab Yusuf.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan ini mencakup seluruh harta dan urusan Potifar secara ringkas dan alami.
- source_word: בְּיַד יוֹסֵף
  choice: ke dalam tangan Yusuf
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang kuasa, pengawasan, dan tanggung jawab; maknanya dijelaskan dalam catatan kaki.
- source_word: וְלֹא יָדַע אִתּוֹ מְאוּמָה
  choice: Ia tidak lagi mengurus apa pun yang dipercayakannya kepada Yusuf
  rationale: Ungkapan harfiahnya sulit dipahami dalam bahasa Indonesia ('tidak mengetahui apa pun bersamanya'). Konteks menunjukkan bahwa Potifar tidak lagi memperhatikan urusan yang berada di bawah pengelolaan Yusuf, sambil tetap mencatat kemungkinan terjemahan lebih harfiah.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Menandai satu-satunya hal yang dikecualikan dari lingkup pengelolaan Yusuf.
- source_word: הַלֶּחֶם אֲשֶׁר הוּא אֹכֵל
  choice: makanan yang dimakannya
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi dapat merujuk pada makanan secara umum; 'makanan' lebih wajar dalam konteks ini.
- source_word: וַיְהִי יוֹסֵף
  choice: Adapun Yusuf
  rationale: Menandai peralihan naratif menuju gambaran fisik Yusuf tanpa menyiratkan bahwa penampilannya baru berubah.
- source_word: יְפֵה תֹאַר
  choice: memiliki perawakan yang elok
  rationale: תֹאַר mengacu pada bentuk tubuh atau perawakan; pilihan ini membedakannya dari paras pada frasa berikutnya.
- source_word: וִיפֵה מַרְאֶה
  choice: paras yang tampan
  rationale: מַרְאֶה menunjuk pada penampilan yang terlihat; 'paras yang tampan' alami bagi subjek laki-laki dan mempertahankan kesejajaran dengan perawakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama Potifar disebut untuk memperjelas subjek setelah konteks ayat sebelumnya. Ungkapan tangan dipertahankan sebagai citra sumber, sedangkan sintaks Ibrani yang sangat padat dijelaskan secara idiomatis dan alternatif harfiahnya dicatat.
