- from: Maka Potifar menyerahkan segala miliknya ke dalam tangan Yusuf[a]. Ia tidak lagi mengurus apa pun yang dipercayakannya kepada Yusuf, kecuali makanan yang dimakannya[b]. Adapun Yusuf memiliki perawakan yang elok dan paras yang tampan.
  to: Maka Potifar menyerahkan segala miliknya ke dalam tangan Yusuf[a]. Ia tidak mengurus apa pun yang berada di bawah tanggung jawab Yusuf, kecuali makanan yang dimakannya[b]. Adapun Yusuf bertubuh bagus dan berwajah tampan.
  rationale: Revisi menghilangkan “lagi”, yang merupakan nuansa temporal tambahan, sambil mempertahankan makna idiomatis bahwa Potifar tidak lagi menangani urusan yang telah berada dalam pengelolaan Yusuf. Deskripsi fisik Yusuf dibuat lebih alami dalam bahasa Indonesia modern dan tetap mempertahankan paralelisme Ibrani antara bentuk tubuh dan penampilan wajah.
