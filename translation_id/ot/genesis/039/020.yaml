  source_fidelity: Kata וַיִּקַּח berarti “mengambil,” bukan secara khusus “menangkap.” Terjemahan “menangkap” menambahkan nuansa penangkapan/penahanan yang tidak dinyatakan oleh verba Ibrani itu sendiri. Selebihnya, penempatan Yusuf, aposisi mengenai tahanan raja, dan pengulangan lokasi telah terwakili dengan baik.
  naturalness: “Majikan Yusuf” lebih jelas dan lazim daripada “tuan Yusuf,” yang dalam bahasa Indonesia dapat terbaca sebagai sapaan “Tuan Yusuf.” Pengulangan nama Yusuf pada klausa pertama membuat rujukan objek jelas tanpa mengubah makna.
  terminology: “Penjara,” “tahanan raja,” dan “dipenjarakan” sesuai dengan konteks serta cukup mempertahankan pengulangan akar אסר. Catatan sohar dirumuskan tanpa menyatakan asal-usul etimologis yang lebih pasti daripada yang diperlukan.
