base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/020.yaml
  text: So Joseph’s master took him and put him into the prison[a], the place where the king’s prisoners were confined[b]. And he was there in the prison.
translation:
  language: id
  text: Lalu majikan Yusuf mengambil Yusuf dan memasukkannya ke dalam penjara[a], tempat para tahanan raja dipenjarakan[b]. Yusuf pun berada di sana, di dalam penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “rumah sohar”; sohar merujuk pada penjara atau tempat penahanan.
    reason: cultural_note
  - marker: b
    text: 'Bahasa Ibrani mengulang akar kata yang berarti “mengikat” atau “memenjarakan”: secara harfiah, “tempat para tahanan raja dipenjarakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֵי יוֹסֵף
  choice: tuan Yusuf
  rationale: Dalam konteks ini, אֲדֹנֵי menunjuk kepada majikan atau pemilik manusia Yusuf, bukan gelar ilahi. 'Tuan Yusuf' alami dalam konteks perhambaan rumah tangga dan tidak menyiratkan bahwa Yusuf adalah tuannya.
- source_word: וַיִּקַּח
  choice: menangkap
  rationale: Secara dasar לקח berarti 'mengambil', tetapi ketika seorang penguasa membawa seseorang untuk dipenjarakan, 'menangkap' menyampaikan tindakan itu secara alami tanpa menambahkan kekerasan yang tidak dinyatakan.
- source_word: וַיִּתְּנֵהוּ אֶל
  choice: memasukkannya ke dalam
  rationale: נתן dengan אֶל di sini menyatakan penempatan ke suatu lokasi. Pilihan ini mempertahankan gerak konkret masuk ke tempat tahanan.
- source_word: בֵּית הַסֹּהַר
  choice: penjara
  rationale: Ungkapan ini secara harfiah berarti 'rumah sohar'; dalam konteksnya jelas menunjuk pada penjara atau rumah tahanan. 'Penjara' adalah padanan Indonesia modern yang paling wajar.
- source_word: מְקוֹם אֲשֶׁר
  choice: tempat
  rationale: Bahasa Ibrani memberi keterangan aposisional tentang penjara sebagai tempat para tahanan raja ditahan. 'Tempat' mempertahankan struktur penjelas itu secara ringkas dan alami.
- source_word: אֲסוּרֵי הַמֶּלֶךְ אֲסוּרִים
  choice: para tahanan raja ditahan
  rationale: Teks mengulang akar אסר, mula-mula sebagai sebutan bagi orang yang terikat atau dipenjarakan, lalu sebagai predikat pasif. Pengulangan 'tahanan ... ditahan' mempertahankan gema leksikal Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וַיְהִי שָׁם בְּבֵית הַסֹּהַר
  choice: Yusuf pun berada di sana, di dalam penjara
  rationale: Nama 'Yusuf' dijelaskan kembali agar rujukan pronomina alami dalam bahasa Indonesia. 'Berada' tidak menambahkan nuansa duratif seperti 'tinggal', sedangkan pengulangan lokasi mempertahankan penekanan teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif serta pengulangan lokasi dalam teks Ibrani dipertahankan tanpa membuat kalimat terasa kaku; nama יוֹסֵף ditulis dalam bentuk Indonesia yang lazim, 'Yusuf'.
