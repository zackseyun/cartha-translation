base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/011.yaml
  text: And it happened on such a day that he went into the house to do his work[b][a], and none of the men of the house was there in the house.
translation:
  language: id
  text: Pada suatu hari[a], Yusuf masuk ke dalam rumah untuk mengerjakan pekerjaannya. Tidak ada seorang pun dari antara laki-laki di rumah itu di sana, di dalam rumah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pada/seperti hari ini.” Ungkapan Ibrani ini idiomatis dan dapat dipahami sebagai “pada suatu hari” atau “pada suatu kesempatan seperti ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Formula naratif ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia, pembukaan dengan keterangan waktu lebih alami daripada menerjemahkannya secara harfiah sebagai 'dan terjadilah'.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: suatu hari seperti biasanya
  rationale: Ungkapan ini secara harfiah menunjuk kepada 'hari ini/seperti hari ini', tetapi dalam konteks kemungkinan besar berarti suatu kesempatan ketika kegiatan rutin berlangsung. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah.
- source_word: וַיָּבֹא הַבַּיְתָה
  choice: Yusuf masuk ke dalam rumah
  rationale: בוא dengan akhiran penunjuk arah menyatakan gerak masuk. Nama Yusuf dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah identitas pelaku dari konteks.
- source_word: לַעֲשׂוֹת מְלַאכְתּוֹ
  choice: untuk mengerjakan pekerjaannya
  rationale: מְלָאכָה berarti pekerjaan atau tugas; ungkapan ini mempertahankan sufiks posesif dan cocok dengan tugas Yusuf dalam rumah tangga Potifar.
- source_word: וְאֵין אִישׁ מֵאַנְשֵׁי הַבַּיִת
  choice: Tidak seorang pun dari para lelaki penghuni rumah itu
  rationale: Konstruksi eksistensial negatif menyatakan bahwa tidak ada seorang pun yang hadir, sedangkan bentuk maskulin jamak dipertahankan secara khusus sebagai 'para lelaki', bukan diperluas menjadi seluruh penghuni rumah.
- source_word: שָׁם בַּבָּיִת
  choice: berada di sana, di dalam rumah
  rationale: Terjemahan ini mempertahankan baik שָׁם ('di sana') maupun בַּבָּיִת ('di dalam rumah'), termasuk penegasan lokatif dalam teks Ibrani.
