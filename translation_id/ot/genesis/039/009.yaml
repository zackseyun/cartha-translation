language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֵינֶ֨/נּוּ גָד֜וֹל בַּ/בַּ֣יִת הַ/זֶּה֮ מִמֶּ/נִּי֒ וְ/לֹֽא חָשַׂ֤ךְ מִמֶּ֨/נִּי֙ מְא֔וּמָה כִּ֥י אִם אוֹתָ֖/ךְ בַּ/אֲשֶׁ֣ר אַתְּ אִשְׁתּ֑/וֹ וְ/אֵ֨יךְ אֶֽעֱשֶׂ֜ה הָ/רָעָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/חָטָ֖אתִי לֵֽ/אלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/009.yaml
  text: There is no one greater in this house than I am[a], and he has withheld nothing from me except you, because you are his wife[b]. So how could I do this great evil and sin against God?
translation:
  language: id
  text: Tidak ada seorang pun di rumah ini yang lebih tinggi kedudukannya daripada aku[a], dan tuanku tidak menahan apa pun dariku selain engkau, karena engkau istrinya. Jadi, bagaimana mungkin aku melakukan kejahatan besar ini dan berdosa terhadap Allah?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak ada seorang pun di rumah ini yang lebih besar daripada aku.” Secara harfiah, bahasa Ibrani meniadakan keberadaan siapa pun yang lebih besar daripada Yusuf di dalam rumah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵינֶנּוּ גָדוֹל ... מִמֶּנִּי
  choice: Tidak seorang pun ... lebih besar daripada aku
  rationale: Konstruksi אֵין dengan kata sifat meniadakan keberadaan siapa pun yang lebih besar daripada Yusuf dalam rumah itu; ungkapan ini alami dalam bahasa Indonesia dan menghindari pembacaan yang kurang mungkin, yaitu 'dia tidak lebih besar daripada aku'.
- source_word: בַּבַּיִת הַזֶּה
  choice: di rumah ini
  rationale: בַּיִת dapat menunjuk pada rumah maupun rumah tangga; 'rumah' mempertahankan citra Ibrani dan dalam konteks mencakup lingkungan rumah tangga serta pengelolaannya.
- source_word: וְלֹא חָשַׂךְ מִמֶּנִּי מְאוּמָה
  choice: dan tuanku tidak menahan apa pun dariku
  rationale: חָשַׂךְ berarti menahan atau tidak memberikan, sedangkan מְאוּמָה di bawah negasi berarti 'apa pun'. Subjek tersirat dijelaskan sebagai 'tuanku' agar rujukannya kepada Potifar jelas dan alami dalam bahasa Indonesia.
- source_word: כִּי אִם אוֹתָךְ
  choice: selain engkau
  rationale: כִּי אִם sesudah negasi menandai pengecualian, yakni 'kecuali/selain engkau'.
- source_word: בַּאֲשֶׁר אַתְּ אִשְׁתּוֹ
  choice: karena engkau istrinya
  rationale: Gabungan ini menyatakan alasan pengecualian tersebut. 'Karena' menyampaikan hubungan kausal secara wajar.
- source_word: וְאֵיךְ אֶעֱשֶׂה
  choice: Jadi, bagaimana mungkin aku melakukan
  rationale: וְאֵיךְ memperkenalkan kesimpulan moral dari pernyataan sebelumnya; 'Jadi, bagaimana mungkin' menyampaikan daya inferensial dan retorisnya.
- source_word: הָרָעָה הַגְּדֹלָה הַזֹּאת
  choice: kejahatan yang begitu besar ini
  rationale: רָעָה dapat berarti kejahatan, keburukan, atau perbuatan salah. 'Kejahatan' mempertahankan bobot moralnya, sedangkan 'begitu besar' terdengar alami dalam seruan retoris ini.
- source_word: וְחָטָאתִי לֵאלֹהִים
  choice: dan berdosa terhadap Allah
  rationale: חטא dengan ל di sini menyatakan berdosa terhadap seseorang. 'Allah' merujuk kepada Allah yang disembah Yusuf dalam konteks narasi Kejadian.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Yusuf
  choice: Allah
  alternative: seorang ilah / ilah
  rationale: Dalam narasi Kejadian, perkataan Yusuf menunjuk kepada Allah yang disembahnya, dan pelanggaran itu dipandang bukan hanya sebagai kesalahan sosial terhadap Potifar, melainkan dosa terhadap Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. 'Engkau' dipertahankan untuk sapaan tunggal dalam konteks naratif Alkitab, sedangkan 'tuanku' ditambahkan untuk memperjelas subjek tersirat yang merujuk kepada Potifar. Penanda catatan kaki [a] hadir dalam teks utama.
