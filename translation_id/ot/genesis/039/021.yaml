id: GEN.39.21
reference: Genesis 39:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶת יוֹסֵ֔ף וַ/יֵּ֥ט אֵלָ֖י/ו חָ֑סֶד וַ/יִּתֵּ֣ן חִנּ֔/וֹ בְּ/עֵינֵ֖י שַׂ֥ר בֵּית הַ/סֹּֽהַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/021.yaml
  text: But Yahweh was with Joseph and extended covenant faithfulness to him[b][a], and he gave him favor in the eyes of the chief of the prison.
translation:
  language: id
  text: Namun, Yahweh menyertai Yusuf dan menunjukkan kasih setia kepadanya[a]. Ia membuat Yusuf mendapat perkenanan di mata kepala penjara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menunjukkan kebaikan kepadanya.” Kata Ibrani חֶסֶד juga dapat berarti kasih yang teguh, kasih yang loyal, atau kebaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיְהִי יְהוָה אֶת יוֹסֵף
  choice: Yahweh menyertai Yusuf
  rationale: Konstruksi ini secara idiomatis menyatakan kehadiran dan penyertaan Yahweh; 'menyertai' alami dalam bahasa Indonesia dan sesuai dengan rumusan berulang dalam kisah Yusuf.
- source_word: וַיֵּט אֵלָיו חָסֶד
  choice: menunjukkan kasih setia kepadanya
  rationale: Ungkapan ini menyatakan bahwa Yahweh mengarahkan atau mencurahkan חֶסֶד kepada Yusuf. 'Kasih setia' mempertahankan unsur kasih, loyalitas, dan keteguhan tanpa menyisipkan rujukan eksplisit kepada perjanjian yang tidak dinyatakan dalam ayat ini.
- source_word: וַיִּתֵּן חִנּוֹ בְּעֵינֵי
  choice: membuat Yusuf mendapat perkenanan di mata
  rationale: 'Terjemahan ini mengungkapkan hasil idiom Ibrani secara jelas: Yahweh menyebabkan Yusuf dipandang dengan baik oleh kepala penjara, sambil mempertahankan citra ''di mata''.'
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: kepala penjara
  rationale: Padanan ini ringkas, alami, dan cukup dekat dengan rangkaian kata Ibrani yang menunjuk kepada pejabat yang mengepalai penjara.
- source_word: וַ
  choice: Namun
  rationale: Kata penghubung ini menonjolkan kontras naratif antara pemenjaraan Yusuf pada konteks sebelumnya dan penyertaan Yahweh kepadanya.
theological_decisions:
- issue: Makna חָסֶד dalam tindakan Yahweh kepada Yusuf
  choice: kasih setia
  alternative: kebaikan; kasih yang teguh; kesetiaan perjanjian
  rationale: '''Kasih setia'' menyampaikan keluasan makna loyalitas dan kemurahan yang teguh, tetapi tidak mempertegas adanya perjanjian formal dalam konteks langsung ini.'
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi ini mempertahankan nama pribadi ilahi yang terdapat dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dipecah menjadi dua kalimat agar alurnya jelas bagi pembaca umum tanpa menghilangkan hubungan antartindakan Yahweh. Istilah 'kepala penjara' dipilih karena lebih alami daripada terjemahan harfiah yang panjang.
