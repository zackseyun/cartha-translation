  text: So she kept his garment beside her until his master came home.
translation:
  language: id
  text: Lalu perempuan itu menyimpan pakaian Yusuf di sisinya sampai tuannya pulang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּנַּח
  choice: menyimpan
  rationale: Dalam konteks ini verba נוח bentuk hifil menyatakan bahwa perempuan itu membiarkan atau menaruh pakaian tersebut tetap berada padanya; 'menyimpan' menyampaikan tindakan menahannya sebagai barang bukti.
- source_word: בִּגְדוֹ
  choice: pakaian Yusuf
  rationale: Secara harfiah berarti 'pakaiannya'. Nama 'Yusuf' memperjelas pemilik pakaian dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: אֶצְלָהּ
  choice: di sisinya
  rationale: Mempertahankan gambaran spasial ungkapan Ibrani, yakni pakaian itu ditahan dekat atau bersama perempuan tersebut.
- source_word: עַד בּוֹא אֲדֹנָיו אֶל־בֵּיתוֹ
  choice: sampai tuannya pulang
  rationale: Secara harfiah 'sampai tuannya datang ke rumahnya'; 'pulang' merupakan ungkapan Indonesia yang alami dan tepat dalam konteks kedatangan ke rumah sendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Hubungan kepemilikan diperjelas dengan nama Yusuf, sedangkan ungkapan kedatangan ke rumah sendiri diterjemahkan secara alami sebagai 'pulang'.
