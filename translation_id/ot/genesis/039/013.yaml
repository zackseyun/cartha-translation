  text: וַ/יְהִי֙ כִּ/רְאוֹתָ֔/הּ כִּֽי עָזַ֥ב בִּגְד֖/וֹ בְּ/יָדָ֑/הּ וַ/יָּ֖נָס הַ/חֽוּצָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/013.yaml
  text: And it happened[a], when she saw that he had left his garment in her hand and had fled outside,
translation:
  language: id
  text: Lalu, ketika perempuan itu melihat bahwa Yusuf telah meninggalkan pakaiannya[a] di tangannya dan telah melarikan diri ke luar,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang digunakan merupakan istilah umum untuk pakaian dan tidak harus berarti “jubah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu
  rationale: Dalam konteks ini bentuk naratif tersebut berfungsi mengalihkan dan melanjutkan rangkaian cerita. “Lalu” menyampaikan fungsi wacana itu secara alami tanpa ungkapan kaku “dan terjadilah”.
- source_word: כִּרְאוֹתָהּ
  choice: ketika perempuan itu melihat
  rationale: Preposisi כְּ dengan infinitif konstruk ראה dan sufiks orang ketiga feminin tunggal membentuk klausa waktu. Penyebutan “perempuan itu” memperjelas pelaku feminin dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang dilihat perempuan itu; “bahwa” merupakan penghubung klausa isi yang wajar dalam bahasa Indonesia.
- source_word: עָזַב
  choice: telah meninggalkan
  rationale: Kata kerja ini berarti meninggalkan. “Telah” menandai bahwa tindakan itu sudah terjadi ketika perempuan tersebut melihat keadaannya.
- source_word: בִּגְדוֹ
  choice: pakaiannya
  rationale: בֶּגֶד adalah istilah umum untuk pakaian atau sehelai pakaian. “Pakaiannya” mempertahankan keluasan makna dan tidak mempersempitnya menjadi “jubah”.
- source_word: בְּיָדָהּ
  choice: di tangannya
  rationale: Terjemahan harfiah ini alami dalam bahasa Indonesia dan mempertahankan gambaran konkret bahwa pakaian itu masih berada di tangan perempuan tersebut.
- source_word: וַיָּנָס
  choice: telah melarikan diri
  rationale: נוּס menyatakan tindakan lari untuk menyelamatkan diri atau menjauh dengan segera. “Melarikan diri” lebih tepat daripada sekadar “berlari” dan, dengan “telah”, menunjukkan tindakan yang sudah terjadi.
- source_word: הַחוּצָה
  choice: ke luar
  rationale: Akhiran direktif pada bentuk Ibrani menyatakan gerak menuju bagian luar; “ke luar” mempertahankan arah gerak itu.
- source_word: בִּגְדוֹ / וַיָּנָס
  choice: Yusuf ... pakaiannya ... melarikan diri
  rationale: Bahasa Ibrani menandai rujukan maskulin melalui sufiks dan bentuk verbal, sedangkan bahasa Indonesia tidak. Nama “Yusuf” digunakan untuk mencegah kata ganti tak bergender disalahpahami sebagai merujuk kepada perempuan itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang wajar. Ayat diakhiri koma karena kalimat berlanjut ke ayat berikutnya. “Lalu” mewakili transisi naratif וַיְהִי secara idiomatis, sedangkan pengulangan “telah” memperjelas bahwa kedua tindakan Yusuf telah terjadi sebelum perempuan itu menanggapinya.
