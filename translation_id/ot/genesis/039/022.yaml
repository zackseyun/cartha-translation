translation:
  language: id
  text: Kepala penjara menyerahkan kepada Yusuf semua tahanan yang ada di penjara itu,[a] dan apa pun yang dilakukan di sana, dialah yang melakukannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menyerahkan ke dalam tangan Yusuf”; maksudnya, semua tahanan ditempatkan di bawah kuasa dan tanggung jawabnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dan segala sesuatu yang mereka lakukan di sana, dialah yang sedang melakukannya.” Bentuk Ibrani ini menekankan peran aktif Yusuf yang berlangsung dalam segala kegiatan di penjara.'
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: kepala penjara
  rationale: Ungkapan ini menunjuk kepada pejabat yang bertanggung jawab atas penjara; “kepala penjara” dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia modern.
- source_word: בְּיַד יוֹסֵף
  choice: memercayakan kepada Yusuf
  rationale: Secara harfiah berarti “ke dalam tangan Yusuf,” sebuah idiom untuk menyerahkan orang atau urusan ke dalam kuasa dan tanggung jawab seseorang.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: כָּל הָאֲסִירִם
  choice: semua tahanan
  rationale: Dalam konteks penjara, אֲסִירִים berarti orang-orang yang ditahan; “tahanan” merupakan padanan alami dan tepat.
- source_word: אֲשֶׁר בְּבֵית הַסֹּהַר
  choice: yang ada di penjara itu
  rationale: Klausa relatif ini menentukan para tahanan yang berada di penjara tersebut; “penjara itu” mengacu secara alami pada penjara yang baru disebut.
- source_word: וְאֵת כָּל אֲשֶׁר עֹשִׂים שָׁם
  choice: dan segala sesuatu yang dikerjakan di sana
  rationale: Partisipel jamak aktif memiliki subjek tak tentu, sehingga bentuk pasif bahasa Indonesia mempertahankan ketidakjelasan pelakunya tanpa menambahkan subjek yang tidak dinyatakan.
- source_word: הוּא הָיָה עֹשֶׂה
  choice: berada di bawah tanggung jawab Yusuf
  rationale: Konstruksi הָיָה + partisipel menyatakan kegiatan atau tanggung jawab yang berlangsung, sedangkan הוּא memberi penekanan pada Yusuf. Ungkapan Indonesia ini menyampaikan bahwa dialah yang mengurus dan mengawasi seluruh pekerjaan, bukan bahwa ia secara pribadi melakukan setiap tugas.
