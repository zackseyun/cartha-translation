  to: Lalu ia memanggil para laki-laki seisi rumahnya dan berkata kepada mereka, “Lihat! Ia telah membawa seorang laki-laki Ibrani kepada kita untuk mempermainkan kita.[a] Orang itu datang kepadaku untuk tidur denganku,[b] dan aku berteriak dengan suara keras.”
