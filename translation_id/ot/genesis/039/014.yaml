base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/014.yaml
  text: Then she called the men of her household and said to them[a], “Look, he has brought a Hebrew man to us to mock us. He came in to me to lie with me[b], and I cried out with a loud voice.”
translation:
  language: id
  text: Lalu ia memanggil para laki-laki seisi rumahnya dan berkata kepada mereka, “Lihat! Ia telah membawa seorang laki-laki Ibrani kepada kita untuk mempermainkan kita.[a] Orang itu datang kepadaku untuk tidur denganku,[b] dan aku berteriak dengan suara keras.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menertawakan kita” atau “menjadikan kita bahan permainan.” Kata kerja Ibrani ini dapat menunjuk pada ejekan atau perlakuan yang menghina; dalam tuduhan istri Potifar, ungkapan tersebut dapat mengandung nuansa penghinaan seksual.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidur dengan” di sini berarti melakukan hubungan seksual.
    reason: idiom_clarification
lexical_decisions:
- source_word: וַתִּקְרָא לְאַנְשֵׁי בֵיתָהּ
  choice: Lalu ia memanggil para laki-laki di rumahnya
  rationale: Bentuk naratif וַתִּקְרָא melanjutkan urutan kejadian, sehingga diterjemahkan dengan “Lalu”. אַנְשֵׁי secara khusus berarti laki-laki, sedangkan בֵיתָהּ di sini menunjuk pada lingkungan rumah atau rumah tangganya.
- source_word: וַתֹּאמֶר לָהֶם לֵאמֹר
  choice: dan berkata kepada mereka
  rationale: Rumus pengantar ucapan Ibrani diterjemahkan secara alami tanpa mengulang unsur harfiah “dengan berkata”.
- source_word: רְאוּ
  choice: Lihat!
  rationale: Imperatif ini menarik perhatian para pendengar. “Lihat!” alami dalam bahasa Indonesia modern dan mempertahankan nada tuduhan.
- source_word: הֵבִיא לָנוּ אִישׁ עִבְרִי
  choice: Ia telah membawa seorang laki-laki Ibrani kepada kita
  rationale: Bentuk kausatif הֵבִיא berarti “membawa”, לָנוּ dipertahankan sebagai “kepada kita”, dan אִישׁ עִבְרִי menyatakan baik jenis kelamin maupun identitas etnis Yusuf.
- source_word: לְצַחֶק בָּנוּ
  choice: untuk mempermainkan kita
  rationale: צחק dalam konstruksi ini dapat berarti menertawakan, mengejek, atau menjadikan seseorang sasaran permainan yang menghina. “Mempermainkan” mempertahankan keluasan makna dan nuansa penghinaan seksual dalam tuduhan itu.
- source_word: בָּא אֵלַי
  choice: Orang itu datang kepadaku
  rationale: בוא dengan אֶל berarti datang kepada seseorang. “Orang itu” memperjelas subjek secara alami tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: לִשְׁכַּב עִמִּי
  choice: untuk tidur denganku
  rationale: Ungkapan ini merupakan idiom Ibrani untuk hubungan seksual. Padanan Indonesia tersebut alami, bermartabat, dan tetap mempertahankan bentuk idiomatisnya.
- source_word: וָאֶקְרָא בְּקוֹל גָּדוֹל
  choice: dan aku berteriak dengan suara keras
  rationale: Kata penghubung diterjemahkan “dan” sesuai urutan klausa Ibrani tanpa menambahkan pertentangan. “Berteriak dengan suara keras” dekat dengan ungkapan sumber dan cocok dengan konteks seruan darurat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog mempertahankan nada tuduhan serta usaha istri Potifar membangun solidaritas dengan para laki-laki di rumahnya. Ambiguitas pada לְצַחֶק בָּנוּ dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
