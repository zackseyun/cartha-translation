base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/019.yaml
  text: And it happened that when his master heard the words of his wife that she spoke to him[a], saying[b], “According to these words your servant did to me,” his anger burned.
translation:
  language: id
  text: Ketika tuannya mendengar perkataan istrinya yang disampaikan kepadanya, “Budakmu telah melakukan hal-hal seperti itu kepadaku,” amarahnya berkobar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Rangkaian naratif וַיְהִי dengan klausa temporal כִשְׁמֹעַ dapat diungkapkan secara alami dalam bahasa Indonesia dengan “Ketika”; penambahan harfiah “terjadilah” tidak diperlukan untuk menyampaikan urutan peristiwa.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks rumah Potifar, kata ini menunjuk kepada pemilik sekaligus atasan Yusuf; “tuan” mempertahankan hubungan sosial tersebut.
- source_word: דִּבְרֵי אִשְׁתּוֹ אֲשֶׁר דִּבְּרָה אֵלָיו
  choice: perkataan istrinya yang disampaikan kepadanya
  rationale: Terjemahan ini mempertahankan unsur “perkataan” serta relasi bahwa sang istri menyampaikannya kepada suaminya, tanpa pengulangan kata “berkata” yang kaku.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Seperti itulah
  rationale: Frasa ini menunjuk pada tindakan yang dituduhkan sebagaimana baru diceritakan; “Seperti itulah” alami dalam bahasa Indonesia dan tetap mempertahankan daya tunjuk serta kemungkinan makna ‘hal-hal semacam itu’.
- source_word: עַבְדֶּךָ
  choice: budakmu
  rationale: עבד dapat berarti pelayan atau budak, tetapi status Yusuf dalam rumah Potifar adalah orang yang diperbudak; “budak” menyatakan status terikat itu secara jelas.
- source_word: עָשָׂה לִי
  choice: dilakukan ... kepadaku
  rationale: Terjemahan langsung ini mempertahankan verba umum עשה dan preposisi ל tanpa mempertegasnya menjadi “terhadap” atau “menyerang”, yang akan menambah tafsiran.
- source_word: וַיִּחַר אַפּוֹ
  choice: berkobarlah amarahnya
  rationale: Ungkapan ini mempertahankan metafora panas atau nyala dalam idiom Ibrani sambil terdengar wajar dan bermartabat dalam bahasa Indonesia.
