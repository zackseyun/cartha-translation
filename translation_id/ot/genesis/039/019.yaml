translation_notes:
  register: Bahasa Indonesia baku, naratif, dan mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan metafora kemarahan atau memperjelas secara spekulatif apakah sang tuan mempercayai seluruh tuduhan istrinya.
