base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/003.yaml
  text: His master saw that Yahweh was with him[a], and that Yahweh made prosper in his hand all that he did.
translation:
  language: id
  text: Tuannya melihat bahwa Yahweh menyertainya dan bahwa Yahweh membuat berhasil di tangannya segala sesuatu yang dikerjakannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tangannya”; dapat juga dipahami “melalui tangannya” atau “di bawah arahannya.”
    reason: Menjelaskan idiom Ibrani yang dapat menyatakan sarana, pelaksanaan, atau ruang tanggung jawab tanpa memaksakan satu nuansa.
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה secara langsung berarti “melihat”; dalam konteks ini juga menyiratkan bahwa sang tuan mengenali kenyataan tersebut dari hasil pekerjaan Yusuf.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Menunjuk kepada Potifar sebagai tuan Yusuf dalam lingkungan rumah tangga; “tuannya” alami dalam bahasa Indonesia dan sesuai dengan konteks sosialnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang diwakili oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אִתּוֹ
  choice: menyertainya
  rationale: Ungkapan ini menyatakan kehadiran ilahi bersama Yusuf. “Menyertainya” alami dan ringkas dalam bahasa Indonesia.
- source_word: וְכֹל אֲשֶׁר הוּא עֹשֶׂה
  choice: segala sesuatu yang dikerjakannya
  rationale: Menyampaikan cakupan menyeluruh dari ungkapan Ibrani sekaligus mempertahankan fokus pada pekerjaan atau tindakan Yusuf.
- source_word: מַצְלִיחַ
  choice: membuat ... berhasil
  rationale: 'Bentuk Hifil dari צלח bersifat kausatif: Yahweh menyebabkan pekerjaan Yusuf berhasil. Susunan ini mempertahankan tindakan Yahweh sebagai penyebab keberhasilan.'
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Terjemahan harfiah ini mempertahankan gambaran konkret dan ambiguitas ungkapan Ibrani, yang dapat menunjuk pada sarana, pelaksanaan, atau ruang tanggung jawab Yusuf.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Makna idiom בְּיָדוֹ
  choice: mempertahankan “di tangannya” dalam teks utama
  alternative: “melalui tangannya” atau “di bawah arahannya”
  rationale: Ungkapan Ibrani memungkinkan nuansa sarana, pelaksanaan, atau wewenang. Terjemahan harfiah dalam teks utama, disertai catatan kaki, tidak membatasi maknanya pada satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami, tetapi hubungan sebab-akibat dengan Yahweh sebagai pelaku serta idiom konkret bahasa Ibrani tetap dipertahankan.
