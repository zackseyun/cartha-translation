  text: Then she spoke to him with words like these[a], saying, “The Hebrew servant whom you brought to us came to me to mock me.”
translation:
  language: id
  text: 'Lalu perempuan itu berbicara kepadanya dengan kata-kata seperti ini: “Budak Ibrani yang kaubawa kepada kita itu datang kepadaku untuk mempermainkan aku[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperolok-olok aku”; dalam konteks ini, ungkapan tersebut mungkin bernuansa seksual atau perlakuan abusif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר אֵלָיו
  choice: Kemudian perempuan itu berbicara kepada suaminya
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Subjek perempuan dinyatakan agar alami dalam bahasa Indonesia, sedangkan pronomina ‘kepadanya’ diperjelas secara kontekstual sebagai ‘kepada suaminya’ untuk menghindari rujukan yang kabur dalam ayat mandiri.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: dengan kata-kata seperti ini
  rationale: Ungkapan ini memperkenalkan isi laporan dan tetap mempertahankan nuansa komparatif כ serta bentuk jamak ‘kata-kata’.
- source_word: הָעֶבֶד הָעִבְרִי
  choice: Budak Ibrani
  rationale: עֶבֶד dalam konteks ini menunjuk pada orang yang berstatus budak rumah tangga, bukan sekadar pelayan; הָעִבְרִי menyatakan identitas etnisnya.
- source_word: אֲשֶׁר הֵבֵאתָ לָּנוּ
  choice: yang kaubawa kepada kita
  rationale: Mempertahankan tudingan langsung kepada suaminya dan pronomina jamak ‘kita’, yang kemungkinan merujuk kepada rumah tangga mereka.
- source_word: בָּא אֵלַי
  choice: datang kepadaku
  rationale: בוא dengan אל menyatakan gerak menuju dirinya. Terjemahan ini tidak menambahkan konotasi seksual secara berlebihan.
- source_word: לְצַחֶק בִּי
  choice: untuk mempermainkan aku
  rationale: צחק dengan ב dalam konteks tuduhan ini dapat berarti menjadikan seseorang bahan permainan atau perlakuan tidak senonoh. ‘Mempermainkan aku’ menjaga keluasan dan nada abusif ungkapan itu tanpa memastikan tindakan tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kaubawa’ mempertahankan sapaan orang kedua tunggal dalam tudingan langsung. Kata ‘budak’ dipilih untuk mencerminkan status sosial Yusuf secara akurat.
