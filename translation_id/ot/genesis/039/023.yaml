base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/023.yaml
  text: The chief of the prison paid attention to nothing that was in his hand[a], because Yahweh was with him; and whatever he did[c][b], Yahweh made prosper.
translation:
  language: id
  text: Kepala penjara tidak memperhatikan apa pun yang berada di bawah tanggung jawab Yusuf[a], sebab Yahweh menyertai dia; Yahweh membuat apa pun yang dikerjakan Yusuf berhasil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak melihat apa pun yang ada di tangannya”; maksudnya, kepala penjara tidak memeriksa atau mengurus apa yang berada di bawah tanggung jawab Yusuf.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “Yahweh membuat berhasil apa pun yang Yusuf kerjakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר בֵּית הַסֹּהַר
  choice: kepala penjara
  rationale: שַׂר menunjuk kepada pejabat atau pemimpin; 'kepala penjara' mempertahankan makna administratif dan terdengar alami dalam bahasa Indonesia.
- source_word: אֵין ... רֹאֶה אֶת כָּל מְאוּמָה
  choice: tidak mengawasi satu pun
  rationale: Secara harfiah konstruksi ini menyatakan bahwa kepala penjara 'tidak melihat apa pun'; dalam konteks, maksudnya ia tidak memeriksa atau mengawasi urusan yang diserahkan kepada Yusuf.
- source_word: בְּיָדוֹ
  choice: dari segala yang telah dipercayakannya kepada Yusuf
  rationale: Ungkapan Ibrani 'di tangannya' berarti berada dalam kuasa atau tanggung jawab Yusuf. Nama Yusuf dijelaskan untuk menghindari ketaksaan pronomina yang tidak alami dalam bahasa Indonesia.
- source_word: בַּאֲשֶׁר יְהוָה אִתּוֹ
  choice: sebab Yahweh menyertai Yusuf
  rationale: בַּאֲשֶׁר berfungsi kausal dalam konteks ini. Nama Yusuf digunakan untuk memperjelas rujukan 'dia'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וַאֲשֶׁר הוּא עֹשֶׂה
  choice: Apa pun yang Yusuf kerjakan
  rationale: Konstruksi relatif ini mencakup seluruh kegiatan Yusuf; 'kerjakan' sesuai dengan konteks tanggung jawab dan pekerjaan.
- source_word: מַצְלִיחַ
  choice: membuatnya berhasil
  rationale: 'Bentuk Hifil bersifat kausatif: Yahweh menyebabkan apa yang dikerjakan Yusuf berhasil.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Pelaku dan cakupan keberhasilan
  choice: Yahweh membuat apa pun yang Yusuf kerjakan berhasil
  alternative: Yahweh membuat Yusuf berhasil
  rationale: Tata bahasa menempatkan Yahweh sebagai penyebab keberhasilan dan konstruksi relatif sebelumnya menunjuk pada segala yang Yusuf kerjakan; terjemahan tidak memperluasnya menjadi janji keberhasilan mutlak bagi pribadi Yusuf.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Yusuf diulang sebagai pengganti pronomina agar rujukannya jelas, sedangkan idiom tangan dijelaskan dalam catatan kaki.
