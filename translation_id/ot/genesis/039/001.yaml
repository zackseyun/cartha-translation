  text: וְ/יוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָ/ה וַ/יִּקְנֵ֡/הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַ/טַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִ/יַּד֙ הַ/יִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖/הוּ שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/039/001.yaml
  text: Joseph had been brought down to Egypt[a], and Potiphar, an officer of Pharaoh, the captain of the guard, an Egyptian[b], bought him from the Ishmaelites who had brought him down there.
translation:
  language: id
  text: Yusuf telah dibawa turun ke Mesir, dan Potifar, seorang Mesir yang menjadi pejabat Firaun dan kepala pasukan pengawal,[a] membelinya dari orang-orang Ismael yang telah membawanya turun ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pejabat” dapat juga berarti “seorang sida-sida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּרַד
  choice: telah dibawa turun
  rationale: Bentuk Hofal dari ירד bersifat pasif-kausatif. Ungkapan ini mempertahankan motif gerak 'turun' dan menunjukkan bahwa tindakan tersebut mendahului pembelian oleh Potifar.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; 'ke Mesir' merupakan ungkapan Indonesia yang alami.
- source_word: וַיִּקְנֵהוּ
  choice: membeli dia
  rationale: Dalam konteks perdagangan budak, קנה paling wajar berarti 'membeli', bukan sekadar 'memperoleh'.
- source_word: סְרִיס פַּרְעֹה
  choice: seorang pejabat Firaun
  rationale: סְרִיס dapat berarti pejabat istana maupun sida-sida. Makna jabatan dipakai dalam teks utama, sedangkan alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: שַׂר הַטַּבָּחִים
  choice: kepala pasukan pengawal
  rationale: Frasa ini menunjuk pemimpin kelompok kerajaan yang dapat berfungsi sebagai pengawal dan pelaksana hukuman. Pilihan ini jelas tanpa mempersempitnya secara berlebihan menjadi hanya 'algojo'.
- source_word: אִישׁ מִצְרִי
  choice: orang Mesir
  rationale: Menyampaikan kebangsaan Potifar secara alami dalam bahasa Indonesia; unsur אִישׁ tidak perlu diterjemahkan terpisah karena 'orang' sudah memuatnya.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Idiom Ibrani secara harfiah berarti 'dari tangan'. Ungkapan ini tetap wajar dalam bahasa Indonesia dan mempertahankan gambaran perpindahan penguasaan.
- source_word: הַיִּשְׁמְעֵאלִים
  choice: orang-orang Ismael
  rationale: Etnonim dipertahankan tanpa menambahkan 'pedagang', yang hanya tersirat dari konteks.
- source_word: אֲשֶׁר הוֹרִדֻהוּ שָׁמָּה
  choice: yang telah membawanya turun ke sana
  rationale: Klausa relatif menunjuk kembali kepada orang-orang Ismael, mempertahankan pengulangan akar ירד dan menerjemahkan שָׁמָּה sebagai 'ke sana'.
theological_decisions:
- issue: Makna סְרִיס dalam jabatan Potifar
  choice: pejabat Firaun
  alternative: sida-sida Firaun
  rationale: Istilah Ibrani dapat menunjuk pejabat istana atau laki-laki yang dikebiri. Konteks tidak memastikan arti biologis, sehingga arti administratif digunakan dalam teks utama dan alternatifnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur appositif diperjelas dengan tanda pisah; pengulangan 'dibawa turun' dipertahankan karena mencerminkan motif leksikal dalam teks Ibrani.
