revisions:
- from: Yusuf telah dibawa turun ke Mesir, lalu Potifar—seorang pejabat Firaun,[a] kepala pasukan pengawal, dan orang Mesir—membeli dia dari tangan orang-orang Ismael yang telah membawanya turun ke sana.
  to: Yusuf telah dibawa turun ke Mesir, dan Potifar, seorang Mesir yang menjadi pejabat Firaun dan kepala pasukan pengawal,[a] membelinya dari orang-orang Ismael yang telah membawanya turun ke sana.
  rationale: Revisi memperlancar struktur aposisional dan pilihan kata tanpa mengurangi pengulangan motif “dibawa turun” atau menghilangkan ketidakpastian leksikal pada סָרִיס. Pengalihan “dari tangan orang-orang Ismael” menjadi “dari orang-orang Ismael” menyampaikan idiom מִיַּד secara alami dalam konteks transaksi.
