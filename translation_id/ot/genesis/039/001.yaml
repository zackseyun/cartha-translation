review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok sudah setia pada Ibrani: Yusuf dibawa turun ke Mesir; Potifar membeli Yusuf dari orang-orang Ismael; dan klausa relatif terakhir dengan tepat merujuk kepada orang-orang Ismael. Istilah סָרִיס diterjemahkan secara aman sebagai jabatan, dengan alternatif leksikal dipertahankan dalam catatan kaki. Revisi hanya memperjelas hubungan aposisional dan memakai bentuk objek yang lebih idiomatis dalam bahasa Indonesia.'
  naturalness: Teks draf dapat dipahami, tetapi rangkaian aposisi yang diapit tanda pisah—khususnya “kepala pasukan pengawal, dan orang Mesir”—terasa kurang lancar dan kata “lalu” memberi penekanan urutan yang tidak perlu. Susunan revisi lebih alami dalam bahasa Indonesia baku tanpa mengubah informasi sumber.
  terminology: “Yusuf,” “Mesir,” “Potifar,” “Firaun,” “orang-orang Ismael,” dan “kepala pasukan pengawal” sesuai dan konsisten. “Pejabat Firaun” merupakan padanan netral yang baik untuk סָרִיס; catatan kaki mempertahankan kemungkinan “sida-sida.”
  issues:
  - severity: low
    issue: Rangkaian aposisi dalam tanda pisah kurang idiomatis
    rationale: Frasa “seorang pejabat Firaun, kepala pasukan pengawal, dan orang Mesir” dapat terbaca seperti daftar unsur yang kurang sejajar. Menjadikan Potifar “seorang Mesir yang menjadi pejabat Firaun dan kepala pasukan pengawal” lebih lancar sambil mempertahankan semua predikasi Ibrani.
  - severity: low
    issue: “lalu” menambahkan nuansa sekuensial yang tidak diperlukan
    rationale: Konjungsi waw dapat diterjemahkan sederhana sebagai “dan”; bentuk ini lebih dekat pada hubungan koordinatif dalam ayat dan lebih selaras dengan keadaan Yusuf yang sudah lebih dahulu dibawa ke Mesir.
  - severity: low
    issue: Bentuk objek “membeli dia” kurang alami
    rationale: Dalam prosa Indonesia modern, “membelinya” lebih idiomatis dan tetap jelas merujuk kepada Yusuf.
  revised_text: Yusuf telah dibawa turun ke Mesir, dan Potifar, seorang Mesir yang menjadi pejabat Firaun dan kepala pasukan pengawal,[a] membelinya dari orang-orang Ismael yang telah membawanya turun ke sana.
