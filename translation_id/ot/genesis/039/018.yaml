translation:
  language: id
  text: Ketika aku meninggikan suaraku dan berteriak, ia meninggalkan pakaiannya di sisiku, lalu melarikan diri ke luar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּהֲרִימִי
  choice: Ketika aku meninggikan
  rationale: Konstruksi וַיְהִי dengan prefiks temporal כ memperkenalkan keadaan waktu. Dalam bahasa Indonesia, “ketika” menyampaikan alur itu secara alami tanpa terjemahan kaku “dan terjadilah ketika”; bentuk Hifil רום tetap tercermin dalam “meninggikan”.
- source_word: קוֹלִי
  choice: suaraku
  rationale: קוֹל dalam konteks ini berarti suara, dan ungkapan “meninggikan suara” wajar dalam bahasa Indonesia.
- source_word: וָאֶקְרָא
  choice: dan berteriak
  rationale: קרא dapat berarti memanggil atau berseru. Dalam konteks tuduhan tentang seruan minta perhatian, “berteriak” menyampaikan seruan keras dengan jelas.
- source_word: וַיַּעֲזֹב
  choice: ia meninggalkan
  rationale: עזב menunjukkan bahwa pakaian itu ditinggalkan; “meninggalkan” tepat dan tidak menambahkan gagasan lain.
- source_word: בִּגְדוֹ
  choice: pakaiannya
  rationale: בֶּגֶד adalah istilah umum untuk pakaian dan tidak menentukan jenisnya; “pakaiannya” mempertahankan ketidakspesifikan tersebut.
- source_word: אֶצְלִי
  choice: di sisiku
  rationale: אצל menyatakan kedekatan tempat. “Di sisiku” mempertahankan nuansa spasial tanpa menyiratkan kepemilikan.
- source_word: וַיָּנָס
  choice: lalu melarikan diri
  rationale: נוס berarti melarikan diri. “Lalu” menghubungkan tindakan berikutnya secara alami dalam narasi Indonesia.
- source_word: הַחוּצָה
  choice: ke luar
  rationale: Akhiran lokatif menunjukkan gerak menuju luar; “ke luar” mempertahankan arah gerak, bukan sekadar keadaan berada di luar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Struktur temporal dibuat lancar, sedangkan istilah umum בֶּגֶד sengaja diterjemahkan tanpa menentukan jenis pakaian. Tidak diperlukan catatan kaki karena “pakaian” sudah mempertahankan keluasan makna Ibrani.
