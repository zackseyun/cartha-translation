base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: id
  text: Lalu ia berkata, “Bawalah itu mendekat kepadaku, dan aku akan makan hasil buruan anakku, supaya jiwaku memberkatimu.[a]” Maka ia membawanya mendekat kepadanya, lalu ia makan. Ia membawa anggur kepadanya, lalu ia minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih idiomatis, “supaya aku memberkatimu”; secara harfiah, “supaya jiwaku memberkatimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה־לִּי
  choice: Bawalah itu mendekat kepadaku
  rationale: Bentuk imperatif kausatif dari נגשׁ menyatakan tindakan membawa atau menyajikan sesuatu mendekat. Objek tersirat dipasok sebagai “itu” berdasarkan konteks.
- source_word: וְאֹכְלָה
  choice: supaya aku makan
  rationale: Bentuk kohortatif menyatakan maksud atau keinginan Ishak; “supaya aku makan” mengungkapkan hubungan maksud secara alami dalam bahasa Indonesia.
- source_word: מִצֵּיד בְּנִי
  choice: sebagian dari hasil buruan anakku
  rationale: צַיִד menunjuk pada hasil buruan, sedangkan מִן di sini bersifat partitif; “sebagian dari” membuat makna tersebut jelas dan wajar.
- source_word: לְמַעַן
  choice: dan
  rationale: Tujuan keseluruhan tuturan tetap dinyatakan oleh konstruksi “supaya ... dan ...”; pilihan ini menghindari rangkaian “supaya ... supaya” yang kaku tanpa menghilangkan hubungan tujuan.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: jiwaku memberkatimu
  rationale: Mempertahankan נַפְשִׁי sebagai subjek eksplisit dan menjaga ungkapan Ibrani yang khidmat, dengan catatan kaki yang memberikan padanan idiomatis.
- source_word: וַיַּגֶּשׁ לוֹ
  choice: ia membawanya mendekat kepadanya
  rationale: Menggemakan verba dalam perintah sebelumnya dan mempertahankan gambaran gerak mendekat.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan baku untuk יַיִן dalam konteks minuman.
- source_word: וַיֵּשְׁתְּ
  choice: lalu ia minum
  rationale: Menerjemahkan bentuk naratif secara langsung dan alami.
theological_decisions:
- issue: Ungkapan נַפְשִׁי sebagai subjek pemberkatan
  choice: jiwaku memberkatimu
  alternative: aku memberkatimu
  rationale: Teks utama mempertahankan bentuk sumber dan ketegangan idiomatisnya; catatan kaki menjelaskan makna yang lebih lazim tanpa menghapus ungkapan asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “mendekat” dipertahankan untuk mencerminkan pengulangan נגשׁ, sedangkan “hasil buruan” dipilih sebagai ungkapan alami bagi daging yang diperoleh dari berburu.
