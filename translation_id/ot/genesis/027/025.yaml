revisions:
- from: Lalu ia berkata, “Bawalah itu mendekat kepadaku, supaya aku makan sebagian dari hasil buruan anakku dan jiwaku memberkatimu.[a]” Maka ia membawanya mendekat kepadanya, lalu ia makan. Ia juga membawakan anggur kepadanya, lalu ia minum.
  to: Lalu ia berkata, “Bawalah itu mendekat kepadaku, dan aku akan makan hasil buruan anakku, supaya jiwaku memberkatimu.[a]” Maka ia membawanya mendekat kepadanya, lalu ia makan. Ia membawa anggur kepadanya, lalu ia minum.
  rationale: 'Revisi memulihkan urutan dan hubungan gramatikal teks Ibrani: perintah untuk membawa makanan, niat Ishak untuk makan, lalu tujuan agar ‘jiwanya’ memberkati. Istilah ‘jiwaku’ dan catatan kaki dipertahankan demi kesetiaan pada idiom sumber, sementara kata yang tidak perlu dan verba yang kurang langsung diperbaiki.'
