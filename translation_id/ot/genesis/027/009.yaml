id: GEN.27.9
reference: Genesis 27:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: id
  text: Pergilah, tolong, ke kawanan ternak dan ambilkanlah untukku dari sana dua ekor anak kambing yang baik. Aku akan mengolahnya menjadi hidangan lezat[a] untuk ayahmu, seperti yang disukainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masakan sedap” atau “makanan istimewa” untuk מַטְעַמִּים.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Pergilah, tolong
  rationale: Imperatif לֶךְ dipertahankan, sedangkan partikel נָא menyampaikan permohonan atau desakan yang diperhalus; susunan ini menjaga kedua nuansa tersebut.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing. 'Kawanan ternak' cukup luas dan cocok karena anak kambing disebut secara khusus sesudahnya.
- source_word: וְקַח לִי מִשָּׁם
  choice: dan ambilkanlah untukku dari sana
  rationale: לקח berarti mengambil atau memperoleh; bentuk 'ambilkanlah untukku' secara alami menyatakan bahwa hewan itu diminta bagi si pembicara tanpa menambahkan arah gerak yang tidak dinyatakan secara eksplisit.
- source_word: שְׁנֵי גְּדָיֵי עִזִּים
  choice: dua ekor anak kambing
  rationale: Frasa konstruksi ini secara harfiah berarti dua anak dari kambing, yakni dua ekor kambing muda. Penggolong 'ekor' wajar dalam bahasa Indonesia.
- source_word: טֹבִים
  choice: yang baik
  rationale: טֹבִים menerangkan mutu atau kelayakan hewan-hewan itu. 'Yang baik' mempertahankan makna dasar tanpa mempersempitnya menjadi 'pilihan'.
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: Aku akan mengolahnya menjadi hidangan lezat
  rationale: מַטְעַמִּים merujuk pada masakan yang lezat atau istimewa. 'Mengolahnya menjadi hidangan lezat' jelas menyatakan bahwa anak-anak kambing itu akan dijadikan masakan.
- source_word: לְאָבִיךָ
  choice: untuk ayahmu
  rationale: Pilihan ini mempertahankan hubungan keluarga dan ragam narasi yang wajar serta bermartabat.
- source_word: כַּאֲשֶׁר אָהֵב
  choice: seperti yang disukainya
  rationale: Ungkapan ini menunjuk pada jenis masakan yang disukai Ishak. 'Disukainya' terdengar alami dalam bahasa Indonesia dan tidak memberi kesan bahwa objeknya adalah orang atau hewan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Partikel permohonan נָא dibuat eksplisit melalui 'tolong', sementara bentuk imperatif tetap dipertahankan. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar diterangkannya, yaitu 'hidangan lezat'.
