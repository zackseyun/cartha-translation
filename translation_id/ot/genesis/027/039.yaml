base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: id
  text: Lalu Ishak, ayahnya, menjawab dan berkata kepadanya[a], “Sesungguhnya, tempat tinggalmu akan berada jauh dari tanah yang subur dan dari embun langit di atas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesungguhnya, tempat tinggalmu akan berada di tanah yang subur dan mendapat embun dari langit di atas.” Preposisi Ibrani di sini dapat dipahami secara positif (“dari”) atau secara privatif (“jauh dari”).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Pemakaian naratif baku dari ענה untuk memperkenalkan jawaban dalam dialog.
- source_word: יִצְחָק אָבִיו
  choice: Ishak, ayahnya
  rationale: Mempertahankan nama dan penekanan relasional dalam susunan yang alami dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Penanda wacana yang mengarahkan perhatian pada pernyataan khidmat; lebih alami dalam ragam Indonesia bermartabat daripada seruan harfiah 'Lihatlah' dalam konteks ini.
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: jauh dari kesuburan bumi
  rationale: שְׁמַנִּים secara harfiah menunjuk pada 'kegemukan/kelimpahan' dan secara kiasan pada kesuburan. מִן dipahami secara privatif atau separatif, tetapi ambiguitasnya dicatat dalam catatan kaki.
- source_word: מוֹשָׁבֶךָ
  choice: tempat tinggalmu
  rationale: Mengungkapkan makna tempat kediaman secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: dan jauh dari embun langit
  rationale: מִן kembali dipahami secara privatif atau separatif, sejajar dengan frasa sebelumnya.
- source_word: מֵעָל
  choice: di atas
  rationale: Mempertahankan gambaran ruang dalam ungkapan Ibrani 'langit di atas'.
theological_decisions:
- issue: Makna preposisi מִן dalam perkataan Ishak kepada Esau
  choice: 'privatif/separatif: ''jauh dari'' kesuburan bumi dan embun langit'
  alternative: 'sumber/partitif: tempat tinggal yang mendapat bagian ''dari'' kesuburan bumi dan embun langit'
  rationale: Konteks berkat Esau yang terbatas dan kontras dengan berkat Yakub pada ayat 28 mendukung makna privatif. Namun, bentuk Ibraninya memungkinkan pembacaan positif, sehingga alternatif itu dipertahankan dalam catatan kaki dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'menjawab dan berkata' dipertahankan untuk mencerminkan struktur Ibrani, sedangkan ambiguitas utama pada מִן dinyatakan melalui catatan kaki.
