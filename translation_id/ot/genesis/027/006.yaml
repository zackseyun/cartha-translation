  text: Lalu Ribka berkata kepada Yakub, anaknya, “Sesungguhnya, aku mendengar ayahmu berkata kepada Esau, saudaramu,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: Lalu Ribka
  rationale: Konjungsi וְ melanjutkan alur narasi; “Lalu” alami dalam narasi Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אָֽמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: berkata kepada Yakub, anaknya
  rationale: Mempertahankan verba ujaran, arah tuturan, dan aposisi yang mengidentifikasi Yakub sebagai anak Ribka.
- source_word: הִנֵּה
  choice: Dengar
  rationale: Dalam konteks tuturan, kata ini menarik perhatian Yakub kepada laporan yang segera disampaikan; “Dengar” lebih alami daripada bentuk arkais “Lihatlah”, meski unsur mendengar juga muncul pada verba berikutnya.
- source_word: שָׁמַעְתִּי אֶת אָבִיךָ מְדַבֵּר
  choice: aku mendengar ayahmu berbicara
  rationale: Bentuk perfek menyatakan peristiwa yang telah didengar, sedangkan participium מְדַבֵּר menggambarkan tindakan berbicara yang sedang berlangsung pada saat itu.
- source_word: אֶל עֵשָׂו אָחִיךָ
  choice: kepada Esau, kakakmu
  rationale: אֶל menunjukkan arah bicara. “Kakakmu” memakai informasi hubungan usia yang jelas dalam konteks Kejadian dan merupakan padanan alami bahasa Indonesia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: לֵאמֹר kedua memperkenalkan kutipan bertingkat yang berlanjut pada ayat berikutnya; “katanya” mempertahankan penanda ujaran tanpa konstruksi yang terlalu kaku.
