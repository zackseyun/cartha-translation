base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: id
  text: Ia juga menyiapkan hidangan lezat, lalu membawanya kepada ayahnya dan berkata, “Ayah, bangunlah dan makanlah dari hasil buruan anakmu, supaya engkau[a] memberkati aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “supaya jiwamu memberkati aku.” Dalam ungkapan Ibrani ini, “jiwamu” dapat berarti “engkau.”
    reason: idiom_source_language
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: makanan lezat
  rationale: Kata ini menunjuk pada hidangan bercita rasa yang disiapkan secara khusus dalam kisah ini; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: גַּם הוּא
  choice: Ia juga
  rationale: Mempertahankan penekanan aditif yang menyejajarkan tindakan Esau dengan tindakan Yakub sebelumnya.
- source_word: יָקֻם אָבִי
  choice: Ayah, bangunlah
  rationale: Bentuk jusif menyampaikan permintaan sopan. Sapaan langsung ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah orang ketiga, tetapi tetap mempertahankan rasa hormat.
- source_word: מִצֵּיד בְּנוֹ
  choice: daging hasil buruan anakmu
  rationale: צַיִד merujuk pada hasil perburuan dalam konteks ini; penambahan 'daging' memperjelas bahwa yang dimakan ialah hidangan dari hasil buruan, bukan sekadar tindakan berburu.
- source_word: בַּעֲבוּר
  choice: supaya
  rationale: Menandai tujuan secara ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: jiwamu memberkati aku
  rationale: Mempertahankan penyebutan eksplisit נֶפֶשׁ dan ketegangan ungkapan Ibrani, meskipun secara idiomatis ungkapan itu dapat berarti 'engkau memberkati aku'.
- source_word: וַיָּבֵא לְאָבִיו
  choice: lalu membawanya kepada ayahnya
  rationale: Pronomina '-nya' secara alami merujuk kembali pada makanan lezat yang menjadi objek tersirat dalam teks Ibrani.
theological_decisions:
- issue: Makna idiom נַפְשֶׁךָ dalam permohonan berkat
  choice: jiwamu memberkati aku
  alternative: engkau memberkati aku
  rationale: Terjemahan utama mempertahankan unsur leksikal 'jiwa' karena ungkapan itu menambah kekhidmatan dan tidak mustahil dipahami dalam konteks, tanpa menetapkan arti teologis khusus bagi jiwa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami melalui sapaan langsung 'Ayah', sementara ungkapan 'jiwamu memberkati aku' sengaja mempertahankan bentuk khas bahasa sumber.
