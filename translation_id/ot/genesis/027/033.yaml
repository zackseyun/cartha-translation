  to: Lalu Ishak sangat gemetar dan berkata, “Siapakah gerangan orang yang telah memburu binatang buruan dan membawanya kepadaku? Aku telah memakan semuanya sebelum engkau datang, dan aku telah memberkatinya. Sungguh, ia akan diberkati.”
