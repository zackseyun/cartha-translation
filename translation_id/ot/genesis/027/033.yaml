  source_fidelity: 'Terjemahan pada umumnya mengikuti urutan dan isi Ibrani dengan baik: keguncangan Ishak, pertanyaan tentang pemburu yang membawa buruan, tindakan makan sebelum Esau datang, dan pemberkatan semuanya terjaga. Namun, kata “tetap” pada pernyataan terakhir menambahkan secara eksplisit gagasan keberlanjutan/ketakterbalikan yang tidak dinyatakan oleh יִהְיֶה sendiri, meskipun dapat disimpulkan dari konteks.'
  naturalness: Bahasa draf umumnya jelas dan sesuai register Alkitab modern. “Gemetar dengan sangat hebat” dapat dipahami, tetapi “sangat gemetar” lebih alami dalam bahasa Indonesia tanpa mengurangi intensitas sumber. Susunan pertanyaan juga menjadi lebih lancar dengan “Siapakah gerangan orang yang telah memburu ...”.
  terminology: “Ishak,” “binatang buruan,” “engkau,” dan “memberkati” tepat dan konsisten dengan register modern-baku. “Sungguh, ia akan diberkati” menyampaikan penegasan גַּם tanpa menambahkan nuansa “tetap.” Tidak ada catatan kaki yang diperlukan; alternatif “Sungguh/Ya” bersifat gaya dan tidak perlu diberi jangkar.
