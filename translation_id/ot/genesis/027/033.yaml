base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: id
  text: Lalu Ishak sangat gemetar dan berkata, “Siapakah gerangan orang yang telah memburu binatang buruan dan membawanya kepadaku? Aku telah memakan semuanya sebelum engkau datang, dan aku telah memberkatinya. Sungguh, ia akan diberkati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: gemetar dengan sangat hebat
  rationale: Konstruksi verba dan nomina serumpun menegaskan kuatnya guncangan Ishak. Ungkapan ini mempertahankan unsur jasmani dan emosional tanpa mempersempitnya menjadi rasa takut saja.
- source_word: מִי אֵפוֹא הוּא
  choice: Kalau begitu, siapakah orang ... itu?
  rationale: אֵפוֹא memberi nuansa inferensial sekaligus penegasan. 'Kalau begitu' alami dalam bahasa Indonesia ketika Ishak menyimpulkan bahwa orang lain telah datang sebelumnya.
- source_word: הַצָּד צַיִד
  choice: yang memburu binatang buruan
  rationale: צַיִד adalah hasil buruan secara umum, bukan khusus daging rusa. Bentuk ini mempertahankan gema antara verba dan objek dalam bahasa Ibrani.
- source_word: וַיָּבֵא לִי
  choice: dan membawanya kepadaku
  rationale: Objek tersirat merujuk kepada binatang buruan atau hidangan yang dibawa; pronomina '-nya' membuat rujukan itu jelas dan wajar dalam bahasa Indonesia.
- source_word: וָאֹכַל מִכֹּל
  choice: Aku telah memakan semuanya
  rationale: מִכֹּל secara harfiah bersifat partitif, 'dari semuanya'; dalam konteks hidangan, 'memakan semuanya' menyampaikan maksud secara alami tanpa mengubah acuan.
- source_word: בְּטֶרֶם תָּבוֹא
  choice: sebelum engkau datang
  rationale: Terjemahan temporal langsung yang mempertahankan sapaan tunggal kepada Esau.
- source_word: וָאֲבָרֲכֵהוּ
  choice: dan aku telah memberkatinya
  rationale: Subjek orang pertama dinyatakan agar rangkaian tindakan Ishak jelas dalam bahasa Indonesia; aspek selesai ditegaskan dengan 'telah'.
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: Ya, ia akan tetap diberkati
  rationale: גַּם menegaskan pernyataan, sedangkan bentuk 'akan tetap diberkati' menyampaikan bahwa berkat yang sudah diucapkan akan berlaku, tanpa menjelaskan mekanisme teologisnya.
theological_decisions:
- issue: Kekuatan pernyataan terakhir Ishak setelah berkat diberikan
  choice: Penegasan tegas bahwa orang yang telah diberkati itu akan tetap diberkati
  alternative: Pengakuan pasrah semata tanpa penegasan
  rationale: גַּם בָּרוּךְ יִהְיֶה memiliki daya penegasan. Terjemahan mempertahankan bobot naratif berkat yang sudah diucapkan tanpa memasukkan doktrin tambahan tentang bagaimana atau mengapa berkat itu berlaku.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan Ibrani pada ungkapan kegemparan dan perburuan dipertahankan sejauh masih alami; sapaan 'engkau' dipakai agar sesuai dengan register narasi Kitab Suci dan bentuk tunggal sumber.
