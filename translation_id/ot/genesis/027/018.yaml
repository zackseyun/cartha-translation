base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: id
  text: Lalu ia masuk menemui ayahnya dan berkata[a], “Ayahku.” Ayahnya menjawab, “Aku di sini. Siapakah kamu, anakku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Lalu ia datang kepada ayahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu ia masuk menemui
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, dan dalam konteks ini בוא menggambarkan Yakub masuk ke tempat ayahnya berada. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan umum 'datang kepada'.
- source_word: אֶל אָבִיו
  choice: ayahnya
  rationale: Frasa ini menyatakan arah kepada ayahnya. Nama Ishak tidak ditambahkan karena tidak terdapat dalam teks Ibrani.
- source_word: וַיֹּאמֶר
  choice: dan berkata / menjawab
  rationale: Pada ucapan pertama, 'berkata' mempertahankan pengantar tuturan biasa. Pada ucapan kedua, 'menjawab' secara alami menyatakan tanggapan sang ayah tanpa mengubah hubungan wacananya.
- source_word: אָבִי
  choice: Ayahku
  rationale: Nomina dengan sufiks orang pertama tunggal merupakan sapaan yang secara harfiah berarti 'ayahku'; bentuk posesif dipertahankan.
- source_word: הִנֶּנִּי
  choice: Ya, aku di sini
  rationale: Ungkapan respons Ibrani ini menyatakan kehadiran dan kesiapan menanggapi. 'Ya, aku di sini' terdengar wajar sebagai jawaban dalam bahasa Indonesia sekaligus mempertahankan unsur kehadirannya.
- source_word: מִי אַתָּה
  choice: Siapakah kamu
  rationale: Kata tanya dan pronomina orang kedua secara langsung menanyakan identitas lawan bicara.
- source_word: בְּנִי
  choice: anakku
  rationale: Nomina dengan sufiks orang pertama tunggal berfungsi sebagai sapaan; bentuk posesif mempertahankan keakraban ungkapan Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Bentuk 'ia' dipakai untuk narasi, sedangkan 'aku' dan 'kamu' dipakai dalam dialog keluarga. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
