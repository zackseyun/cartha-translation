  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: id
  text: Ribka sedang mendengarkan ketika Ishak berbicara kepada Esau, anaknya.[a] Kemudian Esau pergi ke padang untuk memburu binatang buruan dan membawanya pulang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ribka mendengar ketika Ishak sedang berbicara kepada Esau, anaknya.” Bentuk partisipel dan infinitif bahasa Ibrani memungkinkan susunan ini; teks utama menonjolkan tindakan mendengarkan yang sedang berlangsung.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk memburu binatang buruan untuk dibawa pulang.” Hubungan antara kedua bentuk tujuan dalam bahasa Ibrani dapat dinyatakan sebagai rangkaian yang dikoordinasikan atau sebagai tujuan yang bertingkat.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: וְ/רִבְקָה שֹׁמַעַת
  choice: Ribka sedang mendengarkan
  rationale: Partisipel שֹׁמַעַת menggambarkan tindakan yang sedang berlangsung sebagai latar adegan. Bentuk 'sedang mendengarkan' menyampaikan aspek duratif itu secara alami; וְ dipahami sebagai penghubung naratif dan tidak perlu selalu dinyatakan dengan 'dan' pada awal kalimat Indonesia.
- source_word: בְּ/דַבֵּר יִצְחָק
  choice: ketika Ishak berbicara
  rationale: Preposisi בְּ dengan infinitif konstruk menyatakan tindakan yang berlangsung bersamaan. 'Ketika ... berbicara' mempertahankan hubungan waktunya dalam bahasa Indonesia yang wajar.
- source_word: אֶל עֵשָׂו בְּנֹו
  choice: kepada Esau, anaknya
  rationale: אֶל menunjukkan arah tuturan, sedangkan sufiks pada בְּנוֹ menyatakan bahwa Esau adalah anak Ishak. Aposisi dengan koma jelas dan alami.
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: Kemudian Esau pergi ke padang
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. 'Kemudian' menyatakan perkembangan peristiwa, dan 'padang' mencakup medan terbuka yang dimaksud שָׂדֶה tanpa membatasinya menjadi lahan pertanian.
- source_word: לָ/צוּד צַיִד
  choice: untuk memburu binatang buruan
  rationale: צוד berarti memburu atau menangkap dalam konteks perburuan, sedangkan צַיִד menunjuk hasil buruan atau satwa buruan. Ungkapan ini mempertahankan pengulangan akar yang ada dalam bahasa Ibrani tanpa mempersempitnya menjadi jenis hewan tertentu.
- source_word: לְ/הָבִיא
  choice: dan membawanya pulang
  rationale: Infinitif ini menyatakan tujuan lanjutan. Pronomina '-nya' merujuk pada binatang buruan, sedangkan 'pulang' mengungkapkan arah kembali yang tersirat dalam konteks narasi secara alami.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama mengikuti bentuk Indonesia yang lazim: Ribka, Ishak, dan Esau. ''Binatang buruan'' dipilih agar cakupan צַיִד tidak dipersempit menjadi rusa atau daging rusa.'
