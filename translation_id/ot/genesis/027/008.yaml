  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: id
  text: Sekarang, anakku, dengarkanlah perkataanku sesuai dengan apa yang kuperintahkan kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Penanda wacana dan waktu ini menghubungkan perkataan Ribka dengan situasi sebelumnya sekaligus memperkenalkan perintah yang segera diberikan.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan dengan akhiran orang pertama tunggal; bentuk ini alami dan tetap mempertahankan keakraban sapaan seorang ibu.
- source_word: שְׁמַע בְּקֹלִי
  choice: dengarkanlah perkataanku
  rationale: Ungkapan Ibrani secara harfiah berarti 'dengarkan suaraku', tetapi secara idiomatis meminta seseorang memperhatikan dan mengikuti apa yang dikatakan. 'Dengarkanlah perkataanku' alami dalam bahasa Indonesia tanpa mempersempit maknanya menjadi 'taatilah'.
- source_word: לַאֲשֶׁר
  choice: tentang apa yang
  rationale: Memperkenalkan isi khusus yang harus didengarkan, yaitu perintah yang akan diberikan.
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: yang kuperintahkan kepadamu
  rationale: Partisip menunjukkan tindakan yang sedang atau segera berlangsung. Bentuk Indonesia ini menyampaikan bahwa Ribka kini memberikan perintah kepada Yakub.
theological_decisions:
- issue: Apakah שְׁמַע harus diterjemahkan sebagai ketaatan eksplisit
  choice: dengarkanlah
  alternative: taatilah
  rationale: Ketaatan tersirat dalam idiom tersebut, tetapi verba dasarnya tetap berhubungan dengan mendengar. Terjemahan tidak perlu menjadikan implikasi itu sebagai arti eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Jadi sekarang' mempertahankan kesinambungan וְ sekaligus fungsi temporal עַתָּה. 'Perkataanku' dipilih daripada ungkapan harfiah 'suaraku' agar idiomnya jelas bagi pembaca modern.
