base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: id
  text: Ketika perkataan Esau, anaknya yang sulung, diberitahukan kepada Ribka, ia menyuruh orang memanggil Yakub, anaknya yang bungsu, lalu berkata kepadanya, “Ketahuilah, Esau, kakakmu, sedang menghibur dirinya dengan rencana untuk membunuhmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי עֵשָׂו
  choice: perkataan Esau
  rationale: Mempertahankan bentuk jamak konstruksi Ibrani secara wajar dalam bahasa Indonesia; yang dimaksud ialah ucapan Esau sebelumnya.
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: anaknya yang sulung / anaknya yang bungsu
  rationale: Dalam konteks saudara kembar, istilah Indonesia ini secara alami menyatakan yang lahir lebih dahulu dan kemudian, sesuai fungsi komparatif ungkapan Ibrani.
- source_word: מִתְנַחֵם
  choice: sedang menghibur dirinya
  rationale: 'Menerjemahkan bentuk partisip refleksif secara langsung dan mempertahankan gambaran psikologis yang tajam: Esau memperoleh penghiburan dari gagasan pembalasan.'
- source_word: לְךָ
  choice: mengenai dirimu
  rationale: Preposisi ini menunjukkan bahwa Yakub menjadi sasaran atau pokok niat Esau; pilihan ini mempertahankan hubungan tersebut tanpa mengubahnya menjadi tindakan yang sudah terjadi.
- source_word: לְהָרְגֶךָ
  choice: dengan berniat membunuhmu
  rationale: Infinitif menyatakan bagaimana atau untuk tujuan apa Esau menghibur diri. 'Berniat' menyampaikan rencana pembunuhan yang tersirat oleh konteks ayat sebelumnya tanpa menyatakan bahwa upaya itu telah dimulai.
theological_decisions:
- issue: Hubungan antara penghiburan diri Esau dan pembunuhan Yakub
  choice: sedang menghibur dirinya mengenai dirimu dengan berniat membunuhmu
  alternative: sedang menghibur dirinya terhadapmu untuk membunuhmu
  rationale: Pilihan utama menjaga ketegangan teks bahwa rencana balas dendam menjadi sumber penghiburan Esau, sambil menghasilkan bahasa Indonesia yang dapat dipahami dan tidak menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan pasif pembuka dialihkan menjadi anak kalimat temporal agar alami, sedangkan pengulangan hubungan keluarga dan gambaran 'menghibur dirinya' dipertahankan.
