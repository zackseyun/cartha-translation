  source_fidelity: 'Draf mempertahankan unsur-unsur utama: pertanyaan heran Ishak, kecepatan menemukan, sapaan «anakku», nama Yahweh, dan «Allahmu». Namun «membuatnya kudapati» tidak alami dalam bahasa Indonesia modern dan mengaburkan konstruksi kausatif Ibrani. Terjemahan «telah membuat aku menemukannya» menyatakan bahwa Yahweh menyebabkan penemuan itu, tanpa menambahkan gagasan tindakan membawa.'
  naturalness: «Membuatnya kudapati» terdengar kaku dan tidak lazim. Selain itu, subjek «Jawabnya» dapat sesaat terasa tidak jelas setelah Ishak berbicara. «Anaknya menjawab» jelas dan tetap ringkas. «Bagaimana engkau bisa menemukannya begitu cepat» adalah bahasa Indonesia baku modern yang wajar dalam dialog naratif.
  terminology: «Ishak», «Yahweh», dan «Allahmu» tepat. Bentuk «Allahmu» wajib dipertahankan karena teks Ibrani memakai sufiks orang kedua tunggal, bukan «Allahku».
