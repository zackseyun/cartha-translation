base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: id
  text: Lalu Ishak berkata kepada anaknya, “Bagaimana engkau bisa menemukannya begitu cepat, anakku?” Anaknya menjawab, “Karena Yahweh, Allahmu, telah membuat aku menemukannya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “telah membuatnya terjadi di hadapanku”; ungkapan ini juga dapat dipahami sebagai “telah membuatku berhasil mendapatkannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: Bagaimana engkau bisa mendapatkannya begitu cepat
  rationale: Ungkapan pertanyaan ini menyatakan keheranan Ishak atas cepatnya hasil buruan diperoleh. Susunan Indonesia ini alami sekaligus mempertahankan unsur kecepatan dan tindakan mendapatkan sesuatu yang tersirat dari konteks.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan dengan akhiran orang pertama tunggal diterjemahkan secara langsung dan wajar sebagai sapaan penuh kedekatan.
- source_word: כִּי
  choice: Karena
  rationale: Kata ini memperkenalkan alasan yang diberikan dalam jawaban.
- source_word: הִקְרָה ... לְפָנָי
  choice: membuatnya kudapati
  rationale: Bentuk kausatif הִקְרָה menunjukkan bahwa sesuatu dibuat terjadi atau dijumpai. Terjemahan ini mengaitkannya dengan tindakan ‘mendapatkan’ dalam pertanyaan tanpa menambahkan tindakan membawa yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Akhiran orang kedua tunggal penting bagi ketegangan naratif: Yakub berkata ‘Allahmu’, bukan ‘Allahku’.'
theological_decisions:
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk Yahweh mempertahankannya sebagai nama pribadi.
- issue: Nuansa pemeliharaan ilahi dalam הִקְרָה ... לְפָנָי
  choice: membuatnya kudapati
  alternative: membuatku berhasil mendapatkannya; membuatnya terjadi di hadapanku
  rationale: Pilihan utama mempertahankan kausasi ilahi tetapi tidak memperkuatnya menjadi klaim teologis yang lebih khusus tentang keberhasilan. Catatan kaki menjaga ungkapan ruangiah Ibrani dan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Bentuk “engkau” dipakai agar dialog keluarga tetap akrab tanpa menjadi terlalu santai; “Allahmu” dipertahankan untuk menjaga ketegangan naratif.
