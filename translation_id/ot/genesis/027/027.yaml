  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: id
  text: Ia pun mendekat dan mencium ayahnya. Ayahnya mencium bau pakaiannya,[a] lalu memberkatinya dan berkata, “Lihatlah, bau anakku seperti bau padang yang telah diberkati Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencium bau pakaiannya.” Kata Ibrani yang sama untuk “bau” diulang lagi dua kali dalam ucapan berikutnya sehingga menimbulkan efek retoris.
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: Ia pun mendekat
  rationale: Bentuk naratif ini menyatakan bahwa sang anak bergerak mendekati ayahnya; “pun” menjaga alur urutan secara alami dalam bahasa Indonesia.
- source_word: וַיִּשַּׁק לוֹ
  choice: dan mencium ayahnya
  rationale: Kata kerja נשׁק berarti memberi ciuman. “Ayahnya” memperjelas rujukan pronomina berdasarkan konteks tanpa menyebut nama yang tidak terdapat dalam ayat ini.
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: Ayahnya mencium bau pakaiannya
  rationale: Pergantian subjek tersirat dalam bahasa Ibrani perlu diperjelas agar tidak membingungkan pembaca Indonesia. “Mencium bau” mempertahankan konstruksi dan pengulangan leksikal sumber.
- source_word: בְּגָדָיו
  choice: pakaiannya
  rationale: “Pakaian” merupakan padanan modern dan wajar bagi bentuk jamak kolektif בְּגָדִים dalam konteks ini.
- source_word: וַיְבָרֲכֵהוּ
  choice: lalu memberkatinya
  rationale: Menerjemahkan tindakan berurutan ברך dengan sufiks objek orang ketiga tunggal.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif ini berfungsi menarik perhatian. Bentuk “Lihatlah” mempertahankan citra sumber meskipun yang dibicarakan adalah bau.
- source_word: רֵיחַ בְּנִי ... כְּרֵיחַ שָׂדֶה
  choice: bau anakku seperti bau padang
  rationale: Pengulangan “bau” mempertahankan pengulangan רֵיחַ dan perbandingan yang ditandai oleh כְּ. “Padang” menyampaikan שָׂדֶה sebagai lahan terbuka atau ladang tanpa mempersempitnya secara berlebihan.
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: yang telah diberkati Yahweh
  rationale: Bentuk perfektif menggambarkan padang yang berada dalam keadaan telah menerima berkat; “telah diberkati” menyampaikan hasil tersebut secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung. “Yahweh” mempertahankan nama itu dan mengikuti transliterasi ilmiah yang luas digunakan.
- issue: Identitas pelaku dalam rangkaian pronomina
  choice: “Ia” untuk sang anak dan “ayahnya” untuk pihak yang mencium bau serta memberkati
  alternative: Mengulang “ia” pada kedua pelaku atau menambahkan nama Yakub dan Ishak
  rationale: Bahasa Ibrani mengandalkan konteks untuk pergantian subjek. Pilihan ini mencegah salah paham dalam bahasa Indonesia sambil menghindari penyisipan nama yang tidak tertulis dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Rujukan pronomina diperjelas secara minimal karena bahasa Indonesia akan terasa rancu jika semua pelaku hanya disebut “ia”. Pengulangan “bau” dipertahankan untuk mencerminkan gaya bahasa Ibrani.
