id: GEN.27.12
reference: Genesis 27:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: id
  text: Mungkin ayahku akan meraba aku[a], dan aku akan tampak di matanya seperti seorang penipu[b]; aku akan mendatangkan kutuk atas diriku sendiri, bukan berkat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyentuh aku.” Kata kerja Ibrani ini menunjuk pada mengenali atau memeriksa melalui sentuhan tangan.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti orang yang mempermainkan” atau “seperti orang yang mengejek.” Ungkapan Ibrani ini dapat menunjuk pada orang yang menyesatkan atau mempermainkan orang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Mungkin
  rationale: Mengungkapkan kemungkinan yang dicemaskan Yakub secara alami dalam bahasa Indonesia modern.
- source_word: יְמֻשֵּׁנִי
  choice: akan meraba aku
  rationale: Kata kerja משש menunjuk pada pemeriksaan dengan sentuhan tangan; 'meraba' tepat dengan konteks Ishak memeriksa identitas Yakub secara fisik.
- source_word: אָבִי
  choice: ayah
  rationale: Dalam ujaran orang pertama, 'ayah' merupakan padanan alami bagi 'ayahku' tanpa menghilangkan relasi kepemilikan yang sudah jelas.
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: lalu di matanya aku akan menjadi
  rationale: Mempertahankan idiom Ibrani 'di matanya' sambil menyusunnya secara wajar dalam bahasa Indonesia.
- source_word: כִּמְתַעְתֵּעַ
  choice: seperti orang yang mempermainkannya
  rationale: Bentuk partisipial ini dapat menunjuk pada orang yang menyesatkan, memperdaya, atau mempermainkan orang lain. Pilihan ini mempertahankan nuansa tindakan yang membuat Ishak menjadi sasaran tipu daya tanpa mempersempitnya hanya menjadi label 'penipu'.
- source_word: וְהֵבֵאתִי עָלַי
  choice: aku akan mendatangkan ... atas diriku
  rationale: 'Menyampaikan konstruksi kausatif: tindakan Yakub akan menyebabkan kutuk menimpa dirinya sendiri.'
- source_word: קְלָלָה
  choice: kutuk
  rationale: Padanan baku dan langsung yang berlawanan dengan berkat dalam konteks ini.
- source_word: וְלֹא בְרָכָה
  choice: bukan berkat
  rationale: Mempertahankan pertentangan langsung antara kutuk dan berkat dengan ungkapan Indonesia yang ringkas.
theological_decisions:
- issue: Sifat tindakan Yakub dalam כִּמְתַעְתֵּעַ
  choice: orang yang mempermainkannya
  alternative: penipu; orang yang mengejeknya
  rationale: Teks dapat menyiratkan penyesatan, olok-olok, atau tindakan mempermainkan seseorang. Terjemahan utama mempertahankan keluasan makna itu, sedangkan catatan kaki mencatat alternatifnya tanpa menetapkan penilaian teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan 'di matanya' dipertahankan karena mudah dipahami sekaligus mencerminkan idiom sumber. 'Dengan demikian' memperjelas hubungan akibat yang tersirat dalam rangkaian klausa Ibrani.
