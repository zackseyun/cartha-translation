revisions:
- from: Mungkin ayah akan meraba aku[a], lalu di matanya aku akan menjadi seperti orang yang mempermainkannya[b]. Dengan demikian, aku akan mendatangkan kutuk atas diriku, bukan berkat.
  to: Mungkin ayahku akan meraba aku[a], dan aku akan tampak di matanya seperti seorang penipu[b]; aku akan mendatangkan kutuk atas diriku sendiri, bukan berkat.
  rationale: Revisi mempertahankan struktur dan ketidakpastian sumber, memperjelas bahwa “di matanya” adalah idiom persepsi, dan memilih “penipu” sebagai makna kontekstual utama. Catatan kaki mempertahankan kemungkinan nuansa mempermainkan atau mengejek tanpa menambahkan objek yang tidak terdapat dalam teks Ibrani.
