base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: id
  text: Kiranya bangsa-bangsa melayani engkau, dan suku-suku bangsa sujud kepadamu.[a] Jadilah tuan atas saudara-saudaramu, dan kiranya saudara-saudaramu yang seibu sujud kepadamu. Terkutuklah mereka yang mengutuk engkau, dan diberkatilah mereka yang memberkati engkau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “sujud” dapat berarti membungkuk atau merebahkan diri sebagai tanda ketundukan dan penghormatan kepada pihak yang lebih tinggi, baik manusia maupun ilahi. Di sini konteksnya menunjuk penghormatan kepada seorang manusia.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, kedua rumus penutup memakai bentuk tunggal pada predikatnya: “Yang mengutuk engkau, terkutuk; dan yang memberkati engkau, diberkati.” Bentuk Indonesia memakai “mereka” untuk menyampaikan makna kolektifnya secara alami.'
    reason: translation_form
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: melayani engkau
  rationale: Bentuk Qal dari עבד dengan akhiran objek orang kedua tunggal maskulin menyatakan pelayanan atau ketundukan kepada penerima berkat. 'Melayani engkau' alami dan tetap cukup luas.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Kata ini menunjuk kelompok-kelompok masyarakat atau etnis dalam bentuk jamak; 'bangsa-bangsa' merupakan padanan Indonesia yang wajar.
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: sujud kepadamu
  rationale: Verba ini menyatakan tindakan membungkuk atau bersujud di hadapan pihak yang lebih tinggi. Dalam konteks penerima manusia, ungkapan ini menunjukkan penghormatan dan ketundukan, bukan dengan sendirinya penyembahan ilahi.
- source_word: לְאֻמִּים
  choice: suku-suku bangsa
  rationale: Istilah puitis yang sejajar dengan עַמִּים. 'Suku-suku bangsa' mempertahankan variasi dalam paralelisme tanpa mengubah acuannya kepada kelompok-kelompok manusia.
- source_word: הֱוֵה גְבִיר
  choice: Jadilah tuan
  rationale: הֱוֵה diikuti nomina predikatif memberi seruan berkat bernuansa imperatif, sedangkan גְבִיר menunjuk orang yang berkedudukan sebagai tuan atau penguasa. 'Tuan' mempertahankan gagasan kewenangan manusia.
- source_word: לְאַחֶיךָ
  choice: atas saudara-saudaramu
  rationale: Dalam konstruksi dengan גְבִיר, preposisi ל menandai mereka yang berada di bawah ketuanan; bahasa Indonesia secara idiomatis memakai 'atas'.
- source_word: בְּנֵי אִמֶּךָ
  choice: anak-anak ibumu
  rationale: Padanan ini mempertahankan ungkapan kekeluargaan Ibrani secara dekat dan membiarkan kaitannya dengan 'saudara-saudaramu' tetap terlihat.
- source_word: אֹרְרֶיךָ אָרוּר
  choice: Terkutuklah mereka yang mengutuk engkau
  rationale: Rumus kutuk timbal balik ini diterjemahkan dengan bentuk kolektif yang alami dalam bahasa Indonesia dan mempertahankan gaya khidmat berkat tersebut.
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: dan diberkatilah mereka yang memberkati engkau
  rationale: Terjemahan ini mempertahankan kesejajaran formal dengan klausa kutuk sebelumnya serta nilai kolektif predikat tunggal Ibrani.
theological_decisions:
- issue: Bahasa sujud yang diarahkan kepada seorang manusia
  choice: sujud kepadamu
  alternative: memberi hormat kepadamu; menyembah engkau
  rationale: Kata kerja Ibrani dapat menggambarkan sujud kepada Allah maupun kepada manusia. Konteks berkat Ishak berbicara tentang keunggulan sosial, politik, dan keluarga seorang manusia; 'sujud' mempertahankan tindakan yang dimaksud tanpa secara tersirat menetapkannya sebagai penyembahan ilahi.
- issue: Sebutan kewenangan גְבִיר
  choice: tuan
  alternative: penguasa; junjungan
  rationale: '''Tuan'' menyampaikan kedudukan berkuasa dalam hubungan antarmanusia tanpa menyamakannya dengan gelar ilahi ''Tuhan''.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan tunggal langsung dalam berkat puitis. Paralelisme Ibrani dipertahankan, sedangkan variasi 'bangsa-bangsa/suku-suku bangsa' menghindari pengulangan yang datar. Semua penanda catatan kaki dicantumkan dalam teks utama.
