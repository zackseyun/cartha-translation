  source_fidelity: 'Teks Indonesia secara tepat mencerminkan unsur-unsur Ibrani: ucapan pengantar, kedatangan saudara itu, cara yang ditandai בְּמִרְמָה, dan pengambilan berkat milik lawan bicara. Urutan naratif dalam "Lalu" dan "dan" tetap terjaga tanpa menambah rincian tafsir.'
