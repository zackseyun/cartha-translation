base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: id
  text: Lalu ia berkata, “Saudaramu datang dengan tipu daya[a] dan mengambil berkatmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dengan kelicikan” atau “secara licik.” Ungkapan Ibrani memakai kata benda (“tipu daya”) dengan sebuah preposisi sehingga cara tindakannya dapat diungkapkan secara alami dalam beberapa bentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan narasi dan memperkenalkan jawaban Ishak. “Lalu ia berkata” wajar dalam narasi bahasa Indonesia tanpa menambahkan penafsiran.
- source_word: בָּא
  choice: datang
  rationale: Bentuk qal perfektif dari בוא menyatakan tindakan lampau yang telah selesai; dalam konteks naratif, “datang” merupakan padanan Indonesia yang alami.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Menerjemahkan kata benda dengan sufiks orang kedua maskulin tunggal secara langsung. “Saudaramu” mempertahankan istilah kekerabatan Ibrani tanpa menggantinya dengan nama Yakub atau mempersempitnya menjadi “adikmu.”
- source_word: בְּמִרְמָה
  choice: dengan tipu daya
  rationale: Preposisi ב dengan nomina מִרְמָה menyatakan cara atau sarana. “Dengan tipu daya” mempertahankan bentuk nominal dan bobot moral ungkapan Ibrani, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: וַיִּקַּח
  choice: dan mengambil
  rationale: Bentuk wayyiqtol dari לקח meneruskan rangkaian tindakan. “Mengambil” adalah padanan umum dan tidak melebihkan unsur kekerasan yang tidak dinyatakan oleh kata sumber.
- source_word: בִּרְכָתֶךָ
  choice: berkatmu
  rationale: Padanan langsung untuk nomina “berkat” dengan sufiks orang kedua maskulin tunggal; ungkapan ringkas ini mempertahankan makna naratif berkat ayah yang dimaksudkan bagi Esau.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah “saudaramu” dipertahankan agar sesuai dengan kata kekerabatan umum dalam teks Ibrani, sedangkan penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
