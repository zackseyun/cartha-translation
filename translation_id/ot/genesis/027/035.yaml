  terminology: '"Tipu daya" merupakan padanan yang baik untuk מִרְמָה dan mempertahankan nuansa penipuan/kelicikan tanpa melebih-lebihkan. "Berkatmu" tepat bagi בִּרְכָתֶךָ dalam konteks berkat paternal. Catatan kaki memberikan alternatif yang relevan dan penandanya ditempatkan pada frasa yang dijelaskan.'
