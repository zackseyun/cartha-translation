  text: וְ/יָשַׁבְתָּ֥ עִמּ֖/וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר תָּשׁ֖וּב חֲמַ֥ת אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/044.yaml
  text: And stay with him for a few days[a], until your brother's fury turns away.
translation:
  language: id
  text: Tinggallah bersamanya beberapa hari, sampai amarah kakakmu mereda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Tinggallah
  rationale: Kata kerja יָשַׁב dapat berarti duduk, tinggal, menetap, atau berdiam. Dalam konteks perintah Ribka agar Yakub untuk sementara tinggal di rumah Laban, bentuk 'tinggallah' paling alami dan tepat.
- source_word: עִמּוֹ
  choice: bersamanya
  rationale: Preposisi עִם dengan sufiks orang ketiga tunggal maskulin berarti 'dengan dia'; acuannya ialah Laban dalam ayat sebelumnya.
- source_word: יָמִים אֲחָדִים
  choice: beberapa hari
  rationale: Ungkapan ini secara harfiah berarti 'hari-hari, beberapa' dan menyatakan jangka waktu singkat menurut perkiraan sang pembicara.
- source_word: עַד אֲשֶׁר
  choice: sampai
  rationale: Gabungan ini berfungsi sebagai penanda waktu yang menunjukkan batas berlangsungnya tindakan.
- source_word: תָּשׁוּב
  choice: mereda
  rationale: Kata שׁוּב secara dasar berarti 'kembali' atau 'berbalik'. Dengan amarah sebagai subjek, makna idiomatisnya ialah amarah itu surut atau mereda.
- source_word: חֲמַת
  choice: amarah
  rationale: Kata חֵמָה menunjuk pada kemarahan yang kuat atau menyala. 'Amarah' menyampaikan intensitas tersebut dalam bahasa Indonesia yang alami dan bermartabat.
- source_word: אָחִיךָ
  choice: kakakmu
  rationale: Secara leksikal berarti 'saudara laki-lakimu'. Dalam konteks, yang dimaksud ialah Esau, saudara kembar Yakub yang lahir lebih dahulu; 'kakakmu' mengidentifikasinya secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan alami. Bentuk imperatif '-lah' mempertahankan nada arahan Ribka. Tidak diperlukan catatan kaki karena makna idiomatis תָּשׁוּב dengan חֲמַת dapat disampaikan langsung sebagai 'amarah ... mereda' tanpa kehilangan ketegangan atau ambiguitas penting.
