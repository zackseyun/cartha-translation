  naturalness: Teks revisi lebih jelas dan lancar dalam bahasa Indonesia modern. “Kelimpahan biji-bijian dan air anggur baru” menghindari kemungkinan bahwa “yang berlimpah” hanya menerangkan “air anggur baru”.
