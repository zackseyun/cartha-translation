  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: id
  text: Semoga Allah mengaruniakan kepadamu embun dari langit[a], kesuburan dari bumi, serta kelimpahan biji-bijian dan air anggur baru.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau secara lebih harfiah: “dari embun langit dan dari kegemukan bumi.” Ungkapan Ibrani ini memakai gambaran kesuburan dan kelimpahan hasil bumi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Semoga ... memberimu
  rationale: Dalam konteks berkat, bentuk verba ini menyatakan harapan atau permohonan berkat, bukan sekadar ramalan masa depan.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Bentuk ini berfungsi sebagai sebutan definit bagi Allah; dalam bahasa Indonesia baku, 'Allah' merupakan padanan alami dan bermartabat.
- source_word: מִטַּל הַשָּׁמַיִם
  choice: embun dari langit
  rationale: Ungkapan ini mempertahankan citra embun surgawi sebagai sumber kesuburan; preposisi מִן dapat dipahami secara partitif, tetapi bahasa Indonesia tidak perlu menambahkan 'sebagian dari'.
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: kesuburan tanah
  rationale: Secara harfiah שְׁמַנֵּי berarti 'kegemukan/kekayaan', tetapi dalam berkat agraris menunjuk pada tanah yang subur dan kaya hasil.
- source_word: וְרֹב
  choice: yang berlimpah
  rationale: רֹב menyatakan kelimpahan atau jumlah yang besar; bentuk ini secara alami menerangkan kedua hasil bumi berikutnya.
- source_word: דָּגָן
  choice: gandum
  rationale: דָּגָן adalah istilah umum bagi biji-bijian pangan; 'gandum' merupakan padanan Alkitabiah yang lazim, meskipun cakupan Ibraninya lebih luas.
- source_word: וְתִירֹשׁ
  choice: dan air anggur baru
  rationale: תִּירוֹשׁ menunjuk pada anggur baru atau hasil buah anggur sebagai komoditas pertanian, berbeda dari istilah umum untuk anggur.
theological_decisions:
- issue: Sifat ucapan Ishak
  choice: 'Berupa harapan berkat: ''Semoga Allah memberimu'''
  alternative: 'Pernyataan masa depan: ''Allah akan memberimu'''
  rationale: Bentuk verbal dan konteks pemberkatan mendukung makna volitif. Terjemahan ini mempertahankan daya performatif berkat tanpa menambahkan kepastian teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Citra agraris dipertahankan, sedangkan idiom harfiah 'kegemukan tanah' diterjemahkan sebagai 'kesuburan tanah'. Paralelisme ayat dibuat lancar tanpa menambahkan 'sebagian dari', yang terdengar tidak alami dalam konteks berkat bahasa Indonesia.
