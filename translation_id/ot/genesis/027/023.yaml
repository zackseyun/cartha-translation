  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: id
  text: Ishak tidak mengenali Yakub karena tangan Yakub berbulu seperti tangan Esau, saudaranya. Maka ia memberkatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu ia memberkatinya.” Bentuk naratif Ibrani dapat dipahami sebagai urutan kejadian biasa, meskipun di sini juga dapat menyiratkan akibat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: tidak mengenalinya
  rationale: Bentuk Hifil dari נכר berarti mengenali atau mengidentifikasi. Dalam konteks ini, Ishak gagal mengenali Yakub melalui rabaan.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Ishak tidak mengenali Yakub.
- source_word: יָדָיו
  choice: tangan Yakub
  rationale: Secara harfiah berarti 'tangannya'. Nama Yakub dipakai agar rujukan pronomina tetap jelas dan alami dalam bahasa Indonesia.
- source_word: כִּידֵי
  choice: seperti tangan
  rationale: Prefiks כ menyatakan perbandingan; 'seperti tangan' mempertahankan perumpamaan secara alami.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Padanan langsung istilah kekerabatan dengan sufiks orang ketiga tunggal; dalam konteks ini merujuk kepada saudara Yakub.
- source_word: שְׂעִרֹת
  choice: berbulu
  rationale: Kata sifat ini menggambarkan tangan yang terasa ditumbuhi bulu, unsur sentuhan yang penting dalam penipuan tersebut.
- source_word: וַיְבָרְכֵהוּ
  choice: Maka ia memberkatinya
  rationale: 'Bentuk naratif dengan waw melanjutkan urutan kejadian dan dalam konteks dapat menyiratkan hasil: karena tidak mengenali Yakub, Ishak kemudian memberkatinya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Yakub disebut pada klausa pertama untuk menghindari rentetan pronomina yang ambigu; pronomina selanjutnya dapat dipahami dari konteks.
