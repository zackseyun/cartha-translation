base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: id
  text: Begitu Ishak selesai memberkati Yakub dan Yakub baru saja keluar[a] dari hadapan Ishak, ayahnya, Esau, saudaranya, datang dari berburu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian ini memakai pengulangan bentuk kata kerja “keluar” untuk menegaskan bahwa Yakub baru saja pergi.
    reason: Menjelaskan penekanan gramatikal dalam יָצֹא יָצָא yang tidak dapat ditiru secara harfiah tanpa menghasilkan bahasa Indonesia yang janggal.
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: Begitu ...
  rationale: Dua bentuk naratif ini menyusun rangkaian kejadian yang berlangsung sangat berdekatan. Dalam bahasa Indonesia, struktur dengan “Begitu” menyampaikan transisi naratif dan hubungan waktu secara wajar tanpa ungkapan arkais.
- source_word: כַּאֲשֶׁר כִּלָּה
  choice: Begitu ... selesai
  rationale: Gabungan ini menandai bahwa peristiwa berikutnya terjadi segera setelah Ishak menuntaskan tindakan memberkati.
- source_word: לְבָרֵךְ
  choice: memberkati
  rationale: Infinitif ini melengkapi כִּלָּה dan secara alami diterjemahkan “selesai memberkati”.
- source_word: אַךְ יָצֹא יָצָא
  choice: baru saja keluar
  rationale: Partikel אַךְ serta infinitif absolut yang diikuti verba finit menekankan bahwa Yakub baru saja meninggalkan tempat itu. Ungkapan ini mempertahankan kesan sempitnya selang waktu secara alami.
- source_word: מֵאֵת פְּנֵי
  choice: dari hadapan
  rationale: Pilihan ini mempertahankan gambaran relasional ungkapan Ibrani, bukan sekadar menyatakan bahwa Yakub pergi dari suatu lokasi.
- source_word: בָּא
  choice: datang
  rationale: Verba ini menyatakan kedatangan Esau; konteks sudah menunjukkan bahwa ia mendatangi tempat Ishak berada sehingga tambahan “masuk” tidak diperlukan.
- source_word: מִצֵּידוֹ
  choice: dari berburu
  rationale: צַיִד dapat menunjuk pada kegiatan berburu maupun hasil buruan. Dalam konstruksi ini, “datang dari berburu” secara alami menyatakan Esau kembali dari kegiatan tersebut tanpa menutup kemungkinan bahwa ia membawa hasil buruan.
