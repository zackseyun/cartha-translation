  yaml_path: translation/ot/genesis/027/002.yaml
  text: And he said, “Look now, I have grown old; I do not know the day of my death.”
translation:
  language: id
  text: Ia berkata, “Lihatlah, sekarang aku sudah tua. Aku tidak tahu kapan aku akan mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah, sekarang
  rationale: הִנֵּה berfungsi menarik perhatian, sedangkan נָא memberi nuansa ujaran yang halus atau mendesak; gabungan ini diterjemahkan secara alami tanpa menghilangkan kedua unsurnya.
- source_word: זָקַנְתִּי
  choice: aku sudah tua
  rationale: Bentuk perfektif orang pertama menyatakan bahwa Ishak telah menjadi tua; frasa ini alami dan langsung dalam bahasa Indonesia.
- source_word: לֹא יָדַעְתִּי יֹום מוֹתִי
  choice: Aku tidak tahu kapan aku akan mati
  rationale: Secara harfiah, 'aku tidak tahu hari kematianku'. Dalam konteks ini, 'kapan aku akan mati' menyampaikan idiom Ibrani dengan jelas dan wajar tanpa menyiratkan bahwa yang tidak diketahui hanya tanggal kalender.
