  yaml_path: translation/ot/genesis/027/024.yaml
  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: id
  text: Ia berkata[a], “Benarkah engkau anakku, Esau?” Lalu ia berkata, “Akulah dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Engkaukah ini, anakku Esau?” Susunan ini merupakan pertanyaan identifikasi yang tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia bertanya
  rationale: Dalam konteks ini, verba umum אמר memperkenalkan pertanyaan; 'bertanya' menyampaikan fungsi ujarannya secara alami dalam bahasa Indonesia.
- source_word: אַתָּה זֶה
  choice: Benarkah engkau
  rationale: Gabungan pronomina mandiri dan demonstrativa memberi penekanan pada identifikasi. 'Benarkah engkau' menangkap daya penegasan itu tanpa terjemahan harfiah yang kaku.
- source_word: בְּנִי
  choice: anakku
  rationale: Bentuk dengan sufiks orang pertama tunggal berarti 'anakku' dan dipertahankan secara langsung.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi digunakan dalam bentuk Indonesia yang lazim.
- source_word: וַיֹּאמֶר
  choice: Ia menjawab
  rationale: Walaupun אמר secara leksikal berarti 'berkata', dalam percakapan ini ujaran kedua merupakan jawaban; 'menjawab' lebih alami dan tetap setia pada fungsi konteksnya.
- source_word: אָֽנִי
  choice: Ya, akulah dia
  rationale: Pronomina mandiri ini menjadi jawaban identifikasi yang sangat ringkas. 'Akulah dia' menyampaikan identifikasi dengan jelas; 'Ya' tersirat sebagai jawaban afirmatif dalam bahasa Indonesia alami.
