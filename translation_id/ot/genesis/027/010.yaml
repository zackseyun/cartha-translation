  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: id
  text: Lalu bawalah makanan itu kepada ayahmu, dan ia akan memakannya supaya ia memberkatimu sebelum kematiannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: Lalu bawalah
  rationale: Bentuk perfektum Qal orang kedua maskulin tunggal dengan waw melanjutkan rangkaian instruksi; imperatif bahasa Indonesia menyampaikan daya perintahnya secara alami, sedangkan “Lalu” menandai urutan tindakan.
- source_word: לְאָבִיךָ
  choice: kepada ayahmu
  rationale: Padanan baku bagi אָב dengan sufiks orang kedua maskulin tunggal; “ayah” sesuai dengan ragam naratif yang bermartabat.
- source_word: וְאָכָל
  choice: supaya ia memakannya
  rationale: Tindakan makan merupakan langkah berikutnya dalam rencana dan berhubungan dengan tujuan yang dinyatakan oleh בַּעֲבוּר אֲשֶׁר. “Memakannya” secara alami merujuk kembali kepada makanan yang harus dibawa.
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: supaya
  rationale: 'Gabungan ini memperkenalkan tujuan: makanan dibawa dan dimakan dengan maksud agar sang ayah memberikan berkat.'
- source_word: יְבָרֶכְךָ
  choice: memberkatimu
  rationale: Piel imperfek orang ketiga maskulin tunggal dengan sufiks orang kedua maskulin tunggal dari ברך; padanan langsung ini mempertahankan konteks berkat patriarkal.
- source_word: לִפְנֵי מוֹתוֹ
  choice: sebelum ia meninggal
  rationale: Secara harfiah berarti “sebelum kematiannya”; bentuk verbal lebih wajar dalam bahasa Indonesia modern tanpa mengubah maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. “Makanan itu” memasok objek yang tersirat dari konteks ayat sebelumnya agar rujukannya jelas dalam bahasa Indonesia; hubungan tujuan dipertahankan tanpa menambahkan penafsiran teologis.
