  source_fidelity: 'Terjemahan dengan setia menyampaikan urutan dan isi Ibrani: kemarahan saudara Esau mereda dari Yakub, ia melupakan perbuatan Yakub, Ribka kemudian akan mengusahakan Yakub dibawa dari tempat itu, dan ia takut kehilangan kedua putranya dalam satu hari. “Kemarahan kakakmu terhadapmu reda” adalah padanan idiomatis yang tepat bagi שׁוּב ... מִמְּךָ. “Menyuruh orang menjemputmu” secara wajar mengungkapkan rangkaian ‘mengirim dan mengambilmu’ dalam bahasa Indonesia, tanpa menambahkan ‘kembali’.'
