  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: id
  text: sampai kemarahan kakakmu terhadapmu reda[a] dan ia melupakan apa yang telah kaulakukan kepadanya. Sesudah itu, aku akan menyuruh orang menjemputmu dari sana[b]. Mengapa aku harus kehilangan kalian berdua dalam satu hari?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sampai kemarahan kakakmu berbalik darimu.” Bahasa Ibrani memakai kata “berbalik/kembali” secara idiomatis untuk kemarahan yang mereda.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “aku akan mengirim dan mengambilmu dari sana.” Maksudnya tampaknya Ribka akan mengirim seseorang untuk menjemput Yakub.'
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “kehilangan kalian berdua dalam satu hari” kemungkinan menyatakan ketakutan Ribka bahwa akibat konflik itu akan merenggut kedua putranya, tidak harus dengan cara yang sama.
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: sampai kemarahan kakakmu terhadapmu reda
  rationale: שׁוּב dengan אַף merupakan ungkapan tentang surutnya kemarahan. 'Reda' alami dalam bahasa Indonesia, sedangkan מִמְּךָ dipahami secara relasional sebagai 'terhadapmu'. Karena Esau adalah saudara yang lebih tua, אָחִיךָ diterjemahkan 'kakakmu' sesuai konteks.
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: dan ia melupakan apa yang telah kaulakukan kepadanya
  rationale: Terjemahan langsung dan wajar yang mempertahankan tindakan Yakub pada masa lampau.
- source_word: וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם
  choice: Sesudah itu, aku akan menyuruh orang menjemputmu dari sana
  rationale: Kata kerja 'mengirim' tidak menyebut objek atau utusan secara eksplisit, tetapi rangkaiannya secara idiomatis berarti Ribka akan mengirim seseorang untuk mengambil Yakub dari sana. 'Menjemputmu' mempertahankan arah menuju Ribka tanpa menambahkan kata 'kembali' yang tidak dinyatakan tersendiri dalam Ibrani.
- source_word: לָמָה אֶשְׁכַּל גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: Mengapa aku harus kehilangan kalian berdua dalam satu hari?
  rationale: שכל menyatakan kehilangan anak atau keadaan berdukacita karena anak. 'Kehilangan kalian berdua' lebih alami bagi pembaca umum dan tetap mempertahankan daya ungkap seorang ibu; יוֹם אֶחָד diterjemahkan 'dalam satu hari'.
theological_decisions:
- issue: Cara Ribka dapat kehilangan kedua putranya dalam satu hari
  choice: Teks utama mempertahankan pernyataan umum 'kehilangan kalian berdua'.
  alternative: Menjelaskan bahwa Esau akan mati karena pembalasan setelah membunuh Yakub, atau bahwa keduanya akan hilang dengan cara yang sama.
  rationale: Teks Ibrani tidak menjelaskan mekanismenya. Terjemahan tidak boleh memastikan skenario tertentu; catatan hanya menunjukkan bahwa akibat konflik dapat berbeda bagi masing-masing anak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk 'kaulakukan' dipakai secara baku; 'kakakmu' memperjelas hubungan usia yang diketahui dari konteks. Ambiguitas mengenai bagaimana Ribka dapat kehilangan kedua anaknya tetap dipertahankan.
