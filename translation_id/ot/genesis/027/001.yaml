base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: id
  text: Ketika Ishak sudah tua dan matanya telah menjadi rabun sehingga ia tidak dapat melihat, ia memanggil Esau, anaknya yang lebih tua[a], lalu berkata kepadanya, “Anakku!” Esau menjawab, “Aku di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak sulungnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Gabungan pembuka naratif dan klausa waktu ini paling alami dinyatakan dengan “Ketika” dalam bahasa Indonesia modern; fungsi pengantar episode dipertahankan tanpa ungkapan arkais seperti “terjadilah.”
- source_word: זָקֵן
  choice: sudah tua
  rationale: Menyatakan keadaan Ishak pada usia lanjut dengan ungkapan Indonesia yang wajar dan langsung.
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: matanya telah menjadi rabun sehingga ia tidak dapat melihat
  rationale: Mengungkapkan meredupnya penglihatan serta akibat ketidakmampuan melihat yang terkandung dalam konstruksi Ibrani.
- source_word: וַיִּקְרָא
  choice: ia memanggil
  rationale: Dalam konteks ini קרא berarti memanggil atau meminta seseorang datang, tanpa harus menyiratkan pemanggilan resmi.
- source_word: אֶת עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: Esau, anaknya yang lebih tua
  rationale: הַגָּדֹל membedakan Esau sebagai anak yang lebih tua daripada Yakub; pilihan ini mempertahankan relasi perbandingan tersebut.
- source_word: בְּנִי
  choice: Anakku!
  rationale: Mempertahankan sapaan kekeluargaan dengan sufiks posesif orang pertama.
- source_word: הִנֵּנִי
  choice: Ya, aku di sini
  rationale: Menyampaikan rumus jawaban yang menyatakan kehadiran dan kesiapan; “Ya” membuat responsnya alami tanpa menggantikan unsur “aku di sini.”
