  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: id
  text: Ayahnya, Ishak, berkata kepadanya[a], “Siapakah kamu?” Lalu ia berkata, “Akulah anakmu, anak sulungmu[b], Esau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Ishak, ayahnya, berkata kepadanya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “anakmu yang tertua”; bahasa Ibrani menekankan kedudukan sebagai anak sulung, yang penting dalam kisah di sekitarnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: berkata kepadanya
  rationale: Kata kerja אמר adalah verba umum untuk berbicara, sedangkan לֹו menandai orang yang diajak bicara. Bentuk ini mempertahankan ungkapan Ibrani tanpa mengubahnya menjadi verba yang lebih khusus seperti 'bertanya'.
- source_word: יִצְחָק אָבִיו
  choice: Ayahnya, Ishak
  rationale: Secara harfiah susunannya 'Ishak, ayahnya'. Dalam bahasa Indonesia modern, 'Ayahnya, Ishak' terdengar alami, mempertahankan hubungan keluarga, dan mengenalkan nama pembicara dengan jelas.
- source_word: מִי אַתָּה
  choice: Siapakah kamu?
  rationale: Padanan langsung dan wajar bagi pertanyaan tentang identitas; bentuk 'siapakah' sesuai dengan register naratif Alkitab yang modern dan bermartabat.
- source_word: אֲנִי
  choice: Akulah
  rationale: Klausa nominal Ibrani tidak memakai kopula. 'Akulah' menyampaikan penegasan identitas secara alami dalam jawaban ini.
- source_word: בִּנְךָ
  choice: anakmu
  rationale: Bentuk בֵּן dengan sufiks orang kedua tunggal maskulin berarti langsung 'anakmu'.
- source_word: בְכֹרְךָ
  choice: anak sulungmu
  rationale: בְּכוֹר menunjuk anak yang lahir pertama dan membawa nuansa hak kesulungan dalam konteks. 'Anak sulungmu' lebih jelas dan alami daripada hanya 'sulungmu'.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi ini mengikuti bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Nuansa status בְּכוֹר dalam kisah berkat dan hak kesulungan
  choice: anak sulungmu
  alternative: anakmu yang tertua
  rationale: '''Anak sulung'' mempertahankan penekanan urutan kelahiran sekaligus kemungkinan nuansa status dan hak kesulungan, tanpa menambahkan penafsiran teologis ke dalam teks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara penekanan identitas dan status anak sulung dalam teks Ibrani tetap dipertahankan.
