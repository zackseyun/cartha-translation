revisions:
- from: Ishak menjawab Esau, “Lihat, aku telah menjadikan dia tuan atasmu dan menyerahkan semua saudaranya kepadanya sebagai hamba.[a] Aku telah menopang dia dengan gandum dan anggur baru.[b] Jadi, apa lagi yang dapat kulakukan bagimu, anakku?”
  to: Ishak menjawab Esau, “Lihat, aku telah menjadikan dia tuan atasmu dan menyerahkan semua saudaranya kepadanya sebagai hamba.[a] Aku telah mencukupi dia dengan hasil biji-bijian dan anggur baru.[b] Jadi, apa yang dapat kulakukan bagimu, anakku?”
  rationale: Revisi menghilangkan penyempitan makna “gandum” untuk דָּגָן, menghindari tambahan eksplisit “lagi” dalam pertanyaan retoris, dan memakai padanan yang lebih alami bagi verba סָמַךְ dalam konteks pemberian bahan pangan. Tidak ada perubahan pada hierarki keluarga, status “hamba,” atau makna berkat dalam teks.
