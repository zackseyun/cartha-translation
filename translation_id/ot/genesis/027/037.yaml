  text: וַ/יַּ֨עַן יִצְחָ֜ק וַ/יֹּ֣אמֶר לְ/עֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥י/ו לָ/ךְ֙ וְ/אֶת כָּל אֶחָ֗י/ו נָתַ֤תִּי ל/וֹ֙ לַ/עֲבָדִ֔ים וְ/דָגָ֥ן וְ/תִירֹ֖שׁ סְמַכְתִּ֑י/ו וּ/לְ/כָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: id
  text: Ishak menjawab Esau, “Lihat, aku telah menjadikan dia tuan atasmu dan menyerahkan semua saudaranya kepadanya sebagai hamba.[a] Aku telah mencukupi dia dengan hasil biji-bijian dan anggur baru.[b] Jadi, apa yang dapat kulakukan bagimu, anakku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai budak.” Kata Ibrani ini dapat berarti hamba atau budak, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku telah menopang dia dengan hasil biji-bijian dan anggur baru.” Kata kerja Ibrani ini dapat menekankan tindakan menopang, menyokong, atau menyediakan kebutuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן יִצְחָק וַיֹּאמֶר לְעֵשָׂו
  choice: Ishak menjawab Esau
  rationale: Rangkaian ‘menjawab dan berkata’ merupakan formula naratif Ibrani; dalam bahasa Indonesia modern, ‘menjawab Esau’ menyampaikan fungsinya secara alami tanpa pengulangan yang kaku.
- source_word: הֵן
  choice: Lihat
  rationale: Kata seru ini menarik perhatian dan memberi penekanan; ‘Lihat’ mempertahankan dayanya dalam ragam modern.
- source_word: גְּבִיר שַׂמְתִּיו לָךְ
  choice: aku telah menjadikan dia tuan atasmu
  rationale: Konstruksi שׂים dengan nomina predikatif menyatakan penetapan status. ‘Tuan atasmu’ mempertahankan hubungan kuasa tanpa memakai gelar ilahi.
- source_word: כָּל אֶחָיו
  choice: semua saudaranya
  rationale: Terjemahan langsung mempertahankan istilah kekerabatan maskulin jamak dalam teks.
- source_word: לַעֲבָדִים
  choice: sebagai hamba
  rationale: עבד dapat menunjuk hamba atau budak. ‘Hamba’ cocok dengan konteks penundukan dalam berkat, sementara alternatif yang lebih keras dicatat dalam catatan kaki.
- source_word: דָגָן וְתִירֹשׁ
  choice: gandum dan anggur baru
  rationale: דגן menunjuk hasil biji-bijian dan secara kontekstual dapat diterjemahkan ‘gandum’; תירוש adalah anggur baru atau hasil anggur segar.
- source_word: סְמַכְתִּיו
  choice: Aku telah menopang dia
  rationale: סמך berarti menopang atau menyokong; bersama hasil pertanian, ungkapan ini juga menyiratkan pemeliharaan atau penyediaan.
- source_word: וּלְכָה אֵפוֹא מָה אֶעֱשֶׂה
  choice: Jadi, apa lagi yang dapat kulakukan bagimu
  rationale: Pertanyaan retoris ini beralih kepada akibat bagi Esau dan menyatakan terbatasnya tindakan Ishak setelah berkat diberikan. ‘Apa lagi’ alami dalam bahasa Indonesia dan menangkap konteks tersebut.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan kekeluargaan yang langsung dan penuh afeksi dipertahankan.
theological_decisions:
- issue: Daya tetap berkat yang telah diucapkan
  choice: Pertanyaan diterjemahkan secara retoris tanpa menjelaskan mengapa Ishak tidak membatalkan berkat itu.
  alternative: Menambahkan bahwa berkat tersebut tidak dapat ditarik kembali.
  rationale: Teks hanya menyiratkan keterbatasan Ishak melalui pertanyaan; penjelasan teologis tambahan akan melampaui sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat ‘kulakukan’ menjaga kelancaran dialog. ‘Tuan’ dipilih untuk otoritas manusia dalam lingkup keluarga, sedangkan dua catatan kaki mempertahankan keluasan makna עבד dan סמך.
