base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: id
  text: Lalu Yakub berkata kepada ayahnya, “Akulah Esau, anak sulung Ayah. Aku sudah melakukan seperti yang Ayah katakan kepadaku. Silakan bangun, duduk, dan makanlah daging hasil buruanku, supaya Ayah memberkati aku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “supaya jiwa Ayah memberkati aku”; kata Ibrani untuk “jiwa/diri” di sini merujuk secara idiomatis kepada orang itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: Lalu Yakub berkata kepada ayahnya
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara alami tanpa memberi hubungan sebab-akibat yang tidak tersurat.
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: Akulah Esau, anak sulung Ayah
  rationale: “Akulah” mempertahankan penegasan pronomina אָנֹכִי. Sapaan “Ayah” wajar dalam tuturan seorang anak kepada bapaknya dan tetap mempertahankan klaim menipu Yakub.
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: Aku sudah melakukan seperti yang Ayah katakan kepadaku
  rationale: Terjemahan ini alami dalam bahasa Indonesia serta mempertahankan acuan kepada perintah Ishak sebelumnya.
- source_word: קוּם נָא שְׁבָה
  choice: Bangunlah, silakan duduk
  rationale: קוּם diterjemahkan secara langsung sebagai “bangunlah”; partikel permohonan נָא dinyatakan dengan “silakan”, sehingga rangkaian perintah tetap sopan dan alami.
- source_word: וְאָכְלָה מִצֵּידִי
  choice: dan makanlah daging hasil buruanku
  rationale: צַיִד dalam konteks ini menunjuk kepada hewan buruan yang telah disiapkan sebagai makanan; “daging hasil buruanku” lebih jelas bagi pembaca Indonesia daripada hanya “buruanku”.
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: supaya Ayah memberkati aku
  rationale: בַּעֲבוּר menyatakan tujuan. נֶפֶשׁ di sini berfungsi idiomatis untuk diri atau pribadi, sehingga subjek alami dalam bahasa Indonesia ialah “Ayah”; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna נַפְשֶׁךָ dalam ungkapan תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: supaya Ayah memberkati aku
  alternative: supaya jiwa Ayah memberkati aku
  rationale: נֶפֶשׁ di sini merupakan ungkapan Ibrani bagi pribadi atau diri, bukan pernyataan antropologis mengenai jiwa sebagai bagian terpisah dari manusia. Terjemahan idiomatis menyampaikan maksud teks, sedangkan bentuk lebih harfiah dicatat agar unsur sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan tetap khidmat. Sapaan kekerabatan “Ayah” digunakan dalam dialog langsung; sufiks orang kedua pada “anak sulungmu” dan “jiwamu” disesuaikan dengan kebiasaan bahasa Indonesia yang memakai istilah kekerabatan sebagai sapaan hormat.
