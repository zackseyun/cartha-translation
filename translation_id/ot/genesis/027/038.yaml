  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶל אָבִ֗י/ו הַֽ/בְרָכָ֨ה אַחַ֤ת הִֽוא לְ/ךָ֙ אָבִ֔/י בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִ֑/י וַ/יִּשָּׂ֥א עֵשָׂ֛ו קֹל֖/וֹ וַ/יֵּֽבְךְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: id
  text: Kata Esau kepada ayahnya[a], “Apakah Ayah hanya mempunyai satu berkat? Berkatilah aku juga, Ayah!” Lalu Esau menangis dengan suara keras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apakah berkat itu satu bagimu, ayahku?” Ungkapan Ibrani ini menyatakan kepedihan Esau karena Ishak tampaknya hanya mempunyai satu berkat untuk diberikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: Apakah Ayah hanya mempunyai satu berkat?
  rationale: Klausa tanpa verba ini secara harfiah berbunyi kira-kira, 'Apakah berkat itu satu bagimu?' Dalam konteks, pertanyaan retoris ini mengungkapkan kepedihan Esau karena Ishak tampaknya hanya mempunyai satu berkat untuk diberikan. Bentuk yang dipilih wajar dalam bahasa Indonesia modern.
- source_word: אָבִי
  choice: Ayah
  rationale: Sapaan 'Ayah' secara alami menyatakan hubungan orang pertama dalam bahasa Indonesia. Pengulangannya dipertahankan untuk menyampaikan permohonan emosional Esau.
- source_word: בָּרֲכֵנִי
  choice: Berkatilah aku
  rationale: Menerjemahkan secara langsung bentuk imperatif dari ברך dengan akhiran orang pertama tunggal.
- source_word: גַּם אָֽנִי
  choice: aku juga
  rationale: Menjaga penekanan pada keinginan Esau untuk turut menerima berkat, selain Yakub.
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: dengan suara keras
  rationale: Ungkapan Ibrani harfiahnya berarti 'mengangkat suaranya'. Bersama verba 'menangis', bahasa Indonesia yang alami mengungkapkannya sebagai menangis dengan suara keras.
- source_word: וַיֵּבְךְּ
  choice: menangis
  rationale: Verba ini secara khusus menyatakan tangisan atau ratapan, bukan sekadar berseru.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions: []
