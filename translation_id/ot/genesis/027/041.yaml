  to: Esau menaruh dendam terhadap Yakub karena berkat yang diberikan ayahnya kepada Yakub.[a] Esau berkata dalam hatinya,[b] “Hari-hari perkabungan bagi ayahku semakin mendekat;[c] sesudah itu aku akan membunuh Yakub, saudaraku.”
  rationale: Revisi mengganti “adikku” dengan “saudaraku” agar tidak menambahkan usia relatif yang tidak diekspresikan dalam אָחִי, dan mengganti “sudah dekat” dengan “semakin mendekat” untuk mencerminkan יִקְרְבוּ. Catatan kaki c juga dinetralkan menjadi “sang ayah,” sehingga alternatif gramatikalnya tetap berlabuh pada ungkapan ayat, bukan pada penjelasan kontekstual.
