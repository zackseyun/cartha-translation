base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: id
  text: Esau menaruh dendam terhadap Yakub karena berkat yang diberikan ayahnya kepada Yakub.[a] Esau berkata dalam hatinya,[b] “Hari-hari perkabungan bagi ayahku semakin mendekat;[c] sesudah itu aku akan membunuh Yakub, saudaraku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “karena berkat yang dengannya ayahnya telah memberkati dia.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “berkata dalam hatinya” berarti berkata kepada dirinya sendiri atau berpikir dalam batin.
    reason: lexical_alternative
  - marker: c
    text: Atau, “Hari-hari dukacita ayahku semakin mendekat.” Ungkapan Ibrani dapat dipahami sebagai perkabungan bagi sang ayah setelah kematiannya atau sebagai masa dukacita yang dialami sang ayah sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: menaruh dendam terhadap
  rationale: Kata kerja שׂטם menyatakan permusuhan atau kebencian yang dipelihara, bukan sekadar perasaan sesaat. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan niat Esau yang kemudian dinyatakan.
- source_word: עַל הַבְּרָכָה
  choice: karena berkat
  rationale: Kata depan עַל di sini menyatakan sebab atau alasan.
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: yang diberikan ayahnya kepada Yakub
  rationale: Terjemahan ini menjelaskan rujukan pronomina Ibrani secara alami dalam bahasa Indonesia dan tetap mempertahankan tindakan sang ayah dalam memberikan berkat kepada Yakub.
- source_word: בְּלִבּוֹ
  choice: dalam hatinya
  rationale: Idiom Ibrani ini menggambarkan perkataan batin atau pemikiran pribadi; bentuk harfiahnya tetap mudah dipahami dalam bahasa Indonesia.
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: Hari-hari perkabungan bagi ayahku sudah dekat
  rationale: Terjemahan ini mempertahankan hubungan konstruksi Ibrani yang dapat menunjuk pada masa berkabung sehubungan dengan sang ayah, sambil menyampaikan bahwa waktunya dianggap mendekat.
- source_word: וְאַהַרְגָה
  choice: sesudah itu aku akan membunuh
  rationale: 'Bentuk verba menyatakan tekad Esau. ''Sesudah itu'' mengungkapkan urutan waktu yang tersirat: pembunuhan direncanakan setelah masa perkabungan tiba.'
- source_word: אָחִי
  choice: adikku
  rationale: Yakub adalah saudara laki-laki Esau yang lebih muda; 'adikku' merupakan ungkapan kepemilikan dan hubungan keluarga yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna יְמֵי אֵבֶל אָבִי
  choice: masa perkabungan bagi Ishak setelah kematiannya
  alternative: masa dukacita yang dialami Ishak sendiri
  rationale: Konteks niat Esau untuk menunggu kematian ayahnya mendukung bacaan pertama, tetapi struktur Ibraninya memungkinkan bacaan kedua; ambiguitas itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. 'Menaruh dendam' dipilih untuk menyampaikan permusuhan yang dipelihara; penanda wacana dan urutan waktu dibuat alami tanpa menghilangkan ambiguitas utama pada frasa tentang perkabungan.
