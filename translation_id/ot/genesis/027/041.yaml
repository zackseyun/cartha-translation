  naturalness: Teksnya jelas dan menggunakan bahasa Indonesia baku yang alami. “Menaruh dendam terhadap” dengan baik menyampaikan permusuhan yang dipelihara. “Saudaraku” tetap wajar dalam gaya naratif Alkitab dan menghindari penambahan makna.
  terminology: “Berkat,” “perkabungan,” “dalam hatinya,” dan “membunuh” sesuai dengan istilah serta register sumber. Catatan pada frasa perkabungan perlu tetap menjaga dua kemungkinan sintaksis Ibrani tanpa menjadikan nama Ishak bagian dari terjemahan frasa itu.
