  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: id
  text: Sekarang, ambillah perlengkapanmu—tabung anak panahmu dan busurmu—lalu pergilah ke padang dan burulah hewan buruan untukku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “buruan”; kata Ibrani terakhir dapat menunjuk pada hasil berburu, termasuk makanan hasil buruan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan langsung kepada perintah berikutnya; bahasa Indonesia tidak memerlukan penghubung tambahan untuk menyampaikan daya wacana Ibraninya.
- source_word: שָׂא נָא
  choice: bawalah
  rationale: Dalam konteks perlengkapan berburu, שׂא berarti membawa atau mengambil untuk dibawa. Partikel נָא memberi pelunakan atau desakan; bentuk -lah menyampaikan nuansa itu secara wajar tanpa menambahkan kata 'tolong' yang kurang cocok dengan register naratif ini.
- source_word: כֵלֶיךָ
  choice: perlengkapanmu
  rationale: כְּלִי adalah istilah umum bagi alat atau perlengkapan, lalu dijelaskan secara khusus oleh tabung anak panah dan busur.
- source_word: תֶּלְיְךָ
  choice: tabung anak panah
  rationale: Menunjuk wadah yang digantung untuk membawa anak panah; ungkapan ini lebih mudah dipahami pembaca umum daripada istilah teknis 'tabung panah' atau 'iver'.
- source_word: וְקַשְׁתֶּךָ
  choice: dan busurmu
  rationale: Padanan langsung dan alami bagi קֶשֶׁת dalam konteks berburu.
- source_word: וְצֵא הַשָּׂדֶה
  choice: lalu pergilah ke padang
  rationale: שָׂדֶה di sini menunjuk daerah terbuka tempat berburu. 'Padang' mempertahankan gambaran konkret tanpa menyiratkan lahan pertanian tertentu.
- source_word: וְצוּדָה לִּי צידה
  choice: dan burulah binatang untukku
  rationale: Kata kerja צוּד berarti berburu atau menangkap buruan, sedangkan צַיִדָה menunjuk hasil buruan sebagai makanan. 'Binatang' dipahami sebagai objek perburuan dalam konstruksi ini; catatan kaki mempertahankan kemungkinan penekanan pada hasil buruan atau makanan buruan.
