  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: id
  text: Ketika Esau mendengar perkataan ayahnya, ia menjerit dengan teriakan yang sangat dahsyat dan pahit[a], lalu berkata kepada ayahnya, “Berkatilah aku juga, Ayahku!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih harfiah: “ia berseru suatu seruan yang besar dan pahit, sangat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: Ketika ... mendengar
  rationale: Konstruksi infinitif dengan כִּי menyatakan keadaan waktu. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan kesan kesegeraan yang tidak dinyatakan secara tegas.
- source_word: דִּבְרֵי אָבִיו
  choice: perkataan ayahnya
  rationale: דָּבָר di sini merujuk pada kata-kata yang diucapkan Ishak. “Perkataan ayahnya” mempertahankan bentuk leksikal teks dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיִּצְעַק צְעָקָה
  choice: ia menjerit dengan jeritan
  rationale: Pengulangan akar kata pada verba dan nomina memberi penekanan kuat. Terjemahan ini mempertahankan kedua unsur tersebut meskipun sedikit lebih formal daripada ungkapan sehari-hari.
- source_word: גְּדֹלָה
  choice: keras
  rationale: Makna dasarnya adalah “besar”, tetapi ketika menerangkan jeritan, “keras” menyampaikan besarnya intensitas secara alami tanpa membatasi seluruh ungkapan pada volume semata.
- source_word: וּמָרָה
  choice: dan getir
  rationale: מַר/מָרָה menggambarkan kepahitan dan penderitaan emosional. “Getir” lebih alami untuk jeritan dalam bahasa Indonesia daripada “pahit” sambil tetap mempertahankan daya emosionalnya.
- source_word: עַד מְאֹד
  choice: amat
  rationale: Ungkapan ini sangat menguatkan sifat jeritan. “Amat” ringkas, bermartabat, dan sesuai dengan intensitas teks Ibrani.
- source_word: בָּרֲכֵנִי
  choice: Berkatilah aku
  rationale: Bentuk imperatif dengan akhiran orang pertama tunggal diterjemahkan secara langsung dan mendesak.
- source_word: גַּם אָנִי
  choice: aku juga
  rationale: Frasa ini menekankan permohonan Esau agar dirinya pun menerima berkat. Susunan ini alami setelah verba “berkatilah” dalam bahasa Indonesia.
- source_word: אָבִי
  choice: Ayahku
  rationale: Akhiran posesif dinyatakan secara eksplisit, dan bentuk sapaan ini mempertahankan kepedihan serta kedekatan dalam permohonan Esau.
