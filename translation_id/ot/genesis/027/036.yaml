base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: id
  text: 'Lalu berkatalah Esau, “Bukankah tepat ia dinamai Yakub? Sebab sudah dua kali ia memperdaya aku[a]: hak kesulunganku diambilnya, dan lihatlah, sekarang berkatku pun diambilnya.” Kemudian katanya, “Tidakkah Ayah menyisakan suatu berkat bagiku?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai permainan kata antara nama “Yakub” dan kata kerja yang diterjemahkan “memperdaya aku”. Kata kerja itu juga dapat berarti “mengakali aku” atau “mengambil keuntungan dari aku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: Bukankah tepat ia dinamai Yakub?
  rationale: Pertanyaan retoris ini menyatakan keluhan pahit Esau dan mengantar permainan kata dengan nama Yakub. Bentuk ‘bukankah tepat’ alami dalam bahasa Indonesia serta tidak memaksakan etimologi nama ke dalam teks utama.
- source_word: וַיַּעְקְבֵנִי
  choice: ia memperdaya aku
  rationale: Dalam konteks ini verba עקב dapat berarti memperdaya, mengakali, atau mengambil keuntungan atas orang lain. ‘Memperdaya’ paling jelas bagi pembaca modern; permainan bunyinya dengan יַעֲקֹב dijelaskan dalam catatan kaki karena tidak dapat dipertahankan secara alami dalam bahasa Indonesia.
- source_word: זֶה פַעֲמַיִם
  choice: sudah dua kali
  rationale: Ungkapan idiomatis ini menekankan dua kejadian yang baru dirinci Esau. ‘Sudah dua kali’ lebih alami daripada terjemahan harfiah ‘dua kali ini’.
- source_word: בְּכֹרָתִי
  choice: hak kesulunganku
  rationale: Menunjuk pada kedudukan dan hak istimewa sebagai anak sulung; ‘hak kesulungan’ merupakan padanan Indonesia yang tepat dan mapan.
- source_word: לָקָח
  choice: diambilnya
  rationale: Mempertahankan verba umum ‘mengambil’ tanpa menaikkannya menjadi ‘merampas’. Susunan pasif-inversi ‘diambilnya’ menonjolkan hal-hal yang menurut Esau telah hilang darinya.
- source_word: וְהִנֵּה עַתָּה
  choice: dan lihatlah, sekarang
  rationale: ‘Lihatlah’ menyampaikan daya seru הִנֵּה dalam ragam Indonesia yang dignified namun tetap mudah dipahami.
- source_word: בִּרְכָתִי
  choice: berkatku
  rationale: Padanan langsung yang mempertahankan bobot kontekstual berkat patriarkal Ishak.
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: Tidakkah Ayah menyisakan suatu berkat bagiku?
  rationale: אָצַל di sini berarti menahan atau menyisakan. Sapaan ‘Ayah’ tersirat dari orang kedua tunggal dan dibuat eksplisit agar permohonan Esau kepada Ishak terdengar alami dalam bahasa Indonesia; ‘suatu berkat’ mempertahankan ketakrifan yang tidak ditentukan dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Permainan kata Ibrani tidak direka secara artifisial dalam teks utama, melainkan diterangkan dalam catatan kaki. Nama Esau dan sapaan Ayah dibuat eksplisit untuk kejernihan rujukan dan kewajaran dialog.
