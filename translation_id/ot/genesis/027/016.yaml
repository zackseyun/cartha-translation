  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: id
  text: Ia memasangkan kulit anak-anak kambing itu pada kedua tangan Yakub dan pada bagian lehernya yang licin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: kulit
  rationale: Bentuk jamak konstruktus ini menunjuk pada kulit binatang yang dipakai sebagai penutup; dalam bahasa Indonesia, bentuk nomina 'kulit' lazim tanpa penandaan jamak eksplisit karena jumlahnya sudah jelas dari konteks.
- source_word: גְּדָיֵי הָעִזִּים
  choice: anak-anak kambing
  rationale: Ungkapan ini secara harfiah menunjuk pada kambing-kambing muda. 'Anak-anak kambing' alami, jelas, dan mempertahankan bentuk jamak sumber.
- source_word: הִלְבִּישָׁה
  choice: memasangkan
  rationale: Bentuk Hifil dari לבש berarti mengenakan sesuatu kepada orang lain. Dalam konteks kulit yang ditempatkan pada anggota tubuh, 'memasangkan' lebih alami dan tepat daripada 'mengenakan pakaian'.
- source_word: עַל יָדָיו
  choice: pada kedua tangan Yakub
  rationale: Bahasa Indonesia lazim memakai 'kedua tangan' untuk pasangan anggota tubuh. Nama 'Yakub' memperjelas rujukan pronomina Ibrani dalam rangkaian tindakan tanpa mengubah referennya.
- source_word: חֶלְקַת צַוָּארָיו
  choice: bagian lehernya yang licin
  rationale: חֶלְקַת menyatakan bagian atau permukaan yang licin. Terjemahan ini konkret dan mempertahankan kontras kontekstual dengan tubuh Esau yang berbulu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan alami dan bermartabat. Subjek feminin Ibrani diterjemahkan sebagai 'Ia' karena identitas Ribka sudah tersedia dalam konteks dekat; objek pronominal diperjelas menjadi 'Yakub' pada penyebutan pertama untuk menghindari rangkaian pronomina yang rancu.
