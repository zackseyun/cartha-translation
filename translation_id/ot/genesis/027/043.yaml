  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י וְ/ק֧וּם בְּרַח לְ/ךָ֛ אֶל לָבָ֥ן אָחִ֖/י חָרָֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: id
  text: Sekarang[a], anakku, dengarkanlah perkataanku. Bangunlah, larilah kepada Laban, saudaraku, di Haran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan sekarang, anakku, dengarkanlah perkataanku. Bangunlah, larilah kepada Laban, saudaraku, ke Haran.”'
    reason: Alternatif ini menyatakan awalan penghubung וְ dan unsur arah pada חָרָנָה secara lebih eksplisit.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengantar perintah mendesak. Awalan וְ tidak harus diterjemahkan tersendiri dalam bahasa Indonesia; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בְנִי
  choice: anakku
  rationale: Sapaan langsung seorang ibu kepada Yakub; bentuk ini alami dan mempertahankan hubungan keluarga.
- source_word: שְׁמַע בְּקֹלִי
  choice: dengarkanlah perkataanku
  rationale: Secara harfiah berarti 'dengarkanlah suaraku' dan secara idiomatis menyiratkan kepatuhan. 'Perkataanku' mempertahankan unsur mendengar tanpa membuat implikasi 'taatilah' menjadi eksplisit.
- source_word: וְקוּם
  choice: Bangunlah
  rationale: Menerjemahkan imperatif קום secara alami dalam rangkaian instruksi mendesak.
- source_word: בְּרַח לְךָ
  choice: larilah
  rationale: ברח berarti melarikan diri atau lari untuk menghindari bahaya. Dativus לְךָ tidak perlu diungkapkan secara terpisah dalam bahasa Indonesia.
- source_word: אֶל לָבָן אָחִי
  choice: kepada Laban, saudaraku
  rationale: Mempertahankan tujuan personal dan hubungan aposisional dengan jelas dan alami.
- source_word: חָרָנָה
  choice: di Haran
  rationale: Akhiran arah pada nama tempat menunjukkan gerak menuju Haran. Karena arah sudah dinyatakan oleh 'larilah kepada Laban', 'di Haran' secara alami menjelaskan lokasi Laban.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Partikel -lah menandai perintah tanpa terdengar kasar; kalimat dipisahkan agar rangkaian perintah tetap jelas dan alami.
