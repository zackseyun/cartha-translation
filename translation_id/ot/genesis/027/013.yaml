base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: id
  text: Ibunya berkata kepadanya, “Biarlah kutukmu menimpa aku, anakku. Dengarkan saja perkataanku,[a] lalu pergilah dan ambillah kedua anak kambing itu untukku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengarkan suaraku,” sebuah ungkapan yang juga dapat berarti “taatilah aku.”
    reason: lexical_alternative
  - marker: b
    text: Objeknya tersirat dari ayat sebelumnya, yaitu kedua anak kambing itu.
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר לֹו אִמּוֹ
  choice: Ibunya berkata kepadanya
  rationale: Mencerminkan bentuk naratif biasa dari אמר, pronomina objek, dan istilah kekerabatan secara alami dalam bahasa Indonesia.
- source_word: עָלַי קִלְלָתְךָ
  choice: Biarlah kutuk yang seharusnya menimpamu itu menimpa aku
  rationale: Ungkapan eliptis Ibrani menyatakan bahwa sang ibu bersedia menanggung kutuk yang mungkin dijatuhkan kepada Yakub. Perumusan ini mempertahankan hubungan sufiks orang kedua sekaligus memperjelas arah pemindahan akibat kutuk dalam bahasa Indonesia.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan dengan sufiks orang pertama tunggal diterjemahkan secara langsung dan wajar.
- source_word: אַךְ
  choice: saja
  rationale: Partikel ini bersifat membatasi atau menekankan; dalam konteks perintah, 'saja' menghasilkan ungkapan Indonesia yang alami.
- source_word: שְׁמַע בְּקֹלִי
  choice: Dengarkan ... perkataanku
  rationale: Secara harfiah berarti 'dengarkan suaraku', tetapi merupakan idiom yang juga menyiratkan ketaatan. 'Dengarkan perkataanku' mempertahankan citra mendengar tanpa terdengar kaku.
- source_word: וְלֵךְ קַח לִי
  choice: lalu pergilah dan ambillah ... itu untukku
  rationale: Mempertahankan urutan dua imperatif. Objek yang tersirat dilengkapi dari ayat sebelumnya agar rujukannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat ucapan Ribka mengenai kutuk
  choice: Diterjemahkan sebagai kesediaan menanggung kutuk yang seharusnya menimpa Yakub
  alternative: Kutukmu ada padaku
  rationale: Bahasa sumber ringkas dan dapat dipahami sebagai pernyataan tanggung jawab atau kesediaan menanggung akibat. Terjemahan tidak menentukan apakah ucapan itu benar-benar memindahkan kutuk secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. 'Anakku' menjaga kehangatan sapaan, sedangkan pengulangan 'menimpa' memperjelas ungkapan Ibrani yang eliptis tanpa menambahkan kesimpulan teologis.
