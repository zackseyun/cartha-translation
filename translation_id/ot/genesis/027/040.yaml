base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: id
  text: Dengan pedangmu engkau akan hidup dan engkau akan melayani saudaramu. Namun, ketika engkau melepaskan diri[a], engkau akan mematahkan kuknya dari tengkukmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketika engkau menjadi gelisah.” Kata Ibrani תָּרִיד sulit dipastikan artinya. Konteks pematahan kuk mendukung arti “melepaskan diri”, tetapi arti seperti “menjadi gelisah” juga mungkin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: Dengan pedangmu engkau akan hidup
  rationale: Kata עַל bersama חֶרֶב menyatakan sarana atau cara hidup. Terjemahan ini mempertahankan gambaran konkret pedang tanpa mempersempit maknanya menjadi sekadar bertahan hidup.
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: dan engkau akan melayani saudaramu
  rationale: Kata עבד dalam bentuk Qal berarti melayani atau mengabdi. Pilihan ini mempertahankan pernyataan langsung tentang ketundukan tanpa menentukan bentuk politiknya secara berlebihan.
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: Namun, ketika
  rationale: Gabungan ini memperkenalkan keadaan pada masa mendatang sekaligus peralihan yang berlawanan dengan ketundukan sebelumnya.
- source_word: תָּרִיד
  choice: engkau melepaskan diri
  rationale: Bentuk dan arti kata ini sulit dipastikan. Dalam konteks tindakan menanggalkan kuk, 'melepaskan diri' menyampaikan perlawanan terhadap kekuasaan dengan wajar, sementara kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: וּפָרַקְתָּ עֻלּוֹ
  choice: engkau akan mematahkan kuknya
  rationale: Kata פרק menyatakan tindakan kuat untuk mematahkan atau menanggalkan, sedangkan עֹל secara konkret berarti kuk dan secara metaforis melambangkan penindasan atau ketundukan.
- source_word: מֵעַל צַוָּארֶךָ
  choice: dari tengkukmu
  rationale: Ungkapan ini mempertahankan gambaran fisik kuk yang berada di atas tengkuk. 'Tengkuk' lebih tepat bagi lokasi kuk daripada istilah umum 'leher'.
theological_decisions:
- issue: Hubungan Esau dengan Yakub pada masa mendatang
  choice: Menyatakan ketundukan kepada saudara yang kemudian diakhiri dengan pemberontakan atau pelepasan diri.
  alternative: Menafsirkannya sebagai perhambaan permanen atau sekadar sikap hormat dalam keluarga.
  rationale: Teks menyebut tindakan melayani saudara dan kemudian mematahkan kuknya. Terjemahan mempertahankan ketegangan antara ketundukan dan pembebasan tanpa memasukkan kesimpulan teologis atau sejarah Edom yang tidak dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai sesuai tuturan langsung seorang ayah kepada anaknya. Metafora pedang, kuk, dan tengkuk dipertahankan.
