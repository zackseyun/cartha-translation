  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶֽל יַעֲקֹ֔ב גְּשָׁ/ה נָּ֥א וַ/אֲמֻֽשְׁ/ךָ֖ בְּנִ֑/י הַֽ/אַתָּ֥ה זֶ֛ה בְּנִ֥/י עֵשָׂ֖ו אִם לֹֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: id
  text: Lalu Ishak berkata kepada Yakub, “Mendekatlah, supaya aku dapat merabamu, anakku, untuk mengetahui apakah engkau benar-benar anakku Esau atau bukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “lalu” menghasilkan alur bahasa Indonesia yang alami.
- source_word: גְּשָׁה נָּא
  choice: Mendekatlah
  rationale: Imperatif גְּשָׁה berarti mendekat, sedangkan נָא melunakkan permintaan. Dalam bahasa Indonesia, akhiran “-lah” menyampaikan permintaan yang halus dan wajar tanpa menambahkan kata yang terasa terlalu percakapan.
- source_word: וַאֲמֻשְׁךָ
  choice: supaya aku dapat merabamu
  rationale: Kata kerja מושׁ menunjuk pada tindakan meraba atau menyentuh untuk mengenali. “Merabamu” sesuai dengan konteks Ishak yang memeriksa identitas Yakub melalui sentuhan; “supaya” menyatakan fungsi tujuan dalam rangkaian ini.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan dengan akhiran orang pertama tunggal dipertahankan untuk menjaga nada relasional dalam adegan tersebut.
- source_word: הַאַתָּה זֶה בְּנִי עֵשָׂו אִם־לֹא
  choice: untuk mengetahui apakah engkau benar-benar anakku Esau atau bukan
  rationale: Susunan pertanyaan tidak langsung Ibrani dinyatakan secara alami dalam bahasa Indonesia. “Benar-benar” menyampaikan penekanan dan keraguan pemeriksaan, sedangkan “atau bukan” mempertahankan alternatif eksplisit אִם־לֹא.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata “engkau” dipakai karena cocok dengan sapaan keluarga dalam narasi Alkitab, sementara bentuk pronominal “-mu” menjaga kelancaran kalimat.
