  to: Kemudian Ribka berkata kepada Ishak, “Aku sudah muak dengan hidupku karena perempuan-perempuan Het.[a] Jika Yakub mengambil seorang istri dari antara perempuan-perempuan Het seperti perempuan-perempuan ini, dari antara perempuan-perempuan negeri ini, apa gunanya hidup bagiku?”
  rationale: Revisi memakai padanan Indonesia modern untuk perempuan dewasa dalam konteks pernikahan, memperjelas demonstratif tanpa menambahkan identitas baru, dan menerjemahkan idiom penutup sebagai keluhan retoris tentang kegunaan hidup. Nama serta pengulangan kelompok Het dan perempuan negeri dipertahankan.
