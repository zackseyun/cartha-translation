base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: id
  text: Kemudian Ribka berkata kepada Ishak, “Aku sudah muak dengan hidupku karena perempuan-perempuan Het.[a] Jika Yakub mengambil seorang istri dari antara perempuan-perempuan Het seperti perempuan-perempuan ini, dari antara perempuan-perempuan negeri ini, apa gunanya hidup bagiku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuan Het”; atau “perempuan Het.”
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani בְּנוֹת חֵת sambil mempertahankan padanan etnis yang alami dalam teks utama.
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: Aku telah muak dengan hidupku
  rationale: Ungkapan ini menyatakan kejenuhan dan kejijikan yang mendalam terhadap hidup akibat keadaan yang dihadapi. 'Muak dengan hidupku' alami dalam bahasa Indonesia dan mempertahankan daya emosionalnya.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam konteks ini preposisi tersebut menyatakan sebab, bukan lokasi.
- source_word: בְּנוֹת חֵת
  choice: anak-anak perempuan Het
  rationale: Terjemahan harfiah mempertahankan nama Het dan cara Ibrani menggambarkan kelompok etnis melalui garis keturunan; padanan etnis yang lebih langsung diberikan dalam catatan kaki.
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: Jika Yakub mengambil istri
  rationale: Konstruksi Ibrani merupakan ungkapan biasa untuk menikah; bentuk ini tetap jelas dalam bahasa Indonesia sekaligus dekat dengan susunan sumber.
- source_word: כָּאֵלֶּה
  choice: seperti mereka ini
  rationale: Kata penunjuk tersebut mengacu pada perempuan sejenis dengan mereka yang telah dibicarakan, kemungkinan istri-istri Esau.
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: dari antara anak-anak perempuan negeri ini
  rationale: Mempertahankan kesejajaran dengan 'anak-anak perempuan Het' serta memperjelas bahwa yang dimaksud ialah perempuan dari penduduk setempat.
- source_word: לָמָּה לִּי חַיִּים
  choice: apa artinya hidup bagiku?
  rationale: Ungkapan retoris ini mempertanyakan nilai hidup dalam keadaan tersebut. Terjemahan ini alami tanpa memperluasnya secara tegas menjadi 'mengapa aku harus hidup?'.
theological_decisions:
- issue: Sebutan etnis חֵת
  choice: Mempertahankan 'anak-anak perempuan Het' dalam teks utama
  alternative: perempuan Het; perempuan Heti
  rationale: Pilihan ini menjaga nama dan bingkai kekerabatan dalam bahasa Ibrani, sedangkan catatan kaki memberi padanan etnis yang lebih langsung tanpa memasukkan penafsiran denominasi.
- issue: Daya retoris לָמָּה לִּי חַיִּים
  choice: apa artinya hidup bagiku?
  alternative: apa gunanya hidup bagiku?; untuk apa aku hidup?
  rationale: Pilihan utama mempertahankan bentuk pertanyaan yang relatif terbuka dan tidak menambahkan kata 'guna' secara eksplisit, sambil tetap menyampaikan keputusasaan Ribka.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Muak' mempertahankan intensitas emosi verba Ibrani; pengulangan 'anak-anak perempuan' sengaja dipertahankan untuk mencerminkan kesejajaran sumber.
