base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: id
  text: Maka Yakub mendekati Ishak, ayahnya, lalu Ishak merabanya dan berkata, “Suara itu suara Yakub, tetapi tangan itu tangan Esau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekati
  rationale: Bentuk qal נגשׁ menyatakan gerak mendekat; “mendekati” alami dalam narasi Indonesia dan mempertahankan arah tindakan kepada Ishak.
- source_word: וַיְמֻשֵּׁהוּ
  choice: Ishak merabanya
  rationale: מושׁ di sini menunjuk pada pemeriksaan dengan sentuhan untuk mengenali identitas. Subjek “Ishak” dinyatakan kembali agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: הַקֹּל
  choice: Suaranya
  rationale: קוֹל dalam konteks ini adalah suara orang yang berbicara, bukan sekadar bunyi.
- source_word: קוֹל יַעֲקֹב
  choice: suara Yakub
  rationale: Konstruksi posesif Ibrani diterjemahkan secara alami dan tetap mempertahankan pengulangan kata “suara”.
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: tetapi tangannya tangan Esau
  rationale: “Tetapi” mengungkapkan kontras yang tersirat dalam waw, sedangkan pengulangan “tangan” mempertahankan kesejajaran dan tekanan retoris teks Ibrani. Bentuk tunggal kolektif “tangannya” lazim dalam bahasa Indonesia untuk sepasang tangan.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Sebutan hubungan keluarga diterjemahkan secara langsung dan dipertahankan karena dinyatakan eksplisit dalam bahasa Ibrani.
