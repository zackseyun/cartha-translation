  yaml_path: translation/ot/genesis/027/026.yaml
  text: Then his father Isaac said to him[a], “Come near, please, and kiss me, my son.”
translation:
  language: id
  text: Kemudian Ishak, ayahnya, berkata kepadanya, “Tolong mendekat dan cium aku, anakku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Kemudian” menyampaikan perkembangan naratif secara alami dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi dengan sufiks pronominal ini menandai orang yang menjadi tujuan perkataan.
- source_word: יִצְחָק אָבִיו
  choice: Ishak, ayahnya
  rationale: Mempertahankan nama diri dan hubungan kekeluargaan dalam aposisi yang wajar dalam bahasa Indonesia.
- source_word: גְּשָׁה נָּא
  choice: Mendekatlah
  rationale: Imperatif ini meminta lawan bicara mendekat secara fisik. Partikel נָא melembutkan permintaan; nuansa tersebut secara alami terwakili oleh bentuk imperatif dengan -lah, tanpa harus menambahkan “tolong”.
- source_word: וּשְׁקָה לִּי
  choice: dan ciumlah aku
  rationale: Ungkapan Ibrani ini secara idiomatis meminta tindakan mencium terhadap si pembicara; bahasa Indonesia alami memakai objek langsung “aku”.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan vokatif ini mempertahankan hubungan keluarga dan nada pribadi Ishak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk “-lah” mempertahankan nada permintaan yang lembut, sedangkan “aku” sesuai dengan sapaan keluarga yang akrab dalam konteks ini.
