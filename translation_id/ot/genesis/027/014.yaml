lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Maka pergilah ia
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi; “maka” menyatakan kelanjutan sekaligus tanggapan terhadap perintah pada ayat sebelumnya secara alami.
- source_word: וַיִּקַּח
  choice: mengambil kedua anak kambing itu
  rationale: Objek tidak dinyatakan ulang dalam bahasa Ibrani, tetapi jelas merujuk pada kedua anak kambing dalam ayat sebelumnya. Penyebutan eksplisit menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: lalu membawanya kepada ibunya
  rationale: Objek “-nya” dipulihkan dari konteks, sedangkan לְ menyatakan tujuan, yaitu kepada ibunya.
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: Ibunya mengolahnya menjadi
  rationale: עָשָׂה berarti “membuat” atau “melakukan”; dalam konteks bahan makanan yang dijadikan hidangan, “mengolahnya menjadi” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: מַטְעַמִּים
  choice: hidangan lezat
  rationale: Nomina ini menunjuk pada makanan yang diolah agar bercita rasa dan istimewa. “Hidangan lezat” alami dalam bahasa Indonesia modern serta mempertahankan nuansa makanan yang disiapkan secara khusus.
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: seperti yang disukai ayahnya
  rationale: כַּאֲשֶׁר menyatakan kesesuaian, sedangkan אָהֵב di sini menggambarkan kegemaran Ishak terhadap hidangan tersebut. “Disukai” menyampaikan maksud idiomatis tanpa memberi kesan kasih personal kepada benda.
