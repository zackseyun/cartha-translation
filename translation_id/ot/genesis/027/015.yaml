revisions:
- from: Lalu Ribka mengambil pakaian indah milik Esau, anaknya yang lebih tua,[a] yang ada padanya di rumah,[b] lalu mengenakannya kepada Yakub, anaknya yang lebih muda.
  to: Lalu Ribka mengambil pakaian pilihan Esau, anaknya yang lebih tua,[a] yang ada bersamanya di rumah,[b] lalu memakaikannya pada Yakub, anaknya yang lebih muda.
  rationale: Revisi mengganti “indah” dengan “pilihan” untuk mencerminkan nilai atau keistimewaan pakaian dalam teks Ibrani, memperlancar klausa relatif, dan menggunakan verba transitif yang idiomatis untuk tindakan Ribka memakaikan pakaian Esau kepada Yakub. Catatan b menghindari alternatif “disimpannya,” karena tindakan menyimpan tidak dinyatakan secara eksplisit dalam sumber.
