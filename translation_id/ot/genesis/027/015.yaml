base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: id
  text: Lalu Ribka mengambil pakaian pilihan Esau, anaknya yang lebih tua,[a] yang ada bersamanya di rumah,[b] lalu memakaikannya pada Yakub, anaknya yang lebih muda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian terbaik Esau.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang ia miliki di rumah”; secara lebih harfiah, bahasa Ibrani berbunyi “yang ada bersamanya di rumah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Lalu ... mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: בִּגְדֵי עֵשָׂו
  choice: pakaian ... milik Esau
  rationale: בִּגְדֵי adalah bentuk jamak konstruktus yang menunjuk pada pakaian Esau. “Pakaian milik Esau” jelas dan wajar dalam bahasa Indonesia.
- source_word: הַחֲמֻדֹת
  choice: indah
  rationale: Kata ini menyatakan bahwa pakaian tersebut bernilai, menarik, atau istimewa. “Indah” mempertahankan gagasan sesuatu yang diinginkan tanpa memastikan bahwa pakaian itu secara mutlak merupakan yang terbaik.
- source_word: בְּנָהּ הַגָּדֹל
  choice: anaknya yang lebih tua
  rationale: Dalam pertentangan keluarga dengan הַקָּטָן, גָּדֹל menunjuk pada usia atau urutan kelahiran, bukan ukuran tubuh.
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: yang ada padanya di rumah
  rationale: Terjemahan ini mengikuti ungkapan Ibrani secara dekat dan membiarkan nuansa lokasi serta kepemilikan tetap terbuka.
- source_word: וַתַּלְבֵּשׁ
  choice: mengenakannya kepada
  rationale: Verba ini berarti memakaikan pakaian kepada seseorang. Akhiran “-nya” merujuk kembali pada pakaian yang baru disebut.
- source_word: בְּנָהּ הַקָּטָן
  choice: anaknya yang lebih muda
  rationale: קָטָן berlawanan dengan גָּדֹל dan di sini menunjukkan Yakub sebagai saudara yang lebih muda, bukan bertubuh lebih kecil.
