  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: id
  text: Namun, Yakub berkata kepada Ribka, ibunya, “Lihat, Esau, saudaraku, berbulu, sedangkan aku berkulit licin.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “aku seorang yang halus/licin.” Dalam kontras dengan Esau yang berbulu, ungkapan ini menunjuk pada kulit yang tidak berbulu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, Yakub berkata
  rationale: Waw-konsekutif melanjutkan narasi, tetapi dalam konteks ini ucapan Yakub merupakan keberatan terhadap rencana Ribka; “Namun” menyampaikan hubungan pertentangan itu secara alami.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Mempertahankan keterangan hubungan Ribka dengan Yakub yang terdapat dalam teks Ibrani.
- source_word: הֵן
  choice: Lihat
  rationale: Partikel ini menarik perhatian dan mengawali keberatan Yakub; “Lihat” alami dalam bahasa Indonesia modern.
- source_word: אָחִי
  choice: kakakku
  rationale: Secara leksikal berarti “saudaraku,” tetapi konteks narasi menyatakan Esau adalah saudara kembar yang lahir lebih dahulu; “kakakku” merupakan padanan relasional yang alami dalam bahasa Indonesia.
- source_word: אִישׁ שָׂעִר
  choice: orang yang berbulu
  rationale: Menyampaikan bahwa tubuh Esau berbulu lebat tanpa ungkapan Indonesia yang janggal seperti “orang berbulu.”
- source_word: וְאָנֹכִי
  choice: sedangkan aku
  rationale: Pronomina mandiri menegaskan Yakub dan konjungsi membentuk kontras langsung dengan Esau; “sedangkan” mengungkapkan kontras itu secara wajar.
- source_word: אִישׁ חָלָק
  choice: tidak berbulu
  rationale: Secara harfiah berarti “orang yang licin/halus,” tetapi dalam antitesis dengan שָׂעִר ungkapan ini merujuk pada kulit tubuh yang tidak berbulu; pilihan ini menghindari salah pengertian tentang sifat atau watak Yakub.
