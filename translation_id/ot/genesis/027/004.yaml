base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: id
  text: Buatkan aku hidangan lezat[a], seperti yang kusukai, lalu bawalah kepadaku agar aku dapat makan, supaya jiwaku memberkatimu[b] sebelum aku mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “makanan lezat” atau “makanan sedap.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jiwaku memberkatimu”; ungkapan ini merujuk kepada Ishak sendiri dalam keseluruhan pribadinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Buatlah
  rationale: Kata kerja עשה berarti luas, ‘membuat/mengerjakan’. Dalam konteks memasak, ‘buatlah’ alami dan tetap dekat dengan bentuk perintah Ibrani.
- source_word: מַטְעַמִּים
  choice: makanan yang lezat
  rationale: Kata benda ini menunjuk pada makanan bercita rasa yang disiapkan secara khusus. ‘Makanan yang lezat’ jelas dalam bahasa Indonesia modern tanpa mempersempitnya pada jenis hidangan tertentu.
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: seperti yang kusukai
  rationale: Ungkapan ini menyampaikan selera pribadi Ishak secara alami; bentuk lampau Ibrani secara idiomatis menyatakan makanan yang selama ini ia sukai.
- source_word: וְהָבִיאָה לִּי
  choice: lalu bawalah kepadaku
  rationale: ‘Bawalah kepadaku’ menyatakan gerak menuju penutur, sedangkan ‘lalu’ membuat urutan perintah wajar dalam bahasa Indonesia.
- source_word: וְאֹכֵלָה
  choice: supaya aku memakannya
  rationale: Bentuk kohortatif menyatakan tindakan yang dimaksudkan Ishak setelah makanan dibawa. ‘Supaya aku memakannya’ mempertahankan hubungan maksud tanpa mengubahnya menjadi kepastian masa depan.
- source_word: בַּעֲבוּר
  choice: agar
  rationale: Dalam konteks ini בַּעֲבוּר memperkenalkan tujuan akhir, yaitu pemberian berkat.
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: jiwaku memberkatimu
  rationale: Terjemahan ini mempertahankan נַפְשִׁי sebagai subjek eksplisit dan menjaga tekanan pada diri Ishak seutuhnya, alih-alih meratakannya menjadi sekadar ‘aku’.
- source_word: בְּטֶרֶם אָמוּת
  choice: sebelum aku mati
  rationale: Klausa waktu dengan verba finit ini langsung, alami, dan setia pada Ibrani.
theological_decisions:
- issue: Arti ‘jiwaku’ dalam tindakan memberkati
  choice: Mempertahankan ungkapan ‘jiwaku memberkatimu’ dalam teks utama
  alternative: ‘aku memberkatimu’
  rationale: Bahasa Ibrani secara eksplisit memakai נֶפֶשׁ (‘jiwa/diri’) sebagai subjek. Mempertahankannya menjaga bobot personal dan keseluruhan diri Ishak tanpa memaksakan pemisahan antropologis antara jiwa dan tubuh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk enklitik ‘-ku’ dan ‘-mu’ dipakai secara wajar. Susunan dua klausa tujuan dipertahankan karena mencerminkan alur Ibrani, tetapi dibedakan dengan ‘supaya’ dan ‘agar’ agar tetap lancar.
