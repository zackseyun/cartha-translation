  text: Then she put the tasty food and the bread that she had made into the hand of Jacob her son[a].
translation:
  language: id
  text: Kemudian ia menyerahkan makanan lezat dan roti yang telah dibuatnya ke tangan Yakub, anaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke tangan Yakub, anaknya”; ungkapan Ibrani ini berarti bahwa ia menyerahkannya langsung kepada Yakub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Kemudian Ribka menyerahkan
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Ribka dipakai untuk menggantikan pronomina feminin agar pelakunya jelas dan alami dalam bahasa Indonesia; נתן dengan בְּיַד menyatakan tindakan memberikan atau menyerahkan.
- source_word: הַמַּטְעַמִּים
  choice: makanan lezat
  rationale: Kata ini menunjuk pada hidangan bercita rasa lezat yang khusus disiapkan dalam konteks ini, tanpa mempersempitnya menjadi jenis makanan tertentu.
- source_word: הַלֶּחֶם
  choice: roti
  rationale: Padanan langsung dan lazim untuk לֶחֶם dalam konteks ini.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: yang telah dibuatnya itu
  rationale: 'Bentuk lampau tersirat oleh urutan peristiwa: makanan dan roti telah dibuat sebelum diserahkan. Kata ''itu'' menutup frasa pewatas secara alami dalam bahasa Indonesia.'
- source_word: בְּיַד
  choice: langsung ke tangan
  rationale: Mempertahankan gambaran konkret idiom Ibrani 'ke dalam/di tangan' sekaligus menyampaikan maksud bahwa barang-barang itu diberikan langsung kepada Yakub.
- source_word: יַעֲקֹב בְּנָהּ
  choice: Yakub, anaknya
  rationale: Mengikuti urutan Ibrani—nama lalu hubungan keluarga—dengan tanda koma yang wajar dalam bahasa Indonesia.
