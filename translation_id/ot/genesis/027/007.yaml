base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: id
  text: “Bawakanlah kepadaku hasil buruan dan buatkanlah bagiku masakan lezat[a], supaya aku makan dan memberkatimu di hadapan Yahweh sebelum aku mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hidangan yang lezat.” Kata Ibrani ini menunjuk pada makanan yang enak atau disiapkan secara khusus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבִיאָה לִי
  choice: Bawakanlah kepadaku
  rationale: Bentuk imperatif kausatif meminta lawan bicara membawa sesuatu kepada si pembicara. Bentuk berakhiran -kan dengan partikel -lah alami dan tepat dalam bahasa Indonesia.
- source_word: צַיִד
  choice: hasil buruan
  rationale: Kata ini menunjuk pada hewan atau daging yang diperoleh melalui perburuan. “Hasil buruan” sesuai dengan konteks dan tidak membatasinya pada jenis hewan tertentu.
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: dan buatkanlah bagiku masakan lezat
  rationale: Dalam konteks makanan, עשה berarti membuat atau menyiapkan, sedangkan מַטְעַמִּים menunjuk pada hidangan yang lezat atau disiapkan secara khusus. “Masakan lezat” jelas dan wajar bagi pembaca modern.
- source_word: וְאֹכֵלָה
  choice: supaya aku makan
  rationale: Bentuk kohortatif sesudah perintah menyatakan tujuan atau hasil yang dikehendaki; “supaya” menyampaikan hubungan itu secara alami.
- source_word: וַאֲבָרֶכְכָה
  choice: dan memberkatimu
  rationale: Bentuk kohortatif dengan akhiran orang kedua tunggal menyatakan tindakan yang hendak dilakukan Ishak setelah makan. Koordinasi dengan “dan” mempertahankan alur kalimat Ibrani.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan” atau “dalam kehadiran,” dan nama ilahi יְהוָה dipertahankan sebagai nama diri “Yahweh.”
- source_word: לִפְנֵי מוֹתִי
  choice: sebelum aku mati
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia daripada bentuk nominal “sebelum kematianku.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama diri, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar.
- issue: Makna לִפְנֵי יְהוָה dalam tindakan memberkati
  choice: di hadapan Yahweh
  alternative: dalam kehadiran Yahweh
  rationale: Terjemahan harfiah yang alami ini mempertahankan klaim bahwa berkat tersebut diucapkan di hadapan Allah, tanpa menjelaskan lebih jauh apakah frasa itu terutama menekankan kesaksian, pengesahan, atau kekhidmatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “-lah” mempertahankan nuansa perintah dengan wajar, sedangkan struktur tujuan memakai “supaya” agar hubungan antarklausa jelas tanpa menghilangkan nuansa kohortatif teks Ibrani.
