id: GEN.6.4
reference: Genesis 6:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: id
  text: Pada zaman itu Nefilim ada di bumi—dan juga sesudah itu—ketika anak-anak Allah[b] menghampiri anak-anak perempuan manusia dan anak-anak perempuan itu melahirkan anak-anak bagi mereka. Mereka itulah orang-orang perkasa pada zaman dahulu, orang-orang ternama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “Anak-anak Allah” juga dapat dipahami sebagai “makhluk-makhluk ilahi”; sebagian penafsiran memahaminya sebagai para penguasa manusia atau keturunan Set yang saleh.
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: orang-orang Nefilim
  rationale: Istilah Ibrani ini langka dan makna tepatnya tidak pasti. Transliterasi mempertahankan ketidakjelasan asli tanpa menetapkannya sebagai 'raksasa' atau 'orang-orang yang jatuh'.
- source_word: בָאָרֶץ
  choice: di bumi
  rationale: Dalam konteks sejarah purba, 'bumi' merupakan pengertian yang lebih luas dan paling wajar, meskipun 'negeri' secara leksikal mungkin.
- source_word: וְגַם אַחֲרֵי כֵן
  choice: dan juga sesudahnya
  rationale: Mempertahankan daya aditif וְגַם dan arti temporal אַחֲרֵי כֵן secara alami.
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: ketika ... menghampiri
  rationale: '''Ketika'' menyatakan keadaan temporal, sedangkan ''menghampiri'' menyampaikan idiom hubungan seksual secara santun tanpa uraian berlebihan.'
- source_word: בְּנֵי הָאֱלֹהִים
  choice: anak-anak Allah
  rationale: Terjemahan formal yang mempertahankan ungkapan Ibrani serta keterbukaan mengenai apakah yang dimaksud ialah makhluk ilahi, penguasa manusia, atau kelompok manusia saleh.
- source_word: בְּנוֹת הָאָדָם
  choice: anak-anak perempuan manusia
  rationale: אָדָם bersifat kolektif di sini; 'manusia' menyatakan seluruh umat manusia dengan jelas dan alami dalam bahasa Indonesia.
- source_word: וְיָלְדוּ לָהֶם
  choice: perempuan-perempuan itu melahirkan anak-anak bagi mereka
  rationale: Subjek diulangi agar rujukannya jelas dalam bahasa Indonesia, dan objek tersirat 'anak-anak' dibuat eksplisit.
- source_word: הַגִּבֹּרִים
  choice: orang-orang perkasa
  rationale: Mempertahankan cakupan luas גִּבּוֹר tanpa mempersempitnya menjadi 'prajurit' atau memberi penilaian positif melalui 'pahlawan'.
- source_word: מֵעוֹלָם
  choice: pada zaman dahulu
  rationale: Ungkapan Indonesia yang alami untuk masa lampau yang jauh dalam konteks ini.
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: orang-orang ternama
  rationale: Menyampaikan idiom Ibrani mengenai nama baik, kemasyhuran, atau reputasi dengan bahasa Indonesia yang wajar dan bermartabat.
theological_decisions:
- issue: Identitas 'anak-anak Allah'
  choice: Mempertahankan ungkapan 'anak-anak Allah' tanpa penjelasan interpretatif dalam teks utama.
  alternative: Makhluk-makhluk ilahi; para penguasa; keturunan Set yang saleh.
  rationale: Frasa Ibrani ini ambigu dalam konteks tersebut. Terjemahan tidak sepatutnya menyelesaikan perdebatan teologis yang tidak diputuskan secara tegas oleh teks.
- issue: Makna הַנְּפִלִים
  choice: Mentransliterasikannya sebagai 'Nefilim'.
  alternative: Raksasa; orang-orang yang jatuh.
  rationale: Makna istilah yang langka ini tidak pasti dan diperdebatkan; transliterasi mempertahankan ambiguitas asli.
- issue: Hubungan antara Nefilim dan orang-orang perkasa
  choice: Memakai 'Mereka itulah' sesuai kata ganti penunjuk-resumtif הֵמָּה tanpa memperjelas anteseden lebih jauh.
  alternative: Menegaskan bahwa anak-anak yang dilahirkan adalah orang-orang perkasa, atau bahwa Nefilim sendiri adalah orang-orang perkasa.
  rationale: Susunan Ibrani memungkinkan perdebatan tentang rujukan tepat kata ganti tersebut; terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Menghampiri' dipakai sebagai ungkapan santun bagi relasi seksual. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan; [a] menerangkan Nefilim dan [b] menerangkan dua ungkapan yang berdekatan mengenai anak-anak Allah dan anak-anak perempuan manusia.
