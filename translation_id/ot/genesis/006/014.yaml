base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: id
  text: Buatlah bagimu sebuah bahtera dari kayu gofer[a]. Buatlah ruang-ruang di dalam bahtera itu[b], lalu lapisi bagian dalam dan luarnya dengan ter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kayu sipres”; istilah Ibrani gofer hanya muncul di sini, sehingga jenis kayunya tidak diketahui dengan pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “petak-petak”; secara harfiah, “sarang-sarang.”
    reason: lexical_alternative
  - marker: c
    text: Atau “aspal” atau “bahan pelapis.” Dalam bahasa Ibrani, kata untuk tindakan melapisi dan kata untuk bahan pelapis ini berasal dari akar kata yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: Buatlah bagimu
  rationale: Mempertahankan verba umum עשה dan nuansa לְךָ, ‘bagi dirimu,’ secara ringkas dan wajar.
- source_word: תֵּבַת
  choice: bahtera
  rationale: Dalam konteks Kejadian 6–9, ‘bahtera’ adalah sebutan Indonesia yang mapan bagi wadah besar yang dibangun Nuh dan membedakannya dari kapal biasa.
- source_word: עֲצֵי גֹפֶר
  choice: kayu gofer
  rationale: Jenis kayu yang dimaksud oleh גֹפֶר tidak diketahui dengan pasti; transliterasi menghindari kepastian semu.
- source_word: קִנִּים
  choice: ruang-ruang
  rationale: Secara harfiah kata ini berarti ‘sarang-sarang,’ tetapi di sini menunjuk pada ruang atau petak yang dibuat di dalam bahtera.
- source_word: וְכָפַרְתָּ
  choice: lapisi
  rationale: Dalam konteks nonkultis ini, כפר berarti melapisi atau menutupi permukaan; ‘lapisi’ alami bersama penyebutan bahan pelapis.
- source_word: מִבַּיִת וּמִחוּץ
  choice: bagian dalam dan luarnya
  rationale: Ungkapan ini menyatakan bahwa kedua sisi permukaan bahtera harus dilapisi.
- source_word: בַּכֹּפֶר
  choice: dengan ter
  rationale: כֹּפֶר di sini adalah bahan pelapis kedap air; ‘ter’ merupakan padanan Indonesia yang ringkas, sementara identifikasi yang lebih khusus tetap tidak dipaksakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang lugas dan bermartabat. Istilah tradisional ‘bahtera’ dipertahankan, sedangkan unsur-unsur yang tidak pasti dijelaskan melalui catatan kaki.
