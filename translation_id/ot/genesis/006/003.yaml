- from: Lalu Yahweh berfirman, “Roh-Ku tidak akan terus berbantah dengan manusia untuk selama-lamanya[a], karena ia pun daging[b]. Hari-harinya akan berjumlah seratus dua puluh tahun[c].”
  to: Lalu Yahweh berfirman, “Roh-Ku tidak akan selama-lamanya bergumul dengan manusia[a], sebab ia adalah daging[b]. Hari-harinya akan berjumlah seratus dua puluh tahun[c].”
  rationale: Revisi mengganti istilah yang terlalu mengarah pada pertengkaran lisan dengan “bergumul,” yang lebih sesuai dengan kemungkinan pembacaan ‘contend’ dan tetap terbuka terhadap ambiguitas verba Ibrani. Klausa kausal dihaluskan menjadi “sebab ia adalah daging”; kemungkinan unsur “juga” tidak dihapus sebagai data tekstual, melainkan dipindahkan ke catatan kaki. Semua jangkar catatan kaki tetap ditempatkan pada unsur yang dijelaskannya.
