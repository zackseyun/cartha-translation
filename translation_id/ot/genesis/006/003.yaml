  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Roh-Ku tidak akan selama-lamanya bergumul dengan manusia[a], sebab ia adalah daging[b]. Hari-harinya akan berjumlah seratus dua puluh tahun[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Roh-Ku tidak akan tinggal di dalam manusia untuk selama-lamanya.” Kata kerja Ibraninya sulit dan dapat dipahami sebagai “bergumul/berjuang” atau “tinggal/menetap.”
    reason: alternative_reading
  - marker: b
    text: Atau “sebab ia juga daging.” “Ia” menerjemahkan bentuk tunggal generik yang menunjuk kepada umat manusia.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini dapat dipahami sebagai batas umur manusia atau sebagai sisa waktu seratus dua puluh tahun sebelum penghukuman datang.
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יָדוֹן
  choice: terus berbantah dengan
  rationale: Kata kerja ini sulit dan diperdebatkan. “Berbantah dengan” mempertahankan kemungkinan makna pertentangan atau pergumulan ilahi dengan manusia, sedangkan kemungkinan “tinggal di dalam” dicatat dalam catatan kaki.
- source_word: רוּחִי
  choice: Roh-Ku
  rationale: Bentuk dengan akhiran orang pertama merujuk secara alami kepada Roh milik Allah. Huruf kapital menandai rujukan ilahi tanpa memasukkan perumusan teologis yang lebih kemudian.
- source_word: בָאָדָם
  choice: dengan manusia
  rationale: אָדָם adalah bentuk tunggal yang dipakai secara generik bagi umat manusia. Preposisi diterjemahkan “dengan” sesuai pilihan makna יָדוֹן sebagai “berbantah”; jika kata kerja dipahami sebagai “tinggal”, preposisinya dapat diterjemahkan “di dalam”.
- source_word: לְעֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan Indonesia yang wajar untuk durasi tanpa batas dalam konteks ini.
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: karena ia pun daging
  rationale: “Karena” menyampaikan fungsi kausal bentuk langka בְּשַׁגַּם, “pun” mempertahankan unsur גַּם, dan “daging” dipertahankan agar tekstur antropologis serta teologis bahasa Ibrani tidak dipersempit menjadi sekadar “fana”.
- source_word: וְהָיוּ יָמָיו
  choice: Hari-harinya akan berjumlah
  rationale: Terjemahan ini mempertahankan ungkapan konkret “hari-harinya” dan tidak menambahkan hubungan kesimpulan seperti “oleh karena itu”, yang tidak dinyatakan secara eksplisit.
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: seratus dua puluh tahun
  rationale: Bilangan ditulis dengan kata-kata demi gaya sastra Alkitab yang alami.
theological_decisions:
- issue: Makna Roh Allah dalam hubungannya dengan manusia
  choice: Roh-Ku
  alternative: napas-Ku atau daya hidup dari-Ku
  rationale: רוּחַ dapat berarti roh, angin, atau napas. Karena Allah sendiri berbicara dan memakai bentuk posesif, “Roh-Ku” paling kuat dalam konteks ini, tetapi terjemahan ini tidak menetapkan rincian doktrin Trinitas yang tidak dinyatakan ayat tersebut.
- issue: Cakupan אָדָם
  choice: manusia sebagai sebutan tunggal generik
  alternative: umat manusia
  rationale: Bentuk Ibrani tunggal merujuk secara representatif kepada manusia secara umum. Bahasa Indonesia “manusia” dapat mempertahankan cakupan generik tanpa mengubahnya menjadi bentuk jamak.
- issue: Arti seratus dua puluh tahun
  choice: mempertahankan ungkapan “hari-harinya” tanpa menjelaskan acuannya dalam teks utama
  alternative: batas umur manusia atau sisa waktu sebelum penghukuman
  rationale: Ayat ini sendiri tidak secara tegas menentukan apakah seratus dua puluh tahun menunjuk pada batas umur manusia atau tenggang waktu menuju air bah; catatan kaki mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Susunan kalimat dibuat mudah dipahami, tetapi ungkapan penting seperti “Roh-Ku”, “daging”, dan “hari-harinya” dipertahankan untuk menjaga warna serta ambiguitas teks Ibrani.
