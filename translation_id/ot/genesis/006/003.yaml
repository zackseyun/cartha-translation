    rationale: Partikel “pun” mengisyaratkan pembanding yang tidak dinyatakan jelas dalam konteks bahasa Indonesia. Karena fungsi גַּם dalam bentuk langka בְּשַׁגַּם diperdebatkan, teks utama dapat memakai kausal sederhana, dengan kemungkinan “juga” dipertahankan dalam catatan kaki.
