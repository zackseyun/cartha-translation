base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: id
  text: Yahweh melihat bahwa kejahatan manusia[a] sangat besar di bumi dan bahwa setiap kecenderungan pikiran hatinya semata-mata jahat sepanjang hari.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “manusia” di sini dipakai secara kolektif dan dapat diterjemahkan “umat manusia.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “terus-menerus jahat.” Secara harfiah, bahasa Ibraninya berbunyi “semata-mata jahat sepanjang hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, urutan klausa sudah cukup menyampaikan kesinambungan tanpa harus menambahkan kata penghubung yang tidak diperlukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar, sehingga bentuk khusus dalam teks Ibrani tetap terlihat.
- source_word: רַבָּה רָעַת הָאָדָם
  choice: kejahatan manusia sangat besar
  rationale: רָעָה dalam konteks ini menunjuk pada kejahatan moral, sedangkan רַבָּה menyatakan besarnya atau luasnya kejahatan itu. Susunan ini alami dan kuat dalam bahasa Indonesia.
- source_word: הָאָדָם
  choice: manusia
  rationale: Di sini אָדָם dipakai secara kolektif untuk umat manusia, bukan hanya seorang laki-laki tertentu.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: Dalam konteks kisah purba, אֶרֶץ menunjuk secara luas pada bumi, bukan pada suatu wilayah tertentu.
- source_word: יֵצֶר
  choice: kecenderungan
  rationale: Kata ini menunjuk pada bentukan, dorongan, atau kecenderungan batin. 'Kecenderungan' mempertahankan cakupan maknanya tanpa membatasinya hanya pada niat sadar.
- source_word: מַחְשְׁבֹת לִבּוֹ
  choice: pikiran hatinya
  rationale: Ungkapan ini mempertahankan gambaran antropologis Ibrani bahwa hati mencakup pikiran, kehendak, dan keinginan, tanpa mereduksinya menjadi akal semata.
- source_word: רַק רַע
  choice: semata-mata jahat
  rationale: רַק memberi pembatasan yang tegas, dan 'semata-mata' menyampaikan penekanan bahwa yang digambarkan hanyalah kejahatan.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Terjemahan ini dekat dengan bentuk harfiah Ibrani dan tetap alami; dalam konteksnya ungkapan itu menyatakan keadaan yang terus berlangsung.
theological_decisions:
- issue: Penyebutan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. 'Yahweh' mempertahankan pembedaan antara nama tersebut dan gelar אֲדֹנָי, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Cakupan kolektif אָדָם
  choice: manusia
  alternative: umat manusia
  rationale: Konteks menyangkut seluruh manusia secara kolektif. 'Manusia' ringkas dan alami, sedangkan catatan kaki menjelaskan cakupan kolektifnya.
- issue: Kekuatan pernyataan רַק רַע כָּל הַיּוֹם
  choice: semata-mata jahat sepanjang hari
  alternative: terus-menerus jahat
  rationale: Terjemahan utama mempertahankan dua unsur teks, yaitu pembatasan mutlak רַק dan ungkapan temporal כָּל הַיּוֹם. Alternatif idiomatis dicatat tanpa menghapus ketegangan dan kekuatan bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur paralel kedua objek dari verba 'melihat' dipertahankan dengan pengulangan 'bahwa'. Istilah 'hati' dipertahankan untuk menjaga antropologi Ibrani, sementara catatan kaki dipakai hanya untuk menjelaskan cakupan kolektif dan alternatif idiomatis.
