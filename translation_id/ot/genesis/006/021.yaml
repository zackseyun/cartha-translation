  text: וְ/אַתָּ֣ה קַח לְ/ךָ֗ מִ/כָּל מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְ/אָסַפְתָּ֖ אֵלֶ֑י/ךָ וְ/הָיָ֥ה לְ/ךָ֛ וְ/לָ/הֶ֖ם לְ/אָכְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: id
  text: Ambillah untuk dirimu sebagian dari setiap jenis makanan yang dapat dimakan, dan kumpulkanlah itu untuk dirimu. Itu akan menjadi makanan bagimu dan bagi mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לְךָ
  choice: mengambil bagi dirimu
  rationale: Imperatif Qal קַח menyampaikan perintah langsung, sedangkan לְךָ bernuansa benefaktif/refleksif. Ungkapan ini mempertahankan keduanya tanpa memberi kesan bahwa Nuh harus mengambil seluruh persediaan yang ada.
- source_word: מִכָּל מַאֲכָל
  choice: sebagian dari setiap jenis makanan
  rationale: Gabungan מִן dengan כָּל menunjukkan pengambilan dari keseluruhan ragam makanan. Terjemahan ini menyatakan cakupan setiap jenis tanpa menyiratkan bahwa seluruh makanan harus diambil.
- source_word: אֲשֶׁר יֵאָכֵל
  choice: yang dapat dimakan
  rationale: Nifal imperfek יֵאָכֵל dalam klausa relatif secara harfiah dapat berarti 'yang dimakan', tetapi dalam konteks ini secara alami menunjuk pada makanan yang layak atau dapat dikonsumsi.
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: dan mengumpulkannya padamu
  rationale: אָסַף berarti mengumpulkan, dan אֵלֶיךָ secara harfiah berarti 'kepadamu/padamu'. Pilihan ini tetap dekat dengan bentuk Ibrani dan dapat dipahami sebagai menyimpan persediaan bersama Nuh.
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: Itu akan menjadi makanan bagimu dan bagi mereka
  rationale: Bentuk וְהָיָה menyatakan hasil atau keadaan mendatang. Pengulangan preposisi pada לְךָ dan וְלָהֶם dipertahankan untuk membedakan Nuh dan makhluk-makhluk yang bersamanya, sedangkan לְאָכְלָה diterjemahkan secara idiomatis sebagai 'makanan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang lugas dan bermartabat. Kata ganti 'Engkau' dipakai untuk sapaan tunggal kepada Nuh. Struktur dibuat alami tanpa menghilangkan unsur benefaktif, keluasan ragam makanan, dan fungsi persediaan bagi Nuh serta makhluk-makhluk yang bersamanya.
