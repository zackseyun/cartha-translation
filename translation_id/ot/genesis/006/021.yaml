  rationale: Revisi mengganti perintah berperifrasa dengan imperatif langsung dan memperbaiki ungkapan pengumpulan menjadi bahasa Indonesia baku yang alami. "Untuk dirimu" pada kedua tindakan mempertahankan nuansa benefaktif dari לְךָ dan arah אליךָ tanpa menambahkan makna. Tidak diperlukan catatan kaki, karena "yang dapat dimakan" merupakan padanan alami dan cukup setia bagi klausa relatif Ibrani dalam konteks ini.
