id: GEN.6.13
reference: Genesis 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: id
  text: Lalu Allah berfirman kepada Nuh, “Akhir dari segala yang hidup telah tiba di hadapan-Ku, sebab bumi telah penuh dengan kekerasan karena mereka. Sesungguhnya, Aku akan membinasakan mereka bersama dengan bumi.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani dapat juga dipahami: “Aku akan membinasakan mereka dan bumi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ
  choice: akhir
  rationale: Menunjukkan kesudahan atau penghentian yang telah ditetapkan; bentuk ini alami dan khidmat dalam bahasa Indonesia.
- source_word: כָּל בָּשָׂר
  choice: segala yang hidup
  rationale: Secara harfiah berarti 'segala daging', tetapi dalam konteks air bah cakupannya lebih luas daripada manusia saja. 'Segala yang hidup' menyampaikan kategori makhluk hidup tanpa ungkapan Indonesia yang kaku.
- source_word: בָּא לְפָנַי
  choice: telah tiba di hadapan-Ku
  rationale: Mempertahankan gambaran Ibrani bahwa kesudahan itu telah datang ke hadapan Allah untuk penghakiman.
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: bumi telah penuh dengan kekerasan
  rationale: חָמָס menunjuk pada kekerasan, kelaliman, atau tindakan zalim; 'kekerasan' paling langsung dalam konteks ini, sedangkan 'bumi' sesuai dengan cakupan narasi air bah.
- source_word: מִפְּנֵיהֶם
  choice: karena mereka
  rationale: 'Preposisi ini berfungsi kausal: kekerasan memenuhi bumi oleh sebab para makhluk yang sedang dibicarakan.'
- source_word: וְהִנְנִי
  choice: Sesungguhnya, Aku akan
  rationale: Menyampaikan penegasan dan tindakan yang segera datang secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: מַשְׁחִיתָם
  choice: membinasakan mereka
  rationale: Bentuk kausatif שׁחת dalam konteks penghakiman berarti merusakkan sampai binasa atau membinasakan.
- source_word: אֶת הָאָרֶץ
  choice: bersama dengan bumi
  rationale: Konstruksi setelah objek pronominal sulit dan dapat dipahami sebagai objek kedua atau penyertaan. Pilihan ini menghindari kesan bahwa bumi menjadi alat pembinasaan sambil tetap menunjukkan bahwa bumi turut terkena penghakiman.
theological_decisions:
- issue: Cakupan כָּל בָּשָׂר
  choice: Kategori luas yang mencakup makhluk hidup, bukan manusia saja
  alternative: seluruh umat manusia
  rationale: Dalam narasi air bah, ungkapan ini digunakan dengan cakupan yang melampaui manusia; terjemahan tidak mempersempitnya.
- issue: Makna הָאָרֶץ
  choice: bumi
  alternative: negeri atau tanah
  rationale: Bingkai narasi ini bersifat luas dan mendukung 'bumi', meskipun kata Ibrani juga dapat berarti negeri atau tanah dalam konteks lain.
- issue: Hubungan אֶת הָאָרֶץ dengan מַשְׁחִיתָם
  choice: mereka bersama dengan bumi
  alternative: mereka dan bumi; mereka dengan memakai bumi
  rationale: Sintaksis Ibrani dapat dipahami sebagai objek kedua atau konstruksi yang menyatakan penyertaan. Teks utama memakai penyertaan yang alami dalam bahasa Indonesia, dan catatan kaki mempertahankan alternatif objek kedua.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berfirman' dipakai untuk ujaran ilahi; kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Ungkapan harfiah 'segala daging' dihindari karena tidak alami, tetapi keluasan maknanya dipertahankan.
