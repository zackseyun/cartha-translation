base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: id
  text: 'Beginilah engkau harus membuatnya: panjang bahtera itu tiga ratus hasta[a], lebarnya lima puluh hasta, dan tingginya tiga puluh hasta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hasta adalah satuan panjang kuno, kira-kira sepanjang jarak dari siku sampai ujung jari.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: Beginilah
  rationale: Gabungan penghubung dan kata tunjuk memperkenalkan rincian cara pembuatan; “Beginilah” menyampaikan fungsi instruksional itu secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: engkau harus membuatnya
  rationale: עשה berarti “membuat/melakukan”; objek feminin merujuk kepada bahtera, dan “harus” mempertahankan daya perintah bentuk imperfek dalam konteks ini.
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: tiga ratus hasta
  rationale: Mempertahankan satuan kuno אַמָּה sebagai “hasta”, istilah Indonesia yang lazim dalam konteks Alkitab, tanpa konversi yang dapat memberi ketepatan semu.
- source_word: הַתֵּבָה
  choice: bahtera itu
  rationale: Dalam konteks Nuh, תֵּבָה menunjuk pada kapal besar yang sedang diperintahkan untuk dibuat; “bahtera” merupakan padanan Indonesia yang mapan, sedangkan “itu” mencerminkan bentuk definit.
- source_word: אֹרֶךְ הַתֵּבָה
  choice: panjang bahtera itu
  rationale: אֹרֶךְ menyatakan dimensi panjang; susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan struktur Ibrani.
- source_word: חֲמִשִּׁים אַמָּה רָחְבָּהּ
  choice: lebarnya lima puluh hasta
  rationale: Bentuk bersufiks menyatakan lebar bahtera; urutan predikatif Indonesia ini jelas dan alami.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתָהּ
  choice: dan tingginya tiga puluh hasta
  rationale: קוֹמָה dapat berarti tinggi atau perawakan; dalam konteks ukuran bangunan, “tinggi” adalah padanan yang tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata ganti “engkau” dipakai untuk sapaan tunggal Allah kepada Nuh. Satuan kuno dipertahankan dan diterangkan melalui catatan kaki.
