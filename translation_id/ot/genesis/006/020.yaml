base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: id
  text: Dari antara burung menurut jenisnya masing-masing[a], dari antara ternak menurut jenisnya masing-masing, dan dari antara segala binatang yang merayap di tanah menurut jenisnya masing-masing, dua ekor dari setiap jenis akan datang kepadamu agar kamu menjaga mereka tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut jenis mereka”; ungkapan Ibrani ini menyatakan pengelompokan berdasarkan jenis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעוֹף
  choice: burung
  rationale: Dalam daftar kelompok hewan ini, עוֹף paling wajar diterjemahkan sebagai “burung”; makna yang lebih luas, yakni makhluk yang terbang, tidak perlu dinyatakan secara eksplisit.
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: menurut jenisnya masing-masing
  rationale: מִין menunjuk pada pengelompokan menurut jenis, tanpa memasukkan pengertian taksonomi biologis modern. “Masing-masing” membuat cakupan distributifnya jelas dalam bahasa Indonesia.
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה di sini menunjuk pada kelompok hewan darat yang dipelihara, dibedakan dari burung dan binatang yang merayap.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: segala binatang yang merayap di tanah
  rationale: רֶמֶשׂ mencakup makhluk kecil yang bergerak atau merayap, sedangkan הָאֲדָמָה secara konkret berarti tanah.
- source_word: שְׁנַיִם מִכֹּל
  choice: sepasang dari setiap jenis
  rationale: שְׁנַיִם secara harfiah berarti “dua”; dalam konteks pengumpulan hewan, “sepasang” merupakan ungkapan Indonesia yang alami, sementara “dari setiap jenis” mempertahankan daya distributif מִכֹּל.
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: akan datang kepadamu
  rationale: Ungkapan ini menyatakan gerak menuju Nuh dan tidak secara eksplisit menyebut masuk ke dalam bahtera.
- source_word: לְהַחֲיוֹת
  choice: agar kamu menjaga mereka tetap hidup
  rationale: Bentuk Hifil dari חיה menyatakan pemeliharaan hidup. Klausa tujuan dan subjek tersirat yang mengacu kepada Nuh dibuat jelas secara alami dalam bahasa Indonesia.
