base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: id
  text: Buatlah atap untuk bahtera itu[a], dan selesaikanlah itu hingga satu hasta dari atas.[b] Pasanglah pintu bahtera itu pada sisinya. Buatlah bahtera itu dengan tingkat bawah, tingkat kedua, dan tingkat ketiga.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jendela” atau “lubang cahaya”; kata Ibrani yang dipakai di sini langka dan makna tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani pada bagian ini sulit. Secara harfiah: “dan hingga satu hasta engkau harus menyelesaikannya dari atas.” Ungkapan ini mungkin mengacu pada penyelesaian struktur bagian atas pada ukuran satu hasta, tetapi rincian konstruksinya tidak pasti.'
    reason: textual_or_syntactic_difficulty
  - marker: c
    text: Atau “dengan lantai bawah, kedua, dan ketiga” atau “dengan geladak bawah, kedua, dan ketiga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: atap
  rationale: Kata Ibrani ini langka dan arti tepatnya diperdebatkan. Dalam konteks petunjuk mengenai bagian atas bahtera, “atap” paling sesuai sebagai terjemahan utama, sementara kemungkinan “jendela” atau “lubang cahaya” dipertahankan dalam catatan kaki.
- source_word: וְאֶל אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: dan selesaikanlah bagian atasnya hingga satu hasta
  rationale: Ungkapan Ibrani ini sulit secara sintaksis. Terjemahan ini mempertahankan unsur ‘menyelesaikan’, ‘satu hasta’, dan ‘bagian atas’ tanpa menentukan secara pasti apakah yang dimaksud adalah ukuran bukaan, penyempitan atap, atau rincian konstruksi lain.
- source_word: פֶּתַח
  choice: pintu
  rationale: Dalam petunjuk pembangunan bahtera, “pintu” merupakan padanan Indonesia yang paling alami untuk bukaan yang berfungsi sebagai jalan masuk.
- source_word: בְּצִדָּהּ
  choice: pada sisinya
  rationale: Frasa ini menunjukkan letak pintu pada sisi bahtera; “pada sisinya” alami dalam bahasa Indonesia dan tidak terlalu menentukan bentuk konstruksinya.
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: tingkat bawah, tingkat kedua, dan tingkat ketiga
  rationale: Bentuk-bentuk ini menunjuk pada tiga susunan vertikal bahtera. “Tingkat” lebih netral daripada “geladak” dan juga dapat mencakup pengertian lantai atau susunan ruang.
- source_word: תַּעֲשֶׂהָ
  choice: Buatlah bahtera itu
  rationale: Akhiran feminin merujuk kembali kepada bahtera; penyebutan ulang objek membuat kalimat Indonesia jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruktif dan bermartabat. Bentuk imperatif “buatlah”, “selesaikanlah”, dan “pasanglah” mempertahankan gaya perintah Ibrani. Ketidakpastian arsitektural tidak dipaksakan menjadi satu gambaran tertentu, melainkan dijelaskan melalui catatan kaki.
