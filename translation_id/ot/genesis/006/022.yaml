  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: id
  text: Nuh pun melakukannya[a]; sesuai dengan semua yang diperintahkan Allah kepadanya, demikianlah ia melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani mengulang kata kerja “melakukan” untuk memberi penekanan: “Nuh melakukan ... demikianlah ia melakukan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: pun melakukannya
  rationale: Kata kerja עשה berarti luas, ‘melakukan/membuat’. Dalam konteks ini, kata tersebut merangkum pelaksanaan petunjuk sebelumnya. Partikel ‘pun’ menandai kelanjutan sekaligus hasil, sedangkan ‘-nya’ membuat ungkapan ini wajar dalam bahasa Indonesia dengan merujuk pada hal-hal yang baru saja diperintahkan.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: כְּכֹל אֲשֶׁר
  choice: sesuai dengan semua yang
  rationale: Ungkapan ini menyatakan kesesuaian penuh antara tindakan Nuh dan seluruh perintah Allah.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: צוה menunjukkan perintah yang berwibawa; bentuk pasif ini menghasilkan susunan bahasa Indonesia yang alami tanpa mengurangi otoritas ilahi.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Akhiran orang ketiga tunggal maskulin merujuk kepada Nuh sebagai penerima perintah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan bahwa yang dimaksud adalah Allah yang esa; ‘Allah’ merupakan padanan baku dalam Alkitab bahasa Indonesia.
- source_word: כֵּן עָשָׂה
  choice: demikianlah ia melakukannya
  rationale: Padanan ini mempertahankan penegasan tentang kesesuaian tindakan Nuh dengan perintah dan tetap mengulang kata kerja עשה sebagaimana teks Ibrani.
theological_decisions:
- issue: Pengulangan rumusan ketaatan Nuh
  choice: 'Mempertahankan kedua kemunculan עשה: ‘Nuh pun melakukannya ... demikianlah ia melakukannya.’'
  alternative: Nuh melakukan semua yang diperintahkan Allah kepadanya.
  rationale: Teks Ibrani sengaja mengulang kata kerja עשה untuk menekankan bahwa tindakan Nuh sepenuhnya sesuai dengan perintah Allah. Pengulangan dipertahankan meskipun bentuk yang lebih ringkas akan terasa lebih lazim dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan sengaja mempertahankan pengulangan teks Ibrani, sementara ‘pun’ dan akhiran ‘-nya’ membantu kelancaran ungkapan dalam bahasa Indonesia.
