    issue: '''ke atas bumi'' kurang idiomatis'
    rationale: Dalam bahasa Indonesia baku, orang lazim mengatakan 'mendatangkan air bah ke bumi'. Makna air bah yang datang menutupi bumi tetap terjaga.
  - severity: medium
    issue: '''akan mati'' untuk ''Segala yang ada di bumi'''
    rationale: יִגְוָע menunjuk kematian atau kebinasaan, tetapi subjek rangkuman 'segala yang ada di bumi' lebih wajar dan setia secara idiomatis diterjemahkan 'akan binasa'.
  revised_text: Dan Aku—lihatlah, Aku mendatangkan air bah ke bumi untuk membinasakan segala makhluk yang memiliki napas kehidupan[a] di bawah langit. Segala yang ada di bumi akan binasa.
