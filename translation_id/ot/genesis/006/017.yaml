language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: id
  text: Dan Aku—lihatlah, Aku mendatangkan air bah ke bumi untuk membinasakan segala makhluk yang memiliki napas kehidupan[a] di bawah langit. Segala yang ada di bumi akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "roh kehidupan". Kata Ibrani רוּחַ dapat berarti "napas", "angin", atau "roh".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Dan Aku
  rationale: Konjungsi dan pronomina mandiri menegaskan pelaku; bentuk ini mempertahankan penekanan tanpa menambahkan pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: הִנְנִי
  choice: lihatlah, Aku
  rationale: Ungkapan ini memberi penekanan khidmat dan rasa segera. 'Lihatlah' mempertahankan fungsi retorisnya dalam bahasa Indonesia yang tetap mudah dipahami.
- source_word: מֵבִיא
  choice: mendatangkan
  rationale: Partisip menyatakan tindakan yang segera atau sedang diprakarsai oleh pembicara. 'Mendatangkan' alami bagi tindakan Allah menghadirkan air bah.
- source_word: הַמַּבּוּל מַיִם
  choice: air bah
  rationale: '''Air bah'' merupakan ungkapan Indonesia yang mapan untuk banjir besar dalam narasi ini dan sudah memuat unsur air yang dinyatakan oleh מַיִם.'
- source_word: עַל הָאָרֶץ
  choice: ke atas bumi
  rationale: Preposisi dan nomina menunjuk datangnya air bah atas bumi; 'bumi' sesuai dengan cakupan menyeluruh dalam konteks.
- source_word: לְשַׁחֵת
  choice: untuk membinasakan
  rationale: Infinitif menyatakan tujuan. 'Membinasakan' menyampaikan penghancuran yang berujung pada kematian dengan laras khidmat.
- source_word: כָּל בָּשָׂר
  choice: segala makhluk
  rationale: Secara harfiah berarti 'segala daging', tetapi dalam konteks menunjuk semua makhluk bernyawa. 'Segala makhluk' menghindari kesan bahwa yang dimaksud hanyalah jaringan tubuh sambil mempertahankan cakupan luas.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: yang memiliki napas kehidupan
  rationale: Ungkapan ini secara alami menyatakan bahwa makhluk tersebut mempunyai daya hidup berupa napas. Ambiguitas רוּחַ dicatat dalam catatan kaki.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: di bawah langit
  rationale: Ungkapan ini menunjuk seluruh wilayah di bawah langit. Bahasa Indonesia tidak memerlukan padanan harfiah unsur 'dari' untuk menyampaikan cakupannya.
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: Segala yang ada di bumi
  rationale: Mempertahankan daya merangkum dan cakupan total ungkapan Ibrani dengan susunan yang alami.
- source_word: יִגְוָע
  choice: akan mati
  rationale: Verba ini berarti mati atau mengembuskan napas terakhir. 'Akan mati' menyatakan hasilnya secara langsung dan jelas tanpa mengaburkan makna.
theological_decisions:
- issue: Makna רוּחַ dalam רוּחַ חַיִּים
  choice: napas kehidupan
  alternative: roh kehidupan
  rationale: Dalam konteks air bah, frasa ini paling wajar menunjuk napas atau daya hidup makhluk bernyawa serta berhubungan dengan bahasa penciptaan dalam Kejadian. Karena רוּחַ juga dapat berarti 'roh', alternatif itu dipertahankan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras khidmat. Kapitalisasi 'Aku' mengikuti rujukan pembicara kepada Allah. Tanda pisah dan 'lihatlah' mempertahankan penekanan ganda וַאֲנִי הִנְנִי tanpa membuat kalimat terlalu arkais.
