- source_word: שְׁלֹשָׁה בָנִים
  choice: tiga anak laki-laki
  rationale: בָנִים di sini berarti 'anak-anak laki-laki', sesuai dengan ketiga keturunan laki-laki yang kemudian disebutkan.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Ham, dan Yafet
  rationale: Partikel אֶת menandai objek langsung dan tidak perlu diterjemahkan tersendiri. Tanda titik dua memperkenalkan daftar nama secara alami dalam bahasa Indonesia.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שֵׁם
  choice: Sem
  rationale: Bentuk nama yang baku dalam tradisi penerjemahan Alkitab bahasa Indonesia.
- source_word: חָם
  choice: Ham
  rationale: Transliterasi nama Ibrani yang baku dan dikenal dalam bahasa Indonesia.
- source_word: יָפֶת
  choice: Yafet
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
