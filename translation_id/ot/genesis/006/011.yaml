  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: id
  text: Bumi telah rusak di hadapan Allah[a], dan bumi penuh dengan kekerasan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bumi telah rusak dalam pandangan Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: telah rusak
  rationale: 'Bentuk Niphal wayyiqtol dari שׁחת menyatakan keadaan/resultatif: bumi telah menjadi rusak. Ungkapan ini alami dalam bahasa Indonesia dan, dalam konteks, dapat menunjuk pada kebobrokan moral tanpa meniadakan nuansa kerusakan yang lebih luas.'
- source_word: הָאָרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'negeri/tanah'. Dalam konteks kisah air bah, 'bumi' paling sesuai; pengulangannya dipertahankan mengikuti penekanan teks Ibrani.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: לִפְנֵי secara harfiah menyatakan keberadaan 'di hadapan' atau 'di depan'. Pilihan ini mempertahankan gambaran kehadiran dan penilaian ilahi tanpa mempersempitnya menjadi penafsiran semata.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks dan sintaksis ayat ini, אֱלֹהִים merujuk kepada Allah yang esa.
- source_word: וַתִּמָּלֵא
  choice: penuh
  rationale: Bentuk Niphal dari מלא menunjukkan keadaan telah dipenuhi. Bahasa Indonesia yang alami memakai predikat 'penuh', yang menyampaikan hasil dari proses tersebut tanpa bentuk pasif yang kaku.
- source_word: חָמָס
  choice: kekerasan
  rationale: חָמָס mencakup kekerasan, kebrutalan, dan kejahatan yang menindas. 'Kekerasan' merupakan padanan langsung dan jelas dalam konteks ini.
- source_word: וַ
  choice: dan
  rationale: Waw kedua menghubungkan kedua klausa secara langsung. Waw pertama tidak diberi penanda tambahan karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat kerusakan bumi
  choice: Bahasa yang terutama selaras dengan kebobrokan moral masyarakat manusia di hadapan Allah, tetapi tetap memakai istilah umum 'rusak'
  alternative: Kerusakan fisik bumi semata
  rationale: Konteks langsung menyoroti kejahatan dan kekerasan manusia. Namun, 'rusak' mempertahankan keluasan makna שׁחת dan tidak memaksakan perincian doktrinal yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'bumi' dipertahankan demi penekanan dan kesetiaan pada struktur Ibrani; 'di hadapan Allah' mempertahankan ungkapan sumber, sedangkan alternatif idiomatis dicatat dalam catatan kaki.
