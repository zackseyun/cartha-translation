  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: id
  text: Inilah riwayat Nuh. Nuh adalah seorang laki-laki yang benar dan tidak bercela dalam generasinya.[a] Nuh berjalan bersama Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga dipahami “di antara orang-orang sezamannya” atau “pada zamannya.”
    reason: Frasa Ibrani בְּדֹרֹתָיו berbentuk jamak dan dapat dipahami dengan lebih dari satu cara.
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Inilah riwayat
  rationale: Ungkapan ini memperkenalkan bagian baru dalam kitab Kejadian. “Riwayat” terdengar alami dalam bahasa Indonesia dan tetap mencakup gagasan catatan sejarah atau garis keturunan tanpa membatasinya hanya pada daftar keturunan.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: אִישׁ צַדִּיק
  choice: seorang yang benar
  rationale: Menunjukkan bahwa Nuh adalah seorang laki-laki yang hidup benar; “benar” mempertahankan bobot etis dan teologis צַדִּיק tanpa menambahkan gagasan yang tidak dinyatakan teks.
- source_word: תָּמִים
  choice: tidak bercela
  rationale: Dalam konteks watak, kata ini menyatakan keutuhan atau integritas moral, bukan keharusan bahwa Nuh sama sekali tanpa dosa.
- source_word: בְּדֹרֹתָיו
  choice: dalam generasi-generasinya
  rationale: Bentuk jamak Ibrani dipertahankan agar keterbukaan maknanya tetap tampak; ungkapan itu dapat menunjuk pada generasi-generasi sepanjang hidup Nuh atau pada orang-orang sezamannya.
- source_word: אֶת הָאֱלֹהִים הִתְהַלֶּךְ
  choice: berjalan bersama Allah
  rationale: Mempertahankan metafora Ibrani tentang cara hidup yang dekat dan selaras dengan Allah serta hubungan antarteks dengan pemakaian serupa dalam kitab Kejadian.
theological_decisions:
- issue: Makna תָּמִים sebagai gambaran tentang Nuh
  choice: tidak bercela sebagai pernyataan tentang integritas
  alternative: sempurna; tanpa cacat
  rationale: Teks memuji watak Nuh di tengah dunia yang rusak, tetapi tidak mengharuskan penafsiran bahwa ia memiliki kesempurnaan mutlak atau tidak pernah berdosa.
- issue: Makna בְּדֹרֹתָיו
  choice: mempertahankan bentuk “dalam generasi-generasinya”
  alternative: di antara orang-orang sezamannya; pada zamannya
  rationale: Frasa Ibrani bersifat terbuka. Terjemahan yang lebih harfiah menjaga ambiguitas tersebut, sedangkan kemungkinan pemahaman yang lebih idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “riwayat” menghindari kesan bahwa תּוֹלְדֹת hanya merupakan daftar keturunan. Metafora “berjalan bersama Allah” dipertahankan. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
