base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: id
  text: Dari segala makhluk hidup[a], dari segala yang berdaging[b], bawalah dua dari masing-masing ke dalam bahtera untuk memelihara mereka tetap hidup bersamamu; mereka harus jantan dan betina.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala yang hidup.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “dari segala daging,” suatu ungkapan Ibrani bagi makhluk hidup yang berdaging.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי
  choice: Dari segala makhluk hidup
  rationale: Ungkapan ini menunjuk secara luas kepada apa yang hidup. “Makhluk hidup” alami dalam bahasa Indonesia dan tetap mempertahankan keluasan makna substantiva הַחַי.
- source_word: מִכָּל בָּשָׂר
  choice: dari segala yang berdaging
  rationale: Terjemahan ini mempertahankan gambaran Ibrani “segala daging” sambil mengungkapkannya secara wajar sebagai sebutan bagi makhluk hidup yang berdaging.
- source_word: שְׁנַיִם מִכֹּל
  choice: dua dari masing-masing
  rationale: Frasa ini menyatakan dua individu yang diambil dari setiap kelompok dalam cakupan perintah, tanpa menambahkan kata “jenis” yang tidak dinyatakan secara eksplisit.
- source_word: תָּבִיא
  choice: harus kaubawa
  rationale: Bentuk Hifil imperfek dalam konteks instruksi menyampaikan perintah atau kewajiban. “Harus kaubawa” terdengar tegas dan wajar dalam bahasa Indonesia modern.
- source_word: אֶל הַתֵּבָה
  choice: ke dalam bahtera
  rationale: Dalam konteks membawa makhluk-makhluk itu masuk, “ke dalam” menyatakan arah gerak secara jelas; “bahtera” merupakan padanan baku bagi תֵּבָה dalam kisah ini.
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: untuk memelihara mereka tetap hidup bersamamu
  rationale: Infinitif Hifil menyatakan tindakan menyebabkan atau membiarkan tetap hidup. Padanan ini mempertahankan makna kausatif dan unsur kebersamaan אִתָּךְ.
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: mereka harus jantan dan betina
  rationale: “Jantan dan betina” adalah padanan langsung dan idiomatis untuk jenis kelamin makhluk bukan manusia; “harus” mempertahankan daya instruksional konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Struktur berulang “dari segala …, dari segala …” dipertahankan untuk mencerminkan susunan Ibrani, sementara pilihan “makhluk hidup” dan “yang berdaging” menjaga keluasan serta gambaran teks sumber.
