  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: id
  text: anak-anak Allah[a] melihat bahwa anak-anak perempuan manusia itu cantik[b], lalu mereka mengambil istri-istri bagi diri mereka sendiri dari antara siapa pun yang mereka pilih.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk ilahi”. Identitas “anak-anak Allah” diperdebatkan; penafsiran utama mencakup makhluk surgawi, para penguasa manusia, atau keturunan Set.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “baik”; dalam konteks ini maksudnya menarik atau elok dipandang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: anak-anak Allah
  rationale: Padanan yang dekat secara formal ini mempertahankan ungkapan Ibrani dan tidak menentukan identitas para tokohnya.
- source_word: בְּנוֹת הָאָדָם
  choice: anak-anak perempuan manusia
  rationale: Terjemahan ini mempertahankan kesejajaran dan kontras sastra dengan 'anak-anak Allah'; 'manusia' menyampaikan אָדָם sebagai kata kolektif.
- source_word: כִּי טֹבֹת הֵנָּה
  choice: bahwa ... itu cantik
  rationale: Dalam konteks ini טֹבֹת menunjuk pada daya tarik fisik. 'Cantik' alami dalam bahasa Indonesia dan menghindari kesan penilaian moral dari 'baik'.
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: lalu mereka mengambil istri bagi diri mereka sendiri
  rationale: נָשִׁים berarti 'istri-istri' dalam konstruksi ini; frasa 'bagi diri mereka sendiri' mempertahankan לָהֶם.
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: dari siapa saja yang mereka pilih
  rationale: Ungkapan ini menyampaikan cakupan pilihan yang tidak dibatasi serta tetap wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas 'anak-anak Allah'
  choice: Mempertahankan ungkapan harfiah 'anak-anak Allah' tanpa menentukan identitas mereka.
  alternative: Makhluk-makhluk ilahi atau surgawi; para penguasa manusia; keturunan Set.
  rationale: Rujukan frasa Ibrani ini diperdebatkan dan ayat tersebut tidak menyelesaikannya; terjemahan harus mempertahankan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan mempertahankan kontras antara 'anak-anak Allah' dan 'anak-anak perempuan manusia' serta tidak menyelesaikan identitas kelompok pertama.
