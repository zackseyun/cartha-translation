id: GEN.6.1
reference: Genesis 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: id
  text: Ketika umat manusia mulai bertambah banyak di muka bumi dan anak-anak perempuan lahir bagi mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Gabungan formula naratif וַיְהִי dengan כִּי membuka perkembangan baru melalui anak kalimat waktu. Dalam bahasa Indonesia modern, “Ketika” menyampaikan fungsi ini secara alami tanpa ungkapan kaku “terjadilah ketika”.
- source_word: הֵחֵל
  choice: mulai
  rationale: Bentuk ini menyatakan permulaan suatu tindakan atau keadaan.
- source_word: הָאָדָם
  choice: umat manusia
  rationale: Walaupun secara gramatikal berbentuk tunggal, kata ini dipakai secara kolektif dan menunjuk kepada seluruh manusia, bukan hanya laki-laki atau Adam sebagai individu.
- source_word: לָרֹב
  choice: bertambah banyak
  rationale: Infinitif ini menyatakan pertambahan jumlah penduduk; “bertambah banyak” alami dalam bahasa Indonesia dan mempertahankan gagasan menjadi banyak.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: di muka bumi
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang permukaan tanah, sedangkan “bumi” paling alami untuk cakupan tempat hunian manusia dalam konteks ini.
- source_word: וּבָנוֹת
  choice: dan anak-anak perempuan
  rationale: Terjemahan langsung yang alami dan menyiapkan fokus ayat berikutnya.
- source_word: יֻלְּדוּ לָהֶם
  choice: lahir bagi mereka
  rationale: Bentuk pasif ילד dengan ל menyatakan bahwa anak-anak perempuan dilahirkan bagi kelompok manusia tersebut.
theological_decisions:
- issue: Makna kolektif הָאָדָם
  choice: umat manusia
  alternative: manusia
  rationale: Konteks menunjukkan umat manusia secara umum, bukan Adam sebagai individu atau kaum laki-laki saja. “Umat manusia” menjelaskan daya kolektif bentuk tunggal Ibrani tanpa memasukkan pembedaan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti anak kalimat temporal Ibrani secara alami; koma akhir dipertahankan karena ayat ini berlanjut langsung ke ayat 2.
