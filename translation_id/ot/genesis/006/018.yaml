  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: id
  text: Namun, Aku akan menegakkan perjanjian-Ku dengan engkau[a]. Engkau akan masuk ke dalam bahtera itu—engkau, anak-anak lelakimu, istrimu, dan istri anak-anak lelakimu bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan mengukuhkan perjanjian-Ku dengan engkau.” Dalam konteks perjanjian, kata kerja Ibrani itu dapat mengandung salah satu dari kedua nuansa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Namun, Aku akan menegakkan
  rationale: Bentuk Hifil dari קום dengan בְּרִית dapat berarti menegakkan atau mengukuhkan perjanjian. 'Menegakkan' mempertahankan gambaran dan orientasi janji ke depan; 'Namun' menyatakan kontras wacana dengan kebinasaan yang baru diumumkan.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: בְּרִית adalah istilah baku untuk ikatan perjanjian dan perlu dipertahankan secara konsisten karena bobot kanonis dan teologisnya.
- source_word: אִתָּךְ
  choice: dengan engkau / bersamamu
  rationale: Preposisi ini pertama-tama menandai hubungan perjanjian, lalu pada akhir ayat menyatakan kebersamaan. Perbedaan bentuk Indonesia dipilih sesuai fungsi sintaksis.
- source_word: וּבָאתָ
  choice: Engkau akan masuk
  rationale: בוא dapat berarti datang, pergi, atau masuk. Karena bahtera menjadi tujuan, 'masuk ke dalam' adalah padanan Indonesia yang paling jelas dan alami.
- source_word: הַתֵּבָה
  choice: bahtera itu
  rationale: תֵּבָה dalam kisah Nuh secara tepat dan lazim diterjemahkan 'bahtera'. Unsur definitnya dinyatakan dengan 'itu' dalam bahasa Indonesia.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina mandiri memberi penekanan dan dipertahankan dalam daftar aposisional setelah kata kerja.
- source_word: וּבָנֶיךָ
  choice: anak-anak lelakimu
  rationale: בָּנִים secara khusus berarti anak-anak lelaki, bukan anak-anak secara umum; bentuk ini menjaga ketepatan gender.
- source_word: וְאִשְׁתְּךָ
  choice: istrimu
  rationale: Padanan posesif yang langsung, wajar, dan tepat bagi אִשָּׁה dalam konteks keluarga.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: istri anak-anak lelakimu
  rationale: Frasa konstruksi ini secara harfiah berarti istri dari anak-anak lelakimu. Bentuk tersebut dekat dengan susunan Ibrani dan tidak menggantinya dengan istilah kekerabatan yang lebih interpretatif.
theological_decisions:
- issue: Makna ungkapan perjanjian
  choice: Aku akan menegakkan perjanjian-Ku dengan engkau
  alternative: Aku akan mengukuhkan perjanjian-Ku dengan engkau
  rationale: Bahasa Ibrani memungkinkan arti pembentukan perjanjian maupun pengukuhan komitmen yang telah ada. Ayat ini sendiri tidak menuntaskan pertanyaan teologis itu; teks utama memakai padanan baku, sedangkan kemungkinan lainnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' dipakai untuk sapaan tunggal kepada Nuh dan untuk mempertahankan pembedaan jumlah; kapitalisasi pada pronomina ilahi mengikuti gaya penerbitan Indonesia. Tanda pisah mempertahankan penekanan daftar keluarga.
