  source_fidelity: Tepat terhadap teks Ibrani. וַהֲקִמֹתִי diterjemahkan secara sah dengan “Aku akan menegakkan,” sambil mempertahankan alternatif “mengukuhkan” di catatan kaki. Relasi perjanjian (“dengan engkau”), perintah/janji masuk ke bahtera, penekanan pronomina mandiri, serta seluruh anggota keluarga yang disebutkan telah tercakup. “Anak-anak lelakimu” dan “istri anak-anak lelakimu” menjaga rujukan eksplisit kepada anak-anak laki-laki dan istri mereka.
