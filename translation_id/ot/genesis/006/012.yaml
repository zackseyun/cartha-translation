  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: id
  text: Allah melihat bumi itu, dan lihatlah, bumi itu telah rusak[a], sebab semua yang berdaging[b] telah merusak jalan hidupnya di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan ‘rusak’ dapat menunjuk kepada kebobrokan moral maupun keadaan yang hancur atau binasa.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: ‘semua daging’; ungkapan ini dapat dipahami sebagai semua manusia atau lebih luas sebagai segala makhluk hidup.'
    reason: scope_ambiguity
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה secara langsung berarti ‘melihat’ dan tidak perlu diberi nuansa tambahan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada satu-satunya Allah; ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: bumi itu
  rationale: Konteks kisah air bah mendukung cakupan ‘bumi’, bukan ‘negeri’ atau ‘tanah’ yang lebih sempit.
- source_word: וְהִנֵּה
  choice: dan lihatlah
  rationale: Ungkapan ini menarik perhatian secara hidup kepada keadaan yang Allah lihat dan mempertahankan kekhidmatan narasi.
- source_word: נִשְׁחָתָה
  choice: telah rusak
  rationale: Bentuk Nifal dari שׁחת menyatakan keadaan yang sudah menjadi rusak. ‘Rusak’ cukup luas untuk mencakup kebobrokan moral maupun kehancuran yang diakibatkannya.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi keadaan bumi yang baru disebutkan.
- source_word: הִשְׁחִית
  choice: telah merusak
  rationale: Bentuk Hifil dari akar שׁחת bersifat kausatif. ‘Merusak’ mempertahankan hubungan leksikal dengan ‘rusak’ pada klausa sebelumnya.
- source_word: כָּל בָּשָׂר
  choice: semua yang berdaging
  rationale: Padanan ini mempertahankan citra harfiah ‘daging’ dan keluasan ungkapan Ibrani tanpa membatasinya secara tegas hanya kepada manusia atau kepada seluruh makhluk hidup.
- source_word: דַּרְכּוֹ
  choice: jalan hidupnya
  rationale: דֶּרֶךְ adalah ‘jalan’ yang di sini secara kiasan menunjuk kepada perilaku atau cara hidup. ‘Jalan hidup’ mempertahankan metafora sambil memperjelas maksudnya.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: Dalam bahasa Indonesia, ‘di bumi’ merupakan ungkapan alami untuk keberadaan dan tindakan makhluk di atas bumi.
theological_decisions:
- issue: Daya makna שׁחת dalam kedua klausa
  choice: rusak ... telah merusak
  alternative: bobrok ... telah membobrokkan; binasa ... telah membinasakan
  rationale: Pengulangan ‘rusak/merusak’ mempertahankan akar Ibrani yang sama dan hubungan sebab-akibat antara tindakan semua yang berdaging dan keadaan bumi. Kata ini tidak membatasi makna hanya pada kebobrokan moral atau hanya pada kehancuran fisik.
- issue: Cakupan כָּל בָּשָׂר
  choice: semua yang berdaging
  alternative: semua manusia; segala makhluk hidup
  rationale: Ungkapan Ibrani dapat dipahami dengan cakupan yang lebih sempit atau lebih luas. Padanan utama mempertahankan idiom dan membiarkan konteks menentukan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Lihatlah’ mempertahankan daya retoris הִנֵּה; ‘semua yang berdaging’ sengaja mempertahankan keluasan ungkapan sumber, sedangkan ‘jalan hidup’ membuat metafora perilaku tetap jelas bagi pembaca umum.
