language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Aku akan menghapuskan manusia[a] yang telah Kuciptakan dari muka bumi—manusia, ternak, binatang melata, dan burung-burung di langit[c]—sebab Aku menyesal telah menjadikan mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat manusia.” Kata Ibrani adam di sini menunjuk manusia secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku berdukacita karena telah menjadikan mereka.” Kata Ibrani נחם dalam bentuk Nifal menyatakan penyesalan atau dukacita atas tindakan terdahulu; kata itu sendiri tidak menyatakan bahwa Yahweh terkejut, tidak mengetahui sebelumnya, atau telah melakukan kesalahan moral.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “burung-burung langit”; juga dapat diterjemahkan “burung-burung di angkasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi YHWH sesuai bentuk nama diri yang lazim dalam proyek.
- source_word: אֶמְחֶה
  choice: Aku akan menghapuskan
  rationale: מחה menggambarkan tindakan menghapus atau melenyapkan; pilihan ini mempertahankan citra konkret yang dilanjutkan oleh frasa 'dari muka bumi'.
- source_word: הָאָדָם
  choice: manusia
  rationale: Di sini אָדָם digunakan secara kolektif untuk umat manusia. 'Manusia' alami dalam bahasa Indonesia dan tetap dapat berfungsi secara representatif tanpa membatasi rujukan pada laki-laki.
- source_word: אֲשֶׁר בָּרָאתִי
  choice: yang telah Kuciptakan
  rationale: Menyatakan tindakan penciptaan yang telah selesai dan tetap relevan terhadap keputusan yang diumumkan.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari muka bumi
  rationale: '''Muka bumi'' merupakan ungkapan Indonesia yang alami dan tetap mencerminkan idiom Ibrani; הָאֲדָמָה di sini menunjuk daratan atau permukaan tanah.'
- source_word: מֵאָדָם עַד בְּהֵמָה עַד רֶמֶשׂ וְעַד עוֹף הַשָּׁמַיִם
  choice: baik manusia maupun ternak, binatang melata, dan burung-burung di langit
  rationale: Mengungkapkan rentang enumeratif מִן ... עַד secara alami dalam bahasa Indonesia sambil mempertahankan semua kelompok makhluk yang disebut.
- source_word: נִחַמְתִּי
  choice: Aku menyesal
  rationale: Bentuk Niphal dari נחם dengan klausa tentang tindakan terdahulu paling langsung menyatakan penyesalan atau dukacita retrospektif. Pilihan ini mempertahankan ketegangan teks tanpa menambahkan gagasan bahwa Allah terkejut atau melakukan kesalahan moral.
- source_word: כִּי עֲשִׂיתִם
  choice: telah menjadikan mereka
  rationale: Akhiran jamak merujuk kembali kepada semua makhluk yang baru disebut; 'telah menjadikan mereka' menyampaikan tindakan selesai beserta akibatnya kini.
theological_decisions:
- issue: Penyesalan ilahi dalam נִחַמְתִּי
  choice: sebab Aku menyesal telah menjadikan mereka
  alternative: sebab Aku berdukacita karena telah menjadikan mereka
  rationale: Terjemahan utama mempertahankan daya retrospektif נִחַמְתִּי serta ketegangan teologis teks. Catatan menjelaskan cakupan katanya tanpa meniadakan atau memperbesar implikasinya.
- issue: Makna kolektif הָאָדָם
  choice: manusia
  alternative: umat manusia
  rationale: '''Manusia'' dapat memiliki makna kolektif dalam bahasa Indonesia dan mengulang leksem yang sama pada daftar berikutnya, sedangkan ''umat manusia'' lebih eksplisit tetapi kurang mempertahankan pengulangan bentuk sumber.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat berhuruf kapital seperti 'Kuciptakan' mengikuti konvensi penghormatan bagi rujukan ilahi. Susunan daftar dibuat idiomatis dengan 'baik ... maupun' tanpa menghilangkan cakupan bertahap teks Ibrani.
