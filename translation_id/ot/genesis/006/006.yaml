  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: id
  text: Lalu Yahweh menyesal[a] telah menjadikan manusia[b] di bumi, dan Ia merasa pedih dalam hati-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdukacita karena telah menjadikan”. Kata Ibrani נחם dalam bentuk Niphal mengungkapkan penyesalan atau dukacita atas tindakan terdahulu; kata itu sendiri tidak menyatakan bahwa Allah terkejut, tidak mengetahui sebelumnya, atau melakukan kesalahan moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “umat manusia”. Kata Ibrani ’adam di sini menunjuk secara kolektif kepada umat manusia.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepada hati-Nya”. Ungkapan ini menyatakan kepedihan yang mendalam dalam batin-Nya.
    reason: literal_expression
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: menyesal
  rationale: Bentuk Niphal נחם dengan klausa כִּי yang menunjuk pada tindakan terdahulu mengungkapkan penyesalan atau dukacita retrospektif. “Menyesal” mempertahankan daya evaluatif itu dan membedakannya dari וַיִּתְעַצֵּב yang menyatakan kepedihan batin. Kata ini sendiri tidak menyatakan bahwa Yahweh terkejut, tidak mengetahui sebelumnya, atau melakukan kesalahan moral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה secara langsung dan membedakannya dari gelar “Tuhan”.
- source_word: כִּי
  choice: karena
  rationale: Dalam susunan Indonesia, “menyesal karena telah menjadikan” secara alami menyampaikan isi sekaligus alasan penyesalan yang diperkenalkan oleh כִּי.
- source_word: עָשָׂה
  choice: telah menjadikan
  rationale: “Telah” menandai bahwa tindakan menjadikan manusia mendahului penyesalan; “menjadikan” sesuai dengan tindakan penciptaan dalam konteks ini.
- source_word: הָאָדָם
  choice: manusia
  rationale: Di sini אָדָם bersifat kolektif dan menunjuk pada umat manusia, bukan hanya Adam sebagai individu. “Manusia” menyampaikan cakupan kolektif itu secara alami dalam bahasa Indonesia.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: Dalam konteks Kejadian, frasa ini menunjuk pada bumi atau dunia, bukan suatu negeri tertentu; “di bumi” adalah ungkapan Indonesia yang alami.
- source_word: וַיִּתְעַצֵּב
  choice: terasa pedih
  rationale: Bentuk Hitpael עצב menggambarkan kepedihan batin yang mendalam. “Terasa pedih” mempertahankan nuansa luka batin dan tetap membedakannya dari penyesalan pada verba sebelumnya.
- source_word: אֶל־לִבּוֹ
  choice: hati-Nya
  rationale: Secara harfiah frasa itu bergerak “kepada hati-Nya”, tetapi dalam idiomnya menunjuk pada pengalaman batin. Susunan “hati-Nya terasa pedih” menyampaikan makna internal itu dengan bahasa Indonesia yang wajar.
theological_decisions:
- issue: 'Bahasa antropopatik tentang Allah: Yahweh “menyesal” dan mengalami kepedihan hati'
  choice: Mempertahankan pernyataan langsung bahwa Yahweh menyesal atas tindakan-Nya terdahulu dan hati-Nya terasa pedih.
  alternative: “Yahweh berdukacita karena telah menjadikan” atau “Yahweh berubah pikiran”
  rationale: 'Teks Ibrani menyandingkan dua verba yang berbeda: נחם menyatakan penyesalan atau dukacita retrospektif, sedangkan עצב menyatakan kepedihan batin. Terjemahan tidak boleh menghapus ketegangan teologis itu atau menambahkan gagasan bahwa Yahweh terkejut, kurang mengetahui, maupun bersalah secara moral.'
- issue: Makna kolektif הָאָדָם
  choice: “manusia” sebagai sebutan kolektif bagi umat manusia
  alternative: “Adam” atau “umat manusia”
  rationale: Konteks membicarakan bangsa manusia secara luas, bukan Adam sebagai individu. “Manusia” mempertahankan bentuk ringkas dan makna kolektif yang alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” menjaga alur naratif tanpa kekakuan “dan”. Susunan “hati-Nya terasa pedih” dipilih karena lebih idiomatis daripada terjemahan harfiah preposisi אֶל, sambil mempertahankan gambaran kepedihan batin.
