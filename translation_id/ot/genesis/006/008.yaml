base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: id
  text: Namun, Nuh mendapat perkenanan di mata Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, Nuh mendapat kasih karunia di mata Yahweh.”'
    reason: Alternatif leksikal untuk חֵן; “kasih karunia” juga mungkin, tetapi dapat membawa nuansa teologis yang lebih khusus daripada yang diwajibkan konteks.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Namun, Nuh
  rationale: Konjungsi וְ secara dasar berarti “dan”, tetapi di sini menandai kontras antara Nuh dan manusia lain yang akan dihukum. “Namun” menyampaikan hubungan wacana itu secara alami dalam bahasa Indonesia.
- source_word: מָצָא
  choice: mendapat
  rationale: Secara harfiah berarti “menemukan”, tetapi dalam ungkapan מָצָא חֵן padanan Indonesia yang alami ialah “mendapat perkenanan”; ini mempertahankan makna idiom tanpa menyiratkan bahwa Nuh menemukannya secara kebetulan.
- source_word: חֵן
  choice: perkenanan
  rationale: Kata חֵן dapat berarti perkenanan, kemurahan, atau kasih karunia. “Perkenanan” paling sesuai dengan idiom konteks ini dan tidak mempersempitnya pada rumusan teologis yang lebih kemudian.
- source_word: בְּ/עֵינֵי
  choice: di mata
  rationale: Padanan ini mempertahankan metafora Ibrani dan tetap wajar dalam bahasa Indonesia, dengan makna “dalam pandangan” atau “di hadapan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Makna חֵן sebagai sikap ilahi terhadap Nuh
  choice: perkenanan
  alternative: kasih karunia
  rationale: “Perkenanan” mempertahankan keluasan makna חֵן dan ungkapan Ibrani, sementara “kasih karunia” merupakan kemungkinan sah yang dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankannya melalui transliterasi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora “di mata” dipertahankan karena jelas bagi pembaca umum; “mendapat perkenanan” dipilih sebagai ungkapan Indonesia yang lebih alami daripada terjemahan harfiah “menemukan perkenanan”.
