  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: id
  text: Demikianlah Yusuf meninggal pada usia seratus sepuluh tahun. Mereka membalsam jenazahnya[a] dan menempatkannya dalam sebuah peti mati[b] di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memumikan jenazahnya.” Kata Ibrani ini menunjuk pada pembalsaman, terutama dalam konteks Mesir.
    reason: cultural_note
  - marker: b
    text: Kata Ibrani yang sama juga dapat berarti “peti” atau “tabut”; dalam konteks pembalsaman dan penguburan ini artinya “peti mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata kerja מות secara langsung menyatakan kematian. 'Meninggal' merupakan padanan Indonesia yang wajar dan tetap lugas dalam narasi bermartabat.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: pada usia seratus sepuluh tahun
  rationale: Ungkapan Ibrani secara harfiah memakai 'anak laki-laki dari' untuk menyatakan umur; idiom Indonesia yang alami ialah 'pada usia'.
- source_word: וַיַּחַנְטוּ אֹתוֹ
  choice: membalsam jenazahnya
  rationale: חנט menunjuk pada pembalsaman, khususnya sesuai konteks Mesir. Penambahan 'jenazah' membuat objek tindakan ini alami dan jelas dalam bahasa Indonesia tanpa mengubah makna.
- source_word: וַיִּישֶׂם
  choice: menempatkannya
  rationale: Bentuk tunggal kata kerja שׂים berarti menaruh atau menempatkan. 'Menempatkannya' sesuai dengan nada narasi yang khidmat.
- source_word: בָּאָרוֹן
  choice: dalam sebuah peti mati
  rationale: אָרוֹן dapat berarti peti, tabut, atau peti mati. Dalam konteks pembalsaman dan penyimpanan jenazah, 'peti mati' adalah padanan kontekstual yang paling tepat; artikel Ibrani tidak harus diterjemahkan dengan bentuk definit dalam bahasa Indonesia karena wadah ini baru diperkenalkan.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Padanan baku nama tempat tersebut.
- source_word: וַ
  choice: Demikianlah
  rationale: Waw naratif menghubungkan ayat ini dengan kisah sebelumnya dan, pada penutup kitab, membawa nuansa simpulan. 'Demikianlah' menyampaikan alur penutup itu secara alami; alternatif yang lebih formal ialah 'Lalu' atau 'Dan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Demikianlah' mempertahankan fungsi penghubung sekaligus nuansa penutup. Kalimat dibagi dua agar jelas dan alami; urutan peristiwa Ibrani tetap dipertahankan. Semua penanda catatan kaki dicantumkan dalam teks utama.
