  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: id
  text: Empat puluh hari pun genap baginya, sebab demikianlah hari-hari pembalseman digenapi[b]. Mesir[a] menangisi dia selama tujuh puluh hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini “Mesir” dipakai secara kolektif untuk penduduk Mesir.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab demikianlah hari-hari untuk pembalseman menjadi genap.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: Empat puluh hari pun genap baginya
  rationale: Kata kerja מלא menyatakan berakhir atau genapnya suatu jangka waktu. Susunan ini mempertahankan fokus teks pada masa empat puluh hari dan frasa לּוֹ, tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: כִּי כֵן
  choice: sebab demikianlah
  rationale: Ungkapan ini memperkenalkan penjelasan bagi masa empat puluh hari dan dipertahankan secara ringkas serta wajar dalam bahasa Indonesia.
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: masa pembalsaman digenapi
  rationale: Dalam konteks ayat sebelumnya, חֲנֻטִים berkaitan dengan proses pembalsaman. 'Masa pembalsaman' menyampaikan maksudnya dengan wajar, sedangkan bentuk 'digenapi' mempertahankan pengulangan akar מלא.
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: menangisi dia
  rationale: Kata בכה secara langsung berarti menangis; 'menangisi dia' alamiah dalam bahasa Indonesia dan tidak mempersempitnya menjadi upacara perkabungan resmi.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Nama negeri dalam bahasa Ibrani dipertahankan, dengan pengertian kolektif bahwa yang dimaksud ialah penduduk Mesir.
- source_word: שִׁבְעִים יוֹם
  choice: selama tujuh puluh hari
  rationale: Kata 'selama' membuat fungsi keterangan durasi jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pengulangan konsep 'genap' dipertahankan untuk mencerminkan pengulangan akar מלא dalam teks Ibrani, sedangkan 'masa pembalsaman' dipilih agar ungkapan partisipial Ibrani dapat dipahami pembaca umum.
