  source_fidelity: 'Makna pokok diterjemahkan dengan setia: empat puluh hari selesai bagi Yakub, hal itu merupakan lamanya hari-hari pembalseman, dan orang Mesir menangisinya tujuh puluh hari. Susunan Ibrani yang memakai nama negeri secara kolektif juga ditangani dengan tepat melalui catatan kaki.'
  naturalness: Kalimat pertama dapat dipahami dan bernada naratif yang baik. Namun, “masa pembalsaman digenapi” kurang lazim dalam bahasa Indonesia modern karena yang lazim disebut selesai atau genap ialah hari-hari/jangka waktunya, bukan “masa” yang digenapi. Bentuk “pembalseman” juga lebih baku daripada “pembalsaman.”
  terminology: “Menangisi dia” tepat untuk וַיִּבְכּוּ אֹתוֹ dan tidak memaksakan makna ritual formal. “Mesir” dengan catatan kolektif mempertahankan bentuk sumber. Istilah proses sebaiknya memakai “pembalseman.”
