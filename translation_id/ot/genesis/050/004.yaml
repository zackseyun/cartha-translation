base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: id
  text: Setelah masa perkabungannya berakhir[a], Yusuf berkata kepada para pegawai istana Firaun, “Jika aku telah mendapat perkenanan di mata kalian, tolong sampaikanlah kepada Firaun[b], ‘
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari-hari tangisnya”; juga dapat diterjemahkan, “hari-hari mereka menangisinya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di telinga Firaun,” yaitu agar Firaun mendengarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: berakhir
  rationale: Kata עבר di sini menyatakan berlalunya suatu jangka waktu; dalam bahasa Indonesia, “berakhir” paling alami untuk masa perkabungan yang telah selesai sebelum Yusuf berbicara.
- source_word: יְמֵי בְכִיתוֹ
  choice: masa perkabungan itu
  rationale: Secara harfiah frasa ini berkaitan dengan “hari-hari tangis”; dalam konteks pemakaman, “masa perkabungan” menyampaikan maknanya secara wajar. Kata “itu” menghindari ketaksaan rujukan akhiran pronominal yang dapat timbul jika diterjemahkan “perkabungannya”; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: kepada kalangan istana Firaun
  rationale: בֵּית פַּרְעֹה menunjuk pada lingkungan rumah tangga atau pejabat istana Firaun yang dapat meneruskan permintaan Yusuf, bukan sekadar bangunan istana.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: Jika aku mendapat kemurahan hati kalian
  rationale: Ungkapan Ibrani harfiahnya “jika aku telah menemukan kemurahan di mata kalian.” Terjemahan ini mempertahankan permohonan yang sopan tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: דַּבְּרוּ נָא
  choice: tolong sampaikanlah
  rationale: Bentuk perintah jamak disertai partikel permohonan נָא. Karena yang diminta ialah meneruskan pesan kepada Firaun, “tolong sampaikanlah” lebih alami dan tepat secara kontekstual daripada sekadar “berbicaralah.”
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: kepada Firaun
  rationale: Secara harfiah berarti “di telinga Firaun,” sebuah idiom untuk menyampaikan sesuatu agar didengar olehnya. Bentuk idiomatis dipakai dalam teks, sedangkan citra Ibraninya dicatat di catatan kaki.
- source_word: לֵאמֹר
  choice: berkata / ‘
  rationale: Kemunculan pertama terwakili oleh konstruksi “berkata ...”; kemunculan kedua membuka isi pesan yang harus diteruskan. Tanda petik dibiarkan terbuka karena perkataan Yusuf berlanjut ke ayat berikutnya.
