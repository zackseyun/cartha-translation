translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hormat. “Kalangan istana” dipilih agar pembaca memahami bahwa Yusuf berbicara kepada orang-orang dalam lingkungan kerajaan, dan “kalian” mempertahankan bentuk jamak dari sapaan Ibrani. Ayat sengaja berakhir dengan tanda petik terbuka karena pesannya berlanjut dalam Kejadian 50:5.
