  text: So his sons did for him as he had commanded them.
translation:
  language: id
  text: Putra-putranya melakukan baginya sebagaimana yang telah diperintahkannya kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata kerja עשה bermakna luas, ‘melakukan/membuat’. Dalam konteks pelaksanaan pesan pemakaman, ‘melakukan’ menyampaikan tindakan tersebut secara alami tanpa menambahkan objek yang tidak dinyatakan.
- source_word: בָנָיו
  choice: anak-anaknya
  rationale: Dalam bahasa Indonesia, bentuk jamak ‘anak-anaknya’ secara wajar dapat merujuk kepada para putra; konteks narasi menjelaskan bahwa yang dimaksud ialah anak-anak lelaki Yakub.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל di sini menunjukkan tindakan yang dilakukan bagi atau demi Yakub, khususnya pelaksanaan pesan pemakamannya.
- source_word: כֵּן
  choice: seperti
  rationale: כֵּן menandai kesesuaian cara tindakan dengan perintah yang disebut sesudahnya. Dalam susunan Indonesia, maknanya tercakup secara alami dalam konstruksi ‘seperti yang ...’.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Partikel ini memperkenalkan perbandingan dan menunjukkan bahwa tindakan mereka sesuai dengan perintah Yakub.
- source_word: צִוָּם
  choice: telah diperintahkannya kepada mereka
  rationale: צוה berarti ‘memerintahkan’. ‘Telah’ memperjelas bahwa perintah itu mendahului pelaksanaannya, sedangkan akhiran pronominal diterjemahkan dengan ‘kepada mereka’.
