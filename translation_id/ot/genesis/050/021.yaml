base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/021.yaml
  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: id
  text: “Jadi sekarang, janganlah takut. Aku sendiri akan memelihara kalian dan anak-anak kecil kalian.” Demikianlah ia menghibur mereka dan berbicara kepada hati mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “berbicara dengan ramah kepada mereka” atau “berbicara untuk menenteramkan mereka”; secara harfiah, “berbicara kepada hati mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menjaga daya penghubung וְ dan unsur waktu עַתָּה sebagai penanda wacana yang alami dalam bahasa Indonesia.
- source_word: אַל תִּירָאוּ
  choice: janganlah takut
  rationale: Menyampaikan larangan sekaligus peneguhan dengan bentuk yang wajar dan bermartabat.
- source_word: אָנֹכִי
  choice: Aku sendiri
  rationale: Pronomina mandiri bersifat emfatis dan menegaskan komitmen pribadi Yusuf.
- source_word: אֲכַלְכֵּל
  choice: akan memelihara
  rationale: Kata kerja ini menyatakan tindakan menopang dan menyediakan kebutuhan hidup, khususnya makanan; 'memelihara' ringkas dan sesuai dengan konteks perawatan berkelanjutan.
- source_word: טַפְּכֶם
  choice: anak-anak kecil kalian
  rationale: Menjaga nuansa usia dan ketergantungan dalam טַף, bukan sekadar istilah umum untuk anak.
- source_word: וַיְנַחֵם אֹתָם
  choice: Demikianlah ia menghibur mereka
  rationale: Menyampaikan rangkuman naratif tentang dampak perkataan Yusuf serta arti penghiburan dari bentuk piel נחם.
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: dan berbicara kepada hati mereka
  rationale: Mempertahankan citraan idiom Ibrani mengenai perkataan yang lembut dan menenteramkan tanpa membatasi maknanya pada satu parafrasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kekeluargaan dan menenteramkan. Kata ganti 'kalian' dipakai karena sapaan ditujukan kepada beberapa saudara Yusuf; idiom 'berbicara kepada hati mereka' dipertahankan dan dijelaskan dalam catatan kaki.
