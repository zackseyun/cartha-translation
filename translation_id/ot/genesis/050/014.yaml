revisions:
- from: Kemudian Yusuf kembali ke Mesir bersama saudara-saudaranya dan semua orang yang telah pergi naik[a] bersamanya untuk menguburkan ayahnya. Ia kembali setelah menguburkan ayahnya.
  to: Kemudian Yusuf, saudara-saudaranya, dan semua orang yang telah naik[a] bersamanya untuk menguburkan ayahnya kembali ke Mesir setelah ia menguburkan ayahnya.
  rationale: Revisi mengembalikan satu peristiwa kepulangan sebagaimana dalam teks Ibrani dan menautkan “setelah ia menguburkan ayahnya” langsung kepada peristiwa itu. Susunan koordinatif mempertahankan Yusuf, saudara-saudaranya, dan semua pengiring sebagai pihak yang kembali, sementara “ia” pada klausa penutup secara wajar merujuk kepada Yusuf. Pengulangan “ayahnya” dipertahankan sesuai sumber.
