translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan dibagi menjadi dua kalimat agar jelas dan alami, sementara urutan peristiwa, pengulangan “ayahnya”, dan ungkapan Ibrani “pergi naik” tetap dipertahankan.
