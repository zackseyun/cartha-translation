  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: id
  text: Kemudian Yusuf, saudara-saudaranya, dan semua orang yang telah naik[a] bersamanya untuk menguburkan ayahnya kembali ke Mesir setelah ia menguburkan ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua orang yang naik bersamanya.” Dalam Alkitab, “naik” lazim dipakai untuk perjalanan dari Mesir ke Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk naratif dari שׁוב menyatakan tindakan lampau; dalam konteks ini Yusuf kembali ke tempat yang sebelumnya ia tinggalkan.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; bentuk alami dalam bahasa Indonesia ialah “ke Mesir”.
- source_word: הוּא וְאֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Secara harfiah frasa ini berbunyi “dia dan saudara-saudaranya”; “bersama” menghasilkan kalimat Indonesia yang lebih wajar tanpa mengubah siapa saja yang kembali.
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: dan semua orang yang telah pergi naik bersamanya
  rationale: Partisip עֹלִים mempertahankan ungkapan geografis Ibrani “naik” untuk perjalanan dari Mesir ke Kanaan; “telah” menunjukkan bahwa perjalanan itu mendahului kepulangan.
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: untuk menguburkan ayahnya
  rationale: Infinitif dengan ל menyatakan tujuan perjalanan mereka.
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: Ia kembali setelah menguburkan ayahnya
  rationale: אַחֲרֵי menyatakan urutan waktu. Kalimat terpisah menjaga pengulangan “ayahnya” dari teks Ibrani sekaligus menghindari susunan Indonesia yang terlalu berat.
