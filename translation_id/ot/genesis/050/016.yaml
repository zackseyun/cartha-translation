translation:
  language: id
  text: 'Lalu mereka menyampaikan pesan kepada Yusuf[a]: “Ayahmu memberi perintah sebelum ia meninggal:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Lalu mereka memberikan perintah kepada Yusuf.” Kata kerja Ibrani biasanya berarti “memerintahkan”, tetapi di sini tampaknya menunjuk pada penyampaian pesan kepada Yusuf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: mereka menyampaikan pesan
  rationale: Secara leksikal verba ini biasanya berarti 'memerintahkan', tetapi konstruksi dengan אֶל־יוֹסֵף dan kutipan yang menyusul menunjukkan tindakan menyampaikan pesan kepada Yusuf; pilihan ini wajar dalam bahasa Indonesia tanpa menghapus arti harfiahnya, yang dicatat dalam catatan kaki.
- source_word: אֶל־יוֹסֵף
  choice: kepada Yusuf
  rationale: Preposisi menandai Yusuf sebagai penerima pesan; nama tersebut ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: לֵאמֹר (pertama)
  choice: tidak diterjemahkan secara tersendiri
  rationale: Fungsi pengantar ujaran sudah dinyatakan secara alami oleh tanda baca dan kutipan langsung; menerjemahkannya sebagai 'dengan berkata' akan terasa kaku dalam bahasa Indonesia.
- source_word: אָבִיךָ
  choice: Ayahmu
  rationale: Menerjemahkan nomina dengan sufiks posesif orang kedua tunggal secara langsung dan alami.
- source_word: צִוָּה
  choice: memberi perintah
  rationale: Mempertahankan daya leksikal verba צוה dan mengantisipasi isi perintah pada ayat berikutnya.
- source_word: לִפְנֵי מוֹתוֹ
  choice: sebelum ia meninggal
  rationale: Konstruksi ini dipakai secara temporal; bentuk verbal alami dan jelas bagi pembaca Indonesia modern.
- source_word: לֵאמֹר (kedua)
  choice: 'demikian:'
  rationale: Menandai bahwa isi perintah akan dikutip pada ayat berikutnya, sambil mempertahankan fungsi struktur wacana Ibrani dalam ungkapan Indonesia yang alami.
