translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan menghindari pengulangan harfiah 'dengan berkata ... demikian' yang kaku, tetapi mempertahankan dua tingkat pengantar ujaran melalui kutipan langsung dan kata 'demikian:'. Tanda titik dua menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
