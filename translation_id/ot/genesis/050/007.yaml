review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena teks utama menambahkan tujuan eksplisit, “ke Kanaan,” yang tidak disebutkan dalam ayat Ibrani ini. Verba עָלָה (“naik/pergi naik”) dan pengulangannya dipertahankan secara idiomatis melalui “pergi,” sementara nuansa geografisnya dijelaskan dalam catatan kaki.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan naratif. “Bersama Yusuf turut pergi” lebih jelas dan lebih luwes daripada “Bersama dia turut pergi,” tanpa mengubah rujukan pronominal sumber.
  terminology: “Pegawai Firaun” sesuai untuk עַבְדֵי dalam konteks istana tanpa menetapkan status sosial secara berlebihan. “Para tua-tua istana Firaun” dan “semua tua-tua negeri Mesir” mempertahankan זִקְנֵי sebagai kelompok pemimpin senior serta pembedaan antara lingkungan istana dan negeri secara luas.
  issues:
  - severity: medium
    issue: Tambahan “ke Kanaan” dalam teks utama
    rationale: Kanaan adalah tujuan perjalanan yang diketahui dari konteks naratif, tetapi tidak dinyatakan dalam Kejadian 50:7 עצמו. Tambahan tersebut sebaiknya tidak dimasukkan ke dalam teks utama optimal-ekuivalen; penjelasan geografis cukup ditempatkan dalam catatan kaki.
  - severity: low
    issue: Rujukan “Bersama dia” kurang jelas dalam prosa Indonesia
    rationale: Walaupun benar secara makna, “Bersama Yusuf” membuat rujukan eksplisit dan tetap mencerminkan אִתּוֹ (“bersamanya”).
  - severity: low
    issue: “Tua-tua di tanah Mesir” kurang tegas menyatakan hubungan dengan negeri Mesir
    rationale: “Tua-tua negeri Mesir” lebih ringkas dan alami dalam bahasa Indonesia baku, sambil tetap menerjemahkan אֶרֶץ מִצְרַיִם.
  revised_text: Lalu Yusuf pergi untuk menguburkan ayahnya.[a] Bersama Yusuf turut pergi semua pegawai Firaun, para tua-tua istana Firaun, dan semua tua-tua negeri Mesir.
  revised_footnotes:
