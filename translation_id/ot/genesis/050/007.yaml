    text: Secara harfiah, “naik untuk menguburkan ayahnya.” Dalam bahasa Ibrani, “naik” mencerminkan kebiasaan menyebut perjalanan dari Mesir ke Kanaan.
    reason: cultural_note
  revision_rationale: Revisi menghapus tujuan perjalanan yang tidak tersurat dalam ayat, memperjelas rujukan “bersama Yusuf,” dan membakukan ungkapan untuk kedua kelompok tua-tua. Makna, urutan pokok, serta catatan mengenai idiom geografis Ibrani tetap dipertahankan.
