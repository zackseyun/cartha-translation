base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: id
  text: Lalu Yusuf pergi untuk menguburkan ayahnya.[a] Bersama Yusuf turut pergi semua pegawai Firaun, para tua-tua istana Firaun, dan semua tua-tua negeri Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik untuk menguburkan ayahnya.” Dalam bahasa Ibrani, “naik” mencerminkan kebiasaan menyebut perjalanan dari Mesir ke Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi ke Kanaan
  rationale: עָלָה secara harfiah berarti 'naik', tetapi di sini merupakan ungkapan geografis untuk perjalanan dari Mesir ke Kanaan. Dalam bahasa Indonesia modern, 'pergi ke Kanaan' menyampaikan maksudnya secara alami; nuansa harfiahnya dijelaskan dalam catatan kaki.
- source_word: לִקְבֹּר
  choice: untuk menguburkan
  rationale: Infinitif קָבַר secara langsung berarti 'menguburkan'.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Menerjemahkan sufiks posesif secara sederhana tanpa menambahkan penekanan yang tidak terdapat dalam bahasa Ibrani.
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: bersama dia turut pergi
  rationale: Menyatakan penyertaan para pengiring dengan bahasa Indonesia yang alami. Pengulangan verba עָלָה tetap terwakili oleh 'pergi', sedangkan 'turut' menandai bahwa mereka menyertai Yusuf.
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: semua pegawai Firaun
  rationale: עֶבֶד dapat berarti hamba, budak, atau pelayan. Dalam konteks rombongan resmi kerajaan, 'pegawai' secara wajar menunjuk para abdi atau pejabat Firaun tanpa memastikan status sosial mereka lebih jauh daripada konteks.
- source_word: זִקְנֵי בֵיתוֹ
  choice: para tua-tua istananya
  rationale: זָקֵן di sini menunjuk para pemuka senior, bukan sekadar orang lanjut usia. בַּיִת dalam konteks Firaun berarti rumah tangga atau lingkungan istana; akhiran '-nya' merujuk kepada Firaun.
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: dan semua tua-tua di tanah Mesir
  rationale: Mempertahankan istilah kepemimpinan 'tua-tua' serta unsur אֶרֶץ, 'tanah', sehingga kelompok nasional ini tetap dibedakan dari para tua-tua istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Tua-tua' dipertahankan sebagai istilah Alkitab yang masih mudah dipahami untuk para pemimpin senior. Penanda catatan kaki ditempatkan sesudah klausa perjalanan agar menerangkan ungkapan geografis Ibrani.
