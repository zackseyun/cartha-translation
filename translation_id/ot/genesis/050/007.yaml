revisions:
- from: Lalu Yusuf pergi ke Kanaan untuk menguburkan ayahnya.[a] Bersama dia turut pergi semua pegawai Firaun, para tua-tua istananya, dan semua tua-tua di tanah Mesir.
  to: Lalu Yusuf pergi untuk menguburkan ayahnya.[a] Bersama Yusuf turut pergi semua pegawai Firaun, para tua-tua istana Firaun, dan semua tua-tua negeri Mesir.
  rationale: Revisi menghapus tujuan perjalanan yang tidak tersurat dalam ayat, memperjelas rujukan “bersama Yusuf,” dan membakukan ungkapan untuk kedua kelompok tua-tua. Makna, urutan pokok, serta catatan mengenai idiom geografis Ibrani tetap dipertahankan.
