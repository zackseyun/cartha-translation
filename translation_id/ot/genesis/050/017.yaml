  to: 'Beginilah yang harus kalian katakan kepada Yusuf: “Tolong ampuni pelanggaran saudara-saudaramu dan dosa mereka, karena mereka telah berbuat jahat kepadamu. Maka sekarang, tolong ampuni pelanggaran hamba-hamba Allah ayahmu.” Yusuf menangis ketika mereka berbicara kepadanya.'
