base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Yosef: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Yosef wept when they spoke to him.'
translation:
  language: id
  text: 'Beginilah yang harus kalian katakan kepada Yusuf: “Tolong ampuni pelanggaran saudara-saudaramu dan dosa mereka, karena mereka telah berbuat jahat kepadamu. Maka sekarang, tolong ampuni pelanggaran hamba-hamba Allah ayahmu.” Yusuf menangis ketika mereka berbicara kepadanya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: tolong ampuni
  rationale: Secara harfiah berarti ‘angkatlah/tanggunglah, kiranya’, tetapi dalam konteks kesalahan merupakan idiom permohonan pengampunan. ‘Tolong’ menyampaikan partikel permohonan נָא secara wajar.
- source_word: פֶּשַׁע
  choice: pelanggaran
  rationale: Menjaga nuansa tindakan memberontak atau melanggar, serta membedakannya dari חַטָּאת (‘dosa’).
- source_word: חַטָּאתָם
  choice: dosa mereka
  rationale: Padanan langsung dan alami yang mempertahankan pasangan istilah ‘pelanggaran’ dan ‘dosa’.
- source_word: רָעָה גְמָלוּךָ
  choice: mereka telah berbuat jahat kepadamu
  rationale: Ungkapan Ibrani secara harfiah dapat berarti ‘mereka membalas/memperlakukan engkau dengan kejahatan’; pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan adanya kebaikan Yusuf yang secara khusus sedang dibalas.
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: hamba-hamba Allah ayahmu
  rationale: Mempertahankan identifikasi saudara-saudara itu berdasarkan pengabdian mereka kepada Allah yang disembah ayah Yusuf.
- source_word: בְּדַבְּרָם אֵלָיו
  choice: ketika mereka menyampaikan perkataan itu kepadanya
  rationale: Bentuk infinitif dengan subjek jamak berarti ‘ketika mereka berbicara kepadanya’; ‘menyampaikan perkataan itu’ memperjelas bahwa pesan tersebut disampaikan tanpa menentukan apakah langsung atau melalui utusan.
theological_decisions:
- issue: Hubungan antara kejahatan saudara-saudara Yusuf dan permohonan pengampunan
  choice: karena mereka telah berbuat jahat kepadamu
  alternative: meskipun mereka telah berbuat jahat kepadamu
  rationale: כִּי paling langsung menyatakan alasan (‘karena’). Terjemahan tidak mengubahnya menjadi hubungan konsesif yang tidak dinyatakan secara eksplisit.
- issue: Identitas ‘hamba-hamba Allah ayahmu’
  choice: dipertahankan sebagai sebutan diri saudara-saudara Yusuf
  alternative: hamba-hamba Allah ayah kita
  rationale: Teks sumber memakai ‘ayahmu’, yang secara retoris mengingatkan Yusuf pada iman ayahnya; bentuk ini dipertahankan tanpa harmonisasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak ‘kalian’ dipakai karena perintah pembuka ditujukan kepada beberapa orang. Nama יוֹסֵף ditulis ‘Yusuf’, bentuk yang lazim dan mudah dipahami pembaca Indonesia. Tanda kutip membedakan pesan yang harus disampaikan dari narasi.
