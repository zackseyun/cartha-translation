id: GEN.50.10
reference: Genesis 50:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: id
  text: Ketika mereka sampai di tempat pengirikan Atad[a], yang terletak di seberang Sungai Yordan[b], mereka meratap di sana dengan ratapan yang sangat hebat dan memilukan[c]. Yusuf mengadakan perkabungan bagi ayahnya selama tujuh hari[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Atad mungkin berkaitan dengan kata yang berarti “semak berduri”, tetapi di sini berfungsi sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “di sisi lain Sungai Yordan”. Ungkapan Ibraninya tidak dengan sendirinya menentukan sisi mana yang dimaksud.
    reason: alternative_reading
  - marker: c
    text: 'Secara lebih harfiah: “dengan ratapan yang besar dan sangat berat”; ungkapan ini menyatakan perkabungan yang sangat mendalam.'
    reason: cultural_note
  - marker: d
    text: Kata kerja Ibraninya berbentuk tunggal, sehingga kemungkinan besar menunjuk khusus kepada Yusuf. Sejumlah terjemahan mengikuti konteks sebelumnya dan memakai bentuk jamak, “mereka”.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: tempat pengirikan
  rationale: Istilah ini menunjuk pada lokasi pertanian untuk mengirik hasil panen. 'Tempat pengirikan' lebih alami dalam bahasa Indonesia modern daripada 'lantai pengirikan'.
- source_word: הָאָטָד
  choice: Atad
  rationale: Dalam gabungan גֹּרֶן הָאָטָד, kata ini berfungsi sebagai nama tempat; makna leksikalnya dicatat dalam catatan kaki.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini mempertahankan ketidakpastian sudut pandang geografis dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וַיִּסְפְּדוּ
  choice: mereka meratap
  rationale: Kata kerja ספד mengacu pada ratapan, khususnya ratapan publik dalam konteks kematian.
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: dengan ratapan yang sangat hebat dan memilukan
  rationale: '''Sangat hebat'' menyampaikan intensitas גָּדוֹל ... מְאֹד, sedangkan ''memilukan'' mengungkapkan bobot atau kedahsyatan כָבֵד secara alami dalam konteks dukacita.'
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: mengadakan perkabungan
  rationale: Gabungan עשה dan אֵבֶל secara idiomatis berarti menjalankan atau mengadakan masa perkabungan, bukan sekadar 'membuat' dukacita.
- source_word: לְאָבִיו
  choice: bagi ayahnya
  rationale: Akhiran tunggal maskulin dipertahankan dan, dalam konteks, mengacu pada ayah Yusuf.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Preposisi 'selama' menyatakan durasi secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek kata kerja tunggal וַיַּעַשׂ setelah rangkaian kata kerja jamak
  choice: Yusuf mengadakan perkabungan
  alternative: mereka mengadakan perkabungan
  rationale: Teks Masoret beralih dari bentuk jamak ('mereka sampai', 'mereka meratap') kepada bentuk tunggal ('ia mengadakan'). Menyebut Yusuf mempertahankan perubahan bilangan itu sekaligus memperjelas rujukan pronomina tanpa mengubah makna yang paling mungkin.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah 'perk مضourning' formal but accessible; place designation uses 'Sungai Yordan' for natural Indonesian usage. The singular Hebrew subject is made explicit as 'Yusuf' to avoid an ambiguous Indonesian pronoun while preserving the grammatical shift.
