translation:
  language: id
  text: Yusuf tetap tinggal di Mesir[a] bersama seisi rumah ayahnya. Yusuf hidup sampai usia 110 tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap di Mesir, ia dan seisi rumah ayahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tetap tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, tinggal, atau menetap. Dalam ringkasan naratif sesudah kematian Yakub, “tetap tinggal” secara alami menyatakan keberlanjutan tempat tinggal Yusuf di Mesir.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Frasa lokatif yang secara langsung menunjukkan tempat tinggal Yusuf.
- source_word: הוּא וּבֵית אָבִיו
  choice: bersama keluarga besar ayahnya
  rationale: Secara harfiah frasa ini berbunyi “dia dan rumah ayahnya”, tetapi בֵּית di sini menunjuk pada seisi rumah atau kelompok keluarga, bukan bangunan. “Bersama keluarga besar ayahnya” alami dalam bahasa Indonesia dan mempertahankan cakupan sosial yang lebih luas daripada keluarga inti.
- source_word: וַיְחִי
  choice: hidup sampai berumur
  rationale: Kata חיה memperkenalkan jumlah seluruh usia Yusuf. Ungkapan “hidup sampai berumur” merupakan bentuk Indonesia yang alami untuk pernyataan usia dan menghindari kesan bahwa ia tinggal di Mesir selama tepat 110 tahun.
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 110 tahun
  rationale: Mempertahankan nilai usia secara tepat dengan angka demi keterbacaan modern.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
