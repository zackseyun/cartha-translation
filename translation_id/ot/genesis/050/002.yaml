  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: id
  text: Kemudian Yusuf memerintahkan hamba-hambanya, yaitu para tabib, untuk membalsam ayahnya.[a] Lalu para tabib itu membalsam Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak-budaknya”; kata Ibrani ini dapat berarti hamba atau budak, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Israel,” yaitu Yakub, ayah Yusuf.'
    reason: referent_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah dengan kewenangan; “memerintahkan” mempertahankan daya tersebut secara wajar dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: yang menjadi hambanya
  rationale: עבד dapat berarti hamba atau budak. Dalam konteks ini mereka adalah personel di bawah wewenang Yusuf dan selanjutnya diidentifikasi sebagai tabib; “hamba” mempertahankan hubungan subordinasi tanpa memastikan status hukum mereka.
- source_word: הָרֹפְאִים
  choice: para tabib
  rationale: Bentuk partisipel dari רפא menunjuk kepada orang-orang yang melakukan pengobatan. “Tabib” sesuai dengan latar istana Mesir kuno dan tetap mudah dipahami.
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: untuk membalsam / membalsam
  rationale: Dalam konteks pemakaman Mesir, חנט menunjuk pada pengawetan jenazah. “Membalsam” adalah padanan Indonesia yang tepat dan menjaga pengulangan kata kerja sumber.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Padanan langsung dan alami bagi bentuk nomina dengan akhiran posesif tersebut.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani secara eksplisit memakai nama Israel, bukan Yakub; pilihan nama itu dipertahankan.
theological_decisions:
- issue: Makna עבד dalam lingkungan rumah tangga atau istana
  choice: hamba
  alternative: budak
  rationale: Ayat ini menyoroti fungsi mereka sebagai tabib di bawah kewenangan Yusuf, bukan status hukum mereka. “Hamba” menjaga cakupan makna sumber, sedangkan catatan kaki mempertahankan kemungkinan “budak”.
- issue: Pergantian sebutan dari “ayahnya” kepada “Israel”
  choice: Mempertahankan “Israel” dalam teks utama
  alternative: Yakub
  rationale: Nama Israel merupakan pilihan eksplisit teks sumber dan tidak boleh diselaraskan secara diam-diam menjadi Yakub; catatan menjelaskan identitas tokoh tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “para tabib yang menjadi hambanya” memperjelas bahwa para tabib merupakan aposisi bagi para hamba Yusuf, sementara dua kalimat menjaga alur narasi dan pengulangan verba Ibrani.
