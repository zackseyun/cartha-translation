base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: id
  text: Yusuf melihat keturunan Efraim sampai generasi ketiga.[a] Anak-anak Makhir, putra Manasye, juga dilahirkan di atas lutut Yusuf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yusuf hidup cukup lama untuk melihat keturunan Efraim sampai generasi ketiga.” Secara harfiah, teks Ibrani berbunyi “Yusuf melihat.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “dilahirkan di atas lutut Yusuf” adalah idiom Ibrani yang dapat menyiratkan pengakuan dalam keluarga, penerimaan, atau penerimaan khusus atas anak-anak itu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Menerjemahkan verba Ibrani secara langsung sambil tetap wajar dalam konteks Yusuf yang hidup cukup lama untuk menyaksikan keturunannya.
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: keturunan Efraim sampai generasi ketiga
  rationale: לְ menunjukkan hubungan garis keturunan, sedangkan בְּנֵי שִׁלֵּשִׁים menyatakan keturunan hingga generasi ketiga tanpa menetapkan hubungan keluarga yang lebih khusus daripada teks.
- source_word: גַּם
  choice: juga
  rationale: Menandai tambahan yang sejajar dengan pernyataan sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: Anak-anak Makhir, anak Manasye
  rationale: בְּנֵי diterjemahkan secara luas sebagai 'anak-anak', sedangkan frasa berikutnya mengidentifikasi Makhir sebagai anak Manasye.
- source_word: יֻלְּדוּ
  choice: dilahirkan
  rationale: Bentuk pasif dari ילד secara langsung berarti 'dilahirkan'.
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: di atas lutut Yusuf
  rationale: Mempertahankan gambaran konkret dan ambiguitas ungkapan budaya Ibrani tanpa menggantinya dengan satu tafsiran tertentu.
