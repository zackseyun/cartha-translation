  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Istilah 'keturunan' dipakai pada klausa pertama agar cakupan generasional jelas, sementara idiom 'di atas lutut Yusuf' dipertahankan dan dijelaskan dalam catatan kaki.
