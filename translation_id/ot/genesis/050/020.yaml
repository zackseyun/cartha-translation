source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: id
  text: Kalian merencanakan kejahatan terhadapku, tetapi Allah merencanakannya untuk kebaikan, untuk menghasilkan keadaan seperti yang ada sekarang ini[a]—yakni, memelihara hidup banyak orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk melakukan seperti pada hari ini.” Ungkapan Ibrani ini menunjuk pada keadaan atau hasil yang sekarang tampak nyata.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: merencanakan / merencanakannya
  rationale: Kedua bentuk berasal dari verba yang sama dan menyatakan maksud atau rancangan yang diarahkan pada suatu hasil. Pemakaian verba Indonesia yang sama mempertahankan kesejajaran yang disengaja antara rancangan saudara-saudara Yusuf dan rancangan Allah.
- source_word: עָלַי
  choice: terhadapku
  rationale: Dalam gabungan dengan verba חשב dan maksud yang bermusuhan, preposisi ini berdaya adversatif; 'terhadapku' menyampaikan arah permusuhan itu secara alami.
- source_word: רָעָה
  choice: kejahatan
  rationale: Konteksnya mencakup kesalahan moral saudara-saudara Yusuf, bukan hanya kerugian atau kemalangan, sehingga 'kejahatan' mempertahankan bobot moralnya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Nomina ini bermakna tunggal dalam konteks ini dan menunjuk kepada Allah yang berkarya dalam pemeliharaan-Nya.
- source_word: לְטֹבָה
  choice: untuk kebaikan
  rationale: Terjemahan ini mempertahankan pertentangan langsung antara רָעָה dan טֹבָה serta terdengar wajar dalam bahasa Indonesia.
- source_word: לְמַעַן
  choice: untuk
  rationale: Preposisi ini memperkenalkan tujuan; 'untuk' mengungkapkan hubungan tujuan dengan ringkas dan jelas.
- source_word: עֲשֹׂה כַּיּוֹם הַזֶּה
  choice: mewujudkan apa yang terjadi pada hari ini
  rationale: עשה di sini menunjuk pada pengadaan suatu hasil nyata, sedangkan idiom כַּיּוֹם הַזֶּה menunjuk pada keadaan sekarang yang dapat disaksikan. Terjemahan ini mengungkapkan keduanya tanpa mempertahankan susunan Ibrani yang kaku.
- source_word: לְהַחֲיוֹת
  choice: menjaga ... tetap hidup
  rationale: Bentuk Hifil dari חיה berarti mempertahankan atau memelihara kehidupan. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַם רָב
  choice: banyak orang
  rationale: Frasa ini menunjuk pada sejumlah besar manusia yang dipertahankan hidupnya; 'banyak orang' alami dan tidak memaksakan pengertian satu kelompok etnis tertentu.
theological_decisions:
- issue: Pemeliharaan ilahi dan kejahatan manusia dalam dua pemakaian sejajar verba חשב
  choice: Memakai verba inti yang sama, 'merencanakan', bagi saudara-saudara Yusuf dan Allah
  alternative: Memakai verba berbeda, misalnya 'berniat' bagi manusia dan 'mengubah' bagi Allah
  rationale: Teks Ibrani dengan sengaja menyejajarkan rancangan jahat manusia dengan rancangan baik Allah. Verba yang sama mempertahankan ketegangan ini tanpa menyatakan bahwa Allah melakukan kejahatan moral dengan cara yang sama seperti saudara-saudara Yusuf.
- issue: Makna moral atau sekadar merugikan dari רָעָה
  choice: kejahatan
  alternative: hal buruk; mencelakakan
  rationale: Tindakan saudara-saudara Yusuf bersifat tercela secara moral. 'Kejahatan' mempertahankan dimensi itu dan membentuk pertentangan yang kuat dengan 'kebaikan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa Yusuf berbicara kepada saudara-saudaranya; bentuk terikat '-ku' menjaga kelancaran. Tanda koma dan frasa 'yaitu' memperlihatkan bahwa menjaga banyak orang tetap hidup menjelaskan hasil yang dimaksud.
