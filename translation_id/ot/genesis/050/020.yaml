  to: Kalian merencanakan kejahatan terhadapku, tetapi Allah merencanakannya untuk kebaikan, untuk menghasilkan keadaan seperti yang ada sekarang ini[a]—yakni, memelihara hidup banyak orang.
  rationale: Revisi mengganti bagian yang kurang jelas dengan “menghasilkan keadaan seperti yang ada sekarang ini,” yang menyampaikan fungsi עֲשׂוֹת sebagai pengadaan hasil dan daya tunjuk כַּיּוֹם הַזֶּה pada keadaan kini. “Yakni” dengan tanda pisah menandai bahwa pemeliharaan hidup banyak orang menjelaskan hasil tersebut. Selebihnya dipertahankan, khususnya paralelisme “merencanakan.”
