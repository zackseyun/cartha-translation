  terminology: “Allah,” “kejahatan,” dan “kebaikan” sesuai register Alkitab bahasa Indonesia modern. Pemakaian verba yang sama, “merencanakan,” untuk manusia dan Allah patut dipertahankan karena mencerminkan paralelisme teks Ibrani tanpa menafsirkan ketegangan teologisnya.
