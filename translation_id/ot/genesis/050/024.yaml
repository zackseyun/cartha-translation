  to: Lalu Yusuf berkata kepada saudara-saudaranya, “Aku akan mati, tetapi Allah pasti akan memperhatikan kalian[a] dan membawa kalian naik dari tanah ini ke tanah yang telah Dia janjikan dengan sumpah kepada Abraham, kepada Ishak, dan kepada Yakub.”
  rationale: Revisi memulihkan nuansa “membawa naik” dalam וְהֶעֱלָה dan memakai “tanah” untuk הארץ. Klausa mengenai sumpah disusun ulang agar hubungan antara janji yang diteguhkan sumpah dan para leluhur jelas dalam bahasa Indonesia, tanpa memasukkan rincian “untuk diberikan” yang tidak diucapkan secara eksplisit dalam ayat ini. Penanda dan isi catatan kaki dipertahankan serta tetap melekat pada “memperhatikan kalian.”
