  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: id
  text: Lalu Yusuf berkata kepada saudara-saudaranya, “Aku akan mati, tetapi Allah pasti akan memperhatikan kalian[a] dan membawa kalian naik dari tanah ini ke tanah yang telah Dia janjikan dengan sumpah kepada Abraham, kepada Ishak, dan kepada Yakub.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “pasti akan mengunjungi kalian.” Ungkapan Ibrani ini dapat menunjukkan bahwa Allah memberikan perhatian yang menentukan dan bertindak demi umat-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk jamak maskulin dengan akhiran orang ketiga tunggal maskulin ini dalam konteks Kejadian merujuk secara khusus kepada saudara-saudara laki-laki Yusuf; dalam bahasa Indonesia, konteks naratif menjernihkan rujukannya.
- source_word: אָנֹכִי מֵת
  choice: Aku akan mati
  rationale: Konstruksi dengan partisip menyatakan kematian Yusuf yang sudah dekat. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyatakan bahwa ia telah mati.
- source_word: פָּקֹד יִפְקֹד
  choice: pasti akan memperhatikan kalian
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama memberi penegasan kuat. 'Memperhatikan' mempertahankan keluasan makna פקד, yakni perhatian Allah yang nyata dan mengarah pada tindakan, tanpa membatasinya menjadi kunjungan fisik.
- source_word: וֵאלֹהִים
  choice: tetapi Allah
  rationale: 'Walaupun ו secara dasar berarti ''dan'', hubungan wacana di sini bersifat kontras: Yusuf akan mati, tetapi Allah tetap akan bertindak.'
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: dan membawa kalian keluar
  rationale: Hifil עלה secara harfiah berarti 'membawa naik'. Dalam bahasa Indonesia, 'membawa keluar' lebih alami untuk perpindahan dari Mesir, sementara arah tujuan tetap dinyatakan sesudahnya. Nuansa harfiahnya dicatat sebagai alternatif.
- source_word: מִן הָאָרֶץ הַזֹּאת
  choice: dari negeri ini
  rationale: Terjemahan langsung yang merujuk kepada Mesir dari sudut pandang Yusuf.
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: menuju negeri yang telah dijanjikan-Nya dengan sumpah
  rationale: Verba נִשְׁבַּע secara eksplisit berarti 'bersumpah'. Bahasa Indonesia memerlukan pelengkap yang lebih jelas; ungkapan ini menyampaikan bahwa negeri itu menjadi isi janji yang diteguhkan dengan sumpah tanpa menambahkan secara eksplisit verba 'memberikan'.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, kepada Ishak, dan kepada Yakub
  rationale: Pengulangan 'kepada' mencerminkan pengulangan preposisi Ibrani dan mempertahankan corak khidmat rumusan para leluhur.
theological_decisions:
- issue: Sifat tindakan Allah dalam פָּקֹד יִפְקֹד
  choice: Allah pasti akan memperhatikan umat-Nya dengan perhatian yang nyata dan mengarah pada tindakan
  alternative: Allah pasti akan mengunjungi kalian; Allah pasti akan datang menolong kalian
  rationale: Konstruksi Ibrani menegaskan kepastian tindakan Allah. Terjemahan utama mempertahankan keluasan makna פקד dan tidak mempersempitnya menjadi kunjungan fisik atau langsung menentukan bentuk pertolongan-Nya.
- issue: Isi sumpah mengenai negeri
  choice: negeri yang telah dijanjikan-Nya dengan sumpah
  alternative: negeri yang telah disumpahkan-Nya; negeri yang telah dijanjikan-Nya untuk diberikan
  rationale: Teks menyebut tindakan bersumpah tetapi tidak mengungkapkan verba 'memberikan'. Pilihan ini membuat hubungan sintaksis alami dalam bahasa Indonesia sambil tidak menambahkan rincian pemberian secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Kalian' dipakai karena sapaan ditujukan kepada kelompok saudara Yusuf. Pengulangan 'kepada' mempertahankan kesungguhan formula leluhur.
