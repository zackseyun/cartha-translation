source:
  edition: WLC
  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: id
  text: Ketika penduduk negeri itu, yakni orang-orang Kanaan, melihat perkabungan di tempat pengirikan Atad, mereka berkata, “Ini perkabungan yang berat bagi orang Mesir.” Oleh sebab itu, tempat itu dinamai Abel-Mizraim[a], yang terletak di seberang Sungai Yordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abel-Mizraim berarti “perkabungan Mesir”; nama ini mencerminkan sebutan orang-orang Kanaan atas peristiwa tersebut.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di seberang Sungai Yordan” dapat menunjuk ke sisi mana pun yang dipandang sebagai sisi lain; arahnya bergantung pada sudut pandang geografis penutur.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: penduduk negeri itu, yakni orang-orang Kanaan
  rationale: Bentuk partisip tunggal יוֹשֵׁב dipahami secara kolektif. Frasa הַכְּנַעֲנִי dipertahankan sebagai keterangan aposisional yang mengidentifikasi para penduduk itu sebagai orang Kanaan.
- source_word: הָאֵבֶל
  choice: perkabungan
  rationale: אֵבֶל menunjuk pada duka dan ritus berkabung karena kematian. 'Perkabungan' sesuai dengan konteks pemakaman dan mendukung permainan kata dengan nama Abel-Mizraim.
- source_word: בְּגֹרֶן הָאָטָד
  choice: di tempat pengirikan Atad
  rationale: גֹּרֶן adalah tempat atau lantai pengirikan; preposisi בְּ menyatakan lokasi. Bentuk ini alami dalam bahasa Indonesia tanpa mengubah Atad sebagai nama tempat.
- source_word: אֵבֶל כָּבֵד
  choice: perkabungan yang berat
  rationale: כָּבֵד secara harfiah berarti 'berat' dan di sini menyatakan hebatnya perkabungan. Ungkapan ini tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: לְמִצְרָיִם
  choice: bagi orang Mesir
  rationale: Nama tempat 'Mesir' di sini secara kontekstual merujuk pada rombongan orang Mesir yang berkabung. 'Bagi orang Mesir' menyampaikan hubungan tersebut secara idiomatis.
- source_word: עַל כֵּן קָרָא שְׁמָהּ
  choice: Oleh sebab itu, tempat itu dinamai
  rationale: Ungkapan ini memperkenalkan penjelasan asal nama. Bentuk pasif tidak menambahkan pelaku yang tidak disebutkan, sedangkan 'tempat itu' memperjelas rujukan pronominal dalam bahasa Indonesia.
- source_word: אָבֵל מִצְרַיִם
  choice: Abel-Mizraim
  rationale: Nama tempat ditransliterasikan agar tetap berfungsi sebagai nama diri; arti dan permainan katanya dijelaskan dalam catatan kaki.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan tersebut berarti di sisi lain atau seberang Yordan, dengan arah yang bergantung pada sudut pandang geografis. 'Sungai Yordan' memperjelas nama geografis bagi pembaca modern.
