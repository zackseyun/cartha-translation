translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif dengan partikel -lah sesuai dengan izin resmi Firaun. Rujukan “-nya” jelas menunjuk kepada ayah Yusuf dari konteks langsung.
