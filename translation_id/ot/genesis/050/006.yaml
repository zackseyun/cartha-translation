translation:
  language: id
  text: Lalu Firaun berkata, “Pergilah ke sana dan kuburkanlah ayahmu, sebagaimana ayahmu telah membuatmu bersumpah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan kesinambungan naratif secara alami dalam bahasa Indonesia tanpa memberi penekanan kausal.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: עֲלֵה
  choice: Pergilah ke sana
  rationale: Secara harfiah berarti “naiklah/pergilah naik.” Dalam konteks perjalanan dari Mesir ke Kanaan, bahasa Indonesia lebih alami memakai “pergilah ke sana”; arah tujuan dipertahankan tanpa ungkapan “naik” yang dapat terdengar janggal atau disalahpahami secara geografis.
- source_word: וּקְבֹר אֶת אָבִיךָ
  choice: dan kuburkanlah ayahmu
  rationale: Menyampaikan kedua imperatif Ibrani serta objek langsungnya secara lugas dan wajar.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Menandai kesesuaian tindakan yang diizinkan Firaun dengan sumpah yang sebelumnya diminta oleh ayah Yusuf.
- source_word: הִשְׁבִּיעֶךָ
  choice: telah dimintanya dengan sumpah darimu
  rationale: Bentuk Hifil menyatakan bahwa ayah Yusuf menyebabkan atau meminta Yusuf bersumpah. Ungkapan ini mempertahankan daya kausatif tanpa kesan pemaksaan yang dapat timbul dari “memaksamu bersumpah.”
