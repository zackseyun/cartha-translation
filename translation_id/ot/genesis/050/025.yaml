  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: id
  text: Lalu Yusuf menyuruh keturunan Israel bersumpah, katanya, “Allah pasti akan memperhatikan kalian, dan kalian harus membawa tulang-tulangku dari sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע ... אֶת
  choice: menyuruh ... bersumpah
  rationale: Bentuk kausatif dengan objek orang berarti membuat atau menyuruh mereka mengucapkan sumpah; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut merujuk kepada komunitas Israel, bukan hanya putra-putra langsung Yakub.
- source_word: פָּקֹד יִפְקֹד
  choice: pasti akan memperhatikan
  rationale: Gabungan infinitif absolut dan verba berhingga memberi penegasan kepastian; 'memperhatikan' mempertahankan cakupan makna tindakan ilahi tanpa membatasinya pada sekadar kunjungan fisik.
- source_word: וְהַעֲלִתֶם
  choice: kalian harus membawa ... dari sini
  rationale: Secara harfiah berarti 'membawa naik'; dalam konteks sumpah bentuk ini menyatakan kewajiban, sedangkan 'dari sini' sudah menunjukkan perpindahan keluar dari Mesir.
- source_word: עַצְמֹתַי
  choice: tulang-tulangku
  rationale: Bentuk jamak dengan sufiks orang pertama diterjemahkan langsung dan alami.
theological_decisions:
- issue: Makna tindakan Allah dalam פָּקֹד יִפְקֹד
  choice: Allah pasti akan memperhatikan kalian
  alternative: Allah pasti akan mengunjungi kalian
  rationale: Kata פקד dapat mencakup perhatian Allah yang diwujudkan dalam tindakan. Pilihan ini menjaga keluasan makna dan selaras dengan konteks pembebasan yang dijanjikan tanpa menjelaskan caranya secara berlebihan.
- issue: Daya wajib dari sumpah dalam וְהַעֲלִתֶם
  choice: kalian harus membawa
  alternative: kalian akan membawa
  rationale: Karena ucapan ini menjadi isi sumpah yang Yusuf tuntut, terjemahan berkewajiban lebih tepat daripada prediksi netral.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' memperjelas bahwa sapaan ditujukan kepada komunitas Israel. Frasa 'Pada waktu itu' mengungkap hubungan tindakan membawa tulang-tulang Yusuf dengan saat Allah memperhatikan Israel, yang tersirat oleh rangkaian klausa Ibrani.
