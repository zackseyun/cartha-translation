  text: וַ/יִּשְׂא֨וּ אֹת֤/וֹ בָנָי/ו֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יִּקְבְּר֣וּ אֹת֔/וֹ בִּ/מְעָרַ֖ת שְׂדֵ֣ה הַ/מַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת הַ/שָּׂדֶ֜ה לַ/אֲחֻזַּת קֶ֗בֶר מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י עַל פְּנֵ֥י מַמְרֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: id
  text: Putra-putranya membawa jenazahnya ke tanah Kanaan dan menguburkannya di gua di ladang Makhpela, yakni ladang yang telah dibeli Abraham dari Efron, orang Het, sebagai tanah milik untuk pemakaman dan yang berhadapan dengan Mamre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: di depan Mamre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: membawa jenazahnya
  rationale: Kata נשׂא menyatakan tindakan membawa tubuh Yakub. Dalam konteks pemakaman, “membawa jenazahnya” alami dalam bahasa Indonesia dan memperjelas rujukan pronomina tanpa mengubah maksud.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk Ibrani secara eksplisit berarti anak-anak laki-laki atau para putra. Pilihan ini mempertahankan penandaan gender tanpa memakai “putra-putranya” yang dapat terdengar terlalu resmi.
- source_word: אַרְצָה כְּנַעַן
  choice: ke tanah Kanaan
  rationale: Akhiran penunjuk arah dan kata אֶרֶץ terwakili secara langsung oleh “ke tanah Kanaan”.
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: di gua di ladang Makhpela
  rationale: Rangkaian konstruksi menyatakan gua yang berada pada ladang Makhpela. Pengulangan “di” menghasilkan bahasa Indonesia yang lebih alami daripada “gua ladang Makhpela”.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: yaitu ladang yang telah dibeli Abraham
  rationale: Bahasa Ibrani memakai konstruksi relatif dengan objek resumtif “ladang itu”. Bentuk appositif ini jelas menunjukkan bahwa ladanglah yang dibeli dan menghindari kesan keliru bahwa ladang dipakai sebagai alat pembayaran.
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: untuk dijadikan tanah milik sebagai tempat pemakaman
  rationale: אֲחֻזָּה menunjuk milik atau kepunyaan tetap, sedangkan קֶבֶר menyatakan fungsi pemakaman. Terjemahan ini mempertahankan kedua unsur tersebut.
- source_word: עֶפְרֹן הַחִתִּי
  choice: Efron, orang Het
  rationale: “Efron” dan “orang Het” merupakan bentuk nama dan sebutan etnis yang mapan serta mudah dipahami dalam bahasa Indonesia.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: berhadapan dengan Mamre
  rationale: Frasa ini menunjukkan letak relatif di depan atau berhadapan dengan Mamre, bukan sekadar kedekatan.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Kalimat kedua dipakai untuk mencegah rangkaian klausa relatif yang berat serta memperjelas bahwa keterangan lokasi mengacu pada ladang Makhpela. Penanda catatan kaki [a] dicantumkan langsung setelah frasa yang dijelaskan.
