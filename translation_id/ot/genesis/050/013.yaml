  to: Putra-putranya membawa jenazahnya ke tanah Kanaan dan menguburkannya di gua di ladang Makhpela, yakni ladang yang telah dibeli Abraham dari Efron, orang Het, sebagai tanah milik untuk pemakaman dan yang berhadapan dengan Mamre.[a]
