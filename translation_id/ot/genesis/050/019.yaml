  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: id
  text: Namun, Yusuf berkata kepada mereka, “Jangan takut, sebab apakah aku ini menempati kedudukan Allah?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah aku berada di bawah Allah?” Ungkapan Ibraninya bersifat idiomatis; dalam konteks ini, kemungkinan besar artinya “apakah aku menempati kedudukan Allah?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara alami diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל dengan sufiks pronominal menunjukkan orang-orang yang menjadi lawan bicara Yusuf.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Nama pribadi ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: אַל תִּירָאוּ
  choice: Jangan takut
  rationale: Konstruksi larangan dengan ירא ditujukan langsung kepada saudara-saudara Yusuf; “Jangan takut” ringkas, wajar, dan mempertahankan bentuk perintah.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi peneguhan Yusuf; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: הֲתַחַת
  choice: apakah ... menempati kedudukan
  rationale: Dalam konteks ini, תַּחַת paling mungkin menyatakan penggantian atau pengambilan peran. “Menempati kedudukan” menyampaikan makna idiomatis itu secara alami tanpa memberi kesan lokasi fisik.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, konteksnya merujuk kepada Allah yang esa; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: אָנִי
  choice: aku ini
  rationale: Pronomina mandiri memberi penekanan dalam pertanyaan retoris; “aku ini” mempertahankan penekanan tersebut secara wajar.
theological_decisions:
- issue: Daya pertanyaan retoris Yusuf mengenai hak prerogatif ilahi
  choice: Yusuf menyangkal bahwa ia menempati kedudukan Allah sebagai hakim atau pembalas.
  alternative: Yusuf bertanya apakah dirinya berada di bawah Allah.
  rationale: Dalam konteks ketakutan saudara-saudaranya akan pembalasan, ungkapan תַּחַת אֱלֹהִים paling mungkin berarti “menempati kedudukan Allah.” Terjemahan ini mempertahankan pembedaan antara peran Allah dan manusia tanpa menambahkan klaim doktrinal di luar teks; kemungkinan makna lain tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menandai tanggapan Yusuf terhadap ketakutan saudara-saudaranya; “aku” sesuai dengan tuturan langsung dalam hubungan keluarga, sedangkan susunan pertanyaan retoris mempertahankan ketegangan dan penekanan teks Ibrani.
