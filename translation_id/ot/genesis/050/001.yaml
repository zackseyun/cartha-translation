  text: Then Joseph fell on his father's face and wept over him and kissed him[a].
translation:
  language: id
  text: Lalu Yusuf merebahkan dirinya di atas wajah ayahnya, menangisinya, dan menciumnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu Yusuf jatuh di atas wajah ayahnya, menangis di atasnya, dan menciumnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: merebahkan diri
  rationale: Bentuk wayyiqtol dari נפל menyatakan tindakan lampau berurutan. Dalam konteks Yusuf mendekati jenazah ayahnya, 'merebahkan diri' menyampaikan gerakan fisik dengan alami tanpa menyiratkan bahwa ia jatuh secara tidak sengaja.
- source_word: עַל פְּנֵי אָבִיו
  choice: pada wajah ayahnya
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada 'wajah ayahnya'. Pemilihan ini mempertahankan gambaran fisik yang konkret dan tidak mengubahnya menjadi ungkapan yang lebih umum seperti 'di atas tubuh ayahnya'.
- source_word: וַיֵּבְךְּ עָלָיו
  choice: menangisinya
  rationale: בכה berarti menangis atau meratap; konstruksi dengan עַל di sini menyatakan tangisan duka atas ayahnya. 'Menangisinya' alami dalam bahasa Indonesia dan sesuai dengan suasana khidmat.
- source_word: וַיִּשַּׁק לוֹ
  choice: menciumnya
  rationale: נשק dalam bentuk Qal berarti 'mencium'. Pronomina Indonesia menyampaikan objeknya secara langsung dan alami.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
