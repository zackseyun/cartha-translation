  to: Ketika saudara-saudara Yusuf melihat bahwa ayah mereka telah meninggal, mereka berkata, “Bagaimana jika Yusuf membenci kita dan benar-benar membalas kita atas semua kejahatan yang telah kita lakukan kepadanya?”
