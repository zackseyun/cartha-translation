  text: וַ/יִּרְא֤וּ אֲחֵֽי יוֹסֵף֙ כִּי מֵ֣ת אֲבִי/הֶ֔ם וַ/יֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖/נוּ יוֹסֵ֑ף וְ/הָשֵׁ֤ב יָשִׁיב֙ לָ֔/נוּ אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: id
  text: Ketika saudara-saudara Yusuf melihat bahwa ayah mereka telah meninggal, mereka berkata, “Bagaimana jika Yusuf membenci kita dan benar-benar membalas kita atas semua kejahatan yang telah kita lakukan kepadanya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ל֥וּ
  choice: Bagaimana jika
  rationale: Partikel ini memperkenalkan kemungkinan yang dicemaskan; dalam konteks ini, bentuk pertanyaan ‘Bagaimana jika’ menyampaikan kekhawatiran para saudara secara alami.
- source_word: יִשְׂטְמֵ֖נוּ
  choice: membenci kita
  rationale: Kata kerja ini menyatakan permusuhan atau kebencian yang dipendam; ‘membenci’ jelas dan sesuai konteks.
- source_word: וְהָשֵׁ֤ב יָשִׁיב֙
  choice: dan membalas sepenuhnya
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan kuat pada tindakan membalas; ‘sepenuhnya’ mempertahankan intensitas itu dalam bahasa Indonesia.
- source_word: גָּמַ֖לְנוּ אֹתֽוֹ
  choice: yang telah kita lakukan kepadanya
  rationale: Dalam konteks perbuatan jahat, גמל berarti memperlakukan atau melakukan sesuatu terhadap seseorang; ungkapan ini alami dan tidak mengaburkan objek tindakan.
theological_decisions:
- issue: Apakah ucapan ini menyatakan kepastian atau kekhawatiran
  choice: 'Dirumuskan sebagai kemungkinan yang ditakuti: ‘Bagaimana jika ...?’'
  alternative: ‘Mungkin Yusuf akan membenci kita ...’
  rationale: Konteks dan partikel לוּ mendukung pembacaan sebagai kekhawatiran, bukan pernyataan pasti tentang niat Yusuf.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ‘kejahatan’ mempertahankan bobot moral הָרָעָה, sedangkan susunan dialog dibuat alami bagi pembaca umum.
