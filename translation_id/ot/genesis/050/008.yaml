base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: id
  text: Juga seluruh keluarga Yusuf, saudara-saudaranya, dan keluarga ayahnya ikut pergi; hanya anak-anak mereka yang masih kecil,[a] ternak kambing dan domba, serta kawanan sapi mereka yang ditinggalkan di tanah Gosyen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah anak-anak yang masih kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בֵּית יוֹסֵף
  choice: juga seluruh keluarga Yusuf
  rationale: וְ menghubungkan daftar ini dengan ayat sebelumnya, כֹל menyatakan keseluruhan, dan בֵּית dalam konteks ini menunjuk kepada keluarga atau rumah tangga, bukan bangunan.
- source_word: וְאֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk jamak אָח di sini menunjuk kepada saudara laki-laki Yusuf; dalam konteks kisah, rujukannya sudah jelas meski bahasa Indonesia memakai bentuk umum 'saudara-saudara'.
- source_word: וּבֵית אָבִיו
  choice: dan keluarga ayahnya
  rationale: בֵּית אָבִיו menunjuk kepada kelompok keluarga ayahnya, bukan rumah sebagai bangunan.
- source_word: רַק טַפָּם
  choice: hanya anak-anak mereka yang masih kecil
  rationale: רַק menandai pengecualian, sedangkan טַף terutama menunjuk kepada anak-anak kecil; frasa ini alami dan tepat dalam bahasa Indonesia.
- source_word: וְצֹאנָם
  choice: kambing domba mereka
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing. 'Kambing domba' menyampaikan cakupan leksikalnya tanpa menyempitkannya menjadi domba saja.
- source_word: וּבְקָרָם
  choice: dan kawanan sapi mereka
  rationale: בָּקָר menunjuk kepada ternak besar, khususnya sapi; 'kawanan sapi' mempertahankan makna kolektif.
- source_word: עָזְבוּ
  choice: yang ditinggalkan
  rationale: Bentuk pasif alami dalam rangkaian kalimat Indonesia dan tidak memberi kesan 'menelantarkan', yang akan terlalu kuat.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan nama geografis Gosyen.
