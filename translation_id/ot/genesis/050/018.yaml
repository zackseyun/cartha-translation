  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: id
  text: Kemudian saudara-saudaranya juga datang dan bersujud di hadapannya. Mereka berkata, “Kami ini budak-budakmu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba-hambamu.” Kata Ibrani עֲבָדִים dapat berarti hamba atau budak; di sini “budak-budakmu” mempertahankan kuatnya pernyataan ketundukan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: datang
  rationale: Walaupun verba dasarnya berarti ‘pergi/berjalan’, gerak saudara-saudara itu menuju Yusuf paling alami diungkapkan dengan ‘datang’ dalam narasi bahasa Indonesia.
- source_word: גַּם אֶחָיו
  choice: saudara-saudaranya juga
  rationale: גַּם menandai bahwa setelah sebelumnya mengirim pesan, saudara-saudara Yusuf sendiri turut menghadapnya.
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: bersujud di hadapannya
  rationale: Gabungan נפל dan לפני di sini menggambarkan tindakan merendahkan diri secara fisik di hadapan seseorang; ‘bersujud’ menyampaikan tindakan dan sikap tunduk itu secara alami.
- source_word: הִנֶּנּוּ
  choice: Kami ini
  rationale: Formula pengajuan diri ini menyatakan kehadiran dan kesiapan mereka; ‘Kami ini’ alami dalam bahasa Indonesia dan tetap mempertahankan penekanannya.
- source_word: לְךָ לַעֲבָדִים
  choice: budak-budakmu
  rationale: Frasa ini menyatakan bahwa mereka menyerahkan diri untuk berada di bawah kuasa Yusuf. ‘Budak-budakmu’ mempertahankan kuatnya pernyataan ketundukan tersebut, sedangkan ‘hamba-hambamu’ dapat terdengar lebih lunak atau bernuansa religius dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna עֲבָדִים dalam pernyataan penyerahan diri
  choice: budak-budakmu
  alternative: hamba-hambamu / pelayan-pelayanmu
  rationale: Kata Ibrani itu dapat menunjuk hamba atau budak. Dalam konteks ini saudara-saudara Yusuf menyatakan penyerahan diri yang sangat kuat, sehingga ‘budak’ dipilih tanpa meniadakan kemungkinan leksikal ‘hamba’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Bersujud’ dipakai untuk tindakan merendahkan diri di hadapan penguasa, bukan untuk menambahkan makna penyembahan. Pengulangan ‘budak-budak’ mengikuti bentuk jamak dan terdengar wajar sebagai predikat kepemilikan.
