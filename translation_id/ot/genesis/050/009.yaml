  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: id
  text: Kereta-kereta dan para penunggang kuda turut pergi bersamanya, dan rombongan itu sangat besar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkemahan itu sangat berat,” yakni sangat besar, banyak, atau mengesankan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ikut pergi
  rationale: Secara harfiah berarti 'naik/pergi ke atas', tetapi dalam konteks perjalanan ini menyatakan turut berangkat atau berjalan bersama. 'Ikut pergi' alami dalam bahasa Indonesia dan tetap mempertahankan unsur perjalanan serta penyertaan.
- source_word: עִמּוֹ
  choice: bersamanya
  rationale: Padanan langsung bagi preposisi dengan sufiks pronominal yang dalam konteks merujuk kepada Yusuf.
- source_word: גַּם ... גַּם
  choice: dan ... juga
  rationale: Konstruksi berulang ini menandai penambahan kedua unsur yang sejajar. Susunan Indonesia 'Kereta-kereta dan para penunggang kuda juga' menyampaikan keduanya sebagai satu pasangan subjek secara alami.
- source_word: רֶכֶב
  choice: kereta-kereta
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif untuk pasukan atau rombongan kereta. Bentuk jamak Indonesia menyampaikan makna kolektif itu dengan jelas; dalam konteks rombongan Firaun, kereta perang tersirat tanpa harus ditambahkan ke teks.
- source_word: פָּרָשִׁים
  choice: para penunggang kuda
  rationale: Istilah ini menunjuk kepada orang-orang berkuda. Pilihan ini jelas dan tidak memasukkan nuansa organisasi militer modern yang mungkin timbul dari 'kavaleri'.
- source_word: הַמַּחֲנֶה
  choice: rombongan itu
  rationale: Walaupun secara leksikal dapat berarti 'perkemahan', dalam konteks perjalanan pemakaman kata ini menunjuk kepada seluruh kelompok yang sedang bepergian. 'Rombongan' paling alami dan tidak menyiratkan tempat berkemah yang menetap.
- source_word: וַיְהִי ... כָּבֵד מְאֹד
  choice: sehingga rombongan itu sangat besar
  rationale: Secara harfiah, kelompok itu 'sangat berat', sebuah ungkapan bagi besarnya, banyaknya, atau bobot/kemegahan rombongan. 'Sangat besar' menyampaikan makna kontekstual; 'sehingga' menghubungkan tambahan kereta dan penunggang dengan gambaran ukuran rombongan tanpa menegaskan perubahan keadaan yang tidak harus ada dalam bentuk Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Rombongan' dipilih daripada 'perkemahan' karena kelompok ini sedang dalam perjalanan. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
