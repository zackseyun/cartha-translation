  text: אָבִ֞/י הִשְׁבִּיעַ֣/נִי לֵ/אמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּ/קִבְרִ֗/י אֲשֶׁ֨ר כָּרִ֤יתִי לִ/י֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּ/ה תִּקְבְּרֵ֑/נִי וְ/עַתָּ֗ה אֶֽעֱלֶה נָּ֛א וְ/אֶקְבְּרָ֥ה אֶת אָבִ֖/י וְ/אָשֽׁוּבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: id
  text: Ayahku telah menyuruh aku bersumpah, katanya, ‘Lihat, aku akan mati. Di kubur yang telah kugali untuk diriku di tanah Kanaan, di sanalah engkau harus menguburkan aku.’ Maka sekarang, izinkanlah aku pergi ke sana untuk menguburkan ayahku; sesudah itu aku akan kembali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: telah menyuruh aku bersumpah
  rationale: Bentuk kausatif dari שׁבע berarti membuat atau menyuruh seseorang bersumpah; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya ikat sumpah.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian pada pernyataan berikutnya. 'Ketahuilah' menyampaikan fungsi tersebut dalam tuturan bermartabat tanpa memakai bentuk arkais.
- source_word: בְּקִבְרִי אֲשֶׁר כָּרִיתִי לִי
  choice: Di kubur yang telah kugali untuk diriku
  rationale: Menerjemahkan secara langsung verba כרה, 'menggali', serta mempertahankan penekanan bahwa kubur itu disiapkan bagi si pembicara sendiri.
- source_word: אֶעֱלֶה נָּא
  choice: izinkanlah aku pergi ke sana
  rationale: Secara harfiah berarti 'biarlah kiranya aku naik'. Dalam konteks permohonan kepada Firaun, bentuk izin perlu dinyatakan; 'pergi ke sana' alami dalam bahasa Indonesia dan menghindari kesan bahwa arah topografis merupakan pokok utama.
- source_word: וְאָשׁוּבָה
  choice: sesudah itu aku akan kembali
  rationale: Menyatakan janji Yusuf untuk kembali setelah pemakaman, dengan urutan peristiwa yang jelas.
