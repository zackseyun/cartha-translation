base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: id
  text: Lalu ia berkata, “Engkau harus menerima ketujuh anak domba betina ini dari tanganku, supaya hal itu menjadi kesaksian bagiku bahwa aku menggali sumur ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya ketujuh anak domba itu menjadi saksi bagiku.” Kata kerja Ibraninya berbentuk tunggal, sedangkan acuan terdekatnya adalah tujuh anak domba betina; bentuk tunggal itu mungkin memandang semuanya sebagai satu kesatuan atau menunjuk kepada tindakan maupun pengaturan tersebut sebagai kesaksian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam bahasa Indonesia dan tidak memberi penekanan waktu yang berlebihan.
- source_word: כִּי ... תִּקַּח
  choice: Engkau harus menerima
  rationale: כִּי memperkenalkan isi penjelasan, sedangkan imperfek orang kedua menyatakan tindakan yang diminta. “Menerima” cocok dengan penyerahan resmi dari tangan Abraham.
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: ketujuh anak domba betina ini
  rationale: כְּבָשֹׂת menunjuk domba muda betina; “ini” tersirat secara kontekstual karena hewan-hewan tersebut hadir dan baru saja disebut.
- source_word: מִיָּדִי
  choice: dari tanganku
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang penyerahan dari tangan Abraham.
- source_word: בַּעֲבוּר
  choice: supaya
  rationale: Menandai tujuan tindakan tersebut secara alami dalam bahasa Indonesia.
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: hal itu menjadi kesaksian bagiku
  rationale: Verba Ibrani berbentuk feminin tunggal, meskipun acuan terdekatnya ialah tujuh anak domba betina. “Hal itu” mempertahankan bentuk tunggal dengan memahami tindakan atau pengaturan tersebut sebagai kesaksian.
- source_word: כִּי חָפַרְתִּי
  choice: bahwa akulah yang menggali
  rationale: כִּי memperkenalkan isi kesaksian. Partikel “-lah” menyampaikan penegasan kepemilikan berdasarkan tindakan Abraham tanpa menambahkan klaim di luar konteks.
- source_word: הַבְּאֵר הַזֹּאת
  choice: sumur ini
  rationale: Padanan langsung dan alami bagi frasa nomina dengan kata tunjuk tersebut.
