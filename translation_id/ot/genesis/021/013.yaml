  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: id
  text: Aku juga akan menjadikan anak laki-laki dari perempuan budak itu suatu bangsa[a], karena dia adalah keturunanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak laki-laki dari hamba perempuan itu.”
    reason: Alternatif leksikal untuk אָמָה; “perempuan budak” mempertahankan secara eksplisit status perhambaan, sedangkan “hamba perempuan” merupakan padanan Indonesia yang lazim.
lexical_decisions:
- source_word: וְגַם
  choice: Aku juga akan
  rationale: Gabungan וְ dan גַם meneruskan perkataan sebelumnya sekaligus menambahkan penekanan; susunan ini alami dalam bahasa Indonesia.
- source_word: אֶת בֶּן הָאָמָה
  choice: anak perempuan budak itu
  rationale: בֶּן berarti 'anak laki-laki/putra', sedangkan אָמָה menunjuk perempuan berstatus budak atau hamba. Frasa 'anak perempuan budak itu' mempertahankan realitas status sosial Hagar tanpa menyiratkan bahwa anaknya perempuan.
- source_word: לְגוֹי
  choice: suatu bangsa
  rationale: 'Dengan אֲשִׂימֶנּוּ, preposisi לְ menyatakan hasil: anak itu akan dijadikan suatu bangsa.'
- source_word: אֲשִׂימֶנּוּ
  choice: akan menjadikan
  rationale: Dalam konteks ini שׂים berarti membentuk atau menjadikan seseorang sebagai asal suatu bangsa; 'menjadikan' paling wajar dan tepat.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan bagi janji Allah mengenai anak Hagar.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע di sini menunjuk anak atau keturunan Abraham. 'Keturunanmu' alami dan mempertahankan hubungan genealogis.
- source_word: הוּא
  choice: dia adalah
  rationale: Pronomina eksplisit menegaskan bahwa anak itu termasuk keturunan Abraham, tanpa perlu menambahkan penekanan berlebihan seperti 'dia sendiri'.
theological_decisions:
- issue: Pengungkapan status sosial אָמָה
  choice: perempuan budak
  alternative: hamba perempuan; pelayan perempuan
  rationale: Istilah Ibrani menunjukkan perempuan dalam status perhambaan, dan keadaan Hagar tersebut penting dalam narasi. Terjemahan tidak melunakkan realitas sosial itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Aku' mengikuti tuturan langsung Allah dalam konteks. Frasa 'anak perempuan budak itu' secara tata bahasa berarti anak milik/dari perempuan budak, bukan anak berjenis kelamin perempuan.
