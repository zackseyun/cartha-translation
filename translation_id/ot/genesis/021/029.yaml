  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: id
  text: Lalu Abimelekh berkata kepada Abraham, “Apa maksud tujuh ekor anak domba betina ini yang kautempatkan tersendiri?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia tanpa memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan dengan “kh” untuk mencerminkan bunyi konsonan akhir Ibrani secara wajar dalam bahasa Indonesia.
- source_word: מָה הֵנָּה
  choice: Untuk apa ... itu?
  rationale: Secara harfiah konstruksi ini berarti “apakah ini?”, tetapi dalam konteks pertanyaan mengenai kelompok ternak yang sengaja dipisahkan, bahasa Indonesia alami menanyakan fungsi atau maksudnya dengan “untuk apa”, tanpa menentukan jawaban teologis.
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: ketujuh anak domba betina ... itu
  rationale: כְבָשֹׂת berbentuk feminin dan menunjuk anak domba atau domba betina muda; “anak domba betina” mempertahankan kekhususan jenis kelaminnya. Bentuk “ketujuh” sesuai untuk satu kelompok tertentu.
- source_word: הִצַּבְתָּ
  choice: kautempatkan
  rationale: Hifil נצב berarti membuat berdiri, menaruh, atau menempatkan. “Kautempatkan” mempertahankan arti dasar tanpa memasukkan gagasan pemisahan yang sudah dinyatakan oleh לְבַדָּנָה.
- source_word: לְבַדָּנָה
  choice: tersendiri
  rationale: Kata ini menyatakan bahwa ketujuh anak domba berada terpisah dari kelompok lainnya; “tersendiri” ringkas dan alami.
