  verdict: revise
  source_fidelity: Perlu revisi kecil. Bentuk feminin tersirat dalam verba Ibrani tidak memuat demonstratif yang setara dengan “itu”; “perempuan itu” menambahkan penunjukan yang tidak ada dalam teks. Selain itu, בְּנָהּ dan בֶּן menandakan anak laki-laki, sedangkan “anak” sendiri netral dalam bahasa Indonesia.
  naturalness: “Lalu ia berkata kepada Abraham” adalah narasi Indonesia modern yang lebih alami dan tidak menambahkan informasi. Pengulangan “bersama” dapat dipertahankan secara bertanda untuk mencerminkan pengulangan עִם dalam sumber.
  terminology: “Budak perempuan” tepat untuk אָמָה dalam konteks status terikat/perbudakan. “Mewarisi” juga mempertahankan verba sumber tanpa mempersempit bentuk hak waris.
