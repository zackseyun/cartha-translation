base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: id
  text: Lalu ia berkata kepada Abraham, “Usirlah budak perempuan ini dan anak laki-lakinya, sebab anak laki-laki budak perempuan ini tidak akan mewarisi bersama anakku, bersama Ishak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: Lalu berkatalah perempuan itu kepada Abraham
  rationale: Waw naratif menyatakan kelanjutan peristiwa; “lalu” alami dalam narasi Indonesia. Subjek feminin tersirat dalam bentuk verba dan konteks, sehingga dinyatakan sebagai “perempuan itu” tanpa memasukkan nama yang tidak terdapat dalam ayat.
- source_word: גָּרֵשׁ
  choice: Usirlah
  rationale: Imperatif ini menuntut pengusiran, bukan sekadar menyuruh pergi; “usirlah” mempertahankan daya perintah dan tetap wajar dalam bahasa Indonesia.
- source_word: הָאָמָה הַזֹּאת
  choice: budak perempuan ini
  rationale: אָמָה menunjuk perempuan dalam status perbudakan atau keterikatan. “Budak perempuan” menyatakan status sosial-legal itu dengan jelas dan tidak melunakkannya menjadi sekadar pelayan.
- source_word: וְאֶת־בְּנָהּ
  choice: beserta anaknya
  rationale: Menyampaikan objek tambahan dan hubungan posesif secara ringkas serta alami.
- source_word: כִּי לֹא יִירַשׁ
  choice: sebab ... tidak akan mewarisi
  rationale: כִּי memperkenalkan alasan, sedangkan bentuk yiqtol יִירַשׁ dalam konteks ini menyatakan pewarisan yang tidak akan terjadi.
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: anak budak perempuan ini
  rationale: Pengulangan frasa dan demonstratif dipertahankan karena menampilkan penjarakan dan penekanan retoris dalam ucapan tersebut.
- source_word: עִם־בְּנִי עִם־יִצְחָק
  choice: bersama anakku, bersama Ishak
  rationale: Pengulangan עִם dipertahankan agar penekanan dan konstruksi aposisional bahasa Ibrani tidak diam-diam diratakan, meskipun hasilnya lebih bertanda daripada ungkapan Indonesia biasa.
theological_decisions:
- issue: Makna יִירַשׁ dalam penolakan pewarisan
  choice: mewarisi
  alternative: menjadi ahli waris
  rationale: “Mewarisi” mempertahankan verba sumber dan tidak menentukan secara lebih khusus bentuk atau cakupan hak waris yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pilihan “budak perempuan” mempertahankan realitas status sosial dalam teks. Pengulangan “bersama” sengaja dipertahankan untuk mencerminkan penekanan sumber.
