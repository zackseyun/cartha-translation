  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: id
  text: Lalu Allah mendengar suara anak itu[a]. Malaikat Allah memanggil Hagar dari langit dan berkata kepadanya, “Ada apa denganmu, Hagar? Jangan takut, sebab Allah telah mendengar suara anak itu di tempat ia berada.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tangisan anak itu”; kata Ibrani qol dapat berarti suara tangisan yang terdengar dalam kesusahan. Demikian juga pada kemunculan kedua dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: Lalu Allah mendengar
  rationale: Kata שׁמע dalam qal secara umum berarti ‘mendengar’. ‘Lalu’ menyampaikan urutan narasi tanpa menambahkan gagasan bahwa Allah langsung ‘menjawab’.
- source_word: אֶת קוֹל הַנַּעַר / אֶל קוֹל הַנַּעַר
  choice: suara anak itu
  rationale: קוֹל secara harfiah berarti ‘suara/bunyi’ dan dalam konteks dapat menunjuk pada tangisan kesusahan. Pilihan ‘suara’ mempertahankan keluasan makna dan pengulangan frasa dalam ayat.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר menunjuk kepada Ismael sebagai anak laki-laki; ‘anak itu’ alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: מַלְאַךְ אֱלֹהִים
  choice: Malaikat Allah
  rationale: Terjemahan ini mempertahankan frasa konstruksi Ibrani dan tidak menetapkan identitas utusan itu melampaui yang dinyatakan teks.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: שׁמים berbentuk jamak secara morfologis, tetapi dalam ungkapan tempat lazim diterjemahkan secara idiomatis sebagai ‘langit’ dalam bahasa Indonesia.
- source_word: מַה לָּךְ
  choice: Ada apa denganmu
  rationale: Ungkapan idiomatis ini menanyakan keadaan atau masalah yang dialami seseorang. ‘Ada apa denganmu’ alami, langsung, dan tidak bernada menyalahkan.
- source_word: אַל תִּירְאִי
  choice: Jangan takut
  rationale: Bentuk larangan feminin tunggal disampaikan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: sebab Allah telah mendengar
  rationale: ‘Sebab’ menyampaikan fungsi כִּי sebagai dasar penghiburan, sedangkan ‘telah mendengar’ menampilkan tindakan selesai yang relevan dengan keadaan kini.
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: di tempat ia berada
  rationale: Frasa ini bersifat lokatif. Pilihan tersebut lebih jelas daripada ‘di mana ia berada’ setelah objek ‘suara anak itu’ dan tidak menambahkan tafsiran tentang keadaan batinnya.
theological_decisions:
- issue: Identitas מַלְאַךְ אֱלֹהִים dan kedekatan utusan ini dengan tindakan Allah
  choice: Malaikat Allah
  alternative: seorang malaikat dari Allah; malaikat-Nya Allah
  rationale: Terjemahan mempertahankan ungkapan sumber tanpa memutuskan apakah sosok tersebut harus diidentifikasi secara ontologis dengan Allah atau hanya dipahami sebagai utusan-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat dibagi setelah klausa pembuka agar mudah dibaca. Pengulangan ‘suara anak itu’ dipertahankan sesuai teks Ibrani.
