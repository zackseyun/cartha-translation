  text: וְ/הוֹכִ֥חַ אַבְרָהָ֖ם אֶת אֲבִימֶ֑לֶךְ עַל אֹדוֹת֙ בְּאֵ֣ר הַ/מַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: id
  text: Lalu Abraham menegur Abimelekh mengenai sumur itu, yang telah dirampas oleh hamba-hamba Abimelekh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: Lalu ... menegur
  rationale: Bentuk ini menyatakan bahwa Abraham menyampaikan teguran atau keberatan kepada Abimelekh; 'menegur' alami dan tetap mempertahankan daya konfrontatif kata sumber.
- source_word: עַל אֹדוֹת
  choice: mengenai
  rationale: Ungkapan ini memperkenalkan pokok teguran, yaitu perkara sumur tersebut.
- source_word: בְּאֵר הַמַּיִם
  choice: sebuah sumur
  rationale: Dalam bahasa Indonesia, 'sumur' sudah secara wajar berarti sumber atau lubang untuk memperoleh air; menerjemahkannya sebagai 'sumur air' terasa berlebihan. Ketakrifan Ibrani dapat merujuk pada sumur yang kemudian dijelaskan oleh klausa relatif.
- source_word: גָּזְלוּ
  choice: telah dirampas
  rationale: Kata kerja ini menyatakan pengambilan secara paksa atau tidak sah; bentuk pasif menghasilkan susunan Indonesia yang jelas tanpa mengubah pelaku.
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: hamba-hamba Abimelekh
  rationale: '''Hamba-hamba'' mempertahankan cakupan עֲבָדִים, yang dalam konteks ini dapat berarti para pelayan atau bawahan raja, tanpa mempersempitnya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Nama אֲבִימֶלֶךְ ditransliterasikan sebagai 'Abimelekh' agar bunyi konsonan akhir Ibrani tetap terlihat. Tidak diperlukan catatan kaki karena tidak ada ambiguitas penting yang harus ditampilkan bagi pembaca pada ayat ini.
