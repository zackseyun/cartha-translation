base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: id
  text: Lalu Abimelekh berkata, “Aku tidak tahu siapa yang melakukan hal ini[a]. Engkau pun tidak memberitahukannya kepadaku, dan aku sendiri baru mendengarnya hari ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara ini” atau “perbuatan ini.” Kata Ibrani davar dapat berarti hal, perkara, atau kejadian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan urutan dengan alami dalam bahasa Indonesia.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan dengan bentuk yang mencerminkan konsonan akhir Ibrani khaf.
- source_word: לֹא יָדַעְתִּי
  choice: Aku tidak tahu
  rationale: Qatal menyatakan ketidaktahuan Abimelekh mengenai kejadian yang telah berlangsung; bentuk ini alami dalam dialog bahasa Indonesia tanpa harus menandai kala secara eksplisit.
- source_word: מִי עָשָׂה
  choice: siapa yang melakukan
  rationale: Klausa ini menanyakan pelaku tindakan. Bahasa Indonesia tidak memerlukan bentuk kala lampau sempurna untuk menunjukkan bahwa tindakan itu mendahului ujaran.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: perkara ini
  rationale: דָּבָר di sini menunjuk pada kejadian yang dipersoalkan. “Perkara” alami dalam konteks perselisihan, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: וְגַם אַתָּה
  choice: Engkau pun
  rationale: Partikel גַּם menyertakan sekaligus menekankan bahwa lawan bicara juga tidak memberi tahu Abimelekh; “pun” mempertahankan daya itu secara alami.
- source_word: לֹא הִגַּדְתָּ לִּי
  choice: tidak memberitahukannya kepadaku
  rationale: Hifil נגד berarti memberitahukan atau melaporkan. Pronomina “-nya” memperjelas objek yang tersirat, yakni perkara tersebut.
- source_word: וְגַם אָנֹכִי
  choice: dan aku sendiri
  rationale: Bentuk pronomina אָנֹכִי bersama גַּם memberi penekanan pada diri Abimelekh; “aku sendiri” mempertahankan penekanan itu.
- source_word: לֹא שָׁמַעְתִּי
  choice: belum pernah mendengarnya
  rationale: Dalam konteks ini, שׁמע berarti menerima kabar mengenai perkara tersebut. “Belum pernah” menyatakan ketiadaan informasi hingga titik waktu yang disebutkan.
- source_word: בִּלְתִּי הַיּוֹם
  choice: sampai hari ini
  rationale: Ungkapan ini membatasi ketidaktahuan Abimelekh hingga hari ketika ia berbicara; “sampai hari ini” merupakan padanan Indonesia yang jelas dan idiomatis.
