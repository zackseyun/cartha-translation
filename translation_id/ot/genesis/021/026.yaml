    rationale: Ibrani לֹא שָׁמַעְתִּי בִּלְתִּי הַיּוֹם berarti ia tidak mendengar tentang hal itu sebelum hari ini; konteksnya mengandaikan informasi itu kini telah ia dengar. «Baru mendengarnya hari ini» menyampaikan batas waktu tersebut dengan jelas.
  - severity: low
    issue: «melakukan perkara ini» kurang alami.
