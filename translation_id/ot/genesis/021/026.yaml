  verdict: revise
  source_fidelity: Makna pokok tersampaikan, termasuk ketidaktahuan Abimelekh, kegagalan Abraham memberi tahu, dan batas waktu «hari ini». Namun, «belum pernah mendengarnya sampai hari ini» dalam bahasa Indonesia dapat dipahami bahwa sampai pada hari ini Abimelekh tetap belum mendengarnya, padahal konstruksi Ibrani בִּלְתִּי הַיּוֹם menyatakan bahwa ia baru mendengarnya pada hari ini.
  naturalness: Register dialog dan pasangan pronomina «aku–engkau» wajar serta bermartabat. «Melakukan perkara ini» kurang idiomatis dalam bahasa Indonesia modern; «melakukan hal ini» lebih alami. Ungkapan waktu perlu dibuat eksplisit agar tidak ambigu.
  terminology: «Abimelekh» merupakan bentuk nama yang lazim dan dapat dipertahankan. «Pun» dan «aku sendiri» secara memadai menyampaikan unsur inklusif/penegas dari גַם dan אָנֹכִי. Catatan kaki tetap relevan, tetapi alternatifnya diselaraskan dengan pilihan teks utama.
