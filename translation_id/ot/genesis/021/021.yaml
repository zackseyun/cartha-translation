base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: id
  text: Ia tinggal di padang gurun Paran[a], dan ibunya mengambil seorang istri[b] dari tanah Mesir untuknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menetap di padang gurun Paran.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “ibunya mengambil baginya seorang perempuan dari tanah Mesir”; konteksnya menunjukkan pengaturan pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Ia tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, menetap, berdiam, atau tinggal. Dalam ringkasan naratif ini, “tinggal” terdengar alami dan menyatakan keberdiaman tanpa menegaskan permukiman permanen.
- source_word: בְּמִדְבַּר פָּארָן
  choice: di padang gurun Paran
  rationale: מִדְבָּר menunjuk wilayah liar atau gersang; “padang gurun” merupakan padanan Indonesia yang lazim dan cukup luas. Paran dipertahankan sebagai nama tempat.
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: לָקַח pada dasarnya berarti “mengambil” dan di sini menggambarkan tindakan sang ibu memperoleh pasangan nikah bagi anaknya. Terjemahan formal ini mempertahankan ungkapan Ibrani, dengan maksud kontekstual diterangkan dalam catatan.
- source_word: לוֹ
  choice: baginya
  rationale: Preposisi ל dengan sufiks pronominal menyatakan kepentingan atau peruntukan; “baginya” sesuai dengan konteks pengaturan pernikahan.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Padanan posesif langsung yang mempertahankan penyebutan ibu secara eksplisit.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: אִשָּׁה dapat berarti “perempuan” atau “istri”. Konteks mengambil seseorang bagi seorang laki-laki menunjukkan pengaturan pernikahan, sehingga “istri” tepat dalam teks utama.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Teks Ibrani menyebut אֶרֶץ, “tanah/negeri”. “Tanah Mesir” mempertahankan unsur tersebut dan tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Pronomina “Ia” dipakai untuk rujukan tunggal, sedangkan susunan “mengambil seorang istri baginya” mempertahankan kedekatan dengan struktur Ibrani tanpa menjadi tidak dapat dipahami.
