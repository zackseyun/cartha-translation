  yaml_path: translation/ot/genesis/021/031.yaml
  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: id
  text: Itulah sebabnya ia menamai tempat itu Bersyeba[a], karena di sanalah mereka berdua bersumpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Bersyeba terdengar seperti ungkapan Ibrani yang berarti “sumur tujuh” maupun “sumur sumpah”; penjelasan dalam ayat ini terutama menghubungkan nama itu dengan sumpah yang diucapkan di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan sebab-akibat ini secara alami mengaitkan peristiwa sebelumnya dengan penamaan tempat tersebut.
- source_word: קָרָא
  choice: menamai
  rationale: Dalam konteks pemberian nama tempat, 'menamai' menyampaikan fungsi verba secara jelas dan wajar dalam bahasa Indonesia.
- source_word: לַמָּקוֹם הַהוּא
  choice: tempat itu
  rationale: Mempertahankan acuan tertentu dan daya tunjuk הַהוּא.
- source_word: בְּאֵר שָׁבַע
  choice: Bersyeba
  rationale: Menggunakan bentuk nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia; permainan bunyi Ibrani dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan penamaan secara langsung dan alami.
- source_word: שָׁם
  choice: di sanalah
  rationale: Partikel '-lah' mempertahankan penekanan pada lokasi tempat sumpah itu diucapkan.
- source_word: נִשְׁבְּעוּ
  choice: bersumpah
  rationale: Bentuk Nifal dari שבע berarti bersumpah atau mengucapkan sumpah; 'bersumpah' ringkas dan idiomatis.
- source_word: שְׁנֵיהֶם
  choice: mereka berdua
  rationale: Menyatakan dengan jelas bahwa kedua pihak sama-sama bersumpah.
