  text: וַ/יִּקְרָ֨א אַבְרָהָ֜ם אֶֽת שֶׁם בְּנ֧/וֹ הַ/נּֽוֹלַד ל֛/וֹ אֲשֶׁר יָלְדָה לּ֥/וֹ שָׂרָ֖ה יִצְחָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/003.yaml
  text: And Abraham called the name of his son who was born to him[a], whom Sarah bore to him[b], Isaac.
translation:
  language: id
  text: Abraham memberi nama Ishak kepada anak laki-lakinya yang lahir baginya, yang Sara lahirkan baginya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת־שֵׁם
  choice: menamai
  rationale: Konstruksi קרא + שֵׁם secara idiomatis berarti memberi nama. 'Menamai' menyampaikan maknanya dengan wajar dalam bahasa Indonesia tanpa mempertahankan ungkapan Ibrani yang kaku.
- source_word: בְּנוֹ
  choice: anak laki-laki
  rationale: Nomina בֵּן dengan sufiks orang ketiga tunggal maskulin menunjuk kepada anak laki-laki Abraham; kepemilikan sudah jelas dari subjek dan konteks kalimat.
- source_word: הַנּוֹלַד לוֹ
  choice: yang lahir baginya
  rationale: Frasa partisip pasif ini menerangkan anak tersebut. 'Baginya' mempertahankan datif relasional לוֹ dan penekanan sumber pada kelahiran seorang anak bagi Abraham.
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: yang dilahirkan Sara baginya itu
  rationale: Terjemahan ini mempertahankan Sara sebagai pelaku tindakan melahirkan dan mengungkapkan kembali לוֹ. Kata 'itu' menutup rangkaian klausa relatif secara alami serta menghubungkannya dengan nama yang diberikan.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Urutan sumber dipertahankan sejauh masih jelas: identitas anak dijelaskan terlebih dahulu, lalu nama ''Ishak'' ditempatkan sebagai pelengkap verba ''menamai''. Pengulangan ''baginya'' sengaja dipertahankan karena teks Ibrani mengulang לוֹ dan dengan demikian menekankan bahwa anak itu lahir bagi Abraham.'
