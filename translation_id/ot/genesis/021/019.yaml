  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: id
  text: Lalu Allah membuka matanya, dan ia melihat sebuah sumur berisi air. Ia pergi mengisi kantong kulit itu[a] dengan air, lalu memberi anak itu minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “wadah kulit.” Istilah Ibrani ini menunjuk pada wadah dari kulit yang digunakan untuk membawa cairan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: membuka
  rationale: Kata kerja פקח lazim berarti “membuka,” khususnya mata. Pilihan ini mempertahankan ungkapan konkret Ibrani tanpa menjelaskan mekanisme tindakan Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang esa dalam narasi dan menjadi subjek kata kerja tunggal.
- source_word: עֵינֶיהָ
  choice: matanya
  rationale: Padanan alami dalam bahasa Indonesia untuk bentuk harfiah “mata-matanya”; akhiran -nya menunjuk kepada Hagar.
- source_word: וַתֵּרֶא
  choice: ia melihat
  rationale: Padanan langsung dan alami bagi ראה yang mengikuti tindakan Allah membuka matanya.
- source_word: בְּאֵר מָיִם
  choice: sebuah sumur berisi air
  rationale: Frasa konstruksi ini secara harfiah berarti “sumur air.” Bentuk “sumur berisi air” terdengar alami dalam bahasa Indonesia dan mempertahankan penekanan bahwa air tersedia di sana.
- source_word: וַתֵּלֶךְ
  choice: Ia pergi
  rationale: Menyampaikan gerak dan urutan narasi secara sederhana.
- source_word: וַתְּמַלֵּא
  choice: mengisi
  rationale: Padanan lazim bagi מלא; objek dan isinya dinyatakan sesuai susunan alami bahasa Indonesia.
- source_word: הַחֵמֶת
  choice: kantong kulit itu
  rationale: חֵמֶת adalah wadah dari kulit untuk membawa cairan. “Kantong kulit” jelas bagi pembaca modern dan lebih tepat daripada “botol,” sementara kata penunjuk “itu” mencerminkan bentuk definit dalam konteks.
- source_word: מַיִם
  choice: dengan air
  rationale: Dalam bahasa Indonesia, wadah secara alami dikatakan “diisi dengan air.”
- source_word: וַתַּשְׁקְ
  choice: memberi ... minum
  rationale: Bentuk Hifil dari שׁקה berarti memberi atau membuat seseorang minum. Ungkapan ini alami dan mempertahankan makna kausatif tanpa menyiratkan paksaan.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר di sini menunjuk kepada Ismael. “Anak” sesuai konteks dan mudah dipahami, sedangkan bentuk definit diterjemahkan dengan “itu.”
theological_decisions:
- issue: Apakah ungkapan “Allah membuka matanya” harus dipertahankan sebagai tindakan ilahi atau dijelaskan hanya sebagai kemampuan menyadari adanya sumur
  choice: Allah membuka matanya
  alternative: Allah membuatnya melihat atau menyadari adanya sumur
  rationale: Teks Ibrani secara langsung menyatakan bahwa Allah membuka matanya. Terjemahan mempertahankan tindakan ilahi dan ketegangan mengenai mekanismenya tanpa menambahkan penjelasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rangkaian tindakan dibuat lancar dengan “lalu,” sementara idiom teologis “Allah membuka matanya” dipertahankan. Penanda catatan kaki ditempatkan pada “kantong kulit itu,” yaitu kata yang benar-benar dijelaskan oleh catatan; penempatannya pada lapisan konsultasi Inggris setelah “matanya” tampaknya tidak sesuai dengan isi catatan.
