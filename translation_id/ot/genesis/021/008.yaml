  yaml_path: translation/ot/genesis/021/008.yaml
  text: The boy grew and was weaned[b][a], and Abraham made a great feast on the day Isaac was weaned.
translation:
  language: id
  text: Anak itu bertambah besar dan disapih. Pada hari Ishak disapih, Abraham mengadakan pesta besar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: bertambah besar
  rationale: Dalam konteks perkembangan seorang anak, verba גדל menunjuk pada pertumbuhan; 'bertambah besar' alami dan mempertahankan nuansa proses.
- source_word: הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki. 'Anak itu' wajar dalam bahasa Indonesia dan tidak menambahkan penekanan gender yang tidak diperlukan karena identitas Ishak sudah jelas dari konteks.
- source_word: וַיִּגָּמַל
  choice: disapih
  rationale: Bentuk nifal dari גמל di sini berarti berhenti menyusu atau mengalami penyapihan; padanan pasif 'disapih' tepat dan ringkas.
- source_word: וַיַּעַשׂ
  choice: mengadakan
  rationale: Walaupun עשה secara luas berarti 'membuat' atau 'melakukan', dengan objek pesta, bahasa Indonesia idiomatis memakai 'mengadakan'.
- source_word: מִשְׁתֶּה גָדוֹל
  choice: pesta besar
  rationale: מִשְׁתֶּה menunjuk pada jamuan atau pesta perayaan, sering dengan makan dan minum; 'pesta besar' alami dan mempertahankan גָדוֹל.
- source_word: בְּיוֹם
  choice: pada hari
  rationale: Ungkapan temporal ini secara langsung dan alami diterjemahkan 'pada hari'.
- source_word: הִגָּמֵל אֶת יִצְחָק
  choice: Ishak disapih
  rationale: Konstruksi infinitif dengan penanda objek אֶת menyatakan peristiwa penyapihan Ishak. Klausa pasif Indonesia menyampaikan maknanya dengan jelas tanpa menentukan siapa yang menyapih.
