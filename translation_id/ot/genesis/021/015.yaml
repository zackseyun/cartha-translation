  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: id
  text: Ketika air dalam kantong kulit itu habis, ia melemparkan anak itu di bawah salah satu semak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencampakkan anak itu.” Kata kerja Ibrani ini lebih kuat daripada sekadar “meletakkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ
  choice: habis
  rationale: Dalam konteks persediaan air, כּלה menyatakan bahwa air telah habis; pilihan ini alami dan ringkas dalam bahasa Indonesia.
- source_word: הַמַּיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, מַיִם berfungsi sebagai nomina massa dan secara alami diterjemahkan dengan bentuk tunggal 'air'.
- source_word: מִן הַחֵמֶת
  choice: dalam kantong kulit itu
  rationale: חֵמֶת menunjuk pada wadah yang terbuat dari kulit binatang. Dalam ungkapan Indonesia, 'air dalam kantong kulit itu habis' menyampaikan bahwa persediaan dari wadah tersebut telah terkuras.
- source_word: וַתַּשְׁלֵךְ
  choice: melemparkan
  rationale: שׁלך adalah kata kerja yang kuat, umumnya berarti melemparkan atau mencampakkan. 'Melemparkan' mempertahankan ketegasan tindakan itu dan tidak memperlunaknya menjadi sekadar 'meletakkan'.
- source_word: אֶת הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד berarti anak atau anak laki-laki. 'Anak itu' alami dalam narasi Indonesia dan tidak memaksakan penentuan umur yang lebih sempit.
- source_word: תַּחַת
  choice: ke bawah
  rationale: תַּחַת berarti di bawah atau ke bawah; karena kata kerja menyatakan gerakan, 'ke bawah' paling sesuai dalam bahasa Indonesia.
- source_word: אַחַד הַשִּׂיחִם
  choice: salah satu semak
  rationale: Konstruksi ini secara harfiah berarti 'satu dari semak-semak'; 'salah satu semak' merupakan padanan Indonesia yang alami.
