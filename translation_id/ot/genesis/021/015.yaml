translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Kantong kulit' menjelaskan jenis wadah tanpa memerlukan catatan tambahan, sedangkan catatan kaki mempertahankan kemungkinan nuansa yang lebih keras pada kata kerja Ibrani.
