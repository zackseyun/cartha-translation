base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: id
  text: Demikianlah mereka mengadakan perjanjian di Bersyeba[a]. Kemudian Abimelekh bangkit bersama Pikhol, panglima tentaranya, lalu mereka kembali ke negeri orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “memotong perjanjian,” sebuah ungkapan Ibrani yang berarti mengadakan perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: mereka mengadakan perjanjian
  rationale: Ungkapan Ibrani ini secara harfiah berarti “memotong perjanjian,” tetapi merupakan idiom untuk mengadakan atau membuat perjanjian. “Mengadakan perjanjian” jelas dan alami dalam bahasa Indonesia modern.
- source_word: בִּבְאֵר שָׁבַע
  choice: di Bersyeba
  rationale: Preposisi ב menandai lokasi, dan “di” merupakan padanan Indonesia yang wajar. Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim, “Bersyeba.”
- source_word: וַיָּקָם
  choice: berangkat
  rationale: Dalam rangkaian narasi ini, קום menandai bangkitnya seseorang untuk pergi atau memulai perjalanan. “Berangkat” menyampaikan fungsi kontekstualnya secara alami tanpa ungkapan kaku “bangkit berdiri.”
- source_word: וּפִיכֹל שַׂר צְבָאוֹ
  choice: dan Pikhol, panglima tentaranya
  rationale: Konjungsi ו dipertahankan sebagai “dan.” שַׂר צְבָאוֹ secara alami berarti pemimpin atau panglima pasukan milik Abimelekh; “panglima tentaranya” ringkas dan jelas.
- source_word: וַיָּשֻׁבוּ
  choice: kembali
  rationale: Bentuk jamak dari שׁוב menyatakan bahwa Abimelekh dan Pikhol kembali. Subjek gabungan sudah disebutkan sehingga bentuk Indonesia tidak perlu mengulang “mereka” setelah “dan.”
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ke negeri orang Filistin
  rationale: Terjemahan ini mempertahankan susunan etnogeografis Ibrani, yakni negeri yang dikaitkan dengan orang Filistin, dan terdengar alami dalam bahasa Indonesia.
