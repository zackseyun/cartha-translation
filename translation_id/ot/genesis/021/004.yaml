  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: id
  text: Lalu Abraham menyunat Ishak, anaknya, ketika Ishak berumur delapan hari[a], sebagaimana Allah telah memerintahkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang anak berusia delapan hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָל
  choice: menyunat
  rationale: Kata kerja מול secara khusus menunjuk pada tindakan sunat; “menyunat” merupakan padanan baku, tepat, dan alami dalam bahasa Indonesia.
- source_word: אֶת יִצְחָק
  choice: Ishak
  rationale: Penanda objek langsung diikuti nama diri; bentuk “Ishak” adalah ejaan baku yang lazim dalam bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Bentuk dengan sufiks pronominal menyatakan bahwa Ishak adalah anak Abraham. Unsur ini dipertahankan untuk menjaga penekanan hubungan keluarga dalam teks Ibrani.
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: ketika ia berumur delapan hari
  rationale: Ungkapan Ibrani harfiah “seorang anak berusia delapan hari” adalah idiom usia. Padanan ini menyampaikan maknanya secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Konjungsi ini menghubungkan tindakan Abraham dengan perintah Allah dan dalam konteks menyatakan kesesuaian tindakan itu dengan perintah tersebut.
- source_word: צִוָּה אֹתוֹ
  choice: yang diperintahkan ... kepadanya
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan bahwa Abraham adalah penerima perintah Allah; konteks narasi sudah menunjukkan bahwa perintah itu diberikan sebelumnya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada satu-satunya Allah dan dipakai dengan kata kerja tunggal. “Allah” adalah padanan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan waktu antara perintah Allah dan tindakan Abraham
  choice: yang diperintahkan Allah kepadanya
  alternative: yang telah diperintahkan Allah kepadanya
  rationale: Bahasa Ibrani memakai bentuk lampau yang konteksnya menunjukkan bahwa perintah mendahului tindakan. Bahasa Indonesia tidak wajib memakai penanda aspek “telah”; susunan yang dipilih lebih alami dan tetap mempertahankan urutan yang jelas dari konteks tanpa mempertegas aspek secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata “Lalu” meneruskan alur narasi; tanda koma mengapit aposisi “anaknya” agar hubungan keluarga tetap jelas tanpa membuat kalimat terasa kaku.
