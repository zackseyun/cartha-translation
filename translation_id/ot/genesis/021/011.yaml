  text: וַ/יֵּ֧רַע הַ/דָּבָ֛ר מְאֹ֖ד בְּ/עֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/011.yaml
  text: The matter was very displeasing in Abraham’s eyes on account of his son[a].
translation:
  language: id
  text: Hal itu sangat tidak berkenan bagi Abraham karena putranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau secara lebih harfiah: “Hal itu sangat buruk di mata Abraham karena putranya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: sangat tidak menyenangkan hati
  rationale: Dalam idiom וַיֵּרַע ... בְּעֵינֵי, verba ini menyatakan bahwa sesuatu dipandang buruk atau sangat tidak berkenan oleh seseorang. Ungkapan Indonesia ini menyampaikan penilaian sekaligus kegusaran Abraham secara alami.
- source_word: הַדָּבָר
  choice: hal itu
  rationale: דָּבָר di sini menunjuk pada perkataan atau permintaan Sara dalam ayat sebelumnya. 'Hal itu' cukup jelas dan tidak mempersempit maknanya secara berlebihan.
- source_word: מְאֹד
  choice: sangat
  rationale: Meneruskan fungsi kata ini sebagai penguat dengan bentuk Indonesia yang lazim.
- source_word: בְּעֵינֵי אַבְרָהָם
  choice: hati Abraham
  rationale: Secara harfiah berarti 'di mata Abraham', yakni suatu idiom penilaian. Dalam konteks ini, 'tidak menyenangkan hati Abraham' lebih alami dalam bahasa Indonesia dan juga menyampaikan dampak emosionalnya tanpa menambahkan alasan yang tidak disebutkan.
- source_word: עַל אֹדוֹת
  choice: karena menyangkut
  rationale: Frasa ini dapat menyatakan sebab sekaligus pokok yang dipersoalkan. 'Karena menyangkut' mempertahankan kedua nuansa tersebut.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: בֵּן berarti anak laki-laki atau putra. Dalam konteks yang sudah mengidentifikasi Ismael, 'anaknya' alami dan tetap menunjukkan relasi ayah-anak; alternatif yang lebih eksplisit ialah 'putranya'.
theological_decisions:
- issue: Identitas 'anaknya'
  choice: Tidak menambahkan nama Ismael dalam teks utama.
  alternative: karena menyangkut Ismael, anaknya
  rationale: Teks Ibrani hanya mengatakan 'anaknya'. Rujukannya jelas dari konteks, tetapi terjemahan tidak perlu membuat yang tersirat menjadi tersurat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Idiom Ibrani 'buruk di mata' dialihkan secara optimal menjadi 'tidak menyenangkan hati', sedangkan bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
