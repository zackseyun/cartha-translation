  text: וַֽ/יהוָ֛ה פָּקַ֥ד אֶת שָׂרָ֖ה כַּ/אֲשֶׁ֣ר אָמָ֑ר וַ/יַּ֧עַשׂ יְהוָ֛ה לְ/שָׂרָ֖ה כַּ/אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: id
  text: Yahweh memperhatikan[a] Sara seperti yang telah dikatakan-Nya, dan Yahweh bertindak untuk Sara seperti yang telah difirmankan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengunjungi.” Kata Ibrani ini dapat menunjuk pada Yahweh yang mengarahkan perhatian-Nya kepada seseorang untuk bertindak demi orang itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan pengulangannya dalam kedua klausa.
- source_word: פָּקַד
  choice: memperhatikan
  rationale: Dalam konteks penggenapan janji, kata ini menunjuk pada perhatian Allah yang menghasilkan tindakan bagi Sara, bukan sekadar kunjungan secara fisik. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: כַּאֲשֶׁר אָמָר
  choice: seperti yang telah dikatakan-Nya
  rationale: Bentuk lampau sempurna menunjuk kembali pada perkataan atau janji sebelumnya; 'telah' memperjelas urutan naratif tanpa menambahkan unsur waktu yang tidak ada.
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: dan Yahweh bertindak bagi Sara
  rationale: '''Bertindak'' menyampaikan daya kerja verba umum עשה dengan ל benefaktif, sambil menghindari frasa Indonesia yang kaku ''melakukan bagi Sara'' dan tidak merinci hasil yang baru dijelaskan pada ayat berikutnya.'
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: seperti yang telah difirmankan-Nya
  rationale: Pilihan ini mempertahankan kesejajaran sekaligus variasi leksikal terhadap אָמַר pada klausa pertama; 'berfirman' wajar untuk perkataan Allah dalam register Kitab Suci Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Sifat tindakan Allah terhadap Sara dalam פקד
  choice: perhatian ilahi yang efektif, tanpa menyebut hasilnya secara eksplisit
  alternative: mengunjungi Sara atau membuat Sara mengandung
  rationale: Konteks menunjukkan tindakan penuh anugerah yang menggenapi janji, tetapi ayat ini sendiri belum menyatakan secara khusus bahwa Sara mengandung; terjemahan tidak boleh mendahului ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk '-Nya' dipakai secara alami untuk merujuk kepada Yahweh. Kesejajaran dua klausa dipertahankan, sedangkan variasi antara 'dikatakan-Nya' dan 'difirmankan-Nya' mencerminkan dua verba tutur Ibrani yang berbeda.
