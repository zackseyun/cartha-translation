  text: And Abraham set seven ewe lambs of the flock by themselves[a].
translation:
  language: id
  text: Lalu Abraham menempatkan tujuh ekor anak domba betina dari kawanan itu secara terpisah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memisahkan tujuh ekor anak domba betina dari kawanan itu.” Kata kerja Ibrani dapat menggambarkan penempatan mereka pada posisi yang terpisah; konteks berikutnya menunjukkan pentingnya tindakan ini sebagai kesaksian perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: menempatkan
  rationale: Bentuk Hifil dari נצב menyatakan tindakan membuat sesuatu berdiri atau berada pada posisi tertentu. “Menempatkan” alami dalam narasi Indonesia dan tidak menambahkan tujuan yang hanya tersirat oleh konteks.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: שֶׁבַע
  choice: tujuh ekor
  rationale: Bilangan pokok diterjemahkan secara langsung; “ekor” ditambahkan sebagai penggolong alami untuk hewan dalam bahasa Indonesia.
- source_word: כִּבְשֹׂת
  choice: anak domba betina
  rationale: Kata ini secara khusus menunjuk domba muda berjenis kelamin betina; pilihan ini mempertahankan unsur usia dan jenis kelamin dengan jelas.
- source_word: הַצֹּאן
  choice: dari kawanan itu
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, terutama domba dan kambing. “Kawanan” tidak mempersempit artinya, sedangkan “itu” mewakili artikel tentu Ibrani.
- source_word: לְבַדְּהֶן
  choice: tersendiri
  rationale: Ungkapan ini menunjukkan bahwa ketujuh anak domba betina dipisahkan dari yang lain. “Tersendiri” ringkas dan alami.
theological_decisions:
- issue: Apakah tindakan Abraham harus dinyatakan secara eksplisit sebagai pemisahan untuk tujuan perjanjian atau kesaksian?
  choice: Teks utama hanya menyatakan bahwa Abraham menempatkan anak-anak domba itu tersendiri.
  alternative: Abraham memisahkan tujuh ekor anak domba betina dari kawanan itu.
  rationale: Konteks berikutnya menjelaskan fungsi tindakan tersebut, tetapi ayat ini sendiri memakai verba konkret yang berarti menempatkan atau membuat berdiri. Terjemahan utama tidak memasukkan tujuan teologis yang belum dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan rincian bahwa hewan-hewan itu adalah tujuh anak domba betina dan ditempatkan terpisah.
