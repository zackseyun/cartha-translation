  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: id
  text: Abraham tinggal di negeri orang Filistin sebagai pendatang untuk waktu yang lama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Abraham tinggal sebagai pendatang di negeri orang Filistin selama banyak hari.” Kata kerja Ibrani dapat menekankan bahwa ia tinggal sebagai orang asing atau pendatang; ungkapan “banyak hari” menyatakan masa yang lama.'
    reason: Menjelaskan alternatif leksikal untuk וַיָּגָר serta bentuk dan makna idiomatis יָמִים רַבִּים tanpa menambahkan satuan waktu tertentu.
lexical_decisions:
- source_word: וַיָּגָר
  choice: tinggal sebagai pendatang
  rationale: Kata kerja גּוּר menyatakan tinggal atau menetap sebagai orang asing/pendatang. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa status Abraham yang bukan penduduk asli.
- source_word: בְּאֶרֶץ
  choice: di negeri
  rationale: Dalam konteks wilayah suatu kelompok bangsa, אֶרֶץ secara alami diterjemahkan 'negeri'.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Nama kelompok bangsa ini lazim diterjemahkan 'orang Filistin'; frasa keseluruhannya menjadi 'negeri orang Filistin'.
- source_word: יָמִים רַבִּים
  choice: selama bertahun-tahun
  rationale: Secara harfiah berarti 'banyak hari' dan secara idiomatis menunjukkan jangka waktu yang lama. 'Selama bertahun-tahun' menyampaikan durasi panjang dengan bahasa Indonesia yang wajar, tanpa menentukan jumlah tahun.
- source_word: וַ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Waw melanjutkan alur narasi. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya tetap alami tanpa harus selalu dinyatakan dengan 'dan' atau 'kemudian'.
