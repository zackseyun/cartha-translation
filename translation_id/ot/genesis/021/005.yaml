source:
  edition: WLC
  text: וְ/אַבְרָהָ֖ם בֶּן מְאַ֣ת שָׁנָ֑ה בְּ/הִוָּ֣לֶד ל֔/וֹ אֵ֖ת יִצְחָ֥ק בְּנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: id
  text: Abraham berumur seratus tahun ketika Ishak, anaknya, lahir baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “Abraham adalah anak dari seratus tahun pada waktu Ishak, anaknya, dilahirkan baginya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Kata penghubung וְ mengaitkan ayat ini dengan narasi sebelumnya. Dalam bahasa Indonesia, hubungan itu sudah mengalir secara alami tanpa perlu selalu dinyatakan dengan 'dan' pada awal kalimat.
- source_word: בֶּן מְאַת שָׁנָה
  choice: berumur seratus tahun
  rationale: Ungkapan Ibrani harfiah 'anak laki-laki dari seratus tahun' merupakan idiom yang menyatakan usia; 'berumur seratus tahun' adalah padanan Indonesia yang alami dan tepat.
- source_word: בְּ/הִוָּלֶד
  choice: ketika ... lahir
  rationale: 'Preposisi בְּ dengan infinitif konstruk Nifal dari ילד menyatakan waktu dan mempertahankan makna pasif: ''ketika ... lahir''.'
- source_word: ל֔/וֹ
  choice: baginya
  rationale: Frasa berpronomina ini menyatakan bahwa Ishak lahir bagi Abraham. 'Baginya' mempertahankan unsur relasional yang eksplisit dalam bahasa Ibrani.
- source_word: אֵת יִצְחָק
  choice: Ishak
  rationale: אֵת adalah penanda objek tertentu dan tidak diterjemahkan tersendiri; nama יִצְחָק disajikan dalam bentuk Indonesia yang lazim, 'Ishak'.
- source_word: בְּנֽ/וֹ
  choice: anaknya
  rationale: Akhiran pronominal menyatakan hubungan Ishak sebagai anak Abraham; 'anaknya' mempertahankan aposisi Ibrani tanpa menambahkan penekanan.
theological_decisions: []
