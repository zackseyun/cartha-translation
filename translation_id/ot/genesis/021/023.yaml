  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: id
  text: Sekarang, bersumpahlah kepadaku di sini demi Allah bahwa engkau tidak akan berlaku curang terhadap aku, anak-anakku, ataupun keturunanku. Sebagaimana aku telah menunjukkan kasih setia kepadamu, demikianlah harus kautunjukkan kasih setia kepadaku dan kepada negeri tempat engkau tinggal sebagai pendatang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan Ibrani ini secara eksplisit menandai peralihan menuju permintaan yang mendesak; karena itu tetap diterjemahkan.
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים הֵנָּה
  choice: bersumpahlah kepadaku di sini demi Allah
  rationale: Mempertahankan bentuk perintah, penerima sumpah, lokasi, dan Allah sebagai pihak yang dijadikan dasar sumpah.
- source_word: תִּשְׁקֹר
  choice: berlaku curang
  rationale: Dalam konteks perjanjian, verba שׁקר menyatakan tindakan memperdaya atau bertindak tidak setia, bukan sekadar mengucapkan kebohongan.
- source_word: לְנִינִי וּלְנֶכְדִּי
  choice: anak-anakku, ataupun keturunanku
  rationale: Dua istilah kekerabatan dipertahankan sebagai dua kelompok berurutan; bentuk orang pertama tunggal dipahami secara kolektif dalam bahasa Indonesia alami.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Dalam konteks hubungan perjanjian, חסד mencakup kebaikan yang loyal dan kesetiaan relasional; 'kasih setia' menjaga kedua nuansa itu.
- source_word: גַּרְתָּה
  choice: tinggal sebagai pendatang
  rationale: Verba גור menunjukkan tinggal di wilayah orang lain tanpa status sebagai penduduk asli atau pemilik tetap.
theological_decisions:
- issue: Dasar sumpah בֵאלֹהִים
  choice: demi Allah
  alternative: oleh Allah
  rationale: '''Demi Allah'' merupakan rumusan sumpah Indonesia yang alami dan tidak menambahkan gagasan bahwa Allah sendiri yang bersumpah.'
- issue: Makna etis חֶסֶד
  choice: kasih setia
  alternative: kebaikan
  rationale: Pilihan ini mempertahankan dimensi loyalitas dalam hubungan timbal balik tanpa menjadikannya istilah teknis denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipakai sesuai narasi Alkitab dan hubungan langsung antartokoh; konstruksi 'kautunjukkan' menjaga kelancaran tanpa mengurangi kekuatan tuntutan.
