  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אָנֹכִ֖י אִשָּׁבֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/024.yaml
  text: And Abraham said[a], “I swear it.”
translation:
  language: id
  text: Lalu Abraham berkata[a], “Aku bersumpah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan bersumpah,” atau “Aku akan mengangkat sumpah.”
    reason: Alternatif ini mempertahankan nuansa kehendak atau komitmen ke depan yang dapat dikandung bentuk imperfek Ibrani.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyatakan perkembangan cerita secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Nama diri mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אָנֹכִי
  choice: Aku
  rationale: Pronomina mandiri menegaskan subjek. “Aku” mempertahankan kejelasan dan cocok dengan ujaran langsung yang khidmat, tanpa penegasan berlebihan seperti “aku sendiri”.
- source_word: אִשָּׁבֵעַ
  choice: bersumpah
  rationale: Bentuk nifal dari שבע berarti “bersumpah” atau “mengangkat sumpah”. Dalam konteks jawaban terhadap permintaan Abimelekh, bentuk imperfek ini menyatakan kesediaan/komitmen; bahasa Indonesia alami dapat menyatakannya dengan bentuk kini “Aku bersumpah”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” dipakai dalam ujaran langsung sesuai register narasi Alkitab; “bersumpah” merupakan padanan yang paling ringkas dan alami.
