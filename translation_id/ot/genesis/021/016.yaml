base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: id
  text: Lalu ia pergi dan duduk menyendiri, berhadapan dengan anak itu, jauh, kira-kira sejauh jangkauan panah, sebab katanya, “Janganlah aku melihat kematian anak itu.”[a] Maka ia duduk berhadapan dengannya, mengangkat suaranya lalu menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah aku melihat anak itu mati.”
    reason: Alternatif ini mengungkapkan secara verbal konstruksi Ibrani yang secara lebih formal berbunyi ‘melihat kematian anak itu’.
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: berhadapan dengan anak itu / berhadapan dengannya
  rationale: Kata depan ini menunjukkan posisi di hadapan atau berseberangan pada suatu jarak. Konteks mengacu kepada anak itu, dan pengulangan dalam bahasa Ibrani dipertahankan.
- source_word: הַרְחֵק
  choice: agak jauh
  rationale: Bentuk adverbial ini menegaskan adanya jarak; ungkapan berikutnya memberi perkiraan jarak tersebut. Pilihan ini alami dalam bahasa Indonesia dan tidak melebih-lebihkan jaraknya.
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: kira-kira sejauh tembakan panah
  rationale: Ungkapan ini menyatakan jarak perkiraan berdasarkan jangkauan tembakan busur dan mempertahankan gambaran konkret bahasa sumber.
- source_word: הַיָּלֶד
  choice: anak itu
  rationale: Kata יֶלֶד dapat menunjuk anak laki-laki atau anak muda. 'Anak itu' alami dalam konteks hubungan Hagar dengan Ismael dan tidak memberi kesan usia yang terlalu spesifik.
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: Jangan sampai aku melihat kematian anak itu
  rationale: Pilihan ini mempertahankan bentuk negatif volisional orang pertama dan konstruksi nominal 'kematian anak itu'. Bentuk verbal yang lebih idiomatis dicatat sebagai alternatif.
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ וַתֵּבְךְּ
  choice: menangis dengan suara nyaring
  rationale: Idiom harfiah 'mengangkat suaranya lalu menangis' menyatakan ratapan yang terdengar. Padanan ini menyampaikan maknanya secara alami dalam bahasa Indonesia tanpa mengesankan bahwa ia menyampaikan ujaran tertentu.
- source_word: לָהּ
  choice: tidak diterjemahkan tersendiri
  rationale: Datif pronominal setelah 'duduk' tidak memerlukan padanan eksplisit dalam bahasa Indonesia; konteks dan keterangan jarak sudah menunjukkan bahwa ia memisahkan diri.
