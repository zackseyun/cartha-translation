  to: Lalu ia pergi dan duduk menyendiri, berhadapan dengan anak itu, jauh, kira-kira sejauh jangkauan panah, sebab katanya, “Janganlah aku melihat kematian anak itu.”[a] Maka ia duduk berhadapan dengannya, mengangkat suaranya lalu menangis.
  rationale: Revisi mempertahankan pengulangan מִנֶּגֶד (‘berhadapan’), menguatkan unsur jarak dalam הַרְחֵק, dan memulihkan dua tindakan ratapan pada akhir ayat. Bentuk ‘Janganlah aku melihat’ lebih langsung mencerminkan ungkapan volisional negatif tanpa menentukan lebih jauh maknanya.
