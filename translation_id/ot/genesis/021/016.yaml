  source_fidelity: Revisi diperlukan terutama karena terjemahan sekarang melemahkan הַרְחֵק (‘jauh’) menjadi ‘agak jauh’ dan meringkas dua tindakan terakhir—‘mengangkat suaranya’ dan ‘menangis’—menjadi satu ungkapan. Datif לָהּ juga sebaiknya dinyatakan secara wajar sebagai tindakan duduk menyendiri/terpisah.
  naturalness: Bahasa draft pada dasarnya baku dan mudah dipahami. ‘Sejauh jangkauan panah’ dan ‘mengangkat suaranya lalu menangis’ terdengar alami dalam narasi Alkitab Indonesia modern serta lebih dekat pada struktur sumber.
  terminology: ‘Anak itu’ mempertahankan keluasan יֶלֶד tanpa menetapkan usia. ‘Kematian anak itu’ mencerminkan konstruksi nominal Ibrani; alternatif verbal dicantumkan pada jangkar yang tepat.
