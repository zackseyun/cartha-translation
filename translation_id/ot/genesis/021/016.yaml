- from: 'Lalu ia pergi dan duduk berhadapan dengan anak itu, agak jauh, kira-kira sejauh tembakan panah, sebab katanya, “Jangan sampai aku melihat kematian anak itu.”[a] Maka ia duduk berhadapan dengannya, lalu menangis dengan suara nyaring.


