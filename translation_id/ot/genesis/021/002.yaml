  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: id
  text: Sara pun mengandung dan melahirkan seorang anak laki-laki bagi Abraham pada masa tuanya, tepat pada waktu yang telah ditetapkan, tentang waktu itu Allah telah berfirman kepada Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada waktu yang telah ditetapkan, yang tentangnya Allah telah berfirman kepada Abraham.”'
    reason: Alternatif ini mempertahankan hubungan langsung klausa relatif Ibrani dengan “waktu yang telah ditetapkan”.
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Kata kerja הרה menyatakan mulai hamil atau mengandung; bentuk ini ringkas dan alami dalam urutan narasi kelahiran.
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Kata ילד dalam konteks ini menyatakan tindakan melahirkan dan diterjemahkan dengan istilah Indonesia modern yang wajar.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Ungkapan ini jelas menyatakan bahwa anak yang dilahirkan berjenis kelamin laki-laki dan terdengar alami bagi pembaca umum.
- source_word: לְאַבְרָהָם
  choice: bagi Abraham
  rationale: Preposisi ל menandai hubungan anak itu dengan Abraham; 'bagi Abraham' mempertahankan sudut pandang teks tanpa menyiratkan bahwa Abraham melahirkan.
- source_word: לִזְקֻנָיו
  choice: pada masa tuanya
  rationale: Ungkapan ini menunjuk pada keadaan atau masa lanjut usia Abraham, bukan tujuan kelahiran tersebut.
- source_word: לַמּוֹעֵד
  choice: tepat pada waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu tertentu yang telah ditentukan. 'Tepat' mengungkapkan pemenuhan pada waktu itu tanpa menambahkan gagasan di luar konteks.
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: seperti yang telah difirmankan Allah kepadanya
  rationale: Terjemahan ini menghubungkan kelahiran pada waktu yang ditetapkan dengan firman Allah sebelumnya, sambil menghindari susunan Indonesia yang kaku.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sebutan Ibrani umum bagi Tuhan diterjemahkan dengan padanan baku 'Allah' dalam bahasa Indonesia.
- source_word: וַ
  choice: pun
  rationale: Partikel naratif ini melanjutkan kisah dan, dalam konteks ayat sebelumnya, memberi nuansa terjadinya hal yang telah dinyatakan.
theological_decisions:
- issue: Bahasa pemenuhan janji Allah pada waktu yang telah ditetapkan
  choice: tepat pada waktu yang telah ditetapkan, seperti yang telah difirmankan Allah kepadanya
  alternative: pada waktu yang telah ditetapkan, yang telah Allah firmankan kepadanya
  rationale: Pilihan utama menyampaikan hubungan antara waktu kelahiran dan firman Allah sebelumnya secara alami, tanpa menambahkan penjelasan doktrinal. Catatan kaki mempertahankan kemungkinan hubungan sintaksis yang lebih langsung antara klausa relatif dan 'waktu yang telah ditetapkan'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Sara pun mengandung dan melahirkan' mempertahankan urutan naratif Ibrani; 'difirmankan Allah' menjaga register Alkitabiah tanpa menjadi arkais.
