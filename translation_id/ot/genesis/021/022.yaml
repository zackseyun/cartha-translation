id: GEN.21.22
reference: Genesis 21:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: id
  text: Pada waktu itu, Abimelekh dan Pikhol, panglima pasukannya, berkata kepada Abraham, “Allah[a] menyertai engkau dalam segala sesuatu yang kaulakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, meskipun kurang mungkin dalam konteks ini, “seorang dewa”. Kata Ibrani אֱלֹהִים dapat dipahami dengan cara berbeda dalam konteks tertentu, tetapi di sini paling wajar menunjuk kepada Allah yang memberkati Abraham.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan ini memperkenalkan adegan baru pada masa yang sama secara alami dalam bahasa Indonesia; unsur וַיְהִי tidak perlu diterjemahkan secara kaku sebagai ‘terjadilah’.
- source_word: אֲבִימֶלֶךְ וּפִיכֹל
  choice: Abimelekh dan Pikhol
  rationale: Nama diri ditransliterasikan dengan ejaan yang jelas dan lazim bagi pembaca Indonesia.
- source_word: שַׂר צְבָאוֹ
  choice: panglima pasukannya
  rationale: שַׂר menyatakan pemimpin atau panglima, sedangkan צָבָא dalam konteks ini adalah pasukan militer.
- source_word: וַיֹּאמֶר ... אֶל אַבְרָהָם לֵאמֹר
  choice: berkata kepada Abraham
  rationale: Formula לֵאמֹר memperkenalkan perkataan langsung dan tidak perlu diulang sebagai ‘katanya’ karena akan terasa berlebihan dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi, istilah ini paling wajar menunjuk kepada Allah yang menyertai dan memberkati Abraham, meskipun bentuk Ibraninya dapat mempunyai pengertian lain dalam konteks tertentu.
- source_word: עִמְּךָ
  choice: menyertai engkau
  rationale: Ungkapan ini menyatakan kehadiran yang mendukung; ‘menyertai engkau’ alami, jelas, dan sesuai dengan ragam Alkitab yang bermartabat.
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: dalam segala sesuatu yang kaulakukan
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh ungkapan Ibrani dan menyampaikan bentuk partisipelnya sebagai tindakan yang berlaku umum.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Abimelekh
  choice: Allah
  alternative: seorang dewa
  rationale: Konteks terdekat menggambarkan pengakuan Abimelekh bahwa pertolongan ilahi menyertai Abraham. ‘Allah’ paling sesuai dengan alur narasi, sementara kemungkinan pembacaan tak tentu tetap dicatat tanpa dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘engkau’ dipakai dalam ujaran langsung untuk mempertahankan nada naratif yang sopan tanpa menjadi arkais; bentuk terikat ‘kau-’ digunakan secara baku pada ‘kaulakukan’.
