  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: id
  text: Bangunlah, angkatlah anak itu, dan peganglah dia erat-erat dengan tanganmu[a], sebab Aku akan menjadikannya suatu bangsa yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani juga dapat diterjemahkan, “topanglah dia kuat-kuat dengan tanganmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: Bangunlah
  rationale: Bentuk perintah feminin tunggal dari קום, ditujukan kepada Hagar. “Bangunlah” wajar dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: שְׂאִ֣י
  choice: angkatlah
  rationale: Bentuk perintah dari נשׂא di sini paling mungkin menyuruh Hagar mengangkat anak itu dari keadaannya yang tergeletak. “Angkatlah” mempertahankan gambaran konkret tanpa menyiratkan bahwa ia harus terus menggendongnya.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר dapat berarti anak laki-laki atau pemuda. Dalam konteks ini, “anak itu” terdengar alami dan tidak menetapkan usia secara lebih sempit daripada yang diperlukan.
- source_word: וְהַחֲזִיקִי אֶת יָדֵךְ בּוֹ
  choice: dan peganglah dia erat-erat dengan tanganmu
  rationale: Ungkapan ini menyampaikan tindakan memegang atau menopang dengan kuat. Terjemahan ini mempertahankan unsur tangan dan penekanan pada dukungan yang teguh, tanpa memberi kesan bahwa Hagar hanya memegang tangan anak itu.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perintah sebelumnya. “Sebab” menyatakan hubungan penjelas itu dengan jelas dan bermartabat.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: Aku akan menjadikannya suatu bangsa yang besar
  rationale: Konstruksi שׂים dengan לְ menyatakan hasil atau keadaan yang ditetapkan. Rumusan ini alami dalam bahasa Indonesia dan menyampaikan janji tentang keturunan anak itu.
theological_decisions:
- issue: Janji Allah mengenai masa depan Ismael
  choice: Pernyataan diterjemahkan langsung sebagai janji Allah untuk menjadikan anak itu suatu bangsa yang besar.
  alternative: Menambahkan penjelasan mengenai kedudukan khusus atau sifat teologis janji tersebut.
  rationale: Teks menyatakan masa depan kebangsaan anak itu, tetapi tidak menjabarkan sifat teologis janji tersebut dalam ayat ini. Terjemahan tidak memasukkan pembedaan doktrinal dari luar teks.
translation_notes:
  register: Bahasa Indonesia baku yang modern, jelas, dan bermartabat. Bentuk perintah berakhiran -lah mempertahankan ketegasan sekaligus keluwesan naratif. Kapitalisasi “Aku” mengikuti rujukan kepada Allah.
