  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: id
  text: Allah menyertai anak itu, dan ia bertambah besar. Ia tinggal di padang gurun dan menjadi seorang pemanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang menembakkan busur.”
    reason: Menjelaskan bentuk ungkapan Ibrani yang mendasari padanan alami “pemanah”.
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: Allah menyertai anak itu
  rationale: Ungkapan Ibrani היה את menyatakan kehadiran yang menyertai dan, dalam konteks ini, juga menyiratkan pertolongan atau perlindungan. “Menyertai” mempertahankan rumusan kehadiran ilahi tanpa memperluas implikasi teologisnya.
- source_word: וַיִּגְדָּל
  choice: ia bertumbuh besar
  rationale: Kata kerja גדל di sini menunjuk pada pertumbuhan dan perkembangan anak tersebut. “Bertumbuh besar” alami dalam bahasa Indonesia dan tidak secara khusus membatasi maknanya pada kedewasaan penuh.
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: Ia tinggal di padang gurun
  rationale: ישב dalam konteks ini berarti menetap atau tinggal, sedangkan מִדְבָּר menunjuk pada wilayah liar dan jarang dihuni; “padang gurun” merupakan padanan Indonesia yang lazim dan lebih luas daripada sekadar gurun pasir.
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: menjadi seorang pemanah
  rationale: Gabungan רֹבֶה dengan קַשָּׁת menggambarkan orang yang menembakkan busur. “Pemanah” adalah padanan ringkas, alami, dan tepat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Rumusan kehadiran Allah bersama Ismael
  choice: Allah menyertai anak itu
  alternative: Allah menolong anak itu
  rationale: Teks menegaskan kehadiran dan dukungan Allah tanpa menjelaskan seluruh implikasi teologisnya. “Menyertai” mempertahankan ketegangan dan keluasan ungkapan sumber, sedangkan “menolong” mempersempitnya menjadi tindakan bantuan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Allah” dipakai sebagai sebutan baku bagi אֱלֹהִים, “anak itu” sesuai konteks naratif, dan “padang gurun” mempertahankan cakupan makna wilayah liar yang jarang dihuni.
