  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: id
  text: Tetapi Allah berfirman kepada Abraham, “Janganlah engkau merasa susah karena anak itu dan karena budak perempuanmu. Dengarkanlah semua yang dikatakan Sara kepadamu,[a] sebab melalui Ishaklah keturunanmu akan disebut.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengarkanlah suaranya,” yaitu indahkanlah apa yang dikatakan Sara.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “sebab melalui Ishaklah keturunanmu akan diperhitungkan.” Ungkapan Ibraninya memakai kata “disebut” untuk penetapan keturunan Abraham melalui Ishak.
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: janganlah engkau merasa susah
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang sesuatu yang ‘buruk di matamu’, tetapi dalam konteks ini menyatakan kesusahan atau keberatan Abraham. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan bobot emosionalnya.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר dapat menunjuk anak laki-laki atau pemuda. Dalam konteks Ismael, ‘anak itu’ merupakan ungkapan modern yang wajar tanpa menentukan usia secara lebih sempit daripada teks.
- source_word: אֲמָתֶךָ
  choice: budak perempuanmu
  rationale: אָמָה menunjukkan perempuan dengan status perbudakan atau penghambaan. ‘Budak perempuanmu’ tidak melunakkan kenyataan sosial yang dinyatakan teks.
- source_word: שְׁמַע בְּקֹלָהּ
  choice: turutilah
  rationale: Ungkapan harfiahnya ialah ‘dengarkanlah suaranya’, sebuah idiom untuk mengindahkan atau mengikuti perkataan seseorang. ‘Turutilah’ menyampaikan daya idiomatisnya secara alami; bentuk harfiah dicatat dalam catatan kaki.
- source_word: בְּיִצְחָק
  choice: melalui Ishaklah
  rationale: Preposisi בְּ di sini menunjuk jalur atau sarana penetapan keturunan Abraham. ‘Melalui’ jelas dalam bahasa Indonesia, sedangkan partikel ‘-lah’ mempertahankan penekanan pada Ishak.
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: keturunan akan disebut sebagai keturunanmu
  rationale: Bentuk pasif קרא bersama לְךָ menyatakan penamaan atau penetapan keturunan yang diakui sebagai milik Abraham. Terjemahan ini mempertahankan bahasa ‘disebut’ dan tidak menyangkal hubungan biologis Ismael dengan Abraham.
- source_word: זָרַע
  choice: keturunan
  rationale: זֶרַע merupakan nomina kolektif. ‘Keturunan’ mempertahankan cakupan kolektifnya dan lebih alami daripada ‘benih’ dalam bahasa Indonesia modern.
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Tetapi Allah berfirman
  rationale: Waw memajukan alur cerita, sementara ‘tetapi’ menyatakan kontras dengan kesusahan Abraham dalam ayat sebelumnya. ‘Berfirman’ sesuai dengan ragam Indonesia yang bermartabat untuk perkataan Allah.
theological_decisions:
- issue: Status sosial Hagar
  choice: budak perempuanmu
  alternative: hamba perempuanmu
  rationale: Teks secara nyata menyebut status Hagar yang tidak bebas. ‘Budak perempuan’ mempertahankan unsur keterikatan sosial itu, sedangkan ‘hamba’ dapat terdengar lebih lunak atau hanya menunjukkan pelayanan sukarela.
- issue: Makna janji mengenai Ishak
  choice: melalui Ishaklah keturunan akan disebut sebagai keturunanmu
  alternative: melalui Ishaklah keturunanmu akan diperhitungkan
  rationale: Pilihan utama mempertahankan metafora penamaan atau pemanggilan dalam קרא, sekaligus memperjelas fungsi לְךָ. Rumusan ini menunjukkan penetapan garis janji melalui Ishak tanpa menyelesaikan ketegangan teks dengan menyangkal bahwa Ismael secara biologis adalah anak Abraham.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum, sementara idiom Ibrani dan ambiguitas pada klausa janji dijaga melalui terjemahan utama dan catatan kaki.
