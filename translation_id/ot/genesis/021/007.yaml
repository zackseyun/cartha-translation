  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: id
  text: Lalu Sara berkata, “Siapa yang pernah berkata kepada Abraham[a] bahwa Sara akan menyusui anak-anak?[b] Sebab aku telah melahirkan seorang anak laki-laki pada masa tuanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang telah memberi tahu Abraham”.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “anak-anak laki-laki”. Bentuk jamak itu digunakan secara idiomatis di sini, sedangkan klausa berikutnya secara khusus menyebut seorang anak laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu Sara berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Subjek perempuan yang tersirat dijelaskan sebagai Sara dari konteks dan dari penyebutan dirinya dalam ucapan berikutnya.
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: Siapa yang pernah berkata kepada Abraham
  rationale: Ungkapan retoris ini menyatakan rasa heran atas peristiwa yang sama sekali tidak disangka. Kata “pernah” menghasilkan ungkapan Indonesia yang alami tanpa mengubahnya menjadi pernyataan tentang kemampuan.
- source_word: הֵינִיקָה
  choice: akan menyusui
  rationale: Bentuk Hifil dari ינק berarti memberi susu atau menyusui. Dalam pertanyaan retoris ini, “akan menyusui” secara alami mengacu pada hal yang sebelumnya tidak terbayangkan.
- source_word: בָנִים
  choice: anak-anak
  rationale: Bentuk Ibrani ini secara harfiah berarti “anak-anak laki-laki,” tetapi dalam ungkapan tentang menyusui keturunan, bentuk jamaknya bersifat idiomatis. Jenis kelamin anak tertentu ditegaskan dalam klausa berikutnya.
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan yang menjelaskan seruan sebelumnya, bukan pertentangan.
- source_word: יָלַדְתִּי בֵן
  choice: aku telah melahirkan seorang anak laki-laki
  rationale: Terjemahan ini menyampaikan aspek hasil yang masih relevan dan mempertahankan keterangan eksplisit bahwa anak itu laki-laki.
- source_word: לִזְקֻנָיו
  choice: baginya pada masa tuanya
  rationale: Frasa ini mempertahankan rujukan kepada Abraham serta nuansa preposisi לְ, sambil menyatakan usia lanjutnya dalam bahasa Indonesia yang wajar.
