base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: id
  text: Lalu Sara berkata, “Allah telah mendatangkan tawa bagiku; setiap orang yang mendengar akan tertawa bersamaku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menertawakan aku,” atau, “akan tertawa karena aku.” Ungkapan Ibrani dapat memiliki beberapa nuansa, tetapi dalam konteks ini kemungkinan besar menunjuk pada orang lain yang turut bersukacita bersama Sara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif berawalan waw memajukan alur cerita; “lalu” menyatakannya secara wajar dalam bahasa Indonesia tanpa memberi tekanan berlebihan pada konjungsi.
- source_word: שָׂרָה
  choice: Sara
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: צְחֹק
  choice: tawa
  rationale: Nomina ini berarti “tawa”. Bentuk nomina dipertahankan agar permainan kata dengan יִצְחַק, “akan tertawa”, tetap tampak.
- source_word: עָשָׂה לִי
  choice: telah mendatangkan ... bagiku
  rationale: Secara harfiah berarti “telah membuat ... bagiku”. “Mendatangkan ... bagiku” menyampaikan bahwa Allah menyebabkan Sara mengalami tawa dengan bahasa Indonesia yang alami, tanpa mengubah tawa menjadi sekadar perasaan abstrak.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang esa dan bertindak bagi Sara; “Allah” adalah padanan baku dalam Alkitab bahasa Indonesia.
- source_word: כָּל הַשֹּׁמֵעַ
  choice: setiap orang yang mendengar tentang hal ini
  rationale: Ungkapan berbentuk tunggal ini bersifat distributif. Objek yang tersirat dijelaskan secara ringan sebagai berita tentang peristiwa tersebut agar kalimat alami dalam bahasa Indonesia.
- source_word: יִצְחַק
  choice: akan tertawa
  rationale: Kata kerja ini berasal dari akar yang sama dengan צְחֹק dan berkaitan dengan nama Ishak. Padanan “tertawa” mempertahankan permainan kata itu.
- source_word: לִי
  choice: bersamaku
  rationale: Preposisi ini secara dasar berarti “kepadaku/bagiku”, tetapi sesudah kata “tertawa” dapat memiliki beberapa nuansa. Dalam konteks kelahiran Ishak, “bersamaku” paling wajar menyatakan orang lain turut dalam sukacita Sara.
theological_decisions:
- issue: Makna יִצְחַק לִי pada klausa terakhir
  choice: 'tawa sukacita bersama: “akan tertawa bersamaku”'
  alternative: “akan menertawakan aku” atau “akan tertawa karena aku”
  rationale: Konteksnya adalah sukacita Sara atas kelahiran Ishak, sehingga partisipasi dalam tawanya paling mungkin dimaksudkan. Namun, konstruksi Ibrani tetap memungkinkan nuansa lain; karena itu, ketaksaan yang sungguh ada dipertahankan dalam catatan kaki dan tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pasangan “tawa—tertawa” sengaja dipertahankan untuk mencerminkan permainan kata Ibrani yang juga berkaitan dengan nama Ishak. Ambiguitas pada לִי dicatat tanpa membebani teks utama.
