base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: id
  text: Lalu Abraham mengambil domba dan sapi, lalu memberikan domba dan sapi itu kepada Abimelekh. Kemudian mereka berdua mengadakan perjanjian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian,” sebuah ungkapan baku dalam bahasa Ibrani untuk mengadakan perjanjian secara resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk wayyiqtol Qal dari לקח menyatakan tindakan berurutan dengan arti biasa “mengambil”; “lalu” mempertahankan alur naratif.
- source_word: צֹאן
  choice: domba
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing. “Domba” merupakan padanan yang ringkas dan alami dalam pasangan dengan sapi, tanpa menambahkan jenis ternak yang tidak disebutkan secara tersendiri.
- source_word: וּבָקָר
  choice: dan sapi
  rationale: בָּקָר menunjuk pada ternak besar, khususnya sapi; “sapi” adalah padanan Indonesia yang alami dalam konteks ini.
- source_word: וַיִּתֵּן
  choice: lalu memberikannya
  rationale: נתן berarti “memberikan.” Akhiran “-nya” secara alami merujuk kembali pada domba dan sapi, sedangkan “lalu” mempertahankan urutan tindakan.
- source_word: לַאֲבִימֶלֶךְ
  choice: kepada Abimelekh
  rationale: Prefiks ל diterjemahkan “kepada,” dan nama Ibrani ditransliterasikan sebagai “Abimelekh.”
- source_word: שְׁנֵיהֶם
  choice: mereka berdua
  rationale: Ungkapan ini secara eksplisit menunjuk pada kedua pihak, yaitu Abraham dan Abimelekh.
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah idiom Ibrani ini berarti “memotong perjanjian.” Ungkapan Indonesia “mengikat perjanjian” menyampaikan tindakan resmi membuat perjanjian secara alami sambil mempertahankan nuansa ikatan formal.
- source_word: בְּרִית
  choice: perjanjian
  rationale: “Perjanjian” mempertahankan istilah utama Alkitab untuk בְּרִית dan sesuai dengan konteks kesepakatan resmi antara kedua pihak.
theological_decisions:
- issue: Penerjemahan idiom perjanjian כרת ברית
  choice: mengikat perjanjian
  alternative: memotong perjanjian; membuat perjanjian
  rationale: “Mengikat perjanjian” alami dan bermartabat dalam bahasa Indonesia serta menyatakan pembentukan perjanjian resmi. Arti harfiah idiom Ibraninya dipertahankan dalam catatan kaki agar gambaran sumber tetap transparan tanpa membuat teks utama terasa janggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan “lalu” mencerminkan rangkaian tindakan dalam teks Ibrani, sementara “kemudian” memberi transisi yang wajar menuju tindakan bersama kedua pihak.
