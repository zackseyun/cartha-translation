  naturalness: Bahasa keseluruhan baku dan alami. “Yang telah dilahirkan Hagar bagi Abraham” lebih jelas dalam prosa Indonesia daripada “yang telah dilahirkannya bagi Abraham,” terutama karena klausa itu berada setelah rangkaian aposisi.
