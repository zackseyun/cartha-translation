base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: id
  text: Sara melihat anak Hagar, perempuan Mesir itu, yang telah dilahirkan Hagar bagi Abraham, sedang tertawa[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sedang bermain-main” atau “sedang mengejek.” Partisipel Ibrani ini dapat menunjukkan tindakan tertawa, bermain-main, atau perilaku bernada mencemooh; konteksnya mungkin menyiratkan nuansa permusuhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Sara melihat
  rationale: Bentuk wayyiqtol dari ראה melanjutkan urutan peristiwa dalam narasi. Dalam bahasa Indonesia, urutan itu dapat disampaikan secara alami tanpa harus menambahkan kata penghubung.
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: anak Hagar, perempuan Mesir itu
  rationale: Frasa konstruksi beserta gentilisinya mengidentifikasi anak itu melalui ibunya. Ungkapan 'perempuan Mesir itu' jelas dan alami dalam bahasa Indonesia serta mempertahankan identifikasi dalam teks Ibrani.
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: yang telah dilahirkannya bagi Abraham
  rationale: Klausa relatif ini merujuk kembali kepada Hagar sebagai ibu anak tersebut. Kata 'telah' menandai bahwa kelahiran terjadi sebelum Sara melihatnya, sedangkan 'bagi Abraham' menyampaikan fungsi לְ secara wajar.
- source_word: מְצַחֵק
  choice: sedang tertawa
  rationale: Partisipel dari צחק dapat berarti tertawa, bermain-main, atau—menurut konteks—mengejek. 'Sedang tertawa' mempertahankan arti leksikal yang lebih terbuka tanpa menetapkan nuansa permusuhan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna tindakan anak Hagar dalam מְצַחֵק
  choice: Menerjemahkannya secara netral sebagai 'sedang tertawa' dalam teks utama
  alternative: sedang mengejek; sedang bermain-main
  rationale: Partisipel Ibrani tidak menyebut objek dan tidak dengan sendirinya menetapkan tindakan bermusuhan. Konteks dan penafsiran kanonis kemudian dapat mendukung nuansa mengejek, tetapi ambiguitas ayat ini perlu dipertahankan; karena itu alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Struktur dibuat jelas bagi pembaca umum, sementara ambiguitas leksikal מְצַחֵק tetap dipertahankan melalui teks utama dan catatan kaki.
