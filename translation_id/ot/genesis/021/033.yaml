base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: id
  text: Ia menanam sebatang pohon tamariska di Bersyeba, dan di sana ia berseru kepada Yahweh[a], Allah Yang Kekal.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ‘ia berseru dengan nama Yahweh’. Dapat juga diterjemahkan ‘ia menyerukan nama Yahweh’ atau ‘ia memanggil nama Yahweh’. Ungkapan Ibrani ini dapat mencakup pemberitaan maupun pemanggilan nama-Nya dalam konteks ibadah.
    reason: lexical_alternative
  - marker: b
    text: Atau ‘Allah Abadi’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: menanam
  rationale: Bentuk Qal dari נטע secara lazim berarti ‘menanam’; pilihan ini langsung dan alami dalam konteks pohon.
- source_word: אֶשֶׁל
  choice: sebatang pohon tamariska
  rationale: Nomina tunggal ini kemungkinan menunjuk pada pohon tamariska, bukan hutan kecil; penambahan penggolong ‘sebatang’ menghasilkan bahasa Indonesia yang alami.
- source_word: בִּבְאֵר שָׁבַע
  choice: di Bersyeba
  rationale: Preposisi ב menyatakan lokasi. ‘Bersyeba’ adalah bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: dan di sana ia berseru kepada nama
  rationale: Ungkapan קרא בשם dalam konteks ini berkaitan dengan ibadah dan dapat mencakup seruan kepada Allah maupun pemberitaan nama-Nya. ‘Berseru kepada nama’ mempertahankan bentuk idiomatis serta arah utama berupa permohonan atau penyembahan, sementara catatan kaki menjaga kemungkinan lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֵל עוֹלָם
  choice: Allah Yang Kekal
  rationale: עוֹלָם di sini menerangkan אֵל dan menyatakan keberadaan yang berlangsung selama-lamanya. ‘Allah Yang Kekal’ alami dalam bahasa Indonesia serta mempertahankan daya gelarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Transliterasi ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna formula ibadah קרא בשם יהוה
  choice: berseru kepada nama Yahweh
  alternative: menyerukan nama Yahweh atau memanggil nama Yahweh
  rationale: Ungkapan ini dapat menunjuk pada pemanggilan nama Allah dalam ibadah sekaligus pemberitaan nama-Nya. Teks utama mengikuti nuansa seruan kepada Allah, sedangkan catatan kaki mempertahankan keluasan makna sumber.
- issue: Nuansa אֵל עוֹלָם
  choice: Allah Yang Kekal
  alternative: Allah Abadi atau Allah yang selama-lamanya
  rationale: Pilihan utama menyatakan keberlangsungan tanpa akhir dengan bentuk gelar yang alami, tanpa menentukan secara sempit apakah עוֹלָם menekankan kekekalan metafisis atau durasi yang tidak berkesudahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat tetap dekat dengan susunan Ibrani, tetapi memakai penggolong ‘sebatang’ dan bentuk lokasi ‘di Bersyeba’ agar alami bagi pembaca umum. Kedua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
