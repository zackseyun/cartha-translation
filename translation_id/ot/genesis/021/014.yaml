  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: id
  text: Pagi-pagi Abraham bangun. Ia mengambil roti dan sebuah kantong kulit berisi air, lalu memberikan bekal itu kepada Hagar sambil menaruhnya di atas bahunya. Ia juga menyerahkan anak itu kepadanya[a], lalu menyuruhnya pergi. Hagar pun pergi dan mengembara di padang belantara Bersyeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “menaruh [itu/mereka] di atas bahunya, dan anak itu.” Susunannya padat dan dapat pula dipahami, “menaruh bekal itu di atas bahunya dan menyerahkan anak itu kepadanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Keesokan paginya, Abraham bangun pagi-pagi
  rationale: Bentuk Hifil שׁכם menyatakan bangun atau bertindak pagi-pagi, sedangkan בַּבֹּקֶר memberi latar waktu. 'Keesokan paginya' wajar dalam alur narasi dan 'bangun pagi-pagi' mempertahankan penekanannya.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna dasarnya ialah 'roti'; konteks tidak mengharuskan perluasan menjadi 'makanan'.
- source_word: חֵמַת מַיִם
  choice: sebuah kantong kulit berisi air
  rationale: חֵמֶת adalah wadah dari kulit untuk cairan. Ungkapan ini jelas bagi pembaca modern tanpa memberi kesan botol modern.
- source_word: וַיִּתֵּן אֶל־הָגָר
  choice: memberikannya kepada Hagar
  rationale: Pronomina tunggal kolektif merujuk pada bekal yang baru disebutkan dan menghasilkan bahasa Indonesia yang lancar.
- source_word: שָׂם עַל־שִׁכְמָהּ
  choice: dengan menaruhnya di atas bahunya
  rationale: Partisipel שָׂם dipahami secara sirkumstansial, menjelaskan cara Abraham memberikan bekal itu kepada Hagar.
- source_word: וְאֶת־הַיֶּלֶד
  choice: Ia juga menyerahkan anak itu kepadanya
  rationale: Bahasa Ibrani hanya menambahkan 'dan anak itu' dalam susunan yang padat. Penambahan verba tersirat membuat hubungan sintaksisnya jelas tanpa menyatakan bahwa anak itu ditaruh di bahu Hagar.
- source_word: וַיְשַׁלְּחֶהָ
  choice: lalu menyuruhnya pergi
  rationale: Menyampaikan tindakan mengirim Hagar pergi secara alami dan tetap khidmat dalam bahasa Indonesia.
- source_word: וַתֵּתַע
  choice: mengembara
  rationale: תעה berarti berkeliaran, mengembara, atau tersesat. 'Mengembara' mempertahankan kemungkinan makna tanpa memastikan bahwa Hagar kehilangan arah.
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: di padang belantara Bersyeba
  rationale: מִדְבָּר menunjuk wilayah liar dan gersang, tidak selalu gurun pasir. 'Bersyeba' merupakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sintaksis antara 'anak itu' dan frasa 'menaruhnya di atas bahunya'
  choice: Bekal ditaruh di bahu Hagar, sedangkan anak itu diserahkan kepadanya sebelum ia disuruh pergi.
  alternative: Teks dapat dibaca lebih harfiah sebagai 'menaruhnya di atas bahunya, dan anak itu,' atau dipahami seakan-akan anak itu juga ditaruh di bahunya.
  rationale: Susunan Ibrani sangat padat dan objek serta relasinya tidak seluruhnya diungkapkan. Konteks naratif menunjukkan bahwa Ismael bukan bayi kecil, sehingga terjemahan yang secara tegas menaruh anak itu di bahu Hagar berpotensi menyesatkan. Catatan kaki mempertahankan keterbukaan sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. 'Padang belantara' dipilih untuk menghindari gambaran sempit tentang gurun pasir. Penanda catatan kaki ditempatkan tepat pada bagian yang memiliki ketaksaan sintaksis.
