  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/מְּעָרָ֞ה אֲשֶׁ֨ר בִּ/שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל פְּנֵי מַמְרֵ֖א בְּ/אֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת הַ/שָּׂדֶ֗ה מֵ/אֵ֛ת עֶפְרֹ֥ן הַ/חִתִּ֖י לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/030.yaml
  text: in the cave that is in the field of Machpelah[a], which is opposite Mamre, in the land of Canaan[d][c][b], which Abraham bought with the field from Ephron the Hittite as a burial property.
translation:
  language: id
  text: di dalam gua yang ada di ladang Makhpela, yang berhadapan dengan Mamre[a], di tanah Kanaan—ladang yang dibeli Abraham dari Efron, orang Het itu, sebagai tanah milik untuk tempat pemakaman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan "di seberang Mamre" atau "di hadapan Mamre"; ungkapan Ibraninya menunjukkan letak ladang dalam hubungannya dengan Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמְּעָרָה
  choice: di dalam gua
  rationale: Prefiks בְּ menyatakan lokasi, dan "gua" merupakan padanan Indonesia modern yang wajar bagi מְעָרָה.
- source_word: בִּשְׂדֵה הַמַּכְפֵּלָה
  choice: di ladang Makhpela
  rationale: Frasa ini menunjukkan lokasi gua. Nama tempat הַמַּכְפֵּלָה ditransliterasikan sebagai "Makhpela".
- source_word: עַל פְּנֵי מַמְרֵא
  choice: yang berhadapan dengan Mamre
  rationale: Ungkapan spasial ini menempatkan ladang dalam hubungan lokasi dengan Mamre. "Berhadapan dengan" mempertahankan gambaran dasarnya tanpa mempersempitnya menjadi sekadar kedekatan.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Terjemahan geografis langsung dan lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: ladang yang dibeli Abraham
  rationale: Bahasa Ibrani menyebut הַשָּׂדֶה sebagai objek langsung dari "membeli". Susunan ulang ini mempertahankan objek tersebut dengan jelas dan menghindari kesan bahwa teks hanya mengatakan gua dibeli "bersama" ladang.
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: dari Efron, orang Het itu
  rationale: מֵאֵת menandai pihak penjual atau sumber transaksi; sebutan etnis הַחִתִּי diterjemahkan secara alami sebagai "orang Het itu".
- source_word: לַאֲחֻזַּת קָבֶר
  choice: sebagai tanah milik untuk tempat pemakaman
  rationale: אֲחֻזָּה mengandung nuansa kepemilikan yang sah dan tetap, sedangkan קֶבֶר menunjuk pada penguburan atau makam. Pilihan ini mempertahankan baik fungsi pemakaman maupun sifat hukumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur klausa Ibrani yang panjang ditata dengan tanda pisah agar hubungan antara gua, ladang, dan transaksi pembelian tetap jelas tanpa menghilangkan kesinambungan ayat dengan perintah pada ayat sebelumnya.
