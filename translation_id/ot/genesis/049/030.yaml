  source_fidelity: Teks secara tepat menerjemahkan lokasi gua di ladang Makhpela, hubungannya dengan Mamre, lokasinya di tanah Kanaan, serta fakta bahwa ladang itu dibeli Abraham dari Efron, orang Het, untuk menjadi milik pemakaman. Penyusunan ulang klausa relatif Ibrani menjadi “ladang yang dibeli Abraham” tepat dan menghindari kekeliruan audit Inggris yang menjadikan “ladang” sebagai frasa preposisional.
