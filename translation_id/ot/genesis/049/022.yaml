  text: Joseph is a fruitful son[a], a fruitful son by a spring[b]; daughters step over the wall.
translation:
  language: id
  text: Yusuf adalah putra yang berbuah lebat[a], putra yang berbuah lebat di dekat mata air; putri-putri[b] melangkah melampaui tembok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yusuf adalah cabang yang berbuah lebat, cabang yang berbuah lebat di dekat mata air.” Bahasa Ibraninya puitis dan padat; terjemahan “cabang” menafsirkan gambarannya dengan lebih terang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putri-putri.” Dalam gambaran puitis ini, kata tersebut mungkin mengacu secara kiasan kepada cabang-cabang atau tunas-tunas yang menjulur melampaui tembok.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן פֹּרָת
  choice: anak yang berbuah lebat
  rationale: Mempertahankan arti biasa בֵּן, yaitu 'anak', dan daya adjektival פֹּרָת dari akar פרה, 'berbuah'. Ungkapan Ibrani ini puitis dan padat; 'berbuah lebat' terdengar lebih alami dalam bahasa Indonesia daripada 'subur' sekaligus menjaga citra buah.
- source_word: עֲלֵי עָיִן
  choice: di dekat mata air
  rationale: עַיִן dapat berarti 'mata' atau 'mata air'. Dalam konteks berbuah dan kelimpahan, 'mata air' paling sesuai, sedangkan עֲלֵי diungkapkan secara lokatif dan alami sebagai 'di dekat'.
- source_word: בָּנוֹת
  choice: putri-putrinya
  rationale: Arti leksikalnya ialah 'putri-putri'. Akhiran kepunyaan disediakan secara alami dalam bahasa Indonesia untuk menghubungkannya dengan Yusuf; gambaran puitisnya tidak langsung diubah menjadi 'cabang-cabang' atau 'tunas-tunas'.
- source_word: צָעֲדָה
  choice: melangkah
  rationale: Kata kerja ini menyatakan gerak melangkah atau berjalan dengan langkah. Bentuk Ibraninya tunggal meskipun subjeknya jamak, suatu konstruksi puitis yang tidak perlu ditiru secara tidak gramatikal dalam bahasa Indonesia.
- source_word: עֲלֵי שׁוּר
  choice: melampaui tembok
  rationale: שׁוּר paling tepat dipahami sebagai 'tembok'. 'Melampaui' menyampaikan gerak melewati batas tembok dan lebih idiomatis dengan 'melangkah' daripada 'di atas tembok'.
