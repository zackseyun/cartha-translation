  source_fidelity: 'Terjemahan pada umumnya setia pada teks Ibrani: Yehuda dipertahankan sebagai nama diri; יוֹדוּךָ diterjemahkan tepat sebagai pujian; citra tangan di tengkuk musuh tetap konkret; dan יִשְׁתַּחֲווּ diterjemahkan sebagai sujud, bukan ibadah. Namun, “anak-anak ayahmu” memperluas בְּנֵי אָבִיךָ (‘putra-putra/anak-anak lelaki ayahmu’) menjadi istilah yang dalam bahasa Indonesia lazimnya mencakup anak perempuan juga. Revisi diperlukan untuk mempertahankan rujukan maskulin eksplisit dalam konteks saudara-saudara Yehuda.'
