  yaml_path: translation/ot/genesis/049/008.yaml
  text: Judah[a], your brothers will praise you; your hand will be on the neck of your enemies[b]; the sons of your father will bow down to you.
translation:
  language: id
  text: Yehuda[a], saudara-saudaramu akan memujimu; tanganmu akan berada di tengkuk musuh-musuhmu; putra-putra ayahmu akan sujud kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yehuda berkaitan bunyi dengan kata Ibrani yang diterjemahkan “memujimu”; kata itu juga dapat berarti “mengucap syukur kepadamu” atau “mengakui engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama diri Ibrani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia dan tetap mendukung permainan bunyi dengan kata kerja berikutnya.
- source_word: יוֹדוּךָ
  choice: akan memujimu
  rationale: Bentuk hifil dari ידה di sini menyatakan pujian atau pengakuan hormat. 'Memujimu' paling sesuai dengan konteks berkat dan mempertahankan kaitan bunyi dengan nama Yehuda.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Bentuk jamak maskulin dengan sufiks orang kedua tunggal merujuk pada saudara-saudara lelaki Yehuda dalam konteks anak-anak Yakub; bentuk Indonesia ini alami tanpa memperluas acuannya.
- source_word: יָדְךָ בְּעֹרֶף אֹיְבֶיךָ
  choice: tanganmu akan berada di tengkuk musuh-musuhmu
  rationale: Citra konkret tangan pada tengkuk dipertahankan sebagai gambaran kuasa dan kemenangan, tanpa menggantinya dengan penafsiran abstrak.
- source_word: יִשְׁתַּחֲווּ לְךָ
  choice: akan sujud kepadamu
  rationale: Kata kerja ini dapat menunjukkan tindakan membungkuk atau bersujud sebagai penghormatan maupun penyembahan. Dalam konteks keluarga dan kerajaan, 'sujud kepadamu' mempertahankan tindakan serta nuansa ketundukan tanpa menyatakannya sebagai ibadah ilahi.
- source_word: בְּנֵי אָבִיךָ
  choice: anak-anak ayahmu
  rationale: Secara harfiah berarti 'anak-anak lelaki ayahmu'. Dalam konteks ini acuannya ialah saudara-saudara Yehuda; 'anak-anak ayahmu' mempertahankan susunan ungkapan Ibrani dan terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna bahasa penghormatan dalam יִשְׁתַּחֲווּ לְךָ
  choice: Sujud sebagai ketundukan atau penghormatan kepada pemimpin manusia
  alternative: Menyembah dalam arti ibadah
  rationale: Yang disapa adalah Yehuda dalam berkat Yakub. Karena itu, terjemahan tidak mengimpor klaim bahwa Yehuda menerima penyembahan ilahi, tetapi tetap mempertahankan nuansa penghormatan dan ketundukan yang kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Paralelisme puitis dipertahankan dengan klausa-klausa ringkas; citra tubuh dan bahasa ketundukan tidak diperhalus atau dijelaskan di dalam teks utama.
