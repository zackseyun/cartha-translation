  terminology: “Yehuda,” “memujimu,” “tengkuk,” dan “sujud kepadamu” sesuai. “Sujud” di sini wajar untuk penghormatan/ketundukan manusia dan tidak dengan sendirinya menetapkan penyembahan ilahi. “Putra-putra ayahmu” menggantikan “anak-anak ayahmu” agar istilah tersebut mencerminkan בני, bentuk maskulin jamak.
