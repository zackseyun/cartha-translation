  text: Gad—a raiding band will raid him[b][a], but he will raid at their heels.
translation:
  language: id
  text: Gad—gerombolan penyerbu akan menyerbunya, tetapi ia akan menyerbu dari belakang mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani terdapat permainan kata pada Gad, “gerombolan penyerbu,” dan “menyerbu” (gad / gedud / yagud).
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia akan menyerbu tumit.” Frasa ini dapat berarti menyerang di belakang mereka atau mengejar mereka dari belakang.
    reason: alternative_reading
lexical_decisions:
- source_word: גָּד
  choice: Gad
  rationale: Nama putra Yakub sekaligus suku; ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: גְּדוּד
  choice: gerombolan perampok
  rationale: Kata benda ini menunjuk pada kelompok penyerbu atau perampok. Pilihan ini alami dalam bahasa Indonesia dan memungkinkan gema bunyi serta makna akar גדד dipertahankan melalui kata 'merampok'.
- source_word: יְגוּדֶנּוּ
  choice: akan merampoknya
  rationale: Bentuk imperfek Qal dengan akhiran objek orang ketiga tunggal; dalam konteks גְּדוּד, maknanya adalah melakukan serangan perampasan terhadap Gad.
- source_word: וְהוּא
  choice: tetapi ia
  rationale: 'Waw secara harfiah dapat berarti ''dan'', tetapi di sini hubungan antarklausa bersifat kontras: Gad mula-mula menjadi sasaran, kemudian membalas.'
- source_word: יָגֻד
  choice: akan menyerang
  rationale: Berasal dari akar yang sama dengan verba sebelumnya. 'Menyerang' dipilih pada klausa balasan agar frasa dengan עָקֵב terdengar alami, sementara permainan kata Ibrani dijelaskan dalam catatan.
- source_word: עָקֵב
  choice: dari belakang mereka
  rationale: Secara harfiah berarti 'tumit'; dalam konteks ini kemungkinan menunjuk pada serangan atau pengejaran dari arah belakang. Pronomina jamak tersirat dari gerombolan kolektif dalam klausa pertama.
