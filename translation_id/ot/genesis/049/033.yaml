id: GEN.49.33
reference: Genesis 49:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְכַ֤ל יַעֲקֹב֙ לְ/צַוֺּ֣ת אֶת בָּנָ֔י/ו וַ/יֶּאֱסֹ֥ף רַגְלָ֖י/ו אֶל הַ/מִּטָּ֑ה וַ/יִּגְוַ֖ע וַ/יֵּאָ֥סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/033.yaml
  text: When Jacob finished commanding his sons[a], he drew his feet up into the bed, breathed his last[b], and was gathered to his people.
translation:
  language: id
  text: Setelah Yakub selesai memberi perintah kepada putra-putranya, ia menarik kedua kakinya ke atas tempat tidur[a], mengembuskan napas terakhir, lalu dikumpulkan kepada kaumnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mengumpulkan kedua kakinya ke tempat tidur.” Bahasa Ibrani memakai kata yang berarti “mengumpulkan.”
    reason: lexical_alternative
  - marker: b
    text: “Dikumpulkan kepada kaumnya” adalah ungkapan Ibrani yang berkaitan dengan kematian dan perhimpunan dengan kaum sendiri; ungkapan ini bukan sekadar pemberitahuan bahwa seseorang telah dikuburkan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְכַל
  choice: selesai
  rationale: Menandai selesainya tindakan Yakub dalam rangkaian narasi secara alami dan tepat.
- source_word: לְצַוֺּת
  choice: memberi perintah
  rationale: Menjaga makna dasar צוה sebagai memberi perintah atau amanat dengan ungkapan Indonesia yang wajar.
- source_word: בָּנָיו
  choice: putra-putranya
  rationale: Teks Ibrani secara khusus menyebut anak-anak lelaki Yakub; 'putra-putranya' mempertahankan kekhususan itu.
- source_word: וַיֶּאֱסֹף רַגְלָיו אֶל הַמִּטָּה
  choice: ia menarik kedua kakinya ke atas tempat tidur
  rationale: Menyampaikan gerakan yang dimaksud secara alami dalam bahasa Indonesia, sambil mencatat gambaran harfiahnya dalam catatan kaki.
- source_word: הַמִּטָּה
  choice: tempat tidur
  rationale: Padanan yang paling langsung dan lazim untuk מִטָּה dalam adegan menjelang kematian ini.
- source_word: וַיִּגְוַע
  choice: mengembuskan napas terakhir
  rationale: Mempertahankan nuansa גוע sebagai berakhirnya hidup tanpa meleburkannya dengan klausa idiomatis berikutnya.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: dikumpulkan kepada kaumnya
  rationale: Mempertahankan citra pasif dan ungkapan khas Ibrani tanpa menyamakannya hanya dengan penguburan atau menjelaskan secara berlebihan keadaan sesudah kematian.
theological_decisions:
- issue: Makna 'dikumpulkan kepada kaumnya'
  choice: Ungkapan idiomatis dipertahankan dan tidak direduksi menjadi pemberitahuan tentang penguburan.
  alternative: dikuburkan bersama leluhurnya; bergabung dengan nenek moyangnya
  rationale: Penguburan Yakub baru terjadi dalam pasal berikutnya. Karena itu, frasa ini tidak boleh diterjemahkan seolah-olah hanya berarti penguburan. Bentuk idiomatis mempertahankan ketegangan teks mengenai kematian dan perhimpunan dengan kaum sendiri tanpa menetapkan rincian yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Putra-putranya' dipakai untuk mempertahankan rujukan khusus kepada anak-anak lelaki Yakub. Idiom penutup dipertahankan agar ambiguitas dan bobot teologis teks sumber tidak diratakan.
