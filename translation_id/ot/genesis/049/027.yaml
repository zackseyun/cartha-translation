source:
  edition: WLC
  text: בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּ/בֹּ֖קֶר יֹ֣אכַל עַ֑ד וְ/לָ/עֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/027.yaml
  text: Benjamin is a ravenous wolf[a]; in the morning he devours the prey[d][c][b], and in the evening he divides the spoil.
translation:
  language: id
  text: Benyamin adalah serigala yang menerkam[a]; pada pagi hari ia melahap mangsa[b], dan pada petang hari ia membagi-bagikan jarahan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “serigala yang mencabik-cabik”; kata kerja Ibrani menggambarkan tindakan pemangsa yang merobek mangsanya.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “mangsa” juga dapat berarti “jarahan” atau “rampasan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “rampasan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְיָמִין
  choice: Benyamin
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: זְאֵב יִטְרָף
  choice: serigala yang menerkam
  rationale: זְאֵב berarti 'serigala', sedangkan יִטְרָף menggambarkan tindakan pemangsa yang menerkam atau mencabik mangsanya. Ungkapan ini mempertahankan metafora dan terdengar alami dalam bahasa Indonesia.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Padanan temporal yang alami dan sejajar dengan 'pada petang hari'.
- source_word: יֹאכַל
  choice: ia melahap
  rationale: Arti dasarnya ialah 'makan', tetapi dalam gambaran serigala pemangsa, 'melahap' menyampaikan daya puitis konteks dengan tepat.
- source_word: עַד
  choice: mangsa
  rationale: Dalam gambaran serigala, 'mangsa' merupakan padanan kontekstual yang paling wajar, sambil mempertahankan kemungkinan arti yang lebih luas dalam catatan kaki.
- source_word: וְלָעֶרֶב
  choice: dan pada petang hari
  rationale: Mempertahankan hubungan koordinatif dan kesejajaran waktu dengan frasa sebelumnya.
- source_word: יְחַלֵּק שָׁלָל
  choice: ia membagi-bagikan jarahan
  rationale: יְחַלֵּק berarti membagi atau membagikan, sedangkan שָׁלָל ialah hasil rampasan dalam konflik. Bentuk ulang 'membagi-bagikan' menyatakan pembagian kepada beberapa pihak secara alami.
theological_decisions:
- issue: Makna metaforis berkat Yakub atas Benyamin
  choice: Mempertahankan gambaran puitis tentang keganasan pemangsa dan pembagian hasil kemenangan tanpa menentukan penggenapan historis tertentu.
  alternative: Menafsirkannya secara eksplisit sebagai nubuat tentang riwayat perang suku Benyamin.
  rationale: Teks Ibrani sendiri menyajikan metafora puitis dan tidak menyebut tokoh, peristiwa, atau penggenapan historis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis tanpa menjadi arkais. Kesejajaran antara pagi dan petang dipertahankan, demikian pula peralihan gambaran dari serigala pemangsa kepada pembagian jarahan.
