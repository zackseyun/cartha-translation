  yaml_path: translation/ot/genesis/049/021.yaml
  text: Naphtali is a doe let loose[b][a], giving beautiful words.
translation:
  language: id
  text: Naftali adalah rusa betina yang dilepas[a]; ia mengucapkan kata-kata indah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rusa betina yang dibiarkan lepas”; gambaran Ibraninya ialah seekor rusa betina yang dilepas agar dapat berlari bebas.
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir ini telah dipahami dengan berbagai cara, antara lain “yang menyampaikan ucapan-ucapan indah”; dengan pemaknaan lain yang diajukan untuk kata-kata terakhir, frasa itu juga diterjemahkan “yang melahirkan anak-anak rusa yang elok.”
    reason: alternative_reading
lexical_decisions:
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama pribadi sekaligus nama suku; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַיָּלָה
  choice: rusa betina
  rationale: Kata ini menunjuk pada rusa betina. Pilihan ini jelas bagi pembaca modern dan mempertahankan citra feminin dalam bahasa Ibrani.
- source_word: שְׁלֻחָה
  choice: dilepas bebas
  rationale: Bentuk pasif dari שלח menggambarkan seekor rusa yang dilepaskan sehingga dapat berlari bebas; frasa ini mempertahankan unsur pelepasan dan kebebasan geraknya.
- source_word: הַנֹּתֵן
  choice: ia mengucapkan
  rationale: Partisip maskulin tunggal ini paling wajar dipahami sebagai kelanjutan deskripsi tentang Naftali. Kata ganti 'ia' mempertahankan kekompakan puisi tanpa memaksa klausa itu merujuk kepada rusa betina.
- source_word: אִמְרֵי
  choice: perkataan-perkataan
  rationale: Bentuk jamak konstruksi ini berarti perkataan, ucapan, atau tuturan; 'perkataan-perkataan' mempertahankan bentuk jamak dan nuansa ujaran.
- source_word: שָׁפֶר
  choice: indah
  rationale: Kata ini menyatakan keindahan atau keelokan; 'indah' alami dalam bahasa Indonesia dan sesuai dengan konteks puitis.
theological_decisions:
- issue: Subjek sintaksis klausa partisipial terakhir
  choice: Klausa 'ia mengucapkan perkataan-perkataan indah' dipahami merujuk kepada Naftali, sementara gambaran rusa betina berfungsi sebagai metafora.
  alternative: Klausa terakhir dapat dipahami sebagai kelanjutan langsung gambaran rusa betina, atau—berdasarkan pemaknaan lain atas kata-kata terakhir—sebagai rusa yang melahirkan anak-anak rusa yang elok.
  rationale: Teks Ibrani bersifat ringkas dan puitis. Penandaan Masoret mendukung arti 'mengucapkan perkataan-perkataan indah', sedangkan bentuk partisip maskulin dapat merujuk kembali kepada Naftali. Catatan kaki mempertahankan adanya penafsiran alternatif tanpa memasukkannya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan puitis. Tanda titik koma membantu menunjukkan bahwa klausa terakhir kembali menerangkan Naftali, tetapi catatan kaki tetap mempertahankan ambiguitas penafsirannya.
