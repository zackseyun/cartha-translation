id: GEN.49.7
reference: Genesis 49:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָר֤וּר אַפָּ/ם֙ כִּ֣י עָ֔ז וְ/עֶבְרָתָ֖/ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣/ם בְּ/יַעֲקֹ֔ב וַ/אֲפִיצֵ֖/ם בְּ/יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/007.yaml
  text: Cursed be their anger[a], for it is fierce, and their wrath, for it is harsh. I will divide them in Jacob and scatter them in Israel.
translation:
  language: id
  text: Terkutuklah kemarahan mereka[a], sebab begitu ganas, dan murka mereka, sebab begitu kejam. Aku akan membagi-bagi mereka di antara keturunan Yakub dan menyerakkan mereka di antara keturunan Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Terkutuklah kemarahan mereka, sebab kuat, dan murka mereka, sebab keras.”
    reason: Alternatif ini mempertahankan arti yang lebih harfiah dari עָז dan קָשָׁתָה, yang juga dapat berarti "kuat" dan "keras".
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Partisip pasif ini berfungsi sebagai pernyataan kutuk. Bentuk "Terkutuklah" mempertahankan daya pengucapan puitis dan tidak mengalihkan kutuk kepada pribadi Simeon dan Lewi.
- source_word: אַפָּם
  choice: kemarahan mereka
  rationale: Walaupun secara etimologis berkaitan dengan hidung atau lubang hidung, dalam konteks ini ungkapan tersebut berarti kemarahan.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi pernyataan kutuk dan terdengar alami dalam puisi Indonesia.
- source_word: עָז
  choice: begitu ganas
  rationale: Kata ini menyatakan kekuatan atau kedahsyatan. Untuk kemarahan yang menghasilkan kekerasan, "ganas" menyampaikan intensitas destruktifnya.
- source_word: וְעֶבְרָתָם
  choice: dan murka mereka
  rationale: עֶבְרָה menunjuk pada amarah yang meluap. "Murka" mempertahankan ragam bahasa yang luhur dan puitis.
- source_word: קָשָׁתָה
  choice: begitu kejam
  rationale: Bentuk ini menyatakan bahwa murka tersebut keras atau bengis. Dalam konteks kekerasan Simeon dan Lewi, "kejam" secara alami menyampaikan sifat moral tindakan itu; catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: אֲחַלְּקֵם
  choice: Aku akan membagi-bagi mereka
  rationale: Bentuk piel orang pertama tunggal dengan sufiks orang ketiga jamak menyatakan pembagian mereka sebagai kelompok. Reduplikasi "membagi-bagi" menegaskan penyebaran ke berbagai bagian dan membedakannya dari verba berikutnya.
- source_word: בְּיַעֲקֹב
  choice: di antara keturunan Yakub
  rationale: Yakub dipakai secara kolektif bagi umat yang berasal darinya. Penambahan "keturunan" membuat maksud itu jelas dalam bahasa Indonesia tanpa menyamakan nama Yakub dan Israel.
- source_word: וַאֲפִיצֵם
  choice: dan menyerakkan mereka
  rationale: Bentuk hifil menyatakan tindakan menyebabkan mereka tersebar. "Menyerakkan" mempertahankan citra penghukuman dan paralelisme puitis.
- source_word: בְּיִשְׂרָאֵל
  choice: di antara keturunan Israel
  rationale: Israel dipakai secara kolektif untuk bangsa itu. Ungkapan ini mempertahankan kesejajaran dengan Yakub serta terdengar jelas bagi pembaca modern.
theological_decisions:
- issue: Sasaran kutuk
  choice: Kutuk diarahkan kepada kemarahan dan murka Simeon dan Lewi, bukan secara langsung kepada pribadi mereka.
  alternative: Simeon dan Lewi sendiri dikutuk.
  rationale: Teks Ibrani secara eksplisit menyebut kemarahan dan murka mereka sebagai hal yang terkutuk. Terjemahan mempertahankan pembedaan ini tanpa memperluas sasaran kutuk.
- issue: Makna pembagian dan penyerakan
  choice: Ucapan orang pertama dipertahankan tanpa menjelaskan secara eksplisit siapa pelaksana akhirnya atau bagaimana penggenapannya.
  alternative: Menjadikannya prediksi impersonal atau secara eksplisit mengidentifikasi Allah sebagai pelaksana.
  rationale: Teks memakai bentuk orang pertama tunggal dalam ucapan Yakub. Terjemahan menjaga bentuk dan ketegangan yang ada tanpa memasukkan penafsiran mengenai pelaku atau penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan ritme puitis. Paralelisme antara kemarahan/murka serta Yakub/Israel dipertahankan. Ungkapan kolektif dibuat eksplisit sebagai "keturunan" agar alami dan tidak ambigu bagi pembaca umum.
