  to: Janganlah jiwaku masuk ke dalam dewan mereka[a]; janganlah kehormatanku menyatu dengan perhimpunan mereka[b]. Sebab dalam kemarahan mereka, mereka membunuh seorang laki-laki, dan menurut kehendak mereka sendiri, mereka memotong urat kaki seekor lembu[c].
  rationale: Revisi mengganti “perundingan” dengan “dewan” agar acuan kepada kelompok/lingkaran dalam סוֹד jelas, serta melicinkan larik kedua menjadi bahasa Indonesia modern yang tetap mencerminkan bentuk dan paralelisme sumber. Klausa terakhir mempertahankan tindakan konkret “memotong urat kaki” dan objek tunggal “seekor lembu.” Catatan kaki diperjelas tanpa menilai salah satu pembacaan alternatif secara berlebihan.
