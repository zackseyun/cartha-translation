id: GEN.49.6
reference: Genesis 49:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/סֹדָ/ם֙ אַל תָּבֹ֣א נַפְשִׁ֔/י בִּ/קְהָלָ֖/ם אַל תֵּחַ֣ד כְּבֹדִ֑/י כִּ֤י בְ/אַפָּ/ם֙ הָ֣רְגוּ אִ֔ישׁ וּ/בִ/רְצֹנָ֖/ם עִקְּרוּ שֽׁוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/006.yaml
  text: Let my soul not enter their council[a]; let my honor not be joined to their assembly. For in their anger they killed a man[c][b], and in their self-will they hamstrung an ox.
translation:
  language: id
  text: Janganlah jiwaku masuk ke dalam dewan mereka[a]; janganlah kehormatanku menyatu dengan perhimpunan mereka[b]. Sebab dalam kemarahan mereka, mereka membunuh seorang laki-laki, dan menurut kehendak mereka sendiri, mereka memotong urat kaki seekor lembu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lingkaran rahasia mereka”; סוֹד dapat berarti dewan, lingkaran akrab, atau pertemuan yang bersifat rahasia.
    reason: lexical_alternative
  - marker: b
    text: Atau “janganlah kemuliaanku menyatu dengan perhimpunan mereka.”
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani שׁוֹר, menurut pembacaan tradisional, berarti “lembu.” Sebagian penafsir membaca konsonannya secara berbeda dan menerjemahkan klausa ini, “mereka merobohkan sebuah tembok.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּסֹדָם
  choice: ke dalam perundingan mereka
  rationale: סוֹד dapat menunjuk pada lingkungan akrab atau dewan yang mengadakan pembicaraan rahasia. “Perundingan” menyampaikan unsur musyawarah dan sejajar secara wajar dengan “perhimpunan,” sedangkan nuansa kerahasiaannya dipertahankan dalam catatan kaki.
- source_word: תָּבֹא נַפְשִׁי
  choice: Janganlah jiwaku masuk
  rationale: Bentuk yusif dengan אַל mengungkapkan penolakan atau harapan negatif. Ungkapan “jiwaku” dipertahankan demi citra dan daya puitis bahasa Ibrani, alih-alih diratakan menjadi “aku.”
- source_word: בִּקְהָלָם
  choice: dengan perhimpunan mereka
  rationale: קָהָל berarti kumpulan atau sidang orang yang berhimpun. “Perhimpunan” adalah padanan Indonesia yang wajar dan mempertahankan kesejajaran dengan “perundingan.”
- source_word: תֵּחַד כְּבֹדִי
  choice: janganlah kehormatanku dipersatukan
  rationale: יחד di sini menyatakan penyatuan atau penggabungan. כָּבוֹד dapat berarti kehormatan atau kemuliaan; “kehormatanku” paling langsung menyampaikan martabat dan nama baik Yakub dalam konteks ia menjauhkan diri dari kekerasan mereka.
- source_word: בְאַפָּם
  choice: dalam kemarahan mereka
  rationale: אַף secara idiomatis berarti kemarahan atau murka. Pilihan ini jelas, alami, dan tetap dekat dengan susunan sumber.
- source_word: הָרְגוּ אִישׁ
  choice: mereka membunuh seorang laki-laki
  rationale: Bentuk tunggal אִישׁ dipertahankan dan tidak digeneralisasi menjadi bentuk jamak, sehingga acuan puitisnya kepada peristiwa Sikhem tetap terbuka.
- source_word: וּבִרְצֹנָם
  choice: dengan sekehendak hati mereka
  rationale: רָצוֹן dapat berarti kehendak, kesukaan, atau keinginan. Dalam konteks negatif ini, ungkapan tersebut menyampaikan tindakan disengaja yang mengikuti kemauan sendiri tanpa memberi penafsiran psikologis berlebihan.
- source_word: עִקְּרוּ
  choice: memotong urat kaki
  rationale: עקר dengan objek binatang secara tradisional dipahami sebagai tindakan memutus urat kaki sehingga binatang itu lumpuh. Ungkapan deskriptif ini lebih mudah dipahami pembaca Indonesia modern daripada istilah teknis yang kurang umum.
- source_word: שׁוֹר
  choice: seekor lembu
  rationale: Menurut vokalisasi Masoret, שׁוֹר berarti lembu atau banteng. “Lembu” sesuai dengan tindakan memotong urat kaki dan tidak menentukan jenis kelamin binatang secara lebih sempit daripada yang diperlukan.
theological_decisions:
- issue: Makna כְּבוֹדִי dalam pernyataan puitis Yakub yang menjauhkan diri dari tindakan Simeon dan Lewi
  choice: kehormatanku
  alternative: kemuliaanku
  rationale: “Kehormatanku” secara alami menyatakan martabat atau nama baik pribadi dalam bahasa Indonesia modern. Alternatif “kemuliaanku” tetap mungkin secara leksikal dan dicatat tanpa memasukkan pengertian teologis lain ke dalam konteks ini.
- issue: Penafsiran שׁוֹר pada klausa terakhir
  choice: seekor lembu
  alternative: sebuah tembok
  rationale: Vokalisasi Masoret membaca שׁוֹר sebagai “lembu,” dan pemakaiannya bersama עקר mendukung gambaran melumpuhkan binatang dengan memotong urat kakinya. Pembacaan “tembok” merupakan alternatif yang dikenal dan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Paralelisme kedua larik pembuka dipertahankan, begitu juga ungkapan antropologis “jiwaku.” Tindakan terhadap lembu diterjemahkan secara konkret agar makna hamstringing jelas bagi pembaca umum.
