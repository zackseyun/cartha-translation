  text: פַּ֤חַז כַּ/מַּ֨יִם֙ אַל תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑י/ךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥/י עָלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/004.yaml
  text: Unstable as water[a], you shall not excel, because you went up to your father’s bed; then you defiled it—he went up to my couch.
translation:
  language: id
  text: Tidak terkendali seperti air, engkau tidak akan unggul, sebab engkau telah naik ke tempat tidur ayahmu; lalu engkau menajiskan pembaringanku—ia menaikinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan susunan yang lebih lancar, “Lalu engkau menajiskan pembaringanku—engkau menaikinya.” Dalam bahasa Ibrani, klausa terakhir tiba-tiba beralih ke orang ketiga, “ia menaikinya,” yang mungkin merupakan pengulangan bernada seruan tentang Ruben.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּחַז
  choice: tidak terkendali
  rationale: Kata ini menggambarkan ketidakstabilan, kenekatan, atau dorongan yang meluap tanpa kendali. Pilihan ini cocok dengan perbandingan terhadap air dan tetap menyampaikan penilaian moral terhadap Ruben.
- source_word: כַּמַּיִם
  choice: seperti air
  rationale: Mempertahankan perbandingan langsung dalam bahasa Ibrani dan gambaran tentang sesuatu yang bergerak tanpa dapat ditahan.
- source_word: אַל תּוֹתַר
  choice: engkau tidak akan menjadi yang terutama
  rationale: Dalam konteks hilangnya hak keutamaan anak sulung, bentuk ini menyampaikan bahwa Ruben tidak akan mempertahankan kedudukan unggulnya. Ungkapan ini juga wajar dalam bahasa Indonesia modern.
- source_word: כִּי עָלִיתָ
  choice: karena engkau menaiki
  rationale: Mempertahankan hubungan sebab dan verba harfiah yang berfungsi sebagai ungkapan halus bagi pelanggaran seksual.
- source_word: מִשְׁכְּבֵי אָבִיךָ
  choice: tempat tidur ayahmu
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi bentuk tunggal lebih alami dalam bahasa Indonesia dan menunjuk pada ranjang perkawinan sang ayah.
- source_word: חִלַּלְתָּ
  choice: engkau menajiskan
  rationale: Menyampaikan makna mencemarkan atau menodai dengan bobot moral yang sesuai bagi konteks seksual dan keluarga.
- source_word: יְצוּעִי
  choice: pembaringanku
  rationale: Mempertahankan perubahan ke sudut pandang orang pertama dan membedakannya secara wajar dari frasa sebelumnya, 'tempat tidur ayahmu'.
- source_word: עָלָה
  choice: dia menaikinya
  rationale: Mempertahankan perubahan mendadak ke orang ketiga tunggal dalam teks Masoret. Akhiran '-nya' membuat ungkapan dapat dipahami dalam bahasa Indonesia sambil tetap mempertahankan kejutan retorisnya.
theological_decisions:
- issue: Ungkapan halus seksual dan penilaian moral dalam perkataan Yakub tentang Ruben
  choice: Mempertahankan ungkapan halus 'menaiki tempat tidur ayahmu' dan menerjemahkan חִלַּלְתָּ sebagai 'menajiskan'.
  alternative: Menjelaskan secara langsung bahwa Ruben tidur dengan gundik ayahnya, atau memakai istilah kultis 'menodai kesuciannya'.
  rationale: Teks Ibrani memakai bahasa halus tetapi dapat dimengerti. Terjemahan tidak memasukkan rincian dari Kejadian 35:22 yang tidak dinyatakan langsung dalam ayat ini.
- issue: Perubahan mendadak ke orang ketiga pada klausa terakhir (עָלָה)
  choice: 'Mempertahankan bentuk orang ketiga: ''dia menaikinya''.'
  alternative: Melancarkan kalimat menjadi 'engkau menaiki pembaringanku' atau 'engkau menajiskan pembaringanku ketika menaikinya'.
  rationale: Bentuk Ibrani adalah orang ketiga tunggal dan menimbulkan ketegangan sintaksis. Teks utama mempertahankan bentuk Masoret, sedangkan catatan kaki memberikan pembacaan yang lebih lancar tanpa meniadakan ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Struktur nubuat dipertahankan secara ringkas; ungkapan seksual tidak dibuat lebih terang daripada teks sumber, dan perubahan orang gramatikal pada bagian akhir tetap terlihat.
