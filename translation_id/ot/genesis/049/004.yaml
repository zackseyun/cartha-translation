  verdict: revise
  source_fidelity: Revisi diperlukan untuk memperbaiki nuansa verba dan kelancaran sintaksis. אַל־תּוֹתַר lebih langsung diterjemahkan “engkau tidak akan unggul” daripada “tidak akan menjadi yang terutama.” Untuk עָלִיתָ, “telah naik ke tempat tidur ayahmu” mempertahankan eufemisme Ibrani secara lebih alami daripada “menaiki tempat tidur ayahmu.” Klausa penutup tetap mempertahankan pergeseran mendadak ke orang ketiga dalam teks Masoret.
  naturalness: Draf umumnya baku, tetapi “Saat itu” kurang tepat sebagai penghubung konsekuensial untuk אָז dalam konteks ini; “lalu” lebih alami. “Ia menaikinya” mempertahankan ketaklaziman retoris sambil tetap dapat dipahami dalam bahasa Indonesia.
  terminology: “Menajiskan” sesuai untuk חִלַּלְתָּ dalam konteks ini. “Pembaringanku” adalah padanan yang layak untuk יְצוּעִי dan dengan tepat mempertahankan perubahan ke orang pertama. Nama “Ruben” dalam catatan kaki sudah baku.
