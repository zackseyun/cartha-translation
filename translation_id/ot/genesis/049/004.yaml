  - severity: medium
    issue: “Karena engkau menaiki tempat tidur ayahmu” kurang alami sebagai eufemisme dalam bahasa Indonesia.
    rationale: “Naik ke tempat tidur ayahmu” lebih wajar, tetap transparan, dan tidak membuat tindakan itu lebih eksplisit daripada teks Ibrani.
  - severity: low
