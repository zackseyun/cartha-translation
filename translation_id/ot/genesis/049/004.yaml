  rationale: Revisi ini mempertahankan eufemisme seksual, penilaian moral, dan perubahan mendadak dari orang kedua ke orang ketiga dalam teks Masoret. Kata penghubung dan verba disesuaikan agar lebih alami dalam bahasa Indonesia modern tanpa menghilangkan ambiguitas pada klausa terakhir.
