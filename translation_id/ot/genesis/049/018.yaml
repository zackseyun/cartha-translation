  text: לִֽ/ישׁוּעָתְ/ךָ֖ קִוִּ֥יתִי יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/018.yaml
  text: For your salvation I wait[a], O Yahweh.
translation:
  language: id
  text: Aku menantikan keselamatan-Mu, ya Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Aku telah menantikan pembebasan-Mu, ya Yahweh.” Kata Ibrani untuk “keselamatan” juga dapat berarti “pembebasan,” dan bentuk verbanya dapat dipahami secara perfektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִישׁוּעָתְךָ
  choice: keselamatan dari-Mu
  rationale: Nomina יְשׁוּעָה mencakup keselamatan atau pembebasan. Dalam bahasa Indonesia, konstruksi 'menantikan keselamatan dari-Mu' secara alami menyatakan bahwa keselamatan yang dinantikan berasal dari Yahweh, sekaligus mempertahankan cakupan makna yang luas.
- source_word: קִוִּיתִי
  choice: Aku menantikan
  rationale: Bentuk perfektif קִוִּיתִי dapat menyatakan penantian penuh harap yang telah berlangsung dan tetap menjadi sikap pembicara. 'Aku menantikan' terdengar alami dalam seruan puitis ini tanpa membatasi tindakan itu hanya pada masa lampau.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Makna יְשׁוּעָה dalam seruan Yakub
  choice: keselamatan
  alternative: pembebasan
  rationale: '''Keselamatan'' mempertahankan keluasan makna teologis dan eksistensial kata tersebut, sedangkan ''pembebasan'' dapat memberi kesan pertolongan dari ancaman tertentu saja.'
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Urutan kalimat dibuat alami dalam bahasa Indonesia, sementara seruan langsung kepada Yahweh dan nuansa penantian penuh harap dipertahankan.
