  text: וַ/יַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְ/אֶת הָ/אָ֖רֶץ כִּ֣י נָעֵ֑מָה וַ/יֵּ֤ט שִׁכְמ/וֹ֙ לִ/סְבֹּ֔ל וַ/יְהִ֖י לְ/מַס עֹבֵֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/015.yaml
  text: He saw that the resting place was good[a], and that the land was pleasant, so he bent his shoulder to bear[c][b], and became a servant for forced labor.
translation:
  language: id
  text: Ia melihat bahwa tempat peristirahatan itu baik[a] dan bahwa negeri itu menyenangkan. Maka ia menundukkan bahunya untuk memikul beban dan menjadi pekerja paksa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bahwa istirahat itu baik.” Kata Ibrani מְנֻחָה dapat berarti “istirahat” atau “tempat peristirahatan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi hamba pembayar upeti” atau “menjadi hamba yang melakukan kerja paksa.” Ungkapan Ibrani לְמַס עֹבֵד dapat menunjuk pada kerja wajib atau kerja paksa (korve), atau pada ketundukan berupa upeti.
    reason: alternative_reading
lexical_decisions:
- source_word: מְנֻחָה
  choice: tempat peristirahatan
  rationale: Nomina ini dapat berarti 'istirahat' atau 'tempat peristirahatan'. Kesejajarannya dengan 'negeri' mendukung makna konkret, sementara alternatif leksikal tetap dicatat.
- source_word: טוֹב
  choice: baik
  rationale: Mempertahankan kesederhanaan dan keluasan makna kata sifat Ibrani.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks berkat bagi suku, kata ini menunjuk pada wilayah atau negeri, bukan bumi secara umum.
- source_word: נָעֵמָה
  choice: menyenangkan
  rationale: Menyampaikan daya tarik dan kenyamanan negeri itu dengan bahasa Indonesia yang wajar dan tidak berlebihan.
- source_word: וַיֵּט שִׁכְמוֹ
  choice: ia menundukkan bahunya
  rationale: Mempertahankan gambaran tubuh dalam idiom Ibrani yang menyiratkan kesediaan atau ketundukan untuk menanggung beban.
- source_word: לִסְבֹּל
  choice: untuk memikul beban
  rationale: Dalam konteks bahu, verba ini secara alami berarti memikul atau menanggung beban; penyebutan 'beban' membuat idiom jelas dalam bahasa Indonesia.
- source_word: לְמַס עֹבֵד
  choice: menjadi pekerja rodi
  rationale: '''Rodi'' merupakan istilah Indonesia yang ringkas dan lazim untuk kerja wajib atau kerja paksa yang dikenakan penguasa, tanpa harus menyiratkan perbudakan sebagai status milik.'
theological_decisions:
- issue: Sifat ketundukan Isakhar dalam klausa terakhir
  choice: menjadi pekerja rodi
  alternative: menjadi hamba pembayar upeti; menjadi pekerja paksa
  rationale: מַס sering menunjuk pada pengerahan kerja wajib atau corvée, tetapi dapat berkaitan dengan ketundukan yang bersifat upeti. Teks utama memakai padanan yang paling sesuai dengan konteks memikul beban, sedangkan ketidakpastian sosial-politisnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Paralelisme kedua klausa pembuka dan gambaran 'menundukkan bahu' dipertahankan; 'pekerja rodi' dipilih sebagai ungkapan ringkas untuk sistem kerja wajib.
