  text: בִּרְכֹ֣ת אָבִ֗י/ךָ גָּֽבְרוּ֙ עַל בִּרְכֹ֣ת הוֹרַ֔/י עַֽד תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֨ין֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/026.yaml
  text: The blessings of your father have prevailed beyond the blessings of my parents[a], to the utmost bounds of the ancient hills. May they be on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: id
  text: Berkat-berkat ayahmu melampaui berkat-berkat nenek moyangku, sampai ke batas terjauh bukit-bukit purba.[a] Kiranya berkat-berkat itu berada di atas kepala Yusuf, di atas ubun-ubun orang yang dikhususkan dari antara saudara-saudaranya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bukit-bukit abadi.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pemimpin di antara saudara-saudaranya”; harfiah, “orang yang dikuduskan/dikhususkan dari antara saudara-saudaranya.”
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכֹת
  choice: berkat-berkat
  rationale: Bentuk jamak konstruktus diulang dalam kedua bagian baris dan menunjuk pada limpahan berbagai berkat.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Sufiks orang kedua tunggal dalam teks yang diberikan menunjukkan bahwa Yakub menyapa Yusuf secara langsung.
- source_word: גָּבְרוּ עַל
  choice: lebih besar daripada
  rationale: Gabungan verba dan preposisi ini menyatakan keunggulan atau sesuatu yang melampaui; ungkapan komparatif ini alami dalam bahasa Indonesia.
- source_word: הוֹרַי
  choice: para leluhurku
  rationale: Secara harfiah berarti 'orang-orang yang memperanakkan aku'. Dalam bentuk jamak dan konteks berkat turun-temurun, 'para leluhurku' lebih memadai daripada membatasinya pada ayah dan ibu saja.
- source_word: עַד תַּאֲוַת גִּבְעֹת עוֹלָם
  choice: hingga mencapai batas terjauh bukit-bukit purbakala
  rationale: Frasa puitis ini sulit. Dalam konteks, תַּאֲוַת dapat dipahami sebagai batas atau jangkauan terjauh, sedangkan עוֹלָם menggambarkan bukit-bukit yang berasal dari zaman purba. Kemungkinan arti lain dipertahankan dalam catatan kaki.
- source_word: תִּהְיֶיןָ לְרֹאשׁ
  choice: Semoga semuanya itu tercurah ke atas kepala
  rationale: Bentuk verba dalam konteks pemberkatan memiliki daya harapan atau pengucapan berkat. 'Tercurah' mengungkapkan secara alami gambaran berkat yang datang ke atas kepala.
- source_word: קָדְקֹד
  choice: ubun-ubun
  rationale: Kata ini menunjuk pada bagian paling atas kepala dan mempertahankan kesejajaran puitis dengan 'kepala'.
- source_word: נְזִיר אֶחָיו
  choice: orang yang dikhususkan dari antara saudara-saudaranya
  rationale: נְזִיר pada dasarnya menunjuk kepada orang yang dipisahkan atau dikhususkan. Pilihan ini sesuai dengan kedudukan Yusuf yang khas tanpa memasukkan lembaga kenaziran yang baru dirumuskan kemudian; kemungkinan makna 'pemimpin' dicatat sebagai alternatif.
theological_decisions:
- issue: Makna gelar Yusuf נְזִיר אֶחָיו
  choice: orang yang dikhususkan dari antara saudara-saudaranya
  alternative: pemimpin di antara saudara-saudaranya; orang yang ditahbiskan di antara saudara-saudaranya
  rationale: Terjemahan ini mempertahankan gagasan dasar pemisahan atau pengkhususan serta ketegangan antara status religius dan kedudukan terkemuka, tanpa mengubahnya menjadi gelar politik ataupun istilah teknis 'nazir'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Pengulangan 'berkat-berkat', kesejajaran 'kepala/ubun-ubun', dan bentuk pengucapan berkat dipertahankan.
