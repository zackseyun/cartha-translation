  naturalness: Bahasa draf umumnya baku dan mengalir. Revisi mempertahankan paralelisme puitis dan menggunakan “tepi kapal-kapal,” suatu ungkapan yang agak padat tetapi setia pada konstruksi puitis sumber; maknanya dapat dibantu melalui catatan kaki tanpa menambahkan ‘berlabuh’ ke dalam teks.
  terminology: “Zebulon” dan “Sidon” sudah lazim. “Sisinya” lebih baik daripada “sisi wilayahnya” dalam teks utama karena tidak secara eksplisit memasukkan ‘wilayah,’ yang merupakan penafsiran konteks geografis atas istilah Ibrani yang lebih luas. Kemungkinan makna geografis dicantumkan dalam catatan kaki.
