base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/013.yaml
  text: Zebulun will dwell by the shore of the seas[a]; he will be by the shore of ships[c][b], and his flank will be toward Sidon.
translation:
  language: id
  text: Zebulon akan tinggal di tepi laut[a]; ia akan berada di tepi kapal-kapal, dan sisinya mengarah ke Sidon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tepi laut-laut.” Kata Ibrani untuk “laut” berbentuk jamak; dalam bahasa Indonesia, “laut” lebih wajar sebagai ungkapan umum.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “sisinya” juga dapat berarti “lambungnya,” “batasnya,” “ujungnya,” atau “bagian terjauhnya”; dalam konteks ini dapat menunjuk pada bentangan wilayahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּלֻן
  choice: Zebulon
  rationale: Nama suku ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְחוֹף יַמִּים
  choice: di tepi laut
  rationale: חֹוף menunjuk tepi atau pantai, sedangkan bentuk jamak יַמִּים dapat berfungsi secara idiomatis untuk kawasan laut; catatan kaki mempertahankan informasi bentuk jamaknya.
- source_word: יִשְׁכֹּן
  choice: akan tinggal
  rationale: Bentuk imperfek Qal dari שכן menyatakan tinggal atau menetap; pilihan ini alami dan sesuai dengan nada nubuat puitis.
- source_word: לְחוֹף אֳנִיּוֹת
  choice: di pantai tempat kapal-kapal berlabuh
  rationale: Ungkapan harfiahnya adalah 'di tepi/pantai kapal-kapal'. Rumusan Indonesia ini mempertahankan citra pantai sekaligus menyampaikan hubungan fungsionalnya dengan kapal secara wajar, tanpa mengubahnya menjadi istilah teknis 'pelabuhan'.
- source_word: וְיַרְכָתוֹ
  choice: sisi wilayahnya
  rationale: יַרְכָה dapat berarti sisi, bagian paling jauh, atau ujung. Dalam konteks geografis, 'sisi wilayahnya' menjaga metafora spasial tanpa menentukan secara berlebihan bahwa yang dimaksud ialah batas resmi.
- source_word: עַל צִידֹן
  choice: mengarah ke Sidon
  rationale: עַל dalam pernyataan geografis ini paling mungkin menunjukkan orientasi atau bentangan menuju Sidon, bukan posisi harfiah 'di atas'.
