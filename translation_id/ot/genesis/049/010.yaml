  text: לֹֽא יָס֥וּר שֵׁ֨בֶט֙ מִֽ/יהוּדָ֔ה וּ/מְחֹקֵ֖ק מִ/בֵּ֣ין רַגְלָ֑י/ו עַ֚ד כִּֽי יָבֹ֣א שילה וְ/ל֖/וֹ יִקְּהַ֥ת עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/010.yaml
  text: The scepter will not depart from Judah[a], nor the ruler’s staff from between his feet, until Shiloh comes[b]; and to him will be the obedience of the peoples.
translation:
  language: id
  text: Tongkat kerajaan tidak akan beranjak dari Yehuda, dan tongkat penguasa tidak akan beranjak dari antara kakinya, sampai Silo datang[a]; kepadanya akan ada ketaatan bangsa-bangsa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai datang dia yang berhak.” Kata Ibrani שילה sulit dipahami dan juga ditafsirkan sebagai gelar, nama tempat, atau rujukan kepada upeti.
    reason: alternative_reading
  - marker: b
    text: Atau, “dan kepadanya bangsa-bangsa akan berhimpun,” atau “bangsa-bangsa akan tunduk kepadanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: tongkat kerajaan
  rationale: Dalam kesejajaran puitis dengan מְחֹקֵק, kata ini menunjuk pada lambang kekuasaan kerajaan, bukan suku atau tongkat biasa.
- source_word: מִיהוּדָה
  choice: dari Yehuda
  rationale: Kata depan menandai pemisahan atau asal; 'Yehuda' adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מְחֹקֵק
  choice: tongkat penguasa
  rationale: Kata ini dapat menunjuk kepada orang yang menetapkan hukum atau kepada lambang kekuasaannya. Kesejajarannya dengan 'tongkat kerajaan' dan frasa 'dari antara kakinya' mendukung makna benda lambang pemerintahan.
- source_word: מִבֵּין רַגְלָיו
  choice: dari antara kakinya
  rationale: Ungkapan konkret bahasa Ibrani dipertahankan agar gambaran tentang penguasa yang duduk dan kemungkinan nuansa keturunan tidak dipersempit secara tafsir.
- source_word: עַד כִּי
  choice: sampai
  rationale: Ungkapan ini memperkenalkan batas waktu bagi pernyataan sebelumnya; 'sampai' alami dan tepat dalam bahasa Indonesia.
- source_word: שילה
  choice: Silo
  rationale: Bentuk Ibrani ini sangat diperdebatkan. Teks utama mempertahankan pembacaan tradisional sebagai nama diri dalam bentuk Indonesia, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: וְלוֹ
  choice: kepadanya
  rationale: Dengan 'Silo' dipahami sebagai rujukan personal dalam teks utama, akhiran pronominal diterjemahkan secara personal tanpa menetapkan identitasnya lebih jauh.
- source_word: יִקְּהַת
  choice: akan taat
  rationale: Kata langka ini dapat dipahami sebagai ketaatan, ketundukan, atau penghimpunan. Dalam konteks kerajaan, 'akan taat' menyampaikan respons bangsa-bangsa secara wajar sambil mempertahankan alternatif dalam catatan kaki.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk kepada berbagai kelompok bangsa dan mengungkapkan cakupan yang lebih luas daripada satu bangsa.
theological_decisions:
- issue: Identitas dan pemaknaan שילה dalam ayat yang sejak lama ditafsirkan secara mesianik
  choice: Mempertahankan 'Silo' sebagai nama yang ditransliterasikan tanpa secara eksplisit menyamakannya dengan Mesias.
  alternative: “dia yang berhak”; “sampai upeti dibawa kepadanya”; atau “sampai ia datang ke Silo”
  rationale: Pilihan ini menjaga ketidakpastian asli teks Ibrani dan tidak memasukkan identifikasi kristologis yang lebih eksplisit daripada yang dinyatakan ayat itu sendiri.
- issue: Daya kerajaan dan kemungkinan mesianik ayat ini
  choice: Memakai bahasa kerajaan—'tongkat kerajaan', 'tongkat penguasa', dan ketaatan bangsa-bangsa—tanpa menambahkan klaim doktrinal eksplisit.
  alternative: Parafrasa politik-dinastis murni atau parafrasa mesianik yang eksplisit
  rationale: Gambaran kerajaan yang terkait dengan Yehuda jelas terdapat dalam teks, tetapi identitas dan penggenapan akhirnya tidak dijabarkan dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan puitis serta gambaran kerajaan dipertahankan, sedangkan klausa terakhir dibuat alami dalam bahasa Indonesia. Penanda catatan kaki ditempatkan tepat pada unsur yang diterangkannya.
