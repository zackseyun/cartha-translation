  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהִי דָן֙ נָחָ֣שׁ עֲלֵי דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי אֹ֑רַח הַ/נֹּשֵׁךְ֙ עִקְּבֵי ס֔וּס וַ/יִּפֹּ֥ל רֹכְב֖/וֹ אָחֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/017.yaml
  text: Let Dan be a serpent by the road[a], a viper by the path, that bites the horse’s heels so that its rider falls backward.
translation:
  language: id
  text: Biarlah Dan menjadi ular di tepi jalan, ular berbisa[a] di tepi lorong, yang memagut tumit kuda sehingga penunggangnya jatuh ke belakang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini langka; jenis ularnya tidak dapat dipastikan. Yang dimaksud ialah ular yang berbahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: Biarlah ... menjadi
  rationale: Bentuk jusif menyampaikan nuansa harapan sekaligus pernyataan dalam berkat Yakub; pilihan ini mempertahankan daya volitifnya secara alami dalam bahasa Indonesia.
- source_word: נָחָשׁ
  choice: ular
  rationale: Istilah umum untuk ular; bahasa Indonesia tidak memerlukan padanan lebih arkais untuk mempertahankan ragam puitis.
- source_word: עֲלֵי דֶרֶךְ
  choice: di tepi jalan
  rationale: Menggambarkan ular yang berada di sisi jalan untuk menyergap; lebih alami daripada terjemahan harfiah 'di atas jalan'.
- source_word: שְׁפִיפֹן
  choice: ular berbisa
  rationale: Nama jenis ular yang langka dan identifikasi zoologisnya tidak pasti. Padanan ini menyampaikan bahaya tanpa menetapkan spesies tertentu.
- source_word: עֲלֵי אֹרַח
  choice: di tepi lorong
  rationale: Mempertahankan kesejajaran puitis dengan 'di tepi jalan' sekaligus membedakan אֹרַח dari דֶרֶךְ.
- source_word: הַנֹּשֵׁךְ
  choice: yang memagut
  rationale: Partisipel ini menggambarkan tindakan ular. 'Memagut' lazim untuk gigitan ular dan sesuai dengan ragam puisi yang bermartabat.
- source_word: עִקְּבֵי סוּס
  choice: tumit kuda
  rationale: Frasa konstruksi menunjuk bagian belakang atau tumit kuda; bentuk tunggal kolektif terdengar alami dalam bahasa Indonesia.
- source_word: וַיִּפֹּל
  choice: sehingga ... jatuh
  rationale: Mengungkapkan hasil gigitan secara wajar, tanpa mengubah hubungan tindakan dan akibat dalam teks.
- source_word: רֹכְבוֹ
  choice: penunggangnya
  rationale: Akhiran pronominal paling wajar merujuk kepada kuda; bentuk ini tetap ringkas dan jelas.
- source_word: אָחוֹר
  choice: ke belakang
  rationale: Menyatakan arah jatuh penunggang dengan ungkapan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Puisi berkat yang ringkas dan bermartabat, dengan paralelisme 'di tepi jalan ... di tepi lorong'. Diksi tetap mudah dipahami pembaca Indonesia masa kini.
