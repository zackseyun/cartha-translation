  terminology: “Dan” adalah bentuk nama yang baku. “Ular” bagi נָחָשׁ dan “ular berbisa” bagi שְׁפִיפֹן membedakan istilah umum dan istilah langka tanpa mengklaim identifikasi zoologis yang tidak pasti. Catatan kaki menjelaskan ketidakpastian tersebut secara memadai.
