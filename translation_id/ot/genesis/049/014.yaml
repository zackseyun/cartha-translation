  text: Issachar is a strong-boned donkey[a], lying down between the sheepfolds.
translation:
  language: id
  text: Isakhar adalah keledai bertulang kuat, yang berbaring di antara kandang-kandang domba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antara tas-tas pelana.” Istilah Ibraninya langka dan maknanya diperdebatkan; “kandang-kandang domba” adalah pengertian tradisional dan mungkin paling sesuai dengan gambaran kehidupan ternak dalam berkat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: חֲמֹר
  choice: keledai
  rationale: Makna dasarnya adalah 'keledai'; pilihan ini jelas dan alami dalam bahasa Indonesia modern tanpa memperjelas jenis kelamin yang tidak dinyatakan oleh konteks.
- source_word: גָּרֶם
  choice: bertulang kuat
  rationale: Kata benda 'tulang' berfungsi sebagai gambaran sifat fisik keledai, yakni tubuh yang kokoh. 'Bertulang kuat' mempertahankan citra konkret dan menghindari kesan kurus dari 'bertulang' saja.
- source_word: רֹבֵץ
  choice: yang berbaring
  rationale: Partisip ini menggambarkan seekor hewan yang sedang berbaring atau mendekam; 'yang berbaring' paling alami dan tetap dekat dengan gambaran Ibrani.
- source_word: בֵּין
  choice: di antara
  rationale: Padanan langsung yang sesuai untuk posisi di tengah dua atau lebih tempat.
- source_word: הַמִּשְׁפְּתָיִם
  choice: kandang-kandang domba
  rationale: Istilah langka ini secara tradisional dipahami sebagai kandang atau tempat kawanan domba beristirahat. Bentuk ulang menyampaikan jamak secara alami, sementara ketidakpastian leksikal dicatat dalam catatan kaki.
