  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵ/אֵ֨ל אָבִ֜י/ךָ וְ/יַעְזְרֶ֗/ךָּ וְ/אֵ֤ת שַׁדַּי֙ וִ/יבָ֣רְכֶ֔/ךָּ בִּרְכֹ֤ת שָׁמַ֨יִם֙ מֵ/עָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָ/רָֽחַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/025.yaml
  text: by the God of your father[a], who will help you, and by the Almighty, who will bless you with blessings of heaven above, blessings of the deep lying beneath[b], blessings of breasts and womb.
translation:
  language: id
  text: oleh Allah ayahmu[a], yang akan menolongmu, dan oleh Yang Mahakuasa, yang akan memberkatimu dengan berkat dari langit di atas, berkat dari kedalaman yang terbentang di bawah[b], berkat dari buah dada dan rahim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari Allah ayahmu ... dan bersama Yang Mahakuasa.” Preposisi Ibrani dan partikel sebelum “Yang Mahakuasa” tersusun sangat padat; rangkaian ini dapat dipahami sebagai sumber, pelaku, atau aposisi dekat.
    reason: alternative_reading
  - marker: b
    text: Atau, “kedalaman yang mendekam di bawah.” Kata kerja Ibrani dapat berarti “terbentang/berbaring” atau “mendekam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵל אָבִיךָ
  choice: oleh Allah ayahmu
  rationale: Preposisi מִן dalam susunan yang padat ini dapat menyatakan sumber atau pelaku. 'Oleh' mengalir alami bersama verba 'menolong' dan mempertahankan hubungan dengan sebutan ilahi berikutnya.
- source_word: יַעְזְרֶךָ
  choice: yang akan menolongmu
  rationale: Klausa relatif menjadikan Allah sebagai subjek secara jelas sambil mempertahankan bentuk berkat yang berorientasi ke depan.
- source_word: וְאֵת שַׁדַּי
  choice: dan oleh Yang Mahakuasa
  rationale: Partikel אֵת di sini tidak lazim dan dapat menandai koordinasi atau aposisi. 'Dan oleh' mempertahankan kesejajaran dengan frasa sebelumnya tanpa memaksakan satu analisis sintaksis secara mutlak.
- source_word: וִיבָרְכֶךָ
  choice: yang akan memberkatimu
  rationale: Klausa relatif menghasilkan bahasa Indonesia yang jelas dan menghubungkan tindakan ini dengan Yang Mahakuasa.
- source_word: בִּרְכֹת שָׁמַיִם מֵעָל
  choice: berkat dari langit di atas
  rationale: Ungkapan ini mempertahankan citra vertikal dan kesejajarannya dengan kedalaman di bawah.
- source_word: תְּהוֹם רֹבֶצֶת תָּחַת
  choice: samudra raya yang terbaring di bawah
  rationale: תְּהוֹם menunjuk pada kedalaman air purba; 'samudra raya' menyampaikan citra itu secara alami. רֹבֶצֶת dapat berarti berbaring atau mendekam; 'terbaring' dipilih dalam teks utama.
- source_word: שָׁדַיִם וָרָחַם
  choice: buah dada dan rahim
  rationale: Kedua istilah konkret ini menggambarkan berkat pemeliharaan, kesuburan, dan keturunan. Bentuk konkret dipertahankan tanpa menguraikan maknanya di dalam teks.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Gelar diterjemahkan agar maknanya dapat dipahami pembaca Indonesia, tanpa menambahkan klaim doktrinal di luar teks.
- issue: Hubungan sintaksis antara 'Allah ayahmu' dan 'Yang Mahakuasa'
  choice: 'dua frasa pelaku yang sejajar: ''oleh ... dan oleh ...'''
  alternative: sumber ('dari') atau aposisi dekat ('yaitu Yang Mahakuasa')
  rationale: Bahasa Ibrani sangat padat dan partikel-partikelnya memungkinkan nuansa sumber, pelaku, atau aposisi. Teks utama memilih bentuk yang alami, sementara catatan mempertahankan alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Pengulangan 'berkat' dan pasangan 'di atas/di bawah' dipertahankan untuk menjaga irama dan kesejajaran puisi Ibrani.
