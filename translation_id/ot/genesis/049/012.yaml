translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan puitis. Pembacaan kausal dipakai dalam teks utama karena cocok dengan gambaran kelimpahan anggur dan susu dalam konteks, sedangkan pembacaan komparatif yang sungguh mungkin dipertahankan dalam catatan kaki.
