  yaml_path: translation/ot/genesis/049/012.yaml
  text: His eyes are darker than wine[b][a], and his teeth whiter than milk.
translation:
  language: id
  text: Matanya merah karena anggur[a], dan giginya putih karena susu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Matanya lebih gelap daripada anggur, dan giginya lebih putih daripada susu.” Kata Ibrani yang diterjemahkan “merah” jarang dipakai, dan preposisi yang diterjemahkan “karena” juga dapat menyatakan perbandingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְלִילִי
  choice: merah
  rationale: Kata sifat yang jarang ini paling wajar dipahami sebagai warna kemerahan pada mata; pemakaian akar yang sama dalam Amsal 23:29 juga mengaitkan kemerahan mata dengan anggur.
- source_word: עֵינַיִם
  choice: mata
  rationale: Padanan langsung dan alami bagi nomina dual yang menunjuk pada kedua mata.
- source_word: מִיָּיִן
  choice: karena anggur
  rationale: Preposisi מִן dapat menyatakan sebab atau perbandingan. Konteks kelimpahan anggur pada ayat sebelumnya serta hubungan leksikal antara mata merah dan anggur mendukung arti sebab di sini.
- source_word: וּלְבֶן
  choice: dan ... putih
  rationale: Kata sifat ini berarti 'putih'; dalam pembacaan kausal, tidak perlu diubah menjadi bentuk perbandingan 'lebih putih'.
- source_word: שִׁנַּיִם
  choice: gigi
  rationale: Padanan langsung dan alami bagi nomina dual yang menunjuk pada gigi.
- source_word: מֵחָלָב
  choice: karena susu
  rationale: Dibaca sejajar dengan frasa sebelumnya sebagai מִן yang menyatakan sebab atau sumber keadaan, menggambarkan kelimpahan susu.
