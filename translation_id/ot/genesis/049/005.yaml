  text: Simeon and Levi are brothers[a]; weapons of violence are their swords.
translation:
  language: id
  text: Simeon dan Lewi bersaudara; alat-alat mereka adalah senjata kekerasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Makna istilah Ibrani yang diterjemahkan "alat-alat mereka" tidak pasti. Istilah itu mungkin berarti "pedang mereka"; sejumlah terjemahan lama menerjemahkannya "tempat kediaman mereka."
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Simeon dan Lewi
  rationale: Nama diri ditransliterasikan menurut bentuk baku dalam bahasa Indonesia, sedangkan konjungsi וְ diterjemahkan 'dan'.
- source_word: אַחִים
  choice: adalah bersaudara
  rationale: Secara harfiah berarti 'saudara-saudara'. Bentuk 'bersaudara' menyampaikan hubungan persaudaraan literal sekaligus keterkaitan tindakan mereka dalam konteks puisi ini.
- source_word: כְּלֵי חָמָס
  choice: senjata kekerasan
  rationale: כְּלֵי dapat berarti perkakas, alat, atau senjata; hubungannya dengan חָמָס mendukung 'senjata', sementara 'kekerasan' merupakan padanan langsung dan alami bagi חָמָס.
- source_word: מְכֵרֹתֵיהֶם
  choice: pedang mereka
  rationale: Istilah Ibrani ini langka dan tidak pasti. 'Pedang mereka' memberikan makna konkret yang sesuai dengan konteks kecaman atas kekerasan, tetapi ketidakpastian leksikalnya dipertahankan dalam catatan kaki.
