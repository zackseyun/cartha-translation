  yaml_path: translation/ot/genesis/049/002.yaml
  text: Gather yourselves and listen[a], sons of Jacob; listen to Israel your father.
translation:
  language: id
  text: Berkumpullah dan dengarkanlah, hai putra-putra Yakub; dengarkanlah Israel, ayahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקָּבְצוּ
  choice: Berkumpullah
  rationale: Bentuk imperatif jamak nifal dari קבץ memanggil mereka untuk berhimpun. Dalam bahasa Indonesia, bentuk alami “berkumpullah” sudah menyatakan bahwa mereka sendiri datang bersama tanpa perlu menambahkan kata ganti refleksif.
- source_word: וְשִׁמְעוּ
  choice: dan dengarkanlah
  rationale: Imperatif שׁמע dalam konteks ini menuntut perhatian, bukan sekadar mendengar bunyi. “Dengarkanlah” mempertahankan daya seruan dan penghubung וְ.
- source_word: בְּנֵי יַעֲקֹב
  choice: hai anak-anak lelaki Yakub
  rationale: בְּנֵי secara eksplisit menunjuk keturunan laki-laki Yakub yang sedang berkumpul. Partikel “hai” membuat sapaan langsung itu jelas dan wajar dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: וְשִׁמְעוּ אֶל
  choice: dengarkanlah
  rationale: Pengulangan perintah dipertahankan untuk menjaga paralelisme dan penekanannya. Dalam bahasa Indonesia, objek langsung sesudah “dengarkanlah” menghasilkan ungkapan yang alami.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan melalui transliterasi. Pemakaiannya bersama “Yakub” menjaga paralelisme puitis dan nuansa identitas tokoh yang sama dengan dua nama.
- source_word: אֲבִיכֶם
  choice: ayahmu
  rationale: Akhiran pronominal Ibrani adalah orang kedua maskulin jamak. Bahasa Indonesia memakai bentuk “-mu” tanpa membedakan tunggal dan jamak; konteks sapaan kepada para anak menjelaskan bahwa acuannya jamak.
theological_decisions:
- issue: Paralel nama Yakub dan Israel
  choice: 'Mempertahankan kedua nama secara berbeda: “anak-anak lelaki Yakub ... Israel, ayahmu”'
  alternative: Menyelaraskan kedua sebutan menjadi satu nama agar lebih lancar
  rationale: Teks Ibrani sengaja memakai kedua nama dalam baris paralel. Mempertahankannya menjaga penekanan puitis dan kemungkinan resonansi perjanjian tanpa menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “dengarkanlah” dipertahankan karena merupakan unsur retoris teks Ibrani; “hai” menandai vokatif secara alami. Tidak diperlukan catatan kaki karena alternatif leksikal “dengar” tidak menambahkan ambiguitas penting yang belum tercermin dalam teks utama.
