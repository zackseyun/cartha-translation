  text: וַֽ/יְמָרֲרֻ֖/הוּ וָ/רֹ֑בּוּ וַֽ/יִּשְׂטְמֻ֖/הוּ בַּעֲלֵ֥י חִצִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/023.yaml
  text: They bitterly attacked him[a], and shot at him, and hated him—the archers.
translation:
  language: id
  text: Mereka menyerangnya dengan sengit[a], memanahinya, dan membencinya—para pemanah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Mereka membuat hidupnya pahit, melawannya, dan membencinya—para pemanah itu.” Kata kerja Ibrani yang diterjemahkan “memanahinya” sulit dipastikan; kata itu juga dapat dipahami secara lebih umum sebagai “melawannya” atau “menyerangnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרֲרֻהוּ
  choice: mereka menyerangnya dengan sengit
  rationale: Bentuk piel dari מרר dengan akhiran objek orang ketiga tunggal secara harfiah dapat berarti “mereka membuatnya pahit” atau “mereka menyakitinya dengan pahit.” Dalam rangkaian tindakan bermusuhan ini, “menyerangnya dengan sengit” mengungkapkan tindakan permusuhan sekaligus mempertahankan nuansa kepahitan atau kekerasannya.
- source_word: וָרֹבּוּ
  choice: memanahinya
  rationale: Bentuk Ibrani ini sulit dan secara leksikal dapat dipahami sebagai “melawannya” atau “menyerangnya.” Namun, penyebutan בַּעֲלֵי חִצִּים (“para pemanah”) pada akhir baris mendukung gambaran serangan dengan anak panah. “Memanahinya” menyampaikan gambaran itu secara ringkas dan alami.
- source_word: וַיִּשְׂטְמֻהוּ
  choice: dan membencinya
  rationale: Kata שטם menyatakan kebencian atau permusuhan yang mendalam. “Membencinya” merupakan padanan Indonesia yang jelas dan langsung.
- source_word: בַּעֲלֵי חִצִּים
  choice: para pemanah itu
  rationale: Secara harfiah frasa ini berarti “para pemilik anak panah,” tetapi merupakan ungkapan bagi orang-orang yang menggunakan anak panah, yaitu para pemanah. Kata “itu” membuat aposisi penutup ini alami dalam bahasa Indonesia.
