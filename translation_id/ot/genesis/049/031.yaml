base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/031.yaml
  text: There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.
translation:
  language: id
  text: Di sanalah mereka menguburkan Abraham dan Sara, istrinya; di sanalah mereka menguburkan Ishak dan Ribka, istrinya; dan di sanalah aku menguburkan Lea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמָּה
  choice: di sanalah
  rationale: Adverbia ini menunjuk kembali pada gua atau tempat pemakaman yang baru disebutkan. Bentuk "di sanalah" alami dalam bahasa Indonesia dan mempertahankan penekanan serta pengulangan Ibrani.
- source_word: קָבְרוּ
  choice: mereka menguburkan
  rationale: Bentuk Qal perfek orang ketiga jamak memiliki pelaku jamak yang tidak disebutkan secara khusus; terjemahan aktif mempertahankan bentuk dan pelaku tersirat dalam bahasa Ibrani.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal secara alami diterjemahkan "istrinya". Pengulangannya untuk Sara dan Ribka mempertahankan susunan sumber.
- source_word: קָבַרְתִּי
  choice: aku menguburkan
  rationale: Bentuk Qal perfek orang pertama tunggal menyatakan tindakan lampau Yakub sendiri terhadap Lea.
- source_word: קָבְרוּ ... קָבְרוּ ... קָבַרְתִּי
  choice: menguburkan ... menguburkan ... menguburkan
  rationale: Pemakaian verba yang sama tiga kali mempertahankan pengulangan akar קבר dan kesejajaran retoris teks Ibrani.
- source_word: לֵאָה
  choice: Lea
  rationale: Nama ini mengikuti bentuk baku yang lazim dalam Alkitab berbahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur tiga klausa yang sejajar dipertahankan dengan titik koma; "aku" digunakan karena konteksnya adalah tuturan langsung Yakub.
