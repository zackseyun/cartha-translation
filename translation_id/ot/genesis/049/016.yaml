  text: דָּ֖ן יָדִ֣ין עַמּ֑/וֹ כְּ/אַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/016.yaml
  text: Dan will judge his people as one of the tribes of Israel[a].
translation:
  language: id
  text: Dan akan menghakimi bangsanya sebagai salah satu suku Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan akan membela bangsanya”; kata kerja Ibrani yang dipakai dapat mencakup arti membela atau menegakkan keadilan, bukan hanya menjatuhkan putusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּן
  choice: Dan
  rationale: Nama diri anak Yakub sekaligus nama suku; dipertahankan dalam bentuk baku bahasa Indonesia. Nama ini juga membentuk permainan bunyi dan makna dengan kata kerja יָדִין, meskipun permainan tersebut tidak sepenuhnya dapat direproduksi secara alami.
- source_word: יָדִין
  choice: akan menghakimi
  rationale: Bentuk imperfek Qal orang ketiga tunggal dari דין bernuansa prediktif dalam berkat Yakub. 'Menghakimi' mempertahankan arti dasar serta kaitan leksikal dengan nama Dan; cakupannya dapat pula mencakup membela atau menegakkan keadilan.
- source_word: עַמּוֹ
  choice: bangsanya
  rationale: עם dengan sufiks orang ketiga maskulin tunggal berarti 'bangsanya' atau 'umatnya'. Dalam konteks kesukuan, 'bangsanya' terdengar alami dan tetap tidak mempersempit rujukannya secara berlebihan.
- source_word: כְּאַחַד
  choice: sebagai salah satu
  rationale: Gabungan כ komparatif dan אחד menyatakan kedudukan Dan sebagai satu di antara suku-suku Israel. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'seperti satu'.
- source_word: שִׁבְטֵי
  choice: suku
  rationale: Bentuk jamak konstruksi dari שֵׁבֶט di sini jelas menunjuk pada suku-suku Israel, bukan arti harfiah lain seperti tongkat atau tongkat kerajaan. Dalam frasa 'salah satu suku Israel', bentuk Indonesia yang idiomatis ialah 'suku'.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri bagi bangsa Israel, memakai bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Makna peran Dan dalam berkat ini
  choice: Dan digambarkan akan menghakimi atau menjalankan keadilan bagi bangsanya dengan kedudukan sebagai salah satu suku Israel.
  alternative: Dan akan membela atau memperoleh keadilan bagi bangsanya.
  rationale: Kata דין dapat mencakup tindakan menghakimi, memerintah, membela, atau menegakkan keadilan. Teks utama mempertahankan arti paling langsung, sedangkan kemungkinan nuansa pembelaan dicatat tanpa menyelesaikan ambiguitas Ibraninya secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan 'sebagai salah satu suku Israel' dipilih demi kealamian, sedangkan catatan kaki mempertahankan rentang makna kata kerja Ibrani.
