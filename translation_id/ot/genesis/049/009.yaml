  text: גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִ/טֶּ֖רֶף בְּנִ֣/י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּ/אַרְיֵ֛ה וּ/כְ/לָבִ֖יא מִ֥י יְקִימֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/009.yaml
  text: Judah is a lion’s cub[a]; from the prey, my son, you have gone up. He crouched, he lay down like a lion[b], and like a lioness—who will rouse him?
translation:
  language: id
  text: Yehuda adalah anak singa[b]. Dari mangsa, engkau naik, anakku. Ia merunduk dan berbaring seperti singa, seperti singa betina[a]—siapa yang akan membangunkannya?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti singa besar.” Kata Ibrani di sini berbeda dari kata yang sebelumnya diterjemahkan “singa” dan dapat menunjuk kepada singa betina atau singa dewasa yang kuat.
    reason: lexical_alternative
  - marker: b
    text: Gambaran singa bagi Yehuda sering dipahami secara tipologis dalam kaitannya dengan pengharapan kerajaan dan Mesias pada bagian-bagian Alkitab yang kemudian. Namun, ayat ini sendiri secara langsung berbicara tentang Yehuda dalam berkat Yakub.
    reason: cross_reference
lexical_decisions:
- source_word: גּוּר אַרְיֵה
  choice: anak singa
  rationale: Frasa konstruksi ini menunjuk pada singa yang masih muda. “Anak singa” alami dalam bahasa Indonesia dan mempertahankan metafora aslinya.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama pribadi sekaligus nama suku ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: מִטֶּרֶף
  choice: dari mangsa itu
  rationale: טֶרֶף adalah mangsa yang diterkam atau dicabik pemangsa. Frasa ini mempertahankan gambaran seekor singa yang meninggalkan mangsanya tanpa menjelaskan detail gerak yang tidak dinyatakan teks.
- source_word: בְּנִי
  choice: anakku
  rationale: Dipahami sebagai sapaan langsung Yakub kepada Yehuda. Bentuk ini mempertahankan hubungan keluarga dan cocok dengan susunan puitis bahasa Indonesia.
- source_word: עָלִיתָ
  choice: engkau naik
  rationale: Makna dasar gerak ke atas dipertahankan. Konteks mungkin menggambarkan singa yang naik dari tempat mangsanya, tetapi terjemahan tidak menambahkan lokasi atau tujuan yang tidak disebutkan.
- source_word: כָּרַע
  choice: ia merunduk
  rationale: Dalam gambaran binatang, kata kerja ini menyatakan gerakan merendahkan tubuh atau berjongkok, bukan tindakan menyembah. “Merunduk” sesuai dengan postur singa.
- source_word: רָבַץ
  choice: berbaring
  rationale: Kata kerja ini lazim dipakai untuk binatang yang merebahkan diri atau beristirahat. “Berbaring” jelas dan wajar dalam bahasa Indonesia.
- source_word: כְּאַרְיֵה
  choice: seperti singa
  rationale: Padanan perbandingan langsung yang mempertahankan citra singa.
- source_word: וּכְלָבִיא
  choice: seperti singa betina
  rationale: לָבִיא dapat dipahami sebagai singa betina atau singa dewasa yang kuat. “Singa betina” mempertahankan pembedaan leksikal dari אַרְיֵה, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: מִי יְקִימֶנּוּ
  choice: siapa yang akan membangunkannya?
  rationale: Bentuk kausatif קום berarti membuat berdiri atau bangkit; dalam gambaran singa yang sedang berbaring, “membangunkan” menyampaikan maksudnya dengan alami tanpa menambahkan gagasan “berani” yang hanya tersirat.
theological_decisions:
- issue: Acuan gambaran singa kepada suku Yehuda atau kepada Mesias
  choice: Teks utama mempertahankan acuan langsung kepada Yehuda dalam berkat Yakub tanpa menyisipkan gelar atau klaim mesianis.
  alternative: Gambaran singa dapat dibaca secara tipologis dalam kaitannya dengan perkembangan selanjutnya mengenai kerajaan dari Yehuda dan pengharapan mesianis.
  rationale: Ayat ini secara langsung menyapa Yehuda dan menggambarkan kekuatan serta keamanannya dengan citra singa. Hubungan tipologis dapat dicatat, tetapi tidak boleh dimasukkan ke dalam terjemahan seolah-olah dinyatakan secara eksplisit oleh ayat ini.
translation_notes:
  register: Bahasa puitis yang lugas dan bermartabat. Pergantian dari sapaan orang kedua (“engkau”) ke orang ketiga (“ia”) dipertahankan karena terdapat dalam teks Ibrani. Tanda pisah mempertahankan daya retoris pertanyaan penutup.
