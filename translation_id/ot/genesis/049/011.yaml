base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/011.yaml
  text: Binding his donkey to the vine[a], and his donkey’s colt to the choice vine, he washes his garments in wine[c][b], and his robe in the blood of grapes.
translation:
  language: id
  text: 'Ia menambatkan anak keledainya pada pohon anggur,

    dan anak dari keledai betinanya pada pohon anggur pilihan[a].

    Ia mencuci pakaiannya dalam anggur,

    dan jubahnya dalam darah buah anggur[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini menunjuk pohon anggur pilihan atau bermutu tinggi; dapat juga diterjemahkan “pohon anggur unggul”.
    reason: lexical_alternative
  - marker: b
    text: “Darah buah anggur” adalah ungkapan puitis Ibrani untuk sari buah anggur atau anggur; citra aslinya dipertahankan di sini.
    reason: cultural_note
lexical_decisions:
- source_word: אֹסְרִי
  choice: Ia mengikat
  rationale: Partisipel Qal menggambarkan tindakan secara hidup dalam puisi. Bentuk kini bahasa Indonesia terdengar alami dan mempertahankan gambaran deskriptif itu.
- source_word: לַגֶּפֶן
  choice: pada pohon anggur
  rationale: גפן berarti tanaman atau pohon anggur. Kata sandang Ibrani dapat berfungsi generik; 'pohon anggur' merupakan ungkapan Indonesia yang alami.
- source_word: עִירֹה
  choice: keledainya
  rationale: עַיִר menunjuk keledai muda atau anak keledai. 'Keledainya' menghindari pengulangan kaku dengan frasa berikut, sedangkan kemungkinan makna mudanya dicatat dalam catatan kaki.
- source_word: וְלַשֹּׂרֵקָה
  choice: dan ... pada pohon anggur pilihan
  rationale: שֹׂרֵקָה menunjuk tanaman anggur terpilih atau bermutu tinggi. 'Pohon anggur pilihan' jelas dan wajar bagi pembaca modern.
- source_word: בְּנִי אֲתֹנוֹ
  choice: anak keledainya
  rationale: Secara harfiah, 'anak dari keledai betinanya'. Padanan ini menyampaikan hubungan induk-anak secara alami tanpa terlalu merinci jenis kelamin induknya.
- source_word: כִּבֵּס
  choice: Ia mencuci
  rationale: Bentuk perfektif dalam puisi nubuat dapat menyajikan adegan secara hidup atau berorientasi ke masa depan. Bentuk kini menjaga ketegangan tersebut tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: בַּיַּיִן
  choice: dalam anggur
  rationale: Preposisi ב dipertahankan sebagai 'dalam', sehingga gambaran kelimpahan—pakaian dicuci dalam anggur—tetap konkret.
- source_word: לְבֻשׁוֹ
  choice: pakaiannya
  rationale: Nomina tunggal ini dapat bermakna kolektif bagi pakaian. Bentuk tunggal posesif alami dalam bahasa Indonesia dan sejajar dengan 'jubahnya'.
- source_word: וּבְדַם עֲנָבִים
  choice: dan ... dalam darah buah anggur
  rationale: Metafora Ibrani yang konkret dipertahankan, bukan diratakan menjadi 'air anggur', agar kekuatan citra puisinya tetap terasa.
- source_word: סוּתוֹ
  choice: jubahnya
  rationale: Istilah ini menunjuk pakaian luar dan sejajar dengan לְבֻשׁוֹ. 'Jubah' merupakan padanan yang bermartabat tanpa mengkhususkan bentuk pakaian secara berlebihan.
theological_decisions:
- issue: Citra mesianik atau kesukuan dalam berkat Yakub atas Yehuda
  choice: Mempertahankan citra puitis tentang kelimpahan luar biasa tanpa menyatakan tafsir mesianik secara eksplisit dalam teks.
  alternative: Menjadikannya nubuat mesianik langsung, atau membatasinya pada kemakmuran historis suku Yehuda.
  rationale: Teks Ibrani sendiri melukiskan kelimpahan anggur dalam konteks sabda tentang Yehuda. Terjemahan tidak boleh menyelesaikan ketegangan penafsirannya dengan memasukkan kesimpulan doktrinal yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis dua pasang baris. Diksi dibuat konkret, mudah dipahami, dan bermartabat. Semua penanda catatan kaki muncul dalam teks utama.
