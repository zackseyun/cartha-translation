  yaml_path: translation/ot/genesis/049/001.yaml
  text: Then Jacob called his sons and said[a], “Gather yourselves, and I will tell you what will happen to you in the latter days.”
translation:
  language: id
  text: Kemudian Yakub memanggil para putranya dan berkata, “Berkumpullah, supaya aku memberitahukan kepada kalian apa yang akan kalian alami di masa mendatang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada hari-hari terakhir.” Ungkapan Ibrani ini dalam konteks tertentu juga dapat mengandung makna eskatologis.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks naratif ini, קרא berarti memanggil atau menyuruh datang; “memanggil” alami dan tepat dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Kata בנים di sini secara khusus menunjuk kepada putra-putra Yakub yang akan disebutkan berikutnya; terjemahan ini mempertahankan ketepatan gender dan konteks.
- source_word: הֵאָסְפוּ
  choice: Berkumpullah
  rationale: Imperatif Nifal dari אסף meminta mereka berkumpul menjadi satu; bentuk ini ringkas, alami, dan tetap bernada khidmat.
- source_word: וְאַגִּידָה לָכֶם
  choice: supaya aku memberitahukan kepada kalian
  rationale: Bentuk kohortatif menyatakan maksud Yakub sesudah perintah untuk berkumpul; “supaya” mengungkapkan hubungan tujuan secara alami.
- source_word: אֵת אֲשֶׁר יִקְרָא אֶתְכֶם
  choice: apa yang akan terjadi pada kalian
  rationale: Ungkapan dengan קרה berarti sesuatu yang terjadi atau menimpa seseorang; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: pada masa yang akan datang
  rationale: Ungkapan ini menunjuk kepada masa depan dan dalam konteks tertentu dapat bernuansa eskatologis. Terjemahan utama mempertahankan cakupan umum konteks ini tanpa menutup kemungkinan nuansa yang lebih kuat.
theological_decisions:
- issue: Apakah בְּאַחֲרִית הַיָּמִים harus diterjemahkan dengan ungkapan eskatologis yang eksplisit
  choice: pada masa yang akan datang
  alternative: pada hari-hari terakhir
  rationale: Konteks langsung membicarakan apa yang kelak dialami putra-putra atau suku-suku keturunan Yakub. Ungkapan Ibrani dapat menunjuk secara umum kepada masa depan, tetapi dalam konteks lain juga dapat bernuansa eskatologis; alternatif itu karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Kalian” dipakai karena Yakub berbicara langsung kepada sejumlah putranya; “anak-anak lelakinya” dipilih demi ketepatan konteks.
