  text: וַ/יְצַ֣ו אוֹתָ֗/ם וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל עַמִּ֔/י קִבְר֥וּ אֹתִ֖/י אֶל אֲבֹתָ֑/י אֶל הַ֨/מְּעָרָ֔ה אֲשֶׁ֥ר בִּ/שְׂדֵ֖ה עֶפְר֥וֹן הַֽ/חִתִּֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/029.yaml
  text: Then he commanded them and said to them[a], “I am about to be gathered to my people. Bury me with my fathers in the cave that is in the field of Ephron the Hittite,”
translation:
  language: id
  text: Lalu ia memberi perintah kepada mereka dan berkata, “Aku akan segera dikumpulkan kepada kaumku.[a] Kuburkanlah aku bersama nenek moyangku di gua yang ada di ladang Efron, orang Het itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku sedang dikumpulkan kepada kaumku.” Ungkapan Ibrani ini menunjuk pada kematian yang sudah dekat dan perhimpunan dengan kaum atau leluhur dalam kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ia memberi perintah
  rationale: Kata צוה menyatakan pemberian perintah atau amanat yang tegas; ungkapan ini mempertahankan bobot instruksi terakhir Yakub dengan bahasa Indonesia yang wajar.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: dan berkata
  rationale: Objek 'kepada mereka' sudah dinyatakan dalam klausa sebelumnya, sehingga tidak perlu diulang dalam bahasa Indonesia; alur narasi tetap jelas.
- source_word: נֶאֱסָף אֶל־עַמִּי
  choice: Aku akan segera dikumpulkan kepada kaumku
  rationale: Bentuk Nifal dan konteks menunjukkan kematian yang sudah dekat. Metafora 'dikumpulkan kepada' dipertahankan agar ungkapan Ibrani tidak diratakan menjadi sekadar 'aku akan mati'.
- source_word: עַמִּי
  choice: kaumku
  rationale: '''Kaumku'' secara alami menunjuk kelompok kekerabatan atau leluhur dan mempertahankan keluasan ungkapan Ibrani tanpa membatasinya hanya pada keluarga inti.'
- source_word: קִבְרוּ אֹתִי
  choice: Kuburkanlah aku
  rationale: Imperatif jamak diterjemahkan sebagai perintah langsung; sufiks -lah memberi nada tegas dan khidmat.
- source_word: אֶל־אֲבֹתָי
  choice: bersama nenek moyangku
  rationale: Walaupun אֶל secara harfiah berarti 'kepada', dalam konteks pemakaman bahasa Indonesia secara alami memakai 'bersama'. אבות di sini menunjuk para leluhur, bukan hanya ayah kandung.
- source_word: הַמְּעָרָה
  choice: gua
  rationale: Nomina ini berarti 'gua'; konteks sudah menunjukkan fungsinya sebagai tempat pemakaman sehingga tidak perlu ditambahi kata 'makam'.
- source_word: אֲשֶׁר בִּשְׂדֵה עֶפְרוֹן
  choice: yang ada di ladang Efron
  rationale: Terjemahan ini mempertahankan klausa relatif dan hubungan lokasi yang dinyatakan teks Ibrani.
- source_word: הַחִתִּי
  choice: orang Het itu
  rationale: Sebutan etnis tersebut mengidentifikasi Efron; bentuk 'orang Het' merupakan padanan Indonesia yang lazim, sedangkan 'itu' mengaitkannya secara jelas dengan Efron.
theological_decisions:
- issue: Makna ungkapan 'dikumpulkan kepada kaumku'
  choice: Mempertahankan idiom tentang kematian dan perhimpunan dengan kaum atau leluhur
  alternative: Aku akan segera mati
  rationale: Ungkapan Ibrani mengandung lebih dari pernyataan biologis tentang kematian, tetapi tidak merinci doktrin alam baka. Mempertahankan metaforanya menjaga ketegangan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dijaga dekat dengan narasi Ibrani, tetapi pengulangan pronominal yang terasa kaku dihindari. Istilah 'nenek moyang' dipilih agar אבות dipahami sebagai leluhur.
