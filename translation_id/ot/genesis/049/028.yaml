  text: כָּל אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠/זֹאת אֲשֶׁר דִּבֶּ֨ר לָ/הֶ֤ם אֲבִי/הֶם֙ וַ/יְבָ֣רֶךְ אוֹתָ֔/ם אִ֛ישׁ אֲשֶׁ֥ר כְּ/בִרְכָת֖/וֹ בֵּרַ֥ךְ אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/028.yaml
  text: 'All these are the twelve tribes of Israel[a], and this is what their father spoke to them when he blessed them: he blessed each one with the blessing appropriate to him.'
translation:
  language: id
  text: Semua ini adalah kedua belas suku Israel. Inilah yang dikatakan ayah mereka kepada mereka, dan ia memberkati mereka; masing-masing diberkatinya sesuai dengan berkatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “masing-masing menurut berkatnya, ia memberkati mereka.”'
    reason: Menunjukkan susunan distributif dan pengulangan kata “memberkati” dalam bahasa Ibrani yang tidak sepenuhnya dapat dipertahankan secara alami dalam teks utama.
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Semua inilah
  rationale: Mempertahankan unsur kolektif dan penunjuk dalam ungkapan Ibrani, sekaligus terdengar wajar sebagai rangkuman dalam bahasa Indonesia.
- source_word: שִׁבְטֵי יִשְׂרָאֵל שְׁנֵים עָשָׂר
  choice: kedua belas suku Israel
  rationale: Menerjemahkan rantai konstruksi dan bilangan secara langsung serta idiomatis dalam bahasa Indonesia.
- source_word: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם
  choice: Inilah yang dikatakan ayah mereka kepada mereka
  rationale: Kata 'dikatakan' menyampaikan tindakan berbicara secara alami tanpa menambahkan gagasan bahwa ucapan itu disampaikan 'atas' mereka.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: lalu ia memberkati mereka
  rationale: Mempertahankan tindakan kedua sebagai kelanjutan naratif, tanpa mengubahnya menjadi anak kalimat temporal seperti 'ketika'.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Bentuk tunggal distributif ini menunjuk kepada setiap anak secara tersendiri; 'masing-masing' adalah padanan Indonesia yang ringkas dan alami.
- source_word: כְּבִרְכָתוֹ
  choice: sesuai dengan berkatnya
  rationale: Mengikuti makna formal 'menurut/sesuai dengan berkatnya' dan tidak memperjelas secara berlebihan sifat berkat tersebut sebagai 'yang cocok baginya'.
- source_word: בֵּרַךְ אֹתָם
  choice: diberkatinya
  rationale: Mempertahankan pengulangan akar ברך dalam bentuk Indonesia yang tetap ringkas dan menonjolkan bahwa tiap-tiap orang menerima berkat.
theological_decisions:
- issue: Hubungan antara ucapan sang ayah dan tindakan memberkati
  choice: 'Dinyatakan sebagai dua tindakan berurutan: ''dikatakan ... lalu ia memberkati mereka'''
  alternative: 'Menjadikan ucapan itu keterangan waktu: ''ketika ia memberkati mereka'''
  rationale: Bentuk Ibrani memakai verba berurutan dan tidak secara eksplisit menandai hubungan temporal subordinatif; terjemahan ini mempertahankan hubungan yang lebih terbuka.
- issue: Makna כְּבִרְכָתוֹ
  choice: sesuai dengan berkatnya
  alternative: dengan berkat yang sesuai baginya
  rationale: Pilihan ini menjaga ungkapan Ibrani yang agak terbuka dan tidak menambahkan penilaian eksplisit bahwa berkat itu 'tepat' atau 'cocok' bagi setiap orang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat jelas tanpa menghilangkan pengulangan 'memberkati/berkat' atau menafsirkan secara berlebihan hubungan antarklausa.
