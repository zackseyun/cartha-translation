  text: Ladang dan gua yang ada di dalamnya itu dibeli dari keturunan Het[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Het.” Secara harfiah bahasa Ibrani berbunyi “anak-anak Het.”
