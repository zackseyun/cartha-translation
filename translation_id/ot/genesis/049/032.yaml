lexical_decisions:
- source_word: מִקְנֵה
  choice: dibeli
  rationale: Nomina Ibrani ini menunjuk pada pemerolehan melalui pembelian. Bentuk pasif "dibeli" mengungkapkan maksud klausa nominal secara jelas dan alami dalam bahasa Indonesia.
- source_word: הַשָּׂדֶה
  choice: ladang
  rationale: Padanan lazim untuk שָׂדֶה dalam konteks kepemilikan tanah.
- source_word: וְהַמְּעָרָה
  choice: dan gua
  rationale: Menerjemahkan kedua unsur secara langsung dan mempertahankan penghubungnya.
- source_word: אֲשֶׁר בּוֹ
  choice: yang ada di dalamnya
  rationale: Klausa relatif ini menerangkan gua sebagai gua yang berada di dalam ladang tersebut.
- source_word: מֵאֵת
  choice: dari
  rationale: Menandai pihak yang menjadi sumber pemerolehan; "dari" merupakan padanan Indonesia yang alami.
- source_word: בְּנֵי חֵת
  choice: keturunan Het
  rationale: Mempertahankan nama Het dan gagasan hubungan keturunan dalam ungkapan Ibrani, tanpa menghasilkan frasa Indonesia yang kaku seperti "anak-anak Het".
