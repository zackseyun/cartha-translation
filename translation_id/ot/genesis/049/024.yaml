    issue: '"Yang Mahaperkasa dari Yakub" dapat menyiratkan asal-usul dari Yakub.'
    rationale: Konstruksi אֲבִיר יַעֲקֹב menyatakan gelar Yang Mahaperkasa yang dikaitkan dengan Yakub, bukan bahwa Dia berasal dari Yakub. "Yang Mahaperkasa Yakub" lebih tepat dalam register puitis Indonesia.
  - severity: low
    issue: '"lengan tangannya" tidak alami dalam bahasa Indonesia modern.'
    rationale: Konstruksi Ibrani harfiah dapat diterjemahkan secara wajar sebagai "lengan-lengannya" tanpa kehilangan makna.
  - severity: low
    issue: Penutup utama merupakan fragmen yang kurang idiomatis dalam bahasa Indonesia.
    rationale: '"Dari sanalah datang" memberi predikasi yang wajar bagi pembacaan utama, dan catatan kaki tetap memberi tahu pembaca bahwa hubungan sintaksis frasa Ibrani tersebut diperselisihkan.'
