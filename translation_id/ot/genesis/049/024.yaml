base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/024.yaml
  text: Yet his bow remained steady, and his arms were made agile by the hands of the Mighty One of Jacob; from there is the Shepherd, the Stone of Israel.
translation:
  language: id
  text: 'Namun busurnya tetap kokoh,

    dan lengan-lengannya menjadi tangkas

    oleh tangan Yang Mahaperkasa Yakub;

    dari sanalah datang Sang Gembala, Batu Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani frasa terakhir ini tidak biasa dan hubungan sintaksisnya tidak pasti. Frasa itu juga dapat dipahami, “oleh Sang Gembala, Batu Israel,” atau “dari sana, dari Sang Gembala, Batu Israel.”
    reason: Menandai ketidakpastian hubungan מִשָּׁם dengan gelar-gelar berikutnya tanpa memaksakan identifikasi atau penafsiran teologis tertentu.
lexical_decisions:
- source_word: וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ
  choice: Namun busurnya tetap kokoh
  rationale: Secara harfiah busurnya ‘tinggal/bertahan dalam kekokohan’. ‘Tetap kokoh’ menyampaikan daya tahan dan kestabilannya secara alami dalam bahasa Indonesia.
- source_word: וַיָּפֹזּוּ זְרֹעֵי יָדָיו
  choice: dan lengan tangannya menjadi tangkas
  rationale: Bentuk וַיָּפֹזּוּ sulit dan dapat menunjuk pada kelincahan atau kekuatan. ‘Menjadi tangkas’ mengikuti konteks pemanah dan mempertahankan ungkapan Ibrani ‘lengan tangannya’ tanpa mereduksinya hanya menjadi ‘lengannya’.
- source_word: מִידֵי אֲבִיר יַעֲקֹב
  choice: oleh tangan Yang Mahaperkasa dari Yakub
  rationale: מִידֵי bersifat instrumental, sedangkan אֲבִיר adalah gelar ilahi yang menekankan keperkasaan. ‘Dari Yakub’ mempertahankan hubungan konstruksi tanpa mengubahnya menjadi kepunyaan Yakub.
- source_word: רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: Gembala, Batu Israel
  rationale: Kedua kata benda dipertahankan sebagai gelar yang sejajar dan bermartabat. ‘Batu’ lebih langsung mewakili אֶבֶן daripada tafsiran ‘Gunung Batu’.
theological_decisions:
- issue: Rujukan dan sintaks frasa מִשָּׁם רֹעֶה אֶבֶן יִשְׂרָאֵל
  choice: dari sanalah Gembala, Batu Israel
  alternative: oleh Dia yang adalah Gembala dan Batu Israel / dari sana, dari Gembala, Batu Israel
  rationale: Teks Masoret secara harfiah berbunyi ‘dari sana Gembala, Batu Israel’, dengan hubungan sintaksis yang tidak biasa. Terjemahan utama tidak menambahkan kata ganti atau kata kerja penjelas yang akan menetapkan satu tafsiran teologis saja; ketidakpastian diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat, selaras dengan bentuk berkat dalam puisi Ibrani. Kapitalisasi ‘Gembala’ dan ‘Batu’ menandai pemakaiannya sebagai gelar ilahi dalam konteks, tanpa menambahkan penjelasan doktrinal.
