base_translation:
  language: en
  yaml_path: translation/ot/genesis/049/003.yaml
  text: Reuben[a], you are my firstborn, my strength and the firstfruits of my vigor[b], excelling in honor and excelling in power.
translation:
  language: id
  text: Ruben, engkaulah anak sulungku, kekuatanku dan permulaan keperkasaanku[a], unggul dalam kehormatan dan unggul dalam kekuatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “permulaan kekuatanku.” Ungkapan Ibrani ini dapat menunjuk pada perwujudan pertama daya seorang ayah, termasuk nuansa daya untuk memperanakkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “terkemuka dalam keluhuran dan terkemuka dalam keperkasaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרִי
  choice: anak sulungku
  rationale: Ungkapan ini mempertahankan urutan kelahiran sekaligus kedudukan khusus anak sulung dalam keluarga.
- source_word: כֹּחִי
  choice: kekuatanku
  rationale: Padanan langsung dan alami bagi כֹּחַ dalam paralelisme puitis ini.
- source_word: רֵאשִׁית אוֹנִי
  choice: awal keperkasaanku
  rationale: רֵאשִׁית menyatakan permulaan atau perwujudan pertama, sedangkan אוֹן di sini menunjuk pada daya atau keperkasaan yang juga bernuansa kemampuan memperanakkan. Pilihan ini menjaga bahasa yang bermartabat tanpa menghilangkan nuansa tersebut; penjelasan diberikan dalam catatan kaki.
- source_word: יֶתֶר שְׂאֵת
  choice: paling unggul dalam kehormatan
  rationale: יֶתֶר menyatakan kelebihan atau keutamaan, sedangkan שְׂאֵת dapat menunjuk pada keluhuran, kedudukan, atau kehormatan. Frasa ini mempertahankan daya komparatifnya dalam bahasa Indonesia yang jelas.
- source_word: יֶתֶר עָז
  choice: paling unggul dalam kekuatan
  rationale: Pilihan ini mempertahankan paralelisme dengan klausa sebelumnya dan menerjemahkan עָז sebagai kekuatan atau keperkasaan.
- source_word: אַתָּה
  choice: engkaulah
  rationale: Bentuk ini menyampaikan penekanan dari kata ganti mandiri Ibrani dalam sapaan langsung yang puitis.
