  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: id
  text: Kemudian Abimelekh berkata kepada Abraham, “Apa yang kaulihat sehingga engkau melakukan hal ini?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang ada dalam pikiranmu sehingga engkau melakukan hal ini?” Secara harfiah bahasa Ibrani berbunyi, “Apa yang kaulihat ...?” Kata “melihat” dipakai secara idiomatis untuk apa yang dipahami, dipertimbangkan, atau ada dalam pandangan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan narasi; “Kemudian” menyampaikan gerak berurutan secara alami dalam bahasa Indonesia.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan ejaan Indonesia yang wajar.
- source_word: אֶל־אַבְרָהָם
  choice: kepada Abraham
  rationale: Preposisi אֶל memperkenalkan orang yang menjadi tujuan ujaran; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מָה רָאִיתָ
  choice: Apa yang kaulihat
  rationale: Terjemahan ini mempertahankan verba harfiah “melihat” dan gambaran idiomatis Ibrani, yang dapat menunjuk pada apa yang dipahami, dipertimbangkan, atau ada dalam pikiran Abraham.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan ini כִּי menghubungkan apa yang Abraham lihat atau pertimbangkan dengan tindakan yang dihasilkannya; “sehingga” mengungkapkan kaitan itu secara alami tanpa mengubahnya menjadi pertanyaan langsung “mengapa”.
- source_word: עָשִׂיתָ
  choice: engkau melakukan
  rationale: Padanan langsung bagi verba “melakukan”; “engkau” mempertahankan ragam percakapan yang bermartabat.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר dapat berarti hal, perkara, atau sesuatu. “Hal ini” alami dalam konteks dan tidak menambahkan penilaian moral yang lebih kuat seperti “perbuatan ini”.
