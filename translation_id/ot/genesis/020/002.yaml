  edition: WLC
  text: וַ/יֹּ֧אמֶר אַבְרָהָ֛ם אֶל שָׂרָ֥ה אִשְׁתּ֖/וֹ אֲחֹ֣תִ/י הִ֑וא וַ/יִּשְׁלַ֗ח אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַ/יִּקַּ֖ח אֶת שָׂרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: id
  text: Abraham berkata tentang Sara, istrinya,[a] “Dia adalah saudara perempuanku.” Lalu Abimelekh, raja Gerar, mengutus orang untuk mengambil Sara.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berkata kepada Sara, istrinya.” Kata depan Ibrani dapat diterjemahkan demikian secara lebih harfiah, tetapi konteks mendukung arti bahwa Abraham berbicara tentang Sara karena ucapannya berbunyi, “Dia adalah saudara perempuanku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengutus dan mengambil Sara”; teks Ibrani tidak menyebutkan siapa yang diutus.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan naratif yang wajar bagi bentuk wayyiqtol dari אמר.
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: tentang Sara, istrinya
  rationale: Walaupun אֶל lazim berarti ‘kepada’, isi ucapan dalam orang ketiga—‘Dia saudara perempuanku’—mendukung pengertian bahwa Abraham berbicara tentang Sara. Alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: אֲחֹתִי הִוא
  choice: Dia saudara perempuanku
  rationale: Menerjemahkan klausa tanpa verba secara langsung. ‘Saudara perempuan’ tidak menentukan apakah Sara lebih tua atau lebih muda, berbeda dengan ‘kakak’ atau ‘adik’.
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata שׁלח berarti ‘mengutus/mengirim’. Orang yang diutus tidak disebutkan dalam teks, tetapi tersirat oleh tindakannya.
- source_word: מֶלֶךְ גְּרָר
  choice: raja Gerar
  rationale: Rangkaian konstruksi yang menyatakan kedudukan Abimelekh dan wilayah kekuasaannya.
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: untuk membawa Sara kepadanya
  rationale: Secara harfiah berarti ‘lalu mengambil Sara’. Dalam konteks sesudah Abimelekh mengutus orang, ungkapan Indonesia ini secara alami menyatakan bahwa Sara dibawa kepada Abimelekh tanpa menambahkan bahwa ia diambil sebagai istri.
theological_decisions:
- issue: Kemungkinan perluasan interpretatif atas tindakan Abimelekh
  choice: membawa Sara kepadanya
  alternative: mengambil Sara sebagai istri
  rationale: Ayat ini menyatakan bahwa Sara diambil atau dibawa kepada Abimelekh, tetapi tidak secara eksplisit mengatakan ‘sebagai istri’. Terjemahan tidak memasukkan maksud yang baru dijelaskan oleh konteks selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama ‘Abimelekh’ ditransliterasikan secara konsisten. ‘Saudara perempuan’ dipilih agar hubungan saudara tidak diberi keterangan usia yang tidak terdapat dalam bahasa Ibrani.
