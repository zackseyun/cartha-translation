  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: id
  text: Sebab Yahweh telah menutup rapat[a] setiap rahim di rumah tangga Abimelekh karena Sara, istri Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah sungguh-sungguh menutup” atau “telah menutup sepenuhnya”; bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberikan penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan yang menjelaskan tindakan penyembuhan pada ayat sebelumnya; “sebab” mempertahankan hubungan wacana tersebut secara alami.
- source_word: עָצֹר עָצַר
  choice: benar-benar telah menutup
  rationale: Infinitif absolut yang disandingkan dengan verba finit menegaskan tindakan itu. “Benar-benar” menyampaikan penekanan tersebut, sedangkan “telah” sesuai dengan tindakan yang sudah berlangsung dalam konteks narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: setiap rahim dalam rumah tangga Abimelekh
  rationale: Ungkapan ini menunjuk kepada semua perempuan dalam lingkup keluarga besar Abimelekh. “Rumah tangga” menyampaikan makna sosial dari בַּיִת, bukan sekadar bangunan, sambil mempertahankan gambaran konkret “rahim”.
- source_word: עַל דְּבַר
  choice: karena
  rationale: Dalam konteks ini frasa tersebut menyatakan penyebab hukuman dan paling wajar diterjemahkan “karena”.
- source_word: שָׂרָה אֵשֶׁת אַבְרָהָם
  choice: Sara, istri Abraham
  rationale: Terjemahan ini mempertahankan identitas Sara dan hubungannya dengan Abraham secara jelas serta alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi YHWH. Bentuk “Yahweh” mempertahankan nama itu secara langsung alih-alih menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti hubungan penjelas dalam teks Ibrani, sementara “rumah tangga” dipakai agar makna sosial “rumah” jelas bagi pembaca masa kini.
