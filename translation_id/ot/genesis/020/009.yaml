language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: id
  text: Lalu Abimelekh memanggil Abraham dan berkata kepadanya, “Apa yang telah kauperbuat kepada kami? Apa dosaku terhadapmu,[a] sehingga engkau menyebabkan dosa besar menimpa aku dan kerajaanku? Engkau telah melakukan terhadapku hal-hal yang tidak patut dilakukan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bagaimana aku berdosa terhadapmu?”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “hal-hal yang tidak dilakukan.” Ungkapan ini menyatakan hal-hal yang tidak semestinya atau tidak patut dilakukan.
    reason: translation_clarity
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: Abimelekh memanggil Abraham
  rationale: קרא dengan לְ di sini dapat berarti memanggil atau menyuruh menghadap. “Memanggil” alami dalam narasi Indonesia dan tidak melebihkan nuansa resmi yang tidak pasti.
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: Apa yang telah kauperbuat terhadap kami?
  rationale: Pertanyaan langsung ini mempertahankan nada tuduhan. “Kauperbuat” ringkas dan bermartabat, sedangkan “terhadap kami” menyatakan sasaran tindakan dengan jelas.
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: Apa dosaku terhadapmu?
  rationale: מֶה secara formal berarti “apa,” dan חטא mempertahankan bobot moral sebagai “dosa.” Ungkapan ini juga tetap membuka alternatif idiomatis “bagaimana aku telah berdosa terhadapmu,” yang dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sehingga
  rationale: 'Dalam rangkaian pertanyaan retoris ini, כִּי memperkenalkan akibat atau isi keluhan: tindakan Abraham mengakibatkan dosa besar menimpa Abimelekh dan kerajaannya.'
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי
  choice: engkau mendatangkan ... atas diriku dan kerajaanku
  rationale: Bentuk kausatif בוא menyatakan menyebabkan sesuatu datang atau menimpa pihak lain. “Mendatangkan ... atas” mempertahankan gambaran sumber sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: חֲטָאָה גְדֹלָה
  choice: dosa besar
  rationale: Terjemahan ini mempertahankan bobot etis dan religius חֲטָאָה tanpa mereduksinya menjadi sekadar kesalahan atau kerugian.
- source_word: מַמְלַכְתִּי
  choice: kerajaanku
  rationale: מַמְלָכָה menunjuk pada kerajaan atau wilayah pemerintahan raja; “kerajaan” merupakan padanan Indonesia yang paling langsung.
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: perbuatan-perbuatan yang tidak patut dilakukan
  rationale: 'Konstruksi pasif ini secara harfiah menyebut perbuatan yang “tidak dilakukan,” tetapi dalam konteks menyatakan norma sosial-moral: hal-hal seperti itu tidak semestinya dilakukan.'
- source_word: עָשִׂיתָ עִמָּדִי
  choice: Engkau telah melakukan kepadaku
  rationale: Idiom עשה עם dapat berarti berbuat atau memperlakukan seseorang dengan cara tertentu. Susunan ini menghubungkan verba secara alami dengan objek “perbuatan-perbuatan.”
theological_decisions:
- issue: Makna חֲטָאָה sebagai dosa, kesalahan, atau kesalahan yang mendatangkan hukuman
  choice: dosa besar
  alternative: kesalahan besar; kesalahan yang mendatangkan hukuman besar
  rationale: “Dosa besar” paling langsung mempertahankan istilah moral Ibrani dan ketegangan konteks bahwa tindakan Abraham hampir menyeret Abimelekh serta kerajaannya ke dalam pelanggaran dan akibatnya, tanpa menentukan lebih jauh hubungan antara dosa, kesalahan, dan hukuman.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk terikat “kauperbuat” mempertahankan ketajaman pertanyaan, sedangkan “engkau” dipakai dalam klausa-klausa berikut agar ritmenya tidak terlalu rapat. Nama אַבִימֶלֶךְ ditransliterasikan “Abimelekh” untuk mencerminkan konsonan akhir Ibrani.
