  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: id
  text: Dari sana Abraham berangkat menuju wilayah Negeb[a]. Ia menetap di antara Kadesh dan Syur, lalu tinggal sebagai pendatang di Gerar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah selatan.” Kata Ibrani yang dipakai dapat menunjuk kepada wilayah selatan bernama Negeb atau secara umum kepada arah selatan; teks utama mempertahankan rujukan geografis yang lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: berangkat
  rationale: Bentuk qal wayyiqtol dari נסע menyatakan tindakan berangkat atau berpindah dari suatu tempat; “berangkat” alami dalam narasi Indonesia dan mempertahankan gerak perjalanan.
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Ungkapan deiktis ini menunjuk kembali kepada lokasi Abraham sebelumnya dan diterjemahkan secara langsung serta idiomatis.
- source_word: אַרְצָה הַנֶּגֶב
  choice: menuju Tanah Negeb
  rationale: Akhiran penunjuk arah pada אַרְצָה menyatakan gerak menuju suatu kawasan. הַנֶּגֶב kemungkinan besar merujuk kepada wilayah geografis Negeb, sementara catatan kaki mempertahankan kemungkinan arti umum “ke arah selatan”.
- source_word: וַיֵּשֶׁב
  choice: Ia menetap
  rationale: ישב dapat berarti tinggal atau menetap. “Menetap” sesuai dengan konteks keberadaan Abraham di kawasan antara dua tempat yang disebutkan.
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: di antara Kadesh dan Syur
  rationale: Lokator geografis diterjemahkan langsung; nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַיָּגָר
  choice: lalu tinggal sebagai pendatang
  rationale: גור menyatakan tinggal dengan status orang asing atau pendatang, bukan sekadar berdiam. Frasa ini mempertahankan nuansa status sosial tanpa memakai kata arkais.
- source_word: בִּגְרָר
  choice: di Gerar
  rationale: Preposisi lokatif dan nama tempat diterjemahkan secara langsung dan alami.
