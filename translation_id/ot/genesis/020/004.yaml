- from: Abimelekh belum mendekati dia[a], lalu ia berkata, “Ya Tuhan, apakah Engkau akan membunuh bahkan bangsa yang benar[b]?”
  to: Abimelekh belum menghampiri dia[a], maka katanya, “Ya Tuhan, apakah Engkau akan membunuh bahkan bangsa yang tidak bersalah[b]?”
  rationale: Revisi mengganti padanan yang tidak idiomatis bagi צַדִּיק dengan “tidak bersalah,” yang paling sesuai dengan konteks protes Abimelekh dan pertanyaan tentang hukuman. Catatan kaki mempertahankan alternatif “benar” serta keluasan semantis kata Ibrani. “Menghampiri” memperbaiki kelancaran tanpa menghilangkan idiom sumber; penanda catatan kaki tetap menempel pada frasa yang dijelaskan.
