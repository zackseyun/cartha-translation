  naturalness: “Belum menghampiri dia” adalah ungkapan naratif yang lebih wajar daripada “belum mendekati dia” sambil tetap mempertahankan idiom Ibrani. “Maka katanya” memberi alur naratif yang alami dan bernada baku. “Bangsa yang tidak bersalah” jauh lebih lazim dan jelas daripada “bangsa yang benar.”
  terminology: Nama Abimelekh dan sapaan ilahi “Ya Tuhan” sesuai. “Bangsa” tepat untuk גּוֹי. Terjemahan utama “tidak bersalah” dipilih berdasarkan konteks dekat, dengan “benar” dipertahankan sebagai alternatif catatan kaki untuk tidak menghilangkan keluasan ṣaddiq.
