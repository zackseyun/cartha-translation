  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: id
  text: Abimelekh belum menghampiri dia[a], maka katanya, “Ya Tuhan, apakah Engkau akan membunuh bahkan bangsa yang tidak bersalah[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Menghampiri dia” adalah ungkapan Ibrani yang dalam konteks ini berarti bahwa Abimelekh belum berhubungan seksual dengan Sara.
    reason: cultural_note
  - marker: b
    text: Atau “bangsa yang benar.” Kata Ibrani yang diterjemahkan “tidak bersalah” dapat menunjuk pada kebenaran moral atau ketidakbersalahan dalam suatu perkara.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: mendekati dia
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘mendekati dia’ dan dalam konteks menyiratkan hubungan seksual. Terjemahan mempertahankan ungkapan sumber, sedangkan catatan kaki menjelaskan implikasinya.
- source_word: אֲדֹנָי
  choice: Ya Tuhan
  rationale: Abimelekh menyapa Allah secara langsung. Partikel vokatif ‘Ya’ menghasilkan sapaan Indonesia yang alami tanpa menambahkan gelar ilahi lain.
- source_word: הֲגוֹי
  choice: bangsa
  rationale: גּוֹי adalah istilah kolektif bagi suatu bangsa atau kelompok masyarakat. ‘Bangsa’ mempertahankan cakupan korporat permohonan Abimelekh.
- source_word: גַּם
  choice: bahkan
  rationale: Dalam pertanyaan retoris ini, גַּם memberi penekanan yang paling alami diungkapkan dengan ‘bahkan’.
- source_word: צַדִּיק
  choice: yang benar
  rationale: צַדִּיק dapat menyatakan kebenaran moral maupun ketidakbersalahan. ‘Yang benar’ mempertahankan keluasan makna tersebut dan kaitannya dengan kosakata alkitabiah tentang kebenaran.
- source_word: תַּהֲרֹג
  choice: apakah Engkau akan membunuh
  rationale: Bentuk imperfek dalam pertanyaan langsung ini secara alami diterjemahkan ‘akan membunuh’; bentuk pertanyaan mempertahankan daya retoris permohonan itu.
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: Abimelekh ... lalu ia berkata
  rationale: Rangkaian waw memajukan narasi. ‘Lalu’ menyampaikan urutan tindakan tanpa menambahkan penanda waktu yang tidak ada secara eksplisit dalam teks sumber.
theological_decisions:
- issue: Cakupan korporat ‘bangsa’ dalam permohonan Abimelekh
  choice: Memakai ‘bangsa’ dan mempertahankan cakupan kolektifnya tanpa membatasinya hanya kepada Abimelekh.
  alternative: ‘umat’, ‘kaum’, atau ‘seisi rumah’
  rationale: Teks Ibrani memakai istilah kolektif, dan konteks menunjukkan ancaman hukuman yang melampaui sang raja sendiri. ‘Bangsa’ menjaga dimensi korporat itu tanpa menentukan secara berlebihan skala politiknya.
- issue: Nuansa צַדִּיק sebagai benar atau tidak bersalah
  choice: Memakai ‘yang benar’.
  alternative: ‘yang tidak bersalah’
  rationale: ‘Tidak bersalah’ sesuai dengan konteks khusus ini, tetapi mempersempit cakupan semantis. ‘Yang benar’ mempertahankan ketegangan antara klaim ketidakbersalahan dalam perkara ini dan gagasan kebenaran moral yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama ‘Abimelekh’ mengikuti transliterasi Ibrani. Kapitalisasi ‘Engkau’ dipakai untuk sapaan langsung kepada Allah. Penanda catatan kaki telah diselaraskan dengan frasa yang diterangkannya; data konsultasi Inggris tampaknya menukar isi catatan a dan b.
