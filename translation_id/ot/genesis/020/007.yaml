  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: id
  text: Maka sekarang, kembalikanlah istri orang itu, sebab dia seorang nabi. Dia akan berdoa bagimu, dan engkau akan hidup. Namun, jika engkau tidak mengembalikannya, ketahuilah bahwa engkau pasti mati—engkau dan semua yang menjadi milikmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau dan semua yang ada padamu.” Ungkapan Ibrani ini luas dan dapat mencakup anggota rumah tangga serta segala sesuatu yang menjadi milik Abimelekh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengalihkan perhatian kepada perintah yang mendesak. 'Sekarang' alami dalam bahasa Indonesia dan tetap menyampaikan daya temporal serta inferensial konteks.
- source_word: הָשֵׁב
  choice: kembalikanlah
  rationale: Bentuk imperatif kausatif dari שׁוב memerintahkan agar perempuan itu dikembalikan kepada suaminya; akhiran '-lah' menandai perintah langsung dengan register yang wajar dan bermartabat.
- source_word: אֵשֶׁת הָאִישׁ
  choice: istri orang itu
  rationale: Mempertahankan frasa konstruksi Ibrani tanpa menggantinya secara dini dengan pronomina; 'orang itu' terdengar lebih alami daripada 'laki-laki itu' dalam konteks ini.
- source_word: כִּי נָבִיא הוּא
  choice: sebab dia seorang nabi
  rationale: כִּי memberikan alasan bagi perintah sebelumnya. 'Sebab' mempertahankan hubungan penjelas, sedangkan נָבִיא diterjemahkan langsung sebagai 'nabi'.
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: Dia akan berdoa bagimu
  rationale: Bentuk yiqtol paling wajar dipahami sebagai tindakan mendatang atau konsekuensial. 'Berdoa bagimu' transparan dan tetap memuat makna doa demi kepentingan Abimelekh.
- source_word: וֶחְיֵה
  choice: dan engkau akan tetap hidup
  rationale: Walaupun bentuknya secara morfologis dapat tampak imperatif, dalam rangkaian ini maknanya adalah hasil dari doa Abraham. 'Akan tetap hidup' secara alami menyampaikan bahwa nyawa Abimelekh akan terpelihara.
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: Namun, jika engkau tidak mengembalikannya
  rationale: Negasi dengan partisip menyatakan penolakan atau kegagalan melakukan tindakan. Objek '-nya' ditambahkan dari konteks dan jelas menunjuk kepada istri orang itu.
- source_word: דַּע
  choice: ketahuilah
  rationale: Imperatif ידע memperkenalkan peringatan yang sungguh-sungguh; 'ketahuilah' mempertahankan bentuk perintah dan cocok dengan register naratif.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti mati
  rationale: Infinitif absolut yang diikuti verba terbatas menegaskan kepastian kematian. 'Pasti mati' menyampaikan intensifikasi tersebut dalam bahasa Indonesia modern.
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: engkau dan semua yang menjadi milikmu
  rationale: Ungkapan Ibrani bersifat luas dan dapat merujuk kepada seisi rumah tangga maupun segala yang dimiliki Abimelekh. Terjemahan ini mempertahankan keluasan itu tanpa membatasinya hanya pada orang atau benda.
theological_decisions:
- issue: Cakupan hukuman dalam frasa אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: engkau dan semua yang menjadi milikmu
  alternative: engkau dan semua orang yang termasuk dalam rumah tanggamu
  rationale: Konteks mendukung hukuman yang meluas kepada rumah tangga Abimelekh, tetapi frasa Ibrani itu sendiri lebih luas dan tidak secara gramatikal terbatas pada manusia. Teks utama mempertahankan ambiguitas tersebut, sementara catatan kaki menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' untuk mempertahankan kejelasan orang kedua dan register naratif yang bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan perintah, alasan, janji hidup, dan ancaman tegas dalam teks Ibrani.
