  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ הִנֵּ֥ה אַרְצִ֖/י לְ/פָנֶ֑י/ךָ בַּ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ שֵֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/015.yaml
  text: And Abimelech said, “Look, my land is before you; settle wherever seems good in your eyes.”
translation:
  language: id
  text: Lalu Abimelekh berkata, “Lihatlah, negeriku terbuka bagimu. Tinggallah di mana pun yang kauanggap baik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penarik perhatian dari partikel Ibrani dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: אַרְצִי לְפָנֶיךָ
  choice: negeriku terbuka bagimu
  rationale: Ungkapan harfiah 'negeriku ada di hadapanmu' menyatakan bahwa seluruh negeri tersedia untuk dipilih; 'terbuka bagimu' menyampaikan maksud idiomatis itu secara jelas.
- source_word: שֵׁב
  choice: Tinggallah
  rationale: Kata kerja ini dapat berarti duduk, tinggal, atau menetap; dalam konteks tawaran tempat kediaman kepada Abraham, 'tinggallah' paling wajar tanpa menekankan permukiman permanen secara berlebihan.
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: di mana pun yang kauanggap baik
  rationale: Menyampaikan idiom 'yang baik di matamu' sebagai pilihan tempat menurut penilaian Abraham, sesuai konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk sapaan tunggal 'kau-' sesuai percakapan langsung dan menjaga kelancaran kalimat; nama ditulis 'Abimelekh' agar lebih dekat dengan bentuk Ibrani.
