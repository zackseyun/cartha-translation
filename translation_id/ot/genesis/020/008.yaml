base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: id
  text: Pagi-pagi, Abimelekh bangun dan memanggil semua hamba-hambanya[a]. Ia menyampaikan semua hal itu dalam pendengaran mereka, dan orang-orang itu menjadi sangat takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyuruh semua hamba-hambanya menghadap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: Keesokan paginya ... bangun pagi-pagi
  rationale: Bentuk ini menyampaikan idiom Ibrani ‘bangun dini pada pagi hari’ secara alami sekaligus menunjukkan urutan narasi sesudah peristiwa malam sebelumnya.
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: memanggil semua hambanya
  rationale: קרא dengan ל dapat berarti memanggil atau menyuruh menghadap. Dalam konteks rumah tangga kerajaan, עֲבָדָיו paling wajar diterjemahkan ‘hambanya’ tanpa memastikan status hukum mereka sebagai budak.
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: menyampaikan segala perkara itu
  rationale: Ungkapan ini menunjuk pada seluruh isi yang diberitahukan. ‘Menyampaikan’ alami dalam bahasa Indonesia dan tetap mencerminkan tindakan berbicara.
- source_word: בְּאָזְנֵיהֶם
  choice: kepada mereka
  rationale: Secara harfiah ‘di telinga mereka’, yaitu idiom bahwa sesuatu disampaikan langsung dalam pendengaran mereka. ‘Kepada mereka’ mengungkapkan maksudnya secara wajar.
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: Orang-orang itu pun menjadi sangat takut
  rationale: ירא dalam konteks ini menyatakan rasa takut, dan מְאֹד memperkuatnya. ‘Orang-orang itu’ merujuk kembali kepada para hamba yang baru dipanggil dan terdengar lebih alami daripada mengulang ‘para lelaki’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penanda ‘pun’ mempertahankan perkembangan reaksi dalam narasi. Istilah ‘hamba’ dipakai untuk anggota atau pelayan rumah tangga kerajaan tanpa menegaskan bahwa semuanya berstatus budak.
