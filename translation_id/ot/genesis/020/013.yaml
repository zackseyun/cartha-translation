source:
  edition: WLC
  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: id
  text: 'Ketika Allah membuatku mengembara[a] meninggalkan rumah ayahku, aku berkata kepadanya, “Inilah kebaikan[b] yang harus kautunjukkan kepadaku: Di setiap tempat yang kita datangi, katakanlah tentang aku, ‘Dia saudara laki-lakiku.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai berbentuk kausatif dan dapat berarti “membuat mengembara” atau “membuat tersesat”. Dalam konteks ini, maksudnya adalah meninggalkan tempat asal dan hidup berpindah-pindah, bukan mesti melakukan penyimpangan moral.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ḥesed dapat berarti “kebaikan”, “kasih setia”, atau “kesetiaan penuh kasih”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: membuatku mengembara
  rationale: 'Bentuk Hifil menyatakan sebab: Allah membuat Abraham mengembara. Pilihan ini mempertahankan daya kausatif tanpa menyiratkan bahwa Abraham disesatkan secara moral.'
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, konteks menunjuk kepada Allah yang disembah Abraham; karena itu digunakan bentuk tunggal.
- source_word: מִבֵּית אָבִי
  choice: meninggalkan rumah ayahku
  rationale: Ungkapan ini menunjuk pada rumah atau lingkungan keluarga ayah Abraham. 'Meninggalkan' menyampaikan gerak menjauh yang terkandung dalam preposisi Ibrani secara alami dalam bahasa Indonesia.
- source_word: חַסְדֵּךְ
  choice: kebaikan
  rationale: Dalam permintaan antarpribadi ini, 'kebaikan' merupakan padanan yang alami, sementara cakupan makna berupa kasih yang setia tetap dicatat dalam catatan kaki.
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: yang harus kautunjukkan kepadaku
  rationale: Secara harfiah berarti 'yang akan kaulakukan terhadap/bersamaku'; dengan nomina 'kebaikan', ungkapan 'tunjukkan kepadaku' menyampaikan maksudnya secara idiomatis. 'Harus' mempertahankan daya permintaan yang kuat.
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: di setiap tempat yang kita datangi
  rationale: Terjemahan ini mempertahankan arti distributif, yaitu setiap tempat yang mereka capai, dengan susunan yang wajar dalam bahasa Indonesia modern.
- source_word: אִמְרִי לִי
  choice: katakanlah tentang aku
  rationale: Walaupun preposisinya secara harfiah dapat berarti 'kepadaku' atau 'bagiku', konteks menunjukkan bahwa Sara harus mengatakan sesuatu mengenai Abraham kepada orang lain.
- source_word: אָחִי הוּא
  choice: Dia saudara laki-lakiku
  rationale: Kata 'saudara laki-laki' dipertahankan karena pengakuan hubungan ini penting bagi alur cerita dan tidak boleh diperluas menjadi sekadar 'kerabat'.
theological_decisions:
- issue: Allah sebagai penyebab pengembaraan Abraham
  choice: Allah membuatku mengembara
  alternative: Allah membiarkan aku mengembara; para dewa membuatku mengembara
  rationale: Teks Ibrani menjadikan Allah subjek gramatikal dari verba kausatif. Terjemahan mempertahankan tindakan ilahi itu tanpa melunakkannya menjadi sekadar izin, tetapi memilih 'mengembara' agar tidak menambahkan gagasan kesesatan moral. Pembacaan 'para dewa' kurang sesuai dengan konteks dan rujukan kepada Allah Abraham.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk terikat 'membuatku' dan 'kautunjukkan' menjaga kelancaran tanpa menjadi terlalu percakapan. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskan.
