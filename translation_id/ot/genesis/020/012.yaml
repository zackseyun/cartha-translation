base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: id
  text: Lagi pula[a], dia memang saudara perempuanku—anak ayahku, tetapi bukan anak ibuku—dan dia menjadi istriku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Dan juga, sesungguhnya dia saudara perempuanku, anak ayahku, tetapi bukan anak ibuku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Lagi pula
  rationale: Gabungan konjungsi dan partikel aditif memperkenalkan pembelaan tambahan dalam perkataan Abraham; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi wacananya.
- source_word: אָמְנָה
  choice: memang
  rationale: Adverbia ini menegaskan kebenaran pernyataan Abraham; 'memang' merupakan padanan modern dan wajar bagi 'sungguh/benar-benar' dalam konteks ini.
- source_word: אֲחֹתִי
  choice: saudara perempuanku
  rationale: Istilah kekerabatan dengan sufiks orang pertama tunggal; bentuk ini jelas membedakan saudara perempuan dari saudara laki-laki.
- source_word: בַת אָבִי
  choice: anak ayahku
  rationale: Frasa aposisional ini menjelaskan bahwa ia saudara seayah; 'anak' cukup alami dan tidak perlu mengulang penanda feminin karena rujukannya sudah jelas.
- source_word: אַךְ לֹא בַת אִמִּי
  choice: tetapi bukan anak ibuku
  rationale: Partikel אַךְ memberi pembatasan atau kualifikasi; 'tetapi bukan' mempertahankan kontras secara lugas dan sejajar dengan klausa sebelumnya.
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: dan dia menjadi istriku
  rationale: Konstruksi היה dengan לְאִשָּׁה menyatakan masuknya seseorang ke dalam hubungan perkawinan; 'menjadi istriku' mempertahankan nuansa peristiwa tersebut.
