  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan 'kemudian', 'lalu', dan 'juga'. Istilah 'budak' dipakai untuk mencerminkan konteks pemindahan kepemilikan, tanpa melunakkan realitas sosial teks.
