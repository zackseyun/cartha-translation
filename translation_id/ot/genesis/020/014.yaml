base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: id
  text: Kemudian Abimelekh mengambil ternak kecil[a] dan ternak sapi, budak laki-laki dan budak perempuan, lalu memberikan semuanya kepada Abraham. Ia mengembalikan Sara, istri Abraham, kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawanan.” Kata Ibrani צֹאן dapat mencakup domba dan kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna langsung לקח dipertahankan dan sesuai dengan urutan narasi Ibrani.
- source_word: צֹאן
  choice: kawanan kambing domba
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, terutama domba dan kambing; pilihan ini lebih akurat daripada hanya 'domba'.
- source_word: בָקָר
  choice: kawanan sapi
  rationale: בָקָר menunjuk secara kolektif pada ternak sapi dan berpasangan secara alami dengan צֹאן.
- source_word: עֲבָדִים
  choice: budak laki-laki
  rationale: Dalam konteks orang-orang yang diberikan bersama ternak, 'budak' mencerminkan status terikat yang menonjol, sedangkan 'laki-laki' mempertahankan pembedaan gender.
- source_word: שְׁפָחוֹת
  choice: budak perempuan
  rationale: Istilah ini menunjuk pada perempuan berstatus budak dalam rumah tangga dan membentuk pasangan gender dengan עֲבָדִים.
- source_word: וַיִּתֵּן
  choice: lalu memberikannya
  rationale: Arti dasar נתן ialah 'memberikan'; akhiran '-nya' merujuk secara kolektif pada ternak dan para budak yang telah disebutkan.
- source_word: וַיָּשֶׁב
  choice: mengembalikan
  rationale: Bentuk Hifil dari שוב berarti menyebabkan kembali atau mengembalikan; bentuk transitif Indonesia ini tepat dengan Sara sebagai objek.
- source_word: אִשְׁתּוֹ
  choice: istri Abraham
  rationale: Sufiksnya merujuk kepada Abraham. Menyebut nama Abraham menghindari kemungkinan sesaat bahwa Sara adalah istri Abimelekh.
- source_word: לּוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kembali kepada Abraham dan tetap jelas setelah hubungan Sara dengan Abraham dinyatakan.
theological_decisions: []
