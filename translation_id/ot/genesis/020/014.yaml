  terminology: “Budak laki-laki dan budak perempuan” tepat dalam konteks pemindahan manusia bersama harta milik dan mempertahankan pembedaan gender dalam עֲבָדִים וּשְׁפָחוֹת. Nama Abimelekh, Abraham, dan Sara konsisten.
