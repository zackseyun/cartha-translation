id: GEN.20.6
reference: Genesis 20:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: id
  text: Lalu Allah berkata kepadanya dalam mimpi itu[a], “Ya, Aku tahu bahwa engkau melakukan hal ini dengan ketulusan hatimu. Aku juga menahan engkau agar tidak berdosa terhadap-Ku. Karena itu, Aku tidak membiarkan engkau menyentuh dia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam suatu mimpi.” Namun, bentuk Ibraninya dan konteksnya mendukung “dalam mimpi itu.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “menyentuh dia” merupakan ungkapan halus yang merujuk pada kontak seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלֹם
  choice: dalam mimpi itu
  rationale: Artikel pada חֲלוֹם dan konteks naratif menunjuk pada mimpi tertentu yang sedang diceritakan; 'mimpi itu' menyatakan kejelasan tersebut secara alami.
- source_word: גַּם אָנֹכִי
  choice: Ya, Aku / Aku juga
  rationale: Kemunculan pertama menegaskan pengakuan Allah, sedangkan kemunculan kedua menyatakan bahwa Allah sendiri turut bertindak; susunan ini mempertahankan pengulangan dan penekanannya secara wajar dalam bahasa Indonesia.
- source_word: יָדַעְתִּי
  choice: Aku tahu
  rationale: Bentuk lampau Ibrani menyatakan pengetahuan yang sudah pasti, tetapi dalam ujaran langsung bahasa Indonesia, 'Aku tahu' paling alami dan tetap menyampaikan pengakuan Allah saat itu.
- source_word: בְתָם לְבָבְךָ
  choice: dengan ketulusan hatimu
  rationale: תֹּם mencakup keutuhan, kelurusan, atau integritas. 'Ketulusan hati' alami bagi pembaca modern dan tidak melebih-lebihkan ungkapan itu menjadi pernyataan bahwa Abimelekh sama sekali tidak bersalah.
- source_word: עָשִׂיתָ זֹּאת
  choice: engkau melakukan hal ini
  rationale: Ungkapan ini menerjemahkan tindakan lampau secara langsung dan alami tanpa mempersempit rujukannya.
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: Aku juga menahan engkau
  rationale: חָשַׂךְ di sini berarti menahan atau mencegah seseorang melakukan sesuatu. 'Menahan engkau' mempertahankan gambaran tindakan Allah secara dekat dengan sumber.
- source_word: מֵחֲטוֹא לִי
  choice: agar tidak berdosa terhadap-Ku
  rationale: Konstruksi מן dengan infinitif mengungkapkan pencegahan, sedangkan לִי menandai Allah sebagai pihak yang terhadap-Nya dosa itu dilakukan.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Frasa ini memperkenalkan akibat atau penjelasan dari tindakan penahanan Allah yang baru disebutkan.
- source_word: לֹא נְתַתִּיךָ
  choice: Aku tidak membiarkan engkau
  rationale: נָתַן dengan infinitif berfungsi idiomatis dalam arti mengizinkan atau membiarkan.
- source_word: לִנְגֹּעַ אֵלֶיהָ
  choice: menyentuh dia
  rationale: Terjemahan ini mempertahankan ungkapan halus sumber, yang dalam konteks merujuk pada hubungan atau kontak seksual.
theological_decisions:
- issue: Makna 'berdosa terhadap-Ku' dalam perkataan Allah
  choice: Tindakan yang dicegah dinyatakan sebagai dosa terhadap Allah.
  alternative: Memahami frasa itu secara lebih umum sebagai menyakiti hati Allah atau mendatangkan kesalahan di hadapan-Nya.
  rationale: לִי secara langsung menghubungkan dosa tersebut dengan Allah. Terjemahan mempertahankan dimensi moral-teologis yang eksplisit tanpa meniadakan bahwa tindakan itu juga akan merugikan manusia lain.
- issue: Hubungan antara ketulusan Abimelekh dan pencegahan ilahi
  choice: 'Keduanya dipertahankan berdampingan: Allah mengakui ketulusan hati Abimelekh sekaligus menyatakan bahwa Allah mencegah tindakannya.'
  alternative: Menjadikan ketulusan Abimelekh satu-satunya alasan ia tidak berbuat dosa, atau sebaliknya menghapus makna ketulusannya karena tindakan Allah.
  rationale: Teks Ibrani menyatakan kedua unsur tanpa menyelesaikan ketegangan antara niat manusia dan campur tangan Allah; terjemahan tidak boleh mereduksinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' sesuai untuk ujaran langsung dalam narasi Kitab Suci, sedangkan kapitalisasi pada kata ganti yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Ungkapan sumber yang halus dipertahankan dan dijelaskan dalam catatan kaki.
