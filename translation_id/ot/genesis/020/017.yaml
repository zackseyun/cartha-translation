  terminology: “Allah,” “Abimelekh,” “istrinya,” dan “hamba-hamba perempuannya” digunakan secara konsisten dan tepat. Catatan kaki a secara memadai memelihara kemungkinan makna status budak dari אָמָה. Catatan kaki b dengan tepat membedakan terjemahan naratif utama dari bentuk literal “dan mereka melahirkan.”
