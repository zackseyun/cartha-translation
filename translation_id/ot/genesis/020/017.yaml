  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan seluruh unsur utama Ibrani: Abraham berdoa kepada Allah; Allah menyembuhkan Abimelekh, istrinya, dan para perempuan dalam rumah tangganya; kemudian mereka melahirkan. Penggunaan “lalu mereka melahirkan” mempertahankan fungsi naratif waw tanpa memaksakan hubungan akibat secara gramatikal, sementara konteks akibatnya dijelaskan secara tepat dalam catatan kaki.'
