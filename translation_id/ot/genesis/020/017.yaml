  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: id
  text: Lalu Abraham berdoa kepada Allah, dan Allah menyembuhkan Abimelekh, istrinya, serta hamba-hamba perempuannya[a], lalu mereka melahirkan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau ‘budak-budak perempuannya’; istilah Ibrani juga dapat menunjuk kepada perempuan yang berstatus budak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, ‘dan mereka melahirkan’. Dalam konteksnya, perkataan ini menyatakan hasil penyembuhan Allah, sehingga dapat juga diterjemahkan ‘sehingga mereka melahirkan’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: berdoa
  rationale: Bentuk Hitpael dari פלל lazim berarti ‘berdoa’. Konteksnya menyiratkan doa syafaat bagi Abimelekh, tetapi nuansa itu tidak perlu dibuat eksplisit dalam teks utama.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Ungkapan ini merujuk kepada Allah yang benar; ‘kepada Allah’ merupakan bentuk yang alami dalam bahasa Indonesia.
- source_word: וַיִּרְפָּא
  choice: menyembuhkan
  rationale: Kata רפא berarti ‘menyembuhkan’ dan di sini menunjuk pada tindakan Allah membalikkan penderitaan yang dijelaskan dalam ayat berikutnya.
- source_word: אֶת אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Padanan langsung dan alami bagi bentuk nomina dengan akhiran milik yang merujuk kepada istri Abimelekh.
- source_word: אַמְהֹתָיו
  choice: hamba-hamba perempuannya
  rationale: אָמָה dapat menunjuk kepada pelayan atau budak perempuan. ‘Hamba-hamba perempuan’ mempertahankan jenis kelamin dan hubungan pelayanan tanpa menutup kemungkinan status perbudakan, yang dicatat dalam catatan kaki.
- source_word: וַיֵּלֵדוּ
  choice: lalu mereka melahirkan
  rationale: Kata ילד berarti ‘melahirkan’. ‘Lalu’ mempertahankan hubungan naratif yang dinyatakan oleh waw tanpa secara eksplisit menetapkannya sebagai klausa tujuan atau akibat, meskipun konteks menunjukkan bahwa kelahiran itu merupakan hasil penyembuhan Allah.
theological_decisions:
- issue: Hubungan verba terakhir dengan penyembuhan
  choice: Memakai ‘lalu mereka melahirkan’ dalam teks utama.
  alternative: ‘sehingga mereka melahirkan’
  rationale: Konjungsi Ibrani menyatakan kelanjutan narasi dan konteks ayat 18 menunjukkan hubungan akibat. Teks utama mempertahankan bentuk yang lebih terbuka, sedangkan kemungkinan hubungan akibat dijelaskan dalam catatan kaki.
- issue: Nuansa status sosial אָמָה
  choice: Memakai ‘hamba-hamba perempuan’ dalam teks utama.
  alternative: ‘budak-budak perempuan’
  rationale: Istilah Ibrani dapat mencakup perempuan yang berstatus budak. Pilihan utama tetap wajar dan bermartabat dalam bahasa Indonesia, sementara nuansa status yang lebih keras tidak dihilangkan dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat menjaga kelanjutan narasi Ibrani, memakai ‘Allah’ sebagai padanan אֱלֹהִים, dan mempertahankan ambiguitas terbatas mengenai hubungan tepat antara penyembuhan dan kelahiran.
