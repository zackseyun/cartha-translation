base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: id
  text: Bukankah dia sendiri berkata kepadaku, “Dia saudara perempuanku”? Perempuan itu sendiri juga berkata, “Dia saudara laki-lakiku.” Dengan ketulusan hatiku dan tangan yang bersih[a], aku melakukan hal ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan hati yang tulus dan tangan yang bersih.” Bahasa Ibrani memakai ungkapan moral-hukum untuk menyatakan ketulusan dan ketidakbersalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Pertanyaan retoris ini mengharapkan jawaban ya; “Bukankah” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: הוּא אָמַר לִי
  choice: dia sendiri berkata kepadaku
  rationale: Kata ganti mandiri הוּא memberi penekanan, yang dipertahankan dengan “sendiri”; אמר לִי diterjemahkan langsung sebagai “berkata kepadaku”.
- source_word: אֲחֹתִי הִוא
  choice: Dia saudara perempuanku
  rationale: Bahasa Indonesia perlu memperjelas jenis kelamin dalam istilah kekerabatan; konstruksi predikatif Ibrani dipertahankan tanpa tambahan penekanan.
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: Perempuan itu sendiri juga berkata
  rationale: “Sendiri” dan “juga” mempertahankan penekanan kumulatif dari kata ganti mandiri dan גַם, sedangkan “perempuan itu” memperjelas rujukan secara alami.
- source_word: אָחִי הוּא
  choice: Dia saudara laki-lakiku
  rationale: Istilah kekerabatan diterjemahkan dengan penandaan jenis kelamin yang lazim dan jelas dalam bahasa Indonesia.
- source_word: בְּתָם לְבָבִי
  choice: Dengan ketulusan hatiku
  rationale: תָם menyatakan keutuhan moral, ketulusan, atau integritas. “Ketulusan hati” merupakan ungkapan Indonesia yang alami dan menjaga lingkup pengakuan Abimelekh mengenai tindakannya ini.
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: dan tangan yang bersih
  rationale: Terjemahan ini mempertahankan metafora moral-legal Ibrani tentang tangan sebagai lambang tindakan dan ketidakbersalahan, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: עָשִׂיתִי זֹאת
  choice: aku melakukan hal ini
  rationale: Bentuk perfektif menyatakan tindakan yang telah dilakukan; bentuk lampau dipahami dari konteks tanpa harus menambahkan penanda aspek yang tidak diperlukan.
theological_decisions:
- issue: Ungkapan moral-legal dalam pembelaan Abimelekh
  choice: Diterjemahkan sebagai pengakuan akan ketulusan hati dan tangan yang bersih dalam perkara ini.
  alternative: “Dengan hati yang tidak bercela dan tangan yang tidak bersalah.”
  rationale: Ayat ini menyatakan pembelaan Abimelekh sehubungan dengan tindakan tertentu, bukan klaim bahwa ia sama sekali tanpa dosa. Metafora Ibrani tetap dipertahankan tanpa memperluas atau mempersempit klaim teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah kekerabatan dibuat eksplisit menurut jenis kelamin agar alami dan tidak ambigu. Penekanan kata ganti Ibrani dipertahankan tanpa menghasilkan susunan yang kaku.
