  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: id
  text: Lalu Abraham berkata, “Sebab aku berkata, ‘Pasti tidak ada rasa takut kepada Allah di tempat ini, dan mereka akan membunuhku karena istriku.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan Abraham atas tindakannya sebelumnya dan mempertahankan hubungan kausal secara alami.
- source_word: אָמַרְתִּי
  choice: aku berpikir
  rationale: Secara harfiah berarti ‘aku berkata’, tetapi dalam konteks ini menunjuk pada perkataan dalam hati atau kesimpulan batin Abraham; ‘aku berpikir’ menyampaikan maksud itu secara wajar dalam bahasa Indonesia.
- source_word: רַק
  choice: Pasti
  rationale: Di sini berfungsi menegaskan anggapan Abraham, bukan sekadar menyatakan pembatasan dengan arti harfiah ‘hanya’.
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: tidak ada rasa takut kepada Allah
  rationale: Mempertahankan idiom Ibrani dan bobot moral-keagamaannya tanpa mempersempit maknanya menjadi rasa hormat semata.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: Padanan langsung dan alami bagi frasa lokatif Ibrani.
- source_word: וַהֲרָגוּנִי
  choice: dan mereka akan membunuh aku
  rationale: Mengungkapkan akibat yang diperkirakan Abraham dalam ujaran langsung.
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: karena istriku
  rationale: Menyampaikan makna idiomatis ‘oleh karena’ atau ‘gara-gara’ dengan bahasa yang jelas dan bermartabat.
theological_decisions:
- issue: Makna יִרְאַת אֱלֹהִים
  choice: rasa takut kepada Allah
  alternative: rasa hormat kepada Allah
  rationale: Ungkapan ini mencakup kesadaran moral dan keagamaan di hadapan Allah. Padanan ‘rasa takut kepada Allah’ mempertahankan idiom dan ketegangan makna sumber, yang dapat mencakup takut sekaligus hormat.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. ‘Aku berpikir’ dipakai untuk menyatakan ujaran batin secara jelas, sedangkan ‘rasa takut kepada Allah’ mempertahankan ungkapan teologis sumber.
