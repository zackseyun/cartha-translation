base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: id
  text: Tetapi Allah datang kepada Abimelekh dalam mimpi pada malam hari dan berfirman kepadanya, “Lihat, engkau akan mati karena perempuan yang telah kau ambil itu,[a] sebab ia sudah bersuami.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lihat, engkau mati” atau “Lihat, engkau adalah orang mati.” Ungkapan Ibrani ini menyatakan kematian yang pasti dan segera.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ia adalah perempuan yang dimiliki seorang suami,” yakni ia sudah bersuami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא menyatakan Allah datang menemui Abimelekh dalam mimpi; 'datang' alami dan tidak menyiratkan perpindahan fisik ke suatu tempat.
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: pada malam itu ... dalam mimpi
  rationale: Mengungkapkan mimpi yang terjadi pada malam hari dalam susunan Indonesia yang alami, sambil mempertahankan kedua unsur sumber.
- source_word: הִנְּךָ מֵת
  choice: Lihat, engkau akan mati
  rationale: הִנֵּה memberi tekanan pada peringatan, sedangkan bentuk partisip מֵת dalam konteks ini menyatakan kematian yang pasti dan segera; bentuk masa depan paling alami dalam bahasa Indonesia, sementara alternatif yang lebih harfiah dicatat.
- source_word: עַל הָאִשָּׁה אֲשֶׁר לָקַחְתָּ
  choice: karena perempuan yang telah kauambil itu
  rationale: עַל menyatakan alasan hukuman; 'telah kauambil' mempertahankan cakupan netral לקח tanpa menambahkan unsur kekerasan yang tidak dinyatakan.
- source_word: בְּעֻלַת בָּעַל
  choice: ia sudah bersuami
  rationale: '''Sudah bersuami'' secara alami menyatakan bahwa perempuan itu terikat kepada suami yang telah ada, tanpa mereproduksi secara kaku ungkapan harfiah tentang kepemilikan.'
theological_decisions:
- issue: Nilai waktu dan daya ancaman הִנְּךָ מֵת
  choice: engkau akan mati
  alternative: engkau sudah mati / engkau adalah orang mati
  rationale: Bahasa Ibrani menyampaikan hukuman mati yang pasti dan mendesak, meskipun Abimelekh belum mati. Terjemahan ini mempertahankan daya ancamannya tanpa menyatakan bahwa kematian telah terjadi.
- issue: Makna relasional בְּעֻלַת בָּעַל
  choice: ia sudah bersuami
  alternative: ia dimiliki seorang suami / ia adalah perempuan yang mempunyai suami
  rationale: Pilihan ini menyampaikan ikatan perkawinan yang sudah ada dan menjadi dasar peringatan ilahi, tanpa mengimpor gagasan kepemilikan modern atau penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berfirman' dipakai untuk ujaran Allah; 'kauambil' mempertahankan bentuk orang kedua tunggal dan nada langsung. Penanda catatan kaki [a] dicantumkan sesudah kalimat yang dijelaskannya.
