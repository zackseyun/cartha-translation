base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: id
  text: Kepada Sara ia berkata, “Lihatlah, aku telah memberikan seribu keping perak kepada saudaramu. Lihatlah, pemberian itu bagimu menjadi penutup mata[a] bagi semua orang yang bersamamu; dan di hadapan semua orang engkau dinyatakan tidak bersalah[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penutup bagi mata”. Ungkapan Ibrani ini sulit; kemungkinan maksudnya ialah ganti rugi terbuka yang menutupi pelanggaran dan memulihkan kehormatan Sara.
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau dibenarkan”, “perkara itu diselesaikan di hadapan semua orang”, atau mungkin “engkau ditegur”. Klausa Ibrani terakhir sulit dan telah dipahami dengan beberapa cara.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: seribu keping perak
  rationale: Secara harfiah berarti ‘seribu perak’. ‘Keping perak’ menyatakan pembayaran dalam perak tanpa menambahkan satuan ‘syikal’, yang tidak disebutkan secara eksplisit.
- source_word: לְאָחִיךְ
  choice: kepada saudaramu
  rationale: Teks Ibrani menyebut Abraham sebagai ‘saudaramu’, sesuai dengan pengakuan Sara sebelumnya. Ungkapan ini dipertahankan untuk menjaga kaitan naratif dan ironi perkataan Abimelekh.
- source_word: כְּסוּת עֵינַיִם
  choice: penutup mata
  rationale: Ungkapan ini sulit dan bersifat metaforis. Terjemahan yang relatif formal mempertahankan ketaksaan teks; dalam konteksnya, pemberian itu kemungkinan berfungsi sebagai ganti rugi terbuka yang menutupi pelanggaran dan memulihkan kehormatan Sara.
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: bagi semua orang yang bersamamu
  rationale: Preposisi לְ dipertahankan dengan ‘bagi’. Frasa ini menunjukkan bahwa tindakan tersebut mempunyai dampak sosial dan terbuka di kalangan orang-orang yang menyertai Sara.
- source_word: וְאֵת כֹּל
  choice: dan di hadapan semua orang
  rationale: Susunan Ibraninya padat dan sulit. Terjemahan ini memahami frasa tersebut sebagai perluasan lingkup kesaksian publik dari orang-orang yang bersama Sara kepada semua orang.
- source_word: וְנֹכָחַת
  choice: engkau dinyatakan tidak bersalah
  rationale: Bentuk Nifal dari יכח di sini dapat menunjuk pada tindakan membuktikan benar atau membersihkan nama seseorang. Pilihan ini sesuai dengan tindakan Abimelekh yang secara terbuka mengakui bahwa Sara tidak bersalah, tanpa memakai istilah Indonesia yang mudah disalahpahami sebagai pembenaran teologis.
theological_decisions:
- issue: Makna klausa penutup yang sulit, וְנֹכָחַת
  choice: engkau dinyatakan tidak bersalah
  alternative: engkau dibenarkan; perkara itu diselesaikan; engkau ditegur
  rationale: Konteks mendukung pemulihan nama baik Sara, tetapi bentuk dan sintaksis Ibraninya memungkinkan beberapa pemahaman. Terjemahan utama mengikuti alur narasi, sedangkan catatan kaki mempertahankan alternatif yang sungguh-sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘Lihatlah’ mempertahankan הִנֵּה yang muncul dua kali. Metafora ‘penutup mata’ sengaja dipertahankan dalam teks utama, sementara catatan kaki menjelaskan kemungkinan maknanya.
