base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/024.yaml
  text: And his concubine[a], whose name was Reumah, also bore Tebah, Gaham, Tahash[b], and Maacah.
translation:
  language: id
  text: Selir Nahor[a], yang bernama Reuma, juga melahirkan Tebah, Gaham, Tahas, dan Maakha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dan selirnya, dan namanya Reuma.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Selir Nahor
  rationale: פִילֶגֶשׁ menunjuk kepada selir atau istri sekunder. Pronomina posesif maskulin tunggal merujuk kepada Nahor dari konteks sebelumnya; nama Nahor dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וּשְׁמָהּ
  choice: yang bernama
  rationale: Secara harfiah, 'dan namanya'; bentuk relatif ini lebih alami dalam bahasa Indonesia tanpa mengubah hubungan sintaksisnya. Susunan koordinatif Ibrani dicatat dalam catatan kaki.
- source_word: רְאוּמָה
  choice: Reuma
  rationale: Nama diri ditransliterasikan dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Dalam daftar keturunan ini, ילד berarti melahirkan atau memperanakkan; 'melahirkan' jelas, wajar, dan mempertahankan perempuan sebagai subjek.
- source_word: גַּם הִוא
  choice: juga
  rationale: Gabungan ini menegaskan bahwa Reuma pun melahirkan anak-anak bagi Nahor, selain Milka pada ayat sebelumnya. 'Juga' menyampaikan fungsi aditif itu secara alami.
- source_word: אֶת טֶבַח וְאֶת גַּחַם וְאֶת תַּחַשׁ וְאֶת מַעֲכָה
  choice: Tebah, Gaham, Tahas, dan Maakha
  rationale: Keempatnya adalah nama diri yang ditandai sebagai objek langsung; nama-nama itu ditransliterasikan dan disusun sebagai daftar alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum, sementara koordinasi formal bahasa Ibrani dipertahankan sebagai alternatif dalam catatan kaki.
