base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/019.yaml
  text: So Abraham returned to his young men[a], and they arose and went together to Beersheba, and Abraham stayed in Beersheba.
translation:
  language: id
  text: Lalu Abraham kembali kepada para pemudanya[a]. Mereka bangkit dan pergi bersama-sama ke Bersyeba. Abraham pun tinggal di Bersyeba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Abraham kembali kepada para pemudanya.” Ishak tidak disebut dalam klausa ini, meskipun ia hadir dalam kisah sebelumnya.
    reason: Menjelaskan bahwa istilah Ibrani dapat merujuk kepada pemuda, pelayan, atau pengiring menurut konteks, serta mempertahankan perhatian pada tidak disebutkannya Ishak tanpa menambahkan atau meniadakan kehadirannya.
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk qal wayyiqtol dari שׁוב secara langsung menyatakan tindakan kembali dalam rangkaian narasi.
- source_word: נְעָרָיו
  choice: kedua hambanya yang muda
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pengiring. Konteks ayat 3 dan 5 menunjukkan bahwa yang dimaksud adalah dua hamba Abraham; unsur kemudaan tetap dipertahankan tanpa memakai ungkapan Indonesia yang janggal seperti 'orang-orang mudanya'.
- source_word: וַיָּקֻמוּ
  choice: mereka bangkit
  rationale: קום dalam narasi menandai bahwa mereka mulai bertindak; 'bangkit' bernada wajar dan bermartabat dalam narasi Alkitab modern.
- source_word: וַיֵּלְכוּ יַחְדָּו
  choice: pergi bersama-sama
  rationale: הלך menyatakan gerak pergi dan יַחְדָּו kebersamaan; terjemahan ini tidak menambahkan cara perjalanan yang tidak dinyatakan.
- source_word: בְּאֵר שָׁבַע
  choice: Bersyeba
  rationale: Nama tempat ditransliterasikan menurut bentuk yang telah lazim dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: ישׁב dalam konteks tempat dapat berarti menetap atau berdiam. 'Tinggal' alami dalam bahasa Indonesia dan tidak memastikan apakah Abraham baru menetap atau hanya berada di sana selama suatu masa.
theological_decisions:
- issue: Hanya Abraham yang secara eksplisit disebut kembali dari gunung, sedangkan Ishak hadir dalam narasi sebelumnya
  choice: Tidak menambahkan Ishak ke dalam teks utama
  alternative: Menuliskan atau menyiratkan bahwa Abraham dan Ishak kembali bersama-sama
  rationale: Klausa Ibrani hanya menyebut Abraham sebagai subjek וַיָּשָׁב. Ketegangan naratif dipertahankan dan tidak diselaraskan secara diam-diam; catatan kaki menjelaskan ketidakmenyebutan Ishak tanpa menentukan tafsirnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pembagian menjadi tiga kalimat membuat rangkaian tindakan Ibrani mudah dipahami. Partikel 'Lalu' dan 'pun' menjaga kesinambungan narasi tanpa menambah penafsiran.
