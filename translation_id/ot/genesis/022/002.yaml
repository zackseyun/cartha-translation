base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/002.yaml
  text: And he said[a], “Please take your son, your only one, whom you love—Isaac—and go to the land of Moriah, and offer him there as a burnt offering on one of the mountains that I will tell you.”
translation:
  language: id
  text: Lalu Dia berfirman, “Ambillah anakmu, anakmu satu-satunya[a] yang kaukasihi, yaitu Ishak, dan pergilah ke negeri Moria. Persembahkanlah dia di sana sebagai kurban bakaran di salah satu gunung yang akan Kuberitahukan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anakmu yang tunggal” atau “anakmu yang unik.” Kata Ibrani יְחִידְךָ dapat menekankan seseorang yang satu-satunya atau yang memiliki kedudukan khusus; di sini kata itu menyoroti kedudukan Ishak yang tiada duanya dalam perintah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָא
  choice: -lah (pada “Ambillah”)
  rationale: Partikel נָא memperhalus perintah atau menyatakan desakan. Dalam bahasa Indonesia modern, bentuk imperatif “Ambillah” menyampaikan nuansa itu secara alami tanpa memakai “sekarang,” yang dapat disalahartikan sebagai keterangan waktu, atau “kiranya,” yang terasa kurang umum.
- source_word: בִּנְךָ
  choice: anakmu
  rationale: Padanan langsung dan wajar bagi בֵּן dengan sufiks orang kedua tunggal maskulin.
- source_word: יְחִידְךָ
  choice: anakmu satu-satunya
  rationale: יָחִיד dapat menunjuk kepada seorang yang satu-satunya, tunggal, atau memiliki kedudukan unik. Ungkapan ini mempertahankan penekanan kuat dalam bahasa Ibrani, sedangkan catatan kaki menjelaskan keluwesan maknanya mengingat keberadaan Ismael.
- source_word: אֲשֶׁר אָהַבְתָּ
  choice: yang kaukasihi
  rationale: Bentuk perfektif di sini menyatakan kasih Abraham yang sudah dikenal dan tetap berlangsung; bentuk kini bahasa Indonesia menyampaikan keadaan tersebut dengan alami.
- source_word: וְלֶךְ לְךָ
  choice: dan pergilah
  rationale: Idiom הָלַךְ dengan לְךָ menekankan keterlibatan pribadi atau gerak pergi. “Pergilah” merupakan padanan Indonesia yang alami tanpa menambahkan penafsiran berlebihan.
- source_word: אֶרֶץ הַמֹּרִיָּה
  choice: negeri Moria
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. “Negeri Moria” jelas dan mempertahankan nama tempat dalam teks sumber.
- source_word: וְהַעֲלֵהוּ
  choice: persembahkanlah dia
  rationale: Dalam konteks kurban bersama לְעֹלָה, bentuk Hifil dari עָלָה berarti mempersembahkan. Padanan ini menyatakan tindakan ritual dengan jelas tanpa menerjemahkannya secara harfiah sebagai ‘menaikkan dia’.
- source_word: לְעֹלָה
  choice: sebagai kurban bakaran
  rationale: עֹלָה adalah istilah kurban yang dibakar seluruhnya di atas mazbah. “Kurban bakaran” merupakan padanan ringkas dan jelas dalam bahasa Indonesia.
- source_word: עַל אַחַד הֶהָרִים
  choice: di atas salah satu gunung
  rationale: Frasa ini menunjuk kepada satu gunung yang belum ditentukan dari antara sejumlah gunung; הַר paling lazim berarti ‘gunung’.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: yang akan Kuberitahukan kepadamu
  rationale: אָמַר dengan objek tak langsung secara harfiah berarti ‘mengatakan kepadamu’; “memberitahukan kepadamu” adalah padanan Indonesia yang alami dan tidak mengganti verba itu dengan gagasan ‘menunjukkan’.
theological_decisions:
- issue: Makna יְחִידְךָ bagi Ishak meskipun Ismael juga anak Abraham
  choice: anakmu satu-satunya
  alternative: anakmu yang tunggal; anakmu yang unik
  rationale: Terjemahan utama mempertahankan kekuatan ungkapan Ibrani dan bentuk tradisionalnya, sementara catatan kaki menjaga ambiguitas bahwa kata itu dapat menekankan kedudukan Ishak yang tunggal atau unik dalam perintah ini, bukan harus menyangkal keberadaan Ismael.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Dia berfirman” mengikuti konteks bahwa pembicara adalah Allah; kapitalisasi “Kuberitahukan” menandai ucapan ilahi tanpa menambah gelar yang tidak terdapat dalam ayat. Rangkaian apposisi Ibrani dipertahankan melalui pengulangan “anakmu” agar tekanan emosional ayat tetap terasa.
