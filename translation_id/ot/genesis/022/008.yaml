  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה לּ֥/וֹ הַ/שֶּׂ֛ה לְ/עֹלָ֖ה בְּנִ֑/י וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/008.yaml
  text: And Abraham said[a], “God will provide for himself the lamb for a burnt offering, my son.” So the two of them went on together.
translation:
  language: id
  text: Abraham menjawab, “Allah akan menyediakan bagi-Nya sendiri seekor anak domba untuk korban bakaran, anakku.” Lalu keduanya melanjutkan perjalanan bersama-sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: menjawab
  rationale: Dalam konteks langsung, Abraham menanggapi pertanyaan Ishak. ‘Menjawab’ merupakan ungkapan naratif Indonesia yang alami tanpa mengubah isi perkataannya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Istilah Ibrani umum untuk Allah di sini menunjuk kepada Allah yang dibicarakan Abraham; ‘Allah’ adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: יִרְאֶה לּוֹ
  choice: akan menyediakan bagi diri-Nya
  rationale: Secara harfiah ראה berarti ‘melihat’, tetapi dalam ungkapan ini bermakna idiomatis ‘mengusahakan’ atau ‘menyediakan’. Frasa ‘bagi diri-Nya’ mempertahankan pronomina datif לּוֹ dan nuansa bahwa Allah sendiri menentukan serta menyediakan persembahan itu.
- source_word: הַשֶּׂה
  choice: anak domba
  rationale: שֶׂה menunjuk pada seekor ternak kecil, yakni domba atau kambing, sering kali yang masih muda. ‘Anak domba’ alami dalam konteks kurban dan selaras dengan pertanyaan Ishak pada ayat sebelumnya, tanpa melampaui cakupan makna yang wajar.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya. ‘Kurban bakaran’ mempertahankan istilah persembahan secara ringkas dan mudah dipahami.
- source_word: בְּנִי
  choice: anakku
  rationale: Sapaan langsung ini mempertahankan hubungan keluarga dan nada kasih Abraham kepada Ishak.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: Lalu keduanya melanjutkan perjalanan bersama-sama
  rationale: Terjemahan ini mempertahankan penekanan pada dua orang yang terus berjalan bersama serta gema frasa yang berulang dalam kisah, dengan susunan Indonesia yang alami.
theological_decisions:
- issue: Makna pernyataan Abraham mengenai tindakan Allah
  choice: Allah akan menyediakan bagi diri-Nya anak domba untuk kurban bakaran
  alternative: Allah akan melihat bagi diri-Nya anak domba untuk kurban bakaran; Allah akan mengusahakan anak domba untuk kurban bakaran
  rationale: Konteks mendukung makna idiomatis ‘menyediakan’, sementara ‘bagi diri-Nya’ mempertahankan unsur לּוֹ. Rumusan ini tidak memutuskan apakah Abraham sedang memberi jawaban tidak langsung, menyatakan keyakinan, bernubuat, atau memadukan semuanya, sehingga ketegangan naratif tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kurban bakaran’ dipilih sebagai istilah yang jelas bagi עֹלָה; ‘anakku’ mempertahankan kehangatan sapaan. Pengulangan ‘keduanya ... bersama-sama’ sengaja dipertahankan karena merupakan penekanan penting dalam teks Ibrani.
