base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/003.yaml
  text: Abraham rose early in the morning[a], saddled his donkey, took two of his young men with him and Isaac his son, split the wood for a burnt offering, and arose and went to the place that God had told him.
translation:
  language: id
  text: Abraham bangun pagi-pagi, memasang pelana pada keledainya, dan membawa serta dua orang mudanya[a] serta Ishak, anaknya. Ia membelah kayu untuk kurban bakaran, lalu bangkit dan pergi ke tempat yang telah Allah beritahukan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua pelayannya” atau “dua pengiringnya”; kata Ibrani נְעָרִים dapat berarti orang-orang muda, pelayan, atau pengiring, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר
  choice: Abraham bangun pagi-pagi
  rationale: Ungkapan ini menyatakan bahwa Abraham bangun dan bertindak sejak pagi. 'Bangun pagi-pagi' alami dalam bahasa Indonesia dan mempertahankan penekanan naratif pada tindakan awalnya.
- source_word: וַיַּחֲבֹשׁ אֶת־חֲמֹרוֹ
  choice: memasang pelana pada keledainya
  rationale: Dalam konteks perjalanan, חבש berarti mempersiapkan hewan dengan memasang pelana atau perlengkapannya. Pilihan ini jelas dan alami.
- source_word: שְׁנֵי נְעָרָיו אִתּוֹ
  choice: dua orang muda yang menyertainya
  rationale: נְעָרָיו dapat menunjuk kepada orang-orang muda miliknya, yakni pelayan atau pengiring. Teks utama mempertahankan unsur usia tanpa memastikan status sosial yang tidak sepenuhnya eksplisit.
- source_word: יִצְחָק בְּנוֹ
  choice: Ishak, anaknya
  rationale: Mempertahankan urutan aposisional Ibrani dan menonjolkan hubungan Ishak sebagai anak Abraham.
- source_word: וַיְבַקַּע עֲצֵי עֹלָה
  choice: Ia membelah kayu untuk kurban bakaran
  rationale: בקע berarti membelah, sedangkan עֹלָה adalah istilah kurban yang seluruhnya dibakar. Bahasa Indonesia tidak memerlukan artikel tertentu pada 'kayu'.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: kemudian berangkat
  rationale: Dua verba berurutan secara idiomatis menyatakan bahwa Abraham bangkit lalu pergi. 'Berangkat' menyampaikan gerakan tersebut secara alami tanpa pengulangan janggal dalam bahasa Indonesia.
- source_word: אֶל־הַמָּקוֹם אֲשֶׁר אָמַר־לוֹ הָאֱלֹהִים
  choice: menuju tempat yang telah diberitahukan Allah kepadanya
  rationale: Klausa ini merujuk pada petunjuk Allah sebelumnya. Bentuk 'telah diberitahukan' menjaga urutan waktu dan makna komunikasi dalam konteks.
theological_decisions:
- issue: Penerjemahan istilah kurban עֹלָה
  choice: kurban bakaran
  alternative: kurban bakaran seluruhnya
  rationale: '''Kurban bakaran'' adalah padanan baku dan cukup jelas bagi kategori kurban tersebut tanpa menambahkan penjelasan teologis ke dalam teks utama.'
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang wajar dan bermartabat. Kalimat dibagi dua agar rangkaian tindakan tetap mudah dibaca. Istilah 'kurban bakaran' dipertahankan sebagai istilah sakrificial yang mapan.
