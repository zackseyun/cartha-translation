  text: וַ/יֹּ֨אמֶר יִצְחָ֜ק אֶל אַבְרָהָ֤ם אָבִי/ו֙ וַ/יֹּ֣אמֶר אָבִ֔/י וַ/יֹּ֖אמֶר הִנֶּ֣נִּֽ/י בְנִ֑/י וַ/יֹּ֗אמֶר הִנֵּ֤ה הָ/אֵשׁ֙ וְ/הָ֣/עֵצִ֔ים וְ/אַיֵּ֥ה הַ/שֶּׂ֖ה לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/007.yaml
  text: And Isaac said to Abraham his father[a], “My father!” And he said, “Here I am, my son.” And he said, “Look, the fire and the wood—but where is the sheep for a burnt offering?”
translation:
  language: id
  text: Lalu Ishak berkata kepada Abraham, ayahnya, “Ayah!” Abraham menjawab, “Aku di sini, anakku.” Ishak berkata, “Lihat, ada api dan kayu, tetapi di manakah domba[a] untuk kurban bakaran?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה dapat menunjuk secara lebih luas kepada seekor hewan kecil dari kawanan, baik domba maupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata / menjawab
  rationale: Kata kerja naratif אמר pada dasarnya berarti ‘berkata’. Dalam jawaban Abraham, ‘menjawab’ merupakan padanan alami dalam bahasa Indonesia tanpa mengubah isi ujarannya.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Mempertahankan hubungan kekerabatan yang dinyatakan teks Ibrani dengan ragam yang wajar dan bermartabat.
- source_word: אָבִי
  choice: Ayah!
  rationale: Bentuk dengan akhiran orang pertama tunggal berfungsi sebagai sapaan langsung; bahasa Indonesia secara alami memakai ‘Ayah!’ tanpa kata ganti posesif.
- source_word: הִנֶּנִי
  choice: Aku di sini
  rationale: Mempertahankan rumus kesiapsediaan atau penyataan diri dalam narasi Ibrani, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: בְּנִי
  choice: anakku
  rationale: Akhiran posesif dan nuansa kasih sayang dipertahankan dalam bentuk sapaan Indonesia yang alami.
- source_word: הִנֵּה
  choice: Lihat, ada
  rationale: Partikel penunjuk ini mengarahkan perhatian kepada benda-benda yang tampak; susunan ‘Lihat, ada ...’ alami dalam bahasa Indonesia modern.
- source_word: הָאֵשׁ
  choice: api
  rationale: Dalam konstruksi eksistensial bahasa Indonesia, nomina ini lebih alami tanpa penanda definit eksplisit.
- source_word: הָעֵצִים
  choice: kayu
  rationale: Walaupun berbentuk jamak dalam bahasa Ibrani, ‘kayu’ sebagai nomina massa merupakan padanan Indonesia yang alami dalam konteks bahan bakar.
- source_word: אַיֵּה
  choice: di manakah
  rationale: Mengungkapkan pertanyaan lokasi dengan ragam naratif yang jelas dan bermartabat.
- source_word: הַשֶּׂה
  choice: domba
  rationale: ‘Domba’ ringkas dan alami dalam konteks persembahan, tetapi istilah Ibraninya dapat mencakup hewan kecil dari kawanan, termasuk domba atau kambing; keluasan ini dipertahankan dalam catatan kaki.
- source_word: לְעֹלָה
  choice: untuk kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi persembahan yang dibakar seluruhnya; ‘kurban bakaran’ menyampaikan jenis persembahan tersebut secara ringkas.
theological_decisions:
- issue: Cakupan hewan persembahan dalam הַשֶּׂה
  choice: domba dengan catatan kaki
  alternative: anak domba; kambing atau domba; hewan dari kawanan
  rationale: Teks Ibrani tidak menentukan bahwa hewan itu pasti anak domba dan bahkan dapat menunjuk kambing. Terjemahan utama memakai istilah yang alami bagi pembaca Indonesia, sementara catatan kaki mencegah pembatasan makna yang berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang sederhana dan khidmat. Pengulangan ‘berkata’ dikurangi sekali menjadi ‘menjawab’ demi kelancaran dialog, sedangkan pola percakapan dan ketegangan pertanyaan Ishak tetap dipertahankan.
