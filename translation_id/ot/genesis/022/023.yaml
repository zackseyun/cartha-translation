  text: And Bethuel fathered Rebekah. These eight Milcah bore to Nahor[a], Abraham’s brother.
translation:
  language: id
  text: Betuel memperanakkan Ribka. Milka melahirkan kedelapan orang ini bagi Nahor[a], saudara Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kedelapan orang inilah yang dilahirkan Milka bagi Nahor, saudara Abraham.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְתוּאֵל
  choice: Betuel
  rationale: Konjungsi waw melanjutkan daftar silsilah dan dalam bahasa Indonesia dapat dibiarkan tersirat agar kalimat tetap alami; nama itu memakai bentuk Indonesia yang lazim.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dengan subjek laki-laki dalam konteks silsilah, bentuk ini secara ringkas menyatakan bahwa Betuel menjadi ayah Ribka.
- source_word: אֶת רִבְקָה
  choice: Ribka
  rationale: Penanda objek langsung tidak diterjemahkan; nama tersebut memakai bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: שְׁמֹנָה אֵלֶּה
  choice: Kedelapan orang ini
  rationale: Ungkapan ini mempertahankan penekanan Ibrani pada jumlah delapan, sementara 'orang' ditambahkan secara wajar karena yang dirujuk adalah anak-anak yang baru disebutkan.
- source_word: יָלְדָה
  choice: dilahirkan
  rationale: Konstruksi pasif yang alami dalam bahasa Indonesia mengungkapkan bahwa Milka melahirkan kedelapan anak itu tanpa mengubah hubungan semantisnya.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְ/נָחוֹר
  choice: bagi Nahor
  rationale: Preposisi ל dalam rumus silsilah menunjukkan bahwa Milka melahirkan anak-anak itu bagi Nahor; 'bagi' mempertahankan relasi ini secara ringkas.
- source_word: אֲחִי אַבְרָהָם
  choice: saudara Abraham
  rationale: Frasa konstruksi ini secara aposisional mengidentifikasi Nahor sebagai saudara Abraham.
