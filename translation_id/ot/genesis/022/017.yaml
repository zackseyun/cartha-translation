  text: כִּֽי בָרֵ֣ךְ אֲבָרֶכְ/ךָ֗ וְ/הַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/כַ/ח֕וֹל אֲשֶׁ֖ר עַל שְׂפַ֣ת הַ/יָּ֑ם וְ/יִרַ֣שׁ זַרְעֲ/ךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/017.yaml
  text: that I will surely bless you[a], and I will surely multiply your offspring like the stars of the heavens and like the sand that is on the seashore[c][b]; and your offspring will possess the gate of his enemies.
translation:
  language: id
  text: Sesungguhnya Aku akan memberkati engkau dengan berlimpah dan membuat keturunanmu[a] menjadi sangat banyak, seperti bintang-bintang di langit dan seperti pasir yang ada di tepi laut. Keturunanmu akan menguasai pintu gerbang musuh-musuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu.” Kata Ibrani ini berbentuk tunggal kolektif dan dapat merujuk kepada keturunan sebagai satu kesatuan.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani mempertahankan “keturunan” sebagai bentuk tunggal kolektif dan memakai akhiran tunggal dalam “musuh-musuhnya.” Dapat juga diungkapkan secara jamak: “keturunanmu akan menguasai pintu gerbang musuh-musuh mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sesungguhnya
  rationale: Dalam konteks sumpah ilahi, כִּי menegaskan kepastian pernyataan yang menyusul. “Sesungguhnya” menyampaikan daya penegasnya secara wajar dalam bahasa Indonesia.
- source_word: בָרֵךְ אֲבָרֶכְךָ
  choice: Aku akan memberkati engkau dengan berlimpah
  rationale: Gabungan infinitif absolut dan verba finit menegaskan atau menguatkan tindakan. “Dengan berlimpah” mengungkapkan intensitas berkat tanpa mempertahankan pengulangan Ibrani secara kaku.
- source_word: וְהַרְבָּה אַרְבֶּה
  choice: dan membuat ... menjadi sangat banyak
  rationale: Konstruksi infinitif absolut dan verba finit kembali memberi penekanan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pelipatgandaan yang sangat besar.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע secara harfiah berarti “benih” dan di sini merupakan nomina kolektif tunggal untuk keturunan. “Keturunanmu” alami sekaligus dapat berfungsi secara kolektif.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: seperti bintang-bintang di langit
  rationale: Ini mempertahankan gambaran sumber dengan bentuk Indonesia yang alami; שָׁמַיִם lazim diterjemahkan “langit” dalam konteks ini.
- source_word: וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם
  choice: dan seperti pasir yang ada di tepi laut
  rationale: Frasa relatif “yang ada” mencerminkan אֲשֶׁר עַל, sedangkan שְׂפַת הַיָּם secara idiomatis berarti tepi atau pantai laut.
- source_word: וְיִרַשׁ
  choice: akan menguasai
  rationale: יָרַשׁ dapat berarti mewarisi, memiliki, atau mengambil alih. Dengan objek “pintu gerbang musuh,” “menguasai” paling tepat menyatakan pengendalian atau kepemilikan yang dimaksud tanpa menambahkan tindakan tertentu seperti menghancurkan.
- source_word: שַׁעַר
  choice: pintu gerbang
  rationale: Terjemahan ini mempertahankan citra harfiah gerbang kota, yang juga melambangkan kendali atas kota atau kekuatan musuh.
- source_word: אֹיְבָיו
  choice: musuh-musuhnya
  rationale: Akhiran pronominal Ibrani berbentuk tunggal dan selaras dengan זֶרַע sebagai kolektif tunggal. Bentuk “-nya” mempertahankan ketegangan antara kesatuan dan kemajemukan keturunan.
theological_decisions:
- issue: Bentuk kolektif tunggal זֶרַע dan pronomina tunggal pada אֹיְבָיו
  choice: keturunanmu ... musuh-musuhnya
  alternative: keturunan-keturunanmu ... musuh-musuh mereka
  rationale: Teks Ibrani mempertahankan “keturunan/benih” sebagai bentuk kolektif tunggal dan merujuk kepadanya dengan akhiran tunggal. Terjemahan ini menjaga ambiguitas antara keturunan sebagai satu kesatuan dan kemungkinan rujukan individual, tanpa memaksakan tafsiran teologis tertentu.
- issue: Makna penguasaan pintu gerbang musuh
  choice: menguasai pintu gerbang
  alternative: mewarisi pintu gerbang
  rationale: Dalam konteks musuh, יָרַשׁ menunjuk pada pengambilalihan atau penguasaan. Pilihan ini mempertahankan citra gerbang dan tidak mengubahnya menjadi parafrasa seperti “mengalahkan musuh.”
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel Ibrani disampaikan secara alami, sementara penekanan ganda pada berkat dan pertambahan tetap terlihat. Pronomina “-nya” sengaja dipertahankan untuk menjaga bentuk kolektif tunggal sumber.
