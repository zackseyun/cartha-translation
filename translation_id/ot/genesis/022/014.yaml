  text: וַ/יִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא יְהוָ֣ה יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַ/יּ֔וֹם בְּ/הַ֥ר יְהוָ֖ה יֵרָאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/014.yaml
  text: And Abraham called the name of that place, “The LORD will provide,” as it is said to this day, “On the mountain of the LORD it will be provided.”
translation:
  language: id
  text: Lalu Abraham menamai tempat itu, “TUHAN akan menyediakan.”[a] Karena itu, sampai hari ini dikatakan, “Di gunung TUHAN akan disediakan.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “TUHAN akan melihat.” Dalam konteks ini, “melihat” dapat mengandung gagasan bahwa TUHAN memperhatikan kebutuhan dan menyediakan jawabannya.
    reason: Menjaga permainan kata Ibrani ראה serta membedakan arti dasar dari pemaknaan kontekstual.
  - marker: b
    text: Secara harfiah, “Di gunung TUHAN, Ia akan terlihat,” atau, “Di gunung TUHAN, Ia akan menampakkan diri.” Bentuk Ibrani יֵרָאֶה memiliki ambiguitas yang tidak sepenuhnya terwakili oleh terjemahan kontekstual “akan disediakan.”
    reason: Menjaga kemungkinan makna Nifal “terlihat/menampakkan diri” tanpa meniadakan hubungan kontekstual dengan penyediaan.
lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital, sekaligus menjaga register yang akrab dan khidmat.
- source_word: יִרְאֶה (yirʾeh)
  choice: Menyediakan
  rationale: Bentuk ini secara harfiah berarti ‘akan melihat’, tetapi dalam konteks ayat 8 dan 13 mengandung makna bahwa TUHAN melihat kebutuhan lalu menyediakan; ‘Menyediakan’ menyampaikan maksud kontekstual dan mempertahankan nama tempat yang alami dalam bahasa Indonesia.
- source_word: יֵרָאֶה (yērāʾeh)
  choice: akan disediakan
  rationale: Bentuk Nifal ini secara harfiah dapat berarti ‘akan terlihat’ atau ‘akan menampakkan diri’. Terjemahan ‘akan disediakan’ mempertahankan permainan makna kontekstual dengan nama tempat dan selaras dengan tindakan penyediaan dalam kisah ini, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם (wayyiqrāʾ ... šēm hammāqôm)
  choice: menamai tempat itu
  rationale: Ungkapan Indonesia yang alami dan tepat untuk idiom Ibrani ‘memanggil nama tempat itu’.
- source_word: אֲשֶׁר יֵאָמֵר הַיּוֹם (ʾăšer yēʾāmēr hayyôm)
  choice: Karena itu, sampai hari ini dikatakan
  rationale: Menyampaikan hubungan etiologis ungkapan tersebut dengan penamaan tempat tanpa menentukan siapa penuturnya, sesuai bentuk pasif Ibrani.
theological_decisions:
- issue: Hubungan antara ‘melihat’ dan pemeliharaan/penyediaan Allah
  choice: Terjemahkan יִרְאֶה sebagai ‘Menyediakan’ dan יֵרָאֶה secara kontekstual sebagai ‘akan disediakan’, dengan arti harfiah dicatat.
  alternative: ‘TUHAN akan melihat’ dan ‘di gunung TUHAN akan terlihat/menampakkan diri’.
  rationale: Konteks langsung menghubungkan ‘Allah akan melihat/menyediakan bagi diri-Nya anak domba’ (ayat 8) dengan domba jantan yang ditemukan (ayat 13). Namun, karena teks Ibrani sengaja memakai akar ראה, kemungkinan makna ‘melihat/menampakkan diri’ tidak dihapus, melainkan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Kapitalisasi “TUHAN” menandai nama ilahi YHWH. Tanda kutip membedakan nama tempat dan peribahasa yang masih diucapkan pada masa narator.
