id: GEN.22.6
reference: Genesis 22:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת עֲצֵ֣י הָ/עֹלָ֗ה וַ/יָּ֨שֶׂם֙ עַל יִצְחָ֣ק בְּנ֔/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ אֶת הָ/אֵ֖שׁ וְ/אֶת הַֽ/מַּאֲכֶ֑לֶת וַ/יֵּלְכ֥וּ שְׁנֵי/הֶ֖ם יַחְדָּֽו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/006.yaml
  text: So Abraham took the wood for the burnt offering and laid it on Isaac his son[a], and he took in his hand the fire and the knife[b], and the two of them walked on together.
translation:
  language: id
  text: Lalu Abraham mengambil kayu untuk kurban bakaran dan menaruhnya di atas Ishak, anaknya. Ia membawa api dan pisau di tangannya, lalu mereka berdua berjalan bersama-sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצֵי הָעֹלָה
  choice: kayu untuk kurban bakaran
  rationale: Bentuk konstruksi Ibrani secara harfiah berarti 'kayu kurban bakaran', tetapi hubungan tujuannya paling wajar dinyatakan dalam bahasa Indonesia dengan 'kayu untuk kurban bakaran'. עֹלָה adalah istilah kurban yang dibakar seluruhnya.
- source_word: וַיָּשֶׂם עַל
  choice: menaruhnya di atas
  rationale: שׂים dengan עַל menyatakan tindakan menempatkan sesuatu di atas seseorang atau sesuatu; ungkapan ini alami dan mempertahankan gambaran Ishak memikul kayu.
- source_word: יִצְחָק בְּנוֹ
  choice: Ishak, anaknya
  rationale: Aposisi ini mempertahankan urutan Ibrani dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Terjemahan langsung bentuk tunggal Ibrani, yang menyatakan bahwa Abraham sendiri membawa benda-benda itu.
- source_word: הָאֵשׁ
  choice: api
  rationale: Teks hanya menyebut 'api' dan tidak menentukan wadah atau sarana pembawanya, sehingga rincian seperti perbaraan tidak ditambahkan.
- source_word: הַמַּאֲכֶלֶת
  choice: pisau
  rationale: Nomina ini dapat menunjuk pisau untuk penyembelihan, tetapi konteks sudah menyampaikan nuansa kurban; 'pisau' paling jelas dan tidak berlebihan.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם יַחְדָּו
  choice: lalu mereka berdua berjalan bersama-sama
  rationale: Terjemahan ini mempertahankan gerak naratif, penegasan bahwa keduanya berjalan, dan unsur kebersamaan dalam יַחְדָּו.
theological_decisions:
- issue: Istilah kurban dalam עֹלָה
  choice: kurban bakaran
  alternative: kurban yang naik
  rationale: Dalam konteks ritual ini עֹלָה merupakan istilah baku bagi kurban yang dibakar seluruhnya. 'Kurban bakaran' menyampaikan kategori persembahan tersebut tanpa mengembangkan makna etimologis 'naik' menjadi penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Kurban' dipilih sesuai ejaan baku untuk persembahan religius. Struktur kalimat dibagi agar jelas, tanpa menghilangkan urutan tindakan atau pengulangan kebersamaan pada akhir ayat.
