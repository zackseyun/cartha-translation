base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/018.yaml
  text: And in your offspring all the nations of the earth will be blessed[a], because you have obeyed my voice.
translation:
  language: id
  text: Melalui keturunanmu, semua bangsa di bumi akan diberkati[a], karena engkau telah menaati perkataan-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan memberkati diri sendiri.” Kata kerja Ibrani di sini dapat dipahami secara refleksif.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִתְבָּרֲכוּ
  choice: akan diberkati
  rationale: Bentuk Hitpael dari ברך dalam rumusan janji kepada para leluhur dapat dipahami secara pasif atau refleksif. Terjemahan pasif ini paling wajar dalam bahasa Indonesia dan sesuai dengan konteks janji, sedangkan kemungkinan refleksif dipertahankan dalam catatan kaki.
- source_word: בְזַרְעֲךָ
  choice: melalui keturunanmu
  rationale: זֶרַע merupakan nomina kolektif yang dapat menunjuk pada keturunan. Preposisi בְּ di sini diterjemahkan secara idiomatis sebagai 'melalui', tanpa menentukan apakah yang dimaksud satu keturunan atau keturunan secara kolektif.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: גּוֹיִם secara langsung berarti 'bangsa-bangsa', dan הָאָרֶץ dalam konteks ini menyatakan cakupan seluruh bumi.
- source_word: עֵקֶב אֲשֶׁר
  choice: karena
  rationale: Ungkapan ini memperkenalkan alasan bagi peneguhan janji; 'karena' menyampaikan hubungan sebab secara ringkas dan alami.
- source_word: שָׁמַעְתָּ בְּקֹלִי
  choice: engkau telah menaati perkataan-Ku
  rationale: Idiom שׁמע בקול menyatakan mendengarkan dengan tanggapan berupa ketaatan. 'Menaati perkataan-Ku' menyampaikan makna idiomatis itu secara alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Makna bentuk Hitpael dari ברך dalam janji kepada Abraham
  choice: Bangsa-bangsa menerima berkat melalui keturunan Abraham ('akan diberkati').
  alternative: Bangsa-bangsa akan memberkati diri dengan memakai keturunan Abraham sebagai rumusan berkat ('akan memberkati diri').
  rationale: Konteks perjanjian mendukung nuansa pasif atau resultatif, tetapi bentuk Ibraninya juga memungkinkan pemahaman refleksif. Kemungkinan itu tidak dihapus, melainkan dicantumkan dalam catatan kaki.
- issue: Rujukan kolektif atau tunggal dari זֶרַע
  choice: Memakai kata kolektif 'keturunan' tanpa menentukan jumlah.
  alternative: Memakai bentuk yang secara tegas menunjuk kepada satu orang atau kepada banyak keturunan.
  rationale: Kata Ibrani זֶרַע secara gramatikal berbentuk tunggal tetapi lazim berfungsi sebagai nomina kolektif. Terjemahan tidak memaksakan kesimpulan teologis yang melampaui ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' serta bentuk '-Ku' mempertahankan nada langsung ilahi. 'Melalui keturunanmu' dipilih sebagai ungkapan alami bagi בְזַרְעֲךָ sambil menghindari terjemahan harfiah 'di dalam keturunanmu' yang kurang idiomatis.
