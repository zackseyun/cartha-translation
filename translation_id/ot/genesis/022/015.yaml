  text: וַ/יִּקְרָ֛א מַלְאַ֥ךְ יְהוָ֖ה אֶל אַבְרָהָ֑ם שֵׁנִ֖ית מִן הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/015.yaml
  text: And the angel of Yahweh called to Abraham a second time from heaven,[a]
translation:
  language: id
  text: Lalu malaikat Yahweh memanggil Abraham untuk kedua kalinya dari surga,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “utusan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: Lalu ... memanggil
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan קרא dalam konteks sapaan langsung paling wajar diterjemahkan "memanggil".
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti "utusan" atau "malaikat"; dalam formula Kejadian yang menunjuk kepada sosok surgawi, "malaikat" merupakan padanan Indonesia yang paling alami, tanpa menentukan identitas teologis sosok tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai "Yahweh", bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֶל אַבְרָהָם
  choice: memanggil Abraham
  rationale: אֶל menandai orang yang disapa. Dalam bahasa Indonesia, objek langsung setelah "memanggil" lebih alami daripada konstruksi "memanggil kepada Abraham".
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Padanan ini mempertahankan nuansa ordinal yang eksplisit, bukan sekadar "lagi".
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun שָׁמַיִם secara bentuk bersifat jamak, dalam konteks suara ilahi yang datang dari tempat kediaman surgawi, "dari surga" adalah ungkapan Indonesia yang alami dan sesuai dengan ragam teks.
theological_decisions:
- issue: Pemaknaan מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Terjemahan utama memakai istilah yang lazim bagi sosok surgawi, sementara catatan kaki mempertahankan kemungkinan leksikal "utusan". Terjemahan tidak memutuskan apakah sosok ini makhluk ciptaan atau manifestasi khusus Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan naratif, nama ilahi, dan keterangan eksplisit "untuk kedua kalinya".
