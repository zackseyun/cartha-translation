  yaml_path: translation/ot/genesis/022/004.yaml
  text: On the third day Abraham lifted up his eyes and saw the place from afar[a].
translation:
  language: id
  text: Pada hari ketiga, Abraham mengangkat matanya dan melihat tempat itu dari kejauhan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "dari jauh" atau "dari jarak jauh."
    reason: Alternatif leksikal bagi מֵרָחֹק; ungkapan ini menyatakan bahwa tempat itu terlihat dari suatu jarak.
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Frasa waktu dengan kata sandang tentu dan bilangan tingkat; terjemahan langsung ini alami dalam bahasa Indonesia dan tidak menambahkan keterangan seperti 'dalam perjalanan' yang tidak tersurat.
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: melayangkan pandangannya
  rationale: Idiom Ibrani secara harfiah berarti 'mengangkat matanya'. Padanan ini mempertahankan gambaran tindakan mengarahkan pandangan, tetapi terdengar lebih wajar dalam bahasa Indonesia modern daripada terjemahan harfiah.
- source_word: וַיַּרְא
  choice: dan melihat
  rationale: Bentuk naratif berurutan dari ראה menyatakan tindakan berikutnya secara sederhana. Subjek Abraham tetap jelas sehingga tidak perlu mengulang kata ganti.
- source_word: הַמָּקוֹם
  choice: tempat itu
  rationale: Kata benda tentu ini menunjuk kepada tempat yang sudah ditetapkan dalam konteks. 'Tempat itu' merupakan padanan Indonesia yang alami tanpa mempersempit maknanya menjadi lokasi atau situs tertentu.
- source_word: מֵרָחֹק
  choice: dari kejauhan
  rationale: Frasa adverbial ini menyatakan jarak. 'Dari kejauhan' alami, ringkas, dan tetap memiliki bobot naratif yang sesuai.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Mengikuti bentuk baku nama tokoh ini dalam Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan naratif Ibrani, sedangkan idiom tentang mengangkat mata disampaikan dengan ungkapan Indonesia yang alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
