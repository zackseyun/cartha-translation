base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/005.yaml
  text: And Abraham said to his young men[a], “Stay here with the donkey. I and the boy will go over there[b], and we will worship and return to you.”
translation:
  language: id
  text: Lalu Abraham berkata kepada para pemudanya, “Tinggallah di sini bersama keledai itu. Aku dan anak itu akan pergi ke sana. Kami akan menyembah[a] dan kembali[b] kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud”; kata Ibrani ini secara lebih harfiah dapat menunjuk pada tindakan membungkuk atau merebahkan diri dalam penyembahan.
    reason: lexical_alternative
  - marker: b
    text: 'Kata kerja Ibrani berbentuk jamak: “kami akan kembali kepada kalian.” Teks tidak menjelaskan apakah perkataan ini merupakan penyembunyian maksud, pengharapan, atau keyakinan akan penyediaan Allah.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: נְעָרָיו
  choice: kedua orang mudanya
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pendamping. Dalam konteks ini yang dimaksud ialah dua laki-laki yang menyertai Abraham (ayat 3). Ungkapan ini mempertahankan unsur usia tanpa mempersempit maknanya menjadi jabatan ‘pelayan’.
- source_word: שְׁבוּ לָכֶם פֹּה
  choice: Tinggallah di sini
  rationale: יָשַׁב secara harfiah dapat berarti duduk, tinggal, atau menetap. Dalam perintah agar mereka tidak ikut melanjutkan perjalanan, ‘Tinggallah di sini’ merupakan ungkapan Indonesia yang wajar.
- source_word: עִם הַחֲמוֹר
  choice: bersama keledai ini
  rationale: חֲמוֹר ialah istilah umum untuk keledai. Artikel Ibrani menunjuk kepada keledai yang sudah hadir dalam kisah, sehingga ‘keledai ini’ wajar dalam bahasa Indonesia.
- source_word: וַאֲנִי וְהַנַּעַר
  choice: Aku dan anak itu
  rationale: נַעַר di sini menunjuk kepada Ishak. ‘Anak itu’ mencerminkan sudut pandang Abraham dan tidak menetapkan usia Ishak secara lebih khusus daripada yang dinyatakan konteks.
- source_word: נֵלְכָה עַד כֹּה
  choice: akan pergi ke sana
  rationale: Bentuk kohortatif dan frasa penunjuk tempat menyatakan niat untuk bergerak menuju tempat tertentu yang terpisah; ‘pergi ke sana’ alami dan tepat.
- source_word: וְנִשְׁתַּחֲוֶה
  choice: kami akan menyembah
  rationale: שָׁחָה pada dasarnya berarti membungkuk atau bersujud, dan dalam konteks persembahan ini tindakan tersebut merupakan penyembahan. Makna jasmaninya dicatat dalam catatan kaki.
- source_word: וְנָשׁוּבָה אֲלֵיכֶם
  choice: dan kembali kepada kalian
  rationale: 'שׁוּב berarti kembali. Bentuk orang pertama jamak dipertahankan: Abraham mengatakan bahwa ‘kami’ akan kembali. ‘Kalian’ menyatakan penerima jamak secara jelas dalam bahasa Indonesia modern.'
theological_decisions:
- issue: Bentuk jamak dalam perkataan Abraham tentang kepulangan
  choice: 'Mempertahankan makna harfiah bentuk jamak: ‘kami akan ... kembali kepada kalian.’'
  alternative: Menafsirkannya secara eksplisit sebagai penyembunyian maksud Abraham atau sebagai pernyataan iman bahwa Abraham dan Ishak pasti kembali bersama.
  rationale: Bahasa Ibrani memakai bentuk orang pertama jamak baik untuk menyembah maupun untuk kembali. Terjemahan mempertahankan ketegangan ini tanpa menentukan apakah Abraham sedang menyembunyikan maksudnya, mengungkapkan pengharapan, atau menyatakan keyakinan akan penyediaan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. ‘Aku’ sesuai dengan percakapan pribadi dalam narasi; ‘kalian’ menjernihkan bentuk jamak. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
