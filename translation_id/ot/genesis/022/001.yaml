  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וְ/הָ֣/אֱלֹהִ֔ים נִסָּ֖ה אֶת אַבְרָהָ֑ם וַ/יֹּ֣אמֶר אֵלָ֔י/ו אַבְרָהָ֖ם וַ/יֹּ֥אמֶר הִנֵּֽנִ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/001.yaml
  text: After these things[a], God tested Abraham and said to him, “Abraham!” And he said[b], “Here I am.”
translation:
  language: id
  text: Setelah semuanya itu, Allah menguji Abraham. Allah berkata kepadanya, “Abraham!” Ia menjawab, “Aku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Setelah semua peristiwa itu
  rationale: וַיְהִי berfungsi sebagai pengantar naratif dan tidak perlu diterjemahkan tersendiri. דְּבָרִים dapat berarti hal-hal, perkara, atau peristiwa; dalam konteks narasi, 'peristiwa' menyampaikan hubungan temporal secara lebih alami dalam bahasa Indonesia.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam bahasa Indonesia standar, 'Allah' merupakan padanan lazim untuk אֱלֹהִים ketika menunjuk kepada Tuhan yang benar; bentuk ini bukan nama ilahi YHWH.
- source_word: נִסָּה
  choice: menguji
  rationale: Bentuk Piel dari נסה berarti menguji atau mencoba untuk membuktikan kualitas seseorang. 'Menguji' jelas dan tidak menyiratkan bujukan untuk berbuat jahat.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Allah berkata kepadanya
  rationale: Subjek 'Allah' diulang agar pergantian pelaku tetap jelas dan kalimat Indonesia terdengar alami.
- source_word: הִנֵּנִי
  choice: Ya, aku di sini
  rationale: Ungkapan ini menyatakan kehadiran, perhatian, dan kesiapan untuk menanggapi. 'Ya, aku di sini' lebih alami dalam dialog Indonesia daripada bentuk harfiah yang memakai 'lihatlah'.
theological_decisions:
- issue: Makna נסה ketika Allah menjadi subjek
  choice: Allah menguji Abraham
  alternative: Allah mencobai Abraham
  rationale: '''Menguji'' mempertahankan gagasan pembuktian dalam konteks ini tanpa mengesankan bahwa Allah membujuk Abraham melakukan kejahatan. Terjemahan ini tidak menghilangkan ketegangan naratif mengenai isi ujian tersebut.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Dialog dibuat alami tanpa menjadi terlalu santai; kata ganti 'aku' sesuai dengan tuturan langsung Abraham kepada Allah.
