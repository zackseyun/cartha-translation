base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/020.yaml
  text: After these things, it was reported to Abraham, saying, “Look, Milcah also has borne sons to your brother Nahor:”
translation:
  language: id
  text: Setelah peristiwa-peristiwa itu, Abraham mendapat kabar, “Lihatlah, Milka juga telah melahirkan anak-anak laki-laki bagi Nahor, saudaramu:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah semua peristiwa itu
  rationale: Ungkapan Ibrani harfiah ‘sesudah hal-hal ini’ secara alami merujuk pada rangkaian peristiwa sebelumnya; ‘peristiwa’ lebih idiomatis dalam narasi Indonesia.
- source_word: וַיֻּגַּד לְאַבְרָהָם
  choice: Abraham mendapat kabar
  rationale: Bentuk pasif Ibrani berarti bahwa sesuatu diberitahukan kepada Abraham; ungkapan ini mempertahankan makna dengan bahasa Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: “
  rationale: Dalam bahasa Ibrani, kata ini memperkenalkan isi kabar atau ucapan. Dalam bahasa Indonesia, fungsi tersebut cukup dinyatakan dengan tanda baca dan kutipan langsung.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian Abraham kepada kabar yang disampaikan. ‘Ketahuilah’ terdengar lebih alami dan bermartabat daripada ‘Lihatlah’ ketika yang diperkenalkan adalah informasi, bukan objek visual.
- source_word: יָלְדָה ... בָּנִים
  choice: telah melahirkan anak-anak lelaki
  rationale: ‘Anak-anak lelaki’ mempertahankan jenis kelamin yang dinyatakan oleh בָּנִים dan bentuk perfektif diterjemahkan dengan ‘telah melahirkan’.
- source_word: לְנָחוֹר אָחִיךָ
  choice: bagi Nahor, saudaramu
  rationale: Preposisi לְ menyatakan bahwa anak-anak itu dilahirkan bagi Nahor; aposisi ‘saudaramu’ mempertahankan sapaan orang kedua kepada Abraham.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Tanda titik dua dipertahankan karena ayat ini memperkenalkan daftar nama pada ayat berikutnya. Nama מִלְכָּה ditulis ‘Milka’ sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
