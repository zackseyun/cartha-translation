  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בִּ֥/י נִשְׁבַּ֖עְתִּי נְאֻם יְהוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֨יתָ֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה וְ/לֹ֥א חָשַׂ֖כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/016.yaml
  text: and said[a], “By myself I have sworn, declares Yahweh, because you have done this thing and have not withheld your son[b], your only son,”
translation:
  language: id
  text: lalu berkata, “Demi diri-Ku sendiri Aku telah bersumpah—demikianlah firman Yahweh—karena engkau telah melakukan hal ini dan tidak menahan[a] anakmu, anakmu yang satu-satunya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menyayangkan.”
    reason: Kata kerja Ibrani dapat berarti menahan, menahan diri untuk memberikan, atau dalam konteks ini tidak menyayangkan.
  - marker: b
    text: Kata Ibrani ini dapat berarti “satu-satunya” atau “yang unik.”
    reason: Padanan alternatif diperlukan untuk mempertahankan rentang makna יָחִיד tanpa menghapus ketegangan konteks keluarga Abraham.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: lalu berkata
  rationale: Bentuk naratif ini melanjutkan ujaran dari ayat sebelumnya. Subjek tidak diulang karena sudah jelas dari konteks, sebagaimana dimungkinkan dalam bahasa Indonesia.
- source_word: בִּי נִשְׁבַּעְתִּי
  choice: Demi diri-Ku sendiri Aku telah bersumpah
  rationale: בִּי merupakan rumusan sumpah yang berarti bahwa Yahweh bersumpah demi diri-Nya sendiri; bentuk perfektif נִשְׁבַּעְתִּי dipertahankan dengan 'telah bersumpah'.
- source_word: נְאֻם יְהוָה
  choice: demikianlah firman Yahweh
  rationale: Ungkapan ini menandai pernyataan ilahi yang resmi. 'Demikianlah firman' terdengar khidmat dan wajar dalam bahasa Indonesia, sementara nama ilahi ditransliterasikan sebagai 'Yahweh'.
- source_word: כִּי יַעַן אֲשֶׁר
  choice: karena
  rationale: Gabungan partikel ini menyatakan alasan dengan penekanan. Satu kata 'karena' menyampaikan hubungan kausal secara alami tanpa pengulangan yang janggal.
- source_word: עָשִׂיתָ אֶת הַדָּבָר הַזֶּה
  choice: engkau telah melakukan hal ini
  rationale: דָּבָר di sini mengacu pada tindakan Abraham. 'Hal ini' alami dalam bahasa Indonesia dan mempertahankan penunjukan konkret dari teks.
- source_word: וְלֹא חָשַׂכְתָּ
  choice: dan tidak menahan
  rationale: חָשַׂךְ pada konteks ini berarti menahan atau tidak menyerahkan. 'Tidak menahan' paling dekat dengan ungkapan Ibrani tanpa memperkuatnya secara interpretatif menjadi 'tidak menyayangkan'.
- source_word: בִּנְךָ אֶת יְחִידֶךָ
  choice: anakmu, anakmu yang satu-satunya
  rationale: Pengulangan 'anakmu' mempertahankan susunan aposisional dan penekanan Ibrani. יָחִיד menyatakan status satu-satunya atau unik; padanan utama mempertahankan ketegangan makna tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memuat nama diri ilahi, bukan sekadar gelar. 'Yahweh' mempertahankan nama perjanjian yang terdapat dalam sumber Ibrani.
- issue: Makna יְחִידֶךָ dalam penyebutan Ishak
  choice: anakmu yang satu-satunya
  alternative: anakmu yang unik atau anak tunggalmu
  rationale: Terjemahan utama mengikuti arti leksikal 'satu-satunya' sambil membiarkan ketegangan dengan keberadaan Ismael tetap tampak. 'Anak tunggalmu' dihindari karena dapat terdengar sebagai pernyataan bahwa Abraham sama sekali tidak mempunyai anak lain, sedangkan 'unik/istimewa' lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital. Tanda pisah mengapit rumusan ilahi agar alur sumpah tetap jelas, dan koma akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya.
