  text: וַ/יִּשָּׂ֨א אַבְרָהָ֜ם אֶת עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּה אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּ/סְּבַ֖ךְ בְּ/קַרְנָ֑י/ו וַ/יֵּ֤לֶךְ אַבְרָהָם֙ וַ/יִּקַּ֣ח אֶת הָ/אַ֔יִל וַ/יַּעֲלֵ֥/הוּ לְ/עֹלָ֖ה תַּ֥חַת בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/013.yaml
  text: Then Abraham lifted up his eyes and looked[a], and behold, behind him was a ram caught in the thicket by its horns[b]. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: id
  text: Lalu Abraham mengangkat pandangannya dan melihat, dan tampaklah seekor domba jantan di belakangnya[a], yang tanduknya tersangkut di belukar. Abraham pergi mengambil domba jantan itu lalu mempersembahkannya sebagai kurban bakaran sebagai ganti anaknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di belakang”; teks Ibrani tidak mencantumkan kata ganti “-nya” secara eksplisit, dan אַחַר di sini dipahami oleh banyak penerjemah sebagai keterangan tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagai pengganti anaknya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: mengangkat pandangannya
  rationale: Ungkapan Ibrani ini berarti mengangkat mata atau mengarahkan pandangan ke atas. Pilihan ini mempertahankan gambaran aslinya sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Menyatakan tindakan Abraham sesudah mengangkat pandangan dan mempertahankan urutan narasi sumber.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Menyampaikan fungsi penunjuk perhatian dan unsur penemuan mendadak dari partikel Ibrani tanpa memakai seruan yang terasa kuno.
- source_word: אַיִל
  choice: domba jantan
  rationale: Padanan Indonesia yang tepat dan lazim untuk domba jantan dewasa dalam konteks persembahan.
- source_word: אַחַר
  choice: di belakangnya
  rationale: Dalam konteks ini paling wajar dipahami sebagai keterangan tempat. Akhiran pronominal tidak tertulis dalam teks Ibrani, sehingga alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: נֶאֱחַז
  choice: tersangkut
  rationale: Mengungkapkan keadaan pasif bahwa hewan itu tertahan atau terjerat oleh tanduknya.
- source_word: בַּסְּבַךְ
  choice: di belukar
  rationale: Belukar menyampaikan vegetasi rapat dan kusut yang dapat menahan tanduk hewan.
- source_word: בְּקַרְנָיו
  choice: tersangkut tanduknya
  rationale: Susunan ini secara alami menunjukkan bahwa tanduk domba itulah bagian yang tersangkut di belukar.
- source_word: וַיַּעֲלֵהוּ לְעֹלָה
  choice: mempersembahkannya sebagai kurban bakaran
  rationale: Dalam konteks ritual, gabungan verba עלה dan nomina עֹלָה menunjuk pada tindakan mempersembahkan hewan sebagai kurban yang dibakar seluruhnya.
- source_word: תַּחַת בְּנוֹ
  choice: sebagai ganti anaknya
  rationale: 'Preposisi תַּחַת di sini menyatakan penggantian: domba itu dipersembahkan menggantikan anak Abraham.'
theological_decisions:
- issue: Makna penggantian dalam תַּחַת בְּנוֹ
  choice: sebagai ganti anaknya
  alternative: menggantikan anaknya
  rationale: Terjemahan mempertahankan makna substitusi yang nyata dalam konteks narasi, tetapi tidak menambahkan penjelasan doktrinal yang melampaui ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “mengangkat pandangannya” mempertahankan corak naratif Ibrani tanpa menjadi kaku; “Tampaklah” menandai penemuan Abraham dengan jelas. Istilah “kurban bakaran” dipakai sebagai istilah ritual yang mudah dipahami.
