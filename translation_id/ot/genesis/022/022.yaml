  text: Kesed, Hazo, Pildash, Yidlaf, dan Betuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶּשֶׂד
  choice: Kesed
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan ejaan Alkitab Indonesia yang wajar; huruf כ diwakili dengan k.
- source_word: חֲזוֹ
  choice: Hazo
  rationale: Nama diri ditransliterasikan sebagai Hazo; ח diwakili dengan h agar mudah dibaca dalam bahasa Indonesia tanpa menambahkan bunyi asing.
- source_word: פִּלְדָּשׁ
  choice: Pildas
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia; ש di akhir nama diwakili dengan s.
- source_word: יִדְלָף
  choice: Yidlaf
  rationale: Nama diri ditransliterasikan cukup dekat dengan bunyi Ibrani; yod awal diwakili dengan y dan ף dengan f.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Dipakai bentuk Betuel yang sudah lazim dalam tradisi Alkitab bahasa Indonesia dan sesuai dengan transliterasi nama Ibrani.
- source_word: וְאֶת / וְאֵת
  choice: dan
  rationale: את adalah penanda objek langsung yang tidak perlu diterjemahkan; waw berulang membentuk deret dan disampaikan secara alami dengan koma serta kata 'dan' sebelum unsur terakhir.
