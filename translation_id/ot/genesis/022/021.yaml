  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת ע֥וּץ בְּכֹר֖/וֹ וְ/אֶת בּ֣וּז אָחִ֑י/ו וְ/אֶת קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/021.yaml
  text: Uz his firstborn[a], Buz his brother, and Kemuel the father of Aram.
translation:
  language: id
  text: Us, anak sulungnya, Bus, saudaranya, dan Kemuel, ayah Aram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “leluhur Aram.” Dalam silsilah, kata “ayah” kadang-kadang dapat berarti leluhur atau pendiri suatu garis keturunan, bukan hanya orang tua langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ע֥וּץ
  choice: Us
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּכֹר֖וֹ
  choice: anak sulungnya
  rationale: Istilah בְּכוֹר menyatakan anak pertama menurut urutan kelahiran; 'anak sulungnya' alami dalam bahasa Indonesia dan tetap mempertahankan makna genealogisnya.
- source_word: בּ֣וּז
  choice: Bus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אָחִ֑יו
  choice: saudaranya
  rationale: Padanan langsung bagi istilah kekerabatan dengan akhiran orang ketiga tunggal; bentuk pronominal ini mempertahankan cara pengacuan teks Ibrani.
- source_word: קְמוּאֵ֖ל
  choice: Kemuel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: אֲבִ֥י
  choice: ayah
  rationale: Ini padanan paling langsung bagi אֲבִי dalam konstruksi genealogis, tanpa menutup kemungkinan bahwa istilah tersebut dapat dipakai dalam arti leluhur.
- source_word: אֲרָֽם
  choice: Aram
  rationale: Nama diri dipertahankan sebagai Aram; teks tidak secara eksplisit menentukan apakah yang dimaksud adalah individu, leluhur eponim, atau wilayah.
theological_decisions:
- issue: Cakupan genealogis אֲבִי אֲרָם
  choice: Kemuel, ayah Aram
  alternative: Kemuel, leluhur Aram
  rationale: Teks Ibrani secara langsung berbunyi 'ayah Aram'. Namun, dalam silsilah, 'ayah' dapat pula menunjuk kepada leluhur atau pendiri suatu garis keturunan. Terjemahan utama mempertahankan ungkapan langsung, sedangkan kemungkinan makna yang lebih luas dicatat tanpa menjadikannya tafsiran utama.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan daftar nama dipertahankan, dengan koma untuk memperjelas keterangan genealogis. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
