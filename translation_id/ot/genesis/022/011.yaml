  text: וַ/יִּקְרָ֨א אֵלָ֜י/ו מַלְאַ֤ךְ יְהוָה֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֖אמֶר אַבְרָהָ֣ם אַבְרָהָ֑ם וַ/יֹּ֖אמֶר הִנֵּֽנִ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/011.yaml
  text: But the angel of Yahweh called to him from heaven and said[a], “Abraham, Abraham!” And he said[b], “Here I am.”
translation:
  language: id
  text: Lalu malaikat Yahweh memanggilnya dari langit dan berkata, “Abraham, Abraham!” Ia berkata, “Aku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: berseru
  rationale: Dalam konteks ini קרא menyatakan panggilan bersuara dari kejauhan; “berseru” secara alami menyampaikan kuatnya panggilan tanpa harus berarti berteriak.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks pronominal menunjukkan arah panggilan kepada Abraham.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; asal suara dari langit dan pola naratif Kejadian mendukung “malaikat,” sedangkan nama perjanjian יְהוָה ditransliterasikan “Yahweh.”
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, שָׁמַיִם lazim menunjuk langit atau ranah surgawi; “dari langit” merupakan ungkapan Indonesia yang wajar.
- source_word: וַיֹּאמֶר
  choice: berkata / menjawab
  rationale: אָמַר berarti berkata; pada kemunculan kedua, fungsi pragmatisnya adalah jawaban Abraham, sehingga “menjawab” lebih alami dalam bahasa Indonesia.
- source_word: אַבְרָהָם אַבְרָהָם
  choice: Abraham, Abraham!
  rationale: Pengulangan nama dipertahankan karena menyatakan sapaan yang mendesak dan pribadi.
- source_word: הִנֵּנִי
  choice: Aku di sini
  rationale: הִנֵּנִי adalah rumus jawaban yang menyatakan kehadiran dan kesiapan; “Aku di sini” alami dan mempertahankan sudut pandang orang pertama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memuat nama ilahi secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh atau penafsiran sebagai manifestasi Yahweh sendiri
  rationale: Terjemahan mempertahankan sebutan tekstual dan tidak memutuskan secara eksplisit identitas metafisis tokoh tersebut. Konteks surgawi mendukung arti “malaikat,” tetapi tidak ditambahkan penafsiran bahwa tokoh itu adalah Yahweh sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” mempertahankan peralihan naratif וַ dalam saat kritis. Dialog dibuat alami; “Ia menjawab” memperjelas fungsi ujaran kedua tanpa mengubah pelakunya.
