  source_fidelity: Waw-konsekutif pada awal ayat terutama meneruskan urutan narasi, bukan menyatakan pertentangan. Karena itu “Namun” tidak didukung secara jelas. Kata וַיִּקְרָא lebih netral sebagai “memanggil” daripada “berseru,” yang dapat menyiratkan intensitas tambahan. Unsur-unsur lain—malaikat Yahweh, dari langit, pengulangan nama, dan respons Abraham—terpelihara dengan baik.
  naturalness: “Lalu malaikat Yahweh memanggilnya dari langit” adalah bahasa Indonesia baku, jelas, dan mengalir. “Ia berkata” mempertahankan verba ujaran dasar אָמַר tanpa menambahkan nuansa respons eksplisit, sementara “Aku di sini” wajar untuk הִנֵּנִי.
  terminology: “Malaikat Yahweh” mempertahankan ambiguitas leksikal מַלְאָךְ secara memadai dalam konteks surgawi dan tidak memaksakan identitas metafisis tertentu. “Yahweh” secara langsung mencerminkan יהוה. Tidak diperlukan catatan kaki dalam bahasa Indonesia untuk ayat ini.
