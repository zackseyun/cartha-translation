- from: Lalu sampailah mereka di tempat yang telah Allah katakan kepadanya. Abraham membangun mazbah itu di sana dan menyusun kayu-kayunya. Ia mengikat Ishak, anaknya, lalu menempatkannya di atas mazbah itu, di atas kayu-kayu tersebut.[a]
  to: Lalu mereka sampai di tempat yang telah Allah beritahukan kepadanya. Di sana Abraham membangun mezbah itu dan menyusun kayu. Ia mengikat Ishak, anaknya, lalu menempatkannya di atas mezbah itu, di atas kayu yang telah disusun.
  rationale: Revisi mempertahankan urutan naratif, subjek jamak pada kedatangan, tindakan Allah yang mendahului kedatangan, artikel tentu pada mezbah, serta posisi Ishak di atas kayu. Bahasa dibuat lebih alami dalam bahasa Indonesia baku, dan catatan kaki yang secara semantis tidak tepat dihapus.
