base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/009.yaml
  text: Then they came to the place that God had told him[a], and Abraham built the altar there and arranged the wood. He bound Isaac his son and placed him on the altar[c][b], on top of the wood.
translation:
  language: id
  text: Lalu mereka sampai di tempat yang telah Allah beritahukan kepadanya. Di sana Abraham membangun mezbah itu dan menyusun kayu. Ia mengikat Ishak, anaknya, lalu menempatkannya di atas mezbah itu, di atas kayu yang telah disusun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu sampailah mereka
  rationale: Bentuk naratif wayyiqtol melanjutkan urutan peristiwa; “lalu” menyatakan kesinambungan, sedangkan “mereka” mempertahankan subjek jamak.
- source_word: אֲשֶׁר אָמַר לוֹ הָאֱלֹהִים
  choice: yang telah Allah katakan kepadanya
  rationale: אמר secara harfiah berarti “mengatakan”; bentuk lampau selesai menunjukkan bahwa perkataan Allah mendahului kedatangan mereka.
- source_word: וַיִּבֶן ... אֶת הַמִּזְבֵּחַ
  choice: membangun mazbah itu
  rationale: Artikel tentu Ibrani dipertahankan dengan “itu”, menunjuk kepada mazbah khusus yang dipersiapkan bagi persembahan tersebut.
- source_word: וַיַּעֲרֹךְ אֶת הָעֵצִים
  choice: menyusun kayu-kayunya
  rationale: ערך berarti mengatur atau menyusun dengan tertib; bentuk ini alami dalam konteks persiapan korban.
- source_word: וַיַּעֲקֹד
  choice: Ia mengikat
  rationale: עקד secara khusus menyatakan tindakan mengikat; pilihan ini langsung dan tidak memperhalus beratnya tindakan tersebut.
- source_word: יִצְחָק בְּנוֹ
  choice: Ishak, anaknya
  rationale: Urutan dan hubungan aposisional dalam bahasa Ibrani dipertahankan secara alami dalam bahasa Indonesia.
- source_word: וַיָּשֶׂם אֹתוֹ עַל הַמִּזְבֵּחַ
  choice: lalu menempatkannya di atas mazbah itu
  rationale: שׂים adalah verba umum untuk menaruh atau menempatkan; “menempatkan” tidak menambahkan cara tindakan yang tidak dinyatakan teks.
- source_word: מִמַּעַל לָעֵצִים
  choice: di atas kayu-kayu tersebut
  rationale: Frasa ini menunjukkan posisi Ishak di atas kayu yang telah disusun; catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah, “lebih tinggi dari/di sebelah atas kayu”.
theological_decisions:
- issue: Ketentuan mazbah korban
  choice: mazbah itu
  alternative: sebuah mazbah
  rationale: Teks Ibrani memakai artikel tentu. Terjemahan ini mempertahankan kekhususan struktur yang sedang dipersiapkan tanpa menambahkan simbolisme teologis.
- issue: Tindakan terhadap Ishak
  choice: Ia mengikat Ishak, anaknya
  alternative: Ia mengikat erat Ishak, anaknya
  rationale: “Mengikat” mempertahankan arti verba tanpa menambahkan tingkat kekencangan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipertahankan sebagai istilah umum dalam terjemahan Alkitab Indonesia; susunan kalimat dibuat lancar tanpa menghilangkan urutan tindakan dalam narasi Ibrani.
