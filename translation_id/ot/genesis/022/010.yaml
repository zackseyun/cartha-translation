  text: Then Abraham reached out his hand and took the knife to slaughter his son[a][b].
translation:
  language: id
  text: Lalu Abraham mengulurkan tangannya dan mengambil pisau itu untuk menyembelih anak laki-lakinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menyembelih” lebih khusus daripada kata umum “membunuh” dan dapat mengandung nuansa kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengulurkan
  rationale: Dalam konteks tindakan tangan, verba ini berarti mengulurkan atau menjangkaukan, bukan mengutus. “Mengulurkan tangannya” alami dan tetap konkret dalam bahasa Indonesia.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Padanan langsung bagi nomina tunggal dengan akhiran pronominal orang ketiga maskulin.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Padanan umum yang tepat bagi tindakan mengambil pisau; tidak menambahkan gambaran cara memegang yang tidak dinyatakan teks.
- source_word: הַמַּאֲכֶלֶת
  choice: pisau itu
  rationale: Nomina ini menunjuk alat pemotong untuk penyembelihan. “Pisau” merupakan padanan Indonesia yang paling jelas dan wajar; artikel definit diterjemahkan dengan “itu” karena pisau tersebut telah disebut dalam konteks sebelumnya.
- source_word: לִשְׁחֹט
  choice: bersiap menyembelih
  rationale: Bentuk infinitif dengan ל menyatakan tujuan tindakan. Ungkapan “bersiap menyembelih” menyampaikan bahwa Abraham mengambil pisau dengan tujuan segera melakukan penyembelihan, tanpa menyatakan bahwa tindakan itu selesai. Verba “menyembelih” mempertahankan kekhususan dan nuansa kurban dari שׁחט.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Padanan langsung bagi nomina dengan akhiran pronominal; konteks sudah menjelaskan bahwa yang dimaksud ialah anak laki-laki Abraham.
- source_word: וַ
  choice: Lalu … dan
  rationale: Rangkaian waw-konsekutif memajukan urutan narasi. “Lalu” dan “dan” menghasilkan alur modern yang alami tanpa mengubah hubungan tindakan.
theological_decisions:
- issue: Apakah שָׁחַט diterjemahkan dengan istilah yang bernuansa kurban
  choice: menyembelih
  alternative: membunuh
  rationale: שָׁחַט lebih khusus daripada verba umum untuk membunuh dan lazim dipakai bagi penyembelihan hewan, termasuk dalam konteks kurban. “Menyembelih” mempertahankan bobot ritual dan emosional adegan tanpa memasukkan kesimpulan teologis di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan tindakan dan ketegangan adegan.
