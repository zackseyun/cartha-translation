  naturalness: Bahasa Indonesia baku, jelas, dan sesuai register naratif Alkitab modern. “Ulurkan tanganmu untuk mencelakakan” secara idiomatis menjelaskan daya-cakup ungkapan Ibrani dalam konteksnya tanpa menghilangkan larangan kedua yang menyeluruh.
  terminology: Istilah “takut akan Allah” dan kapitalisasi rujukan ilahi tepat. Namun, catatan b keliru menyebut “satu-satunya milikmu” sebagai bentuk harfiah; יְחִידְךָ berarti “satu-satunya [milikmu/yang engkau miliki]” secara bentuk, tetapi dalam aposisi ini terjemahan harfiahnya yang tepat adalah “anakmu, satu-satunya.” Catatan tidak boleh memberi kesan bahwa kata Ibrani itu sendiri berarti “milik.”
