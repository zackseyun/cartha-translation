source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אַל תִּשְׁלַ֤ח יָֽדְ/ךָ֙ אֶל הַ/נַּ֔עַר וְ/אַל תַּ֥עַשׂ ל֖/וֹ מְא֑וּמָּה כִּ֣י עַתָּ֣ה יָדַ֗עְתִּי כִּֽי יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְ/לֹ֥א חָשַׂ֛כְתָּ אֶת בִּנְ/ךָ֥ אֶת יְחִידְ/ךָ֖ מִמֶּֽ/נִּי־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/022/012.yaml
  text: And he said[a], “Do not lay your hand on the boy, and do not do anything to him, for now I know that you fear God, since you have not withheld your son, your only son[b], from me.”
translation:
  language: id
  text: Lalu Ia berkata, “Jangan ulurkan tanganmu untuk mencelakakan anak itu, dan jangan lakukan apa pun kepadanya. Sebab, sekarang Aku tahu bahwa engkau takut akan Allah, karena engkau tidak menahan[a] anakmu, anakmu satu-satunya[b], dari-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menyayangkan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anakmu, satu-satunya”; ungkapan ini menekankan kedudukan Ishak yang unik dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁלַח יָדְךָ אֶל
  choice: ulurkan tanganmu untuk mencelakakan
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang mengulurkan tangan terhadap seseorang, tetapi dalam konteks ini berarti menggunakan kekerasan atau mencelakakan. Tambahan 'untuk mencelakakan' membuat maksud larangan jelas dalam bahasa Indonesia tanpa menggantinya dengan parafrasa yang terlalu luas.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau orang muda. 'Anak itu' wajar dalam alur kisah ini dan tidak menentukan usia Ishak secara lebih sempit daripada konteks.
- source_word: תַּעַשׂ לוֹ מְאוּמָּה
  choice: lakukan apa pun kepadanya
  rationale: 'מְאוּמָּה dalam konstruksi negatif menyatakan larangan menyeluruh: jangan melakukan apa pun kepadanya.'
- source_word: עַתָּה יָדַעְתִּי
  choice: sekarang Aku tahu
  rationale: Terjemahan langsung ini mempertahankan bentuk dan ketegangan teologis dalam pernyataan ilahi tanpa mengubahnya menjadi 'sekarang terbukti' atau 'sekarang tampak'.
- source_word: יְרֵא אֱלֹהִים
  choice: engkau takut akan Allah
  rationale: '''Takut akan Allah'' merupakan ungkapan Indonesia yang mapan, langsung, dan cukup luas untuk mencakup sikap hormat serta ketaatan tanpa mengganti citra sumber.'
- source_word: חָשַׂכְתָּ
  choice: tidak menahan
  rationale: Kata kerja ini berarti menahan, tidak memberikan, atau tidak menyayangkan. 'Tidak menahan ... dari-Ku' paling dekat dengan konstruksi Ibrani; alternatifnya dicatat dalam catatan kaki.
- source_word: יְחִידְךָ
  choice: anakmu satu-satunya
  rationale: Dalam aposisi setelah 'anakmu', יְחִידְךָ berarti 'satu-satunya milikmu/yang tunggal'. Pengulangan 'anakmu' menghasilkan bahasa Indonesia yang alami serta mempertahankan penekanan teks.
- source_word: מִמֶּנִּי
  choice: dari-Ku
  rationale: Preposisi מן dengan sufiks orang pertama tunggal secara langsung berarti 'dari-Ku', bukan 'bagi-Ku'.
theological_decisions:
- issue: Pengetahuan ilahi dalam ungkapan 'sekarang Aku tahu'
  choice: Mempertahankan 'sekarang Aku tahu' secara langsung.
  alternative: sekarang Aku melihat; sekarang terbukti bagi-Ku
  rationale: Teks Ibrani secara eksplisit berkata 'sekarang Aku tahu'. Terjemahan tidak melunakkan atau menjelaskan ungkapan ini demi menyelesaikan ketegangan teologis tentang pengetahuan Allah.
- issue: Sebutan Ishak sebagai 'anak satu-satunya'
  choice: anakmu, anakmu satu-satunya
  alternative: anakmu, anakmu yang tunggal; anakmu, satu-satunya milikmu
  rationale: Terjemahan mempertahankan penekanan aposisional teks dan tidak memasukkan 'terkasih', yang mungkin tersirat secara kontekstual tetapi bukan arti utama katanya. Catatan kaki menjelaskan bentuk harfiahnya tanpa meniadakan keberadaan Ismael dalam kisah yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia. Kalimat mempertahankan pengulangan retoris sumber, sementara ungkapan tangan diperjelas secukupnya agar tidak disalahpahami sebagai tindakan netral atau baik.
