  text: וַ/יָּבִ֣יאוּ אֶת מִקְנֵי/הֶם֮ אֶל יוֹסֵף֒ וַ/יִּתֵּ֣ן לָ/הֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּ/סּוּסִ֗ים וּ/בְ/מִקְנֵ֥ה הַ/צֹּ֛אן וּ/בְ/מִקְנֵ֥ה הַ/בָּקָ֖ר וּ/בַ/חֲמֹרִ֑ים וַ/יְנַהֲלֵ֤/ם בַּ/לֶּ֨חֶם֙ בְּ/כָל מִקְנֵ/הֶ֔ם בַּ/שָּׁנָ֖ה הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: id
  text: Maka mereka membawa ternak mereka kepada Yusuf. Yusuf memberi mereka roti sebagai imbalan atas kuda-kuda, kawanan kambing dan domba, kawanan sapi, serta keledai mereka. Selama tahun itu, ia memelihara mereka[a] dengan roti sebagai imbalan atas seluruh ternak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ia menuntun mereka dengan roti.” Kata kerja Ibrani yang digunakan dapat berarti “menuntun,” “membimbing,” atau “mengelola”; dalam konteks ini kemungkinan besar berarti memelihara atau menopang kehidupan mereka selama kelaparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: ternak mereka / seluruh ternak mereka
  rationale: Istilah ini mencakup berbagai hewan piaraan yang menjadi milik mereka, bukan hanya sapi.
- source_word: לֶחֶם
  choice: roti
  rationale: Mempertahankan padanan konkret yang diulang dalam bahasa Ibrani; dalam konteks kelaparan, roti mewakili bahan pangan pokok.
- source_word: בַּסּוּסִים ... וּבַחֲמֹרִים
  choice: sebagai ganti kuda ... dan keledai mereka
  rationale: Preposisi ב menandai barang yang diserahkan dalam pertukaran; ungkapan eksplisit ini alami dalam bahasa Indonesia.
- source_word: מִקְנֵה הַצֹּאן
  choice: kawanan kambing domba
  rationale: צֹאן merupakan kategori ternak kecil yang dapat mencakup domba dan kambing; 'kambing domba' mempertahankan cakupan tersebut.
- source_word: מִקְנֵה הַבָּקָר
  choice: kawanan sapi
  rationale: Frasa ini menunjuk kelompok ternak besar, terutama sapi.
- source_word: וַיְנַהֲלֵם
  choice: ia memelihara mereka
  rationale: נהל secara harfiah dapat berarti menuntun atau mengelola, tetapi dalam konteks ini menyatakan bahwa Yusuf menopang kehidupan mereka dengan menyediakan roti.
- source_word: בַּשָּׁנָה הַהִוא
  choice: pada tahun itu
  rationale: Padanan waktu yang langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur panjang bahasa Ibrani dipecah menjadi tiga kalimat agar jelas. 'Kambing domba' dipakai sebagai istilah kolektif bagi ternak kecil, dan ambiguitas verba נהל dipertahankan melalui catatan kaki.
