revisions:
- from: Maka mereka membawa ternak mereka kepada Yusuf. Yusuf memberi mereka roti sebagai ganti kuda, kawanan kambing domba, kawanan sapi, dan keledai mereka. Demikianlah pada tahun itu ia memelihara mereka dengan roti sebagai ganti seluruh ternak mereka.[a]
  to: Maka mereka membawa ternak mereka kepada Yusuf. Yusuf memberi mereka roti sebagai imbalan atas kuda-kuda, kawanan kambing dan domba, kawanan sapi, serta keledai mereka. Selama tahun itu, ia memelihara mereka[a] dengan roti sebagai imbalan atas seluruh ternak mereka.
  rationale: Revisi ini memperjelas istilah bagi צֹאן, membuat hubungan barter lebih idiomatis dalam bahasa Indonesia, dan memindahkan penanda catatan kaki ke verba yang menjadi pokok catatan. Makna, pengulangan 'roti', serta ketidakpastian leksikal verba Ibrani tetap dipertahankan.
