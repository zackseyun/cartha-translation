base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: id
  text: 'Yusuf menetapkan hal itu sebagai ketetapan yang berlaku sampai hari ini mengenai tanah Mesir: seperlima menjadi bagian Firaun.[a] Hanya tanah para imam saja yang tidak menjadi milik Firaun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperlima untuk Firaun.” Bagian seperlima sama dengan 20 persen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ לְחֹק
  choice: menetapkan hal itu sebagai ketetapan
  rationale: Dalam konteks hukum dan administrasi, שׂוּם dengan לְחֹק berarti menetapkan sesuatu sebagai aturan tetap; pronomina feminin אֹתָהּ merujuk pada kebijakan yang dijelaskan sebelumnya.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: yang berlaku sampai hari ini
  rationale: Ungkapan ini menunjukkan bahwa ketetapan tersebut masih berlaku pada masa narator; penambahan 'yang berlaku' membuat hubungan sintaksisnya jelas dan alami dalam bahasa Indonesia.
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: mengenai tanah Mesir
  rationale: עַל menyatakan lingkup penerapan ketetapan. 'Mengenai' lebih alami daripada terjemahan spasial 'di atas' dalam konteks hukum.
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: seperlima menjadi bagian Firaun
  rationale: חֹמֶשׁ adalah bagian seperlima, sedangkan לְפַרְעֹה menandai penerima atau pihak yang berhak atas bagian itu. Susunan ini mempertahankan hubungan keduanya tanpa menambahkan objek yang tidak disebutkan dalam ayat.
- source_word: רַק ... לְבַדָּם
  choice: Hanya ... saja
  rationale: Kombinasi 'hanya ... saja' mempertahankan penekanan ganda yang membatasi pengecualian pada tanah para imam.
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: tidak menjadi milik Firaun
  rationale: Konstruksi היה + ל menyatakan kepemilikan atau keadaan sebagai milik; dalam konteks pemindahan tanah pada ayat-ayat sebelumnya, 'tidak menjadi milik' menangkap hasil yang dimaksud.
