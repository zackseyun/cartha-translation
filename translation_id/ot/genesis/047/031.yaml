  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: id
  text: Lalu Israel berkata, “Bersumpahlah kepadaku.” Maka Yusuf bersumpah kepadanya. Kemudian Israel membungkukkan diri di bagian kepala tempat tidurnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di ujung tongkatnya.” Teks konsonantal Ibrani dapat dibaca demikian; pembacaan ini tercermin dalam Septuaginta dan Ibrani 11:21.
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: Bersumpahlah kepadaku
  rationale: Bentuk perintah dalam rumusan sumpah diterjemahkan secara langsung dan alami, sambil mempertahankan ketegasan permintaan Israel.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: Maka Yusuf bersumpah kepadanya
  rationale: Nama Yusuf dijelaskan dari konteks sebagai subjek tersirat agar rangkaian pronomina alami dan tidak membingungkan dalam bahasa Indonesia; pengulangan verba 'bersumpah' menjaga hubungan leksikal dengan perintah sebelumnya.
- source_word: וַיִּשְׁתַּחוּ
  choice: membungkukkan diri
  rationale: Verba ini dapat berarti membungkuk, sujud, atau menyembah. Konteks menonjolkan gerak tubuh tanpa menyebut objek penyembahan, sehingga pilihan ini mempertahankan tindakan jasmani tanpa mempertegas tafsiran teologis.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama yang dipakai teks Ibrani dipertahankan dan tidak diselaraskan menjadi 'Yakub'.
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: di kepala tempat tidurnya
  rationale: Mengikuti vokalisasi Masoret yang berarti 'tempat tidur' dan menerjemahkan ungkapan ruang itu secara ringkas; sufiks milik ditambahkan secara wajar berdasarkan konteks.
theological_decisions:
- issue: Teks konsonantal memungkinkan pembacaan 'tempat tidur' atau 'tongkat', sedangkan vokalisasi Masoret menunjuk kepada 'tempat tidur' dan Septuaginta serta Ibrani 11:21 mencerminkan 'tongkat'.
  choice: tempat tidur
  alternative: tongkat
  rationale: Teks utama mengikuti vokalisasi WLC/Masoret. Pembacaan alternatif tetap dicatat karena ditopang tradisi teks kuno dan penting bagi hubungan kanonik dengan Ibrani 11:21.
- issue: וַיִּשְׁתַּחוּ dapat menggambarkan penghormatan jasmani atau penyembahan.
  choice: membungkukkan diri
  alternative: menyembah; sujud
  rationale: Karena objek tindakan tidak dinyatakan, terjemahan utama tidak secara sepihak menetapkannya sebagai tindakan penyembahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan 'Lalu', 'Maka', dan 'Kemudian'. Penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki pembacaan alternatif.
