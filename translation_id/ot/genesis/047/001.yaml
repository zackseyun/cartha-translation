  - severity: low
    issue: “Sekarang” kurang langsung mewakili וְהִנָּם.
    rationale: Ungkapan ini terutama menarik perhatian kepada keadaan yang sedang tampak atau berlaku; “Lihatlah” mempertahankan fungsi tersebut tanpa menambahkan nuansa waktu yang lebih kuat.
