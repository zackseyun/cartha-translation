base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: id
  text: Kemudian Yusuf menghadap Firaun dan melaporkan, “Ayahku dan saudara-saudaraku, beserta ternak kecil dan ternak sapi mereka serta segala milik mereka, telah datang dari tanah Kanaan. Lihatlah, mereka berada di tanah Gosyen.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: menghadap
  rationale: Dalam konteks istana, בוא menggambarkan Yusuf datang atau masuk ke hadapan Firaun; “menghadap” menyampaikan situasi itu secara alami dalam bahasa Indonesia.
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: memberitahukan kepadanya
  rationale: Dua verba Ibrani memperkenalkan laporan dan ucapan Yusuf. Satu pengantar kutipan menghindari pengulangan yang kaku tanpa menghilangkan fungsi tuturan.
- source_word: צֹאנָם
  choice: kawanan domba dan kambing
  rationale: צאן menunjuk ternak kecil, terutama domba dan kambing; pilihan ini lebih tepat daripada hanya “domba”.
- source_word: בְקָרָם
  choice: kawanan sapi
  rationale: בקר menunjuk ternak besar atau sapi dan dibedakan dari צאן.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: dan segala milik mereka
  rationale: Ungkapan ini mencakup seluruh kepunyaan mereka secara ringkas dan alami.
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: telah datang dari tanah Kanaan
  rationale: Bentuk perfektif menyatakan kedatangan yang sudah selesai dan hasilnya masih relevan pada saat Yusuf melapor.
- source_word: וְהִנָּם
  choice: Sekarang mereka berada
  rationale: הנה dengan sufiks menarik perhatian pada keberadaan mereka saat itu; “sekarang” menyampaikan daya deiktisnya secara wajar dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Kata אֶרֶץ dipertahankan, dan nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
