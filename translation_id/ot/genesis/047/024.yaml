base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: id
  text: Pada waktu panen, kalian harus memberikan seperlima kepada Firaun, dan empat perlima[a] menjadi milik kalian sebagai benih untuk ladang, untuk makanan kalian, untuk orang-orang dalam rumah tangga kalian, dan untuk makanan anak-anak kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “empat tangan”; ini adalah ungkapan untuk empat bagian yang tersisa, yaitu empat perlima.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: Pada waktu panen
  rationale: 'תְּבוּאָה menunjuk pada hasil bumi atau panen. Dalam konteks pengaturan hasil pertanian ini, frasa berpreposisi tersebut paling wajar dipahami secara temporal: ketika panen diperoleh.'
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: kamu harus memberikan seperlima kepada Firaun
  rationale: חֲמִישִׁית berarti satu bagian dari lima. Bentuk 'harus memberikan' menyampaikan kewajiban dalam ketetapan yang sedang diberikan.
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: sedangkan empat perlima[a]
  rationale: Secara harfiah ungkapan ini berbunyi 'empat bagian/tangan', yakni empat bagian yang tersisa dari keseluruhan lima bagian. 'Empat perlima' menyampaikan maksud idiom itu dengan jelas dalam bahasa Indonesia.
- source_word: יִהְיֶה לָכֶם
  choice: menjadi bagianmu
  rationale: Ungkapan ini menyatakan peruntukan atau kepemilikan hasil yang tersisa. Bentuk tunggal kolektif 'bagianmu' alami karena kelompok itu disapa secara kolektif dalam bahasa Indonesia.
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: untuk benih guna menaburi ladang
  rationale: Frasa ini menunjuk pada hasil yang disisihkan sebagai benih untuk penanaman berikutnya. 'Guna menaburi ladang' memperjelas fungsi benih tanpa mengubah makna.
- source_word: וּלְאָכְלְכֶם
  choice: untuk makananmu
  rationale: Bentuk dari אכל di sini berfungsi sebagai sebutan bagi makanan atau keperluan makan mereka.
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: untuk orang-orang yang ada dalam rumah tanggamu
  rationale: Klausa relatif ini paling mungkin menunjuk pada orang-orang dalam rumah mereka. 'Rumah tangga' menyampaikan cakupan sosial keluarga dan penghuni rumah dengan alami.
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: dan untuk makanan anak-anakmu
  rationale: טַף lazim menunjuk pada anak-anak kecil atau tanggungan. Dalam konteks keluarga, 'anak-anakmu' merupakan padanan yang jelas dan alami, sedangkan pengulangan 'makanan' mencerminkan struktur daftar Ibrani.
