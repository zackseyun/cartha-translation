review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan dengan tepat menyampaikan pembagian hasil: seperlima bagi Firaun dan empat perlima bagi para pendengar. Namun, bentuk jamak Ibrani lebih baik dicerminkan dengan "kalian", dan catatan kaki perlu memperbaiki keterangan literal idiom tersebut.'
  naturalness: Bahasanya umumnya baku dan jelas. "Menjadi milik kalian" lebih langsung daripada "menjadi bagianmu" untuk menyatakan kepemilikan/alokasi hasil panen. "Sebagai benih untuk ladang" juga lebih alami daripada "benih guna menaburi ladang" tanpa mengurangi makna.
  terminology: '"Firaun", "seperlima", dan "empat perlima" tepat. Catatan kaki harus menyatakan bahwa bentuk harfiahnya adalah "empat tangan", bukan "empat bagian"; "empat bagian" merupakan penjelasan makna idiomatis.'
  issues:
  - severity: medium
    issue: Catatan kaki menyebut "empat bagian" sebagai bentuk harfiah.
    rationale: Teks Ibrani berbunyi harfiah "empat tangan" (אַרְבַּע הַיָּדוֹת). "Empat bagian" adalah penjelasan idiomatis, bukan terjemahan literal.
  - severity: low
    issue: Pronomina "kamu/-mu" berbentuk tunggal, padahal verba dan sufiks Ibrani berbentuk jamak.
    rationale: Pemakaian tunggal kolektif dapat dipahami dalam bahasa Indonesia, tetapi "kalian" mempertahankan sasaran jamak dengan lebih transparan.
  - severity: low
    issue: '"Menjadi bagianmu" kurang langsung untuk יִהְיֶה לָכֶם.'
    rationale: Frasa Ibrani menyatakan bahwa empat bagian itu menjadi milik atau peruntukan mereka; "menjadi milik kalian" lebih jelas.
  revised_text: Pada waktu panen, kalian harus memberikan seperlima kepada Firaun, dan empat perlima[a] menjadi milik kalian sebagai benih untuk ladang, untuk makanan kalian, untuk orang-orang dalam rumah tangga kalian, dan untuk makanan anak-anak kalian.
  revised_footnotes:
