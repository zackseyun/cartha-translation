  to: Pada waktu panen, kalian harus memberikan seperlima kepada Firaun, dan empat perlima[a] menjadi milik kalian sebagai benih untuk ladang, untuk makanan kalian, untuk orang-orang dalam rumah tangga kalian, dan untuk makanan anak-anak kalian.
  rationale: Revisi mempertahankan makna administratif dan pembagian satu-per-lima dalam teks Ibrani, sambil mencerminkan alamat jamak dan memperbaiki penjelasan idiom "empat tangan". Tidak ada perubahan teologis atau penambahan tafsiran denominatif.
