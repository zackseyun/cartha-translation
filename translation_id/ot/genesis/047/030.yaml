  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: id
  text: “Ketika aku berbaring bersama leluhurku,[a] bawalah aku keluar dari Mesir dan kuburkanlah aku di tempat pemakaman mereka.” Yusuf menjawab, “Aku akan melakukan sesuai dengan perkataanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan aku berbaring bersama leluhurku”; ungkapan Ibrani ini lazim dipakai sehubungan dengan kematian dan pemakaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: Apabila aku dibaringkan
  rationale: Kata שׁכב secara harfiah menggambarkan berbaring dan dalam konteks ini merupakan ungkapan yang berkaitan dengan kematian. Bentuk pasif alami dalam bahasa Indonesia mempertahankan gambaran itu sekaligus mengisyaratkan pemakaman tanpa menerjemahkannya langsung sebagai ‘mati’.
- source_word: עִם אֲבֹתַי
  choice: bersama leluhurku
  rationale: אָבוֹת di sini menunjuk kepada para pendahulu keluarga Yakub. ‘Leluhurku’ lebih alami dan tidak ambigu dalam bahasa Indonesia modern daripada ‘bapa-bapaku’.
- source_word: וּנְשָׂאתַנִי
  choice: bawalah aku
  rationale: Dalam konteks pemakaman, נשׂא berarti membawa atau mengangkut jenazah. ‘Bawalah aku’ alami dan tetap dekat dengan permintaan Ibrani.
- source_word: מִמִּצְרַיִם
  choice: keluar dari Mesir
  rationale: Frasa ini menegaskan pemindahan dari wilayah Mesir; ‘keluar dari Mesir’ menyatakan arah geraknya dengan jelas.
- source_word: וּקְבַרְתַּנִי
  choice: kuburkanlah aku
  rationale: קבר berarti menguburkan. Bentuk imperatif halus dengan -lah sesuai dengan permintaan sungguh-sungguh seorang ayah kepada anaknya.
- source_word: בִּקְבֻרָתָם
  choice: di tempat pemakaman mereka
  rationale: Nomina קְבֻרָה dapat menunjuk tempat penguburan. Pilihan ini tidak menentukan apakah bentuknya liang kubur atau makam batu.
- source_word: וַיֹּאמַר
  choice: Yusuf menjawab
  rationale: Subjek tersirat adalah Yusuf dari konteks. ‘Menjawab’ secara alami menunjukkan bahwa ucapannya merupakan tanggapan langsung, meski verba Ibraninya secara harfiah berarti ‘berkata’.
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: Aku akan melakukan
  rationale: Pronomina אָנֹכִי yang hadir secara eksplisit memberi sedikit penegasan pada ‘Aku’; pronomina mandiri dalam bahasa Indonesia mempertahankannya tanpa penambahan yang berlebihan.
- source_word: כִדְבָרֶךָ
  choice: seperti yang engkau katakan
  rationale: Secara harfiah ‘sesuai dengan perkataanmu’. Rumusan ini alami, bermartabat, dan menyatakan kesediaan Yusuf memenuhi permintaan Yakub.
theological_decisions:
- issue: Ungkapan dibaringkan bersama para leluhur
  choice: Mempertahankan citra berbaring dan menjelaskannya dalam catatan kaki sebagai ungkapan kematian
  alternative: Menerjemahkan langsung ‘apabila aku mati’
  rationale: Teks Ibrani memakai ungkapan konkret yang berkaitan dengan kematian dan penguburan; mempertahankan citranya menghindari penghilangan nuansa tanpa menyimpulkan gagasan khusus tentang keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Engkau’ dipakai untuk sapaan anak kepada ayah dalam konteks narasi kitab suci. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
