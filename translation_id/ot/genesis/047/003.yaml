base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: id
  text: Firaun bertanya kepada saudara-saudara Yusuf, “Apa pekerjaan[a] kalian?” Jawab mereka kepada Firaun, “Hamba-hamba tuanku adalah penggembala kawanan ternak[b], baik kami maupun nenek moyang kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Apa mata pencaharian kalian?”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah orang yang menggembalakan ternak kecil, terutama domba dan kambing.
    reason: lexical_clarification
lexical_decisions:
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudara Yusuf
  rationale: Akhiran pronomina pada אֶחָיו secara harfiah berarti ‘saudara-saudaranya’ dan dalam konteks merujuk kepada saudara-saudara Yusuf. Nama Yusuf dinyatakan agar rujukannya tidak keliru dipahami sebagai saudara-saudara Firaun dalam bahasa Indonesia.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Apa pekerjaan kalian?
  rationale: מַעֲשֶׂה dapat berarti perbuatan, kegiatan, atau pekerjaan. Dalam konteks ini Firaun menanyakan mata pencaharian mereka; ‘pekerjaan’ alami dan cukup luas dalam bahasa Indonesia.
- source_word: רֹעֵה צֹאן
  choice: gembala kawanan ternak
  rationale: רֹעֵה menunjuk orang yang menggembalakan, sedangkan צֹאן adalah kawanan ternak kecil, terutama domba dan kambing. Ungkapan ini mempertahankan kedua unsur Ibrani tanpa membatasi kawanan itu hanya pada domba.
- source_word: עֲבָדֶיךָ
  choice: Hamba-hamba Tuanku
  rationale: Dalam percakapan dengan Firaun, עֲבָדֶיךָ merupakan sebutan diri yang merendah dan sopan, bukan penegasan bahwa mereka berstatus budak. ‘Hamba-hamba Tuanku’ mempertahankan nuansa bahasa istana serta bentuk jamaknya.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: baik kami maupun nenek moyang kami
  rationale: Pengulangan גַּם menekankan bahwa pekerjaan itu dijalankan oleh kedua kelompok dan berlanjut lintas generasi. ‘Baik ... maupun ...’ mempertahankan kesejajaran tersebut; אֲבוֹתֵינוּ di sini wajar diterjemahkan ‘nenek moyang kami’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai karena pertanyaan ditujukan kepada beberapa orang, sedangkan ‘Tuanku’ dan ‘hamba-hamba’ menjaga kesantunan percakapan di hadapan Firaun. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskan.
