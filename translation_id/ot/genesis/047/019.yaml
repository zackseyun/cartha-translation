revisions:
- from: Mengapa kami harus mati di depan matamu[a], baik kami maupun tanah kami? Belilah kami dan tanah kami dengan makanan[b], maka kami dan tanah kami akan menjadi hamba Firaun[c]. Berilah kami benih agar kami tetap hidup dan tidak mati, dan agar tanah ini tidak menjadi tandus[d].
  to: Mengapa kami harus mati di hadapanmu[a], baik kami maupun tanah kami? Belilah kami dan tanah kami dengan makanan[b]; kami akan menjadi hamba Firaun[c], dan tanah kami akan menjadi miliknya. Berilah kami benih agar kami tetap hidup dan tidak mati, dan agar tanah kami tidak menjadi telantar[d].
  rationale: 'Revisi menata ulang klausa tengah agar relasi yang dimaksud teks sumber tersampaikan secara gramatikal dan semantis dalam bahasa Indonesia: para penutur menjadi hamba Firaun, sedangkan tanah mereka menjadi miliknya. Sufiks “kami” dipertahankan pada penyebutan tanah terakhir. Padanan “telantar” menghindari penyempitan makna “tandus,” dan “di hadapanmu” meningkatkan kelancaran register tanpa mengubah makna.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:57:58Z'
