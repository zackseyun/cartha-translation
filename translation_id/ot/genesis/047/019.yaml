base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: id
  text: Mengapa kami harus mati di hadapanmu[a], baik kami maupun tanah kami? Belilah kami dan tanah kami dengan makanan[b]; kami akan menjadi hamba Firaun[c], dan tanah kami akan menjadi miliknya. Berilah kami benih agar kami tetap hidup dan tidak mati, dan agar tanah kami tidak menjadi telantar[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di depan matamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan roti”; dalam konteks ini, sebagai imbalan atas makanan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “budak Firaun.” Istilah Ibrani dapat menunjuk pada berbagai bentuk penghambaan; dalam konteks ini, keterikatan ekonomi dan hilangnya kebebasan sangat menonjol.'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “tidak menjadi sunyi” atau “tidak menjadi tandus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: Mengapa kami harus mati
  rationale: Menyampaikan pertanyaan retoris dan daya permohonan yang terkandung dalam bentuk Ibrani.
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Mempertahankan gambaran konkret idiom Ibrani, yakni mati di hadapan dan dalam penglihatan Yusuf.
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: baik kami maupun tanah kami
  rationale: Konstruksi korelatif Indonesia ini secara alami mengungkapkan pasangan Ibrani גם ... גם.
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: Belilah kami dan tanah kami
  rationale: Kata קנה menunjuk pada pemerolehan melalui transaksi dalam keadaan kelaparan; 'belilah' lugas dan mempertahankan kerasnya keadaan mereka.
- source_word: בַּלָּחֶם
  choice: dengan makanan
  rationale: ב menandai alat atau harga pertukaran. לֶחֶם secara harfiah berarti roti, tetapi dalam konteks ini juga lazim berarti makanan; pilihan utama memperjelas maksud tanpa menghilangkan alternatif harfiah di catatan.
- source_word: עֲבָדִים
  choice: hamba
  rationale: Istilah Ibrani mencakup rentang status dari pelayan sampai budak. 'Hamba' menjaga keluasan leksikal itu, sedangkan konteks menunjukkan keterikatan ekonomi kepada Firaun.
- source_word: וְתֶן זֶרַע
  choice: Berilah kami benih
  rationale: Kata 'kami' tersirat dari pembicara dan penerima tindakan; penambahannya membuat bahasa Indonesia alami. זרע di sini adalah benih untuk ditanam.
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: agar tanah ini tidak menjadi tandus
  rationale: תשם menyatakan tanah yang menjadi sunyi, terlantar, atau rusak. 'Menjadi tandus' sesuai dengan konteks pertanian dan kelaparan.
theological_decisions:
- issue: Status עֲבָדִים dalam penyerahan diri kepada Firaun
  choice: hamba
  alternative: budak
  rationale: Teks jelas menyatakan hilangnya kebebasan ekonomi dan keterikatan kepada Firaun, tetapi istilah Ibrani sendiri lebih luas daripada satu kategori hukum modern. Terjemahan utama menjaga keluasan itu, sementara catatan menyebut alternatif yang lebih keras.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'matamu' mempertahankan sapaan tunggal kepada Yusuf serta gambaran Ibrani. Susunan tujuan dibuat paralel dengan dua kali 'agar' demi kejelasan. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
