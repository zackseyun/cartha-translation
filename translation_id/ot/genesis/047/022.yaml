  naturalness: Bahasa draf umumnya baku dan lancar. "Ia beli" dan "mereka memakan jatah" tetap alami dalam prosa naratif modern serta lebih dekat kepada bentuk sumber.
  terminology: '"Tanah para imam", "Firaun", dan "jatah" sesuai konteks. "Jatah" dipakai konsisten untuk חֹק/חֻקָּם; catatan kaki dengan tepat menjelaskan bahwa istilah ini berarti perbekalan/bagian yang ditetapkan, bukan terutama ketetapan hukum.'
