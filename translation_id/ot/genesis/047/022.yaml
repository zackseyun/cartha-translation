base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: id
  text: Hanya tanah para imam yang tidak ia beli, sebab para imam mendapat jatah[a] dari Firaun, dan mereka memakan jatah yang Firaun berikan kepada mereka. Itulah sebabnya mereka tidak menjual tanah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatah tetap”, “bagian”, atau “ransum”. Kata Ibrani חֹק di sini menunjuk pada perbekalan atau bagian yang ditetapkan bagi para imam, bukan terutama pada suatu ketetapan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pengecualian dari pernyataan sebelumnya dan mempertahankan daya pembatas teks Ibrani.
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: tanah para imam
  rationale: Ungkapan konstruksi ini menunjuk pada tanah milik kelompok imam.
- source_word: לֹא קָנָה
  choice: tidak dibeli Yusuf
  rationale: Kata kerja קנה dalam konteks transaksi kelaparan berarti membeli atau memperoleh dengan pembayaran. Nama Yusuf ditambahkan secara wajar sebagai subjek tersirat dari konteks agar jelas dalam bahasa Indonesia.
- source_word: חֹק / חֻקָּם
  choice: jatah tetap / jatah
  rationale: Dalam konteks ini kata tersebut menunjuk pada persediaan atau bagian resmi yang ditetapkan Firaun, bukan terutama ketetapan hukum.
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: dan hidup dari jatah
  rationale: Secara harfiah berarti 'memakan jatah mereka'; ungkapan Indonesia ini menyampaikan bahwa jatah tersebut menjadi sumber nafkah mereka tanpa membatasi bentuknya hanya pada makanan.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Mengungkapkan hubungan hasil atau alasan dengan jelas dan alami dalam bahasa Indonesia modern.
- source_word: לֹא מָכְרוּ אֶת אַדְמָתָם
  choice: mereka tidak menjual tanah mereka
  rationale: Mempertahankan tindakan komersial dan kepemilikan tanah sebagaimana dinyatakan teks.
