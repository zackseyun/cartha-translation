  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: id
  text: Lalu Yusuf berkata kepada rakyat itu, “Lihatlah, hari ini aku telah membeli kalian dan tanah kalian untuk Firaun.[a] Inilah benih bagi kalian, dan tanamilah tanah itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku telah memperoleh kalian dan tanah kalian untuk Firaun.” Kata Ibrani dapat berarti “membeli” atau, secara lebih umum, “memperoleh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia.
- source_word: הָעָם
  choice: rakyat itu
  rationale: Kata ini menunjuk secara kolektif kepada penduduk Mesir yang sedang diajak bicara; “rakyat” sesuai dengan konteks pemerintahan Firaun.
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel ini membuka pernyataan yang tegas dan menarik perhatian pendengar.
- source_word: קָנִיתִי
  choice: aku telah membeli
  rationale: Dalam konteks transaksi akibat kelaparan, קנה menyatakan pembelian atau perolehan hak milik; “membeli” mempertahankan daya ekonomi dan hukum ungkapan tersebut.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Pronomina objek jamak merujuk langsung kepada rakyat yang masuk ke dalam pengabdian kepada Firaun.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Menandai waktu berlakunya transaksi tersebut.
- source_word: אַדְמַתְכֶם
  choice: tanah kalian
  rationale: Dalam konteks pertanian dan kepemilikan, אֲדָמָה menunjuk kepada lahan mereka.
- source_word: לְפַרְעֹה
  choice: untuk Firaun
  rationale: Preposisi ל menyatakan bahwa Yusuf melakukan pembelian itu bagi atau atas nama Firaun.
- source_word: הֵא
  choice: Inilah
  rationale: Partikel deiktis ini memperkenalkan benih yang diberikan Yusuf secara langsung.
- source_word: זֶרַע
  choice: benih
  rationale: Kata benda ini berarti benih untuk ditanam, sebagaimana ditegaskan oleh kata kerja berikutnya.
- source_word: וּזְרַעְתֶּם
  choice: taburlah
  rationale: Dalam konteks ini bentuk verbal tersebut berfungsi sebagai arahan untuk menabur; imperatif Indonesia menyampaikan fungsi itu dengan alami.
- source_word: הָאֲדָמָה
  choice: tanah itu
  rationale: Menunjuk kepada lahan pertanian yang akan ditanami dan mempertahankan hubungan leksikal dengan “tanah kalian” sebelumnya.
theological_decisions:
- issue: Status rakyat dalam transaksi dengan Firaun
  choice: membeli kalian
  alternative: memperoleh kalian
  rationale: Terjemahan mempertahankan ungkapan langsung dan keras dari teks tentang peralihan status rakyat, tanpa memperhalus atau menentukan lebih jauh hakikat hukum maupun teologis dari status tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rakyat” dipilih karena konteks kerajaan; “kalian” menjaga sapaan jamak secara jelas. Perintah penutup dibuat ringkas dan alami tanpa menghilangkan fungsi instruktif teks Ibrani.
