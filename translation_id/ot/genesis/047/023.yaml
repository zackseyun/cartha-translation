  terminology: “Yusuf,” “Firaun,” “rakyat,” “tanah,” dan “benih” tepat dan konsisten. Catatan kaki pada “membeli” mempertahankan kemungkinan leksikal “memperoleh” tanpa mengaburkan arti transaksi yang utama.
