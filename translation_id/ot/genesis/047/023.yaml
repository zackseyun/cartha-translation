  source_fidelity: 'Terjemahan secara umum setia: קָנִיתִי tepat diterjemahkan “telah membeli,” לְפַרְעֹה dapat diterjemahkan “untuk Firaun,” dan penyediaan benih serta instruksi bercocok tanam tetap terpelihara. Namun, “taburlah tanah itu” tidak lazim dan secara harfiah menyiratkan bahwa tanah, bukan benih, yang ditaburkan. “Tanamilah tanah itu” merupakan padanan Indonesia yang wajar untuk idiom Ibrani “menabur tanah,” dalam konteks benih yang baru saja diberikan.'
