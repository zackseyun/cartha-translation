  rationale: Revisi terbatas pada instruksi akhir agar idiom Ibrani tentang menabur/menanami tanah tersampaikan dalam bahasa Indonesia baku yang tidak menimbulkan kesan bahwa tanahnya yang ditaburkan. Catatan kaki ditambahkan pada “membeli” untuk meneruskan ambiguitas leksikal yang dicatat dalam jejak audit Inggris.
