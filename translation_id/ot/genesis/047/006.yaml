source:
  edition: WLC
  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: id
  text: Tanah Mesir terbuka bagimu.[a] Tempatkanlah ayahmu dan saudara-saudaramu di bagian terbaik negeri ini. Biarlah mereka tinggal di tanah Gosyen. Jika engkau tahu bahwa di antara mereka ada orang-orang yang cakap,[b] angkatlah mereka menjadi pengawas atas ternakku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tanah Mesir ada di hadapanmu.” Ungkapan Ibrani ini menunjukkan bahwa Yusuf diberi keleluasaan memilih tempat di Mesir.'
    reason: cultural_note
  - marker: b
    text: Atau “orang-orang yang mampu” atau “orang-orang yang terampil”; secara lebih harfiah, “orang-orang yang kuat/berkemampuan”. Dalam konteks ini, ungkapan tersebut tidak harus berarti gagah berani dalam perang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: Tanah Mesir terbuka bagimu
  rationale: Ungkapan Ibrani secara harfiah berarti bahwa tanah Mesir ada 'di hadapanmu'. Dalam konteks ini, Firaun memberi Yusuf keleluasaan memilih tempat bagi keluarganya. 'Terbuka bagimu' menyampaikan makna idiomatis itu sambil mempertahankan nuansa pemberian akses.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: di bagian terbaik negeri ini
  rationale: מֵיטַב menunjuk pada bagian yang terbaik atau paling pilihan. Penambahan 'bagian' membuat frasa ini alami dan jelas dalam bahasa Indonesia.
- source_word: הוֹשֵׁב
  choice: Tempatkanlah
  rationale: Bentuk Hifil imperatif dari ישׁב bersifat kausatif, yakni menyuruh atau membuat seseorang menetap. 'Tempatkanlah' menyampaikan tindakan Yusuf menempatkan keluarganya untuk tinggal di sana.
- source_word: יֵשְׁבוּ
  choice: Biarlah mereka tinggal
  rationale: Bentuk Qal ישׁב di sini berarti menetap atau berdiam. 'Tinggal' merupakan padanan modern yang alami.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Kata אֶרֶץ secara eksplisit dipertahankan sebagai 'tanah', sedangkan nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim, 'Gosyen'.
- source_word: וְאִם יָדַעְתָּ
  choice: Jika engkau tahu
  rationale: Klausa ini menyatakan syarat berdasarkan pengetahuan Yusuf. Bentuk langsung ini mempertahankan struktur dan ketidakpastian dalam teks sumber.
- source_word: אַנְשֵׁי חַיִל
  choice: orang-orang yang cakap
  rationale: Dalam konteks pengelolaan ternak, frasa ini paling mungkin menunjuk pada orang yang mampu, terampil, atau kompeten, bukan khususnya gagah berani dalam perang.
- source_word: וְשַׂמְתָּם
  choice: angkatlah mereka
  rationale: Walaupun שׂים secara dasar berarti menaruh atau menempatkan, konteks penugasan jabatan mendukung 'angkatlah' sebagai ungkapan Indonesia yang jelas.
- source_word: שָׂרֵי מִקְנֶה
  choice: pengawas
  rationale: שָׂרֵי dapat berarti pemimpin, pejabat, atau pengawas. Karena tugas mereka adalah mengelola ternak Firaun, 'pengawas' paling tepat dalam konteks administratif ini.
- source_word: עַל אֲשֶׁר לִי
  choice: atas ternakku
  rationale: Secara harfiah frasa ini berarti 'atas apa yang menjadi milikku'. Dalam konteks langsung, yang dimaksud ialah ternak milik Firaun; bentuk ringkas 'atas ternakku' alami dan tidak mengubah rujukannya.
