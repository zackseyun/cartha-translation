translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan naratif. Kata ganti 'engkau' dipakai sesuai dialog langsung antartokoh dalam gaya Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghilangkan kondisi 'jika' atau nuansa administratif dalam penugasan para pengawas.
