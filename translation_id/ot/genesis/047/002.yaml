  yaml_path: translation/ot/genesis/047/002.yaml
  text: From among his brothers he took five men and presented them before Pharaoh[a].
translation:
  language: id
  text: Dari antara saudara-saudaranya, Yusuf mengambil lima orang dan menghadapkan mereka kepada Firaun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari bagian terluar saudara-saudaranya” atau “dari antara saudara-saudaranya yang terpilih.” Ungkapan Ibraninya secara harfiah mengandung arti “dari ujung/batas”, tetapi di sini kemungkinan besar dipakai untuk menunjukkan bahwa Yusuf memilih lima orang dari antara saudara-saudaranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה
  choice: Dari antara
  rationale: 'Secara harfiah ungkapan ini berkaitan dengan ''ujung/batas'', tetapi dalam konteks ini paling wajar dipahami secara partitif: Yusuf mengambil sebagian dari kelompok saudara-saudaranya. Terjemahan ini mempertahankan makna utama tanpa menutup kemungkinan leksikal lain, yang dicatat dalam catatan kaki.'
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Kata אָח dengan akhiran orang ketiga tunggal maskulin merujuk langsung kepada saudara-saudara kandung Yusuf dalam konteks ini.
- source_word: לָקַח
  choice: mengambil
  rationale: Makna dasar לָקַח adalah 'mengambil'. Dalam konteks ini tindakan tersebut juga menyiratkan pemilihan, tetapi 'mengambil' tetap alami dan dekat dengan bentuk Ibrani.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: lima orang
  rationale: Ungkapan bilangan dan nomina ini secara langsung berarti lima laki-laki; dalam bahasa Indonesia, 'lima orang' paling alami karena identitas mereka sebagai saudara-saudara Yusuf sudah jelas.
- source_word: וַיַּצִּגֵם
  choice: menghadapkan mereka
  rationale: Bentuk Hifil dari יָצַג berarti menempatkan atau menghadirkan seseorang di hadapan pihak lain. 'Menghadapkan mereka' cocok dengan suasana audiensi kerajaan dan menghindari kesan bahwa Yusuf sekadar memperkenalkan mereka.
- source_word: לִפְנֵי פַרְעֹה
  choice: kepada Firaun
  rationale: לִפְנֵי berarti 'di hadapan'. Bersama verba 'menghadapkan', bahasa Indonesia yang alami memakai 'kepada Firaun', sementara gagasan berada di hadapan Firaun tetap terkandung dalam verba tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-dignified. Nama Yusuf ditambahkan sebagai subjek agar rujukan pronominal jelas dalam ayat yang berdiri sendiri; hal ini tidak mengubah isi referensial konteks. Penanda catatan kaki ditempatkan sesudah kalimat.
