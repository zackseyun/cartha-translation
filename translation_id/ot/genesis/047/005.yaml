  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Ayahmu dan saudara-saudaramu telah datang kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia modern.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Sebutan baku dalam bahasa Indonesia bagi raja Mesir.
- source_word: אֶל יוֹסֵף
  choice: kepada Yusuf
  rationale: Preposisi אֶל menandai orang yang menjadi tujuan ujaran, dan יוֹסֵף secara baku ditransliterasikan sebagai “Yusuf” dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sesudah kata “berkata”, penanda pengantar kutipan ini akan terasa berulang dalam bahasa Indonesia; fungsinya sudah terwakili oleh tanda kutip langsung.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Menyampaikan nomina kekerabatan dengan akhiran posesif orang kedua tunggal secara langsung dan alami.
- source_word: וְאַחֶיךָ
  choice: dan saudara-saudaramu
  rationale: Bentuk jamak אַחִים di sini merujuk kepada saudara laki-laki Yusuf; dalam konteks keluarga yang sudah jelas, “saudara-saudaramu” merupakan ungkapan Indonesia yang alami tanpa memperluasnya menjadi seluruh keluarga.
- source_word: בָּאוּ
  choice: telah datang
  rationale: Perfect Ibrani menyatakan tindakan yang sudah selesai dan relevan bagi keadaan saat itu; “telah datang” mempertahankan nuansa tersebut.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Preposisi dengan akhiran orang kedua tunggal menunjukkan gerak menuju Yusuf; tidak perlu menambahkan “ke sini” yang tidak dinyatakan secara eksplisit.
