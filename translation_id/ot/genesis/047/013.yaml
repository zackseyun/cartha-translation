base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: id
  text: Tidak ada makanan di seluruh negeri[a], sebab kelaparan itu sangat parah; negeri Mesir dan negeri Kanaan merana[b] karena kelaparan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti”; di sini tampaknya berarti makanan pada umumnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjadi lemah” atau “menjadi lesu.” Kata kerja Ibrani ini secara kiasan menggambarkan dampak kelaparan yang melemahkan negeri Mesir dan Kanaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: makanan
  rationale: Secara harfiah berarti 'roti', tetapi dalam konteks kelaparan kata ini digunakan secara metonimis untuk makanan pada umumnya.
- source_word: אֵין
  choice: tidak ada
  rationale: Bentuk negatif eksistensial ini diterjemahkan secara alami dalam narasi lampau bahasa Indonesia; penandaan waktu dipahami dari konteks.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh negeri
  rationale: Dalam konteks ini הָאָרֶץ menunjuk wilayah yang terdampak, bukan seluruh bumi; 'negeri' juga selaras dengan penyebutan Mesir dan Kanaan.
- source_word: כִּי כָבֵד הָרָעָב מְאֹד
  choice: sebab kelaparan itu sangat parah
  rationale: כָבֵד secara harfiah 'berat', tetapi untuk kelaparan menyatakan tingkat keparahan; מְאֹד diterjemahkan 'sangat'.
- source_word: וַתֵּלַהּ
  choice: merana
  rationale: Kata kerja ini menggambarkan keadaan lemah, lesu, atau terkuras akibat kelaparan. 'Merana' mempertahankan gambaran figuratifnya dan dapat dikenakan pada negeri beserta penduduknya.
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: negeri Mesir dan negeri Kanaan
  rationale: Pengulangan 'negeri' mempertahankan susunan Ibrani dan penekanan geografisnya.
- source_word: מִפְּנֵי הָרָעָב
  choice: karena kelaparan itu
  rationale: Terjemahan kausal yang alami untuk frasa preposisional tersebut.
