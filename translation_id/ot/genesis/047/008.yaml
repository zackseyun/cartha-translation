  text: Lalu Firaun berkata kepada Yakub, “Berapa umurmu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Berapa banyak hari-hari tahun-tahun hidupmu?” Ini adalah ungkapan Ibrani formal untuk menanyakan usia Yakub.'
