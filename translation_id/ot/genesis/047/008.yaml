lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... bertanya
  rationale: Bentuk naratif ini melanjutkan alur. Karena ujarannya berupa pertanyaan langsung, “bertanya” lebih alami dalam bahasa Indonesia daripada “berkata”, tanpa mengubah isinya.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Sebutan baku dalam tradisi Alkitab berbahasa Indonesia untuk gelar raja Mesir.
- source_word: אֶל יַעֲקֹב
  choice: kepada Yakub
  rationale: Preposisi אֶל menandai orang yang disapa; “kepada Yakub” merupakan padanan Indonesia yang wajar.
- source_word: כַּמָּה
  choice: berapa
  rationale: Kata tanya kuantitatif ini menanyakan jumlah dan, dalam idiom Indonesia, secara alami dipakai untuk menanyakan umur.
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: tahunkah umurmu
  rationale: Ungkapan Ibrani harfiah “hari-hari dari tahun-tahun hidupmu” menanyakan usia Yakub. Teks utama memakai idiom Indonesia yang jelas, sedangkan bentuk khas Ibraninya dipertahankan dalam catatan kaki.
