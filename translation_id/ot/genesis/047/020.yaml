id: GEN.47.20
reference: Genesis 47:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: id
  text: Lalu Yusuf membeli seluruh tanah Mesir untuk Firaun[a], sebab setiap orang Mesir menjual ladangnya karena bencana kelaparan itu sangat menekan mereka[b]. Demikianlah tanah itu menjadi milik Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memperoleh seluruh tanah Mesir bagi Firaun.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bencana kelaparan itu kuat atas mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: membeli
  rationale: Dalam konteks orang Mesir menjual ladang mereka, verba קנה menunjuk pada perolehan melalui transaksi; “membeli” adalah padanan Indonesia yang paling langsung.
- source_word: אַדְמַת מִצְרַיִם
  choice: tanah Mesir
  rationale: אַדְמָה di sini menunjuk pada tanah sebagai properti pertanian, bukan sekadar tanah atau debu sebagai bahan.
- source_word: לְפַרְעֹה
  choice: untuk Firaun
  rationale: Preposisi ל menandai pihak yang menerima manfaat dan kepemilikan dari pembelian yang dilakukan Yusuf.
- source_word: מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: setiap orang Mesir menjual ladangnya
  rationale: 'Subjek kolektif disertai אִישׁ dan sufiks tunggal mempunyai daya distributif: masing-masing orang Mesir menjual ladangnya.'
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: bencana kelaparan itu sangat menekan mereka
  rationale: Ungkapan harfiah “kelaparan itu kuat atas mereka” menggambarkan beratnya tekanan kelaparan; bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan metafora dampaknya atas penduduk.
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: tanah itu menjadi milik Firaun
  rationale: Klausa tersebut menyatakan hasil transaksi berupa peralihan kepemilikan kepada Firaun.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bencana kelaparan” dipakai untuk membedakan רָעָב sebagai krisis kelaparan luas dari rasa lapar biasa; susunan kalimat tetap dekat dengan alur teks Ibrani.
