translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua klausa Ibrani dipisahkan menjadi dua kalimat agar jelas; aposisi tetap dipertahankan dengan ‘yakni’. Tidak diperlukan catatan kaki karena idiom Ibrani diterjemahkan secara transparan di dalam teks.
