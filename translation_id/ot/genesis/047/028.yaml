  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: id
  text: Yakub hidup di tanah Mesir selama tujuh belas tahun. Adapun umur Yakub, yaitu tahun-tahun hidupnya, adalah seratus empat puluh tujuh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: tinggal ... selama
  rationale: Bentuk naratif dari חיה menyatakan bahwa Yakub terus hidup selama rentang waktu tersebut. Dalam konteks tempat dan durasi, ungkapan Indonesia ini alami tanpa mengubah makna dasarnya.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ (‘tanah/negeri’) yang terdapat secara eksplisit dalam teks Ibrani.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: tujuh belas tahun
  rationale: Padanan baku untuk bilangan dan satuan tahun.
- source_word: וַיְהִי
  choice: seluruhnya
  rationale: Dalam klausa rangkuman umur, kata ini secara idiomatis menyatakan jumlah keseluruhan yang dicapai.
- source_word: יְמֵי יַעֲקֹב
  choice: umur Yakub
  rationale: Ungkapan harfiah ‘hari-hari Yakub’ adalah idiom Ibrani bagi rentang hidupnya; ‘umur Yakub’ menyampaikan maksud itu dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: שְׁנֵי חַיָּיו
  choice: tahun-tahun hidupnya
  rationale: Mempertahankan frasa aposisional yang menjelaskan ‘umur Yakub’ dan mencerminkan penyebutan eksplisit tentang tahun-tahun kehidupannya.
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: seratus empat puluh tujuh tahun
  rationale: Urutan bilangan disesuaikan dengan tata bilangan Indonesia modern sambil mempertahankan jumlah tepatnya.
