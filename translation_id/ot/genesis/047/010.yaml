  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: id
  text: Kemudian Yakub memberkati Firaun[a], lalu keluar dari hadapan Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi salam hormat kepada Firaun” atau “berpamitan kepada Firaun”. Kata kerja Ibraninya biasanya berarti “memberkati”, tetapi dalam konteks audiensi kerajaan maknanya dapat bertumpang tindih dengan salam resmi atau pamitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Kata kerja ברך pada umumnya berarti “memberkati”. Dalam konteks pertemuan resmi dengan raja, tindakan ini dapat sekaligus berfungsi sebagai salam penghormatan atau pamitan; namun makna leksikal utamanya dipertahankan, selaras dengan pemakaian dalam ayat 7 dan 10.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: אֶת
  choice: tidak diterjemahkan
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan tersendiri yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk gelar kerajaan Mesir yang baku dalam bahasa Indonesia.
- source_word: וַיֵּצֵא
  choice: lalu keluar
  rationale: יצא secara konkret berarti “keluar”. Bentuk ini menyampaikan gerak Yakub meninggalkan audiensi dan tetap alami dalam bahasa Indonesia.
- source_word: מִלִּפְנֵי
  choice: dari hadapan Firaun
  rationale: Ungkapan ini secara harfiah berarti “dari hadapan”. Terjemahan tersebut alami dalam ragam Alkitabiah Indonesia dan menggambarkan kepergian dari audiensi kerajaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Kemudian ... lalu ...” mencerminkan urutan tindakan tanpa terasa kaku. Ungkapan “dari hadapan Firaun” mempertahankan warna idiom Ibrani sambil tetap mudah dipahami.
