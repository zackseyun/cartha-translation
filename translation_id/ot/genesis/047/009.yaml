base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: id
  text: Lalu Yakub berkata kepada Firaun, “Hari-hari dalam tahun-tahun masa hidupku sebagai pendatang berjumlah seratus tiga puluh tahun. Sedikit dan penuh kesusahanlah hari-hari dalam tahun-tahun hidupku[a]; hari-hari itu belum menyamai hari-hari dalam tahun-tahun kehidupan nenek moyangku ketika mereka hidup sebagai pendatang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Sedikit dan buruklah hari-hari dalam tahun-tahun hidupku.” Kata “buruk” di sini berarti sarat penderitaan atau kesusahan.'
    reason: lexical_and_formal_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: aku hidup sebagai pendatang / mereka hidup sebagai pendatang
  rationale: Istilah Ibrani menunjuk pada kehidupan sebagai penghuni sementara atau orang asing. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan status para leluhur sebagai pendatang, tanpa memberi makna rohani tambahan seperti 'ziarah'.
- source_word: יְמֵי שְׁנֵי
  choice: masa / tahun-tahun / umur
  rationale: Tumpukan idiomatis 'hari-hari dari tahun-tahun' menunjuk pada rentang kehidupan. Karena pengulangan harfiah terasa sangat kaku dalam bahasa Indonesia, bentuknya divariasikan sesuai konteks sambil mempertahankan penekanan pada lamanya hidup.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: seratus tiga puluh tahun
  rationale: Bentuk bilangan yang baku dan alami dalam bahasa Indonesia modern.
- source_word: מְעַט וְרָעִים
  choice: sedikit dan penuh kesusahan
  rationale: מְעַט menilai usia Yakub sebagai sedikit dibandingkan usia nenek moyangnya, sedangkan רָעִים di sini menggambarkan pengalaman hidup yang buruk atau susah, bukan kejahatan moral.
- source_word: הִשִּׂיגוּ
  choice: belum mencapai
  rationale: Kata kerja ini berarti mencapai, menyusul, atau memperoleh. 'Belum mencapai' secara alami menyatakan bahwa umur Yakub masih lebih pendek daripada umur nenek moyangnya.
- source_word: אֲבֹתַי
  choice: nenek moyangku
  rationale: Dalam konteks ini kata tersebut menunjuk kepada para leluhur patriarkal Yakub. 'Nenek moyangku' lebih jelas daripada 'ayah-ayahku' dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan diri para leluhur sebagai penghuni asing
  choice: hidup sebagai pendatang
  alternative: menjalani ziarah
  rationale: Teks menggambarkan status historis mereka sebagai penghuni sementara atau orang asing. Pilihan ini tidak merohanikan istilah tersebut menjadi gambaran perjalanan iman.
- issue: Makna רָעִים dalam penilaian Yakub atas hidupnya
  choice: penuh kesusahan
  alternative: jahat
  rationale: Dalam konteks ini sifat tersebut menilai kualitas pengalaman hidup Yakub sebagai berat dan menyusahkan, bukan menyatakan bahwa hari-harinya memiliki kejahatan moral.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Idiom Ibrani tentang 'hari-hari dari tahun-tahun' tidak direproduksi secara mekanis karena akan kabur dan kaku, tetapi unsur masa hidup, tahun-tahun, perbandingan umur, serta status sebagai pendatang tetap dipertahankan.
