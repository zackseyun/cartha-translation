  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: id
  text: Israel menetap di tanah Mesir, di tanah Gosyen. Mereka memperoleh milik di sana[a], lalu beranak cucu dan bertambah sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka memperoleh tempat berpijak di sana” atau “mereka menjadi mapan di sana.” Kata Ibrani yang digunakan dapat menggambarkan diperolehnya suatu pegangan atau kedudukan yang kokoh di negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: ישׁב dalam konteks ini menunjukkan tinggal secara tetap, bukan sekadar berada untuk sementara.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Mempertahankan nama yang dipakai teks Ibrani serta peralihan dari Israel sebagai tokoh tunggal kepada keluarganya sebagai kelompok.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Kata 'tanah' mempertahankan unsur אֶרֶץ dan penekanan kewilayahan dalam narasi.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Mempertahankan bentuk Ibrani dan menampilkan Gosyen sebagai wilayah tertentu di dalam Mesir.
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: mereka memperoleh tempat berpijak di sana
  rationale: Bentuk Niphal dari אחז di sini dapat menunjuk pada memperoleh suatu pegangan atau menjadi mapan. Ungkapan ini mempertahankan cakupan maknanya tanpa membatasi arti hanya pada kepemilikan properti.
- source_word: וַיִּפְרוּ
  choice: beranak cucu
  rationale: Dalam konteks pertambahan suatu keluarga atau bangsa, פרה secara alami merujuk pada kesuburan dan hadirnya keturunan; ungkapan ini jelas bagi pembaca Indonesia.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: bertambah sangat banyak
  rationale: Menyampaikan רבה sebagai pertambahan jumlah dan מְאֹד sebagai penguat dengan bahasa Indonesia modern yang alami.
theological_decisions:
- issue: Makna representatif nama 'Israel'
  choice: Mempertahankan 'Israel' sebagai subjek tunggal, kemudian memakai 'mereka' bagi keluarga atau keturunannya.
  alternative: Mengganti seluruhnya dengan 'orang Israel' atau memakai nama 'Yakub'.
  rationale: Teks beralih dari verba tunggal dengan Israel kepada verba jamak. Terjemahan ini mempertahankan peralihan tersebut dan tidak menghapus hubungan antara sang leluhur dengan keluarga perjanjian yang diwakilinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Gosyen' mengikuti ejaan nama Alkitab yang lazim. Struktur ayat dibuat alami dengan pemisahan kalimat, sementara peralihan dari Israel tunggal kepada keluarga jamak tetap dipertahankan.
