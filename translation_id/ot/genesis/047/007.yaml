  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: id
  text: Kemudian Yusuf membawa masuk Yakub, ayahnya, dan menghadapkan dia kepada Firaun[a]. Lalu Yakub memberkati Firaun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat dia berdiri di hadapan Firaun.”
    reason: lexical_alternative
  - marker: b
    text: “Memberkati” dapat mencakup pengucapan berkat secara resmi, bukan sekadar salam sopan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: membawa masuk
  rationale: 'Bentuk Hifil dari בוא bersifat kausatif: Yusuf membawa Yakub masuk ke hadapan Firaun. Ungkapan ini alami dalam konteks audiensi kerajaan.'
- source_word: אָבִיו
  choice: ayahnya
  rationale: Sebutan hubungan keluarga dengan sufiks orang ketiga maskulin tunggal yang merujuk kepada Yusuf.
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: menghadapkan dia kepada
  rationale: Secara harfiah berarti 'membuat dia berdiri di hadapan', tetapi dalam konteks audiensi resmi, 'menghadapkan dia kepada' menyampaikan tindakan mempersembahkan seseorang ke hadapan penguasa secara wajar dalam bahasa Indonesia.
- source_word: לִפְנֵי פַרְעֹה
  choice: kepada Firaun
  rationale: Bersama verba 'menghadapkan', pilihan ini secara alami menyatakan bahwa Yakub ditempatkan di hadapan atau dalam hadirat Firaun.
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: ברך pada makna lazimnya berarti 'memberkati'. Pilihan ini mempertahankan ketegangan bahwa Yakub mengucapkan berkat atas Firaun dan tidak melemahkannya menjadi sekadar salam.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: וַ
  choice: Kemudian / Lalu
  rationale: Waw konsekutif menggerakkan urutan narasi. Variasi 'Kemudian' dan 'Lalu' menghasilkan bahasa Indonesia modern yang mengalir tanpa menghilangkan hubungan berurutan.
theological_decisions:
- issue: Makna tindakan Yakub terhadap Firaun
  choice: Yakub sungguh memberkati Firaun
  alternative: Yakub hanya memberi salam hormat kepada Firaun
  rationale: Makna biasa verba ברך adalah 'memberkati'. Terjemahan mempertahankan gambaran teologis yang mencolok tentang sang leluhur yang memberkati raja besar, alih-alih mereduksinya menjadi basa-basi sopan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nuansa kausatif dan suasana audiensi kerajaan dijelaskan dalam catatan kaki. Semua penanda catatan kaki dicantumkan dalam teks utama.
