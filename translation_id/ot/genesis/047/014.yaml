base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: id
  text: Yusuf mengumpulkan seluruh perak[a] yang terdapat di tanah Mesir dan di tanah Kanaan sebagai pembayaran atas gandum yang mereka beli. Kemudian Yusuf membawa perak itu ke dalam rumah Firaun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh uang”. Secara harfiah bahasa Ibrani menyebut “seluruh perak”, yaitu logam yang digunakan sebagai alat pembayaran.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “rumah Firaun” dapat menunjuk bukan hanya pada kediaman raja, tetapi juga secara lebih luas pada rumah tangga atau perbendaharaan Firaun.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: mengumpulkan
  rationale: Kata kerja לקט berarti mengumpulkan; pilihan ini menyampaikan penghimpunan hasil dari banyak transaksi tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: כָּל הַכֶּסֶף
  choice: seluruh perak
  rationale: כֶּסֶף secara harfiah berarti perak dan dalam konteks ini berfungsi sebagai uang. Terjemahan utama mempertahankan gambaran konkret bahasa Ibrani, sedangkan catatan kaki menjelaskan fungsi moneternya.
- source_word: הַנִּמְצָא
  choice: yang terdapat
  rationale: Bentuk partisipel dari מצא di sini menunjuk pada perak yang ada atau tersedia di kedua negeri; 'yang terdapat' alami dalam bahasa Indonesia dan mempertahankan cakupan ungkapan tersebut.
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: di tanah Mesir dan di tanah Kanaan
  rationale: Pengulangan 'tanah' mempertahankan penekanan geografis dan struktur Ibrani dengan ungkapan Indonesia yang tetap wajar.
- source_word: בַּשֶּׁבֶר אֲשֶׁר הֵם שֹׁבְרִים
  choice: sebagai pembayaran atas gandum yang mereka beli
  rationale: Dalam kisah Yusuf, שֶׁבֶר menunjuk pada gandum yang dijual, sedangkan שבר berarti membeli gandum. Ungkapan ini membuat hubungan transaksional yang tersirat oleh ב jelas dan alami tanpa mengubah makna.
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: membawa perak itu ke dalam istana Firaun
  rationale: Akhiran penunjuk arah pada בֵּיתָה menyatakan gerak masuk. 'Istana Firaun' merupakan padanan kontekstual yang alami, sementara catatan kaki mempertahankan cakupan harfiah 'rumah Firaun' yang dapat mencakup rumah tangga atau perbendaharaannya.
