translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menetapkan tempat tinggal bagi' dipilih untuk menyampaikan kausatif Ibrani tanpa ungkapan yang kaku; 'tanah milik' menjaga makna konkret kepemilikan lahan. Ejaan nama 'Raamses' mengikuti bentuk transliterasi Indonesia yang lazim.
