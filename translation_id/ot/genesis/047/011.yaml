- from: Lalu Yusuf menetapkan tempat tinggal bagi ayahnya dan saudara-saudaranya serta memberi mereka tanah milik di negeri Mesir, di bagian terbaik negeri itu[a], yaitu di tanah Raamses, seperti yang telah diperintahkan Firaun.
  to: Lalu Yusuf membuat ayahnya dan saudara-saudaranya menetap serta memberi mereka tanah milik di negeri Mesir, di bagian terbaik negeri itu[a], yaitu di tanah Raamses, seperti yang telah diperintahkan Firaun.
