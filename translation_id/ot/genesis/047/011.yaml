base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: id
  text: Lalu Yusuf membuat ayahnya dan saudara-saudaranya menetap serta memberi mereka tanah milik di negeri Mesir, di bagian terbaik negeri itu[a], yaitu di tanah Raamses, seperti yang telah diperintahkan Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bagian terpilih negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: menetapkan tempat tinggal bagi
  rationale: 'Bentuk Hifil dari יׁשב bersifat kausatif: Yusuf membuat keluarganya menetap. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna bahwa Yusuf mengatur tempat tinggal mereka.'
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: ayahnya dan saudara-saudaranya
  rationale: Terjemahan mempertahankan kedua sebutan kekerabatan yang disebutkan secara eksplisit dalam teks Ibrani, tanpa memperluasnya menjadi 'keluarganya'.
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: memberi mereka tanah milik
  rationale: אֲחֻזָּה menunjuk pada tanah yang dikuasai sebagai milik atau lahan tetap. 'Tanah milik' menyampaikan unsur pertanahan dengan jelas tanpa memasukkan nuansa teologis 'warisan' yang tidak harus dimaksudkan di sini.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di negeri Mesir
  rationale: Kata 'negeri' mempertahankan unsur אֶרֶץ dan sesuai dengan gaya narasi Indonesia yang wajar.
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: di bagian terbaik negeri itu
  rationale: מֵיטַב berarti bagian yang terbaik atau paling baik. Pilihan ini jelas dan idiomatis serta tidak mempersempit maknanya menjadi kesuburan saja.
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: di tanah Raamses
  rationale: Terjemahan mempertahankan pengulangan אֶרֶץ dan memahami Raamses sebagai nama wilayah atau kawasan.
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: seperti yang telah diperintahkan Firaun
  rationale: Bentuk ini menyatakan bahwa tindakan Yusuf sesuai dengan perintah Firaun yang telah diberikan sebelumnya dalam alur cerita.
