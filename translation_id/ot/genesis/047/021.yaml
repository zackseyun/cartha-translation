base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: id
  text: Adapun rakyat itu, dipindahkannya ke kota-kota[a], dari ujung wilayah Mesir yang satu sampai ke ujung yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memindahkan mereka ke kota-kota.” Sejumlah terjemahan, berdasarkan pemahaman teks yang berbeda, menyatakan bahwa Yusuf menjadikan rakyat itu hamba; tetapi teks Ibrani di sini lebih langsung berbicara tentang pemindahan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: rakyat itu
  rationale: Kata עַם menunjuk secara kolektif kepada penduduk Mesir yang terkena kebijakan Yusuf. 'Rakyat itu' wajar dalam bahasa Indonesia dan mempertahankan sifat kolektifnya.
- source_word: הֶעֱבִיר אֹתוֹ
  choice: dipindahkannya
  rationale: Bentuk Hifil dari עבר berarti menyebabkan berpindah atau memindahkan. Bentuk ini menyampaikan relokasi tanpa menambahkan gagasan perbudakan yang tidak dinyatakan dalam teks Masoret.
- source_word: לֶעָרִים
  choice: ke kota-kota
  rationale: Preposisi ל paling langsung menyatakan tujuan. 'Ke kota-kota' mempertahankan kemungkinan tujuan relokasi tanpa secara berlebihan menentukan bahwa mereka ditempatkan di pusat kota.
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: dari ujung wilayah Mesir yang satu sampai ke ujung yang lain
  rationale: גְבוּל di sini lebih alami dipahami sebagai wilayah daripada sekadar garis perbatasan. Ungkapan dari satu ujung ke ujung lain menyatakan cakupan seluruh negeri.
theological_decisions:
- issue: Tindakan Yusuf terhadap penduduk Mesir
  choice: memindahkan mereka ke kota-kota
  alternative: menjadikan mereka hamba; memindahkan mereka dari kota ke kota
  rationale: Teks Masoret paling langsung berbicara tentang pemindahan penduduk. Terjemahan tidak memasukkan perbudakan yang tidak disebutkan secara eksplisit, sementara catatan kaki mengakui adanya pemahaman tekstual lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'Adapun rakyat itu' mempertahankan penonjolan objek dalam bahasa Ibrani, sedangkan bentuk 'dipindahkannya' menjaga Yusuf sebagai pelaku yang tersirat dari konteks.
