translation:
  language: id
  text: Mereka berkata, “Tuanku telah menjaga kami tetap hidup. Kiranya kami mendapat kemurahan di mata tuanku, dan kami akan menjadi budak Firaun.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kata mereka
  rationale: Bentuk naratif waw-konsekutif memperkenalkan ucapan langsung; ungkapan ini mengalir alami dalam narasi bahasa Indonesia tanpa harus menerjemahkan waw secara mekanis.
- source_word: הֶחֱיִתָנוּ
  choice: Tuan telah menjaga kami tetap hidup
  rationale: Bentuk hifil dari חיה menyatakan tindakan menyebabkan atau membiarkan tetap hidup. Terjemahan ini mempertahankan makna kausatif tanpa memberi nuansa keselamatan rohani yang tidak dinyatakan teks.
- source_word: נִמְצָא חֵן
  choice: Kiranya kami mendapat kemurahan
  rationale: Bentuk yiqtol orang pertama jamak berfungsi sebagai permohonan halus atau volitif dalam konteks ini. “Kiranya” menyampaikan nada permohonan dengan wajar dan hormat.
- source_word: בְּעֵינֵי אֲדֹנִי
  choice: di mata tuanku
  rationale: Ungkapan ini mempertahankan idiom Ibrani tentang memperoleh kemurahan sekaligus sapaan hormat dengan akhiran orang pertama tunggal.
- source_word: וְהָיִינוּ
  choice: dan kami akan menjadi
  rationale: Bentuk perfektum dengan konjungsi menyatakan hasil atau komitmen yang mengikuti ucapan syukur mereka; bentuk masa depan paling sesuai dalam konteks.
- source_word: עֲבָדִים
  choice: budak
  rationale: Dalam konteks penyerahan diri karena krisis ekonomi, kata ini menunjuk status pengabdian yang terikat, bukan sekadar pekerja atau pelayan biasa. “Budak” menyatakan bobot status tersebut secara jelas.
- source_word: לְפַרְעֹה
  choice: Firaun
  rationale: Dengan konstruksi “menjadi budak Firaun”, hubungan kepemilikan atau pengabdian yang ditandai preposisi לְ tersampaikan secara alami dalam bahasa Indonesia.
