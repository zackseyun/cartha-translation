translation_notes:
  register: Bahasa Indonesia baku, modern, dan hormat. “Tuan” dipakai sebagai sapaan langsung kepada Yusuf, sedangkan “tuanku” mempertahankan bentuk penghormatan dengan unsur posesif dalam idiom Ibrani. Diksi “budak” dipilih karena konteks menonjolkan keterikatan status kepada Firaun.
