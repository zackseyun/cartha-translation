  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: id
  text: Lalu Yusuf menyediakan makanan[a] bagi ayahnya, saudara-saudaranya, dan seluruh rumah tangga ayahnya, sesuai dengan jumlah anak-anak mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti”. Kata Ibrani ini secara harfiah sering berarti “roti”, tetapi di sini tampaknya menunjuk secara lebih luas kepada bahan pangan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut mulut anak-anak kecil”; ungkapan ini dapat berarti bahwa persediaan dibagikan menurut jumlah atau kebutuhan anak-anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: menyediakan makanan bagi
  rationale: Bentuk piel dari כלכל menyatakan tindakan menopang atau mencukupi kebutuhan materi. Dalam konteks kelaparan, frasa ini secara alami menyampaikan bahwa Yusuf menjamin persediaan pangan keluarganya.
- source_word: לֶחֶם
  choice: makanan
  rationale: Walaupun makna dasarnya adalah “roti”, di sini kata ini dipakai secara lebih luas untuk bahan pangan atau perbekalan dalam masa kelaparan.
- source_word: כָּל בֵּית אָבִיו
  choice: seluruh rumah tangga ayahnya
  rationale: בַּיִת di sini menunjuk kepada keluarga beserta orang-orang dalam lingkup tanggungannya, bukan bangunan rumah.
- source_word: לְפִי
  choice: sesuai dengan jumlah
  rationale: Secara harfiah ungkapan ini berarti “menurut mulut”, tetapi berfungsi sebagai idiom ukuran atau pembagian. Dalam konteks ini, “sesuai dengan jumlah” menyampaikan dasar pembagian persediaan dengan jelas.
- source_word: הַטָּף
  choice: anak-anak mereka
  rationale: טַף menunjuk kepada anak-anak kecil dalam kelompok keluarga. “Anak-anak mereka” alami dalam bahasa Indonesia dan menghubungkannya dengan keluarga-keluarga yang baru disebut.
- source_word: אָבִיו ... אֶחָיו
  choice: ayahnya, saudara-saudaranya
  rationale: Istilah kekerabatan ini menunjuk langsung kepada ayah Yusuf dan saudara-saudara laki-lakinya; bentuk Indonesia ini jelas tanpa perlu menambahkan keterangan gender yang sudah nyata dari konteks.
