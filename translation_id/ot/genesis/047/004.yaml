base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: id
  text: Mereka berkata kepada Firaun, “Kami datang untuk tinggal sebagai pendatang di negeri ini[a], karena tidak ada padang rumput bagi kawanan ternak milik hamba-hambamu, sebab kelaparan di tanah Kanaan sangat parah. Sekarang, izinkanlah kiranya hamba-hambamu tinggal di tanah Gosyen.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tinggal sementara di negeri ini.”
    reason: Alternatif ini menonjolkan sifat sementara dari גור, sedangkan teks utama menonjolkan status mereka sebagai pendatang.
lexical_decisions:
- source_word: לָגוּר
  choice: tinggal sebagai pendatang
  rationale: Kata גור menunjuk pada tinggal sebagai orang asing atau pendatang, bukan menetap secara permanen. Ungkapan ini mempertahankan nuansa status mereka di Mesir dalam bahasa Indonesia yang mudah dipahami.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: אֶרֶץ di sini mengacu pada wilayah Mesir. Kata 'negeri' wajar untuk konteks wilayah kekuasaan Firaun, sedangkan 'ini' tersirat dari konteks kedatangan mereka.
- source_word: מִרְעֶה
  choice: padang rumput
  rationale: Nomina ini berarti tempat penggembalaan atau lahan berumput bagi ternak. 'Padang rumput' jelas dan alami dalam bahasa Indonesia.
- source_word: לַצֹּאן
  choice: bagi kawanan ternak
  rationale: צֹאן merupakan sebutan kolektif bagi ternak kecil, khususnya domba dan kambing. 'Kawanan ternak' mempertahankan pengertian kolektif tanpa membatasi pada satu jenis hewan.
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Konstruksi ini menyatakan bahwa kawanan ternak tersebut milik orang-orang yang menyebut diri mereka sebagai hamba Firaun. Susunan Indonesia menyampaikan kepemilikan itu secara ringkas dan alami.
- source_word: כָבֵד הָרָעָב
  choice: bencana kelaparan sangat parah
  rationale: Secara harfiah כָבֵד berarti 'berat', tetapi bersama רָעָב ungkapan ini menyatakan tingkat keparahan kelaparan. 'Sangat parah' menyampaikan makna idiomatis tersebut.
- source_word: יֵשְׁבוּ נָא
  choice: izinkanlah kiranya ... tinggal
  rationale: Bentuk permohonan dengan נָא menyatakan permintaan yang sopan. 'Izinkanlah kiranya' mempertahankan nada hormat tanpa menyiratkan bahwa mereka meminta hak menetap permanen.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam tuturan resmi kepada Firaun, עבד berfungsi sebagai sebutan diri yang merendah dan penuh hormat. 'Hamba-hambamu' lebih sesuai konteks daripada 'budak-budakmu'.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: tanah Gosyen
  rationale: Ungkapan ini mempertahankan penandaan geografis wilayah Gosyen dan mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'hamba-hambamu' mempertahankan kesantunan istana, sedangkan 'kiranya' menandai permohonan hormat. Tanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
