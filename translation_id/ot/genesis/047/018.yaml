  to: 'Setelah tahun itu berakhir, mereka datang kepadanya pada tahun kedua dan berkata, “Kami tidak akan menyembunyikan hal ini dari Tuanku: uang[a] telah habis, dan ternak telah menjadi milik Tuanku. Tidak ada lagi yang tersisa di hadapan Tuanku selain tubuh kami[b] dan tanah kami.”'
