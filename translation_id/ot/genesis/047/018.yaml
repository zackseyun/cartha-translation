  terminology: “Tuanku,” “uang,” “ternak,” “tubuh,” dan “tanah” sesuai. Catatan “perak” untuk כֶּסֶף dan alternatif “diri kami” untuk גְּוִיָּתֵנוּ bermanfaat. “Di hadapan Tuanku” mempertahankan idiom sumber tanpa penafsiran berlebihan.
