base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: id
  text: 'Setelah tahun itu berakhir, mereka datang kepadanya pada tahun kedua dan berkata, “Kami tidak akan menyembunyikan hal ini dari Tuanku: uang[a] telah habis, dan ternak telah menjadi milik Tuanku. Tidak ada lagi yang tersisa di hadapan Tuanku selain tubuh kami[b] dan tanah kami.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perak”. Dalam bahasa Ibrani, “perak” sering digunakan dengan arti uang.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “diri kami”. Secara harfiah, bahasa Ibrani menyebut “tubuh kami”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: Setelah tahun itu berakhir
  rationale: Bentuk dari תמם menyatakan berakhir atau selesainya tahun tersebut. Susunan temporal dengan 'setelah' alami dalam bahasa Indonesia dan sesuai dengan kelanjutan peristiwa.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: pada tahun kedua
  rationale: Mempertahankan ungkapan harfiah Ibrani dan tidak secara diam-diam menafsirkannya sebagai 'tahun berikutnya', meskipun konteks memungkinkan pemahaman itu.
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: Kami tidak akan menyembunyikan dari Tuanku
  rationale: כחד dalam piel berarti menyembunyikan atau merahasiakan. Akhiran orang pertama tunggal pada 'tuanku' dipertahankan sebagai bentuk sapaan hormat kolektif yang lazim dalam wacana semacam ini.
- source_word: תַּם הַכֶּסֶף
  choice: uang telah habis
  rationale: תם di sini berarti sudah habis atau terkuras. כֶּסֶף secara harfiah berarti 'perak', tetapi dalam konteks ekonomi ini berfungsi sebagai uang.
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: ternak kami telah menjadi milik Tuanku
  rationale: מִקְנֵה הַבְּהֵמָה menunjuk pada kepemilikan berupa hewan ternak, sedangkan אֶל אֲדֹנִי dalam konteks ini menyiratkan bahwa ternak itu sudah beralih kepada Yusuf. Kata 'kami' menjernihkan kepemilikan sebelumnya yang tersirat oleh konteks.
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: Tidak ada lagi yang tersisa di hadapan Tuanku
  rationale: Mempertahankan citra idiom Ibrani לִפְנֵי, 'di hadapan', sambil memakai susunan Indonesia yang mudah dipahami.
- source_word: בִּלְתִּי אִם
  choice: selain
  rationale: Gabungan ini memperkenalkan pengecualian, sehingga 'selain' tepat dan alami.
- source_word: גְּוִיָּתֵנוּ
  choice: tubuh kami
  rationale: גְּוִיָּה dapat berarti tubuh, jasad, atau sosok jasmani. Dalam konteks orang hidup yang tidak memiliki aset lain, 'tubuh kami' mempertahankan kekonkretan istilah sumber.
