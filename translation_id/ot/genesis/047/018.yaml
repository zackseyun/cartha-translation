translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Tuanku” mempertahankan penghormatan dalam dialog. Penanda catatan kaki ditempatkan pada kata yang benar-benar dijelaskan: “uang” dan “tubuh”, bukan mengikuti letak penanda yang keliru dalam lapisan konsultasi Inggris.'
