base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: id
  text: Ketika uang di tanah Mesir dan di tanah Kanaan sudah habis[a], seluruh rakyat Mesir[b] datang kepada Yusuf dan berkata, “Berilah kami roti[c]. Mengapa kami harus mati di hadapanmu? Sebab uang sudah habis.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perak sudah habis”; kata Ibrani כֶּסֶף dapat berarti “perak” atau “uang”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh Mesir”.
    reason: lexical_alternative
  - marker: c
    text: Di sini “roti” dapat menunjuk secara lebih luas pada makanan dalam konteks bencana kelaparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם
  choice: sudah habis
  rationale: Bentuk verba תמם menyatakan bahwa persediaan telah berakhir atau terkuras; “sudah habis” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: הַכֶּסֶף
  choice: uang
  rationale: כֶּסֶף dapat berarti “perak” atau “uang”; dalam konteks pembayaran untuk bahan pangan, “uang” paling jelas menyampaikan fungsi yang dimaksud.
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: dari tanah Mesir dan dari tanah Kanaan
  rationale: Mempertahankan nilai dasar preposisi מִן sebagai “dari” serta ungkapan geografis אֶרֶץ sebagai “tanah”.
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: seluruh rakyat Mesir datang
  rationale: Secara harfiah teks menyebut “seluruh Mesir”, tetapi yang datang adalah penduduknya; “seluruh rakyat Mesir” menyampaikan metonimia kolektif itu dengan jelas.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Dalam alur narasi Indonesia, konstruksi pengantar ujaran langsung ini paling alami diterjemahkan “dan berkata”.
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: Berilah kami roti
  rationale: הָבָה לָּנוּ merupakan permintaan mendesak agar sesuatu diberikan kepada mereka; לֶחֶם dipertahankan secara konkret sebagai “roti”, dengan cakupan yang lebih luas dijelaskan dalam catatan.
- source_word: וְלָמָּה נָמוּת
  choice: Mengapa kami harus mati
  rationale: Menyampaikan pertanyaan retoris yang mendesak tanpa mengubahnya menjadi pernyataan kepastian.
- source_word: נֶגְדֶּךָ
  choice: di hadapanmu
  rationale: נֶגֶד menunjuk pada keberadaan di depan atau dalam kehadiran seseorang; “di hadapanmu” alami, bermartabat, dan tidak menambahkan kata “mata” yang tidak eksplisit dalam teks.
- source_word: כִּי אָפֵס כָּסֶף
  choice: Sebab uang sudah habis
  rationale: אָפֵס menyatakan tidak tersisa atau berakhir; frasa ini mempertahankan pengulangan naratif dari awal ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Pronomina terikat “-mu” mempertahankan sapaan orang kedua tunggal kepada Yusuf. Semua alternatif leksikal penting dipertahankan melalui catatan kaki tanpa membebani teks utama.
