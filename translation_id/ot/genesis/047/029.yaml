  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Yosef and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: id
  text: Ketika hari-hari Israel mendekati saat kematiannya, ia memanggil anaknya, Yusuf, lalu berkata kepadanya, “Jika kiranya aku mendapat perkenanan di matamu, letakkanlah tanganmu di bawah pangkal pahaku[a], dan perlakukanlah aku dengan kasih teguh dan kesetiaan[b]. Janganlah kuburkan aku di Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Meletakkan tangan di bawah pangkal paha merupakan gestur untuk mengikrarkan sumpah dengan sungguh-sungguh dalam kisah para leluhur; bandingkan Kejadian 24:2.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “kasih setia dan keteguhan”; pasangan katanya menunjuk pada kasih yang loyal dan tindakan yang dapat diandalkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: Ketika hari-hari Israel mendekati saat kematiannya
  rationale: Mempertahankan gambaran idiom Ibrani tentang 'hari-hari' yang mendekat, sambil menjelaskan secara wajar dalam bahasa Indonesia bahwa yang dimaksud ialah saat kematian Israel.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks sumber memakai nama Israel, bukan Yakub.
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: anaknya, Yusuf
  rationale: Yusuf adalah bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia; aposisi ini mencerminkan susunan Ibrani 'anaknya, yaitu Yusuf'.
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Jika kiranya aku mendapat perkenanan di matamu
  rationale: Mempertahankan ungkapan kesopanan Ibrani dan citra 'di matamu'; 'kiranya' menyampaikan nada permohonan dari נָא.
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: letakkanlah tanganmu di bawah pangkal pahaku
  rationale: Ungkapan konkret tentang gestur sumpah dipertahankan, dengan 'pangkal paha' sebagai padanan alami untuk יָרֵךְ dalam konteks ini. Catatan kaki menjelaskan latar budayanya.
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: dan perlakukanlah aku dengan kasih teguh dan kesetiaan
  rationale: Konstruksi עשה עם diterjemahkan secara idiomatis sebagai 'perlakukanlah aku'. 'Kasih teguh' menyampaikan loyalitas yang bertahan dari חֶסֶד, sedangkan 'kesetiaan' menyampaikan sifat dapat dipercaya dari אֱמֶת tanpa menambahkan istilah 'perjanjian' yang tidak dinyatakan secara eksplisit.
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: Janganlah kuburkan aku di Mesir
  rationale: Bentuk larangan yang santun diterjemahkan sebagai permohonan negatif yang alami dan tegas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֶסֶד וֶאֱמֶת dalam permintaan yang disertai sumpah
  choice: kasih teguh dan kesetiaan
  alternative: kasih setia dan keteguhan; kasih dan kesetiaan
  rationale: Pilihan ini mempertahankan unsur kasih-loyal yang tahan uji dalam חֶסֶד dan unsur keandalan dalam אֱמֶת. Istilah 'perjanjian' tidak dimasukkan ke dalam teks utama karena merupakan implikasi konteks, bukan unsur leksikal yang eksplisit.
- issue: Gestur meletakkan tangan di bawah pangkal paha
  choice: Dipertahankan secara konkret dalam teks utama dan diterangkan melalui catatan kaki
  alternative: Diparafrasakan sebagai 'bersumpahlah kepadaku'
  rationale: Penerjemahan konkret menjaga citra dan corak budaya narasi leluhur serta tidak menghapus bentuk ritualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Citra Ibrani yang bermakna dipertahankan bila masih dapat dipahami, sedangkan unsur budaya yang asing dijelaskan dalam catatan kaki. Semua penanda catatan kaki ditempatkan tepat pada frasa yang diterangkan.
