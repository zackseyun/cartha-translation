base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: id
  text: Lalu Yusuf berkata, “Serahkanlah ternak kalian. Aku akan memberi kalian makanan sebagai ganti ternak kalian, jika uang kalian sudah habis.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: Serahkanlah
  rationale: Dalam konteks transaksi ini, bentuk perintah jamak tersebut meminta orang Mesir menyerahkan ternak mereka; ‘serahkanlah’ lebih tepat daripada sekadar ‘bawalah’.
- source_word: מִקְנֵיכֶם
  choice: ternak kalian
  rationale: מִקְנֶה mencakup hewan piaraan yang menjadi harta; ‘ternak’ luas, alami, dan tidak membatasinya hanya pada sapi.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Aku akan memberi kalian makanan
  rationale: Objek verba tidak disebutkan dalam bahasa Ibrani, tetapi makanan dipahami langsung dari konteks kelaparan dan permintaan roti pada ayat sebelumnya. Objek tersebut dinyatakan agar kalimat Indonesia lengkap dan jelas.
- source_word: בְּמִקְנֵיכֶם
  choice: sebagai ganti ternak kalian
  rationale: Preposisi בְּ menyatakan pertukaran dalam transaksi ini; ungkapan ini menyampaikan hubungan barter secara alami.
- source_word: אִם
  choice: karena
  rationale: Walaupun biasanya berarti ‘jika’, di sini אִם memperkenalkan keadaan yang menjadi alasan dilakukannya barter, sehingga bernilai kausal.
- source_word: אָפֵס כָּסֶף
  choice: uang kalian sudah habis
  rationale: אָפֵס menyatakan bahwa sesuatu telah berakhir atau terkuras. Kepemilikan ‘kalian’ tersirat oleh situasi tutur dan wajar dinyatakan dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’, sesuai perkataan Yusuf kepada rakyat. Terjemahan mempertahankan nada administratif yang lugas dan menggunakan ‘makanan’ sebagai objek tersirat yang dituntut konteks dekat.
