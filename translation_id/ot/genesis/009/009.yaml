base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: id
  text: Dan Aku sendiri, sesungguhnya, menetapkan perjanjian-Ku dengan kamu dan dengan keturunanmu[a] sesudah kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “benihmu.” Istilah Ibrani ini adalah nomina kolektif yang dapat merujuk kepada anak cucu atau keturunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Dan mengenai Aku
  rationale: Konjungsi dan pronomina mandiri memberi peralihan wacana sekaligus penekanan pada tindakan Allah; frasa ini mempertahankan penekanan tersebut dalam bahasa Indonesia yang wajar.
- source_word: הִנְנִי
  choice: sesungguhnya Aku
  rationale: Partikel ini mengarahkan perhatian secara khidmat dan menegaskan tindakan yang segera dinyatakan, tanpa menggeser maknanya menjadi sekadar penyebutan kehadiran.
- source_word: מֵקִים
  choice: menetapkan
  rationale: Bentuk Hifil partisipial dari קום menyatakan tindakan membuat perjanjian itu berdiri atau berlaku. 'Menetapkan' mempertahankan daya performatifnya tanpa mengandaikan bahwa ini hanya peneguhan ulang.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: '''Perjanjian'' merupakan padanan baku dan tepat bagi בְּרִית dalam hubungan formal antara Allah dan manusia.'
- source_word: אִתְּכֶם
  choice: dengan kamu
  rationale: Padanan langsung bagi preposisi yang menyatakan pihak-pihak yang tercakup dalam perjanjian; bentuk jamak 'kamu' sesuai dengan konteks.
- source_word: וְאֶת זַרְעֲכֶם
  choice: dan dengan keturunanmu[a]
  rationale: זֶרַע adalah nomina kolektif yang dapat berarti benih, anak cucu, atau keturunan. 'Keturunan' alami dalam bahasa Indonesia dan tetap mempertahankan cakupan kolektifnya; 'dengan' diulang agar hubungan sintaksisnya jelas.
- source_word: אַחֲרֵיכֶם
  choice: sesudah kamu
  rationale: Frasa ini menunjuk kepada generasi-generasi yang datang kemudian; terjemahan ringkas ini mempertahankan ungkapan sumber tanpa penjelasan tambahan dalam teks utama.
theological_decisions:
- issue: Istilah perjanjian dalam hubungan Allah dengan manusia
  choice: perjanjian-Ku
  alternative: ikatan-Ku; persetujuan-Ku
  rationale: '''Perjanjian'' mempertahankan kategori penting dari istilah Ibrani tanpa mempersempitnya menjadi kontrak sekuler atau menambahkan rincian doktrinal yang tidak dinyatakan ayat ini.'
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi pronomina dan sufiks yang merujuk kepada Allah mengikuti gaya penerbitan religius Indonesia. Penekanan ganda pada subjek dipertahankan melalui 'mengenai Aku' dan 'sesungguhnya Aku', sedangkan tanda catatan kaki ditempatkan langsung pada 'keturunanmu', yakni kata yang dijelaskannya.
