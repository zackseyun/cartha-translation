base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: id
  text: Aku akan mengingat perjanjian-Ku yang ada antara Aku dan kamu serta setiap makhluk hidup dari antara segala yang bernyawa,[a] dan air tidak akan pernah lagi menjadi air bah untuk memusnahkan segala yang bernyawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap makhluk hidup di dalam segala daging.”'
    reason: Menunjukkan ungkapan Ibrani בְּכָל בָּשָׂר, yang diterjemahkan secara idiomatis sebagai “dari antara segala yang bernyawa.”
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: Aku akan mengingat
  rationale: Bentuk perfektum Qal orang pertama tunggal dengan waw dalam konteks firman Allah menyatakan tindakan mendatang. Kata 'mengingat' dipertahankan sebagai istilah perjanjian dan tidak diparafrasakan.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku yang mempertahankan sifat relasional, resmi, dan promissory dari בְּרִית.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: setiap makhluk hidup
  rationale: Dalam konteks ini נֶפֶשׁ חַיָּה menunjuk kepada makhluk bernyawa, termasuk hewan, bukan hanya manusia.
- source_word: בְּכָל בָּשָׂר
  choice: di antara segala yang bernyawa
  rationale: Preposisi בְ dipahami secara inklusif atau klasifikatoris. Ungkapan ini menjaga cakupan luas כָּל־בָּשָׂר tanpa memberi kesan bahwa yang dimaksud hanya manusia.
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: dan air tidak akan pernah lagi menjadi air bah
  rationale: 'Gabungan negasi dan עוֹד menyatakan ketidakberulangan. Lamed pada לְמַבּוּל diterjemahkan sebagai hasil atau fungsi: air menjadi air bah.'
- source_word: לְשַׁחֵת
  choice: untuk memusnahkan
  rationale: Infinitif menyatakan tujuan atau akibat; 'memusnahkan' memberikan bobot yang sesuai bagi tindakan penghancuran menyeluruh.
- source_word: כָּל בָּשָׂר
  choice: segala yang bernyawa
  rationale: Padanan idiomatis modern ini mempertahankan cakupan seluruh kehidupan jasmani, termasuk manusia dan hewan, tanpa kekakuan ungkapan harfiah 'segala daging'.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah yang mengingat
  choice: Mempertahankan 'Aku akan mengingat'
  alternative: Aku akan bertindak sesuai dengan perjanjian-Ku
  rationale: Teks Ibrani secara eksplisit memakai bahasa mengingat. Terjemahan mempertahankan ungkapan perjanjian itu dan tidak menjelaskan atau menyelesaikan bagaimana ingatan ilahi harus dipahami.
- issue: Cakupan כָּל בָּשָׂר
  choice: segala yang bernyawa
  alternative: semua manusia
  rationale: Konteks secara tegas mencakup setiap makhluk hidup, sehingga cakupannya tidak boleh dipersempit hanya kepada manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. 'Air bah' dipakai sebagai istilah yang sudah dikenal luas untuk מַבּוּל, sedangkan 'segala yang bernyawa' dipilih agar cakupan manusia dan hewan jelas serta alami.
