base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: id
  text: Ketiganya adalah anak-anak Nuh, dan dari merekalah seluruh bumi dihuni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau lebih harfiah, “dan dari merekalah seluruh bumi tersebar,” yaitu penduduknya menyebar dari mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: Ketiganya
  rationale: Ungkapan nominal yang didahulukan ini menekankan tiga anak Nuh yang baru disebut. “Ketiganya” alami dalam bahasa Indonesia dan mempertahankan penunjukan tersebut.
- source_word: בְּנֵי נֹחַ
  choice: adalah anak-anak Nuh
  rationale: Bahasa Ibrani tidak memakai verba eksplisit. Kopula “adalah” menghasilkan kalimat Indonesia yang wajar tanpa menentukan kala yang tidak dinyatakan dalam sumber.
- source_word: וּמֵאֵלֶּה
  choice: dan dari merekalah
  rationale: Preposisi מִן dan kata tunjuk berarti “dari mereka ini.” Bentuk “merekalah” mempertahankan kaitan serta penekanan pada ketiga anak Nuh.
- source_word: נָפְצָה
  choice: dihuni
  rationale: Makna dasar verba נפץ berkaitan dengan terserak atau menyebar. Dalam konteks silsilah pasca-Air Bah, bentuk ini menyatakan bahwa penduduk bumi berasal dan menyebar dari ketiga anak Nuh. “Dihuni” menyampaikan hasil kontekstualnya secara alami, sedangkan makna leksikal yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: כָל הָאָרֶץ
  choice: seluruh bumi
  rationale: Dalam rangkuman pasca-Air Bah ini, הָאָרֶץ paling wajar merujuk kepada bumi atau dunia yang dihuni secara keseluruhan, bukan hanya suatu negeri tertentu.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam konteks bangsa-bangsa sesudah Air Bah
  choice: seluruh bumi
  alternative: seluruh negeri
  rationale: Ayat ini merangkum penyebaran umat manusia dari anak-anak Nuh, sehingga pengertian universal lebih sesuai dengan konteks. Namun, pilihan ini tetap merupakan keputusan leksikal-kontekstual, bukan penetapan doktrin tambahan.
- issue: Nuansa נָפְצָה
  choice: dihuni
  alternative: terserak atau menyebar
  rationale: Terjemahan utama menyatakan hasil penyebaran manusia secara idiomatis, sementara catatan kaki menjaga citra verba Ibrani dan tidak menghapus ambiguitas antara pendispersian dan pemukiman.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Ketiganya” serta “merekalah” menjaga penekanan sumber tanpa terdengar kaku; catatan kaki mempertahankan nuansa harfiah verba Ibrani.
