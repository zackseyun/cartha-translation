  text: וַ/יִּ֥יקֶץ נֹ֖חַ מִ/יֵּינ֑/וֹ וַ/יֵּ֕דַע אֵ֛ת אֲשֶׁר עָ֥שָׂה ל֖/וֹ בְּנ֥/וֹ הַ/קָּטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: id
  text: Ketika Nuh terbangun dari pengaruh anggurnya, ia mengetahui apa yang telah dilakukan anaknya yang paling muda terhadapnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anaknya yang lebih muda.” Kata sifat Ibrani yang dipakai di sini dapat berarti “kecil”, “muda”, atau “paling muda”, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: terbangun
  rationale: Verba יקץ berarti bangun dari tidur. Dalam konteks ini Nuh bangun setelah tertidur karena anggur; terjemahan ini tidak menafsirkannya sekadar sebagai kembali sadar.
- source_word: מִיֵּינוֹ
  choice: dari pengaruh anggurnya
  rationale: Secara harfiah berarti 'dari anggurnya', tetapi dalam bahasa Indonesia ungkapan itu tidak alami untuk keadaan bangun. 'Dari pengaruh anggurnya' menyampaikan idiom Ibrani tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'kemabukannya'.
- source_word: וַיֵּדַע
  choice: ia mengetahui
  rationale: ידע lazim berarti 'mengetahui' dan di sini dapat mencakup arti menjadi tahu. Pilihan ini tetap dekat dengan gaya naratif Ibrani tanpa menjelaskan bagaimana Nuh mengetahuinya.
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: apa yang telah dilakukan ... terhadapnya
  rationale: Klausa ini menyatakan secara umum apa yang sebelumnya dilakukan kepada Nuh. Bentuk 'telah dilakukan' memperjelas urutan peristiwa tanpa menentukan tindakan tersebut.
- source_word: בְּנוֹ הַקָּטָן
  choice: anaknya yang paling muda
  rationale: קָטָן dapat berarti kecil, muda, lebih muda, atau paling muda. Dalam hubungan usia antaranggota keluarga, 'yang paling muda' merupakan pembacaan yang wajar, sementara kemungkinan 'yang lebih muda' dicatat dalam catatan kaki.
theological_decisions:
- issue: Sifat tindakan yang dilakukan terhadap Nuh
  choice: Mempertahankan ungkapan umum 'apa yang telah dilakukan ... terhadapnya' tanpa menyebut tindakan tertentu.
  alternative: Menafsirkannya sebagai tindakan melihat dan memberitakan ketelanjangan Nuh, atau sebagai pelanggaran seksual yang lebih berat.
  rationale: Ayat Ibrani ini sendiri tidak menjelaskan tindakan tersebut. Terjemahan harus mempertahankan ambiguitas itu dan tidak memasukkan tafsiran tertentu.
- issue: Rujukan 'anaknya yang paling muda'
  choice: Menerjemahkan בְּנוֹ הַקָּטָן sebagai 'anaknya yang paling muda'.
  alternative: anaknya yang lebih muda
  rationale: Frasa Ibrani paling wajar menunjukkan urutan usia, tetapi konteks yang lebih luas menimbulkan pertanyaan mengenai Ham atau Kanaan. Terjemahan tidak menambahkan identifikasi yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Pengaruh anggurnya' dipakai agar idiom sumber dapat dipahami secara alami; ambiguitas mengenai tindakan dan identitas anak tidak diperjelas melampaui teks.
