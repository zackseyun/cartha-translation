  source_fidelity: 'Teks secara tepat mencerminkan urutan dan unsur utama Ibrani: Nuh terbangun, mengetahui, dan mengetahui apa yang sebelumnya dilakukan anaknya yang paling muda terhadap dirinya. Frasa “dari pengaruh anggurnya” merupakan pengungkapan Indonesia yang wajar untuk idiom מִיֵּינוֹ dalam konteks bangun dari tidur akibat anggur, tanpa secara eksplisit menggantinya dengan “kemabukannya.” Klausa tindakan tetap umum dan tidak memasukkan tafsiran tentang sifat tindakan tersebut.'
