  text: וַ/יֹּ֥אמֶר אֱלֹהִ֖ים אֶל נֹ֑חַ זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕/י וּ/בֵ֥ין כָּל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: id
  text: Lalu Allah berkata kepada Nuh, “Inilah tanda perjanjian yang telah Kutetapkan antara Aku dan segala makhluk hidup[a] yang ada di bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala yang berdaging”; dalam konteks ini ungkapan tersebut mencakup manusia dan hewan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan perkembangan cerita secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut menunjuk kepada satu-satunya Allah yang berbicara kepada Nuh; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: אֶל נֹחַ
  choice: kepada Nuh
  rationale: Preposisi menandai orang yang disapa, dan “Nuh” ialah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Inilah tanda perjanjian
  rationale: Klausa identifikasi Ibrani diterjemahkan secara wajar dengan “Inilah”; אוֹת berarti tanda yang dapat dikenali, sedangkan בְּרִית dipertahankan sebagai istilah baku “perjanjian”.
- source_word: אֲשֶׁר הֲקִמֹתִי
  choice: yang telah Kutetapkan
  rationale: Bentuk Hifil dari קום bersama בְּרִית menyatakan menetapkan atau meneguhkan perjanjian; “telah Kutetapkan” menunjukkan tindakan yang sudah selesai dan tetap berlaku.
- source_word: בֵּינִי וּבֵין
  choice: antara Aku dan
  rationale: Ungkapan ini menandai kedua pihak dalam hubungan perjanjian secara langsung.
- source_word: כָּל בָּשָׂר
  choice: segala makhluk hidup
  rationale: Secara harfiah berarti “segala daging,” tetapi dalam konteks Kejadian 9 ungkapan ini mencakup kehidupan jasmani di bumi, manusia maupun hewan. Padanan ini menyampaikan cakupan tersebut dengan jelas dalam bahasa Indonesia modern tanpa menyempitkannya kepada manusia.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: yang ada di bumi
  rationale: Klausa relatif ini membatasi “segala makhluk hidup”; “di bumi” sesuai dengan cakupan universal konteks dan lebih alami daripada “di atas bumi”.
theological_decisions:
- issue: Cakupan כָּל בָּשָׂר dalam perjanjian dengan Nuh
  choice: segala makhluk hidup
  alternative: segala yang berdaging; seluruh umat manusia
  rationale: Dalam Kejadian 9 cakupannya lebih luas daripada manusia saja dan meliputi makhluk hidup jasmani di bumi. Terjemahan utama dibuat alami dan luas, sementara bentuk harfiahnya dicatat agar ungkapan sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Susunan kalimat mempertahankan alur naratif serta rumusan perjanjian, sambil menerjemahkan idiom Ibrani secara alami.
