base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: id
  text: Ia minum sebagian dari anggur itu[a], lalu menjadi mabuk dan menyingkapkan dirinya[b] di dalam kemahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari anggur itu”; ungkapan Ibrani ini kemungkinan bermakna sebagian dari anggur tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “terbaring dalam keadaan tersingkap” atau “menjadi tersingkap.” Kata kerja Ibrani ini juga dapat dipahami secara statif, tetapi bentuknya paling mungkin bermakna refleksif, “menyingkapkan dirinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: Ia minum
  rationale: Bentuk wayyiqtol Qal dari שׁתה menyatakan tindakan lampau dalam rangkaian narasi. Konjungsi tidak diterjemahkan tersendiri agar kalimat Indonesia tetap alami.
- source_word: מִן הַיַּיִן
  choice: sebagian dari anggur itu
  rationale: Preposisi מִן di sini paling wajar dipahami secara partitif. Frasa ini mempertahankan rujukan definit pada anggur yang telah disebutkan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וַיִּשְׁכָּר
  choice: lalu menjadi mabuk
  rationale: Qal dari שׁכר menunjukkan masuknya subjek ke dalam keadaan mabuk. 'Menjadi mabuk' mempertahankan nuansa ingresif, sedangkan 'lalu' menandai urutan naratif.
- source_word: וַיִּתְגַּל
  choice: dan menyingkapkan dirinya
  rationale: 'Bentuk Hitpael dari גלה paling mungkin bernuansa refleksif: Nuh membuat dirinya tersingkap. Pilihan ini juga mempertahankan ambiguitas mengenai kadar ketelanjangannya.'
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: di dalam kemahnya
  rationale: בְּתוֹךְ menunjukkan lokasi di bagian dalam suatu ruang. 'Di dalam kemahnya' jelas, alami, dan tepat.
theological_decisions:
- issue: Penilaian moral dan makna keterbukaan tubuh Nuh
  choice: Menerjemahkan tindakan secara deskriptif sebagai 'menyingkapkan dirinya' tanpa menambahkan penilaian moral atau rincian seksual.
  alternative: '''terbaring telanjang'' atau ''dalam keadaan tersingkap'''
  rationale: Ayat Ibrani melaporkan tindakan minum, keadaan mabuk, dan tersingkapnya Nuh tanpa komentar moral eksplisit. Bentuk verba mendukung pembacaan refleksif, tetapi alternatif statif tetap mungkin dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk narasi yang ringkas; susunan klausa mempertahankan urutan tindakan dalam teks Ibrani tanpa mengulang setiap konjungsi secara kaku.
