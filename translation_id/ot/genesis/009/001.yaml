  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: id
  text: Lalu Allah memberkati Nuh dan putra-putranya, lalu berfirman kepada mereka, “Beranak cuculah, bertambah banyaklah, dan penuhilah bumi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Bentuk piel dari ברך di sini menyatakan tindakan Allah melimpahkan berkat, bukan sekadar mengucapkan hal yang baik.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, אֱלֹהִים merujuk kepada Allah yang esa; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: נֹחַ
  choice: Nuh
  rationale: Nama tokoh mengikuti bentuk yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks langsung, kata ini merujuk secara khusus kepada putra-putra Nuh. Bahasa Indonesia lazim memakai “anak-anaknya” tanpa membedakan jenis kelamin, sementara konteks narasi memperjelas para rujukannya.
- source_word: וַיֹּאמֶר לָהֶם
  choice: serta berfirman kepada mereka
  rationale: “Berfirman” merupakan pilihan bahasa Indonesia yang wajar dan bermartabat untuk perkataan langsung Allah; “serta” menghubungkan kedua tindakan tanpa mengubah urutan narasi.
- source_word: פְּרוּ
  choice: Beranakcuculah
  rationale: Imperatif ini memerintahkan menghasilkan keturunan. Pilihan ini alami dalam kolokasi Alkitab bahasa Indonesia dan mempertahankan gema Kejadian 1:28.
- source_word: וּרְבוּ
  choice: bertambah banyaklah
  rationale: Ungkapan ini menyampaikan pertambahan jumlah secara jelas dan alami, sebagai akibat berkembangnya keturunan.
- source_word: וּמִלְאוּ
  choice: penuhilah
  rationale: Verba ini berarti membuat penuh atau memenuhi; pilihan ini tidak menambahkan gagasan khusus tentang mengisi kembali.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Konteks sesudah air bah dan gema Kejadian 1:28 menunjukkan cakupan seluruh bumi, bukan suatu wilayah setempat.
theological_decisions:
- issue: Hubungan dengan mandat penciptaan dalam Kejadian 1:28
  choice: Mempertahankan rangkaian “Beranakcuculah, bertambah banyaklah, dan penuhilah bumi.”
  alternative: Memperluas secara idiomatis menjadi “Miliki banyak keturunan dan sebarkan mereka ke seluruh bumi.”
  rationale: Susunan Ibrani sengaja menggemakan berkat penciptaan. Mempertahankan tiga imperatif menjaga kesinambungan teologis antara umat manusia pasca-air bah dan amanat penciptaan tanpa menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, baku, lugas, dan bermartabat. Diksi mempertahankan pola perintah yang dikenal dari Kejadian 1:28 sekaligus tetap mudah dipahami pembaca umum. Tidak diperlukan catatan kaki karena “bumi” paling sesuai dengan konteks dan tidak ada ambiguitas penting yang perlu ditampilkan dalam ayat ini.
