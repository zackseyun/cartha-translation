  to: Setiap makhluk yang bergerak dan hidup akan menjadi makanan bagimu. Seperti tumbuh-tumbuhan hijau, telah Kuberikan semuanya kepadamu.[a]
  rationale: Revisi menghapus “sekarang,” yang tidak ada dalam teks Ibrani, dan menerjemahkan נָתַתִּי secara konsisten sebagai “telah Kuberikan.” Susunan klausa pertama diperjelas agar frasa relatif “yang hidup” tetap tampak sebagai kualifikasi terhadap רֶמֶשׂ. Catatan kaki kini menyertakan alternatif terjemahan yang eksplisit sambil mempertahankan ketidakpastian leksikal dan cakupan luas dalam konteks.
