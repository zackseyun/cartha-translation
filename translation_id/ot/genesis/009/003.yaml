  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: id
  text: Setiap makhluk yang bergerak dan hidup akan menjadi makanan bagimu. Seperti tumbuh-tumbuhan hijau, telah Kuberikan semuanya kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setiap makhluk yang merayap yang hidup akan menjadi makanan bagimu.” Kata Ibrani yang diterjemahkan “makhluk yang bergerak” sering merujuk pada makhluk yang merayap atau berkerumun, tetapi dalam konteks ini tampaknya digunakan dengan arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ
  choice: setiap makhluk hidup yang bergerak
  rationale: רֶמֶשׂ dapat menunjuk pada makhluk yang merayap atau berkerumun, tetapi dalam konteks pemberian makanan sesudah air bah cakupannya tampak luas. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasinya secara tidak semestinya.
- source_word: אֲשֶׁר הוּא חַי
  choice: hidup
  rationale: Keterangan ini menegaskan bahwa yang dimaksud ialah makhluk yang hidup. Dalam bahasa Indonesia, unsur ini digabungkan secara alami menjadi 'makhluk hidup yang bergerak' tanpa menghilangkan maknanya.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: akan menjadi makanan bagimu
  rationale: Mempertahankan konstruksi predikatif dan sasaran jamak dalam bentuk Indonesia yang wajar; 'bagimu' di sini menyapa Nuh beserta anak-anaknya secara kolektif.
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: seperti tumbuh-tumbuhan hijau
  rationale: יֶרֶק עֵשֶׂב merupakan ungkapan kolektif bagi tumbuh-tumbuhan hijau, dengan gema pemberian tanaman sebagai makanan sebelumnya.
- source_word: נָתַתִּי
  choice: telah Kuberikan ... sekarang Kuberikan
  rationale: 'Satu verba Ibrani mengendalikan perbandingan: sebagaimana tanaman dahulu diberikan, demikian semuanya diberikan kini. Terjemahan Indonesia menyatakan hubungan waktu yang tersirat agar kalimat tetap alami tanpa mengubah isi pemberian.'
- source_word: אֶת כֹּל
  choice: semuanya
  rationale: Bentuk kolektif ini mempertahankan daya cakup כֹּל dan merujuk secara alami kepada seluruh kategori yang baru disebut.
theological_decisions:
- issue: Cakupan pemberian hewan sebagai makanan sesudah air bah
  choice: Ayat ini menyatakan pemberian yang luas atas makhluk hidup yang bergerak sebagai makanan.
  alternative: Membatasi רֶמֶשׂ hanya pada binatang kecil, binatang melata, atau makhluk yang berkerumun.
  rationale: Walaupun רֶמֶשׂ kadang-kadang memiliki arti yang lebih sempit, konteks dan penutup אֶת כֹּל mendukung cakupan luas. Catatan kaki mempertahankan alternatif leksikal tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal kolektif 'bagimu/kepadamu' mengikuti sapaan Ibrani kepada Nuh dan anak-anaknya; kapitalisasi pada bentuk terikat 'Kuberikan' menandai pembicara ilahi. 'Sekarang' memperjelas perbandingan temporal yang tersirat antara pemberian tanaman sebelumnya dan pemberian saat ini.
