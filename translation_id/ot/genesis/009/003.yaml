  naturalness: Usulan revisi tetap baku, modern, dan jelas. “Makhluk yang bergerak dan hidup” menyatakan nomina רֶמֶשׂ beserta klausa pembatasnya tanpa menyiratkan bahwa “hidup” adalah bagian leksikal dari nomina itu sendiri.
  terminology: “Makanan bagimu,” “tumbuh-tumbuhan hijau,” dan “semuanya” sesuai dengan register serta cakupan teks. Catatan kaki direvisi agar benar-benar menyajikan alternatif terjemahan, bukan hanya penjelasan umum.
