base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: id
  text: Lalu ia berkata, “Terkutuklah Kanaan![a] Ia akan menjadi budak yang paling rendah[b] bagi saudara-saudaranya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks ini secara eksplisit menyebut Kanaan, bukan Ham.
    reason: textual_clarification
  - marker: b
    text: Secara harfiah, “budak dari budak-budak”; ungkapan Ibrani ini menegaskan tingkat perbudakan yang paling rendah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan memperkenalkan ucapan langsung. ‘Lalu’ menyampaikan kesinambungan itu secara wajar dalam bahasa Indonesia.
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Adjektiva predikatif ini menyatakan kutuk dengan daya deklaratif. Bentuk ‘terkutuklah’ sesuai dengan nada khidmat suatu pernyataan kutuk.
- source_word: כְּנָעַן
  choice: Kanaan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Teks Ibrani secara eksplisit menyebut Kanaan.
- source_word: עֶבֶד עֲבָדִים
  choice: budak yang paling rendah
  rationale: Ungkapan harfiah ‘budak dari budak-budak’ merupakan konstruksi penguatan yang menyatakan tingkat perbudakan paling rendah. Terjemahan ini menyampaikan maknanya secara alami, sementara bentuk Ibraninya dipertahankan dalam catatan kaki.
- source_word: יִהְיֶה
  choice: Ia akan menjadi
  rationale: Bentuk imperfek היה dalam pernyataan kutuk ini menunjuk pada keadaan yang akan berlaku sebagai akibatnya.
- source_word: לְאֶחָיו
  choice: bagi saudara-saudaranya
  rationale: Secara harfiah berarti ‘bagi/kepada saudara-saudaranya’. Pilihan ini mempertahankan bahasa kekerabatan maskulin dalam teks dan tidak mempersempit kemungkinan nuansa keluarga atau kaum.
theological_decisions:
- issue: Sasaran kutuk Nuh
  choice: Kanaan disebut sebagai pihak yang terkutuk.
  alternative: Menafsirkan bahwa Ham secara langsung adalah pihak yang dikutuk.
  rationale: Teks Ibrani secara eksplisit menyebut Kanaan, bukan Ham. Terjemahan tidak mengalihkan sasaran kutuk berdasarkan tradisi penafsiran.
- issue: Bahasa perbudakan
  choice: Menggunakan ‘budak’ dan menyampaikan עֶבֶד עֲבָדִים sebagai ‘budak yang paling rendah’.
  alternative: Menggunakan ‘hamba’, ‘pelayan’, atau mempertahankan secara kaku ‘budak dari budak-budak’.
  rationale: Dalam konteks kutuk dan penundukan ekstrem ini, ‘budak’ lebih tepat daripada istilah yang lebih lunak. Terjemahan utama menyampaikan fungsi intensif konstruksi Ibrani tanpa mengaburkan kerasnya ungkapan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ucapan kutuk dibuat tegas tanpa gaya yang terlalu arkais; istilah ‘budak’ mempertahankan kerasnya status yang dinyatakan teks.
