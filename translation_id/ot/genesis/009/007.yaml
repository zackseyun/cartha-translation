  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: id
  text: Adapun kamu, beranak cuculah dan bertambah banyaklah; berkembang biaklah dengan melimpah di bumi[a] dan bertambah banyaklah di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “beranak-pinaklah di bumi.” Kata kerja Ibrani ini menyatakan berkembang biak atau berlimpah-limpah dalam jumlah besar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Adapun kamu
  rationale: Konjungsi dan pronomina mandiri memberi penekanan serta mengalihkan kembali perhatian kepada Nuh dan anak-anaknya; “Adapun kamu” menyampaikan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: פְּרוּ
  choice: beranakcuculah
  rationale: Dalam pasangan perintah ini, פרה menunjuk pada menghasilkan keturunan. “Beranakcuculah” merupakan ungkapan Indonesia yang wajar dan tetap membedakannya dari רבה, yaitu pertambahan jumlah.
- source_word: וּרְבוּ
  choice: dan bertambah banyaklah
  rationale: רבה menyatakan pertambahan jumlah. Pengulangan terjemahan yang sama pada akhir ayat mempertahankan penekanan dan kesejajaran teks Ibrani.
- source_word: שִׁרְצוּ
  choice: berkembang biaklah dengan limpah
  rationale: שׁרץ menggambarkan perkembangbiakan yang sangat banyak, seperti makhluk yang berkeriapan atau beranak-pinak. Pilihan ini mempertahankan gagasan kelimpahannya tanpa menghasilkan ungkapan Indonesia yang janggal ketika diterapkan kepada manusia.
- source_word: בָאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ di sini paling wajar merujuk pada bumi sebagai tempat umat manusia berkembang sesudah air bah; preposisi ב dapat disampaikan secara alami dengan “di”.
- source_word: וּרְבוּ בָהּ
  choice: dan bertambah banyaklah di sana
  rationale: Akhiran pronominal feminin merujuk kembali kepada bumi. “Di sana” lebih alami daripada “di dalamnya” untuk tempat hidup manusia, sambil mempertahankan pengulangan perintah רבה.
theological_decisions:
- issue: Hubungan ayat ini dengan mandat penciptaan dan berkat sesudah air bah
  choice: Menerjemahkannya sebagai perintah yang menegaskan kembali perkembangbiakan Nuh dan anak-anaknya, tanpa menambahkan penafsiran teologis ke dalam teks.
  alternative: Menjadikannya sekadar pengulangan Kejadian 1:28 atau memperluasnya menjadi rumusan perjanjian yang bersifat doktrinal.
  rationale: Bentuk imperatifnya menggemakan bahasa berkat-penciptaan, tetapi terjemahan perlu mempertahankan gema tersebut tanpa menetapkan kesimpulan teologis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “beranakcuculah” mempertahankan corak perintah berkat yang dikenal, sedangkan “berkembang biaklah dengan limpah” menyampaikan daya gambar שׁרץ secara jelas bagi pembaca umum.
