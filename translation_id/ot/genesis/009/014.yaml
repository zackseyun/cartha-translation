  text: וְ/הָיָ֕ה בְּ/עַֽנְנִ֥/י עָנָ֖ן עַל הָ/אָ֑רֶץ וְ/נִרְאֲתָ֥ה הַ/קֶּ֖שֶׁת בֶּ/עָנָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/014.yaml
  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: id
  text: Apabila Aku mendatangkan awan di atas bumi dan busur[a] tampak di dalam awan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelangi”. Kata Ibrani yang diterjemahkan “busur” adalah kata biasa untuk busur, tetapi di sini menunjuk kepada pelangi sebagai tanda perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Apabila
  rationale: Konstruksi ini memperkenalkan keadaan waktu pada masa mendatang; “apabila” alami dalam bahasa Indonesia dan mempertahankan nuansa temporalnya.
- source_word: בְּעַנְנִי עָנָן
  choice: Aku mendatangkan awan
  rationale: Bentuk denominatif dari ענן dengan subjek orang pertama menyatakan tindakan membuat langit berawan atau mendatangkan awan. Ungkapan ini alami dan tetap dekat dengan gambaran Ibraninya.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: “Bumi” sesuai dengan cakupan universal perjanjian sesudah air bah; “di atas” menyatakan posisi awan secara wajar.
- source_word: וְנִרְאֲתָה
  choice: tampak
  rationale: Bentuk Nifal dari ראה dapat berarti “terlihat” atau “tampak.” Pilihan ini alami, tetap mempertahankan nuansa muncul menjadi terlihat, dan sesuai dengan rangkaian yang diperkenalkan oleh “apabila.”
- source_word: הַקֶּשֶׁת
  choice: busur
  rationale: קשת adalah kata biasa untuk busur dan dalam konteks ini menunjuk kepada pelangi sebagai tanda perjanjian. “Busur” mempertahankan citra leksikal teks sumber; maksud kontekstualnya dijelaskan dalam catatan kaki.
- source_word: בֶּעָנָן
  choice: di dalam awan
  rationale: Bentuk tunggal definit dalam bahasa Ibrani diterjemahkan secara langsung sebagai “awan”; “di dalam” menunjukkan tempat busur itu tampak.
theological_decisions:
- issue: Penerjemahan קשת dalam konteks perjanjian dengan Nuh
  choice: busur
  alternative: pelangi
  rationale: Teks Ibrani memakai kata umum yang berarti “busur,” sekaligus menunjuk kepada pelangi dalam konteks tanda perjanjian. Teks utama mempertahankan citra aslinya tanpa menghilangkan rujukan kontekstual, yang dijelaskan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan “awan” maupun citra “busur” dari teks Ibrani.
