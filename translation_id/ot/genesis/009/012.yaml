  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: id
  text: Lalu Allah berfirman, “Inilah tanda perjanjian yang Aku berikan antara Aku dan kamu, dan antara Aku dan setiap makhluk hidup yang ada bersama kamu, turun-temurun untuk selama-lamanya:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur narasi. Karena subjeknya Allah, “berfirman” merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada satu-satunya Allah yang berbicara kepada Nuh; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: זֹאת אוֹת הַבְּרִית
  choice: Inilah tanda perjanjian
  rationale: Demonstrativa זֹאת bersifat identifikatif, sedangkan אוֹת menunjuk pada tanda yang tampak dalam konteks pelangi. Susunan ini alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: yang Kuberikan
  rationale: Partisip נֹתֵן secara langsung berarti “memberikan”. Bentuk “Kuberikan” mempertahankan citra sumber tanpa menggantinya dengan “Kuadakan” atau “Kubuat”.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: antara Aku dan kamu serta
  rationale: Mengungkapkan para pihak dalam perjanjian dengan susunan Indonesia yang lancar; “serta” menandai penambahan pihak ketiga tanpa kehilangan hubungan yang dinyatakan oleh pengulangan בֵּין.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: setiap makhluk hidup
  rationale: Dalam konteks ini frasa tersebut mencakup binatang yang bersama Nuh. “Makhluk hidup” menghindari kesan antropologis sempit yang dapat timbul dari terjemahan harfiah “jiwa hidup”.
- source_word: אֲשֶׁר אִתְּכֶם
  choice: yang bersama kamu
  rationale: Mempertahankan klausa relatif yang menerangkan makhluk-makhluk yang menyertai Nuh dan keluarganya.
- source_word: לְדֹרֹת עוֹלָם
  choice: turun-temurun untuk selama-lamanya
  rationale: Ungkapan ini mempertahankan unsur generasi dari דֹרֹת dan keberlangsungan jangka tak terbatas dari עוֹלָם dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Makna verba נֹתֵן dalam ungkapan perjanjian
  choice: yang Kuberikan
  alternative: yang Kuadakan
  rationale: Teks Ibrani memakai verba “memberikan”, bukan verba teknis “mengadakan/membuat”. Terjemahan langsung ini mempertahankan metafora dan tidak menentukan secara berlebihan bagaimana tanda dan perjanjian itu ditetapkan.
- issue: Cakupan נֶפֶשׁ חַיָּה
  choice: setiap makhluk hidup
  alternative: setiap jiwa yang hidup
  rationale: Konteks perjanjian Nuh secara jelas mencakup binatang. “Makhluk hidup” menjaga cakupan tersebut tanpa memasukkan konsep khusus tentang hakikat jiwa.
- issue: Daya waktu לְדֹרֹת עוֹלָם
  choice: turun-temurun untuk selama-lamanya
  alternative: sepanjang segala generasi
  rationale: Pilihan utama menyatakan baik rangkaian generasi maupun keberlangsungan yang dikandung עוֹלָם, tanpa berusaha menyelesaikan secara dogmatis rentang semantis istilah itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab Indonesia. Tanda titik dua dipertahankan karena perkataan berlanjut pada ayat berikutnya.
