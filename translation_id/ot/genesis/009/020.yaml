  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: id
  text: Nuh, seorang pengolah tanah, mulai menanam kebun anggur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi orang pertama yang menanam kebun anggur.” Susunan bahasa Ibrani padat; sebagian orang memahami kata “mulai” dalam arti “menjadi yang pertama”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: mulai
  rationale: Bentuk Hifil dari חלל paling wajar berarti “mulai” dalam konteks ini. Maknanya diteruskan kepada verba berikutnya sehingga menjadi ungkapan alami “mulai menanami”.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: אִישׁ הָאֲדָמָה
  choice: seorang penggarap tanah
  rationale: Ungkapan ini secara harfiah berarti “seorang laki-laki tanah” dan menunjuk pada orang yang mengusahakan tanah. “Penggarap tanah” mempertahankan kaitan eksplisit dengan tanah sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וַיִּטַּע
  choice: menanami
  rationale: Verba נטע berarti “menanam”. Bentuk “menanami” sesuai dengan objek berupa lahan, yaitu kebun anggur, dan menghasilkan kalimat Indonesia yang alami.
- source_word: כָּרֶם
  choice: kebun anggur
  rationale: Padanan baku bagi lahan yang ditanami tanaman anggur.
theological_decisions:
- issue: Cara memahami rangkaian eliptis וַיָּחֶל ... וַיִּטַּע
  choice: mulai menanami kebun anggur
  alternative: menjadi orang pertama yang menanami kebun anggur; mulai lalu menanami kebun anggur
  rationale: Teks Ibrani padat secara sintaksis. Memahami “mulai” sebagai verba yang maknanya berlanjut ke tindakan “menanam” paling sesuai dengan alur narasi dan menghasilkan bahasa Indonesia yang alami. Tafsiran “orang pertama” mungkin, tetapi tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Penggarap tanah” dipilih alih-alih “petani” agar citra tanah dalam ungkapan Ibrani tetap tampak; “menanami kebun anggur” lebih alami daripada “menanam sebuah kebun anggur” karena objeknya berupa lahan.
