  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: id
  text: 'Aku akan menetapkan perjanjian-Ku dengan kalian: semua makhluk hidup[a] tidak akan pernah lagi dilenyapkan[b] oleh air bah, dan tidak akan pernah lagi ada air bah yang membinasakan bumi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala daging”; ungkapan ini mencakup makhluk hidup secara luas, bukan hanya manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “diputuskan”; dalam konteks ini berarti dibinasakan atau dilenyapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Aku akan menegakkan
  rationale: Bentuk Hifil dari קום dalam ungkapan perjanjian berarti menetapkan atau meneguhkan. Bentuk mendatang sesuai dengan konteks janji, sedangkan “menegakkan” mempertahankan nada perjanjian yang khidmat tanpa memastikan apakah perjanjian itu baru dimulai atau diteguhkan.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: “Perjanjian” merupakan padanan baku dan wajar bagi בְּרִית serta mempertahankan bobot sastra dan teologis istilah tersebut dalam kitab Kejadian.
- source_word: אִתְּכֶם
  choice: dengan kalian
  rationale: Kata ganti Ibrani berbentuk jamak. “Kalian” menyatakan dengan jelas bahwa Allah berbicara kepada lebih dari satu pihak.
- source_word: יִכָּרֵת
  choice: dilenyapkan
  rationale: Nifal dari כרת secara harfiah berarti “diputuskan”, tetapi dalam konteks penghukuman oleh air bah menunjuk pada kebinasaan. “Dilenyapkan” alami dalam bahasa Indonesia dan tetap mencerminkan gambaran hilangnya seluruh kehidupan; arti harfiahnya dicatat dalam catatan kaki.
- source_word: כָּל בָּשָׂר
  choice: semua makhluk hidup
  rationale: Secara harfiah ungkapan ini berarti “segala daging”, tetapi dalam konteks kisah air bah cakupannya meliputi manusia dan hewan. “Semua makhluk hidup” menyampaikan cakupan itu dengan bahasa Indonesia yang alami tanpa membatasinya pada manusia.
- source_word: עוֹד
  choice: tidak akan pernah lagi
  rationale: Dalam konstruksi negatif yang menyatakan janji, עוֹד membawa makna idiomatis “tidak akan pernah lagi”. Pengulangan ungkapan ini dipertahankan pada kedua klausa.
- source_word: מִמֵּי הַמַּבּוּל
  choice: oleh air bah
  rationale: Preposisi מן di sini menyatakan sarana atau penyebab kebinasaan. “Oleh air bah” ringkas, alami, dan menyampaikan daya perusak air banjir besar itu.
- source_word: מַבּוּל
  choice: air bah
  rationale: “Air bah” adalah istilah Indonesia yang mapan untuk מַבּוּל dalam kisah Nuh dan lebih sesuai dengan konteks daripada sekadar “banjir”.
- source_word: לְשַׁחֵת
  choice: yang membinasakan
  rationale: Infinitif שׁחת menyatakan tujuan atau akibat yang merusak. Dalam klausa keberadaan, “air bah yang membinasakan bumi” lebih alami daripada susunan harfiah “air bah untuk membinasakan bumi” tanpa mengubah maksud sumber.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks universal kisah air bah dan janji bagi seluruh makhluk hidup, “bumi” lebih tepat daripada “negeri” atau “tanah”.
theological_decisions:
- issue: Cakupan כָּל בָּשָׂר dalam janji perjanjian
  choice: Diterjemahkan “semua makhluk hidup”, mencakup manusia dan hewan.
  alternative: “semua manusia” atau bentuk harfiah “segala daging”
  rationale: Konteks sesudah air bah secara eksplisit melibatkan manusia dan hewan. Pilihan ini mempertahankan cakupan luas teks tanpa membatasi janji hanya kepada umat manusia.
- issue: Nuansa קום dalam rumusan perjanjian
  choice: Diterjemahkan “menegakkan perjanjian-Ku”.
  alternative: “menetapkan perjanjian-Ku” atau “meneguhkan perjanjian-Ku”
  rationale: “Menegakkan” mempertahankan ragam bahasa perjanjian dan tidak secara diam-diam memutuskan perdebatan apakah tindakan itu merupakan pembentukan baru atau pengukuhan perjanjian yang telah dinyatakan.
- issue: Cakupan הָאָרֶץ
  choice: Diterjemahkan “bumi”.
  alternative: “negeri” atau “tanah”
  rationale: Hubungan dengan “semua makhluk hidup” dan keseluruhan kisah air bah mendukung cakupan universal, tetapi terjemahan tidak menambahkan perincian kosmologis yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Aku” mempertahankan tuturan langsung ilahi; “kalian” memperjelas bentuk jamak dari sapaan Ibrani. Pengulangan “tidak akan pernah lagi” dipertahankan untuk mencerminkan struktur dan penegasan teks sumber.
