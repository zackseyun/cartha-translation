id: GEN.9.23
reference: Genesis 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: id
  text: Lalu Sem dan Yafet mengambil pakaian itu[a] dan menaruhnya di atas bahu mereka berdua. Mereka berjalan mundur dan menutupi ketelanjangan ayah mereka. Wajah mereka menghadap ke belakang sehingga mereka tidak melihat ketelanjangan ayah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jubah itu.” Kata Ibrani ini menunjuk pada pakaian luar yang di sini digunakan untuk menutupi Nuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk wayyiqtol dari לקח melanjutkan rangkaian narasi dan secara alami diterjemahkan dengan verba sederhana “mengambil”.
- source_word: שֵׁם וָיֶפֶת
  choice: Sem dan Yafet
  rationale: Nama-nama ini memakai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַשִּׂמְלָה
  choice: pakaian itu
  rationale: שׂמלה menunjuk pada pakaian luar atau jubah. “Pakaian” cukup luas dan tidak menentukan bentuk benda itu secara berlebihan; artikel Ibrani diterjemahkan dengan “itu” karena merujuk pada benda tertentu dalam adegan tersebut.
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: menaruhnya di atas bahu mereka berdua
  rationale: Ungkapan Ibrani secara harfiah menyebut “bahu keduanya”; terjemahan ini mempertahankan gambaran bahwa mereka bersama-sama menopang pakaian itu tanpa menambahkan cara pembawaannya.
- source_word: אֲחֹרַנִּית
  choice: mundur / menghadap ke belakang
  rationale: Kata keterangan ini menyatakan gerak atau orientasi ke belakang. Bentuk Indonesia disesuaikan dengan masing-masing konteks sambil mempertahankan pengulangan gagasannya.
- source_word: וַיְכַסּוּ
  choice: menutupi
  rationale: Padanan langsung dan wajar bagi כסה dalam konteks menutup tubuh yang terbuka.
- source_word: עֶרְוַת אֲבִיהֶם
  choice: ketelanjangan ayah mereka
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani beserta nuansa malu dan kehormatan, tanpa mempersempitnya menjadi tafsiran seksual tertentu.
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: Wajah mereka menghadap ke belakang
  rationale: Klausa Ibrani tidak memiliki verba tersurat; “menghadap” melengkapinya secara alami dalam bahasa Indonesia dan menjelaskan orientasi wajah mereka.
- source_word: לֹא רָאוּ
  choice: mereka tidak melihat
  rationale: Padanan lugas bagi verba ראה yang dinegasikan; tidak ditambahkan gagasan “memandangi” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna “ketelanjangan ayah mereka” dalam ayat ini
  choice: Tubuh Nuh yang terbuka secara harfiah dan ditutupi dengan hormat oleh Sem dan Yafet
  alternative: Ungkapan halus dengan makna seksual seperti dalam sejumlah pemakaian di bagian lain Kitab Suci
  rationale: 'Tindakan dalam konteks langsung bersifat konkret: pakaian diambil, kedua anak itu berjalan mundur, menutupi ayah mereka, dan tidak melihatnya. Terjemahan tetap memakai “ketelanjangan” agar tidak memasukkan tafsiran yang lebih khusus ke dalam teks.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “ketelanjangan ayah mereka” dipertahankan karena menggemakan struktur dan penekanan teks Ibrani.
