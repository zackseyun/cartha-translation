  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: id
  text: Siapa yang menumpahkan darah manusia[a], darahnya akan ditumpahkan oleh manusia[b], sebab Allah menjadikan manusia menurut gambar-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “manusia” di seluruh ayat ini adalah ’adam, yang di sini dipakai secara umum untuk manusia atau seorang insan, bukan hanya laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan/oleh manusia.” Ungkapan Ibrani ini paling mungkin menunjukkan manusia sebagai pelaksana; dapat juga dipahami “di antara manusia.”
    reason: textual_or_semantic_ambiguity
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: Siapa yang menumpahkan
  rationale: Partisipel Qal ini menyatakan pelaku secara umum dalam bentuk pepatah atau ketetapan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sifat umum pernyataan.
- source_word: דַּם הָאָדָם
  choice: darah manusia
  rationale: דָּם berarti darah dan dalam konteks ini menunjuk pada nyawa yang ditumpahkan melalui pembunuhan. הָאָדָם dipakai secara generik untuk seorang manusia, bukan hanya laki-laki.
- source_word: בָּאָדָם
  choice: oleh manusia
  rationale: 'Preposisi בְּ paling wajar dipahami secara instrumental atau agentif: manusia menjadi pelaksana penumpahan darah si pembunuh. Pilihan ini juga mempertahankan pengulangan אָדָם dalam ayat.'
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: darahnya akan ditumpahkan
  rationale: Bentuk Nifal dipertahankan sebagai pasif. 'Akan ditumpahkan' menyampaikan pernyataan yang tegas tanpa mempersempit bentuk Ibrani menjadi perintah eksplisit.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi ketetapan sebelumnya.
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: menurut gambar-Nya
  rationale: Ungkapan Indonesia ini menyampaikan bahwa manusia dijadikan dalam gambar Allah. Akhiran '-Nya' jelas merujuk kepada Allah sebagai subjek kalimat.
- source_word: עָשָׂה אֶת הָאָדָם
  choice: Allah menjadikan manusia
  rationale: עָשָׂה berarti 'membuat/menjadikan', bukan istilah khusus ברא 'menciptakan'. 'Menjadikan' alami dalam konstruksi ini dan manusia kembali menerjemahkan אָדָם secara generik.
theological_decisions:
- issue: Makna generik אָדָם
  choice: manusia
  alternative: orang; umat manusia
  rationale: '''Manusia'' mencakup setiap insan tanpa membatasi pada laki-laki dan memungkinkan pengulangan retoris kata Ibrani yang sama.'
- issue: Peran manusia dalam בָּאָדָם
  choice: oleh manusia
  alternative: di antara manusia
  rationale: Pembacaan agentif paling sesuai dengan susunan paralel ayat, tetapi alternatif lokatif tetap dicatat karena preposisi Ibrani dapat memiliki rentang makna yang lebih luas.
- issue: Rumusan gambar Allah
  choice: Allah menjadikan manusia menurut gambar-Nya
  alternative: menurut gambar Allah, Dia menjadikan manusia
  rationale: Pilihan utama alami dalam bahasa Indonesia dan mempertahankan isi teologis tanpa menambahkan penjelasan tentang hakikat gambar Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Pengulangan 'manusia' dipertahankan untuk mencerminkan tiga pemakaian אָדָם dan menghubungkan korban, pelaksana keadilan, serta manusia sebagai gambar Allah.
