  text: Setelah air bah, Nuh hidup selama tiga ratus lima puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Bentuk wayyiqtol dari חיה menyatakan kelanjutan masa hidup Nuh sesudah air bah. Kata “lagi” secara alami menyampaikan bahwa angka tersebut adalah tambahan masa hidup setelah peristiwa itu, tanpa memberi penekanan berlebihan pada gagasan selamat.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אַחַר
  choice: setelah
  rationale: Preposisi temporal yang menandai waktu sesudah suatu peristiwa; “setelah” merupakan padanan Indonesia yang lugas dan alami.
- source_word: הַמַּבּוּל
  choice: air bah itu
  rationale: Nomina definit ini merujuk pada air bah yang telah diceritakan. “Air bah” adalah istilah Indonesia yang jelas untuk banjir besar tersebut, sedangkan “itu” mempertahankan sifat definitnya.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: tiga ratus lima puluh tahun
  rationale: Gabungan bilangan Ibrani diterjemahkan menurut susunan bilangan Indonesia yang wajar dan mempertahankan jumlah tepat 350 tahun.
