id: GEN.9.27
reference: Genesis 9:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: id
  text: Kiranya Allah melapangkan tempat bagi Yafet[a], dan kiranya ia tinggal di kemah-kemah Sem, dan biarlah Kanaan menjadi budak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kiranya Allah tinggal di kemah-kemah Sem”; alternatif lain, “dan kiranya Yafet tinggal di kemah-kemah Sem.” Teks Ibrani tidak menyatakan subjek kata “tinggal”.
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: melapangkan tempat
  rationale: Bentuk yusif ini menyatakan permohonan agar Allah memberi keluasan kepada Yafet. Ungkapan ini menyampaikan gagasan ruang yang luas dan tetap memungkinkan permainan bunyi Ibrani antara kata kerja tersebut dan nama Yafet, meskipun permainan itu tidak dapat dipertahankan sepenuhnya dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba dan konteksnya menunjuk kepada Allah yang esa; 'Allah' adalah padanan baku dan wajar dalam bahasa Indonesia.
- source_word: לְיֶפֶת
  choice: bagi Yafet
  rationale: Preposisi לְ dipertahankan secara idiomatis dengan 'bagi', selaras dengan makna bahwa Allah memberi keluasan atau ruang kepada Yafet.
- source_word: וְיִשְׁכֹּן
  choice: dan kiranya ia tinggal
  rationale: Bentuk yusif diterjemahkan dengan 'kiranya'. Pronomina 'ia' sengaja tidak menetapkan apakah subjeknya Allah atau Yafet, sebagaimana ketaksaan dalam teks Ibrani.
- source_word: בְּאָהֳלֵי שֵׁם
  choice: di kemah-kemah Sem
  rationale: Terjemahan lokatif yang langsung mempertahankan gambaran konkret tentang kemah dan tidak menggeneralisasikannya menjadi tempat tinggal.
- source_word: וִיהִי
  choice: dan biarlah ... menjadi
  rationale: Bentuk yusif yang melanjutkan gaya berkat dan kutuk diterjemahkan secara alami dengan 'biarlah ... menjadi'.
- source_word: כְנַעַן
  choice: Kanaan
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: עֶבֶד
  choice: budak
  rationale: Kedudukan takluk dan terikat merupakan unsur penting dalam pernyataan ini; 'budak' menyampaikan makna tersebut lebih tepat daripada 'pelayan'.
- source_word: לָמוֹ
  choice: mereka
  rationale: Bentuk pronominal ini lazim dipahami sebagai jamak dan dalam alur ayat secara alami mengacu kepada pihak-pihak yang baru disebut, yakni Sem dan Yafet.
theological_decisions:
- issue: Identitas subjek dalam frasa 'kiranya ia tinggal di kemah-kemah Sem'
  choice: Teks utama memakai pronomina 'ia' tanpa menentukan apakah yang dimaksud adalah Allah atau Yafet.
  alternative: 'Subjek dapat dipahami sebagai Allah: ''kiranya Allah tinggal di kemah-kemah Sem''; atau sebagai Yafet: ''kiranya Yafet tinggal di kemah-kemah Sem''.'
  rationale: Verba Ibrani berjenis tunggal maskulin tetapi subjeknya tidak dinyatakan. Konteks memungkinkan Allah maupun Yafet sebagai subjek, sehingga ketaksaan teologis yang nyata dipertahankan dan kedua pembacaan utama dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kiranya' mempertahankan nuansa permohonan dalam ucapan berkat, sedangkan 'kemah-kemah' mempertahankan citra konkret teks sumber. Pronomina 'ia' dipilih untuk menjaga ketaksaan subjek.
