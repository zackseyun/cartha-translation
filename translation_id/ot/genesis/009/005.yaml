  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: id
  text: Namun, darah kalian, yakni nyawa kalian, pasti akan Kutuntut[a]. Dari setiap binatang akan Kutuntutnya, dan dari manusia—dari tangan saudaranya—akan Kutuntut nyawa manusia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah kalian untuk nyawa kalian.” Dalam konteks ini darah dikaitkan erat dengan nyawa. “Akan Kutuntut” juga dapat diterjemahkan “akan Kumintai pertanggungjawaban.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: Namun ... pasti
  rationale: אַךְ memberi penegasan yang sekaligus membatasi atau mengontraskan; dalam konteks sesudah izin memakan binatang, “Namun ... pasti” mempertahankan hubungan dan tekanannya secara alami.
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: darah kalian yang menyangkut nyawa kalian
  rationale: Terjemahan ini mempertahankan kedua unsur Ibrani, yakni “darah” dan “nyawa”, tanpa meleburkannya menjadi satu istilah atau menimbulkan pengulangan yang janggal.
- source_word: אֶדְרֹשׁ
  choice: akan Kutuntut
  rationale: Dalam konteks hukum ini דרשׁ menyatakan tuntutan pertanggungjawaban atas darah atau nyawa yang diambil. “Kutuntut” ringkas, tegas, dan mempertahankan nada yudisial.
- source_word: מִיַּד
  choice: dari
  rationale: Ungkapan harfiahnya “dari tangan”; dalam bahasa Indonesia, “dari” menyampaikan pelaku yang dimintai pertanggungjawaban dengan lebih wajar, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כָּל חַיָּה
  choice: setiap binatang
  rationale: חַיָּה di sini menunjuk kepada binatang dan dikontraskan dengan manusia. “Binatang” jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֶדְרְשֶׁנּוּ
  choice: akan Kutuntut darah itu
  rationale: Akhiran pronominal merujuk paling wajar kepada darah yang baru disebut. Mengulangi “darah itu” menghindari ketidakjelasan kata ganti dalam bahasa Indonesia.
- source_word: הָאָדָם
  choice: manusia
  rationale: אָדָם di sini menyatakan manusia sebagai golongan dalam kontras dengan binatang; “manusia” mempertahankan makna representatif tanpa membatasi jenis kelamin.
- source_word: אִישׁ אָחִיו
  choice: sesama manusia, yaitu saudaranya
  rationale: Secara harfiah frasa ini berarti “seseorang, saudaranya”. Terjemahan utama menyampaikan pertanggungjawaban antarmanusia sambil mempertahankan citra kekerabatan “saudaranya”.
- source_word: נֶפֶשׁ הָאָדָם
  choice: nyawa manusia
  rationale: נֶפֶשׁ dalam konteks darah dan pembunuhan menunjuk pada nyawa atau kehidupan konkret, bukan secara khusus jiwa tak berjasad.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penumpahan darah
  choice: nyawa
  alternative: jiwa; hidup
  rationale: Konteks langsung menghubungkan darah dengan hilangnya hidup manusia. “Nyawa” mempertahankan arti konkret dan yudisial tanpa memasukkan pandangan metafisik yang tidak dinyatakan teks.
- issue: Cakupan אָדָם
  choice: manusia
  alternative: laki-laki; umat manusia
  rationale: Kata tersebut pertama-tama berkontras dengan binatang dan berfungsi secara generik. “Manusia” mencakup spesies manusia dan tetap cocok dengan bentuk tunggal representatif.
- issue: Hubungan מִיַּד אִישׁ אָחִיו dengan מִיַּד הָאָדָם
  choice: dipahami sebagai penjelasan yang memperinci pertanggungjawaban manusia
  alternative: dibaca sebagai klausa atau kalimat terpisah
  rationale: 'Susunan Ibrani paling alami dibaca secara aposisional: “dari manusia” diperinci oleh “dari seseorang, saudaranya”. Tanda pisah mempertahankan hubungan itu tanpa menghapus kepadatan sintaksis aslinya.'
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda pisah mempertahankan hubungan aposisional dalam klausa Ibrani; catatan kaki menjelaskan idiom darah/nyawa dan daya yudisial kata kerja.
