  yaml_path: translation/ot/genesis/009/008.yaml
  text: Then God said to Noah and to his sons with him, saying,
translation:
  language: id
  text: 'Kemudian Allah berfirman kepada Nuh dan kepada putra-putranya yang bersama dia, demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyampaikan daya sekuensialnya secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada satu-satunya Allah yang berbicara kepada Nuh; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֶל ... וְאֶל
  choice: kepada ... dan kepada
  rationale: Preposisi tersebut menandai pihak-pihak yang disapa. Pengulangan “kepada” mempertahankan koordinasi eksplisit dalam bahasa Ibrani.
- source_word: נֹחַ
  choice: Nuh
  rationale: Nama pribadi ini diterjemahkan menurut bentuk yang sudah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini bentuk jamak בָּנִים merujuk khusus kepada putra-putra Nuh. Bahasa Indonesia lazim memakai “anak-anaknya” untuk keturunan langsung tanpa membedakan gender; identitas mereka sebagai laki-laki sudah jelas dari konteks narasi.
- source_word: אִתּוֹ
  choice: yang bersama dia
  rationale: Frasa ini menerangkan bahwa anak-anak Nuh berada bersamanya. Bentuk klausa relatif terdengar lebih jelas dan alami dalam bahasa Indonesia daripada sekadar “bersama dia” setelah frasa posesif.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi ujaran yang menyusul. “Demikian:” mempertahankan fungsi pengantar wacana secara alami tanpa konstruksi Indonesia yang kaku seperti “dengan berkata”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur ayat mempertahankan kedua kelompok penerima ujaran serta penanda bahwa isi firman berlanjut pada ayat berikutnya.
