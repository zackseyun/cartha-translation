base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: id
  text: Ham, ayah Kanaan, melihat ketelanjangan ayahnya[a], lalu memberitahukan hal itu kepada kedua saudaranya yang berada di luar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini secara harfiah berarti “ketelanjangan ayahnya.” Dalam beberapa konteks Perjanjian Lama, ungkapan ini dapat berfungsi sebagai eufemisme seksual; di sini terjemahan mempertahankan ungkapan harfiahnya dan membiarkan pertanyaan penafsirannya tetap terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה secara langsung berarti “melihat”; tidak diperlukan terjemahan yang lebih interpretatif.
- source_word: חָם
  choice: Ham
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲבִי כְנַעַן
  choice: ayah Kanaan
  rationale: Rangkaian konstruksi ini mengidentifikasi Ham sebagai ayah Kanaan; bentuk aposisi tersebut alami dan ringkas dalam bahasa Indonesia.
- source_word: עֶרְוַת אָבִיו
  choice: ketelanjangan ayahnya
  rationale: Terjemahan yang dekat dengan bentuk Ibrani mempertahankan ungkapan sumber tanpa menetapkan tindakan seksual tertentu.
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד lazim berarti “memberi tahu”, “menyampaikan”, atau “melaporkan”; “memberi tahu” paling alami dalam narasi ini.
- source_word: לִשְׁנֵי אֶחָיו
  choice: kedua saudaranya
  rationale: Frasa Ibrani secara eksplisit menyebut dua saudara; “kedua saudaranya” merupakan padanan Indonesia yang wajar.
- source_word: בַּחוּץ
  choice: di luar
  rationale: Kata ini berarti “di luar” dan kemungkinan besar berkontras dengan tempat Nuh berada, yakni di dalam kemah.
theological_decisions:
- issue: Makna ungkapan “ketelanjangan ayahnya” dalam narasi ini
  choice: Ungkapan diterjemahkan secara harfiah tanpa menyatakan adanya tindakan seksual selain Ham melihat ayahnya dalam keadaan telanjang.
  alternative: Ungkapan ini dapat dipahami sebagai eufemisme bagi pelanggaran seksual yang lebih berat, termasuk penafsiran berdasarkan pemakaiannya dalam hukum-hukum kemudian.
  rationale: Dalam beberapa konteks Perjanjian Lama, ungkapan Ibrani ini dapat mengandung konotasi seksual yang lebih luas. Namun, ayat ini sendiri mengatakan bahwa Ham “melihat” lalu memberi tahu saudara-saudaranya, dan konteks terdekat berpusat pada tubuh Nuh yang tersingkap. Terjemahan literal beserta catatan kaki mempertahankan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur naratif Ibrani dengan tetap terdengar alami; istilah “ketelanjangan” dipilih untuk mempertahankan ungkapan sumber dan ambiguitas penafsirannya.
