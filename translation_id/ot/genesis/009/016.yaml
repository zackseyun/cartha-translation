id: GEN.9.16
reference: Genesis 9:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: id
  text: Busur itu akan ada di awan[a], dan Aku akan melihatnya untuk mengingat perjanjian kekal antara Allah dan setiap makhluk hidup dari segala yang berdaging di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pelangi”. Kata Ibrani yang digunakan secara harfiah berarti “busur”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: akan ada
  rationale: Bentuk perfektum dengan waw dalam rangkaian firman ilahi yang berorientasi ke masa depan paling wajar dinyatakan dengan bentuk futur dalam bahasa Indonesia.
- source_word: הַקֶּשֶׁת
  choice: busur
  rationale: Kata Ibrani secara harfiah berarti 'busur'; konteks menunjuk pada busur di langit. Makna kontekstual 'pelangi' dicantumkan dalam catatan kaki.
- source_word: בֶּעָנָן
  choice: di awan
  rationale: Mempertahankan bentuk tunggal dan relasi lokatif teks Ibrani.
- source_word: וּרְאִיתִיהָ
  choice: dan Aku akan melihatnya
  rationale: Menerjemahkan verba orang pertama tunggal beserta sufiks feminin yang mengacu kepada busur, tanpa menambahkan subordinasi temporal.
- source_word: לִזְכֹּר
  choice: untuk mengingat
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil; terjemahan ini langsung dan alami serta mempertahankan susunan teks.
- source_word: בְּרִית עוֹלָם
  choice: perjanjian kekal
  rationale: Menyatakan perjanjian yang berlangsung sepanjang zaman dengan ungkapan Indonesia yang baku dan jelas.
- source_word: בֵּין אֱלֹהִים וּבֵין
  choice: antara Allah dan
  rationale: Pengulangan idiomatis 'antara ... dan antara ...' dalam bahasa Ibrani disederhanakan menurut tata bahasa Indonesia.
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: setiap makhluk hidup
  rationale: Ungkapan ini menunjuk kepada makhluk bernyawa secara luas, bukan secara khusus kepada 'jiwa' manusia.
- source_word: בְּכָל בָּשָׂר
  choice: dari segala yang berdaging
  rationale: Frasa ini menerangkan cakupan atau jenis 'setiap makhluk hidup'. Pilihan ini mempertahankan citra 'daging' dan menghindari kesan bahwa makhluk hidup itu sekadar berada di tengah kumpulan lain.
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: di bumi
  rationale: Mengungkapkan lokasi universal makhluk hidup secara ringkas dan alami; 'bumi' lebih sesuai daripada 'tanah' dalam konteks perjanjian pasca-air bah.
theological_decisions:
- issue: Ingatan ilahi yang digambarkan secara antropomorfis
  choice: Aku akan melihatnya untuk mengingat
  alternative: Aku akan melihatnya dan bertindak sesuai dengan perjanjian-Ku
  rationale: Teks menyatakan bahwa Allah melihat dan mengingat. Ungkapan antropomorfis dan ketegangan teologisnya dipertahankan, bukan dijelaskan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kapitalisasi kata ganti ilahi dipakai sesuai kebiasaan luas penerbitan Alkitab Indonesia. Susunan kalimat dijaga dekat dengan sumber Ibrani sambil tetap dapat dipahami pembaca umum.
