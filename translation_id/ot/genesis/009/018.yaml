id: GEN.9.18
reference: Genesis 9:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽהְי֣וּ בְנֵי נֹ֗חַ הַ/יֹּֽצְאִים֙ מִן הַ/תֵּבָ֔ה שֵׁ֖ם וְ/חָ֣ם וָ/יָ֑פֶת וְ/חָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: id
  text: Anak-anak Nuh yang keluar dari bahtera itu ialah Sem, Ham, dan Yafet. Ham adalah ayah Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Bentuk wayyiqtol dari היה di sini berfungsi sebagai kopula lampau dalam narasi. Dalam bahasa Indonesia, konteks lampau sudah jelas, sehingga 'ialah' secara alami memperkenalkan identitas para anak Nuh tanpa menyiratkan perubahan keadaan.
- source_word: בְנֵי נֹחַ
  choice: Anak-anak Nuh
  rationale: Rangkaian konstruksi ini secara langsung berarti 'anak-anak Nuh'. Bentuk ulang 'anak-anak' wajar untuk menyatakan jamak dalam bahasa Indonesia.
- source_word: הַיֹּצְאִים
  choice: yang keluar
  rationale: Partisipel berartikel ini berfungsi atributif dan menerangkan anak-anak Nuh sebagai mereka yang keluar dari bahtera.
- source_word: מִן הַתֵּבָה
  choice: dari bahtera itu
  rationale: Preposisi מן diterjemahkan 'dari', sedangkan הַתֵּבָה menunjuk kepada bahtera yang sudah dikenal dalam konteks. 'Bahtera itu' menyampaikan sifat definit tersebut secara alami.
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: Sem, Ham, dan Yafet
  rationale: Nama-nama ini memakai bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia, dengan konjungsi alami sebelum unsur terakhir.
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: Ham adalah ayah Kanaan
  rationale: Klausa nominal ini secara eksplisit mengidentifikasi Ham sebagai ayah Kanaan. 'Adalah ayah' mempertahankan susunan dan penekanan informasionalnya secara wajar.
theological_decisions:
- issue: Keterangan genealogis tentang Ham dan Kanaan
  choice: Mempertahankan klausa tersendiri, 'Ham adalah ayah Kanaan,' dalam teks utama.
  alternative: Menggabungkannya secara kurang menonjol sebagai keterangan sisipan.
  rationale: Teks Ibrani secara eksplisit menyoroti hubungan Ham dengan Kanaan sebagai persiapan bagi kisah berikutnya. Terjemahan mempertahankan fungsi naratif itu tanpa menambahkan kesimpulan teologis atau etnis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bahtera' dipertahankan sebagai istilah Alkitab yang luas dipahami; 'ialah' digunakan untuk identifikasi daftar, sedangkan 'adalah' cocok untuk klausa genealogis berikutnya.
