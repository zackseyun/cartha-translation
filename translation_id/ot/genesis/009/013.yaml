id: GEN.9.13
reference: Genesis 9:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: id
  text: Busur-Ku telah Kutaruh di awan[a], dan itu akan menjadi tanda perjanjian antara Aku dan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelangi-Ku.” Secara harfiah, bahasa Ibrani berbunyi “busur-Ku,” dengan memakai kata biasa untuk busur; dalam konteks ini, yang dimaksud ialah pelangi di awan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: busur-Ku
  rationale: קֶשֶׁת adalah kata biasa untuk busur, termasuk sebagai senjata. Dalam konteks awan, yang dimaksud ialah pelangi, tetapi teks utama mempertahankan citra harfiah Ibrani; makna kontekstual dijelaskan dalam catatan kaki.
- source_word: נָתַתִּי
  choice: telah Kutaruh
  rationale: נתן dapat berarti memberi, menaruh, atau menetapkan. 'Telah Kutaruh' alami dalam bahasa Indonesia dan menyampaikan tindakan yang sudah dilakukan dengan relevansi kini.
- source_word: בֶּעָנָן
  choice: di awan
  rationale: Nomina Ibrani berbentuk tunggal. 'Di awan' mempertahankan bentuk itu dan wajar untuk menggambarkan tempat tampaknya busur tersebut.
- source_word: וְהָיְתָה
  choice: dan itu akan menjadi
  rationale: Dalam konteks ini bentuk tersebut menyatakan hasil atau fungsi ke depan dari busur yang telah ditaruh sebagai tanda.
- source_word: לְאוֹת
  choice: tanda
  rationale: אוֹת berarti tanda atau penanda. Frasa 'menjadi tanda' merupakan ungkapan Indonesia yang alami.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Walaupun tanpa artikel dalam bahasa Ibrani, konteks langsung sudah mengidentifikasi perjanjian yang dimaksud; bahasa Indonesia tidak memerlukan artikel definit.
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: antara Aku dan bumi
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau bumi. Cakupan universal kisah air bah mendukung 'bumi'.
theological_decisions:
- issue: Rujukan קַשְׁתִּי dalam konteks perjanjian
  choice: Citra harfiah 'busur-Ku' dipertahankan dalam teks utama dan dipahami dalam konteks sebagai pelangi.
  alternative: '''pelangi-Ku'''
  rationale: Bahasa Ibrani memakai kata biasa untuk 'busur'. Mempertahankannya menjaga citra sumber dan kemungkinan gema busur sebagai senjata, tanpa menyangkal bahwa fenomena yang dirujuk dalam awan ialah pelangi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan 'telah Kutaruh' dipilih agar alami sekaligus mempertahankan penekanan orang pertama. Huruf kapital pada pronomina ilahi mengikuti kebiasaan ejaan Alkitab bahasa Indonesia.
