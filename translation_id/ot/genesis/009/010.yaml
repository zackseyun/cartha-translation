  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: id
  text: 'dan dengan setiap makhluk hidup[a] yang bersama kamu: burung-burung, ternak, dan segala binatang liar di bumi yang bersama kamu, dari semua yang keluar dari bahtera, bahkan segala binatang liar di bumi.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “setiap jiwa yang hidup”; dalam konteks ini maksudnya setiap makhluk bernyawa.'
    reason: lexical_alternative
  - marker: b
    text: 'Bagian penutup ayat ini sulit dalam bahasa Ibrani. Secara lebih harfiah: “dari semua yang keluar dari bahtera, bagi segala binatang liar di bumi.” Frasa terakhir juga dapat dipahami sebagai pengulangan penjelas: “yakni segala binatang liar di bumi.”'
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: setiap makhluk hidup
  rationale: Dalam konteks ini frasa tersebut menunjuk secara luas kepada makhluk bernyawa, khususnya hewan. “Makhluk hidup” alami dalam bahasa Indonesia dan tidak memberi kesan bahwa נֶפֶשׁ di sini harus berarti jiwa sebagai bagian tak berwujud.
- source_word: בָּעוֹף
  choice: burung-burung
  rationale: עוֹף dapat mencakup makhluk yang terbang, tetapi “burung-burung” merupakan padanan Indonesia yang paling wajar dalam daftar jenis hewan ini.
- source_word: בַּבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה di sini mengacu pada hewan darat peliharaan; “ternak” mempertahankan perbedaannya dari חַיַּת הָאָרֶץ.
- source_word: חַיַּת הָאָרֶץ
  choice: binatang liar di bumi
  rationale: Ungkapan ini menunjuk pada hewan darat liar, berbeda dari burung dan ternak. “Binatang liar” lebih tepat daripada istilah umum “binatang”.
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה לְכֹל חַיַּת הָאָרֶץ
  choice: dari semua yang keluar dari bahtera sampai kepada segala binatang liar di bumi
  rationale: Terjemahan ini mempertahankan kedua preposisi Ibrani מִן dan לְ serta pengulangan kategori hewan liar. Karena susunan penutupnya sulit dan padat, alternatif yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan hewan yang turut dalam perjanjian
  choice: Semua jenis hewan yang bersama Nuh dicakup, termasuk burung, ternak, dan binatang liar.
  alternative: Frasa penutup dapat dipahami sebagai pengulangan penjelas yang secara khusus merujuk kembali kepada semua hewan yang keluar dari bahtera.
  rationale: Teks menyebut kategori-kategori hewan secara luas, tetapi sintaksis penutupnya tidak cukup jelas untuk memastikan apakah לְ menyatakan batas cakupan atau berfungsi secara resumtif. Terjemahan utama dan catatan kaki menjaga ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” mengikuti sapaan jamak kepada Nuh dan anak-anaknya dalam konteks dekat; “bahtera” dipertahankan sebagai istilah Alkitab yang tetap umum dipahami. Tanda pisah membantu pembaca mengikuti sintaksis Ibrani yang padat tanpa menghapus kesulitannya.
