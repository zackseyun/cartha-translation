base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: id
  text: Ketakutan dan kegentaran terhadapmu akan menimpa setiap binatang di bumi, setiap burung di langit, segala yang merayap di tanah, dan semua ikan di laut. Semuanya telah diserahkan ke dalam tanganmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “diserahkan ke dalam tanganmu” berarti ditempatkan di bawah kuasa atau kendalimu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: Rasa takut dan gentar terhadapmu
  rationale: Kedua nomina menyatakan ketakutan yang ditimbulkan oleh manusia pada makhluk lain. Pasangan “takut dan gentar” mempertahankan intensifikasi, sedangkan “terhadapmu” membuat relasi genitifnya jelas dan alami dalam bahasa Indonesia.
- source_word: יִהְיֶה עַל
  choice: akan meliputi
  rationale: Secara harfiah berarti “akan ada/berada atas.” “Akan meliputi” mempertahankan gambaran ketakutan yang menimpa seluruh kelompok hewan tanpa terdengar kaku.
- source_word: כָּל חַיַּת הָאָרֶץ
  choice: setiap binatang di bumi
  rationale: Dalam konteks ini חַיָּה menunjuk pada binatang darat. “Binatang” tidak mempersempit makna hanya kepada satwa liar, dan “setiap” mempertahankan daya distributif כָּל.
- source_word: כָּל עוֹף הַשָּׁמָיִם
  choice: setiap burung di langit
  rationale: עוֹף secara kontekstual wajar diterjemahkan “burung,” sedangkan “langit” merupakan padanan Indonesia yang alami bagi שָׁמַיִם dalam frasa ini.
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: segala yang bergerak di tanah
  rationale: רמשׂ dapat menyatakan gerak merayap atau bergerak dekat permukaan. “Bergerak” menghindari pembatasan yang terlalu sempit, sementara “tanah” membedakan אֲדָמָה dari אֶרֶץ sebelumnya. Bentuk Ibrani frasa ini tidak biasa, tetapi cakupannya tetap dipertahankan tanpa pembetulan spekulatif.
- source_word: כָל דְּגֵי הַיָּם
  choice: semua ikan di laut
  rationale: Padanan langsung dan alami yang mempertahankan cakupan menyeluruh dari כָּל.
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: Semuanya telah diserahkan ke dalam tanganmu
  rationale: Bentuk pasif perfektum menyatakan tindakan pemberian yang telah berlaku. Metafora “ke dalam tangan” dipertahankan karena menyiratkan kuasa atau kendali tanpa menjabarkannya secara berlebihan.
theological_decisions:
- issue: Kuasa manusia atas hewan sesudah air bah
  choice: Mempertahankan ungkapan bahwa semua hewan telah diserahkan ke dalam tangan manusia.
  alternative: Menguraikannya menjadi “ditempatkan di bawah kuasamu” atau melunakkan unsur kekuasaan.
  rationale: Ungkapan Ibrani menunjukkan bahwa hewan ditempatkan dalam kuasa manusia, tetapi metaforanya sendiri sebaiknya dipertahankan agar terjemahan tidak memperluasnya menjadi klaim doktrinal atau etis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal “-mu” mengikuti sapaan Ibrani jamak kepada Nuh dan anak-anaknya sebagai satu kelompok; bahasa Indonesia tidak membedakan jumlah pada bentuk ini. Kalimat dipecah menjadi dua agar daftar panjang tetap jelas.
