  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: id
  text: Namun, kalian tidak boleh memakan daging beserta nyawanya, yaitu darahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, daging beserta nyawanya—darahnya—tidak boleh kalian makan.”'
    reason: Susunan Ibrani ringkas dan menempatkan “nyawanya” serta “darahnya” berdampingan tanpa kata yang setara dengan “yaitu”.
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Kata ini membatasi izin luas untuk memakan hewan dalam ayat sebelumnya. “Namun” menyatakan pertentangan sekaligus pengecualian secara wajar dalam bahasa Indonesia.
- source_word: בָּשָׂר
  choice: daging
  rationale: Dalam konteks makanan, “daging” lebih alami daripada “tubuh” atau “jasad”, sambil tetap menyampaikan makna konkret בָּשָׂר.
- source_word: בְּנַפְשׁוֹ
  choice: beserta nyawanya
  rationale: נֶפֶשׁ di sini menunjuk pada daya hidup makhluk, bukan secara khusus pada konsep teologis tentang jiwa yang tak berwujud. “Nyawa” mempertahankan hubungan erat antara hidup dan darah.
- source_word: דָמוֹ
  choice: darahnya
  rationale: Padanan langsung ini mempertahankan penyamaan atau penjelasan ringkas antara nyawa dan darah dalam susunan Ibrani.
- source_word: לֹא תֹאכֵלוּ
  choice: kalian tidak boleh memakan
  rationale: Bentuk negatif ini menyatakan larangan. “Tidak boleh” jelas dan alami dalam bahasa Indonesia modern, sedangkan “kalian” memperlihatkan bahwa sapaan Ibraninya berbentuk jamak.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam kaitannya dengan darah
  choice: Diterjemahkan “nyawa”, bukan “jiwa”
  alternative: “jiwa” atau “hidup”
  rationale: Konteksnya membicarakan kehidupan makhluk yang berkaitan dengan darah. “Nyawa” menghindari pemasukan gagasan antropologis yang tidak dituntut oleh ayat ini.
- issue: Hubungan sintaksis antara נַפְשׁוֹ dan דָמוֹ
  choice: 'Dinyatakan sebagai penjelasan: “nyawanya, yaitu darahnya”'
  alternative: 'Apposisi langsung: “nyawanya—darahnya”'
  rationale: Teks Ibrani menempatkan kedua unsur secara berdampingan tanpa kata penghubung eksplisit. “Yaitu” membuat hubungan apposisional itu mudah dipahami, sementara catatan kaki mempertahankan bentuk yang lebih dekat dengan keringkasan dan ambiguitas sintaksis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menandai sapaan jamak dengan jelas; “memakan daging” dipilih sebagai ungkapan alami dalam konteks larangan makanan.
