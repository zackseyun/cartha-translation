source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: id
  text: 'Lalu ia berkata,


    “Terpujilah TUHAN, Allah Sem!

    Biarlah Kanaan menjadi budak mereka.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata ganti Ibrani di sini berbentuk jamak; siapa yang dimaksud dengan “mereka” tidak dinyatakan secara tegas.
    reason: Menjaga bentuk jamak sumber sekaligus mengakui ketidakjelasan rujukannya.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Dalam berkat yang diarahkan kepada Allah, bentuk pasif Ibrani ini secara alami menyatakan pujian kepada-Nya, bukan permohonan agar Allah diberkati oleh pihak lain.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang membedakan nama ilahi YHWH dengan huruf kapital.
- source_word: עֶבֶד
  choice: budak
  rationale: Kata Ibrani dapat berarti hamba atau budak; dalam konteks penaklukan dan rumusan kutuk pada ayat sebelumnya, 'budak' menyampaikan kekuatan istilah dengan lebih tepat.
- source_word: לָמוֹ
  choice: mereka
  rationale: Bentuk pronomina puitis ini secara gramatikal berjumlah jamak; terjemahan mempertahankan bentuk jamaknya tanpa menetapkan rujukan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rujukan pronomina לָמוֹ
  choice: mereka
  alternative: dia/nya
  rationale: Teks Masoret memakai bentuk jamak. Meskipun Sem adalah nomina tunggal terdekat dan sejumlah penafsiran mengaitkannya secara kolektif dengan Sem atau keturunannya, terjemahan tidak mengubah bentuk jamak menjadi tunggal.
- issue: Makna berkat bagi YHWH
  choice: Terpujilah TUHAN
  alternative: Diberkatilah TUHAN
  rationale: Ungkapan ini menyatakan pengakuan dan pujian kepada Allah; pilihan ini alami dalam bahasa Indonesia dan tidak menggeser pujian itu menjadi tindakan manusia yang menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Bentuk puitis dipertahankan melalui susunan baris dan seruan singkat; istilah 'budak' dipilih karena konteks kutuk dan penundukan.
