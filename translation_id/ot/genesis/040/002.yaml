  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: id
  text: Lalu Firaun murka kepada kedua pejabatnya[a], yaitu kepala juru minuman dan kepala juru roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedua pejabat istananya”; istilah Ibrani ini dalam konteks tertentu juga dapat berarti “sida-sida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: Lalu ... murka
  rationale: Kata kerja קצף menyatakan kemarahan. “Murka” merupakan padanan naratif yang alami dan bermartabat bagi kemarahan seorang raja, tanpa perlu menambahkan intensitas seperti “sangat murka”.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: שְׁנֵי סָרִיסָיו
  choice: kedua pejabatnya
  rationale: סָרִיס dapat berarti pejabat istana atau sida-sida. Dalam konteks ini kedua orang tersebut memegang jabatan kerajaan, sehingga “pejabat” menyampaikan fungsi mereka tanpa memastikan keadaan fisik yang tidak dituntut oleh teks.
- source_word: שַׂר הַמַּשְׁקִים
  choice: kepala juru minuman
  rationale: שַׂר menunjuk pemimpin atau kepala, sedangkan הַמַּשְׁקִים menunjuk para penyaji minuman. “Kepala juru minuman” jelas, ringkas, dan sesuai dengan jabatan istana yang dimaksud.
- source_word: שַׂר הָאֹפִים
  choice: kepala juru roti
  rationale: שַׂר menunjuk kepala kelompok dan הָאֹפִים para pembuat roti. “Kepala juru roti” merupakan sebutan jabatan yang alami dalam bahasa Indonesia Alkitabiah modern.
- source_word: עַל ... עַל ... וְעַל
  choice: kepada ... yaitu ... dan ...
  rationale: Sesudah verba kemarahan, עַל menandai sasaran murka. Pengulangan Ibrani memperkenalkan dua pejabat lalu merinci identitas mereka; “yaitu” menjadikan hubungan aposisional itu jelas dan mencegah kesan bahwa ada empat orang.
