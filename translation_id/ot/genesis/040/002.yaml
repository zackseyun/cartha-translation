translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” mengalirkan rangkaian narasi; “murka” cocok dengan konteks kerajaan. Susunan dengan “yaitu” memperjelas bahwa kepala juru minuman dan kepala juru roti adalah kedua pejabat tersebut.
