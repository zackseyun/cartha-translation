  source_fidelity: Teks secara tepat menyampaikan וַיִּקְצֹף sebagai “murka,” mempertahankan Firaun sebagai subjek, dan memahami שְׁנֵי סָרִיסָיו secara kontekstual sebagai dua pejabat. Frasa aposisional “yaitu kepala juru minuman dan kepala juru roti” dengan tepat menjelaskan bahwa kedua pemegang jabatan itu adalah dua pejabat yang dimaksud. Nuansa alternatif סָרִיס sebagai “sida-sida” dipelihara dalam catatan tanpa memaksakannya pada teks utama.
