translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk 'aku' mengikuti tuturan langsung Yusuf. Terjemahan mempertahankan penegasan Ibrani dan citra konkret 'lubang', dengan alternatif leksikal dijelaskan dalam catatan kaki.
