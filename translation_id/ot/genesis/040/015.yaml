  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: id
  text: Sebab aku benar-benar diculik dari negeri orang Ibrani,[a] dan di sini pun aku tidak melakukan apa pun yang menjadi alasan bagi mereka untuk memasukkan aku ke dalam lubang ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku benar-benar dicuri” atau “aku dicuri pergi.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “lubang” dapat merujuk pada tempat tahanan atau sel penjara.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan Yusuf kepada juru minuman dengan daya kausal yang alami dalam bahasa Indonesia.
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: aku benar-benar diculik
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan pasif tersebut; 'diculik' secara alami menyatakan bahwa seseorang dibawa pergi secara paksa.
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: dari negeri orang Ibrani
  rationale: Mempertahankan sebutan etnis Ibrani tanpa menafsirkan frasa itu sebagai nama wilayah politis yang pasti.
- source_word: וְגַם פֹּה
  choice: dan di sini pun
  rationale: 'Menjaga penekanan aditif: selain diculik dari tempat asalnya, Yusuf juga tidak bersalah di tempat ini.'
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: aku tidak melakukan apa pun
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan penyangkalan menyeluruh.
- source_word: כִּי שָׂמוּ אֹתִי
  choice: yang membuat mereka patut memasukkan aku
  rationale: Dalam hubungan dengan penyangkalan sebelumnya, klausa ini menyatakan bahwa tidak ada perbuatan yang memberikan alasan layak bagi pemenjaraan Yusuf.
- source_word: בַּבּוֹר
  choice: ke dalam lubang itu
  rationale: Mempertahankan gambaran harfiah בּוֹר sebagai lubang, sementara catatan kaki menjelaskan fungsi kontekstualnya sebagai tempat tahanan.
