  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: id
  text: Tiga hari lagi, Firaun akan mengangkat kepalamu[a] dan mengembalikanmu ke jabatanmu. Engkau akan menyerahkan cawan Firaun ke tangannya seperti kebiasaan semula, ketika engkau menjadi juru minumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengangkat kepalamu”. Di sini ungkapan itu menunjukkan bahwa Firaun akan memperhatikan dan memulihkan kedudukanmu; kata-kata yang sama dipakai dengan kelanjutan yang berlawanan dalam ayat 19.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Tiga hari lagi
  rationale: Ungkapan ini menunjuk pada rentang waktu yang masih tersisa sebelum peristiwa itu dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: akan mengangkat kepalamu
  rationale: Terjemahan harfiah mempertahankan idiom Ibrani dan kaitan sastrawinya dengan pemakaian yang berlawanan dalam ayat 19; klausa berikut menjelaskan bahwa maknanya di sini menguntungkan.
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: dan mengembalikanmu ke jabatanmu
  rationale: כֵּן di sini mengacu pada kedudukan atau tugas resmi yang sebelumnya dipegang dalam istana.
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: Engkau akan menyerahkan cawan Firaun ke tangannya
  rationale: נתן dapat berarti memberi atau menaruh; 'menyerahkan ... ke tangannya' menyampaikan tindakan pelayanan konkret secara wajar dan tetap mempertahankan citra sumber.
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: seperti kebiasaan semula
  rationale: מִשְׁפָּט dalam konteks ini berarti tata cara atau kebiasaan yang telah berlaku, bukan keputusan hukum.
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: ketika engkau menjadi juru minumnya
  rationale: מַשְׁקֶה menunjuk pada jabatan resmi pelayan minuman raja; 'juru minum' merupakan padanan Indonesia yang ringkas dan jelas.
