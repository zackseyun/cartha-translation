  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: id
  text: dan di dalam keranjang yang paling atas ada segala macam makanan untuk Firaun, hasil buatan tukang roti,[a] dan burung-burung sedang memakan makanan itu dari keranjang di atas kepala saya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pekerjaan tukang roti,” yaitu makanan yang dibuat oleh tukang roti untuk Firaun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: dan di dalam keranjang yang paling atas
  rationale: עֶלְיוֹן menunjukkan keranjang yang berada paling atas; frasa ini alami dalam bahasa Indonesia dan mempertahankan hubungan ruangnya.
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: ada segala macam makanan untuk Firaun
  rationale: מִכֹּל bersama nomina kolektif מַאֲכַל menyatakan keragaman. Kata 'ada' melengkapi klausa tanpa verba agar wajar dalam bahasa Indonesia.
- source_word: מַעֲשֵׂה אֹפֶה
  choice: hasil buatan tukang roti
  rationale: Secara harfiah berarti 'pekerjaan tukang roti' dan dalam konteks mengacu pada makanan atau hasil yang dibuat oleh tukang roti. Pilihan ini jelas tanpa mempersempitnya menjadi jenis penganan tertentu.
- source_word: וְהָעוֹף
  choice: dan burung-burung
  rationale: עוֹף dapat digunakan secara kolektif untuk burung; bentuk jamak Indonesia paling sesuai dengan konteks.
- source_word: אֹכֵל
  choice: sedang memakan
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung dalam adegan mimpi.
- source_word: אֹתָם
  choice: makanan itu
  rationale: Sufiks objek jamak merujuk pada berbagai makanan tadi. Pengulangan nomina lebih alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: מִן הַסַּל
  choice: dari keranjang
  rationale: מִן menandai sumber atau tempat asal tindakan makan.
- source_word: מֵעַל רֹאשִׁי
  choice: di atas kepala saya
  rationale: מֵעַל menyatakan posisi di atas; terjemahan ini tidak mengharuskan keranjang bersentuhan langsung dengan kepala.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah 'Firaun' mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; 'saya' dipakai untuk tuturan langsung yang sopan kepada seorang pejabat tinggi.
