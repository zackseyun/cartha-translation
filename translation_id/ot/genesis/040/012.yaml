  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: id
  text: 'Lalu Yusuf berkata kepadanya, “Inilah tafsirnya: ketiga cabang itu adalah tiga hari.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu ... berkata” alami dalam bahasa Indonesia modern dan mempertahankan daya urutannya.
- source_word: לוֹ
  choice: kepadanya
  rationale: Objek pronominal dinyatakan dalam bahasa Ibrani; terjemahan mempertahankan pronomina tanpa mengganti dengan rujukan eksplisit.
- source_word: פִּתְרֹנוֹ
  choice: tafsirnya
  rationale: Merujuk pada penafsiran gambaran dalam mimpi; “tafsirnya” tepat, ringkas, dan alami dalam konteks ini.
- source_word: שְׁלֹשֶׁת הַשָּׂרִגִים
  choice: ketiga cabang
  rationale: Konstruksi bilangan dan nomina tentu diterjemahkan secara alami sebagai “ketiga cabang”, sementara pengulangan bilangan tetap dipertahankan dalam penjelasannya.
- source_word: הַשָּׂרִגִים
  choice: cabang
  rationale: Dalam konteks pokok anggur dalam mimpi, istilah ini menunjuk pada cabang atau sulur; “cabang” jelas dan tidak terlalu mempersempit makna.
- source_word: יָמִים
  choice: hari
  rationale: Nomina waktu ini diterjemahkan langsung karena tafsir tersebut menyamakan lambang dalam mimpi dengan jangka waktu.
- source_word: הֵם
  choice: itu adalah
  rationale: Pronomina mandiri menandai persamaan predikatif; “itu adalah” mempertahankan penunjukan dan hubungan persamaan secara wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur penafsiran simbolis serta pengulangan angka tiga dipertahankan. Tidak diperlukan catatan kaki karena “cabang” cukup jelas dalam konteks pokok anggur, meskipun secara leksikal “sulur” juga mungkin.
