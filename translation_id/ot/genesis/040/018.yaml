  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: id
  text: 'Yusuf menjawab dan berkata, “Inilah tafsirnya: ketiga keranjang itu adalah tiga hari.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Dalam dialog naratif, ענה lazim memperkenalkan suatu jawaban; “menjawab” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Ungkapan ini dipertahankan bersama “menjawab” karena teks Ibrani memakai rumus dialog ganda ויען...ויאמר; dalam bahasa Indonesia bentuk “menjawab dan berkata” tetap jelas dan dekat dengan struktur sumber.
- source_word: פִּתְרֹנוֹ
  choice: tafsirnya
  rationale: Dalam konteks mimpi, פִּתְרוֹן menunjuk pada penafsiran mimpi. “Tafsirnya” ringkas, alami, dan mempertahankan acuan pronominal pada mimpi tersebut.
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: ketiga keranjang itu
  rationale: סַל berarti “keranjang”. Bentuk “ketiga ... itu” secara alami menyampaikan jumlah serta ketakrifan frasa Ibrani.
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: adalah tiga hari
  rationale: Klausa identifikasi tanpa verba dalam bahasa Ibrani diterjemahkan dengan “adalah”, sehingga hubungan simbolis dinyatakan langsung tanpa menambahkan verba interpretatif seperti “berarti”.
