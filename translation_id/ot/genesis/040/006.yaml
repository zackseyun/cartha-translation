  text: Joseph came to them in the morning and saw them[a], and behold, they were troubled.
translation:
  language: id
  text: Pada pagi hari, Yusuf datang kepada mereka dan melihat mereka, dan ternyata mereka sedang murung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gelisah”, “berwajah muram”, atau “susah hati”. Kata Ibrani ini menggambarkan keadaan terganggu atau murung yang tampak dari luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: Yusuf datang kepada mereka
  rationale: Menjaga gerak menuju kedua tahanan; 'datang kepada mereka' alami dalam narasi Indonesia dan tidak memperinci tempat melebihi teks.
- source_word: בַּבֹּקֶר
  choice: Pagi harinya
  rationale: Ungkapan waktu yang alami dan menghubungkan peristiwa ini dengan konteks naratif sebelumnya.
- source_word: וַיַּרְא אֹתָם
  choice: Ketika ia melihat mereka
  rationale: ראה dengan penanda objek langsung menyatakan penglihatan langsung. Susunan temporal menghasilkan kalimat Indonesia yang wajar tanpa mengubah urutan peristiwa.
- source_word: וְהִנָּם
  choice: tampaklah bahwa mereka
  rationale: Partikel presentatif menarik perhatian kepada keadaan yang Yusuf lihat. 'Tampaklah bahwa' mempertahankan daya penunjuk itu secara lebih alami daripada seruan harfiah 'lihatlah' dalam konteks ini.
- source_word: זֹעֲפִים
  choice: sedang murung
  rationale: Partisip ini menggambarkan keadaan batin yang tampak pada wajah atau sikap mereka. 'Murung' mencakup kemuraman dan kesusahan yang terlihat tanpa mempersempit makna menjadi kemarahan.
