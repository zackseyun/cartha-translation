  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: id
  text: Lalu ia bertanya kepada para pejabat Firaun[a] yang ditahan bersamanya di rumah tuannya, “Mengapa wajah kalian muram hari ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kasim Firaun”; istilah Ibrani ini dapat merujuk kepada orang kasim secara harfiah ataupun, secara lebih umum, kepada pejabat istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Lalu ia bertanya
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: סְרִיסֵי פַרְעֹה
  choice: para pejabat Firaun
  rationale: סָרִיס dapat berarti orang kasim secara harfiah atau pejabat istana. Konteks menonjolkan jabatan mereka; alternatif yang lebih khusus dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: yang ditahan bersamanya
  rationale: Ungkapan ini menunjukkan bahwa para pejabat itu berada bersama Yusuf dalam tahanan. Bentuk pasif “ditahan” alami dan jelas dalam bahasa Indonesia.
- source_word: בֵּית אֲדֹנָיו
  choice: di rumah tuannya
  rationale: Frasa ini merujuk kepada rumah majikan Yusuf dan mempertahankan istilah “rumah” dari teks Ibrani tanpa menambahkan identifikasi yang tidak dinyatakan dalam ayat.
- source_word: לֵאמֹר
  choice: dinyatakan melalui tanda baca sebelum kutipan langsung
  rationale: Infinitif pengutip ini memperkenalkan ucapan langsung. Dalam bahasa Indonesia modern, fungsinya paling alami disampaikan dengan tanda koma dan kutipan, tanpa kata “katanya” yang berlebihan setelah verba “bertanya”.
- source_word: פְּנֵיכֶם רָעִים
  choice: wajah kalian muram
  rationale: Secara harfiah berarti “wajah kalian buruk,” tetapi merupakan idiom bagi raut sedih atau susah. “Muram” mempertahankan fokus pada ekspresi wajah.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal yang langsung dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina “ia” mempertahankan rujukan pronominal teks, sedangkan “kalian” sesuai dengan sapaan orang kedua jamak kepada dua pejabat. Struktur pengutip Ibrani tidak diterjemahkan secara kaku agar kalimat tetap alami.
