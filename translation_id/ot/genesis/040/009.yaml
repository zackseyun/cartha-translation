  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: id
  text: Lalu kepala juru minuman itu menceritakan mimpinya kepada Yusuf dan berkata kepadanya, “Dalam mimpiku, lihatlah, ada pohon anggur di hadapanku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dalam mimpiku ada pohon anggur di hadapanku.” Bahasa Ibrani memakai penanda perhatian “lihatlah” (וְהִנֵּה) untuk memperkenalkan gambaran mimpi itu secara hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: menceritakan
  rationale: Bentuk piel dari ספר di sini berarti menceritakan atau menuturkan; 'menceritakan' alami dengan objek 'mimpinya'.
- source_word: שַׂר הַמַּשְׁקִים
  choice: kepala juru minuman
  rationale: Frasa ini menunjuk pejabat istana yang mengepalai penyajian minuman; pilihan ini tepat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: אֶת חֲלֹמוֹ
  choice: mimpinya
  rationale: Nomina dengan akhiran orang ketiga tunggal maskulin secara langsung berarti 'mimpinya'.
- source_word: לְיוֹסֵף
  choice: kepada Yusuf
  rationale: Preposisi ל menandai penerima cerita, dan nama יוֹסֵף ditransliterasikan sebagai Yusuf sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר לוֹ
  choice: Katanya kepadanya
  rationale: Ungkapan ini mempertahankan unsur eksplisit 'kepadanya', sedangkan 'katanya' menghasilkan narasi Indonesia yang alami dan menghindari pengulangan 'berkata' setelah 'menceritakan'.
- source_word: בַּחֲלוֹמִי
  choice: Dalam mimpiku
  rationale: Padanan idiomatis dan langsung bagi frasa berpreposisi yang membuka laporan mimpi.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Penanda perhatian הִנֵּה menghadirkan gambaran mimpi secara hidup; 'lihatlah' mempertahankan fungsi deiktisnya tanpa memakai bentuk arkais.
- source_word: גֶפֶן
  choice: pohon anggur
  rationale: Dalam bahasa Indonesia, 'pohon anggur' merupakan sebutan umum dan jelas untuk tanaman anggur, meskipun secara botani berupa tanaman merambat.
- source_word: לְפָנַי
  choice: ada ... di hadapanku
  rationale: Frasa ini secara harfiah berarti 'di hadapanku'; kopula eksistensial 'ada' ditambahkan agar kalimat Indonesia lengkap dan alami.
