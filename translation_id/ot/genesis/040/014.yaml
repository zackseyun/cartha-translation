revisions:
- from: Tetapi, ingatlah aku[a] ketika keadaanmu sudah baik. Tolong tunjukkan kebaikan kepadaku dengan menyebutkan aku kepada Firaun dan mengeluarkan aku dari rumah ini.[b]
  to: Namun, jika kamu mengingat aku[a] ketika keadaanmu membaik, tolong tunjukkanlah kebaikan kepadaku; sebutkanlah aku kepada Firaun dan keluarkanlah aku dari rumah ini.[b]
  rationale: Revisi memulihkan syarat yang dinyatakan dalam teks Ibrani, menyatakan waktu pemulihan sebagai peristiwa yang akan terjadi, dan memperjelas tiga permohonan Yusuf tanpa menambahkan penafsiran. Catatan [a] tetap ditempatkan pada 'aku' untuk menjelaskan unsur אִתְּךָ yang tidak diterjemahkan secara harfiah, sedangkan catatan [b] tetap berjangkar pada 'rumah ini'.
