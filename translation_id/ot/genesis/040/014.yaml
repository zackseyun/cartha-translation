base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: id
  text: Namun, jika kamu mengingat aku[a] ketika keadaanmu membaik, tolong tunjukkanlah kebaikan kepadaku; sebutkanlah aku kepada Firaun dan keluarkanlah aku dari rumah ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, Ibrani memuat “bersamamu”; ungkapan ini menegaskan permintaan Yusuf agar juru minuman tetap mengingatnya.
    reason: lexical_clarification
  - marker: b
    text: “Rumah” di sini mengacu pada tempat Yusuf ditahan.
    reason: contextual_clarification
lexical_decisions:
- source_word: כִּי אִם
  choice: Tetapi
  rationale: Gabungan ini memberi peralihan yang kuat menuju permohonan Yusuf. Dalam konteks ini, “Tetapi” alami dalam bahasa Indonesia; unsur pengandaian atau pembatasan tampak dari keseluruhan permohonan dan dapat juga dipahami sebagai “hanya saja” atau “jika.”
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: ingatlah aku
  rationale: Ungkapan Ibrani secara harfiah memuat “bersamamu,” tetapi maksud idiomatisnya ialah agar juru minuman tetap mengingat Yusuf. “Ingatlah aku” menyampaikan maknanya secara wajar tanpa ungkapan Indonesia yang janggal.
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: ketika keadaanmu sudah baik
  rationale: Klausa ini menunjuk pada saat keadaan juru minuman membaik setelah kedudukannya dipulihkan. Pilihan ini mempertahankan nuansa waktu dan kesejahteraan.
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: Tolong tunjukkan kebaikan kepadaku
  rationale: נָא dinyatakan dengan “tolong,” sedangkan חֶסֶד dalam permohonan antarpribadi ini paling tepat dipahami sebagai kebaikan nyata, tanpa memaksakan pengertian perjanjian formal.
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: dengan menyebutkan aku kepada Firaun
  rationale: Bentuk kausatif זכר berarti membawa Yusuf kepada perhatian Firaun. “Menyebutkan aku kepada Firaun” alami dan tepat dalam bahasa Indonesia.
- source_word: וְהוֹצֵאתַנִי
  choice: dan mengeluarkan aku
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan Yusuf keluar. “Mengeluarkan aku” mempertahankan daya kausatif itu.
- source_word: מִן הַבַּיִת הַזֶּה
  choice: dari rumah ini
  rationale: Teks Ibrani memakai kata “rumah.” Terjemahan mempertahankannya, sementara catatan menjelaskan bahwa yang dimaksud ialah tempat penahanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan yang hormat dan mendesak. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan istilah konkret “rumah” dari teks Ibrani.
