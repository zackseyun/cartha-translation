  verdict: revise
  source_fidelity: Revisi diperlukan karena teks utama menghilangkan unsur kondisional כִּי אִם ('namun/tetapi, jika'). Bentuk 'ingatlah' menjadikannya perintah langsung, sedangkan Ibrani membingkai permohonan itu secara bersyarat. 'Ketika keadaanmu sudah baik' juga lebih baik dibuat prospektif ('membaik'), sesuai konteks pemulihan juru minuman yang belum terjadi.
  naturalness: 'Teks revisi menggunakan susunan Indonesia baku yang jelas: kondisi permohonan diikuti tiga tindakan yang dimohonkan. Memisahkan ''sebutkanlah'' dan ''keluarkanlah'' dari frasa ''dengan'' menghindari kesan bahwa kedua tindakan itu hanya cara untuk ''menunjukkan kebaikan''.'
  terminology: '''Kebaikan'' tepat untuk חֶסֶד dalam permohonan antarpribadi ini. ''Firaun'' dan ''rumah ini'' dipertahankan; catatan pada ''rumah'' secara tepat menjelaskan rujukan kontekstual tanpa menggantikan kata konkret Ibrani dalam teks utama.'
  issues:
