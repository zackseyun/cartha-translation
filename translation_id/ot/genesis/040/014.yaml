  - severity: medium
    issue: '''Sudah baik'' dapat terdengar sebagai keadaan yang telah terjadi.'
    rationale: Klausa יִיטַב menunjuk saat keadaan juru minuman akan membaik/pulih; 'ketika keadaanmu membaik' menyampaikan orientasi prospektif itu.
  - severity: medium
    issue: Koordinasi permohonan kurang jelas dalam 'tunjukkan kebaikan ... dengan menyebutkan ... dan mengeluarkan'.
