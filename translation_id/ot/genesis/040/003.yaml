  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: id
  text: Lalu ia menahan mereka di rumah kepala pengawal[a], di rumah tahanan[b], tempat Yusuf dikurung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepala para algojo” atau “kepala para penyembelih.”
    reason: lexical_alternative
  - marker: b
    text: Atau “penjara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: Lalu ia menahan mereka
  rationale: Dalam konteks penahanan, נָתַן dengan בְּמִשְׁמַר berarti menempatkan seseorang dalam tahanan. Ungkapan 'menahan mereka' alami dalam bahasa Indonesia dan menyampaikan tindakan serta status tahanan secara ringkas.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: di rumah kepala pengawal
  rationale: Gelar שַׂר הַטַּבָּחִים secara harfiah berkaitan dengan kepala para penyembelih atau algojo, tetapi dalam konteks istana Mesir berfungsi sebagai gelar pejabat. 'Kepala pengawal' merupakan padanan yang jelas dan wajar tanpa menghilangkan alternatif harfiahnya, yang dicatat dalam catatan kaki.
- source_word: אֶל בֵּית הַסֹּהַר
  choice: di rumah tahanan
  rationale: Ungkapan Ibrani menunjuk pada tempat pemenjaraan. 'Rumah tahanan' mempertahankan unsur בֵּית dan terdengar alami dalam bahasa Indonesia; preposisi 'di' melanjutkan keterangan lokasi setelah verba 'menahan'.
- source_word: מְקוֹם אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: tempat Yusuf dikurung
  rationale: אָסוּר dapat berarti terikat, ditahan, atau dipenjarakan. 'Dikurung' mempertahankan nuansa pembatasan kebebasan dan cocok dengan konteks rumah tahanan; שָׁם sudah tercakup secara alami dalam 'tempat ...'.
