base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: id
  text: Setelah peristiwa-peristiwa itu[a], juru minuman raja Mesir dan juru roti itu berdosa terhadap tuan mereka, yaitu raja Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah peristiwa-peristiwa itu.” Secara lebih harfiah, formula narasi Ibrani ini berbunyi, “Terjadilah sesudah hal-hal ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Setelah peristiwa-peristiwa itu
  rationale: Ungkapan ini merupakan formula peralihan dalam narasi Ibrani. Terjemahan ini alami dalam bahasa Indonesia dan tetap mempertahankan acuan jamak serta urutan waktunya.
- source_word: חָטְאוּ
  choice: berdosa terhadap
  rationale: Kata חטא dengan ל pada pihak yang dikenai dapat berarti berbuat dosa atau bersalah terhadap seseorang. Pilihan ini mempertahankan bobot moral dan relasional verba Ibrani.
- source_word: מַשְׁקֵה
  choice: juru minuman
  rationale: Istilah ini menunjuk pejabat atau pelayan istana yang menyajikan minuman kepada raja. 'Juru minuman' merupakan padanan Alkitabiah yang ringkas dan tidak menambahkan pangkat kepala yang belum dinyatakan dalam ayat ini.
- source_word: הָאֹפֶה
  choice: juru rotinya
  rationale: Bentuk definit ini berarti 'juru roti itu'. Pronomina '-nya' secara alami menunjukkan bahwa ia adalah juru roti sang raja, sebagaimana tersirat oleh konteks dan hubungan kedua pejabat itu dengan tuan mereka.
- source_word: לַאֲדֹנֵיהֶם
  choice: terhadap tuan mereka
  rationale: אדון di sini menunjuk atasan manusia kedua pejabat tersebut. 'Tuan' sesuai dengan hubungan pelayan dan penguasa serta tidak mengesankan gelar ilahi.
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: yaitu raja Mesir
  rationale: Frasa ini menjelaskan siapa 'tuan mereka'. 'Yaitu' membuat fungsi aposisinya jelas dalam bahasa Indonesia sambil mempertahankan pengulangan sebutan raja Mesir.
theological_decisions:
- issue: Bobot moral verba חָטְאוּ
  choice: berdosa terhadap
  alternative: bersalah terhadap; berbuat salah terhadap
  rationale: Terjemahan utama mempertahankan arti dasar dan kekuatan moral חטא tanpa menentukan secara spekulatif bentuk pelanggarannya.
translation_notes:
  register: Bahasa Indonesia baku, jelas, dan bermartabat. Istilah jabatan istana diterjemahkan dengan 'juru minuman' dan 'juru roti'; struktur aposisi dijelaskan secara alami dengan 'yaitu'. Penanda catatan kaki [a] dicantumkan dalam teks utama.
