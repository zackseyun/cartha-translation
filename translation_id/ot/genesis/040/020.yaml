  to: Pada hari ketiga, yaitu hari ulang tahun Firaun, ia mengadakan perjamuan bagi semua pegawainya. Di tengah-tengah para pegawainya itu, ia mengangkat kepala juru minuman dan kepala juru roti.[a]
