base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: id
  text: Pada hari ketiga, yaitu hari ulang tahun Firaun, ia mengadakan perjamuan bagi semua pegawainya. Di tengah-tengah para pegawainya itu, ia mengangkat kepala juru minuman dan kepala juru roti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat kepala.” Ungkapan ini juga dapat dipahami secara lebih interpretatif sebagai “menaruh perhatian khusus kepada” atau “memperhitungkan.” Ungkapan harfiahnya dipertahankan karena kisah ini memakainya dengan dua hasil yang bertolak belakang bagi kedua pejabat tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Bentuk naratif Ibrani memperkenalkan peristiwa berikutnya; bahasa Indonesia alami cukup menyatakannya dengan keterangan waktu tanpa menerjemahkan וַיְהִי secara kaku.
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: hari ulang tahun Firaun
  rationale: Padanan Indonesia modern dan alami untuk hari kelahiran Firaun.
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: ia mengadakan perjamuan
  rationale: Mengungkapkan tindakan menyelenggarakan jamuan besar dengan wajar dan bermartabat; מִשְׁתֶּה dapat mencakup kegiatan makan dan minum.
- source_word: לְכָל עֲבָדָיו
  choice: bagi semua pegawainya
  rationale: Dalam konteks istana, עֲבָדִים menunjuk secara luas kepada orang-orang yang melayani raja, termasuk pejabat istana. 'Pegawai' menghindari kesan bahwa status perbudakan merupakan pokok ayat ini.
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: ia mengangkat kepala
  rationale: Ungkapan harfiah dipertahankan karena narasi di ayat 13 dan 19 sengaja memainkannya dengan hasil yang berlawanan bagi kedua pejabat.
- source_word: שַׂר הַמַּשְׁקִים
  choice: pemimpin para juru minuman
  rationale: Menyatakan jabatan pejabat istana yang mengepalai pelayanan minuman tanpa memakai istilah yang terlalu kuno.
- source_word: שַׂר הָאֹפִים
  choice: pemimpin para juru roti
  rationale: Padanan sejajar dan alami bagi pejabat yang mengepalai para pembuat roti istana.
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: Di tengah-tengah para pegawainya itu
  rationale: Menunjukkan bahwa tindakan tersebut berlangsung di antara atau di hadapan para pelayan dan pejabat Firaun.
