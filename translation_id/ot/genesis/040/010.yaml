lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: dan pada pokok anggur itu
  rationale: Kata depan ב dengan kata sandang menunjuk pada cabang-cabang yang terdapat pada pokok anggur; 'pada' alami dalam bahasa Indonesia.
- source_word: שְׁלֹשָׁה שָׂרִיגִם
  choice: tiga cabang
  rationale: שָׂרִיגִים menunjuk pada pertumbuhan atau ranting pokok anggur. 'Cabang' paling umum dan mudah dipahami, sementara kemungkinan 'sulur' atau 'tunas' dicatat dalam catatan kaki.
- source_word: כְפֹרַחַת
  choice: ketika ... mulai bertunas
  rationale: Partikel כ dengan bentuk partisip menyatakan tahap perkembangan yang sedang berlangsung; terjemahan ini menyampaikan nuansa temporal dan progresif secara alami.
- source_word: עָלְתָה נִצָּהּ
  choice: bunganya pun muncul
  rationale: Secara harfiah bunga atau kembangnya 'naik'; 'muncul' mempertahankan gagasan keluarnya bunga tanpa ungkapan Indonesia yang kaku.
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: gugus-gugusnya menjadi buah anggur yang matang
  rationale: Bentuk הִבְשִׁילוּ menyatakan tercapainya kematangan. Susunan ini secara alami menggambarkan gugus yang berkembang menjadi anggur matang tanpa menyiratkan bahwa gugus itu mematangkan objek lain.
