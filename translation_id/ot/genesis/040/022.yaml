  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: id
  text: Namun, ia menggantung kepala juru roti itu, tepat seperti yang telah ditafsirkan Yusuf kepada mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵת
  choice: Namun, ... itu
  rationale: Konjungsi וְ di sini mengontraskan nasib kepala juru roti dengan pemulihan kepala juru minuman pada ayat sebelumnya; אֵת adalah penanda objek langsung dan tidak diterjemahkan tersendiri.
- source_word: שַׂר הָאֹפִים
  choice: kepala juru roti
  rationale: שַׂר menunjuk pejabat atau pemimpin, sedangkan הָאֹפִים menunjuk para pembuat roti; frasa ini secara alami menyatakan pejabat yang mengepalai para juru roti istana.
- source_word: תָּלָה
  choice: digantungnya
  rationale: Kata kerja ini pada dasarnya berarti menggantung. Bentuk ini mempertahankan cara tindakan sebagaimana dinyatakan teks tanpa memastikan apakah yang dimaksud adalah eksekusi dengan menggantung, penyaliban/penancapan pada tiang, atau pemajangan jenazah setelah eksekusi.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menandai kesesuaian antara peristiwa dan penafsiran Yusuf sebelumnya.
- source_word: פָּתַר
  choice: telah ditafsirkan
  rationale: Dalam konteks mimpi, פתר berarti menafsirkan. Kata 'telah' memperjelas bahwa penafsiran itu mendahului penggenapannya.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Pronomina jamak merujuk kepada kedua pejabat yang mimpinya ditafsirkan Yusuf.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan lazim dalam bahasa Indonesia untuk יוֹסֵף.
