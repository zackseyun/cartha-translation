base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: id
  text: Keduanya—juru minuman dan juru roti raja Mesir[b]—bermimpi pada malam yang sama, masing-masing dengan mimpinya sendiri dan dengan tafsir yang sesuai dengan mimpinya[a]. Mereka ditahan di rumah tahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Keduanya memimpikan sebuah mimpi, masing-masing mimpinya sendiri, dalam satu malam, masing-masing sesuai dengan tafir mimpinya.” Ungkapan “pada malam yang sama” dapat juga diterjemahkan “dalam satu malam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “juru minuman dan juru roti yang melayani raja Mesir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם שְׁנֵיהֶם
  choice: Keduanya bermimpi
  rationale: Bahasa Indonesia alami tidak lazim mempertahankan konstruksi serumpun secara harfiah sebagai 'memimpikan mimpi'. 'Keduanya bermimpi' menyampaikan tindakan dan penegasan bahwa kedua orang itu mengalami mimpi.
- source_word: אִישׁ חֲלֹמוֹ
  choice: masing-masing mendapat mimpinya sendiri
  rationale: Mempertahankan daya distributif אִישׁ dan menjelaskan bahwa tiap orang mengalami mimpi tersendiri.
- source_word: בְּלַיְלָה אֶחָד
  choice: pada malam yang sama
  rationale: Dalam konteks dua orang, ungkapan ini secara alami menunjukkan bahwa kedua mimpi terjadi dalam satu malam yang sama; terjemahan harfiahnya ialah 'dalam satu malam'.
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: setiap mimpi mempunyai maknanya sendiri
  rationale: כְּ menyatakan kesesuaian, dan פִּתְרוֹן menunjuk pada tafsir atau makna mimpi. Rumusan ini menjaga gagasan bahwa setiap mimpi memiliki makna yang bersesuaian dan tersendiri tanpa menyatakan bahwa makna itu sudah diketahui.
- source_word: הַמַּשְׁקֶה
  choice: juru minuman
  rationale: Menunjuk pejabat istana yang bertugas menyajikan minuman. 'Kepala' tidak disebutkan dalam ayat ini.
- source_word: הָאֹפֶה
  choice: juru roti
  rationale: Padanan ringkas bagi pembuat roti istana; gelar 'kepala' tidak ditambahkan karena tidak eksplisit dalam ayat ini.
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Hubungan dengan raja dinyatakan secara idiomatis sebagai 'juru minuman dan juru roti raja Mesir', yang menunjukkan keterikatan resmi tanpa memasukkan rincian jabatan tambahan.
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: yang ditahan di rumah tahanan
  rationale: אסר dalam konteks ini berarti ditahan atau dipenjarakan. 'Rumah tahanan' mempertahankan unsur בֵּית sekaligus terdengar wajar dalam bahasa Indonesia.
