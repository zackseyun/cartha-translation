  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: id
  text: Firaun mengembalikan kepala juru minuman ke jabatannya, dan kepala juru minuman itu menyerahkan cawan ke tangan Firaun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: mengembalikan
  rationale: Bentuk Hifil dari שוב menyatakan bahwa Firaun membuat pejabat itu kembali kepada kedudukan atau tugasnya semula.
- source_word: שַׂר הַמַּשְׁקִים
  choice: kepala juru minuman
  rationale: שַׂר menunjuk pemimpin atau pejabat utama, sedangkan הַמַּשְׁקִים menunjuk para pelayan minuman; ungkapan ini alami dan sesuai dengan konteks istana.
- source_word: עַל מַשְׁקֵהוּ
  choice: ke jabatannya
  rationale: Secara harfiah frasa ini menunjuk tugas pelayanan minumannya; 'ke jabatannya' menyampaikan pemulihan fungsi resminya secara alami dalam bahasa Indonesia.
- source_word: וַיִּתֵּן
  choice: menyerahkan
  rationale: נתן pada dasarnya berarti 'memberikan'; dalam konteks pelayanan istana, 'menyerahkan piala ke tangan' menyatakan tindakan penyajian dengan alami.
- source_word: הַכּוֹס
  choice: piala
  rationale: Dalam konteks minuman di istana, 'piala' merupakan padanan konkret dan wajar untuk כּוֹס.
- source_word: עַל כַּף פַּרְעֹה
  choice: ke tangan Firaun
  rationale: כַּף secara harfiah berarti telapak tangan, tetapi ungkapan Indonesia yang alami ialah 'ke tangan Firaun'.
theological_decisions:
- issue: Subjek וַיִּתֵּן pada klausa kedua
  choice: kepala juru minuman itu
  alternative: dia
  rationale: Subjek gramatikal tidak dinyatakan secara eksplisit dalam verba Ibrani dan secara bentuk dapat tampak ambigu, tetapi konteks jabatan yang dipulihkan menunjukkan bahwa kepala juru minuman kembali menyajikan piala kepada Firaun. Menyebut subjek secara eksplisit mencegah pembacaan janggal bahwa Firaun menaruh piala ke tangannya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Firaun' disebut pada awal ayat agar subjek klausa pertama jelas; pengulangan 'kepala juru minuman' pada klausa kedua diperlukan untuk menjernihkan pergantian pelaku yang hanya tersirat dalam teks Ibrani.
