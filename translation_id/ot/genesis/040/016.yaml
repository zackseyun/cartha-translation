  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: id
  text: Ketika kepala juru roti melihat bahwa Yosef telah menafsirkannya dengan baik, ia berkata kepada Yosef, “Aku juga bermimpi. Lihatlah, ada tiga keranjang berisi roti putih[a] di atas kepalaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga keranjang berisi penganan”; arti kata Ibrani חֹרִי tidak pasti. Kata itu mungkin menggambarkan isinya sebagai roti atau kue putih, atau menggambarkan keranjangnya sebagai keranjang berlubang atau anyaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: kepala juru roti
  rationale: Ungkapan ini menunjuk pada pejabat utama yang membawahi para pembuat roti; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: כִּי טוֹב פָּתָר
  choice: bahwa Yosef telah menafsirkannya dengan baik
  rationale: טוֹב berfungsi secara adverbial terhadap tindakan menafsirkan. Penyebutan Yosef memperjelas subjek tersirat tanpa mengubah makna.
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: Aku juga bermimpi
  rationale: Ungkapan Ibrani bersifat eliptis. Terjemahan ini menyampaikan penambahan yang ditandai אַף אֲנִי secara alami dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menghadirkan gambaran mimpi secara hidup.
- source_word: שְׁלֹשָׁה סַלֵּי
  choice: tiga keranjang
  rationale: Padanan langsung dan alami bagi frasa konstruksi tersebut.
- source_word: חֹרִי
  choice: berisi roti putih
  rationale: Istilah ini tidak pasti. Makna tradisional yang mengacu pada roti atau penganan putih dipakai dalam teks utama, sedangkan kemungkinan bahwa kata itu menggambarkan jenis keranjang dicatat dalam catatan kaki.
- source_word: עַל רֹאשִׁי
  choice: di atas kepalaku
  rationale: Menyampaikan hubungan lokatif secara jelas dan wajar.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Transliterasi yang dekat dengan bentuk nama Ibrani dan mudah dibaca dalam bahasa Indonesia.
