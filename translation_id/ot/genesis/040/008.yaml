base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Kami bermimpi, dan tidak ada seorang pun yang dapat menafsirkannya.” Yusuf berkata kepada mereka, “Bukankah penafsiran adalah milik Allah?[a] Tolong ceritakan mimpi itu kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Bukankah penafsiran-penafsiran milik Allah?”'
    reason: Menunjukkan bentuk jamak Ibrani dan konstruksi kepunyaan yang mendasari terjemahan alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: Kami bermimpi
  rationale: Ungkapan Ibrani memakai objek serumpun, secara harfiah ‘sebuah mimpi kami mimpikan’. Dalam bahasa Indonesia, ‘kami bermimpi’ menyampaikan maknanya dengan wajar tanpa ungkapan yang terasa janggal.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: tetapi tidak ada seorang pun yang dapat menafsirkannya
  rationale: Partisip aktif פֹתֵר menunjuk kepada orang yang menafsirkan. Bentuk verbal ini alami dalam bahasa Indonesia dan menyatakan bahwa tidak tersedia orang yang mampu memberikan tafsir.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; ‘Bukankah’ mempertahankan daya retoris tersebut.
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: penafsiran adalah milik Allah
  rationale: Konstruksi dengan ל menyatakan kepunyaan atau sumber. Terjemahan ini mempertahankan pernyataan bahwa penafsiran berasal dari atau berada dalam kewenangan Allah tanpa mempersempitnya menjadi kemampuan Yusuf.
- source_word: פִּתְרֹנִים
  choice: penafsiran
  rationale: Nomina Ibrani berbentuk jamak dan bersifat umum. Dalam bahasa Indonesia, ‘penafsiran’ dapat berfungsi sebagai nomina kategori tanpa penanda jumlah, sehingga tetap alami dan tidak menambahkan makna.
- source_word: סַפְּרוּ נָא לִי
  choice: Ceritakanlah kiranya mimpi kalian kepadaku
  rationale: סִפֵּר berarti menceritakan atau menuturkan, sedangkan נָא memperhalus permintaan. Objek yang tersirat dibuat eksplisit sebagai ‘mimpi kalian’ karena dua orang itu masing-masing memiliki mimpi dan bentuk ini menghindari ketidakjelasan pronomina.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi dan penggunaan bahasa Indonesia.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Yusuf
  choice: Allah
  alternative: allah/dewa-dewa
  rationale: Dalam kisah Yusuf, perkataan ini menunjuk kepada Allah yang diakui Yusuf sebagai sumber penafsiran mimpi. Konteks mendukung rujukan definitif, bukan spekulasi politeistis.
- issue: Hubungan penafsiran dengan Allah
  choice: penafsiran adalah milik Allah
  alternative: Allah yang memberikan penafsiran
  rationale: Rumusan kepunyaan mempertahankan keluasan konstruksi Ibrani, yang dapat mencakup sumber, kewenangan, dan kemampuan ilahi, tanpa menentukan mekanismenya secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat alami bagi pembaca umum; ‘kiranya’ mempertahankan kesantunan נָא tanpa terdengar terlalu sehari-hari. Penanda catatan kaki [a] dicantumkan tepat sesudah pernyataan yang dijelaskannya.
