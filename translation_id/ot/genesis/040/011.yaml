  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: id
  text: Cawan Firaun ada di tanganku. Aku mengambil buah-buah anggur itu, memerasnya ke dalam cawan Firaun, lalu menaruh cawan itu di telapak tangan Firaun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas telapak tangan Firaun”; maksudnya, ia menyerahkan cawan itu kepada Firaun.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: cawan
  rationale: Istilah ini menunjuk pada wadah minum; “cawan” alami dalam konteks istana dan mempertahankan nuansa benda yang digunakan untuk menyajikan minuman.
- source_word: בְּיָדִי
  choice: di tanganku
  rationale: Terjemahan langsung ini jelas dan mempertahankan gambaran konkret dalam laporan mimpi.
- source_word: וָאֶקַּח
  choice: Aku mengambil
  rationale: Padanan naratif yang langsung dan wajar bagi לקח.
- source_word: הָעֲנָבִים
  choice: buah-buah anggur itu
  rationale: Menyatakan nomina jamak tertentu secara alami dalam bahasa Indonesia.
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: memerasnya ke dalam cawan Firaun
  rationale: שׂחט di sini menggambarkan tindakan memeras buah anggur agar cairannya masuk ke dalam cawan; “memeras” merupakan padanan Indonesia yang jelas dan tepat.
- source_word: וָאֶתֵּן
  choice: lalu menaruh
  rationale: נתן secara leksikal dapat berarti “memberikan”, tetapi konteks dan frasa berikutnya menggambarkan penempatan fisik cawan; “menaruh” menyampaikan tindakan itu secara alami.
- source_word: עַל כַּף פַּרְעֹה
  choice: di telapak tangan Firaun
  rationale: Terjemahan ini mempertahankan unsur konkret כַּף, “telapak tangan”, serta preposisi עַל tanpa mengaburkan tindakan penyerahan cawan.
theological_decisions: []
