base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: id
  text: Tiga hari lagi, Firaun akan mengangkat kepalamu dari tubuhmu[a] dan menggantungmu pada sebuah pohon[b], dan burung-burung akan memakan dagingmu dari tubuhmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat kepalamu dari atasmu”; kemungkinan merupakan permainan kata yang mengerikan dengan ungkapan yang sama, yang dipakai secara positif dalam penafsiran mimpi juru minuman. Di sini ungkapan itu menyiratkan bahwa kepalamu disingkirkan dari tubuhmu.
    reason: lexical_alternative
  - marker: b
    text: Atau “pada sebatang kayu” atau “pada sebuah tiang”; kata Ibrani dapat berarti pohon atau kayu, dan bentuk pelaksanaan hukuman tidak dinyatakan secara pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: Tiga hari lagi
  rationale: Ungkapan ini menunjukkan selang waktu yang masih tersisa sebelum peristiwa terjadi; bentuk ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: יִשָּׂא ... אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: akan mengangkat kepalamu dari tubuhmu
  rationale: Mempertahankan ungkapan 'mengangkat kepala' dan permainan katanya dengan ayat 13, sedangkan 'dari tubuhmu' membuat makna mengerikan dalam konteks hukuman mati dapat dipahami.
- source_word: וְתָלָה אֹתְךָ עַל עֵץ
  choice: lalu menggantung engkau pada sebatang kayu
  rationale: תלה berarti 'menggantung', sementara עֵץ dapat berarti pohon atau kayu. 'Sebatang kayu' mempertahankan ketidakpastian mengenai apakah yang dimaksud pohon, tiang, atau perangkat hukuman dari kayu.
- source_word: וְאָכַל הָעוֹף
  choice: dan burung-burung akan memakan
  rationale: עוֹף berbentuk kolektif; bentuk jamak 'burung-burung' merupakan padanan Indonesia yang wajar, dan 'memakan' menyampaikan arti dasar אכל tanpa memperhebatnya.
- source_word: אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: dagingmu dari tubuhmu
  rationale: '''Daging'' mempertahankan sifat konkret בשר. Pengulangan ''dari tubuhmu'' mencerminkan pengulangan מֵעָלֶיךָ dan menggambarkan burung-burung merenggut daging dari jasad yang tergantung.'
theological_decisions:
- issue: Penerjemahan gambaran hukuman mati dan permainan kata tanpa melunakkan nubuat penghakiman
  choice: Mempertahankan ungkapan 'mengangkat kepalamu' serta menjelaskan arahnya dengan 'dari tubuhmu'.
  alternative: Menerjemahkan secara langsung sebagai 'memenggal kepalamu lalu menggantung tubuhmu pada sebuah tiang'.
  rationale: Pilihan utama menjaga gema sastra dengan ayat 13 dan ironi naratif Ibrani. Alternatif lebih eksplisit, tetapi meniadakan permainan kata dan memastikan cara pelaksanaan hukuman secara lebih tegas daripada bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Bentuk 'engkau' dipakai untuk sapaan tunggal dalam narasi Alkitab. Kekerasan gambaran asli tidak dilunakkan, tetapi ambiguitas alat dan cara pelaksanaan hukuman tetap dipertahankan.
