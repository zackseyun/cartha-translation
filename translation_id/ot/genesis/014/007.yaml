  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: id
  text: Kemudian mereka berbalik dan tiba di En-Mispat[a] (yaitu Kadesh), lalu menyerang seluruh wilayah orang Amalek[b], dan juga orang Amori yang tinggal di Hazazon-Tamar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En-Mispat berarti “mata air penghakiman”.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “seluruh ladang orang Amalek”; kemungkinan maksudnya ialah kawasan yang dihuni orang Amalek.'
    reason: lexical_alternative
  - marker: c
    text: Hazazon-Tamar disebut sebagai En-Gedi dalam 2 Tawarikh 20:2.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: Kemudian mereka berbalik
  rationale: Bentuk naratif berurutan dari שׁוב menunjukkan tindakan berikutnya; “berbalik” mempertahankan nuansa perubahan arah.
- source_word: וַיָּבֹאוּ אֶל
  choice: dan tiba di
  rationale: בוא dengan אֶל menyatakan gerak hingga mencapai tujuan; “tiba di” alami dalam narasi Indonesia.
- source_word: עֵין מִשְׁפָּט
  choice: En-Mispat
  rationale: Nama tempat ditransliterasikan, sedangkan arti unsur-unsurnya dijelaskan dalam catatan kaki.
- source_word: הִוא קָדֵשׁ
  choice: (yaitu Kadesh)
  rationale: Frasa ini mengidentifikasi En-Mispat dengan Kadesh; bentuk dalam kurung menyampaikan fungsi penjelasnya secara wajar.
- source_word: וַיַּכּוּ
  choice: lalu menyerang
  rationale: נכה dapat berarti memukul, menyerang, atau mengalahkan. “Menyerang” mempertahankan tindakan militer tanpa memastikan hasil yang tidak dinyatakan secara eksplisit.
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: seluruh wilayah orang Amalek
  rationale: שׂדה secara harfiah berarti “ladang”, tetapi dalam konstruksi ini kemungkinan menunjuk kawasan yang dihuni atau dikuasai kelompok tersebut; “wilayah” alami dan tetap dekat dengan pengertian geografis.
- source_word: וְגַם אֶת הָאֱמֹרִי
  choice: dan juga orang Amori
  rationale: וְגַם mempertahankan penekanan tambahan, sedangkan bentuk gentilik tunggal Ibrani dipahami secara kolektif.
- source_word: הַיֹּשֵׁב בְּחַצְצֹן תָּמָר
  choice: yang tinggal di Hazazon-Tamar
  rationale: Partisipel יֹשֵׁב menyatakan keadaan menetap yang berlangsung; nama tempat ditransliterasikan.
theological_decisions: []
