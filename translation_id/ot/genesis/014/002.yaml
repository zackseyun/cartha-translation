  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: id
  text: mereka berperang melawan Bera, raja Sodom, Birsya, raja Gomora, Syinab, raja Adma, Syemeber, raja Zeboim, dan raja Bela (yakni Zoar).
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: mereka berperang
  rationale: Ungkapan Ibrani secara harfiah berarti ‘melakukan/mengadakan perang’. ‘Berperang’ menyampaikan idiom itu secara alami dan tepat dalam bahasa Indonesia modern.
- source_word: אֶת ... וְאֶת
  choice: melawan
  rationale: Dalam konteks ini, penanda objek memperkenalkan pihak-pihak yang menjadi lawan perang. ‘Melawan’ memperjelas hubungan adversatif dan berlaku bagi seluruh daftar raja.
- source_word: בֶּרַע
  choice: Bera
  rationale: Nama orang ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: מֶלֶךְ סְדֹם
  choice: raja Sodom
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung sebagai gelar diikuti nama tempat.
- source_word: בִּרְשַׁע
  choice: Birsya
  rationale: Transliterasi ini mewakili konsonan שׁ sebagai ‘sy’ sesuai kebiasaan penulisan nama Ibrani dalam bahasa Indonesia.
- source_word: עֲמֹרָה
  choice: Gomora
  rationale: Dipakai bentuk nama tempat yang sudah lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: שִׁנְאָב
  choice: Syinab
  rationale: Nama orang ditransliterasikan dengan mempertahankan bunyi awal Ibrani שׁ.
- source_word: אַדְמָה
  choice: Adma
  rationale: Nama tempat ditransliterasikan secara ringkas dan alami dalam ejaan Indonesia.
- source_word: שֶׁמְאֵבֶר
  choice: Semeber
  rationale: Nama orang ditransliterasikan dalam bentuk Indonesia yang mudah dibaca.
- source_word: צביים
  choice: Zeboim
  rationale: Bentuk ini mengikuti nama tempat yang telah dikenal dalam bahasa Indonesia dan cukup dekat dengan bentuk Ibrani.
- source_word: מֶלֶךְ בֶּלַע
  choice: raja Bela
  rationale: Teks tidak menyebut nama pribadi raja terakhir, tetapi mengidentifikasinya melalui kota yang diperintahnya; perbedaan ini dipertahankan.
- source_word: הִיא צֹעַר
  choice: yakni Zoar
  rationale: Kata ganti dan nama tempat berfungsi sebagai keterangan identifikasi bahwa Bela adalah Zoar. ‘Yakni’ menyampaikan fungsi penjelas itu secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Struktur daftar diperjelas dengan satu kata ‘melawan’ yang menaungi kelima raja, tanpa mengubah siapa saja yang menjadi pihak lawan. Tanda koma membedakan nama setiap raja dari wilayah kekuasaannya.
