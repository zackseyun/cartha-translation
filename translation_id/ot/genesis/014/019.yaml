  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְבָרְכֵ֖/הוּ וַ/יֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְ/אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: id
  text: Lalu ia memberkati dia dan berkata, “Diberkatilah Abram oleh Allah Yang Mahatinggi, Pemilik[a] langit dan bumi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Pencipta.” Partisip Ibrani ini dapat berarti “pemilik” atau, dalam konteks ini, “pencipta.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “langit” berbentuk jamak dan bersama “bumi” menunjuk pada keseluruhan alam semesta.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: Lalu ia memberkati dia
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan akhiran objek orang ketiga tunggal dipertahankan sebagai “dia” tanpa mengganti pronomina Ibrani dengan nama Abram.
- source_word: וַיֹּאמַר
  choice: dan berkata
  rationale: Mempertahankan koordinasi dan urutan narasi dalam bahasa Indonesia yang wajar.
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Partisip pasif predikatif ini merupakan rumusan berkat; bentuk “Diberkatilah” mempertahankan daya benediktif dan ragam bahasa yang khidmat.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama pribadi dipertahankan sebagai Abram karena pada tahap narasi ini namanya belum diubah menjadi Abraham.
- source_word: לְאֵל
  choice: oleh Allah
  rationale: Dalam rumusan berkat, preposisi לְ dapat menandai pihak yang menjadi sumber berkat; “oleh Allah” menyampaikan hubungan tersebut dengan jelas.
- source_word: אֵל עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  rationale: Menyampaikan gelar ilahi yang terdiri atas אֵל dan עֶלְיוֹן secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: קֹנֵה
  choice: Pemilik
  rationale: Partisip dari קנה dapat berarti memiliki atau memperoleh, dan dalam konteks tertentu menciptakan. “Pemilik” mempertahankan makna leksikal utama tanpa menutup kemungkinan “Pencipta,” yang dicatat dalam catatan kaki.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan merismatis ini menunjuk pada keseluruhan ciptaan; “langit dan bumi” merupakan padanan Indonesia yang baku dan alami.
theological_decisions:
- issue: Makna קֹנֵה dalam gelar ilahi
  choice: Pemilik langit dan bumi
  alternative: Pencipta langit dan bumi
  rationale: Kata Ibrani קנה dapat menyatakan kepemilikan atau pemerolehan, dan dalam konteks tertentu penciptaan. Teks utama memakai “Pemilik” demi menjaga keluasan maknanya, sementara kemungkinan “Pencipta” tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Rumusan “Diberkatilah” mempertahankan nuansa berkat, sedangkan “Allah Yang Mahatinggi” mengikuti bentuk gelar ilahi yang lazim. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
