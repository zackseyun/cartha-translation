  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: id
  text: bahwa aku tidak akan mengambil, dari seutas benang sampai tali sandal, apa pun yang menjadi milikmu, supaya engkau jangan berkata, ‘Akulah yang membuat Abram kaya.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: aku tidak akan mengambil apa pun
  rationale: Dalam konteks sumpah yang dimulai pada ayat 22, אִם membentuk rumusan sumpah eliptis yang menyatakan penolakan tegas; negasi tersirat dinyatakan agar maknanya jelas dalam bahasa Indonesia.
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: dari seutas benang sampai tali sandal sekalipun
  rationale: Mempertahankan gambaran konkret dan rentang idiomatis Ibrani, sedangkan 'sekalipun' menegaskan bahwa barang sekecil apa pun ditolak.
- source_word: מִכָּל אֲשֶׁר לָךְ
  choice: apa pun dari kepunyaanmu
  rationale: Menyampaikan cakupan menyeluruh כָּל dan hubungan kepemilikan secara alami.
- source_word: וְלֹא תֹאמַר
  choice: supaya jangan engkau berkata
  rationale: Menyatakan tujuan negatif dari penolakan Abram dengan ragam bahasa Indonesia yang jelas dan bermartabat.
- source_word: הֶעֱשַׁרְתִּי אֶת אַבְרָם
  choice: Akulah yang membuat Abram kaya
  rationale: Bentuk Hifil berarti 'membuat kaya'; partikel penegas 'Akulah' menangkap penonjolan subjek אֲנִי dalam potensi pengakuan raja Sodom.
theological_decisions:
- issue: Rumusan sumpah eliptis
  choice: 'Menerjemahkannya sebagai penolakan bersumpah: ''aku tidak akan mengambil apa pun''.'
  alternative: 'Mempertahankan bentuk harfiah bersyarat: ''jika dari seutas benang ... dan jika aku mengambil ...''.'
  rationale: Dalam konteks angkat tangan kepada TUHAN pada ayat 22, konstruksi אִם eliptis menyiratkan kutukan diri dan secara pragmatis berarti penolakan tegas. Terjemahan menjelaskan daya sumpah tanpa menambahkan isi kutukan yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku modern dan bermartabat. Susunan 'dari seutas benang sampai tali sandal sekalipun' mempertahankan citra kuno dengan makna yang mudah dipahami; 'supaya jangan' menyampaikan tujuan negatif tanpa ragam yang terlalu arkais.
