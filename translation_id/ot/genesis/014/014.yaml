  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: id
  text: Ketika Abram mendengar bahwa saudara laki-lakinya telah ditawan[a], ia mengerahkan[b] orang-orangnya yang terlatih, yang lahir dalam rumah tangganya, sebanyak tiga ratus delapan belas orang, lalu mengejar mereka sampai ke Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara laki-lakinya” juga dapat menunjuk kerabat laki-laki dekat, seperti keponakan.
    reason: lexical_alternative
  - marker: b
    text: Verba Ibrani yang diterjemahkan “mengerahkan” juga dapat dipahami sebagai “membawa keluar” atau mungkin “mempersenjatai”.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: telah ditawan
  rationale: Bentuk Nifal dari שׁבה menyatakan bahwa seseorang dibawa sebagai tawanan, khususnya dalam konteks perang. 'Ditawan' mempertahankan nuansa militer itu dengan jelas dan alami.
- source_word: אָחִיו
  choice: saudara laki-lakinya
  rationale: Kata Ibrani אָח secara harfiah berarti saudara laki-laki, tetapi dapat pula menunjuk kerabat laki-laki dekat. Terjemahan utama mempertahankan bentuk permukaan teks dan catatan kaki menjelaskan cakupan maknanya dalam konteks Lot.
- source_word: וַיָּרֶק
  choice: mengerahkan
  rationale: Makna tepat verba ini diperdebatkan. Dalam konteks ini, kata tersebut menunjuk tindakan menyiapkan atau membawa keluar pasukan untuk pengejaran. 'Mengerahkan' alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah Abram secara khusus mempersenjatai atau membawa mereka keluar.
- source_word: חֲנִיכָיו
  choice: orang-orangnya yang terlatih
  rationale: Nomina ini menunjuk orang-orang yang telah dilatih atau dipersiapkan di bawah wewenang Abram. Pilihan ini jelas, alami, dan sesuai dengan konteks militer.
- source_word: יְלִידֵי בֵיתוֹ
  choice: yang lahir dalam rumah tangganya
  rationale: Frasa ini mengidentifikasi mereka sebagai anggota tanggungan yang lahir di lingkungan rumah tangga Abram. 'Rumah tangga' menyampaikan lingkup sosial rumah Abram lebih tepat daripada sekadar bangunan rumah.
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: sebanyak tiga ratus delapan belas orang
  rationale: Bilangan lengkap dipertahankan, sedangkan 'sebanyak' dan 'orang' ditambahkan secara wajar agar hubungan bilangan dengan orang-orang terlatih jelas dalam bahasa Indonesia.
- source_word: וַיִּרְדֹּף
  choice: lalu mengejar mereka
  rationale: רדף di sini menggambarkan pengejaran militer. Objek 'mereka' tersirat dari konteks dan perlu dinyatakan agar kalimat Indonesia alami.
- source_word: עַד דָּן
  choice: sampai ke Dan
  rationale: עַד menyatakan batas atau jangkauan pengejaran; 'sampai ke Dan' merupakan padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Istilah kekerabatan untuk Lot
  choice: Mempertahankan 'saudara laki-lakinya' dalam teks utama
  alternative: kerabat laki-lakinya
  rationale: Walaupun Lot adalah keponakan Abram, teks Ibrani memakai אָחִיו, yang secara harfiah berarti 'saudara laki-lakinya' tetapi dapat mencakup kerabat laki-laki dekat. Teks utama mempertahankan ketegangan ungkapan sumber, sedangkan catatan kaki menjelaskan penggunaan kekerabatan yang lebih luas.
- issue: Nuansa verba וַיָּרֶק
  choice: mengerahkan
  alternative: membawa keluar; mempersenjatai
  rationale: Verba ini sulit dan ditafsirkan dengan beberapa cara. 'Mengerahkan' menyampaikan tindakan mobilisasi dalam konteks militer tanpa menutup kemungkinan nuansa membawa keluar atau mempersenjatai.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah kekerabatan dan verba militer yang ambigu dipertahankan dan dijelaskan melalui catatan kaki.
