base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: id
  text: Kemudian raja Sodom, raja Gomora, raja Adma, raja Zeboim, dan raja Bela (yaitu Zoar) keluar, lalu mereka mengatur barisan untuk bertempur dengan mereka[a] di Lembah Sidim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: melawan mereka. Secara harfiah, ungkapan Ibrani berbunyi “dengan mereka, pertempuran”; dalam konteks ini dapat dipahami secara adversatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Kemudian ... maju
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Walaupun verba Ibrani berbentuk tunggal karena mendahului subjek majemuk, tindakan itu mencakup kelima raja. Dalam konteks militer, 'maju' lebih alami daripada 'keluar' dan tetap menyampaikan gerakan mereka menuju pertempuran.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan baku bagi gelar setiap penguasa; pengulangannya dipertahankan untuk mencerminkan susunan dan irama teks Ibrani.
- source_word: סְדֹם
  choice: Sodom
  rationale: Bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: עֲמֹרָה
  choice: Gomora
  rationale: Bentuk nama tempat yang lazim dan baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַדְמָה
  choice: Adma
  rationale: Transliterasi yang lazim dalam bahasa Indonesia.
- source_word: צביים
  choice: Zeboyim
  rationale: Transliterasi Indonesia yang cukup dekat dengan pelafalan teks Masoret dan mudah dibaca.
- source_word: בֶּלַע הִוא צֹעַר
  choice: Bela (yaitu Zoar)
  rationale: Klausa ini mengidentifikasi Bela sebagai Zoar; tanda kurung menampilkan keterangan penjelas itu secara jernih.
- source_word: וַיַּעַרְכוּ
  choice: mereka mengatur barisan
  rationale: Dalam konteks militer, ערך menunjuk pada penyusunan pasukan atau barisan tempur. Ungkapan ini mempertahankan nuansa tersebut tanpa menjadi arkais.
- source_word: אִתָּם
  choice: melawan mereka
  rationale: Secara leksikal dapat berarti 'dengan mereka', tetapi bersama מִלְחָמָה konteksnya jelas bersifat permusuhan. Bahasa Indonesia idiomatis memerlukan 'melawan mereka' untuk menunjukkan pihak lawan dan menghindari kesan bahwa mereka bertempur sebagai sekutu.
- source_word: מִלְחָמָה
  choice: untuk bertempur
  rationale: Dalam konstruksi dengan ערך, nomina ini menyatakan tujuan penyusunan barisan, yakni pertempuran.
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: di Lembah Sidim
  rationale: עֵמֶק diterjemahkan 'lembah', sedangkan Sidim dipertahankan sebagai nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan 'raja' dipertahankan dari teks Ibrani. Nama-nama tempat mengikuti bentuk yang lazim dalam bahasa Indonesia. Tidak diperlukan catatan kaki karena arti kontekstual אִתָּם dapat disampaikan secara alami sebagai 'melawan mereka' tanpa menghilangkan informasi penting.
