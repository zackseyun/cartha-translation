id: GEN.14.18
reference: Genesis 14:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: id
  text: Dan Melkisedek, raja Salem, mengeluarkan roti dan anggur. Ia adalah imam Allah Yang Mahatinggi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani: El Elyon, artinya “Allah Yang Mahatinggi.”'
    reason: Menjelaskan bentuk Ibrani dari gelar ilahi yang diterjemahkan dalam teks utama.
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: Melkisedek
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia, bukan diterjemahkan menurut kemungkinan makna etimologisnya.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung bagi penguasa kerajaan dan secara alami menjadi aposisi bagi Melkisedek.
- source_word: שָׁלֵם
  choice: Salem
  rationale: Nama tempat ditransliterasikan dengan bentuk tradisional yang sudah dikenal dalam bahasa Indonesia.
- source_word: הוֹצִיא
  choice: membawa keluar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan sesuatu keluar atau membawanya keluar; pilihan ini mempertahankan unsur arah dalam kata Ibrani tanpa terdengar kuno.
- source_word: לֶחֶם
  choice: roti
  rationale: Padanan konkret dan biasa dalam konteks makanan yang disebut bersama anggur.
- source_word: יָיִן
  choice: anggur
  rationale: Dalam konteks ini kata tersebut menunjuk pada minuman anggur; bentuk ringkas 'anggur' lazim dipahami demikian ketika dipasangkan dengan roti.
- source_word: כֹהֵן
  choice: imam
  rationale: Padanan umum bagi pejabat keagamaan, tanpa memasukkan rincian sistem keimaman Israel yang belum dinyatakan dalam konteks ini.
- source_word: אֵל עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  rationale: Ungkapan ilahi ini diterjemahkan sebagai gelar agar maknanya jelas bagi pembaca Indonesia; 'Yang Mahatinggi' mempertahankan daya gelar עֶלְיוֹן.
- source_word: וְהוּא
  choice: Ia adalah
  rationale: Klausa baru menyoroti kedudukan Melkisedek. Pemisahan menjadi kalimat kedua dan penambahan kopula menghasilkan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Apakah roti dan anggur perlu diterjemahkan dengan ungkapan yang menonjolkan kaitan sakramental kemudian
  choice: Mempertahankan laporan historis sederhana bahwa Melkisedek membawa keluar roti dan anggur
  alternative: Menggunakan ungkapan yang mengisyaratkan perjamuan sakramental atau makna tipologis kemudian
  rationale: Kejadian 14:18 sendiri hanya menyebut tindakan tersebut dan jabatan Melkisedek. Terjemahan tidak memasukkan penafsiran teologis dari perkembangan kanonik kemudian ke dalam teks utama.
- issue: Apakah אֵל עֶלְיוֹן diperlakukan sebagai nama diri yang ditransliterasikan atau gelar yang diterjemahkan
  choice: Allah Yang Mahatinggi
  alternative: El Elyon
  rationale: Dalam konteks ini frasa tersebut berfungsi sebagai sebutan atau gelar ilahi. Menerjemahkannya menyampaikan makna kepada pembaca, sementara bentuk Ibraninya dicatat dalam catatan kaki.
- issue: Apakah Melkisedek disebut satu-satunya imam atau seorang yang memiliki jabatan imam
  choice: Ia adalah imam Allah Yang Mahatinggi
  alternative: Ia adalah seorang imam Allah Yang Mahatinggi
  rationale: Bahasa Ibrani tidak memiliki artikel tak tentu dan menyatakan jabatan atau statusnya secara langsung. Bentuk tanpa 'seorang' alami dalam bahasa Indonesia dan tidak menyimpulkan bahwa ia satu-satunya imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisi dipertahankan secara alami, tindakan הוֹצִיא diterjemahkan cukup konkret, dan kalimat kedua dibuat tersendiri untuk kejelasan.
