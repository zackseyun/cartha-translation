  yaml_path: translation/ot/genesis/014/012.yaml
  text: They took Lot[a], Abram’s nephew, and his possessions, and went away[b]. Now he was dwelling in Sodom.
translation:
  language: id
  text: Mereka membawa Lot[a], keponakan Abram, beserta harta bendanya, lalu pergi. Saat itu Lot tinggal di Sodom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak laki-laki saudara Abram.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Mereka membawa
  rationale: Bentuk Qal wayyiqtol dari לקח pada dasarnya berarti ‘mengambil’. Dalam konteks para pemenang membawa tawanan dan jarahan, ‘membawa’ terdengar alami tanpa memperkuatnya menjadi ‘menangkap’ atau ‘merampas’.
- source_word: רְכֻשׁוֹ
  choice: harta bendanya
  rationale: רְכוּשׁ menunjuk pada milik atau kekayaan, khususnya barang yang dapat dibawa. ‘Harta benda’ jelas dan wajar dalam konteks jarahan.
- source_word: בֶּן אֲחִי אַבְרָם
  choice: keponakan Abram
  rationale: Secara harfiah frasa ini berarti ‘anak laki-laki saudara Abram’. ‘Keponakan Abram’ menyampaikan hubungan kekerabatan yang dimaksud secara alami; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַיֵּלֵכוּ
  choice: lalu pergi
  rationale: הלך dalam rangkaian naratif berarti ‘pergi’. ‘Lalu’ menandai kelanjutan tindakan secara alami dalam bahasa Indonesia.
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: Saat itu Lot tinggal di Sodom
  rationale: Klausa ini memberi keterangan latar mengenai tempat tinggal Lot. Penyebutan kembali nama Lot menghindari ambiguitas pronomina dalam bahasa Indonesia.
theological_decisions: []
