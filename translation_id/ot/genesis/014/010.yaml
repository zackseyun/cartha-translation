  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: id
  text: Lembah Sidim penuh dengan lubang-lubang aspal[a]. Raja-raja Sodom dan Gomora melarikan diri, lalu jatuh di sana[b], sedangkan yang lain melarikan diri ke daerah pegunungan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lubang-lubang ter”; kata Ibrani menunjuk pada lubang-lubang bitumen, yaitu aspal alam.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, mereka jatuh di Lembah Sidim, mungkin ke dalam lubang-lubang aspal itu. Namun, teks Ibrani hanya menyatakan bahwa mereka “jatuh di sana.”
    reason: ambiguity_preservation
  - marker: c
    text: Atau “ke gunung-gunung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Lembah Sidim
  rationale: עֵמֶק berarti “lembah,” sedangkan הַשִּׂדִּים adalah nama tempat. Bentuk ini alami sebagai nama geografis dalam bahasa Indonesia.
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: penuh dengan lubang-lubang aspal
  rationale: Pengulangan בֶּאֱרֹת menegaskan banyaknya lubang; ungkapan “penuh dengan” menyampaikan hal itu secara alami. חֵמָר menunjuk pada bitumen atau aspal.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: Menyampaikan tindakan lari dari bahaya secara jelas dan wajar dalam narasi Indonesia.
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: raja-raja Sodom dan Gomora
  rationale: Walaupun מֶלֶךְ berbentuk tunggal, verba jamak dan konteks menunjukkan bahwa yang dimaksud ialah raja masing-masing kota.
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: lalu jatuh di sana
  rationale: Mempertahankan arti dasar נפל, “jatuh,” serta ketidakjelasan teks Ibrani mengenai apakah mereka secara khusus jatuh ke dalam lubang-lubang itu.
- source_word: וְהַנִּשְׁאָרִים
  choice: sedangkan yang lain
  rationale: Menunjuk secara alami kepada orang-orang selebihnya yang tidak termasuk dalam kelompok yang baru disebutkan.
- source_word: הֶרָה
  choice: ke daerah pegunungan
  rationale: Bentuk berarah dari הַר menunjukkan gerakan menuju gunung atau kawasan berbukit; “daerah pegunungan” alami dalam konteks geografis.
- source_word: נָסוּ
  choice: melarikan diri
  rationale: Konsisten dengan verba dari akar yang sama sebelumnya dan sesuai dengan konteks pelarian.
