source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: id
  text: Aku tidak akan mengambil apa pun, kecuali apa yang telah dimakan oleh para pemuda[a] dan bagian orang-orang yang pergi bersamaku—Aner, Eskol, dan Mamre. Biarlah mereka mengambil bagian mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para pelayan” atau “para pengikut.” Kata Ibrani yang dipakai dapat menunjuk kepada pemuda maupun orang yang melayani atau menyertai seseorang.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Mereka akan mengambil bagian mereka.” Bentuk Ibraninya dapat menyatakan masa depan, meskipun konteks lebih mendukung pemberian izin.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: Aku tidak akan mengambil apa pun, kecuali
  rationale: Ungkapan pengecualian ini meneruskan penolakan Abram dalam ayat sebelumnya. Bahasa Indonesia memerlukan gagasan verbal yang tersirat itu agar kalimat utuh; 'kecuali' menyampaikan pembatasan ganda secara alami tanpa pleonasme.
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: apa yang telah dimakan oleh para pemuda
  rationale: נְעָרִים dapat berarti pemuda atau pelayan/pengikut. 'Para pemuda' mempertahankan arti leksikal yang paling langsung, sedangkan kemungkinan kontekstual lainnya dicatat dalam catatan kaki.
- source_word: וְחֵלֶק הָאֲנָשִׁים
  choice: dan bagian orang-orang
  rationale: חֵלֶק berarti bagian atau jatah. 'Bagian' alami dalam konteks pembagian rampasan dan tidak menentukan sifat hak mereka secara berlebihan.
- source_word: אֲשֶׁר הָלְכוּ אִתִּי
  choice: yang pergi bersamaku
  rationale: Terjemahan ini mempertahankan citra gerak dari הלך dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: Aner, Eskol, dan Mamre
  rationale: Nama-nama diri ditransliterasikan dalam bentuk yang jelas dan lazim bagi pembaca Indonesia.
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: Biarlah mereka mengambil bagian mereka
  rationale: Dalam konteks ini bentuk imperfek paling wajar menyatakan izin atau persetujuan Abram, bukan sekadar ramalan masa depan; kemungkinan pembacaan sebagai futurum dicatat.
theological_decisions:
- issue: Kelanjutan tersirat dari sumpah dan penolakan pada ayat sebelumnya
  choice: Menambahkan 'Aku tidak akan mengambil apa pun' sebagai unsur yang tersirat
  alternative: 'Mempertahankan fragmen harfiah: ''Kecuali hanya apa yang telah dimakan ...'''
  rationale: Teks Ibrani bergantung secara sintaksis pada penolakan dalam ayat 23. Pelengkapan ini membuat bahasa Indonesia utuh tanpa mengubah isi atau menambahkan klaim teologis.
- issue: Nuansa הֵם יִקְחוּ חֶלְקָם
  choice: 'Izin: ''Biarlah mereka mengambil bagian mereka'''
  alternative: 'Futurum sederhana: ''Mereka akan mengambil bagian mereka'''
  rationale: Konteks penolakan Abram atas bagiannya sendiri, sambil mengecualikan bagian para sekutunya, lebih mendukung nuansa izin. Ambiguitas bentuk Ibrani tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'Aku' dipakai karena Abram berbicara langsung. Susunan kalimat mempertahankan penolakan tegas Abram sekaligus membedakan hak orang-orang yang menyertainya.
