base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: id
  text: 'Pada zaman Amrafel, raja Sinear, Ariokh, raja Elasar, Kedorlaomer, raja Elam, dan Tideal, raja bangsa-bangsa[a], terjadilah peristiwa berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja Goyim”. Kata Ibrani goyim biasanya berarti “bangsa-bangsa”, tetapi di sini mungkin berfungsi sebagai nama tempat, sejajar dengan wilayah kerajaan lain dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: terjadilah demikian
  rationale: Bentuk naratif ini membuka latar bagi peristiwa yang dilanjutkan dalam ayat berikutnya. Penempatannya pada akhir klausa nama-nama raja menghasilkan susunan bahasa Indonesia yang wajar, sementara titik dua menandai kelanjutannya.
- source_word: בִּימֵי
  choice: Pada zaman
  rationale: Ungkapan temporal ini secara harfiah berarti 'pada hari-hari', tetapi 'pada zaman' lebih alami dalam bahasa Indonesia untuk masa pemerintahan para raja.
- source_word: אַמְרָפֶל
  choice: Amrafel
  rationale: Nama pribadi ditransliterasikan dengan ejaan yang sesuai dengan kebiasaan bahasa Indonesia.
- source_word: מֶלֶךְ שִׁנְעָר
  choice: raja Sinear
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung sebagai gelar diikuti nama wilayah.
- source_word: אַרְיוֹךְ
  choice: Ariokh
  rationale: Transliterasi mempertahankan konsonan akhir Ibrani dalam bentuk yang mudah dikenali pembaca Indonesia.
- source_word: מֶלֶךְ אֶלָּסָר
  choice: raja Elasar
  rationale: Gelar dan nama tempat diterjemahkan secara langsung.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Transliterasi Indonesia yang lazim dan dekat dengan bentuk konsonantal Ibrani.
- source_word: מֶלֶךְ עֵילָם
  choice: raja Elam
  rationale: Gelar diterjemahkan langsung dan nama tempat dipertahankan dalam bentuk yang lazim.
- source_word: וְתִדְעָל
  choice: dan Tideal
  rationale: Konjungsi diterjemahkan dan nama pribadi ditransliterasikan dengan vokal yang mencerminkan bentuk Ibrani.
- source_word: מֶלֶךְ גּוֹיִם
  choice: raja bangsa-bangsa
  rationale: גּוֹיִם secara leksikal berarti 'bangsa-bangsa'. Namun, karena posisinya sejajar dengan nama wilayah lain, kemungkinan bahwa kata ini merupakan nama tempat dipertahankan dalam catatan kaki.
