  yaml_path: translation/ot/genesis/014/006.yaml
  text: and the Horites in their hill country of Seir[a], as far as El-paran, which is by the wilderness.
translation:
  language: id
  text: dan orang Hori di pegunungan mereka di Seir, sampai ke El-Paran[a], yang terletak di dekat padang gurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «El Paran»; mungkin berarti «pohon tarbantin di Paran» jika nama ini dipahami menurut asal katanya, bukan sebagai nama tempat tetap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: dan
  rationale: Kata sambung dan penanda objek melanjutkan daftar bangsa yang dikalahkan pada ayat sebelumnya; verba tetap dipahami dari konteks.
- source_word: הַחֹרִי
  choice: orang Hori
  rationale: Bentuk ini menunjuk secara kolektif kepada kelompok penduduk yang dikenal sebagai orang Hori dan mengikuti pemakaian nama bangsa yang lazim dalam bahasa Indonesia.
- source_word: בְּהַרְרָם
  choice: di pegunungan mereka
  rationale: Menerjemahkan bentuk jamak 'gunung' beserta sufiks orang ketiga jamak secara cukup dekat, sambil tetap alami dalam bahasa Indonesia.
- source_word: שֵׂעִיר
  choice: di Seir
  rationale: Seir dipertahankan sebagai nama tempat; rangkaian ini secara alami menyatakan bahwa pegunungan mereka berada di wilayah Seir.
- source_word: עַד
  choice: sampai ke
  rationale: Menandai batas geografis gerakan atau penaklukan.
- source_word: אֵיל פָּארָן
  choice: El-Paran
  rationale: Diperlakukan sebagai nama tempat supaya teks utama tidak memastikan secara berlebihan apakah unsur pertama harus dipahami secara etimologis sebagai nama pohon.
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: yang terletak di tepi padang gurun
  rationale: Menyampaikan fungsi klausa relatif sebagai keterangan lokasi dan nuansa spasial עַל secara alami.
