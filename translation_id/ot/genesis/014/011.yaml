  text: וַ֠/יִּקְחוּ אֶת כָּל רְכֻ֨שׁ סְדֹ֧ם וַ/עֲמֹרָ֛ה וְ/אֶת כָּל אָכְלָ֖/ם וַ/יֵּלֵֽכוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: id
  text: Lalu mereka mengambil seluruh harta benda Sodom dan Gomora serta seluruh makanan mereka[a], kemudian pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbekalan mereka.” Istilah Ibrani ini dapat berarti makanan pada umumnya atau bekal untuk perjalanan maupun peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mereka mengambil
  rationale: Bentuk naratif Qal dari לקח secara langsung berarti ‘mengambil’. Pilihan ini tetap dekat dengan teks tanpa menambahkan nuansa ‘merampas’ atau ‘membawa lari’, meskipun konteksnya adalah penjarahan.
- source_word: כָּל
  choice: seluruh
  rationale: Kata penentu jumlah ini muncul dua kali dan menekankan lengkapnya harta benda maupun makanan yang diambil.
- source_word: רְכֻשׁ
  choice: harta benda
  rationale: Istilah ini menunjuk pada barang milik atau kekayaan yang dapat dijarah. ‘Harta benda’ alami dalam bahasa Indonesia dan cukup luas cakupannya.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom dan Gomora
  rationale: Menggunakan bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: אָכְלָם
  choice: makanan mereka
  rationale: Bentuk nomina dari akar אכל dengan akhiran orang ketiga jamak berarti ‘makanan mereka’; istilah ini juga dapat mencakup perbekalan.
- source_word: וַיֵּלֵכוּ
  choice: kemudian pergi
  rationale: Bentuk naratif Qal dari הלך menyatakan bahwa mereka berangkat setelah mengambil jarahan. ‘Pergi’ mempertahankan ungkapan sumber tanpa memperluasnya secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘seluruh’ dipertahankan untuk mencerminkan penekanan teks Ibrani. Penanda catatan kaki ditempatkan setelah ‘makanan mereka’, yaitu kata yang memiliki alternatif leksikal.
