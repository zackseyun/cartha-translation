  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: id
  text: Ia membawa kembali semua harta benda; ia juga membawa kembali Lot, kerabatnya,[a] beserta harta bendanya, juga para perempuan dan orang-orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Lot, saudaranya.” Di sini kata “saudara” dipakai dalam arti luas, yaitu kerabat; dalam narasi ini Lot adalah keponakan Abram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: ia membawa kembali
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan sesuatu kembali; dalam konteks penyelamatan harta dan tawanan, 'membawa kembali' alami dan tepat.
- source_word: כָּל הָרְכֻשׁ
  choice: semua harta benda itu
  rationale: רְכוּשׁ menunjuk pada milik atau barang kekayaan, terutama harta bergerak; 'harta benda' cukup luas dan wajar dalam bahasa Indonesia.
- source_word: וְגַם
  choice: juga
  rationale: Mempertahankan daya tambah partikel tanpa membuat susunan bahasa Indonesia terasa berat.
- source_word: לוֹט אָחִיו
  choice: Lot, kerabatnya
  rationale: אָח secara harfiah dapat berarti 'saudara', tetapi juga dipakai untuk hubungan kekerabatan yang lebih luas; dalam narasi Lot adalah keponakan Abram.
- source_word: וּרְכֻשׁוֹ
  choice: beserta harta bendanya
  rationale: Menggunakan padanan konsisten untuk רְכוּשׁ; sufiks orang ketiga tunggal mengacu kepada Lot. 'Beserta' mengungkapkan hubungan tambahan secara alami.
- source_word: הֵשִׁיב
  choice: membawa kembali
  rationale: Pengulangan verba Hifil שוב dipertahankan agar struktur dua klausa dan irama narasi Ibrani tetap tampak.
- source_word: הַנָּשִׁים
  choice: para perempuan
  rationale: Istilah Ibrani berarti perempuan secara umum; tidak dipersempit menjadi 'istri-istri' karena konteks tidak mewajibkannya.
- source_word: הָעָם
  choice: orang-orang lainnya
  rationale: עָם berarti rakyat atau orang banyak. Dalam daftar setelah 'para perempuan', tambahan 'lainnya' menghindari kesan bahwa perempuan tidak termasuk orang, tanpa mempersempit kelompok itu menjadi laki-laki saja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Titik koma mempertahankan pembagian ayat menjadi dua klausa utama. Pronomina 'ia' dibiarkan mengikuti subjek dari konteks sebelumnya, sebagaimana teks Ibrani.
