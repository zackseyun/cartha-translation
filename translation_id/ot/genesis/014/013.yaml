  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹא֙ הַ/פָּלִ֔יט וַ/יַּגֵּ֖ד לְ/אַבְרָ֣ם הָ/עִבְרִ֑י וְ/הוּא֩ שֹׁכֵ֨ן בְּ/אֵֽלֹנֵ֜י מַמְרֵ֣א הָ/אֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַ/אֲחִ֣י עָנֵ֔ר וְ/הֵ֖ם בַּעֲלֵ֥י בְרִית אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: id
  text: Kemudian datanglah seorang yang lolos dan memberitahukan hal itu kepada Abram, orang Ibrani itu. Pada waktu itu Abram tinggal dekat pohon-pohon besar Mamre[a], orang Amori yang merupakan saudara Eskol dan saudara Aner[b]. Mereka terikat perjanjian dengan Abram[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dekat pohon-pohon tarbantin Mamre" atau "dekat pohon-pohon ek Mamre". Istilah Ibraninya dapat menunjuk pohon-pohon besar, yang sering diidentifikasi sebagai pohon tarbantin atau pohon ek.
    reason: lexical_alternative
  - marker: b
    text: Atau "kerabat Eskol dan kerabat Aner". Kata Ibrani untuk "saudara" juga dapat menunjuk hubungan keluarga yang lebih luas.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, "pemilik-pemilik perjanjian dengan Abram", yaitu orang-orang yang terikat dengannya melalui perjanjian atau persekutuan.
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: seorang yang lolos
  rationale: Menunjukkan orang yang berhasil meloloskan diri dari bahaya atau pertempuran; lebih alami dan tepat dalam konteks daripada sebutan umum 'pelarian'.
- source_word: וַיַּגֵּד
  choice: memberitahukan hal itu
  rationale: Mengungkapkan tindakan menyampaikan laporan kepada Abram dengan gaya naratif Indonesia yang alami.
- source_word: הָעִבְרִי
  choice: orang Ibrani itu
  rationale: Mempertahankan sebutan etnis atau sosial yang dikenakan kepada Abram dalam teks sumber.
- source_word: שֹׁכֵן
  choice: tinggal
  rationale: Partisip Ibrani menunjukkan keadaan menetap yang sedang berlangsung pada waktu peristiwa itu terjadi.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: dekat pohon-pohon besar Mamre
  rationale: Istilah אֵלוֹן dapat menunjuk pohon besar dan identifikasi jenisnya sebagai pohon tarbantin atau ek tidak pasti; terjemahan umum mempertahankan ketidakpastian botanis.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Sebutan etnis ini menerangkan Mamre dan diterjemahkan dengan bentuk baku dalam bahasa Indonesia.
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: saudara Eskol dan saudara Aner
  rationale: Menerjemahkan אָח secara langsung sebagai 'saudara' sambil mempertahankan kemungkinan hubungan kekerabatan yang lebih luas dalam catatan kaki.
- source_word: בַּעֲלֵי בְרִית
  choice: terikat perjanjian dengan
  rationale: Ungkapan harfiah 'pemilik-pemilik perjanjian' merupakan idiom bagi orang-orang yang terikat kepada Abram melalui perjanjian atau persekutuan; pilihan ini mempertahankan unsur perjanjian tanpa terasa kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Susunan kalimat diperjelas agar rujukan Mamre sebagai orang Amori tidak disalahartikan sebagai nama tempat, sementara ambiguitas botanis dan luasnya makna hubungan kekerabatan dipertahankan melalui catatan kaki.
