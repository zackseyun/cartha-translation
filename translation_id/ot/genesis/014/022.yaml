  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: id
  text: Namun Abram berkata kepada raja Sodom, “Aku telah mengangkat tanganku[a] kepada Yahweh, Allah Yang Mahatinggi, Pemilik[b] langit dan bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mengangkat tangan” menggambarkan gerakan dalam sumpah.
    reason: cultural_note
  - marker: b
    text: Atau “Pencipta”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw-konsekutif melanjutkan narasi, tetapi dalam konteks jawaban Abram terhadap tawaran raja Sodom terdapat pertentangan yang wajar dinyatakan dengan “Namun”.
- source_word: הֲרִימֹתִי יָדִי
  choice: Aku telah mengangkat tanganku
  rationale: Mempertahankan ungkapan konkret Ibrani tentang gerakan tangan ketika bersumpah, sementara makna budayanya dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אֵל עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  rationale: Terjemahan alami dan baku dalam bahasa Indonesia untuk gelar ilahi ini.
- source_word: קֹנֵה
  choice: Pemilik
  rationale: Partisip Ibrani dapat menunjuk kepada pihak yang memiliki atau memperoleh, dan dalam konteks ini juga mungkin dipahami sebagai pencipta. “Pemilik” mempertahankan arti leksikal langsung tanpa menutup kemungkinan arti alternatif.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan merism yang alami dalam bahasa Indonesia dan mencakup keseluruhan ciptaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; bentuk “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Arti קֹנֵה שָׁמַיִם וָאָרֶץ
  choice: Pemilik langit dan bumi
  alternative: Pencipta langit dan bumi
  rationale: Kata קֹנֵה memiliki rentang arti yang mencakup kepemilikan dan, dalam konteks tertentu, penciptaan. Teks utama memakai “Pemilik”, sedangkan catatan kaki mempertahankan alternatif penting “Pencipta” agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang pertama “Aku” sesuai dengan tuturan langsung Alkitabiah tanpa terdengar kuno. Kapitalisasi gelar ilahi dipakai untuk kejelasan dan kelaziman.
