source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: id
  text: Kedorlaomer, raja Elam, Tideal, raja Goyim,[a] Amrafel, raja Sinear, dan Ariokh, raja Elasar—empat raja melawan lima raja itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tideal, raja bangsa-bangsa.” Kata Ibrani גּוֹיִם dapat berarti “bangsa-bangsa”, tetapi di sini mungkin juga merupakan nama tempat, yaitu “Goyim”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: melawan
  rationale: Dalam susunan daftar pertempuran ini, אֵת menghubungkan dua kelompok yang berhadapan. Bahasa Indonesia memerlukan relasi yang jelas; “melawan” menyampaikan konteks pertempuran dengan alami.
- source_word: כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: מֶלֶךְ עֵילָם
  choice: raja Elam
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung dan alami.
- source_word: תִדְעָל
  choice: Tideal
  rationale: Nama diri ditransliterasikan dengan mempertahankan unsur bunyi sumber.
- source_word: גּוֹיִם
  choice: Goyim
  rationale: Dalam gelar kerajaan ini, kata tersebut mungkin merupakan nama tempat. Bentuk nama dipertahankan dalam teks utama, sedangkan kemungkinan arti kata benda umum dicatat dalam catatan kaki.
- source_word: אַמְרָפֶל
  choice: Amrafel
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia.
- source_word: שִׁנְעָר
  choice: Sinear
  rationale: Nama tempat Ibrani dipertahankan dan tidak diganti dengan identifikasi historis seperti Babilonia.
- source_word: אַרְיוֹךְ
  choice: Ariokh
  rationale: Nama diri ditransliterasikan; “kh” mewakili konsonan akhir yang berdesis kuat dalam sumber.
- source_word: אֶלָּסָר
  choice: Elasar
  rationale: Nama tempat ditransliterasikan tanpa mengidentifikasikannya secara spekulatif dengan wilayah lain.
- source_word: אַרְבָּעָה מְלָכִים
  choice: empat raja
  rationale: Frasa bilangan dan nomina diterjemahkan secara langsung.
- source_word: הַחֲמִשָּׁה
  choice: lima raja itu
  rationale: Secara harfiah berarti “kelima itu”; kata “raja” tersirat dari frasa sebelumnya dan konteks, lalu dinyatakan agar jelas dan alami dalam bahasa Indonesia.
