source:
  edition: WLC
  text: שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת כְּדָרְלָעֹ֑מֶר וּ/שְׁלֹשׁ עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/004.yaml
  text: For twelve years they had served Kedorlaomer[a], but in the thirteenth year they rebelled.
translation:
  language: id
  text: Selama dua belas tahun mereka takluk kepada Kedorlaomer, tetapi pada tahun ketiga belas mereka memberontak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: Selama dua belas tahun
  rationale: Frasa Ibrani menyatakan jangka waktu. Kata 'selama' menghasilkan ungkapan durasi yang alami dan jelas dalam bahasa Indonesia.
- source_word: עָבְדוּ
  choice: mereka takluk kepada
  rationale: Kata עבד pada dasarnya berarti 'melayani', tetapi dalam konteks hubungan antarkerajaan menunjuk pada ketundukan sebagai kerajaan bawahan. 'Takluk kepada' menyampaikan makna politis itu secara wajar tanpa menyiratkan pelayanan sukarela.
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: tetapi pada tahun ketiga belas
  rationale: Secara harfiah berbunyi 'dan tiga belas tahun', tetapi konteks menunjukkan tahun berikutnya setelah dua belas tahun ketundukan. 'Tetapi' menyatakan pertentangan yang terkandung dalam peralihan menuju pemberontakan.
- source_word: מָרָדוּ
  choice: mereka memberontak
  rationale: מרד berarti memberontak atau melawan penguasa; 'memberontak' merupakan padanan langsung dan alami dalam konteks politik-militer.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur waktu dipertahankan dengan jelas, sedangkan hubungan politik yang tersirat dalam עבד dinyatakan secara alami sebagai 'takluk kepada'.
