  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: id
  text: Pada tahun keempat belas, Kedorlaomer datang bersama raja-raja yang bersama dia. Mereka mengalahkan orang Refaim[a] di Asytarot-Karnaim, orang Zuzim di Ham, dan orang Emim di Syawa-Kiryataim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian terjemahan menyebut orang Refaim sebagai “raksasa”; di sini nama kelompok bangsa dalam bahasa Ibrani dipertahankan.
    reason: lexical_alternative
  - marker: b
    text: Syawa-Kiryataim juga dapat dipahami sebagai “dataran Kiryataim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: Pada tahun keempat belas
  rationale: Frasa ini berfungsi sebagai keterangan waktu. Konjungsi awal tidak perlu dinyatakan tersendiri dalam bahasa Indonesia karena kesinambungan narasinya sudah jelas.
- source_word: בָּא
  choice: datang
  rationale: Verba בוא pada dasarnya berarti datang atau tiba. Pilihan 'datang' mempertahankan keluasan maknanya tanpa menambahkan gagasan militer seperti 'bergerak maju'.
- source_word: כְדָרְלָעֹמֶר
  choice: Kedorlaomer
  rationale: Nama pribadi ini ditransliterasikan langsung dengan bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: bersama raja-raja yang menyertainya
  rationale: Ungkapan ini menyatakan bahwa para raja tersebut adalah sekutu yang hadir bersama Kedorlaomer.
- source_word: וַיַּכּוּ
  choice: mereka mengalahkan
  rationale: Dalam konteks peperangan, נכה berarti memukul atau menaklukkan pihak lawan. 'Mengalahkan' menyampaikan hasil tindakan itu secara wajar tanpa bahasa arkais.
- source_word: רְפָאִים
  choice: orang Refaim
  rationale: Bentuk Ibrani dipertahankan sebagai nama suatu kelompok bangsa, bukan diterjemahkan secara interpretatif sebagai 'raksasa'.
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: di Asyterot-Karnaim
  rationale: Preposisi menunjukkan lokasi, sedangkan nama tempat ditransliterasikan dalam ejaan yang mudah dibaca penutur Indonesia.
- source_word: הַזּוּזִים
  choice: orang Zuzim
  rationale: Nama kelompok bangsa dinyatakan dengan 'orang' agar alami dalam daftar bangsa berbahasa Indonesia.
- source_word: בְּהָם
  choice: di Ham
  rationale: Ham dipahami sebagai nama tempat dalam rangkaian lokasi pertempuran dan karena itu ditransliterasikan.
- source_word: הָאֵימִים
  choice: orang Emim
  rationale: Nama kelompok bangsa dipertahankan melalui transliterasi dan diperjelas secara alami dengan kata 'orang'.
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: di Syawe-Kiryataim
  rationale: Frasa ini diperlakukan sebagai nama tempat majemuk, sejalan dengan pola daftar geografis ayat tersebut, sambil tetap mencatat kemungkinan pemahaman lain dalam catatan kaki.
theological_decisions:
- issue: Identitas orang Refaim
  choice: Mempertahankan Refaim sebagai nama kelompok bangsa
  alternative: Menerjemahkannya sebagai 'raksasa'
  rationale: Ayat ini menyajikannya sebagai nama suatu kelompok. Menerjemahkannya sebagai 'raksasa' akan menetapkan penafsiran mengenai ciri mereka yang tidak diwajibkan oleh sintaksis ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar daftar panjang tetap mudah dipahami. Nama orang, bangsa, dan tempat ditransliterasikan secara konsisten; istilah arkais dan penafsiran yang melampaui teks dihindari.
