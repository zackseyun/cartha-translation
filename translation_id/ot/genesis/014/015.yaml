base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/015.yaml
  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: id
  text: Pada malam hari, ia dan hamba-hambanya membagi diri untuk menghadapi mereka. Ia memukul mereka dan mengejar mereka sampai ke Hoba, yang terletak di sebelah utara Damsyik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di sebelah kiri Damsyik,” yaitu di sebelah utara.'
    reason: Menjelaskan idiom arah dalam bahasa Ibrani yang diterjemahkan menurut maknanya.
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם
  choice: membagi pasukan untuk menyerang mereka
  rationale: Bentuk tunggal ‘ia membagi’ diikuti ‘ia dan para hambanya’ menyiratkan pembagian kelompok penyerang. Penambahan ‘pasukan’ membuat maksud idiom Ibrani jelas tanpa menentukan taktik lebih jauh.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: ‘Hamba-hambanya’ mempertahankan cakupan leksikal עבד dan sesuai dengan anggota rumah tangga Abram yang menyertainya dalam konteks ini.
- source_word: וַיַּכֵּם
  choice: Ia mengalahkan mereka
  rationale: Ungkapan נכה dapat berarti memukul, menghantam, atau mengalahkan. Dalam kisah pertempuran ini, ‘mengalahkan’ menyampaikan hasil serangan tanpa mengharuskan bahwa semuanya dibunuh.
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: di sebelah utara Damsyik
  rationale: Secara harfiah berarti ‘di sebelah kiri Damsyik’; bila menghadap ke timur dalam orientasi Ibrani kuno, sisi kiri adalah utara.
