  terminology: Nama "Hoba" dan "Damsyik" sudah tepat. "Hamba-hambanya" mempertahankan cakupan עֲבָדָיו. Catatan kaki tetap tepat untuk menjelaskan idiom arah Ibrani מִשְּׂמֹאל.
