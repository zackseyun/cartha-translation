  source_fidelity: Revisi diperlukan karena "membagi pasukan" menambahkan objek "pasukan" yang tidak terdapat dalam teks Ibrani dan dapat menyempitkan tindakan Abram beserta hamba-hambanya. Kata kerja וַיֵּחָלֵק menyatakan bahwa ia membagi diri/kelompoknya terhadap mereka. "Memukul mereka" lebih dekat dengan וַיַּכֵּם daripada "mengalahkan mereka", tanpa memaksakan hasil total.
