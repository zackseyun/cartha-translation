base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: id
  text: Setelah Abram kembali dari mengalahkan Kedorlaomer[a] dan raja-raja yang menyertainya, raja Sodom keluar menemui Abram ke Lembah Syawe[b] (yaitu Lembah Raja).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani כְּדָרלָעֹמֶר dialihaksarakan sebagai “Kedorlaomer”; dalam sejumlah tradisi bahasa lain ditemukan bentuk “Chedorlaomer”.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Lembah Syawe”; tempat ini adalah “Lembah Raja”.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; urutan peristiwa sudah dinyatakan secara alami melalui anak kalimat pembuka “Setelah Abram kembali”.
- source_word: מֶלֶךְ סְדֹם
  choice: raja Sodom
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: לִקְרָאתוֹ
  choice: untuk menemuinya
  rationale: Ungkapan ini menyatakan tujuan tindakan keluar, yakni pergi menyambut atau menemui seseorang; “menemuinya” paling netral dan alami.
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: Setelah Abram kembali
  rationale: Akhiran pronominal Ibrani merujuk kepada Abram dalam konteks sebelumnya. Nama Abram dinyatakan agar rujukan tidak keliru dipahami sebagai raja Sodom dalam susunan bahasa Indonesia.
- source_word: מֵהַכּוֹת
  choice: dari mengalahkan
  rationale: Bentuk נכה dalam konteks peperangan menyatakan kemenangan atas lawan; “mengalahkan” menyampaikan maknanya dengan jelas tanpa menambahkan bahwa semua lawan dibunuh.
- source_word: כְּדָרלָעֹמֶר
  choice: Kedorlaomer
  rationale: Nama ini dialihaksarakan secara langsung dari bentuk Ibrani dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְאֶת הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: dan raja-raja yang menyertainya
  rationale: Klausa relatif diterjemahkan secara alami; akhiran “-nya” merujuk kepada Kedorlaomer.
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: di Lembah Syawe
  rationale: Walaupun אֶל pada dasarnya menunjukkan arah, dalam bahasa Indonesia tujuan perjalanan untuk suatu pertemuan paling alami dinyatakan sebagai lokasi pertemuan dengan “di”; unsur geraknya tetap tampak dalam “keluar untuk menemuinya”.
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: (yaitu Lembah Raja)
  rationale: Klausa ini menjelaskan identitas tempat tersebut; tanda kurung dan “yaitu” mempertahankan sifatnya sebagai keterangan penjelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan kalimat diatur ulang untuk memperjelas bahwa Abramlah yang kembali dari pertempuran, sedangkan raja Sodom keluar menemuinya. Nama tempat “Syawe” dipertahankan sebagai alih aksara, dan keterangan identifikasinya disajikan dalam tanda kurung.
