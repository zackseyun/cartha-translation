  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: id
  text: Dan terpujilah Allah Yang Mahatinggi, yang telah menyerahkan musuh-musuhmu ke dalam kuasamu. Lalu ia memberikan kepadanya sepersepuluh dari semuanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyebutkan kembali subjek kata “memberikan”. Berdasarkan konteks, yang paling mungkin ialah Abram memberikan sepersepuluh kepada Melkisedek; secara tata bahasa, Melkisedek juga mungkin dipahami sebagai subjek.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: Dan terpujilah
  rationale: Mempertahankan konjungsi serta rumusan berkat predikatif dalam bahasa Indonesia yang wajar dan khidmat.
- source_word: אֵל עֶלְיוֹן
  choice: Allah Yang Mahatinggi
  rationale: Menerjemahkan gelar ilahi secara alami; עֶלְיוֹן menyatakan kedudukan tertinggi.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif yang secara alami menerangkan Allah Yang Mahatinggi.
- source_word: מִגֵּן
  choice: telah menyerahkan
  rationale: Dalam bentuk dan konteks ini berarti menyerahkan atau memberikan ke dalam kuasa seseorang, bukan melindungi.
- source_word: צָרֶיךָ
  choice: musuh-musuhmu
  rationale: Padanan modern yang jelas bagi bentuk jamak dengan sufiks orang kedua tunggal.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan idiom konkret Ibrani yang berarti ke dalam kuasa atau kendali seseorang.
- source_word: וַיִּתֶּן
  choice: Lalu ... memberikan
  rationale: Mengungkapkan urutan naratif wayyiqtol dengan bahasa Indonesia yang alami.
- source_word: לּוֹ
  choice: kepada Melkisedek
  rationale: Konteks paling wajar menunjuk Melkisedek sebagai penerima; nama diperjelas agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: מַעֲשֵׂר
  choice: sepersepuluh
  rationale: Menyampaikan arti harfiah dengan jelas tanpa memasukkan asosiasi kelembagaan yang mungkin melekat pada istilah 'persepuluhan'.
- source_word: מִכֹּל
  choice: dari semuanya
  rationale: Menyatakan bahwa bagian sepersepuluh diambil dari keseluruhan barang yang dimaksud dalam konteks.
theological_decisions:
- issue: Subjek tersirat dalam וַיִּתֶּן
  choice: 'Abram diperjelas sebagai subjek: ''Lalu Abram memberikan kepada Melkisedek ...'''
  alternative: Melkisedek dapat dipahami sebagai subjek karena teks Ibrani tidak mengulang subjek secara eksplisit.
  rationale: Konteks narasi paling alami menjadikan Abram sebagai pemberi dan Melkisedek sebagai penerima. Karena bahasa Indonesia dengan dua pronomina akan sangat rancu, rujukan kontekstual diperjelas dalam teks, sedangkan ambiguitas gramatikal Ibrani dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Idiom 'ke dalam tanganmu' dipertahankan karena mudah dipahami dan mencerminkan ungkapan Ibrani. Istilah 'sepersepuluh' dipilih daripada 'persepuluhan' demi ketepatan leksikal dan aksesibilitas.
