lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Ungkapan kolektif ini secara alami merujuk kepada para raja yang disebut sebelumnya tanpa menambahkan kata benda yang tidak terdapat dalam teks Ibrani.
- source_word: חָבְרוּ
  choice: bergabung
  rationale: Bentuk Qal dari חבר menyatakan tindakan bergabung atau bersekutu; 'bergabung' mempertahankan arti dasarnya tanpa mempertegasnya menjadi persekutuan formal.
- source_word: אֶל
  choice: di
  rationale: Walaupun אֶל lazim berarti 'ke', bersama verba berkumpul atau bergabung kata ini secara idiomatis menunjukkan tempat mereka bergabung.
- source_word: עֵמֶק הַשִּׂדִּים
  choice: Lembah Sidim
  rationale: עֵמֶק berarti lembah, sedangkan שִׂדִּים adalah nama tempat yang ditransliterasikan sebagai 'Sidim'.
- source_word: הוּא
  choice: yaitu
  rationale: Kata ganti ini memperkenalkan keterangan identifikasi yang menyamakan Lembah Sidim dengan nama geografis berikutnya.
- source_word: יָם הַמֶּלַח
  choice: Laut Garam
  rationale: Terjemahan langsung dan alami dari ungkapan Ibrani ini mempertahankan nama dalam sumber, sedangkan nama modern yang lebih dikenal diberikan dalam catatan kaki.
theological_decisions: []
translation_notes:
