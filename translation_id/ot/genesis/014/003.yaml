  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: id
  text: Mereka semua bergabung di Lembah Sidim, yaitu Laut Garam[a].
  philosophy: optimal-equivalence
  footnotes:
