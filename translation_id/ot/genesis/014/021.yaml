  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: id
  text: Lalu raja Sodom berkata kepada Abram, “Berikanlah kepadaku orang-orang itu[a], dan ambillah harta benda itu[b] untuk dirimu sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa” (tunggal dalam bahasa Ibrani), yang dipakai di sini secara kolektif untuk orang-orang yang telah direbut kembali.
    reason: lexical_alternative
  - marker: b
    text: Atau “barang-barang” atau “milik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia modern.
- source_word: מֶלֶךְ סְדֹם
  choice: raja Sodom
  rationale: Rangkaian konstruksi Ibrani diterjemahkan langsung; nama tempat dipertahankan dalam bentuk baku Indonesia.
- source_word: אֶל אַבְרָם
  choice: kepada Abram
  rationale: Preposisi אֶל bersama verba berkata secara alami diterjemahkan “kepada”; Abram adalah bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: תֶּן לִי
  choice: Serahkanlah ... kepadaku
  rationale: Dalam konteks pembagian kembali orang dan harta hasil rampasan, “serahkanlah” mengungkapkan tindakan memberikan kepada pihak yang menuntutnya dengan lebih jelas daripada sekadar “berikanlah.” Akhiran orang pertama dinyatakan dengan “kepadaku.”
- source_word: הַנֶּפֶשׁ
  choice: orang-orang itu
  rationale: נֶפֶשׁ berbentuk tunggal tetapi dipakai secara kolektif bagi orang-orang yang telah direbut kembali. Bentuk jamak Indonesia menyampaikan makna kontekstual tanpa memakai “jiwa,” yang dapat menyesatkan pembaca modern.
- source_word: וְהָרְכֻשׁ
  choice: dan ... harta benda itu
  rationale: רְכוּשׁ menunjuk pada barang milik atau kekayaan bergerak. “Harta benda” merupakan padanan Indonesia yang alami dan cukup luas; artikel Ibrani dinyatakan dengan “itu.”
- source_word: קַח לָךְ
  choice: ambillah ... untukmu sendiri
  rationale: Imperatif diterjemahkan dengan bentuk perintah sopan-tegas “ambillah,” sedangkan לָךְ menyatakan manfaat atau kepemilikan pribadi dan ditampilkan sebagai “untukmu sendiri.”
