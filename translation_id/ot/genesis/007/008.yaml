base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: id
  text: Dari antara hewan yang tahir dan dari antara hewan yang tidak tahir[a], dari antara burung-burung dan segala yang merayap di tanah—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang najis.” Secara lebih harfiah, teks Ibrani berbunyi “yang tidak tahir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: dari antara
  rationale: Preposisi ini menunjukkan bahwa anggota-anggota bahtera diambil dari setiap golongan. Ungkapan “dari antara” alami dalam bahasa Indonesia dan mempertahankan fungsi sumber/keanggotaan kategori.
- source_word: בְּהֵמָה
  choice: hewan
  rationale: Dalam daftar ini istilah tersebut berfungsi sebagai kategori umum yang dibedakan dari burung dan makhluk yang merayap; karena itu “hewan” lebih tepat daripada istilah yang terbatas pada ternak.
- source_word: טְּהוֹרָה
  choice: tahir
  rationale: “Tahir” menyampaikan klasifikasi ritual dengan jelas dan bermartabat, tanpa memberi kesan bahwa yang dimaksud hanya kebersihan fisik.
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: yang tidak tahir
  rationale: Bahasa Ibrani memakai bentuk penyangkalan harfiah, “yang tidak tahir,” bukan satu kata antonim. Bentuk analitis ini dipertahankan, sedangkan “yang najis” dicatat sebagai alternatif idiomatis.
- source_word: עוֹף
  choice: burung-burung
  rationale: Walaupun istilah Ibrani dapat mencakup makhluk terbang secara lebih luas, “burung-burung” merupakan padanan kontekstual yang paling alami dalam bahasa Indonesia modern.
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: segala yang merayap
  rationale: Pilihan ini mempertahankan gagasan verbal tentang gerak merayap sekaligus tetap ringkas dan wajar sebagai sebutan kelompok makhluk.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: Di sini אֲדָמָה menunjuk pada permukaan tanah sebagai tempat makhluk-makhluk itu bergerak; “di tanah” merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Klasifikasi hewan sebelum hukum Musa
  choice: Memakai istilah “tahir” tanpa menjelaskan dasar atau sistem klasifikasinya
  alternative: Memakai “bersih” atau menambahkan penjelasan ritual
  rationale: Teks mengandaikan klasifikasi tersebut tetapi tidak menerangkan asal atau cakupannya dalam ayat ini. Terjemahan mempertahankan ketegangan itu tanpa memasukkan penafsiran denominasi atau penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan “dari antara” mempertahankan susunan daftar Ibrani, sementara tanda pisah menunjukkan bahwa kalimat berlanjut ke ayat berikutnya.
