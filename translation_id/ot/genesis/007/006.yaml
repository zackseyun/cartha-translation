  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: id
  text: Nuh berumur enam ratus tahun, dan air bah itu menggenangi bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan air bah itu adalah air di atas bumi.” Kata yang diterjemahkan “bumi” juga dapat berarti “negeri” atau “daratan”.
    reason: Menjelaskan susunan Ibrani yang lebih harfiah serta mempertahankan kemungkinan makna lain dari הָאָרֶץ.
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: Nuh
  rationale: Nama נֹחַ memakai bentuk Indonesia yang sudah mapan. Konjungsi וְ tidak dinyatakan tersendiri pada awal ayat karena hubungan naratifnya sudah jelas dalam konteks Indonesia.
- source_word: בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: berumur enam ratus tahun
  rationale: Ungkapan Ibrani harfiah 'anak enam ratus tahun' merupakan idiom baku untuk menyatakan usia; 'berumur enam ratus tahun' menyampaikan maknanya secara alami.
- source_word: וְ/הַ/מַּבּוּל
  choice: dan air bah itu
  rationale: מַבּוּל menunjuk pada banjir besar dalam kisah ini. 'Air bah' merupakan padanan Indonesia yang alami dan bermartabat, sedangkan kata sandang diterjemahkan dengan 'itu' karena air bah tersebut sudah menjadi pokok yang tertentu dalam konteks.
- source_word: הָיָה מַיִם עַל הָאָרֶץ
  choice: menggenangi bumi
  rationale: 'Susunan harfiahnya, ''adalah air di atas bumi'', tidak alami dalam bahasa Indonesia. ''Menggenangi bumi'' mempertahankan keadaan yang dinyatakan: air bah berada di atas permukaan bumi, tanpa menambahkan hubungan waktu seperti ''ketika''.'
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Kata ini dapat berarti 'bumi' atau 'negeri/daratan'. Dalam konteks kisah air bah, 'bumi' paling sesuai, sementara kemungkinan 'negeri/daratan' dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan הָאָרֶץ
  choice: bumi
  alternative: negeri atau daratan
  rationale: Bahasa Ibrani memungkinkan makna yang lebih luas maupun lebih setempat. Konteks langsung mendukung 'bumi', tetapi terjemahan tidak menutup ambiguitas leksikalnya dan mencatat alternatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Ungkapan usia dibuat idiomatis, sedangkan struktur klausa kedua dipertahankan sedekat mungkin tanpa menghasilkan kalimat yang janggal.
