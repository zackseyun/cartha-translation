  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: id
  text: Dan yang masuk, jantan dan betina dari segala makhluk hidup[a], masuk sesuai dengan perintah Allah kepadanya. Lalu Yahweh menutup rapat di belakangnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari segala daging”; ungkapan kolektif bagi makhluk hidup.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Yahweh menutup di belakangnya.” Teks Ibrani tidak menyebut objek yang ditutup secara langsung; pintu atau jalan masuk tersirat dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: Yang masuk itu ... masuk
  rationale: Mempertahankan partisip substantival dan pengulangan verba dalam bahasa Ibrani, sekaligus menghasilkan susunan yang jelas dalam bahasa Indonesia.
- source_word: זָכָר וּנְקֵבָה
  choice: jantan dan betina
  rationale: Dalam konteks binatang yang masuk ke bahtera, pasangan istilah ini merupakan padanan Indonesia yang alami bagi pembedaan jenis kelamin.
- source_word: מִכָּל בָּשָׂר
  choice: dari segala makhluk hidup
  rationale: Preposisi מִן dipertahankan sebagai 'dari', sedangkan בָּשָׂר dipahami sebagai ungkapan kolektif bagi makhluk hidup; arti harfiahnya dijelaskan dalam catatan kaki.
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: sebagaimana telah diperintahkan Allah kepadanya
  rationale: Menyampaikan kesesuaian tindakan mereka dengan perintah Allah yang telah diberikan sebelumnya tanpa mengubah rujukan pronomina kepada Nuh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: וַיִּסְגֹּר יְהוָה בַּעֲדוֹ
  choice: Lalu Yahweh menutup pintu di belakangnya
  rationale: Dalam konteks bahtera, tindakan menutup di belakang Nuh secara alami menyiratkan pintu. Kata 'pintu' dibuat eksplisit demi kejelasan bahasa Indonesia, dengan catatan bahwa objek itu tidak disebut langsung dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi, sehingga bentuk 'Yahweh' mempertahankan perbedaan antara nama itu dan gelar אֱלֹהִים, yang diterjemahkan 'Allah'.
- issue: Subjek yang diperintah Allah
  choice: Pronomina 'kepadanya' dipertahankan
  alternative: kepada Nuh
  rationale: Bahasa Ibrani memakai pronomina maskulin tunggal yang dalam konteks merujuk kepada Nuh. Mempertahankan pronomina menghindari penambahan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda pisah membantu pembaca mengenali frasa sisipan 'jantan dan betina dari segala makhluk hidup', sementara pengulangan 'masuk' mempertahankan struktur khas teks Ibrani.
