base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: id
  text: Juga dari burung-burung di langit, tujuh-tujuh[a], jantan dan betina, untuk menjaga agar keturunan tetap hidup di seluruh muka bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuh pasang.” Secara harfiah, teks Ibrani berbunyi “tujuh, tujuh,” suatu ungkapan distributif yang dapat dipahami sebagai masing-masing tujuh atau tujuh pasang; teks utama mempertahankan bentuk Ibrani lebih dekat.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Menambahkan burung pada perintah sebelumnya mengenai binatang dengan ungkapan lanjutan yang ringkas dan alami.
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: dari burung-burung di langit
  rationale: עוֹף dalam konteks ini paling wajar diterjemahkan sebagai burung, sedangkan הַשָּׁמַיִם merujuk pada langit sebagai tempat burung terbang.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: tujuh-tujuh
  rationale: Pengulangan bilangan Ibrani mempunyai daya distributif. Bentuk ini mempertahankan susunan sumber dan tidak menutup kemungkinan makna ‘tujuh pasang’.
- source_word: זָכָר וּנְקֵבָה
  choice: jantan dan betina
  rationale: Untuk binatang dan burung, ‘jantan dan betina’ merupakan padanan Indonesia yang langsung dan idiomatis.
- source_word: לְחַיּוֹת זֶרַע
  choice: untuk menjaga agar keturunannya tetap hidup
  rationale: Bentuk kausatif חיה menyatakan pemeliharaan kehidupan, dan זֶרַע di sini menunjuk pada kelanjutan keturunan makhluk hidup, bukan benih harfiah.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: di seluruh muka bumi
  rationale: Mempertahankan gambaran idiom Ibrani tentang ‘muka bumi’ dalam bentuk yang tetap dapat dipahami pembaca Indonesia modern.
theological_decisions:
- issue: Jumlah burung yang diperintahkan untuk dibawa
  choice: Mempertahankan bentuk ‘tujuh-tujuh’ dalam teks utama
  alternative: ‘tujuh pasang’ atau ‘masing-masing tujuh’
  rationale: Ungkapan distributif Ibrani tidak perlu dipersempit secara diam-diam menjadi satu penafsiran; catatan kaki menyajikan alternatif yang lazim.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur ayat yang berupa kelanjutan perintah sebelumnya dipertahankan. Istilah ‘jantan dan betina’ dipilih sesuai konteks hewan, sedangkan ‘keturunannya tetap hidup’ menjelaskan tujuan pelestarian kehidupan tanpa menambahkan penafsiran teologis.
