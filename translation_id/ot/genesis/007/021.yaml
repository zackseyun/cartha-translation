    rationale: Padanan ini dapat mengaburkan makna שֶׁרֶץ הַשֹּׁרֵץ, yakni golongan makhluk yang berkerumun/berkeriapan secara banyak. “Makhluk yang berkerumun” memakai bahasa Indonesia modern yang lebih mudah dipahami dan tetap tidak membatasi referennya.
  - severity: low
    issue: Susunan awal kalimat kurang alami untuk gaya naratif modern.
    rationale: Pemindahan verba ke akhir klausa (“semua makhluk hidup ... mati”) menghasilkan alur Indonesia yang lebih wajar tanpa mengubah penekanan atau makna.
