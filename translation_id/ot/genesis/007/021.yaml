base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: id
  text: 'Lalu semua makhluk hidup yang bergerak di bumi mati: burung-burung, ternak, binatang liar, segala makhluk yang berkerumun di bumi, dan seluruh umat manusia[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kol ha’adam, secara harfiah “seluruh manusia”; di sini ha’adam menunjuk umat manusia secara kolektif.'
    reason: Menjelaskan bentuk Ibrani dan pemakaian kolektif ha’adam.
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: matilah
  rationale: Kata kerja גוע menyatakan kematian atau berakhirnya hidup. Bentuk “matilah” lugas, wajar, dan mempertahankan alur naratif Ibrani.
- source_word: כָּל בָּשָׂר
  choice: semua makhluk
  rationale: Secara harfiah berarti “semua daging”, tetapi dalam konteks ini menunjuk secara luas kepada makhluk hidup jasmani yang kemudian dirinci. “Semua makhluk” menyampaikan maksud itu dengan bahasa Indonesia yang alami tanpa menyiratkan bahan daging.
- source_word: הָרֹמֵשׂ
  choice: yang bergerak
  rationale: רמש dapat berarti bergerak, merayap, atau berkeriapan. Karena cakupannya meliputi burung, ternak, binatang liar, dan makhluk yang berkeriapan, istilah umum “bergerak” paling sesuai.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: “Di bumi” merupakan padanan Indonesia yang alami dan sesuai dengan cakupan kisah air bah; “di darat” mungkin secara leksikal, tetapi lebih membatasi.
- source_word: בָּעוֹף
  choice: burung-burung
  rationale: עוֹף dapat mencakup makhluk terbang, tetapi “burung-burung” adalah padanan yang jelas dan lazim dalam daftar kelompok hewan ini.
- source_word: וּבַבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה di sini menunjuk kelompok hewan peliharaan atau domestik, yang dibedakan dari binatang liar.
- source_word: וּבַחַיָּה
  choice: binatang liar
  rationale: Dalam pertentangannya dengan בְּהֵמָה, חַיָּה menunjuk hewan darat yang tidak dipelihara.
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: segala makhluk yang berkeriapan
  rationale: שֶׁרֶץ dan bentuk partisipelnya menggambarkan makhluk kecil yang bergerak banyak atau berkerumun. “Berk eriapan” secara idiomatis menangkap gerak itu, sementara “segala makhluk” tidak mempersempitnya hanya pada hewan yang merayap.
- source_word: וְכֹל הָאָדָם
  choice: dan seluruh umat manusia
  rationale: הָאָדָם dipakai secara kolektif untuk ras manusia, bukan hanya laki-laki atau seorang individu. “Seluruh umat manusia” jelas, inklusif, dan sesuai dengan nada khidmat ayat.
theological_decisions:
- issue: Makna kolektif הָאָדָם
  choice: seluruh umat manusia
  alternative: semua manusia; setiap orang
  rationale: Artikel dan konteks mendukung pemakaian אָדָם secara kolektif bagi umat manusia. Terjemahan tidak membatasinya kepada laki-laki dan tidak mengubah kolektif Ibrani menjadi penekanan distributif tanpa alasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Daftar kategori makhluk dipertahankan dengan susunan yang dekat dengan teks Ibrani. Penanda catatan kaki ditempatkan setelah “umat manusia”, yaitu unsur yang diterangkan oleh catatan tersebut.
