id: GEN.7.11
reference: Genesis 7:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: id
  text: Pada tahun ke-600 kehidupan Nuh, pada bulan kedua, pada hari ketujuh belas bulan itu, tepat pada hari itu, semua mata air samudra raya[a] terbelah, dan jendela-jendela langit[b] terbuka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sumber-sumber air samudra raya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pintu-pintu air di langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: Pada tahun keenam ratus kehidupan Nuh
  rationale: Mempertahankan rumus penanggalan Ibrani berdasarkan usia Nuh dalam susunan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: pada bulan kedua
  rationale: Padanan temporal yang langsung, jelas, dan alami.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: pada hari ketujuh belas bulan itu
  rationale: Bilangan pokok dalam konstruksi tanggal Ibrani secara idiomatis dinyatakan sebagai bilangan bertingkat dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַזֶּה
  choice: tepat pada hari itu
  rationale: Kata 'tepat' menyampaikan penegasan pada hari yang baru saja ditentukan tanpa menjadikannya berlebihan.
- source_word: נִבְקְעוּ
  choice: terbelah
  rationale: Bentuk pasif nifal dari בקע menyatakan bahwa sesuatu terbelah atau terpecah terbuka; 'terbelah' mempertahankan bentuk dan daya gambar teks sumber.
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: semua mata air samudra raya
  rationale: '''Mata air'' merupakan padanan modern yang mudah dipahami untuk מַעְיָן, sedangkan ''samudra raya'' mempertahankan gambaran תְּהוֹם sebagai perairan dalam purba yang amat besar.'
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: dan jendela-jendela langit
  rationale: Mempertahankan citra konkret serta bentuk jamak Ibrani, dengan kata Indonesia yang lebih umum daripada 'tingkap'.
- source_word: נִפְתָּחוּ
  choice: terbuka
  rationale: Menyampaikan keadaan pasif nifal secara alami dalam bahasa Indonesia dan menjaga kesejajaran dengan 'terbelah'.
theological_decisions:
- issue: Gambaran kosmis tentang datangnya air bah
  choice: Mempertahankan ungkapan 'samudra raya' dan 'jendela-jendela langit' sebagai citra teks.
  alternative: Menjelaskannya sebagai air bawah tanah yang menyembur dan pintu air di atmosfer.
  rationale: Teks memakai gambaran kosmis kuno sebagai bagian dari kekuatan narasinya. Terjemahan tidak perlu menaturalisasi atau menyelaraskannya dengan uraian ilmiah modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pengulangan unsur tanggal dipertahankan karena penting bagi ketepatan dan penekanan teks Ibrani. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya; susunan penanda dalam lapisan konsultasi Inggris tampaknya tidak selaras dengan isi catatannya.
