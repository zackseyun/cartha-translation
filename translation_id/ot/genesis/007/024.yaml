base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: id
  text: Air itu berkuasa atas bumi selama 150 hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas daratan”; kata Ibrani אֶרֶץ dapat berarti “bumi” atau “daratan”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: terus berkuasa
  rationale: Bentuk Qal wayyiqtol dari גבר menyatakan bahwa air menjadi kuat atau tetap menguasai. Dalam konteks air bah, “terus berkuasa” mempertahankan gambaran dominasi air sekaligus kesinambungan narasi.
- source_word: הַמַּיִם
  choice: Air itu
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, bahasa Indonesia lazim memakai nomina massa tunggal “air”; kata penunjuk “itu” menandai air yang telah disebut dalam konteks.
- source_word: עַל הָאָרֶץ
  choice: atas bumi
  rationale: עַל berarti “atas/di atas”, sedangkan אֶרֶץ dapat berarti “bumi” atau “negeri/daratan”. Konteks narasi air bah mendukung “bumi”, tetapi alternatif leksikal tetap dicatat.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: selama 150 hari
  rationale: Ungkapan bilangan Ibrani secara harfiah tersusun “lima puluh dan seratus hari”; dalam bahasa Indonesia dinyatakan secara alami sebagai durasi “selama 150 hari”.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam narasi air bah
  choice: bumi
  alternative: negeri atau daratan
  rationale: Bahasa universal dalam konteks langsung lebih mendukung “bumi”, tanpa menutup kemungkinan leksikal bahwa אֶרֶץ dalam konteks lain dapat berarti “negeri” atau “daratan”.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. “Terus berkuasa” dipilih untuk menyampaikan kekuatan serta dominasi air secara alami, bukan sekadar pertambahan volumenya.
