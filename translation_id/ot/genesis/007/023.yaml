id: GEN.7.23
reference: Genesis 7:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: id
  text: Ia menghapuskan segala makhluk hidup yang ada di muka tanah[a]—mulai dari manusia[b] sampai ternak, binatang melata, dan burung-burung di langit[c]. Semuanya dihapuskan dari bumi. Yang tersisa hanyalah Nuh serta segala yang bersamanya di dalam bahtera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melenyapkan”; kata kerja Ibrani yang diterjemahkan “menghapuskan” menggambarkan tindakan mengusap sampai lenyap atau menghapus.
    reason: lexical_alternative
  - marker: b
    text: “Manusia” menerjemahkan kata Ibrani adam, yang di sini digunakan secara umum untuk umat manusia.
    reason: lexical_alternative
  - marker: c
    text: Atau “burung-burung di cakrawala.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: menghapuskan / dihapuskan
  rationale: Kata kerja מחה membawa gambaran mengusap sampai lenyap atau menghapus. Pilihan ini mempertahankan citra Ibrani, sedangkan bentuk pasif pada kemunculan kedua tercermin dalam “dihapuskan”.
- source_word: כָּל הַיְקוּם
  choice: segala yang hidup
  rationale: Dalam konteks air bah, היקום menunjuk kepada semua yang berdiri atau ada sebagai makhluk hidup di darat, bukan kepada konsep abstrak “keberadaan”.
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: dari muka tanah
  rationale: Ungkapan ini mempertahankan citra idiom Ibrani. Preposisi “dari” dipakai secara alami dalam bahasa Indonesia bersama verba “menghapuskan”, dengan makna menyingkirkan sesuatu yang berada pada muka tanah.
- source_word: מֵאָדָם
  choice: dari manusia
  rationale: אָדָם di sini digunakan secara representatif untuk umat manusia dan mengawali daftar golongan makhluk.
- source_word: בְּהֵמָה
  choice: ternak
  rationale: “Ternak” merupakan padanan modern yang jelas bagi hewan darat peliharaan dan tidak sesempit “lembu”.
- source_word: רֶמֶשׂ
  choice: binatang melata
  rationale: Istilah ini menunjuk kepada makhluk kecil yang bergerak dekat permukaan tanah; “binatang melata” adalah ungkapan Indonesia yang lazim dalam konteks penciptaan dan air bah.
- source_word: עוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: Padanan ini alami dalam bahasa Indonesia dan menyampaikan tempat burung terbang tanpa membuat bentuk jamak Ibrani שׁמים terdengar kaku.
- source_word: מִן הָאָרֶץ
  choice: dari bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri”; “bumi” paling sesuai dengan cakupan naratif ayat ini tanpa menambahkan pernyataan ilmiah di luar teks.
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: Hanya Nuh yang tersisa
  rationale: “Hanya” menyampaikan partikel pembatas אַךְ, sedangkan “yang tersisa” secara alami mencerminkan שׁאר.
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: bersama mereka yang ada dengannya di dalam bahtera
  rationale: Frasa ini mencakup semua pendamping Nuh di bahtera tanpa membatasi rujukannya hanya kepada manusia; “bahtera” adalah padanan baku תֵּבָה dalam kisah Nuh.
theological_decisions:
- issue: Cakupan kebinasaan dalam bahasa kisah air bah
  choice: Menerjemahkan secara langsung bahwa semua golongan makhluk darat yang disebut dalam ayat dihapuskan dari bumi.
  alternative: Menafsirkannya secara eksplisit sebagai hiperbola regional atau sebagai pernyataan ilmiah global.
  rationale: Terjemahan mempertahankan daya pernyataan narasi Ibrani tanpa memasukkan penyelesaian terhadap perdebatan mengenai luas geografis air bah.
- issue: Cakupan pihak yang bersama Nuh
  choice: Menggunakan “mereka yang ada dengannya” agar dapat mencakup manusia dan makhluk hidup lain di bahtera.
  alternative: “Orang-orang yang ada dengannya”, yang akan membatasi rujukan kepada manusia.
  rationale: Bentuk Ibrani וַאֲשֶׁר tidak secara eksplisit membatasi anteseden kepada manusia, dan konteks bahtera mencakup manusia serta hewan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “menghapuskan/dihapuskan” dipertahankan untuk mencerminkan pengulangan akar מחה. Tanda pisah membantu pembaca mengikuti daftar golongan makhluk. Semua penanda catatan kaki muncul dalam teks utama.
