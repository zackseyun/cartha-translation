  to: Ia menghapuskan segala makhluk hidup yang ada di muka tanah[a]—mulai dari manusia[b] sampai ternak, binatang melata, dan burung-burung di langit[c]. Semuanya dihapuskan dari bumi. Yang tersisa hanyalah Nuh serta segala yang bersamanya di dalam bahtera.
