  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: id
  text: Dua demi dua[a], jantan dan betina, mereka datang kepada Nuh ke dalam bahtera, tepat seperti yang telah Allah perintahkan kepada Nuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpasang-pasangan”; secara harfiah, “dua-dua.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: dua demi dua
  rationale: Pengulangan bilangan ini menyatakan pembagian secara berpasangan. “Dua demi dua” mempertahankan bentuk dan daya distributif teks Ibrani, sekaligus tetap mudah dipahami dalam bahasa Indonesia.
- source_word: בָּאוּ
  choice: datang ... dan masuk
  rationale: בוא adalah verba gerak yang dapat berarti datang atau masuk menurut konteks. Karena gerak itu diarahkan kepada Nuh dan ke bagian dalam bahtera, ungkapan ini menyampaikan kedua unsur tujuan secara wajar dalam bahasa Indonesia tanpa mengubahnya menjadi dua tindakan yang terpisah secara tegas.
- source_word: אֶל נֹחַ
  choice: kepada Nuh
  rationale: Preposisi אֶל menunjukkan gerak menuju Nuh; “kepada Nuh” merupakan padanan Indonesia yang alami.
- source_word: אֶל הַתֵּבָה
  choice: masuk ke dalam bahtera
  rationale: Dalam konteks verba gerak, tujuan yang berupa bahtera menyiratkan masuk ke bagian dalamnya. Bahasa Indonesia membutuhkan ungkapan verbal yang lebih eksplisit agar rangkaian dua frasa tujuan tidak terasa janggal.
- source_word: זָכָר וּנְקֵבָה
  choice: yang jantan dan yang betina
  rationale: Istilah ini menunjuk pada jenis kelamin biologis hewan. Bentuk dengan “yang” membuat frasa tersebut berfungsi alami sebagai subjek dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Partikel ini menyatakan kesesuaian dengan perintah yang telah diberikan; “tepat seperti” menampilkan kesesuaian itu dengan jelas.
- source_word: צִוָּה אֱלֹהִים
  choice: telah Allah perintahkan
  rationale: Bentuk perfektif menunjuk pada perintah Allah yang mendahului kedatangan hewan-hewan tersebut. “Telah” membuat urutan waktunya jelas secara alami.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, אֱלֹהִים menunjuk kepada Allah yang esa; “Allah” adalah padanan baku dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku dan mekanisme kedatangan hewan-hewan
  choice: Ayat menyatakan bahwa hewan-hewan datang kepada Nuh sesuai dengan perintah Allah, tanpa menjelaskan mekanisme kedatangan itu.
  alternative: Menjelaskan bahwa hewan-hewan datang semata-mata karena naluri atau bahwa Nuh sendiri mengumpulkan semuanya.
  rationale: Teks menekankan kesesuaian peristiwa dengan perintah Allah, tetapi tidak menerangkan bagaimana kedatangan itu berlangsung. Terjemahan tidak menambahkan penjelasan yang tidak terdapat dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penekanan awal pada kedatangan dua demi dua. Frasa “datang kepada Nuh dan masuk ke dalam bahtera” dipakai untuk mengungkapkan secara alami dua frasa tujuan Ibrani yang mengikuti satu verba gerak.
