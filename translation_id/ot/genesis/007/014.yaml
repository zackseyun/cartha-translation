  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵ֜מָּה וְ/כָל הַֽ/חַיָּ֣ה לְ/מִינָ֗/הּ וְ/כָל הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ לְ/מִינֵ֑/הוּ וְ/כָל הָ/ע֣וֹף לְ/מִינֵ֔/הוּ כֹּ֖ל צִפּ֥וֹר כָּל כָּנָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: id
  text: mereka[a], dan segala binatang liar menurut jenisnya, segala hewan ternak menurut jenisnya, segala binatang melata yang merayap di atas bumi menurut jenisnya, dan segala burung menurut jenisnya—setiap burung, setiap makhluk bersayap.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” melanjutkan kalimat dari ayat sebelumnya dan merujuk kepada Nuh serta semua yang masuk ke dalam bahtera bersamanya.
    reason: contextual_clarification
  - marker: b
    text: Secara harfiah, “setiap burung, setiap sayap.” Dalam bahasa Ibrani, “sayap” dipakai untuk menunjuk secara metonimis kepada makhluk bersayap; rangkaian ini menegaskan seluruh kelompok burung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina orang ketiga jamak ini merujuk kembali kepada Nuh dan semua yang bersama dia; “mereka” paling alami dalam konteks kalimat yang berlanjut dari ayat sebelumnya.
- source_word: הַחַיָּה
  choice: binatang liar
  rationale: Dalam klasifikasi binatang di Kitab Kejadian, חַיָּה dibedakan dari בְּהֵמָה dan lazimnya menunjuk pada binatang darat liar.
- source_word: הַבְּהֵמָה
  choice: hewan ternak
  rationale: Istilah ini menunjuk pada binatang piaraan atau ternak dan mempertahankan perbedaannya dari binatang liar tanpa mempersempitnya hanya pada sapi.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk klasifikasi מִין dalam kisah penciptaan dan air bah.
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל־הָאָרֶץ
  choice: binatang melata yang merayap di atas bumi
  rationale: “Melata” dan “merayap” mempertahankan gema antara nomina רֶמֶשׂ dan partisipiumnya, sekaligus menunjukkan makhluk kecil yang bergerak dekat permukaan tanah.
- source_word: הָעוֹף
  choice: burung
  rationale: Walaupun עוֹף dapat mencakup makhluk terbang secara lebih luas, aposisi berikutnya mengarahkan ungkapan ini kepada burung.
- source_word: כֹּל צִפּוֹר כָּל־כָּנָף
  choice: setiap burung, segala yang bersayap
  rationale: Terjemahan ini mempertahankan dua unsur aposisional bahasa Ibrani dan tidak meleburkan ungkapan harfiah “segala sayap” sepenuhnya menjadi satu kategori.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “menurut jenisnya” dipertahankan karena merupakan ciri retoris dan klasifikatoris teks Ibrani. Ayat sengaja dimulai dengan huruf kecil karena merupakan lanjutan sintaksis dari ayat sebelumnya.
