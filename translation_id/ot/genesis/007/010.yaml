translation:
  language: id
  text: Setelah tujuh hari[a], air bah itu ada di atas bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Lalu terjadilah, setelah tujuh hari, dan air bah itu ada di atas bumi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “negeri” atau “daratan”. Kata Ibrani אֶרֶץ dapat berarti “bumi”, “negeri”, atau “daratan”, tergantung konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: Setelah tujuh hari
  rationale: Ungkapan ini secara harfiah menyatakan bahwa peristiwa itu terjadi ketika jangka tujuh hari telah tercapai. Dalam bahasa Indonesia, “Setelah tujuh hari” menyampaikan peralihan waktu tersebut dengan alami.
- source_word: וּמֵי הַמַּבּוּל
  choice: air bah
  rationale: מֵי הַמַּבּוּל berarti “air dari banjir besar itu.” “Air bah” merupakan ungkapan Indonesia yang alami dan khas untuk banjir besar dalam kisah Nuh, tanpa perlu menerjemahkan bentuk jamak Ibrani secara kaku.
- source_word: הָיוּ עַל
  choice: melanda
  rationale: Secara harfiah berarti “ada di atas,” tetapi dalam urutan narasi bentuk ini mengabarkan datangnya air bah ke atas bumi. “Melanda” menyampaikan sifat peristiwa itu secara idiomatis tanpa menambahkan penyebab atau hasil yang tidak dinyatakan.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri/daratan.” Dalam konteks kisah air bah, “bumi” merupakan pilihan utama yang paling sesuai, sementara kemungkinan “negeri/daratan” dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam kisah air bah
  choice: bumi
  alternative: negeri atau daratan
  rationale: Kata Ibrani ini memiliki rentang makna yang mencakup bumi secara luas maupun suatu wilayah. Konteks narasi mendukung “bumi” sebagai teks utama, tetapi terjemahan tidak memakai ungkapan tambahan yang secara tersendiri memutuskan seluruh perdebatan tentang cakupan geografis air bah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Air bah” dipilih sebagai istilah yang dikenal luas dan bermartabat untuk מַבּוּל; susunan kalimat dibuat alami sambil mempertahankan penanda waktu serta ambiguitas leksikal אֶרֶץ melalui catatan kaki.
