  choice: selama empat puluh hari dan empat puluh malam
  rationale: Kata “selama” memperjelas fungsi duratif frasa waktu dalam bahasa Indonesia; bentuk tunggal Ibrani kolektif diterjemahkan dengan bentuk Indonesia yang wajar.
