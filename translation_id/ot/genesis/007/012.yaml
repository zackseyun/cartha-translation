  source_fidelity: Teks Ibrani menyatakan bahwa hujan terjadi/turun על הארץ, yakni menimpa atau turun di atas bumi, selama empat puluh hari dan empat puluh malam. Draf tepat dalam subjek dan durasi, tetapi «turun ke atas bumi» tidak tepat dalam bahasa Indonesia dan mengaburkan arah/relasi yang dimaksud.
