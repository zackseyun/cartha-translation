  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: id
  text: Nuh melakukan segala sesuatu sesuai dengan yang diperintahkan Yahweh kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה memiliki arti luas, ‘melakukan/membuat’. Dalam konstruksi yang menyatakan kesesuaian dengan suatu perintah, ‘melakukan’ paling alami dan tidak menambahkan penafsiran yang tidak tersurat.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia untuk נֹחַ.
- source_word: כְּכֹל
  choice: segala sesuatu sesuai dengan
  rationale: Gabungan כ dan כֹּל menyatakan kesesuaian yang menyeluruh. Rumusan ini mempertahankan baik kelengkapan maupun nuansa ‘sesuai dengan’ dalam bahasa Indonesia yang wajar.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia yang alami untuk memperkenalkan isi perintah.
- source_word: צִוָּהוּ
  choice: diperintahkan ... kepadanya
  rationale: צוה berarti ‘memerintahkan’. Bentuk pasif relatif ini alami dalam susunan Indonesia dan sufiks objek -הוּ dinyatakan dengan ‘kepadanya’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai tetragramaton sebagai nama ilahi. ‘Yahweh’ mempertahankan nama tersebut melalui transliterasi tanpa menggantinya dengan gelar atau memilih bentuk alternatif ‘Yehuwa’.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan penekanan teks Ibrani pada ketaatan Nuh yang menyeluruh, tanpa menambahkan penjelasan teologis. Catatan kaki Inggris tidak dipertahankan karena hanya mengulang secara harfiah bunyi teks dan tidak menyajikan varian tekstual atau ambiguitas yang perlu dijelaskan.
