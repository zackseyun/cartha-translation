  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: id
  text: Air itu semakin menguasai bumi dan sangat bertambah, dan bahtera itu bergerak di atas permukaan air.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengapung di permukaan air.” Secara harfiah, bahasa Ibraninya berbunyi “berjalan di atas muka air,” suatu ungkapan yang menggambarkan gerakan di permukaan air.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: semakin kuat
  rationale: Kata גבר menyatakan bahwa air menjadi kuat atau berkuasa. Pilihan ini mempertahankan gambaran kekuatan air tanpa sekadar menyamakannya dengan kenaikan permukaan.
- source_word: הַמַּיִם
  choice: air itu
  rationale: Walaupun bentuk Ibraninya jamak, bahasa Indonesia secara alami memakai kata benda massa tunggal 'air'; penunjuk 'itu' menandai air bah yang sedang dibicarakan.
- source_word: וַיִּרְבּוּ מְאֹד
  choice: bertambah sangat banyak
  rationale: Menerjemahkan verba רבה dan penguat מְאֹד secara langsung sambil mempertahankan penekanan pada pertambahan air.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'tanah/negeri'; dalam konteks kisah air bah, 'bumi' merupakan padanan alami tanpa menentukan lebih jauh daripada konteks.
- source_word: וַתֵּלֶךְ
  choice: bergerak
  rationale: הלך secara harfiah berarti 'berjalan/pergi', tetapi dengan bahtera sebagai subjek, 'bergerak' menyampaikan perpindahan tanpa menetapkan apakah bahtera itu hanyut atau bergerak dengan cara lain.
- source_word: הַתֵּבָה
  choice: bahtera
  rationale: Padanan Indonesia yang mapan dan sesuai konteks bagi תֵּבָה dalam kisah Nuh.
- source_word: עַל פְּנֵי הַמָּיִם
  choice: di atas permukaan air
  rationale: Ungkapan harfiah 'di atas muka air' merupakan idiom yang menunjuk permukaan air; padanan ini jelas dan alami dalam bahasa Indonesia modern.
