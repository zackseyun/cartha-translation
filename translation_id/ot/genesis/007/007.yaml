  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: id
  text: Lalu Nuh, bersama anak-anak lelakinya, istrinya, dan istri-istri anak-anak lelakinya, masuk ke dalam bahtera karena air bah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Kata kerja בוא dapat berarti datang, pergi, atau masuk sesuai konteks. Dengan arah menuju bahtera, “masuk” paling wajar dan tepat.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: בָנָיו
  choice: anak-anak lelakinya
  rationale: Bahasa Ibrani secara khusus menyebut anak-anak laki-laki, bukan anak-anak secara umum.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Dalam konteks ini אִשָּׁה dengan sufiks posesif jelas berarti istri.
- source_word: נְשֵׁי בָנָיו
  choice: istri anak-anak lelakinya
  rationale: Mencerminkan secara langsung frasa konstruksi Ibrani “istri-istri dari anak-anak lelakinya” dengan ungkapan Indonesia yang alami.
- source_word: אִתּוֹ
  choice: yang menyertainya
  rationale: Menjaga unsur eksplisit “bersamanya” dalam teks Ibrani sambil menghindari pengulangan kata “bersama” yang terasa kaku.
- source_word: אֶל הַתֵּבָה
  choice: ke dalam bahtera
  rationale: Preposisi arah אֶל dan konteks kata kerja menunjukkan gerak masuk ke bahtera; “ke dalam” menyatakannya secara alami.
- source_word: מִפְּנֵי
  choice: karena
  rationale: Dalam konteks ini preposisi tersebut menyatakan sebab atau alasan tindakan Nuh.
- source_word: מֵי הַמַּבּוּל
  choice: air bah itu
  rationale: מַבּוּל menunjuk pada air bah yang sudah dikenal dalam konteks; bentuk ini ringkas, alami, dan tetap mempertahankan unsur air.
