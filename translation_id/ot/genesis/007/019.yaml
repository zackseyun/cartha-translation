  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: id
  text: Air itu sangat dahsyat menguasai bumi[a], dan semua gunung tinggi yang di bawah seluruh langit[b] ditutupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “negeri” atau “daratan.” Kata Ibrani אֶרֶץ dapat memiliki arti-arti tersebut sesuai konteks.
    reason: alternative_reading
  - marker: b
    text: Secara lebih harfiah, “di bawah segala langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ
  choice: meluap
  rationale: Dalam konteks air bah, verba ini menggambarkan air yang menjadi kuat atau berjaya; “meluap” menyampaikan gerak dan daya air secara alami dalam bahasa Indonesia tanpa mereduksinya menjadi sekadar “bertambah”.
- source_word: מְאֹד מְאֹד
  choice: dengan amat sangat dahsyat
  rationale: Pengulangan מְאֹד memberi penegasan yang luar biasa kuat. Ungkapan ini mempertahankan intensitas tersebut dalam bahasa Indonesia yang jelas dan bermartabat.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: עַל berarti “di atas/atas,” sedangkan אֶרֶץ dapat berarti “bumi” atau “negeri/daratan.” “Bumi” sesuai dengan cakupan luas yang dinyatakan ayat ini, sementara kemungkinan lain dicatat dalam catatan kaki.
- source_word: וַיְכֻסּוּ
  choice: tertutup
  rationale: Bentuk ini menyatakan bahwa gunung-gunung tertutup oleh air. Bentuk pasif “tertutup” alami dalam bahasa Indonesia dan mempertahankan fokus teks pada keadaan gunung-gunung.
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: semua gunung tinggi
  rationale: Terjemahan ini mempertahankan cakupan כָּל, nomina הָרִים, dan sifat גְּבֹהִים secara langsung serta alami.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: di bawah seluruh langit
  rationale: “Seluruh langit” merupakan ungkapan Indonesia yang alami untuk cakupan menyeluruh frasa Ibrani ini. Bentuk Ibrani yang secara morfologis jamak dicatat sebagai alternatif.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam kisah air bah
  choice: bumi
  alternative: negeri atau daratan
  rationale: Bahasa ayat ini, khususnya “di bawah seluruh langit,” menyajikan cakupan air dalam istilah universal di dalam narasi. “Bumi” mempertahankan penyajian tersebut tanpa memasukkan klaim ilmiah modern yang melampaui teks; keluasan semantis אֶרֶץ tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat mengikuti alur Ibrani, sedangkan pilihan “meluap” dan “seluruh langit” menjaga kealamian bagi pembaca umum. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
