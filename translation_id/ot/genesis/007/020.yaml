  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: id
  text: Air itu meninggi lima belas hasta, dan gunung-gunung pun tertutup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ
  choice: naik
  rationale: Dalam konteks meningkatnya air bah, verba yang secara dasar berarti menjadi kuat atau menguasai secara alami menyatakan bahwa permukaan air terus meninggi.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: lima belas hasta
  rationale: Mempertahankan satuan ukuran kuno teks sumber; satu hasta kira-kira panjang lengan bawah, tetapi ukuran tepatnya dapat bervariasi.
- source_word: מִלְמַעְלָה
  choice: lebih tinggi
  rationale: Menyampaikan arah atau pertambahan ke atas tanpa menambahkan acuan perbandingan yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: dan gunung-gunung pun tertutup
  rationale: Bentuk pasif dan hubungan koordinatif teks sumber dipertahankan; partikel 'pun' menandai hasil lanjutan secara alami tanpa mengubahnya menjadi hubungan sebab-akibat yang eksplisit.
theological_decisions:
- issue: Acuan ukuran lima belas hasta
  choice: Tidak menyebut secara eksplisit bahwa air berada lima belas hasta di atas puncak gunung
  alternative: Air naik sampai lima belas hasta di atas gunung-gunung
  rationale: Teks Ibrani menyatakan pertambahan 'ke atas/lebih tinggi' lalu bahwa gunung-gunung tertutup, tetapi tidak menyatakan objek pembanding secara eksplisit. Terjemahan mempertahankan ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah tradisional 'hasta' dipertahankan karena lazim dalam terjemahan Alkitab dan menghindari konversi modern yang memberi kesan ketepatan palsu.
