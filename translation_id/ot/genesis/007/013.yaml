base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: id
  text: Pada hari itu juga, Nuh masuk ke dalam bahtera[a] bersama Sem, Ham, dan Yafet, anak-anak Nuh, istri Nuh, serta ketiga istri anak-anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang ke bahtera”; dalam konteks, maksudnya adalah masuk ke dalam bahtera.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Pada hari itu juga
  rationale: Ungkapan בְּעֶצֶם dengan 'hari' menegaskan bahwa peristiwa terjadi tepat pada hari yang disebutkan; 'pada hari itu juga' menyampaikan penekanan ini secara alami dalam bahasa Indonesia.
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: masuk ke dalam bahtera
  rationale: בָּא secara harfiah berarti 'datang', tetapi bersama אֶל dan tujuan berupa bahtera, konteks menunjukkan gerak masuk. Ungkapan ini alami sekaligus mempertahankan arah yang dinyatakan sumber.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: bersama Sem, Ham, dan Yafet, anak-anak Nuh
  rationale: '''Bersama'' memperjelas bahwa nama-nama berikut menyertai Nuh, sedangkan aposisi ''anak-anak Nuh'' mempertahankan identifikasi dalam bahasa Ibrani.'
- source_word: וְאֵשֶׁת נֹחַ
  choice: serta istri Nuh
  rationale: Frasa konstruksi diterjemahkan secara alami; 'serta' membantu mengatur daftar panjang tanpa mengubah hubungan antaranggotanya.
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: dan ketiga istri anak-anaknya
  rationale: Terjemahan ini mempertahankan jumlah tiga dan hubungan bahwa mereka adalah istri dari anak-anak laki-laki Nuh; dalam konteks, 'anak-anaknya' jelas merujuk kepada Nuh.
- source_word: אִתָּם
  choice: bersama mereka
  rationale: Pronomina Ibrani berbentuk jamak maskulin. Terjemahan langsung mempertahankan rujukan jamak yang secara alami menunjuk kepada kelompok keluarga yang telah disebutkan.
