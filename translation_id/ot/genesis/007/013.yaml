  to: Pada hari itu juga, Nuh masuk ke dalam bahtera[a] bersama Sem, Ham, dan Yafet, anak-anak Nuh, istri Nuh, serta ketiga istri anak-anaknya.
  rationale: Revisi menghilangkan pengulangan “bersama mereka” yang tidak alami dalam bahasa Indonesia. Makna אִתָּם tetap tersampaikan melalui “bersama” yang mencakup seluruh daftar orang yang masuk dengan Nuh. Catatan b dihapus karena rujukan pronomina tidak lagi dieksplisitkan dalam terjemahan dan tidak diperlukan untuk pembacaan yang setia serta alami.
