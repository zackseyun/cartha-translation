  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: id
  text: Sebab tujuh hari lagi Aku akan menurunkan hujan ke bumi selama empat puluh hari dan empat puluh malam. Aku akan menghapuskan[a] semua yang hidup yang telah Kubuat dari muka tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melenyapkan” atau “menyapu bersih.” Kata Ibrani yang diterjemahkan “menghapuskan” menggambarkan tindakan menghapus atau menyapu bersih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan bagi perintah pada ayat sebelumnya.
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: tujuh hari lagi
  rationale: Ungkapan Ibrani menyatakan bahwa masih ada tujuh hari sebelum hujan mulai turun; bentuk ini alami dalam bahasa Indonesia.
- source_word: אָנֹכִי מַמְטִיר
  choice: Aku akan menurunkan hujan
  rationale: Bentuk kausatif verba Ibrani menegaskan bahwa Allah menyebabkan hujan turun; pilihan ini jelas dan idiomatis.
- source_word: עַל הָאָרֶץ
  choice: ke atas bumi
  rationale: Bumi mempertahankan cakupan luas אֶרֶץ dalam konteks air bah dan membedakannya dari אֲדָמָה pada akhir ayat.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: selama empat puluh hari dan empat puluh malam
  rationale: Kata 'selama' memperjelas fungsi frasa sebagai durasi tanpa mengubah maknanya.
- source_word: וּמָחִיתִי
  choice: Aku akan menghapuskan
  rationale: Mempertahankan gambaran dasar מחה, yaitu menghapus atau melenyapkan, dalam ungkapan Indonesia yang bermartabat.
- source_word: כָּל הַיְקוּם
  choice: segala yang hidup
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada keseluruhan makhluk hidup yang berdiri atau ada di muka tanah, tanpa memperluasnya menjadi seluruh eksistensi.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang telah Kubuat
  rationale: Bentuk perfektif Indonesia menghubungkan tindakan penciptaan sebelumnya dengan penghakiman yang akan datang.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari muka tanah
  rationale: Mempertahankan idiom 'muka tanah' serta membedakan אֲדָמָה dari אֶרֶץ yang diterjemahkan 'bumi'.
theological_decisions:
- issue: Cakupan penghakiman air bah dalam אֶרֶץ dan הַיְקוּם
  choice: Menggunakan bahasa luas, yakni 'bumi' dan 'segala yang hidup', tanpa membatasi peristiwa itu sebagai penghakiman setempat.
  alternative: Menerjemahkan אֶרֶץ sebagai 'negeri' atau 'daratan', yang dapat memberi kesan cakupan regional.
  rationale: Bahasa ayat ini bersifat menyeluruh dalam konteks penghakiman atas yang telah Allah buat. Terjemahan mempertahankan daya ungkap itu tanpa memasukkan kesimpulan ilmiah atau doktrinal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kapitalisasi pada 'Aku' dan bentuk terikat 'Kubuat' menandai bahwa penuturnya adalah Allah. Susunan kalimat kedua mengikuti alur Ibrani sambil tetap alami dalam bahasa Indonesia.
