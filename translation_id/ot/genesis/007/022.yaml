  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: id
  text: Semua yang ada di daratan kering dan memiliki napas kehidupan[a] di dalam lubang hidungnya mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “napas roh kehidupan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: Semua yang
  rationale: Ungkapan ini mencakup seluruh makhluk yang memenuhi keterangan berikutnya, baik manusia maupun hewan.
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: napas kehidupan
  rationale: Rangkaian Ibrani ini secara harfiah memuat unsur 'napas', 'roh/hembusan', dan 'kehidupan', tetapi secara idiomatis menunjuk pada napas yang menandai kehidupan. Terjemahan ini alami dalam bahasa Indonesia tanpa meniadakan bentuk lengkapnya, yang dicatat dalam catatan kaki.
- source_word: בְּאַפָּיו
  choice: di dalam lubang hidungnya
  rationale: Bentuk Ibrani memakai sufiks tunggal distributif; bentuk -nya dalam bahasa Indonesia tetap wajar dan tidak membatasi acuannya hanya kepada manusia.
- source_word: מִכֹּל אֲשֶׁר בֶּחָרָבָה
  choice: yang ada di daratan kering
  rationale: Frasa ini membatasi cakupan pada makhluk di tanah kering, berbeda dari kehidupan air dalam konteks air bah.
- source_word: מֵתוּ
  choice: mati
  rationale: Kata kerja ini secara langsung menyatakan bahwa semua makhluk tersebut mati.
theological_decisions:
- issue: Makna רוּחַ dalam rangkaian נִשְׁמַת רוּחַ חַיִּים
  choice: Diterjemahkan secara idiomatis sebagai 'napas kehidupan' dalam teks utama.
  alternative: napas roh kehidupan
  rationale: Dalam konteks ini רוּחַ dapat berarti roh, hembusan, atau napas. Terjemahan utama menghindari kesan adanya lapisan metafisis yang belum tentu dimaksudkan, sedangkan bentuk Ibrani yang lebih harfiah tetap disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan relatif Ibrani dipertahankan sejauh tetap alami, dan cakupan ayat pada makhluk di daratan kering dibuat jelas.
