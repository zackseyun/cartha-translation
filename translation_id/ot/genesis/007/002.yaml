source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: id
  text: Dari setiap binatang yang tahir, ambillah bagimu tujuh pasang[a], jantan dan betinanya; dan dari binatang yang tidak tahir, dua ekor[b], jantan dan betinanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “tujuh tujuh, jantan dan betinanya.” Kemungkinan besar maksudnya tujuh pasang, meskipun ada yang memahaminya sebagai tujuh ekor binatang.
    reason: alternative_reading
  - marker: b
    text: Atau “binatang yang najis.” Bahasa Ibrani berbunyi “binatang yang tidak tahir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: Dari setiap binatang
  rationale: מִן dengan כֹּל menyatakan pemilihan dari tiap jenis dalam kelompok. 'Dari setiap binatang' mempertahankan bentuk distributif dan memakai istilah Indonesia yang luas serta wajar.
- source_word: הַטְּהוֹרָה
  choice: yang tahir
  rationale: טָהוֹר di sini menunjuk pada kategori tahir dalam pembedaan tahir–tidak tahir. 'Tahir' merupakan istilah Alkitabiah Indonesia yang ringkas dan tidak menambahkan penjelasan ritual yang tidak dinyatakan dalam teks.
- source_word: תִּקַּח לְךָ
  choice: bawalah bagimu
  rationale: Bentuk verba berfungsi sebagai perintah, sedangkan 'bagimu' mencerminkan לְךָ. 'Bawalah' sesuai dengan konteks membawa binatang masuk ke bahtera.
- source_word: שִׁבְעָה שִׁבְעָה
  choice: tujuh pasang
  rationale: Pengulangan bilangan menyatakan pengelompokan atau pembagian. Bersama frasa berikutnya tentang jantan dan pasangannya, makna yang paling mungkin ialah tujuh pasang; ketidakpastian tetap dicatat dalam catatan kaki.
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: jantan dan pasangannya
  rationale: Secara harfiah ungkapan ini memakai istilah 'laki-laki dan istrinya', tetapi ketika merujuk pada binatang, ungkapan tersebut menyatakan pasangan berdasarkan jenis kelamin. Pilihan ini alami dalam bahasa Indonesia dan tidak bersifat antropomorfis.
- source_word: וּמִן הַבְּהֵמָה אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: dan dari binatang yang tidak tahir
  rationale: Terjemahan ini mempertahankan ungkapan negatif analitis Ibrani, 'yang tidak tahir', alih-alih menggantinya tanpa penanda dengan satu kata antonim.
- source_word: שְׁנַיִם
  choice: dua ekor
  rationale: Kata ini berarti 'dua'. Kata penggolong 'ekor' diperlukan agar ungkapannya alami dalam bahasa Indonesia, sementara frasa sesudahnya menjelaskan bahwa keduanya membentuk pasangan jantan dan betina.
theological_decisions:
- issue: Makna jumlah binatang tahir
  choice: tujuh pasang binatang tahir
  alternative: tujuh ekor binatang tahir
  rationale: Ungkapan שִׁבְעָה שִׁבְעָה yang diikuti אִישׁ וְאִשְׁתּוֹ paling kuat menunjuk pada tujuh unit pasangan jantan-betina. Namun, karena bentuk Ibraninya secara harfiah 'tujuh tujuh' dan dapat dipahami sebagai tujuh ekor, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah 'tahir' dipertahankan karena tepat untuk kategori tekstual ini; susunan kalimat dibuat alami tanpa menghilangkan unsur 'bagimu' atau bentuk analitis 'tidak tahir'.
