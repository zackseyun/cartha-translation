  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: id
  text: Mereka datang kepada Nuh dan masuk ke dalam bahtera, berdua-dua dari segala makhluk yang memiliki napas kehidupan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh kehidupan.” Kata Ibrani רוּחַ dapat berarti “napas,” “angin,” atau “roh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Mereka datang
  rationale: Bentuk wayyiqtol dari בוא menyatakan gerak dalam alur narasi lampau; “datang” mempertahankan sudut pandang gerakan menuju Nuh.
- source_word: אֶל נֹחַ אֶל הַתֵּבָה
  choice: kepada Nuh dan masuk ke dalam bahtera
  rationale: Dua frasa dengan אֶל menunjukkan arah menuju Nuh dan bahtera. Penambahan “dan masuk” membuat hubungan tujuan ganda itu alami dan jelas dalam bahasa Indonesia tanpa mengubah tindakan pokok.
- source_word: שְׁנַיִם שְׁנַיִם
  choice: berdua-dua
  rationale: Pengulangan bilangan menyatakan pembagian distributif dalam pasangan; “berdua-dua” merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: מִכָּל הַבָּשָׂר
  choice: dari segala makhluk
  rationale: Secara harfiah בָּשָׂר berarti “daging,” tetapi dalam konteks air bah menunjuk kepada seluruh makhluk bernyawa. “Segala makhluk” menyampaikan acuannya secara alami, tanpa memberi kesan bahan tubuh semata.
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: yang memiliki napas kehidupan
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa makhluk-makhluk tersebut mempunyai napas yang menandai kehidupan. “Memiliki” mengungkap konstruksi Ibrani secara wajar dalam bahasa Indonesia.
- source_word: רוּחַ חַיִּים
  choice: napas kehidupan
  rationale: Dalam konteks makhluk hidup, רוּחַ paling wajar berarti “napas,” sedangkan חַיִּים yang berbentuk jamak digunakan dengan makna idiomatis “kehidupan.” Ambiguitas “napas/roh” dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna רוּחַ dalam frasa רוּחַ חַיִּים
  choice: napas kehidupan
  alternative: roh kehidupan
  rationale: Konteks zoologis dan penciptaan menekankan daya hidup makhluk yang masuk ke bahtera. “Napas kehidupan” paling sesuai dengan konteks, sementara kemungkinan “roh” tetap dipertahankan dalam catatan kaki agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. “Bahtera” dipertahankan sebagai istilah naratif Alkitab yang dikenal luas; struktur kalimat dibuat mudah dipahami tanpa menghilangkan urutan gerak dan ungkapan distributif sumber.
