  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: id
  text: Banjir itu berlangsung di bumi selama empat puluh hari. Air itu bertambah banyak dan mengangkat bahtera itu, sehingga bahtera itu terangkat dari permukaan bumi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַמַּבּוּל אַרְבָּעִים יוֹם
  choice: Banjir itu berlangsung ... selama empat puluh hari
  rationale: Dalam konstruksi dengan keterangan waktu, וַיְהִי menyatakan berlangsungnya keadaan atau peristiwa. 'Berlangsung ... selama' alami dalam bahasa Indonesia dan menyampaikan durasi tanpa mengubah makna.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: Dalam konteks banjir, אֶרֶץ paling wajar diterjemahkan 'bumi'; preposisi עַל di sini menyatakan tempat berlangsungnya banjir.
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: Air semakin tinggi
  rationale: רבה menyatakan pertambahan. Dalam konteks air banjir yang kemudian mengangkat bahtera, 'semakin tinggi' menyampaikan pertambahan permukaan air secara alami.
- source_word: וַיִּשְׂאוּ אֶת־הַתֵּבָה
  choice: mengangkat bahtera itu
  rationale: נשא menggambarkan air yang mengangkat bahtera; bentuk ini langsung, jelas, dan mempertahankan tindakan fisiknya.
- source_word: וַתָּרָם מֵעַל הָאָרֶץ
  choice: sehingga terangkat dari permukaan bumi
  rationale: רום menyatakan bahtera menjadi tinggi atau terangkat, sedangkan מֵעַל menunjukkan posisinya menjauh dari atas permukaan tanah. 'Dari permukaan bumi' lebih alami dan tepat daripada 'di atas bumi' dalam konteks bahtera yang mulai terapung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Bahtera' dipertahankan sebagai istilah konvensional bagi kapal Nuh. Pengulangan 'mengangkat ... terangkat' mencerminkan urutan sebab dan hasil dalam bahasa Ibrani.
