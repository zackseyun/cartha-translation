id: GEN.7.1
reference: Genesis 7:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Nuh, “Masuklah ke dalam bahtera, engkau dan seisi rumahmu, sebab Aku telah melihat bahwa engkau benar di hadapan-Ku di antara orang-orang seangkatan ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita; 'lalu' menyatakan urutan secara alami, sedangkan 'berfirman' merupakan padanan Indonesia yang wajar ketika Allah menjadi subjek.
- source_word: בֹּא
  choice: Masuklah ke dalam
  rationale: Imperatif ini secara harfiah dapat berarti 'datang/masuk'; dalam konteks bahtera, ungkapan ini jelas dan alami tanpa menentukan secara berlebihan sudut gerak 'datang' atau 'pergi'.
- source_word: בֵּיתְךָ
  choice: seluruh keluargamu
  rationale: Kata Ibrani 'rumah' di sini menunjuk kepada orang-orang dalam rumah tangga Nuh; 'keluarga' lebih mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַתֵּבָה
  choice: bahtera
  rationale: '''Bahtera'' adalah istilah Indonesia yang mapan dan tepat dalam konteks תֵּבָה Nuh.'
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi perintah sebelumnya.
- source_word: רָאִיתִי
  choice: Aku telah melihat
  rationale: Bentuk perfektif menyatakan penilaian yang telah dilakukan dan tetap relevan pada saat perintah diberikan.
- source_word: צַדִּיק
  choice: benar
  rationale: '''Benar'' merupakan padanan teologis yang mapan untuk צַדִּיק dan menyampaikan penilaian moral-relasional tanpa menambahkan dasar dari status tersebut.'
- source_word: לְפָנַי
  choice: di hadapan-Ku
  rationale: Mempertahankan idiom kehadiran dan penilaian ilahi secara alami dalam bahasa Indonesia.
- source_word: בַּדּוֹר הַזֶּה
  choice: di antara orang-orang seangkatan ini
  rationale: Dalam konteks ini דּוֹר menunjuk kepada orang-orang sezaman dengan Nuh; bentuk ini menghindari kesan bahwa yang dimaksud terutama adalah rentang waktu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi; transliterasi 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Makna kebenaran Nuh
  choice: engkau benar di hadapan-Ku
  alternative: hanya engkau yang benar di hadapan-Ku; Aku menganggap engkau benar
  rationale: Teks menyatakan penilaian Allah atas Nuh, tetapi tidak memuat kata 'hanya' dan tidak menjelaskan dasar atau mekanisme status itu; terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi ditandai dengan kapitalisasi pronomina menurut kebiasaan penulisan Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang harus dijelaskan di luar teks.
