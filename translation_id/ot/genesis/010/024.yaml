base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: id
  text: Arpakhsad memperanakkan Selah[a], dan Selah memperanakkan Eber.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah terjemahan lama memakai bentuk nama “Arphaxad” dan “Salah”, yang dipengaruhi bentuk Yunani. Teks utama mengikuti bentuk Ibrani “Arpakhsad” dan “Selah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Nama diri ini ditransliterasikan langsung dari bentuk Ibrani אַרְפַּכְשַׁד. Bentuk 'Arpakhsad' mewakili huruf כְ sebagai kh dan שׁ sebagai sy dalam kebiasaan ejaan Indonesia.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam silsilah dengan subjek laki-laki, kata ini berarti menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, wajar dalam gaya silsilah Alkitab bahasa Indonesia, dan tidak mengharuskan hubungan ayah-anak langsung jika silsilah diringkas.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: שָׁלַח / שֶׁלַח
  choice: Selah
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani dalam ayat tersebut. 'Selah' mengikuti bentuk Ibrani dengan ejaan yang alami bagi pembaca Indonesia dan dibedakan dari bentuk tradisional 'Salah' yang dipengaruhi tradisi Yunani.
- source_word: וְ/שֶׁלַח
  choice: dan Selah
  rationale: Konjungsi וְ diterjemahkan 'dan', sedangkan nama yang diulang diterjemahkan secara konsisten sebagai 'Selah'.
- source_word: עֵבֶר
  choice: Eber
  rationale: Nama diri עֵבֶר ditransliterasikan sebagai 'Eber', bentuk yang langsung dan lazim dalam bahasa Indonesia; konsonan awal ayin tidak diberi bunyi tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Kata 'memperanakkan' dipilih karena sesuai dengan laras silsilah dan tetap dapat mencakup hubungan leluhur-keturunan tanpa memaksakan bahwa setiap mata rantai harus merupakan generasi langsung.
