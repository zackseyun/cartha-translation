  text: Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: id
  text: Ofir, Hawila, dan Yobab. Semua ini adalah putra-putra Yoktan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Yoktan.” Dalam silsilah, istilah Ibrani untuk “putra-putra” kadang-kadang dapat digunakan dengan arti yang lebih luas, tetapi di sini paling wajar menunjuk kepada putra-putra yang baru saja disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: dan; penanda objek langsung tidak diterjemahkan
  rationale: Pengulangan אֵת menandai setiap nama sebagai objek langsung dalam kelanjutan daftar dari ayat sebelumnya. Dalam bahasa Indonesia penanda itu tidak perlu dinyatakan; struktur daftar dipertahankan dengan koma dan kata “dan” sebelum nama terakhir.
- source_word: אוֹפִר
  choice: Ofir
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Ungkapan ini merangkum semua nama dalam daftar. “Mereka semua” alami dalam bahasa Indonesia dan tetap mengacu jelas kepada orang-orang yang baru disebutkan.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam silsilah, בְּנֵי dapat berarti “keturunan,” tetapi konteks langsung paling wajar menunjuk kepada putra-putra yang disebut dalam daftar. Bahasa Indonesia lazim memakai “anak-anak” untuk bentuk jamak tanpa harus mengulang penanda gender.
- source_word: יָקְטָן
  choice: Yoktan
  rationale: Nama diri ditransliterasikan mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Cakupan istilah silsilah בְּנֵי
  choice: anak-anak Yoktan
  alternative: keturunan Yoktan
  rationale: Bentuk Ibrani dapat memiliki cakupan lebih luas dalam silsilah, tetapi di sini daftar tersebut paling alami dipahami sebagai nama anak-anak lelaki Yoktan. Kemungkinan makna yang lebih luas dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
