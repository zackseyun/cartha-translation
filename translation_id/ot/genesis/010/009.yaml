  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: id
  text: Ia seorang pemburu perkasa di hadapan Yahweh. Karena itu dikatakan[a], “Seperti Nimrod, seorang pemburu perkasa di hadapan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, mungkin, “menentang Yahweh,” jika ungkapan itu dipahami bernuansa permusuhan berdasarkan konteks yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: pemburu perkasa
  rationale: Gabungan ini menggambarkan seseorang yang luar biasa kuat atau mahir dalam berburu. “Pemburu perkasa” ringkas, wajar, dan mempertahankan kekuatan ungkapan Ibrani.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Makna dasarnya ialah “di depan/di hadapan, dalam kehadiran.” Pilihan ini mempertahankan ambiguitas mengenai apakah ungkapan tersebut bersifat netral atau bernada menentang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama diri dalam teks sumber tetap terlihat.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini memperkenalkan alasan munculnya peribahasa atau ucapan berikutnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: יֵאָמַר
  choice: orang berkata
  rationale: Bentuk pasif impersonal Ibrani memperkenalkan ucapan yang lazim. “Orang berkata” merupakan padanan idiomatis dan alami dalam bahasa Indonesia.
- source_word: כְּנִמְרֹד
  choice: Seperti Nimrod
  rationale: Prefiks כְּ menandai perbandingan; “Seperti Nimrod” menyampaikan perbandingan itu secara langsung.
theological_decisions:
- issue: Nuansa לִפְנֵי יְהוָה dalam gambaran tentang Nimrod
  choice: di hadapan Yahweh
  alternative: menentang Yahweh
  rationale: Makna leksikal dasarnya dipertahankan dalam teks utama, sedangkan kemungkinan nuansa permusuhan dicatat dalam catatan kaki agar ketegangan tafsir tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan “pemburu perkasa di hadapan Yahweh” dipertahankan karena merupakan bagian penting dari bentuk peribahasa dalam teks Ibrani.
