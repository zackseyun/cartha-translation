  yaml_path: translation/ot/genesis/010/016.yaml
  text: and the Jebusites[a], and the Amorites, and the Girgashites.
translation:
  language: id
  text: Dan orang Yebus[a], orang Amori, dan orang Girgasi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, ketiga sebutan etnis pada ayat ini berbentuk tunggal (secara harfiah, “orang Yebus, orang Amori, dan orang Girgasi”), tetapi dalam daftar keturunan ini masing-masing merujuk secara kolektif kepada suatu bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Bentuk Ibrani adalah nisbah tunggal berartikel yang dalam daftar bangsa ini berfungsi secara kolektif. Dalam bahasa Indonesia, nama kelompok etnis lazim dinyatakan dengan 'orang' diikuti nama kelompok.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Nisbah tunggal ini merujuk secara kolektif kepada suatu bangsa; 'orang Amori' merupakan bentuk Indonesia yang alami dan tetap mempertahankan fungsi kolektifnya.
- source_word: הַגִּרְגָּשִׁי
  choice: orang Girgasi
  rationale: Bentuk nisbah tunggal dipakai secara kolektif bagi kelompok bangsa. 'Orang Girgasi' menyampaikan makna tersebut dengan wajar dalam bahasa Indonesia.
- source_word: וְאֶת / וְאֵת
  choice: dan
  rationale: Waw menghubungkan unsur-unsur dalam daftar yang berlanjut dari ayat sebelumnya, sedangkan penanda objek אֵת tidak diterjemahkan tersendiri. Sesuai kaidah daftar bahasa Indonesia, 'dan' cukup ditampilkan sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah 'orang + nama etnis' dipilih karena alami dalam daftar bangsa dan dapat berfungsi kolektif tanpa pemarkahan jamak. Tanda koma dan konjungsi disesuaikan dengan tata daftar bahasa Indonesia.
