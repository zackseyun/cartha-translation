  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: id
  text: Wilayah permukiman mereka membentang dari Mesa ke arah Sefar[a], gunung di sebelah timur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tempat tinggal mereka adalah dari Mesa menuju Sefar, pegunungan di sebelah timur.”
    reason: Alternatif yang lebih harfiah untuk מוֹשָׁבָם dan וַיְהִי, serta pembacaan geografis הַר sebagai kawasan pegunungan.
lexical_decisions:
- source_word: וַיְהִי
  choice: membentang
  rationale: Dalam uraian batas geografis ini, bentuk היה menyatakan cakupan wilayah. Kata “membentang” mengungkapkan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: מוֹשָׁבָם
  choice: wilayah permukiman mereka
  rationale: מוֹשָׁב menunjuk tempat atau kawasan tempat tinggal; “wilayah permukiman” sesuai dengan konteks persebaran kelompok bangsa.
- source_word: מִמֵּשָׁא
  choice: dari Mesa
  rationale: Nama tempat tersebut ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֹּאֲכָה
  choice: ke arah
  rationale: Ungkapan arah dari akar בוא menunjukkan gerak atau bentangan menuju suatu tempat; “ke arah” alami dan tidak menyatakan secara berlebihan bahwa batasnya pasti berakhir tepat di tempat itu.
- source_word: סְפָרָה
  choice: Sefar
  rationale: Nama tempat ditransliterasikan sebagai “Sefar”; akhiran penunjuk arah dalam bahasa Ibrani sudah tercermin dalam frasa “ke arah”.
- source_word: הַר
  choice: pegunungan
  rationale: Dalam keterangan geografis, הַר dapat menunjuk satu gunung atau kawasan bergunung. “Pegunungan” dipilih dalam teks utama sebagai pembacaan kewilayahan, sementara kemungkinan “gunung” dipertahankan dalam catatan kaki.
- source_word: הַקֶּדֶם
  choice: sebelah timur
  rationale: קֶדֶם di sini menunjukkan wilayah atau arah timur; “sebelah timur” merupakan ungkapan geografis yang wajar dalam bahasa Indonesia.
