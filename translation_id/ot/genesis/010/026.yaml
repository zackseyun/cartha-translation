  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: id
  text: Yoktan memperanakkan Almodad, Selef, Hazar-Mawet, dan Yerakh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָקְטָן
  choice: Yoktan
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia; waw pada awal ayat berfungsi menghubungkan silsilah ini dengan konteks sebelumnya dan tidak perlu dinyatakan secara terpisah.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, verba ini menyatakan bahwa seorang laki-laki menjadi leluhur langsung atau ayah dari nama-nama yang disebut; 'memperanakkan' ringkas dan mempertahankan corak genealogis.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung bahasa Ibrani ini diwakili oleh susunan kalimat bahasa Indonesia.
- source_word: אַלְמוֹדָד
  choice: Almodad
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: שָׁלֶף
  choice: Selef
  rationale: Nama diri ditransliterasikan secara wajar ke dalam ejaan Indonesia.
- source_word: חֲצַרְמָוֶת
  choice: Hazar-Mawet
  rationale: Nama diri majemuk ditransliterasikan dengan ejaan Indonesia yang menjaga kedua unsur Ibraninya; tanda hubung membantu keterbacaan.
- source_word: יָרַח
  choice: Yerah
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan yod awal sebagai 'Y', sesuai bunyi sumber dan kebiasaan Indonesia modern.
- source_word: וְ/אֶת ... וְ/אֶת ... וְ/אֶת
  choice: koma dan 'dan' sebelum nama terakhir
  rationale: Pengulangan konjungsi Ibrani dihaluskan menjadi daftar alami dalam bahasa Indonesia tanpa mengubah hubungan antarnama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk 'memperanakkan' dipertahankan karena cocok dengan register silsilah dan mudah dipahami; pengulangan 'dan' dalam bahasa Ibrani diungkapkan sebagai daftar Indonesia yang alami.
