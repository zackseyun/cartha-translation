revisions:
- from: Dari keturunan mereka, wilayah-wilayah pesisir bangsa-bangsa terpencar di negeri mereka masing-masing,[a] menurut bahasa, kaum, dan bangsa mereka.
  to: Dari mereka inilah wilayah-wilayah pesisir bangsa-bangsa terpisah di negeri-negeri mereka masing-masing, masing-masing menurut bahasanya, menurut kaum mereka, dan menurut bangsa mereka.[a]
  rationale: Revisi mengganti tambahan interpretatif “keturunan mereka” dengan padanan langsung bagi “dari mereka ini,” serta memulihkan penanda distributif dan kata ganti kepunyaan yang hadir dalam bahasa Ibrani. Pilihan “wilayah-wilayah pesisir bangsa-bangsa” dan catatan alternatifnya dipertahankan agar cakupan leksikal אִיִּים tidak dipersempit.
  reviewer_model: gpt-5.6-terra
