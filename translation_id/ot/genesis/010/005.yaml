  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: id
  text: Dari mereka inilah wilayah-wilayah pesisir bangsa-bangsa terpisah di negeri-negeri mereka masing-masing, masing-masing menurut bahasanya, menurut kaum mereka, dan menurut bangsa mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pulau-pulau bangsa-bangsa.” Kata Ibrani yang dipakai dapat berarti pulau-pulau atau wilayah-wilayah pesisir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: Dari keturunan mereka
  rationale: Secara harfiah berarti 'dari orang-orang ini'. Dalam konteks silsilah, frasa ini menunjuk kepada keturunan yang berasal dari anak-anak Yafet yang baru disebutkan; ungkapan Indonesia ini memperjelas rujukannya tanpa mengubah hubungan asal.
- source_word: נִפְרְדוּ
  choice: terpencar
  rationale: Bentuk nifal dari פרד menyatakan pemisahan satu dari yang lain. 'Terpencar' terdengar alami dalam konteks persebaran kelompok-kelompok ke wilayah masing-masing, sambil tetap mempertahankan gagasan pemisahan.
- source_word: אִיֵּי הַגּוֹיִם
  choice: wilayah-wilayah pesisir bangsa-bangsa
  rationale: אִיִּים dapat merujuk kepada pulau-pulau maupun kawasan pesisir. 'Wilayah-wilayah pesisir' mempertahankan acuan geografis yang luas, sedangkan konstruksi 'bangsa-bangsa' dipertahankan.
- source_word: בְּאַרְצֹתָם
  choice: di negeri mereka masing-masing
  rationale: אֶרֶץ di sini menunjuk wilayah tempat kelompok-kelompok itu menetap. 'Masing-masing' menyampaikan daya distributif konteks dan menghasilkan bahasa Indonesia yang alami.
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: menurut bahasa
  rationale: Secara harfiah, 'masing-masing menurut bahasanya'. Dalam rangkaian keterangan kolektif, bahasa Indonesia dapat menyatakannya secara ringkas sebagai 'menurut bahasa' tanpa menghilangkan fungsi pengelompokan.
- source_word: לְמִשְׁפְּחֹתָם
  choice: kaum
  rationale: מִשְׁפָּחָה dalam konteks silsilah dan etnis menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti. 'Kaum' alami dan sesuai dengan konteks tersebut.
- source_word: בְּגוֹיֵהֶם
  choice: bangsa mereka
  rationale: 'גּוֹי menunjuk bangsa atau kelompok etnis. Bentuk ini mempertahankan unsur kepunyaan dan melengkapi tiga dasar pengelompokan: bahasa, kaum, dan bangsa.'
theological_decisions:
- issue: Apakah subjek ayat ini wilayah geografis atau penduduk wilayah pesisir
  choice: Mempertahankan subjek geografis, 'wilayah-wilayah pesisir bangsa-bangsa'
  alternative: Bangsa-bangsa di wilayah pesisir terpencar
  rationale: Bentuk Ibrani secara langsung memakai אִיֵּי, 'pulau-pulau/wilayah-wilayah pesisir', sebagai subjek. Terjemahan tidak menggantinya secara diam-diam dengan 'penduduk', meskipun konteks tentu mencakup persebaran manusia.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur akhir diselaraskan menjadi rangkaian alami 'menurut bahasa, kaum, dan bangsa mereka', sementara ambiguitas geografis אִיִּים dicatat dalam catatan kaki.
