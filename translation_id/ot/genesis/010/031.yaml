translation:
  language: id
  text: Inilah anak-anak Sem[a], menurut kaum mereka, menurut bahasa mereka, di negeri mereka, menurut bangsa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunan Sem.” Dalam silsilah, kata Ibrani untuk “anak-anak” dapat mencakup keturunan. Kata depan yang berulang menandai penggolongan menurut kaum, bahasa, dan bangsa mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Menandai pernyataan rangkuman secara deiktis dan wajar dalam bahasa Indonesia.
- source_word: בְנֵי שֵׁם
  choice: keturunan Sem
  rationale: Dalam rangkuman silsilah ini, בְּנֵי mencakup kelompok-kelompok yang berasal dari garis Sem; 'keturunan' lebih alami dan tepat daripada 'anak-anak' dalam bahasa Indonesia.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה dalam konteks kesukuan menunjuk kelompok kekerabatan; 'kaum' menghindari kesan keluarga inti, sedangkan 'menurut' menyatakan penggolongan oleh prefiks לְ.
- source_word: לִלְשֹׁנֹתָם
  choice: menurut bahasa mereka
  rationale: לָשׁוֹן secara harfiah dapat berarti 'lidah', tetapi di sini menunjuk bahasa; bentuk tunggal distributif alami dalam bahasa Indonesia.
- source_word: בְּאַרְצֹתָם
  choice: di negeri mereka
  rationale: Prefiks בְּ menyatakan lokasi, dan bentuk jamak Ibrani dipahami secara distributif sebagai negeri masing-masing kelompok.
- source_word: לְגוֹיֵהֶם
  choice: menurut bangsa mereka
  rationale: גּוֹי menunjuk bangsa atau kelompok masyarakat; 'menurut' mempertahankan fungsi klasifikatif prefiks לְ yang berulang.
