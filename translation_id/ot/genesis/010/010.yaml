  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: id
  text: Permulaan kerajaannya ialah Babel[a], Erekh, Akad, dan Kalne[b], di tanah Sinear.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Babel juga dapat disebut “Babilonia”.
    reason: lexical_alternative
  - marker: b
    text: Erekh umumnya diidentifikasi sebagai Uruk kuno, dan Akad sebagai Akkad.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: adalah
  rationale: Dalam klausa ini, bentuk היה berfungsi sebagai kopula lampau yang memperkenalkan gambaran tentang wilayah kerajaan Nimrod. Bahasa Indonesia tidak wajib menandai kala lampau pada kopula.
- source_word: רֵאשִׁית
  choice: Permulaan
  rationale: Kata ini dapat berarti permulaan, bagian pertama, atau bagian utama. “Permulaan” mempertahankan gagasan tahap awal kerajaan tanpa menafsirkannya secara lebih sempit sebagai ibu kota atau kota utama.
- source_word: מַמְלַכְתּוֹ
  choice: kerajaannya
  rationale: Kata benda ini dapat menunjuk pada kerajaan, pemerintahan, atau kekuasaan raja. Daftar kota dalam konteks ini mendukung arti wilayah kerajaan.
- source_word: בָּבֶל
  choice: Babel
  rationale: Nama Ibrani ditransliterasikan sebagai “Babel”, sekaligus mempertahankan kaitan sastra dengan Kejadian 11. Bentuk “Babilonia” dicatat sebagai padanan nama yang lazim.
- source_word: אֶרֶךְ
  choice: Erek
  rationale: Bentuk ini mengikuti nama Ibrani secara wajar dalam ejaan Indonesia; identifikasinya dengan Uruk kuno diberikan dalam catatan kaki.
- source_word: אַכַּד
  choice: Akad
  rationale: Nama tempat ini ditransliterasikan sesuai ejaan Indonesia dan lazim dihubungkan dengan Akkad kuno.
- source_word: כַלְנֵה
  choice: Kalne
  rationale: Bentuk ini merepresentasikan bacaan Teks Masoret tanpa menyamakannya secara pasti dengan nama tempat lain.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: di tanah Sinear
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ sebagai “tanah” dan nama geografis שִׁנְעָר dalam bentuk Indonesia yang lazim.
