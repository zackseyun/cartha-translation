  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִצְרַ֡יִם יָלַ֞ד אֶת לוּדִ֧ים וְ/אֶת עֲנָמִ֛ים וְ/אֶת לְהָבִ֖ים וְ/אֶת נַפְתֻּחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: id
  text: Mizraim memperanakkan kaum Ludim[a], kaum Anamim, kaum Lehabim[b], dan kaum Naftuhim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurunkan” atau “menjadi leluhur dari”; verba Ibrani ini adalah istilah silsilah yang lazim untuk menghasilkan keturunan.
    reason: lexical_alternative
  - marker: b
    text: Nama-nama ini ditulis sebagai nama kelompok bangsa menurut bunyi bahasa Ibrani, bukan diterjemahkan sebagai nama tempat atau disamakan dengan kelompok etnis pada masa kemudian.
    reason: cultural_note
lexical_decisions:
- source_word: מִצְרַיִם
  choice: Mizraim
  rationale: Dipertahankan sebagai nama diri dalam daftar bangsa-bangsa; walaupun berkaitan dengan Mesir, di sini nama itu berfungsi sebagai leluhur eponim.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam silsilah, verba ini menyatakan lahirnya keturunan dari seorang leluhur laki-laki. Pilihan ini mempertahankan daya genealogis teks tanpa menetapkan bahwa setiap kelompok merupakan anak langsung secara biologis.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dan fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: לוּדִים
  choice: kaum Ludim
  rationale: Nama kelompok bangsa ditransliterasikan; kata “kaum” menjelaskan bahwa bentuk jamak ini menunjuk kepada suatu kelompok manusia.
- source_word: עֲנָמִים
  choice: kaum Anamim
  rationale: Nama kelompok bangsa dipertahankan melalui transliterasi tanpa memaksakan identifikasi etnis atau geografis yang belum pasti.
- source_word: לְהָבִים
  choice: kaum Lehabim
  rationale: Bentuk Ibrani ditransliterasikan secara dekat dan tidak disamakan dengan kelompok lain yang identifikasinya diperdebatkan.
- source_word: נַפְתֻּחִים
  choice: kaum Naftuhim
  rationale: Nama kelompok bangsa ditransliterasikan menurut ejaan Indonesia, dengan “f” untuk bunyi konsonan Ibrani yang bersangkutan.
- source_word: וְ
  choice: dan
  rationale: Konjungsi koordinatif diterjemahkan secara wajar untuk menghubungkan unsur terakhir dalam daftar.
theological_decisions:
- issue: Hubungan Mizraim dengan kelompok-kelompok yang disebutkan
  choice: Mempertahankan ungkapan genealogis “memperanakkan”
  alternative: “menjadi leluhur dari” atau “menurunkan”
  rationale: Teks memakai istilah silsilah yang lazim, tetapi konteks kelompok bangsa dapat mencakup keturunan kolektif; terjemahan utama mempertahankan bentuk teks, sedangkan catatan mengakui keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kaum” dipakai secara konsisten agar nama-nama jamak Ibrani terbaca jelas sebagai kelompok bangsa, sedangkan ejaan nama mengikuti kebiasaan transliterasi yang wajar dalam bahasa Indonesia.
