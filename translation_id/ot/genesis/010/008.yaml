  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: id
  text: Kush memperanakkan Nimrod; dialah yang mulai menjadi seorang yang perkasa di bumi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang pahlawan” atau “seorang pejuang.” Kata Ibrani yang digunakan dapat mencakup arti orang yang kuat, perkasa, atau gagah berani.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di negeri itu.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: Kush
  rationale: Konjungsi וְ menghubungkan ayat ini dengan silsilah sebelumnya; dalam bahasa Indonesia hubungan itu tetap jelas tanpa harus selalu dinyatakan dengan “dan”. Nama כּוּשׁ ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: יָלַ֣ד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, יָלַד menyatakan hubungan ayah yang memperanakkan keturunan. “Memperanakkan” ringkas, baku, dan mempertahankan nuansa genealogis.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan “memperanakkan Nimrod”.
- source_word: נִמְרֹד
  choice: Nimrod
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: הוּא
  choice: dialah
  rationale: Pronomina mandiri bersifat menegaskan dan merujuk kembali kepada Nimrod. “Dialah” mempertahankan penekanan itu secara alami.
- source_word: הֵחֵל לִ/הְיוֹת
  choice: mulai menjadi
  rationale: Gabungan verba הֵחֵל dengan infinitif לִהְיוֹת secara langsung berarti “mulai menjadi”. Pilihan ini mempertahankan makna permulaan tanpa menambahkan gagasan bahwa Nimrod pasti merupakan orang pertama dalam urutan sejarah.
- source_word: גִּבֹּר
  choice: seorang yang perkasa
  rationale: גִּבּוֹר dapat menunjuk orang kuat, pahlawan, atau pejuang. “Seorang yang perkasa” mempertahankan keluasan makna dan tidak mempersempitnya menjadi makna militer.
- source_word: בָּ/אָֽרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri”. Dalam konteks daftar bangsa-bangsa, “bumi” paling wajar, sedangkan preposisi בְּ secara alami diterjemahkan “di” dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan אֶרֶץ
  choice: bumi
  alternative: negeri
  rationale: Konteks Kejadian 10 mendukung cakupan dunia yang lebih luas, tetapi kemungkinan makna regional tetap dipertahankan dalam catatan kaki.
- issue: Daya ungkap הֵחֵל לִהְיוֹת
  choice: mulai menjadi
  alternative: menjadi orang pertama yang
  rationale: Teks Ibrani secara eksplisit menyatakan permulaan, bukan prioritas kronologis. Terjemahan tidak menambahkan bahwa Nimrod adalah orang pertama yang memiliki status tersebut.
- issue: Makna גִּבֹּר
  choice: seorang yang perkasa
  alternative: seorang pejuang / seorang pahlawan
  rationale: Istilah Ibrani memiliki rentang makna yang luas. Pilihan utama tidak menentukan apakah keperkasaannya terutama bersifat jasmani, kepahlawanan, atau militer.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur dibuat ringkas sesuai gaya silsilah. “Dialah” mempertahankan penegasan pronomina Ibrani; ambiguitas pada גִּבּוֹר dan אֶרֶץ dijaga melalui catatan kaki.
