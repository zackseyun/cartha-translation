  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: id
  text: Anak-anak Ham adalah Kush, Misraim[a], Put[b], dan Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani «Misraim»; nama ini juga digunakan untuk Mesir. Dalam silsilah ini, bentuk Ibrani tersebut dipertahankan sebagai nama leluhur.
    reason: alternative_reading
  - marker: b
    text: Nama «Put» dalam beberapa terjemahan, khususnya bahasa Inggris, juga ditulis «Phut».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi berarti “anak-anak dari.” Dalam silsilah, ungkapan ini dapat menunjuk pada anak maupun garis keturunan; bentuk harfiahnya dipertahankan. Konjungsi pembuka tidak diterjemahkan secara tersendiri karena dalam bahasa Indonesia modern ayat ini secara alami melanjutkan daftar sebelumnya tanpa perlu “dan” di awal.
- source_word: חָם
  choice: Ham
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Transliterasi nama Ibrani yang lazim dan alami dalam bahasa Indonesia.
- source_word: וּ/מִצְרַיִם
  choice: Misraim[a]
  rationale: Dalam silsilah ini kata tersebut diperlakukan sebagai nama leluhur, bukan langsung diterjemahkan sebagai nama negeri “Mesir.”
- source_word: וּ/פוּט
  choice: Put[b]
  rationale: Transliterasi langsung nama Ibrani; bentuk alternatif tradisional dicatat dalam catatan kaki.
- source_word: וּ/כְנָעַן
  choice: dan Kanaan
  rationale: Nama diri memakai bentuk Indonesia yang mapan, sedangkan konjungsi diterjemahkan secara alami pada unsur terakhir daftar.
