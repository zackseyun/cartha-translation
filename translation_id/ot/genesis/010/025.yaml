  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: id
  text: Bagi Eber lahir dua anak laki-laki. Yang satu bernama Peleg, sebab pada zamannya bumi terbagi[a], dan saudaranya bernama Yoktan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “negeri terbagi.” Kata Ibrani yang dipakai dapat berarti “bumi” atau “negeri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר יֻלַּד שְׁנֵי בָנִים
  choice: Bagi Eber lahir dua anak laki-laki
  rationale: Mempertahankan konstruksi pasif Ibrani dan penerima yang ditandai dengan לְ, sambil memakai susunan yang wajar dalam bahasa Indonesia.
- source_word: שֵׁם הָאֶחָד
  choice: Yang satu bernama
  rationale: Mengungkapkan kontras 'yang satu' secara alami tanpa mengubahnya menjadi 'yang pertama', yang tidak dinyatakan secara eksplisit.
- source_word: פֶּלֶג
  choice: Peleg
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia dan tetap mempertahankan kaitan bunyi dengan verba פלג.
- source_word: כִּי בְיָמָיו
  choice: sebab pada zamannya
  rationale: כִּי memperkenalkan penjelasan nama, sedangkan בְיָמָיו menunjuk pada masa kehidupan Peleg.
- source_word: נִפְלְגָה
  choice: terbagi
  rationale: Bentuk Nifal dari פלג menyatakan keadaan pasif 'dibagi/terbagi'; 'terbagi' ringkas dan mempertahankan kaitan kata dengan nama Peleg.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks daftar bangsa-bangsa, 'bumi' cocok dengan cakupan luas narasi, tetapi kemungkinan arti 'negeri' dipertahankan dalam catatan kaki.
- source_word: וְשֵׁם אָחִיו יָקְטָן
  choice: dan saudaranya bernama Yoktan
  rationale: Merupakan ungkapan Indonesia yang alami bagi konstruksi Ibrani 'dan nama saudaranya [adalah] Yoktan'.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam penjelasan nama Peleg
  choice: bumi
  alternative: negeri
  rationale: Konteks Kejadian 10 tentang bangsa-bangsa mendukung cakupan luas, tetapi kata Ibrani אֶרֶץ sendiri dapat berarti bumi atau negeri. Terjemahan tidak menentukan mekanisme historis pembagian tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah dibuat jelas bagi pembaca umum tanpa menghilangkan bentuk pasif, hubungan antarklausa, atau ambiguitas leksikal utama.
