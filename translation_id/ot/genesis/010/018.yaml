  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: id
  text: orang Arwad, orang Zemar, dan orang Hamat. Sesudah itu, kaum-kaum Kanaan[a] tersebar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keluarga-keluarga Kanaan.” Dalam bahasa Ibrani, sebutan “orang Kanaan” berbentuk tunggal tetapi dipakai secara kolektif untuk kelompok bangsa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: orang Arwad
  rationale: Bentuk nisbah tunggal ini berfungsi secara kolektif dalam daftar bangsa-bangsa. Dalam bahasa Indonesia, “orang Arwad” secara alami dapat menunjuk pada kelompok penduduk atau keturunan Arwad.
- source_word: הַצְּמָרִי
  choice: orang Semar
  rationale: Sebutan kelompok yang berasal dari Semar; bentuk “orang Semar” alami dalam bahasa Indonesia dan mempertahankan fungsi kolektifnya.
- source_word: הַחֲמָתִי
  choice: orang Hamat
  rationale: Sebutan kelompok yang berasal dari Hamat; diterjemahkan secara kolektif sebagai “orang Hamat”.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu setelah daftar kelompok yang baru disebutkan.
- source_word: נָפֹצוּ
  choice: tercerai-berai
  rationale: Bentuk Nifal menyatakan bahwa kelompok-kelompok itu menjadi tersebar atau tercerai-berai; pilihan ini mempertahankan nuansa hasil tanpa menentukan pelakunya.
- source_word: מִשְׁפְּחוֹת
  choice: kaum-kaum
  rationale: Dalam konteks silsilah dan bangsa-bangsa, kata ini menunjuk pada kelompok-kelompok kekerabatan yang lebih luas daripada keluarga inti.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun secara morfologis berbentuk tunggal, sebutan nisbah ini dipakai secara kolektif untuk bangsa Kanaan.
