source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: id
  text: Sem juga mempunyai anak-anak. Sem adalah leluhur seluruh keturunan Eber dan kakak Yafet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “saudara laki-laki Yafet, yang lebih tua.” Kata Ibrani yang berarti “besar/lebih tua” dapat menerangkan Sem atau Yafet.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/לְ/שֵׁם
  choice: Bagi Sem pun
  rationale: Gabungan konjungsi, preposisi, dan גַּם הוּא menandai bahwa Sem juga mempunyai keturunan; susunan ini mempertahankan fokus awal pada Sem secara alami dalam bahasa Indonesia.
- source_word: יֻלַּד
  choice: lahir anak-anak
  rationale: Bentuk pasif tunggal dari ילד secara idiomatis memperkenalkan kelahiran keturunan. Subjek eksplisit jamak membuat kalimat Indonesia alami.
- source_word: אֲבִי כָּל בְּנֵי עֵבֶר
  choice: leluhur semua keturunan Eber
  rationale: Dalam konteks silsilah, אָב berarti nenek moyang atau leluhur, sedangkan בְּנֵי dapat mencakup keturunan, bukan hanya anak laki-laki langsung. Pilihan ini menyampaikan acuannya dengan jelas tanpa menyamakannya begitu saja dengan kelompok lain.
- source_word: אֲחִי יֶפֶת
  choice: kakak Yafet
  rationale: אח berarti saudara laki-laki; bila הַגָּדוֹל dipahami menerangkan Sem, ungkapan Indonesia yang alami ialah 'kakak Yafet'.
- source_word: הַגָּדוֹל
  choice: kakak
  rationale: Dalam konteks hubungan saudara, 'besar' menunjuk pada senioritas usia. Bahasa Indonesia mengungkapkannya secara idiomatis dengan 'kakak'; kemungkinan bahwa kata ini menerangkan Yafet dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Kaitan sintaksis הַגָּדוֹל dengan Sem atau Yafet
  choice: 'Dipahami menerangkan Sem: ''kakak Yafet''.'
  alternative: 'Dipahami menerangkan Yafet: ''saudara Yafet yang lebih tua''.'
  rationale: Susunan Ibrani memungkinkan kedua kaitan. Teks utama memilih pembacaan yang wajar dalam bahasa Indonesia, sementara ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Leluhur' dan 'keturunan' dipilih agar hubungan genealogis dipahami secara tepat; ambiguitas tentang siapa yang lebih tua tidak dihilangkan.
