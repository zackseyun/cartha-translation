source:
  edition: WLC
  text: וְ/אֶת הַֽ/חִוִּ֥י וְ/אֶת הַֽ/עַרְקִ֖י וְ/אֶת הַ/סִּינִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/017.yaml
  text: and the Hivites[a], the Arkites, and the Sinites.
translation:
  language: id
  text: serta orang Hewi[a], orang Arki, dan orang Sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kaum Hewi, kaum Arki, dan kaum Sini.” Dalam bahasa Ibrani, sebutan-sebutan ini berbentuk tunggal dengan kata sandang, tetapi berfungsi secara kolektif untuk menyebut kelompok bangsa atau kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: serta
  rationale: Dalam daftar silsilah ini, וְ menghubungkan unsur berikutnya, sedangkan penanda objek אֶת tidak perlu dinyatakan tersendiri dalam bahasa Indonesia.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Bentuk gentilisia tunggal dengan kata sandang berfungsi secara kolektif bagi kelompok keturunan atau suku; bentuk konvensional Indonesia ialah “orang Hewi”.
- source_word: הָעַרְקִי
  choice: orang Arki
  rationale: Gentilisia ini menunjuk secara kolektif kepada penduduk atau keturunan yang berkaitan dengan Arka; “orang Arki” mempertahankan sifat nama dirinya dan selaras dengan pola daftar.
- source_word: הַסִּינִי
  choice: orang Sini
  rationale: Gentilisia ini merupakan sebutan etnis kolektif dalam daftar bangsa-bangsa; “orang Sini” mempertahankan nama kelompok tanpa mengidentifikasikannya secara spekulatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya daftar yang ringkas dan bermartabat. “Orang + nama kelompok” dipilih sebagai padanan alami bagi gentilisia kolektif Ibrani; “serta” menjaga kesinambungan dengan daftar pada ayat sebelumnya.
