  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: id
  text: Inilah keturunan Ham menurut kaum mereka, menurut bahasa mereka, di negeri mereka, dan menurut bangsa mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata penunjuk ini memperkenalkan pernyataan rangkuman; “Inilah” mempertahankan daya identifikasinya dan terdengar alami dalam bahasa Indonesia.
- source_word: בְנֵי חָם
  choice: keturunan Ham
  rationale: Secara harfiah berarti “anak-anak lelaki Ham,” tetapi dalam konteks daftar bangsa-bangsa frasa ini mencakup garis keturunan; “keturunan Ham” lebih jelas bagi pembaca modern tanpa mempersempitnya pada putra langsung.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Preposisi לְ menandai pengelompokan atau penggolongan. “Kaum” menyatakan kelompok kekerabatan yang lebih luas daripada keluarga inti.
- source_word: לִלְשֹׁנֹתָם
  choice: menurut bahasa mereka
  rationale: לָשׁוֹן secara harfiah berarti “lidah,” tetapi di sini secara idiomatis merujuk pada bahasa; bentuk ini juga mempertahankan gagasan penggolongan.
- source_word: בְאַרְצֹתָם
  choice: di negeri mereka
  rationale: Preposisi בְ bersifat lokatif. “Negeri” mengungkapkan wilayah tempat tinggal tanpa harus menyiratkan negara-bangsa modern.
- source_word: בְּגוֹיֵהֶם
  choice: menurut bangsa mereka
  rationale: גּוֹי menunjuk pada bangsa atau kelompok masyarakat. Dalam formula rangkuman ini, “menurut” menyampaikan fungsi pengelompokan dan membedakannya dari frasa lokatif sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Pengulangan “menurut” dipertahankan untuk mencerminkan susunan penggolongan dalam teks Ibrani, sedangkan “di negeri mereka” tetap lokatif.
