base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: id
  text: dan orang Patrusim, orang Kasluhim (dari sanalah orang Filistin berasal[a]), dan orang Kaftorim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dari sana orang Filistin keluar.” Susunan bahasa Ibrani dapat dipahami sebagai mengaitkan asal-usul orang Filistin dengan orang Kasluhim yang disebut tepat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: orang Patrusim
  rationale: Nama kelompok bangsa yang berkaitan dengan Patros; bentuk transliterasi yang lazim dalam bahasa Indonesia dipertahankan tanpa menerjemahkan makna yang tidak dinyatakan teks.
- source_word: כַּסְלֻחִים
  choice: orang Kasluhim
  rationale: Nama kelompok bangsa yang identifikasinya di luar Alkitab tidak pasti; transliterasi mempertahankan bentuk Ibraninya tanpa memberi kepastian tambahan.
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: dari sanalah ... berasal
  rationale: Ungkapan Ibrani secara harfiah berarti 'yang dari sana ... keluar'. Dalam konteks silsilah, 'berasal' menyampaikan gagasan asal-usul secara wajar, sedangkan 'dari sanalah' mempertahankan unsur adverbial dan ambiguitas rujukannya.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dan dikenal luas dalam bahasa Indonesia untuk nama bangsa ini.
- source_word: כַּפְתֹּרִים
  choice: orang Kaftorim
  rationale: Nama kelompok bangsa yang berkaitan dengan Kaftor; ditransliterasikan sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek tidak perlu dinyatakan tersendiri dalam bahasa Indonesia; unsur penghubungnya diterjemahkan sebagai 'dan' dalam daftar silsilah.
theological_decisions:
- issue: Rujukan frasa 'dari sana orang Filistin keluar'
  choice: Klausa ditempatkan setelah orang Kasluhim, tetapi 'dari sanalah' dipertahankan agar teks tidak secara eksplisit diubah menjadi 'dari merekalah'.
  alternative: orang Kasluhim, yang darinya orang Filistin berasal
  rationale: Kelompok yang langsung mendahului klausa adalah orang Kasluhim, sehingga kaitan itu tersirat oleh susunan kalimat. Namun, bahasa Ibrani memakai keterangan tempat 'dari sana', bukan kata yang secara langsung berarti 'dari mereka'; terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Sebutan kelompok bangsa memakai pola alami 'orang + nama etnonim'. Tanda kurung mempertahankan fungsi klausa sisipan dalam daftar silsilah.
