id: GEN.10.12
reference: Genesis 10:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: id
  text: dan Resen, di antara Niniwe dan Kalah[a]; itulah kota besar itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kalhu”, menurut bentuk Asyur dari nama tempat yang secara tradisional disebut “Kalah”.
    reason: lexical_alternative
  - marker: b
    text: Frasa “itulah kota besar itu” mungkin menunjuk khusus kepada Resen atau kepada kawasan perkotaan yang lebih luas di antara Niniwe dan Kalah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: dan
  rationale: Konjungsi וְ diikuti penanda objek אֵת melanjutkan daftar kota yang dibangun; dalam bahasa Indonesia, penanda objek tidak perlu diterjemahkan tersendiri.
- source_word: רֶסֶן
  choice: Resen
  rationale: Nama tempat ditransliterasikan dari bentuk Ibrani.
- source_word: בֵּין ... וּבֵין
  choice: di antara ... dan
  rationale: Ungkapan korelatif ini menunjukkan letak Resen terhadap Niniwe dan Kalah.
- source_word: נִינְוֵה
  choice: Niniwe
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: כָּלַח
  choice: Kalah
  rationale: Transliterasi yang mengikuti bentuk Ibrani dan bentuk yang lazim dalam Alkitab bahasa Indonesia; bentuk Asyur Kalhu dicatat sebagai alternatif.
- source_word: הִוא
  choice: itulah
  rationale: Kata ganti mandiri ini berfungsi secara resumtif/kopulatif dan secara wajar dinyatakan dengan 'itulah', tanpa menentukan secara tegas antesedennya.
- source_word: הָעִיר הַגְּדֹלָה
  choice: kota besar itu
  rationale: Kedua nomina/adjektiva bersifat definit; 'besar' mempertahankan kemungkinan makna ukuran maupun keutamaan.
theological_decisions:
- issue: Acuan frasa 'itulah kota besar itu'
  choice: Teks utama mempertahankan susunan yang ambigu tanpa menetapkan acuan frasa tersebut.
  alternative: Frasa itu dapat menunjuk khusus kepada Resen atau kepada kawasan perkotaan yang lebih luas antara Niniwe dan Kalah.
  rationale: Sintaksis Ibrani tidak memastikan acuan הִוא הָעִיר הַגְּדֹלָה, sehingga terjemahan tidak boleh menyelesaikan ambiguitas yang ada dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama tempat memakai bentuk yang lazim dalam Alkitab Indonesia. Titik koma mempertahankan hubungan formal antarklausa, sedangkan catatan kaki menjaga ambiguitas acuan klausa penutup.
