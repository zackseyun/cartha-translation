translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Pola silsilah dibuat alami bagi pembaca modern, sementara nama-nama dipertahankan sebagai transliterasi. Penanda catatan kaki ditempatkan langsung sesudah “Rifat”, istilah yang memiliki varian.
