  yaml_path: translation/ot/genesis/010/003.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
translation:
  language: id
  text: Anak-anak Gomer ialah Askenas, Rifat,[a] dan Togarma.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam 1 Tawarikh 1:6 tertulis “Difat”, bukan “Rifat”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus בְּנֵי menyatakan keturunan laki-laki dalam silsilah. Bahasa Indonesia alami memakai pola “Anak-anak X ialah ...”; hubungan koordinatif Ibrani tetap terwakili oleh kesinambungan daftar.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַשְׁכֲּנַז
  choice: Askenas
  rationale: Nama diri ditransliterasikan ke ejaan Indonesia yang lazim, tanpa menerjemahkan maknanya.
- source_word: וְ/רִיפַת
  choice: Rifat
  rationale: Teks WLC/Masoret membaca רִיפַת; konsonan פ tanpa dagesh direpresentasikan sebagai f. Varian dalam 1 Tawarikh 1:6 dicatat dalam catatan kaki.
- source_word: וְ/תֹגַרְמָה
  choice: dan Togarma
  rationale: Nama diri ditransliterasikan; konjungsi וְ pada unsur terakhir diterjemahkan “dan” secara alami.
