id: GEN.10.11
reference: Genesis 10:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: id
  text: Dari negeri itu Asyur pergi dan membangun Niniwe[a], Rehobot-Ir, dan Kalah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dari negeri itu ia pergi ke Asyur dan membangun Niniwe, Rehobot-Ir, dan Kalah,” dengan memahami subjeknya sebagai Nimrod dari ayat sebelumnya dan אַשּׁוּר sebagai wilayah Asyur, bukan pribadi Asyur.
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: Dari negeri itu
  rationale: מִן menyatakan asal, sedangkan אֶרֶץ di sini menunjuk pada suatu wilayah. “Dari negeri itu” alami dalam bahasa Indonesia dan mempertahankan makna geografisnya.
- source_word: יָצָא
  choice: pergi
  rationale: יצא berarti keluar atau pergi dari suatu tempat. Dalam konteks perpindahan dari negeri yang baru disebut, “pergi” menghasilkan kalimat Indonesia yang alami tanpa menghilangkan gagasan meninggalkan wilayah tersebut.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Nama ini dapat menunjuk kepada pribadi Asyur maupun wilayah Asyur. Teks utama memahaminya sebagai subjek pribadi karena nama itu langsung mengikuti verba tunggal; pembacaan wilayah dipertahankan dalam catatan kaki.
- source_word: וַיִּבֶן
  choice: dan membangun
  rationale: בנה adalah verba umum untuk membangun. Pilihan ini lebih langsung daripada “mendirikan”, yang dapat secara khusus menyiratkan pendirian awal sebuah kota.
- source_word: נִינְוֵה
  choice: Niniwe
  rationale: Bentuk nama tempat yang baku dan lazim dalam bahasa Indonesia.
- source_word: רְחֹבֹת עִיר
  choice: Rehobot-Ir
  rationale: Dalam daftar kota ini, ungkapan tersebut paling wajar diperlakukan sebagai nama tempat. Transliterasi mempertahankan identitas nama tanpa memaksakan arti harfiah yang belum pasti.
- source_word: כָּלַח
  choice: Kalah
  rationale: Transliterasi Indonesia yang sesuai untuk nama tempat Ibrani ini.
theological_decisions:
- issue: Subjek dan rujukan אַשּׁוּר
  choice: 'Asyur adalah subjek: “Asyur pergi”'
  alternative: “Dari negeri itu ia pergi ke Asyur” dengan Nimrod sebagai subjek tersirat dari ayat sebelumnya dan Asyur sebagai wilayah
  rationale: Teks Ibrani memungkinkan kedua pembacaan karena אַשּׁוּר dapat menjadi nama pribadi atau nama wilayah. Susunan klausa paling langsung menempatkan Asyur sebagai subjek yang disebut sesudah verba. Karena ambiguitasnya nyata, pembacaan lain dicatat dan tidak disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Nama-nama tempat memakai bentuk yang lazim dalam tradisi Indonesia; ambiguitas sintaksis dan geografis teks Ibrani dipertahankan melalui catatan kaki.
