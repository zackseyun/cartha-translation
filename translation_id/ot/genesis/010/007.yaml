base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: id
  text: Anak-anak Kus ialah Seba[a], Hawila, Sabta, Raema, dan Sabtekha[b]. Anak-anak Raema ialah Syeba dan Dedan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam silsilah Ibrani, “anak-anak” dapat menunjuk pada keturunan atau kelompok kaum, bukan hanya anak kandung langsung.
    reason: cultural_note
  - marker: b
    text: Beberapa nama dalam ayat ini dapat merujuk pada bangsa, wilayah, atau leluhur eponim, bukan hanya individu.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Mempertahankan istilah kekerabatan harfiah dan pola silsilah Ibrani, sambil memakai susunan kalimat Indonesia yang alami; dalam silsilah, bentuk ini juga dapat mencakup keturunan.
- source_word: כּוּשׁ
  choice: Kus
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: סְבָא
  choice: Seba
  rationale: Nama diri atau nama tempat ditransliterasikan tanpa menetapkan apakah yang dimaksud individu, wilayah, atau kelompok bangsa.
- source_word: חֲוִילָה
  choice: Hawila
  rationale: Transliterasi Indonesia memakai w untuk bunyi konsonan Ibrani waw dalam bentuk nama yang lazim.
- source_word: סַבְתָּה
  choice: Sabta
  rationale: Transliterasi ringkas dan alami dalam bahasa Indonesia mengikuti bentuk Ibrani tanpa mempertahankan h akhir yang tidak mewakili konsonan tersendiri di sini.
- source_word: רַעְמָה
  choice: Raema
  rationale: Nama ditransliterasikan secara terbaca; e memisahkan rangkaian vokal yang timbul karena konsonan tenggorokan Ibrani tanpa memaksakan padanan bunyi yang tidak tersedia dalam ejaan Indonesia umum.
- source_word: סַבְתְּכָא
  choice: Sabteka
  rationale: Transliterasi disesuaikan dengan ejaan Indonesia, terutama penggunaan k untuk כ.
- source_word: וּבְנֵי רַעְמָה
  choice: Anak-anak Raema ialah
  rationale: Pengulangan rumus silsilah dipertahankan agar struktur ayat dan hubungan turun-temurun tetap jelas.
- source_word: שְׁבָא
  choice: Syeba
  rationale: שׁ ditampilkan sebagai sy sesuai kebiasaan transliterasi nama Ibrani dalam bahasa Indonesia.
- source_word: דְדָן
  choice: Dedan
  rationale: Nama diri ditransliterasikan langsung dan tidak diubah menjadi sebutan etnis.
theological_decisions:
- issue: Cakupan makna בְּנֵי dalam silsilah
  choice: Teks utama memakai “anak-anak”, dengan catatan bahwa istilah itu dapat mencakup keturunan atau asal kelompok.
  alternative: “Keturunan”
  rationale: Pilihan ini menjaga bentuk konkret bahasa sumber sekaligus tidak membatasi maknanya pada putra biologis langsung.
- issue: Status nama-nama dalam daftar bangsa
  choice: Nama-nama dipertahankan sebagai nama diri tanpa mengidentifikasikannya secara pasti sebagai individu saja.
  alternative: Menerjemahkannya sebagai nama bangsa atau wilayah secara eksplisit
  rationale: Teks Ibrani membiarkan hubungan antara leluhur eponim, bangsa, dan wilayah tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumus silsilah dibuat alami dengan “ialah”, sementara nama-nama ditransliterasikan secara konsisten menurut kebiasaan ejaan Indonesia. Semua ambiguitas tentang individu, bangsa, wilayah, dan keturunan dipertahankan melalui catatan kaki.
