  text: וְ/אֶת עוֹבָ֥ל וְ/אֶת אֲבִֽימָאֵ֖ל וְ/אֶת שְׁבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: id
  text: dan Obal, dan Abimael, dan Syeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, penanda objek diulangi pada setiap nama: “dan [objek] Obal, dan [objek] Abimael, dan [objek] Syeba.” Bahasa Indonesia biasanya tidak menerjemahkan penanda objek tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi וְ diterjemahkan sebagai “dan”, sedangkan אֶת adalah penanda objek langsung tentu yang tidak memiliki padanan tersendiri dalam bahasa Indonesia. Pengulangan “dan” dipertahankan untuk mencerminkan susunan daftar Ibrani.
- source_word: עוֹבָל
  choice: Obal
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan; “Obal” sesuai dengan bentuk Ibraninya dan konvensi Indonesia.
- source_word: אֲבִימָאֵל
  choice: Abimael
  rationale: Nama diri ditransliterasikan menurut bentuk Ibraninya tanpa menerjemahkan unsur-unsur pembentuk nama.
- source_word: שְׁבָא
  choice: Syeba
  rationale: Nama diri ditransliterasikan sebagai “Syeba”, bentuk yang lazim dalam Alkitab bahasa Indonesia untuk שְׁבָא dan yang membedakannya dari nama Ibrani lain yang biasa ditulis “Seba”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “dan” mengikuti gaya genealogis teks sumber, sedangkan nama-nama memakai bentuk yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
