  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: id
  text: 'Inilah keturunan[a] anak-anak lelaki Nuh: Sem, Ham, dan Yafet. Dan setelah air bah itu, lahirlah anak-anak lelaki bagi mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Inilah riwayat anak-anak lelaki Nuh.” Istilah Ibrani yang diterjemahkan “keturunan” dapat menunjuk kepada garis keturunan atau, secara lebih luas, kepada riwayat dan apa yang berasal dari seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Bentuk ini secara alami memperkenalkan bagian baru dalam bahasa Indonesia. Daya penghubung ו dipahami sebagai penanda wacana dan tidak perlu diterjemahkan dengan kata temporal seperti “sekarang”.
- source_word: תּוֹלְדֹת
  choice: keturunan
  rationale: Kata ini merupakan rumus judul yang berulang dalam Kitab Kejadian dan di sini terutama mengarahkan pembaca kepada garis keturunan yang menyusul. Catatan kaki mempertahankan kemungkinan makna yang lebih luas, yakni riwayat atau apa yang berasal dari seseorang.
- source_word: בְּנֵי נֹחַ
  choice: anak-anak lelaki Nuh
  rationale: Terjemahan ini mempertahankan makna maskulin jamak dari בְּנֵי sekaligus tetap jelas dan wajar dalam bahasa Indonesia modern.
- source_word: שֵׁם חָם וָיָפֶת
  choice: Sem, Ham, dan Yafet
  rationale: Nama-nama pribadi digunakan dalam bentuk Indonesia yang sudah lazim.
- source_word: וַיִּוָּלְדוּ
  choice: lahirlah
  rationale: Bentuk nifal dari ילד menyatakan bahwa mereka dilahirkan, bukan bahwa para leluhur secara aktif “memperanakkan” mereka.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Preposisi ל dalam ungkapan ini menandai hubungan atau kepemilikan; “bagi mereka” alami dipadukan dengan “lahirlah”.
- source_word: בָּנִים
  choice: anak-anak lelaki
  rationale: Teks Ibrani memakai bentuk maskulin jamak, dan konteks silsilah ini merujuk kepada keturunan laki-laki.
- source_word: אַחַר הַמַּבּוּל
  choice: setelah air bah itu
  rationale: Ungkapan ini menandai waktu sesudah peristiwa air bah yang telah disebutkan; “itu” menunjukkan peristiwa tertentu tersebut.
theological_decisions:
- issue: Makna rumus Kejadian תּוֹלְדֹת
  choice: keturunan
  alternative: riwayat
  rationale: “Keturunan” sesuai dengan daftar bangsa dan garis keluarga yang mengikuti, tetapi kemungkinan bahwa rumus ini menunjuk lebih luas kepada riwayat atau hasil yang berasal dari seseorang tetap dipertahankan dalam catatan kaki.
- issue: Istilah maskulin בָּנִים
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Bentuk sumber secara eksplisit maskulin dan konteks menyajikan keturunan laki-laki; terjemahan netral akan mengaburkan ciri tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan fungsi ayat sebagai judul bagian, sedangkan pengulangan “anak-anak lelaki” menjaga ketepatan gender dari teks Ibrani. Awal kalimat kedua dengan “Dan” mempertahankan penghubung sumber tanpa menambahkan gagasan temporal yang tidak tersurat.
