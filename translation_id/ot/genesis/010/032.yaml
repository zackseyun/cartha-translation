base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: id
  text: Inilah kaum-kaum keluarga anak-anak Nuh,[a] menurut garis keturunan mereka, menurut bangsa-bangsa mereka; dan dari merekalah bangsa-bangsa itu terpisah[b] di bumi sesudah air bah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kelompok-kelompok kekerabatan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tersebar” atau “terbagi.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum keturunan
  rationale: Menunjukkan kelompok-kelompok kekerabatan dalam rangkuman silsilah; lebih tepat daripada sekadar 'keluarga-keluarga', yang dalam bahasa Indonesia modern mudah dipahami sebagai rumah tangga inti.
- source_word: לְתוֹלְדֹתָם
  choice: menurut garis keturunan mereka
  rationale: תּוֹלְדוֹת di sini merangkum susunan genealogis; 'garis keturunan' alami dalam bahasa Indonesia dan mempertahankan hubungan dengan daftar keturunan sebelumnya.
- source_word: בְּגוֹיֵהֶם
  choice: berdasarkan bangsa-bangsa mereka
  rationale: Preposisi בְּ menyatakan pengelompokan atau kategori dalam rangkuman ini; frasa tersebut mempertahankan kesejajaran dengan 'menurut garis keturunan mereka'.
- source_word: וּמֵאֵלֶּה
  choice: Dari merekalah
  rationale: Partikel fokus '-lah' secara alami menegaskan bahwa bangsa-bangsa itu berasal dari kelompok-kelompok yang baru disebut, sementara hubungan waw tetap tersirat oleh kesinambungan kalimat.
- source_word: נִפְרְדוּ
  choice: tersebar
  rationale: Bentuk Nifal dari פרד menyatakan berpisah atau tercerai ke berbagai kelompok. 'Tersebar' menyampaikan hasil pemisahan secara alami tanpa menentukan apakah tindakan itu disengaja atau dilakukan oleh pihak tertentu.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks daftar bangsa, גּוֹיִם menunjuk kelompok-kelompok bangsa yang berbeda.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: Konteks merangkum persebaran umat manusia pasca-air bah secara luas; 'di bumi' merupakan ungkapan Indonesia yang alami.
- source_word: אַחַר הַמַּבּוּל
  choice: sesudah air bah
  rationale: Padanan langsung dan lazim bagi keterangan waktu yang merujuk kepada peristiwa air bah.
theological_decisions:
- issue: Cakupan אֶרֶץ dalam rangkuman persebaran pasca-air bah
  choice: bumi
  alternative: negeri/tanah
  rationale: Konteks Daftar Bangsa merangkum asal dan persebaran bangsa-bangsa keturunan Nuh secara universal; 'bumi' mempertahankan cakupan luas tanpa mempersempitnya menjadi suatu wilayah tertentu.
- issue: Nuansa נִפְרְדוּ
  choice: tersebar
  alternative: terpisah/terbagi
  rationale: Teks menyatakan pemisahan bangsa-bangsa tanpa menyebut pelaku. 'Tersebar' mempertahankan keadaan/resultan persebaran, sedangkan catatan kaki mencatat alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur dua frasa pengelompokan Ibrani dipertahankan melalui 'menurut ... berdasarkan ...'. Tanda baca dibagi menjadi dua kalimat agar rangkuman genealogis mudah dibaca tanpa menghilangkan hubungan logisnya.
