  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישׁ כִּתִּ֖ים וְ/דֹדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: id
  text: Anak-anak Yawan ialah Elisa, Tarsis, Kitim, dan Dodanim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa naskah dan 1 Tawarikh 1:7 berbunyi “Rodanim”, bukan “Dodanim”.
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus בְּנֵי secara langsung berarti “anak-anak (laki-laki) dari”. Dalam daftar keturunan, istilah ini juga dapat mencakup garis keturunan, tetapi terjemahan “anak-anak” mempertahankan bentuk genealogis teks Ibrani tanpa mempersempit atau memperluas maknanya secara interpretatif.
- source_word: יָוָן
  choice: Yawan
  rationale: Nama diri ini ditransliterasikan menurut ejaan Indonesia, dengan w untuk bunyi konsonan Ibrani waw.
- source_word: אֱלִישָׁה
  choice: Elisa
  rationale: Nama diri ini ditransliterasikan dalam bentuk yang alami dan lazim dibaca dalam bahasa Indonesia.
- source_word: וְ/תַרְשִׁישׁ
  choice: Tarsis
  rationale: Nama tempat atau nama bangsa ini ditransliterasikan dengan bentuk Indonesia yang mapan; konsonan akhir Ibrani syin direpresentasikan sebagai s sesuai pemakaian nama ini dalam bahasa Indonesia.
- source_word: כִּתִּים
  choice: Kitim
  rationale: Bentuk Ibrani ini merupakan nama kelompok atau wilayah dalam bentuk jamak. “Kitim” mempertahankan nama tersebut tanpa menambahkan tafsiran seperti “orang-orang Kitim” karena seluruh daftar secara sintaksis berada di bawah frasa “anak-anak Yawan”.
- source_word: וְ/דֹדָנִים
  choice: Dodanim
  rationale: Teks Masoret WLC berbunyi דֹדָנִים, sehingga teks utama memakai “Dodanim”. Bacaan alternatif “Rodanim” dipertahankan dalam catatan kaki sebagai varian tekstual.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kopula “ialah” membuat susunan daftar silsilah alami tanpa menghilangkan hubungan anak dengan Yawan. Konjungsi pembuka waw tidak diterjemahkan secara mekanis sebagai “dan” karena ayat ini merupakan kelanjutan daftar dan bahasa Indonesia tidak memerlukannya; hubungan koordinatif tetap jelas dari konteks.
