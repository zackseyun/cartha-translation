  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: id
  text: 'Anak-anak laki-laki Sem: Elam, Asyur[b], Arpakhsad[a], Lud, dan Aram.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani Arpakhsad; dalam beberapa tradisi yang dipengaruhi bahasa Yunani, nama ini ditulis Arfaksad.
    reason: lexical_alternative
  - marker: b
    text: Nama Asyur dan Aram kemudian juga digunakan bagi bangsa atau wilayah yang berkaitan dengannya; Aram khususnya sering dihubungkan dengan Siria dalam penggunaan kemudian.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Bentuk jamak konstruktus dari בֵּן. Pilihan ini mempertahankan bahasa silsilah laki-laki dalam teks Ibrani dan lebih langsung daripada “keturunan”.
- source_word: שֵׁם
  choice: Sem
  rationale: Nama diri; digunakan bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֵילָם
  choice: Elam
  rationale: Nama diri yang juga berkaitan dengan nama suatu bangsa atau wilayah; transliterasi yang lazim dipertahankan.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Mewakili nama Ibrani Asshur dalam ejaan Indonesia. Dalam daftar silsilah ini nama tersebut diperlakukan sebagai nama leluhur, tanpa mengubahnya menjadi keterangan geografis.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Transliterasi yang dekat dengan bentuk Ibrani dan lazim dikenal pembaca Indonesia; tidak mengikuti bentuk yang dipengaruhi tradisi Yunani.
- source_word: לוּד
  choice: Lud
  rationale: Mempertahankan bentuk tunggal nama diri dalam teks Ibrani.
- source_word: אֲרָם
  choice: Aram
  rationale: Mempertahankan nama Ibrani dalam daftar silsilah dan tidak menggantinya dengan nama geografis yang muncul kemudian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami dengan “ialah”, sedangkan “anak-anak lelaki” mempertahankan bentuk silsilah maskulin dari teks Ibrani. Penanda catatan [a] ditempatkan pada Arpakhsad sesuai isi catatannya; [b] diletakkan pada akhir daftar karena catatan itu menjelaskan dua nama, Asyur dan Aram.
