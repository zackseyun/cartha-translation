  terminology: Sem, Elam, Asyur, Arpakhsad, Lud, dan Aram dipertahankan sebagai nama diri dan sesuai dengan bentuk Ibrani. Catatan a ditambatkan dengan tepat pada Arpakhsad. Catatan b sebaiknya ditambatkan pada Asyur, nama pertama yang dijelaskannya, dan dirumuskan tanpa menyamakan nama-nama silsilah itu secara langsung dengan entitas politik kemudian.
