base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: id
  text: Anak-anak Aram ialah Us, Hul, Geter, dan Mas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi Mas; 1 Tawarikh 1:17 mencantumkan Mesekh.
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruksi dari בֵּן menyatakan hubungan keturunan langsung dalam daftar silsilah. Kata penghubung וּ tidak diterjemahkan tersendiri karena ayat ini secara alami menjadi satu butir baru dalam daftar.
- source_word: אֲרָם
  choice: Aram
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עוּץ
  choice: Us
  rationale: Transliterasi nama diri yang lazim dalam Alkitab bahasa Indonesia; bunyi akhir Ibrani צ direpresentasikan dengan s dalam bentuk konvensional ini.
- source_word: חוּל
  choice: Hul
  rationale: Nama diri ditransliterasikan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: גֶתֶר
  choice: Geter
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia tanpa mempertahankan digraf bahasa Inggris.
- source_word: מַשׁ
  choice: Mas
  rationale: Teks Masoret di Kejadian 10:23 berbunyi מַשׁ; bentuk Mas mempertahankan bacaan sumber dan menyesuaikan transliterasi dengan ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Rumusan silsilah dipertahankan secara langsung. Penanda catatan ditempatkan setelah “Mas”, yaitu nama yang terkait dengan varian tekstual, bukan setelah “Us” seperti posisi penanda yang tampaknya keliru pada lapisan konsultasi Inggris.
