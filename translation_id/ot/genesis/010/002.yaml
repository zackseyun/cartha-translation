  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: id
  text: 'Putra-putra Yafet: Gomer, Magog, Madai, Yawan[a], Tubal, Mesekh, dan Tiras.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam pemakaian kemudian, kedua nama ini mungkin juga diidentifikasikan secara etnis atau geografis: “Madai” dengan orang Media, dan “Yawan” dengan Ionia atau orang Yunani. Teks utama mempertahankan nama-nama silsilah Ibrani dalam bentuk transliterasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן yang memperkenalkan daftar silsilah. Pilihan ini mempertahankan hubungan anak laki-laki dalam konteks silsilah tanpa memperluasnya menjadi “keturunan”.
- source_word: יֶפֶת
  choice: Yafet
  rationale: Nama diri; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: גֹּמֶר
  choice: Gomer
  rationale: Nama diri dalam daftar anak-anak Yafet; dipertahankan sebagai transliterasi.
- source_word: מָגוֹג
  choice: Magog
  rationale: Nama diri yang dalam pemakaian lain dapat memiliki kaitan etnogeografis, tetapi di sini berfungsi sebagai nama dalam silsilah.
- source_word: מָדַי
  choice: Madai
  rationale: Bentuk Ibrani dipertahankan sebagai nama diri dalam silsilah, tanpa menggantinya dengan identifikasi etnis “orang Media”.
- source_word: יָוָן
  choice: Yawan
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani. Walaupun dalam konteks lain dapat menunjuk kepada Ionia atau orang Yunani, daftar ini menyajikannya sebagai nama dalam silsilah.
- source_word: תֻבָל
  choice: Tubal
  rationale: Nama diri; ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶשֶׁךְ
  choice: Mesekh
  rationale: Nama diri; ditransliterasikan dengan ejaan Indonesia untuk mencerminkan konsonan akhir Ibrani.
- source_word: תִירָס
  choice: Tiras
  rationale: Nama diri; ditransliterasikan.
