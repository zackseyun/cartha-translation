  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִידֹ֥ן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: id
  text: Kanaan memperanakkan Sidon, anak sulungnya, dan Het[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Het adalah leluhur yang dikaitkan dengan orang Het dalam silsilah di bagian ini.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: Kanaan
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Konjungsi ו tidak dinyatakan secara tersendiri karena ayat ini dapat dibaca alami sebagai kelanjutan daftar silsilah tanpa harus diawali “Dan”.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ini menyatakan bahwa seorang laki-laki menghasilkan keturunan. “Memperanakkan” mempertahankan hubungan genealogis itu secara ringkas dan bermartabat.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung dalam bahasa Ibrani tidak memiliki padanan leksikal yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: צִידֹן
  choice: Sidon
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: בְּכֹר/וֹ
  choice: anak sulungnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal menunjuk Sidon sebagai anak sulung Kanaan; ungkapan ini langsung dan alami dalam bahasa Indonesia.
- source_word: וְ/אֶת
  choice: dan
  rationale: Konjungsi menghubungkan nama keturunan kedua, sedangkan penanda objek langsung tidak diterjemahkan.
- source_word: חֵת
  choice: Het
  rationale: Teks Ibrani hanya menyebut nama diri. Keterangan mengenai hubungannya dengan orang Het ditempatkan dalam catatan kaki, bukan ditambahkan ke teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan genealogis teks Ibrani dipertahankan, sementara tanda baca ditambahkan agar hubungan aposisi “Sidon, anak sulungnya” jelas. Penanda catatan kaki ditempatkan sesudah “Het” karena isi catatan menerangkan Het.
