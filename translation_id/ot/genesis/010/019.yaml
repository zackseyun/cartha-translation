  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: id
  text: Batas wilayah orang Kanaan membentang dari Sidon ke arah Gerar sampai Gaza, dan ke arah Sodom, Gomora, Adma, serta Zeboim sampai Lasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lesa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: membentang
  rationale: Dalam uraian geografis ini, bentuk naratif dari היה menyatakan keberadaan atau bentangan batas. “Membentang” mengungkapkan maksud itu secara alami dalam bahasa Indonesia tanpa meniru susunan Ibrani secara kaku.
- source_word: גְּבוּל הַכְּנַעֲנִי
  choice: batas wilayah orang Kanaan
  rationale: גְּבוּל menunjuk pada batas teritorial, sedangkan bentuk gentilik tunggal הַכְּנַעֲנִי dipakai secara kolektif bagi orang Kanaan. “Batas wilayah” memperjelas bahwa yang dibicarakan ialah batas geografis.
- source_word: מִצִּידֹן
  choice: dari Sidon
  rationale: Preposisi מִן menandai titik awal uraian batas; “Sidon” ialah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: בֹּאֲכָה
  choice: ke arah
  rationale: Dalam rumus penentuan batas, bentuk ini menunjukkan arah perjalanan atau orientasi menuju suatu tempat. “Ke arah” ringkas dan alami serta mempertahankan fungsi geografisnya.
- source_word: גְרָרָה
  choice: Gerar
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim; akhiran penunjuk arah dalam bahasa Ibrani sudah tercakup dalam frasa “ke arah Gerar”.
- source_word: עַד
  choice: sampai
  rationale: Kata ini menandai batas terjauh atau titik akhir suatu bentangan wilayah.
- source_word: עַזָּה
  choice: Gaza
  rationale: Menggunakan bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: Sodom, Gomora, Adma, serta Zeboim
  rationale: Nama-nama tempat memakai bentuk Indonesia yang lazim. Kata sambung Ibrani pada setiap unsur disajikan sebagai deret alami dalam bahasa Indonesia tanpa menghilangkan satu pun nama.
- source_word: לָשַׁע
  choice: Lasa
  rationale: “Lasa” mencerminkan konsonan dan vokalisasi Masoret secara wajar dalam ejaan Indonesia; kemungkinan “Lesa” dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mempertahankan dua penunjuk arah dalam uraian batas, sementara nama-nama tempat mengikuti bentuk yang lazim bagi pembaca Indonesia.
