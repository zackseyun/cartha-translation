  rationale: Nama diri dalam daftar keturunan; ditransliterasikan sesuai bentuk Ibrani dan ejaan Indonesia yang lazim.
- source_word: אוּזָל
  choice: Uzal
  rationale: Nama diri; ditransliterasikan langsung sebagai “Uzal”.
- source_word: דִּקְלָה
  choice: Dikla
  rationale: Nama diri; ditransliterasikan menurut kaidah ejaan Indonesia, tanpa mempertahankan huruf h akhir yang tidak dibunyikan.
