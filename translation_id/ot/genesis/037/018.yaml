  yaml_path: translation/ot/genesis/037/018.yaml
  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: id
  text: Mereka melihatnya dari jauh, dan sebelum dia mendekati mereka, mereka berkomplot[a] untuk membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka merencanakan sesuatu terhadapnya.” Kata kerja Ibrani ini dapat berarti menyusun rencana atau bertindak dengan tipu daya; dalam konteks ini, rencana untuk membunuh disebutkan secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: Mereka melihat dia dari jauh
  rationale: Bentuk naratif וַיִּרְאוּ menyatakan tindakan lampau berurutan; מֵרָחֹק secara alami berarti ‘dari jauh’. Pronomina ‘dia’ mempertahankan objek laki-laki tunggal tanpa membuat kalimat kaku.
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: dan sebelum dia mendekati mereka
  rationale: בְטֶרֶם memperkenalkan klausa waktu ‘sebelum’, sedangkan קרב Qal berarti datang atau bergerak mendekat. ‘Mendekati mereka’ alami dalam bahasa Indonesia dan tetap mempertahankan nuansa ruang.
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: mereka bersekongkol[a]
  rationale: Hitpael dari נכל di sini menunjuk pada penyusunan siasat jahat terhadap seseorang. ‘Bersekongkol’ menyampaikan unsur rencana bersama dan niat bermusuhan; catatan kaki mempertahankan kemungkinan nuansa tipu daya.
- source_word: לַהֲמִיתוֹ
  choice: untuk membunuhnya
  rationale: Infinitif Hifil dari מות dengan akhiran orang ketiga laki-laki tunggal menyatakan tujuan, yaitu menyebabkan dia mati. ‘Untuk membunuhnya’ jelas, ringkas, dan wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. Konjungsi ‘dan’ dipertahankan untuk mencerminkan kesinambungan narasi Ibrani. Penanda catatan kaki ditempatkan pada ‘bersekongkol’, yaitu kata yang diterangkannya.
