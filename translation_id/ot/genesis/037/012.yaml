translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama tempat ditransliterasikan sebagai "Sikhem". Rujukan "saudara-saudaranya" diperjelas menjadi "saudara-saudara Yusuf" agar tidak rancu sebagai ayat yang berdiri sendiri.
