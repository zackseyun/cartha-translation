  source_fidelity: Perubahan utama diperlukan pada בִּשְׁכֶם. Preposisi ב secara langsung menyatakan lokasi “di Sikhem”; terjemahan utama “di dekat Sikhem” menambahkan nuansa kedekatan/vicinity yang tidak dinyatakan secara tegas oleh teks Ibrani. Nuansa “at/in the vicinity of” dapat dicatat sebagai kemungkinan kontekstual, tetapi tidak sebaiknya menjadi teks utama.
  naturalness: Dengan “di Sikhem”, kalimat tetap alami, lugas, dan sesuai ragam Indonesia modern. “Saudara-saudara Yusuf” secara wajar memperjelas anteseden tanpa mengubah makna.
