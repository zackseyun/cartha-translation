translation:
  language: id
  text: Saudara-saudara Yusuf pergi menggembalakan kawanan ternak ayah mereka di Sikhem.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dekat Sikhem.” Preposisi Ibrani dapat menyatakan lokasi di suatu tempat atau pada/di wilayah sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan rangkaian peristiwa. Kata "pergi" menerjemahkannya secara wajar tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: אֶחָיו
  choice: saudara-saudara Yusuf
  rationale: Secara harfiah berarti "saudara-saudaranya"; konteks menunjuk kepada saudara-saudara laki-laki Yusuf. Nama "Yusuf" dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: לִרְעוֹת
  choice: menggembalakan
  rationale: Infinitif dari רעה menyatakan tujuan kepergian mereka, yaitu merawat dan membawa ternak merumput. "Menggembalakan" merupakan padanan Indonesia yang alami.
- source_word: אֶת
  choice: '[penanda objek langsung tidak diterjemahkan]'
  rationale: אֵת menandai objek langsung tentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: צֹאן ialah istilah kolektif untuk ternak kecil, terutama domba dan kambing. "Kawanan ternak" mempertahankan cakupan itu tanpa membatasi jenis hewannya.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Bentuk konstruksi dengan sufiks pronominal menyatakan kepunyaan; susunan ini alami dalam bahasa Indonesia.
- source_word: בִּשְׁכֶם
  choice: di dekat Sikhem
  rationale: Preposisi ב dapat menunjukkan lokasi di dalam suatu tempat atau pada/di sekitar tempat itu. Karena kegiatan penggembalaan kemungkinan berlangsung di wilayah sekitarnya, "di dekat Sikhem" sesuai, sementara alternatif "di Sikhem" dicatat dalam catatan kaki.
