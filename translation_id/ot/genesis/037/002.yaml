revisions:
- from: Inilah keturunan Yakub:[a] Ketika Yusuf berumur tujuh belas tahun, ia menggembalakan kawanan ternak bersama saudara-saudaranya. Sebagai seorang pemuda, ia bersama anak-anak Bilha dan anak-anak Zilpa, istri-istri ayahnya, dan Yusuf menyampaikan kabar buruk tentang mereka kepada ayah mereka.[b]
  to: Inilah keturunan Yakub:[a] Yusuf, pada usia tujuh belas tahun, sedang menggembalakan kawanan ternak bersama saudara-saudaranya. Ia masih muda, dan ia bersama anak-anak Bilha serta anak-anak Zilpa, istri-istri ayahnya. Yusuf membawa laporan yang buruk tentang mereka kepada ayah mereka.[b]
  rationale: Revisi memperbaiki kelancaran sintaksis dan menghilangkan ambiguitas semantis pada "kabar buruk". Tidak ada makna tambahan mengenai pekerjaan Yusuf, usia tepat yang dimaksud oleh "pemuda," maupun kebenaran laporan Yusuf. Catatan kaki dan penandanya tetap selaras dengan teks.
