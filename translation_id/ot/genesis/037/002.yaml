  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: id
  text: Inilah keturunan Yakub:[a] Yusuf, pada usia tujuh belas tahun, sedang menggembalakan kawanan ternak bersama saudara-saudaranya. Ia masih muda, dan ia bersama anak-anak Bilha serta anak-anak Zilpa, istri-istri ayahnya. Yusuf membawa laporan yang buruk tentang mereka kepada ayah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Inilah riwayat keluarga Yakub.” Kata Ibrani toledot sering memperkenalkan bagian baru dalam Kitab Kejadian dan dapat menunjuk pada apa yang berlanjut dari seseorang, bukan hanya keturunan biologisnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ayah mereka”; bentuk jamak dalam bahasa Ibrani menunjukkan Yakub sebagai ayah Yusuf dan saudara-saudaranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: keturunan
  rationale: Dalam Kitab Kejadian, istilah ini menjadi judul struktural bagi riwayat atau garis keturunan yang berlanjut dari seseorang. 'Keturunan' mempertahankan istilah teknis yang lazim, sementara catatan kaki menjelaskan cakupan maknanya.
- source_word: הָיָה רֹעֶה
  choice: menggembalakan
  rationale: Konstruksi partisipial menunjukkan kegiatan yang sedang berlangsung; 'menggembalakan' mempertahankan citra pekerjaan gembala secara alami dalam bahasa Indonesia.
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: menggembalakan kawanan ternak bersama saudara-saudaranya
  rationale: Ungkapan ini paling wajar dipahami sebagai Yusuf bekerja dengan kawanan ternak bersama saudara-saudaranya, bukan menggembalakan saudara-saudaranya.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: Yusuf telah disebut berumur tujuh belas tahun; 'pemuda' sesuai dengan usianya dan tidak memberi kesan bahwa ia masih anak kecil.
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: ia bersama anak-anak Bilha dan anak-anak Zilpa
  rationale: Susunan Ibraninya sulit dan bersifat sirkumstansial. 'Bersama' mempertahankan hubungan Yusuf dengan saudara-saudara tirinya tanpa menambahkan peran yang tidak dinyatakan.
- source_word: נְשֵׁי אָבִיו
  choice: istri-istri ayahnya
  rationale: Ini merupakan padanan langsung dan alami yang mengidentifikasi Bilha dan Zilpa.
- source_word: דִּבָּתָם רָעָה
  choice: kabar buruk tentang mereka
  rationale: Ungkapan ini menunjuk pada laporan yang tidak baik mengenai mereka. 'Kabar buruk' alami dalam bahasa Indonesia dan tidak memutuskan apakah laporan itu benar atau fitnah.
- source_word: אֶל אֲבִיהֶם
  choice: kepada ayah mereka
  rationale: Akhiran Ibrani berbentuk jamak dan menggambarkan Yakub sebagai ayah Yusuf sekaligus saudara-saudaranya; bentuk ini dipertahankan.
theological_decisions:
- issue: Nilai kebenaran laporan Yusuf
  choice: kabar buruk tentang mereka
  alternative: fitnah tentang mereka
  rationale: Teks menyebut laporan itu buruk, tetapi tidak secara eksplisit menyatakan bahwa laporan tersebut palsu; terjemahan tidak boleh menjadikan Yusuf pemfitnah tanpa dasar tekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama Bilhah dan Zilpah disesuaikan dengan bentuk Indonesia yang lazim, Bilha dan Zilpa. Struktur Ibrani yang sulit dibuat alami tanpa menghapus hubungan sirkumstansial antara Yusuf dan anak-anak Bilha serta Zilpa.
