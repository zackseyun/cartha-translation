  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: id
  text: Mari, kita jual dia kepada orang-orang Ismael, dan jangan kita mencelakainya[a], sebab dia saudara kita, darah daging kita[b].” Saudara-saudaranya pun mendengarkan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “janganlah tangan kita ada padanya,” yaitu jangan kita mencelakainya secara langsung.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “daging kita”; maksudnya, keluarga sedarah kita.'
    reason: lexical_alternative
  - marker: c
    text: “Mendengarkan” dalam konteks ini juga dapat dipahami sebagai “mengindahkan” atau “menyetujui.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Mari
  rationale: Imperatif jamak ini dipakai secara idiomatis sebagai ajakan untuk bertindak; “Mari” alami dalam percakapan musyawarah.
- source_word: וְנִמְכְּרֶנּוּ
  choice: kita jual dia
  rationale: Bentuk kohortatif menyatakan usul atau ajakan; sesudah “Mari,” konstruksi ini menyampaikan daya volitifnya dengan wajar.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: kepada orang Ismael
  rationale: Menunjuk kelompok etnis keturunan Ismael; “orang Ismael” merupakan bentuk Indonesia yang jelas dan alami.
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: dan jangan kita mencelakainya
  rationale: Secara harfiah, “janganlah tangan kita ada padanya.” Dalam konteks ini ungkapan tersebut berarti jangan melakukan kekerasan atau mencelakainya secara langsung; terjemahan idiomatis menghindari ungkapan Indonesia yang dapat disalahpahami hanya sebagai larangan menyentuh.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi usul Yehuda.
- source_word: אָחִינוּ
  choice: saudara kita
  rationale: Padanan langsung bagi istilah kekerabatan tersebut.
- source_word: בְשָׂרֵנוּ
  choice: darah daging kita
  rationale: Ungkapan Indonesia ini mempertahankan gambaran jasmani sekaligus menyampaikan hubungan keluarga sedarah.
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: Saudara-saudaranya pun mendengarkan dia
  rationale: שמע dapat berarti mendengar, mendengarkan, mengindahkan, atau menyetujui. “Mendengarkan dia” mempertahankan keluasan makna, sedangkan “pun” menandai kelanjutan naratif.
