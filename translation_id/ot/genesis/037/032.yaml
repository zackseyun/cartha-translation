  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: id
  text: Lalu mereka mengirimkan jubah berlengan panjang itu[a] dan membawanya kepada ayah mereka. Kata mereka, “Kami menemukan ini. Coba kenali[b] apakah ini jubah anak Ayah atau bukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah berhias” atau “tunik yang dihiasi dengan indah”; secara tradisional, “jubah berwarna-warni.” Arti ungkapan Ibraninya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “coba pastikan.” Kata Ibrani yang dipakai berarti mengenali atau mengidentifikasi. Pilihan kata ini penting dalam keseluruhan kisah, yang berulang kali menampilkan pengenalan dan kegagalan mengenali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: Lalu mereka mengirimkan
  rationale: Bentuk piel dalam rangkaian naratif berarti ‘mengirimkan’. ‘Lalu’ mencerminkan kelanjutan alur tanpa memperjelas siapa pembawanya, yang tidak disebutkan dalam teks.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: jubah berlengan panjang
  rationale: כְּתֹנֶת adalah pakaian panjang seperti jubah atau tunik, sedangkan פַּסִּים tidak pasti dan mungkin menunjuk pada pakaian yang mencapai telapak tangan atau kaki. Pilihan ini menyampaikan salah satu arti yang paling mungkin tanpa mengikuti tradisi ‘berwarna-warni’ yang tidak dinyatakan secara pasti oleh bahasa Ibrani.
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: dan membawanya kepada ayah mereka
  rationale: Akhiran ‘-nya’ secara wajar merujuk pada jubah. ‘Ayah mereka’ mempertahankan ungkapan eksplisit bahasa Ibrani tanpa menambahkan nama Yakub.
- source_word: זֹאת מָצָאנוּ
  choice: Kami menemukan ini
  rationale: Terjemahan ini mempertahankan pernyataan singkat dan menipu para saudara Yusuf dalam susunan yang alami bagi bahasa Indonesia modern.
- source_word: הַכֶּר נָא
  choice: Coba kenali
  rationale: Bentuk hiphil dari נכר berarti mengenali atau mengidentifikasi, sedangkan נָא melembutkan permintaan. ‘Coba kenali’ terdengar alami dan tetap mempertahankan motif pengenalan yang berulang dalam narasi.
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: apakah ini jubah anak Ayah atau bukan
  rationale: Ungkapan ‘apakah ... atau bukan’ mempertahankan pertanyaan tak langsung dalam bahasa Ibrani. ‘Anak Ayah’ merupakan sapaan Indonesia yang alami sekaligus mempertahankan cara para saudara itu mengambil jarak dengan menyebut Yusuf sebagai ‘anakmu’, bukan ‘saudara kami’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Sapaan ‘anak Ayah’ dipilih agar dialog keluarga terdengar alami, sambil mempertahankan jarak retoris para saudara Yusuf. Ketidakpastian leksikal pada jenis jubah dijaga melalui catatan kaki.
