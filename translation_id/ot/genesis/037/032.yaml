  source_fidelity: 'Teks Indonesia dengan setia mencerminkan urutan verba Ibrani: mereka mengirimkan pakaian itu, membawanya kepada ayah mereka, lalu menyampaikan pernyataan singkat dan permintaan untuk mengenalinya. “Jubah berlengan panjang” menyampaikan salah satu pemahaman yang mungkin atas כְּתֹנֶת הַפַּסִּים tanpa mengklaim kepastian tentang warna atau hiasannya. “Anak Ayah” secara idiomatis mempertahankan pengambilan jarak yang terdapat dalam “anakmu.”'
  naturalness: Bahasanya baku, jelas, dan cocok untuk narasi Alkitab modern. “Coba kenali apakah ... atau bukan” dapat dipahami secara alami sebagai permintaan untuk mengidentifikasi pakaian tersebut; pilihan ini juga mempertahankan gema kata kerja “mengenali.”
