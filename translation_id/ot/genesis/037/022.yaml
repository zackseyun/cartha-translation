  naturalness: Bahasa umumnya baku dan mudah dipahami. “Jangan menyentuh dia” adalah padanan Indonesia yang lebih idiomatis dan tajam untuk larangan tersebut. Struktur dengan tanda pisah setelah ucapan langsung dapat menandai komentar narator tanpa pengulangan yang kaku.
  terminology: “Ruben,” “Yusuf,” “padang belantara,” dan “lubang” sesuai dengan penggunaan Alkitab bahasa Indonesia yang lazim. Catatan “tempat penampungan air” dapat dipahami, tetapi “sumur tadahan” atau “penampung air” bukanlah padanan yang perlu dipaksakan; “tempat penampungan air bawah tanah” cukup sebagai alternatif penjelas untuk בּוֹר.
