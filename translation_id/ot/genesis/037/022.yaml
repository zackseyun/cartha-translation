  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֣ם רְאוּבֵן֮ אַל תִּשְׁפְּכוּ דָם֒ הַשְׁלִ֣יכוּ אֹת֗/וֹ אֶל הַ/בּ֤וֹר הַ/זֶּה֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר וְ/יָ֖ד אַל תִּשְׁלְחוּ ב֑/וֹ לְמַ֗עַן הַצִּ֤יל אֹת/וֹ֙ מִ/יָּדָ֔/ם לַ/הֲשִׁיב֖/וֹ אֶל אָבִֽי/ו׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: id
  text: Lalu Ruben berkata kepada mereka, “Jangan tumpahkan darah. Lemparkan dia ke dalam lubang[a] ini yang ada di padang belantara, tetapi jangan sentuh dia”—supaya ia dapat menyelamatkan Yusuf dari tangan mereka dan mengembalikannya kepada ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat penampungan air.” Kata Ibrani בּוֹר dapat berarti lubang atau tempat penampungan air bawah tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: Jangan tumpahkan darah
  rationale: Mempertahankan ungkapan Ibrani tentang penumpahan darah, yang dalam konteks ini mengacu pada pembunuhan dan kesalahan karena darah, tanpa mereduksinya menjadi parafrasa “jangan bunuh dia”.
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: Lemparkan dia
  rationale: Menyampaikan perintah fisik secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: הַבּוֹר
  choice: lubang
  rationale: Istilah Ibrani dapat menunjuk pada lubang atau tempat penampungan air. “Lubang” mempertahankan cakupan makna yang luas; alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: yang ada di padang belantara
  rationale: Mewakili klausa relatif אֲשֶׁר dan memakai istilah yang tidak membatasi מִדְבָּר pada gurun pasir.
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: tetapi jangan mencelakakan dia dengan tangan kalian
  rationale: Mengungkapkan larangan melakukan kekerasan langsung terhadap Yusuf sambil tetap mempertahankan gambaran “tangan” dari idiom Ibrani.
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: menyelamatkan Yusuf dari tangan mereka
  rationale: “Dari tangan mereka” mempertahankan idiom Ibrani yang berarti dari kuasa atau kendali mereka. Nama Yusuf dipakai agar rujukan pronomina dalam kalimat Indonesia tetap jelas.
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: mengembalikannya kepada ayahnya
  rationale: 'Secara ringkas menyampaikan bentuk kausatif verba Ibrani: membuat Yusuf kembali kepada ayahnya.'
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hubungan klausa tujuan לְמַעַן dengan ucapan langsung Ruben
  choice: 'Menutup ucapan langsung sebelum klausa tujuan dan merendernya sebagai penjelasan narator: “Ruben berkata demikian supaya ...”'
  alternative: Memasukkan klausa tujuan ke dalam ucapan Ruben atau menyambungkannya tanpa penanda peralihan
  rationale: Klausa tersebut menjelaskan niat tersembunyi Ruben, bukan bagian dari perkataannya kepada saudara-saudaranya. Perumusan ini menjaga peralihan antara dialog dan komentar narator.
- issue: Subjek tersirat pada הַצִּיל
  choice: Ruben sebagai subjek “ia dapat menyelamatkan”
  alternative: Membiarkan subjek tujuan tidak dinyatakan secara eksplisit
  rationale: Infinitif Ibrani tidak menyebut subjek secara terpisah, tetapi konteks dan tindakan mengembalikan Yusuf kepada ayahnya menunjuk kepada Ruben. Bahasa Indonesia memerlukan subjek yang lebih jelas agar kalimat alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Idiom “menumpahkan darah” dan “dari tangan mereka” dipertahankan karena masih dapat dipahami, sedangkan idiom tindakan tangan dibuat sedikit lebih eksplisit agar alami.
