  to: Lalu Ruben berkata kepada mereka, “Jangan tumpahkan darah. Lemparkan dia ke dalam lubang[a] ini yang ada di padang belantara, tetapi jangan sentuh dia”—supaya ia dapat menyelamatkan Yusuf dari tangan mereka dan mengembalikannya kepada ayahnya.
