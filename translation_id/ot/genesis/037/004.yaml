  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan mempertahankan kata 'mengasihi' serta perbandingan eksplisit dalam bahasa Ibrani, sementara idiom לְשָׁלֹם diterjemahkan secara alami dan alternatif yang lebih formal dicatat dalam catatan kaki.
