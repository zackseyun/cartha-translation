  text: וַ/יִּרְא֣וּ אֶחָ֗י/ו כִּֽי אֹת֞/וֹ אָהַ֤ב אֲבִי/הֶם֙ מִ/כָּל אֶחָ֔י/ו וַֽ/יִּשְׂנְא֖וּ אֹת֑/וֹ וְ/לֹ֥א יָכְל֖וּ דַּבְּר֥/וֹ לְ/שָׁלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: id
  text: Ketika saudara-saudaranya melihat bahwa ayah mereka lebih mengasihi dia daripada semua saudaranya, mereka membencinya dan tidak dapat berbicara baik-baik kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “berbicara kepadanya dengan damai,” yaitu berbicara kepadanya dengan sikap bersahabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Ketika ... melihat
  rationale: Bentuk naratif ini melanjutkan kisah sekaligus menghubungkan apa yang dilihat saudara-saudara Yusuf dengan kebencian mereka sebagai akibatnya.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Dalam konteks ini, bentuk tersebut menunjuk kepada saudara-saudara laki-laki Yusuf; bahasa Indonesia lazim memakai 'saudara-saudara' tanpa harus menambahkan 'laki-laki'.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang mereka lihat, bukan sekadar alasan yang terpisah.
- source_word: אָהַב
  choice: mengasihi
  rationale: Kata Ibrani ini adalah kata umum untuk mengasihi. Unsur pilih kasih tersirat melalui perbandingan, tetapi tidak perlu dimasukkan ke dalam verba.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Akhiran orang ketiga jamak merujuk kepada saudara-saudara itu secara kolektif.
- source_word: מִכָּל אֶחָיו
  choice: daripada semua saudaranya
  rationale: Mempertahankan perbandingan harfiah dengan 'semua saudaranya' tanpa menambahkan kata 'yang lain', yang hanya tersirat.
- source_word: וַיִּשְׂנְאוּ
  choice: mereka membencinya
  rationale: Verba שׂנא secara langsung berarti membenci dan cocok diterjemahkan sebagai tindakan naratif lampau.
- source_word: וְלֹא יָכְלוּ
  choice: dan tidak dapat
  rationale: Mengungkapkan ketidakmampuan yang timbul dari kebencian mereka dengan susunan Indonesia yang alami.
- source_word: דַּבְּרוֹ
  choice: berbicara ... kepadanya
  rationale: Akhiran pronominal menunjuk kepada Yusuf sebagai orang yang diajak atau disapa berbicara.
- source_word: לְשָׁלֹם
  choice: baik-baik
  rationale: Dalam konteks hubungan antarmanusia, ungkapan ini berarti berbicara dengan damai atau bersahabat. 'Berbicara baik-baik' merupakan idiom Indonesia alami yang menangkap maksud tersebut.
