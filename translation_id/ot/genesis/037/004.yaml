  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan urutan naratif Ibrani: saudara-saudara itu melihat kasih ayah mereka yang lebih besar kepada Yusuf, lalu membencinya dan tidak mampu berbicara kepadanya dalam hubungan yang damai/bersahabat. Perbandingan מִכָּל אֶחָיו dipertahankan tanpa menambahkan unsur penafsiran seperti “yang lain.”'
  naturalness: Kalimatnya wajar, jelas, dan sesuai ragam Indonesia modern. “Berbicara baik-baik kepadanya” merupakan idiom yang alami untuk ketidakmampuan berbicara secara damai atau ramah dalam konteks relasi yang rusak.
  terminology: “Mengasihi” tepat bagi אָהַב dan tidak secara berlebihan menggantinya dengan gagasan pilih kasih. “Membenci” tepat bagi שׂנא. Catatan kaki secara memadai mencatat alternatif yang lebih dekat dengan bentuk idiom Ibrani לְשָׁלוֹם.
