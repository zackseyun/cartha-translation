  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: id
  text: Kemudian mereka mengambil tunik Yusuf[a], menyembelih seekor kambing jantan, lalu mencelupkan tunik itu ke dalam darah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jubah” atau “baju”; istilah Ibrani ini menunjuk pakaian berbentuk tunik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Kemudian mereka mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa; “kemudian” menghasilkan alur naratif Indonesia yang alami.
- source_word: כְּתֹנֶת יוֹסֵף
  choice: tunik Yusuf
  rationale: כְּתֹנֶת menunjuk pakaian berbentuk tunik; “tunik” dekat dengan makna sumber dan tidak menyiratkan mantel modern.
- source_word: וַיִּשְׁחֲטוּ
  choice: menyembelih
  rationale: Kata kerja ini secara khusus lazim digunakan untuk membunuh hewan dengan cara menyembelih.
- source_word: שְׂעִיר עִזִּים
  choice: seekor kambing jantan
  rationale: Frasa Ibrani menentukan bahwa hewan itu kambing jantan; terjemahan ini mempertahankan pembedaan jenis kelamin.
- source_word: וַיִּטְבְּלוּ
  choice: mencelupkan
  rationale: Kata ini berarti mencelupkan atau membenamkan; “mencelupkan” paling alami untuk tindakan memasukkan pakaian ke dalam darah.
- source_word: הַכֻּתֹּנֶת
  choice: tunik itu
  rationale: Pilihan ini konsisten dengan penyebutan pertama dan artikelnya secara alami merujuk kembali kepada tunik Yusuf.
- source_word: בַּדָּם
  choice: ke dalam darahnya
  rationale: Preposisi בְּ menyatakan medium atau tempat pencelupan. Akhiran “-nya” menjelaskan secara alami bahwa darah tersebut berasal dari kambing yang baru disembelih, sebagaimana ditentukan konteks langsung.
