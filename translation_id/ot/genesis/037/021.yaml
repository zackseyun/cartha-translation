  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: id
  text: Tetapi ketika Ruben mendengar hal itu, ia menyelamatkan Yusuf dari tangan mereka, lalu berkata, “Janganlah kita membunuhnya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Janganlah kita memukulnya sampai mati.” Secara harfiah, bahasa Ibrani berbunyi, “Janganlah kita memukulnya mengenai nyawanya,” sebuah ungkapan untuk memberikan pukulan yang mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ketika ... mendengar hal itu
  rationale: Kata שׁמע pada dasarnya berarti 'mendengar'. 'Hal itu' secara wajar merujuk pada rencana atau perkataan saudara-saudaranya dalam ayat sebelumnya, sedangkan 'ketika' menyampaikan urutan naratif dengan lancar.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וַיַּצִּלֵהוּ
  choice: ia menyelamatkan Yusuf
  rationale: Bentuk Hifil dari נצל berarti 'melepaskan, menyelamatkan'. Nama 'Yusuf' digunakan untuk memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: מִיָּדָם
  choice: dari tangan mereka
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang kuasa atau kendali mereka atas Yusuf; ungkapan ini juga dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: dengan berkata
  rationale: Dalam konteks ini perkataan Ruben merupakan sarana yang dipakainya untuk menyelamatkan Yusuf; 'dengan berkata' menyampaikan hubungan tersebut secara alami tanpa mengubah isi narasi.
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: Janganlah kita membunuhnya
  rationale: Secara harfiah ungkapan ini berbicara tentang tidak memukulnya pada nyawa, tetapi נכה bersama נֶפֶשׁ merupakan idiom untuk memberikan pukulan mematikan. 'Membunuhnya' menyampaikan maksudnya secara ringkas dan jelas.
