revisions:
- from: Kemudian Yusuf mendapat mimpi lain lagi dan menceritakannya kepada saudara-saudaranya. Ia berkata, “Lihat, aku bermimpi lagi. Tampak matahari, bulan, dan sebelas bintang bersujud kepadaku[a].”
  to: 'Kemudian Yusuf bermimpi lagi, sebuah mimpi lain, lalu ia menceritakannya kepada saudara-saudaranya. Ia berkata, “Lihat, aku bermimpi lagi: matahari, bulan, dan sebelas bintang sedang bersujud kepadaku[a].”'
  rationale: Revisi mengganti ungkapan yang kurang langsung dengan verba “bermimpi,” mempertahankan pengulangan bahwa ini mimpi tambahan, dan menyusun isi mimpi sehingga subjek tindakan serta aspek berlangsung dari partisipel Ibrani jelas. Catatan kaki juga diperbaiki agar alternatifnya akurat dan penjelasan konteksnya tidak menambahkan pembatasan teologis yang tidak diperlukan.
