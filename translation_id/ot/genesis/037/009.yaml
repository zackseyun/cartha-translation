base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: id
  text: 'Kemudian Yusuf bermimpi lagi, sebuah mimpi lain, lalu ia menceritakannya kepada saudara-saudaranya. Ia berkata, “Lihat, aku bermimpi lagi: matahari, bulan, dan sebelas bintang sedang bersujud kepadaku[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang bersujud di hadapanku.” Kata Ibrani ini dapat menunjuk pada tindakan merendahkan diri secara mendalam. Dalam konteks ini, tindakan itu menyatakan penghormatan atau ketundukan, bukan penyembahan kultis.
    reason: Menjelaskan alternatif ungkapan dan makna penghormatan/ketundukan dari verba Ibrani tanpa mengubahnya menjadi penyembahan.
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: Kemudian Yusuf mendapat mimpi lain lagi
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita, sehingga diterjemahkan dengan 'Kemudian'. Gabungan עוֹד dan אַחֵר menegaskan bahwa ini mimpi tambahan; 'lain lagi' mempertahankan pengulangan itu secara alami. Nama 'Yusuf' dipakai untuk memperjelas subjek tersirat dalam bahasa Indonesia.
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: dan menceritakannya kepada saudara-saudaranya
  rationale: סִפֵּר berarti menceritakan atau menuturkan. Bentuk '-nya' merujuk pada mimpi tersebut, sedangkan 'saudara-saudaranya' sesuai dengan bentuk jamak maskulin dan konteks.
- source_word: הִנֵּה
  choice: Lihat
  rationale: הִנֵּה menarik perhatian pendengar. 'Lihat' merupakan padanan modern dan langsung tanpa nuansa arkais.
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: aku bermimpi lagi
  rationale: Ungkapan ini menyatakan bahwa Yusuf mengalami mimpi tambahan. Bahasa Indonesia tidak lazim mempertahankan konstruksi serumpun secara harfiah seperti 'memimpikan sebuah mimpi', sehingga dipilih bentuk yang alami.
- source_word: וְהִנֵּה
  choice: Tampak
  rationale: הִנֵּה kedua memperkenalkan pemandangan di dalam mimpi. 'Tampak' mempertahankan daya penunjuknya tanpa mengulang 'Lihat' secara kaku.
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: matahari, bulan, dan sebelas bintang
  rationale: Terjemahan langsung dan idiomatis untuk ketiga unsur langit serta bilangannya.
- source_word: מִשְׁתַּחֲוִים לִי
  choice: bersujud kepadaku
  rationale: Partisipel menggambarkan tindakan yang sedang berlangsung dalam adegan mimpi. 'Bersujud' menyampaikan tindakan merendahkan tubuh secara mendalam; catatan kaki menjelaskan bahwa dalam konteks ini tindakan tersebut menyatakan penghormatan atau ketundukan, bukan ibadah ilahi.
theological_decisions:
- issue: Makna מִשְׁתַּחֲוִים dalam mimpi Yusuf
  choice: bersujud kepadaku dalam arti memberi hormat atau menyatakan ketundukan
  alternative: menyembah aku; membungkuk di hadapanku
  rationale: Konteks langsung dan penggenapan naratifnya berkaitan dengan ketundukan keluarga kepada Yusuf, bukan penyembahan kepada ilah. 'Bersujud' mempertahankan kuatnya tindakan fisik dalam kata Ibrani, sementara catatan kaki mencegah pembacaan kultis yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang jelas dan dialog yang wajar. Pengulangan mimpi dipertahankan, sedangkan dua kemunculan הִנֵּה dibedakan menjadi 'Lihat' dan 'Tampak' agar daya penunjuknya tetap terasa tanpa terdengar kaku.
