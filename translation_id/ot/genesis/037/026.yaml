  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: id
  text: Lalu Yehuda berkata kepada saudara-saudaranya, “Apa untungnya jika kita membunuh saudara kita dan menutupi darahnya?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “menutupi darahnya” berarti menyembunyikan penumpahan darah atau kesalahan karena menumpahkan darah. Dapat juga diterjemahkan, “menyembunyikan darahnya.”
    reason: Menjelaskan idiom Ibrani sambil memberikan alternatif leksikal.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “Lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Bentuk maskulin jamak merujuk kepada saudara-saudara laki-laki Yusuf yang hadir; dalam konteks ini “saudara-saudaranya” sudah jelas dan alami.
- source_word: מַה בֶּצַע
  choice: Apa untungnya
  rationale: בֶּצַע berarti keuntungan atau manfaat, sering bernuansa kepentingan pribadi atau materi. Ungkapan ini mempertahankan perhitungan pragmatis Yehuda.
- source_word: כִּי
  choice: jika
  rationale: 'Dalam pertanyaan retoris ini, כִּי secara idiomatis memperkenalkan keadaan yang sedang dipertimbangkan: “jika kita membunuh...”'
- source_word: נַהֲרֹג
  choice: kita membunuh
  rationale: Bentuk orang pertama jamak dalam pertanyaan retoris ini dapat disampaikan secara langsung dengan bentuk “kita membunuh”.
- source_word: אָחִינוּ
  choice: saudara kita
  rationale: Terjemahan langsung yang mempertahankan daya moral dari hubungan kekeluargaan yang ditekankan dalam ayat.
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: dan menutupi darahnya
  rationale: Terjemahan ini mempertahankan gambaran Ibrani “menutupi darahnya”, yang menyiratkan penyembunyian penumpahan darah atau kesalahan tanpa mengganti idiom itu sepenuhnya dengan penafsiran.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar. “Apa untungnya” dipilih sebagai pertanyaan retoris yang mudah dipahami, sedangkan “menutupi darahnya” mempertahankan citraan teks sumber dan dijelaskan melalui catatan kaki.
