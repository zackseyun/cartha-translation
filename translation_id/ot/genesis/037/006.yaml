  yaml_path: translation/ot/genesis/037/006.yaml
  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Tolong dengarkan mimpi yang kumimpikan ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa memberi hubungan yang lebih khusus.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Menerjemahkan preposisi dan sufiks pronominal secara langsung serta menunjukkan pihak yang disapa.
- source_word: שִׁמְעוּ נָא
  choice: Tolong dengarkan
  rationale: Imperatif jamak שִׁמְעוּ meminta perhatian, sedangkan נָא memperhalus atau menguatkan permintaan dengan sopan; “tolong dengarkan” alami dalam bahasa Indonesia modern.
- source_word: הַחֲלוֹם הַזֶּה
  choice: mimpi ... ini
  rationale: Konstruksi nomina definit dan demonstratif Ibrani secara alami dinyatakan dengan demonstratif sesudah frasa nomina dalam bahasa Indonesia.
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: yang kumimpikan
  rationale: Mempertahankan klausa relatif dan pengulangan serumpun antara חֲלוֹם, “mimpi,” dan חָלַם, “bermimpi,” tanpa membuat kalimat terasa janggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pronomina “ia” dipakai sesuai konteks ayat, sementara bentuk terikat “ku-” menjaga kelancaran ujaran langsung. Repetisi etimologis Ibrani dipertahankan melalui “mimpi yang kumimpikan,” sehingga tidak diperlukan catatan kaki.
