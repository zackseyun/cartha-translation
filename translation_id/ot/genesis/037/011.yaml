  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: id
  text: Maka saudara-saudaranya iri kepadanya, tetapi ayahnya menyimpan perkataan itu dalam hatinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperhatikan perkara itu”; maksudnya, ia terus mengingat dan mempertimbangkan apa yang diceritakan Yusuf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: iri
  rationale: Dalam konteks ini, קנא menyatakan rasa iri yang timbul karena kedudukan Yusuf dan mimpi-mimpinya; “iri” adalah padanan Indonesia yang alami dan tepat.
- source_word: בּוֹ
  choice: kepadanya
  rationale: Dengan קנא, preposisi ב menandai orang yang menjadi sasaran rasa iri; “iri kepadanya” merupakan ungkapan Indonesia yang wajar.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk Ibrani ini maskulin jamak dan dalam narasi merujuk kepada saudara-saudara laki-laki Yusuf; konteks membuat rujukannya jelas.
- source_word: וְאָבִיו
  choice: tetapi ayahnya
  rationale: Walaupun ו secara harfiah dapat berarti “dan”, di sini terdapat kontras antara reaksi saudara-saudaranya dan sikap ayahnya; “tetapi” menyampaikan hubungan wacana itu secara alami.
- source_word: שָׁמַר
  choice: menyimpan ... dalam hatinya
  rationale: שׁמר secara dasar berarti menjaga atau menyimpan, tetapi di sini berarti mempertahankan sesuatu dalam ingatan dan terus memperhatikannya. Ungkapan Indonesia ini mempertahankan citra penyimpanan sekaligus menyampaikan makna idiomatisnya.
- source_word: אֶת־הַדָּבָר
  choice: perkataan itu
  rationale: דבר dapat berarti perkataan, perkara, atau hal. “Perkataan itu” menjaga hubungan dengan apa yang Yusuf ceritakan, tanpa menutup kemungkinan bahwa yang direnungkan adalah makna seluruh perkara tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Ungkapan “menyimpan ... dalam hatinya” mudah dipahami oleh pembaca umum, sedangkan catatan kaki mempertahankan keluasan makna דבר dan nuansa perhatian berkelanjutan dalam שׁמר.
