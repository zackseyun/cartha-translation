    issue: Pengulangan 'keadaan' tidak tampak dalam terjemahan.
    rationale: Teks Ibrani mengulang שְׁלוֹם untuk saudara-saudara dan kawanan ternak. Walaupun elipsis dalam draf dapat dipahami, pengulangan yang eksplisit lebih setia pada susunan dan penekanan sumber.
  - severity: low
    issue: '''Menyuruhnya pergi dari'' kurang langsung dibandingkan verba pengutusan.'
    rationale: וַיִּשְׁלָחֵהוּ berarti 'ia mengutusnya/mengirimnya'; 'mengutusnya dari Lembah Hebron' menyampaikan tindakan itu tanpa menambahkan penekanan pada perintah untuk pergi.
