  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: id
  text: Ia berkata kepadanya, “Pergilah sekarang, periksalah keadaan saudara-saudaramu dan keadaan kawanan ternak itu, lalu bawalah kabar kembali kepadaku.” Maka ia mengutusnya dari Lembah Hebron, dan ia pun tiba di Sikhem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶךְ נָא
  choice: Pergilah sekarang
  rationale: Imperatif לֶךְ berarti 'pergi', sedangkan נָא melembutkan atau mendesakkan permintaan. 'Pergilah sekarang' wajar dalam alur narasi dan mempertahankan nuansa segera.
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: periksalah keadaan
  rationale: Secara harfiah berarti 'lihatlah kesejahteraan/shalom'. Dalam konteks penugasan untuk mengetahui kondisi mereka, 'periksalah keadaan' menyampaikan fungsi idiom itu secara alami tanpa membatasi keadaan tersebut hanya pada kesehatan.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Bentuk Ibrani maskulin jamak merujuk kepada saudara-saudara laki-laki Yusuf; dalam bahasa Indonesia, 'saudara-saudaramu' adalah bentuk alami dan konteks menetapkan rujukannya.
- source_word: הַצֹּאן
  choice: kawanan ternak itu
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing. 'Kawanan ternak' mempertahankan cakupan kolektif tanpa menentukan spesies secara berlebihan.
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: lalu bawalah kabar kembali kepadaku
  rationale: Bentuk kausatif dari שוב bersama דָּבָר menyatakan membawa kembali laporan. Ungkapan Indonesia ini mempertahankan unsur kembali dan tujuan pelaporan.
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: dari Lembah Hebron
  rationale: עֵמֶק berarti 'lembah', dan konstruksi tersebut menyatakan lembah yang terkait dengan Hebron.
- source_word: שְׁכֶמָה
  choice: ke Sikhem / tiba di Sikhem
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Sikhem. Dalam konteks וַיָּבֹא, 'ia pun tiba di Sikhem' alami dan menangkap hasil gerak itu.
