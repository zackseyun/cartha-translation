  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: id
  text: Ia kembali kepada saudara-saudaranya dan berkata[a], “Anak itu sudah tidak ada, dan aku—ke mana aku harus pergi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Anak itu tidak ada, dan aku—ke mana aku datang?” Dalam ungkapan Ibrani ini, pertanyaan tersebut berarti, “Ke mana aku dapat atau harus pergi?” dan dapat juga menyatakan, “Apa yang harus kulakukan?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Ia kembali
  rationale: Bentuk wayyiqtol dari שׁוב menyatakan tindakan kembali dalam urutan narasi; ‘kembali’ ringkas dan alami dalam bahasa Indonesia.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: אֶל menunjukkan arah, sedangkan אֶחָיו merujuk kepada saudara-saudara laki-laki Ruben dalam konteks keluarga ini.
- source_word: הַיֶּלֶד
  choice: Anak itu
  rationale: יֶלֶד berarti anak laki-laki atau anak muda; ‘anak itu’ wajar sebagai sebutan Ruben bagi Yusuf dan tidak memberi kesan usia yang terlalu spesifik.
- source_word: אֵינֶנּוּ
  choice: sudah tidak ada
  rationale: Ungkapan ini secara harfiah menyatakan bahwa Yusuf tidak ada di tempat itu. ‘Sudah tidak ada’ menyampaikan ketidakhadirannya tanpa memastikan bahwa ia telah mati.
- source_word: וַאֲנִי
  choice: Dan aku—
  rationale: Konjungsi dan pronomina yang eksplisit mengalihkan penekanan secara mendadak kepada keadaan Ruben; tanda pisah mempertahankan keterputusan emosional itu.
- source_word: אָנָה אֲנִי בָא
  choice: ke mana aku harus pergi?
  rationale: Secara bentuk berarti ‘ke mana aku datang/pergi’, tetapi dalam konteks ini merupakan pertanyaan tertekan tentang ke mana Ruben dapat menghadap atau apa yang harus dilakukannya. ‘Harus pergi’ alami sekaligus mempertahankan citra gerak.
