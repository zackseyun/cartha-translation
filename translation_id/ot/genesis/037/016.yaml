base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/016.yaml
  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: id
  text: Ia berkata, “Aku sedang mencari saudara-saudaraku. Tolong beri tahu aku di mana mereka sedang menggembala.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan narasi; bahasa Indonesia yang wajar tidak perlu selalu menyatakan penghubung וַ dengan ‘dan’.
- source_word: אֶת אַחַי
  choice: saudara-saudaraku
  rationale: אֶת menandai objek langsung, sedangkan אַחַי berarti ‘saudara-saudaraku’; konteks menunjukkan saudara-saudara laki-laki Yusuf.
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: Aku sedang mencari
  rationale: Pronomina mandiri dengan partisipel menyatakan tindakan yang sedang berlangsung; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: הַגִּידָה נָּא לִי
  choice: Tolong beri tahu aku
  rationale: Imperatif Hifil dengan נָא menyampaikan permintaan sopan; ‘tolong’ mempertahankan nuansa tersebut.
- source_word: אֵיפֹה הֵם
  choice: di mana mereka
  rationale: אֵיפֹה menanyakan lokasi dan הֵם adalah subjek eksplisit jamak.
- source_word: רֹעִים
  choice: menggembalakan ternak
  rationale: Partisipel Qal dari רעה dalam konteks ini berarti menjaga atau membawa hewan merumput. ‘Menggembalakan ternak’ merupakan ungkapan Indonesia yang alami; kata ‘ternak’ menjelaskan objek yang tersirat dari konteks tanpa mempersempitnya menjadi jenis hewan tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bernada naratif. Pronomina ‘ia’ dipakai dalam narasi dan ‘aku’ dalam ujaran langsung. Tidak diperlukan catatan kaki karena padanan ‘menggembalakan ternak’ secara alami mencakup tindakan merawat hewan di padang rumput.
