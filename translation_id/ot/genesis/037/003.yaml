review_pass:
  verdict: revise
  source_fidelity: Frasa «anak yang lahir pada masa tuanya» membuat unsur kelahiran menjadi lebih eksplisit daripada idiom Ibrani בֶן־זְקֻנִים, yang secara harfiah berarti “putra masa tuanya.” Selain itu, «jubah istimewa» terlalu umum dan tidak menyatakan salah satu nuansa leksikal yang mungkin dari כְּתֹנֶת פַּסִּים. Revisi mempertahankan idiom usia tua tanpa menegaskan kelahiran secara berlebihan dan memakai padanan utama yang sejalan dengan jejak audit Inggris sambil mempertahankan ketidakpastian melalui catatan kaki.
  naturalness: «Putra pada masa tuanya» merupakan ungkapan Indonesia baku bernuansa naratif yang alami dalam konteks ini. Pengulangan nama Yusuf pada kalimat kedua memperjelas penerima tindakan tanpa ambiguitas pronominal.
  terminology: «Israel» dan «Yusuf» dipertahankan sesuai nama dalam teks. «Mengasihi» tepat untuk אָהַב. «Jubah yang dihiasi dengan indah» mencerminkan pilihan audit Inggris “richly ornamented robe,” sedangkan catatan kaki tetap memberi alternatif tradisional dan penjelasan ketidakpastian istilah Ibrani.
  issues:
  - severity: medium
    issue: «anak yang lahir pada masa tuanya» mempersempit idiom Ibrani.
    rationale: Ungkapan בֶן זְקֻנִים menghubungkan Yusuf dengan masa tua Israel, tetapi tidak secara eksplisit menyatakan “lahir.” Padanan yang lebih idiomatis dan dekat mempertahankan keluasan ini.
  - severity: medium
    issue: «jubah istimewa» terlalu tidak spesifik untuk כְּתֹנֶת פַּסִּים.
    rationale: Walaupun arti פַּסִּים diperdebatkan, “istimewa” hanya menyatakan status khusus dan tidak mencerminkan nuansa ornamen atau bentuk pakaian yang menjadi pokok ketidakpastian. Padanan berhias, dengan catatan kaki, lebih selaras dengan audit Inggris tanpa menghapus alternatif.
  revised_text: Israel lebih mengasihi Yusuf daripada semua anak laki-lakinya, sebab Yusuf adalah putra pada masa tuanya. Israel membuatkan Yusuf sebuah jubah yang dihiasi dengan indah.[a]
