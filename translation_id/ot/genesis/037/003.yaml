  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: id
  text: Israel lebih mengasihi Yusuf daripada semua anak laki-lakinya, sebab Yusuf adalah putra pada masa tuanya. Israel membuatkan Yusuf sebuah jubah yang dihiasi dengan indah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional, “jubah berwarna-warni.” Arti ungkapan Ibraninya tidak pasti; ungkapan itu mungkin menunjuk kepada jubah berhias mewah atau jubah yang memanjang hingga pergelangan tangan dan kaki, bukan khusus kepada warnanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: Israel
  rationale: Nama pribadi dalam teks Ibrani dipertahankan. Konjungsi וְ tidak perlu diterjemahkan secara eksplisit pada awal ayat karena dalam narasi Indonesia hubungan dengan konteks sudah jelas.
- source_word: אָהַב
  choice: lebih mengasihi
  rationale: Kata kerja ini berarti 'mengasihi'; unsur perbandingan berasal dari frasa berikutnya, bukan dari penggantian maknanya menjadi 'lebih menyayangi' atau 'mengistimewakan'.
- source_word: מִכָּל בָּנָיו
  choice: daripada semua anak laki-lakinya
  rationale: מִן menyatakan perbandingan, sedangkan בָּנָיו secara khusus merujuk kepada anak-anak laki-laki Israel.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi kasih Israel yang lebih besar kepada Yusuf.
- source_word: בֶן זְקֻנִים הוּא לוֹ
  choice: Yusuf adalah anak yang lahir pada masa tuanya
  rationale: Ungkapan Ibrani mengaitkan Yusuf dengan masa tua Israel. Bentuk eksplisit dengan nama Yusuf menghindari kerancuan pronomina dalam bahasa Indonesia dan menyampaikan idiom secara alami.
- source_word: וְעָשָׂה לוֹ
  choice: Israel membuatkan baginya
  rationale: Bentuk ini mempertahankan tindakan Israel dan nuansa benefaktif לוֹ. Pengulangan nama memperjelas pelaku setelah klausa sebelumnya.
- source_word: כְּתֹנֶת פַּסִּים
  choice: sebuah jubah istimewa
  rationale: Makna פַּסִּים tidak pasti. 'Jubah istimewa' menyampaikan bahwa pakaian itu berbeda atau khusus tanpa memastikan bahwa cirinya adalah warna-warni, hiasan, lengan panjang, atau panjang hingga pergelangan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. 'Mengasihi' mempertahankan bobot kata Ibrani אָהַב, sedangkan 'jubah istimewa' menjaga ketidakpastian leksikal pada כְּתֹנֶת פַּסִּים. Tanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
