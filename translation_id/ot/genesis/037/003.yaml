revisions:
- from: Israel lebih mengasihi Yusuf daripada semua anak laki-lakinya, sebab Yusuf adalah anak yang lahir pada masa tuanya. Israel membuatkan baginya sebuah jubah istimewa.[a]
  to: Israel lebih mengasihi Yusuf daripada semua anak laki-lakinya, sebab Yusuf adalah putra pada masa tuanya. Israel membuatkan Yusuf sebuah jubah yang dihiasi dengan indah.[a]
  rationale: Revisi menghilangkan penegasan kelahiran yang tidak tersurat dalam idiom Ibrani dan mengganti istilah pakaian yang terlalu generik dengan padanan yang mencerminkan salah satu pembacaan utama dalam audit Inggris. Catatan kaki tetap menandai bahwa makna tepatnya diperselisihkan dan menyediakan alternatif tradisional.
