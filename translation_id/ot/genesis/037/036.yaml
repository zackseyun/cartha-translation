  text: וְ/הַ֨/מְּדָנִ֔ים מָכְר֥וּ אֹת֖/וֹ אֶל מִצְרָ֑יִם לְ/פֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר הַ/טַּבָּחִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: id
  text: Sementara itu, orang-orang Medan[a] menjual dia ke Mesir kepada Potifar, seorang pejabat Firaun[b], kepala pengawal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang-orang Medan”. Dalam konteks kisah di sekitarnya dan berdasarkan sejumlah versi kuno, mereka secara tradisional dipahami sebagai orang-orang Midian.'
    reason: alternative_reading
  - marker: b
    text: Atau “seorang sida-sida Firaun” atau “seorang pejabat istana Firaun”. Istilah Ibrani ini dapat menunjuk kepada sida-sida secara harfiah ataupun pejabat kerajaan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepala para penyembelih”. Dalam lingkungan kerajaan, ungkapan ini kemungkinan menunjuk kepada kepala pengawal, pengawal pribadi, atau pelaksana hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: Sementara itu, orang-orang Medan
  rationale: Konjungsi וְ menandai peralihan kembali ke alur Yusuf dan diterjemahkan secara wajar sebagai “Sementara itu”. Bentuk teks Masoret מְדָנִים secara langsung menunjuk kepada orang-orang Medan; kaitannya dengan orang Midian dalam narasi sekitar dicatat tanpa mengganti bentuk teks utama.
- source_word: מָכְרוּ אֹתוֹ
  choice: menjual dia
  rationale: Bentuk perfektif Qal melanjutkan narasi dengan tindakan lampau; objek pronominal merujuk kepada Yusuf. Dalam gaya naratif Indonesia, “menjual dia” jelas dan alami.
- source_word: אֶל מִצְרָיִם
  choice: ke Mesir
  rationale: Preposisi אֶל bersifat terarah. Bahasa Indonesia cukup menyatakannya dengan “ke Mesir”, tanpa ungkapan kaku seperti “ke dalam Mesir”.
- source_word: לְפוֹטִיפַר
  choice: kepada Potifar
  rationale: Preposisi לְ menandai Potifar sebagai pembeli atau penerima; “kepada” mempertahankan hubungan tersebut secara alami.
- source_word: סְרִיס פַּרְעֹה
  choice: seorang pejabat Firaun
  rationale: סָרִיס dapat berarti sida-sida secara harfiah atau pejabat istana. “Pejabat” tidak memutuskan secara berlebihan apakah ia dikebiri, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: שַׂר הַטַּבָּחִים
  choice: kepala pengawal
  rationale: Secara harfiah frasa ini berarti kepala atas para penyembelih atau pelaksana hukuman. Dalam konteks kerajaan, jabatan keamanan istana paling alami dinyatakan sebagai “kepala pengawal”; arti harfiahnya dicatat.
