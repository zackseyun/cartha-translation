translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Bentuk etnonim Masoret dipertahankan dalam teks utama, sedangkan identifikasi tradisional dengan orang Midian dijelaskan dalam catatan. Penanda catatan ditempatkan langsung sesudah unsur yang diterangkannya.
