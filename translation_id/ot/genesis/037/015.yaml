- from: Seorang laki-laki menemukan dia, dan ternyata dia sedang berjalan ke sana kemari di padang. Laki-laki itu bertanya kepadanya, “Apa yang kaucari?”[a]
  to: Seorang laki-laki menjumpainya ketika ia sedang mengembara di padang. Laki-laki itu bertanya kepadanya, “Apa yang kaucari?”[a]
  rationale: Revisi mengganti uraian gerak “berjalan ke sana kemari” dengan “sedang mengembara,” yang lebih dekat dengan makna תֹעֶה dan tetap tidak memutuskan apakah Yusuf benar-benar tersesat. Susunan kalimat juga dibuat lebih alami sambil mempertahankan subjek, objek, keadaan Yusuf di padang, dan pertanyaan langsung dalam teks Ibrani. Penanda catatan kaki tetap terikat pada pertanyaan dan isi catatan tetap merupakan alternatif leksikal/aspektual yang sah.
