  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: id
  text: Seorang laki-laki menjumpainya ketika ia sedang mengembara di padang. Laki-laki itu bertanya kepadanya, “Apa yang kaucari?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang sedang kamu cari?”
    reason: Alternatif ini menyatakan secara lebih eksplisit bahwa tindakan mencari itu sedang berlangsung.
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: menemukan dia
  rationale: Bentuk Qal dari מצא secara langsung berarti ‘menemukan’; terjemahan ini mempertahankan tindakan dan objek pronominal dalam narasi.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ di sini menunjuk kepada seorang individu laki-laki yang belum diperkenalkan.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Ungkapan ini menyampaikan fungsi הִנֵּה sebagai penanda keadaan yang terlihat atau disadari, dengan bahasa Indonesia yang alami.
- source_word: תֹעֶה
  choice: sedang berjalan ke sana kemari
  rationale: Partisipel תעה menggambarkan orang yang menyimpang atau berkeliling tanpa arah yang jelas. Pilihan ini mempertahankan gerak yang sedang berlangsung tanpa memastikan bahwa Yusuf sepenuhnya tersesat.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה dapat berarti ladang atau kawasan terbuka; ‘padang’ paling sesuai dengan konteks Yusuf yang mencari saudara-saudaranya di daerah penggembalaan.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: bertanya kepadanya
  rationale: שאל lazim berarti ‘bertanya’; bentuk ini alami dan tetap menyatakan penerima pertanyaan.
- source_word: לֵאמֹר
  choice: bertanya ... “...”
  rationale: Rumus לֵאמֹר memperkenalkan ucapan langsung. Dalam bahasa Indonesia, fungsinya terwakili secara alami oleh verba ujaran dan tanda petik tanpa menambahkan ‘katanya’ yang berulang.
- source_word: מַה תְּבַקֵּשׁ
  choice: Apa yang kaucari?
  rationale: בקש berarti mencari atau berusaha mendapatkan. ‘Apa yang kaucari?’ ringkas, alami, dan mempertahankan pertanyaan langsung.
