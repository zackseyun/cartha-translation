  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Partikel הִנֵּה diterjemahkan secara idiomatis sebagai ‘ternyata’, sedangkan ambiguitas תֹעֶה dipertahankan dengan tidak menegaskan bahwa Yusuf benar-benar tersesat.
