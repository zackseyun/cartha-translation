  naturalness: “Menjumpainya ketika ia sedang mengembara di padang” adalah bahasa Indonesia baku modern yang mengalir. Kata ganti “ia” secara wajar merujuk kepada orang yang dijumpai, sedangkan “laki-laki itu” jelas menjadi penanya.
  terminology: אִישׁ tetap diterjemahkan “seorang laki-laki”; שָׂדֶה sebagai “padang” masih memadai dalam konteks lahan terbuka; dan מַה תְּבַקֵּשׁ diterjemahkan secara idiomatis sebagai “Apa yang kaucari?” Tidak ada istilah teologis khusus dalam ayat ini.
