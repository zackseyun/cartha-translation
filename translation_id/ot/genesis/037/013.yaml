  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: id
  text: Lalu Israel berkata kepada Yusuf, “Bukankah saudara-saudaramu sedang menggembalakan di Sikhem? Mari, aku akan mengirimmu kepada mereka.” Yusuf menjawab kepadanya, “Ini aku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub; karena itu bentuk yang ada dalam sumber dipertahankan.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “bukankah” mempertahankan daya tanya tersebut secara alami dalam bahasa Indonesia.
- source_word: אַחֶיךָ
  choice: saudara-saudaramu
  rationale: Bentuk jamak dengan akhiran orang kedua tunggal merujuk khusus kepada saudara-saudara Yusuf.
- source_word: רֹעִים
  choice: sedang menggembalakan ternak
  rationale: Partisipel dari רעה menyatakan kegiatan menjaga dan membawa ternak merumput. Penambahan “ternak” membuat objek tersiratnya jelas dan wajar dalam bahasa Indonesia tanpa membatasinya secara tidak perlu pada jenis hewan tertentu.
- source_word: בִּשְׁכֶם
  choice: di Sikhem
  rationale: Preposisi בְּ menyatakan lokasi; “di” merupakan padanan Indonesia yang langsung dan alami, sedangkan nama tempat ditransliterasikan sebagai Sikhem.
- source_word: לְכָה
  choice: Mari
  rationale: Imperatif ini berfungsi sebagai ajakan atau panggilan sebelum penugasan. “Mari” menyampaikan fungsi idiomatis itu dengan wajar, tanpa mengubahnya menjadi perintah “pergilah”.
- source_word: וְאֶשְׁלָחֲךָ
  choice: aku akan mengutusmu
  rationale: Bentuk orang pertama sesudah imperatif menyatakan maksud Israel untuk mengirim Yusuf; “mengutus” sesuai dengan penugasan yang disengaja dalam konteks ini.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Pronomina ini merujuk kembali kepada saudara-saudara Yusuf dan dapat dipertahankan tanpa pengulangan nomina.
- source_word: הִנֵּנִי
  choice: Ya, aku siap
  rationale: Ungkapan penyahutan ini menyatakan kehadiran sekaligus kesiapsediaan. Dalam konteks panggilan dan penugasan, “Ya, aku siap” menyampaikan fungsi idiomatisnya secara alami dalam bahasa Indonesia.
