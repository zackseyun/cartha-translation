  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Sapaan memakai bentuk akrab “aku/engkau” yang sesuai untuk hubungan ayah dan anak; bentuk terikat “-mu” dipakai agar dialog mengalir alami.
