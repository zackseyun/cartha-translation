  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: id
  text: Lihatlah, kami sedang mengikat berkas-berkas di tengah ladang; lihatlah, berkasku bangkit dan juga berdiri tegak; lihatlah, berkas-berkas kalian mengelilingi berkasku dan bersujud kepada berkasku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membungkuk dalam-dalam di hadapan berkasku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah ... Tiba-tiba ... Lalu lihatlah
  rationale: Penanda wacana yang berulang itu mempertahankan kesegeraan dan tahap-tahap penglihatan dalam penuturan mimpi. Variasi alami dalam bahasa Indonesia menghindari kekakuan tanpa menghilangkan daya hidup narasi.
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: mengikat berkas-berkas gandum
  rationale: Kata kerja dan nomina serumpun menunjuk pada kegiatan mengikat batang-batang gandum menjadi berkas. Penyebutan 'gandum' memperjelas gambaran pertanian yang sudah tersirat dalam istilah Ibrani.
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: di tengah ladang
  rationale: Mempertahankan nuansa spasial בְּתוֹךְ, bukan sekadar 'di ladang', dengan ungkapan Indonesia yang wajar.
- source_word: קָמָה
  choice: bangkit
  rationale: Menandai gerakan berkas itu naik sebelum keadaan berikutnya, yaitu berdiri tegak.
- source_word: וְגַם נִצָּבָה
  choice: dan berdiri tegak
  rationale: Menjaga urutan tindakan serta gagasan bahwa berkas tersebut berdiri kukuh atau tegak setelah bangkit.
- source_word: תְסֻבֶּינָה
  choice: mengelilingi
  rationale: Kata kerja ini menyatakan gerakan berputar atau mengitari; 'mengelilingi' jelas dan alami dalam adegan mimpi ini.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: sujud kepadanya
  rationale: Menggambarkan tindakan membungkukkan diri sangat rendah di hadapan berkas Yusuf, tanpa secara eksplisit menetapkan apakah tindakan itu ibadah atau penghormatan politik.
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: berkasku / berkas-berkas kalian
  rationale: Konsisten mempertahankan benda yang menjadi lambang dalam mimpi dan membedakan bentuk tunggal dari jamak.
theological_decisions:
- issue: Makna tindakan וַתִּשְׁתַּחֲוֶיןָ
  choice: sujud kepadanya
  alternative: membungkuk di hadapannya
  rationale: '''Sujud'' mempertahankan kuatnya gerak merendahkan diri dalam teks, tetapi konteks mimpi dibiarkan menentukan maknanya tanpa menyatakannya sebagai penyembahan ilahi.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan penanda penglihatan dipertahankan secara alami, sedangkan rangkaian adegan dipisahkan menjadi tiga kalimat agar mudah dipahami. Pronomina 'kalian' menandai orang kedua jamak dengan jelas.
