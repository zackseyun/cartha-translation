  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: id
  text: Mereka berkata satu sama lain, “Lihat, si tukang mimpi itu datang![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pemilik/tuan mimpi-mimpi.” Ungkapan Ibrani ini diterjemahkan sebagai “tukang mimpi” untuk mencerminkan nada ejekan saudara-saudaranya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan rangkaian tindakan naratif; dalam bahasa Indonesia, urutan itu sudah jelas tanpa harus menambahkan ‘dan’ atau ‘kemudian’.
- source_word: אִישׁ אֶל־אָחִיו
  choice: satu sama lain
  rationale: Secara harfiah berarti ‘seorang kepada saudaranya’, tetapi dalam konteks ini merupakan ungkapan timbal balik. ‘Satu sama lain’ menyampaikan maknanya secara alami.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru ini menarik perhatian kepada Yusuf yang sedang mendekat. ‘Lihat’ merupakan padanan modern dan langsung.
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: si tukang mimpi
  rationale: Secara harfiah frasa ini berarti ‘pemilik/tuan mimpi-mimpi’ dan menunjuk kepada orang yang dicirikan oleh mimpi. ‘Si tukang mimpi’ mempertahankan nada ejekan saudara-saudaranya dengan bahasa Indonesia yang alami.
- source_word: הַלָּזֶה
  choice: itu
  rationale: Kata tunjuk ini menunjuk Yusuf dengan nuansa menjauhkan atau meremehkan; ‘itu’ menyampaikan nada tersebut secara wajar dalam bahasa Indonesia.
- source_word: בָּא
  choice: datang
  rationale: Partisipel dari בוא menggambarkan Yusuf yang sedang mendekat. Dalam ujaran langsung ‘itu datang’ terdengar alami dan menyatakan tindakan yang sedang berlangsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lisan tetapi tetap bermartabat. Ungkapan ‘si tukang mimpi’ dipilih untuk mempertahankan ejekan dalam ujaran para saudara tanpa menjadikannya terlalu formal atau kaku.
