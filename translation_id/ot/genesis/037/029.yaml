  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: id
  text: Ketika Ruben kembali ke lubang itu[a], ternyata Yusuf tidak ada di dalamnya. Lalu ia mengoyakkan pakaiannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perigi itu”; kata Ibrani bor dapat berarti lubang atau perigi penampung air.
    reason: lexical_alternative
  - marker: b
    text: Mengoyakkan pakaian merupakan ungkapan lazim untuk menunjukkan dukacita, keterkejutan, atau kesusahan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk naratif dari שׁוב menyatakan bahwa Ruben kembali ke lokasi sebelumnya; 'kembali' alami dalam bahasa Indonesia dan tidak memperinci arah atau cara secara berlebihan.
- source_word: הַבּוֹר / בַּבּוֹר
  choice: lubang itu / di dalamnya
  rationale: בּוֹר dapat berarti lubang atau perigi penampung air. 'Lubang' mudah dipahami dan sesuai dengan konteks; pengulangan kedua diganti dengan pronomina agar kalimat Indonesia tetap alami tanpa mengubah acuannya.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: הִנֵּה menarik perhatian kepada keadaan yang mendadak disadari Ruben. 'Ternyata' menyampaikan daya naratif tersebut secara alami dalam bahasa Indonesia modern.
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: Yusuf tidak ada di dalamnya
  rationale: אֵין menyatakan ketiadaan atau ketidakhadiran. Terjemahan ini mempertahankan pernyataan faktual bahwa Yusuf tidak berada di lubang itu tanpa menambahkan penafsiran tentang ke mana ia pergi.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  choice: Lalu ia mengoyakkan pakaiannya
  rationale: Ungkapan ini secara harfiah menggambarkan tindakan merobek pakaian sebagai tanda dukacita, keterkejutan, atau kesusahan. 'Mengoyakkan pakaiannya' jelas, bermartabat, dan mempertahankan tindakan konkret teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ternyata' dipakai untuk membawa fungsi wacana הִנֵּה secara idiomatis, sedangkan 'mengoyakkan' mempertahankan tindakan budaya yang konkret.
