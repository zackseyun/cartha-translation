  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: id
  text: Ketika Yusuf datang kepada saudara-saudaranya, mereka melucuti Yusuf dari jubahnya, yaitu jubah istimewa[a] yang dipakainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Arti ungkapan Ibrani yang diterjemahkan “jubah istimewa” tidak pasti. Kemungkinan lain: “jubah berlengan panjang”, “jubah panjang”, “jubah berhias indah”, atau, menurut terjemahan tradisional, “jubah berwarna-warni”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Ungkapan naratif ini memperkenalkan peristiwa berikutnya. Dalam bahasa Indonesia, “Ketika” menyampaikan hubungan waktunya secara alami tanpa meniru idiom Ibrani secara kaku.
- source_word: בָּא
  choice: sampai
  rationale: Dalam konteks gerak Yusuf menuju saudara-saudaranya, “sampai” secara alami menyatakan bahwa ia tiba di tempat mereka.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Bentuk maskulin jamak ini dalam konteks menunjuk kepada saudara-saudara laki-laki Yusuf; bahasa Indonesia lazim memakai “saudara-saudaranya” tanpa perlu menambahkan “laki-laki”.
- source_word: וַיַּפְשִׁיטוּ
  choice: mereka melucuti Yusuf dari
  rationale: Kata kerja ini menggambarkan tindakan menanggalkan pakaian dari seseorang, kemungkinan secara paksa. “Melucuti ... dari” mempertahankan kekuatan tindakan tersebut.
- source_word: כֻּתָּנְתּוֹ
  choice: jubahnya
  rationale: כֻּתֹּנֶת menunjuk pada pakaian panjang seperti tunik. “Jubah” lebih mudah dipahami pembaca Indonesia dan cocok dengan pakaian luar khas dalam kisah ini.
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: jubah istimewa
  rationale: Makna פַּסִּים tidak pasti. “Jubah istimewa” mempertahankan sifat khas pakaian itu tanpa menetapkan bahwa cirinya pasti warna-warni, berhias, berlengan panjang, atau panjang hingga pergelangan.
- source_word: אֲשֶׁר עָלָיו
  choice: yang sedang dipakainya
  rationale: Ungkapan ini menerangkan bahwa jubah tersebut berada pada tubuh Yusuf saat itu; terjemahan ini alami dalam bahasa Indonesia.
