  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan nama Yusuf dipertahankan untuk mencerminkan penekanan teks Ibrani, sedangkan ketidakpastian mengenai bentuk jubah disampaikan melalui catatan kaki.
