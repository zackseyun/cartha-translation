  text: וַ/יֵּ֣שֶׁב יַעֲקֹ֔ב בְּ/אֶ֖רֶץ מְגוּרֵ֣י אָבִ֑י/ו בְּ/אֶ֖רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: id
  text: Yakub tinggal di negeri tempat ayahnya tinggal sebagai pendatang[a], yaitu di negeri Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di negeri pengembaraan ayahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: Yakub tinggal
  rationale: Kata kerja ישׁב di sini menyatakan bahwa Yakub berdiam atau menetap. 'Tinggal' merupakan ungkapan Indonesia modern yang alami tanpa menyiratkan tingkat kepermanenan yang tidak dinyatakan teks. Waw naratif tidak diberi padanan temporal tersendiri.
- source_word: בְּאֶרֶץ
  choice: di negeri
  rationale: אֶרֶץ dalam konteks geografis-teritorial berarti 'negeri' atau 'tanah'. 'Negeri' jelas dan wajar untuk wilayah Kanaan.
- source_word: מְגוּרֵי אָבִיו
  choice: tempat ayahnya hidup sebagai pendatang
  rationale: מְגוּרִים menunjuk pada kediaman sebagai orang asing atau pendatang. Bentuk klausa ini menyampaikan makna konstruksi Ibrani secara alami dan mempertahankan nuansa bahwa ayah Yakub bukan penduduk asli yang memiliki negeri itu.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: yaitu di negeri Kanaan
  rationale: Teks Ibrani mengulangi בְּאֶרֶץ dan menjelaskan bahwa negeri tersebut adalah Kanaan. 'Yaitu' menandai hubungan penjelas tanpa menghilangkan pengulangan geografis itu.
theological_decisions:
- issue: Status ayah Yakub di Kanaan
  choice: hidup sebagai pendatang
  alternative: pernah tinggal
  rationale: Padanan ini mempertahankan nuansa מְגוּרֵי bahwa kediamannya adalah kediaman seorang pendatang, yang penting bagi gambaran leluhur yang tinggal di negeri yang belum mereka miliki sepenuhnya, tanpa menambahkan penafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan utama dibuat alami bagi pembaca umum, sedangkan catatan kaki mempertahankan bentuk nominal yang lebih dekat dengan ungkapan Ibrani.
