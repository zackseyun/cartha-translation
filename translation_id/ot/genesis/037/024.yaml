  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: id
  text: Lalu mereka mengambilnya dan melemparkannya ke dalam lubang[a] itu. Lubang itu kosong; tidak ada air di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sumur tadah”. Kata Ibrani bor dapat berarti lubang atau tempat penampung air; keterangan bahwa tidak ada air di dalamnya mendukung kemungkinan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: Lalu mereka menangkap dia
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. Dalam konteks tindakan paksa terhadap Yusuf, 'menangkap dia' menyampaikan makna mengambil atau memegangnya tanpa sekuat 'menyeret' atau 'meringkus'.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: dan melemparkannya
  rationale: Kata השליך berarti melemparkan atau mencampakkan. 'Melemparkannya' alami dalam bahasa Indonesia modern dan mempertahankan kekerasan tindakan tanpa menambah intensitas.
- source_word: הַבֹּרָה
  choice: ke dalam lubang itu
  rationale: Kata בּוֹר dapat menunjuk pada lubang, sumur penampung, atau liang. 'Lubang' mempertahankan keluasan makna Ibrani, sedangkan kemungkinan 'sumur penampung' dicatat dalam catatan kaki.
- source_word: וְהַבּוֹר רֵק
  choice: Lubang itu kosong
  rationale: Klausa ini memberi keterangan penjelas tentang lubang tersebut. Kalimat baru tanpa konjungsi lebih alami dalam bahasa Indonesia dan tidak mengubah hubungan wacananya.
- source_word: אֵין בּוֹ מָיִם
  choice: tidak ada air di dalamnya
  rationale: Terjemahan ini secara langsung dan idiomatis mempertahankan penegasan eksplisit bahwa lubang itu tidak berisi air.
