  source_fidelity: Kata kerja וַיִּקָּחֻהוּ secara dasar berarti “mereka mengambilnya.” Terjemahan draft “menangkap dia” menambahkan nuansa penangkapan/penyergapan yang tidak dinyatakan oleh kata Ibrani tersebut. Selebihnya, tindakan melemparkan, tujuan “ke dalam lubang itu,” serta penjelasan bahwa lubang itu kosong dan tanpa air diterjemahkan dengan setia.
  naturalness: Teksnya umumnya jelas dan alami dalam bahasa Indonesia baku. Penggunaan pronomina enklitik “mengambilnya” lebih lancar daripada “menangkap dia” dan sekaligus lebih dekat dengan makna leksikal sumber. “Lubang itu kosong; tidak ada air di dalamnya” tetap lugas dan idiomatis.
  terminology: “Lubang” adalah padanan yang baik dan cukup luas untuk Ibrani bor, tanpa memaksakan arti “sumur” atau “penjara.” Catatan kaki dipertajam dengan alternatif “sumur tadah,” yang lebih jelas menyampaikan kemungkinan cistern daripada istilah “sumur penampung” yang kurang lazim.
