base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: id
  text: Saudara-saudaranya berkata kepadanya, “Apakah engkau benar-benar akan memerintah sebagai raja atas kami? Apakah engkau benar-benar akan berkuasa atas kami?” Maka mereka semakin membencinya karena mimpi-mimpinya dan karena perkataannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: Apakah engkau benar-benar akan menjadi raja
  rationale: Konstruksi infinitif absolut dan verba finit dari akar מלך memberi penegasan; “benar-benar” menyampaikan daya retoris itu, sedangkan “menjadi raja atas” secara alami mempertahankan citra kerajaan.
- source_word: מָשׁוֹל תִּמְשֹׁל
  choice: Apakah engkau benar-benar akan berkuasa
  rationale: Konstruksi emfatis paralel dipertahankan, dan משל dibedakan dari מלך dengan “berkuasa”, tanpa menghilangkan kesejajaran kedua pertanyaan.
- source_word: וַיּוֹסִפוּ עוֹד שְׂנֹא אֹתוֹ
  choice: Maka mereka semakin membencinya
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa mereka menambah lagi kebencian; “semakin membenci” merupakan padanan Indonesia yang alami dan tepat.
- source_word: דְּבָרָיו
  choice: perkataannya
  rationale: Bentuk jamak dengan sufiks tunggal merujuk pada ucapan atau kata-kata Yusuf; bentuk kolektif “perkataannya” terdengar wajar dan mempertahankan rujukan yang cukup luas.
theological_decisions:
- issue: Apakah pertanyaan saudara-saudara Yusuf menyatakan kepastian atau ejekan retoris
  choice: Dipertahankan sebagai dua pertanyaan retoris dengan penegasan “benar-benar”
  alternative: “Engkau tidak mungkin menjadi raja ...” atau pernyataan bahwa Yusuf pasti akan memerintah
  rationale: Partikel tanya הֲ dan konstruksi emfatis mengungkapkan penolakan atau ketidakpercayaan, tetapi teks tidak mengubahnya menjadi penyangkalan eksplisit maupun pengakuan nubuat.
- issue: Pembedaan antara מלך dan משל
  choice: “menjadi raja” dan “berkuasa”
  alternative: Menerjemahkan keduanya dengan “memerintah”
  rationale: Pembedaan leksikal dalam teks sumber dipertahankan tanpa menambahkan teori khusus tentang jenis pemerintahan Yusuf.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan retoris sumber dipertahankan; pronomina “engkau” sesuai dengan dialog keluarga dalam gaya naratif Alkitab.
