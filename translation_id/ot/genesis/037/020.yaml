  source_fidelity: Terjemahan pada dasarnya setia pada urutan dan daya ajakan-kohortatif Ibrani. “Binatang buas telah memangsanya” menyampaikan חַיָּה רָעָה אֲכָלָתְהוּ secara wajar, dan “apa jadinya mimpi-mimpinya” mempertahankan ejekan terbuka dalam klausa penutup. Revisi hanya memperjelas penanda wacana awal dan merapikan tanda baca kutipan.
  naturalness: “Jadi sekarang, mari” terdengar agak bertumpuk dalam bahasa Indonesia baku. “Sekarang, mari” lebih idiomatis sambil tetap menyampaikan וְעַתָּה dan לְכוּ. “Kita akan melihat” sedikit lebih baku daripada “kita akan lihat” untuk register naratif ini.
  terminology: “Lubang” tepat sebagai padanan umum untuk בּוֹר; catatan kaki dengan alternatif tempat penampungan air/cistern mempertahankan ambiguitas leksikal. “Binatang buas” adalah padanan modern yang lazim bagi חַיָּה רָעָה.
