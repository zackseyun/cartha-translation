base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: id
  text: Sekarang, mari kita bunuh dia dan lemparkan dia ke dalam salah satu lubang[a], lalu kita akan berkata, ‘Seekor binatang buas telah memangsanya.’ Sesudah itu, kita akan melihat apa jadinya mimpi-mimpinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “salah satu tempat penampungan air.” Kata Ibrani בּוֹר dapat merujuk pada lubang atau tempat penampungan air bawah tanah, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mempertahankan daya penghubung sekaligus nuansa waktu dan desakan dalam usulan para saudara.
- source_word: לְכוּ
  choice: mari
  rationale: Imperatif jamak ini berfungsi secara idiomatis sebagai ajakan untuk bertindak bersama, bukan perintah harfiah untuk pergi.
- source_word: וְנַהַרְגֵהוּ
  choice: kita bunuh dia
  rationale: Dalam konstruksi dengan 'mari', bentuk kohortatif menyatakan usulan tindakan bersama.
- source_word: וְנַשְׁלִכֵהוּ
  choice: lemparkan dia
  rationale: Menyampaikan tindakan melemparkan atau mencampakkan secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: ke dalam salah satu lubang
  rationale: בּוֹר dapat berarti lubang atau tempat penampungan air; 'lubang' mempertahankan cakupan umum istilah tersebut, sedangkan alternatif kontekstual dicatat dalam catatan kaki.
- source_word: וְאָמַרְנוּ
  choice: Lalu kita akan berkata
  rationale: Mengungkapkan tindakan berikutnya dalam rencana mereka dengan urutan yang alami.
- source_word: חַיָּה רָעָה
  choice: binatang buas
  rationale: Ungkapan ini menunjuk pada binatang liar yang berbahaya; 'binatang buas' ringkas, alami, dan sesuai dengan konteks ancaman.
- source_word: אֲכָלָתְהוּ
  choice: telah memangsanya
  rationale: Secara harfiah verba berarti 'memakan', tetapi dalam konteks binatang buas dan kematian manusia, 'memangsa' menyampaikan maknanya secara alami tanpa menambah rincian.
- source_word: וְנִרְאֶה
  choice: Sesudah itu, kita akan lihat
  rationale: Mempertahankan bentuk orang pertama jamak dan nuansa konsekuensial serta ejekan dalam rencana mereka.
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: apa jadinya mimpi-mimpinya
  rationale: Ungkapan Indonesia yang alami untuk tantangan bernada mengejek tentang apa yang akan terjadi dengan mimpi-mimpi Yusuf.
theological_decisions:
- issue: Daya ujar וְנִרְאֶה dan hubungan dengan mimpi Yusuf
  choice: kita akan lihat apa jadinya mimpi-mimpinya
  alternative: mari kita lihat bagaimana mimpi-mimpinya akan terwujud
  rationale: Pilihan utama mempertahankan ejekan dan ketegangan naratif tanpa menyatakan lebih jauh apakah saudara-saudaranya sedang menyangkal penggenapan ilahi atau sekadar menantang hasil mimpi itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ajakan 'mari' membuat rangkaian kohortatif alami; 'memangsanya' dipilih agar laporan palsu tentang serangan binatang terdengar idiomatis. Tanda kutip mencakup seluruh ucapan para saudara sampai akhir ayat.
