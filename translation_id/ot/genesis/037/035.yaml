base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: id
  text: Lalu semua anak laki-laki dan semua anak perempuannya bangkit untuk menghiburnya, tetapi ia menolak untuk dihibur. Ia berkata, “Sebab sambil berkabung aku akan turun ke Syeol kepada anakku.” Maka ayahnya menangisi dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: datang
  rationale: Secara harfiah berarti ‘bangkit/berdiri’, tetapi dalam konteks tindakan menuju Yakub untuk menghiburnya, ‘datang’ menyampaikan gerak naratif secara wajar dalam bahasa Indonesia tanpa memberi tekanan yang tidak diperlukan pada postur tubuh.
- source_word: כָל בָּנָיו וְכָל בְּנֹתָיו
  choice: semua anak laki-laki dan anak perempuannya
  rationale: Mempertahankan pembedaan eksplisit Ibrani antara anak laki-laki dan anak perempuan, alih-alih meratakannya menjadi ‘semua anaknya’.
- source_word: לְנַחֲמוֹ ... לְהִתְנַחֵם
  choice: untuk menghiburnya ... dihibur
  rationale: Pasangan ‘menghibur/dihibur’ mempertahankan kaitan leksikal kedua bentuk נחם dan terdengar alami dalam konteks dukacita.
- source_word: וַיְמָאֵן
  choice: ia menolak
  rationale: Mengungkapkan penolakan aktif Yakub untuk menerima penghiburan.
- source_word: כִּי
  choice: Tidak
  rationale: Dalam konteks ini כִּי dapat memperkenalkan atau menegaskan alasan penolakan. ‘Tidak’ menghubungkan ucapan secara alami dengan penolakannya, sementara isi alasan tetap dinyatakan dalam kalimat berikutnya.
- source_word: אֵרֵד אֶל־בְּנִי
  choice: aku akan turun kepada anakku
  rationale: Mempertahankan gambaran turun dan preposisi ‘kepada’ tanpa menambahkan gagasan bahwa Yakub sekadar menuju makam anaknya.
- source_word: אָבֵל
  choice: sambil berkabung
  rationale: Menyatakan keadaan atau cara Yakub turun dan menjaga kemungkinan keterkaitannya dengan seluruh tindakan turun.
- source_word: שְׁאֹלָה
  choice: ke dunia orang mati
  rationale: Menyampaikan Sheol sebagai ranah orang mati, bukan hanya sebuah kubur fisik, dalam bahasa Indonesia yang langsung dipahami pembaca.
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: Maka ayahnya menangisi dia
  rationale: Mempertahankan subjek ‘ayahnya’ dan objek ‘dia’; ‘menangisi’ secara idiomatis menyatakan ratapan karena seseorang.
theological_decisions:
- issue: Makna שְׁאוֹל (Sheol)
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: ‘Dunia orang mati’ menjaga cakupan istilah Ibrani sebagai ranah kematian dan tidak membatasinya pada makam fisik ataupun memasukkan doktrin akhirat yang lebih berkembang.
- issue: Hubungan ‘kepada anakku’ dengan ‘ke dunia orang mati’
  choice: mempertahankan kedua arah tujuan dalam urutan ‘kepada anakku ke dunia orang mati’
  alternative: ‘aku akan turun sambil berkabung ke dunia orang mati, kepada anakku’
  rationale: Teks Ibrani menyandingkan anak Yakub dan Sheol sebagai tujuan tanpa menjelaskan secara terperinci hubungan keduanya. Terjemahan mempertahankan ketegangan ini dan tidak menambahkan ‘tempat anakku berada’.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Bentuk ‘ia’ dan ‘aku’ sesuai dengan narasi serta ujaran langsung. Susunan ucapan mempertahankan kepadatan dan ambiguitas teks Ibrani, meskipun frasa tujuan ganda sengaja dibiarkan agak mencolok.
