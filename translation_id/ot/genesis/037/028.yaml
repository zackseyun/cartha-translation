  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: id
  text: Lalu lewatlah orang-orang Midian, para pedagang. Mereka menarik Yusuf ke atas dan mengangkatnya keluar dari sumur itu, lalu menjual Yusuf kepada orang-orang Ismael dengan harga dua puluh keping perak.[a][b] Kemudian mereka membawa Yusuf ke Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan dua puluh perak”; satuannya tidak disebutkan secara eksplisit dalam teks Ibrani.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai bentuk-bentuk kata kerja jamak—“mereka menarik”, “mengangkat”, “menjual”, dan “membawa”—setelah menyebut pedagang Midian dan orang-orang Ismael. Karena itu, kelompok yang dimaksud pada setiap tindakan tidak sepenuhnya jelas.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: lewatlah
  rationale: Kata עבר dalam rangkaian narasi ini menyatakan gerakan melewati tempat tersebut; “lewatlah” alami dan tidak menambahkan gagasan kedatangan yang tidak tersurat.
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: orang-orang Midian, para pedagang
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit tentang orang-orang Midian dan keterangan bahwa mereka adalah pedagang, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ
  choice: mereka menarik Yusuf ke atas dan mengangkatnya keluar
  rationale: Dua verba Ibrani dipertahankan secara berbeda, tetapi dirangkai secara alami untuk menggambarkan gerakan Yusuf dari dalam sumur.
- source_word: מִן הַבּוֹר
  choice: keluar dari sumur itu
  rationale: בּוֹר dapat berarti lubang atau sumur penampung. Dalam konteks kisah ini, “sumur” merupakan istilah Indonesia yang lazim dan sesuai, tanpa mengharuskan penjelasan teknis.
- source_word: לַיִּשְׁמְעֵאלִים
  choice: kepada orang-orang Ismael
  rationale: Objek tidak langsung dinyatakan jelas, dan nama kelompok ini dibedakan dari orang-orang Midian sebagaimana dalam teks Ibrani.
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: dengan harga dua puluh keping perak
  rationale: Secara harfiah teks berbunyi “dengan dua puluh perak” tanpa menyebut satuannya; “keping” memberi ungkapan Indonesia yang dapat dipahami tanpa memastikan bahwa satuannya adalah syikal.
- source_word: וַיָּבִיאוּ אֶת יוֹסֵף מִצְרָיְמָה
  choice: mereka membawa Yusuf ke Mesir
  rationale: Terjemahan ini menyampaikan verba kausatif gerak dan akhiran penunjuk arah pada nama Mesir dengan lugas.
theological_decisions:
- issue: Rujukan subjek verba-verba jamak setelah penyebutan pedagang Midian dan orang-orang Ismael
  choice: Memakai “mereka” tanpa menentukan kelompok yang dimaksud pada setiap tindakan
  alternative: Menetapkan semua tindakan sebagai perbuatan pedagang Midian, atau menetapkan penjualan dan pengangkutan sebagai perbuatan orang-orang Ismael
  rationale: Teks Ibrani memakai verba jamak dan tidak mengulang subjek secara eksplisit. Terjemahan mempertahankan ambiguitas naratif tersebut dan tidak memasukkan harmonisasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan nama Yusuf dipertahankan sesuai penekanan teks sumber. “Orang-orang Midian” dan “orang-orang Ismael” dipilih sebagai bentuk etnonim yang alami dalam bahasa Indonesia.
