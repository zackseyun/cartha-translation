  terminology: “Jubah” dapat dipertahankan sebagai padanan yang mudah dipahami untuk כְּתֹנֶת, dan “Yusuf” ialah bentuk nama yang mapan dalam bahasa Indonesia. “Dicabik-cabik” lebih tepat daripada “diterkam sampai mati” untuk טרף dalam konstruksi pasif yang diperkuat.
