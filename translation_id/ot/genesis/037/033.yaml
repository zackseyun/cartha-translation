base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Yosef has surely been torn to pieces.”
translation:
  language: id
  text: Ia mengenalinya dan berkata, “Ini jubah anakku. Binatang buas telah memakannya. Yusuf benar-benar telah dicabik-cabik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian terakhir berbunyi, “Yusuf sungguh-sungguh dicabik-cabik.” Pengulangan bentuk kata kerja dalam bahasa Ibrani memberi penegasan kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: Ia mengenalinya
  rationale: Bentuk Hifil dari נכר berarti mengenali atau mengidentifikasi; sufiks feminin merujuk kepada כְּתֹנֶת. Dalam bahasa Indonesia, sufiks -nya menyampaikan rujukan itu secara alami.
- source_word: כְּתֹנֶת בְּנִי
  choice: jubah anakku
  rationale: כְּתֹנֶת menunjuk pada pakaian panjang seperti tunik. 'Jubah' lebih mudah dipahami pembaca Indonesia dan cocok dengan konteks pakaian khas Yusuf, tanpa memakai istilah teknis yang kurang lazim.
- source_word: חַיָּה רָעָה
  choice: binatang buas
  rationale: Dalam konteks ini חַיָּה adalah binatang liar, sedangkan רָעָה menandai sifat berbahaya atau ganas, bukan kejahatan moral. Ungkapan Indonesia 'binatang buas' menyampaikan keseluruhan maknanya secara wajar.
- source_word: אֲכָלָתְהוּ
  choice: telah memakannya
  rationale: Kata kerja אכל secara langsung berarti memakan. Dalam konteks serangan binatang, 'memakannya' alami dan tidak perlu memperkuatnya menjadi 'melahapnya'.
- source_word: טָרֹף טֹרַף
  choice: benar-benar telah diterkam sampai mati
  rationale: Infinitif absolut yang diikuti bentuk pasif menegaskan tindakan טרף. 'Benar-benar' mempertahankan penegasan, sedangkan 'diterkam sampai mati' menyampaikan akibat serangan pemangsa secara alami dalam bahasa Indonesia.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: '''Yusuf'' adalah bentuk baku nama ini dalam bahasa Indonesia dan tetap mencerminkan nama Ibrani יוֹסֵף melalui konvensi Indonesia yang mapan.'
theological_decisions:
- issue: Apakah perkataan Yakub menyatakan fakta objektif atau kesimpulannya dari bukti yang menipu
  choice: Mempertahankan pernyataan langsung Yakub tanpa tambahan seperti 'pasti' yang menjelaskan epistemologinya
  alternative: Menambahkan 'pasti' atau 'rupanya' untuk menandai bahwa ini kesimpulan Yakub
  rationale: Teks Ibrani menyajikan kesimpulan Yakub secara langsung dan tegas. Terjemahan tidak boleh mengubahnya menjadi penilaian narator ataupun melemahkannya dengan penjelasan tambahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Ia' dipakai untuk narasi; 'jubah' dan 'binatang buas' mudah dipahami pembaca umum. Penegasan Ibrani dipertahankan dalam teks dan bentuk harfiahnya dijelaskan dalam catatan kaki.
