translation:
  language: id
  text: Lalu Yakub mengoyakkan pakaiannya, mengikatkan kain kabung di pinggangnya, dan berkabung atas anaknya selama berhari-hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: mengoyakkan
  rationale: Dalam konteks perkabungan, קרע menunjuk pada tindakan merobek pakaian sebagai tanda dukacita. “Mengoyakkan” mempertahankan tindakan konkret itu dalam ragam bahasa yang wajar dan bermartabat.
- source_word: שִׂמְלֹתָיו
  choice: pakaiannya
  rationale: שִׂמְלָה adalah istilah umum untuk pakaian; “pakaiannya” jelas dan tidak mempersempit makna menjadi jubah atau jenis pakaian tertentu.
- source_word: שַׂק
  choice: kain kabung
  rationale: Istilah ini secara konvensional menunjuk kain kasar yang dikenakan sebagai tanda berkabung dan mempertahankan latar budaya teks.
- source_word: בְּמָתְנָיו
  choice: pada pinggangnya
  rationale: מָתְנַיִם menunjuk daerah pinggang atau pangkal tubuh. “Pada pinggangnya” alami dalam bahasa Indonesia dan cukup dekat dengan lokasi tubuh yang dimaksud.
- source_word: וַיִּתְאַבֵּל
  choice: berkabung
  rationale: Bentuk Hitpael dari אבל menyatakan menjalani perkabungan, termasuk ungkapan dukacita menurut kebiasaan; “berkabung” lebih tepat daripada sekadar “bersedih”.
- source_word: עַל־בְּנוֹ
  choice: karena anaknya
  rationale: Dengan verba perkabungan, עַל menandai orang yang menjadi alasan atau sasaran dukacita. “Karena anaknya” idiomatis dan tidak menyiratkan bahwa anak itu hadir secara fisik.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Frasa ini secara harfiah berarti “banyak hari” dan menyatakan durasi yang panjang. “Selama berhari-hari” merupakan ungkapan Indonesia yang alami tanpa menentukan jumlah.
