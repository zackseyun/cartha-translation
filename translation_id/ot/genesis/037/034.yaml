  source_fidelity: 'Tindakan dan urutan sumber Ibrani pada dasarnya tercermin dengan baik: Yakub merobek pakaian, menaruh/mengenakan kain kabung di sekitar pinggang, lalu berkabung atas anaknya selama banyak hari. Namun, konstruksi «mengenakan kain kabung pada pinggangnya» kurang tepat secara kolokasi Indonesia untuk tindakan menaruh atau mengikat kain di bagian tubuh tersebut.'
  naturalness: «Mengikatkan kain kabung di pinggangnya» lebih idiomatis dan secara konkret menyampaikan penempatan kain kabung. «Berkabung atas anaknya» lebih jelas menandai anaknya sebagai pihak yang diratapi daripada «berkabung karena anaknya», yang dapat terdengar kausal dan agak kurang presisi.
  terminology: «Kain kabung» merupakan istilah yang tepat dan mapan untuk שַׂק dalam konteks perkabungan Alkitab. «Mengoyakkan pakaiannya» dan «berhari-hari» juga sesuai dengan ragam Indonesia standar modern.
