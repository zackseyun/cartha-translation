  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: id
  text: Orang itu berkata, “Mereka sudah berangkat dari sini, sebab aku mendengar mereka berkata,[a] ‘Mari kita pergi ke Dotan.’[b]” Lalu Yusuf menyusul saudara-saudaranya dan menemukan mereka di Dotan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “aku mendengar mereka mengatakan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, nama tempat Dotan memakai akhiran penunjuk arah, yang secara harfiah berarti “ke arah Dotan.”
    reason: cultural_note
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: sudah berangkat dari sini
  rationale: Kata נָסַע dapat menggambarkan pembongkaran perkemahan lalu keberangkatan. Dalam konteks ini, ‘sudah berangkat dari sini’ menyampaikan perpindahan mereka secara alami tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan orang itu mengetahui arah tujuan saudara-saudara Yusuf.
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: aku mendengar mereka berkata
  rationale: Partisipel אֹמְרִים menyertai verba ‘mendengar’; objek ‘mereka’ tersirat dari konteks dan menunjuk kepada saudara-saudara Yusuf.
- source_word: נֵלְכָה
  choice: Mari kita pergi
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan atau dorongan bersama, yang wajar diterjemahkan ‘Mari kita pergi.’
- source_word: דֹּתָיְנָה
  choice: ke Dotan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Dotan; bahasa Indonesia secara alami memakai preposisi ‘ke’.
- source_word: אַחַר אֶחָיו
  choice: menyusul saudara-saudaranya
  rationale: Ungkapan ini menyatakan bahwa Yusuf pergi mengikuti mereka. ‘Menyusul’ alami dalam konteks perjalanan dan tidak menyiratkan pengejaran yang bermusuhan.
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: menemukan mereka di Dotan
  rationale: מָצָא dalam narasi berarti ‘menemukan’, sedangkan בְּ menandai lokasi mereka di Dotan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan mudah dipahami. ‘Orang itu’ mempertahankan penyebutan generik הָאִישׁ; ‘menyusul’ dipilih agar alur perjalanan terdengar alami. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
