  text: וַ/יֵּשְׁבוּ֮ לֶֽ/אֱכָל לֶחֶם֒ וַ/יִּשְׂא֤וּ עֵֽינֵי/הֶם֙ וַ/יִּרְא֔וּ וְ/הִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִ/גִּלְעָ֑ד וּ/גְמַלֵּי/הֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּ/צְרִ֣י וָ/לֹ֔ט הוֹלְכִ֖ים לְ/הוֹרִ֥יד מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: id
  text: Lalu mereka duduk untuk makan. Mereka mengangkat mata dan melihat, dan tampaklah sebuah kafilah orang Ismael datang dari Gilead, dengan unta-unta mereka membawa getah, balsam, dan damar ladan[a], dalam perjalanan untuk membawanya turun ke Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi botanis tepat bagi bahan-bahan dagangan ini tidak pasti. "Damar ladan" menerjemahkan istilah Ibrani terakhir (lot), yang sering dikaitkan dengan ladan atau ladanum; beberapa terjemahan menerjemahkannya "mur."
    reason: Menjaga ketidakpastian leksikal, khususnya untuk לֹט, tanpa menetapkan identifikasi yang diperselisihkan sebagai pasti.
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: untuk makan
  rationale: Secara harfiah berarti 'untuk makan roti', tetapi dalam konteks ini merupakan ungkapan umum untuk makan; bahasa Indonesia alami cukup memakai 'makan'.
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: serombongan orang Ismael
  rationale: אֹרְחָה menunjuk rombongan pengelana atau kafilah; 'serombongan' alami dan tidak menambahkan rincian yang tidak tersurat.
- source_word: נְכֹאת
  choice: getah damar
  rationale: Merujuk pada bahan aromatik atau resin perdagangan; identifikasi botanisnya tidak sepenuhnya pasti.
- source_word: צְרִי
  choice: balsam
  rationale: Istilah ini lazim dipahami sebagai balsam atau getah penyembuh/aromatik, khususnya hasil wilayah Gilead.
- source_word: לֹט
  choice: damar wangi
  rationale: Identifikasi tepat bahan aromatik ini tidak pasti; 'damar wangi' mempertahankan kategori umum tanpa memastikan bahwa ini mur.
- source_word: מִצְרָיְמָה
  choice: turun ke Mesir
  rationale: Akhiran direktif menyatakan gerak menuju Mesir, sementara 'turun' mempertahankan verba הוֹרִיד.
