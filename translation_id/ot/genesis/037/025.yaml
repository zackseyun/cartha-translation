  register: Bahasa Indonesia modern, naratif, dan bermartabat. Ungkapan idiomatis diterjemahkan secara alami, sedangkan seruan naratif וְהִנֵּה diwakili oleh 'tampaklah' untuk mempertahankan unsur penemuan mendadak.
