revisions:
- from: Kemudian mereka duduk untuk makan. Ketika mereka melayangkan pandangan, tampaklah serombongan orang Ismael datang dari Gilead. Unta-unta mereka membawa getah damar, balsam, dan damar wangi[a] untuk dibawa turun ke Mesir.
  to: Lalu mereka duduk untuk makan. Mereka mengangkat mata dan melihat, dan tampaklah sebuah kafilah orang Ismael datang dari Gilead, dengan unta-unta mereka membawa getah, balsam, dan damar ladan[a], dalam perjalanan untuk membawanya turun ke Mesir.
  rationale: Revisi memulihkan makna "kafilah" serta urutan melihat dalam teks Ibrani, dan menggunakan padanan yang lebih khusus namun tetap berhati-hati untuk komoditas terakhir. Tidak ada perubahan makna teologis atau penambahan informasi di luar sumber.
