base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: id
  text: Ia menceritakan mimpi itu kepada ayahnya dan saudara-saudaranya. Ayahnya menegurnya dan berkata kepadanya, “Mimpi apa ini yang telah kaumimpikan? Apakah aku, ibumu, dan saudara-saudaramu benar-benar akan datang untuk bersujud di hadapanmu sampai ke tanah?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membungkuk dalam-dalam di hadapanmu.” Kata Ibrani ini dapat menyatakan tindakan merendahkan diri sampai ke tanah; di sini maksudnya ketundukan atau penghormatan, bukan selalu penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: Ia menceritakan mimpi itu
  rationale: Bentuk piel dari ספר berarti menceritakan atau menuturkan. Objek yang tersirat dari konteks, yaitu mimpi, dinyatakan agar alami dan jelas dalam bahasa Indonesia.
- source_word: אֶל אָבִיו וְאֶל אֶחָיו
  choice: kepada ayah dan saudara-saudaranya
  rationale: Istilah kekerabatan diterjemahkan secara langsung dan wajar; bentuk jamak maskulin אֶחָיו dipertahankan sebagai 'saudara-saudara' sesuai konteks putra-putra Yakub.
- source_word: וַיִּגְעַר בּוֹ
  choice: Ayahnya menegur dia
  rationale: גער menyatakan teguran atau hardikan verbal. 'Menegur' menjaga daya ungkapnya tanpa memberi kesan kasar yang belum tentu dimaksudkan.
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: Mimpi macam apa yang kaumimpikan ini?
  rationale: Ungkapan ini mempertahankan bentuk pertanyaan retoris dan pengulangan akar kata 'mimpi—memimpikan' dengan susunan yang tetap alami dalam bahasa Indonesia.
- source_word: הֲבוֹא נָבוֹא
  choice: Apakah ... benar-benar akan datang
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. 'Benar-benar' menyampaikan penekanan tersebut secara jelas.
- source_word: אֲנִי וְאִמְּךָ וְאַחֶיךָ
  choice: aku, ibumu, dan saudara-saudaramu
  rationale: Daftar subjek dipertahankan dengan susunan yang alami dalam bahasa Indonesia.
- source_word: לְהִשְׁתַּחֲוֺת לְךָ
  choice: sujud kepadamu
  rationale: Dalam konteks nonkultis ini, השתחוה menunjuk pada tindakan merendahkan diri atau memberi hormat dengan membungkuk dalam-dalam, bukan dengan sendirinya ibadah.
- source_word: אָרְצָה
  choice: sampai ke tanah
  rationale: Bentuk berarah dari אֶרֶץ menunjukkan gerakan menuju tanah. Frasa ini menyampaikan dalamnya tindakan sujud secara idiomatis.
theological_decisions:
- issue: Makna השתחוה dalam konteks nonkultis
  choice: sujud kepadamu
  alternative: menyembahmu; membungkuk di hadapanmu
  rationale: Dalam tanggapan Yakub terhadap mimpi Yusuf, kata ini menggambarkan ketundukan atau penghormatan keluarga. 'Sujud' mempertahankan tindakan jasmaninya tanpa mengharuskan makna penyembahan religius; catatan kaki menjelaskan rentang maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina 'ia' dipakai dalam narasi, sedangkan 'aku' dan bentuk terikat '-mu' dipakai dalam dialog keluarga. Penanda catatan kaki ditempatkan setelah keseluruhan ucapan karena menjelaskan frasa tindakan sujud.
