  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani dengan baik: objek tersirat ''mimpi itu,'' teguran ayah, pertanyaan retoris, penegasan dalam הֲבוֹא נָבוֹא, dan tindakan hormat yang mendalam semuanya terwakili. Revisi kecil memperjelas posesif pada ''ayahnya'' dan menyatakan arah tindakan השתחוה secara lebih idiomatis sebagai ''di hadapanmu sampai ke tanah.'''
  naturalness: Teks draf mudah dipahami dan umumnya baku. Namun, 'ayah dan saudara-saudaranya' kurang eksplisit dibandingkan posesif Ibrani, 'menegur dia' kurang luwes daripada 'menegurnya,' dan 'sujud kepadamu sampai ke tanah' kurang alami dalam bahasa Indonesia. Susunan yang direvisi tetap lugas dan bernada naratif baku.
  terminology: '''Sujud'' dapat dipakai untuk tindakan penghormatan mendalam, tetapi dalam bahasa Indonesia mudah diasosiasikan dengan ibadah. Frasa ''bersujud di hadapanmu sampai ke tanah'' menandai dengan lebih jelas bahwa yang dimaksud ialah obeisans di hadapan seseorang, tanpa meniadakan kedalaman tindakan. Catatan kaki mempertahankan pembedaan dari penyembahan.'
