  to: Ia menceritakan mimpi itu kepada ayahnya dan saudara-saudaranya. Ayahnya menegurnya dan berkata kepadanya, “Mimpi apa ini yang telah kaumimpikan? Apakah aku, ibumu, dan saudara-saudaramu benar-benar akan datang untuk bersujud di hadapanmu sampai ke tanah?”[a]
  rationale: Revisi ini tidak mengubah makna, tetapi menyelaraskan posesif dengan teks Ibrani, memperhalus gaya bahasa Indonesia baku, dan membuat tindakan obeisans serta jangkar catatan kaki lebih jelas. Bentuk 'telah kaumimpikan' dengan tepat mewakili verba perfektum Ibrani dalam pertanyaan Yakub, sedangkan 'benar-benar' tetap menyampaikan penegasan infinitif absolut.
