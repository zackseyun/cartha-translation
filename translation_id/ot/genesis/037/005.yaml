translation:
  language: id
  text: Yusuf bermimpi[a], lalu ia menceritakan mimpi itu kepada saudara-saudaranya, dan mereka semakin membencinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Yusuf bermimpi suatu mimpi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: Yusuf bermimpi
  rationale: Konstruksi serumpun harfiah ‘Yusuf memimpikan sebuah mimpi’ tidak wajar dalam bahasa Indonesia. ‘Yusuf bermimpi’ menyampaikan maknanya secara alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּגֵּד
  choice: lalu ia menceritakan mimpi itu
  rationale: Bentuk hifil dari נגד berarti memberitahukan atau menceritakan. ‘Mimpi itu’ menyatakan kembali objek yang tersirat agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: לְאֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Bentuk jamak dengan sufiks orang ketiga tunggal maskulin menunjuk kepada saudara-saudara Yusuf; istilah kekerabatan dipertahankan.
- source_word: וַיּוֹסִפוּ עוֹד
  choice: semakin
  rationale: Gabungan יסף dan עוד menyatakan peningkatan lanjutan. ‘Semakin’ secara ringkas dan idiomatis menyampaikan bahwa kebencian mereka bertambah.
- source_word: שְׂנֹא אֹתוֹ
  choice: membencinya
  rationale: Infinitif setelah יסף secara idiomatis menyatakan bahwa mereka bertambah dalam membenci Yusuf; bentuk verba finit ini alami dalam bahasa Indonesia.
- source_word: וַ
  choice: lalu ... dan
  rationale: Waw berurutan memajukan alur narasi. Konjungsi Indonesia dipakai tanpa menambahkan penanda waktu seperti ‘sekarang’ yang tidak dinyatakan secara eksplisit dalam teks sumber.
