  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: id
  text: Aku sendiri akan menjadi penjaminnya. Engkau boleh menuntutnya dari tanganku. Jika aku tidak membawanya kepadamu dan menempatkannya di hadapanmu, aku akan berdosa terhadapmu seumur hidupku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Aku sendiri
  rationale: Pronomina mandiri ini bersifat emfatis dan menegaskan bahwa Yehuda secara pribadi mengambil tanggung jawab.
- source_word: אֶֽעֶרְבֶ֔נּוּ
  choice: akan menjadi penanggungnya
  rationale: Bentuk ini menyatakan tindakan menjadi penjamin atau penanggung bagi seseorang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa tanggung jawab.
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: Dari tangankulah engkau boleh menuntut dia
  rationale: Terjemahan ini mempertahankan citra konkret 'dari tanganku' dan makna tuntutan pertanggungjawaban, sekaligus menandai penekanan melalui -lah.
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: membawanya kepadamu
  rationale: Terjemahan langsung dari verba kausatif 'membawa' dan frasa arah 'kepadamu', tanpa menambahkan 'kembali' yang hanya tersirat oleh konteks.
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: dan menghadapkan dia di hadapanmu
  rationale: Mempertahankan tindakan konkret membawa Benyamin hadir di depan Yakub, meskipun pengulangan unsur 'hadap' mencerminkan gaya Semitis.
- source_word: וְחָטָאתִי לְךָ
  choice: aku akan berdosa terhadapmu
  rationale: חטא adalah verba biasa untuk 'berdosa'; terjemahan langsung mempertahankan bobot moral dan ketegangan teologis dalam ikrar Yehuda.
- source_word: כָּל הַיָּמִים
  choice: seumur hidupku
  rationale: Dalam konteks pribadi ini frasa tersebut menyatakan tanggungan yang berlangsung sepanjang hidup; ungkapan Indonesia ini alami dan tepat.
theological_decisions:
- issue: Makna וְחָטָאתִי לְךָ dalam ikrar pertanggungjawaban antarmanusia
  choice: aku akan berdosa terhadapmu
  alternative: aku akan menanggung kesalahan terhadapmu
  rationale: Konteksnya memang menyangkut tanggung jawab Yehuda kepada ayahnya, tetapi verba Ibrani secara nyata memakai istilah 'berdosa'. Teks utama mempertahankan ungkapan moral tersebut daripada mereduksinya menjadi sekadar kesalahan atau cela.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'engkau' dipakai sesuai percakapan anak kepada ayah dalam narasi Alkitab. Susunan kalimat mempertahankan tekanan pribadi dan citra pertanggungjawaban dalam bahasa Ibrani tanpa menambahkan unsur 'kembali'.
