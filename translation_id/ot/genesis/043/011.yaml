  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: id
  text: 'Lalu Israel, ayah mereka, berkata kepada mereka, “Kalau memang harus demikian, lakukanlah ini: ambillah beberapa hasil terbaik negeri ini[a] dalam wadah-wadah kalian, lalu bawalah turun hadiah untuk orang itu: sedikit balsam, sedikit madu,[b] getah wangi dan damar ladan,[c] kacang pistacio, dan badam.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan ‘sebagian hasil pilihan negeri ini’. Ungkapan Ibrani ini mencakup berbagai hasil unggulan negeri, bukan hanya buah-buahan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks tertentu, kata yang diterjemahkan ‘madu’ dapat menunjuk pada sirup manis, bukan madu lebah.
    reason: lexical_alternative
  - marker: c
    text: Jenis bahan yang disebut oleh kedua istilah Ibrani ini tidak dapat dipastikan. Keduanya mungkin merupakan berbagai getah atau damar aromatik, termasuk getah tragakan atau ladanum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: Israel, ayah mereka
  rationale: Mempertahankan nama ‘Israel’ yang dipakai narasi bagi Yakub serta hubungan aposisional dalam bahasa Ibrani, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: אִם כֵּן אֵפוֹא
  choice: Kalau memang harus demikian
  rationale: Ungkapan ini menyatakan penerimaan yang enggan terhadap keadaan, bukan sekadar syarat netral ‘kalau begitu’.
- source_word: זֹאת עֲשׂוּ
  choice: lakukanlah ini
  rationale: Menyampaikan perintah secara langsung, ringkas, dan wajar.
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: beberapa hasil terbaik negeri ini
  rationale: Ungkapan ini menunjuk pada hasil negeri yang terpilih atau berharga secara luas, tidak terbatas pada buah-buahan.
- source_word: בִּכְלֵיכֶם
  choice: dalam wadah-wadah kalian
  rationale: כְּלִי adalah istilah umum bagi perkakas atau wadah; terjemahan ini tidak menentukan jenis wadah melebihi teks sumber.
- source_word: וְהוֹרִידוּ
  choice: bawalah turun
  rationale: Mempertahankan gambaran gerak turun menuju Mesir sekaligus tindakan membawa barang.
- source_word: לָאִישׁ
  choice: kepada orang itu
  rationale: Menunjuk kepada pejabat Mesir yang sudah dikenal dari konteks sebelumnya.
- source_word: מִנְחָה
  choice: hadiah
  rationale: Dalam konteks diplomatis ini, ‘hadiah’ alami dan tidak memberi kesan persembahan ibadah atau upeti politik secara berlebihan.
- source_word: צֳרִי
  choice: balsam
  rationale: Istilah ini lazim menunjuk pada balsam atau damar berkhasiat; ‘balsam’ cukup dikenal dan mempertahankan ciri komoditasnya.
- source_word: דְּבַשׁ
  choice: madu
  rationale: ‘Madu’ adalah arti lazim, sementara kemungkinan sirup manis dipertahankan dalam catatan kaki.
- source_word: נְכֹאת
  choice: getah wangi
  rationale: Identifikasi tumbuhannya tidak pasti; pilihan umum ini menyampaikan bahwa bahan tersebut merupakan getah atau damar aromatik tanpa kepastian palsu.
- source_word: לֹט
  choice: damar ladan
  rationale: Kemungkinan besar menunjuk pada ladanum, sejenis damar aromatik; ketidakpastian identifikasinya dicatat.
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: kacang pistacio, dan badam
  rationale: Menyebut kedua hasil negeri itu dengan nama yang dapat dipahami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan jamak ‘kalian’ yang sesuai bagi perkataan seorang ayah kepada anak-anaknya. Bentuk imperatif ‘lakukanlah’, ‘ambillah’, dan ‘bawalah’ menjaga ketegasan tuturan tanpa terdengar kaku. Istilah komoditas dibuat cukup spesifik jika bukti leksikal mendukungnya, sedangkan ketidakpastian botani dipertahankan melalui catatan kaki.
