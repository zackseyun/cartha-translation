  source_fidelity: Ungkapan “menanyakan kabar mereka” dengan tepat menyampaikan idiom Ibrani לְשָׁלוֹם sebagai pertanyaan tentang keadaan atau kesejahteraan mereka. “Baik-baik saja” juga mempertahankan cakupan umum הֲשָׁלוֹם, dan “masih hidup” menerjemahkan הַעוֹדֶנּוּ חָי secara langsung. Namun, “yang pernah kalian ceritakan itu” menambahkan unsur temporal “pernah” yang tidak dinyatakan secara eksplisit dan “ceritakan” dapat mengesankan kisah yang lebih terperinci daripada sekadar menyebutkan atau berbicara tentang ayah mereka.
