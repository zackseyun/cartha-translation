  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: id
  text: Ia menanyakan kabar mereka dan berkata, “Apakah ayah kalian yang sudah tua, yang kalian sebutkan itu, baik-baik saja? Apakah ia masih hidup?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: Ia menanyakan kabar mereka
  rationale: Ungkapan Ibrani dengan שָׁלוֹם menanyakan keadaan atau kesejahteraan seseorang. 'Menanyakan kabar' merupakan padanan idiomatis yang alami dalam bahasa Indonesia dan tidak membatasi makna hanya pada kesehatan.
- source_word: הֲשָׁלוֹם
  choice: baik-baik saja
  rationale: Di sini שָׁלוֹם menanyakan keadaan sang ayah secara umum. 'Baik-baik saja' alami dalam pertanyaan bahasa Indonesia dan lebih luas daripada 'sehat'.
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: ayah kalian yang sudah tua
  rationale: Terjemahan ini mempertahankan keterangan usia הַזָּקֵן secara jelas, wajar, dan netral dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: yang pernah kalian ceritakan itu
  rationale: Klausa ini menunjuk kepada ayah yang sebelumnya telah dibicarakan oleh saudara-saudara Yusuf. 'Ceritakan' menyampaikan rujukan tersebut secara alami, sedangkan 'pernah' tersirat oleh konteks penyebutan sebelumnya.
- source_word: הַעוֹדֶנּוּ חָי
  choice: Apakah ia masih hidup?
  rationale: Padanan langsung dan idiomatis yang mempertahankan pertanyaan mengenai apakah sang ayah tetap hidup.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Pronomina 'ia' dipakai untuk narasi Alkitab, sedangkan 'kalian' membedakan orang kedua jamak dengan jelas. Pengulangan dua pertanyaan dalam sumber dipertahankan.
