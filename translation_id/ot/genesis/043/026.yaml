base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: id
  text: Ketika Yusuf masuk ke dalam rumah itu, mereka membawa hadiah[a] yang ada di tangan mereka kepadanya ke dalam rumah itu[b], lalu mereka membungkuk di hadapannya sampai ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan” atau “upeti”; kata Ibrani ini dapat memiliki arti-arti tersebut sesuai konteks.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani mengulang ungkapan “ke dalam rumah itu”: pertama untuk masuknya Yusuf, lalu untuk dibawanya hadiah ke dalam rumah.'
    reason: source_form
lexical_decisions:
- source_word: וַיָּבֹא ... הַבַּיְתָה
  choice: masuk ke dalam rumah itu
  rationale: Bentuk Qal dari בוא dengan akhiran penunjuk arah pada הַבַּיְתָה menyatakan gerak menuju atau memasuki rumah. Dalam konteks ini, 'masuk ke dalam' paling alami dan tepat.
- source_word: וַיָּבִיאוּ לוֹ
  choice: mereka membawa kepadanya
  rationale: Bentuk Hifil dari בוא berarti 'membawa', sedangkan לוֹ menandai Yusuf sebagai penerima. Susunan ini juga mempertahankan hubungan antarkomponen dalam teks Ibrani.
- source_word: הַמִּנְחָה
  choice: hadiah
  rationale: מִנְחָה dapat berarti hadiah, persembahan, atau upeti. Dalam konteks saudara-saudara Yusuf membawa barang untuk memperoleh kemurahan pejabat Mesir, 'hadiah' paling jelas tanpa memberi kesan ritual.
- source_word: אֲשֶׁר בְּיָדָם
  choice: yang ada di tangan mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret ungkapan Ibrani, yang secara harfiah menyatakan bahwa hadiah itu berada 'di tangan mereka'.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: mereka sujud di hadapannya sampai ke tanah
  rationale: Kata שׁחה menyatakan tindakan membungkuk atau bersujud sebagai penghormatan, dan אָרְצָה menunjukkan arah hingga ke tanah. Ungkapan Indonesia ini menyampaikan sikap merendahkan diri secara jasmani di hadapan Yusuf.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan 'ke dalam rumah itu' dipertahankan karena terdapat dua kali dalam teks Ibrani, meskipun hasilnya sedikit lebih berulang daripada gaya Indonesia biasa. 'Sujud di hadapannya sampai ke tanah' dipilih sebagai ungkapan penghormatan jasmani, bukan sebagai penegasan ibadah religius.
