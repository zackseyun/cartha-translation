  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: id
  text: Mereka menjawab[a], “Hamba tuanku, ayah kami, dalam keadaan baik; ia masih hidup.” Lalu mereka membungkuk dan bersujud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kesejahteraan bagi hamba tuanku, ayah kami.” Kata Ibrani untuk “kesejahteraan” dipakai secara idiomatis untuk menyatakan bahwa keadaannya baik; “hamba tuanku” dan “ayah kami” merujuk kepada orang yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: dalam keadaan baik
  rationale: Dalam jawaban atas pertanyaan mengenai keadaan sang ayah, שָׁלוֹם dipakai secara idiomatis untuk menyatakan kesejahteraan atau keadaan baik, bukan sekadar ketiadaan konflik.
- source_word: לְעַבְדְּךָ לְאָבִינוּ
  choice: Ayah kami, hambamu
  rationale: Kedua frasa menunjuk kepada orang yang sama. Susunan ini mempertahankan sapaan merendah di hadapan Yusuf dan tetap wajar dalam bahasa Indonesia.
- source_word: עוֹדֶנּוּ חָי
  choice: ia masih hidup
  rationale: Kata עוֹד menegaskan bahwa kehidupannya berlanjut; 'masih hidup' menyampaikan daya temporal itu dengan alami.
- source_word: וַיִּקְּדוּ
  choice: membungkuk
  rationale: Kata קדד menggambarkan tindakan merendahkan atau menundukkan tubuh.
- source_word: וישתחו
  choice: bersujud
  rationale: Bentuk ini menggambarkan penghormatan dengan merendahkan diri sampai sujud di hadapan seorang atasan; konteksnya tidak menuntut makna penyembahan kepada Allah.
theological_decisions:
- issue: Makna tindakan וישתחו di hadapan Yusuf
  choice: bersujud
  alternative: menyembah
  rationale: Konteksnya adalah penghormatan sosial kepada Yusuf sebagai penguasa. 'Bersujud' mempertahankan tindakan jasmani tanpa memasukkan klaim bahwa mereka melakukan penyembahan religius.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hambamu' mempertahankan kesantunan merendah dalam lingkungan istana, sedangkan pasangan 'membungkuk dan bersujud' menjaga pembedaan antara dua verba tindakan dalam teks Ibrani.
