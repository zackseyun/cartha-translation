  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Yosef came at noon[a], because they had heard that they would eat bread there.
translation:
  language: id
  text: Dan mereka menyiapkan pemberian itu sampai Yosef datang pada tengah hari, sebab mereka telah mendengar bahwa mereka akan makan roti[a] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan roti”; ungkapan Ibrani yang berarti makan bersama atau bersantap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: mereka menyiapkan
  rationale: Bentuk hifil dari כון berarti membuat sesuatu siap; “menyiapkan” wajar dalam bahasa Indonesia dan mempertahankan objek tindakan.
- source_word: הַמִּנְחָה
  choice: pemberian itu
  rationale: Dalam konteks kisah Yosef, מִנְחָה adalah pemberian yang dibawa saudara-saudaranya, bukan persembahan ibadah. “Pemberian” menghindari kesan kultis.
- source_word: עַד בּוֹא יוֹסֵף
  choice: sampai Yosef datang
  rationale: עַד dengan infinitif בּוֹא menyatakan batas waktu hingga kedatangan Yosef; terjemahan ini mempertahankan struktur dan makna temporalnya.
- source_word: בַּצָּהֳרָיִם
  choice: pada tengah hari
  rationale: Ungkapan ini menunjuk waktu tengah hari; bentuk ini jelas, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: כִּי שָׁמְעוּ
  choice: sebab mereka telah mendengar
  rationale: כִּי pertama bersifat kausal. “Telah mendengar” menunjukkan bahwa informasi itu sudah mereka terima sebelum menyiapkan pemberian.
- source_word: כִּי שָׁם
  choice: bahwa ... di sana
  rationale: כִּי kedua memperkenalkan isi kabar yang mereka dengar, sedangkan שָׁם menunjukkan tempat.
- source_word: יֹאכְלוּ לָחֶם
  choice: mereka akan makan roti
  rationale: Secara harfiah berarti “makan roti” dan secara idiomatis merujuk pada makan bersama atau bersantap. Ungkapan sumber dipertahankan, dengan arti idiomatis dijelaskan dalam catatan kaki.
- source_word: יוֹסֵף
  choice: Yosef
  rationale: Nama Ibrani ditransliterasikan langsung sebagai “Yosef” agar selaras dengan bentuk sumber.
theological_decisions: []
