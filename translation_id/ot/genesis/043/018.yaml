revisions:
- from: Orang-orang itu menjadi takut karena mereka dibawa masuk ke rumah Yusuf. Mereka berkata, “Kita dibawa masuk karena uang yang dikembalikan ke dalam karung-karung kita pada perjalanan pertama. Ia hendak mencari gara-gara terhadap kita[a], menyerang kita, lalu mengambil kita sebagai budak beserta keledai-keledai kita.”
  to: Orang-orang itu menjadi takut ketika mereka dibawa masuk ke rumah Yusuf. Mereka berkata, “Kita dibawa masuk karena uang yang dikembalikan ke dalam karung-karung kita pada perjalanan pertama, agar ia dapat mencari-cari dalih terhadap kita[a], menyerang kita, lalu mengambil kita sebagai budak beserta keledai-keledai kita.”
  rationale: Revisi memperjelas bahwa tindakan-tindakan yang ditakuti merupakan tujuan yang mereka sangkakan, dan mengganti ungkapan yang terlalu kolokial dengan padanan yang lebih sesuai bagi idiom Ibrani yang tidak pasti. Makna kontekstual 'pada perjalanan pertama' dipertahankan, sejalan dengan penggunaan dalam narasi dan jejak audit bahasa Inggris.
