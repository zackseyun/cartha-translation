  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: id
  text: Orang-orang itu menjadi takut ketika mereka dibawa masuk ke rumah Yusuf. Mereka berkata, “Kita dibawa masuk karena uang yang dikembalikan ke dalam karung-karung kita pada perjalanan pertama, agar ia dapat mencari-cari dalih terhadap kita[a], menyerang kita, lalu mengambil kita sebagai budak beserta keledai-keledai kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari kesempatan untuk melawan kita.” Ungkapan Ibraninya bersifat idiomatis dan maknanya sulit dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: menjadi takut
  rationale: Bentuk naratif dari ירא menyatakan reaksi ketakutan mereka; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan perkembangan peristiwa.
- source_word: הוּבְאוּ בֵּית יוֹסֵף
  choice: mereka dibawa masuk ke rumah Yusuf
  rationale: Bentuk Hofal dari בוא bersifat kausatif-pasif; “dibawa masuk” memperjelas bahwa mereka bukan sekadar tiba, melainkan diarahkan masuk ke rumah Yusuf.
- source_word: עַל דְּבַר הַכֶּסֶף
  choice: karena uang
  rationale: Dalam konteks ini עַל דְּבַר menyatakan sebab atau alasan yang mereka duga, bukan sekadar pokok pembicaraan.
- source_word: הַשָּׁב בְּאַמְתְּחֹתֵינוּ
  choice: yang dikembalikan ke dalam karung-karung kita
  rationale: הַשָּׁב menyatakan uang yang kembali atau dikembalikan, sedangkan אַמְתַּחַת menunjuk karung bekal atau karung perjalanan.
- source_word: בַּתְּחִלָּה
  choice: pada perjalanan pertama
  rationale: Secara harfiah berarti “pada mulanya/awalnya,” tetapi dalam konteks merujuk pada kunjungan terdahulu mereka ke Mesir; penambahan “perjalanan” membuat rujukannya jelas tanpa mengubah maksud.
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: hendak mencari gara-gara terhadap kita
  rationale: Ungkapan idiomatis yang sulit ini menggambarkan upaya mencari alasan atau kesempatan untuk bertindak melawan mereka. Pilihan ini alami dan tetap menyisakan nuansa manuver bermusuhan.
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: menyerang kita
  rationale: Hitpael נפל dengan עַל di sini menyatakan tindakan bermusuhan, yakni menerjang atau menyerang; “menyerang” paling jelas bagi pembaca modern.
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: mengambil kita sebagai budak
  rationale: עֲבָדִים dalam ketakutan mereka menunjuk status perbudakan, bukan sekadar pekerjaan sebagai pelayan.
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: beserta keledai-keledai kita
  rationale: Koordinasi ini menunjukkan bahwa mereka takut diri mereka dan keledai mereka akan dirampas; “beserta” menyampaikan hubungan tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina “kita” dipakai karena para pembicara mencakup diri sendiri dan sesama anggota kelompok. Ungkapan sulit לְהִתְגֹּלֵל עָלֵינוּ diterjemahkan secara idiomatis dan diberi catatan kaki untuk menjaga ketidakpastian leksikal.
