lexical_decisions:
- source_word: וְהָרָעָב
  choice: Kelaparan itu
  rationale: רָעָב berarti kelaparan; dalam konteks naratif ini bentuk definit הָ menunjuk pada kelaparan yang sudah disebutkan. Prefiks וְ tidak diterjemahkan dengan kata penghubung tersendiri karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: כָּבֵד
  choice: sangat parah
  rationale: Secara harfiah berarti 'berat', tetapi bila menerangkan kelaparan kata ini menyatakan tingkat keparahan. 'Sangat parah' menyampaikan daya intensif ungkapan Ibrani secara alami.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ di sini menunjuk pada negeri atau wilayah dalam konteks cerita, bukan seluruh bumi; bentuk definit diterjemahkan dengan 'itu'.
