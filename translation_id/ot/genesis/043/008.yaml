  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: id
  text: Lalu Yehuda berkata kepada Israel, ayahnya, “Izinkanlah anak muda itu pergi bersamaku[a]. Mari kita berangkat supaya kita hidup dan tidak mati—baik kami, engkau, maupun anak-anak kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarkanlah pemuda itu ikut denganku.” Kata Ibrani נַעַר dapat menunjuk seorang pemuda, bukan hanya anak kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur cerita; “Lalu” merupakan penghubung naratif yang wajar dalam bahasa Indonesia modern.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israel, ayahnya
  rationale: Mempertahankan nama Israel yang terdapat dalam teks Ibrani dan menjelaskan hubungan aposisionalnya secara alami.
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: Izinkanlah anak muda itu pergi bersamaku
  rationale: Dalam konteks ini, imperatif שלח berarti membiarkan atau mengizinkan Benyamin berangkat bersama Yehuda. Bentuk ini lebih alami daripada terjemahan harfiah “utuslah” tanpa menghilangkan daya permintaannya.
- source_word: הַנַּעַר
  choice: anak muda itu
  rationale: נער dapat menunjuk seorang pemuda, bukan hanya anak kecil. Pilihan ini sesuai dengan usia Benyamin tanpa menghilangkan cara keluarga memandangnya sebagai yang lebih muda.
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: Mari kita berangkat
  rationale: Dua bentuk kohortatif mendesak tindakan bersama. “Berangkat” secara idiomatis mencakup bangkit lalu pergi; pengulangan dua verba tidak perlu dipaksakan dalam bahasa Indonesia.
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: supaya kita tetap hidup dan tidak mati
  rationale: Rangkaian ini menyatakan tujuan atau hasil yang diharapkan dari keberangkatan mereka. “Tetap hidup” menyampaikan maksud bertahan hidup dalam ancaman kelaparan.
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: baik kami, engkau, maupun anak-anak kami
  rationale: Pola “baik ... maupun ...” mempertahankan penekanan dan cakupan tiga kelompok dari pengulangan גם. “Kami” tepat karena Yehuda tidak memasukkan ayahnya ke dalam kelompok pertama, lalu menyebutnya secara terpisah sebagai “engkau”.
- source_word: טַפֵּנוּ
  choice: anak-anak kami
  rationale: טף menunjuk anak-anak kecil atau anggota rumah tangga yang rentan. “Anak-anak kami” alami dan jelas dalam bahasa Indonesia; nuansa kerentanan sudah didukung konteks ancaman kematian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Sapaan “engkau” dipakai untuk menjaga register naratif Kitab Suci tanpa terdengar terlalu arkais. Tanda pisah mempertahankan penekanan pada semua pihak yang terancam.
