  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: id
  text: Namun, jika Ayah tidak mengirimnya, kami tidak akan turun, sebab orang itu berkata kepada kami, “Kalian tidak akan melihat wajahku[a] kecuali jika saudara kalian ada bersama kalian.”
