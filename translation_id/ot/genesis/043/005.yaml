lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks, ungkapan ini mengontraskan syarat negatif dengan kesediaan yang dinyatakan pada ayat sebelumnya.
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: Ayah tidak menyuruhnya pergi
  rationale: Bentuk negatif dengan partisip menyatakan keputusan untuk tidak mengirim. Sapaan “Ayah” wajar dalam percakapan Yehuda dengan Yakub, sedangkan “-nya” merujuk kepada Benyamin yang tersirat dari konteks.
- source_word: לֹא נֵרֵד
  choice: kami tidak akan pergi ke sana
  rationale: Kata יָרַד secara harfiah berarti “turun” dan lazim dipakai untuk perjalanan dari Kanaan ke Mesir. Dalam bahasa Indonesia, “pergi ke sana” lebih alami dalam dialog ini tanpa mengubah arah perjalanan yang sudah jelas dari konteks.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan mengapa mereka tidak akan berangkat.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Yehuda menyebut Yusuf hanya sebagai “orang itu”, sesuai dengan sudut pandang saudara-saudaranya yang belum mengetahui jati dirinya.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Kalian tidak akan melihat wajahku
  rationale: Terjemahan ini mempertahankan gambaran harfiah idiom Ibrani sekaligus tetap dapat dipahami dalam bahasa Indonesia; arti idiomatisnya dijelaskan dalam catatan kaki.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: kecuali saudara kalian bersama kalian
  rationale: בִּלְתִּי menyatakan syarat yang harus dipenuhi. Nama Benyamin tidak ditambahkan karena teks sumber hanya mengatakan “saudara kalian”.
