base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: id
  text: Ia mengangkat pandangannya dan melihat Benyamin, saudaranya yang seibu dengannya.[a] Lalu ia berkata, “Inikah adik bungsu kalian yang kalian ceritakan kepadaku?” Kemudian ia berkata, “Kiranya Allah bermurah hati kepadamu, anakku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudaranya, anak ibunya,” yang menekankan bahwa Benyamin dan Yusuf mempunyai ibu yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ia mengangkat pandangannya
  rationale: Mempertahankan gambaran idiom Ibrani ‘mengangkat matanya’ dalam bentuk yang lebih wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: וַיַּרְא
  choice: dan melihat
  rationale: Menerjemahkan verba ראה secara langsung dan mempertahankan urutan tindakan dalam narasi.
- source_word: אֶת בִּנְיָמִין
  choice: Benyamin
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אָחִיו בֶּן אִמּוֹ
  choice: saudaranya yang seibu dengannya
  rationale: Menyampaikan bahwa Benyamin adalah saudara Yusuf dari ibu yang sama tanpa memadatkannya menjadi istilah yang dapat mengaburkan penekanan frasa sumber. Bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: adik bungsu kalian
  rationale: Dalam konteks keluarga ini, הַקָּטֹן menunjuk kepada saudara yang paling muda. ‘Adik bungsu’ alami dalam bahasa Indonesia dan mempertahankan relasi kekerabatan.
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: yang kalian ceritakan kepadaku
  rationale: Ungkapan Ibrani secara harfiah berbunyi ‘yang kalian katakan kepadaku’; pilihan ini menyampaikan maksudnya secara alami, yakni saudara yang sebelumnya mereka ceritakan kepada Yusuf.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk sebutan umum Ibrani bagi Allah dalam formula berkat ini.
- source_word: יָחְנְךָ
  choice: Kiranya Allah bermurah hati kepadamu
  rationale: Bentuk ‘kiranya’ menyampaikan daya jusif atau harapan berkat, sedangkan ‘bermurah hati’ mencerminkan gagasan חנן tentang pemberian kemurahan atau perkenanan.
- source_word: בְּנִי
  choice: anakku
  rationale: Mempertahankan sapaan maskulin tunggal yang bernada akrab dan penuh kasih.
theological_decisions:
- issue: Daya ungkapan berkat dengan אֱלֹהִים dan bentuk jusif יָחְנְךָ
  choice: Kiranya Allah bermurah hati kepadamu, anakku
  alternative: Allah bermurah hati kepadamu, anakku
  rationale: ‘Kiranya’ membuat fungsi doa-harapan dari bentuk Ibrani jelas dalam bahasa Indonesia tanpa menambahkan isi teologis. Sebutan umum אֱלֹהִים diterjemahkan ‘Allah’ tanpa menggantinya dengan nama perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak ‘kalian’ dipakai karena Yusuf berbicara kepada saudara-saudaranya; sapaan tunggal ‘kepadamu, anakku’ dipertahankan ketika ia berbicara kepada Benyamin.
