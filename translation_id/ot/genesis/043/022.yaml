  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: id
  text: Kami juga telah membawa perak tambahan[a] bersama kami[b] untuk membeli makanan.[c] Kami tidak tahu siapa yang menaruh perak kami di dalam karung-karung kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “uang tambahan”; kata Ibrani כֶּסֶף dapat berarti perak sebagai logam maupun uang sebagai alat pembayaran. Demikian juga untuk “perak kami” pada bagian selanjutnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di tangan kami”.
    reason: literal_rendering
  - marker: c
    text: Atau “gandum”; ungkapan ini dalam konteksnya dapat secara khusus menunjuk pada pembelian gandum, meskipun kata benda yang dipakai berarti “makanan” secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: perak tambahan
  rationale: כֶּסֶף secara konkret berarti ‘perak’ dan dalam konteks transaksi juga dapat berarti ‘uang’. ‘Perak tambahan’ mempertahankan gambaran konkret sekaligus menunjukkan bahwa jumlah ini dibawa selain pembayaran sebelumnya.
- source_word: הוֹרַדְנוּ
  choice: telah membawa
  rationale: Bentuk Hifil dari ירד secara harfiah berarti ‘membawa turun’, sesuai gambaran perjalanan dari Kanaan ke Mesir. Dalam bahasa Indonesia, arah turun itu tidak perlu dinyatakan dalam kalimat ini agar tuturan tetap alami; unsur tersebut dicatat dalam pertimbangan terjemahan tanpa menambahkan lokasi yang tidak tersurat.
- source_word: בְ/יָדֵ/נוּ
  choice: bersama kami
  rationale: Ungkapan Ibrani harfiah ‘di tangan kami’ menyatakan bahwa perak itu mereka bawa atau miliki. ‘Bersama kami’ menyampaikan maksud idiomatisnya secara alami.
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: untuk membeli makanan
  rationale: Dalam konteks ini שׁבר berarti membeli bahan pangan, sering kali gandum, sedangkan אֹכֶל adalah kata yang lebih luas untuk ‘makanan’. Pilihan ini mempertahankan keluasan objek Ibrani.
- source_word: לֹא יָדַעְנוּ
  choice: Kami tidak tahu
  rationale: Bentuk perfektif Ibrani dapat menyatakan keadaan kini yang berasal dari ketidaktahuan sebelumnya. Dalam tuturan langsung ini, bentuk kini paling alami.
- source_word: מִי שָׂם
  choice: siapa yang menaruh
  rationale: Terjemahan langsung dan wajar bagi pertanyaan tak langsung tentang pelaku tindakan.
- source_word: כַּסְפֵּ/נוּ
  choice: perak kami
  rationale: Mengulang ‘perak’ menjaga pengulangan kata כֶּסֶף dalam teks Ibrani dan konsistensi internal ayat.
- source_word: בְּ/אַמְתְּחֹתֵי/נוּ
  choice: di dalam karung-karung kami
  rationale: אַמְתַּחַת menunjuk pada karung atau kantong pembawa persediaan. ‘Karung’ sesuai dengan konteks pengangkutan bahan pangan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada tutur yang wajar dan bermartabat. Terjemahan memakai kesepadanan optimal: pengulangan ‘perak’ dipertahankan, sementara idiom ‘di tangan kami’ dialihkan menjadi ‘bersama kami’ dan diberi catatan kaki.'
