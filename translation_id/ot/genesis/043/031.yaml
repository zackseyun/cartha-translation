  text: וַ/יִּרְחַ֥ץ פָּנָ֖י/ו וַ/יֵּצֵ֑א וַ/יִּ֨תְאַפַּ֔ק וַ/יֹּ֖אמֶר שִׂ֥ימוּ לָֽחֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/031.yaml
  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: id
  text: Lalu ia membasuh wajahnya, keluar, dan menguasai diri. Ia berkata, “Hidangkan makanan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roti”; di sini kemungkinan besar berarti makanan atau hidangan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְחַץ
  choice: membasuh
  rationale: Kata רחץ berarti membasuh atau mencuci; dalam konteks ini Yusuf membersihkan wajahnya setelah menangis sebelum kembali keluar.
- source_word: פָּנָיו
  choice: wajahnya
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, פָּנִים secara idiomatis menunjuk pada wajah satu orang.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Kata יצא menyatakan bahwa Yusuf keluar dari ruangan tempat ia menangis dan kembali ke tempat perjamuan.
- source_word: וַיִּתְאַפַּק
  choice: menguasai diri
  rationale: Bentuk hitpael dari אפק di sini menyatakan pengekangan diri setelah luapan emosi; 'menguasai diri' alami dan jelas dalam bahasa Indonesia modern.
- source_word: שִׂימוּ
  choice: Hidangkan
  rationale: Secara harfiah berarti 'taruhlah' atau 'letakkanlah', tetapi dalam konteks jamuan perintah ini berarti menghidangkan makanan.
- source_word: לָחֶם
  choice: makanan
  rationale: לֶחֶם secara harfiah berarti 'roti', tetapi juga dapat dipakai secara metonimis untuk makanan secara umum atau hidangan; konteks perjamuan mendukung arti yang lebih luas.
