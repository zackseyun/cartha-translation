  text: If you will send our brother with us[a], we will go down and buy food for you.
translation:
  language: id
  text: Jika Ayah bersedia mengutus saudara kami bersama kami[a], kami akan turun dan membeli makanan untuk Ayah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika Ayah mengutus saudara kami bersama kami.” Ungkapan Ibrani ini dapat menyatakan kesediaan maupun tindakan itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini memperkenalkan syarat secara langsung tanpa penekanan tambahan.
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: Ayah bersedia mengutus
  rationale: Ungkapan יֵשׁ dengan sufiks pronominal dan partisip dapat menyatakan kesediaan maupun tindakan. Dalam konteks syarat yang diajukan Yehuda kepada ayahnya, 'bersedia mengutus' alami dan mempertahankan unsur kehendak yang terkandung dalam idiom.
- source_word: אֶת אָחִינוּ
  choice: saudara kami
  rationale: Menerjemahkan nomina dengan sufiks orang pertama jamak secara langsung dan mempertahankan penekanan kekeluargaan.
- source_word: אִתָּנוּ
  choice: bersama kami
  rationale: Menunjukkan bahwa saudara mereka harus menyertai perjalanan mereka.
- source_word: נֵרְדָה
  choice: kami akan pergi ke sana
  rationale: Bentuk kohortatif orang pertama jamak menyatakan tindakan yang akan dilakukan sebagai akibat terpenuhinya syarat. 'Ke sana' menyampaikan gerak menuju Mesir secara alami dalam bahasa Indonesia; arah harfiah 'turun' tidak wajib dinyatakan karena tidak membawa arti teologis di sini.
- source_word: וְנִשְׁבְּרָה
  choice: dan membeli
  rationale: Dalam konteks memperoleh perbekalan, verba שׁבר berarti membeli; objeknya dinyatakan oleh kata berikutnya.
- source_word: לְךָ
  choice: untuk Ayah
  rationale: Preposisi dengan sufiks orang kedua tunggal menyatakan penerima manfaat. Sapaan kekerabatan lebih alami dan santun daripada 'untukmu' ketika seorang anak berbicara kepada ayahnya dalam bahasa Indonesia.
- source_word: אֹכֶל
  choice: makanan
  rationale: Kata ini berarti makanan secara umum; terjemahan tidak mempersempitnya menjadi gandum.
