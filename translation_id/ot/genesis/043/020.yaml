  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: id
  text: Mereka berkata, “Mohon, Tuanku[a], kami memang turun pada kali pertama untuk membeli makanan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tuanku” di sini adalah sapaan hormat kepada seorang atasan manusia, bukan gelar ilahi.
    reason: cultural_note
  - marker: b
    text: 'Bahasa Ibrani memakai infinitif absolut yang diikuti verba finit seakar untuk memberi penegasan: “kami memang turun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Mereka berkata
  rationale: Bentuk naratif dengan waw memperkenalkan ujaran langsung; bahasa Indonesia tidak perlu selalu menyatakan penghubung ‘dan’.
- source_word: בִּי
  choice: Mohon
  rationale: Kata seru ini menyatakan permohonan yang sopan dan penuh hormat, bukan arti harfiah ‘di dalam aku’.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada seorang atasan manusia; bentuk ini mempertahankan hubungan sosial dalam konteks tanpa menjadikannya gelar ilahi.
- source_word: יָרֹד יָרַדְנוּ
  choice: kami benar-benar datang ke sini
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. ‘Benar-benar’ menyampaikan tekanan tersebut secara wajar; ‘ke sini’ mengungkapkan gerak turun menuju tempat pembicaraan menurut idiom Indonesia.
- source_word: בַּתְּחִלָּה
  choice: dahulu
  rationale: Dalam konteks ini frasa tersebut menunjuk pada kunjungan mereka yang sebelumnya atau pertama, bukan pada suatu permulaan abstrak.
- source_word: לִשְׁבָּר
  choice: untuk membeli
  rationale: Verba ini merujuk pada memperoleh persediaan, biasanya dengan membeli; objek eksplisitnya adalah makanan.
- source_word: אֹכֶל
  choice: makanan
  rationale: Nomina ini secara umum berarti makanan, meskipun konteks yang lebih luas berbicara tentang gandum.
theological_decisions:
- issue: Makna אֲדֹנִי dalam konteks ini
  choice: Tuanku sebagai sapaan kepada pejabat manusia
  alternative: Tuhanku sebagai gelar ilahi
  rationale: Saudara-saudara Yusuf sedang berbicara kepada kepala rumah Yusuf; konteks dan bentuk sapaan menunjukkan penghormatan sosial, bukan penyebutan Allah.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. ‘Mohon, Tuanku’ mempertahankan nada permohonan yang sangat hormat, sedangkan ‘benar-benar’ menjaga penegasan gramatikal bahasa Ibrani.
