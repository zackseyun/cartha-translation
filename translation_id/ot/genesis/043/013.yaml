lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם
  choice: Bawalah juga saudara kalian
  rationale: Kata sambung bersama penanda objek memberi nuansa tambahan; “juga” menyatakannya secara wajar. אֲחִיכֶם tetap diterjemahkan harfiah sebagai “saudara kalian,” sedangkan konteks bahwa yang dimaksud ialah Benyamin dijelaskan dalam catatan kaki.
- source_word: קָחוּ
  choice: Bawalah
  rationale: Imperatif jamak לקח berarti mengambil atau membawa. Dalam konteks perjalanan menuju pejabat itu, “bawalah” merupakan ungkapan Indonesia yang alami tanpa mengubah objek atau tujuan.
- source_word: וְ/קוּמוּ
  choice: Bersiaplah
  rationale: Secara harfiah berarti “bangkitlah.” Dalam rangkaian perintah untuk memulai perjalanan, “bersiaplah” menyampaikan fungsi idiomatisnya dalam bahasa Indonesia modern dan tetap mempertahankan desakan perintah.
- source_word: שׁוּבוּ
  choice: kembalilah
  rationale: Imperatif jamak שוב di sini menunjuk pada perjalanan kembali ke tempat yang sebelumnya didatangi.
- source_word: אֶל הָאִישׁ
  choice: kepada orang itu
  rationale: Preposisi אֶל menyatakan arah atau tujuan. הָאִישׁ secara harfiah “orang itu/orang tersebut” dalam wacana ini, yakni pejabat Mesir yang sudah dikenal oleh para pembicara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak “kalian” dipakai karena semua imperatif Ibrani ditujukan kepada lebih dari satu orang. Dua klausa dipisahkan untuk menjaga kelancaran, sedangkan “lalu” menyatakan urutan tindakan yang tersirat dalam rangkaian imperatif Ibrani.
