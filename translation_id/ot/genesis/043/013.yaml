  source_fidelity: '"Bersiaplah" is too interpretive for קוּמוּ (“arise/get up”); it can denote preparation without the commanded act of rising or setting out. "Bangkitlah" retains the source verb and works naturally in this travel command. The additive force of וְאֶת is appropriately represented by "juga," and "kembalilah kepada orang itu" accurately renders שׁוּבוּ אֶל־הָאִישׁ.'
  naturalness: The revised serial imperatives are clear and idiomatic in modern standard Indonesian. "Lalu" smoothly joins the commands without requiring an unnatural literal replication of Hebrew asyndeton.
  terminology: '"Saudara kalian" properly preserves the unexpanded Hebrew expression; the footnote may identify Benjamin contextually without putting the name into the text. "Orang itu" is an appropriate discourse-sensitive rendering of הָאִישׁ.'
