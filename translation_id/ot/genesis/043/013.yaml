  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: id
  text: Bawalah juga saudara kalian[a], lalu bangkitlah dan kembalilah kepada orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara kalian”; dalam konteks ini yang dimaksud adalah Benyamin.
