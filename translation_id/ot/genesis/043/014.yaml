  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: id
  text: Kiranya Allah Yang Mahakuasa mengaruniakan kepada kalian belas kasihan di hadapan orang itu[a], sehingga ia mengizinkan saudara kalian yang lain[b] dan Benyamin pulang bersama kalian. Sedangkan aku, jika aku kehilangan anak-anakku, aku kehilangan anak-anakku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengaruniakan kepada kalian kemurahan hati di hadapan orang itu.” Kata Ibrani רַחֲמִים dapat berarti belas kasihan, rasa iba, atau kemurahan hati.
    reason: lexical_alternative
  - marker: b
    text: “Saudara kalian yang lain” mengacu kepada Simeon, yang ditahan di Mesir.
    reason: cross_reference
  - marker: c
    text: Atau, “jika aku kehilangan, aku kehilangan.” Verba Ibrani yang diulangi mengandung makna kehilangan anak dan menegaskan kepasrahan Yakub.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi dengan ungkapan baku dan bermakna dalam bahasa Indonesia, bukan mentransliterasikannya.
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: membuat orang itu berbelas kasihan kepada kalian
  rationale: Secara idiomatis menyampaikan permohonan agar mereka memperoleh belas kasihan di hadapan pejabat Mesir itu; רַחֲמִים mencakup belas kasihan dan rasa iba.
- source_word: וְשִׁלַּח לָכֶם
  choice: sehingga ia membiarkan ... pulang bersama kalian
  rationale: Meneruskan nuansa harapan dari bentuk sebelumnya dan mengungkapkan pelepasan serta kepulangan yang tersirat oleh konteks.
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: saudara kalian yang lain
  rationale: אַחֵר membedakan saudara yang ditahan, yaitu Simeon, dari Benyamin yang disebut sesudahnya.
- source_word: וַאֲנִי
  choice: Mengenai aku
  rationale: Mempertahankan penonjolan pronomina dan peralihan dari doa bagi anak-anak Yakub kepada kepasrahannya sendiri.
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: jika aku harus kehilangan anak-anakku, biarlah aku kehilangan mereka
  rationale: Menangkap pengulangan verba שׁכל sebagai ungkapan kepasrahan terhadap kemungkinan kehilangan anak, dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  alternative: El Shaddai
  rationale: Gelar diterjemahkan agar maknanya terbuka bagi pembaca; pilihan ini merupakan padanan tradisional yang wajar tanpa menambahkan kekhususan doktrinal.
- issue: Cakupan kehilangan dalam penutup ayat
  choice: kehilangan anak-anakku
  alternative: kehilangan
  rationale: Verba שׁכל lazim menyatakan kehilangan anak; objek dijelaskan demi kealamian bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan bentuk yang lebih ringkas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan jamak diterjemahkan dengan “kalian” agar jumlahnya jelas. Susunan kalimat dibuat alami sambil mempertahankan doa Yakub, identitas tersirat Simeon, dan nada pasrah pada bagian akhir.
