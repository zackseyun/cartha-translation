lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: mendekati
  rationale: Bentuk naratif dari נגשׁ menyatakan gerak mendekat kepada seseorang; 'mendekati' alami dalam bahasa Indonesia modern dan mempertahankan arah tindakan.
- source_word: הָאִישׁ
  choice: orang
  rationale: Teks Ibrani hanya menyebut 'orang itu', bukan jabatan khusus seperti pengurus atau pelayan; identitas fungsionalnya diterangkan oleh klausa berikutnya.
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: yang mengurus rumah tangga Yusuf
  rationale: Konstruksi עַל menyatakan tanggung jawab atau wewenang atas rumah tangga Yusuf. 'Mengurus rumah tangga' jelas dan wajar tanpa membatasi בַּיִת pada bangunannya saja.
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: dan berbicara kepadanya
  rationale: דבר dengan אֶל lazim berarti berbicara kepada seseorang; isi perkataan menyusul dalam ayat berikutnya.
- source_word: פֶּתַח הַבָּיִת
  choice: di pintu masuk rumah itu
  rationale: פֶּתַח dapat menunjuk pintu, ambang, atau tempat masuk. 'Pintu masuk' menyampaikan lokasi dengan jelas, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
