  terminology: “Karung” tepat dalam konteks perjalanan dan gandum. “Uang perak” merupakan padanan yang wajar bagi כֶּסֶף dalam konteks pembayaran, tanpa menghapus unsur peraknya. Catatan pada “mulut karungnya” dan jumlah menurut timbangan relevan serta tertambat pada lokasi yang tepat.
