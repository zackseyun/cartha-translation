  to: Ketika kami sampai di tempat bermalam dan membuka karung-karung kami, ternyata uang perak setiap orang ada di mulut karungnya[a]—uang perak kami itu utuh sesuai timbangannya[b]—dan kami membawanya kembali bersama kami.
