base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: id
  text: Ketika kami sampai di tempat bermalam dan membuka karung-karung kami, ternyata uang perak setiap orang ada di mulut karungnya[a]—uang perak kami itu utuh sesuai timbangannya[b]—dan kami membawanya kembali bersama kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di bukaan karungnya.” Secara harfiah, bahasa Ibrani berbunyi “di mulut karungnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “uang perak kami sesuai dengan timbangannya”; maksudnya, jumlah yang dikembalikan tepat sama dengan jumlah yang semula ditimbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: tempat bermalam
  rationale: Menunjuk tempat singgah untuk melewatkan malam dalam perjalanan, tanpa mengharuskan pengertian penginapan komersial.
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: karung-karung kami / karungnya
  rationale: Dalam konteks pembelian gandum, 'karung' lebih tepat daripada 'tas' atau 'bawaan'.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Mengungkapkan penemuan yang mengejutkan secara alami dalam narasi bahasa Indonesia modern.
- source_word: כֶסֶף אִישׁ / כַּסְפֵּנוּ
  choice: uang perak setiap orang / uang perak kami
  rationale: כֶּסֶף dapat berarti perak sebagai alat pembayaran; 'uang perak' menjaga unsur material sekaligus memperjelas fungsinya dalam konteks transaksi.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: di mulut karungnya
  rationale: Mempertahankan gambaran idiom Ibrani, yang tetap dapat dipahami dalam bahasa Indonesia; alternatif yang lebih idiomatis dicatat dalam catatan kaki.
- source_word: בְּמִשְׁקָלוֹ
  choice: utuh sesuai timbangannya
  rationale: Menunjukkan bahwa jumlah perak yang ditemukan sama persis dengan jumlah yang semula ditimbang, tanpa kekurangan.
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: kami membawanya kembali dengan tangan kami sendiri
  rationale: Menyampaikan tindakan membawa kembali perak itu dan mempertahankan unsur בְּיָדֵנוּ secara alami, dengan nuansa bahwa mereka menyerahkannya sendiri.
