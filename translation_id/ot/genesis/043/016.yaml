  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Orang-orang itu” dipertahankan untuk הָאֲנָשִׁים, sedangkan ungkapan idiomatis tentang penyembelihan dibuat alami bagi pembaca umum.
