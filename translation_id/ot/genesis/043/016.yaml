base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: id
  text: Ketika Yusuf melihat Benyamin bersama mereka, ia berkata kepada orang yang mengurus rumah tangganya,[a] “Bawalah orang-orang itu masuk ke rumah, sembelihlah seekor hewan dan siapkanlah hidangannya,[b] sebab orang-orang itu akan makan bersamaku pada tengah hari.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada orang yang berada di atas rumah tangganya”; dapat juga diterjemahkan “kepada kepala rumah tangganya.”'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “sembelihlah sembelihan dan siapkanlah,” suatu ungkapan yang berarti menyembelih hewan dan menyiapkannya untuk jamuan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk Qal wayyiqtol dari ראה menyatakan bahwa Yusuf melihat atau menyadari kehadiran Benyamin; “melihat” adalah padanan Indonesia yang langsung dan wajar.
- source_word: אִתָּם
  choice: bersama mereka
  rationale: Preposisi dengan sufiks menunjukkan bahwa Benyamin berada bersama saudara-saudaranya.
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: kepada orang yang mengurus rumah tangganya
  rationale: Ungkapan Ibrani secara harfiah menunjuk kepada orang yang berada di atas atau bertanggung jawab atas rumah tangga Yusuf. Rumusan ini alami dalam bahasa Indonesia tanpa menetapkan gelar jabatan yang lebih khusus.
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: Bawalah orang-orang itu masuk ke rumah
  rationale: Akhiran penunjuk arah pada הַבָּיְתָה menyatakan gerak menuju atau masuk ke dalam rumah.
- source_word: וּטְבֹחַ טֶבַח
  choice: sembelihlah seekor hewan
  rationale: Gabungan verba dan nomina seakar ini merupakan idiom untuk menyembelih hewan sebagai persiapan jamuan. Objek “seekor hewan” dibuat eksplisit dalam bahasa Indonesia tanpa menentukan jenisnya.
- source_word: וְהָכֵן
  choice: siapkanlah hidangannya
  rationale: Bentuk Hifil imperatif dari כון berarti membuat siap. Dalam konteks penyembelihan untuk makan, “hidangannya” memperjelas bahwa yang dipersiapkan ialah makanan atau jamuan, tanpa mengubah maksud perintah.
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: sebab orang-orang itu akan makan bersamaku
  rationale: כִּי memperkenalkan alasan bagi perintah sebelumnya, sedangkan אִתִּי berarti “bersamaku.”
- source_word: בַּצָּהֳרָיִם
  choice: pada tengah hari
  rationale: Kata ini menunjuk waktu tengah hari atau siang; “pada tengah hari” jelas dan sesuai dengan ragam Indonesia modern.
