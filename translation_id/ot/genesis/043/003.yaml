  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: id
  text: Lalu Yehuda berkata kepadanya, “Orang itu telah dengan tegas memperingatkan kami[a], katanya, ‘Kalian tidak boleh melihat wajahku[b] kecuali jika saudara kalian menyertai kalian.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bentuk Ibraninya mengulang akar kata kerja untuk memberi penekanan; dapat juga diterjemahkan, “memperingatkan kami dengan sungguh-sungguh” atau “memperingatkan kami dengan jelas.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “melihat wajahku” juga dapat berarti “menghadapku” atau “datang ke hadapanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: Lalu Yehuda berkata kepadanya
  rationale: Waw-konsekutif melanjutkan alur cerita, sehingga “Lalu” wajar dalam narasi Indonesia; אֵלָיו merujuk kepada Yakub dalam konteks.
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: dengan sungguh-sungguh memperingatkan kami
  rationale: Infinitif absolut yang disertai verba finit memberi penegasan kuat. Dalam konteks ini, maknanya adalah peringatan tegas, bukan kesaksian dalam sidang.
- source_word: הָאִישׁ
  choice: Orang itu
  rationale: Mempertahankan sebutan umum Ibrani bagi pejabat Mesir yang sebelumnya mereka temui.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Pengantar kutipan langsung ini diterjemahkan secara alami dan ringkas dalam bahasa Indonesia.
- source_word: לֹא תִרְאוּ פָנַי
  choice: Kalian tidak boleh melihat wajahku
  rationale: Mempertahankan gambaran harfiah ungkapan Ibrani sekaligus menyampaikan larangan kepada para saudara dalam bahasa Indonesia yang wajar.
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: kecuali saudara kalian bersama kalian
  rationale: בִּלְתִּי menyatakan syarat pengecualian; bentuk tunggal “saudara” merujuk khusus kepada Benyamin, sedangkan sufiks jamak diterjemahkan “kalian.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan dalam kutipan berbentuk jamak. Ungkapan “melihat wajahku” dipertahankan untuk menjaga citra bahasa sumber, dengan makna idiomatis dijelaskan dalam catatan kaki.
