  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: id
  text: Maka orang itu melakukan sebagaimana yang Yusuf katakan, lalu ia membawa[a] orang-orang itu ke dalam rumah Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menuntun orang-orang itu ke rumah Yusuf.”
    reason: Alternatif leksikal kontekstual untuk וַיָּבֵא; “membawa” secara langsung mencerminkan bentuk kausatif, sedangkan “menuntun” menyatakan pemahaman kontekstual yang mungkin.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata עשה di sini menyatakan bahwa orang itu bertindak sesuai dengan perkataan Yusuf; “melakukan” mempertahankan makna umum verba tersebut.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Teks Ibrani menyebutnya hanya sebagai “orang itu.” Konteks menunjukkan bahwa ia mengurus rumah Yusuf, tetapi jabatannya tidak disebutkan dalam ayat ini.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: seperti yang dikatakan Yusuf
  rationale: Ungkapan ini menyatakan kesesuaian tindakan orang itu dengan perkataan atau perintah Yusuf tanpa menambahkan sebutan yang tidak tersurat.
- source_word: וַיָּבֵא
  choice: membawa
  rationale: Bentuk hifil dari בוא secara langsung menyatakan tindakan menyebabkan seseorang datang atau masuk, sehingga “membawa” paling dekat dengan bentuk kausatif sumber.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Walaupun mereka adalah saudara-saudara Yusuf, ayat ini memakai istilah umum “orang-orang itu,” yang dipertahankan dalam terjemahan.
- source_word: בֵּיתָה יוֹסֵף
  choice: masuk ke rumah Yusuf
  rationale: Akhiran penunjuk arah pada בֵּיתָה menyatakan gerak menuju rumah; dalam konteks ini, “masuk ke” memperjelas bahwa mereka dibawa ke dalam rumah.
