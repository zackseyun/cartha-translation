translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan “orang itu” dipertahankan untuk mencerminkan pengulangan הָאִישׁ dalam teks Ibrani; “lalu” mengalirkan rangkaian tindakan secara alami.
