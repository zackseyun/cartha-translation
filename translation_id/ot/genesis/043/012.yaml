  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: id
  text: Bawalah uang dua kali lipat, dan bawalah kembali uang yang telah dikembalikan dan ada di mulut karung-karung kalian[a]. Mungkin itu suatu kekeliruan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di mulut karung-karung kalian,” yaitu di bagian bukaan karung-karung itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: uang dua kali lipat
  rationale: מִשְׁנֶה menyatakan jumlah ganda. Ungkapan ini mempertahankan daya kuantitatif teks tanpa menentukan apakah yang dimaksud tepat dua kali harga pembelian sebelumnya atau uang tambahan sejumlah yang sama.
- source_word: קְחוּ בְיֶדְכֶם
  choice: bawalah
  rationale: Ungkapan harfiah 'ambil di tangan kalian' merupakan idiom membawa serta. 'Bawalah' alami dalam bahasa Indonesia dan tetap menyampaikan tindakan yang diperintahkan.
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: uang yang dikembalikan
  rationale: Partisipel Hofal dari שוב bersifat pasif dan menyatakan bahwa uang itu telah dibuat kembali atau dikembalikan; bentuk pasif dipertahankan tanpa menyatakan siapa pelakunya.
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: ke mulut karung-karung kalian
  rationale: '''Mulut'' adalah metafora Ibrani yang konkret bagi bukaan karung. Bentuk ini dipertahankan dalam teks, dengan penjelasan idiomatis dalam catatan kaki.'
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: bawalah kembali
  rationale: Bentuk Hifil dari שוב berarti membawa atau mengembalikan sesuatu. 'Bawalah kembali' idiomatis dan sesuai dengan konteks perjalanan mereka.
- source_word: אוּלַי
  choice: mungkin
  rationale: Pilihan ini menyampaikan ketidakpastian secara alami dalam bahasa Indonesia modern.
- source_word: מִשְׁגֶּה
  choice: suatu kekeliruan
  rationale: Kata ini menunjuk pada kesalahan atau kekhilafan. 'Kekeliruan' sesuai dengan konteks transaksi dan tidak menyiratkan penipuan atau kesalahan moral.
