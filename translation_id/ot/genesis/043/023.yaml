  verdict: revise
  source_fidelity: Perlu revisi kecil. "Tenanglah" menyampaikan maksud menenangkan, tetapi tidak mempertahankan makna dasar שָׁלוֹם sebagai salam/berkat damai. "Harta terpendam" dapat secara khusus menyiratkan harta yang dikubur, sedangkan מַטְמוֹן berarti harta yang tersimpan atau tersembunyi. Terjemahan revisi mempertahankan kedua nuansa itu tanpa menambahkan rincian.
  naturalness: Teks revisi tetap baku dan alami. "Damai sejahtera bagi kalian" sesuai sebagai sapaan yang menenteramkan dalam register naratif Alkitab, dan "Allah kalian ... ayah kalian" memperjelas bahwa lawan bicara berbentuk jamak sambil mempertahankan "ayah" yang tunggal dalam bahasa Ibrani.
  terminology: '"Allah" tepat untuk אֱלֹהִים dalam konstruksi ini dan tidak menilai keyakinan pribadi sang pengurus. "Karung-karung", "perak", dan "membawa ... keluar" mempertahankan unsur konkret serta arah tindakan dalam teks sumber.'
  issues:
  - severity: medium
    issue: '"Tenanglah" untuk שָׁלוֹם לָכֶם'
    rationale: Ungkapan ini memang berfungsi menenangkan, tetapi שָׁלוֹם secara leksikal adalah damai/kesejahteraan sebagai salam atau berkat. "Damai sejahtera bagi kalian" mempertahankan makna itu, sementara kalimat berikutnya tetap menyatakan larangan untuk takut.
  - severity: low
    issue: '"Harta terpendam" untuk מַטְמוֹן'
    rationale: Dalam pemakaian Indonesia, "terpendam" mudah dipahami sebagai terkubur. Teks Ibrani menunjuk harta yang disimpan/tersembunyi tanpa menyatakan bahwa harta itu dikubur. "Harta" di teks utama dan alternatif "harta tersembunyi" di catatan lebih aman.
  - severity: low
    issue: Kata milik -mu tidak memperjelas bentuk jamak sumber
    rationale: Bahasa Indonesia mengizinkan -mu untuk sapaan kolektif, tetapi "kalian" dengan jelas menyatakan bahwa pengurus berbicara kepada para saudara, tanpa mengubah "ayah" yang tunggal.
