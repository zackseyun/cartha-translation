base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: id
  text: Ia berkata, “Damai sejahtera bagi kalian, jangan takut. Allah kalian dan Allah ayah kalian telah memberikan harta[a] kepada kalian di dalam karung-karung kalian. Perak kalian telah sampai kepadaku[b].” Kemudian ia membawa Simeon keluar kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harta tersembunyi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Uang kalian telah sampai kepadaku.” Kata Ibrani untuk “perak” juga lazim berarti uang.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: Tenanglah
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai penenteraman, bukan sekadar salam. 'Tenanglah' alami dalam bahasa Indonesia dan mengantar langsung pada perintah 'jangan takut'.
- source_word: אַל תִּירָאוּ
  choice: jangan takut
  rationale: Padanan baku dan alami bagi larangan dengan ירא dalam bahasa Indonesia modern.
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: Allahmu dan Allah ayahmu
  rationale: Bentuk akhiran orang kedua jamak tidak dibedakan dalam kata milik bahasa Indonesia, tetapi konteks menunjukkan semua saudara itu. 'Ayahmu' mempertahankan bentuk tunggal Ibrani dan 'Allah' menyatakan rujukan tunggal dalam konstruksi ini.
- source_word: נָתַן לָכֶם
  choice: telah memberikan
  rationale: Bentuk perfektif Ibrani menyatakan tindakan yang sudah terjadi dengan hasil yang kini nyata dalam karung mereka.
- source_word: מַטְמוֹן
  choice: harta terpendam
  rationale: Kata ini menunjuk pada harta yang tersembunyi atau tersimpan. 'Harta terpendam' mempertahankan nuansa leksikal yang lebih khusus daripada sekadar 'harta'.
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: di dalam karung-karungmu
  rationale: Istilah ini merujuk pada wadah pembawa gandum. 'Karung' cocok dengan konteks pengangkutan kuno, dan pengulangan menandai bentuk jamak yang penting dalam adegan ini.
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: Uang perakmu sudah kuterima
  rationale: כֶּסֶף secara harfiah berarti perak dan lazim berarti uang. 'Uang perak' mempertahankan bentuk konkretnya, sedangkan 'sudah kuterima' menyampaikan idiom 'datang kepadaku' secara alami tanpa mengubah maksudnya.
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: Kemudian ia membawa Simeon keluar kepada mereka
  rationale: Bentuk kausatif יצא berarti 'membawa keluar'. 'Kemudian' menghasilkan alur narasi Indonesia yang alami, sementara 'keluar' mempertahankan arah tindakan.
theological_decisions:
- issue: Rujukan kepada Allah dalam ucapan pengurus rumah
  choice: Ucapan itu diterjemahkan secara langsung sebagai rujukan kepada Allah saudara-saudara itu dan Allah ayah mereka.
  alternative: Menafsirkannya sebagai basa-basi diplomatis semata atau sebagai bukti bahwa pengurus itu secara pribadi beriman penuh.
  rationale: Teks Ibrani melaporkan perkataannya tanpa menjelaskan keyakinan batinnya. Terjemahan tidak boleh menetapkan penilaian teologis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan penenteram diterjemahkan secara kontekstual; istilah konkret seperti 'karung', 'uang perak', dan 'membawa ... keluar' dipertahankan sejauh tetap alami.
