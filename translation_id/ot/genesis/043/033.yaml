revisions:
- from: Mereka duduk di hadapan Yusuf, dari yang sulung menurut urutan kelahirannya sampai yang bungsu menurut usianya.[a] Orang-orang itu pun saling memandang dengan takjub.[b]
  to: Mereka duduk di hadapan Yusuf menurut urutan kelahiran mereka, dari yang sulung sampai yang bungsu.[a] Orang-orang itu pun saling memandang dengan takjub.[b]
  rationale: Revisi memperlancar penyampaian susunan dari sulung hingga bungsu dan menjaga fungsi kedua frasa Ibrani sebagai penanda urutan kelahiran. Nama Yusuf tetap dipertahankan untuk kejelasan rujukan. Catatan kaki diperbarui agar alternatifnya idiomatis dan penjelasannya selaras dengan teks sumber.
