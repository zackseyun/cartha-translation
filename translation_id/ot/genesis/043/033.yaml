  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: id
  text: Mereka duduk di hadapan Yusuf menurut urutan kelahiran mereka, dari yang sulung sampai yang bungsu.[a] Orang-orang itu pun saling memandang dengan takjub.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang sulung menurut kesulungannya dan yang muda menurut kemudaannya.” Bahasa Ibrani memakai dua ungkapan yang paralel untuk menggambarkan susunan tempat duduk berdasarkan urutan kelahiran.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Orang-orang itu pun heran seorang terhadap yang lain.” Kata kerja Ibrani menyatakan ketakjuban; frasa “seorang kepada temannya” menunjukkan reaksi timbal balik di antara mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: Mereka duduk
  rationale: Bentuk aktif naratif dari ישׁב paling langsung diterjemahkan sebagai tindakan duduk; konteks menunjukkan bahwa tempat mereka telah diatur tanpa perlu mengubahnya menjadi bentuk pasif.
- source_word: לְפָנָיו
  choice: di hadapan Yusuf
  rationale: Ungkapan ini bersifat spasial, 'di hadapannya'. Nama Yusuf dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: dari yang sulung menurut urutan kelahirannya
  rationale: הַבְּכֹר mempertahankan gagasan anak sulung, sedangkan dalam konteks pengaturan tempat duduk כִּבְכֹרָתוֹ menunjuk pada urutan atau kedudukan berdasarkan kelahiran.
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: sampai yang bungsu menurut usianya
  rationale: Kontras dengan yang sulung dan konteks seluruh saudara mendukung arti superlatif 'yang bungsu'; frasa berikutnya menyatakan penempatan berdasarkan usia muda relatif.
- source_word: וַיִּתְמְהוּ
  choice: memandang dengan takjub
  rationale: תמה menyatakan rasa heran atau takjub. Bersama idiom timbal balik berikutnya, terjemahan ini menggambarkan reaksi mereka secara alami tanpa menghilangkan unsur keheranan.
- source_word: הָאֲנָשִׁים אִישׁ אֶל־רֵעֵהוּ
  choice: Orang-orang itu pun saling
  rationale: הָאֲנָשִׁים secara harfiah berarti 'orang-orang itu', sedangkan אִישׁ אֶל־רֵעֵהוּ merupakan idiom tindakan timbal balik yang wajar diterjemahkan 'saling'.
