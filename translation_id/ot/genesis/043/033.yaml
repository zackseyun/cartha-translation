translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Sulung' dan 'bungsu' dipilih sebagai istilah kekerabatan yang umum dan tepat; 'dari ... sampai ...' menyampaikan rentang susunan saudara secara alami. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
