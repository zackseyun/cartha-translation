  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֣יתָ/ה יוֹסֵ֑ף וַ/יִּתֶּן מַ֨יִם֙ וַ/יִּרְחֲצ֣וּ רַגְלֵי/הֶ֔ם וַ/יִּתֵּ֥ן מִסְפּ֖וֹא לַ/חֲמֹֽרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: id
  text: Orang itu membawa orang-orang itu masuk ke rumah Yusuf dan memberi mereka air, lalu mereka membasuh kaki mereka; kemudian ia memberikan pakan kepada keledai-keledai mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ayat ini menyebut “orang itu” dan “orang-orang itu”. Konteks menunjukkan bahwa yang pertama adalah pengurus rumah Yusuf dan yang lain adalah saudara-saudara Yusuf, tetapi sebutan tersebut tidak dinyatakan dalam ayat ini.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֵא
  choice: membawa ... masuk
  rationale: Bentuk Hifil dari בוא menyatakan bahwa orang itu menyebabkan mereka masuk; frasa ini alami dalam bahasa Indonesia dan mempertahankan arah gerak ke dalam rumah.
- source_word: הָאִישׁ / הָאֲנָשִׁים
  choice: orang itu / orang-orang itu
  rationale: Teks Ibrani memakai sebutan umum dan tidak secara eksplisit menyebut orang pertama sebagai pengurus rumah Yusuf atau orang-orang tersebut sebagai saudara-saudara Yusuf.
- source_word: בֵּיתָה יוֹסֵף
  choice: masuk ke rumah Yusuf
  rationale: Akhiran penunjuk arah pada בֵּיתָה menyatakan gerak menuju bagian dalam rumah.
- source_word: וַיִּתֶּן מַיִם
  choice: memberi mereka air
  rationale: Kata ganti 'mereka' tersirat dari konteks dan ditambahkan agar ungkapannya wajar dalam bahasa Indonesia.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: mereka membasuh kaki mereka
  rationale: Kata kerjanya aktif dan jamak; terjemahan ini tidak mengubahnya menjadi tindakan pelayan atau bentuk pasif.
- source_word: מִסְפּוֹא
  choice: pakan
  rationale: Kata ini menunjuk pada makanan untuk hewan; 'pakan' merupakan istilah Indonesia modern yang jelas dan tepat.
- source_word: לַחֲמֹרֵיהֶם
  choice: kepada keledai-keledai mereka
  rationale: Preposisi menandai penerima atau pihak yang mendapat manfaat; bentuk ini mempertahankan susunan tindakan memberi dalam teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'orang itu/orang-orang itu' dipertahankan karena mencerminkan pembedaan dalam teks Ibrani. Tanda titik koma membantu memperjelas pergantian pelaku dari orang itu kepada para tamu.
