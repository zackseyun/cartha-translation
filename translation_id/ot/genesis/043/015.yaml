  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: id
  text: Lalu orang-orang itu membawa pemberian ini dan uang dua kali lipat bersama mereka, serta membawa Benyamin. Mereka pun berangkat dan turun ke Mesir, lalu berdiri di hadapan Yusuf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: pemberian
  rationale: Dalam kisah Yusuf, kata ini menunjuk pada barang yang dibawa sebagai pemberian untuk menyenangkan seorang penguasa, bukan persembahan ibadah.
- source_word: מִשְׁנֶה כֶּסֶף
  choice: uang dua kali lipat
  rationale: Ungkapan ini menyatakan jumlah uang yang dua kali lipat dibandingkan jumlah sebelumnya.
- source_word: כֶּסֶף
  choice: uang
  rationale: Secara harfiah berarti 'perak', tetapi dalam konteks transaksi berfungsi sebagai alat pembayaran.
- source_word: בְיָדָם
  choice: bersama mereka
  rationale: Secara harfiah 'di tangan mereka'; idiom Ibrani ini menyatakan sesuatu yang dibawa atau berada dalam penguasaan mereka.
- source_word: וְאֶת בִּנְיָמִן
  choice: dan membawa Benyamin
  rationale: Kata kerja 'membawa' diulangi dalam bahasa Indonesia agar koordinasi objeknya jelas dan alami.
- source_word: וַיָּקֻמוּ
  choice: mereka pun berangkat
  rationale: Walaupun secara harfiah berarti 'mereka bangkit', dalam rangkaian perjalanan kata ini secara alami menyatakan mulai berangkat.
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: pergi turun ke Mesir
  rationale: Mempertahankan idiom geografis Ibrani tentang perjalanan dari Kanaan ke Mesir.
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: berdiri di hadapan Yusuf
  rationale: Terjemahan langsung ini jelas dan mempertahankan gambaran mereka menghadap seorang penguasa.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Mempertahankan sebutan eksplisit teks Ibrani tanpa menggantinya dengan penjelasan kontekstual 'saudara-saudara Yusuf'.
