  to: Lalu orang-orang itu membawa pemberian ini dan uang dua kali lipat bersama mereka, serta membawa Benyamin. Mereka pun berangkat dan turun ke Mesir, lalu berdiri di hadapan Yusuf.
  rationale: Revisi mengganti demonstratif “tersebut” dengan “ini” sesuai הַזֹּאת, mengurangi pengulangan verba yang berlebih, dan memperbaiki “pergi turun” menjadi rangkaian perjalanan yang alami. Makna, urutan tindakan, idiom geografis ‘turun ke Mesir’, serta dua jangkar catatan kaki tetap dipertahankan.
