    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: כִּי pertama memperkenalkan alasan yang dikemukakan Yehuda; “Sebab” sesuai dengan alur wacana dan ragam bahasa Indonesia yang bermartabat.
- source_word: לוּלֵא
  choice: seandainya ... tidak
  rationale: לוּלֵא membentuk syarat kontrafaktual tentang masa lampau. “Seandainya ... tidak” menyampaikan keadaan yang berlawanan dengan kenyataan secara alami.
- source_word: הִתְמַהְמָהְנוּ
  choice: kita tidak menunda-nunda
  rationale: Bentuk ini menyatakan berlambat-lambat, menunda, atau berlama-lama. “Menunda-nunda” jelas dalam konteks keberangkatan yang tertangguh, tanpa menutup kemungkinan nuansa lain.
- source_word: כִּי עַתָּה
  choice: sekarang ... tentu sudah
  rationale: Dalam akibat kontrafaktual, gabungan ini menekankan bahwa hasil tersebut semestinya telah tercapai pada saat sekarang. “Sekarang ... tentu sudah” mengungkapkan nuansa itu dengan wajar.
- source_word: שַׁבְנוּ
  choice: kita tentu sudah pulang
  rationale: Walaupun secara bentuk merupakan perfektum, dalam konstruksi kontrafaktual kata ini menyatakan hasil yang seharusnya telah terjadi. “Pulang” alami karena perjalanan itu dipandang dari tempat Yakub.
- source_word: זֶה פַעֲמָיִם
  choice: untuk kedua kalinya
  rationale: Ungkapan harfiah yang melibatkan “dua kali” menunjuk pada perjalanan pulang kedua yang sudah dapat diselesaikan. “Untuk kedua kalinya” lebih jelas dan alami dalam konteks ini.
