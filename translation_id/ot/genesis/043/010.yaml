  text: Sebab, seandainya kami tidak berlama-lama[a], sekarang kami tentu sudah kembali dua kali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menunda” atau “ragu-ragu.” Kata kerja Ibrani ini dapat berarti berlama-lama, menunda, atau ragu-ragu.
