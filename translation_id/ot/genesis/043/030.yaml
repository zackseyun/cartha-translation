  naturalness: Teks revisi memakai bahasa Indonesia modern dan naratif. “Kasih sayangnya kepada saudaranya sangat tergugah” lebih dekat kepada idiom sumber daripada “meluap,” sambil tetap dapat dipahami secara alami. Kalimat-kalimat pendek setelahnya mempertahankan alur tindakan Ibrani.
