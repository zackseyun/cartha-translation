  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: id
  text: Lalu Yusuf bergegas, sebab kasih sayangnya kepada saudaranya sangat tergugah. Ia mencari tempat untuk menangis[a]. Ia masuk ke ruangan itu dan menangis di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia mencari kesempatan untuk menangis.” Secara harfiah, “ia mencari untuk menangis.” Dalam konteks ini, ia tampaknya mencari tempat tersendiri untuk menangis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: bergegas
  rationale: Kata kerja ini berarti bertindak dengan segera. 'Bergegas' alami dalam bahasa Indonesia dan tidak menambahkan arah gerak yang tidak dinyatakan dalam teks Ibrani.
- source_word: נִכְמְרוּ רַחֲמָיו
  choice: rasa sayangnya ... meluap
  rationale: Ungkapan Ibrani menggambarkan belas kasih atau kasih sayang batin yang tergugah dengan kuat. 'Meluap' menyampaikan intensitas emosi secara alami tanpa mempertahankan metafora anggota tubuh secara harfiah.
- source_word: אֶל אָחִיו
  choice: kepada adiknya
  rationale: אָח dapat berarti saudara laki-laki atau adik/kakak. Dalam konteks ini yang dimaksud ialah Benyamin, saudara Yusuf yang lebih muda, sehingga 'adiknya' tepat dan alami tanpa menambahkan namanya.
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: Ia mencari tempat untuk menangis
  rationale: Secara lebih harfiah ungkapan ini berarti 'ia mencari/berusaha untuk menangis'. Konteks menunjukkan bahwa Yusuf mencari tempat tersendiri agar dapat menangis; penambahan 'tempat' membuat implikasinya jelas dalam bahasa Indonesia dan dicatat dalam catatan kaki.
- source_word: הַחַדְרָה
  choice: ke kamar
  rationale: Kata benda ini menunjuk pada sebuah kamar atau ruang dalam. 'Kamar' merupakan padanan Indonesia modern yang singkat dan wajar.
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: dan menangis di sana
  rationale: '''Menangis'' adalah padanan baku untuk kata kerja ini, dan ''di sana'' mempertahankan penekanan lokatif שָׁמָּה.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur naratif Ibrani dipertahankan tanpa menambahkan bahwa Yusuf bergegas keluar; idiom emosi dialihkan secara alami sebagai 'rasa sayangnya ... meluap'.
