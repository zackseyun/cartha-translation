  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: id
  text: Setelah mereka menghabiskan gandum yang mereka bawa dari Mesir, ayah mereka berkata kepada mereka, “Pergilah kembali dan belilah sedikit makanan untuk kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Setelah
  rationale: Dalam alur narasi Indonesia, klausa waktu dengan 'setelah' secara alami menyampaikan bahwa peristiwa berikutnya terjadi sesudah gandum habis dimakan, tanpa menerjemahkan formula naratif secara kaku.
- source_word: כִּלּוּ לֶאֱכֹל
  choice: mereka selesai memakan
  rationale: Gabungan כלה dengan infinitif menyatakan selesainya tindakan makan; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַשֶּׁבֶר
  choice: gandum
  rationale: Dalam kisah Yusuf, nomina ini menunjuk pada gandum yang diperoleh atau dibeli pada masa kelaparan, bukan makanan secara umum.
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: yang dibawa dari Mesir
  rationale: Klausa relatif ini mempertahankan asal gandum dan secara alami menunjukkan bahwa tindakan membawanya telah terjadi sebelumnya.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Terjemahan langsung mempertahankan sebutan relasional teks Ibrani tanpa menggantinya dengan nama Yakub.
- source_word: שֻׁבוּ
  choice: Pergilah kembali
  rationale: Imperatif ini menyuruh mereka melakukan perjalanan kembali; ungkapan tersebut alami sekaligus mempertahankan gagasan kembali.
- source_word: שִׁבְרוּ
  choice: belilah
  rationale: Dalam konteks ini verba שבר berarti membeli gandum atau persediaan makanan; karena objek berikutnya adalah 'makanan', bentuk umum 'belilah' menghindari pengulangan atau penyempitan yang tidak perlu.
- source_word: לָנוּ
  choice: untuk kita
  rationale: Dativus kepentingan dinyatakan secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: מְעַט אֹכֶל
  choice: sedikit makanan
  rationale: Terjemahan ini mempertahankan kuantitas kecil yang dinyatakan מְעַט dan arti umum אֹכֶל sebagai makanan.
