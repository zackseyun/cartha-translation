base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: id
  text: Mereka menyajikan hidangan bagi Yusuf secara terpisah, bagi saudara-saudaranya secara terpisah, dan bagi orang-orang Mesir yang makan bersamanya secara terpisah. Sebab, orang-orang Mesir tidak dapat makan bersama orang Ibrani[a], karena hal itu merupakan kekejian bagi orang-orang Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “makan roti dengan orang Ibrani”; ungkapan ini berarti makan bersama atau bersantap bersama.
    reason: Menjelaskan idiom Ibrani לֶאֱכֹל אֶת־הָעִבְרִים לֶחֶם yang diterjemahkan secara idiomatis dalam teks utama.
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: mereka menghidangkan makanan
  rationale: Secara harfiah berarti ‘menaruh/menempatkan’, tetapi dalam konteks jamuan tindakan yang dimaksud ialah menyajikan atau menghidangkan makanan kepada kelompok-kelompok yang berbeda.
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: tersendiri
  rationale: Pengulangan ‘tersendiri’ mempertahankan penekanan Ibrani pada pemisahan Yusuf, saudara-saudaranya, dan para pejabat Mesir saat makan.
- source_word: הָאֹכְלִים אִתּוֹ
  choice: yang makan bersamanya
  rationale: Partisip Ibrani diterjemahkan secara alami sebagai klausa relatif tanpa menghilangkan gagasan bahwa mereka makan bersama Yusuf.
- source_word: לֹא יוּכְלוּן
  choice: tidak dapat
  rationale: Ungkapan ini dapat menyatakan ketidakmungkinan berdasarkan adat atau larangan sosial; ‘tidak dapat’ mempertahankan keluasan makna itu.
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: makan bersama orang Ibrani
  rationale: Secara harfiah ‘makan roti bersama orang Ibrani’; dalam bahasa Ibrani, ‘makan roti’ merupakan ungkapan untuk makan atau bersantap, sehingga terjemahan idiomatis ini alami dalam bahasa Indonesia.
- source_word: תוֹעֵבָה
  choice: menjijikkan
  rationale: Kata ini menunjukkan sesuatu yang dipandang sangat keji, tabu, atau tidak dapat diterima. ‘Menjijikkan’ menyampaikan kekuatan istilah tersebut secara wajar tanpa menentukan apakah alasannya terutama ritual atau budaya.
- source_word: מִצְרִים / הָעִבְרִים
  choice: orang Mesir / orang Ibrani
  rationale: Bentuk etnonim Indonesia yang lazim dan jelas mempertahankan pertentangan antarkelompok dalam ayat.
theological_decisions:
- issue: Dasar ketidakmungkinan orang Mesir makan bersama orang Ibrani
  choice: Mempertahankan pernyataan umum bahwa hal itu menjijikkan bagi orang Mesir
  alternative: Menjelaskannya sebagai kenajisan ritual atau kebencian etnis tertentu
  rationale: Teks tidak menyebut alasan khusus di balik pantangan tersebut, sehingga terjemahan tidak boleh memasukkan penjelasan teologis atau historis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘tersendiri’ sengaja dipertahankan untuk menampilkan struktur serta penekanan teks Ibrani; ‘saudara-saudaranya’ memperjelas rujukan pronomina dalam konteks narasi.
