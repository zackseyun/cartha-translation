revisions:
- from: Mereka menghidangkan makanan untuk Yusuf tersendiri, untuk saudara-saudaranya tersendiri, dan untuk orang-orang Mesir yang makan bersamanya tersendiri. Sebab, orang Mesir tidak dapat makan bersama orang Ibrani karena hal itu menjijikkan bagi orang Mesir.[a]
  to: Mereka menyajikan hidangan bagi Yusuf secara terpisah, bagi saudara-saudaranya secara terpisah, dan bagi orang-orang Mesir yang makan bersamanya secara terpisah. Sebab, orang-orang Mesir tidak dapat makan bersama orang Ibrani[a], karena hal itu merupakan kekejian bagi orang-orang Mesir.
  rationale: Revisi mempertahankan pemisahan tiga kelompok dan ketidakmampuan orang Mesir untuk makan bersama orang Ibrani. Istilah “kekejian” menggantikan “menjijikkan” agar nomina Ibrani תּוֹעֵבָה diterjemahkan secara lebih langsung dan kuat, tanpa menentukan dasar ritual, budaya, atau etnis bagi pantangan itu. Catatan kaki dipindahkan ke idiom “makan roti” yang tidak diterjemahkan secara harfiah.
