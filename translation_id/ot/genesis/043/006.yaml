  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל לָ/מָ֥ה הֲרֵעֹתֶ֖ם לִ֑/י לְ/הַגִּ֣יד לָ/אִ֔ישׁ הַ/ע֥וֹד לָ/כֶ֖ם אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: id
  text: Lalu Israel berkata, “Mengapa kalian mendatangkan kesusahan kepadaku dengan memberi tahu orang itu bahwa kalian masih mempunyai seorang saudara?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub, sehingga penamaan narator dipertahankan.
- source_word: לָמָה
  choice: Mengapa
  rationale: Padanan langsung dan alami bagi kata tanya yang menanyakan alasan.
- source_word: הֲרֵעֹתֶם לִי
  choice: kalian mendatangkan kesusahan kepadaku
  rationale: Bentuk Hifil dari רעע menyatakan menyebabkan keburukan atau kerugian. Dalam konteks ini, ungkapan tersebut menyampaikan keluhan Israel bahwa tindakan mereka menimbulkan kesusahan baginya, tanpa harus menuduh mereka melakukan kejahatan moral.
- source_word: לְהַגִּיד
  choice: dengan memberi tahu
  rationale: Infinitif ini menyatakan cara atau sarana yang menyebabkan kesusahan tersebut.
- source_word: לָאִישׁ
  choice: orang itu
  rationale: Merujuk kepada pejabat Mesir yang sudah dikenal dalam konteks; bentuk ini alami sekaligus mempertahankan arti אִישׁ.
- source_word: הַעוֹד לָכֶם אָח
  choice: bahwa kalian masih mempunyai seorang saudara
  rationale: Frasa ini secara harfiah menanyakan apakah masih ada saudara bagi mereka. “Masih mempunyai seorang saudara” alami dalam bahasa Indonesia dan tidak menambahkan kata “lain” yang hanya tersirat dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak “kalian” memperjelas bahwa Israel berbicara kepada beberapa anaknya. Terjemahan mempertahankan nama “Israel” dan tidak mempertegas “seorang saudara” menjadi “seorang saudara lain,” sehingga implikasi kontekstual tidak dimasukkan sebagai unsur eksplisit.
