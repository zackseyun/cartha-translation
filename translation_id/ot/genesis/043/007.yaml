base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: id
  text: Mereka menjawab, “Orang itu menanyai kami dengan saksama tentang diri kami dan keluarga kami. Katanya, ‘Apakah ayah kalian masih hidup? Apakah kalian mempunyai saudara laki-laki?’ Lalu kami memberitahukan kepadanya sesuai dengan hal-hal itu. Mana mungkin kami tahu bahwa ia akan berkata, ‘Bawalah saudara laki-laki kalian turun’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: menanyai ... dengan saksama
  rationale: Infinitif absolut yang diikuti verba seakar memberi penegasan pada tindakan bertanya; frasa ini menyampaikan bahwa pertanyaannya terperinci dan sungguh-sungguh.
- source_word: מוֹלַדְתֵּנוּ
  choice: keluarga kami
  rationale: Dalam konteks ini kata tersebut menunjuk pada hubungan keluarga atau kaum kerabat, bukan sekadar tempat kelahiran.
- source_word: הֲיֵשׁ לָכֶם אָח
  choice: Apakah kalian mempunyai saudara laki-laki?
  rationale: אָח berarti saudara laki-laki. Kata 'lain' tidak dinyatakan secara eksplisit dalam bahasa Ibrani, sehingga tidak ditambahkan.
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: sesuai dengan pertanyaan-pertanyaan itu
  rationale: Secara harfiah berarti 'menurut hal-hal/perkataan-perkataan ini'; dalam konteks, mereka memberi jawaban sesuai dengan pokok yang ditanyakan.
- source_word: הֲיָדוֹעַ נֵדַע
  choice: Mana mungkin kami tahu
  rationale: Gabungan bentuk tanya dan infinitif absolut menyatakan ketidakmungkinan mengetahui sebelumnya dengan penekanan kuat.
- source_word: הוֹרִידוּ
  choice: Bawalah ... turun ke sini
  rationale: Verba kausatif dari 'turun' mempertahankan gambaran perjalanan turun menuju Mesir sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan dialog yang alami dan bermartabat. Bentuk sapaan jamak 'kalian' dipakai karena seluruh verba dan pronomina Ibrani yang ditujukan kepada para saudara berbentuk jamak. Ambiguitas yang tidak dinyatakan teks—khususnya gagasan 'saudara lain'—tidak ditambahkan.
