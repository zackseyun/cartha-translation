  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: id
  text: Ia menyuruh agar porsi makanan dari hadapannya dibagikan kepada mereka[a]. Namun, porsi Benyamin lima kali lebih banyak daripada porsi masing-masing saudara lainnya[b]. Lalu mereka minum dan menjadi mabuk[c] bersama Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hadapannya”; maksudnya kemungkinan besar dari tempat Yusuf sendiri dalam perjamuan itu.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “lima tangan”, sebuah ungkapan Ibrani yang berarti lima kali lipat.
    reason: lexical_alternative
  - marker: c
    text: Atau, secara lebih lunak, “bersukaria”; tetapi verba Ibraninya lebih langsung berarti “menjadi mabuk”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: Ia menyuruh agar bagian-bagian makanan ... dibagikan
  rationale: Dalam konteks perjamuan, gabungan verba dan nomina ini mengacu pada tindakan mengirim atau membagikan porsi makanan, bukan sekadar mengangkatnya.
- source_word: מֵאֵת פָּנָיו
  choice: dari hadapannya
  rationale: Mempertahankan gambaran Ibrani secara cukup harfiah; dalam konteks ini bagian makanan itu berasal dari tempat Yusuf sendiri dalam perjamuan.
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: bagian Benyamin
  rationale: Nomina tunggal menunjuk pada porsi makanan yang diberikan kepada Benyamin.
- source_word: מִמַּשְׂאֹת כֻּלָּם
  choice: daripada bagian mereka masing-masing
  rationale: Ungkapan ini membandingkan bagian Benyamin dengan bagian setiap orang lain, bukan dengan jumlah gabungan semua bagian mereka.
- source_word: חָמֵשׁ יָדוֹת
  choice: lima kali lebih banyak
  rationale: Secara harfiah 'lima tangan', suatu idiom ukuran yang menyatakan jumlah lima kali lipat.
- source_word: וַיִּשְׁתּוּ
  choice: mereka minum
  rationale: Padanan langsung dan alami bagi verba naratif yang menyatakan minum dalam perjamuan.
- source_word: וַיִּשְׁכְּרוּ
  choice: menjadi mabuk
  rationale: Verba Ibrani secara langsung menunjuk pada keadaan mabuk; terjemahan tidak melunakkannya menjadi sekadar bersukaria.
- source_word: עִמּוֹ
  choice: bersama dia
  rationale: Mempertahankan pronomina sumber; dalam konteks, acuannya adalah Yusuf.
