source:
  edition: WLC
  text: וַ/יִּפְנ֤וּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יֵּלְכ֖וּ סְדֹ֑מָ/ה וְ/אַ֨בְרָהָ֔ם עוֹדֶ֥/נּוּ עֹמֵ֖ד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: id
  text: Kemudian orang-orang itu berpaling dari sana dan pergi menuju Sodom,[a] sedangkan Abraham masih berdiri di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah kesaksian kuno berbunyi, “dan Yahweh masih berdiri di hadapan Abraham.” Teks Ibrani Masoret berbunyi, “dan Abraham masih berdiri di hadapan Yahweh.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: berpaling
  rationale: Bentuk wayyiqtol dari פנה di sini menyatakan perubahan arah yang mengawali keberangkatan. “Berpaling” alami dalam narasi Indonesia dan tidak merinci gerakan melebihi teks.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Ungkapan lokatif ini secara langsung menunjukkan tempat yang ditinggalkan.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Kata Ibrani ini secara permukaan berarti “orang-orang/laki-laki itu”. Pilihan ini mempertahankan cara narator menyebut para tokoh tanpa memasukkan identitas teologis mereka ke dalam terjemahan.
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: הלך adalah verba umum untuk pergi atau berjalan; “pergi” paling wajar untuk gerak naratif dalam konteks ini.
- source_word: סְדֹמָה
  choice: menuju Sodom
  rationale: Akhiran penunjuk arah -ה pada nama tempat menyatakan gerak ke arah tujuan. “Menuju Sodom” mempertahankan nuansa tersebut.
- source_word: וְ
  choice: sedangkan
  rationale: Konjungsi ini menghubungkan tindakan orang-orang itu dengan keadaan Abraham yang masih berlanjut. “Sedangkan” menyampaikan peralihan subjek dan kontras ringan tanpa membuat pertentangannya terlalu tajam.
- source_word: עוֹדֶנּוּ
  choice: masih
  rationale: Adverbia dengan sufiks pronominal ini menegaskan keberlanjutan keadaan Abraham; “masih” menyatakannya secara alami.
- source_word: עֹמֵד
  choice: berdiri
  rationale: Partisipel ini menggambarkan keadaan atau sikap tubuh yang terus berlangsung dan cocok diterjemahkan “berdiri” setelah “masih”.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Preposisi ini dapat berarti di depan atau dalam kehadiran seseorang. “Di hadapan” mempertahankan daya spatial sekaligus relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi dan merupakan bentuk transliterasi yang lazim dalam kajian modern.
- issue: Bentuk tekstual klausa terakhir
  choice: Abraham masih berdiri di hadapan Yahweh
  alternative: Yahweh masih berdiri di hadapan Abraham
  rationale: Teks Masoret yang diberikan menempatkan Abraham sebagai subjek dan Yahweh sebagai pihak yang di hadapan-Nya Abraham berdiri. Bacaan alternatif yang tercermin dalam sejumlah kesaksian kuno dicatat dalam catatan kaki agar varian tekstual tetap terlihat tanpa menggantikan teks sumber utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan bermartabat. “Orang-orang itu” mempertahankan sebutan permukaan teks, “menuju” mencerminkan penunjuk arah pada nama Sodom, dan “sedangkan” menyampaikan hubungan koordinatif dengan kontras ringan.
