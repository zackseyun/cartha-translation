base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: id
  text: Seandainya jumlah orang benar itu kurang lima orang dari lima puluh, apakah Engkau akan memusnahkan seluruh kota itu karena kurang lima orang? Lalu Dia berkata, “Aku tidak akan memusnahkannya jika Kudapati empat puluh lima orang di sana.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: Seandainya
  rationale: Memperkenalkan pengandaian dalam permohonan Abraham secara alami, tanpa menghilangkan sifat tentatifnya.
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: jumlah lima puluh orang benar itu kurang lima
  rationale: Mempertahankan lima puluh orang benar sebagai kelompok yang jumlahnya berkurang lima, sehingga tidak memberi kesan bahwa lima orang tertentu hilang dari kelompok itu.
- source_word: הַצַּדִּיקִם
  choice: orang benar
  rationale: Padanan baku dan wajar yang mempertahankan bobot moral serta yudisial istilah Ibrani.
- source_word: הֲתַשְׁחִית
  choice: apakah Engkau akan memusnahkan
  rationale: Bentuk Hifil dari שׁחת menyatakan tindakan membinasakan atau memusnahkan; pilihan ini juga menjaga pengulangan verba yang sama dalam jawaban ilahi.
- source_word: בַּחֲמִשָּׁה
  choice: karena kurang lima
  rationale: Preposisi ב menyatakan alasan atau dasar. Penambahan 'kurang' memperjelas bahwa yang dimaksud ialah kekurangan jumlah lima, bukan bahwa lima orang menjadi penyebab kehancuran.
- source_word: אֶת כָּל הָעִיר
  choice: seluruh kota itu
  rationale: Menyampaikan totalitas kota dan memakai penunjuk yang alami dalam konteks Indonesia.
- source_word: לֹא אַשְׁחִית
  choice: Aku tidak akan memusnahkannya
  rationale: Mengulang verba utama dan menambahkan enklitik objek yang jelas merujuk kepada kota.
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: jika Kudapati empat puluh lima orang di sana
  rationale: Mempertahankan struktur syarat dan lokasi; 'orang' dibuat eksplisit secara wajar karena angka itu merujuk kepada orang-orang benar.
theological_decisions:
- issue: Makna צַדִּיקִים
  choice: orang benar
  alternative: orang adil
  rationale: '''Orang benar'' mempertahankan cakupan moral dan yudisial istilah tersebut tanpa mempersempitnya hanya pada keadilan sosial atau hukum.'
- issue: Referen empat puluh lima
  choice: empat puluh lima orang
  alternative: empat puluh lima orang benar
  rationale: Teks Ibrani hanya menyebut angka dalam jawaban, tetapi konteks membuat referen manusianya jelas. 'Orang' ditambahkan demi kelancaran bahasa tanpa mengulang 'benar' yang tersirat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan umum penerjemahan Alkitab bahasa Indonesia. Ungkapan pembuka dibuat jelas namun tetap dekat dengan struktur dan logika teks Ibrani.
