  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Apakah Aku akan menyembunyikan dari Abraham apa yang sedang Kulakukan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan menonjolkan nuansa pertimbangan: “Haruskah Aku menyembunyikan dari Abraham apa yang sedang Kulakukan?” Frasa “apa yang sedang Kulakukan” juga dapat dipahami sebagai “apa yang akan Kulakukan.”'
    reason: Alternatif sintaksis untuk pertanyaan deliberatif Ibrani dan kemungkinan nuansa prospektif partisipel עֹשֶׂה.
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: Lalu Yahweh
  rationale: Konjungsi wayyiqtol melanjutkan alur narasi secara alami dengan “Lalu”, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh” sesuai bentuk yang hadir dalam teks Ibrani.
- source_word: אָמָר
  choice: berfirman
  rationale: Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan wajar dan bermartabat ketika Allah menjadi subjek אָמַר, tanpa mengubah makna dasar ‘berkata’.
- source_word: הַֽ/מְכַסֶּה
  choice: Apakah Aku akan menyembunyikan
  rationale: Partikel tanya dengan partisipel menyampaikan pertanyaan retoris yang bernuansa pertimbangan diri; bentuk “akan menyembunyikan” alami dalam bahasa Indonesia dan menjaga orientasi tindakan yang sedang dipertimbangkan.
- source_word: מֵֽ/אַבְרָהָם
  choice: dari Abraham
  rationale: Preposisi מִן setelah verba ‘menyembunyikan’ secara langsung dan idiomatis diterjemahkan “dari”.
- source_word: אֲשֶׁר
  choice: apa yang
  rationale: Dalam konstruksi ini אֲשֶׁר memperkenalkan hal yang disembunyikan; “apa yang” merupakan padanan Indonesia yang alami.
- source_word: אֲנִי עֹשֶׂה
  choice: yang sedang Kulakukan
  rationale: Terjemahan ini mencerminkan partisipel Ibrani secara dekat sebagai tindakan yang sedang dilakukan, tanpa secara eksplisit menambahkan nuansa ‘sebentar lagi’ yang tidak dinyatakan secara leksikal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehuwa” mencerminkan bentuk pelafalan lain.
- issue: Nuansa temporal אֲנִי עֹשֶׂה
  choice: apa yang sedang Kulakukan
  alternative: apa yang akan Kulakukan; apa yang hendak Kulakukan
  rationale: Partisipel עֹשֶׂה secara formal menunjuk pada tindakan yang berlangsung, walaupun konteks memungkinkan tindakan yang segera akan dilaksanakan. Teks utama mempertahankan bentuk sumber, sementara catatan menjelaskan alternatif kontekstual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Aku” dan bentuk terikat “Ku-” menandai rujukan kepada Allah menurut kebiasaan penulisan Indonesia. Pertanyaan dibuat alami tanpa menghilangkan sifat retoris dan deliberatif teks Ibrani.
