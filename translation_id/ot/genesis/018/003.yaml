id: GEN.18.3
reference: Genesis 18:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: id
  text: Lalu ia berkata, “Tuanku,[a] jika aku mendapat perkenanan di matamu, janganlah kiranya engkau berlalu dari hambamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuhan,” jika sapaan Abraham dipahami ditujukan secara khusus kepada Allah, bukan sebagai sapaan hormat kepada pengunjung itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan perkataan Abraham secara wajar dalam bahasa Indonesia.
- source_word: אֲדֹנָי
  choice: Tuanku
  rationale: Sapaan ini dapat dipahami sebagai sapaan hormat kepada pengunjung maupun sebagai sapaan kepada Tuhan. “Tuanku” mempertahankan nuansa hormat dan tidak langsung menutup ambiguitas kontekstual tersebut.
- source_word: אִם נָא
  choice: jika
  rationale: Partikel kondisional membuka rumusan permohonan yang sopan; nuansa permohonan dari נָא dinyatakan secara alami kemudian melalui kata “kiranya”.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat perkenanan di matamu
  rationale: Ungkapan ini mempertahankan citra idiom Ibrani tentang memperoleh pandangan yang baik, tetapi tetap dapat dipahami oleh pembaca Indonesia modern.
- source_word: אַל נָא
  choice: janganlah kiranya
  rationale: Gabungan larangan dan partikel permohonan diterjemahkan dengan bentuk sopan serta penuh hormat yang wajar dalam bahasa Indonesia.
- source_word: תַעֲבֹר מֵעַל
  choice: engkau berlalu dari
  rationale: Ungkapan ini menyampaikan tindakan meneruskan perjalanan dan meninggalkan orang yang sedang disinggahi, tanpa mempersempit maknanya menjadi sekadar berjalan melewati.
- source_word: עַבְדֶּךָ
  choice: hambamu
  rationale: Dalam konteks ini, kata tersebut merupakan sebutan diri yang merendah di hadapan orang yang dihormati, bukan penegasan status perbudakan.
theological_decisions:
- issue: Apakah אֲדֹנָי merupakan gelar ilahi atau sapaan hormat kepada pengunjung
  choice: Tuanku
  alternative: Tuhan
  rationale: Konteks luas menyatakan bahwa TUHAN menampakkan diri kepada Abraham, tetapi tuturan langsung ini juga dapat dibaca sebagai sapaan kepada seorang pengunjung. Teks utama mempertahankan kemungkinan sapaan hormat, sedangkan pembacaan sebagai sapaan khusus kepada Tuhan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, khidmat, dan mudah dipahami. Bentuk “Tuanku” dan “hambamu” mempertahankan kesantunan serta kerendahan diri dalam adegan penyambutan, sementara “janganlah kiranya” menyampaikan permohonan yang hormat tanpa terasa terlalu sehari-hari.
