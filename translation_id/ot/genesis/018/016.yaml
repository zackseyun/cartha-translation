  text: וַ/יָּקֻ֤מוּ מִ/שָּׁם֙ הָֽ/אֲנָשִׁ֔ים וַ/יַּשְׁקִ֖פוּ עַל פְּנֵ֣י סְדֹ֑ם וְ/אַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖/ם לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: id
  text: Kemudian para pria itu bangkit dari sana dan memandang ke bawah ke arah Sodom[a], dan Abraham berjalan bersama mereka untuk mengantar mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang ke arah Sodom.” Kata kerja Ibrani menyiratkan pandangan dari posisi yang lebih tinggi.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk melepas mereka melanjutkan perjalanan.” Ungkapan Ibrani merujuk pada kebiasaan menyertai tamu yang hendak pergi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangkit
  rationale: Qal wayyiqtol dari קום menyatakan bahwa mereka bangun atau berdiri; 'bangkit' mempertahankan gerak naratif tanpa menafsirkannya langsung sebagai keberangkatan.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan lokatif yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Kata Ibrani ini adalah sebutan biasa bagi manusia laki-laki. Padanan ini mempertahankan penyebutan naratif dan tidak lebih dini mengidentifikasi mereka sebagai malaikat.
- source_word: וַיַּשְׁקִפוּ
  choice: memandang ke bawah
  rationale: Verba שׁקף lazimnya menggambarkan pandangan dari tempat yang tinggi; pilihan ini mempertahankan nuansa topografis yang mungkin dimaksudkan.
- source_word: עַל־פְּנֵי סְדֹם
  choice: ke arah Sodom
  rationale: Ungkapan ini menunjukkan arah pandangan menuju Sodom; unsur ketinggian telah dinyatakan oleh 'ke bawah'.
- source_word: הֹלֵךְ
  choice: berjalan
  rationale: Bentuk partisip menunjukkan tindakan yang sedang berlangsung bersamaan dengan perjalanan mereka.
- source_word: עִמָּם
  choice: bersama mereka
  rationale: Terjemahan langsung dan alami dari preposisi dengan sufiks pronominal.
- source_word: לְשַׁלְּחָם
  choice: untuk mengantar mereka
  rationale: Dalam konteks keramahtamahan, ungkapan ini berarti menyertai tamu yang berangkat dan melepas mereka untuk melanjutkan perjalanan.
theological_decisions:
- issue: Identitas הָאֲנָשִׁים dalam konteks
  choice: orang-orang itu
  alternative: para tamu; para malaikat
  rationale: Ayat ini memakai kata biasa yang berarti orang atau laki-laki dan belum secara eksplisit menyebut mereka malaikat. Terjemahan mempertahankan ketegangan naratif tanpa menyelesaikan identitas mereka secara prematur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Orang-orang itu' dipilih alih-alih 'para malaikat' untuk menjaga penyebutan sumber. Susunan klausa mempertahankan tindakan Abraham yang berlangsung bersama keberangkatan mereka.
