source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל אַבְרָהָ֑ם לָ֣/מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵ/אמֹ֗ר הַ/אַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַ/אֲנִ֥י זָקַֽנְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: id
  text: Lalu TUHAN berfirman kepada Abraham, “Mengapa Sara tertawa dan berkata, ‘Benarkah aku akan melahirkan seorang anak, padahal aku sudah tua?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH, dengan huruf kapital untuk membedakannya dari sebutan umum ‘Tuhan’.
- source_word: לָמָּה זֶּה
  choice: Mengapa
  rationale: Ungkapan tanya ini secara alami berarti ‘mengapa’; unsur זֶּה tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: הַאַף אֻמְנָם
  choice: Benarkah
  rationale: 'Gabungan partikel tanya dan penegas menyatakan pertanyaan bernuansa ketidakpercayaan: ‘benarkah/sungguhkah’. ‘Benarkah’ mempertahankan daya tanya tanpa menambahkan tafsiran.'
- source_word: אֵלֵד
  choice: aku akan melahirkan seorang anak
  rationale: Bentuk verba orang pertama berarti ‘aku akan melahirkan’; ‘seorang anak’ menyatakan objek yang tersirat dan membuat kalimat wajar dalam bahasa Indonesia.
- source_word: וַאֲנִי זָקַנְתִּי
  choice: padahal aku sudah tua
  rationale: Secara harfiah, ‘dan aku telah menjadi tua’. ‘Padahal’ menyampaikan hubungan kontras yang tersirat dan terdengar alami dalam pertanyaan Sara.
theological_decisions:
- issue: Penyajian nama ilahi YHWH
  choice: TUHAN
  alternative: Yahweh
  rationale: ‘TUHAN’ adalah konvensi Indonesia yang luas dikenal dan sesuai dengan lapisan konsultasi Inggris ‘the LORD’; pilihan ini tidak menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Berfirman’ dipakai untuk ujaran ilahi sesuai register Alkitab Indonesia, sedangkan kutipan Sara dibuat alami tanpa menghilangkan nada ketidakpercayaannya.
