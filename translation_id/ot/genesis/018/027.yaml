  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: id
  text: Lalu Abraham menjawab dan berkata, “Sesungguhnya, aku telah memberanikan diri berbicara kepada Tuhanku[a], sekalipun aku ini debu dan abu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tuanku.” Bentuk Ibrani ini dapat menjadi sapaan hormat; di sini ditulis dengan huruf kapital karena konteks sekitarnya mengidentifikasi pihak yang disapa dengan TUHAN.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab dan berkata
  rationale: Mempertahankan pasangan verba naratif Ibrani dan struktur dialognya, meskipun bahasa Indonesia dapat meringkasnya menjadi satu verba.
- source_word: הִנֵּה נָא
  choice: sesungguhnya
  rationale: Dalam konteks permohonan yang penuh hormat, ungkapan ini menarik perhatian dan memberi nuansa kesantunan. 'Sesungguhnya' mempertahankan nada khidmat tanpa memakai seruan harfiah yang terasa janggal dalam bahasa Indonesia modern.
- source_word: הוֹאַלְתִּי
  choice: aku telah memberanikan diri
  rationale: Mengungkapkan tindakan mengambil keberanian atau lancang untuk berbicara, sehingga keberanian Abraham sekaligus kerendahan hatinya tetap terasa.
- source_word: לְדַבֵּר
  choice: berbicara
  rationale: Padanan alami bagi infinitif דבר dalam konteks percakapan.
- source_word: אֶל אֲדֹנָי
  choice: kepada Tuhanku
  rationale: Mempertahankan sufiks orang pertama 'ku'. Kapitalisasi mencerminkan bahwa konteks mengidentifikasi pihak yang disapa dengan TUHAN, sementara catatan kaki menjaga kemungkinan bentuk sapaan hormat biasa.
- source_word: וְאָנֹכִי
  choice: sekalipun aku ini
  rationale: 'Konjungsi secara harfiah berarti ''dan'', tetapi di sini hubungan maknanya bersifat konsesif: Abraham berani berbicara walaupun dirinya hina dan fana.'
- source_word: עָפָר וָאֵפֶר
  choice: debu dan abu
  rationale: Padanan idiomatis yang mempertahankan gambaran kefanaan dan ketidakberartian manusia.
theological_decisions:
- issue: Makna אֲדֹנָי dalam sapaan Abraham
  choice: Tuhanku
  alternative: tuanku
  rationale: Bentuk Ibrani dapat menjadi sapaan hormat kepada manusia, tetapi konteks langsung menggambarkan Abraham berbicara kepada sosok ilahi yang dikaitkan dengan TUHAN. Kapitalisasi menyatakan identifikasi kontekstual itu tanpa mengganti kata sumber dengan nama perjanjian.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk 'aku' sesuai dengan dialog langsung Alkitab dan menampilkan kerendahan hati Abraham; susunan 'menjawab dan berkata' sengaja mempertahankan gaya naratif Ibrani.
