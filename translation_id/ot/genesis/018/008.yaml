  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: id
  text: Kemudian Abraham mengambil dadih[a] dan susu serta anak sapi yang telah disiapkannya, lalu menghidangkannya kepada mereka. Ia berdiri di dekat mereka[b] di bawah pohon itu sementara mereka makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mentega" atau "krim"; kata Ibrani ini menunjuk pada hasil olahan susu yang kental, tetapi jenis tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "berdiri di atas mereka"; dalam konteks ini ungkapan tersebut kemungkinan berarti bahwa Abraham berdiri di dekat mereka untuk melayani mereka sebagai tuan rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: dadih
  rationale: Istilah ini menunjuk pada hasil olahan susu yang kental. Dalam konteks kehidupan penggembala, 'dadih' lebih wajar daripada mentega modern, meskipun arti tepatnya tidak pasti.
- source_word: חָלָב
  choice: susu
  rationale: Padanan langsung dan lazim bagi kata Ibrani untuk susu.
- source_word: וּבֶן הַבָּקָר
  choice: anak sapi
  rationale: Secara harfiah berarti 'anak dari kawanan sapi' dan menunjuk pada sapi muda yang disiapkan dalam ayat sebelumnya.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah disiapkannya
  rationale: Dalam konteks makanan, verba umum 'membuat/melakukan' secara idiomatis berarti menyiapkan hidangan.
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: lalu menghidangkannya kepada mereka
  rationale: Ungkapan harfiahnya, 'menaruh/memberikan di hadapan mereka,' dalam konteks jamuan berarti menyajikan atau menghidangkan makanan.
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: Ia berdiri di dekat mereka
  rationale: Klausa ini menggambarkan Abraham berdiri dekat para tamu untuk melayani mereka; catatan kaki mempertahankan bentuk ungkapan Ibrani yang lebih harfiah.
- source_word: תַּחַת הָעֵץ
  choice: di bawah pohon itu
  rationale: Padanan langsung dan alami; artikel tentu dipertahankan dengan 'itu' karena pohon tersebut telah disebut sebelumnya.
- source_word: וַיֹּאכֵלוּ
  choice: sementara mereka makan
  rationale: Hubungan temporal dengan tindakan Abraham berdiri dinyatakan secara alami dalam bahasa Indonesia tanpa mengubah alur narasi.
theological_decisions:
- issue: Apakah identitas atau status ilahi para pengunjung perlu ditonjolkan dalam terjemahan ayat ini
  choice: Menerjemahkan ayat sebagai kisah keramahtamahan Abraham tanpa menambahkan penafsiran kristologis atau trinitaris
  alternative: Memilih bahasa yang lebih agung untuk mengisyaratkan status ilahi para pengunjung
  rationale: Teks Ibrani ayat ini berfokus pada tindakan Abraham menjamu para pengunjung. Terjemahan tidak semestinya memasukkan kesimpulan teologis yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Nama 'Abraham' ditampilkan untuk memperjelas subjek dalam kutipan ayat tunggal. 'Menghidangkan' dipilih agar idiom penyajian makanan terdengar wajar, sedangkan dua catatan kaki mempertahankan ketidakpastian leksikal dan bentuk ungkapan Ibrani.
