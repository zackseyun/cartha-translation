lexical_decisions:
- source_word: וַיְמַהֵר
  choice: bergegas
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan dengan segera; “bergegas” alami dalam narasi Indonesia dan mempertahankan kesan mendesak.
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: masuk ke dalam kemah menemui Sara
  rationale: Akhiran penunjuk arah pada “kemah” menyatakan gerak menuju kemah, sementara אֶל שָׂרָה menandai Sara sebagai orang yang dituju. Rumusan ini jelas dan alami tanpa menghilangkan kedua unsur tersebut.
- source_word: מַהֲרִי
  choice: Cepat
  rationale: Bentuk perintah feminin tunggal ini ditujukan kepada Sara dan menyampaikan urgensi secara ringkas serta wajar dalam bahasa Indonesia.
- source_word: שְׁלֹשׁ סְאִים
  choice: tiga sea
  rationale: Sea adalah satuan takaran kering kuno yang spesifik. Mempertahankannya menjaga kekonkretan budaya teks sumber; nilainya dijelaskan dalam catatan kaki.
- source_word: קֶמַח סֹלֶת
  choice: tepung terbaik
  rationale: Gabungan ini menunjuk pada tepung bermutu tinggi dan halus. “Tepung terbaik” menyampaikan mutu yang ditekankan tanpa ungkapan Indonesia yang janggal.
- source_word: לוּשִׁי
  choice: remaslah menjadi adonan
  rationale: Kata kerja ini berarti mengadon atau meremas bahan menjadi adonan. Rumusan tersebut lebih mudah dipahami pembaca umum daripada memakai “adonlah” sebagai verba.
- source_word: וַעֲשִׂי עֻגוֹת
  choice: lalu buatlah roti bundar
  rationale: עֻגוֹת merujuk pada roti pipih atau bundar, bukan kue manis dalam pengertian modern. “Roti bundar” mempertahankan bentuk yang tersirat sekaligus menghindari salah pengertian.
