  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: id
  text: Lalu Abraham bergegas masuk ke dalam kemah menemui Sara dan berkata, “Segeralah, uleni tiga sea[a] tepung halus, lalu buatlah roti bundar.”
  philosophy: optimal-equivalence
