revisions:
- from: Lalu Abraham bergegas masuk ke dalam kemah menemui Sara dan berkata, “Cepat, ambillah tiga sea[a] tepung terbaik, remaslah menjadi adonan, lalu buatlah roti bundar.”
  to: Lalu Abraham bergegas masuk ke dalam kemah menemui Sara dan berkata, “Segeralah, uleni tiga sea[a] tepung halus, lalu buatlah roti bundar.”
  rationale: Revisi menghapus verba tambahan “ambillah”, memulihkan perintah eksplisit untuk menguleni, dan memakai “tepung halus” untuk mencerminkan סֹלֶת secara lebih dekat. Susunan naratif, urgensi perintah, nama Sara, satuan sea, dan bentuk roti tetap dipertahankan dalam bahasa Indonesia baku modern.
