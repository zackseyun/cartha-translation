base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: id
  text: Ia kembali berkata[a] kepada-Nya, “Mungkin akan ditemukan empat puluh orang di sana.” Jawab-Nya, “Aku tidak akan melakukannya[b] demi empat puluh orang itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ia berbicara lagi kepada-Nya dan berkata.”'
    reason: Bentuk Ibrani memakai idiom yang menyatakan pengulangan atau kelanjutan berbicara, diikuti verba ‘berkata’.
  - marker: b
    text: Atau, “Aku tidak akan membinasakannya.” Teks Ibrani hanya mengatakan, “Aku tidak akan melakukan,” dengan tindakan yang dimaksud tersirat dari konteks.
    reason: Padanan leksikal alternatif bagi verba eliptis לֹא אֶעֱשֶׂה.
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר ... וַיֹּאמַר
  choice: Ia kembali berkata
  rationale: Gabungan idiom יסף + עוד dengan dua verba ujaran menyatakan bahwa ia berbicara lagi. ‘Kembali berkata’ menyampaikan pengulangan itu secara wajar tanpa menumpuk ‘berbicara’ dan ‘berkata’.
- source_word: אֵלָיו
  choice: kepada-Nya
  rationale: Preposisi אֶל menunjukkan arah perkataan kepada lawan bicara. Kapitalisasi pronomina memperjelas bahwa lawan bicara Abraham adalah TUHAN dalam konteks ini.
- source_word: אוּלַי
  choice: Mungkin
  rationale: אוּלַי memperkenalkan kemungkinan tentatif dalam permohonan Abraham; ‘mungkin’ adalah padanan Indonesia yang alami.
- source_word: יִמָּצְאוּן שָׁם אַרְבָּעִים
  choice: akan ditemukan empat puluh orang di sana
  rationale: Bentuk Nifal dipertahankan sebagai pasif ‘akan ditemukan’. Kata ‘orang’ ditambahkan secara wajar karena bilangan itu merujuk kepada orang-orang benar dalam konteks langsung.
- source_word: לֹא אֶעֱשֶׂה
  choice: Aku tidak akan melakukannya
  rationale: Objek tindakan tetap tidak dirinci, sebagaimana verba Ibrani yang eliptis. Akhiran ‘-nya’ membuat kalimat Indonesia lengkap tanpa menetapkan tindakan itu secara eksplisit sebagai penghancuran.
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: demi empat puluh orang itu
  rationale: בַּעֲבוּר menyatakan alasan yang berpihak kepada mereka; ‘demi’ sesuai dengan konteks syafaat. Artikel Ibrani tercermin dalam ‘orang itu’.
theological_decisions:
- issue: Objek tersirat dari tindakan ilahi dalam לֹא אֶעֱשֶׂה
  choice: Mempertahankan objek secara umum dengan ‘melakukannya’.
  alternative: Aku tidak akan membinasakan kota itu.
  rationale: Teks Ibrani hanya mengatakan ‘Aku tidak akan melakukan’, dengan tindakan yang dipahami dari konteks. Terjemahan utama tidak mempersempit elipsis itu menjadi penghancuran secara eksplisit.
- issue: Identitas para penutur
  choice: Menggunakan kapitalisasi ‘-Nya’ dan ‘Jawab-Nya’ untuk menunjukkan penutur ilahi berdasarkan konteks.
  alternative: Memakai pronomina tanpa kapitalisasi atau menyisipkan nama ‘Abraham’ dan ‘TUHAN’.
  rationale: Konteks percakapan membuat identitas penutur jelas. Kapitalisasi mengikuti kelaziman bahasa Indonesia dan menghindari penambahan nama yang tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ujaran dibuat alami, sedangkan bentuk pasif ‘akan ditemukan’ dan elipsis tindakan ilahi dipertahankan sedekat mungkin dengan teks Ibrani.
