  text: הֲ/יִפָּלֵ֥א מֵ/יְהוָ֖ה דָּבָ֑ר לַ/מּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛י/ךָ כָּ/עֵ֥ת חַיָּ֖ה וּ/לְ/שָׂרָ֥ה בֵֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: id
  text: Adakah sesuatu yang terlalu sulit bagi Yahweh?[a] Pada waktu yang telah ditetapkan, Aku akan kembali kepadamu, pada waktu seperti ini tahun depan[b], dan Sara akan mempunyai seorang anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Adakah sesuatu yang terlalu ajaib bagi Yahweh?” Kata kerja Ibrani dapat menunjuk pada sesuatu yang luar biasa atau yang melampaui kemampuan manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada waktu kehidupan.” Ungkapan Ibrani ini sulit dan tampaknya berarti pada musim yang sama tahun depan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: terlalu sulit
  rationale: Bentuk nifal dari פלא dapat berarti luar biasa, menakjubkan, atau melampaui kemampuan. Dalam pertanyaan retoris ini, “terlalu sulit” menyampaikan gagasan sesuatu yang berada di luar kemampuan tanpa memperkuatnya menjadi “mustahil”.
- source_word: מֵיְהוָה
  choice: bagi Yahweh
  rationale: Dengan פלא, preposisi מִן menyatakan batas kemampuan atau perbandingan. Ungkapan “bagi Yahweh” alami dalam bahasa Indonesia dan mempertahankan nama ilahi yang terdapat dalam teks.
- source_word: דָּבָר
  choice: sesuatu
  rationale: Walaupun dapat berarti perkataan, perkara, atau hal, dalam pertanyaan ini bentuk tak tentu “sesuatu” paling alami dan mempertahankan cakupan maknanya.
- source_word: לַמּוֹעֵד
  choice: Pada waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk pada waktu yang ditentukan atau ditetapkan; pilihan ini jelas dan mempertahankan gagasan tentang saat tertentu.
- source_word: אָשׁוּב אֵלֶיךָ
  choice: Aku akan kembali kepadamu
  rationale: שׁוּב di sini berarti kembali, dan pronomina maskulin tunggal pada אֵלֶיךָ menunjuk kepada Abraham. Huruf kapital pada “Aku” mengikuti kebiasaan ejaan Alkitab Indonesia untuk pembicara ilahi.
- source_word: כָּעֵת חַיָּה
  choice: kira-kira pada waktu seperti ini tahun depan
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan “waktu kehidupan,” tetapi dalam konteks menunjuk pada musim yang sama pada tahun berikutnya. Terjemahan idiomatis ini jelas sambil menandai perkiraannya.
- source_word: וּלְשָׂרָה בֵן
  choice: dan Sara akan mempunyai seorang anak laki-laki
  rationale: Klausa Ibrani tidak memiliki verba tersurat, tetapi konteks janji menuntut makna futur. “Mempunyai seorang anak laki-laki” menyampaikan konstruksi posesif tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya pertanyaan retoris
  choice: Adakah sesuatu yang terlalu sulit bagi Yahweh?
  alternative: Adakah sesuatu yang terlalu ajaib bagi Yahweh?; Adakah sesuatu yang mustahil bagi Yahweh?
  rationale: Pilihan ini menekankan kemampuan Yahweh untuk memenuhi janji, sambil mempertahankan rentang makna פלא dan tidak memperkuatnya menjadi pernyataan filosofis dengan kata “mustahil”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Susunan pertanyaan dibuat alami, sedangkan ketegangan leksikal pada פלא dan kejanggalan idiom כָּעֵת חַיָּה dipertahankan melalui catatan kaki.
