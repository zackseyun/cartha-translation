- from: Aku akan turun sekarang dan melihat apakah mereka telah bertindak sepenuhnya sesuai dengan jeritan tentang kota itu yang telah sampai kepada-Ku[a]. Jika tidak, Aku akan mengetahuinya.[b]
  to: Aku akan turun sekarang dan melihat apakah mereka telah berbuat sepenuhnya sesuai dengan jeritan yang telah sampai kepada-Ku[a]. Jika tidak, Aku akan tahu.[b]
  rationale: Revisi mempertahankan ketegangan antropomorfis—Allah turun, melihat, lalu tahu—serta kekaburan konstruksi “jeritan” dalam bahasa Ibrani. Kata “berbuat” lebih dekat dengan verba עשׂו, sedangkan penghapusan “tentang kota itu” dan “-nya” menghindari penambahan yang tidak dinyatakan dalam ayat. Catatan kaki a diperbaiki agar menjelaskan kesulitan idiom tanpa mengunci satu penafsiran.
