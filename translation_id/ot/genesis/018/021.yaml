  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: id
  text: Aku akan turun sekarang dan melihat apakah mereka telah berbuat sepenuhnya sesuai dengan jeritan yang telah sampai kepada-Ku[a]. Jika tidak, Aku akan tahu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah mereka telah melakukan semuanya sesuai dengan jeritan yang telah sampai kepada-Ku.” Ungkapan Ibrani dengan kata “berbuat/melakukan” dan “sepenuhnya” sukar; ungkapan ini dapat menyatakan apakah perbuatan mereka sepenuhnya sesuai dengan jeritan yang dilaporkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan jika tidak, Aku akan tahu.”
    reason: literal_rendering
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: Aku akan turun sekarang
  rationale: Bentuk kohortatif menyatakan tekad atau maksud sang pembicara, sedangkan נָא di sini menandai kesegeraan, bukan permohonan sopan kepada pihak lain.
- source_word: וְאֶרְאֶה
  choice: dan melihat
  rationale: Kata ראה dalam konteks ini berarti melihat dengan tujuan memeriksa atau memastikan. Pilihan ini mempertahankan ungkapan antropomorfis Ibrani tanpa mempersempitnya menjadi istilah penafsiran seperti 'menyelidiki'.
- source_word: הַכְּצַעֲקָתָהּ
  choice: sesuai dengan jeritan tentang kota itu
  rationale: צעקה adalah jeritan yang timbul karena penderitaan atau ketidakadilan berat. Sufiks feminin tunggal merujuk pada kota atau daerah yang sedang dibicarakan; dalam bahasa Indonesia, 'tentang kota itu' lebih jelas daripada bentuk harfiah 'jeritannya' tanpa menetapkan secara berlebihan siapa yang menjerit.
- source_word: הַבָּאָה אֵלַי
  choice: yang telah sampai kepada-Ku
  rationale: Frasa partisipial ini menerangkan 'jeritan' dan secara alami dinyatakan sebagai klausa relatif dalam bahasa Indonesia.
- source_word: עָשׂוּ כָּלָה
  choice: mereka telah bertindak sepenuhnya
  rationale: Ungkapan Ibrani ini sulit dan menyatakan bahwa tindakan mereka mungkin sepenuhnya sesuai dengan jeritan yang terdengar. 'Bertindak sepenuhnya' menjaga gagasan kelengkapan tanpa menambahkan rincian kejahatan yang tidak dinyatakan dalam ayat.
- source_word: וְאִם לֹא אֵדָעָה
  choice: Jika tidak, Aku akan mengetahuinya
  rationale: Terjemahan ini mempertahankan struktur syarat dan bentuk kohortatif penutup. Akhiran '-nya' membuat objek pengetahuan tersirat menjadi wajar dalam bahasa Indonesia tanpa menjelaskan lebih dari teks.
theological_decisions:
- issue: Penggambaran Allah turun, melihat, dan kemudian mengetahui
  choice: Mempertahankan bahasa naratif bahwa Allah akan 'turun', 'melihat', dan 'mengetahuinya'.
  alternative: Memparafrasakannya sebagai 'Aku akan menyelidiki dan menghakimi' untuk menghindari kesan antropomorfis.
  rationale: Teks Ibrani dengan sengaja menggambarkan tindakan Allah memakai bahasa yang menyerupai tindakan manusia. Terjemahan tidak seharusnya menghapus ketegangan ini dengan memasukkan penjelasan doktrinal tentang kemahatahuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan gaya naratif dan antropomorfisme teks sumber, sementara catatan kaki menjelaskan ungkapan Ibrani yang sukar.
