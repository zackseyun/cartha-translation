  yaml_path: translation/ot/genesis/018/011.yaml
  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: id
  text: Abraham dan Sara sudah tua, lanjut usia; Sara sudah tidak lagi mengalami apa yang biasa dialami perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jalan perempuan”, sebuah ungkapan halus yang berarti bahwa Sara sudah tidak mengalami menstruasi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְקֵנִים
  choice: sudah tua
  rationale: Adjektiva ini menyatakan usia lanjut. "Sudah tua" alami dalam bahasa Indonesia modern dan selaras dengan ungkapan berikutnya.
- source_word: בָּאִים בַּיָּמִים
  choice: lanjut usia
  rationale: Ungkapan Ibrani yang secara harfiah berarti "masuk dalam hari-hari" menunjuk pada usia yang telah lanjut. "Lanjut usia" menyampaikan maknanya secara wajar tanpa pengulangan yang kaku.
- source_word: חָדַל לִהְיוֹת
  choice: sudah tidak lagi mengalami
  rationale: חָדַל berarti berhenti atau tidak lagi berlangsung. Dalam susunan idiom ini, "sudah tidak lagi mengalami" menghasilkan kalimat Indonesia yang alami.
- source_word: אֹרַח כַּנָּשִׁים
  choice: apa yang biasa dialami perempuan
  rationale: Secara harfiah, frasa ini berarti "jalan/kebiasaan perempuan" dan merupakan ungkapan halus mengenai menstruasi. Terjemahan ini mempertahankan kesantunan ungkapan sambil tetap dapat dipahami.
- source_word: לְשָׂרָה
  choice: Sara ... mengalami
  rationale: Preposisi ל menandai hubungan dengan Sara. Struktur kalimat diubah secara wajar dalam bahasa Indonesia sehingga Sara menjadi subjek dari pengalaman tersebut.
