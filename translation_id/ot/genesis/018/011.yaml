  terminology: Nama Abraham dan Sara konsisten dengan penggunaan Indonesia modern. Istilah “menstruasi” pada catatan kaki akurat secara medis dan sesuai untuk menjelaskan idiom, sedangkan teks utama tetap menggunakan register yang santun.
