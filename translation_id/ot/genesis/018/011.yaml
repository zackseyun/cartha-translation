  source_fidelity: Terjemahan mempertahankan dua penegasan usia dalam זְקֵנִים dan בָּאִים בַּיָּמִים. Klausa terakhir dengan tepat menyampaikan bahwa kondisi yang lazim bagi perempuan—idiom Ibrani untuk menstruasi—tidak lagi terjadi pada Sara. Nuansa eufemistis sumber dipertahankan dalam teks dan diperjelas secara tepat dalam catatan kaki.
