base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: id
  text: Lalu mereka berkata kepadanya, “Di mana Sara, istrimu?” Jawabnya, “Dia ada di dalam kemah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa; “lalu” menyampaikan urutan naratif secara wajar dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan akhiran orang ketiga tunggal maskulin menunjukkan bahwa perkataan itu ditujukan kepada Abraham.
- source_word: אַיֵּה
  choice: Di mana
  rationale: Kata tanya ini menanyakan lokasi; bentuk ini merupakan padanan alami dalam bahasa Indonesia.
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: Sara, istrimu
  rationale: Nama diri ditransliterasikan sebagai “Sara”, sedangkan אִשְׁתֶּךָ berarti “istrimu” dengan lawan bicara laki-laki tunggal.
- source_word: וַיֹּאמֶר
  choice: Jawabnya
  rationale: Walaupun secara bentuk berarti “dan ia berkata”, konteks pertanyaan membuat “jawabnya” menjadi ungkapan Indonesia yang alami tanpa mengubah fungsi tuturan.
- source_word: הִנֵּה בָאֹהֶל
  choice: Dia ada di dalam kemah
  rationale: הִנֵּה bersifat presentatif atau penunjuk, dan בָאֹהֶל berarti “di dalam kemah”. Dalam jawaban lokasi ini, ungkapan lengkap tersebut menyampaikan maksudnya secara alami; subjek dan kopula yang tersirat dalam bahasa Ibrani dinyatakan demi kejelasan bahasa Indonesia.
