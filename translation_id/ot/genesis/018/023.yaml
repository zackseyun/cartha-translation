  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: id
  text: Lalu Abraham mendekat dan berkata, “Apakah Engkau benar-benar akan melenyapkan[a] orang benar bersama orang fasik?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membinasakan” atau “menghabisi”; kata kerja Ibrani ini menggambarkan penyingkiran dalam penghukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: mendekat
  rationale: Kata נגשׁ menyatakan gerak mendekat, baik secara fisik maupun sebagai langkah retoris Abraham untuk menyampaikan permohonannya.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַיֹּאמַר
  choice: berkata
  rationale: Padanan naratif yang alami untuk verba umum אמר.
- source_word: הַאַף
  choice: benar-benar
  rationale: Gabungan partikel tanya dan אַף memperkuat pertanyaan Abraham; 'benar-benar' menyampaikan keheranan dan desakan itu secara alami.
- source_word: תִּסְפֶּה
  choice: melenyapkan
  rationale: Verba ספה di sini menunjuk pada penyingkiran dalam penghukuman. 'Melenyapkan' mempertahankan bobot tindakan tanpa menetapkan gambaran yang terlalu spesifik.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Bentuk tunggal ini dipakai secara generik sebagai kategori moral; 'orang benar' merupakan ungkapan Indonesia yang alami dan selaras dengan bentuk sumber.
- source_word: עִם
  choice: bersama
  rationale: Menunjukkan bahwa orang benar akan mengalami nasib yang sama dengan orang fasik dalam penghukuman yang dipertanyakan.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: Bentuk tunggal generik ini menjadi lawan moral dari 'orang benar'; 'orang fasik' mempertahankan kategori etis yang kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Kategori moral dalam bentuk tunggal generik
  choice: Memakai 'orang benar' dan 'orang fasik' sebagai bentuk tunggal generik.
  alternative: Memakai bentuk jamak 'orang-orang benar' dan 'orang-orang fasik'.
  rationale: Teks Ibrani memakai bentuk tunggal untuk menyatakan prinsip umum tentang keadilan ilahi. Bentuk tunggal Indonesia mempertahankan bentuk dan daya representatif sumber tanpa membatasinya hanya pada dua individu tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' digunakan untuk Allah sesuai konteks langsung, sedangkan susunan pertanyaan dibuat alami tanpa menghilangkan tekanan retoris teks Ibrani.
