  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: id
  text: Lalu Abraham berkata, “Janganlah kiranya Tuhanku[a] murka; biarlah aku berbicara. Barangkali akan ditemukan tiga puluh orang di sana.” Dia menjawab, “Aku tidak akan melakukannya jika Aku menemukan tiga puluh orang di sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tuanku.” Gelar Ibrani ini dapat dibaca sebagai sapaan hormat; di sini ditulis “Tuhanku” karena dalam konteksnya pihak yang disapa dipahami sebagai Tuhan.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: Janganlah kiranya ... murka
  rationale: Ungkapan ini memadukan larangan, partikel permohonan נָא, dan idiom חרה tentang murka. Bentuk tersebut menjaga nada hormat dan memohon dalam bahasa Indonesia yang wajar serta bermartabat.
- source_word: לַאדֹנָי
  choice: Tuhanku
  rationale: Bentuk ini adalah gelar אֲדֹנָי dengan sufiks orang pertama tunggal. Dalam konteks ini Abraham berbicara kepada sosok ilahi; 'Tuhanku' mempertahankan gelar penghormatan tanpa menggantinya dengan nama perjanjian.
- source_word: וַאֲדַבֵּרָה
  choice: dan izinkanlah aku berbicara
  rationale: Bentuk kohortatif menyatakan maksud sekaligus permohonan Abraham untuk melanjutkan bicara. 'Izinkanlah aku berbicara' menyampaikan nuansa deferensial itu secara alami.
- source_word: אוּלַי
  choice: Bagaimana jika
  rationale: אוּלַי menandai kemungkinan tentatif. Dalam rangkaian tawar-menawar yang sopan ini, 'Bagaimana jika' lebih alami daripada konstruksi pasif dengan 'barangkali' tanpa menghilangkan ketidakpastian.
- source_word: יִמָּצְאוּן
  choice: ditemukan
  rationale: Bentuk Nifal dari מצא bersifat pasif di sini; 'ditemukan' mempertahankan bentuk dan makna hipotesisnya.
- source_word: שְׁלֹשִׁים
  choice: tiga puluh orang
  rationale: Teks hanya menyebut bilangan, tetapi yang dihitung jelas manusia dalam konteks. Penambahan penggolong 'orang' diperlukan agar bahasa Indonesia alami dan tidak mengubah referennya.
- source_word: לֹא אֶעֱשֶׂה
  choice: Aku tidak akan melakukannya
  rationale: Objek tindakan tersirat dari konteks, yaitu penghukuman atau pemusnahan kota. Pronomina '-nya' mempertahankan keringkasan sambil membuat kalimat Indonesia lengkap.
- source_word: אִם אֶמְצָא
  choice: jika Aku menemukan
  rationale: Konstruksi syarat diterjemahkan langsung. Huruf kapital pada 'Aku' mengikuti rujukan kepada pembicara ilahi dalam konteks Indonesia.
theological_decisions:
- issue: Rujukan gelar אֲדֹנָי dalam sapaan Abraham
  choice: Tuhanku
  alternative: tuanku
  rationale: Konteks teofani menunjukkan bahwa Abraham menyapa lawan bicara ilahi. Namun bentuk Ibrani tetap berupa gelar yang secara leksikal juga dapat menjadi sapaan hormat kepada seorang tuan; kemungkinan itu dicatat dalam catatan kaki.
- issue: Isi tindakan dalam לֹא אֶעֱשֶׂה
  choice: tidak akan melakukannya
  alternative: tidak akan membinasakannya
  rationale: Bahasa Ibrani tidak menyebut objek atau tindakan secara eksplisit. Terjemahan tidak mempersempitnya menjadi 'membinasakan' agar ketegangan dan keringkasan sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan naratif. Nama 'Abraham' dinyatakan untuk memperjelas pergantian pembicara yang dalam bahasa Ibrani hanya memakai pronomina. Bentuk 'Dia' dan 'Aku' pada jawaban memakai kapital karena merujuk kepada pihak ilahi.
