  terminology: “Tuhanku” sesuai dengan pembacaan ilahi dalam konteks dan catatan kaki secara tepat mempertahankan kemungkinan sapaan “tuanku”. Kapitalisasi “Dia” dan “Aku” konsisten dengan rujukan ilahi yang dipahami dalam konteks. “Melakukannya” dengan tepat tidak mempersempit objek implisit Ibrani.
