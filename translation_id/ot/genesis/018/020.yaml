base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Jeritan terhadap Sodom dan Gomora[a] sangat besar, dan dosa mereka sangat berat[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Jeritan Sodom dan Gomora.” Dalam konteks ini, jeritan tersebut dipahami sebagai jeritan yang timbul karena kejahatan mereka.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai secara harfiah berarti “sangat berat”, suatu ungkapan yang menyatakan bahwa dosa mereka sangat serius.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. “Lalu” menyatakan urutan secara alami, sedangkan “berfirman” merupakan pilihan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: זַעֲקַת
  choice: Jeritan terhadap
  rationale: זַעֲקָה menunjuk pada jeritan atau seruan keras yang timbul karena kejahatan atau penindasan. “Terhadap” mengungkapkan pemahaman kontekstual bahwa jeritan itu berkaitan dengan tuduhan terhadap Sodom dan Gomora, sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom dan Gomora
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: כִּי רָבָּה
  choice: sangat besar
  rationale: רָבָּה menggambarkan besarnya jeritan tersebut. “Sangat besar” alami dalam bahasa Indonesia dan mempertahankan intensitas klausa.
- source_word: וְחַטָּאתָם
  choice: dan dosa mereka
  rationale: חַטָּאת berarti “dosa” dalam konteks ini; bentuk tunggal dengan akhiran jamak dipertahankan sebagai pengertian kolektif, “dosa mereka”.
- source_word: כִּי כָבְדָה מְאֹד
  choice: sangat berat
  rationale: כבד secara harfiah berarti “berat” dan secara idiomatis menyatakan tingkat keseriusan moral yang besar. Ungkapan “dosa ... sangat berat” dapat dipahami secara alami dalam bahasa Indonesia sekaligus mempertahankan metafora Ibraninya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Arah jeritan yang disebut dalam זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: Jeritan terhadap Sodom dan Gomora
  alternative: Jeritan Sodom dan Gomora
  rationale: Konteks mendukung pemahaman bahwa jeritan muncul karena kejahatan kota-kota itu, tetapi konstruksi genitif Ibrani sendiri dapat diterjemahkan secara lebih harfiah sebagai “jeritan Sodom dan Gomora”. Ambiguitas bentuk tersebut dicatat, bukan disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan metafora “berat” dipertahankan karena tetap jelas dalam bahasa Indonesia. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
