translation:
  language: id
  text: Biarlah sedikit air dibawakan, lalu basuhlah kaki kalian dan beristirahatlah di bawah pohon itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersandarlah” atau “berbaringlah di bawah pohon itu.” Kata Ibrani ini secara lebih harfiah berarti bersandar atau merebahkan diri; dalam konteks ini, maknanya adalah beristirahat di tempat teduh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: Tolong ambilkan
  rationale: Bentuk pasif-yusif disertai partikel permohonan menyatakan permintaan sopan agar air diambil atau dibawakan. Dalam bahasa Indonesia, 'tolong ambilkan' paling alami dan tetap menunjukkan bahwa tindakan itu dilakukan bagi para tamu.
- source_word: מְעַט מַיִם
  choice: sedikit air
  rationale: Mempertahankan arti jumlah kecil dan kerendahan hati dalam tawaran Abraham.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: supaya kalian dapat membasuh kaki
  rationale: Imperatif jamak ditujukan kepada para tamu. Hubungan tujuan setelah air diambil dinyatakan secara alami dengan 'supaya'; 'membasuh' sesuai dengan praktik keramahan berupa pembasuhan kaki.
- source_word: וְהִשָּׁעֲנוּ
  choice: lalu beristirahatlah
  rationale: Secara lebih harfiah verba ini berarti bersandar atau merebahkan diri. Dalam konteks menerima tamu di bawah pohon, 'beristirahatlah' menyampaikan maksudnya dengan wajar tanpa menghapus alternatif leksikal.
- source_word: תַּחַת הָעֵץ
  choice: di bawah pohon ini
  rationale: Artikel tentu menunjuk pada pohon tertentu yang hadir dalam situasi tutur; bahasa Indonesia secara alami dapat menyatakannya dengan 'pohon ini'.
