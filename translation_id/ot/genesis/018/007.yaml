  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: id
  text: Lalu Abraham berlari ke kawanan sapi, mengambil seekor anak lembu yang empuk dan baik, lalu menyerahkannya kepada pemuda itu[a]. Pemuda itu segera menyiapkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan itu” atau “anak laki-laki itu”. Kata Ibrani הַנַּעַר dapat menunjuk pada seorang yang masih muda atau seorang pelayan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: kawanan ternak
  rationale: Kata בָּקָר menunjuk secara kolektif pada ternak sapi; frasa ini alami dalam bahasa Indonesia dan menunjukkan tempat Abraham memilih seekor hewan.
- source_word: רָץ
  choice: berlari
  rationale: Makna langsung verba ini adalah berlari, sehingga kegesitan Abraham dalam menyambut tamu tetap terasa.
- source_word: בֶּן־בָּקָר
  choice: seekor anak lembu
  rationale: Ungkapan Ibrani ini secara idiomatis menunjuk pada sapi muda; 'anak lembu' jelas dan sesuai dengan konteks hidangan.
- source_word: רַךְ וָטוֹב
  choice: yang empuk dan baik
  rationale: רַךְ berarti empuk atau lembut, sedangkan טוֹב di sini menyatakan mutu. Terjemahan ini dekat dengan bentuk Ibrani tanpa mempersempit maknanya menjadi 'pilihan'.
- source_word: הַנַּעַר
  choice: orang muda itu
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. 'Orang muda itu' mempertahankan makna leksikal yang relatif netral tanpa menetapkan bahwa ia seorang pelayan.
- source_word: וַיְמַהֵר
  choice: segera
  rationale: Verba ini menyatakan tindakan yang dilakukan dengan cepat. Dalam susunan Indonesia, 'segera mengolahnya' menyampaikan urgensi secara alami.
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: mengolahnya
  rationale: Dalam konteks menyiapkan hewan sebagai hidangan, עשה berarti menangani atau menyiapkannya. 'Mengolahnya' lebih spesifik daripada 'membuatnya' dan tetap tidak merinci langkah yang tidak disebut teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lugas dan bermartabat. Subjek pada kalimat terakhir dinyatakan ulang sebagai 'orang muda itu' karena pronomina maskulin tunggal Ibrani paling wajar merujuk kepada orang muda tersebut, sekaligus menghindari ambiguitas pronomina 'ia' dalam bahasa Indonesia.
