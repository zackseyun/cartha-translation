  to: 'Ia mengangkat pandangannya dan melihat: tampak tiga orang laki-laki berdiri di dekatnya.[a] Ketika melihat mereka, ia berlari dari pintu kemah untuk menyongsong mereka, lalu sujud sampai ke tanah.[b]'
  rationale: 'Revisi terbatas pada dua hal: penandaan eksplisit ‘laki-laki’ untuk אֲנָשִׁים dan penggantian ungkapan gestur dengan “sujud sampai ke tanah,” yang lebih tepat bagi וַיִּשְׁתַּחוּ אָרְצָה. “Tampak” tetap menyampaikan daya presentatif וְהִנֵּה, “di dekatnya” menjaga keluasan עָלָיו, dan “menyongsong” mempertahankan gerak Abraham untuk menemui mereka. Catatan kaki b diperbarui agar alternatifnya benar-benar berbeda dari teks utama sambil tidak menentukan apakah tindakan itu merupakan ibadah.'
