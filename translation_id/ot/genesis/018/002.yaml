    rationale: Walaupun “orang” alami dalam bahasa Indonesia, teks Ibrani secara eksplisit memperkenalkan tiga pengunjung sebagai ‘men/laki-laki’. Penandaan ini dapat dipertahankan secara alami dengan “tiga orang laki-laki.”
