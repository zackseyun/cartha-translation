base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: id
  text: 'Ia mengangkat pandangannya dan melihat: tampak tiga orang laki-laki berdiri di dekatnya.[a] Ketika melihat mereka, ia berlari dari pintu kemah untuk menyongsong mereka, lalu sujud sampai ke tanah.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiri di sisinya”; preposisi Ibrani dapat menunjukkan jarak yang sangat dekat.
    reason: lexical_alternative
  - marker: b
    text: Atau “membungkukkan diri sampai ke tanah.” Kata kerja Ibrani menggambarkan sikap merendahkan diri sebagai penghormatan dan tidak dengan sendirinya berarti “menyembah.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ia mengangkat pandangannya
  rationale: Mempertahankan gambaran idiom Ibrani tentang mengangkat mata, tetapi memakai ungkapan Indonesia yang lebih alami daripada terjemahan harfiah 'mengangkat matanya'.
- source_word: וַיַּרְא
  choice: dan melihat / Ketika melihat mereka
  rationale: Kemunculan pertama mempertahankan urutan tindakan, sedangkan kemunculan kedua dirangkai secara temporal agar narasi Indonesia mengalir alami tanpa menghilangkan pengulangan tindakan melihat.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Menyampaikan penanda penyajian yang hidup dalam bahasa Indonesia modern tanpa memakai bentuk arkais 'lihatlah' yang dapat terdengar sebagai perintah.
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: tiga orang
  rationale: Dalam konteks Indonesia, 'tiga orang' secara wajar merujuk kepada tiga laki-laki yang tampil sebagai manusia; pilihan ini alami dan tidak mengubah identitas naratif mereka.
- source_word: נִצָּבִים עָלָיו
  choice: berdiri di dekatnya
  rationale: Preposisi Ibrani dapat menunjukkan kedekatan atau posisi di sisinya. 'Di dekatnya' paling alami dan menghindari kesan bahwa mereka menjulang tepat di atas Abraham.
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: ia berlari ... untuk menyongsong mereka
  rationale: Kata kerja sumber secara konkret berarti berlari; 'menyongsong' menyatakan gerak keluar untuk menemui orang yang datang.
- source_word: מִפֶּתַח הָאֹהֶל
  choice: dari pintu kemah
  rationale: '''Pintu kemah'' adalah ungkapan Indonesia yang ringkas dan lazim untuk bukaan atau jalan masuk kemah.'
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: membungkukkan diri sampai ke tanah
  rationale: Menggambarkan penghormatan jasmani yang sangat dalam tanpa dengan sendirinya menafsirkannya sebagai penyembahan.
theological_decisions:
- issue: Apakah tindakan Abraham harus diterjemahkan sebagai penyembahan kepada sosok ilahi
  choice: membungkukkan diri sampai ke tanah
  alternative: menyembah; bersujud ke tanah
  rationale: Kata kerja Ibrani dapat dipakai untuk penghormatan mendalam kepada manusia maupun penyembahan kepada Allah. Ayat ini masih menampilkan para pengunjung sebagai 'tiga orang', sehingga terjemahan tidak mendahului narasi dengan menetapkan identitas atau makna teologis tindakan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Tanda pisah mempertahankan daya hidup וְהִנֵּה, sedangkan istilah yang dapat menutup ambiguitas teologis dihindari.
