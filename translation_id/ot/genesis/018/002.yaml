  terminology: “Tiga orang laki-laki” mempertahankan penandaan gender sumber tanpa menetapkan identitas mereka. “Sujud sampai ke tanah” menerjemahkan gestur penghormatan mendalam tanpa memaksakan arti ‘menyembah’; catatan kaki mempertahankan ambiguitas teologis itu.
