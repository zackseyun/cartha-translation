  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: id
  text: Lalu ia berkata, “Aku pasti akan kembali kepadamu kira-kira pada waktu seperti ini tahun depan,[a] dan lihatlah, Sara, istrimu, akan mempunyai seorang anak laki-laki.” Saat itu Sara sedang mendengarkan di pintu masuk kemah, dan kemah itu berada di belakangnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara idiomatis berarti kira-kira pada waktu yang sama tahun depan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan itu berada di belakangnya.” Kata “itu” kemungkinan merujuk kepada kemah; teks Ibrani tidak secara eksplisit menyebut siapa yang dimaksud oleh “-nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung; pronomina tetap tidak mengidentifikasi pembicara secara lebih khusus daripada teks Ibrani.
- source_word: שׁוֹב אָשׁוּב
  choice: Aku pasti akan kembali
  rationale: Infinitif absolut yang diikuti bentuk imperfek dari akar yang sama memberi penegasan; 'pasti' menyampaikan daya emfatisnya secara alami.
- source_word: כָּעֵת חַיָּה
  choice: kira-kira pada waktu seperti ini tahun depan
  rationale: Ungkapan ini secara kontekstual menunjuk pada waktu atau musim yang sama pada tahun berikutnya; terjemahan idiomatis dipakai tanpa menghilangkan ketidakharfiahan ungkapan sumber.
- source_word: וְהִנֵּה
  choice: dan lihatlah
  rationale: Mempertahankan fungsi partikel yang mengarahkan perhatian dalam suatu pengumuman penting, dengan ungkapan Indonesia yang mudah dipahami.
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: Sara, istrimu, akan mempunyai seorang anak laki-laki
  rationale: Konstruksi dengan ל menyatakan bahwa seorang anak laki-laki akan menjadi milik atau diberikan kepada Sara; susunan ini alami dalam bahasa Indonesia.
- source_word: שָׂרָה שֹׁמַעַת
  choice: Saat itu Sara sedang mendengarkan
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung dalam latar adegan.
- source_word: פֶּתַח הָאֹהֶל
  choice: di pintu masuk kemah
  rationale: Menyampaikan lokasi pada bukaan atau jalan masuk kemah secara jelas dan wajar.
- source_word: וְהוּא אַחֲרָיו
  choice: yang berada di belakangnya
  rationale: Pronomina maskulin tunggal kemungkinan merujuk kepada pintu masuk kemah, sementara sufiks merujuk kepada pembicara; bentuk Indonesia ini menyampaikan hubungan ruang tanpa menciptakan tokoh laki-laki tambahan.
theological_decisions:
- issue: Identitas pembicara
  choice: ia
  alternative: TUHAN; salah seorang dari ketiga orang itu
  rationale: Ayat ini memakai verba orang ketiga maskulin tunggal tanpa menyebut ulang identitas pembicara. Terjemahan tidak menambahkan identifikasi yang berasal dari penafsiran konteks lebih luas.
- issue: Anteseden pronomina dalam וְהוּא אַחֲרָיו
  choice: pintu masuk kemah berada di belakang pembicara
  alternative: Sara berada di belakang pembicara; seorang laki-laki berada di belakangnya
  rationale: Bentuk Ibrani ringkas dan secara gramatikal menyisakan ambiguitas tertentu. Bacaan spasial ini paling masuk akal dalam konteks, tetapi alternatif dicatat agar ketegangan teks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. 'Ia' mempertahankan ketidakspesifikan subjek; 'lihatlah' mempertahankan penanda perhatian Ibrani. Semua penjelasan yang diperlukan ditempatkan dalam catatan kaki dan penandanya hadir dalam teks.
