revisions:
- from: Lalu ia berkata, “Aku pasti akan kembali kepadamu kira-kira pada waktu seperti ini tahun depan,[a] dan lihatlah, Sara, istrimu, akan mempunyai seorang anak laki-laki.” Saat itu Sara sedang mendengarkan di pintu masuk kemah yang berada di belakangnya.[b]
  to: Lalu ia berkata, “Aku pasti akan kembali kepadamu kira-kira pada waktu seperti ini tahun depan,[a] dan lihatlah, Sara, istrimu, akan mempunyai seorang anak laki-laki.” Saat itu Sara sedang mendengarkan di pintu masuk kemah, dan kemah itu berada di belakangnya.[b]
  rationale: Revisi mempertahankan penegasan "pasti", waktu relatif yang idiomatis, dan ketidakspesifikan identitas pembicara. Klausa terakhir direvisi agar selaras dengan gender gramatikal kata "kemah" dalam Ibrani serta agar tidak menambahkan keputusan mengenai identitas orang yang dirujuk oleh sufiks. Kedua catatan kaki tetap berjangkar pada penanda yang ada dan menjelaskan kesulitan tekstual tanpa mengatasinya secara dogmatis.
