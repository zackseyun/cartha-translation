base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: id
  text: Tidak mungkin Engkau melakukan hal seperti itu—membunuh orang benar bersama orang fasik, sehingga orang benar diperlakukan sama dengan orang fasik. Tidak mungkin! Masakan Hakim seluruh bumi tidak menegakkan keadilan?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: Pantang bagi-Mu
  rationale: Ungkapan ini menyatakan penolakan atau kengerian yang sangat kuat. “Pantang bagi-Mu” alami dan bermartabat dalam bahasa Indonesia serta mempertahankan daya retoris seruan Ibrani.
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: melakukan hal seperti itu
  rationale: Mengungkapkan larangan keras terhadap tindakan yang baru disebutkan secara wajar dalam bahasa Indonesia.
- source_word: לְהָמִית
  choice: membunuh
  rationale: Bentuk kausatif dari מות berarti menyebabkan mati. Dalam konteks ini, “membunuh” menyampaikan tindakan tersebut secara lugas dan alami.
- source_word: צַדִּיק
  choice: orang benar
  rationale: Mempertahankan makna moral-yudisial dan kontras langsung dengan רָשָׁע.
- source_word: עִם רָשָׁע
  choice: bersama orang fasik
  rationale: Bentuk tunggal Ibrani bersifat generik; bentuk tunggal Indonesia juga dapat menyatakan golongan dan menjaga kesejajaran dengan “orang benar”.
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: sehingga orang benar diperlakukan sama dengan orang fasik
  rationale: Dalam konteks pembinasaan tanpa pembedaan, perbandingan ini menyatakan bahwa keduanya mendapat perlakuan atau nasib yang sama. Rumusan ini memperjelas implikasi kontekstual tanpa menghapus kontras moral.
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: Masakan Hakim seluruh bumi
  rationale: Partisipel dipakai secara substantival sebagai gelar bagi Allah; “Masakan” mempertahankan pertanyaan retoris yang mengharapkan jawaban tegas bahwa Ia tentu bertindak adil.
- source_word: מִשְׁפָּט
  choice: menegakkan keadilan
  rationale: Dalam kolokasi עשה משפט, maknanya adalah melakukan atau melaksanakan apa yang adil. “Menegakkan keadilan” idiomatis dan mempertahankan nuansa etis-yudisial.
theological_decisions:
- issue: Tantangan retoris Abraham terhadap karakter Allah
  choice: Masakan Hakim seluruh bumi tidak menegakkan keadilan?
  alternative: Bukankah Hakim seluruh bumi akan melakukan apa yang adil?
  rationale: Rumusan terpilih mempertahankan keberanian pertanyaan Abraham, jawaban afirmatif yang diharapkan, serta hubungan antara jabatan Allah sebagai Hakim dan tindakan-Nya yang adil.
- issue: Kesamaan orang benar dan orang fasik
  choice: diperlakukan sama
  alternative: menjadi seperti
  rationale: Konteksnya adalah tindakan membunuh keduanya bersama-sama, bukan penyamaan watak moral. Terjemahan ini menghindari kesan bahwa orang benar berubah menjadi fasik, sambil menjaga ketegangan tuntutan Abraham agar penghakiman membedakan keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Allah memakai “Mu” dengan huruf kapital. Pengulangan חָלִילָה dipertahankan untuk menjaga tekanan retoris ayat.
