  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: id
  text: “Biarlah aku mengambil sedikit roti[a] agar hati Tuan-tuan disegarkan[b]. Sesudah itu, Tuan-tuan dapat melanjutkan perjalanan, sebab untuk itulah Tuan-tuan melewati hambamu ini.” Mereka berkata, “Baiklah, lakukanlah seperti yang telah engkau katakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepotong roti.” Dalam konteks keramahtamahan, ungkapan Ibrani ini merupakan cara merendah untuk menyebut hidangan yang ditawarkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “topanglah” atau “kuatkanlah hati Tuan-tuan.” Ungkapan Ibrani ini berarti menyegarkan atau memulihkan tenaga dengan makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: Biarlah aku mengambil
  rationale: Bentuk kohortatif orang pertama menyatakan tawaran atau permohonan sopan Abraham, bukan sekadar tindakan pada masa depan. 'Biarlah aku' mempertahankan nuansa volitif itu.
- source_word: פַת לֶחֶם
  choice: sedikit roti
  rationale: Ungkapan ini menunjuk pada porsi kecil roti dan berfungsi sebagai ungkapan merendah dalam konteks keramahtamahan. 'Sedikit roti' alami dalam bahasa Indonesia dan tidak mengesankan satu potong tertentu.
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: agar hati Tuan-tuan disegarkan
  rationale: Secara harfiah ungkapan ini berbicara tentang menopang atau menguatkan hati, dengan maksud memulihkan diri melalui makanan. Terjemahan ini mempertahankan citra 'hati' sambil tetap dapat dipahami.
- source_word: אַחַר תַּעֲבֹרוּ
  choice: Sesudah itu, Tuan-tuan dapat melanjutkan perjalanan
  rationale: Kata עבר di sini mengacu pada meneruskan perjalanan. Terjemahan ini menyampaikan makna kontekstualnya secara wajar.
- source_word: כִּי עַל כֵּן
  choice: sebab untuk itulah
  rationale: Gabungan ini memperkenalkan alasan bagi tawaran Abraham. Rumusan ini mempertahankan pernyataan tujuan atau alasan yang kuat dalam bahasa Ibrani tanpa menjelaskannya lebih jauh.
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: Tuan-tuan melewati hambamu ini
  rationale: Terjemahan mempertahankan pengulangan akar עבר dengan gagasan perjalanan sebelumnya, sekaligus menjaga sebutan diri Abraham yang merendah. 'Hambamu ini' adalah bentuk penghormatan, bukan penegasan status perbudakan.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Baiklah, lakukanlah
  rationale: כֵּן menyatakan persetujuan singkat terhadap tawaran Abraham; 'Baiklah' merupakan jawaban persetujuan yang alami dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: seperti yang telah engkau katakan
  rationale: Frasa ini menegaskan agar Abraham bertindak sesuai dengan tawaran yang baru diucapkannya.
theological_decisions:
- issue: Daya makna כִּי עַל כֵּן sebagai alasan atau tujuan kedatangan para tamu
  choice: sebab untuk itulah Tuan-tuan melewati hambamu ini
  alternative: sebab itulah Tuan-tuan melewati hambamu ini
  rationale: Terjemahan utama mempertahankan bahasa tujuan/alasan dalam teks tanpa menentukan apakah pernyataan Abraham sekadar formula keramahtamahan atau menyiratkan maksud providensial.
translation_notes:
  register: Bahasa langsung dibuat santun dan bermartabat. Sapaan jamak 'Tuan-tuan' mencerminkan keramahtamahan Abraham kepada para tamu, sedangkan 'aku' dan 'hambamu ini' mempertahankan pola tutur merendah dalam dialog. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
