  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: id
  text: Lalu Sara tertawa dalam hati sambil berkata, “Setelah aku layu, akankah aku mengalami kenikmatan[a], sedangkan tuanku sudah tua?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kegairahan”; mungkin mengandung pengertian kenikmatan seksual yang diperbarui atau vitalitas masa muda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: tertawa
  rationale: Kata kerja צחק dalam bentuk qal secara langsung berarti ‘tertawa’; konteks menunjukkan reaksi batin Sara.
- source_word: בְּקִרְבָּהּ
  choice: dalam hatinya
  rationale: Secara harfiah berarti ‘di dalam dirinya’. Ungkapan Indonesia ini secara alami menyampaikan bahwa tawa dan perkataan itu terjadi dalam batin.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif ini memperkenalkan perkataan langsung; unsur batinnya sudah dinyatakan melalui ‘dalam hatinya’.
- source_word: אַחֲרֵי בְלֹתִי
  choice: Setelah aku layu
  rationale: בלה menggambarkan keadaan menjadi aus, usang, atau layu. ‘Layu’ mempertahankan gambaran kemerosotan jasmani tanpa sekadar mengulang kata ‘tua’ yang kemudian dipakai untuk Abraham.
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: akankah aku masih mengalami kenikmatan
  rationale: Susunan ini menyatakan keraguan apakah kenikmatan masih akan menjadi bagian Sara. ‘Masih’ membuat implikasi usia lanjutnya alami dalam bahasa Indonesia tanpa mempersempit makna kata yang jarang ini.
- source_word: עֶדְנָה
  choice: kenikmatan
  rationale: Kata benda langka ini dapat menunjuk pada kenikmatan, termasuk kemungkinan nuansa seksual atau pulihnya vitalitas tubuh. ‘Kenikmatan’ mempertahankan keluasan maknanya.
- source_word: וַאדֹנִי
  choice: sedangkan tuanku
  rationale: Kata penghubung dipahami secara kontekstual sebagai kontras, dan ‘tuanku’ mempertahankan sebutan hormat Sara bagi Abraham tanpa menjadikannya gelar ilahi.
- source_word: זָקֵן
  choice: sudah tua
  rationale: Terjemahan langsung dan wajar untuk keadaan Abraham; ‘sudah’ menegaskan keadaan yang telah dicapai.
theological_decisions:
- issue: Nuansa עֶדְנָה dalam perkataan Sara
  choice: kenikmatan
  alternative: kegairahan; kenikmatan seksual; vitalitas masa muda
  rationale: Konteks usia Sara dan Abraham memungkinkan nuansa jasmani, perkawinan, dan kesuburan, tetapi kata Ibrani itu sendiri tidak membatasi maknanya hanya pada salah satu hal tersebut. Teks utama karena itu memakai istilah yang luas, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Dalam hatinya’ dipilih sebagai ungkapan batin yang alami; ‘layu’ mempertahankan citra kemerosotan jasmani; ‘kenikmatan’ sengaja dibiarkan cukup luas agar ambiguitas kata Ibrani tetap terpelihara.
