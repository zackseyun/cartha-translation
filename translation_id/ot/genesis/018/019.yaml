id: GEN.18.19
reference: Genesis 18:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: id
  text: Sebab Aku telah mengenal dia[a], supaya ia memerintahkan anak-anaknya[b] dan seisi rumahnya sesudah dia agar mereka tetap mengikuti jalan Yahweh[c] dengan melakukan kebenaran dan keadilan, supaya Yahweh mendatangkan kepada Abraham apa yang telah difirmankan-Nya tentang dia[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memilih dia.” Kata Ibrani ini biasanya berarti “mengenal”, tetapi dalam konteks ini dapat mengandung makna memberi perhatian khusus atau memilih.
    reason: alternative_reading
  - marker: b
    text: Kata Ibraninya berbentuk jamak maskulin dan dapat diterjemahkan “anak-anak lelakinya”; dalam pemakaian Ibrani, kata ini juga dapat dipakai secara generik untuk anak-anak atau keturunan.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, cara hidup yang Yahweh kehendaki.
    reason: cultural_note
  - marker: d
    text: Atau, “apa yang telah dijanjikan-Nya kepadanya.” Secara lebih harfiah, bahasa Ibraninya berbunyi, “apa yang telah difirmankan-Nya tentang dia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pernyataan sebelumnya dan mempertahankan daya penjelasnya.
- source_word: יְדַעְתִּיו
  choice: Aku telah mengenal dia
  rationale: Menerjemahkan arti dasar ידע, sambil tidak menutup kemungkinan nuansa perhatian khusus atau pemilihan.
- source_word: לְמַעַן אֲשֶׁר
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil dengan wajar dalam bahasa Indonesia modern.
- source_word: יְצַוֶּה
  choice: ia memerintahkan
  rationale: 'Bentuk piel צוה memiliki daya kuat: memerintahkan atau memberi perintah.'
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks keluarga dan keturunan, bentuk jamak בנים dapat menunjuk kepada anak-anak; bentuk Ibraninya secara gramatikal maskulin dijelaskan dalam catatan.
- source_word: בֵּיתוֹ
  choice: seisi rumahnya
  rationale: Menunjuk kepada seluruh lingkungan domestik Abraham, bukan bangunan rumah saja.
- source_word: אַחֲרָיו
  choice: sesudah dia
  rationale: Mempertahankan gagasan kesinambungan setelah Abraham.
- source_word: וְשָׁמְרוּ דֶּרֶךְ יְהוָה
  choice: untuk tetap mengikuti jalan Yahweh
  rationale: שמר dengan objek 'jalan' menyatakan pemeliharaan atau ketaatan yang terus-menerus; 'mengikuti' lebih alami dalam bahasa Indonesia daripada 'menjaga jalan'.
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: dengan melakukan kebenaran dan keadilan
  rationale: Infinitif menjelaskan cara mengikuti jalan Yahweh, sedangkan kedua istilah etis tetap dibedakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֵת אֲשֶׁר דִּבֶּר עָלָיו
  choice: apa yang telah difirmankan-Nya tentang dia
  rationale: Mempertahankan ungkapan harfiah 'yang difirmankan tentang dia' tanpa mengubahnya secara diam-diam menjadi 'dijanjikan kepadanya'.
theological_decisions:
- issue: Apakah ידע menyatakan pengenalan atau pemilihan
  choice: Aku telah mengenal dia
  alternative: Aku telah memilih dia
  rationale: Arti leksikal dasarnya adalah 'mengenal', tetapi konteks memungkinkan nuansa perhatian khusus atau pemilihan; alternatif itu dicatat tanpa dijadikan satu-satunya tafsiran.
- issue: Rujukan frasa tujuan kedua
  choice: supaya Yahweh mendatangkan kepada Abraham apa yang telah difirmankan-Nya tentang dia
  alternative: sehingga Yahweh memenuhi bagi Abraham apa yang telah dijanjikan-Nya kepadanya
  rationale: Terjemahan utama mempertahankan struktur tujuan dan verba 'berfirman' dari bahasa Ibrani, sedangkan alternatif yang lebih interpretatif tidak dimasukkan ke teks.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dalam sumber dipertahankan sebagai nama, bukan diganti dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-tujuan teks Ibrani dipertahankan, sementara ungkapan idiomatis seperti 'mengikuti jalan' digunakan agar alami dan mudah dipahami. Semua penanda catatan kaki ditempatkan langsung pada unsur terkait.
