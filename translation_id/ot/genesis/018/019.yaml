  to: Sebab Aku telah mengenal dia[a], supaya ia memerintahkan anak-anaknya[b] dan seisi rumahnya sesudah dia agar mereka tetap mengikuti jalan Yahweh[c] dengan melakukan kebenaran dan keadilan, supaya Yahweh mendatangkan kepada Abraham apa yang telah difirmankan-Nya tentang dia[d].
