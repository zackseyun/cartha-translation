  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Jika Aku menemukan lima puluh orang benar di tengah kota Sodom, Aku akan mengampuni seluruh tempat itu[a] demi mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan membiarkan seluruh tempat itu luput dari hukuman demi mereka.” Kata kerja Ibrani ini secara harfiah dapat berarti mengangkat atau menanggung; dalam konteks ini, kata itu menyatakan pengampunan atau penahanan hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, 'Lalu' menyatakan urutan secara alami, sedangkan 'berfirman' merupakan padanan bermartabat dan lazim ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: אִם אֶמְצָא
  choice: Jika Aku menemukan
  rationale: Menerjemahkan konstruksi bersyarat secara langsung dan alami. Huruf kapital pada 'Aku' mengikuti kebiasaan ejaan Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: lima puluh orang benar
  rationale: Bentuk jamak ini menunjuk kepada orang-orang yang benar tanpa harus membatasinya hanya pada laki-laki.
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: di tengah kota Sodom
  rationale: Susunan ini menggabungkan kedua keterangan tempat secara wajar dalam bahasa Indonesia sambil mempertahankan penekanan bahwa mereka harus ditemukan di dalam kota itu.
- source_word: וְנָשָׂאתִי
  choice: Aku akan menyelamatkan
  rationale: Dalam konteks penghukuman kota, נָשָׂא menyatakan tidak menjatuhkan hukuman atau membiarkan tempat itu luput. 'Menyelamatkan' menyampaikan akibat kontekstual tersebut dengan jelas, sementara kemungkinan nuansa 'mengampuni' dicatat dalam catatan kaki.
- source_word: לְכָל הַמָּקוֹם
  choice: seluruh tempat itu
  rationale: Menjaga cakupan menyeluruh dari כָּל dan rujukan מָקוֹם kepada wilayah yang sedang terancam hukuman.
- source_word: בַּעֲבוּרָם
  choice: demi mereka
  rationale: Ungkapan ini secara alami menyatakan bahwa keberadaan orang-orang benar menjadi pertimbangan bagi tindakan Yahweh terhadap seluruh tempat itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Transliterasi 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna וְנָשָׂאתִי dalam konteks penghukuman
  choice: Aku akan menyelamatkan
  alternative: Aku akan mengampuni
  rationale: Objeknya adalah seluruh tempat, dan konteksnya ialah ancaman pemusnahan; karena itu terjemahan utama menonjolkan tindakan membiarkan kota itu luput. Catatan kaki mempertahankan kemungkinan nuansa pengampunan atau penangguhan hukuman yang melekat pada verba tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. 'Orang benar' dipilih sebagai istilah yang mudah dipahami dan tidak membatasi jenis kelamin. Penanda catatan kaki ditempatkan setelah kutipan yang dijelaskannya.
