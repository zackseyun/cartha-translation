  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: id
  text: Abraham pasti akan menjadi bangsa yang besar dan kuat, dan semua bangsa di bumi akan diberkati di dalam dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “semua bangsa di bumi akan memberkati diri mereka dengan Abraham sebagai rumusan berkat.” Bentuk bahasa Ibrani dapat dipahami demikian, meskipun teks utama memahaminya secara pasif: “akan diberkati.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: pasti akan menjadi
  rationale: Gabungan infinitif absolut dan bentuk imperfek menegaskan kepastian peristiwa pada masa depan; ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konstruksi predikatif לְגוֹי.
- source_word: לְגוֹי
  choice: menjadi bangsa
  rationale: גוי menunjuk pada bangsa atau kelompok masyarakat; 'bangsa' paling sesuai dengan konteks janji kepada Abraham dan mempertahankan kaitan dengan bangsa-bangsa pada klausa berikutnya.
- source_word: גָּדוֹל וְעָצוּם
  choice: besar dan kuat
  rationale: '''Besar'' mempertahankan cakupan kuantitatif maupun kualitatif גָּדוֹל, sedangkan ''kuat'' menyampaikan daya atau kekuatan עָצוּם secara wajar dan bermartabat dalam bahasa Indonesia.'
- source_word: וְנִבְרְכוּ
  choice: akan diberkati
  rationale: 'Bentuk Nifal paling wajar dipahami secara pasif dalam konteks ini: bangsa-bangsa menerima berkat. Kemungkinan makna refleksif dipertahankan dalam catatan kaki.'
- source_word: בוֹ
  choice: melalui dia
  rationale: Preposisi ב menandai hubungan Abraham dengan berkat tersebut. 'Melalui dia' menyampaikan perantaraan atau keterkaitan secara alami, meskipun 'di dalam dia' lebih harfiah dan tetap diakui sebagai kemungkinan.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: Ungkapan ini bersifat universal; 'bangsa' menjaga konsistensi dengan גוי sebelumnya dan 'bumi' lebih tepat daripada 'negeri' untuk cakupan tersebut.
theological_decisions:
- issue: Makna rumusan berkat Abraham
  choice: 'Bangsa-bangsa digambarkan sebagai penerima berkat dalam kaitannya dengan Abraham: ''akan diberkati.'''
  alternative: 'Bangsa-bangsa akan memakai Abraham sebagai rumusan berkat bagi diri mereka: ''akan memberkati diri dengan memakai namanya.'''
  rationale: Bentuk Nifal נברכו memungkinkan pembacaan pasif dan refleksif. Pembacaan pasif paling sesuai sebagai teks utama, tetapi ketegangan yang sungguh ada dalam bahasa Ibrani dipertahankan melalui catatan kaki.
- issue: Nuansa preposisi ב pada בוֹ
  choice: '''Melalui dia'' digunakan untuk menyatakan bahwa berkat bagi bangsa-bangsa berkaitan dengan atau tersalur melalui Abraham.'
  alternative: '''Di dalam dia'' mempertahankan bentuk preposisi secara lebih harfiah.'
  rationale: Bahasa Ibrani tidak merinci mekanisme berkat. Terjemahan dipilih karena alami dalam bahasa Indonesia tanpa menentukan lebih jauh bagaimana janji itu digenapi.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Pasti akan' menyampaikan penegasan Ibrani secara alami; 'besar dan kuat' mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan tepat setelah klausa yang dijelaskannya.
