source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: id
  text: Yahweh menampakkan diri kepadanya di dekat pohon-pohon besar Mamre[a], ketika ia sedang duduk di pintu kemah pada waktu hari sedang panas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dekat pohon-pohon tarbantin Mamre.” Istilah Ibrani ini dapat merujuk pada pohon-pohon besar, seperti tarbantin atau ek.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה di sini menyatakan penampakan yang dapat dilihat. Ungkapan Indonesia ini alami dan lebih tepat daripada bentuk pasif harfiah 'terlihat'.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Menerjemahkan preposisi dengan sufiks orang ketiga tunggal maskulin; rujukannya kepada Abraham dipertahankan secara pronominal seperti dalam bahasa Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga mempertahankan nama pribadi yang terdapat dalam teks sumber.
- source_word: בְּאֵלֹנֵי
  choice: di dekat pohon-pohon besar
  rationale: Istilah ini dapat menunjuk pada pohon tarbantin atau pohon besar seperti ek. Terjemahan umum mempertahankan ketidakpastian jenis pohonnya tanpa memakai istilah botani yang kurang dikenal.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְהוּא יֹשֵׁב
  choice: ketika ia sedang duduk
  rationale: Partisip Ibrani memberi latar keadaan yang berlangsung bersamaan dengan penampakan; bentuk ini wajar dalam narasi Indonesia.
- source_word: פֶּתַח הָאֹהֶל
  choice: di pintu kemah
  rationale: פֶּתַח berarti bukaan atau jalan masuk. 'Pintu kemah' adalah ungkapan konkret dan lazim, tanpa menyiratkan daun pintu.
- source_word: כְּחֹם הַיּוֹם
  choice: pada waktu hari panas terik
  rationale: Ungkapan ini menunjuk pada panasnya hari, kemungkinan bagian hari yang paling panas, tetapi tidak menentukan jam tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur ayat tetap dekat dengan urutan narasi Ibrani, sedangkan pilihan 'pohon-pohon besar' menghindari kepastian botani yang tidak terdapat dalam teks.
