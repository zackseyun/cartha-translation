base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: id
  text: Namun Sara menyangkalnya[a] dengan berkata, “Aku tidak tertawa,” karena ia takut. Tetapi dia berkata, “Tidak[b], engkau memang tertawa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sara berbohong,” atau cukup, “Sara menyangkal.” Kata Ibrani ini dapat berarti menyangkal atau berbohong; di sini yang dimaksud ialah penyangkalan Sara bahwa ia telah tertawa.
    reason: lexical_alternative
  - marker: b
    text: Pembicara tidak disebutkan secara eksplisit dalam klausa ini; dari konteks narasi di sekitarnya, pembicara itu dipahami sebagai TUHAN.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: menyangkalnya
  rationale: Bentuk piel dari כחשׁ dapat berarti menyangkal atau berkata tidak benar. Dalam konteks ini Sara menyangkal bahwa ia telah tertawa; pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan penilaian moral secara berlebihan.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Infinitif kutipan ini memperkenalkan ucapan langsung Sara. 'Dengan berkata' menghubungkan isi perkataan dengan tindakan menyangkal secara wajar.
- source_word: לֹא צָחַקְתִּי
  choice: Aku tidak tertawa
  rationale: Menerjemahkan secara langsung bentuk perfect orang pertama tunggal yang dinegasikan, dengan ragam naratif Indonesia yang alami.
- source_word: כִּי יָרֵאָה
  choice: karena ia takut
  rationale: כִּי menyatakan alasan bagi penyangkalan Sara. 'Karena' mempertahankan hubungan sebab secara jelas.
- source_word: וַיֹּאמֶר
  choice: Tetapi dia berkata
  rationale: Waw meneruskan alur narasi, sedangkan 'tetapi' memperjelas pertentangan antara penyangkalan Sara dan jawaban pembicara.
- source_word: לֹא כִּי צָחָקְתְּ
  choice: Tidak, engkau memang tertawa
  rationale: לֹא menolak ucapan Sara, sedangkan כִּי dalam susunan ini menegaskan kenyataan yang berlawanan. 'Memang' menyampaikan penekanan itu secara alami tanpa menambahkan unsur yang tidak ada.
theological_decisions:
- issue: Identitas pembicara dalam וַיֹּאמֶר
  choice: Memakai 'dia berkata' tanpa menyebut nama pembicara.
  alternative: TUHAN berkata; salah seorang dari ketiga orang itu berkata.
  rationale: Klausa ini hanya memakai verba maskulin tunggal tanpa mengulangi subjek. Konteks narasi mengaitkan pembicara dengan TUHAN, tetapi ayat ini sendiri tidak menyebut nama-Nya kembali; terjemahan mempertahankan ketidaktersuratan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Aku–engkau' dipakai untuk dialog langsung dalam konteks Alkitab. Kata ganti 'dia' sengaja tidak diganti dengan 'TUHAN' agar struktur eksplisit teks Ibrani tetap terjaga.
