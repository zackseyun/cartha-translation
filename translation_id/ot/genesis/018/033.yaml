  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: id
  text: Lalu Yahweh[a] pergi ketika Ia selesai berbicara kepada Abraham, dan Abraham kembali ke tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi. Bentuk lain yang digunakan adalah “Yehuwa”; banyak terjemahan menuliskannya sebagai “TUHAN”.'
    reason: Menjelaskan transliterasi nama ilahi dan padanan tradisionalnya secara tepat.
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ... pergi
  rationale: Bentuk naratif וַיֵּלֶךְ menyatakan tindakan pergi atau beranjak setelah percakapan berakhir. “Pergi” alami dalam bahasa Indonesia dan tidak menambahkan tujuan yang tidak disebutkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: setelah selesai berbicara
  rationale: כַּאֲשֶׁר berfungsi temporal, sedangkan כִּלָּה dengan infinitif menyatakan selesainya suatu tindakan. Susunan ini jelas dan alami dalam narasi Indonesia.
- source_word: אֶל אַבְרָהָם
  choice: kepada Abraham
  rationale: Preposisi אֶל memiliki arah “kepada”; pilihan ini mempertahankan bentuk sumber tanpa mengubahnya menjadi “dengan Abraham”.
- source_word: שָׁב
  choice: kembali
  rationale: שׁוב di sini menyatakan kepulangan atau gerak kembali.
- source_word: לִמְקֹמוֹ
  choice: ke tempatnya
  rationale: מָקוֹם secara langsung berarti “tempat”. Terjemahan ini tidak mempersempit makna menjadi “rumah”, yang tidak dinyatakan oleh teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sedangkan catatan kaki mengakui bentuk lain yang dikenal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mengikuti urutan peristiwa dalam teks Ibrani, dengan penghubung “setelah” agar hubungan waktunya jelas.
