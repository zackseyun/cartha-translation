base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: id
  text: Lalu Abraham berkata, “Janganlah kiranya Tuanku murka. Izinkanlah aku berbicara sekali ini saja lagi. Barangkali akan ditemukan sepuluh orang di sana.” Dia menjawab, “Aku tidak akan memusnahkannya demi kesepuluh orang itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא יִחַר לַאדֹנָי
  choice: Janganlah kiranya Tuanku murka
  rationale: Ungkapan חרה menyatakan bangkit atau berkobarnya amarah; bentuk ini mempertahankan permohonan sopan נָא dan sapaan hormat לַאדֹנָי tanpa menyamakannya dengan nama ilahi YHWH.
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: Izinkanlah aku berbicara sekali ini saja lagi
  rationale: Bentuk kohortatif menyatakan permohonan atau niat untuk berbicara, sedangkan אַךְ הַפַּעַם membatasi ini sebagai permohonan terakhir.
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: Barangkali ada sepuluh orang ditemukan di sana
  rationale: אוּלַי menyatakan kemungkinan, dan bentuk Nifal יִמָּצְאוּן dipertahankan dengan nuansa pasif ‘ditemukan’. Kata ‘orang’ ditambahkan secara wajar karena bilangan itu merujuk kepada orang-orang benar dalam konteks.
- source_word: לֹא אַשְׁחִית
  choice: Aku tidak akan memusnahkannya
  rationale: Bentuk Hifil שׁחת berarti ‘memusnahkan’. Akhiran ‘-nya’ memasok objek yang tersirat dari konteks, yaitu kota atau tempat yang sedang dibicarakan.
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: demi kesepuluh orang itu
  rationale: בַּעֲבוּר menyatakan tindakan demi atau karena pertimbangan terhadap sepuluh orang yang baru disebut; artikel Ibrani tercermin dalam ‘itu’.
theological_decisions:
- issue: Rujukan dan kapitalisasi אֲדֹנָי dalam sapaan Abraham
  choice: Tuanku
  alternative: Tuhan
  rationale: Konteks luas menggambarkan penampakan ilahi, tetapi kata dalam ayat ini adalah sapaan hormat, bukan nama YHWH. ‘Tuanku’ mempertahankan kemungkinan sapaan kepada sang lawan bicara tanpa memutuskan ketegangan teologis melalui terjemahan ‘Tuhan’.
- issue: Pelaku ujaran kedua
  choice: Dia menjawab
  alternative: TUHAN menjawab
  rationale: Teks Ibrani hanya memakai bentuk ‘dan dia berkata’. Kata ganti mempertahankan ketidaktersuratan subjek dalam ayat ini dan tidak menambahkan nama ilahi yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, bermartabat, dan mudah dipahami. ‘Janganlah kiranya’ mempertahankan kesopanan serta nuansa formal permohonan Abraham; ‘Tuanku’ sengaja digunakan untuk menjaga ambiguitas sapaan. Nama Abraham ditambahkan pada awal ayat untuk kejernihan rujukan dalam bahasa Indonesia.
