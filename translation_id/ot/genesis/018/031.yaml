  to: Lalu Abraham berkata, “Lihatlah, aku telah memberanikan diri untuk berbicara kepada Tuhanku. Barangkali dua puluh orang akan ditemukan di sana.” Ia berkata, “Aku tidak akan memusnahkannya demi dua puluh orang itu.”
