base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: id
  text: Lalu Abraham berkata, “Lihatlah, aku telah memberanikan diri untuk berbicara kepada Tuhanku. Barangkali dua puluh orang akan ditemukan di sana.” Ia berkata, “Aku tidak akan memusnahkannya demi dua puluh orang itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: Gabungan partikel ini menarik perhatian dengan nada sopan. “Lihatlah” alami dalam tuturan yang khidmat; nuansa permohonan juga tersampaikan oleh keseluruhan ungkapan Abraham.
- source_word: הוֹאַלְתִּי
  choice: aku telah memberanikan diri
  rationale: Dalam konteks permohonan Abraham yang penuh hormat, bentuk ini menyatakan keberanian mengambil kebebasan untuk berbicara, bukan sekadar mulai atau berusaha.
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: untuk berbicara kepada Tuhanku
  rationale: Menerjemahkan frasa secara langsung dan mempertahankan bentuk sapaan posesif kepada Pribadi ilahi tanpa menggantinya dengan nama YHWH.
- source_word: אוּלַי
  choice: Bagaimana jika
  rationale: Dalam rangkaian tawar-menawar ini, “Bagaimana jika” menyampaikan usulan tentatif dengan lebih alami daripada bentuk deklaratif “barangkali,” sambil mempertahankan ketidakpastian.
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: dua puluh orang ditemukan di sana
  rationale: Mempertahankan bentuk pasif Niphal. Kata “orang” ditambahkan secara wajar karena angka itu, menurut konteks, menunjuk kepada orang-orang benar.
- source_word: לֹא אַשְׁחִית
  choice: Aku tidak akan memusnahkannya
  rationale: “Memusnahkan” sesuai dengan tindakan penghancuran dalam konteks. Pronomina “-nya” memasok objek yang tersirat, yakni kota atau tempat yang sedang dibicarakan.
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: demi kedua puluh orang itu
  rationale: “Demi” secara ringkas menyampaikan alasan pembebasan karena keberadaan kelompok tertentu; “kedua puluh orang itu” mempertahankan artikel penentu Ibrani.
theological_decisions:
- issue: Penerjemahan אֲדֹנָי dalam sapaan Abraham
  choice: Tuhanku
  alternative: tuanku
  rationale: Dalam konteks Kejadian 18, lawan bicara Abraham adalah Pribadi ilahi. Huruf kapital menandai gelar ilahi tanpa menyamakan bentuk אֲדֹנָי dengan nama perjanjian YHWH.
- issue: Identitas pembicara dalam klausa jawaban
  choice: TUHAN menjawab
  alternative: Ia menjawab
  rationale: Teks Ibrani hanya memakai verba “dan ia berkata,” tetapi konteks mengidentifikasi penjawab sebagai Pribadi ilahi. “TUHAN” memperjelas pergantian pembicara, namun merupakan eksplisitasi kontekstual, bukan penggantian langsung bentuk Ibrani pada klausa ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama Abraham dan subjek TUHAN dibuat eksplisit agar pergantian pembicara mudah diikuti; teks Ibrani secara harfiah memakai “ia berkata” pada kedua klausa. Tidak diperlukan catatan kaki karena tidak ada alternatif penting yang harus ditampilkan dalam teks publikasi.
