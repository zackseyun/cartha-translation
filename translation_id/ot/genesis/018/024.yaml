base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: id
  text: Barangkali ada lima puluh orang benar di tengah kota itu[a]. Apakah Engkau benar-benar akan melenyapkannya dan tidak mengampuni tempat itu demi lima puluh orang benar yang ada di dalamnya?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Seandainya ada lima puluh orang benar di dalam kota itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “apakah Engkau benar-benar akan melenyapkannya dan tidak membiarkan tempat itu luput demi lima puluh orang benar yang ada di dalamnya?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: Seandainya
  rationale: Dalam permohonan hipotetis Abraham, kata ini menyatakan kemungkinan yang diajukan dengan hati-hati. “Seandainya” alami dalam bahasa Indonesia dan mempertahankan nuansa tentatif.
- source_word: יֵשׁ
  choice: ada
  rationale: Padanan eksistensial yang langsung dan wajar; bersama “seandainya” membentuk pengandaian.
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: lima puluh orang benar
  rationale: צַדִּיקִם menunjuk kepada orang-orang yang benar tanpa mengharuskan referen laki-laki; “orang benar” tepat dan lazim.
- source_word: בְּתוֹךְ הָעִיר
  choice: di tengah kota itu
  rationale: Mempertahankan citra lokasi internal dari תּוֹךְ dan menghasilkan ungkapan Indonesia yang alami.
- source_word: הַאַף
  choice: benar-benar
  rationale: Menyampaikan penegasan dalam pertanyaan retoris tanpa menambahkan kesimpulan yang tidak tersurat.
- source_word: תִּסְפֶּה
  choice: melenyapkannya
  rationale: Dalam konteks penghukuman, verba ini berarti membinasakan atau menyapu habis. “Melenyapkan” menyampaikan akibatnya secara jelas dan bermartabat.
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: dan tidak menyelamatkan tempat itu
  rationale: נשא dengan objek “tempat” di sini mengacu pada membiarkan kota luput dari kebinasaan. “Menyelamatkan” mempertahankan kontras naratif dengan melenyapkan, sementara alternatif “mengampuni” dicatat.
- source_word: לְמַעַן
  choice: demi
  rationale: Menyatakan bahwa keberadaan orang benar menjadi dasar permohonan agar tempat itu tidak dibinasakan.
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: yang ada di dalamnya
  rationale: Mencerminkan klausa relatif dan lokasi orang-orang benar di dalam kota dengan jelas.
theological_decisions:
- issue: Makna נשא dalam frasa וְלֹא תִשָּׂא לַמָּקוֹם
  choice: menyelamatkan tempat itu
  alternative: mengampuni tempat itu
  rationale: Konteks langsung mengontraskan pemusnahan kota dengan tindakan membiarkannya luput demi orang-orang benar. “Menyelamatkan” menyampaikan tindakan menahan penghukuman tanpa membatasi makna pada pengampunan dosa; ambiguitas leksikal tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan bermartabat. Kapitalisasi “Engkau” menandai sapaan langsung kepada Allah. Susunan pertanyaan mempertahankan desakan retoris Abraham serta pengulangan “lima puluh orang benar” dari teks Ibrani.
