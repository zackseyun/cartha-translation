language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: id
  text: Adam kembali bersetubuh dengan istrinya. Istrinya melahirkan seorang anak laki-laki dan menamainya Set[a], sebab katanya, “Allah telah menetapkan bagiku keturunan lain sebagai ganti Habel, karena Kain telah membunuhnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama “Set” berbunyi mirip dengan kata kerja Ibrani yang berarti “menaruh” atau “menempatkan”; dalam konteks ini, kata itu dapat berarti “menetapkan”.
    reason: Menjelaskan permainan kata Ibrani antara nama Set dan kata kerja yang diterjemahkan “telah menetapkan”.
lexical_decisions:
- source_word: וַיֵּדַע
  choice: kembali bersetubuh
  rationale: Dalam konteks hubungan suami-istri, יָדַע merupakan ungkapan halus Ibrani untuk hubungan seksual. Bahasa Indonesia tidak memakai ‘mengenal’ dengan makna ini secara wajar, sehingga ‘bersetubuh’ menyampaikan maksudnya dengan jelas dan tetap bermartabat; עוֹד diterjemahkan ‘kembali’.
- source_word: אָדָם
  choice: Adam
  rationale: Dalam konteks ini kata tersebut berfungsi sebagai nama diri.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Padanan alami dalam bahasa Indonesia modern untuk ungkapan kelahiran ילד + בן.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: menamainya
  rationale: Menyampaikan rumus penamaan Ibrani secara alami dan ringkas dalam bahasa Indonesia.
- source_word: שֵׁת
  choice: Set
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שָׁת
  choice: telah menetapkan
  rationale: Kata kerja שִׁית berarti menaruh, menempatkan, atau menetapkan. ‘Menetapkan’ cukup alami dalam ucapan ini dan mempertahankan gagasan tindakan Allah, sedangkan permainan bunyi dengan nama Set dijelaskan dalam catatan kaki.
- source_word: זֶרַע אַחֵר
  choice: keturunan lain
  rationale: ‘Keturunan’ mempertahankan cakupan prokreatif זֶרַע tanpa memakai ‘benih’ yang terasa tidak alami bagi seorang anak dalam konteks ini.
- source_word: תַּחַת הֶבֶל
  choice: sebagai ganti Habel
  rationale: תַּחַת menyatakan penggantian dalam konteks ini; ‘sebagai ganti’ merupakan ungkapan Indonesia yang jelas.
- source_word: הֲרָגוֹ
  choice: telah membunuhnya
  rationale: הרג adalah kata umum untuk membunuh atau mematikan. Bentuk ini menyatakan tindakan Kain secara langsung tanpa menambahkan kekhususan leksikal yang tidak terdapat pada verba sumber.
theological_decisions:
- issue: Penjelasan tentang nama Set
  choice: Allah telah menetapkan bagiku keturunan lain
  alternative: Allah telah menempatkan bagiku keturunan lain; Allah telah mengaruniakan kepadaku anak lain
  rationale: Terjemahan ini mempertahankan Allah sebagai pelaku yang menyediakan pengganti bagi Habel dan sebisa mungkin mencerminkan verba yang mendasari permainan kata, tanpa mengubahnya menjadi rumusan doktrinal yang lebih khusus.
- issue: Ungkapan halus untuk hubungan seksual
  choice: Adam kembali bersetubuh dengan istrinya
  alternative: Adam kembali mengenal istrinya; Adam kembali berhubungan dengan istrinya
  rationale: Terjemahan harfiah ‘mengenal’ tidak menyampaikan idiom Ibrani kepada pembaca Indonesia modern, sedangkan ‘berhubungan’ dapat terlalu kabur. ‘Bersetubuh’ jelas, wajar, dan bermartabat.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ejaan nama mengikuti bentuk yang umum dalam Alkitab bahasa Indonesia: Set, Habel, dan Kain. Penanda catatan kaki ditempatkan pada nama Set, tempat permainan kata menjadi relevan.'
