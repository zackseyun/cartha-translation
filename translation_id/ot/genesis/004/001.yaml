id: GEN.4.1
reference: Genesis 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: id
  text: Adam bersetubuh dengan Hawa, istrinya; lalu Hawa mengandung dan melahirkan Kain[b]. Hawa berkata, “Aku telah memperoleh seorang laki-laki dari Yahweh[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah berbunyi, “Aku telah memperoleh seorang laki-laki bersama Yahweh.” Ungkapan itu juga dapat dipahami sebagai “dari Yahweh” atau “dengan pertolongan Yahweh”; kemungkinan yang lebih kecil ialah, “Aku telah memperoleh seorang laki-laki—Yahweh.” Teks utama memahami ucapan Hawa sebagai pengakuan bahwa kelahiran Kain berasal dari Yahweh.
    reason: alternative_reading
  - marker: b
    text: Nama Kain terdengar mirip dengan kata kerja Ibrani qaniti, “aku telah memperoleh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָדָם
  choice: Adam
  rationale: Dalam konteks ini הָאָדָם menunjuk kepada pribadi Adam. Hubungan naratif yang ditandai וְ tetap terjaga secara alami melalui kesinambungan kalimat Indonesia tanpa harus selalu diterjemahkan dengan 'dan' di awal.
- source_word: יָדַע
  choice: bersetubuh dengan
  rationale: Secara harfiah verba ini berarti 'mengenal', tetapi di sini merupakan eufemisme Ibrani bagi hubungan seksual. 'Bersetubuh dengan' menyampaikan makna kontekstual secara jelas, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: Hawa, istrinya
  rationale: Mempertahankan nama Hawa dan hubungan perkawinannya dengan Adam dalam susunan Indonesia yang alami.
- source_word: וַתַּהַר
  choice: lalu Hawa mengandung
  rationale: Mengungkapkan urutan akibat dalam narasi dan menyebut kembali subjek agar kalimat Indonesia jelas.
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: dan melahirkan Kain
  rationale: Padanan ringkas dan idiomatis bagi tindakan melahirkan, dengan nama קַיִן ditransliterasikan sebagai Kain.
- source_word: קָנִיתִי
  choice: Aku telah memperoleh
  rationale: קנה lazim berarti memperoleh atau mendapatkan. 'Memperoleh' cukup dekat dengan makna sumber dan mendukung penjelasan permainan bunyi dengan nama Kain.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan kata sumber yang secara harfiah berarti laki-laki/pria, meskipun acuannya adalah seorang bayi laki-laki, dan tidak meratakannya menjadi 'anak' atau 'anak laki-laki'.
- source_word: אֶת יְהוָה
  choice: dari Yahweh
  rationale: Ungkapan Ibrani ini sulit dan ambigu. 'Dari Yahweh' secara alami menyampaikan pengakuan Hawa bahwa kelahiran itu berasal dari Yahweh, sedangkan kemungkinan utama lainnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
theological_decisions:
- issue: Penafsiran אֶת יְהוָה dalam ucapan Hawa
  choice: dari Yahweh
  alternative: bersama Yahweh; dengan pertolongan Yahweh; seorang laki-laki—Yahweh
  rationale: Susunan Ibrani benar-benar ambigu. Teks utama memilih pengertian sumber/pemberian ilahi yang wajar dalam bahasa Indonesia, tetapi tidak meniadakan alternatif literal dan sintaksis yang penting; semuanya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Idiom seksual Ibrani diterjemahkan menurut maknanya agar tidak menimbulkan salah paham bagi pembaca umum. Ambiguitas penting pada frasa penutup dipertahankan melalui catatan kaki. Penanda [a] dan [b] ditempatkan sesudah ucapan Hawa karena keduanya menjelaskan unsur dalam ucapan tersebut.
