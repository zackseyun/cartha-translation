  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: id
  text: 'Lamekh berkata kepada istri-istrinya,

    “Adah dan Zila, dengarkanlah suaraku;

    istri-istri Lamekh, simaklah perkataanku.

    Sebab aku telah membunuh seorang laki-laki karena ia melukai aku,

    bahkan seorang pemuda karena ia memukul aku.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku membunuh seorang laki-laki karena lukaku, bahkan seorang pemuda karena lebamku.” Secara lebih harfiah, bahasa Ibrani memakai kata benda “luka” dan “lebam”, bukan ungkapan verbal “melukai aku” dan “memukul aku”.
    reason: lexical_alternative
  - marker: b
    text: Sebagian orang memahami perkataan Lamekh sebagai ancaman atau bualan umum—“aku akan membunuh seorang laki-laki ...”—bukan sebagai laporan tentang pembunuhan yang benar-benar telah terjadi.
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: kepada istri-istrinya
  rationale: Bentuk jamak אִשָּׁה dengan akhiran orang ketiga tunggal maskulin dalam konteks ini secara khusus menunjuk kepada istri-istri Lamekh.
- source_word: שְׁמַעַן קוֹלִי
  choice: dengarkanlah suaraku
  rationale: Mempertahankan gambaran konkret ‘suara’ serta bentuk perintah langsung dalam baris puitis.
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: simaklah perkataanku
  rationale: ‘Simaklah’ menyampaikan tindakan mendengarkan dengan penuh perhatian, sedangkan ‘perkataanku’ mempertahankan nomina tunggal Ibrani secara alami.
- source_word: הָרַגְתִּי
  choice: aku telah membunuh
  rationale: Bentuk qatal paling langsung dipahami sebagai laporan tentang tindakan yang sudah terjadi, dengan hasil yang tetap relevan dalam ucapan Lamekh.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan pembedaan paralel dengan יֶלֶד, yaitu seorang yang lebih muda.
- source_word: לְפִצְעִי
  choice: karena ia melukai aku
  rationale: Mengungkapkan secara idiomatis hubungan sebab atau pembalasan yang tersirat oleh לְ, tanpa memasukkan gagasan pembelaan diri.
- source_word: יֶלֶד
  choice: seorang pemuda
  rationale: Dalam paralel dengan אִישׁ, kata ini menunjuk kepada orang laki-laki yang lebih muda; ‘pemuda’ tidak menyiratkan anak kecil.
- source_word: לְחַבֻּרָתִי
  choice: karena ia memukul aku
  rationale: Menyampaikan penyebab pembalasan secara alami dan tetap sedikit membedakannya dari tindakan ‘melukai’ pada baris sebelumnya.
theological_decisions:
- issue: Apakah ucapan Lamekh merupakan laporan pembunuhan, ancaman, atau bualan umum
  choice: 'Diterjemahkan sebagai laporan tindakan yang telah terjadi: ‘aku telah membunuh’.'
  alternative: ‘Aku akan membunuh’ atau ‘aku pasti membunuh’, sebagai ancaman atau pernyataan umum.
  rationale: Bentuk qatal paling wajar menyatakan tindakan lampau, tetapi kemungkinan nuansa ancaman atau bualan umum tetap dicatat tanpa dipaksakan ke dalam teks utama.
- issue: Apakah tindakan Lamekh digambarkan sebagai pembelaan diri atau pembalasan
  choice: Frasa sebab diterjemahkan ‘karena ia melukai aku ... karena ia memukul aku’ tanpa penilaian moral tambahan.
  alternative: Menjelaskan bahwa Lamekh membunuh untuk membela diri.
  rationale: Teks menyatakan pemicu tindakan, tetapi tidak secara tegas membenarkan atau menyebutnya sebagai pembelaan diri; ketegangan moralnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Paralelisme puitis dipertahankan melalui pasangan ‘dengarkanlah/simaklah’, ‘seorang laki-laki/seorang pemuda’, serta dua baris sebab yang sejajar.
