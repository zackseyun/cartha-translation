base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: id
  text: Lalu Yahweh berkata kepadanya, “Karena itu, siapa pun yang membunuh Kain, kepadanya akan dijatuhkan pembalasan tujuh kali lipat.” Lalu Yahweh memberi Kain suatu tanda[a], supaya siapa pun yang menjumpainya tidak memukulnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penanda.” Kata Ibrani ini dapat menunjuk pada tanda dalam arti luas; teks tidak menjelaskan bentuknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan konsisten dengan lapisan konsultasi proyek.
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menyatakan hubungan kesimpulan atau akibat dalam jawaban Yahweh dengan bahasa Indonesia yang alami.
- source_word: כָּל הֹרֵג קַיִן
  choice: siapa pun yang membunuh Kain
  rationale: Mencerminkan konstruksi generik dan cakupan universal ungkapan Ibrani.
- source_word: שִׁבְעָתַיִם יֻקָּם
  choice: kepadanya akan dijatuhkan pembalasan tujuh kali lipat
  rationale: Mempertahankan bentuk pasif serta menjelaskan secara wajar bahwa pembunuh Kain menjadi sasaran pembalasan, tanpa menyebut pelakunya secara eksplisit.
- source_word: אוֹת
  choice: tanda
  rationale: Kata ini mencakup tanda pengenal atau tanda perlindungan; bentuk konkretnya tidak disebutkan dalam teks.
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ כָּל מֹצְאוֹ
  choice: supaya siapa pun yang menjumpainya tidak memukulnya
  rationale: Menggabungkan tujuan negatif dan ungkapan partisipial secara alami, sambil menerjemahkan נכה sebagai 'memukul' dan tidak mempersempitnya menjadi 'membunuh'.
theological_decisions:
- issue: Sasaran pembalasan tujuh kali lipat
  choice: Pembalasan dijatuhkan kepada siapa pun yang membunuh Kain.
  alternative: “Ia akan dibalaskan tujuh kali lipat,” yang secara formal lebih dekat tetapi kabur dalam bahasa Indonesia.
  rationale: Konteks menunjukkan bahwa pembunuh Kain akan menerima pembalasan, sedangkan bentuk pasif Ibrani tidak menyatakan pelakunya.
- issue: Hakikat tanda pada Kain
  choice: Diterjemahkan sebagai “tanda” tanpa menentukan bentuk atau sifatnya.
  alternative: “Cap” atau “tanda khusus.”
  rationale: Teks tidak menjelaskan apakah tanda itu bersifat jasmani, simbolis, atau berbentuk lain; terjemahan tidak boleh memasukkan spekulasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami tanpa menghilangkan bentuk pasif pada ancaman pembalasan atau ketidakjelasan mengenai wujud tanda pada Kain.
