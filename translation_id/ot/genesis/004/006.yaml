  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: id
  text: Lalu Yahweh berkata kepada Kain, “Mengapa engkau marah, dan mengapa wajahmu muram[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengapa wajahmu jatuh?” Dapat juga diterjemahkan, “mengapa wajahmu tertunduk?”'
    reason: Menjelaskan metafora Ibrani נָפְלוּ פָנֶיךָ dan mencatat padanan idiomatis alternatif.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Lalu” menyatakan perkembangan narasi secara alami, sedangkan “berkata” menerjemahkan makna dasar אמר tanpa menambah nuansa yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶל קָיִן
  choice: kepada Kain
  rationale: Padanan Indonesia yang wajar untuk penerima perkataan; nama קָיִן mengikuti bentuk baku Indonesia, “Kain”.
- source_word: לָמָּה חָרָה לָךְ
  choice: Mengapa engkau marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan kemarahan sebagai sesuatu yang menyala, tetapi secara idiomatis berarti menjadi atau merasa marah. Padanan ini jelas dan alami.
- source_word: וְלָמָּה נָפְלוּ פָנֶיךָ
  choice: dan mengapa wajahmu muram
  rationale: Secara harfiah ungkapan ini berbunyi “wajahmu jatuh”, tetapi maksud idiomatisnya ialah wajah yang muram atau tertunduk. “Wajahmu muram” alami dalam bahasa Indonesia, sementara metafora aslinya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai dalam sapaan langsung agar alami dalam register Alkitab Indonesia tanpa menjadi arkais. Metafora Ibrani yang janggal jika diterjemahkan mentah dijelaskan dalam catatan kaki.
