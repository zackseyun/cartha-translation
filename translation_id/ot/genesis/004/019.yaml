id: GEN.4.19
reference: Genesis 4:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: id
  text: Lamekh mengambil bagi dirinya dua istri. Nama yang satu ialah Ada, dan nama yang lain ialah Zila.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Verba לקח secara dasar berarti 'mengambil'; bersama frasa 'bagi dirinya dua istri', konteks perkawinan sudah jelas tanpa perlu menggantinya dengan 'menikahi'.
- source_word: לוֹ
  choice: bagi dirinya
  rationale: Preposisi dengan sufiks ini menyatakan kepentingan pribadi dan di sini paling wajar dipahami secara refleksif.
- source_word: שְׁתֵּי נָשִׁים
  choice: dua istri
  rationale: נָשִׁים dapat berarti 'perempuan-perempuan' atau 'istri-istri', tetapi konstruksi dengan לקח dalam konteks ini merujuk pada perkawinan.
- source_word: שֵׁם הָאַחַת
  choice: Nama yang satu
  rationale: Mempertahankan rumusan penamaan dan kesejajaran Ibrani dengan bahasa Indonesia yang alami.
- source_word: עָדָה
  choice: Ada
  rationale: Nama diri ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: dan nama yang lain
  rationale: Secara harfiah הַשֵּׁנִית berarti 'yang kedua', tetapi karena hanya ada dua orang, 'yang lain' lebih alami dan tetap akurat dalam bahasa Indonesia.
- source_word: צִלָּה
  choice: Zila
  rationale: Nama diri ditransliterasikan secara wajar ke dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah susunan perkawinan poligini perlu dibuat eksplisit atau dinilai secara moral
  choice: Menyatakan bahwa Lamekh mengambil dua istri tanpa komentar moral tambahan
  alternative: Menerjemahkan 'dua perempuan' atau menambahkan penilaian atas tindakannya
  rationale: Ayat ini dengan jelas menuturkan adanya dua istri, tetapi tidak memberikan penilaian moral secara eksplisit; terjemahan tidak boleh menambahkan penilaian yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Ibrani dipertahankan sejauh tetap alami; 'yang lain' dipilih daripada 'yang kedua' untuk pasangan beranggotakan dua orang.
