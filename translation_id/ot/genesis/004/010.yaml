  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: id
  text: Lalu Ia berkata, “Apa yang telah kaulakukan? Suara darah[a] saudaramu berseru kepada-Ku dari tanah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk jamak, “darah-darah,” yang sering digunakan dalam konteks penumpahan darah; bahasa Indonesia biasanya memakai bentuk “darah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan naratif secara wajar tanpa menambahkan hubungan sebab-akibat.
- source_word: מֶה עָשִׂיתָ
  choice: Apa yang telah kaulakukan?
  rationale: Pertanyaan ini merupakan tuduhan langsung. Bentuk “telah kaulakukan” menyampaikan tindakan yang sudah selesai namun tetap memiliki bobot moral pada saat pembicaraan.
- source_word: קוֹל
  choice: Suara
  rationale: 'Pilihan ini mempertahankan personifikasi yang hidup: darah saudara Kain digambarkan memiliki suara yang berseru kepada Allah.'
- source_word: דְּמֵי
  choice: darah
  rationale: Bentuk Ibraninya jamak, tetapi dalam konteks penumpahan darah bentuk tersebut lazim bersifat idiomatis. Bahasa Indonesia secara alami memakai nomina massa tunggal “darah”; bentuk jamaknya dijelaskan dalam catatan kaki.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Hubungan konstruksi diterjemahkan secara alami dengan akhiran posesif bahasa Indonesia.
- source_word: צֹעֲקִים
  choice: berseru
  rationale: Partisipel jamak itu bersesuaian dengan bentuk Ibrani jamak דְּמֵי. Karena “darah” diterjemahkan sebagai nomina massa tunggal, “berseru” menjadi padanan alami dan tetap mempertahankan tindakan yang sedang berlangsung dalam gambaran tersebut.
- source_word: אֵלַי
  choice: kepada-Ku
  rationale: Ungkapan ini menunjukkan bahwa seruan itu ditujukan langsung kepada Allah. Kapitalisasi pronomina mengikuti kelaziman bahasa Indonesia untuk rujukan ilahi.
- source_word: מִן הָאֲדָמָה
  choice: dari tanah
  rationale: Dalam kisah Kain, אֲדָמָה menunjuk pada tanah tempat darah tertumpah dan berkaitan erat dengan motif tanah dalam konteks sekitarnya.
theological_decisions:
- issue: Personifikasi darah Habel yang tertumpah
  choice: Mempertahankan gambaran bahwa suara darah itu sendiri berseru kepada Allah.
  alternative: Menafsirkannya secara abstrak sebagai kesalahan karena penumpahan darah yang menuntut keadilan.
  rationale: Teks Ibrani memakai personifikasi yang kuat. Mempertahankannya menjaga daya moral dan teologis ayat tanpa mempersempit gambaran itu menjadi satu penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan personifikasi serta citra tanah dari teks Ibrani, sambil menggunakan bentuk yang alami bagi pembaca umum.
