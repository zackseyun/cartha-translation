  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: id
  text: Kain bersetubuh dengan istrinya,[a] lalu ia pun mengandung dan melahirkan Henokh. Kain sedang membangun sebuah kota,[b] dan ia menamai kota itu menurut nama anaknya, Henokh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kain mengenal istrinya”; dalam bahasa Ibrani, ungkapan ini merupakan idiom untuk hubungan seksual.
    reason: cultural_note
  - marker: b
    text: Konstruksi bahasa Ibrani dapat menunjukkan tindakan yang sedang berlangsung. Subjeknya tidak disebutkan secara eksplisit; terjemahan ini mengikuti pemahaman yang lazim bahwa yang membangun kota itu ialah Kain, meskipun ada yang menghubungkannya dengan Henokh.
    reason: textual_ambiguity
  - marker: c
    text: Secara lebih harfiah, “ia menyebut nama kota itu menurut nama anaknya, Henokh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: bersetubuh dengan
  rationale: Secara harfiah berarti 'mengenal', tetapi di sini merupakan idiom Ibrani untuk hubungan seksual. Padanan eksplisit ini alami dan tidak menimbulkan kesan bahwa Kain baru berkenalan dengan istrinya.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: אִשָּׁה dapat berarti 'perempuan' atau 'istri'; sufiks kepunyaan dan konteks perkawinan mendukung 'istrinya'.
- source_word: וַתַּהַר וַתֵּלֶד
  choice: mengandung dan melahirkan
  rationale: Menyampaikan urutan naratif secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: חֲנוֹךְ
  choice: Henokh
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: Pada waktu itu Kain sedang membangun sebuah kota
  rationale: Konstruksi היה dengan partisip בֹּנֶה dapat menyatakan tindakan yang sedang berlangsung. Nama 'Kain' diulangi untuk memperjelas subjek yang ambigu setelah penyebutan istri dan Henokh.
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: ia menamai kota itu menurut nama anaknya
  rationale: Merupakan padanan Indonesia yang alami bagi idiom harfiah 'memanggil nama kota itu menurut nama anaknya', sambil mempertahankan gagasan kesesuaian nama.
theological_decisions:
- issue: Subjek frasa וַיְהִי בֹּנֶה עִיר
  choice: Kain sedang membangun sebuah kota
  alternative: Henokh sedang membangun sebuah kota
  rationale: Bentuk maskulin tunggalnya sendiri dapat merujuk kepada Kain atau Henokh, tetapi kesinambungan subjek utama dalam rangkaian narasi paling wajar menunjuk kepada Kain. Ambiguitas gramatikalnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Terjemahan mengutamakan kejelasan idiom tanpa menghilangkan aspek progresif atau ambiguitas rujukan subjek dalam bahasa Ibrani; semua catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
