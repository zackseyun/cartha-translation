id: GEN.4.22
reference: Genesis 4:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: id
  text: Zila juga melahirkan Tubal-Kain[a], penempa segala perkakas tajam dari perunggu[b] dan besi. Saudara perempuan Tubal-Kain ialah Naama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pengasah/penempa bagi setiap perajin tembaga dan besi”; susunan bahasa Ibrani sesudah “Tubal-Kain” sulit dipastikan. Sebagian orang memahaminya sebagai keterangan bahwa ia seorang pekerja logam, bukan pembuat perkakas logam.
    reason: alternative_reading
  - marker: b
    text: “Perunggu” juga dapat diterjemahkan “tembaga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַם הִוא
  choice: juga
  rationale: Menyatakan bahwa Zila, seperti Ada sebelumnya, juga melahirkan seorang anak; kata ganti Ibrani tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Padanan alami dan tepat bagi ילד dalam konteks silsilah.
- source_word: תּוּבַל קַיִן
  choice: Tubal-Kain
  rationale: Nama diri ditransliterasikan dan tanda hubung mempertahankan bentuk majemuknya.
- source_word: לֹטֵשׁ
  choice: penempa
  rationale: Partisip ini dapat berarti orang yang menempa, memalu, atau mengasah; 'penempa' paling sesuai dengan konteks pengerjaan logam, sementara ketidakpastiannya dicatat dalam catatan kaki.
- source_word: כָּל חֹרֵשׁ
  choice: segala perkakas tajam
  rationale: Susunan Ibraninya sulit. Dalam konteks לֹטֵשׁ dan penyebutan logam, frasa ini dapat dipahami sebagai perkakas yang ditempa atau diasah, bukan para perajin; pilihan ini menghasilkan bahasa Indonesia yang jelas tanpa menyembunyikan alternatifnya.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah ini dapat menunjuk pada tembaga atau perunggu; 'perunggu' merupakan padanan konvensional dalam konteks logam kuno, dengan alternatif dicatat.
- source_word: בַרְזֶל
  choice: besi
  rationale: Padanan langsung dan baku bagi nama logam tersebut.
- source_word: אֲחוֹת
  choice: saudara perempuan
  rationale: Padanan kekerabatan yang tepat dan tidak ambigu dalam bahasa Indonesia.
- source_word: נַעֲמָה
  choice: Naama
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia.
theological_decisions: []
