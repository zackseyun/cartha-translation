  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: id
  text: Lalu Kain berkata kepada Yahweh[a], “Kesalahanku terlalu besar untuk kutanggung.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hukumanku terlalu berat untuk kutanggung”; kemungkinan lain, “Kesalahanku terlalu besar untuk diampuni.” Istilah Ibrani yang dipakai dapat menunjuk pada kesalahan atau hukuman akibatnya, sedangkan kata kerjanya dapat berarti “menanggung” atau, dalam konteks tertentu, “mengampuni.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif berwaw melanjutkan rangkaian peristiwa; “Lalu” alami dalam narasi bahasa Indonesia.
- source_word: קַיִן
  choice: Kain
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang disapa; “kepada” merupakan padanan Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: גָּדוֹל
  choice: terlalu besar
  rationale: Dalam konstruksi dengan מִן dan infinitif, kata sifat ini menyatakan sesuatu yang melampaui kemampuan untuk ditanggung.
- source_word: עֲוֺנִי
  choice: kesalahanku
  rationale: עָוֹן dapat menunjuk pada kesalahan, kesalahan yang mendatangkan rasa bersalah, atau hukuman akibat kesalahan. “Kesalahanku” mempertahankan arti moral utama tanpa menghapus kemungkinan makna lain.
- source_word: מִנְּשֹׂא
  choice: untuk kutanggung
  rationale: נָשָׂא berarti mengangkat, membawa, atau menanggung dan dalam konteks tertentu dapat berarti mengampuni. Bentuk “untuk kutanggung” menyampaikan konstruksi komparatif secara alami.
theological_decisions:
- issue: Ambiguitas עֲוֺנִי מִנְּשֹׂא
  choice: “Kesalahanku terlalu besar untuk kutanggung.”
  alternative: “Hukumanku terlalu berat untuk kutanggung,” atau “Kesalahanku terlalu besar untuk diampuni.”
  rationale: עָוֹן dapat berarti kesalahan, kesalahan sebagai beban rasa bersalah, atau hukuman akibat kesalahan; נָשָׂא dapat berarti menanggung dan, dalam konteks tertentu, mengampuni. Teks utama mempertahankan pengertian moral yang langsung, sedangkan catatan kaki menyajikan pembacaan lain yang sungguh dimungkinkan oleh bahasa Ibrani dan konteks penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kutanggung” menjaga ungkapan tetap ringkas dan alami. Nama “Yahweh” dipertahankan sebagai nama diri ilahi; penanda catatan kaki [a] muncul langsung dalam teks utama.
