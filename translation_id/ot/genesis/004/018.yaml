base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: id
  text: Henok mendapat seorang anak, Irad. Irad menjadi ayah dari Mehuyael[a], Mehuyael menjadi ayah dari Metusael, dan Metusael menjadi ayah dari Lamekh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam ayat ini, teks Ibrani memakai dua ejaan untuk nama yang sama: Mehuyael dan Mehiyael.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: Bagi Henok lahirlah
  rationale: Bentuk Nifal וַיִּוָּלֵד diterjemahkan secara pasif, sedangkan ל menandai orang tua yang baginya anak itu lahir. Susunan ini mempertahankan peralihan bentuk dari pasif ke aktif dalam bahasa Ibrani.
- source_word: עִירָד
  choice: Irad
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam silsilah ini, bentuk Qal aktif menyatakan tindakan memperoleh keturunan atau menjadi ayah dari seseorang. 'Memperanakkan' ringkas dan mempertahankan pola genealogis teks.
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: Mehuyael
  rationale: Teks Ibrani memakai dua ejaan bagi nama yang sama. Satu bentuk dipakai secara konsisten dalam teks utama, sementara perbedaan ejaan dicatat dalam catatan kaki.
- source_word: מְתוּשָׁאֵל
  choice: Metusael
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: לָמֶךְ
  choice: Lamekh
  rationale: Transliterasi mempertahankan konsonan akhir Ibrani כ (kh) dan membedakannya dari bunyi k biasa.
