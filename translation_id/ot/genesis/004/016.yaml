  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: id
  text: Lalu Kain pergi dari hadapan Yahweh dan menetap di tanah Nod[a], di sebelah timur Eden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Nod terdengar mirip dengan kata Ibrani yang berarti “mengembara,” sehingga menggemakan hukuman Kain yang disebutkan sebelumnya dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: pergi
  rationale: Bentuk wayyiqtol dari יצא menyatakan gerak keluar atau pergi. Dalam bahasa Indonesia modern, “pergi” secara alami menyampaikan keberangkatan Kain; arah menjauh tetap dinyatakan oleh frasa berikutnya.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Ungkapan ini secara harfiah berarti “dari depan/wajah.” “Dari hadapan” mempertahankan citra spasial-relasional bahasa Ibrani dan tidak menguraikannya secara berlebihan sebagai sekadar keadaan batin atau rohani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: ישב dapat berarti duduk, tinggal, atau menetap. Dalam konteks perpindahan ke suatu wilayah, “menetap” menyampaikan bahwa Kain mengambil tempat tinggal di sana.
- source_word: בְּאֶרֶץ נוֹד
  choice: di tanah Nod
  rationale: Nod berfungsi sebagai nama tempat sehingga ditransliterasikan. Kemungkinan permainan bunyinya dengan gagasan mengembara dijelaskan dalam catatan kaki.
- source_word: קִדְמַת עֵדֶן
  choice: di sebelah timur Eden
  rationale: Frasa ini menunjukkan lokasi di arah timur relatif terhadap Eden. Pilihan ini jelas dan wajar dalam bahasa Indonesia tanpa menambahkan rincian yang tidak pasti.
- source_word: עֵדֶן
  choice: Eden
  rationale: Nama tempat ini dipertahankan dalam bentuk transliterasi Indonesia yang lazim.
theological_decisions:
- issue: Cara menggambarkan kepergian Kain dalam hubungannya dengan Allah
  choice: Kain pergi dari hadapan Yahweh
  alternative: Kain pergi meninggalkan hadirat Yahweh
  rationale: “Dari hadapan” lebih dekat dengan idiom Ibrani dan mempertahankan ketegangan naratif mengenai keterasingan Kain. “Meninggalkan hadirat” dapat terdengar lebih interpretatif dan seolah-olah menetapkan bahwa seseorang dapat keluar dari kehadiran ilahi secara mutlak.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “dari hadapan Yahweh” sengaja sedikit formal untuk mempertahankan idiom dan ketegangan teologis teks Ibrani; “di sebelah timur Eden” dipilih demi kejelasan arah.
