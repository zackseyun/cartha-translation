id: GEN.4.14
reference: Genesis 4:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: id
  text: Lihat, hari ini Engkau telah mengusir aku dari permukaan tanah, dan aku akan tersembunyi dari hadapan-Mu.[a] Aku akan menjadi pengembara dan pelarian di bumi,[b] dan siapa pun yang menemukan aku akan membunuh aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aku akan menyembunyikan diri dari hadirat-Mu” atau “aku akan tersembunyi dari hadirat-Mu.” Secara harfiah, bahasa Ibrani berbunyi “dari wajah-Mu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di negeri.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Partikel wacana ini menarik perhatian dan memberi penekanan. “Lihat” alami dalam bahasa Indonesia modern serta mempertahankan kesegeraan ujaran.
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: Engkau telah mengusir aku
  rationale: Kata גרשׁ menyatakan tindakan menghalau atau mengeluarkan secara paksa; “mengusir” jelas, kuat, dan idiomatis.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari permukaan tanah
  rationale: Secara harfiah berarti “dari atas muka tanah.” “Permukaan tanah” mempertahankan gambaran Ibrani secara alami dan hubungan kontekstual dengan tanah yang dikutuk.
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: aku akan tersembunyi dari hadapan-Mu
  rationale: Bentuk Nifal mendukung arti pasif atau refleksif, “akan tersembunyi.” “Dari hadapan-Mu” merupakan ungkapan Indonesia yang wajar untuk idiom harfiah “dari wajah-Mu” dan tetap membawa makna keterasingan dari kehadiran Allah tanpa menentukan apakah Kain bersembunyi atau dibuat tersembunyi.
- source_word: נָע וָנָד
  choice: pengembara dan pelarian
  rationale: Pasangan istilah tersebut menggambarkan kehidupan yang terus berpindah dan terusir. Dua nomina dipertahankan agar kedua unsur Ibrani tidak dilebur menjadi satu.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri.” Dalam konteks purba dan cakupan pengembaraan Kain, “bumi” layak sebagai teks utama, sementara “negeri” dicatat sebagai alternatif.
- source_word: כָל מֹצְאִי
  choice: siapa pun yang menemukan aku
  rationale: Konstruksi כָל dengan partisip menyatakan cakupan tak tentu yang universal; “siapa pun” adalah padanan Indonesia yang alami.
- source_word: יַהַרְגֵנִי
  choice: akan membunuh aku
  rationale: הרג adalah verba umum untuk membunuh. Pilihan ini lugas dan modern tanpa meninggikan register secara tidak perlu.
theological_decisions:
- issue: Ungkapan kehadiran ilahi dalam וּמִפָּנֶיךָ אֶסָּתֵר
  choice: aku akan tersembunyi dari hadapan-Mu
  alternative: aku akan menyembunyikan diri dari hadirat-Mu / aku akan tersembunyi dari hadirat-Mu
  rationale: Teks Ibrani memakai bentuk Nifal yang dapat bernuansa pasif atau refleksif dan idiom konkret “dari wajah-Mu.” Terjemahan utama mempertahankan ambiguitas gramatikal melalui “tersembunyi” serta memakai “hadapan-Mu” sebagai idiom Indonesia yang dekat, tanpa memastikan mekanisme ketersembunyian atau merumuskan klaim doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kapitalisasi pada sapaan kepada Allah dipakai secara konsisten. Struktur kalimat mempertahankan urutan dan pengulangan sumber sejauh tetap alami dalam bahasa Indonesia.
