id: GEN.4.9
reference: Genesis 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑י/ךָ וַ/יֹּ֨אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲ/שֹׁמֵ֥ר אָחִ֖/י אָנֹֽכִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: id
  text: Lalu Yahweh berkata kepada Kain, “Di manakah Habel, saudaramu?” Kain menjawab, “Aku tidak tahu.[a] Apakah aku penjaga saudaraku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk verba Ibrani juga dapat dipahami sebagai penyangkalan mengenai masa lampau: “Aku tidak tahu [waktu itu].” Namun, dalam konteks percakapan ini, ungkapan tersebut secara alami menyatakan bahwa Kain mengaku tidak tahu pada saat ia menjawab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi (Tetragramaton) sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata / Kain menjawab
  rationale: Klausa pertama meneruskan alur narasi dengan “Lalu”; pada klausa kedua, “menjawab” menyampaikan fungsi ujaran dalam dialog secara alami tanpa mengubah isinya.
- source_word: אֵי
  choice: Di manakah
  rationale: Menyatakan pertanyaan tentang lokasi dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הֶבֶל
  choice: Habel
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan hubungan kekeluargaan maskulin yang jelas dari konteks tanpa menambahkan informasi tentang urutan usia.
- source_word: לֹא יָדַעְתִּי
  choice: Aku tidak tahu
  rationale: Walaupun bentuk perfektif Ibrani dapat dipahami sebagai penyangkalan pada masa lampau, dalam dialog ini ungkapan tersebut secara alami berfungsi sebagai pengakuan bahwa Kain tidak mengetahui keberadaan Habel saat itu.
- source_word: הֲשֹׁמֵר
  choice: penjaga
  rationale: Mencerminkan makna שמר, yaitu menjaga atau mengawasi, serta mempertahankan daya retoris pertanyaan Kain.
- source_word: אָחִי
  choice: saudaraku
  rationale: Menerjemahkan nomina dengan sufiks orang pertama tunggal secara langsung dan tidak menambahkan keterangan usia.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri ini memberi penekanan; dalam bahasa Indonesia, daya tekannya cukup tersampaikan melalui susunan pertanyaan retoris.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama diri tersebut dan menghindari penggantiannya dengan gelar.
- issue: Sifat pertanyaan Kain tentang tanggung jawab terhadap Habel
  choice: Apakah aku penjaga saudaraku?
  alternative: Apakah aku harus menjaga saudaraku?
  rationale: Terjemahan yang dipilih mempertahankan pertanyaan retoris dan ketegangannya tanpa menambahkan kata “harus”, yang akan memperjelas kewajiban secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Berkata” dipakai untuk tetap dekat dengan verba Ibrani yang umum, sedangkan “menjawab” memperjelas alur dialog. “Saudara” dipilih alih-alih “adik” agar terjemahan ayat ini tidak menambahkan urutan usia yang tidak dinyatakan dalam frasa tersebut.
