base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/002.yaml
  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: id
  text: Kemudian ia melahirkan lagi[a], yaitu Habel, saudara Kain. Habel menjadi gembala ternak[b], sedangkan Kain mengolah tanah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “terus melahirkan.” Ungkapan Ibrani ini secara harfiah memakai kata “menambahkan” untuk menyatakan tindakan yang diulangi atau dilanjutkan.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah ternak kecil, terutama domba dan kambing.
    reason: cultural_note
  - marker: c
    text: 'Secara lebih harfiah: “adalah seorang yang mengerjakan tanah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: Kemudian perempuan itu melahirkan lagi
  rationale: Ungkapan יסף + infinitif menyatakan pengulangan atau kelanjutan tindakan. 'Melahirkan lagi' menyampaikan urutan kelahiran secara alami; subjek perempuan itu dipertahankan dari konteks ayat sebelumnya.
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: yaitu Habel, adik Kain
  rationale: Frasa ini secara harfiah mengidentifikasi Habel sebagai saudara laki-laki Kain. Karena urutan kelahiran menunjukkan bahwa Habel lahir sesudah Kain, 'adik Kain' merupakan ungkapan Indonesia yang alami dan tepat dalam konteks.
- source_word: הֶבֶל
  choice: Habel
  rationale: Memakai bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וַיְהִי
  choice: menjadi
  rationale: Di sini היה memperkenalkan pekerjaan atau peranan Habel; 'menjadi' mempertahankan perkembangan naratif, meskipun 'adalah' juga mungkin.
- source_word: רֹעֵה צֹאן
  choice: gembala ternak
  rationale: רעה berarti menggembalakan, sedangkan צאן adalah ternak kecil secara kolektif, terutama domba dan kambing. 'Gembala ternak' cukup alami dan tidak mempersempit maknanya hanya menjadi domba.
- source_word: קַיִן
  choice: Kain
  rationale: Memakai bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: mengolah tanah
  rationale: עבד + אדמה berarti mengerjakan atau mengusahakan tanah. 'Mengolah tanah' alami dalam bahasa Indonesia dan mempertahankan unsur tanah tanpa menambahkan kategori pekerjaan modern seperti 'petani'.
- source_word: וְ
  choice: sedangkan
  rationale: Konjungsi Ibrani dasarnya berarti 'dan', tetapi di sini menghubungkan dua pekerjaan yang berbeda. 'Sedangkan' menyatakan perbandingan tanpa menyiratkan penilaian moral.
theological_decisions:
- issue: Penggambaran pekerjaan kedua saudara
  choice: Menyajikan kedua pekerjaan secara netral sebagai perbedaan peranan
  alternative: Memakai diksi yang secara halus meninggikan pekerjaan Habel atau Kain
  rationale: Ayat ini hanya menggambarkan pekerjaan mereka dan belum memberikan penilaian moral terhadap salah satunya.
- issue: Hubungan Habel dengan Kain
  choice: adik Kain
  alternative: saudara Kain
  rationale: אָחִיו sendiri berarti 'saudaranya', tetapi konteks kelahiran berurutan menjelaskan bahwa Habel adalah adik Kain. Pilihan ini tidak menyelesaikan ketegangan teologis, melainkan menyatakan hubungan keluarga secara wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. 'Sedangkan' menjaga perbandingan pekerjaan tanpa menciptakan pertentangan moral; 'tanah' mempertahankan kaitan leksikal dan tematis dengan אֲדָמָה dalam kisah awal Kejadian.
