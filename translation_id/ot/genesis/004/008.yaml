base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: id
  text: Kain berkata kepada Habel, saudaranya[a]. Ketika mereka berada di padang, Kain bangkit melawan Habel, saudaranya, lalu membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Masoret Ibrani hanya berbunyi, “Kain berkata kepada Habel, saudaranya,” tanpa mencantumkan isi perkataannya. Sejumlah saksi kuno, termasuk Septuaginta, Pentateukh Samaria, dan Vulgata, menambahkan, “Mari kita pergi ke padang.”
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Verba אָמַר lazimnya berarti “berkata”. Teks Masoret tidak memuat isi perkataan Kain, sehingga ketimpangan kalimat dipertahankan sesuai sumber utama.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah perkataan kepada Habel; “kepada” merupakan padanan Indonesia yang langsung dan alami.
- source_word: אָחִיו
  choice: adiknya
  rationale: Secara harfiah berarti “saudaranya”, tetapi konteks sebelumnya menunjukkan Habel adalah adik Kain. Pilihan ini alami dalam bahasa Indonesia dan pengulangannya mempertahankan penekanan naratif pada hubungan mereka.
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: Kemudian, ketika mereka berada
  rationale: Konstruksi ini membentuk latar waktu naratif. Padanan tersebut menyampaikan urutan dan keadaan temporal secara wajar tanpa menerjemahkan idiom Ibrani secara kaku.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה dapat berarti ladang, padang, atau daerah terbuka. “Di padang” tidak mengandaikan lahan pertanian dan sesuai dengan latar terbuka dalam narasi.
- source_word: וַיָּקָם ... אֶל
  choice: bangkit menyerang
  rationale: Ungkapan Ibrani secara harfiah berarti “bangkit terhadap”. “Bangkit menyerang” mempertahankan citra gerak sekaligus menjelaskan daya bermusuhan idiom itu dalam bahasa Indonesia modern.
- source_word: וַיַּהַרְגֵהוּ
  choice: lalu membunuhnya
  rationale: הרג berarti membunuh atau menewaskan. “Membunuhnya” adalah padanan langsung; “lalu” menyatakan urutan waw konsekutif secara alami.
theological_decisions:
- issue: Apakah perkataan Kain yang tidak terdapat dalam Teks Masoret perlu dimasukkan ke teks utama
  choice: 'Mempertahankan bacaan pendek Teks Masoret dalam teks utama: “Kain berkata kepada Habel, adiknya.”'
  alternative: Memasukkan “Mari kita pergi ke padang,” sebagaimana didukung Septuaginta, Pentateukh Samaria, dan Vulgata.
  rationale: Sumber bahasa asli yang ditetapkan adalah WLC, dan teks itu tidak memuat isi perkataan Kain. Karena sejumlah saksi kuno memberikan klausa yang membuat narasi lebih lengkap dan mungkin mempertahankan bacaan awal, varian tersebut dicatat dalam catatan kaki tanpa diam-diam dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “Habel, adiknya” dipertahankan untuk membawa penekanan teks Ibrani. Penanda catatan ditempatkan sesudah “Kemudian” agar tidak mengganggu kalimat pertama yang memang terputus dalam Teks Masoret.
