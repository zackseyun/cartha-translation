  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: id
  text: Namun, Kain dan persembahannya tidak dipandang-Nya dengan berkenan.[a] Karena itu, Kain menjadi sangat marah, dan wajahnya muram.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak mengindahkan Kain dan persembahannya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “wajahnya jatuh,” ungkapan yang menunjukkan bahwa ia menjadi muram atau kehilangan semangat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל
  choice: Kain dan persembahannya
  rationale: Preposisi אֶל yang diulang menandai kedua objek dari tindakan שָׁעָה. Dalam bahasa Indonesia, pengulangan preposisinya tidak diperlukan; kedua objek dapat dirangkaikan secara alami tanpa menghilangkan penekanan bahwa tanggapan itu menyangkut Kain maupun persembahannya.
- source_word: מִנְחָה
  choice: persembahan
  rationale: Dalam konteks pemberian kepada TUHAN, 'persembahan' merupakan padanan modern yang jelas dan bernuansa ibadah, tanpa mempersempit jenis persembahan melebihi teks.
- source_word: לֹא שָׁעָה
  choice: tidak dipandang-Nya dengan berkenan
  rationale: שָׁעָה menyatakan memandang atau memberi perhatian, dan dalam konteks ini mengandung nuansa penerimaan atau perkenanan. Bentuk ini mempertahankan citra 'memandang' sekaligus menyampaikan bahwa perkenanan ditahan; sufiks -Nya menjadikan TUHAN, subjek tersirat dari ayat sebelumnya, jelas secara alami.
- source_word: וַיִּחַר ... מְאֹד
  choice: menjadi sangat marah
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan menyala atau terbakar, tetapi 'menjadi sangat marah' menyampaikan permulaan dan kuatnya kemarahan secara jelas dalam bahasa Indonesia modern.
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: wajahnya muram
  rationale: Ungkapan harfiah 'wajahnya jatuh' menggambarkan perubahan wajah yang tampak karena kesal atau sedih. 'Wajahnya muram' alami dalam bahasa Indonesia dan tidak membatasi emosi itu hanya pada kesedihan.
theological_decisions:
- issue: Sifat tanggapan ilahi terhadap Kain dan persembahannya
  choice: Menyatakan bahwa Kain dan persembahannya tidak dipandang dengan berkenan, tanpa menerangkan alasan penolakan.
  alternative: Menerjemahkan secara lebih tegas sebagai 'tidak diterima-Nya'.
  rationale: Teks menyatakan tidak adanya pandangan atau perhatian yang berkenan, tetapi ayat ini sendiri tidak menjelaskan sebabnya. Terjemahan mempertahankan ketegangan tersebut dan tidak memasukkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Namun' mempertahankan kontras dengan ayat sebelumnya; 'dengan berkenan' menjaga nuansa perkenanan ilahi tanpa mengganti verba dengan istilah teologis yang lebih tegas seperti 'menerima'.
