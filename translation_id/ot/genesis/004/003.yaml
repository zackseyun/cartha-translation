id: GEN.4.3
reference: Genesis 4:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: id
  text: Sesudah beberapa waktu[a], Kain membawa sebagian hasil tanah sebagai persembahan kepada Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada akhir hari-hari”; maksudnya, sesudah suatu jangka waktu berlalu.'
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani יהוה (YHWH), yang juga lazim diterjemahkan “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים
  choice: Sesudah beberapa waktu
  rationale: Ungkapan naratif ini secara harfiah menyebut ‘pada akhir hari-hari’, tetapi dalam konteks menyatakan berlalunya suatu jangka waktu. Terjemahan ini alami dalam bahasa Indonesia dan tidak memberi kesan eskatologis.
- source_word: וַיָּבֵא
  choice: membawa
  rationale: Bentuk hifil dari בוא berarti membawa atau menghadirkan sesuatu; ‘membawa’ mempertahankan tindakan konkret dalam narasi.
- source_word: קַיִן
  choice: Kain
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: מִפְּרִי הָאֲדָמָה
  choice: sebagian hasil tanah
  rationale: מִן menunjukkan bahwa persembahan itu diambil dari hasil tanah, sedangkan פְּרִי dalam konteks pertanian mencakup hasil atau produksi tanah, tidak terbatas pada buah dalam arti sempit.
- source_word: מִנְחָה
  choice: sebagai persembahan
  rationale: מִנְחָה dapat berarti pemberian, upeti, atau persembahan. Dalam konteks pemberian kepada Allah, ‘persembahan’ paling jelas tanpa menentukan jenis ritual yang tidak dinyatakan teks.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menyatakan penerima persembahan, dan nama ilahi יהוה ditransliterasikan ‘Yahweh’ agar nama perjanjian dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi יהוה. Transliterasi ‘Yahweh’ mempertahankan perbedaan antara nama ini dan gelar אֲדֹנָי (‘Tuhan’).
- issue: Makna מִקֵּץ יָמִים
  choice: 'ungkapan waktu biasa: ‘sesudah beberapa waktu’'
  alternative: ‘pada akhir hari-hari’
  rationale: Konteks berbicara tentang waktu yang berlalu sebelum Kain membawa persembahan, bukan tentang akhir zaman. Makna idiomatis dipakai, sementara bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. ‘Hasil tanah’ dipilih karena lebih alami dan lebih luas daripada ‘buah tanah’, sedangkan susunan kalimat tetap mengikuti alur narasi Ibrani.
