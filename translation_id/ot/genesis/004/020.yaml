  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: id
  text: Ada melahirkan Yabal. Dialah bapak orang-orang yang tinggal dalam kemah dan memelihara ternak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “leluhur orang-orang yang tinggal dalam kemah dan memelihara ternak.” Dalam bahasa Ibrani, “bapak” di sini dapat berarti leluhur, perintis, atau tokoh yang mengawali suatu pola hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk Qal wayyiqtol dari ילד dalam silsilah menyatakan bahwa Ada melahirkan Yabal; ungkapan ini ringkas dan alami dalam bahasa Indonesia.
- source_word: עָדָה
  choice: Ada
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia yang sederhana dan lazim.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Partikel ini menandai יָבָל sebagai objek langsung dan tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: יָבָל
  choice: Yabal
  rationale: Nama diri ditransliterasikan dengan Y untuk mewakili konsonan Ibrani yod secara jelas dalam bahasa Indonesia.
- source_word: הוּא הָיָה
  choice: Dialah
  rationale: Gabungan pronomina dan היה mengidentifikasi Yabal serta perannya. 'Dialah' menyampaikan penekanan identifikatif dengan alami tanpa harus menambahkan gagasan bahwa ia 'menjadi' demikian.
- source_word: אֲבִי
  choice: bapak
  rationale: Pilihan ini mempertahankan metafora Ibrani. Dalam konteks ini, 'bapak' dapat menunjuk pada leluhur, perintis, atau tokoh asal suatu pola hidup; keluasan maknanya dijelaskan dalam catatan kaki.
- source_word: יֹשֵׁב אֹהֶל
  choice: orang-orang yang tinggal dalam kemah
  rationale: Partisip tunggal memiliki makna kolektif, sehingga bentuk jamak 'orang-orang' memperjelas bahwa yang dimaksud ialah suatu golongan yang bercirikan kehidupan dalam kemah.
- source_word: וּמִקְנֶה
  choice: dan memiliki ternak
  rationale: מִקְנֶה berarti ternak atau kawanan hewan. Penambahan verba 'memiliki' membuat rangkaian nomina Ibrani dapat dipahami secara alami dalam bahasa Indonesia tanpa membatasinya hanya pada sapi.
