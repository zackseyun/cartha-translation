base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: id
  text: Sekarang, terkutuk dari tanah engkau, yang telah membuka mulutnya untuk menerima dari tanganmu darah saudaramu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah-darah saudaramu”; bentuk jamak ini merupakan ungkapan Ibrani yang dapat menunjuk pada darah yang tertumpah atau pertumpahan darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Gabungan ini mempertahankan unsur penghubung dan penanda waktu, serta memperkenalkan akibat langsung dari perbuatan Kain secara wajar dalam bahasa Indonesia.
- source_word: אָרוּר אָתָּה
  choice: engkau terkutuk
  rationale: Susunan ini menyampaikan keadaan Kain sebagai orang yang terkena kutuk dengan bahasa Indonesia yang jelas dan tetap khidmat.
- source_word: מִן הָאֲדָמָה
  choice: dari tanah
  rationale: Pilihan ini mengikuti nilai dasar preposisi מִן dan sebisa mungkin mempertahankan ketaksaan antara asal/sumber kutuk dan keterpisahan dari tanah, tanpa menetapkan salah satunya dalam teks utama.
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: yang telah membuka mulutnya
  rationale: Klausa ini mempertahankan personifikasi tanah. Bentuk 'telah membuka' menghubungkan tindakan tanah yang sudah terjadi dengan kutuk yang kini dinyatakan.
- source_word: לָקַחַת
  choice: untuk menerima
  rationale: Dalam gambaran tanah yang menampung darah yang tertumpah, 'menerima' terdengar alami tanpa menghilangkan citra Ibrani.
- source_word: דְּמֵי אָחִיךָ
  choice: darah saudaramu
  rationale: Bentuk jamak harfiah 'darah-darah' merupakan idiom Ibrani yang dalam konteks ini menunjuk pada darah yang tertumpah atau pertumpahan darah; bentuk tunggal paling alami dalam bahasa Indonesia.
- source_word: מִיָּדֶךָ
  choice: dari tanganmu
  rationale: Ungkapan harfiah ini mempertahankan gambaran yang kuat tentang tanggung jawab langsung Kain.
theological_decisions:
- issue: Hubungan kutuk Kain dengan tanah
  choice: Memakai 'dari tanah' dan menjelaskan ketaksaan dalam catatan kaki
  alternative: '''oleh tanah'' atau ''dijauhkan dari tanah'''
  rationale: Preposisi מִן dapat menyatakan sumber maupun pemisahan. Teks utama tidak memutuskan apakah tanah merupakan sumber/pelaksana kutuk atau apakah Kain dijauhkan darinya; konteks berikutnya dapat mengembangkan akibatnya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti 'engkau' dipakai karena tuturan bersifat langsung dan bernada ilahi. Personifikasi tanah dipertahankan, sementara ketaksaan preposisi Ibrani tidak diselesaikan secara sepihak.
