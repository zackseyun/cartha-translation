  terminology: '''Terkutuk'', ''tanah'', ''darah saudaramu'', dan ''tanganmu'' sesuai register Alkitab bahasa Indonesia modern yang khidmat. Catatan tentang bentuk jamak ''darah-darah'' tepat. Catatan pertama perlu diperbaiki secara idiomatis (''sumber atau lingkup kutuk'') dan dibuat lebih ringkas.'
