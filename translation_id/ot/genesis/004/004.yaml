  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: id
  text: Habel juga membawa sebagian anak-anak sulung dari kawanan ternaknya, beserta bagian-bagian lemak dari hewan-hewan itu.[a] Yahweh memandang dengan berkenan kepada Habel dan persembahannya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan dari lemak hewan-hewan itu”; yang dimaksud kemungkinan besar ialah bagian-bagian lemak pilihan dari hewan-hewan yang dipersembahkan.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֶבֶל
  choice: Habel juga
  rationale: Konjungsi naratif וְ diterjemahkan secara wajar dalam hubungan dengan tindakan Kain pada ayat sebelumnya, sedangkan גַם הוּא dinyatakan dengan ‘juga’.
- source_word: הֵבִיא
  choice: membawa
  rationale: Bentuk kausatif dari בוא dalam konteks pemberian atau kurban lazim berarti membawa; pilihan ini tidak menambahkan gagasan penyerahan resmi yang tidak dinyatakan secara eksplisit.
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: beberapa anak sulung dari kawanan ternaknya
  rationale: 'Konstruksi dengan מִן bersifat partitif: Habel membawa sebagian dari antara anak-anak sulung kawanannya, bukan seluruhnya.'
- source_word: וּמֵחֶלְבֵהֶן
  choice: beserta bagian-bagian lemak dari hewan-hewan itu
  rationale: חֵלֶב menunjuk pada lemak, khususnya bagian lemak hewan yang bernilai dalam konteks persembahan. Terjemahan ini mempertahankan makna konkret tanpa mengubahnya langsung menjadi ‘bagian terbaik’.
- source_word: וַיִּשַׁע
  choice: mengindahkan
  rationale: Kata kerja ini menyatakan bahwa Yahweh berpaling atau memandang dengan perhatian yang positif. ‘Mengindahkan’ menyiratkan tanggapan baik tanpa menjelaskan mekanisme penerimaannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֶל הֶבֶל וְאֶל מִנְחָתוֹ
  choice: Habel dan persembahannya
  rationale: Pengulangan אֶל menempatkan Habel maupun persembahannya sebagai sasaran tanggapan Yahweh; susunan objek langsung lebih alami dalam bahasa Indonesia.
- source_word: מִנְחָתוֹ
  choice: persembahannya
  rationale: מִנְחָה adalah pemberian atau persembahan; ‘persembahan’ paling sesuai dengan konteks ibadah ini tanpa mempersempit jenisnya.
theological_decisions:
- issue: Sifat tanggapan ilahi dalam וַיִּשַׁע
  choice: Yahweh ‘mengindahkan’ Habel dan persembahannya.
  alternative: Yahweh ‘memandang Habel dan persembahannya dengan berkenan’ atau ‘menerima’ keduanya.
  rationale: Bahasa Ibrani menunjukkan perhatian yang positif, tetapi tidak menerangkan bagaimana hal itu dinyatakan. ‘Mengindahkan’ mempertahankan tanggapan positif tanpa menambahkan mekanisme ataupun menyamakannya secara eksplisit dengan penerimaan ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kawanan ternaknya’ dipakai agar צֹאן tetap mencakup ternak kecil seperti domba dan kambing. Koma penutup dipertahankan karena kalimat berlanjut ke ayat berikutnya.
