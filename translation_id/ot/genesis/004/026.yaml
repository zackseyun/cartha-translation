base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: id
  text: Bagi Set juga lahirlah seorang anak laki-laki, dan ia menamainya Enos. Pada waktu itu orang mulai[a] memanggil nama Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, dengan bentuk pasif: “Pada waktu itu mulailah dipanggil nama Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Sebagian kecil penafsir memahami kata yang diterjemahkan “mulai” dalam arti “dinajiskan”, sehingga bagian ini dapat berarti: “Pada waktu itu orang mulai menajiskan nama Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: Bagi Set juga lahirlah seorang anak laki-laki
  rationale: Ungkapan ini mempertahankan Set sebagai pihak yang menerima kelahiran dan tetap mencerminkan bentuk pasif יֻלַּד, tetapi terdengar alami dalam bahasa Indonesia.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: dan ia menamainya Enos
  rationale: Idiom Ibrani harfiah 'memanggil namanya' dinyatakan secara wajar sebagai 'menamainya'; subjek laki-laki tunggal paling alami merujuk kepada Set. Bentuk nama 'Enos' mengikuti transliterasi Indonesia yang lazim.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Frasa ini menyatakan waktu dan lebih jelas dalam bahasa Indonesia daripada sekadar 'kemudian'.
- source_word: הוּחַל
  choice: orang mulai
  rationale: Bentuk Hofal secara harfiah bersifat pasif dan impersonal, 'mulailah dilakukan'; bahasa Indonesia alami memakai subjek umum 'orang'. Kemungkinan makna 'dinajiskan' dipertahankan dalam catatan kaki.
- source_word: לִקְרֹא בְּשֵׁם
  choice: berseru kepada nama
  rationale: Dalam konteks ini idiom tersebut paling mungkin menunjuk pada pemanggilan atau permohonan dalam ibadah. 'Berseru kepada nama' mempertahankan unsur idiom Ibraninya tanpa mempersempitnya menjadi sekadar 'menyembah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar 'TUHAN'.
theological_decisions:
- issue: Makna הוּחַל לִקְרֹא בְּשֵׁם יְהוָה
  choice: orang mulai berseru kepada nama Yahweh
  alternative: mulailah orang menajiskan nama Yahweh
  rationale: Pembacaan inkoatif 'mulai' dan idiom 'berseru kepada nama' paling sesuai dengan pemakaian ungkapan ini di bagian lain Kitab Kejadian. Namun, bentuk הוּחַל dapat dikaitkan dengan akar yang berarti 'menajiskan', sehingga tafsiran minoritas itu dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk pasif pada berita kelahiran, nama ilahi Yahweh, serta ambiguitas nyata pada klausa terakhir melalui catatan kaki.
