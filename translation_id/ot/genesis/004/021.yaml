  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: id
  text: Nama saudaranya ialah Yubal. Dialah bapak[c] semua orang yang memainkan[a] kecapi dan seruling[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memegang kecapi dan seruling.” Kata Ibrani ini secara harfiah berarti “memegang” atau “menangani”, tetapi dalam konteks ini maksudnya ialah memainkan alat musik.
    reason: lexical_alternative
  - marker: b
    text: Alat musik yang dimaksud oleh kata Ibrani עוּגָב tidak diketahui dengan pasti; kata itu dapat juga diterjemahkan “suling” atau “alat musik tiup”.
    reason: lexical_alternative
  - marker: c
    text: “Bapak” di sini kemungkinan berarti leluhur, pelopor, atau perintis kelompok pemain alat-alat musik tersebut, bukan ayah kandung langsung dari setiap pemain musik.
    reason: cultural_note
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: Nama saudaranya ialah
  rationale: Mengungkapkan susunan Ibrani secara alami dalam bahasa Indonesia; pronomina merujuk kepada Yabal pada ayat sebelumnya.
- source_word: יוּבָל
  choice: Yubal
  rationale: Transliterasi nama Ibrani yang lazim dan sesuai dengan ejaan bahasa Indonesia.
- source_word: הוּא הָיָה
  choice: Dialah
  rationale: Menyampaikan penegasan oleh pronomina הוּא bersama verba הָיָה secara ringkas dan alami.
- source_word: אֲבִי כָל
  choice: bapak semua orang
  rationale: Mempertahankan ungkapan metaforis Ibrani tentang pelopor atau asal suatu kelompok, dengan penjelasan dalam catatan kaki.
- source_word: תֹּפֵשׂ
  choice: memainkan
  rationale: Secara harfiah berarti memegang atau menangani, tetapi bersama alat musik menunjuk pada tindakan memainkannya.
- source_word: כִּנּוֹר
  choice: kecapi
  rationale: Padanan Indonesia yang mudah dipahami untuk alat musik petik kuno sejenis lyra, tanpa memakai istilah teknis yang kurang lazim.
- source_word: עוּגָב
  choice: seruling
  rationale: Menunjuk secara umum pada alat musik tiup; bentuk tepat alat kuno tersebut tidak pasti dan dijelaskan dalam catatan.
