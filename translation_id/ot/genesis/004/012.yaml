base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: id
  text: Ketika engkau menggarap tanah[a], tanah itu tidak akan lagi memberikan kekuatannya kepadamu[b]. Engkau akan menjadi pengembara dan pelarian[c] di bumi[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sebab ketika engkau menggarap tanah” atau “Jika engkau menggarap tanah.” Konjungsi Ibraninya dapat dipahami sebagai kausal, temporal, atau kondisional.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanah itu tidak akan melanjutkan pemberian kekuatannya kepadamu.” “Kekuatannya” merujuk pada daya produktif tanah.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seorang yang mengembara dan berpindah-pindah.” Kedua istilah Ibraninya bertumpang tindih dan mempertegas keadaan Kain yang tidak menetap. Pasangan ini juga dapat diterjemahkan “seorang yang gelisah dan terusir.”
    reason: lexical_alternative
  - marker: d
    text: Atau “di negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Konjungsi ini dapat dipahami secara temporal atau kondisional dalam konteks mendatang. “Apabila” mempertahankan keluwesan itu tanpa menjadikannya semata-mata kausal.
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: engkau menggarap tanah
  rationale: עבד dengan objek אֲדָמָה berarti mengusahakan atau mengolah tanah. “Menggarap tanah” alami dalam bahasa Indonesia dan sesuai dengan pekerjaan Kain sebagai petani.
- source_word: לֹא־תֹסֵף תֵּת
  choice: tidak akan lagi memberikan
  rationale: Konstruksi יסף dengan infinitif menyatakan bahwa suatu tindakan tidak berlanjut lagi. Terjemahan ini mempertahankan bentuk pemberian yang eksplisit dalam teks Ibrani.
- source_word: כֹּחָהּ
  choice: kekuatannya
  rationale: Secara harfiah berarti “kekuatannya”; dalam konteks, yang dimaksud ialah daya produktif atau kesuburan tanah. Metafora sumber dipertahankan.
- source_word: נָע וָנָד
  choice: pengembara yang terus berpindah-pindah
  rationale: Kedua istilah bertumpang tindih dan bersama-sama menegaskan keadaan tanpa tempat menetap. Ungkapan Indonesia ini mempertahankan intensifikasi tanpa memberi kesan kriminal yang tidak dinyatakan secara pasti oleh istilah kedua.
- source_word: בָאָרֶץ
  choice: di bumi
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri.” Dalam konteks purba Kejadian, “bumi” merupakan pilihan utama, sementara kemungkinan lokal dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan hukuman atas Kain
  choice: Hukuman mencakup kegagalan tanah menghasilkan daya produktifnya bagi Kain dan kehidupan yang tidak menetap.
  alternative: Kegelisahan psikologis semata atau pembuangan yang hanya terbatas pada suatu wilayah.
  rationale: Teks menyandingkan akibat pertanian dengan keadaan נָע וָנָד. Terjemahan mempertahankan kedua dimensi itu tanpa memasukkan kategori doktrinal yang tidak disebutkan.
- issue: Hubungan klausa pembuka
  choice: Diterjemahkan “Apabila” untuk mempertahankan nuansa temporal-kondisional.
  alternative: “Sebab ketika” sebagai hubungan kausal, atau “Jika” sebagai syarat yang lebih tegas.
  rationale: כִּי memungkinkan beberapa hubungan wacana; konteks tidak mengharuskan satu nuansa dipastikan secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai sesuai register narasi ilahi; “menggarap tanah” mudah dipahami dan tetap konkret. Susunan “tanah itu” menghindari ketidakjelasan rujukan pronomina, sedangkan semua alternatif penting yang berasal dari ambiguitas Ibrani dipertahankan dalam catatan kaki.
