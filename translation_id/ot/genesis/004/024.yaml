  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: id
  text: Sebab Kain akan dibalaskan tujuh kali lipat[a], dan Lamekh tujuh puluh tujuh kali lipat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dibalaskan”; bentuk verba Ibrani dapat menyatakan pembalasan sebagai suatu kepastian umum atau sebagai sesuatu yang pasti akan terjadi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tujuh puluh dan tujuh,” yaitu tujuh puluh tujuh kali lipat; bukan “tujuh puluh kali tujuh.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi kesombongan Lamekh dalam ayat sebelumnya; “sebab” mempertahankan hubungan logis tersebut secara alami.
- source_word: שִׁבְעָתַיִם
  choice: tujuh kali lipat
  rationale: Bentuk ini menyatakan ukuran pembalasan tujuh kali lipat dan mempertahankan kesejajaran puitis dengan angka berikutnya.
- source_word: יֻקַּם
  choice: akan dibalaskan
  rationale: Bentuk Hofal dari נקם bersifat pasif dan dapat menyatakan pembalasan yang dipastikan akan terjadi. Bentuk mendatang alami dalam bahasa Indonesia dan tetap mempertahankan kepastian tersebut.
- source_word: קָיִן
  choice: Kain
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְלֶמֶךְ
  choice: tetapi Lamekh
  rationale: Konjungsi menghubungkan sekaligus mengontraskan tingkat pembalasan bagi Kain dan Lamekh; “tetapi” membuat peningkatan retorisnya jelas tanpa mengubah isinya.
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: tujuh puluh tujuh kali lipat
  rationale: Ungkapan ini secara harfiah berarti “tujuh puluh dan tujuh”; dalam konteks ini, “tujuh puluh tujuh kali lipat” alami dan mempertahankan paralel dengan “tujuh kali lipat.”
theological_decisions:
- issue: Bentuk waktu pembalasan terhadap Kain
  choice: akan dibalaskan
  alternative: dibalaskan
  rationale: Bentuk verba Ibrani dapat dipahami secara gnomik atau sebagai masa depan yang pasti. Terjemahan utama memakai bentuk mendatang, sementara kemungkinan ungkapan kepastian umum dicatat dalam catatan kaki.
- issue: Nilai angka dalam rumusan pembalasan Lamekh
  choice: tujuh puluh tujuh kali lipat
  alternative: tujuh puluh kali tujuh
  rationale: Konstruksi Ibrani paling wajar berarti tujuh puluh tujuh, bukan tujuh puluh dikali tujuh. Pilihan ini juga menghindari pengimporan rumusan dari Matius 18:22.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. “Dibalaskan” mempertahankan bentuk pasif teks Ibrani, sedangkan “kali lipat” menyampaikan peningkatan kadar pembalasan dengan jelas bagi pembaca umum.
