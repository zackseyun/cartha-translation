source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: id
  text: Jika engkau berbuat baik, bukankah engkau akan diterima?[a] Namun, jika engkau tidak berbuat baik, dosa sedang mengintai di ambang pintu; hasratnya tertuju kepadamu,[b][c] tetapi engkau harus menguasainya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “pengangkatan”; maksudnya mungkin wajah Kain akan terangkat atau ia akan diterima.
    reason: lexical_alternative
  - marker: b
    text: Atau, “kurban penghapus dosa berbaring di ambang pintu,” meskipun gambaran langsungnya lebih alami menunjukkan dosa yang dipersonifikasikan sebagai binatang yang mengintai.
    reason: alternative_reading
  - marker: c
    text: Atau, “kerinduannya” atau “dorongannya.” Bandingkan ungkapan serupa dalam Kejadian 3:16.
    reason: cross_reference
  - marker: d
    text: Atau, “engkau akan menguasainya” atau “engkau dapat menguasainya.” Bahasa Ibrani dapat dipahami sebagai desakan, prediksi, atau kemungkinan.
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: berbuat baik
  rationale: Bentuk hifil dari יטב di sini menunjuk pada tindakan yang baik atau benar, bukan sekadar keadaan perasaan; pilihan ini juga mempertahankan susunan bersyarat yang ringkas.
- source_word: שְׂאֵת
  choice: engkau akan diterima
  rationale: Kata ini secara harfiah berkaitan dengan tindakan 'mengangkat', tetapi dalam konteks ini kemungkinan menyiratkan wajah Kain yang terangkat atau penerimaan oleh Allah. Ungkapan Indonesia ini menyampaikan makna kontekstual dengan wajar, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: לַפֶּתַח
  choice: di depan pintu
  rationale: Frasa lokatif ini menggambarkan dosa sebagai ancaman yang berada pada ambang atau tepat di luar pintu.
- source_word: חַטָּאת
  choice: dosa
  rationale: Walaupun kata ini juga dapat berarti 'kurban penghapus dosa', gambaran dengan kata 'mengendap' lebih alami bila dosa dipersonifikasikan seperti binatang pemangsa.
- source_word: רֹבֵץ
  choice: sedang mengendap
  rationale: Partisip ini menggambarkan binatang yang merunduk atau berbaring menanti mangsa; 'sedang mengendap' mempertahankan kesan ancaman yang aktif dan dekat.
- source_word: תְּשׁוּקָתוֹ
  choice: hasratnya
  rationale: Kata benda ini berarti hasrat atau kerinduan. 'Hasrat' mempertahankan hubungan leksikal dengan Kejadian 3:16 tanpa menentukan secara berlebihan sifat persisnya.
- source_word: תִּמְשָׁל בּוֹ
  choice: engkau harus menguasainya
  rationale: Bentuk imperfek Ibrani dapat bernuansa perintah, prediksi, atau kemungkinan. Dalam konteks teguran ini, 'harus' menyampaikan dorongan moral tanpa mengubahnya menjadi jaminan hasil atau pernyataan tegas tentang kemampuan.
theological_decisions:
- issue: Apakah klausa terakhir menjanjikan bahwa Kain akan menguasai dosa, memerintahkannya untuk menguasai dosa, atau menyatakan bahwa ia mampu melakukannya
  choice: engkau harus menguasainya
  alternative: engkau akan menguasainya; engkau dapat menguasainya
  rationale: Konteksnya berupa peringatan dan teguran Allah kepada Kain, sehingga bacaan yang bersifat desakan paling sesuai untuk teks utama. Namun, ketaksaan bentuk imperfek Ibrani dipertahankan melalui catatan kaki agar teks tidak menetapkan secara mutlak janji deterministis ataupun suatu ajaran tertentu tentang kemampuan manusia.
- issue: Apakah חַטָּאת berarti dosa yang dipersonifikasikan atau kurban penghapus dosa
  choice: dosa yang dipersonifikasikan sebagai sesuatu yang mengendap
  alternative: kurban penghapus dosa terbaring di depan pintu
  rationale: Predikat רֹבֵץ menghasilkan gambaran yang paling alami tentang dosa sebagai binatang yang mengendap, tetapi makna kultis חַטָּאת memang mungkin secara leksikal dan karena itu dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. 'Mengendap' menjaga metafora pemangsa secara alami; 'diterima' mengutamakan kejelasan sambil mempertahankan arti harfiah yang diperdebatkan dalam catatan kaki. Urutan penanda catatan kaki dibuat mengikuti kemunculannya dalam teks utama.
