  to: Jika engkau berbuat baik, bukankah engkau akan diterima?[a] Namun, jika engkau tidak berbuat baik, dosa sedang mengintai di ambang pintu; hasratnya tertuju kepadamu,[b][c] tetapi engkau harus menguasainya.[d]
