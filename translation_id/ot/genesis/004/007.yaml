  terminology: “Berbuat baik,” “diterima,” “dosa,” “hasrat,” dan “menguasainya” sesuai untuk Bahasa Indonesia modern. “Kurban penghapus dosa” dipertahankan sebagai alternatif leksikal untuk חַטָּאת, tanpa menjadikannya pembacaan utama. Catatan kaki mempertahankan ketaksaan שְׂאֵת dan תִּמְשָׁל בּוֹ.
