  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: id
  text: Allah melihat segala yang telah dibuat-Nya, dan sungguh, semuanya itu sangat baik. Jadilah petang dan jadilah pagi, hari keenam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה paling langsung diterjemahkan “melihat”; dalam konteks ini terkandung penilaian, tetapi terjemahan tidak perlu mempersempitnya menjadi “menilai”.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1 nomina berbentuk jamak ini berpadanan dengan verba tunggal dan menunjuk kepada Sang Pencipta yang esa; “Allah” merupakan sebutan baku bagi God dalam bahasa Indonesia.
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: segala yang telah dibuat-Nya
  rationale: Frasa ini merangkum seluruh hasil karya penciptaan. “Telah dibuat-Nya” menyatakan tindakan yang sudah selesai sebelum Allah melihatnya, sekaligus mempertahankan verba umum עשה tanpa menggantinya dengan istilah yang lebih khusus.
- source_word: וְהִנֵּה
  choice: dan sungguh
  rationale: הִנֵּה menarik perhatian dan memberi penekanan. “Sungguh” mempertahankan daya retoris itu dalam bahasa Indonesia modern tanpa memakai bentuk arkais “lihatlah” yang dapat disalahpahami sebagai perintah harfiah.
- source_word: טוֹב מְאֹד
  choice: sangat baik
  rationale: טוֹב berarti “baik” dan מְאֹד menguatkannya. Pilihan ini langsung dan alami serta tidak membatasi kebaikan tersebut hanya pada kategori moral, estetis, atau fungsional.
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: Jadilah petang dan jadilah pagi
  rationale: Pengulangan וַיְהִי dipertahankan dalam rumusan penutup hari yang khidmat dan dikenal, dengan urutan petang lalu pagi sebagaimana teks Ibrani.
- source_word: יוֹם הַשִּׁשִּׁי
  choice: hari keenam
  rationale: Nomina dengan bilangan tingkat definit ini secara alami diterjemahkan “hari keenam”; bahasa Indonesia tidak memerlukan kata sandang tersendiri untuk menyatakan definiteness tersebut.
theological_decisions:
- issue: Cakupan kebaikan ciptaan dalam טוֹב מְאֹד
  choice: sangat baik
  alternative: amat baik; sungguh baik sekali
  rationale: Pilihan ini mempertahankan penegasan luas teks mengenai kebaikan seluruh ciptaan tanpa menetapkannya secara khusus sebagai kebaikan moral, estetis, atau fungsional.
- issue: Rumusan hari penciptaan dan perdebatan tentang sifat atau lamanya hari
  choice: Jadilah petang dan jadilah pagi, hari keenam
  alternative: Lalu datanglah petang dan pagi; itulah hari keenam
  rationale: Terjemahan mengikuti susunan dan rumusan Ibrani tanpa menambahkan kata-kata penjelas yang dapat menentukan lamanya atau fungsi sastra hari-hari penciptaan.
- issue: Referen “sangat baik”
  choice: semuanya itu sangat baik
  alternative: itu sangat baik
  rationale: Penambahan pronomina rangkuman “semuanya itu” secara alami menghubungkan penilaian dengan “segala yang telah dibuat-Nya” dan tidak mengubah cakupan universal כָּל.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi enklitik pada “dibuat-Nya” mengikuti kebiasaan penghormatan dalam penerbitan Alkitab Indonesia. Rumusan “Jadilah petang dan jadilah pagi” mempertahankan irama formula Kejadian 1; tidak ada catatan kaki yang diperlukan.
