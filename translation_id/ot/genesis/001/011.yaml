id: GEN.1.11
reference: Genesis 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: id
  text: 'Lalu Allah berfirman, “Hendaklah bumi menumbuhkan[a] tumbuh-tumbuhan: tanaman yang menghasilkan biji dan pohon buah-buahan yang menghasilkan buah menurut jenisnya[b], dengan biji di dalamnya[c], di atas bumi.” Maka jadilah demikian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengeluarkan tumbuh-tumbuhan.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal, “menurut jenisnya,” yang berfungsi secara distributif bagi berbagai golongan.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang bijinya ada di dalamnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: Hendaklah bumi menumbuhkan
  rationale: Bentuk jussif Hifil menyatakan perintah tidak langsung dengan nuansa kausatif. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa tumbuhan muncul dari bumi.
- source_word: דֶּשֶׁא
  choice: tumbuh-tumbuhan
  rationale: Istilah kolektif ini menunjuk pada pertumbuhan tanaman hijau secara luas; pilihan ini tidak mempersempit maknanya menjadi rumput saja.
- source_word: עֵשֶׂב
  choice: tanaman
  rationale: Mengacu pada tumbuhan tidak berkayu atau tanaman berbatang lunak. 'Tanaman' jelas dan wajar bagi pembaca modern tanpa membatasinya pada rempah-rempah.
- source_word: מַזְרִיעַ זֶרַע
  choice: yang menghasilkan biji
  rationale: Partisip dan objek serumpun menekankan ciri tanaman yang terus menghasilkan benih; 'menghasilkan biji' menyampaikan makna itu secara alami.
- source_word: עֵץ פְּרִי
  choice: pohon buah-buahan
  rationale: Frasa konstruksi ini menunjuk pada kelas pohon yang menghasilkan buah. Bentuk Indonesia ini alami dan mempertahankan makna kolektifnya.
- source_word: עֹשֶׂה פְּרִי
  choice: yang menghasilkan buah
  rationale: Partisip tersebut menggambarkan ciri khas pohon itu. 'Menghasilkan buah' akurat dan lazim dalam bahasa Indonesia modern.
- source_word: לְמִינוֹ
  choice: menurut jenisnya
  rationale: Bentuk Ibrani adalah tunggal dan berdaya distributif. Bentuk tunggal bahasa Indonesia mempertahankan struktur itu sekaligus dapat dipahami sebagai berlaku pada setiap jenis.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: dengan biji di dalamnya
  rationale: Ungkapan ini mempertahankan gagasan bahwa daya reproduksi terkandung dalam tumbuhan atau buah tersebut, sekaligus tidak memaksakan secara berlebihan rujukan pronomina Ibraninya.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: Padanan lokatif yang langsung dan sesuai dengan latar penciptaan.
- source_word: וַיְהִי כֵן
  choice: Maka jadilah demikian
  rationale: Formula penggenapan yang berulang dalam Kejadian 1; pilihan ini akurat, wajar, dan mempertahankan irama narasi yang khidmat.
theological_decisions:
- issue: Cakupan dan nuansa kategori tumbuhan yang diciptakan
  choice: Kategori Ibrani diterjemahkan sebagai kelas-kelas tumbuhan yang luas sambil mempertahankan pembedaan antara tumbuh-tumbuhan, tanaman berbiji, dan pohon buah-buahan.
  alternative: Meratakannya menjadi 'segala macam tumbuhan dan pohon' atau memakai kategori botani ilmiah modern.
  rationale: Ayat ini memakai bahasa pengamatan sehari-hari untuk menyajikan keteraturan kehidupan tumbuhan. Terjemahan tidak memasukkan taksonomi modern dan tidak menghapus pembedaan yang terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur perintah ilahi dan formula penggenapannya dipertahankan, sedangkan istilah botani dibuat cukup luas agar dapat dipahami pembaca umum tanpa ketepatan ilmiah yang anakronistis.
