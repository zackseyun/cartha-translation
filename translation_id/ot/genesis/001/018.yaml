id: GEN.1.18
reference: Genesis 1:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: id
  text: untuk menguasai siang dan malam, serta memisahkan[a] terang dari gelap. Allah melihat bahwa hal itu baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membedakan antara terang dan gelap.”
    reason: Alternatif leksikal bagi לְהַבְדִּיל yang menonjolkan pembedaan, bukan pemisahan secara konkret.
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: untuk menguasai
  rationale: Bentuk infinitif ini melanjutkan tujuan atau fungsi benda-benda penerang dari ayat sebelumnya. “Menguasai” mempertahankan gambaran pemerintahan dalam משל tanpa menyiratkan bahwa benda-benda penerang itu ilahi atau bertindak secara mandiri.
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: siang dan malam
  rationale: Ungkapan ini secara alami menyatakan dua ranah waktu yang berada di bawah fungsi benda-benda penerang. Dalam bahasa Indonesia, preposisi yang menyertai verba “menguasai” tidak perlu diulang.
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: serta memisahkan
  rationale: בדל dalam kisah penciptaan menunjuk pada penetapan pemisahan atau pembedaan. “Memisahkan” mempertahankan gambaran konkret dan pola pemakaian dalam Kejadian 1; “serta” menghubungkan fungsi kedua secara alami.
- source_word: בֵּין הָ/אוֹר וּ/בֵין הַ/חֹשֶׁךְ
  choice: terang dari gelap
  rationale: Konstruksi Ibrani harfiahnya “antara terang dan antara gelap,” tetapi setelah “memisahkan,” bentuk idiomatis bahasa Indonesia ialah “terang dari gelap.”
- source_word: וַ/יַּרְא אֱלֹהִים
  choice: Allah melihat
  rationale: Bentuk naratif Ibrani melanjutkan rangkaian tindakan. Tanpa “dan” pada awal kalimat, bahasa Indonesia tetap menyampaikan urutan narasi dengan lebih alami.
- source_word: כִּי טוֹב
  choice: bahwa hal itu baik
  rationale: טוב mencakup pengertian baik, tepat, dan sesuai dalam tatanan ciptaan. “Baik” mempertahankan keluasan makna dan gema pengulangan dalam pasal ini; “hal itu” merujuk secara wajar pada hasil penataan yang baru saja disebutkan.
theological_decisions:
- issue: Fungsi benda-benda penerang dalam ciptaan
  choice: Benda-benda penerang menjalankan fungsi menguasai siang dan malam serta memisahkan terang dari gelap dalam tatanan yang Allah tetapkan.
  alternative: Bahasa yang lebih dipersonifikasikan dapat memberi kesan bahwa benda-benda penerang menjalankan kekuasaan sebagai makhluk ilahi atau sebagai pelaku mandiri.
  rationale: משל tetap diterjemahkan dengan istilah pemerintahan yang kuat, tetapi konteksnya menempatkan benda-benda penerang sebagai bagian dari ciptaan dan Allah sebagai pihak yang menilai hasilnya. Terjemahan tidak menambahkan unsur mitologis maupun meniadakan gambaran kekuasaan yang sungguh ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat diperlakukan sebagai kelanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan frasa tujuan. Penanda catatan kaki ditempatkan tepat setelah kata yang memiliki alternatif leksikal.
