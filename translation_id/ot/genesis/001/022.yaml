base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: id
  text: Lalu Allah memberkati mereka dengan berfirman, “Berkembang biaklah dan bertambah banyaklah; penuhilah perairan di lautan, dan hendaklah burung-burung[a] bertambah banyak di bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk yang terbang”; kata Ibrani עוֹף dapat merujuk lebih luas kepada makhluk yang terbang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Bentuk piel dari ברך menyatakan tindakan Allah mencurahkan berkat; “memberkati” merupakan padanan Indonesia yang langsung, wajar, dan mempertahankan bobot teologisnya.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek ini merujuk kembali kepada makhluk-makhluk laut dan makhluk bersayap pada ayat sebelumnya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, nomina ini disertai verba tunggal dan menunjuk kepada Sang Pencipta yang esa; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Konstruksi infinitif ini memperkenalkan perkataan langsung. Dalam konteks ujaran ilahi, “dengan berfirman” alami dan bermartabat.
- source_word: פְּרוּ
  choice: Beranakcuculah
  rationale: Imperatif פרה dalam konteks berkat menyatakan kesuburan dan menghasilkan keturunan. “Beranakcuculah” mempertahankan ungkapan khas ini dengan bahasa Indonesia yang lazim dalam laras Alkitab.
- source_word: וּרְבוּ
  choice: dan bertambah banyaklah
  rationale: Imperatif רבה menunjuk pada pertambahan jumlah; pilihan ini jelas dan berpasangan alami dengan “beranakcuculah”.
- source_word: וּמִלְאוּ
  choice: penuhilah
  rationale: Imperatif מלא berarti memenuhi atau mengisi hingga penuh; “penuhilah” menyampaikan perintah tanpa parafrasa tambahan.
- source_word: אֶת הַמַּיִם בַּיַּמִּים
  choice: air di laut
  rationale: מַיִם dan יַמִּים berbentuk gramatikal jamak dalam bahasa Ibrani, tetapi bahasa Indonesia secara alami memakai nomina massa “air” dan bentuk kolektif “laut” di sini.
- source_word: וְהָעוֹף
  choice: burung-burung
  rationale: עוֹף dapat mencakup makhluk yang terbang secara lebih luas. Dalam konteks langsung, “burung-burung” adalah padanan yang paling alami, sementara keluasan leksikalnya dicatat dalam catatan kaki.
- source_word: יִרֶב
  choice: hendaklah ... bertambah banyak
  rationale: Bentuk jusif/imperfek dari רבה memiliki daya volitif. “Hendaklah” mempertahankan nuansa berkat yang dinyatakan dalam bentuk menyerupai perintah, bukan mengubahnya menjadi ramalan biasa.
- source_word: בָּאָרֶץ
  choice: di bumi
  rationale: אָרֶץ menunjuk pada ranah daratan tempat burung bertambah banyak; “di bumi” merupakan padanan langsung dan konsisten dengan kosakata kisah penciptaan.
theological_decisions:
- issue: Sifat ujaran dalam berkat Allah
  choice: 'Imperatif dan jusif diterjemahkan sebagai berkat ilahi yang diungkapkan dalam bentuk perintah: “Beranakcuculah ... hendaklah ... bertambah banyak.”'
  alternative: 'Menerjemahkan semua verba sebagai perintah langsung, atau menjadikan klausa terakhir sebagai prediksi: “burung-burung akan bertambah banyak.”'
  rationale: Teks Ibrani menyampaikan berkat Allah melalui imperatif dan jusif. Terjemahan ini mempertahankan ketegangan antara berkat, penugasan, dan kehendak ilahi tanpa meratakannya menjadi perintah belaka atau ramalan belaka.
translation_notes:
  register: Bahasa Indonesia standar modern dengan laras naratif yang bermartabat. “Beranakcuculah” dipertahankan karena ringkas dan dikenal luas, sedangkan “bertambah banyaklah” lebih alami daripada bentuk harfiah yang kaku. Penanda catatan kaki [a] ditempatkan tepat setelah unsur yang dijelaskan.
