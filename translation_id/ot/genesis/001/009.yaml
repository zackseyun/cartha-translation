  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: id
  text: Lalu Allah berfirman, “Hendaklah air di bawah langit[a] dikumpulkan ke satu tempat, dan hendaklah daratan tampak.” Maka jadilah demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “langit” dapat merujuk pada langit yang tampak ataupun wilayah surgawi, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita. “Lalu” menyatakan perkembangan narasi secara wajar, sedangkan “berfirman” sesuai dengan tuturan ilahi dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, nomina ini memakai kesesuaian verba tunggal dan menunjuk kepada Sang Pencipta yang esa. “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: יִקָּווּ
  choice: Hendaklah ... dikumpulkan
  rationale: Bentuk jusif menyatakan perintah atau kehendak ilahi. Bentuk pasif “dikumpulkan” mempertahankan nuansa Niphal dan menyampaikan pemusatan air ke satu tempat.
- source_word: הַמַּיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya jamak, “air” dalam bahasa Indonesia lazim dipakai sebagai nomina massa dan lebih alami daripada bentuk jamak buatan.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: di bawah langit
  rationale: Ungkapan ini menunjukkan lokasi air di bawah langit. “Langit” secara alami mempertahankan keluasan makna שָׁמַיִם tanpa memaksakan gambaran kosmologis tertentu.
- source_word: אֶל מָקוֹם אֶחָד
  choice: ke satu tempat
  rationale: “Ke” menyatakan arah gerak menuju pemusatan, dan “satu” mempertahankan אֶחָד secara eksplisit.
- source_word: וְתֵרָאֶה
  choice: dan hendaklah ... tampak
  rationale: Jusif Niphal ini melanjutkan rangkaian perintah. “Tampak” menyatakan munculnya daratan ke pandangan tanpa menambahkan mekanisme yang tidak disebutkan teks.
- source_word: הַיַּבָּשָׁה
  choice: daratan
  rationale: Dalam konteks pertentangannya dengan air, “daratan” merupakan padanan Indonesia yang alami untuk tanah kering yang tersingkap dan selaras dengan penamaan pada ayat berikutnya.
- source_word: וַיְהִי כֵן
  choice: Maka jadilah demikian
  rationale: Ungkapan ini mempertahankan formula pemenuhan yang berulang dalam Kejadian 1 dengan susunan yang alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan makna שָׁמַיִם dalam kisah penciptaan
  choice: langit
  alternative: surga; cakrawala
  rationale: שָׁמַיִם dapat menunjuk kepada langit yang tampak atau wilayah surgawi. Kata Indonesia “langit” paling baik mempertahankan keluwesan makna tersebut dalam konteks ini, sedangkan “surga” akan mempersempitnya dan “cakrawala” akan menyamakannya dengan istilah berbeda dalam ayat-ayat sekitar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah berulang dipertahankan untuk mencerminkan irama teks Ibrani, sementara nomina massa “air” dipakai secara idiomatis.
