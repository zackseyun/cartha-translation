  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: id
  text: Lalu Allah berfirman, “Hendaklah air dipenuhi oleh makhluk hidup yang berkeriapan[a], dan hendaklah makhluk terbang[b] terbang di atas bumi, melintasi permukaan bentangan langit[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Hendaklah air berkeriapan dengan keriapan makhluk hidup.” Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk menekankan kelimpahan kehidupan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “burung-burung.” Istilah Ibrani עוֹף dapat merujuk lebih luas kepada makhluk yang terbang.
    reason: lexical_alternative
  - marker: c
    text: “Bentangan” dapat juga diterjemahkan “cakrawala” atau “kubah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. “Lalu” alami dalam bahasa Indonesia, sedangkan “berfirman” mempertahankan ragam yang pantas bagi perkataan Allah.
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: air berkeriapan dengan kawanan
  rationale: “Berkeriapan” menyampaikan gerak dan kelimpahan שׁרץ, sedangkan “kawanan” mewakili nomina serumpunnya tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
- source_word: נֶפֶשׁ חַיָּה
  choice: makhluk hidup
  rationale: Frasa ini menunjuk pada makhluk bernyawa dalam konteks penciptaan, bukan mengajarkan pengertian teknis tertentu tentang jiwa.
- source_word: וְעוֹף
  choice: makhluk-makhluk bersayap
  rationale: עוֹף dapat mencakup makhluk terbang secara lebih luas daripada burung saja; pilihan ini menjaga keluasan leksikal tersebut.
- source_word: יְעוֹפֵף
  choice: terbang
  rationale: Padanan langsung dan alami untuk gerak terbang; nuansa yusif disampaikan oleh “hendaklah”.
- source_word: עַל הָאָרֶץ
  choice: di atas bumi
  rationale: Dalam konteks penerbangan, עַל menunjukkan posisi atau gerak di atas bumi.
- source_word: עַל פְּנֵי
  choice: melintasi permukaan
  rationale: Menyampaikan gambaran harfiah “di atas muka” dengan ungkapan Indonesia yang alami dan menunjukkan gerak.
- source_word: רְקִיעַ הַשָּׁמָיִם
  choice: bentangan langit
  rationale: “Bentangan” cukup netral terhadap perdebatan mengenai bentuk kosmologis רְקִיעַ, sedangkan “langit” merupakan padanan Indonesia yang alami bagi הַשָּׁמָיִם dalam konteks ini.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penciptaan
  choice: makhluk hidup
  alternative: makhluk bernyawa; jiwa yang hidup
  rationale: Konteksnya berbicara tentang kehidupan hewan dan tidak menuntut klaim antropologis atau doktrin khusus mengenai jiwa.
- issue: Cakupan עוֹף
  choice: makhluk-makhluk bersayap
  alternative: burung-burung
  rationale: Pilihan utama mempertahankan kemungkinan bahwa istilah Ibrani mencakup makhluk terbang lebih luas daripada kategori burung modern.
- issue: Gambaran kosmologis רְקִיעַ
  choice: bentangan
  alternative: cakrawala; kubah
  rationale: “Bentangan” menjaga gambaran ruang yang terbentang tanpa memastikan model fisik tertentu yang tidak dijelaskan secara tuntas oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “hendaklah” mempertahankan struktur perintah penciptaan. Diksi teknis dan arkais dihindari, sementara permainan kata Ibrani pada שׁרץ dijelaskan dalam catatan kaki.
