base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: id
  text: Pada mulanya, ketika Allah menciptakan langit dan bumi[a]—
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 'Secara tradisional diterjemahkan sebagai kalimat lengkap: “Pada mulanya Allah menciptakan langit dan bumi.” Bentuk Ibrani בְּרֵאשִׁית tanpa artikel yang diikuti verba finit בָּרָא juga dapat dibaca sebagai pembuka klausa temporal, sebagaimana dalam terjemahan ini. Struktur sintaksisnya diperdebatkan; dalam pembacaan ini, klausa utamanya sering dipahami muncul pada ayat 3: “Allah berfirman, ‘Jadilah terang.’”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: Pada mulanya, ketika … menciptakan
  rationale: Bentuk בְּרֵאשִׁית tanpa artikel yang diikuti verba finit בָּרָא secara alami dapat dipahami sebagai klausa temporal dependen. Rumusan ini mempertahankan makna leksikal רֵאשִׁית sekaligus menandai hubungan sintaksisnya dengan kelanjutan sampai ayat 3.
- source_word: בָּרָא
  choice: menciptakan
  rationale: Padanan Indonesia yang langsung dan lazim bagi verba Ibrani yang digunakan untuk tindakan penciptaan ilahi, tanpa menentukan mekanisme penciptaan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba בָּרָא berbentuk tunggal sehingga acuannya di sini adalah Allah yang tunggal.
- source_word: אֵת
  choice: '[tidak diterjemahkan; penanda objek langsung]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak mempunyai padanan leksikal langsung dalam bahasa Indonesia.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, 'langit' merupakan padanan alami dan baku bagi bentuk Ibrani ini; bersama 'bumi', ungkapan tersebut menunjuk kepada keseluruhan tatanan ciptaan.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam pasangan kosmis 'langit dan bumi', אָרֶץ berarti bumi, bukan wilayah atau negeri tertentu.
theological_decisions:
- issue: Sintaksis klausa pembuka
  choice: 'Klausa temporal dependen: “Pada mulanya, ketika Allah menciptakan langit dan bumi—”'
  alternative: 'Kalimat utama mandiri: “Pada mulanya Allah menciptakan langit dan bumi.”'
  rationale: Bentuk בְּרֵאשִׁית tanpa artikel, diikuti verba finit בָּרָא, mendukung pembacaan temporal dependen dan memiliki kesejajaran sintaksis dengan Kejadian 2:4b serta Hosea 1:2. Namun, pembacaan tradisional sebagai kalimat lengkap tetap mungkin dan dicatat dalam catatan kaki agar ketegangan penafsirannya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Pada mulanya” mempertahankan gema tradisional sekaligus makna רֵאשִׁית; tanda pisah panjang menunjukkan bahwa klausa berlanjut ke ayat-ayat berikutnya.
