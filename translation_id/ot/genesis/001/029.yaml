  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: id
  text: Lalu Allah berfirman, “Lihatlah,[a] Aku telah memberikan kepada kalian segala tumbuhan yang menghasilkan biji di seluruh muka bumi dan segala pohon yang buahnya berbiji. Semuanya itu akan menjadi makanan kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perhatikanlah.” Kata Ibrani ini menarik perhatian kepada pernyataan yang menyusul.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: Lalu Allah berfirman
  rationale: Kata penghubung וַ diterjemahkan secara wajar sebagai “lalu”, sedangkan “berfirman” merupakan padanan Indonesia yang alami dan bermartabat untuk ujaran Allah.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi partikel penarik perhatian dengan ungkapan Indonesia modern yang jelas tanpa memakai bentuk yang terlalu arkais.
- source_word: נָתַתִּי לָכֶם
  choice: Aku telah memberikan kepada kalian
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan yang telah dilakukan dan tetap berlaku; “kalian” mencerminkan pronomina Ibrani jamak.
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: segala tumbuhan yang menghasilkan biji
  rationale: עֵשֶׂב menunjuk pada tumbuh-tumbuhan secara luas, bukan hanya herba; frasa partisipialnya menyatakan tumbuhan yang menghasilkan biji.
- source_word: אֲשֶׁר עַל־פְּנֵי כָל־הָאָרֶץ
  choice: di seluruh muka bumi
  rationale: Mempertahankan gambaran spasial “muka bumi” sambil menghasilkan susunan Indonesia yang alami.
- source_word: כָל־הָעֵץ אֲשֶׁר־בּוֹ פְרִי־עֵץ זֹרֵעַ זָרַע
  choice: segala pohon yang buahnya berbiji
  rationale: Menyampaikan secara ringkas dan alami bahwa pada pohon-pohon itu terdapat buah yang mengandung biji, tanpa menambahkan gagasan di luar teks.
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: Semuanya itu akan menjadi makanan kalian
  rationale: “Semuanya itu” mewakili keseluruhan pemberian sebagai satu kesatuan, sesuai verba Ibrani tunggal, sementara “kalian” mempertahankan penerima jamak.
theological_decisions:
- issue: Cakupan pemberian makanan dalam kisah penciptaan
  choice: Menyatakan seluruh tumbuhan berbiji dan pohon berbuah berbiji sebagai makanan bagi manusia
  alternative: Menambahkan kesimpulan doktrinal mengenai pola makan manusia untuk segala zaman
  rationale: Ayat ini diterjemahkan sebagai pemberian dalam konteks penciptaan tanpa menarik atau memasukkan kesimpulan teologis yang tidak dinyatakan langsung oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena bentuk Ibrani yang ditujukan kepada penerima bersifat jamak; struktur kalimat dilancarkan tanpa menghilangkan citra “muka bumi” atau nuansa pemberian yang telah dilakukan.
