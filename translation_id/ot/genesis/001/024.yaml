  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: id
  text: 'Lalu Allah berfirman, “Hendaklah bumi mengeluarkan makhluk-makhluk hidup[a] menurut jenisnya: ternak, binatang yang merayap, dan binatang liar di bumi menurut jenisnya.” Maka jadilah demikian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk-makhluk bernyawa”; secara harfiah, “nefesh yang hidup” (nefesh dapat berarti “makhluk hidup” atau “nyawa”).
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: Hendaklah ... mengeluarkan
  rationale: Bentuk hifil yusif orang ketiga feminin tunggal dari יצא, dengan bumi sebagai subjek, menyatakan perintah ilahi agar bumi menyebabkan makhluk hidup keluar. Ungkapan ini mempertahankan nuansa kausatif sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Dalam konteks penciptaan, אֶרֶץ menunjuk pada bumi sebagai ranah daratan; “bumi” sesuai dengan cakupan luas Kejadian 1.
- source_word: נֶפֶשׁ חַיָּה
  choice: makhluk-makhluk hidup
  rationale: Frasa ini menunjuk pada kehidupan bernyawa secara umum. Bentuk ulang menyampaikan kumpulan makhluk yang kemudian dibagi ke dalam beberapa golongan, tanpa memasukkan gagasan teologis khusus yang mungkin tersirat bagi pembaca modern dalam kata “jiwa”.
- source_word: לְמִינָהּ
  choice: menurut jenisnya
  rationale: Walaupun bentuk Ibraninya tunggal feminin dan mengacu pada suatu kelompok kolektif, ungkapan Indonesia ini secara alami dapat memiliki daya distributif bagi berbagai makhluk yang disebutkan.
- source_word: בְּהֵמָה
  choice: ternak
  rationale: Dalam pembagian ini, בְּהֵמָה terutama menunjuk pada kelompok binatang darat yang jinak atau dipelihara, berlawanan dengan binatang liar.
- source_word: רֶמֶשׂ
  choice: binatang yang merayap
  rationale: Istilah ini mencakup makhluk kecil yang bergerak dekat atau sepanjang permukaan tanah. Pilihan ini jelas bagi pembaca modern tanpa menentukan spesies secara berlebihan.
- source_word: חַיְתוֹ אֶרֶץ
  choice: binatang liar di bumi
  rationale: Frasa ini menunjuk pada binatang darat yang tidak dijinakkan dan mempertahankan kontrasnya dengan ternak.
- source_word: וַיְהִי כֵן
  choice: Maka jadilah demikian
  rationale: Formula penggenapan yang berulang dalam Kejadian 1 diterjemahkan secara ringkas dan khidmat, sambil menunjukkan bahwa perintah Allah terlaksana.
theological_decisions:
- issue: Apakah נֶפֶשׁ perlu diterjemahkan dengan istilah teologis “jiwa”
  choice: makhluk-makhluk hidup
  alternative: jiwa-jiwa yang hidup; makhluk-makhluk bernyawa
  rationale: Dalam konteks ini, frasa Ibrani tersebut menyebut makhluk bernyawa secara umum dan tidak sedang memberi pernyataan doktrinal tentang susunan metafisis binatang. Terjemahan utama menghindari pemaksaan pengertian teologis kemudian, sedangkan catatan kaki mempertahankan bentuk ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama yang khidmat tetapi mudah dipahami. “Hendaklah” mempertahankan bentuk perintah ilahi, sedangkan “Maka jadilah demikian” menjaga pola formula penciptaan. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
