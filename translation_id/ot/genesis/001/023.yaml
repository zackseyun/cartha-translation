  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: id
  text: Terjadilah petang dan terjadilah pagi—hari kelima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Dan ada petang dan ada pagi—hari kelima.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: jadilah
  rationale: Bentuk naratif dari היה menyatakan terjadinya keadaan dan membentuk rumusan berulang dalam kisah penciptaan. “Jadilah” alami, ringkas, dan mempertahankan irama rumusan Ibrani.
- source_word: עֶרֶב
  choice: petang
  rationale: Kata ini berarti petang atau waktu menjelang malam; “petang” merupakan padanan baku yang sesuai dengan gaya luhur dan mudah dipahami.
- source_word: בֹּקֶר
  choice: pagi
  rationale: Padanan langsung yang mempertahankan kesejajaran dengan “petang” dalam rumusan berulang.
- source_word: יוֹם
  choice: hari
  rationale: Kata ini menamai hari penciptaan yang diberi nomor tanpa menentukan secara interpretatif durasi atau sifatnya.
- source_word: חֲמִישִׁי
  choice: kelima
  rationale: Bilangan tingkat ini secara langsung menerangkan “hari”.
theological_decisions:
- issue: Sifat rumusan hari penciptaan
  choice: Mempertahankan rumusan temporal “Jadilah petang, lalu jadilah pagi—hari kelima” tanpa menafsirkan panjang atau sifat hari itu.
  alternative: Menerjemahkan secara lebih interpretatif untuk menyiratkan hari 24 jam atau suatu zaman.
  rationale: Teks Ibrani memuat urutan petang-pagi dan penamaan hari kelima, tetapi terjemahan tidak semestinya menyelesaikan perdebatan teologis kemudian yang tidak ditentukan secara eksplisit oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jadilah … lalu jadilah” menjaga irama naratif sekaligus terdengar lebih alami daripada pengulangan “dan terjadilah”; alternatif yang lebih harfiah dicatat dalam catatan kaki.
