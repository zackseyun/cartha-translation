base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: id
  text: Allah menyebut daratan itu Bumi[a], dan kumpulan air itu disebut-Nya Laut-Laut. Allah melihat bahwa hal itu baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah” atau “bumi” tanpa huruf kapital. Kata Ibrani אֶרֶץ dapat berfungsi sebagai nomina umum atau, dalam konteks penamaan ini, sebagai nama yang diberikan kepada daratan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: menamai / dinamai-Nya
  rationale: Dalam konteks ini verba קרא menyatakan tindakan memberi nama. Variasi bentuk aktif dan pasif mempertahankan susunan alami bahasa Indonesia tanpa menghilangkan pengulangan tindakan penamaan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, bentuk ini berpadanan dengan verba tunggal dan menunjuk kepada Sang Pencipta yang esa; 'Allah' adalah padanan baku dan wajar dalam bahasa Indonesia.
- source_word: לַיַּבָּשָׁה
  choice: daratan itu
  rationale: Istilah ini menunjuk pada bagian yang kering sebagai lawan dari air yang telah dikumpulkan. 'Daratan' merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: אֶרֶץ
  choice: Bumi
  rationale: Dalam rumusan penamaan ini, אֶרֶץ berfungsi sebagai nama yang diberikan kepada daratan. Huruf kapital menandai fungsi tersebut, sedangkan catatan kaki mempertahankan kemungkinan arti umum 'tanah' atau 'bumi'.
- source_word: מִקְוֵה הַמַּיִם
  choice: kumpulan air itu
  rationale: מִקְוֵה menyatakan massa atau himpunan yang terkumpul. 'Kumpulan air' alami dalam bahasa Indonesia dan mempertahankan hubungan dengan pengumpulan air pada konteks sebelumnya.
- source_word: יַמִּים
  choice: Laut
  rationale: Bentuk Ibraninya jamak dan dapat berarti 'laut-laut', tetapi bahasa Indonesia lazim memakai nomina kolektif tunggal 'Laut' sebagai nama bagi kumpulan air; fungsi penamaannya ditandai dengan huruf kapital.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Padanan ini mempertahankan rumusan evaluasi yang berulang dalam Kejadian 1.
- source_word: כִּי טוֹב
  choice: bahwa semuanya itu baik
  rationale: 'Kata טוֹב memiliki cakupan luas: baik, sesuai, dan patut. ''Baik'' mempertahankan keluasan itu; ''semuanya itu'' merujuk secara alami pada hasil penataan yang baru disebut tanpa mempersempit maknanya.'
theological_decisions:
- issue: Apakah אֶרֶץ harus diterjemahkan sebagai nomina umum atau nama dalam rumusan penamaan
  choice: Bumi, dengan huruf kapital
  alternative: tanah atau bumi, tanpa huruf kapital
  rationale: Karena teks secara eksplisit menggambarkan Allah memberi nama kepada daratan, huruf kapital membantu pembaca Indonesia mengenali fungsi nama tersebut. Pilihan ini tidak dimaksudkan untuk memasukkan konsep ilmiah modern tentang planet Bumi.
- issue: Apakah יַמִּים harus mempertahankan bentuk jamak secara eksplisit
  choice: Laut sebagai nama kolektif
  alternative: Laut-Laut atau laut-laut
  rationale: Bahasa Indonesia lebih alami memakai 'Laut' secara kolektif dalam pasangan penamaan 'Bumi' dan 'Laut'. Pilihan ini tidak menyangkal bahwa bentuk Ibraninya jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat ringkas serta mudah dibaca, sambil mempertahankan pola penamaan dan penilaian dalam teks Ibrani.
