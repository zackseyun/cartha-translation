id: GEN.1.25
reference: Genesis 1:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: id
  text: Allah menjadikan binatang liar di bumi menurut jenisnya[a], ternak menurut jenisnya, dan segala binatang yang merayap di tanah[c] menurut jenisnya[b]. Allah melihat bahwa semuanya itu baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “satwa liar di bumi.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jenis” menunjuk kepada golongan makhluk; istilah ini tidak boleh dipaksakan menjadi klasifikasi ilmiah modern.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “segala binatang yang merayap di bumi.” Bahasa Ibrani memakai kata yang berarti “bumi” sebelumnya dalam ayat ini, tetapi memakai kata yang berarti “tanah” di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: menjadikan
  rationale: Kata kerja עשה berarti membuat atau menjadikan. Dalam konteks penciptaan, “menjadikan” terdengar alami dan tidak menambahkan gagasan yang tidak dinyatakan teks.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, bentuk ini disertai kata kerja tunggal dan menunjuk kepada Sang Pencipta; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: חַיַּת הָאָרֶץ
  choice: binatang liar di bumi
  rationale: Ungkapan ini menunjuk kepada binatang darat liar, yang dibedakan dari ternak dan binatang yang merayap. Pilihan ini lebih jelas dalam bahasa Indonesia modern daripada terjemahan harfiah “binatang bumi”.
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: מין menunjuk kepada jenis atau golongan makhluk. Bentuk tunggal “-nya” sesuai dengan kata benda kolektif dalam setiap frasa dan tidak memasukkan klasifikasi biologis modern.
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: בהמה di sini terutama menunjuk kepada binatang darat yang dipelihara, berlawanan dengan binatang liar. “Ternak” ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: segala binatang yang merayap di tanah
  rationale: רמש menggambarkan makhluk yang bergerak dekat permukaan tanah. “Binatang yang merayap” mempertahankan kategori teks, sedangkan “tanah” mencerminkan הָאֲדָמָה dan membedakannya dari הָאָרֶץ sebelumnya.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Allah melihat bahwa semuanya itu baik
  rationale: Ini adalah ungkapan penilaian yang berulang dalam Kejadian 1. “Semuanya itu” menjadikan rujukannya alami dalam bahasa Indonesia tanpa mengubah penilaian teks.
theological_decisions:
- issue: Kategori penciptaan dan taksonomi ilmiah modern
  choice: jenis
  alternative: spesies
  rationale: מין menyatakan jenis atau golongan menurut pengelompokan teks. “Jenis” mempertahankan keluasan makna itu dan tidak menyamakannya secara anakronistis dengan konsep spesies dalam biologi modern.
- issue: Pembedaan הָאָרֶץ dan הָאֲדָמָה dalam ayat yang sama
  choice: bumi ... tanah
  alternative: bumi ... bumi
  rationale: 'Padanan yang berbeda mempertahankan perbedaan leksikal dalam bahasa Ibrani: הָאָרֶץ lebih luas, sedangkan הָאֲדָמָה menyoroti tanah atau permukaan tempat makhluk itu bergerak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga kategori dipertahankan, dengan pengulangan “menurut jenisnya” agar pola teks Ibrani tetap terdengar. “Binatang liar” dan “ternak” dipilih untuk memperjelas kontras kategorinya bagi pembaca umum.
