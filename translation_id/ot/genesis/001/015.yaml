id: GEN.1.15
reference: Genesis 1:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: id
  text: Hendaklah semuanya itu menjadi benda-benda penerang di bentangan langit[a] untuk menerangi bumi. Maka jadilah demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di cakrawala langit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Hendaklah semuanya itu menjadi
  rationale: Dalam rangkaian firman penciptaan ini, bentuk tersebut meneruskan daya volitif dari ayat sebelumnya. Ungkapan ini mempertahankan nuansa penetapan atau perintah, bukan sekadar menyatakan masa depan.
- source_word: לִמְאוֹרֹת
  choice: benda-benda penerang
  rationale: מָאוֹר menunjuk pada benda atau sumber yang memancarkan terang, bukan terang sebagai sesuatu yang abstrak. Pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: di bentangan langit
  rationale: רָקִיעַ menggambarkan sesuatu yang terbentang, sedangkan הַשָּׁמַיִם merujuk pada langit. Frasa ini mempertahankan gambaran Ibrani tanpa memakai istilah kuno yang kurang mudah dipahami.
- source_word: לְהָאִיר
  choice: untuk menerangi
  rationale: Bentuk kausatif dari אור berarti menyebabkan adanya terang atau memberikan terang. 'Menerangi' menyampaikan makna tersebut secara ringkas dan wajar.
- source_word: עַל הָאָרֶץ
  choice: bumi
  rationale: Dengan verba 'menerangi', objek langsung 'bumi' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan arah atau sasaran penerangan yang dinyatakan oleh עַל.
- source_word: וַיְהִי כֵן
  choice: Maka jadilah demikian
  rationale: Ini adalah rumus penggenapan yang berulang dalam Kejadian 1. Terjemahan ini menjaga hubungan antara firman ilahi dan terlaksananya firman itu.
theological_decisions:
- issue: Daya volitif וְהָיוּ dalam firman penciptaan
  choice: 'Diterjemahkan sebagai kelanjutan perintah: ''Hendaklah semuanya itu menjadi'''
  alternative: 'Diterjemahkan sebagai pernyataan masa depan: ''Semuanya itu akan menjadi'''
  rationale: Konteks langsung menempatkan klausa ini dalam firman Allah yang menetapkan fungsi benda-benda langit. Bentuk volitif mempertahankan pola sastra perintah lalu penggenapan tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Benda-benda penerang' dipilih untuk membedakan sumber terang dari terang abstrak; 'bentangan langit' mempertahankan citra רָקִיעַ dengan ungkapan yang mudah dipahami.
