  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: id
  text: Lalu Allah menciptakan makhluk-makhluk laut besar[a], segala makhluk hidup yang bergerak, yang berkerumun di dalam air menurut jenisnya, dan segala burung bersayap menurut jenisnya. Allah melihat bahwa itu baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “monster-monster laut besar” atau “naga-naga besar.” Kata Ibrani tanninim dapat menunjuk kepada makhluk besar berbentuk ular atau makhluk yang mengerikan; dalam ayat ini konteks perairan mendukung terjemahan “makhluk-makhluk laut besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: menciptakan
  rationale: Mempertahankan verba penciptaan ברא dan ragam bahasa luhur dalam kisah penciptaan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk jamak ini berpadanan dengan verba tunggal dan di sini menunjuk kepada Allah yang esa; 'Allah' adalah padanan baku dalam Alkitab bahasa Indonesia.
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: makhluk-makhluk laut yang besar
  rationale: תנינים dapat menunjuk kepada makhluk besar berbentuk ular atau mengerikan; konteks perairan mendukung padanan netral dan luas ini tanpa menambahkan konotasi mitologis.
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: segala makhluk hidup
  rationale: נפש חיה di sini menunjuk kepada kehidupan bernyawa, bukan 'jiwa' dalam pengertian teologis yang lebih sempit.
- source_word: הָרֹמֶשֶׂת
  choice: yang bergerak
  rationale: Partisip רמש mencakup gerakan secara luas dan tidak hanya binatang yang merayap.
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: yang berkerumun memenuhi air
  rationale: Padanan ini menyampaikan kelimpahan yang terkandung dalam שרץ sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: לְמִינֵהֶם
  choice: menurut jenisnya
  rationale: מין menandai pengelompokan dalam ciptaan; bentuk 'jenisnya' dapat merujuk secara kolektif kepada setiap kelompok makhluk.
- source_word: כָּל עוֹף כָּנָף
  choice: segala burung bersayap
  rationale: Menyampaikan kategori עוף dan penegasan bersayap dari כנף secara ringkas dan alami.
- source_word: לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Akhiran tunggal sesuai dengan kategori kolektif 'segala burung bersayap'.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Allah melihat bahwa semuanya itu baik
  rationale: Mempertahankan rumusan evaluatif berulang dalam Kejadian 1; 'semuanya itu' secara alami merujuk kepada hasil penciptaan yang baru disebutkan.
theological_decisions:
- issue: Makna תַּנִּינִם dalam konteks penciptaan dan kemungkinan asosiasi mitologis
  choice: makhluk-makhluk laut yang besar
  alternative: makhluk-makhluk laut raksasa; naga-naga besar
  rationale: Konteks langsung menggambarkan penciptaan kehidupan air. Terjemahan utama tidak perlu memperkuat konotasi mitologis yang tidak dituntut oleh sintaksis, tetapi keluasan istilah Ibrani tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan deretan unsur Ibrani sambil menghindari kekakuan; 'Maka' menghubungkan tindakan ini dengan firman pada ayat sebelumnya.
