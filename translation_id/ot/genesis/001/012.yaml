base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: id
  text: Lalu bumi menumbuhkan tumbuh-tumbuhan, yaitu tanaman yang menghasilkan benih menurut jenisnya[a] dan pohon-pohon yang menghasilkan buah yang di dalamnya terdapat benih, menurut jenisnya[b]. Allah melihat bahwa itu baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani berarti “menurut jenisnya”. Kata “jenis” di sini menunjuk pada kategori ciptaan, bukan istilah teknis biologi modern seperti “spesies”.
    reason: lexical_clarification
  - marker: b
    text: Secara harfiah, “yang benihnya ada di dalamnya”; dalam konteks ini, “di dalamnya” paling alami merujuk kepada buah.
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַתּוֹצֵא הָאָרֶץ
  choice: Lalu bumi menumbuhkan
  rationale: Bentuk kausatif verba יצא menyatakan bahwa bumi membuat tumbuh-tumbuhan muncul. “Menumbuhkan” alami dalam bahasa Indonesia dan mempertahankan peran bumi sebagai sarana yang menghasilkan pertumbuhan.
- source_word: דֶּשֶׁא
  choice: tumbuh-tumbuhan
  rationale: Istilah ini menunjuk secara kolektif pada pertumbuhan hijau atau vegetasi, bukan hanya rumput. “Tumbuh-tumbuhan” luas, umum, dan mudah dipahami.
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: tanaman yang menghasilkan benih
  rationale: עֵשֶׂב menunjuk pada tanaman atau herba, sedangkan konstruksi partisipial מַזְרִיעַ זֶרַע menyatakan kemampuan menghasilkan benih secara berkelanjutan.
- source_word: לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: מין berarti jenis atau kelompok ciptaan, tanpa muatan teknis istilah biologis modern “spesies”. Bentuk tunggal “-nya” juga mengikuti bentuk Ibrani dan cocok dengan nomina kolektif.
- source_word: וְעֵץ עֹשֶׂה פְּרִי
  choice: dan pohon yang menghasilkan buah
  rationale: עֵץ berbentuk tunggal tetapi dapat berfungsi kolektif. Bentuk tunggal Indonesia mempertahankan susunan sumber dan tetap wajar dalam pernyataan umum.
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: dengan benihnya di dalamnya
  rationale: Ungkapan ini mempertahankan kata ganti tunggal sumber serta tidak memaksakan rujukan “di dalamnya” secara lebih khusus daripada teks Ibrani, meskipun secara alami dipahami berkaitan dengan buah.
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: Allah melihat bahwa semuanya itu baik
  rationale: Ini menyampaikan rumusan penilaian berulang dalam Kejadian 1. “Semuanya itu” merujuk secara alami kepada hasil pertumbuhan yang baru disebut, tanpa mengubah nilai predikat טוֹב.
theological_decisions:
- issue: Kategori ciptaan dan taksonomi biologis modern
  choice: menurut jenisnya
  alternative: menurut spesiesnya
  rationale: Teks memakai מין untuk kategori atau jenis dalam kerangka dunia kuno. Terjemahan tidak menyamakannya dengan istilah teknis “spesies” dan dengan demikian tidak memasukkan perdebatan ilmiah atau doktrinal belakangan.
- issue: Rujukan kata ganti dalam אֲשֶׁר זַרְעוֹ בוֹ
  choice: dengan benihnya di dalamnya
  alternative: dengan benihnya di dalam buah itu
  rationale: Kata-kata Ibrani memakai bentuk tunggal maskulin dan tidak menyebut ulang “buah”. Terjemahan utama mempertahankan keluasan rujukan gramatikal, sementara kemungkinan makna yang lebih eksplisit dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Struktur paralel sumber dipertahankan, sementara tanda titik dua memperjelas bahwa frasa berikut menguraikan “tumbuh-tumbuhan”. Semua penanda catatan kaki muncul dalam teks utama.
