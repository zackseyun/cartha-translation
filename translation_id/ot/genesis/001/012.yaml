- from: 'Lalu bumi menumbuhkan tumbuh-tumbuhan: tanaman yang menghasilkan benih menurut jenisnya[a], dan pohon yang menghasilkan buah dengan benihnya di dalamnya[b], menurut jenisnya. Allah melihat bahwa semuanya itu baik.'
  to: Lalu bumi menumbuhkan tumbuh-tumbuhan, yaitu tanaman yang menghasilkan benih menurut jenisnya[a] dan pohon-pohon yang menghasilkan buah yang di dalamnya terdapat benih, menurut jenisnya[b]. Allah melihat bahwa itu baik.
