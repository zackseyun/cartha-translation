base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: id
  text: 'Allah menjadikan kedua benda penerang yang besar itu: benda penerang yang lebih besar untuk menguasai siang, benda penerang yang lebih kecil untuk menguasai malam, dan bintang-bintang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: menjadikan
  rationale: Kata עשה berarti membuat atau menjadikan. Dalam konteks penciptaan ini, “menjadikan” alami dalam bahasa Indonesia dan tidak menambahkan gagasan bahwa Allah hanya menetapkan fungsi benda-benda tersebut.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dengan verba tunggal dalam Kejadian 1, אֱלֹהִים menunjuk kepada Allah yang esa; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: kedua benda penerang yang besar itu
  rationale: מָאוֹר menunjuk pada sesuatu yang memberi terang, yakni benda penerang. Bentuk ini mempertahankan diksi Ibrani tanpa menggantinya dengan nama matahari dan bulan.
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: benda penerang yang lebih besar
  rationale: Walaupun bentuknya secara harfiah “benda penerang yang besar”, konstruksi berpasangan dengan קָטֹן menyatakan perbandingan; “lebih besar” menyampaikan kontras itu secara wajar.
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: untuk menguasai siang
  rationale: מֶמְשֶׁלֶת berarti kekuasaan atau pemerintahan. “Menguasai” mempertahankan metafora pemerintahan dan konstruksi tujuan dengan לְ.
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: benda penerang yang lebih kecil
  rationale: קָטֹן berarti kecil dan, dalam pasangan ini, lebih kecil. Padanan tersebut seimbang dengan “lebih besar”.
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: untuk menguasai malam
  rationale: Padanan ini mempertahankan konstruksi dan arti yang sejajar dengan frasa tentang siang.
- source_word: וְאֵת הַכּוֹכָבִים
  choice: dan juga bintang-bintang
  rationale: Konjungsi dan penanda objek memperkenalkan bintang-bintang sebagai objek tambahan yang dijadikan Allah. “Dan juga” membuat tambahan singkat ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penyebutan benda-benda langit tanpa menamai matahari dan bulan
  choice: Mempertahankan “benda penerang yang lebih besar” dan “benda penerang yang lebih kecil”.
  alternative: “matahari” dan “bulan”
  rationale: Teks Ibrani memakai מָאוֹר, bukan nama biasa untuk matahari dan bulan. Mempertahankan ungkapan sumber menghormati pilihan katanya dan tidak memasukkan istilah yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Benda penerang” dipilih daripada “terang” agar jelas bahwa yang dimaksud adalah objek yang memancarkan atau membawa terang. Susunan klausa mempertahankan kesejajaran dan tambahan singkat mengenai bintang-bintang.
