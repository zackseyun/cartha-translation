  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: id
  text: Allah menamai terang itu Siang, dan menamai kegelapan itu Malam. Lalu terjadilah petang dan terjadilah pagi—hari pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “hari satu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: menamai
  rationale: Dalam konstruksi penamaan dengan pelengkap berpreposisi, קרא berarti memberi nama; 'menamai' alami dalam bahasa Indonesia dan mempertahankan tindakan penamaan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, bentuk ini berpadanan dengan verba tunggal dan menunjuk kepada Sang Pencipta; 'Allah' ialah padanan baku dalam Alkitab bahasa Indonesia.
- source_word: לָאוֹר
  choice: terang itu
  rationale: Preposisi Ibrani berfungsi dalam konstruksi penamaan; bentuk penunjuk 'itu' secara alami mewakili nomina tertentu yang telah disebut.
- source_word: יוֹם
  choice: Siang
  rationale: Konteksnya adalah nama yang diberikan kepada terang. 'Siang' membedakannya dari יוֹם pada rumus penutup yang berarti hari sebagai satuan waktu.
- source_word: וְלַחֹשֶׁךְ
  choice: kegelapan itu
  rationale: Sejajar dengan 'terang itu' dan mempertahankan nomina abstrak חֹשֶׁךְ.
- source_word: קָרָא
  choice: Ia namai
  rationale: Pengulangan verba dipertahankan untuk mencerminkan paralelisme Ibrani; pronomina berhuruf kapital merujuk jelas kepada Allah.
- source_word: לָיְלָה
  choice: Malam
  rationale: Ini adalah nama yang diberikan kepada kegelapan; huruf kapital menandai fungsi penamaan.
- source_word: וַיְהִי
  choice: jadilah
  rationale: Bentuk ini mempertahankan pengulangan dan irama rumus Ibrani, sekaligus wajar dalam register naratif Alkitab bahasa Indonesia.
- source_word: עֶרֶב
  choice: petang
  rationale: Padanan umum bagi 'evening' yang tidak mempersempit makna menjadi saat matahari terbenam saja.
- source_word: בֹקֶר
  choice: pagi
  rationale: Padanan umum yang tidak mempersempit makna menjadi fajar saja.
- source_word: יוֹם אֶחָד
  choice: hari pertama
  rationale: Secara harfiah frasa ini memakai bilangan pokok 'satu', tetapi dalam urutan naratif bahasa Indonesia 'hari pertama' paling alami. Bentuk sumber dicatat dalam catatan kaki.
theological_decisions:
- issue: Terjemahan יוֹם אֶחָד pada akhir rumus hari penciptaan
  choice: hari pertama
  alternative: hari satu; satu hari
  rationale: Bahasa Ibrani memakai אֶחָד ('satu'), bukan bentuk ordinal 'pertama'. Namun, fungsi frasa dalam urutan naratif paling jelas diungkapkan sebagai 'hari pertama'. Karena bentuk kardinalnya dapat dianggap penting bagi penafsiran, bentuk yang lebih harfiah dipertahankan dalam catatan kaki tanpa menetapkan implikasi teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme serta pengulangan Ibrani dipertahankan sejauh tetap alami. Huruf kapital pada Siang dan Malam menandai nama yang diberikan; 'hari pertama' tetap huruf kecil karena berfungsi sebagai penanda urutan.
