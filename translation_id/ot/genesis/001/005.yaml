  rationale: Revisi mengganti bentuk imperatif “Jadilah” dengan pernyataan naratif “terjadilah,” sesuai fungsi dua bentuk וַיְהִי dalam teks Ibrani. Pengulangan verba penamaan dan formula petang–pagi dipertahankan. Catatan kaki dibuat lebih eksplisit sebagai keterangan bentuk Ibrani yang mendasari “hari pertama,” tanpa menarik kesimpulan penafsiran.
