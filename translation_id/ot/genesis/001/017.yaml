  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: id
  text: Allah menempatkan benda-benda penerang itu di bentangan langit untuk menerangi bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di cakrawala langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: menempatkan
  rationale: Dalam konteks penempatan benda-benda penerang, bentuk dari נתן bermakna ‘menaruh’ atau ‘menempatkan’; ‘menempatkan’ alami dalam bahasa Indonesia dan menyatakan tindakan yang disengaja.
- source_word: אֹתָם
  choice: semuanya itu
  rationale: Pronomina objek ini merujuk kembali kepada benda-benda penerang yang disebut sebelumnya. ‘Semuanya itu’ membuat rujukan jamaknya jelas tanpa menambahkan identitas baru.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, אֱלֹהִים merujuk kepada Sang Pencipta yang esa dan lazim diterjemahkan ‘Allah’ dalam Alkitab bahasa Indonesia.
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: di bentangan langit
  rationale: רָקִיעַ menunjuk pada sesuatu yang terbentang atau ruang yang luas, sedangkan הַשָּׁמַיִם berarti langit. Frasa ini mempertahankan gambaran sumber tanpa memakai istilah arkais atau memasukkan kosmologi ilmiah modern.
- source_word: לְהָאִיר
  choice: untuk menerangi
  rationale: Bentuk kausatif dari אור menyatakan fungsi memberikan terang. ‘Menerangi’ merupakan ungkapan Indonesia yang ringkas dan alami.
- source_word: עַל הָאָרֶץ
  choice: bumi
  rationale: Dengan verba ‘menerangi’, objek langsung ‘bumi’ secara alami mengungkapkan sasaran cahaya yang dalam bahasa Ibrani ditandai oleh עַל.
theological_decisions:
- issue: Istilah kosmologis רָקִיעַ dalam kisah penciptaan
  choice: bentangan langit
  alternative: cakrawala langit; kubah langit
  rationale: ‘Bentangan langit’ mempertahankan gagasan ruang yang terbentang dan membiarkan bahasa kosmologis kuno tetap terbuka, tanpa menetapkan bentuk kubah secara tegas maupun menyelaraskannya dengan kosmologi ilmiah modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat mengikuti alur bahasa Ibrani sejauh tetap alami dalam bahasa Indonesia.
