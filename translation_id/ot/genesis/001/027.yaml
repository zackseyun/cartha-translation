  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: id
  text: Maka Allah menciptakan manusia[a] menurut gambar-Nya; menurut gambar Allah diciptakan-Nya dia; laki-laki dan perempuan diciptakan-Nya mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “umat manusia.” Kata Ibrani ’adam di sini berbentuk tunggal dan mewakili manusia secara keseluruhan.'
    reason: Menjelaskan bentuk tunggal representatif dan mencatat padanan kolektif yang sah.
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: menciptakan / diciptakan-Nya
  rationale: Mempertahankan pengulangan tiga kali dari verba Ibrani ברא, yang dalam Kejadian 1 secara khas menyatakan tindakan penciptaan oleh Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal menunjukkan bahwa yang dimaksud ialah Allah yang esa; “Allah” adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: הָאָדָם
  choice: manusia
  rationale: Di sini bentuk tunggal itu mewakili manusia secara keseluruhan, sebagaimana ditegaskan oleh peralihan kemudian kepada “laki-laki dan perempuan” serta kata ganti jamak “mereka.” “Manusia” dapat mempertahankan makna kolektif sekaligus bentuk gramatikal tunggal dalam bahasa Indonesia.
- source_word: בְּצַלְמוֹ
  choice: menurut gambar-Nya
  rationale: Ungkapan ini menyatakan bahwa manusia diciptakan sesuai dengan gambar Allah. “Menurut gambar-Nya” alami dalam bahasa Indonesia dan tidak memutus pengulangan kata “gambar.”
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: menurut gambar Allah
  rationale: Mengulang “gambar” untuk mempertahankan paralelisme, penegasan, dan bobot teologis teks Ibrani.
- source_word: אֹתוֹ
  choice: dia
  rationale: Kata ganti tunggal ini merujuk kembali kepada הָאָדָם sebagai manusia yang representatif. “Dia” mempertahankan gerak yang disengaja dari bentuk tunggal menuju bentuk jamak.
- source_word: זָכָר וּנְקֵבָה
  choice: laki-laki dan perempuan
  rationale: Kedua istilah Ibrani menunjuk pada pembedaan jenis kelamin. Untuk manusia, “laki-laki dan perempuan” merupakan ungkapan Indonesia yang tepat, alami, dan bermartabat.
- source_word: אֹתָם
  choice: mereka
  rationale: Kata ganti jamak ini menandai peralihan dari manusia yang diungkapkan secara tunggal dan representatif kepada manusia dalam kemajemukannya.
theological_decisions:
- issue: Pemaknaan אָדָם dalam konteks manusia yang representatif
  choice: manusia
  alternative: umat manusia; manusia itu
  rationale: Bentuk Ibrani tetap tunggal dan diikuti kata ganti tunggal, tetapi cakupannya menjadi jelas ketika teks beralih kepada “laki-laki dan perempuan” dan “mereka.” “Manusia” mempertahankan ketegangan antara bentuk tunggal dan cakupan seluruh kemanusiaan tanpa membatasinya kepada seorang laki-laki saja.
- issue: Hubungan manusia dengan צֶלֶם Allah
  choice: menurut gambar-Nya
  alternative: dalam gambar-Nya; sebagai gambar-Nya
  rationale: Preposisi ב dapat menanggung lebih dari satu nuansa. “Menurut gambar-Nya” menyampaikan kesesuaian dengan gambar Allah tanpa menetapkan secara berlebihan bahwa manusia identik dengan gambar itu; alternatif formal tetap diakui.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “diciptakan-Nya dia/mereka” dipertahankan untuk menampilkan pengulangan puitis serta peralihan penting dari tunggal ke jamak dalam teks Ibrani.
