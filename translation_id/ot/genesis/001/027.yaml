  source_fidelity: Teks dengan setia mempertahankan tiga kali pengulangan ברא melalui “menciptakan/diciptakan-Nya,” pengulangan “gambar,” serta gerak penting dari manusia tunggal representatif (“dia”) ke jamak (“mereka”). “Laki-laki dan perempuan” tepat untuk זָכָר וּנְקֵבָה dan tidak mengubahnya menjadi istilah relasional yang lebih sempit.
  naturalness: Bahasa Indonesia baku, jelas, dan cukup khidmat untuk prosa penciptaan. Susunan pasif “diciptakan-Nya dia/mereka” agak bercorak sastra, tetapi alami dalam register Alkitab dan secara baik menonjolkan paralelisme sumber.
  terminology: “Allah,” “manusia,” “gambar-Nya,” dan “laki-laki dan perempuan” konsisten, lazim, dan tepat. “Menurut gambar-Nya” merupakan padanan Indonesia yang mapan bagi konstruksi Ibrani ini tanpa memaksakan penafsiran teologis tertentu. Catatan kaki secara memadai menjelaskan kemungkinan kolektif dari אָדָם.
