  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: id
  text: Lalu terjadilah petang dan terjadilah pagi—hari keempat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Dan terjadilah petang, dan terjadilah pagi, hari keempat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: jadilah
  rationale: Bentuk wayyiqtol dari היה dalam rumusan berulang ini menyatakan terjadinya atau hadirnya petang dan pagi. “Jadilah” mempertahankan gerak naratif serta irama rumusan Ibrani tanpa menyiratkan perubahan hakikat.
- source_word: עֶרֶב
  choice: petang
  rationale: Kata ini menunjuk waktu petang. “Petang” merupakan padanan langsung, wajar, dan sesuai dengan laras kisah penciptaan.
- source_word: וַיְהִי
  choice: jadilah
  rationale: Kata kerja yang diulang diterjemahkan sama untuk mempertahankan kesejajaran dan irama rumusan Ibrani.
- source_word: בֹקֶר
  choice: pagi
  rationale: Kata ini secara langsung berarti pagi; padanan ini alami dan mempertahankan kontras dengan petang.
- source_word: יוֹם רְבִיעִי
  choice: hari keempat
  rationale: Frasa Ibrani menyebut hari dengan bilangan tingkat. Dalam bahasa Indonesia, “hari keempat” adalah bentuk yang alami tanpa perlu menambahkan kata sandang.
theological_decisions:
- issue: Menerjemahkan rumusan hari penciptaan tanpa memasukkan tafsiran tertentu tentang kronologi atau lamanya hari
  choice: Jadilah petang dan jadilah pagi—hari keempat.
  alternative: Jadilah petang dan jadilah pagi, suatu hari keempat.
  rationale: Terjemahan mempertahankan unsur dan urutan rumusan Ibrani tanpa menentukan bagaimana “hari” harus dipahami dalam perdebatan mengenai kronologi penciptaan. Tanda pisah memperjelas bahwa “hari keempat” merangkum rumusan tersebut, tetapi tidak menambahkan penafsiran tentang durasinya.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Pengulangan “jadilah” dipertahankan demi struktur dan irama teks Ibrani; tanda pisah membantu keterbacaan. Penanda catatan kaki ditempatkan sesudah seluruh ayat karena catatan membahas bentuk rumusan lengkap.
