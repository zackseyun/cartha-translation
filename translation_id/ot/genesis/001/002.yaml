  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: id
  text: Dan bumi itu tidak berbentuk dan kosong, dan kegelapan ada di atas permukaan samudra raya, dan Roh Allah[a] melayang di atas permukaan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “angin dari Allah” atau “angin Allah” melayang di atas permukaan air.
    reason: Frasa Ibrani רוּחַ אֱלֹהִים dapat berarti “Roh Allah”, “angin dari Allah”, atau “angin Allah”; catatan ini mempertahankan ambiguitas leksikalnya.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Dan bumi
  rationale: הָאָרֶץ berarti 'bumi' atau 'tanah'; prefiks ו diterjemahkan sebagai 'Dan' untuk mempertahankan hubungan antarklausa tanpa menambahkan penanda wacana.
- source_word: הָיְתָה
  choice: belum berbentuk dan kosong
  rationale: Bentuk Qal perfektum היה di sini berfungsi secara statif, 'adalah/dalam keadaan'. Dalam bahasa Indonesia, 'bumi belum berbentuk dan kosong' mengungkapkan keadaan itu secara alami tanpa menyiratkan perubahan keadaan seperti 'menjadi'.
- source_word: תֹהוּ וָבֹהוּ
  choice: belum berbentuk dan kosong
  rationale: Ungkapan berpasangan ini menggambarkan keadaan tanpa tatanan atau bentuk dan kosong. 'Belum berbentuk dan kosong' wajar dalam bahasa Indonesia modern serta cocok dengan tahap narasi ini.
- source_word: וְחֹשֶׁךְ
  choice: dan kegelapan
  rationale: Padanan langsung yang mempertahankan kelanjutan klausa nominal.
- source_word: עַל־פְּנֵי
  choice: meliputi permukaan / di atas permukaan
  rationale: Idiom ini secara harfiah berarti 'di atas muka'. Terjemahan disesuaikan dengan predikat masing-masing agar alami, sambil mempertahankan citra permukaan.
- source_word: תְהוֹם
  choice: samudra raya
  rationale: תְהוֹם menunjuk pada kedalaman air atau samudra purba. 'Samudra raya' menyampaikan bentangan air yang dalam tanpa memakai istilah teknis atau mengimpor mitologi.
- source_word: וְרוּחַ אֱלֹהִים
  choice: dan Roh Allah
  rationale: רוּחַ dapat berarti 'roh', 'angin', atau 'napas'. Bacaan utama 'Roh Allah' kuat dan mapan, sedangkan kemungkinan 'angin dari Allah/angin Allah' dipertahankan dalam catatan kaki.
- source_word: מְרַחֶפֶת
  choice: melayang-layang
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung. 'Melayang-layang' menangkap gerak yang bertahan di atas suatu permukaan dan terdengar alami.
- source_word: הַמָּיִם
  choice: air
  rationale: Kata Ibrani berbentuk jamak, tetapi 'air' merupakan nomina massa yang alami dalam bahasa Indonesia; makna perairan kosmis tetap jelas dari konteks.
theological_decisions:
- issue: Apakah הָיְתָה menyatakan keadaan ('adalah') atau perubahan keadaan ('menjadi')
  choice: keadaan statif, dinyatakan dengan 'belum berbentuk dan kosong'
  alternative: '''menjadi tidak berbentuk dan kosong'''
  rationale: Ayat ini menggambarkan keadaan bumi pada tahap narasi tersebut. Bahasa Ibraninya tidak mengharuskan perubahan keadaan, sehingga terjemahan tidak memasukkan rekonstruksi teologis yang tidak dinyatakan teks.
- issue: Apakah וְרוּחַ אֱלֹהִים berarti Roh Allah atau angin dari Allah
  choice: Roh Allah
  alternative: angin dari Allah atau angin Allah
  rationale: Frasa Ibrani memang ambigu. Teks utama memakai bacaan personal yang kuat dan tradisional, sedangkan kemungkinan meteorologis dicatat agar ketegangan penafsirannya tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Pengulangan 'dan' mempertahankan pola penghubung Ibrani. Penanda catatan kaki ditempatkan tepat setelah frasa ambigu 'Roh Allah' agar rujukannya jelas.
