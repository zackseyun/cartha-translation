  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: id
  text: Bagi segala binatang di bumi, segala burung di langit, dan segala yang merayap di atas bumi yang bernyawa[a], segala tumbuhan hijau menjadi makanan.[b] Dan terjadilah demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang di dalamnya ada makhluk hidup.”'
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani melanjutkan susunan kalimat ayat 29 dan tidak mengulangi kata kerja “Kuberikan”; karena itu dapat juga diterjemahkan: “Kuberikan segala tumbuhan hijau sebagai makanan.”'
    reason: ellipsis_and_translation_alternative
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: segala binatang di bumi
  rationale: Frasa ini menunjuk pada kelompok binatang darat. Pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit artinya menjadi hanya binatang liar.
- source_word: עוֹף הַשָּׁמַיִם
  choice: segala burung di langit
  rationale: עוֹף dapat mencakup makhluk terbang, tetapi dalam konteks Kejadian 1, 'burung' merupakan padanan Indonesia yang paling jelas; שָׁמַיִם secara idiomatis diterjemahkan 'langit'.
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: segala yang merayap di atas bumi
  rationale: Mempertahankan gambaran konkret verba רמש tanpa memperluasnya menjadi semua yang sekadar bergerak.
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: yang bernyawa
  rationale: Ungkapan ringkas ini menyampaikan bahwa makhluk tersebut memiliki kehidupan. Ini tidak dicampuradukkan dengan נִשְׁמַת חַיִּים, 'napas kehidupan', dalam Kejadian 2:7; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: segala tumbuhan hijau
  rationale: Gabungan יֶרֶק dan עֵשֶׂב menunjuk pada tumbuh-tumbuhan hijau; pilihan ini jelas dan wajar bagi pembaca modern.
- source_word: לְאָכְלָה
  choice: menjadi makanan
  rationale: Lamed menyatakan fungsi atau tujuan, yakni untuk dimakan; 'menjadi makanan' sesuai dengan konstruksi kalimat Indonesia yang dipakai.
- source_word: וַיְהִי כֵן
  choice: Dan terjadilah demikian
  rationale: Mempertahankan rumus penggenapan khas Kejadian 1 dengan ragam bahasa yang bermartabat dan alami.
theological_decisions:
- issue: Makna נֶפֶשׁ חַיָּה ketika dikenakan pada binatang
  choice: yang bernyawa
  alternative: yang di dalamnya terdapat nyawa yang hidup; makhluk hidup
  rationale: נֶפֶשׁ חַיָּה menyatakan kehidupan makhluk dan tidak boleh diterjemahkan sebagai 'napas kehidupan', yang merupakan ungkapan Ibrani berbeda. 'Bernyawa' menjaga maksud konteks tanpa menetapkan antropologi denominasi tertentu.
- issue: Elipsis verba pemberian dari ayat 29
  choice: segala tumbuhan hijau menjadi makanan
  alternative: Kuberikan segala tumbuhan hijau sebagai makanan
  rationale: Teks ayat 30 melanjutkan susunan ayat 29 tetapi tidak mengulangi verba נָתַתִּי. Kalimat utama dibuat lengkap dalam bahasa Indonesia tanpa menyisipkan pelaku dan verba secara diam-diam; hubungan eliptisnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Pengulangan 'segala' mempertahankan keluasan tiga kelompok makhluk, sedangkan susunan 'Bagi ... menjadi makanan' mempertahankan elipsis sumber tanpa menghasilkan kalimat yang janggal.
