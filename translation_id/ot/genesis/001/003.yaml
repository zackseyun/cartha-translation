  yaml_path: translation/ot/genesis/001/003.yaml
  text: And God said[a], “Let there be light,” and there was light.
translation:
  language: id
  text: Lalu Allah berfirman[a], “Jadilah terang!” Maka terang pun ada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarlah ada terang.” Bentuk jusif dalam bahasa Ibrani mengungkapkan kehendak atau perintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol dari אמר melanjutkan rangkaian narasi. “Lalu” menyatakan urutan peristiwa secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat bagi perkataan Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, nomina berbentuk jamak ini memiliki kesesuaian verba tunggal dan menunjuk kepada Sang Pencipta yang esa; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: יְהִי
  choice: Jadilah
  rationale: Bentuk jusif dari היה mengungkapkan kehendak atau perintah. “Jadilah” secara ringkas dan alami menyampaikan titah penciptaan, tanpa mengubahnya menjadi pernyataan biasa.
- source_word: אוֹר
  choice: terang
  rationale: Arti leksikal dasarnya ialah “terang” atau “cahaya”. “Terang” cocok dengan ungkapan titah “Jadilah terang” dan tidak mempersempitnya menjadi sumber cahaya tertentu atau makna kiasan.
- source_word: וַיְהִי
  choice: Maka ... pun ada
  rationale: Bentuk wayyiqtol dari היה menyatakan hasil langsung dari firman Allah. Susunan “Maka ... pun ada” alami dalam bahasa Indonesia serta mempertahankan hubungan hasil dan penekanan pada terwujudnya titah itu.
- source_word: אוֹר
  choice: terang
  rationale: Pengulangan nomina Ibrani dipertahankan untuk menegaskan bahwa tepat apa yang diperintahkan Allah kemudian terwujud.
theological_decisions:
- issue: Penerjemahan titah penciptaan ilahi
  choice: Jadilah terang!
  alternative: Biarlah ada terang.
  rationale: Jusif Ibrani menyatakan kehendak atau perintah ilahi. “Jadilah terang!” mempertahankan daya titah yang efektif dan gaya khidmat, sementara catatan kaki menjaga kemungkinan nuansa volitif “Biarlah ada terang” tanpa menetapkan tafsir teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Tanda seru dipakai untuk memperjelas daya titah dalam ungkapan “Jadilah terang!”, sementara urutan firman dan pemenuhannya dipertahankan secara dekat dengan teks Ibrani.
