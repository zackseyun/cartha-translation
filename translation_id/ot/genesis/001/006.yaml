base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: id
  text: Lalu Allah berfirman, “Hendaklah ada bentangan[a] di tengah-tengah air itu, dan hendaklah bentangan itu memisahkan air dari air.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cakrawala”, “firmamen”, atau “kubah”. Kata Ibrani רָקִיעַ merujuk pada sesuatu yang dibentangkan; pilihan terjemahan berbeda-beda menurut seberapa jelas gambaran kosmologis kuno dinyatakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memisahkan antara air dan air”, yaitu membedakan satu kumpulan air dari kumpulan air yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur narasi. “Lalu” menyatakan perkembangan cerita tanpa menentukan selang waktu, sedangkan “berfirman” sesuai untuk ujaran ilahi dalam ragam Alkitab Indonesia yang tetap modern dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk nomina ini secara morfologis jamak, verba yang menyertainya berbentuk tunggal dan dalam Kejadian 1 merujuk kepada Sang Pencipta yang esa. “Allah” adalah padanan baku bahasa Indonesia.
- source_word: יְהִי
  choice: Jadilah
  rationale: Bentuk jusif dari היה mengungkapkan titah ilahi yang langsung berlaku. “Jadilah” mempertahankan daya performatif itu secara ringkas dan alami.
- source_word: רָקִיעַ
  choice: bentangan
  rationale: Kata ini menunjuk pada sesuatu yang terbentang atau dihamparkan. “Bentangan” mempertahankan citra dasar tersebut tanpa menetapkan secara berlebihan bentuk fisik tertentu dalam gambaran kosmologis kuno.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Frasa ini menyatakan letak di tengah atau di dalam lingkungan air; “di tengah-tengah” dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia.
- source_word: הַמָּיִם
  choice: air itu
  rationale: מַיִם berbentuk jamak dalam bahasa Ibrani, tetapi bahasa Indonesia lazim memakai nomina massa tunggal “air”. Kata penunjuk “itu” menandai kehadiran artikel Ibrani dan merujuk kembali kepada air purba yang telah disebutkan.
- source_word: וִיהִי מַבְדִּיל
  choice: dan hendaklah bentangan itu memisahkan
  rationale: Bentuk jusif yang diikuti partisip Hifil menyatakan fungsi yang diperintahkan bagi bentangan tersebut. Subjek diulang agar jelas dan alami dalam bahasa Indonesia.
- source_word: בֵּין מַיִם לָמָיִם
  choice: air dari air
  rationale: Sesudah verba “memisahkan”, konstruksi Ibrani yang secara harfiah berarti “antara air dan air” paling alami dinyatakan sebagai “air dari air”, sambil tetap mempertahankan ketidakspesifikan kedua kumpulan air itu.
theological_decisions:
- issue: Pemaknaan רָקִיעַ dalam kaitannya dengan kosmologi kuno
  choice: bentangan
  alternative: cakrawala; kubah; bentangan kokoh
  rationale: Ayat ini menggambarkan sesuatu yang Allah jadikan untuk memisahkan air. “Bentangan” mencerminkan gagasan sesuatu yang terbentang tanpa secara diam-diam menetapkan apakah benda itu harus dipahami sebagai kubah padat, ruang luas, atau bentuk kosmologis tertentu. Alternatif yang lebih konkret dicatat dalam catatan kaki untuk mempertahankan perdebatan leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan irama titah penciptaan, sementara pengulangan “bentangan itu” memperjelas subjek sesuai kebutuhan bahasa sasaran. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
