  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: id
  text: Lalu Allah berfirman, “Marilah Kita menjadikan manusia[a] menurut gambar Kita, sesuai dengan rupa Kita[b], dan biarlah mereka berkuasa[c] atas ikan-ikan di laut, burung-burung di langit, ternak, seluruh bumi, dan segala binatang melata yang merayap di bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani ’adam di sini berbentuk tunggal tetapi bermakna kolektif: manusia sebagai satu jenis. Karena itu, ayat ini kemudian memakai bentuk jamak “mereka.” Dapat juga diterjemahkan “umat manusia.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan jamak “Marilah Kita,” “gambar Kita,” dan “rupa Kita” mengikuti teks Ibrani. Ungkapan ini dipahami dengan beragam cara: sebagai pertimbangan ilahi, sapaan kepada sidang surgawi, atau—dalam pembacaan kanonik Kristen—petunjuk yang selaras dengan pewahyuan Tritunggal kemudian.'
    reason: alternative_reading
  - marker: c
    text: Dapat juga diterjemahkan “memerintah” atau “menguasai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan urutan kisah. “Lalu” alami dalam narasi Indonesia, sedangkan “berfirman” merupakan padanan yang wajar dan bermartabat untuk perkataan Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini verba tunggal menunjukkan bahwa yang dimaksud ialah Allah yang esa; “Allah” adalah sebutan baku dalam Alkitab bahasa Indonesia.
- source_word: נַעֲשֶׂה
  choice: Marilah Kita menjadikan
  rationale: Bentuk orang pertama jamak yang bersifat kohortatif dipertahankan tanpa menentukan siapa yang diajak berbicara atau menafsirkan makna teologis bentuk jamaknya.
- source_word: אָדָם
  choice: manusia
  rationale: Di sini אָדָם adalah nomina tunggal kolektif yang menunjuk umat manusia sebagai satu jenis; kelanjutannya memakai verba jamak, “mereka berkuasa.” “Manusia” mempertahankan cakupan kolektif secara alami dalam bahasa Indonesia.
- source_word: בְּצַלְמֵנוּ
  choice: menurut gambar Kita
  rationale: צֶלֶם berarti gambar, bentuk, atau representasi. “Menurut gambar Kita” mempertahankan gagasan kesesuaian tanpa menjelaskan hakikat gambar itu secara berlebihan.
- source_word: כִּדְמוּתֵנוּ
  choice: sesuai dengan rupa Kita
  rationale: כ + דְּמוּת menyatakan kesesuaian atau kemiripan. “Rupa” membedakannya dari “gambar” sambil mempertahankan hubungan kedua ungkapan tersebut.
- source_word: וְיִרְדּוּ
  choice: dan biarlah mereka berkuasa
  rationale: Bentuk orang ketiga jamak bersifat jusif. “Biarlah mereka berkuasa” mempertahankan nuansa kehendak atau penetapan, serta peralihan dari “manusia” yang kolektif kepada “mereka.”
- source_word: בִדְגַת הַיָּם
  choice: atas ikan-ikan di laut
  rationale: Padanan Indonesia yang alami bagi konstruksi Ibrani ini; bentuk ulang menandai kelas ikan secara kolektif.
- source_word: וּבְעוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: עוֹף menunjuk makhluk terbang, dan שָׁמַיִם dalam konteks ini secara alami berarti ruang langit tempat burung terbang.
- source_word: וּבַבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה di sini paling mungkin menunjuk kelompok hewan darat yang dipelihara; “ternak” tepat, ringkas, dan modern.
- source_word: וּבְכָל הָאָרֶץ
  choice: seluruh bumi
  rationale: Dalam kisah penciptaan, אֶרֶץ memiliki cakupan kosmis, bukan sekadar suatu negeri atau wilayah setempat.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: segala binatang melata yang merayap
  rationale: רֶמֶשׂ menunjuk makhluk yang bergerak dekat permukaan tanah. Pasangan “melata ... merayap” mempertahankan pengulangan akar Ibrani dengan ungkapan Indonesia yang dapat dipahami.
theological_decisions:
- issue: Ungkapan jamak “Marilah Kita ... gambar Kita ... rupa Kita”
  choice: Mempertahankan bentuk jamak tanpa menentukan lawan bicara Allah atau penjelasan teologisnya dalam teks utama.
  alternative: Menafsirkannya sebagai pertimbangan ilahi, sapaan kepada sidang surgawi, atau—dalam pembacaan kanonik Kristen—petunjuk yang selaras dengan pewahyuan Tritunggal kemudian.
  rationale: Teks Ibrani memang menggunakan bentuk orang pertama jamak, tetapi ayat ini sendiri tidak secara eksplisit menjelaskan rujukannya. Terjemahan harus mempertahankan ketegangan tersebut.
- issue: Makna kolektif אָדָם
  choice: Menggunakan “manusia” sebagai nomina tunggal kolektif.
  alternative: “Umat manusia” atau “Adam.”
  rationale: Klausa berikutnya beralih kepada verba orang ketiga jamak, sehingga jelas bahwa manusia dipandang sebagai satu jenis yang terdiri atas banyak orang. “Adam” akan terlalu cepat menjadikannya nama diri dalam konteks ini.
- issue: Sifat kekuasaan manusia atas ciptaan
  choice: Menerjemahkan רדה sebagai “berkuasa atas” tanpa menambahkan batasan atau penilaian moral yang tidak dinyatakan dalam ayat ini.
  alternative: “Memerintah atas” atau “menguasai.”
  rationale: Verba itu menyatakan pemerintahan atau kekuasaan. Konteks kanonik dapat membentuk pemahaman etisnya, tetapi terjemahan ayat ini tidak boleh memasukkan penjelasan tersebut ke dalam kata kerja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi “Kita” digunakan untuk pronomina yang merujuk kepada Allah sesuai kebiasaan penulisan religius Indonesia, tanpa menyelesaikan ambiguitas bentuk jamak Ibrani. Struktur daftar diringkas secara alami dengan tetap mempertahankan seluruh cakupan makhluk dan bumi dalam teks sumber.
