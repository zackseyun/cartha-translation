  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: id
  text: Maka Allah membuat bentangan itu dan memisahkan air yang ada di bawah bentangan itu dari air yang ada di atas bentangan itu.[a] Dan terjadilah demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cakrawala” (tradisional); juga mungkin “kubah langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה lazim berarti ‘membuat’ atau ‘melakukan’. Dalam konteks penciptaan ini, ‘membuat’ merupakan padanan langsung dan alami tanpa menambahkan nuansa khusus seperti ‘membentuk’.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, אֱלֹהִים disertai kata kerja tunggal dan menunjuk kepada satu-satunya Allah Sang Pencipta. ‘Allah’ adalah sebutan baku dalam bahasa Indonesia.
- source_word: הָרָקִיעַ
  choice: bentangan
  rationale: רָקִיעַ menunjuk kepada sesuatu yang dibentangkan atau dihamparkan. ‘Bentangan’ mempertahankan gambaran dasar kata Ibrani tanpa menentukan secara berlebihan bentuk atau susunan kosmologisnya.
- source_word: וַיַּבְדֵּל
  choice: memisahkan
  rationale: בדל berarti ‘memisahkan’ atau ‘membedakan’. ‘Memisahkan’ sesuai dengan tindakan penataan yang berulang dalam Kejadian 1.
- source_word: בֵּין ... וּבֵין
  choice: '... dari ...'
  rationale: Susunan Ibrani ini membedakan dua unsur. Dalam bahasa Indonesia, pola ‘memisahkan X dari Y’ menyampaikan maknanya secara wajar.
- source_word: הַמַּיִם
  choice: air
  rationale: Walaupun bentuk kata Ibrani ini bersifat jamak, מים lazim berfungsi sebagai nomina massa. Dalam bahasa Indonesia, ‘air’ merupakan bentuk alami dan tidak menghilangkan cakupan kolektifnya.
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: yang ada di bawah bentangan itu
  rationale: Terjemahan ini mempertahankan hubungan ruang vertikal yang dinyatakan oleh מִתַּחַת dan berpasangan jelas dengan ‘di atas’.
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: yang ada di atas bentangan itu
  rationale: Terjemahan ini menyampaikan מֵעַל secara langsung dan mempertahankan kontras dengan ‘di bawah’.
- source_word: וַיְהִי כֵן
  choice: Jadilah demikian
  rationale: Ungkapan ini adalah rumus berulang dalam Kejadian 1 yang menandai terlaksananya ketetapan Allah. ‘Jadilah demikian’ ringkas, wajar, dan mempertahankan corak sastra bagian tersebut.
theological_decisions:
- issue: Penerjemahan רָקִיעַ dalam konteks penciptaan dan gambaran kosmologis
  choice: bentangan
  alternative: cakrawala; kubah langit
  rationale: ‘Bentangan’ mempertahankan gagasan sesuatu yang terbentang tanpa memaksakan rekonstruksi kosmologis tertentu. ‘Cakrawala’ mudah dipahami tetapi dalam pemakaian modern dapat mengarah kepada garis horizon atau langit, sedangkan ‘kubah langit’ lebih tegas menentukan bentuknya daripada yang perlu dinyatakan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘bentangan itu’ dipertahankan untuk mencerminkan struktur ayat Ibrani dan menjaga kejelasan hubungan ruang. ‘Maka’ menghubungkan tindakan ini dengan firman Allah pada ayat sebelumnya.
