  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: id
  text: Lalu Allah berfirman, “Jadilah benda-benda penerang di bentangan langit untuk memisahkan siang dari malam. Biarlah benda-benda itu menjadi tanda-tanda untuk waktu-waktu yang ditetapkan[a], serta untuk hari-hari dan tahun-tahun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “musim-musim.” Kata Ibrani ini berarti waktu-waktu yang ditetapkan dan dalam konteks lain dapat mencakup waktu perayaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: benda-benda penerang
  rationale: Nomina Ibrani ini menunjuk kepada pembawa atau sumber cahaya. Pilihan ini lebih tepat daripada sekadar 'cahaya' dan tetap mudah dipahami dalam konteks penciptaan.
- source_word: רָקִיעַ
  choice: bentangan
  rationale: '''Bentangan'' menyampaikan sesuatu yang terbentang luas tanpa mengharuskan gambaran teknis berupa kubah padat.'
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada ranah langit tempat benda-benda penerang berada; bentuk tunggal kolektif merupakan ungkapan Indonesia yang alami.
- source_word: לְהַבְדִּיל
  choice: untuk memisahkan
  rationale: Infinitif ini menyatakan tujuan dan mempertahankan motif pemisahan yang berulang dalam Kejadian 1.
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: siang dari malam
  rationale: Ungkapan 'memisahkan X dari Y' alami dalam bahasa Indonesia dan menyampaikan konstruksi Ibrani secara tepat.
- source_word: לְאֹתֹת
  choice: menjadi tanda
  rationale: אות dapat berarti tanda atau penanda; terjemahan ini menjaga cakupan maknanya tanpa menentukan fungsi yang lebih sempit.
- source_word: לְמוֹעֲדִים
  choice: untuk waktu-waktu yang ditetapkan
  rationale: מוֹעֲדִים menunjuk pada waktu-waktu tertentu atau yang ditetapkan dan dalam konteks lain dapat mencakup hari raya; pilihan ini tidak membatasinya hanya pada musim atau perayaan.
- source_word: לְיָמִים וְשָׁנִים
  choice: untuk hari-hari dan tahun-tahun
  rationale: Terjemahan langsung ini mempertahankan satuan waktu yang disebutkan dalam teks.
- source_word: יְהִי ... וְהָיוּ
  choice: Jadilah ... Biarlah semuanya menjadi
  rationale: Bentuk ini mempertahankan gaya firman penciptaan dan nuansa kehendak atau perintah pada kedua verba.
theological_decisions:
- issue: Makna מוֹעֲדִים dalam konteks penciptaan
  choice: waktu-waktu yang ditetapkan
  alternative: musim-musim; hari-hari raya
  rationale: Konteksnya adalah penataan waktu secara kosmis. Pilihan ini mempertahankan makna luas dan kemungkinan gema pada waktu perayaan tanpa memasukkan arti liturgis secara khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Benda-benda penerang' dipilih demi ketepatan makna, sedangkan 'bentangan langit' menjaga gambaran teks tanpa memakai istilah arkais atau terlalu teknis.
