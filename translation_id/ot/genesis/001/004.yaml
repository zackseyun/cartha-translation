  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: id
  text: Allah melihat bahwa terang itu baik, lalu Allah memisahkan terang dari kegelapan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membedakan terang dari kegelapan”; kata kerja Ibrani ini juga dapat menyatakan pembedaan antara dua hal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה paling langsung berarti 'melihat'; dalam konteks ini juga mencakup penilaian, tanpa perlu dibuat lebih eksplisit.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1, nomina berbentuk jamak ini berpadanan dengan verba tunggal dan menunjuk kepada Sang Pencipta yang esa; 'Allah' adalah padanan baku dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: הָאוֹר
  choice: terang itu
  rationale: Artikel tertentu menunjuk kepada terang yang baru saja dijadikan; 'terang itu' menyatakan rujukan tertentu secara alami.
- source_word: כִּי
  choice: bahwa
  rationale: 'Di sini כִּי memperkenalkan isi yang dilihat atau dinilai Allah: bahwa terang itu baik.'
- source_word: טוֹב
  choice: baik
  rationale: '''Baik'' mempertahankan cakupan evaluatif umum טוֹב tanpa mempersempitnya menjadi ''menyenangkan'' atau ''bermanfaat''.'
- source_word: וַיַּבְדֵּל
  choice: lalu ... memisahkan
  rationale: בדל berarti memisahkan atau membedakan. 'Memisahkan' sesuai dengan konteks penataan ciptaan, sedangkan 'lalu' mengungkapkan kelanjutan narasi wayyiqtol secara alami.
- source_word: בֵּין ... וּבֵין
  choice: '... dari ...'
  rationale: Walaupun secara harfiah konstruksinya 'antara ... dan ...', sesudah verba 'memisahkan' bentuk idiomatis bahasa Indonesia ialah 'memisahkan X dari Y'.
- source_word: הַחֹשֶׁךְ
  choice: kegelapan
  rationale: Kata ini menunjuk kepada kegelapan yang telah disebutkan. Dalam konstruksi 'dari kegelapan', bahasa Indonesia tidak memerlukan penanda demonstratif untuk tetap menyampaikan rujukan tersebut.
theological_decisions:
- issue: Pengulangan subjek אֱלֹהִים dalam kedua klausa
  choice: Mengulang 'Allah' dalam kedua klausa
  alternative: Menggunakan pronomina 'Ia' pada klausa kedua
  rationale: Teks Ibrani secara eksplisit mengulang subjek ilahi. Pengulangan dipertahankan untuk mencerminkan irama dan penekanannya tanpa menambahkan tafsiran doktrinal.
- issue: Sifat pemisahan antara terang dan kegelapan
  choice: Menerjemahkan dengan 'memisahkan' tanpa menentukan apakah pemisahan itu bersifat ruang, waktu, atau konsep
  alternative: '''membagi'' atau ''membedakan'''
  rationale: Teks menyatakan tindakan pemisahan tetapi tidak menjelaskan mekanismenya; terjemahan mempertahankan keterbukaan kosmologis dan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Allah' dipakai sebagai sebutan baku bagi God dalam tradisi Alkitab bahasa Indonesia. Konjungsi 'lalu' menjaga alur naratif yang alami, dan pengulangan 'Allah' mempertahankan bentuk sumber.
