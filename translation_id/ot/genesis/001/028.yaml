  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: id
  text: Lalu Allah memberkati mereka dan berfirman kepada mereka, “Beranakcuculah dan bertambah banyak; penuhilah bumi dan taklukkanlah bumi itu. Berkuasalah[a] atas ikan-ikan di laut, burung-burung di langit, dan setiap makhluk hidup yang bergerak[b] di atas bumi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memerintah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang merayap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Bentuk piel dari ברך menyatakan tindakan Allah menganugerahkan berkat; ‘memberkati’ merupakan padanan Indonesia yang langsung dan alami.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam Kejadian 1 bentuk ini disertai verba tunggal dan menunjuk kepada satu-satunya Allah; ‘Allah’ adalah sebutan baku dalam bahasa Indonesia.
- source_word: פְּרוּ וּרְבוּ
  choice: Beranakcuculah dan bertambah banyak
  rationale: Ungkapan ini menyampaikan kesuburan atau hadirnya keturunan dan pertambahan jumlah. ‘Beranakcuculah’ mempertahankan idiom Alkitab Indonesia yang ringkas, sedangkan ‘bertambah banyak’ menyatakan רבה secara jelas.
- source_word: וּמִלְאוּ אֶת־הָאָרֶץ
  choice: penuhilah bumi
  rationale: מלא berarti memenuhi, dan dalam konteks penciptaan universal אֶרֶץ menunjuk kepada bumi, bukan wilayah tertentu.
- source_word: וְכִבְשֻׁהָ
  choice: taklukkanlah itu
  rationale: כבש membawa arti kuat, yaitu membawa sesuatu ke bawah penguasaan. Terjemahan ini mempertahankan daya verba tanpa menambahkan gagasan eksploitasi ataupun melunakkannya menjadi sekadar pemeliharaan.
- source_word: וּרְדוּ
  choice: Berkuasalah atas
  rationale: רדה berarti menjalankan kekuasaan atau pemerintahan atas sesuatu. ‘Berkuasalah atas’ jelas, wajar, dan mempertahankan kekuatan mandat tersebut.
- source_word: בִּדְגַת הַיָּם
  choice: ikan-ikan di laut
  rationale: Frasa konstruksi ini secara khusus menyebut ikan; bentuk ulang lazim dipakai dalam bahasa Indonesia untuk kelompok ikan secara umum.
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: עוֹף dapat mencakup makhluk terbang, tetapi dalam konteks ini ‘burung-burung’ adalah padanan alami; שָׁמַיִם di sini secara idiomatis berarti langit.
- source_word: בְכָל־חַיָּה
  choice: setiap makhluk hidup
  rationale: חַיָּה di sini merupakan istilah luas bagi makhluk atau binatang hidup dan tidak perlu dipersempit menjadi binatang liar.
- source_word: הָרֹמֶשֶׂת
  choice: yang bergerak
  rationale: Partisip רמש menggambarkan gerak di permukaan tanah. ‘Bergerak’ mempertahankan cakupan luasnya, sementara ‘merayap’ tetap merupakan kemungkinan leksikal.
theological_decisions:
- issue: Kekuatan mandat manusia terhadap ciptaan dalam כבש dan רדה
  choice: Mempertahankan bahasa kuat ‘taklukkanlah’ dan ‘berkuasalah atas’.
  alternative: ‘Peliharalah’ atau ‘jadilah pengelola atas’; untuk רדה juga mungkin ‘memerintahlah atas’.
  rationale: Kedua verba Ibrani lebih kuat daripada sekadar merawat. Terjemahan tidak menambah pengesahan terhadap eksploitasi, tetapi juga tidak melunakkan mandat menjadi konsep penatalayanan yang tidak dinyatakan oleh verba-verba tersebut.
- issue: Cakupan הָאָרֶץ
  choice: bumi
  alternative: tanah atau negeri
  rationale: Konteks penciptaan universal dalam Kejadian 1 menunjukkan bumi secara keseluruhan, bukan suatu wilayah atau negeri tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Koordinasi Ibrani disajikan dengan tanda baca alami tanpa menghilangkan urutan mandat. Pronomina enklitik pada וְכִבְשֻׁהָ diterjemahkan ‘itu’ agar acuannya kepada bumi tetap eksplisit. Semua penanda catatan kaki muncul dalam teks utama.
