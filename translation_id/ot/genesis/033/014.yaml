base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: id
  text: Biarlah tuanku berjalan lebih dahulu daripada hambanya ini, sedangkan aku akan berjalan perlahan-lahan, sesuai dengan langkah ternak[a] yang ada di depanku dan dengan langkah anak-anak, sampai aku tiba kepada tuanku di Seir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “ternak” biasanya dapat berarti “pekerjaan”, “harta”, atau “milik”, tetapi dalam konteks ini tampaknya menunjuk kepada hewan-hewan yang sedang digiring.
    reason: lexical_alternative
  - marker: b
    text: Atau “sampai aku tiba kepada tuanku, ke Seir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: Biarlah ... berjalan lebih dahulu
  rationale: Bentuk yiqtol yang disertai נָא menyatakan permohonan sopan; ungkapan ini mempertahankan kesantunan serta arah geraknya.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan ini menunjukkan sikap hormat Yakub kepada Esau tanpa mengacu kepada Tuhan.
- source_word: לִפְנֵי עַבְדּוֹ
  choice: lebih dahulu daripada hambanya ini
  rationale: Secara idiomatis berarti bergerak di depan; bentuk orang ketiga dipertahankan sebagai cara Yakub merendahkan diri dalam percakapan.
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: aku akan berjalan perlahan-lahan
  rationale: Bentuk hitpael נהל dapat menggambarkan bergerak atau membawa rombongan dengan hati-hati; terjemahan ini alami dan tidak memaksakan makna transitif.
- source_word: לְרֶגֶל
  choice: mengikuti langkah
  rationale: Ungkapan harfiahnya, 'menurut kaki', menyatakan bahwa gerak Yakub disesuaikan dengan laju ternak dan anak-anak.
- source_word: הַמְּלָאכָה
  choice: ternak
  rationale: Walaupun kata ini lazim berarti pekerjaan, harta, atau milik, dalam konteks perjalanan rombongan pastoral ini paling mungkin menunjuk kepada hewan yang digiring.
- source_word: אֲשֶׁר לְפָנַי
  choice: yang ada di depanku
  rationale: Mempertahankan gambaran spasial teks Ibrani tanpa menambahkan gagasan bahwa ternak itu sekadar berada di bawah tanggung jawab Yakub.
- source_word: הַיְלָדִים
  choice: anak-anak
  rationale: Padanan langsung dan wajar bagi anak-anak Yakub yang ikut dalam rombongan.
- source_word: עַד אֲשֶׁר אָבֹא
  choice: sampai aku tiba
  rationale: Menyampaikan batas waktu perjalanan dengan bahasa Indonesia yang alami.
- source_word: שֵׂעִירָה
  choice: di Seir
  rationale: Akhiran direktif menyatakan tujuan menuju Seir; setelah 'tiba kepada tuanku', bahasa Indonesia secara alami memakai 'di Seir' untuk tempat tibanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Sapaan “tuanku” serta rujukan diri “hambanya ini” mempertahankan sikap merendah Yakub, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini.
