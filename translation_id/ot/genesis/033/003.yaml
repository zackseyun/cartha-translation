  edition: WLC
  text: וְ/ה֖וּא עָבַ֣ר לִ/פְנֵי/הֶ֑ם וַ/יִּשְׁתַּ֤חוּ אַ֨רְצָ/ה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד גִּשְׁתּ֖/וֹ עַד אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: id
  text: Ia sendiri berjalan mendahului mereka, lalu membungkuk sampai ke tanah tujuh kali[a] hingga ia mendekati saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersujud”; kata kerja Ibrani ini dapat menunjuk pada tindakan merendahkan diri dengan tubuh sampai ke tanah sebagai tanda hormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: Ia sendiri
  rationale: Pronomina mandiri memberi penekanan pada tindakan pribadi Yakub, sehingga diterjemahkan dengan bentuk emfatis yang alami dalam bahasa Indonesia.
- source_word: עָבַר לִפְנֵיהֶם
  choice: berjalan mendahului mereka
  rationale: Dalam konteks ini, frasa tersebut menggambarkan Yakub bergerak ke depan dan mengambil posisi di muka keluarganya, bukan sekadar melintas di hadapan mereka.
- source_word: וַיִּשְׁתַּחוּ ... אַרְצָה
  choice: membungkuk sampai ke tanah
  rationale: Ungkapan ini mempertahankan tindakan penghormatan yang bersifat jasmani tanpa menafsirkannya secara khusus sebagai penyembahan; 'sampai ke tanah' mengungkapkan arah dan dalamnya gerakan.
- source_word: שֶׁבַע פְּעָמִים
  choice: tujuh kali
  rationale: Terjemahan langsung dan alami dari ungkapan bilangan Ibrani.
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: hingga ia mendekati saudaranya
  rationale: Konstruksi ini menyatakan batas berlangsungnya tindakan berulang tersebut, yaitu sampai Yakub berada dekat dengan saudaranya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina 'ia' dipakai untuk register tulisan, sedangkan 'saudaranya' mempertahankan hubungan keluarga tanpa menambahkan nama yang tidak terdapat dalam ayat.
