  source_fidelity: Teks dengan setia menyampaikan penekanan pronomina mandiri (“Ia sendiri”), tindakan Yakub bergerak di depan keluarganya, penghormatan jasmani sampai ke tanah yang dilakukan tujuh kali, serta batas tindakan itu sampai ia mendekati saudaranya. “Membungkuk sampai ke tanah” tidak memaksakan makna ibadah dan, bersama catatan kaki, cukup mencakup kemungkinan sujud penuh dari וַיִּשְׁתַּחוּ אַרְצָה.
  naturalness: Bahasa Indonesia baku, mengalir, dan sesuai register naratif. “Berjalan mendahului mereka” dan “hingga ia mendekati saudaranya” wajar dalam konteks ini.
