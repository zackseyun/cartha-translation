base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: id
  text: Esau berlari menyongsongnya, lalu memeluknya, merangkul lehernya, dan menciumnya.[a] Kemudian mereka berdua menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam Teks Masoret, kata yang diterjemahkan “menciumnya” diberi titik-titik yang tidak biasa di atas huruf-hurufnya. Sebagian penafsir menganggap tanda itu menyatakan keraguan atau penekanan, tetapi makna lugas bahasa Ibraninya di sini ialah “menciumnya”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Kata kerja רוץ secara langsung menyatakan tindakan berlari dan mempertahankan gerak cepat dalam narasi.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama diri ini mengikuti bentuk yang lazim dalam bahasa Indonesia.
- source_word: לִקְרָאתוֹ
  choice: menyongsongnya
  rationale: Ungkapan לקראת menunjuk pada gerak keluar untuk menemui seseorang; 'menyongsongnya' ringkas, alami, dan mempertahankan nuansa relasional itu.
- source_word: וַיְחַבְּקֵהוּ
  choice: memeluknya
  rationale: חבק berarti memeluk; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: merangkul lehernya
  rationale: Secara harfiah ungkapan ini berarti 'jatuh pada lehernya', suatu idiom Ibrani untuk pelukan emosional. 'Merangkul lehernya' menyampaikan gambaran tindakannya secara alami tanpa kehilangan unsur leher.
- source_word: וַיִּשָּׁקֵהוּ
  choice: menciumnya
  rationale: Dalam bentuk ini נשק berarti mencium. Makna lugas dipertahankan, sedangkan penandaan Masoret yang tidak biasa dijelaskan dalam catatan kaki.
- source_word: וַיִּבְכּוּ
  choice: mereka berdua menangis
  rationale: Bentuk jamak menunjukkan bahwa kedua tokoh menangis. Penambahan 'berdua' memperjelas subjek jamak yang tersirat tanpa mengubah makna.
theological_decisions:
- issue: Penafsiran tindakan Esau terhadap Yakub
  choice: Rangkaian tindakan diterjemahkan secara lugas sebagai ungkapan kasih dan perdamaian, tanpa menambahkan kecurigaan.
  alternative: Menafsirkan ciuman itu secara mencurigakan atau ironis berdasarkan tradisi penafsiran kemudian.
  rationale: Narasi Ibrani menyajikan tindakan Esau melalui rangkaian cepat kata kerja penuh kasih. Terjemahan mempertahankan makna permukaan teks dan menempatkan persoalan tanda Masoret dalam catatan kaki, bukan memasukkan tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Menyongsongnya' dipilih sebagai padanan idiomatis, sedangkan idiom harfiah 'jatuh pada lehernya' diungkapkan secara alami sebagai 'merangkul lehernya'.
