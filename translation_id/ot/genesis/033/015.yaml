base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: id
  text: Lalu Esau berkata, “Izinkanlah aku meninggalkan beberapa orang yang bersamaku untuk menyertaimu.” Namun Yakub berkata, “Untuk apa? Cukuplah bagiku mendapat perkenanan di mata tuanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: Izinkanlah aku meninggalkan
  rationale: Bentuk kohortatif dengan partikel permohonan נָּא menyatakan tawaran sopan; ‘meninggalkan’ secara alami menyampaikan maksud menempatkan sebagian rombongan Esau bersama Yakub.
- source_word: עִמְּךָ
  choice: untuk menyertaimu
  rationale: Secara harfiah ‘bersamamu’; dalam konteks orang-orang yang ditinggalkan, bahasa Indonesia memerlukan ungkapan yang menjelaskan bahwa mereka akan tetap bersama dan mendampingi Yakub.
- source_word: לָמָּה זֶּה
  choice: Untuk apa?
  rationale: Ungkapan ini mempertanyakan perlunya tawaran Esau; terjemahan ringkas ini alami dalam bahasa Indonesia dan tidak menambahkan alasan yang tidak dinyatakan.
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: Biarlah aku mendapat kemurahan di mata tuanku
  rationale: Mempertahankan idiom Ibrani ‘mendapat kemurahan di mata’ serta sapaan hormat Yakub kepada Esau.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Subjek jawaban kedua dijelaskan sebagai ‘Yakub’ untuk menghindari ketidakjelasan pronomina dalam bahasa Indonesia; nada merendah Yakub dipertahankan melalui ‘tuanku’.
