  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga kelompok dibuat jelas dengan “di depan”, “di belakang mereka”, dan “paling belakang”, sambil mempertahankan sebutan status rumah tangga bagi Bilha dan Zilpa tanpa menggantinya dengan tafsiran “selir”.
