  text: וַ/יָּ֧שֶׂם אֶת הַ/שְּׁפָח֛וֹת וְ/אֶת יַלְדֵי/הֶ֖ן רִֽאשֹׁנָ֑ה וְ/אֶת לֵאָ֤ה וִֽ/ילָדֶ֨י/הָ֙ אַחֲרֹנִ֔ים וְ/אֶת רָחֵ֥ל וְ/אֶת יוֹסֵ֖ף אַחֲרֹנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/002.yaml
  text: And he put the female servants and their children first[a], and Leah and her children behind them, and Rachel and Joseph last.
translation:
  language: id
  text: Ia menempatkan para hamba perempuan dan anak-anak mereka di depan[a], Lea dan anak-anaknya di belakang mereka, lalu Rahel dan Yusuf paling belakang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “paling depan”. Istilah Ibrani yang diterjemahkan “hamba perempuan” dapat menunjuk kepada pelayan perempuan berstatus rendah dan, dalam beberapa konteks, juga dapat berarti perempuan budak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Kata kerja שׂוּם berarti menaruh atau menempatkan; “menempatkan” secara alami menyatakan tindakan mengatur mereka menurut urutan.
- source_word: הַשְּׁפָחוֹת
  choice: para hamba perempuan
  rationale: שִׁפְחָה menunjuk pada pelayan perempuan yang berstatus rendah dan dapat pula berarti perempuan budak; “hamba perempuan” mempertahankan cakupan itu tanpa menafsirkannya sebagai selir.
- source_word: יַלְדֵיהֶן
  choice: anak-anak mereka
  rationale: Bentuk ini merujuk secara umum kepada anak-anak mereka, bukan hanya anak laki-laki.
- source_word: רִאשֹׁנָה
  choice: di depan
  rationale: Dalam konteks pengaturan kelompok secara spasial, bentuk adverbial ini menunjukkan posisi terdepan.
- source_word: לֵאָה
  choice: Lea
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וִילָדֶיהָ
  choice: dan anak-anaknya
  rationale: Kata יֶלֶד memiliki arti umum “anak”; konjungsi Ibrani dipertahankan secara wajar.
- source_word: אַחֲרֹנִים
  choice: di belakang mereka
  rationale: Pada kelompok tengah, kata ini menunjukkan posisi sesudah kelompok pertama, bukan posisi paling akhir.
- source_word: רָחֵל
  choice: Rahel
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: אַחֲרֹנִים
  choice: paling belakang
  rationale: Pada kelompok terakhir, kata ini menyatakan posisi terakhir dalam susunan tersebut.
theological_decisions: []
