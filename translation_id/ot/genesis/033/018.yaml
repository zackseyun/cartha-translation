base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: id
  text: Yakub tiba dengan selamat di kota Sikhem[a], yang terletak di tanah Kanaan, ketika ia datang dari Padan-Aram, lalu ia berkemah di depan kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yakub tiba di Salem, sebuah kota di Sikhem.” Kata Ibrani שָׁלֵם (shalem) dapat dipahami sebagai “dengan selamat” atau dibaca sebagai nama tempat, “Salem.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Bentuk wayyiqtol dari בוא menyatakan kedatangan Yakub; 'tiba' alami dalam narasi Indonesia dan menghindari pengulangan 'datang' pada klausa waktu.
- source_word: שָׁלֵם
  choice: dengan selamat
  rationale: 'Paling wajar dipahami secara adverbial sebagai keadaan Yakub ketika tiba: selamat atau dalam keadaan utuh. Kemungkinan sebagai nama tempat dipertahankan dalam catatan kaki.'
- source_word: עִיר שְׁכֶם
  choice: kota Sikhem
  rationale: Rangkaian ini secara alami menunjuk pada kota bernama Sikhem.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: yang terletak di tanah Kanaan
  rationale: Menyampaikan klausa relatif penunjuk lokasi dalam bahasa Indonesia yang alami.
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: ketika ia datang dari Padan-Aram
  rationale: Preposisi ב dengan infinitif konstruk dan sufiks menyatakan waktu; terjemahan ini mempertahankan hubungan temporal secara jelas.
- source_word: פַּדַּן אֲרָם
  choice: Padan-Aram
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיִּחַן
  choice: lalu ia berkemah
  rationale: Kata kerja חנה dalam konteks ini berarti mendirikan perkemahan; 'berkemah' merupakan padanan Indonesia yang langsung dan alami.
- source_word: אֶת פְּנֵי הָעִיר
  choice: di depan kota itu
  rationale: Idiom harfiah 'muka kota' menunjuk pada area di hadapan atau di luar kota; 'di depan kota itu' mempertahankan makna ruangnya.
