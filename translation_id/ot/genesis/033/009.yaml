  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: id
  text: Namun Esau berkata[a], “Milikku banyak, saudaraku. Biarlah apa yang menjadi milikmu menjadi milikmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Milikku cukup, saudaraku. Biarlah apa yang menjadi milikmu menjadi milikmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi, sedangkan “Namun” menyatakan pertentangan ringan karena Esau menolak pemberian Yakub dengan halus.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi ditransliterasikan sesuai bentuk baku dalam bahasa Indonesia.
- source_word: יֶשׁ לִי רָב
  choice: Milikku sudah banyak
  rationale: Ungkapan kepemilikan ini secara harfiah menyatakan bahwa Esau mempunyai banyak. Rumusan ini alami dalam konteks penolakan hadiah dan mempertahankan arti kelimpahan רָב, bukan sekadar kecukupan.
- source_word: אָחִי
  choice: saudaraku
  rationale: Sapaan dengan akhiran orang pertama tunggal mempertahankan kehangatan relasional Esau terhadap Yakub.
- source_word: יְהִי לְךָ
  choice: Biarlah ... tetap menjadi milikmu
  rationale: Bentuk yusif היה berfungsi sebagai izin atau permintaan halus agar Yakub menyimpan kepunyaannya. “Tetap” menjelaskan implikasi konteks, bukan perubahan kepemilikan.
- source_word: אֲשֶׁר לָךְ
  choice: apa yang menjadi milikmu
  rationale: Frasa relatif ini menunjuk kepada kepunyaan Yakub dan diterjemahkan secara jelas serta wajar dalam bahasa Indonesia.
