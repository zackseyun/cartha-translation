  variant: modern standard Indonesian
source:
  edition: WLC
  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: id
  text: “Terimalah kiranya pemberianku[a] yang telah dibawa kepadamu, sebab Allah telah bermurah hati kepadaku dan aku memiliki segala-galanya.” Yakub terus mendesaknya, sehingga Esau menerimanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berkatku”; di sini yang dimaksud ialah pemberian yang dibawa Yakub untuk Esau.'
    reason: Menjaga makna leksikal asli sekaligus menjelaskan penggunaan kontekstualnya.
lexical_decisions:
- source_word: בִּרְכָתִי (birḵātî)
  choice: pemberianku
  rationale: Secara harfiah berarti ‘berkatku’, tetapi dalam konteks ini menunjuk pada pemberian yang Yakub bawa dan tawarkan kepada Esau. ‘Pemberianku’ menyampaikan fungsi kata tersebut secara alami, sementara nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: חַנַּנִי (ḥannanî)
  choice: telah bermurah hati kepadaku
  rationale: Bentuk verba ini menyatakan bahwa Allah telah menunjukkan kemurahan atau kasih karunia kepada Yakub.
- source_word: יֶשׁ לִי כֹל (yeš lî ḵōl)
  choice: aku memiliki segala-galanya
  rationale: Mempertahankan keluasan ungkapan Ibrani ‘ada padaku semuanya’, bukan mempersempitnya menjadi sekadar ‘aku berkecukupan’.
- source_word: וַיִּפְצַר בּוֹ (wayyiṣpar bô)
  choice: Yakub terus mendesaknya
  rationale: Verba ini menyiratkan desakan yang kuat atau berulang. Nama Yakub dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: וַיִּקָּח (wayyiqqāḥ)
  choice: sehingga Esau menerimanya
  rationale: Dalam konteks pemberian, ‘menerima’ lebih alami daripada ‘mengambil’. Nama Esau memperjelas subjek tersirat, dan ‘sehingga’ menyatakan hasil dari desakan tanpa mengubah urutan peristiwa.
theological_decisions:
- issue: Makna בִּרְכָתִי sebagai ‘berkat’ atau ‘pemberian’
  choice: pemberianku dalam teks utama, dengan arti harfiah ‘berkatku’ dalam catatan kaki
  alternative: berkatku
  rationale: Kata itu memang berarti ‘berkat’, tetapi di sini secara metonimis menunjuk pada pemberian nyata. Pilihan ini menjaga kejelasan konteks tanpa menghapus hubungan leksikal dan teologisnya dengan ‘berkat’.
- issue: Keluasan pernyataan יֶשׁ לִי כֹל
  choice: aku memiliki segala-galanya
  alternative: aku berkecukupan
  rationale: Terjemahan yang luas mempertahankan kontras dengan ucapan Esau pada ayat sebelumnya dan tidak melemahkan klaim teks menjadi sekadar kecukupan.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. ‘Terimalah kiranya’ mempertahankan nada permohonan sopan נָא, sedangkan penyebutan Yakub dan Esau menghindari rangkaian pronomina yang kurang jelas dalam bahasa Indonesia.
