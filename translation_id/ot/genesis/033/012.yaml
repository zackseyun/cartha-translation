  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: id
  text: Lalu Esau berkata, “Mari kita berangkat dan pergi, dan aku akan berjalan di depanmu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan berjalan di sampingmu.”
    reason: Ungkapan לְנֶגְדֶּךָ dapat berarti berada atau bergerak di depan seseorang, tetapi dalam konteks perjalanan juga dapat dipahami sebagai menyertai atau berjalan di sampingnya.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Esau berkata
  rationale: Waw-konsekutif melanjutkan alur cerita. Subjek tersirat dijelaskan sebagai Esau dari konteks agar bahasa Indonesia alami dan rujukannya jelas.
- source_word: נִסְעָה
  choice: Mari kita berangkat
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan untuk mulai berangkat.
- source_word: וְנֵלֵכָה
  choice: dan melanjutkan perjalanan
  rationale: הלך di sini berarti bergerak atau menempuh perjalanan. Ungkapan ini mempertahankan unsur kedua tanpa menghasilkan pengulangan Indonesia yang kaku.
- source_word: וְאֵלְכָה
  choice: Aku akan berjalan
  rationale: Bentuk orang pertama tunggal dalam konteks ini paling wajar dipahami sebagai tawaran Esau mengenai tindakannya sendiri.
- source_word: לְנֶגְדֶּךָ
  choice: di depanmu
  rationale: נגד dengan prefiks ל dapat menunjuk posisi di hadapan atau di depan seseorang. Dalam konteks perjalanan, 'di depanmu' mempertahankan makna spasial dasar, sementara kemungkinan makna menyertai dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pengulangan harfiah 'berangkat dan pergi' dihindari melalui 'berangkat dan melanjutkan perjalanan'. Penanda catatan kaki ditempatkan setelah verba pengantar karena catatan menjelaskan alternatif pada bagian akhir seluruh ujaran.
