  naturalness: Bahasa revisi tetap baku dan alami. Pengulangan 'berangkat dan pergi' mencerminkan dua verba ajakan Ibrani dan masih dapat diterima dalam gaya naratif Alkitab.
  terminology: Nama Esau tepat dan register naratif sesuai. Catatan kaki dipertahankan untuk menjaga ambiguitas leksikal tanpa memaksakan satu penafsiran.
