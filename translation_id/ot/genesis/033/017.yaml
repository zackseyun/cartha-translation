  text: וְ/יַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָ/ה וַ/יִּ֥בֶן ל֖/וֹ בָּ֑יִת וּ/לְ/מִקְנֵ֨/הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל כֵּ֛ן קָרָ֥א שֵׁם הַ/מָּק֖וֹם סֻכּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: id
  text: Yakub berangkat ke Sukot[a]. Di sana ia membangun sebuah rumah bagi dirinya dan membuat pondok-pondok untuk ternaknya. Itulah sebabnya ia menamai tempat itu Sukot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Sukot berbunyi seperti kata Ibrani yang berarti “pondok-pondok” atau “tempat-tempat berteduh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסַע
  choice: berangkat
  rationale: Kata kerja ini menggambarkan tindakan bertolak atau melanjutkan perjalanan dari suatu tempat; “berangkat” alami dalam alur narasi Indonesia.
- source_word: סֻכֹּתָה
  choice: ke Sukot
  rationale: Akhiran penunjuk arah menyatakan gerak menuju tempat itu. Nama tempat ditransliterasikan sebagai “Sukot”.
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: ia membangun sebuah rumah bagi dirinya
  rationale: Terjemahan ini menyatakan bangunan tempat tinggal serta mempertahankan unsur datif לוֹ secara wajar.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: Dalam konteks ini kata tersebut menunjuk pada hewan peliharaan yang menjadi milik Yakub; “ternak” lebih luas daripada “lembu”.
- source_word: עָשָׂה סֻכֹּת
  choice: membuat pondok-pondok
  rationale: סֻכּוֹת adalah bangunan perlindungan sementara. “Pondok-pondok” cocok bagi tempat berteduh ternak dan memungkinkan permainan kata dengan nama Sukot dijelaskan dalam catatan kaki.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini secara alami memperkenalkan alasan pemberian nama dalam bahasa Indonesia modern.
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: ia menamai tempat itu
  rationale: Ini merupakan padanan Indonesia yang alami bagi idiom Ibrani harfiah “memanggil nama tempat itu”, tanpa mengubah maknanya.
- source_word: סֻכּוֹת
  choice: Sukot
  rationale: Sebagai nama tempat, kata ini ditransliterasikan. Hubungannya dengan kata umum untuk pondok dijelaskan dalam catatan kaki.
theological_decisions: []
