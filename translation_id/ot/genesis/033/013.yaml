base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: id
  text: Lalu Yakub berkata kepadanya, “Tuanku tahu bahwa anak-anak itu lemah, dan ternak kambing domba serta sapi yang sedang menyusui anak-anaknya berada dalam tanggung jawabku.[a] Jika ternak-ternak itu dipaksa berjalan terlalu keras selama satu hari saja, seluruh kawanan itu akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ternak kambing domba serta sapi yang sedang menyusui anak-anaknya menjadi tanggung jawabku.” Ungkapan Ibraninya bersifat idiomatis dan memadukan gagasan bahwa induk-induk ternak sedang menyusui dengan tanggung jawab Yakub untuk memelihara mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat Yakub kepada Esau sebagai manusia; bentuk ini mempertahankan kesopanan dan hierarki tanpa menjadikannya gelar ilahi.
- source_word: הַיְלָדִים רַכִּים
  choice: anak-anak ini masih lemah
  rationale: רַכִּים menyatakan kelembutan dan kerentanan anak-anak dalam perjalanan; 'masih lemah' alami dalam bahasa Indonesia dan sesuai konteks.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kawanan kambing domba serta kawanan sapi
  rationale: Membedakan ternak kecil kolektif dari sapi sebagai ternak besar, sambil mempertahankan gambaran kawanan.
- source_word: עָלוֹת עָלָי
  choice: yang sedang menyusui anaknya berada dalam tanggung jawabku
  rationale: Ungkapan sulit ini memadukan keadaan induk ternak yang menyusui dengan tanggung jawab yang dipikul Yakub; terjemahan utama menyatakan kedua unsur tersebut.
- source_word: וּדְפָקוּם
  choice: Jika semuanya dipaksa berjalan terlalu keras
  rationale: Kata kerja דפק di sini berarti menggiring atau mendesak ternak secara berlebihan; bentuk pasif mempertahankan subjek tak tentu.
- source_word: יוֹם אֶחָד
  choice: satu hari saja
  rationale: Menyampaikan durasi satu hari sekaligus tekanan retoris bahwa bahkan satu hari sudah berakibat fatal.
- source_word: וָמֵתוּ כָּל הַצֹּאן
  choice: seluruh kawanan itu akan mati
  rationale: Mempertahankan pemakaian kolektif הַצֹּאן yang merangkum ternak yang baru disebut, tanpa membatasinya hanya pada domba.
