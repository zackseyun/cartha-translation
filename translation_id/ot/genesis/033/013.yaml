  to: Lalu Yakub berkata kepadanya, “Tuanku tahu bahwa anak-anak itu lemah, dan ternak kambing domba serta sapi yang sedang menyusui anak-anaknya berada dalam tanggung jawabku.[a] Jika ternak-ternak itu dipaksa berjalan terlalu keras selama satu hari saja, seluruh kawanan itu akan mati.”
