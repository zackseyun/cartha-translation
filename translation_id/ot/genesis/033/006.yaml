  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: id
  text: Kemudian para hamba perempuan itu beserta anak-anak mereka mendekat dan sujud.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para budak perempuan itu”; kata Ibrani dapat menyatakan status sebagai budak perempuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “membungkuk sampai ke tanah” atau “merebahkan diri sebagai tanda hormat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: mendekat
  rationale: Bentuk wayyiqtol orang ketiga feminin jamak dari נגשׁ menyatakan tindakan berikutnya dalam alur cerita, yaitu bergerak mendekati Esau. “Mendekat” alami dan tepat dalam bahasa Indonesia.
- source_word: הַשְּׁפָחוֹת
  choice: para hamba perempuan itu
  rationale: שִׁפְחָה menunjuk kepada hamba atau budak perempuan. “Para hamba perempuan” mempertahankan penandaan gender dan kaitan definit dengan kelompok yang telah disebut, tanpa memakai istilah arkais.
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: beserta anak-anak mereka
  rationale: Pronomina mandiri הֵנָּה menegaskan para hamba perempuan sebagai kelompok yang datang bersama anak-anak mereka. “Beserta” mengungkapkan kebersamaan itu secara wajar, meski struktur harfiah Ibraninya adalah “mereka dan anak-anak mereka”.
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: sujud
  rationale: Kata kerja ini menggambarkan tindakan merendahkan tubuh sebagai penghormatan. Dalam konteks perjumpaan dengan Esau, “sujud” ringkas, alami, dan mempertahankan kuatnya gestur tersebut.
