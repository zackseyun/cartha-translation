    rationale: Teks Ibrani menyatakan bahwa Yakub telah melihat wajah Esau, lalu membandingkannya dengan melihat wajah Allah. Mengubahnya menjadi konstruksi “melihat ... bagaikan melihat ...” masih dapat dipahami, tetapi dalam kalimat ini menjadi fragmen dan kurang alami. Konstruksi “melihat wajahmu bagiku seperti melihat...” menyampaikan perbandingan itu secara utuh dan alami.
