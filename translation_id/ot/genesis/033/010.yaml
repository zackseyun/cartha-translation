  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: id
  text: Kata Yakub, “Jangan begitu, kumohon. Jika aku mendapat kemurahan di matamu, terimalah pemberianku dari tanganku. Sebab, melihat wajahmu bagiku seperti melihat wajah Allah[a], dan engkau telah menerima aku dengan baik[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “seorang ilah”. Namun, dalam konteks ini “Allah” paling sesuai, terutama mengingat perjumpaan Yakub di Peniel (Kej. 32:30).
    reason: alternative_reading
  - marker: b
    text: Atau “engkau berkenan kepadaku” atau “engkau telah menerima aku”. Kata kerja Ibraninya menyatakan penerimaan yang baik atau penuh perkenanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן
  choice: kemurahan
  rationale: Dalam ungkapan mendapat kemurahan di mata seseorang, kata ini menyatakan penerimaan atau perkenanan dalam hubungan antarmanusia tanpa menambahkan muatan teologis yang tidak dituntut konteks.
- source_word: בְּעֵינֶיךָ
  choice: di matamu
  rationale: Mempertahankan citra konkret idiom Ibrani dan tetap wajar serta mudah dipahami dalam bahasa Indonesia.
- source_word: מִנְחָתִי
  choice: pemberianku
  rationale: Konteks menunjuk pada pemberian pendamaian Yakub kepada Esau. 'Pemberian' lebih tepat daripada 'persembahan', yang dapat memberi kesan tindakan ibadah.
- source_word: מִיָּדִי
  choice: dari tanganku
  rationale: Mempertahankan ungkapan konkret sumber mengenai pemberian yang diserahkan secara pribadi.
- source_word: עַל־כֵּן
  choice: sebab
  rationale: Dalam konteks, ungkapan ini memperkenalkan alasan Yakub mendesak Esau menerima pemberiannya; 'sebab' menyampaikan fungsi wacana itu secara alami.
- source_word: רָאִיתִי פָנֶיךָ כִּרְאֹת
  choice: melihat wajahmu bagaikan melihat
  rationale: Menghasilkan perbandingan yang alami dalam bahasa Indonesia sambil mempertahankan pengulangan verba 'melihat' dan citra 'wajah'.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Konteks kisah Yakub, khususnya perjumpaan di Peniel, paling kuat menunjuk kepada Allah, meskipun secara leksikal bentuk ini dalam konteks lain dapat memiliki cakupan lebih luas.
- source_word: וַתִּרְצֵנִי
  choice: engkau telah menerima aku dengan baik
  rationale: Menangkap makna penerimaan yang berkenan atau bersahabat dalam rekonsiliasi Esau dengan Yakub, tanpa membatasinya hanya pada perasaan senang.
- source_word: אַל נָא אִם נָא
  choice: Jangan begitu, kumohon. Jika
  rationale: Menyampaikan penolakan yang sopan tetapi sungguh-sungguh, lalu mengantar permohonan bersyarat Yakub dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perbandingan dengan melihat wajah
  choice: Allah
  alternative: seorang ilah
  rationale: Walaupun אֱלֹהִים dapat memiliki cakupan makna yang lebih luas, konteks langsung setelah perjumpaan Yakub dengan Allah di Peniel (Kej. 32:30) sangat mendukung rujukan tunggal kepada Allah. Catatan kaki mempertahankan kemungkinan leksikal lain tanpa melemahkan perbandingan teologis yang tajam.
- issue: Nuansa וַתִּרְצֵנִי
  choice: engkau telah menerima aku dengan baik
  alternative: engkau berkenan kepadaku
  rationale: Pilihan utama menonjolkan sambutan dan penerimaan Esau dalam adegan rekonsiliasi; alternatif yang lebih harfiah dicatat agar nuansa perkenanan tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan sumber seperti 'di matamu', 'dari tanganku', dan 'wajah Allah' dipertahankan karena masih jelas dalam bahasa sasaran. 'Jangan begitu' dipilih agar penolakan awal terdengar alami, bukan larangan keras.
