  text: וַ/יִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְ/עִמּ֕/וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַ/יַּ֣חַץ אֶת הַ/יְלָדִ֗ים עַל לֵאָה֙ וְ/עַל רָחֵ֔ל וְ/עַ֖ל שְׁתֵּ֥י הַ/שְּׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: id
  text: Lalu Yakub mengangkat pandangannya dan melihat; tampaklah Esau sedang datang bersama empat ratus orang laki-laki. Maka Yakub membagi anak-anak itu di antara Lea, Rahel, dan kedua hamba perempuan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kedua budak perempuan itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב עֵינָיו וַיַּרְא
  choice: Yakub mengangkat pandangannya dan melihat
  rationale: Ungkapan Ibrani harfiah 'mengangkat matanya' menyatakan tindakan mengarahkan pandangan ke atas atau ke depan. 'Mengangkat pandangannya' mempertahankan citra sumber, tetapi lebih alami dalam bahasa Indonesia modern; וַיַּרְא diterjemahkan tersendiri sebagai 'melihat'.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini menarik perhatian pembaca secara hidup kepada apa yang terlihat. 'Tampaklah' mempertahankan daya presentatifnya tanpa memakai bentuk arkais 'lihatlah' atau mengimpor makna temporal seperti 'tiba-tiba'.
- source_word: בָּא
  choice: sedang datang
  rationale: Bentuk partisip menggambarkan Esau dalam proses mendekat, sehingga aspek berlangsung dinyatakan dengan 'sedang datang'.
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: bersama empat ratus orang
  rationale: Terjemahan ini alami dan tetap menyatakan bahwa Esau disertai rombongan besar. אִישׁ dalam konteks rombongan Esau diterjemahkan 'orang', tanpa mempersempit lebih jauh daripada yang dinyatakan teks.
- source_word: וַיַּחַץ אֶת הַיְלָדִים
  choice: Yakub membagi anak-anak itu
  rationale: Kata kerja חצה berarti membagi atau memisahkan ke dalam kelompok. Subjek 'Yakub' diulangi demi kejelasan bahasa Indonesia.
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: di antara Lea, Rahel, dan kedua hamba perempuan itu
  rationale: Pengulangan עַל di sini menyatakan pembagian anak-anak menurut kelompok para perempuan tersebut. 'Hamba perempuan' mencerminkan status שִׁפְחָה dengan bahasa yang jelas dan tidak memperhalusnya menjadi sekadar pembantu.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Susunan tindakan dipertahankan, nuansa partisip בָּא dibuat eksplisit, dan daya perhatian וְהִנֵּה disampaikan secara alami. Penanda catatan kaki [a] muncul dalam teks utama.
