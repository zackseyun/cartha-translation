    issue: '"empat ratus orang" tidak menyatakan bahwa rombongan itu terdiri dari laki-laki.'
    rationale: Teks Ibrani memakai אִישׁ dalam ungkapan numerik ini, dan konteksnya adalah rombongan Esau. "Empat ratus orang laki-laki" mempertahankan keterangan sumber secara jelas dalam bahasa Indonesia.
