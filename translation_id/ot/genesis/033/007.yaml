  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: id
  text: Lea juga mendekat bersama anak-anaknya, lalu mereka sujud. Sesudah itu, Yusuf dan Rahel mendekat, lalu mereka sujud.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membungkukkan diri”; kata Ibrani ini menunjukkan tindakan penghormatan yang mendalam dan dapat mencakup merebahkan diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: mendekat
  rationale: Kata kerja נגשׁ menyatakan gerak menghampiri atau datang mendekat. “Mendekat” alami dalam bahasa Indonesia dan tidak menambahkan keterangan tentang cara atau tujuan gerakan itu.
- source_word: גַּם
  choice: juga
  rationale: גַּם menandai penambahan dalam urutan kelompok yang menghadap Esau; “juga” mempertahankan fungsi tersebut secara wajar.
- source_word: וִילָדֶיהָ
  choice: bersama anak-anaknya
  rationale: יְלָדִים dapat merujuk kepada anak-anak tanpa membatasi jenis kelamin. “Bersama” mengungkapkan keterkaitan Lea dan anak-anaknya secara alami, meski waw Ibrani secara harfiah berarti “dan”.
- source_word: וַיִּשְׁתַּחֲוּ
  choice: mereka sujud
  rationale: Bentuk kata kerja שׁחה di sini menunjukkan tindakan penghormatan dengan membungkukkan diri. “Sujud” ringkas, lazim, dan cukup mempertahankan bobot tindakan penghormatan itu.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan ini menandai urutan waktu berikutnya dalam prosesi dan terdengar alami dalam narasi Indonesia.
- source_word: יוֹסֵף וְרָחֵל
  choice: Yusuf dan Rahel
  rationale: Urutan nama dalam teks Ibrani dipertahankan, dengan Yusuf disebut sebelum Rahel.
theological_decisions:
- issue: Makna tindakan וַיִּשְׁתַּחֲוּ
  choice: sujud sebagai tindakan penghormatan
  alternative: menyembah sebagai tindakan religius
  rationale: Konteksnya adalah penghormatan kepada Esau; menerjemahkannya sebagai “menyembah” akan memberi makna keagamaan yang tidak dituntut oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pengulangan “lalu mereka sujud” mempertahankan struktur dua kelompok dalam teks Ibrani. Penanda catatan kaki ditempatkan setelah kemunculan terakhir karena catatan itu berlaku bagi kedua pemakaian kata kerja yang sama.
