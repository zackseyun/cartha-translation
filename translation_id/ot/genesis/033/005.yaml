  to: Esau mengangkat pandangannya dan melihat para perempuan dan anak-anak itu. Ia bertanya, “Siapakah mereka ini bagimu?”[a] Yakub menjawab, “Anak-anak yang telah Allah karuniakan kepada hambamu.”[b]
  rationale: Revisi mempertahankan urutan tindakan dalam teks Ibrani, memakai padanan yang lebih langsung bagi idiom “mengangkat mata/pandangan,” dan membiarkan pertanyaan Esau tetap cukup terbuka sebagaimana ungkapan לְךָ. Nuansa kemurahan dalam חנן tetap tersampaikan melalui “karuniakan.”
