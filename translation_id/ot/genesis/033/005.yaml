base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: id
  text: Esau mengangkat pandangannya dan melihat para perempuan dan anak-anak itu. Ia bertanya, “Siapakah mereka ini bagimu?”[a] Yakub menjawab, “Anak-anak yang telah Allah karuniakan kepada hambamu.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Siapakah mereka ini bagimu?” Ungkapan Ibrani ini dapat menanyakan identitas atau hubungan mereka dengan Yakub; dalam konteks, mereka menyertainya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Anak-anak yang telah Allah berikan kepada hambamu.” Kata Ibrani yang digunakan mengandung makna menunjukkan kemurahan atau perkenanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: Ketika Esau melayangkan pandangannya
  rationale: Ungkapan Ibrani ini secara idiomatis berarti mengangkat pandangan atau memandang ke arah tertentu. Nama Esau dipakai untuk memperjelas subjek yang tersirat dari konteks, sedangkan bentuk temporal menghasilkan narasi Indonesia yang alami.
- source_word: וַיַּרְא
  choice: ia melihat
  rationale: Padanan langsung dan wajar bagi ראה dalam konteks naratif.
- source_word: הַנָּשִׁים
  choice: perempuan-perempuan
  rationale: Teks memakai istilah umum 'perempuan', bukan istilah yang lebih khusus seperti 'istri'; terjemahan mempertahankan keluasan leksikal itu.
- source_word: הַיְלָדִים
  choice: anak-anak
  rationale: Padanan Indonesia yang alami bagi ילדים dalam kedua kemunculannya pada ayat ini.
- source_word: מִי אֵלֶּה לָּךְ
  choice: Siapakah orang-orang yang bersamamu ini?
  rationale: Secara harfiah konstruksi itu berbunyi 'siapakah ini bagimu?', tetapi dalam konteks merupakan pertanyaan tentang identitas orang-orang yang menyertai Yakub. 'Orang-orang' memperjelas bahwa yang ditanyakan mencakup perempuan dan anak-anak.
- source_word: חָנַן
  choice: telah ... karuniakan
  rationale: חנן mengandung gagasan kemurahan atau perkenanan. 'Karuniakan' menyampaikan bahwa anak-anak itu diberikan sebagai kemurahan Allah tanpa penjelasan doktrinal tambahan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku dalam bahasa Indonesia untuk referen tunggal אלהים di sini.
- source_word: עַבְדֶּךָ
  choice: hambamu ini
  rationale: Ini merupakan sebutan diri yang merendah ketika Yakub berbicara kepada Esau. 'Hamba' mempertahankan register penghormatan; 'ini' membuat rujukan diri terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa kemurahan ilahi dalam jawaban Yakub
  choice: Anak-anak digambarkan sebagai pemberian yang Allah karuniakan
  alternative: Anak-anak yang telah Allah berikan kepada hambamu
  rationale: Kata חנן menyatakan tindakan memberi dengan kemurahan atau perkenanan. 'Karuniakan' mempertahankan nuansa itu tanpa memasukkan muatan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Dialog mempertahankan kesantunan hierarkis antara Yakub dan Esau. Nama pembicara ditambahkan untuk menjernihkan pergantian subjek yang dalam bahasa Ibrani hanya ditandai oleh bentuk verba dan konteks.
