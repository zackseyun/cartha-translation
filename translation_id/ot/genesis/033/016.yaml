  yaml_path: translation/ot/genesis/033/016.yaml
  text: So Esau returned that day on his way to Seir[a].
translation:
  language: id
  text: Pada hari itu Esau kembali menempuh perjalanannya menuju Seir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk wayyiqtol dari שׁוב menyatakan tindakan lampau dalam alur narasi. “Kembali” mempertahankan makna pulang atau berbalik tanpa menentukan secara berlebihan bagaimana perjalanan itu dilanjutkan.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Terjemahan langsung dan alami dari keterangan waktu Ibrani ini; tidak perlu diperkuat menjadi “pada hari itu juga.”
- source_word: עֵשָׂו
  choice: Esau
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לְדַרְכּוֹ
  choice: menempuh perjalanannya
  rationale: Secara harfiah berarti “ke jalannya.” Dalam konteks perjalanan, ungkapan Indonesia ini menyampaikan bahwa Esau kembali ke atau melanjutkan rute perjalanannya dengan wajar.
- source_word: שֵׂעִירָה
  choice: menuju Seir
  rationale: Akhiran ה penunjuk arah pada nama tempat menyatakan gerak ke arah Seir; “menuju Seir” mempertahankan nuansa arah tersebut.
