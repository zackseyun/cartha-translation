  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: id
  text: Di sana ia mendirikan sebuah mezbah dan menamainya El-Elohe-Israel[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Di sana ia mendirikan sebuah mezbah dan berseru kepada-Nya, ‘Allah, Allah Israel,’” atau “menyatakan tentangnya, ‘Allah adalah Allah Israel.’” Teks Ibrani dapat dipahami sebagai pemberian nama kepada mezbah itu ataupun sebagai seruan atau pernyataan mengenai Allah.'
    reason: alternative_reading
  - marker: b
    text: El-Elohe-Israel berarti “Allah, Allah Israel” atau “El, Allah Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: mendirikan
  rationale: Bentuk Hifil dari נצב berarti membuat sesuatu berdiri atau mendirikannya; dalam konteks mazbah, “mendirikan” alami dan tepat.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini secara langsung menunjuk lokasi yang baru disebutkan.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” merupakan istilah baku dalam bahasa Indonesia untuk bangunan tempat persembahan kurban.
- source_word: וַיִּקְרָא לוֹ
  choice: menamainya
  rationale: Konstruksi קרא + ל dapat menunjukkan pemberian nama, dan konteks pendirian mazbah mendukung pengertian ini. Kemungkinan seruan atau pernyataan tetap dicatat dalam catatan kaki.
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: El-Elohe-Israel
  rationale: Karena frasa ini dalam pembacaan utama berfungsi sebagai nama mazbah, bentuk Ibraninya ditransliterasikan. Maknanya disediakan dalam catatan kaki.
theological_decisions:
- issue: Apakah frasa terakhir merupakan nama mazbah atau seruan/pernyataan tentang Allah
  choice: Memahaminya sebagai nama yang diberikan Yakub kepada mazbah
  alternative: Ia berseru kepada Allah, “Allah, Allah Israel,” atau menyatakan atas mazbah itu, “Allah adalah Allah Israel.”
  rationale: Setelah tindakan mendirikan mazbah, sintaksisnya secara alami mendukung pemberian nama dan sejalan dengan rumusan penamaan lain dalam Kejadian. Namun, konstruksi Ibraninya ringkas dan memungkinkan pembacaan sebagai seruan atau pernyataan, sehingga ketegangan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mazbah” dipertahankan sebagai istilah Alkitab yang mapan; nama Ibrani ditransliterasikan dan dijelaskan agar makna serta ambiguitas sumber tetap terlihat.
