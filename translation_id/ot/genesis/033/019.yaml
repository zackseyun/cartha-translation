  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur pokok Ibrani dengan tepat: pembelian suatu petak tanah, lokasi tempat kemah didirikan, pihak penjual (anak-anak Hemor), keterangan bahwa Hemor ialah ayah Sikhem, serta harga seratus kesita. “Sebidang tanah” merupakan padanan wajar bagi חֶלְקַת הַשָּׂדֶה tanpa memberi spesifikasi berlebih.'
