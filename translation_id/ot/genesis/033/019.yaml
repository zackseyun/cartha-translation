  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: id
  text: Ia membeli sebidang tanah tempat ia mendirikan kemahnya dari anak-anak Hemor, ayah Sikhem, seharga seratus kesita[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kesita adalah alat atau satuan pembayaran kuno yang nilai tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: Ia membeli
  rationale: Dalam konteks transaksi tanah dan penyebutan harga, קנה paling wajar berarti ‘membeli’. Pronomina ‘ia’ mempertahankan subjek tersirat dari konteks.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: sebidang tanah
  rationale: חֶלְקָה menunjuk pada bagian atau petak tertentu. ‘Sebidang tanah’ alami dalam bahasa Indonesia dan tidak memberi rincian melebihi teks Ibrani.
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: tempat ia mendirikan kemahnya
  rationale: נטה dengan אֹהֶל merupakan ungkapan lazim untuk memasang atau mendirikan kemah. Susunan ini menyampaikan lokasi tindakan secara alami.
- source_word: מִיַּד
  choice: dari
  rationale: Secara harfiah berarti ‘dari tangan’, tetapi dalam transaksi ini menandai pihak yang menyerahkan atau menjual milik tersebut. ‘Dari’ menyampaikan maknanya dengan wajar tanpa ungkapan Indonesia yang kaku.
- source_word: בְּנֵי חֲמוֹר
  choice: anak-anak Hemor
  rationale: Menerjemahkan bentuk jamak konstruk secara langsung; nama disesuaikan dengan bentuk Indonesia yang lazim.
- source_word: אֲבִי שְׁכֶם
  choice: ayah Sikhem
  rationale: Frasa aposisional ini mengidentifikasi Hemor sebagai ayah Sikhem tanpa menambah penafsiran.
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: seharga seratus kesita
  rationale: ‘Seharga’ menyatakan harga pembelian secara alami. קְשִׂיטָה ditransliterasikan karena bentuk dan nilai tepat alat atau satuan pembayaran kuno ini tidak diketahui.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Sebidang tanah’ dipilih daripada ‘bagian ladang’ agar alami tanpa menghilangkan gagasan tentang petak tertentu. Penanda catatan kaki ditempatkan pada ‘kesita’, istilah yang memerlukan penjelasan.
