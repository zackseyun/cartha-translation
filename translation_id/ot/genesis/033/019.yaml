  terminology: Nama Hemor dan Sikhem sesuai pemakaian Indonesia yang lazim. “Kesita” mempertahankan istilah Ibrani yang nilai atau hakikat tepatnya tidak pasti, dan catatan kaki menjelaskan ketidakpastian itu secara memadai. Tidak ada istilah teologis yang bermasalah.
