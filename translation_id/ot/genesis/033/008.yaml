  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: id
  text: Esau bertanya, “Apa maksudmu dengan seluruh rombongan[a] yang kutemui itu?” Yakub menjawab, “Supaya aku mendapat perkenanan Tuanku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini sering berarti “perkemahan,” tetapi di sini tampaknya menunjuk pada seluruh rombongan atau iring-iringan yang dikirim Yakub lebih dahulu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “supaya mendapat perkenanan di mata tuanku,” sebuah ungkapan Ibrani yang berarti memperoleh sambutan atau penilaian yang baik dari seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: Apa maksudmu dengan
  rationale: Ungkapan ini dalam konteks tidak menanyakan identitas, melainkan maksud atau tujuan Yakub mengirim rombongan tersebut. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pertanyaan tentang maksud.
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: seluruh rombongan
  rationale: מַחֲנֶה secara harfiah dapat berarti “perkemahan,” tetapi di sini menunjuk pada keseluruhan rombongan—khususnya kawanan ternak beserta para pelayan—yang dikirim Yakub mendahuluinya.
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: yang kutemui itu
  rationale: פָּגַשׁ berarti bertemu atau berjumpa. Akhiran “itu” membantu bahasa Indonesia mengacu secara alami kepada rombongan yang sebelumnya dijumpai Esau.
- source_word: לִמְצֹא חֵן
  choice: supaya aku mendapat perkenanan
  rationale: Infinitif dengan ל menyatakan tujuan. “Mendapat perkenanan” menyampaikan makna memperoleh sambutan atau penilaian yang baik tanpa mengimpor makna teologis yang tidak dituntut konteks.
- source_word: בְּעֵינֵי
  choice: Tuanku
  rationale: Ungkapan Ibrani harfiahnya “di mata Tuanku,” yang berarti dalam penilaian atau pandangan seseorang. Dalam teks utama, maknanya diungkapkan secara alami melalui “mendapat perkenanan Tuanku,” sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Ini adalah sapaan hormat Yakub kepada Esau, bukan gelar ilahi. “Tuanku” mempertahankan sikap merendah dan penghormatan sosial yang tampak dalam adegan ini.
theological_decisions:
- issue: Makna חֵן dalam sapaan Yakub kepada Esau
  choice: perkenanan
  alternative: kasih karunia
  rationale: Dalam konteks sosial ini, חֵן menunjuk pada sikap baik atau penerimaan Esau terhadap Yakub. “Perkenanan” menjaga makna kontekstual tanpa memberi istilah tersebut muatan doktrinal khusus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Esau dan Yakub ditambahkan sebagai pengganti pronomina berulang untuk memperjelas pergantian pembicara yang sudah jelas dari konteks. Sapaan “Tuanku” dipertahankan untuk mencerminkan sikap hormat dan merendah Yakub.
