base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: id
  text: Perempuan muda itu berparas sangat cantik. Ia seorang perawan; belum pernah ada laki-laki yang bersetubuh dengannya.[a] Ia turun ke mata air,[b] mengisi kendinya, lalu naik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “tidak ada laki-laki yang mengenalnya”; “mengenal” di sini merupakan ungkapan halus untuk berhubungan seksual.
    reason: lexical_alternative
  - marker: b
    text: Atau “sumber air”; kata Ibrani ini menunjuk pada mata air, bukan kata yang lazim untuk sumur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: perempuan muda
  rationale: נַעֲרָה menunjuk kepada seorang perempuan muda, dalam konteks ini sudah cukup umur untuk menikah. Pilihan ini alami dalam bahasa Indonesia modern dan tidak memberi kesan terlalu belia seperti “anak perempuan” atau terlalu arkais seperti “dara”.
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: berparas sangat cantik
  rationale: Ungkapan ini secara harfiah menyatakan bahwa penampilannya sangat baik atau indah. “Berparas sangat cantik” mempertahankan fokus pada kecantikan yang tampak sekaligus terdengar alami dan bermartabat.
- source_word: בְּתוּלָה
  choice: seorang perawan
  rationale: בְּתוּלָה dalam narasi ini secara langsung menunjukkan seorang perempuan yang belum pernah berhubungan seksual. “Perawan” merupakan padanan Indonesia yang paling jelas.
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: belum pernah ada laki-laki yang bersetubuh dengannya
  rationale: Kata יָדַע, “mengenal,” dipakai sebagai ungkapan halus Ibrani untuk hubungan seksual. Terjemahan ini menyampaikan maksudnya dengan jelas kepada pembaca modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הָעַיְנָה
  choice: ke mata air
  rationale: עַיִן di sini berarti sumber atau mata air, bukan kata Ibrani yang lazim untuk sumur. “Mata air” adalah padanan Indonesia yang tepat dan alami.
- source_word: כַדָּהּ
  choice: kendinya
  rationale: כַּד adalah wadah yang dibawa untuk mengambil air. “Kendi” merupakan istilah ringkas dan umum bagi wadah semacam itu, tanpa memakai kata “buyung” yang cenderung arkais.
- source_word: וַתָּעַל
  choice: lalu naik kembali
  rationale: עָלָה berarti naik. “Naik kembali” memperjelas kontras ruang dengan tindakannya yang sebelumnya turun ke mata air tanpa menambahkan tindakan baru.
theological_decisions:
- issue: Hubungan antara sebutan “perawan” dan frasa “tidak ada laki-laki yang mengenalnya”
  choice: Kedua pernyataan dipertahankan, dengan frasa kedua diterjemahkan menurut makna seksualnya.
  alternative: Menghilangkan salah satunya sebagai pengulangan, atau menerjemahkan secara harfiah “tidak ada laki-laki yang mengenalnya.”
  rationale: Teks Ibrani sengaja memakai kedua pernyataan tersebut. Mempertahankan keduanya menjaga penegasan naratif, sedangkan terjemahan maknawi mencegah pembaca modern salah memahaminya sebagai sekadar belum berkenalan dengan laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur kalimat dipecah agar mudah dibaca, tetapi urutan informasi dan penegasan teks Ibrani tetap dipertahankan.
