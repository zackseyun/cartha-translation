  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: id
  text: Lalu mereka memberangkatkan Ribka, saudara perempuan mereka, serta pengasuhnya[a], hamba Abraham, dan orang-orangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih khusus: “ibu susunya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: mereka melepas
  rationale: Bentuk piel שׁלח di sini menyatakan tindakan mengizinkan sekaligus memberangkatkan seseorang untuk pergi. “Melepas” alami dalam konteks keluarga yang mengantar Ribka berangkat.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Memakai bentuk nama yang baku dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲחֹתָם
  choice: saudara perempuan mereka
  rationale: אָחוֹת secara langsung berarti saudara perempuan; konteks keluarga mendukung arti harfiah ini.
- source_word: מֵנִקְתָּהּ
  choice: pengasuhnya
  rationale: Partisip dari ינק menunjuk kepada perempuan yang menyusui seorang anak. “Pengasuh” lebih wajar dalam teks utama bahasa Indonesia modern, sedangkan arti khususnya dipertahankan dalam catatan kaki.
- source_word: עֶבֶד אַבְרָהָם
  choice: hamba Abraham
  rationale: Rangkaian konstruksi ini secara alami berarti hamba milik atau yang melayani Abraham. “Hamba Abraham” ringkas, bermartabat, dan sesuai dengan perannya dalam kisah ini tanpa menonjolkan status perbudakan yang tidak menjadi fokus ayat.
- source_word: אֲנָשָׁיו
  choice: orang-orangnya
  rationale: Bentuk ini berarti orang-orang laki-laki yang menyertai atau berada di bawah tanggung jawab hamba Abraham. “Orang-orangnya” mempertahankan rujukan sufiks tanpa menentukan jabatan mereka secara berlebihan.
