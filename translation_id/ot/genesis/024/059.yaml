translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan peserta dipertahankan sedekat mungkin dengan bahasa Ibrani, sementara kata “bersama” ditambahkan agar rangkaian objek terbaca alami. Penanda catatan kaki ditempatkan tepat setelah “pengasuhnya”, yaitu istilah yang dijelaskan.
