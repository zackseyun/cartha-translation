base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: id
  text: Lalu Ribka dan perempuan-perempuan mudanya[a] bangkit, menaiki unta-unta, dan mengikuti laki-laki itu. Pelayan itu membawa Ribka lalu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para pelayan perempuannya yang masih muda." Istilah Ibrani ini berarti perempuan-perempuan muda dan, dalam konteks ini, kemungkinan menunjuk para perempuan muda yang melayani atau mendampingi Ribka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol Qal dari קום menyatakan tindakan bangun atau berdiri dalam rangkaian narasi. 'Bangkit' mempertahankan arti dasarnya tanpa menafsirkannya langsung sebagai keberangkatan.
- source_word: נַעֲרֹתֶיהָ
  choice: para perempuan muda yang menyertainya
  rationale: נַעֲרָה pada dasarnya menunjuk perempuan muda. Konteks menunjukkan bahwa mereka menyertai Ribka, tetapi kata Ibrani ini sendiri tidak secara tegas menyatakan status sebagai hamba.
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: naik ke atas unta-unta
  rationale: רכב dengan עַל di sini menyatakan naik atau menunggang. 'Naik ke atas' menangkap tindakan awal sebelum perjalanan, sedangkan bentuk jamak 'unta-unta' mencerminkan הַגְּמַלִּים.
- source_word: אַחֲרֵי הָאִישׁ
  choice: mengikuti laki-laki itu
  rationale: אַחֲרֵי secara harfiah berarti 'di belakang' atau 'sesudah'; dalam konteks perjalanan, 'mengikuti' adalah ungkapan Indonesia yang alami dan tetap menunjukkan bahwa mereka bergerak di belakang pimpinan laki-laki itu.
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Walaupun tokohnya adalah pelayan Abraham, teks menyebutnya הָאִישׁ, 'laki-laki itu'. Pilihan ini mempertahankan pergantian sebutan dalam narasi.
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: Pelayan itu membawa Ribka
  rationale: לקח berarti 'mengambil', tetapi dalam konteks perjalanan bersama seseorang, bahasa Indonesia alami memakai 'membawa'. Ini menyampaikan bahwa pelayan itu membawa Ribka serta dalam perjalanan tanpa menyiratkan paksaan.
- source_word: הָעֶבֶד
  choice: pelayan itu
  rationale: עֶבֶד dapat berarti hamba, budak, atau pelayan. Dalam konteks ini ia adalah utusan rumah tangga Abraham yang dipercaya, sehingga 'pelayan' paling tepat dan wajar.
- source_word: וַיֵּלַךְ
  choice: lalu pergi
  rationale: הלך berarti pergi atau berjalan. 'Lalu pergi' mempertahankan urutan naratif dan tidak menambahkan keterangan tujuan yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ungkapan 'para perempuan muda yang menyertainya' dipilih agar alami sekaligus menjaga ketidakpastian teks tentang status mereka sebagai pelayan. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
