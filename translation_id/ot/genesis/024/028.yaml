  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: id
  text: Lalu perempuan muda itu berlari dan menceritakan hal-hal itu kepada seisi rumah ibunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke rumah ibunya.” Frasa Ibrani ini dapat menunjuk kepada rumah secara fisik atau kepada seisi rumah/keluarga yang terkait dengan ibunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: berlari
  rationale: Berasal dari רוץ dan menyatakan gerakan cepat; “berlari” merupakan padanan naratif yang langsung dan alami.
- source_word: הַנַּעֲרָ
  choice: perempuan muda itu
  rationale: נַעֲרָה menunjuk kepada seorang perempuan muda; pilihan ini jelas, modern, dan sesuai dengan Ribka dalam konteks.
- source_word: וַתַּגֵּד
  choice: menceritakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyampaikan. Dalam konteks ini Ribka menyampaikan kembali kejadian yang baru dialaminya, sehingga “menceritakan” alami dalam bahasa Indonesia.
- source_word: לְבֵית אִמָּהּ
  choice: kepada seisi rumah ibunya
  rationale: בַּיִת dapat menunjuk kepada bangunan rumah maupun rumah tangga atau keluarga. “Seisi rumah ibunya” secara alami mengarah kepada orang-orang dalam lingkungan rumah tangga ibunya sambil tetap mempertahankan citra rumah.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: hal-hal itu
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal-hal. Di sini yang disampaikan ialah kejadian atau perkara yang baru berlangsung, sehingga “hal-hal itu” paling sesuai.
