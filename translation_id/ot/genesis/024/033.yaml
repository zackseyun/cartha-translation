base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/033.yaml
  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: id
  text: Lalu makanan dihidangkan di hadapannya untuk dimakan, tetapi ia berkata, “Aku tidak akan makan sebelum aku menyampaikan apa yang hendak kukatakan.”[a] Ia berkata, “Bicaralah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebelum aku mengucapkan perkataanku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: makanan dihidangkan
  rationale: Bentuk Ibrani secara harfiah berarti ‘ia menaruh/menempatkan’, tetapi subjeknya tidak dinyatakan secara penting dalam konteks. Bentuk pasif idiomatis dalam bahasa Indonesia menghindari penentuan subjek yang tidak diberikan teks.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Menyampaikan makna harfiah ‘di depan/di hadapan wajahnya’ dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: לֶאֱכֹל
  choice: untuk dimakan
  rationale: Infinitif dengan ל menyatakan tujuan; bentuk pasif Indonesia selaras secara alami dengan ‘makanan dihidangkan’.
- source_word: לֹא אֹכַל
  choice: Aku tidak akan makan
  rationale: Bentuk imperfek dalam ujaran langsung menyatakan tekad mengenai tindakan yang akan dilakukan; terjemahan ini mempertahankan ketegasannya.
- source_word: עַד אִם
  choice: sebelum
  rationale: Dalam konstruksi negatif ini, maksudnya ialah ia tidak akan makan sampai terlebih dahulu menyampaikan pesannya. ‘Sebelum’ menghasilkan ungkapan Indonesia yang paling alami tanpa mengubah urutan tindakan.
- source_word: דִּבַּרְתִּי דְּבָרָי
  choice: menyampaikan apa yang harus kusampaikan
  rationale: Secara harfiah, ‘aku telah mengucapkan perkataanku’. Ungkapan yang dipilih menyampaikan idiom Ibrani sebagai pesan atau urusan yang perlu ia kemukakan, tanpa kekakuan ‘mengucapkan perkataanku’.
- source_word: דַּבֵּר
  choice: Silakan bicara
  rationale: Imperatif singkat ini memberi izin atau undangan untuk berbicara. ‘Silakan bicara’ alami dalam percakapan Indonesia dan tidak menambah isi substantif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Pronomina ‘ia’ dipakai dalam narasi, sedangkan ‘aku’ mempertahankan kelangsungan dan ketegasan ujaran langsung. Klausa idiomatis dipilih daripada mempertahankan ungkapan kaku ‘perkataanku’; tidak ada persoalan teologis khusus dalam ayat ini.
