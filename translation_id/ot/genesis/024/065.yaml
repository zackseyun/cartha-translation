base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: id
  text: Ribka berkata kepada hamba itu, “Siapakah laki-laki itu yang sedang berjalan di ladang untuk menemui kita?” Hamba itu menjawab, “Dialah tuanku.”[a] Lalu Ribka mengambil selubungnya dan menutupi dirinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia adalah majikanku.” Di sini kata Ibrani menunjuk kepada tuan manusia dari hamba itu, bukan gelar ilahi.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “lalu berselubung.” Bentuk kata kerja Ibrani bersifat refleksif: Ribka mengambil selubung itu dan menutupi dirinya dengannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: hamba itu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini, orang tersebut adalah pengurus rumah tangga Abraham yang sedang menjalankan tugas atas nama tuannya; “hamba” mempertahankan hubungan sosial itu tanpa menjadikan status hukumnya pokok ayat.
- source_word: הַלָּזֶה
  choice: itu
  rationale: Kata penunjuk ini menunjuk kepada laki-laki yang terlihat di ladang. Dalam bahasa Indonesia, “laki-laki itu” merupakan ungkapan deiktis yang paling alami untuk orang yang sedang ditunjuk dari kejauhan.
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: yang sedang berjalan di ladang untuk menemui kita
  rationale: Terjemahan ini mempertahankan makna partisip הֹלֵךְ, lokasi di ladang, dan arah atau tujuan geraknya menuju rombongan Ribka.
- source_word: הוּא אֲדֹנִי
  choice: Dialah tuanku
  rationale: אֲדֹנִי berarti “tuanku” atau “majikanku” dalam hubungan antara hamba dan tuan. “Dialah” memberi jawaban identifikasi yang alami dan tegas tanpa mengubah rujukannya menjadi gelar ilahi.
- source_word: הַצָּעִיף
  choice: selubungnya
  rationale: צָעִיף menunjuk pada kain penutup yang dikenakan perempuan. “Selubung” cukup luas untuk mempertahankan bentuk benda tersebut tanpa menyamakannya secara khusus dengan jenis penutup kepala modern tertentu.
- source_word: וַתִּתְכָּס
  choice: menutupi dirinya
  rationale: Bentuk refleksif verba ini menyatakan bahwa Ribka menutupi dirinya dengan selubung tersebut. Teks Ibrani tidak secara khusus menyebut wajah, sehingga bagian tubuh tidak ditambahkan.
theological_decisions:
- issue: Makna אֲדֹנִי dalam ucapan hamba
  choice: tuanku
  alternative: majikanku
  rationale: Konteks menentukan bahwa yang dimaksud adalah Ishak sebagai tuan manusia dari hamba itu, bukan sebutan ilahi. “Tuanku” mempertahankan nada penghormatan dan hubungan sosial dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. “Ribka” disebut pada awal ayat agar rujukan pronomina feminin Ibrani tetap jelas dalam bahasa Indonesia, yang tidak membedakan gender pada kata ganti orang ketiga. Susunan kalimat mempertahankan urutan tindakan dan dialog teks Ibrani.
