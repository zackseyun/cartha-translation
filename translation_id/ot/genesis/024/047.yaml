- from: Lalu aku bertanya kepadanya, kataku, “Engkau anak siapa?” Jawabnya, “Aku anak Betuel, anak Nahor, yang dilahirkan Milka baginya.” Kemudian aku memasang cincin[a] itu pada hidungnya dan gelang-gelang itu pada kedua tangannya.[b]
