base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: id
  text: Lalu aku bertanya kepadanya, “Engkau putri siapa?” Ia menjawab, “Aku putri Betuel, anak Nahor, yang dilahirkan Milka bagi Nahor.” Kemudian aku mengenakan cincin[a] itu pada hidungnya dan gelang-gelang itu pada kedua tangannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cincin hidung”; istilah Ibraninya dapat berarti cincin secara umum, sedangkan frasa berikutnya menunjukkan bahwa cincin ini dikenakan pada hidung.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada tangan-tangannya”; dalam konteks gelang, yang dimaksud mungkin lebih khusus pergelangan tangannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: Lalu aku bertanya kepadanya, kataku
  rationale: Mempertahankan kedua verba Ibrani, ‘bertanya’ dan ‘berkata’, dalam susunan bahasa Indonesia yang alami serta menunjukkan kelanjutan alur cerita.
- source_word: בַּת מִי אַתְּ
  choice: Engkau anak siapa?
  rationale: Ungkapan Indonesia yang alami untuk pertanyaan kekerabatan ini; kata ‘anak’ tetap mempertahankan unsur בַּת tanpa perlu menyatakan jenis kelamin yang sudah jelas dari lawan bicara.
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר
  choice: Aku anak Betuel, anak Nahor
  rationale: Mempertahankan susunan silsilah Ibrani dan memperjelas jawaban langsung dengan ‘Aku’ yang tersirat dalam bahasa sumber.
- source_word: אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: yang dilahirkan Milka baginya
  rationale: Mempertahankan klausa relatif dan pronomina לּוֹ tanpa menggantinya secara eksplisit dengan nama rujukannya; konteks silsilah menunjukkan bahwa Betuel dilahirkan Milka bagi Nahor.
- source_word: הַנֶּזֶם
  choice: cincin
  rationale: נֶזֶם dapat menunjuk pada perhiasan berbentuk cincin secara umum; frasa berikutnya menentukan bahwa cincin ini dikenakan pada hidung.
- source_word: עַל אַפָּהּ
  choice: pada hidungnya
  rationale: Menerjemahkan makna konkret אַף dalam konteks ini secara langsung dan wajar.
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: dan gelang-gelang itu pada kedua tangannya
  rationale: ‘Gelang-gelang’ merupakan padanan modern yang jelas bagi צְמִידִים, sedangkan ‘kedua tangannya’ tetap dekat dengan יָדֶיהָ, yang dalam konteks dapat mencakup pergelangan tangan.
