translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘engkau’ dipakai dalam dialog agar selaras dengan register narasi Kitab Suci, sedangkan konstruksi ‘bertanya kepadanya, kataku’ mempertahankan bentuk ganda bahasa Ibrani tanpa terasa terlalu kaku.
