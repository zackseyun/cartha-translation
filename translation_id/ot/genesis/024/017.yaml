  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: id
  text: Pelayan itu berlari menemui perempuan itu dan berkata[a], “Tolong, beri aku minum sedikit air dari buyungmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarkan aku minum sedikit air dari buyungmu.” Imperatif Ibrani ini dapat diungkapkan sebagai “beri aku minum” atau “biarkan aku minum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: berlari
  rationale: Bentuk naratif dari רוץ secara langsung menyatakan tindakan berlari dan mempertahankan kesegeraan adegan.
- source_word: הָעֶבֶד
  choice: pelayan itu
  rationale: עֶבֶד dapat berarti pelayan atau budak. Dalam konteks ini ia bertindak sebagai pelayan rumah tangga Abraham yang dipercaya, sehingga 'pelayan' paling sesuai tanpa menonjolkan status perbudakan.
- source_word: לִקְרָאתָהּ
  choice: menemui perempuan itu
  rationale: Ungkapan ini menyatakan gerak menuju seseorang untuk menemuinya. Penyebutan 'perempuan itu' alami dalam bahasa Indonesia dan memperjelas rujukan sufiks feminin.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Padanan naratif baku dan alami untuk memperkenalkan ucapan langsung.
- source_word: הַגְמִיאִינִי
  choice: beri aku minum
  rationale: Imperatif Hifil dari גמא dengan akhiran orang pertama tunggal berarti memberi seseorang minum atau membiarkannya minum. 'Beri aku minum' alami dalam bahasa Indonesia dan mempertahankan sifat permintaannya.
- source_word: נָא
  choice: tolong
  rationale: Partikel נָא melembutkan permintaan; 'tolong' merupakan padanan modern yang wajar.
- source_word: מְעַט מַיִם
  choice: sedikit air
  rationale: Terjemahan langsung dan alami yang mempertahankan kecilnya jumlah air yang diminta.
- source_word: מִכַּדֵּךְ
  choice: dari tempayanmu
  rationale: כַּד adalah wadah untuk mengambil dan membawa air. 'Tempayan' sesuai dengan konteks kuno dan akhiran '-mu' mempertahankan sufiks feminin orang kedua tunggal.
