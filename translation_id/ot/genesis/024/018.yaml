  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani secara dekat, sementara pilihan kata dan penggunaan akhiran -lah menjaga kelancaran serta kesantunan alami.
