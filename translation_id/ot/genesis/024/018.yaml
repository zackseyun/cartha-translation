  yaml_path: translation/ot/genesis/024/018.yaml
  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: id
  text: Ia berkata, “Minumlah, Tuanku[a].” Lalu ia segera menurunkan kendinya ke tangannya dan memberinya minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tuan.” Sapaan Ibrani ini secara harfiah berarti “tuanku” dan di sini dipakai sebagai sapaan hormat kepada seorang laki-laki.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: Minumlah
  rationale: Bentuk imperatif orang kedua maskulin tunggal dari שׁתה menyampaikan ajakan atau perintah langsung untuk minum; akhiran -lah membuatnya wajar dan santun dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Secara harfiah berarti 'tuanku' dan dalam konteks ini merupakan sapaan hormat kepada seorang laki-laki, bukan gelar ilahi. Bentuk ini mempertahankan penghormatan sosial dalam teks Ibrani.
- source_word: וַתְמַהֵר
  choice: segera
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan dengan cepat. 'Segera' alami dalam narasi Indonesia dan mempertahankan penekanan pada kesigapan perempuan itu.
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: menurunkan kendinya
  rationale: ירד dalam bentuk kausatif di sini menggambarkan pemindahan wadah ke posisi yang lebih rendah. 'Kendi' adalah padanan modern yang mudah dipahami untuk wadah air yang dapat dibawa.
- source_word: עַל יָדָהּ
  choice: ke tangannya
  rationale: Frasa Ibrani secara konkret berarti 'di atas/pada tangannya'. 'Ke tangannya' mempertahankan arah gerakan tanpa menambahkan keterangan tentang bahu yang tidak dinyatakan dalam ayat ini.
- source_word: וַתַּשְׁקֵהוּ
  choice: memberi dia minum
  rationale: Bentuk Hifil dari שׁקה berarti menyebabkan atau memungkinkan seseorang minum. Ungkapan ini alami dan tepat dalam bahasa Indonesia.
theological_decisions: []
