base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Jangan menahan aku, sebab Yahweh telah membuat perjalananku berhasil. Izinkan aku pergi supaya aku dapat pergi kepada tuanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Namun, ia berkata kepada mereka
  rationale: Waw konsekutif melanjutkan narasi, tetapi konteks menunjukkan tanggapan yang berlawanan dengan usul keluarga untuk menunda keberangkatan; “Namun” menyatakan kontras itu secara alami.
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: Jangan menahan aku
  rationale: Bentuk larangan dengan Hifil dari אחר berarti menyebabkan terlambat, menunda, atau menahan. Dalam konteks permintaan untuk segera berangkat, “menahan aku” paling alami dan tepat.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: telah membuat perjalananku berhasil
  rationale: Hifil dari צלח menyatakan keberhasilan yang disebabkan oleh Yahweh; דֶּרֶךְ secara harfiah berarti jalan, tetapi di sini menunjuk pada perjalanan atau misi hamba itu.
- source_word: שַׁלְּחוּנִי
  choice: Izinkan aku pergi
  rationale: Imperatif Piel שלח dengan sufiks orang pertama meminta pihak keluarga melepaskan atau mengizinkannya berangkat. Terjemahan ini lebih alami daripada ungkapan harfiah “utuslah aku pergi” dalam bahasa Indonesia.
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: supaya aku dapat kembali kepada tuanku
  rationale: Kohortatif menyatakan maksud keberangkatan. Dalam konteks, ia hendak pergi kembali kepada Abraham; “kembali” memperjelas arah yang tersirat tanpa mengubah tujuan. אֲדֹנִי menunjuk kepada majikan manusia, sehingga diterjemahkan “tuanku”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi secara langsung dan membedakannya dari gelar אֲדֹנִי bagi Abraham dalam klausa terakhir.
- issue: Pelaku keberhasilan perjalanan
  choice: Yahweh telah membuat perjalananku berhasil
  alternative: perjalananku telah berhasil karena Yahweh
  rationale: Bentuk Hifil הִצְלִיחַ mempertahankan Yahweh sebagai pelaku yang menyebabkan keberhasilan, tanpa mereduksi pernyataan menjadi keberhasilan yang hanya bersifat keadaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” menjaga gaya naratif formal; “tuanku” sesuai bagi hubungan hamba dengan majikan. Tidak diperlukan catatan kaki karena arti kontekstual דַּרְכִּי dapat disampaikan langsung sebagai “perjalananku” tanpa menghilangkan unsur penting.
