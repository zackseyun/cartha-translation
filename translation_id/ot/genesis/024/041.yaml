  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: id
  text: Maka, ketika engkau datang kepada kaum keluargaku, engkau akan bebas dari sumpahku. Jika mereka tidak memberikannya kepadamu, engkau akan bebas dari sumpahku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “sumpah” juga dapat berarti “kutuk”; istilah ini dapat menunjuk pada sumpah yang mengandung sanksi atau kutuk tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: engkau akan bebas
  rationale: Dalam konteks kewajiban bersumpah, bentuk-bentuk dari נקה menyatakan pembebasan dari tanggung jawab, bukan ketidakbersalahan moral secara umum. Kedua kemunculan diterjemahkan secara konsisten.
- source_word: מֵאָלָתִי
  choice: dari sumpah yang kubebankan kepadamu
  rationale: אָלָה dapat menunjuk kepada sumpah yang mengandung sanksi atau kutuk. Konteks menekankan kewajiban bersumpah yang Abraham bebankan kepada hambanya; ungkapan ini juga membuat akhiran orang pertama jelas secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: pada waktu
  rationale: Di sini כִּי memperkenalkan keadaan temporal yang berkaitan dengan pembebasan sang hamba; 'pada waktu' mempertahankan kemungkinan bahwa kedatangannya kepada kaum keluarga itu merupakan langkah yang harus ditempuh.
- source_word: מִשְׁפַּחְתִּי
  choice: kaum keluargaku
  rationale: מִשְׁפָּחָה menunjuk kepada kelompok keluarga besar atau kaum; 'kaum keluarga' lebih luas daripada keluarga inti dan tetap wajar dalam bahasa Indonesia.
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: jika mereka tidak menyerahkan perempuan itu kepadamu
  rationale: Objek verba tidak dinyatakan dalam bahasa Ibrani, tetapi dipahami dari konteks sebagai calon istri yang diminta bagi Ishak. 'Perempuan itu' menjernihkan rujukan tanpa menetapkan bahwa Ribka sudah menjadi objek eksplisit dalam ayat ini.
theological_decisions:
- issue: Makna אָלָה dalam konteks sumpah
  choice: sumpah yang kubebankan kepadamu
  alternative: kutuk yang kuucapkan atasmu
  rationale: Pokok narasi ialah pembebasan dari kewajiban yang timbul melalui sumpah. Namun, nuansa sanksi atau kutuk yang melekat pada אָלָה tetap dicatat dalam catatan kaki.
- issue: Objek tersirat dalam יִתְּנוּ לָךְ
  choice: perempuan itu
  alternative: 'tanpa objek eksplisit: ''memberi kepadamu'''
  rationale: Bahasa Ibrani membiarkan objeknya tersirat, sedangkan bahasa Indonesia memerlukan pelengkap agar kalimat jelas dan alami. Konteksnya ialah seorang perempuan dari kaum keluarga Abraham yang akan dijadikan istri Ishak, tanpa harus mengidentifikasinya sebagai Ribka pada tahap penuturan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai sesuai tuturan langsung dalam narasi Alkitab. 'Kaum keluarga' mempertahankan cakupan keluarga besar, sedangkan pengulangan lengkap frasa tentang sumpah mencerminkan paralelisme sumber.
