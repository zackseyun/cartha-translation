revisions:
- from: Pada waktu engkau sampai kepada kaum keluargaku, engkau akan bebas dari sumpah yang kubebankan kepadamu. Jika mereka tidak menyerahkan perempuan itu kepadamu, engkau pun akan bebas dari sumpah yang kubebankan kepadamu.[a]
  to: Maka, ketika engkau datang kepada kaum keluargaku, engkau akan bebas dari sumpahku. Jika mereka tidak memberikannya kepadamu, engkau akan bebas dari sumpahku.[a]
  rationale: Revisi mempertahankan pembebasan hukum dari sumpah dan paralelisme dua kali “bebas dari sumpahku,” sambil menghindari penambahan “perempuan itu” yang tidak dinyatakan dalam teks Ibrani. “Memberikannya” mempertahankan objek yang tersirat tanpa menentukan gender atau identitasnya. Catatan kaki tetap mendokumentasikan alternatif leksikal untuk אָלָה.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:56:24Z'
