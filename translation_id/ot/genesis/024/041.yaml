  terminology: “Bebas” tepat untuk kedua bentuk dari נקה dalam konteks pembebasan dari kewajiban. “Kaum keluargaku” dengan baik mencakup keluarga besar. “Sumpah” merupakan padanan utama yang tepat bagi אָלָה; nuansa kutuk atau sanksinya layak dipertahankan dalam catatan kaki.
