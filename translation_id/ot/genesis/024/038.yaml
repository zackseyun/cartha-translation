  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: id
  text: Sebaliknya, pergilah ke rumah ayahku dan kepada kaum keluargaku[a], lalu ambillah seorang istri bagi anakku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluargaku” atau “sanak saudaraku”. Istilah Ibrani ini menunjuk pada kelompok keluarga besar, bukan hanya keluarga inti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: Sebaliknya
  rationale: Dalam konteks sumpah dan sebagai kontras terhadap larangan pada ayat sebelumnya, ungkapan ini berfungsi secara idiomatis sebagai koreksi atau pengecualian yang tegas, bukan sebagai syarat harfiah “jika tidak”.
- source_word: בֵּית אָבִי
  choice: rumah ayahku
  rationale: Mempertahankan bentuk konkret ungkapan Ibrani dan tetap dapat menunjuk pada rumah tangga atau lingkungan keluarga sang ayah.
- source_word: תֵּלֵךְ
  choice: pergilah
  rationale: Bentuk imperfek dalam amanat ini menyatakan perintah; bentuk imperatif Indonesia menyampaikan daya direktifnya secara alami.
- source_word: מִשְׁפַּחְתִּי
  choice: kaum keluargaku
  rationale: Istilah ini menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti. “Kaum keluarga” alami dalam bahasa Indonesia dan mempertahankan cakupan tersebut.
- source_word: וְלָקַחְתָּ
  choice: lalu ambillah
  rationale: לקח berarti “mengambil”; dalam konteks pengaturan perkawinan, bentuk ini menyatakan tindakan mendapatkan seorang istri bagi anak Abraham. “Lalu” menyatakan kelanjutan tindakan tanpa mengubah makna.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Konteks pencarian pasangan nikah menuntut arti “istri”, bukan sekadar “perempuan”.
- source_word: לִבְנִי
  choice: bagi anakku
  rationale: Preposisi ל menyatakan kepentingan atau tujuan dalam pengaturan perkawinan; “bagi anakku” tepat dan alami.
theological_decisions: []
