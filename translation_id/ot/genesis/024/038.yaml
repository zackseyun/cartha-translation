  source_fidelity: Terjemahan setia pada struktur dan makna Ibrani. “Sebaliknya” menangkap fungsi korektif/kontras dari אִם־לֹא dalam konteks amanat Abraham; “pergilah,” “rumah ayahku,” “kaum keluargaku,” dan “ambillah seorang istri bagi anakku” secara memadai mencerminkan unsur-unsur sumber tanpa menambah penafsiran.
  naturalness: Bahasa Indonesia baku, jelas, dan alami untuk register naratif Alkitab. Rangkaian “ke rumah ayahku dan kepada kaum keluargaku” mempertahankan dua sasaran berpreposisi dalam teks Ibrani dan tetap dapat dipahami dengan lancar.
  terminology: “Kaum keluargaku” tepat untuk מִשְׁפַּחְתִּי, sebab menyampaikan kelompok kekerabatan luas. Catatan kaki secara tepat menjelaskan bahwa cakupannya tidak dibatasi pada keluarga inti. “Istri” dan “bagi anakku” sesuai dengan konteks pengaturan perkawinan dan fungsi לְ.
