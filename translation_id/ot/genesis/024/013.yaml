  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: id
  text: Lihat, aku berdiri di dekat mata air itu, dan anak-anak perempuan para lelaki kota itu sedang keluar untuk menimba air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel penunjuk ini menarik perhatian kepada keadaan yang sedang berlangsung; “Lihat” hidup dan wajar dalam bahasa Indonesia modern.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina orang pertama mandiri menyatakan pembicara secara eksplisit. “Aku” sesuai dengan tuturan langsung pribadi dalam narasi.
- source_word: נִצָּב
  choice: berdiri
  rationale: Partisipel nifal menggambarkan posisi yang sedang berlangsung; dengan konstruksi “aku berdiri” keadaan kini sudah jelas tanpa perlu menambahkan “sedang”.
- source_word: עַל עֵין הַמָּיִם
  choice: di dekat mata air ini
  rationale: עַל dalam konteks lokasi berarti dekat atau di sisi, sedangkan עֵין הַמָּיִם menunjuk sumber air alami, bukan sumur. Artikel Ibrani dibuat deiktis sebagai “ini” agar alami dalam konteks langsung.
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: dan anak-anak perempuan dari para lelaki kota ini
  rationale: Terjemahan mempertahankan ungkapan sosial-kekeluargaan Ibrani dan unsur maskulin אַנְשֵׁי, sekalipun dalam bahasa Indonesia susunannya agak formal.
- source_word: יֹצְאֹת
  choice: sedang keluar
  rationale: Partisipel feminin jamak menyatakan tindakan yang tengah berlangsung atau mulai tampak dari sudut pandang pembicara.
- source_word: לִשְׁאֹב מָיִם
  choice: untuk menimba air
  rationale: “Menimba air” merupakan padanan Indonesia yang lazim untuk mengambil air dari sumber dengan wadah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan “anak-anak perempuan dari para lelaki kota ini” dipertahankan untuk mewakili idiom Ibrani secara cukup formal tanpa menggantinya secara diam-diam dengan “gadis-gadis kota ini”.
