  - severity: low
    issue: Susunan “anak-anak perempuan dari para lelaki kota ini” agak berat.
    rationale: Penghilangan preposisi “dari” menghasilkan konstruksi posesif yang lebih lancar sambil mempertahankan makna literal ungkapan Ibrani.
