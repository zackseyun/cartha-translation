  yaml_path: translation/ot/genesis/024/024.yaml
  text: She said to him[a], “I am the daughter of Bethuel son of Milcah, whom she bore to Nahor.”
translation:
  language: id
  text: Ia berkata kepadanya, “Aku anak perempuan Betuel, anak laki-laki Milka, yang dilahirkan Milka bagi Nahor.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa; bahasa Indonesia alami tidak memerlukan kata penghubung eksplisit.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks orang ketiga maskulin tunggal menunjukkan arah perkataan kepada lawan bicara laki-laki.
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: Aku anak perempuan Betuel
  rationale: Klausa nominal Ibrani menyatakan identitas pembicara; susunan ini alami dan jelas dalam bahasa Indonesia.
- source_word: בְּתוּאֵל
  choice: Betuel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן מִלְכָּה
  choice: anak laki-laki Milka
  rationale: Relasi konstruksi mengidentifikasi Betuel sebagai anak laki-laki Milka dan menghindari kemungkinan bahwa 'anak' dipahami sebagai anak perempuan.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Nama diri memakai bentuk Indonesia yang lazim.
- source_word: אֲשֶׁר יָלְדָה
  choice: yang dilahirkannya
  rationale: Klausa relatif merujuk kepada Betuel sebagai orang yang dilahirkan Milka; sufiks -nya mempertahankan subjek perempuan yang sudah disebut.
- source_word: לְנָחוֹר
  choice: bagi Nahor
  rationale: Dalam rumus kelahiran, לְ menandai Nahor sebagai ayah; 'bagi Nahor' mempertahankan nuansa relasional tanpa menyiratkan bahwa Nahor melahirkan.
