  edition: WLC
  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: id
  text: Sara, istri tuanku, melahirkan seorang anak laki-laki bagi tuanku setelah ia menjadi tua, dan tuanku memberikan kepada anak itu segala miliknya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk Qal wayyiqtol dari ילד melanjutkan rangkaian kisah lampau; “melahirkan” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אֵשֶׁת אֲדֹנִי
  choice: istri tuanku
  rationale: Frasa konstruksi ini secara alami menyatakan hubungan kepemilikan/relasi, sedangkan “tuanku” mempertahankan tutur hormat hamba tersebut.
- source_word: בֵן
  choice: seorang anak laki-laki
  rationale: Menyampaikan makna “anak laki-laki/putra” tanpa artikel dalam bahasa Ibrani dan terdengar alami dalam laporan kelahiran.
- source_word: לַאדֹנִי
  choice: bagi tuanku
  rationale: Preposisi ל di sini menyatakan relasi atau penerima manfaat dalam ungkapan tentang melahirkan anak; “bagi” alami dalam bahasa Indonesia.
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: setelah ia menjadi tua
  rationale: Ungkapan harfiahnya “setelah masa tuanya”; pilihan ini mempertahankan urutan temporal yang tidak biasa tanpa menghasilkan bahasa Indonesia yang janggal.
- source_word: וַיִּתֶּן לוֹ
  choice: dan tuanku memberikan kepada anak itu
  rationale: Subjek tersirat adalah Abraham dan objek tak langsungnya anak yang baru disebut. Mengulang “tuanku” dan menyebut “anak itu” menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Padanan ringkas dan alami untuk rumusan menyeluruh tentang seluruh kepunyaan Abraham.
theological_decisions:
- issue: Cakupan pemberian Abraham kepada putranya
  choice: memberikan kepada anak itu segala miliknya
  alternative: mewariskan seluruh hartanya kepada anak itu
  rationale: “Memberikan” mempertahankan makna נתן dan bentuk naratif teks tanpa menambahkan gagasan teknis tentang pewarisan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tutur hormat sang hamba dipertahankan melalui “tuanku”. Struktur dibuat alami sambil menjaga penekanan sumber pada usia lanjut Sara dan totalitas pemberian Abraham.
