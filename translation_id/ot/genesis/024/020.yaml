  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: id
  text: Ia segera menuangkan isi tempayannya ke dalam bak minum ternak[a], lalu berlari lagi ke sumur untuk menimba air. Ia menimba air untuk semua unta orang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengosongkan tempayannya ke dalam palungan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Ia segera
  rationale: Kata kerja ini menyatakan tindakan yang dilakukan dengan cepat; “segera” alami dalam narasi Indonesia dan menonjolkan kesigapan.
- source_word: וַתְּעַר כַּדָּהּ
  choice: menuangkan isi tempayannya
  rationale: Kata kerja ערה berarti mengosongkan dengan menuangkan. Ungkapan ini mempertahankan tindakan menuang sekaligus menjelaskan bahwa yang dituangkan ialah isi wadah.
- source_word: כַּדָּהּ
  choice: tempayannya
  rationale: כַּד adalah wadah untuk mengambil dan membawa air. “Tempayan” merupakan padanan Indonesia yang sesuai dengan konteks sumur.
- source_word: הַשֹּׁקֶת
  choice: palungan
  rationale: Nomina ini menunjuk wadah air minum bagi hewan; “palungan” ringkas dan jelas dalam konteks unta.
- source_word: וַתָּרָץ עוֹד
  choice: berlari lagi
  rationale: עוֹד memberi nuansa pengulangan, sedangkan kata kerjanya secara langsung berarti berlari.
- source_word: הַבְּאֵר
  choice: sumur
  rationale: בְּאֵר lazimnya berarti sumur dan cocok dengan tindakan menimba.
- source_word: לִשְׁאֹב
  choice: untuk menimba air
  rationale: Dalam konteks sumur, שׁאב berarti mengambil air dengan menimba; penyebutan “air” membuat ungkapan alami tanpa menambah makna asing.
- source_word: וַתִּשְׁאַב
  choice: Ia menimba air
  rationale: Pengulangan verba dipertahankan sebagai tindakan berikutnya. Kalimat baru menghindari rangkaian konjungsi yang kaku dalam bahasa Indonesia.
- source_word: לְכָל גְּמַלָּיו
  choice: untuk semua unta orang itu
  rationale: כָּל menyatakan keseluruhan. “Orang itu” memperjelas rujukan pronomina maskulin tunggal secara alami tanpa menambahkan identitas.
