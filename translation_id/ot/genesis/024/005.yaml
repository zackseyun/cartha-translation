revisions:
- from: Lalu hamba itu berkata kepadanya, “Mungkin perempuan itu tidak bersedia mengikuti saya ke negeri ini. Haruskah saya membawa anakmu kembali ke negeri asalmu?”[a]
  to: Lalu hamba itu berkata kepadanya, “Mungkin perempuan itu tidak bersedia mengikuti saya ke negeri ini. Haruskah saya benar-benar membawa putramu kembali ke negeri yang telah engkau tinggalkan?”[a]
  rationale: Revisi mempertahankan makna dasar dan register draf, sambil menerjemahkan “putra” secara eksplisit, mempertahankan rujukan kepada negeri yang Abraham tinggalkan, dan menampilkan penekanan verba Ibrani. Catatan kaki kini juga selaras dengan penanda pada pertanyaan yang dijelaskannya.
