base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: id
  text: Lalu hamba itu berkata kepadanya, “Mungkin perempuan itu tidak bersedia mengikuti saya ke negeri ini. Haruskah saya benar-benar membawa putramu kembali ke negeri yang telah engkau tinggalkan?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Haruskah saya sungguh membawa kembali putramu ke negeri yang darinya engkau keluar?” Bentuk Ibrani “membawa kembali” memakai infinitif absolut bersama verba finit untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: hamba itu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini, “hamba” menyatakan kedudukan bawahan dalam rumah tangga Abraham secara wajar tanpa menghapus hubungan hierarkisnya.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Kata ini menyatakan kemungkinan atau ketidakpastian dan “mungkin” merupakan padanan Indonesia modern yang alami.
- source_word: לֹא תֹאבֶה
  choice: tidak bersedia
  rationale: אָבָה menunjuk pada kemauan atau persetujuan. “Tidak bersedia” mempertahankan nuansa kehendak tanpa memberi kesan hukum yang berlebihan.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks hanya menyebut “perempuan itu”; tidak semestinya diperluas menjadi calon istri atau perempuan muda.
- source_word: לָלֶכֶת אַחֲרַי
  choice: mengikuti saya
  rationale: Ungkapan harfiahnya “berjalan di belakang saya”; “mengikuti saya” menyampaikan maknanya secara alami sambil mempertahankan arah relasionalnya.
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: ke negeri ini
  rationale: אֶרֶץ dapat berarti tanah atau negeri. Di sini “negeri” paling alami untuk wilayah tempat Abraham sekarang tinggal.
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: Haruskah saya membawa ... kembali
  rationale: Infinitif absolut yang disertai verba finit menekankan tindakan kembali/membawa kembali. Dalam pertanyaan pertimbangan ini, “Haruskah” menyampaikan daya tanyanya, sedangkan “kembali” mempertahankan unsur שׁוב.
- source_word: אֶת בִּנְךָ
  choice: anakmu
  rationale: Padanan langsung bagi “anak laki-lakimu”; konteks telah jelas merujuk kepada putra Abraham.
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: ke negeri asalmu
  rationale: Secara harfiah, “ke negeri yang darinya engkau keluar.” “Negeri asalmu” menyampaikan rujukan tempat asal Abraham secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Sapaan hamba memakai “saya” kepada Abraham, sedangkan bentuk “-mu” mencerminkan orang kedua tunggal dalam bahasa sumber tanpa menambah gelar yang tidak terdapat dalam teks.
