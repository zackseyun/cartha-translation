translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dipertahankan sejauh tetap jelas; nama diri diulang untuk menghindari pronomina yang rancu. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada bagian teks yang dijelaskan.
