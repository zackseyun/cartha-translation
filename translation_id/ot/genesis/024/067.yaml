base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: id
  text: Ishak membawa Ribka masuk ke dalam kemah Sara, ibunya,[a] lalu mengambil Ribka sebagai istrinya, dan Ribka menjadi istrinya. Ishak mengasihinya. Lalu Ishak terhibur setelah kematian ibunya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke dalam kemah ibunya, Sara.” Susunan kata Ibrani memungkinkan kedua susunan ini dengan makna dasar yang sama.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “setelah ibunya.” Maksudnya ialah setelah kehilangan atau kematian ibunya, meskipun kata “kematian” tidak disebutkan secara eksplisit dalam bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: membawa Ribka masuk
  rationale: Bentuk Hifil dari בוא dengan akhiran feminin tunggal berarti membuat dia masuk atau membawanya masuk. Nama “Ribka” digunakan untuk menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: הָאֹהֱלָה
  choice: ke dalam kemah
  rationale: Akhiran penunjuk arah pada אֹהֶל menyatakan gerak menuju atau masuk ke kemah; “ke dalam kemah” menyampaikan masuknya Ribka dengan jelas.
- source_word: שָׂרָה אִמּוֹ
  choice: Sara, ibunya
  rationale: Konstruksi ini mengaitkan kemah dengan Sara dan menjelaskan bahwa Sara adalah ibu Ishak. Susunan Indonesia mempertahankan hubungan tersebut secara wajar.
- source_word: וַיִּקַּח אֶת־רִבְקָה
  choice: mengambil Ribka
  rationale: לקח secara harfiah berarti “mengambil.” Dalam konteks ini tindakan itu menuju perkawinan, tetapi klausa berikutnya sudah menyatakan bahwa Ribka menjadi istrinya, sehingga kedua klausa tetap dibedakan.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: Ribka menjadi istrinya
  rationale: Ungkapan היה + ל + אשה menandai status perkawinan. Pengulangan nama Ribka lebih jelas dan alami daripada rangkaian pronomina Indonesia.
- source_word: וַיֶּאֱהָבֶהָ
  choice: Ishak mengasihinya
  rationale: אהב adalah kata kerja umum untuk mengasihi atau mencintai. “Mengasihi” sesuai dengan register Alkitab Indonesia yang modern dan bermartabat tanpa menambah intensitas.
- source_word: וַיִּנָּחֵם
  choice: terhibur
  rationale: Bentuk Nifal dari נחם di sini menyatakan bahwa Ishak menerima penghiburan, bukan menyesal.
- source_word: אַחֲרֵי אִמּוֹ
  choice: setelah kematian ibunya
  rationale: Secara harfiah frasa itu berbunyi “setelah ibunya,” tetapi konteks kematian Sara menunjukkan kehilangan atau kematiannya. Kata “kematian” memperjelas maksud dalam bahasa Indonesia dan dicatat sebagai unsur tersirat.
