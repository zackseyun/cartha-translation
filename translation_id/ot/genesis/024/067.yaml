- from: Kemudian Ishak membawa Ribka masuk ke dalam kemah Sara, ibunya,[a] lalu mengambil Ribka, dan Ribka menjadi istrinya. Ishak mengasihinya. Demikianlah Ishak terhibur setelah kematian ibunya.[b]
  to: Ishak membawa Ribka masuk ke dalam kemah Sara, ibunya,[a] lalu mengambil Ribka sebagai istrinya, dan Ribka menjadi istrinya. Ishak mengasihinya. Lalu Ishak terhibur setelah kematian ibunya.[b]
  rationale: Revisi ini memperjelas bahwa tindakan “mengambil” berlangsung dalam konteks perkawinan tanpa menghapus klausa berikutnya yang menyatakan bahwa Ribka menjadi istri Ishak. “Demikianlah” diganti dengan “Lalu” agar alur naratif lebih dekat dengan penghubung Ibrani. Catatan kaki dipertahankan karena secara tepat mencatat alternatif susunan frasa tentang kemah Sara dan sifat tersirat dari kematian ibu Ishak.
