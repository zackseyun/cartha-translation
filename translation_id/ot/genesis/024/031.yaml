  verdict: revise
  source_fidelity: 'Secara keseluruhan setia pada Ibrani: urutan naratif, undangan masuk, pertanyaan, penyediaan rumah, dan tempat bagi unta dipertahankan. Namun, konstruksi sapaan “orang yang diberkati Yahweh” tidak jelas dalam bahasa Indonesia modern dan dapat terdengar seolah-olah Yahweh adalah keterangan posesif. Penambahan “oleh” menyatakan relasi yang paling lazim untuk בְּרוּךְ יְהוָה dalam konteks ini.'
  naturalness: “Lalu ia berkata,”, “Masuklah,”, dan “Mengapa engkau berdiri di luar?” alami dalam register Alkitab Indonesia modern. “Hai orang yang diberkati oleh Yahweh” lebih idiomatis dan jelas daripada bentuk tanpa preposisi. “Aku sudah menyiapkan rumah dan tempat bagi unta-unta” tetap wajar serta tidak memperinci fungsi tempat bagi unta melampaui teks.
  terminology: “Yahweh” konsisten dengan keputusan proyek untuk יְהוָה. “Diberkati oleh Yahweh” mempertahankan partisip pasif sebagai sapaan tanpa memasukkan penafsiran denominational. Catatan kaki perlu menghapus alternatif “milik Yahweh,” yang tidak merupakan padanan Indonesia yang aman atau alami bagi konstruksi Ibrani ini.
