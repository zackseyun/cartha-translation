  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: id
  text: Lalu ia berkata, “Masuklah, hai orang yang diberkati oleh Yahweh[a]! Mengapa engkau berdiri di luar? Aku sudah menyiapkan rumah dan tempat bagi unta-unta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang diberkati Yahweh”; juga dapat diterjemahkan, “hai orang yang mendapat berkat dari Yahweh.”
    reason: Ungkapan Ibrani בְּרוּךְ יְהוָה adalah sapaan yang padat. Terjemahan utama memakai “oleh” agar relasi pasifnya jelas dalam bahasa Indonesia, sedangkan catatan mempertahankan bentuk ringkas dan alternatif yang alami.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan perkembangan naratif secara wajar dalam bahasa Indonesia.
- source_word: בּוֹא
  choice: Masuklah
  rationale: Dalam konteks penyambutan tamu, imperatif בוא menyiratkan gerak masuk ke rumah, sehingga “masuklah” merupakan padanan Indonesia yang alami.
- source_word: בְּרוּךְ יְהוָה
  choice: hai orang yang diberkati Yahweh
  rationale: Partisip pasif ini berfungsi sebagai sapaan. Susunan tersebut mempertahankan hubungan ringkas dengan nama ilahi tanpa menambahkan penafsiran yang tidak perlu mengenai nuansanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama diri dalam teks Ibrani tetap tampak.
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: Mengapa engkau berdiri di luar?
  rationale: Terjemahan ini mempertahankan pertanyaan langsung serta arti posisi dan lokasi dari עמד dengan בחוץ.
- source_word: וְאָנֹכִי פִּנִּיתִי הַבַּיִת
  choice: Aku sudah menyiapkan rumah
  rationale: פִּנִּיתִי secara harfiah berkaitan dengan mengosongkan atau menyediakan ruang; dalam konteks keramahtamahan, “menyiapkan” menyampaikan hasil tindakan itu secara alami.
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: dan tempat bagi unta-unta
  rationale: Padanan ini mempertahankan kata umum מָקוֹם dan tidak menentukan lebih jauh apakah tempat itu untuk menginap, ditambatkan, atau diberi makan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Hubungan sintaksis dalam בְּרוּךְ יְהוָה
  choice: orang yang diberkati Yahweh
  alternative: orang yang diberkati oleh Yahweh; orang yang diberkati, milik Yahweh
  rationale: Ungkapan Ibrani yang padat dapat dipahami terutama dengan Yahweh sebagai pelaku berkat, tetapi juga memiliki nuansa “orang yang diberkati milik Yahweh”; catatan kaki mempertahankan kemungkinan ungkapan tersebut tanpa memaksakan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal dalam narasi Alkitab, sedangkan bentuk seruan “hai” menandai bahwa frasa partisipial itu berfungsi sebagai sapaan langsung.
