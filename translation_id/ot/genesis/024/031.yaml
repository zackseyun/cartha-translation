    rationale: Dalam bahasa Indonesia, verba pasif “diberkati” lazim diikuti pelaku dengan “oleh.” Tanpa preposisi, hubungan sintaktis dengan “Yahweh” tidak cukup jelas.
  - severity: medium
    issue: Alternatif catatan kaki “hai orang yang diberkati, milik Yahweh” tidak aman.
    rationale: Frasa ini tidak alami sebagai sapaan Indonesia dan menggeser konstruksi padat Ibrani ke pernyataan kepemilikan yang terlalu eksplisit.
