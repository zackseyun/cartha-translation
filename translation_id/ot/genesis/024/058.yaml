  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: id
  text: Lalu mereka memanggil Ribka dan berkata kepadanya, “Maukah engkau pergi bersama orang ini?” Ia berkata, “Aku akan pergi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: mereka memanggil
  rationale: Dalam konteks ini קרא berarti memanggil seseorang untuk ikut dalam pembicaraan. 'Memanggil' alami dalam bahasa Indonesia dan tidak menyiratkan paksaan seperti 'menyuruh menghadap'.
- source_word: לְרִבְקָה
  choice: Ribka
  rationale: Bentuk 'Ribka' mengikuti nama Ibrani רִבְקָה dan merupakan bentuk baku yang dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: berkata kepadanya
  rationale: Terjemahan ini mempertahankan verba umum אמר, 'berkata', meskipun isi ucapannya berupa pertanyaan.
- source_word: הֲתֵלְכִי
  choice: Maukah engkau pergi
  rationale: Bentuk tanya dengan verba הלך dalam konteks keputusan pribadi Ribka secara alami menanyakan kesediaannya. 'Maukah ... pergi' menyampaikan fungsi pertanyaan itu tanpa menambahkan alasan atau syarat.
- source_word: עִם הָאִישׁ הַזֶּה
  choice: bersama orang ini
  rationale: אִישׁ berarti laki-laki atau orang. 'Orang ini' terdengar lebih alami daripada 'laki-laki ini' dalam konteks rujukan kepada utusan Abraham, sekaligus tidak menggantinya dengan 'hamba', yang tidak dipakai dalam frasa Ibrani ini.
- source_word: וַתֹּאמֶר
  choice: Ia menjawab
  rationale: Walaupun אמר secara harfiah berarti 'berkata', 'menjawab' secara alami menyatakan fungsi ujaran tersebut sebagai tanggapan langsung terhadap pertanyaan.
- source_word: אֵלֵךְ
  choice: Aku mau pergi
  rationale: Bentuk orang pertama dari הלך menyatakan keputusan tegas Ribka. Dalam bahasa Indonesia, 'Aku mau pergi' secara alami menjawab pertanyaan 'Maukah engkau pergi?' dan tidak harus dipahami sekadar sebagai keinginan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam dialog langsung agar selaras dengan register Alkitab yang akrab tetapi tetap hormat; 'aku' mempertahankan jawaban pribadi dan tegas Ribka. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau varian yang perlu ditampilkan.
