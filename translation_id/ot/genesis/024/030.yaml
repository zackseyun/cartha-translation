  text: וַ/יְהִ֣י כִּ/רְאֹ֣ת אֶת הַ/נֶּ֗זֶם וְֽ/אֶת הַ/צְּמִדִים֮ עַל יְדֵ֣י אֲחֹת/וֹ֒ וּ/כְ/שָׁמְע֗/וֹ אֶת דִּבְרֵ֞י רִבְקָ֤ה אֲחֹת/וֹ֙ לֵ/אמֹ֔ר כֹּֽה דִבֶּ֥ר אֵלַ֖/י הָ/אִ֑ישׁ וַ/יָּבֹא֙ אֶל הָ/אִ֔ישׁ וְ/הִנֵּ֛ה עֹמֵ֥ד עַל הַ/גְּמַלִּ֖ים עַל הָ/עָֽיִן׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: id
  text: Ketika ia melihat cincin hidung[a] dan gelang-gelang pada tangan saudarinya, serta ketika ia mendengar perkataan Ribka, saudarinya, yang berkata, “Demikianlah orang itu berbicara kepadaku,” maka ia pergi menemui orang itu. Tampaklah, orang itu sedang berdiri di dekat unta-unta itu, di mata air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “cincin.” Kata Ibrani נֶזֶם dapat berarti perhiasan berbentuk cincin secara umum; dalam Kejadian 24:47, perhiasan ini disebut dikenakan pada hidung Ribka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian narasi ini, וַיְהִי mengantar keadaan temporal berikutnya. Bahasa Indonesia alami tidak memerlukan padanan tersendiri seperti 'terjadilah'; konstruksi 'Ketika ... pergilah ia' mempertahankan fungsi naratifnya.
- source_word: הַנֶּזֶם
  choice: anting-anting
  rationale: נֶזֶם dapat berarti perhiasan berbentuk cincin, termasuk anting hidung. Kejadian 24:47 menjelaskan bahwa perhiasan ini dikenakan pada hidung Ribka; 'anting-anting' cukup alami dalam bahasa Indonesia, dengan kekhususan dijelaskan dalam catatan.
- source_word: הַצְּמִדִים
  choice: gelang-gelang
  rationale: Bentuk jamak ini menunjuk pada perhiasan berpasangan yang dikenakan pada tangan atau pergelangan tangan; 'gelang-gelang' merupakan padanan Indonesia yang wajar.
- source_word: עַל יְדֵי אֲחֹתוֹ
  choice: pada tangan saudarinya
  rationale: Mempertahankan ungkapan Ibrani יָד dalam bentuk jamak secara cukup dekat tanpa menggantinya secara diam-diam dengan 'pergelangan tangan'.
- source_word: דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: perkataan Ribka, saudarinya, “...”
  rationale: לֵאמֹר berfungsi memperkenalkan ucapan langsung. Dalam bahasa Indonesia, tanda kutip setelah 'perkataan' menyampaikan fungsi ini secara alami tanpa frasa redundan 'yang mengatakan'.
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: Beginilah orang itu berbicara kepadaku
  rationale: כֹּה mempertahankan nuansa demonstratif 'demikian/begini', sementara דִבֶּר diterjemahkan langsung sebagai 'berbicara'.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: pergilah ia menemui orang itu
  rationale: בּוֹא dengan אֶל menyatakan gerak menuju seseorang. Dari sudut pandang alur bahasa Indonesia, 'pergi menemui' lebih jelas daripada 'datang kepada'.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: הִנֵּה memberi penyajian deiktis yang hidup atau menunjukkan apa yang didapati tokoh. 'Ternyata' menyampaikan penemuan itu secara alami dalam narasi Indonesia modern.
- source_word: עֹמֵד
  choice: sedang berdiri
  rationale: Partisip Ibrani menggambarkan keadaan yang sedang berlangsung ketika Laban tiba.
- source_word: עַל הַגְּמַלִּים
  choice: di dekat unta-untanya
  rationale: Preposisi עַל di sini menyatakan lokasi di sisi atau dekat unta-unta, bukan berdiri di atasnya.
- source_word: עַל הָעָיִן
  choice: di mata air
  rationale: עַיִן dalam konteks sumber air secara khusus berarti mata air, bukan sekadar sumur buatan.
