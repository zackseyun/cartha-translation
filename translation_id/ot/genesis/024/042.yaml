base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: id
  text: Hari ini aku tiba di mata air itu[a] dan berkata, ‘Ya Yahweh, Allah tuanku Abraham, jika kiranya Engkau membuat perjalananku[b] yang sedang kutempuh ini berhasil—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sumur itu”. Kata Ibrani ini secara lebih khusus menunjuk pada mata air atau sumber air.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “jalanku”; dalam konteks ini yang dimaksud ialah perjalanan atau tugas hamba Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: Hari ini aku tiba
  rationale: Bentuk naratif וָאָבֹא menyatakan tindakan lampau, sedangkan הַיּוֹם menekankan bahwa kedatangan itu terjadi pada hari yang sama. Susunan ini alami dalam bahasa Indonesia.
- source_word: הָעָיִן
  choice: mata air itu
  rationale: עַיִן secara khusus menunjuk pada mata air atau sumber air. Kata sandang Ibrani dinyatakan dengan “itu” karena mata air tersebut sudah menjadi lokasi tertentu dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Allah tuanku Abraham
  rationale: אֲדֹנִי di sini menunjuk kepada Abraham sebagai tuan dari hamba itu. “Tuanku” mempertahankan hubungan sosial tersebut tanpa mengubahnya menjadi gelar ilahi.
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: jika kiranya Engkau membuat ... berhasil
  rationale: אִם mempertahankan bentuk bersyarat, נָא memberi nuansa permohonan yang dinyatakan dengan “kiranya”, dan bentuk Hifil מַצְלִיחַ menyatakan tindakan menyebabkan keberhasilan.
- source_word: דַּרְכִּי
  choice: perjalananku
  rationale: Secara harfiah berarti “jalanku”, tetapi dalam konteks menunjuk pada perjalanan atau tugas yang sedang dijalankan hamba Abraham. Akhiran orang pertama tetap dipertahankan.
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: yang sedang kutempuh ini
  rationale: Ungkapan Ibrani harfiah “yang aku berjalan di atasnya” merupakan idiom untuk perjalanan atau jalan yang sedang ditempuh. Terjemahan ini alami sekaligus mempertahankan aspek tindakan yang sedang berlangsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut secara langsung dan tidak menggantinya dengan gelar.
- issue: Bentuk permohonan bersyarat yang belum selesai
  choice: jika kiranya Engkau membuat ... berhasil—
  alternative: kiranya Engkau membuat ... berhasil
  rationale: Anak kalimat yang diawali אִם tidak diselesaikan dalam ayat ini. Bentuk “jika” dan tanda pisah mempertahankan ketegangan sintaksis tersebut, sedangkan “kiranya” menyampaikan unsur permohonan נָא tanpa menghapus bentuk bersyaratnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “aku”, “tuanku”, dan sapaan “Engkau” sesuai dengan tuturan langsung seorang hamba dalam doa. Tanda pisah pada akhir ayat mempertahankan kalimat bersyarat yang berlanjut ke ayat berikutnya.
