  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֗וּ ה֛וּא וְ/הָ/אֲנָשִׁ֥ים אֲשֶׁר עִמּ֖/וֹ וַ/יָּלִ֑ינוּ וַ/יָּק֣וּמוּ בַ/בֹּ֔קֶר וַ/יֹּ֖אמֶר שַׁלְּחֻ֥/נִי לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: id
  text: Kemudian ia dan orang-orang yang menyertainya makan dan minum, lalu mereka bermalam di sana. Ketika mereka bangun pada pagi hari, ia berkata, “Izinkanlah aku pergi kepada tuanku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “majikanku.” Kata Ibrani אֲדֹנִי dapat berarti “tuanku” atau “majikanku”; di sini kata itu merujuk kepada Abraham, atasan manusia dari hamba tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: makan dan minum
  rationale: Menerjemahkan kedua verba naratif secara langsung dan ringkas, sesuai urutan tindakan dalam bahasa Ibrani.
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: ia dan orang-orang yang menyertainya
  rationale: Mempertahankan penyebutan eksplisit sang hamba beserta rombongannya dalam bahasa Indonesia yang wajar.
- source_word: וַיָּלִינוּ
  choice: mereka bermalam di sana
  rationale: Verba לון/לין berarti tinggal semalam; 'bermalam di sana' alami dan mencerminkan tempat menginap yang tersirat oleh konteks.
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: ketika mereka bangun pada pagi hari
  rationale: Mengungkapkan tindakan naratif berikutnya dengan hubungan waktu yang alami tanpa mengubah makna.
- source_word: שַׁלְּחֻנִי
  choice: Izinkanlah aku pergi
  rationale: Imperatif שׁלח dalam konteks ini meminta tuan rumah melepas atau mengizinkan sang hamba berangkat; ungkapan ini lebih alami daripada terjemahan harfiah 'suruhlah aku pergi'.
- source_word: לַאדֹנִי
  choice: kepada tuanku
  rationale: '''Tuanku'' mempertahankan sapaan hormat kepada Abraham sebagai atasan sang hamba dan menghindari kesan bahwa yang dimaksud adalah gelar ilahi.'
theological_decisions:
- issue: Penerjemahan אָדוֹן yang merujuk kepada Abraham
  choice: tuanku
  alternative: majikanku
  rationale: Referennya adalah Abraham sebagai atasan manusia. 'Tuanku' mempertahankan nuansa hormat dan sebagian keluasan makna אָדוֹן, sedangkan 'majikanku' menekankan hubungan sosial hamba-majikan secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'ia' serta partikel sopan '-lah' menjaga nada naratif dan penghormatan tanpa terasa kuno. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskan.
