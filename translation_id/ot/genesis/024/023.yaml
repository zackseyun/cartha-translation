  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: id
  text: Lalu ia berkata, “Kamu anak perempuan siapa? Tolong beri tahu aku. Apakah di rumah ayahmu ada tempat bagi kami untuk bermalam?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara alami tanpa memberi urutan waktu yang terlalu tegas.
- source_word: בַּת מִי אַתְּ
  choice: Kamu anak perempuan siapa?
  rationale: Ungkapan Indonesia yang alami untuk pertanyaan tentang identitas keluarga, sambil mempertahankan unsur kekerabatan “anak perempuan”.
- source_word: הַגִּידִי נָא לִי
  choice: Tolong beri tahu aku
  rationale: Partikel נָא memperhalus imperatif menjadi permintaan sopan; “tolong” menyampaikan nuansa itu dengan wajar.
- source_word: הֲיֵשׁ
  choice: Apakah ... ada
  rationale: Menerjemahkan partikel eksistensial yang memperkenalkan pertanyaan ya-tidak secara langsung dan alami.
- source_word: בֵּית אָבִיךְ
  choice: di rumah ayahmu
  rationale: Mempertahankan gambaran rumah atau rumah tangga sang ayah tanpa meratakannya menjadi sekadar “keluargamu”.
- source_word: מָקוֹם
  choice: tempat
  rationale: “Tempat” mempertahankan arti konkret dan cukup luas untuk ruang atau akomodasi yang tersedia.
- source_word: לָנוּ
  choice: bagi kami
  rationale: Mempertahankan bentuk orang pertama jamak, yakni hamba itu beserta rombongannya.
- source_word: לָלִין
  choice: untuk bermalam
  rationale: Dalam konteks keramahtamahan, infinitif ini berarti tinggal sepanjang malam; “bermalam” ringkas, jelas, dan alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina “ia” dan “aku” dipakai sesuai konteks narasi dan tuturan langsung; susunan pertanyaan dibuat alami tanpa menghilangkan fokus Ibrani pada garis keluarga serta ketersediaan tempat bermalam.
