  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: id
  text: Ia berkata kepadaku, “Yahweh, yang di hadapan-Nya aku hidup, akan mengutus malaikat-Nya menyertaimu dan membuat perjalananmu berhasil[a], dan engkau akan mengambil seorang istri untuk putraku dari kerabatku[b] dan dari keluarga ayahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “membuat jalanmu berhasil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “keluargaku”; istilah Ibrani ini dapat menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi Allah dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: yang di hadapan-Nya aku menjalani hidup
  rationale: Mengungkapkan idiom tentang seluruh kehidupan yang dijalani di hadapan Allah, sambil mempertahankan unsur ‘di hadapan-Nya’ dan tanpa menambahkan penilaian seperti ‘dengan setia’.
- source_word: מַלְאָכוֹ אִתָּךְ
  choice: malaikat-Nya menyertaimu
  rationale: Konteks menunjuk kepada utusan ilahi; ‘menyertaimu’ menyampaikan makna pendampingan secara alami dalam bahasa Indonesia.
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: dan membuat perjalananmu berhasil
  rationale: Mempertahankan makna kausatif verba צלח dan memahami ‘jalanmu’ sebagai perjalanan atau tugas yang sedang ditempuh.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: Engkau akan mengambil seorang istri bagi anakku
  rationale: Mempertahankan idiom perkawinan ‘mengambil istri’ dan makna tujuan ‘bagi anakku’.
- source_word: מִמִּשְׁפַּחְתִּי
  choice: dari kaumku
  rationale: ‘Kaum’ dapat menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti dan sesuai dengan cakupan מִשְׁפָּחָה.
- source_word: וּמִבֵּית אָבִי
  choice: dan dari keluarga ayahku
  rationale: Menyampaikan בֵּית אָב sebagai rumah tangga atau garis keluarga pihak ayah tanpa menimbulkan kesan bahwa yang dimaksud hanyalah bangunan rumah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Mempertahankan nama perjanjian sebagai nama pribadi dan menghindari penggantian diam-diam dengan sebuah gelar.
- issue: Makna ungkapan ‘berjalan di hadapan’ Allah
  choice: yang di hadapan-Nya aku menjalani hidup
  alternative: yang di hadapan-Nya aku berjalan; yang kulayani dengan setia
  rationale: Pilihan ini mempertahankan gagasan hidup dalam hadirat dan pertanggungjawaban kepada Allah, tetapi tidak memasukkan kata ‘setia’ yang hanya tersirat dan bukan dinyatakan secara eksplisit.
- issue: Identitas מַלְאָכוֹ
  choice: malaikat-Nya
  alternative: utusan-Nya
  rationale: Dalam konteks ini utusan tersebut berasal dari Allah dan berperan membimbing perjalanan, sehingga ‘malaikat’ merupakan padanan kontekstual yang wajar tanpa memperluas identitasnya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat tetap dekat dengan urutan Ibrani, sedangkan idiom yang berpotensi kabur dijadikan alami bagi pembaca masa kini. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan umum penerbitan Alkitab bahasa Indonesia.
