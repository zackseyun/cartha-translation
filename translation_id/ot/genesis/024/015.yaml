  text: וַֽ/יְהִי ה֗וּא טֶרֶם֮ כִּלָּ֣ה לְ/דַבֵּר֒ וְ/הִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִ/בְתוּאֵ֣ל בֶּן מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְ/כַדָּ֖/הּ עַל שִׁכְמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: id
  text: Ketika ia belum selesai berbicara, tampaklah Ribka sedang keluar dengan tempayannya di bahunya. Ribka adalah anak Betuel—Betuel anak laki-laki Milka, istri Nahor, saudara Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika
  rationale: Dalam rangkaian ini, וַיְהִי berfungsi membuka terjadinya peristiwa berikutnya. Bahasa Indonesia alami dapat menyerap fungsi naratif itu ke dalam anak kalimat waktu tanpa memakai ungkapan kaku seperti “dan terjadilah”.
- source_word: טֶרֶם כִּלָּה לְדַבֵּר
  choice: ia belum selesai berbicara
  rationale: טֶרֶם menyatakan bahwa peristiwa berikut terjadi sebelum tindakan berbicara selesai, sedangkan כִּלָּה menekankan penyelesaiannya.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Pilihan ini mempertahankan fungsi penarik perhatian dan kesan bahwa Ribka tiba-tiba terlihat dalam adegan, tetapi tetap wajar dalam narasi Indonesia yang bermartabat.
- source_word: יֹצֵאת
  choice: keluar
  rationale: Partisip feminin menggambarkan Ribka sedang keluar ketika terlihat. Bersama “tampaklah”, bentuk “keluar” menyampaikan gerak yang sedang berlangsung secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: Ribka adalah anak Betuel
  rationale: Ungkapan pasif Ibrani menyatakan garis keturunan Ribka. “Anak Betuel” adalah padanan Indonesia yang alami dan tidak mengubah hubungan genealogisnya.
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: anak laki-laki Milka, istri Nahor, saudara Abraham
  rationale: 'Susunan ini mempertahankan rangkaian keterangan genealogis: Betuel adalah anak laki-laki Milka; Milka adalah istri Nahor; dan Nahor adalah saudara Abraham.'
- source_word: כַדָּהּ עַל שִׁכְמָהּ
  choice: dengan tempayan di atas bahunya
  rationale: “Tempayan” menyatakan wadah untuk mengambil dan membawa air, sedangkan frasa lokatifnya dipertahankan secara langsung.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ayat dibagi menjadi dua kalimat agar keterangan silsilah tetap jelas tanpa mengaburkan tindakan utama. Nama-nama mengikuti bentuk Indonesia yang lazim: Ribka, Betuel, Milka, Nahor, dan Abraham.'
