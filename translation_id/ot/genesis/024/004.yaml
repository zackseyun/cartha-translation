translation:
  language: id
  text: Tetapi engkau harus pergi ke negeriku dan kepada kaum kerabatku[a], lalu mengambil seorang istri untuk putraku, Ishak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke tempat kelahiranku.” Istilah Ibrani ini dapat menunjuk pada tempat asal maupun kelompok kerabat; konteks di sini lebih mendukung arti kekerabatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: melainkan
  rationale: Dalam konteks ini partikel tersebut mengontraskan perintah ini dengan larangan mengambil istri dari perempuan Kanaan pada ayat sebelumnya.
- source_word: אֶל אַרְצִי
  choice: ke negeriku
  rationale: Kata אֶרֶץ menunjuk pada wilayah asal Abraham; 'negeri' alami dalam bahasa Indonesia dan tidak mengesankan negara-bangsa modern.
- source_word: וְאֶל מוֹלַדְתִּי
  choice: dan kepada sanak saudaraku
  rationale: מוֹלֶדֶת dapat menunjuk pada kelompok kerabat atau tempat asal. Konteks pencarian istri dari kalangan Abraham mendukung arti kekerabatan, sambil mempertahankan kemungkinan arti tempat asal dalam catatan kaki.
- source_word: תֵּלֵךְ
  choice: engkau harus pergi
  rationale: Bentuk imperfek ini menyatakan kewajiban atau instruksi dalam konteks sumpah, bukan sekadar prediksi.
- source_word: וְלָקַחְתָּ
  choice: lalu mengambil
  rationale: לקח berarti 'mengambil'; konteks dan objek 'seorang istri' menjelaskan maksud perkawinannya. 'Lalu' menyampaikan urutan tindakan secara alami.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Walaupun אִשָּׁה dapat berarti 'perempuan' atau 'istri', konteks pencarian pasangan bagi Ishak menuntut arti 'istri'.
- source_word: לִבְנִי לְיִצְחָק
  choice: untuk anakku Ishak
  rationale: Dua frasa berpreposisi itu berhubungan secara aposisional. Susunan ini menyampaikan bahwa Ishak adalah anak yang dimaksud tanpa pengulangan yang kaku dalam bahasa Indonesia.
