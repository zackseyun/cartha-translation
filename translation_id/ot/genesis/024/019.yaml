  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: id
  text: Setelah ia selesai memberi minum kepadanya, perempuan itu berkata, “Aku juga akan menimba air untuk unta-untamu sampai unta-untamu selesai minum.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: Setelah selesai memberi dia minum
  rationale: Bentuk כלה dengan infinitif שקה menandai selesainya tindakan memberi minum sebelum tindakan berikutnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: וַתֹּאמֶר
  choice: perempuan itu berkata
  rationale: Subjek feminin dari konteks dinyatakan secara alami dalam bahasa Indonesia; 'perempuan itu' menghindari ketidakjelasan pronomina tanpa menambah identitas baru.
- source_word: גַּם לִגְמַלֶּיךָ
  choice: juga untuk unta-untamu
  rationale: Kata 'juga' mempertahankan daya tambah גַּם, sedangkan לְ menyatakan penerima manfaat dan sufiks orang kedua dipertahankan dalam 'unta-untamu'.
- source_word: אֶשְׁאָב
  choice: Aku akan menimba air
  rationale: שאב berarti menimba, khususnya air. Objek 'air' tersirat jelas dari konteks dan wajar dinyatakan dalam bahasa Indonesia.
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: sampai semuanya selesai minum
  rationale: עַד אִם berfungsi sebagai penanda batas 'sampai', dan כלה dengan infinitif berarti menyelesaikan suatu kegiatan. 'Semuanya' memperjelas bahwa bentuk jamak merujuk kepada seluruh unta.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Terjemahan mempertahankan urutan tindakan dan penekanan bahwa perempuan itu menawarkan air bagi seluruh unta tanpa memasukkan tafsiran teologis tambahan.
