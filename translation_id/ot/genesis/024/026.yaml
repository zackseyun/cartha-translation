  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: id
  text: Lalu orang itu membungkuk dan sujud menyembah kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang itu”; yang dimaksud ialah hamba Abraham.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: berlutut
  rationale: Kata kerja קָדַד menggambarkan tindakan membungkukkan tubuh dalam-dalam. Dalam rangkaian dengan kata kerja berikutnya, “berlutut” menyampaikan gerak merendahkan tubuh secara alami tanpa mengulang “sujud”.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Teks Ibrani secara eksplisit memakai הָאִישׁ, “orang itu,” bukan “hamba itu.” Konteks menunjukkan bahwa ia adalah hamba Abraham, tetapi terjemahan mempertahankan sebutan ayat ini.
- source_word: וַיִּשְׁתַּחוּ
  choice: sujud menyembah
  rationale: Bentuk kata שׁחה menunjukkan tindakan merebahkan atau merendahkan diri sebagai penghormatan; ketika diarahkan kepada Yahweh, tindakan itu merupakan penyembahan. “Sujud menyembah” mempertahankan sekaligus unsur jasmani dan makna religiusnya.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menandai pihak yang menjadi tujuan tindakan, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יהוה. “Yahweh” mempertahankan nama tersebut secara langsung, sedangkan “TUHAN” merupakan penggantian berdasarkan tradisi pembacaan.
- issue: Makna וַיִּשְׁתַּחוּ sebagai gerak tubuh atau penyembahan
  choice: sujud menyembah
  alternative: bersujud di hadapan
  rationale: Kata kerja ini mencakup tindakan merendahkan diri secara jasmani, dan objeknya, Yahweh, memberi tindakan itu makna penyembahan. Ungkapan gabungan menjaga kedua unsur tersebut tanpa mereduksinya menjadi gerak tubuh semata atau konsep batin semata.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Susunan verba dibuat alami dalam bahasa Indonesia sambil mempertahankan dua tindakan Ibrani yang berurutan: merendahkan tubuh lalu sujud menyembah.'
