  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: id
  text: Lalu Abraham berkata kepada hambanya, orang tertua dalam rumah tangganya, yang berkuasa atas segala miliknya[a], “Tolong letakkan tanganmu di bawah pahaku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “yang mengurus segala miliknya.”
    reason: lexical_alternative
  - marker: b
    text: Meletakkan tangan di bawah paha merupakan tata cara kuno dalam pengambilan sumpah, yang tampaknya menandakan komitmen perjanjian yang sungguh-sungguh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw melanjutkan rangkaian peristiwa; “Lalu” menyampaikan alur tersebut secara wajar dalam bahasa Indonesia.
- source_word: עַבְדּוֹ
  choice: hambanya
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini, tokoh tersebut tampil sebagai pejabat rumah tangga yang sangat dipercaya, sehingga “hamba” mempertahankan cakupan istilah tanpa menonjolkan status hukum yang tidak menjadi fokus ayat.
- source_word: זְקַן בֵּיתוֹ
  choice: orang tertua dalam rumah tangganya
  rationale: Ungkapan ini menunjuk pada usia atau senioritas orang tersebut di dalam rumah tangga Abraham. Terjemahan ini mempertahankan arti dasar זָקֵן tanpa menambahkan jabatan yang tidak dinyatakan secara eksplisit.
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: yang berkuasa atas segala miliknya
  rationale: מֹשֵׁל menyatakan pelaksanaan wewenang atau kekuasaan. Frasa ini cukup dekat dengan bentuk Ibrani, sedangkan alternatif yang lebih idiomatis dicatat dalam catatan kaki.
- source_word: שִׂים נָא
  choice: Tolong letakkan
  rationale: Partikel נָא melunakkan atau menyatakan kesungguhan permintaan; “Tolong” mengungkapkan nada permintaan itu secara alami.
- source_word: יָדְךָ
  choice: tanganmu
  rationale: Padanan langsung dan alami untuk bentuk Ibrani.
- source_word: תַּחַת יְרֵכִי
  choice: di bawah pahaku
  rationale: Terjemahan harfiah mempertahankan ungkapan budaya yang khas tanpa menambahkan tafsiran anatomis atau eufemistis ke dalam teks utama.
