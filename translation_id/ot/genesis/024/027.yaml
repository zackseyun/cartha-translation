language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: id
  text: Lalu ia berkata, “Terpujilah Yahweh, Allah tuanku Abraham, yang tidak menarik kasih setia-Nya dan kesetiaan-Nya dari tuanku.[a] Adapun aku, Yahweh telah menuntun aku dalam perjalanan ke rumah saudara-saudara tuanku.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemurahan-Nya dan kebenaran-Nya.” Pasangan kata Ibrani ini sering menyatakan kasih yang loyal dan sifat yang dapat dipercaya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “saudara-saudara laki-laki”; di sini ungkapan itu dapat menunjuk kepada kerabat laki-laki atau garis keluarga Abraham.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Terpujilah
  rationale: Ungkapan pujian ini secara alami menyatakan berkat atau pujian kepada Allah dalam bahasa Indonesia, bukan sekadar menggambarkan keadaan-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani dan membedakannya dari gelar seperti Tuhan.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Allah tuanku Abraham
  rationale: Mempertahankan hubungan konstruksi Ibrani serta cara hamba itu menyebut Abraham sebagai tuannya.
- source_word: לֹא עָזַב
  choice: tidak meninggalkan
  rationale: Mengikuti gambaran dasar verba עזב, yaitu tidak meninggalkan atau menarik kasih dan kesetiaan dari seseorang.
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: kasih setia-Nya dan kesetiaan-Nya
  rationale: Menyampaikan kasih loyal dan keandalan relasional yang terkandung dalam pasangan istilah ini tanpa membatasinya secara berlebihan pada terminologi perjanjian.
- source_word: מֵעִם אֲדֹנִי
  choice: terhadap tuanku
  rationale: Dalam konstruksi dengan עזב, frasa ini menyatakan bahwa kasih setia dan kesetiaan tidak ditarik atau dijauhkan dari sang tuan; 'terhadap' menghasilkan bahasa Indonesia yang wajar.
- source_word: אָנֹכִי
  choice: Adapun aku
  rationale: Mempertahankan penekanan pada pronomina mandiri yang ditempatkan di depan.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: Menyatakan keadaan atau jalur perjalanan secara alami tanpa menambahkan gagasan yang tidak eksplisit seperti 'jalan yang benar'.
- source_word: נָחַנִי
  choice: telah menuntun aku
  rationale: Menjaga tindakan pengarahan pribadi oleh Yahweh dalam perjalanan hamba itu.
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: menuju rumah saudara-saudara tuanku
  rationale: Mempertahankan 'rumah' dan istilah kekerabatan maskulin jamak secara dekat, sementara 'menuju' menyatakan tujuan yang tersirat dalam konstruksi Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi; transliterasi 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Nuansa pasangan חֶסֶד וֶאֱמֶת
  choice: kasih setia-Nya dan kesetiaan-Nya
  alternative: kemurahan-Nya dan kebenaran-Nya
  rationale: Dalam konteks relasional ini, kedua kata menonjolkan kasih yang loyal dan sifat yang dapat dipercaya. Pilihan ini mempertahankan bobot teologisnya tanpa menyatakan secara eksplisit suatu perjanjian yang tidak disebutkan dalam ayat.
- issue: Cakupan אֲחֵי
  choice: saudara-saudara
  alternative: kerabat
  rationale: Bentuk Ibraninya secara harfiah maskulin jamak, tetapi dalam konteks dapat menunjuk kepada kaum kerabat atau garis keluarga Abraham; teks utama mempertahankan bentuk sumber dan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'tuanku' mempertahankan latar hubungan hamba-tuan, sedangkan 'Adapun aku' menjaga penekanan wacana tanpa terdengar sangat arkais.
