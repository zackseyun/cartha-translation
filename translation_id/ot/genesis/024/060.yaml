base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: id
  text: Lalu mereka memberkati Ribka dan berkata kepadanya, “Saudari kami, kiranya engkau menjadi ribuan kali sepuluh ribu[a], dan kiranya keturunanmu menguasai pintu gerbang orang-orang yang membencinya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ribuan kali sepuluh ribu”; sebuah ungkapan hiperbolis tentang jumlah yang sangat besar. Dapat juga diterjemahkan “berlaksa-laksa” atau “orang banyak yang tak terhitung.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menduduki pintu gerbang musuh-musuhnya.” Pintu gerbang melambangkan kekuatan dan kendali atas sebuah kota. Bentuk Ibrani memakai kata ganti tunggal yang merujuk kepada “keturunan” sebagai satu kesatuan kolektif.
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: mereka memberkati
  rationale: Bentuk piel dari ברך di sini menunjuk pada tindakan mengucapkan berkat atas Ribka; ungkapan ini langsung dan alami dalam bahasa Indonesia.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Mengikuti bentuk nama Ibrani dan ejaan yang sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲחֹתֵנוּ
  choice: Saudari kami
  rationale: Menyampaikan sapaan kekerabatan secara wajar dan tetap mempertahankan bentuk orang pertama jamak.
- source_word: הֲיִי
  choice: kiranya engkau menjadi
  rationale: Mengungkapkan nuansa harapan dalam formula berkat, bukan perintah biasa.
- source_word: לְאַלְפֵי רְבָבָה
  choice: beribu-ribu laksa
  rationale: Mempertahankan gabungan harfiah antara ribuan dan puluhan ribu dalam idiom bilangan Ibrani; 'laksa' berarti sepuluh ribu dan memberi bentuk yang ringkas serta bermartabat.
- source_word: וְיִירַשׁ
  choice: kiranya ... menguasai
  rationale: Dalam kaitannya dengan pintu gerbang lawan, ירש menyatakan pengambilalihan atau penguasaan yang berkemenangan, bukan sekadar menerima warisan.
- source_word: זַרְעֵךְ
  choice: keturunanmu
  rationale: Kata ini merupakan nomina kolektif tunggal yang menunjuk pada keturunan Ribka; 'keturunanmu' alami dalam bahasa Indonesia dan tetap dapat dipahami secara kolektif.
- source_word: שַׁעַר
  choice: pintu gerbang
  rationale: Menjaga citra konkret gerbang kota, yang dalam konteks kuno melambangkan pertahanan dan kendali atas kota.
- source_word: שֹׂנְאָיו
  choice: orang-orang yang membencinya
  rationale: Menerjemahkan bentuk partisip secara transparan dan mempertahankan sufiks pronominal tunggal yang merujuk kembali kepada 'keturunanmu' sebagai kolektif.
theological_decisions:
- issue: Keturunan kolektif dan rujukan pronominal tunggal
  choice: keturunanmu ... orang-orang yang membencinya
  alternative: keturunanmu ... musuh-musuh mereka
  rationale: Teks Ibrani memakai זֶרַע sebagai nomina kolektif tunggal dan sufiks tunggal dalam שֹׂנְאָיו. Bentuk Indonesia 'keturunanmu ... membencinya' mempertahankan hubungan gramatikal dan gema bahasa janji tanpa mempersempitnya menjadi hanya satu individu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Saudari kami' dipilih sebagai sapaan langsung; 'beribu-ribu laksa' mempertahankan idiom angka sumber, sedangkan catatan kaki menjelaskan maknanya. Kata ganti tunggal pada bagian akhir sengaja dipertahankan untuk mencerminkan bentuk Ibrani.
