  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: id
  text: Lalu aku berkata kepada tuanku, ‘Mungkin perempuan itu tidak akan mengikutiku.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak akan pergi setelah aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan narasi lampau; “lalu” menyatakan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: אֶל אֲדֹנִי
  choice: kepada tuanku
  rationale: אָדוֹן dengan akhiran orang pertama tunggal menunjuk kepada Abraham sebagai atasan manusia si hamba. “Tuanku” mempertahankan sapaan hormat dan hubungan sosial dalam konteks ini.
- source_word: אֻלַי
  choice: Mungkin
  rationale: Partikel ini menyatakan kemungkinan atau ketidakpastian; “mungkin” merupakan padanan modern dan alami.
- source_word: לֹא תֵלֵךְ
  choice: tidak mau ikut
  rationale: Secara leksikal berarti “tidak akan pergi,” tetapi bersama אַחֲרַי ungkapan itu berarti mengikuti si hamba. Dalam konteks kekhawatiran tentang kesediaan perempuan tersebut, “tidak mau ikut” terdengar alami tanpa mengubah pokok ketidakpastiannya.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Kata Ibrani hanya menyebut “perempuan itu”; teks belum menyebutnya sebagai istri, sehingga sebutan yang netral dipertahankan.
- source_word: אַחֲרַי
  choice: ikut denganku
  rationale: Secara harfiah berarti “di belakangku/setelah aku”; bersama הלך, makna idiomatisnya ialah mengikuti atau pergi bersama si pembicara.
