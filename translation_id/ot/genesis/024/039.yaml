  register: Bahasa Indonesia baku yang modern, wajar, dan bermartabat. “Tuanku” menjaga nuansa hubungan hamba dengan majikannya, sedangkan “ikut denganku” menyampaikan idiom Ibrani secara alami. Penanda catatan kaki ditempatkan dalam teks utama.
