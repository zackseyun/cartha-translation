  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: id
  text: dan berkata kepadaku, ‘Minumlah engkau juga, dan aku pun akan menimba air untuk unta-untamu.’ Dialah perempuan yang telah Yahweh tetapkan[a] bagi anak tuanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menentukan” atau “menunjukkan sebagai pilihan-Nya.”'
    reason: Bentuk Hifil dari יכח dalam konteks ini dapat bernuansa menetapkan, menentukan, atau menunjukkan siapa yang dipilih.
lexical_decisions:
- source_word: וְאָמְרָה
  choice: dan berkata kepadaku
  rationale: Bentuk perfektum feminin tunggal dipahami dalam rangkaian penuturan kembali tentang tanda yang diminta. Bentuk lampau paling alami dalam bahasa Indonesia dan tetap sesuai dengan konteks ujaran langsung.
- source_word: גַּם אַתָּה שְׁתֵה
  choice: Minumlah engkau juga
  rationale: Mempertahankan daya imperatif שְׁתֵה serta penekanan גַּם אַתָּה pada orang yang diajak bicara.
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: dan aku pun akan menimba air untuk unta-untamu
  rationale: Kata 'air' disediakan secara wajar dari konteks verba שׁאב, sedangkan 'pun' mencerminkan tambahan yang ditandai וְגַם.
- source_word: הִוא הָאִשָּׁה
  choice: Dialah perempuan
  rationale: Menerjemahkan klausa identifikasi secara langsung. אִשָּׁה masih menunjuk kepada perempuan yang dipilih, sehingga tidak dipersempit menjadi 'istri'.
- source_word: אֲשֶׁר הֹכִיחַ
  choice: yang telah ... tetapkan
  rationale: Dalam konteks pemilihan ilahi, bentuk Hifil dari יכח dapat menyatakan penentuan atau penetapan. 'Tetapkan' alami dalam bahasa Indonesia, sementara kemungkinan 'tentukan/tunjukkan' dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: לְבֶן אֲדֹנִי
  choice: bagi anak tuanku
  rationale: Preposisi ל menyatakan hubungan atau tujuan; 'bagi anak tuanku' ringkas dan alami tanpa menambahkan bahwa perempuan itu sudah menjadi istrinya.
theological_decisions:
- issue: Daya klausa הִוא הָאִשָּׁה dalam konteks doa/tanda
  choice: Dialah perempuan
  alternative: Biarlah dia menjadi perempuan itu
  rationale: Teks Ibrani memakai klausa identifikasi dengan pronomina הִוא dan tidak memiliki bentuk jussif yang eksplisit. Terjemahan deklaratif mempertahankan struktur sumber, sementara konteks tetap menunjukkan bahwa ini bagian dari permohonan sang hamba.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri dalam teks sumber dipertahankan sebagai 'Yahweh' agar tidak diubah menjadi gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'engkau' dan 'tuanku' dipakai karena sesuai dengan dialog kuno tanpa membuat kalimat sukar dipahami; paralel גַּם ... וְגַם tercermin melalui 'juga ... pun'.
