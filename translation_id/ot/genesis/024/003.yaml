  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: id
  text: dan aku akan membuat engkau bersumpah demi Yahweh, Allah langit dan Allah bumi, bahwa engkau tidak akan mengambil seorang istri untuk anakku dari antara anak-anak perempuan orang Kanaan, di antara mereka aku tinggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: dan aku akan menyuruh engkau bersumpah
  rationale: 'Bentuk Hifil dari שׁבע bersifat kausatif: pembicara menyuruh orang lain bersumpah. Ungkapan ini mempertahankan daya kausatif dengan bahasa Indonesia yang jelas.'
- source_word: בַּיהוָה
  choice: demi Yahweh
  rationale: Preposisi ב menandai Dia yang menjadi dasar sumpah, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: Allah yang empunya langit dan Allah yang empunya bumi
  rationale: Terjemahan ini mempertahankan pengulangan אֱלֹהֵי serta cakupan kosmis pasangan “langit” dan “bumi”. “Yang empunya” menyatakan hubungan konstruksi tanpa keliru menyiratkan bahwa Allah hanya berada di kedua ranah itu.
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: bahwa engkau tidak akan mengambil
  rationale: Klausa ini menyatakan isi sumpah. “Tidak akan” menjaga nada janji yang sungguh-sungguh tanpa menambahkan modalitas yang tidak dinyatakan secara eksplisit.
- source_word: אִשָּׁה לִבְנִי
  choice: seorang istri bagi anakku
  rationale: Dalam konteks pernikahan, אִשָּׁה berarti “istri”; לִבְנִי menunjukkan bahwa istri itu dicari bagi anak pembicara.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: dari antara anak-anak perempuan orang Kanaan
  rationale: Pilihan ini mempertahankan ungkapan Ibrani “anak-anak perempuan” sekaligus menjelaskan bahwa הַכְּנַעֲנִי menunjuk kepada kelompok orang Kanaan.
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: yang di tengah-tengahnya aku tinggal
  rationale: Ungkapan בְּקִרְבּוֹ berarti berada di tengah atau di antara suatu kelompok, dan bentuk partisip יוֹשֵׁב menggambarkan keadaan menetap yang sedang berlangsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, khidmat, dan mudah dipahami. Kata ganti “aku–engkau” sesuai dengan percakapan pribadi bernada resmi; susunan berulang “Allah yang empunya ... dan Allah yang empunya ...” sengaja mempertahankan penekanan teks Ibrani.
