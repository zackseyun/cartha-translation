  to: dan aku akan membuat engkau bersumpah demi Yahweh, Allah langit dan Allah bumi, bahwa engkau tidak akan mengambil seorang istri untuk anakku dari antara anak-anak perempuan orang Kanaan, di antara mereka aku tinggal.
