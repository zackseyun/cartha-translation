id: GEN.24.21
reference: Genesis 24:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: id
  text: Orang itu mengamatinya dalam diam[a] untuk mengetahui apakah Yahweh telah membuat perjalanannya berhasil atau tidak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang itu menatapnya dengan takjub sambil tetap diam.”
    reason: Bentuk מִשְׁתָּאֵה dapat menyiratkan tatapan penuh rasa takjub, sedangkan מַחֲרִישׁ secara harfiah berarti tetap diam.
lexical_decisions:
- source_word: הָאִישׁ
  choice: Orang itu
  rationale: Mempertahankan nomina umum Ibrani, bukan menggantinya dengan identitas kontekstualnya sebagai hamba Abraham.
- source_word: מִשְׁתָּאֵה לָהּ
  choice: mengamatinya
  rationale: Partisipel ini menunjukkan pengamatan yang terus berlangsung dan mungkin mengandung nuansa takjub; 'mengamati' mempertahankan tindakan tersebut tanpa memastikan emosi yang tidak sepenuhnya jelas.
- source_word: מַחֲרִישׁ
  choice: dalam diam
  rationale: 'Mengungkapkan keadaan atau cara tindakannya: ia tetap diam sementara mengamati.'
- source_word: לָדַעַת
  choice: untuk mengetahui
  rationale: Menerjemahkan infinitif tujuan secara langsung dan alami.
- source_word: הַהִצְלִיחַ
  choice: telah membuat ... berhasil
  rationale: 'Mempertahankan daya kausatif bentuk hifil: Yahweh menyebabkan perjalanan itu berhasil.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan tetragramaton sebagai nama ilahi, bukan menggantinya dengan gelar.
- source_word: דַּרְכּוֹ
  choice: perjalanannya
  rationale: Dalam konteks narasi ini, דֶּרֶךְ menunjuk pada perjalanan atau urusan yang sedang dijalankan; 'perjalanan' alami dalam bahasa Indonesia.
- source_word: אִם לֹא
  choice: atau tidak
  rationale: 'Melengkapi pertanyaan tak langsung dengan ungkapan Indonesia yang idiomatis: ''apakah ... atau tidak''.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Susunan kalimat mempertahankan maksud pengamatan yang diam-diam serta ketidakpastian orang itu mengenai hasil perjalanannya.
