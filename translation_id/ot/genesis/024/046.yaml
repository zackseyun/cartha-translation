  to: Ia segera menurunkan tempayannya dari bahunya[a] dan berkata, “Minumlah, dan unta-untamu juga akan kuberi minum.” Lalu aku minum, dan unta-unta itu juga diberinya minum.
  rationale: Mengganti ‘dari atas tubuhnya’ dengan ‘dari bahunya’ agar terjemahan Indonesia alami dan sesuai dengan konteks langsung, sambil mempertahankan ketidaktersuratan bagian tubuh dalam teks Ibrani melalui catatan kaki berjangkar.
