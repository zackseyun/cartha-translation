base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: id
  text: Ia segera menurunkan tempayannya dari bahunya[a] dan berkata, “Minumlah, dan unta-untamu juga akan kuberi minum.” Lalu aku minum, dan unta-unta itu juga diberinya minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari atasnya.” Konteks yang lebih luas menunjukkan bahwa tempayan itu dibawa di bahunya, tetapi bagian tubuh tersebut tidak disebutkan secara eksplisit dalam frasa ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: Ia segera
  rationale: Bentuk dari מהר menekankan tindakan yang dilakukan dengan cepat; 'segera' alami dalam narasi Indonesia dan mempertahankan kesigapan Ribka.
- source_word: וַתּוֹרֶד כַּדָּהּ
  choice: menurunkan tempayannya
  rationale: Hifil ירד berarti membuat turun, sedangkan כַּד menunjuk wadah untuk mengambil air. 'Tempayan' merupakan padanan Indonesia yang jelas dalam konteks sumur.
- source_word: מֵעָלֶיהָ
  choice: dari atas tubuhnya
  rationale: Ibrani secara harfiah menyatakan 'dari atasnya' tanpa menyebut bagian tubuh. Ungkapan ini menjaga ketidakspesifikan teks, sedangkan bahu sebagai kemungkinan kontekstual dijelaskan dalam catatan kaki.
- source_word: שְׁתֵה
  choice: Minumlah
  rationale: Imperatif langsung ini mempertahankan keringkasan perkataan dalam bahasa Ibrani dan terdengar wajar serta santun dalam bahasa Indonesia.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: dan unta-untamu juga akan kuberi minum
  rationale: Hifil שקה berarti memberi minum. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan 'juga'.
- source_word: וָאֵשְׁתְּ
  choice: Lalu aku minum
  rationale: Bentuk naratif melanjutkan urutan tindakan; 'lalu' menyampaikan perkembangan cerita tanpa menambahkan hubungan sebab yang berlebihan.
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: dan unta-unta itu juga diberinya minum
  rationale: Bentuk feminin menunjukkan bahwa perempuan itu memberi minum. Konstruksi ini mempertahankan pengulangan שקה dan tetap alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk 'kuberi' dan 'diberinya' dipakai untuk menjaga kelancaran dialog dan narasi; ketidakspesifikan מֵעָלֶיהָ dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
