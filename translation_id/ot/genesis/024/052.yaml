  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת דִּבְרֵי/הֶ֑ם וַ/יִּשְׁתַּ֥חוּ אַ֖רְצָ/ה לַֽ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/052.yaml
  text: And when Abraham’s servant heard their words[c][b][a], he bowed down to the ground before Yahweh.
translation:
  language: id
  text: Ketika hamba Abraham mendengar perkataan mereka, ia sujud sampai ke tanah di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada Yahweh.” Kata yang diterjemahkan “sujud” juga dapat berarti merebahkan diri atau membungkuk rendah sebagai tanda hormat dan penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Ungkapan naratif ini memperkenalkan peristiwa berikutnya. 'Ketika' menyampaikan hubungan waktu secara alami tanpa meniru secara kaku idiom 'dan terjadilah ketika'.
- source_word: שָׁמַע
  choice: mendengar
  rationale: Kata kerja ini secara langsung menyatakan bahwa hamba itu mendengar apa yang dikatakan.
- source_word: עֶבֶד אַבְרָהָם
  choice: hamba Abraham
  rationale: Frasa konstruksi ini secara alami berarti orang yang melayani dan mewakili rumah tangga Abraham. 'Hamba' akurat dalam konteks dan tidak memaksakan penekanan pada status hukum perbudakan.
- source_word: דִּבְרֵיהֶם
  choice: perkataan mereka
  rationale: Pilihan ini mempertahankan arti harfiah 'kata-kata/perkataan mereka' dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁתַּחוּ
  choice: ia sujud
  rationale: Kata kerja ini menggambarkan tindakan membungkuk sangat rendah atau merebahkan diri sebagai tanda hormat, dan dalam konteks kepada Allah mengandung nilai penyembahan. 'Sujud' menyampaikan postur serta rasa hormat tanpa mengganti tindakan konkret itu dengan istilah abstrak 'menyembah'.
- source_word: אַרְצָה
  choice: sampai ke tanah
  rationale: Bentuk berarah ini menunjukkan gerak menuju tanah. 'Sampai ke tanah' memperjelas kedalaman tindakan sujud secara alami.
- source_word: לַיהוָה
  choice: di hadapan Yahweh
  rationale: Secara bentuk berarti 'kepada Yahweh'; bersama kata kerja sujud, 'di hadapan Yahweh' merupakan ungkapan Indonesia yang alami untuk tindakan penghormatan yang diarahkan kepada-Nya. Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Apakah וַיִּשְׁתַּחוּ diterjemahkan secara eksplisit sebagai menyembah
  choice: ia sujud sampai ke tanah
  alternative: ia menyembah Yahweh; ia merebahkan diri di hadapan Yahweh
  rationale: Konteks kepada Yahweh memberi tindakan ini makna penyembahan, tetapi teks juga menonjolkan postur tubuh dengan אַרְצָה. Terjemahan utama mempertahankan tindakan fisik dan tidak menghapus ketegangan antara sujud sebagai postur dan sebagai ibadah.
- issue: Relasi yang dinyatakan oleh לַיהוָה
  choice: di hadapan Yahweh
  alternative: kepada Yahweh
  rationale: Preposisi ל secara formal berarti 'kepada/untuk', tetapi dengan kata kerja sujud ungkapan ini menyatakan pihak yang menjadi tujuan penghormatan. 'Di hadapan' wajar dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang ringkas dan bermartabat. 'Ia' dipakai untuk kesinambungan gaya sastra Alkitab; 'sujud sampai ke tanah' alami bagi pembaca umum dan mempertahankan gambaran fisik teks Ibrani.
