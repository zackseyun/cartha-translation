  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: id
  text: Lalu perempuan itu berkata kepadanya, “Kami mempunyai banyak jerami dan pakan ternak, juga tempat untuk bermalam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu perempuan itu berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” memberi alur yang alami. Subjek feminin dinyatakan sebagai “perempuan itu” agar jelas dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Menerjemahkan preposisi dengan sufiks pronominal maskulin tunggal secara langsung dan alami.
- source_word: גַּם ... גַּם ... גַּם
  choice: '... dan ..., juga ...'
  rationale: Pengulangan גַּם menyusun daftar secara kumulatif; struktur Indonesia ini mempertahankan penambahan tanpa terdengar kaku.
- source_word: תֶּבֶן
  choice: jerami
  rationale: Dalam konteks persediaan bagi ternak, “jerami” merupakan padanan yang tepat dan umum.
- source_word: מִסְפּוֹא
  choice: pakan ternak
  rationale: Menunjuk pada makanan bagi hewan; frasa ini lebih jelas bagi pembaca umum daripada istilah yang lebih teknis.
- source_word: רַב
  choice: banyak
  rationale: Menyatakan kelimpahan persediaan secara alami dan tetap dekat dengan makna leksikal.
- source_word: עִמָּנוּ
  choice: kami mempunyai
  rationale: Secara harfiah berarti “bersama kami,” tetapi dalam konteks kepemilikan atau ketersediaan, “kami mempunyai” merupakan ungkapan Indonesia yang alami.
- source_word: מָקוֹם
  choice: tempat
  rationale: Mempertahankan keluasan makna kata sumber tanpa mempersempitnya menjadi kamar atau ruang tertentu.
- source_word: לָלוּן
  choice: untuk bermalam
  rationale: Mengungkapkan tindakan tinggal atau melewatkan malam secara ringkas dan alami dalam bahasa Indonesia modern.
