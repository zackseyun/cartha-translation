  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: id
  text: Yahweh telah sangat memberkati tuanku, dan ia menjadi makin besar. Dia telah memberinya kawanan domba dan kambing, ternak sapi, perak dan emas, hamba laki-laki dan hamba perempuan[a], unta dan keledai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “budak laki-laki dan budak perempuan.” Istilah Ibrani yang dipakai dapat berarti pelayan rumah tangga atau budak, bergantung pada konteks.
    reason: Alternatif leksikal untuk עֲבָדִם dan שְׁפָחֹת; status sosial yang tepat tidak ditentukan sepenuhnya oleh istilah itu sendiri.
lexical_decisions:
- source_word: יהוה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani dan mempertahankannya sebagai nama diri.
- source_word: בֵּרַךְ ... מְאֹד
  choice: telah sangat memberkati
  rationale: Mengungkapkan intensitas מְאֹד serta hasil tindakan lampau yang masih nyata dalam keadaan Abraham saat ini.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Dalam konteks ini menunjuk kepada Abraham sebagai atasan manusia dari si hamba; 'tuanku' alami dan tetap menunjukkan hubungan sosial tersebut.
- source_word: וַיִּגְדָּל
  choice: sehingga ia menjadi orang besar
  rationale: Mempertahankan makna luas akar גדל, yakni menjadi besar dalam kekayaan dan kedudukan, tanpa mempersempitnya hanya menjadi 'kaya'. Hubungan hasil dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: צֹאן וּבָקָר
  choice: kambing domba dan sapi
  rationale: צֹאן adalah ternak kecil kolektif, terutama domba dan kambing, sedangkan בָּקָר adalah ternak sapi; bentuk konkret ini lebih alami daripada padanan kolektif yang kaku.
- source_word: כֶסֶף וְזָהָב
  choice: perak dan emas
  rationale: Mempertahankan arti konkret kedua logam berharga, bukan mengabstraksikannya menjadi uang atau kekayaan.
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: hamba laki-laki dan hamba perempuan
  rationale: Menjaga pembedaan gender dalam pasangan Ibrani dan membiarkan ketidakpastian status antara pelayan rumah tangga dan budak dijelaskan dalam catatan kaki.
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: unta dan keledai
  rationale: Padanan langsung dan alami bagi kedua jenis hewan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Status sosial עֲבָדִם dan שְׁפָחֹת dalam daftar milik rumah tangga
  choice: hamba laki-laki dan hamba perempuan
  alternative: budak laki-laki dan budak perempuan
  rationale: Kedua istilah dapat merujuk kepada pelayan atau budak. Karena ayat ini tidak menentukan secara tegas sifat keterikatan mereka, teks utama memakai 'hamba' dan catatan kaki mempertahankan alternatif yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Daftar kekayaan dibuat konkret dan mudah dipahami; pengulangan serta cakupan makna Ibrani dipertahankan sejauh tetap alami.
