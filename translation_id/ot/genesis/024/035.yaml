- from: Yahweh telah sangat memberkati tuanku[a], sehingga ia menjadi orang besar. Dia telah memberinya kambing domba dan sapi, perak dan emas, hamba laki-laki dan hamba perempuan, unta dan keledai.
  to: Yahweh telah sangat memberkati tuanku, dan ia menjadi makin besar. Dia telah memberinya kawanan domba dan kambing, ternak sapi, perak dan emas, hamba laki-laki dan hamba perempuan[a], unta dan keledai.
  rationale: Revisi mempertahankan koordinasi klausa Ibrani tanpa menambahkan hubungan sebab-akibat, mengganti ungkapan ternak dengan bahasa Indonesia baku yang mencakup domba dan kambing, serta memindahkan jangkar catatan kaki ke frasa yang benar. Tidak ada perubahan pada makna daftar kepemilikan maupun pada ambiguitas status hamba/budak.
