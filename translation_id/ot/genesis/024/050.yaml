base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: id
  text: Lalu Laban dan Betuel menjawab dan berkata, “Perkara ini berasal dari Yahweh. Kami tidak dapat mengatakan apa pun kepadamu, entah buruk entah baik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berbicara kepadamu buruk atau baik.” Ungkapan ini menyatakan bahwa mereka tidak dapat menentang atau mengubah perkara yang telah ditetapkan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: menjawab dan berkata
  rationale: Mempertahankan kedua verba dalam rumusan pengantar tuturan Ibrani, meskipun dalam bahasa Indonesia salah satunya dapat dianggap berlebih.
- source_word: מֵיְהוָה
  choice: berasal dari Yahweh
  rationale: Preposisi מִן menyatakan sumber atau asal, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: יָצָא הַדָּבָר
  choice: perkara ini berasal
  rationale: Dalam konteks perundingan pernikahan, הַדָּבָר menunjuk pada perkara yang sedang dibicarakan; gabungan יָצָא dengan מֵיְהוָה menyatakan bahwa perkara itu datang atau berasal dari Yahweh.
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: kami tidak dapat mengatakan apa pun kepadamu
  rationale: Menyampaikan ketidakmampuan berbicara atau memberikan tanggapan kepada hamba Abraham dalam bahasa Indonesia yang alami.
- source_word: רַע אוֹ טוֹב
  choice: entah buruk entah baik
  rationale: Mempertahankan urutan dan pasangan polaritas dalam bahasa Ibrani, sekaligus memakai bentuk Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna ungkapan רַע אוֹ טוֹב
  choice: Mempertahankan pasangan “buruk ... baik” dalam teks dan menjelaskan idiomnya dalam catatan kaki
  alternative: Menggantikannya langsung dengan “menentang atau mengubahnya”
  rationale: Ungkapan itu menyiratkan bahwa mereka tidak berwenang menentang atau mengubah keputusan Yahweh, tetapi terjemahan utama tidak mempersempit ungkapan melebihi bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “menjawab dan berkata” sengaja dipertahankan untuk mencerminkan corak narasi Ibrani; bentuk “entah buruk entah baik” menjaga urutan kata sumber tanpa terdengar janggal.
