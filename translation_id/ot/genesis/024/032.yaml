revisions:
- from: Lalu orang itu masuk ke dalam rumah. Laban[a] melepaskan perlengkapan unta-unta itu, memberikan jerami dan pakan kepada unta-unta itu, serta menyediakan air untuk membasuh kaki orang itu dan kaki orang-orang yang menyertainya.
  to: Lalu orang itu masuk ke dalam rumah. Setelah itu, perlengkapan unta-unta itu dilepaskan; unta-unta itu diberi jerami dan pakan, serta disediakan air untuk membasuh kaki orang itu dan kaki orang-orang yang menyertainya.[a]
  rationale: Revisi menghapus nama Laban dari teks utama agar tidak menetapkan agen yang tidak disebutkan oleh teks Ibrani. Kalimat pasif mempertahankan ambiguitas sumber secara alami dalam bahasa Indonesia, sedangkan catatan kaki menjelaskan dua kemungkinan rujukan subjek. Makna tindakan hospitalitas, pemberian pakan, dan pembasuhan kaki tidak berubah.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:56:21Z'
