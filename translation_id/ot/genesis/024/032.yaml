base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: id
  text: Lalu orang itu masuk ke dalam rumah. Setelah itu, perlengkapan unta-unta itu dilepaskan; unta-unta itu diberi jerami dan pakan, serta disediakan air untuk membasuh kaki orang itu dan kaki orang-orang yang menyertainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai kata kerja orang ketiga tunggal (“ia”) untuk tindakan-tindakan ini, tanpa menyebut nama pelakunya. Dalam konteksnya pelaku dapat dipahami sebagai Laban, tetapi secara gramatikal rangkaian itu juga dapat dibaca dengan “orang itu” sebagai subjek.
    reason: subject_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: Lalu orang itu masuk ke dalam rumah
  rationale: בוא dengan ה lokal pada הַבַּיְתָה menyatakan gerak menuju atau masuk ke rumah. 'Masuk ke dalam rumah' alami dalam bahasa Indonesia dan mempertahankan sebutan eksplisit 'orang itu'.
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: melepaskan perlengkapan unta-unta itu
  rationale: פתח secara harfiah berarti 'membuka', tetapi dengan objek unta dalam konteks persinggahan merupakan ungkapan untuk melonggarkan atau menanggalkan muatan dan perlengkapannya. Pilihan ini tidak membatasi tindakan hanya pada pelana atau hanya pada muatan.
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: jerami dan pakan
  rationale: תבן adalah jerami atau batang-batang kering, sedangkan מספוא adalah pakan ternak. Dua unsur yang dibedakan dalam sumber dipertahankan.
- source_word: וּמַיִם לִרְחֹץ
  choice: serta menyediakan air untuk membasuh
  rationale: וַיִּתֵּן secara harfiah 'memberikan', tetapi objek air dan konstruksi tujuan לִרְחֹץ secara alami diungkapkan 'menyediakan air untuk membasuh' dalam bahasa Indonesia.
- source_word: רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: kaki orang itu dan kaki orang-orang yang menyertainya
  rationale: Akhiran pronominal tunggal pada רגליו secara gramatikal dapat merujuk kepada tokoh laki-laki yang menjadi pusat adegan. Karena subjek tindakan sebelumnya berpotensi bergeser, nomina 'orang itu' dipakai agar rujukan dalam terjemahan Indonesia tidak menyesatkan.
theological_decisions:
- issue: Identitas subjek וַיְפַתַּח dan וַיִּתֵּן
  choice: Laban dicantumkan dalam teks dengan catatan kaki
  alternative: Melanjutkan 'orang itu' sebagai subjek gramatikal seluruh rangkaian tindakan
  rationale: Kedua verba hanya menandai subjek maskulin tunggal dan teks Ibrani tidak menyebut nama Laban pada klausa ini. Namun konteks ayat 31, tindakan seorang tuan rumah, dan rujukan 'kakinya' bersama kaki para pengikutnya mendukung peralihan subjek kepada Laban. Catatan kaki menjaga keterbukaan terhadap struktur gramatikal sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'unta-unta itu' mempertahankan kejelasan referen; 'membasuh kaki' mempertahankan warna budaya dan register narasi Alkitab.
