  terminology: “Orang itu,” “unta-unta itu,” “jerami,” “pakan,” dan “membasuh kaki” sesuai dengan register narasi Alkitab Indonesia yang modern dan lugas. “Membasuh” tepat bagi tindakan mencuci kaki dalam konteks hospitalitas.
