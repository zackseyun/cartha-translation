  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: id
  text: “Lihat, Ribka ada di hadapanmu. Ambillah dia dan pergilah. Biarlah[a] dia menjadi istri bagi anak tuanmu, seperti yang telah dikatakan Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Hendaklah dia menjadi istri.” Bentuk jusif Ibrani ini dapat menyatakan izin maupun kehendak.
    reason: Menjaga rentang makna bentuk jusif tanpa memaksakan hanya satu nuansa.
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian kepada keadaan yang langsung tampak. “Lihat” hidup dan wajar dalam bahasa Indonesia modern.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לְפָנֶיךָ
  choice: ada di hadapanmu
  rationale: Mempertahankan gambaran harfiah “di hadapanmu” sekaligus menyampaikan bahwa Ribka hadir dan tersedia untuk dibawa.
- source_word: קַח וָלֵךְ
  choice: Ambillah dia dan pergilah
  rationale: Kedua bentuk perintah berurutan dipertahankan. Objek “dia” dinyatakan secara eksplisit karena Ribka adalah objek yang jelas dari konteks.
- source_word: וּתְהִי אִשָּׁה
  choice: Biarlah dia menjadi istri
  rationale: Bentuk jusif orang ketiga feminin dapat mengungkapkan izin atau kehendak. “Biarlah” mempertahankan nuansa itu, sedangkan “menjadi istri” merupakan ungkapan perkawinan yang alami dalam bahasa Indonesia.
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: anak tuanmu
  rationale: Dalam konstruksi “istri anak tuanmu,” relasi yang ditandai oleh לְ tersampaikan secara alami. “Tuanmu” sesuai dengan konteks hubungan hamba dan tuan.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang telah ... katakan
  rationale: Menyatakan kesesuaian dengan perkataan Yahweh yang sudah disampaikan dan tetap relevan bagi keputusan saat itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Cara memahami jusif וּתְהִי dalam persetujuan keluarga Ribka
  choice: Biarlah dia menjadi istri
  alternative: Hendaklah dia menjadi istri
  rationale: “Biarlah” secara alami menyampaikan izin atau persetujuan dalam konteks ini, tanpa meniadakan kemungkinan bahwa bentuk Ibrani juga bernuansa kehendak atau penetapan.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat langsung dipertahankan, dengan sapaan orang kedua tunggal yang sesuai dengan hubungan keluarga Ribka kepada hamba Abraham.
