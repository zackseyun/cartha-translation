base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: id
  text: Lalu aku membungkuk dan menyembah Yahweh, serta memuji Yahweh, Allah Abraham, tuanku, yang telah menuntun aku di jalan kebenaran[a] untuk mengambil putri saudara laki-laki tuanku bagi putranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di jalan kebenaran.” Ungkapan ini juga dapat berarti “di jalan yang setia atau dapat diandalkan,” dengan menekankan bahwa tuntunan Yahweh dapat dipercaya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: aku berlutut
  rationale: Kata kerja ini menyatakan tindakan fisik membungkukkan tubuh. Dalam bahasa Indonesia, 'berlutut' menyampaikan sikap merendahkan diri secara alami tanpa mengulang 'menyembah'.
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: dan menyembah Yahweh
  rationale: Kata kerja ini menunjuk pada sujud sebagai penghormatan; ketika diarahkan kepada Allah, 'menyembah' merupakan padanan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וָאֲבָרֵךְ אֶת יְהוָה
  choice: serta memuji Yahweh
  rationale: ברך dengan Allah sebagai objek berarti mengucapkan berkat atau berkata baik tentang Dia. 'Memuji' menyampaikan maksud idiomatisnya dengan jelas dalam bahasa Indonesia modern.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Allah tuanku Abraham
  rationale: אֲדֹנִי merujuk kepada Abraham sebagai atasan manusia; 'tuanku' mempertahankan hubungan sosial dan register narasi kuno yang wajar.
- source_word: הִנְחַנִי
  choice: telah menuntun aku
  rationale: Bentuk Hifil dari נחה berarti membimbing atau menuntun; 'telah' cocok dengan tinjauan kembali atas perjalanan yang baru selesai.
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: di jalan yang benar dan dapat dipercaya
  rationale: אֱמֶת mencakup kebenaran, keteguhan, dan keterandalan. Rumusan ini mempertahankan dua sisi makna tersebut tanpa membatasinya pada arah yang tepat saja.
- source_word: לָקַחַת
  choice: untuk mengambil
  rationale: Infinitif ini menyatakan tujuan. 'Mengambil' mempertahankan ungkapan langsung dalam konteks pengambilan seorang perempuan untuk menjadi istri.
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: anak perempuan saudara tuanku
  rationale: Rantai konstruksi ini secara harfiah menunjukkan putri dari saudara laki-laki sang tuan; dalam bahasa Indonesia 'saudara' wajar dan tidak menambahkan informasi yang tidak dinyatakan eksplisit.
- source_word: לִבְנוֹ
  choice: bagi anaknya
  rationale: Akhiran pronominal merujuk kepada tuanku Abraham; 'anaknya' singkat dan jelas dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan makna בְּדֶרֶךְ אֱמֶת
  choice: di jalan yang benar dan dapat dipercaya
  alternative: di jalan yang benar; di jalan kesetiaan
  rationale: Frasa ini dapat menekankan baik jalan yang benar maupun tuntunan Yahweh yang setia dan dapat diandalkan. Terjemahan utama mempertahankan ketegangan semantis itu, sedangkan catatan kaki menjelaskan ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tuanku' dipakai untuk hubungan hamba dengan Abraham, sedangkan 'Yahweh' dipertahankan sebagai nama ilahi. Susunan kalimat mengikuti alur Ibrani sambil tetap alami dalam bahasa Indonesia.
