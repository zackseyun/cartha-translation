  terminology: “Hamba,” “tuan,” “Aram-Naharaim,” dan “kota Nahor” sesuai register naratif dan tidak memaksakan penafsiran. Catatan tentang Aram-Naharaim tepat mempertahankan nama Ibrani sambil menyebut padanan tradisional. Catatan a sebaiknya menjelaskan idiom tanpa membenarkan tambahan makna dalam teks utama.
