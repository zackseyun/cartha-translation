revisions:
- from: Kemudian hamba itu mengambil sepuluh ekor unta dari antara unta-unta tuannya, lalu pergi dengan membawa segala barang berharga milik tuannya yang dipercayakan kepadanya.[a] Ia pun berangkat menuju Aram-Naharaim,[b] ke kota Nahor.
  to: Kemudian hamba itu mengambil sepuluh ekor unta dari antara unta-unta milik tuannya, lalu pergi dengan membawa segala barang berharga milik tuannya.[a] Ia pun berangkat menuju Aram-Naharaim,[b] ke kota Nahor.
  rationale: Revisi menghapus penambahan interpretatif “yang dipercayakan kepadanya,” sambil mempertahankan makna kontekstual yang aman, yaitu bahwa hamba itu membawa barang-barang berharga milik tuannya. Nuansa idiomatik “di tangannya” tetap tersedia dalam catatan kaki. Penyesuaian “unta-unta milik tuannya” memperjelas kepemilikan dalam bahasa Indonesia tanpa menghilangkan nuansa pemilihan dari antara unta tuannya.
