  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: id
  text: Kemudian hamba itu mengambil sepuluh ekor unta dari antara unta-unta milik tuannya, lalu pergi dengan membawa segala barang berharga milik tuannya.[a] Ia pun berangkat menuju Aram-Naharaim,[b] ke kota Nahor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan segala yang baik milik tuannya ada di tangannya.” Ungkapan ini dapat berarti bahwa barang-barang berharga milik tuannya dibawanya atau berada dalam kekuasaannya.
    reason: lexical_alternative
  - marker: b
    text: Nama ini secara tradisional diterjemahkan “Aram di antara Dua Sungai” atau “Mesopotamia.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: hamba itu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks rumah tangga ini, “hamba” terdengar wajar dan tetap menunjukkan kedudukannya di bawah sang tuan tanpa menambahkan penekanan yang tidak ada dalam narasi.
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: sepuluh ekor unta dari antara unta-unta tuannya
  rationale: 'Konstruksi מִן bersifat partitif: sepuluh unta dipilih dari kumpulan unta milik tuannya. Penggolong “ekor” membuat ungkapan alami dalam bahasa Indonesia.'
- source_word: וַיֵּלֶךְ
  choice: lalu pergi
  rationale: Menerjemahkan makna dasar הלך dan mempertahankan gerak naratif sebelum keterangan mengenai barang milik tuannya.
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: dengan membawa segala barang berharga milik tuannya yang dipercayakan kepadanya
  rationale: טוּב dalam konteks ini menunjuk pada barang bernilai, kemungkinan besar bekal dan hadiah. Idiom בְּיָדוֹ secara harfiah berarti “di tangannya” dan dapat menyatakan penguasaan atau tanggung jawab; terjemahan utama menyampaikan makna kontekstual itu tanpa menyiratkan bahwa semuanya dipegang secara harfiah.
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: Ia pun berangkat menuju
  rationale: Gabungan קום dan הלך lazim menandai dimulainya tindakan perjalanan. “Berangkat menuju” menyampaikan gerak yang disengaja dengan bahasa Indonesia alami, sementara unsur perjalanan yang berulang dalam teks Ibrani tetap tercermin setelah “lalu pergi” pada klausa sebelumnya.
- source_word: אֲרַם נַהֲרַיִם
  choice: Aram-Naharaim
  rationale: Nama geografis ditransliterasikan agar bentuk Ibraninya tetap tampak dan tidak langsung disamakan dengan istilah geografis tradisional yang lebih luas.
- source_word: עִיר נָחוֹר
  choice: kota Nahor
  rationale: Rangkaian konstruksi ini secara alami berarti kota yang dikaitkan dengan Nahor, tanpa menentukan apakah Nahor pendiri atau pemiliknya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan gerak dalam bahasa Ibrani dipertahankan secara wajar melalui “lalu pergi” dan “berangkat menuju”; idiom konkret “di tangannya” dijelaskan dalam catatan kaki karena terjemahan harfiahnya dapat disalahpahami dalam bahasa Indonesia.
