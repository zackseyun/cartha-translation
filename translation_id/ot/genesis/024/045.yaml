  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: id
  text: Sebelum aku selesai berbicara dalam hatiku[a], lihatlah, Ribka keluar dengan tempayannya di atas bahunya. Ia turun ke mata air dan menimba air. Lalu aku berkata kepadanya, ‘Tolong beri aku minum.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berbicara kepada hatiku,” ungkapan untuk perkataan batin atau doa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: Sebelum aku selesai
  rationale: טֶרֶם dengan bentuk verba ini menunjukkan tindakan yang belum selesai ketika peristiwa berikutnya terjadi; ungkapan ini alami dalam narasi bahasa Indonesia.
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: berbicara dalam hatiku
  rationale: Secara harfiah berarti ‘berbicara kepada hatiku’ dan menunjuk pada perkataan batin atau doa; pilihan ini mempertahankan citra Ibrani tanpa menentukannya secara berlebihan.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Partikel ini menyajikan kejadian secara tiba-tiba dan hidup; ‘lihatlah’ mempertahankan daya retorisnya dalam ragam naratif yang bermartabat.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Bentuk nama yang baku dan luas dikenal dalam tradisi Alkitab berbahasa Indonesia.
- source_word: יֹצֵאת
  choice: keluar
  rationale: Partisip sesudah הִנֵּה memberi gambaran langsung dan hidup; ‘keluar’ menyampaikan tindakan itu secara wajar.
- source_word: כַדָּהּ
  choice: tempayannya
  rationale: כַּד adalah wadah untuk membawa dan menimba air; ‘tempayan’ jelas, alami, dan sesuai konteks.
- source_word: עַל־שִׁכְמָהּ
  choice: di atas bahunya
  rationale: Menyampaikan hubungan tempat secara langsung dan alami dalam bahasa Indonesia.
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: Ia turun ke mata air
  rationale: עַיִן di sini berarti sumber atau mata air, berbeda dari istilah Ibrani yang lazim untuk sumur; ‘mata air’ mempertahankan pembedaan leksikal tersebut.
- source_word: וַתִּשְׁאָב
  choice: menimba air
  rationale: Verba ini berarti mengambil atau menimba air; objek ‘air’ dibuat eksplisit secara idiomatis.
- source_word: הַשְׁקִינִי נָא
  choice: Tolong beri aku minum
  rationale: Bentuk kausatif berarti ‘memberi minum’, sedangkan נָא menyatakan permintaan sopan yang diwakili oleh ‘tolong’.
theological_decisions:
- issue: Sifat perkataan batin hamba Abraham
  choice: berbicara dalam hatiku
  alternative: berdoa dalam hati
  rationale: Konteks mendukung doa batin, tetapi teks Ibrani hanya mengatakan ‘berbicara kepada hati’; terjemahan utama mempertahankan ambiguitas antara doa dan perkataan batin.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang luhur tetapi mudah dipahami. ‘Lihatlah’ mempertahankan kejelasan retoris וְהִנֵּה; ‘tempayan’ dipilih sebagai istilah lazim untuk wadah air. Hanya satu penanda catatan kaki digunakan karena catatan bahasa Inggris bertanda b tampaknya salah tempat: keterangan tentang ‘spring/fountain’ berkaitan dengan ‘mata air’, bukan dengan ‘kepadanya’, dan dalam bahasa Indonesia ‘mata air’ sudah menyampaikan makna sumber dengan jelas.'
