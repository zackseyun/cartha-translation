  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: id
  text: Yahweh, Allah langit, yang membawa aku dari rumah ayahku dan dari tanah kelahiranku, yang berbicara kepadaku dan yang bersumpah kepadaku dengan berfirman, ‘Kepada keturunanmu akan Kuberikan negeri ini,’ Dialah yang akan mengutus malaikat-Nya[a] mendahuluimu, dan engkau akan mengambil seorang istri untuk putraku dari sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan-Nya.” Kata Ibrani מַלְאָךְ dapat berarti “utusan” atau “malaikat”; dalam konteks ini, utusan surgawi lebih mungkin dimaksudkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum bagi Allah.
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Allah yang menguasai langit
  rationale: Mengungkapkan relasi konstruksi ‘Allah atas/langit’ dalam bahasa Indonesia modern yang alami tanpa memakai ungkapan lama ‘yang empunya langit’.
- source_word: לְקָחַנִי
  choice: membawa aku
  rationale: Dalam konteks perpindahan Abraham dari lingkungan asalnya, pilihan ini lebih alami daripada ‘mengambil aku’ dan tetap mempertahankan tindakan Allah sebagai subjek.
- source_word: מִבֵּית אָבִי
  choice: dari rumah ayahku
  rationale: Mempertahankan ungkapan keluarga-rumah tangga Ibrani tanpa mempersempitnya menjadi sekadar bangunan atau memperluasnya menjadi kaum leluhur.
- source_word: מֵאֶרֶץ מוֹלַדְתִּי
  choice: dari tanah kelahiranku
  rationale: מוֹלֶדֶת dapat berkaitan dengan tempat lahir, negeri asal, atau lingkungan kerabat; ‘tanah kelahiranku’ dekat dengan bentuk Ibrani dan tidak menentukan arti kerabat secara berlebihan.
- source_word: דִּבֶּר לִי
  choice: berbicara kepadaku
  rationale: Mempertahankan verba umum ‘berbicara’ dan tidak meleburkannya secara tafsiri menjadi ‘berjanji’.
- source_word: נִשְׁבַּע לִי
  choice: bersumpah kepadaku
  rationale: Padanan langsung dan wajar bagi bentuk sumpah dalam bahasa Ibrani.
- source_word: לְזַרְעֲךָ
  choice: kepada keturunanmu
  rationale: ‘Keturunan’ dapat berfungsi secara kolektif dalam bahasa Indonesia dan mempertahankan keluasan זֶרַע tanpa ungkapan harfiah ‘benih’ yang tidak alami.
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: akan Kuberikan negeri ini
  rationale: Mempertahankan rumusan janji pemberian tanah; ‘negeri’ wajar bagi suatu wilayah yang dijanjikan.
- source_word: הוּא
  choice: Dialah
  rationale: Bentuk ini menyampaikan penekanan pada pronomina Ibrani הוּא dalam peralihan menuju tindakan Allah berikutnya.
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: akan mengutus malaikat-Nya mendahuluimu
  rationale: ‘Malaikat’ paling mungkin menunjuk utusan surgawi dalam konteks tuntunan ilahi, sedangkan ‘mendahuluimu’ menyampaikan makna idiomatis לְפָנֶיךָ.
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: engkau harus mendapatkan seorang istri bagi anakku
  rationale: Dalam konteks tugas sang hamba, ‘mendapatkan’ menyampaikan tujuan mencari istri tanpa kesan bahwa perempuan itu diambil secara paksa; modal ‘harus’ menyatakan daya perintah dari bentuk verbal tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna מַלְאָכוֹ dalam konteks ini
  choice: malaikat-Nya
  alternative: utusan-Nya
  rationale: מַלְאָךְ secara leksikal dapat berarti utusan manusia atau utusan surgawi. Karena yang dimaksud di sini diutus oleh Allah untuk mendahului dan menuntun hamba itu, makna utusan surgawi lebih mungkin, tetapi alternatif leksikalnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan ‘yang ... dan yang ...’ dipertahankan untuk mencerminkan susunan sumpah Abraham. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan pada ‘malaikat-Nya’, yaitu unsur yang benar-benar memiliki alternatif leksikal.
