  naturalness: Teks umumnya baku dan jelas. “Allah langit” merupakan ungkapan Alkitabiah yang ringkas dan cukup alami dalam register khidmat. “Mengambil seorang istri untuk putraku” lebih dekat dengan verba Ibrani daripada “mendapatkan,” sambil tetap wajar dalam konteks penugasan ini.
  terminology: Yahweh dipertahankan sebagai nama ilahi. “Keturunan,” “negeri,” dan “malaikat-Nya” tepat. Catatan kaki pada malaikat-Nya mempertahankan alternatif leksikal yang nyata. “Putraku” secara eksplisit mencerminkan בְּנִי, “anakku laki-laki/putraku.”
