  to: Yahweh, Allah langit, yang membawa aku dari rumah ayahku dan dari tanah kelahiranku, yang berbicara kepadaku dan yang bersumpah kepadaku dengan berfirman, ‘Kepada keturunanmu akan Kuberikan negeri ini,’ Dialah yang akan mengutus malaikat-Nya[a] mendahuluimu, dan engkau akan mengambil seorang istri untuk putraku dari sana.
