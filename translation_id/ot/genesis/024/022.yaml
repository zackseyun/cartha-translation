  terminology: '''Beka'' dan ''syikal'' konsisten serta tepat dipertahankan sebagai satuan kuno. Catatan mengenai kemungkinan cincin hidung atau telinga mempertahankan keluasan leksikal נזם tanpa memaksakan salah satu identifikasi.'
