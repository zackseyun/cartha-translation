base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: id
  text: Setelah unta-unta itu selesai minum, laki-laki itu mengambil sebuah cincin emas[a] yang beratnya satu beka[b], serta dua gelang untuk tangan perempuan itu, dengan berat seluruhnya sepuluh syikal emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “cincin hidung emas”; istilah Ibraninya dapat merujuk pada cincin yang dikenakan di hidung atau telinga.
    reason: lexical_alternative
  - marker: b
    text: Satu beka adalah satuan berat yang setara dengan setengah syikal.
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: Setelah unta-unta itu selesai minum
  rationale: Konstruksi ini menandai selesainya tindakan minum sebelum tindakan berikutnya; “setelah ... selesai” alami dalam bahasa Indonesia dan mempertahankan urutannya.
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Teks Ibrani menyebutnya secara harfiah sebagai “laki-laki itu”, bukan “hamba itu”; pilihan ini mempertahankan penyebutan sumber meskipun konteks menunjukkan bahwa ia adalah hamba Abraham.
- source_word: נֶזֶם זָהָב
  choice: sebuah cincin emas
  rationale: נֶזֶם dapat merujuk pada cincin yang dikenakan di hidung atau telinga. Istilah umum “cincin” mempertahankan keluasan makna, sedangkan kemungkinan yang lebih khusus dicatat dalam catatan kaki.
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: yang beratnya satu beka
  rationale: בֶּקַע adalah satuan berat kuno. Nama satuan dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
- source_word: וּשְׁנֵי צְמִידִים
  choice: serta dua gelang
  rationale: Menerjemahkan secara langsung jumlah dua dan benda yang dimaksud.
- source_word: עַל יָדֶיהָ
  choice: untuk tangan perempuan itu
  rationale: Secara harfiah berarti “pada/untuk kedua tangannya”. Rumusan ini mempertahankan idiom sumber tanpa mempersempitnya menjadi pergelangan tangan atau lengan.
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: yang beratnya sepuluh syikal emas
  rationale: Satuan syikal tersirat dalam ungkapan berat ini dan perlu dinyatakan agar maknanya jelas dalam bahasa Indonesia; berat tersebut merujuk pada kedua gelang secara bersama-sama.
