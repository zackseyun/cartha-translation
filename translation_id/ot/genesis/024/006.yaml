lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר merupakan bentuk naratif biasa; 'berkata' alami dan tepat dalam narasi Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi dengan sufiks orang ketiga tunggal maskulin menandai pihak yang dituju.
- source_word: הִשָּׁמֶר לְךָ
  choice: Hati-hati
  rationale: Imperatif nifal dengan datif refleksif menyampaikan peringatan; 'Hati-hati' merupakan ungkapan Indonesia modern yang lugas.
- source_word: פֶּן
  choice: jangan
  rationale: Partikel ini memperkenalkan tindakan yang diperingatkan agar tidak dilakukan; konstruksi imperatif 'jangan' paling alami dalam bahasa Indonesia.
- source_word: תָּשִׁיב
  choice: kaubawa ... kembali
  rationale: Bentuk hifil dari שוב bersifat kausatif, yakni menyebabkan seseorang kembali. 'Membawa kembali' mempertahankan unsur kausatif dan cocok dengan konteks perjalanan.
- source_word: אֶת־בְּנִי
  choice: anakku
  rationale: Penanda objek langsung diikuti nomina dengan sufiks orang pertama tunggal berarti 'anakku'.
- source_word: שָׁמָּה
  choice: ke sana
  rationale: Adverbia berarah menunjukkan tujuan gerak, sehingga 'ke sana' lebih eksplisit mempertahankan arah daripada sekadar 'di sana'.
