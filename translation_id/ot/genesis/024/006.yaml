  text: Abraham berkata kepadanya, “Hati-hati, jangan kaubawa anakku kembali ke sana.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “jangan kaukembalikan anakku ke sana.” Kata kerja Ibraninya berbentuk kausatif: “menyebabkan kembali.”'
