id: GEN.24.12
reference: Genesis 24:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: id
  text: Lalu ia berkata, “Ya Yahweh, Allah tuanku Abraham, mohon berilah aku keberhasilan hari ini[a], dan tunjukkanlah kasih setia kepada tuanku Abraham[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mohon buatlah hal itu terjadi di hadapanku hari ini.” Kata kerja Ibraninya meminta Allah mengatur terjadinya perjumpaan yang diharapkan.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani ḥesed, yang juga dapat berarti kebaikan yang penuh kesetiaan atau kesetiaan dalam ikatan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dinyatakan secara langsung dalam teks Ibrani; bentuk “Yahweh” mempertahankan nama tersebut dalam bahasa Indonesia.
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: Allah tuanku Abraham
  rationale: Rangkaian konstruksi ini berarti “Allah dari tuanku Abraham”; susunan Indonesia “Allah tuanku Abraham” alami dan sesuai dengan hubungan hamba terhadap Abraham.
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: mohon berilah aku keberhasilan hari ini
  rationale: Imperatif kausatif הַקְרֵה meminta Allah mengatur terjadinya perjumpaan yang diharapkan. Terjemahan ini menyampaikan maksud kontekstual secara wajar, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: וַעֲשֵׂה חֶסֶד
  choice: dan tunjukkanlah kasih setia
  rationale: Ungkapan עשה חֶסֶד berarti memperlihatkan atau melakukan kebaikan yang penuh kesetiaan; “kasih setia” mempertahankan cakupan loyalitas dan kemurahan dari חֶסֶד.
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: kepada tuanku Abraham
  rationale: Walaupun עִם secara dasar berarti “dengan”, dalam idiom Indonesia “menunjukkan kasih setia kepada” menyampaikan relasi yang dimaksud dengan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara eksplisit. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Nuansa חֶסֶד dalam permohonan bagi Abraham
  choice: kasih setia
  alternative: kebaikan; kemurahan; kesetiaan pada perjanjian
  rationale: “Kasih setia” mempertahankan unsur kasih, kemurahan, dan loyalitas tanpa mempersempit kata itu menjadi istilah teknis tertentu.
- issue: Makna permohonan הַקְרֵה dalam konteks pencarian istri bagi Ishak
  choice: berilah aku keberhasilan
  alternative: buatlah hal itu terjadi di hadapanku; pertemukanlah aku dengan orang yang tepat
  rationale: Pilihan utama menyampaikan tujuan permohonan tanpa menambahkan objek yang tidak dinyatakan dalam bahasa Ibrani. Catatan kaki mempertahankan bentuk dan ambiguitas ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Seruan “Ya Yahweh” sesuai dengan bentuk doa, sedangkan “tuanku” mempertahankan sudut pandang seorang hamba tanpa terdengar berlebihan.
