  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: id
  text: Kemudian hamba itu mengeluarkan barang-barang dari perak, barang-barang dari emas, dan pakaian, lalu memberikannya kepada Ribka. Ia juga memberikan pemberian-pemberian berharga[a] kepada saudara laki-laki Ribka dan ibunya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pemberian-pemberian pilihan”; istilah Ibraninya dapat menunjuk pada pemberian yang sangat baik atau berharga, dan dalam beberapa konteks dapat berarti makanan lezat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: mengeluarkan
  rationale: Bentuk Hifil dari יצא menyatakan tindakan membuat keluar atau mengeluarkan; pilihan ini konkret dan alami dalam bahasa Indonesia.
- source_word: הָעֶבֶד
  choice: hamba itu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks narasi ini, 'hamba' wajar dan tetap mencerminkan kedudukannya dalam rumah tangga Abraham.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: barang-barang dari perak, barang-barang dari emas
  rationale: כְּלִי adalah istilah luas bagi benda, perkakas, atau wadah; 'barang-barang' mempertahankan keluasan maknanya tanpa menganggap semuanya sebagai wadah.
- source_word: וּבְגָדִים
  choice: dan pakaian
  rationale: בְּגָדִים berarti pakaian; bentuk kolektif bahasa Indonesia terdengar alami dan sesuai dengan konteks pemberian.
- source_word: וַיִּתֵּן לְרִבְקָה
  choice: lalu memberikannya kepada Ribka
  rationale: Akhiran '-nya' secara alami merujuk pada barang-barang dan pakaian yang baru disebutkan, sedangkan 'lalu' menyampaikan urutan naratif.
- source_word: וּמִגְדָּנֹת
  choice: pemberian-pemberian berharga
  rationale: מִגְדָּנוֹת menunjuk pada benda atau pemberian pilihan yang bernilai; terjemahan ini cocok dengan konteks hadiah perkawinan tanpa membatasi maknanya pada makanan lezat.
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: kepada saudara laki-laki Ribka dan ibunya
  rationale: '''Saudara laki-laki'' secara tepat menyatakan אָח, dan penyebutan nama Ribka menghindari ketaksaan rujukan pronomina dalam bahasa Indonesia.'
