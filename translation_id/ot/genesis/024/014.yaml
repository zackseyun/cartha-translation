id: GEN.24.14
reference: Genesis 24:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: id
  text: Kiranya perempuan muda yang kepadanya aku berkata, ‘Tolong turunkan tempayanmu supaya aku dapat minum,’ lalu ia menjawab, ‘Minumlah, dan unta-untamu juga akan kuberi minum,’ menjadi perempuan yang telah Kautetapkan bagi hamba-Mu Ishak.[a] Melalui perempuan itu[b] aku akan tahu bahwa Engkau telah menunjukkan kasih setia kepada tuanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi hamba-Mu, bagi Ishak.” Dalam pembacaan ini, “hamba-Mu” merujuk kepada orang yang sedang berdoa, sedangkan “bagi Ishak” merupakan frasa terpisah.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “Melalui dia,” dengan bentuk feminin yang merujuk kepada perempuan muda itu. Maksudnya dapat pula dipahami, “Dengan demikian” atau “Melalui tanda ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Kiranya ... menjadi
  rationale: Dalam konteks doa, bentuk ini menyatakan harapan atau permohonan. Susunan terpadu ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa volitif.
- source_word: הַנַּעֲרָ
  choice: perempuan muda
  rationale: Menunjuk seorang perempuan muda yang sudah cukup umur untuk menikah; pilihan ini modern dan tidak menyiratkan anak kecil.
- source_word: הַטִּי נָא כַדֵּךְ
  choice: Tolong turunkan tempayanmu
  rationale: הטה menyatakan tindakan memiringkan atau menurunkan wadah, sedangkan נָא memberi kesantunan pada permintaan. 'Tempayan' sesuai dengan bejana air dalam konteks ini.
- source_word: וְאֶשְׁתֶּה
  choice: supaya aku dapat minum
  rationale: Menyampaikan maksud permintaan secara wajar dalam bahasa Indonesia.
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: dan unta-untamu juga akan kuberi minum
  rationale: Bentuk kausatif שׁקה berarti memberi minum; ungkapan ini jelas dan alami.
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: menjadi perempuan yang telah Kautetapkan
  rationale: Dalam konteks tanda yang dimohonkan, הוכיח bermakna menentukan atau menetapkan orang yang dimaksud, bukan sekadar membuktikan.
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: bagi hamba-Mu Ishak
  rationale: 'Dua frasa berpreposisi לְ paling wajar dibaca secara aposisional: Ishak adalah ''hamba-Mu''. Karena susunannya juga memungkinkan pembacaan sebagai dua datif, alternatif itu dicatat dalam catatan kaki.'
- source_word: וּבָהּ אֵדַע
  choice: Melalui perempuan itu aku akan tahu
  rationale: Akhiran feminin tunggal pada בָהּ secara gramatikal merujuk kembali kepada perempuan muda itu sebagai sarana atau tanda untuk mengetahui.
- source_word: כִּי עָשִׂיתָ חֶסֶד
  choice: bahwa Engkau telah menunjukkan kasih setia
  rationale: חֶסֶד mencakup kebaikan yang teguh dan kesetiaan relasional. 'Kasih setia' mempertahankan bobot istilah itu tanpa mempersempitnya menjadi rumusan teknis.
- source_word: עִם אֲדֹנִי
  choice: kepada tuanku
  rationale: Walaupun עִם secara harfiah berarti 'dengan', kolokasi Indonesia yang alami ialah menunjukkan kasih setia 'kepada' seseorang.
theological_decisions:
- issue: Hubungan antara לְעַבְדְּךָ dan לְיִצְחָק
  choice: 'Dibaca secara aposisional: ''bagi hamba-Mu Ishak''.'
  alternative: 'Dibaca sebagai dua datif: ''bagi hamba-Mu, bagi Ishak'', dengan ''hamba-Mu'' merujuk kepada orang yang sedang berdoa.'
  rationale: Tanpa tanda baca dalam teks Ibrani, kedua analisis sintaksis mungkin. Pembacaan aposisional lebih langsung dan lazim, tetapi ambiguitas asli dipertahankan melalui catatan kaki.
- issue: Rujukan וּבָהּ
  choice: 'Merujuk kepada perempuan muda itu: ''Melalui perempuan itu''.'
  alternative: '''Dengan demikian'' atau ''melalui tanda ini'', dengan rujukan kepada seluruh kejadian.'
  rationale: Akhiran feminin paling langsung merujuk kepada הַנַּעֲרָ, tetapi secara makna perempuan itu berfungsi sebagai tanda; kemungkinan rujukan yang lebih luas dicatat tanpa menghapus bentuk feminin teks sumber.
- issue: Makna חֶסֶד
  choice: kasih setia
  alternative: kebaikan; kemurahan; kesetiaan perjanjian
  rationale: '''Kasih setia'' menjaga unsur kasih, kemurahan, dan loyalitas relasional tanpa memaksakan pengertian teknis perjanjian.'
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada doa yang khidmat. Sapaan kepada Allah ditulis dengan kapital pada pronomina terikat ('Kautetapkan', 'hamba-Mu', 'Engkau'), sedangkan 'tuanku' merujuk kepada Abraham. Kalimat panjang dipertahankan karena mencerminkan struktur permohonan dan tanda dalam teks Ibrani, tetapi dirangkai secara alami.
