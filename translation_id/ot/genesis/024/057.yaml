lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. 'Lalu' wajar dalam narasi Indonesia dan tidak menambahkan hubungan sebab-akibat.
- source_word: נִקְרָא
  choice: Mari kita panggil
  rationale: Bentuk kohortatif jamak menyatakan usulan atau ajakan bersama; 'mari kita panggil' menyampaikan daya volitifnya secara alami.
- source_word: לַנַּעֲרָ
  choice: perempuan muda itu
  rationale: נַעֲרָה menunjuk perempuan muda, dalam konteks ini Ribka yang telah cukup umur untuk menikah. Pilihan ini modern dan tidak menyiratkan anak kecil.
- source_word: וְנִשְׁאֲלָה
  choice: dan tanyakan
  rationale: Kohortatif jamak kedua meneruskan usulan. Dalam bahasa Indonesia, daya ajakan dari 'mari kita' tetap menaungi verba kedua.
- source_word: אֶת־פִּיהָ
  choice: langsung kepadanya
  rationale: Secara harfiah 'mulutnya'; idiom ini menekankan bahwa jawaban harus didengar dari Ribka sendiri. 'Tanyakan langsung kepadanya' menyampaikan makna tersebut secara jelas dan alami tanpa menerjemahkan idiom secara kaku.
