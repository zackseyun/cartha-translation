  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: id
  text: Lalu mereka berkata, “Mari kita panggil perempuan muda itu dan bertanya kepadanya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bertanya kepada mulutnya,” yaitu mendengar jawabannya langsung dari dirinya sendiri.
