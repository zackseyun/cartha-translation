  source_fidelity: 'Teks Ibrani menyatakan usulan kohortatif: memanggil הַנַּעֲרָה lalu meminta jawaban dari mulutnya sendiri (אֶת־פִּיהָ). Terjemahan utama menyampaikan urutan dan maksud ini, tetapi bentuk ''tanyakan langsung kepadanya'' kurang lengkap secara sintaksis karena verba ''menanyakan'' lazimnya memerlukan objek yang ditanyakan. Menggunakan ''bertanya kepadanya'' tetap setia pada verba שאל dan membiarkan penekanan idiomatik ''mulutnya'' dijelaskan dalam catatan kaki.'
