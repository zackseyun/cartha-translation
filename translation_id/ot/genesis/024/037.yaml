  source_fidelity: 'Makna pokok draft setia pada Ibrani: sang tuan menempatkan pelayan di bawah sumpah dan melarangnya mengambil istri bagi anaknya dari putri-putri orang Kanaan di tanah yang sedang didiami Abraham. Klausa relatif tunggal dipertahankan secara tepat sebagai bentuk kolektif.'
  naturalness: Beberapa pilihan dapat dibuat lebih baku dan lancar dalam bahasa Indonesia modern. “Mengambil seorang istri bagi anakku” terdengar kurang idiomatis; “mengambil istri untuk anakku” lebih alami dalam konteks perkawinan. “Dengan berkata” juga lebih jelas daripada “katanya” setelah konstruksi “menyuruh aku bersumpah.”
  terminology: “Tuanku” tepat bagi אֲדֹנִי dalam konteks pelayan kepada majikan manusia. “Istri,” “anakku,” dan “putri-putri orang Kanaan” menyampaikan istilah sumber dengan jelas. “Tanahnya” lebih dekat dengan אֶרֶץ daripada “negerinya,” tanpa mengubah acuan kolektifnya.
  issues:
  - severity: low
    issue: Kolokasi “mengambil seorang istri bagi anakku” kurang alami.
    rationale: Dalam bahasa Indonesia baku, “mengambil istri untuk anakku” menyatakan tindakan mencarikan/menikahkan istri dengan lebih idiomatis, sambil tetap mempertahankan makna perkawinan dari אִשָּׁה dan relasi tujuan לִבְנִי.
  - severity: low
    issue: Pengantar kutipan “katanya” agak kurang jelas secara sintaksis.
    rationale: “Dengan berkata” secara langsung menautkan perkataan berikut kepada tindakan menyuruh bersumpah dan sesuai dengan fungsi לֵאמֹר.
  - severity: low
