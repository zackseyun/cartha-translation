revisions:
- from: Tuanku menyuruh aku bersumpah, katanya, ‘Jangan mengambil seorang istri bagi anakku dari antara anak-anak perempuan orang Kanaan, yang negerinya kutinggali.[a]’
  to: Tuanku telah menyuruh aku bersumpah dengan berkata, ‘Janganlah engkau mengambil istri untuk anakku dari antara putri-putri orang Kanaan, yang tanahnya kutinggali.[a]’
  rationale: Revisi ini mempertahankan seluruh unsur makna teks Ibrani, termasuk larangan langsung, tujuan “untuk anakku,” dan klausa “di tanahnya.” Perubahan hanya meningkatkan kelancaran bahasa Indonesia baku dan memperjelas fungsi pengantar ujaran. Catatan kaki telah disesuaikan agar alternatif idiomatisnya benar-benar merujuk kepada orang Kanaan secara kolektif.
