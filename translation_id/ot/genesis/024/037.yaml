base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: id
  text: Tuanku telah menyuruh aku bersumpah dengan berkata, ‘Janganlah engkau mengambil istri untuk anakku dari antara putri-putri orang Kanaan, yang tanahnya kutinggali.[a]’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih idiomatis, “yang di antara mereka aku tinggal.” Secara harfiah, teks Ibrani berbunyi, “orang Kanaan, yang tanahnya aku tinggali,” dengan bentuk tunggal yang bermakna kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: menyuruh aku bersumpah
  rationale: Bentuk Hifil dari שׁבע berarti menyebabkan seseorang bersumpah atau mengikatnya dengan sumpah. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya pengikatan sumpah.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Dalam konteks ini, pelayan Abraham sedang merujuk kepada atasannya yang manusiawi, bukan kepada Allah. 'Tuanku' menyampaikan hubungan sosial tersebut secara jelas dan bermartabat.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan ucapan langsung dengan bentuk naratif Indonesia yang alami.
- source_word: לֹא תִקַּח
  choice: Jangan mengambil
  rationale: Bentuk imperfek orang kedua tunggal dalam konteks amanat bersumpah memiliki daya larangan. 'Jangan mengambil' mempertahankan larangan langsung tanpa menambahkan modalitas yang tidak tersurat.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Dalam konstruksi mengambil untuk perkawinan, אִשָּׁה berarti istri, bukan sekadar perempuan.
- source_word: לִבְנִי
  choice: bagi anakku
  rationale: Mengikuti teks Ibrani yang hanya menyebut 'anakku' tanpa menambahkan nama Ishak dari konteks.
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: dari antara anak-anak perempuan orang Kanaan
  rationale: Mempertahankan ungkapan kekerabatan dan etnis dalam bahasa Ibrani. Bentuk tunggal kolektif 'orang Kanaan' tetap dapat dipahami secara kolektif dalam bahasa Indonesia.
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: yang negerinya kutinggali
  rationale: Mempertahankan fokus harfiah pada negeri milik orang Kanaan kolektif, sekaligus menghasilkan susunan Indonesia yang ringkas. Catatan kaki menjelaskan kemungkinan ungkapan yang lebih idiomatis.
- source_word: יֹשֵׁב
  choice: kutinggali
  rationale: Partisip ini menyatakan keadaan menetap yang sedang berlangsung; verba 'tinggal' menyampaikan makna tersebut secara wajar dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Tuanku' dipilih untuk relasi pelayan dengan majikan; 'anak-anak perempuan orang Kanaan' mempertahankan bentuk ungkapan sumber, sedangkan catatan kaki menjelaskan bentuk tunggal kolektif dan alternatif idiomatis.
