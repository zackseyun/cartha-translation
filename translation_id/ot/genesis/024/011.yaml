  terminology: Istilah “unta-unta,” “sumur,” “petang,” dan “menimba air” tepat serta mudah dipahami dalam Bahasa Indonesia modern. Catatan kaki secara benar menjelaskan bahwa bentuk Ibrani feminin jamak itu secara khusus merujuk kepada perempuan.
