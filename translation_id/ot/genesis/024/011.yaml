  text: וַ/יַּבְרֵ֧ךְ הַ/גְּמַלִּ֛ים מִ/ח֥וּץ לָ/עִ֖יר אֶל בְּאֵ֣ר הַ/מָּ֑יִם לְ/עֵ֣ת עֶ֔רֶב לְ/עֵ֖ת צֵ֥את הַ/שֹּׁאֲבֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: id
  text: Ia menyuruh unta-unta itu berlutut di luar kota, di dekat sumur, pada waktu petang, saat para perempuan keluar untuk menimba air.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “saat para perempuan penimba air keluar.” Bentuk kata Ibraninya adalah feminin jamak, sehingga secara khusus menunjuk kepada perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְרֵךְ
  choice: Ia menyuruh ... berlutut
  rationale: Bentuk Hifil dari ברך menyatakan tindakan kausatif. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan konkret terhadap unta-unta.
- source_word: הַגְּמַלִּים
  choice: unta-unta itu
  rationale: Nomina jamak dengan kata sandang ini merujuk kepada unta-unta rombongan yang telah disebut dalam konteks sebelumnya.
- source_word: מִחוּץ לָעִיר
  choice: di luar kota
  rationale: Menerjemahkan lokasi secara langsung; עִיר dapat berarti kota atau permukiman, dan 'kota' merupakan padanan standar dalam konteks ini.
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: di dekat sumur
  rationale: אֶל secara harfiah menunjukkan arah menuju, tetapi sesudah unta-unta dibuat berlutut frasa ini menyatakan lokasi hasil gerakan. 'Di dekat sumur' alami dalam bahasa Indonesia; unsur air tidak perlu diulang karena sudah terkandung dalam kata 'sumur'.
- source_word: לְעֵת עֶרֶב
  choice: pada waktu petang
  rationale: Mempertahankan penanda waktu eksplisit dan menggunakan ungkapan Indonesia yang wajar serta bermartabat.
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: saat para perempuan keluar untuk menimba air
  rationale: Partisip הַשֹּׁאֲבֹת berbentuk feminin jamak sehingga para pelakunya dinyatakan sebagai perempuan. Terjemahan ini menyampaikan fungsi mereka secara alami tanpa ungkapan kaku seperti 'para penimba perempuan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Pengulangan dua frasa waktu Ibrani dipertahankan secara ringan melalui 'pada waktu petang, saat ...', sedangkan 'sumur air' disederhanakan menjadi 'sumur' agar alami dalam bahasa Indonesia.
