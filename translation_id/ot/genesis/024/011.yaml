  source_fidelity: 'Terjemahan ini setia kepada unsur-unsur utama teks Ibrani: bentuk kausatif וַיַּבְרֵךְ diterjemahkan secara tepat dengan “menyuruh ... berlutut”; הַגְּמַלִּים ditandai sebagai unta-unta yang telah dikenal dalam konteks; lokasi berada di luar kota dekat sumur; dan kedua penanda waktu tersampaikan. “Para perempuan” dengan tepat mempertahankan feminin jamak pada הַשֹּׁאֲבֹת, tanpa menambahkan rincian yang tidak ada dalam teks.'
