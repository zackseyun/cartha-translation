base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/064.yaml
  text: Rebekah lifted up her eyes and saw Isaac[a], and she got down from the camel.
translation:
  language: id
  text: Ribka mengangkat pandangannya dan melihat Ishak, lalu ia turun dari unta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “lalu ia jatuh dari atas unta.” Di sini kata Ibrani yang berarti “jatuh” kemungkinan digunakan sebagai ungkapan untuk turun dari tunggangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשָּׂא רִבְקָה אֶת־עֵינֶיהָ
  choice: Ribka mengangkat pandangannya
  rationale: Ungkapan Ibrani secara harfiah berarti “mengangkat matanya.” “Mengangkat pandangannya” mempertahankan citra dan gaya naratifnya dalam bahasa Indonesia yang alami.
- source_word: וַתֵּרֶא
  choice: melihat
  rationale: Kata ראה di sini menyatakan persepsi visual biasa; “melihat” merupakan padanan langsung dan wajar dalam urutan narasi.
- source_word: אֶת־יִצְחָק
  choice: Ishak
  rationale: Nama pribadi ini mengikuti bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: lalu ia turun dari unta
  rationale: Walaupun נפל pada dasarnya berarti “jatuh,” dalam konteks ini frasa tersebut kemungkinan besar dipakai secara idiomatis untuk tindakan turun dari tunggangan. “Turun dari unta” menyampaikan maksud yang mungkin tanpa memberi kesan bahwa Ribka mengalami kecelakaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “mengangkat pandangannya” menjaga warna idiom Ibrani tanpa terdengar kaku, sedangkan “turun dari unta” menyampaikan makna kontekstual yang paling mungkin; arti harfiahnya dipertahankan dalam catatan kaki.
