translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur dua klausa dipertahankan, tetapi formula penamaan dibuat lebih lancar. Tidak diperlukan catatan kaki karena pilihan “mata air” cukup tepat dan susunan tempat dapat dinyatakan secara alami tanpa menghilangkan unsur sumber.
