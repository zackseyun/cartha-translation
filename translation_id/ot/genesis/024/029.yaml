  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: id
  text: Ribka mempunyai seorang saudara laki-laki, dan namanya Laban. Laban berlari ke luar ke mata air untuk menemui orang itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְרִבְקָה אָח
  choice: Ribka mempunyai seorang saudara laki-laki
  rationale: Konstruksi לְ yang menyatakan kepunyaan diterjemahkan secara alami dengan “mempunyai”; אָח di sini berarti saudara laki-laki.
- source_word: וּשְׁמוֹ לָבָן
  choice: bernama Laban
  rationale: Formula harfiah “dan namanya Laban” dipadatkan menjadi ungkapan Indonesia yang alami tanpa mengurangi informasi.
- source_word: וַיָּרָץ לָבָן
  choice: Laban berlari
  rationale: רוץ secara langsung berarti berlari; nama subjek dipertahankan sebagaimana dalam teks Ibrani.
- source_word: אֶל־הָאִישׁ
  choice: menemui orang itu
  rationale: אֶל menunjukkan gerak menuju seseorang. “Orang itu” mempertahankan sebutan umum הָאִישׁ dan tidak menggantinya dengan identitas yang hanya diketahui dari konteks.
- source_word: הַחוּצָה
  choice: ke luar
  rationale: Bentuk berakhiran direktif menyatakan gerak ke arah luar.
- source_word: אֶל־הָעָיִן
  choice: di dekat mata air
  rationale: עַיִן menunjuk pada mata air, bukan terutama sumur. Dalam rangkaian gerak menuju orang yang berada di sana, bahasa Indonesia alami menyatakan lokasi orang itu dengan “di dekat mata air”.
