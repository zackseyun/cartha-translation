  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: id
  text: Abraham sudah tua, lanjut usia, dan Yahweh telah memberkati Abraham dalam segala hal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “telah masuk ke dalam hari-hari,” sebuah ungkapan Ibrani yang berarti berusia sangat lanjut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Waw membuka satuan narasi baru. Dalam bahasa Indonesia, hubungan dengan konteks dapat dibiarkan tersirat tanpa menambahkan kata temporal seperti “sekarang” yang tidak terdapat secara eksplisit dalam teks sumber.
- source_word: זָקֵן
  choice: sudah tua
  rationale: Ungkapan ini menyatakan usia tua Abraham secara langsung; “sudah tua” alami dalam narasi bahasa Indonesia dan menandakan keadaan yang telah dicapainya.
- source_word: בָּא בַּ/יָּמִים
  choice: lanjut usia
  rationale: Idiom Ibrani yang secara harfiah berarti “telah masuk ke dalam hari-hari” menyatakan usia yang sangat lanjut. “Lanjut usia” menyampaikan maknanya dengan jelas tanpa mempertahankan bentuk idiom yang janggal.
- source_word: וַֽ/יהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang hadir langsung dalam teks.
- source_word: בֵּרַךְ
  choice: telah memberkati
  rationale: Bentuk perfektif merangkum berkat yang telah diterima Abraham sampai saat itu dan menjadi latar bagi kisah berikutnya.
- source_word: בַּ/כֹּל
  choice: dalam segala hal
  rationale: Frasa ini menyatakan cakupan berkat yang menyeluruh tanpa membatasinya hanya pada harta benda.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut secara langsung, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Cakupan berkat dalam בַּכֹּל
  choice: dalam segala hal
  alternative: dengan segala sesuatu
  rationale: Pilihan ini mempertahankan keluasan pernyataan dan tidak menyempitkan berkat menjadi kepemilikan materi saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua agar hubungan antargagasan jelas dan alami; tidak ditambahkan penanda wacana temporal yang tidak eksplisit dalam bahasa Ibrani.
