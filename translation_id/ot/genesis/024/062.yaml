source:
  edition: WLC
  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: id
  text: Ishak telah datang dari Beer-Lahai-Roi[a][b], dan ia tinggal di Tanah Negeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi adalah nama tempat yang sebelumnya dikaitkan dengan Hagar (lihat Kejadian 16:14).
    reason: cross_reference
  - marker: b
    text: Atau, “Ishak datang dari Beer-Lahai-Roi.” Susunan bahasa Ibrani juga dapat diterjemahkan dengan bentuk lampau sederhana, bukan “telah datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: telah datang
  rationale: Bentuk qal perfektif menyatakan gerak yang sudah selesai; dalam alur ini, “telah datang” secara alami memberi latar bagi adegan berikutnya, meskipun bentuk lampau sederhana juga mungkin.
- source_word: מִבּוֹא
  choice: dari
  rationale: Gabungan מִן dengan infinitif בוא merupakan ungkapan padat yang paling wajar dipahami sebagai penanda asal gerak.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan; tanda hubung mempertahankan bentuk nama majemuk.
- source_word: יוֹשֵׁב
  choice: tinggal
  rationale: Partisipel ini menyatakan keadaan atau kediaman yang sedang berlangsung. Dalam bahasa Indonesia, “tinggal” sudah alami dan mencakup nuansa duratif tersebut.
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: di Tanah Negeb
  rationale: Terjemahan ini mempertahankan unsur eksplisit אֶרֶץ dan memperlakukan Negeb sebagai nama wilayah geografis.
- source_word: וְהוּא
  choice: dan ia
  rationale: Pronomina yang eksplisit dan koordinasi Ibrani dipertahankan tanpa menambahkan penanda wacana yang tidak terdapat dalam sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Ia” dipakai untuk kesinambungan gaya Alkitab, sedangkan “Tanah Negeb” mempertahankan bentuk geografis sumber. Semua penanda catatan kaki dicantumkan dalam teks utama.
