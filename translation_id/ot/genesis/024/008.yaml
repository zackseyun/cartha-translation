base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: id
  text: Namun, jika perempuan itu tidak bersedia pergi bersamamu[a], engkau akan bebas dari sumpahku ini[b]. Hanya saja, jangan kaubawa anakku kembali ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pergi mengikutimu” atau “pergi di belakangmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau akan dilepaskan dari sumpahku ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Dalam konteks ini, penghubung tersebut memperkenalkan syarat yang berlawanan dengan harapan dalam perintah sebelumnya; 'Namun, jika' alami dalam bahasa Indonesia.
- source_word: לֹא תֹאבֶה
  choice: tidak bersedia
  rationale: Menjaga nuansa kemauan atau persetujuan tanpa memperkerasnya menjadi penolakan yang menantang.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Ia masih calon pengantin yang belum disebutkan identitasnya, sehingga 'istri' terlalu dini.
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: pergi bersamamu
  rationale: Secara harfiah berarti 'pergi mengikutimu/pergi di belakangmu', tetapi dalam konteks perjalanan, 'pergi bersamamu' menyampaikan maksudnya secara alami sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: וְנִקִּיתָ
  choice: engkau akan bebas
  rationale: Bentuk Nifal menyatakan terbebas atau dilepaskan dari kewajiban yang ditimbulkan oleh sumpah.
- source_word: מִשְּׁבֻעָתִי זֹאת
  choice: dari sumpahmu kepadaku ini
  rationale: Dalam konteks, sufiks orang pertama menunjukkan sumpah yang diminta Abraham dari hambanya. Ungkapan Indonesia ini memperjelas relasi tersebut tanpa mengubah kewajiban sumpah.
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai batas tegas atas pembebasan dari sumpah dan terdengar alami sebelum larangan.
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: jangan kaubawa anakku kembali ke sana
  rationale: Bentuk Hifil dari שוב bersifat kausatif, yaitu membawa atau menyebabkan kembali; larangan langsung cocok dengan konteks ujaran.
