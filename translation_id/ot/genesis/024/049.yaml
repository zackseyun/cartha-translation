  text: וְ֠/עַתָּה אִם יֶשְׁ/כֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽ/אֱמֶ֛ת אֶת אֲדֹנִ֖/י הַגִּ֣ידוּ לִ֑/י וְ/אִם לֹ֕א הַגִּ֣ידוּ לִ֔/י וְ/אֶפְנֶ֥ה עַל יָמִ֖ין א֥וֹ עַל שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: id
  text: Sekarang, jika kalian hendak menunjukkan kasih setia dan kesetiaan kepada tuanku[a], katakanlah kepadaku. Namun jika tidak, katakanlah kepadaku, supaya aku dapat berpaling ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kasih yang teguh dan kesetiaan.” Pasangan kata Ibrani ini sering mengandung makna kasih yang loyal dan dapat diandalkan dalam suatu ikatan relasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai kesimpulan praktis yang segera dari perkataan hamba itu; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: jika kalian hendak menunjukkan
  rationale: Ungkapan Ibrani yang memakai partisip menyatakan kesediaan atau tindakan yang dimaksudkan dalam keputusan yang sedang diminta. 'Hendak' mempertahankan nuansa volisional dan berorientasi ke depan.
- source_word: חֶסֶד וֶאֱמֶת
  choice: kasih setia dan kesetiaan
  rationale: Pasangan kata ini menunjuk pada kebaikan relasional yang loyal serta sikap yang dapat dipercaya. Pilihan ini mempertahankan kedua unsur tanpa membatasi maknanya pada rumusan teknis tertentu.
- source_word: אֶת אֲדֹנִי
  choice: kepada tuanku
  rationale: Secara idiomatis menyatakan pihak yang menerima tindakan kasih setia dan kesetiaan.
- source_word: הַגִּידוּ לִי
  choice: katakanlah kepadaku
  rationale: Imperatif jamak ini meminta jawaban langsung dari keluarga Ribka; 'katakanlah' sesuai dengan tutur yang bermartabat.
- source_word: וְאִם לֹא
  choice: Namun jika tidak
  rationale: Menyampaikan pertentangan yang tegas antara penerimaan dan penolakan permintaan.
- source_word: וְאֶפְנֶה
  choice: supaya aku dapat berpaling
  rationale: Mencerminkan bentuk kohortatif yang mengungkapkan tindakan lanjutan yang dimaksudkan sebagai akibat dari jawaban mereka.
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: ke kanan atau ke kiri
  rationale: Mempertahankan gambaran arah dalam teks Ibrani, yang secara kontekstual berarti mengambil jalan atau pilihan lain.
