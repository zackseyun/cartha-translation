  yaml_path: translation/ot/genesis/024/066.yaml
  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: id
  text: Lalu pelayan itu[b] menceritakan kepada Ishak segala sesuatu[a] yang telah dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala perkara” atau “semua hal”; kata Ibrani דְּבָרִים dapat merujuk pada perkataan, perkara, atau kejadian, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “budak itu”; kata Ibrani עֶבֶד dapat berarti “pelayan” atau “budak”, tetapi dalam kisah ini perannya lebih ditonjolkan daripada status keterikatannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: menceritakan
  rationale: Bentuk Piel dari ספר dalam konteks ini menyatakan tindakan mengisahkan atau melaporkan rangkaian kejadian. “Menceritakan” alami dalam bahasa Indonesia dan cocok dengan laporan tentang seluruh perjalanan tugasnya.
- source_word: הָעֶבֶד
  choice: pelayan itu
  rationale: עֶבֶד dapat berarti “pelayan” atau “budak”. Dalam konteks ini perannya sebagai utusan rumah tangga Abraham lebih ditonjolkan daripada status hukumnya, sehingga “pelayan” paling sesuai.
- source_word: לְיִצְחָק
  choice: kepada Ishak
  rationale: 'Preposisi לְ menandai penerima laporan, sedangkan nama יִצְחָק ditulis menurut bentuk baku bahasa Indonesia: “Ishak”.'
- source_word: אֵת כָּל הַדְּבָרִים
  choice: segala sesuatu
  rationale: דְּבָרִים dapat menunjuk pada perkataan, perkara, atau kejadian. Di sini cakupannya adalah seluruh hal yang berkaitan dengan tugas sang pelayan; “segala sesuatu” menyampaikan keluasan itu secara alami tanpa membatasinya hanya pada kata-kata.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dilakukannya
  rationale: Klausa relatif ini merujuk pada tindakan-tindakan yang sudah selesai sebelum dilaporkan kepada Ishak. “Telah dilakukannya” menjaga urutan waktu sekaligus mempertahankan rujukan pronomina Ibrani yang secara gramatikal dapat dipahami sebagai sang pelayan.
theological_decisions:
- issue: Rujukan subjek pada אֲשֶׁר עָשָׂה
  choice: diterjemahkan dengan pronomina terikat “-nya” tanpa menyebut ulang pelayan
  alternative: “yang telah dilakukan pelayan itu”
  rationale: Bahasa Ibrani hanya memakai bentuk verba orang ketiga tunggal maskulin. Konteks kuat menunjuk kepada pelayan, tetapi terjemahan tidak perlu menambahkan nomina yang tidak diulang dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Lalu” mempertahankan kesinambungan cerita; “menceritakan” lebih wajar daripada bentuk yang sangat formal seperti “menuturkan”. Penanda catatan kaki ditempatkan setelah klausa yang memuat kedua istilah terkait agar teks utama tetap lancar.
