  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: id
  text: Lalu hamba itu menaruh tangannya di bawah paha Abraham, tuannya, dan bersumpah kepadanya mengenai hal itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Di bawah paha” menerjemahkan secara harfiah ungkapan Ibrani untuk suatu gerakan dalam pengucapan sumpah yang khidmat. Sebagian orang memahaminya sebagai lambang yang berkaitan dengan pinggang atau keturunan perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: hamba itu
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini perannya sebagai anggota rumah tangga yang berada di bawah wewenang Abraham lebih ditonjolkan; “hamba” menyampaikan hierarki sosial tanpa menjadikan status perbudakannya sebagai fokus.
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: menaruh tangannya
  rationale: שׂוּם berarti menaruh, menempatkan, atau meletakkan. “Menaruh tangannya” alami dalam bahasa Indonesia dan tetap dekat dengan tindakan konkret dalam teks.
- source_word: תַּחַת יֶרֶךְ
  choice: di bawah paha
  rationale: יָרֵךְ secara konkret berarti “paha”. Terjemahan literal mempertahankan ungkapan Ibrani dan tidak memasukkan tafsiran tentang makna simbolis gerakan itu ke dalam teks utama.
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: Abraham, tuannya
  rationale: אֲדוֹן dalam hubungan sosial antarmanusia berarti tuan atau majikan. “Tuannya” menyatakan wewenang Abraham atas hamba tersebut dan menghindari kesan sebagai gelar ilahi.
- source_word: וַיִּשָּׁבַע לוֹ
  choice: dan bersumpah kepadanya
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah atau mengangkat sumpah. “Bersumpah kepadanya” ringkas serta mempertahankan arah personal yang dinyatakan oleh לוֹ.
- source_word: עַל הַדָּבָר הַזֶּה
  choice: mengenai hal itu
  rationale: דָּבָר dapat berarti perkataan, hal, perkara, atau sesuatu. Di sini frasa tersebut menunjuk kepada tugas dan ketentuan yang baru saja disampaikan Abraham; “mengenai hal itu” jelas dan wajar dalam konteks.
theological_decisions:
- issue: Apakah gerakan sumpah diterjemahkan secara harfiah atau ditafsirkan menurut kemungkinan simbolismenya
  choice: Gerakan itu diterjemahkan secara harfiah sebagai “di bawah paha”, sedangkan kemungkinan makna simbolisnya dijelaskan dalam catatan kaki.
  alternative: Menerjemahkannya secara interpretatif sebagai gerakan yang berkaitan dengan pinggang, alat kelamin, atau keturunan perjanjian.
  rationale: Teks Ibrani menyebut tindakan fisiknya tanpa menjelaskan maknanya. Mempertahankan kata-kata konkret itu menjaga ambiguitas asli dan tidak menetapkan salah satu tafsiran simbolis sebagai makna pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan “Abraham, tuannya” memperjelas hubungan kepemilikan tanpa terasa kaku; penanda catatan kaki ditempatkan sesudah kalimat.
