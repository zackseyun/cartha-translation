base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/043.yaml
  text: Look[a], I am standing by the spring of water, and let it be that the young woman who comes out to draw, to whom I say[b], ‘Please let me drink a little water from your jar,’
translation:
  language: id
  text: “Lihatlah, aku berdiri di dekat mata air. Kiranya perempuan muda[a] yang keluar untuk menimba, dan yang kepadanya aku berkata, ‘Tolong, beri aku minum sedikit air dari buyungmu,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gadis”. Kata Ibrani עַלְמָה menunjuk pada perempuan muda yang telah mencapai usia untuk menikah dan tidak dengan sendirinya secara tegas berarti “perawan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel penunjuk ini menghidupkan adegan dan mengarahkan perhatian; ‘Lihatlah’ alami serta bermartabat dalam bahasa Indonesia.
- source_word: אָנֹכִי נִצָּב
  choice: aku berdiri
  rationale: Pronomina mandiri dan bentuk partisip menyatakan posisi yang sedang berlangsung; bahasa Indonesia tidak memerlukan penegasan tambahan seperti ‘aku sendiri’.
- source_word: עַל עֵין הַמָּיִם
  choice: di dekat mata air
  rationale: עֵין menunjuk pada sumber atau mata air, bukan secara khusus sumur; ‘di dekat’ menyampaikan posisi di sisi sumber air secara alami.
- source_word: וְהָיָה
  choice: Kiranya
  rationale: Dalam konteks permohonan akan suatu tanda, bentuk ini memperkenalkan keadaan yang diharapkan. ‘Kiranya’ mempertahankan nuansa permohonan tanpa menjadikannya kepastian mutlak.
- source_word: הָעַלְמָה
  choice: gadis
  rationale: עַלְמָה berarti perempuan muda yang telah mencapai usia untuk menikah dan tidak dengan sendirinya menegaskan keperawanan. ‘Gadis’ paling ringkas dan wajar dalam konteks ini, dengan keterangannya diberikan dalam catatan kaki.
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: yang keluar untuk menimba
  rationale: Partisip menggambarkan perempuan yang akan keluar untuk mengambil air; objek ‘air’ dapat dipahami jelas dari konteks mata air.
- source_word: וְאָמַרְתִּי אֵלֶיהָ
  choice: lalu aku berkata kepadanya
  rationale: Urutan tindakan Ibrani dipertahankan dengan penghubung ‘lalu’, yang alami dalam bahasa Indonesia.
- source_word: הַשְׁקִינִי נָא מְעַט מַיִם מִכַּדֵּךְ
  choice: Tolong beri aku sedikit air dari buyungmu untuk diminum
  rationale: Bentuk kausatif שׁקה berarti memberi seseorang minum. Susunan ini jelas dan alami, sementara נָא disampaikan sebagai permintaan sopan dengan ‘Tolong’ dan כַּד sebagai wadah air diterjemahkan ‘buyung’.
theological_decisions:
- issue: Makna עַלְמָה
  choice: gadis
  alternative: perempuan muda; perawan
  rationale: Kata Ibrani ini menunjukkan perempuan muda yang telah mencapai usia menikah, tetapi tidak secara leksikal mengharuskan arti ‘perawan’. Terjemahan utama tidak memasukkan penegasan teologis yang tidak dinyatakan langsung oleh kata tersebut; kemungkinan istilah lain dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif dan doa yang bermartabat. ‘Aku’ mengikuti tuturan langsung hamba Abraham kepada Allah. ‘Buyung’ dipilih sebagai istilah baku untuk wadah air dalam latar kuno. Ayat dibiarkan berakhir dengan koma karena struktur kalimat dan tanda yang dimohonkan berlanjut ke ayat berikutnya.
