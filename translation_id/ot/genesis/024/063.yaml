base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: id
  text: 'Menjelang petang, Ishak keluar ke padang untuk merenung.[a] Ia mengangkat pandangannya dan melihat: tampak unta-unta sedang datang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berjalan-jalan,” “berpikir,” “bercakap-cakap,” atau mungkin “berdoa” di padang. Kata kerja Ibrani ini jarang dipakai, dan nuansa tepatnya di sini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Qal wayyiqtol dari יצא menyatakan gerak ke luar dan melanjutkan urutan narasi secara alami.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Bentuk baku nama ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: לָשׂוּחַ
  choice: untuk merenung
  rationale: Kata kerja שׂוח jarang dipakai dan maknanya di sini diperdebatkan. 'Merenung' secara wajar menggambarkan kegiatan reflektif tanpa mempersempitnya secara pasti menjadi doa; ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: בַּשָּׂדֶה
  choice: ke padang
  rationale: שׂדה menunjuk pada padang atau kawasan terbuka. Dengan verba 'keluar', bahasa Indonesia alami memakai 'ke padang', sementara kegiatan itu dipahami berlangsung di sana.
- source_word: לִפְנוֹת עָרֶב
  choice: Menjelang petang
  rationale: Ungkapan ini menandai waktu ketika hari beralih menuju petang. Penempatan di awal kalimat menghasilkan susunan Indonesia yang alami tanpa mengubah cakupan temporalnya.
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ia mengangkat pandangannya
  rationale: Ungkapan ini mempertahankan citra tindakan mengarahkan mata atau pandangan, tetapi lebih idiomatis dalam bahasa Indonesia modern daripada 'mengangkat matanya'.
- source_word: וַיַּרְא
  choice: dan melihat
  rationale: ראה pada rangkaian ini menyatakan persepsi sesudah Ishak mengangkat pandangan.
- source_word: וְהִנֵּה
  choice: bahwa
  rationale: Partikel הִנֵּה menyoroti pemandangan yang tiba-tiba tampak. Dalam bahasa Indonesia modern, struktur 'melihat bahwa' menyampaikan penemuan itu secara alami, meskipun daya seru partikel tersebut menjadi lebih halus.
- source_word: גְמַלִּים בָּאִים
  choice: unta-unta sedang datang
  rationale: Partisipel בָּאִים menggambarkan rombongan unta yang sedang bergerak mendekat; aspek progresif dinyatakan dengan 'sedang'.
