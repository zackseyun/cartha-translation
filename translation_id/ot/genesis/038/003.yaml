  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: id
  text: Perempuan itu mengandung dan melahirkan seorang anak laki-laki, lalu Yehuda[a] menamainya Er.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata kerja “menamai” berbentuk maskulin tunggal; subjeknya paling mungkin Yehuda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: Perempuan itu mengandung
  rationale: Bentuk feminin tunggal dari הרה menyatakan bahwa istri Yehuda mengandung. Penyebutan “perempuan itu” alami dalam bahasa Indonesia dan menjaga subjek dari konteks sebelumnya.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: ילד dalam bentuk Qal berarti melahirkan, sedangkan בֵּן di sini adalah anak laki-laki/putra. Ungkapan ini jelas dan wajar dalam narasi Indonesia modern.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: lalu Yehuda menamainya
  rationale: Verba Ibrani berbentuk maskulin tunggal, berbeda dari dua verba feminin sebelumnya. Berdasarkan konteks, subjek tersirat yang paling alami ialah Yehuda. “Menamainya” menyampaikan idiom harfiah “memanggil namanya” secara alami.
- source_word: עֵר
  choice: Er
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Subjek וַיִּקְרָא (“lalu ia menamai”)
  choice: Subjek tersirat dinyatakan sebagai Yehuda.
  alternative: Membiarkan pronomina “ia”, memakai bentuk pasif “anak itu dinamai”, atau mengikuti sejumlah versi yang menjadikan sang ibu sebagai subjek.
  rationale: Verba tersebut secara gramatikal maskulin tunggal, sedangkan verba “mengandung” dan “melahirkan” feminin tunggal. Konteks paling wajar menunjuk kepada Yehuda. Penyebutan namanya menghindari ketidakjelasan pronomina Indonesia tanpa mengubah peralihan subjek dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan peralihan subjek yang ditandai oleh tata bahasa Ibrani.
