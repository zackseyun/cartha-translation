translation:
  language: id
  text: Ketika Yehuda melihat perempuan itu, ia menganggapnya seorang pelacur, karena perempuan itu telah menutupi wajahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: Ketika Yehuda melihat perempuan itu
  rationale: Bentuk naratif dengan waw-konsekutif menghubungkan tindakan melihat dengan penilaian berikutnya; “ketika” menyatakan hubungan waktu itu secara alami dalam bahasa Indonesia.
- source_word: וַיַּחְשְׁבֶהָ
  choice: ia menyangkanya
  rationale: Kata חשב di sini menyatakan dugaan atau penilaian Yehuda yang keliru mengenai identitas perempuan itu. “Menyangkanya” ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: לְזוֹנָה
  choice: seorang pelacur
  rationale: זֹנָה menunjuk kepada perempuan yang melakukan pelacuran. “Pelacur” merupakan padanan modern yang jelas tanpa nuansa arkais atau istilah sosiologis tambahan.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan bagi dugaan Yehuda, sehingga diterjemahkan secara kausal sebagai “karena”.
- source_word: כִסְּתָה פָּנֶיהָ
  choice: perempuan itu telah menutupi wajahnya
  rationale: Bentuk perfektif menyatakan keadaan yang sudah terjadi dan menjadi latar bagi kesimpulan Yehuda; “telah menutupi” mempertahankan urutan logis tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan “perempuan itu” menghindari rangkaian pronomina yang berpotensi kurang jelas, sedangkan “pelacur” dipilih sebagai istilah langsung dan tidak arkais.
