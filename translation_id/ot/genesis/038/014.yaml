base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: id
  text: Lalu ia menanggalkan pakaian jandanya, menutupi dirinya dengan selubung, menyelubungi diri, dan duduk di pintu masuk Enaim[a], yang terletak di jalan menuju Timna. Sebab ia melihat bahwa Syela sudah dewasa, tetapi ia belum diberikan kepada Syela sebagai istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di Petah-Enaim”; ungkapan Ibrani ini juga dapat dipahami secara harfiah sebagai “di pintu masuk dua mata air.”'
    reason: Bentuk Ibrani פֶתַח עֵינַיִם dapat dianalisis sebagai nama tempat atau sebagai frasa geografis, sehingga ambiguitasnya perlu dipertahankan.
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: pakaian kejandaannya
  rationale: Mempertahankan ungkapan konkret Ibrani tentang pakaian yang menandai statusnya sebagai janda.
- source_word: וַתְּכַס בַּצָּעִיף
  choice: menutupi dirinya dengan selubung
  rationale: צָעִיף menunjuk kain penutup atau selubung; terjemahan ini tidak menentukan secara berlebihan bagian tubuh mana yang ditutupi.
- source_word: וַתִּתְעַלָּף
  choice: membungkus dirinya
  rationale: Bentuk refleksif ini menyatakan bahwa Tamar menyelubungi atau membungkus dirinya; dipertahankan sebagai tindakan tersendiri sesudah memakai selubung.
- source_word: בְּפֶתַח עֵינַיִם
  choice: di pintu masuk Enaim
  rationale: Memahami עֵינַיִם sebagai nama tempat dan פֶּתַח sebagai pintu masuk; kemungkinan analisis lain dicatat dalam catatan kaki.
- source_word: גָדַל שֵׁלָה
  choice: Syela sudah dewasa
  rationale: Dalam konteks janji pernikahan, גָדַל berarti telah bertumbuh hingga cukup umur, bukan sekadar bertambah besar.
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: ia belum juga diberikan kepada Syela sebagai istri
  rationale: Mempertahankan bentuk pasif teks sumber dan mengulangi nama Syela demi kejelasan rujukan dalam bahasa Indonesia.
theological_decisions:
- issue: Alasan tindakan Tamar
  choice: Menyatakan hanya bahwa Syela sudah dewasa tetapi Tamar belum diberikan kepadanya sebagai istri.
  alternative: Menambahkan bahwa Yehuda telah mengingkari janji atau bahwa Tamar bermaksud menipu Yehuda.
  rationale: Teks ini menyampaikan fakta yang mendorong tindakan Tamar tanpa secara eksplisit memberikan penilaian moral atau menguraikan seluruh niatnya.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Urutan tindakan dalam bahasa Ibrani dipertahankan, termasuk dua tindakan yang berkaitan dengan selubung. Nama תִּמְנָה ditulis “Timna” dan שֵׁלָה ditulis “Syela” menurut bentuk yang wajar dalam bahasa Indonesia.
