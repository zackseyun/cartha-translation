  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: id
  text: Setelah waktu yang lama berlalu[a], anak perempuan Syua, istri Yehuda, meninggal. Setelah Yehuda terhibur[b], ia naik ke Timna menemui para pencukur dombanya, bersama Hira, sahabatnya, orang Adulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari-hari menjadi banyak”; dapat juga diterjemahkan “Setelah berhari-hari.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Ketika Yehuda telah terhibur.” Kata Ibrani di sini berarti ia mendapat penghiburan setelah berkabung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: Setelah waktu yang lama berlalu
  rationale: Ungkapan Ibrani secara harfiah berarti 'hari-hari menjadi banyak'. Terjemahan ini menyampaikan selang waktu yang panjang secara alami dalam bahasa Indonesia.
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Padanan baku dan bermartabat bagi kematian seseorang dalam narasi.
- source_word: בַּת שׁוּעַ
  choice: anak perempuan Syua
  rationale: Frasa Ibrani secara transparan menyatakan hubungan kekerabatan, bukan dengan pasti nama diri gabungan.
- source_word: אֵשֶׁת יְהוּדָה
  choice: istri Yehuda
  rationale: Bentuk milik yang alami dalam bahasa Indonesia dan tetap setia pada konstruksi Ibrani.
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: Setelah Yehuda terhibur
  rationale: Bentuk Nifal dari נחם di sini menunjuk pada penghiburan sesudah berkabung, bukan pertobatan atau penyesalan; 'setelah' memperjelas urutan narasi.
- source_word: וַיַּעַל
  choice: ia pergi
  rationale: Secara leksikal verba ini dapat berarti 'naik/pergi ke atas', tetapi dalam bahasa Indonesia 'pergi ke Timna' lebih alami; arah gerak tidak cukup jelas untuk mewajibkan 'naik'.
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: menemui para pencukur dombanya
  rationale: Konstruksi ini menunjuk kepada para pekerja yang mencukur kawanan domba milik Yehuda, bukan secara langsung menyatakan bahwa Yehuda sendiri pergi untuk mencukur.
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: bersama Hira, sahabatnya
  rationale: Mengungkapkan penyertaan Hira secara alami sambil mempertahankan sebutannya sebagai sahabat Yehuda.
- source_word: הָעֲדֻלָּמִי
  choice: orang Adulam
  rationale: Adjektiva gentilik menunjukkan bahwa Hira berasal dari atau berhubungan dengan Adulam.
- source_word: תִּמְנָתָה
  choice: ke Timna
  rationale: Akhiran arah pada nama tempat menyatakan gerak menuju Timna.
theological_decisions:
- issue: Makna וַיִּנָּחֶם setelah kematian istri Yehuda
  choice: Yehuda terhibur
  alternative: Yehuda menyesal / berubah pikiran
  rationale: Dalam konteks perkabungan, verba ini paling wajar berarti menerima penghiburan atau pulih dari duka, bukan bertobat atau menyesali tindakan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Struktur kalimat mempertahankan urutan peristiwa dan ambiguitas sumber tanpa menjadikannya kaku.
