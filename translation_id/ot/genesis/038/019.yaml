  yaml_path: translation/ot/genesis/038/019.yaml
  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: id
  text: Kemudian ia bangkit dan pergi. Ia melepaskan cadarnya, lalu mengenakan pakaian kejandaannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: ia bangkit
  rationale: Bentuk wayyiqtol dari קום melanjutkan urutan tindakan naratif; 'bangkit' alami dan tetap bernada luhur dalam bahasa Indonesia.
- source_word: וַתֵּלֶךְ
  choice: dan pergi
  rationale: הלך setelah 'bangkit' menyatakan keberangkatan dari tempat itu; konteks membuat tambahan 'dari situ' tidak diperlukan.
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: Ia melepaskan cadarnya
  rationale: '''Melepaskan'' secara idiomatis menyampaikan Hifil סור beserta מֵעָלֶיהָ, yaitu menanggalkan penutup yang dikenakannya, tanpa ungkapan Indonesia yang berlebihan.'
- source_word: צְעִיפָהּ
  choice: cadarnya
  rationale: צָעִיף menunjuk pada kain penutup atau selubung yang dikenakan Tamar sebagai penyamaran; 'cadar' mempertahankan kaitan dengan penutupan wajah dalam konteks.
- source_word: וַתִּלְבַּשׁ
  choice: lalu mengenakan kembali
  rationale: לבש berarti mengenakan pakaian. 'Kembali' tersirat oleh konteks bahwa Tamar sebelumnya menanggalkan pakaian kejandaannya (ayat 14) dan kini memakainya lagi; kata ini membuat urutan tindakan jelas dalam bahasa Indonesia.
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: pakaian kejandaannya
  rationale: Terjemahan ini mempertahankan bentuk abstrak אַלְמְנוּת ('kejandaan') dan menunjukkan pakaian yang menandai statusnya sebagai janda.
theological_decisions: []
