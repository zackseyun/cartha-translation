  register: Bahasa Indonesia baku, alami, dan bermartabat. Dua kalimat dipakai agar rangkaian tindakan mudah dibaca; pengulangan subjek mengikuti kejelasan narasi Indonesia. Tidak diperlukan catatan kaki karena unsur-unsur Ibrani dapat disampaikan tanpa kehilangan ambiguitas penting.
