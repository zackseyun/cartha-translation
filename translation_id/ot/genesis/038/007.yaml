source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: id
  text: Er, anak sulung Yehuda, jahat di mata Yahweh, lalu Yahweh membunuhnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Yahweh membuatnya mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: — (diungkapkan melalui predikat “jahat”)
  rationale: Bentuk naratif וַיְהִי mengantar keterangan tentang Er. Bahasa Indonesia tidak memerlukan kopula atau penanda waktu tambahan di sini; memulai langsung dengan subjek menghasilkan kalimat yang alami tanpa menambahkan kata seperti “sekarang” atau “kemudian” yang tidak eksplisit dalam sumber.
- source_word: עֵר
  choice: Er
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim.
- source_word: בְּכוֹר יְהוּדָה
  choice: anak sulung Yehuda
  rationale: Rangkaian konstruksi menyatakan hubungan keluarga dan urutan kelahiran; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: רַע
  choice: jahat
  rationale: Dalam penilaian ilahi ini, רַע menunjuk pada keburukan moral, bukan sekadar keadaan buruk atau kemalangan.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini mempertahankan metafora Ibrani yang juga wajar dalam bahasa Indonesia dan menyatakan penilaian dari sudut pandang Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיְמִתֵהוּ
  choice: lalu Yahweh membunuhnya
  rationale: Bentuk Hifil dari מות menyatakan bahwa Yahweh menyebabkan Er mati. “Membunuhnya” menyampaikan tindakan dan pelaku ilahi secara langsung serta alami; “lalu” membawa kemajuan naratif dari waw tanpa menambahkan penjelasan mengenai cara kematiannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Pelaku kematian Er
  choice: Yahweh membunuhnya
  alternative: Yahweh membuatnya mati; Yahweh menyebabkan dia mati
  rationale: Kata kerja kausatif secara eksplisit mengaitkan kematian Er dengan tindakan Yahweh. Terjemahan tidak memperlunak pelaku ilahi dan juga tidak menambahkan keterangan tentang sarana atau prosesnya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan langsung tanpa kata pembuka tambahan mengikuti alur narasi Ibrani, sedangkan “di mata Yahweh” mempertahankan citra sumber yang tetap mudah dipahami.
