  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: id
  text: Pada waktu itu, Yehuda turun menjauh dari saudara-saudaranya, lalu berpaling kepada seorang Adulam yang bernama Hira.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu terjadilah pada waktu itu.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan ini menyebut “seorang [dari] Adulam,” yaitu seorang yang berasal dari Adulam. Teks Ibrani juga dapat dipahami sebagai memperkenalkan seorang individu tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan ini membuka episode baru dan menetapkan latar waktunya. Terjemahan ini alami dalam bahasa Indonesia modern tanpa menerjemahkan formula naratif secara kaku.
- source_word: וַיֵּרֶד
  choice: meninggalkan
  rationale: Secara harfiah berarti 'turun', tetapi bersama frasa berikutnya kata ini menggambarkan Yehuda pergi menjauh dari saudara-saudaranya. 'Meninggalkan' menyampaikan gerakan pemisahan secara alami; arti arah harfiahnya dicatat dalam catatan kaki.
- source_word: מֵאֵת אֶחָיו
  choice: saudara-saudaranya
  rationale: Frasa ini menunjukkan bahwa Yehuda bergerak menjauh dari saudara-saudara laki-lakinya. Dalam konteks keluarga Yakub, 'saudara-saudaranya' jelas dan wajar.
- source_word: וַיֵּט עַד
  choice: singgah pada
  rationale: נטה dengan עַד di sini menunjukkan bahwa Yehuda menyimpang dari jalannya atau mengarahkan diri kepada seseorang. 'Singgah pada' alami dalam narasi Indonesia dan tidak memaksakan apakah ia hanya berkunjung atau menetap.
- source_word: אִישׁ עֲדֻלָּמִי
  choice: seorang Adulam
  rationale: Ungkapan Ibrani secara harfiah berarti seorang laki-laki Adulam, yakni seorang yang berasal dari Adulam. Bentuk ringkas ini alami, sementara bentuk yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: וּשְׁמוֹ חִירָה
  choice: bernama Hira
  rationale: Klausa penamaan dilebur secara alami ke dalam deskripsi orang tersebut tanpa mengurangi informasinya.
- source_word: חִירָה
  choice: Hira
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang wajar dalam ejaan bahasa Indonesia.
