  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: id
  text: Ia mengandung lagi dan melahirkan seorang anak laki-laki, lalu menamainya Onan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: Ia mengandung
  rationale: Verba הרה menyatakan bahwa perempuan itu mengandung; bentuk ini alami dan ringkas dalam narasi bahasa Indonesia.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam urutan kelahiran ini, עוֹד menunjukkan pengulangan.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: Ungkapan ini menyampaikan idiom Ibrani tentang kelahiran seorang putra secara alami dalam bahasa Indonesia modern.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: lalu menamainya
  rationale: Secara harfiah ungkapan Ibrani berarti 'memanggil namanya', tetapi 'menamainya' merupakan padanan idiomatis yang tepat; 'lalu' mencerminkan kelanjutan rangkaian narasi.
- source_word: אוֹנָן
  choice: Onan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
