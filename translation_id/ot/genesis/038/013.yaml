  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: id
  text: 'Lalu Tamar diberi tahu: “Lihat, ayah mertuamu sedang naik ke Timna untuk menggunting bulu domba-dombanya.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberi tahu
  rationale: Bentuk Hofal menyatakan tindakan pasif berupa penyampaian kabar; dalam bahasa Indonesia, penerimanya secara alami dijadikan subjek.
- source_word: לְתָמָר
  choice: Tamar
  rationale: Menandai penerima kabar dan mempertahankan nama diri dalam bentuk yang lazim.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Mewakili formula pengantar ujaran langsung secara lebih alami daripada terjemahan harfiah 'dengan berkata'.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi interjeksi yang menarik perhatian pada kabar berikutnya dengan bahasa modern.
- source_word: חָמִיךְ
  choice: ayah mertuamu
  rationale: Mempertahankan istilah kekerabatan dan akhiran orang kedua feminin tunggal yang merujuk kepada Tamar.
- source_word: עֹלֶה
  choice: sedang pergi
  rationale: Partisip Qal menunjukkan gerak yang sedang berlangsung atau segera terjadi; 'pergi' alami dalam konteks laporan, sementara nuansa naik tidak perlu dipaksakan dalam bahasa sasaran.
- source_word: תִמְנָתָה
  choice: ke Timna
  rationale: Nama tempat dengan he direktif menyatakan arah atau tujuan, yang secara alami diterjemahkan 'ke'.
- source_word: לָגֹז
  choice: untuk mencukur bulu
  rationale: Infinitif dengan ל menyatakan tujuan; objek bulu dibuat eksplisit agar tindakan mencukur domba tidak terdengar seolah-olah tubuh dombanya yang dipotong.
- source_word: צֹאנוֹ
  choice: domba-dombanya
  rationale: Dalam konteks pencukuran, nomina kolektif צאן secara wajar merujuk pada kawanan domba; bentuk ulang menyampaikan jamak kolektif dengan jelas.
