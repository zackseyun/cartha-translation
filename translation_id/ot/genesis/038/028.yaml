revisions:
- from: Ketika Tamar sedang melahirkan, salah seorang bayi mengulurkan tangannya. Bidan itu mengambil tangannya dan mengikatkan seutas benang merah tua pada tangannya sambil berkata, “Inilah yang keluar lebih dahulu.”[a]
  to: Ketika Tamar sedang melahirkan, salah seorang bayi mengulurkan tangannya. Bidan itu mengambil tangan yang terulur itu dan mengikatkan seutas benang merah pada tangan itu sambil berkata, “Inilah yang keluar lebih dahulu.”[a]
  rationale: Revisi mempertahankan subjek tak bernama—salah satu bayi—dan pernyataan naratif bahwa dialah yang keluar lebih dahulu. Catatan kaki diperbaiki agar tidak mengklaim bahwa seluruh bayi telah muncul pada tahap yang hanya menggambarkan tangan yang terulur. Istilah warna disederhanakan menjadi “merah”, padanan lazim bagi benang scarlet/kirmizi dalam bahasa Indonesia.
