translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Pengulangan 'tangannya' dipertahankan agar urutan tindakan tetap jelas. 'Merah tua' dipilih sebagai padanan yang mudah dipahami untuk warna kirmizi tanpa memakai istilah yang kurang umum.
