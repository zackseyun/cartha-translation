  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: id
  text: Ketika Tamar sedang melahirkan, salah seorang bayi mengulurkan tangannya. Bidan itu mengambil tangan yang terulur itu dan mengikatkan seutas benang merah pada tangan itu sambil berkata, “Inilah yang keluar lebih dahulu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Benang merah itu menjadi tanda untuk mengenali bayi yang tangannya muncul lebih dahulu.
    reason: cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: Ketika Tamar sedang melahirkan
  rationale: Konstruksi ב + infinitif dengan sufiks feminin menyatakan keadaan temporal yang sedang berlangsung. Nama Tamar dicantumkan untuk kejelasan alami dalam bahasa Indonesia.
- source_word: וַיִּתֶּן יָד
  choice: salah seorang bayi mengulurkan tangannya
  rationale: Ungkapan harfiah 'memberikan tangan' menggambarkan tangan salah satu bayi yang muncul saat persalinan. Terjemahan ini alami dan tidak menentukan bayi yang mana.
- source_word: הַמְיַלֶּדֶת
  choice: bidan
  rationale: Partisip dari ילד menunjuk kepada perempuan yang membantu persalinan; 'bidan' adalah padanan Indonesia yang ringkas dan lazim.
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: mengikatkan seutas benang merah tua pada tangannya
  rationale: שָׁנִי menunjuk pada bahan berwarna kirmizi atau merah tua. Kata 'benang' dilengkapi dari konteks sebagai benda yang diikatkan untuk menjadi penanda.
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: Inilah yang keluar lebih dahulu
  rationale: Ungkapan ini mengidentifikasi bayi yang disangka muncul pertama tanpa memasukkan istilah status 'anak sulung', yang tidak terdapat dalam teks.
