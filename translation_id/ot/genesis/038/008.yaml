base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: id
  text: Lalu Yehuda berkata kepada Onan, “Tidurilah dengan istri saudaramu, tunaikanlah kewajiban seorang saudara ipar terhadapnya[a], dan bangkitkanlah keturunan bagi saudaramu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih teknis, “lakukanlah kewajiban levirat terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw konsekutif melanjutkan urutan peristiwa; “Lalu” alami dalam narasi Indonesia modern.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk nama Ibrani yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֹּא אֶל
  choice: Hampirilah
  rationale: Ungkapan ini secara kontekstual menunjuk pada hubungan seksual. “Hampirilah” mempertahankan ungkapan halus sumber tanpa menjadikannya terlalu gamblang.
- source_word: אֵשֶׁת אָחִיךָ
  choice: istri saudaramu
  rationale: Terjemahan langsung dan alami. “Saudaramu” mempertahankan ketidakspesifikan אָחִיךָ mengenai kakak atau adik.
- source_word: וְיַבֵּם אֹתָהּ
  choice: tunaikanlah kewajibanmu sebagai saudara iparnya
  rationale: Kata kerja teknis יִבֵּם menunjuk pada kewajiban saudara laki-laki mendiang terhadap jandanya. Rumusan ini dapat dipahami pembaca umum tanpa menghilangkan aspek kewajiban keluarga tersebut.
- source_word: וְהָקֵם
  choice: bangkitkanlah
  rationale: Mempertahankan gambaran idiomatis קום dalam perintah untuk meneruskan garis keturunan saudara yang telah meninggal.
- source_word: זֶרַע
  choice: keturunan
  rationale: Dalam konteks ini זֶרַע berarti anak atau garis keturunan yang akan diperhitungkan bagi saudara yang meninggal; “keturunan” jelas dan wajar dalam bahasa Indonesia.
- source_word: לְאָחִיךָ
  choice: bagi saudaramu
  rationale: 'Kata depan ל menandai kepentingan atau peruntukan: keturunan itu dibangkitkan bagi saudara yang telah meninggal.'
theological_decisions:
- issue: Penerjemahan istilah kewajiban perkawinan levirat tanpa memasukkan perincian hukum atau doktrin yang lebih kemudian
  choice: tunaikanlah kewajibanmu sebagai saudara iparnya
  alternative: lakukanlah kewajiban levirat terhadapnya
  rationale: Pilihan utama mempertahankan unsur kewajiban kekeluargaan dalam kata יִבֵּם dan tetap mudah dimengerti. Istilah teknis “levirat” dicantumkan dalam catatan, bukan dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Hampirilah” mempertahankan ungkapan halus untuk hubungan seksual, sedangkan “saudaramu” menghindari penentuan kakak atau adik yang tidak dinyatakan oleh teks Ibrani.
