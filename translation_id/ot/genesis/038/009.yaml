  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: id
  text: Onan tahu bahwa keturunan itu tidak akan menjadi miliknya[a]. Maka, setiap kali ia menghampiri istri saudaranya, ia menumpahkan maninya ke tanah[b], supaya ia tidak menghasilkan keturunan bagi saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih itu tidak akan menjadi miliknya.” Dalam konteks ini, “benih” berarti anak atau keturunan yang akan diperhitungkan bagi saudaranya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia merusak atau menyia-nyiakan ke tanah.” Objeknya tidak disebutkan dalam bahasa Ibrani, tetapi konteksnya menunjukkan tindakan Onan untuk mencegah pembuahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: tahu
  rationale: Makna langsung ידע dalam narasi; bentuk ini alami dan tidak menambahkan gagasan bahwa Onan baru menyadarinya.
- source_word: הַזָּרַע
  choice: keturunan
  rationale: Secara harfiah berarti 'benih', tetapi dalam konteks kewajiban menghasilkan ahli waris bagi saudara yang meninggal, yang dimaksud ialah anak atau keturunan.
- source_word: לֹא לוֹ יִהְיֶה הַזָּרַע
  choice: keturunan itu tidak akan menjadi miliknya
  rationale: Mempertahankan ungkapan sumber tanpa mempersempitnya menjadi rumusan hukum tertentu; konteks menunjukkan bahwa anak tersebut akan diperhitungkan bagi saudaranya.
- source_word: וְהָיָה אִם־בָּא
  choice: setiap kali
  rationale: Konstruksi ini dalam narasi menyatakan tindakan yang berulang atau menjadi kebiasaan.
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: bersetubuh dengan istri saudaranya
  rationale: Ungkapan Ibrani merupakan eufemisme seksual. Terjemahan ini menyampaikan maksudnya dengan jelas, wajar, dan tetap bermartabat dalam bahasa Indonesia modern.
- source_word: וְשִׁחֵת אַרְצָה
  choice: ia menumpahkannya ke tanah
  rationale: שחת pada dasarnya berarti merusakkan atau membuat sia-sia; objeknya tidak disebutkan. Dalam konteks ini, akhiran '-nya' secara wajar menunjuk pada air mani tanpa menambahkannya secara eksplisit ke teks utama.
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: supaya ia tidak memberikan keturunan kepada saudaranya
  rationale: Menyatakan tujuan tindakan Onan dan mempertahankan hubungan antara זרע dan keturunan yang diperuntukkan bagi saudaranya.
theological_decisions:
- issue: Makna זרע dan sifat tindakan Onan
  choice: Menerjemahkan זרע sebagai 'keturunan' dalam kedua klausa hukum-keluarga, sedangkan tindakan fisiknya dinyatakan dengan 'menumpahkannya ke tanah'.
  alternative: Memakai 'benih' secara konsisten, atau menyebut 'air mani' secara eksplisit dalam teks utama.
  rationale: 'Ayat ini menghubungkan dua tingkat makna: keturunan yang secara kekeluargaan diperuntukkan bagi saudara Onan dan tindakan fisik untuk mencegah terjadinya pembuahan. Pilihan ini menjelaskan hubungan itu tanpa menjadikan teks lebih eksplisit daripada bahasa Ibraninya atau memasukkan penilaian doktrinal yang tidak dinyatakan di ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bersetubuh' dipilih agar eufemisme Ibrani dipahami pembaca masa kini tanpa bahasa vulgar. Struktur sebab-tujuan dan nuansa tindakan berulang dipertahankan.
