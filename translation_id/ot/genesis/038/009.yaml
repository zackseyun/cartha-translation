  source_fidelity: Teks dengan tepat menangkap ידע sebagai “tahu,” nilai kebiasaan dalam וְהָיָה אִם־בָּא sebagai “setiap kali,” serta tujuan Onan untuk tidak menghasilkan keturunan bagi saudaranya. Namun, “Namun” memberi kontras yang tidak dinyatakan secara jelas oleh waw naratif. Selain itu, pronomina dalam “menumpahkannya” tidak memiliki anteseden yang jelas dalam bahasa Indonesia dan dapat secara keliru dibaca merujuk kepada “keturunan.”
  naturalness: “Bersetubuh” adalah bahasa baku dan tidak vulgar, tetapi “menghampiri istri saudaranya” lebih idiomatis sebagai padanan eufemisme naratif Alkitab. “Menghasilkan keturunan bagi saudaranya” lebih alami daripada “memberikan keturunan kepada saudaranya.”
  terminology: “Keturunan” tepat untuk זרע dalam kedua klausa yang berbicara tentang status keturunan. Untuk tindakan fisik yang tersirat oleh וְשִׁחֵת אַרְצָה, “menumpahkan maninya ke tanah” menjadikan rujukan yang dalam bahasa Ibrani dibiarkan tersirat menjadi jelas dan tidak ambigu dalam bahasa Indonesia; “mani” merupakan istilah baku-klinis, bukan vulgar.
