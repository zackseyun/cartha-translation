  to: Onan tahu bahwa keturunan itu tidak akan menjadi miliknya[a]. Maka, setiap kali ia menghampiri istri saudaranya, ia menumpahkan maninya ke tanah[b], supaya ia tidak menghasilkan keturunan bagi saudaranya.
  rationale: Revisi menghapus kontras yang tidak perlu, memakai eufemisme Indonesia yang alami bagi idiom Ibrani “menghampiri,” dan memperjelas objek tindakan agar pembaca Indonesia tidak menghubungkan pronomina itu dengan “keturunan.” Catatan b mempertahankan fakta bahwa objek tidak disebutkan secara eksplisit dalam teks Ibrani.
