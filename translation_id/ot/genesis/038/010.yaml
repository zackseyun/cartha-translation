  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: id
  text: Apa yang dilakukannya itu jahat di mata Yahweh, maka Yahweh membunuhnya juga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: jahat
  rationale: Bentuk statif dari רעע menilai tindakan itu sebagai buruk secara moral; “jahat” mempertahankan kekuatan penilaian tersebut tanpa melunakkannya menjadi sekadar “tidak berkenan”.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Ungkapan ini mempertahankan metafora Ibrani yang lazim untuk penilaian ilahi dan tetap alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֲשֶׁר עָשָׂה
  choice: Apa yang dilakukannya itu
  rationale: Frasa ini secara alami merujuk pada tindakan Onan dalam konteks sebelumnya; kata “itu” membantu menandai tindakan yang telah disebutkan.
- source_word: וַיָּמֶת
  choice: Yahweh membunuh dia
  rationale: Bentuk Hifil dari מות bersifat kausatif dan mengaitkan kematian Onan langsung dengan tindakan Yahweh. “Membunuh” menyampaikan kausalitas itu secara jelas dan alami.
- source_word: גַּם אֹתוֹ
  choice: dia juga
  rationale: Kata “juga” mempertahankan kaitan dengan Er, yang sebelumnya juga dibunuh oleh Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; bentuk “Yahweh” mempertahankan nama diri ilahi.
- issue: Pelaku kematian dalam וַיָּמֶת
  choice: Yahweh membunuh dia
  alternative: Yahweh membuatnya mati; dia pun mati
  rationale: Bentuk kausatif verba tersebut menyatakan bahwa Yahweh menyebabkan kematiannya. Terjemahan aktif tidak mengaburkan pelaku atau mengubahnya menjadi kematian yang sekadar terjadi.
- issue: Hubungan antarklausa
  choice: maka
  alternative: dan
  rationale: Waw naratif di sini menghubungkan penilaian ilahi dengan tindakan penghukuman berikutnya. “Maka” menyampaikan urutan berakibat yang jelas dalam konteks tanpa menambahkan alasan khusus yang tidak dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Metafora “di mata Yahweh” dipertahankan karena mudah dipahami, sedangkan bentuk kausatif diterjemahkan secara aktif agar agensi ilahi tetap jelas.
