base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: id
  text: Kemudian Yehuda mengirimkan anak kambing itu melalui sahabatnya, orang Adulam, untuk mengambil kembali barang jaminan itu dari tangan perempuan tersebut,[a] tetapi sahabatnya tidak menemukan perempuan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari tangan perempuan itu.” Ungkapan ini berarti mengambilnya kembali dari penguasaan perempuan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Kemudian ... mengirimkan
  rationale: Waw-konsekutif melanjutkan urutan cerita; “Kemudian” menyampaikan perkembangan naratif secara alami dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Bentuk baku nama Ibrani ini dalam tradisi Alkitab bahasa Indonesia.
- source_word: גְּדִי הָעִזִּים
  choice: anak kambing
  rationale: Ungkapan ini menunjuk pada kambing yang masih muda; “anak kambing” merupakan padanan Indonesia yang jelas dan alami.
- source_word: בְּיַד רֵעֵהוּ
  choice: melalui sahabatnya
  rationale: Secara harfiah berarti “dengan/perantaraan tangan sahabatnya” dan berfungsi sebagai idiom perantaraan; “melalui” menyampaikan maksudnya secara alami.
- source_word: הָעֲדֻלָּמִי
  choice: orang Adulam
  rationale: Adjektiva nisbah ini menunjukkan seseorang yang berasal dari Adulam; bentuk deskriptif ini alami dalam bahasa Indonesia.
- source_word: לָקַחַת
  choice: untuk mengambil kembali
  rationale: Infinitif menyatakan tujuan; konteks menunjukkan bahwa Yehuda hendak memperoleh kembali benda yang telah diserahkannya.
- source_word: הָעֵרָבוֹן
  choice: barang jaminan
  rationale: Kata ini menunjuk pada benda yang diserahkan sebagai jaminan; “barang jaminan” memperjelas bahwa yang dimaksud adalah benda-benda konkret dalam konteks sebelumnya.
- source_word: מִיַּד הָאִשָּׁה
  choice: dari tangan perempuan tersebut
  rationale: Mempertahankan citra konkret bahasa Ibrani, yang menyatakan kepemilikan atau penguasaan melalui ungkapan “dari tangan”.
- source_word: וְלֹא מְצָאָהּ
  choice: tetapi sahabatnya tidak menemukan perempuan itu
  rationale: “Tetapi” menandai hasil yang berlawanan dengan tujuan pengutusan. Subjek “sahabatnya” dan objek “perempuan itu” dinyatakan kembali agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan citra “dari tangan” dalam teks Ibrani; penjelasan singkat diberikan melalui catatan kaki.
