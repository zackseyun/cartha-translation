base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: id
  text: Lalu ia kembali kepada Yehuda dan berkata, “Aku tidak menemukannya, dan para lelaki setempat juga berkata, ‘Di sini tidak ada pelacur kultus[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani qĕdēšâ. Makna tepat istilah ini dan kaitannya dengan praktik kultis diperdebatkan. Istilah ini sering diterjemahkan “pelacur kultus”; alternatifnya “pelacur kuil” atau “perempuan yang dikhususkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Lalu ia kembali
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: אֶל־יְהוּדָה
  choice: kepada Yehuda
  rationale: Preposisi אֶל menunjukkan arah kepada seseorang, dan nama יְהוּדָה disajikan dalam bentuk Indonesia yang lazim, “Yehuda”.
- source_word: לֹא מְצָאתִיהָ
  choice: Aku tidak menemukannya
  rationale: Bentuk perfektif dengan penyangkalan melaporkan tindakan lampau yang selesai; terjemahan ini tidak menambahkan nuansa ketidakmampuan.
- source_word: וְגַם
  choice: Lagi pula
  rationale: Ungkapan ini menambahkan keterangan pendukung kedua dan terdengar alami dalam laporan langsung bahasa Indonesia.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: para lelaki di tempat itu
  rationale: Bahasa Ibrani secara harfiah menyebut para lelaki setempat, bukan istilah umum bagi semua penduduk.
- source_word: לֹא הָיְתָה בָזֶה
  choice: Di sini tidak pernah ada
  rationale: Konstruksi eksistensial ini menyangkal bahwa perempuan dengan sebutan tersebut pernah berada atau dikenal di lokasi itu; “di sini” menerjemahkan בָזֶה secara idiomatis.
- source_word: קְדֵשָׁה
  choice: pelacur kultus
  rationale: Istilah ini membedakan קְדֵשָׁה dari זֹנָה dalam konteks sekitar dan mempertahankan kaitan dengan praktik keagamaan tanpa mempersempitnya secara pasti pada lembaga kuil formal.
theological_decisions:
- issue: Identitas dan fungsi קְדֵשָׁה
  choice: pelacur kultus, disertai catatan kaki
  alternative: pelacur kuil; perempuan yang dibaktikan
  rationale: Konteks mengaitkan perempuan itu dengan hubungan seksual berbayar, sedangkan bentuk katanya memiliki nuansa pengudusan atau pembaktian. Terjemahan utama mempertahankan kedua unsur sejauh mungkin, dan catatan kaki mengakui alternatif tanpa menetapkan rekonstruksi institusional tertentu sebagai kepastian.
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. “Lagi pula” menjaga hubungan aditif antarklausa, sedangkan “pelacur kultus” mempertahankan pembedaan leksikal dalam konteks dan dijelaskan bagi pembaca umum melalui catatan kaki.
