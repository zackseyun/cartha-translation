base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: id
  text: Ketika ia sedang dibawa keluar[a], ia mengirim pesan kepada ayah mertuanya, dengan berkata, “Aku hamil oleh laki-laki yang memiliki barang-barang ini.” Lalu ia berkata, “Tolong kenalilah milik siapakah meterai, tali-tali, dan tongkat ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tolong identifikasilah.” Kata Ibrani ini dapat berarti mengenali atau mengidentifikasi; dalam konteks ini, kata tersebut mengandung daya pembuktian yang tajam.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּצֵאת
  choice: sedang dibawa ke luar
  rationale: Partisipel pasif menggambarkan tindakan yang sedang berlangsung; dalam konteks ini Tamar dibawa ke luar untuk menerima hukuman.
- source_word: שָׁלְחָה אֶל חָמִיהָ
  choice: mengirim pesan kepada mertuanya
  rationale: Ungkapan ini secara idiomatis menunjukkan bahwa Tamar menyampaikan pesan kepada ayah mertuanya; dalam konteks bahasa Indonesia, “mertuanya” sudah jelas merujuk kepada Yehuda.
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: Aku mengandung dari laki-laki yang memiliki barang-barang ini
  rationale: Terjemahan ini menyatakan hubungan paternitas yang tersirat oleh preposisi לְ dan mempertahankan klausa kepemilikan secara alami.
- source_word: הַכֶּר נָא
  choice: Tolong kenalilah
  rationale: Imperatif נכר meminta lawan bicara mengenali atau mengidentifikasi benda-benda itu; “kenalilah” juga mempertahankan gema verbal yang tajam dengan perkataan saudara-saudara Yusuf kepada Yakub dalam Kejadian 37:32.
- source_word: חֹתֶמֶת
  choice: meterai
  rationale: Benda ini adalah cap pribadi untuk pengesahan dan identifikasi. Bentuk Ibrani tidak dengan sendirinya mengharuskan bahwa benda itu berupa cincin meterai.
- source_word: פְּתִילִים
  choice: tali-tali
  rationale: Nomina berbentuk jamak, kemungkinan tali yang berkaitan dengan meterai; bentuk ulang mempertahankan pluralitasnya.
- source_word: מַטֶּה
  choice: tongkat
  rationale: Padanan Indonesia yang alami untuk tongkat pribadi yang dibawa Yehuda.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Terjemahan mempertahankan aspek tindakan yang sedang berlangsung, bentuk jamak “tali-tali”, serta ambiguitas leksikal הַכֶּר antara mengenali dan mengidentifikasi. “Meterai” dipilih daripada “cincin meterai” karena bentuk fisik benda tersebut tidak dinyatakan secara eksplisit dalam teks Ibrani.
