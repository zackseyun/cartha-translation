- from: Ketika ia sedang dibawa ke luar, ia mengirim pesan kepada mertuanya, katanya, “Aku mengandung dari laki-laki yang memiliki barang-barang ini.” Lalu katanya, “Tolong kenalilah[a] milik siapakah meterai, tali-tali, dan tongkat ini.”
  to: Ketika ia sedang dibawa keluar[a], ia mengirim pesan kepada ayah mertuanya, dengan berkata, “Aku hamil oleh laki-laki yang memiliki barang-barang ini.” Lalu ia berkata, “Tolong kenalilah milik siapakah meterai, tali-tali, dan tongkat ini.”
