revisions:
- from: Lalu Yehuda mengenali barang-barang itu dan berkata, “Perempuan itu lebih benar daripada aku[a], sebab aku tidak memberikan dia kepada Syela, anakku.” Setelah itu, ia tidak bersetubuh dengannya lagi.[b]
  to: Lalu Yehuda mengenali barang-barang itu dan berkata, “Ia lebih benar daripada aku[a], sebab aku tidak memberikannya kepada Syela, anakku.” Dan ia tidak lagi bersetubuh dengannya.[b]
  rationale: Revisi kecil ini meningkatkan kedekatan pada pronomina dan penghubung teks Ibrani serta kelancaran bahasa Indonesia, tanpa mengubah arti, tingkat register, atau penilaian moral yang bersifat situasional dalam ucapan Yehuda. Penanda catatan kaki tetap tertaut pada unsur yang relevan.
