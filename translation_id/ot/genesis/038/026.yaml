base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: id
  text: Lalu Yehuda mengenali barang-barang itu dan berkata, “Ia lebih benar daripada aku[a], sebab aku tidak memberikannya kepada Syela, anakku.” Dan ia tidak lagi bersetubuh dengannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Dialah yang berada di pihak yang benar, bukan aku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia tidak mengenal dia lagi”; “mengenal” merupakan ungkapan halus bahasa Ibrani untuk hubungan seksual.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: mengenali barang-barang itu
  rationale: Kata kerja נכר menyatakan bahwa Yehuda mengenali barang-barang jaminan yang diperlihatkan kepadanya dalam ayat sebelumnya. Objeknya tidak dinyatakan dalam bahasa Ibrani, tetapi ditambahkan dalam bahasa Indonesia agar rujukannya jelas.
- source_word: צָדְקָה מִמֶּנִּי
  choice: Perempuan itu lebih benar daripada aku
  rationale: Bentuk komparatif dengan מִן membandingkan tindakan Tamar dengan tindakan Yehuda dalam perkara ini. Ungkapan ini mempertahankan daya moral akar צדק tanpa menjadikannya pernyataan bahwa Tamar sama sekali tidak berdosa.
- source_word: כִּי עַל כֵּן
  choice: sebab
  rationale: Dalam konteks ini, gabungan kata tersebut memperkenalkan alasan bagi pengakuan Yehuda. 'Sebab' menyampaikan hubungan kausal secara alami.
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: aku tidak memberikan dia kepada Syela, anakku
  rationale: Terjemahan ini mengikuti bentuk Ibrani dengan cukup dekat. Konteks narasi menunjukkan bahwa yang dimaksud ialah memberikan Tamar kepada Syela sebagai istri.
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: Setelah itu, ia tidak bersetubuh dengannya lagi
  rationale: ידע, 'mengenal', merupakan eufemisme Ibrani untuk hubungan seksual. Terjemahan Indonesia menyatakan maknanya dengan jelas dan wajar, sedangkan unsur יָסַף עוֹד dipertahankan melalui 'lagi'.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: שֵׁלָה
  choice: Syela
  rationale: Nama Ibrani ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
theological_decisions:
- issue: Penilaian moral dalam pengakuan Yehuda
  choice: Yehuda mengakui bahwa Tamar lebih benar daripada dirinya dalam perkara ini.
  alternative: Ucapan itu dapat dipahami sebagai 'Dialah yang berada di pihak yang benar, bukan aku.'
  rationale: Bentuk komparatifnya bersifat situasional dalam narasi. Terjemahan mempertahankan bobot moral צדק sekaligus tidak mengubahnya menjadi pernyataan tentang ketidakberdosaan mutlak Tamar.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Bersetubuh' dipilih karena jelas namun tidak vulgar. Sebutan 'perempuan itu' mempertahankan subjek feminin tanpa menambahkan nama Tamar yang tidak muncul dalam ayat ini.
