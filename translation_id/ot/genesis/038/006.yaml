  text: וַ/יִּקַּ֧ח יְהוּדָ֛ה אִשָּׁ֖ה לְ/עֵ֣ר בְּכוֹר֑/וֹ וּ/שְׁמָ֖/הּ תָּמָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: id
  text: Yehuda mengambil seorang istri bagi Er, anak sulungnya. Nama perempuan itu Tamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata לָקַח pada dasarnya berarti 'mengambil'. Dalam konteks ini, Yehuda memilih atau mendapatkan istri bagi anaknya; 'mengambil ... bagi' mempertahankan konstruksi Ibrani tanpa mempersempitnya menjadi uraian tentang tata cara perjodohan.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Dalam konteks perkawinan bagi Er, אִשָּׁה menunjuk pada 'istri', bukan sekadar 'perempuan'.
- source_word: לְעֵר
  choice: bagi Er
  rationale: Preposisi לְ menandai pihak yang menerima manfaat atau tujuan tindakan Yehuda; 'bagi Er' wajar dan dekat dengan struktur sumber.
- source_word: בְּכוֹרוֹ
  choice: anak sulungnya
  rationale: בְּכוֹר berarti anak laki-laki yang lahir pertama. 'Anak sulungnya' jelas dan alami dalam bahasa Indonesia.
- source_word: וּשְׁמָהּ
  choice: Nama perempuan itu
  rationale: Ungkapan ini menyampaikan formula penamaan Ibrani secara alami; rujukan 'perempuan itu' memperjelas bahwa sufiks feminin menunjuk kepada istri Er.
- source_word: תָּמָר
  choice: Tamar
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
