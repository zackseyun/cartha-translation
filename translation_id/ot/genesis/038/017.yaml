  source_fidelity: 'Makna dasar dialog diterjemahkan dengan tepat: Yehuda berjanji mengirim seekor anak kambing, dan Tamar mensyaratkan pemberian עֵרָבוֹן hingga kambing itu dikirim. Namun, “jaminan” tanpa penanda benda dapat dipahami sebagai jaminan/garansi abstrak, sedangkan konteks dan kata Ibrani menunjuk pada sesuatu yang diserahkan sebagai jaminan. Catatan “barang gadai” juga terlalu khusus karena mengandaikan bentuk transaksi gadai.'
