lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: seekor anak kambing
  rationale: Frasa ini secara harfiah menunjuk kepada anak dari jenis kambing. Pilihan ini alami dalam bahasa Indonesia modern dan tetap menyebut jenis hewannya dengan jelas.
- source_word: מִן הַצֹּאן
  choice: dari kawanan
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing. Karena hewannya sudah disebut sebagai anak kambing, “dari kawanan” menghindari pengulangan yang kaku.
- source_word: עֵרָבוֹן
  choice: jaminan
  rationale: Kata benda ini menunjuk kepada sesuatu yang diserahkan sebagai tanggungan sampai janji dipenuhi. “Jaminan” sesuai dengan konteks benda-benda pribadi yang kemudian diminta Tamar dan tidak membatasi bentuknya.
- source_word: עַד שָׁלְחֶךָ
  choice: sampai engkau mengirimkannya
  rationale: Bentuk Ibrani secara harfiah berarti “sampai pengirimanmu”. Akhiran “-nya” secara alami merujuk kepada anak kambing yang baru dijanjikan.
- source_word: אִם תִּתֵּן
  choice: Asalkan engkau memberikan
  rationale: אִם memperkenalkan syarat bagi persetujuan Tamar. “Asalkan” menyampaikan fungsi kondisional itu dengan alami dalam dialog bahasa Indonesia.
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: Aku akan mengirimkan
  rationale: Pronomina mandiri אָנֹכִי memberi sedikit penekanan kepada pelaku, tetapi struktur Indonesia dengan “Aku” sudah menyatakan subjek secara eksplisit dan wajar tanpa menambahkan “sendiri”, yang dapat memberi penekanan berlebihan.
