  text: Ketika tiba waktunya bagi Tamar untuk melahirkan, ternyata ada anak kembar dalam kandungannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Ketika tiba waktunya
  rationale: Gabungan bentuk naratif וַיְהִי dan keterangan waktu בְּעֵת memperkenalkan peristiwa berikutnya. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu eksplisit seperti 'sekarang'.
- source_word: לִדְתָּהּ
  choice: bagi Tamar untuk melahirkan
  rationale: Infinitif konstruk dari ילד dengan sufiks orang ketiga feminin tunggal berarti 'baginya untuk melahirkan'. Nama Tamar dipakai agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: הִנֵּה menyoroti keadaan yang baru tampak atau mengejutkan. Dalam narasi Indonesia modern, 'ternyata' menyampaikan daya penarik perhatian itu secara wajar.
- source_word: תְאוֹמִים
  choice: anak kembar
  rationale: Nomina jamak ini berarti pasangan kembar; 'anak kembar' merupakan padanan Indonesia yang jelas dan idiomatis dalam konteks kelahiran.
- source_word: בְּבִטְנָהּ
  choice: dalam kandungannya
  rationale: Dalam konteks persalinan, בֶּטֶן menunjuk pada rahim atau kandungan. 'Dalam kandungannya' paling alami dalam bahasa Indonesia.
