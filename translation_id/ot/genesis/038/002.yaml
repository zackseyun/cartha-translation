  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: id
  text: Di sana Yehuda melihat anak perempuan seorang laki-laki Kanaan; nama laki-laki itu Sua.[a] Lalu ia mengambilnya dan menghampirinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan namanya Sua.” Nama itu merujuk kepada laki-laki Kanaan tersebut, bukan kepada anak perempuannya.'
    reason: lexical_alternative
  - marker: b
    text: “Menghampirinya” merupakan ungkapan halus yang berarti berhubungan seksual dengannya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Makna langsung ראה dalam rangkaian naratif ini adalah 'melihat'; pilihan ini tidak menambahkan gagasan 'bertemu' atau 'memperhatikan'.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan lokasi yang alami dan ringkas dalam narasi Indonesia.
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: anak perempuan seorang Kanaan
  rationale: Mempertahankan hubungan konstruksi Ibrani, yakni anak perempuan dari seorang laki-laki Kanaan, dengan ungkapan Indonesia yang wajar.
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: yang bernama Sua
  rationale: Pronomina maskulin pada שְׁמוֹ menunjuk kepada laki-laki Kanaan itu, bukan kepada anak perempuannya; catatan kaki menjernihkan rujukan yang dapat terasa ambigu dalam bahasa Indonesia.
- source_word: וַיִּקָּחֶהָ
  choice: ia mengambil perempuan itu
  rationale: Menjaga arti dasar לקח tanpa secara eksplisit menambahkan 'menikahi', meskipun dalam konteks tindakan ini dapat menyiratkan mengambil sebagai istri.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: menghampirinya
  rationale: Ungkapan halus Indonesia ini mempertahankan idiom naratif bagi hubungan seksual tanpa menerjemahkan bentuk Ibrani secara kaku; maknanya dijelaskan dalam catatan kaki.
