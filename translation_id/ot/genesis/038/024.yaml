  verdict: revise
  source_fidelity: Draf secara umum menyampaikan urutan peristiwa, perkiraan waktu, hubungan keluarga, tuduhan seksual, kehamilan, dan perintah pembakaran. Namun, “berzina seperti pelacur” menambahkan perbandingan “seperti” yang tidak ada dalam bahasa Ibrani dan kurang alami. Penekanan וְגַם הִנֵּה juga lebih baik diterjemahkan secara eksplisit sebagai “ternyata ... juga.”
  naturalness: Bahasa draf pada umumnya baku dan jelas. “Telah berlaku sebagai pelacur” lebih idiomatis dan lebih dekat pada daya tuduhan זָנְתָה daripada “telah berzina seperti pelacur.” “Bawalah dia keluar” merupakan bentuk perintah yang alami dalam bahasa Indonesia modern.
  terminology: “Yehuda,” “menantumu,” dan “dibakar” sudah tepat. Terjemahan revisi mempertahankan keterkaitan זָנְתָה dan לִזְנוּנִים dengan memakai “berlaku sebagai pelacur/pelacuran,” tanpa menyatakan bahwa Tamar benar-benar seorang pelacur, karena ini adalah tuduhan dalam narasi.
