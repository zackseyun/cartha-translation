  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: id
  text: Kira-kira tiga bulan kemudian, Yehuda diberi tahu, “Tamar, menantumu, telah berlaku sebagai pelacur[a], dan ternyata ia juga hamil karena pelacuran[b].” Lalu Yehuda berkata, “Bawalah dia keluar dan biarlah ia dibakar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah berzina”; secara lebih luas, “telah melakukan perbuatan seksual yang tidak bermoral.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “hamil dari pelacuran” atau “hamil melalui perbuatan-perbuatan pelacuran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: Kira-kira tiga bulan kemudian
  rationale: Mengungkapkan perkembangan naratif dan waktu perkiraan secara alami dalam bahasa Indonesia modern.
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: Yehuda mendapat kabar
  rationale: Menyampaikan bentuk pasif laporan kepada Yehuda secara ringkas dan idiomatis.
- source_word: זָנְתָה
  choice: telah berzina seperti pelacur
  rationale: Mempertahankan unsur tindakan seksual terlarang sekaligus citra pelacuran dalam akar זנה, tanpa menyatakan secara pasti bahwa Tamar berprofesi sebagai pelacur.
- source_word: כַּלָּתֶךָ
  choice: menantumu
  rationale: Padanan kekerabatan yang tepat dan alami; konteks menjelaskan bahwa yang dimaksud ialah menantu perempuan.
- source_word: וְגַם הִנֵּה
  choice: Bahkan, sekarang
  rationale: Membawa penekanan dan unsur tersingkapnya keadaan yang terkandung dalam gabungan partikel tersebut.
- source_word: הָרָה לִזְנוּנִים
  choice: hamil akibat perzinaan itu
  rationale: Menunjukkan hubungan sebab-akibat dan mempertahankan kaitan leksikal dengan tuduhan sebelumnya, sambil membiarkan sifat tepat tuduhan dijelaskan dalam catatan.
- source_word: הוֹצִיאוּהָ
  choice: Bawa dia ke luar
  rationale: Menerjemahkan imperatif jamak beserta objek feminin secara langsung tanpa menentukan tujuan yang tidak disebutkan.
- source_word: וְתִשָּׂרֵף
  choice: dan biarlah dia dibakar
  rationale: Mempertahankan bentuk pasif dan daya perintah dari bentuk Niphal tanpa menetapkan pelaksana hukuman.
theological_decisions:
- issue: Istilah tuduhan seksual dalam konteks hukum-keluarga
  choice: telah berzina seperti pelacur / hamil akibat perzinaan itu
  alternative: telah melakukan percabulan / hamil karena pelacuran
  rationale: Akar זנה dan nomina זְנוּנִים membawa citra pelacuran, tetapi dalam konteks tuduhan dapat merujuk lebih luas pada hubungan seksual terlarang. Rumusan utama mempertahankan kedua unsur itu dan catatan menjaga alternatif leksikal.
- issue: Daya hukuman yang diucapkan Yehuda
  choice: Bawa dia ke luar dan biarlah dia dibakar
  alternative: Bawa dia ke luar untuk dibakar / Bawa dia ke luar dan bakarlah dia
  rationale: Bahasa Ibrani menyampaikan perintah hukuman mati dengan pembakaran, tetapi memakai bentuk pasif sehingga pelaksananya tidak ditentukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata “menantu” dipilih karena alami, sedangkan penanda feminin tidak perlu diulang karena Tamar telah disebut. Pengulangan akar זנה/זנונים dipertahankan melalui “berzina/perzinaan,” dengan citra pelacuran tetap hadir dalam teks dan catatan.
