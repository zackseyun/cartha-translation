    rationale: זָנְתָה sendiri memakai bahasa pelacuran sebagai tuduhan; kata “seperti” menggeser makna menjadi perbandingan eksplisit dan menghasilkan ungkapan yang kurang alami.
  - severity: low
    issue: Penekanan “dan lihatlah/ternyata ... juga” dalam וְגַם הִנֵּה belum terwakili penuh oleh “Bahkan, sekarang.”
    rationale: וְגַם menandai tambahan, sedangkan הִנֵּה menyoroti fakta yang mengejutkan atau tersingkap; “ternyata ia juga” menyampaikan keduanya secara lebih wajar.
