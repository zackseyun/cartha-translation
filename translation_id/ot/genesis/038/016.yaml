base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: id
  text: Lalu ia berpaling ke arah perempuan itu di tepi jalan dan berkata[a], “Aku mohon, izinkan aku datang kepadamu,” sebab ia tidak tahu bahwa perempuan itu adalah menantu perempuannya. Perempuan itu berkata, “Apa yang akan kauberikan kepadaku[b] agar engkau datang kepadaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang kepadamu/kepadaku”; dalam konteks ini merupakan ungkapan halus untuk berhubungan seksual.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Apa yang akan kaubayarkan kepadaku agar engkau datang kepadaku?” Bahasa Ibraninya secara lebih harfiah berbunyi, “Apa yang akan kauberikan kepadaku ...?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: ia menyimpang dari jalan untuk menghampiri perempuan itu
  rationale: נטה menggambarkan Yehuda berbelok atau menyimpang dari arah perjalanannya menuju Tamar. Susunan ini menyampaikan gerak tersebut secara alami dan menghindari kesan bahwa ia sekadar menoleh.
- source_word: הָבָה־נָּא
  choice: Izinkan aku
  rationale: Gabungan ini menyatakan desakan atau permohonan. 'Izinkan aku' wajar dalam dialog bahasa Indonesia dan sesuai dengan klausa yang mengikutinya.
- source_word: אָבוֹא אֵלַיִךְ
  choice: menghampirimu
  rationale: Secara harfiah ungkapan ini berarti 'datang kepadamu', tetapi dalam konteks merupakan ungkapan halus untuk hubungan seksual. 'Menghampirimu' mempertahankan kehalusan dan ketidaklangsungan bahasa sumber.
- source_word: כִּי לֹא יָדַע
  choice: sebab ia tidak tahu
  rationale: כִּי di sini memperkenalkan penjelasan atas tindakan Yehuda; 'sebab' sesuai dengan alur naratif.
- source_word: כִּי כַלָּתוֹ הִוא
  choice: bahwa perempuan itu adalah menantunya
  rationale: כַלָּה dalam konteks ini secara khusus menunjuk kepada menantu perempuan. Karena bahasa Indonesia tidak perlu membedakan gender pada istilah 'menantu', rujukannya diperjelas melalui 'perempuan itu'.
- source_word: מַה תִּתֶּן לִּי
  choice: Apa yang akan kauberikan kepadaku
  rationale: Terjemahan ini mempertahankan verba umum נתן, 'memberi', tanpa secara diam-diam mempersempitnya menjadi 'membayar', walaupun konteksnya menyiratkan imbalan.
- source_word: כִּי תָבוֹא אֵלָי
  choice: supaya engkau boleh menghampiriku
  rationale: כִּי di sini menghubungkan pemberian dengan izin untuk mendatanginya. Terjemahan ini mempertahankan ungkapan halus yang sama seperti pada ucapan Yehuda.
