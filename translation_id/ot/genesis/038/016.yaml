revisions:
- from: Lalu ia menyimpang dari jalan untuk menghampiri perempuan itu dan berkata[a], “Izinkan aku menghampirimu,” sebab ia tidak tahu bahwa perempuan itu adalah menantunya. Perempuan itu berkata, “Apa yang akan kauberikan kepadaku[b] supaya engkau boleh menghampiriku?”
  to: Lalu ia berpaling ke arah perempuan itu di tepi jalan dan berkata[a], “Aku mohon, izinkan aku datang kepadamu,” sebab ia tidak tahu bahwa perempuan itu adalah menantu perempuannya. Perempuan itu berkata, “Apa yang akan kauberikan kepadaku[b] agar engkau datang kepadaku?”
  rationale: Revisi terbatas pada pemulihan eufemisme ‘datang kepada’ yang dipakai dua kali dalam Ibrani, penajaman gerak Yehuda di tepi jalan, dan penyesuaian kecil pada istilah kekerabatan. Makna, register naratif, ambiguitas eufemistis, serta fungsi kedua catatan kaki dipertahankan.
