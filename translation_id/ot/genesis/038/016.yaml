translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Ungkapan seksual Ibrani dipertahankan secara halus dalam teks utama lalu dijelaskan dalam catatan kaki. Bentuk 'kauberikan' mengikuti ejaan baku untuk pronomina terikat.
