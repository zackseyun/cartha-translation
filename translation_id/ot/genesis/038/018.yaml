base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: id
  text: Ia berkata, “Apakah yang harus kuberikan kepadamu sebagai jaminan?” Perempuan itu menjawab, “Meterai[a], tali, dan tongkatmu yang ada di tanganmu.” Lalu ia memberikan semuanya kepadanya dan menghampirinya[b], dan perempuan itu pun mengandung darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alat capmu”. Bahasa Ibrani tidak menyebutkan bentuk pasti alat cap tersebut.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “menghampiri perempuan itu” menerjemahkan idiom Ibrani yang merupakan ungkapan halus untuk bersetubuh dengannya.
    reason: source_idiom
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: jaminan
  rationale: Menunjuk pada barang yang diserahkan sebagai tanggungan sampai pembayaran diberikan; ‘jaminan’ alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: חֹתָמְךָ
  choice: meterai
  rationale: Kata ini menunjuk pada alat cap atau meterai untuk menandai identitas. ‘Meterai’ mempertahankan keluasan makna Ibrani tanpa menentukan bahwa benda itu berupa cincin.
- source_word: פְתִילֶךָ
  choice: tali
  rationale: Padanan langsung yang tidak menambahkan dugaan bahwa tali itu adalah kalung atau secara khusus terikat pada meterai.
- source_word: מַטְּךָ
  choice: tongkatmu
  rationale: Kata ini lazim berarti tongkat; konteks menyebut benda pribadi yang sedang dipegang.
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: yang ada di tanganmu
  rationale: Mempertahankan gambaran konkret dan secara alami menerangkan tongkat.
- source_word: וַיִּתֶּן לָּהּ
  choice: ia memberikan semuanya kepadanya
  rationale: Kata ganti ‘semuanya’ memperjelas bahwa yang diberikan adalah ketiga benda yang baru disebut, sebagaimana dituntut konteks.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: menghampirinya
  rationale: Mempertahankan ungkapan halus narasi Ibrani untuk hubungan seksual tanpa memakai ungkapan Indonesia yang terlalu eksplisit atau kasar; catatan kaki menjelaskan maksudnya.
- source_word: וַתַּהַר לוֹ
  choice: perempuan itu pun mengandung darinya
  rationale: Menyampaikan bahwa ia mulai mengandung dan bahwa Yehuda adalah ayahnya, dengan susunan Indonesia yang ringkas dan alami.
