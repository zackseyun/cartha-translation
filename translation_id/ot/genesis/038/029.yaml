  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: id
  text: Ketika ia menarik kembali tangannya, ternyata saudaranya keluar. Lalu perempuan itu berkata, “Betapa engkau telah membuat terobosan!”[a] Maka ia dinamai Peres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Betapa engkau telah membuat suatu penerobosan bagi dirimu sendiri!” Kata-kata Ibrani untuk “terobosan” dan nama Peres berasal dari akar kata yang sama. Nuansa frasa “bagi dirimu sendiri” tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: ketika ia menarik kembali tangannya
  rationale: Bentuk partisip Hifil dari שוב bersama יָד menggambarkan tindakan menarik tangan kembali. Pilihan ini konkret dan wajar dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Partikel הִנֵּה menandai kejadian yang mengejutkan dan menghidupkan narasi. “Ternyata” menyampaikan unsur kejutan itu secara alami tanpa diksi arkais.
- source_word: יָצָא אָחִיו
  choice: saudaranya keluar
  rationale: Dalam konteks persalinan, יָצָא secara konkret berarti “keluar”; terjemahan ini tidak memperhalus gambaran fisiknya.
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: Betapa hebatnya engkau menerobos!
  rationale: Kalimat seru ini mempertahankan gagasan menerobos dari akar פרץ dan tetap alami dalam bahasa Indonesia. Unsur עָלֶיךָ sukar dipastikan nuansanya; kemungkinan “bagi dirimu sendiri” dicatat dalam catatan kaki agar ambiguitas sumber tidak diselesaikan secara diam-diam.
- source_word: פָּרֶץ
  choice: Peres
  rationale: Nama ini ditransliterasikan menurut pelafalan Ibrani yang lazim dalam bahasa Indonesia. Catatan kaki menjelaskan kaitannya dengan akar פרץ, “menerobos” atau “membuat celah”.
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: Maka anak itu dinamai Peres
  rationale: Rumus penamaan Ibrani memiliki pelaku gramatikal tunggal maskulin tetapi tidak menyebut identitasnya secara jelas. Bentuk pasif bahasa Indonesia menghindari penambahan subjek tertentu.
