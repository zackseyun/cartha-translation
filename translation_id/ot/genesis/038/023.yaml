base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: id
  text: Lalu Yehuda berkata, “Biarlah dia menyimpan barang-barang itu, supaya kita jangan menjadi bahan tertawaan.[a] Lihatlah, aku sudah mengirim anak kambing ini, tetapi engkau tidak menemukan perempuan itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi aib” atau “menjadi sasaran ejekan.” Ungkapan Ibrani menggambarkan keadaan menjadi objek penghinaan atau olok-olok.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: Biarlah dia menyimpan barang-barang itu
  rationale: 'Bentuk orang ketiga feminin dalam konteks ini bersifat permisif: Yehuda membiarkan perempuan itu menyimpan barang-barang jaminan. Objek yang tidak disebutkan dalam bahasa Ibrani dijelaskan dari konteks sebagai beberapa barang jaminan.'
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: supaya kita jangan menjadi bahan tertawaan
  rationale: Ungkapan ini menyatakan kekhawatiran bahwa mereka akan menjadi sasaran penghinaan atau ejekan; ‘bahan tertawaan’ menyampaikan dimensi sosialnya secara wajar dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada penegasan yang menyusul dan diterjemahkan dengan bentuk Indonesia yang alami serta tetap bermartabat.
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: aku sudah mengirim anak kambing ini
  rationale: גְּדִי berarti anak kambing, sedangkan penanda aspek ‘sudah’ secara alami menyampaikan tindakan lampau yang telah dilakukan dalam konteks percakapan.
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: tetapi engkau tidak menemukan perempuan itu
  rationale: Kata penghubung menyatakan kontras dengan tindakan Yehuda mengirim anak kambing. Akhiran feminin merujuk kepada perempuan yang dicari; penyebutan ‘perempuan itu’ menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions: []
