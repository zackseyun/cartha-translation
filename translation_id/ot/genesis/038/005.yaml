  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: id
  text: Ia melahirkan seorang anak laki-laki lagi dan menamainya Syela. Ia[a] berada di Kezib[b] ketika ia melahirkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, teks Ibrani berbunyi, “dia [laki-laki] berada.” Ini mungkin merujuk kepada Yehuda. Namun, beberapa saksi kuno dan penafsir memahami subjeknya sebagai perempuan itu: “Perempuan itu berada di Kezib ketika melahirkan Syela.”'
    reason: alternative_reading
  - marker: b
    text: Nama tempat ini dalam beberapa terjemahan juga dieja Khezib; kedua ejaan itu merujuk pada tempat yang sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: Ia melahirkan seorang anak laki-laki lagi
  rationale: Ungkapan יסף + עוד menyatakan tindakan yang berulang. Dalam konteks ini, bahasa Indonesia paling alami mengungkapkannya dengan menempatkan 'lagi' pada tindakan melahirkan, tanpa perlu menambahkan tindakan mengandung yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: dan menamainya Syela
  rationale: '''Menamainya'' merupakan padanan Indonesia yang alami dan tepat bagi ungkapan harfiah ''memanggil namanya''. Bentuk ''Syela'' mengikuti transliterasi nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.'
- source_word: וְהָיָה
  choice: Yehuda berada
  rationale: Bentuk verba Ibrani adalah maskulin tunggal, sehingga paling wajar merujuk kepada Yehuda sebagai tokoh laki-laki yang relevan dalam konteks. Nama Yehuda dinyatakan agar rujukannya jelas dalam bahasa Indonesia; ketidakpastian mengenai subjek tetap dicatat dalam catatan kaki.
- source_word: בִכְזִיב
  choice: di Kezib
  rationale: Preposisi 'di' merupakan bentuk lokasi yang alami dalam bahasa Indonesia. 'Kezib' mentransliterasikan nama tempat כזיב dengan bentuk yang sesuai bagi pembaca Indonesia.
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: ketika perempuan itu melahirkan Syela
  rationale: Infinitif dengan prefiks ב berfungsi temporal, yaitu 'ketika melahirkan'. Penyebutan 'perempuan itu' dan 'Syela' memperjelas dua pronomina Ibrani dalam bahasa Indonesia tanpa mengubah rujukannya dalam konteks.
theological_decisions:
- issue: Subjek klausa וְהָיָה בִכְזִיב
  choice: Yehuda berada di Kezib
  alternative: Perempuan itu berada di Kezib
  rationale: Teks Masoret memakai bentuk maskulin tunggal, yang mendukung rujukan kepada Yehuda. Namun, sejumlah saksi kuno dan penafsir memahami subjeknya sebagai perempuan itu; alternatif tersebut dipertahankan dalam catatan kaki agar ketegangan tekstual tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. Nama diri ditransliterasikan sebagai Syela, Yehuda, dan Kezib. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskannya.
