  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: id
  text: Kemudian, saudaranya keluar dengan benang merah tua pada tangannya[a]. Lalu ia menamainya Zerah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah hanya menyebut “merah tua” pada tangannya; kata “benang” dipasok dari konteks langsung dalam ayat 28.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Lalu ia memanggil namanya Zerah.” Subjek kata kerja tunggal maskulin itu tidak disebutkan secara eksplisit dalam ayat ini.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu sesudah kelahiran saudara kembarnya; ungkapan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: יָצָא
  choice: keluarlah
  rationale: Dalam konteks persalinan, bentuk ini secara alami menyatakan bahwa bayi itu keluar dari kandungan dan tetap mempertahankan urutan narasi.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Padanan langsung bagi istilah kekerabatan dengan sufiks orang ketiga tunggal, yang di sini menunjuk kepada saudara kembarnya.
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: yang pada tangannya ada benang merah tua
  rationale: Klausa relatif ini mengenali bayi melalui tanda yang telah diikatkan pada tangannya dalam ayat 28. Kata 'benang' dipasok dari konteks langsung karena teks ayat ini hanya menyebut 'merah tua' secara eliptis.
- source_word: הַשָּׁנִי
  choice: merah tua
  rationale: Menunjuk pada warna atau bahan kirmizi. 'Merah tua' mudah dipahami pembaca Indonesia, sedangkan nomina 'benang' berasal dari konteks ayat 28.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Lalu anak itu dinamai
  rationale: Bentuk pasif alami dalam bahasa Indonesia menghindari penetapan subjek yang tidak disebutkan secara eksplisit dalam ayat ini. Catatan kaki mempertahankan informasi bahwa bahasa Ibrani memakai bentuk aktif tunggal maskulin dan idiom 'memanggil namanya'.
- source_word: זָרַח
  choice: Zerah
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dipakai dalam bahasa Indonesia.
