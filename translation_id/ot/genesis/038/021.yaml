id: GEN.38.21
reference: Genesis 38:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: id
  text: Ia bertanya kepada orang-orang di tempat itu, “Di manakah pelacur ritual[a] yang berada di Enaim[b], di tepi jalan?” Mereka menjawab, “Tidak ada pelacur ritual di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang dipakai di sini berbeda dari kata umum untuk “pelacur” dalam ayat 15. Istilah ini secara tradisional dipahami sebagai perempuan yang terkait dengan praktik pemujaan, tetapi peran tepatnya tidak pasti. Terjemahan “pelacur kuil” juga mungkin, meskipun teks tidak menyebut bangunan kuil tertentu.
    reason: lexical_alternative
  - marker: b
    text: Enaim adalah nama tempat. Bentuk Ibraninya berkaitan dengan kata untuk “mata” dan mungkin juga “mata air”.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: Ia bertanya
  rationale: Bentuk naratif dari שׁאל menyatakan tindakan bertanya; pilihan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: orang-orang di tempat itu
  rationale: Ungkapan harfiahnya adalah ‘orang-orang lelaki di tempatnya’. Dalam konteks, maksudnya penduduk setempat; ‘orang-orang di tempat itu’ alami tanpa menentukan rujukan sufiks feminin secara berlebihan.
- source_word: לֵאמֹר
  choice: dinyatakan melalui tanda petik langsung
  rationale: Infinitif ini memperkenalkan ujaran langsung. Dalam bahasa Indonesia, fungsi tersebut lebih alami disampaikan dengan tanda baca daripada kata ‘katanya’ yang berlebihan setelah ‘bertanya’.
- source_word: הַקְּדֵשָׁה
  choice: pelacur ritual
  rationale: Istilah קְדֵשָׁה berbeda dari זֹנָה dan menunjukkan perempuan yang dipahami berkaitan dengan praktik pemujaan. ‘Pelacur ritual’ mempertahankan kaitan itu tanpa menyiratkan adanya bangunan kuil tertentu; catatan kaki menjaga ketidakpastian mengenai peran tepatnya.
- source_word: הִוא
  choice: yang berada
  rationale: Pronomina mandiri ini secara alami diserap ke dalam klausa relatif bahasa Indonesia yang mengidentifikasi perempuan yang dicari.
- source_word: בָעֵינַיִם
  choice: di Enaim
  rationale: Dalam konteks ini bentuk tersebut berfungsi sebagai nama tempat, sehingga ditransliterasikan dan tidak diterjemahkan secara harfiah sebagai ‘mata’ atau ‘mata air’.
- source_word: עַל הַדָּרֶךְ
  choice: di tepi jalan
  rationale: עַל dengan דֶּרֶךְ di sini menunjukkan lokasi di sisi jalan; ‘di tepi jalan’ jelas dan idiomatis.
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: Tidak ada pelacur ritual di sini
  rationale: Jawaban penduduk menyangkal keberadaan perempuan semacam itu di lokasi tersebut. Rumusan ini mempertahankan penyangkalan tanpa menambahkan cakupan waktu ‘tidak pernah’ yang tidak harus tersirat.
theological_decisions:
- issue: Identitas dan fungsi הַקְּדֵשָׁה
  choice: pelacur ritual
  alternative: perempuan bakti; pelacur kuil; pelacur
  rationale: Konteks mengaitkan perempuan itu dengan prostitusi, sedangkan istilah Ibrani mengandung kaitan dengan status atau praktik keagamaan. Terjemahan utama mempertahankan kedua unsur tersebut, sementara catatan kaki mengakui bahwa sifat persis perannya tidak pasti dan teks tidak menyebut sebuah kuil.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ujaran langsung dibuat alami tanpa mempertahankan לֵאמֹר sebagai ‘katanya’. Penanda catatan kaki ditempatkan tepat setelah istilah dan nama yang dijelaskan.
