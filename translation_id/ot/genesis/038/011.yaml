  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/תָמָ֨ר כַּלָּת֜/וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית אָבִ֗י/ךְ עַד יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔/י כִּ֣י אָמַ֔ר פֶּן יָמ֥וּת גַּם ה֖וּא כְּ/אֶחָ֑י/ו וַ/תֵּ֣לֶךְ תָּמָ֔ר וַ/תֵּ֖שֶׁב בֵּ֥ית אָבִֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: id
  text: Lalu Yehuda berkata kepada Tamar, menantunya, “Tinggallah sebagai janda di rumah ayahmu sampai Syela, anakku, dewasa.” Sebab ia berkata[a], “Jangan-jangan dia juga mati seperti saudara-saudaranya.” Maka Tamar pergi dan tinggal di rumah ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpikir,” sebab kata Ibrani yang berarti “berkata” juga dapat memperkenalkan pikiran dalam hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: Tinggallah sebagai janda
  rationale: Bentuk imperatif ישׁב memerintahkan Tamar untuk menetap, sedangkan אַלְמָנָה menyatakan statusnya sebagai janda. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: בֵית אָבִיךְ
  choice: di rumah ayahmu
  rationale: Menerjemahkan idiom tempat tinggal dalam rumah tangga pihak ayah secara lugas dan alami.
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: sampai Syela, anakku, dewasa
  rationale: Dalam konteks ini, יִגְדַּל menunjuk pada Syela yang mencapai kedewasaan. Susunan aposisi mempertahankan hubungan 'Syela, anakku' dalam bahasa Indonesia yang wajar.
- source_word: כִּי אָמַר
  choice: Sebab ia berkata
  rationale: Mempertahankan verba Ibrani אָמַר, 'berkata', tanpa menutup kemungkinan bahwa ini adalah ujaran batin; kemungkinan tersebut dijelaskan dalam catatan kaki.
- source_word: פֶּן
  choice: Jangan-jangan
  rationale: Menyampaikan kekhawatiran terhadap hasil yang mungkin terjadi dengan idiom Indonesia modern dan alami.
- source_word: כְּאֶחָיו
  choice: seperti saudara-saudaranya
  rationale: Mempertahankan istilah umum 'saudara-saudaranya' tanpa mempersempitnya menjadi 'kakak-kakaknya', meskipun konteks menunjukkan Er dan Onan lebih tua daripada Syela.
- source_word: וַתֵּשֶׁב
  choice: tinggal
  rationale: Dalam rangkaian naratif, verba ini menyatakan Tamar menetap di rumah ayahnya; 'tinggal' merupakan padanan Indonesia yang langsung dan alami.
- source_word: כַּלָּתוֹ
  choice: menantunya
  rationale: Padanan kekerabatan baku dan jelas bagi Tamar dalam hubungannya dengan Yehuda.
- source_word: בֵּית אָבִיהָ
  choice: di rumah ayahnya
  rationale: Menjaga kesejajaran dengan frasa sebelumnya dan menyampaikan tempat tinggal Tamar.
theological_decisions:
- issue: Apakah Yehuda mengucapkan atau hanya memikirkan kekhawatirannya
  choice: Teks utama memakai 'berkata'
  alternative: '''berpikir'' atau ''berkata dalam hatinya'''
  rationale: Bahasa Ibrani secara harfiah memakai אָמַר ('berkata'), tetapi verba itu dapat memperkenalkan penalaran batin. Teks utama mempertahankan bentuk sumber, sementara catatan kaki menjaga kemungkinan pembacaan internal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Jangan-jangan' dipilih untuk menyatakan kekhawatiran פֶּן secara alami; tanda baca dan aposisi dibuat jelas bagi pembaca umum.
