translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dipecah menjadi dua agar jelas dan alami. Semua penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
