base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: id
  text: Kemudian Firaun melepaskan cincin meterainya[a] dari jarinya dan memasangkannya pada jari Yusuf. Ia memakaikan Yusuf pakaian dari linen halus[b] dan mengalungkan perhiasan emas[c] pada lehernya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "cincin". Kata Ibrani ini dapat berarti cincin secara umum, tetapi dalam konteks kerajaan ini kemungkinan besar yang dimaksud adalah cincin meterai Firaun, lambang wewenang yang didelegasikan.
    reason: lexical_alternative
  - marker: b
    text: '"Linen halus" menerjemahkan kata Ibrani שֵׁשׁ, yaitu linen bermutu tinggi yang dikaitkan dengan kekayaan dan kehormatan.'
    reason: cultural_note
  - marker: c
    text: Atau "rantai emas", "kalung emas", atau "kerah emas". Bentuk tepat perhiasan leher yang dimaksud oleh istilah Ibrani ini tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: melepaskan
  rationale: Kata kerja ini berarti menyingkirkan atau melepaskan; dalam konteks cincin yang sedang dikenakan, 'melepaskan' paling alami.
- source_word: טַבַּעְתּוֹ
  choice: cincin meterainya
  rationale: Nomina ini dapat berarti cincin secara umum, tetapi konteks kerajaan menunjukkan cincin meterai yang melambangkan wewenang Firaun.
- source_word: מֵעַל יָדוֹ
  choice: dari jarinya
  rationale: Secara harfiah frasa ini berarti 'dari tangannya', tetapi dalam bahasa Indonesia cincin dikenakan pada jari; pilihan ini menyampaikan tindakan secara wajar.
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: dan memasangkannya pada jari Yusuf
  rationale: נתן berarti memberi atau menaruh; bersama cincin dan frasa 'pada tangan Yusuf', maksudnya ialah memasangkan cincin itu. 'Jari' merupakan ungkapan Indonesia yang alami.
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: Ia mengenakan ... kepada Yusuf
  rationale: Bentuk kausatif menyatakan bahwa Firaun menyuruh atau membuat Yusuf mengenakan pakaian; konstruksi ini mempertahankan nuansa penganugerahan resmi.
- source_word: בִּגְדֵי שֵׁשׁ
  choice: pakaian dari linen halus
  rationale: שֵׁשׁ menunjuk pada linen bermutu tinggi yang berkaitan dengan kekayaan dan kehormatan.
- source_word: רְבִד הַזָּהָב
  choice: perhiasan emas
  rationale: רְבִיד adalah perhiasan leher, tetapi bentuk tepatnya tidak pasti. Istilah umum ini mempertahankan ketidakpastian tanpa menentukan apakah benda itu rantai, kalung, atau kerah.
- source_word: עַל צַוָּארוֹ
  choice: pada lehernya
  rationale: Dengan verba 'mengalungkan', frasa ini alami dalam bahasa Indonesia dan tetap dekat dengan gambaran Ibrani.
