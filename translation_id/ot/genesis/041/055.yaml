  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: id
  text: Seluruh negeri Mesir mulai kelaparan, dan rakyat berseru kepada Firaun meminta roti. Firaun berkata kepada seluruh rakyat Mesir, “Pergilah kepada Yusuf. Lakukanlah apa yang dikatakannya kepada kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: mulai kelaparan
  rationale: Bentuk verba ini menyatakan timbulnya atau dialaminya kelaparan. “Mulai kelaparan” mempertahankan perkembangan narasi dan lebih alami daripada ungkapan harfiah “menjadi lapar” untuk sebuah negeri.
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: seluruh tanah Mesir
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, “tanah/negeri,” sambil memakai susunan Indonesia yang wajar.
- source_word: וַיִּצְעַק הָעָם
  choice: rakyat berseru
  rationale: צעק menunjukkan seruan kuat karena kesusahan atau untuk meminta pertolongan; “berseru” menyampaikan urgensinya tanpa tambahan tafsiran.
- source_word: לַלָּחֶם
  choice: meminta roti
  rationale: לֶחֶם secara leksikal berarti “roti,” meskipun dalam konteks ini dapat mewakili makanan atau bahan pangan secara umum. Pilihan ini menjaga transparansi terhadap teks sumber.
- source_word: לְכָל מִצְרַיִם
  choice: kepada seluruh rakyat Mesir
  rationale: Nama tempat dipakai secara kolektif untuk penduduknya. Dalam bahasa Indonesia, penyebutan “rakyat Mesir” menghindari kesan bahwa Firaun berbicara kepada wilayah geografis.
- source_word: לְכוּ אֶל יוֹסֵף
  choice: Pergilah kepada Yusuf
  rationale: Menerjemahkan imperatif dan preposisi secara langsung serta memakai bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: Lakukanlah apa yang dikatakannya kepada kalian
  rationale: Menyampaikan konstruksi Ibrani dengan jelas dan alami. Urutan objek yang didahulukan dalam bahasa Ibrani tidak dipaksakan ke dalam bahasa Indonesia karena akan terdengar kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Rakyat” dipilih untuk הָעָם dan pemakaian kolektif מִצְרַיִם; “kalian” menandai sasaran jamak dari לָכֶם secara alami.
