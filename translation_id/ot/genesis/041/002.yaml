  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: id
  text: Tampaklah, tujuh ekor sapi muncul dari Sungai Nil[a], elok dipandang dan gemuk, dan sedang merumput di rerumputan rawa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sungai”; dalam latar Mesir ini, istilah Ibraninya lazim menunjuk Sungai Nil.
    reason: lexical_alternative
  - marker: b
    text: Atau “di antara gelagah” atau “di rerumputan rawa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Mempertahankan penanda wacana yang mengarahkan perhatian dan menghidupkan adegan mimpi, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam latar Mesir, istilah ini secara khusus menunjuk Sungai Nil, bukan sekadar sungai umum.
- source_word: עֹלֹת
  choice: muncul
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung; dalam konteks keluar dari sungai, 'muncul' alami dan jelas.
- source_word: פָּרוֹת
  choice: sapi
  rationale: Kata ini menunjuk sapi betina; bahasa Indonesia lazim memakai 'sapi' tanpa harus menandai jenis kelamin ketika konteks tidak menuntutnya.
- source_word: יְפוֹת מַרְאֶה
  choice: elok dipandang
  rationale: Menyampaikan keindahan penampilan luar secara alami serta dekat dengan struktur dan makna ungkapan Ibrani.
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: gemuk
  rationale: Ungkapan Ibrani menekankan tubuh yang berisi atau gemuk; 'gemuk' ringkas, jelas, dan menjaga gambaran fisiknya.
- source_word: וַתִּרְעֶינָה
  choice: merumput
  rationale: Secara tepat menyatakan kegiatan makan rumput atau tumbuhan sebagaimana dilakukan sapi.
- source_word: בָּאָחוּ
  choice: di antara tumbuhan rawa
  rationale: Istilah ini menunjuk vegetasi rawa di sekitar Nil; pilihan ini mempertahankan latar tersebut tanpa membatasinya secara pasti pada gelagah.
