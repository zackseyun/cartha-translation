base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: id
  text: Firaun menamai Yusuf Zafnat-Pa'aneah[a], lalu memberikan kepadanya Asnat, anak perempuan Potifera, imam di On[b], sebagai istrinya. Kemudian Yusuf pergi ke seluruh tanah Mesir[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga ditulis “Zafnat-Paneah”. Nama Mesir ini tidak diketahui maknanya dengan pasti, dan terjemahan yang diusulkan beragam.
    reason: lexical_alternative
  - marker: b
    text: On adalah kota Mesir yang kemudian dikenal dalam bahasa Yunani sebagai Heliopolis.
    reason: cultural_note
  - marker: c
    text: Atau, “pergi melintasi seluruh tanah Mesir.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף
  choice: Firaun menamai Yusuf
  rationale: Ungkapan harfiah 'memanggil nama Yusuf' merupakan idiom penamaan; 'menamai Yusuf' menyampaikan tindakan resmi itu secara alami dalam bahasa Indonesia.
- source_word: צָפְנַת פַּעְנֵחַ
  choice: Zafnat-Pa'aneah
  rationale: Nama Mesir ini ditransliterasikan, bukan diterjemahkan, karena maknanya tidak pasti. Apostrof membantu menandai pemisahan vokal pada unsur kedua.
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת
  choice: lalu memberikan kepadanya Asnat
  rationale: Menerjemahkan נתן dengan objek tak langsung secara jelas dan mempertahankan urutan tindakan dalam teks sumber.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: anak perempuan Potifera
  rationale: Relasi kekerabatan diterjemahkan secara langsung, sedangkan nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: כֹּהֵן אֹן
  choice: imam di On
  rationale: כֹּהֵן berarti pejabat keagamaan atau imam. Preposisi 'di' secara alami menunjukkan tempat pelayanannya tanpa mengubah On menjadi nama Yunani yang lebih kemudian.
- source_word: לְאִשָּׁה
  choice: sebagai istrinya
  rationale: Ungkapan ini menyatakan bahwa Asnat diberikan untuk menjadi istri Yusuf; bentuk posesif memperjelas rujukan yang sudah tersirat dalam bahasa Ibrani.
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: Kemudian Yusuf pergi menjelajahi seluruh tanah Mesir
  rationale: יצא menyatakan bahwa Yusuf pergi keluar, sedangkan עַל dalam konteks tugas barunya kemungkinan menggambarkan pergerakan melintasi wilayah. 'Menjelajahi seluruh' menghasilkan bahasa Indonesia yang alami, dengan alternatif lebih formal dicatat dalam catatan kaki.
