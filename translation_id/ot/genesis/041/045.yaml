  to: Firaun menamai Yusuf Zafnat-Pa'aneah[a], lalu memberikan kepadanya Asnat, anak perempuan Potifera, imam di On[b], sebagai istrinya. Kemudian Yusuf pergi ke seluruh tanah Mesir[c].
