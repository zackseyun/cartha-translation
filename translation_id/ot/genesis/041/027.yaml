base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: id
  text: Ketujuh sapi kurus dan buruk yang muncul sesudah sapi-sapi itu adalah tujuh tahun, dan ketujuh malai yang kosong, yang hangus oleh angin timur, akan menjadi tujuh tahun kelaparan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: kurus
  rationale: Dalam gambaran tentang sapi, kata ini menunjukkan tubuh yang tidak berisi atau sangat kurang gemuk; “kurus” alami dan jelas dalam bahasa Indonesia modern.
- source_word: וְהָרָעֹת
  choice: dan buruk
  rationale: רַע di sini menggambarkan keadaan atau penampilan sapi yang tidak baik, bukan kejahatan moral. “Buruk” mempertahankan cakupan makna itu tanpa mempersempitnya menjadi sekadar “jelek”.
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: yang muncul sesudahnya
  rationale: Frasa ini menunjukkan bahwa sapi-sapi itu tampil kemudian dalam mimpi. “Muncul sesudahnya” menyampaikan urutan tersebut secara alami.
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: adalah tujuh tahun
  rationale: Klausa ini mengidentifikasi lambang dalam mimpi dengan kurun tujuh tahun; bentuk kopulatif langsung paling wajar dalam bahasa Indonesia.
- source_word: הַשִׁבֳּלִים
  choice: bulir gandum
  rationale: Kata ini merujuk pada bulir atau malai serealia. Dalam konteks Kejadian 41, “bulir gandum” jelas bagi pembaca umum dan selaras dengan gambaran pertanian.
- source_word: הָרֵקוֹת
  choice: kosong
  rationale: Untuk bulir gandum, kata ini menggambarkan bulir yang tidak berisi, sehingga “kosong” mempertahankan citra konkret teks.
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: yang hangus oleh angin timur
  rationale: Partisip pasif ini menggambarkan bulir yang rusak atau mengering akibat angin timur yang panas. “Hangus oleh angin timur” ringkas, jelas, dan mempertahankan hubungan penyebabnya.
- source_word: יִהְיוּ
  choice: akan menjadi
  rationale: Bentuk imperfek mengarah ke depan dalam penjelasan nubuat mimpi itu; “akan menjadi” mempertahankan daya prediktifnya.
- source_word: שְׁנֵי רָעָב
  choice: tahun kelaparan
  rationale: Frasa konstruksi ini berarti tahun-tahun yang ditandai oleh bencana kelaparan; “tahun kelaparan” adalah ungkapan Indonesia yang baku dan tepat dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan dua bagian ayat serta identifikasi simbolis dipertahankan. Tidak digunakan catatan kaki karena alternatif leksikal yang tersedia tidak diperlukan untuk memahami teks, dan catatan kaki bahasa Inggris pada penanda [a] tampak tidak selaras dengan letak penandanya.
