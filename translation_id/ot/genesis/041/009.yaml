base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: id
  text: Kemudian kepala juru minuman berkata kepada Firaun, “Hari ini aku teringat akan kesalahan-kesalahanku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dosa-dosaku” atau “pelanggaran-pelanggaranku.” Kata Ibrani ini dapat merujuk secara luas pada perbuatan salah, baik secara moral maupun dalam menjalankan jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berkata
  rationale: Waw-konsekutif melanjutkan alur cerita. “Kemudian” alami dalam narasi Indonesia, sedangkan “berkata” dengan tepat memperkenalkan ujaran.
- source_word: שַׂר הַמַּשְׁקִים
  choice: kepala juru minuman
  rationale: Gelar istana ini menunjuk pejabat yang mengepalai pelayanan minuman kepada Firaun. Pilihan ini jelas, modern, dan sesuai konteks istana.
- source_word: אֶת־פַּרְעֹה
  choice: kepada Firaun
  rationale: Partikel אֶת menandai objek; dalam bahasa Indonesia, verba “berkata” secara wajar diikuti “kepada” untuk menyebut lawan bicara.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Infinitif pengantar ujaran ini sudah terwakili secara alami oleh “berkata” dan tanda baca; menerjemahkannya lagi akan terasa berlebihan dalam bahasa Indonesia.
- source_word: אֶת חֲטָאַי
  choice: kesalahan-kesalahanku
  rationale: חטא dapat merujuk pada dosa, pelanggaran, atau kesalahan. Dalam konteks pengakuan seorang pejabat di hadapan Firaun, “kesalahan-kesalahanku” mempertahankan keluasan makna tanpa mempersempitnya menjadi istilah teologis saja.
- source_word: אֲנִי מַזְכִּיר
  choice: aku teringat akan
  rationale: Bentuk Hifil dari זכר dapat berarti menyebabkan ingat, menyebut, atau membawa ke ingatan. Dalam konteks ini, “aku teringat akan” menyampaikan bahwa ia kini mengingat kembali kesalahannya dan terdengar alami dalam bahasa Indonesia.
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Padanan langsung dan idiomatis yang mempertahankan penekanan waktu pada awal perkataan.
theological_decisions:
- issue: Cakupan makna חֲטָאַי
  choice: kesalahan-kesalahanku
  alternative: dosa-dosaku; pelanggaran-pelanggaranku
  rationale: Kata Ibrani ini dapat mencakup kesalahan moral maupun pelanggaran dalam jabatan. Teks utama memakai istilah Indonesia yang luas, sementara catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” cocok untuk ujaran langsung naratif, sedangkan “kepala juru minuman” mempertahankan nuansa jabatan istana tanpa memakai istilah arkais.
