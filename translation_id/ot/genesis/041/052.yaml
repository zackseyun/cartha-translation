  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: id
  text: Anak kedua dinamainya Efraim[a], karena Allah telah membuatku berbuah di negeri kesengsaraanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Efraim terdengar seperti ungkapan Ibrani yang berarti “telah membuat aku berbuah.”
    reason: Menjelaskan permainan kata Ibrani antara nama אֶפְרָיִם dan bentuk verbal הִפְרַנִי yang tidak sepenuhnya dapat dipertahankan dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי
  choice: Anak yang kedua dinamainya
  rationale: Ungkapan Ibrani secara harfiah menyebut ‘nama yang kedua’; dalam bahasa Indonesia, konteks menunjukkan bahwa yang dimaksud ialah anak kedua, sehingga bentuk ini alami dan jelas. Konjungsi וְ tidak diterjemahkan secara tersendiri karena ayat ini tetap mengalir wajar dari konteks sebelumnya tanpa ‘dan’ pembuka.
- source_word: קָרָא
  choice: dinamainya
  rationale: Dalam konteks pemberian nama, קרא berarti menamai. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan Yusuf sebagai pelaku.
- source_word: אֶפְרָיִם
  choice: Efraim
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: כִּי
  choice: sebab katanya
  rationale: כִּי memperkenalkan alasan pemberian nama. Tambahan ‘katanya’ memperjelas bahwa penjelasan orang pertama berikutnya merupakan ucapan atau alasan Yusuf, yang tersirat dalam struktur Ibrani.
- source_word: הִפְרַנִי
  choice: telah membuat aku berbuah
  rationale: Bentuk Hifil dari פרה menyatakan bahwa Allah menyebabkan Yusuf berbuah. Pilihan ‘berbuah’ mempertahankan permainan bunyi dan makna dengan nama Efraim serta lebih dekat pada sumber daripada ‘membuat aku berhasil’.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk nomina ini secara morfologis jamak, konstruksi dan konteks menunjuk kepada Allah Israel sebagai pelaku tunggal.
- source_word: בְּאֶרֶץ
  choice: di negeri
  rationale: ‘Negeri’ merupakan padanan alami untuk wilayah tempat Yusuf tinggal, yaitu Mesir, dan tetap mempertahankan nuansa geografis אֶרֶץ.
- source_word: עָנְיִי
  choice: kesengsaraanku
  rationale: Kata ini menunjuk pada penderitaan, kesusahan, atau keadaan tertindas. ‘Kesengsaraan’ menyampaikan bobot pengalaman Yusuf tanpa menentukan secara sempit penderitaan mana yang dimaksud.
theological_decisions:
- issue: Makna penjelasan Yusuf atas nama Efraim
  choice: Yusuf mengakui bahwa Allah membuatnya berbuah, tetapi tetap menyebut tempat itu sebagai negeri kesengsaraannya.
  alternative: Kesengsaraan itu hanya merujuk pada penderitaan Yusuf sebelum kedudukannya ditinggikan di Mesir, atau secara lebih luas pada keterasingannya dari keluarga.
  rationale: Teks menyandingkan tindakan Allah yang memberi keberhasilan dengan ingatan Yusuf akan kesengsaraan. Terjemahan mempertahankan ketegangan ini dan tidak mempersempit cakupan ‘kesengsaraanku’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan permainan kata melalui ‘berbuah’ dan menjelaskannya dalam catatan kaki.
