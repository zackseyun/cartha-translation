  source_fidelity: Terjemahan dengan tepat mempertahankan aspek inkoatif dalam וַתְּחִלֶּינָה ... לָבוֹא (“mulai datang”), konstruksi “tujuh tahun kelaparan,” kesesuaian dengan perkataan Yusuf, bentuk jamak “semua negeri,” serta kontras antara kelaparan di berbagai negeri dan adanya roti di Mesir. “Tersedia roti” menyampaikan secara wajar klausa eksistensial הָיָה לָחֶם tanpa mengubah maknanya.
  naturalness: Bahasa Indonesia baku, lancar, dan sesuai register naratif. “Tujuh tahun kelaparan itu pun mulai datang” dan “Kelaparan terjadi di semua negeri” terdengar alami. “Tetapi” secara tepat mengungkapkan kontras kontekstual yang juga dicerminkan dalam audit trail Inggris.
  terminology: Nama “Yusuf” tepat. “Kelaparan,” “negeri,” dan “tanah Mesir” konsisten dengan konteks geografis dan naratif. “Roti” mempertahankan leksikon Ibrani לֶחֶם, sedangkan catatan kaki dengan tepat mencatat kemungkinan arti yang lebih luas, yaitu makanan atau persediaan pangan.
