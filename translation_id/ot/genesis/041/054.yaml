  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: id
  text: Tujuh tahun kelaparan itu pun mulai datang, seperti yang telah dikatakan Yusuf. Kelaparan terjadi di semua negeri, tetapi di seluruh tanah Mesir tersedia roti.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tersedia makanan”; kata Ibrani yang berarti “roti” juga dapat merujuk secara lebih luas pada makanan atau persediaan pangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: mulai datang
  rationale: Mempertahankan gambaran inkoatif dan verba gerak dalam bahasa Ibrani, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: tujuh tahun kelaparan itu
  rationale: Menyampaikan rantai konstruksi Ibrani secara jelas; kata 'itu' menandai masa kelaparan yang sebelumnya telah dinubuatkan.
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: seperti yang telah dikatakan Yusuf
  rationale: Bentuk 'telah dikatakan' memperjelas bahwa perkataan Yusuf mendahului peristiwa ini tanpa mengubah hubungan kesesuaiannya.
- source_word: וַיְהִי רָעָב
  choice: kelaparan terjadi
  rationale: Padanan eksistensial yang alami dalam narasi Indonesia dan tidak menambah intensitas yang tidak terdapat dalam teks.
- source_word: בְּכָל הָאֲרָצוֹת
  choice: di semua negeri
  rationale: Menjaga bentuk jamak אֲרָצוֹת dan menghindari nuansa politik modern yang dapat muncul dari kata 'negara'.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: tetapi di seluruh tanah Mesir
  rationale: Walaupun וּ secara formal berarti 'dan', konteks menunjukkan pertentangan antara kelaparan di negeri-negeri lain dan tersedianya pangan di Mesir; 'tanah Mesir' mempertahankan istilah geografis teks.
- source_word: הָיָה לָחֶם
  choice: tersedia roti
  rationale: Kata 'tersedia' mengungkapkan konstruksi eksistensial secara alami, sedangkan 'roti' mempertahankan makna konkret לֶחֶם; cakupan makna yang lebih luas dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Konjungsi 'tetapi' dipakai untuk menyatakan pertentangan yang tersirat dalam konteks, dan penanda catatan kaki ditempatkan setelah 'roti', yaitu kata yang dijelaskan.
