base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: id
  text: Makanan itu akan menjadi persediaan bagi negeri ini untuk menghadapi tujuh tahun kelaparan yang akan terjadi di tanah Mesir, supaya negeri ini tidak binasa karena kelaparan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: harus menjadi
  rationale: Bentuk perfektum dengan waw dalam konteks usulan kebijakan ini menyatakan hasil yang dimaksudkan; 'harus menjadi' menyampaikan fungsi yang ditetapkan secara alami dalam bahasa Indonesia.
- source_word: הָאֹכֶל
  choice: makanan itu
  rationale: אֹכֶל berarti makanan secara luas, dan 'itu' menunjuk kembali kepada hasil panen yang dikumpulkan dalam ayat sebelumnya tanpa mempersempitnya menjadi gandum.
- source_word: לְפִקָּדוֹן
  choice: persediaan
  rationale: Kata ini menunjuk pada sesuatu yang disimpan atau dititipkan untuk keperluan kemudian; 'persediaan' paling alami dalam konteks penyimpanan pangan negara.
- source_word: לָאָרֶץ
  choice: bagi negeri ini
  rationale: אֶרֶץ di sini adalah negeri Mesir sebagai wilayah dan masyarakat politiknya. 'Negeri ini' alami dalam ucapan Yusuf kepada Firaun dan mempertahankan acuan lokal.
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: untuk menghadapi tujuh tahun kelaparan
  rationale: Lamed menyatakan peruntukan persediaan bagi masa kelaparan yang akan datang. 'Untuk menghadapi' menghindari rangkaian preposisi yang kaku sambil mempertahankan hubungan tujuan.
- source_word: אֲשֶׁר תִּהְיֶיןָ
  choice: yang akan terjadi
  rationale: Klausa relatif menunjuk pada masa kelaparan yang akan berlangsung pada masa depan.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Ungkapan ini mempertahankan bentuk lengkap bahasa Ibrani dan membedakannya secara wajar dari 'negeri ini' dalam bahasa Indonesia.
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: supaya negeri ini tidak binasa
  rationale: Nifal כרת secara harfiah berarti 'terputus' atau 'dilenyapkan', tetapi bila subjeknya sebuah negeri yang dilanda kelaparan, 'tidak binasa' menyampaikan akibat kontekstual dengan jelas dan alami.
- source_word: בָּרָעָב
  choice: karena kelaparan
  rationale: Preposisi bet di sini menyatakan sebab atau sarana; 'karena' merupakan ungkapan Indonesia yang paling alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan mempertahankan cakupan umum 'makanan', pengulangan gagasan negeri/tanah, serta tujuan administratif perkataan Yusuf, sambil menghindari ungkapan harfiah yang tidak alami seperti 'negeri itu terputus'.
