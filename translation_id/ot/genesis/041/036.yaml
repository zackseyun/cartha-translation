  to: Makanan itu akan menjadi persediaan bagi negeri ini untuk menghadapi tujuh tahun kelaparan yang akan terjadi di tanah Mesir, supaya negeri ini tidak binasa karena kelaparan.
  rationale: Mengganti “harus menjadi” dengan “akan menjadi” memulihkan nilai futuris-prediktif dari וְהָיָה tanpa mengubah makna kebijakan penyimpanan pangan. Tidak diperlukan catatan kaki, karena terjemahan yang direvisi tidak memakai pilihan harfiah yang berpotensi membingungkan.
