base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: id
  text: Tangkai-tangkai bulir yang kurus itu menelan ketujuh tangkai bulir yang baik[a]. Lalu aku menceritakannya kepada para ahli sihir[b], tetapi tidak ada seorang pun yang dapat menjelaskan maknanya kepadaku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malai-malai yang baik.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk pada para spesialis ritual atau penafsir mimpi di Mesir.
    reason: cultural_note
  - marker: c
    text: Atau, “tetapi tidak ada seorang pun yang dapat menafsirkannya bagiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: menelan
  rationale: Kata kerja בלע menggambarkan secara hidup bulir-bulir kurus yang memakan bulir-bulir baik; 'menelan' alami dalam bahasa Indonesia dan mempertahankan gambaran mimpi itu.
- source_word: שִׁבֳּלִים
  choice: bulir-bulir
  rationale: Dalam konteks pertanian, kata ini menunjuk pada bulir atau malai tempat biji-bijian tumbuh. 'Bulir-bulir' ringkas dan mudah dipahami, sedangkan jenis tanamannya tidak disebutkan dalam ayat ini.
- source_word: הַדַּקֹּת
  choice: yang kurus
  rationale: דק berarti tipis atau kurus. Untuk bulir yang dikontraskan dengan bulir baik, 'kurus' menyampaikan keadaan yang tidak berisi tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: הַטֹּבוֹת
  choice: yang baik
  rationale: טוב secara langsung berarti 'baik'. Pilihan ini mempertahankan keluasan istilah Ibrani tanpa mempersempitnya menjadi 'sehat' atau 'berisi'.
- source_word: וָאֹמַר אֶל
  choice: Lalu aku menceritakannya kepada
  rationale: Secara harfiah konstruksi ini berarti 'lalu aku berkata kepada'. Dalam konteks ini Firaun sedang menyampaikan bahwa ia telah menuturkan mimpinya; 'menceritakannya kepada' menjadikan maksud tersirat itu alami dalam bahasa Indonesia.
- source_word: הַחַרְטֻמִּים
  choice: para ahli ilmu gaib
  rationale: Istilah ini menunjuk pada kalangan spesialis ritual dan penafsir mimpi Mesir, bukan pesulap panggung. 'Para ahli ilmu gaib' menghindari salah pengertian modern sambil mempertahankan latar budaya Mesir.
- source_word: וְאֵין מַגִּיד לִי
  choice: tetapi tidak ada seorang pun yang dapat menjelaskan maknanya kepadaku
  rationale: Partisip נגד di sini berarti memberitahukan atau menerangkan arti mimpi. 'Menjelaskan maknanya' menyatakan fungsi kontekstual tersebut, sementara catatan kaki mempertahankan kemungkinan terjemahan 'menafsirkannya'.
