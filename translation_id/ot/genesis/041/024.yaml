translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan 'bulir-bulir' mempertahankan citra dan pola sumber. Bentuk orang pertama 'aku' sesuai dengan tuturan langsung Firaun. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
