  source_fidelity: 'Makna utama sudah dekat dengan Ibrani. אולם, שִׁבֳּלִים dalam konteks ini lebih tepat diterjemahkan "tangkai-tangkai bulir" atau "malai-malai" daripada "bulir-bulir" saja: yang dimakan dalam gambaran mimpi adalah bulir/untaian gandum sebagai satuan, bukan butiran biji individual. "Menceritakannya" dan "menjelaskan maknanya" merupakan pengungkapan kontekstual yang dapat diterima untuk tindakan Firaun dan fungsi מַגִּיד.'
  naturalness: Teksnya umumnya baku dan lancar. "Tangkai-tangkai bulir yang kurus" terdengar lebih jelas dalam bahasa Indonesia modern daripada "bulir-bulir yang kurus", yang dapat membayangkan biji-biji individual. "Para ahli ilmu gaib" dapat dipahami, tetapi bernuansa cukup luas dan modern; "para ahli sihir" adalah padanan yang lebih lazim untuk חַרְטֻמִּים, dengan catatan budaya yang menjelaskan cakupan ritual dan penafsiran mimpi.
  terminology: '"Ahli sihir" dengan catatan budaya mempertahankan istilah naratif yang umum tanpa menyamakan mereka dengan pesulap panggung. Catatan a draft keliru karena mengubah alternatif leksikal menjadi jenis tanaman tertentu ("gandum"), padahal Ibrani tidak menyebut spesies gandum. Catatan a perlu menyajikan alternatif "malai-malai" atau "bulir-bulir".'
