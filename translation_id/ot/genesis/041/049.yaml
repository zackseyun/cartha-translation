  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: id
  text: Yusuf menimbun biji-bijian dalam jumlah yang sangat besar, sebanyak pasir di tepi laut, sampai ia berhenti menghitungnya, sebab jumlahnya tidak terhitung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebab tidak ada jumlah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: menimbun
  rationale: Kata צבר menyatakan tindakan mengumpulkan hingga bertumpuk; dalam konteks penyimpanan hasil panen, “menimbun” alami dan mempertahankan gambaran akumulasi.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: “Yusuf” adalah bentuk baku nama ini dalam bahasa Indonesia dan langsung dikenali pembaca modern.
- source_word: בָּר
  choice: gandum
  rationale: בָּר merujuk pada biji-bijian pangan. “Gandum” merupakan padanan Indonesia yang lazim dalam konteks kisah ini, tanpa mengharuskan pembacaan sebagai satu varietas botanis tertentu.
- source_word: כְּחוֹל הַיָּם
  choice: sebanyak pasir di laut
  rationale: Ungkapan ini mempertahankan perbandingan Ibrani tentang jumlah yang amat besar dalam susunan Indonesia yang alami.
- source_word: הַרְבֵּה מְאֹד
  choice: sangat berlimpah
  rationale: Padanan ini mempertahankan penguatan ganda mengenai banyaknya persediaan tanpa susunan yang janggal.
- source_word: עַד כִּי
  choice: sampai
  rationale: Dalam konteks ini frasa tersebut menandai batas atau akibat yang dicapai oleh penimbunan.
- source_word: חָדַל לִסְפֹּר
  choice: ia berhenti menghitungnya
  rationale: Subjek tunggal paling wajar merujuk kembali kepada Yusuf; objek “-nya” dibuat eksplisit agar kalimat Indonesia jelas.
- source_word: כִּי אֵין מִסְפָּר
  choice: sebab jumlahnya tidak terhitung
  rationale: Ini menyampaikan idiom harfiah “tidak ada bilangan/jumlah” secara alami sambil mempertahankan alasan berhentinya penghitungan.
