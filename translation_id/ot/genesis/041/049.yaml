  terminology: “Yusuf” merupakan bentuk nama yang baku dan wajar dalam bahasa Indonesia. “Biji-bijian” menjaga keluasan makna בָּר. Catatan kaki dipindahkan ke klausa yang dijelaskannya dan mempertahankan idiom Ibrani tanpa memaksakan penafsiran tambahan.
