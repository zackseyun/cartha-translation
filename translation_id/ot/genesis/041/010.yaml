  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: id
  text: Firaun marah kepada hamba-hambanya, lalu ia menempatkan aku dalam tahanan di rumah kepala pengawal[a]—aku dan kepala juru roti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, gelar ini dapat diterjemahkan “kepala para penyembelih” atau “kepala para algojo.”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: murka
  rationale: Dalam konteks kemarahan raja terhadap para pelayan istana, “murka” secara alami menyampaikan kemarahan seorang penguasa tanpa harus memakai ungkapan yang berlebihan.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: Istilah ini mempertahankan hubungan pelayanan dan ketundukan kepada Firaun; dalam konteks ini yang dimaksud ialah para pelayan atau pejabat istana, bukan semata-mata budak.
- source_word: בְּמִשְׁמַר
  choice: menahan
  rationale: Nomina Ibrani menunjuk pada keadaan dijaga atau dikurung. Bentuk verbal “menahan” menghasilkan bahasa Indonesia yang alami tanpa menentukan bahwa tempat itu merupakan bangunan penjara resmi.
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: di rumah kepala pengawal
  rationale: Ungkapan ini adalah gelar jabatan istana. “Kepala pengawal” sesuai dengan fungsi tokoh dalam kisah Yusuf, sedangkan arti harfiahnya yang berkaitan dengan penyembelih atau algojo dijelaskan dalam catatan kaki.
- source_word: שַׂר הָאֹפִים
  choice: kepala juru roti
  rationale: Frasa ini menunjuk pada orang yang mengepalai para pembuat roti istana; “kepala juru roti” ringkas, jelas, dan lazim dalam bahasa Indonesia.
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: aku dan kepala juru roti
  rationale: Susunan ini mempertahankan kedua orang sebagai objek tindakan Firaun, sedangkan tanda pisah mencerminkan pengulangan “aku” yang menonjol dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Firaun” mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia; “murka” sesuai dengan konteks kerajaan. Terjemahan menghindari kata “penjara” karena istilah Ibrani hanya memastikan penahanan di bawah penjagaan.
