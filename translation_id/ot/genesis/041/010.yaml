  naturalness: '"Firaun murka kepada hamba-hambanya" dapat dipahami, tetapi "marah kepada" lebih lazim dalam bahasa Indonesia modern dan cukup mewakili קצף. "Ia menahan aku di rumah ..." dapat diperbaiki menjadi "menempatkan aku dalam tahanan di rumah ..." agar idiomatis dan eksplisit.'
