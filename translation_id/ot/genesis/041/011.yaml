  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: id
  text: Pada malam yang sama, aku dan dia sama-sama bermimpi; mimpi masing-masing sesuai dengan tafsirannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Kami bermimpi sebuah mimpi pada satu malam, aku dan dia; masing-masing, menurut tafsiran mimpinya, kami bermimpi.”'
    reason: Bentuk Ibrani memakai objek serumpun (“bermimpi sebuah mimpi”) dan susunan distributif yang tidak lazim bila diterjemahkan kata demi kata ke dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: kami masing-masing bermimpi
  rationale: Gabungan verba dan objek serumpun secara harfiah berarti ‘kami memimpikan sebuah mimpi’. Dalam bahasa Indonesia, ‘bermimpi’ lebih alami; unsur jamak dan pembagian kepada kedua orang dipertahankan melalui ‘aku dan dia masing-masing’.
- source_word: בְּלַיְלָה אֶחָד
  choice: pada malam yang sama
  rationale: Secara harfiah ‘pada satu malam’; dalam konteks, frasa ini menekankan bahwa kedua mimpi terjadi pada malam yang sama.
- source_word: אֲנִי וָהוּא
  choice: aku dan dia
  rationale: Mempertahankan urutan dan penegasan eksplisit kedua pelaku dalam bahasa Indonesia yang wajar.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif, yakni setiap orang dari kedua laki-laki itu.
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: sesuai dengan artinya
  rationale: כְּ menyatakan kesesuaian, sedangkan פִּתְרוֹן menunjuk pada arti atau tafsiran mimpi. ‘Artinya’ alami dalam konteks mimpi dan mempertahankan hubungan tiap mimpi dengan penafsirannya.
- source_word: חָלָמְנוּ
  choice: mimpi kami masing-masing
  rationale: Verba penutup melanjutkan konstruksi distributif yang sulit dipertahankan secara harfiah dalam bahasa Indonesia. Susunan ini memperjelas bahwa setiap orang mendapat mimpi tersendiri yang sesuai dengan artinya.
