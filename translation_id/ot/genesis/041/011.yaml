translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada naratif yang bermartabat. ‘Aku’ dipakai karena penutur berbicara kepada Firaun tentang dirinya dan seorang rekan; susunan kalimat dibuat alami tanpa menghapus penekanan bahwa kedua mimpi terjadi pada malam yang sama dan masing-masing memiliki arti tersendiri.
