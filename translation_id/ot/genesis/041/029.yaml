  text: Lihatlah, tujuh tahun dengan kelimpahan besar akan datang di seluruh tanah Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian kepada pernyataan yang segera disampaikan. “Ketahuilah” mempertahankan daya penegasnya dalam bahasa Indonesia modern yang wajar dan bermartabat.
- source_word: שֶׁבַע שָׁנִים
  choice: tujuh tahun
  rationale: Ungkapan bilangan dan waktu ini diterjemahkan secara langsung.
- source_word: בָּאוֹת
  choice: akan datang
  rationale: Partisipel feminin jamak yang bersesuaian dengan “tahun” menggambarkan masa itu sebagai sedang mendekat; bentuk futur ini paling alami dalam bahasa Indonesia.
- source_word: שָׂבָע גָּדוֹל
  choice: dengan kelimpahan besar
  rationale: שָׂבָע dalam konteks kisah Yusuf menunjuk pada persediaan pangan atau hasil bumi yang melimpah, sedangkan גָּדוֹל menguatkan derajat kelimpahan itu. “Dengan kelimpahan besar” juga mempertahankan hubungan sintaksis Ibrani tanpa memaksanya menjadi frasa atributif.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: Frasa ini menyatakan cakupan atas seluruh wilayah Mesir; “di seluruh” menyampaikan daya distributifnya secara alami.
