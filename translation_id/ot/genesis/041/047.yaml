translation:
  language: id
  text: Selama tujuh tahun kelimpahan, tanah itu menghasilkan segenggam demi segenggam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam genggaman-genggaman.” Kata Ibrani ini secara harfiah berkaitan dengan “genggaman” atau “segenggam”; dalam konteks ini ungkapan tersebut menggambarkan hasil tanah yang berlimpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: menghasilkan panen
  rationale: Kata kerja עשה pada dasarnya berarti ‘melakukan’ atau ‘membuat’, tetapi ketika subjeknya adalah tanah dalam konteks pertanian, maknanya ialah menghasilkan panen. Penambahan ‘panen’ membuat ungkapan ini wajar dan jelas dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Dalam konteks kisah Yusuf, frasa ini menunjuk pada tanah pertanian di Mesir, bukan seluruh bumi. ‘Tanah itu’ mempertahankan acuan yang sudah dikenal dalam konteks.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: selama tujuh tahun kelimpahan
  rationale: Kata שׂבע menyatakan keadaan berlimpah atau berkecukupan. ‘Tujuh tahun kelimpahan’ sesuai dengan periode yang telah dinubuatkan melalui mimpi Firaun.
- source_word: לִקְמָצִים
  choice: bergenggam-genggam
  rationale: Bentuk jamak קְמָצִים berarti ‘genggaman-genggaman’ atau ‘segenggam-segenggam’. Pilihan ini mempertahankan gambaran konkret dan ungkapan Ibrani yang tidak lazim, sambil menyampaikan banyaknya hasil panen.
