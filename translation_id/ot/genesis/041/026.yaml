  text: שֶׁ֧בַע פָּרֹ֣ת הַ/טֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְ/שֶׁ֤בַע הַֽ/שִּׁבֳּלִים֙ הַ/טֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: id
  text: Ketujuh sapi yang baik itu adalah tujuh tahun, dan ketujuh bulir gandum yang baik[a] itu adalah tujuh tahun. Itu adalah satu mimpi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kepala-kepala gandum.” Istilah Ibrani ini menunjuk pada bagian paling atas tangkai tempat biji-biji gandum tumbuh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹת
  choice: sapi
  rationale: Kata ini secara khusus menunjuk pada sapi betina dalam mimpi Firaun. Dalam bahasa Indonesia, “sapi” sudah alami dan cukup tepat tanpa harus menambahkan “betina” dalam kalimat penjelasan ini.
- source_word: הַטֹּבֹת
  choice: yang baik
  rationale: Mempertahankan arti umum adjektiva Ibrani dan korespondensi langsung dengan gambaran dalam mimpi, tanpa mempersempitnya menjadi sekadar sehat atau elok.
- source_word: שָׁנִים
  choice: tahun
  rationale: Padanan langsung; Yusuf secara eksplisit menafsirkan lambang-lambang dalam mimpi sebagai tahun.
- source_word: שִׁבֳּלִים
  choice: bulir gandum
  rationale: Istilah ini menunjuk pada bagian tangkai yang memuat biji-biji gandum. “Bulir gandum” merupakan ungkapan Indonesia yang ringkas dan lazim dalam konteks Alkitab.
- source_word: הֵנָּה
  choice: adalah
  rationale: Pronomina feminin jamak ini berfungsi sebagai unsur kopulatif. Bahasa Indonesia mengungkapkannya secara alami dengan “adalah”.
- source_word: חֲלוֹם אֶחָד הוּא
  choice: Itu adalah satu mimpi
  rationale: Mempertahankan bentuk tunggal dan penekanan bahwa kedua rangkaian lambang menyampaikan satu mimpi yang terpadu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pengulangan “adalah tujuh tahun” dipertahankan untuk mencerminkan kesejajaran struktur Ibrani. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
