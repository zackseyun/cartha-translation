  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: id
  text: Tampaklah tujuh ekor sapi naik dari Sungai Nil[a], sehat dan berisi[b], serta indah bentuknya. Sapi-sapi itu merumput di tengah rumput rawa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dari sungai"; dalam konteks Mesir ini, kata Ibrani יְאֹר paling wajar menunjuk kepada Sungai Nil.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "sehat pada dagingnya"; dapat juga dipahami sebagai "gemuk" atau "bertubuh penuh".
    reason: lexical_alternative
  - marker: c
    text: Atau "di antara tumbuhan rawa" atau "di antara gelagah"; kata Ibrani ini mengacu pada tumbuhan lahan basah di tepi Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu tampaklah
  rationale: Mempertahankan penanda wacana yang menghidupkan adegan mimpi dan menyatakan sesuatu yang tiba-tiba terlihat, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: מִן הַיְאֹר
  choice: dari Sungai Nil
  rationale: Dalam latar Mesir, יְאֹר secara alami menunjuk kepada Sungai Nil, bukan sekadar sungai umum.
- source_word: עֹלֹת
  choice: muncul
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung dalam adegan mimpi. 'Muncul' menyampaikan gerak naik keluar dari sungai secara alami dalam bahasa Indonesia.
- source_word: שֶׁבַע פָּרוֹת
  choice: tujuh ekor sapi
  rationale: פָּרוֹת secara khusus berarti sapi betina; kata penggolong 'ekor' menghasilkan ungkapan Indonesia yang alami.
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: sehat dan berisi
  rationale: Ungkapan ini mempertahankan gagasan tubuh yang sehat, penuh, atau tambun tanpa membatasinya hanya pada kegemukan maupun sebab berupa cukup makan.
- source_word: וִיפֹת תֹּאַר
  choice: elok perawakannya
  rationale: Menyampaikan keindahan bentuk atau penampilan tubuh dengan bahasa Indonesia yang alami serta dekat dengan citra sumber.
- source_word: וַתִּרְעֶינָה
  choice: merumput
  rationale: Kata kerja רעה di sini menggambarkan sapi yang makan rumput atau tumbuhan rawa.
- source_word: בָּאָחוּ
  choice: di tengah rumput rawa
  rationale: Istilah ini menunjuk kepada tumbuhan lahan basah di tepi Sungai Nil; 'rumput rawa' mempertahankan latar tersebut tanpa menyempitkannya secara pasti menjadi gelagah.
