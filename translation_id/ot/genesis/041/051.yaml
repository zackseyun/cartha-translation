  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: id
  text: Yusuf menamai anak sulungnya Manasye[a], sebab katanya, “Allah telah membuatku melupakan segala kesusahanku[b] dan seluruh keluarga ayahku[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Manasye terdengar mirip dengan kata Ibrani yang berarti ‘membuat lupa’ atau ‘menyebabkan orang melupakan’.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan ‘segala penderitaanku’ atau ‘segala jerih payahku’.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, ‘seluruh rumah ayahku’; ungkapan Ibrani ini menunjuk kepada keluarga atau rumah tangga dari pihak ayah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַבְּכוֹר
  choice: menamai anak sulungnya
  rationale: Ungkapan Ibrani harfiah ‘memanggil nama anak sulung’ secara idiomatis berarti memberi nama. ‘Menamai anak sulungnya’ alami dalam bahasa Indonesia dan tetap mempertahankan keterangan bahwa anak itu adalah anak sulung.
- source_word: מְנַשֶּׁה
  choice: Manasye
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Hubungan bunyinya dengan kata kerja ‘membuat ... melupakan’ dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab katanya
  rationale: Konjungsi ini memperkenalkan alasan pemberian nama. Kata ‘katanya’ membuat peralihan kepada ucapan Yusuf jelas dan wajar tanpa mengubah fungsi kausalnya.
- source_word: נַשַּׁנִי
  choice: telah membuatku melupakan
  rationale: 'Bentuk ini menyatakan sebab: Allah membuat Yusuf lupa. Pilihan ini juga mempertahankan gema makna antara kata kerja tersebut dan nama Manasye.'
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Konteks dan bentuk verba menunjukkan rujukan tunggal kepada Allah; ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: כָּל עֲמָלִי
  choice: segala kesusahanku
  rationale: עָמָל dapat berarti kesusahan, penderitaan, atau jerih payah. ‘Kesusahan’ cukup luas untuk mencakup pengalaman berat Yusuf tanpa mempersempitnya hanya pada kerja keras.
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: dan seluruh keluarga ayahku
  rationale: ‘Rumah ayah’ adalah ungkapan kekerabatan Ibrani yang menunjuk keluarga atau rumah tangga dari garis ayah. ‘Seluruh keluarga ayahku’ menyampaikan makna itu secara alami, sambil mempertahankan ketegangan bahwa Yusuf berkata Allah membuatnya melupakan mereka.
theological_decisions:
- issue: Pernyataan bahwa Yusuf melupakan keluarga ayahnya
  choice: Menerjemahkan pernyataan Yusuf secara langsung tanpa melunakkan ‘melupakan’ atau mengubah objeknya.
  alternative: Menafsirkan bahwa hanya rasa sakit yang berkaitan dengan keluarga ayahnya telah terlupakan, atau bahwa perkataan itu sekadar ungkapan hiperbolis tentang kelegaan.
  rationale: Teks Ibrani secara langsung menyatakan bahwa Allah membuat Yusuf melupakan segala kesusahannya dan seluruh keluarga ayahnya. Terjemahan mempertahankan ketegangan naratif dan teologis ini tanpa harmonisasi penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan permainan kata pada nama Manasye dan ungkapan kekerabatan Ibrani dipertahankan melalui catatan kaki.
