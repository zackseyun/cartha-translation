  yaml_path: translation/ot/genesis/041/013.yaml
  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: id
  text: 'Dan tepat seperti ia menafsirkan mimpi kami, demikianlah yang terjadi: aku ia kembalikan ke kedudukanku[a], tetapi dia ia gantung[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jabatanku” atau “posku”; ungkapan Ibrani ini menunjuk pada pemulihan ke posisi resminya semula.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani berarti “menggantung.” Ayat ini tidak menjelaskan lebih lanjut cara maupun urutan pelaksanaan hukuman.
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיְהִי ... כֵּן הָיָה
  choice: Dan ... demikianlah yang terjadi
  rationale: Ungkapan berpasangan ini menegaskan bahwa hasilnya tepat sesuai dengan penafsiran. Susunan ini mempertahankan penegasan Ibrani tanpa pengulangan yang kaku dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר פָּתַר לָנוּ
  choice: seperti yang ditafsirkannya bagi kami
  rationale: Dalam konteks mimpi, פָּתַר berarti menafsirkan atau menguraikan makna mimpi. Bentuk -nya mempertahankan pelaku yang sudah diketahui dari konteks tanpa menyebut namanya secara eksplisit.
- source_word: אֹתִי הֵשִׁיב עַל כַּנִּי
  choice: aku dikembalikan ke jabatanku
  rationale: כַּן di sini menunjuk pada kedudukan atau pos resmi. Bentuk pasif alami dalam bahasa Indonesia tetap menonjolkan kontras antara nasib 'aku' dan 'dia'.
- source_word: וְאֹתוֹ תָלָה
  choice: sedangkan dia digantung
  rationale: Sedangkan menyatakan kontras tajam dengan pemulihan penutur. תלה secara dasar berarti menggantung, meskipun cara atau tahap hukuman yang dimaksud tidak dijelaskan sepenuhnya oleh kata itu sendiri.
theological_decisions:
- issue: Pelaku tindakan dalam dua klausa terakhir
  choice: Tidak menyebut Firaun secara eksplisit; memakai bentuk pasif
  alternative: Firaun mengembalikan aku ... tetapi menggantung dia
  rationale: Teks Ibrani hanya menyiratkan subjek melalui bentuk verba; menyebut Firaun akan memperjelas berdasarkan konteks, tetapi menambahkan nama yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang ringkas dan bermartabat. Kontras objek dalam bahasa Ibrani disampaikan secara alami melalui pasangan “aku ... sedangkan dia ...”.
