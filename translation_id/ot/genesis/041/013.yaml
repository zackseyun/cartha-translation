  terminology: “Menafsirkan” tepat untuk פתר dalam konteks mimpi. “Kedudukan” adalah padanan yang baik untuk כַּן dalam arti jabatan/posisi resmi. “Digantung” mempertahankan verba תלה tanpa menentukan metode atau tahap eksekusi secara berlebihan.
