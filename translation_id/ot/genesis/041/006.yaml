  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: id
  text: Lalu tampaklah tujuh bulir gandum yang kurus dan layu oleh angin timur tumbuh sesudahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu tampaklah
  rationale: Menjaga penanda naratif yang memperkenalkan gambaran baru secara mendadak, dengan ungkapan Indonesia yang wajar dan tetap hidup.
- source_word: שֶׁבַע
  choice: tujuh
  rationale: Padanan langsung bagi bilangan pokok.
- source_word: שִׁבֳּלִים
  choice: bulir gandum
  rationale: Menunjuk pada kepala atau bulir tanaman biji-bijian, bukan seluruh batang; 'bulir gandum' jelas dan alami dalam bahasa Indonesia.
- source_word: דַּקּוֹת
  choice: kurus
  rationale: Menggambarkan bulir yang tipis dan tidak berisi; 'kurus' mempertahankan citra kontras dengan bulir yang baik dalam mimpi itu.
- source_word: וּשְׁדוּפֹת קָדִים
  choice: hangus oleh angin timur
  rationale: Menyampaikan keadaan rusak atau terbakar akibat angin timur yang panas dan merusak.
- source_word: צֹמְחוֹת
  choice: tumbuh
  rationale: Partisip Ibrani menggambarkan kemunculan atau pertumbuhan dalam adegan mimpi; 'tumbuh' alami dan tidak menambahkan rincian yang tidak diperlukan.
- source_word: אַחֲרֵיהֶן
  choice: sesudahnya
  rationale: Merujuk kepada tujuh bulir pada ayat sebelumnya dan mempertahankan kemungkinan urutan waktu atau kemunculan dalam gambaran tersebut.
