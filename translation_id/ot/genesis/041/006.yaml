  source_fidelity: '"Hangus" biasanya menyiratkan terbakar hingga gosong dan terlalu kuat untuk שְׁדוּפוֹת, yang menunjuk malai yang terhembus/terpanggang angin timur hingga layu atau kering. "Lay u oleh angin timur" menyampaikan kerusakan akibat angin tersebut tanpa melebihkan. "Bulir gandum" dapat diterima secara idiomatis dalam konteks mimpi ini, walaupun istilah Ibrani pada dirinya menunjuk bulir atau malai biji-bijian.'
  naturalness: Susunan revisi tetap baku dan lancar. "Tampaklah" mempertahankan penanda adegan yang hidup, sedangkan "tumbuh sesudahnya" secara wajar menyatakan kemunculan bulir-bulir itu setelah tujuh bulir sebelumnya.
  terminology: '"Bulir gandum" sesuai dengan penggunaan Indonesia yang lazim untuk שִׁבֳּלִים dalam konteks ini. "Lay u oleh angin timur" adalah padanan yang lebih proporsional bagi istilah kerusakan tanaman daripada "hangus".'
