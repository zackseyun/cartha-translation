id: GEN.41.1
reference: Genesis 41:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: id
  text: 'Setelah genap dua tahun[a], Firaun bermimpi: tampaklah ia sedang berdiri di tepi Sungai Nil[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua tahun hari-hari”, sebuah ungkapan Ibrani yang berarti masa dua tahun penuh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sungai”; dalam latar Mesir ini, yang dimaksud adalah Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: Setelah genap
  rationale: Gabungan pembuka naratif dan penanda batas waktu diterjemahkan secara alami sebagai peralihan waktu dalam bahasa Indonesia; makna tercapainya akhir masa tetap dipertahankan.
- source_word: שְׁנָתַיִם יָמִים
  choice: dua tahun
  rationale: Ungkapan Ibrani harfiah 'dua tahun hari-hari' menegaskan masa dua tahun yang lengkap; unsur kelengkapan dinyatakan melalui 'genap' dalam frasa sebelumnya.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Mengikuti bentuk baku gelar raja Mesir dalam bahasa Indonesia.
- source_word: חֹלֵם
  choice: bermimpi
  rationale: Partisip Ibrani menampilkan adegan mimpi; bentuk ini alami dalam narasi Indonesia tanpa perlu memaksakan konstruksi progresif.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Menandai kemunculan pemandangan mimpi secara hidup dan menarik perhatian pembaca, dengan ragam sastra yang tetap wajar.
- source_word: עֹמֵד
  choice: sedang berdiri
  rationale: Kata 'sedang' mempertahankan nuansa tindakan/keadaan yang berlangsung pada partisip Ibrani.
- source_word: עַל הַיְאֹר
  choice: di tepi Sungai Nil
  rationale: Dalam latar Mesir, יְאֹר menunjuk Sungai Nil, sedangkan עַל di sini menyatakan posisi di sisi atau tepi sungai, bukan di atas permukaan air.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-sastra. 'Tampaklah' mempertahankan daya penarik perhatian dari וְהִנֵּה tanpa memakai seruan yang terasa kaku; tanda titik dua memperjelas bahwa adegan berikutnya merupakan isi mimpi.
