  terminology: “Firaun” dan “Sungai Nil” adalah bentuk baku Indonesia. Catatan a dengan benar menjelaskan idiom masa dua tahun yang lengkap, dan catatan b menjelaskan pilihan “Sungai Nil” atas makna harfiah “sungai”.
