  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: id
  text: 'Inilah hal yang telah kusampaikan kepada Firaun: apa yang sedang Allah lakukan telah diperlihatkan-Nya kepada Firaun[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang akan segera Allah lakukan.” Partisip Ibrani dapat menunjuk pada tindakan yang sedang berlangsung atau yang segera terjadi; dalam konteks penafsiran mimpi ini, yang dimaksud ialah peristiwa-peristiwa yang akan datang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: Inilah hal
  rationale: Konstruksi pengenal ini secara alami dinyatakan dengan “Inilah”; דָּבָר di sini menunjuk pada hal atau perkara yang dijelaskan melalui mimpi.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל־פַּרְעֹה
  choice: yang telah kusampaikan kepada Firaun
  rationale: Bentuk perfek menyatakan perkataan yang sudah disampaikan. “Kusampaikan” lebih alami daripada “kubicarakan” dan tetap mempertahankan tindakan komunikasi kepada Firaun.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dengan artikel, bentuk ini di sini merujuk kepada Allah sebagai pribadi ilahi tertentu; “Allah” merupakan padanan baku dalam bahasa Indonesia tanpa menambahkan penafsiran sektarian.
- source_word: עֹשֶׂה
  choice: sedang ... lakukan
  rationale: Partisip Ibrani dapat menyatakan tindakan yang sedang berlangsung atau yang segera terjadi. Teks utama mempertahankan nilai aspek yang paling langsung, sedangkan kemungkinan makna segera dijelaskan dalam catatan kaki.
- source_word: הֶרְאָה אֶת־פַּרְעֹה
  choice: telah diperlihatkan-Nya kepada Firaun
  rationale: Bentuk hifil dari ראה berarti “memperlihatkan”. Susunan pasif berakhiran pronominal ini alami dan bermartabat dalam bahasa Indonesia, serta mempertahankan Allah sebagai pelaku.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים dalam ucapan Yusuf
  choice: Allah
  alternative: Sang Allah
  rationale: Dalam konteks ini kata tersebut merujuk kepada Allah yang menyatakan tindakan-Nya kepada Firaun. Padanan “Allah” mengikuti pemakaian Indonesia yang wajar dan tidak memasukkan muatan doktrinal tambahan.
- issue: Waktu tindakan ilahi dalam partisip עֹשֶׂה
  choice: apa yang sedang Allah lakukan
  alternative: apa yang akan segera Allah lakukan
  rationale: Partisip Ibrani membiarkan nuansa tindakan kini atau segera. Teks utama menjaga bentuk partisip secara dekat, sementara konteks mimpi tentang peristiwa mendatang mendukung alternatif futur dekat yang dicatat tanpa menghapus ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Inilah hal” dipilih agar jelas bagi pembaca umum; bentuk “telah diperlihatkan-Nya” mempertahankan kepadatan dan penekanan sumber tanpa terdengar arkais.
