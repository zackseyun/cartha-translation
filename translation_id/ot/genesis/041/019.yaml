base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: id
  text: Lalu tampaklah tujuh ekor sapi lain muncul sesudah sapi-sapi itu, kurang makan, sangat buruk rupa, dan kurus tubuhnya. Belum pernah kulihat sapi-sapi yang begitu buruk rupanya di seluruh tanah Mesir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam hal keburukannya”; ungkapan Ibrani ini dapat mencakup rupa yang buruk maupun keadaan fisik yang menyedihkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kemudian tampaklah
  rationale: Mempertahankan penanda wacana yang hidup dalam laporan mimpi, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: tujuh ekor sapi lain
  rationale: פָּרוֹת secara khusus menunjuk sapi betina; kata penggolong 'ekor' membuat frasa alami dalam bahasa Indonesia.
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: muncul sesudah sapi-sapi itu
  rationale: Partisip Ibrani disajikan sebagai verba finit yang alami; 'muncul' sesuai dengan pengisahan kembali adegan mimpi dan tidak menambahkan asal gerakan yang tidak disebut dalam ayat ini.
- source_word: דַּלּוֹת
  choice: lemah
  rationale: Mengungkapkan keadaan fisik yang tidak bertenaga dan menyedihkan tanpa mengulang gagasan 'kurus' pada frasa berikutnya.
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: sangat buruk rupanya
  rationale: Dalam konstruksi dengan תֹּאַר, רָעוֹת menilai penampilan, bukan keburukan moral. Pilihan ini dekat dengan bentuk sumber dan tetap jelas.
- source_word: וְרַקּוֹת בָּשָׂר
  choice: kurus tubuhnya
  rationale: Menyampaikan secara alami bahwa sapi-sapi itu hanya memiliki sedikit daging; terjemahan harfiah 'tipis dagingnya' akan terasa kaku.
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: Belum pernah kulihat sapi seburuk itu
  rationale: Bentuk orang pertama dipertahankan, sedangkan perbandingan Ibrani disusun secara idiomatis dalam bahasa Indonesia.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: di seluruh tanah Mesir
  rationale: Mempertahankan cakupan menyeluruh dan ungkapan geografis yang lazim dalam bahasa Alkitab Indonesia.
- source_word: לָרֹעַ
  choice: seburuk itu
  rationale: Mengintegrasikan ungkapan penutup sebagai ukuran perbandingan yang alami, sambil mempertahankan keluasan maknanya melalui catatan kaki.
