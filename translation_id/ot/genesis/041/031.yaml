  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: id
  text: Kelimpahan di negeri itu tidak akan dikenali lagi karena kelaparan yang menyusul itu, sebab kelaparan itu akan sangat parah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִוָּדַע
  choice: tidak akan terasa lagi
  rationale: Bentuk Nifal dari ידע dalam konteks ini menyatakan bahwa kelimpahan sebelumnya tidak lagi tampak atau dirasakan akibat kelaparan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencakup nuansa 'tidak dikenali/diketahui' secara kontekstual.
- source_word: הַשָּׂבָע
  choice: kelimpahan
  rationale: Nomina ini menunjuk pada keadaan berlimpahnya hasil selama tahun-tahun subur; 'kelimpahan' tepat dan wajar dalam konteks pertanian-ekonomi.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Konteks menunjuk pada wilayah yang dibicarakan, yakni Mesir, bukan seluruh bumi. 'Negeri itu' mempertahankan acuan regional secara alami.
- source_word: מִפְּנֵי
  choice: karena
  rationale: 'Preposisi ini menyatakan sebab: kelimpahan tidak lagi terasa akibat kelaparan berikutnya.'
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: kelaparan yang datang sesudahnya
  rationale: Pilihan ini menyampaikan urutan waktu dan acuan demonstratif Ibrani secara jelas serta alami dalam bahasa Indonesia.
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: sebab kelaparan itu akan sangat parah
  rationale: כבד secara harfiah berarti 'berat', tetapi ketika menerangkan kelaparan bermakna sangat berat atau parah. Subjek 'kelaparan itu' diulangi agar rujukannya jelas dalam bahasa Indonesia.
theological_decisions: []
