  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Terjemahan memakai kesepadanan optimal; metafora 'berat' dialihkan secara idiomatis menjadi 'parah', sedangkan nuansa bahwa kelimpahan tidak lagi dapat dirasakan dipertahankan.
