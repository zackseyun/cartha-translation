base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: id
  text: Sapi-sapi yang telah dimakan itu masuk ke dalam perut sapi-sapi kurus itu[a], tetapi tidak tampak bahwa mereka telah masuk ke dalam perut sapi-sapi kurus itu. Rupa sapi-sapi kurus itu tetap buruk seperti pada mulanya. Lalu aku terbangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke bagian dalam mereka.” Dalam konteks mimpi ini, maksudnya adalah “ke dalam perut mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל־קִרְבֶּנָה
  choice: Sapi-sapi yang telah dimakan itu masuk ke dalam perut mereka
  rationale: Bentuk feminin jamak merujuk pada sapi-sapi yang dimakan dalam konteks sebelumnya. Penyebutan nomina memperjelas pergantian subjek yang jika hanya memakai kata ganti akan rancu dalam bahasa Indonesia. קֶרֶב berarti bagian dalam atau tengah; dalam gambaran sapi menelan sapi, 'perut' menyatakan bagian dalam tubuh secara wajar.
- source_word: וְלֹא נוֹדַע
  choice: tetapi tidak tampak
  rationale: Nifal ידע di sini menyatakan bahwa masuknya sapi-sapi itu tidak dapat dikenali dari keadaan lahiriah. 'Tidak tampak' alami dalam bahasa Indonesia dan mempertahankan fokus pada ketakterlihatan, tanpa menambahkan pelaku yang mengetahui.
- source_word: כִּי בָאוּ אֶל־קִרְבֶּנָה
  choice: bahwa sapi-sapi itu telah masuk ke dalam perut mereka
  rationale: כִּי memperkenalkan isi dari hal yang tidak tampak. Pengulangan 'ke dalam perut mereka' mengikuti pengulangan Ibrani dan menjaga gambaran mimpi tetap konkret.
- source_word: וּמַרְאֵיהֶן רַע
  choice: Penampilan mereka tetap buruk
  rationale: מַרְאֶה menunjuk pada rupa yang terlihat dan רַע pada keadaan buruk. 'Tetap' mengungkapkan kesinambungan yang dijelaskan oleh frasa perbandingan berikutnya, tanpa mempersempit makna menjadi 'kurus' atau 'jelek'.
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: seperti semula
  rationale: Ungkapan ini membandingkan rupa sesudah makan dengan rupa pada awalnya. 'Seperti semula' ringkas, alami, dan tepat secara temporal.
- source_word: וָאִיקָץ
  choice: Lalu aku terbangun
  rationale: Wayyiqtol orang pertama tunggal menutup laporan mimpi dalam urutan naratif. 'Lalu' menyatakan urutan tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Referen sapi-sapi yang dimakan dibuat eksplisit untuk mencegah kesan keliru bahwa sapi-sapi kurus masuk ke perutnya sendiri; pengulangan utama dari teks Ibrani tetap dipertahankan.
