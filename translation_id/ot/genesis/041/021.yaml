  revised_text: Sapi-sapi yang telah dimakan itu masuk ke dalam perut sapi-sapi kurus itu[a], tetapi tidak tampak bahwa mereka telah masuk ke dalam perut sapi-sapi kurus itu. Rupa sapi-sapi kurus itu tetap buruk seperti pada mulanya. Lalu aku terbangun.
