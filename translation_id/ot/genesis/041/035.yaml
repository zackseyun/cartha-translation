  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: id
  text: Hendaklah mereka mengumpulkan semua bahan makanan dari tahun-tahun baik yang akan datang ini, lalu menimbun biji-bijian di bawah wewenang Firaun[a] sebagai persediaan makanan di kota-kota, dan menyimpannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawah tangan Firaun,” sebuah ungkapan Ibrani yang berarti berada di bawah wewenang atau pengawasannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “menjaganya” atau “memeliharanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: Hendaklah mereka mengumpulkan
  rationale: Bentuk imperfek dalam konteks usulan Yusuf bernuansa perintah atau anjuran; “hendaklah” menyampaikan nuansa itu secara wajar dan bermartabat.
- source_word: כָּל אֹכֶל
  choice: semua bahan makanan
  rationale: אֹכֶל menunjuk pada makanan atau persediaan pangan secara luas; “bahan makanan” sesuai dengan hasil panen yang dikumpulkan untuk disimpan.
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: tahun-tahun baik yang akan datang ini
  rationale: Susunan ini mempertahankan sifat “baik”, makna mendatang dari partisipel, dan daya tunjuk “ini” dari הָאֵלֶּה.
- source_word: וְיִצְבְּרוּ
  choice: lalu menimbun
  rationale: Kata kerja ini berarti menumpuk atau menyimpan dalam jumlah besar; “menimbun” alami dalam konteks persediaan pangan.
- source_word: בָר
  choice: gandum
  rationale: בָר menunjuk pada biji-bijian yang telah diirik. “Gandum” mudah dipahami dalam konteks ini, meskipun istilah Ibraninya dapat mencakup biji-bijian pangan secara lebih umum.
- source_word: תַּחַת יַד פַּרְעֹה
  choice: di bawah wewenang Firaun
  rationale: Ungkapan harfiah “di bawah tangan Firaun” merupakan idiom tentang kewenangan atau pengawasan; terjemahan ini menyampaikan maknanya tanpa kekakuan.
- source_word: אֹכֶל בֶּעָרִים
  choice: sebagai persediaan makanan di kota-kota
  rationale: Frasa ini menerangkan fungsi dan lokasi gandum yang ditimbun. “Persediaan makanan” membuat hubungan aposisionalnya jelas dalam bahasa Indonesia.
- source_word: וְשָׁמָרוּ
  choice: dan menjaganya
  rationale: שׁמר dapat berarti menjaga, menyimpan, atau memelihara. “Menjaganya” mempertahankan unsur pengamanan persediaan tanpa menutup kemungkinan makna pemeliharaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi namun mudah dipahami. Penanda perintah “hendaklah” dipakai untuk mencerminkan nuansa usulan administratif Yusuf. Penanda catatan kaki ditempatkan pada unsur yang benar-benar diterangkannya.
