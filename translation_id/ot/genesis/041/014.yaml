  naturalness: Teks revisi memakai bahasa Indonesia baku dan lancar. “Bergegas membawanya keluar dari lubang itu” lebih hidup dan lebih tepat daripada “segera membawanya keluar dari lubang tahanan,” tanpa membuat klaim berlebihan tentang bentuk tempat tersebut.
  terminology: “Firaun,” “Yusuf,” “bercukur,” “mengganti pakaiannya,” dan “menghadap Firaun” sudah tepat dan sesuai register naratif. “Lubang” mempertahankan istilah dasar Ibrani; catatan kaki menjelaskan kemungkinan maknanya dalam konteks.
