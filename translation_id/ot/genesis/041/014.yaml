  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: id
  text: Lalu Firaun mengutus orang untuk memanggil Yusuf, dan mereka bergegas membawanya keluar dari lubang itu.[a] Yusuf bercukur, mengganti pakaiannya, lalu menghadap Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar dari lubang itu.” Kata Ibrani yang digunakan dapat merujuk pada lubang, sumur penampung air, atau tempat kurungan seperti penjara bawah tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת יוֹסֵף
  choice: mengutus orang untuk memanggil Yusuf
  rationale: Ungkapan ini mempertahankan kedua tindakan dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia dan menyatakan bahwa Firaun menyuruh orang menjemput Yusuf.
- source_word: וַיְרִיצֻהוּ
  choice: mereka segera membawanya
  rationale: Bentuk kausatif ini menyampaikan bahwa orang-orang yang diutus membuat Yusuf keluar dengan cepat; 'segera membawanya' mengungkapkan urgensi tanpa menyiratkan secara pasti bahwa Yusuf berlari.
- source_word: מִן הַבּוֹר
  choice: keluar dari lubang tahanan
  rationale: '''Lubang tahanan'' mempertahankan gambaran harfiah בּוֹר sebagai lubang sekaligus memperjelas fungsi tempat itu dalam konteks sebagai tempat kurungan.'
- source_word: וַיְגַלַּח
  choice: Yusuf bercukur
  rationale: Bentuk aktif Ibrani diterjemahkan secara ringkas dan alami; pengulangan nama memperjelas pergantian pelaku dari para pengantar kepada Yusuf.
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: mengganti pakaiannya
  rationale: Ini merupakan padanan Indonesia modern dan alami bagi tindakan menukar pakaian sebelum menghadap Firaun.
- source_word: וַיָּבֹא אֶל פַּרְעֹה
  choice: menghadap Firaun
  rationale: Dalam konteks istana, 'menghadap' menyampaikan gerak datang ke hadapan raja secara alami, tanpa menambahkan rincian yang tidak ada dalam teks.
