  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: id
  text: Kelaparan meliputi seluruh bumi,[a] dan Yusuf membuka semua gudang-gudang gandum[b] serta menjual gandum kepada orang-orang Mesir. Kelaparan itu semakin parah di tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh negeri.” Secara harfiah, “berada di atas seluruh permukaan bumi/negeri.”
    reason: lexical_ambiguity
  - marker: b
    text: Teks Ibrani secara harfiah berbunyi “membuka semua yang ada di dalamnya”; tempat penyimpanannya tidak disebutkan secara eksplisit.
    reason: textual_ellipsis
lexical_decisions:
- source_word: הָרָעָב
  choice: kelaparan
  rationale: רָעָב dalam konteks ini menunjuk pada bencana kekurangan pangan yang luas, bukan sekadar rasa lapar.
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: meliputi seluruh negeri
  rationale: Ungkapan Ibrani secara harfiah berarti ‘di atas seluruh permukaan negeri/bumi’. Dalam konteks kisah ini, ‘meliputi seluruh negeri’ terdengar alami dan tidak memaksakan cakupan global yang tidak ditentukan oleh kata אֶרֶץ.
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: membuka semua tempat penyimpanan gandum
  rationale: Teks Ibrani bersifat eliptis dan secara harfiah berbunyi ‘membuka semua yang ada di dalamnya’, tanpa anteseden yang dinyatakan. Konteks penimbunan dan penjualan gandum mendukung tempat penyimpanan sebagai maksud ungkapan; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: menjual gandum kepada orang Mesir
  rationale: Dalam konteks ini שׁבר berarti menjual bahan pangan, khususnya gandum. Bentuk מִצְרַיִם secara harfiah ‘Mesir’ dipahami secara kolektif sebagai penduduk Mesir.
- source_word: וַיֶּחֱזַק
  choice: semakin parah
  rationale: חזק berarti ‘menjadi kuat’; dengan kelaparan sebagai subjek, artinya kelaparan itu bertambah hebat atau parah.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan gaya naratif kitab Kejadian.
