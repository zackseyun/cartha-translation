  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Lihatlah, aku telah mengangkat engkau atas seluruh negeri Mesir.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa memberi penafsiran sebab-akibat.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: אֶל יוֹסֵף
  choice: kepada Yusuf
  rationale: אֶל memperkenalkan pihak yang dituju dalam tuturan, dan “Yusuf” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif ini menarik perhatian Yusuf kepada pernyataan resmi yang menyusul; “lihatlah” mempertahankan daya retorisnya dengan register yang wajar dan bermartabat.
- source_word: נָתַתִּי אֹתְךָ
  choice: aku telah mengangkat engkau
  rationale: Secara harfiah נתן berarti “memberi/menempatkan”, tetapi bersama עַל dalam konteks administratif menyatakan pengangkatan ke dalam kedudukan berwenang. “Mengangkat” menyampaikan fungsi itu secara alami.
- source_word: עַל
  choice: atas
  rationale: Menandai lingkup yang berada di bawah wewenang Yusuf dan mempertahankan gambaran hierarkis teks Ibrani.
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: seluruh tanah Mesir
  rationale: “Seluruh” mempertahankan cakupan כָּל, sedangkan “tanah Mesir” menerjemahkan אֶרֶץ מִצְרָיִם secara langsung sebagai wilayah atau negeri Mesir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “aku–engkau” sesuai dengan ujaran langsung seorang raja kepada bawahannya dan menjaga nuansa teks tanpa terdengar terlalu sehari-hari. Tidak diperlukan catatan kaki.
