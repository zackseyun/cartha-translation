  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: id
  text: Sesudah itu akan datang tujuh tahun kelaparan, dan segala kelimpahan di tanah Mesir akan terlupakan, lalu kelaparan itu akan menghabiskan negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan membinasakan negeri itu.” Kata kerja Ibrani ini dapat berarti menghabiskan sama sekali atau mendatangkan kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: Sesudah itu akan datang
  rationale: Bentuk ini berada dalam konteks nubuat tentang masa depan. Ungkapan ini menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia, sementara makna harfiah 'bangkit' kurang idiomatis untuk tahun-tahun kelaparan.
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: tujuh tahun kelaparan
  rationale: Rangkaian konstruksi Ibrani ini secara tepat dan alami menyatakan suatu masa tujuh tahun yang dicirikan oleh bencana kelaparan.
- source_word: אַחֲרֵיהֶן
  choice: Sesudah itu
  rationale: Akhiran feminin jamak merujuk kepada tujuh tahun kelimpahan sebelumnya. Bahasa Indonesia tidak menandai gender, sehingga rujukan tersebut dinyatakan secara alami tanpa mengubah urutannya.
- source_word: וְנִשְׁכַּח
  choice: akan terlupakan
  rationale: Bentuk nifal mempertahankan nuansa pasif bahwa kelimpahan sebelumnya tidak lagi dikenang akibat hebatnya kelaparan.
- source_word: כָּל הַשָּׂבָע
  choice: segala kelimpahan
  rationale: שָׂבָע menunjuk pada keadaan kenyang, kecukupan, atau kelimpahan, bukan hanya persediaan bahan pangan; 'kelimpahan' mempertahankan cakupan luas itu.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Pilihan ini mempertahankan ungkapan geografis Ibrani dan terdengar wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: וְכִלָּה
  choice: akan menghabiskan
  rationale: Dalam konteks ini, verba כלה menggambarkan dampak kelaparan yang menghabiskan atau membinasakan negeri. 'Menghabiskan' mempertahankan citra konsumtif tanpa mempersempitnya.
- source_word: הָרָעָב
  choice: kelaparan itu
  rationale: Penunjuk 'itu' menandai bahwa kelaparan tersebut adalah kelaparan yang baru saja disebutkan.
- source_word: אֶת הָאָרֶץ
  choice: negeri itu
  rationale: אָרֶץ di sini merujuk kembali kepada Mesir sebagai wilayah atau negeri. 'Negeri itu' menghindari pengulangan 'tanah' dan menjaga rujukannya tetap jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. Struktur kalimat mengikuti perkembangan tiga akibat dalam teks Ibrani, tetapi memakai penghubung yang alami. Penanda catatan kaki ditempatkan langsung setelah klausa yang dijelaskannya.
