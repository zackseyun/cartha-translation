translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Ia” menjaga gaya yang ringkas dan bermartabat; “tanah Mesir” mempertahankan ungkapan geografis sumber. Catatan kaki mempertahankan bentuk sumber yang lebih harfiah tanpa membebani teks utama.
