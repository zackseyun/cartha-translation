base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: id
  text: Ia mengumpulkan segala bahan makanan dari tujuh tahun yang terjadi di tanah Mesir, lalu menaruh bahan makanan itu di kota-kota. Di setiap kota ia menaruh bahan makanan dari ladang-ladang di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “bahan makanan dari ladang kota yang mengelilinginya, ia taruh di dalamnya.” Bahasa Ibrani mengulangi kata “bahan makanan” dan memakai konstruksi resumptif untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: ia mengumpulkan
  rationale: Verba קבץ berarti mengumpulkan menjadi satu; “mengumpulkan” alami dan tepat dalam narasi ini.
- source_word: כָּל אֹכֶל
  choice: segala bahan makanan
  rationale: אֹכֶל lebih luas daripada gandum atau hasil panen tertentu. “Bahan makanan” mempertahankan keluasan makna sekaligus sesuai dengan konteks penyimpanan.
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: selama tujuh tahun yang berlangsung di tanah Mesir
  rationale: Bahasa Ibrani secara harfiah menyebut “tujuh tahun yang ada di tanah Mesir”; “berlangsung” mengungkapkan acuan temporal itu secara wajar tanpa menambahkan gagasan kelimpahan yang tidak dinyatakan dalam ayat ini.
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: lalu menaruh bahan makanan itu di kota-kota
  rationale: נתן pada konteks ini berarti menaruh atau menempatkan. “Menaruh” dekat dengan bentuk sumber dan tidak terlalu menafsirkan seperti “menyimpan”.
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: bahan makanan dari ladang-ladang di sekelilingnya
  rationale: Frasa konstruksi merujuk pada bahan makanan dari wilayah ladang yang mengelilingi masing-masing kota; bentuk jamak “ladang-ladang” menghasilkan bahasa Indonesia yang alami.
- source_word: נָתַן בְּתוֹכָהּ
  choice: di setiap kota ia menaruh
  rationale: Susunan distributif ini menyampaikan bahwa hasil dari daerah sekitar setiap kota ditempatkan di kota tersebut, sambil menghaluskan konstruksi resumptif Ibrani.
