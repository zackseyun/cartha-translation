  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: id
  text: Lalu Yusuf berkata kepada Firaun, “Mimpi Firaun itu satu[a]; apa yang Allah lakukan[b] telah diberitahukan-Nya kepada Firaun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Mimpi Firaun itu satu.” Dalam konteksnya, Yusuf memandang kedua mimpi Firaun sebagai satu pesan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “apa yang sedang Allah lakukan” atau, sesuai konteks, “apa yang akan Allah lakukan.” Bentuk partisip Ibrani tidak menentukan nuansa waktunya secara mutlak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia modern.
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: Mimpi Firaun itu satu
  rationale: Mempertahankan bentuk tunggal “mimpi” dan predikat “satu” dari bahasa Ibrani, sekaligus membiarkan konteks menunjukkan bahwa kedua mimpi menyampaikan satu pesan.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk sebutan ilahi dalam konteks ini; artikelnya menandai rujukan yang tentu dan tidak perlu diterjemahkan tersendiri.
- source_word: עֹשֶׂה
  choice: lakukan
  rationale: Bentuk verba Indonesia yang tidak bertanda waktu ini secara wajar mempertahankan keluwesan aspek partisip Ibrani, yang dapat menunjuk pada tindakan yang sedang berlangsung, lazim dilakukan, atau segera diwujudkan sesuai konteks.
- source_word: הִגִּיד
  choice: telah dinyatakan-Nya
  rationale: Bentuk Hifil menyatakan tindakan memberitahukan atau membuat sesuatu diketahui. “Telah dinyatakan-Nya” mempertahankan nuansa pewahyuan dan aspek tindakan yang telah terjadi.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים
  choice: Allah
  alternative: Allah itu
  rationale: “Allah” adalah bentuk alami dan tentu dalam bahasa Indonesia tanpa menambahkan penekanan teologis yang tidak dinyatakan teks.
- issue: Aspek tindakan Allah dalam עֹשֶׂה
  choice: apa yang Allah lakukan
  alternative: apa yang akan Allah lakukan
  rationale: Bahasa Ibrani memakai partisip dan tidak secara eksplisit memakai bentuk kala mendatang. Pilihan utama menjaga ketegangan aspek itu, sedangkan konteks dapat memberi nuansa tindakan yang akan segera terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan “Firaun” serta hubungan erat antara dua klausa, tanpa memperjelas secara berlebihan aspek waktu tindakan Allah.
