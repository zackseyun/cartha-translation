  naturalness: “Kereta kedua milik Firaun” lebih jelas dan lazim daripada “kereta keduanya.” “Di depannya” lebih idiomatis untuk seruan yang mendahului arak-arakan. “Menjadikan Yusuf penguasa” menyampaikan tindakan penetapan dengan bahasa Indonesia modern yang alami.
  terminology: Nama Firaun, Yusuf, dan Mesir sudah tepat. “Abrek” patut tetap ditransliterasikan karena maknanya tidak pasti. Catatan kaki perlu menyebutnya sebagai seruan, bukan menyatakan secara lebih sempit bahwa istilah itu adalah “dalam bahasa Mesir atau Ibrani.”
