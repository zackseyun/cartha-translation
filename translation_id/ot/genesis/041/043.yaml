base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: id
  text: Firaun menyuruh Yusuf naik kereta kedua milik Firaun[a], lalu orang-orang berseru di depannya, “Abrek!” Dan Firaun menjadikan Yusuf penguasa atas seluruh tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Abrek” adalah seruan yang sulit dan maknanya tidak pasti, mungkin seruan dalam bahasa Mesir atau Ibrani. Banyak orang memahaminya kira-kira sebagai “Berlututlah!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב
  choice: Firaun menyuruh Yusuf naik
  rationale: Bentuk hifil dari רכב menyatakan tindakan kausatif. Penyebutan Firaun dan Yusuf memperjelas rujukan pronomina dari konteks tanpa mengubah pelaku atau penerima tindakan.
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: kereta keduanya
  rationale: מִשְׁנֶה menunjukkan urutan atau kedudukan kedua; frasa ini paling wajar dipahami sebagai kereta milik Firaun yang berada pada urutan kedua, sesudah kereta utamanya.
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: lalu orang-orang berseru di hadapannya
  rationale: קרא di sini menggambarkan seruan umum dalam arak-arakan, sedangkan לְפָנָיו dipertahankan secara dekat sebagai 'di hadapannya'.
- source_word: אַבְרֵךְ
  choice: Abrek
  rationale: Istilah ini tidak jelas, mungkin kata serapan atau seruan resmi. Transliterasi mempertahankan ketidakpastian sumber daripada menetapkan satu tafsiran di dalam teks utama.
- source_word: וְנָתוֹן אֹתוֹ
  choice: Dengan demikian, Firaun menetapkan dia
  rationale: Bentuk infinitif absolut נָתוֹן berfungsi dengan daya verbal dalam rangkaian narasi. 'Menetapkan' menyampaikan pengangkatan kepada wewenang, sementara 'dengan demikian' mencerminkan hubungan hasil tanpa terlalu menentukan nuansa konjungsinya.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: atas seluruh tanah Mesir
  rationale: עַל menyatakan wewenang atas sesuatu, dan אֶרֶץ dipertahankan sebagai 'tanah' untuk menjaga cakupan teritorial ungkapan Ibrani.
