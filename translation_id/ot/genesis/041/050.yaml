  text: וּ/לְ/יוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּ/טֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָ/רָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֥ן אֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: id
  text: Sebelum tahun kelaparan tiba[a], lahirlah bagi Yusuf dua anak laki-laki, yang dilahirkan oleh Asnat, putri Potifera, imam di On[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tahun kelaparan itu tiba.” Dalam bahasa Ibrani, kata “tahun” berbentuk tunggal dan menunjuk pada awal masa kelaparan.
    reason: lexical_alternative
  - marker: b
    text: On adalah sebuah kota di Mesir yang kemudian dikenal dalam bahasa Yunani sebagai Heliopolis.
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד
  choice: lahirlah
  rationale: Bentuk pasif dari ילד menyatakan bahwa kedua anak itu lahir; susunan inversi dengan -lah mempertahankan fokus naratif Ibrani secara wajar dalam bahasa Indonesia.
- source_word: וּ/לְ/יוֹסֵף
  choice: bagi Yusuf
  rationale: Preposisi ל menandai relasi atau keuntungan dalam ungkapan kelahiran; 'bagi Yusuf' mempertahankan nuansa itu tanpa menyiratkan bahwa Yusuf yang melahirkan.
- source_word: בְּ/טֶרֶם
  choice: Sebelum
  rationale: Partikel temporal ini secara langsung menyatakan bahwa kelahiran tersebut mendahului datangnya tahun kelaparan.
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: tahun kelaparan tiba
  rationale: Mempertahankan bentuk tunggal 'tahun' dan citra verba 'datang/tiba', yang menunjuk pada awal masa kelaparan.
- source_word: שְׁנֵי בָנִים
  choice: dua orang anak laki-laki
  rationale: Padanan alami dan jelas untuk dua putra dalam bahasa Indonesia modern; penyebutan 'orang' sesuai untuk menghitung manusia.
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: yang dilahirkan baginya oleh
  rationale: Konstruksi pasif menghubungkan klausa relatif secara jelas dengan kedua anak dan tetap memuat pronomina לּוֹ, sekaligus menghindari ungkapan Indonesia yang janggal.
- source_word: אָסְנַת
  choice: Asnat
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: anak perempuan Potifera
  rationale: Rangkaian konstruksi menyatakan hubungan anak dan ayah; nama tersebut ditransliterasikan sebagai Potifera.
- source_word: כֹּהֵן אֹון
  choice: imam di On
  rationale: כֹּהֵן berarti imam; 'di On' secara alami menyatakan tempat pelayanan atau kedudukan imam tanpa memastikan hubungan kepemilikan yang tidak dinyatakan.
