base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: id
  text: Lalu Firaun berkata kepada para pegawainya, “Mungkinkah kita menemukan orang seperti ini, yang di dalam dirinya ada roh Allah[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu roh dari Allah,” “Roh Allah,” atau “roh ilahi.” Frasa Ibrani רוּחַ אֱלֹהִים dapat dipahami dalam lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֶבֶד dapat menunjuk para pelayan atau pejabat raja. “Para pegawainya” alami dan cukup luas tanpa menentukan jabatan mereka secara berlebihan.
- source_word: הֲנִמְצָא
  choice: Mungkinkah kita menemukan
  rationale: Partikel tanya dan bentuk orang pertama jamak menyatakan pertanyaan retoris/deliberatif. “Mungkinkah” mempertahankan nuansa kemungkinan, bukan sekadar kemampuan.
- source_word: כָזֶה אִישׁ
  choice: orang seperti dia ini
  rationale: Ungkapan ini merujuk secara khusus kepada Yusuf dan mempertahankan daya tunjuk כָזֶה; “orang” lebih wajar daripada “laki-laki” dalam konteks ini.
- source_word: אֲשֶׁר ... בּוֹ
  choice: yang di dalam dirinya ada
  rationale: Terjemahan ini mempertahankan gagasan lokatif בּוֹ, “di dalam dia,” sambil membentuk klausa relatif yang alami dalam bahasa Indonesia.
- source_word: רוּחַ אֱלֹהִים
  choice: roh Allah
  rationale: Frasa konstruksi Ibrani ini secara harfiah dapat berarti “roh Allah,” tetapi tanpa artikel dapat pula dipahami secara lebih tak tentu atau deskriptif. Huruf kecil menjaga ambiguitas leksikal tanpa menyangkal kemungkinan rujukan kepada Roh Allah.
theological_decisions:
- issue: Apakah רוּחַ אֱלֹהִים menunjuk secara khusus kepada Roh Allah atau berarti roh ilahi secara lebih umum
  choice: roh Allah
  alternative: suatu roh dari Allah; Roh Allah; roh ilahi
  rationale: Teks Ibrani tidak memakai artikel dan ucapan berasal dari Firaun, sehingga tingkat ketepatan pengenalannya tidak boleh dipastikan secara berlebihan. Namun, konstruksi genitifnya tetap paling langsung diterjemahkan “roh Allah.” Alternatif dicatat untuk mempertahankan ketegangan teologis dan sudut pandang tokoh.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Para pegawainya” sesuai dengan konteks istana; “yang di dalam dirinya ada” sengaja mempertahankan struktur lokatif Ibrani tanpa terdengar terlalu kaku.
