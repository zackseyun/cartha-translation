translation:
  language: id
  text: Lalu sapi-sapi yang kurus dan buruk rupanya itu memakan habis tujuh ekor sapi sehat yang pertama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sapi-sapi yang kurus dan buruk rupanya itu ... tujuh ekor sapi gemuk yang pertama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: memakan habis
  rationale: Bentuk dari אכל berarti ‘makan’. Dalam konteks mimpi ini, ‘memakan habis’ secara alami menyampaikan bahwa sapi-sapi itu dikonsumsi seluruhnya tanpa memakai ungkapan yang terlalu kuat seperti ‘melahap’.
- source_word: הַפָּרוֹת
  choice: sapi-sapi
  rationale: Bentuk jamak feminin ini menunjuk secara khusus kepada sapi betina; dalam bahasa Indonesia, ‘sapi-sapi’ sudah tepat dan alami dalam konteks ini.
- source_word: הָרַקּוֹת
  choice: yang kurus
  rationale: Kata sifat ini menggambarkan keadaan tubuh yang sangat tidak berisi. ‘Kurus’ jelas dan lazim dalam bahasa Indonesia modern.
- source_word: וְהָרָעוֹת
  choice: dan buruk rupanya
  rationale: Di sini רעות menggambarkan penampilan yang buruk, bukan kejahatan moral. ‘Buruk rupanya’ mempertahankan makna visual tersebut secara wajar.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ketujuh sapi
  rationale: Penanda objek langsung, angka tujuh, dan kata benda diterjemahkan secara lugas; ‘ketujuh’ secara alami menunjuk kepada seluruh kelompok yang berjumlah tujuh.
- source_word: הָרִאשֹׁנוֹת
  choice: pertama
  rationale: Kata ini membedakan kelompok sapi yang muncul lebih dahulu dalam urutan mimpi.
- source_word: הַבְּרִיאֹת
  choice: yang sehat
  rationale: Kata sifat ini menunjukkan kondisi yang sehat dan kuat. ‘Sehat’ mempertahankan keluasan makna, meskipun ‘gemuk’ juga mungkin dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan kalimat mengikuti alur Ibrani dengan tetap terdengar alami; ‘buruk rupanya’ menghindari kesan moral dari רעות, sedangkan catatan kaki mempertahankan kemungkinan menerjemahkan הַבְּרִיאֹת sebagai ‘gemuk’.
