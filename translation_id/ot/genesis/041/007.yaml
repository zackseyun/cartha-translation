  text: וַ/תִּבְלַ֨עְנָה֙ הַ/שִּׁבֳּלִ֣ים הַ/דַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽ/שִּׁבֳּלִ֔ים הַ/בְּרִיא֖וֹת וְ/הַ/מְּלֵא֑וֹת וַ/יִּיקַ֥ץ פַּרְעֹ֖ה וְ/הִנֵּ֥ה חֲלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: id
  text: Bulir-bulir yang kurus itu menelan tujuh bulir yang sehat[a] dan berisi itu. Lalu Firaun terbangun, dan ternyata itu sebuah mimpi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gemuk.” Kata Ibrani yang diterjemahkan “sehat” juga dapat menggambarkan keadaan yang gemuk, subur, atau kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: menelan
  rationale: Menerjemahkan בלע secara langsung dan mempertahankan gambaran mimpi yang jelas serta tidak wajar tanpa menambahkan nuansa pemangsaan.
- source_word: הַשִּׁבֳּלִים
  choice: bulir-bulir
  rationale: Dalam konteks ini שִׁבֹּלֶת menunjuk pada bagian tanaman yang mengandung biji, bukan seluruh batang; 'bulir' merupakan istilah Indonesia yang ringkas dan tepat.
- source_word: הַדַּקּוֹת
  choice: yang kurus
  rationale: Mengungkapkan keadaan tipis atau tidak berisi secara alami ketika menerangkan bulir, sekaligus menjaga kontras dengan bulir yang sehat dan berisi.
- source_word: שֶׁבַע
  choice: ketujuh
  rationale: Bentuk ini secara alami menandai tujuh bulir tertentu yang telah disebutkan dalam konteks.
- source_word: הַבְּרִיאוֹת
  choice: yang sehat
  rationale: Mempertahankan makna dasar keadaan sehat atau subur tanpa memakai 'gemuk', yang kurang lazim bagi bulir dalam bahasa Indonesia.
- source_word: וְהַמְּלֵאוֹת
  choice: dan berisi
  rationale: Dalam konteks bulir, 'berisi' secara alami menyatakan bahwa bulir itu penuh dengan biji dan tetap dekat dengan makna מלא.
- source_word: וַיִּיקַץ
  choice: terbangun
  rationale: Padanan naratif yang wajar untuk tindakan bangun dari tidur.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Menjaga fungsi הִנֵּה sebagai penanda penemuan atau kesadaran mendadak dalam bahasa Indonesia modern, tanpa ungkapan arkais.
- source_word: חֲלוֹם
  choice: itu sebuah mimpi
  rationale: Bahasa Ibrani berbunyi ringkas, secara harfiah 'dan lihatlah, mimpi'; bahasa Indonesia memerlukan konstruksi berkopula tersirat agar kesadaran Firaun tersampaikan secara alami.
