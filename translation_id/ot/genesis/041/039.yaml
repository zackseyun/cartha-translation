base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Karena Allah telah memberitahukan semua ini kepadamu, tidak ada seorang pun yang berpengertian dan bijaksana seperti engkau.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah Allah memberitahukan semua ini kepadamu, tidak ada seorang pun yang berpengertian dan bijaksana seperti engkau.” Kata depan Ibrani ini secara lebih harfiah berarti “setelah”, tetapi di sini dapat menyatakan dasar kesimpulan Firaun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara wajar dalam narasi Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: אַחֲרֵי
  choice: Karena
  rationale: Secara harfiah dapat berarti “setelah”, tetapi dalam konteks ini memperkenalkan dasar bagi kesimpulan Firaun.
- source_word: הוֹדִיעַ
  choice: telah memberitahukan
  rationale: Bentuk Hifil dari ידע menyatakan tindakan menyebabkan seseorang mengetahui atau membuat sesuatu diketahui.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Konteks dan konstruksi verbal menunjuk pada referen tunggal, yaitu Allah yang menyingkapkan perkara itu kepada Yusuf.
- source_word: אֶת כָּל זֹאת
  choice: semua ini
  rationale: Ungkapan ringkas dan alami yang merujuk pada seluruh perkara yang telah ditafsirkan dan dijelaskan Yusuf.
- source_word: אֵין
  choice: tidak ada seorang pun
  rationale: Menyampaikan negasi eksistensial secara jelas dan alami.
- source_word: נָבוֹן
  choice: sepaham
  rationale: Menunjukkan kemampuan memahami dan menimbang dengan tajam; bentuk komparatif berpasangan alami dengan “sebijaksana”.
- source_word: וְחָכָם
  choice: dan sebijaksana
  rationale: חכם berarti bijaksana; awalan “se-” menyampaikan perbandingan dengan Yusuf secara alami.
- source_word: כָּמוֹךָ
  choice: engkau
  rationale: Dalam konstruksi “tidak ada ... yang se-... engkau”, kata ini menyampaikan perbandingan ‘seperti/sebanding dengan engkau’.
theological_decisions:
- issue: Referen אֱלֹהִים dalam ucapan Firaun
  choice: Allah
  alternative: para dewa
  rationale: Walaupun bentuk ini dapat bersifat jamak dalam konteks tertentu, verba tunggal dan konteks pengakuan Firaun atas ilah yang menyatakan perkara itu kepada Yusuf mendukung referen tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam dialog historis untuk sapaan tunggal, sedangkan susunan perbandingan dibuat alami tanpa menghilangkan pasangan makna ‘berpengertian’ dan ‘bijaksana’.
