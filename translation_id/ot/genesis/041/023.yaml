  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: id
  text: Kemudian tampaklah tujuh bulir yang kisut, kurus, dan hangus oleh angin timur, tumbuh sesudahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Kemudian tampaklah
  rationale: Menjaga daya penunjuk yang hidup dari הִנֵּה sekaligus menghubungkan unsur baru ini secara wajar dengan urutan laporan mimpi.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: tujuh bulir gandum
  rationale: שִׁבֳּלִים menunjuk pada bulir atau kepala biji-bijian; 'bulir gandum' jelas dan alami bagi pembaca Indonesia dalam konteks ini.
- source_word: צְנֻמוֹת
  choice: kisut
  rationale: Mengungkapkan keadaan mengerut atau tidak berkembang dengan baik dan mempertahankannya sebagai gambaran tersendiri, tidak meleburkannya dengan דַּקּוֹת.
- source_word: דַּקּוֹת
  choice: kurus
  rationale: Menyampaikan arti tipis atau tidak berisi pada bulir serta mempertahankan tumpukan kata sifat dalam teks Ibrani.
- source_word: שְׁדֻפוֹת קָדִים
  choice: hangus oleh angin timur
  rationale: Menggambarkan kerusakan tanaman akibat angin timur yang panas dan kering dengan ungkapan Indonesia yang jelas dan hidup.
- source_word: צֹמְחוֹת
  choice: tumbuh
  rationale: Partisip Ibrani menampilkan pertumbuhan yang sedang tampak dalam adegan mimpi; bentuk Indonesia ini alami dalam konstruksi kalimat tersebut.
- source_word: אַחֲרֵיהֶם
  choice: menyusul ketujuh bulir itu
  rationale: Menyatakan kemunculan sesudah bulir-bulir sebelumnya dan memperjelas acuan pronomina tanpa menambah unsur baru.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Rangkaian 'kisut, kurus, dan hangus' mempertahankan tiga gambaran negatif yang bertumpuk dalam bahasa Ibrani tanpa terdengar kaku.
