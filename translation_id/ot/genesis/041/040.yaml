  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: id
  text: Engkau akan memimpin istanaku[a], dan seluruh rakyatku akan menaati perintahmu. Hanya dalam hal takhta, aku akan lebih besar daripadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani secara harfiah berbunyi, “dan pada mulutmu seluruh rakyatku akan mencium.” Dalam konteks ini, ungkapan tersebut umumnya dipahami sebagai memberi penghormatan atau menaati perintah Yusuf.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: berkuasa atas istanaku
  rationale: Frasa ini menyatakan kewenangan atau pengawasan atas 'rumah' Firaun. Dalam konteks pemerintahan kerajaan, 'istanaku' secara alami mencakup lingkungan rumah tangga sekaligus administrasi istana.
- source_word: וְעַל־פִּיךָ יִשַּׁק
  choice: akan menaati perintahmu
  rationale: Secara harfiah berbunyi kira-kira 'pada mulutmu akan mencium'. Dalam konteks pendelegasian kekuasaan, ungkapan ini paling wajar dipahami sebagai menaati perintah atau memberi penghormatan atas titah Yusuf; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: כָּל עַמִּי
  choice: seluruh rakyatku
  rationale: עַם menunjuk kepada rakyat Firaun secara kolektif; 'seluruh rakyatku' tepat dan alami dalam konteks kerajaan.
- source_word: רַק
  choice: Hanya
  rationale: Kata ini menandai satu-satunya batas atau pengecualian terhadap kewenangan Yusuf.
- source_word: הַכִּסֵּא
  choice: takhta
  rationale: כִּסֵּא secara langsung berarti 'takhta' dan di sini melambangkan kedudukan kerajaan Firaun.
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: aku akan lebih besar daripadamu
  rationale: Konstruksi גדל dengan מן menyatakan keunggulan. Terjemahan ini mempertahankan bentuk perbandingan Ibrani, sedangkan frasa tentang takhta menjelaskan bahwa keunggulan itu berkaitan dengan kedudukan.
