  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: id
  text: Lalu sapi-sapi yang rupanya buruk dan kurus itu memakan tujuh sapi yang rupanya elok dan gemuk[a]. Kemudian Firaun terbangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “buruk rupa ... dan sehat.” Kata-kata Ibrani yang digunakan dapat diterjemahkan lebih harfiah sebagai “buruk” dan “sehat/tambun”, tetapi konteksnya mendukung kontras fisik antara sapi yang buruk rupa dan kurus dengan sapi yang elok dan gemuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: Lalu ... memakan
  rationale: Bentuk wayyiqtol feminin jamak melanjutkan urutan peristiwa dalam mimpi. 'Memakan' mempertahankan arti biasa verba אכל tanpa memperkuatnya menjadi 'melahap'.
- source_word: הַפָּרוֹת
  choice: sapi-sapi
  rationale: Bentuk feminin jamak secara khusus menunjuk kepada sapi betina; dalam bahasa Indonesia, 'sapi-sapi' wajar dan cukup jelas dalam konteks ini.
- source_word: רָעוֹת הַמַּרְאֶה
  choice: yang buruk rupanya
  rationale: רָעוֹת secara harfiah berarti 'buruk', sedangkan הַמַּרְאֶה menunjuk pada rupa atau penampilan. Ungkapan ini dekat dengan susunan Ibrani dan membentuk kontras dengan 'elok rupanya'.
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: dan kurus tubuhnya
  rationale: דַקֹּת menyatakan keadaan tipis atau kurus, dan בָּשָׂר di sini menunjuk pada daging/tubuh. 'Kurus tubuhnya' menyampaikan gambaran fisik secara alami dalam bahasa Indonesia.
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: ketujuh sapi
  rationale: Penanda objek langsung diikuti bilangan dan nomina diterjemahkan secara langsung sebagai 'ketujuh sapi'.
- source_word: יְפֹת הַמַּרְאֶה
  choice: yang elok rupanya
  rationale: Frasa ini berlawanan langsung dengan 'buruk rupanya'. 'Elok' mempertahankan nuansa positif dan gaya naratif yang bermartabat.
- source_word: וְהַבְּרִיאֹת
  choice: dan gemuk
  rationale: בָּרִיא dapat berarti sehat, tambun, atau gemuk. Karena dipertentangkan dengan sapi yang kurus tubuhnya, makna fisik 'gemuk' paling sesuai.
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: Kemudian Firaun terbangun
  rationale: Verba ini berarti 'terbangun'. 'Kemudian' menyampaikan kelanjutan urutan cerita dengan alami, sementara 'Firaun' mengikuti bentuk nama/jabatan yang lazim dalam bahasa Indonesia.
