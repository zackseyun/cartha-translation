  text: וַ/יִּישָׁ֕ן וַֽ/יַּחֲלֹ֖ם שֵׁנִ֑ית וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּ/קָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: id
  text: Kemudian ia tidur dan bermimpi untuk kedua kalinya. Tampaklah tujuh bulir gandum[a] tumbuh pada satu tangkai, berisi penuh[b] dan baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat merujuk pada bulir atau malai, yaitu bagian tanaman yang mengandung biji-biji gandum.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “sehat” atau “gemuk”. Kata ini menggambarkan bulir yang berkembang baik dan penuh berisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: Kemudian ia tidur
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “kemudian” menyatakan urutan itu secara alami tanpa menambah hubungan sebab-akibat.
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: dan bermimpi untuk kedua kalinya
  rationale: שֵׁנִית berfungsi adverbial, berarti bahwa tindakan bermimpi terjadi untuk kedua kalinya.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: Ungkapan ini mempertahankan fungsi הִנֵּה yang menghadirkan pemandangan mimpi secara hidup, dengan ragam Indonesia yang wajar dan bermartabat.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: tujuh bulir gandum
  rationale: שִׁבֳּלִים menunjuk pada bagian tanaman tempat biji-biji gandum tersusun; “bulir gandum” merupakan padanan Indonesia yang jelas.
- source_word: עֹלֹת
  choice: tumbuh
  rationale: Partisipel menggambarkan bulir-bulir yang sedang muncul atau bertumbuh dalam pemandangan mimpi; “tumbuh” alami dalam konteks tanaman.
- source_word: בְּקָנֶה אֶחָד
  choice: pada satu tangkai
  rationale: קָנֶה di sini adalah batang atau tangkai tanaman, dan בְּ paling alami dinyatakan dengan “pada” untuk bulir yang tumbuh pada tangkai itu.
- source_word: בְּרִיאוֹת
  choice: berisi penuh
  rationale: Dalam konteks bulir gandum, adjektiva ini menggambarkan bulir yang gemuk, sehat, atau penuh berisi; “berisi penuh” menyampaikan keadaan fisiknya dengan alami.
- source_word: וְטֹבוֹת
  choice: dan baik
  rationale: טוֹב adalah penilaian umum tentang mutu; “baik” mempertahankan keluasan maknanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Tampaklah” mempertahankan daya presentatif הִנֵּה tanpa memakai ungkapan yang terlalu arkais; “berisi penuh” dipilih agar gambaran pertanian mudah dipahami.
