base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: id
  text: 'Hendaklah Firaun bertindak demikian: hendaklah ia mengangkat para pengawas atas negeri dan memungut seperlima dari hasil tanah Mesir selama tujuh tahun kelimpahan.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengambil seperlima dari hasil tanah Mesir.” Kata kerja Ibrani ini dapat dipahami sebagai memungut atau mengambil bagian seperlima selama tahun-tahun kelimpahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: Hendaklah Firaun bertindak demikian
  rationale: Bentuk ini menyampaikan nasihat Yusuf dengan daya anjuran yang sesuai, sedangkan 'demikian' merujuk pada langkah yang kemudian dijelaskan.
- source_word: וְיַפְקֵד
  choice: hendaklah ia mengangkat
  rationale: Bentuk Hifil dari פקד di sini berarti menetapkan atau mengangkat orang untuk suatu tanggung jawab administratif.
- source_word: פְּקִדִים
  choice: para pengawas
  rationale: Istilah ini menunjuk para pejabat yang diberi tanggung jawab pengawasan; 'pengawas' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַל הָאָרֶץ
  choice: atas negeri ini
  rationale: Frasa ini menyatakan lingkup kewenangan administratif di wilayah Mesir. 'Negeri ini' wajar dalam konteks perkataan Yusuf kepada Firaun.
- source_word: וְחִמֵּשׁ
  choice: memungut seperlima
  rationale: Bentuk Piel yang jarang ini paling mungkin berarti mengambil atau mengenakan bagian seperlima, tetapi kemungkinan nuansanya dicatat dalam catatan kaki.
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: dari hasil tanah Mesir
  rationale: Secara harfiah objeknya adalah 'tanah Mesir', tetapi dalam konteks tahun-tahun panen berlimpah yang dipungut adalah hasil tanah; penambahan 'hasil' menjadikan maksud tersirat itu alami dan jelas.
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: selama tujuh tahun kelimpahan
  rationale: שׂבע menunjuk keadaan berlimpah atau berkecukupan dan dalam konteks ini berarti masa panen yang berlimpah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'hendaklah' mempertahankan nada nasihat resmi kepada Firaun; istilah administratif dibuat jelas tanpa nada militer. Penjelasan 'hasil tanah' menyatakan objek pemungutan yang tersirat oleh konteks.
