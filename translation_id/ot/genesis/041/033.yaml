  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: id
  text: Sekarang, hendaklah Firaun mencari seorang yang berpengertian dan bijaksana,[a] lalu mengangkatnya sebagai penguasa atas tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memilih seorang yang berpengertian dan bijaksana.” Kata kerja Ibrani yang dipakai di sini dapat bermakna melihat, menemukan, atau memilih, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari penafsiran mimpi kepada nasihat praktis. Bentuk ini alami dalam bahasa Indonesia modern tanpa harus mempertahankan kata penghubung secara harfiah.
- source_word: יֵרֶא פַרְעֹה
  choice: hendaklah Firaun mencari
  rationale: Bentuk jusif dari ראה dalam konteks ini mengarah pada tindakan mencari, menemukan, atau memilih calon yang tepat, bukan sekadar melihat.
- source_word: אִישׁ
  choice: seorang
  rationale: Menunjuk kepada satu orang laki-laki dalam konteks pejabat kerajaan; dalam susunan Indonesia, 'seorang' sudah alami dan tidak perlu diikuti 'laki-laki'.
- source_word: נָבוֹן
  choice: berpengertian
  rationale: Mengungkapkan kemampuan memahami dan menilai dengan tepat, khususnya untuk tugas pemerintahan.
- source_word: וְחָכָם
  choice: dan bijaksana
  rationale: Menyatakan hikmat dalam pertimbangan dan kecakapan praktis; 'bijaksana' merupakan padanan Indonesia yang alami dan berbeda secukupnya dari 'berpengertian'.
- source_word: וִישִׁיתֵהוּ
  choice: lalu mengangkatnya
  rationale: Kata שׂים secara dasar berarti menempatkan atau menetapkan; dalam konteks jabatan pemerintahan, 'mengangkatnya' menyampaikan tindakan penunjukan resmi dengan alami.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: untuk berkuasa atas tanah Mesir
  rationale: עַל menyatakan kedudukan atau wewenang atas wilayah. Tambahan 'untuk berkuasa' memperjelas hubungan administratif yang tersirat dalam ungkapan Ibrani tanpa menambahkan jabatan tertentu.
