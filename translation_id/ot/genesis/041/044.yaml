base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Akulah Firaun. Tanpamu[a], tidak seorang pun boleh mengangkat tangan atau kakinya[b] di seluruh tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terlepas darimu.” Dalam konteks ini, ungkapan tersebut menunjukkan bahwa tidak seorang pun di Mesir dapat bertindak secara mandiri dari wewenang Yusuf.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai ungkapan “mengangkat tangan atau kaki,” yaitu melakukan tindakan atau membuat gerakan apa pun.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara wajar dalam narasi Indonesia.
- source_word: אֲנִי פַרְעֹה
  choice: Akulah Firaun
  rationale: Konstruksi tanpa verba ini merupakan penegasan identitas dan kewibawaan. Partikel -lah menyampaikan tekanan itu secara alami tanpa menambah tafsiran.
- source_word: וּבִלְעָדֶיךָ
  choice: Tanpa persetujuanmu
  rationale: Secara harfiah berarti “tanpa engkau/di luar engkau”; dalam konteks pelimpahan wewenang, ungkapan ini menunjuk pada tindakan tanpa persetujuan Yusuf. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: לֹא יָרִים אִישׁ
  choice: tidak seorang pun boleh mengangkat
  rationale: Dalam konteks ketetapan kerajaan, bentuk imperfek negatif menyatakan larangan atau ketiadaan izin; “boleh” mengungkapkan daya dekret secara alami.
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: tangan atau kakinya
  rationale: Ungkapan konkret Ibrani dipertahankan. Dalam kalimat negatif bahasa Indonesia, “atau” menyampaikan bahwa tidak ada tindakan atau gerakan apa pun yang diizinkan.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: Padanan baku dan dekat dengan ungkapan wilayah dalam teks Ibrani.
theological_decisions:
- issue: Cakupan wewenang Yusuf di bawah Firaun
  choice: “Tanpa persetujuanmu” menyatakan bahwa orang Mesir tidak dapat bertindak tanpa otorisasi Yusuf.
  alternative: “Tanpa engkau” atau “selain engkau,” yang dapat dibaca terutama sebagai pengecualian pribadi.
  rationale: Konteks pengangkatan Yusuf mendukung nuansa kewenangan, tetapi catatan kaki mempertahankan bentuk dan ambiguitas leksikal yang lebih harfiah; teks tidak menyatakan bahwa Yusuf menggantikan kedudukan Firaun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Akulah” mempertahankan penegasan kerajaan, sedangkan idiom anggota tubuh tetap hadir dalam teks dan dijelaskan dalam catatan kaki.
