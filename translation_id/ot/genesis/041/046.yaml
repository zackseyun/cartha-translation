translation:
  language: id
  text: Yusuf berumur tiga puluh tahun ketika ia menghadap Firaun, raja Mesir. Yusuf keluar dari hadapan Firaun, lalu berkeliling ke seluruh negeri Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: berumur tiga puluh tahun
  rationale: Ungkapan usia dalam bahasa Ibrani diterjemahkan secara idiomatis dan wajar dalam bahasa Indonesia.
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: ketika ia menghadap Firaun
  rationale: Secara harfiah, frasa ini berarti 'ketika ia berdiri di hadapan Firaun'; dalam konteks istana, 'menghadap' menyampaikan kehadiran resmi di hadapan penguasa secara alami.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: raja Mesir
  rationale: Frasa konstruksi ini menjelaskan gelar Firaun secara aposisional.
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: Setelah meninggalkan hadapan Firaun
  rationale: Menyampaikan gerak keluar dari hadapan Firaun dalam bahasa Indonesia yang jelas, sekaligus mempertahankan gambaran kehadiran istana.
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: menjelajahi seluruh negeri Mesir
  rationale: Kata kerja dan keterangan tempat menunjukkan Yusuf bergerak melintasi wilayah Mesir secara menyeluruh; 'menjelajahi' ringkas dan alami tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: וְ / וַ
  choice: hubungan naratif dinyatakan melalui susunan kalimat dan 'Setelah'
  rationale: Konjungsi naratif Ibrani tidak harus selalu direproduksi dengan 'dan'; hubungan berurutan disampaikan secara alami dalam bahasa Indonesia tanpa menambahkan penanda seperti 'Adapun' atau 'Pada waktu itu'.
