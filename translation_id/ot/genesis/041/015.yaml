base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Aku bermimpi, tetapi tidak ada seorang pun yang dapat menafsirkannya. Namun, aku telah mendengar orang berkata tentang engkau bahwa ketika engkau mendengar sebuah mimpi, engkau dapat menafsirkannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: Aku bermimpi
  rationale: Ungkapan Ibrani memakai verba dan nomina dari akar yang sama (‘aku memimpikan sebuah mimpi’). Bahasa Indonesia alami menyampaikan maknanya dengan ‘Aku bermimpi’ tanpa pengulangan yang kaku.
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: tetapi tidak ada seorang pun yang dapat menafsirkannya
  rationale: Konstruksi ini secara harfiah menyatakan bahwa tidak ada penafsir bagi mimpi itu; ‘dapat’ mengungkapkan ketidakmampuan praktis yang tersirat dalam konteks.
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: aku telah mendengar orang berkata tentang engkau
  rationale: 'Mempertahankan unsur laporan tidak langsung: Firaun mendengar sesuatu yang dikatakan mengenai Yusuf.'
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: ketika engkau mendengar sebuah mimpi, engkau dapat menafsirkannya
  rationale: Menyampaikan idiom Ibrani secara wajar sambil mempertahankan hubungan antara mendengar mimpi dan mampu menafsirkannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ‘engkau’ dipilih untuk dialog naratif kerajaan tanpa memakai ragam yang terlalu arkais; ‘Firaun’ mengikuti bentuk baku Indonesia.
