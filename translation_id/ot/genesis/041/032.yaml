  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: pengulangan mimpi, kepastian perkara di hadapan/dari Allah, dan tindakan Allah yang segera semuanya tersampaikan. Namun, susunan «diulangi dua kali kepada Firaun» kurang jelas dalam bahasa Indonesia; frasa itu dapat terbaca seolah-olah tindakan mengulang dilakukan kepada Firaun, bukan bahwa Firaun menerima mimpi itu dua kali. Penempatan «kepada Firaun» lebih dekat dengan «mimpi» memperjelas rujukannya tanpa mengubah makna.'
