base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: id
  text: Mengenai mimpi yang diterima Firaun dua kali, hal itu terjadi karena perkara tersebut telah ditetapkan oleh Allah[a], dan Allah akan segera melaksanakannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkara tersebut sudah pasti dari Allah.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Allah bersegera melaksanakannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: Mengenai
  rationale: Memperkenalkan penjelasan tentang makna pengulangan mimpi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan fungsi topikal frasa Ibrani.
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: mimpi yang diulangi
  rationale: Bentuk infinitif pasif menyatakan bahwa mimpi itu terjadi kembali atau diulang, bukan bahwa Firaun sengaja mengulanginya.
- source_word: אֶל־פַּרְעֹה פַּעֲמָיִם
  choice: dua kali kepada Firaun
  rationale: Mempertahankan arah pengalaman mimpi kepada Firaun dan arti dual פַּעֲמָיִם, yaitu 'dua kali'.
- source_word: כִּי
  choice: hal itu terjadi karena
  rationale: 'Menyatakan hubungan sebab secara jelas dan alami: pengulangan mimpi dijelaskan oleh kepastian serta kesegeraan tindakan Allah.'
- source_word: נָכוֹן הַדָּבָר
  choice: perkara tersebut telah ditetapkan
  rationale: נָכוֹן menyatakan sesuatu yang teguh, pasti, atau sudah ditentukan; 'telah ditetapkan' cocok dengan konteks keputusan ilahi tanpa mempersempit 'perkara' menjadi sekadar ucapan.
- source_word: מֵעִם הָאֱלֹהִים
  choice: oleh Allah
  rationale: Frasa ini menyatakan bahwa ketetapan tersebut berasal dari Allah; 'oleh Allah' paling alami bersama bentuk pasif 'telah ditetapkan'.
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: dan Allah akan segera
  rationale: Partisipel menyampaikan tindakan yang mendesak atau segera akan berlangsung. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kedekatan waktunya.
- source_word: לַעֲשֹׂתוֹ
  choice: melaksanakannya
  rationale: Yang dimaksud ialah Allah mewujudkan perkara yang dinyatakan dalam mimpi; 'melaksanakan' lebih alami daripada 'melakukannya' dalam konteks ketetapan.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים dalam penjelasan Yusuf
  choice: Allah
  alternative: allah-allah / para dewa
  rationale: Walaupun bentuk katanya secara morfologis jamak, tata bahasa dan konteks mengacu kepada satu Allah yang menyatakan masa depan melalui Yusuf.
- issue: Kepastian perkara yang dinyatakan dalam mimpi
  choice: telah ditetapkan oleh Allah
  alternative: sudah pasti dari Allah
  rationale: Pilihan utama mempertahankan gagasan keteguhan ilahi dan hubungan sumber/agensi dalam מֵעִם, tanpa menjelaskan secara berlebihan bagaimana ketetapan Allah bekerja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Firaun' serta 'Allah' mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Struktur kalimat dibuat jelas bagi pembaca umum sambil mempertahankan hubungan sebab, kepastian perkara, dan kesegeraan tindakan dalam teks Ibrani.
