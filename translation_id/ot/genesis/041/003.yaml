  to: Lalu tampaklah[a] tujuh ekor sapi betina lain muncul dari Sungai Nil sesudah sapi-sapi itu. Mereka buruk rupa dan kurus badannya[b]. Mereka berdiri di samping sapi-sapi tadi di tepi Sungai Nil.
