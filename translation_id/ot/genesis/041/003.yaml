  source_fidelity: 'Makna pokok tersampaikan dengan tepat: tujuh sapi kedua muncul dari Sungai Nil setelah kelompok pertama, berpenampilan buruk dan kurus, lalu berdiri di samping kelompok pertama di tepi sungai. Namun, פָּרוֹת adalah bentuk feminin jamak dan secara khusus berarti sapi betina; penerjemahan sebagai “sapi” saja kehilangan ketepatan leksikal yang dapat dipertahankan secara alami dalam bahasa Indonesia.'
