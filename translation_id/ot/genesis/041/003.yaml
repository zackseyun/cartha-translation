base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: id
  text: Lalu tampaklah[a] tujuh ekor sapi betina lain muncul dari Sungai Nil sesudah sapi-sapi itu. Mereka buruk rupa dan kurus badannya[b]. Mereka berdiri di samping sapi-sapi tadi di tepi Sungai Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan lihatlah”; ungkapan Ibrani ini menghadirkan sesuatu yang tiba-tiba tampak dalam adegan mimpi.
    reason: discourse_marker
  - marker: b
    text: Secara harfiah, “buruk rupanya dan tipis dagingnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu tampaklah
  rationale: Mempertahankan fungsi penanda wacana yang menghadirkan adegan secara hidup dan mendadak, dengan ungkapan Indonesia yang wajar dalam narasi mimpi.
- source_word: פָּרוֹת
  choice: sapi
  rationale: Bentuk feminin jamak menunjuk pada sapi betina; dalam bahasa Indonesia, 'sapi' sudah tepat dan alami tanpa perlu menambahkan jenis kelamin yang telah jelas dari konteks.
- source_word: אֲחֵרוֹת
  choice: lain
  rationale: Menandai kelompok kedua yang berbeda dari tujuh sapi sebelumnya.
- source_word: עֹלוֹת
  choice: muncul
  rationale: Dalam konteks sapi keluar dari sungai, 'muncul dari' menyampaikan gerakan ke atas secara alami tanpa kekakuan harfiah.
- source_word: אַחֲרֵיהֶן
  choice: sesudah sapi-sapi itu
  rationale: Menyatakan urutan kemunculan dan memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam latar Mesir, istilah ini secara khusus menunjuk kepada Sungai Nil; nama langsung membuat latar geografis jelas.
- source_word: רָעוֹת מַרְאֶה
  choice: Rupa mereka buruk
  rationale: Menggambarkan penampilan yang tidak sedap dipandang, bukan keburukan moral, sambil tetap dekat dengan susunan Ibrani.
- source_word: דַקּוֹת בָּשָׂר
  choice: tubuh mereka kurus
  rationale: Menyampaikan kekurusan jasmani secara alami dalam bahasa Indonesia sambil mempertahankan gambaran tubuh/daging.
- source_word: וַתַּעֲמֹדְנָה
  choice: Mereka berdiri
  rationale: Padanan naratif yang langsung dan jelas untuk tindakan mengambil posisi berdiri.
- source_word: אֵצֶל
  choice: di samping
  rationale: Menyatakan kedekatan posisi secara tepat dan alami.
- source_word: שְׂפַת הַיְאֹר
  choice: di tepi Sungai Nil
  rationale: '''Tepi'' merupakan padanan Indonesia yang lazim untuk pinggir atau tepian sungai.'
