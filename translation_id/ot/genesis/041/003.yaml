  terminology: “Sungai Nil” tepat untuk הַיְאֹר dalam latar Mesir. “Tepi Sungai Nil” tepat untuk שְׂפַת הַיְאֹר. “Sapi betina” diperlukan untuk memelihara ciri feminin pada פָּרוֹת; istilah ini tidak menyatakan usia tertentu seperti “dara.”
