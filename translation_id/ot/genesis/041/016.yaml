  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: id
  text: Yusuf menjawab Firaun, katanya, “Bukan aku; Allah akan memberi Firaun jawaban yang baik[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah akan memberi Firaun jawaban tentang kesejahteraannya”; secara harfiah, “Allah akan menjawab kesejahteraan Firaun.”'
    reason: Menjaga nuansa idiomatis שְׁלוֹם פַּרְעֹה, yang dapat menunjuk pada jawaban yang baik/damai maupun pada kesejahteraan Firaun, tanpa memaksakan salah satu penafsiran.
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Bentuk naratif dari ענה memperkenalkan tanggapan Yusuf secara langsung; ‘menjawab’ merupakan padanan Indonesia yang lazim dan tepat.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶת־פַּרְעֹה
  choice: Firaun
  rationale: Penanda objek langsung menunjukkan bahwa Firaun adalah orang yang dijawab Yusuf; struktur Indonesia tidak memerlukan padanan tersendiri bagi אֶת.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus pengantar ujaran ini diterjemahkan secara alami dan ringkas dalam narasi Indonesia.
- source_word: בִּלְעָדָי
  choice: Bukan aku
  rationale: Ungkapan eliptis ini mengecualikan Yusuf sebagai sumber jawaban. ‘Bukan aku’ alami dalam bahasa Indonesia dan mempertahankan kontras tegas dengan Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini merujuk kepada Allah dengan verba tunggal; ‘Allah’ adalah padanan baku modern dalam penerjemahan Alkitab bahasa Indonesia.
- source_word: יַעֲנֶה
  choice: akan memberikan jawaban
  rationale: Secara harfiah berarti ‘akan menjawab’, tetapi bersama objek idiomatis שְׁלוֹם פַּרְעֹה, bentuk ‘memberikan jawaban’ menghasilkan bahasa Indonesia yang jelas dan wajar.
- source_word: שְׁלוֹם פַּרְעֹה
  choice: yang membawa kesejahteraan bagi Firaun
  rationale: שָׁלוֹם di sini mencakup kesejahteraan atau hasil yang baik. Frasa ini mempertahankan nuansa positif tanpa membatasinya pada ketenangan batin semata.
theological_decisions:
- issue: Sumber kemampuan untuk menjawab atau menafsirkan mimpi
  choice: Yusuf menyangkal bahwa dirinya adalah sumber jawaban dan menunjuk kepada Allah.
  alternative: ‘Itu di luar kemampuanku’ atau ‘Tanpa aku, Allah akan memberi Firaun jawaban yang baik.’
  rationale: Kontras antara בִּלְעָדָי dan אֱלֹהִים יַעֲנֶה menempatkan Allah, bukan Yusuf, sebagai sumber jawaban. Terjemahan tidak menambahkan penjelasan doktrinal di luar pernyataan ayat.
- issue: Nuansa שְׁלוֹם dalam jawaban Allah
  choice: Jawaban itu digambarkan membawa kesejahteraan bagi Firaun.
  alternative: ‘jawaban damai’ atau ‘jawaban tentang kesejahteraan Firaun’
  rationale: Konstruksi Ibrani bersifat idiomatis dan dapat menunjuk pada jawaban yang baik atau yang berkaitan dengan kesejahteraan Firaun. Pilihan ini mempertahankan nuansa positif, tanpa menyatakan bahwa seluruh isi penafsiran akan menyenangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat ringkas dan alami. ‘Bukan aku’ mempertahankan ketegasan ungkapan Ibrani, sedangkan ‘jawaban yang membawa kesejahteraan’ mengungkapkan idiom sumber tanpa memakai frasa Indonesia yang janggal.
