revisions:
- from: Pada pagi harinya, jiwa Firaun gelisah. Ia pun mengutus orang untuk memanggil semua ahli sihir Mesir dan semua orang bijak di negeri itu. Firaun menceritakan mimpinya kepada mereka, tetapi tidak seorang pun dapat menafsirkan semuanya[a] bagi Firaun.
  to: Pada pagi hari, hati Firaun gelisah. Ia mengirim utusan untuk memanggil semua ahli sihir Mesir dan semua orang bijak Mesir. Firaun menceritakan mimpinya kepada mereka, tetapi tidak ada seorang pun yang dapat menafsirkan hal-hal itu[a] bagi Firaun.
  rationale: Revisi mengganti padanan yang berpotensi menyatakan makna totalitas ('semuanya') dengan rujukan jamak yang lebih tepat ('hal-hal itu'), dan membetulkan catatan kaki agar menerangkan bentuk Ibrani secara akurat. Ungkapan tentang kegelisahan batin serta keterangan waktu juga dinaturalkan tanpa mengubah makna.
