base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: id
  text: Pada pagi hari, hati Firaun gelisah. Ia mengirim utusan untuk memanggil semua ahli sihir Mesir dan semua orang bijak Mesir. Firaun menceritakan mimpinya kepada mereka, tetapi tidak ada seorang pun yang dapat menafsirkan hal-hal itu[a] bagi Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, kata ganti objek di sini berbentuk jamak: “menafsirkan hal-hal itu,” sedangkan sebelumnya tertulis “mimpinya” dalam bentuk tunggal. Bentuk jamak itu mungkin merujuk pada bagian-bagian mimpi atau memandang pengalaman mimpi itu secara distributif. Sejumlah terjemahan menghaluskannya menjadi “menafsirkan mimpi itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: Pada pagi harinya
  rationale: Ungkapan waktu yang alami dalam narasi Indonesia dan mempertahankan urutan peristiwa.
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: jiwa Firaun gelisah
  rationale: Kata kerja menyatakan keguncangan batin; 'jiwa' mempertahankan dimensi batin dari רוּחַ tanpa mempersempitnya menjadi pikiran saja. Nama Firaun dipakai agar rujukan pronominal jelas dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: Ia pun mengutus orang untuk memanggil
  rationale: Mengungkapkan secara wajar bahwa Firaun mengirim utusan untuk memanggil mereka, sambil tetap mencerminkan kedua tindakan Ibrani.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: semua ahli sihir Mesir
  rationale: Istilah ini menunjuk para ahli ritual dan ilmu rahasia Mesir; 'ahli sihir' merupakan padanan Indonesia yang jelas dan lazim dalam konteks Kejadian–Keluaran.
- source_word: כָּל חֲכָמֶיהָ
  choice: semua orang bijak di negeri itu
  rationale: Akhiran feminin merujuk kepada Mesir; frasa ini membedakan kalangan cendekia istana dari para ahli sihir.
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: Firaun menceritakan mimpinya kepada mereka
  rationale: Mempertahankan bentuk tunggal 'mimpinya' dalam teks Masoret.
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: tetapi tidak seorang pun dapat menafsirkan semuanya bagi Firaun
  rationale: '''Menafsirkan'' sesuai dengan konteks mimpi. ''Semuanya'' mencerminkan pronomina objek jamak Ibrani tanpa mengubah nomina tunggal sebelumnya menjadi jamak.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Struktur tunggal–jamak yang tidak biasa dalam teks Ibrani dipertahankan melalui 'mimpinya' dan 'semuanya', lalu dijelaskan dalam catatan kaki.
