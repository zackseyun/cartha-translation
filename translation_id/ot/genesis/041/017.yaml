  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: id
  text: Lalu Firaun berkata kepada Yusuf, “Dalam mimpiku, lihatlah, aku sedang berdiri di tepi Sungai Nil.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani: “sungai.” Dalam konteks Mesir di Kitab Kejadian, istilah ini biasanya menunjuk kepada Sungai Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berkata
  rationale: Dalam narasi yang diikuti ujaran langsung, ‘berkata’ merupakan padanan Indonesia yang alami untuk verba ‘berbicara’ ini.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: אֶל יוֹסֵף
  choice: kepada Yusuf
  rationale: Preposisi menandai orang yang dituju dalam pembicaraan; ‘kepada’ paling wajar dalam bahasa Indonesia.
- source_word: בַּחֲלֹמִי
  choice: Dalam mimpiku
  rationale: Menerjemahkan secara langsung preposisi serta akhiran orang pertama tunggal dan tetap alami dalam laporan mimpi.
- source_word: הִנְנִי
  choice: lihatlah, aku sedang
  rationale: ‘Lihatlah’ mempertahankan fungsi presentatif dan daya hidup ungkapan Ibrani, sedangkan ‘sedang’ sesuai dengan partisip yang mengikutinya dalam konteks laporan mimpi.
- source_word: עֹמֵד
  choice: berdiri
  rationale: Menyatakan keadaan berdiri sebagaimana makna dasar partisip Ibrani.
- source_word: עַל שְׂפַת
  choice: di tepi
  rationale: Secara harfiah berarti ‘pada bibir/tepi’; untuk lokasi di sisi sungai, ‘di tepi’ adalah ungkapan Indonesia yang paling alami.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam latar Mesir di Kitab Kejadian, istilah ini lazim menunjuk kepada Sungai Nil; nama eksplisit memperjelas acuannya.
