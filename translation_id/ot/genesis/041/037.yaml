base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/037.yaml
  text: The matter seemed good in the eyes of Pharaoh and in the eyes of all his servants[a][b].
translation:
  language: id
  text: Usul itu dipandang baik oleh Firaun dan oleh semua pegawainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Hal itu baik di mata Firaun dan di mata semua hambanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב
  choice: dipandang baik
  rationale: Dalam konstruksi dengan בְּעֵינֵי, verba יטב menyatakan penilaian bahwa sesuatu dianggap baik, berkenan, atau dapat diterima. 'Dipandang baik' alami dalam bahasa Indonesia dan mempertahankan unsur penilaian dari idiom Ibrani.
- source_word: הַדָּבָר
  choice: usul itu
  rationale: דָּבָר memiliki cakupan luas, tetapi dalam konteks langsung menunjuk pada saran yang baru saja disampaikan Yusuf. 'Usul itu' memperjelas rujukannya tanpa mengubah isi.
- source_word: בְּעֵינֵי ... וּבְעֵינֵי
  choice: oleh ... dan oleh
  rationale: Idiom harfiah 'di mata' menyatakan penilaian atau penerimaan. Bentuk pasif 'dipandang baik oleh' menyampaikan maknanya secara wajar dalam bahasa Indonesia, sedangkan pengulangan 'oleh' mencerminkan kesejajaran sumber.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku gelar penguasa Mesir dalam tradisi dan penggunaan Alkitab bahasa Indonesia.
- source_word: כָּל עֲבָדָיו
  choice: semua pegawainya
  rationale: Dalam lingkungan istana, עֲבָדִים menunjuk para pelayan atau pejabat yang mengabdi kepada raja. 'Pegawai' cukup luas untuk menyatakan fungsi istana tanpa menekankan status budak atau membatasi mereka hanya pada pejabat tinggi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Terjemahan utama mengalihkan idiom Ibrani 'baik di mata' menjadi ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan bentuk harfiahnya dan kemungkinan terjemahan עֲבָדָיו sebagai 'hambanya'.
