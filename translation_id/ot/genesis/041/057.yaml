translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur 'ke Mesir, kepada Yusuf' dipertahankan untuk mencerminkan dua unsur tujuan dalam teks Ibrani, sedangkan 'gandum' dibuat eksplisit karena tersirat dalam verba konteks kelaparan.
