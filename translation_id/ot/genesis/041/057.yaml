  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: id
  text: Orang-orang dari seluruh bumi[a] datang ke Mesir kepada Yusuf untuk membeli gandum, sebab kelaparan itu sangat parah di seluruh bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seluruh negeri” atau “seluruh dunia.” Secara harfiah, “seluruh bumi.” Kata Ibrani אֶרֶץ dapat berarti “bumi,” “negeri,” atau “wilayah”; di sini ungkapan itu tampaknya secara luas menunjuk kepada negeri-negeri yang dilanda kelaparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: Seluruh bumi
  rationale: Mempertahankan keluasan ungkapan Ibrani dan pengulangan retorisnya. Dalam konteks ini, ungkapan tersebut merujuk secara luas, dan mungkin hiperbolis, kepada negeri-negeri yang dilanda kelaparan.
- source_word: בָּאוּ
  choice: datang
  rationale: Makna lazim בוא adalah datang atau masuk; sudut pandang narasi menjadikan Mesir sebagai tujuan.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran arah menyatakan gerak menuju Mesir, yang secara alami diterjemahkan 'ke Mesir'.
- source_word: לִשְׁבֹּר
  choice: untuk membeli gandum
  rationale: Dalam konteks kelaparan, שׁבר merupakan ungkapan untuk membeli atau memperoleh gandum; objek tersirat dibuat eksplisit demi kejelasan.
- source_word: אֶל יוֹסֵף
  choice: kepada Yusuf
  rationale: Menerjemahkan preposisi secara dekat tanpa mengubahnya menjadi 'dari Yusuf'; Yusuf dipandang sebagai pejabat yang dituju untuk memperoleh gandum.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan orang-orang datang ke Mesir.
- source_word: חָזַק הָרָעָב
  choice: kelaparan itu sangat parah
  rationale: Secara harfiah kelaparan itu 'kuat', tetapi bahasa Indonesia alami menyatakan intensitas kelaparan dengan 'sangat parah'.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: Menjaga pengulangan ungkapan הָאָרֶץ serta penekanan cakupan luas dalam teks Ibrani.
