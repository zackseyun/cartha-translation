  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: id
  text: Lalu berakhirlah tujuh tahun kelimpahan yang terjadi di tanah Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: Lalu berakhirlah
  rationale: Bentuk wayyiqtol dari כלה menyatakan bahwa masa itu selesai dalam urutan narasi. 'Lalu berakhirlah' alami dalam narasi Indonesia dan mempertahankan penekanan pada berakhirnya ketujuh tahun itu.
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: tujuh tahun kelimpahan
  rationale: Frasa konstruksi Ibrani secara alami diterjemahkan 'tujuh tahun kelimpahan'; שׂבע menunjuk pada keadaan hasil yang berlimpah.
- source_word: אֲשֶׁר הָיָה
  choice: yang terjadi
  rationale: Klausa relatif ini menerangkan masa kelimpahan tersebut. 'Yang terjadi' lebih alami daripada 'yang ada' untuk suatu periode dalam bahasa Indonesia modern, tanpa menambahkan hubungan sebab-akibat.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Menerjemahkan אֶרֶץ secara eksplisit sebagai 'tanah' dan mempertahankan ungkapan geografis teks sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernuansa naratif; susunan inversi 'berakhirlah' memberi gaya yang bermartabat tanpa terdengar kuno.
