  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: id
  text: 'Lalu, dalam mimpiku aku melihat: tampaklah tujuh bulir gandum[a] muncul pada satu tangkai, bernas dan baik.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tujuh malai gandum.” Istilah Ibrani dapat merujuk pada bulir atau malai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Lalu ... aku melihat
  rationale: Bentuk wayyiqtol Qal dari ראה melanjutkan penuturan orang pertama Firaun; “lalu” mempertahankan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: בַּחֲלֹמִי
  choice: dalam mimpiku
  rationale: Preposisi ב dengan חֲלוֹם dan sufiks orang pertama tunggal secara langsung berarti “dalam mimpiku.”
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הִנֵּה menghadirkan pemandangan secara hidup dan mendadak. “Tampaklah” menjaga daya penyajian itu dalam ragam Indonesia yang wajar dan bermartabat.
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: tujuh bulir gandum
  rationale: שִׁבֹּלֶת menunjuk pada bulir atau malai biji-bijian. Dalam konteks gandum pada rangkaian mimpi ini, “bulir gandum” merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: עֹלֹת
  choice: tumbuh
  rationale: Partisipel Qal feminin jamak menggambarkan tindakan yang sedang berlangsung dalam penglihatan mimpi; “tumbuh” menyampaikan gerak munculnya bulir secara idiomatis.
- source_word: בְּקָנֶה אֶחָד
  choice: pada satu tangkai
  rationale: קָנֶה di sini ialah batang atau tangkai tanaman; “pada satu tangkai” mempertahankan gambaran tujuh bulir yang muncul pada satu tangkai.
- source_word: מְלֵאֹת
  choice: bernas
  rationale: Secara harfiah berarti “penuh”; untuk bulir gandum, “bernas” secara alami menyatakan bulir yang penuh berisi tanpa mengubah maknanya.
- source_word: וְטֹבוֹת
  choice: dan baik
  rationale: טוֹב memiliki arti luas “baik.” Pilihan ini mempertahankan keluasan leksikal dan penilaian positif dalam teks Ibrani.
