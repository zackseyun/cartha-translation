base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: id
  text: Di sana bersama kami ada seorang pemuda Ibrani, budak kepala pengawal[a]. Kami menceritakan mimpi kami kepadanya, lalu ia menafsirkannya bagi kami; ia menafsirkan mimpi masing-masing sesuai dengan mimpinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang pemuda Ibrani, budak milik kepala para penjagal.” Gelar ini dapat menunjuk kepada kepala pengawal atau kepala pelaksana hukuman.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “masing-masing sesuai dengan mimpinya ia tafsirkan,” yaitu setiap orang menerima tafsiran yang sesuai dengan mimpinya sendiri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: pemuda
  rationale: Kata ini menunjuk kepada seorang laki-laki muda; “pemuda” alami dalam bahasa Indonesia dan tidak memberi kesan anak kecil.
- source_word: עִבְרִי
  choice: Ibrani
  rationale: Sebutan etnis ini secara baku diterjemahkan “Ibrani”.
- source_word: עֶבֶד
  choice: budak
  rationale: Status terikat Yusuf menonjol dalam frasa ini karena ia disebut sebagai milik atau bawahan kepala pengawal; “budak” mempertahankan kekuatan istilah sumber.
- source_word: שַׂר הַטַּבָּחִים
  choice: kepala pengawal
  rationale: Ini adalah gelar pejabat istana Mesir. “Kepala pengawal” jelas dan selaras dengan fungsi tokoh tersebut dalam konteks, sementara arti harfiahnya berkaitan dengan para penjagal atau pelaksana hukuman.
- source_word: וַנְּסַפֶּר לוֹ
  choice: Kami menceritakan mimpi kami kepadanya
  rationale: Objek yang diceritakan dipahami dari konteks sebagai mimpi mereka; penyebutannya menghasilkan bahasa Indonesia yang alami tanpa mengubah makna.
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: lalu ia menafsirkannya bagi kami
  rationale: Dalam konteks mimpi, פתר berarti menafsirkan. Pronomina “-nya” merujuk dengan jelas kepada mimpi kami yang baru disebut.
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: ia menafsirkan mimpi masing-masing sesuai dengan mimpinya
  rationale: Terjemahan ini mempertahankan daya distributif אִישׁ dan penekanan bahwa setiap tafsiran disesuaikan dengan mimpi orang yang bersangkutan, sekalipun pengulangan “mimpi” terdengar sedikit formal.
