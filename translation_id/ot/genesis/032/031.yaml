  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: id
  text: Yakub menamai tempat itu Peniel[a], karena ia berkata, “Aku telah melihat Allah bertatap muka dan nyawaku terselamatkan.”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Peniel berkaitan dengan ungkapan Ibrani yang berarti “wajah Allah,” sesuai dengan penjelasan Yakub, “Aku telah melihat Allah bertatap muka.”
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “jiwaku terselamatkan”; di sini “jiwa” berarti nyawa atau diri Yakub.
    reason: lexical_alternative
  - marker: c
    text: Kata “Allah” juga dapat dipahami lebih luas sebagai “suatu makhluk ilahi,” tetapi konteks lebih mendukung “Allah”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא יַעֲקֹב שֵׁם הַמָּקוֹם
  choice: Yakub menamai tempat itu
  rationale: Dalam rumus penamaan Ibrani, קרא שׁם berarti memberi atau menyebut nama. Ungkapan Indonesia ini menyampaikan maknanya secara alami tanpa mempertahankan idiom yang kaku.
- source_word: פְּנִיאֵל
  choice: Peniel
  rationale: Nama tempat ini ditransliterasikan sesuai bentuk pada ayat ini dan mempertahankan permainan kata dengan 'wajah Allah'.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Yakub memberi nama tersebut.
- source_word: רָאִיתִי אֱלֹהִים
  choice: Aku telah melihat Allah
  rationale: Bentuk orang pertama dipertahankan tanpa menambahkan 'katanya'. Dalam konteks narasi, אֱלֹהִים paling wajar merujuk kepada Allah, meski kemungkinan arti yang lebih luas dicatat.
- source_word: פָּנִים אֶל פָּנִים
  choice: berhadapan muka
  rationale: Ungkapan ini alami dalam bahasa Indonesia, menyatakan perjumpaan langsung, dan tetap membawa unsur 'muka/wajah' yang terkait dengan nama Peniel.
- source_word: וַתִּנָּצֵל נַפְשִׁי
  choice: tetapi nyawaku terselamatkan
  rationale: נפשׁ dalam konteks ini berarti nyawa atau kehidupan konkret, bukan terutama jiwa tak berjasad. Konjungsi diterjemahkan 'tetapi' untuk menyatakan kontras pragmatis antara melihat Allah dan tetap hidup; bentuk pasif mempertahankan nuansa נצל.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Yakub
  choice: Allah
  alternative: suatu makhluk ilahi
  rationale: Konteks penamaan Peniel dan keseluruhan kisah mendukung rujukan langsung kepada Allah. Namun, keluasan leksikal kata Ibrani itu tetap disebutkan dalam catatan tanpa mengurangi ketegangan naratif tentang manusia yang melihat Allah dan bertahan hidup.
- issue: Hubungan antara melihat Allah dan keselamatan nyawa Yakub
  choice: tetapi nyawaku terselamatkan
  alternative: dan nyawaku terselamatkan
  rationale: 'Waw dapat menghubungkan klausa secara umum, tetapi dalam konteks ini hubungan kontras tersirat: Yakub melihat Allah secara langsung, namun tetap hidup. ''Tetapi'' membuat hubungan wacana itu jelas tanpa menjelaskan bagaimana ketegangan teologis tersebut diselesaikan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kutipan langsung menandai perpindahan mendadak dari narasi orang ketiga ke penjelasan orang pertama yang memang terdapat dalam teks Ibrani, tanpa menambahkan 'katanya'. Istilah 'nyawa' dipilih agar נפשׁ dipahami secara konkret sebagai kehidupan Yakub.
