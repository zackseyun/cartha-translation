revisions:
- from: Yakub menamai tempat itu Peniel[a], sebab, “Aku telah melihat Allah berhadapan muka, tetapi nyawaku terselamatkan.”[b][c]
  to: Yakub menamai tempat itu Peniel[a], karena ia berkata, “Aku telah melihat Allah bertatap muka dan nyawaku terselamatkan.”[b][c]
  rationale: Revisi memperbaiki sintaks kutipan langsung dalam bahasa Indonesia, mengganti kontras eksplisit “tetapi” dengan sambungan netral “dan” yang mencerminkan waw Ibrani, serta memakai “bertatap muka” sebagai padanan modern yang alami untuk idiom “muka dengan muka”. Catatan kaki tetap mempertahankan alternatif leksikal dan ketidakpastian yang relevan tanpa memaksakan penafsiran doktrinal.
