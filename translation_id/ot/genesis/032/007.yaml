  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: id
  text: Para utusan itu kembali kepada Yakub[a] dan berkata, “Kami telah mendatangi saudaramu, Esau, dan ia juga sedang dalam perjalanan untuk menemuimu, dan ada empat ratus laki-laki bersamanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, yang kurang mungkin dalam konteks ini, “para malaikat itu kembali kepada Yakub.” Kata Ibrani מַלְאָכִים dapat berarti “utusan” atau “malaikat”, tetapi di sini menunjuk kepada orang-orang yang diutus Yakub kepada Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻבוּ
  choice: kembali
  rationale: Bentuk wayyiqtol dari שׁוב menyatakan tindakan lampau dalam alur cerita; ‘kembali’ wajar karena para utusan pulang kepada Yakub setelah diutus.
- source_word: הַמַּלְאָכִים
  choice: para utusan
  rationale: מַלְאָכִים dapat berarti ‘utusan’ atau ‘malaikat’. Dalam konteks ini, yang dimaksud ialah orang-orang yang sebelumnya diutus Yakub kepada Esau.
- source_word: לֵאמֹר
  choice: dan berkata
  rationale: Infinitif ini memperkenalkan perkataan langsung. Dalam narasi Indonesia, ‘dan berkata’ lebih alami daripada bentuk harfiah ‘dengan berkata’.
- source_word: בָּאנוּ אֶל
  choice: kami telah menemui
  rationale: בוא אֶל secara harfiah berarti ‘datang kepada’. Karena para pembicara kini telah kembali dan melaporkan perjalanan mereka, ‘telah menemui’ menyampaikan tercapainya tujuan tanpa menimbulkan kejanggalan deiktis dalam bahasa Indonesia.
- source_word: אָחִיךָ אֶל עֵשָׂו
  choice: saudaramu, Esau
  rationale: Frasa kedua mengidentifikasi saudara Yakub sebagai Esau. Aposisi dengan koma mempertahankan penegasan itu secara alami.
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: Sekarang ia juga sedang dalam perjalanan untuk menemuimu
  rationale: Partisipel הֹלֵךְ menunjukkan tindakan yang sedang berlangsung, sedangkan גַם menambahkan kabar penting bahwa Esau sendiri bergerak menuju Yakub. ‘Sedang dalam perjalanan’ mempertahankan aspek progresif.
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: dan ada empat ratus orang bersamanya
  rationale: Ungkapan ini menyatakan bahwa empat ratus laki-laki menyertai Esau. ‘Orang’ lazim dipakai setelah bilangan dalam bahasa Indonesia dan tidak menyangkal bahwa kelompok tersebut terdiri dari laki-laki.
