translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur Ibrani dipertahankan sejauh alami, sementara deiksis dan aspek verbal disesuaikan agar laporan para utusan mudah dipahami.
