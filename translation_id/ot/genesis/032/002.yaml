translation:
  language: id
  text: Yakub melanjutkan perjalanannya, lalu malaikat-malaikat Allah[a] menjumpainya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan-utusan Allah.”
    reason: lexical_alternative
  - marker: b
    text: Atau “bertemu dengannya” atau “mendatanginya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: Yakub
  rationale: Nama יַעֲקֹב ditransliterasikan sebagai “Yakub,” bentuk baku dalam bahasa Indonesia. Konjungsi וְ tercermin secara alami dalam kesinambungan narasi tanpa perlu selalu diterjemahkan tersendiri sebagai “dan”.
- source_word: הָלַךְ לְ/דַרְכּ/וֹ
  choice: melanjutkan perjalanannya
  rationale: Secara harfiah berarti “pergi pada jalannya.” Dalam konteks ini, ungkapan tersebut menyatakan bahwa Yakub meneruskan perjalanan; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan arah narasinya.
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: lalu ... menjumpainya
  rationale: Kata פגע dengan preposisi ב dapat berarti bertemu atau berjumpa dengan seseorang. “Menjumpainya” mempertahankan kemungkinan nuansa pertemuan atau perjumpaan tanpa menyiratkan permusuhan.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: malaikat-malaikat Allah
  rationale: Frasa konstruksi ini secara harfiah berarti “malaikat-malaikat Allah.” Konteks ayat berikutnya, yang menyebut tempat itu sebagai perkemahan Allah, mendukung pengertian makhluk surgawi.
theological_decisions:
- issue: Referen מַלְאֲכֵי אֱלֹהִים
  choice: malaikat-malaikat Allah sebagai makhluk surgawi
  alternative: utusan-utusan Allah sebagai manusia
  rationale: מַלְאָךְ dapat berarti “utusan” manusia ataupun “malaikat,” tetapi penyebutan “perkemahan Allah” dalam ayat berikutnya kuat mendukung referen supernatural. Frasa milik dalam bahasa Indonesia tetap dipertahankan secara transparan.
- issue: Nuansa perjumpaan dalam וַיִּפְגְּעוּ בוֹ
  choice: menjumpainya
  alternative: bertemu dengannya; mendatanginya
  rationale: Teks tidak menjelaskan apakah pertemuan itu disengaja, mendadak, atau bersifat konfrontatif. “Menjumpainya” menjaga ketegangan leksikal itu tanpa menambahkan motif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara frasa teologis “malaikat-malaikat Allah” dipertahankan dekat dengan bentuk Ibrani. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
