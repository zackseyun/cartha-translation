  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: id
  text: Ia menyerahkan setiap kawanan secara terpisah kepada para hambanya[a], lalu berkata kepada mereka, “Majulah mendahului aku dan berilah jarak antara satu kawanan dan kawanan lainnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam tangan para hambanya,” suatu ungkapan Ibrani yang berarti menyerahkan sesuatu ke dalam penguasaan atau tanggung jawab seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “antara kawanan dan antara kawanan.” Pengulangan itu menekankan adanya jarak dari satu kawanan ke kawanan lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד
  choice: menyerahkan ... kepada
  rationale: Secara harfiah berarti “memberikan/menaruh ke dalam tangan,” tetapi dalam konteks ini merupakan ungkapan yang menyatakan penyerahan ke dalam penguasaan atau tanggung jawab seseorang. “Menyerahkan ... kepada” menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: עֶבֶד dapat berarti hamba atau budak. Di sini yang ditonjolkan ialah para anggota rumah tangga Yakub yang melaksanakan perintahnya, sehingga “hamba” paling sesuai dengan konteks.
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: tiap-tiap kawanan secara terpisah
  rationale: Pengulangan עֵדֶר bersifat distributif, yakni setiap kelompok ternak ditata sendiri-sendiri. “Tiap-tiap kawanan secara terpisah” menyampaikan pengulangan dan לְבַדּוֹ dengan jelas.
- source_word: עִבְרוּ לְפָנַי
  choice: Berjalanlah mendahului aku
  rationale: עָבַר menyatakan gerak melewati atau maju, sedangkan לְפָנַי berarti “di hadapanku/di depanku.” Dalam konteks perjalanan ini, Yakub memerintahkan para hambanya bergerak lebih dahulu.
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: dan berilah jarak
  rationale: רֶוַח berarti ruang atau selang. Ungkapan “berilah jarak” alami dalam bahasa Indonesia dan menyatakan bahwa kawanan-kawanan itu harus dipisahkan.
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: antara kawanan yang satu dan kawanan berikutnya
  rationale: Frasa Ibrani mengulang kata “kawanan” untuk menegaskan pemisahan kelompok demi kelompok. Terjemahan ini mempertahankan makna distributifnya dengan ungkapan Indonesia yang alami.
