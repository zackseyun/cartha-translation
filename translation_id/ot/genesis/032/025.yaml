  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: id
  text: Lalu Yakub ditinggalkan seorang diri, dan seorang laki-laki[a] bergulat dengannya sampai fajar menyingsing[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyebut sosok itu “seorang laki-laki”. Konteks selanjutnya dan Hosea 12:4 memberi keterangan lebih lanjut tentang identitasnya.
    reason: cross_reference
  - marker: b
    text: 'Secara harfiah: “sampai terbitnya fajar”; dapat juga diterjemahkan “sampai fajar terbit”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: tinggallah
  rationale: Bentuk Nifal menyatakan bahwa Yakub ditinggalkan atau tinggal setelah yang lain menyeberang. Dalam konteks naratif Indonesia, 'tinggallah' secara alami mempertahankan hasil keadaan itu tanpa menyiratkan bahwa ia sengaja memilih tinggal.
- source_word: לְבַדּוֹ
  choice: seorang diri
  rationale: Ungkapan ini menekankan keterasingan Yakub; 'seorang diri' merupakan padanan Indonesia yang alami dan jelas.
- source_word: וַיֵּאָבֵק
  choice: bergulat
  rationale: Kata kerja langka ini menunjuk pada pergumulan fisik atau gulat, sehingga 'bergulat' lebih tepat daripada istilah umum seperti 'berjuang'.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Teks Ibrani memperkenalkan sosok itu sebagai 'seorang laki-laki'. Terjemahan ini menjaga cara narasi mula-mula menampilkan identitasnya dan tidak menyelesaikan misteri tersebut terlalu dini.
- source_word: עִמּוֹ
  choice: dengannya
  rationale: Padanan langsung yang menyatakan bahwa laki-laki itu bergulat dengan Yakub.
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: sampai fajar menyingsing
  rationale: Secara harfiah berarti 'sampai terbit/naiknya fajar'. 'Sampai fajar menyingsing' alami dalam bahasa Indonesia dan mempertahankan gambaran datangnya fajar.
theological_decisions:
- issue: Identitas אִישׁ dalam adegan pergulatan
  choice: Menerjemahkannya sebagai 'seorang laki-laki' tanpa menetapkan identitas malaikat atau ilahi dalam teks utama.
  alternative: Malaikat; Allah/TUHAN yang menampakkan diri sebagai manusia.
  rationale: Ayat ini sendiri hanya menyebut sosok tersebut 'seorang laki-laki'. Konteks berikutnya dan Hosea 12:4 membantu pembaca memahami identitasnya lebih jauh, tetapi terjemahan ayat ini perlu mempertahankan ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. Susunan 'tinggallah Yakub' mempertahankan kesinambungan cerita, sedangkan 'seorang diri' dan 'fajar menyingsing' mudah dipahami pembaca umum. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
