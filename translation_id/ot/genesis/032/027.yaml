  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: id
  text: Lalu ia berkata[a], “Lepaskan aku, sebab fajar telah menyingsing[b].” Namun ia berkata[c], “Aku tidak akan melepaskanmu sebelum engkau memberkati aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Biarkan aku pergi” atau “Suruhlah aku pergi.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “fajar telah terbit”; dapat juga diterjemahkan, “hari mulai terang.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani tidak menyebutkan secara eksplisit siapa yang berbicara dalam kedua bagian ayat ini; identitas mereka disimpulkan dari konteks narasi.
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: Lepaskan aku
  rationale: Bentuk imperatif שׁלח dengan akhiran orang pertama tunggal berarti meminta agar dirinya dilepaskan atau dibiarkan pergi. Dalam konteks pergulatan, “Lepaskan aku” alami dan mempertahankan makna dasar verba.
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: sebab fajar telah menyingsing
  rationale: כִּי menyatakan alasan, sedangkan עָלָה הַשָּׁחַר menggambarkan fajar yang telah terbit. “Fajar telah menyingsing” mempertahankan citra itu dalam ungkapan Indonesia yang wajar.
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: Aku tidak akan melepaskanmu
  rationale: Imperfek yang dinegasikan menyatakan penolakan tegas. Pengulangan “melepaskan” mempertahankan kaitan verbal dengan permintaan sebelumnya.
- source_word: כִּי אִם
  choice: sebelum
  rationale: Dalam konteks penolakan yang berlaku sampai syarat terpenuhi, “sebelum” menyampaikan hubungan kondisional secara alami dalam bahasa Indonesia; maknanya adalah ia tidak akan melepaskan lawannya kecuali setelah menerima berkat.
- source_word: בֵּרַכְתָּנִי
  choice: engkau memberkati aku
  rationale: Bentuk perfektif sesudah ungkapan syarat merujuk pada tindakan yang dituntut sebelum pelepasan. Bentuk Indonesia ini menyatakan syarat tersebut secara lugas.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: Lalu ia berkata ... Namun ia berkata
  rationale: Teks Ibrani mengulang verba “berkata” tanpa menyebut subjek secara eksplisit. “Namun” menandai tanggapan yang berlawanan tanpa menambahkan identitas penutur.
theological_decisions:
- issue: Identitas para penutur
  choice: Mempertahankan kata ganti umum “ia” tanpa menyebut nama atau identitas kedua penutur.
  alternative: Menyebut penutur pertama sebagai orang itu, malaikat, atau Allah, dan penutur kedua sebagai Yakub.
  rationale: Teks Ibrani ayat ini hanya memakai bentuk verba orang ketiga maskulin tunggal; identitas penutur disimpulkan dari konteks. Tidak menambahkannya menjaga ambiguitas dan ketegangan naratif yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti “engkau” dipakai dalam dialog Alkitabiah tanpa menjadi terlalu arkais. Semua identitas penutur yang tidak dinyatakan dalam teks sumber dibiarkan implisit.
