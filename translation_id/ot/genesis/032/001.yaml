  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: id
  text: Pagi-pagi sekali Laban bangun, lalu mencium anak-anak lelakinya dan anak-anak perempuannya[a] serta memberkati mereka. Kemudian Laban pergi dan kembali ke tempatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelakinya dan anak-anak perempuannya.” Sebutan ini kemungkinan besar mengacu pada keturunan Laban, yaitu cucu-cucunya.
    reason: Istilah kekerabatan Ibrani dapat dipakai bagi keturunan yang lebih luas daripada anak kandung langsung.
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Pagi-pagi sekali Laban bangun
  rationale: Ungkapan ini menyampaikan makna verba Hifil שׁכם, yaitu bangun atau mulai bertindak sejak pagi, bersama keterangan בַּבֹּקֶר. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan penekanan waktunya.
- source_word: וַיְנַשֵּׁק
  choice: lalu mencium
  rationale: Verba נשׁק di sini menunjukkan ciuman kekeluargaan saat berpisah; 'mencium' merupakan padanan langsung dan alami.
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: anak-anak lelakinya dan anak-anak perempuannya
  rationale: Terjemahan mempertahankan dua istilah kekerabatan yang dibedakan menurut gender dalam teks Ibrani. Kemungkinan bahwa istilah itu mencakup cucu dijelaskan dalam catatan kaki, bukan dimasukkan ke dalam teks utama.
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: serta memberkati mereka
  rationale: ברך secara langsung berarti 'memberkati'. Konteksnya adalah perpisahan, tetapi makna ini tidak dipersempit menjadi sekadar mengucapkan selamat jalan.
- source_word: וַיֵּלֶךְ וַיָּשָׁב
  choice: pergi dan kembali
  rationale: 'Kedua verba gerak dipertahankan agar urutan narasi Ibrani tetap tampak: Laban pergi dari mereka dan kembali.'
- source_word: לִמְקֹמוֹ
  choice: ke tempatnya
  rationale: מקום berarti 'tempat'. Padanan ini menjaga keluasan makna sumber dan tidak menambahkan gagasan 'rumah' yang hanya tersirat.
theological_decisions:
- issue: Istilah kekerabatan yang dibedakan menurut gender
  choice: anak-anak lelakinya dan anak-anak perempuannya
  alternative: anak-anaknya; cucu-cucunya
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin dan feminin. Bentuk itu dipertahankan tanpa menetralkan atau memastikan bahwa semua yang dimaksud adalah cucu; kemungkinan cakupan keturunan diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Penanda catatan kaki ditempatkan sesudah frasa kekerabatan yang diterangkannya. Pengulangan 'pergi dan kembali' dipertahankan karena mencerminkan dua verba berbeda dalam teks sumber.
