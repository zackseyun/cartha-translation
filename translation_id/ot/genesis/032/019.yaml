  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: id
  text: Lalu katakanlah[a], ‘Ini pemberian dari hambamu Yakub, yang dikirim kepada tuanku, Esau. Lihatlah[b], ia juga ada di belakang kami.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
