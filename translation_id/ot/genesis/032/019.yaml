  rationale: Revisi menghapus penekanan «sendiri» yang tidak diperlukan, melicinkan aposisi bagi Esau dalam bahasa Indonesia modern, memperbaiki alternatif catatan b agar selaras dengan teks utama, dan membetulkan tanda kutip penutup. Makna posisi «di belakang kami» dipertahankan, sementara alternatif catatan menjelaskan kemungkinan nuansa gerak.
