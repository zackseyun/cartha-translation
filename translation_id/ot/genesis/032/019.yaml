lexical_decisions:
- source_word: וְאָֽמַרְתָּ
  choice: Lalu katakanlah
  rationale: Waw yang diikuti bentuk perfek dalam rangkaian perintah melanjutkan instruksi Yakub; bentuk imperatif Indonesia menyampaikan daya perintahnya secara alami.
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: dari hambamu Yakub
  rationale: Frasa ini mengidentifikasi Yakub dengan sebutan merendah di hadapan Esau. Bahasa Indonesia memerlukan perumusan relasional agar kaitannya dengan pemberian jelas dan alami.
- source_word: מִנְחָה
  choice: pemberian
  rationale: Dalam konteks ini kata tersebut menunjuk pada pemberian pendamai kepada Esau, bukan persembahan ibadah. 'Pemberian' jelas dan tidak terlalu menekankan kewajiban politis.
- source_word: שְׁלוּחָה
  choice: yang dikirim
  rationale: Partisip pasif feminin menerangkan מִנְחָה sebagai sesuatu yang telah dikirim; klausa relatif pasif alami dalam bahasa Indonesia.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: kepada tuanku, kepada Esau
  rationale: Pengulangan 'kepada' mempertahankan aposisi Ibrani dan gelar hormat yang digunakan Yakub bagi Esau.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian pada keterangan berikutnya; 'Lihatlah' bermartabat tetapi tetap mudah dipahami.
- source_word: גַם הוּא
  choice: ia sendiri juga
  rationale: Ungkapan ini menekankan bahwa Yakub sendiri menyusul selain pemberian yang telah mendahuluinya.
- source_word: אַחֲרֵינוּ
  choice: ada di belakang kami
  rationale: Terjemahan ini mempertahankan makna posisi secara langsung tanpa memastikan secara berlebihan aspek gerak yang hanya tersirat oleh konteks.
