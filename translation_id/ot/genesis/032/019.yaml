  source_fidelity: Terjemahan pada dasarnya menyampaikan perintah kepada para pelayan, identifikasi Yakub sebagai «hambamu», pemberian yang dikirim kepada Esau sebagai «tuanku», serta posisi Yakub di belakang mereka. Namun, «ia sendiri juga» menambahkan penekanan refleksif yang tidak diperlukan oleh גַּם הוּא («ia juga»), dan pengulangan «kepada» sebelum «Esau» kurang wajar dalam aposisi Indonesia.
  naturalness: «Kepada tuanku, Esau» merupakan aposisi yang lebih alami dalam bahasa Indonesia baku daripada «kepada tuanku, kepada Esau». Tanda kutip penutup ganda tambahan juga perlu dihapus.
  terminology: «Pemberian», «hambamu», dan «tuanku» tepat bagi konteks sosial dan nada merendahkan diri Yakub. «Lihatlah» secara memadai mewakili וְהִנֵּה tanpa menjadi terlalu arkais.
  issues:
