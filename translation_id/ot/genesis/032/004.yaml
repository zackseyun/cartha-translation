base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: id
  text: Yakub mengutus para utusan mendahuluinya kepada Esau, saudaranya, ke tanah Seir, wilayah Edom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “padang Edom”; kemungkinan besar ungkapan ini merupakan sebutan bagi wilayah Edom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Bentuk wayyiqtol dari שלח menyatakan tindakan lampau berurutan dalam narasi. “Mengutus” alami untuk tindakan mengirim orang sebagai wakil.
- source_word: מַלְאָכִים
  choice: beberapa utusan
  rationale: מַלְאָכִים dapat berarti utusan manusia atau malaikat. Dalam konteks ini Yakub mengirim orang kepada Esau, sehingga “utusan” paling sesuai; “beberapa” membuat bentuk jamaknya jelas secara alami dalam bahasa Indonesia.
- source_word: לְפָנָיו
  choice: mendahuluinya
  rationale: Secara harfiah berarti “di hadapannya,” tetapi di sini menunjukkan bahwa para utusan berangkat lebih dahulu daripada Yakub. “Mendahuluinya” menyampaikan hubungan gerak itu secara ringkas dan alami.
- source_word: אֶל־עֵשָׂו אָחִיו
  choice: kepada Esau, saudaranya
  rationale: אֶל menandai penerima atau tujuan pengutusan. Susunan ini mempertahankan nama Esau dan keterangan hubungan keluarga tanpa menimbulkan kerancuan.
- source_word: אַרְצָה שֵׂעִיר
  choice: ke tanah Seir
  rationale: Akhiran direktif pada אַרְצָה menunjukkan gerak menuju suatu tempat. “Ke tanah Seir” mempertahankan unsur “tanah/negeri” yang disebut secara eksplisit.
- source_word: שְׂדֵה אֱדֹם
  choice: wilayah Edom
  rationale: Secara harfiah frasa ini adalah “padang Edom,” tetapi dalam konteks geografis שָׂדֶה menunjuk kawasan atau wilayah terbuka. “Wilayah Edom” menyampaikan fungsi regionalnya dengan wajar sambil mencatat bentuk harfiahnya dalam catatan kaki.
