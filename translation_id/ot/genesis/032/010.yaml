  naturalness: Bahasa draf baku dan bernada khidmat. Namun, “Allah Abraham, leluhurku” lebih langsung, alami, dan setia daripada parafrasa “Allah yang disembah Abraham, bapakku.” “Kaum keluargamu” merupakan padanan modern yang wajar bagi nuansa kekerabatan מוֹלֶדֶת.
  terminology: “Yahweh” tepat untuk יְהוָה. “Berfirman” sesuai register ujaran ilahi. “Leluhurku” menyampaikan אָבִי secara idiomatis dalam konteks Abraham dan Ishak tanpa menyiratkan bahwa mereka ayah langsung Yakub.
  issues:
