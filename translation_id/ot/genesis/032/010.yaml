base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: id
  text: Lalu Yakub berkata, “Ya Allah Abraham, leluhurku, dan Allah Ishak, leluhurku, ya Yahweh, yang berfirman kepadaku, ‘Kembalilah ke negerimu dan kepada kaum keluargamu, dan Aku akan berbuat baik kepadamu,’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: Lalu Yakub berkata
  rationale: Waw konsekutif melanjutkan alur cerita; ‘Lalu’ menyatakannya secara alami dalam bahasa Indonesia tanpa mempertegas urutan lebih daripada teks sumber.
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: Ya Allah yang disembah Abraham, bapakku, dan Allah yang disembah Ishak, bapakku
  rationale: Rangkaian konstruksi Ibrani secara harfiah dapat berbunyi ‘Allah bapakku Abraham’; ungkapan ‘yang disembah’ membuat hubungan genitifnya jelas dan alami dalam bahasa Indonesia tanpa menyatakan bahwa Allah adalah ayah Abraham atau Ishak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam Tetragramaton dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הָאֹמֵר אֵלַי
  choice: yang telah berfirman kepadaku
  rationale: Partisip berartikel menggambarkan Yahweh sebagai Dia yang berbicara kepada Yakub; ‘telah berfirman’ sesuai konteks ujaran ilahi yang sudah diberikan.
- source_word: שׁוּב לְאַרְצְךָ
  choice: Kembalilah ke negerimu
  rationale: Imperatif שׁוּב menyatakan kembali, sedangkan אֶרֶץ di sini menunjuk negeri atau wilayah asal.
- source_word: וּלְמוֹלַדְתְּךָ
  choice: dan kepada sanak saudaramu
  rationale: מוֹלֶדֶת dapat menunjuk kelompok kerabat maupun tempat asal. Dalam konteks ini, ‘sanak saudara’ menyampaikan segi kekerabatan, sambil mengakui bahwa nuansa tempat asal juga mungkin.
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: maka Aku akan berbuat baik kepadamu
  rationale: Bentuk kausatif יטב dengan עִם menyatakan tindakan yang mendatangkan kebaikan bagi Yakub. Rumusan ini alami dan mempertahankan janji kemurahan tanpa memasukkan hasil tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri dan membedakannya dari gelar.
- issue: Hubungan Allah dengan Abraham dan Ishak dalam frasa konstruksi
  choice: Allah yang disembah Abraham ... dan Allah yang disembah Ishak
  alternative: Allah Abraham ... dan Allah Ishak
  rationale: Pilihan ini menghindari ambiguitas yang tidak wajar dalam bahasa Indonesia, tetapi tidak menambahkan klaim denominatif; konteksnya tetap seruan Yakub kepada Allah leluhurnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ‘Ya’ menandai bentuk vokatif dalam doa. ‘Berfirman’ dipakai untuk ujaran ilahi; kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Ayat dibiarkan berakhir dengan koma karena secara sintaksis doa berlanjut ke ayat berikutnya.
