  to: Lalu Yakub berkata, “Ya Allah Abraham, leluhurku, dan Allah Ishak, leluhurku, ya Yahweh, yang berfirman kepadaku, ‘Kembalilah ke negerimu dan kepada kaum keluargamu, dan Aku akan berbuat baik kepadamu,’”
