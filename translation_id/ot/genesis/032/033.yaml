id: GEN.32.33
reference: Genesis 32:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: id
  text: Itulah sebabnya sampai hari ini keturunan Israel[a] tidak memakan urat pangkal paha[b] yang terdapat pada lekuk sendi paha, karena orang itu menyentuh lekuk sendi paha Yakub pada urat pangkal pahanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; maksudnya orang-orang Israel sebagai keturunan Israel (Yakub).
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini menunjuk suatu urat di daerah pangkal paha. Bagian tubuh yang tepat tidak pasti; ada yang mengartikannya sebagai saraf skiatik atau tendon terkait.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan sebab-akibat ini secara alami memperkenalkan penjelasan mengenai kebiasaan yang masih berlangsung.
- source_word: לֹא יֹאכְלוּ
  choice: tidak memakan
  rationale: Bentuk imperfek dengan negasi menyatakan kebiasaan yang berlanjut; bentuk kini bahasa Indonesia menyampaikan hal itu dengan wajar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mengungkapkan hubungan asal-usul yang terdapat dalam ungkapan harfiah 'anak-anak Israel', tetapi lebih alami dalam bahasa Indonesia modern dan tidak tertukar dengan nama negara modern.
- source_word: גִּיד הַנָּשֶׁה
  choice: urat pangkal paha
  rationale: גִּיד menunjuk jaringan seperti urat, sedangkan arti tepat הַנָּשֶׁה tidak pasti. Pilihan ini mempertahankan kaitan anatomis dengan daerah pangkal paha tanpa memastikan bahwa yang dimaksud khususnya saraf skiatik atau tendon.
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: yang terdapat pada lekuk sendi paha
  rationale: כַּף dalam konteks ini menunjuk bagian cekung atau lekuk persendian, dan יָרֵךְ mencakup daerah paha/pangkal paha. Rumusan ini konkret namun tidak terlalu teknis.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis langsung yang menyatakan keberlanjutan kebiasaan sampai masa penutur.
- source_word: כִּי נָגַע
  choice: karena orang itu menyentuh
  rationale: נגע pada dasarnya berarti 'menyentuh'. Subjek eksplisit 'orang itu' dipakai agar rujukan pronomina maskulin tunggal dari konteks sebelumnya jelas tanpa menentukan identitas teologisnya.
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב
  choice: lekuk sendi paha Yakub
  rationale: Mempertahankan padanan anatomis yang sama seperti pada bagian pertama ayat.
- source_word: בְּגִיד הַנָּשֶׁה
  choice: pada urat pangkal pahanya
  rationale: Preposisi dipahami secara lokatif sebagai titik sentuhan; sufiks '-nya' membuat hubungan dengan paha Yakub alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas subjek tersirat dalam כִּי נָגַע
  choice: orang itu
  alternative: ia / Dia
  rationale: Bahasa Ibrani hanya memakai verba maskulin tunggal dan konteks sebelumnya menyebut sosok yang bergulat dengan Yakub. 'Orang itu' mempertahankan rujukan naratif tanpa mengunci identitas sosok tersebut secara teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah anatomi dibuat mudah dipahami tanpa menghilangkan ketidakpastian leksikal teks Ibrani; pengulangan istilah dipertahankan demi koherensi sumber.
