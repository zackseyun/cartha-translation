  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Yakub dinyatakan sebagai subjek agar rujukan pronomina awal ayat jelas ketika ayat dibaca tersendiri. Istilah 'kakakku' dipilih karena Esau adalah saudara kembar yang lahir lebih dahulu.
