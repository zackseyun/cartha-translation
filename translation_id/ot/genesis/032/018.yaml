base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/018.yaml
  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: id
  text: Lalu Yakub memerintahkan orang yang paling depan, katanya, “Apabila Esau, kakakku, bertemu denganmu dan bertanya kepadamu, ‘Siapakah tuanmu? Ke mana kamu pergi? Milik siapakah semua yang ada di depanmu ini?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: orang yang paling depan
  rationale: Dalam konteks rombongan yang disusun berurutan, bentuk ini menunjuk kepada orang yang berada pada urutan paling depan.
- source_word: לְמִי אַתָּה
  choice: Siapakah tuanmu?
  rationale: Secara harfiah ungkapan ini berarti 'milik siapa engkau?' Dalam konteks seorang hamba yang ditanyai identitas rombongannya, pertanyaan idiomatis ini menanyakan siapa tuannya.
- source_word: וְאָנָה תֵלֵךְ
  choice: Ke mana kamu pergi?
  rationale: Menyampaikan pertanyaan arah atau tujuan secara langsung dan alami dalam bahasa Indonesia.
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: Milik siapakah semua yang ada di depanmu ini?
  rationale: Mempertahankan pertanyaan kepemilikan dan acuan spasial לְפָנֶיךָ, sementara אֵלֶּה dibiarkan cukup umum karena dapat merujuk pada kawanan dan para pengiringnya.
theological_decisions: []
