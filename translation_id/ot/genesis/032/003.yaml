  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: id
  text: Ketika Yakub melihat mereka, ia berkata, “Ini perkemahan Allah.” Maka ia menamai tempat itu Mahanaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Mahanaim terdengar seperti ungkapan Ibrani yang berarti “dua perkemahan” atau “perkemahan ganda”, menggemakan perkataan Yakub, “Ini perkemahan Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר רָאָם
  choice: Ketika Yakub melihat mereka
  rationale: כַּאֲשֶׁר menyatakan keadaan atau waktu, sedangkan akhiran orang ketiga jamak pada רָאָם merujuk kepada para malaikat Allah dalam konteks sebelumnya.
- source_word: מַחֲנֵה אֱלֹהִים
  choice: perkemahan Allah
  rationale: מַחֲנֶה berarti tempat atau kelompok yang berkemah. 'Perkemahan Allah' alami dalam bahasa Indonesia dan mempertahankan kaitan bunyi serta makna dengan nama Mahanaim.
- source_word: זֶה
  choice: Ini
  rationale: Kata tunjuk ini berfungsi sebagai predikat nominal; dalam bahasa Indonesia, 'Ini perkemahan Allah' jelas dan tidak memerlukan kopula.
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: Maka ia menamai tempat itu
  rationale: Ungkapan Ibrani harfiahnya 'memanggil nama tempat itu'. 'Menamai tempat itu' menyampaikan idiom tersebut secara wajar dan tepat dalam bahasa Indonesia modern.
- source_word: מַחֲנָיִם
  choice: Mahanaim
  rationale: Nama tempat dipertahankan melalui transliterasi. Bentuknya berkaitan dengan מַחֲנֶה dan dapat menyiratkan 'dua perkemahan', sehingga nuansanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna אֱלֹהִים dalam frasa מַחֲנֵה אֱלֹהִים
  choice: Allah
  alternative: ilah/para dewa
  rationale: Konteks langsung menyebut para malaikat Allah dan menggambarkan perjumpaan Yakub dengan Allah Israel; karena itu אֱלֹהִים di sini paling tepat dipahami sebagai Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' menjaga gaya naratif yang ringkas; 'perkemahan' dipilih agar jelas sebagai nomina tempat sekaligus mempertahankan permainan kata dengan Mahanaim.
