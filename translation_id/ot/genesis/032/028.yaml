  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: id
  text: Ia berkata kepadanya, “Siapa namamu?” Ia berkata, “Yakub.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol dari אמר meneruskan alur narasi. “Ia berkata” mempertahankan makna dasar verba dan tetap alami dalam bahasa Indonesia.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks orang ketiga tunggal maskulin menyatakan arah perkataan kepada tokoh laki-laki yang dimaksud; “kepadanya” adalah padanan Indonesia yang ringkas dan wajar.
- source_word: מַה שְּׁמֶךָ
  choice: Siapa namamu?
  rationale: Secara harfiah frasa ini berarti “apa namamu”, tetapi dalam bahasa Indonesia pertanyaan mengenai nama seseorang secara idiomatis diungkapkan dengan “Siapa namamu?” tanpa mengubah maksud sumber.
- source_word: וַיֹּאמֶר
  choice: Ia menjawab
  rationale: Walaupun אמר pada dasarnya berarti “berkata”, kemunculan kedua berfungsi sebagai jawaban atas pertanyaan. “Ia menjawab” menyampaikan fungsi wacananya secara alami tanpa menambahkan isi.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi ini ditransliterasikan memakai bentuk Indonesia yang sudah mapan dalam tradisi Alkitab dan penggunaan umum.
