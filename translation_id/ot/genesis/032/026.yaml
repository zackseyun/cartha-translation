  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: id
  text: Ketika ia melihat bahwa ia tidak dapat mengalahkannya[a], ia menyentuh rongga pangkal pahanya[c][b], lalu sendi pangkal paha Yakub bergeser dari tempatnya ketika ia bergulat dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak dapat mengunggulinya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “rongga pahanya”; secara tradisional juga diterjemahkan “lekuk pangkal pahanya.”'
    reason: lexical_alternative
  - marker: c
    text: Kata-kata ganti dalam bahasa Ibrani tetap ambigu; ayat ini tidak menyebutkan kembali secara eksplisit identitas lawan Yakub.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ia melihat
  rationale: Bentuk naratif dengan waw memajukan cerita; frasa ini menyampaikan hubungan waktunya secara alami tanpa memperjelas subjek yang tidak disebutkan.
- source_word: לֹא יָכֹל לוֹ
  choice: ia tidak dapat mengalahkannya
  rationale: יכל dengan ל menyatakan ketidakmampuan terhadap lawan; pilihan ini sesuai dengan konteks pergulatan tanpa menyiratkan ketidakmampuan mutlak.
- source_word: וַיִּגַּע
  choice: ia menyentuh
  rationale: נגע pada dasarnya berarti 'menyentuh'; dampaknya memang kuat, tetapi terjemahan mempertahankan verba yang ringan dalam teks Ibrani.
- source_word: בְּכַף יְרֵכוֹ
  choice: rongga pangkal paha orang itu
  rationale: כף ירך menunjuk pada bagian cekung atau persendian di pangkal paha. 'Orang itu' mempertahankan ketidakjelasan pronomina tanpa menghasilkan rujukan posesif yang menyesatkan dalam bahasa Indonesia.
- source_word: וַתֵּקַע
  choice: terpelecok
  rationale: Dalam konteks ini verba tersebut menyatakan sendi yang bergeser atau keluar dari kedudukannya; 'terpelecok' merupakan ungkapan Indonesia yang alami untuk cedera sendi tersebut.
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: sendi pangkal paha Yakub
  rationale: Nama Yakub disebut secara eksplisit dalam bahasa Ibrani. 'Sendi pangkal paha' memperjelas bagian yang mengalami pergeseran.
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: ketika ia bergulat dengannya
  rationale: Infinitif dengan preposisi menandai tindakan yang berlangsung bersamaan; pronomina tetap dibiarkan ambigu sebagaimana teks sumber.
theological_decisions:
- issue: Rujukan pronomina bagi kedua tokoh dalam pergulatan
  choice: Mempertahankan pronomina dan tidak menyebut lawan Yakub sebagai manusia, malaikat, atau Allah dalam ayat ini.
  alternative: Menjelaskan bahwa sosok lawanlah yang menyentuh Yakub, atau secara eksplisit mengidentifikasinya sebagai sosok ilahi.
  rationale: Teks Ibrani ayat ini tidak menyebut ulang identitas subjek dan mengembangkan makna sosok tersebut secara bertahap dalam konteks yang lebih luas. Terjemahan tidak seharusnya menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang khidmat. Struktur pronomina dipertahankan sejauh mungkin, sementara 'orang itu' dipakai sekali untuk menghindari ambiguitas posesif bahasa Indonesia yang dapat salah menunjuk kepada subjek.
