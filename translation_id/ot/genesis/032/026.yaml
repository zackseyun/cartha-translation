  - severity: medium
    issue: '''Terpelecok'' tidak cukup tepat untuk וַתֵּקַע dalam konteks sendi pangkal paha.'
    rationale: Verba Ibrani menyatakan sendi terdorong/bergeser keluar dari kedudukannya. 'Terpelecok' umumnya menunjuk pada keseleo atau salah pijak dan dapat melemahkan hasil cedera yang dimaksud.
