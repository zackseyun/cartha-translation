revisions:
- from: Ketika ia melihat bahwa ia tidak dapat mengalahkannya[a], ia menyentuh rongga pangkal paha orang itu[b][c], lalu sendi pangkal paha Yakub terpelecok ketika ia bergulat dengannya.
  to: Ketika ia melihat bahwa ia tidak dapat mengalahkannya[a], ia menyentuh rongga pangkal pahanya[c][b], lalu sendi pangkal paha Yakub bergeser dari tempatnya ketika ia bergulat dengannya.
  rationale: Revisi menghapus nominalisasi 'orang itu' agar ambiguitas pronominal sumber tetap terjaga, sambil mempertahankan catatan yang menolong pembaca mengenali ambiguitas tersebut. Ungkapan cedera diubah menjadi 'bergeser dari tempatnya' untuk menyampaikan dislokasi sendi tanpa menambahkan penjelasan medis yang melampaui teks.
