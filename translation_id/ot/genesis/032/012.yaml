base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: id
  text: Tolong bebaskanlah aku dari tangan saudaraku, dari tangan Esau, sebab aku takut kepadanya, kalau-kalau ia datang dan menyerang aku, juga ibu bersama anak-anaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ibu di atas anak-anaknya”; suatu ungkapan tentang menyerang seorang ibu bersama anak-anaknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: Tolong lepaskanlah aku
  rationale: Bentuk imperatif Hifil dengan akhiran orang pertama tunggal berarti meminta agar dibebaskan atau diselamatkan; נָא memberi nada permohonan yang wajar dinyatakan dengan “tolong”.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan idiom Ibrani yang konkret dan masih mudah dipahami sebagai pembebasan dari kuasa seseorang.
- source_word: אָחִי
  choice: saudaraku
  rationale: Mempertahankan hubungan keluarga dan ketegangan emosional bahwa ancaman itu datang dari saudara Yakub sendiri.
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: sebab aku takut kepadanya
  rationale: Menyatakan alasan permohonan serta rasa takut Yakub yang sedang berlangsung dalam bahasa Indonesia alami.
- source_word: פֶּן יָבוֹא
  choice: Jangan-jangan ia datang
  rationale: פֶּן memperkenalkan kemungkinan yang ditakuti; “jangan-jangan” menyampaikan kekhawatiran itu secara alami tanpa menyatakannya sebagai kepastian.
- source_word: וְהִכַּנִי
  choice: dan menyerang aku
  rationale: נכה berarti memukul atau menghantam dan dalam konteks ini menunjuk serangan keras; “menyerang” menghindari kesan satu pukulan saja tanpa mempersempit makna menjadi “membunuh”.
- source_word: אֵם עַל בָּנִים
  choice: serta ibu bersama anak-anaknya
  rationale: Ungkapan ini menggambarkan ibu yang dihantam bersama anak-anaknya. “Serta” menjernihkan bahwa frasa tersebut memperluas sasaran serangan dan bukan menjelaskan identitas “aku”.
theological_decisions:
- issue: Cakupan objek dalam ungkapan אֵם עַל בָּנִים
  choice: aku, serta ibu bersama anak-anaknya
  alternative: aku—ibu bersama anak-anak
  rationale: Sintaks Ibrani sangat padat dan ungkapannya dapat terasa menggantung bila ditiru secara harfiah. Terjemahan ini mempertahankan gambaran kehancuran keluarga sekaligus menghindari kesan bahwa Yakub mengidentifikasi dirinya sebagai ibu; catatan kaki menyimpan bentuk harfiahnya.
translation_notes:
  register: Bahasa doa yang modern, lugas, dan bermartabat. Partikel permohonan diterjemahkan “tolong”; idiom “dari tangan” dipertahankan karena transparan dalam bahasa Indonesia. Tanda [a] ditempatkan pada ungkapan keluarga yang memerlukan penjelasan.
