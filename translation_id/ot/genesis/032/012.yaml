  naturalness: '''Tolong lepaskanlah'' dapat dipahami, tetapi ''Tolong bebaskanlah'' lebih idiomatis untuk permohonan pembebasan dari kuasa seseorang. ''Kalau-kalau'' merupakan penghubung modern yang alami untuk kemungkinan yang ditakuti. Penambahan ''juga'' membuat koordinasi objek akhir jelas tanpa mengubah keluasan ungkapan Ibrani.'
