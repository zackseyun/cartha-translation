  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: id
  text: tiga puluh unta betina yang menyusui beserta anak-anaknya, empat puluh sapi betina dan sepuluh sapi jantan, dua puluh keledai betina dan sepuluh keledai muda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepuluh keledai jantan.” Kata Ibrani ini dapat menunjuk pada keledai muda, tetapi dalam daftar ternak ini mungkin menunjuk pada keledai jantan yang dipasangkan dengan keledai betina.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: unta betina yang menyusui
  rationale: Bentuk partisip feminin menunjukkan unta-unta betina yang sedang menyusui; penyebutan jenis kelamin dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: וּבְנֵיהֶם
  choice: beserta anak-anaknya
  rationale: Secara harfiah berarti 'dan anak-anak mereka'; dalam konteks hewan, 'anak-anaknya' merupakan ungkapan Indonesia yang alami.
- source_word: פָּרוֹת
  choice: sapi betina
  rationale: Nomina ini secara khusus menunjuk pada sapi berjenis kelamin betina.
- source_word: וּפָרִים
  choice: dan sepuluh sapi jantan
  rationale: Istilah ini menunjuk pada sapi jantan; pilihan ini mempertahankan pembedaan jenis kelamin dalam daftar ternak.
- source_word: אֲתֹנֹת
  choice: keledai betina
  rationale: Bentuk ini secara khusus menunjuk pada keledai betina.
- source_word: וַעְיָרִם
  choice: dan sepuluh keledai muda
  rationale: עַיִר lazim menunjuk pada keledai muda. Terjemahan utama mempertahankan unsur usia, sedangkan kemungkinan makna keledai jantan dicatat dalam catatan kaki.
