  text: וַ/יְצַ֤ו אֹתָ/ם֙ לֵ/אמֹ֔ר כֹּ֣ה תֹאמְר֔וּ/ן לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּ/ךָ֣ יַעֲקֹ֔ב עִם לָבָ֣ן גַּ֔רְתִּי וָ/אֵחַ֖ר עַד עָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: id
  text: 'Lalu ia memerintahkan mereka, katanya, “Beginilah harus kamu katakan kepada tuanku Esau: ‘Beginilah kata hambamu Yakub: Aku telah tinggal sebagai pendatang bersama Laban dan tetap tinggal sampai sekarang.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Sebutan “hambamu” adalah cara Yakub merendahkan diri dengan hormat di hadapan Esau; sebutan itu tidak harus berarti bahwa Yakub benar-benar menjadi budaknya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: ia memerintahkan
  rationale: Kata צוה menyatakan pemberian perintah atau amanat yang tegas; “memerintahkan” mempertahankan daya arahannya.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Formula pengantar ujaran ini diterjemahkan secara alami dalam bahasa Indonesia sambil tetap menandai dimulainya perkataan langsung.
- source_word: כֹּה תֹאמְרוּן
  choice: Beginilah harus kamu katakan
  rationale: כֹּה memperkenalkan pesan tertentu yang harus disampaikan; bentuk ini jelas, wajar, dan mempertahankan nuansa instruksi.
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: kepada tuanku Esau
  rationale: “Tuanku” merupakan sapaan hormat sosial dari Yakub kepada Esau, bukan gelar ilahi; nama Esau ditempatkan sebagai aposisi secara alami.
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Formula utusan ini diperjelas dengan ungkapan Indonesia yang lazim tanpa mengubah fungsinya sebagai pengantar pesan resmi.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Di sini עבד berfungsi sebagai penyebutan diri yang merendah dan penuh hormat dalam komunikasi diplomatis, bukan sebagai penegasan bahwa Yakub secara harfiah adalah budak Esau.
- source_word: גַּרְתִּי
  choice: Aku telah tinggal sebagai pendatang
  rationale: גור mengandung nuansa menetap sebagai orang luar atau pendatang; pilihan ini menyampaikan unsur tersebut lebih jelas daripada sekadar “tinggal”.
- source_word: וָאֵחַר
  choice: dan menetap di sana
  rationale: Dalam konteks ini אחר menunjukkan keberlanjutan keberadaan Yakub sampai waktu kini. “Menetap di sana” alami dalam bahasa Indonesia dan tidak memberi kesan sekadar terlambat.
- source_word: עַד עָתָּה
  choice: sampai sekarang
  rationale: Padanan modern dan langsung untuk ungkapan waktu Ibrani ini.
theological_decisions:
- issue: Makna sosial עַבְדְּךָ dalam sapaan Yakub kepada Esau
  choice: hambamu
  alternative: budakmu
  rationale: Konteks pesan penghormatan mendukung penyebutan diri secara deferensial; ayat ini tidak dengan sendirinya menetapkan hubungan perbudakan harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Formula pesan dipertahankan melalui pengulangan “Beginilah,” sedangkan susunan kutipan dibuat jelas dan alami. Semua penanda catatan kaki muncul dalam teks utama.
