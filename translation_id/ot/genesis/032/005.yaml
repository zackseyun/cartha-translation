  to: 'Lalu ia memerintahkan mereka, katanya, “Beginilah harus kamu katakan kepada tuanku Esau: ‘Beginilah kata hambamu Yakub: Aku telah tinggal sebagai pendatang bersama Laban dan tetap tinggal sampai sekarang.’”[b]'
