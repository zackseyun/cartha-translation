  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: id
  text: Maka pemberian itu diteruskan mendahului Yakub, tetapi ia sendiri bermalam di perkemahan malam itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: berjalan
  rationale: Bentuk wayyiqtol dari עבר di sini menyatakan gerak maju dalam urutan kisah. 'Berjalan' alami bagi rombongan pembawa pemberian dan tidak menyiratkan penyeberangan batas atau sungai yang tidak disebutkan dalam klausa ini.
- source_word: הַמִּנְחָה
  choice: pemberian itu
  rationale: Dalam konteks ini מִנְחָה adalah pemberian Yakub kepada Esau, bukan persembahan ibadah. 'Pemberian' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַל־פָּנָיו
  choice: mendahului Yakub
  rationale: Ungkapan ini secara harfiah berarti 'di hadapannya' dan di sini menunjukkan bahwa pemberian itu bergerak di depan Yakub. Nama Yakub dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: וְהוּא
  choice: tetapi ia sendiri
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan dan kontras antara pemberian yang maju dan Yakub yang tetap tinggal.
- source_word: לָן
  choice: bermalam
  rationale: Kata לון/לין berarti menginap atau melewatkan malam. 'Bermalam' ringkas, alami, dan tepat dalam konteks ini.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: מַחֲנֶה menunjuk pada tempat rombongan berkemah; 'perkemahan' merupakan padanan Indonesia yang wajar.
