  rationale: Revisi mengganti personifikasi yang kurang alami pada "pemberian itu berjalan" dengan ungkapan pasif yang sesuai dengan konteks pemberian yang dikirim melalui para pembawa. Nama Yakub tetap dipertahankan untuk memperjelas rujukan, kontras dari וְהוּא tetap tampak dalam "tetapi ia sendiri," dan waktu serta lokasi bermalam tetap diterjemahkan lengkap.
