translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kontras dalam teks Ibrani dipertahankan melalui 'tetapi ia sendiri', sedangkan nama Yakub ditampilkan untuk memperjelas rujukan.
