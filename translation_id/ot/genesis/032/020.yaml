  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: id
  text: Ia juga memerintahkan orang yang kedua, orang yang ketiga, dan semua orang yang berjalan di belakang kawanan-kawanan itu, katanya, “Beginilah harus kalian katakan kepada Esau ketika kalian bertemu dengannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: Ia memerintahkan
  rationale: Bentuk piel dari צוה menyatakan pemberian perintah atau amanat yang tegas; “memerintahkan” mempertahankan daya direktifnya.
- source_word: גַּם אֶת הַשֵּׁנִי גַּם אֶת הַשְּׁלִישִׁי
  choice: juga ... orang yang kedua, orang yang ketiga
  rationale: Kedua bilangan tingkat dipakai secara substantival. Penambahan “orang” diperlukan agar wajar dalam bahasa Indonesia tanpa menentukan mereka sebagai hamba, yang tidak disebutkan secara eksplisit di ayat ini. Unsur גַּם pertama dinyatakan dengan “juga”; pengulangan berikutnya tidak perlu disalin secara kaku.
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: semua orang yang berjalan di belakang kawanan-kawanan itu
  rationale: Partisip הַהֹלְכִים dipertahankan sebagai tindakan yang sedang berlangsung. עֲדָרִים menunjuk kelompok-kelompok ternak yang digiring secara berturut-turut; bentuk jamak “kawanan-kawanan” menjaga gagasan beberapa kelompok.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Ungkapan naratif ini memperkenalkan perkataan langsung. “Katanya” alami dan ringkas dalam narasi Indonesia.
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: Beginilah harus kalian katakan
  rationale: Secara harfiah frasa ini berarti berbicara ‘menurut perkataan ini’, tetapi dalam konteks ia memberikan rumusan yang harus disampaikan. “Beginilah harus kalian katakan” menyampaikan fungsi idiomatis serta kekuatan perintah, sedangkan “kalian” cocok dengan verba orang kedua jamak.
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: ketika kalian bertemu dengannya
  rationale: Infinitif construct dengan בְּ menyatakan waktu. מצא secara dasar berarti ‘menemukan’, tetapi ketika objeknya orang yang akan dijumpai dalam perjalanan, “bertemu dengan” adalah padanan Indonesia yang alami.
