  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: id
  text: Namun, Engkau telah berfirman, “Aku pasti akan berbuat baik kepadamu dan membuat keturunanmu[a] seperti pasir di tepi laut, yang tidak dapat dihitung karena begitu banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”. Kata Ibrani זֶרַע berbentuk tunggal tetapi dapat bermakna kolektif, yaitu keturunan sebagai satu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: Namun, Engkau telah berfirman
  rationale: Kata sambung bersama pronomina mandiri memberi penekanan dan kontras dalam permohonan Yakub. “Namun” menangkap daya adversatifnya, sedangkan “telah berfirman” merujuk pada janji Allah sebelumnya dalam ragam yang wajar dan bermartabat.
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: Aku pasti akan berbuat baik kepadamu
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan kuat. “Pasti” mempertahankan penekanan itu, dan “berbuat baik kepadamu” menyampaikan tindakan penuh kebaikan tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: וְשַׂמְתִּי
  choice: dan membuat
  rationale: Dalam konteks menjadikan keturunan sangat banyak, שׂים berfungsi idiomatis sebagai “membuat”, bukan secara harfiah “menaruh”.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע adalah nomina kolektif tunggal. “Keturunanmu” alami dalam bahasa Indonesia dan dapat menunjuk kepada keseluruhan garis keturunan tanpa memakai ungkapan harfiah “benihmu”.
- source_word: כְּחוֹל הַיָּם
  choice: seperti pasir di laut
  rationale: Terjemahan ini mempertahankan perumpamaan Ibrani dengan susunan yang alami dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: yang tidak dapat dihitung karena begitu banyak
  rationale: Bentuk Nifal menyatakan ketakterhitungan, dan מֵרֹב memberi alasan berupa jumlah yang amat besar. Ungkapan ini jelas dan alami tanpa mengubah citranya.
