  source_fidelity: 'Terjemahan pada umumnya setia pada urutan dan makna teks Ibrani: matahari terbit atas Yakub ketika ia melewati Pnuel, dan ia masih dalam keadaan pincang. “Menyinarinya” secara wajar menyampaikan perspektif לּוֹ bersama זרח. Namun, יָרֵךְ secara dasar berarti “paha/upper leg”; “pangkal paha” mempersempit maknanya dan dapat mengimpor rincian anatomi dari ayat sebelumnya.'
