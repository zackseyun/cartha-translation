  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama Pnuel mengikuti bentuk Ibrani ayat ini. Frasa penutup dibuat idiomatis tanpa mengimpor rincian anatomi 'sendi pangkal paha' dari ayat sebelumnya.
