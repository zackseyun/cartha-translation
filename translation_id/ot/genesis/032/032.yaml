  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: id
  text: Matahari terbit menyinarinya ketika ia melewati Pnuel[a], dan ia berjalan pincang karena pahanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama tempat ini ditulis Pnuel; di tempat lain juga muncul bentuk Peniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: Matahari terbit menyinarinya
  rationale: Konstruksi dengan זרח dan ל menggambarkan matahari yang terbit atas seseorang. Ungkapan ini menyampaikan citra Ibrani secara alami dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר עָבַר
  choice: ketika ia melewati
  rationale: כַּאֲשֶׁר bersifat temporal, sedangkan עבר di sini berarti melewati suatu tempat; terjemahan ini tidak menambahkan gagasan penyeberangan yang tidak dinyatakan.
- source_word: אֶת פְּנוּאֵל
  choice: Pnuel
  rationale: Nama tempat ditransliterasikan menurut bentuk teks pada ayat ini, tanpa menyelaraskannya dengan bentuk alternatif Peniel.
- source_word: וְהוּא צֹלֵעַ
  choice: dan ia berjalan timpang
  rationale: Partisipel צֹלֵעַ menunjukkan keadaan atau tindakan yang sedang berlangsung. 'Berjalan timpang' jelas dan wajar dalam bahasa Indonesia.
- source_word: עַל יְרֵכוֹ
  choice: karena pangkal pahanya
  rationale: יָרֵךְ menunjuk paha atau pangkal paha. עַל dipahami secara kausal dalam konteks ini karena bagian tubuh itulah yang menyebabkan ia berjalan timpang; terjemahan harfiah 'di atas pahanya' tidak alami dalam bahasa Indonesia.
