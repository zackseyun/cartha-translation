  terminology: “Pnuel” merupakan transliterasi yang dapat dipertahankan untuk bentuk פְּנוּאֵל dalam ayat ini, dan catatan mengenai bentuk alternatif “Peniel” tepat. Istilah “paha” lebih sesuai dengan יָרֵךְ daripada “pangkal paha”.
