  to: Lalu ia berkata, “Jika Esau mendatangi perkemahan yang satu dan menyerangnya, perkemahan yang tersisa akan lolos.”[a]
  rationale: Revisi memperjelas subjek naratif, memakai ungkapan Indonesia yang lebih alami untuk hasil keselamatan, dan membetulkan catatan kaki agar mencerminkan idiom Ibrani tanpa frasa Indonesia yang menyesatkan. Ambiguitas dan cakupan makna ‘lolos/bertahan hidup’ tetap dipertahankan.
