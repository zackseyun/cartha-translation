  yaml_path: translation/ot/genesis/032/009.yaml
  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: id
  text: Lalu ia berkata, “Jika Esau mendatangi perkemahan yang satu dan menyerangnya, perkemahan yang tersisa akan lolos.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perkemahan yang tersisa akan menjadi untuk pelolosan,” yaitu akan lolos atau bertahan hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu katanya
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi. ‘Lalu katanya’ wajar dalam bahasa Indonesia dan mempertahankan kesinambungan tindakan.
- source_word: אִם
  choice: Jika
  rationale: Kata ini memperkenalkan syarat dan mempertahankan unsur kemungkinan dalam pertimbangan Yakub.
- source_word: יָבֹא
  choice: mendatangi
  rationale: בוא pada dasarnya berarti datang atau masuk. ‘Mendatangi’ secara alami mengungkapkan gerak menuju perkemahan tanpa memasukkan tindakan menyerang yang baru dinyatakan oleh verba berikutnya.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama diri dialihaksarakan menurut bentuk Indonesia yang lazim.
- source_word: אֶל־הַמַּחֲנֶה הָאַחַת
  choice: perkemahan yang satu
  rationale: Frasa ini menunjuk pada salah satu dari dua perkemahan yang baru saja dibentuk Yakub. Susunan tersebut mempertahankan penunjukan spesifik dalam teks.
- source_word: וְהִכָּהוּ
  choice: dan menyerangnya
  rationale: נכה berarti memukul atau menyerang. Dalam konteks ancaman terhadap seluruh perkemahan sebagai satu kesatuan, ‘menyerangnya’ jelas dan alami; pronomina -הוּ dipahami merujuk pada perkemahan secara kolektif.
- source_word: וְהָיָה
  choice: akan
  rationale: Dalam kalimat bersyarat ini, היה menghubungkan akibat dengan syarat. Bahasa Indonesia secara alami menyatakan akibat tersebut dengan bentuk futur ‘akan’ tanpa menerjemahkan kopula secara kaku.
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: perkemahan yang tersisa
  rationale: נשאר menunjuk pada sesuatu yang tinggal atau tersisa. Klausa relatif ini jelas sekaligus mempertahankan nuansa resultatifnya.
- source_word: לִפְלֵיטָה
  choice: akan luput
  rationale: Nomina פְלֵיטָה menyatakan keadaan lolos, selamat, atau terlepas dari kehancuran. ‘Akan luput’ mengungkapkan idiom Ibrani dengan alami tanpa menentukan lebih jauh cara keselamatannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. ‘Perkemahan’ dipakai bagi מַחֲנֶה agar jelas menunjuk pada kelompok beserta tempat mereka berkemah; ‘akan luput’ mempertahankan gagasan lolos atau bertahan hidup tanpa menambahkan penafsiran teologis.
