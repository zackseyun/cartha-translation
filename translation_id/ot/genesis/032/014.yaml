  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: id
  text: 'Maka bermalamlah ia di sana pada malam itu. Kemudian, dari apa yang ada padanya[a], ia mengambil sebuah pemberian untuk Esau, saudaranya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari apa yang datang ke tangannya”; dapat juga dipahami, “dari apa yang dibawanya” atau “dari apa yang tersedia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלֶן
  choice: bermalamlah ia
  rationale: Kata kerja לון menyatakan tinggal atau menginap semalam. 'Bermalam' alami, ringkas, dan mempertahankan unsur waktunya.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung bagi keterangan tempat ini.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Mempertahankan rujukan temporal tertentu dalam bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַיִּקַּח
  choice: ia mengambil
  rationale: לקח pada dasarnya berarti 'mengambil'; pilihan ini tidak mempersempit tindakan menjadi 'memilih' atau 'menyisihkan'.
- source_word: מִן הַבָּא בְיָדוֹ
  choice: dari apa yang ada padanya
  rationale: Ungkapan Ibrani secara harfiah menggambarkan apa yang 'datang ke tangannya', yakni apa yang tersedia atau berada dalam kepunyaannya. Terjemahan ini menyampaikan idiom tersebut secara alami tanpa menentukan lebih jauh apakah yang dimaksud ialah seluruh harta, barang bawaan, atau sesuatu yang kebetulan tersedia.
- source_word: מִנְחָה
  choice: sebuah pemberian
  rationale: Dalam konteks hubungan antarmanusia, מִנְחָה adalah pemberian kepada Esau, bukan terutama persembahan ibadah. 'Pemberian' jelas dan tidak memberi kesan politik sekuat 'upeti'.
- source_word: לְעֵשָׂו אָחִיו
  choice: untuk Esau, saudaranya
  rationale: Preposisi לְ menandai penerima; aposisi 'saudaranya' mempertahankan identifikasi kekeluargaan yang eksplisit.
