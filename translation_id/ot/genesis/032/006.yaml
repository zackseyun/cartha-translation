base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: id
  text: Aku mempunyai sapi, keledai, kawanan kambing dan domba, hamba laki-laki, dan hamba perempuan[a]. Aku telah mengutus para utusan untuk memberitahukan hal ini kepada tuanku, supaya aku mendapat perkenanan di matamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak laki-laki dan budak perempuan.” Istilah Ibraninya dapat menunjuk kepada pelayan rumah tangga yang berada dalam ikatan dan dipandang sebagai bagian dari milik rumah tangga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: Aku mempunyai
  rationale: Ungkapan היה + ל menyatakan kepemilikan. Bentuk ini menyampaikan bahwa semuanya merupakan milik Yakub pada saat ia mengirim pesan.
- source_word: שׁוֹר וַחֲמוֹר
  choice: sapi, keledai
  rationale: Kedua nomina tunggal dipakai secara kolektif sebagai jenis ternak. Dalam bahasa Indonesia, bentuk tanpa penanda jamak sudah wajar dalam daftar kepemilikan.
- source_word: צֹאן
  choice: kawanan kambing domba
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, khususnya domba dan kambing. 'Kawanan kambing domba' jelas bagi pembaca Indonesia tanpa membatasi istilah itu hanya pada salah satu jenis.
- source_word: עֶבֶד וְשִׁפְחָה
  choice: hamba laki-laki, dan hamba perempuan
  rationale: Pilihan ini mempertahankan pembedaan gender dalam bahasa Ibrani serta cakupan istilah bagi pelayan rumah tangga yang berada dalam ikatan. Catatan kaki menyebutkan padanan 'budak' karena daftar kepemilikan dapat mengisyaratkan status tersebut.
- source_word: וָאֶשְׁלְחָה
  choice: Aku telah mengutus orang
  rationale: Konteksnya adalah laporan tentang tindakan yang baru dilakukan Yakub. Objek manusia tersirat dari konteks para utusan dan dinyatakan secara alami dalam bahasa Indonesia.
- source_word: לְהַגִּיד לַאדֹנִי
  choice: untuk memberitahukan hal ini kepada tuanku
  rationale: '''Tuanku'' adalah sapaan hormat kepada Esau, bukan gelar ilahi. ''Hal ini'' secara alami menunjuk kepada daftar kepemilikan yang baru disebutkan.'
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: supaya aku mendapat kemurahan hati di matamu
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'di matamu' sekaligus menyampaikan maksud mencari penerimaan atau perlakuan yang baik.
theological_decisions:
- issue: Status עֶבֶד dan שִׁפְחָה dalam daftar rumah tangga Yakub
  choice: hamba laki-laki dan hamba perempuan
  alternative: budak laki-laki dan budak perempuan
  rationale: Istilah Ibrani dapat mencakup orang yang terikat sebagai milik rumah tangga, tetapi tidak selalu menentukan rincian status hukumnya. Teks utama mempertahankan keluasan makna itu, sedangkan catatan kaki tidak menyembunyikan kemungkinan terjemahan yang lebih tegas sebagai 'budak'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'tuanku' mempertahankan sikap merendah Yakub kepada Esau; huruf kecil dipakai karena yang disapa adalah manusia. Ungkapan 'di matamu' sengaja mempertahankan citra bahasa Ibrani.
