    text: Atau, “budak laki-laki dan budak perempuan.” Istilah Ibraninya dapat menunjuk kepada pelayan rumah tangga yang berada dalam ikatan dan dipandang sebagai bagian dari milik rumah tangga.
    reason: lexical_alternative
  revision_rationale: Mengganti ‘kawanan kambing domba’ dengan ‘kawanan kambing dan domba’ agar koordinasi jenis ternaknya lebih jelas dalam bahasa Indonesia. Perubahan utama mengganti ‘mendapat kemurahan hati di matamu’ menjadi ‘mendapat perkenanan di matamu’, yang menyampaikan idiom Ibrani secara tepat dan alami sambil mempertahankan metafora ‘di matamu’. ‘Para utusan’ menjelaskan objek yang tersirat dan sudah disediakan oleh konteks langsung tanpa mengubah isi pesan.
