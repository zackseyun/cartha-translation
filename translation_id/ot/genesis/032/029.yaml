base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: id
  text: Lalu ia berkata, “Namamu tidak akan lagi disebut Yakub, melainkan Israel, karena engkau telah bergumul dengan Allah[a] dan dengan manusia[b], dan engkau telah menang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk ilahi.” Kata Ibrani אֱלֹהִים dalam konteks tertentu dapat berarti Allah, ilah-ilah, atau makhluk-makhluk surgawi. Di sini teks utama memakai “Allah” karena konteks narasinya.
    reason: alternative_reading
  - marker: b
    text: Atau “orang-orang” atau “laki-laki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: disebut
  rationale: Bentuk pasif dari אמר dalam rumusan pemberian nama paling alami diterjemahkan “disebut”; ini mempertahankan pernyataan resmi tentang nama tanpa menjadi kaku.
- source_word: עוֹד
  choice: tidak akan lagi
  rationale: Dalam konteks penggantian nama, עוֹד menyatakan berhentinya pemakaian nama terdahulu.
- source_word: כִּי אִם
  choice: melainkan
  rationale: Gabungan ini menyatakan pertentangan tegas dalam pola “bukan X, melainkan Y” dan cocok dengan ragam bahasa Indonesia yang bermartabat.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri ditransliterasikan; permainan bunyinya dengan kata kerja berikutnya dipertahankan melalui klausa penjelas tentang pergumulan.
- source_word: שָׂרִיתָ
  choice: telah bergumul
  rationale: Kata kerja שרה menunjuk pada pergumulan atau perjuangan dan membentuk permainan kata dengan nama Israel. “Bergumul” juga sesuai dengan adegan fisik dalam konteks langsung.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, bentuk tersebut paling wajar merujuk kepada Allah, meskipun cakupan leksikalnya memungkinkan pemahaman lain yang dicatat dalam catatan kaki.
- source_word: אֲנָשִׁים
  choice: manusia
  rationale: “Manusia” membentuk pasangan retoris yang alami dengan “Allah” dalam bahasa Indonesia serta menyampaikan kategori manusiawi dari bentuk jamak Ibrani tanpa menambahkan jumlah yang tidak perlu.
- source_word: וַתּוּכָל
  choice: dan engkau menang
  rationale: Dalam konteks pergumulan, יכל menyatakan keberhasilan atau keunggulan. “Menang” ringkas dan alami, tanpa menyatakan bahwa Allah ditaklukkan secara mutlak.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam penjelasan nama
  choice: Allah
  alternative: makhluk ilahi; para makhluk ilahi; ilah-ilah
  rationale: Konteks terdekat menggambarkan pergumulan Yakub sebagai perjumpaan dengan Allah dalam sosok manusiawi yang tetap misterius. Terjemahan utama mempertahankan daya teologis itu, sedangkan kemungkinan leksikal lain dicatat tanpa meniadakan ketegangan naratif.
- issue: Cakupan אֲנָשִׁים
  choice: manusia
  alternative: orang-orang; laki-laki
  rationale: Bentuk Ibrani adalah jamak dari אִישׁ dan dapat berarti orang-orang atau laki-laki. Dalam kontras “Allah dan manusia,” makna kolektif “manusia” paling alami dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat.
- issue: Makna keberhasilan dalam וַתּוּכָל
  choice: menang
  alternative: berhasil; bertahan; berjaya
  rationale: Kata ini menyatakan hasil yang berhasil dalam pergumulan, tetapi konteks misteriusnya tidak mengharuskan gagasan bahwa Yakub sepenuhnya menaklukkan Allah. Pilihan ringkas “menang” mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang ringkas dan bermartabat. “Melainkan” mempertahankan ketegasan rumusan penggantian nama; “bergumul” menghubungkan penjelasan nama Israel dengan adegan sebelumnya. Semua ambiguitas penting diberi catatan tanpa membebani teks utama.
