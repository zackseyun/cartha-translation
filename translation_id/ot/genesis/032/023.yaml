base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: id
  text: Malam itu ia bangun dan membawa kedua istrinya, kedua hamba perempuannya[a], serta kesebelas anaknya menyeberangi Sungai Yabok di tempat penyeberangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kedua perempuan budaknya.” Kata Ibrani שִׁפְחֹתָיו menunjuk kepada perempuan yang berstatus bawahan dalam rumah tangga dan dapat menyiratkan perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: ia bangun
  rationale: Bentuk Qal wayyiqtol dari קום menyatakan tindakan bangun; ungkapan ini alami dan sesuai dengan gaya naratif bahasa Indonesia.
- source_word: בַּלַּיְלָה הוּא
  choice: Malam itu
  rationale: Ungkapan Ibrani menempatkan peristiwa pada malam tersebut, dengan pronomina yang memberi penekanan. 'Malam itu' menyampaikan fungsi ini secara idiomatis.
- source_word: וַיִּקַּח
  choice: lalu membawa
  rationale: לקח secara dasar berarti 'mengambil', tetapi ketika objeknya adalah keluarga yang diajak berpindah, 'membawa' lebih alami dalam bahasa Indonesia tanpa menambah gagasan asing.
- source_word: שְׁתֵּי נָשָׁיו
  choice: kedua istrinya
  rationale: Dalam konteks ini נָשִׁים jelas menunjuk kepada istri-istri Yakub.
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: kedua hamba perempuannya
  rationale: שִׁפְחָה menunjuk kepada perempuan berstatus bawahan dalam rumah tangga, yang dapat mencakup status perbudakan. 'Hamba perempuan' jelas, bermartabat, dan mempertahankan nuansa status sosial; alternatif yang lebih tegas dicatat dalam catatan kaki.
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: kesebelas anaknya
  rationale: יְלָדִים berarti anak-anak atau keturunan, bukan secara leksikal 'anak-anak lelaki'; terjemahan ini mempertahankan bentuk sumber tanpa melakukan harmonisasi interpretatif.
- source_word: וַיַּעֲבֹר
  choice: menyeberangi
  rationale: Dalam konteks perjalanan, עבר berarti menyeberang atau melintas.
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: tempat penyeberangan Sungai Yabok
  rationale: מַעֲבַר adalah tempat untuk menyeberang, sering kali sebuah arungan. Ungkapan ini alami bagi pembaca modern dan tidak memaksakan ciri fisik yang lebih khusus daripada yang dinyatakan kata sumber.
- source_word: יַבֹּק
  choice: Yabok
  rationale: Nama sungai ditransliterasikan menurut ejaan Indonesia yang wajar; kata 'Sungai' ditambahkan untuk memperjelas jenis nama geografis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Pilihan 'hamba perempuan' mempertahankan jarak sosial dalam teks, sementara catatan kaki mengungkapkan kemungkinan nuansa perbudakan. Penanda catatan kaki ditempatkan tepat setelah frasa terkait.
