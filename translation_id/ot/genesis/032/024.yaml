translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan ‘menyeberangkan’ dipertahankan untuk mencerminkan kesejajaran dua bentuk Hifil dalam teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
