  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: id
  text: Ia mengambil mereka dan menyeberangkan mereka ke seberang aliran air itu[a], lalu ia menyeberangkan segala miliknya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wadi”, “anak sungai”, atau “alur sungai”. Kata Ibrani נחל dapat menunjuk pada aliran air, jurang berair, atau alur air musiman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “apa yang ada padanya”, yaitu segala sesuatu yang menjadi miliknya atau harta bendanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: Ia membawa mereka
  rationale: Bentuk naratif dari לקח pada dasarnya berarti ‘mengambil’. Dalam konteks memindahkan orang-orang yang disebut sebelumnya, ‘membawa mereka’ terdengar alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: וַיַּעֲבִרֵם
  choice: menyeberangkan mereka
  rationale: 'Bentuk Hifil dari עבר bersifat kausatif: Yakub membuat mereka menyeberang. ‘Menyeberangkan mereka’ mempertahankan makna kausatif itu secara ringkas dan alami.'
- source_word: הַנָּחַל
  choice: aliran air itu
  rationale: נחל dapat menunjuk pada aliran air, lembah sungai, atau alur air musiman. ‘Aliran air’ cukup luas untuk menjaga keluwesan maknanya dan mudah dipahami pembaca modern.
- source_word: וַיַּעֲבֵר
  choice: Ia juga menyeberangkan
  rationale: Bentuk Hifil kembali menyatakan tindakan kausatif. ‘Menyeberangkan’ mempertahankan kesejajaran dengan tindakan sebelumnya; ‘juga’ menghubungkan objek kedua secara alami tanpa mengubah isi.
- source_word: אֲשֶׁר לוֹ
  choice: segala sesuatu yang menjadi miliknya
  rationale: Ungkapan ini secara harfiah berarti ‘apa yang ada padanya/baginya’ dan dalam konteks menunjuk pada milik kepunyaan Yakub. Pilihan ini dekat dengan susunan Ibrani serta tetap jelas dalam bahasa Indonesia.
