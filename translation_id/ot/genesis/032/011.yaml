id: GEN.32.11
reference: Genesis 32:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: id
  text: Aku tidak layak menerima segala kasih setia dan segala kesetiaan yang telah Engkau tunjukkan kepada hamba-Mu ini.[a] Sebab, dahulu aku menyeberangi Sungai Yordan ini dengan tongkatku, tetapi sekarang aku telah menjadi dua perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Aku terlalu kecil dibandingkan dengan segala kasih setia dan segala kesetiaan yang telah Engkau lakukan terhadap hamba-Mu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: Aku tidak layak menerima
  rationale: 'Secara harfiah berarti ''aku kecil/menjadi kecil'', tetapi dalam konstruksi dengan מִן ungkapan ini menyatakan kerendahan hati: Yakub mengakui dirinya tidak sebanding dengan segala kemurahan Allah. ''Tidak layak menerima'' menyampaikan idiom itu secara alami.'
- source_word: הַחֲסָדִים
  choice: segala kasih setia
  rationale: חסד menunjuk pada kasih yang teguh dan loyal dalam relasi; bentuk jamaknya dapat merangkum berbagai wujud konkretnya. 'Segala kasih setia' mempertahankan cakupan jamak tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: הָאֱמֶת
  choice: segala kesetiaan
  rationale: Dalam pasangan dengan חסד, אמת terutama menyatakan keterandalan atau kesetiaan, bukan sekadar kebenaran proposisional.
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: yang telah Engkau tunjukkan kepada hamba-Mu ini
  rationale: Secara harfiah 'yang telah Engkau lakukan terhadap/bersama hamba-Mu'. Karena objeknya kasih setia dan kesetiaan, 'tunjukkan kepada' merupakan ungkapan Indonesia yang alami; 'ini' memperjelas bahwa pembicara menyebut dirinya sendiri.
- source_word: בְמַקְלִי
  choice: hanya dengan tongkatku
  rationale: Teks secara leksikal berbunyi 'dengan tongkatku'. Dalam konteks kontras antara keadaan Yakub dahulu dan sekarang, 'hanya' membuat implikasi keterbatasan miliknya eksplisit secara alami tanpa mengubah maksud.
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: aku menyeberangi Sungai Yordan ini
  rationale: Menerjemahkan verba secara langsung, mempertahankan demonstratif 'ini', dan memakai nama geografis Indonesia yang lazim.
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: aku telah menjadi dua perkemahan
  rationale: Ungkapan Ibrani berarti bahwa seluruh rumah tangga dan harta Yakub kini membentuk dua kelompok perkemahan. Bentuk konkret 'dua perkemahan' dipertahankan agar terkait dengan konteks narasi.
theological_decisions:
- issue: Pasangan חסד dan אמת dalam tindakan Allah kepada Yakub
  choice: kasih setia dan kesetiaan
  alternative: kemurahan dan kebenaran; kasih perjanjian dan kesetiaan
  rationale: 'Pilihan ini mempertahankan dua konsep yang saling berkaitan tetapi berbeda: kasih loyal yang diwujudkan dalam tindakan dan keterandalan Allah. Istilah ''perjanjian'' tidak dimasukkan karena tidak tersurat di ayat ini, walaupun nuansa relasionalnya tetap terkandung dalam ''kasih setia''.'
- issue: Pengakuan Yakub dalam קָטֹנְתִּי
  choice: tidak layak menerima
  alternative: terlalu kecil bagi; lebih rendah daripada
  rationale: Ini menyampaikan kerendahan hati Yakub di hadapan kemurahan Allah tanpa menjadikannya pernyataan doktrinal yang lebih luas tentang nilai dirinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. 'Dahulu ... tetapi sekarang' mengungkapkan kontras temporal yang terdapat dalam כי ... ועתה secara wajar.
