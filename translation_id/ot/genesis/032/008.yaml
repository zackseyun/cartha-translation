base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: id
  text: Lalu Yakub sangat takut dan tertekan, lalu ia membagi orang-orang yang bersamanya, kawanan domba dan kambing, ternak sapi, dan unta menjadi dua perkemahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua rombongan.” Kata Ibrani ini dapat berarti perkemahan atau kelompok yang terorganisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא ... מְאֹד
  choice: menjadi sangat takut
  rationale: Ungkapan ini secara langsung menyampaikan rasa takut Yakub yang diperkuat oleh מְאֹד, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: וַיֵּצֶר לוֹ
  choice: tertekan
  rationale: Idiom Ibrani ini menyatakan kesesakan atau tekanan batin; 'tertekan' ringkas, alami, dan tidak mengurangi intensitas emosionalnya.
- source_word: וַיַּחַץ
  choice: membagi
  rationale: Kata חצה menunjuk pada tindakan membelah atau membagi, di sini sebagai langkah taktis yang disengaja.
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: orang-orang yang bersamanya
  rationale: עָם di sini berarti kelompok manusia yang menyertai Yakub, bukan suatu bangsa.
- source_word: הַצֹּאן
  choice: kawanan kambing domba
  rationale: צֹאן adalah sebutan kolektif bagi ternak kecil, terutama domba dan kambing; pilihan ini memperjelas cakupannya bagi pembaca Indonesia.
- source_word: הַבָּקָר
  choice: kawanan sapi
  rationale: בָּקָר menunjuk secara kolektif pada ternak besar jenis sapi.
- source_word: הַגְּמַלִּים
  choice: unta-unta
  rationale: Bentuk jamak eksplisit dan alami untuk גְּמַלִּים.
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: menjadi dua rombongan
  rationale: מַחֲנֶה dapat berarti perkemahan atau kelompok yang tersusun. Dalam konteks pembagian orang dan ternak, 'rombongan' paling alami, sementara alternatif leksikal dipertahankan dalam catatan kaki.
