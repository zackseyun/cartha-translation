translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Pengulangan konjungsi Ibrani diringkas secara alami tanpa mengubah daftar unsur yang dibagi. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
