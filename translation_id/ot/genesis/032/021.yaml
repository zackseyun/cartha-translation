source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: id
  text: Kalian juga harus berkata, “Lihatlah, hambamu Yakub ada di belakang kami.” Sebab Yakub berkata, “Aku akan menenangkan dia[a] dengan pemberian yang berjalan di depanku. Sesudah itu aku akan melihat wajahnya; mungkin dia akan menerima aku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “aku akan meredakan wajahnya.” Kata kerja Ibraninya berhubungan dengan bahasa pendamaian, tetapi di sini menunjuk pada upaya menenangkan Esau dengan sebuah pemberian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dia akan mengangkat wajahku,” sebuah ungkapan Ibrani yang berarti “dia akan menerima aku” atau “menunjukkan kemurahan kepadaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: Kalian juga harus berkata
  rationale: Bentuk verba orang kedua jamak ditujukan kepada para pembawa kawanan. Ungkapan ini meneruskan perintah Yakub dari konteks sebelumnya.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian kepada kedatangan Yakub dan tetap wajar dalam bahasa Indonesia modern.
- source_word: עַבְדְּךָ
  choice: hambamu
  rationale: Yakub merendahkan diri secara diplomatis di hadapan Esau. 'Hamba' mempertahankan nada hormat dan subordinatif tanpa menyiratkan bahwa Yakub secara harfiah budak Esau.
- source_word: אַחֲרֵינוּ
  choice: ada di belakang kami
  rationale: Menunjukkan bahwa Yakub mengikuti para utusan dan kawanan yang berjalan lebih dahulu.
- source_word: אֲכַפְּרָה פָנָיו
  choice: Aku akan menenangkan dia
  rationale: Dalam konteks antarpribadi ini, כפר berarti meredakan atau mengambil hati Esau, bukan melakukan pendamaian ritual. Terjemahan alami dipakai dalam teks, sedangkan citra harfiah tentang 'wajah' dijelaskan dalam catatan.
- source_word: מִנְחָה
  choice: pemberian
  rationale: Yang dimaksud ialah hadiah pendamai yang dikirim Yakub kepada Esau. 'Pemberian' jelas dan tidak menimbulkan kesan persembahan ritual.
- source_word: הַהֹלֶכֶת לְפָנָי
  choice: yang berjalan di depanku
  rationale: Mempertahankan gambaran kawanan sebagai pemberian yang sedang bergerak mendahului Yakub.
- source_word: אֶרְאֶה פָנָיו
  choice: aku akan menghadap dia
  rationale: Ungkapan ini secara harfiah berarti 'aku akan melihat wajahnya'. 'Menghadap dia' alami dalam bahasa Indonesia serta tetap menyampaikan perjumpaan langsung dan ketegangan saat datang ke hadapan Esau.
- source_word: אוּלַי
  choice: mungkin
  rationale: Menyatakan ketidakpastian sekaligus harapan Yakub mengenai sambutan Esau.
- source_word: יִשָּׂא פָנָי
  choice: dia akan menerima aku
  rationale: Idiom 'mengangkat wajah' berarti menyambut dengan baik atau menunjukkan perkenanan. Makna idiom diterjemahkan dalam teks dan bentuk harfiahnya dicatat.
theological_decisions:
- issue: Makna כפר dalam konteks antarpribadi, bukan ritual
  choice: Aku akan menenangkan dia
  alternative: Aku akan mengadakan pendamaian baginya
  rationale: Objek tindakan itu ialah Esau dan sarananya adalah pemberian yang mendahului Yakub. Karena itu, konteks menunjukkan upaya meredakan Esau, bukan tindakan penebusan atau pendamaian kultis. Catatan tetap menyebut hubungan leksikalnya dengan bahasa pendamaian.
- issue: Idiom יִשָּׂא פָנָי dan motif 'wajah'
  choice: dia akan menerima aku
  alternative: dia akan mengangkat wajahku
  rationale: Terjemahan harfiah tidak menyampaikan makna idiom dengan jelas kepada pembaca Indonesia. Makna penerimaan dipakai dalam teks, sementara citra asli dan kemungkinan 'menunjukkan perkenanan' dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk jamak 'kalian' memperjelas bahwa perintah ditujukan kepada para utusan, sedangkan 'hambamu' mempertahankan tutur merendah Yakub kepada Esau. Idiom Ibrani diterjemahkan secara alami dalam teks dan bentuk harfiahnya dipertahankan melalui catatan kaki.
