  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: id
  text: Lalu Yakub bertanya, “Tolong beri tahu aku namamu.” Namun ia berkata, “Mengapa engkau menanyakan namaku?” Lalu ia memberkati Yakub di sana.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל יַעֲקֹב וַיֹּאמֶר
  choice: Lalu Yakub bertanya
  rationale: Rangkaian harfiah 'bertanya dan berkata' merupakan pola narasi Ibrani yang redundan dalam bahasa Indonesia; 'bertanya' secara alami memperkenalkan kutipan langsung dan mempertahankan maknanya.
- source_word: הַגִּידָה נָּא
  choice: Tolong beri tahukan ... kepadaku
  rationale: Bentuk imperatif Hifil dari נגד berarti 'memberi tahu/mengungkapkan', sedangkan נָא memperhalus permintaan; 'tolong' menyampaikan nada sopan itu.
- source_word: שְׁמֶךָ
  choice: namamu
  rationale: Padanan langsung dan alami bagi 'namamu', tanpa menambahkan penafsiran mengenai makna teologis nama tersebut.
- source_word: לָמָּה זֶּה תִּשְׁאַל לִשְׁמִי
  choice: Mengapa engkau menanyakan namaku?
  rationale: Ungkapan idiomatis לָמָּה זֶּה berfungsi sebagai pertanyaan 'mengapa'; bahasa Indonesia alami tidak memerlukan terjemahan tersendiri untuk זֶּה di sini. 'Menanyakan namaku' menyampaikan konstruksi Ibrani secara tepat.
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: Lalu dia memberkati Yakub di sana
  rationale: ברך diterjemahkan 'memberkati' dan שָׁם sebagai 'di sana'. Nama 'Yakub' dipakai sebagai pengganti objek pronominal agar dua pronomina orang ketiga tidak menimbulkan ambiguitas rujukan yang tidak ada dalam konteks Ibrani.
theological_decisions:
- issue: Identitas sosok yang menolak menyebutkan namanya dan memberkati Yakub
  choice: Memakai pronomina 'dia' tanpa mengidentifikasinya sebagai Allah, orang itu, atau malaikat
  alternative: Allah berkata / orang itu berkata / malaikat itu berkata
  rationale: Subjek kedua verba tersebut tersirat dalam bahasa Ibrani. Walaupun konteks yang lebih luas mengundang identifikasi teologis, ayat ini sendiri tidak menyebutnya secara eksplisit, sehingga ambiguitas naratif dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Engkau' dipilih untuk sapaan tunggal dalam dialog, sementara 'dia' mempertahankan subjek yang tidak disebutkan namanya. Tidak diperlukan catatan kaki karena alternatif literal bagi idiom dan konstruksi naratif Ibrani tidak memberi perbedaan makna yang cukup penting.
