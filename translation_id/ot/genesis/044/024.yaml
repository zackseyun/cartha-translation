  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan 'hambamu' dan 'tuanku' dipertahankan untuk mencerminkan kesopanan serta kerendahan diri dalam tuturan Yehuda. Catatan kaki mempertahankan kemungkinan susunan aposisional yang lebih alami tanpa menghilangkan urutan teks Ibrani.
