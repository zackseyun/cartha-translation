  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: id
  text: Ketika kami pergi kepada hambamu, ayahku,[a] kami menyampaikan kepadanya perkataan tuanku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ayahku, hambamu.” Urutan dalam bahasa Ibrani ialah “hambamu, ayahku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Rumus naratif ini memperkenalkan peristiwa berikutnya. Dalam bahasa Indonesia, 'Ketika' menyampaikan hubungan waktunya secara alami tanpa ungkapan harfiah yang kaku seperti 'terjadilah ketika'.
- source_word: עָלִינוּ
  choice: kami pergi
  rationale: Secara harfiah verba ini berarti 'naik'. Dalam konteks perjalanan dari Mesir ke Kanaan, bahasa Indonesia lebih alami memakai 'pergi'; gagasan tujuan tetap dinyatakan oleh 'ke tempat'.
- source_word: אֶל
  choice: ke tempat
  rationale: Preposisi arah אֶל berarti 'ke'. Penambahan 'tempat' membuat ungkapan menuju seseorang terdengar alami dalam bahasa Indonesia dan tidak mengubah makna.
- source_word: עַבְדְּךָ אָבִי
  choice: hambamu, ayahku
  rationale: 'Urutan Ibrani dipertahankan: Yakub terlebih dahulu disebut dengan sapaan merendah ''hambamu'', lalu diidentifikasi sebagai ''ayahku''. Tanda koma membantu kejelasan hubungan aposisional.'
- source_word: וַנַּגֶּד
  choice: kami menyampaikan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. 'Menyampaikan' alami dalam konteks meneruskan perkataan dan mempertahankan nuansa pelaporan.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina objek tidak langsung merujuk kepada sang ayah; 'kepadanya' adalah padanan Indonesia yang jelas dan alami.
- source_word: אֵת דִּבְרֵי
  choice: perkataan
  rationale: דִּבְרֵי secara harfiah berarti 'perkataan-perkataan' atau 'kata-kata'. Bentuk kolektif tunggal 'perkataan' alami dalam bahasa Indonesia dan tetap mempertahankan rujukan kepada ucapan sebelumnya.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Ini adalah gelar hormat kepada seorang manusia, bukan nama ilahi. 'Tuanku' mempertahankan nada hormat dan pola tutur merendah Yehuda kepada Yusuf.
