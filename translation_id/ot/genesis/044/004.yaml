base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: id
  text: Mereka telah keluar dari kota dan belum pergi jauh ketika Yusuf berkata kepada orang yang mengurus rumah tangganya[a], “Bangkitlah, kejarlah orang-orang itu. Setelah engkau menyusul mereka, katakanlah kepada mereka, ‘Mengapa kalian membalas kebaikan dengan kejahatan?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada orang yang berada atas rumahnya”; dapat merujuk kepada pengelola atau kepala rumah tangganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: Mereka telah keluar dari kota, tetapi belum jauh
  rationale: Bentuk naratif menyatakan bahwa mereka sudah meninggalkan kota sebelum Yusuf memberi perintah; ‘tetapi belum jauh’ menyampaikan לֹא הִרְחִיקוּ secara alami dalam bahasa Indonesia.
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: kepada orang yang mengurus rumah tangganya
  rationale: Ungkapan Ibrani secara harfiah berarti ‘kepada orang yang berada atas rumahnya’ dan menunjuk kepada pengelola rumah tangga. Pilihan ini jelas dan alami tanpa menetapkan gelar yang tidak dinyatakan langsung.
- source_word: קוּם
  choice: Bersiaplah
  rationale: Imperatif קוּם secara harfiah berarti ‘bangkitlah’, tetapi dalam rangkaian perintah berfungsi mendesak orang untuk segera bertindak. ‘Bersiaplah’ mempertahankan dorongan itu tanpa memberi kesan bahwa orang tersebut sedang tidur.
- source_word: רְדֹף אַחֲרֵי הָאֲנָשִׁים
  choice: kejarlah orang-orang itu
  rationale: Gabungan רדף dan אחרי berarti mengejar. ‘Orang-orang itu’ merujuk secara tepat kepada para laki-laki yang baru berangkat.
- source_word: וְהִשַּׂגְתָּם
  choice: Setelah engkau menyusul mereka
  rationale: Hifil נשׂג berarti mencapai atau menyusul. Dalam konteks ini tindakan berbicara dilakukan sesudah mereka berhasil disusul.
- source_word: לָמָּה שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: Mengapa kalian membalas kebaikan dengan kejahatan?
  rationale: Piel שלם berarti membalas atau mengganjar, sedangkan רָעָה תַּחַת טוֹבָה menyatakan kejahatan sebagai balasan atas kebaikan. Susunan Indonesia ini idiomatis dan mempertahankan pertentangan moralnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Sapaan ‘engkau’ dipakai untuk perintah Yusuf kepada satu orang, sedangkan ‘kalian’ dipakai dalam tuduhan yang ditujukan kepada sekelompok laki-laki. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya, bukan sesudah keterangan jarak.
