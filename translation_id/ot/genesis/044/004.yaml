  source_fidelity: 'Makna utama telah dipertahankan: mereka baru saja keluar dari kota, Yusuf memberi perintah kepada pejabat rumah tangganya, dan tuduhannya adalah membalas kebaikan dengan kejahatan. Namun, “tetapi belum jauh” eliptis dan kurang langsung menyatakan bahwa mereka belum pergi jauh dari kota. Imperatif קוּם lebih baik dipertahankan sebagai dorongan untuk bangkit/bertindak daripada “bersiaplah,” yang dapat berarti sekadar melakukan persiapan.'
  naturalness: Registernya umumnya modern dan wajar. Revisi kecil membuat pembukaan lebih lancar dan rangkaian perintah lebih tegas dalam bahasa Indonesia baku.
  terminology: “Orang yang mengurus rumah tangganya” adalah padanan yang baik untuk אֲשֶׁר עַל־בֵּיתוֹ tanpa mengunci jabatan tertentu. Catatan kaki sebaiknya tidak menjadikan penjelasan interpretatif sebagai arti yang pasti; bentuk “dapat merujuk” menjaga sifat leksikalnya.
