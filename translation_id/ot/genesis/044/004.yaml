- from: Mereka telah keluar dari kota, tetapi belum jauh, ketika Yusuf berkata kepada orang yang mengurus rumah tangganya[a], “Bersiaplah, kejarlah orang-orang itu. Setelah engkau menyusul mereka, katakanlah kepada mereka, ‘Mengapa kalian membalas kebaikan dengan kejahatan?’”
  to: Mereka telah keluar dari kota dan belum pergi jauh ketika Yusuf berkata kepada orang yang mengurus rumah tangganya[a], “Bangkitlah, kejarlah orang-orang itu. Setelah engkau menyusul mereka, katakanlah kepada mereka, ‘Mengapa kalian membalas kebaikan dengan kejahatan?’”
