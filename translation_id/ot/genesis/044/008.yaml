source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: id
  text: Lihatlah, perak yang kami temukan di mulut karung-karung kami[a] telah kami bawa kembali kepadamu dari tanah Kanaan. Jadi, bagaimana mungkin kami mencuri perak atau emas dari rumah tuanmu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di mulut karung-karung kami,” yaitu di bagian bukaan atau atas karung.
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel wacana ini menegaskan seruan agar lawan bicara memperhatikan bukti yang diajukan; “Lihatlah” alami sekaligus bermartabat dalam bahasa Indonesia.
- source_word: כֶּסֶף
  choice: perak
  rationale: Makna harfiahnya “perak”; dalam konteks dapat berfungsi sebagai uang, tetapi “perak” mempertahankan gambaran konkret dan pasangannya dengan “emas” pada akhir ayat.
- source_word: מָצָאנוּ
  choice: kami temukan
  rationale: Menyampaikan tindakan lampau secara lugas dan wajar dalam konteks klausa relatif.
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: di mulut karung-karung kami
  rationale: Mempertahankan ungkapan konkret Ibrani, yakni “di mulut” wadah; catatan kaki menjelaskan bahwa yang dimaksud ialah bagian bukaan atau atas karung.
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: telah kami bawa kembali kepadamu
  rationale: Bentuk kausatif dari שוב menyatakan membuat sesuatu kembali; frasa ini idiomatis dan memperjelas bahwa merekalah yang membawa kembali perak itu.
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: dari tanah Kanaan
  rationale: Ungkapan geografis baku yang setia pada sumber dan alami dalam bahasa Indonesia Alkitabiah modern.
- source_word: וְאֵיךְ נִגְנֹב
  choice: Jadi, bagaimana mungkin kami mencuri
  rationale: Pertanyaan retoris menyimpulkan ketidakmasukakalan tuduhan berdasarkan tindakan mereka sebelumnya; “bagaimana mungkin” mengungkapkan daya modal konteks.
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: dari rumah tuanmu
  rationale: אדון menunjuk kepada tuan si pengelola, bukan gelar ilahi; “rumah” mempertahankan metonimia sumber untuk kediaman atau lingkungan rumah tangga.
- source_word: כֶּסֶף אוֹ זָהָב
  choice: perak atau emas
  rationale: Mempertahankan pasangan konkret dalam bahasa Ibrani dan menggemakan “perak” pada awal ayat.
