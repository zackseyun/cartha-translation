  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: id
  text: Ia berkata, “Baiklah, sekarang biarlah terjadi seperti yang kalian katakan. Orang yang kedapatan membawa cawan itu akan menjadi budakku, sedangkan kalian tidak akan dianggap bersalah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: Baiklah, sekarang
  rationale: Dalam jawaban ini frasa tersebut menandai tanggapan langsung dan penerimaan terbatas atas perkataan sebelumnya. ‘Baiklah, sekarang’ alami dalam bahasa Indonesia dan tetap mempertahankan penekanan pada keadaan saat itu.
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: biarlah terjadi seperti yang kalian katakan
  rationale: Ungkapan ini menerima perkataan mereka secara umum. Bentuk ‘biarlah’ menyampaikan nuansa persetujuan atau penetapan, sementara tanda titik sesudahnya mengikuti jeda utama dalam teks Ibrani dan mencegah ketetapan berikut dibaca sebagai pengulangan persis usul mereka.
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: orang yang kedapatan membawa cawan itu
  rationale: Secara harfiah, ‘orang yang padanya benda itu ditemukan.’ Penyebutan ‘cawan itu’ memperjelas acuan pronomina dari konteks langsung, sedangkan ‘kedapatan membawa’ mengungkapkan kepemilikan atau penguasaan secara alami tanpa menetapkan bagaimana cawan itu sampai padanya.
- source_word: יִהְיֶה לִּי עָבֶד
  choice: akan menjadi budakku
  rationale: עֶבֶד dalam konteks hukuman ini menunjukkan status terikat dan koersif, bukan pekerja atau pelayan biasa. Karena itu ‘budak’ lebih tepat daripada ‘pelayan’; ‘akan menjadi’ menyampaikan perubahan status yang dinyatakan oleh bentuk imperfek.
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: sedangkan kalian tidak akan dianggap bersalah
  rationale: נָקִי menunjukkan bebas dari kesalahan atau tanggung jawab hukum. Bentuk ini jelas menyatakan bahwa saudara-saudara lainnya tidak akan dikenai hukuman atau dipandang bersalah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk bentuk jamak orang kedua. Kontras antara orang yang kedapatan membawa cawan dan saudara-saudara lainnya dibuat jelas dengan ‘sedangkan’, tanpa menambahkan penafsiran teologis.
