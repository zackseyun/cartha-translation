  source_fidelity: 'Terjemahan menyampaikan seluruh unsur utama teks Ibrani: tanggapan langsung yang ditekankan (גַּם עַתָּה), penerimaan terbatas terhadap perkataan mereka, ketetapan terpisah mengenai orang yang kedapatan dengan cawan itu, status עֶבֶד sebagai “budak,” serta pembebasan yang lain dari kesalahan/liabilitas. Tanda titik setelah “yang kalian katakan” dengan tepat mempertahankan jeda utama sesudah כֵּן הוּא dan tidak menjadikan ketetapan berikut sekadar pengulangan tawaran saudara-saudara itu.'
