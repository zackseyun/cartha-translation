review_pass:
  verdict: revise
  source_fidelity: Frasa "masuk ke rumah Yusuf" dan "Yusuf masih berada di sana" setia pada gerak masuk dan keadaan berkelanjutan dalam Ibrani. Namun, "sujud sampai ke tanah" menambahkan idiom tindakan sujud yang lebih spesifik daripada verba dasar וַיִּפְּלוּ, "mereka jatuh," dan "sampai" kurang langsung mencerminkan arah אָרְצָה.
  naturalness: Teksnya umumnya jelas dan menggunakan bahasa Indonesia modern. "Jatuh tersungkur ke tanah" lebih alami dalam narasi dan sekaligus mempertahankan tindakan fisik yang dinyatakan sumber.
  terminology: Nama Yehuda dan Yusuf sudah tepat. "Tersungkur" mengkomunikasikan tindakan merendahkan diri di hadapan Yusuf tanpa memaksakan istilah religius khusus seperti "sujud."
  issues:
  - severity: medium
    issue: '"mereka sujud sampai ke tanah" terlalu menafsirkan verba utama.'
    rationale: וַיִּפְּלוּ berarti "mereka jatuh"; konteks "ke tanah di hadapannya" memang menunjukkan penghormatan, tetapi tidak menuntut padanan "sujud." Selain itu, "sampai ke tanah" tidak sejelas "ke tanah" untuk bentuk arah אָרְצָה.
  revised_text: Kemudian Yehuda dan saudara-saudaranya masuk ke rumah Yusuf. Yusuf masih berada di sana, dan mereka jatuh tersungkur ke tanah di hadapannya.
