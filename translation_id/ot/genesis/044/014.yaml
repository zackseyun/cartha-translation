revisions:
- from: Kemudian Yehuda dan saudara-saudaranya masuk ke rumah Yusuf. Yusuf masih berada di sana, lalu mereka sujud sampai ke tanah di hadapannya.
  to: Kemudian Yehuda dan saudara-saudaranya masuk ke rumah Yusuf. Yusuf masih berada di sana, dan mereka jatuh tersungkur ke tanah di hadapannya.
  rationale: Revisi mengganti "sujud sampai ke tanah" dengan "jatuh tersungkur ke tanah" agar verba "jatuh" tetap terlihat, arah gerak ke tanah dipertahankan, dan konteks penghormatan tetap tersampaikan secara wajar. Pemisahan kalimat untuk klausa keadaan tentang Yusuf dipertahankan.
