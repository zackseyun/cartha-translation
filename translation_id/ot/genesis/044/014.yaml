  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: id
  text: Kemudian Yehuda dan saudara-saudaranya masuk ke rumah Yusuf. Yusuf masih berada di sana, dan mereka jatuh tersungkur ke tanah di hadapannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Dalam konteks gerak menuju rumah Yusuf, בוא dengan akhiran penunjuk arah pada בֵּיתָה paling alami diterjemahkan sebagai tindakan masuk, bukan sekadar datang.
- source_word: יְהוּדָה וְאֶחָיו
  choice: Yehuda dan saudara-saudaranya
  rationale: Mempertahankan penyebutan Yehuda secara khusus sebagai tokoh utama sekaligus hubungan kekeluargaan kelompok itu.
- source_word: בֵּיתָה יוֹסֵף
  choice: ke rumah Yusuf
  rationale: Akhiran arah -ה menyatakan gerak menuju rumah; bersama verba 'masuk', frasa 'ke rumah Yusuf' menghasilkan bahasa Indonesia yang alami.
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: Yusuf masih berada di sana
  rationale: Nama 'Yusuf' dipakai untuk memperjelas acuan pronomina הוּא dalam bahasa Indonesia, sedangkan עוֹדֶנּוּ menyatakan keadaan yang masih berlangsung.
- source_word: וַיִּפְּלוּ
  choice: mereka sujud
  rationale: Secara leksikal verba ini berarti 'jatuh', tetapi bersama 'ke tanah' dan 'di hadapannya' tindakan tersebut jelas merupakan penghormatan dengan merendahkan diri; 'sujud' menyampaikan tindakan itu secara alami tanpa menghilangkan arah fisiknya.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Padanan Indonesia yang wajar bagi idiom harfiah 'di depan wajahnya'.
- source_word: אָרְצָה
  choice: sampai ke tanah
  rationale: Bentuk berakhiran arah menyatakan gerakan ke bawah menuju tanah; 'sampai ke tanah' mempertahankan unsur fisik gerakan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Klausa keadaan tentang kehadiran Yusuf dipisahkan menjadi kalimat tersendiri demi kejelasan, sementara 'lalu' menandai kelanjutan tindakan naratif. Tidak ada catatan kaki karena tidak ada ambiguitas penting yang memerlukan alternatif terbitan; catatan kaki bahasa Inggris yang diberikan tampaknya tidak selaras penanda dan tidak diperlukan bagi teks Indonesia.
