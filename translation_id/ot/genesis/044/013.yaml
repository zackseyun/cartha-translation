  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: id
  text: Lalu mereka merobek pakaian mereka[a], dan setiap orang memuat keledainya; kemudian mereka kembali ke kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "jubah mereka"; istilah Ibrani ini dapat merujuk secara umum pada pakaian, khususnya pakaian luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: mereka mengoyakkan
  rationale: Bentuk dari קרע menyatakan tindakan merobek atau mengoyakkan; dalam konteks ini, mengoyakkan pakaian merupakan ungkapan dukacita, keterkejutan, atau kesusahan. 'Mengoyakkan' mempertahankan tindakan konkret dengan ragam naratif yang wajar.
- source_word: שִׂמְלֹתָם
  choice: pakaian mereka
  rationale: שִׂמְלָה dapat menunjuk pada pakaian secara umum, khususnya pakaian luar. 'Pakaian' alami dan cukup luas dalam bahasa Indonesia modern.
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: Masing-masing memuati keledainya
  rationale: עמס berarti memuatkan atau menaruh beban, sedangkan אִישׁ berfungsi distributif. Ungkapan ini menyampaikan bahwa setiap orang kembali menaruh muatan pada keledainya.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Nomina tunggal ini memiliki makna distributif setelah verba jamak. 'Masing-masing' alami dalam bahasa Indonesia dan konteks sebelumnya telah memperjelas bahwa yang dimaksud adalah para saudara laki-laki.
- source_word: חֲמֹרוֹ
  choice: keledainya
  rationale: חֲמוֹר adalah istilah biasa untuk keledai; bentuk bersufiks menyatakan milik setiap orang secara distributif.
- source_word: וַיָּשֻׁבוּ
  choice: mereka kembali
  rationale: שׁוּב berarti kembali atau berbalik. 'Kembali' sesuai dengan ragam naratif modern dan tidak menambahkan gagasan yang tidak tersurat.
- source_word: הָעִירָה
  choice: ke kota
  rationale: Akhiran ה direktif pada הָעִירָה menyatakan gerak menuju kota; bahasa Indonesia menyatakannya secara alami dengan 'ke kota'.
