  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: id
  text: Yang seorang pergi meninggalkan aku, lalu aku berkata, ‘Pastilah ia telah diterkam sampai mati.’ Sampai sekarang aku tidak pernah melihatnya lagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: Yang seorang pergi meninggalkan aku
  rationale: Ungkapan ini mempertahankan pembedaan ‘yang seorang’ dalam konteks dua anak serta menyampaikan gerak menjauh dari sang ayah secara alami dalam bahasa Indonesia.
- source_word: אַךְ טָרֹף טֹרָף
  choice: Pastilah ia telah diterkam sampai mati
  rationale: Infinitif absolut dengan verba yang sama memberi penegasan kuat. ‘Diterkam sampai mati’ menyampaikan kesimpulan Yakub bahwa anaknya dibunuh binatang, tanpa gambaran tubuh yang lebih spesifik daripada teks Ibrani.
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: Sampai sekarang aku tidak pernah melihatnya lagi
  rationale: Menyampaikan rentang waktu hingga saat ujaran dan implikasi bahwa ia tidak muncul kembali dalam pandangan sang ayah.
