base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: id
  text: Lalu Yehuda berkata, “Apa yang dapat kami katakan kepada tuanku? Apa yang dapat kami sampaikan? Atau bagaimana kami dapat membenarkan diri[a]? Allah telah mendapati kesalahan hamba-hambamu[b]. Kami ini budak tuanku[c], baik kami maupun orang yang di tangannya ditemukan cawan itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menunjukkan bahwa kami benar?” Kata Ibrani dapat berarti menunjukkan diri berada di pihak yang benar atau membenarkan diri.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “telah menyingkap kejahatan hamba-hambamu.” Kata yang diterjemahkan “kesalahan” juga dapat berarti kejahatan, keadaan bersalah, atau hukuman akibat kesalahan.'
    reason: lexical_alternative
  - marker: c
    text: Sebutan “hamba-hambamu” sebelumnya merupakan cara merendahkan diri di hadapan seorang penguasa, sedangkan “budak” di sini menyatakan status perbudakan yang mereka tawarkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: kepada Tuanku / budak Tuanku
  rationale: Kata אָדוֹן menunjuk kepada Yusuf sebagai penguasa, bukan kepada Allah. ‘Tuanku’ mempertahankan sapaan hormat dalam suasana istana dan sesuai dengan bentuk orang pertama tunggal pada teks Ibrani.
- source_word: נֹּאמַר / נְּדַבֵּר
  choice: dapat kami katakan / dapat kami sampaikan
  rationale: 'Dua verba yang berdekatan dipertahankan secara berbeda untuk menyampaikan peningkatan retoris: tidak ada lagi yang dapat dikatakan ataupun diajukan sebagai pembelaan.'
- source_word: נִּצְטַדָּק
  choice: membenarkan diri
  rationale: Bentuk hitpael dari צדק berarti menunjukkan bahwa diri berada di pihak yang benar atau membenarkan diri. Pilihan ini mempertahankan nuansa yuridis tanpa menyatakan bahwa mereka sungguh benar.
- source_word: מָצָא אֶת עֲוֺן
  choice: telah mendapati kesalahan
  rationale: Ungkapan ini menyatakan bahwa Allah telah menemukan atau membawa ke dalam terang kesalahan yang tersembunyi. ‘Mendapati kesalahan’ cukup dekat dengan metafora Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: hamba-hambamu / budak
  rationale: Kemunculan pertama merupakan sebutan diri yang merendah di hadapan penguasa, sehingga diterjemahkan ‘hamba-hambamu’. Kemunculan kedua menyatakan status perbudakan yang mereka tawarkan, sehingga diterjemahkan ‘budak’.
- source_word: הִנֶּנּוּ
  choice: Sekarang kami
  rationale: Partikel presentatif ini menandai penyerahan diri mereka dalam keadaan yang kini dihadapi. ‘Sekarang kami’ menyampaikan peralihan itu secara wajar tanpa memakai ‘lihatlah’ yang dapat terdengar seperti perintah harfiah.
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: baik kami maupun orang yang padanya ditemukan cawan itu
  rationale: Pasangan גַּם ... גַּם mencakup saudara-saudara secara umum dan orang yang kedapatan membawa cawan. ‘Padanya ditemukan’ mempertahankan bentuk pasif serta tidak memperjelas secara berlebihan ungkapan harfiah ‘di tangannya’.
- source_word: הַגָּבִיעַ
  choice: cawan
  rationale: ‘Cawan’ adalah padanan yang jelas dan bermartabat bagi wadah minum ini, serta sesuai dengan konteks naratif tanpa menambahkan kemewahan yang tidak dinyatakan.
theological_decisions:
- issue: Rujukan הָאֱלֹהִים dalam pengakuan Yehuda
  choice: Allah sendiri telah mendapati kesalahan mereka.
  alternative: Suatu kuasa ilahi telah menemukan perbuatan salah mereka.
  rationale: Dalam konteks Kitab Kejadian, bentuk ini merujuk kepada Allah yang dikenal oleh keluarga Yakub. Pernyataan Yehuda mengakui bahwa kesalahan tersembunyi mereka telah diketahui Allah, tanpa menentukan apakah yang terutama dimaksud ialah kesalahan lama terhadap Yusuf atau seluruh keadaan sekarang.
- issue: Makna עָוֹן
  choice: kesalahan
  alternative: kejahatan, dosa, atau hukuman akibat kesalahan
  rationale: Kata Ibrani dapat menunjuk pada perbuatan bengkok, keadaan bersalah, atau akibat hukumannya. ‘Kesalahan’ mempertahankan keluasan makna itu lebih baik daripada mengunci ayat pada satu dosa tertentu atau pada hukumannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Tuanku’ mempertahankan kesantunan istana; pengulangan pertanyaan dijaga untuk mempertahankan tekanan retoris. Istilah ‘hamba’ dan ‘budak’ dibedakan menurut fungsi masing-masing dalam konteks.
