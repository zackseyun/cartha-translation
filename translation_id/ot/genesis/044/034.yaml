id: GEN.44.34
reference: Genesis 44:34
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: id
  text: Sebab, bagaimana mungkin aku pulang kepada ayahku jika anak itu tidak bersamaku? Jangan sampai aku melihat malapetaka yang menimpa ayahku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: pulang
  rationale: Secara harfiah berarti 'naik', tetapi dalam konteks perjalanan kembali kepada ayahnya, 'pulang' menyampaikan maksud arah gerak secara alami dalam bahasa Indonesia.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: Istilah ini dapat berarti anak laki-laki atau orang muda; dalam konteks Benyamin sebagai anak Yakub, 'anak itu' alami dan tidak menyiratkan bahwa ia masih kanak-kanak.
- source_word: בָרָע
  choice: malapetaka
  rationale: Nomina רָעָה di sini menunjuk pada kemalangan atau bencana yang akan menimpa sang ayah, bukan kejahatan moral.
- source_word: יִמְצָא אֶת־אָבִי
  choice: yang menimpa ayahku
  rationale: Ungkapan Ibrani harfiah 'yang menemukan ayahku' secara idiomatis berarti malapetaka yang menimpa atau terjadi atas dirinya.
theological_decisions:
- issue: Nuansa פֶּן
  choice: Jangan sampai aku melihat
  alternative: Kalau tidak, aku harus melihat
  rationale: פֶּן menyatakan akibat yang ditakuti atau hendak dihindari ('supaya jangan/jangan sampai'). Terjemahan ini mempertahankan ketakutan Yehuda tanpa menambahkan gagasan keharusan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pertanyaan retoris serta tekanan emosional Yehuda dipertahankan; tanda petik penutup mengikuti konteks ujaran langsung.
source_grounding:
  english_pob_role: consult_only
