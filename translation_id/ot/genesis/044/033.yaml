source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: id
  text: Jadi sekarang, izinkanlah hambamu ini tinggal menggantikan pemuda itu sebagai budak tuanku, dan biarkanlah pemuda itu pergi[a] bersama saudara-saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “naik.” Dalam bahasa Ibrani, “naik” lazim dipakai untuk perjalanan dari Mesir menuju Kanaan.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mempertahankan fungsi penghubung dan penanda wacana yang mengantar permohonan puncak Yehuda dalam bahasa Indonesia yang alami.
- source_word: יֵשֶׁב נָא
  choice: izinkanlah ... tinggal
  rationale: Bentuk permohonan dengan נָא disampaikan secara santun; 'tinggal' sesuai dengan maksud Yehuda untuk tetap ditahan di Mesir.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Dalam bagian ini kata tersebut merupakan sebutan diri yang merendah di hadapan penguasa, bukan penjelasan langsung tentang status perbudakan.
- source_word: תַּחַת הַנַּעַר
  choice: menggantikan anak muda itu
  rationale: תַּחַת memiliki makna substitusi di sini; 'menggantikan' menyatakan maksud itu secara jelas dan alami.
- source_word: הַנַּעַר
  choice: anak muda itu
  rationale: נַעַר dapat menunjuk anak laki-laki atau laki-laki muda. 'Anak muda' mempertahankan cara Yehuda membingkai Benyamin tanpa menyiratkan bahwa ia masih anak kecil.
- source_word: עֶבֶד
  choice: sebagai budak
  rationale: Berbeda dari sebutan diri 'hambamu', pemakaian ini menunjuk status terikat yang sungguh-sungguh hendak diterima Yehuda sebagai pengganti Benyamin.
- source_word: לַאדֹנִי
  choice: tuanku
  rationale: Gelar hormat kepada Yusuf sebagai penguasa manusia; bentuk ini mempertahankan tingkat kesopanan tanpa memberi makna ilahi.
- source_word: וְהַנַּעַר יַעַל
  choice: dan biarkanlah anak muda itu pergi
  rationale: Daya permohonan berlanjut dalam konteks ini. 'Pergi' alami dalam bahasa Indonesia, sedangkan makna harfiah 'naik' dijelaskan dalam catatan karena merupakan cara lazim menggambarkan perjalanan dari Mesir menuju Kanaan.
- source_word: עִם אֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Padanan langsung dan wajar bagi hubungan keluarga yang dimaksud.
