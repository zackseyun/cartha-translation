  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: id
  text: Tuanku bertanya kepada hamba-hambanya, ‘Apakah kalian mempunyai ayah atau saudara laki-laki?’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat dengan sufiks orang pertama tunggal kepada penguasa Mesir; “Tuanku” mempertahankan nuansa bahasa istana dan penghormatan.
- source_word: שָׁאַל
  choice: bertanya
  rationale: Padanan alami dalam bahasa Indonesia modern untuk tindakan menanyakan informasi.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: Dalam konteks ini, saudara-saudara Yusuf menyebut diri mereka secara merendah di hadapan penguasa; “hamba-hamba” mempertahankan ungkapan penghormatan tanpa memastikan status mereka sebagai budak.
- source_word: לֵאמֹר
  choice: —
  rationale: Fungsi pengantar isi ujaran dinyatakan secara alami oleh tanda baca dan kutipan langsung; menerjemahkannya sebagai “dengan berkata” akan terasa kaku dan berlebihan dalam bahasa Indonesia.
- source_word: הֲיֵשׁ לָכֶם
  choice: Apakah kalian masih mempunyai
  rationale: Konstruksi interogatif eksistensial dengan ל menyatakan kepemilikan. “Kalian” mempertahankan bentuk jamak; “masih” menyampaikan implikasi kontekstual pertanyaan tentang anggota keluarga yang masih ada, tanpa menyatakan bahwa teks Ibrani memakai kata tersendiri untuk “masih”.
- source_word: אָב
  choice: ayah
  rationale: Padanan kekerabatan yang alami; bahasa Indonesia tidak memerlukan penanda tak tentu seperti artikel bahasa Inggris.
- source_word: אָח
  choice: saudara laki-laki
  rationale: Menjaga bentuk tunggal dan memperjelas bahwa אָח menunjuk saudara berjenis kelamin laki-laki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang santun dan bermartabat. “Tuanku” serta “hamba-hambanya” mempertahankan corak tutur penuh hormat di hadapan penguasa, sedangkan susunan pertanyaan dibuat alami bagi pembaca umum.
