  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: id
  text: maka, ketika ia melihat bahwa anak itu tidak ada, ia akan mati, dan hamba-hambamu akan membawa uban hambamu, ayah kami, turun ke Sheol dalam dukacita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Sheol”; dapat juga diterjemahkan “ke kubur” atau “ke alam orang mati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: maka
  rationale: Dalam konteks ini bentuk tersebut memperkenalkan akibat dari keadaan yang disebut sebelumnya; “maka” menyampaikan fungsi wacananya secara alami.
- source_word: כִּרְאוֹתוֹ
  choice: ketika ia melihat
  rationale: Infinitif konstruk dengan prefiks כ dan sufiks orang ketiga maskulin tunggal menyatakan keadaan waktu.
- source_word: כִּי אֵין הַנַּעַר
  choice: bahwa anak itu tidak ada
  rationale: אֵין di sini menyatakan ketidakhadiran; pilihan ini tidak menyiratkan bahwa anak itu telah mati.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר dapat berarti anak laki-laki atau pemuda; dalam konteks keluarga dan sudut pandang terhadap Benyamin, “anak itu” wajar dan mempertahankan nuansa emosionalnya.
- source_word: וָמֵת
  choice: ia akan mati
  rationale: Bentuk ini melanjutkan rangkaian akibat dan merujuk pada kematian sang ayah ketika mendapati Benyamin tidak hadir.
- source_word: וְהוֹרִידוּ
  choice: akan membawa ... turun
  rationale: Bentuk Hifil dari ירד mempertahankan gambaran kausatif dan arah turun menuju Sheol.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Ini merupakan sebutan diri yang merendah dalam tuturan di hadapan penguasa, bukan penekanan pada status perbudakan.
- source_word: שֵׂיבַת
  choice: uban
  rationale: Nomina ini secara konkret berarti rambut beruban dan secara metonimis menunjuk usia tua; “uban” mempertahankan gambaran Ibraninya.
- source_word: עַבְדְּךָ אָבִינוּ
  choice: hambamu, ayah kami
  rationale: 'Kedua sebutan bagi Yakub dipertahankan sebagai aposisi: ia adalah hamba sang penguasa dalam bahasa penghormatan dan sekaligus ayah para pembicara.'
- source_word: בְּיָגוֹן
  choice: dalam dukacita
  rationale: יָגוֹן menyatakan kesedihan atau dukacita yang mendalam; frasa ini mengikuti konstruksi preposisional Ibrani dengan alami.
- source_word: שְׁאֹלָה
  choice: ke dunia orang mati
  rationale: Dalam bahasa Indonesia umum, “dunia orang mati” mempertahankan cakupan Sheol sebagai ranah kematian dan tidak mempersempitnya menjadi kuburan fisik saja; istilah Ibraninya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל
  choice: dunia orang mati
  alternative: kubur; Sheol
  rationale: Pilihan ini mempertahankan cakupan konseptual istilah Ibrani sebagai ranah orang mati tanpa menetapkan rincian kosmologis atau doktrinal tertentu. Catatan kaki menyajikan istilah Ibrani dan alternatif yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “membawa uban ... turun” sengaja mempertahankan metafora Ibrani, sedangkan “dunia orang mati” menyampaikan Sheol secara mudah dipahami tanpa menyamakannya begitu saja dengan kuburan.
