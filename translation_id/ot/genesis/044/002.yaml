base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: id
  text: “Taruhlah juga cawanku, cawan perak itu, di bagian bukaan karung si bungsu[a], bersama uang perak untuk gandum yang dibelinya[b].” Ia pun melakukan sesuai dengan perkataan Yusuf yang telah diucapkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di mulut karung,” yaitu pada bagian bukaan karung.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani menunjuk pada uang perak yang dibayarkan untuk gandum atau bahan pangan yang dibeli.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: cawanku, yaitu cawan perak itu
  rationale: גְּבִיעַ menunjuk pada cawan atau piala. ‘Cawan’ alami dan bermartabat dalam bahasa Indonesia; pengulangan aposisional Ibrani dipertahankan dengan ‘yaitu’ agar penekanannya jelas.
- source_word: תָּשִׂים
  choice: taruhlah
  rationale: Kata kerja שׂים berarti menaruh atau menempatkan. Bentuk ‘taruhlah’ menyampaikan perintah langsung secara wajar.
- source_word: בְּפִי אַמְתַּחַת
  choice: di mulut karung
  rationale: Ungkapan Ibrani secara harfiah menyebut ‘mulut’ karung, yakni bagian bukaannya. Citra konkret sumber dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: הַקָּטֹן
  choice: si bungsu
  rationale: Secara harfiah berarti ‘yang kecil/muda’; dalam konteks ini menunjuk kepada saudara yang paling muda. ‘Si bungsu’ ringkas dan alami.
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: uang perak untuk gandum yang dibelinya
  rationale: כֶּסֶף dapat berarti perak atau uang, sedangkan שִׁבְרוֹ dalam kisah kelaparan ini mengacu pada gandum atau bahan pangan yang dibeli. ‘Uang perak’ mempertahankan unsur material sekaligus fungsi pembayarannya.
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: Orang itu pun melakukan seperti yang telah dikatakan Yusuf
  rationale: Rumusan ini menyampaikan bahwa pelayan tersebut bertindak sesuai perkataan Yusuf, sambil mengungkapkan klausa relatif Ibrani secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan aposisional ‘cawanku, yaitu cawan perak itu’ mempertahankan penekanan teks Ibrani, sedangkan ‘si bungsu’ dan ‘seperti yang telah dikatakan Yusuf’ menjaga kelancaran bagi pembaca umum.
