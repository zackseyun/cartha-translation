  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ הוֹרִדֻ֖/הוּ אֵלָ֑/י וְ/אָשִׂ֥ימָה עֵינִ֖/י עָלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/021.yaml
  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: id
  text: Lalu Tuanku berkata kepada hamba-hambamu, “Bawalah dia turun kepadaku supaya aku dapat mengarahkan pandanganku kepadanya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melihatnya.” Ungkapan Ibrani ini secara harfiah berbunyi “menaruh mataku atasnya” dan dapat berarti melihat, mengamati, atau memberi perhatian khusus kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu Tuanku berkata
  rationale: Bentuk wayyiqtol meneruskan urutan narasi, sehingga וַ diterjemahkan “Lalu”. Sapaan “Tuanku” menyampaikan orang kedua tunggal dalam konteks ujaran Yehuda yang hormat kepada Yusuf tanpa mengubah rujukannya.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam konteks istana, עבד menunjuk pada kedudukan rendah para saudara di hadapan penguasa, bukan terutama status perbudakan. “Hamba-hambamu” mempertahankan ungkapan merendahkan diri dan sufiks orang kedua.
- source_word: הוֹרִדֻהוּ
  choice: Bawalah dia turun
  rationale: Imperatif hifil dari ירד menyatakan tindakan menyebabkan seseorang turun. Rumusan ini mempertahankan nuansa arah perjalanan turun ke Mesir sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: אֵלָי
  choice: kepadaku
  rationale: Preposisi ini menunjukkan gerak menuju si pembicara secara langsung.
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: supaya aku dapat mengarahkan pandanganku kepadanya
  rationale: Ungkapan ini secara harfiah berbicara tentang menaruh mata atas seseorang. “Mengarahkan pandanganku kepadanya” mempertahankan citra penglihatan dan tidak membatasi maknanya hanya pada melihat, memeriksa, atau memberi perhatian khusus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. “Tuanku” serta “hamba-hambamu” mempertahankan tata krama istana dalam ujaran Yehuda. Citra idiom Ibrani dipertahankan dalam bentuk yang dapat dipahami pembaca modern, sementara keluasan maknanya dijelaskan dalam catatan kaki.
