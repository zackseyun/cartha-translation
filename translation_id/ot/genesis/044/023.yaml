lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu Tuanku berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan kisah. “Lalu” menyatakan kesinambungan naratif, sedangkan “Tuanku” menjaga kesantunan sapaan Yehuda kepada Yusuf tanpa menghilangkan bahwa Yusuflah yang disapa.
- source_word: עֲבָדֶיךָ
  choice: kepada hamba-hambamu
  rationale: Dalam suasana istana, עבד berfungsi sebagai sebutan diri yang merendah dan sopan. “Hamba-hamba” mempertahankan gambaran relasional itu tanpa secara khusus menekankan status perbudakan.
- source_word: אִם לֹא
  choice: Jika ... tidak
  rationale: Terjemahan ini mempertahankan bentuk syarat negatif Ibrani secara transparan.
- source_word: יֵרֵד
  choice: turun
  rationale: Kata ירד menyatakan gerak turun, sesuai perjalanan dari Kanaan menuju Mesir; bahasa Indonesia tidak mengharuskan perubahan menjadi verba deiktis seperti dalam bahasa Inggris.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: adik bungsumu
  rationale: Dalam konteks para saudara ini, הַקָּטֹן menunjuk saudara yang paling muda. “Adik bungsu” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: אִתְּכֶם
  choice: bersama kalian
  rationale: Penanda penyertaan diterjemahkan secara langsung; “kalian” memperjelas bahwa pronomina Ibrani berbentuk jamak.
- source_word: לֹא תֹסִפוּן
  choice: kalian tidak boleh lagi
  rationale: Konstruksi dengan יסף melarang terjadinya tindakan itu sekali lagi. “Tidak boleh lagi” menyampaikan daya larangan sekaligus aspek pengulangan secara alami.
- source_word: לִרְאוֹת פָּנָי
  choice: melihat wajahku
  rationale: Terjemahan utama mempertahankan ungkapan harfiah dan hidup dari bahasa Ibrani, sementara makna idiomatisnya dicatat dalam catatan kaki.
