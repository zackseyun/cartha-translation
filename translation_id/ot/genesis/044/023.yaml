    issue: Pronomina dalam ‘adik bungsumu’ adalah tunggal.
    rationale: Teks Ibrani אֲחִיכֶם (‘saudara kalian’) dan אִתְּכֶם (‘bersama kalian’) menyapa para hamba secara jamak. Bentuk yang tepat dalam bahasa Indonesia ialah ‘adik bungsu kalian’.
  - severity: low
    issue: ‘Tidak boleh lagi’ dapat mempersempit nuansa menjadi larangan deontis.
    rationale: לֹא תֹסִפוּן menyatakan bahwa mereka tidak akan lagi melanjutkan/memperoleh kesempatan untuk melihat wajah sang penguasa. ‘Tidak akan lagi’ menyampaikan konsekuensi tegas itu tanpa menambahkan penekanan larangan.
