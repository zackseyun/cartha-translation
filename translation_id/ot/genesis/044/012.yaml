  text: וַ/יְחַפֵּ֕שׂ בַּ/גָּד֣וֹל הֵחֵ֔ל וּ/בַ/קָּטֹ֖ן כִּלָּ֑ה וַ/יִּמָּצֵא֙ הַ/גָּבִ֔יעַ בְּ/אַמְתַּ֖חַת בִּנְיָמִֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: id
  text: Lalu ia menggeledah, mulai dari yang tertua dan berakhir pada yang termuda. Cawan itu ditemukan di dalam karung Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “piala”. Kata Ibrani ini dapat berarti cawan atau piala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: ia menggeledah
  rationale: Dalam konteks ini חפשׂ menunjuk pada pemeriksaan barang bawaan secara menyeluruh; “menggeledah” alami dalam bahasa Indonesia dan lebih tepat daripada sekadar “mencari”.
- source_word: בַּגָּדוֹל
  choice: dari yang tertua
  rationale: Dalam urutan saudara-saudara ini, גָּדוֹל mengacu pada usia, bukan ukuran tubuh atau kedudukan.
- source_word: הֵחֵל
  choice: mulai
  rationale: Menandai titik awal penggeledahan dan membentuk pasangan alami dengan “berakhir”.
- source_word: וּבַקָּטֹן
  choice: pada yang termuda
  rationale: Dalam konteks keluarga, קָטֹן berlawanan dengan “yang tertua” dan berarti saudara yang paling muda.
- source_word: כִּלָּה
  choice: berakhir
  rationale: Menandai titik akhir urutan penggeledahan tanpa mengubah subjek atau alur tindakan Ibrani.
- source_word: וַיִּמָּצֵא
  choice: ditemukan
  rationale: Bentuk Nifal dipertahankan sebagai pasif, sehingga teks tidak secara eksplisit mengubahnya menjadi “ia menemukan”.
- source_word: הַגָּבִיעַ
  choice: cawan
  rationale: גָּבִיעַ menunjuk pada wadah minum, sering kali berbentuk piala; “cawan” sesuai dengan register naratif Alkitab Indonesia dan konteks benda milik Yusuf.
- source_word: בְּאַמְתַּחַת
  choice: di dalam karung
  rationale: אַמְתַּחַת adalah karung atau kantong untuk membawa gandum dan perbekalan; “karung” paling sesuai dengan konteks perjalanan ini.
- source_word: בִּנְיָמִן
  choice: Benyamin
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Struktur urutan dari saudara tertua sampai termuda dipertahankan, demikian pula bentuk pasif “ditemukan”. Penanda catatan kaki ditempatkan setelah kalimat yang memuat kata “cawan” agar alternatif leksikal tetap jelas.
