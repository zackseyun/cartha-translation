base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: id
  text: Lalu Yusuf berkata kepada mereka, “Perbuatan apakah ini yang telah kalian lakukan? Tidakkah kalian tahu bahwa orang seperti aku benar-benar melakukan tenung[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pasti menenung,” “tentu akan mengetahuinya melalui tenung,” atau “pasti dapat menemukan hal-hal semacam itu.” Bahasa Ibrani menggunakan infinitif absolut yang diikuti kata kerja dari akar yang sama, yaitu akar untuk tenung, untuk memberi penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה
  choice: Perbuatan apa ... ini?
  rationale: מַעֲשֶׂה berarti perbuatan atau tindakan. Susunan ini mempertahankan bobot teguran sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: עֲשִׂיתֶם
  choice: telah kalian lakukan
  rationale: Bentuk perfek menyatakan tindakan yang sudah dilakukan dan kini menjadi pokok tuduhan. 'Kalian' dengan jelas menunjukkan orang kedua jamak.
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: Tidakkah kalian tahu
  rationale: Pertanyaan negatif ini mengharapkan jawaban ya dan mempertahankan daya retoris teks Ibrani.
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: benar-benar melakukan tenung
  rationale: Infinitif absolut yang diikuti verba dari akar yang sama memberi penegasan kuat. 'Melakukan tenung' menyatakan praktik divinasi secara langsung, sedangkan 'benar-benar' membawa unsur penekanannya.
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: orang seperti aku
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menyampaikan perbandingan diri yang dinyatakan Yusuf.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Mengikuti bentuk baku nama tokoh ini dalam tradisi Alkitab bahasa Indonesia.
theological_decisions:
- issue: Apakah perkataan Yusuf tentang tenung harus diterjemahkan sebagai klaim langsung atau diperhalus sebagai kepura-puraan belaka
  choice: 'Diterjemahkan langsung sebagai bagian dari perkataan Yusuf: ''orang seperti aku benar-benar melakukan tenung.'''
  alternative: orang seperti aku tentu dapat mengetahui hal-hal semacam itu melalui tenung
  rationale: Teks Ibrani memakai akar נחש secara eksplisit dan intensif. Terjemahan tidak menentukan apakah Yusuf sungguh melakukan tenung atau sedang mempertahankan peran Mesirnya; ketegangan naratif dibiarkan tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalian' dipakai untuk menandai orang kedua jamak dalam percakapan, sementara 'tenung' mempertahankan istilah khusus bagi praktik divinasi tanpa menambahkan penilaian teologis yang tidak dinyatakan ayat.
