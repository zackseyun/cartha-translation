base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: id
  text: “Bukankah ini cawan yang dipakai tuanku untuk minum, dan yang dengannya ia sungguh-sungguh melakukan praktik tenung[a]? Kalian telah berbuat jahat dengan melakukan hal ini[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan ia pasti menenung dengannya.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Kalian telah berbuat jahat dalam apa yang kalian lakukan.”
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: Bukankah ini cawan
  rationale: הֲלֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan. Kata “cawan” diperjelas dari konteks langsung sebagai acuan זֶה agar kalimat alami dan jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: yang dipakai tuanku untuk minum
  rationale: Preposisi ב dengan verba “minum” secara idiomatis menyatakan minum dari atau dengan cawan itu. “Tuanku” mempertahankan gelar sosial yang dipakai pengurus rumah terhadap Yusuf tanpa memberi kesan sebutan ilahi.
- source_word: וְהוּא נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: dan yang benar-benar dipakainya untuk melakukan tenung
  rationale: “Benar-benar” mencerminkan penegasan dari infinitif absolut נַחֵשׁ bersama verba finit יְנַחֵשׁ. “Melakukan tenung” menyampaikan praktik divinasi, sedangkan “dipakainya” mempertahankan fungsi instrumental בּוֹ.
- source_word: הֲרֵעֹתֶם
  choice: Kalian telah berbuat jahat
  rationale: Bentuk Hifil dari רעע menyatakan tindakan jahat atau buruk. “Berbuat jahat” mempertahankan bobot moral ungkapan Ibrani dan bentuk jamak orang kedua diterjemahkan dengan “kalian”.
- source_word: אֲשֶׁר עֲשִׂיתֶם
  choice: dengan melakukan hal ini
  rationale: Klausa relatif ini menunjuk pada tindakan yang baru dilakukan. Bentuk ini alami dalam bahasa Indonesia dan menghindari pengulangan kaku “dalam apa yang kalian lakukan”.
theological_decisions:
- issue: Apakah ucapan ini menyatakan bahwa Yusuf sungguh melakukan tenung atau hanya mempertahankan penyamaran dan siasat pengujiannya
  choice: Menerjemahkan tuduhan pengurus rumah secara langsung sebagai pernyataan bahwa tuannya memakai cawan itu untuk melakukan tenung.
  alternative: Melunakkan pernyataan menjadi sekadar anggapan orang atau kemampuan hipotetis Yusuf untuk menenung.
  rationale: Teks Ibrani dalam tuturan pengurus rumah secara lugas memakai bahasa divinasi. Terjemahan mempertahankan isi tuturan itu tanpa memutuskan apakah narator membenarkannya sebagai gambaran praktik Yusuf yang sebenarnya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Tuanku” sesuai dengan hubungan sosial pengurus rumah dan Yusuf; “kalian” memperjelas bahwa teguran ditujukan kepada kelompok saudara. Istilah “tenung” dipilih untuk menjaga makna ritual divinasi dan tidak mereduksinya menjadi tebakan biasa.
