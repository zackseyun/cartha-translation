  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Ia” dipakai untuk penutur sesuai konteks ayat, “kalian” membedakan sapaan jamak, dan “pulanglah dengan selamat” mengungkapkan idiom perjalanan secara alami.
