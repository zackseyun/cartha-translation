base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: id
  text: Namun ia berkata, “Pantang bagiku melakukan hal itu! Orang yang di tangannya piala itu ditemukan, dialah yang akan menjadi budakku[a]. Tetapi kalian, pergilah dengan selamat kepada ayah kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “budak” juga dapat berarti “pelayan”. Di sini konteksnya adalah perhambaan sebagai hukuman.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: Pantang bagiku
  rationale: Ungkapan idiomatis ini menyatakan penolakan keras atau rasa ngeri terhadap suatu tindakan. “Pantang bagiku” alami dalam bahasa Indonesia dan mempertahankan daya penolakannya.
- source_word: מֵעֲשׂוֹת זֹאת
  choice: melakukan hal itu
  rationale: Infinitif berpreposisi menyatakan tindakan yang ditolak; bentuk ini lugas dan alami setelah ungkapan “Pantang bagiku”.
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: Orang yang padanya piala itu ditemukan
  rationale: Frasa ini menyampaikan bahwa piala ditemukan pada orang tersebut, yakni dalam penguasaannya, tanpa membuat bahasa Indonesia menjadi kaku. Nuansa harfiah “di tangannya” dicatat dalam catatan kaki.
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: dialah yang akan menjadi budakku
  rationale: Kata עָבֶד dapat berarti pelayan atau budak. Dalam konteks hukuman berupa perhambaan paksa, “budak” paling jelas menyatakan status yang dimaksud; bentuk penegas “dialah” mencerminkan הוּא.
- source_word: וְאַתֶּם עֲלוּ
  choice: Tetapi kalian, pulanglah
  rationale: Imperatif jamak dikontraskan dengan nasib orang yang ditahan. Secara harfiah עֲלוּ berarti “naiklah”, tetapi dalam konteks perjalanan kembali kepada ayah mereka, “pulanglah” lebih alami dan tetap menyampaikan arah tujuan.
- source_word: לְשָׁלוֹם
  choice: dengan selamat
  rationale: Ungkapan ini menunjuk pada keberangkatan dalam keadaan aman dan tanpa gangguan. “Dengan selamat” merupakan padanan Indonesia yang alami.
- source_word: אֶל אֲבִיכֶם
  choice: kepada ayah kalian
  rationale: Padanan langsung dan alami untuk frasa tujuan ini.
theological_decisions: []
