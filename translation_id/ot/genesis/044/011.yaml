  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: id
  text: Mereka pun bergegas, lalu masing-masing menurunkan karungnya ke tanah dan membukanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani mengulangi “masing-masing” sebelum tindakan menurunkan dan membuka, sehingga menegaskan bahwa setiap orang menurunkan dan membuka karungnya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: mereka pun bergegas
  rationale: Bentuk jamak dari akar מהר menyatakan tindakan yang segera. “Bergegas” alami dalam bahasa Indonesia modern, sedangkan “pun” menjaga gerak naratif tanpa memberi makna kausal yang tidak dinyatakan.
- source_word: וַיּוֹרִדוּ
  choice: menurunkan
  rationale: Bentuk Hifil dari ירד berarti membuat sesuatu turun. Dalam konteks karung yang dibawa, “menurunkan” mempertahankan gerakan menuju tanah tanpa mengandaikan secara eksplisit bahwa karung itu berada di atas hewan.
- source_word: אִישׁ ... אַמְתַּחְתּוֹ
  choice: masing-masing ... karungnya
  rationale: אִישׁ digunakan secara distributif dan sufiksnya menunjukkan bahwa tiap orang menangani karung miliknya sendiri. “Masing-masing” menyampaikan fungsi ini dengan alami.
- source_word: אַמְתַּחַת
  choice: karung
  rationale: Kata ini menunjuk wadah untuk barang atau perbekalan. “Karung” sesuai dengan konteks kisah Yusuf dan lebih khusus daripada “tas”.
- source_word: אָרְצָה
  choice: ke tanah
  rationale: Bentuk berarah ini menyatakan gerakan menuju permukaan tanah; “ke tanah” ringkas dan wajar.
- source_word: וַיִּפְתְּחוּ
  choice: membukanya
  rationale: Akar פתח berarti “membuka.” Pronomina “-nya” secara alami merujuk kembali kepada karung masing-masing, sebagaimana pengulangan objek dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur jamak “mereka pun bergegas” dipertahankan sesuai verba Ibrani, lalu “masing-masing” menyatakan tindakan distributif. Pengulangan Ibrani diringkas menjadi pronomina “membukanya” demi kealamian, dengan penegasannya dicatat dalam catatan kaki.
