base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: id
  text: Sebab hambamu ini telah menjadi penjamin bagi anak itu kepada ayahku,[a] dengan berkata, ‘Jika aku tidak membawanya kepadamu, aku akan bersalah kepada ayahku seumur hidupku.’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menjamin anak itu” atau “telah menjaminkan dirinya bagi anak itu.” Kata kerja Ibrani ini menyatakan pengambilan tanggung jawab sebagai penjamin.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “aku akan berdosa/bersalah kepada ayahku sepanjang hari-hariku”; ungkapan ini dapat menyatakan kesalahan atau tanggungan yang berlangsung seumur hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari permohonan Yehuda dan menghubungkan ayat ini dengan konteks sebelumnya.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Bentuk sapaan merendah dalam tuturan kepada pejabat yang lebih tinggi; 'hamba' mempertahankan citra leksikal dan register istana tanpa harus menegaskan status perbudakan dalam konteks ini.
- source_word: עָרַב אֶת הַנַּעַר
  choice: telah menjadi penjamin bagi anak itu
  rationale: Kata kerja עָרַב menyatakan pengambilan tanggung jawab sebagai penjamin; pilihan ini mempertahankan nuansa kewajiban pribadi.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: Sebutan ini merujuk kepada Benyamin dalam konteks keluarga. 'Anak itu' alami dalam bahasa Indonesia dan tidak memaksa pengertian bahwa ia masih kanak-kanak.
- source_word: מֵעִם אָבִי
  choice: kepada ayahku
  rationale: Dalam konstruksi dengan עָרַב, frasa ini menunjuk kepada pihak yang menerima jaminan. Bahasa Indonesia secara idiomatis memakai 'kepada'.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan isi janji Yehuda secara wajar dalam bahasa Indonesia.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: Jika aku tidak membawanya kembali kepadamu
  rationale: Menyatakan syarat janji dengan jelas. 'Kembali' tersirat oleh konteks pemulangan Benyamin kepada ayahnya, meski unsur itu tidak dinyatakan tersendiri dalam verba Ibrani.
- source_word: וְחָטָאתִי לְאָבִי
  choice: aku akan menanggung kesalahan terhadap ayahku
  rationale: Secara harfiah verba berarti 'aku akan berdosa/bersalah'; dalam konteks jaminan, ungkapan ini menyatakan kesalahan dan tanggung jawab yang terus melekat. 'Terhadap' menjaga dimensi relasional dari preposisi לְ.
- source_word: כָּל הַיָּמִים
  choice: seumur hidupku
  rationale: Ungkapan idiomatis yang menyampaikan durasi sepanjang sisa hidup Yehuda.
theological_decisions:
- issue: Makna וְחָטָאתִי sebagai dosa atau tanggungan kesalahan
  choice: menanggung kesalahan
  alternative: berdosa / tetap bersalah
  rationale: Konteksnya adalah kewajiban Yehuda sebagai penjamin, tetapi akar חטא tetap mengandung bahasa kesalahan atau dosa. Teks utama memakai ungkapan alami tanpa menghapus makna harfiahnya, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan bersahaja yang sesuai dengan permohonan Yehuda di hadapan penguasa. Pronomina 'aku' dipertahankan dalam kutipan kepada ayahnya, sedangkan 'hambamu ini' mencerminkan kerendahan diri Yehuda ketika berbicara kepada Yusuf.
