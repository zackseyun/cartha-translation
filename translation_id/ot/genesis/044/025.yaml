base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/025.yaml
  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: id
  text: Lalu ayah kami berkata[a], “Kembalilah dan belilah sedikit makanan untuk kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kembalilah; belilah sedikit gandum untuk kami.” Bahasa Ibrani memakai kata umum untuk “makanan,” meskipun konteks yang lebih luas berkaitan dengan gandum.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini meneruskan rangkaian peristiwa; “Lalu” menyampaikan urutan tersebut secara alami dalam bahasa Indonesia.
- source_word: אָבִינוּ
  choice: ayah kami
  rationale: Dalam konteks ini kata tersebut menunjuk kepada Yakub, ayah langsung para saudara itu, bukan leluhur secara umum.
- source_word: שֻׁבוּ
  choice: Kembalilah
  rationale: Imperatif ini menyuruh mereka kembali ke tempat mereka sebelumnya membeli makanan; bentuk ini mempertahankan makna arah tanpa menambahkan keterangan yang tidak dinyatakan.
- source_word: שִׁבְרוּ
  choice: belilah
  rationale: Dalam kisah Yusuf, verba ini berarti membeli bahan pangan. Objek yang disebut sesudahnya membuat terjemahan umum “belilah” memadai.
- source_word: לָנוּ
  choice: untuk kami
  rationale: Frasa ini menyatakan penerima manfaat dan paling alami diterjemahkan secara eksplisit sebagai “untuk kami” dalam bahasa Indonesia.
- source_word: מְעַט
  choice: sedikit
  rationale: Kata ini menunjukkan jumlah kecil dan dapat diterjemahkan secara ringkas serta alami sebagai “sedikit”.
- source_word: אֹכֶל
  choice: makanan
  rationale: Kata Ibrani ini merupakan istilah umum untuk makanan. Walaupun konteksnya berkaitan dengan gandum, terjemahan “makanan” tidak mempersempit makna sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan wajar untuk dialog naratif. Susunan “belilah sedikit makanan untuk kami” dipilih agar jelas dan alami, sementara pengulangan dua imperatif Ibrani tetap dipertahankan.
