  naturalness: Bahasa umumnya baku dan jelas. “Saudara anak itu” terdengar tidak alami dalam narasi; “saudara laki-lakinya” lebih jelas. “Hanya dialah yang tersisa bagi ibunya” merupakan susunan yang lebih alami sekaligus dekat dengan Ibrani.
  terminology: “Tuanku” tepat untuk אֲדֹנִי dalam konteks penghormatan istana. “Mengasihinya” layak dalam register naratif Alkitab. Catatan a dan b memiliki jangkar yang tepat dan membantu menjelaskan idiom tanpa memaksakan tafsiran doktrinal.
