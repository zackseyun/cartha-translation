  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: id
  text: Lalu kami berkata kepada tuanku, ‘Kami mempunyai ayah yang sudah tua dan seorang anak laki-laki yang masih muda, yang lahir ketika ayahnya sudah tua.[a] Saudara laki-lakinya telah meninggal, dan hanya dialah yang tersisa bagi ibunya,[b] dan ayahnya mengasihinya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang anak masa tuanya yang masih muda.” Ungkapan Ibrani ini berarti anak yang lahir ketika ayahnya sudah lanjut usia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hanya dia yang tersisa bagi ibunya,” yaitu dia satu-satunya anak laki-laki ibunya yang masih hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada penguasa yang mempertahankan hierarki sosial dan pola sapaan berulang dalam kisah Yusuf.
- source_word: זָקֵן
  choice: yang sudah tua
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk usia lanjut sang ayah.
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: seorang anak laki-laki yang masih muda, yang lahir pada masa tuanya
  rationale: Menyampaikan יֶלֶד sebagai anak laki-laki, קָטָן sebagai usia muda, dan idiom זְקֻנִים sebagai kelahiran ketika ayahnya telah tua.
- source_word: וְאָחִיו מֵת
  choice: Saudara anak itu telah meninggal
  rationale: Bentuk ini menyatakan keadaan yang dihasilkan oleh kematian dan menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: sehingga dialah satu-satunya anak yang masih hidup dari ibunya
  rationale: Mengungkapkan secara alami bahwa ia merupakan satu-satunya anak ibunya yang tersisa, tanpa memberi kesan bahwa ia ditinggalkan dalam pengasuhan ibunya.
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: dan ayahnya mengasihinya
  rationale: Padanan langsung dan bermartabat bagi kasih khusus sang ayah kepadanya.
