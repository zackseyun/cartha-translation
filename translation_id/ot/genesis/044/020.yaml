  - severity: low
    issue: “Saudara anak itu”
    rationale: Ungkapan ini kaku dalam Bahasa Indonesia dan tidak menandai bahwa yang dimaksud adalah saudara laki-laki. Pronomina yang jelas lebih wajar dalam narasi ini.
