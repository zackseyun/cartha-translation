  edition: WLC
  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: id
  text: Siapa pun di antara hamba-hambamu yang kedapatan membawa cawan itu, biarlah dia mati,[a] dan kami pun akan menjadi budak tuanku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dia harus mati.”'
    reason: Bentuk Ibrani dapat dipahami sebagai akibat volitif (“biarlah”) atau pernyataan hukuman yang tegas (“harus”).
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hamba-hambamu” sebelumnya dan “budak” di sini berasal dari akar yang sama. Yang pertama merupakan penyebutan diri secara hormat, sedangkan yang kedua menunjuk pada perbudakan sebagai hukuman.
    reason: Perbedaan padanan diperlukan untuk mencerminkan fungsi kontekstual yang berbeda dari kata Ibrani yang sama.
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: Siapa pun di antara hamba-hambamu yang kedapatan membawa cawan itu
  rationale: Klausa relatif tak tentu diterjemahkan secara wajar dalam bahasa Indonesia. Bentuk Nifal יִמָּצֵא menyatakan bahwa cawan itu ditemukan pada seseorang; 'kedapatan membawa' mengungkapkan kepemilikan atau keberadaan benda padanya tanpa ungkapan pasif yang kaku. 'Cawan itu' dibuat eksplisit dari konteks langsung.
- source_word: וָמֵת
  choice: biarlah dia mati
  rationale: Bentuk perfektum berwaw di sini menyatakan akibat yang diajukan dengan daya volitif dalam pernyataan bersumpah para saudara.
- source_word: וְגַם אֲנַחְנוּ
  choice: dan kami pun
  rationale: Partikel גַם menambahkan nasib para saudara kepada hukuman bagi orang yang kedapatan membawa cawan itu; 'pun' menyampaikan penekanan tambahan secara alami.
- source_word: נִהְיֶה
  choice: akan menjadi
  rationale: היה menunjuk pada masuknya mereka ke dalam suatu keadaan baru sebagai akibat hukuman yang mereka tawarkan.
- source_word: לַאדֹנִי
  choice: tuanku
  rationale: Ini adalah sapaan hormat kepada penguasa manusia dengan sufiks orang pertama tunggal, bukan gelar ilahi.
- source_word: לַעֲבָדִים
  choice: budak
  rationale: Dalam kemunculan kedua, עבד menunjuk pada perbudakan nyata sebagai hukuman, sehingga 'budak' lebih tepat daripada 'hamba'.
theological_decisions:
- issue: Penerjemahan dua kemunculan akar עבד dalam ayat yang sama
  choice: '''hamba-hambamu'' pada penyebutan diri secara hormat, tetapi ''budak'' pada hukuman berupa perbudakan'
  alternative: '''budak'' pada kedua kemunculan atau ''hamba'' pada kedua kemunculan'
  rationale: Akar Ibrani yang sama dipakai dalam dua fungsi kontekstual. Yang pertama merupakan penyebutan diri dengan hormat di hadapan seorang penguasa; yang kedua menonjolkan status terikat yang sungguh-sungguh. Perbedaan padanan menjaga kedua nuansa tanpa mengubah rujukannya.
- issue: Daya modal וָמֵת
  choice: biarlah dia mati
  alternative: dia harus mati / dia akan mati
  rationale: Dalam usulan hukuman yang bernada sumpah ini, bentuk tersebut paling wajar dipahami sebagai akibat volitif, tetapi alternatif yang lebih deklaratif tetap mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Tuanku' mempertahankan kesantunan istana, sedangkan 'budak' menyatakan perbudakan nyata dengan jelas. Penyebutan 'cawan itu' mengikuti acuan yang sudah jelas dari konteks sebelumnya dan menghindari konstruksi pasif Indonesia yang kaku.
