  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: id
  text: Kemudian Yusuf memerintahkan orang yang mengurus rumahnya, “Isilah karung-karung orang-orang itu dengan makanan sebanyak yang sanggup mereka bawa, lalu letakkan uang perak setiap orang di mulut karung masing-masing[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di mulut karungnya,” yaitu di bagian bukaan karungnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: Kemudian Yusuf memerintahkan
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. Subjek tersirat diperjelas sebagai Yusuf berdasarkan konteks langsung agar alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל בֵּיתוֹ
  choice: orang yang mengurus rumahnya
  rationale: Secara harfiah berarti 'orang yang berada atas rumahnya' dan menunjuk kepada pejabat yang mengelola rumah tangga Yusuf. Pilihan ini jelas tanpa memakai istilah jabatan yang terlalu interpretatif.
- source_word: מַלֵּא אֶת אַמְתְּחֹת הָאֲנָשִׁים אֹכֶל
  choice: Isilah karung-karung orang-orang itu dengan makanan
  rationale: Mempertahankan imperatif, istilah umum untuk makanan, dan rujukan teks kepada 'orang-orang itu', bukan menggantinya dengan identifikasi kontekstual 'saudara-saudara Yusuf'.
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: sebanyak yang sanggup mereka bawa
  rationale: Mengungkapkan secara alami gabungan makna kemampuan dan mengangkat atau membawa.
- source_word: כֶּסֶף אִישׁ
  choice: uang perak masing-masing
  rationale: כֶּסֶף dalam konteks ini adalah perak yang dipakai sebagai pembayaran; 'masing-masing' mempertahankan daya distributif אִישׁ.
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: di mulut karungnya
  rationale: Mempertahankan metafora Ibrani yang transparan, sedangkan arti praktisnya diterangkan dalam catatan kaki.
