  to: Kemudian Yusuf memerintahkan orang yang mengurus rumahnya, “Isilah karung-karung orang-orang itu dengan makanan sebanyak yang sanggup mereka bawa, lalu letakkan uang perak setiap orang di mulut karung masing-masing[a].”
