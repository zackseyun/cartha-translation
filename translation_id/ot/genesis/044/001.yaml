  register: Bahasa Indonesia baku, modern, dan bernada naratif. 'Karung' sesuai dengan wadah pengangkut bahan makanan dalam konteks kuno; 'uang perak' menjelaskan fungsi perak tanpa mengubahnya menjadi sistem mata uang modern.
