base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: id
  text: Tetapi kami berkata, “Kami tidak dapat turun. Jika adik kami yang bungsu ada bersama kami, kami akan turun, sebab kami tidak dapat menghadap orang itu jika adik kami yang bungsu tidak bersama kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Namun kami berkata
  rationale: Waw meneruskan penuturan, sementara “namun” menyatakan pertentangan ringan dengan tuntutan yang baru diceritakan dalam konteks.
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: Kami tidak dapat pergi ke sana
  rationale: יכל menyatakan kemampuan. ירד secara harfiah berarti “turun”, tetapi dalam konteks perjalanan ke Mesir, “pergi ke sana” lebih wajar dalam bahasa Indonesia dan tidak bergantung pada sudut pandang geografis pembaca.
- source_word: אִם יֵשׁ אָחִינוּ הַקָּטֹן אִתָּנוּ
  choice: Jika adik bungsu kami menyertai kami
  rationale: אִם memperkenalkan syarat positif. הַקָּטֹן dalam konteks keluarga menunjuk kepada saudara yang paling muda; “adik bungsu” menyampaikan hubungan dan urutan usia secara alami.
- source_word: וְיָרַדְנוּ
  choice: kami akan pergi
  rationale: Klausa ini menyatakan akibat dari syarat sebelumnya. Bentuk mendatang dipertahankan; kata “maka” tidak diperlukan karena hubungan syarat-akibat sudah jelas.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memberikan alasan bagi penolakan mereka; “sebab” sesuai dengan register naratif yang dignified namun tetap umum.
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: menghadap orang itu
  rationale: Secara harfiah ungkapan ini berarti “melihat wajah orang itu”, tetapi merupakan idiom untuk datang ke hadapan atau menghadap seseorang. Padanan idiomatis Indonesia menghindari kesan bahwa yang dimaksud hanya melihat wajahnya.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: הָאִישׁ berarti “orang/laki-laki itu” dan menunjuk kepada Yusuf. Teks tidak memakai gelar jabatan, sehingga gelar tidak ditambahkan.
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: jika adik bungsu kami tidak menyertai kami
  rationale: Walaupun bahasa Ibrani menghubungkan klausa ini dengan waw, fungsinya menyatakan keadaan yang menghalangi mereka menghadap orang itu. “Jika ... tidak” mengungkapkan hubungan tersebut secara alami tanpa mengubah makna.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Struktur Ibrani berupa penolakan lalu syarat dipertahankan sebagai dua kalimat. Idiom “melihat wajah” diterjemahkan menurut maknanya sebagai “menghadap”; tidak diperlukan catatan kaki karena tidak ada ambiguitas penting yang hilang.
