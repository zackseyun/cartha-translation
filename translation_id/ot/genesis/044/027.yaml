  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: id
  text: Lalu hamba Tuanku, ayah saya, berkata kepada kami, ‘Kalian tahu bahwa istri saya melahirkan dua anak laki-laki[a] untuk saya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “istri saya melahirkan dua untuk saya.” Kata “anak laki-laki” tersirat dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan gerak naratif itu secara alami.
- source_word: עַבְדְּךָ אָבִי
  choice: ayah saya, hamba Tuanku
  rationale: Urutan ini alami dalam bahasa Indonesia, mempertahankan identitas keluarga dan sikap hormat Yehuda kepada Yusuf. “Tuanku” menyampaikan sapaan deferensial yang tersirat dalam akhiran orang kedua.
- source_word: אֵלֵינוּ
  choice: kepada kami
  rationale: Padanan langsung dan wajar bagi preposisi dengan akhiran orang pertama jamak.
- source_word: אַתֶּם יְדַעְתֶּם
  choice: Kalian tahu
  rationale: Pronomina eksplisit memberi penekanan kepada subjek jamak. “Kalian” membedakan bentuk jamak Ibrani, sedangkan kala kini sesuai dengan pengetahuan yang tetap berlaku dalam ujaran tersebut.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang diketahui.
- source_word: שְׁנַיִם
  choice: dua anak laki-laki
  rationale: Teks Ibrani secara harfiah hanya menyebut “dua”; konteks menunjukkan dua anak laki-laki, yakni Yusuf dan Benyamin. Nomina yang tersirat dibuat eksplisit demi kejelasan bahasa Indonesia.
- source_word: יָלְדָה לִּי
  choice: melahirkan ... bagi saya
  rationale: Menyampaikan verba ילד dan objek tak langsung לִּי tanpa menghilangkan nuansa relasionalnya.
- source_word: אִשְׁתִּי
  choice: istri saya
  rationale: Dalam konteks ini אִשָּׁה dengan akhiran orang pertama tunggal berarti “istri saya”.
