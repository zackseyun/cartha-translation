translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. “Saya” dan “Tuanku” mempertahankan suasana tutur hormat dalam adegan istana; “kalian” mempertahankan bentuk orang kedua jamak. Penanda catatan kaki ditempatkan setelah kalimat yang memuat unsur yang dijelaskan.
