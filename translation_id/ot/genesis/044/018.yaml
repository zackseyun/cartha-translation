base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: id
  text: Lalu Yehuda mendekati Yusuf dan berkata, “Mohon, Tuanku, izinkanlah hambamu menyampaikan sesuatu kepada Tuanku[a]. Janganlah murka Tuanku menyala terhadap hambamu, sebab Tuanku seperti Firaun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di telinga Tuanku,” sebuah ungkapan Ibrani yang berarti berbicara supaya didengar oleh Tuanku.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו יְהוּדָה
  choice: Lalu Yehuda mendekati Yusuf
  rationale: נגשׁ menyatakan tindakan mendekat secara nyata. Nama Yusuf dipakai untuk memperjelas rujukan pronomina ‘kepadanya’ dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: בִּי אֲדֹנִי
  choice: Mohon, Tuanku
  rationale: בִּי merupakan seruan permohonan yang sopan dan penuh hormat; ‘Mohon’ alami dalam bahasa Indonesia, sedangkan ‘Tuanku’ mempertahankan sapaan kehormatan אֲדֹנִי.
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: izinkanlah hambamu menyampaikan sesuatu
  rationale: Bentuk permohonan dengan נָא diterjemahkan secara alami sebagai ‘izinkanlah’; sebutan diri ‘hambamu’ mempertahankan sikap merendah Yehuda. דָבָר secara idiomatis berarti sesuatu yang hendak disampaikan.
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: kepada Tuanku
  rationale: Ungkapan harfiah ‘di telinga Tuanku’ adalah idiom Ibrani bagi perkataan yang disampaikan supaya didengar. Terjemahan utama memakai ungkapan Indonesia yang alami, dengan bentuk harfiah dijelaskan dalam catatan.
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: Janganlah murka Tuanku menyala terhadap hambamu
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang amarah yang menyala sekaligus terdengar wajar dan khidmat dalam bahasa Indonesia.
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: sebab Tuanku seperti Firaun
  rationale: Perbandingan langsung dipertahankan tanpa memperluasnya menjadi kesetaraan mutlak; dalam konteksnya, ungkapan ini menekankan kedudukan dan kewibawaan Yusuf.
theological_decisions:
- issue: Makna perbandingan Yusuf dengan Firaun
  choice: Tuanku seperti Firaun
  alternative: Tuanku setara dengan Firaun
  rationale: Teks menyatakan perbandingan dengan כְּ, bukan secara eksplisit kesetaraan mutlak. Bentuk ‘seperti Firaun’ mempertahankan keluasan makna dan tidak menambahkan penafsiran tentang kadar kuasa Yusuf.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Tuanku’ dan ‘hambamu’ mempertahankan suasana istana serta sikap sangat hormat Yehuda. Metafora amarah yang menyala dipertahankan karena dapat dipahami dalam bahasa Indonesia.
