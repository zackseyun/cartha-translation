  verdict: revise
  source_fidelity: Terjemahan pada dasarnya menyampaikan rangkaian bersyarat, tambahan “juga,” malapetaka yang menimpa anak itu, kausatif “menurunkan,” dan tujuan ke dunia orang mati. Namun, שֵׂיבָתִי secara khusus adalah “rambut/uban putihku,” bukan terutama “aku yang sudah beruban ini”; citra metonimis Ibraninya sebaiknya dipertahankan.
  naturalness: “Kalian akan membuat aku yang sudah beruban ini turun” dapat dipahami, tetapi kurang alami dan melemahkan citra sumber. “Kalian akan menurunkan rambut putihku” adalah ungkapan Indonesia baku yang jelas dalam register naratif Alkitab.
  terminology: “Dunia orang mati” merupakan padanan deskriptif yang tepat untuk שְׁאוֹל dalam konteks ini dan tidak menyempitkannya menjadi sekadar kubur. Catatan kaki sebaiknya memakai transliterasi yang konsisten, “Sheol,” serta menyatakan “dunia orang mati” sebagai alternatif selain “kubur.”
  issues:
  - severity: medium
    issue: Metonimia שֵׂיבָתִי tidak dipertahankan secara langsung.
    rationale: Frasa “aku yang sudah beruban ini” mengalihkan fokus dari “rambut putihku/ubanku” kepada pribadi Yakub. Walaupun makna umum usia tua masih ada, gambaran khas bahasa Ibrani dapat dipertahankan dengan bahasa Indonesia yang tetap alami.
  - severity: low
    issue: Catatan kaki tentang שְׁאוֹל terlalu menyempitkan alternatif leksikal.
    rationale: Catatan hanya menyebut “kubur,” sedangkan istilah itu juga dapat dipahami sebagai “dunia orang mati.” Karena teks utama memakai padanan tersebut, catatan yang lengkap membantu pembaca tanpa memaksakan pengertian teologis tertentu.
