  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: id
  text: Jika kalian juga mengambil anak ini dari sisiku dan ia tertimpa malapetaka, kalian akan menurunkan rambut putihku ke dunia orang mati[a] dalam kesusahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Sheol; dapat juga diterjemahkan “kubur” atau “dunia orang mati.”'
    reason: Menjelaskan istilah שְׁאוֹל serta mempertahankan alternatif leksikalnya tanpa menyempitkan maknanya.
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם
  choice: Jika kalian juga mengambil
  rationale: Waw dengan bentuk perfektum melanjutkan rangkaian bersyarat dalam ucapan Yakub; “jika” menyatakan hubungan itu secara alami, sedangkan גַּם dipertahankan sebagai “juga.”
- source_word: אֶת זֶה מֵעִם פָּנַי
  choice: anak ini dari sisiku
  rationale: “Anak ini” memperjelas rujukan demonstratif kepada Benyamin tanpa menyebut namanya, dan “dari sisiku” mempertahankan nuansa kepergian dari hadapan atau keberadaan Yakub.
- source_word: וְקָרָהוּ אָסוֹן
  choice: lalu ia ditimpa malapetaka
  rationale: Ungkapan ini menyatakan bahwa suatu kecelakaan atau bencana serius menimpa Benyamin; “ditimpa malapetaka” alami dan cukup kuat tanpa menentukan bentuk bahayanya.
- source_word: וְהוֹרַדְתֶּם
  choice: kalian akan membuat ... turun
  rationale: Bentuk Hifil dari ירד bersifat kausatif; susunan ini mempertahankan gambaran bahwa tindakan anak-anak Yakub menyebabkan ia turun ke tempat orang mati.
- source_word: שֵׂיבָתִי
  choice: aku yang sudah beruban ini
  rationale: Secara harfiah berarti “uban/rambut putihku,” sebuah metonimia untuk diri Yakub dalam usia tua. Ungkapan ini mempertahankan citra Ibrani sambil terdengar wajar dalam bahasa Indonesia.
- source_word: בְּרָעָה
  choice: dalam kesusahan
  rationale: Dalam konteks ini רָעָה menunjuk pada keadaan sengsara atau penuh dukacita, bukan kejahatan moral. “Kesusahan” mempertahankan cakupan yang cukup luas.
- source_word: שְׁאֹלָה
  choice: ke dunia orang mati
  rationale: שְׁאוֹל menunjuk pada ranah orang mati dan tidak harus terbatas pada liang kubur. Terjemahan deskriptif ini mudah dipahami pembaca Indonesia, sedangkan istilah Ibraninya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: dunia orang mati
  alternative: Syeol; kubur
  rationale: “Dunia orang mati” mempertahankan cakupan konseptual istilah Ibrani tanpa menyamakannya secara sempit dengan kubur fisik atau memasukkan pengertian teologis yang berkembang kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” sesuai dengan pihak yang dituju Yakub. Citra turun menuju ranah orang mati dan gambaran uban dipertahankan tanpa kekakuan harfiah.
