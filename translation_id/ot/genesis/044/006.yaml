  text: Ia menyusul mereka dan mengucapkan kata-kata ini kepada mereka:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menyusul mereka dan berbicara kepada mereka dengan kata-kata ini.”
