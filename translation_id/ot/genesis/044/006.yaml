lexical_decisions:
- source_word: וַיַּשִּׂגֵם
  choice: Ia menyusul mereka
  rationale: Bentuk Hifil wayyiqtol dengan sufiks orang ketiga jamak menyatakan bahwa hamba Yusuf berhasil mencapai saudara-saudara itu dalam pengejaran. “Menyusul” alami dalam bahasa Indonesia dan sesuai dengan konteks perjalanan.
- source_word: וַיְדַבֵּר
  choice: dan menyampaikan
  rationale: דבר berarti berbicara. Karena diikuti objek langsung “perkataan-perkataan ini,” “menyampaikan” menghasilkan ungkapan Indonesia yang wajar sambil mempertahankan gagasan bahwa pesan tertentu diucapkan kepada mereka.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל menunjukkan arah ujaran kepada saudara-saudara itu; “kepada mereka” merupakan padanan langsung dan alami.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: Secara harfiah berarti “perkataan-perkataan ini” dan memperkenalkan ucapan yang segera menyusul. Pilihan ini mempertahankan bentuk konkret bahasa Ibrani tanpa mengubahnya menjadi “hal-hal ini.”
