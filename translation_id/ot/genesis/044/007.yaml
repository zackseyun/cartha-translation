base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Mengapa tuanku[a] mengucapkan kata-kata seperti itu[b]? Tidak mungkin hamba-hambamu melakukan hal semacam itu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “majikanku,” sebagai sapaan penuh hormat kepada seorang manusia.
    reason: lexical_alternative
  - marker: b
    text: Atau “perkataan seperti itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Mereka berkata kepadanya
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan narasi dan memperkenalkan jawaban langsung; אֵלָיו diterjemahkan secara lugas sebagai “kepadanya” tanpa memperjelas rujukan yang tidak disebut dalam ayat.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya sebab diterjemahkan langsung dan alami.
- source_word: יְדַבֵּר
  choice: mengucapkan
  rationale: Dalam konstruksi dengan “kata-kata seperti itu,” “mengucapkan” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan tindakan verbal yang dinyatakan oleh דבר.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada manusia dengan akhiran orang pertama tunggal; “tuanku” mempertahankan sikap takzim tanpa memberi makna ilahi.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: kata-kata seperti itu
  rationale: Terjemahan ini mempertahankan unsur “kata-kata” dan daya banding prefiks כ, sambil memakai susunan Indonesia yang wajar.
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: Tidak mungkin hamba-hambamu
  rationale: חָלִילָה menyatakan penolakan keras terhadap kemungkinan tindakan tersebut. Ungkapan “Tidak mungkin” menyampaikan daya sangkal itu secara alami, sedangkan “hamba-hambamu” mempertahankan sebutan diri yang merendah di hadapan pejabat.
- source_word: מֵעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: melakukan hal semacam itu
  rationale: Infinitif עשׂה diterjemahkan “melakukan,” dan frasa pembanding-demonstratif diterjemahkan secara idiomatis sebagai “hal semacam itu.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan penuh hormat. “Tuanku” serta “hamba-hambamu” mempertahankan register sosial dalam dialog, sedangkan “Tidak mungkin” menyampaikan penolakan keras חָלִילָה tanpa memakai ungkapan yang mengimpor rujukan religius.
