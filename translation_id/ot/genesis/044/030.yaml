base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: id
  text: Sekarang, ketika aku datang kepada ayahku, hambamu, dan anak itu tidak bersama kami—sementara hidup ayahku terikat pada hidup anak itu—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Memperkenalkan tahap berikutnya dalam permohonan Yehuda; unsur penghubung waw terserap secara alami dalam alur bahasa Indonesia.
- source_word: כְּבֹאִי
  choice: ketika aku kembali
  rationale: Preposisi כ dengan infinitif konstruk dan akhiran orang pertama menyatakan waktu. Dalam konteks perjalanan pulang kepada Yakub, 'kembali' lebih alami daripada 'datang'.
- source_word: אֶל עַבְדְּךָ אָבִי
  choice: kepada ayahku, hambamu itu
  rationale: Menjaga baik hubungan aposisional maupun bahasa hormat Yehuda kepada Yusuf, dengan susunan yang lebih alami dalam bahasa Indonesia.
- source_word: הַנַּעַר
  choice: anak muda ini / anak itu
  rationale: נַעַר dapat menunjuk pemuda, bukan hanya anak kecil. 'Anak muda' menghindari kesan bahwa Benyamin masih kanak-kanak, sedangkan 'anak itu' pada penyebutan kedua menjaga kelancaran.
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: tidak bersama kami
  rationale: Padanan langsung dan wajar bagi ungkapan negatif eksistensial Ibrani.
- source_word: וְנַפְשׁוֹ
  choice: sedangkan hidup ayahku
  rationale: נֶפֶשׁ di sini menunjuk hidup atau diri sang ayah, bukan istilah teknis antropologis. Rujukan pronomina diperjelas agar tidak rancu dalam bahasa Indonesia.
- source_word: קְשׁוּרָה בְנַפְשׁוֹ
  choice: terikat pada hidup anak itu
  rationale: Mempertahankan metafora ikatan erat dan mengungkapkan rujukan pronomina kedua kepada Benyamin tanpa menambahkan hubungan sebab-akibat yang eksplisit.
theological_decisions:
- issue: Makna נֶפֶשׁ pada kedua kemunculannya
  choice: hidup
  alternative: jiwa
  rationale: Konteks menekankan keterikatan hidup dan batin Yakub kepada Benyamin, bukan pembedaan doktrinal antara tubuh dan jiwa.
- issue: Hubungan klausa partisipial terakhir
  choice: sedangkan hidup ayahku terikat pada hidup anak itu
  alternative: karena hidup ayahku terikat pada hidup anak itu
  rationale: Bentuk Ibrani dapat dipahami sebagai keadaan yang menyertai dan mungkin menjelaskan beratnya situasi. 'Sedangkan' mempertahankan hubungan sirkumstansial tanpa memastikan kausalitas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ayat dibiarkan berakhir dengan tanda pisah dan koma karena kalimat serta akibatnya berlanjut ke ayat berikutnya. Tidak ada catatan kaki karena ambiguitas hubungan klausa dapat dipertahankan secara memadai dalam teks utama.
