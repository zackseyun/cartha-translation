revisions:
- from: Sekarang, ketika aku kembali kepada ayahku, hambamu itu, dan anak muda ini tidak bersama kami—sedangkan hidup ayahku terikat pada hidup anak itu—
  to: Sekarang, ketika aku datang kepada ayahku, hambamu, dan anak itu tidak bersama kami—sementara hidup ayahku terikat pada hidup anak itu—
  rationale: Revisi membatasi terjemahan pada makna temporal “ketika aku datang,” memperbaiki aposisi penghormatan kepada Yusuf, dan mempertahankan klausa terakhir sebagai keadaan yang menyertai tanpa mengubahnya menjadi hubungan sebab-akibat yang tegas. Tanda pisah penutup dipertahankan karena sintaks kalimat berlanjut ke ayat berikutnya.
