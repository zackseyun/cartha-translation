  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: id
  text: Lalu kami berkata kepada tuanku[a], ‘Anak muda itu tidak dapat meninggalkan ayahnya, sebab jika ia meninggalkan ayahnya, ayahnya akan mati.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan ia meninggalkan ayahnya, dan ia mati.” Bahasa Ibrani tidak menyatakan secara eksplisit siapa yang mati; konteks menunjukkan bahwa yang dimaksud ialah sang ayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Lalu kami berkata
  rationale: Bentuk wayyiqtol orang pertama jamak melanjutkan urutan narasi; “lalu” menyatakan kesinambungan secara alami tanpa memberi hubungan yang terlalu khusus.
- source_word: אֶל אֲדֹנִי
  choice: kepada tuanku
  rationale: אֲדֹנִי merupakan sapaan hormat kepada Yusuf dalam suasana resmi; “tuanku” mempertahankan nada takzim tanpa harus memakai “majikanku”.
- source_word: לֹא יוּכַל
  choice: tidak dapat
  rationale: יכל menyatakan kemampuan; “tidak dapat” merupakan padanan Indonesia baku dan alami.
- source_word: הַנַּעַר
  choice: anak muda itu
  rationale: נַעַר dapat menunjuk anak lelaki atau pemuda. “Anak muda itu” mempertahankan keluasan maknanya dan tetap sesuai dengan cara Yehuda menggambarkan ketergantungan Benyamin kepada ayahnya.
- source_word: לַעֲזֹב
  choice: meninggalkan
  rationale: עזב di sini berarti pergi dengan meninggalkan seseorang, bukan dengan sendirinya tindakan menelantarkan secara moral.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Konstruksi milik ini diterjemahkan secara langsung; pengulangannya dipertahankan sesuai teks Ibrani.
- source_word: וְעָזַב
  choice: Jika ia meninggalkan
  rationale: Walaupun secara bentuk berarti “dan ia meninggalkan,” dalam konteks ini klausa tersebut menyatakan keadaan bersyarat; “jika” mengungkapkan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: וָמֵת
  choice: ayahnya akan mati
  rationale: Subjek verba orang ketiga maskulin tunggal tidak dinyatakan secara eksplisit. Konteks yang lebih luas paling kuat menunjuk kepada sang ayah; subjek dibuat eksplisit dalam teks demi kejelasan, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek tersirat pada וָמֵת (“akan mati”)
  choice: ayahnya akan mati
  alternative: ia akan mati
  rationale: Bahasa Ibrani tidak menyebutkan subjek dengan nomina, sehingga secara tata bahasa dapat terasa ambigu. Namun Kejadian 44:30–31 secara eksplisit menyatakan bahwa ayahlah yang akan mati jika Benyamin tidak kembali. Ambiguitas formal tetap diberitahukan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Tuanku” mempertahankan kesantunan resmi, sedangkan “anak muda itu” menghindari kesan bahwa Benyamin pasti masih anak kecil. Klausa pendek dipakai agar tuturan langsung tetap jelas dan alami.
