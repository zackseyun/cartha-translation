  yaml_path: translation/ot/genesis/044/003.yaml
  text: As soon as the morning was light[a], the men were sent away, they and their donkeys.
translation:
  language: id
  text: Ketika pagi sudah terang[a], orang-orang itu dikirim pergi, mereka dan keledai-keledai mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika fajar menyingsing” atau “Begitu hari menjadi terang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֹּקֶר
  choice: pagi
  rationale: Nomina tentu ini menunjuk pada waktu pagi; dalam klausa temporal bahasa Indonesia, “pagi” sudah alami tanpa perlu menerjemahkan artikelnya secara tersendiri.
- source_word: אוֹר
  choice: menjadi terang
  rationale: Verba אור menyatakan munculnya terang. “Menjadi terang” mempertahankan daya verbal teks sumber dan lebih dekat daripada hanya memakai nomina “fajar”.
- source_word: וְהָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Bentuk jamak tentu dari אִישׁ merujuk kembali kepada kelompok yang sudah dikenal dalam konteks. “Orang-orang itu” lebih alami dan tepat daripada “para pria” dalam narasi ini.
- source_word: שֻׁלְּחוּ
  choice: disuruh pergi
  rationale: Bentuk Pual pasif dari שלח menyatakan bahwa mereka dilepas atau diperintahkan berangkat. “Disuruh pergi” mempertahankan bentuk pasif sekaligus menyampaikan keberangkatan dalam konteks.
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina mandiri ini tampil secara aposisional bersama keledai-keledai mereka; “mereka” mempertahankan pengelompokan yang eksplisit dalam bahasa Ibrani.
- source_word: וַחֲמֹרֵיהֶם
  choice: beserta keledai-keledai mereka
  rationale: Bentuk jamak dengan sufiks orang ketiga jamak berarti “keledai-keledai mereka”. “Beserta” menyampaikan bahwa manusia dan hewannya sama-sama diberangkatkan, sambil menghasilkan bahasa Indonesia yang alami.
