  verdict: revise
  source_fidelity: Teks Ibrani menyatakan bahwa pagi telah terang, lalu orang-orang itu dikirim pergi, mereka dan keledai-keledai mereka. Draf menangkap urutan dan kelompok yang dimaksud, tetapi “disuruh pergi” dapat menyiratkan perintah lisan dan kurang tepat untuk bentuk pasif שֻׁלְּחוּ, yang lebih langsung berarti “dikirim pergi” atau “diberangkatkan.”
  naturalness: “Begitu pagi menjadi terang” tidak lazim dalam bahasa Indonesia baku. “Ketika pagi sudah terang” merupakan ungkapan naratif yang alami dan menyampaikan idiom Ibrani tanpa membuat seolah-olah “pagi” sendiri mengalami perubahan fisik.
  terminology: “Orang-orang itu” tepat untuk הָאֲנָשִׁים dalam konteks ini. “Keledai-keledai mereka” mempertahankan bentuk jamak dan kepemilikan. “Dikirim pergi” mempertahankan pasif sumber secara netral, tanpa menambahkan nuansa perintah.
