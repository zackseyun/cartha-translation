translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Susunan pembuka mempertahankan gambaran Ibrani tentang pagi yang menjadi terang, sedangkan “beserta” menghindari konstruksi aposisional yang kaku tanpa mengubah kelompok yang diberangkatkan.
