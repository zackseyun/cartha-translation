base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: id
  text: Aku berkuasa mencelakakan kalian. Namun, tadi malam Allah ayah kalian berfirman kepadaku, ‘Berhati-hatilah, jangan berbicara dengan Yakub, entah baik entah buruk.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari yang baik sampai yang buruk.” Ini adalah ungkapan yang mencakup seluruh rentang, baik yang menguntungkan maupun yang merugikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: Aku berkuasa
  rationale: Ungkapan Ibrani ini menyatakan bahwa sesuatu berada dalam kemampuan atau kuasa pembicara. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: mencelakakan kalian
  rationale: רָע dalam konteks ini menunjuk pada tindakan yang merugikan atau mencederai pihak yang disapa; 'mencelakakan' menyampaikan ancaman itu secara wajar.
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: Namun, ... Allah ayahmu
  rationale: Konjungsi ו berfungsi kontras dalam konteks ini. 'Allah ayahmu' mempertahankan acuan tunggal kepada ayah Yakub, sedangkan bentuk pronomina Ibrani yang plural mencerminkan kelompok yang sedang dihadapi Laban.
- source_word: אֶמֶשׁ
  choice: tadi malam
  rationale: Kata ini dalam konteks narasi menunjuk pada malam yang baru berlalu; 'tadi malam' merupakan padanan Indonesia yang alami.
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Imperatif ini merupakan peringatan tegas agar Laban menjaga diri dari tindakan tertentu.
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: jangan mengatakan apa pun kepada Yakub
  rationale: Konstruksi הִשָּׁמֶר dengan מִן menyatakan larangan. Penambahan 'apa pun' mengungkapkan cakupan idiom polar yang langsung mengikutinya.
- source_word: מִטּוֹב עַד רָע
  choice: baik ataupun buruk
  rationale: Terjemahan ini mempertahankan pasangan polar Ibrani sambil membuat jelas bahwa larangan itu mencakup segala perkataan kepada Yakub.
theological_decisions:
- issue: Penyebutan אֱלֹהִים yang berbicara kepada Laban
  choice: Allah ayahmu
  alternative: Allah leluhurmu
  rationale: Bentuk konstruk אַבִיכֶם secara morfologis memuat pronomina jamak, tetapi konteks ujaran berpusat pada Yakub dan ayahnya. Terjemahan tunggal mempertahankan acuan naratif tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kalian' mencerminkan pronomina jamak dalam ancaman awal, sedangkan 'ayahmu' dan perintah berikutnya mengikuti fokus tunggal pada Yakub. Penanda catatan kaki ditempatkan setelah kutipan yang dijelaskannya.
