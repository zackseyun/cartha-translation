  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: id
  text: Kemudian Yakub berkata kepada saudara-saudaranya[a], “Kumpulkanlah batu-batu.” Mereka pun mengambil batu-batu dan membuat sebuah tumpukan. Lalu mereka makan di sana, di dekat tumpukan itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Saudara-saudaranya” di sini dapat berarti lebih luas, yaitu kerabat laki-laki atau orang-orang yang menyertai Yakub, bukan hanya saudara kandungnya.
    reason: cultural_note
  - marker: b
    text: Atau “di atas tumpukan itu.” Preposisi Ibrani yang dipakai di sini secara lebih harfiah dapat berarti “di atas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Kata אָח pada dasarnya berarti ‘saudara laki-laki’, tetapi dapat mencakup kerabat laki-laki atau rekan dekat. Terjemahan utama mempertahankan ungkapan yang dekat dengan bentuk Ibrani, sedangkan cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: לִקְטוּ
  choice: Kumpulkanlah
  rationale: Bentuk perintah dari לקט berarti memungut atau mengumpulkan. ‘Kumpulkanlah’ alami dalam bahasa Indonesia dan sesuai dengan tindakan menghimpun batu.
- source_word: אֲבָנִים
  choice: batu-batu
  rationale: אֶבֶן adalah kata umum untuk batu. Bentuk ulang menyampaikan jamak Ibrani secara jelas dan wajar.
- source_word: וַיַּעֲשׂוּ גָל
  choice: membuat sebuah tumpukan
  rationale: גַּל menunjuk pada tumpukan, khususnya tumpukan batu dalam konteks ini. ‘Tumpukan’ mudah dipahami dan tidak menambahkan bentuk bangunan yang tidak dinyatakan teks.
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: mereka makan di sana, di dekat tumpukan itu
  rationale: Preposisi עַל dapat berarti ‘di atas’ maupun, sesuai konteks, ‘di dekat/di sisi’. ‘Di dekat’ menghasilkan gambaran yang wajar tanpa menutup kemungkinan pembacaan yang lebih harfiah, yang dicantumkan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. Partikel ‘pun’ dan ‘lalu’ memperjelas urutan tindakan tanpa menambah isi substantif. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
