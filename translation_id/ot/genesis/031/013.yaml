  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: id
  text: Akulah Allah di Betel[a], tempat engkau mengurapi sebuah tugu batu dan di sana engkau bernazar kepada-Ku. Sekarang, bangkitlah, keluarlah dari negeri ini, dan kembalilah ke negeri kelahiranmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel berarti “rumah Allah”; di sini Betel adalah nama tempat.
    reason: cultural_note
lexical_decisions:
- source_word: אָנֹכִי הָאֵל בֵּית אֵל
  choice: Akulah Allah Betel
  rationale: Bentuk אָנֹכִי memberi penegasan pada identitas pembicara. הָאֵל dengan artikel menunjuk kepada Allah, sedangkan בֵּית אֵל dipahami sebagai nama tempat Betel. Rumusan ini mempertahankan konstruksi ringkas dan kemungkinan nuansa hubungan Allah dengan tempat perjumpaan Yakub.
- source_word: מָשַׁחְתָּ שָׁם מַצֵּבָה
  choice: tempat engkau mengurapi sebuah tugu batu
  rationale: מָשַׁח berarti 'mengurapi', sementara מַצֵּבָה adalah batu yang didirikan. 'Tugu batu' lebih konkret dan mudah dipahami daripada sekadar 'tiang', tanpa menambahkan fungsi keagamaan yang tidak dinyatakan langsung.
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: dan mengucapkan nazar kepada-Ku
  rationale: Ibrani memakai verba dan nomina seakar untuk penegasan. Bahasa Indonesia alami menyatakannya dengan 'mengucapkan nazar'; tujuan nazar kepada Allah dipertahankan melalui 'kepada-Ku'.
- source_word: עַתָּה קוּם
  choice: Sekarang, bangkitlah
  rationale: עַתָּה menandai peralihan menuju perintah. קוּם adalah imperatif untuk bangun atau bersiap bergerak; 'bangkitlah' sesuai dengan ragam bahasa yang luhur namun tetap modern.
- source_word: צֵא מִן הָאָרֶץ הַזֹּאת
  choice: keluarlah dari negeri ini
  rationale: Terjemahan ini mempertahankan gambaran harfiah verba 'keluar' dan preposisi 'dari'. אֶרֶץ dalam konteks ini menunjuk wilayah tempat Yakub tinggal, sehingga diterjemahkan 'negeri'.
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: dan kembalilah ke negeri kelahiranmu
  rationale: שׁוּב dalam konteks perjalanan berarti kembali. מוֹלֶדֶת dapat merujuk asal kelahiran, negeri asal, atau lingkungan kerabat; 'negeri kelahiranmu' mempertahankan kaitan dengan asal-usul tanpa mempersempitnya hanya kepada kerabat.
theological_decisions:
- issue: Identifikasi diri pembicara sebagai הָאֵל בֵּית אֵל
  choice: Akulah Allah Betel
  alternative: Akulah Allah di Betel
  rationale: Konstruksi ini lazim dipahami sebagai 'Allah Betel', yakni Allah yang menyatakan diri kepada Yakub di sana. Terjemahan tidak menjadikannya dewa lokal, tetapi juga tidak menambahkan klausa penjelas yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan imperatif dipertahankan untuk mencerminkan daya perintah teks Ibrani. Pengulangan kata שָׁם ('di sana') diungkapkan secara alami melalui 'tempat' yang menaungi kedua tindakan.
