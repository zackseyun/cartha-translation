  - severity: low
    issue: ‘Allah Betel’ kurang idiomatis dalam bahasa Indonesia modern dan dapat terbaca sebagai nama atau gelar yang tidak jelas.
    rationale: ‘Allah di Betel’ menyampaikan konstruksi sumber secara lebih jelas, tanpa menambahkan penafsiran seperti ‘yang menampakkan diri kepadamu’.
