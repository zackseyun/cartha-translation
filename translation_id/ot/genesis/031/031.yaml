  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: id
  text: Lalu Yakub menjawab dan berkata kepada Laban, “Sebab aku takut, sebab aku berkata dalam hati, ‘Jangan-jangan engkau merampas anak-anak perempuanmu dariku.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: menjawab
  rationale: Dalam formula dialog Ibrani, kedua verba bersama-sama memperkenalkan jawaban. Bahasa Indonesia alami cukup memakai “menjawab” tanpa menggandakan “menjawab dan berkata”.
- source_word: כִּי יָרֵאתִי
  choice: Aku pergi karena aku takut
  rationale: כִּי memberi alasan bagi tindakan Yakub dalam konteks sebelumnya. Penambahan tersirat “Aku pergi” membuat jawaban eliptis itu jelas dan alami tanpa mengubah alasannya.
- source_word: כִּי אָמַרְתִּי
  choice: Sebab aku berkata dalam hati
  rationale: אמר secara harfiah berarti “berkata”, tetapi di sini menunjuk pada ujaran batin. “Berkata dalam hati” mempertahankan citra sumber sekaligus menyampaikan maksud secara alami.
- source_word: פֶּן
  choice: Jangan-jangan
  rationale: Mengungkapkan kekhawatiran terhadap kemungkinan yang tidak diinginkan secara wajar dalam bahasa Indonesia modern.
- source_word: תִּגְזֹל
  choice: merampas
  rationale: גזל menyatakan pengambilan secara salah atau dengan kekerasan; “merampas” mempertahankan daya leksikal itu lebih baik daripada sekadar “mengambil”.
- source_word: אֶת־בְּנוֹתֶיךָ מֵעִמִּי
  choice: anak-anak perempuanmu dariku
  rationale: Terjemahan langsung dan alami yang mempertahankan hubungan keluarga serta gagasan pemisahan dari Yakub.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dialog dibuat alami; kekuatan verba גזל dipertahankan dalam teks utama melalui “merampas”, sehingga tidak diperlukan catatan kaki.
