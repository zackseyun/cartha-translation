  source_fidelity: Teks Ibrani dengan setia menyatakan bahwa Rahel dan Lea menjawab Yakub dan mempertanyakan apakah mereka masih memiliki חלק dan נחלה dalam 'rumah ayah kami'. Draf mempertahankan subjek jamak, penerima ujaran, nuansa 'masih', serta dua istilah hak milik. Namun, 'keluarga ayah kami' mempersempit בֵּית terutama menjadi kekerabatan dan tidak secara langsung mencerminkan ungkapan 'rumah ayah kami', yang dalam konteks ini mencakup rumah tangga dan lingkungan harta keluarga.
  naturalness: Kalimatnya sudah baku dan mudah dipahami. 'Di rumah ayah kami' tetap alami dalam ragam Alkitab Indonesia; catatan kaki dapat menjelaskan cakupan sosial-ekonominya tanpa menggantikan citra sumber dalam teks utama.
  terminology: Nama 'Rahel' dan 'Lea' sesuai pemakaian Indonesia yang lazim. 'Bagian' dan 'warisan' tepat untuk חֵלֶק dan נַחֲלָה. Alternatif 'jatah' dapat dipertahankan sebagai keterangan leksikal, meskipun bernuansa lebih percakapan.
