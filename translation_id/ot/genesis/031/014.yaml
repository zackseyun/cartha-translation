  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: id
  text: Lalu Rahel dan Lea menjawab dan berkata kepadanya, “Apakah kami masih mempunyai bagian[a] dan warisan di rumah ayah kami[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jatah.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di rumah ayah kami.” Ungkapan ini dapat mencakup rumah tangga, keluarga, dan harta keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן
  choice: Lalu ... menjawab
  rationale: Bentuk naratif dengan waw memajukan alur dan menunjukkan tanggapan; “Lalu ... menjawab” alami dalam bahasa Indonesia.
- source_word: רָחֵל וְלֵאָה
  choice: Rahel dan Lea
  rationale: Nama-nama ditulis menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַתֹּאמַרְנָה לוֹ
  choice: dan berkata kepadanya
  rationale: Mempertahankan verba ujaran jamak serta objek tak langsung eksplisit yang menunjuk kepada Yakub.
- source_word: הַעוֹד לָנוּ
  choice: Apakah kami masih mempunyai
  rationale: Ungkapan kepemilikan ini alami dalam bahasa Indonesia dan mempertahankan nuansa keberlanjutan pada עוֹד.
- source_word: חֵלֶק
  choice: bagian
  rationale: Dalam konteks harta keluarga, “bagian” menyatakan jatah atau porsi yang menjadi hak seseorang.
- source_word: וְנַחֲלָה
  choice: dan warisan
  rationale: “Warisan” tepat menyampaikan harta atau milik turun-temurun dalam sengketa keluarga ini.
- source_word: בְּבֵית אָבִינוּ
  choice: dalam keluarga ayah kami
  rationale: בֵּית dapat menunjuk rumah tangga, keluarga, atau lingkup harta keluarga, bukan hanya bangunan fisik; “keluarga ayah kami” paling alami dalam konteks pertanyaan mengenai hak waris.
