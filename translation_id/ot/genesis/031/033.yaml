  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: id
  text: Laban pun masuk ke kemah Yakub, ke kemah Lea, dan ke kemah kedua hamba perempuan itu, tetapi ia tidak menemukannya.[a] Kemudian ia keluar dari kemah Lea dan masuk ke kemah Rahel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, objek dari kata “menemukan” tidak disebutkan; berdasarkan konteks, yang dimaksud adalah dewa-dewa rumah tangga yang dicari Laban.
    reason: Objek tersirat dalam teks sumber dan perlu dijelaskan tanpa menghapus ambiguitas gramatikalnya dari ayat.
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: masuk ke kemah
  rationale: Kata kerja בוא dengan בְּ menyatakan gerakan masuk ke suatu tempat. Ungkapan “masuk ke” alami dalam narasi Indonesia dan mempertahankan arah geraknya.
- source_word: אֹהֶל
  choice: kemah
  rationale: Makna biasa אֹהֶל adalah kemah. Istilah konkret ini sesuai dengan latar para leluhur dan tidak perlu digeneralisasi menjadi “tempat tinggal”.
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: kedua hamba perempuan itu
  rationale: אָמָה menunjuk kepada hamba perempuan dalam suatu rumah tangga. Pilihan ini jelas dalam bahasa Indonesia modern sekaligus mempertahankan status dan jenis kelamin yang dinyatakan teks.
- source_word: וְלֹא מָצָא
  choice: tetapi ia tidak menemukannya
  rationale: Objek kata kerja tidak disebutkan dalam bahasa Ibrani, tetapi konteks merujuk kepada benda yang dicari Laban. Akhiran “-nya” membuat kalimat Indonesia wajar tanpa menyebut secara eksplisit apa bendanya; catatan kaki mempertahankan informasi bahwa objek itu tersirat.
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: Kemudian ia keluar dari kemah Lea
  rationale: יצא berarti keluar. “Kemudian” menyampaikan urutan naratif yang ditandai waw-konsekutif secara alami.
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: dan masuk ke kemah Rahel
  rationale: Terjemahan ini mengulangi padanan untuk gerak masuk dan mempertahankan urutan penggeledahan antarkemah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan “ke kemah” dipertahankan untuk mencerminkan pencarian yang berlangsung dari satu kemah ke kemah lain. Partikel “pun” menandai kelanjutan tindakan secara wajar tanpa menambah isi.
