  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: id
  text: Bukankah kami dianggapnya sebagai orang asing? Sebab ia telah menjual kami dan bahkan telah menghabiskan seluruh uang kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bahkan benar-benar memakan perak kami.” Bahasa Ibrani memakai ungkapan “memakan” dengan bentuk penegas untuk menyatakan bahwa semuanya telah dihabiskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  choice: Bukankah
  rationale: Memperkenalkan pertanyaan retoris yang mengharapkan jawaban ya dan terdengar alami dalam bahasa Indonesia.
- source_word: נָכְרִיּוֹת
  choice: orang asing
  rationale: Menunjukkan bahwa kedua anak perempuan itu diperlakukan sebagai pihak luar, bukan sebagai anggota keluarga; bentuk feminin Ibrani tidak perlu ditandai secara khusus dalam konteks Indonesia.
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: kami dianggapnya
  rationale: Mempertahankan makna pasif Niphal, yaitu dipandang atau diperhitungkan olehnya, dalam susunan Indonesia yang ringkas.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendasari pertanyaan retoris sebelumnya.
- source_word: מְכָרָנוּ
  choice: ia telah menjual kami
  rationale: Menyatakan tindakan yang telah selesai tetapi tetap relevan dengan keluhan para perempuan itu.
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: dan bahkan telah menghabiskan seluruh
  rationale: Mengungkapkan penegasan dari גַּם dan infinitif absolut serta hasil berupa konsumsi sampai habis; metafora harfiah 'memakan' dicatat dalam catatan kaki.
- source_word: אֶת כַּסְפֵּנוּ
  choice: uang kami
  rationale: כֶּסֶף dapat berarti perak atau uang; dalam konteks ekonomi dan mas kawin, 'uang kami' paling jelas dan alami.
