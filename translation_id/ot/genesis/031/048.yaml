  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: id
  text: Lalu Laban berkata, “Tumpukan batu ini adalah saksi antara aku dan engkau pada hari ini.” Karena itu, ia menamainya Galed.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Galed berarti “tumpukan kesaksian” dalam bahasa Ibrani.
    reason: Menjelaskan permainan kata dan makna nama גַּלְעֵד, yang dibentuk dari גַּל (“tumpukan”) dan עֵד (“saksi/kesaksian”).
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan naratif secara alami dalam bahasa Indonesia tanpa mempertegas hubungan waktu secara berlebihan.
- source_word: לָבָן
  choice: Laban
  rationale: Nama orang ditransliterasikan dalam bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: הַגַּל הַזֶּה
  choice: tumpukan batu ini
  rationale: גַּל berarti tumpukan; konteks ayat-ayat sekitar menunjukkan bahwa yang dimaksud ialah tumpukan batu, sehingga unsur “batu” dibuat eksplisit agar jelas dan alami.
- source_word: עֵד
  choice: menjadi saksi
  rationale: Tumpukan batu berfungsi sebagai penanda kesaksian antara kedua pihak; ungkapan ini mempertahankan gambaran hukum-perjanjian dalam teks.
- source_word: בֵּינִי וּבֵינְךָ
  choice: antara aku dan engkau
  rationale: Terjemahan ini mempertahankan penyebutan kedua pihak secara langsung dan bentuk orang kedua tunggal dalam bahasa Ibrani.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan yang alami dan bermartabat untuk keterangan waktu tersebut.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Formula ini memperkenalkan alasan pemberian nama dan menyatakan hubungan sebab secara ringkas.
- source_word: קָרָא שְׁמוֹ
  choice: ia menamainya
  rationale: Ungkapan penamaan Ibrani diterjemahkan secara idiomatis; subjek verba maskulin tunggal dibiarkan sebagai “ia” karena konteks terdekat menunjuk kepada Laban, meski subjek tidak disebut ulang.
- source_word: גַּלְעֵד
  choice: Galed
  rationale: Nama ini ditransliterasikan, bukan diterjemahkan, sedangkan permainan katanya dengan גַּל dan עֵד dijelaskan dalam catatan kaki.
