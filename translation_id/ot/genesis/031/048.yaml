translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang jelas dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan tunggal langsung; “tumpukan batu” dipilih agar objek konkret dalam konteks mudah dipahami.
