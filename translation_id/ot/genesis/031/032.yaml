    text: “Saudara-saudara” di sini dapat mencakup kerabat laki-laki atau anggota rombongan yang hadir, bukan hanya saudara kandung.
    reason: cultural_note
  - marker: c
    text: Yang dimaksud ialah dewa-dewa rumah tangga milik Laban.
    reason: contextual_clarification
  revision_rationale: Revisi menghilangkan tambahan makna yang tidak dinyatakan dalam bahasa Ibrani, sambil mempertahankan gaya Indonesia modern, kekuatan ujaran Yakub, dan kejelasan rujukan jamak. Penempatan ulang jangkar catatan c membuat klarifikasinya langsung merujuk pada “dewa-dewamu.”
