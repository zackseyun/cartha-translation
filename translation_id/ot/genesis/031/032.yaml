revisions:
- from: Siapa pun yang padanya kautemukan dewa-dewamu tidak akan dibiarkan hidup.[a] Di hadapan saudara-saudara kita,[b] kenalilah apa milikmu yang ada padaku, lalu ambillah kembali.” Yakub tidak tahu bahwa Rahellah yang telah mencuri dewa-dewa itu.[c]
  to: Siapa pun yang padanya kautemukan dewa-dewamu[c] tidak akan hidup.[a] Di hadapan saudara-saudara kita,[b] kenalilah apa milikmu yang ada padaku, lalu ambillah.” Yakub tidak tahu bahwa Rahel telah mencurinya.
  rationale: Revisi menghilangkan tambahan makna yang tidak dinyatakan dalam bahasa Ibrani, sambil mempertahankan gaya Indonesia modern, kekuatan ujaran Yakub, dan kejelasan rujukan jamak. Penempatan ulang jangkar catatan c membuat klarifikasinya langsung merujuk pada “dewa-dewamu.”
