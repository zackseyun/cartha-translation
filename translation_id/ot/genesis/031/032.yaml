  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: id
  text: Siapa pun yang padanya kautemukan dewa-dewamu[c] tidak akan hidup.[a] Di hadapan saudara-saudara kita,[b] kenalilah apa milikmu yang ada padaku, lalu ambillah.” Yakub tidak tahu bahwa Rahel telah mencurinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Orang yang padanya kautemukan dewa-dewamu tidak akan hidup.”'
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” di sini dapat mencakup kerabat laki-laki atau anggota rombongan yang hadir, bukan hanya saudara kandung.
    reason: cultural_note
  - marker: c
    text: Yang dimaksud ialah dewa-dewa rumah tangga milik Laban.
    reason: contextual_clarification
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: Siapa pun yang padanya kautemukan
  rationale: Mempertahankan konstruksi orang tak tentu dan bentuk aktif orang kedua tunggal dalam bahasa Ibrani, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: אֱלֹהֶיךָ
  choice: dewa-dewamu
  rationale: Menerjemahkan bentuk jamak secara langsung tanpa menggantinya dengan istilah kontekstual 'dewa-dewa rumah tangga' yang tidak muncul dalam klausa ini.
- source_word: לֹא יִחְיֶה
  choice: tidak akan dibiarkan hidup
  rationale: Mengungkapkan daya hukuman mati dari rumusan Ibrani tanpa menjadikannya sekadar ramalan bahwa orang itu akan mati.
- source_word: נֶגֶד אַחֵינוּ
  choice: Di hadapan saudara-saudara kita
  rationale: Mencerminkan arti harfiah 'di hadapan saudara-saudara kita'; catatan menjelaskan bahwa cakupannya dapat lebih luas daripada saudara kandung.
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: kenalilah apa milikmu yang ada padaku
  rationale: Kata kerja imperatif meminta Laban mengenali atau memastikan barang miliknya; unsur kepemilikan yang eliptis dijelaskan secara alami dari konteks.
- source_word: וְקַח לָךְ
  choice: lalu ambillah kembali
  rationale: '''Ambillah kembali'' menyampaikan bahwa Laban boleh mengambil barang miliknya; ''lalu'' mengalirkan urutan perintah dengan alami.'
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: Yakub tidak tahu
  rationale: Menyajikan keterangan narator secara lugas; konjungsi awal tidak perlu dinyatakan dalam bahasa Indonesia.
- source_word: כִּי רָחֵל גְּנָבָתַם
  choice: bahwa Rahellah yang telah mencuri dewa-dewa itu
  rationale: Partikel -lah menandai fokus pada Rahel, bentuk 'telah mencuri' menunjukkan tindakan yang mendahului ketidaktahuan Yakub, dan objek jamak diperjelas secara alami.
theological_decisions:
- issue: Daya ungkapan לֹא יִחְיֶה
  choice: tidak akan dibiarkan hidup
  alternative: tidak akan hidup
  rationale: Pilihan ini mempertahankan bobot vonis atau ancaman hukuman mati dalam konteks, tanpa menentukan secara sempit apakah ungkapan itu merupakan keputusan hukum, sumpah, atau kutukan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kautemukan' serta 'padaku' mempertahankan kekompakan tuturan langsung. 'Dewa-dewa' dipilih alih-alih 'allah-allah' agar jelas bahwa yang dimaksud ialah ilah milik Laban, sementara catatan kaki memberi penjelasan kontekstual tentang dewa rumah tangga.
