  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: id
  text: Laban telah pergi untuk mencukur bulu kawanan ternaknya, lalu Rahel mencuri berhala-berhala rumah tangga[a] milik ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: terafim; juga dapat diterjemahkan “dewa-dewa rumah tangga.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: telah pergi
  rationale: Bentuk qatal memberi informasi latar sebelum tindakan utama; “telah pergi” menunjukkan bahwa Laban sudah tidak berada di tempat ketika Rahel bertindak.
- source_word: לִגְזֹז
  choice: untuk menggunting bulu
  rationale: Dalam konteks kawanan ternak, verba ini secara khusus berarti mencukur atau menggunting bulu domba; ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: צֹאנוֹ
  choice: kawanan ternaknya
  rationale: צֹאן menunjuk secara kolektif pada ternak kecil, terutama domba dan kambing; “kawanan ternaknya” mempertahankan cakupan itu.
- source_word: וַתִּגְנֹב
  choice: lalu ... mencuri
  rationale: גנב berarti “mencuri” dan tidak perlu diperhalus; “lalu” menyampaikan kelanjutan naratif dari waw-konsekutif.
- source_word: הַתְּרָפִים
  choice: berhala-berhala rumah tangga
  rationale: Istilah ini menunjuk pada benda-benda pemujaan domestik. Terjemahan ini menyampaikan lingkungan rumah tangga dan fungsi keagamaannya, sementara istilah Ibraninya dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: milik ayahnya
  rationale: Frasa ini menyatakan kepemilikan; bentuk Indonesia ini ringkas dan alami.
- source_word: וְ
  choice: tidak diterjemahkan secara tersendiri
  rationale: Konjungsi pembuka menghubungkan ayat dengan konteks sebelumnya, tetapi bahasa Indonesia tidak memerlukan penanda wacana tambahan pada awal kalimat.
theological_decisions:
- issue: Penerjemahan תְּרָפִים sebagai benda pemujaan domestik
  choice: berhala-berhala rumah tangga
  alternative: terafim; dewa-dewa rumah tangga
  rationale: Pilihan utama membuat sifat bendawi dan fungsi kultisnya jelas tanpa menyiratkan pengakuan bahwa benda-benda itu sungguh ilahi. Alternatif leksikal dicatat agar istilah budaya Ibraninya tetap dapat ditelusuri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Telah pergi” mempertahankan fungsi latar, sedangkan bentuk jamak “berhala-berhala” mencerminkan bentuk Ibrani תְּרָפִים.
