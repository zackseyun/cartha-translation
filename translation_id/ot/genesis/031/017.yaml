  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: id
  text: Kemudian Yakub bangkit lalu menaikkan putra-putranya dan istri-istrinya ke atas unta-unta itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di atas unta-unta itu.” Dalam konteks ini, kata depan Ibrani dapat menyatakan tempat maupun arah gerak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol dari קום melanjutkan alur cerita dan menunjukkan Yakub mulai bertindak. “Bangkit” mempertahankan nuansa berdiri untuk bertindak dengan gaya yang wajar dan bermartabat.
- source_word: וַיִּשָּׂא
  choice: menaikkan
  rationale: נשׂא secara harfiah dapat berarti “mengangkat” atau “membawa,” tetapi bersama עַל הַגְּמַלִּים konteksnya adalah membuat mereka naik atau ditempatkan di atas unta. “Menaikkan” menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk jamak בנים di sini secara gramatikal maskulin dan merujuk kepada anak-anak lelaki Yakub; terjemahan ini mempertahankan ketepatan gender sumber.
- source_word: נָשָׁיו
  choice: istri-istrinya
  rationale: Bentuk jamak אשה dengan Yakub sebagai pemilik dalam konteks ini jelas merujuk kepada para istrinya.
- source_word: עַל הַגְּמַלִּים
  choice: ke atas unta-unta
  rationale: Dengan verba gerak kausatif “menaikkan,” עַל secara alami diterjemahkan “ke atas.” Bentuk jamak berartikel diterjemahkan “unta-unta,” dengan kekhususan cukup tersirat oleh konteks Indonesia.
theological_decisions: []
