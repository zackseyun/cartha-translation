  register: Bahasa Indonesia modern yang naratif dan bermartabat. “Kemudian” mempertahankan urutan tindakan, sedangkan “serta” menghubungkan dua kelompok objek dengan lancar. Penanda catatan kaki [a] dicantumkan dalam teks utama.
