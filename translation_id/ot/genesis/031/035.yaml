  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: id
  text: Lalu ia berkata kepada ayahnya, “Janganlah tuanku marah karena aku tidak dapat bangkit berdiri di hadapanmu, sebab aku sedang datang bulan.” Maka ayahnya menggeledah, tetapi tidak menemukan berhala-berhala rumah tangga itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: terafim, yaitu benda atau patung kultis rumah tangga; rupa dan fungsi tepatnya tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: Lalu ia berkata kepada ayahnya
  rationale: Wayyiqtol melanjutkan alur narasi; “lalu” terdengar alami dalam narasi Indonesia. Pronomina “ia” mengacu kepada Rahel tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: אַל־יִחַר בְּעֵינֵי אֲדֹנִי
  choice: Janganlah tuanku marah
  rationale: Ungkapan Ibrani secara harfiah melibatkan kemarahan yang menyala “di mata” tuan, tetapi berfungsi sebagai permohonan sopan agar lawan bicara tidak marah. Terjemahan ini menyampaikan idiom secara alami tanpa literalitas yang janggal; “tuanku” adalah sapaan hormat kepada ayahnya, bukan gelar ilahi.
- source_word: כִּי לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: karena aku tidak dapat bangkit berdiri di hadapanmu
  rationale: Mempertahankan makna fisik קום serta nuansa kehadiran dan penghormatan dalam מִפָּנֶיךָ. “Bangkit berdiri” memperjelas bahwa Rahel tidak dapat berdiri dari tempat duduknya.
- source_word: כִּי דֶרֶךְ נָשִׁים לִי
  choice: sebab aku sedang datang bulan
  rationale: Ungkapan Ibrani adalah eufemisme bagi menstruasi. “Datang bulan” merupakan eufemisme Indonesia yang alami, sopan, dan mudah dipahami, tanpa mengubahnya menjadi istilah klinis.
- source_word: וַיְחַפֵּשׂ
  choice: Maka ayahnya menggeledah
  rationale: Kata חפש dalam konteks ini berarti mencari dengan memeriksa barang atau tempat. “Menggeledah” menangkap tindakan pencarian intensif; subjek diperjelas sebagai ayahnya karena bahasa Indonesia memerlukan rujukan yang jelas.
- source_word: וְלֹא מָצָא
  choice: tetapi tidak menemukan
  rationale: Kata penghubung adversatif “tetapi” secara alami menandai hasil yang bertentangan dengan tujuan penggeledahan.
- source_word: הַתְּרָפִים
  choice: berhala-berhala rumah tangga itu
  rationale: Terafim adalah benda atau patung kultis domestik. Bentuk jamak dan penanda definit dipertahankan melalui “berhala-berhala ... itu”; catatan kaki menyediakan istilah Ibraninya dan menjaga keluasan makna leksikal.
theological_decisions:
- issue: Makna תְּרָפִים
  choice: berhala-berhala rumah tangga
  alternative: terafim; dewa-dewa rumah tangga; patung-patung rumah tangga
  rationale: Pilihan ini menyampaikan fungsi kultis dan lingkungan domestiknya dalam bahasa Indonesia yang mudah dipahami. Catatan mempertahankan istilah sumber karena rupa dan fungsi tepat benda-benda tersebut tidak sepenuhnya pasti.
- issue: Sapaan אֲדֹנִי kepada ayah
  choice: tuanku
  alternative: Tuan; ayahku
  rationale: “Tuanku” mempertahankan kesopanan dan ketegangan relasional dalam sapaan Rahel tanpa memberi kesan bahwa אֲדֹנִי di sini merupakan gelar bagi Allah atau sekadar sapaan kekeluargaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Eufemisme sumber dialihkan menjadi eufemisme Indonesia yang lazim. Susunan kalimat dibuat alami tanpa mempertahankan idiom Ibrani “di mata” secara harfiah. Semua penanda catatan kaki yang disediakan muncul dalam teks utama.
