  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti 'aku–engkau' dipakai karena percakapan berlangsung langsung antara Yakub dan Laban. Struktur kalimat mempertahankan pembagian dua puluh tahun menjadi empat belas dan enam tahun.
