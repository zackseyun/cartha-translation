base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: id
  text: 'Sudah dua puluh tahun ini aku bekerja di rumahmu: empat belas tahun untuk memperoleh kedua anak perempuanmu dan enam tahun untuk memperoleh kawanan ternakmu, dan engkau mengubah upahku sepuluh kali.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: Selama dua puluh tahun ini
  rationale: Ungkapan ini menyatakan jangka waktu yang baru saja dirangkum Yakub. Susunan ini alami dalam bahasa Indonesia sekaligus mempertahankan daya deiktis זֶה dan nuansa duratif לִּי.
- source_word: בְּבֵיתֶךָ
  choice: di rumahmu
  rationale: בַּיִת secara konkret berarti rumah, meskipun dapat mencakup rumah tangga. Terjemahan ini langsung, wajar, dan tidak memperluas makna tanpa kebutuhan.
- source_word: עֲבַדְתִּיךָ
  choice: Aku bekerja untukmu
  rationale: Dalam konteks ini עבד menunjuk pada kerja atau pelayanan yang diberikan kepada Laban. 'Bekerja untukmu' paling alami bagi pembaca Indonesia modern dan jelas dalam konteks hubungan kerja.
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: selama empat belas tahun demi kedua anak perempuanmu
  rationale: Preposisi בְּ menandai imbalan atau tujuan kerja dalam pengaturan perkawinan tersebut. 'Demi' mengungkapkan bahwa Yakub bekerja untuk memperoleh mereka tanpa menambahkan uraian tafsir.
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: dan enam tahun demi kawanan ternakmu
  rationale: צֹאן adalah ternak kecil secara kolektif, khususnya domba dan kambing. 'Kawanan ternak' mempertahankan keluasan istilah dan sesuai dengan konteks ekonomi.
- source_word: וַתַּחֲלֵף
  choice: tetapi engkau mengubah
  rationale: Bentuk Hifil dari חלף berarti mengubah atau mengganti. Konjungsi 'tetapi' menyampaikan pertentangan pragmatis antara kerja Yakub dan perlakuan Laban, yang dalam bahasa Ibrani dihubungkan dengan waw berurutan.
- source_word: מַשְׂכֻּרְתִּי
  choice: upahku
  rationale: Kata benda ini berarti upah atau bayaran. 'Upahku' merupakan padanan baku dan transparan dalam konteks hubungan kerja.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: sepuluh kali
  rationale: Ini adalah ungkapan idiomatis untuk perubahan yang berulang. Padanan 'sepuluh kali' jelas dalam bahasa Indonesia dan menghindari terjemahan harfiah 'hitungan' yang kabur.
