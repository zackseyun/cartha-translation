  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: id
  text: Jadi, Allah mengambil ternak ayah kalian dan memberikannya kepadaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merenggut” atau “melepaskan.” Kata kerja Ibrani ini dapat mengandung arti mengambil dari satu pihak dan menyerahkannya kepada pihak lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: mengambil
  rationale: Bentuk Hifil dari נצל dapat berarti merenggut, melepaskan, atau mengambil dari pihak lain. Dalam konteks ini, Allah memindahkan ternak dari Laban kepada Yakub; “mengambil” menyatakan perpindahan itu secara alami tanpa menambahkan gagasan bahaya atau kekerasan yang tidak harus ada.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Istilah umum Ibrani bagi Allah di sini menunjuk kepada Dia yang bertindak bagi Yakub; “Allah” merupakan padanan baku dan wajar dalam bahasa Indonesia.
- source_word: מִקְנֵה
  choice: ternak
  rationale: מִקְנֶה menunjuk pada harta berupa hewan peliharaan. Dalam konteks kawanan milik Yakub dan Laban, “ternak” tepat, ringkas, dan tidak membatasi maknanya hanya pada sapi.
- source_word: אֲבִיכֶם
  choice: ayah kalian
  rationale: Nomina tunggal dengan akhiran orang kedua jamak berarti satu ayah yang sama dari para perempuan yang disapa, yaitu Laban; “ayah kalian” menyampaikan bentuk dan sapaan jamak itu dengan jelas.
- source_word: וַיִּתֶּן לִי
  choice: memberikannya kepadaku
  rationale: נתן dengan objek tak langsung “kepadaku” menyatakan pemindahan kepemilikan. Pronomina “-nya” merujuk kembali pada “ternak,” yang diperlakukan sebagai nomina kolektif tunggal dalam bahasa Indonesia.
theological_decisions:
- issue: Peran langsung Allah dalam kemakmuran Yakub
  choice: Ayat ini secara langsung menyatakan bahwa Allah mengambil ternak Laban dan memberikannya kepada Yakub.
  alternative: Melunakkan kalimat menjadi pernyataan umum bahwa Allah hanya memberkati Yakub.
  rationale: Dua verba Ibrani וַיַּצֵּל dan וַיִּתֶּן secara tegas mengaitkan pengambilan dan pemberian itu dengan tindakan Allah. Terjemahan mempertahankan penegasan tersebut tanpa menjelaskan lebih jauh cara tindakan itu berlangsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Kalian” mempertahankan sapaan jamak kepada Rahel dan Lea; “ternak” dipakai sebagai nomina kolektif. Penanda catatan kaki [a] dicantumkan dalam teks utama.
