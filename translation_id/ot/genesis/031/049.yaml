  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: id
  text: Dan Mizpa[a], sebab ia berkata, “Kiranya Yahweh mengawasi di antara aku dan engkau ketika kita tidak lagi saling terlihat[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mizpa berkaitan dengan kata Ibrani yang berarti “menara pengawas” atau “tempat pengintaian”, sehingga nama tempat ini terkait dengan perkataan “Kiranya Yahweh mengawasi”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “ketika kita tersembunyi, masing-masing dari sesamanya”; maksudnya, ketika mereka berada di luar pandangan satu sama lain.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: Dan Mizpa
  rationale: מִצְפָּה berfungsi sebagai nama tempat dalam konteks penamaan ini. Transliterasi “Mizpa” mempertahankan nama tersebut, sedangkan catatan kaki menjelaskan kaitannya dengan akar צפה, ‘mengawasi/mengintai’.
- source_word: אֲשֶׁר אָמַר
  choice: sebab ia berkata
  rationale: Klausa relatif ini menjelaskan alasan bagi nama tersebut. “Sebab ia berkata” alami dalam bahasa Indonesia dan tidak menambahkan kata kerja ‘menamainya’ yang tidak tersurat.
- source_word: יִצֶף
  choice: Kiranya ... mengawasi
  rationale: Bentuk yiqtol ini menyatakan harapan atau permohonan. “Kiranya” menyampaikan nuansa jusif, sedangkan “mengawasi” mempertahankan hubungan verbal dengan nama Mizpa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: di antara aku dan engkau
  rationale: Terjemahan ini mempertahankan urutan dan gambaran spasial teks Ibrani tanpa mengubahnya menjadi ‘mengawasi kita berdua’.
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: ketika kita tidak terlihat satu sama lain
  rationale: כִּי menyatakan keadaan temporal di sini. Niphal נִסָּתֵר secara harfiah menunjuk pada keadaan tersembunyi, dan ungkapan timbal balik אִישׁ מֵרֵעֵהוּ disampaikan secara alami sebagai “satu sama lain”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Fungsi pengawasan Yahweh dalam perjanjian
  choice: mengawasi di antara aku dan engkau
  alternative: mengawasi kita berdua
  rationale: Rumusan sumber menempatkan Yahweh sebagai pengawas ‘di antara’ kedua pihak ketika mereka terpisah. Terjemahan tidak mempersempitnya menjadi sekadar perlindungan atau menyelesaikan ketegangan apakah pengawasan itu bersifat menjaga, menyaksikan, atau menghakimi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai agar sesuai dengan ujaran perjanjian yang khidmat. Susunan “mengawasi di antara aku dan engkau” sengaja mempertahankan gambaran Ibrani meskipun sedikit tidak biasa dalam bahasa Indonesia.
