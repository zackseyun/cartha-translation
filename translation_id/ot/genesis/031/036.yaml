base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: id
  text: Lalu Yakub menjadi marah dan berbantah dengan Laban. Yakub menjawab dan berkata kepada Laban, “Apa pelanggaranku? Apa dosaku sehingga engkau mengejar aku dengan begitu gigih[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengejar aku.” Verba Ibrani ini mengandung gambaran menyala dan, secara kiasan, pengejaran yang bersemangat atau gigih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: Lalu Yakub menjadi marah
  rationale: Ungkapan חרה + ל menyatakan bangkit atau berkobarnya amarah pada seseorang. 'Menjadi marah' alami dalam bahasa Indonesia dan mempertahankan nuansa ingresif dalam rangkaian narasi.
- source_word: וַיָּרֶב בְּלָבָן
  choice: dan berbantah dengan Laban
  rationale: ריב menyatakan pertikaian atau perbantahan dengan seseorang. 'Berbantah' mempertahankan daya adversatifnya tanpa memberi kesan perkelahian fisik.
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: Yakub menjawab dan berkata
  rationale: Kedua verba Ibrani dipertahankan karena merupakan rumusan naratif yang tetap dapat dibaca secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מַה פִּשְׁעִי
  choice: Apa pelanggaranku?
  rationale: פֶּשַׁע menunjuk pada pelanggaran, sering dengan nuansa moral atau hukum dan unsur kesengajaan. 'Pelanggaran' menjaga nuansa pembelaan diri Yakub.
- source_word: מַה חַטָּאתִי
  choice: Apa dosaku
  rationale: חַטָּאת berarti dosa atau kesalahan. 'Dosa' adalah padanan langsung dan mempertahankan paralelisme dengan 'pelanggaran'.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan ini כִּי menghubungkan dugaan kesalahan Yakub dengan pengejaran Laban. 'Sehingga' menghasilkan hubungan yang alami dalam bahasa Indonesia tanpa menetapkan secara berlebihan apakah nuansanya kausal atau konsekutif.
- source_word: דָלַקְתָּ אַחֲרָי
  choice: engkau mengejar aku dengan begitu gigih
  rationale: דלק secara leksikal berhubungan dengan menyala dan secara kiasan berarti mengejar dengan bersemangat atau gigih. Ungkapan ini mempertahankan intensitas verba tanpa memakai metafora Indonesia yang terasa janggal.
