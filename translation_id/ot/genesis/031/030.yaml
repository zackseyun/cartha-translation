  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: id
  text: Dan sekarang, engkau benar-benar telah pergi karena engkau sangat merindukan rumah ayahmu. Mengapa engkau mencuri ilah-ilahku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dewa-dewa rumah tanggaku.” Teks Ibrani berbunyi “ilah-ilahku”; dalam konteks, ini merujuk kepada berhala rumah tangga Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana yang mengalihkan perkataan Laban kepada pokok berikutnya; dalam bahasa Indonesia modern, 'Sekarang' secara alami memuat fungsi peralihan tanpa perlu mempertahankan 'dan' secara kaku.
- source_word: הָלֹךְ הָלַכְתָּ
  choice: engkau memang telah pergi
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan; 'memang telah pergi' mempertahankan aspek tindakan yang sudah terjadi sekaligus tekanannya.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan yang diakui Laban bagi kepergian Yakub.
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: engkau sangat merindukan
  rationale: Infinitif absolut bersama verba finit menguatkan intensitas kerinduan; 'sangat merindukan' alami dan tetap dekat dengan bentuk sumber.
- source_word: לְבֵית אָבִיךָ
  choice: rumah ayahmu
  rationale: Mempertahankan ungkapan keluarga-rumah tangga dalam teks Ibrani tanpa mempersempitnya menjadi sekadar bangunan atau memperluasnya menjadi 'kampung halaman'.
- source_word: לָמָּה
  choice: mengapa
  rationale: Bentuk tanya langsung yang alami dalam tuduhan Laban.
- source_word: גָנַבְתָּ
  choice: engkau mencuri
  rationale: Menyampaikan tindakan lampau dalam pertanyaan langsung secara alami; waktu tindakan dipahami dari konteks.
- source_word: אֶת אֱלֹהָי
  choice: ilah-ilahku
  rationale: Bentuk Ibrani secara langsung berarti 'ilah-ilahku'; pilihan ini mempertahankan bentuk jamak dan ucapan Laban tanpa memasukkan penjelasan kontekstual ke dalam teks utama.
theological_decisions:
- issue: Penerjemahan אֱלֹהָי dalam ucapan Laban
  choice: ilah-ilahku
  alternative: dewa-dewa rumah tanggaku
  rationale: Teks Ibrani hanya menyebut 'ilah-ilahku'. Konteks menunjukkan berhala rumah tangga Laban, tetapi keterangan itu tidak dinyatakan oleh nomina dalam ayat ini sehingga ditempatkan dalam catatan kaki.
- issue: Hubungan antara pengakuan alasan dan tuduhan Laban
  choice: Namun, mengapa
  alternative: Mengapa
  rationale: Teks sumber beralih dari alasan kepergian yang dapat dipahami kepada tuduhan pencurian. 'Namun' mengungkapkan kontras wacana itu secara alami tanpa mengubah isi proposisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk mempertahankan sapaan tunggal langsung dalam narasi Alkitab. Pengulangan intensif Ibrani dialihkan menjadi 'memang' dan 'sangat' agar penekanannya tetap terasa secara alami.
