  text: And Jacob saw Laban’s face[a], and behold[b], it was not toward him as before.
translation:
  language: id
  text: Yakub melihat wajah Laban, dan ternyata Laban tidak lagi bersikap terhadapnya seperti dahulu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak bersamanya seperti kemarin dan hari sebelumnya,” sebuah ungkapan yang menunjukkan bahwa sikap Laban terhadap Yakub telah berubah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: memperhatikan
  rationale: Dalam konteks ini Yakub bukan sekadar melihat, melainkan mengamati perubahan yang tampak pada wajah Laban; 'memperhatikan' menyampaikan pengamatan itu secara alami tanpa menambahkan penafsiran yang berlebihan.
- source_word: פְּנֵי לָבָן
  choice: wajah Laban
  rationale: Mempertahankan gambaran konkret Ibrani 'wajah', yang dalam konteks menunjukkan raut atau disposisi yang terlihat.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: הִנֵּה mengarahkan perhatian pada keadaan yang disadari Yakub. 'Ternyata' mempertahankan daya penyingkapannya dalam narasi Indonesia yang alami.
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: sikap Laban terhadapnya tidak lagi
  rationale: Ungkapan harfiah 'ia tidak bersamanya' dalam konteks wajah Laban menyatakan perubahan sikap atau keberpihakan. Penyebutan 'sikap Laban' menghindari ketaksaan pronomina dalam bahasa Indonesia.
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: seperti dahulu
  rationale: Idiom harfiah 'seperti kemarin dan hari sebelumnya' berarti seperti pada waktu-waktu sebelumnya; 'seperti dahulu' ringkas dan wajar dalam bahasa Indonesia.
