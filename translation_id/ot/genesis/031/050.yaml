  to: Jika engkau memperlakukan anak-anak perempuanku dengan buruk, atau jika engkau mengambil perempuan-perempuan lain sebagai istri di samping anak-anak perempuanku—sekalipun tidak ada seorang pun bersama kita[a]—lihatlah, Allah adalah saksi antara aku dan engkau.
