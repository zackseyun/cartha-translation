base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: id
  text: Jika engkau memperlakukan anak-anak perempuanku dengan buruk, atau jika engkau mengambil perempuan-perempuan lain sebagai istri di samping anak-anak perempuanku—sekalipun tidak ada seorang pun bersama kita[a]—lihatlah, Allah adalah saksi antara aku dan engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada seorang laki-laki bersama kita”; maksudnya, tidak ada saksi manusia yang hadir.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: memperlakukan ... dengan buruk
  rationale: Bentuk Piel ענה dalam konteks perkawinan menunjuk pada tindakan menyusahkan atau memperlakukan putri-putri Laban secara buruk. Ungkapan ini alami dalam bahasa Indonesia dan tidak membawa konotasi sempit yang dapat timbul dari 'menindas' atau 'merendahkan'.
- source_word: בְּנֹתַי
  choice: anak-anak perempuanku
  rationale: Menyatakan bentuk jamak dengan kepemilikan secara jelas; pengulangannya dipertahankan sesuai teks Ibrani.
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: mengambil istri-istri lain di samping anak-anak perempuanku
  rationale: Ungkapan ini berarti mengambil perempuan-perempuan sebagai istri tambahan, bukan menggantikan putri-putri Laban. Kata 'lain' memperjelas idiom tersebut dalam bahasa Indonesia.
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: sekalipun tidak ada seorang pun bersama kita
  rationale: Klausa ini menekankan bahwa tidak ada saksi manusia yang hadir. 'Sekalipun' menyampaikan daya konsesif konteks, sedangkan 'seorang pun' merupakan ungkapan Indonesia yang alami untuk אִישׁ dalam fungsi generik-manusia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: רְאֵה
  choice: lihatlah
  rationale: Mempertahankan bentuk imperatif langsung yang menarik perhatian kepada seruan perjanjian yang khidmat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים merujuk kepada Tuhan yang tunggal, yang dipanggil sebagai saksi.
- source_word: עֵד
  choice: menjadi saksi
  rationale: Sebagai predikat dalam rumusan perjanjian, 'menjadi saksi' terdengar alami dalam bahasa Indonesia dan mempertahankan fungsi Allah sebagai saksi antara kedua pihak.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: antara aku dan engkau
  rationale: Menerjemahkan ungkapan relasional secara langsung dan mempertahankan nada khidmat melalui kata ganti 'engkau'.
theological_decisions:
- issue: Makna generik-manusia dari אִישׁ
  choice: tidak ada seorang pun bersama kita
  alternative: tidak ada seorang laki-laki bersama kita
  rationale: Dalam konteks ini pokoknya ialah tidak adanya saksi manusia, bukan jenis kelaminnya. Terjemahan utama menyatakan makna kontekstual secara alami, sementara bentuk yang lebih harfiah dipertahankan dalam catatan kaki agar rincian leksikal sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'anak-anak perempuanku' dipertahankan untuk mengikuti penekanan teks Ibrani; tanda pisah menandai klausa sisipan tentang tidak adanya saksi manusia.
