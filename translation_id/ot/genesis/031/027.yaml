base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: id
  text: Mengapa engkau menyembunyikan diri untuk melarikan diri dan pergi diam-diam meninggalkan aku[a], tanpa memberitahukan aku, sehingga aku dapat melepaskanmu pergi dengan sukacita dan lagu-lagu[b], dengan rebana[c] dan lira[d]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan engkau mencuri aku.” Dalam konteks ini, ungkapan Ibrani tersebut berarti pergi meninggalkan seseorang secara diam-diam.
    reason: lexical_alternative
  - marker: b
    text: Atau “nyanyian.”
    reason: lexical_alternative
  - marker: c
    text: Alat musik tabuh genggam; secara tradisional disebut “tamborin” atau “timbrel.”
    reason: lexical_alternative
  - marker: d
    text: Kata Ibraninya menunjuk pada alat musik petik sejenis lira; kadang diterjemahkan “harpa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya yang meminta alasan.
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: engkau menyembunyikan diri untuk melarikan diri
  rationale: Mempertahankan nuansa refleksif bentuk Nifal serta daya verbal infinitif 'melarikan diri' dalam tuduhan Laban.
- source_word: וַתִּגְנֹב אֹתִי
  choice: dan pergi diam-diam dariku
  rationale: Secara harfiah berbunyi 'dan engkau mencuri aku', tetapi dalam konteks merupakan idiom tentang meninggalkan seseorang secara diam-diam. Terjemahan ini menyampaikan maknanya secara wajar tanpa mengubahnya menjadi tuduhan penipuan.
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: Mengapa engkau tidak memberi tahu aku
  rationale: נגד dalam Hifil berarti memberitahukan; pengulangan 'Mengapa' menghasilkan pertanyaan retoris yang alami dalam bahasa Indonesia sambil mempertahankan hubungan dengan klausa sebelumnya.
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: supaya aku dapat melepas kepergianmu
  rationale: Waw dipahami secara konsekuensial dan menyatakan kemungkinan yang tidak terlaksana. 'Melepas kepergianmu' alami untuk perpisahan, tanpa menyiratkan sekadar mengusir.
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: dengan sukacita dan nyanyian
  rationale: Menyampaikan suasana perpisahan meriah; bentuk jamak שִׁרִים dapat merujuk pada lagu-lagu atau kegiatan bernyanyi.
- source_word: בְּתֹף
  choice: dengan rebana
  rationale: Padanan modern yang dikenal luas untuk alat tabuh genggam תֹף, meskipun bentuk tepat alat kunonya tidak pasti.
- source_word: וּבְכִנּוֹר
  choice: dan kecapi
  rationale: כִּנּוֹר adalah alat musik petik jenis lira. 'Kecapi' lebih mudah dipahami pembaca Indonesia, sedangkan catatan menjelaskan jenis historisnya.
