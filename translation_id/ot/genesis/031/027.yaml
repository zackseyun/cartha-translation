revisions:
- from: Mengapa engkau menyembunyikan diri untuk melarikan diri dan pergi diam-diam dariku[a]? Mengapa engkau tidak memberi tahu aku, supaya aku dapat melepas kepergianmu dengan sukacita dan nyanyian[b], dengan rebana[c] dan kecapi[d]?
  to: Mengapa engkau menyembunyikan diri untuk melarikan diri dan pergi diam-diam meninggalkan aku[a], tanpa memberitahukan aku, sehingga aku dapat melepaskanmu pergi dengan sukacita dan lagu-lagu[b], dengan rebana[c] dan lira[d]?
  rationale: Revisi mempertahankan satu pertanyaan retoris seperti dalam bahasa Ibrani, menyatakan hubungan konsekuensial yang tidak terlaksana dalam “sehingga aku dapat,” dan menerjemahkan objek ‘engkau’ pada kata kerja ‘mengirim/melepaskan pergi’ secara eksplisit. Istilah alat musik serta catatan kaki diselaraskan dengan makna leksikal sumber.
