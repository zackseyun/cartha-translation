  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: id
  text: Dan kalian sendiri tahu bahwa aku telah bekerja untuk ayah kalian dengan segenap kekuatanku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melayani ayah kalian.” Kata kerja Ibrani ini dapat berarti “bekerja” atau “melayani”; kedua makna itu sesuai dengan tahun-tahun Yakub bekerja pada Laban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֵּנָה
  choice: Kalian sendiri
  rationale: Pronomina feminin jamak yang berdiri sendiri memberi penekanan pada Rahel dan Lea. Dalam bahasa Indonesia, “kalian sendiri” menyampaikan penekanan itu secara alami; penghubung וְ tidak perlu dinyatakan karena hubungan antarkalimat tetap jelas.
- source_word: יְדַעְתֶּן
  choice: tahu
  rationale: Bentuk perfektif ini menyatakan pengetahuan yang telah diperoleh dan kini dimiliki; “tahu” merupakan padanan Indonesia yang alami.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari apa yang diketahui.
- source_word: בְּ/כָל כֹּחִי
  choice: dengan segenap kekuatanku
  rationale: Frasa ini menyatakan pengerahan seluruh kekuatan atau kemampuan. “Dengan segenap kekuatanku” alami, bermartabat, dan mempertahankan penekanan totalitas.
- source_word: עָבַדְתִּי
  choice: telah bekerja untuk
  rationale: Dalam konteks tahun-tahun kerja Yakub bagi Laban, עבד dapat berarti bekerja atau melayani. “Bekerja untuk” paling alami dalam bahasa Indonesia ketika objeknya adalah pemberi kerja, sementara alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: אֶת אֲבִיכֶן
  choice: ayah kalian
  rationale: Akhiran orang kedua feminin jamak merujuk kepada ayah Rahel dan Lea. Dengan verba “bekerja untuk,” relasi objek tersebut dinyatakan secara idiomatis sebagai “untuk ayah kalian.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai dengan ujaran langsung kepada Rahel dan Lea. Susunan kalimat dibuat alami tanpa menghilangkan penekanan pada para pendengar atau pada pengerahan seluruh kekuatan Yakub.
