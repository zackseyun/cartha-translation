  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: id
  text: Lalu malaikat Allah berkata kepadaku dalam mimpi itu[a], “Yakub!” Aku berkata, “Aku di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dalam sebuah mimpi.” Teks Ibrani memakai kata sandang tertentu: “dalam mimpi itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Padanan langsung dan alami bagi preposisi dengan sufiks orang pertama tunggal.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaikat Allah
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; konteks ini menunjuk pada makhluk surgawi, sehingga “malaikat” paling jelas, sementara konstruksi Ibraninya wajar diterjemahkan “malaikat Allah”.
- source_word: בַּחֲלוֹם
  choice: dalam mimpi itu
  rationale: Prefiks Ibrani mengandung kata sandang tertentu; “mimpi itu” mempertahankan ketentuan tersebut dan tetap alami dalam bahasa Indonesia.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: וָאֹמַר
  choice: Aku menjawab
  rationale: Secara harfiah berarti “dan aku berkata,” tetapi dalam dialog bahasa Indonesia “Aku menjawab” secara alami menyampaikan fungsi ujaran tersebut.
- source_word: הִנֵּנִי
  choice: Ya, aku di sini
  rationale: Ungkapan kesiapsediaan atau penyataan diri; bentuk ini terdengar alami dan mempertahankan daya responsif ungkapan Ibrani.
theological_decisions:
- issue: Penyebutan מַלְאַךְ הָאֱלֹהִים dalam konteks yang dapat mengundang identifikasi tokoh itu dengan Allah
  choice: malaikat Allah
  alternative: utusan Allah
  rationale: Ayat ini sendiri menyebut tokoh tersebut sebagai “malaikat Allah” tanpa menuntaskan pertanyaan teologis yang lebih luas tentang identitasnya; terjemahan tidak menambahkan klaim penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda seru setelah “Yakub” mencerminkan seruan langsung. Artikel tertentu dalam bahasa Ibrani dipertahankan melalui “itu,” dengan alternatif idiomatis dicatat dalam catatan kaki.
