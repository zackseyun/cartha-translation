id: GEN.31.44
reference: Genesis 31:44
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לְכָ֛/ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָ/אָ֑תָּה וְ/הָיָ֥ה לְ/עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: id
  text: Jadi sekarang, mari kita mengikat perjanjian[a], aku dan engkau, dan biarlah itu menjadi saksi antara aku dan engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian.” Ungkapan Ibrani ini berarti membuat atau menetapkan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menandai langkah lanjutan dalam percakapan sambil mempertahankan unsur penghubung secara alami dalam bahasa Indonesia.
- source_word: לְכָה
  choice: mari
  rationale: Walaupun secara leksikal berasal dari kata 'pergi/berjalan', bentuk ini berfungsi idiomatis sebagai ajakan; 'mari' paling wajar dalam konteks ini.
- source_word: נִכְרְתָה בְרִית
  choice: mari kita mengikat perjanjian
  rationale: Ungkapan Ibrani secara harfiah berarti 'memotong perjanjian', tetapi secara idiomatis berarti membuat atau menetapkan perjanjian. 'Mengikat perjanjian' alami dalam bahasa Indonesia dan mempertahankan kesan ikatan formal.
- source_word: אֲנִי וָאָתָּה
  choice: aku dan engkau
  rationale: Mempertahankan penyebutan eksplisit kedua pihak serta urutan teks Ibrani; ragam 'aku–engkau' sesuai dengan dialog pribadi yang bermartabat.
- source_word: וְהָיָה לְעֵד
  choice: dan biarlah itu menjadi saksi
  rationale: Menyampaikan nuansa volitif setelah ajakan sebelumnya, bukan sekadar menyatakannya sebagai peristiwa masa depan.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: antara aku dan engkau
  rationale: Mengikuti urutan personal teks Ibrani dan mempertahankan penekanan pada kedua pihak.
theological_decisions:
- issue: Acuan subjek tersirat dalam וְהָיָה ('dan biarlah itu menjadi')
  choice: itu
  alternative: perjanjian itu
  rationale: Teks Ibrani tidak menyebut ulang nomina sebagai subjek. Kata 'itu' mempertahankan ketakterangan gramatikal tersebut, meskipun perjanjian adalah acuan terdekat.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang wajar dan bermartabat. Pilihan 'mengikat perjanjian' lebih idiomatis daripada terjemahan harfiah 'memotong perjanjian', sedangkan catatan kaki mempertahankan gambaran asli bahasa Ibrani.
