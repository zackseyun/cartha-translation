  to: Lalu Laban menjawab dan berkata kepada Yakub, “Putri-putri itu adalah putri-putriku, putra-putra itu adalah putra-putraku, kawanan ternak itu adalah kawanan ternakku, dan segala yang kaulihat adalah milikku. Tetapi, apa yang dapat kulakukan hari ini bagi putri-putriku ini atau bagi anak-anak mereka yang telah mereka lahirkan[a]?”
