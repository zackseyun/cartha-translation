  naturalness: Beberapa bentuk posesif bertingkat, khususnya “anak-anakku perempuan” dan “anak-anakku lelaki,” tidak alami dalam bahasa Indonesia baku. “Putri-putriku” dan “putra-putraku” menyampaikan perbedaan gender serta pengulangan posesif Ibrani dengan lebih idiomatis dan tetap bermartabat.
