base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: id
  text: Lalu Laban menjawab dan berkata kepada Yakub, “Putri-putri itu adalah putri-putriku, putra-putra itu adalah putra-putraku, kawanan ternak itu adalah kawanan ternakku, dan segala yang kaulihat adalah milikku. Tetapi, apa yang dapat kulakukan hari ini bagi putri-putriku ini atau bagi anak-anak mereka yang telah mereka lahirkan[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “putra-putra mereka yang telah mereka lahirkan,” jika בְּנֵיהֶן dipahami secara lebih sempit sebagai keturunan laki-laki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: Lalu Laban menjawab dan berkata kepada Yakub
  rationale: Mempertahankan pasangan verba naratif Ibrani 'menjawab dan berkata' serta penerima ujaran, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: Anak-anak perempuan itu adalah anak-anakku perempuan
  rationale: Pengulangan nomina dan akhiran posesif dipertahankan untuk menyampaikan penegasan klaim kekeluargaan Laban.
- source_word: וְהַבָּנִים בָּנַי
  choice: anak-anak lelaki itu adalah anak-anakku lelaki
  rationale: Bentuk maskulin jamak diterjemahkan secara khusus sebagai anak-anak lelaki, selaras dengan paralelnya, yaitu anak-anak perempuan.
- source_word: וְהַצֹּאן צֹאנִי
  choice: kawanan ternak itu adalah kawanan ternakku
  rationale: צאן adalah sebutan kolektif bagi ternak kecil; 'kawanan ternak' mempertahankan sifat kolektif tanpa membatasinya hanya pada domba.
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: dan segala yang kaulihat adalah milikku
  rationale: Menyampaikan klaim kepemilikan secara ringkas dan tetap mempertahankan penekanan personal.
- source_word: מָה אֶעֱשֶׂה הַיּוֹם
  choice: apa yang dapat kulakukan hari ini
  rationale: Bentuk imperfek dalam konteks ini menyatakan kemungkinan praktis secara retoris; 'hari ini' adalah padanan modern dan alami bagi הַיּוֹם.
- source_word: וְלִבְנֹתַי ... לָאֵלֶּה
  choice: terhadap anak-anakku perempuan ini
  rationale: Preposisi ל dapat menyatakan sasaran tindakan. 'Terhadap' mempertahankan ketaksaan apakah tindakan yang dimaksud akan menguntungkan atau merugikan mereka, alih-alih menafsirkannya sebagai tindakan 'demi' mereka.
- source_word: אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: atau terhadap anak-anak yang telah mereka lahirkan
  rationale: בְּנֵיהֶן secara kontekstual dapat menunjuk keturunan secara umum; klausa relatif mempertahankan penekanan bahwa anak-anak itu dilahirkan oleh putri-putri Laban.
theological_decisions:
- issue: Arah atau dampak tindakan Laban terhadap putri-putrinya
  choice: terhadap anak-anakku perempuan ini
  alternative: demi/untuk anak-anakku perempuan ini
  rationale: Teks Ibrani memakai ל yang dapat menandai sasaran maupun kepentingan. Konteks memungkinkan maksud 'apa yang dapat kulakukan terhadap mereka', sehingga terjemahan tidak mengubahnya menjadi kepedulian yang pasti bersifat menguntungkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan posesif yang terasa menonjol sengaja dipertahankan karena merupakan ciri retoris ucapan Laban. Bentuk terikat seperti 'kaulihat' dan 'kulakukan' dipakai secara baku dan alami.
