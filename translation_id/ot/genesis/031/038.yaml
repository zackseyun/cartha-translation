base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: id
  text: Selama dua puluh tahun ini aku telah bersamamu. Domba-domba betinamu dan kambing-kambing betinamu tidak pernah keguguran[a], dan aku tidak pernah memakan domba-domba jantan dari kawananmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak pernah kehilangan anaknya.” Kata Ibrani ini dapat berarti kehilangan keturunan; dalam konteks peternakan, kata itu menunjuk pada keguguran atau kehilangan anak ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: Selama dua puluh tahun ini
  rationale: Ungkapan Ibrani secara harfiah memakai bentuk demonstratif, ‘dua puluh tahun ini’. Penambahan ‘selama’ menghasilkan ungkapan durasi yang alami dalam bahasa Indonesia sambil mempertahankan penekanan pada kurun waktu tersebut.
- source_word: אָנֹכִי עִמָּךְ
  choice: aku bersama engkau
  rationale: Bahasa Ibrani tidak memuat verba eksplisit. Dalam konteks rangkuman masa pelayanan selama dua puluh tahun, klausa nominal ini secara alami menyatakan keberadaan Yakub bersama Laban sepanjang masa itu.
- source_word: רְחֵלֶיךָ
  choice: domba-dombamu yang betina
  rationale: Kata ini secara khusus menunjuk domba betina. Bentuk deskriptif ini lebih mudah dipahami pembaca umum daripada istilah peternakan yang kurang lazim.
- source_word: וְעִזֶּיךָ
  choice: kambing-kambingmu yang betina
  rationale: Bentuk Ibrani menunjuk kambing betina; terjemahan ini mempertahankan kekhususan jenis kelaminnya dalam bahasa Indonesia yang alami.
- source_word: לֹא שִׁכֵּלוּ
  choice: tidak pernah keguguran
  rationale: Dalam konteks ternak, verba ini menyatakan kehilangan anak, khususnya akibat keguguran. ‘Tidak pernah’ secara alami menyampaikan bahwa hal itu tidak terjadi sepanjang dua puluh tahun tersebut.
- source_word: וְאֵילֵי צֹאנְךָ
  choice: domba jantan dari kawananmu
  rationale: אֵילִים secara khusus berarti domba jantan dewasa. Frasa ‘dari kawananmu’ mempertahankan hubungan kepemilikan dan kelompok ternak dalam teks Ibrani.
- source_word: לֹא אָכָלְתִּי
  choice: aku tidak pernah memakan
  rationale: Bentuk perfektif merangkum perilaku Yakub selama seluruh masa yang baru disebutkan. ‘Tidak pernah’ menyampaikan penyangkalan menyeluruh itu dengan alami.
