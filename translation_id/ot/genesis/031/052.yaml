base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: id
  text: Timbunan batu ini adalah saksi, dan tugu batu ini adalah saksi, bahwa aku tidak akan melintasi timbunan batu ini menuju kepadamu, dan bahwa engkau tidak akan melintasi timbunan batu ini dan tugu batu ini menuju kepadaku dengan maksud mencelakakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa “dengan maksud mencelakakan” menunjukkan niat jahat atau bermusuhan; larangan ini bukan sekadar larangan untuk bergerak melintasi batas tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: עֵד
  choice: menjadi saksi
  rationale: Nomina predikatif ini menyatakan fungsi timbunan batu sebagai saksi perjanjian; 'menjadi saksi' terdengar wajar dalam bahasa Indonesia dan tidak menyiratkan bahwa benda itu saksi hidup.
- source_word: גַּל
  choice: timbunan batu
  rationale: Dalam konteks langsung, kata ini menunjuk pada timbunan batu yang didirikan sebagai penanda batas. Penyebutan 'batu' membuat gambaran fisiknya jelas bagi pembaca Indonesia.
- source_word: וְעֵדָה
  choice: dan tugu batu ini pun menjadi saksi
  rationale: Bentuk ini sejajar secara makna dengan עֵד pada klausa sebelumnya. 'Pun' menampilkan kesejajaran bahwa kedua penanda berfungsi sebagai saksi.
- source_word: מַצֵּבָה
  choice: tugu batu
  rationale: Kata ini menunjuk pada batu yang ditegakkan sebagai penanda atau monumen. 'Tugu batu' alami dan membedakannya dari timbunan batu.
- source_word: אִם
  choice: bahwa
  rationale: Dalam konteks sumpah atau perjanjian, אִם memperkenalkan isi ketetapan yang disaksikan, bukan sekadar syarat biasa. 'Bahwa' menyampaikan fungsi idiomatis tersebut.
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: melintasi
  rationale: Verba ini menggambarkan tindakan melewati penanda batas. 'Melintasi' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'melewati di atas'.
- source_word: אֵלֶיךָ / אֵלַי
  choice: menuju kepadamu / menuju kepadaku
  rationale: Preposisi ini menyatakan arah kepada pihak lain. Pilihan ini mempertahankan nuansa arah tanpa memasukkan maksud permusuhan sebelum frasa terakhir.
- source_word: לְרָעָה
  choice: dengan maksud mencelakakan
  rationale: Frasa ini menyatakan tujuan atau niat jahat. Terjemahan ini menjelaskan bahwa larangan tersebut menyangkut penyeberangan dengan maksud merugikan, bukan semua pergerakan melintasi batas.
theological_decisions:
- issue: Cakupan frasa לְרָעָה terhadap dua ketetapan paralel
  choice: Ditempatkan pada akhir kalimat sehingga secara wajar dapat dipahami sebagai maksud yang mengatur larangan saling melintasi batas.
  alternative: Membatasi frasa itu secara gramatikal hanya pada tindakan pihak kedua.
  rationale: Bahasa Ibrani menempatkan frasa tujuan pada akhir keseluruhan pernyataan. Terjemahan mempertahankan letak dan ketegangan sintaksis itu tanpa menambahkan frasa yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perjanjian yang khidmat tetapi tetap mudah dipahami. Pengulangan 'timbunan batu ini' dan 'tugu batu ini' dipertahankan untuk mencerminkan kesejajaran serta penekanan teks Ibrani.
