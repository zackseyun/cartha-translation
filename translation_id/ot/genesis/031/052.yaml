  to: Timbunan batu ini adalah saksi, dan tugu batu ini adalah saksi, bahwa aku tidak akan melintasi timbunan batu ini menuju kepadamu, dan bahwa engkau tidak akan melintasi timbunan batu ini dan tugu batu ini menuju kepadaku dengan maksud mencelakakan.[a]
  rationale: Revisi terbatas pada penggantian “menjadi saksi” dengan “adalah saksi” untuk mencerminkan dengan lebih tepat predikat nominal Ibrani dan menghindari kesan bahwa benda-benda itu baru berubah menjadi saksi. Susunan paralel, pengulangan penanda, serta letak frasa tujuan di akhir kalimat dipertahankan sehingga cakupan sintaksis yang mungkin diperdebatkan tidak dipersempit.
