base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Aku melihat bahwa sikap ayah kalian terhadapku tidak lagi seperti dahulu[a], tetapi Allah ayahku telah menyertaiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti kemarin dan tiga hari yang lalu,” sebuah ungkapan Ibrani yang berarti “seperti dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: Lalu ia berkata kepada mereka
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan ucapan langsung. Kata ganti “mereka” merujuk kepada Rahel dan Lea; bahasa Indonesia tidak membedakan gender pada bentuk ini.
- source_word: רֹאֶה אָנֹכִי
  choice: Aku melihat
  rationale: Partisip dengan kata ganti mandiri menyatakan pengamatan Yakub pada saat itu. Bentuk kini sederhana paling wajar dalam bahasa Indonesia.
- source_word: אֶת פְּנֵי אֲבִיכֶן כִּי אֵינֶנּוּ אֵלַי
  choice: bahwa sikap ayah kalian terhadapku tidak lagi
  rationale: Secara harfiah teks menyebut “wajah” yang tidak lagi “tertuju” kepada Yakub, sebuah gambaran Ibrani tentang perubahan sikap atau perkenanan. “Sikap ... terhadapku” menyampaikan maknanya secara alami tanpa menentukan motif batin Laban lebih jauh.
- source_word: כִּתְמֹל שִׁלְשֹׁם
  choice: seperti dahulu
  rationale: Ungkapan Ibrani ini secara harfiah merujuk pada “kemarin dan sebelumnya” dan berarti keadaan pada waktu lampau. “Seperti dahulu” merupakan padanan Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וֵאלֹהֵי אָבִי
  choice: tetapi Allah ayahku
  rationale: Waw dipahami secara adversatif karena dukungan Allah dikontraskan dengan perubahan sikap Laban. Bentuk ini mempertahankan hubungan keluarga dalam konstruksi Ibrani tanpa menambahkan tafsiran teologis.
- source_word: הָיָה עִמָּדִי
  choice: telah menyertaiku
  rationale: Bentuk perfek merangkum penyertaan Allah yang berlangsung hingga saat Yakub berbicara. “Telah menyertaiku” menyampaikan tindakan lampau yang tetap relevan pada masa kini.
theological_decisions:
- issue: Penyebutan ilahi אֱלֹהֵי אָבִי
  choice: Allah ayahku
  alternative: Allah dari ayahku
  rationale: “Allah ayahku” merupakan konstruksi Indonesia yang alami dan dekat dengan hubungan genitif dalam bahasa Ibrani. Terjemahan ini mempertahankan rujukan kekeluargaan dan nuansa perjanjian tanpa memasukkan penafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sikap ayah kalian terhadapku” dipilih sebagai ungkapan alami untuk metafora Ibrani tentang wajah yang tertuju kepada seseorang. “Kalian” memperjelas bahwa Yakub berbicara kepada lebih dari satu orang.
