base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: id
  text: Ia menggiring seluruh ternaknya serta membawa segala harta benda yang telah diperolehnya—yakni ternak yang telah diperolehnya di Padan-Aram—untuk pergi kepada Ishak, ayahnya, ke tanah Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: menggiring ... dan membawa
  rationale: נהג secara langsung cocok dengan tindakan menggiring ternak. Karena objek keduanya adalah harta benda, verba 'membawa' ditambahkan secara idiomatis agar kalimat alami dalam bahasa Indonesia tanpa mengubah tindakan utama.
- source_word: מִקְנֵהוּ
  choice: seluruh ternaknya
  rationale: מִקְנֶה adalah istilah kolektif bagi hewan peliharaan sebagai kekayaan; 'ternak' luas, modern, dan tidak membatasinya pada sapi.
- source_word: רְכֻשׁוֹ
  choice: segala harta
  rationale: רְכוּשׁ menunjuk pada harta atau barang milik, terutama kekayaan yang dapat dibawa. 'Harta' ringkas dan wajar dalam konteks perpindahan rombongan.
- source_word: רָכָשׁ
  choice: telah diperolehnya
  rationale: Pilihan ini mempertahankan makna memperoleh atau mengumpulkan kekayaan serta pengulangan akar רכש dalam ayat.
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: ternak miliknya
  rationale: Frasa ini menegaskan ternak sebagai milik yang diperoleh Yakub. 'Ternak miliknya' mempertahankan penegasan itu tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: בְּפַדַּן אֲרָם
  choice: di Padan-Aram
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang mudah dibaca.
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: untuk pergi kepada Ishak, ayahnya
  rationale: Infinitif לָבוֹא menyatakan tujuan. 'Pergi kepada' mempertahankan orientasi personal אל terhadap Ishak.
- source_word: אַרְצָה כְּנָעַן
  choice: ke tanah Kanaan
  rationale: Akhiran direktif -ָה menyatakan gerak menuju Kanaan; 'ke tanah Kanaan' menyampaikan arah tersebut secara langsung.
