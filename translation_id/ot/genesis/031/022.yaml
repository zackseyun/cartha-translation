  text: Pada hari ketiga, Laban diberi tahu bahwa Yakub telah melarikan diri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberi tahu
  rationale: Bentuk Hofal dari נגד menyatakan bahwa informasi disampaikan kepada Laban. Ungkapan pasif ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: לְלָבָן
  choice: Laban
  rationale: 'Preposisi ל menandai penerima pemberitahuan; dalam susunan pasif bahasa Indonesia, nama ini menjadi subjek gramatikal: “Laban diberi tahu.”'
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Terjemahan ini mempertahankan keterangan waktu secara langsung tanpa menambahkan “setelah itu,” yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi laporan, bukan alasan atau sebab.
- source_word: בָרַח
  choice: telah melarikan diri
  rationale: Kata ברח berarti pergi dengan melarikan diri. Aspek “telah” secara alami menunjukkan bahwa tindakan Yakub terjadi sebelum pemberitahuan itu.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk nama yang lazim dan baku dalam tradisi Alkitab bahasa Indonesia.
