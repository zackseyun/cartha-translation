source:
  edition: WLC
  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: id
  text: Kemudian Yakub mempersembahkan kurban di gunung itu dan memanggil saudara-saudaranya untuk makan bersama.[a] Mereka pun makan dan bermalam di gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk makan roti.” “Saudara-saudaranya” juga dapat berarti kaum kerabat atau orang-orang yang menyertainya.'
    reason: Menjelaskan idiom Ibrani dan mempertahankan keluasan makna אָח dalam konteks.
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: mempersembahkan kurban
  rationale: Konstruksi serumpun Ibrani menyatakan tindakan mempersembahkan atau menyembelih kurban. Ungkapan ini mempertahankan makna ritualnya tanpa menghasilkan pengulangan yang janggal dalam bahasa Indonesia.
- source_word: בָּהָר
  choice: di gunung itu
  rationale: Bentuk definit Ibrani menunjuk kepada gunung yang sudah dikenal dalam konteks; 'di gunung itu' wajar dalam bahasa Indonesia dan dipertahankan pada kedua kemunculannya.
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Secara leksikal berarti 'memanggil'; dalam konteks, panggilan tersebut berfungsi sebagai undangan, tetapi terjemahan utama mempertahankan ungkapan sumber.
- source_word: לְאֶחָיו
  choice: saudara-saudaranya
  rationale: אָח dapat menunjuk saudara kandung maupun kaum kerabat atau rekan laki-laki. Istilah familial sumber dipertahankan, sedangkan keluasan artinya diterangkan dalam catatan kaki.
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: untuk makan bersama / Mereka pun makan
  rationale: Secara harfiah, frasa ini berarti 'makan roti', tetapi merupakan idiom umum untuk makan atau mengambil bagian dalam perjamuan. 'Makan bersama' pada kemunculan pertama mengungkapkan fungsi undangannya, sedangkan 'makan' pada kemunculan kedua mempertahankan pengulangan tindakan secara alami.
- source_word: וַיָּלִינוּ
  choice: bermalam
  rationale: Kata kerja ini berarti tinggal atau menginap semalam; 'bermalam' ringkas, alami, dan tepat.
theological_decisions:
- issue: Cakupan makna 'saudara-saudaranya' dalam konteks perjanjian
  choice: saudara-saudaranya
  alternative: kaum kerabatnya; sanak saudaranya; rekan-rekannya
  rationale: Teks memakai istilah kekerabatan yang dapat memiliki cakupan lebih luas daripada saudara kandung. Terjemahan utama mempertahankan istilah tersebut tanpa menetapkan identitas kelompok secara lebih sempit, dan catatan kaki menjaga ambiguitasnya.
- issue: Sifat makan bersama setelah kurban
  choice: Tidak menyebutnya secara eksplisit sebagai 'perjamuan kurban'
  alternative: perjamuan kurban
  rationale: Konteks memungkinkan kaitan antara kurban dan jamuan, tetapi teks hanya menyatakan bahwa Yakub mempersembahkan kurban lalu mereka makan. Terjemahan tidak menambahkan hubungan teologis yang lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban' dipilih untuk tindakan ritual; 'bermalam' dan 'makan bersama' mudah dipahami pembaca umum. Penanda catatan kaki [a] ditempatkan sesudah frasa yang memuat kedua persoalan leksikal terkait.
