  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan urutan tindakan Ibrani: Yakub mempersembahkan kurban di gunung, memanggil saudara-saudaranya untuk makan, lalu mereka makan dan bermalam di sana. "Mempersembahkan kurban" menyampaikan konstruksi זבח secara idiomatis tanpa menambahkan rincian ritual. "Di gunung itu" mempertahankan rujukan definit dan pengulangannya. Pelonggaran idiom "makan roti" menjadi "makan bersama"/"makan" dapat diterima dalam bahasa Indonesia, dan catatan kaki secara tepat mendokumentasikan bentuk harfiahnya.'
