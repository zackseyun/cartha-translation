  terminology: '"Yakub" dan "kurban" konsisten dengan penggunaan Indonesia yang lazim. Istilah "saudara-saudaranya" mempertahankan istilah kekerabatan sumber, sedangkan catatan kaki menjaga kemungkinan cakupan yang lebih luas—kerabat atau orang yang menyertainya—tanpa memutuskan identitas mereka secara tafsiriah. Jangkar [a] ditempatkan pada frasa yang relevan dan catatan kaki mencakup kedua keputusan leksikal yang dibutuhkan.'
