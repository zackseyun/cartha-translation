id: GEN.31.53
reference: Genesis 31:53
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: id
  text: Kiranya Allah Abraham dan allah Nahor[a], allah ayah mereka,[b] mengadili antara kita. Lalu Yakub bersumpah demi Yang Ditakuti oleh Ishak, ayahnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah Abraham dan Allah Nahor, Allah ayah mereka.” Bahasa Ibrani dapat dipahami sebagai menunjuk kepada Allah yang sama sepanjang rangkaian ini.
    reason: alternative_reading
  - marker: b
    text: Atau, “—allah ayah mereka—.” Frasa ini dapat dibaca sebagai keterangan sisipan.
    reason: alternative_reading
  - marker: c
    text: Secara lebih harfiah, “demi Ketakutan ayahnya, Ishak.” Kata Ibrani yang berarti “ketakutan” atau “kegentaran” digunakan di sini sebagai sebutan yang tidak biasa bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Allah Abraham
  rationale: Bentuk konstruksi ini secara idiomatis menunjuk kepada Allah yang disembah Abraham; 'Allah Abraham' alami dan ringkas dalam bahasa Indonesia Alkitabiah modern.
- source_word: וֵאלֹהֵי נָחוֹר
  choice: dan allah Nahor
  rationale: Huruf kecil mempertahankan ketegangan mengenai apakah ilah Nahor disamakan dengan Allah Abraham; bahasa Ibrani sendiri tidak membedakannya melalui kapitalisasi.
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: allah ayah mereka
  rationale: Frasa ini dapat bersifat aposisional terhadap seruan sebelumnya. Huruf kecil mempertahankan ambiguitas identitas ilahi tanpa mengharmoniskannya.
- source_word: יִשְׁפְּטוּ
  choice: kiranya ... menghakimi
  rationale: 'Imperfek orang ketiga jamak dalam konteks seruan sumpah paling wajar dipahami sebagai harapan atau permohonan: ''kiranya ... menghakimi''. Bentuk verba Indonesia tidak menandai jumlah.'
- source_word: בֵינֵינוּ
  choice: di antara kita
  rationale: Padanan langsung dan alami untuk relasi timbal balik antara kedua pihak.
- source_word: וַיִּשָּׁבַע
  choice: Lalu ... bersumpah
  rationale: Waw naratif menyambungkan tindakan Yakub dengan ucapan sebelumnya; 'lalu' mengungkapkan urutan naratif secara wajar.
- source_word: בְּפַחַד
  choice: demi Yang Ditakuti
  rationale: פַחַד secara harfiah berarti 'ketakutan/kegentaran' dan di sini menjadi sebutan ilahi. 'Yang Ditakuti' mempertahankan keanehan sebutan itu sambil terdengar lebih alami daripada menjadikan nomina abstrak 'Ketakutan' sebagai nama.
- source_word: אָבִיו יִצְחָק
  choice: oleh Ishak, ayahnya
  rationale: Susunan ini memperjelas bahwa 'ayahnya' merujuk kepada Ishak dan bahwa Ishaklah yang takut/gentar kepada sosok ilahi tersebut.
theological_decisions:
- issue: Apakah semua sebutan ilahi dalam seruan Laban harus diidentifikasi sebagai Allah yang sama
  choice: Membedakan 'Allah Abraham' dari 'allah Nahor' dan 'allah ayah mereka' melalui kapitalisasi, serta memberi catatan alternatif.
  alternative: Menggunakan 'Allah' dengan huruf besar untuk seluruh rangkaian sebagai satu identitas ilahi.
  rationale: Pengulangan אֱלֹהֵי, verba jamak יִשְׁפְּטוּ, dan perbedaan antara seruan Laban dengan sumpah Yakub memungkinkan ketegangan identitas yang tidak patut diselesaikan diam-diam dalam terjemahan.
- issue: Makna dan bentuk sebutan בְּפַחַד אָבִיו יִצְחָק
  choice: demi Yang Ditakuti oleh Ishak, ayahnya
  alternative: demi Ketakutan ayahnya, Ishak
  rationale: Terjemahan utama mempertahankan fungsi sebutan ilahi dan unsur rasa takut/gentar, tetapi menghindari ungkapan Indonesia yang dapat keliru dipahami sebagai emosi abstrak milik Ishak. Catatan kaki menyediakan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi sengaja membedakan pembacaan utama tanpa menutupi alternatif dalam catatan kaki. 'Yang Ditakuti' dipilih sebagai optimal-equivalence untuk sebutan ilahi yang khas, sementara bentuk harfiahnya dicatat.
