revisions:
- from: Kiranya Allah Abraham dan allah Nahor[a], allah ayah mereka,[b] menghakimi di antara kita. Lalu Yakub bersumpah demi Yang Ditakuti oleh Ishak, ayahnya.[c]
  to: Kiranya Allah Abraham dan allah Nahor[a], allah ayah mereka,[b] mengadili antara kita. Lalu Yakub bersumpah demi Yang Ditakuti oleh Ishak, ayahnya.[c]
