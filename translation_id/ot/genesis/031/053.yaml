    issue: Padanan "menghakimi di antara kita" kurang alami dan kurang tepat nuansanya.
    rationale: יִשְׁפְּטוּ בֵּינֵינוּ berarti memutuskan/mengadili perkara antara kedua pihak. Dalam bahasa Indonesia, "mengadili antara kita" lebih idiomatis untuk fungsi ini, sedangkan "menghakimi di antara kita" dapat terdengar sebagai tindakan mengutuk yang berlangsung di tengah mereka.
  - severity: medium
    issue: Catatan kaki a tidak menyebut frasa "Allah ayah mereka" dalam alternatif yang diklaim sebagai pembacaan seluruh rangkaian.
    rationale: 'Alternatif sumber mencakup tiga sebutan: Allah Abraham, Allah Nahor, dan Allah ayah mereka. Menghilangkan unsur ketiga membuat catatan tidak lengkap dan kurang akurat terhadap struktur sumber.'
