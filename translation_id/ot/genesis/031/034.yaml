base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: id
  text: Rahel telah mengambil berhala-berhala rumah tangga[a] itu, menaruhnya di dalam bantalan pelana unta[b], lalu duduk di atas berhala-berhala itu. Laban meraba-raba seluruh kemah, tetapi tidak menemukan berhala-berhala itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terafim” atau “dewa-dewa rumah tangga.” Istilah Ibrani ini menunjuk pada benda-benda pemujaan rumah tangga.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di pelana unta” atau “di antara perlengkapan pelana unta.” Kata Ibraninya kemungkinan menunjuk pada bagian empuk dari perlengkapan tunggangan unta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: berhala-berhala rumah tangga
  rationale: Istilah תְּרָפִים menunjuk pada benda-benda pemujaan atau representasi ilahi yang dimiliki suatu rumah tangga. Pilihan ini jelas bagi pembaca modern dan mempertahankan bentuk jamaknya tanpa memakai transliterasi yang kurang dikenal.
- source_word: בְּכַר הַגָּמָל
  choice: di dalam bantalan pelana unta
  rationale: כַּר berarti bantalan atau bagian berlapis empuk; dalam konteks unta, frasa ini kemungkinan menunjuk pada bantalan yang menjadi bagian dari perlengkapan pelananya. Kata depan בְּ dipertahankan dengan 'di dalam', selaras dengan tindakan menyembunyikan benda-benda itu.
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: lalu duduk di atasnya
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan. 'Di atasnya' mempertahankan hubungan fisik yang dinyatakan oleh עַל dan secara wajar merujuk kepada benda-benda yang baru disembunyikan.
- source_word: וַיְמַשֵּׁשׁ
  choice: meraba-raba
  rationale: Kata kerja משׁשׁ menekankan pencarian dengan sentuhan, bukan sekadar pencarian secara umum. 'Meraba-raba' menyampaikan nuansa taktil tersebut secara alami dalam bahasa Indonesia.
- source_word: כָּל הָאֹהֶל
  choice: seluruh kemah
  rationale: Ungkapan ini secara idiomatis berarti keseluruhan bagian kemah; 'seluruh kemah' ringkas dan alami.
- source_word: וְלֹא מָצָא
  choice: tetapi tidak menemukannya
  rationale: Objek tidak disebutkan ulang dalam bahasa Ibrani, tetapi dapat dinyatakan secara wajar dalam bahasa Indonesia dengan '-nya', yang merujuk kepada berhala-berhala itu. 'Tetapi' menampilkan hasil pencarian yang berlawanan dengan harapan.
- source_word: וְרָחֵל לָקְחָה
  choice: Rahel telah mengambil
  rationale: Waw awal tidak diterjemahkan dengan penanda waktu tambahan. Bentuk perfektum di sini memberi latar bagi pencarian Laban, sehingga 'telah mengambil' menunjukkan bahwa tindakan Rahel mendahului pencarian itu.
