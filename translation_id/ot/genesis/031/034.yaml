translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Urutan tindakan dibuat alami dengan 'telah ... menaruhnya ... lalu', sedangkan nuansa pencarian melalui sentuhan dipertahankan lewat 'meraba-raba'.
