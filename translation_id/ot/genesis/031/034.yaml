  terminology: '"Berhala-berhala rumah tangga" adalah padanan yang jelas untuk terafim dan catatan kaki dengan tepat mempertahankan "terafim" sebagai alternatif. "Bantalan pelana unta" juga merupakan pilihan yang wajar bagi כַּר dalam konteks ini.'
