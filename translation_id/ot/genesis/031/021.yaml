  source_fidelity: 'Teks dengan setia menyampaikan rangkaian tindakan Ibrani: Yakub melarikan diri dengan semua yang menjadi miliknya, berangkat, menyeberangi sungai tertentu, dan mengarahkan dirinya menuju kawasan Gilead. Penyebutan nama Yakub memperjelas subjek tanpa mengubah makna. "Sungai itu" mempertahankan ketertentuan הַנָּהָר tanpa menjadikan identifikasi Efrat sebagai kepastian dalam teks utama.'
  naturalness: Bahasa Indonesia baku, modern, dan lancar. "Melarikan diri bersama segala miliknya," "Ia berangkat," serta "mengarahkan perjalanannya ke pegunungan Gilead" wajar dalam narasi. Pemenggalan menjadi beberapa kalimat tetap mempertahankan urutan naratif sumber.
  terminology: '"Yakub," "Sungai Efrat," dan "Gilead" sudah tepat. "Pegunungan Gilead" secara wajar menyampaikan arti regional הַר הַגִּלְעָד dan tidak memaksakan pembacaan sebagai satu gunung. Catatan kaki secara tepat menyatakan bahwa Efrat adalah identifikasi yang mungkin, bukan isi eksplisit teks Ibrani.'
