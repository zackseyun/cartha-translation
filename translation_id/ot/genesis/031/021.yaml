  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּבְרַ֥ח הוּא֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּ֖קָם וַ/יַּעֲבֹ֣ר אֶת הַ/נָּהָ֑ר וַ/יָּ֥שֶׂם אֶת פָּנָ֖י/ו הַ֥ר הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: id
  text: Maka Yakub melarikan diri bersama segala miliknya. Ia berangkat, menyeberangi Sungai itu,[a] lalu mengarahkan perjalanannya ke pegunungan Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyeberangi Sungai Efrat”; teks Ibrani hanya menyebut “Sungai itu”, kemungkinan besar merujuk kepada Sungai Efrat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Kata ברח menyatakan tindakan lari atau meloloskan diri; pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesan keberangkatan secara diam-diam tanpa menambahkan motif.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: bersama segala miliknya
  rationale: Ungkapan ini mencakup semua yang menjadi kepunyaan Yakub, baik rumah tangga maupun harta, tanpa mempersempit cakupannya.
- source_word: וַיָּקָם
  choice: Ia berangkat
  rationale: Dalam rangkaian narasi, קום sering menandai dimulainya tindakan atau perjalanan. 'Berangkat' menyampaikan fungsi kontekstualnya secara wajar, sedangkan terjemahan harfiah 'bangkit' terasa kurang alami di sini.
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: menyeberangi Sungai itu
  rationale: עבר berarti menyeberang atau melintas. Bentuk tentu הַנָּהָר menunjuk kepada sungai yang dikenal dalam konteks, kemungkinan besar Sungai Efrat; teks utama mempertahankan penyebutan Ibraninya tanpa mengganti dengan nama yang tersirat.
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: mengarahkan perjalanannya ke
  rationale: Idiom harfiahnya ialah 'menetapkan wajahnya'. Pilihan ini mempertahankan gagasan orientasi yang disengaja dengan ungkapan Indonesia yang alami.
- source_word: הַר הַגִּלְעָד
  choice: pegunungan Gilead
  rationale: Kata הַר dapat menunjuk gunung atau kawasan bergunung-gunung. Dalam konteks geografis ini, makna kawasan paling sesuai dan tidak menyiratkan satu puncak tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama Yakub disebut untuk memperjelas subjek ayat yang dalam bahasa Ibrani dinyatakan dengan kata ganti. Ungkapan idiomatis disampaikan secara alami tanpa menghilangkan arah dan kesengajaan tindakan. Penanda catatan kaki [a] dicantumkan dalam teks utama.
