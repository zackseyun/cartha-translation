  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: id
  text: Ternak yang diterkam binatang buas tidak kubawa kepadamu; aku sendiri yang menanggung kerugiannya.[a] Ternak yang dicuri pada siang hari dan yang dicuri pada malam hari pun Engkau tuntut pertanggungjawabannya dariku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku sendiri yang mengganti kerugiannya.” Kata kerja Ibrani di sini menyatakan bahwa Yakub menanggung kewajiban atas ternak yang hilang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Dari tanganku engkau menuntutnya—yang dicuri pada siang hari dan yang dicuri pada malam hari.” Ungkapan “dari tanganku” menyatakan pertanggungjawaban pribadi.
    reason: source_idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: ternak yang diterkam binatang buas
  rationale: Dalam konteks penggembalaan, kata ini menunjuk pada ternak yang dicabik atau diterkam hewan pemangsa. Pilihan ini memperjelas rujukannya tanpa menghilangkan gambaran konkret teks Ibrani.
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: tidak kubawa kepadamu
  rationale: Ungkapan ini secara langsung berarti membawa sesuatu kepada seseorang. Objeknya dipahami dari frasa sebelumnya, yaitu ternak yang diterkam.
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: aku sendiri yang menanggung kerugiannya
  rationale: Kata ganti mandiri אָנֹכִי memberi penekanan pada Yakub. Bentuk Piel dari חטא di sini menyatakan bahwa ia menanggung tanggung jawab atau kerugian atas ternak tersebut, bukan bahwa ia 'berbuat dosa'.
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: Engkau menuntut pertanggungjawabannya dariku
  rationale: Secara harfiah frasa ini berbunyi 'engkau menuntutnya dari tanganku'. Dalam konteks ini, 'dari tangan' merupakan idiom tanggung jawab pribadi; terjemahan yang dipilih menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: baik untuk ternak yang dicuri pada siang hari maupun yang dicuri pada malam hari
  rationale: Dua frasa sejajar ini mencakup kehilangan akibat pencurian pada siang dan malam hari. Bentuk 'baik ... maupun ...' mempertahankan cakupan gabungan dari waw Ibrani dan tidak menjadikannya pilihan yang saling meniadakan.
