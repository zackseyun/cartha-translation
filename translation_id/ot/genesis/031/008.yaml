base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: id
  text: Jika ia berkata, ‘Yang berbintik-bintik akan menjadi upahmu,’ maka seluruh kawanan itu melahirkan anak-anak berbintik-bintik; dan jika ia berkata, ‘Yang berbelang akan menjadi upahmu,’ maka seluruh kawanan itu melahirkan anak-anak berbelang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: yang berbintik-bintik
  rationale: Menunjukkan hewan yang memiliki bercak atau bintik pada bulunya; bentuk ini dibedakan dari עֲקֻדִּים.
- source_word: עֲקֻדִּים
  choice: yang berbelang
  rationale: Menunjukkan hewan dengan tanda berupa jalur atau belang, sehingga kontras leksikal dengan נְקֻדִּים tetap terpelihara.
- source_word: שְׂכָרֶךָ
  choice: upahmu
  rationale: Padanan langsung dan alami untuk imbalan kerja yang menjadi milik Yakub.
- source_word: וְיָלְדוּ כָל־הַצֹּאן
  choice: seluruh kawanan itu melahirkan anak-anak
  rationale: Mengungkapkan bahwa hewan-hewan betina dalam kawanan menghasilkan keturunan dengan ciri yang disebutkan; 'anak-anak' melengkapi objek yang tersirat secara alami dalam bahasa Indonesia.
- source_word: כֹּה יֹאמַר
  choice: dia berkata begini
  rationale: כֹּה memperkenalkan isi ucapan berikutnya; 'begini' alami dalam bahasa Indonesia dan mempertahankan fungsi deiktiknya.
