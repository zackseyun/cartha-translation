base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Yakub, “Kembalilah ke negeri leluhurmu dan kepada kaum kerabatmu[a], dan Aku akan menyertaimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat asalmu” atau “tanah kelahiranmu”; kata Ibrani ini dapat menunjuk kepada kaum kerabat ataupun tempat asal seseorang, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi, sehingga “Kemudian” menyampaikan gerak cerita secara alami. Karena subjeknya Yahweh dan isinya merupakan perkataan ilahi langsung, “berfirman” sesuai dengan ragam Indonesia yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: שׁוּב
  choice: Kembalilah
  rationale: Bentuk imperatif dari שוב menyatakan perintah untuk kembali; “Kembalilah” alami dan mempertahankan daya perintahnya.
- source_word: אֶל אֶרֶץ אֲבוֹתֶיךָ
  choice: ke negeri leluhurmu
  rationale: Ungkapan ini secara harfiah menunjuk pada negeri para bapak/leluhur Yakub. “Negeri leluhurmu” merupakan padanan Indonesia yang alami dan mencakup hubungan antargenerasi yang dimaksud.
- source_word: וּלְמוֹלַדְתֶּךָ
  choice: dan kepada kaum kerabatmu[a]
  rationale: מוֹלֶדֶת dapat menunjuk pada kelompok kerabat maupun tempat asal. Dalam pasangan dengan “negeri leluhurmu”, “kaum kerabatmu” mempertahankan nuansa hubungan keluarga, sementara ambiguitas geografis dicatat dalam catatan kaki.
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: dan Aku akan menyertaimu
  rationale: Ungkapan ini merupakan janji kehadiran ilahi. “Aku akan menyertaimu” lebih alami dalam bahasa Indonesia daripada terjemahan kaku “Aku akan ada denganmu”, tanpa mengubah maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk “Yahweh” mempertahankan nama ilahi alih-alih menggantinya dengan sebuah gelar.
- issue: Makna janji וְאֶהְיֶה עִמָּךְ
  choice: Aku akan menyertaimu
  alternative: Aku akan ada bersamamu
  rationale: Pilihan ini menyampaikan janji kehadiran dan pertolongan ilahi secara wajar, tanpa menambahkan rincian mengenai bentuk penyertaan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti perkembangan narasi Ibrani, sedangkan ungkapan yang terlalu harfiah disesuaikan agar jelas bagi pembaca umum. Ambiguitas מוֹלֶדֶת dipertahankan melalui catatan kaki.
