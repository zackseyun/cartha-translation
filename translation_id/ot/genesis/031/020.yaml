  text: And Jacob deceived Laban the Aramean by not telling him that he was fleeing[a].
translation:
  language: id
  text: Yakub memperdaya Laban, orang Aram itu, dengan tidak memberitahunya bahwa ia sedang melarikan diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yakub mencuri hati Laban, orang Aram itu,” sebuah ungkapan Ibrani yang berarti bahwa Yakub memperdayanya atau bertindak tanpa sepengetahuannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב ... אֶת־לֵב
  choice: memperdaya
  rationale: Ungkapan Ibrani harfiah 'mencuri hati' di sini berarti bertindak diam-diam sehingga menipu atau membuat seseorang tidak menyadari tindakan itu. 'Memperdaya' menyampaikan makna idiomatis tanpa menimbulkan kesan mencuri kasih sayang.
- source_word: הָאֲרַמִּי
  choice: orang Aram itu
  rationale: Menunjukkan identitas etnis/geografis Laban secara langsung dan lebih tepat daripada sebutan tradisional 'orang Siria'.
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: dengan tidak memberi tahu kepadanya
  rationale: Mempertahankan fungsi frasa sebagai penjelasan tentang cara Yakub memperdaya Laban.
- source_word: כִּי בֹרֵחַ הוּא
  choice: bahwa ia sedang melarikan diri
  rationale: Bentuk partisip menyatakan tindakan yang sedang berlangsung; 'sedang melarikan diri' mempertahankan aspek tersebut secara wajar dalam bahasa Indonesia.
