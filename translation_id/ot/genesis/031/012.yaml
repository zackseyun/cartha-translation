  text: וַ/יֹּ֗אמֶר שָׂא נָ֨א עֵינֶ֤י/ךָ וּ/רְאֵה֙ כָּל הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כָּל אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: id
  text: 'Lalu Ia berkata, “Angkatlah pandanganmu dan lihatlah: semua kambing jantan yang sedang mengawini kawanan itu[a] bergaris-garis[b], berbintik-bintik, dan bercak-bercak, sebab Aku telah melihat segala yang sedang Laban lakukan terhadapmu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menaiki kawanan itu.” Ungkapan Ibrani ini merupakan idiom pembiakan hewan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “berbelang-belang” atau “berjalur.” Makna tepat istilah Ibraninya tidak sepenuhnya pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Coba angkat pandanganmu
  rationale: Ungkapan שָׂא ... עֵינֶיךָ berarti mengangkat pandangan atau melihat ke atas. “Coba” menyampaikan partikel permohonan נָא secara wajar dalam bahasa Indonesia modern.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif langsung ini mempertahankan penekanan visual dalam adegan mimpi.
- source_word: הָעַתֻּדִים
  choice: kambing jantan
  rationale: עַתּוּד lazimnya menunjuk pada kambing jantan; “domba jantan” akan mempersempit makna ke jenis hewan lain.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: yang sedang mengawini kawanan itu
  rationale: Dalam konteks pembiakan hewan, ungkapan עָלָה עַל merupakan idiom untuk menaiki atau mengawini. Pilihan ini menyampaikan maksudnya dengan jelas dan alami.
- source_word: עֲקֻדִּים
  choice: bercoreng
  rationale: Kata ini menggambarkan tanda memanjang atau berjalur pada tubuh hewan. “Bercoreng” cukup alami dan membantu membedakannya dari dua pola berikutnya.
- source_word: נְקֻדִּים
  choice: berbintik-bintik
  rationale: Istilah ini menunjuk pada pola berupa bintik-bintik kecil.
- source_word: וּבְרֻדִּים
  choice: berbelang-belang
  rationale: Bentuk ini menggambarkan warna yang beraneka atau bercak-bercak. “Berbelang-belang” mudah dipahami, meskipun batas tepat antara ketiga istilah pola tersebut tidak sepenuhnya pasti.
- source_word: כִּי רָאִיתִי
  choice: sebab Aku telah melihat
  rationale: “Sebab” mempertahankan hubungan kausal כִּי, sedangkan “telah melihat” mencerminkan bentuk perfektif dengan relevansi pada keadaan sekarang.
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: semua yang Laban lakukan terhadapmu
  rationale: Partisipel עֹשֶׂה menggambarkan tindakan Laban sebagai perlakuan yang berlangsung atau berulang. “Terhadapmu” menangkap bahwa Yakub adalah pihak yang terkena tindakan itu tanpa menambahkan penilaian yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Kapitalisasi kata ganti bagi pembicara ilahi
  choice: Ia/Aku
  alternative: ia/aku
  rationale: Konteks mengidentifikasi pembicara sebagai pribadi ilahi dalam mimpi. Kapitalisasi mengikuti konvensi umum bahasa Indonesia sebagai penghormatan, tanpa mengubah identitas atau menambahkan gelar ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Coba” dipakai sebagai partikel permohonan yang alami; istilah pola bulu dibuat cukup berbeda satu sama lain sambil mengakui ketidakpastian leksikal melalui catatan kaki.
