revisions:
- from: 'Lalu Ia berkata, “Coba angkat pandanganmu dan lihatlah: semua kambing jantan yang sedang mengawini kawanan itu[a] bercoreng[b], berbintik-bintik, dan berbelang-belang, sebab Aku telah melihat semua yang Laban lakukan terhadapmu.”'
  to: 'Lalu Ia berkata, “Angkatlah pandanganmu dan lihatlah: semua kambing jantan yang sedang mengawini kawanan itu[a] bergaris-garis[b], berbintik-bintik, dan bercak-bercak, sebab Aku telah melihat segala yang sedang Laban lakukan terhadapmu.”'
  rationale: Revisi mengganti “bercoreng” dengan “bergaris-garis” agar lebih dekat dengan makna pola berjalur dari עֲקֻדִּים, sambil mempertahankan ketidakpastian leksikal dalam catatan kaki. “Bercak-bercak” membedakan istilah ketiga dari “berbintik-bintik.” Imperatif awal diselaraskan dengan register yang lebih wajar, dan bentuk progresif ditambahkan pada tindakan Laban untuk mencerminkan partisipel Ibrani.
