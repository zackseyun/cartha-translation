- from: 'Ketika kawanan ternak itu sedang kawin, aku mengangkat mataku dan melihat dalam mimpi: tampaklah kambing-kambing jantan yang menaiki kawanan itu bercorak belang[a], berbintik-bintik, dan berloreng[b].'
  to: 'Pada waktu kawanan itu sedang kawin, aku mengangkat mataku dan melihat dalam mimpi, dan tampaklah kambing-kambing jantan yang menaiki kawanan itu: berbelang-belang[a], berbintik-bintik, dan bercorak campuran[b].'
