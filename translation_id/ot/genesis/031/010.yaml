base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: id
  text: 'Pada waktu kawanan itu sedang kawin, aku mengangkat mataku dan melihat dalam mimpi, dan tampaklah kambing-kambing jantan yang menaiki kawanan itu: berbelang-belang[a], berbintik-bintik, dan bercorak campuran[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergelang-gelang.” Kata Ibrani ini menunjuk pada tanda berbentuk pita atau garis pada tubuh hewan.
    reason: lexical_alternative
  - marker: b
    text: Atau “bercorak tidak merata.” Ketiga istilah Ibrani ini tampaknya menggambarkan corak bulu yang berbeda-beda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: Ketika
  rationale: Gabungan formula naratif dan frasa waktu ini secara alami menyatakan saat terjadinya peristiwa; bahasa Indonesia tidak perlu mempertahankan formula harfiah 'dan terjadilah pada waktu'.
- source_word: יַחֵם הַצֹּאן
  choice: kawanan ternak itu sedang kawin
  rationale: Dalam konteks pembiakan, verba יחם menunjuk pada birahi atau aktivitas kawin. 'Sedang kawin' jelas, alami, dan tidak menyatakan hasil berupa kebuntingan.
- source_word: וָאֶשָּׂא עֵינַי
  choice: aku mengangkat mataku
  rationale: Mempertahankan idiom Ibrani yang masih dapat dipahami secara alami dalam bahasa Indonesia dan memberi nuansa tindakan mengarahkan pandangan.
- source_word: וָאֵרֶא בַּחֲלוֹם
  choice: dan melihat dalam mimpi
  rationale: Menunjukkan bahwa mimpi adalah medium penglihatan tanpa menambahkan ketentuan yang tidak ada dalam sumber.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Menyampaikan fungsi presentatif yang hidup dan unsur keterkejutan dari הִנֵּה dengan ungkapan Indonesia yang bermartabat dan tidak arkais berlebihan.
- source_word: הָעַתֻּדִים
  choice: kambing-kambing jantan
  rationale: Istilah ini secara khusus menunjuk kambing jantan, terutama dalam konteks pembiakan.
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: yang menaiki kawanan itu
  rationale: Mempertahankan gambaran konkret ungkapan Ibrani bagi tindakan pejantan menaiki betina saat kawin, tanpa memperhalusnya menjadi istilah yang lebih abstrak.
- source_word: עֲקֻדִּים
  choice: bercorak belang
  rationale: Kata ini menunjuk tanda berupa pita, gelang, atau garis pada tubuh hewan. 'Bercorak belang' mudah dipahami sambil membiarkan rincian bentuk tandanya dijelaskan dalam catatan.
- source_word: נְקֻדִּים
  choice: berbintik-bintik
  rationale: Menyatakan corak berupa titik atau bintik dan membedakannya dari dua istilah corak lain.
- source_word: וּבְרֻדִּים
  choice: berloreng
  rationale: Menyatakan warna atau corak campuran/tidak merata dan mempertahankan perbedaan leksikal dari 'berbintik-bintik'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur dibuat alami bagi pembaca umum, sementara idiom penglihatan dan gambaran konkret tentang perkawinan ternak dipertahankan. Semua penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
