  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: id
  text: Lalu Yakub mengambil sebuah batu dan mendirikannya sebagai tugu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu tegak” atau “batu peringatan.” Kata Ibrani מַצֵּבָה berarti batu penanda atau tugu yang didirikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Bentuk wayyiqtol Qal dari לקח lazim berarti ‘mengambil’; padanan ini alami dan tepat dalam narasi Indonesia.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אָבֶן
  choice: sebuah batu
  rationale: Nomina tunggal ini menunjuk pada satu batu; ‘sebuah’ menyatakannya secara alami dalam bahasa Indonesia.
- source_word: וַיְרִימֶהָ
  choice: mendirikannya
  rationale: Kata kerja dengan akhiran feminin tunggal merujuk kembali kepada batu dan dalam konteks ini menyatakan tindakan menegakkan atau memasangnya dalam posisi berdiri.
- source_word: מַצֵּבָה
  choice: sebagai tugu
  rationale: מַצֵּבָה adalah batu yang didirikan sebagai penanda atau pilar. ‘Tugu’ ringkas dan alami, tanpa memastikan fungsi peringatan atau fungsi keagamaan yang tidak dinyatakan secara eksplisit dalam ayat ini.
theological_decisions:
- issue: Makna מַצֵּבָה ketika batu tegak dapat memiliki fungsi peringatan atau keagamaan
  choice: tugu
  alternative: batu tegak; batu peringatan
  rationale: Ayat ini hanya menyebut tindakan mendirikan batu dan belum secara eksplisit menetapkan makna keagamaannya. ‘Tugu’ mempertahankan cakupan leksikal tanpa mengimpor penafsiran yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. ‘Lalu’ menjaga alur naratif, sedangkan ‘mendirikannya sebagai tugu’ menyampaikan struktur predikatif teks Ibrani secara alami.
