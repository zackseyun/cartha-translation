  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: id
  text: Karena engkau telah menggeledah semua barangku, apa yang kaudapati dari semua barang milik rumah tanggamu? Taruhlah itu di sini di hadapan saudara-saudaraku dan saudara-saudaramu, dan biarlah mereka mengadili perkara antara kita berdua.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “biarlah mereka memutuskan di antara kita berdua.” Kata kerja Ibrani dapat mengandung arti mengadili atau menengahi suatu perselisihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: telah menggeledah
  rationale: Kata kerja ini secara harfiah berkaitan dengan meraba atau memeriksa dengan tangan; dalam konteks mencari barang curian, “menggeledah” menyampaikan pemeriksaan menyeluruh secara alami.
- source_word: כָּל כֵּלַי
  choice: semua barangku
  rationale: כְּלִי mencakup berbagai barang atau benda milik; “barang” cukup luas dan sesuai dengan konteks harta bergerak.
- source_word: מַה מָּצָאתָ
  choice: apa yang kaudapati
  rationale: Menerjemahkan pertanyaan dan verba perfektif secara langsung, dengan diksi yang tetap wajar dan bermartabat.
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: dari antara segala barang rumahmu
  rationale: 'Preposisi מִן dipahami secara partitif: barang apa dari keseluruhan milik rumah tangga Laban yang ditemukan. Pengulangan “barang” mempertahankan pengulangan leksikal Ibrani.'
- source_word: שִׂים כֹּה
  choice: Taruhlah itu di sini
  rationale: Perintah untuk memperlihatkan secara terbuka barang apa pun yang diklaim ditemukan; “taruhlah” alami dalam bahasa Indonesia modern.
- source_word: נֶגֶד
  choice: di hadapan
  rationale: Menunjukkan penempatan di depan atau dalam kehadiran para saksi.
- source_word: אַחַי וְאַחֶיךָ
  choice: saudara-saudaraku dan saudara-saudaramu
  rationale: Mempertahankan istilah kekerabatan biasa dalam bahasa sumber tanpa mempersempit atau memperluasnya secara tidak perlu.
- source_word: וְיוֹכִיחוּ
  choice: supaya mereka mengadili perkara
  rationale: 'Bentuk Hifil di sini memiliki nuansa forensik: memutuskan atau mengadili perselisihan. Tambahan “perkara” membuat maksudnya alami dalam bahasa Indonesia tanpa menentukan hasilnya.'
- source_word: בֵּין שְׁנֵינוּ
  choice: di antara kita berdua
  rationale: Mempertahankan penegasan eksplisit bahwa perselisihan itu melibatkan kedua pihak.
theological_decisions:
- issue: Peran para saudara sebagai pihak penengah
  choice: supaya mereka mengadili perkara di antara kita berdua
  alternative: biarlah mereka memutuskan di antara kita berdua
  rationale: Pilihan utama mempertahankan nuansa yudisial יכח sekaligus tidak menyiratkan lembaga pengadilan formal; alternatif “memutuskan” juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Bentuk terikat “kaudapati” dipakai secara wajar; “saudara-saudara” mempertahankan bahasa kekerabatan sumber, yang dalam konteks dapat mencakup kaum kerabat.
