review_pass:
  verdict: revise
  source_fidelity: 'Teks ini pada dasarnya setia pada Ibrani: מִשַּׁשְׁתָּ dipahami sebagai penggeledahan/pencarian menyeluruh, כְּלִי sebagai barang milik, dan וְיוֹכִיחוּ sebagai tindakan mengadili atau memutuskan perselisihan. Namun, “dari antara segala barang rumahmu” kurang alami dan dapat mengaburkan hubungan partitif yang dimaksud: barang milik rumah tangga Laban manakah yang ditemukan di antara barang Yakub.'
  naturalness: “Karena engkau telah menggeledah” dan “Taruhlah itu di sini di hadapan” baku dan jelas. “Apa yang kaudapati dari antara segala barang rumahmu?” terasa kaku dalam bahasa Indonesia modern. Selain itu, koordinasi Ibrani lebih baik dipertahankan dengan “biarlah mereka ...” daripada klausa tujuan “supaya mereka ...”.
  terminology: “Barang,” “saudara-saudaraku,” dan “saudara-saudaramu” sesuai dengan cakupan istilah Ibrani tanpa penafsiran berlebihan. “Rumah tanggamu” menjelaskan בֵּיתֶךָ secara alami sebagai satuan milik/keluarga, bukan semata-mata bangunan. “Mengadili perkara” secara wajar menyampaikan nuansa forensik tanpa mengandaikan lembaga pengadilan formal.
  issues:
  - severity: medium
    issue: Frasa “dari antara segala barang rumahmu” tidak alami dan kurang jelas.
    rationale: 'מִכֹּל כְּלֵי בֵיתֶךָ bersifat partitif: pertanyaannya menuntut penyebutan barang apa yang berasal dari seluruh harta rumah tangga Laban. “Dari semua barang milik rumah tanggamu” menyampaikan hubungan ini dengan lebih jelas.'
  - severity: low
    issue: “Supaya mereka mengadili perkara” mengubah dorongan/jusif menjadi klausa tujuan.
    rationale: וְיוֹכִיחוּ secara lebih langsung berbunyi “dan biarlah mereka mengadili/memutuskan.” Bentuk ini juga lebih lancar dalam dialog langsung.
  revised_text: Karena engkau telah menggeledah semua barangku, apa yang kaudapati dari semua barang milik rumah tanggamu? Taruhlah itu di sini di hadapan saudara-saudaraku dan saudara-saudaramu, dan biarlah mereka mengadili perkara antara kita berdua.[a]
  revised_footnotes:
