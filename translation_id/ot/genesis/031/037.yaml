revisions:
- from: Karena engkau telah menggeledah semua barangku, apa yang kaudapati dari antara segala barang rumahmu? Taruhlah itu di sini di hadapan saudara-saudaraku dan saudara-saudaramu, supaya mereka mengadili perkara di antara kita berdua.[a]
  to: Karena engkau telah menggeledah semua barangku, apa yang kaudapati dari semua barang milik rumah tanggamu? Taruhlah itu di sini di hadapan saudara-saudaraku dan saudara-saudaramu, dan biarlah mereka mengadili perkara antara kita berdua.[a]
  rationale: Revisi memperjelas frasa partitif mengenai barang milik rumah tangga Laban, serta memulihkan kekuatan langsung dari bentuk jusif Ibrani pada klausa terakhir. Makna, register, pengulangan “barang,” dan ambiguitas leksikal pada kata kerja pengadilan tetap dipertahankan.
