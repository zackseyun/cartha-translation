  terminology: Istilah 'Allah,' 'Kegentaran Ishak,' 'kesengsaraan,' dan 'jerih payah' konsisten dengan makna sumber dan register yang dituju. Kapitalisasi 'Kegentaran Ishak' tepat untuk menandai fungsi frasa itu sebagai gelar ilahi yang khas. Catatan kaki menjelaskan alternatif tanpa memaksakan tafsiran.
