  source_fidelity: Teks Indonesia secara akurat mempertahankan struktur pengandaian kontrafaktual dalam Ibrani, identitas ilahi rangkap, idiom 'Kegentaran Ishak,' pemulangan dengan tangan hampa, serta pasangan 'kesengsaraan' dan 'jerih payah tangan.' 'Ia menjatuhkan putusan' merupakan pilihan yang sah untuk וַיּוֹכַח dan, dengan tidak menambahkan objek, menjaga ketidakjelasan yang ada dalam teks Ibrani.
