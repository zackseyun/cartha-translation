id: GEN.31.42
reference: Genesis 31:42
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: id
  text: Sekiranya Allah ayahku, Allah Abraham, dan Kegentaran Ishak[a] tidak menyertaiku, tentu sekarang engkau sudah menyuruhku pergi dengan tangan hampa. Allah melihat kesengsaraanku dan jerih payah tanganku, lalu tadi malam Ia menjatuhkan putusan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia yang ditakuti Ishak.” Secara harfiah bahasa Ibrani berbunyi “Kegentaran Ishak,” sebuah gelar yang khas bagi Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לוּלֵי
  choice: Sekiranya ... tidak
  rationale: Menandai syarat yang berlawanan dengan kenyataan dan terdengar alami dalam bahasa Indonesia.
- source_word: אֱלֹהֵי אָבִי
  choice: Allah ayahku
  rationale: Mempertahankan hubungan konstruksi Ibrani secara ringkas serta kaitannya dengan Allah leluhur Yakub.
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: Allah Abraham
  rationale: Padanan langsung dan lazim bagi frasa konstruksi Ibrani.
- source_word: וּפַחַד יִצְחָק
  choice: dan Kegentaran Ishak
  rationale: Mempertahankan gelar ilahi yang khas dan ketegangan ungkapan Ibraninya; tafsiran yang lebih eksplisit dicantumkan dalam catatan kaki.
- source_word: הָיָה לִי
  choice: menyertaiku
  rationale: Dalam konteks ini, idiom 'ada bagiku' menyatakan kehadiran dan pertolongan Allah.
- source_word: כִּי עַתָּה
  choice: tentu sekarang
  rationale: Menyampaikan penegasan sekaligus akibat yang seharusnya sudah terjadi dalam kondisi kontrafaktual.
- source_word: רֵיקָם
  choice: dengan tangan hampa
  rationale: Ungkapan Indonesia yang alami untuk dipulangkan tanpa harta atau hasil kerja.
- source_word: שִׁלַּחְתָּנִי
  choice: engkau sudah menyuruhku pergi
  rationale: Menunjukkan tindakan mengusir atau melepaskan pergi sebagai akibat hipotetis.
- source_word: עָנְיִי
  choice: kesengsaraanku
  rationale: Mencakup penderitaan dan penindasan yang dialami Yakub, bukan hanya kemiskinan.
- source_word: יְגִיעַ כַּפַּי
  choice: jerih payah tanganku
  rationale: Mengungkapkan kerja keras pribadi dengan idiom Indonesia yang dekat dengan bentuk Ibrani.
- source_word: רָאָה אֱלֹהִים
  choice: Allah melihat
  rationale: Menerjemahkan bentuk naratif secara langsung.
- source_word: וַיּוֹכַח
  choice: lalu ... Ia menjatuhkan putusan
  rationale: Kata kerja ini dapat berarti memutuskan, menghakimi, atau menegur. Pilihan ini mempertahankan nuansa yuridis tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
- source_word: אָמֶשׁ
  choice: tadi malam
  rationale: Padanan waktu yang alami dalam konteks perkataan pada hari berikutnya.
theological_decisions:
- issue: Gelar ilahi וּפַחַד יִצְחָק
  choice: Kegentaran Ishak
  alternative: Dia yang ditakuti Ishak
  rationale: Teks utama mempertahankan bentuk gelar yang tidak biasa dan tidak langsung menafsirkan hubungan genitifnya; catatan kaki menyediakan penjelasan yang mungkin.
- issue: Makna וַיּוֹכַח dan tidak adanya objek tersurat
  choice: Ia menjatuhkan putusan
  alternative: Ia menegur; Ia memutuskan perkara
  rationale: Konteks mimpi Laban mendukung tindakan ilahi berupa penghakiman atau teguran, tetapi teks Ibrani tidak menyebut objek. Karena itu terjemahan tidak menambahkan 'engkau' atau 'di antara kita'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan “engkau” dipakai sesuai wacana langsung antartokoh. Kapitalisasi “Kegentaran Ishak” menandai fungsinya sebagai gelar ilahi, sedangkan catatan kaki menjaga kejelasan tanpa menghapus keunikan teks sumber.
