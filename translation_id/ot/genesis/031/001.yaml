base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: id
  text: Yakub mendengar anak-anak Laban berkata, “Yakub telah mengambil segala milik ayah kita, dan dari milik ayah kita ia memperoleh seluruh kekayaan ini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh kemuliaan ini.” Kata Ibrani yang digunakan dapat berarti kehormatan, kemegahan, atau kekayaan materi; di sini kata itu mengacu pada kemakmuran Yakub yang tampak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: Yakub mendengar
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Subjek tersiratnya adalah Yakub berdasarkan konteks; namanya dinyatakan agar jelas dan alami dalam bahasa Indonesia.
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: anak-anak Laban berkata
  rationale: Ungkapan harfiah 'perkataan anak-anak Laban, demikian' dialihkan menjadi konstruksi ujaran langsung yang alami tanpa mengubah isi.
- source_word: לָקַח
  choice: telah mengambil
  rationale: Menyampaikan tindakan yang sudah terjadi dan kini menjadi pokok tuduhan; verba netral 'mengambil' tidak memperkerasnya menjadi 'merampas'.
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: segala milik ayah kita
  rationale: Konstruksi dengan לְ menyatakan kepunyaan; pilihan ini ringkas dan alami.
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: dan dari milik ayah kita itulah
  rationale: Mempertahankan pengulangan tuduhan tentang milik sang ayah serta menonjolkan sumber kekayaan dengan partikel 'itulah'.
- source_word: עָשָׂה
  choice: ia memperoleh
  rationale: Secara harfiah berarti 'membuat/melakukan', tetapi bersama objek kekayaan menyatakan bahwa Yakub menghasilkan atau mendapatkan kemakmuran tersebut.
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: seluruh kekayaan ini
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau kekayaan. Dalam konteks harta benda Yakub, 'kekayaan' paling jelas menyampaikan maksudnya; alternatif harfiah dicatat dalam catatan kaki.
