  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: id
  text: Laban menamainya Yegar-Sahaduta[a], tetapi Yakub menamainya Galed[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yegar-Sahaduta adalah ungkapan bahasa Aram yang berarti “timbunan kesaksian” atau “gundukan kesaksian”.
    reason: lexical_alternative
  - marker: b
    text: Galed adalah ungkapan bahasa Ibrani yang berarti “timbunan kesaksian” atau “gundukan kesaksian”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: menamainya
  rationale: Dalam konteks pemberian nama, קרא dengan ל dan pronomina berarti ‘menamai’. Bentuk ini alami dalam bahasa Indonesia dan objeknya merujuk pada timbunan batu yang baru didirikan.
- source_word: לָבָן
  choice: Laban
  rationale: Bentuk nama diri yang sudah baku dalam bahasa Indonesia.
- source_word: יְגַר שָׂהֲדוּתָא
  choice: Yegar-Sahaduta
  rationale: Ungkapan nama dalam bahasa Aram dipertahankan sebagai transliterasi agar tindakan penamaan tetap terlihat; maknanya dijelaskan dalam catatan kaki.
- source_word: וְיַעֲקֹב
  choice: tetapi Yakub
  rationale: Konjungsi ו dapat berarti ‘dan’, tetapi di sini kedua nama dalam bahasa berbeda dikontraskan, sehingga ‘tetapi’ menyampaikan hubungan wacana dengan wajar.
- source_word: קָרָא לוֹ
  choice: menamainya
  rationale: Pilihan yang konsisten dengan klausa pertama dan alami untuk tindakan memberikan nama kepada timbunan batu.
- source_word: גַּלְעֵד
  choice: Galed
  rationale: Nama Ibrani ditransliterasikan dalam teks utama dan maknanya diberikan dalam catatan kaki, sejajar dengan nama Aram sebelumnya.
