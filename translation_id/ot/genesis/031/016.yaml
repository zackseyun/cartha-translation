  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. “Sebab,” “Jadi sekarang,” dan “lakukanlah” sesuai dengan register naratif-dialogis yang bermartabat. Elipsis dalam “milik kami dan anak-anak kami” lazim dan dipahami sebagai milik kedua kelompok itu.
  terminology: “Allah,” “kekayaan,” “ayah kami,” dan “anak-anak kami” tepat dan konsisten. Catatan kaki pada [a] ditempatkan langsung pada verba yang memerlukan penjelasan leksikal dan secara memadai mempertahankan kemungkinan makna alternatif tanpa mengaburkan terjemahan utama.
