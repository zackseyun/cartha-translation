base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: id
  text: Sebab seluruh kekayaan yang telah Allah ambil[a] dari ayah kami adalah milik kami dan anak-anak kami. Jadi sekarang, lakukanlah segala yang telah Allah katakan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lepaskan.” Kata kerja Ibrani ini sering berarti “melepaskan” atau “menyelamatkan,” tetapi di sini menunjuk pada tindakan Allah memindahkan kekayaan dari Laban kepada keluarga Yakub.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan yang diberikan Rahel dan Lea untuk menyetujui tindakan Yakub; bentuk ini mempertahankan hubungan penjelas dengan ayat sebelumnya.
- source_word: כָל הָעֹשֶׁר
  choice: seluruh kekayaan
  rationale: עֹשֶׁר berarti kekayaan atau harta; “seluruh kekayaan” alami dalam bahasa Indonesia dan cukup luas untuk mencakup ternak serta aset lain dalam konteks.
- source_word: הִצִּיל
  choice: telah ... ambil
  rationale: Bentuk kausatif dari נצל sering berarti melepaskan atau menyelamatkan, tetapi di sini objeknya ialah kekayaan yang dipindahkan dari Laban kepada keluarga Yakub. “Ambil dari” menyampaikan perpindahan itu tanpa menyiratkan perampasan dengan kekerasan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia bagi אֱלֹהִים ketika menunjuk kepada Allah dalam narasi ini.
- source_word: מֵאָבִינוּ
  choice: dari ayah kami
  rationale: Preposisi מן menandai sumber; terjemahan langsung ini jelas dan alami.
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: adalah milik kami dan anak-anak kami
  rationale: Ungkapan Ibrani menyatakan kepemilikan atau hak; bentuk ini membuat makna posesif yang tersirat menjadi jelas.
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menandai peralihan dari alasan menuju desakan sekaligus menunjukkan hubungan kesimpulannya.
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: segala yang telah Allah katakan kepadamu
  rationale: Menjaga cakupan menyeluruh dari כֹּל אֲשֶׁר dengan susunan yang alami dalam bahasa Indonesia.
- source_word: עֲשֵׂה
  choice: lakukanlah
  rationale: Imperatif tunggal ini diterjemahkan secara ringkas; objeknya sudah dinyatakan dalam klausa sebelumnya.
theological_decisions:
- issue: Tindakan Allah terhadap kekayaan Laban
  choice: “telah ... ambil dari”
  alternative: “telah lepaskan dari” atau “telah selamatkan dari”
  rationale: Konteks berbicara tentang kekayaan yang sebelumnya berada pada Laban dan kini menjadi hak keluarga Yakub. Terjemahan utama menonjolkan pemindahan kekayaan tersebut tanpa mengubahnya menjadi pernyataan doktrinal bahwa Allah melakukan pencurian; catatan kaki mempertahankan rentang makna pelepasan yang melekat pada verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ayah” dipilih daripada “bapa” karena para penutur sedang membicarakan ayah kandung mereka; “lakukanlah” mempertahankan ketegasan imperatif tanpa terdengar kasar.
