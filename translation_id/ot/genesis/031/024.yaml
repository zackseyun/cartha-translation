base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: id
  text: Allah datang kepada Laban, orang Aram itu, dalam mimpi pada malam hari dan berkata kepadanya, “Berhati-hatilah supaya engkau tidak mengatakan apa pun kepada Yakub, baik ataupun buruk.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari yang baik sampai yang buruk.” Ungkapan ini mencakup segala sesuatu, baik yang menguntungkan maupun yang merugikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא paling langsung berarti ‘datang’; tidak perlu diperluas menjadi ‘menampakkan diri’ karena bahasa penampakan tidak dinyatakan secara eksplisit.
- source_word: לָבָן הָאֲרַמִּי
  choice: Laban, orang Aram itu
  rationale: אֲרַמִּי adalah etnonim ‘orang Aram’; pilihan ini lebih tepat secara historis daripada sebutan tradisional ‘orang Siria’.
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: pada malam hari ... dalam mimpi
  rationale: Susunan ini menyampaikan kedua unsur Ibrani—mimpi dan malam—secara jelas dan alami dalam bahasa Indonesia.
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Ungkapan peringatan ini diterjemahkan dengan bentuk imperatif idiomatis Indonesia tanpa mengurangi daya larangannya.
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: jangan mengatakan apa pun kepada Yakub
  rationale: פֶּן menyatakan peringatan agar tindakan tidak dilakukan. Penambahan ‘apa pun’ membuat cakupan idiom berikutnya alami dan jelas dalam bahasa Indonesia.
- source_word: מִטּוֹב עַד רָע
  choice: baik ataupun buruk
  rationale: Secara harfiah ‘dari yang baik sampai yang buruk’; merisme ini mencakup segala perkataan, baik yang mendukung maupun yang memusuhi.
theological_decisions:
- issue: Identitas אֱלֹהִים
  choice: Allah
  alternative: ilah-ilah / suatu sosok ilahi
  rationale: Kata kerja tunggal dan konteks narasi menunjukkan Allah yang esa, bukan bentuk jamak atau sosok ilahi yang tidak tentu.
- issue: Cakupan larangan kepada Laban
  choice: jangan mengatakan apa pun ... baik ataupun buruk
  alternative: jangan berbicara ... dari yang baik sampai yang buruk
  rationale: Ungkapan sumber merupakan merisme yang melarang seluruh rentang perkataan kepada Yakub; terjemahan mempertahankan pasangan kutub ‘baik ... buruk’ sambil menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. ‘Namun’ menandai peralihan atau kontras dalam alur. Etnonim diterjemahkan sebagai ‘orang Aram’. Ungkapan merismik dijelaskan secukupnya dalam teks dan bentuk harfiahnya dicatat dalam catatan kaki.
