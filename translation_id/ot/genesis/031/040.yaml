  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: id
  text: Pada siang hari panas terik melahap aku, dan pada malam hari embun beku melahap aku; tidurku pun lari dari mataku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: '[tersirat dalam susunan klausa]'
  rationale: Kata kerja “aku berada/aku mengalami” memperkenalkan keadaan Yakub. Dalam bahasa Indonesia alami, dayanya terserap ke dalam uraian langsung tentang apa yang dialaminya.
- source_word: בַיּוֹם
  choice: pada siang hari
  rationale: Frasa temporal ini menyatakan keadaan pada waktu siang dan membentuk kesejajaran dengan “pada malam hari”.
- source_word: אֲכָלַנִי
  choice: melahap aku
  rationale: Bentuk dari אכל secara harfiah berarti “memakan aku”; secara kiasan menggambarkan kondisi keras yang menggerogoti Yakub. “Melahap” mempertahankan metafora yang hidup.
- source_word: חֹרֶב
  choice: panas terik
  rationale: Dalam konteks paparan cuaca yang dipertentangkan dengan embun beku pada malam hari, kata ini menunjuk pada panas kering yang menyengat.
- source_word: וְקֶרַח
  choice: dan ... embun beku
  rationale: קֶרַח dapat berarti es atau embun beku. Dalam gambaran cuaca malam hari, “embun beku” tepat dan alami.
- source_word: בַּלָּיְלָה
  choice: pada malam hari
  rationale: Padanan temporal bagi “pada siang hari” yang menjaga kesejajaran teks Ibrani.
- source_word: וַתִּדַּד
  choice: pun lari
  rationale: Kata kerja langka ini menyatakan gerak menjauh atau melarikan diri. Dengan tidur sebagai subjek, “lari” mempertahankan personifikasi teks.
- source_word: שְׁנָתִי
  choice: tidurku
  rationale: Menunjuk pada tidur sebagai keadaan; “tidurku” lugas dan alami dalam bahasa Indonesia.
- source_word: מֵעֵינָי
  choice: dari mataku
  rationale: Ungkapan Ibrani untuk keadaan tidak dapat tidur; terjemahan harfiah ini tetap jelas dan mempertahankan citranya.
