translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kesejajaran siang–malam serta personifikasi “tidurku ... lari dari mataku” dipertahankan; kata pembuka הָיִיתִי tidak diterjemahkan secara terpisah demi susunan Indonesia yang alami.
