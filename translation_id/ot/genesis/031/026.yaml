  text: וַ/יֹּ֤אמֶר לָבָן֙ לְ/יַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַ/תִּגְנֹ֖ב אֶת לְבָבִ֑/י וַ/תְּנַהֵג֙ אֶת בְּנֹתַ֔/י כִּ/שְׁבֻי֖וֹת חָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: id
  text: Lalu Laban berkata kepada Yakub, “Apa yang telah kaulakukan? Engkau menipuku[a] dan menggiring anak-anak perempuanku pergi seperti tawanan perang[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencuri hatiku”; ungkapan Ibrani ini berarti memperdaya atau bertindak tanpa sepengetahuan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti perempuan-perempuan tawanan pedang,” yaitu perempuan yang ditawan dalam peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: Apa yang telah kaulakukan?
  rationale: Pertanyaan bernada tuduhan tentang tindakan yang sudah dilakukan dan kini dipersoalkan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: וַתִּגְנֹב אֶת־לְבָבִי
  choice: Engkau menipuku
  rationale: Ungkapan Ibrani secara harfiah berarti ‘mencuri hatiku’, tetapi dalam konteks ini menunjuk pada tindakan memperdaya atau bertindak tanpa sepengetahuan Laban. Terjemahan harfiah ‘mencuri hatiku’ dalam bahasa Indonesia mudah dipahami secara romantis dan akan menyesatkan.
- source_word: וַתְּנַהֵג
  choice: menggiring ... pergi
  rationale: Kata kerja נהג menggambarkan tindakan membawa atau menggiring, dengan nuansa paksaan yang sesuai dengan gambaran para tawanan.
- source_word: בְּנֹתַי
  choice: anak-anak perempuanku
  rationale: Menerjemahkan bentuk jamak posesif secara langsung dan mempertahankan klaim kekeluargaan Laban dalam ucapannya.
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: seperti tawanan perang
  rationale: Secara harfiah frasa ini adalah ‘seperti perempuan-perempuan tawanan pedang’, yakni perempuan yang ditawan melalui peperangan. ‘Tawanan perang’ menyampaikan maksud idiom secara alami, sedangkan citra pedang dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk ‘kaulakukan’ mempertahankan sapaan tunggal langsung. Idiom Ibrani diterjemahkan menurut maknanya dalam teks utama agar tidak menimbulkan konotasi romantis yang keliru, sementara bentuk harfiahnya dicatat. Seruan penutup mencerminkan kerasnya tuduhan Laban.
