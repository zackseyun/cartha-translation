  text: וַ/יַּשֵּׂ֥ג לָבָ֖ן אֶֽת יַעֲקֹ֑ב וְ/יַעֲקֹ֗ב תָּקַ֤ע אֶֽת אָהֳל/וֹ֙ בָּ/הָ֔ר וְ/לָבָ֛ן תָּקַ֥ע אֶת אֶחָ֖י/ו בְּ/הַ֥ר הַ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: id
  text: Lalu Laban menyusul Yakub.[a] Yakub telah mendirikan kemahnya di daerah pegunungan,[b] dan Laban mendirikan kemah bersama kerabatnya[c] di daerah pegunungan Gilead.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencapai Yakub” atau “berhasil mengejar Yakub”.
    reason: lexical_alternative
  - marker: b
    text: Atau “di gunung”; mungkin yang dimaksud ialah Gunung Gilead atau pegunungan Gilead.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “saudara-saudaranya”; di sini mungkin berarti kerabat atau anggota kelompok keluarganya.
    reason: lexical_alternative
  - marker: d
    text: Atau “di Gunung Gilead” atau “di pegunungan Gilead”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: menyusul
  rationale: Dalam konteks pengejaran, verba ini berarti mencapai atau menyusul orang yang berada di depan. “Menyusul” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Yakub ditangkap.
- source_word: תָּקַע אֶת־אָהֳלוֹ
  choice: telah memasang kemahnya
  rationale: Gabungan תָּקַע dengan אֹהֶל merupakan ungkapan untuk mendirikan atau memasang kemah. Bentuk “telah memasang” menunjukkan bahwa Yakub sudah berkemah ketika Laban menyusulnya.
- source_word: בָּהָר
  choice: di daerah pegunungan
  rationale: הַר dapat menunjuk pada sebuah gunung atau kawasan pegunungan. Konteks geografis mendukung pengertian kawasan dataran tinggi, tetapi kemungkinan rujukan kepada Gunung Gilead tetap dicatat dalam catatan kaki.
- source_word: תָּקַע אֶת־אֶחָיו
  choice: bersama sanak saudaranya berkemah
  rationale: Susunan Ibrani bersifat eliptis dan dipahami berdasarkan ungkapan berkemah pada klausa sebelumnya. Terjemahan ini tidak menambahkan “kemah-kemah” yang tidak dinyatakan secara eksplisit.
- source_word: אֶחָיו
  choice: sanak saudaranya
  rationale: Secara harfiah berarti “saudara-saudaranya”, tetapi dalam pemakaian Ibrani dapat mencakup kerabat atau anggota kelompok keluarga yang lebih luas; konteks rombongan Laban mendukung makna tersebut.
- source_word: בְּהַר הַגִּלְעָד
  choice: di daerah pegunungan Gilead
  rationale: Frasa ini secara harfiah dapat dipahami sebagai “di Gunung Gilead”, tetapi juga dapat menunjuk pada kawasan pegunungan Gilead. Pilihan dalam teks utama paling alami untuk konteks wilayah, sedangkan alternatifnya dipertahankan dalam catatan kaki.
