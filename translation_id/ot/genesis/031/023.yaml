  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: id
  text: Lalu ia membawa serta sanak saudaranya[a] dan mengejar Yakub sejauh perjalanan tujuh hari. Ia menyusulnya di pegunungan Gilead[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "saudara-saudaranya"; kata Ibrani yang dipakai dapat berarti saudara laki-laki secara khusus atau sanak saudara secara lebih luas.
    reason: lexical_alternative
  - marker: b
    text: Atau "di Gunung Gilead"; frasa Ibraninya dapat menunjuk sebuah gunung tertentu atau kawasan pegunungan Gilead.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: sanak saudaranya
  rationale: Kata אָח dapat berarti saudara laki-laki secara sempit atau kerabat satu kaum secara lebih luas. Dalam konteks ini, Laban membawa anggota kelompok keluarganya, sehingga 'sanak saudaranya' alami dan tidak membatasi makna pada saudara kandung.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: mengejar Yakub
  rationale: Gabungan רדף dan אַחַר menyatakan tindakan mengejar seseorang. Nama 'Yakub' dipakai agar rujukan pronomina jelas dalam bahasa Indonesia, tanpa menambah informasi baru.
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: sejauh perjalanan tujuh hari
  rationale: דֶּרֶךְ di sini menunjukkan jarak atau rentang perjalanan, bukan sekadar lamanya tindakan mengejar. Ungkapan ini mempertahankan nuansa tersebut dalam bahasa Indonesia yang wajar.
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: berhasil menyusulnya
  rationale: Dalam konteks pengejaran, דבק menyatakan mencapai atau menyusul orang yang dikejar. 'Berhasil menyusulnya' jelas dan alami, tanpa memakai arti harfiah lain, yaitu 'melekat'.
- source_word: בְּהַר הַגִּלְעָד
  choice: di pegunungan Gilead
  rationale: הַר dapat menunjuk sebuah gunung, daerah berbukit, atau kawasan pegunungan. Konteks geografis mendukung pengertian kawasan, tetapi kemungkinan gunung tertentu tetap dicatat.
