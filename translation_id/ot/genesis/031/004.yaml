  text: Lalu Yakub menyuruh orang memanggil Rahel dan Lea ke padang, ke tempat kawanan ternaknya berada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke padang, ke kawanan ternaknya.” Frasa terakhir tampaknya memperjelas lokasi pertemuan itu.'
