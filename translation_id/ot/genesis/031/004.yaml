lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא
  choice: menyuruh orang memanggil
  rationale: Gabungan kedua verba secara alami menyatakan bahwa Yakub mengutus seseorang untuk memanggil Rahel dan Lea. Ungkapan ini mempertahankan inisiatif dan tindakan pengutusan tanpa menyiratkan bahwa Yakub sendiri pergi memanggil mereka.
- source_word: לְרָחֵל וּלְלֵאָה
  choice: Rahel dan Lea
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַשָּׂדֶה
  choice: ke padang
  rationale: Kata שׂדה menunjuk pada tanah terbuka atau padang. Preposisi berarah tersirat pada bentuk Ibrani dan tepat dinyatakan dengan 'ke'.
- source_word: אֶל צֹאנוֹ
  choice: ke tempat kawanan ternaknya berada
  rationale: Secara harfiah frasa ini berarti 'ke/pada kawanan ternaknya', tetapi dalam susunan kalimat kemungkinan besar memperjelas lokasi di padang. Terjemahan ini alami dalam bahasa Indonesia sambil mencatat bentuk yang lebih harfiah dalam catatan kaki.
