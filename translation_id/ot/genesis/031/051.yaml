  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר לָבָ֖ן לְ/יַעֲקֹ֑ב הִנֵּ֣ה הַ/גַּ֣ל הַ/זֶּ֗ה וְ/הִנֵּה֙ הַ/מַצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥/י וּ/בֵינֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: id
  text: Lalu Laban berkata kepada Yakub, “Lihatlah timbunan batu ini[a], dan lihatlah tugu batu[b] yang telah kudirikan di antara aku dan kamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumpukan batu ini.”
    reason: lexical_alternative
  - marker: b
    text: Atau “batu tegak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan gerak berurutan itu secara alami dalam bahasa Indonesia modern.
- source_word: הִנֵּה ... וְהִנֵּה
  choice: Lihatlah ... dan lihatlah
  rationale: Pengulangan partikel penunjuk dipertahankan untuk menampilkan penekanan dan kesejajaran dalam ucapan Laban.
- source_word: הַגַּל הַזֶּה
  choice: timbunan batu ini
  rationale: Dalam konteks ini גַּל adalah tumpukan batu yang didirikan sebagai tanda atau saksi; penyebutan “batu” memperjelas acuannya tanpa mengubah maksud.
- source_word: הַמַּצֵּבָה
  choice: tugu batu
  rationale: מַצֵּבָה menunjuk pada batu yang ditegakkan. “Tugu batu” jelas dan alami serta membedakannya dari timbunan batu.
- source_word: יָרִיתִי
  choice: telah kudirikan
  rationale: Dalam kaitannya dengan מַצֵּבָה, verba ini berarti menegakkan atau mendirikan. Bentuk orang pertama tunggal dan klaim Laban dipertahankan.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: di antara aku dan kamu
  rationale: Ungkapan relasional dan bentuk orang kedua tunggal dipertahankan dengan bahasa Indonesia modern.
theological_decisions:
- issue: Klaim Laban bahwa ia mendirikan tugu batu
  choice: yang telah kudirikan
  alternative: yang telah didirikan
  rationale: Teks Ibrani secara tegas memakai bentuk orang pertama tunggal. Terjemahan mempertahankan klaim Laban meskipun konteks sebelumnya dapat menimbulkan ketegangan mengenai siapa yang mendirikan penanda-penanda tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “lihatlah” mempertahankan penekanan teks Ibrani, sedangkan “timbunan batu” dan “tugu batu” membedakan kedua penanda secara mudah dipahami.
