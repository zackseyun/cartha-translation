  source_fidelity: 'Terjemahan secara akurat mencerminkan unsur-unsur utama teks Ibrani: urutan naratif, panggilan perhatian yang diulang, timbunan batu, tugu/batu yang didirikan, klaim orang pertama Laban, dan hubungan "di antara aku dan kamu." "Timbunan batu" tepat untuk גַּל dalam konteks penanda perjanjian, sedangkan "tugu batu" membedakannya dengan baik dari timbunan itu dan sesuai untuk מַצֵּבָה.'
