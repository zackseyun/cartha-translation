  terminology: Nama "Laban" dan "Yakub" sudah baku. Istilah "timbunan batu" dan "tugu batu" secara konsisten menyampaikan dua penanda yang berbeda. Catatan kaki menyediakan alternatif leksikal yang sah tanpa mengubah makna.
