  text: And you did not let me kiss my sons and my daughters[a]. Now you have acted foolishly.
translation:
  language: id
  text: Engkau tidak membiarkan aku mencium putra-putriku.[a] Sekarang engkau telah bertindak bodoh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “engkau tidak meninggalkan aku untuk mencium putra-putriku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: tidak membiarkan aku
  rationale: Walaupun נטשׁ pada dasarnya berarti ‘meninggalkan’ atau ‘membiarkan’, konstruksinya dengan infinitif ‘mencium’ secara idiomatis menyatakan tidak diberi kesempatan atau izin. ‘Tidak membiarkan aku’ alami dalam bahasa Indonesia dan mempertahankan nada keluhan.
- source_word: לְנַשֵּׁק
  choice: mencium
  rationale: Infinitif ini berarti ‘mencium’. Konteks menyiratkan ciuman perpisahan, tetapi unsur ‘perpisahan’ tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: לְבָנַי וְלִבְנֹתַי
  choice: anak-anak lelakiku dan anak-anak perempuanku
  rationale: Bahasa Ibrani menyebut kedua kelompok secara eksplisit. Terjemahan mempertahankan pembedaan tersebut dan tidak merangkumnya sebagai ‘anak-anakku’.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda waktu dan wacana yang langsung, yang memperkenalkan penilaian Laban terhadap tindakan Yakub.
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: engkau telah bertindak bodoh
  rationale: Ungkapan Ibrani berarti melakukan atau bertindak dengan bodoh. Bentuk ini alami dalam bahasa Indonesia modern dan tetap dekat dengan makna sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina ‘engkau’ sesuai dengan percakapan langsung dalam narasi Alkitab. Kata ‘bahkan’ menyampaikan daya keluhan dari rangkaian וְלֹא dalam konteks, tanpa mengubah isi pokok.
