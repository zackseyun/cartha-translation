  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: id
  text: Namun ayah kalian telah memperdaya aku dan mengubah upahku sepuluh kali[a], tetapi Allah tidak membiarkannya mencelakakan aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepuluh kali”; ungkapan ini dapat berarti berulang kali dan tidak harus menunjukkan jumlah yang persis.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani secara harfiah berbunyi, “Allah tidak memberinya untuk mencelakakan aku,” dengan objek yang dilesapkan; maksudnya, Allah tidak mengizinkannya mencelakakan aku.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: memperdaya
  rationale: Dalam bentuk Hifil, verba ini dapat menunjuk pada perlakuan menipu atau mempermainkan seseorang. Dalam konteks perubahan upah, “memperdaya” menyampaikan tindakan tidak jujur sekaligus perlakuan sewenang-wenang secara alami dalam bahasa Indonesia.
- source_word: וְהֶחֱלִף
  choice: dan mengubah
  rationale: Bentuk Hifil dari חלף di sini mengacu pada tindakan mengganti atau mengubah ketentuan upah yang telah disepakati.
- source_word: מַשְׂכֻּרְתִּי
  choice: upahku
  rationale: Nomina ini berarti upah atau bayaran atas pekerjaan; “upahku” ringkas dan tepat untuk konteks hubungan kerja Yakub dengan Laban.
- source_word: עֲשֶׂרֶת מֹנִים
  choice: sepuluh kali
  rationale: Ungkapan ini secara harfiah berarti “sepuluh kali” dan dapat berfungsi sebagai ungkapan untuk perubahan berulang kali, tanpa harus menetapkan hitungan matematis yang persis.
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: tetapi Allah tidak membiarkannya
  rationale: Secara harfiah, “Allah tidak memberikannya,” yakni tidak memberinya kesempatan atau izin. “Tidak membiarkannya” menyampaikan idiom Ibrani itu dengan jelas tanpa menambahkan cara khusus Allah mencegahnya.
- source_word: לְהָרַע עִמָּדִי
  choice: mencelakakan aku
  rationale: Ungkapan dengan verba רעע dan preposisi עִם berarti bertindak jahat terhadap atau mendatangkan celaka kepada seseorang. “Mencelakakan aku” alami dan sesuai konteks.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Di sini אֱלֹהִים menunjuk kepada Allah dalam perkataan Yakub; “Allah” adalah padanan baku dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Pengekangan ilahi dalam idiom “Allah tidak memberikannya”
  choice: Allah tidak membiarkan Laban mencelakakan Yakub
  alternative: Allah tidak menyerahkan Yakub kepadanya; Allah tidak membiarkan usahanya mencelakakan Yakub berhasil
  rationale: Teks menyatakan bahwa Allah mencegah Laban melakukan celaka terhadap Yakub, tetapi tidak menjelaskan mekanisme pencegahan itu. Terjemahan ini mempertahankan kedaulatan tindakan Allah tanpa mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ayah kalian” mempertahankan bentuk orang kedua jamak Ibrani karena Yakub berbicara kepada Rahel dan Lea. “Memperdaya” dipilih untuk mencakup unsur penipuan dan perlakuan mempermainkan tanpa terdengar terlalu sehari-hari.
