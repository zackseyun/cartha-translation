  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: id
  text: Ketika para pejabat Firaun melihatnya, mereka memuji perempuan itu[a] kepada Firaun, dan perempuan itu dibawa ke rumah Firaun[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merekomendasikan perempuan itu kepada Firaun” atau “berbicara baik tentang dia kepada Firaun”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah”; ungkapan ini dapat menunjuk rumah tangga atau kediaman kerajaan Firaun, bukan hanya bangunan fisiknya.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: para pejabat Firaun
  rationale: Kata שָׂרִים dapat menunjuk para penguasa, pembesar, atau pejabat. Dalam konteks lingkungan istana, “para pejabat” terdengar alami dan tidak menyiratkan bahwa mereka adalah anak-anak raja.
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: mereka memuji-muji perempuan itu kepada Firaun
  rationale: Bentuk piel dari הלל di sini berarti memuji atau mengatakan hal-hal yang baik tentang seseorang. Ungkapan ini mempertahankan arah pujian kepada Firaun tanpa menambahkan bahwa yang secara khusus dipuji adalah kecantikannya.
- source_word: וַתֻּקַּח
  choice: dibawa
  rationale: Bentuk pasif ini tidak menyebutkan pelaku dan menonjolkan kepasifan perempuan tersebut. “Dibawa” alami dalam bahasa Indonesia untuk perpindahan menuju kediaman Firaun, sementara unsur pemaksaan tidak ditambahkan secara eksplisit.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani secara harfiah menyebut “perempuan itu”, bukan “istri itu”. Pilihan ini mempertahankan pergeseran penyebutan dalam narasi tanpa memasukkan keterangan yang tidak dinyatakan pada ayat ini.
- source_word: בֵּית פַּרְעֹה
  choice: rumah Firaun
  rationale: בַּיִת dapat berarti rumah, kediaman, atau rumah tangga. “Rumah Firaun” mempertahankan keluasan makna istilah Ibrani; catatan kaki menjelaskan bahwa cakupannya mungkin lebih luas daripada bangunan fisik.
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: melihatnya
  rationale: ראה adalah kata kerja umum untuk “melihat”; terjemahan ini tidak menambahkan nuansa memandangi atau menilai yang tidak dinyatakan secara eksplisit.
