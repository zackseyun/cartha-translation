  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan klausa mengikuti alur Ibrani, sedangkan pengulangan “perempuan itu” dipertahankan untuk mencerminkan הָאִשָּׁה dan menghindari penambahan kata “istri”.
