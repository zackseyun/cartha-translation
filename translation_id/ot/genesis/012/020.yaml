  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: id
  text: Lalu Firaun memberi perintah kepada orang-orang mengenai Abram,[a][b] dan mereka menyuruh Abram pergi bersama istrinya serta segala miliknya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memerintahkan orang-orang berkenaan dengan Abram.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani menyebut “orang-orang”; kemungkinan mereka adalah para pelayan atau petugas Firaun, tetapi peran mereka tidak dijelaskan.
    reason: cultural_note
  - marker: c
    text: 'Secara harfiah: “segala yang ada padanya”; atau: “segala yang dimilikinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memberi perintah
  rationale: Kata צוה berarti memerintah atau memberi perintah; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya perintahnya.
- source_word: עָלָיו
  choice: mengenai Abram
  rationale: Preposisi עַל bersama צוה dapat menunjukkan bahwa perintah diberikan berkenaan dengan seseorang. Nama Abram dipakai agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir tersebut.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Teks Ibrani menyebut 'orang-orang' tanpa menjelaskan jabatan mereka; 'beberapa orang' alami dan tidak menambahkan bahwa mereka pelayan atau pengawal.
- source_word: וַיְשַׁלְּחוּ
  choice: menyuruh ... pergi
  rationale: Dalam konteks ini שלח menyatakan menyuruh pergi atau melepaskan; pilihan ini menyampaikan pengusiran tanpa menambahkan gagasan pengawalan yang tidak dinyatakan secara eksplisit.
- source_word: אֹתוֹ
  choice: Abram
  rationale: Objek pronominal merujuk kepada Abram; nama diulangi demi kejelasan dan kelancaran bahasa Indonesia.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Dalam konteks perkawinan, אשה dengan sufiks posesif secara wajar berarti 'istrinya'.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Ungkapan ini mencakup seluruh kepunyaan Abram dan dapat diterjemahkan secara ringkas serta alami sebagai 'segala miliknya'.
