  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: id
  text: Aku akan menjadikan engkau suatu bangsa besar, memberkati engkau, dan membuat namamu besar; jadilah berkat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan engkau akan menjadi berkat.” Bentuk Ibrani ini adalah bentuk perintah (“jadilah”), tetapi sebagian penafsir memahaminya sebagai hasil dari janji-janji Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: Aku akan menjadikan engkau bangsa yang besar
  rationale: Konstruksi עשה dengan akhiran objek dan frasa berpreposisi ל menyatakan bahwa Allah akan membentuk atau menjadikan Abram sebagai suatu bangsa besar. Ungkapan ini tetap dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: וַאֲבָרֶכְךָ
  choice: memberkati engkau
  rationale: Bentuk piel dari ברך berarti ‘memberkati’. Objek tunggal ‘engkau’ dipertahankan untuk menegaskan janji yang ditujukan langsung kepada Abram.
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: membuat namamu besar
  rationale: Terjemahan harfiah ini mempertahankan ‘nama’ sebagai ungkapan yang mencakup kemasyhuran atau reputasi tanpa mengganti citra sumber.
- source_word: וֶהְיֵה בְּרָכָה
  choice: dan jadilah berkat
  rationale: וֶהְיֵה adalah imperatif maskulin tunggal, sehingga ‘jadilah’ mempertahankan peralihan dari janji ilahi kepada panggilan bagi Abram. בְּרָכָה diterjemahkan ‘berkat’ secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Daya gramatikal וֶהְיֵה בְּרָכָה
  choice: dan jadilah berkat
  alternative: dan engkau akan menjadi berkat
  rationale: Teks utama mempertahankan bentuk imperatif Ibrani. Namun, karena klausa ini berada dalam rangkaian janji Allah, pemahaman prediktif atau resultatif tetap dicantumkan dalam catatan kaki agar ketegangan dalam sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kata ganti ‘engkau’ dipakai karena Allah berbicara langsung kepada satu orang. Pengulangan ‘dan’ mempertahankan alur koordinatif teks Ibrani, termasuk hubungan klausa imperatif terakhir dengan rangkaian janji sebelumnya.
