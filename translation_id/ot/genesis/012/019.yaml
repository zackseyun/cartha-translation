base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: id
  text: Mengapa engkau berkata, ‘Dia adalah saudariku,’ lalu aku mengambilnya sebagai istriku? Sekarang, ini istrimu. Ambillah dia dan pergilah!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya ini langsung menanyakan alasan atau motif Abram; “Mengapa” alami dan tepat dalam bahasa Indonesia modern.
- source_word: אָמַרְתָּ
  choice: engkau berkata
  rationale: Bentuk perfektif merujuk pada ucapan Abram sebelumnya. Pronomina “engkau” memberi nada teguran yang wajar dan bermartabat.
- source_word: אֲחֹתִי הִוא
  choice: Dia saudariku
  rationale: Klausa nominal Ibrani dikutip sebagai ujaran langsung; bentuk kini tersirat secara alami dalam bahasa Indonesia.
- source_word: וָאֶקַּח
  choice: sehingga aku mengambilnya
  rationale: Waw naratif secara formal dapat berarti “dan aku mengambilnya”, tetapi konteks pertanyaan menunjukkan akibat dari ucapan Abram. “Sehingga” menyatakan hubungan konsekuensial tanpa memberi nuansa tujuan seperti “supaya”.
- source_word: אֹתָהּ
  choice: -nya
  rationale: Pronomina objek feminin merujuk kepada Sarai dan dilekatkan secara alami pada verba “mengambil”.
- source_word: לִי לְאִשָּׁה
  choice: menjadi istriku
  rationale: Ungkapan Ibrani secara harfiah berarti mengambil dia bagi diri sendiri sebagai istri. “Menjadi istriku” adalah padanan idiomatis yang mempertahankan maksud pernikahan dan kepentingan pribadi Firaun.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari teguran kepada tindakan yang harus dilakukan; bahasa Indonesia tidak memerlukan “dan” untuk mempertahankan alur ini.
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: ini istrimu
  rationale: הִנֵּה menarik perhatian pada orang yang ada di hadapan mereka. “Ini istrimu” ringkas, alami, dan mempertahankan daya tunjuknya.
- source_word: קַח
  choice: Ambillah dia
  rationale: Imperatif “ambil” diberi partikel -lah agar tegas namun wajar. Objek “dia” disuplai dari konteks sebagaimana lazim dalam bahasa Indonesia.
- source_word: וָלֵךְ
  choice: dan pergilah
  rationale: Imperatif kedua dihubungkan dengan waw. “Pergilah” mempertahankan perintah tegas tanpa menambahkan permusuhan yang tidak dinyatakan.
theological_decisions:
- issue: Hubungan ucapan Abram dengan tindakan Firaun
  choice: “sehingga aku mengambilnya” sebagai akibat
  alternative: “dan aku mengambilnya” sebagai urutan sederhana
  rationale: Waw itu sendiri tidak harus menandai sebab-akibat, tetapi konteks teguran mengaitkan pengakuan Abram dengan tindakan Firaun. “Sehingga” mempertahankan hubungan akibat tanpa menyiratkan bahwa tindakan Firaun merupakan tujuan Abram.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog memakai “engkau/aku” untuk menjaga nada naratif Alkitab yang alami tanpa menjadi arkais. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat dijelaskan dalam keputusan penerjemahan tanpa membebani teks.
