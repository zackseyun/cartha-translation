  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: id
  text: Lalu Yahweh menampakkan diri kepada Abram dan berfirman, “Kepada keturunanmu[a] Aku akan memberikan tanah ini.” Maka di sana Abram membangun sebuah mazbah bagi Yahweh, yang telah menampakkan diri kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu.” Kata Ibrani ini berbentuk tunggal dan dapat dipakai secara kolektif untuk keturunan sebagai suatu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sesuai bentuk sumber dan mempertahankan sifatnya sebagai nama pribadi.
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal ראה di sini menyatakan manifestasi Yahweh kepada Abram; ungkapan ini alami dalam bahasa Indonesia dan lebih tepat daripada bentuk pasif harfiah 'terlihat'.
- source_word: לְזַרְעֲךָ
  choice: kepada keturunanmu
  rationale: זֶרַע berbentuk tunggal tetapi dapat bermakna kolektif. 'Keturunan' merupakan padanan Indonesia yang alami tanpa menentukan apakah acuannya satu individu atau banyak orang.
- source_word: אֶתֵּן
  choice: Aku akan memberikan
  rationale: Bentuk imperfek dalam ujaran langsung ini membawa daya janji masa depan.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Dalam konteks wilayah yang ditunjukkan kepada Abram, 'negeri' merupakan padanan Indonesia yang alami; tidak memperluas makna menjadi seluruh bumi.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Maka di sana Abram membangun sebuah mazbah
  rationale: Wayyiqtol melanjutkan alur sekaligus menghubungkan tindakan Abram dengan penampakan dan janji sebelumnya. Nama Abram dinyatakan kembali agar subjek jelas dan kalimat alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau dedikasi mazbah; 'bagi' terdengar alami dalam bahasa Indonesia.
- source_word: הַנִּרְאֶה אֵלָיו
  choice: yang telah menampakkan diri kepadanya
  rationale: Partisipel berartikel mengidentifikasi Yahweh sebagai Dia yang menampakkan diri kepada Abram; 'telah' menunjukkan bahwa penampakan itu mendahului pembangunan mazbah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan זֶרַע dalam janji
  choice: keturunanmu, dengan catatan bahwa kata Ibrani berbentuk tunggal dan dapat bersifat kolektif
  alternative: benihmu; keturunan-keturunanmu
  rationale: Pilihan ini mempertahankan ketegangan antara bentuk gramatikal tunggal dan fungsi kolektifnya, tanpa membatasi janji pada tafsiran individual ataupun jamak.
- issue: Hubungan pembangunan mazbah dengan penampakan Yahweh
  choice: Maka
  alternative: Dan; Lalu
  rationale: Konteks menunjukkan respons naratif Abram setelah Yahweh menampakkan diri dan berjanji. 'Maka' menyampaikan hubungan itu tanpa menambahkan alasan teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berfirman' dipakai secara idiomatis untuk perkataan Allah, sedangkan 'mazbah' mempertahankan istilah ibadah yang lazim dalam terjemahan Alkitab Indonesia. Pronomina ilahi dalam ujaran langsung ditulis 'Aku' sesuai konvensi penerbitan religius Indonesia.
