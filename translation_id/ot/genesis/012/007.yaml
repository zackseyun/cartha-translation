  to: Lalu Yahweh menampakkan diri kepada Abram dan berfirman, “Kepada keturunanmu[a] Aku akan memberikan tanah ini.” Maka di sana Abram membangun sebuah mazbah bagi Yahweh, yang telah menampakkan diri kepadanya.
  rationale: Revisi terbatas pada “negeri ini” menjadi “tanah ini” agar padanan bagi הָאָרֶץ lebih dekat kepada teks sumber dan tidak menambahkan nuansa politik. Unsur-unsur lain, termasuk nama Yahweh, bentuk kolektif “keturunanmu,” urutan naratif, dan penanda catatan kaki, dipertahankan.
