  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: id
  text: Terjadi kelaparan di negeri itu, dan Abram turun ke Mesir untuk tinggal sementara di sana[a], karena kelaparan di negeri itu sangat parah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini berarti tinggal untuk sementara waktu sebagai pendatang atau orang asing.
    reason: lexical_nuance
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu terjadilah
  rationale: Bentuk wayyiqtol memperkenalkan perkembangan berikut dalam alur cerita. “Lalu terjadilah” menyampaikan kesinambungan naratif tanpa menambahkan penanda waktu seperti “sekarang” yang tidak terdapat secara eksplisit dalam bahasa Ibrani.
- source_word: רָעָב
  choice: kelaparan
  rationale: Dalam konteks ini kata tersebut menunjuk pada bencana kekurangan pangan yang meluas, bukan sekadar rasa lapar seseorang.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ di sini menunjuk pada wilayah tempat Abram berada, bukan seluruh bumi. “Negeri itu” wajar dalam bahasa Indonesia dan mempertahankan acuan geografis tertentu.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Terjemahan ini mempertahankan gambaran geografis dan ungkapan Ibrani tentang perjalanan menuju Mesir.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; “ke Mesir” merupakan padanan Indonesia yang alami.
- source_word: לָגוּר
  choice: untuk tinggal sementara
  rationale: גור menyatakan tinggal sebagai pendatang, biasanya untuk sementara waktu. Teks utama menyampaikan unsur kesementaraannya, sedangkan nuansa status sebagai pendatang dijelaskan dalam catatan kaki.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan langsung dan alami bagi kata keterangan tempat ini.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Abram pergi ke Mesir.
- source_word: כָבֵד
  choice: sangat parah
  rationale: Secara harfiah berarti “berat”, tetapi ketika menerangkan kelaparan kata ini menyatakan tingkat keparahan. “Sangat parah” menyampaikan daya tekan ungkapan Ibrani secara alami.
- source_word: הָרָעָב בָּאָרֶץ
  choice: kelaparan di negeri itu
  rationale: Pengulangan “kelaparan” dan “negeri itu” dipertahankan sesuai dengan teks Ibrani untuk menjaga penekanan dan kepaduan narasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat dipakai agar alur mudah dibaca, sementara “turun ke Mesir” serta pengulangan “di negeri itu” mempertahankan ciri penting teks Ibrani.
