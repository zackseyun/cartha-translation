base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: id
  text: Ia memperlakukan Abram dengan baik karena perempuan itu[a], dan Abram memperoleh kambing domba, sapi, keledai jantan, budak laki-laki, budak perempuan, keledai betina, dan unta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “demi perempuan itu.” Ungkapan Ibrani ini dapat diterjemahkan dengan kedua cara tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: memperlakukan ... dengan baik
  rationale: Bentuk Hifil dari יטב di sini berarti berbuat baik kepada atau memperlakukan seseorang dengan baik; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan Abram sebagai penerima perlakuan tersebut.
- source_word: בַּעֲבוּרָהּ
  choice: karena perempuan itu
  rationale: Ungkapan ini menyatakan sebab atau alasan. Kata ganti feminin dibuat eksplisit sebagai 'perempuan itu' agar rujukannya jelas dan alami dalam bahasa Indonesia, tanpa menyiratkan tujuan benefaktif secara berlebihan.
- source_word: וַיְהִי לוֹ
  choice: sehingga Abram memperoleh
  rationale: Idiom harfiahnya, 'lalu ada padanya,' dalam konteks ini menunjukkan kepemilikan yang timbul sebagai hasil perlakuan baik tersebut. 'Memperoleh' menangkap perkembangan naratif itu, sedangkan 'sehingga' menyatakan hubungan hasil yang tersirat.
- source_word: צֹאן
  choice: kambing domba
  rationale: Nomina kolektif ini dapat mencakup domba dan kambing; 'kambing domba' mempertahankan cakupan ternak kecil tersebut secara ringkas dan lazim dalam daftar ternak Alkitab.
- source_word: בָקָר
  choice: sapi
  rationale: Istilah kolektif bagi ternak besar jenis lembu; 'sapi' merupakan padanan modern yang alami.
- source_word: חֲמֹרִים
  choice: keledai jantan
  rationale: Bentuk jamak maskulin ini dibedakan dari אֲתֹנֹת, sehingga jenis kelaminnya perlu dipertahankan.
- source_word: עֲבָדִים
  choice: budak laki-laki
  rationale: Dalam daftar harta milik, istilah ini paling tepat menggambarkan orang-orang yang berstatus diperbudak, bukan sekadar pekerja atau pelayan; bentuk maskulinnya dipertahankan.
- source_word: שְׁפָחֹת
  choice: budak perempuan
  rationale: Istilah feminin ini menunjuk kepada perempuan yang diperbudak. Padanan ini mempertahankan status sosial dan kontras gender dengan עֲבָדִים.
- source_word: אֲתֹנֹת
  choice: keledai betina
  rationale: Nomina ini secara khusus berarti keledai betina, berlawanan dengan keledai jantan yang disebut sebelumnya.
- source_word: גְמַלִּים
  choice: unta
  rationale: Padanan Indonesia yang baku dan langsung untuk bentuk jamak kolektif dalam daftar ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Subjek pronominal 'Ia' mempertahankan kesinambungan dengan konteks, sedangkan 'perempuan itu' menghindari ketidakjelasan rujukan kata ganti feminin. Daftar harta disajikan dengan istilah konkret dan mempertahankan pembedaan jenis kelamin pada keledai serta orang-orang yang diperbudak.
