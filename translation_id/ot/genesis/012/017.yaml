  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: id
  text: Namun, Yahweh menimpakan tulah-tulah berat kepada Firaun dan seisi rumahnya karena Sarai, istri Abram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Namun, Yahweh menghantam Firaun dan seisi rumahnya dengan pukulan-pukulan hebat karena Sarai, istri Abram.” Kata kerja Ibrani dapat berarti “menyentuh”, “menghantam”, atau “menimpakan penderitaan”, sedangkan kata bendanya dapat berarti “pukulan”, “penderitaan”, atau “tulah”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: menimpakan
  rationale: Bentuk kausatif dari נגע dalam konstruksi dengan נְגָעִים menyatakan bahwa Yahweh mendatangkan atau menimpakan penderitaan; pilihan ini alami dalam bahasa Indonesia bersama kata 'tulah-tulah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai transliterasi Tetragramaton, bukan diganti dengan gelar.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: נְגָעִים גְּדֹלִים
  choice: tulah-tulah berat
  rationale: נְגָעִים dapat berarti pukulan, penderitaan, atau tulah; dalam konteks ini 'tulah' sesuai dengan tindakan penghukuman ilahi, sedangkan גְּדֹלִים menyatakan kedahsyatan atau tingkat keparahannya.
- source_word: וְאֶת בֵּיתוֹ
  choice: dan seisi rumahnya
  rationale: בֵּיתוֹ di sini menunjuk kepada lingkup rumah tangga Firaun, bukan hanya bangunan fisiknya.
- source_word: עַל דְּבַר
  choice: karena
  rationale: Ungkapan ini menyatakan alasan atau penyebab tindakan tersebut secara ringkas dan alami.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, istri Abram
  rationale: Konstruksi aposisional mengidentifikasi Sarai sebagai istri Abram tanpa menambahkan penafsiran mengenai kesalahan atau pelaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Makna kausal עַל דְּבַר שָׂרַי
  choice: karena Sarai
  alternative: karena perkara Sarai atau oleh sebab Sarai
  rationale: Terjemahan ini mempertahankan rumusan ringkas dan ambiguitas teks mengenai tepatnya bagaimana perkara Sarai menjadi penyebab, tanpa menyatakan bahwa Sarai bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Seisi rumahnya' dipilih sebagai ungkapan alami bagi rumah tangga Firaun. Penanda catatan kaki [a] ditempatkan pada klausa yang mengandung alternatif leksikal.
