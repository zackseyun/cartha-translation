  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: id
  text: Kemudian Firaun memanggil Abram dan berkata, “Apa ini yang telah kaulakukan kepadaku? Mengapa engkau tidak memberitahukan kepadaku bahwa dia istrimu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konstruksi קרא dengan לְ yang menunjuk orang, verba ini berarti memanggil atau menyuruh seseorang menghadap. “Memanggil” alami dalam bahasa Indonesia dan tidak menambahkan nuansa resmi yang terlalu kuat.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir ini.
- source_word: לְאַבְרָם
  choice: Abram
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Verba naratif umum אמר diterjemahkan secara langsung sebagai “berkata”; pertanyaan yang menyusul tidak mengharuskan perubahan menjadi “bertanya”.
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: Apa yang telah kaulakukan terhadap aku ini?
  rationale: Susunan ini mempertahankan daya tunjuk זֹאת dan nada teguran, sekaligus terdengar wajar dalam bahasa Indonesia. לִי menyatakan bahwa Firaun memandang tindakan itu sebagai sesuatu yang menimpa atau merugikan dirinya.
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: Mengapa engkau tidak memberitahukan kepadaku
  rationale: Hifil נגד berarti memberitahukan atau menyatakan. Bentuk “engkau” menjaga nada langsung dan bermartabat, sedangkan “kepadaku” mengungkapkan לִי.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi informasi yang tidak disampaikan Abram.
- source_word: אִשְׁתְּךָ הִוא
  choice: dia istrimu
  rationale: Klausa nominal Ibrani menyatakan identitas perempuan itu sebagai istri Abram. “Dia istrimu” mempertahankan penekanan pada subjek tanpa menjadi kaku.
- source_word: וַ
  choice: Kemudian
  rationale: Waw konsekutif memajukan rangkaian cerita; “Kemudian” menyatakan urutan secara alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai dalam ujaran langsung karena cocok dengan register narasi Alkitab, sedangkan enklitik “kau-” membuat pertanyaan pertama tetap alami. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau teologis yang perlu dijelaskan pada ayat ini.
