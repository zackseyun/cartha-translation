  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: id
  text: Dari sana ia berpindah ke daerah perbukitan di sebelah timur Betel. Ia mendirikan kemahnya dengan Betel di sebelah barat dan Ai di sebelah timur. Di sana ia membangun sebuah mezbah bagi Yahweh[a] dan berseru kepada Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, nama diri Allah; secara tradisional diterjemahkan “TUHAN”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memanggil nama Yahweh”. Ungkapan Ibrani ini dapat berarti berseru kepada Yahweh dalam ibadah atau memaklumkan nama-Nya di depan umum.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: ia berpindah
  rationale: Kata kerja ini menyatakan perpindahan dari satu tempat ke tempat lain; “berpindah” alami dalam narasi Indonesia dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: הָהָרָה
  choice: ke daerah perbukitan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju kawasan berbukit. Dalam konteks geografis sekitar Betel, “daerah perbukitan” lebih alami daripada gunung tunggal.
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: di sebelah timur Betel
  rationale: קֶדֶם berfungsi sebagai penunjuk arah, yakni lokasi di sisi timur Betel.
- source_word: וַיֵּט אָהֳלֹה
  choice: Ia mendirikan kemahnya
  rationale: Ungkapan Ibrani ini berarti memasang atau mendirikan kemah.
- source_word: מִיָּם
  choice: di sebelah barat
  rationale: יָם secara harfiah berarti “laut”, tetapi dalam orientasi geografis Ibrani lazim menunjuk arah barat.
- source_word: וְהָעַי מִקֶּדֶם
  choice: dan Ai di sebelah timur
  rationale: Frasa ini menempatkan Ai di sisi timur perkemahan dan mengimbangi keterangan bahwa Betel berada di sisi barat.
- source_word: מִזְבֵּחַ
  choice: sebuah mezbah
  rationale: “Mezbah” adalah padanan baku dan tepat untuk bangunan yang digunakan dalam persembahan atau ibadah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi לְ menyatakan bahwa mezbah itu dibangun bagi Yahweh.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: dan berseru kepada nama Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani dan terutama menyampaikan tindakan memohon atau menyembah, tanpa meniadakan kemungkinan makna mengumumkan nama Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Makna וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: berseru kepada nama Yahweh
  alternative: menyerukan nama Yahweh
  rationale: Dalam konteks pembangunan mezbah, tindakan memohon atau beribadah merupakan makna yang paling langsung. Namun, ungkapan Ibrani juga dapat dipahami sebagai pemberitaan terbuka, sehingga kemungkinan itu dicatat tanpa menghapus ketegangannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur lokasi dibuat jelas bagi pembaca umum, sedangkan istilah “mezbah” dipertahankan karena merupakan istilah Alkitab yang mapan. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskan dan diurutkan menurut kemunculannya.
