  yaml_path: translation/ot/genesis/012/009.yaml
  text: And Abram journeyed on[b][a], going toward the Negev.
translation:
  language: id
  text: Lalu Abram melanjutkan perjalanannya ke arah Negeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke selatan.” Kata Ibrani ini dapat menunjuk pada wilayah selatan yang disebut Negeb atau pada arah selatan; di sini makna wilayah tampaknya lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: melanjutkan perjalanannya
  rationale: Bentuk wayyiqtol qal dari נסע menyatakan bahwa Abram berangkat atau bergerak maju dari tempat sebelumnya. Ungkapan ini secara alami menyampaikan kelanjutan perjalanan tanpa terlalu menegaskan tindakan membongkar kemah.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: melanjutkan perjalanannya
  rationale: Rangkaian infinitif absolut ini memberi nuansa gerak yang berlangsung terus atau semakin maju. Dalam bahasa Indonesia, nuansa tersebut dipadukan secara alami ke dalam verba utama, tanpa menambahkan gagasan khusus seperti perjalanan menurut tahap-tahap.
- source_word: הַנֶּגְבָּה
  choice: ke arah Negeb
  rationale: Kata נֶגֶב dengan artikel dan akhiran direktif paling mungkin menunjuk ke wilayah Negeb sebagai tujuan arah, sambil tetap memungkinkan arti umum 'ke selatan'.
