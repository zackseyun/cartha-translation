  source_fidelity: Struktur waktu "Ketika ia hampir memasuki Mesir" dengan tepat menyampaikan כַּאֲשֶׁר הִקְרִיב לָבוֹא, dan penghilangan formula וַיְהִי dapat diterima dalam bahasa Indonesia karena fungsi naratifnya tetap tersirat. Nama, hubungan Sarai sebagai istri, dan predikasi eksplisit kepada Sarai dipertahankan.
  naturalness: 'Kalimatnya pada dasarnya lancar, tetapi "Ketahuilah, aku tahu" terdengar tidak wajar dalam bahasa Indonesia: bentuk imperatif "Ketahuilah" tidak secara idiomatis menyampaikan penanda perhatian Ibrani הִנֵּה־נָא sebelum pernyataan "aku tahu." "Lihatlah" lebih langsung dan alami dalam register naratif bermartabat.'
  terminology: '"Engkau" dan "perempuan" sesuai dengan register standar modern yang agak luhur. "Cantik parasnya" dapat membatasi makna pada wajah/parasit, sedangkan יְפַת מַרְאֶה menunjuk pada penampilan yang terlihat secara lebih umum. "Cantik dipandang" mempertahankan cakupan tersebut dengan idiom Indonesia yang alami.'
