  to: Ketika ia hampir memasuki Mesir, ia berkata kepada Sarai, istrinya, “Lihatlah, aku tahu bahwa engkau seorang perempuan yang cantik dipandang.[a]”
  rationale: Revisi mengganti pembuka yang tidak idiomatis dengan "Lihatlah" untuk mempertahankan fungsi perhatian dan penekanan dari הִנֵּה־נָא. Frasa mengenai kecantikan juga disesuaikan agar mencakup penampilan yang terlihat secara umum, bukan terutama wajah. Penanda catatan kaki tetap melekat pada frasa yang dijelaskan.
