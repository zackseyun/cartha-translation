base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: id
  text: Ketika ia hampir memasuki Mesir, ia berkata kepada Sarai, istrinya, “Lihatlah, aku tahu bahwa engkau seorang perempuan yang cantik dipandang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “cantik rupanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Gabungan formula naratif dan anak kalimat waktu dialihkan secara alami ke dalam bahasa Indonesia tanpa ungkapan kaku ‘terjadilah bahwa’; urutan peristiwa tetap jelas dari konteks.
- source_word: הִקְרִיב לָבוֹא
  choice: hampir memasuki
  rationale: Bentuk Hifil dari קרב bersama infinitif בוא menyatakan bahwa tindakan memasuki sudah dekat atau segera terjadi.
- source_word: מִצְרָיְמָה
  choice: Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; maknanya sudah tercakup dalam verba ‘memasuki’.
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: Sarai, istrinya
  rationale: Mempertahankan identifikasi aposisional Ibrani dalam susunan Indonesia yang wajar.
- source_word: הִנֵּה נָא
  choice: Ketahuilah
  rationale: Ungkapan ini menarik perhatian sekaligus memberi penekanan; ‘Ketahuilah’ terdengar alami dan bermartabat dalam konteks percakapan, meski nuansa harfiahnya dapat berupa ‘Lihatlah’.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif menyatakan keadaan pengetahuan yang berlaku sekarang.
- source_word: אִשָּׁה יְפַת מַרְאֶה
  choice: seorang perempuan yang cantik parasnya
  rationale: Menyampaikan kecantikan yang tampak secara lahiriah dan mempertahankan sebutan ‘perempuan’, bukan mengulang peran ‘istri’.
- source_word: אָתְּ
  choice: engkau
  rationale: Pronomina feminin tunggal ditegaskan dalam sumber; ‘engkau’ sesuai dengan ragam naratif Alkitab yang modern dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang bermartabat. Formula וַיְהִי tidak diterjemahkan secara mekanis karena menghasilkan konstruksi Indonesia yang janggal; fungsi temporal dan naratifnya tercakup oleh ‘Ketika’. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
