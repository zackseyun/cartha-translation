  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: id
  text: Apabila orang Mesir melihatmu, mereka akan berkata, ‘Perempuan ini istrinya.’ Lalu mereka akan membunuh aku, tetapi membiarkanmu hidup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Apabila
  rationale: Ungkapan ini memperkenalkan keadaan yang Abram yakini akan terjadi. ‘Apabila’ menyampaikan arah ke masa depan dan harapan akan terjadinya peristiwa itu secara alami dalam bahasa Indonesia.
- source_word: יִרְאוּ אֹתָךְ
  choice: melihatmu
  rationale: ראה di sini memakai arti biasa ‘melihat’; bentuk pronominal feminin tunggal diterjemahkan secara alami sebagai ‘-mu’.
- source_word: הַמִּצְרִים
  choice: orang Mesir
  rationale: Sebutan umum dan alami dalam bahasa Indonesia untuk penduduk atau bangsa Mesir.
- source_word: וְאָמְרוּ
  choice: mereka akan berkata
  rationale: Mempertahankan makna ujaran langsung dan orientasi ke masa depan tanpa menambahkan unsur ‘berpikir’ yang tidak dinyatakan.
- source_word: אִשְׁתּוֹ זֹאת
  choice: Perempuan ini istrinya
  rationale: Menyampaikan klausa nominal ‘istrinya, [perempuan] ini’ sekaligus mempertahankan daya tunjuk זֹאת. Penambahan ‘perempuan’ membuat rujukan demonstratif feminin terdengar wajar dalam bahasa Indonesia.
- source_word: וְהָרְגוּ אֹתִי
  choice: Lalu mereka akan membunuh aku
  rationale: הרג berarti ‘membunuh’. ‘Lalu’ menyatakan kelanjutan akibat yang tersirat oleh rangkaian klausa.
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: tetapi membiarkanmu hidup
  rationale: Bentuk Hifil חיה berarti ‘membiarkan tetap hidup’ atau ‘memelihara hidup’. ‘Tetapi’ mengungkapkan pertentangan nyata dengan nasib Abram tanpa mengubah isi klausa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk ‘aku’ dipertahankan dalam ucapan langsung Abram, sedangkan konstruksi ringkas menghindari kekakuan harfiah dari formula pembuka Ibrani.
