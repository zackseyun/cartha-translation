  terminology: «Memberkati», «meremehkan», «Kukutuk», «kaum», dan «bumi» sesuai. «Meremehkan» secara memadai menyampaikan קלל yang lebih ringan daripada ארר, dengan penjelasan leksikal dalam catatan. Catatan alternatif untuk rumusan berkat diperluas agar juga mencatat pembacaan instrumental tanpa menyajikannya sebagai makna utama.
