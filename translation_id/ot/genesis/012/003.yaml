  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: id
  text: Aku akan memberkati orang-orang yang memberkatimu, dan orang yang meremehkanmu akan Kukutuk[a]. Di dalam engkau semua kaum di bumi akan diberkati[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk tindakan orang itu dapat berarti “meremehkan”, “merendahkan”, atau “mengutuk”; kata ini lebih ringan daripada kata berikutnya yang diterjemahkan “Kukutuk”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Melalui engkau semua kaum di bumi akan diberkati.” Bentuk Ibraninya juga dapat dipahami sebagai, “Semua kaum di bumi akan memberkati diri mereka dengan engkau.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: Aku akan memberkati
  rationale: Bentuk orang pertama tunggal menyatakan janji ilahi; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya promisinya.
- source_word: מְבָרְכֶיךָ
  choice: orang-orang yang memberkatimu
  rationale: Partisipel jamak yang dipakai sebagai nomina dipertahankan sebagai kelompok jamak.
- source_word: וּמְקַלֶּלְךָ
  choice: orang yang meremehkanmu
  rationale: קלל dapat berarti menganggap ringan, merendahkan, atau mengutuk. 'Meremehkan' mempertahankan perbedaan kadar dengan ארר yang lebih kuat, sekaligus mempertahankan bentuk tunggal.
- source_word: אָאֹר
  choice: akan Kukutuk
  rationale: ארר adalah verba yang lebih kuat dan secara langsung berarti mengenakan kutuk; 'Kukutuk' mempertahankan eskalasi dari tindakan manusia kepada tanggapan Allah.
- source_word: וְנִבְרְכוּ
  choice: akan diberkati
  rationale: Nifal orang ketiga jamak paling wajar dipahami secara pasif, sementara kemungkinan refleksif atau medial dicatat dalam catatan kaki.
- source_word: בְּךָ
  choice: melalui engkau
  rationale: Preposisi ב dapat menyatakan lingkup maupun sarana. Dalam bahasa Indonesia, 'melalui engkau' menyampaikan nuansa instrumental secara alami tanpa menutup kemungkinan harfiah 'di dalam engkau', yang dicatat dalam catatan kaki.
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: semua kaum di bumi
  rationale: מִשְׁפָּחוֹת menunjuk kelompok kekerabatan atau kaum, sedangkan הָאֲדָמָה dalam konteks janji universal ini paling alami diterjemahkan 'bumi'.
theological_decisions:
- issue: Makna rumusan וְנִבְרְכוּ בְךָ dalam janji kepada Abram
  choice: 'pasif-instrumental: ''Melalui engkau ... akan diberkati'''
  alternative: 'pasif-lokatif: ''di dalam engkau ... akan diberkati''; refleksif/medial: ''akan memberkati diri dengan menyebut engkau'''
  rationale: Bentuk Nifal memungkinkan perdebatan antara makna pasif dan refleksif/medial, sedangkan בְּךָ dapat dipahami sebagai lingkup atau sarana. Teks utama memakai ungkapan Indonesia yang alami, dan catatan mempertahankan alternatif yang sungguh-sungguh dimungkinkan oleh bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. 'Aku' mempertahankan tuturan langsung ilahi yang wajar; 'engkau' dipakai untuk sapaan tunggal yang bermartabat. Kontras jamak 'orang-orang' dan tunggal 'orang' dipertahankan.
