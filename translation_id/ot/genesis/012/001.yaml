id: GEN.12.1
reference: Genesis 12:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: id
  text: Yahweh berfirman kepada Abram, “Pergilah dari negerimu, dari kaum kerabatmu, dan dari rumah ayahmu ke negeri yang akan Kutunjukkan kepadamu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara eksplisit terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: לֶךְ־לְךָ
  choice: Pergilah
  rationale: Ungkapan idiomatis ini menyampaikan perintah tegas agar Abram berangkat; pronomina datif tidak perlu diterjemahkan terpisah dalam bahasa Indonesia.
- source_word: מֵאַרְצְךָ
  choice: dari negerimu
  rationale: ’Erets di sini menunjuk wilayah atau negeri asal Abram, bukan sekadar tanah miliknya.
- source_word: מִמּוֹלַדְתְּךָ
  choice: dari kaum kerabatmu
  rationale: Dalam konteks ini, molédet menunjuk lingkungan kekerabatan atau sanak saudara asal, bukan hanya tempat kelahiran.
- source_word: מִבֵּית אָבִיךָ
  choice: dari rumah ayahmu
  rationale: Mempertahankan ungkapan sosial-keluarga Ibrani yang menunjuk rumah tangga pihak ayah.
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: ke negeri yang akan Kutunjukkan kepadamu
  rationale: Mencerminkan tujuan perjalanan yang belum disebutkan dan janji Yahweh untuk memperlihatkannya kepada Abram.
theological_decisions:
- issue: Penyajian nama ilahi
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton; bentuk “Yahweh” menjaga pembedaan antara nama diri ilahi dan gelar.
- issue: Ketidakpastian tujuan panggilan
  choice: negeri yang akan Kutunjukkan kepadamu
  alternative: negeri yang Kutunjukkan kepadamu
  rationale: Bentuk verba Ibrani menyatakan tindakan yang akan dilakukan, sehingga tujuan Abram tetap belum diketahui pada saat perintah diberikan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan khidmat. “Berfirman” dipakai secara wajar untuk tuturan ilahi; susunan tiga frasa “dari” mempertahankan gerak bertahap dari negeri, kaum kerabat, hingga rumah ayah.
