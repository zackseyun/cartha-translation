reference: Genesis 12:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: id
  text: Abram membawa Sarai, istrinya, Lot, anak laki-laki saudara Abram, segala harta benda yang telah mereka peroleh, serta orang-orang yang telah mereka himpun di Haran.[a] Mereka berangkat menuju tanah Kanaan, lalu tiba di tanah Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang-orang yang telah mereka peroleh”; secara lebih harfiah, “jiwa-jiwa yang telah mereka buat.” Ungkapan Ibrani ini kemungkinan menunjuk pada orang-orang yang menjadi bagian dari rumah tangga mereka di Haran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks keberangkatan bersama sejumlah orang dan harta, "membawa" lebih alami dalam bahasa Indonesia daripada "mengambil", tanpa mengubah fungsi naratif verba tersebut.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Dalam konteks perkawinan, אִשָּׁה dengan sufiks posesif berarti "istrinya".
- source_word: בֶּן אָחִיו
  choice: anak laki-laki saudaranya
  rationale: Mempertahankan rincian harfiah bahwa Lot adalah anak laki-laki dari saudara Abram; "keponakannya" lebih ringkas, tetapi kurang transparan terhadap bentuk Ibrani.
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: segala harta benda yang telah mereka peroleh
  rationale: רְכוּשׁ menunjuk pada milik atau harta, sedangkan רכשׁ berarti memperoleh atau mengumpulkan; padanan ini alami dan tetap dekat dengan makna sumber.
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: orang-orang yang telah mereka himpun
  rationale: נֶפֶשׁ di sini berarti orang-orang, sedangkan עָשׂוּ merupakan ungkapan sulit yang dalam konteks ini kemungkinan menunjuk pada penghimpunan atau perolehan anggota rumah tangga. "Himpun" menghasilkan bahasa Indonesia yang wajar tanpa meniadakan alternatif leksikal yang dicatat dalam catatan kaki.
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: mereka berangkat menuju
  rationale: Gabungan verba ini menyatakan keberangkatan dengan tujuan tertentu. "Berangkat menuju" menyampaikan gerak dan arah secara alami.
- source_word: אַרְצָה כְּנַעַן
  choice: menuju tanah Kanaan
  rationale: Akhiran penunjuk arah pada אַרְצָה mendukung makna gerak menuju Kanaan, dan kata "tanah" mempertahankan unsur אֶרֶץ.
- source_word: וַיָּבֹאוּ אַרְצָה כְּנַעַן
  choice: lalu tiba di tanah Kanaan
  rationale: Menyampaikan tercapainya tujuan secara alami, sambil mempertahankan pengulangan nama tujuan yang terdapat dalam teks Ibrani.
theological_decisions:
- issue: Makna ungkapan הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: orang-orang yang telah mereka himpun
  alternative: orang-orang yang telah mereka peroleh; secara harfiah, jiwa-jiwa yang telah mereka buat
  rationale: Ungkapan Ibrani bersifat idiomatis dan tidak perlu dipahami sebagai tindakan menciptakan manusia. Terjemahan utama memberi makna kontekstual yang paling mungkin, sedangkan catatan kaki mempertahankan bentuk harfiah dan kemungkinan nuansa perolehan tanpa menentukan status sosial orang-orang itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “tanah Kanaan” dipertahankan karena terdapat dalam sumber Ibrani. Tanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskannya.
