source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/ב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָ/ה וַ/יִּרְא֤וּ הַ/מִּצְרִים֙ אֶת הָ֣/אִשָּׁ֔ה כִּֽי יָפָ֥ה הִ֖וא מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/014.yaml
  text: And when Abram entered Egypt[a], the Egyptians saw that the woman was very beautiful.
translation:
  language: id
  text: Ketika Abram memasuki Mesir, orang-orang Mesir melihat bahwa perempuan itu sangat cantik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “istri itu.” Kata Ibrani אִשָּׁה dapat berarti “perempuan” atau “istri”; di sini terjemahan mempertahankan sebutan yang lebih umum dalam klausa tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹא
  choice: Ketika ... memasuki
  rationale: Rangkaian ini memperkenalkan keadaan waktu dalam alur narasi. Ungkapan Indonesia ini alami dan menyampaikan masuknya Abram ke Mesir tanpa mempertahankan rumusan harfiah yang kaku, 'terjadilah ketika'.
- source_word: מִצְרָיְמָה
  choice: Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; dalam bahasa Indonesia makna itu sudah tercakup dalam verba 'memasuki'.
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Verba ראה di sini secara langsung berarti melihat; pilihan ini lebih dekat dengan sumber daripada 'memperhatikan' atau 'menyadari'.
- source_word: הַמִּצְרִים
  choice: orang-orang Mesir
  rationale: Bentuk gentilisia jamak tertentu secara alami merujuk kepada penduduk Mesir.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: אִשָּׁה dapat berarti 'perempuan' atau 'istri'. Pilihan yang lebih umum mempertahankan bentuk klausa Ibrani dan tidak memperjelas hubungan perkawinan yang tidak dinyatakan secara khusus dalam kata ini.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang mereka lihat, sehingga 'bahwa' merupakan penghubung Indonesia yang alami.
- source_word: יָפָה הִוא מְאֹד
  choice: perempuan itu sangat cantik
  rationale: יָפָה menyatakan kecantikan fisik dan מְאֹד memperkuatnya. Dalam susunan Indonesia, pronomina הִוא terwakili oleh subjek 'perempuan itu' sebelum predikat 'sangat cantik'.
