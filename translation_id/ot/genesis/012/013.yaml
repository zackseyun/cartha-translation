  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: id
  text: Katakanlah bahwa engkau adalah saudariku, supaya aku beroleh kebaikan karena engkau dan aku tetap hidup oleh karena engkau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian terakhir berbunyi, “dan jiwaku akan hidup oleh karena engkau.” Kata Ibrani nefesh di sini berarti diri atau nyawa Abram.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: Katakanlah
  rationale: Bentuk imperatif feminin tunggal dengan partikel נָא menyatakan permintaan yang diperhalus. Akhiran -lah memberi nuansa permintaan yang wajar dan bermartabat dalam bahasa Indonesia tanpa perlu menambahkan 'tolong'.
- source_word: אֲחֹתִי אָתְּ
  choice: bahwa engkau adalah saudariku
  rationale: Menyampaikan predikasi langsung 'engkau adalah saudariku'; 'bahwa' dilengkapi secara alami setelah verba 'katakanlah'.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil yang diharapkan dengan jelas dan alami.
- source_word: יִיטַב לִי
  choice: aku diperlakukan dengan baik
  rationale: Idiom verba יטב dengan ל dapat berarti keadaan menjadi baik bagi seseorang; dalam konteks ini bentuk ini secara alami menyatakan perlakuan baik yang diharapkan Abram tanpa mengubah maksudnya.
- source_word: בַעֲבוּרֵךְ
  choice: karena engkau
  rationale: Mengungkapkan sebab atau dasar keuntungan yang Abram harapkan melalui Sarai.
- source_word: וְחָיְתָה נַפְשִׁי
  choice: dan aku tetap hidup
  rationale: Secara harfiah 'dan nefesh-ku akan hidup'; נֶפֶשׁ di sini menunjuk pada diri atau nyawa Abram. Ungkapan Indonesia ini menyampaikan maksud idiomatis tanpa mengimpor gagasan khusus tentang jiwa tak berjasad.
- source_word: בִּגְלָלֵךְ
  choice: oleh karena engkau
  rationale: Mempertahankan ungkapan kausal kedua dan pengulangan penekanan dalam bahasa Ibrani, sambil sedikit membedakan bentuk Indonesianya dari בַעֲבוּרֵךְ.
