translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai agar sesuai dengan tuturan langsung dalam narasi Alkitab. Dua ungkapan sebab yang berdekatan dipertahankan sebagai 'karena engkau' dan 'oleh karena engkau'.
