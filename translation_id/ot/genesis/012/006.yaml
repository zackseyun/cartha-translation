base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: id
  text: Abram melintasi negeri itu sampai ke tempat Sikhem, sampai ke pohon besar[a] More. Pada waktu itu, orang Kanaan berada di negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pohon tarbantin More" atau "pohon ek More"; istilah Ibraninya menunjuk pada pohon besar, tetapi jenis pohon yang tepat tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau "orang-orang Kanaan berada di negeri itu." Bahasa Ibrani memakai sebutan etnis berbentuk tunggal yang dapat berfungsi secara kolektif.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: berjalan melintasi
  rationale: Kata kerja עבר dalam bentuk naratif menggambarkan Abram bergerak melalui negeri itu; pilihan ini alami dalam bahasa Indonesia tanpa menentukan rute atau cara perjalanan secara berlebihan.
- source_word: בָּאָרֶץ
  choice: negeri itu
  rationale: Dengan kata sandang, frasa ini menunjuk kepada negeri yang sedang dibicarakan, yaitu Kanaan. 'Negeri itu' alami dan mempertahankan acuan teritorialnya.
- source_word: עַד מְקוֹם שְׁכֶם
  choice: sampai ke tempat Sikhem
  rationale: עַד menyatakan batas perjalanan, sedangkan מְקוֹם diikuti nama Sikhem. Terjemahan ini tidak mengandaikan bahwa Sikhem pada masa itu sudah merupakan kota yang berkembang sepenuhnya.
- source_word: אֵלוֹן מוֹרֶה
  choice: pohon besar More
  rationale: אֵלוֹן menunjuk pada sejenis pohon besar, tetapi spesies tepatnya tidak pasti. Terjemahan umum menjaga ketidakpastian leksikal; alternatif tradisional dicatat dalam catatan kaki.
- source_word: מוֹרֶה
  choice: More
  rationale: Di sini paling wajar dipahami sebagai nama diri yang menerangkan lokasi pohon, bukan diterjemahkan secara spekulatif sebagai 'pengajar' atau 'peramal'.
- source_word: וְהַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk Ibrani tunggal dengan kata sandang dapat berfungsi secara kolektif bagi kelompok etnis. Ungkapan Indonesia 'orang Kanaan' juga dapat dibaca secara kolektif dan tetap dekat dengan bentuk sumber.
- source_word: אָז
  choice: pada waktu itu
  rationale: Adverbia ini menyatakan keadaan pada tahap tersebut dalam cerita; 'pada waktu itu' jelas dan alami.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Pengulangan frasa sumber dipertahankan untuk kohesi dan penekanan pada keberadaan orang Kanaan di wilayah tersebut.
theological_decisions:
- issue: Bilangan dan fungsi kolektif etnonim וְהַכְּנַעֲנִי
  choice: orang Kanaan tinggal di negeri itu
  alternative: orang-orang Kanaan tinggal di negeri itu
  rationale: Bahasa Ibrani memakai bentuk etnonim tunggal yang lazim berfungsi secara kolektif. Bentuk Indonesia 'orang Kanaan' mempertahankan ketegangan antara bentuk tunggal dan makna kelompok tanpa menjadikannya seorang individu tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama אַבְרָם ditulis 'Abram', שְׁכֶם sebagai 'Sikhem', dan מוֹרֶה sebagai 'More'. Semua penanda catatan kaki ditempatkan dalam teks utama.
