  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ אַבְרָ֗ם כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר אֵלָי/ו֙ יְהוָ֔ה וַ/יֵּ֥לֶךְ אִתּ֖/וֹ ל֑וֹט וְ/אַבְרָ֗ם בֶּן חָמֵ֤שׁ שָׁנִים֙ וְ/שִׁבְעִ֣ים שָׁנָ֔ה בְּ/צֵאת֖/וֹ מֵ/חָרָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: id
  text: Lalu Abram pergi, seperti yang telah Yahweh firmankan kepadanya, dan Lot pergi bersamanya. Abram berumur tujuh puluh lima tahun ketika ia berangkat dari Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergilah / pergi
  rationale: Bentuk wayyiqtol dari הלך menyatakan gerak dalam rangkaian narasi. 'Pergilah Abram' alami dalam bahasa Indonesia dan mempertahankan alur cerita; pada klausa tentang Lot, 'pergi' menghindari penambahan nuansa yang tidak ada dalam teks.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan Abram dengan firman Yahweh sebelumnya. 'Tepat seperti' menegaskan kesesuaian itu tanpa menambahkan penilaian eksplisit.
- source_word: דִּבֶּר אֵלָיו
  choice: yang telah difirmankan ... kepadanya
  rationale: '''Telah'' menandai bahwa firman itu mendahului kepergian Abram. ''Berfirman'' merupakan padanan Indonesia yang wajar dan bermartabat ketika subjeknya Allah.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama diri dalam teks Ibrani tetap tampak.
- source_word: אִתּוֹ
  choice: bersamanya
  rationale: Padanan ringkas dan alami untuk preposisi 'dengan' beserta sufiks pronominal orang ketiga.
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: berumur tujuh puluh lima tahun
  rationale: Ini menyampaikan idiom usia Ibrani secara langsung dalam bahasa Indonesia modern tanpa mempertahankan susunan angka yang kaku.
- source_word: בְּצֵאתוֹ
  choice: ketika ia berangkat
  rationale: Infinitif konstruk dengan ב menandai waktu keluarnya Abram. 'Ketika ia berangkat' alami dalam konteks awal perjalanan dan tidak berlebihan.
- source_word: מֵחָרָן
  choice: dari Haran
  rationale: Preposisi מ diterjemahkan 'dari', sedangkan nama tempat dipertahankan dalam bentuk lazim 'Haran'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama ilahi dan tidak menggantinya dengan gelar; bentuk 'Yehova' mencerminkan pelafalan gabungan yang lebih belakangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani, tetapi idiom usia dan waktu dibuat alami bagi pembaca umum. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu ditampilkan dalam ayat ini.
