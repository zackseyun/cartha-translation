lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyatakan perkembangan peristiwa secara alami. “Berfirman” adalah padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini, אֱלֹהִים menunjuk kepada satu-satunya Allah; “Allah” merupakan padanan baku dalam bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan ujaran; “kepada” adalah bentuk alami dalam bahasa Indonesia.
- source_word: נֹחַ
  choice: Nuh
  rationale: Nama Ibrani ini diterjemahkan menurut bentuk baku yang dikenal dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: berfirman,
  rationale: Ungkapan Ibrani ini memperkenalkan isi perkataan yang menyusul. Dalam bahasa Indonesia, menerjemahkannya lagi sebagai “dengan berkata” akan terasa kaku dan berulang setelah “berfirman”; tanda koma secara alami menghubungkan klausa ini dengan kutipan berikutnya.
