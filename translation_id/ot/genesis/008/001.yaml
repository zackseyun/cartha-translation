  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: id
  text: Namun, Allah mengingat Nuh[a], semua binatang liar, dan semua ternak yang bersamanya di dalam bahtera. Lalu Allah membuat angin bertiup di atas bumi[b], dan air pun surut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah memperhatikan Nuh.” Kata Ibrani yang diterjemahkan “mengingat” sering menyiratkan perhatian setia yang diwujudkan dalam tindakan, bukan sekadar teringat kembali.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani רוּחַ dapat berarti “angin”, “napas”, atau “roh”. Dalam konteks ini, “angin” paling sesuai, meskipun mungkin terdapat gema gambaran Roh/angin di atas air dalam Kejadian 1:2.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: mengingat
  rationale: Mempertahankan ungkapan antropomorfis Ibrani. Dalam konteks naratif, kata ini menyiratkan perhatian setia yang diwujudkan dalam tindakan, bukan sekadar teringat kembali.
- source_word: כָּל הַחַיָּה
  choice: semua binatang liar
  rationale: חַיָּה di sini dibedakan dari בְּהֵמָה dan paling wajar menunjuk pada binatang liar.
- source_word: כָּל הַבְּהֵמָה
  choice: semua ternak
  rationale: Dalam pasangan dengan חַיָּה, בְּהֵמָה menunjuk pada hewan piaraan atau ternak; pilihan ini mempertahankan pembedaan kedua kelompok.
- source_word: בַּתֵּבָה
  choice: di dalam bahtera
  rationale: Bahtera merupakan padanan Indonesia yang mapan dan jelas dalam konteks kisah Nuh.
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: membuat angin bertiup melintasi
  rationale: רוּחַ dapat berarti angin, napas, atau roh, tetapi fungsi langsungnya di sini bersifat meteorologis. Rumusan kausatif mencerminkan bentuk Hifil dari עבר secara alami dalam bahasa Indonesia.
- source_word: עַל הָאָרֶץ
  choice: melintasi bumi
  rationale: אֶרֶץ dapat berarti bumi atau daratan; cakupan kisah air bah mendukung 'bumi', sedangkan 'melintasi' menyampaikan gerak angin di atas permukaannya secara alami.
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: air pun surut
  rationale: Ungkapan Indonesia ini secara alami menyampaikan mereda atau berkurangnya air bah.
- source_word: וַ
  choice: Namun / Lalu
  rationale: Pada awal ayat, 'Namun' menandai peralihan naratif dari penghukuman menuju tindakan penyelamatan; sebelum tindakan berikutnya, 'Lalu' menyatakan kelanjutan peristiwa.
theological_decisions:
- issue: Bahasa antropomorfis dalam ungkapan 'Allah mengingat Nuh'
  choice: Mempertahankan ungkapan 'Allah mengingat Nuh'
  alternative: Allah memperhatikan Nuh
  rationale: Ungkapan sumber dipertahankan tanpa menjelaskan ketegangan teologisnya di dalam teks utama. Dalam konteks, mengingat berarti perhatian setia yang menghasilkan tindakan, bukan bahwa Allah sebelumnya lupa.
- issue: Makna רוּחַ dalam kisah air bah
  choice: angin
  alternative: roh / Roh
  rationale: Dampak langsungnya terhadap air mendukung arti meteorologis 'angin'. Kemungkinan gema gambaran penciptaan dan rentang makna kata Ibrani tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. 'Bersama-sama dengan dia' dipakai untuk menghindari kemungkinan sesaat bahwa 'bersamanya' merujuk kepada kelompok hewan terdekat. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
