  source_fidelity: 'Draf pada umumnya setia pada struktur dan cakupan Ibrani: perintah kausatif untuk membawa keluar semua makhluk, daftar burung–ternak–binatang melata, serta tiga verba proliferasi dipertahankan. Namun, “berkeriapan” bukan padanan baku yang jelas dan alami untuk וְשָׁרְצוּ dalam bahasa Indonesia modern, sehingga gambaran proliferasi yang berlimpah tidak tersampaikan dengan aman.'
  naturalness: “Bawalah keluar bersamamu” dapat dipahami, tetapi “Bawalah keluar bersama-sama denganmu” lebih idiomatis. “Yang ada bersamamu” dapat dipadatkan menjadi “yang bersamamu”. “Berkembang biak dengan berlimpah” merupakan ungkapan baku dan jelas, sementara tetap membiarkan dua verba berikutnya menyatakan kesuburan dan pertambahan jumlah.
  terminology: “Makhluk hidup,” “segala makhluk berdaging,” “burung-burung,” “ternak,” dan “binatang melata yang merayap” secara memadai mencerminkan istilah Ibrani dan register Alkitab Indonesia modern. “Beranak cucu” cocok untuk פָּרָה dalam konteks hewan dan mempertahankan gaya berkat penciptaan tanpa menambahkan penafsiran.
