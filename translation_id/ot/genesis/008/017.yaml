  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: id
  text: Bawalah keluar bersama-sama denganmu setiap makhluk hidup yang bersamamu, dari antara segala makhluk berdaging—burung-burung, ternak, dan segala binatang melata yang merayap di bumi—supaya mereka berkembang biak dengan berlimpah[a] di bumi, beranak cucu, dan bertambah banyak di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berkerumun di bumi.” Kata kerja Ibrani ini dapat menggambarkan makhluk yang berkerumun atau berkembang biak dengan sangat banyak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: setiap makhluk hidup
  rationale: Mencakup seluruh hewan yang kemudian dirinci sebagai burung, ternak, dan binatang melata, tanpa mempersempit חַיָּה menjadi hewan liar.
- source_word: אֲשֶׁר אִתְּךָ
  choice: yang ada bersamamu
  rationale: Menerjemahkan klausa relatif secara langsung dan alami dalam bahasa Indonesia modern.
- source_word: מִכָּל בָּשָׂר
  choice: dari antara segala yang berdaging
  rationale: Mempertahankan citra konkret בָּשָׂר, yang dalam kisah air bah menunjuk secara kolektif kepada makhluk bernyawa, sekaligus membuat hubungan partitif מִן jelas.
- source_word: בָּעוֹף
  choice: burung-burung
  rationale: Padanan alami untuk עוֹף dalam rangkaian kategori makhluk hidup ini; bentuk ulang menyatakan kelas secara umum.
- source_word: וּבַבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה dalam konteks penggolongan ini terutama menunjuk hewan darat besar atau piaraan; 'ternak' ringkas dan lazim.
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: dan segala binatang melata yang merayap
  rationale: Memakai dua kata serumpun makna untuk mencerminkan pengulangan רמשׂ tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: הוֹצֵא אִתָּךְ
  choice: Bawalah keluar bersamamu
  rationale: 'Menjaga daya kausatif bentuk Hifil: Nuh harus membawa makhluk-makhluk itu keluar, bukan sekadar keluar bersama mereka.'
- source_word: וְשָׁרְצוּ
  choice: supaya mereka berkeriapan
  rationale: '''Berkeliaran dalam jumlah besar'' atau ''berkeriapan'' menangkap gagasan gerak dan kelimpahan dari שׁרץ; konstruksi ''supaya'' menyatakan hasil yang dimaksud dalam konteks perintah.'
- source_word: בָאָרֶץ
  choice: di bumi
  rationale: Konteks pasca-air bah berskala bumi; preposisi Indonesia 'di' alami untuk keberadaan dan perkembangbiakan.
- source_word: וּפָרוּ וְרָבוּ
  choice: beranak cucu, dan bertambah banyak
  rationale: Ungkapan ini alami bagi hewan serta mempertahankan gema berkat penciptaan tentang kesuburan dan pertambahan jumlah.
theological_decisions:
- issue: Gema berkat penciptaan sesudah air bah
  choice: 'Mempertahankan tiga unsur perkembangan yang melimpah: ''berkeriapan ... beranak cucu, dan bertambah banyak.'''
  alternative: Meringkasnya menjadi 'berkembang biaklah dengan sangat banyak.'
  rationale: Kosakata Ibrani sengaja menggemakan bahasa penciptaan dan berkat dalam Kejadian 1. Mempertahankan unsur-unsurnya menampilkan pembaruan sesudah penghukuman tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Segala yang berdaging' sengaja mempertahankan idiom Ibrani, sedangkan 'berkeriapan' menjaga gambaran kelimpahan yang konkret. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskan.
