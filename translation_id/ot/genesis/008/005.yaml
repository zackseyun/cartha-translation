  text: וְ/הַ/מַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְ/חָס֔וֹר עַ֖ד הַ/חֹ֣דֶשׁ הָֽ/עֲשִׂירִ֑י בָּֽ/עֲשִׂירִי֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽ/הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: id
  text: Air itu terus surut sampai bulan kesepuluh. Pada bulan kesepuluh, pada hari pertama bulan itu, puncak-puncak gunung mulai terlihat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terlihat” atau “tampak.” Kata kerja Ibrani dapat diterjemahkan lebih harfiah demikian; “mulai terlihat” menekankan munculnya puncak-puncak gunung ke dalam pandangan ketika air surut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּיִם
  choice: air itu
  rationale: Dalam bahasa Indonesia, 'air' lazim dipakai sebagai nomina massa tunggal; penunjuk 'itu' menandai air bah yang sedang dibicarakan.
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: terus surut
  rationale: Gabungan היה dengan bentuk infinitif absolut menyatakan proses yang berlangsung terus; 'terus surut' alami dalam konteks air bah dan mempertahankan aspek progresifnya.
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: sampai bulan kesepuluh
  rationale: חֹדֶשׁ di sini merupakan penanda waktu dan secara wajar diterjemahkan 'bulan'.
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: Pada bulan kesepuluh, pada hari pertama bulan itu
  rationale: Ungkapan Ibrani yang eliptis diperjelas secara wajar dalam bahasa Indonesia sambil mempertahankan susunan penanggalannya.
- source_word: נִרְאוּ
  choice: mulai terlihat
  rationale: Bentuk Nifal dapat menyatakan keadaan pasif atau kemunculan ke dalam pandangan. 'Mulai terlihat' menyampaikan bahwa puncak-puncak itu tampak seiring surutnya air tanpa menentukan pengamat tertentu.
- source_word: רָאשֵׁי הֶהָרִים
  choice: puncak-puncak gunung
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi dalam konteks topografi menunjuk bagian teratas gunung; 'puncak-puncak gunung' merupakan ungkapan Indonesia yang alami.
