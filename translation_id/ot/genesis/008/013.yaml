  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: id
  text: Pada tahun keenam ratus satu[a], pada bulan pertama, pada hari pertama bulan itu, air telah mengering dari atas bumi. Lalu Nuh menyingkirkan penutup bahtera[b] dan ia melihat; ternyata permukaan tanah sudah kering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada tahun satu dan enam ratus.” Dalam konteks, ini kemungkinan menunjuk pada tahun ke-601 kehidupan Nuh.
    reason: Menjelaskan bentuk bilangan Ibrani dan acuan waktunya yang tersirat tanpa memasukkan tafsiran itu ke dalam teks utama.
  - marker: b
    text: Atau, “atap bahtera.” Kata Ibrani ini berarti sesuatu yang menutupi dan tidak menentukan bentuk bangunannya secara khusus.
    reason: Mencatat alternatif arsitektural yang mungkin sambil mempertahankan padanan leksikal yang lebih umum dalam teks.
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam pemberitahuan waktu ini, bentuk naratif היה dapat disampaikan secara alami melalui pembukaan temporal bahasa Indonesia tanpa ungkapan tambahan seperti 'terjadilah'.
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: pada tahun keenam ratus satu
  rationale: Menyampaikan bilangan tahun secara wajar dalam bahasa Indonesia sambil tidak menambahkan keterangan bahwa itu adalah tahun umur Nuh, yang hanya tersirat dari konteks.
- source_word: בָּרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Kata 'bulan' yang eliptis diperjelas dari konteks penanggalan.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: pada hari pertama bulan itu
  rationale: Ungkapan tanggal Ibrani diterjemahkan secara jelas dan alami.
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: air telah mengering dari atas bumi
  rationale: Menjaga makna חרב 'mengering' dan nuansa מֵעַל 'dari atas', dengan bentuk lampau yang sesuai konteks naratif.
- source_word: וַיָּסַר
  choice: menyingkirkan
  rationale: Menyatakan tindakan memindahkan atau melepaskan sesuatu dari tempatnya dengan bahasa Indonesia yang alami.
- source_word: מִכְסֵה
  choice: penutup
  rationale: Padanan leksikal yang tidak mempersempit artinya menjadi struktur khusus seperti atap.
- source_word: הַתֵּבָה
  choice: bahtera
  rationale: Istilah Indonesia yang lazim dan mapan bagi תבה dalam kisah Nuh.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Mempertahankan verba penglihatan dasar; dalam rangkaian tindakan ini artinya ialah Nuh mengamati setelah membuka penutup.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Menghadirkan fungsi penarik perhatian dan penemuan dari הִנֵּה secara alami dalam narasi Indonesia modern.
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: permukaan tanah sudah kering
  rationale: פְּנֵי dinyatakan sebagai 'permukaan', sedangkan אֲדָמָה sebagai 'tanah'; 'sudah kering' menyampaikan keadaan yang tampak oleh Nuh.
theological_decisions:
- issue: Acuan 'tahun keenam ratus satu'
  choice: Tidak menjelaskan dalam teks bahwa ini adalah tahun umur Nuh
  alternative: pada tahun keenam ratus satu umur Nuh
  rationale: Konteks sebelumnya mendukung penghitungan umur Nuh, tetapi ayat ini sendiri tidak menyatakannya secara eksplisit; terjemahan mempertahankan keimplisitan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Ternyata' dipilih daripada 'lihatlah' agar fungsi וְהִנֵּה terasa alami tanpa menjadi arkais. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
