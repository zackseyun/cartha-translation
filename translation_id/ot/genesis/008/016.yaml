  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: id
  text: “Keluarlah dari bahtera itu bersama istrimu, putra-putramu, dan istri-istri putra-putramu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא
  choice: Keluarlah
  rationale: Bentuk imperatif maskulin tunggal dari יצא yang memerintahkan Nuh meninggalkan ruang tertutup; bentuk ini alami dan langsung dalam bahasa Indonesia.
- source_word: מִן הַתֵּבָה
  choice: dari bahtera itu
  rationale: Preposisi מִן menyatakan gerak keluar dari bahtera. Kata sandang pada הַתֵּבָה diwakili oleh 'itu', dan 'bahtera' merupakan padanan Indonesia yang lazim dalam konteks Nuh.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina mandiri ini menyebut Nuh secara eksplisit dalam daftar orang yang harus keluar. 'Engkau' mempertahankan sapaan tunggal dan register yang bermartabat.
- source_word: וְאִשְׁתְּךָ
  choice: bersama istrimu
  rationale: Dalam konstruksi posesif ini אִשָּׁה berarti 'istri'. 'Bersama' menyatakan bahwa istri Nuh termasuk dalam rombongan yang diperintahkan keluar.
- source_word: וּבָנֶיךָ
  choice: anak-anakmu laki-laki
  rationale: בָּנִים secara khusus berarti anak laki-laki atau para putra. Bentuk ini akurat sekaligus mudah dipahami oleh pembaca Indonesia modern.
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: istri anak-anakmu
  rationale: Secara harfiah berarti 'istri-istri anak-anakmu laki-laki'. Dalam konteks ini bentuk Indonesia tersebut alami dan tetap dekat dengan susunan Ibrani.
- source_word: אִתָּךְ
  choice: bersama ... engkau
  rationale: Preposisi ini menandai penyertaan seluruh keluarga dengan Nuh. Dalam bahasa Indonesia, maknanya disampaikan secara alami dengan menempatkan 'bersama' sebelum daftar anggota keluarga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' dipakai untuk menjaga kejelasan bahwa perintah ditujukan kepada Nuh. Tidak diperlukan catatan kaki karena susunan literal mengenai istri para anak dapat diterjemahkan secara wajar tanpa kehilangan makna.
