  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: id
  text: Lalu Nuh keluar bersama anak-anak lelakinya, istrinya, dan istri anak-anak lelakinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lalu ... keluar
  rationale: Bentuk naratif Ibrani melanjutkan rangkaian peristiwa. “Lalu” wajar dalam narasi Indonesia, sedangkan “keluar” secara langsung mencerminkan יָצָא.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: וּבָנָיו
  choice: bersama anak-anak lelakinya
  rationale: בָּנִים di sini menunjuk khusus kepada anak-anak lelaki Nuh. Kata “bersama” merangkai seluruh daftar secara alami dengan penutup אִתּוֹ tanpa mengubah siapa yang menyertai Nuh.
- source_word: וְאִשְׁתּוֹ
  choice: istrinya
  rationale: Nomina tunggal dengan akhiran orang ketiga maskulin tunggal berarti “istrinya”; pronomina dipertahankan sesuai struktur Ibrani.
- source_word: וּנְשֵׁי בָנָיו
  choice: istri anak-anak lelakinya
  rationale: Secara harfiah berarti “istri-istri anak-anak lelakinya.” Dalam bahasa Indonesia, bentuk “istri anak-anak lelakinya” alami dan jelas dalam konteks; “menantu-menantu perempuannya” lebih tidak langsung.
- source_word: אִתּוֹ
  choice: bersama
  rationale: Berarti “dengan dia.” Dalam susunan Indonesia, unsur ini ditempatkan sebelum daftar sebagai “bersama” agar kalimat mengalir alami dan cakupannya tetap sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar dibuat alami dengan memindahkan gagasan אִתּוֹ (“dengan dia”) ke depan sebagai “bersama,” tanpa menghilangkan unsur makna. “Anak-anak lelaki” dipilih untuk mempertahankan kekhususan gender dari בָּנִים.
