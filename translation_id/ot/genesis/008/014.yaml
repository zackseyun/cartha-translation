translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “bulan” dipertahankan karena mengikuti ketepatan rumus tanggal dalam teks Ibrani, sedangkan konjungsi awal tidak diterjemahkan secara eksplisit agar kalimat tetap alami.
