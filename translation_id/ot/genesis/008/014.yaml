base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/014.yaml
  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: id
  text: Pada bulan kedua, pada hari kedua puluh tujuh bulan itu, bumi sudah kering.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah itu sudah kering.” Kata Ibrani אֶרֶץ dapat berarti “bumi”, “negeri”, atau “tanah”; “bumi” dipilih di sini karena kisah air bah menggambarkan pengeringan ini dalam lingkup yang luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ
  choice: Pada bulan
  rationale: Konjungsi ו dan preposisi ב melanjutkan urutan narasi sekaligus memperkenalkan keterangan waktu. Dalam bahasa Indonesia modern, “Pada bulan” menyampaikan fungsi ini secara alami tanpa harus menerjemahkan ו secara tersendiri.
- source_word: הַשֵּׁנִי
  choice: kedua
  rationale: Kata bilangan bertingkat ini menerangkan “bulan”; bentuk alami dalam bahasa Indonesia ialah “bulan kedua”.
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: pada hari kedua puluh tujuh bulan itu
  rationale: Ini adalah rumus penanggalan Ibrani. Susunan ini akurat dan wajar dalam bahasa Indonesia serta menunjukkan bahwa hari tersebut termasuk dalam bulan yang baru disebutkan.
- source_word: יָבְשָׁה
  choice: sudah kering
  rationale: Bentuk perfek Qal orang ketiga feminin tunggal dari יבש menyatakan keadaan yang telah tercapai pada titik waktu ini. “Sudah kering” alami dalam bahasa Indonesia dan mempertahankan nuansa keadaan hasil.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: אֶרֶץ dapat berarti “bumi”, “negeri”, atau “tanah”. Dalam bingkai luas kisah air bah, “bumi” paling sesuai, sementara alternatif leksikalnya tetap dicatat dalam catatan kaki.
