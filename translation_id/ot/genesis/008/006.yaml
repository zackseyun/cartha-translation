  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: id
  text: Setelah empat puluh hari[a], Nuh membuka jendela bahtera yang telah dibuatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Pada akhir empat puluh hari.” Ungkapan Ibrani מִקֵּץ dapat menunjuk pada saat berakhirnya rentang waktu itu atau, secara lebih idiomatis, berarti “setelah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (diungkapkan melalui klausa waktu)
  rationale: Formula naratif ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia modern, fungsinya tersampaikan secara alami melalui pembukaan temporal “Setelah empat puluh hari” tanpa ungkapan kaku “Dan terjadilah”.
- source_word: מִקֵּץ
  choice: setelah
  rationale: Gabungan מִן dan קֵץ menunjuk pada tercapainya akhir suatu rentang waktu. “Setelah” merupakan ungkapan waktu yang alami dalam bahasa Indonesia; kemungkinan yang lebih harfiah, “pada akhir,” dicatat dalam catatan kaki.
- source_word: אַרְבָּעִים יוֹם
  choice: empat puluh hari
  rationale: Padanan langsung dan idiomatis bagi bilangan dengan nomina ini.
- source_word: וַיִּפְתַּח
  choice: membuka
  rationale: Dalam konteks ini, פתח berarti membuka.
- source_word: חַלּוֹן
  choice: jendela
  rationale: Nomina ini lazim menunjuk pada jendela atau bukaan sejenis jendela; “jendela” adalah padanan baku dan paling mungkin dalam konteks bahtera.
- source_word: הַתֵּבָה
  choice: bahtera
  rationale: Dalam kisah Nuh, תֵּבָה secara konvensional dan tepat diterjemahkan “bahtera” dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dibuatnya
  rationale: Klausa relatif ini menerangkan bahtera. “Telah dibuatnya” secara alami menunjukkan bahwa pembuatan itu mendahului tindakan membuka jendela.
