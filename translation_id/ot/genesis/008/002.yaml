  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: id
  text: Mata-mata air samudra raya dan jendela-jendela langit[a] ditutup, dan hujan dari langit pun ditahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pintu-pintu air langit.” Kata Ibrani ini secara harfiah menunjuk pada bukaan atau jendela di langit.
    reason: lexical_alternative
  - marker: b
    text: Atau “hujan dari langit pun berhenti.” Kata kerja Ibrani dapat menekankan bahwa hujan ditahan, dengan akibat hujan itu berhenti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: ditutup
  rationale: Bentuk Nifal menyatakan bahwa mata-mata air dan jendela-jendela itu ditutup; bentuk pasif mempertahankan struktur Ibrani dan cocok bagi kedua subjek.
- source_word: מַעְיְנֹת
  choice: mata-mata air
  rationale: Padanan Indonesia yang alami untuk sumber-sumber air yang memancar; bentuk ulang menandai jamak.
- source_word: תְּהוֹם
  choice: samudra raya
  rationale: Mengacu pada perairan dalam kosmis dalam kisah penciptaan dan air bah; padanan ini mempertahankan nuansa luas dan purba tanpa memakai istilah teknis.
- source_word: אֲרֻבֹּת
  choice: jendela-jendela
  rationale: Mempertahankan gambaran harfiah tentang bukaan-bukaan di langit; 'pintu-pintu air' merupakan penafsiran yang lebih khusus dan dicantumkan sebagai alternatif.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, 'langit' adalah padanan alami bagi bentuk Ibrani ini dalam konteks kosmologis dan cuaca, tanpa perlu memaksakan bentuk jamak.
- source_word: וַיִּכָּלֵא
  choice: ditahan
  rationale: Menjaga nuansa bahwa hujan dihambat atau ditahan sehingga berhenti, bukan hanya menyatakan hasil akhirnya.
- source_word: הַגֶּשֶׁם
  choice: hujan
  rationale: Padanan langsung dan alami dalam bahasa Indonesia modern.
- source_word: מִן הַשָּׁמָיִם
  choice: dari langit
  rationale: Mempertahankan pengulangan kata 'langit' yang terdapat dalam teks Ibrani.
