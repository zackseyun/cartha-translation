base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: id
  text: Tetapi burung merpati itu tidak menemukan tempat beristirahat bagi telapak kakinya[a], maka ia kembali kepada Nuh, ke bahtera, sebab air ada di atas seluruh permukaan bumi. Nuh mengulurkan tangannya, mengambilnya, lalu membawanya kepada dirinya ke dalam bahtera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat untuk menapakkan kakinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצְאָה
  choice: menemukan
  rationale: Bentuk Qal dari מצא lazim berarti 'menemukan' dan cocok secara alami dalam konteks ini.
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: tempat untuk menapakkan kakinya
  rationale: Ungkapan ini menggambarkan tempat beristirahat atau hinggap bagi telapak kaki merpati; terjemahan ini mempertahankan gambaran konkret dengan bahasa Indonesia yang wajar.
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: maka ia kembali kepada Nuh di bahtera
  rationale: שׁוב berarti 'kembali'; nama Nuh dipakai untuk memperjelas rujukan pronomina, sedangkan אֶל־הַתֵּבָה menunjukkan arah kembalinya.
- source_word: כִּי מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: sebab air masih menutupi seluruh permukaan bumi
  rationale: כִּי bersifat kausal. 'Menutupi seluruh permukaan bumi' menyampaikan keadaan air di atas muka seluruh daratan secara alami; 'masih' tersirat oleh kelanjutan keadaan banjir dalam konteks.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: mengulurkan tangannya
  rationale: Idiom Ibrani dengan שׁלח dan 'tangan' secara wajar diterjemahkan 'mengulurkan tangan' dalam bahasa Indonesia.
- source_word: וַיִּקָּחֶהָ
  choice: mengambil burung itu
  rationale: לקח berarti 'mengambil'; penyebutan 'burung itu' menghindari pronomina yang kurang jelas dalam bahasa Indonesia.
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: membawanya masuk ke dalam bahtera bersamanya
  rationale: 'Terjemahan ini mempertahankan kedua unsur arah: burung dibawa kepada Nuh dan masuk ke dalam bahtera, dengan susunan yang alami dalam bahasa Indonesia.'
