revisions:
- from: Namun burung merpati itu tidak menemukan tempat untuk menapakkan kakinya[a], maka ia kembali kepada Nuh di bahtera, sebab air masih menutupi seluruh permukaan bumi. Nuh pun mengulurkan tangannya, mengambil burung itu, lalu membawanya masuk ke dalam bahtera bersamanya.
  to: Tetapi burung merpati itu tidak menemukan tempat beristirahat bagi telapak kakinya[a], maka ia kembali kepada Nuh, ke bahtera, sebab air ada di atas seluruh permukaan bumi. Nuh mengulurkan tangannya, mengambilnya, lalu membawanya kepada dirinya ke dalam bahtera.
  rationale: Revisi menghilangkan tambahan aspek temporal yang tidak eksplisit, membedakan arah kepada Nuh dan ke bahtera, serta mempertahankan unsur “kepada dirinya” dalam klausa terakhir. Pilihan “tempat beristirahat bagi telapak kakinya” menerjemahkan gambaran konkret מָנוֹחַ לְכַף רַגְלָהּ secara dekat dan tetap wajar dalam bahasa Indonesia.
