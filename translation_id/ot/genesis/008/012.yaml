source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: id
  text: Kemudian ia menunggu tujuh hari lagi, lalu melepas burung merpati itu. Burung itu tidak kembali lagi kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Burung itu tidak lagi kembali kepadanya.” Ungkapan negatif Ibrani dengan יָסְפָה + שׁוּב dapat diterjemahkan “tidak kembali lagi” atau “tidak lagi kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: Kemudian ia menunggu
  rationale: Dalam konteks urutan kisah air bah, יחל berarti menunggu; 'kemudian' mencerminkan perkembangan narasi dengan waw konsekutif.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: tujuh hari lagi
  rationale: Ungkapan ini menunjuk pada tambahan masa tujuh hari. Susunan Indonesia ini alami dan tetap menyatakan pengulangan waktu.
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: lalu melepas burung merpati itu
  rationale: שׁלח berarti mengirim atau melepaskan. Dalam konteks Nuh mengeluarkan burung dari bahtera, 'melepas' paling alami tanpa menyiratkan lebih dari tindakan membiarkannya terbang keluar.
- source_word: וְלֹא יָסְפָה שׁוּב
  choice: tidak kembali lagi
  rationale: Konstruksi negatif יסף diikuti שׁוב dapat menyatakan bahwa tindakan kembali tidak terjadi lagi atau tidak berlanjut; terjemahan ini mempertahankan bentuk peristiwa dalam narasi.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Frasa ini menyatakan arah kembali kepada Nuh; rujukan pronominal dipertahankan sebagaimana dalam teks Ibrani.
- source_word: עוֹד
  choice: lagi
  rationale: עוֹד terakhir, bersama konstruksi negatif יסף + שׁוב, secara idiomatis dapat diterjemahkan 'lagi' atau 'tidak lagi'.
