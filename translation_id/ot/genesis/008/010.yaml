  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama 'Nuh' dinyatakan untuk memperjelas subjek tersirat bahasa Ibrani tanpa mengubah rujukannya; 'lalu' menjaga urutan tindakan dalam narasi.
