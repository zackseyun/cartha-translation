  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: id
  text: Kemudian Nuh menunggu tujuh hari lagi[a], lalu sekali lagi mengirimkan burung merpati itu keluar dari bahtera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemudian ia mulai menunggu tujuh hari lagi.” Kata kerja Ibrani ini secara lebih harfiah dapat berarti “mulai”, tetapi dalam konteks ini berfungsi secara idiomatis dengan arti “menunggu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: menunggu
  rationale: Dalam konteks ungkapan waktu, verba ini secara idiomatis menyatakan bahwa Nuh menanti sebelum bertindak lagi; 'menunggu' lebih alami daripada terjemahan harfiah 'memulai'.
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: tujuh hari lagi
  rationale: עוֹד dan אֲחֵרִים sama-sama menandai tambahan waktu. 'Tujuh hari lagi' menyampaikan makna itu dengan ringkas dan wajar dalam bahasa Indonesia.
- source_word: וַיֹּסֶף שַׁלַּח
  choice: sekali lagi melepaskan
  rationale: Konstruksi וַיֹּסֶף dengan verba berikutnya berarti melakukan tindakan itu lagi. Dalam konteks burung yang dikeluarkan untuk terbang, 'melepaskan' alami dan tetap menyatakan tindakan mengirimnya keluar.
- source_word: הַיּוֹנָה
  choice: burung merpati itu
  rationale: Bentuk definit menunjuk kepada burung merpati yang sudah disebutkan sebelumnya; kata 'itu' mempertahankan sifat definit tersebut.
- source_word: מִן הַתֵּבָה
  choice: dari bahtera
  rationale: Dalam kisah Nuh, תֵּבָה secara mapan dan tepat diterjemahkan 'bahtera'; preposisi מִן menyatakan asal gerakan, yaitu 'dari' bahtera.
