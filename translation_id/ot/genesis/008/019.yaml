  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: id
  text: Setiap binatang, setiap hewan melata, dan setiap burung—segala yang bergerak di atas bumi—keluar dari bahtera menurut keluarga-keluarga mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menurut kelompok-kelompok keluarganya." Ungkapan Ibrani ini mempertahankan gagasan tentang kelompok-kelompok berdasarkan hubungan keturunan atau pembagian di antara binatang-binatang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: Setiap binatang
  rationale: חַיָּה dalam daftar ini menunjuk pada kategori binatang darat yang dibedakan dari hewan melata dan burung. “Binatang” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi hanya binatang liar atau peliharaan.
- source_word: כָּל הָרֶמֶשׂ
  choice: setiap hewan melata
  rationale: רֶמֶשׂ menunjuk pada makhluk kecil yang bergerak dekat permukaan tanah. “Hewan melata” mempertahankan kategori dalam tata nama Kejadian dengan bahasa yang tetap mudah dipahami.
- source_word: וְכָל הָעוֹף
  choice: dan setiap burung
  rationale: עוֹף dapat mencakup makhluk terbang secara luas, tetapi dalam rangkaian ini “burung” merupakan padanan Indonesia yang paling wajar.
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: segala yang bergerak di atas bumi
  rationale: Partisipel רוֹמֵשׂ berasal dari bidang makna yang sama dengan רֶמֶשׂ. “Bergerak” menghindari pengulangan kaku dengan “hewan melata” sambil mempertahankan cakupan luas gerak makhluk darat; “di atas bumi” mengikuti ungkapan Ibrani.
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: menurut kelompok keluarganya masing-masing
  rationale: מִשְׁפָּחָה pada dasarnya berarti “keluarga/kaum.” Dalam konteks binatang, frasa ini menggambarkan keluarnya mereka dalam kelompok-kelompok yang berhubungan, tanpa menggantinya secara interpretatif dengan “jenis.” Kata “masing-masing” menyampaikan akhiran jamak Ibrani secara alami.
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: keluar dari bahtera
  rationale: יָצְאוּ adalah verba sederhana “keluar,” sedangkan תֵּבָה secara lazim diterjemahkan “bahtera” dalam kisah Nuh.
