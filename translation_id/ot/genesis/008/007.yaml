  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur Ibrani yang berulang dipertahankan secukupnya tanpa memakai ungkapan kaku; kata “terbang” dihindari karena tidak disebutkan secara eksplisit dalam sumber.
