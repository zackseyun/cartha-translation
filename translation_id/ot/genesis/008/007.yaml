  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: id
  text: Lalu ia melepaskan burung gagak itu, dan burung itu keluar, berulang kali pergi dan kembali,[a] sampai air itu mengering dari permukaan bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “keluar, pergi dan kembali.” Ungkapan Ibrani ini menunjukkan gerakan yang berlangsung berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Lalu ia melepaskan
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Lalu” menyatakan kesinambungan naratif, sedangkan “melepaskan” secara wajar menggambarkan tindakan mengirim burung itu keluar.
- source_word: הָעֹרֵב
  choice: burung gagak itu
  rationale: Kata benda ini memakai artikel tertentu. “Burung gagak” adalah padanan zoologis yang lazim dan jelas dalam bahasa Indonesia.
- source_word: וַיֵּצֵא
  choice: burung itu keluar
  rationale: Kata kerja יָצָא berarti keluar atau pergi ke luar. Terjemahan ini tidak menambahkan cara bergerak seperti “terbang,” yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: יָצוֹא וָשׁוֹב
  choice: berulang kali pergi dan kembali
  rationale: Rangkaian infinitif absolut ini menyatakan gerakan yang berulang atau terus-menerus. Pilihan ini mempertahankan kedua unsur sumber—pergi dan kembali—serta menjelaskan sifat iteratifnya secara alami.
- source_word: עַד
  choice: sampai
  rationale: Penanda waktu ini memperkenalkan batas akhir gerakan burung gagak yang berlangsung berulang kali.
- source_word: יְבֹשֶׁת הַמַּיִם
  choice: air ... mengering
  rationale: Infinitif konstruk dari יבשׁ setelah עַד menyatakan keadaan yang menjadi titik akhir. Dalam bahasa Indonesia, bentuk kolektif “air” lebih alami daripada bentuk jamak harfiah.
- source_word: מֵעַל הָאָרֶץ
  choice: di atas bumi
  rationale: Ungkapan ini mempertahankan gambaran spasial air yang berada di atas bumi. Hubungan pemisahan yang tersirat dalam מִן dipahami dari verba “mengering” tanpa menghasilkan susunan Indonesia yang kaku.
