base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: id
  text: Air itu terus-menerus surut dari atas bumi[a], dan pada akhir seratus lima puluh hari air itu berkurang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pergi dan kembali,” suatu ungkapan Ibrani yang di sini menyatakan bahwa air terus atau makin surut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: surut
  rationale: Dalam konteks air bah, שׁוב berarti air bergerak kembali atau mundur; 'surut' menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: מֵעַל הָאָרֶץ
  choice: dari atas bumi
  rationale: Ungkapan ini mempertahankan gambaran ruang bahwa air menutupi permukaan bumi lalu mundur darinya.
- source_word: הָלוֹךְ וָשׁוֹב
  choice: terus
  rationale: Rangkaian infinitif ini menyatakan tindakan yang berlangsung secara berkelanjutan atau progresif. 'Terus surut' menghindari kesan gerakan bolak-balik yang dapat ditimbulkan terjemahan harfiah.
- source_word: וַיַּחְסְרוּ
  choice: telah berkurang
  rationale: חסר menunjukkan bahwa jumlah atau ketinggian air menjadi lebih sedikit; 'berkurang' membedakannya dari tindakan 'surut' pada klausa pertama.
- source_word: מִקְצֵה
  choice: setelah
  rationale: Dalam keterangan waktu, מִקְצֵה dapat berarti pada berakhirnya atau sesudah genap suatu jangka waktu. 'Setelah' alami dan tetap menyatakan selesainya 150 hari.
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: seratus lima puluh hari
  rationale: Ini adalah padanan langsung dan baku untuk bilangan Ibrani tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Struktur dibagi menjadi dua kalimat agar hubungan temporal jelas tanpa menghilangkan dua verba Ibrani yang berbeda, yaitu 'surut' dan 'berkurang'.
