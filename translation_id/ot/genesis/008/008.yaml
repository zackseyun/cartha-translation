translation:
  language: id
  text: Lalu ia melepaskan seekor merpati yang ada bersamanya untuk melihat apakah air telah surut dari permukaan tanah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: Kemudian ia melepaskan
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Dalam konteks burung yang dikeluarkan dari bahtera, 'melepaskan' lebih alami daripada 'mengutus' dan tetap menyampaikan tindakan membiarkannya terbang keluar.
- source_word: הַיּוֹנָה
  choice: seekor merpati
  rationale: יוֹנָה dapat menunjuk pada merpati atau dara. 'Merpati' merupakan istilah umum dan wajar dalam bahasa Indonesia modern; penanda 'seekor' diperlukan secara idiomatis karena nomina Ibrani ini definit.
- source_word: מֵאִתּוֹ
  choice: dari sisinya
  rationale: Ungkapan ini menunjukkan gerak menjauh dari orang atau keberadaan Nuh. 'Dari sisinya' mempertahankan unsur sumber yang sering dihilangkan, tanpa menggantinya secara tafsiran dengan 'dari bahtera'.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan. Terjemahan langsung 'untuk melihat' alami dalam bahasa Indonesia dan tidak memperluas maknanya menjadi 'untuk mengetahui'.
- source_word: הֲקַלּוּ
  choice: apakah ... sudah surut
  rationale: Dalam konteks air bah, קלל berarti berkurang atau mereda. 'Sudah surut' adalah ungkapan Indonesia yang alami bagi air yang berkurang.
- source_word: הַמַּיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, bahasa Indonesia lazim memakai nomina massa tunggal 'air' dalam konteks ini.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari permukaan tanah
  rationale: Ungkapan harfiahnya menggambarkan air berkurang dari atas muka tanah. 'Permukaan tanah' mempertahankan gambaran ruang itu dengan bahasa Indonesia modern yang jelas.
