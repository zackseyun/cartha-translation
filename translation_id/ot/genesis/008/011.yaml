base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: id
  text: Pada waktu petang, burung merpati itu datang kepadanya[a]. Tampaklah sehelai daun zaitun yang baru dipetik di paruhnya[b]. Maka Nuh tahu bahwa air telah surut dari atas bumi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali kepadanya”. Verba Ibrani itu sendiri berarti “datang”, sedangkan konteks menyiratkan bahwa burung itu kembali.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “baru dipetik” menerjemahkan kata Ibrani yang berarti dicabik atau dipetik lepas, sehingga menyiratkan bahwa daun itu baru diambil dari pohon zaitun yang hidup.
    reason: lexical_alternative
  - marker: c
    text: Atau “air telah berkurang dari atas bumi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: datang
  rationale: Bentuk Qal dari בוא pada dasarnya berarti ‘datang’; konteks menyiratkan bahwa merpati itu kembali, tetapi nuansa tersebut tidak dinyatakan secara eksplisit oleh verba ini.
- source_word: לְעֵת עֶרֶב
  choice: pada waktu petang
  rationale: Ungkapan ini menunjuk waktu kedatangan merpati dan diterjemahkan dekat dengan bentuk Ibraninya dalam bahasa Indonesia yang wajar.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Kata הִנֵּה menarik perhatian kepada pemandangan yang mengejutkan; ‘tampaklah’ mempertahankan daya hidup narasi tanpa memakai bentuk arkais ‘lihatlah’.
- source_word: עֲלֵה זַיִת
  choice: sehelai daun zaitun
  rationale: Secara harfiah berarti ‘daun zaitun’; ‘sehelai’ merupakan penggolong alami untuk daun dalam bahasa Indonesia.
- source_word: טָרָף
  choice: yang baru dipetik
  rationale: Kata ini menggambarkan sesuatu yang dicabik atau dipetik lepas. Dalam konteks ini, pilihan tersebut menyampaikan bahwa daun itu baru diambil dari pohon yang hidup.
- source_word: בְּפִיהָ
  choice: di paruhnya
  rationale: Teks Ibrani secara harfiah menyebut ‘mulutnya’, tetapi ‘paruh’ adalah padanan anatomis yang alami bagi burung dalam bahasa Indonesia dan tidak mengubah gambaran adegan.
- source_word: וַיֵּדַע
  choice: Maka Nuh tahu
  rationale: ‘Maka’ menyampaikan perkembangan narasi sekaligus kesimpulan yang ditarik Nuh dari daun tersebut.
- source_word: קַלּוּ הַמַּיִם
  choice: air telah surut
  rationale: Verba קלל di sini berarti air telah berkurang atau mereda; ‘surut’ adalah ungkapan Indonesia yang alami untuk air bah.
- source_word: מֵעַל הָאָרֶץ
  choice: dari atas bumi
  rationale: Pilihan ini mempertahankan unsur spasial מֵעַל, yakni air berkurang dari atas bumi, tanpa mempersempit ‘bumi’ menjadi ‘tanah’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif luhur. Susunan kalimat mengikuti gerak teks Ibrani, sementara ‘paruh’ dan ‘surut’ dipilih agar alami bagi pembaca umum. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskannya.
