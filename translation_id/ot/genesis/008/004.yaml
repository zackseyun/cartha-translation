  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: id
  text: Pada bulan ketujuh, pada hari ketujuh belas bulan itu, bahtera itu berhenti di atas pegunungan Ararat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk jamak, “pegunungan Ararat”; yang dimaksud adalah kawasan bergunung-gunung di Ararat, bukan secara khusus satu puncak yang kini disebut Gunung Ararat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּנַח
  choice: berhenti
  rationale: Bentuk wayyiqtol dari נוח menggambarkan bahtera yang sampai pada keadaan diam atau tempat perhentian. “Berhenti” alami dalam bahasa Indonesia dan tidak menambahkan gagasan berlabuh atau terdampar.
- source_word: הַתֵּבָה
  choice: bahtera itu
  rationale: “Bahtera” adalah padanan baku dan tepat dalam konteks kisah Nuh; penentu pada bahasa Ibrani dinyatakan dengan “itu”.
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: pada bulan ketujuh
  rationale: Ungkapan waktu ini secara idiomatis dinyatakan dengan “pada” dalam bahasa Indonesia.
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: pada hari ketujuh belas bulan itu
  rationale: Padanan yang jelas dan wajar untuk rumus penanggalan Ibrani, dengan “bulan itu” merujuk kembali kepada bulan ketujuh.
- source_word: עַל
  choice: di atas
  rationale: Mempertahankan makna lokatif dasar bahwa bahtera berhenti pada atau di atas kawasan pegunungan tersebut.
- source_word: הָרֵי אֲרָרָט
  choice: pegunungan Ararat
  rationale: הָרֵי berbentuk jamak konstruktus, sehingga “pegunungan Ararat” lebih tepat daripada bentuk tunggal “Gunung Ararat” dan tetap memungkinkan rujukan kepada kawasan bergunung-gunung.
theological_decisions:
- issue: Ungkapan geografis הָרֵי אֲרָרָט
  choice: pegunungan Ararat
  alternative: Gunung Ararat
  rationale: Teks Ibrani memakai bentuk jamak “gunung-gunung/pegunungan”, sehingga terjemahan tidak mempersempit rujukannya menjadi satu puncak tertentu. Ini mempertahankan keluasan geografis teks tanpa menambahkan identifikasi tradisional yang lebih spesifik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan tanggal yang alami dan nada naratif yang lugas serta bermartabat. Istilah tradisional “bahtera” dipertahankan karena jelas bagi pembaca umum, sedangkan bentuk jamak geografis dalam sumber dijaga.
