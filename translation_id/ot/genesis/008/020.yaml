  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: id
  text: Lalu Nuh membangun sebuah mezbah bagi Yahweh. Ia mengambil beberapa ekor dari setiap jenis hewan yang tahir dan dari setiap jenis burung yang tahir, lalu mempersembahkan kurban bakaran di atas mezbah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Padanan langsung dan alami untuk בנה dalam narasi.
- source_word: מִזְבֵּחַ
  choice: mezbah
  rationale: Istilah baku Alkitab bahasa Indonesia untuk tempat mempersembahkan kurban.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai penerima atau peruntukan mezbah, sedangkan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה וּמִכֹּל הָעוֹף הַטָּהֹר
  choice: beberapa ekor dari setiap jenis hewan yang tahir dan dari setiap jenis burung yang tahir
  rationale: מִכֹּל bersifat partitif dalam konteks ini. 'Beberapa ekor' mencegah kesan bahwa seluruh hewan dikurbankan, sedangkan 'setiap jenis' menyampaikan kategori yang terwakili secara alami dalam bahasa Indonesia.
- source_word: הַטְּהוֹרָה / הַטָּהֹר
  choice: yang tahir
  rationale: '''Tahir'' mempertahankan nuansa kelayakan ritual tanpa menambahkan penjelasan ke dalam teks utama.'
- source_word: וַיַּעַל עֹלֹת
  choice: mempersembahkan kurban bakaran
  rationale: Hifil עלה bersama עֹלֹת merupakan ungkapan kurban yang berarti mempersembahkan kurban bakaran.
- source_word: בַּמִּזְבֵּחַ
  choice: di atas mezbah itu
  rationale: Menyampaikan makna lokatif secara alami; 'itu' merujuk kembali kepada mezbah yang baru dibangun.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה; 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan hewan dan burung yang diambil untuk kurban
  choice: beberapa ekor dari setiap jenis
  alternative: dari setiap hewan dan dari setiap burung
  rationale: Bahasa Ibrani secara harfiah memakai konstruksi partitif 'dari setiap'. Konteks menunjukkan pemilihan sejumlah hewan dari kategori yang tahir, bukan pengurbanan setiap individu; rumusan ini membuat implikasi itu jelas tanpa mengubah pokok makna.
- issue: Makna 'tahir'
  choice: mempertahankan istilah 'tahir' tanpa menjelaskan sistem ritualnya
  alternative: bersih secara ritual
  rationale: Istilah טהור memiliki dimensi ritual, tetapi teks tidak menguraikannya di sini. Mempertahankan 'tahir' menghindari penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur naratif dibuat lancar dengan dua kalimat agar tidak terlalu bertumpuk. Istilah 'mezbah', 'tahir', dan 'kurban bakaran' dipertahankan sebagai kosakata Alkitab yang umum dipahami. Tidak ada catatan kaki karena semua penanda catatan kaki wajib muncul dalam teks utama dan ayat ini dapat diterjemahkan secara memadai tanpa catatan.
