base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: id
  text: Selama bumi masih ada[a], waktu menabur dan waktu menuai, dingin dan panas, musim panas dan musim dingin, serta siang dan malam tidak akan berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepanjang segala hari bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: Selama bumi masih ada
  rationale: Ungkapan ini secara harfiah berarti “sepanjang segala hari bumi” dan menyatakan jangka waktu keberadaan bumi. Pilihan ini alami dalam bahasa Indonesia serta mempertahankan batas waktu yang terdapat dalam teks Ibrani.
- source_word: זֶרַע וְקָצִיר
  choice: waktu menabur dan waktu menuai
  rationale: Dalam pasangan ini, זֶרַע menunjuk pada kegiatan atau masa penaburan, bukan sekadar benih sebagai benda; קָצִיר adalah kegiatan atau masa menuai.
- source_word: קֹר וָחֹם
  choice: dingin dan panas
  rationale: Kedua nomina ini membentuk pasangan berlawanan yang menggambarkan kesinambungan keadaan iklim.
- source_word: קַיִץ וָחֹרֶף
  choice: musim panas dan musim dingin
  rationale: Ini adalah padanan langsung dan lazim bagi kedua istilah musim tersebut. Catatan kaki menerangkan nuansa iklim Levant yang juga dapat dipahami sebagai musim kemarau dan musim hujan.
- source_word: יוֹם וָלַיְלָה
  choice: siang dan malam
  rationale: Pasangan tetap ini menggambarkan siklus waktu yang terus berlangsung.
- source_word: לֹא יִשְׁבֹּתוּ
  choice: tidak akan berhenti
  rationale: Kata kerja שׁבת di sini berarti berhenti atau terhenti; bentuk jamaknya merujuk pada seluruh rangkaian siklus yang disebutkan.
theological_decisions:
- issue: Cakupan dan lamanya janji mengenai keteraturan siklus ciptaan
  choice: Pernyataan dibatasi pada masa selama bumi masih ada.
  alternative: Siklus-siklus tersebut dijanjikan berlangsung secara mutlak untuk selama-lamanya.
  rationale: Frasa כָּל יְמֵי הָאָרֶץ secara alami membatasi janji itu pada seluruh masa keberadaan bumi, tanpa menentukan bahwa tatanan sekarang bersifat kekal secara metafisis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan berirama yang mempertahankan rangkaian pasangan dalam teks Ibrani. “Waktu menabur dan waktu menuai” dipilih agar mudah dipahami tanpa kehilangan gambaran pertanian, sedangkan “musim panas dan musim dingin” mempertahankan istilah sumber dan diberi penjelasan kontekstual.
