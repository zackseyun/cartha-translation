  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: id
  text: TUHAN mencium aroma yang menyenangkan itu, lalu TUHAN berkata dalam hati-Nya, “Aku tidak akan lagi mengutuk tanah karena manusia, sebab kecenderungan hati manusia itu jahat sejak masa mudanya. Aku juga tidak akan lagi membinasakan segala yang hidup seperti yang telah Kulakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: aroma yang menyenangkan
  rationale: Mengungkapkan aroma korban yang diterima dengan senang tanpa memakai istilah teknis yang kurang alami dalam bahasa Indonesia modern.
- source_word: אֶל־לִבּוֹ
  choice: dalam hati-Nya
  rationale: Mempertahankan gambaran antropomorfis dan idiom batiniah teks Ibrani, alih-alih hanya memparafrasakannya sebagai 'kepada diri-Nya sendiri'.
- source_word: יֵצֶר לֵב הָאָדָם
  choice: kecenderungan hati manusia
  rationale: יֵצֶר menunjuk pada bentukan, dorongan, atau kecenderungan batin; 'kecenderungan' alami sekaligus mempertahankan keluasan maknanya.
- source_word: מִנְּעֻרָיו
  choice: sejak masa mudanya
  rationale: Terjemahan langsung yang tidak mempersempit frasa menjadi klaim tentang saat kelahiran atau usia tertentu.
- source_word: לְהַכּוֹת
  choice: membinasakan
  rationale: Dalam konteks air bah, verba 'memukul' bermakna menimpakan pukulan yang mematikan; 'membinasakan' menyampaikan akibat kontekstual secara wajar.
theological_decisions:
- issue: Hubungan alasan 'karena manusia' dengan janji untuk tidak lagi mengutuk tanah
  choice: Mempertahankan 'karena manusia' tanpa menjelaskan apakah itu menunjuk pada kesalahan manusia atau demi manusia.
  alternative: Menerjemahkan 'oleh karena manusia' atau 'demi manusia'.
  rationale: 'בַּעֲבוּר dapat bernuansa kausal dan konteksnya mengandung ketegangan: kejahatan manusia disebut sebagai alasan sesudah sebelumnya menjadi dasar penghukuman. Terjemahan dipertahankan cukup terbuka.'
- issue: Kejahatan kecenderungan hati manusia sejak masa muda
  choice: Menerjemahkan secara lugas tanpa menambahkan rumusan doktrinal.
  alternative: Menafsirkan sebagai 'sejak lahir' atau mengaitkannya secara eksplisit dengan suatu doktrin dosa tertentu.
  rationale: Teks menyatakan מִנְּעֻרָיו, 'sejak masa mudanya', dan tidak merumuskan penjelasan sistematis lebih lanjut.
- issue: Bahasa antropomorfis tentang TUHAN mencium dan berkata dalam hati
  choice: Mempertahankan kedua gambaran tersebut.
  alternative: Mengabstraksikannya menjadi 'TUHAN menerima korban itu' dan 'TUHAN memutuskan'.
  rationale: Bentuk konkret teks sumber penting bagi narasi dan tidak perlu dihilangkan demi harmonisasi teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi luas Alkitab bahasa Indonesia. Struktur dua janji ilahi dipertahankan, dengan 'juga' menandai koordinasi klausa kedua secara alami.
