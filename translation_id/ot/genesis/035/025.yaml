  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: id
  text: Putra-putra Bilha[a], hamba perempuan Rahel, adalah Dan dan Naftali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelayan perempuan Rahel.” Istilah Ibrani ini menunjuk kepada seorang hamba perempuan yang berkedudukan sosial lebih rendah; dalam konteks tertentu istilah tersebut dapat berarti budak perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak lelaki
  rationale: Bentuk jamak konstruksi בְנֵי dalam daftar keturunan ini secara khusus menunjuk kepada para putra; prefiks וּ melanjutkan struktur daftar dan tidak perlu diterjemahkan tersendiri agar bahasa Indonesia tetap alami.
- source_word: בִלְהָה
  choice: Bilha
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שִׁפְחַת
  choice: hamba perempuan
  rationale: Istilah שִׁפְחָה menunjuk kepada seorang pelayan perempuan yang berkedudukan sosial rendah dan dalam konteks tertentu dapat berarti budak perempuan; pilihan ini mempertahankan penandaan gender tanpa memakai ungkapan yang kuno.
- source_word: רָחֵל
  choice: Rahel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia; hubungan konstruksi dinyatakan secara alami dengan urutan 'hamba perempuan Rahel'.
- source_word: דָּן
  choice: Dan
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim.
- source_word: וְ/נַפְתָּלִי
  choice: dan Naftali
  rationale: Konjungsi Ibrani dipertahankan sebagai 'dan' untuk menghubungkan dua nama dalam daftar.
