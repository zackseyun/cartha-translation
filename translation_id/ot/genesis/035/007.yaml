base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: id
  text: Di sana ia membangun sebuah mezbah dan menamai tempat itu El-Betel[a], sebab di sanalah Allah telah menyatakan diri-Nya kepadanya ketika ia melarikan diri dari saudara laki-lakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: El-Betel kemungkinan berarti “Allah di Betel.”
    reason: Menjelaskan kemungkinan arti nama Ibrani tanpa mengganti bentuk nama dalam teks utama.
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Di sana ia membangun sebuah mazbah
  rationale: Menerjemahkan bentuk naratif secara langsung. 'Mazbah' adalah istilah baku dan bermartabat untuk tempat persembahan kurban.
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: menamai tempat itu
  rationale: Dalam konteks pemberian nama, 'menamai' lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'menyebut tempat itu'.
- source_word: אֵל בֵּית אֵל
  choice: El-Betel
  rationale: Dipertahankan sebagai nama tempat karena frasa tersebut merupakan nama yang diberikan Yakub; makna unsur namanya dijelaskan dalam catatan kaki.
- source_word: כִּי שָׁם
  choice: karena di sanalah
  rationale: '''Karena'' menyatakan alasan pemberian nama, sedangkan partikel ''-lah'' secara alami menegaskan pengulangan keterangan tempat.'
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: Allah menyatakan diri kepadanya
  rationale: Nifal גלה dalam konteks penampakan ilahi menyampaikan gagasan penyataan diri. Meskipun bentuk verba dan אֱלֹהִים secara morfologis jamak, konteksnya merujuk kepada Allah yang esa.
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: ketika ia melarikan diri dari kakaknya
  rationale: Infinitif dengan בְ menyatakan waktu. 'Kakaknya' tepat karena Esau adalah saudara laki-laki yang lebih tua, dan 'melarikan diri dari' mengungkapkan idiom מִפְּנֵי secara alami.
theological_decisions:
- issue: Bentuk jamak אֱלֹהִים dan נִגְלוּ yang dalam konteks merujuk kepada Allah Israel
  choice: Allah menyatakan diri kepadanya
  alternative: allah-allah menampakkan diri kepadanya; Allah menampakkan diri kepadanya
  rationale: Konteks kisah Betel jelas menunjuk kepada Allah yang ditemui Yakub, sehingga bentuk tunggal dalam bahasa Indonesia menghindari kesan politeistis. 'Menyatakan diri' mempertahankan nuansa penyingkapan diri tanpa memberi penjelasan teologis tambahan.
- issue: Apakah אֵל בֵּית אֵל diterjemahkan atau ditransliterasikan
  choice: El-Betel dalam teks utama
  alternative: Allah Betel; Allah dari Betel
  rationale: Frasa ini berfungsi sebagai nama yang diberikan kepada tempat tersebut. Transliterasi mempertahankan tindakan penamaan, sementara kemungkinan maknanya disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan kalimat mengikuti alur narasi Ibrani, pengulangan 'di sana' dipertahankan dengan penegasan alami 'di sanalah', dan nama tempat ditransliterasikan menurut bentuk Indonesia 'Betel'.
