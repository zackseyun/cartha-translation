base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/023.yaml
  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: id
  text: Anak-anak lelaki Lea ialah Ruben, anak sulung Yakub, Simeon, Lewi, Yehuda, Isakhar, dan Zebulon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: Anak-anak lelaki Lea
  rationale: Bentuk jamak konstruktus ini memperkenalkan enam keturunan laki-laki Lea; frasa ini tepat dan alami dalam bahasa Indonesia.
- source_word: בְּכֹר יַעֲקֹב רְאוּבֵן
  choice: Ruben, anak sulung Yakub
  rationale: Susunan ini menyampaikan bahwa Ruben secara khusus adalah anak sulung Yakub, sambil menghasilkan aposisi yang jelas dan alami dalam bahasa Indonesia.
- source_word: וְ
  choice: lalu ... dan
  rationale: Konjungsi Ibrani yang berulang menghubungkan daftar nama. Bahasa Indonesia yang alami tidak perlu mengulang 'dan' di depan setiap nama; 'lalu' menandai kelanjutan daftar dan 'dan' menandai unsur terakhir.
- source_word: רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וּזְבוּלֻן
  choice: Ruben ... Simeon, Lewi, Yehuda, Isakhar, dan Zebulon
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, sederhana, dan bermartabat. Susunan aposisional memperjelas bahwa keterangan 'anak sulung Yakub' hanya menerangkan Ruben, bukan seluruh daftar.
