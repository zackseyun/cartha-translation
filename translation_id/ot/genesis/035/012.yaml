base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: id
  text: Dan tanah yang telah Kuberikan kepada Abraham dan Ishak[a] akan Kuberikan kepadamu; dan kepada keturunanmu[b] sesudah engkau akan Kuberikan tanah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang Kuberikan kepada Abraham dan Ishak.”
    reason: lexical_alternative
  - marker: b
    text: Kata “keturunan” menerjemahkan kata benda tunggal kolektif yang juga dapat diterjemahkan “benih” atau “anak cucu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: tanah itu
  rationale: Dalam konteks janji kepada para leluhur, אֶרֶץ menunjuk pada tanah tertentu yang dijanjikan. Bentuk 'tanah itu' alami dalam bahasa Indonesia dan mempertahankan kekhususannya.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif 'yang' merupakan padanan Indonesia yang alami dan tepat.
- source_word: נָתַתִּי
  choice: telah Kuberikan
  rationale: Bentuk qatal menunjuk pada tindakan pemberian yang mendahului firman kepada Yakub. 'Telah Kuberikan' mempertahankan aspek lampau sekaligus relevansi janji tersebut tanpa menyamakannya dengan verba-verba mendatang.
- source_word: לְאַבְרָהָם וּלְיִצְחָק
  choice: kepada Abraham dan Ishak
  rationale: Pengulangan preposisi Ibrani tidak perlu disalin secara mekanis karena satu 'kepada' secara alami mencakup kedua nama dalam bahasa Indonesia.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: akan Kuberikan kepadamu
  rationale: Akhiran objek feminin pada verba merujuk kembali kepada tanah. Susunan ini alami dan tetap menyatakan penerima janji secara pribadi.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע berbentuk tunggal kolektif. 'Keturunanmu' adalah padanan Indonesia modern yang dapat menunjuk secara kolektif tanpa memaksakan jumlah tertentu.
- source_word: אַחֲרֶיךָ
  choice: sesudah engkau
  rationale: Ungkapan ini mempertahankan makna temporal dan kesinambungan generasi; 'engkau' sesuai dengan ragam firman ilahi yang bermartabat.
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: akan Kuberikan tanah itu
  rationale: Pengulangan 'memberikan' dan 'tanah' dipertahankan sebagaimana dalam bahasa Ibrani, karena menegaskan kembali janji bagi keturunan Yakub.
theological_decisions:
- issue: Hubungan antara pemberian lampau dan pemberian mendatang dalam janji tanah kepada para leluhur
  choice: Menerjemahkan נָתַתִּי dengan bentuk lampau 'telah Kuberikan' dan kedua verba berikutnya dengan bentuk mendatang 'akan Kuberikan'.
  alternative: Menerjemahkan נָתַתִּי sebagai 'Kuberikan' tanpa penanda waktu eksplisit, atau memahami keseluruhannya terutama sebagai janji yang belum terwujud.
  rationale: Bahasa Ibrani menyandingkan tindakan pemberian terdahulu kepada Abraham dan Ishak dengan pemberian mendatang kepada Yakub dan keturunannya. Perbedaan waktu ini dipertahankan agar ketegangan antara janji yang sudah diberikan dan penggenapannya kelak tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat dengan huruf kapital dalam 'Kuberikan' serta pronomina 'engkau' dipakai untuk sapaan ilahi kepada Yakub. Struktur pengulangan sumber dipertahankan tanpa membuat kalimat terasa kaku.
