base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: id
  text: Mari kita bangkit dan naik ke Betel. Di sana aku akan membuat mezbah bagi Allah yang menjawab aku[a] pada masa kesesakanku dan yang telah menyertai aku di jalan yang kutempuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani juga dapat dipahami secara khusus sebagai “yang telah menjawab aku” atau secara lebih umum sebagai gambaran tentang Allah yang menjawab aku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָקוּמָה
  choice: Mari kita bangkit
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan. “Mari kita bangkit” mempertahankan daya volisional dan gambaran tindakan dari teks Ibrani.
- source_word: וְנַעֲלֶה
  choice: dan pergi ke
  rationale: עלה secara harfiah dapat berarti “naik,” tetapi juga lazim dipakai untuk perjalanan menuju suatu tempat. Dalam bahasa Indonesia modern, “pergi ke Betel” terdengar alami; unsur geraknya tetap jelas setelah “bangkit.”
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan sebagai “rumah Allah.”
- source_word: וְאֶעֱשֶׂה שָּׁם מִזְבֵּחַ
  choice: Di sana aku akan membuat mezbah
  rationale: עשה berarti “membuat/melakukan.” “Membuat mezbah” dekat dengan bentuk sumber dan tetap dapat dipahami secara alami.
- source_word: לָאֵל
  choice: bagi Allah
  rationale: Preposisi ל menandai peruntukan atau pengabdian mezbah. “Bagi Allah” mengungkapkan fungsi itu dengan wajar dalam bahasa Indonesia.
- source_word: הָעֹנֶה אֹתִי
  choice: yang menjawab aku
  rationale: Partisipel Ibrani dapat menunjuk pada jawaban Allah dalam peristiwa lampau maupun menggambarkan-Nya sebagai Pribadi yang menjawab. Bentuk Indonesia ini mempertahankan sebagian keluwesan temporal tersebut.
- source_word: בְּיוֹם צָרָתִי
  choice: pada masa kesesakanku
  rationale: Ungkapan Ibrani harfiah “pada hari kesesakanku” memakai “hari” untuk masa atau keadaan tertentu. “Pada masa kesesakanku” menyampaikan idiom itu secara alami tanpa mengurangi bobot penderitaannya.
- source_word: וַיְהִי עִמָּדִי
  choice: dan yang menyertai aku
  rationale: Secara harfiah frasa ini berarti “dan Ia ada bersamaku.” “Menyertai aku” merupakan padanan Indonesia yang alami bagi kehadiran Allah bersama Yakub dalam perjalanannya.
- source_word: בַּדֶּרֶךְ אֲשֶׁר הָלָכְתִּי
  choice: di jalan yang kutempuh
  rationale: Pilihan ini mempertahankan gambaran konkret דרך (“jalan”) dan gerak הלך (“pergi/berjalan”) dengan susunan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Rujukan אֵל dalam perkataan Yakub
  choice: Allah yang menjawab aku
  alternative: Allah, yang menjawab aku
  rationale: Artikel dan klausa partisipial mengidentifikasi Allah melalui tindakan-Nya terhadap Yakub. Susunan tanpa koma menjaga klausa itu sebagai penjelas identitas tanpa memasukkan rumusan teologis tambahan.
- issue: Daya temporal partisipel הָעֹנֶה
  choice: yang menjawab aku
  alternative: yang telah menjawab aku; yang selalu menjawab aku
  rationale: Konteks mengingat tindakan Allah pada masa lampau, tetapi bentuk partisipel juga dapat menggambarkan tindakan yang khas atau berkelanjutan. Teks utama dan catatan kaki mempertahankan ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat mudah dibaca, sementara istilah “mezbah,” nama “Betel,” dan gambaran “jalan” dipertahankan karena penting bagi latar dan citra teks.
