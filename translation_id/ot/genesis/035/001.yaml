source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: id
  text: Kemudian Allah berfirman kepada Yakub, “Bangunlah, naiklah ke Betel dan tinggallah di sana. Buatlah di sana sebuah mazbah bagi Allah yang menampakkan diri kepadamu ketika engkau melarikan diri dari hadapan Esau, saudaramu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Waw konsekutif melanjutkan alur cerita; “kemudian” menyampaikan urutan secara alami. Karena subjeknya Allah, “berfirman” sesuai dengan ragam Alkitab Indonesia yang wajar dan bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan Allah yang esa.
- source_word: קוּם
  choice: Bersiaplah
  rationale: Imperatif ini secara harfiah berarti “bangkitlah/berdirilah,” tetapi dalam rangkaian perintah perjalanan berfungsi sebagai dorongan untuk mulai bertindak. “Bersiaplah” alami dalam bahasa Indonesia tanpa menghilangkan daya perintah.
- source_word: עֲלֵה
  choice: pergilah ke
  rationale: Kata ini harfiah berarti “naiklah.” Dalam bahasa Indonesia, “pergilah ke Betel” lebih alami; unsur gerak menuju tempat tetap dipertahankan, sedangkan ketinggian geografis tidak perlu dipaksakan jika tidak idiomatis.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang sudah mapan, bukan diterjemahkan menjadi “Rumah Allah.”
- source_word: וְשֶׁב שָׁם
  choice: dan tinggallah di sana
  rationale: ישב dapat berarti duduk, menetap, atau tinggal. “Tinggallah” jelas dan alami untuk perintah menetap di tempat itu.
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: Buatlah di sana sebuah mazbah
  rationale: עשה berarti membuat atau melakukan. “Buatlah” dekat dengan bentuk Ibrani, sedangkan “mazbah” merupakan istilah Indonesia yang lazim untuk altar persembahan.
- source_word: לָאֵל
  choice: bagi Allah
  rationale: Preposisi ל menandai peruntukan atau pentahbisan mazbah. “Bagi Allah” menyampaikan hubungan itu secara alami.
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: yang menampakkan diri kepadamu
  rationale: Bentuk Niphal dari ראה dalam konteks penampakan ilahi paling tepat dinyatakan dengan “menampakkan diri,” tanpa menyiratkan bahwa Yakub memprakarsai penglihatan itu.
- source_word: בְּבָרְחֲךָ
  choice: ketika engkau melarikan diri
  rationale: Infinitif konstruk dengan ב menyatakan keadaan waktu; “ketika” merupakan padanan Indonesia yang jelas.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada muka atau hadapan seseorang dan secara idiomatis berarti melarikan diri dari orang itu. “Dari hadapan” mempertahankan citra sumber sekaligus dapat dipahami dalam bahasa Indonesia.
- source_word: עֵשָׂו אָחִיךָ
  choice: Esau, saudaramu
  rationale: Urutan sumber dipertahankan, dengan koma agar aposisi terdengar alami dan tidak ambigu dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan אֱלֹהִים
  choice: Allah yang esa berbicara kepada Yakub
  alternative: allah-allah
  rationale: Verba tunggal dan konteks narasi dengan jelas menunjukkan Allah Israel, bukan sejumlah ilah.
- issue: Identitas לָאֵל yang diikuti klausa relatif
  choice: “bagi Allah yang menampakkan diri kepadamu”
  alternative: “bagi Sang Allah yang menampakkan diri kepadamu”
  rationale: Bahasa Indonesia tidak memerlukan artikel tertentu seperti bahasa Inggris. Klausa relatif sudah mengidentifikasi Allah yang dimaksud tanpa menambahkan gelar yang tidak ada dalam sumber.
- issue: Nama tempat בֵּית אֵל
  choice: Betel
  alternative: Rumah Allah
  rationale: Dalam ayat ini bentuk tersebut berfungsi sebagai nama tempat; transliterasi menjaga fungsi itu dan tidak mengubahnya menjadi keterangan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” dipakai karena Allah berbicara kepada satu orang. Struktur perintah dipecah menjadi dua kalimat agar mengalir alami, tanpa mengubah urutan atau isi perintah Ibrani.
