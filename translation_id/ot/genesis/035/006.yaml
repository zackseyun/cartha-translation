  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: id
  text: Yakub tiba di Lus (yaitu Betel[a]), yang terletak di tanah Kanaan—ia dan seluruh rombongan yang menyertainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menyebut “Lus ... yaitu Betel,” sehingga nama tempat yang lebih lama dan identifikasinya yang lebih dikenal sama-sama dipertahankan.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: sampailah
  rationale: Bentuk wayyiqtol Qal dari בוא menyatakan gerak hingga tiba di suatu tempat; “sampailah” alami dalam narasi Indonesia dan menonjolkan tercapainya tujuan.
- source_word: לוּזָה
  choice: di Lus
  rationale: Nama tempat לוּז dengan akhiran penunjuk arah berarti menuju Lus. Dalam bahasa Indonesia, sesudah verba “sampai”, tujuan secara idiomatis diperkenalkan dengan “di”.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: yang terletak di tanah Kanaan
  rationale: Klausa relatif ini menyatakan lokasi Lus; “terletak” membuat hubungan geografis jelas dan wajar tanpa menambah isi.
- source_word: הִוא בֵּית אֵל
  choice: yaitu Betel
  rationale: Pronomina dan nama tempat berfungsi sebagai keterangan aposisional yang mengidentifikasi Lus sebagai Betel.
- source_word: הוּא
  choice: ia
  rationale: Pronomina resumtif ini kembali kepada Yakub dan mendahului penyebutan rombongan yang ikut tiba; “ia” mempertahankan struktur tersebut tanpa memberi penekanan berlebihan.
- source_word: וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: dan semua orang yang menyertainya
  rationale: עָם di sini menunjuk rombongan Yakub, bukan harus berarti suatu bangsa; “semua orang yang menyertainya” jelas dan alami.
