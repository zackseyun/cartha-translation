source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: id
  text: Lalu Yakub berkata kepada seisi rumahnya dan kepada semua orang yang menyertainya, “Singkirkanlah ilah-ilah asing yang ada di tengah-tengah kalian, sucikanlah diri kalian[a], dan gantilah pakaian kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Sucikanlah diri kalian” mungkin merujuk pada penyucian ritual sebagai persiapan untuk menghadap Allah.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: seisi rumahnya
  rationale: Ungkapan ini menunjuk kepada seluruh anggota rumah tangga Yakub, bukan bangunan rumah. 'Seisi rumahnya' alami dalam bahasa Indonesia dan mempertahankan pengertian sosialnya.
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: semua orang yang menyertainya
  rationale: Konteks menunjukkan orang-orang yang berada bersama Yakub; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: הָסִרוּ
  choice: Singkirkanlah
  rationale: Bentuk imperatif menuntut agar benda-benda pemujaan itu dikeluarkan dari lingkungan atau kepemilikan mereka. 'Singkirkanlah' mempertahankan ketegasan perintah.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: ilah-ilah asing
  rationale: Frasa konstruksi ini dapat berarti ilah milik bangsa asing atau ilah yang asing. 'Ilah-ilah asing' ringkas, jelas, dan tidak memaksakan salah satu nuansa.
- source_word: בְּתֹכְכֶם
  choice: yang ada di tengah-tengah kalian
  rationale: Terjemahan ini mempertahankan keluasan ungkapan Ibrani, yang dapat mencakup kehadiran di dalam komunitas maupun kepemilikan mereka.
- source_word: וְהִטַּהֲרוּ
  choice: sucikanlah diri kalian
  rationale: Bentuk hitpael bersifat refleksif. 'Sucikanlah diri kalian' mempertahankan kemungkinan nuansa ritual dalam persiapan menghadap Allah tanpa menambahkan tata cara yang tidak disebutkan.
- source_word: וְהַחֲלִיפוּ
  choice: gantilah
  rationale: Dalam hubungannya dengan pakaian, verba ini secara alami berarti mengganti.
- source_word: שִׂמְלֹתֵיכֶם
  choice: pakaian kalian
  rationale: Kata ini merujuk kepada pakaian atau jubah; 'pakaian' merupakan padanan modern yang luas dan mudah dipahami.
theological_decisions:
- issue: Sifat perintah penyucian
  choice: sucikanlah diri kalian
  alternative: bersihkanlah diri kalian
  rationale: Konteks penyingkiran ilah asing dan persiapan untuk mendekat kepada Allah mendukung kemungkinan penyucian ritual atau perjanjian. Terjemahan ini mempertahankan bobot tersebut tanpa merinci ritual yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak 'kalian' dipakai karena semua perintah Ibrani ditujukan kepada kelompok. 'Ilah' dipilih untuk dewa-dewa asing, sedangkan 'Allah' digunakan dalam catatan untuk Allah yang hendak mereka hampiri.
