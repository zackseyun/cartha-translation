  yaml_path: translation/ot/genesis/035/019.yaml
  text: So Rachel died and was buried on the way to Ephrath (that is[a], Bethlehem).
translation:
  language: id
  text: Rahel meninggal dan dikuburkan di jalan menuju Efrata[a] (yaitu Betlehem).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efrata juga dapat ditransliterasikan sebagai “Efrataha.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Bentuk dari מות menyatakan kematian fisik. 'Meninggal' merupakan ungkapan langsung, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: רָחֵל
  choice: Rahel
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַתִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk nifal dari קבר secara alami diterjemahkan sebagai pasif. Kata 'di sana' tidak ditambahkan karena tidak tersurat dalam bahasa Ibrani.
- source_word: בְּדֶרֶךְ
  choice: di jalan menuju
  rationale: Frasa ini menunjukkan lokasi di sepanjang rute perjalanan. 'Di jalan menuju' alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan tujuan Efrata.
- source_word: אֶפְרָתָה
  choice: Efrata
  rationale: Transliterasi baku yang umum dipakai dalam Alkitab bahasa Indonesia; akhiran -ה arah dalam bentuk ini tidak harus diperlakukan sebagai bagian nama tempat.
- source_word: הִוא
  choice: yaitu
  rationale: Pronomina ini berfungsi secara apositif untuk mengidentifikasi Efrata dengan Betlehem; 'yaitu' menyampaikan fungsi penjelas tersebut secara ringkas.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Bentuk nama tempat yang baku dan mudah dikenali dalam bahasa Indonesia.
