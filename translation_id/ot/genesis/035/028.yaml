lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי יִצְחָק
  choice: Umur Ishak mencapai
  rationale: Ungkapan Ibrani harfiah 'hari-hari Ishak adalah' merupakan idiom yang menyatakan seluruh masa hidup. Dalam bahasa Indonesia modern, 'umur Ishak mencapai' menyampaikan jumlah akhir usianya dengan wajar dan tepat.
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: seratus delapan puluh tahun
  rationale: Bahasa Ibrani menyusun bilangannya sebagai 'seratus tahun dan delapan puluh tahun'. Bahasa Indonesia secara alami menggabungkannya menjadi 'seratus delapan puluh tahun'.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
