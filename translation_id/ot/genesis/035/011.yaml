  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: id
  text: Lalu Allah berfirman kepadanya, “Akulah Allah Yang Mahakuasa.[a] Beranak cuculah dan bertambah banyaklah. Satu bangsa dan himpunan bangsa-bangsa[b] akan berasal darimu, dan raja-raja akan berasal dari tubuhmu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “El Syadai”; secara tradisional diterjemahkan “Allah Yang Mahakuasa”. Arti tepat Syadai tidak pasti.'
    reason: lexical_alternative
  - marker: b
    text: Atau “sekumpulan bangsa-bangsa”. Kata Ibrani yang dipakai dapat berarti kelompok, himpunan, atau perkumpulan bangsa-bangsa.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari pinggangmu”, suatu ungkapan bagi keturunan biologis yang berasal dari tubuh seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dengan kata kerja tunggal dan konteks Allah Israel yang berbicara, bentuk ini berfungsi sebagai sebutan ilahi tunggal. “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  rationale: Ungkapan ini adalah gelar ilahi. Padanan tradisional ini menyampaikan makna gelar secara wajar, sedangkan bentuk Ibraninya dicantumkan dalam catatan untuk mempertahankan ketidakpastian leksikalnya.
- source_word: פְּרֵה וּרְבֵה
  choice: Beranak cuculah dan bertambah banyaklah
  rationale: Kedua imperatif tunggal ini merupakan rumusan berkat penciptaan dan leluhur. Pilihan ini menyampaikan kesuburan manusia serta pertambahan jumlah secara alami dalam bahasa Indonesia.
- source_word: גּוֹי
  choice: satu bangsa
  rationale: Dalam konteks janji kepada leluhur, kata ini menunjuk pada suatu kelompok masyarakat yang menjadi bangsa.
- source_word: קְהַל גּוֹיִם
  choice: sekumpulan bangsa-bangsa
  rationale: קהל menunjuk pada kelompok yang berkumpul atau himpunan. “Sekumpulan” terdengar alami sekaligus tidak mengubahnya menjadi sekadar jumlah yang besar.
- source_word: יִהְיֶה מִמֶּךָּ
  choice: akan berasal darimu
  rationale: Secara harfiah berarti “akan ada dari engkau”; ungkapan Indonesia ini mempertahankan arti asal-usul keturunan secara wajar.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Bentuk jamak ini secara langsung berarti para raja; padanan yang lugas tidak memerlukan perluasan.
- source_word: מֵחֲלָצֶיךָ
  choice: dari tubuhmu
  rationale: Ungkapan konkret Ibrani “dari pinggangmu” mengacu pada keturunan biologis yang berasal dari tubuh seseorang. “Dari tubuhmu” mempertahankan unsur jasmaninya tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: יֵצֵאוּ
  choice: akan berasal
  rationale: Dalam konteks silsilah, kata kerja ini menyatakan bahwa para raja akan muncul dari garis keturunan Yakub, bukan gerakan keluar secara harfiah.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  alternative: El Syadai
  rationale: Gelar diterjemahkan agar maknanya dapat dipahami pembaca umum, sementara bentuk Ibraninya dan ketidakpastian arti tepat שַׁדַּי dipertahankan dalam catatan.
- issue: Kekonkretan jasmani dalam janji keturunan
  choice: raja-raja akan berasal dari tubuhmu
  alternative: raja-raja akan muncul dari keturunanmu
  rationale: Pilihan ini menjaga penekanan teks pada keturunan biologis tanpa memakai ungkapan “keluar dari pinggangmu” yang terasa kaku dalam bahasa Indonesia.
- issue: Makna קְהַל גּוֹיִם
  choice: sekumpulan bangsa-bangsa
  alternative: jemaat bangsa-bangsa
  rationale: “Sekumpulan” mempertahankan gagasan kelompok atau himpunan tanpa memasukkan nuansa kelembagaan atau keagamaan yang tidak harus dimaksudkan dalam konteks ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan “beranak cuculah dan bertambah banyaklah” mempertahankan gema berkat leluhur, sedangkan “berasal dari tubuhmu” menyampaikan garis keturunan jasmani secara alami. Semua penanda catatan kaki ditempatkan langsung setelah ungkapan yang dijelaskannya.
