  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: id
  text: Kemudian Israel melanjutkan perjalanannya dan mendirikan kemahnya di sebelah luar Migdal-Eder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Migdal-Eder berarti “menara kawanan ternak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: melanjutkan perjalanannya
  rationale: Dalam rangkaian narasi, bentuk ini menyatakan bahwa Israel berangkat dan bergerak lebih jauh; pilihan ini menyampaikan gerak lanjutan secara alami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub, sehingga nama itu dipertahankan.
- source_word: וַיֵּט
  choice: mendirikan
  rationale: Dengan 'kemah' sebagai objek, verba נטה secara idiomatis berarti memasang atau mendirikan kemah.
- source_word: אָהֳלֹה
  choice: kemahnya
  rationale: 'Nomina אֹהֶל berarti ''kemah'', dan sufiks orang ketiga maskulin tunggal menyatakan kepunyaan: ''kemahnya''.'
- source_word: מֵהָלְאָה
  choice: di seberang
  rationale: Adverbia ini menunjukkan tempat yang lebih jauh atau melewati suatu titik acuan; 'di seberang' mempertahankan relasi spasial terhadap lokasi berikutnya.
- source_word: לְמִגְדַּל עֵדֶר
  choice: Migdal-Eder
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan; arti unsur-unsurnya dijelaskan dalam catatan kaki.
