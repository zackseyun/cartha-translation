  yaml_path: translation/ot/genesis/035/017.yaml
  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: id
  text: Ketika ia mengalami kesulitan saat melahirkan, bidan itu berkata kepadanya, “Jangan takut, sebab anak ini pun seorang anak laki-laki bagimu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab engkau juga mendapat seorang anak laki-laki.”
    reason: Ungkapan Ibrani גַּם זֶה לָךְ בֵּן dapat dialihkan secara lebih idiomatis sebagai pernyataan bahwa ia memperoleh seorang anak laki-laki lagi, tetapi bentuk utama mempertahankan kata penunjuk 'ini'.
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: Ketika ia mengalami kesulitan saat melahirkan
  rationale: Konstruksi temporal dengan היה dan dua bentuk infinitif menggambarkan persalinan yang sulit. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan rincian medis.
- source_word: הַמְיַלֶּדֶת
  choice: bidan itu
  rationale: Partisip feminin dari ילד menunjuk kepada perempuan yang membantu persalinan; 'bidan' merupakan padanan modern yang tepat.
- source_word: אַל תִּירְאִי
  choice: Jangan takut
  rationale: Larangan langsung ini mempertahankan bentuk dan daya penghiburan ungkapan Ibrani.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi perkataan yang menenangkan.
- source_word: גַּם זֶה
  choice: anak ini pun
  rationale: Terjemahan ini mempertahankan unsur penunjuk זֶה dan makna aditif גַּם, sambil menyatakan secara alami bahwa yang ditunjuk adalah bayi yang sedang dilahirkan.
- source_word: לָךְ בֵּן
  choice: seorang anak laki-laki bagimu
  rationale: Padanan ini mempertahankan datif kepentingan atau kepemilikan לָךְ tanpa mengubahnya secara penuh menjadi pernyataan kepemilikan.
