  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: id
  text: Ketika nyawanya sedang pergi—sebab ia sedang sekarat—ia menamai anak itu Ben-Oni[a]. Namun, ayahnya menamainya Benyamin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Oni kemungkinan berarti “anak kesedihanku” atau “anak penderitaanku.”
    reason: lexical_alternative
  - marker: b
    text: Benyamin kemungkinan berarti “putra tangan kanan”; sebagian orang memahaminya sebagai “putra selatan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: ketika nyawanya pergi
  rationale: נֶפֶשׁ dalam konteks kematian ini menunjuk pada nyawa atau kehidupan. Ungkapan 'nyawanya pergi' alami dalam bahasa Indonesia dan tidak memaksakan pengertian antropologis teknis tentang jiwa.
- source_word: כִּי מֵתָה
  choice: sebab ia sedang sekarat
  rationale: Klausa ini menjelaskan ungkapan sebelumnya dan berlangsung bersamaan dengan pemberian nama; bentuk progresif menyampaikan alur narasi dengan jelas.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: ia menamai anak itu
  rationale: Terjemahan idiomatis ini menyampaikan tindakan pemberian nama secara wajar dalam bahasa Indonesia, sementara 'anak itu' memperjelas rujukan pronomina.
- source_word: בֶּן אוֹנִי
  choice: Ben-Oni
  rationale: Nama diri ditransliterasikan dalam teks utama; kemungkinan maknanya dijelaskan dalam catatan kaki karena penting bagi kontras naratif.
- source_word: וְאָבִיו קָרָא לוֹ
  choice: Namun, ayahnya menamainya
  rationale: ו dibaca secara adversatif karena nama yang diberikan sang ayah berlawanan dengan nama yang diberikan ibunya.
- source_word: בִנְיָמִין
  choice: Benyamin
  rationale: Dipakai bentuk nama yang sudah mapan dalam bahasa Indonesia; kemungkinan arti nama dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ dalam konteks kematian
  choice: Diterjemahkan 'nyawa' dalam teks utama
  alternative: '''jiwa'' atau ''kehidupan'''
  rationale: '''Nyawa'' mempertahankan fokus naratif pada kehidupan yang berakhir tanpa menetapkan secara teknis bahwa ayat ini sedang mengajarkan pemisahan jiwa tak berwujud dari tubuh.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Tanda pisah mempertahankan klausa penjelas yang tersisip, dan 'Namun' menonjolkan kontras antara kedua nama tanpa menambah tafsiran denominasi.
