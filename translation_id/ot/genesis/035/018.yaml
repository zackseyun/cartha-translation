  - severity: low
    issue: Ungkapan etimologis dalam catatan kaki Benyamin kurang alami.
    rationale: '"anak tangan kanan" terdengar janggal dalam bahasa Indonesia. "putra tangan kanan" menyampaikan unsur בן secara idiomatis dalam glosa nama tanpa mengubah makna.'
