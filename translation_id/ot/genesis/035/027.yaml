  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: id
  text: Yakub datang kepada Ishak, ayahnya, di Mamre, Kiryat-Arba (yaitu Hebron), tempat Abraham dan Ishak pernah tinggal sebagai pendatang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “tinggal sebagai pendatang” menunjukkan bahwa mereka menetap di sana sebagai orang asing atau penduduk sementara, bukan sekadar tinggal di suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk naratif dari בוא menyatakan gerak menuju tempat Ishak berada; “datang” alami dalam bahasa Indonesia dan mempertahankan sudut pandang kedatangan.
- source_word: אֶל יִצְחָק אָבִיו
  choice: kepada Ishak, ayahnya
  rationale: Menerjemahkan arah gerak dan hubungan keluarga secara eksplisit sesuai struktur Ibrani.
- source_word: מַמְרֵא
  choice: Mamre
  rationale: Nama tempat dipertahankan melalui transliterasi yang lazim.
- source_word: קִרְיַת הָאַרְבַּע
  choice: Kiryat-Arba
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan, dan hubungannya dengan Hebron dijelaskan oleh frasa berikutnya.
- source_word: הִוא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Ungkapan ini mengidentifikasi Kiryat-Arba dengan Hebron; “yaitu” merupakan bentuk penjelas yang alami dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר ... שָׁם
  choice: tempat ... pernah tinggal
  rationale: Partikel relatif dengan keterangan tempat dirender secara idiomatis tanpa menghilangkan rujukan lokatifnya.
- source_word: גָּר
  choice: tinggal sebagai pendatang
  rationale: Kata גור menyatakan tinggal sebagai orang asing atau penduduk sementara, bukan sekadar menetap; frasa ini menyampaikan nuansa tersebut dengan jelas bagi pembaca modern.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham dan Ishak
  rationale: Nama pribadi memakai bentuk yang sudah lazim dalam bahasa Indonesia.
