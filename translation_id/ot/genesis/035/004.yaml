base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: id
  text: Lalu mereka memberikan kepada Yakub semua dewa asing yang ada di tangan mereka dan anting-anting yang ada di telinga mereka. Yakub menyembunyikan semuanya di bawah pohon tarbantin[a] yang dekat Sikhem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon ek”; kata Ibrani ini kemungkinan lebih khusus menunjuk kepada pohon tarbantin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: Lalu mereka menyerahkan kepada Yakub
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. 'Menyerahkan kepada' menyampaikan tindakan memberikan benda-benda itu kepada Yakub secara alami dalam bahasa Indonesia.
- source_word: כָּל אֱלֹהֵי הַנֵּכָר
  choice: semua dewa asing
  rationale: Ungkapan ini menunjuk kepada ilah-ilah yang bukan bagian dari penyembahan umat perjanjian; 'dewa asing' jelas dan wajar tanpa menambahkan penafsiran tentang bentuk bendanya.
- source_word: אֲשֶׁר בְּיָדָם
  choice: yang ada di tangan mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani, meskipun ungkapan itu juga dapat menyatakan kepemilikan.
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: anting-anting yang ada di telinga mereka
  rationale: נְזָמִים dapat berarti perhiasan berbentuk cincin di hidung atau telinga, tetapi frasa berikutnya secara khusus menyatakan bahwa benda-benda ini berada di telinga; karena itu 'anting-anting' paling alami dalam bahasa Indonesia.
- source_word: וַיִּטְמֹן אֹתָם
  choice: Yakub menyembunyikan semuanya
  rationale: טמן berarti menyembunyikan atau menimbun. 'Menyembunyikan' mempertahankan keluasan makna verba tanpa memastikan bahwa benda-benda itu dikubur.
- source_word: תַּחַת הָאֵלָה
  choice: di bawah pohon tarbantin
  rationale: אֵלָה kemungkinan besar menunjuk kepada pohon tarbantin, bukan secara khusus pohon ek.
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: yang dekat Sikhem
  rationale: Dengan nama tempat, עִם menyatakan kedekatan lokasi; 'dekat Sikhem' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Hubungan anting-anting dengan penyembahan berhala
  choice: Teks menyebut dewa-dewa asing dan anting-anting sebagai benda-benda terpisah tanpa menjelaskan fungsi religius anting-anting itu.
  alternative: Anting-anting tersebut merupakan jimat atau benda berhala; atau hanya perhiasan berharga biasa.
  rationale: Bahasa Ibrani tidak secara eksplisit menyatakan apakah anting-anting itu sendiri memiliki makna pemujaan. Terjemahan tidak menyelesaikan ketegangan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan gambaran konkret 'di tangan mereka' dan ketidakpastian tentang cara Yakub menyembunyikan benda-benda tersebut.
