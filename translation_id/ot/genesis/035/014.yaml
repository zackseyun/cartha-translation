base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: id
  text: Lalu Yakub mendirikan sebuah tugu di tempat Allah telah berbicara dengannya, sebuah tugu batu. Ia mencurahkan suatu persembahan curahan di atasnya[a] dan menuangkan minyak di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Persembahan curahan ialah persembahan berupa cairan yang dicurahkan; juga disebut libasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: mendirikan
  rationale: Bentuk Hifil menyatakan tindakan membuat sesuatu berdiri tegak; “mendirikan” alami dan tepat untuk sebuah tugu.
- source_word: מַצֵּבָה
  choice: tugu
  rationale: Kata ini menunjuk pada batu atau monumen yang ditegakkan. “Tugu” ringkas, wajar, dan tidak menambahkan fungsi yang tidak dinyatakan.
- source_word: בַּמָּקוֹם
  choice: di tempat
  rationale: Padanan lokatif langsung yang alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: tempat Allah telah berbicara dengannya
  rationale: Subjek verba secara kontekstual adalah Allah, sebagaimana dinyatakan dalam ayat 13; penyebutan ini menghindari rujukan pronominal yang kabur dalam bahasa Indonesia. Bentuk “telah berbicara” menunjukkan bahwa peristiwa itu mendahului tindakan Yakub.
- source_word: מַצֶּבֶת אָבֶן
  choice: sebuah tugu batu
  rationale: Frasa ini menjelaskan bahan tugu. “Tugu batu” mempertahankan pengulangan penjelas dalam bahasa Ibrani dan tetap alami.
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: mencurahkan persembahan curahan
  rationale: Gabungan verba dan nomina serumpun menyatakan tindakan ritual mencurahkan suatu persembahan; pengulangan akar dipertahankan sejauh wajar dalam bahasa Indonesia.
- source_word: וַיִּצֹק
  choice: menuangkan
  rationale: Verba kedua untuk tindakan menuang dibedakan dari “mencurahkan” dan cocok dengan minyak sebagai objek.
- source_word: שָׁמֶן
  choice: minyak
  rationale: Teks hanya menyebut minyak; menambahkan “zaitun” akan melampaui keterangan eksplisit sumber.
theological_decisions:
- issue: Makna tindakan Yakub terhadap tugu
  choice: 'Tindakan itu disampaikan secara deskriptif: mendirikan tugu, mencurahkan persembahan, dan menuangkan minyak.'
  alternative: Menafsirkannya secara eksplisit sebagai pentahbisan tugu atau sebagai tindakan peringatan.
  rationale: Ayat ini tidak menjelaskan makna teologis ritual tersebut secara eksplisit, sehingga terjemahan tidak menambahkan penilaian atau tujuan yang tidak dinyatakan.
- issue: Subjek dalam אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: Allah disebutkan secara eksplisit sebagai subjek berdasarkan konteks langsung.
  alternative: 'Mempertahankan pronomina semata: “tempat ia telah berbicara dengannya.”'
  rationale: Bahasa Ibrani memungkinkan subjek tersirat, tetapi bahasa Indonesia dengan dua pronomina orang ketiga akan sangat kabur. Ayat 13 secara langsung mengidentifikasi Allah sebagai pihak yang berbicara dengan Yakub.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tugu” dipilih daripada istilah teknis atau bernuansa denominasi. Struktur naratif dan pengulangan material tugu dipertahankan tanpa terasa kaku.
