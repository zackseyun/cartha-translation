  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: id
  text: Lalu Allah naik dari Yakub, di tempat Dia berbicara dengannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah naik dari atas Yakub.” Bahasa Ibrani mempertahankan gambaran gerak ke atas ketika Allah meninggalkan perjumpaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Bentuk qal dari עלה menyatakan gerak naik. Pilihan ini mempertahankan gambaran vertikal dalam bahasa Ibrani dan tidak mereduksinya menjadi sekadar 'pergi'.
- source_word: מֵעָלָיו
  choice: meninggalkan Yakub
  rationale: Secara harfiah ungkapan ini berarti 'dari atasnya/darinya'. Dalam bahasa Indonesia, 'naik meninggalkan Yakub' menyampaikan gerak menjauh secara alami sekaligus memperjelas rujukan pronomina tanpa menyiratkan bahwa Allah sebelumnya berada secara fisik di atas tubuh Yakub.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks narasi menunjukkan bahwa yang dimaksud adalah Allah yang esa.
- source_word: בַּמָּקוֹם
  choice: di tempat
  rationale: Preposisi ב dengan מָקוֹם secara alami diterjemahkan 'di tempat' untuk menunjukkan lokasi perjumpaan.
- source_word: אֲשֶׁר
  choice: tempat ...
  rationale: Partikel relatif ini menghubungkan lokasi dengan peristiwa berbicara; susunan 'di tempat Dia berbicara' alami dalam bahasa Indonesia.
- source_word: דִּבֶּר אִתּוֹ
  choice: Dia berbicara dengannya
  rationale: Piel דבר dengan אֵת berarti 'berbicara dengan'. 'Dengan' mempertahankan nuansa konstruksi Ibrani, sedangkan kapitalisasi 'Dia' memperjelas bahwa subjeknya Allah.
theological_decisions:
- issue: Gambaran antropomorfis dan lokatif tentang kepergian Allah
  choice: Mempertahankan gerak vertikal dengan 'Allah naik meninggalkan Yakub'.
  alternative: Lalu Allah pergi dari Yakub.
  rationale: Teks Ibrani memakai verba biasa untuk gerak naik. Terjemahan mempertahankan citra teofani tersebut tanpa menjelaskan secara filosofis bagaimana kehadiran Allah harus dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama 'Yakub' dipakai menggantikan pronomina pertama agar dua rujukan maskulin dalam ayat pendek ini tidak membingungkan; pronomina 'dengannya' tetap wajar karena antesedennya sudah jelas.
