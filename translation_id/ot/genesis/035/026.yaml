base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: id
  text: Adapun anak-anak lelaki Zilpa[a], hamba perempuan Lea, adalah Gad dan Asyer[b]. Inilah anak-anak lelaki Yakub yang lahir baginya di Padan-Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba perempuan” juga dapat diterjemahkan “pelayan perempuan” atau, dengan lebih tegas menampilkan status sosialnya, “budak perempuan”.
    reason: lexical_alternative
  - marker: b
    text: Walaupun ayat ini menyatakan bahwa anak-anak Yakub lahir baginya “di Padan-Aram”, Benyamin lahir kemudian di Kanaan (ay. 16–18). Karena itu, keterangan tempat ini menimbulkan ketegangan dengan kelahiran Benyamin; teks dapat dipahami sebagai ringkasan yang berfokus pada masa rumah tangga Yakub di Aram, tetapi tidak menyatakan pengecualian itu secara eksplisit.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Dan anak-anak lelaki
  rationale: Bentuk jamak konstruksi בְּנֵי secara khusus menunjuk kepada anak-anak lelaki; ungkapan ini wajar dalam daftar silsilah Indonesia.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שִׁפְחַת
  choice: hamba perempuan
  rationale: שִׁפְחָה menunjuk kepada seorang pelayan atau budak perempuan. 'Hamba perempuan' mempertahankan unsur gender dan status sosial tanpa menentukan secara lebih sempit daripada istilah Ibrani.
- source_word: לֵאָה
  choice: Lea
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim; hubungan konstruksi dinyatakan secara alami dengan urutan 'hamba perempuan Lea'.
- source_word: גָּד וְאָשֵׁר
  choice: Gad dan Asyer
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, dengan konjungsi Ibrani diterjemahkan 'dan'.
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: Mereka inilah anak-anak lelaki Yakub
  rationale: Demonstratif אֵלֶּה diberi tekanan alami melalui 'inilah', sedangkan בְּנֵי tetap diterjemahkan secara khusus sebagai 'anak-anak lelaki'.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: yang lahir baginya
  rationale: Bentuk pasif יֻלַּד dengan לוֹ diterjemahkan secara dekat tanpa memasukkan subjek perempuan yang tidak dinyatakan dalam klausa Ibrani.
- source_word: בְּפַדַּן אֲרָם
  choice: di Padan-Aram
  rationale: Nama tempat dipertahankan sebagai transliterasi, bukan ditafsirkan berdasarkan kemungkinan etimologinya.
theological_decisions:
- issue: Pernyataan bahwa anak-anak Yakub lahir di Padan-Aram tampak mencakup Benyamin
  choice: Mempertahankan pernyataan umum teks tanpa mengubah lokasi atau mengecualikan Benyamin dalam teks utama
  alternative: Menambahkan pengecualian eksplisit bagi Benyamin atau menafsirkan lokasi secara lebih longgar di dalam teks utama
  rationale: Teks Ibrani menyampaikan rangkuman apa adanya, sementara Kejadian 35:16–18 menyatakan bahwa Benyamin lahir di Kanaan. Ketegangan naratif ini sebaiknya dipertahankan dan dijelaskan dalam catatan kaki, bukan diselesaikan diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Anak-anak lelaki' dipakai untuk mempertahankan kekhususan gender בְּנֵי; 'hamba perempuan' mempertahankan rentang makna sosial שִׁפְחָה. Struktur dua kalimat mengikuti susunan daftar dan rangkuman dalam bahasa Ibrani.
