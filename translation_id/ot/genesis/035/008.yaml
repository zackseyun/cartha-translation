base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: id
  text: Debora, pengasuh Ribka yang menyusuinya, meninggal. Ia dikuburkan di tempat yang lebih rendah dari Betel, di bawah pohon ek[a]. Pohon itu lalu dinamai Alon-Bakhut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אַלּוֹן dapat menunjuk kepada pohon ek atau pohon tarbantin; jenis pohon yang tepat tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Alon-Bakhut kemungkinan berarti “Pohon Ek Tangisan”; jika אַלּוֹן dipahami sebagai pohon tarbantin, artinya “Pohon Tarbantin Tangisan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: pengasuh Ribka yang dahulu menyusuinya
  rationale: Kata ini menunjuk kepada perempuan yang menyusui seorang anak dan kemudian dapat tetap menjadi pengasuhnya. Ungkapan ini menyampaikan fungsi tersebut dalam bahasa Indonesia modern tanpa memakai istilah lama yang kurang umum seperti “inang pengasuh”.
- source_word: מִתַּחַת לְבֵית אֵל
  choice: di tempat yang lebih rendah dari Betel
  rationale: Ungkapan Ibrani menunjukkan lokasi yang lebih rendah daripada Betel. Terjemahan ini mempertahankan hubungan ruang tanpa mengubahnya menjadi arah mata angin tertentu.
- source_word: תַּחַת הָאַלּוֹן
  choice: di bawah pohon ek
  rationale: תַּחַת berarti “di bawah”, sedangkan אַלּוֹן adalah sebutan bagi pohon besar yang lazim dipahami sebagai pohon ek, meskipun identifikasi tepatnya tidak pasti.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: Pohon itu lalu dinamai
  rationale: Bentuk Ibrani memakai verba aktif orang ketiga maskulin tanpa menyebut subjeknya. Bentuk pasif Indonesia tidak menambahkan pelaku yang tidak disebut, sedangkan “pohon itu” secara wajar merujuk kepada benda maskulin yang baru disebut.
- source_word: אַלּוֹן בָּכוּת
  choice: Alon-Bakhut
  rationale: Nama tempat atau pohon dipertahankan dalam bentuk transliterasi, sementara maknanya dijelaskan dalam catatan kaki.
- source_word: וַתִּקָּבֵר
  choice: Ia dikuburkan
  rationale: Bentuk Nifal secara alami menyatakan tindakan pasif dan tidak menyebut siapa yang menguburkannya.
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Padanan ini menyatakan kematian secara langsung dan wajar dalam bahasa Indonesia modern.
