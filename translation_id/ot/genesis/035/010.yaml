  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: id
  text: Allah berfirman kepadanya, “Namamu Yakub. Namamu tidak akan disebut Yakub lagi, melainkan Israel akan menjadi namamu.” Lalu Ia menamainya Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu Ia menyebut namanya Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan Allah yang esa; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: שִׁמְךָ
  choice: namamu
  rationale: Padanan langsung dan alami bagi kata benda dengan sufiks orang kedua maskulin tunggal; pengulangannya dipertahankan sesuai penekanan teks Ibrani.
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: tidak akan disebut ... lagi
  rationale: Bentuk nifal קרא menyatakan ‘disebut/dinamai’, sedangkan לֹא ... עוֹד menandakan bahwa penyebutan itu tidak berlanjut; susunan ini alami dalam bahasa Indonesia.
- source_word: כִּי אִם
  choice: melainkan
  rationale: 'Konstruksi ini menyatakan kontras dan penggantian: bukan Yakub, melainkan Israel.'
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: Israel akan menjadi namamu
  rationale: Mempertahankan penempatan “Israel” di depan untuk mencerminkan penekanan teks sumber sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: Lalu Ia menamainya Israel
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan tindakan pemberian nama dengan jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan penggantian nama tanpa melebih-lebihkan bahwa nama lama sama sekali tidak pernah dipakai lagi
  choice: Namamu tidak akan disebut Yakub lagi, melainkan Israel akan menjadi namamu.
  alternative: Namamu bukan lagi Yakub, melainkan Israel.
  rationale: Terjemahan mempertahankan daya deklarasi resmi dalam bahasa Ibrani dan ketegangan dengan pemakaian nama “Yakub” dalam kisah selanjutnya, tanpa menambahkan penjelasan harmonisasi.
- issue: Subjek tersirat pada tindakan penamaan terakhir
  choice: Ia menamainya Israel
  alternative: Namanya disebut Israel
  rationale: Verba Ibrani berbentuk tunggal maskulin tanpa subjek yang dinyatakan ulang; kesinambungan wacana paling wajar menunjuk kepada Allah. Kata ganti mempertahankan kesinambungan itu tanpa mengulang nama ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa bentuk arkais. “Akan” dipakai alih-alih bentuk yang terlalu formal atau usang; “melainkan” menjaga kontras resmi dalam formula penggantian nama.
