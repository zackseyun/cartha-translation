  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: id
  text: Yakub menamai tempat itu—tempat Allah berbicara dengannya—Betel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel berarti “rumah Allah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם הַמָּקוֹם
  choice: menamai tempat
  rationale: Ungkapan harfiah 'menyebut nama tempat' merupakan idiom Ibrani untuk memberi nama; 'menamai tempat' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: Allah berbicara dengannya itu
  rationale: אִתּוֹ diterjemahkan 'dengannya'. Unsur tempat שָׁם tidak dihilangkan, tetapi diwujudkan secara alami melalui 'itu', yang menunjuk kembali kepada tempat tersebut dan menghindari susunan berlebihan 'tempat di mana ... di sana'.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks dan sintaksis ayat ini, bentuk tersebut merujuk secara tunggal kepada Allah yang berbicara kepada Yakub.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Nama tempat ditransliterasikan menurut bentuk baku bahasa Indonesia; arti nama dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna tunggal אֱלֹהִים
  choice: Allah
  alternative: ilah-ilah
  rationale: Konteks narasi dan verba tunggal menunjukkan satu referen ilahi, yaitu Allah yang telah berbicara kepada Yakub.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Idiom penamaan Ibrani disampaikan secara idiomatis, sementara unsur lokasi שָׁם tetap terwakili oleh kata penunjuk 'itu'.
