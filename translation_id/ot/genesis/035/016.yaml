  terminology: Betel dan Rahel adalah bentuk nama yang mapan dalam bahasa Indonesia. Efrata lebih sesuai dengan bentuk Ibrani dan pemakaian Alkitab bahasa Indonesia daripada Efrat sebagai bentuk utama.
