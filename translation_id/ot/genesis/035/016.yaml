  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: id
  text: Kemudian mereka berangkat dari Betel. Ketika masih ada jarak yang harus ditempuh sebelum tiba di Efrata[a], Rahel melahirkan, dan ia mengalami kesulitan dalam persalinannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Efrat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מִבֵּית אֵל
  choice: Kemudian mereka berangkat dari Betel
  rationale: Kata נסע dalam rangkaian narasi menunjukkan keberangkatan untuk melanjutkan perjalanan. ‘Berangkat’ alami dalam bahasa Indonesia dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: Ketika masih ada jarak yang harus ditempuh
  rationale: Ungkapan Ibrani yang jarang ini menyatakan adanya jarak tersisa, tetapi tidak menentukan ukurannya. Terjemahan ini mempertahankan ketidakpastian tersebut.
- source_word: לָבוֹא אֶפְרָתָה
  choice: sebelum tiba di Efrat[a]
  rationale: Infinitif dengan ל dalam konteks ini mengarah pada kedatangan yang belum terjadi. ‘Sebelum tiba’ menyampaikan hubungan itu secara wajar; nama tempat ditransliterasikan ‘Efrat’, dengan bentuk alternatif dicatat.
- source_word: וַתֵּלֶד רָחֵל
  choice: Rahel melahirkan
  rationale: Bentuk Qal ילד dengan subjek perempuan secara langsung berarti melahirkan.
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: ia mengalami kesulitan saat melahirkan
  rationale: קשה menyatakan kesukaran atau keadaan berat dalam proses kelahiran. Pilihan ini jelas, alami, dan tidak menambahkan rincian medis.
