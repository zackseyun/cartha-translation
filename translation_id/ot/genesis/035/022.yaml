base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: id
  text: 'Ketika Israel tinggal di negeri itu, Ruben pergi dan tidur dengan Bilha, gundik ayahnya, lalu Israel mendengar tentang hal itu.[a]


    Putra-putra Yakub berjumlah dua belas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lalu Israel mendengar.” Objeknya tidak disebutkan, tetapi mengacu pada perbuatan Ruben.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Dan putra-putra Yakub ada dua belas.” Klausa ini menjadi peralihan menuju daftar putra-putra Yakub dalam ayat-ayat berikutnya.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: Ketika ... tinggal
  rationale: Konstruksi בְּ + infinitif menyatakan latar waktu yang sedang berlangsung. Dalam bahasa Indonesia, “Ketika ... tinggal” menyampaikan fungsi itu secara alami tanpa mempertahankan pembuka Ibrani וַיְהִי secara kaku.
- source_word: בָּאָרֶץ הַהִוא
  choice: di negeri itu
  rationale: אָרֶץ di sini menunjuk pada wilayah tempat Israel menetap; “negeri itu” merupakan padanan Indonesia yang wajar dan tidak mengesankan seluruh bumi.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Kata kerja ini dipertahankan karena teks Ibrani secara tersendiri menyatakan bahwa Ruben pergi lalu melakukan tindakan berikutnya.
- source_word: וַיִּשְׁכַּב אֶת
  choice: tidur dengan
  rationale: Dalam konteks ini frasa tersebut adalah idiom seksual. “Tidur dengan” merupakan idiom Indonesia yang jelas, langsung, dan tidak seklinis “berhubungan seksual dengan”.
- source_word: פִּילֶגֶשׁ
  choice: gundik
  rationale: “Gundik” adalah istilah Indonesia yang mapan bagi perempuan yang mempunyai kedudukan rumah tangga yang diakui tetapi lebih rendah daripada istri utama dalam konteks dunia kuno.
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: lalu Israel mendengar tentang hal itu
  rationale: Teks Ibrani secara harfiah hanya menyatakan “Israel mendengar”; objek yang tersirat diperjelas secara alami sebagai tindakan Ruben, tanpa menambahkan reaksi Israel yang tidak dinyatakan.
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: Anak-anak Yakub berjumlah dua belas
  rationale: Rumusan ini menyampaikan jumlah secara alami dalam bahasa Indonesia dan mempertahankan fungsi klausa sebagai peralihan menuju daftar anak-anak Yakub.
theological_decisions:
- issue: Penyampaian idiom seksual tanpa mengaburkan atau menguraikannya secara berlebihan
  choice: tidur dengan
  alternative: berbaring dengan; berhubungan seksual dengan
  rationale: “Tidur dengan” tetap menyatakan pelanggaran seksual Ruben dengan jelas dalam bahasa Indonesia modern, tanpa menjadi terlalu harfiah atau klinis.
- issue: Reaksi Israel setelah mendengar perbuatan Ruben
  choice: Tidak menambahkan kemarahan, hukuman, atau respons lain
  alternative: Menafsirkan diamnya narasi sebagai sikap moral atau yudisial tertentu
  rationale: Ayat hanya menyatakan bahwa Israel mendengar. Terjemahan tidak boleh memasukkan reaksi atau kesimpulan teologis yang tidak dinyatakan.
- issue: Fungsi klausa terakhir
  choice: Disajikan sebagai kalimat peralihan tersendiri
  alternative: Digabungkan erat dengan laporan pelanggaran Ruben
  rationale: Klausa tersebut mengantar pembaca kepada daftar kedua belas anak Yakub dalam ayat-ayat berikutnya, bukan menjelaskan makna teologis tindakan Ruben.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat alami bagi pembaca umum, sementara hubungan antarklausa, idiom seksual, dan fungsi peralihan pada klausa terakhir tetap setia pada teks Ibrani.
