base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: id
  text: Kemudian mereka berangkat, dan kegentaran dari Allah[a] melanda kota-kota di sekeliling mereka, sehingga penduduknya tidak mengejar anak-anak lelaki Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kegentaran Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: Kemudian mereka berangkat
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan "berangkat" secara alami menyampaikan gerak perjalanan dari נסע.
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: kegentaran dari Allah melanda
  rationale: Ungkapan ini menyampaikan hadirnya rasa gentar yang berasal dari Allah; "melanda" merupakan padanan Indonesia yang alami bagi konstruksi היה ... על tanpa menghilangkan daya peristiwanya.
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: kota-kota di sekeliling mereka
  rationale: Padanan ringkas dan alami ini mempertahankan lokasi kota-kota yang mengitari rombongan Yakub.
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: sehingga penduduknya tidak mengejar
  rationale: Konteks menunjukkan akibat dari kegentaran tersebut. Subjek gramatikal yang tersirat diperjelas sebagai penduduk kota-kota agar kalimat Indonesia tidak ambigu secara tidak wajar.
- source_word: בְּנֵי יַעֲקֹב
  choice: anak-anak lelaki Yakub
  rationale: Padanan ini mempertahankan rujukan maskulin jamak בְּנֵי dan lebih mudah dipahami dalam bahasa Indonesia modern daripada "putra-putra Yakub".
theological_decisions:
- issue: Makna konstruksi חִתַּת אֱלֹהִים
  choice: kegentaran dari Allah
  alternative: kegentaran akan Allah; kegentaran yang dahsyat
  rationale: Konstruksi ini paling wajar dipahami sebagai kegentaran yang bersumber dari Allah dalam konteks perlindungan ilahi, tetapi bentuk Ibraninya juga memungkinkan nuansa kegentaran yang berkaitan dengan Allah atau konstruksi intensif. Alternatif dipertahankan dalam catatan kaki.
- issue: Rujukan בְּנֵי יַעֲקֹב
  choice: anak-anak lelaki Yakub
  alternative: anak-anak Yakub; putra-putra Yakub
  rationale: Teks secara eksplisit memakai bentuk maskulin jamak dan dalam konteks ini merujuk kepada keturunan laki-laki Yakub, sehingga unsur gender dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Kegentaran" mempertahankan bobot חִתַּת, sedangkan "melanda" membuat konstruksi peristiwa terdengar alami. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan ungkapan sebelumnya.
