  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: id
  text: Allah menampakkan diri kepada Yakub lagi[a] ketika Yakub datang dari Padan-Aram, dan Ia memberkatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah menyatakan diri kepada Yakub lagi.” Kata kerja Ibrani ini dapat menyatakan bahwa Allah menampakkan atau menyatakan diri-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk nifal dari ראה di sini menyatakan bahwa Allah membuat diri-Nya tampak atau hadir secara nyata. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan cara penampakan itu terjadi.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini disertai verba tunggal dan dalam konteks ini jelas menunjuk kepada satu-satunya Allah.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini, kata tersebut menandai pengulangan penampakan ilahi yang pernah terjadi sebelumnya.
- source_word: בְּבֹאוֹ
  choice: ketika ia datang
  rationale: Preposisi ב dengan infinitif konstruktus dan sufiks pronominal berfungsi secara temporal. Terjemahan ini jelas dan tetap dekat dengan susunan Ibrani.
- source_word: מִפַּדַּן אֲרָם
  choice: dari Padan-Aram
  rationale: Ini adalah nama tempat; prefiks מִן diterjemahkan 'dari', sedangkan nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: lalu Allah memberkati dia
  rationale: Piel ברך berarti 'memberkati'. Nama 'Allah' diulangi agar hubungan subjek-objek tidak rancu dalam bahasa Indonesia, sebab dua pronomina orang ketiga muncul berdekatan.
theological_decisions:
- issue: Sifat penampakan ilahi
  choice: Allah menampakkan diri kepada Yakub lagi
  alternative: Allah tampak kepada Yakub lagi
  rationale: Ayat ini melaporkan manifestasi Allah yang nyata tanpa menjelaskan mekanismenya. 'Menampakkan diri' mempertahankan gagasan bahwa Allah membuat diri-Nya terlihat tanpa mengharuskannya dipahami sebagai penampakan jasmani atau sekadar penglihatan batin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk Yakub dalam klausa temporal, sedangkan 'Allah' diulangi pada klausa terakhir untuk mencegah ambiguitas pronominal. Ejaan nama tempat dipertahankan sebagai 'Padan-Aram'.
