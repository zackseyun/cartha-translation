  terminology: Nama Ishak, Esau, dan Yakub sudah tepat. Formula kematian perlu memakai “kaumnya” alih-alih “kaum leluhurnya” agar tidak menetapkan salah satu penafsiran tentang siapa yang dimaksud dengan עַמָּיו.
