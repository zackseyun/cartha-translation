base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: id
  text: Lalu Ishak mengembuskan napas terakhir dan meninggal, lalu dikumpulkan kepada kaumnya[a]. Ia tua dan berusia lanjut. Esau dan Yakub, anak-anaknya, menguburkan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dikumpulkan kepada kaumnya/bangsanya.” Ini merupakan ungkapan baku Ibrani tentang kematian dan mungkin menyiratkan lebih dari sekadar penguburan jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: mengembuskan napas terakhir
  rationale: Mengungkapkan verba גוע secara alami dalam bahasa Indonesia sebagai tindakan mengembuskan napas terakhir, sekaligus membedakannya dari verba berikutnya, וַיָּמָת ('meninggal').
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Padanan baku dan bermartabat untuk מות dalam pemberitahuan kematian.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: dikumpulkan kepada kaum leluhurnya
  rationale: Mempertahankan metafora pasif 'dikumpulkan' serta cakupan kolektif עַמָּיו. 'Kaum leluhurnya' terdengar wajar dalam bahasa Indonesia dan tidak membatasi ungkapan itu hanya pada penguburan.
- source_word: זָקֵן וּשְׂבַע יָמִים
  choice: sudah tua dan lanjut umurnya
  rationale: Menyampaikan dua unsur frasa Ibrani secara jelas dan alami. Idiom harfiah 'kenyang akan hari-hari' akan terasa janggal dan berpotensi disalahpahami dalam bahasa Indonesia modern.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: menguburkan dia
  rationale: Padanan langsung dan lazim bagi tindakan penguburan.
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: Esau dan Yakub, anak-anaknya
  rationale: Mempertahankan urutan nama dan aposisi dalam teks Ibrani dengan susunan yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna formula kematian וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Mempertahankan gambaran 'dikumpulkan kepada kaum leluhurnya' tanpa menentukan keadaan setelah kematian.
  alternative: Menafsirkannya hanya sebagai dikuburkan di makam keluarga, atau secara tegas sebagai bersatu kembali dengan leluhur di alam baka.
  rationale: Formula Ibrani ini dapat memiliki resonansi kekeluargaan dan pascakematian yang melampaui penguburan fisik, tetapi ayat tersebut tidak menjelaskannya. Terjemahan dan catatan mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. Pengulangan verba kematian dipertahankan karena mencerminkan urutan retoris teks Ibrani. Ungkapan idiomatis tentang usia diterjemahkan secara alami agar mudah dipahami pembaca umum.
