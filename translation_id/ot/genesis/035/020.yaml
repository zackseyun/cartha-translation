  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: id
  text: Yakub mendirikan sebuah batu tegak di atas kuburnya[a]. Itulah batu tegak penanda kubur Rahel sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah tugu batu di atas kuburnya” atau “sebuah batu penanda kuburnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: mendirikan
  rationale: Bentuk Hifil dari נצב berarti membuat sesuatu berdiri atau mendirikannya; pilihan ini alami untuk tindakan menegakkan batu peringatan.
- source_word: מַצֵּבָה
  choice: batu tegak
  rationale: Nomina ini menunjuk pada batu yang didirikan atau tugu batu. 'Batu tegak' mempertahankan gambaran konkret dan tidak menyiratkan bentuk bangunan tertentu.
- source_word: עַל קְבֻרָתָהּ
  choice: di atas kuburnya
  rationale: עַל menyatakan posisi terhadap tempat penguburan, sedangkan קְבֻרָתָהּ berarti kuburnya atau tempat penguburannya.
- source_word: הִוא
  choice: Itulah
  rationale: Pronomina ini mengacu kembali kepada batu tegak dan mengidentifikasikannya; 'Itulah' jelas dan wajar dalam bahasa Indonesia.
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: batu tegak pada kubur Rahel
  rationale: Rangkaian konstruksi menghubungkan batu tegak dengan kubur Rahel. 'Pada' menyampaikan fungsi penandaan secara alami tanpa mengubah batu itu menjadi kubur itu sendiri.
- source_word: עַד הַיּוֹם
  choice: sampai hari ini
  rationale: Ungkapan Ibrani baku ini menyatakan keberlanjutan hingga masa narator.
