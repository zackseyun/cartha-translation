  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: id
  text: Burung-burung pemangsa turun pada bangkai-bangkai itu[a], lalu Abram mengusir mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seekor burung pemangsa turun pada bangkai-bangkai itu.” Nomina Ibrani berbentuk tunggal dan dapat dipahami sebagai nomina kolektif; dalam konteks ini kemungkinan besar yang dimaksud ialah burung-burung pemakan bangkai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ירד menyatakan gerak turun. Dalam konteks ini, “turun” alami dalam bahasa Indonesia dan mempertahankan arah geraknya menuju bangkai.
- source_word: הָעַיִט
  choice: burung-burung pemangsa
  rationale: Nomina tunggal עַיִט dapat berfungsi secara kolektif. Bentuk jamak idiomatis dalam bahasa Indonesia dan sesuai dengan gambaran sekawanan burung yang mendatangi bangkai; “burung nasar” terlalu spesifik.
- source_word: הַפְּגָרִים
  choice: bangkai-bangkai itu
  rationale: פֶּגֶר berarti bangkai atau jasad. Karena yang dimaksud ialah hewan-hewan yang telah disembelih, “bangkai-bangkai” paling tepat, sedangkan “potongan-potongan” kurang mewakili makna katanya.
- source_word: וַיַּשֵּׁב אֹתָם
  choice: mengusir mereka
  rationale: Bentuk Hifil dari שוב di sini berarti membuat berbalik atau menjauh. “Mengusir mereka” menyampaikan tindakan aktif Abram secara wajar.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama ini dipertahankan sebagai Abram karena pada tahap kisah ini namanya belum diubah menjadi Abraham.
