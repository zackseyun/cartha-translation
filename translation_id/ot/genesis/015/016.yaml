  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: id
  text: Pada generasi keempat mereka akan kembali ke sini, sebab kejahatan orang-orang Amori[a] belum mencapai kepenuhannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Amori” berbentuk tunggal, tetapi dipakai secara kolektif untuk seluruh kelompok bangsa itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai di sini”; ungkapan ini dapat berarti “sampai sekarang” atau, dalam alur waktu yang sedang dinubuatkan, “sampai waktu itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְד֥וֹר רְבִיעִ֖י
  choice: Pada generasi keempat
  rationale: דּוֹר berarti ‘generasi’ atau ‘angkatan’, dan רְבִיעִי adalah bilangan bertingkat ‘keempat’. Bentuk ‘pada generasi keempat’ menyampaikan keterangan waktu secara alami dalam bahasa Indonesia; waw penghubung tidak perlu diterjemahkan secara mekanis.
- source_word: יָשׁ֣וּבוּ
  choice: mereka akan kembali
  rationale: שׁוּב menyatakan gerak kembali. Bentuk jamak merujuk kepada keturunan Abram yang dibicarakan dalam konteks sebelumnya.
- source_word: הֵ֑נָּה
  choice: ke sini
  rationale: Adverbia deiktis ini menunjuk arah atau tujuan menuju tempat pembicara; ‘ke sini’ lebih tepat daripada sekadar ‘di sini’ sesudah verba gerak ‘kembali’.
- source_word: כִּ֧י
  choice: sebab
  rationale: כִּי memperkenalkan alasan mengapa kepulangan itu baru terjadi pada generasi keempat.
- source_word: לֹא שָׁלֵ֛ם
  choice: belum mencapai kepenuhannya
  rationale: שָׁלֵם menyatakan keadaan utuh, penuh, atau genap. Dalam konstruksi negatif dan konteks waktu, ‘belum mencapai kepenuhannya’ mengungkapkan bahwa batas tersebut belum tercapai tanpa menentukan secara lebih rinci hakikat batas itu.
- source_word: עֲוֺ֥ן
  choice: kedurhakaan
  rationale: עָוֹן dapat berarti kesalahan, kedurhakaan, rasa bersalah, atau akibat kesalahan. Di sini yang belum mencapai kepenuhan ialah kejahatan moral bangsa itu; ‘kedurhakaan’ mempertahankan bobot etis dan religiusnya.
- source_word: הָאֱמֹרִ֖י
  choice: orang Amori
  rationale: Bentuk Ibrani tunggal memakai nama bangsa secara kolektif. ‘Orang Amori’ dalam bahasa Indonesia dapat berfungsi sebagai sebutan kolektif tanpa memaksakan bentuk jamak yang tidak ditandai dalam sumber.
- source_word: עַד הֵֽנָּה
  choice: belum
  rationale: Ungkapan harfiahnya ‘sampai sini’ dan dalam pemakaian temporal berarti ‘sampai sekarang/sejauh ini’. Dalam kalimat Indonesia, nuansanya terwakili secara alami oleh ‘belum’, sementara bentuk yang lebih harfiah dan kemungkinan acuannya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penundaan kepulangan keturunan Abram dan penghukuman orang Amori
  choice: Ayat menyatakan bahwa kepulangan mereka menanti sampai kedurhakaan orang Amori mencapai kepenuhannya.
  alternative: Penundaan itu terutama ditafsirkan sebagai kesabaran Allah terhadap orang Amori atau sebagai sarana pembentukan Israel di Mesir.
  rationale: Teks hanya memberikan belum penuhnya kedurhakaan orang Amori sebagai alasan waktu kepulangan. Terjemahan tidak menambahkan teori providensi atau penjelasan doktrinal yang tidak dinyatakan dalam ayat.
- issue: Makna ‘kepenuhan’ kedurhakaan
  choice: Mempertahankan gambaran bahwa kedurhakaan belum mencapai kepenuhannya.
  alternative: Menjelaskannya secara eksplisit sebagai ambang tertentu yang langsung memicu hukuman ilahi.
  rationale: Bahasa sumber menyatakan keadaan yang belum penuh, tetapi tidak menguraikan ukuran atau mekanismenya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Generasi’ dipilih karena jelas bagi pembaca masa kini, sedangkan ‘kedurhakaan’ mempertahankan bobot moral-teologis עָוֹן. Susunan kalimat dibuat alami tanpa menghilangkan hubungan sebab-akibat atau ketidakpastian temporal dalam עַד הֵנָּה.
