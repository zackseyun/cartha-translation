base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: id
  text: Ketika matahari telah terbenam dan hari telah gelap, tampaklah sebuah tungku berasap[a] dan sebuah obor menyala. Keduanya melintas di antara potongan-potongan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “oven berasap” atau “perapian berasap”. Istilah Ibrani ini terutama menunjuk pada tungku atau oven.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud adalah bagian-bagian hewan yang telah dipotong dan ditata sebelumnya dalam upacara perjanjian (lihat Kejadian 15:10).
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: Ketika matahari sudah terbenam
  rationale: Ungkapan בוא dengan matahari merupakan idiom untuk terbenamnya matahari. Bentuk temporal “ketika” menyampaikan peralihan naratif secara alami dalam bahasa Indonesia.
- source_word: וַעֲלָטָה הָיָה
  choice: dan hari sudah gelap
  rationale: עֲלָטָה berarti kegelapan atau kesuraman. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak memperkuatnya menjadi “gelap gulita” tanpa keharusan dari konteks.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: הִנֵּה menarik perhatian kepada pemandangan yang muncul. “Tampaklah” mempertahankan daya penyajian yang hidup dan khidmat tanpa terdengar terlalu arkais.
- source_word: תַנּוּר עָשָׁן
  choice: sebuah tungku berasap
  rationale: תַנּוּר menunjuk pada tungku, tempat pembakaran, atau wadah api. “Tungku” mempertahankan gambaran konkret dan mudah dipahami; עָשָׁן disampaikan secara adjektival sebagai “berasap”.
- source_word: לַפִּיד אֵשׁ
  choice: sebuah obor menyala
  rationale: לַפִּיד berarti obor, sedangkan אֵשׁ menonjolkan sifatnya yang berapi. “Obor menyala” merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: אֲשֶׁר עָבַר
  choice: yang melintas
  rationale: Klausa relatif dibiarkan merujuk pada keseluruhan penampakan kedua lambang api itu. Bentuk ini juga tidak memaksakan penjelasan mengenai penggunaan verba tunggal Ibrani setelah dua gambaran tersebut.
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: di antara potongan-potongan itu
  rationale: גְּזָרִים adalah bagian-bagian hewan yang telah dipotong dalam ayat 10. “Potongan-potongan” jelas dan alami dalam konteks ini.
theological_decisions:
- issue: Jati diri benda-benda berapi dalam adegan pengikatan perjanjian
  choice: Menggambarkan tungku berasap dan obor menyala tanpa secara eksplisit menyebut keduanya sebagai Allah sendiri.
  alternative: Menjelaskannya langsung sebagai penampakan kehadiran TUHAN yang melintas di antara potongan-potongan itu.
  rationale: Konteks yang lebih luas kuat mengarah pada manifestasi ilahi, tetapi teks Ibrani ayat ini sendiri hanya menyebut lambang-lambang yang terlihat. Terjemahan deskriptif mempertahankan ketegangan teologis dan tidak memasukkan tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Tampaklah” mempertahankan penekanan visual וְהִנֵּה, sedangkan susunan kalimat tetap lancar dan mudah dipahami pembaca umum.
