base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: id
  text: Lalu Abram berkata, “Lihatlah, Engkau tidak memberikan keturunan kepadaku, dan lihatlah, seorang dari rumah tanggaku akan menjadi ahli warisku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan urutan itu secara wajar dalam bahasa Indonesia.
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menegaskan keluhan Abram. “Sesungguhnya” mempertahankan tekanan tersebut dengan ragam yang bermartabat, tanpa memaksakan arti visual.
- source_word: לִי לֹא נָתַתָּה זָרַע
  choice: Engkau tidak memberikan keturunan kepadaku
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan Allah sebagai subjek serta Abram sebagai penerima. זֶרַע secara harfiah berarti “benih”, tetapi di sini menunjuk kepada anak atau keturunan.
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Partikel ini menarik perhatian kepada akibat keadaan Abram dan mempertahankan penekanan kedua dalam ucapan tersebut.
- source_word: בֶן בֵּיתִי
  choice: seorang dari seisi rumahku
  rationale: Secara harfiah ungkapan ini berarti “anak rumahku”. Pilihan ini mempertahankan hubungan dengan rumah tangga Abram tanpa menambahkan status “budak” yang tidak dinyatakan oleh ayat ini.
- source_word: יוֹרֵשׁ אֹתִי
  choice: akan menjadi ahli warisku
  rationale: Ungkapan Ibrani secara harfiah berbunyi “mewarisi aku”, dengan Abram sebagai objek secara metonimis. Dalam bahasa Indonesia, “menjadi ahli warisku” menyampaikan fungsi orang itu secara jelas tanpa memberi kesan bahwa pribadi Abram sendiri merupakan harta warisan.
theological_decisions:
- issue: Status orang dari rumah tangga Abram
  choice: Tidak menyebutnya sebagai budak; menerjemahkannya sebagai “seorang dari seisi rumahku”.
  alternative: “seorang budak yang lahir di rumahku” atau “anak rumahku”
  rationale: Ayat ini hanya menyebut בֶן בֵּיתִי, bukan istilah eksplisit untuk budak. Terjemahan menahan diri agar tidak memasukkan status sosial yang lebih khusus daripada yang dinyatakan teks.
- issue: Makna יוֹרֵשׁ אֹתִי
  choice: “akan menjadi ahli warisku”
  alternative: “akan mewarisi aku” atau “akan mewarisi milikku”
  rationale: Teks secara harfiah menempatkan Abram sebagai objek, tetapi maksud pewarisan harta atau kedudukannya bersifat metonimis. Pilihan utama menghasilkan bahasa Indonesia yang jelas sambil tidak menentukan rincian hukum warisan yang tidak dijelaskan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Allah memakai “Engkau”. Pengulangan dua partikel penegas dibedakan menjadi “Sesungguhnya” dan “lihatlah” agar fungsi retoris masing-masing tetap terasa secara alami.
