  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: id
  text: Dan bangsa yang mereka layani[a] itu juga akan Kuhakimi, dan sesudah itu mereka akan keluar dengan membawa harta benda yang banyak[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang memperbudak mereka.” Kata kerja Ibrani secara harfiah berarti “melayani,” tetapi dalam konteks ini menunjuk kepada kerja paksa di bawah kekuasaan bangsa asing.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kekayaan besar” atau “dengan barang yang berlimpah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Namun ... itu pun
  rationale: Gabungan וְ dan גַם melanjutkan perkataan sekaligus menambahkan penekanan. Dalam konteks penderitaan keturunan Abram, “Namun ... itu pun” menyatakan kontras dan makna aditif secara alami dalam bahasa Indonesia.
- source_word: הַגּוֹי
  choice: bangsa ... itu
  rationale: גּוֹי menunjuk kepada bangsa asing yang dilayani oleh keturunan Abram. Bentuk “bangsa ... itu” jelas dan wajar dalam susunan kalimat Indonesia.
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: yang mereka layani
  rationale: Dalam bentuk qal, עבד secara harfiah berarti bekerja atau melayani. Terjemahan ini mempertahankan ungkapan sumber, sedangkan unsur perbudakan yang tersirat oleh konteks dijelaskan dalam catatan kaki.
- source_word: דָּן אָנֹכִי
  choice: akan Kuhakimi
  rationale: Partisipel דָּן bersama pronomina אָנֹכִי menyatakan tindakan orang pertama dengan penekanan dan, dalam konteks ini, mengacu ke masa depan. “Menghakimi” mempertahankan nuansa yudisial tanpa mempersempitnya menjadi hukuman saja.
- source_word: וְאַחֲרֵי כֵן
  choice: dan sesudah itu
  rationale: Ungkapan ini menandai urutan waktu secara langsung dan alami.
- source_word: יֵצְאוּ
  choice: mereka akan keluar
  rationale: יצא berarti keluar atau pergi keluar. “Akan keluar” mempertahankan gambaran keberangkatan dari negeri penindasan.
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: dengan membawa harta benda yang banyak
  rationale: רְכוּשׁ menunjuk kepada barang milik, harta benda, atau kekayaan. Ungkapan ini mempertahankan sifat konkret barang milik; “dengan membawa” menyampaikan fungsi preposisi ב secara idiomatis dalam konteks keluar dari suatu negeri.
theological_decisions:
- issue: Sifat tindakan Allah terhadap bangsa yang menindas
  choice: akan Kuhakimi
  alternative: akan Kuhukum
  rationale: Kata Ibrani דָּן memakai bahasa yudisial. “Menghakimi” mempertahankan cakupan moral dan hukum dalam teks tanpa menentukan terlebih dahulu bahwa maknanya hanya hasil berupa hukuman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk terikat “Kuhakimi” menjaga kelancaran dan penekanan tindakan ilahi. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
