  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: id
  text: Abram percaya kepada TUHAN[a], dan Dia memperhitungkan hal itu kepadanya sebagai kebenaran[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menaruh kepercayaan kepada TUHAN.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menganggap hal itu sebagai kebenaran” atau “mengakuinya sebagai kebenaran baginya.”'
    reason: lexical_alternative
  - marker: c
    text: Susunan bahasa Ibrani umumnya dipahami bahwa TUHAN memperhitungkan tindakan Abram percaya sebagai kebenaran baginya. Kemungkinan lain yang lebih kecil memahami Abram sebagai subjek kata “memperhitungkan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הֶאֱמִן
  choice: percaya
  rationale: Bentuk Hifil dari אמן di sini menyatakan menaruh kepercayaan kepada seseorang. “Percaya” alami dalam bahasa Indonesia, tetap dekat dengan bentuk verbal Ibrani, dan menjaga kaitannya dengan pemakaian ayat ini dalam bagian-bagian Alkitab selanjutnya.
- source_word: בַּ/יהוָה
  choice: kepada TUHAN
  rationale: Preposisi ב menandai pribadi yang menjadi sasaran kepercayaan. “Percaya kepada” merupakan ungkapan Indonesia yang alami; nama ilahi יהוה diterjemahkan dengan bentuk baku “TUHAN”.
- source_word: וַ/יַּחְשְׁבֶהָ
  choice: dan Dia memperhitungkan hal itu
  rationale: חשב dapat berarti menghitung, menganggap, atau memperhitungkan. “Memperhitungkan” mempertahankan nuansa penilaian/pencatatan tanpa menjadi terlalu teknis. “Hal itu” merujuk pada tindakan Abram percaya, tanpa memasukkan nomina “iman” yang tidak dinyatakan secara eksplisit.
- source_word: לּוֹ
  choice: kepadanya
  rationale: Preposisi ל dengan akhiran pronominal menunjukkan orang yang baginya atau ke dalam perhitungannya hal tersebut diperhitungkan. “Kepadanya” menjaga bentuk relasional teks.
- source_word: צְדָקָה
  choice: sebagai kebenaran
  rationale: צְדָקָה dalam konteks ini menunjuk pada kebenaran atau keadaan benar, bukan terutama keadilan distributif. “Sebagai kebenaran” adalah padanan yang mapan dan tetap cukup luas untuk mempertahankan bobot teologis istilah tersebut.
theological_decisions:
- issue: Subjek kata kerja “memperhitungkan”
  choice: TUHAN dipahami sebagai subjek; kata ganti “Dia” memperjelas pembacaan utama ini.
  alternative: Abram dapat dianggap sebagai subjek yang memperhitungkan Dia/hal itu sebagai kebenaran.
  rationale: Konteks dan penerimaan ayat ini dalam Alkitab mendukung TUHAN sebagai subjek. Karena bahasa Indonesia biasanya memerlukan subjek yang lebih jelas daripada bahasa Ibrani, “Dia” dipakai, sementara kemungkinan sintaksis yang lebih kecil dicatat dalam catatan kaki.
- issue: Rujukan akhiran feminin pada וַיַּחְשְׁבֶהָ
  choice: Diterjemahkan “hal itu,” merujuk pada tindakan Abram percaya.
  alternative: Akhiran itu dapat dipahami lebih luas sebagai respons atau kepercayaan Abram.
  rationale: Bahasa Ibrani dapat memakai akhiran feminin untuk menunjuk tindakan atau gagasan abstrak. “Hal itu” menjaga rujukan tetap terbuka dan tidak menambahkan kata “iman” ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Abram ditambahkan sebagai subjek eksplisit agar rujukan kata ganti alami bagi pembaca ayat tunggal. Kapitalisasi “Dia” dipakai untuk memperjelas bahwa TUHAN adalah subjek klausa kedua; catatan kaki mempertahankan ambiguitas sintaksis yang terbatas dalam bahasa Ibrani.
