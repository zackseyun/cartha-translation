  source_fidelity: 'Terjemahan menyampaikan semua unsur pokok teks Ibrani: penegasan יָדֹעַ תֵּדַע, keturunan Abram sebagai ger/pendatang di negeri yang bukan milik mereka, serta perbudakan, penindasan, dan durasi empat ratus tahun. Bentuk pasif pada klausa terakhir merupakan pergeseran sintaksis yang sah dalam bahasa Indonesia untuk menghindari ambiguitas pronomina; catatan kaki b secara tepat mencatat bentuk aktif jamak dalam bahasa Ibrani dan bahwa pelakunya tidak disebut dengan nomina dalam ayat ini.'
