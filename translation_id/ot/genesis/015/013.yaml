id: GEN.15.13
reference: Genesis 15:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: id
  text: Lalu Dia berkata kepada Abram, “Ketahuilah dengan pasti bahwa keturunanmu akan menjadi pendatang[a] di negeri yang bukan milik mereka. Mereka akan diperbudak dan ditindas[b] selama empat ratus tahun.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap.” Istilah Ibrani ini menunjuk pada orang yang tinggal di negeri yang bukan miliknya dan bukan sebagai warga asli.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka akan memperbudak mereka dan menindas mereka.” Pelaku tindakan itu tidak disebutkan dengan nomina dalam ayat ini; dalam konteks, yang dimaksud adalah pihak di negeri asing tersebut.
    reason: source_form_and_referent_ambiguity
  - marker: c
    text: Frasa “empat ratus tahun” terdapat pada akhir seluruh rangkaian dalam bahasa Ibrani. Karena itu, cakupannya dapat dipahami berkaitan dengan keseluruhan keadaan yang baru digambarkan, bukan harus dibatasi hanya pada tindakan penindasan.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: Ketahuilah dengan pasti
  rationale: Gabungan infinitif absolut dan bentuk finit dari ידע memberi penegasan. Ungkapan ini menyampaikan daya emfatisnya secara wajar dalam bahasa Indonesia modern.
- source_word: גֵר
  choice: pendatang
  rationale: גֵר menunjuk pada orang yang tinggal sebagai bukan warga asli di wilayah yang bukan miliknya. “Pendatang” mudah dipahami dan tidak terlalu dibebani kategori hukum modern.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע berbentuk tunggal kolektif. “Keturunanmu” merupakan padanan Indonesia yang alami dan dapat merujuk pada keseluruhan garis keturunan.
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: di negeri yang bukan milik mereka
  rationale: Terjemahan ini mempertahankan gagasan bahwa negeri tersebut bukan kepunyaan keturunan Abram tanpa menentukan negeri itu lebih jauh.
- source_word: וַעֲבָדוּם
  choice: Mereka akan diperbudak
  rationale: Kata kerja עבד dengan objek jamak di sini menyatakan pelayanan paksa atau perbudakan. Bentuk pasif Indonesia menghindari kerancuan dua rujukan “mereka” sambil mempertahankan keturunan Abram sebagai pihak yang diperbudak; pelaku tidak disebutkan secara eksplisit dalam terjemahan utama.
- source_word: וְעִנּוּ אֹתָם
  choice: dan ditindas
  rationale: Bentuk piel ענה menyatakan perlakuan yang merendahkan, menyengsarakan, atau menindas. “Ditindas” jelas dan alami dalam konteks kerja paksa.
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: selama empat ratus tahun
  rationale: Bahasa Indonesia lazim memakai “selama” untuk menyatakan durasi yang dalam bahasa Ibrani diletakkan tanpa preposisi eksplisit di akhir rangkaian.
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: Lalu Dia berkata kepada Abram
  rationale: Waw-konsekutif melanjutkan urutan narasi. “Lalu” menyatakan urutan itu secara alami, sedangkan “berkata” dekat dengan makna umum אמר.
theological_decisions:
- issue: Rujukan subjek jamak pada וַעֲבָדוּם וְעִנּוּ אֹתָם
  choice: 'Klausa utama diterjemahkan secara pasif: keturunan Abram diperbudak dan ditindas.'
  alternative: “Mereka akan memperbudak dan menindas mereka,” dengan subjek jamak yang tidak dinyatakan secara khusus tetapi dipahami sebagai para penghuni negeri asing itu.
  rationale: Teks Ibrani memakai verba aktif jamak dan sufiks objek jamak, tetapi tidak menyebut nomina bagi pelakunya. Bentuk pasif menghasilkan bahasa Indonesia yang jelas tanpa menambahkan identitas pelaku yang tidak dinyatakan dalam ayat.
- issue: Cakupan masa empat ratus tahun
  choice: Frasa durasi diletakkan pada akhir keseluruhan pernyataan sebagaimana dalam bahasa Ibrani.
  alternative: Membatasi empat ratus tahun hanya pada masa penindasan, atau secara eksplisit memperluasnya kepada seluruh masa tinggal sebagai pendatang, perbudakan, dan penindasan.
  rationale: Posisi akhir frasa durasi dapat menimbulkan pertanyaan tentang cakupannya. Terjemahan tidak menambahkan penjelasan yang akan memutuskan persoalan sintaksis dan kronologis tersebut secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa bentuk arkais. “Dia” dipakai bagi pembicara ilahi sesuai konteks, tetapi verba umum “berkata” dipertahankan agar dekat dengan אמר. Bentuk pasif dipilih demi kejernihan rujukan pronomina, dengan bentuk aktif Ibrani dijelaskan dalam catatan kaki.
