base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/019.yaml
  text: the Kenites[a], the Kenizzites, and the Kadmonites—
translation:
  language: id
  text: orang Keni, orang Kenas, dan orang Kadmon[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani קַדְמֹנִי (qadmoni) berkaitan dengan “timur” atau “sebelah timur”; di sini diterjemahkan sebagai nama bangsa, “orang Kadmon”, karena muncul dalam daftar bangsa-bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung Ibrani ini tidak memiliki padanan tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam daftar bangsa yang menjadi objek pada kalimat yang lebih besar.
- source_word: הַקֵּינִי
  choice: orang Keni
  rationale: Etnonim berartikel ini dipakai secara kolektif untuk suatu kelompok bangsa. Bentuk baku dan alami dalam bahasa Indonesia ialah “orang Keni”.
- source_word: וְאֶת
  choice: '[tidak dinyatakan secara terpisah]'
  rationale: Konjungsi dan penanda objek berada di tengah rangkaian daftar; dalam bahasa Indonesia, penghubung cukup dinyatakan sebelum unsur terakhir agar daftarnya alami.
- source_word: הַקְּנִזִּי
  choice: orang Kenas
  rationale: Etnonim kolektif dalam daftar wilayah ini diterjemahkan dengan bentuk nama bangsa yang lazim dalam bahasa Indonesia.
- source_word: וְאֵת
  choice: dan
  rationale: Konjungsi menghubungkan unsur terakhir dalam daftar, sedangkan penanda objek tidak diterjemahkan secara tersendiri.
- source_word: הַקַּדְמֹנִי
  choice: orang Kadmon
  rationale: Walaupun kata ini berkaitan dengan arah timur, kesejajarannya dengan nama-nama bangsa lain menunjukkan bahwa di sini kata tersebut berfungsi sebagai etnonim. Transliterasi mempertahankan nuansa nama diri tanpa menutup alternatif leksikalnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pola “orang + nama bangsa” dipakai secara konsisten untuk etnonim kolektif. Tanda pisah dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut.
