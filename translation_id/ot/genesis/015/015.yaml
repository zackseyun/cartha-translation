  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: id
  text: Adapun engkau[a], engkau akan pergi kepada nenek moyangmu dalam damai; engkau akan dikuburkan pada masa tua yang baik.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Dan engkau.” Bentuk ini menandai peralihan dari keturunan Abram kepada Abram sendiri dan dapat juga diterjemahkan, “Adapun engkau.”
    reason: discourse_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Tetapi engkau
  rationale: Konjungsi yang diikuti pronomina mandiri menandai peralihan topik sekaligus kontras antara keturunan Abram dan Abram sendiri. 'Tetapi engkau' menyampaikan penekanan itu secara alami dan tetap dekat dengan bentuk Ibrani.
- source_word: תָּבוֹא
  choice: akan pergi
  rationale: Secara dasar verba ini berarti 'datang/masuk', tetapi bersama frasa 'kepada nenek moyangmu' merupakan ungkapan tentang kematian. Dalam bahasa Indonesia, 'pergi kepada' lebih alami dalam konteks ini daripada 'datang kepada'.
- source_word: אֶל אֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: '''Nenek moyang'' adalah padanan Indonesia yang alami bagi bentuk jamak ''ayah-ayahmu'' ketika yang dimaksud ialah generasi terdahulu. Pilihan ini mempertahankan ungkapan kekeluargaan tanpa memberi kesan bahwa hanya ayah kandung Abram yang dimaksud.'
- source_word: בְּשָׁלוֹם
  choice: dalam damai
  rationale: שָׁלוֹם mencakup damai, keutuhan, dan keadaan sejahtera. 'Dalam damai' ringkas, bermartabat, dan tidak membatasi maknanya hanya pada cara kematian.
- source_word: תִּקָּבֵר
  choice: akan dikuburkan
  rationale: 'Bentuk Nifal dari קבר menyatakan tindakan pasif: Abram akan dikuburkan. Padanan ini lugas dan alami dalam bahasa Indonesia modern.'
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: pada usia lanjut yang baik
  rationale: Frasa ini secara harfiah menghubungkan uban/usia lanjut dengan sifat 'baik'. Terjemahan ini mempertahankan unsur usia lanjut serta penilaian positifnya tanpa menggantinya dengan ungkapan yang terlalu bebas.
theological_decisions:
- issue: Makna 'pergi kepada nenek moyangmu'
  choice: Dipertahankan sebagai ungkapan tentang kematian Abram dan bergabung dengan generasi-generasi terdahulu, tanpa merinci keadaan sesudah kematian.
  alternative: Menafsirkannya hanya sebagai penguburan bersama leluhur, atau sebagai pernyataan tegas tentang persekutuan sadar dengan leluhur setelah kematian.
  rationale: Abram tidak dikuburkan bersama leluhur dekatnya, sehingga ungkapan ini lebih luas daripada lokasi makam. Namun, ayat ini sendiri tidak menjelaskan secara terperinci keadaan orang mati; karena itu terjemahan mempertahankan gambaran sumber tanpa memasukkan doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipilih untuk sapaan tunggal langsung dalam narasi ilahi. Struktur dua klausa dan ungkapan 'dalam damai' dipertahankan agar irama serta ketegangan makna teks Ibrani tetap terasa.
