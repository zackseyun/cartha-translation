id: GEN.15.18
reference: Genesis 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: id
  text: Pada hari itu Yahweh mengikat perjanjian dengan Abram[a], seraya berfirman, “Kepada keturunanmu telah Kuberikan negeri ini, dari Sungai Mesir[b] sampai ke sungai besar itu, yaitu Sungai Efrat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “memotong perjanjian”, sebuah ungkapan yang berarti mengikat atau membuat perjanjian dan tampaknya berkaitan dengan ritual pemotongan dalam bagian ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “wadi Mesir” atau “sungai kecil Mesir”. Teks Ibrani berbunyi “Sungai Mesir”, tetapi lokasi geografis yang dimaksud masih diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu ini menunjuk pada peristiwa tertentu dan diterjemahkan secara alami serta dekat dengan bentuk Ibrani.
- source_word: כָּרַת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani harfiahnya berarti ‘memotong perjanjian’. ‘Mengikat perjanjian’ menyampaikan maknanya secara wajar dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki karena berkaitan dengan tindakan ritual dalam konteks sekitar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֶת אַבְרָם
  choice: dengan Abram
  rationale: Walaupun Abram secara tata bahasa ditandai sebagai objek langsung dari idiom Ibrani, bahasa Indonesia secara alami menyatakan bahwa perjanjian diikat ‘dengan’ seseorang.
- source_word: לֵאמֹר
  choice: seraya berfirman
  rationale: Partisip pengantar ujaran diterjemahkan secara alami; ‘berfirman’ sesuai untuk ujaran langsung Yahweh tanpa mengubah isi pernyataan.
- source_word: לְזַרְעֲךָ
  choice: kepada keturunanmu
  rationale: ‘Keturunan’ mempertahankan pengertian kolektif זֶרַע dan merupakan ungkapan Indonesia yang alami.
- source_word: נָתַתִּי
  choice: telah Kuberikan
  rationale: Bentuk perfektum menyajikan pemberian dalam deklarasi perjanjian sebagai tindakan yang pasti dan efektif, tanpa menghapus ketegangan antara janji dan penggenapan historisnya.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Dalam konteks batas wilayah yang dijanjikan, ‘negeri’ menyampaikan arti teritorial secara jelas.
- source_word: מִנְּהַר מִצְרַיִם
  choice: dari Sungai Mesir
  rationale: נָהָר biasanya berarti ‘sungai’. Identifikasi geografis yang diperdebatkan dan terjemahan alternatif dicatat dalam catatan kaki.
- source_word: עַד הַנָּהָר הַגָּדֹל
  choice: sampai ke sungai besar itu
  rationale: Terjemahan ini mempertahankan fungsi עַד sebagai penanda batas dan artikel tertentu pada ‘sungai besar’.
- source_word: נְהַר פְּרָת
  choice: yaitu Sungai Efrat
  rationale: Nama sungai ini menjelaskan secara aposisional sungai besar yang baru disebut; ‘yaitu’ membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk ‘Yahweh’ mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Aspek pemberian perjanjian dalam נָתַתִּי
  choice: telah Kuberikan
  alternative: Kuberikan; Aku memberikan; telah Aku berikan
  rationale: Perfektum dalam deklarasi ilahi dapat menyatakan pemberian yang dipastikan oleh perjanjian. ‘Telah Kuberikan’ menjaga daya deklaratif itu tanpa menyatakan lebih jauh daripada bentuk sumber mengenai tahapan penggenapan historisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan deklarasi perjanjian yang padat, sementara ‘seraya berfirman’ dan ‘yaitu’ dipakai agar hubungan antarklausa serta aposisi nama sungai terdengar alami.
