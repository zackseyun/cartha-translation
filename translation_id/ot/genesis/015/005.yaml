base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: id
  text: Kemudian Ia membawanya ke luar dan berkata, “Pandanglah ke langit dan hitunglah bintang-bintang, jika engkau sanggup menghitungnya.” Lalu Ia berkata kepadanya, “Demikianlah keturunanmu kelak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: Ia membawanya ke luar
  rationale: Bentuk Hifil dari יצא menyatakan tindakan menyebabkan seseorang keluar. Ungkapan ini mempertahankan makna kausatif dan arah gerak secara wajar dalam bahasa Indonesia.
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: Pandanglah ke langit
  rationale: Kata kerja imperatif הבט berarti ‘pandanglah’, sedangkan partikel נא memberi nuansa ajakan atau pelembutan. Akhiran -lah menyampaikan nuansa itu secara alami; ‘ke langit’ mencerminkan bentuk direktif pada השׁמים.
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: dan hitunglah bintang-bintang
  rationale: ספר dalam konteks ini berarti menghitung satu per satu, dan bentuk ulang ‘bintang-bintang’ merupakan padanan jamak yang alami.
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: jika engkau sanggup menghitungnya
  rationale: Klausa bersyarat ini menekankan kemampuan. ‘Sanggup’ mempertahankan penekanan tersebut dengan bahasa yang jelas dan wajar.
- source_word: כֹּה יִהְיֶה
  choice: Demikianlah kelak
  rationale: כֹּה memperkenalkan perbandingan, sedangkan bentuk yiqtol יִהְיֶה menunjuk pada keadaan yang akan datang. ‘Demikianlah kelak’ ringkas, alami, dan tetap dekat dengan susunan Ibrani.
- source_word: זַרְעֶךָ
  choice: keturunanmu
  rationale: זֶרַע berbentuk tunggal tetapi lazim berfungsi sebagai nomina kolektif. ‘Keturunanmu’ alami dalam bahasa Indonesia dan tidak memaksakan apakah acuannya dipahami sebagai satu atau banyak.
theological_decisions:
- issue: Makna tunggal atau kolektif dari זַרְעֶךָ dalam janji kepada Abram
  choice: keturunanmu
  alternative: benihmu
  rationale: ‘Keturunanmu’ menyampaikan makna kolektif yang lazim tanpa secara tegas menjamakkan bentuk Ibraninya. Catatan kaki mempertahankan padanan harfiah ‘benihmu’ dan menjelaskan ketegangan antara bentuk tunggal dan fungsi kolektif, sehingga kemungkinan gema teologis selanjutnya tidak diselesaikan secara prematur.
- issue: Identitas pelaku dan penerima tindakan yang dinyatakan dengan pronomina
  choice: Ia membawanya ... Ia berkata kepadanya
  alternative: TUHAN membawa Abram ... TUHAN berkata kepada Abram
  rationale: Teks Ibrani ayat ini memakai pronomina, bukan nama atau gelar. Terjemahan mempertahankan bentuk pronominal dan bergantung pada konteks sebelumnya untuk identitas acuannya, alih-alih menambahkan nama yang tidak tertulis dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ia’ dan ‘engkau’ mempertahankan corak naratif yang khidmat tanpa menjadi arkais. Bentuk ‘-lah’ dipakai untuk menyampaikan imperatif yang diperhalus oleh נא. Ejaan ‘ke luar’ dipertahankan sebagai frasa preposisional yang menyatakan arah.
