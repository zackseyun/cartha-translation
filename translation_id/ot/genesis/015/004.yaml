  terminology: “Firman TUHAN” adalah padanan yang mapan dan konsisten untuk דְבַר יְהוָה dalam register Alkitab bahasa Indonesia. “Orang ini” mempertahankan kata tunjuk זֶה tanpa memasukkan nama yang tidak ada dalam ayat. “Ahli waris” tepat untuk verba יִירָשְׁךָ dalam konteks ini.
