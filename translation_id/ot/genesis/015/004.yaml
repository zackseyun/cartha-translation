  source_fidelity: 'Terjemahan menyampaikan seluruh pokok isi teks Ibrani dengan tepat: firman TUHAN datang kepada Abram, orang yang dirujuk oleh “orang ini” bukan ahli warisnya, dan ahli waris itu ialah seorang yang berasal dari tubuhnya sendiri. “Lalu” merupakan pengalihan naratif yang wajar bagi וְהִנֵּה, walaupun nuansa penanda perhatian itu tidak dieksplisitkan secara harfiah.'
