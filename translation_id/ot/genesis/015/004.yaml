  text: וְ/הִנֵּ֨ה דְבַר יְהוָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֥א יִֽירָשְׁ/ךָ֖ זֶ֑ה כִּי אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִ/מֵּעֶ֔י/ךָ ה֖וּא יִֽירָשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: id
  text: Lalu, firman TUHAN datang kepadanya, “Orang ini tidak akan menjadi ahli warismu. Sebaliknya, orang yang berasal dari tubuhmu sendirilah yang akan menjadi ahli warismu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lalu
  rationale: Dalam konteks naratif, ungkapan ini menandai datangnya firman TUHAN secara langsung dan wajar; 'Lalu' mempertahankan alur tanpa ungkapan 'lihatlah' yang terasa kaku dalam bahasa Indonesia modern.
- source_word: דְבַר יְהוָה
  choice: firman TUHAN
  rationale: Padanan baku, bermartabat, dan sesuai konteks pewahyuan ilahi; nama ilahi ditampilkan sebagai TUHAN.
- source_word: זֶה
  choice: Orang ini
  rationale: Kata penunjuk maskulin tunggal merujuk kepada orang yang baru disebut, yakni Eliezer; penambahan 'orang' membuat rujukannya jelas tanpa menyebut nama yang tidak terdapat dalam ayat ini.
- source_word: יִירָשְׁךָ
  choice: menjadi ahli warismu
  rationale: Dalam konteks Abram yang membicarakan pewaris rumah tangganya, verba 'mewarisi engkau' secara idiomatis berarti menjadi ahli warisnya.
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: orang yang berasal dari tubuhmu sendiri
  rationale: Secara harfiah menunjuk kepada seseorang yang keluar dari bagian dalam tubuh Abram, yaitu keturunan biologisnya; ungkapan ini alami sekaligus mempertahankan citra jasmaniah sumber.
- source_word: הוּא יִירָשֶׁךָ
  choice: dialah yang akan menjadi ahli warismu
  rationale: Pronomina yang dinyatakan secara eksplisit bersifat menegaskan; bentuk 'dialah' mempertahankan fokus kontras tersebut.
theological_decisions:
- issue: Identitas ahli waris yang dijanjikan
  choice: orang yang berasal dari tubuhmu sendiri
  alternative: anak kandungmu sendiri
  rationale: Pilihan utama menjaga gambaran tubuh dalam teks Ibrani dan tidak mempersempitnya lebih jauh daripada yang dinyatakan ayat ini, sambil tetap jelas bahwa yang dimaksud adalah keturunan biologis Abram.
- issue: Rujukan זֶה kepada pelayan Abram
  choice: Orang ini
  alternative: Eliezer
  rationale: Nama Eliezer tidak muncul dalam ayat 4; mempertahankan kata penunjuk menghindari penambahan identifikasi eksplisit meskipun konteks ayat sebelumnya mendukungnya.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang bermartabat. Susunan kontras 'tidak ... sebaliknya ... dialah' mempertahankan penegasan teks Ibrani tanpa terdengar terlalu harfiah.
