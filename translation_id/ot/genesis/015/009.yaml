  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: id
  text: Lalu Ia berkata kepadanya, “Ambillah bagi-Ku[a] seekor sapi betina berumur tiga tahun[b], seekor kambing betina berumur tiga tahun, seekor domba jantan berumur tiga tahun, seekor burung tekukur, dan seekor anak burung merpati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ambillah untuk-Ku.” Dalam konteks ini, maksudnya ialah memperoleh dan menyediakan hewan-hewan tersebut bagi upacara perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diulang untuk ketiga hewan itu secara tradisional dipahami di sini sebagai penunjuk umur tiga tahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu Ia berkata kepadanya
  rationale: Bentuk naratif wayyiqtol dilukiskan secara alami dengan ‘Lalu’, sedangkan אֵלָיו diterjemahkan langsung sebagai ‘kepadanya’. Kata ganti ‘Ia’ merujuk kepada Allah sesuai konteks tanpa mengganti rujukan eksplisit teks.
- source_word: קְחָה לִי
  choice: Ambillah bagi-Ku
  rationale: Mempertahankan makna harfiah imperatif ‘ambillah untuk/bagi-Ku’. Dalam konteks, perintah ini berarti memperoleh dan menyediakan hewan-hewan bagi upacara perjanjian.
- source_word: עֶגְלָה
  choice: sapi betina
  rationale: Menunjuk kepada lembu muda berjenis kelamin betina; ‘sapi betina’ lebih mudah dipahami pembaca Indonesia masa kini daripada istilah teknis yang jarang digunakan.
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: berumur tiga tahun
  rationale: Dalam daftar hewan ini, bentuk tersebut secara tradisional dan kontekstual dipahami sebagai keterangan umur. Frasa yang sama diulang pada ketiga hewan sebagaimana dalam bahasa Ibrani.
- source_word: עֵז
  choice: kambing betina
  rationale: Nomina feminin ini menunjuk kepada kambing betina; jenis kelaminnya dinyatakan agar pembedaan dalam daftar tetap jelas.
- source_word: אַיִל
  choice: domba jantan
  rationale: Padanan Indonesia yang jelas dan lazim untuk domba jantan dewasa, khususnya dalam konteks persembahan.
- source_word: תֹר
  choice: burung tekukur
  rationale: Menunjuk kepada jenis burung tekukur, bukan sekadar burung merpati secara umum.
- source_word: גוֹזָל
  choice: anak burung merpati
  rationale: Dalam pasangan persembahan bersama תֹר, istilah ini secara kontekstual dipahami sebagai merpati muda; terjemahan ini lebih tepat daripada ‘anak burung’ yang bersifat umum.
