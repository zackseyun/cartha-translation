  to: Lalu Abram membawa semua itu kepada-Nya,[a] membelahnya menjadi dua, dan meletakkan setiap belahan berhadapan dengan belahan yang lain;[b] tetapi burung-burung itu tidak dibelahnya.
  rationale: Mengganti “pasangannya” dengan “belahan yang lain” agar relasi spasial antara dua bagian hewan tersampaikan tanpa menambahkan nuansa pasangan yang tidak diperlukan oleh Ibrani. Tidak ada perubahan makna lain maupun perubahan pada jangkar catatan kaki.
