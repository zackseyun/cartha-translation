  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: id
  text: Lalu Abram membawa semua itu kepada-Nya,[a] membelahnya menjadi dua, dan meletakkan setiap belahan berhadapan dengan belahan yang lain;[b] tetapi burung-burung itu tidak dibelahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengambil semua itu untuk dirinya sendiri.”'
    reason: לוֹ dapat dipahami sebagai datif yang merujuk kepada Allah atau secara refleksif kepada Abram; konteks mendukung terjemahan utama.
  - marker: b
    text: 'Secara harfiah: “meletakkan masing-masing potongannya berhadapan dengan sesamanya.”'
    reason: Catatan mempertahankan bentuk idiom distributif Ibrani dan pilihan leksikal yang lebih harfiah.
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: Lalu Abram membawa semua itu kepada-Nya
  rationale: Dalam konteks perintah pada ayat 9, לוֹ paling wajar merujuk kepada Allah sebagai penerima, sedangkan לקח dapat bermakna mengambil atau membawa. Nama Abram dinyatakan agar rujukan pelaku jelas dalam bahasa Indonesia.
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: membelahnya menjadi dua
  rationale: בתר menunjuk pada pembelahan hewan, dan בַּתָּוֶךְ menyatakan pembelahan pada bagian tengah; ungkapan Indonesia ini alami serta mempertahankan gambaran konkret upacara tersebut.
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: meletakkan setiap belahan berhadapan dengan pasangannya
  rationale: Ungkapan distributif אִישׁ ... רֵעֵהוּ berarti masing-masing ... pasangannya atau yang lain; 'setiap belahan' menjelaskan bahwa yang ditata adalah kedua bagian dari tiap hewan.
- source_word: וְאֶת הַצִּפֹּר לֹא בָתָר
  choice: tetapi burung-burung itu tidak dibelahnya
  rationale: הַצִּפֹּר berbentuk tunggal kolektif dan merujuk kepada dua burung pada ayat sebelumnya. Bentuk pasif berpelaku dalam bahasa Indonesia mempertahankan penekanan pada burung sebagai objek yang dikecualikan.
theological_decisions:
- issue: Bahasa upacara pengikatan perjanjian
  choice: Tindakan diterjemahkan secara konkret sebagai pembelahan dan penataan bagian-bagian hewan.
  alternative: Menambahkan penjelasan eksplisit bahwa tindakan itu merupakan upacara pengikatan perjanjian.
  rationale: Konteks perjanjian penting, tetapi ayat ini sendiri hanya menggambarkan tindakannya. Terjemahan tidak memasukkan penafsiran teologis tambahan ke dalam teks utama.
- issue: Rujukan לוֹ
  choice: kepada-Nya, yakni kepada Allah
  alternative: untuk dirinya sendiri, yakni untuk Abram
  rationale: Secara gramatikal nuansa benefaktif atau refleksif mungkin, tetapi konteks ayat 9—Allah memerintahkan Abram membawa hewan-hewan kepada-Nya—lebih kuat mendukung rujukan kepada Allah. Alternatif dicatat untuk menjaga ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kepada-Nya' memakai huruf kapital sesuai konvensi Indonesia untuk pronomina yang merujuk kepada Allah. Susunan kalimat dibuat lancar tanpa menghilangkan urutan tindakan dalam narasi Ibrani.
