  naturalness: Kalimatnya baku, jelas, dan mengalir baik. “Berhadapan dengan belahan yang lain” lebih alami dan lebih tepat daripada “berhadapan dengan pasangannya” dalam konteks potongan hewan.
  terminology: “Membelahnya menjadi dua” dan “burung-burung itu tidak dibelahnya” menyampaikan tindakan בָּתַר secara konkret dan sesuai register. Kapitalisasi “-Nya” selaras dengan konvensi Indonesia bagi rujukan kepada Allah.
