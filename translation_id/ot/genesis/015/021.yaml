  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: id
  text: dan orang Amori, orang Kanaan, orang Girgasi, dan orang Yebus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: dan / serta
  rationale: וְ melanjutkan daftar, sedangkan אֶת menandai objek langsung tentu. Dalam bahasa Indonesia, penanda objek itu tidak perlu diterjemahkan; konjungsi ditampilkan secara alami dengan “dan”, lalu “serta” pada unsur terakhir untuk menutup daftar yang berlanjut dari ayat sebelumnya.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal Ibrani berfungsi sebagai nama kelompok etnis secara kolektif. Ungkapan Indonesia “orang Amori” secara alami dapat menunjuk kelompok tersebut.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Etnonim tunggal kolektif diterjemahkan dengan pola baku dan alami dalam bahasa Indonesia, yaitu “orang Kanaan”.
- source_word: הַגִּרְגָּשִׁי
  choice: orang Girgasi
  rationale: Nama kelompok etnis ditransliterasikan dalam bentuk Indonesia yang lazim dan didahului “orang” untuk menyatakan suatu bangsa atau kelompok.
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Nama kelompok etnis diterjemahkan dengan bentuk Indonesia yang lazim, “orang Yebus”, dengan nilai kolektif tetap dipertahankan.
