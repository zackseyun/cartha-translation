  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: id
  text: Lalu Dia berkata kepadanya, “Akulah Yahweh, yang membawa engkau keluar dari Ur-Kasdim untuk memberikan negeri ini kepadamu supaya engkau memilikinya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya engkau mewarisinya” atau “supaya engkau mengambilnya menjadi milikmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu Dia berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan אֵלָיו menyatakan pihak yang diajak bicara. 'Lalu' wajar dalam narasi Indonesia tanpa menambahkan hubungan waktu yang berlebihan.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Klausa nominal Ibrani menyatakan identitas dengan penekanan pada pembicara. 'Akulah' menyampaikan bentuk אֲנִי secara alami, dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: אֲשֶׁר הוֹצֵאתִיךָ
  choice: yang membawa engkau keluar
  rationale: אֲשֶׁר memperkenalkan klausa relatif, dan bentuk hifil הוֹצֵאתִיךָ berarti menyebabkan Abram keluar. 'Membawa ... keluar' mempertahankan daya ungkap verba tersebut.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: dari Ur-Kasdim
  rationale: Ungkapan ini menunjuk kota Ur yang dikaitkan dengan orang Kasdim. Bentuk 'Ur-Kasdim' ringkas, lazim, dan jelas dalam bahasa Indonesia Alkitabiah modern.
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: untuk memberikan negeri ini kepadamu
  rationale: Infinitif dengan ל menyatakan tujuan. Susunan Indonesia ini alami dan mempertahankan Allah sebagai pemberi serta Abram sebagai penerima.
- source_word: לְרִשְׁתָּהּ
  choice: supaya engkau memilikinya
  rationale: Verba ירשׁ dapat berarti memiliki, mewarisi, atau mengambil alih. Dalam konteks pemberian negeri kepada Abram, 'memilikinya' mempertahankan cakupan yang luas tanpa memaksakan nuansa warisan filial.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama itu secara langsung dan membedakannya dari gelar umum.
- issue: Nuansa לְרִשְׁתָּהּ dalam janji negeri
  choice: supaya engkau memilikinya
  alternative: supaya engkau mewarisinya / mengambilnya menjadi milikmu
  rationale: Konteks menekankan penerimaan dan penguasaan negeri yang Allah berikan. Pilihan utama tidak mempersempit makna menjadi warisan akibat kematian dan tidak menonjolkan penaklukan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai dalam tuturan ilahi kepada seorang individu; 'Dia' dikapitalisasi untuk memperjelas bahwa subjeknya adalah Yahweh. 'Negeri' dipilih untuk הָאָרֶץ dalam konteks wilayah yang dijanjikan.
