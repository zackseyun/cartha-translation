id: GEN.15.1
reference: Genesis 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: id
  text: 'Sesudah semuanya itu, firman Yahweh datang kepada Abram dalam suatu penglihatan, berfirman: “Jangan takut, Abram. Akulah perisai bagimu; upahmu akan sangat besar.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Akulah perisaimu, upahmu yang sangat besar.” Klausa terakhir juga dapat diterjemahkan, “upahmu sangat besar.”
    reason: Teks Ibrani terdiri atas klausa-klausa nominal tanpa kopula eksplisit. Karena itu, "upahmu yang sangat besar" dapat dipahami sebagai predikasi kedua tentang Abram atau, sebagai alternatif, sebagai sebutan bagi Yahweh; nilai waktunya juga tidak dinyatakan secara eksplisit.
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah semuanya itu
  rationale: Ungkapan waktu ini menunjuk secara luas pada kejadian-kejadian dalam kisah sebelumnya tanpa membatasinya hanya pada perkataan atau peristiwa tertentu.
- source_word: דְבַר יְהוָה
  choice: firman Yahweh
  rationale: Mempertahankan ungkapan pewahyuan yang khas sekaligus memakai padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan untuk mempertahankan nama perjanjian tersebut.
- source_word: הָיָה ... אֶל אַבְרָם
  choice: datang kepada Abram
  rationale: Ini padanan Indonesia yang wajar bagi konstruksi bahwa firman ilahi terjadi atau sampai kepada seseorang.
- source_word: בַּמַּחֲזֶה
  choice: dalam suatu penglihatan
  rationale: Nomina ini menunjuk pada penyataan melalui penglihatan; kata 'suatu' terdengar alami ketika penglihatan itu pertama kali diperkenalkan.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Secara alami memperkenalkan kutipan langsung dalam bahasa Indonesia tanpa mempertahankan bentuk 'berkata' yang kaku setelah 'firman ... datang'.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Padanan langsung, jelas, dan lazim bagi larangan dalam bahasa Ibrani.
- source_word: מָגֵן לָךְ
  choice: perisai bagimu
  rationale: Mempertahankan konstruksi Ibrani yang secara harfiah menyatakan 'perisai bagi/untukmu', bukan langsung mengubahnya menjadi bentuk posesif.
- source_word: שְׂכָרְךָ
  choice: upahmu
  rationale: שָׂכָר dapat berarti upah, ganjaran, atau imbalan. 'Upah' mempertahankan kaitan leksikal dengan penolakan Abram atas harta rampasan dalam konteks sebelumnya, tanpa menutup nuansa ganjaran.
- source_word: הַרְבֵּה מְאֹד
  choice: akan sangat besar
  rationale: Klausa Ibrani tidak memiliki kopula eksplisit. Bentuk mendatang disuplai secara wajar berdasarkan daya janji dalam konteks, sementara 'sangat besar' mencerminkan intensifikasi tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Hubungan antara ‘perisai’ dan ‘upah’ dalam אָנֹכִי מָגֵן לָךְ שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: 'Dua pernyataan: Allah adalah perisai bagi Abram, dan upah Abram akan sangat besar'
  alternative: Allah sendiri adalah perisai Abram sekaligus upahnya yang sangat besar
  rationale: Susunan Masoret paling langsung memungkinkan dua predikasi, tetapi karena tidak ada kopula dan tanda baca merupakan tradisi kemudian, pembacaan bahwa Allah adalah 'upah yang sangat besar' tetap mungkin dan dicatat dalam catatan kaki.
- issue: Nilai waktu klausa nominal שְׂכָרְךָ הַרְבֵּה מְאֹד
  choice: akan sangat besar
  alternative: sangat besar
  rationale: Bahasa Ibrani tidak menyatakan kopula atau waktu secara eksplisit. Bentuk mendatang sesuai dengan konteks janji, tetapi bentuk kini tetap mungkin dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Bentuk 'Akulah' mempertahankan penekanan pada אָנֹכִי, sedangkan struktur kalimat dibuat alami bagi pembaca umum. Catatan kaki mempertahankan ambiguitas sintaksis dan temporal yang nyata dalam teks Ibrani.
