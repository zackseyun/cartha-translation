  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: id
  text: Lalu ia berkata, “Ya Tuhan Yahweh, bagaimana aku dapat mengetahui bahwa aku akan memiliki tanah ini[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mewarisi tanah ini.”
    reason: ירשׁ dapat berarti “memiliki” maupun “mewarisi”; kedua nuansa tersebut sesuai dengan konteks janji tanah.
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi. “Lalu” menyampaikan urutan peristiwa secara alami tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: אֲדֹנָי יֱהוִה
  choice: Ya Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar sapaan “Tuhan,” sedangkan יֱהוִה adalah nama ilahi Yahweh. Partikel “Ya” membuat bentuk sapaan itu wajar dan jelas dalam bahasa Indonesia.
- source_word: בַּמָּה
  choice: bagaimana
  rationale: Secara harfiah berarti “dengan apa,” tetapi dalam konteks ini menanyakan sarana atau tanda yang memungkinkan Abram mengetahui kepastian janji tersebut. “Bagaimana” merupakan ungkapan Indonesia yang paling alami.
- source_word: אֵדַע
  choice: aku dapat mengetahui
  rationale: Imperfek Qal orang pertama tunggal dari ידע berada dalam pertanyaan tentang cara memperoleh kepastian. “Dapat mengetahui” menyampaikan maksud itu secara alami tanpa mengubahnya menjadi pernyataan keraguan mutlak.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang hendak diketahui Abram, sehingga “bahwa” adalah padanan langsung dan alami.
- source_word: אִירָשֶׁנָּה
  choice: aku akan memiliki negeri ini
  rationale: Kata ירשׁ dapat berarti mewarisi, memiliki, atau mengambil alih sebagai milik. Dalam konteks janji tanah pada ayat sebelumnya, “memiliki negeri ini” menyatakan penguasaan nyata; objek pronominal dijelaskan sebagai “negeri ini” agar acuannya terang dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi dalam sapaan אֲדֹנָי יֱהוִה
  choice: Ya Tuhan Yahweh
  alternative: Ya Tuhan ALLAH
  rationale: Terjemahan ini membedakan gelar אֲדֹנָי dari nama perjanjian יֱהוִה dan merepresentasikan keduanya secara langsung tanpa meleburkannya.
- issue: Nuansa ירשׁ dalam janji mengenai negeri
  choice: memiliki negeri ini
  alternative: mewarisi negeri ini
  rationale: “Memiliki” paling jelas menyatakan bahwa negeri itu akan menjadi kepunyaan Abram, sedangkan “mewarisi” tetap merupakan kemungkinan leksikal yang sah dan dipertahankan dalam catatan kaki tanpa memaksakan nuansa tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Tuhan Yahweh” dipilih agar hubungan antara gelar dan nama ilahi jelas. Acuan pronomina feminin tunggal pada אִירָשֶׁנָּה dinyatakan sebagai “negeri ini” berdasarkan ayat sebelumnya untuk menghindari pronomina Indonesia yang kabur.
