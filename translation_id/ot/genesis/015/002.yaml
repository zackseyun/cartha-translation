  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤/י יֱהוִה֙ מַה תִּתֶּן לִ֔/י וְ/אָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּ/בֶן מֶ֣שֶׁק בֵּיתִ֔/י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: id
  text: Namun Abram berkata[a], “Tuhan Yahweh, apa yang akan Kauberikan kepadaku, sedangkan aku hidup tanpa anak dan Eliezer dari Damsyik adalah ahli waris rumah tanggaku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir ayat ini berbunyi kurang lebih, “anak mesyeq rumahku adalah Eliezer dari Damsyik.” Ungkapan Ibraninya tidak lazim; mungkin berarti “pengurus rumahku,” “pemilik rumahku,” atau orang yang akan menjadi ahli waris rumah tangga Abram.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw konsekutif meneruskan narasi, tetapi perkataan Abram menyatakan keberatan atau kegelisahan sebagai tanggapan terhadap janji sebelumnya; 'Namun' mengungkapkan peralihan wacana itu secara alami.
- source_word: אֲדֹנָי יֱהוִה
  choice: Tuhan Yahweh
  rationale: אֲדֹנָי adalah gelar 'Tuhan/Penguasa', sedangkan יֱהוִה adalah nama ilahi. Bentuk ini mempertahankan kedua unsur tanpa menghasilkan pengulangan 'Tuhan TUHAN'.
- source_word: מַה תִּתֶּן לִי
  choice: apakah yang akan Kauberikan kepadaku
  rationale: Bentuk imperfek secara alami menunjuk pada pemberian yang akan datang; susunan ini jelas dan tetap bernada luhur dalam bahasa Indonesia modern.
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: Aku tetap tidak mempunyai anak
  rationale: Secara harfiah ungkapan ini menggambarkan Abram 'berjalan/pergi tanpa anak', yaitu menjalani hidup menuju akhir hayat tanpa keturunan. Terjemahan ini menyampaikan keadaan yang berlanjut tanpa memaksakan arti 'akan mati' yang hanya tersirat.
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: yang akan mewarisi seisi rumahku
  rationale: Ungkapan Ibrani ini sangat tidak lazim dan secara harfiah kira-kira berbunyi 'anak mesyeq rumahku'. Dalam konteks ayat ini dan ayat berikutnya, rujukannya paling mungkin ialah orang yang akan menerima milik serta rumah tangga Abram. Catatan kaki mempertahankan ketidakpastian leksikalnya.
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: Eliezer dari Damsyik
  rationale: Frasa ini paling wajar dipahami sebagai pengenalan Eliezer berdasarkan asal atau kaitannya dengan Damsyik.
theological_decisions:
- issue: Penerjemahan nama ilahi יֱהוִה dalam sapaan אֲדֹנָי יֱהוִה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH / Tuhan TUHAN
  rationale: Terjemahan ini membedakan gelar אֲדֹנָי dari nama perjanjian יֱהוִה dan mempertahankan keduanya secara langsung.
- issue: Status Eliezer dalam rumah Abram
  choice: yang akan mewarisi seisi rumahku
  alternative: pengurus rumahku / pemilik rumahku
  rationale: Konteks membicarakan ketiadaan anak dan calon penerima warisan, tetapi frasa Ibraninya tidak biasa. Karena itu teks utama menyampaikan fungsi yang paling mungkin, sedangkan alternatif dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kauberikan' mengikuti ejaan baku untuk pronomina terikat. 'Seisi rumahku' dipakai dalam arti rumah tangga beserta miliknya, sesuai konteks warisan; ambiguitas ungkapan Ibrani dijaga melalui catatan kaki.
