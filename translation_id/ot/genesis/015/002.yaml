    rationale: Dalam pemakaian Indonesia modern, “seisi rumah” biasanya berarti seluruh isi atau penghuni sebuah rumah. Konteks Ibrani menunjuk kepada pihak yang terkait dengan kepemilikan/warisan rumah tangga Abram. “Ahli waris rumah tanggaku” lebih jelas, sedangkan alternatif leksikal dipertahankan dalam catatan kaki.
