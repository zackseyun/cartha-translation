base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: id
  text: Ketika matahari sedang terbenam, tidur lelap menimpa Abram[a]. Dan lihatlah, suatu kengerian besar yang kelam sedang menimpanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu keadaan trans menimpa Abram.” Istilah Ibrani ini dapat menunjuk pada tidur yang luar biasa lelap, yang mungkin ditimbulkan secara ilahi.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kengerian besar akibat kegelapan” atau “kengerian akan kegelapan yang dahsyat.” Bahasa Ibrani merangkum gagasan kengerian dan kegelapan dalam satu frasa yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: Ketika matahari sedang terbenam
  rationale: Konstruksi ini membuka latar waktu saat matahari menuju terbenam. Bentuk progresif “sedang terbenam” alami dalam bahasa Indonesia dan mempertahankan nuansa berlangsung.
- source_word: תַרְדֵּמָה נָפְלָה עַל אַבְרָם
  choice: Abram pun tertidur lelap
  rationale: תַרְדֵּמָה menunjuk pada tidur yang sangat nyenyak, yang dalam konteks ini mungkin ditimbulkan secara ilahi. Ungkapan Indonesia ini menyampaikan makna idiom נפל על secara wajar tanpa mengharuskan tafsiran “keadaan trans”.
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Mempertahankan penanda perhatian yang dramatis dan peralihan adegan tanpa mengubahnya menjadi keterangan waktu seperti “tiba-tiba”.
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: suatu kengerian besar dan kelam
  rationale: Frasa Ibrani menumpuk gagasan kengerian, kegelapan, dan kebesaran secara padat. “Besar dan kelam” mempertahankan kepadatan serta ambiguitas hubungan antara kengerian dan kegelapan.
- source_word: נֹפֶלֶת עָלָיו
  choice: sedang menimpanya
  rationale: Partisipel Ibrani memberi kesan tindakan yang sedang berlangsung atau disajikan dengan hidup. “Sedang menimpanya” mempertahankan aspek tersebut dan citra sesuatu yang datang melanda Abram.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat תַרְדֵּמָה dalam konteks penyataan ini
  choice: tertidur lelap
  alternative: mengalami keadaan trans
  rationale: Konteksnya bersifat visioner dan terkait perjanjian, tetapi kata Ibraninya secara langsung berarti tidur lelap atau nyenyak. Terjemahan utama tidak menetapkan bahwa pengalaman itu pasti keadaan trans; kemungkinan tersebut dicatat dalam catatan kaki.
- issue: Hubungan antara kengerian dan kegelapan dalam אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: suatu kengerian besar dan kelam
  alternative: kengerian besar akibat kegelapan; kengerian akan kegelapan yang dahsyat
  rationale: Susunan Ibrani memungkinkan beberapa hubungan sintaksis dan semantis. Terjemahan utama mempertahankan gambaran padat itu daripada memastikan apakah kegelapan adalah sifat, penyebab, atau objek kengerian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Dan lihatlah” sengaja mempertahankan daya retoris הִנֵּה, sedangkan susunan “besar dan kelam” menjaga ketegangan dan kepadatan frasa Ibrani.
