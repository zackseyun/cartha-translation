  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: id
  text: dan orang Het, orang Feris, serta orang Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para raksasa.” Kata Ibrani Refaim dalam beberapa konteks dapat dipahami secara deskriptif, tetapi di sini kemungkinan besar menunjuk kepada suatu kelompok bangsa di negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: dan / serta
  rationale: Konjungsi וְ bersama penanda objek אֵת melanjutkan daftar bangsa dari ayat sebelumnya. Penanda objek tidak diterjemahkan tersendiri; variasi “dan / serta” menghasilkan daftar yang alami dalam bahasa Indonesia.
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Walaupun bentuk Ibraninya tunggal, nama bangsa berartikel ini dipakai secara kolektif. “Orang Het” adalah bentuk etnonim yang wajar dalam bahasa Indonesia.
- source_word: הַפְּרִזִּי
  choice: orang Feris
  rationale: Bentuk tunggal Ibrani ini juga berfungsi kolektif. “Orang Feris” menyatakan kelompok bangsa secara alami dan mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: הָרְפָאִים
  choice: orang Refaim
  rationale: Dalam daftar bangsa penghuni negeri ini, רְפָאִים paling kuat dipahami sebagai nama suatu kelompok bangsa. Transliterasi “Refaim” mempertahankan fungsi nama tersebut tanpa memasukkan tafsiran “raksasa” ke dalam teks utama.
theological_decisions:
- issue: Apakah רְפָאִים diterjemahkan sebagai nama bangsa atau secara deskriptif
  choice: Nama bangsa “orang Refaim”
  alternative: “para raksasa”
  rationale: Konteks Kejadian 15:19–21 berupa daftar bangsa yang mendiami negeri yang dijanjikan kepada Abram. Karena itu, pemahaman sebagai nama kelompok bangsa paling sesuai, sedangkan kaitan tradisional dengan para raksasa tetap dipertahankan sebagai alternatif dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur dipertahankan sebagai kelanjutan daftar pada ayat sebelumnya; “serta” dipakai pada unsur terakhir agar daftar terdengar alami.
