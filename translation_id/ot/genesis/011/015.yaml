  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: id
  text: Selah hidup 403 tahun lagi setelah ia menjadi ayah Eber, dan ia menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, חיה menyatakan bahwa Selah tetap hidup selama jangka waktu tertentu sesudah kelahiran Eber; kata 'lagi' memperjelas sifat pascakelahiran tanpa mengubah makna.
- source_word: שֶׁלַח
  choice: Selah
  rationale: Bentuk nama ini mengikuti transliterasi Ibrani שֶׁלַח yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־עֵבֶר
  choice: Setelah memperanakkan Eber
  rationale: Bentuk kausatif הוליד dalam silsilah berarti menjadi ayah biologis atau memperanakkan; 'memperanakkan' mempertahankan nuansa genealogis dan jenis kelamin pelakunya.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 tahun
  rationale: Ungkapan bilangan Ibrani secara idiomatis berarti empat ratus tiga tahun; angka menghasilkan bentuk Indonesia yang ringkas dan jelas.
- source_word: וַיּוֹלֶד
  choice: dan ia memperanakkan
  rationale: Dengan subjek laki-laki dalam rangkuman silsilah, ילד berarti memperanakkan atau menjadi ayah; pilihan ini menjaga hubungan leksikal dengan klausa sebelumnya.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Teks Ibrani menyebut kedua kelompok secara eksplisit; terjemahan ini mempertahankan perincian tersebut, bukan menggeneralisasikannya menjadi 'anak-anak' saja.
