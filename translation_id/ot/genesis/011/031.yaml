  source_fidelity: 'Teks Indonesia mengikuti unsur-unsur utama Ibrani dengan tepat: Terah sebagai pelaku pengambilan/pembawaan keluarga, Abram sebagai anaknya, Lot sebagai anak Haran sekaligus cucu Terah, Sarai sebagai menantu dan istri Abram, tujuan Kanaan, kedatangan sampai Haran, serta menetap di sana. Subjek jamak pada וַיֵּצְאוּ dipertahankan. Terjemahan idiomatis “Mereka berangkat bersama-sama” menangani frasa MT yang secara harfiah janggal, וַיֵּצְאוּ אִתָּם, dan catatan kaki b menjelaskan ketegangannya tanpa mengklaim penyelesaian tekstual yang pasti.'
