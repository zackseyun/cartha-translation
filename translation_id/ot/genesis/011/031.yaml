id: GEN.11.31
reference: Genesis 11:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: id
  text: Terah membawa Abram, anaknya, Lot anak Haran, cucunya,[a] serta Sarai, menantunya, yaitu istri Abram, anaknya. Mereka berangkat bersama-sama[b] dari Ur-Kasdim untuk pergi ke tanah Kanaan. Mereka sampai di Haran dan menetap di sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Lot anak Haran, anak dari anaknya”; maksudnya, Lot adalah cucu Terah.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, teks Ibrani berbunyi “mereka keluar bersama mereka”, suatu ungkapan yang janggal karena kedua kelompok yang dirujuk tampaknya bertumpang tindih.
    reason: textual_ambiguity
  - marker: c
    text: 'Teks Ibrani dapat diterjemahkan lebih harfiah: “Mereka datang sampai Haran lalu tinggal di sana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks perjalanan, ‘membawa’ menyampaikan tindakan Terah mengikutsertakan anggota keluarganya dengan lebih alami daripada ‘mengambil’, tanpa menambahkan gagasan pemaksaan.
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: Lot anak Haran, cucunya
  rationale: Ungkapan Ibrani secara harfiah menyebut Lot sebagai ‘anak Haran, anak dari anaknya’. ‘Cucunya’ mengungkapkan hubungan dengan Terah secara jelas, sedangkan nama ayah Lot tetap dipertahankan.
- source_word: כַּלָּתוֹ
  choice: menantunya
  rationale: Dalam konteks ini kata tersebut menunjuk kepada menantu perempuan Terah; bahasa Indonesia lazim memakai ‘menantu’, lalu aposisi berikutnya memperjelas bahwa Sarai adalah istri Abram.
- source_word: וַיֵּצְאוּ אִתָּם
  choice: Mereka berangkat bersama-sama
  rationale: Bentuk verba dan pronomina dalam Teks Masoret secara harfiah menghasilkan ungkapan janggal ‘mereka keluar bersama mereka’. Pilihan ini menyampaikan perjalanan kelompok tersebut secara alami sambil mencatat bentuk harfiahnya dalam catatan kaki.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: dari Ur-Kasdim
  rationale: ‘Ur-Kasdim’ adalah bentuk Indonesia yang ringkas dan dikenal luas untuk Ur milik atau wilayah orang Kasdim.
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: untuk pergi ke tanah Kanaan
  rationale: Infinitif dan akhiran penunjuk arah menyatakan tujuan perjalanan menuju tanah Kanaan.
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: Mereka sampai di Haran
  rationale: Kata עַד menandai batas yang dicapai dalam perjalanan. ‘Sampai di Haran’ alami dalam bahasa Indonesia dan tetap menggambarkan bahwa perjalanan mereka baru mencapai tempat itu.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: menetap di sana
  rationale: Dalam konteks migrasi, ישב berarti tinggal atau menetap; ‘menetap’ cocok dengan berhentinya rombongan itu di Haran.
theological_decisions:
- issue: Pelaku keberangkatan setelah Terah membawa keluarganya
  choice: 'Mempertahankan subjek jamak: ‘Mereka berangkat’'
  alternative: ‘Terah berangkat’ atau ‘Terah membawa mereka keluar’
  rationale: Teks Masoret memakai verba jamak וַיֵּצְאוּ. Karena itu, Terah tidak dijadikan satu-satunya pelaku keberangkatan, sekalipun ia menjadi pelaku utama pada awal ayat.
- issue: Hubungan tujuan Kanaan dengan berhenti di Haran
  choice: Mengikuti urutan narasi dengan kata sambung netral, tanpa menambahkan ‘tetapi’
  alternative: ‘Tetapi ketika mereka sampai di Haran’
  rationale: Bahasa Ibrani memakai rangkaian waw naratif dan tidak menyatakan pertentangan secara eksplisit. Urutan tujuan, kedatangan, dan menetap dibiarkan berbicara sendiri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘anaknya’ dipertahankan karena struktur sumber menekankan hubungan keluarga. Ayat dipecah menjadi tiga kalimat agar daftar kekerabatan dan rangkaian perjalanan mudah dipahami, tanpa mengubah urutan informasi.
