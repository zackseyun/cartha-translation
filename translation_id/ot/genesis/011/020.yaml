  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, חיה dengan keterangan jumlah tahun menyatakan usia tokoh ketika anak berikutnya lahir; 'berumur' menyampaikan fungsi idiomatisnya secara alami dalam bahasa Indonesia.
- source_word: רְעוּ
  choice: Rehu
  rationale: Nama Ibrani רְעוּ dialihaksarakan dalam bentuk Indonesia yang lazim, 'Rehu'.
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: tiga puluh dua tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'dua dan tiga puluh'; urutannya disesuaikan dengan bahasa Indonesia modern tanpa mengubah nilainya.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk kausatif ילד dalam silsilah menyatakan tindakan menjadi ayah biologis atau menghasilkan keturunan; 'memperanakkan' ringkas, tepat, dan cocok dengan ragam silsilah.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Partikel ini menandai objek langsung tertentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Nama Ibrani שְׂרוּג dialihaksarakan sebagai 'Serug', bentuk yang jelas dan lazim dalam bahasa Indonesia.
