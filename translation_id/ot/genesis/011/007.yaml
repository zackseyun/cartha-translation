  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: id
  text: Mari, Kita turun dan mengacaukan bahasa mereka di sana, supaya yang satu tidak memahami bahasa yang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: Mari
  rationale: Kata ajakan ini secara alami diterjemahkan sebagai “Mari” dalam bahasa Indonesia.
- source_word: נֵרְדָה
  choice: Kita turun
  rationale: 'Bentuk kohortatif jamak menyatakan ajakan bersama: “marilah kita turun.” Kapitalisasi “Kita” menandai rujukannya kepada Allah bersama sidang ilahi tanpa menambahkan identitas yang tidak dinyatakan ayat.'
- source_word: וְנָבְלָה
  choice: dan mengacaukan
  rationale: Bentuk kohortatif ini melanjutkan ajakan dan menyatakan tindakan membuat bahasa mereka menjadi kacau atau tidak saling dimengerti.
- source_word: שְׂפָתָם
  choice: bahasa mereka
  rationale: Secara harfiah שָׂפָה berarti “bibir,” tetapi dalam konteks ini merupakan metonimia bagi bahasa; “bahasa mereka” paling jelas dan alami.
- source_word: אִישׁ ... רֵעֵהוּ
  choice: yang satu ... yang lain
  rationale: Ungkapan timbal balik Ibrani ini secara idiomatis berarti seorang tidak memahami sesamanya; pasangan “yang satu ... yang lain” mempertahankan sifat distributif tanpa membatasi rujukan pada laki-laki.
theological_decisions:
- issue: Pembicara ilahi memakai bentuk jamak “Kita”
  choice: Mempertahankan bentuk jamak sebagai “Kita” tanpa penjelasan dogmatis dalam teks
  alternative: Menafsirkan bentuk jamak secara eksplisit sebagai Tritunggal, plural keagungan, atau sapaan kepada sidang ilahi
  rationale: Teks Ibrani memang memakai bentuk jamak, tetapi ayat ini sendiri tidak menentukan secara eksplisit penjelasan teologisnya; terjemahan harus mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “di sana” ditempatkan setelah objek agar jelas bahwa pengacauan bahasa berlangsung di tempat itu. Tidak digunakan penanda gender pada אִישׁ karena ungkapan tersebut berfungsi timbal balik dan mencakup setiap orang dalam kelompok.
