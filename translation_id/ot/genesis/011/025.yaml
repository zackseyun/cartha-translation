  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan urutan dan isi rumusan Ibrani: sesudah Nahor menjadi ayah Terah, ia hidup 119 tahun lagi dan kemudian disebut memiliki keturunan laki-laki maupun perempuan. Bilangan, nama, dan pengulangan tindakan melahirkan keturunan terpelihara.'
