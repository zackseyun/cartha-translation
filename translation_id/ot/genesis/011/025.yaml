base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: id
  text: Setelah memperanakkan Terah, Nahor hidup seratus sembilan belas tahun lagi dan memperanakkan anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumusan silsilah, bentuk ini menyatakan lamanya Nahor tetap hidup sesudah kelahiran anak yang disebutkan; 'hidup ... lagi' menyampaikan kelanjutan waktu secara alami.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־תֶּרַח
  choice: Setelah memperanakkan Terah
  rationale: Konstruksi ini menandai masa sesudah Nahor menjadi ayah Terah. 'Memperanakkan' mempertahankan tindakan aktif ילד dan sesuai dengan gaya silsilah yang bermartabat.
- source_word: תֶּרַח
  choice: Terah
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: seratus sembilan belas tahun
  rationale: Bahasa Ibrani menyusun bilangan sebagai sembilan belas ditambah seratus; urutan bilangan disesuaikan dengan kaidah alami bahasa Indonesia.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Pilihan ini mempertahankan pengulangan akar ילד dan rumusan aktif silsilah, tanpa memakai ungkapan yang terlalu umum seperti 'mempunyai'.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan, bukan menggeneralisasinya hanya sebagai 'anak-anak'.
theological_decisions: []
