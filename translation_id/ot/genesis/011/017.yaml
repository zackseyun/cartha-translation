base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah Eber menjadi ayah Peleg, ia hidup 430 tahun lagi dan menjadi ayah bagi anak-anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, verba חיה menyatakan bahwa Eber terus hidup sesudah kelahiran Peleg; kata 'lagi' secara alami menghubungkan lamanya hidup dengan peristiwa tersebut.
- source_word: עֵבֶר
  choice: Eber
  rationale: Mengikuti bentuk nama Ibrani yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: setelah memperanakkan Peleg
  rationale: Bentuk kausatif ילד dalam silsilah menunjuk pada tindakan menjadi ayah biologis; 'memperanakkan' ringkas, tepat, dan sesuai dengan ragam silsilah yang bermartabat.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 430 tahun
  rationale: Angka Ibrani secara harfiah tersusun 'tiga puluh tahun dan empat ratus tahun'; penulisan '430 tahun' menyampaikan jumlah yang sama secara alami dalam bahasa Indonesia.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Mempertahankan verba silsilah yang sama secara konsisten dan tetap menunjukkan peran Eber sebagai ayah.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Menerjemahkan kedua kategori keturunan yang disebut secara eksplisit, alih-alih meratakannya menjadi 'anak-anak' saja.
