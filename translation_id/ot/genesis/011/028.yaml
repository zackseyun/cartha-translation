  text: וַ/יָּ֣מָת הָרָ֔ן עַל פְּנֵ֖י תֶּ֣רַח אָבִ֑י/ו בְּ/אֶ֥רֶץ מוֹלַדְתּ֖/וֹ בְּ/א֥וּר כַּשְׂדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: id
  text: Haran meninggal di hadapan Terah, ayahnya[a], di negeri kelahirannya, di Ur-Kasdim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas wajah Terah, ayahnya.” Ungkapan Ibrani ini dapat berarti bahwa Haran meninggal semasa ayahnya masih hidup; ungkapan ini juga dapat menyiratkan bahwa ia meninggal di hadapan ayahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol dari מות menyatakan peristiwa lampau dalam alur narasi; 'meninggal' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: עַל פְּנֵי
  choice: ketika ... masih hidup
  rationale: Dalam konteks hubungan anak dan ayah, ungkapan ini menunjukkan bahwa Haran meninggal semasa ayahnya masih hidup. Terjemahan utama menyampaikan maksud idiom secara alami, sedangkan catatan kaki mempertahankan kemungkinan nuansa kehadiran langsung.
- source_word: תֶּרַח אָבִיו
  choice: Terah, ayahnya
  rationale: Frasa ini mengidentifikasi Terah sebagai ayah Haran; susunan dengan aposisi terdengar alami dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: di negeri kelahirannya
  rationale: מוֹלֶדֶת merujuk pada negeri atau tempat asal kelahiran; pilihan ini ringkas, jelas, dan dekat dengan bentuk Ibrani.
- source_word: בְּאוּר כַּשְׂדִּים
  choice: di Ur-Kasdim
  rationale: אוּר adalah nama tempat, sedangkan כַּשְׂדִּים adalah nama bangsa/wilayah yang secara baku dikenal dalam tradisi bahasa Indonesia sebagai Kasdim; bentuk majemuk 'Ur-Kasdim' jelas dan lazim.
