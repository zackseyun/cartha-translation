  text: וַ/יִּהְי֣וּ יְמֵי תֶ֔רַח חָמֵ֥שׁ שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יָּ֥מָת תֶּ֖רַח בְּ/חָרָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/032.yaml
  text: The days of Terah were two hundred and five years, and Terah died in Haran.
translation:
  language: id
  text: Umur Terah mencapai dua ratus lima tahun, lalu Terah meninggal di Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: Umur Terah mencapai
  rationale: Ungkapan Ibrani harfiah 'hari-hari Terah adalah' merupakan idiom tentang keseluruhan masa hidup. Bahasa Indonesia alami menyatakannya dengan 'umur ... mencapai', yang juga mempertahankan fungsi ayat sebagai ringkasan masa hidup.
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: dua ratus lima tahun
  rationale: Urutan bilangan Ibrani dinaturalkan mengikuti kaidah bilangan bahasa Indonesia tanpa mengubah nilainya.
- source_word: תֶרַח
  choice: Terah
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וַיָּמָת
  choice: lalu ... meninggal
  rationale: Kata kerja מות menyatakan kematian secara langsung. 'Meninggal' merupakan padanan Indonesia yang wajar dan bermartabat; 'lalu' mencerminkan kesinambungan naratif wayyiqtol.
- source_word: בְּחָרָן
  choice: di Haran
  rationale: Preposisi בְּ menunjukkan lokasi kematian dan secara alami diterjemahkan 'di'.
