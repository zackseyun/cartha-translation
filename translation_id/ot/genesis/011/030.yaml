  text: וַ/תְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖/הּ וָלָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: id
  text: Sarai mandul[a]; ia tidak mempunyai anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sarai tidak dapat melahirkan anak; ia tidak mempunyai keturunan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: '[tidak dinyatakan secara terpisah]'
  rationale: Bentuk wayyiqtol dari היה menghubungkan pernyataan keadaan ini dengan narasi sebelumnya. Dalam bahasa Indonesia, hubungan itu dapat dibiarkan tersirat agar kalimat tetap alami tanpa menambahkan penanda waktu seperti “sekarang” yang tidak ada secara eksplisit dalam sumber.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עֲקָרָה
  choice: mandul
  rationale: Kata sifat ini menyatakan ketidakmampuan untuk melahirkan anak. “Mandul” adalah padanan Indonesia yang ringkas dan jelas, sedangkan “tidak mempunyai anak” saja akan bertumpang tindih dengan klausa penjelas berikutnya.
- source_word: אֵין לָהּ
  choice: ia tidak mempunyai
  rationale: Konstruksi eksistensial negatif dengan preposisi dan sufiks pronominal paling alami dinyatakan sebagai kepemilikan negatif dalam bahasa Indonesia.
- source_word: וָלָד
  choice: anak
  rationale: Nomina ini menunjuk pada sesuatu atau seseorang yang dilahirkan, dan dalam konteks ini paling alami diterjemahkan “anak”; “keturunan” tetap merupakan kemungkinan leksikal.
