  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָ֑ן וְ/הָרָ֖ן הוֹלִ֥יד אֶת לֽוֹט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: id
  text: 'Inilah keturunan Terah: Terah memperanakkan Abram, Nahor, dan Haran; dan Haran memperanakkan Lot.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan bagian silsilah yang baru. “Inilah” alami dalam bahasa Indonesia dan menyampaikan fungsi penunjuk tanpa menambahkan unsur waktu seperti “sekarang”.
- source_word: תּוֹלְדֹת
  choice: keturunan
  rationale: Dalam rumus berulang kitab Kejadian, istilah ini menunjuk pada garis atau riwayat yang berasal dari seseorang. “Keturunan” mempertahankan nuansa genealogis yang paling langsung dalam konteks ini.
- source_word: תֶּרַח
  choice: Terah
  rationale: Nama pribadi dialihaksarakan menurut bentuk baku bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti menjadi ayah atau menghasilkan keturunan. “Memperanakkan” ringkas, tepat secara genealogis, dan menjaga pengulangan verba Ibrani.
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: Abram, Nahor, dan Haran
  rationale: Penanda objek langsung tidak diterjemahkan; ketiga nama disajikan sebagai daftar yang wajar dalam bahasa Indonesia.
- source_word: וְהָרָן
  choice: dan Haran
  rationale: Konjungsi menghubungkan klausa berikutnya secara langsung dengan pernyataan silsilah sebelumnya.
- source_word: הוֹלִיד אֶת לוֹט
  choice: memperanakkan Lot
  rationale: Verba genealogis diterjemahkan secara konsisten, sedangkan Lot dialihaksarakan sebagai nama pribadi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada silsilah. Tanda titik dua memperjelas bahwa klausa berikut menguraikan keturunan Terah; titik koma memisahkan dua klausa erat tanpa mengubah hubungan sintaksis Ibrani.
