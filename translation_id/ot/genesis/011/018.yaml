  text: Peleg lived thirty years and fathered Reu.
translation:
  language: id
  text: Peleg hidup tiga puluh tahun, lalu memperanakkan Rehu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Dalam rumus silsilah, bentuk ini menyatakan lamanya Peleg hidup sebelum kelahiran anak yang disebut berikutnya; 'hidup' mempertahankan ungkapan Ibrani secara wajar.
- source_word: פֶלֶג
  choice: Peleg
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: tiga puluh tahun
  rationale: Frasa Ibrani menyatakan usia secara adverbial. Bentuk ini alami dalam pola silsilah dan tidak perlu menambahkan kata 'berumur'.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, kata ילד menunjuk pada tindakan menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas, jelas, dan mempertahankan nuansa genealogis.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan leksikal yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: רְעוּ
  choice: Rehu
  rationale: Bentuk 'Rehu' mengikuti transliterasi nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan mencerminkan konsonan nama Ibrani רְעוּ.
