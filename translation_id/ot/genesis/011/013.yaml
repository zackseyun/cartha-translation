  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah bagi Selah, Arpakhsad hidup 403 tahun lagi dan menjadi ayah bagi anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, verba tersebut menunjukkan lamanya Arpakhsad tetap hidup sesudah kelahiran Selah; kata 'lagi' membuat hubungan waktunya jelas dan alami dalam bahasa Indonesia.
- source_word: אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Transliterasi ini mengikuti bentuk Ibrani secara cukup dekat dan memakai ejaan Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: setelah memperanakkan
  rationale: Konstruksi ini menyatakan waktu sesudah subjek laki-laki memperanakkan anak yang disebut; 'memperanakkan' mempertahankan makna kausatif dan cocok dengan gaya silsilah.
- source_word: אֶת שֶׁלַח
  choice: Selah
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani שֶׁלַח; penanda objek אֶת tidak diterjemahkan tersendiri.
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 403 tahun
  rationale: Urutan bilangan Ibrani dinaturalkan menjadi angka 403 tanpa mengubah nilainya.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam konteks silsilah dengan subjek laki-laki, pilihan ini menyatakan bahwa ia menjadi ayah bagi keturunan lain dan lebih spesifik daripada sekadar 'mempunyai'.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan serta terdengar alami dalam bahasa Indonesia modern.
