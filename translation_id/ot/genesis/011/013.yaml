  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan kalimat dinaturalkan dengan menempatkan anak kalimat waktu di awal; 'lagi' menegaskan bahwa 403 tahun adalah masa sesudah Selah diperanakkan.
