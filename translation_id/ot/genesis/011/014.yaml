lexical_decisions:
- source_word: וְ/שֶׁלַח
  choice: Selah
  rationale: Nama Ibrani שֶׁלַח ditransliterasikan sebagai Selah, bentuk yang alami dalam ejaan Indonesia dan tetap mencerminkan bunyi sumber Ibrani.
- source_word: חַי שְׁלֹשִׁים שָׁנָה
  choice: hidup tiga puluh tahun
  rationale: Ungkapan silsilah ini menyatakan umur yang dicapai sebelum peristiwa berikutnya; bentuk ini dekat dengan struktur Ibrani dan wajar dalam konteks.
- source_word: וַ/יּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas, bermartabat, dan mempertahankan sudut pandang genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya diwakili oleh susunan kalimat.
- source_word: עֵבֶר
  choice: Eber
  rationale: Eber secara langsung mencerminkan nama Ibrani עֵבֶר dan sesuai dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
