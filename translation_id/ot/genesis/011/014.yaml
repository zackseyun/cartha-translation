- from: Setelah Selah hidup tiga puluh tahun, ia memperanakkan Eber.[a][b]
  to: Selah berumur tiga puluh tahun ketika ia menjadi ayah Eber.[a][b]
  rationale: Revisi menghapus tambahan temporal “Setelah,” memakai konstruksi usia yang idiomatis dalam bahasa Indonesia, dan mengganti verba yang kurang lazim dengan “menjadi ayah,” yang menyampaikan makna genealogis teks Ibrani. Catatan nama diselaraskan dengan alternatif tradisional yang relevan sambil mempertahankan bentuk transliterasi dekat-sumber dalam teks.
