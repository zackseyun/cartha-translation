    issue: “Setelah Selah hidup tiga puluh tahun” menambahkan relasi waktu yang tidak dinyatakan sumber.
    rationale: Teks menyatakan Selah telah mencapai umur tiga puluh tahun lalu/ketika melahirkan keturunan, bukan bahwa tindakan itu terjadi setelah suatu masa hidup yang diperlakukan sebagai peristiwa tersendiri.
  - severity: medium
    issue: “Memperanakkan” kurang alami dan berpotensi tidak jelas dalam bahasa Indonesia modern untuk tindakan seorang laki-laki.
    rationale: Dalam silsilah, “menjadi ayah” merupakan padanan modern yang jelas bagi ילד Hifil.
  - severity: low
    issue: Catatan a tidak mencatat alternatif tradisional yang relevan, “Salah.”
    rationale: Jejak audit Inggris membedakan bentuk Ibrani langsung dari bentuk tradisional Salah; “Shelah” terutama merupakan transliterasi Latin/Inggris, bukan alternatif Indonesia yang paling berguna.
