  verdict: revise
  source_fidelity: Kata pembuka “Setelah” tidak terdapat dalam teks Ibrani dan secara tidak tepat mengubah hubungan menjadi ‘sesudah Selah hidup tiga puluh tahun’. Formula Ibrani menyatakan usia Selah ketika ia menjadi ayah Eber. Nama Selah dan Eber dapat dipertahankan sebagai transliterasi yang dekat dengan Ibrani.
  naturalness: “Selah berumur tiga puluh tahun ketika ia menjadi ayah Eber” adalah bahasa Indonesia baku, jelas, dan alami untuk formula silsilah. Ini menghindari “memperanakkan,” yang dalam pemakaian modern kurang lazim dan dapat terasa tidak tepat untuk subjek laki-laki.
  terminology: “Menjadi ayah” secara idiomatis menyampaikan fungsi Hifil ילד dalam silsilah tanpa memakai istilah arkais. Catatan nama pertama perlu menyebut alternatif tradisional “Salah,” bukan hanya ejaan Latin “Shelah.”
  issues:
