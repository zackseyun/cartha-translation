  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: id
  text: Lalu Yahweh turun untuk melihat kota dan menara yang telah dibangun manusia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “anak-anak manusia”; ungkapan Ibrani ini merujuk kepada manusia secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Lalu ... turun
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa, sedangkan ירד berarti ‘turun’. Ungkapan konkret dipertahankan tanpa melunakkan antropomorfisme teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: לִרְאֹת
  choice: untuk melihat
  rationale: Terjemahan langsung dari infinitif ראה; ‘memeriksa’ akan menambahkan nuansa yang tidak harus ada dalam teks.
- source_word: הָעִיר וְאֶת הַמִּגְדָּל
  choice: kota dan menara
  rationale: Padanan Indonesia yang langsung dan alami bagi kedua nomina definit tersebut.
- source_word: אֲשֶׁר בָּנוּ
  choice: yang telah dibangun
  rationale: Klausa relatif pasif menghasilkan bahasa Indonesia yang alami dan menunjukkan bahwa manusia adalah pelaku pembangunan, tanpa menentukan secara berlebihan apakah proyek itu sepenuhnya selesai.
- source_word: בְּנֵי הָאָדָם
  choice: anak-anak manusia
  rationale: Mempertahankan bentuk ungkapan Ibrani, secara harfiah ‘anak-anak manusia’, sementara makna kolektifnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Gambaran antropomorfis tentang Yahweh yang turun
  choice: Mempertahankan kata konkret ‘turun’.
  alternative: ‘memandang dari atas’ atau ‘memperhatikan’
  rationale: Teks Ibrani menggambarkan tindakan ilahi dengan bahasa naratif antropomorfis. Terjemahan tidak mengabstrakkan atau melunakkan ketegangan sastranya.
- issue: Makna בְּנֵי הָאָדָם
  choice: Menggunakan ‘anak-anak manusia’ dalam teks utama.
  alternative: ‘umat manusia’ atau ‘manusia’
  rationale: Pilihan utama menjaga bentuk sumber dan kontras antara Yahweh dengan manusia; cakupan kolektif frasa itu dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Struktur sumber dipertahankan sejauh tetap wajar dalam bahasa Indonesia; tanda catatan kaki ditempatkan langsung setelah kalimat terkait.
