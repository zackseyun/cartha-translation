  terminology: “Bitumen” adalah istilah yang lebih presisi untuk חֵמָר. “Bahan perekat” dapat dipertahankan sebagai padanan fungsional untuk חֹמֶר; catatan kaki menjelaskan istilah bahan pertama tanpa menyamakan bitumen begitu saja dengan aspal modern.
