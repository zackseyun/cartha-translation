base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: id
  text: Mereka berkata satu sama lain, “Mari, kita membuat batu bata dan membakarnya sampai matang.” Batu bata itu mereka gunakan sebagai pengganti batu[a], dan bitumen[b] sebagai pengganti bahan perekat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “batu bata itu menjadi batu bagi mereka,” yaitu batu bata berfungsi menggantikan batu alam.
    reason: translation_clarity
  - marker: b
    text: Kata Ibrani ini menunjuk pada bitumen, yaitu ter alamiah yang mirip aspal dan digunakan dalam konstruksi.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: seorang kepada yang lain
  rationale: Ungkapan distributif ini berarti mereka saling berbicara, ‘seorang kepada yang lain.’ Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan penekanan gender yang tidak diperlukan dalam konteks kelompok tersebut.
- source_word: הָבָה
  choice: Mari
  rationale: Partikel ini mengawali ajakan atau desakan bersama; ‘Mari’ merupakan padanan Indonesia modern yang wajar.
- source_word: נִלְבְּנָה לְבֵנִים
  choice: kita membuat batu bata
  rationale: Kata kerjanya berasal dari kata ‘batu bata’ dan berarti membuat batu bata. Bentuk ajakan orang pertama jamak dipertahankan dengan ‘kita.’
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: dan membakarnya sampai matang
  rationale: Gabungan kata kerja dengan bentuk serumpunnya menegaskan pembakaran secara tuntas. Dalam konteks pembuatan batu bata, ‘sampai matang’ menyampaikan bahwa bata dibakar sempurna, bukan sekadar dijemur.
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: Batu bata itu mereka gunakan sebagai pengganti batu
  rationale: 'Konstruksi היה + ל di sini menyatakan penggantian fungsi: batu bata dipakai di tempat batu alam. Susunan aktif ini alami dalam bahasa Indonesia tanpa mengubah maknanya.'
- source_word: הַחֵמָר
  choice: aspal
  rationale: חֵמָר menunjuk pada bitumen, yakni bahan ter alamiah mirip aspal yang digunakan dalam bangunan. ‘Aspal’ lebih mudah dipahami pembaca umum; rincian bendanya dijelaskan dalam catatan kaki.
- source_word: לַחֹמֶר
  choice: sebagai pengganti bahan perekat
  rationale: חֹמֶר dalam konteks konstruksi menunjuk pada bahan adukan atau perekat antarbata. ‘Bahan perekat’ menyampaikan fungsinya dengan jelas dan menghindari ‘semen,’ yang akan bersifat anakronistis.
