id: GEN.11.6
reference: Genesis 11:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: id
  text: Lalu Yahweh berfirman, “Lihatlah, mereka ini satu bangsa dan mereka semua memiliki satu bahasa. Inilah yang mulai mereka lakukan. Dan sekarang, tidak ada yang mereka rencanakan untuk dilakukan yang tidak akan dapat mereka capai.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan sekarang, tidak satu pun dari semua yang mereka rencanakan untuk dilakukan akan tertahan dari mereka.”
    reason: Mempertahankan alternatif leksikal bagi לֹא יִבָּצֵר מֵהֶם, yang dapat berarti “tidak akan tertahan/terhalang dari mereka” alih-alih “tidak akan dapat mereka capai.”
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti Tuhan.
- source_word: הֵן
  choice: Lihatlah
  rationale: Mempertahankan fungsi penunjuk dan penarik perhatian dalam ragam bahasa Indonesia yang bermartabat.
- source_word: עַם אֶחָד
  choice: satu bangsa
  rationale: עַם menunjuk pada suatu kelompok manusia sebagai satu kesatuan; 'satu bangsa' alami dalam konteks seluruh umat yang masih bersatu, tanpa harus menyiratkan negara politik.
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: mereka semua memiliki satu bahasa
  rationale: שָׂפָה secara harfiah berarti 'bibir', tetapi secara idiomatis berarti bahasa; susunan ini mempertahankan penekanan לְכֻלָּם pada semua orang.
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: Ini baru permulaan dari apa yang akan mereka lakukan
  rationale: Bentuk הַחִלָּם menyatakan tindakan memulai; 'baru permulaan' menyampaikan bahwa pekerjaan sekarang merupakan tahap awal, sementara konteks klausa berikutnya memberi orientasi ke depan.
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: tidak ada sesuatu pun ... yang tidak akan dapat mereka capai
  rationale: Nifal בצר dapat berarti tertahan, tidak terjangkau, atau mustahil. Ungkapan ini menyampaikan kemampuan untuk merealisasikan rencana dalam bahasa Indonesia alami, sambil mencatat alternatif yang lebih formal.
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: sesuatu pun yang mereka rencanakan untuk dilakukan
  rationale: יזם berarti merancang, merencanakan, atau bermaksud; 'rencanakan' jelas dan sesuai dengan konteks proyek bersama.
theological_decisions:
- issue: Cakupan pernyataan mengenai kemampuan manusia
  choice: Pernyataan ini menggambarkan daya pelaksanaan umat manusia yang bersatu dalam konteks narasi, bukan kemahakuasaan mutlak.
  alternative: Tidak satu pun rencana mereka akan ditahan dari mereka.
  rationale: Terjemahan mempertahankan kuatnya pernyataan ilahi, tetapi tidak memperluasnya menjadi klaim universal tentang kemampuan manusia atau pembatasan kuasa Allah.
- issue: Hubungan tindakan sekarang dengan proyek-proyek mendatang
  choice: Pekerjaan mereka sekarang dipahami sebagai permulaan dari tindakan selanjutnya.
  alternative: Inilah yang telah mulai mereka lakukan.
  rationale: Kedua bacaan dimungkinkan oleh susunan Ibrani. Pilihan utama menampilkan daya dorong prospektif menuju klausa berikutnya, sedangkan catatan kaki menjaga bacaan yang lebih dekat dengan bentuk klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu ... berfirman' mengikuti gaya naratif Alkitab yang alami; 'Lihatlah' mempertahankan penarik perhatian tanpa memakai bentuk arkais. Nama ilahi ditulis 'Yahweh'.
