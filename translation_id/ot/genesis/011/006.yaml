  to: Lalu Yahweh berfirman, “Lihatlah, mereka ini satu bangsa dan mereka semua memiliki satu bahasa. Inilah yang mulai mereka lakukan. Dan sekarang, tidak ada yang mereka rencanakan untuk dilakukan yang tidak akan dapat mereka capai.[a]”
