  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: id
  text: Seluruh bumi memiliki satu bahasa dan kata-kata yang sama[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dan satu perangkat kata-kata” atau “dan tutur yang sama.” Secara harfiah, bahasa Ibrani berbunyi “dan kata-kata, satu/sama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: memiliki
  rationale: Bentuk naratif dari היה memperkenalkan keadaan yang menjadi latar kisah. Dalam bahasa Indonesia modern, keadaan lampau dapat dinyatakan secara wajar oleh konteks narasi tanpa ungkapan arkais seperti 'terjadilah'.
- source_word: כָל הָאָרֶץ
  choice: seluruh bumi
  rationale: אֶרֶץ dapat berarti 'bumi' atau 'negeri'. Dalam konteks Babel, cakupannya luas, yakni dunia manusia, sehingga 'seluruh bumi' paling sesuai.
- source_word: שָׂפָה אֶחָת
  choice: satu bahasa
  rationale: שָׂפָה secara harfiah berarti 'bibir', tetapi dalam ungkapan ini menunjuk kepada bahasa atau tutur. 'Satu bahasa' jelas dan alami serta mempertahankan unsur kesatuan dari אֶחָת.
- source_word: וּדְבָרִים אֲחָדִים
  choice: dan kata-kata yang sama
  rationale: דְּבָרִים lazim berarti 'kata-kata' atau 'hal-hal'. Bersama dengan 'satu bahasa', frasa ini menekankan kesamaan kata atau cara mengungkapkan sesuatu tanpa meleburkannya menjadi pengulangan kata 'bahasa'.
