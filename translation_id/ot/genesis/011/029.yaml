id: GEN.11.29
reference: Genesis 11:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: id
  text: Abram dan Nahor masing-masing mengambil seorang istri.[a] Nama istri Abram ialah Sarai, dan nama istri Nahor ialah Milka, anak perempuan Haran, ayah Milka dan Yiska.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Abram dan Nahor masing-masing menikah.” Bahasa Ibrani secara harfiah berbunyi “mengambil istri bagi diri mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja לקח pada dasarnya berarti “mengambil” dan di sini digunakan dalam ungkapan perkawinan. Terjemahan ini mempertahankan gambaran bahasa Ibrani tanpa menjadi tidak dapat dipahami dalam bahasa Indonesia.
- source_word: לָהֶם
  choice: masing-masing
  rationale: 'Bentuk ini menyatakan kepentingan diri dalam ungkapan tersebut: Abram dan Nahor mengambil istri untuk diri mereka sendiri. “Masing-masing” menyampaikan makna distributif itu secara alami dalam bahasa Indonesia.'
- source_word: נָשִׁים
  choice: seorang istri
  rationale: Walaupun bentuk Ibraninya jamak karena mengacu kepada kedua laki-laki, konteks perkawinan menuntut arti “istri”; konstruksi distributif bahasa Indonesia secara wajar memakai “masing-masing ... seorang istri”.
- source_word: שֵׁם
  choice: nama ... ialah
  rationale: Pengulangan konstruksi “nama” dipertahankan agar susunan dan irama sumber tetap tampak, tetapi dirumuskan secara wajar dalam bahasa Indonesia.
- source_word: אֵשֶׁת
  choice: istri
  rationale: Dalam bentuk terikat dengan nama suami, kata ini jelas berarti “istri”.
- source_word: שָׂרָי
  choice: Sarai
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מִלְכָּה
  choice: Milka
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּת
  choice: anak perempuan
  rationale: Istilah kekerabatan ini secara langsung berarti “anak perempuan”.
- source_word: הָרָן
  choice: Haran
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲבִי
  choice: ayah
  rationale: Makna langsungnya adalah “ayah”; konteks silsilah dekat ini tidak menuntut arti yang lebih luas seperti “leluhur”.
- source_word: יִסְכָּה
  choice: Yiska
  rationale: Nama pribadi ditransliterasikan secara dekat dengan bahasa Ibrani dan sesuai dengan bentuk yang dikenal pembaca Alkitab Indonesia.
theological_decisions: []
