  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah Nahor, Serug hidup dua ratus tahun lagi dan ia memperoleh anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah, חיה berarti 'hidup'; kata 'lagi' secara alami menyatakan bahwa masa hidup ini berlangsung sesudah kelahiran Nahor.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Preposisi temporal ini menandai waktu yang menyusul suatu peristiwa.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menunjuk pada tindakan seorang ayah menghasilkan keturunan; 'memperanakkan' ringkas dan mempertahankan relasi paternal.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Partikel ini menandai objek langsung tertentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מָאתַיִם שָׁנָה
  choice: dua ratus tahun
  rationale: Konstruksi bilangan dengan nomina tunggal menyatakan durasi; bahasa Indonesia secara alami memakai 'dua ratus tahun'.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Pilihan yang sama mempertahankan pengulangan verba ילד dalam ayat dan ketepatan rumus silsilah.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Ibrani secara eksplisit menyebut keturunan laki-laki dan perempuan; terjemahan ini mempertahankan kedua unsur tersebut.
