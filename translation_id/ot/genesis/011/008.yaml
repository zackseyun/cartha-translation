  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: id
  text: Maka Yahweh menyerakkan mereka dari sana ke seluruh muka bumi[a], dan mereka berhenti membangun kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas muka seluruh bumi”; dapat juga diterjemahkan “ke seluruh bumi” atau “ke segenap penjuru bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: menyerakkan
  rationale: Bentuk kausatif dari פוץ menyatakan bahwa Yahweh membuat mereka tercerai-berai. 'Menyerakkan' mempertahankan nuansa tindakan penghakiman dan alami dalam konteks ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Ungkapan lokasi yang langsung merujuk kembali kepada tempat pembangunan kota.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: ke seluruh muka bumi
  rationale: Pilihan ini mempertahankan citra harfiah Ibrani 'di atas muka seluruh bumi', tetapi memakai preposisi 'ke' agar arah penyebaran yang mengikuti verba kausatif terdengar alami dalam bahasa Indonesia.
- source_word: וַיַּחְדְּלוּ
  choice: mereka berhenti
  rationale: חדל berarti berhenti atau tidak melanjutkan; 'berhenti' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לִבְנֹת
  choice: membangun
  rationale: Infinitif Ibrani diterjemahkan secara idiomatis sesudah 'berhenti'.
- source_word: הָעִיר
  choice: kota itu
  rationale: Nomina definit ini menunjuk kepada kota tertentu yang sedang mereka bangun dalam konteks sebelumnya; 'kota itu' menyatakan rujukan tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar dan tanpa menetapkan pelafalan 'Yehuwa'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat tetap dekat dengan urutan Ibrani, sementara 'kota itu' dan 'ke seluruh muka bumi' dipilih agar rujukan serta arah gerak jelas bagi pembaca umum.
