  text: וַֽ/יְחִי פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/019.yaml
  text: And Peleg lived two hundred and nine years after he fathered Reu, and he fathered sons and daughters.
translation:
  language: id
  text: Setelah memperanakkan Rehu, Peleg hidup 209 tahun lagi dan memperanakkan anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah, verba חיה menyatakan lamanya kehidupan setelah peristiwa yang disebut; kata 'lagi' secara alami menandai kelanjutan masa hidup dalam bahasa Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: setelah memperanakkan Rehu
  rationale: אַחֲרֵי memberi hubungan waktu, sedangkan bentuk Hifil ילד menyatakan tindakan ayah memperanakkan keturunan. Nama Ibrani רְעוּ ditransliterasikan sebagai 'Rehu' sesuai pelafalan yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 209 tahun
  rationale: Urutan angka Ibrani dinyatakan menurut kebiasaan modern bahasa Indonesia; angka ditulis dengan numeralia agar rumus silsilah tetap ringkas dan mudah dibaca.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Pemakaian kedua dari ילד diterjemahkan secara konsisten dan tetap mempertahankan peran paternal yang dinyatakan teks.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan, bukan menggeneralisasikannya hanya sebagai 'anak-anak'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan pola silsilah teks Ibrani; 'memperanakkan' dipilih karena tepat dan masih jelas dalam konteks genealogi.
