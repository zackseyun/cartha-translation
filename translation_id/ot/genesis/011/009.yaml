  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: id
  text: Itulah sebabnya kota itu dinamai Babel[a], karena di sana Yahweh mengacaukan bahasa seluruh bumi, dan dari sana Yahweh menyerakkan mereka ke seluruh muka bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Babel terdengar mirip dengan kata kerja Ibrani balal, yang berarti “mengacaukan” atau “mencampur”; kemiripan bunyi ini menjelaskan nama tersebut dalam ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini secara alami menyatakan kesimpulan sekaligus alasan penamaan dalam bahasa Indonesia modern.
- source_word: קָרָא שְׁמָהּ
  choice: kota itu dinamai
  rationale: Bentuk pasif menghindari penambahan subjek yang tidak disebutkan dalam teks. Kata 'kota' dijelaskan oleh konteks dekat dan membuat rujukan sufiks feminin lebih jelas bagi pembaca Indonesia.
- source_word: בָּבֶל
  choice: Babel
  rationale: Nama diri dipertahankan melalui transliterasi; permainan bunyinya dengan בָּלַל dijelaskan dalam catatan kaki.
- source_word: כִּי שָׁם
  choice: karena di sana
  rationale: Mempertahankan hubungan kausal yang menjelaskan penamaan Babel.
- source_word: בָּלַל
  choice: mengacaukan
  rationale: Dalam konteks ini verba tersebut menunjuk pada tindakan membuat bahasa manusia menjadi kacau atau tercampur; 'mengacaukan' jelas dan idiomatis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: bahasa seluruh bumi
  rationale: שָׂפָה secara harfiah berarti 'bibir', tetapi di sini merupakan metonimia untuk bahasa atau tutur. Bentuk tunggal 'bahasa' dipertahankan.
- source_word: וּמִשָּׁם
  choice: dan dari sana
  rationale: Mempertahankan kaitan naratif dengan tempat yang baru disebutkan.
- source_word: הֱפִיצָם
  choice: menyerakkan mereka
  rationale: Bentuk Hifil menyatakan bahwa Yahweh menyebabkan mereka tersebar; 'menyerakkan' mempertahankan daya tindakan tersebut.
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: ke seluruh muka bumi
  rationale: Mempertahankan citra ungkapan Ibrani 'di atas muka seluruh bumi' dalam susunan Indonesia yang alami dan sesuai dengan gerak penyebaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan אֶרֶץ dalam frasa berulang כָּל־הָאָרֶץ
  choice: seluruh bumi
  alternative: seluruh negeri
  rationale: Konteks penyebaran umat manusia mendukung cakupan 'bumi', tetapi pengulangan frasa Ibrani tetap dipertahankan dan tidak diperluas menjadi penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan dibuat alami tanpa menghilangkan pengulangan 'Yahweh' dan 'seluruh ... bumi' yang menonjol dalam teks Ibrani.
