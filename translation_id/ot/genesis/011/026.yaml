  text: וַֽ/יְחִי תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֨וֹלֶד֙ אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: id
  text: Ketika Terah berumur tujuh puluh tahun, ia menjadi ayah dari Abram[a], Nahor, dan Haran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani dalam silsilah ini juga dapat diterjemahkan “memperanakkan”. Susunan nama-nama itu tidak harus menunjukkan urutan kelahiran, dan ayat ini tidak mengharuskan bahwa ketiganya lahir bersamaan.
    reason: Menjelaskan alternatif leksikal dan menjaga agar pembaca tidak menarik kesimpulan kronologis yang tidak diwajibkan oleh teks Ibrani.
lexical_decisions:
- source_word: וַיְחִי
  choice: Ketika Terah berumur
  rationale: Dalam pemberitahuan silsilah ini, bentuk dari חיה menyatakan usia yang telah dicapai Terah. Ungkapan Indonesia ini alami dan menghubungkan usia tersebut dengan pemberitahuan tentang keturunannya.
- source_word: שִׁבְעִים שָׁנָה
  choice: tujuh puluh tahun
  rationale: Menyatakan usia Terah secara langsung dalam bahasa Indonesia modern.
- source_word: וַיּוֹלֶד
  choice: menjadi ayah dari
  rationale: Dalam konteks silsilah, ילד menyatakan bahwa Terah memperanakkan atau menjadi ayah dari orang-orang yang disebutkan, bukan tindakan melahirkan oleh seorang ibu. Pilihan ini jelas dan wajar bagi pembaca modern.
- source_word: אֶת ... אֶת ... וְאֶת
  choice: Abram, Nahor, dan Haran
  rationale: Pengulangan penanda objek menandai setiap nama secara tersendiri. Daftar dengan koma dan kata 'dan' merupakan bentuk alami dalam bahasa Indonesia tanpa menghilangkan makna sumber.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama pribadi dipertahankan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָרָן
  choice: Haran
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia; unsur ה pada ejaan Ibrani di sini merupakan bagian dari bentuk nama, bukan kata sandang yang perlu diterjemahkan.
theological_decisions:
- issue: Urutan silsilah dan kaitannya dengan usia Terah
  choice: Ayat diterjemahkan sebagai pemberitahuan silsilah bahwa ketika Terah berumur tujuh puluh tahun, ia menjadi ayah dari Abram, Nahor, dan Haran, tanpa menetapkan bahwa urutan nama adalah urutan kelahiran atau bahwa ketiganya lahir bersamaan.
  alternative: Memahami daftar itu sebagai urutan kelahiran yang ketat, atau memahami usia tujuh puluh tahun hanya sebagai saat Terah mulai mempunyai anak.
  rationale: Teks Ibrani mengaitkan usia tujuh puluh tahun dengan diperanakkannya ketiga nama itu, tetapi tidak menyelesaikan seluruh persoalan kronologis yang muncul dari ayat-ayat berikutnya. Terjemahan dan catatan kaki mempertahankan ketegangan tersebut tanpa memasukkan harmonisasi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan 'menjadi ayah dari' dipilih agar makna genealogis jelas tanpa memakai bentuk yang terasa arkais; catatan kaki mempertahankan alternatif yang lebih harfiah serta ambiguitas kronologis.
