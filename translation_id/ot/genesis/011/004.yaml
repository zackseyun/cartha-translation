  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: id
  text: Lalu mereka berkata, “Mari kita membangun sebuah kota dan sebuah menara untuk diri kita sendiri, yang puncaknya di langit[a]. Mari kita membangun nama bagi diri kita sendiri, supaya kita tidak tercerai-berai di seluruh muka bumi[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang puncaknya mencapai langit.” Secara harfiah, bahasa Ibrani berbunyi “yang puncaknya di langit.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “supaya kita tidak tersebar di seluruh muka bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Mari
  rationale: Kata seru ini mengajak orang lain melakukan tindakan bersama; “Mari” alami dalam bahasa Indonesia modern dan mempertahankan daya ajakannya.
- source_word: נִבְנֶה לָּנוּ
  choice: mari kita bangun bagi kita
  rationale: Bentuk orang pertama jamak menyatakan ajakan atau tekad bersama. Frasa “bagi kita” mempertahankan datif לָּנוּ tanpa mengubahnya menjadi makna kepemilikan yang terlalu eksplisit.
- source_word: עִיר וּמִגְדָּל
  choice: sebuah kota dan sebuah menara
  rationale: “Kota” dan “menara” merupakan padanan dasar yang tepat; konteks tidak mengharuskan fungsi militer atau jenis bangunan tertentu.
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: yang puncaknya di langit
  rationale: Terjemahan ini mempertahankan pernyataan lokasi yang harfiah dan gambaran tinggi yang kuat tanpa menambahkan kata “mencapai,” yang tidak dinyatakan secara eksplisit.
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: Mari kita membuat nama bagi kita sendiri
  rationale: Ungkapan “membuat nama” mempertahankan idiom dan daya sastra bahasa Ibrani; “bagi kita sendiri” menyampaikan kepentingan diri yang dinyatakan oleh לָּנוּ.
- source_word: פֶּן נָפוּץ
  choice: supaya kita tidak tercerai-berai
  rationale: פֶּן memperkenalkan tujuan negatif atau akibat yang ditakuti. “Supaya ... tidak” alami dalam bahasa Indonesia, sedangkan “tercerai-berai” menyampaikan penyebaran kelompok manusia tanpa harus menentukan pelakunya.
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: di seluruh muka bumi
  rationale: Padanan ini mempertahankan idiom “muka bumi” dan cakupan global yang sesuai dengan konteks kisah purba dalam Kejadian.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam kisah Babel
  choice: bumi
  alternative: negeri
  rationale: Dalam konteks kisah purba Kejadian 11, yang dibicarakan ialah penyebaran umat manusia ke seluruh dunia, bukan hanya di suatu wilayah setempat.
- issue: Makna puncak menara בַשָּׁמַיִם
  choice: di langit
  alternative: mencapai langit
  rationale: Bahasa Ibrani secara harfiah menyatakan bahwa puncaknya “di langit” dan tidak memakai verba “mencapai.” Teks utama mempertahankan gambaran hiperbolis itu, sementara alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ajakan berulang dipertahankan agar gerak retoris ucapan itu terasa. Ungkapan “puncaknya di langit,” “membuat nama,” dan “muka bumi” dipilih untuk menjaga citra serta hubungan sastra teks Ibrani, dengan catatan kaki bagi alternatif yang lebih idiomatis.
