  to: Lalu mereka berkata, “Mari kita membangun sebuah kota dan sebuah menara untuk diri kita sendiri, yang puncaknya di langit[a]. Mari kita membangun nama bagi diri kita sendiri, supaya kita tidak tercerai-berai di seluruh muka bumi[b].”
