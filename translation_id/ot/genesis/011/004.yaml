  naturalness: “Mari kita bangun bagi kita” dan terutama “membuat nama bagi kita sendiri” terdengar sebagai calque. “Membangun ... untuk diri kita sendiri” dan “membangun nama bagi diri kita sendiri” lebih wajar dalam bahasa Indonesia baku tanpa mengubah maksud.
  terminology: “Kota,” “menara,” “puncaknya di langit,” “muka bumi,” dan “tercerai-berai” tepat. “Membangun nama” merupakan idiom Indonesia yang lazim untuk makna membuat reputasi atau kemasyhuran, sambil mempertahankan unsur “nama” dari bahasa Ibrani.
