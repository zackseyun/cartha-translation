  text: Nahor lived twenty-nine years and fathered Terah.
translation:
  language: id
  text: Nahor berumur dua puluh sembilan tahun ketika ia menjadi ayah Terah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, verba חיה menyatakan usia yang telah dicapai sebelum peristiwa berikutnya. Konstruksi alami bahasa Indonesia adalah 'ketika ... berumur'.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: dua puluh sembilan tahun
  rationale: Urutan bilangan Ibrani secara harfiah 'sembilan dan dua puluh'; urutan dibalik sesuai pemakaian baku bahasa Indonesia.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas dan mempertahankan corak genealogis.
- source_word: אֶת
  choice: tidak diterjemahkan tersendiri
  rationale: Penanda objek langsung ini tidak memiliki padanan mandiri dalam bahasa Indonesia.
- source_word: תָּרַח
  choice: Terah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
