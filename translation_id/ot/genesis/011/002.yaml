  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: id
  text: Ketika mereka melakukan perjalanan dari timur[a], mereka menemukan sebuah dataran di tanah Sinear dan menetap di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika mereka bergerak ke arah timur.” Frasa Ibrani מִקֶּדֶם dapat menunjukkan tempat asal (“dari timur”) atau arah perjalanan (“ke arah timur”).
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: Ketika mereka berangkat
  rationale: Konstruksi וַיְהִי dengan klausa temporal diserap secara alami menjadi “Ketika,” sedangkan נסע menggambarkan pembongkaran perkemahan dan perjalanan selanjutnya. “Berangkat” alami dalam bahasa Indonesia dan tidak melebihkan gagasan perpindahan penduduk.
- source_word: מִקֶּדֶם
  choice: dari sebelah timur
  rationale: Preposisi מִן paling lazim menunjukkan asal, sehingga bacaan “dari sebelah timur” ditempatkan dalam teks utama. Kemungkinan makna arah, “ke arah timur,” dipertahankan dalam catatan kaki.
- source_word: וַיִּמְצְאוּ
  choice: mereka menemukan
  rationale: Terjemahan langsung dan wajar dari מצא dalam konteks ini.
- source_word: בִקְעָה
  choice: sebuah dataran
  rationale: Kata ini menunjuk dataran luas atau lembah lebar; “dataran” sesuai dengan konteks geografis dan mudah dipahami.
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: di tanah Sinear
  rationale: אֶרֶץ dipertahankan sebagai sebutan geografis “tanah,” sedangkan nama tempat שִׁנְעָר ditransliterasikan dalam bentuk Indonesia yang lazim, “Sinear.”
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: lalu menetap di sana
  rationale: Dalam konteks perjalanan, ישב menyatakan bahwa mereka tinggal dan berhenti berpindah; “menetap” menangkap kedua unsur itu. “Lalu” menandai kelanjutan naratif tanpa membuat hubungan sebab-akibat.
