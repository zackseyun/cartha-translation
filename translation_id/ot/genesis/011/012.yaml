  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: id
  text: Ketika Arpakhsad berumur tiga puluh lima tahun, ia menjadi ayah Selah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: Arpakhsad
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; konjungsi וְ tidak diterjemahkan secara tersendiri karena urutan silsilah sudah tersampaikan secara alami dalam bahasa Indonesia.
- source_word: חַי
  choice: hidup
  rationale: Dalam rumus umur silsilah, kata ini menyatakan bahwa seseorang telah hidup sampai umur yang disebutkan.
- source_word: חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: tiga puluh lima tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'lima dan tiga puluh', tetapi urutan baku bahasa Indonesia ialah 'tiga puluh lima'.
- source_word: וַ/יּוֹלֶד
  choice: lalu memperanakkan
  rationale: Bentuk kausatif יָלַד dalam silsilah berarti menjadi ayah atau menghasilkan keturunan; 'memperanakkan' mempertahankan ketepatan genealogis dan gaya yang bermartabat.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Partikel ini menandai objek langsung tentu dan fungsinya sudah dinyatakan oleh susunan kalimat bahasa Indonesia.
- source_word: שָׁלַח
  choice: Selah
  rationale: Bentuk nama mengikuti transliterasi lazim bahasa Indonesia yang dekat dengan nama Ibrani שָׁלַח.
theological_decisions:
- issue: Cakupan makna וַיּוֹלֶד dalam silsilah
  choice: memperanakkan
  alternative: menjadi ayah dari
  rationale: Pilihan ini mempertahankan rumus genealogis tanpa memastikan lebih jauh apakah hubungan yang dimaksud harus selalu dipahami sebagai keturunan langsung; bahasa silsilah Ibrani dapat digunakan dalam rangkaian keturunan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Arpakhsad' dan 'Selah' digunakan sebagai bentuk nama yang dekat dengan teks Ibrani; 'memperanakkan' dipilih sebagai istilah silsilah yang masih mudah dipahami.
