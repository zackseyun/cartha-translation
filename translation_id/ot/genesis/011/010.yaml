base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: id
  text: Inilah silsilah Sem. Sem berumur seratus tahun ketika ia menjadi ayah Arpakhsad[a], dua tahun sesudah air bah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini kadang-kadang ditulis “Arfaksad”, mengikuti bentuk Yunani, bukan bentuk Ibraninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת
  choice: Inilah keturunan
  rationale: Formula pembuka silsilah dalam Kitab Kejadian. Terjemahan ini mempertahankan fungsi genealogisnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: שֵׁם
  choice: Sem
  rationale: Bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן מְאַת שָׁנָה
  choice: berumur seratus tahun
  rationale: Mengungkapkan idiom usia Ibrani, yang secara harfiah berarti 'anak laki-laki seratus tahun', dalam bahasa Indonesia yang wajar.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan tindakan laki-laki menurunkan atau menjadi ayah seorang anak; 'memperanakkan' ringkas dan mempertahankan corak genealogis.
- source_word: אַרְפַּכְשָׁד
  choice: Arpakhsad
  rationale: Transliterasi yang mengikuti bentuk nama Ibrani secara langsung; bentuk tradisional yang dipengaruhi bahasa Yunani dicatat sebagai alternatif.
- source_word: שְׁנָתַיִם
  choice: dua tahun
  rationale: Menerjemahkan bentuk dual kata 'tahun' secara langsung.
- source_word: אַחַר הַמַּבּוּל
  choice: sesudah air bah
  rationale: Frasa temporal dengan nomina tentu, yang dalam konteks Kejadian menunjuk kepada air bah pada zaman Nuh; 'air bah' merupakan ungkapan Indonesia yang mapan dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan ketepatan usia Sem, tindakan memperanakkan, dan jarak waktu dua tahun sesudah air bah. Penanda catatan kaki ditempatkan setelah nama yang dijelaskannya.
