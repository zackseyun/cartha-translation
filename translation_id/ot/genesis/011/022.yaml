  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Susunan 'Ketika ... berumur ...' memperjelas idiom usia Ibrani tanpa menambah isi, sedangkan 'memperanakkan' mempertahankan gaya silsilah.
