  text: Serug lived thirty years and fathered Nahor.
translation:
  language: id
  text: Ketika Serug berumur tiga puluh tahun, ia menjadi ayah Nahor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, verba חיה yang diikuti jumlah tahun menyatakan usia tokoh. 'Berumur' menyampaikan maksud idiom Ibrani secara alami dalam bahasa Indonesia.
- source_word: שְׂרוּג
  choice: Serug
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: tiga puluh tahun
  rationale: Ungkapan usia Ibrani ini diterjemahkan dengan bentuk baku dan alami dalam bahasa Indonesia.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah menyatakan bahwa tokoh laki-laki menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas dan mempertahankan corak genealogis teks.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
- source_word: נָחוֹר
  choice: Nahor
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
