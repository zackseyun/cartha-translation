base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: id
  text: Sesudah menjadi ayah bagi Arpakhsad, Sem hidup lima ratus tahun lagi dan menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam pola silsilah ini, verba חיה menyatakan kelanjutan masa hidup setelah kelahiran tokoh yang disebut; 'hidup ... lagi' alami dalam bahasa Indonesia dan mempertahankan arti duratifnya.
- source_word: שֵׁם
  choice: Sem
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: setelah memperanakkan
  rationale: אַחֲרֵי menandai waktu sesudah peristiwa tersebut, sedangkan bentuk Hifil ילד dengan subjek laki-laki menyatakan bahwa Sem menjadi ayah atau menghasilkan keturunan; 'memperanakkan' ringkas dan cocok bagi register silsilah.
- source_word: אַרְפַּכְשָׁד
  choice: Arpakhsad
  rationale: Transliterasi ini mempertahankan unsur konsonantal nama Ibrani dan tetap mudah dibaca oleh pembaca Indonesia.
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: lima ratus tahun
  rationale: Padanan langsung dan alami untuk keterangan lamanya hidup.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Mengulang padanan untuk akar ילד demi mempertahankan pola genealogis dan makna generatifnya.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Bahasa Ibrani menyebut kedua jenis kelamin secara eksplisit; padanan ini lebih tepat daripada istilah umum 'anak-anak' saja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat dengan susunan yang alami. Istilah 'memperanakkan' dipilih karena tepat untuk formula silsilah, meski agak formal; pengulangan verba dipertahankan untuk mencerminkan struktur teks Ibrani.
