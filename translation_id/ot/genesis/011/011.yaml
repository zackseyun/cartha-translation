  source_fidelity: Teks Ibrani menyatakan bahwa Sem hidup lima ratus tahun sesudah ia menjadi ayah Arpakhsad, lalu ia menjadi ayah bagi anak-anak lelaki dan perempuan. Durasi, urutan waktu, nama, dan penyebutan eksplisit kedua jenis kelamin perlu dipertahankan.
  naturalness: Kalimat draf pada dasarnya lancar, tetapi "memperanakkan" untuk subjek laki-laki terasa kurang alami dalam bahasa Indonesia modern karena lazimnya berasosiasi dengan melahirkan. "Menjadi ayah bagi" lebih idiomatis dan secara eksplisit menyampaikan peran laki-laki yang ditandai bentuk Hifil Ibrani.
