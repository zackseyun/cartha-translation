translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan klausa waktu di depan serta kata ‘lagi’ membuat hubungan kronologis jelas tanpa mengubah isi sumber. Istilah ‘memperanakkan’ dipertahankan karena tepat untuk konteks silsilah, meskipun lebih formal daripada bahasa percakapan.
