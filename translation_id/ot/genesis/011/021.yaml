base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah bagi Serug, Rehu hidup 207 tahun lagi dan mempunyai anak-anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, חיה berarti ‘hidup’; kata ‘lagi’ secara alami menyatakan bahwa masa tersebut berlangsung sesudah kelahiran Serug.
- source_word: רְעוּ
  choice: Rehu
  rationale: Bentuk ‘Rehu’ mengikuti ejaan nama yang lazim dalam tradisi Alkitab berbahasa Indonesia dan cukup dekat dengan nama Ibrani.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: Setelah memperanakkan Serug
  rationale: Hifil ילד dengan subjek laki-laki menyatakan bahwa Rehu menjadi ayah Serug. ‘Memperanakkan’ mempertahankan nuansa genealogis dan hubungan ayah-anak secara ringkas.
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 207 tahun
  rationale: Urutan bilangan Ibrani secara idiomatis dinyatakan dalam tata urutan angka bahasa Indonesia; bentuk angka mudah dibaca dalam daftar silsilah.
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: dan memperanakkan anak-anak lelaki dan perempuan
  rationale: Terjemahan mempertahankan kata kerja genealogis serta penyebutan eksplisit keturunan laki-laki dan perempuan.
