base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/016.yaml
  text: Eber lived thirty-four years and fathered Peleg.
translation:
  language: id
  text: Ketika Eber berumur tiga puluh empat tahun, ia memperanakkan Peleg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Ketika ... berumur
  rationale: Dalam rumus silsilah ini, חיה menyatakan usia tokoh saat peristiwa berikutnya terjadi. Konstruksi temporal ini alami dalam bahasa Indonesia dan mempertahankan hubungan antarklausa.
- source_word: עֵבֶר
  choice: Eber
  rationale: Nama pribadi ini ditransliterasikan langsung dari bahasa Ibrani dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: tiga puluh empat tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'empat dan tiga puluh', tetapi susunan alami bahasa Indonesia adalah 'tiga puluh empat'.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk kausatif ילד dengan subjek laki-laki berarti menjadi ayah biologis atau menghasilkan keturunan. 'Memperanakkan' ringkas dan tepat untuk rumus silsilah.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan tersendiri yang diperlukan dalam bahasa Indonesia.
- source_word: פָּלֶג
  choice: Peleg
  rationale: Nama pribadi ini ditransliterasikan langsung dari bahasa Ibrani dengan bentuk yang lazim dalam bahasa Indonesia.
