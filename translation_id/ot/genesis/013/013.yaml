  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְ/חַטָּאִ֑ים לַ/יהוָ֖ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/013.yaml
  text: The men of Sodom were exceedingly wicked and sinful against Yahweh[a].
translation:
  language: id
  text: Orang-orang Sodom sangat jahat dan berdosa terhadap Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di hadapan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַנְשֵׁי
  choice: Orang-orang
  rationale: Bentuk jamak konstruktus dari אִישׁ menunjuk kepada para lelaki atau penduduk Sodom. Dalam bahasa Indonesia, “orang-orang Sodom” paling alami dan tidak menyiratkan seluruh penduduk tanpa kecuali; wawasan bahwa yang dimaksud ialah kaum lelaki dapat dicatat secara leksikal tanpa membuat terjemahan kaku. Prefiks וְ berfungsi sebagai penghubung dalam narasi dan tidak perlu selalu dinyatakan dengan “dan” pada awal kalimat.
- source_word: סְדֹם
  choice: Sodom
  rationale: Nama tempat ditransliterasikan menurut bentuk baku bahasa Indonesia.
- source_word: רָעִים
  choice: jahat
  rationale: Dalam konteks moral, רָעִים menyatakan kejahatan etis, bukan sekadar keadaan buruk atau tidak menyenangkan.
- source_word: וְ/חַטָּאִים
  choice: dan berdosa
  rationale: Predikat jamak ini sejajar dengan רָעִים dan menggambarkan mereka sebagai orang yang dicirikan oleh dosa. “Berdosa” alami dalam bahasa Indonesia dan mempertahankan fungsi predikatifnya.
- source_word: לַ/יהוָה
  choice: terhadap Yahweh
  rationale: Dengan bahasa dosa, ל dapat menandai pihak yang menjadi sasaran pelanggaran. “Terhadap Yahweh” menyampaikan daya relasional dan moral ungkapan itu tanpa meniadakan kemungkinan arti “di hadapan Yahweh,” yang dicatat dalam catatan kaki.
- source_word: מְאֹד
  choice: sangat
  rationale: מְאֹד memperkuat keseluruhan predikasi. “Sangat” merupakan penguat yang kuat, alami, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Daya makna לַיהוָה bersama חַטָּאִים
  choice: terhadap Yahweh
  alternative: di hadapan Yahweh
  rationale: Konstruksi ini dapat menyatakan dosa yang dilakukan terhadap Yahweh atau dosa di hadapan-Nya. Teks utama memakai makna sasaran pelanggaran, sedangkan kemungkinan lokatif/evaluatif yang sungguh ada dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Pengulangan “orang-orang” sesuai idiom Indonesia; susunan predikat mempertahankan penekanan moral dan intensitas teks Ibrani.
