  naturalness: “Orang-orang Sodom sangat jahat dan berdosa terhadap Yahweh” alami, lugas, dan sesuai ragam Bahasa Indonesia standar modern. Konstruksi “orang-orang Sodom” adalah padanan idiomatis yang baik bagi sebutan penduduk laki-laki kota itu tanpa membuat kalimat menjadi kaku.
  terminology: “Yahweh” konsisten dengan keputusan penerjemahan nama ilahi yang diberikan. “Jahat,” “berdosa,” dan “terhadap” menyampaikan istilah moral dan relasional teks tanpa menambahkan penafsiran sektarian.
