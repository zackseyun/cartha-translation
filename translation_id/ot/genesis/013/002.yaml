  text: וְ/אַבְרָ֖ם כָּבֵ֣ד מְאֹ֑ד בַּ/מִּקְנֶ֕ה בַּ/כֶּ֖סֶף וּ/בַ/זָּהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/002.yaml
  text: Abram was very wealthy in livestock[a], silver, and gold.
translation:
  language: id
  text: Abram[a] sangat kaya akan ternak, perak, dan emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Dan Abram sangat kaya akan ternak, perak, dan emas.'
    reason: Konjungsi Ibrani וְ dapat dinyatakan secara eksplisit sebagai “Dan”, meskipun dalam narasi bahasa Indonesia hubungan antarkalimat tetap alami tanpa kata itu.
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Nama אַבְרָם ditransliterasikan sebagai “Abram”. Konjungsi וְ melanjutkan alur narasi, tetapi tidak perlu dinyatakan dalam kalimat utama karena bahasa Indonesia modern dapat menghubungkan narasi secara alami tanpa “dan” pada awal kalimat; kemungkinan eksplisitnya dicatat dalam catatan kaki.
- source_word: כָּבֵד מְאֹד
  choice: sangat kaya
  rationale: כָּבֵד secara harfiah berarti “berat”, tetapi bersama daftar harta benda ungkapan ini secara idiomatis menyatakan kekayaan yang besar. מְאֹד memberi penegasan dan diterjemahkan “sangat”.
- source_word: בַּ/מִּקְנֶה
  choice: akan ternak
  rationale: מִקְנֶה dalam konteks kehidupan leluhur terutama menunjuk pada hewan peliharaan berupa kawanan ternak. Konstruksi “kaya akan ternak” menyampaikan fungsi preposisi ב secara alami dalam bahasa Indonesia.
- source_word: בַּ/כֶּסֶף
  choice: perak
  rationale: כֶּסֶף menunjuk pada perak sebagai salah satu bentuk kekayaan. Preposisinya tercakup secara alami oleh frasa “kaya akan” yang berlaku bagi seluruh daftar.
- source_word: וּ/בַ/זָּהָב
  choice: dan emas
  rationale: זָהָב berarti “emas”; konjungsi וּ diterjemahkan “dan”. Preposisinya tidak diulang karena cakupan “akan” sudah jelas dalam daftar bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan wajar. Ungkapan idiomatis “sangat kaya akan” mempertahankan makna כָּבֵד מְאֹד tanpa terjemahan harfiah yang menyesatkan, sementara daftar jenis kekayaan tetap utuh.
