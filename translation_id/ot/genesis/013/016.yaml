  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׂמְתִּ֥י אֶֽת זַרְעֲ/ךָ֖ כַּ/עֲפַ֣ר הָ/אָ֑רֶץ אֲשֶׁ֣ר אִם יוּכַ֣ל אִ֗ישׁ לִ/מְנוֹת֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ גַּֽם זַרְעֲ/ךָ֖ יִמָּנֶֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/016.yaml
  text: And I will make your offspring like the dust of the earth[a], so that if a man can count the dust of the earth[b], then your offspring also can be counted.
translation:
  language: id
  text: Aku akan membuat keturunanmu[a] seperti debu tanah, sehingga jika seseorang[b] dapat menghitung debu tanah, keturunanmu pun dapat dihitung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”; kata Ibrani זֶרַע merupakan nomina kolektif yang dapat merujuk kepada keturunan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang laki-laki”; bentuk maskulin tunggal dalam bahasa Ibrani dipakai dengan arti generik.
    reason: source_form
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Aku akan membuat
  rationale: שׂוּם secara harfiah berarti ‘menaruh/menetapkan’, tetapi dengan objek keturunan dan frasa pembanding, maknanya secara idiomatis adalah ‘membuat menjadi’.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע adalah nomina kolektif yang dapat berarti benih atau keturunan. ‘Keturunanmu’ jelas dan alami dalam bahasa Indonesia serta tidak memaksakan pembacaan tunggal tertentu.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: seperti debu tanah
  rationale: Pilihan ini mempertahankan perbandingan dan citra konkret dalam bahasa Ibrani dengan ungkapan Indonesia yang alami.
- source_word: אֲשֶׁר אִם
  choice: sehingga jika
  rationale: 'Rangkaian ini memperkenalkan akibat sekaligus perbandingan bersyarat: keturunan Abram tidak terhitung sebagaimana debu tanah tidak terhitung.'
- source_word: אִישׁ
  choice: seseorang
  rationale: Nomina maskulin tunggal ini berfungsi secara generik dalam konteks tersebut. ‘Seseorang’ menyampaikan cakupan generiknya secara alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לִמְנוֹת ... יִמָּנֶה
  choice: menghitung ... dapat dihitung
  rationale: Bentuk aktif dan Nifal menyatakan tindakan menghitung serta kemungkinan untuk dihitung dalam konstruksi bersyarat.
- source_word: גַּם
  choice: pun
  rationale: ‘Pun’ secara ringkas dan alami menandai kesejajaran antara debu tanah dan keturunan Abram.
theological_decisions:
- issue: Makna kolektif זֶרַע dalam janji kepada Abram
  choice: keturunanmu
  alternative: benihmu
  rationale: Ayat ini membicarakan anak cucu Abram sebagai suatu kolektif yang tak terhitung. ‘Keturunanmu’ mempertahankan makna kontekstual tanpa memasukkan penafsiran mesianik tunggal ke dalam ayat ini.
- issue: Bahasa maskulin generik pada אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Dalam konteks ini bentuk maskulin tunggal memiliki daya generik. Bahasa Indonesia modern lazim memakai ‘seseorang’ untuk fungsi tersebut; bentuk harfiahnya tetap diberi tahu melalui catatan kaki.
- issue: Daya modal יִמָּנֶה dalam klausa bersyarat
  choice: dapat dihitung
  alternative: akan dihitung
  rationale: Konteksnya menyatakan kemungkinan hipotetis, bukan ramalan bahwa keturunan itu benar-benar akan dihitung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Susunan kalimat mempertahankan citra debu tanah dan logika perbandingan bersyarat dari teks Ibrani.
