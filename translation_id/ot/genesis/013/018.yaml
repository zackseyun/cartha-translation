base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/018.yaml
  text: So Abram moved his tent and came and settled by the oaks of Mamre[a], which are at Hebron[b], and there he built an altar to Yahweh.
translation:
  language: id
  text: Lalu Abram memindahkan kemahnya, datang, dan menetap di antara pohon-pohon besar Mamre[a] yang ada di Hebron. Di sana ia membangun sebuah mazbah bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon-pohon tarbantin Mamre” atau “pohon-pohon ek Mamre”; istilah Ibraninya dapat menunjuk pada pohon besar dari jenis yang tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַל
  choice: memindahkan kemahnya
  rationale: Bentuk dari אהל menggambarkan tindakan berkemah atau memindahkan kemah. Dalam urutan narasi ini, pilihan tersebut menyampaikan perpindahan Abram secara alami tanpa menumpangtindihkan makna dengan tindakan datang dan menetap berikutnya.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata kerja gerak yang umum ini dipertahankan secara langsung untuk menjaga urutan tindakan dalam teks Ibrani.
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: Pilihan ini menyampaikan makna tinggal atau berdiam di suatu tempat dalam bahasa Indonesia modern dan wajar.
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: di dekat pohon-pohon besar Mamre
  rationale: אֵלֹנֵי dapat menunjuk pada pohon-pohon besar, dengan jenis yang mungkin pohon tarbantin atau ek. Terjemahan umum ini tidak memastikan spesies yang tidak pasti, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר בְּחֶבְרוֹן
  choice: yang ada di Hebron
  rationale: Anak kalimat relatif ini menunjukkan lokasi pohon-pohon Mamre secara jelas dan alami.
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: Di sana ia membangun sebuah mazbah
  rationale: מִזְבֵּחַ adalah istilah biasa untuk mazbah, dan שָׁם dipertahankan untuk menonjolkan tempat tindakan ibadah tersebut.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa mazbah itu dibangun bagi Yahweh; nama ilahi יהוה ditransliterasikan agar nama perjanjian dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk “Yahweh” mempertahankan nama ilahi sebagai nama diri dan tidak menggantinya dengan gelar, tanpa mengklaim kepastian mutlak mengenai pelafalan kunonya.
- issue: Jenis pohon dalam אֵלֹנֵי מַמְרֵא
  choice: pohon-pohon besar Mamre
  alternative: pohon-pohon tarbantin Mamre; pohon-pohon ek Mamre
  rationale: Identifikasi spesiesnya tidak pasti. Teks utama memakai ungkapan umum yang mempertahankan makna tempat yang ditandai pepohonan besar, sementara kemungkinan spesies dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan tiga kata kerja Ibrani dipertahankan, tetapi tanda baca disesuaikan agar alurnya alami. “Mazbah” dipakai sebagai istilah religius yang mapan, dan “Yahweh” dipertahankan sebagai nama diri ilahi.
