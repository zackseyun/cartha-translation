  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשָּׂא ל֣וֹט אֶת עֵינָ֗י/ו וַ/יַּרְא֙ אֶת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן כִּ֥י כֻלָּ֖/הּ מַשְׁקֶ֑ה לִ/פְנֵ֣י שַׁחֵ֣ת יְהוָ֗ה אֶת סְדֹם֙ וְ/אֶת עֲמֹרָ֔ה כְּ/גַן יְהוָה֙ כְּ/אֶ֣רֶץ מִצְרַ֔יִם בֹּאֲ/כָ֖ה צֹֽעַר־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/010.yaml
  text: Lot lifted up his eyes and saw all the plain of the Jordan[a], that all of it was well watered before Yahweh destroyed Sodom and Gomorrah, like the garden of Yahweh, like the land of Egypt[d][c][b], as you go toward Zoar.
translation:
  language: id
  text: Lot mengangkat matanya dan melihat seluruh Dataran Yordan[a], yang seluruhnya dialiri air dengan baik sebelum Yahweh memusnahkan Sodom dan Gomora, seperti taman Yahweh[b], seperti negeri Mesir, ke arah Zoar.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh Lembah Yordan”; secara lebih harfiah, “seluruh lingkaran Yordan.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “taman Yahweh” kemungkinan mengingatkan pembaca pada kesuburan taman Eden.
    reason: cross_reference
  - marker: c
    text: Secara lebih harfiah, “ketika orang menuju Zoar.” Ungkapan Ibrani ini menunjukkan arah menuju Zoar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: melayangkan pandangannya
  rationale: Ungkapan Ibrani ini berarti mengarahkan pandangan. Padanan ini mempertahankan corak naratifnya tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: כָּל־כִּכַּר הַיַּרְדֵּן
  choice: seluruh Dataran Yordan
  rationale: כִּכָּר di sini menunjuk pada wilayah datar atau distrik di sekitar Yordan. 'Dataran Yordan' jelas secara geografis dan alami dalam bahasa Indonesia.
- source_word: כִּי כֻלָּהּ מַשְׁקֶה
  choice: bahwa ... berlimpah air
  rationale: כִּי memperkenalkan hal yang dilihat Lot, sedangkan מַשְׁקֶה menggambarkan wilayah yang mendapat banyak air atau terairi dengan baik. 'Berlimpah air' menyampaikan keadaan itu secara wajar.
- source_word: לִפְנֵי שַׁחֵת יְהוָה
  choice: sebelum Yahweh memusnahkan
  rationale: לִפְנֵי menyatakan waktu, dan שׁחת dalam konteks ini menunjuk pada penghancuran Sodom dan Gomora oleh Allah.
- source_word: כְּגַן יְהוָה
  choice: seperti taman Yahweh
  rationale: Terjemahan ini mempertahankan perbandingan langsung dalam bahasa Ibrani serta kemungkinan gema taman Eden.
- source_word: כְּאֶרֶץ מִצְרַיִם
  choice: seperti negeri Mesir
  rationale: Kata 'negeri' mencerminkan אֶרֶץ dan mempertahankan sifat geografis dari perbandingan tersebut.
- source_word: בֹּאֲכָה צֹעַר
  choice: ke arah Zoar
  rationale: Ungkapan idiomatis ini menandai arah menuju atau mendekati Zoar; terjemahan tidak memaksakan makna batas wilayah yang tegas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Gema Eden dalam כְּגַן יְהוָה
  choice: taman Yahweh
  alternative: taman Eden
  rationale: Teks secara harfiah mengatakan 'taman Yahweh'. Terjemahan utama mempertahankan ungkapan itu dan tidak menjadikan kemungkinan rujukannya kepada Eden sebagai sesuatu yang eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan hubungan antara apa yang Lot lihat dan keadaan wilayah itu, sedangkan tanda pisah membuat keterangan waktu tetap jelas tanpa menghilangkan alur perbandingan.
