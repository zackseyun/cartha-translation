  to: Lot mengangkat matanya dan melihat seluruh Dataran Yordan[a], yang seluruhnya dialiri air dengan baik sebelum Yahweh memusnahkan Sodom dan Gomora, seperti taman Yahweh[b], seperti negeri Mesir, ke arah Zoar.[c]
