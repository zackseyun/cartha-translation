  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל ל֗וֹט אַל נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣/י וּ/בֵינֶ֔י/ךָ וּ/בֵ֥ין רֹעַ֖/י וּ/בֵ֣ין רֹעֶ֑י/ךָ כִּֽי אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/008.yaml
  text: So Abram said to Lot[a], “Please, let there be no strife between me and you, and between my herdsmen and your herdsmen[b], for we are kinsmen.”
translation:
  language: id
  text: Lalu Abram berkata kepada Lot, “Tolong, jangan sampai ada perselisihan antara aku dan engkau, dan antara para gembalaku dan para gembalamu, sebab kita ini saudara.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara” dapat menunjuk kepada kerabat yang lebih luas, bukan hanya kepada saudara kandung. Abram adalah paman Lot.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Abram berkata
  rationale: Waw-konsekutif melanjutkan urutan narasi; “lalu” wajar dalam bahasa Indonesia dan mempertahankan gerak cerita.
- source_word: אַל נָא תְהִי מְרִיבָה
  choice: Tolong, jangan sampai ada perselisihan
  rationale: אַל dengan bentuk jusif menyatakan permintaan negatif, sedangkan נָא melembutkannya. “Tolong, jangan sampai” menyampaikan nada sopan sekaligus keinginan mencegah timbulnya pertikaian.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: antara aku dan engkau
  rationale: Mempertahankan susunan berpasangan yang eksplisit dalam bahasa Ibrani; “engkau” memberi nada bermartabat tanpa menjadi arkais.
- source_word: רֹעַי ... רֹעֶיךָ
  choice: para gembalaku ... para gembalamu
  rationale: Bentuk partisip dari רעה menunjuk kepada para penjaga atau pemelihara ternak. “Gembala” adalah istilah Indonesia yang lazim dan tidak harus terbatas pada domba dalam konteks ini.
- source_word: וּבֵין
  choice: atau antara
  rationale: Walaupun ו secara bentuk berarti “dan”, dalam permintaan agar konflik tidak terjadi pada kedua lingkup relasi, “atau” menyampaikan cakupan negatif secara alami dalam bahasa Indonesia tanpa mengubah maksud.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi permohonan Abram.
- source_word: אֲנָשִׁים אַחִים אֲנָחְנוּ
  choice: kita ini saudara
  rationale: Ungkapan ini menekankan ikatan kekerabatan. “Saudara” alami dalam bahasa Indonesia dan dapat mencakup kerabat yang bukan saudara kandung; “kita” tepat karena mencakup pembicara dan lawan bicara.
theological_decisions:
- issue: Makna אַחִים bagi hubungan Abram dan Lot
  choice: saudara
  alternative: kerabat; orang-orang yang bersaudara
  rationale: Abram adalah paman Lot, sehingga אַחִים di sini bukan berarti saudara kandung secara biologis. Namun, mempertahankan “saudara” menjaga metafora kekerabatan dan daya retoris teks, sementara catatan kaki menjelaskan cakupan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Pengulangan “antara” dipertahankan untuk mencerminkan struktur sumber. Pronomina “aku–engkau” dipilih sesuai percakapan personal dalam narasi Alkitab; “kita” menyatakan kelompok yang mencakup Abram dan Lot.
