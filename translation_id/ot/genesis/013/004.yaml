  text: אֶל מְקוֹם֙ הַ/מִּזְבֵּ֔חַ אֲשֶׁר עָ֥שָׂה שָׁ֖ם בָּ/רִאשֹׁנָ֑ה וַ/יִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/004.yaml
  text: to the place of the altar that he had made there at first[b][a]. And there Abram called on the name of Yahweh.
translation:
  language: id
  text: ke tempat mezbah yang pernah dibuatnya di sana. Di sana Abram memanggil nama Yahweh.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”. Bentuk transliterasi lain ialah “Yahweh” dan “Yehuwa”.'
    reason: alternative_reading
  - marker: b
    text: Atau “berseru kepada Yahweh” atau “menyerukan nama Yahweh”. Ungkapan Ibrani ini dapat mencakup permohonan maupun pewartaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹם הַמִּזְבֵּחַ
  choice: tempat mezbah
  rationale: Terjemahan langsung dan alami untuk lokasi mezbah yang telah disebut sebelumnya.
- source_word: אֲשֶׁר עָשָׂה שָׁם בָּרִאשֹׁנָה
  choice: yang dahulu dibuatnya di sana
  rationale: Bentuk ini mempertahankan acuan pada tindakan Abram sebelumnya; 'dahulu' lebih alami daripada 'pada mulanya' dalam konteks kunjungan terdahulu.
- source_word: וַיִּקְרָא שָׁם אַבְרָם
  choice: Di sanalah Abram berseru
  rationale: Partikel -lah memberi penekanan lokasi yang sejalan dengan pengulangan שָׁם, sedangkan 'berseru' sesuai dengan idiom pemanggilan dalam ibadah.
- source_word: בְּשֵׁם יְהוָה
  choice: kepada nama Yahweh
  rationale: Dalam idiom קרא בשם, 'berseru kepada nama' mempertahankan gambaran Ibrani dan keterarahan seruan kepada Yahweh, tanpa membatasinya hanya pada doa atau pewartaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar; ini sesuai dengan bukti teks sumber dan keputusan istilah yang diberikan.
- source_word: אַבְרָם
  choice: Abram
  rationale: Transliterasi baku nama pribadi sebelum perubahan namanya menjadi Abraham.
theological_decisions:
- issue: Makna idiom קרא בשם יהוה
  choice: berseru kepada nama Yahweh
  alternative: menyerukan nama Yahweh / memanggil Yahweh dengan nama-Nya
  rationale: Idiom ini dapat mencakup permohonan atau penyembahan sekaligus pewartaan. Teks utama memakai ungkapan yang cukup luas, dan catatan kaki mempertahankan kemungkinan lainnya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama pribadi ilahi dalam teks utama; padanan tradisional dan alternatif transliterasi dicatat tanpa menjadikannya pembacaan utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pengulangan penunjuk tempat dalam bahasa Ibrani tanpa terasa kaku. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
