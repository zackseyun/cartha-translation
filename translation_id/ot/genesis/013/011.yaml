  text: וַ/יִּבְחַר ל֣/וֹ ל֗וֹט אֵ֚ת כָּל כִּכַּ֣ר הַ/יַּרְדֵּ֔ן וַ/יִּסַּ֥ע ל֖וֹט מִ/קֶּ֑דֶם וַ/יִּפָּ֣רְד֔וּ אִ֖ישׁ מֵ/עַ֥ל אָחִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/011.yaml
  text: So Lot chose for himself all the plain of the Jordan[a], and Lot journeyed eastward; and they separated from each other.
translation:
  language: id
  text: Lalu Lot memilih bagi dirinya seluruh Dataran Yordan dan Lot berangkat ke arah timur[a], lalu mereka berpisah satu sama lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari sebelah timur.” Ungkapan Ibrani ini dapat menunjukkan arah perjalanan ataupun titik asal.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: memilih bagi dirinya
  rationale: Mempertahankan arti בחר, “memilih,” serta datif לוֹ yang menegaskan bahwa Lot memilih untuk kepentingannya sendiri.
- source_word: כָּל כִּכַּר הַיַּרְדֵּן
  choice: seluruh Dataran Yordan
  rationale: כִּכָּר dalam konteks geografis menunjuk kawasan datar di sekitar Sungai Yordan; “Dataran Yordan” alami dalam bahasa Indonesia dan tidak memaksakan arti harfiah “lingkaran.”
- source_word: וַיִּסַּע
  choice: berangkat
  rationale: נסע kerap menggambarkan membongkar perkemahan lalu bergerak pergi; “berangkat” menyampaikan gerak naratif itu secara ringkas dan wajar.
- source_word: מִקֶּדֶם
  choice: ke arah timur
  rationale: Dalam konteks ini dipahami sebagai arah perjalanan Lot. Karena bentuk Ibraninya juga dapat berarti titik asal, kemungkinan “dari sebelah timur” dicatat dalam catatan kaki.
- source_word: וַיִּפָּרְדוּ אִישׁ מֵעַל אָחִיו
  choice: mereka berpisah satu sama lain
  rationale: Bentuk Nifal menyatakan perpisahan timbal balik. Ungkapan distributif harfiah “seorang dari saudaranya” secara idiomatis berarti keduanya berpisah; “satu sama lain” alami dalam bahasa Indonesia tanpa mengubah rujukan.
theological_decisions:
- issue: Bahasa kekerabatan bergender dalam אִישׁ מֵעַל אָחִיו
  choice: satu sama lain
  alternative: masing-masing dari saudaranya
  rationale: Konteks jelas merujuk kepada dua laki-laki yang berkerabat, tetapi ungkapan Ibrani bersifat distributif dan menyatakan perpisahan timbal balik. Padanan idiomatis Indonesia menghindari kekakuan tanpa meniadakan fakta kekerabatan yang sudah nyata dari konteks.
- issue: Ambiguitas arah מִקֶּדֶם
  choice: ke arah timur
  alternative: dari sebelah timur
  rationale: Bacaan arah perjalanan paling selaras dengan alur pembagian wilayah, tetapi konstruksi Ibrani juga dapat menunjukkan titik asal. Ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. “Dataran Yordan” diperlakukan sebagai nama kawasan geografis; struktur kalimat dijaga alami bagi pembaca umum.
