  yaml_path: translation/ot/genesis/013/005.yaml
  text: And Lot[a], who went with Abram, also had flocks and herds and tents.
translation:
  language: id
  text: Dan Lot, yang menyertai Abram, juga mempunyai kawanan domba dan kambing, kawanan sapi, dan kemah-kemah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “kawanan domba dan kambing” merujuk secara umum kepada ternak kecil, khususnya domba dan kambing; “kawanan sapi” merujuk kepada ternak besar jenis sapi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Gabungan konjungsi dan adverbia menambahkan Lot kepada uraian sebelumnya serta menekankan bahwa Lot pun memiliki kekayaan; dalam bahasa Indonesia, hubungan ini wajar diungkapkan dengan 'juga'.
- source_word: לְלוֹט ... הָיָה
  choice: Lot ... mempunyai
  rationale: Preposisi ל menandai pemilik dalam konstruksi eksistensial, yang secara alami dinyatakan dengan verba kepemilikan 'mempunyai'.
- source_word: הַהֹלֵךְ אֶת אַבְרָם
  choice: yang ikut bersama Abram
  rationale: Partisipel mengidentifikasi Lot sebagai orang yang menyertai Abram. 'Ikut bersama' menyampaikan tindakan menyertai yang sedang berlangsung secara alami dalam bahasa Indonesia.
- source_word: צֹאן
  choice: kawanan kambing domba
  rationale: Istilah ini mencakup ternak kecil, terutama domba dan kambing. 'Kambing domba' ringkas dan lazim, sedangkan 'kawanan' mempertahankan nuansa kolektif.
- source_word: וּבָקָר
  choice: kawanan sapi
  rationale: Kata ini menunjuk ternak besar jenis bovina; 'kawanan sapi' jelas bagi pembaca modern dan sepadan secara kolektif dengan צֹאן.
- source_word: וְאֹהָלִים
  choice: dan kemah-kemah
  rationale: Bentuk jamak secara langsung menunjuk sejumlah kemah; pengulangan nomina merupakan cara alami untuk menandai jamak dalam bahasa Indonesia.
