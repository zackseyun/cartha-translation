source:
  edition: WLC
  text: ק֚וּם הִתְהַלֵּ֣ךְ בָּ/אָ֔רֶץ לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ כִּ֥י לְ/ךָ֖ אֶתְּנֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/017.yaml
  text: Get up[a], walk through the land, through its length and its width[b], for I will give it to you.
translation:
  language: id
  text: Bangkitlah, berjalanlah menjelajahi negeri itu, sepanjang dan selebarnya, sebab Aku akan memberikannya kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֚וּם
  choice: Bangkitlah
  rationale: Imperatif קום memerintahkan Abram untuk bangun dan mulai bertindak; “Bangkitlah” mempertahankan daya perintah dengan ragam yang wajar dan bermartabat.
- source_word: הִתְהַלֵּ֣ךְ
  choice: berjalanlah menjelajahi
  rationale: Bentuk hitpael imperatif dari הלך menunjukkan bergerak atau berjalan berkeliling; “berjalanlah menjelajahi” menyampaikan gerak melintasi wilayah tanpa menyiratkan survei formal.
- source_word: בָּ/אָ֔רֶץ
  choice: negeri itu
  rationale: אֶרֶץ dalam konteks ini menunjuk kepada wilayah yang diperlihatkan kepada Abram, bukan bumi secara umum; “negeri itu” alami dalam bahasa Indonesia dan mempertahankan acuannya.
- source_word: לְ/אָרְכָּ֖/הּ וּ/לְ/רָחְבָּ֑/הּ
  choice: sepanjang dan selebarnya
  rationale: Pasangan “panjang” dan “lebar” menyatakan seluruh bentang wilayah. Ungkapan Indonesia ini mempertahankan merisme sekaligus terdengar alami.
- source_word: כִּ֥י
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perintah sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: לְ/ךָ֖
  choice: kepadamu
  rationale: Pronomina datif menandai Abram sebagai penerima pemberian.
- source_word: אֶתְּנֶֽ/נָּה
  choice: Aku akan memberikannya
  rationale: Imperfek orang pertama tunggal dengan sufiks feminin merujuk kembali kepada אֶרֶץ dan dalam konteks ini menyatakan janji yang akan digenapi.
theological_decisions:
- issue: Acuan sufiks feminin pada אֶתְּנֶנָּה
  choice: Kata “-nya” merujuk kepada negeri itu sebagai pemberian yang dijanjikan kepada Abram.
  alternative: Mengeksplisitkan “negeri itu” sekali lagi pada klausa terakhir.
  rationale: Sufiks feminin tunggal secara gramatikal kembali kepada אֶרֶץ. Pronomina Indonesia mempertahankan hubungan itu tanpa menambahkan penafsiran di luar teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Bangkitlah” dipilih alih-alih “Bangunlah” agar perintah peralihan menuju tindakan terasa jelas; “berjalanlah menjelajahi” mengungkapkan gerak berkeliling yang terkandung dalam bentuk Ibrani. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menghasilkan ambiguitas penting dalam bahasa Indonesia.
