  yaml_path: translation/ot/genesis/013/015.yaml
  text: For all the land that you see[a], I will give to you and to your offspring forever.
translation:
  language: id
  text: Sebab seluruh negeri yang kaulihat akan Kuberikan kepadamu dan kepada keturunanmu[a] untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benihmu.” Kata Ibrani זֶרַע merupakan kata benda kolektif yang dapat berarti “benih”, “keturunan”, atau “anak cucu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan perintah untuk memandang negeri pada ayat sebelumnya dengan penjelasan berupa janji ilahi, tanpa memperkuat hubungan sebab-akibat secara berlebihan.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri
  rationale: Menyatakan keseluruhan wilayah yang terlihat; 'negeri' lebih sesuai daripada 'bumi' dalam konteks janji tanah ini.
- source_word: אֲשֶׁר אַתָּה רֹאֶה
  choice: yang kaulihat
  rationale: Klausa relatif yang alami dan ringkas dalam bahasa Indonesia serta tepat menyampaikan tindakan yang sedang berlangsung dalam konteks.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: akan Kuberikan kepadamu
  rationale: Bentuk imperfek menyatakan janji yang berorientasi ke masa depan, dan לְךָ menandai penerima.
- source_word: וּלְזַרְעֲךָ
  choice: dan kepada keturunanmu
  rationale: '''Keturunan'' adalah padanan Indonesia yang alami bagi nomina kolektif זֶרַע dan tidak memaksakan apakah acuannya tunggal atau jamak.'
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Mempertahankan daya duratif dan bobot janji dalam ungkapan Indonesia yang wajar tanpa menentukan sistem penafsiran eskatologis tertentu.
theological_decisions:
- issue: Durasi עַד עוֹלָם dalam konteks janji negeri
  choice: untuk selama-lamanya
  alternative: untuk waktu yang sangat lama; seterusnya
  rationale: Ungkapan Ibrani menunjukkan durasi yang kekal, berkelanjutan, atau tidak terbatas. Pilihan ini mempertahankan bobot teologis teks dan tidak menyelesaikan ketegangan mengenai penggenapannya.
- issue: Cakupan זֶרַע
  choice: keturunanmu
  alternative: benihmu; anak cucumu
  rationale: '''Keturunan'' mempertahankan sifat kolektif dan ambiguitas jumlah pada istilah Ibrani, tanpa mempersempit acuannya secara teologis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaulihat' dan 'Kuberikan' menjaga kelancaran serta mengikuti kaidah penulisan kata ganti bagi Allah. Penanda catatan kaki ditempatkan setelah kalimat karena catatan menjelaskan istilah 'keturunanmu' dalam ayat.
