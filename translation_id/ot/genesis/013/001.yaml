  source_fidelity: Draf menyampaikan perjalanan Abram dari Mesir ke Negeb dan cakupan rombongannya dengan baik. Namun, kata kerja וַיַּעַל ('naik/pergi naik') diratakan menjadi 'pergi', padahal unsur ini dapat dipertahankan secara wajar dalam register Alkitab Indonesia. Hubungan Lot dengan Abram juga lebih jelas bila 'bersamanya' dinyatakan.
  naturalness: Kalimat revisi tetap modern dan mudah dibaca. Penggunaan 'naik dari Mesir' lazim dalam gaya naratif Alkitab dan tidak menuntut pembaca memahaminya sebagai keterangan arah mata angin atau tanjakan yang terus-menerus.
  terminology: '''Abram'', ''Mesir'', dan ''Tanah Negeb'' tepat. Catatan kaki mempertahankan ambiguitas leksikal נֶגֶב antara nama wilayah dan makna umum ''selatan/daerah selatan''.'
