  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua agar alur rombongan dan tujuan perjalanan mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
