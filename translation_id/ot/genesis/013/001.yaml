  yaml_path: translation/ot/genesis/013/001.yaml
  text: So Abram went up from Egypt[a], he and his wife and all that he had, and Lot with him, to the Negev.
translation:
  language: id
  text: Lalu Abram naik dari Mesir, bersama istrinya, segala miliknya, dan Lot yang menyertainya, menuju Tanah Negeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah selatan.” Kata Ibrani negeb dapat merujuk pada wilayah selatan yang dikenal sebagai Tanah Negeb atau, secara lebih umum, pada arah selatan atau daerah selatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi
  rationale: Secara harfiah berarti 'naik/pergi naik'. Dalam konteks perjalanan dari Mesir menuju tanah Kanaan, unsur gerak geografis ini sukar dipertahankan secara alami dalam bahasa Indonesia; 'pergi dari Mesir' menyampaikan gerak perjalanan tanpa menimbulkan kesan bahwa arah mata angin yang dimaksud adalah utara atau medan yang terus menanjak.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Padanan langsung dan alami untuk preposisi מן dan nama tempat מִצְרַיִם.
- source_word: הוּא וְאִשְׁתּוֹ
  choice: bersama istrinya
  rationale: Menyampaikan bahwa Abram sendiri berangkat dengan istrinya secara alami dalam bahasa Indonesia; subjek 'Abram' sudah membuat pronomina penegas הוּא tersirat.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Tetap cukup luas untuk mencakup seluruh yang menjadi kepunyaan Abram tanpa membatasinya hanya pada jenis barang tertentu.
- source_word: וְלוֹט עִמּוֹ
  choice: dan Lot
  rationale: Lot dimasukkan dalam rangkaian orang yang menyertai Abram; gagasan 'bersamanya' telah dinyatakan oleh struktur kalimat dan diperjelas oleh kalimat berikutnya.
- source_word: הַנֶּגְבָּה
  choice: menuju ke Tanah Negeb
  rationale: Bentuk ini memakai נֶגֶב sebagai nama wilayah tujuan dan mempertahankan akhiran arah -ה melalui 'menuju ke'. 'Tanah Negeb' membantu pembaca Indonesia mengenalinya sebagai kawasan, bukan sekadar nama yang tidak jelas.
