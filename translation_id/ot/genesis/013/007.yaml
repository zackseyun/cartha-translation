  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan struktur utama Ibrani: konflik di antara dua kelompok penggembala, kemudian keterangan bahwa orang Kanaan dan Feris mendiami negeri itu pada waktu tersebut. “Ternak” mencakup מִקְנֶה secara memadai, dan “tinggal” menyampaikan keadaan duratif dari partisip יֹשֵׁב tanpa menambahkan rincian.'
  naturalness: Bahasa Indonesia baku, lancar, dan bernada naratif. “Pada waktu itu” ditempatkan secara idiomatis di awal kalimat kedua. “Lalu terjadilah” agak bernuansa sastra, tetapi tetap alami dan sesuai register naratif Alkitab.
  terminology: Nama Abram, Kanaan, dan Feris sudah tepat dalam penggunaan Indonesia. “Orang Kanaan dan orang Feris” dengan catatan kolektif mempertahankan bentuk tunggal kolektif bahasa Ibrani tanpa mengaburkan maksud. “Negeri itu” merupakan padanan yang wajar untuk בָּאָרֶץ dalam konteks ini.
