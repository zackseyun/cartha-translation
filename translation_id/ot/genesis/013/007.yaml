id: GEN.13.7
reference: Genesis 13:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה אַבְרָ֔ם וּ/בֵ֖ין רֹעֵ֣י מִקְנֵה ל֑וֹט וְ/הַֽ/כְּנַעֲנִי֙ וְ/הַ/פְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/007.yaml
  text: And there was strife between the herdsmen of Abram’s livestock and the herdsmen of Lot’s livestock[b][a]. Now the Canaanite and the Perizzite were dwelling in the land at that time.
translation:
  language: id
  text: Lalu terjadilah perselisihan antara para penggembala ternak Abram dan para penggembala ternak Lot. Pada waktu itu, orang Kanaan dan orang Feris[a] tinggal di negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang-orang Kanaan dan orang-orang Feris.” Bahasa Ibrani memakai sebutan bangsa berbentuk tunggal dengan arti kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Orang Kanaan dan orang Feris ketika itu tinggal di negeri tersebut.”
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: Lalu terjadilah
  rationale: Bentuk wayyiqtol dari היה melanjutkan alur narasi dan memperkenalkan keadaan yang timbul; ungkapan ini alami dalam bahasa Indonesia tanpa menambah sebab atau penjelasan.
- source_word: רִיב
  choice: perselisihan
  rationale: Kata ini menyatakan pertengkaran atau konflik. “Perselisihan” cukup berbobot, jelas, dan wajar bagi pembaca modern.
- source_word: רֹעֵי
  choice: para penggembala
  rationale: Bentuk jamak ini menunjuk orang-orang yang menjaga hewan ternak; “penggembala” tidak membatasi jenis hewannya hanya pada domba.
- source_word: מִקְנֵה
  choice: ternak
  rationale: Istilah ini mencakup hewan peliharaan dalam kawanan secara umum. “Ternak” merupakan padanan Indonesia yang ringkas dan luas.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan
  rationale: Pasangan preposisi ini membedakan dua pihak yang berselisih dan dipertahankan dengan susunan Indonesia yang alami.
- source_word: וְהַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: orang Kanaan dan orang Feris
  rationale: Bahasa Ibrani memakai sebutan bangsa dalam bentuk tunggal dengan arti kolektif. Bentuk “orang Kanaan dan orang Feris” mempertahankan corak itu dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Keterangan ini menempatkan keadaan tersebut pada waktu berlangsungnya peristiwa narasi; penempatannya di awal kalimat kedua terdengar alami.
- source_word: יֹשֵׁב
  choice: tinggal
  rationale: Partisip ini menggambarkan keadaan yang sedang berlangsung. Predikat “tinggal” wajar untuk subjek kolektif dan tidak memaksakan aspek yang lebih khusus daripada sumber.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Padanan ini mempertahankan acuan geografis tertentu dari bentuk berartikel dan tetap membuka kemungkinan nuansa penting “negeri” dalam kisah Kejadian.
theological_decisions:
- issue: Kemungkinan nuansa perjanjian pada הָאָרֶץ
  choice: di negeri itu
  alternative: di tanah itu
  rationale: “Negeri itu” jelas sebagai wilayah geografis tertentu dan tidak menghapus kemungkinan resonansi tematisnya dalam Kejadian, sementara “tanah itu” dapat terdengar kurang alami atau lebih sempit dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Penggembala ternak” dipilih agar cakupannya tidak terbatas pada domba. Penanda waktu ditempatkan di awal kalimat kedua demi kelancaran.
