  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pertanyaan retoris, permintaan yang halus, serta kesejajaran tawaran Abram. Penanda catatan kaki ditempatkan setelah klausa pertama yang eliptis.
