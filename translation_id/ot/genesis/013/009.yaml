    text: Klausa bersyarat dalam bahasa Ibrani berbentuk eliptis; secara harfiah, “Jika ke kiri, aku akan ke kanan; dan jika ke kanan, aku akan ke kiri.” Terjemahan menambahkan “engkau pergi ke” agar jelas dalam bahasa Indonesia.
    reason: lexical_alternative
  revision_rationale: Revisi menghapus demonstratif yang tidak ada dalam sumber, memakai ungkapan permintaan yang wajar dalam bahasa Indonesia modern untuk נא, dan melengkapi elipsis Ibrani secara minimal dengan “pergi.” Catatan kaki diperbarui agar secara tepat menjelaskan pelengkapan tersebut.
