base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/009.yaml
  text: Is not the whole land before you? Please separate from me. If you go to the left[a], then I will go to the right; and if you go to the right, then I will go to the left.
translation:
  language: id
  text: Bukankah seluruh negeri terbentang di hadapanmu? Tolong berpisah dariku. Jika engkau pergi ke kiri[a], aku akan pergi ke kanan; dan jika engkau pergi ke kanan, aku akan pergi ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa bersyarat dalam bahasa Ibrani berbentuk eliptis; secara harfiah, “Jika ke kiri, aku akan ke kanan; dan jika ke kanan, aku akan ke kiri.” Terjemahan menambahkan “engkau pergi ke” agar jelas dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “Bukankah” alami dan tepat dalam bahasa Indonesia.
- source_word: כָל הָאָרֶץ
  choice: seluruh negeri ini
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada wilayah yang tersedia bagi Abram dan Lot, bukan seluruh bumi. Kata “ini” memperjelas acuan kontekstual tanpa mengubah maksud.
- source_word: לְפָנֶיךָ
  choice: terbentang di hadapanmu
  rationale: Ungkapan spasial ini menyatakan bahwa wilayah tersebut tersedia di depan Lot. “Terbentang” membuat idiom itu alami dalam bahasa Indonesia sambil mempertahankan citra ruangnya.
- source_word: הִפָּרֶד נָא מֵעָלַי
  choice: Berpisahlah kiranya dariku
  rationale: Imperatif nifal הִפָּרֶד menyampaikan permintaan agar Lot memisahkan diri, sedangkan נָא melembutkannya. “Kiranya” mempertahankan nuansa permohonan dengan ragam yang bermartabat.
- source_word: אִם הַשְּׂמֹאל
  choice: Jika engkau ke kiri
  rationale: Bahasa Ibrani bersifat eliptis, secara harfiah “jika yang kiri.” Bahasa Indonesia dapat mempertahankan keringkasan itu dengan menyebut subjek tanpa menambahkan verba gerak tertentu.
- source_word: וְאֵימִנָה
  choice: aku akan ke kanan
  rationale: Bentuk berarah dari ימין menunjukkan gerak menuju sisi kanan. Ungkapan “akan ke kanan” alami dan menjaga kesejajaran kalimat.
- source_word: וְאִם הַיָּמִין
  choice: dan jika engkau ke kanan
  rationale: Seperti klausa pertama, frasa Ibrani ini eliptis. Terjemahan mempertahankan bentuk ringkas dan paralelnya.
- source_word: וְאַשְׂמְאִילָה
  choice: aku akan ke kiri
  rationale: Bentuk berarah dari שׂמאל menunjukkan gerak Abram menuju sisi kiri dan membentuk pasangan yang seimbang dengan “aku akan ke kanan.”
theological_decisions: []
