revisions:
- from: Bukankah seluruh negeri ini terbentang di hadapanmu? Berpisahlah kiranya dariku. Jika engkau ke kiri[a], aku akan ke kanan; dan jika engkau ke kanan, aku akan ke kiri.
  to: Bukankah seluruh negeri terbentang di hadapanmu? Tolong berpisah dariku. Jika engkau pergi ke kiri[a], aku akan pergi ke kanan; dan jika engkau pergi ke kanan, aku akan pergi ke kiri.
  rationale: Revisi menghapus demonstratif yang tidak ada dalam sumber, memakai ungkapan permintaan yang wajar dalam bahasa Indonesia modern untuk נא, dan melengkapi elipsis Ibrani secara minimal dengan “pergi.” Catatan kaki diperbarui agar secara tepat menjelaskan pelengkapan tersebut.
