  yaml_path: translation/ot/genesis/013/012.yaml
  text: Abram lived in the land of Canaan[a], and Lot lived in the cities of the plain and pitched his tents as far as Sodom.
translation:
  language: id
  text: Abram tinggal di tanah Kanaan, dan Lot tinggal di kota-kota di dataran itu serta memasang kemahnya sampai ke Sodom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membentangkan kemahnya sampai ke arah Sodom.” Kata kerja Ibrani dapat berarti berkemah atau memasang kemah. Maksudnya, perkemahan Lot terbentang ke arah Sodom; ayat ini tidak dengan sendirinya menyatakan bahwa pada saat itu ia sudah tinggal di dalam kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁב
  choice: tinggal
  rationale: Kata kerja ini lazim berarti berdiam atau menetap; “tinggal” alami dalam bahasa Indonesia modern dan sesuai dengan makna keadaan di sini.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan nomina אֶרֶץ (“tanah/negeri”) secara wajar dan dekat dengan susunan Ibrani.
- source_word: בְּעָרֵי הַכִּכָּר
  choice: di kota-kota di Dataran Yordan
  rationale: כִּכָּר di konteks ini menunjuk pada kawasan dataran atau lembah Yordan. Penambahan “Yordan” memperjelas rujukan geografis yang sudah dibangun dalam ayat 10, tanpa mengubah relasi jamak “kota-kota”.
- source_word: וַיֶּאֱהַל
  choice: mendirikan kemah-kemahnya
  rationale: Bentuk verbal dari אהל menyatakan memasang kemah atau hidup berkemah. Bentuk jamak alami untuk menggambarkan perkemahan rumah tangga pastoral Lot.
- source_word: עַד סְדֹם
  choice: sampai ke Sodom
  rationale: עַד menandai batas atau jangkauan ruang. Ungkapan ini mempertahankan kesan bahwa perkemahan Lot terbentang hingga ke arah Sodom, tanpa harus berarti ia sudah tinggal di dalam kota.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama diri ditransliterasikan menurut bentuk baku Indonesia.
- source_word: לוֹט
  choice: Lot
  rationale: Nama diri ditransliterasikan menurut bentuk baku Indonesia.
- source_word: סְדֹם
  choice: Sodom
  rationale: Nama tempat memakai bentuk yang lazim dalam bahasa Indonesia.
