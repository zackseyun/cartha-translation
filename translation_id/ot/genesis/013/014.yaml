id: GEN.13.14
reference: Genesis 13:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יהוָ֞ה אָמַ֣ר אֶל אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד ל֣וֹט מֵֽ/עִמּ֔/וֹ שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מִן הַ/מָּק֖וֹם אֲשֶׁר אַתָּ֣ה שָׁ֑ם צָפֹ֥נָ/ה וָ/נֶ֖גְבָּ/ה וָ/קֵ֥דְמָ/ה וָ/יָֽמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/014.yaml
  text: 'And Yahweh said to Abram[a], after Lot had separated from him, “Please lift up your eyes and look from the place where you are: northward and southward and eastward and westward.”'
translation:
  language: id
  text: Setelah Lot berpisah dari Abram, Yahweh[a] berkata kepadanya, “Angkatlah pandanganmu dan lihatlah dari tempat engkau berada ke arah utara, selatan, timur, dan barat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH (יהוה), nama ilahi yang di sini ditulis “Yahweh”; banyak terjemahan menuliskannya “TUHAN”.'
    reason: Menjelaskan bentuk dan kebiasaan penerjemahan nama ilahi.
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”; waw naratif tidak diterjemahkan tersendiri karena hubungan kelanjutan sudah tersampaikan secara alami oleh susunan kalimat Indonesia.
- source_word: אָמַר אֶל־אַבְרָם
  choice: berkata kepadanya
  rationale: אָמַר אֶל secara wajar berarti “berkata kepada”. Nama Abram telah disebut dalam anak kalimat sebelumnya untuk memperjelas rujukan pronomina Ibrani, sehingga “kepadanya” menghindari pengulangan yang kaku.
- source_word: אַחֲרֵי הִפָּרֶד לוֹט מֵעִמּוֹ
  choice: Setelah Lot berpisah dari Abram
  rationale: אַחֲרֵי menandai waktu sesudah suatu peristiwa, sedangkan bentuk Nifal הִפָּרֶד menyatakan Lot berpisah. Rujukan “darinya” diperjelas menjadi “dari Abram” dalam bahasa Indonesia agar tidak rancu.
- source_word: שָׂא נָא עֵינֶיךָ
  choice: Angkatlah pandanganmu
  rationale: Ungkapan harfiah “angkatlah matamu” merupakan idiom untuk mengarahkan pandangan. “Angkatlah pandanganmu” mempertahankan citra dasarnya dengan bunyi Indonesia yang alami; partikel נָא tercermin dalam bentuk imperatif halus berakhiran -lah.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif ראה mengajak Abram melihat wilayah di hadapannya; “lihatlah” langsung, alami, dan mempertahankan bentuk perintah.
- source_word: מִן הַמָּקוֹם אֲשֶׁר אַתָּה שָׁם
  choice: dari tempat engkau berada
  rationale: Terjemahan ini menyampaikan titik pandang Abram tanpa menambahkan gagasan “berdiri” yang tidak dinyatakan dalam teks Ibrani.
- source_word: צָפֹנָה וָנֶגְבָּה וָקֵדְמָה וָיָמָּה
  choice: ke arah utara, selatan, timur, dan barat
  rationale: Akhiran direktif -ה menunjukkan arah. Frasa “ke arah” berlaku bagi keempat mata angin dan menghasilkan daftar yang ringkas serta alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan fungsi nama diri, sedangkan “TUHAN” dicatat sebagai kebiasaan terjemahan alternatif tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan anak kalimat waktu di depan memperjelas alur narasi. “Engkau” dipakai untuk sapaan tunggal kepada Abram, sedangkan bentuk imperatif -lah menjaga nada yang wajar dan tidak kasar.
