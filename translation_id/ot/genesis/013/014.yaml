  source_fidelity: 'Teks Indonesia dengan setia menyampaikan urutan dan isi Ibrani: sesudah Lot berpisah dari Abram, Yahweh berbicara kepada Abram dan memerintahkannya mengarahkan pandangan ke empat penjuru. “Ke arah utara, selatan, timur, dan barat” mempertahankan daya direktif akhiran -ה pada bentuk-bentuk arah mata angin. Penerjemahan waw naratif tidak secara eksplisit diperlukan dalam susunan Indonesia ini.'
  naturalness: Kalimatnya baku, modern, dan mengalir wajar. “Angkatlah pandanganmu” adalah ungkapan Indonesia yang alami bagi idiom Ibrani “angkatlah matamu,” sedangkan “engkau” dan bentuk -lah sesuai untuk sapaan khidmat kepada satu orang.
  terminology: “Yahweh” secara konsisten merepresentasikan יהוה dan catatan kaki dengan tepat menjelaskan pilihan tersebut. Abram dipertahankan sebagai nama yang sesuai tahap narasi ini. Tidak ada istilah teologis lain yang memerlukan penyesuaian.
