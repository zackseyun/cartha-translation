  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ֙ לְ/מַסָּעָ֔י/ו מִ/נֶּ֖גֶב וְ/עַד בֵּֽית אֵ֑ל עַד הַ/מָּק֗וֹם אֲשֶׁר הָ֨יָה שָׁ֤ם אהל/ה בַּ/תְּחִלָּ֔ה בֵּ֥ין בֵּֽית אֵ֖ל וּ/בֵ֥ין הָ/עָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/013/003.yaml
  text: And he journeyed by stages from the Negev as far as Bethel[a], to the place where his tent had been at the beginning, between Bethel and Ai.
translation:
  language: id
  text: Ia melanjutkan perjalanan tahap demi tahap dari Negeb sampai ke Betel, ke tempat kemahnya dahulu berdiri, di antara Betel dan Ai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Ia melanjutkan perjalanan
  rationale: Dalam konteks perjalanan Abram yang sudah berlangsung, bentuk naratif ini secara alami menyatakan bahwa ia meneruskan perjalanannya; 'melanjutkan perjalanan' tetap dekat dengan makna dasar הלך sekaligus menghasilkan bahasa Indonesia yang wajar.
- source_word: לְמַסָּעָיו
  choice: tahap demi tahap
  rationale: Bentuk jamak מַסָּע dengan ל menggambarkan perjalanan melalui rangkaian perpindahan atau tempat perkemahan; ungkapan ini menyampaikan gerak berurutan tanpa parafrasa berlebihan.
- source_word: מִנֶּגֶב
  choice: dari Negeb
  rationale: Dalam konteks geografis kisah leluhur, נֶגֶב menunjuk wilayah Negeb, bukan sekadar arah selatan.
- source_word: וְעַד בֵּית אֵל
  choice: sampai ke Betel
  rationale: עַד menyatakan batas atau tujuan perjalanan; frasa ini alami dalam bahasa Indonesia.
- source_word: עַד הַמָּקוֹם
  choice: ke tempat
  rationale: עַד yang kedua mempersempit tujuan kepada lokasi tertentu; pengulangan 'sampai' tidak diperlukan dalam bahasa Indonesia.
- source_word: אֲשֶׁר הָיָה שָׁם אָהֳלֹה
  choice: tempat kemahnya dahulu berdiri
  rationale: Klausa ini menunjuk lokasi kemah Abram sebelumnya. 'Berdiri' adalah kolokasi alami untuk kemah, sedangkan שָׁם terwakili oleh 'tempat'.
- source_word: בַּתְּחִלָּה
  choice: dahulu
  rationale: Dalam konteks ini frasa tersebut merujuk pada perkemahan Abram sebelumnya; 'dahulu' menyampaikan rujukan retrospektif secara ringkas dan alami.
- source_word: בֵּין בֵּית אֵל וּבֵין הָעָי
  choice: di antara Betel dan Ai
  rationale: Konstruksi בֵּין ... וּבֵין menunjukkan lokasi di antara dua tempat; artikel pada הָעָי tidak perlu direproduksi dalam nama Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama tempat ditulis 'Negeb', 'Betel', dan 'Ai' menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena makna idiomatis לְמַסָּעָיו dapat disampaikan langsung dengan jelas sebagai 'tahap demi tahap'.
