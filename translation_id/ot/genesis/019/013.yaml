  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: id
  text: Sebab kami akan segera memusnahkan tempat ini, karena jeritan mereka[a] telah menjadi besar di hadapan Yahweh, dan Yahweh telah mengutus kami untuk memusnahkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena jeritan terhadap mereka telah menjadi besar di hadapan Yahweh.” Bentuk Ibraninya secara formal dapat dipahami sebagai “jeritan mereka”, tetapi dalam konteks ini banyak orang memahaminya sebagai jeritan pengaduan terhadap penduduk tempat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: akan segera memusnahkan
  rationale: Partisipel Hifil jamak dapat menyatakan tindakan yang sedang berlangsung atau sudah di ambang pelaksanaan. Dalam pengumuman penghukuman ini, frasa ini menyampaikan makna futurum yang dekat secara alami.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Padanan langsung dan alami yang mempertahankan daya tunjuk bentuk Ibrani.
- source_word: גָדְלָה
  choice: sudah menjadi besar
  rationale: Bentuk perfektum Qal menyatakan peningkatan yang telah mencapai suatu keadaan; pilihan ini mempertahankan nuansa resultatifnya.
- source_word: צַעֲקָתָם
  choice: jeritan mereka
  rationale: Kata צְעָקָה menunjuk pada jeritan karena kesusahan atau seruan pengaduan, sedangkan sufiks orang ketiga jamak secara formal berarti 'mereka'. Terjemahan utama mempertahankan bentuk itu tanpa menentukan siapa yang menyerukan jeritan tersebut.
- source_word: אֶת־פְּנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan 'di hadapan' menyampaikan idiom Ibrani secara wajar dan mempertahankan dimensi kehadiran serta pengadilan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: וַיְשַׁלְּחֵנוּ
  choice: telah mengutus kami
  rationale: Bentuk ini menyatakan pengutusan yang telah terjadi dan yang hasilnya masih berlaku dalam misi para pembicara saat ini.
- source_word: לְשַׁחֲתָהּ
  choice: untuk memusnahkannya
  rationale: Infinitif tujuan ini mengulang akar שׁחת. Sufiks feminin merujuk pada tempat atau kota tersebut, yang secara idiomatis dinyatakan dengan '-nya' dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna צַעֲקָתָם
  choice: jeritan mereka
  alternative: jeritan terhadap mereka
  rationale: Sufiks Ibrani secara formal berarti 'mereka', tetapi konteks memungkinkan arti jeritan pengaduan yang ditujukan terhadap penduduk tempat itu. Teks utama mempertahankan bentuk formal, sedangkan kemungkinan kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Akan segera' mengungkapkan tindakan yang sudah dekat, sedangkan 'memusnahkan' dipakai secara konsisten untuk kedua kemunculan akar שׁחת. Penanda catatan kaki ditempatkan sesudah klausa yang memiliki ambiguitas.
