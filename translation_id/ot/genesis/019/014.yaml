  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: id
  text: Lalu Lot keluar dan berbicara kepada para menantunya[a], yang akan menikahi anak-anak perempuannya. Ia berkata, “Bangunlah, keluarlah dari tempat ini, karena Yahweh akan segera memusnahkan kota itu.” Tetapi, bagi para menantunya, ia tampak seperti orang yang bercanda.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para menantunya yang telah menikahi anak-anak perempuannya.” Ungkapan Ibrani dapat menunjuk pada laki-laki yang sudah menikahi anak-anak perempuan Lot atau yang akan menikahi mereka.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “ia seperti orang yang bercanda di mata para menantunya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: para menantunya
  rationale: חָתָן dapat berarti pengantin laki-laki atau menantu laki-laki. Dalam bahasa Indonesia, “menantu” adalah sebutan relasional yang alami; frasa berikutnya menjelaskan bahwa mereka akan menikahi anak-anak perempuan Lot.
- source_word: לֹקְחֵי בְנֹתָיו
  choice: yang akan menikahi anak-anak perempuannya
  rationale: Partisip לֹקְחֵי secara harfiah berarti “yang mengambil,” dan dalam konteks ini menunjuk pada mengambil sebagai istri. Bentuk ini dapat dipahami sebagai perkawinan yang sudah berlangsung atau akan berlangsung; konteks ayat berikutnya mendukung pembacaan prospektif tanpa meniadakan ambiguitas sumber, yang dicatat dalam catatan kaki.
- source_word: קוּמוּ צְּאוּ
  choice: Bangunlah, keluarlah
  rationale: Dua imperatif dipertahankan untuk menyampaikan desakan dan irama ujaran Ibrani. Bentuk ini wajar sekaligus bermartabat dalam bahasa Indonesia.
- source_word: מִן־הַמָּקוֹם הַזֶּה
  choice: dari tempat ini
  rationale: Terjemahan langsung dan alami yang mempertahankan unsur penunjuk הַזֶּה, “ini.”
- source_word: מַשְׁחִית
  choice: akan segera memusnahkan
  rationale: Partisip Hifil dalam konteks ini menyatakan tindakan penghancuran yang sudah dekat tetapi belum terjadi. “Akan segera” menyampaikan sifat imminennya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הָעִיר
  choice: kota ini
  rationale: Walaupun nomina Ibrani secara formal berarti “kota itu/kota tersebut,” rujukannya adalah kota tempat mereka berada. “Kota ini” alami dalam ujaran langsung Lot dan memperjelas deiksis tanpa mengubah acuannya.
- source_word: כִּמְצַחֵק
  choice: seperti sedang bercanda
  rationale: Ungkapan ini menggambarkan bagaimana Lot tampak bagi para menantunya, yakni sebagai orang yang tidak sungguh-sungguh. “Bercanda” mempertahankan makna itu tanpa mempersempitnya menjadi mengejek.
- source_word: בְּעֵינֵי
  choice: dalam pandangan
  rationale: Ungkapan Ibrani harfiah “di mata” menyatakan penilaian atau persepsi. “Dalam pandangan” mempertahankan citra dan maknanya secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Status perkawinan para חֲתָנִים
  choice: yang akan menikahi anak-anak perempuannya
  alternative: yang telah menikahi anak-anak perempuannya
  rationale: Partisip Ibrani memungkinkan hubungan perkawinan yang sedang direncanakan maupun telah terjalin. Konteks narasi mendukung pembacaan calon suami, tetapi ambiguitas asli tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Imperatif jamak diterjemahkan dengan bentuk -lah untuk mempertahankan desakan tanpa terdengar kasar. Ambiguitas mengenai apakah para menantu sudah menikah atau masih calon suami dipertahankan melalui catatan kaki.
