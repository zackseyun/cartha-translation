  naturalness: Bahasa draft umumnya modern dan baku. Susunan “Namun, dalam pandangan para menantunya, ia seperti sedang bercanda” dapat dibuat lebih langsung dan alami sebagai “Tetapi, bagi para menantunya, ia tampak seperti orang yang bercanda.”
  terminology: “Yahweh” secara konsisten merepresentasikan יהוה. “Para menantunya” dapat dipertahankan karena frasa penjelas dan catatan kaki menguraikan hubungan itu; “anak-anak perempuannya” tepat untuk בְּנֹתָיו.
