revisions:
- from: Lalu Lot keluar dan berbicara kepada para menantunya[a], yang akan menikahi anak-anak perempuannya. Katanya, “Bangunlah, keluarlah dari tempat ini, karena Yahweh akan segera memusnahkan kota ini.” Namun, dalam pandangan para menantunya, ia seperti sedang bercanda.[b]
  to: Lalu Lot keluar dan berbicara kepada para menantunya[a], yang akan menikahi anak-anak perempuannya. Ia berkata, “Bangunlah, keluarlah dari tempat ini, karena Yahweh akan segera memusnahkan kota itu.” Tetapi, bagi para menantunya, ia tampak seperti orang yang bercanda.[b]
  rationale: Revisi mengganti “kota ini” dengan “kota itu” agar tidak menambahkan unsur demonstratif yang tidak ada dalam teks Ibrani. Kalimat terakhir dirapikan supaya lebih idiomatis dalam bahasa Indonesia sambil tetap menerjemahkan idiom “di mata para menantunya” sebagai penilaian mereka. Ambiguitas mengenai status perkawinan tetap dipelihara melalui catatan kaki.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T17:54:46Z'
