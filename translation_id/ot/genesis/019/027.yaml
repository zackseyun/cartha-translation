  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: id
  text: Pada pagi hari itu, Abraham bangun pagi-pagi lalu pergi ke tempat ia dahulu berdiri di hadapan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di hadapan wajah Yahweh”; ini adalah ungkapan Ibrani yang berarti “berdiri di hadapan Yahweh” atau “berdiri dalam kehadiran Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם lazim berarti bangun atau mulai beraktivitas pagi-pagi. Ungkapan ini mempertahankan penekanan waktunya dalam bahasa Indonesia yang alami.
- source_word: בַּבֹּקֶר
  choice: Keesokan paginya
  rationale: בֹּקֶר berarti pagi. Dalam alur narasi ini, bentuk definit tersebut menunjuk pada pagi sesudah peristiwa sebelumnya; 'keesokan paginya' menyampaikan hubungan waktunya secara alami, sedangkan unsur dini hari tetap tampak dalam 'bangun pagi-pagi'.
- source_word: אֶל הַמָּקוֹם
  choice: lalu pergi ke tempat
  rationale: מָקוֹם adalah istilah umum untuk 'tempat'. Preposisi אֶל menyatakan arah; penambahan 'pergi' membuat arah gerak yang tersirat menjadi wajar dalam bahasa Indonesia tanpa menentukan cara perjalanannya.
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: ia pernah berdiri
  rationale: Klausa relatif ini merujuk kembali pada tindakan Abraham sebelumnya. 'Pernah berdiri' menyampaikan hubungan retrospektif tersebut, sementara שָׁם sudah tercakup secara alami oleh 'tempat ...'.
- source_word: אֶת־פְּנֵי
  choice: di hadapan
  rationale: Dalam konstruksi עמד את־פני, frasa ini merupakan idiom untuk berdiri di hadapan atau dalam kehadiran seseorang. 'Di hadapan' mempertahankan idiom Ibraninya secara ringkas dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Tetragramaton dipertahankan sebagai nama diri ilahi 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar atau memakai bentuk transliterasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'pagi' dipertahankan karena teks Ibrani memakai baik verba 'bangun pagi-pagi' maupun frasa 'pada pagi hari'.
