id: GEN.19.38
reference: Genesis 19:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: id
  text: Anak perempuan yang lebih muda itu juga melahirkan seorang anak laki-laki dan menamainya Ben-Ami[a]. Dialah leluhur bani Amon[b] sampai sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ben-Ami kemungkinan berarti “anak bangsaku” atau “anak kerabatku.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Amon”; secara harfiah, “anak-anak Amon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: Anak perempuan yang lebih muda itu
  rationale: Adjektiva berartikel dipakai secara substantival dan dalam konteks menunjuk kepada anak perempuan Lot yang lebih muda; penyebutan eksplisit membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: גַם הִוא
  choice: juga
  rationale: Menunjukkan bahwa anak perempuan yang lebih muda mengalami hal yang sama seperti kakaknya.
- source_word: יָלְדָה בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Ungkapan Indonesia yang alami dan tepat bagi konstruksi Ibrani ini.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: menamainya
  rationale: Menyampaikan rumus penamaan Ibrani secara ringkas dan alami dalam bahasa Indonesia.
- source_word: בֶּן עַמִּי
  choice: Ben-Ami
  rationale: Nama diri ditransliterasikan; kemungkinan maknanya dicantumkan dalam catatan kaki karena penting bagi kisah.
- source_word: הוּא אֲבִי
  choice: Dialah leluhur
  rationale: Dalam konteks asal-usul suatu bangsa, אָב menunjuk kepada nenek moyang atau leluhur; bentuk ini lebih alami daripada 'ayah' tanpa mengubah hubungan genealogis.
- source_word: בְנֵי עַמּוֹן
  choice: bani Amon
  rationale: Mempertahankan gambaran genealogis harfiah 'anak-anak Amon' dengan istilah Indonesia yang lazim untuk suatu kaum keturunan.
- source_word: עַד הַיּוֹם
  choice: sampai sekarang
  rationale: Padanan idiomatis modern bagi ungkapan waktu Ibrani yang mengacu pada masa penutur atau penulis.
theological_decisions: []
