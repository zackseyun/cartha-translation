  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Anak perempuan yang sulung’ memperjelas rujukan feminin; ‘leluhur orang Moab’ mengungkapkan maksud idiom keturunan secara alami, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
