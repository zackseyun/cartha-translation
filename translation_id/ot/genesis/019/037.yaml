  edition: WLC
  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: id
  text: Anak perempuan yang sulung itu melahirkan seorang anak laki-laki dan menamainya Moab. Dialah leluhur orang Moab sampai hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dialah bapak Moab sampai hari ini.” Nama leluhur dipakai untuk menyebut bangsa yang berasal darinya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Dalam bentuk Qal dengan objek langsung, ילד berarti ‘melahirkan’; pilihan ini alami dan jelas dalam bahasa Indonesia.
- source_word: הַבְּכִירָה
  choice: anak perempuan yang sulung itu
  rationale: Bentuk feminin substantival ini berarti ‘yang sulung’; konteks menunjukkan bahwa yang dimaksud ialah anak perempuan Lot yang lebih tua.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Padanan Indonesia yang alami untuk menyatakan seorang putra yang dilahirkan.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: menamainya
  rationale: Ungkapan Ibrani harfiah ‘memanggil namanya’ paling alami disampaikan dalam bahasa Indonesia sebagai ‘menamainya’ tanpa kehilangan makna.
- source_word: מוֹאָב
  choice: Moab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri itu menunjuk kembali kepada anak yang baru dinamai dan memberi penegasan.
- source_word: אֲבִי מוֹאָב
  choice: leluhur orang Moab
  rationale: Secara harfiah ‘bapak Moab’; dalam konteks, frasa ini menyatakan bahwa tokoh tersebut adalah nenek moyang bangsa Moab. Terjemahan ini mencegah kekeliruan bahwa ia ayah dari dirinya sendiri.
- source_word: עַד הַיּוֹם
  choice: sampai hari ini
  rationale: Padanan idiomatis Indonesia bagi ungkapan yang menunjukkan keberlanjutan hingga masa penutur atau narator.
