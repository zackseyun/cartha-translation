  text: וַ/יַּשְׁקֵ֗ף עַל פְּנֵ֤י סְדֹם֙ וַ/עֲמֹרָ֔ה וְ/עַֽל כָּל פְּנֵ֖י אֶ֣רֶץ הַ/כִּכָּ֑ר וַ/יַּ֗רְא וְ/הִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָ/אָ֔רֶץ כְּ/קִיטֹ֖ר הַ/כִּבְשָֽׁן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: id
  text: Ia memandang ke arah Sodom dan Gomora serta ke seluruh wilayah dataran itu. Ia melihat, dan tampaklah asap membubung dari tanah itu seperti asap dari tungku[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti asap dari tanur.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: memandang ke arah
  rationale: Dalam bentuk ini, שׁקף menggambarkan tindakan memandang dari tempat yang tinggi ke kawasan di bawah atau di kejauhan. Pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan arah vertikal yang tidak perlu.
- source_word: עַל פְּנֵי
  choice: ke arah ... serta ke seluruh
  rationale: Ungkapan ini secara harfiah berkaitan dengan 'di atas permukaan', tetapi dalam konteks pengamatan suatu kawasan, konstruksi Indonesia ini menyampaikan arah pandangan dan cakupan wilayah secara wajar.
- source_word: סְדֹם וַעֲמֹרָה
  choice: Sodom dan Gomora
  rationale: Mengikuti bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: seluruh wilayah dataran itu
  rationale: כִּכָּר menunjuk pada kawasan dataran atau distrik tersebut. 'Wilayah dataran itu' jelas dan alami tanpa menentukan identifikasi geografis lebih jauh daripada teks.
- source_word: וַיַּרְא
  choice: Ia melihat
  rationale: Terjemahan langsung yang mempertahankan urutan naratif dan peralihan dari tindakan memandang kepada apa yang terlihat.
- source_word: וְהִנֵּה
  choice: dan tampaklah
  rationale: Partikel הִנֵּה menandai pengamatan yang hidup dan mencolok. 'Tampaklah' mempertahankan daya naratif itu dalam bahasa Indonesia modern yang bermartabat.
- source_word: עָלָה
  choice: membubung
  rationale: Kata ini menggambarkan gerakan asap yang naik. 'Membubung' merupakan ungkapan Indonesia yang tepat dan ringkas untuk asap yang naik ke udara.
- source_word: קִיטֹר
  choice: asap
  rationale: Makna dasar kata ini ialah asap atau uap; konteks kehancuran dan perbandingan dengan tungku mendukung 'asap' tanpa tambahan sifat yang bersifat tafsiran.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks setempat, הָאָרֶץ menunjuk pada kawasan yang sedang diamati, bukan seluruh bumi. 'Negeri itu' membedakannya secara alami dari 'wilayah dataran itu' pada klausa sebelumnya.
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: seperti asap dari tungku
  rationale: כִּבְשָׁן dapat berarti tungku pembakaran atau tempat pembakaran seperti tanur. 'Tungku' mudah dipahami dan mempertahankan gambaran asap pekat yang naik; alternatif leksikal dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Narasi memakai bahasa Indonesia modern yang alami dan bermartabat. Pengulangan 'Ia memandang ... Ia melihat' dipertahankan karena mencerminkan urutan dan penekanan teks Ibrani. Bentuk 'tampaklah' mempertahankan fungsi vivid וְהִנֵּה tanpa memakai kata arkais 'lihatlah' sebagai seruan kepada pembaca.
