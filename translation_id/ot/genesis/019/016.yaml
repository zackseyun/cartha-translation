revisions:
- from: Namun, Lot berlambat-lambat. Karena belas kasihan Yahweh kepadanya, kedua orang itu menggenggam tangannya, tangan istrinya, dan tangan kedua anak perempuannya, lalu membawa dia keluar dan menempatkannya di luar kota.
  to: Namun, Lot masih berlambat-lambat. Lalu orang-orang itu memegang erat tangannya, tangan istrinya, dan tangan kedua anak perempuannya—karena belas kasihan Yahweh kepadanya—kemudian membawa dia keluar dan menempatkannya di luar kota.
  rationale: Revisi menghilangkan penambahan jumlah pada “kedua orang itu,” memperbaiki kelancaran ungkapan pembuka, dan memilih “memegang erat” untuk menyampaikan tindakan mengambil pegangan kuat. Nama Lot tetap dipertahankan demi kejelasan rujukan dalam bahasa Indonesia. Tidak diperlukan catatan kaki, karena tidak ada ambiguitas tekstual yang perlu dijelaskan dalam terjemahan ini.
