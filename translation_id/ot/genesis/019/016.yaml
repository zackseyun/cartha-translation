  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: id
  text: Namun, Lot masih berlambat-lambat. Lalu orang-orang itu memegang erat tangannya, tangan istrinya, dan tangan kedua anak perempuannya—karena belas kasihan Yahweh kepadanya—kemudian membawa dia keluar dan menempatkannya di luar kota.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: berlambat-lambat
  rationale: Kata kerja ini menyatakan tindakan menunda atau tidak segera bertindak di tengah keadaan mendesak, bukan sekadar keraguan batin.
- source_word: הָאֲנָשִׁים
  choice: kedua orang itu
  rationale: Teks Ibrani menyebut mereka 'orang-orang itu'; konteks sebelumnya menunjukkan jumlahnya dua. Sebutan naratif ini dipertahankan tanpa menggantinya dengan identitas mereka sebagai malaikat.
- source_word: וַיַּחֲזִקוּ
  choice: menggenggam
  rationale: Dalam konstruksi ini, kata tersebut berarti memegang dengan kuat. 'Menggenggam' menyampaikan ketegasan dan urgensi penyelamatan secara alami.
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: tangannya, tangan istrinya, dan tangan kedua anak perempuannya
  rationale: Pengulangan kata 'tangan' dipertahankan sejauh wajar dalam bahasa Indonesia; frasa terakhir secara distributif merujuk pada tangan masing-masing anak perempuan.
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: karena belas kasihan Yahweh kepadanya
  rationale: בְּ di sini paling wajar dipahami secara kausal, sedangkan חֶמְלָה menyatakan belas kasihan atau iba sebagai alasan tindakan penyelamatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', selaras dengan kebijakan proyek dan pembedaan nama diri dari gelar.
- source_word: וַיֹּצִאֻהוּ
  choice: membawa dia keluar
  rationale: Bentuk kausatif verba יצא berarti menyebabkan seseorang keluar; pilihan ini alami dan tepat dalam adegan penyelamatan.
- source_word: וַיַּנִּחֻהוּ
  choice: menempatkannya
  rationale: Bentuk kausatif נוח di sini berarti menaruh atau menempatkan seseorang pada suatu lokasi, bukan meninggalkannya dalam arti menelantarkan.
- source_word: מִחוּץ לָעִיר
  choice: di luar kota
  rationale: Frasa tersebut menunjukkan lokasi hasil tindakan, yakni wilayah di luar batas kota.
theological_decisions:
- issue: Identitas naratif para penyelamat
  choice: kedua orang itu
  alternative: kedua malaikat itu
  rationale: Walaupun konteks mengidentifikasi mereka sebagai utusan surgawi, ayat ini memakai sebutan Ibrani biasa 'orang-orang itu'. Terjemahan mempertahankan penyebutan ayat tanpa menyelesaikan ketegangan naratif secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Lot disebut untuk memperjelas subjek pronominal yang dalam bahasa Indonesia dapat terasa kabur pada awal ayat, sementara struktur sebab-akibat dan pengulangan 'tangan' tetap dipertahankan secara alami.
