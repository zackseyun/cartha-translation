base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: id
  text: Namun Lot berkata kepada mereka, “Tidak, tuan-tuanku, kumohon.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak, tuanku, kumohon.” Bentuk Ibrani אֲדֹנָי dapat dipahami sebagai sapaan tunggal penuh hormat, tetapi konteks jamak (“kepada mereka”) lebih mendukung “tuan-tuanku” di sini.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi, tetapi dalam konteks ini ucapan Lot merupakan keberatan terhadap perintah sebelumnya; karena itu, “Namun” menyampaikan hubungan wacana secara alami.
- source_word: לוֹט
  choice: Lot
  rationale: Nama diri dipertahankan menurut bentuk baku dalam bahasa Indonesia.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל dengan sufiks orang ketiga jamak maskulin secara langsung berarti “kepada mereka”; rujukan jamaknya dipertahankan tanpa diperluas menjadi “kedua orang itu” atau “kedua malaikat itu”.
- source_word: אַל
  choice: Jangan
  rationale: Dalam permohonan eliptis tanpa verba ini, partikel larangan אַל menolak tindakan yang baru diperintahkan. “Jangan” mempertahankan nuansa larangan dan terdengar wajar dalam seruan bahasa Indonesia.
- source_word: נָא
  choice: kumohon
  rationale: Partikel נָא menyatakan permohonan atau desakan sopan. “Kumohon” menghadirkan daya permohonannya dengan bahasa modern dan bermartabat.
- source_word: אֲדֹנָי
  choice: tuan-tuanku
  rationale: Konteks jamak, terutama “kepada mereka”, mendukung sapaan kepada kedua pengunjung. “Tuan-tuanku” mempertahankan unsur kepunyaan dan bentuk jamak dari sapaan tersebut.
theological_decisions:
- issue: Apakah אֲדֹנָי dipahami sebagai sapaan jamak kepada para pengunjung atau sebagai gelar ilahi tunggal
  choice: 'Sapaan jamak: “tuan-tuanku”'
  alternative: 'Sapaan tunggal yang dapat dipahami sebagai gelar ilahi: “Tuanku”'
  rationale: Pronomina jamak dalam “kepada mereka” dan konteks dua pengunjung lebih mendukung sapaan jamak. Namun, bentuk Ibraninya juga dapat dibaca sebagai sapaan tunggal penuh hormat dan dalam tradisi tertentu dipahami sebagai sapaan kepada Tuhan; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Urutan sapaan dan permohonan disesuaikan agar seruan terdengar idiomatis, sementara keberatan Lot, rujukan jamak, dan ambiguitas sapaan Ibrani tetap dipertahankan.
