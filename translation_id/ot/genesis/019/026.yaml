  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: id
  text: Namun, istri Lot, yang berada di belakangnya[a], menoleh ke belakang, lalu menjadi tiang garam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “istri Lot melihat dari belakangnya.” Frasa Ibrani ini dapat dipahami sebagai keterangan bahwa ia berada di belakang Lot ketika ia melihat ke belakang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: menoleh ke belakang
  rationale: Verba נבט berarti memandang atau melihat. Dalam konteks larangan untuk menoleh ke belakang dan bersama frasa מֵאַחֲרָיו, ungkapan ini secara alami menyatakan bahwa ia menoleh untuk melihat ke arah belakang.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal berarti 'istrinya', yakni istri Lot dalam konteks.
- source_word: מֵאַחֲרָיו
  choice: dari belakang suaminya
  rationale: Frasa ini secara harfiah berarti 'dari belakangnya'. Penyebutan 'suaminya' menjernihkan rujukan pronomina dalam bahasa Indonesia tanpa mengubah hubungan yang dinyatakan teks; frasa tersebut mempertahankan keterangan posisi sang istri terhadap Lot.
- source_word: וַתְּהִי
  choice: lalu menjadi
  rationale: Dalam rangkaian narasi ini, היה menyatakan perubahan atau keadaan yang dihasilkan, sehingga 'menjadi' lebih tepat daripada sekadar 'ada'.
- source_word: נְצִיב מֶלַח
  choice: tiang garam
  rationale: Gabungan konstruksi ini secara alami diterjemahkan 'tiang garam', yaitu sesuatu yang berdiri tegak dan terdiri dari garam.
theological_decisions:
- issue: Hakikat perubahan istri Lot
  choice: lalu menjadi tiang garam
  alternative: lalu menjadi seperti tiang garam
  rationale: Teks Ibrani menyatakan bahwa ia menjadi tiang garam tanpa penanda perbandingan. Terjemahan mempertahankan pernyataan naratif tersebut tanpa mengubahnya menjadi perumpamaan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan awal mempertahankan informasi posisi yang terkandung dalam frasa Ibrani, sedangkan 'menoleh ke belakang' menyampaikan tindakan secara idiomatis.
