  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: id
  text: “Mari kita beri ayah kita minum anggur, lalu kita tidur dengannya, supaya kita dapat mempertahankan keturunan[a] dari ayah kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “benih”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  choice: Mari kita
  rationale: Bentuk ini berfungsi sebagai seruan idiomatis untuk mengajak bertindak. “Mari kita” menyampaikan daya ajak itu secara alami dalam bahasa Indonesia.
- source_word: נַשְׁקֶה אֶת־אָבִינוּ יַיִן
  choice: kita beri ayah kita minum anggur
  rationale: Bentuk Hifil dari שׁקה bersifat kausatif. Ungkapan ini mempertahankan arti bahwa mereka menyebabkan atau menyuruh ayah mereka minum, tanpa menambahkan bahwa ia dibuat mabuk.
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: lalu kita tidur dengannya
  rationale: שׁכב dengan עִם merupakan ungkapan halus untuk hubungan seksual. “Tidur dengannya” adalah ungkapan Indonesia yang alami dan tetap mempertahankan gaya tidak langsung teks Ibrani.
- source_word: וּנְחַיֶּה
  choice: supaya kita dapat mempertahankan
  rationale: Bentuk Piel kohortatif dari חיה berarti membuat tetap hidup atau memelihara kelangsungan. “Mempertahankan” menyampaikan maksud menjaga kelanjutan keturunan.
- source_word: מֵאָבִינוּ
  choice: dari ayah kita
  rationale: Preposisi מן menandai sumber atau asal. Terjemahan ini mempertahankan hubungan asal keturunan dengan ayah mereka.
- source_word: זָרַע
  choice: keturunan
  rationale: Dalam konteks ini זרע menunjuk kepada anak atau garis keturunan, bukan benih secara harfiah. “Keturunan” jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Tujuan tindakan yang diungkapkan oleh וּנְחַיֶּה ... זָרַע
  choice: mempertahankan keturunan dari ayah kita
  alternative: memperoleh keturunan dari ayah kita
  rationale: Terjemahan utama mempertahankan unsur ‘membuat tetap hidup/memelihara kelangsungan’ dalam verba Ibrani dan tidak mereduksinya menjadi sekadar memperoleh anak.
translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. “Tidur dengannya” mempertahankan eufemisme seksual sumber. Dua bentuk kohortatif dirangkai secara alami di bawah ajakan “Mari kita”, sedangkan tujuan tindakan tetap dinyatakan dengan “supaya”.
