base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: id
  text: Sebelum mereka berbaring, laki-laki kota itu, yaitu laki-laki Sodom, mengelilingi rumah itu—dari yang muda sampai yang tua, seluruh penduduk dari setiap penjuru kota.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa terakhir secara harfiah berbunyi “dari ujung”; dalam konteks ini maksudnya dari setiap penjuru atau seluruh bagian kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: Sebelum mereka berbaring
  rationale: Ungkapan waktu ini menyatakan bahwa pengepungan terjadi sebelum para tamu berbaring untuk bermalam; terjemahan ini mempertahankan gambaran konkret verba שׁכב tanpa menambahkan kata 'tidur'.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: laki-laki dari kota itu, yaitu laki-laki Sodom
  rationale: Kata אַנְשֵׁי secara khusus menunjuk kepada laki-laki, sedangkan pengulangan kedua merupakan aposisi yang mengidentifikasi kota tersebut sebagai Sodom.
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: mengepung rumah itu
  rationale: Verba נסב dengan עַל dapat berarti mengelilingi atau berkumpul di sekeliling; dalam konteks ini 'mengepung' secara alami menyampaikan kerumunan yang menutup sekeliling rumah.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: dari yang muda sampai yang tua
  rationale: Merisme ini mencakup seluruh rentang usia dan dapat diterjemahkan secara alami tanpa mempersempit נַעַר menjadi hanya 'anak laki-laki'.
- source_word: כָּל הָעָם
  choice: seluruh penduduk
  rationale: עָם adalah istilah kolektif; dalam konteks kota, 'penduduk' menyampaikan kelompok masyarakat yang dimaksud sambil membedakannya dari אַנְשֵׁי yang secara eksplisit maskulin.
- source_word: מִקָּצֶה
  choice: dari setiap penjuru kota
  rationale: Secara harfiah berarti 'dari ujung'; dalam konteks ini merupakan ungkapan ringkas yang menunjukkan bahwa mereka datang dari seluruh bagian kota.
theological_decisions:
- issue: Bahasa bergender dalam penggambaran kerumunan
  choice: Mempertahankan 'laki-laki' untuk dua kemunculan אַנְשֵׁי, lalu memakai istilah kolektif 'seluruh penduduk' untuk כָּל הָעָם.
  alternative: Menerjemahkan semuanya secara netral sebagai 'orang-orang' atau menyempitkan כָּל הָעָם menjadi 'semua laki-laki'.
  rationale: Pilihan ini mempertahankan peralihan yang nyata dalam bahasa Ibrani dari sebutan maskulin kepada kata kolektif, tanpa menghapus atau memperluas rincian gender secara tidak berdasar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional dipertahankan dengan 'yaitu' agar pengulangan Ibrani jelas dan alami. Tanda pisah menjaga penekanan pada cakupan usia dan seluruh kota.
