revisions:
- from: Sebelum mereka berbaring, laki-laki dari kota itu, yaitu laki-laki Sodom, mengepung rumah itu—dari yang muda sampai yang tua, seluruh penduduk dari setiap penjuru kota.[a]
  to: Sebelum mereka berbaring, laki-laki kota itu, yaitu laki-laki Sodom, mengelilingi rumah itu—dari yang muda sampai yang tua, seluruh penduduk dari setiap penjuru kota.[a]
  rationale: Revisi terbatas pada penggantian “mengepung” dengan “mengelilingi” agar tidak menambahkan nuansa yang lebih kuat daripada verba Ibrani, serta pada perapian “laki-laki dari kota itu” menjadi “laki-laki kota itu.” Makna, cakupan usia, pembedaan gender dalam istilah sumber, dan jangkar catatan kaki tetap dipertahankan.
