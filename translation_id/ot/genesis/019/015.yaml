base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: id
  text: Ketika fajar mulai menyingsing, para malaikat mendesak Lot dengan berkata, “Bangunlah, bawalah istrimu dan kedua anak perempuanmu yang ada di sini, agar engkau tidak turut binasa dalam hukuman atas kota ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kejahatan kota ini” atau “karena kesalahan kota ini.” Kata Ibrani ini dapat merujuk pada kejahatan atau kesalahan, kesalahan yang ditanggung, maupun hukuman sebagai akibat dari kesalahan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: Ketika fajar mulai menyingsing
  rationale: Ungkapan ini menyampaikan keadaan ketika fajar sedang terbit dalam bahasa Indonesia yang alami, sambil mempertahankan aspek permulaan waktu.
- source_word: וַיָּאִיצוּ
  choice: mendesak
  rationale: Kata kerja ini menunjukkan tekanan agar seseorang segera bertindak; “mendesak” mempertahankan urgensi tersebut.
- source_word: הַמַּלְאָכִים
  choice: para malaikat
  rationale: Dalam konteks Kejadian 19, para utusan ini adalah makhluk surgawi, sehingga “malaikat” paling tepat bagi pembaca Indonesia.
- source_word: קוּם קַח
  choice: Bangunlah, bawalah
  rationale: Kedua bentuk perintah dipertahankan. Dalam konteks membawa anggota keluarga keluar dari kota, “bawalah” lebih alami daripada “ambillah”.
- source_word: אֶת אִשְׁתְּךָ וְאֶת שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: istrimu dan kedua anak perempuanmu yang ada di sini
  rationale: “Kedua anak perempuanmu” mempertahankan jumlah yang tentu, sedangkan “yang ada di sini” menyampaikan arti partisip “yang didapati/hadir” secara alami.
- source_word: פֶּן תִּסָּפֶה
  choice: supaya engkau tidak ikut dilenyapkan
  rationale: Bentuk pasif ini memperingatkan bahwa Lot dapat turut binasa bersama kota. Kata “ikut” memperjelas gagasan terseret dalam nasib bersama tanpa mengubah pelaku yang tidak dinyatakan.
- source_word: בַּעֲוֺן הָעִיר
  choice: dalam hukuman atas kota ini
  rationale: Dalam konteks penghakiman, עָוֹן dapat menunjuk pada akibat hukuman dari kesalahan. “Hukuman atas kota ini” alami dalam bahasa Indonesia dan sesuai dengan ancaman kehancuran, sementara keluasan makna Ibraninya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna עָוֹן dalam konteks penghakiman
  choice: hukuman atas kota ini
  alternative: kesalahan kota ini; karena kesalahan kota ini
  rationale: Kata Ibrani dapat berarti kejahatan/kesalahan, kesalahan yang ditanggung, atau hukuman sebagai akibatnya. Konteks langsung menekankan kehancuran yang akan menimpa kota, tetapi ketegangan leksikalnya tetap disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “Bangunlah” dan “bawalah” mempertahankan desakan langsung, sedangkan “yang ada di sini” mudah dipahami pembaca umum.
