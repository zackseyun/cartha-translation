  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: fajar yang terbit, desakan para malaikat, dua putri yang hadir, dan ancaman turut binasa dalam penghukuman kota semuanya tersampaikan. Namun, bentuk peringatan פֶּן lebih tepat diterjemahkan dengan konstruksi pencegahan seperti “agar ... tidak turut binasa” daripada “supaya ... tidak ikut dilenyapkan.”'
  naturalness: “Para malaikat mendesak Lot, kata mereka” kurang luwes dalam narasi Indonesia modern. “Para malaikat mendesak Lot dengan berkata” jelas dan alami. “Turut binasa” juga lebih idiomatis dan lebih dekat dengan gagasan tersapu/lenyap bersama penduduk kota daripada “ikut dilenyapkan.”
  terminology: “Malaikat,” “Lot,” “istrimu,” dan “kedua anak perempuanmu yang ada di sini” tepat. “Hukuman atas kota ini” merupakan pilihan kontekstual yang sah untuk עָוֹן; catatan kaki perlu menyatakan secara lebih rapi rentang makna kejahatan/kesalahan, kesalahan yang ditanggung, dan hukuman akibatnya.
