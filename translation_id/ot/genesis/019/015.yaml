revisions:
- from: Ketika fajar mulai menyingsing, para malaikat mendesak Lot, kata mereka, “Bangunlah, bawalah istrimu dan kedua anak perempuanmu yang ada di sini, supaya engkau tidak ikut dilenyapkan dalam hukuman atas kota ini.[a]”
  to: Ketika fajar mulai menyingsing, para malaikat mendesak Lot dengan berkata, “Bangunlah, bawalah istrimu dan kedua anak perempuanmu yang ada di sini, agar engkau tidak turut binasa dalam hukuman atas kota ini.[a]”
  rationale: Revisi ini memperhalus sintaks naratif dan ungkapan peringatan dalam bahasa Indonesia baku modern, sambil mempertahankan unsur-unsur teks sumber. Pilihan utama “hukuman atas kota ini” tetap sesuai konteks penghakiman, sedangkan catatan kaki mempertahankan kemungkinan makna lain dari עָוֹן tanpa memutuskan ambiguitas leksikal secara berlebihan.
