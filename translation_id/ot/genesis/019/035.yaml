base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: id
  text: Maka, pada malam itu mereka juga memberi ayah mereka anggur untuk diminum. Lalu putri yang lebih muda itu bangun dan berbaring dengan ayahnya. Ayahnya tidak tahu ketika putrinya berbaring ataupun ketika putrinya bangun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “tentang dia berbaring ataupun tentang dia bangun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: mereka memberi ... minum
  rationale: Bentuk Hifil dari שׁקה berarti memberi atau menyebabkan seseorang minum. Ungkapan ini mempertahankan daya kausatif tanpa menambahkan tafsiran yang lebih kuat bahwa mereka membuat ayahnya mabuk.
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: pada malam itu mereka juga
  rationale: גַּם menandai kelanjutan dari malam sebelumnya, sedangkan בַּלַּיְלָה הַהוּא merupakan ungkapan waktu yang wajar diterjemahkan 'pada malam itu'.
- source_word: וַתָּקָם הַצְּעִירָה
  choice: anak perempuan yang lebih muda bangun
  rationale: הַצְּעִירָה menunjuk kepada perempuan yang lebih muda. 'Anak perempuan' diperjelas dari konteks agar alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: berbaring dengan ayahnya
  rationale: Ungkapan Ibrani ini merupakan idiom bagi hubungan seksual. Terjemahan 'berbaring dengan' menjaga bentuk ungkapan sumber dan tetap dapat dipahami dalam konteks.
- source_word: וְלֹא יָדַע
  choice: Ayahnya tidak tahu
  rationale: ידע di sini menyatakan pengetahuan atau kesadaran. 'Tidak tahu' mempertahankan ungkapan Ibrani tanpa menjelaskan lebih jauh sifat ketidaksadarannya.
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: ketika anaknya berbaring ataupun ketika ia bangun
  rationale: ב dengan kedua bentuk verbal-nominal ini berfungsi secara temporal. Struktur berpasangan dipertahankan, sementara penyebutan 'anaknya' menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia.
