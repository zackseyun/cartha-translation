base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: id
  text: Lalu mereka membutakan laki-laki yang berada di pintu rumah itu[a], dari yang kecil sampai yang besar, sehingga mereka kelelahan mencari pintu itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat mereka tersilau dan bingung melihat”; istilah Ibrani yang langka ini mungkin menunjukkan lebih dari kebutaan biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: membutakan
  rationale: Secara harfiah bentuk Hifil dari נכה berarti ‘memukul’ atau ‘menimpakan’. Bersama בַּסַּנְוֵרִים, ungkapan ini secara alami diterjemahkan sebagai tindakan menyebabkan kebutaan, yaitu ‘membutakan’.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Kata אֲנָשִׁים menunjuk kepada para laki-laki dalam kerumunan itu. Dalam konteks ini, ‘orang-orang’ terdengar alami dalam bahasa Indonesia dan rujukan maskulinnya sudah jelas dari konteks ayat-ayat sekitar.
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: yang berada di pintu masuk rumah itu
  rationale: Frasa ini menunjukkan lokasi mereka. ‘Pintu masuk rumah itu’ menyampaikan arti פֶּתַח sebagai bukaan atau jalan masuk, bukan semata-mata daun pintunya.
- source_word: בַּסַּנְוֵרִים
  choice: membutakan ... [a]
  rationale: סַנְוֵרִים adalah istilah langka bagi gangguan penglihatan yang ditimpakan secara adikodrati. ‘Membutakan’ memberikan arti utama yang jelas, sedangkan kemungkinan nuansa silau atau kekacauan penglihatan dipertahankan dalam catatan kaki.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: dari yang kecil sampai yang besar
  rationale: Terjemahan ini mempertahankan merisme Ibrani secara dekat dan tidak membatasi maksudnya menjadi usia atau kedudukan saja.
- source_word: וַיִּלְאוּ
  choice: mereka kelelahan
  rationale: לָאָה menyatakan menjadi letih atau kehabisan tenaga. ‘Kelelahan’ alami dan tepat untuk hasil usaha mereka yang sia-sia.
- source_word: לִמְצֹא הַפָּתַח
  choice: mencari pintu masuk itu
  rationale: Infinitif לִמְצֹא menyatakan tujuan usaha yang melelahkan. Dalam bahasa Indonesia, ‘kelelahan mencari’ secara alami menyiratkan usaha untuk menemukan tanpa menambahkan penjelasan yang berlebihan.
theological_decisions:
- issue: Hakikat gangguan yang dinyatakan oleh סַנְוֵרִים
  choice: kebutaan yang ditimpakan secara adikodrati
  alternative: keadaan tersilaukan atau kekacauan penglihatan
  rationale: Narasi menunjukkan bahwa gangguan itu membuat mereka tidak mampu menemukan pintu masuk. Karena istilah Ibraninya langka dan mungkin lebih luas daripada kebutaan biasa, teks utama memakai arti yang paling jelas, sementara nuansa alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan ‘dari yang kecil sampai yang besar’ dipertahankan untuk menjaga ungkapan inklusif bahasa Ibrani tanpa menafsirkannya secara sempit sebagai umur atau status.
