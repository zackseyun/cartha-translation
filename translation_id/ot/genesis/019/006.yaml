  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: id
  text: Lalu Lot keluar menemui mereka di pintu masuk dan menutup pintu itu di belakangnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke pintu masuk.” Bahasa Ibrani membedakan pintu masuk atau bukaan (פֶּתַח) dari pintu itu sendiri (דֶּלֶת).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lalu ... keluar
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan tindakan lampau; “lalu ... keluar” alami dalam narasi Indonesia dan mempertahankan arah geraknya.
- source_word: אֲלֵהֶם
  choice: menemui mereka
  rationale: Preposisi אֶל dengan sufiks orang ketiga jamak menyatakan gerak menuju orang-orang di luar; bersama “keluar”, “menemui mereka” menyampaikannya secara alami.
- source_word: לוֹט
  choice: Lot
  rationale: Nama diri ini mengikuti bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: הַפֶּתְחָה
  choice: di ambang pintu
  rationale: פֶּתַח berarti bukaan atau jalan masuk, sedangkan akhiran lokatif/direksional menyatakan gerak ke arahnya. “Di ambang pintu” secara alami menggambarkan posisi Lot pada jalan masuk sambil tetap membedakannya dari daun pintu yang disebut berikutnya.
- source_word: וְהַדֶּלֶת
  choice: dan ... pintu itu
  rationale: דֶּלֶת menunjuk pada pintu atau daun pintu itu sendiri, berbeda dari פֶּתַח, yaitu jalan masuk atau bukaannya.
- source_word: סָגַר
  choice: menutup
  rationale: Kata kerja סגר berarti menutup; “menutup pintu” merupakan padanan naratif yang wajar dalam bahasa Indonesia.
- source_word: אַחֲרָיו
  choice: di belakangnya
  rationale: 'Dalam konteks ini אַחַר bersufiks memiliki arti ruang: Lot menutup pintu setelah berada di luar, sehingga pintu itu ada di belakangnya.'
