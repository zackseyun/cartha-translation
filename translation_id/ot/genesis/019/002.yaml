  - severity: low
    issue: Kontras dalam jawaban para tamu dapat dibuat lebih eksplisit.
    rationale: Partikel כִּי setelah לֹא memperkenalkan alternatif yang berlawanan. “Tetapi” adalah padanan Indonesia yang alami tanpa menambah makna.
