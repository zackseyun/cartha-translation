source:
  edition: WLC
  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: id
  text: Ia berkata, “Mohon, tuan-tuanku, singgahlah ke rumah hambamu ini. Bermalamlah dan basuhlah kaki kalian. Kemudian kalian dapat bangun pagi-pagi dan melanjutkan perjalanan.” Tetapi mereka berkata, “Tidak, kami akan bermalam di alun-alun.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “alun-alun” menunjuk pada ruang umum terbuka di dalam kota, seperti lapangan atau plaza.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: kiranya
  rationale: Dalam konteks ini gabungan partikel tersebut berfungsi sebagai permohonan sopan yang mendesak, bukan perintah harfiah untuk melihat.
- source_word: אֲדֹנַי
  choice: Tuan-tuanku
  rationale: Lot menyapa dua pendatang dengan hormat; bentuk jamak didukung oleh kata kerja dan pronomina jamak dalam ayat ini, tanpa menjadikannya gelar ilahi.
- source_word: סוּרוּ נָא אֶל־בֵּית עַבְדְּכֶם
  choice: singgahlah kiranya ke rumah hambamu ini
  rationale: סור menyatakan berbelok atau menyinggah dari jalan, sedangkan נָא memberi nada permohonan. Ungkapan 'hambamu' mempertahankan formula kerendahan hati Lot.
- source_word: וְלִינוּ
  choice: Bermalamlah
  rationale: Kata לין menunjuk pada tinggal selama malam; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: basuhlah kaki kalian
  rationale: Terjemahan langsung mempertahankan kebiasaan menjamu tamu pada zaman itu; 'kalian' dengan jelas menyatakan jamak.
- source_word: וְהִשְׁכַּמְתֶּם
  choice: Besok pagi kalian dapat bangun
  rationale: Kata kerja ini berarti bangun pagi-pagi; 'dapat' sesuai dengan rangkaian tawaran Lot dan tidak membuatnya terdengar sebagai perintah keras.
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: melanjutkan perjalanan
  rationale: Padanan idiomatis yang alami untuk pergi meneruskan jalan atau rute mereka.
- source_word: כִּי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Sesudah penolakan לֹא, partikel ini memperkenalkan pilihan tegas yang berlawanan. Dalam bahasa Indonesia, kontras tersebut sudah jelas melalui susunan 'Tidak, kami akan ...'; menerjemahkannya sebagai 'tetapi' akan terasa kurang alami.
- source_word: בָרְחוֹב
  choice: di alun-alun
  rationale: רְחוֹב di sini menunjuk pada ruang umum terbuka di kota, bukan sekadar jalan; 'alun-alun' menyampaikan gambaran itu dengan jelas.
- source_word: נָלִין
  choice: kami akan bermalam
  rationale: Mempertahankan padanan akar לין yang sama dengan pemakaiannya sebelumnya dalam ayat ini.
theological_decisions:
- issue: Apakah אֲדֹנַי merupakan gelar ilahi atau sapaan kepada manusia
  choice: 'Sapaan manusia jamak: “Tuan-tuanku”'
  alternative: “Tuanku” sebagai sapaan kehormatan tunggal yang mungkin mengarah kepada satu tokoh
  rationale: Konteks langsung menggambarkan Lot berbicara kepada dua pendatang, dan bentuk kata kerja serta pronomina selanjutnya semuanya jamak. Terjemahan utama tidak memasukkan identifikasi ilahi yang tidak dinyatakan secara eksplisit dalam sapaan ini.
translation_notes:
  register: Bahasa Indonesia modern yang sopan dan bermartabat. 'Tuan-tuanku' mempertahankan penghormatan jamak; 'hambamu' mempertahankan ungkapan merendahkan diri dari dunia kuno. 'Kalian' dipakai agar bentuk jamak dalam sapaan dan tindakan tetap jelas.
