base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: id
  text: Kemudian Lot naik dari Zoar dan tinggal di daerah pegunungan bersama kedua anak perempuannya, karena ia takut tinggal di Zoar. Maka ia tinggal di dalam sebuah gua[a], ia dan kedua anak perempuannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “gua itu”. Kata sandang tertentu dalam bahasa Ibrani dapat menandai gua khusus yang ditempati Lot, meskipun gua itu belum disebutkan sebelumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: naik dari Zoar
  rationale: Kata kerja עלה menyatakan gerak naik, sesuai dengan perpindahan topografis dari Zoar menuju daerah pegunungan.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks ini ישב menunjuk pada berdiam atau menetap di suatu tempat; “tinggal” merupakan padanan Indonesia modern yang alami.
- source_word: בָּהָר
  choice: di daerah pegunungan
  rationale: Bentuk tunggal הַר dapat menunjuk secara kolektif pada kawasan bergunung. Padanan ini mempertahankan nuansa topografis tanpa menyiratkan bahwa Lot tinggal di dalam sebuah gunung tertentu.
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: bersama kedua anak perempuannya
  rationale: Ungkapan ini menyatakan bahwa kedua anak perempuan Lot menyertainya; susunan dengan “bersama” lebih wajar dalam bahasa Indonesia.
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: karena ia takut tinggal di Zoar
  rationale: כִּי memperkenalkan alasan, sedangkan יָרֵא menyatakan keadaan takut. Terjemahan ini mempertahankan hubungan sebab yang jelas.
- source_word: בַּמְּעָרָה
  choice: di dalam sebuah gua
  rationale: Secara bentuk, nomina ini memakai kata sandang tertentu, tetapi gua tersebut baru diperkenalkan dalam wacana. Bahasa Indonesia secara alami memakai “sebuah gua”; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: ia dan kedua anak perempuannya
  rationale: Pengulangan penutup dipertahankan untuk mencerminkan penegasan naratif dalam bahasa Ibrani.
