  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: id
  text: “Cepatlah, larilah ke sana, sebab aku tidak dapat berbuat apa-apa sampai engkau tiba di sana!” Itulah sebabnya kota itu dinamai[b] Zoar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Zoar terdengar mirip dengan kata Ibrani yang berarti “kecil” atau “tidak berarti”; lihat Kejadian 19:20.
    reason: cross_reference
  - marker: b
    text: Secara lebih harfiah, “ia menyebut nama kota itu Zoar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Cepatlah
  rationale: Bentuk perintah ini menyatakan urgensi. “Cepatlah” alami dalam bahasa Indonesia dan mempertahankan daya desaknya.
- source_word: הִמָּלֵט
  choice: larilah
  rationale: Bentuk perintah nifal dari מלט berarti meloloskan atau menyelamatkan diri. Dalam konteks pelarian mendesak menuju tempat aman, “larilah” terdengar alami tanpa menambahkan penjelasan yang tidak dinyatakan teks.
- source_word: שָׁמָּה
  choice: ke sana / di sana
  rationale: Adverbia berakhiran direktif menunjukkan arah pada kemunculan pertama (“ke sana”); sesudah kata “tiba”, idiom Indonesia memakai “di sana”.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dalam ragam naratif yang wajar dan bermartabat.
- source_word: לֹא אוּכַל
  choice: aku tidak dapat
  rationale: Menyampaikan ketidakmampuan secara langsung, sesuai bentuk sumber, tanpa memperlunaknya menjadi larangan atau ketidakharusan.
- source_word: לַעֲשׂוֹת דָּבָר
  choice: berbuat apa-apa
  rationale: Secara harfiah berarti “melakukan suatu hal”; bentuk idiomatis negatif dalam bahasa Indonesia ialah “tidak ... berbuat apa-apa”.
- source_word: עַד בֹּאֲךָ
  choice: sampai engkau tiba
  rationale: Infinitif dengan sufiks orang kedua tunggal maskulin menyatakan batas waktu hingga orang yang disapa tiba.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Formula kesimpulan ini menghubungkan ucapan sebelumnya dengan penjelasan asal nama tempat secara alami.
- source_word: קָרָא שֵׁם הָעִיר
  choice: kota itu dinamai
  rationale: Ungkapan Ibrani secara harfiah memakai verba orang ketiga tunggal, “ia menamai nama kota itu”; bentuk pasif Indonesia lebih alami dan tidak memaksakan identitas subjek yang tidak disebutkan.
- source_word: צֹעַר
  choice: Zoar
  rationale: Nama tempat ditransliterasikan; permainan katanya dengan kata Ibrani yang berarti kecil dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pernyataan ketidakmampuan dalam konteks penghukuman
  choice: “aku tidak dapat berbuat apa-apa”
  alternative: “aku tidak boleh berbuat apa-apa” atau “aku tidak dapat melakukan hal ini”
  rationale: לֹא אוּכַל secara langsung menyatakan ketidakmampuan. Terjemahan mempertahankan ketegangan naratif dan teologis tanpa menjelaskannya sebagai keterbatasan malaikat, izin ilahi, atau larangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. “Engkau” dipakai untuk mempertahankan sapaan tunggal dalam konteks kitab suci; perintah dibuat singkat dan mendesak. Tanda seru mencerminkan urgensi ujaran, sementara bentuk pasif pada penamaan kota menjaga kelancaran tanpa menghilangkan alternatif harfiahnya.
