  naturalness: Terjemahan pada dasarnya alami. “Jangan sampai ...” lebih lazim dalam bahasa Indonesia modern baku daripada “jangan-jangan” untuk menyatakan kekhawatiran akan akibat buruk.
  terminology: “Perkenanan,” “hamba,” “kasih setia,” dan “memelihara hidupku” sesuai dengan konteks dan register. Kapitalisasi huruf kecil pada sapaan orang kedua patut dipertahankan karena rujukannya dalam narasi tidak perlu diputuskan secara teologis.
