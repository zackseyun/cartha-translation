  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: id
  text: Lihatlah, kiranya hambamu telah mendapat perkenanan di matamu, dan engkau telah menunjukkan betapa besarnya kasih setiamu kepadaku dengan memelihara hidupku. Namun, aku tidak sanggup melarikan diri ke pegunungan, jangan sampai bencana[a] itu menyusulku dan aku mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kejahatan”; di sini yang dimaksud adalah malapetaka atau bencana yang akan menimpa Lot.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah, kiranya
  rationale: הִנֵּה menarik perhatian, sedangkan נָא memberi nada permohonan yang sopan dan mendesak. Ungkapan ini mempertahankan keduanya dalam ragam Indonesia yang bermartabat.
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: telah mendapat perkenanan di matamu
  rationale: Mempertahankan idiom Ibrani tentang penerimaan atau pandangan yang baik, tanpa terdengar terlalu kuno.
- source_word: עַבְדְּךָ
  choice: hambamu ini
  rationale: Dalam sapaan ini kata tersebut merupakan sebutan diri yang merendah di hadapan pihak yang lebih tinggi; 'hamba' lebih tepat daripada istilah yang menonjolkan status perbudakan.
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: engkau telah menunjukkan kasih setiamu yang begitu besar
  rationale: Bentuk kausatif גדל menyatakan pembesaran atau kelimpahan. Susunan alami ini mempertahankan intensitasnya dan mengaitkannya dengan tindakan nyata.
- source_word: חַסְדְּךָ
  choice: kasih setiamu
  rationale: חסד mencakup kasih, kemurahan, dan kesetiaan yang teguh. 'Kasih setia' mempertahankan keluasan makna teologisnya tanpa memaksakan pengertian teknis tentang perjanjian.
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: dengan memelihara hidupku
  rationale: Infinitif ini mengungkapkan hasil atau tujuan berupa kelangsungan hidup. Pilihan ini alami dan tidak memasukkan muatan soteriologis yang tidak diperlukan.
- source_word: וְאָנֹכִי לֹא אוּכַל
  choice: Namun, aku tidak sanggup
  rationale: Menangkap pertentangan dengan kemurahan yang baru disebut dan penekanan pada diri pembicara.
- source_word: לְהִמָּלֵט הָהָרָה
  choice: melarikan diri ke pegunungan
  rationale: הָהָר dapat menunjuk kawasan perbukitan atau pegunungan, dan akhiran direktif menunjukkan gerak menuju tempat itu. Dalam konteks topografi, 'pegunungan' paling alami dalam bahasa Indonesia.
- source_word: תִּדְבָּקַנִי
  choice: menyusul aku
  rationale: Walaupun arti dasarnya 'melekat', dalam konteks ancaman yang bergerak mendekat kata ini berarti mencapai atau menyusul seseorang.
- source_word: הָרָעָה
  choice: bencana
  rationale: Dalam konteks ini רעה menunjuk malapetaka yang mengancam Lot, bukan kejahatan moral abstrak.
theological_decisions:
- issue: Makna חֶסֶד dalam permohonan kepada utusan ilahi yang bertindak dengan kewenangan Allah
  choice: kasih setia
  alternative: kebaikan; belas kasihan; kemurahan
  rationale: '''Kasih setia'' mempertahankan unsur kasih yang nyata dan kesetiaan yang teguh, tetapi tidak mengubahnya menjadi rumusan teknis perjanjian yang tidak dinyatakan secara eksplisit dalam ayat ini.'
- issue: Rujukan orang kedua tunggal dalam ucapan Lot
  choice: engkau/mu dengan huruf kecil
  alternative: Engkau/Mu dengan kapitalisasi penghormatan ilahi
  rationale: Bentuk Ibrani tidak menandai kapitalisasi, dan narasi melibatkan utusan ilahi. Huruf kecil mempertahankan ambiguitas rujukan tanpa memutuskan secara tipografis apakah sapaan itu langsung kepada Allah atau kepada utusan-Nya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Idiom Ibrani 'di matamu' dipertahankan, sedangkan susunan yang terlalu kaku dilancarkan. Ambiguitas identitas pihak yang disapa tidak diselesaikan melalui kapitalisasi.
