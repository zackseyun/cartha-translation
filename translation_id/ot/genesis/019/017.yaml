base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: id
  text: Ketika mereka telah membawa orang-orang itu ke luar, ia berkata,[a] “Larilah untuk menyelamatkan nyawamu! Jangan menoleh ke belakang dan jangan berhenti di mana pun di dataran itu. Larilah ke pegunungan,[b] agar engkau tidak ikut binasa.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani berbentuk tunggal; teks tidak menyebutkan secara khusus siapa di antara mereka yang berbicara.
    reason: textual_ambiguity
  - marker: b
    text: 'Atau: “ke gunung” atau “ke daerah perbukitan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “agar engkau tidak ikut dilenyapkan” atau “agar engkau tidak ikut tersapu habis.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: ke luar
  rationale: Bentuk berarah ini menunjukkan gerakan dari dalam kota menuju luar; “ke luar” merupakan padanan Indonesia yang alami dan tepat.
- source_word: הִמָּלֵט עַל נַפְשֶׁךָ
  choice: Larilah untuk menyelamatkan nyawamu
  rationale: Imperatif Niphal dari מלט menyatakan tindakan meloloskan diri secara mendesak, sedangkan עַל נַפְשֶׁךָ menekankan keselamatan nyawa. Ungkapan ini menyampaikan keduanya secara alami tanpa menghilangkan desakan.
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: Jangan menoleh ke belakang
  rationale: Dalam konteks orang yang sedang melarikan diri, “menoleh ke belakang” adalah ungkapan Indonesia alami untuk larangan melihat ke arah belakang diri.
- source_word: וְאַל תַּעֲמֹד
  choice: dan jangan berhenti
  rationale: עמד di sini berarti berhenti atau tetap berada di suatu tempat, bukan sekadar berdiri tegak.
- source_word: בְּכָל הַכִּכָּר
  choice: di mana pun di dataran itu
  rationale: כִּכָּר menunjuk pada kawasan dataran, dan בְּכָל dalam larangan ini secara idiomatis berarti tidak berhenti di bagian mana pun dari kawasan tersebut.
- source_word: הָהָרָה
  choice: ke pegunungan
  rationale: Bentuk berarah dari הַר dapat menunjuk ke gunung atau kawasan perbukitan/pegunungan. “Ke pegunungan” menyatakan kontras topografis dengan dataran secara alami.
- source_word: פֶּן תִּסָּפֶה
  choice: agar engkau tidak ikut binasa
  rationale: Niphal נספה dapat berarti binasa atau dilenyapkan bersama yang lain dalam malapetaka. Kata “ikut” mempertahankan nuansa bahwa orang itu dapat turut terkena penghukuman yang menimpa kawasan tersebut.
theological_decisions:
- issue: Identitas pembicara
  choice: “ia berkata” tanpa menyebut identitas pembicara
  alternative: “mereka berkata” atau “salah seorang malaikat berkata”
  rationale: Teks Ibrani memakai kata kerja tunggal, tetapi tidak secara eksplisit mengidentifikasi pembicara. Terjemahan mempertahankan bentuk tunggal dan tidak menyelesaikan ketidakjelasan naratif itu dengan menambahkan sebutan “malaikat”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mempertahankan jumlah gramatikal perintah Ibrani. Susunan kalimat dibuat lugas dan mendesak, sementara ketidakjelasan mengenai pembicara tetap dipertahankan.
