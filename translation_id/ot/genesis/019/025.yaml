  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: id
  text: Ia menjungkirbalikkan kota-kota itu[a], seluruh Dataran itu[b], semua penduduk kota-kota itu, dan segala tumbuhan di tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “merobohkan” atau “membinasakan.” Kata Ibrani yang digunakan menggambarkan pembalikan yang membawa kehancuran dahsyat.
    reason: lexical_alternative
  - marker: b
    text: “Dataran” di sini merujuk pada kawasan Dataran Yordan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: menjungkirbalikkan
  rationale: Kata kerja הפך menggambarkan pembalikan atau penghancuran dahsyat. “Menjungkirbalikkan” mempertahankan gambaran konkret Ibrani, tidak sekadar menyatakan akibat umum seperti “membinasakan”.
- source_word: הֶעָרִים הָאֵל
  choice: kota-kota itu
  rationale: Kata tunjuk אֵל merujuk kembali kepada kota-kota tertentu yang sudah dibicarakan.
- source_word: כָּל הַכִּכָּר
  choice: seluruh Dataran itu
  rationale: Dalam konteks Kejadian, כִּכָּר menunjuk pada kawasan Dataran Yordan. Huruf kapital membantu menunjukkan bahwa ini adalah sebutan geografis kontekstual.
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: semua penduduk kota-kota itu
  rationale: Bentuk partisip dari ישב berarti orang-orang yang tinggal di kota-kota tersebut; “penduduk” ringkas dan wajar dalam bahasa Indonesia.
- source_word: צֶמַח הָאֲדָמָה
  choice: segala tumbuhan di tanah
  rationale: צֶמַח mengacu pada apa yang bertunas atau tumbuh, sedangkan אֲדָמָה adalah tanah. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran pertumbuhan dari tanah.
theological_decisions:
- issue: Subjek tersirat pada kata kerja tunggal
  choice: Diterjemahkan dengan kata ganti “Ia” tanpa menyebut nama pelaku secara eksplisit.
  alternative: Menyebut “TUHAN” atau “Allah” sebagai subjek eksplisit.
  rationale: Ayat Ibrani ini memakai kata kerja tunggal tanpa subjek nomina yang dinyatakan dalam klausa tersebut, walaupun konteks sebelumnya menunjukkan bahwa TUHAN adalah pelakunya. Kata ganti mempertahankan bentuk dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan, sementara pilihan “menjungkirbalikkan” menjaga citra konkret teks Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
