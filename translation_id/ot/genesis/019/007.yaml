  text: וַ/יֹּאמַ֑ר אַל נָ֥א אַחַ֖/י תָּרֵֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/007.yaml
  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: id
  text: Lalu ia berkata, “Saudara-saudaraku, kumohon, jangan berbuat jahat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַי
  choice: Saudara-saudaraku
  rationale: Sapaan harfiah ‘saudara-saudaraku’ dipertahankan sebagai bentuk pendekatan kepada orang-orang sekotanya, tanpa menentukan apakah yang dimaksud saudara kandung.
- source_word: אַל נָא
  choice: kumohon, jangan
  rationale: Partikel נָא memberi nuansa permohonan yang mendesak dan sopan; dalam bahasa Indonesia alami diungkapkan dengan ‘kumohon’ bersama larangan ‘jangan’.
- source_word: תָּרֵעוּ
  choice: berbuat jahat
  rationale: Bentuk verba dari רעע di sini berarti melakukan kejahatan atau bertindak jahat; ‘berbuat jahat’ mempertahankan cakupan umum ungkapan sumber tanpa mempersempitnya pada tindakan tertentu.
theological_decisions:
- issue: Cakupan larangan Lot
  choice: jangan berbuat jahat
  alternative: jangan bertindak keji
  rationale: Teks Ibrani memakai larangan umum dan tidak menyebut tindakan tertentu dalam ayat ini; terjemahan tidak mempersempit atau memperhalus penilaian moralnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan sapaan dan permohonan disesuaikan sedikit agar terdengar alami, sementara nada desakan Lot tetap terpelihara.
