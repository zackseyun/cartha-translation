base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: id
  text: Mereka berkata[a], “Mundur!” Lalu mereka berkata, “Orang ini datang untuk tinggal sebagai pendatang, tetapi sekarang ia malah bertindak sebagai hakim! Sekarang kami akan memperlakukanmu lebih buruk daripada mereka.” Mereka mendesak orang itu—Lot—dengan sangat kuat[b], lalu maju untuk mendobrak pintu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Menyingkirlah!”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “mereka mendesak orang itu, Lot, dengan sangat kuat.”
    reason: source_structure
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: Mundur!
  rationale: Perintah idiomatis yang menyuruh Lot menjauh atau bergerak ke belakang; “Mundur!” alami, tegas, dan mempertahankan nada bermusuhan.
- source_word: הָאֶחָד
  choice: Orang ini
  rationale: Menunjukkan Lot secara merendahkan tanpa menambahkan warna bahasa yang tidak terdapat dalam teks.
- source_word: בָּא לָגוּר
  choice: datang untuk tinggal sebagai pendatang
  rationale: גור mengacu pada tinggal sebagai orang luar yang bukan warga asli; “pendatang” menyampaikan status sosial itu dalam bahasa Indonesia modern.
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: malah bertindak sebagai hakim
  rationale: Infinitif absolut menguatkan tuduhan bahwa Lot lancang menghakimi mereka; “malah” menyampaikan tekanan dan kejengkelan kontekstual tanpa menjadikannya jabatan resmi.
- source_word: נָרַע לְךָ מֵהֶם
  choice: kami akan memperlakukanmu lebih buruk daripada mereka
  rationale: Ungkapan ini merupakan ancaman untuk berbuat jahat atau mencelakakan Lot lebih daripada para tamunya; terjemahan ini alami dan mempertahankan perbandingannya.
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: Mereka mendesak orang itu—Lot—dengan sangat kuat
  rationale: Dalam konteks gerakan menuju pintu, פצר menunjuk pada desakan fisik yang kuat. Tanda pisah mempertahankan penjelasan emfatis “orang itu, Lot,” sedangkan “dengan sangat kuat” mewakili מְאֹד.
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: lalu maju untuk mendobrak pintu
  rationale: נגשׁ dengan infinitif menyatakan gerakan maju dengan tujuan; “mendobrak” secara alami menyampaikan pemecahan paksa pintu dalam konteks ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ancaman massa dibuat tegas tanpa memperinci jenis kekerasan yang tidak dinyatakan secara eksplisit. Struktur Ibrani yang agak janggal pada “orang itu, Lot” dipertahankan secara terbaca dengan tanda pisah.
