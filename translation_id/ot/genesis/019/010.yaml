  naturalness: Susunan revisi tetap alami dalam bahasa Indonesia baku modern. Rangkaian ‘mengulurkan tangan mereka, membawa Lot masuk ..., lalu menutup pintu’ menyampaikan gerak cepat narasi dengan jelas.
  terminology: ‘Orang-orang itu’ mempertahankan sebutan manusiawi generik dari teks Ibrani tanpa mengubahnya menjadi ‘malaikat’. ‘Membawa Lot masuk’ adalah padanan netral dan setia untuk verba kausatif Ibrani.
