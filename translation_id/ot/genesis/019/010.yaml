  text: וַ/יִּשְׁלְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת יָדָ֔/ם וַ/יָּבִ֧יאוּ אֶת ל֛וֹט אֲלֵי/הֶ֖ם הַ/בָּ֑יְתָ/ה וְ/אֶת הַ/דֶּ֖לֶת סָגָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: id
  text: Namun, orang-orang itu mengulurkan tangan mereka, membawa Lot masuk ke dalam rumah bersama mereka, lalu menutup pintu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: kedua orang itu
  rationale: Nomina Ibrani berarti 'orang-orang itu'; konteks dekat menunjukkan bahwa jumlah mereka dua. Terjemahan ini mempertahankan sebutan manusiawi yang dipakai ayat tersebut tanpa menggantinya dengan identifikasi kontekstual 'malaikat'.
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: mengulurkan tangan
  rationale: Ungkapan dengan שׁלח dan 'tangan' menyatakan gerakan menjulurkan atau mengulurkan tangan; bentuk tunggal kolektif 'tangan' wajar dalam bahasa Indonesia.
- source_word: וַיָּבִיאוּ
  choice: menarik ... masuk
  rationale: Bentuk kausatif בוא pada dasarnya berarti 'membawa masuk'. Dalam adegan ketika Lot berada di ambang bahaya dan mereka mengulurkan tangan untuk memasukkannya, 'menarik ... masuk' menyampaikan tindakan konkret secara alami tanpa mengubah hasil geraknya.
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: ke dalam rumah bersama mereka
  rationale: Terjemahan ini mempertahankan tujuan gerak ke rumah sekaligus relasi Lot yang dibawa masuk kepada atau bersama kedua orang tersebut.
- source_word: הַדֶּלֶת
  choice: pintu
  rationale: דֶּלֶת adalah kata biasa untuk pintu; tidak diperlukan penjelasan tambahan.
- source_word: סָגָרוּ
  choice: menutup
  rationale: Kata kerja ini berarti menutup. Rangkaian dengan 'lalu' menghasilkan narasi Indonesia yang lancar dan tetap menunjukkan urutan tindakan.
- source_word: וַ
  choice: Namun
  rationale: Waw meneruskan narasi, tetapi di sini tindakan kedua orang itu berlawanan dengan ancaman massa pada ayat sebelumnya; 'Namun' menyampaikan kontras tersebut secara alami.
theological_decisions:
- issue: Apakah הָאֲנָשִׁים perlu diterjemahkan secara eksplisit sebagai malaikat
  choice: Memakai 'kedua orang itu' dalam teks utama
  alternative: kedua malaikat itu; kedua tamu itu
  rationale: Konteks narasi mengidentifikasi mereka sebagai utusan malaikat, tetapi ayat ini sendiri menyebut mereka 'orang-orang itu'. Terjemahan mempertahankan pilihan leksikal teks sumber dan tidak memasukkan identifikasi tafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. 'Kedua orang itu' alami untuk rujukan definit kepada dua tokoh yang sudah dikenal. Rangkaian verba dengan 'lalu' menjaga gerak narasi yang cepat.
