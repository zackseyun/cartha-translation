id: GEN.19.1
reference: Genesis 19:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: id
  text: Kedua malaikat itu tiba di Sodom pada petang hari, sementara Lot sedang duduk di gerbang kota Sodom.[a] Ketika Lot melihat mereka, ia bangkit menyambut mereka, lalu bersujud dengan muka sampai ke tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Di gerbang kota Sodom” berarti di kawasan gerbang kota, yaitu ruang umum yang juga menjadi pusat kegiatan kemasyarakatan.
    reason: cultural_note
  - marker: b
    text: Atau “membungkuk dengan muka sampai ke tanah.” Bahasa Ibrani menggambarkan tindakan merendahkan tubuh sepenuhnya di hadapan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: tiba
  rationale: Bentuk naratif dari בוא menyatakan kedatangan ke suatu tempat; “tiba” alami dalam narasi Indonesia dan sesuai dengan akhiran arah pada סְדֹמָה.
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: kedua malaikat itu
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”; konteks mengidentifikasi mereka sebagai pengunjung surgawi dari kisah sebelumnya, dan bentuk tertentu ditandai dengan “itu”.
- source_word: סְדֹמָה
  choice: di Sodom
  rationale: Akhiran ה arah menunjukkan gerak menuju Sodom. Bersama verba “tiba”, bahasa Indonesia secara idiomatis memakai “di” untuk tempat tujuan kedatangan.
- source_word: בָּעֶרֶב
  choice: pada petang hari
  rationale: Frasa ini menandai waktu kedatangan; “pada petang hari” jelas, wajar, dan bermartabat dalam bahasa Indonesia modern.
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Partisip Ibrani memberi latar tindakan yang sedang berlangsung; “sedang duduk” mempertahankan aspek duratif itu.
- source_word: בְּשַׁעַר סְדֹם
  choice: di gerbang kota Sodom
  rationale: שַׁעַר menunjuk gerbang beserta kawasan gerbang kota, bukan sekadar sebuah pintu. Penambahan “kota” memperjelas rujukan budaya tanpa mengubah makna.
- source_word: וַיַּרְא לוֹט
  choice: Ketika Lot melihat mereka
  rationale: Objek tidak dinyatakan dalam bahasa Ibrani, tetapi jelas dari konteks. “Ketika” mengungkapkan urutan naratif secara alami.
- source_word: וַיָּקָם לִקְרָאתָם
  choice: ia bangkit menyambut mereka
  rationale: Ungkapan ini memadukan tindakan bangun dan bergerak menemui seseorang; “menyambut” sesuai dengan konteks penerimaan tamu, tanpa menambahkan gagasan yang asing.
- source_word: וַיִּשְׁתַּחוּ אַפַּיִם אָרְצָה
  choice: bersujud dengan muka sampai ke tanah
  rationale: Gabungan ini menggambarkan penghormatan jasmani yang sangat rendah atau prostrasi penuh. “Bersujud” menyampaikan gerak tubuh tersebut, sedangkan frasa berikut mempertahankan rincian idiom Ibraninya.
theological_decisions:
- issue: Apakah וַיִּשְׁתַּחוּ menyatakan penyembahan atau penghormatan melalui sujud
  choice: penghormatan melalui tindakan bersujud
  alternative: menyembah
  rationale: שׁחה dapat menunjuk penyembahan maupun tindakan membungkuk atau bersujud di hadapan makhluk. Konteks ini tidak dengan sendirinya memastikan bahwa Lot sedang mempersembahkan ibadah; karena itu terjemahan mempertahankan tindakan fisiknya tanpa menetapkan klaim teologis yang lebih kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kedua malaikat itu” memberi ketertentuan yang alami; “sementara” menandai latar duratif; dan “bersujud” dipakai secara fisik, bukan sebagai penetapan bahwa tindakan itu pasti merupakan ibadah.
