base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: id
  text: Anak perempuan yang sulung berkata kepada adiknya, “Ayah kita sudah tua, dan tidak ada seorang laki-laki pun di negeri ini yang dapat datang kepada kita[a] menurut kebiasaan seluruh dunia.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “datang kepada kita” adalah ungkapan halus yang dalam konteks ini berarti berhubungan seksual dengan kita.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut cara seluruh bumi.” Maksudnya kemungkinan besar ialah pola atau kebiasaan manusia pada umumnya, khususnya berkenaan dengan hubungan seksual dan kelanjutan keluarga.
    reason: cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: anak perempuan yang sulung
  rationale: Istilah ini menunjuk kepada perempuan yang lahir lebih dahulu. Penyebutan “anak perempuan” dibuat tersurat dari konteks agar pasangan tokohnya jelas dalam bahasa Indonesia.
- source_word: הַצְּעִירָה
  choice: adiknya
  rationale: Secara harfiah berarti “yang lebih muda.” Dalam hubungan antarsaudara, “adiknya” lebih alami dalam bahasa Indonesia dan tetap mempertahankan perbedaan urutan kelahiran.
- source_word: אָבִינוּ זָקֵן
  choice: Ayah kita sudah tua
  rationale: Klausa nominal Ibrani menyatakan keadaan sang ayah. “Sudah tua” merupakan ungkapan Indonesia yang alami dan menyampaikan keadaan itu tanpa menambahkan penilaian lain.
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: dan tidak ada laki-laki di negeri ini
  rationale: אִישׁ secara khusus berarti laki-laki, sesuai konteks hubungan seksual dan keturunan. בָּאָרֶץ dapat berarti “di negeri” atau “di bumi”; “di negeri ini” alami dalam konteks tempat tinggal mereka, sementara ungkapan berikutnya memperluas pandangan kepada dunia manusia pada umumnya.
- source_word: לָבוֹא עָלֵינוּ
  choice: yang akan menghampiri kita
  rationale: Ungkapan Ibrani ini merupakan eufemisme seksual. “Menghampiri kita” mempertahankan sifat eufemistisnya dalam bahasa Indonesia; makna kontekstualnya dijelaskan dalam catatan kaki.
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: sebagaimana kebiasaan semua orang di dunia
  rationale: Secara harfiah, frasa ini berbicara tentang “cara seluruh bumi/negeri.” Pilihan ini menyampaikan idiom Ibrani sebagai kebiasaan manusia pada umumnya, khususnya dalam hal hubungan seksual dan kelanjutan keluarga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Eufemisme seksual dalam teks Ibrani dipertahankan di dalam ayat lalu dijelaskan dalam catatan kaki. Struktur harfiah yang kurang alami, “menurut cara seluruh bumi,” dialihkan secara idiomatis tanpa meniadakan catatan tentang bentuk aslinya.
