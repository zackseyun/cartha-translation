  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: id
  text: Lalu Yahweh menghujankan[a] belerang dan api ke atas Sodom dan Gomora dari Yahweh, dari langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani ini berbentuk kausatif dan secara harfiah berarti “membuat turun sebagai hujan.”
