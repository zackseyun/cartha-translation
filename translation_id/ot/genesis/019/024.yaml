  - marker: b
    text: 'Teks Ibrani mengulang nama ilahi: “Yahweh ... dari Yahweh.” Pengulangan ini dipertahankan dan tidak disederhanakan.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan kedua kemunculannya dalam teks Ibrani.
- source_word: הִמְטִיר
  choice: menurunkan hujan
  rationale: Bentuk Hifil berarti menyebabkan turun sebagai hujan; ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan citra hujan.
- source_word: גָּפְרִית
  choice: belerang
  rationale: Padanan modern dan tepat bagi zat yang dimaksud.
- source_word: אֵשׁ
  choice: api
  rationale: Padanan langsung yang mempertahankan pasangan 'belerang dan api'.
- source_word: עַל
  choice: ke atas
  rationale: Menandai sasaran jatuhnya hukuman dan sesuai dengan verba gerak 'menurunkan'.
- source_word: סְדֹם וְעֲמֹרָה
  choice: Sodom dan Gomora
  rationale: Bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: מֵאֵת יְהוָה
  choice: dari Yahweh
  rationale: Mempertahankan pernyataan eksplisit mengenai sumber serta pengulangan nama ilahi yang tidak biasa.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Dalam konteks ini bentuk jamak Ibrani merujuk pada bentangan langit sebagai tempat asal turunnya hujan; bentuk tunggal idiomatis dalam bahasa Indonesia.
- source_word: וַ
  choice: Lalu
  rationale: Menandai kelanjutan dan urutan narasi secara alami.
theological_decisions:
- issue: Pengulangan nama ilahi dalam 'Yahweh ... dari Yahweh'
  choice: Mempertahankan kedua penyebutan nama Yahweh dalam teks utama.
  alternative: Menyederhanakannya menjadi 'Yahweh menurunkan ... dari langit' atau menafsirkan 'dari diri-Nya sendiri'.
  rationale: Teks Ibrani secara eksplisit mengulang nama ilahi. Terjemahan tidak seharusnya menghapus atau menjelaskan ketegangan yang mungkin timbul mengenai sumber dan pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Koma mengapit frasa 'dari Yahweh' untuk membantu keterbacaan tanpa menghilangkan pengulangan sumber; semua penanda catatan kaki dicantumkan dalam teks utama.
