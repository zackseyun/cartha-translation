  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: id
  text: Matahari telah terbit di atas bumi[a], dan Lot telah tiba di Zoar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “bumi” juga dapat berarti “tanah” atau “negeri”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Matahari terbit di atas bumi, dan Lot tiba di Zoar.” Kedua verba perfektif bahasa Ibrani dapat diterjemahkan sebagai tindakan lampau sederhana sesuai konteks narasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: matahari
  rationale: Nomina tertentu dengan artikel; dalam bahasa Indonesia, 'matahari' secara alami sudah merujuk pada matahari yang dikenal.
- source_word: יָצָא
  choice: telah terbit
  rationale: Secara harfiah berarti 'keluar', tetapi ketika bersubjek matahari, ungkapan ini secara idiomatis berarti matahari terbit. Bentuk 'telah terbit' menyatakan tindakan yang sudah selesai sebelum peristiwa berikutnya.
- source_word: עַל הָאָרֶץ
  choice: di atas negeri itu
  rationale: עַל berarti 'di atas', sedangkan אֶרֶץ dapat berarti 'negeri/tanah' atau 'bumi'. Dalam konteks setempat ini, 'negeri itu' paling alami tanpa memberi kesan cakupan global.
- source_word: וְלוֹט
  choice: dan Lot
  rationale: Konjungsi sederhana diikuti nama diri; bentuk nama yang lazim dalam bahasa Indonesia adalah 'Lot'.
- source_word: בָּא
  choice: telah tiba
  rationale: בוא dapat berarti 'datang', 'masuk', atau 'tiba'. Dalam konteks gerak menuju Zoar, 'tiba' menyampaikan bahwa Lot sudah mencapai tujuannya.
- source_word: צֹעֲרָה
  choice: di Zoar
  rationale: Nama tempat dengan he direktif menyatakan gerak menuju Zoar. Bersama verba 'tiba', bahasa Indonesia secara idiomatis memakai preposisi 'di' untuk tempat tujuan yang telah dicapai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Aspek perfektif dipertahankan dengan 'telah' untuk menunjukkan bahwa kedua tindakan sudah selesai menjelang peristiwa pada ayat berikutnya; catatan kaki mempertahankan kemungkinan pembacaan naratif sederhana.
