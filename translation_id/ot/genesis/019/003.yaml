base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: id
  text: Tetapi Lot sangat mendesak mereka[a], sehingga mereka berbelok ke arahnya dan masuk ke rumahnya. Ia menyiapkan perjamuan bagi mereka, memanggang roti tidak beragi[b], lalu mereka makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendesak mereka dengan kuat” atau “bersikeras dengan sangat.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani memakai bentuk jamak yang dapat berarti “roti-roti tidak beragi” atau “kue-kue tidak beragi”, yaitu roti yang dibuat tanpa ragi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: mendesak mereka dengan sangat
  rationale: Kata kerja פצר menyatakan desakan yang kuat, sedangkan מְאֹד mempertegas intensitasnya. Ungkapan ini mempertahankan kedua unsur tersebut dalam bahasa Indonesia yang wajar.
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: mereka berbelok menuju kepadanya
  rationale: Kata סור secara dasar berarti berbelok atau menyimpang dari arah semula; 'menuju kepadanya' mempertahankan אֵלָיו tanpa meleburkannya menjadi sekadar 'ikut dengannya'.
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: masuk ke rumahnya
  rationale: Dalam konteks tujuan berupa rumah, 'masuk ke' menyampaikan gerakan בוא secara ringkas dan alami.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: מִשְׁתֶּה menunjuk pada jamuan atau pesta makan, sering kali disertai minuman. 'Perjamuan' cukup luas dan sesuai dengan ragam naratif yang bermartabat tanpa menonjolkan unsur alkohol yang tidak dituntut konteks.
- source_word: מַצּוֹת אָפָה
  choice: memanggang roti tidak beragi
  rationale: מַצּוֹת adalah bentuk jamak yang mengacu pada roti atau kue tanpa ragi, sedangkan אָפָה berarti memanggang. 'Roti tidak beragi' adalah istilah Indonesia yang jelas dan lazim.
- source_word: וַיֹּאכֵלוּ
  choice: lalu mereka makan
  rationale: Terjemahan ini menyampaikan tindakan penutup beserta kesinambungan naratif dari waw.
