  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: id
  text: Lihatlah, kota ini cukup dekat untuk melarikan diri ke sana, dan kota ini kecil. Izinkanlah aku melarikan diri ke sana—bukankah kota ini kecil?—supaya aku hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan nyawaku akan hidup.” Maksudnya, “supaya aku hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: הִנֵּה menarik perhatian secara mendesak, sedangkan נָא memperhalus permohonan. Dalam bahasa Indonesia, bentuk imperatif sopan “Lihatlah” menyampaikan keduanya secara alami tanpa menumpuk “tolong”.
- source_word: הָעִיר הַזֹּאת
  choice: kota itu
  rationale: Dalam konteks ujaran, Lot menunjuk kota yang terlihat di kejauhan; bahasa Indonesia lazim memakai “itu”, meskipun Ibrani secara bentuk memakai demonstratif proksimal “ini”.
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: cukup dekat untuk menjadi tempat pelarian
  rationale: Ungkapan ini menyatakan bahwa kota tersebut cukup dekat untuk dicapai dengan melarikan diri. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi tujuan dari infinitif לָנוּס.
- source_word: מִצְעָר
  choice: kecil
  rationale: מִצְעָר menyatakan kekecilan atau ketidakberartian. “Kecil” adalah padanan paling jelas dan memungkinkan pengulangan kata Ibrani dipertahankan.
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: Izinkanlah aku melarikan diri ke sana
  rationale: Bentuk kohortatif dengan נָא mengungkapkan permohonan mendesak. “Izinkanlah aku” mempertahankan daya permohonan, dan “melarikan diri” sesuai dengan konteks lolos dari kehancuran.
- source_word: הֲלֹא מִצְעָר הִוא
  choice: bukankah kota itu kecil?
  rationale: Pertanyaan retoris dan pengulangan מִצְעָר dipertahankan. Nomina “kota” diulang agar rujukan pronomina feminin Ibrani jelas dalam bahasa Indonesia.
- source_word: וּתְחִי נַפְשִׁי
  choice: supaya aku tetap hidup
  rationale: נֶפֶשׁ di sini merupakan sebutan bagi diri atau nyawa orang itu, dan waw setelah kohortatif menyatakan hasil atau tujuan. Terjemahan ini menyampaikan idiom secara alami tanpa memberi kesan bahwa “jiwa” adalah unsur terpisah yang hidup.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam וּתְחִי נַפְשִׁי
  choice: aku tetap hidup
  alternative: nyawaku akan hidup
  rationale: Dalam konteks ancaman kematian jasmani, נֶפֶשׁ merujuk pada diri atau nyawa Lot. Terjemahan idiomatis menghindari pemaksaan antropologi dualistis sekaligus mempertahankan makna keselamatan hidupnya.
- issue: Hubungan sintaksis waw pada וּתְחִי
  choice: 'tujuan/hasil: “supaya”'
  alternative: 'urutan waktu: “lalu”'
  rationale: Sesudah permohonan kohortatif “biarlah aku melarikan diri”, klausa ini paling wajar menyatakan tujuan atau hasil yang diharapkan. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “kecil” dipertahankan untuk mencerminkan retorika Lot. Tanda pisah mengapit pertanyaan retoris agar klausa tujuan terakhir terbaca sebagai kelanjutan permohonan. Penanda catatan kaki [a] ditempatkan pada klausa yang dijelaskan.
