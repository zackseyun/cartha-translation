base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: id
  text: Malam itu mereka memberi ayah mereka minum anggur. Lalu anak perempuan yang sulung masuk dan berbaring dengan ayahnya. Ayah mereka tidak menyadari ketika putrinya berbaring maupun ketika ia bangun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pada waktu ia berbaring dan pada waktu ia bangun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: mereka memberi ... minum
  rationale: Bentuk hifil dari שׁקה menyatakan tindakan menyebabkan atau memberi seseorang minum. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan makna kausatif.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan baku untuk יין dalam konteks minuman beralkohol.
- source_word: בַּלַּיְלָה הוּא
  choice: malam itu
  rationale: Ungkapan waktu ini menunjuk pada malam tertentu dan paling alami diterjemahkan demikian dalam bahasa Indonesia.
- source_word: הַבְּכִירָה
  choice: anak perempuan yang sulung
  rationale: Bentuk feminin ini secara harfiah menunjuk kepada perempuan yang lahir pertama. Pilihan ini memperjelas jenis kelamin yang ditandai dalam bahasa Ibrani dan mempertahankan penekanan pada urutan kelahiran.
- source_word: וַתָּבֹא
  choice: masuk
  rationale: Dalam konteks ini kata tersebut menggambarkan tindakan mendatangi atau masuk ke tempat ayahnya berada; 'masuk' ringkas dan wajar dalam alur narasi.
- source_word: וַתִּשְׁכַּב אֶת
  choice: berbaring dengan
  rationale: Konstruksi ini merupakan ungkapan halus untuk hubungan seksual. 'Berbaring dengan' mempertahankan register halus teks sumber tanpa menjadi terlalu sehari-hari atau terlalu eksplisit.
- source_word: וְלֹא יָדַע
  choice: tidak menyadari
  rationale: ידע di sini menyatakan kesadaran akan apa yang terjadi. 'Tidak menyadari' lebih alami daripada 'tidak mengetahui' dalam konteks ini dan tidak menyiratkan bahwa ayahnya sama sekali tidak sadarkan diri.
- source_word: בְּשִׁכְבָהּ
  choice: ketika anaknya berbaring
  rationale: Infinitif dengan preposisi ב menandai waktu atau keadaan. Penyebutan 'anaknya' memperjelas pelaku yang terkandung dalam sufiks feminin tanpa menambahkan 'dengan dia', yang tidak diulang secara eksplisit dalam frasa ini.
- source_word: וּבְקוּמָהּ
  choice: ataupun ketika anaknya bangun
  rationale: Frasa ini sejajar dengan frasa sebelumnya dan menyatakan waktu. 'Bangun' alami dalam bahasa Indonesia modern; 'ataupun' menegaskan bahwa ia tidak menyadari kedua peristiwa itu.
