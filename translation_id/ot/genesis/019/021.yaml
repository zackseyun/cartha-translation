  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: id
  text: 'Lalu ia berkata kepadanya, “Baiklah, dalam hal ini pun Aku mengabulkan permintaanmu[a]: Aku tidak akan menghancurkan kota yang kaubicarakan itu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Aku telah mengangkat wajahmu,” sebuah ungkapan Ibrani yang berarti menunjukkan perkenanan atau mengabulkan permintaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu ia berkata kepadanya
  rationale: Menerjemahkan bentuk naratif dan pronomina secara langsung; rujukan pembicara tetap mengikuti konteks tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: הִנֵּה
  choice: Baiklah
  rationale: Dalam jawaban ini, הִנֵּה menandai perhatian sekaligus penerimaan terhadap permohonan Lot. “Baiklah” menyampaikan fungsi wacananya secara alami dalam bahasa Indonesia modern.
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: Aku mengabulkan permintaanmu
  rationale: Ungkapan harfiahnya ialah “Aku telah mengangkat wajahmu,” sebuah idiom untuk menunjukkan perkenanan atau menerima permohonan. Pilihan ini menyampaikan makna kontekstualnya dengan alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: dalam hal ini pun
  rationale: Mempertahankan daya tambah גַּם dan menerjemahkan דָּבָר sebagai perkara yang baru saja diajukan Lot, tanpa keliru menjadikannya sebagai kata yang berarti “perkenanan.”
- source_word: לְבִלְתִּי הָפְכִּי
  choice: Aku tidak akan menjungkirbalikkan
  rationale: Konstruksi ini menyatakan hasil atau isi pengabulan tersebut. “Menjungkirbalikkan” mempertahankan gambaran khusus akar הפך, bukan memakai istilah umum “membinasakan.”
- source_word: אֶת הָעִיר אֲשֶׁר דִּבַּרְתָּ
  choice: kota yang kaubicarakan itu
  rationale: Ungkapan ini secara alami menunjuk kepada kota yang baru disebut Lot dan tetap dekat dengan susunan serta makna bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi “Aku” mengikuti identitas pembicara dalam konteks, sedangkan “ia” dibiarkan tidak eksplisit sebagaimana teks Ibrani. Idiom Ibrani diterjemahkan menurut maknanya dan bentuk harfiahnya dipertahankan dalam catatan kaki.
