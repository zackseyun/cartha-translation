  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: id
  text: Lalu orang-orang itu berkata kepada Lot, “Siapa lagi yang kaumiliki di sini—menantu laki-laki,[a] anak-anak lelakimu, anak-anak perempuanmu, dan semua orang lain yang terkait denganmu di kota ini?[b] Bawalah mereka keluar dari tempat ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pengantin laki-laki” atau “calon menantu laki-laki”. Kata Ibraninya dapat menunjuk kepada suami maupun laki-laki yang akan menikahi seorang anak perempuan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “semua yang kaumiliki di kota”. Dalam konteks ini, frasa tersebut kemungkinan besar merujuk kepada orang-orang lain dalam keluarga atau rumah tangga Lot yang berada di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Kata Ibrani ini secara langsung berarti ‘orang-orang’ atau ‘para laki-laki’. Walaupun konteks yang lebih luas menunjukkan bahwa mereka adalah malaikat, ayat ini sendiri memakai sebutan biasa bagi manusia laki-laki, sehingga identitas teologis itu tidak dimasukkan ke dalam teks utama.
- source_word: עֹד מִי לְךָ פֹה
  choice: Siapa lagi yang kaumiliki di sini
  rationale: Ungkapan ini menanyakan siapa lagi yang mempunyai hubungan dengan Lot dan berada di sana. Bentuk Indonesia ini alami serta mempertahankan nuansa relasional לְךָ.
- source_word: חָתָן
  choice: menantu laki-laki
  rationale: Dalam konteks ini, kata tersebut paling mungkin menunjuk kepada laki-laki yang telah atau akan menjadi suami anak perempuan Lot. Bentuk tunggal Ibrani dipertahankan tanpa memaksakan kesimpulan tentang jumlah orang yang dimaksud.
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: anak-anak lelakimu, anak-anak perempuanmu
  rationale: Terjemahan ini menyatakan kedua bentuk jamak posesif secara jelas dan wajar dalam bahasa Indonesia.
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: semua orang yang menjadi bagian keluargamu di kota ini
  rationale: Secara harfiah frasa ini luas, ‘semua yang menjadi milikmu di kota’. Karena konteksnya adalah penyelamatan manusia dan kata perintah berikutnya memerlukan mereka dibawa keluar, teks utama menyatakan makna personal dan relasionalnya; keluasan harfiahnya dicatat dalam catatan kaki.
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: Bawalah mereka keluar dari tempat ini
  rationale: Imperatif tunggal ditujukan kepada Lot. Objek ‘mereka’ tersirat dari daftar orang sebelumnya dan perlu dinyatakan dalam bahasa Indonesia. ‘Tempat ini’ menyampaikan acuan tempat yang jelas dalam konteks.
theological_decisions:
- issue: Apakah הָאֲנָשִׁים harus diidentifikasi sebagai malaikat dalam teks utama
  choice: Mempertahankan ‘orang-orang itu’
  alternative: ‘malaikat-malaikat itu’ atau ‘utusan-utusan itu’
  rationale: Narasi yang lebih luas mengungkapkan identitas mereka sebagai malaikat, tetapi ayat ini memakai istilah Ibrani biasa yang berarti ‘orang-orang’. Terjemahan mempertahankan pilihan leksikal ayat ini dan tidak memasukkan identifikasi teologis dari konteks ke dalam teks utama.
- issue: Status para חָתָן sebagai suami atau calon suami anak-anak perempuan Lot
  choice: ‘menantu laki-laki’ dalam teks utama, dengan alternatif dalam catatan kaki
  alternative: ‘pengantin laki-laki’ atau ‘calon menantu laki-laki’
  rationale: Istilah Ibrani dapat menyebut menantu laki-laki atau pengantin laki-laki. Konteks mendukung hubungan menantu, tetapi tidak menuntaskan apakah perkawinan itu sudah berlangsung; catatan kaki mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Orang-orang itu’ mempertahankan penyebutan sumber tanpa mengimpor identitas malaikat. Susunan pertanyaan dan daftar dibuat alami dalam bahasa Indonesia, sedangkan catatan kaki menjaga ambiguitas חָתָן dan keluasan frasa וְכֹל אֲשֶׁר לְךָ.
