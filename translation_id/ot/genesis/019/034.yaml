base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: id
  text: Keesokan harinya, putri sulung berkata kepada adiknya, “Lihat, tadi malam aku telah tidur dengan ayahku. Mari kita buat dia minum anggur lagi malam ini. Lalu datanglah dan tidurlah dengannya, supaya kita dapat memperoleh keturunan dari ayah kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan waktu ini secara alami membuka kelanjutan narasi dalam bahasa Indonesia; formula wayyiqtol tidak perlu diterjemahkan secara kaku.
- source_word: הַבְּכִירָה אֶל הַצְּעִירָה
  choice: anak yang sulung ... kepada adiknya
  rationale: Konteks menunjukkan dua anak perempuan Lot. 'Anak yang sulung' mempertahankan penekanan urutan kelahiran, sedangkan 'adiknya' menyampaikan relasi secara alami.
- source_word: הֵן
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian dengan ungkapan Indonesia modern yang langsung.
- source_word: שָׁכַבְתִּי אֶמֶשׁ אֶת אָבִי
  choice: tadi malam aku telah tidur dengan ayahku
  rationale: '''Tidur dengan'' merupakan eufemisme seksual yang wajar dalam bahasa Indonesia dan mempertahankan ketidaklangsungan ungkapan Ibrani.'
- source_word: נַשְׁקֶנּוּ יַיִן גַּם הַלַּיְלָה
  choice: Mari kita buat dia minum anggur lagi malam ini
  rationale: Bentuk kausatif שׁקה diterjemahkan 'buat dia minum'; 'lagi' menyampaikan unsur tambahan dan pengulangan dalam גַּם.
- source_word: וּבֹאִי שִׁכְבִי עִמּוֹ
  choice: Lalu masuklah dan tidurlah dengannya
  rationale: בוא dalam konteks ini berarti datang atau masuk ke tempat sang ayah; 'masuklah' memberi urutan tindakan yang alami, dan 'tidurlah dengannya' mempertahankan eufemisme sumber.
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: supaya kita dapat meneruskan keturunan ayah kita
  rationale: Piel חיה mengungkapkan tindakan mempertahankan atau meneruskan kehidupan, dan זרע secara kontekstual berarti keturunan. Rumusan ini alami dalam bahasa Indonesia serta mempertahankan ayah sebagai sumber garis keturunan.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. Eufemisme seksual Ibrani dipertahankan melalui 'tidur dengan', tanpa memperhalus maksud atau menjadikannya klinis. Tidak diperlukan catatan kaki karena makna זרע dapat disampaikan langsung sebagai 'keturunan'.
