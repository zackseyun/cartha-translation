revisions:
- from: Keesokan harinya, anak yang sulung berkata kepada adiknya, “Lihat, tadi malam aku telah tidur dengan ayahku. Mari kita buat dia minum anggur lagi malam ini. Lalu masuklah dan tidurlah dengannya, supaya kita dapat meneruskan keturunan ayah kita.”
  to: Keesokan harinya, putri sulung berkata kepada adiknya, “Lihat, tadi malam aku telah tidur dengan ayahku. Mari kita buat dia minum anggur lagi malam ini. Lalu datanglah dan tidurlah dengannya, supaya kita dapat memperoleh keturunan dari ayah kita.”
  rationale: 'Revisi ini mempertahankan eufemisme dan nada naratif sumber, menghindari penambahan makna pada ‘datanglah’, serta mengganti ungkapan yang berpotensi menyiratkan keturunan yang telah ada dengan rumusan yang menyatakan tujuan yang sebenarnya: memperoleh keturunan melalui ayah mereka. Catatan kaki menjelaskan idiom זֶרַע tanpa mengubah makna teks.'
