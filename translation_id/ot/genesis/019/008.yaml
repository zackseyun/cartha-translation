  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Ibrani: nada permohonan, idiom seksual, tawaran kohortatif, larangan menyeluruh, dan metafora perlindungan atap semuanya terwakili. Namun, penambahan “kedua” pada “kedua laki-laki ini” tidak dinyatakan dalam ayat ini; bahasa Ibrani hanya memakai “orang-orang/laki-laki ini.”'
  naturalness: Bahasa Indonesia baku dan umumnya alami. “Apa yang baik di matamu” secara harfiah dapat dipahami, tetapi “apa yang kamu anggap baik” lebih idiomatis dalam bahasa Indonesia modern sambil mempertahankan idiom sumber. “Hanya saja” cukup wajar, meski “Tetapi hanya kepada laki-laki ini janganlah kamu berbuat apa-apa” lebih langsung menandai pembatasan רַק.
  terminology: “Mengenal laki-laki” dengan catatan penjelas tepat untuk יָדַע dalam konteks ini. “Anak perempuan,” “laki-laki,” dan “naungan atapku” konsisten dan sesuai register. Catatan kaki b menjelaskan metafora tanpa memasukkan penilaian doktrinal.
