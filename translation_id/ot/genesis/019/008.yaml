  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: id
  text: “Lihatlah, aku mohon, aku mempunyai dua anak perempuan yang belum pernah mengenal laki-laki.[a] Biarlah kubawa mereka keluar kepadamu, dan perbuatlah kepada mereka apa yang kamu anggap baik. Tetapi hanya kepada laki-laki ini janganlah kamu berbuat apa-apa, sebab mereka telah datang ke bawah naungan atapku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, belum pernah berhubungan seksual dengan laki-laki; secara tradisional, “masih perawan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di bawah naungan atapku,” sebuah ungkapan tentang perlindungan yang wajib diberikan kepada tamu yang telah diterima di dalam rumah.
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: Lihat, aku mohon
  rationale: הִנֵּה menarik perhatian secara mendesak, sedangkan נָא menyatakan permohonan. Ungkapan ini mempertahankan nada desakan Lot tanpa memakai bentuk yang usang.
- source_word: שְׁתֵּי בָנוֹת
  choice: dua anak perempuan
  rationale: Padanan langsung dan alami bagi frasa nominal Ibrani.
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: yang belum pernah mengenal laki-laki
  rationale: Mempertahankan idiom Ibrani יָדַע yang dalam konteks ini mengacu pada hubungan seksual; catatan kaki memberikan makna eksplisitnya.
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: Biarlah kubawa mereka keluar kepadamu
  rationale: Bentuk kohortatif menyatakan tawaran atau kehendak Lot, sementara נָא kembali memberi nada memohon.
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: dan perbuatlah kepada mereka apa yang baik di matamu
  rationale: Mempertahankan citra idiom Ibrani dan daya kejut ucapan itu tanpa memperhalus atau menyatakan persetujuan moral.
- source_word: רַק
  choice: Hanya saja
  rationale: Menyatakan pembatasan dan pertentangan kuat terhadap tawaran sebelumnya dalam bahasa Indonesia yang wajar.
- source_word: לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: jangan berbuat apa pun kepada kedua laki-laki ini
  rationale: Menyampaikan larangan menyeluruh dan mempertahankan rujukan maskulin. Kata 'kedua' mengikuti jumlah tamu yang sudah jelas dalam konteks dekat.
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: sebab mereka telah datang
  rationale: Mengungkapkan hubungan sebab yang mendasari kewajiban perlindungan Lot tanpa memaksakan penafsiran yang lebih sempit.
- source_word: בְּצֵל קֹרָתִי
  choice: ke bawah naungan atapku
  rationale: Mempertahankan gambaran harfiah 'naungan/bayang-bayang atap' sekaligus tetap dapat dipahami sebagai perlindungan tuan rumah.
theological_decisions:
- issue: Apakah tawaran Lot yang mengejutkan perlu diperhalus demi keterbacaan moral
  choice: Mempertahankan kekuatan lugas teks Ibrani tanpa eufemisme
  alternative: Memakai ungkapan yang lebih lunak seperti 'perlakukanlah mereka sesukamu'
  rationale: Narasi melaporkan tawaran Lot tanpa secara eksplisit menyetujuinya. Terjemahan tidak boleh menambahkan pembenaran moral ataupun mengurangi kegawatan ucapan tersebut.
- issue: Makna kedatangan para tamu ke bawah naungan atap Lot
  choice: Mempertahankan gambaran perlindungan keramahtamahan dalam teks utama dan menjelaskannya dalam catatan kaki
  alternative: Mengganti langsung dengan 'mereka berada di bawah perlindunganku'
  rationale: Bentuk terpilih menjaga metafora sumber dan tidak menghapus latar budaya yang mendasari alasan Lot.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dan citra penting bahasa Ibrani dipertahankan sejauh tetap jelas bagi pembaca umum; nada permohonan Lot serta kekuatan moral yang mengusik dari ucapannya tidak diperhalus.
