revisions:
- from: “Lihat, aku mohon, aku mempunyai dua anak perempuan yang belum pernah mengenal laki-laki.[a] Biarlah kubawa mereka keluar kepadamu, dan perbuatlah kepada mereka apa yang baik di matamu. Hanya saja, jangan berbuat apa pun kepada kedua laki-laki ini, sebab mereka telah datang ke bawah naungan atapku.”[b]
  to: “Lihatlah, aku mohon, aku mempunyai dua anak perempuan yang belum pernah mengenal laki-laki.[a] Biarlah kubawa mereka keluar kepadamu, dan perbuatlah kepada mereka apa yang kamu anggap baik. Tetapi hanya kepada laki-laki ini janganlah kamu berbuat apa-apa, sebab mereka telah datang ke bawah naungan atapku.”[b]
  rationale: Revisi menghapus numeralia yang tidak terdapat dalam teks sumber dan memperlancar idiom “baik di matamu” menjadi bentuk Indonesia modern yang setara maknanya. Susunan “Tetapi hanya kepada laki-laki ini janganlah kamu berbuat apa-apa” mempertahankan pembatasan kuat רַק serta larangan אַל תַּעֲשׂוּ דָבָר. Catatan kaki tetap memadai dan jangkar catatan dipertahankan.
