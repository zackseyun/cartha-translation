  - severity: low
    issue: “Apa yang baik di matamu” kurang alami dalam bahasa Indonesia kontemporer.
    rationale: Ungkapan ini sangat harfiah. “Apa yang kamu anggap baik” menyampaikan idiom כַּטּוֹב בְּעֵינֵיכֶם secara lebih alami tanpa melunakkan isi yang mengusik.
