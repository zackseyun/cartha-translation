base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: id
  text: Lalu mereka memanggil Lot dan berkata kepadanya, “Di manakah laki-laki yang datang kepadamu malam ini? Bawalah mereka keluar kepada kami supaya kami dapat mengenal mereka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksudnya secara lebih jelas dalam konteks, “supaya kami dapat berhubungan seks dengan mereka.” Secara harfiah, bahasa Ibrani berbunyi “mengenal mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: mereka berseru
  rationale: Dalam konteks orang banyak yang berbicara kepada Lot dari luar rumah, "berseru" menyampaikan tindakan memanggil dengan suara nyaring tanpa menambahkan gagasan yang tidak dinyatakan oleh verba קרא.
- source_word: הָאֲנָשִׁים
  choice: laki-laki
  rationale: Bentuk jamak maskulin ini secara khusus menunjuk kepada para tamu laki-laki, sehingga terjemahan netral seperti "orang-orang" kurang tepat dalam konteks ini.
- source_word: בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: yang datang kepadamu malam ini
  rationale: Ungkapan ini mengidentifikasi para tamu berdasarkan kedatangan mereka pada malam itu; "malam ini" wajar dalam bahasa Indonesia modern.
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: Bawalah mereka keluar kepada kami
  rationale: Bentuk Hifil dari יצא berarti menyebabkan seseorang keluar; "bawalah ... keluar" mempertahankan daya perintah dan arah kepada orang banyak.
- source_word: וְנֵדְעָה אֹתָם
  choice: supaya kami dapat mengenal mereka
  rationale: ידע pada dasarnya berarti "mengenal/mengetahui". Terjemahan utama mempertahankan ungkapan Ibrani dan ambiguitas leksikalnya, sementara catatan kaki menjelaskan maksud seksual yang kuat dalam konteks.
theological_decisions:
- issue: Apakah maksud seksual וְנֵדְעָה אֹתָם perlu dibuat eksplisit dalam teks utama
  choice: Mempertahankan ungkapan "mengenal mereka" dalam teks utama dan menjelaskan maksud seksual dalam catatan kaki.
  alternative: Menerjemahkan secara eksplisit sebagai "berhubungan seks dengan mereka" atau "memerkosa mereka".
  rationale: Konteks narasi kuat mengisyaratkan niat seksual yang bermusuhan, tetapi teks Ibrani memakai verba biasa "mengenal". Mempertahankan bentuk itu menjaga tekstur sastra dan keterlacakan kepada sumber tanpa menutup ketegangan tafsir; catatan kaki memberi penjelasan yang diperlukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. "Di manakah" mempertahankan nada naratif formal yang tetap mudah dipahami; "berseru" cocok untuk ujaran dari luar rumah. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
