  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: id
  text: Ketika Allah membinasakan kota-kota di Dataran Yordan, Allah mengingat Abraham dan mengeluarkan Lot dari tengah-tengah kehancuran[a] itu, ketika Dia menjungkirbalikkan kota-kota tempat Lot pernah tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dari tengah-tengah penjungkirbalikan itu.” Kata Ibrani yang dipakai berkaitan dengan kata kerja “menjungkirbalikkan” dalam klausa berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Maka terjadilah
  rationale: Mempertahankan penanda naratif Ibrani yang memperkenalkan keadaan waktu, dengan susunan yang tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בְּשַׁחֵת אֱלֹהִים
  choice: ketika Allah membinasakan
  rationale: Infinitif konstruktus dengan prefiks ב menyatakan keadaan temporal; 'ketika' menyampaikan fungsi itu secara alami.
- source_word: עָרֵי הַכִּכָּר
  choice: kota-kota di Lembah Yordan
  rationale: Dalam konteks Kejadian 13 dan 19, הַכִּכָּר menunjuk pada kawasan dataran Sungai Yordan; penyebutan 'Yordan' memperjelas lokasi yang sudah ditetapkan konteks tanpa menjadikannya nama kota.
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: Allah mengingat Abraham
  rationale: Mempertahankan idiom Ibrani dan gema teologisnya tanpa menggantinya dengan parafrasa penafsiran.
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: dan mengeluarkan Lot
  rationale: Dalam konteks penyelamatan dari kawasan yang dihancurkan, bentuk ini secara alami menyampaikan gerak keluar yang disebabkan Allah, tanpa memakai istilah teologis yang lebih interpretatif seperti 'menyelamatkan'.
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: dari tengah-tengah kehancuran itu
  rationale: Mempertahankan unsur תּוֹךְ, 'tengah-tengah', sementara 'kehancuran' merupakan padanan Indonesia yang alami bagi bencana penjungkirbalikan tersebut.
- source_word: בַּהֲפֹךְ
  choice: ketika Dia menjungkirbalikkan
  rationale: Menjaga fungsi temporal dan sedapat mungkin mempertahankan gambaran dasar akar הפך, yaitu membalikkan atau menjungkirbalikkan.
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: tempat Lot pernah tinggal
  rationale: Menyatakan tempat kediaman Lot secara alami; 'pernah' cocok dengan sudut pandang naratif setelah ia dikeluarkan.
theological_decisions:
- issue: Makna 'Allah mengingat Abraham'
  choice: Idiom 'Allah mengingat Abraham' dipertahankan dalam teks utama.
  alternative: Allah bertindak demi Abraham; Allah memperhatikan Abraham dengan setia.
  rationale: Dalam narasi Ibrani, tindakan Allah 'mengingat' sering menyiratkan perhatian setia yang menghasilkan tindakan. Namun, memperluasnya dalam teks utama akan menutup sebagian ketegangan dan daya ungkap idiom sumber.
- issue: Hubungan Abraham dengan keluarnya Lot
  choice: Urutan klausa sumber dipertahankan sehingga tindakan terhadap Lot mengikuti ingatan Allah akan Abraham.
  alternative: Allah menyelamatkan Lot karena Abraham.
  rationale: Teks mengisyaratkan hubungan tersebut, tetapi tidak memakai penghubung kausal eksplisit 'karena'; terjemahan tidak boleh membuat inferensi itu lebih tegas daripada bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Maka terjadilah' mempertahankan bentuk pengantar Ibrani, sedangkan susunan klausa lainnya dibuat jelas bagi pembaca umum. Kapitalisasi 'Dia' dipakai untuk rujukan kepada Allah.
