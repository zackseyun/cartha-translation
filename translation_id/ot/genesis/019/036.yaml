lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: mengandung
  rationale: Bentuk verba dari הרה menyatakan bahwa kedua perempuan itu menjadi hamil; “mengandung” merupakan ungkapan Indonesia yang alami dan jelas.
- source_word: שְׁתֵּי
  choice: kedua
  rationale: Numeralia ini menunjukkan bahwa dua-duanya, yaitu kedua anak perempuan Lot, termasuk dalam pernyataan tersebut.
- source_word: בְנוֹת לוֹט
  choice: anak perempuan Lot
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara alami sebagai hubungan kepunyaan dalam bahasa Indonesia.
- source_word: מֵאֲבִיהֶן
  choice: dari ayah mereka sendiri
  rationale: Preposisi מִן menyatakan sumber atau asal kehamilan. “Dari” mempertahankan bentuk ungkapan Ibrani, sedangkan “sendiri” memperjelas hubungan yang dimaksud secara alami tanpa mengubah acuannya.
