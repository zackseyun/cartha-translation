  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: id
  text: Lalu Yahweh Allah berfirman, “Sesungguhnya, manusia itu telah menjadi seperti salah satu dari kita[a], mengetahui yang baik dan yang jahat. Dan sekarang, jangan sampai ia mengulurkan tangannya dan mengambil juga dari pohon kehidupan, lalu makan dan hidup selama-lamanya—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sebagai salah satu dari kita.” Bentuk jamak “kita” dipertahankan dari bahasa Ibrani; ungkapan ini dipahami secara beragam sebagai bahasa tentang majelis ilahi, bentuk pertimbangan jamak, atau isyarat kemajemukan dalam diri Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi יהוה sebagai “Yahweh” dan menerjemahkan אֱלֹהִים sebagai “Allah”; susunan ini wajar dan bermartabat dalam bahasa Indonesia.
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Menyampaikan daya penunjuk dan penegasan interjeksi Ibrani dalam ragam tutur ilahi yang khidmat, tanpa memakai bentuk arkais yang kurang alami.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Konteks menunjuk kepada manusia tertentu yang baru dibicarakan, sedangkan kata “manusia” tetap mencerminkan אָדָם; penentu “itu” menandai kekhususannya.
- source_word: הָיָה
  choice: telah menjadi
  rationale: Mengungkapkan tindakan yang menghasilkan keadaan sekarang sesudah pelanggaran.
- source_word: כְּאַחַד מִמֶּנּוּ
  choice: seperti salah satu dari kita
  rationale: Merupakan padanan langsung dan alami yang mempertahankan bentuk orang pertama jamak tanpa menafsirkannya lebih lanjut.
- source_word: לָדַעַת טוֹב וָרָע
  choice: mengetahui yang baik dan yang jahat
  rationale: Mempertahankan cakupan kognitif-moral ungkapan Ibrani dan kaitannya dengan keadaan manusia yang baru.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Padanan Indonesia yang alami untuk klausa pencegahan dan tetap menyampaikan kekhawatiran terhadap kemungkinan berikutnya.
- source_word: יִשְׁלַח יָדוֹ
  choice: ia mengulurkan tangannya
  rationale: Mempertahankan gambaran konkret idiom Ibrani dalam bahasa Indonesia yang wajar.
- source_word: וְלָקַח גַּם מֵעֵץ הַחַיִּים
  choice: mengambil juga dari pohon kehidupan
  rationale: Mempertahankan daya aditif גַּם dan tidak menambahkan objek seperti “buah” yang tidak disebut secara eksplisit dalam ayat ini.
- source_word: וָחַי לְעֹלָם
  choice: lalu hidup untuk selama-lamanya
  rationale: Menyampaikan kelanjutan tindakan dan durasi tak berakhir yang dinyatakan teks Ibrani.
theological_decisions:
- issue: Kata ganti jamak dalam “seperti salah satu dari kita”
  choice: Mempertahankan “kita” tanpa perluasan tafsiran.
  alternative: Menafsirkannya secara eksplisit sebagai majelis ilahi, bentuk pertimbangan jamak, atau isyarat kemajemukan intra-ilahi.
  rationale: Teks Ibrani dengan jelas memakai bentuk orang pertama jamak, tetapi tidak menjelaskan acuannya. Terjemahan mempertahankan ketegangan teologis tersebut.
- issue: Akhir perkataan ilahi yang terputus
  choice: Memakai tanda pisah setelah “selama-lamanya—”.
  alternative: Melengkapi akibat yang tersirat atau menutup kalimat secara mulus.
  rationale: Klausa Ibrani berhenti secara mendadak sebelum tindakan naratif pada ayat berikutnya. Tanda pisah mempertahankan struktur yang menggantung tanpa menambahkan kata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Sesungguhnya” mempertahankan penegasan הֵן, sedangkan “jangan sampai” mengungkapkan klausa pencegahan secara alami. Tanda pisah mempertahankan akhir ujaran yang menggantung.
