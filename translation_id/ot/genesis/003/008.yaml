  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: id
  text: Kemudian mereka mendengar bunyi[a] Yahweh Allah yang sedang berjalan di taman dalam embusan angin hari itu[b]. Manusia itu[c] dan istrinya pun bersembunyi dari hadapan Yahweh Allah di antara pohon-pohon di taman.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suara Yahweh Allah.” Kata Ibrani yang dipakai dapat berarti “bunyi” ataupun “suara.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pada waktu hari mulai sejuk.” Secara harfiah, “dalam/pada angin atau embusan hari itu.”
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: “manusia itu”; dapat juga dipahami sebagai nama “Adam.”'
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: bunyi
  rationale: Kata Ibrani ini dapat berarti bunyi atau suara. Karena ayat ini tidak menyatakan bahwa Allah berbicara dan langsung menggambarkan-Nya sedang berjalan, “bunyi” dipilih tanpa menentukan bahwa yang terdengar adalah perkataan ataupun langkah kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam aposisi dengan nama Yahweh, istilah ini secara alami diterjemahkan “Allah,” sehingga menjadi “Yahweh Allah.”
- source_word: מִתְהַלֵּךְ
  choice: sedang berjalan
  rationale: Bentuk partisipel Hitpael menggambarkan gerak yang sedang berlangsung di dalam taman. Terjemahan konkret ini mempertahankan penggambaran antropomorfis dalam narasi.
- source_word: לְרוּחַ הַיּוֹם
  choice: pada waktu angin hari itu berembus
  rationale: רוּחַ dapat berarti angin, embusan, napas, atau roh. Pilihan ini mempertahankan acuan pada angin dan menghindari penggantian langsung dengan akibatnya, yakni kesejukan.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Dengan artikel penentu dan dalam konteks penyebutan istrinya, ungkapan ini menunjuk kepada individu tersebut, tetapi “manusia itu” juga mempertahankan nuansa representatif אָדָם lebih baik daripada istilah yang hanya menekankan jenis kelamin.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Ungkapan ini secara harfiah berkaitan dengan muka atau kehadiran. “Dari hadapan” mempertahankan daya relasional sekaligus spasialnya.
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: di antara pohon-pohon di taman
  rationale: Kata עֵץ berbentuk tunggal tetapi dapat dipakai secara kolektif. Konteks persembunyian dan idiom bahasa Indonesia mendukung bentuk jamak “pohon-pohon.”
theological_decisions:
- issue: Penggambaran antropomorfis tentang Allah yang berjalan di taman
  choice: Mempertahankan ungkapan konkret “sedang berjalan”
  alternative: bergerak di taman; kehadiran Allah terdengar di taman
  rationale: Teks Ibrani menyajikan adegan ini secara konkret. Terjemahan tidak melunakkan, mengalegorikan, atau menjelaskan secara sistematis penggambaran tersebut.
- issue: Identitas הָאָדָם
  choice: manusia itu
  alternative: laki-laki itu; Adam
  rationale: Konteks menunjuk kepada pribadi tertentu bersama istrinya, sedangkan istilah Ibrani tetap memiliki resonansi umum sebagai “manusia.” Pilihan ini mempertahankan kedua dimensi itu sejauh dimungkinkan dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara ungkapan “bunyi,” “sedang berjalan,” “angin hari itu,” dan “dari hadapan” mempertahankan ambiguitas serta kekonkretan teks Ibrani.
