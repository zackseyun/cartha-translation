  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: id
  text: Lalu Dia berkata, “Siapa yang memberitahukan kepadamu bahwa engkau telanjang? Apakah engkau telah makan dari pohon yang Kuperintahkan kepadamu untuk tidak makan darinya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” alami dalam narasi Indonesia; “Dia” mempertahankan subjek tersirat tanpa mengulang nama Allah yang tidak tertulis dalam ayat ini.
- source_word: מִי הִגִּיד לְךָ
  choice: Siapa yang memberitahukan kepadamu
  rationale: מִי adalah kata tanya “siapa,” sedangkan נגד bentuk Hifil berarti memberitahukan atau menyatakan. Pilihan ini jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: כִּי עֵירֹם אָתָּה
  choice: bahwa engkau telanjang
  rationale: כִּי memperkenalkan isi pemberitahuan, dan עֵירֹם berarti tidak berpakaian. Bahasa Indonesia tidak menuntut perubahan kala pada kopula, sehingga ketegangan waktunya tidak perlu ditambahkan.
- source_word: הֲמִן הָעֵץ
  choice: Apakah ... dari pohon
  rationale: הֲ menandai pertanyaan ya/tidak dan מִן menyatakan asal atau sumber. Susunan pertanyaan dengan “apakah” alami dan mempertahankan hubungan “dari pohon.”
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: yang Kuperintahkan kepadamu
  rationale: Klausa relatif dipertahankan; bentuk “Kuperintahkan” menyatakan orang pertama tunggal sebagai pelaku tanpa menambahkan identitas pembicara.
- source_word: לְבִלְתִּי אֲכָל מִמֶּנּוּ
  choice: untuk tidak memakan buahnya
  rationale: לְבִלְתִּי + infinitif menyatakan larangan. Secara harfiah מִמֶּנּוּ ialah “darinya,” tetapi dalam bahasa Indonesia ungkapan “makan dari pohon” dapat terdengar seperti memakan bahan pohonnya; “memakan buahnya” menyampaikan objek yang tersirat secara alami dari konteks pohon makanan.
- source_word: אָכָלְתָּ
  choice: engkau telah makan
  rationale: Qal perfek orang kedua maskulin tunggal menunjuk tindakan yang dipandang selesai. “Telah makan” sesuai untuk tindakan lampau yang baru dan masih relevan.
theological_decisions:
- issue: Identitas subjek maskulin tunggal yang tersirat
  choice: Dia
  alternative: TUHAN Allah
  rationale: Teks ayat ini hanya memiliki verba orang ketiga maskulin tunggal tanpa menyebut ulang nama ilahi. Huruf kapital menunjukkan rujukan kepada Allah berdasarkan konteks, tetapi nama “TUHAN Allah” tidak disisipkan ke dalam ayat.
- issue: Isi yang dimakan dari pohon
  choice: buahnya
  alternative: darinya
  rationale: Teks Ibrani secara harfiah berbunyi “makan darinya.” “Buahnya” merupakan pengungkapan idiomatis dari sesuatu yang dimakan dari pohon, bukan penetapan jenis buah atau penambahan tafsir doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan “engkau” untuk kesinambungan gaya Kitab Kejadian dan nuansa dialog yang khidmat. Kapitalisasi “Dia” dan awalan pronominal “Ku-” menandai rujukan ilahi sesuai kebiasaan ejaan Alkitab Indonesia. Tidak diperlukan catatan kaki karena perbedaan aspek verba Ibrani dapat diwakili secara wajar oleh “telah,” sedangkan pengungkapan “buahnya” jelas dalam konteks.
