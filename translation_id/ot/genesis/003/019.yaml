base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: id
  text: Dengan keringat di wajahmu[a] engkau akan makan roti sampai engkau kembali ke tanah, sebab engkau diambil dari tanah itu; karena engkau adalah debu, dan ke debu engkau akan kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan yang lebih idiomatis: “Dengan keringat di dahimu.” Teks Ibrani secara harfiah berbunyi “dengan keringat wajahmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: Dengan keringat wajahmu
  rationale: 'Menerjemahkan ungkapan Ibrani secara transparan: בְּ menyatakan cara atau sarana, זֵעָה berarti “keringat,” dan אַפֶּיךָ secara harfiah berarti “wajahmu.” Ungkapan Indonesia yang lebih idiomatis dicantumkan dalam catatan kaki.'
- source_word: תֹּאכַל לֶחֶם
  choice: engkau akan makan roti
  rationale: לֶחֶם secara langsung berarti “roti,” meskipun dalam konteks tertentu dapat mewakili makanan atau nafkah secara umum. Terjemahan mempertahankan gambaran konkret teks Ibrani.
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: sampai engkau kembali ke tanah
  rationale: אֲדָמָה berarti tanah atau tanah garapan. “Tanah” alami dalam bahasa Indonesia dan mempertahankan hubungan dengan asal manusia dalam konteks pasal ini.
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: sebab dari tanah itulah engkau diambil
  rationale: Pronomina feminin מִמֶּנָּה merujuk kembali kepada אֲדָמָה. Penyebutan ulang “tanah” memperjelas rujukannya dalam bahasa Indonesia, sedangkan bentuk pasif “diambil” mencerminkan bentuk Pual Ibrani.
- source_word: כִּי
  choice: sebab / karena
  rationale: Kedua pemakaian כִּי bersifat kausal atau menjelaskan. Variasi “sebab” dan “karena” menghindari pengulangan yang kaku tanpa mengubah hubungan logis antarklausa.
- source_word: עָפָר
  choice: debu
  rationale: “Debu” merupakan padanan langsung dan mapan bagi עָפָר dalam pernyataan tentang asal-usul serta kefanaan manusia.
- source_word: תָּשׁוּב
  choice: engkau akan kembali
  rationale: Bentuk imperfek menyatakan akibat yang diumumkan dengan pasti. “Akan kembali” menyampaikan kepastian itu dalam bahasa Indonesia modern tanpa memakai bentuk arkais.
theological_decisions:
- issue: Kefanaan manusia dan asal jasmaninya
  choice: Ayat ini menyatakan bahwa manusia akan kembali secara jasmani ke tanah atau debu asalnya.
  alternative: Memahaminya terutama sebagai metafora penghinaan atau kerendahan.
  rationale: Konteks langsung serta pasangan אֲדָמָה (“tanah”) dan עָפָר (“debu”) mendukung rujukan kepada kematian dan kembalinya tubuh ke bumi. Terjemahan tidak menambahkan penjelasan doktrinal di luar yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “engkau” dipakai untuk sapaan tunggal yang sesuai dengan wacana langsung. Susunan klausa mempertahankan gerak puitis dari kerja berat menuju kematian, dengan paralel “kembali ke tanah” dan “ke debu engkau akan kembali.”
