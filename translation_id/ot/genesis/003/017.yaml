  - severity: medium
    issue: “Engkau akan memperoleh makanan darinya” terlalu menguraikan verba Ibrani.
    rationale: Teks Ibrani secara harfiah menyatakan “engkau akan makan darinya,” dengan akhiran feminin yang merujuk kepada tanah. Walaupun maksud kontekstualnya adalah hasil tanah, “memperoleh makanan” mengganti tindakan makan dengan tindakan memperoleh.
