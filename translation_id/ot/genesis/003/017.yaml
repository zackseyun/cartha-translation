  to: Kepada Adam Ia berkata,[a] “Karena engkau telah mendengarkan suara istrimu dan makan dari pohon yang telah Kuperintahkan kepadamu dengan berfirman, ‘Jangan makan darinya,’ tanah terkutuk karena engkau. Dengan susah payah engkau akan makan darinya[b] sepanjang hidupmu.”
