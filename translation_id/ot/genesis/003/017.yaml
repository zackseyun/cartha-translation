  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: id
  text: Kepada Adam Ia berkata,[a] “Karena engkau telah mendengarkan suara istrimu dan makan dari pohon yang telah Kuperintahkan kepadamu dengan berfirman, ‘Jangan makan darinya,’ tanah terkutuk karena engkau. Dengan susah payah engkau akan makan darinya[b] sepanjang hidupmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “manusia itu.”
    reason: Bentuk Ibrani אָדָם dalam konteks ini dapat dipahami sebagai nama “Adam” atau sebagai sebutan “manusia itu.”
  - marker: b
    text: Secara lebih harfiah, “engkau akan memakannya”; akhiran kata kerja Ibrani merujuk kepada tanah. Dalam konteksnya, yang dimaksud ialah makan hasil tanah.
    reason: Menjelaskan akhiran feminin pada verba Ibrani yang merujuk kepada “tanah,” tanpa mengubah tindakan “makan” dalam teks utama.
lexical_decisions:
- source_word: לְאָדָם
  choice: kepada Adam
  rationale: Konteks menunjuk kepada pribadi tertentu dalam kisah Eden. Nama “Adam” dipakai dalam teks utama, sementara kemungkinan “manusia itu” dipertahankan dalam catatan kaki.
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: engkau mendengarkan perkataan istrimu
  rationale: Ungkapan Ibrani secara harfiah menyebut “suara istrimu,” tetapi dalam konteks berarti mengindahkan apa yang dikatakannya. “Mendengarkan perkataan” alami dalam bahasa Indonesia dan tidak sekuat penafsiran “menaati.”
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: dan memakan buah dari pohon
  rationale: Objek yang dimakan secara implisit adalah hasil atau buah pohon, bukan pohonnya sendiri. Penambahan “buah” membuat maksudnya wajar dalam bahasa Indonesia berdasarkan konteks dekat.
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: yang tentangnya Aku telah memerintahkan kepadamu
  rationale: Mempertahankan hubungan klausa relatif dengan pohon serta isi perintah yang langsung menyusul, dalam susunan Indonesia yang tetap jelas.
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: Jangan makan darinya
  rationale: Bentuk larangan langsung paling alami menyampaikan daya larangan Ibrani; “darinya” mempertahankan preposisi sumber.
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: terkutuklah tanah
  rationale: Susunan predikat di depan mempertahankan tekanan dan nada putusan dalam bahasa Ibrani, sekaligus tetap idiomatis dan khidmat dalam bahasa Indonesia.
- source_word: בַּעֲבוּרֶךָ
  choice: karena engkau
  rationale: Menunjukkan bahwa kutuk atas tanah terjadi oleh sebab tindakan Adam, tanpa kesan tujuan yang menguntungkan seperti yang mungkin timbul dari “demi engkau.”
- source_word: בְּעִצָּבוֹן
  choice: dengan susah payah
  rationale: Dalam konteks mengusahakan makanan dari tanah, istilah ini menunjuk pada kesukaran, jerih lelah, dan penderitaan. “Dengan susah payah” alami dan mempertahankan cakupan maknanya.
- source_word: תֹּאכֲלֶנָּה
  choice: engkau akan memperoleh makanan darinya
  rationale: Akhiran feminin merujuk kepada tanah. Maksudnya bukan memakan tanah secara harfiah, melainkan mendapatkan makanan darinya; terjemahan ini menyatakan implikasi kontekstual secara alami.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sepanjang hidupmu
  rationale: Padanan Indonesia yang alami bagi idiom “seluruh hari-hari hidupmu,” dengan tetap menjaga cakupan seumur hidup.
theological_decisions:
- issue: Pemaknaan אָדָם sebagai nama diri atau sebutan
  choice: Adam
  alternative: manusia itu
  rationale: Ayat ini menyapa individu tertentu dalam narasi. Namun bentuk Ibraninya masih dapat dipahami sebagai “manusia itu,” sehingga alternatif tersebut dicatat dan tidak dihapus.
- issue: Sasaran kutuk dalam putusan
  choice: tanah yang dikutuk karena Adam
  alternative: Adam sendiri yang dikutuk
  rationale: Secara gramatikal אֲרוּרָה הָאֲדָמָה menjadikan “tanah” sebagai subjek yang terkutuk. Terjemahan tidak memperluas putusan ini dengan menyatakan bahwa Adam sendiri dikutuk.
- issue: Hubungan בַּעֲבוּרֶךָ dengan Adam
  choice: karena engkau
  alternative: oleh karena engkau / oleh sebab perbuatanmu
  rationale: Frasa tersebut menyatakan sebab atau alasan kutuk atas tanah. Terjemahan mempertahankan kaitan dengan Adam tanpa menambahkan uraian teologis mengenai sifat atau pewarisan akibatnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Engkau” dipilih untuk sapaan tunggal yang bermartabat. Susunan “terkutuklah tanah” mempertahankan daya puitis-yudisial sumber tanpa menjadi kuno.
