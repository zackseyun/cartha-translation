  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: id
  text: Aku akan mengadakan permusuhan[a] antara engkau dan perempuan itu, antara keturunanmu dan keturunannya[b]; ia[c] akan meremukkan kepalamu, dan engkau akan melukai tumitnya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perseteruan.”
    reason: lexical_alternative
  - marker: b
    text: Dalam kedua bagian ini, teks Ibrani secara harfiah memakai kata “benih”; kata itu dapat menunjuk secara kolektif kepada para keturunan atau kepada seorang individu yang mewakili mereka.
    reason: lexical_alternative
  - marker: c
    text: Kata ganti Ibrani berbentuk maskulin tunggal sesudah kata benda kolektif “keturunan.” Kata “ia” dalam bahasa Indonesia tidak menandai gender dan dapat dipahami dengan mengacu pada keturunan itu sebagai satu kesatuan atau pada seorang individu yang mewakili mereka.
    reason: alternative_reading
  - marker: d
    text: Kedua klausa memakai verba Ibrani yang sama. Verba langka itu dapat diterjemahkan “melukai” atau “menghantam”; “meremukkan” pada klausa pertama mencerminkan akibat yang lebih berat karena sasarannya adalah kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: permusuhan
  rationale: Menunjukkan pertentangan aktif dan berkelanjutan. “Permusuhan” alami dalam bahasa Indonesia dan mempertahankan bobot istilah Ibrani.
- source_word: אָשִׁית
  choice: Aku akan mengadakan
  rationale: Secara harfiah berarti “Aku akan menaruh/menempatkan.” Dalam konteks hubungan, “mengadakan permusuhan” menyampaikan tindakan Allah secara alami tanpa mengaburkan bahwa Dialah yang menetapkannya.
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: antara engkau dan perempuan itu
  rationale: Mempertahankan hubungan yang dinyatakan oleh preposisi Ibrani serta struktur paralelnya. “Engkau” memberi ragam bahasa yang bermartabat dan sesuai dengan sapaan langsung.
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: keturunanmu ... keturunannya
  rationale: זֶרַע secara harfiah berarti “benih,” tetapi dalam konteks ini menunjuk kepada keturunan. Pilihan ini alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan citra “benih” dan kemungkinan makna kolektif maupun wakil individual.
- source_word: הוּא
  choice: Dia
  rationale: Kata ganti Ibrani berbentuk maskulin tunggal sesudah nomina kolektif. “Dia” mempertahankan bentuk tunggal dalam bahasa Indonesia tanpa menambahkan penandaan gender yang tidak dimiliki kata ganti Indonesia.
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: akan meremukkan ... akan melukai
  rationale: Kedua klausa memakai verba Ibrani langka yang sama, tetapi sasaran kepala dan tumit menyiratkan perbedaan akibat. “Meremukkan” dan “melukai” menyatakan asimetri itu; catatan kaki menjelaskan pengulangan verba sumber dan alternatifnya.
- source_word: רֹאשׁ
  choice: kepala
  rationale: Padanan langsung dan alami untuk bagian tubuh yang dimaksud.
- source_word: עָקֵב
  choice: tumit
  rationale: Padanan langsung dan alami untuk bagian tubuh yang dimaksud.
theological_decisions:
- issue: Apakah keturunan perempuan harus diterjemahkan secara kolektif atau sebagai seorang wakil individual
  choice: Memakai “keturunan” dalam kedua bagian dan “Dia” sebagai kata ganti tunggal
  alternative: Memakai “mereka” secara kolektif atau mengulang “keturunan itu” tanpa kata ganti personal
  rationale: Nomina Ibrani זֶרַע bersifat kolektif, tetapi diikuti kata ganti maskulin tunggal הוּא. Terjemahan ini menjaga kemungkinan kolektif dan individual tanpa memasukkan penafsiran mesianis secara eksplisit ke dalam teks.
- issue: Seberapa kuat verba שׁוּף harus diterjemahkan dalam klausa tentang kepala
  choice: “meremukkan” untuk kepala dan “melukai” untuk tumit
  alternative: Memakai verba yang sama dalam kedua klausa, misalnya “menghantam ... menghantam” atau “melukai ... melukai”
  rationale: Teks Ibrani mengulang verba langka yang sama, tetapi perbedaan antara kepala dan tumit menyiratkan akibat yang tidak seimbang. Teks utama menyatakan perbedaan itu, sementara catatan kaki menjaga transparansi leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” dipakai untuk wacana langsung ilahi; susunan paralel sumber dipertahankan sejauh tetap alami. Istilah “keturunan” dipilih daripada “benih” dalam teks utama demi kejelasan, dengan citra dan ambiguitas Ibrani dijelaskan dalam catatan kaki.
