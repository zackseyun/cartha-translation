  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: id
  text: Lalu perempuan itu berkata kepada ular itu, “Buah dari pohon-pohon[a] di taman itu boleh kami makan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi, “Buah dari pohon di taman itu boleh kami makan”; kata “pohon” dipahami secara kolektif, sehingga diterjemahkan “pohon-pohon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” alami dalam bahasa Indonesia dan tidak memberi hubungan sebab-akibat yang tidak dinyatakan.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Di sini אִשָּׁה menunjuk kepada tokoh perempuan tersebut, bukan secara khusus menonjolkan perannya sebagai istri.
- source_word: אֶל הַנָּחָשׁ
  choice: kepada ular itu
  rationale: אֶל menyatakan arah perkataan, sedangkan נָחָשׁ secara wajar diterjemahkan “ular”; artikel tertentu diwakili oleh “itu”.
- source_word: מִפְּרִי
  choice: Buah dari
  rationale: מִן menyatakan sumber; susunan ini menghasilkan ungkapan Indonesia yang alami sambil mempertahankan gagasan makan dari buah yang berasal dari pohon-pohon taman.
- source_word: עֵץ הַגָּן
  choice: pohon-pohon di taman ini
  rationale: Walaupun עֵץ berbentuk tunggal, dalam konteks ini maknanya kolektif/distributif. Bentuk jamak mencegah kesan bahwa hanya satu pohon yang dimaksud. “Di” lebih alami daripada konstruksi posesif, dan “ini” menandai taman tertentu dalam konteks langsung.
- source_word: נֹאכֵל
  choice: boleh kami makan
  rationale: Imperfek orang pertama jamak dalam konteks ini menyatakan izin, menggemakan izin dalam Kejadian 2:16; “boleh” lebih tepat daripada sekadar kemampuan.
theological_decisions:
- issue: Cakupan pohon atau buah yang diizinkan dalam jawaban perempuan
  choice: Memahami עֵץ secara kolektif dan menerjemahkannya sebagai “pohon-pohon di taman ini”
  alternative: “pohon di taman ini”
  rationale: Bentuk Ibrani memang tunggal, tetapi konteks menunjukkan izin umum atas pohon-pohon taman sebelum pengecualian disebut pada ayat berikutnya. Catatan kaki mempertahankan transparansi terhadap bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan langsung “Buah ... boleh kami makan” mempertahankan penekanan awal pada buah dalam teks Ibrani, sementara partikel “itu” dan “ini” membuat rujukan tertentu terdengar alami.
