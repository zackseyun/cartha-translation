base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: id
  text: Lalu terbukalah mata mereka berdua, dan mereka tahu bahwa mereka telanjang. Mereka pun menjahit daun-daun ara menjadi satu dan membuat penutup pinggang bagi diri mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cawat” atau “celemek.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: terbukalah
  rationale: Bentuk Nifal menyatakan bahwa mata mereka terbuka; bentuk ini mempertahankan ungkapan Ibrani tanpa menjelaskan secara berlebihan jenis kesadaran baru yang timbul.
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: mata mereka berdua
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap menegaskan bahwa pengalaman tersebut dialami oleh keduanya.
- source_word: וַיֵּדְעוּ
  choice: mereka tahu
  rationale: Menerjemahkan ידע secara langsung dan mempertahankan kaitan leksikalnya tanpa menambahkan gagasan seperti rasa malu atau bangkitnya hati nurani yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang mereka ketahui.
- source_word: עֵירֻמִּם
  choice: telanjang
  rationale: Padanan langsung dan wajar yang mempertahankan hubungan naratif dengan Kejadian 2:25.
- source_word: וַיִּתְפְּרוּ
  choice: menyatukan ... dengan jahitan
  rationale: Kata kerja תפר berarti menjahit. Rumusan ini menyampaikan bahwa daun-daun itu disatukan dengan cara dijahit tanpa menambahkan alat atau bahan yang tidak disebutkan.
- source_word: עֲלֵה תְאֵנָה
  choice: daun-daun ara
  rationale: Padanan idiomatis dan tepat bagi frasa konstruksi Ibrani yang berarti daun pohon ara.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: membuat ... bagi diri mereka
  rationale: Mempertahankan arti refleksif dari frasa berpreposisi לָהֶם, yakni bahwa benda itu dibuat untuk mereka sendiri.
- source_word: חֲגֹרֹת
  choice: penutup pinggang
  rationale: Nomina ini merujuk pada sesuatu yang dikenakan atau diikat mengelilingi pinggang. 'Penutup pinggang' cukup konkret untuk menyampaikan bentuk umumnya, tetapi tidak memaksakan jenis pakaian yang terlalu khusus.
theological_decisions:
- issue: Hubungan antara mata yang terbuka, ketelanjangan, dan rasa malu atau kesadaran moral
  choice: 'Ayat diterjemahkan secara deskriptif: mata mereka terbuka dan mereka tahu bahwa mereka telanjang.'
  alternative: Menambahkan bahwa mereka merasa malu atau hati nurani mereka tersadarkan.
  rationale: Teks menyiratkan perubahan kesadaran diri, tetapi tidak secara eksplisit menyebut rasa malu ataupun menjelaskan mekanisme teologisnya.
- issue: Makna tepat חֲגֹרֹת
  choice: penutup pinggang
  alternative: cawat; celemek; penutup tubuh
  rationale: Kata Ibrani menunjukkan sesuatu yang dikenakan mengelilingi pinggang. Terjemahan ini menjaga gambaran dasarnya tanpa menentukan model pakaian secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Inversi ringan 'terbukalah' memberi nuansa sastra yang tetap mudah dipahami. Tidak ditambahkan istilah teologis seperti 'malu' atau 'hati nurani' karena tidak dinyatakan dalam ayat.
