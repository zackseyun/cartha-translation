id: GEN.3.1
reference: Genesis 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: id
  text: Ular itu lebih licik[a] daripada semua binatang liar yang telah dibuat oleh Yahweh Allah. Ular itu berkata kepada perempuan itu, “Benarkah Allah[b] berkata, ‘Kalian tidak boleh makan dari pohon mana pun[c] di taman’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “licik” juga dapat berarti “cerdik,” “lihai,” atau “penuh akal.” Di sini konteksnya memberi nuansa tipu daya.
    reason: lexical_alternative
  - marker: b
    text: Narator menyebut “Yahweh Allah,” tetapi ular hanya menyebut “Allah,” sesuai dengan peralihan sebutan dalam teks Ibrani.
    reason: alternative_reading
  - marker: c
    text: 'Secara lebih harfiah: “dari setiap pohon di taman.” Dalam pertanyaan negatif ini, “dari pohon mana pun” menyampaikan maksud kalimat secara alami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: Ular
  rationale: Nomina definit הַנָּחָשׁ menunjuk kepada ular yang menjadi tokoh dalam adegan. Konjungsi וְ tidak perlu diterjemahkan tersendiri pada awal bagian ini karena kesinambungan naratif sudah jelas dalam bahasa Indonesia.
- source_word: עָרוּם מִכֹּל
  choice: yang paling licik di antara segala
  rationale: עָרוּם dapat berarti cerdik, lihai, atau licik. Dalam konteks pertanyaan yang menyesatkan, “licik” menyampaikan nuansa negatifnya; konstruksi komparatif מִכֹּל secara alami diungkapkan sebagai superlatif dalam bahasa Indonesia.
- source_word: חַיַּת הַשָּׂדֶה
  choice: binatang liar
  rationale: Ungkapan ini merujuk pada binatang darat yang hidup di padang atau alam terbuka. “Binatang liar” alami dalam bahasa Indonesia dan membedakannya dari hewan peliharaan tanpa menyiratkan jenis tertentu.
- source_word: אֲשֶׁר עָשָׂה יְהוָה אֱלֹהִים
  choice: yang telah dibuat oleh Yahweh Allah
  rationale: Klausa relatif dipertahankan dengan jelas. Bentuk “telah dibuat” menandai tindakan penciptaan yang mendahului adegan ini, sedangkan nama ilahi diterjemahkan “Yahweh Allah” sesuai bentuk Ibrani.
- source_word: וַיֹּאמֶר אֶל הָאִשָּׁה
  choice: Ular itu berkata kepada perempuan itu
  rationale: Subjek diulangi agar rujukannya jelas dan alami dalam bahasa Indonesia. “Perempuan itu” mempertahankan penyebutan Ibrani tanpa memasukkan nama Hawa yang belum digunakan.
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: Benarkah Allah berkata
  rationale: אַף כִּי memperkenalkan pertanyaan bernada sangsi atau menyindir. “Benarkah” mempertahankan daya retoris itu tanpa menjadikannya pernyataan biasa. אֱלֹהִים tetap “Allah,” berbeda dari sebutan narator “Yahweh Allah.”
- source_word: לֹא תֹאכְלוּ
  choice: Kalian tidak boleh makan
  rationale: Bentuk verba orang kedua jamak menyapa perempuan dan laki-laki sebagai pihak yang tercakup dalam larangan. “Tidak boleh” menyatakan larangan secara alami; “kalian” mempertahankan jumlah jamak yang tidak tampak bila hanya memakai “kamu.”
- source_word: מִכֹּל עֵץ הַגָּן
  choice: buah dari pohon mana pun di taman ini
  rationale: Dalam lingkup negasi, מִכֹּל paling alami berarti “dari ... mana pun,” yang menyampaikan pembesaran larangan oleh ular. “Buah” merupakan objek makan yang tersirat secara alami dalam bahasa Indonesia, sedangkan “di taman ini” mengungkapkan hubungan genitif secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama diri ilahi יהוה, sehingga “Yahweh” mempertahankan pembedaan dari אֱלֹהִים, “Allah.”
- issue: Peralihan dari יְהוָה אֱלֹהִים dalam narasi ke אֱלֹהִים dalam ucapan ular
  choice: Yahweh Allah / Allah
  alternative: Menyelaraskan keduanya menjadi sebutan yang sama
  rationale: Peralihan sebutan terdapat dalam bahasa Ibrani dan mungkin penting bagi wacana; terjemahan tidak boleh menghapusnya.
- issue: Nuansa moral עָרוּם
  choice: licik
  alternative: cerdik
  rationale: Kata Ibrani dapat bernilai positif atau negatif, tetapi konteks langsung memberi nuansa tipu daya. Catatan kaki tetap mengakui keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, dengan “kalian” untuk mempertahankan bentuk jamak Ibrani dan “Yahweh Allah” untuk menjaga pembedaan nama ilahi.
