  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: id
  text: Namun ular itu berkata kepada perempuan itu, “Kalian[a] pasti tidak akan mati[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “kalian” berbentuk jamak, meskipun ular sedang berbicara kepada perempuan itu.
    reason: grammatical_number
  - marker: b
    text: Secara harfiah, “tidak—mati, kalian akan mati”; pengulangan bentuk kata “mati” merupakan susunan Ibrani yang memberi penegasan. Di sini penyangkalannya berarti, “Kalian sama sekali tidak akan mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Bentuk naratif dengan waw melanjutkan cerita, tetapi dalam konteks ini ucapan ular berlawanan langsung dengan peringatan Allah sebelumnya. “Namun” menyampaikan hubungan pertentangan itu secara wajar tanpa menambah isi.
- source_word: הַנָּחָשׁ
  choice: ular itu
  rationale: נָחָשׁ berarti ular. Bentuk definit Ibrani dipertahankan dengan “itu”, sesuai penyebutan tokoh yang sudah hadir dalam narasi.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: אִשָּׁה dapat berarti “perempuan” atau “istri”. Di sini “perempuan itu” mempertahankan pola naratif Kejadian 2–3 tanpa mempersempit maknanya menjadi hubungan perkawinan.
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: pasti tidak akan mati
  rationale: Infinitif absolut מוֹת bersama verba finit תְּמֻתוּן memberi penegasan. Dalam bahasa Indonesia, “pasti tidak akan mati” secara alami menyatakan penyangkalan tegas, bukan sekadar keraguan tentang kepastian kematian.
- source_word: תְּמֻתוּן
  choice: kalian ... akan mati
  rationale: Verba ini berbentuk orang kedua jamak. “Kalian” mempertahankan jumlah jamak yang tidak tampak dalam kata Indonesia “kamu”.
theological_decisions:
- issue: Kekuatan penyangkalan ular
  choice: “Kalian pasti tidak akan mati” sebagai penyangkalan mutlak dan langsung
  alternative: “Kalian tidak akan mati” atau “Kalian belum tentu akan mati”
  rationale: Susunan לֹא dengan infinitif absolut dan verba finit menegaskan penyangkalan terhadap peringatan sebelumnya. Terjemahan ini mempertahankan tajamnya pertentangan tanpa menjelaskan apakah kematian yang dimaksud segera atau kemudian.
- issue: Jumlah orang yang disapa
  choice: Mempertahankan bentuk jamak dengan “kalian”
  alternative: Memakai bentuk tunggal “kamu” karena ular berbicara kepada perempuan itu
  rationale: Teks menyebut perempuan itu sebagai lawan bicara, tetapi bentuk verbal Ibraninya jamak. Mempertahankan keduanya membiarkan ketegangan gramatikal teks tetap terlihat dan tidak menentukan secara tersirat siapa saja yang tercakup.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” menandai pertentangan dalam percakapan; “pasti tidak akan” dipilih agar cakupan penyangkalan tegas dan tidak ambigu. Bentuk jamak “kalian” mempertahankan morfologi sumber.
