  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: id
  text: Tetapi, dari buah pohon yang ada di tengah taman[a], Allah berfirman, “Jangan kalian memakan buahnya dan jangan menyentuh pohon itu, supaya kalian tidak mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang ada di bagian tengah taman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/פְּרִי
  choice: Namun, tentang buah dari
  rationale: Kata penghubung meneruskan pertentangan dengan ayat sebelumnya, sehingga “Namun” wajar dalam bahasa Indonesia. “Tentang buah dari” menyampaikan unsur preposisional מִן tanpa menghasilkan susunan yang kaku.
- source_word: הָעֵץ
  choice: pohon
  rationale: Padanan langsung bagi nomina definit ini; ketentuannya sudah jelas dari konstruksi frasa dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: yang ada di tengah taman
  rationale: בְּתוֹךְ menunjuk bagian dalam atau tengah; ungkapan ini alami dan tetap mempertahankan penekanan ruang.
- source_word: אָמַר אֱלֹהִים
  choice: Allah berfirman
  rationale: Bentuk qatal melaporkan perkataan yang telah disampaikan. “Berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: Jangan kalian memakannya
  rationale: Larangan dengan subjek jamak dinyatakan secara alami melalui “jangan kalian”; enklitik “-nya” merujuk pada buah tersebut dan menghindari ungkapan Indonesia yang kaku seperti “makan darinya”.
- source_word: וְלֹא תִגְּעוּ בּוֹ
  choice: dan jangan menyentuhnya
  rationale: Menjaga larangan tambahan dan arti langsung נגע, yaitu “menyentuh”, tanpa menyelaraskannya dengan Kejadian 2:17.
- source_word: פֶּן תְּמֻתוּן
  choice: agar jangan sampai kalian mati
  rationale: Ungkapan ini mempertahankan nuansa pencegahan atau akibat yang hendak dihindari dari פֶּן, tanpa mengubahnya menjadi pernyataan akibat yang terlalu mutlak.
theological_decisions:
- issue: Perkataan perempuan menambahkan larangan “jangan menyentuhnya” yang tidak tercantum dalam Kejadian 2:17.
  choice: Menerjemahkan tambahan larangan itu persis sebagai bagian dari perkataan perempuan.
  alternative: Menghilangkan atau melunakkannya agar selaras dengan Kejadian 2:17.
  rationale: Teks Ibrani menampilkan perbedaan ini secara sengaja dalam alur cerita; terjemahan harus mempertahankan ketegangan naratif dan teologis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Kata ganti “kalian” dipakai untuk memperlihatkan bahwa bentuk verba Ibrani berjumlah jamak. Tanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
