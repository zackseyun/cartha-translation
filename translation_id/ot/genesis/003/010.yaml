  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אֶת קֹלְ/ךָ֥ שָׁמַ֖עְתִּי בַּ/גָּ֑ן וָ/אִירָ֛א כִּֽי עֵירֹ֥ם אָנֹ֖כִי וָ/אֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: id
  text: Lalu ia berkata, “Aku mendengar suara-Mu di taman, dan aku takut karena aku telanjang. Jadi, aku bersembunyi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan memperkenalkan jawaban laki-laki itu; “lalu” wajar dalam narasi Indonesia tanpa memberi penekanan berlebihan.
- source_word: אֶת קֹלְךָ
  choice: suara-Mu
  rationale: קוֹל dapat berarti suara atau bunyi. Dalam bahasa Indonesia, “suara-Mu” paling alami sebagai sesuatu yang didengar dan tetap dapat mencakup suara kehadiran atau gerak, tidak hanya ucapan yang terartikulasi.
- source_word: שָׁמַעְתִּי
  choice: Aku mendengar
  rationale: Padanan langsung dan alami bagi bentuk qal perfektif orang pertama tunggal.
- source_word: בַּגָּן
  choice: di taman
  rationale: Mempertahankan tempat tertentu yang telah dikenal dari konteks sebelumnya.
- source_word: וָאִירָא
  choice: dan aku takut
  rationale: Mengungkapkan rasa takut secara langsung dan idiomatis.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan bagi rasa takut laki-laki itu.
- source_word: עֵירֹם אָנֹכִי
  choice: aku telanjang
  rationale: Klausa nominal Ibrani tidak menandai kala. Bentuk kini dalam kutipan langsung mempertahankan keadaan yang diakui pembicara tanpa memaksakan kala lampau.
- source_word: וָאֵחָבֵא
  choice: Jadi, aku bersembunyi
  rationale: Verba ini bersifat refleksif dalam makna. “Bersembunyi” sudah alami dan lengkap dalam bahasa Indonesia; “jadi” menyatakan hubungan akibat yang tersirat oleh rangkaian narasi.
theological_decisions:
- issue: Makna קוֹל sehubungan dengan kehadiran Allah
  choice: suara-Mu
  alternative: bunyi-Mu / bunyi kedatangan-Mu
  rationale: קוֹל memang dapat berarti “bunyi” atau “suara”. “Suara-Mu” merupakan padanan Indonesia yang alami dan cukup luas dalam konteks ini, serta tidak mengharuskan bahwa Allah sedang mengucapkan kata-kata.
- issue: Kala pada עֵירֹם אָנֹכִי
  choice: aku telanjang
  alternative: aku telanjang pada waktu itu
  rationale: Bahasa Ibrani memakai klausa nominal tanpa penanda kala. Bentuk kini mempertahankan ketaktertentuan gramatikal dan cocok dengan pengakuan langsung Adam.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kapital pada pronomina “-Mu” mengikuti kebiasaan penulisan Indonesia untuk sapaan kepada Allah. Tidak diperlukan catatan kaki karena “suara” dalam bahasa Indonesia cukup alami dan memiliki cakupan yang dapat menampung ambiguitas קוֹל.
