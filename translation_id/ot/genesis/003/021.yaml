base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: id
  text: Yahweh Allah membuat pakaian dari kulit[b] untuk laki-laki itu dan untuk istrinya[a], lalu memakaikan pakaian itu kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Adam dan istrinya.” Kata Ibrani אָדָם dapat berfungsi sebagai nama diri “Adam” atau sebagai nomina umum “laki-laki,” bergantung pada konteks.
    reason: alternative_reading
  - marker: b
    text: Atau, “tunik dari kulit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi Yahweh dan gelar Allah dalam rangkaian yang alami serta sudah dikenal dalam bahasa Indonesia.
- source_word: לְאָדָם
  choice: untuk laki-laki itu
  rationale: Dalam konteks ini אָדָם menunjuk kepada manusia laki-laki tertentu yang dibedakan dari istrinya. Pilihan ini mempertahankan pemakaian sebagai nomina umum, bukan langsung menetapkannya sebagai nama diri.
- source_word: וּלְאִשְׁתּוֹ
  choice: dan istrinya
  rationale: Bentuk dengan sufiks orang ketiga maskulin tunggal secara alami berarti 'istrinya' dalam konteks perkawinan.
- source_word: כָּתְנוֹת עוֹר
  choice: pakaian dari kulit
  rationale: כָּתְנוֹת merujuk pada pakaian badan, sedangkan עוֹר berarti kulit atau belulang. Ungkapan ini langsung, alami, dan tidak menentukan model pakaian secara berlebihan.
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Menyampaikan arti biasa verba עשה tanpa penambahan nuansa yang tidak diperlukan.
- source_word: וַיַּלְבִּשֵׁם
  choice: lalu mengenakannya kepada mereka
  rationale: Bentuk kausatif verba לבש berarti menyebabkan seseorang memakai sesuatu. Terjemahan ini alami dalam bahasa Indonesia dan memperjelas bahwa pakaian itulah yang dikenakan kepada mereka.
theological_decisions:
- issue: Apakah אָדָם diterjemahkan sebagai nama diri atau nomina umum
  choice: 'nomina umum: ''laki-laki itu'''
  alternative: 'nama diri: ''Adam'''
  rationale: Konteks membedakan manusia laki-laki itu dari istrinya, dan bahasa Ibrani masih memungkinkan pembacaan sebagai nomina umum. Terjemahan utama tidak menutup ambiguitas ini; alternatifnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. 'Pakaian' dipilih daripada istilah yang lebih teknis seperti 'jubah' atau 'tunik'; nama ilahi 'Yahweh' dipertahankan.
