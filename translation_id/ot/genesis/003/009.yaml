  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: id
  text: Lalu Yahweh Allah memanggil manusia itu dan berkata kepadanya, “Di manakah engkau?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Bentuk Qal wayyiqtol dari קרא melanjutkan rangkaian narasi. “Memanggil” menyampaikan tindakan berseru kepada seseorang tanpa menambahkan gagasan bahwa ia dipanggil untuk menghadap.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh,” sedangkan אֱלֹהִים diterjemahkan “Allah”; gabungan ini mempertahankan nama diri dan gelar ilahi dalam teks sumber.
- source_word: הָאָדָם
  choice: laki-laki itu
  rationale: Dalam konteks langsung ini, frasa tersebut menunjuk kepada manusia laki-laki tertentu yang sedang dicari dan disapa, bukan umat manusia secara umum.
- source_word: וַיֹּאמֶר לוֹ
  choice: dan berkata kepadanya
  rationale: Terjemahan ini mempertahankan pronomina objek לוֹ (“kepadanya”) dan hubungan naratif yang dinyatakan oleh waw.
- source_word: אַיֶּכָּה
  choice: Di manakah engkau?
  rationale: Kata tanya dengan akhiran orang kedua maskulin tunggal menanyakan lokasi orang yang disapa. Bentuk ini alami, jelas, dan bernada luhur dalam bahasa Indonesia.
- source_word: וַ
  choice: Lalu
  rationale: Waw naratif menandai kelanjutan atau urutan peristiwa; “Lalu” menyampaikannya secara wajar dalam narasi Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memuat nama diri ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Rujukan הָאָדָם
  choice: laki-laki itu
  alternative: manusia itu; Adam
  rationale: Konteks menunjuk kepada sosok laki-laki tertentu, tetapi bentuk Ibrani masih memakai nomina dengan artikel, bukan nama diri tanpa artikel. Karena itu, “laki-laki itu” mempertahankan kekhususan rujukan tanpa mengubahnya menjadi nama “Adam”.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Engkau” dipakai dalam sapaan langsung kepada satu orang agar sesuai dengan register narasi Alkitab yang luhur tetapi tetap mudah dipahami. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dicantumkan dalam ayat ini.
