base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: id
  text: Kemudian Yahweh Allah berfirman kepada perempuan itu, “Apa ini yang telah kaulakukan?” Perempuan itu menjawab, “Ular itu memperdaya aku,[a] dan aku makan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menipu aku” atau “menyesatkan aku.” Kata Ibrani ini dapat menyatakan tindakan memperdaya dengan membuat seseorang tersesat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh” untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: “Allah” adalah padanan baku dan alami bagi אֱלֹהִים dalam bahasa Indonesia; gabungan “Yahweh Allah” mempertahankan kedua unsur nama dan sebutan dalam teks sumber.
- source_word: לָאִשָּׁה
  choice: kepada perempuan itu
  rationale: אִשָּׁה dapat berarti “perempuan” atau “istri”; dalam pertukaran ini, “perempuan itu” mengikuti sebutan naratif tanpa menjadikan nuansa perkawinan sebagai arti utama.
- source_word: מַה זֹּאת עָשִׂית
  choice: Apa yang telah kaulakukan ini?
  rationale: Terjemahan ini mempertahankan kata tanya מַה dan penunjuk זֹּאת, tanpa mengubah pertanyaan “apa” menjadi pertanyaan sebab “mengapa”.
- source_word: הַנָּחָשׁ
  choice: ular itu
  rationale: “Ular” merupakan padanan Indonesia yang alami bagi נָחָשׁ; unsur definit dipertahankan dengan “itu” karena tokohnya sudah dikenal dari konteks.
- source_word: הִשִּׁיאַנִי
  choice: memperdaya aku
  rationale: Kata kerja ini menyatakan tindakan menipu atau menyesatkan. “Memperdaya aku” mempertahankan daya naratif dan moralnya dalam bahasa Indonesia yang wajar.
- source_word: וָאֹכֵל
  choice: dan aku makan
  rationale: Kata sambung diterjemahkan secara langsung sebagai “dan”, sehingga urutan tindakan tetap terpelihara tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna tindakan ular terhadap perempuan itu
  choice: Ular itu memperdaya aku
  alternative: Ular itu menipu aku / Ular itu menyesatkan aku
  rationale: “Memperdaya” menyampaikan bahwa ular membuat perempuan itu tersesat melalui penipuan, tetapi tidak mempersempit makna Ibrani pada satu mekanisme tertentu atau menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berfirman” dipakai untuk ucapan Allah, sedangkan “menjawab” membuat respons perempuan itu alami dalam konteks dialog. Bentuk “kaulakukan” mempertahankan sapaan orang kedua tunggal secara ringkas. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
