base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: id
  text: Lalu manusia itu menamai istrinya Hawa[a], karena dialah ibu dari semua yang hidup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Adam menamai istrinya Hawa.” Teks Ibrani berbunyi “manusia itu” (ha’adam), dengan kata sandang.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “ibu semua makhluk hidup” atau “ibu setiap orang yang hidup.” Secara harfiah, teks Ibrani berbunyi “ibu semua yang hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: menamai
  rationale: Dalam rumus pemberian nama ini, verba קרא berarti memberi nama. “Menamai” alami dalam bahasa Indonesia dan lebih jelas daripada terjemahan harfiah “memanggil nama”.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Nomina אָדָם memakai kata sandang, sehingga bentuk deskriptif “manusia itu” dipertahankan, bukan langsung dijadikan nama diri “Adam”.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Dalam konteks ini אִשָּׁה menunjuk kepada pasangan si manusia, sehingga “istrinya” merupakan padanan yang alami dan tepat.
- source_word: חַוָּה
  choice: Hawa
  rationale: “Hawa” adalah bentuk nama חַוָּה yang telah mapan dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini memperkenalkan alasan bagi pemberian nama tersebut.
- source_word: הִוא הָיְתָה
  choice: dialah
  rationale: Ungkapan ini menyatakan keadaan dan menonjolkan perempuan itu sebagai ibu; “dialah” menyampaikannya secara alami tanpa memberi makna perubahan seperti “menjadi”.
- source_word: אֵם כָּל חָי
  choice: ibu dari semua yang hidup
  rationale: Padanan ini mempertahankan ungkapan Ibrani yang ringkas dan cakupannya yang tidak diperinci, tanpa membatasinya secara eksplisit hanya pada manusia atau memperluasnya ke semua makhluk.
theological_decisions:
- issue: Apakah הָאָדָם diterjemahkan sebagai nama diri “Adam” atau sebutan “manusia itu”
  choice: manusia itu
  alternative: Adam
  rationale: Kata sandang pada הָאָדָם kuat mendukung pemahaman deskriptif. Terjemahan mempertahankan nuansa Ibrani dan tidak mendahului peralihan yang lebih jelas kepada nama diri.
- issue: Cakupan frasa “ibu dari semua yang hidup”
  choice: Mempertahankan frasa luas tanpa mempersempit cakupannya
  alternative: ibu semua manusia yang hidup; ibu semua makhluk hidup
  rationale: Frasa Ibraninya singkat dan terbuka mengenai cakupan. Terjemahan tidak menyelesaikan ketegangan tafsir yang tidak diselesaikan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menamai” dipilih agar rumus pemberian nama terdengar alami; “manusia itu” mempertahankan bentuk Ibrani berkata sandang; frasa “semua yang hidup” sengaja dibiarkan luas.
