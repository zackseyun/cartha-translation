  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: id
  text: Lalu perempuan itu melihat bahwa pohon itu baik untuk dimakan, sedap dipandang, dan diinginkan untuk menjadikan orang bijaksana.[a] Ia mengambil buahnya, lalu memakannya. Ia juga memberikannya kepada suaminya yang bersamanya,[b] dan ia pun memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memperoleh kebijaksanaan” atau “untuk memberi pengertian.” Kata Ibrani ini dapat menunjuk pada perolehan kebijaksanaan atau pada tindakan menjadikan seseorang bijaksana.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepada suaminya bersamanya.” Teks Ibrani menyatakan bahwa suaminya bersama perempuan itu, tetapi tidak merinci sejak kapan atau dalam arti apa.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: melihat
  rationale: Kata kerja naratif dasar untuk melihat; mempertahankan pengamatan dan penilaian perempuan itu tanpa menambahkan tafsiran.
- source_word: טוֹב ... לְמַאֲכָל
  choice: baik untuk dimakan
  rationale: Menyatakan bahwa pohon itu dinilai baik atau cocok sebagai makanan; ungkapan ini alami dalam bahasa Indonesia.
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: sedap dipandang
  rationale: Ungkapan Indonesia yang wajar untuk daya tarik visual, tanpa memberi warna moral negatif yang tidak dinyatakan secara eksplisit oleh frasa Ibrani.
- source_word: וְנֶחְמָד הָעֵץ לְהַשְׂכִּיל
  choice: pohon itu diinginkan untuk memperoleh kebijaksanaan
  rationale: Menjaga daya tarik yang dinyatakan נֶחְמָד dan memahami infinitif Hifil לְהַשְׂכִּיל sebagai perolehan kebijaksanaan atau pengertian, sambil mencatat kemungkinan kausatif dalam catatan kaki.
- source_word: מִפִּרְיוֹ
  choice: buahnya
  rationale: Bahasa Indonesia tidak memerlukan penerjemahan harfiah preposisi מן dalam konstruksi 'mengambil buahnya'; makna mengambil sebagian dari buah pohon tetap jelas.
- source_word: וַתִּתֵּן גַּם
  choice: Ia juga memberikannya
  rationale: גַּם menyatakan tindakan tambahan; objek tersirat dari konteks dibuat eksplisit melalui pronomina '-nya' agar alami.
- source_word: לְאִישָׁהּ עִמָּהּ
  choice: kepada suaminya yang bersamanya
  rationale: אִישׁ dengan sufiks posesif di sini menunjuk pada suaminya, sedangkan עִמָּהּ secara eksplisit menyatakan bahwa ia bersama perempuan itu.
theological_decisions:
- issue: Warna moral dalam penilaian perempuan
  choice: 'Memakai istilah yang secara leksikal relatif netral: ''baik'', ''sedap dipandang'', dan ''diinginkan''.'
  alternative: Memakai istilah yang lebih negatif seperti 'menggoda', 'bernafsu', atau 'didambakan dengan tamak'.
  rationale: Teks menggambarkan bagaimana perempuan itu menilai pohon tersebut sebelum menceritakan tindakannya; terjemahan tidak seharusnya memasukkan kecaman moral ke dalam kata-kata deskriptif melebihi bahasa Ibrani.
- issue: Makna לְהַשְׂכִּיל
  choice: untuk memperoleh kebijaksanaan
  alternative: untuk membuat seseorang bijaksana
  rationale: Bentuk Ibrani dapat berkaitan dengan menjadi bijaksana, memperoleh pemahaman, atau membuat bijaksana. Teks utama memakai ungkapan Indonesia yang alami, sedangkan kemungkinan kausatif dipertahankan dalam catatan kaki.
- issue: Kehadiran suami bersama perempuan itu
  choice: yang bersamanya
  alternative: bersama dia
  rationale: Frasa עִמָּהּ dipertahankan secara eksplisit dan dikaitkan dengan suaminya tanpa menjelaskan lebih jauh kapan ia hadir atau apa yang dilakukannya sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Kalimat panjang Ibrani dibagi agar alur narasi mudah dipahami. Pilihan 'sedap dipandang' mempertahankan daya tarik visual dengan ungkapan yang lazim; 'kebijaksanaan' dipakai untuk nuansa שכל tanpa memasukkan doktrin tertentu.
