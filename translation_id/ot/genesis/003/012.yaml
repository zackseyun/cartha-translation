  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: id
  text: Lalu laki-laki itu berkata, “Perempuan yang Engkau berikan untuk menyertai aku itu—dialah yang memberiku buah dari pohon itu[a], lalu aku makan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari pohon itu”; kata “buah” tersirat dari konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: laki-laki itu
  rationale: Dalam konteks ini, istilah tersebut menunjuk kepada individu laki-laki yang sedang menjawab Allah, bukan kepada umat manusia secara umum.
- source_word: הָאִשָּׁה
  choice: perempuan
  rationale: Mempertahankan sebutan langsung dalam bahasa Ibrani; terjemahan 'istri' mungkin dalam konteks lain, tetapi kurang langsung di sini.
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: yang Engkau berikan untuk menyertai aku
  rationale: Mengungkapkan secara wajar bahwa perempuan itu diberikan untuk berada bersama laki-laki tersebut, tanpa mengurangi atau memperkuat nada jawabannya.
- source_word: הִוא
  choice: dialah
  rationale: Bentuk ini mempertahankan penekanan dari kata ganti mandiri Ibrani dan secara alami menonjolkan perempuan itu sebagai pelaku yang disebut oleh laki-laki tersebut.
- source_word: נָתְנָה לִּי
  choice: memberiku
  rationale: Bentuk lampau dipahami dari alur narasi; bahasa Indonesia tidak memerlukan penandaan kala secara morfologis.
- source_word: מִן הָעֵץ
  choice: buah dari pohon itu
  rationale: Kata 'buah' tidak tertulis secara eksplisit, tetapi objek yang dimaksud jelas dari konteks dan perlu dinyatakan agar konstruksi 'memberiku ... dari pohon itu' terdengar alami dalam bahasa Indonesia.
- source_word: וָאֹכֵל
  choice: lalu aku makan
  rationale: Kata 'lalu' menyampaikan urutan tindakan tanpa menambahkan hubungan sebab-akibat sekuat 'maka' atau 'jadi'.
theological_decisions:
- issue: Jawaban laki-laki itu berpotensi mengalihkan kesalahan kepada perempuan dan kepada Allah.
  choice: Mempertahankan frasa 'Perempuan yang Engkau berikan untuk menyertai aku itu' tanpa pelunakan atau penguatan.
  alternative: Perempuan yang Engkau berikan kepadaku / Perempuan yang Engkau tempatkan di sisiku
  rationale: Teks Ibrani mempertahankan ketegangan bahwa laki-laki itu menyebut baik perempuan maupun tindakan Allah yang memberikannya. Terjemahan tidak boleh menghapus ataupun melebih-lebihkan implikasi tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'Engkau' dipakai karena laki-laki itu berbicara langsung kepada Allah. Tanda pisah mempertahankan penekanan pada 'dialah' yang terdapat dalam susunan Ibrani.
