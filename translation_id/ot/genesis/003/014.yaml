id: GEN.3.14
reference: Genesis 3:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: id
  text: Lalu Yahweh Allah berfirman kepada ular itu, “Karena engkau telah melakukan hal ini, engkau lebih terkutuk daripada segala ternak dan segala binatang liar di padang. Engkau akan merayap dengan perutmu, dan debu akan kaumakan[a] seumur hidupmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “memakan debu” juga dapat menjadi gambaran penghinaan dan kekalahan, bukan hanya pernyataan tentang makanan secara harfiah.
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi YHWH dan gelar אֱלֹהִים sebagai pasangan, selaras dengan lapisan konsultasi yang telah diaudit dan tetap alami dalam bahasa Indonesia.
- source_word: הַנָּחָשׁ
  choice: ular itu
  rationale: Bahasa Indonesia modern umumnya memakai 'ular' baik untuk snake maupun serpent; penanda '-nya/itu' menyampaikan bentuk definit Ibrani tanpa memaksakan identifikasi teologis kemudian.
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: Karena engkau telah melakukan hal ini
  rationale: Menunjukkan hubungan sebab yang eksplisit antara tindakan ular dan hukuman yang menyusul.
- source_word: אָרוּר אַתָּה מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: engkau lebih terkutuk daripada segala ternak dan segala binatang liar di padang
  rationale: Menyampaikan konstruksi komparatif מן secara jelas serta membedakan ternak dari binatang liar, tanpa mengganti 'di padang' dengan kategori yang terlalu umum.
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: Dengan perutmu engkau akan berjalan
  rationale: Mempertahankan verba umum הלך, 'berjalan/pergi', dan tidak mempersempitnya menjadi 'merayap', sementara frasa 'dengan perutmu' menjelaskan caranya.
- source_word: וְעָפָר תֹּאכַל
  choice: dan debu akan kaumakan
  rationale: Mempertahankan citra konkret serta penekanan pada 'debu' tanpa menjadikannya semata-mata pernyataan tentang makanan harfiah.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: seumur hidupmu
  rationale: Ungkapan Indonesia yang alami dan lengkap untuk 'sepanjang hari-hari hidupmu', dengan cakupan waktu yang sama.
theological_decisions:
- issue: Identitas ular
  choice: Menyebutnya hanya sebagai 'ular itu' dalam teks utama.
  alternative: Mengidentifikasinya secara eksplisit sebagai Iblis atau Setan.
  rationale: Ayat ini sendiri menyapa הַנָּחָשׁ dan tidak memberikan identifikasi teologis tambahan; terjemahan tidak memasukkan penafsiran dari teks yang lebih kemudian.
- issue: Sifat ungkapan memakan debu
  choice: Mempertahankan gambaran konkret dalam teks dan mencatat kemungkinan makna penghinaan dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'engkau akan dipermalukan/dikalahkan'.
  rationale: Bahasa sumber memungkinkan gambaran fisik sekaligus gema idiomatik; ketegangan itu sebaiknya tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kata ganti 'engkau' mempertahankan sapaan tunggal dan nada penghakiman; susunan klausa dibuat cukup dekat dengan Ibrani tanpa mengorbankan kelancaran.
