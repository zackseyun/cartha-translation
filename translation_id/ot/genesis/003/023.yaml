review_pass:
  verdict: revise
  source_fidelity: 'Makna inti terjaga: יהוה אלהים adalah pelaku, האדם dikeluarkan dari Taman Eden, dan tujuannya ialah mengusahakan tanah asal manusia diambil. Namun, “menyuruh dia keluar” dalam bahasa Indonesia terutama berarti memerintahkan seseorang agar keluar, bukan tindakan Allah mengirimkan/menyingkirkan dia keluar sebagaimana וַיְשַׁלְּחֵהוּ.'
  naturalness: Kalimat draft umumnya jelas dan berregister baik, tetapi “mengirim dia keluar” lebih alami dan lebih dekat dengan daya verba Ibrani daripada “menyuruh dia keluar.” Frasa “tanah tempat ia telah diambil” lebih idiomatis daripada “tanah yang darinya ia telah diambil,” sambil tetap mempertahankan acuan kepada tanah.
  terminology: “Yahweh Allah,” “Taman Eden,” “mengusahakan tanah,” dan “tanah” tepat serta konsisten dengan istilah sumber. Catatan kaki mempertahankan rentang leksikal עבד tanpa menjadikan salah satu alternatif sebagai satu-satunya makna.
  issues:
  - severity: medium
    issue: “Menyuruh dia keluar” tidak cukup menyatakan tindakan pengiriman/penyingkiran.
    rationale: Piel שלח berarti mengirim, menyuruh pergi, atau melepaskan. Dalam konteks ini, Allah bertindak mengeluarkan manusia dari taman. Dalam bahasa Indonesia, “menyuruh dia keluar” lazimnya dipahami sebagai memberi perintah, sehingga daya tindakan verbalnya melemah.
  - severity: low
    issue: Klausa “yang darinya ia telah diambil” agak kaku.
    rationale: Klausa itu akurat secara struktur, tetapi “tanah tempat ia telah diambil” lebih wajar dalam bahasa Indonesia modern dan tetap menyatakan bahwa tanah itulah asal pengambilannya.
  revised_text: Maka Yahweh Allah mengirim dia keluar dari Taman Eden untuk mengusahakan tanah tempat ia telah diambil.[a]
  revised_footnotes:
  - marker: a
    text: Atau, “mengerjakan tanah.” Kata kerja Ibrani ini dapat berarti “bekerja,” “melayani,” atau, dalam konteks ini, “mengolah.”
    reason: lexical_alternative
  revision_rationale: 'Revisi mengganti “menyuruh dia keluar” dengan “mengirim dia keluar” untuk mencerminkan וַיְשַׁלְּחֵהוּ tanpa mengantisipasi nuansa lebih kuat dari גרשׁ pada ayat berikutnya. Klausa relatif diidiomatisasikan tanpa mengubah hubungan sumbernya: manusia telah diambil dari tanah.'
