- from: Maka Yahweh Allah menyuruh dia keluar dari Taman Eden untuk mengusahakan tanah yang darinya ia telah diambil.[a]
  to: Maka Yahweh Allah mengirim dia keluar dari Taman Eden untuk mengusahakan tanah tempat ia telah diambil.[a]
  rationale: 'Revisi mengganti “menyuruh dia keluar” dengan “mengirim dia keluar” untuk mencerminkan וַיְשַׁלְּחֵהוּ tanpa mengantisipasi nuansa lebih kuat dari גרשׁ pada ayat berikutnya. Klausa relatif diidiomatisasikan tanpa mengubah hubungan sumbernya: manusia telah diambil dari tanah.'
