  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: id
  text: Maka Yahweh Allah mengirim dia keluar dari Taman Eden untuk mengusahakan tanah tempat ia telah diambil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengerjakan tanah.” Kata kerja Ibrani ini dapat berarti “bekerja,” “melayani,” atau, dalam konteks ini, “mengolah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: menyuruh dia keluar
  rationale: Bentuk piel dari שׁלח di sini menyatakan pengiriman atau penyingkiran dari suatu tempat. Pilihan ini mempertahankan makna dasar itu tanpa memakai nuansa lebih keras 'mengusir' dari גרשׁ pada ayat berikutnya.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah', sesuai padanan baku bahasa Indonesia.
- source_word: מִגַּן עֵדֶן
  choice: dari Taman Eden
  rationale: Preposisi מִן menandai pemisahan dari lokasi; 'dari Taman Eden' alami dan tepat dalam bahasa Indonesia.
- source_word: לַעֲבֹד
  choice: untuk mengusahakan
  rationale: Dengan objek tanah, עבד mengacu pada bekerja atau mengolah tanah. 'Mengusahakan' cukup luas untuk mempertahankan kaitan dengan tugas manusia sebelumnya tanpa mempersempitnya secara berlebihan.
- source_word: אֶת הָאֲדָמָה
  choice: tanah
  rationale: אֲדָמָה merujuk pada tanah asal manusia dan tanah yang harus dikerjakannya; 'tanah' mempertahankan hubungan naratif tersebut.
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: yang darinya ia telah diambil
  rationale: Klausa relatif menerangkan 'tanah'. Bentuk pasif dan tindakan yang mendahului pengeluaran dari taman dipertahankan melalui 'telah diambil'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan pekerjaan manusia dengan tugasnya semula
  choice: mengusahakan tanah
  alternative: mengerjakan tanah; mengolah tanah; melayani tanah
  rationale: Ungkapan ini mempertahankan kesinambungan leksikal dengan panggilan manusia untuk mengerjakan taman atau tanah, tanpa menambahkan penafsiran teologis yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Maka' menyampaikan kesinambungan naratif וַ tanpa membuat hubungan sebab-akibat terlalu tegas; 'ia' menjaga kelancaran klausa relatif.
