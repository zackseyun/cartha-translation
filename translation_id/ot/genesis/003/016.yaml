  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: id
  text: Kepada perempuan itu Dia berkata, “Aku akan sangat menambah kesusahanmu dan kehamilanmu; dengan kesakitan engkau akan melahirkan anak-anak.[a] Hasratmu[b] akan tertuju kepada suamimu, dan dia akan berkuasa atasmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki”; di sini kemungkinan besar berarti anak atau keturunan secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “kerinduanmu”. Kata Ibrani yang jarang dipakai ini dapat menyatakan hasrat dalam arti luas. Sebagian menafsirkannya sebagai keinginan untuk menguasai (bandingkan Kejadian 4:7), sedangkan yang lain memahaminya sebagai kerinduan relasional atau seksual.
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Dalam adegan ini kata tersebut menunjuk kepada manusia perempuan yang sedang disapa; hubungan perkawinan baru dinyatakan secara khusus melalui אִישֵׁךְ, ‘suamimu’.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Aku akan sangat menambah
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan kuat; bentuk ini mempertahankan intensitasnya dalam bahasa Indonesia yang wajar.
- source_word: עִצְּבוֹנֵךְ
  choice: kesusahanmu
  rationale: Nomina ini dapat berarti kesakitan, kesusahan, atau jerih payah. ‘Kesusahan’ menjaga cakupan yang lebih luas dan tidak menjadikannya sekadar pengulangan dari kesakitan saat melahirkan pada klausa berikutnya.
- source_word: וְהֵרֹנֵךְ
  choice: kehamilanmu
  rationale: Istilah Ibrani dapat menunjuk pada pembuahan atau kehamilan; ‘kehamilan’ lebih alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: בְּעֶצֶב
  choice: dengan kesakitan
  rationale: Frasa preposisional ini menerangkan keadaan atau cara melahirkan; terjemahan tersebut dekat dengan bahasa sumber dan alami dalam konteks.
- source_word: תֵּלְדִי בָנִים
  choice: engkau akan melahirkan anak-anak
  rationale: בָנִים secara harfiah berarti ‘anak-anak lelaki’, tetapi dalam konteks ini kemungkinan besar mencakup keturunan atau anak secara umum.
- source_word: אִישֵׁךְ
  choice: suamimu
  rationale: Dalam relasinya dengan perempuan tersebut, אִישׁ di sini secara alami berarti ‘suami’, bukan sekadar ‘laki-laki’.
- source_word: תְּשׁוּקָתֵךְ
  choice: hasratmu akan tertuju kepada
  rationale: Kata yang jarang muncul ini menyatakan hasrat atau kerinduan tanpa memastikan apakah sifatnya seksual, relasional, bergantung, atau ingin menguasai. ‘Hasrat’ menjaga ambiguitas itu.
- source_word: יִמְשָׁל בָּךְ
  choice: dia akan berkuasa atasmu
  rationale: Verba tersebut berarti memerintah atau berkuasa atas. Pilihan ini langsung tetapi tidak memperkuatnya menjadi ‘menindas’ atau ‘mendominasi’.
theological_decisions:
- issue: Makna hasrat perempuan terhadap suaminya
  choice: Memakai ‘hasrat’ tanpa menentukan jenis atau maksud hasrat tersebut.
  alternative: Kerinduan seksual; ketergantungan atau kerinduan relasional; keinginan untuk menguasai, dibandingkan dengan Kejadian 4:7.
  rationale: תְּשׁוּקָה jarang muncul dan konteksnya tidak memastikan satu nuansa tertentu. Teks utama mempertahankan ketegangan penafsirannya, sedangkan kemungkinan-kemungkinannya dicatat dalam catatan kaki.
- issue: Apakah kekuasaan laki-laki bersifat perintah atau gambaran akibat kejatuhan
  choice: 'Menerjemahkannya sebagai pernyataan tentang apa yang akan terjadi: ‘dia akan berkuasa atasmu’.'
  alternative: Memahaminya sebagai ketetapan normatif tentang otoritas laki-laki.
  rationale: Bentuk verbal Ibrani menyatakan keadaan yang akan terjadi, bukan perintah mengenai apa yang seharusnya dilakukan. Terjemahan tidak memasukkan klaim normatif yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘engkau’ dipakai untuk sapaan tunggal dalam tuturan ilahi, sedangkan ‘Dia’ mengikuti konvensi penghormatan dalam penerbitan Alkitab Indonesia. Susunan klausa mempertahankan kesejajaran dan ketegangan teks Ibrani tanpa memasukkan tafsiran denominatif.
