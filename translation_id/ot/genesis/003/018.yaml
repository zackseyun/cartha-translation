  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: id
  text: Tanah itu akan menumbuhkan semak duri dan tumbuhan berduri bagimu,[a] dan engkau akan memakan tumbuh-tumbuhan ladang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Tanah itu akan menghasilkan semak duri dan tumbuhan berduri bagimu.” Verba Ibraninya berbentuk kausatif dan merujuk kembali kepada tanah pada ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Tumbuh-tumbuhan ladang” dapat juga diterjemahkan “tanaman ladang” atau “vegetasi di ladang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: semak duri
  rationale: קוֹץ menunjuk pada tumbuhan berduri secara kolektif; “semak duri” alami dalam bahasa Indonesia dan membedakannya dari unsur kedua dalam pasangan ini.
- source_word: וְדַרְדַּר
  choice: rumput berduri
  rationale: דַּרְדַּר adalah gulma berduri yang dibedakan dari קוֹץ. Pilihan ini mempertahankan perbedaan tanpa menetapkan spesies botani tertentu.
- source_word: תַּצְמִיחַ לָךְ
  choice: akan menumbuhkan ... bagimu
  rationale: Bentuk Hifil verba צמח bersifat kausatif dan subjek feminin tunggalnya merujuk kembali kepada הָאֲדָמָה, “tanah”, pada ayat sebelumnya. “Menumbuhkan” menyampaikan daya kausatif dengan wajar, sementara “bagimu” mempertahankan לָךְ.
- source_word: וְאָכַלְתָּ
  choice: dan engkau akan memakan
  rationale: Dalam konteks ini, bentuk tersebut melanjutkan pernyataan tentang akibat pada masa mendatang. “Engkau” mempertahankan sapaan tunggal.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: tumbuh-tumbuhan di ladang
  rationale: עֵשֶׂב mencakup vegetasi atau tanaman, bukan hanya rumput. “Tumbuh-tumbuhan” mudah dipahami dan “di ladang” mengungkapkan hubungan konstruksi Ibrani secara alami.
theological_decisions:
- issue: Rujukan verba feminin tunggal תַּצְמִיחַ
  choice: Subjek dinyatakan sebagai “tanah itu”, merujuk kepada tanah pada ayat 17.
  alternative: Memakai subjek tersirat atau pronomina “itu”.
  rationale: Keselarasan gender dalam bahasa Ibrani secara alami menghubungkan verba ini dengan הָאֲדָמָה pada ayat sebelumnya. Menyebut “tanah itu” memperjelas rujukan yang sudah tersirat tanpa mengubah makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal; kosakata botani dibuat umum agar tidak memberi identifikasi spesies yang tidak dituntut teks.
