base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: id
  text: Sebab Allah tahu bahwa pada hari kalian memakannya, mata kalian akan terbuka dan kalian akan menjadi seperti Allah,[a] mengetahui yang baik dan yang jahat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti ilah-ilah” atau “seperti makhluk-makhluk ilahi.” Kata Ibrani אֱלֹהִים dapat memiliki arti-arti ini dalam konteks tertentu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini memperkenalkan alasan yang diberikan ular bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan wacananya.
- source_word: יֹדֵעַ אֱלֹהִים
  choice: Allah tahu
  rationale: Bentuk partisip Ibrani bersama subjek menyatakan keadaan kini dan paling alami diterjemahkan demikian dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Konjungsi kedua memperkenalkan isi dari apa yang Allah ketahui.
- source_word: בְּיוֹם
  choice: pada waktu
  rationale: Ungkapan waktu Ibrani menunjuk pada saat tindakan itu terjadi dan tidak harus berarti satu hari 24 jam; “pada waktu” menyampaikan maksud itu secara alami.
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: kamu memakannya
  rationale: Dalam bahasa Indonesia modern, bentuk ini secara alami menyatakan bahwa yang dimakan berasal dari buah yang telah disebutkan.
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: mata kamu akan terbuka
  rationale: Mempertahankan bentuk pasif Niphal dan metafora tentang kesadaran atau pengertian.
- source_word: וִהְיִיתֶם
  choice: kamu akan menjadi
  rationale: Dalam konteks perubahan keadaan setelah makan, “menjadi” menyatakan hasil yang dijanjikan secara jelas.
- source_word: כֵּאלֹהִים
  choice: seperti Allah
  rationale: Konteks terdekat berulang kali menunjuk kepada Allah yang esa, tetapi kemungkinan “seperti ilah-ilah” atau “seperti makhluk-makhluk ilahi” tetap dicatat dalam catatan kaki.
- source_word: יֹדְעֵי
  choice: tahu tentang
  rationale: Partisip ini menerangkan keadaan subjek setelah “menjadi seperti Allah”; tambahan “tentang” menghasilkan ungkapan Indonesia yang alami tanpa menentukan secara berlebihan jenis pengetahuan yang dimaksud.
- source_word: טוֹב וָרָע
  choice: yang baik dan yang jahat
  rationale: Padanan ini mempertahankan bobot moral dan cakupan konseptual pasangan istilah Ibrani.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam כֵּאלֹהִים
  choice: seperti Allah
  alternative: seperti ilah-ilah; seperti makhluk-makhluk ilahi
  rationale: Konteks langsung paling mungkin menunjuk kepada Allah, dan frasa berikutnya mengaitkannya dengan pengetahuan tentang yang baik dan yang jahat. Namun, bentuk אֱלֹהִים memang dapat memiliki arti lain, sehingga ambiguitas yang sungguh ada dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk “kamu” dipakai karena sapaan Ibrani bersifat jamak dan merujuk kepada kedua manusia; bahasa Indonesia tidak menandai jumlah pada pronomina ini. Susunan kalimat dijaga dekat dengan alur Ibrani tanpa menjadi kaku.
