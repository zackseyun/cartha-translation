  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: id
  text: Ia mengusir manusia itu. Lalu, di sebelah timur taman Eden, Ia menempatkan para kerub dan nyala pedang yang berputar ke segala arah[a] untuk menjaga jalan menuju pohon kehidupan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “nyala pedang yang berbalik-balik.” Ungkapan ini juga secara tradisional diterjemahkan “pedang bernyala yang berputar ke segala arah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: Ia mengusir
  rationale: Kata kerja גרשׁ menyatakan tindakan menghalau atau mengeluarkan secara paksa; “mengusir” menyampaikan daya tindakan tersebut secara wajar dalam bahasa Indonesia.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Dalam konteks ini אָדָם menunjuk kepada individu yang sebelumnya ditempatkan di taman. “Manusia itu” mempertahankan kaitan dengan manusia yang telah disebutkan tanpa menjadikannya umat manusia secara abstrak.
- source_word: וַיַּשְׁכֵּן
  choice: Ia menempatkan
  rationale: Bentuk Hifil dari שכן berarti membuat tinggal atau menaruh pada suatu tempat. “Menempatkan” alami dalam bahasa Indonesia dan sesuai dengan fungsi penjagaan dalam konteks.
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: di sebelah timur taman Eden
  rationale: Ungkapan ruang ini menunjuk kepada sisi atau kawasan timur taman; “di sebelah timur” mempertahankan cakupan lokatifnya tanpa menentukan apakah tepat di batas taman atau agak ke timur darinya.
- source_word: הַכְּרֻבִים
  choice: para kerub
  rationale: “Kerub” adalah transliterasi Indonesia yang lazim bagi makhluk surgawi ini; “para” menandai bentuk jamaknya dengan jelas.
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: nyala pedang yang berputar ke segala arah
  rationale: Terjemahan ini mempertahankan susunan “nyala pedang” dan gerak berkelanjutan partisipel מִתְהַפֶּכֶת. Catatan kaki mencatat alternatif tradisional dan kemungkinan nuansa geraknya.
- source_word: לִשְׁמֹר
  choice: untuk menjaga
  rationale: Dalam konteks pembatasan akses, שׁמר paling tepat disampaikan dengan “menjaga”.
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: jalan menuju pohon kehidupan
  rationale: Walaupun secara bentuk berarti “jalan pohon kehidupan,” relasinya secara idiomatis adalah jalan yang menuju pohon tersebut.
theological_decisions:
- issue: Makna אָדָם dalam konteks narasi
  choice: manusia itu
  alternative: Adam; umat manusia; laki-laki itu
  rationale: Ayat ini menunjuk kepada individu tertentu dalam narasi, bukan umat manusia sebagai konsep kolektif. “Manusia itu” mempertahankan rujukan individual sekaligus permainan leksikal אָדָם sebagai manusia, tanpa memaksanya menjadi nama diri.
- issue: Sifat nyala dan pedang dalam frasa לַהַט הַחֶרֶב
  choice: nyala pedang
  alternative: pedang yang bernyala-nyala; kilatan pedang
  rationale: Bentuk konstruksi Ibrani secara harfiah menghubungkan “nyala” dengan “pedang.” Terjemahan utama mempertahankan ketegangan gambaran itu dan tidak memastikan apakah yang dimaksud adalah pedang bernyala atau nyala berbentuk/berkaitan dengan pedang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “Ia” dipakai untuk subjek ilahi yang tersirat dari konteks. Tanda koma setelah keterangan lokasi membantu memperjelas bahwa para kerub dan nyala pedang ditempatkan di kawasan timur taman.
