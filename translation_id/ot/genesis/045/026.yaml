base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/026.yaml
  text: They told him[a], saying, “Joseph is still alive, and he is ruler over all the land of Egypt.” But his heart went numb, for he did not believe them.
translation:
  language: id
  text: Mereka memberi tahu dia, “Yusuf masih hidup, dan ia berkuasa atas seluruh tanah Mesir.” Namun, hati Yakub menjadi lemah, sebab ia tidak memercayai mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hati Yakub mati rasa” atau “hati Yakub seakan pingsan.” Ungkapan Ibrani ini menggambarkan reaksi batin Yakub yang terpukul dan melemah ketika mendengar kabar tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לוֹ לֵאמֹר
  choice: Mereka memberi tahu dia
  rationale: Bentuk Hifil dari נגד berarti memberi tahu atau melaporkan. Rumus לֵאמֹר tidak perlu diterjemahkan secara terpisah karena kutipan langsung sudah menandai isi pemberitahuan secara alami dalam bahasa Indonesia.
- source_word: עוֹד יוֹסֵף חַי
  choice: Yusuf masih hidup
  rationale: עוֹד menandai keadaan yang berlanjut, sedangkan חַי berarti hidup; susunan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: וְכִי הוּא מֹשֵׁל
  choice: bahkan dialah yang berkuasa
  rationale: Partisipel מֹשֵׁל menunjuk pada pelaksanaan kekuasaan, bukan harus suatu jabatan Mesir tertentu. 'Bahkan' menyampaikan daya penegas וְכִי dalam kabar yang mengejutkan, dan 'dialah' mencerminkan pronomina eksplisit הוּא.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: atas seluruh tanah Mesir
  rationale: Dengan מֹשֵׁל, preposisi בְּ menandai wilayah kekuasaan; 'atas seluruh tanah Mesir' mempertahankan cakupan geografis dan makna pemerintahan.
- source_word: וַיָּפָג לִבּוֹ
  choice: hati Yakub menjadi kelu
  rationale: פוג menggambarkan hati yang melemah, membeku, atau mati rasa akibat keterkejutan. 'Menjadi kelu' mempertahankan metafora reaksi batin yang terpukul tanpa menentukan secara berlebihan apakah ia pingsan secara fisik. Nama Yakub dipakai agar rujukan pronomina jelas dalam ayat mandiri.
- source_word: כִּי לֹא הֶאֱמִין לָהֶם
  choice: sebab ia tidak memercayai mereka
  rationale: כִּי menyatakan alasan bagi reaksi Yakub. Bentuk baku 'memercayai' dan penghubung 'sebab' sesuai dengan narasi Indonesia yang dignified dan alami.
