translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Metafora Ibrani tentang hati dipertahankan, disertai catatan kaki karena rentang makna פוג mencakup menjadi lemah, kelu, atau mati rasa.
