- from: Mereka memberi tahu dia, “Yusuf masih hidup, bahkan dialah yang berkuasa atas seluruh tanah Mesir.” Namun, hati Yakub menjadi kelu[a], sebab ia tidak memercayai mereka.
  to: Mereka memberi tahu dia, “Yusuf masih hidup, dan ia berkuasa atas seluruh tanah Mesir.” Namun, hati Yakub menjadi lemah, sebab ia tidak memercayai mereka.[a]
  rationale: Revisi mengganti «kelu» dengan «lemah» untuk menyampaikan rentang makna פוג secara wajar dalam bahasa Indonesia tanpa mengubah metafora «hati». Kata «bahkan» dihilangkan agar hubungan dua isi laporan tetap netral seperti dalam teks Ibrani. Penanda catatan kaki dipindahkan ke klausa yang diterangkannya.
