    issue: «Hati Yakub menjadi kelu»
    rationale: «Kelu» dalam pemakaian Indonesia modern lazimnya berarti tidak mampu berkata-kata; ini dapat menggeser reaksi batin yang dinyatakan oleh פוג, yaitu melemah, mati rasa, atau pingsan/terkesiap.
  - severity: low
    issue: «bahkan dialah»
    rationale: Konjungsi וְכִי memperkenalkan bagian kedua laporan. Nuansa penegasan «bahkan» mungkin dapat dipahami, tetapi tidak perlu dipaksakan; «dan ia berkuasa» lebih netral dan dekat dengan sumber.
