base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/019.yaml
  text: 'And you are commanded[a], ‘Do this: take for yourselves wagons from the land of Egypt for your little ones and for your wives[c][b], and carry your father and come.’'
translation:
  language: id
  text: 'Dan engkau telah diperintahkan: “Lakukanlah ini: Ambillah bagi kalian kereta-kereta[a] dari tanah Mesir untuk anak-anak kecil kalian[b] dan istri-istri kalian. Bawalah ayah kalian, lalu datanglah.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pedati-pedati”, yakni kendaraan angkut beroda yang dikirim dari Mesir.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “anak-anak kecil” secara khusus mengacu kepada anak-anak yang masih kecil.
    reason: lexical_clarification
  - marker: c
    text: Dalam konteks ini dapat dipahami sebagai “datanglah kembali” atau “datanglah kemari”, yaitu ke Mesir, meskipun teks Ibrani hanya mengatakan “datanglah”.
    reason: alternative_reading
lexical_decisions:
- source_word: צֻוֵּיתָה
  choice: engkau telah diperintahkan
  rationale: Bentuk pasif orang kedua tunggal menunjukkan bahwa Yusuf telah menerima perintah, dalam konteks ini dari Firaun.
- source_word: זֹאת עֲשׂוּ
  choice: Lakukanlah ini
  rationale: Mempertahankan rumusan perintah Ibrani secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: קְחוּ לָכֶם
  choice: Ambillah bagi kalian
  rationale: Frasa 'bagi kalian' mempertahankan nuansa benefaktif pada pronomina datif, sedangkan bentuk jamak imperatif ditunjukkan oleh 'kalian'.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Menerjemahkan אֶרֶץ secara eksplisit tanpa menghasilkan ungkapan yang janggal.
- source_word: עֲגָלוֹת
  choice: kereta-kereta
  rationale: Mengacu pada kendaraan angkut beroda untuk membawa keluarga dan barang; alternatif 'pedati' dicatat dalam catatan kaki.
- source_word: לְטַפְּכֶם
  choice: untuk anak-anak kecil kalian
  rationale: טַף secara khusus menunjuk kepada anak-anak yang masih kecil, bukan semua keturunan secara umum.
- source_word: וְלִנְשֵׁיכֶם
  choice: dan istri-istri kalian
  rationale: Dalam konteks perjalanan keluarga, נָשִׁים jelas merujuk kepada para istri.
- source_word: וּנְשָׂאתֶם אֶת אֲבִיכֶם
  choice: Bawalah ayah kalian
  rationale: נשא secara harfiah dapat berarti mengangkat atau mengangkut, tetapi dalam konteks ini menyatakan membawa sang ayah dengan kendaraan; 'bawalah' terdengar alami dan tetap mencakup gagasan transportasi.
- source_word: וּבָאתֶם
  choice: lalu datanglah
  rationale: Mempertahankan arti dasar בוא tanpa menambahkan secara diam-diam keterangan 'kembali' atau 'kemari', meskipun arah menuju Mesir tersirat oleh konteks.
