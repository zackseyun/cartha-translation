base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/009.yaml
  text: 'Hurry and go up to my father[a], and say to him, ‘Thus says your son Joseph: God has made me lord over all Egypt. Come down to me; do not delay.’'
translation:
  language: id
  text: 'Bersegeralah dan naiklah kepada ayahku, lalu katakan kepadanya, ‘Beginilah kata Yusuf, anakmu: Allah telah menjadikan aku penguasa atas seluruh Mesir. Turunlah kepadaku; jangan berlama-lama[a].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan tinggal”; secara harfiah, “jangan berdiri.”
    reason: alternatif_leksikal
lexical_decisions:
- source_word: מַהֲרוּ
  choice: Segeralah
  rationale: Imperatif jamak ini menyatakan desakan. Bentuk ini alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: וַעֲלוּ
  choice: pergi
  rationale: עלה secara harfiah berarti ‘naik’, tetapi dalam bahasa Indonesia modern ‘pergi kepada ayahku’ lebih alami; arah perjalanan menuju Kanaan tidak perlu dipaksakan menjadi ungkapan yang janggal.
- source_word: אֶל אָבִי
  choice: kepada ayahku
  rationale: Menerjemahkan frasa arah secara langsung tanpa menambahkan tempat yang tidak dinyatakan.
- source_word: וַאֲמַרְתֶּם אֵלָיו
  choice: dan katakan kepadanya
  rationale: Rangkaian instruksi sesudah imperatif diterjemahkan sebagai perintah langsung yang wajar.
- source_word: כֹּה אָמַר
  choice: Beginilah kata
  rationale: Mempertahankan formula pembawa pesan dalam bentuk bahasa Indonesia yang baku dan mudah dipahami.
- source_word: בִּנְךָ יוֹסֵף
  choice: Yusuf, anakmu
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap menonjolkan hubungan Yusuf sebagai anak penerima pesan.
- source_word: שָׂמַנִי אֱלֹהִים
  choice: Allah telah menjadikan aku
  rationale: שׂים di sini menunjukkan penempatan atau pengangkatan ke suatu kedudukan; ‘menjadikan’ sesuai dengan komplemen yang mengikutinya.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Konteks dan sintaksis menunjukkan satu-satunya Allah yang kepada-Nya Yusuf mengaitkan kedudukannya.
- source_word: לְאָדוֹן
  choice: penguasa
  rationale: אָדוֹן menunjukkan orang yang memiliki wewenang. ‘Penguasa’ menyampaikan fungsi tersebut dengan jelas tanpa menimbulkan kerancuan dengan gelar ilahi ‘Tuhan’.
- source_word: לְכָל מִצְרָיִם
  choice: atas seluruh Mesir
  rationale: Preposisi לְ bersama אָדוֹן menyatakan lingkup wewenang atas Mesir.
- source_word: רְדָה אֵלַי
  choice: Turunlah kepadaku
  rationale: Mempertahankan arah geografis turun menuju Mesir sekaligus menjadikan Yusuf sebagai tujuan.
- source_word: אַל תַּעֲמֹד
  choice: jangan berlambat-lambat
  rationale: עמד secara harfiah berarti ‘berdiri’, tetapi dalam larangan ini bermakna jangan tinggal, menunggu, atau menunda. Ungkapan ini mempertahankan desakan tanpa terdengar kaku.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים dalam pernyataan Yusuf
  choice: Allah
  alternative: allah/dewa
  rationale: Bentuk dan konteksnya menunjuk kepada satu Allah yang oleh Yusuf diakui sebagai pihak yang mengangkatnya; ini mengikuti makna teks dan bukan penambahan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Formula pesan dipertahankan, sedangkan istilah jabatan diterjemahkan secara fungsional agar jelas bagi pembaca umum.
