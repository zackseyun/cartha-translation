  text: וְ/כִלְכַּלְתִּ֤י אֹֽתְ/ךָ֙ שָׁ֔ם כִּי ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן תִּוָּרֵ֛שׁ אַתָּ֥ה וּ/בֵֽיתְ/ךָ֖ וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/011.yaml
  text: There I will provide for you, because there are still five years of famine, lest you and your household and all that belongs to you become destitute.
translation:
  language: id
  text: Di sana aku akan mencukupi kebutuhanmu, sebab masih ada lima tahun kelaparan lagi, supaya jangan engkau, keluargamu, dan semua yang kaumiliki jatuh miskin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִלְכַּלְתִּי
  choice: aku akan mencukupi kebutuhanmu
  rationale: Bentuk verba ini menyatakan tindakan menopang atau menyediakan kebutuhan hidup. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan pemeliharaan berkelanjutan.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memberi alasan bagi janji Yusuf untuk mencukupi kebutuhan ayahnya.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Menandai akibat buruk yang hendak dicegah, bukan sekadar kemungkinan netral.
- source_word: תִּוָּרֵשׁ
  choice: jatuh miskin
  rationale: Bentuk ini dalam konteks tersebut berarti menjadi melarat atau kehilangan harta, bukan 'diwarisi'.
- source_word: בֵיתְךָ
  choice: keluargamu
  rationale: Secara harfiah 'rumahmu', tetapi di sini menunjuk kepada seisi rumah atau rumah tangga Yakub.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Kata ganti orang pertama mengikuti ucapan Yusuf; bentuk 'engkau' dipertahankan agar sesuai dengan sapaan tunggal kepada ayahnya, sedangkan 'keluargamu' mengungkapkan makna rumah tangga dengan jelas.
