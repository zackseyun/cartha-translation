  text: Then he fell on the neck of Benjamin his brother and wept[a], and Benjamin wept on his neck.
translation:
  language: id
  text: Lalu Yusuf memeluk Benyamin, saudaranya, dan menangis di lehernya[a]. Benyamin pun menangis di leher Yusuf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh pada leher-leher Benyamin, saudaranya ... dan Benyamin menangis pada leher-lehernya.” Bentuk jamak “leher-leher” dalam ungkapan Ibrani ini bersifat idiomatis dan mengacu pada pelukan di sekitar leher.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל עַל צַוְּארֵי
  choice: memeluk ... dan ... di lehernya
  rationale: Secara harfiah ungkapan ini berarti 'jatuh pada leher', tetapi dalam konteks perjumpaan kembali merupakan idiom tindakan merangkul atau memeluk pada leher. Terjemahan ini alami dalam bahasa Indonesia sambil mempertahankan penyebutan leher.
- source_word: בִנְיָמִן אָחִיו
  choice: Benyamin, adiknya
  rationale: Nama ditulis menurut bentuk baku Indonesia. אָחִיו berarti 'saudaranya'; dalam konteks silsilah, Benyamin adalah adik Yusuf, sehingga 'adiknya' menyampaikan hubungan yang dimaksud secara alami.
- source_word: וַיֵּבְךְּ / בָּכָה
  choice: menangis
  rationale: Kedua bentuk berasal dari בכה dan secara langsung berarti menangis; pilihan yang sama mempertahankan kesejajaran kedua klausa.
- source_word: וּבִנְיָמִן
  choice: Benyamin pun
  rationale: Partikel 'pun' secara alami menyatakan tindakan timbal balik Benyamin dalam bahasa Indonesia tanpa menambahkan gagasan teologis.
- source_word: עַל צַוָּארָיו
  choice: di leher Yusuf
  rationale: 'Rujukan pronomina dibuat eksplisit untuk mencegah ketaksaan yang tidak terdapat dalam konteks: leher yang dimaksud adalah leher Yusuf.'
