  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia pada Ibrani. Namun, “keluar dari sini” menggeneralisasi מֵעָלָי (“dari hadapanku/dari dekatku”) dan tidak lagi menyatakan secara eksplisit bahwa Yusuf memerintahkan orang-orang itu disingkirkan dari hadapannya. “Keluarkanlah semua orang dari hadapanku” mempertahankan arah perintah kausatif dan rujukan orang pertama.
  naturalness: Bahasa naratifnya modern dan jelas. “Keluarkanlah semua orang dari hadapanku” tetap alami dalam register naratif yang bermartabat dan lebih tepat daripada “Suruhlah semua orang keluar dari sini.”
  terminology: Nama Yusuf dan istilah “saudara-saudaranya” konsisten. “Memperkenalkan dirinya” tepat untuk pengungkapan identitas dalam konteks ini; alternatif catatan kaki juga sah.
  issues:
  - severity: medium
    issue: “dari sini” pada perintah Yusuf
    rationale: Ungkapan ini tidak menyatakan unsur orang pertama dalam מֵעָלָי, yakni bahwa semua orang harus keluar dari hadapan Yusuf. Perintah Ibrani juga berbentuk kausatif kepada orang-orang yang hadir. “Keluarkanlah semua orang dari hadapanku” menyampaikan kedua unsur tersebut tanpa mengubah makna.
