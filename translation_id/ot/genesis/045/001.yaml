base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/001.yaml
  text: Then Joseph could no longer restrain himself before all those standing by him[a], and he cried out[c][b], “Have everyone go out from me!” And no one remained with him when Joseph made himself known to his brothers.
translation:
  language: id
  text: Lalu Yusuf tidak dapat lagi menahan dirinya di hadapan semua orang yang berdiri di dekatnya.[a] Ia berseru, “Keluarkanlah semua orang dari hadapanku!” Maka tidak seorang pun tetap bersama Yusuf ketika ia memperkenalkan dirinya kepada saudara-saudaranya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “di hadapan semua orang yang berdiri di sisinya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ketika Yusuf menyatakan siapa dirinya kepada saudara-saudaranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכֹל ... לְהִתְאַפֵּק
  choice: tidak dapat lagi menahan dirinya
  rationale: Gabungan verba kemampuan dengan negasi dan bentuk refleksif menyatakan bahwa Yusuf tidak lagi mampu mengendalikan atau menahan dirinya; ‘menahan dirinya’ mempertahankan nuansa refleksif tanpa menentukan emosi tertentu.
- source_word: לְכֹל הַנִּצָּבִים עָלָיו
  choice: di hadapan semua orang yang berdiri di dekatnya
  rationale: Frasa ini menunjuk kepada orang-orang yang berdiri atau bertugas di sekitar Yusuf. Terjemahan ini dekat dengan bentuk Ibrani tanpa mempersempit mereka secara interpretatif menjadi ‘para pelayan’.
- source_word: וַיִּקְרָא
  choice: Ia berseru
  rationale: Verba קרא dalam konteks ini menunjukkan panggilan yang diucapkan dengan suara keras; ‘berseru’ sesuai dengan suasana emosional tanpa menambah isi.
- source_word: הוֹצִיאוּ כָל אִישׁ מֵעָלָי
  choice: Suruhlah semua orang keluar dari sini!
  rationale: Imperatif jamak kausatif meminta pihak yang hadir mengeluarkan setiap orang. ‘Dari sini’ mengungkapkan maksud idiomatis ‘dari dekat/hadapanku’ secara alami dalam bahasa Indonesia.
- source_word: וְלֹא עָמַד אִישׁ אִתּוֹ
  choice: Maka tidak seorang pun tetap bersama Yusuf
  rationale: Secara harfiah עמד berarti ‘berdiri’, tetapi dalam konteks ini berarti tetap hadir. ‘Tetap bersama’ menyampaikan makna itu dengan wajar; nama Yusuf dipakai untuk menghindari kemungkinan rujukan pronomina yang kabur.
- source_word: בְּהִתְוַדַּע יוֹסֵף
  choice: ketika ia memperkenalkan dirinya
  rationale: Bentuk hitpael menyatakan Yusuf membuat dirinya dikenal. ‘Memperkenalkan dirinya’ alami dalam konteks pengungkapan identitas, sementara catatan kaki memberi padanan yang lebih formal.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Istilah ini merujuk langsung kepada saudara-saudara laki-laki Yusuf; dalam konteks narasi, bentuk Indonesia ini jelas dan alami.
