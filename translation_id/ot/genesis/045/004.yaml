translation:
  language: id
  text: Lalu Yusuf berkata kepada saudara-saudaranya, “Silakan mendekat kepadaku.” Mereka pun mendekat. Lalu ia berkata, “Aku Yusuf, saudara kalian, yang kalian jual ke Mesir.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan gerak berurutan itu secara alami dalam bahasa Indonesia.
- source_word: אֶל־אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Bentuk jamak אָח dengan sufiks orang ketiga tunggal maskulin secara langsung berarti saudara-saudara Yusuf.
- source_word: גְּשׁוּ נָא אֵלַי
  choice: Mendekatlah kepadaku
  rationale: נגשׁ berarti mendekat, sedangkan נָא menghaluskan permintaan. Partikel “-lah” memberi nuansa ajakan atau permintaan yang halus tanpa membuat kalimat kaku.
- source_word: וַיִּגָּשׁוּ
  choice: Mereka pun mendekat
  rationale: Kata “mendekat” diulang untuk mempertahankan pengulangan akar נגשׁ; “pun” menandai tanggapan langsung mereka secara idiomatis.
- source_word: אֲנִי יוֹסֵף
  choice: Akulah Yusuf
  rationale: Klausa nominal Ibrani menyatakan identitas dengan tekanan pada אֲנִי; “Akulah” menyampaikan penegasan pengenalan diri secara alami.
- source_word: אֲחִיכֶם
  choice: saudaramu
  rationale: Nomina tunggal dengan sufiks orang kedua jamak menyatakan bahwa Yusuf adalah saudara mereka; “-mu” dapat merujuk kepada lawan bicara jamak dalam bahasa Indonesia.
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתִי
  choice: yang telah kalian jual
  rationale: Klausa relatif tetap langsung dan menuduh. “Kalian” memperjelas bahwa subjeknya jamak, sedangkan “telah” menempatkan tindakan itu sebagai peristiwa lampau.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran direktif -ָה menunjukkan arah atau tujuan menuju Mesir; “ke Mesir” adalah padanan Indonesia yang tepat dan alami.
