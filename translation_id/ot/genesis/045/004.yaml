translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan “mendekat” dipertahankan, hubungan keluarga dinyatakan secara langsung, dan tuduhan Yusuf tidak diperhalus. “Kalian” digunakan dalam klausa relatif untuk menandai orang kedua jamak dengan jelas.
