  yaml_path: translation/ot/genesis/045/021.yaml
  text: And the sons of Israel did so[a], and Joseph gave them wagons according to Pharaoh’s command, and he gave them provisions for the journey.
translation:
  language: id
  text: Anak-anak laki-laki Israel pun melakukan demikian. Yusuf memberikan kepada mereka gerobak-gerobak sesuai dengan perintah Firaun,[a] dan ia memberi mereka bekal untuk perjalanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Firaun”, sebuah ungkapan yang berarti “sesuai dengan perintah Firaun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: pun berbuat demikian
  rationale: Ungkapan ini menyatakan bahwa mereka melakukan apa yang baru saja diperintahkan atau dijelaskan; bentuk ini alami dan tetap dekat dengan susunan Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: putra-putra Israel
  rationale: Dalam konteks langsung, ungkapan ini menunjuk secara khusus kepada anak-anak lelaki Yakub/Israel, sehingga unsur gender dari בְּנֵי dipertahankan.
- source_word: עֲגָלוֹת
  choice: kereta-kereta
  rationale: Kata ini menunjuk pada kendaraan beroda untuk mengangkut orang dan barang; 'kereta-kereta' sesuai dengan konteks perjalanan keluarga Yakub ke Mesir.
- source_word: עַל פִּי פַרְעֹה
  choice: sesuai dengan perintah Firaun
  rationale: Secara harfiah ungkapan ini berarti 'menurut mulut Firaun', sebuah idiom untuk bertindak sesuai dengan perintahnya.
- source_word: צֵדָה
  choice: bekal
  rationale: '''Bekal'' secara alami mencakup persediaan yang diperlukan selama perjalanan dan tidak membatasinya hanya pada makanan.'
- source_word: לַדָּרֶךְ
  choice: untuk perjalanan
  rationale: Frasa ini menyatakan tujuan bekal tersebut, yakni untuk dipakai selama perjalanan.
