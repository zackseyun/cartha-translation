  text: וְ/עַתָּ֗ה לֹֽא אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִ/י֙ הֵ֔נָּה כִּ֖י הָ/אֱלֹהִ֑ים וַ/יְשִׂימֵ֨/נִֽי לְ/אָ֜ב לְ/פַרְעֹ֗ה וּ/לְ/אָדוֹן֙ לְ/כָל בֵּית֔/וֹ וּ/מֹשֵׁ֖ל בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/008.yaml
  text: So now[a], it was not you who sent me here, but God; and he has made me a father to Pharaoh, and lord over all his house, and ruler over all the land of Egypt.
translation:
  language: id
  text: Jadi sekarang, bukan kalian yang mengutus aku ke sini, melainkan Allah. Ia telah menjadikan aku ayah bagi Firaun[a], dan tuan atas seluruh rumah tangganya, serta penguasa atas seluruh tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti seorang ayah bagi Firaun”; maksudnya, pelindung utama, penasihat, atau orang yang memberi manfaat.
    reason: Menjelaskan kemungkinan nuansa konstruksi לְ dan cakupan metaforis אָב tanpa menggantinya dengan satu jabatan yang terlalu sempit.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mengungkapkan unsur penghubung וְ sekaligus fungsi temporal dan wacana עַתָּה sebagai kesimpulan dari penjelasan Yusuf sebelumnya.
- source_word: לֹא אַתֶּם שְׁלַחְתֶּם אֹתִי הֵנָּה
  choice: bukan kalian yang mengutus aku ke sini
  rationale: Susunan ini mempertahankan penekanan pada אַתֶּם, ‘kalian’, dan menerjemahkan הֵנָּה secara deiktis sebagai ‘ke sini’, yaitu ke Mesir.
- source_word: כִּי הָאֱלֹהִים
  choice: melainkan Allah
  rationale: 'Sesudah penyangkalan, כִּי berfungsi menyatakan kontras: bukan kalian, melainkan Allah.'
- source_word: וַיְשִׂימֵנִי
  choice: Ia telah menjadikan aku
  rationale: Bentuk ini menyampaikan tindakan Allah pada masa lampau yang hasilnya masih berlaku dalam kedudukan Yusuf saat berbicara.
- source_word: לְאָב לְפַרְעֹה
  choice: ayah bagi Firaun
  rationale: Metafora אָב dipertahankan agar cakupan maknanya sebagai pelindung, penasihat, atau pemberi manfaat tidak dipersempit menjadi satu jabatan tertentu.
- source_word: וּלְאָדוֹן לְכָל בֵּיתוֹ
  choice: dan tuan atas seluruh rumah tangganya
  rationale: ‘Tuan’ mencerminkan kewenangan dalam אָדוֹן, sedangkan ‘rumah tangga’ menyampaikan cakupan בֵּיתוֹ yang meliputi orang-orang dan urusan dalam lingkungan Firaun.
- source_word: וּמֹשֵׁל בְּכָל אֶרֶץ מִצְרָיִם
  choice: serta penguasa atas seluruh tanah Mesir
  rationale: ‘Penguasa’ mempertahankan makna umum מֹשֵׁל tanpa mempersempitnya menjadi jabatan administratif tertentu; ‘tanah Mesir’ menerjemahkan אֶרֶץ secara eksplisit.
theological_decisions:
- issue: Kedaulatan Allah dan tindakan manusia dalam perkataan Yusuf
  choice: 'Kontras yang kuat dipertahankan: ‘bukan kalian ... melainkan Allah’.'
  alternative: Melunakkan kontras atau menambahkan penjelasan teologis tentang hubungan antara tindakan saudara-saudara Yusuf dan maksud Allah.
  rationale: Teks menonjolkan maksud dan tindakan Allah tanpa menyangkal bahwa saudara-saudara Yusuf sungguh telah bertindak. Terjemahan mempertahankan ketegangan itu tanpa memasukkan sistem teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘kalian’ mempertahankan bentuk jamak yang ditujukan kepada saudara-saudara Yusuf. Istilah ‘ayah’, ‘tuan’, dan ‘penguasa’ menjaga tiga gambaran kedudukan Yusuf dalam teks Ibrani.
