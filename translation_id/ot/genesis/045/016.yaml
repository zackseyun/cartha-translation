base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/016.yaml
  text: The report was heard in Pharaoh’s house[a], saying[b], “Joseph’s brothers have come,” and it was pleasing in the eyes of Pharaoh and in the eyes of his servants.
translation:
  language: id
  text: 'Kabar itu terdengar di istana Firaun: “Saudara-saudara Yusuf telah datang.” Hal itu menyenangkan Firaun dan para pegawainya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַקֹּל
  choice: kabar itu
  rationale: Secara harfiah berarti 'suara', tetapi dalam konteks ini menunjuk pada kabar yang isinya dijelaskan oleh klausa berikutnya.
- source_word: נִשְׁמַע
  choice: terdengar
  rationale: Mempertahankan bentuk pasif Nifal dan menghasilkan ungkapan Indonesia yang wajar bersama 'kabar itu'.
- source_word: בֵּית פַּרְעֹה
  choice: di istana Firaun
  rationale: Secara harfiah 'rumah Firaun'; dalam konteks kerajaan, 'istana Firaun' menyampaikan lokasi dan lingkungan rumah tangga kerajaan secara alami.
- source_word: לֵאמֹר
  choice: yakni
  rationale: Memperkenalkan isi kabar secara alami dalam bahasa Indonesia; terjemahan mekanis 'dengan berkata' akan terasa janggal.
- source_word: בָּאוּ
  choice: telah datang
  rationale: 'Menyatakan tindakan yang sudah terjadi dan masih relevan: saudara-saudara Yusuf kini sudah hadir.'
- source_word: אֲחֵי יוֹסֵף
  choice: Saudara-saudara Yusuf
  rationale: Padanan alami bagi konstruksi kepunyaan Ibrani.
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: hal itu menyenangkan
  rationale: Menyampaikan idiom harfiah 'baik di mata' dengan bahasa Indonesia yang alami tanpa mengubah penilaiannya.
- source_word: עֲבָדָיו
  choice: para pegawainya
  rationale: Dalam lingkungan istana, עֲבָדִים dapat menunjuk para pelayan atau pejabat kerajaan; 'pegawai' cukup luas dan tidak menetapkan pangkat tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan laporan Ibrani, tetapi idiom sumber dialihkan secara alami. 'Istana' dipakai secara kontekstual untuk rumah tangga kerajaan; 'para pegawai' mempertahankan keluasan fungsi orang-orang Firaun.
