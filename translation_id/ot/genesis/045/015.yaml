translation_notes:
  register: Bahasa Indonesia baku yang modern, alami, dan bermartabat. Nama 'Yusuf' ditambahkan untuk memperjelas subjek tersirat. Tidak diperlukan catatan kaki karena 'berbicara dengannya' secara langsung mempertahankan konstruksi Ibrani dan ambiguitasnya tidak menimbulkan alternatif penting dalam bahasa Indonesia.
