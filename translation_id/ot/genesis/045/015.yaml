- from: Lalu Yusuf mencium semua saudaranya sambil menangis ketika memeluk mereka. Sesudah itu, saudara-saudaranya berbicara dengannya.
  to: Lalu Yusuf mencium semua saudaranya dan menangis atas mereka. Sesudah itu, saudara-saudaranya berbicara dengannya.
  rationale: Revisi menghapus "memeluk mereka," yang merupakan perluasan interpretatif, sambil mempertahankan urutan tindakan, totalitas "semua saudaranya," dan arah relasional dari עֲלֵיהֶם. "Menangis atas mereka" menjaga kedekatan dengan ungkapan Ibrani tanpa memaksakan rincian fisik yang tidak dinyatakan. Kalimat terakhir mempertahankan makna percakapan dari דבר dengan אֵת.
