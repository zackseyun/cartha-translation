  text: And he kissed all his brothers and wept over them. After that[a], his brothers spoke with him.
translation:
  language: id
  text: Lalu Yusuf mencium semua saudaranya dan menangis atas mereka. Sesudah itu, saudara-saudaranya berbicara dengannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְנַשֵּׁק לְכָל אֶחָיו
  choice: Lalu Yusuf mencium semua saudaranya
  rationale: Subjek yang tersirat diperjelas sebagai Yusuf sesuai konteks. Bentuk Piel dari נשׁק menyatakan tindakan mencium sebagai ungkapan kasih dan perdamaian; 'mencium' alami dalam bahasa Indonesia tanpa memaksakan nuansa berulang.
- source_word: וַיֵּבְךְּ עֲלֵיהֶם
  choice: sambil menangis ketika memeluk mereka
  rationale: Secara harfiah frasa ini berarti 'dan menangis atas/pada mereka'. Dalam adegan pertemuan kembali, עַל menggambarkan kontak fisik ketika Yusuf menangis pada saudara-saudaranya; ungkapan Indonesia ini menyampaikan gambaran tersebut secara alami, sejalan dengan konteks pelukan pada ayat sebelumnya.
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan temporal ini menandai urutan peristiwa secara jelas dan wajar dalam narasi Indonesia.
- source_word: דִּבְּרוּ אֶחָיו אִתּוֹ
  choice: saudara-saudaranya berbicara dengannya
  rationale: דבר dengan אֵת menunjukkan berbicara dengan seseorang dan dapat menyiratkan percakapan, bukan sekadar ujaran satu arah. 'Berbicara dengannya' mempertahankan nuansa itu.
