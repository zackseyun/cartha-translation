base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/018.yaml
  text: Take your father and your households[a], and come to me, and I will give you the best of the land of Egypt, and you shall eat the fat of the land.
translation:
  language: id
  text: Bawalah ayah kalian dan seisi rumah kalian, lalu datanglah kepadaku. Aku akan memberikan kepada kalian yang terbaik dari tanah Mesir, dan kalian akan menikmati hasil terbaik negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memakan lemak negeri itu.” Ungkapan Ibrani ini berarti menikmati bagian atau hasil negeri yang paling kaya dan terbaik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ
  choice: Bawalah
  rationale: Bentuk perintah jamak dari לקח. Dalam konteks perjalanan menuju pembicara, “bawalah” lebih alami dalam bahasa Indonesia daripada “ambillah” dan tetap menyampaikan tindakan mengikutsertakan ayah mereka.
- source_word: אֲבִיכֶם
  choice: ayah kalian
  rationale: Bentuk tunggal dengan akhiran orang kedua jamak, merujuk kepada Yakub sebagai ayah saudara-saudara Yusuf.
- source_word: בָּתֵּיכֶם
  choice: seisi rumah kalian
  rationale: Secara harfiah berarti “rumah-rumah kalian”, tetapi dalam konteks ini menunjuk kepada para anggota dan tanggungan dalam rumah tangga mereka. “Seisi rumah” mempertahankan citra rumah sekaligus menyampaikan makna sosialnya.
- source_word: וּבֹאוּ אֵלָי
  choice: lalu datanglah kepadaku
  rationale: Perintah jamak dengan אֶל. “Datanglah kepadaku” menyampaikan arti langsung tanpa menambahkan gagasan “kembali” yang tidak dinyatakan secara eksplisit.
- source_word: וְאֶתְּנָה לָכֶם
  choice: Aku akan memberikan kepada kalian
  rationale: Bentuk ini, sesudah rangkaian perintah, berfungsi sebagai janji atau jaminan. Bentuk futur dalam bahasa Indonesia menyampaikan hubungan tersebut dengan wajar.
- source_word: טוּב אֶרֶץ מִצְרַיִם
  choice: yang terbaik dari tanah Mesir
  rationale: טוּב dapat menunjuk kepada kebaikan, kelimpahan, atau bagian terbaik. Pilihan ini menyampaikan bahwa mereka akan memperoleh sumber daya terbaik Mesir.
- source_word: וְאִכְלוּ אֶת חֵלֶב הָאָרֶץ
  choice: dan kalian akan menikmati hasil terbaik negeri ini
  rationale: Secara harfiah ungkapan ini berarti “memakan lemak negeri”. Dalam bahasa Ibrani, “lemak” mengiaskan bagian yang paling kaya atau paling baik. “Menikmati hasil terbaik” menyampaikan makna idiomatis dengan bahasa Indonesia yang alami, sementara citra aslinya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian” untuk mempertahankan orang kedua jamak dalam teks Ibrani. Gaya dibuat lugas dan bermartabat; idiom Ibrani yang berpotensi membingungkan diterjemahkan menurut maknanya dan bentuk harfiahnya dipertahankan dalam catatan kaki.
