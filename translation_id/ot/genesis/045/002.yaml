  text: And he wept aloud[a], and the Egyptians heard[c][b], and Pharaoh’s household heard.
translation:
  language: id
  text: Ia menangis dengan suara keras[a], dan orang-orang Mesir mendengarnya[b]; rumah tangga Firaun juga mendengarnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mengeluarkan suaranya dalam tangisan,” suatu ungkapan Ibrani yang berarti bahwa ia menangis dengan suara keras.
    reason: lexical_alternative
  - marker: b
    text: Atau “Mesir mendengarnya,” jika kata itu dipahami sebagai sebutan kolektif bagi negeri atau rakyatnya. Bentuk verba jamak mendukung terjemahan “orang-orang Mesir.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “rumah Firaun”; dapat juga diterjemahkan “rumah Firaun” atau “kalangan istana Firaun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֶת־קֹלוֹ בִּבְכִי
  choice: ia menangis dengan suara keras
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘ia mengeluarkan suaranya dalam tangisan’ dan dalam konteks menyatakan tangisan yang terdengar keras. Terjemahan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁמְעוּ
  choice: mendengarnya
  rationale: Kata שׁמע di sini menunjuk pada persepsi bunyi, bukan tindakan menyimak atau menaati. Akhiran -nya memperjelas bahwa yang terdengar ialah tangisan Yusuf.
- source_word: מִצְרַיִם
  choice: orang-orang Mesir
  rationale: Walaupun bentuk ini juga dapat menunjuk pada negeri Mesir, verba jamak yang menyertainya mendukung pengertian kolektif-personal, yaitu orang-orang Mesir.
- source_word: בֵּית פַּרְעֹה
  choice: seisi istana Firaun
  rationale: Secara harfiah ‘rumah Firaun’; dalam konteks ini ungkapan tersebut menunjuk kepada orang-orang dalam lingkungan rumah tangga atau istana kerajaan, bukan semata-mata bangunannya.
