  naturalness: '"Menyampaikan kepadanya" dan "semangat ... pulih kembali" baku dan alami. "Gerobak-gerobak" lebih jelas dan idiomatis daripada "kereta-kereta" dalam konteks Indonesia modern. Struktur satu kalimat berkoordinasi membuat urutan peristiwa lebih mengalir tanpa menambahkan hubungan temporal atau kausal yang tidak dinyatakan secara eksplisit.'
  terminology: Transliterasi "Yosef" dan "Yaakov" konsisten dengan kebijakan nama proyek. "Semangat" sesuai dengan fungsi idiomatis רוח di sini, sedangkan catatan kaki dengan tepat mempertahankan padanan harfiah "roh" dan citra "hidup kembali."
