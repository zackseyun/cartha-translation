  text: וַ/יְדַבְּר֣וּ אֵלָ֗י/ו אֵ֣ת כָּל דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵ/הֶ֔ם וַ/יַּרְא֙ אֶת הָ֣/עֲגָל֔וֹת אֲשֶׁר שָׁלַ֥ח יוֹסֵ֖ף לָ/שֵׂ֣את אֹת֑/וֹ וַ/תְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/027.yaml
  text: And they told him all the words of Yosef that he had spoken to them[a], and he saw the wagons that Yosef had sent to carry him[b], and the spirit of their father Yaakov revived.
translation:
  language: id
  text: Lalu mereka menyampaikan kepadanya semua perkataan Yosef yang telah disampaikannya kepada mereka, dan ia melihat gerobak-gerobak[a] yang dikirim Yosef untuk membawanya; lalu semangat Yaakov, ayah mereka, pulih kembali[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kereta-kereta.” Istilah Ibrani ini menunjuk kendaraan beroda untuk mengangkut orang atau barang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “roh Yaakov, ayah mereka, hidup kembali,” sebuah ungkapan tentang pulihnya daya hidup atau semangat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: Lalu mereka memberitahukan kepadanya
  rationale: Kata kerja דבר dengan אֶל dalam konteks ini memperkenalkan laporan saudara-saudara kepada Yaakov. 'Memberitahukan' menyampaikan tindakan komunikatif itu secara wajar, sedangkan 'lalu' menandai kelanjutan narasi tanpa menambahkan pertentangan.
- source_word: אֵת כָּל דִּבְרֵי יוֹסֵף
  choice: semua perkataan Yosef
  rationale: Mempertahankan nomina konkret דִּבְרֵי ('perkataan') dan cakupan כָּל ('semua') dengan bahasa Indonesia yang jelas.
- source_word: אֲשֶׁר דִּבֶּר אֲלֵהֶם
  choice: yang telah Yosef sampaikan kepada mereka
  rationale: Bentuk 'telah ... sampaikan' menunjukkan bahwa perkataan itu lebih dahulu disampaikan kepada saudara-saudaranya. Nama Yosef diulang agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: הָעֲגָלוֹת
  choice: kereta-kereta
  rationale: עֲגָלוֹת menunjuk kendaraan darat untuk mengangkut orang atau barang. 'Kereta-kereta' sesuai dengan konteks sarana angkut dari Mesir; 'gerobak-gerobak' tetap mungkin.
- source_word: אֲשֶׁר שָׁלַח יוֹסֵף לָשֵׂאת אֹתוֹ
  choice: yang dikirim Yosef untuk mengangkutnya
  rationale: '''Mengangkutnya'' menyatakan fungsi kendaraan dan mempertahankan makna dasar נשׂא, yaitu membawa atau mengangkut, tanpa mengubahnya menjadi sekadar ''menjemputnya''.'
- source_word: וַתְּחִי רוּחַ
  choice: semangat ... bangkit kembali
  rationale: Ungkapan Ibrani ini secara harfiah berbicara tentang roh yang hidup kembali, tetapi dalam konteks menyatakan pulihnya daya hidup dan pengharapan. 'Semangat ... bangkit kembali' alami dalam bahasa Indonesia sekaligus mempertahankan citra kebangkitan hidup.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yaakov, ayah mereka
  rationale: Urutan ini jelas dan wajar dalam bahasa Indonesia. Nama יַעֲקֹב ditransliterasikan sebagai 'Yaakov' sesuai bentuk Ibrani, bukan diganti dengan bentuk nama tradisional Indonesia.
theological_decisions:
- issue: Makna רוּחַ dalam ungkapan וַתְּחִי רוּחַ
  choice: semangat Yaakov ... bangkit kembali
  alternative: roh Yaakov ... hidup kembali
  rationale: Dalam konteks ini רוּחַ menunjuk daya hidup atau batin Yaakov yang pulih setelah menerima bukti bahwa Yosef masih hidup, bukan pernyataan tentang kebangkitan dari kematian. Catatan kaki mempertahankan bentuk harfiah dan kemungkinan nuansa katanya.
- issue: Bentuk nama יַעֲקֹב dan יוֹסֵף
  choice: Yaakov dan Yosef
  alternative: Yakub dan Yusuf
  rationale: Nama-nama pribadi ditransliterasikan langsung dari bentuk Ibrani agar selaras dengan kebijakan proyek, tanpa menyiratkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur narasi dibuat mengalir dengan 'lalu', sementara pengulangan nama Yosef menghindari ambiguitas pronomina. Istilah 'kereta-kereta' dan 'semangat ... bangkit kembali' dipilih demi kejelasan, dengan alternatif yang lebih harfiah dicatat dalam catatan kaki.
