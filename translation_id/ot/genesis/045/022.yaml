  text: לְ/כֻלָּ֥/ם נָתַ֛ן לָ/אִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּ/לְ/בִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְ/חָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/022.yaml
  text: To each of them he gave a change of clothes[b][a], but to Benjamin he gave three hundred pieces of silver and five changes of clothes.
translation:
  language: id
  text: Kepada mereka masing-masing ia memberikan satu set pakaian[a], tetapi kepada Benyamin ia memberikan tiga ratus keping perak[b] dan lima set pakaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kepada mereka semua, kepada masing-masing orang, ia memberikan pakaian pengganti.”'
    reason: Ungkapan Ibrani memakai dua bentuk distributif yang saling menguatkan.
  - marker: b
    text: 'Bahasa Ibrani: “tiga ratus perak”; satuan uangnya tidak disebutkan. Karena itu, terjemahan ini memakai “keping perak”, bukan satuan yang lebih khusus seperti “syikal”.'
    reason: Menjelaskan bahwa satuan moneter tertentu tidak terdapat dalam teks sumber.
lexical_decisions:
- source_word: לְכֻלָּם ... לָאִישׁ
  choice: kepada mereka masing-masing
  rationale: Kedua ungkapan itu bersama-sama menegaskan pembagian secara individual kepada seluruh kelompok. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan daya distributif teks Ibrani.
- source_word: נָתַן
  choice: ia memberikan
  rationale: Ini adalah padanan naratif yang lugas untuk tindakan memberi hadiah, tanpa meninggikan ragam bahasa secara tidak perlu.
- source_word: חֲלִפוֹת שְׂמָלֹת
  choice: set pakaian
  rationale: Ungkapan ini menunjuk pada pakaian pengganti atau seperangkat pakaian. 'Set pakaian' terdengar alami dan memungkinkan pembedaan yang jelas antara satu set bagi tiap orang dan lima set bagi Benyamin.
- source_word: וּלְבִנְיָמִן
  choice: tetapi kepada Benyamin
  rationale: Walaupun ו dapat berarti 'dan', konteksnya memperlawankan pemberian umum kepada para saudara dengan pemberian istimewa kepada Benyamin; 'tetapi' menyatakan kontras tersebut secara alami.
- source_word: שְׁלֹשׁ מֵאוֹת כֶּסֶף
  choice: tiga ratus keping perak
  rationale: Teks Ibrani secara harfiah hanya menyebut 'tiga ratus perak' tanpa menyatakan satuan tertentu. 'Keping perak' menyampaikan fungsi moneternya tanpa menambahkan satuan seperti syikal.
- source_word: וְחָמֵשׁ חֲלִפֹת שְׂמָלֹת
  choice: dan lima set pakaian
  rationale: Ungkapan pakaian diterjemahkan secara konsisten, sementara bilangan lima dipertahankan secara langsung.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. Pengulangan 'ia memberikan' dipertahankan untuk mencerminkan kesejajaran dan kontras antarklausa. Istilah 'set pakaian' dipilih agar mudah dipahami pembaca umum.
