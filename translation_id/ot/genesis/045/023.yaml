  to: 'Ia mengirimkan kepada ayahnya barang-barang berikut: sepuluh ekor keledai yang membawa sebagian dari barang-barang terbaik Mesir[a], dan sepuluh ekor keledai betina yang membawa biji-bijian, roti, dan bekal bagi ayahnya untuk perjalanan.'
  rationale: Revisi mengganti "gandum" dengan "biji-bijian" untuk mempertahankan keluasan בָּר, dan memperhalus pengantar serta frasa untuk מִטּוּב מִצְרָיִם tanpa mengubah makna atau tingkat kepastian teks sumber. Penanda catatan kaki tetap ditempatkan pada frasa yang diterangkan.
