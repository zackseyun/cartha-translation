base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/023.yaml
  text: 'And to his father he sent this: ten donkeys carrying some of the best things of Egypt[a], and ten female donkeys carrying grain and bread and provisions for his father for the journey.'
translation:
  language: id
  text: 'Ia mengirimkan kepada ayahnya barang-barang berikut: sepuluh ekor keledai yang membawa sebagian dari barang-barang terbaik Mesir[a], dan sepuluh ekor keledai betina yang membawa biji-bijian, roti, dan bekal bagi ayahnya untuk perjalanan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari yang terbaik dari Mesir” atau “dari kelimpahan Mesir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזֹאת
  choice: ini
  rationale: Ungkapan resumtif ini memperkenalkan daftar barang yang dikirim; 'ini' mempertahankan bentuk sumber dan tetap alami dalam bahasa Indonesia.
- source_word: חֲמֹרִים
  choice: keledai
  rationale: Padanan umum dan modern; istilah pertama tidak perlu dibuat lebih spesifik daripada teks sumber.
- source_word: נֹשְׂאִים
  choice: yang membawa
  rationale: Partisip Qal menggambarkan apa yang diangkut hewan-hewan itu tanpa menambahkan gagasan bahwa muatan tersebut memenuhi kapasitasnya.
- source_word: מִטּוּב מִצְרָיִם
  choice: sebagian dari segala yang terbaik dari Mesir
  rationale: Mempertahankan nuansa partitif מִן serta keluasan makna טוּב sebagai hal-hal baik, hasil unggulan, atau kelimpahan Mesir tanpa membatasinya pada jenis barang tertentu.
- source_word: אֲתֹנֹת
  choice: keledai betina
  rationale: Teks Ibrani secara khusus memakai bentuk yang menunjuk keledai betina, berbeda dari istilah umum sebelumnya.
- source_word: בָּר
  choice: gandum
  rationale: Dalam konteks persediaan pangan, 'gandum' merupakan padanan Indonesia yang alami bagi biji-bijian pangan, meski istilah Ibraninya dapat bersifat lebih umum.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna biasa kata ini cocok dalam daftar bekal dan dipertahankan tanpa digeneralisasi menjadi 'makanan'.
- source_word: מָזוֹן
  choice: bekal
  rationale: Dalam konteks perjalanan, 'bekal' secara alami menyampaikan persediaan makanan dan membedakannya dari roti yang sudah disebut.
- source_word: לַדָּרֶךְ
  choice: untuk perjalanan
  rationale: Padanan idiomatis yang jelas bagi tujuan persediaan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dipertahankan dekat dengan teks Ibrani, sedangkan penanda penggolong 'ekor' dipakai secara alami untuk hewan. Ungkapan 'segala yang terbaik' dibiarkan cukup luas agar tidak menentukan apakah yang dimaksud khusus hasil bumi, barang, atau kelimpahan Mesir secara umum.
