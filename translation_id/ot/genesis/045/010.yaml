base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/010.yaml
  text: You shall live in the land of Goshen, and you shall be near me—you and your sons and your grandsons, and your flocks and your herds and all that you have.
translation:
  language: id
  text: Engkau akan tinggal di tanah Gosyen dan berada dekat denganku—engkau, para putramu, para cucu lelakimu, ternak kambing dombamu, ternak sapimu, dan segala milikmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: Engkau akan tinggal
  rationale: Kata kerja ישׁב dalam konteks ini menyatakan menetap atau berdiam di suatu wilayah. 'Tinggal' alami dalam bahasa Indonesia modern dan tetap menyampaikan tempat tinggal yang menetap.
- source_word: בְאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. 'Tanah Gosyen' mempertahankan bentuk geografis teks Ibrani dan nama tempatnya.
- source_word: וְהָיִיתָ קָרוֹב אֵלַי
  choice: dan berada dekat denganku
  rationale: Konstruksi היה dengan קָרוֹב menyatakan keadaan berada dalam jarak dekat. Pilihan ini wajar dan mempertahankan kedekatan pribadi yang dijanjikan Yusuf.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina mandiri ini memberi penegasan. Tanda pisah dan penyebutan ulang 'engkau' mempertahankan peralihan emfatis menuju daftar orang dan harta yang akan tinggal dekat Yusuf.
- source_word: וּבָנֶיךָ
  choice: anak-anakmu
  rationale: בנים dapat menunjuk anak-anak laki-laki, tetapi dalam bahasa Indonesia 'anak-anakmu' adalah padanan alami dalam daftar keluarga dan tidak mengharuskan penambahan informasi yang tidak dinyatakan secara idiomatis.
- source_word: וּבְנֵי בָנֶיךָ
  choice: cucu-cucumu
  rationale: Ungkapan harfiahnya ialah 'anak-anak dari anak-anakmu'. 'Cucu-cucumu' menyampaikan hubungan generasi secara alami tanpa mengubah maksud konteks.
- source_word: וְצֹאנְךָ
  choice: kawanan kambing dombamu
  rationale: צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing. 'Kawanan kambing domba' lebih jelas bagi pembaca Indonesia daripada 'kawananmu' saja dan membedakannya dari ternak besar.
- source_word: וּבְקָרְךָ
  choice: kawanan sapimu
  rationale: בקר menunjuk ternak besar, khususnya sapi. 'Kawanan sapimu' mempertahankan pembedaan dengan צֹאן dan terdengar alami.
- source_word: וְכָל אֲשֶׁר לָךְ
  choice: dan segala milikmu
  rationale: Ungkapan ini mencakup semua yang dimiliki Yakub. 'Segala milikmu' ringkas, jelas, dan menyeluruh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'engkau' dipakai karena Yusuf berbicara langsung kepada ayahnya dalam konteks sastra Alkitab. Tanda pisah mempertahankan penegasan pronomina Ibrani sebelum daftar keluarga dan harta.
