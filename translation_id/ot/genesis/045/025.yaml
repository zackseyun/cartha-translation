  text: So they went up from Egypt and came to the land of Canaan, to Jacob their father.
translation:
  language: id
  text: Lalu mereka berangkat dari Mesir dan tiba di tanah Kanaan, lalu datang kepada Yakub, ayah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: mereka berangkat
  rationale: Secara harfiah עלה berarti ‘naik’. Dalam rumus perjalanan dari Mesir menuju Kanaan, unsur arah ‘naik’ tersirat, tetapi dalam bahasa Indonesia modern ‘berangkat dari Mesir’ lebih alami dan tetap menyampaikan gerak perjalanan tanpa menambahkan rincian yang tidak ada.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Preposisi מִן menyatakan sumber atau titik keberangkatan.
- source_word: וַיָּבֹאוּ
  choice: tiba
  rationale: בוא dapat berarti ‘datang’, ‘masuk’, atau ‘tiba’. Dalam urutan perjalanan ini, ‘tiba’ merupakan padanan Indonesia yang alami dan jelas.
- source_word: אֶרֶץ כְּנַעַן
  choice: tanah Kanaan
  rationale: Frasa konstruksi ini secara eksplisit memuat אֶרֶץ, ‘tanah/negeri’. ‘Tanah Kanaan’ mempertahankan bentuk ungkapan Ibrani dan merupakan sebutan Alkitabiah yang lazim dalam bahasa Indonesia.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah menuju seseorang; ‘kepada’ mempertahankan hubungan langsung dengan Yakub.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi diterjemahkan menurut bentuk baku bahasa Indonesia.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Kata tersebut berarti ‘ayah mereka’; dalam konteks ini Yakub adalah ayah langsung saudara-saudara Yusuf.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan urutan narasi Ibrani. ‘Berangkat’ dipilih daripada terjemahan harfiah ‘naik’ agar alami bagi pembaca umum, sedangkan ‘tanah Kanaan’ mempertahankan unsur leksikal אֶרֶץ.
