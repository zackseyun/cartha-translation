  text: וְ/עֵ֣ינְ/כֶ֔ם אַל תָּחֹ֖ס עַל כְּלֵי/כֶ֑ם כִּי ט֛וּב כָּל אֶ֥רֶץ מִצְרַ֖יִם לָ/כֶ֥ם הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/020.yaml
  text: And do not let your eye spare your belongings[b][a], for all the best of the land of Egypt is yours.
translation:
  language: id
  text: Jangan khawatir mengenai barang-barang kalian,[a] sebab segala yang terbaik dari seluruh tanah Mesir adalah milik kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah mata kalian merasa sayang terhadap barang-barang kalian”; maksudnya, jangan menyesal atau khawatir karena harus meninggalkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵינְכֶם אַל־תָּחֹס
  choice: Jangan khawatir
  rationale: Ungkapan harfiah ‘janganlah mata kalian merasa sayang’ menyatakan agar mereka tidak menyesal atau mencemaskan barang yang ditinggalkan. Terjemahan idiomatis ini menyampaikan maksudnya secara wajar dalam bahasa Indonesia, sedangkan citra Ibraninya dipertahankan dalam catatan kaki.
- source_word: עַל־כְּלֵיכֶם
  choice: mengenai barang-barang kalian
  rationale: כְּלִי dapat berarti perkakas, wadah, barang, atau harta benda. Dalam konteks perpindahan rumah tangga, ‘barang-barang’ cukup luas, alami, dan tidak terlalu menafsirkan.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya; ‘sebab’ sesuai dengan ragam bahasa yang bermartabat dan jelas.
- source_word: טוּב כָּל־אֶרֶץ מִצְרַיִם
  choice: segala yang terbaik dari seluruh tanah Mesir
  rationale: טוּב di sini menunjuk pada segala sesuatu yang baik atau terbaik yang dihasilkan dan disediakan Mesir. Rumusan ini mempertahankan cakupan כָּל dan hubungan dengan seluruh tanah Mesir tanpa menjadikannya konsep abstrak.
- source_word: לָכֶם הוּא
  choice: adalah milik kalian
  rationale: Konstruksi ל dengan pronomina dan הוּא menegaskan bahwa yang terbaik dari Mesir tersedia bagi atau menjadi milik mereka; ‘adalah milik kalian’ menyampaikan penegasan posesif tersebut.
