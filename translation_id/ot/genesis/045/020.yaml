translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’, selaras dengan sufiks orang kedua jamak dalam bahasa Ibrani. Ungkapan idiomatis dipakai dalam teks utama agar alami, sementara citra ‘mata’ dari bahasa Ibrani dicatat dalam catatan kaki.
