  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak. Tanda pisah membantu mempertahankan sisipan tentang Benyamin tanpa mengaburkan klausa utama.
