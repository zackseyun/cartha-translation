  text: And look[a], your eyes see—and the eyes of my brother Benjamin—that it is my mouth that is speaking to you.
translation:
  language: id
  text: Lihatlah[a], kalian melihat dengan mata sendiri—demikian juga Benyamin, saudaraku—bahwa mulutku sendirilah yang sedang berbicara kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Dan lihatlah, mata kalian melihat, dan mata Benyamin, saudaraku, bahwa mulutkulah yang berbicara kepada kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Partikel ini mengarahkan perhatian secara tegas. “Lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya penunjuknya.
- source_word: עֵינֵיכֶם רֹאוֹת
  choice: mata kalian sendiri melihat
  rationale: Ungkapan konkret “mata kalian” dipertahankan karena menekankan kesaksian visual langsung; “sendiri” memperjelas penekanan idiomatis tanpa mengganti citra tubuh Ibrani.
- source_word: וְעֵינֵי אָחִי בִנְיָמִין
  choice: juga mata Benyamin, saudaraku
  rationale: Mempertahankan kesejajaran dengan “mata kalian” dan hubungan aposisional bahwa Benyamin adalah saudara Yusuf.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang mereka pastikan melalui penglihatan.
- source_word: פִי
  choice: mulutku sendirilah
  rationale: “Mulutku” mempertahankan ungkapan konkret sumber, yang menegaskan bahwa Yusuf berbicara langsung, bukan melalui penerjemah; partikel “-lah” dan “sendiri” menyampaikan fokus klausa.
- source_word: הַמְדַבֵּר אֲלֵיכֶם
  choice: yang sedang berbicara kepada kalian
  rationale: Bentuk partisipel berartikel menyatakan pihak yang kini berbicara; “sedang” menyampaikan tindakan langsung yang berlangsung.
