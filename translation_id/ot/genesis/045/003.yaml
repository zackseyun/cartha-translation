  text: Then Joseph said to his brothers[a], “I am Joseph. Is my father still alive?” But his brothers could not answer him[b], because they were dismayed at his presence.
translation:
  language: id
  text: Lalu Yusuf berkata kepada saudara-saudaranya, “Akulah Yusuf. Apakah ayahku masih hidup?” Namun, saudara-saudaranya tidak dapat menjawabnya karena mereka sangat terkejut ketika berhadapan dengannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gentar ketika berhadapan dengannya” atau “takut ketika melihatnya.” Ungkapan Ibrani secara harfiah berarti “dari hadapannya” dan menunjukkan reaksi mereka ketika berada di hadapan Yusuf.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” memberi alur naratif yang wajar dalam bahasa Indonesia.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Merujuk kepada saudara-saudara laki-laki Yusuf; bentuk ulang merupakan ungkapan Indonesia yang alami untuk jamak.
- source_word: אֲנִי יוֹסֵף
  choice: Akulah Yusuf
  rationale: Partikel “-lah” menegaskan pengungkapan identitas secara alami tanpa menambah isi pada pernyataan Ibrani.
- source_word: הַעוֹד אָבִי חָי
  choice: Apakah ayahku masih hidup?
  rationale: Mempertahankan pertanyaan tentang berlanjutnya keadaan hidup; “masih hidup” merupakan padanan Indonesia yang langsung dan alami.
- source_word: וְלֹא יָכְלוּ ... לַעֲנוֹת אֹתוֹ
  choice: Namun, ... tidak dapat menjawabnya
  rationale: “Namun” menyatakan kontras dalam konteks, sedangkan “tidak dapat” mencerminkan verba יכל dan ketidakmampuan mereka untuk menjawab.
- source_word: נִבְהֲלוּ
  choice: sangat terkejut
  rationale: Nifal בהל menyatakan keadaan terguncang, gentar, atau takut mendadak. “Sangat terkejut” mempertahankan intensitas tanpa menentukan secara berlebihan bahwa emosi itu semata-mata ketakutan.
- source_word: מִפָּנָיו
  choice: di hadapannya
  rationale: Secara harfiah menunjuk keadaan “dari hadapan/wajahnya”; “di hadapannya” mempertahankan citra kehadiran langsung, sementara catatan kaki menjelaskan nuansa sebab atau reaksi.
