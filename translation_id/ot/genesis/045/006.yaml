  register: Bahasa Indonesia baku, modern, dan lugas. Terjemahan mempertahankan urutan waktu dan gambaran pertanian teks Ibrani, sambil mengungkapkan בְּקֶרֶב הָאָרֶץ secara idiomatis agar tidak disalahpahami sebagai pusat geografis negeri.
