  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי זֶ֛ה שְׁנָתַ֥יִם הָ/רָעָ֖ב בְּ/קֶ֣רֶב הָ/אָ֑רֶץ וְ/עוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין חָרִ֖ישׁ וְ/קָצִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/006.yaml
  text: For these two years the famine has been in the midst of the land[b][a], and there are still five years in which there will be neither plowing nor harvest.
translation:
  language: id
  text: Sebab, sudah dua tahun kelaparan melanda negeri ini, dan masih ada lima tahun lagi tanpa membajak ataupun menuai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan Yusuf tentang alasan Allah mengutusnya mendahului saudara-saudaranya dan menghubungkannya secara alami dengan ayat sebelumnya.
- source_word: זֶה שְׁנָתַיִם
  choice: sudah dua tahun
  rationale: Ungkapan ini menunjuk pada rentang dua tahun yang telah berlangsung sampai saat Yusuf berbicara; bentuk Indonesia ini lebih alami daripada terjemahan harfiah 'dua tahun ini'.
- source_word: הָרָעָב
  choice: kelaparan
  rationale: Menunjuk pada bencana kelaparan tertentu yang sudah dikenal dalam konteks kisah.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: melanda negeri ini
  rationale: Secara idiomatis menyampaikan bahwa kelaparan sedang berlangsung di negeri tempat mereka berada. בְּקֶרֶב secara harfiah berarti 'di tengah', tetapi dalam konteks ini tidak harus menunjuk pusat geografis.
- source_word: וְעוֹד חָמֵשׁ שָׁנִים
  choice: dan masih ada lima tahun lagi
  rationale: Menyatakan bahwa lima tahun tambahan masih tersisa sejak saat pembicaraan.
- source_word: אֲשֶׁר אֵין
  choice: tanpa
  rationale: Merangkum klausa relatif yang menggambarkan keadaan selama lima tahun mendatang secara ringkas dan alami.
- source_word: חָרִישׁ
  choice: membajak
  rationale: Menunjuk kegiatan pengolahan tanah untuk bercocok tanam; bentuk verbal berpasangan alami dengan 'menuai'.
- source_word: קָצִיר
  choice: menuai
  rationale: Menunjuk kegiatan atau masa panen dan mempertahankan kesejajaran tindakan pertanian dengan 'membajak'.
