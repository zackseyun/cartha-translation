  naturalness: Bahasa draf pada dasarnya baku dan mudah dipahami. “Dan janganlah marah kepada diri kalian sendiri” lebih jelas dan lebih paralel daripada menggabungkannya dengan “atau”; “lebih dahulu daripada kalian” menyatakan maksud temporal לִפְנֵיכֶם dengan lebih langsung daripada “mendahului kalian.”
  terminology: “Allah” sesuai untuk אֱלֹהִים dalam konteks ini. “Menjual aku,” “mengutus aku,” dan “memelihara kehidupan” mempertahankan tindakan manusia, tindakan aktif Allah, dan tujuan pemeliharaan hidup tanpa menafsirkan ketegangan teologis tersebut secara doktrinal.
