  text: וְ/עַתָּ֣ה אַל תֵּעָ֣צְב֗וּ וְ/אַל יִ֨חַר֙ בְּ/עֵ֣ינֵי/כֶ֔ם כִּֽי מְכַרְתֶּ֥ם אֹתִ֖/י הֵ֑נָּה כִּ֣י לְ/מִֽחְיָ֔ה שְׁלָחַ֥/נִי אֱלֹהִ֖ים לִ/פְנֵי/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/005.yaml
  text: And now[a], do not be distressed or angry with yourselves because you sold me here[c][b], for God sent me ahead of you to preserve life.
translation:
  language: id
  text: Dan sekarang, janganlah bersedih dan janganlah marah kepada diri kalian sendiri[a] karena kalian telah menjual aku ke sini, sebab Allah telah mengutus aku lebih dahulu daripada kalian untuk memelihara kehidupan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah hal itu menyala di mata kalian,” sebuah ungkapan untuk merasa marah atau tidak senang.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk kelangsungan hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda wacana yang mengalihkan perhatian kepada permohonan Yusuf saat ini; dalam bahasa Indonesia, 'Sekarang' secara wajar menyampaikan daya temporal dan peralihannya.
- source_word: אַל תֵּעָצְבוּ
  choice: janganlah bersedih
  rationale: Kata kerja עצב menyatakan kepedihan atau kesedihan batin. 'Bersedih' alami, jelas, dan tidak melebih-lebihkan emosi yang dimaksud.
- source_word: וְאַל יִחַר בְּעֵינֵיכֶם
  choice: atau marah kepada diri kalian sendiri
  rationale: Ungkapan Ibrani harfiahnya berbicara tentang sesuatu yang 'menyala di mata kalian'. Dalam konteks ini, idiom tersebut menunjuk pada kemarahan atau ketidaksenangan terhadap diri sendiri; terjemahan ini menyampaikan maksudnya dengan bahasa Indonesia yang alami.
- source_word: כִּי מְכַרְתֶּם אֹתִי הֵנָּה
  choice: karena kalian telah menjual aku ke sini
  rationale: כִּי memberi alasan bagi larangan sebelumnya, sedangkan הֵנָּה bersifat deiktis, 'ke sini'. Bentuk 'telah menjual' menandai tindakan lampau yang akibatnya masih nyata.
- source_word: לְמִחְיָה
  choice: untuk memelihara kehidupan
  rationale: Nomina מִחְיָה menunjuk pada pemeliharaan hidup atau kelangsungan hidup. Ungkapan ini mempertahankan cakupan yang tidak secara eksplisit membatasi hidup siapa yang dipelihara.
- source_word: שְׁלָחַנִי אֱלֹהִים
  choice: Allah mengutus aku
  rationale: Menerjemahkan tindakan ilahi secara aktif dan langsung sebagaimana dinyatakan teks Ibrani, tanpa mengubahnya menjadi sekadar izin ilahi.
- source_word: לִפְנֵיכֶם
  choice: mendahului kalian
  rationale: 'Menyampaikan prioritas temporal dan posisi: Yusuf diutus lebih dahulu sebelum saudara-saudaranya tiba.'
theological_decisions:
- issue: Penyelenggaraan ilahi dan tanggung jawab manusia
  choice: Mempertahankan baik tindakan saudara-saudara Yusuf, 'kalian telah menjual aku', maupun tindakan Allah, 'Allah mengutus aku', tanpa melunakkan salah satunya.
  alternative: Menggambarkan Allah hanya mengizinkan peristiwa itu, atau mengurangi tanggung jawab saudara-saudara Yusuf dengan mengatakan bahwa mereka sekadar menyuruh Yusuf pergi.
  rationale: Teks Ibrani dengan sengaja menyandingkan tindakan manusia dan maksud aktif Allah. Terjemahan mempertahankan ketegangan teologis itu tanpa mencoba menyelesaikannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina jamak 'kalian' dipakai karena Yusuf berbicara kepada saudara-saudaranya. Struktur dua kalimat menghindari kalimat yang terlalu panjang sekaligus mempertahankan hubungan alasan melalui 'Sebab'.
