  to: Dan sekarang, janganlah bersedih dan janganlah marah kepada diri kalian sendiri[a] karena kalian telah menjual aku ke sini, sebab Allah telah mengutus aku lebih dahulu daripada kalian untuk memelihara kehidupan[b].
