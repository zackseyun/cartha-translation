  text: וַ/יְשַׁלַּ֥ח אֶת אֶחָ֖י/ו וַ/יֵּלֵ֑כוּ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַֽל תִּרְגְּז֖וּ בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/024.yaml
  text: Then he sent his brothers away[a], and they departed; and he said to them, “Do not quarrel on the way.”
translation:
  language: id
  text: Lalu Yusuf menyuruh saudara-saudaranya berangkat, dan mereka pun pergi. Ia berkata kepada mereka, “Jangan bertengkar di jalan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan gelisah,” “Jangan marah,” atau “Jangan takut selama perjalanan.” Kata kerja Ibrani ini dapat menunjuk pada berbagai jenis gejolak emosi; “bertengkar” sesuai dengan konteks langsung, yaitu saudara-saudara Yusuf bepergian bersama setelah Yusuf menyatakan siapa dirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: menyuruh ... berangkat
  rationale: Bentuk piel dari שׁלח di sini menyatakan bahwa Yusuf melepas mereka pergi dari hadapannya. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan keberangkatan yang langsung disebut sesudahnya.
- source_word: אֶת־אֶחָיו
  choice: saudara-saudaranya
  rationale: Istilah kekerabatan harfiah ini merujuk kepada saudara-saudara laki-laki Yusuf dalam konteks narasi.
- source_word: וַיֵּלֵכוּ
  choice: mereka pun pergi
  rationale: הלך berarti pergi atau berjalan; dalam urutan ini, terjemahan tersebut menyampaikan gerak keberangkatan secara alami, sedangkan 'pun' menandai terlaksananya tindakan setelah mereka disuruh berangkat.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ia berkata kepada mereka
  rationale: Ini mempertahankan rumusan ujaran Ibrani yang lazim secara jelas dan wajar.
- source_word: אַל
  choice: Jangan
  rationale: Partikel negatif ini bersama bentuk verba berikutnya menyatakan larangan.
- source_word: תִּרְגְּזוּ
  choice: bertengkar
  rationale: רגז dapat menunjuk pada kegelisahan, gemetar, kemarahan, atau gangguan emosi. Dalam konteks saudara-saudara yang pulang bersama setelah pengungkapan Yusuf, 'bertengkar' paling wajar menggambarkan peringatan agar mereka tidak saling menyalahkan, sementara keluasan maknanya dipertahankan dalam catatan kaki.
- source_word: בַּדָּרֶךְ
  choice: di jalan
  rationale: דרך di sini mengacu pada perjalanan pulang menuju Kanaan; 'di jalan' ringkas, alami, dan dekat dengan bentuk sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Nama 'Yusuf' dipakai untuk memperjelas subjek pada awal ayat karena bahasa Indonesia tidak membedakan gender dalam pronomina, sedangkan konteks Ibrani dengan jelas menunjuk kepadanya. Penanda catatan kaki ditempatkan sesudah kalimat yang memuat istilah ambigu.
