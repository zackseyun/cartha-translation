base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/007.yaml
  text: And God sent me ahead of you to preserve for you a remnant in the land[b][a], and to keep you alive by a great deliverance.
translation:
  language: id
  text: Allah mengutus aku mendahului kalian untuk menyediakan bagi kalian suatu sisa di negeri itu dan untuk memelihara hidup kalian melalui suatu kelepasan besar.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menyediakan bagi kalian orang-orang yang selamat di negeri itu,” atau “untuk menyediakan kelanjutan keturunan bagi kalian di negeri itu.” Kata Ibrani שְׁאֵרִית dapat berarti sesuatu atau orang-orang yang tersisa, para penyintas, atau keturunan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan untuk memelihara hidup kalian demi suatu kelepasan besar.” Ungkapan Ibrani לִפְלֵיטָה גְּדֹלָה dapat menekankan tindakan kelepasan/penyelamatan atau hasilnya berupa banyak penyintas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֵנִי
  choice: mengutus aku
  rationale: Bentuk wayyiqtol dari שׁלח melanjutkan kisah lampau; 'mengutus aku' wajar dan mempertahankan gagasan pengutusan.
- source_word: לִפְנֵיכֶם
  choice: mendahului kalian
  rationale: Ungkapan harfiahnya 'di hadapan kalian', tetapi konteksnya menekankan bahwa Yusuf tiba lebih dahulu di Mesir.
- source_word: לָשׂוּם לָכֶם שְׁאֵרִית
  choice: untuk mempertahankan bagi kalian suatu umat yang tersisa
  rationale: שׂוּם secara harfiah berarti menaruh atau menetapkan, tetapi bersama שְׁאֵרִית di sini menyatakan pengadaan atau pemeliharaan kelompok yang tetap hidup. 'Umat yang tersisa' lebih mudah dipahami daripada istilah teknis dan tetap menjaga motif sisa.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: אֶרֶץ di sini paling wajar merujuk pada negeri tempat mereka dipelihara, yakni Mesir; 'ini' merupakan penjelasan kontekstual yang alami dalam bahasa Indonesia.
- source_word: וּלְהַחֲיוֹת לָכֶם
  choice: dan untuk memelihara hidup kalian
  rationale: Bentuk Hifil dari חיה berarti membuat atau membiarkan tetap hidup; pilihan ini alami sekaligus dekat dengan makna sumber.
- source_word: לִפְלֵיטָה גְּדֹלָה
  choice: sehingga banyak orang dapat diselamatkan
  rationale: פְּלֵיטָה dapat menunjuk pada penyelamatan maupun orang-orang yang lolos. Rumusan utama membaca גְּדֹלָה sebagai besarnya jumlah hasil penyelamatan, sambil mencatat alternatif peristiwa penyelamatan.
theological_decisions:
- issue: Apakah שְׁאֵרִית menunjuk pada 'sisa', 'orang-orang yang selamat', atau 'keturunan'
  choice: suatu umat yang tersisa
  alternative: orang-orang yang selamat; keturunan
  rationale: Pilihan ini menjaga gema leksikal konsep 'sisa' dalam Alkitab tanpa menjadikannya istilah denominatif; catatan kaki mempertahankan kemungkinan kontekstual lainnya.
- issue: Apakah לִפְלֵיטָה גְּדֹלָה menekankan tindakan penyelamatan atau banyaknya orang yang selamat
  choice: sehingga banyak orang dapat diselamatkan
  alternative: melalui suatu penyelamatan besar; sehingga terjadi suatu kelepasan besar
  rationale: Nomina פְּלֵיטָה dapat bersifat kolektif dan menunjuk kepada orang-orang yang lolos, sedangkan ל dapat menyatakan hasil atau tujuan. Karena konstruksinya ambigu, alternatif yang menekankan peristiwa penyelamatan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai karena sapaan Ibrani berbentuk jamak dan konteksnya adalah Yusuf berbicara kepada saudara-saudaranya. Struktur tujuan ganda dipertahankan, sedangkan ambiguitas dua nomina utama dijaga melalui catatan kaki.
