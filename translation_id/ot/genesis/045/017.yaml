  yaml_path: translation/ot/genesis/045/017.yaml
  text: 'Then Pharaoh said to Joseph[a], “Tell your brothers, ‘Do this: load your beasts and go[b]; return to the land of Canaan.’”'
translation:
  language: id
  text: 'Lalu Firaun berkata kepada Yusuf, “Katakan kepada saudara-saudaramu, ‘Lakukanlah ini: muatilah hewan-hewan kalian. Berangkatlah, lalu pulanglah ke tanah Kanaan.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw konsekutif melanjutkan alur narasi; “lalu” menyatakan urutan secara wajar dalam bahasa Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: אֱמֹר אֶל אַחֶיךָ
  choice: Katakan kepada saudara-saudaramu
  rationale: Mempertahankan perintah kepada Yusuf untuk menyampaikan perkataan itu kepada saudara-saudaranya.
- source_word: זֹאת עֲשׂוּ
  choice: Lakukanlah ini
  rationale: Padanan langsung dan alami bagi demonstrativa yang diikuti imperatif jamak.
- source_word: טַעֲנוּ אֶת־בְּעִירְכֶם
  choice: muatilah hewan-hewan kalian
  rationale: בְּעִיר menunjuk pada hewan piaraan yang dapat dimuati; terjemahan ini mempertahankan cakupan leksikal tanpa mempersempitnya menjadi jenis hewan tertentu.
- source_word: וּלְכוּ בֹאוּ
  choice: lalu berangkatlah dan pergilah
  rationale: Kedua imperatif dipertahankan sebagai tindakan berangkat dan menuju tempat tujuan, tetapi dirangkai secara alami dalam bahasa Indonesia.
- source_word: אַרְצָה כְּנָעַן
  choice: ke tanah Kanaan
  rationale: Akhiran direktif pada אֶרֶץ menyatakan arah, sedangkan “tanah Kanaan” mempertahankan nomina eksplisit dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif dengan -lah menjaga nada perintah tanpa terdengar kasar; bentuk jamak “kalian” memperjelas bahwa perintah ditujukan kepada semua saudara Yusuf.
