  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד יוֹסֵ֥ף בְּנִ֖/י חָ֑י אֵֽלְכָ֥ה וְ/אֶרְאֶ֖/נּוּ בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/045/028.yaml
  text: And Israel said[a], “Enough! Joseph my son is still alive. I will go and see him before I die.”
translation:
  language: id
  text: Lalu Israel berkata[a], “Cukup! Yusuf, anakku, masih hidup. Aku akan pergi dan melihatnya sebelum aku mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sudah cukup.” Kata Ibrani רַב di sini merupakan seruan yang menyatakan kecukupan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia dan tidak menambahkan hubungan sebab-akibat.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani secara eksplisit memakai nama Israel, bukan Yakub.
- source_word: רַב
  choice: Cukup!
  rationale: Dalam konteks seruan ini, kata tersebut menyatakan kecukupan dan menampilkan reaksi emosional Israel secara ringkas.
- source_word: עוֹד
  choice: masih
  rationale: Bersama חָי, kata ini menunjukkan bahwa Yusuf tetap hidup.
- source_word: יוֹסֵף בְּנִי
  choice: Yusuf, anakku
  rationale: Mempertahankan nama dan penekanan hubungan pribadi; tanda koma membuat aposisi ini alami dalam bahasa Indonesia.
- source_word: חָי
  choice: hidup
  rationale: Padanan predikatif yang langsung dan lazim dalam bahasa Indonesia.
- source_word: אֵלְכָה
  choice: Aku akan pergi
  rationale: Bentuk kohortatif menyatakan tekad atau niat kuat tanpa perlu menambahkan unsur kewajiban.
- source_word: וְאֶרְאֶנּוּ
  choice: dan melihatnya
  rationale: Menerjemahkan verba melihat beserta sufiks orang ketiga maskulin tunggal secara langsung dan alami.
- source_word: בְּטֶרֶם
  choice: sebelum
  rationale: Padanan temporal yang jelas untuk tindakan yang mendahului kematian Israel.
- source_word: אָמֽוּת
  choice: aku mati
  rationale: Menyampaikan bentuk verba orang pertama secara lugas dalam anak kalimat temporal.
