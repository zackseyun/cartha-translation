  yaml_path: translation/ot/genesis/045/013.yaml
  text: And tell my father about all my honor in Egypt and everything you have seen[b][a]. Hurry and bring my father down here.
translation:
  language: id
  text: Ceritakanlah kepada ayahku tentang segala kehormatanku di Mesir dan segala sesuatu yang telah kalian lihat.[a] Bersegeralah dan bawalah ayahku turun ke sini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala kemuliaanku di Mesir.” Kata Ibrani כָּבוֹד dapat berarti kehormatan, kemuliaan, atau kemegahan; di sini kata itu menunjuk pada kedudukan tinggi Yusuf di Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגַּדְתֶּם
  choice: Ceritakanlah
  rationale: Bentuk hifil dari נגד berarti memberitahukan atau menceritakan. Dalam konteks ini, “ceritakanlah” alami untuk permintaan Yusuf agar saudara-saudaranya menyampaikan keadaan dirinya kepada ayah mereka.
- source_word: כָּל כְּבוֹדִי
  choice: segala kehormatanku
  rationale: כבוד dapat berarti kehormatan, kemuliaan, atau kemegahan. Di lingkungan istana Mesir, frasa ini terutama menunjuk pada kedudukan tinggi dan martabat Yusuf; “kehormatan” mempertahankan makna itu tanpa memberi kesan khusus tentang kemuliaan ilahi.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Ungkapan lokatif langsung dan wajar dalam bahasa Indonesia.
- source_word: כָּל אֲשֶׁר רְאִיתֶם
  choice: segala sesuatu yang telah kalian lihat
  rationale: Ungkapan ini mencakup seluruh bukti nyata yang disaksikan saudara-saudara Yusuf. “Kalian” tepat karena yang disapa jamak.
- source_word: מִהַרְתֶּם
  choice: Cepatlah
  rationale: Dalam konteksnya, bentuk ini menyampaikan perintah mendesak. “Cepatlah” ringkas, alami, dan mempertahankan urgensinya.
- source_word: הוֹרַדְתֶּם
  choice: bawa ... turun
  rationale: Bentuk hifil dari ירד secara harfiah berarti menyebabkan turun. Kata “turun” dipertahankan karena perjalanan menuju Mesir secara konsisten digambarkan demikian dalam Kejadian.
- source_word: הֵנָּה
  choice: ke sini
  rationale: Adverbia penunjuk ini menyatakan tujuan menuju tempat pembicara; “ke sini” paling alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk jamak “kalian” memperjelas bahwa Yusuf berbicara kepada saudara-saudaranya. Partikel -lah mempertahankan corak perintah tanpa terdengar kaku.
