  text: וַ/יְדַבֵּ֥ר אִתָּ֖/ם לֵ/אמֹ֑ר אִם יֵ֣שׁ אֶֽת נַפְשְׁ/כֶ֗ם לִ/קְבֹּ֤ר אֶת מֵתִ/י֙ מִ/לְּ/פָנַ֔/י שְׁמָע֕וּ/נִי וּ/פִגְעוּ לִ֖/י בְּ/עֶפְר֥וֹן בֶּן צֹֽחַר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/008.yaml
  text: And he spoke with them[a], saying, “If it is your desire that I bury my dead out of my sight, listen to me and intercede for me with Ephron son of Zohar,”
translation:
  language: id
  text: Lalu Abraham berbicara kepada mereka dengan berkata, “Jika kalian berkenan agar aku menguburkan orangku yang telah meninggal dari hadapanku, dengarkanlah aku dan ajukanlah permohonan kepada Efron anak Zohar atas namaku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “temuilah Efron anak Zohar untukku.” Kata Ibrani yang dipakai dapat berarti menemui seseorang atau mengajukan permohonan kepadanya bagi pihak lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: Lalu Abraham berbicara kepada mereka, katanya
  rationale: Konstruksi ini memperkenalkan ucapan langsung. Nama Abraham dinyatakan untuk memperjelas subjek dalam bahasa Indonesia berdasarkan konteks langsung, sedangkan 'berbicara kepada mereka' menyampaikan fungsi אִתָּם secara alami.
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: Jika kalian berkenan
  rationale: Ungkapan yang secara harfiah melibatkan 'jiwa/diri kalian' menyatakan kehendak atau kesediaan. 'Berkenan' mempertahankan nada permohonan yang santun.
- source_word: לִקְבֹּר אֶת־מֵתִי
  choice: aku menguburkan orangku yang telah meninggal
  rationale: Subjek orang pertama pada infinitif dijelaskan secara alami. 'Orangku yang telah meninggal' mempertahankan bentuk umum מֵתִי tanpa secara diam-diam menggantinya dengan 'istriku' atau memakai 'jenazahku', yang dalam bahasa Indonesia dapat disalahpahami sebagai jenazah Abraham sendiri.
- source_word: מִלְּפָנַי
  choice: agar tidak lagi berada di hadapanku
  rationale: Secara harfiah berarti 'dari hadapanku'. Dalam konteks pemakaman, frasa ini menyatakan pemindahan orang yang meninggal dari hadapan Abraham, tanpa memberi kesan idiom Indonesia 'menyingkirkan dari pandangan' yang dapat terdengar kasar.
- source_word: שְׁמָעוּנִי
  choice: dengarkanlah aku
  rationale: Imperatif ini meminta para pendengar memperhatikan dan mengabulkan permohonan Abraham; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: mohonlah kepada Efron ... demi aku
  rationale: Dalam konteks perundingan, פגע dengan ב dapat menyatakan pengajuan permohonan kepada seseorang bagi pihak lain. Terjemahan ini mempertahankan unsur permohonan dan perantaraan tanpa mengandaikan bahwa Efron harus dibujuk.
- source_word: בֶּן־צֹחַר
  choice: anak Zohar
  rationale: Padanan transparan untuk hubungan keturunan; nama ditransliterasikan dalam bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang santun dan bermartabat. Bentuk jamak 'kalian' dipilih karena Abraham berbicara kepada sekelompok orang. Ungkapan yang agak tidak biasa 'orangku yang telah meninggal' sengaja dipertahankan untuk mewakili מֵתִי tanpa menambahkan hubungan 'istri' dan tanpa ambiguitas keliru dari 'jenazahku'.
