base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: id
  text: “Bukan begitu, Tuanku.[a] Dengarkanlah saya. Ladang itu saya berikan kepada Tuan; gua yang ada di dalamnya juga saya berikan kepada Tuan. Di hadapan orang-orang sebangsa saya[b], saya memberikannya kepada Tuan. Kuburkanlah jenazahmu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Tidak, Tuanku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di depan mata anak-anak bangsaku,” yaitu secara terbuka di hadapan anggota masyarakat Efron sebagai saksi.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “orang matimu”; dalam konteks ini merujuk kepada Sara.
    reason: translation_clarity
lexical_decisions:
- source_word: לֹא
  choice: Bukan begitu
  rationale: Dalam konteks tawar-menawar ini, kata tersebut menyatakan penolakan atau koreksi yang sopan terhadap usul Abraham, bukan sekadar penyangkalan lepas.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat ini mempertahankan sikap takzim Efron kepada Abraham tanpa menyiratkan bahwa Efron benar-benar seorang hamba.
- source_word: שְׁמָעֵנִי
  choice: Dengarkanlah saya
  rationale: Bentuk imperatif ini merupakan permohonan langsung agar Abraham memperhatikan perkataan Efron; 'saya' selaras dengan suasana perundingan yang santun.
- source_word: הַשָּׂדֶה
  choice: ladang itu
  rationale: Kata שׂדה menunjuk pada bidang tanah terbuka yang sedang dibicarakan; 'ladang' lebih tepat daripada istilah umum 'tanah'.
- source_word: נָתַתִּי לָךְ / נְתַתִּיהָ לָךְ
  choice: saya berikan kepada Tuan
  rationale: 'Bentuk perfektif berfungsi secara performatif: melalui pernyataan ini Efron menyatakan pemberian atau penyerahan saat itu juga.'
- source_word: הַמְּעָרָה אֲשֶׁר בּוֹ
  choice: gua yang ada di dalamnya
  rationale: 'Terjemahan ini mempertahankan hubungan tempat secara eksplisit: gua tersebut berada di dalam kawasan ladang.'
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: Di hadapan orang-orang sebangsa saya
  rationale: Ungkapan harfiah 'di depan mata anak-anak bangsaku' berarti tindakan itu dilakukan secara terbuka di hadapan anggota masyarakat Efron sebagai saksi.
- source_word: קְבֹר מֵתֶךָ
  choice: Kuburkanlah jenazah anggota keluarga Tuan
  rationale: Ungkapan Ibrani secara harfiah berarti 'kuburkanlah orang matimu'. Bahasa Indonesia memerlukan perumusan yang menghindari kesan bahwa Abraham harus menguburkan jenazahnya sendiri; tambahan 'anggota keluarga' menyampaikan relasi yang tersirat tanpa menyebut Sara secara eksplisit.
