revisions:
- from: “Bukan begitu, Tuanku.[a] Dengarkanlah saya. Ladang itu saya berikan kepada Tuan; gua yang ada di dalamnya juga saya berikan kepada Tuan. Di hadapan orang-orang sebangsa saya[b], saya memberikannya kepada Tuan. Kuburkanlah jenazah anggota keluarga Tuan.[c]”
  to: “Bukan begitu, Tuanku.[a] Dengarkanlah saya. Ladang itu saya berikan kepada Tuan; gua yang ada di dalamnya juga saya berikan kepada Tuan. Di hadapan orang-orang sebangsa saya[b], saya memberikannya kepada Tuan. Kuburkanlah jenazahmu.[c]”
  rationale: Revisi terbatas pada perintah penutup dan catatan kakinya. "Jenazahmu" menyampaikan idiom kepunyaan dalam teks sumber secara alami dalam bahasa Indonesia tanpa menambahkan relasi keluarga yang tidak dinyatakan. Semua penanda catatan kaki tetap terpasang pada unsur yang dijelaskan.
