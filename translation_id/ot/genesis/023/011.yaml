    issue: Tambahan "anggota keluarga" pada terjemahan קְבֹר מֵתֶךָ.
    rationale: Teks Ibrani hanya memakai nomina tunggal "orang matimu" dan tidak menyebut hubungan keluarga. Konteks mengidentifikasinya sebagai Sara, tetapi terjemahan tidak boleh memperluasnya menjadi kategori "anggota keluarga."
  - severity: low
    issue: Catatan kaki c menyatakan rujukan kepada "orang yang meninggal dari keluarga Abraham."
    rationale: Penjelasan ini mengulang perluasan yang tidak ada dalam teks. Catatan sebaiknya menyebut bentuk harfiah dan, bila diperlukan, rujukan kontekstual kepada Sara.
