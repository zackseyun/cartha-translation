translation_notes:
  register: Bahasa Indonesia baku, modern, dan santun. Sapaan 'Tuanku' mempertahankan penghormatan sosial dalam perundingan, sedangkan 'saya' dan 'Tuan' membuat dialog tetap alami. Pengulangan verba 'saya berikan' dipertahankan karena menonjolkan deklarasi penyerahan ladang dan gua di hadapan para saksi.
