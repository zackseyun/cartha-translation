  text: And Ephron answered Abraham, saying to him,
translation:
  language: id
  text: Lalu Efron menjawab Abraham dan berkata kepadanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: Lalu ... menjawab
  rationale: Bentuk wayyiqtol dari ענה melanjutkan rangkaian narasi dan memperkenalkan tanggapan dalam dialog. “Lalu ... menjawab” wajar dalam bahasa Indonesia serta mempertahankan urutan percakapan.
- source_word: עֶפְרוֹן
  choice: Efron
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֶת אַבְרָהָם
  choice: Abraham
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; Abraham adalah orang yang dijawab oleh Efron. Bentuk nama yang lazim dalam bahasa Indonesia dipertahankan.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif לֵאמֹר memperkenalkan ucapan sesudah verba menjawab. “Katanya” mempertahankan fungsi pengantar tuturan secara alami dan bermartabat dalam narasi Indonesia.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina bersufiks ini merujuk kembali kepada Abraham. “Kepadanya” mempertahankan bentuk pronominal tanpa menggantinya dengan pengulangan nama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernuansa naratif. Susunan “menjawab Abraham” dipertahankan sebagai bentuk transitif yang wajar, sedangkan “katanya kepadanya” mencerminkan pengulangan struktural teks Ibrani meskipun agak lebih formal daripada percakapan sehari-hari.
