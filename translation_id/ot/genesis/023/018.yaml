  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: id
  text: menjadi milik Abraham di hadapan bani Het[a], di hadapan semua orang yang masuk ke gerbang kotanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang Het.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַבְרָהָם
  choice: menjadi milik Abraham
  rationale: Dalam konteks pengesahan transaksi dari ayat sebelumnya, לְ menandai pihak penerima, sedangkan gabungannya dengan לְמִקְנָה paling alami diungkapkan sebagai hasil peralihan hak milik.
- source_word: לְמִקְנָה
  choice: menjadi milik
  rationale: מִקְנָה menunjuk pada sesuatu yang diperoleh sebagai milik; ungkapan ini menyampaikan hasil sah transaksi, bukan hanya tindakan pembelian.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani sekaligus menyatakan bahwa transaksi berlangsung secara terbuka dan disaksikan.
- source_word: בְנֵי חֵת
  choice: bani Het
  rationale: Secara harfiah berarti 'anak-anak Het'; 'bani Het' merupakan sebutan etnis-genealogis yang ringkas dan lazim dalam ragam Alkitab bahasa Indonesia. Padanan kontekstual 'orang Het' dicatat dalam catatan kaki.
- source_word: בְּכֹל בָּאֵי
  choice: di hadapan semua orang yang masuk
  rationale: Frasa ini mencakup seluruh khalayak yang hadir sebagai saksi; 'di hadapan' alami dalam bahasa Indonesia dan tetap dekat dengan fungsi preposisinya.
- source_word: שַׁעַר עִירוֹ
  choice: melalui gerbang kotanya
  rationale: Gerbang kota adalah jalur masuk sekaligus ruang kegiatan publik dan hukum. 'Melalui' membuat hubungan dengan partisipel 'yang masuk' jelas dalam bahasa Indonesia.
