  source_fidelity: 'Teks dengan setia menyampaikan urutan naratif וַיָּקָם, tindakan penghormatan וַיִּשְׁתַּחוּ, serta dua sebutan yang merujuk kepada kelompok setempat: עַם הָאָרֶץ dan בְנֵי־חֵת. “Membungkuk hormat” mempertahankan gestur tanpa secara berlebihan menetapkan bahwa Abraham bersujud penuh. “Penduduk negeri itu” merupakan padanan kontekstual yang wajar bagi ‘orang/bangsa negeri itu.’'
