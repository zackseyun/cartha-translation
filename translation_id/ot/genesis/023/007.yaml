  text: וַ/יָּ֧קָם אַבְרָהָ֛ם וַ/יִּשְׁתַּ֥חוּ לְ/עַם הָ/אָ֖רֶץ לִ/בְנֵי חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: id
  text: Lalu Abraham bangkit dan membungkuk hormat kepada penduduk negeri itu, yaitu keturunan Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Het”; dapat juga diterjemahkan “orang Het.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Lalu Abraham bangkit
  rationale: Bentuk wayyiqtol Qal dari קום menyatakan tindakan bangkit dalam urutan narasi; “lalu” mengungkapkan kesinambungan waw secara alami.
- source_word: וַיִּשְׁתַּחוּ
  choice: membungkuk hormat
  rationale: Bentuk dari שׁחה menyatakan membungkuk rendah sebagai penghormatan. Ungkapan ini mempertahankan gerak jasmani sekaligus fungsi sopan-santunnya tanpa memastikan bahwa Abraham bersujud penuh.
- source_word: לְעַם הָאָרֶץ
  choice: kepada penduduk negeri itu
  rationale: Preposisi ל menandai pihak yang menerima penghormatan. Dalam konteks ini עַם הָאָרֶץ menunjuk penduduk setempat, sehingga terjemahan ini lebih alami daripada ungkapan harfiah “rakyat negeri”.
- source_word: לִבְנֵי חֵת
  choice: yaitu keturunan Het
  rationale: Frasa ini secara harfiah berarti “anak-anak lelaki Het,” tetapi dalam konteks genealogis-etnis berarti keturunan Het. “Yaitu” menunjukkan bahwa frasa kedua menjelaskan siapa penduduk negeri yang dimaksud.
- source_word: חֵת
  choice: Het
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Membungkuk hormat” terdengar alami dan menjaga nuansa tindakan penghormatan; “penduduk negeri itu” menjelaskan idiom Ibrani tanpa menambahkan identitas di luar konteks.
