base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: id
  text: Lalu Abraham mendengarkan Efron[a]. Abraham menimbang perak bagi Efron sebanyak yang telah disebutkannya di hadapan anak-anak Het, yaitu empat ratus syikal perak, menurut timbangan yang berlaku di kalangan para pedagang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Het”; secara harfiah, “anak-anak Het.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang diterima oleh para pedagang.” Frasa Ibrani ini dapat menunjuk pada standar berat atau mutu perak yang berlaku dalam perdagangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: Abraham menyetujui perkataan Efron
  rationale: Idiom שׁמע אל berarti mendengarkan atau mengindahkan. Dalam konteks transaksi, frasa ini menyatakan bahwa Abraham menerima ketentuan harga Efron; bentuk ini alami dalam bahasa Indonesia tanpa menjadikannya formula hukum.
- source_word: וַיִּשְׁקֹל
  choice: menimbang
  rationale: Kata kerja שקל menunjuk pada tindakan menimbang logam pembayaran sebelum adanya uang logam, sehingga detail historisnya dipertahankan.
- source_word: הַכֶּסֶף
  choice: perak
  rationale: כֶּסֶף secara harfiah berarti perak dan di sini digunakan sebagai alat pembayaran; 'perak' mempertahankan bahan serta latar historis transaksi.
- source_word: אֲשֶׁר דִּבֶּר
  choice: sejumlah yang telah disebutkannya
  rationale: דבר pada dasarnya berarti berbicara, tetapi dalam konteks ini menunjuk pada jumlah yang baru saja dinyatakan Efron. 'Disebutkannya' menyampaikan maksud tersebut secara wajar tanpa menambah gagasan tawar-menawar.
- source_word: בְּאָזְנֵי
  choice: di hadapan
  rationale: Ungkapan harfiah 'di telinga' berarti dalam pendengaran orang lain. 'Di hadapan' secara alami menyampaikan bahwa harga itu dinyatakan secara terbuka dan disaksikan.
- source_word: בְנֵי חֵת
  choice: bani Het
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak Het'. 'Bani Het' mempertahankan bentuk genealogis-etnis sumber dan tetap dikenal dalam ragam Alkitab Indonesia; padanan etnis modern dicantumkan dalam catatan kaki.
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: empat ratus syikal perak
  rationale: Terjemahan ini mempertahankan satuan berat kuno dan bahan pembayaran dengan bentuk yang ringkas serta lazim dalam bahasa Indonesia.
- source_word: עֹבֵר לַסֹּחֵר
  choice: menurut timbangan yang berlaku di kalangan para pedagang
  rationale: Ungkapan idiomatis ini kemungkinan menyatakan standar perak yang diterima dalam perdagangan. Terjemahan tersebut jelas dalam bahasa Indonesia sambil mempertahankan nuansa standar komersial; alternatif makna dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Istilah historis 'syikal' dan tindakan menimbang perak dipertahankan. 'Bani Het' menjaga bentuk genealogis sumber, sedangkan catatan kaki memberi padanan etnis yang lebih langsung.
