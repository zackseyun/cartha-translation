base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: id
  text: “Tuanku, dengarkanlah aku. Sebidang tanah seharga empat ratus syikal perak[a]—apalah artinya itu antara aku dan engkau? Kuburkanlah jenazahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “sebidang tanah—empat ratus syikal perak—apalah artinya itu antara aku dan engkau?” Bahasa Ibrani di sini eliptis dan retoris, seolah-olah mengecilkan harga dalam perundingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada Efron, bukan gelar ilahi. Bentuk ini mempertahankan penghormatan sosial kepada lawan bicara tunggal.
- source_word: שְׁמָעֵנִי
  choice: dengarkanlah aku
  rationale: Bentuk imperatif dalam permohonan yang sopan; partikel -lah memberi nada hormat dan wajar dalam bahasa Indonesia.
- source_word: אֶרֶץ
  choice: sebidang tanah
  rationale: Dalam konteks transaksi, kata ini menunjuk pada suatu bidang atau properti tertentu, bukan tanah secara abstrak.
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: seharga empat ratus syikal perak
  rationale: Bahasa Ibrani bersifat eliptis dan menyatakan nilai bidang tanah. Penambahan 'seharga' membuat maksudnya jelas dan alami tanpa menambah isi baru.
- source_word: בֵּינִי וּבֵינְךָ
  choice: antara aku dan engkau
  rationale: Mempertahankan penyebutan eksplisit orang pertama dan kedua tunggal serta nada pribadi dalam perundingan.
- source_word: מַה הִוא
  choice: apalah artinya itu
  rationale: Pertanyaan retoris ini mengecilkan arti jumlah tersebut bagi kedua pihak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fungsi retorisnya.
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: Kuburkanlah orangmu yang mati
  rationale: Mempertahankan imperatif langsung dan kepemilikan orang kedua tunggal. 'Orangmu yang mati' lebih alami daripada ungkapan harfiah 'orang mati milikmu'.
