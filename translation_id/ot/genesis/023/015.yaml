translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan sapaan hormat dan bentuk imperatif berpartikel -lah. Elipsis harga dalam bahasa Ibrani dijelaskan secara ringan melalui 'seharga', sedangkan pertanyaan retoris tetap dipertahankan.
