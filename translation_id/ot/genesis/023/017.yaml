base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: id
  text: Demikianlah ladang Efron di Makhpela, yang terletak di depan Mamre—ladang itu, gua yang ada di dalamnya, dan setiap pohon di ladang itu, di seluruh wilayahnya di sekeliling—dikukuhkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ditetapkan sebagai sah” atau “dialihkan.” Kata kerja Ibrani di sini tampaknya dipakai dalam arti hukum untuk pengesahan properti dalam konteks jual beli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: dikukuhkan
  rationale: 'Dalam konteks transaksi tanah, verba קום berfungsi secara hukum: properti itu diteguhkan atau dinyatakan sah sebagai objek jual beli. “Dikukuhkan” mempertahankan nuansa legal tanpa menambahkan pihak penerima yang baru disebut pada ayat berikutnya.'
- source_word: שְׂדֵה עֶפְרוֹן
  choice: ladang Efron
  rationale: Rangkaian konstruksi Ibrani menyatakan kepunyaan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: בַּמַּכְפֵּלָה
  choice: di Makhpela
  rationale: Nama tempat ditransliterasikan sebagai “Makhpela”; preposisi “di” menyatakan lokasi tanpa menentukan lebih lanjut sifat tempat tersebut.
- source_word: לִפְנֵי מַמְרֵא
  choice: di depan Mamre
  rationale: Terjemahan ini mempertahankan gambaran spasial harfiah לִפְנֵי dan tidak memaksakan arah mata angin yang tidak dinyatakan secara eksplisit.
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: ladang itu, gua yang ada di dalamnya
  rationale: Susunan daftar mempertahankan gaya pemerincian legal teks Ibrani dan memperjelas bahwa gua tersebut termasuk dalam properti.
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: dan setiap pohon di ladang itu
  rationale: כָל dengan nomina tunggal kolektif diterjemahkan secara distributif sebagai “setiap pohon”, sesuai pemerincian menyeluruh dalam dokumen transaksi.
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: dalam seluruh batasnya di sekeliling
  rationale: Ungkapan ini mempertahankan penekanan pada keseluruhan kawasan sampai batas yang mengelilinginya, dengan ragam formal yang cocok bagi uraian properti.
