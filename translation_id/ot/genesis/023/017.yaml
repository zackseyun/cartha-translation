translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada resmi untuk mencerminkan pemerincian legal tentang properti. Tanda pisah mempertahankan struktur aposisi dan daftar dalam bahasa Ibrani. Penanda catatan kaki ditempatkan sesudah “dikukuhkan” karena catatan menjelaskan verba tersebut, bukan nama Makhpela.
