  yaml_path: translation/ot/genesis/023/005.yaml
  text: The sons of Heth answered Abraham[a], saying to him,
translation:
  language: id
  text: Keturunan Het menjawab Abraham[a] dan berkata kepadanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “orang Het.” Secara harfiah: “anak-anak Het.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: menjawab
  rationale: Bentuk wayyiqtol Qal dari ענה melanjutkan alur narasi dan memperkenalkan tanggapan dalam percakapan.
- source_word: בְנֵי חֵת
  choice: Keturunan Het
  rationale: Secara harfiah berarti 'anak-anak Het', tetapi dalam bahasa Indonesia modern ungkapan ini secara wajar menunjuk kepada kelompok yang berasal dari Het; pilihan ini mempertahankan nama pribadi Het tanpa memberi kesan bahwa semuanya adalah anak kandung langsung.
- source_word: אֶת אַבְרָהָם
  choice: Abraham
  rationale: אֶת menandai Abraham sebagai objek langsung tertentu dan tidak diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: kata mereka
  rationale: Infinitif אמר memperkenalkan ucapan langsung. 'Kata mereka' alami dalam narasi Indonesia dan sekaligus menjelaskan bahwa kelompok jamak itulah yang berbicara.
- source_word: לוֹ
  choice: kepadanya
  rationale: Preposisi ל dengan sufiks orang ketiga tunggal maskulin menyatakan pihak yang menjadi tujuan ucapan, yaitu Abraham.
