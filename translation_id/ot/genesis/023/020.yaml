  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: id
  text: Demikianlah ladang itu, beserta gua yang ada di dalamnya, beralih kepada Abraham sebagai milik untuk penguburan dari anak-anak Het.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Het.” Secara harfiah, “anak-anak Het.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ditetapkan bagi Abraham sebagai milik untuk penguburan.” Dalam konteks transaksi ini, verba Ibrani tersebut menunjuk pada pengalihan kepemilikan yang sah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: menjadi milik
  rationale: Dalam konteks hukum transaksi tanah, verba קום dengan tanah sebagai subjek menyatakan bahwa kepemilikan itu ditetapkan atau beralih secara sah. 'Menjadi milik' alami dalam bahasa Indonesia dan tetap menyampaikan hasil hukum transaksi.
- source_word: הַשָּׂדֶה
  choice: ladang itu
  rationale: Padanan langsung dan alami untuk bidang tanah yang dibeli Abraham.
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: dan gua yang ada di dalamnya
  rationale: Mempertahankan klausa relatif serta rujukan pronominal kepada ladang itu.
- source_word: לְאַבְרָהָם
  choice: milik Abraham
  rationale: Lamed menandai Abraham sebagai pihak penerima dan pemilik sah dalam transaksi tersebut.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: sebagai tanah pekuburan
  rationale: אֲחֻזָּה menunjuk pada milik atau tanah pegangan yang sah, sedangkan קָבֶר menyatakan fungsinya untuk penguburan. 'Tanah pekuburan' ringkas, alami, dan mempertahankan unsur properti.
- source_word: מֵאֵת
  choice: yang diperolehnya dari
  rationale: Menandai sumber kepemilikan dalam transaksi; penambahan 'diperolehnya' memperjelas hubungan sintaksis secara alami tanpa mengubah makna.
- source_word: בְּנֵי חֵת
  choice: keturunan Het
  rationale: Secara transparan mempertahankan bentuk genealogis-etnis Ibrani 'anak-anak Het' dalam ungkapan Indonesia yang lebih alami.
