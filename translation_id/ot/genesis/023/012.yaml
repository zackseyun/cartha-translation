  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: id
  text: Lalu Abraham membungkuk di hadapan penduduk negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersujud di hadapan penduduk negeri itu.”
    reason: Alternatif leksikal ini mempertahankan kemungkinan bahwa gerakan fisiknya lebih dalam daripada sekadar membungkuk, tanpa mengartikannya sebagai penyembahan.
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: membungkuk
  rationale: Bentuk verba ini menunjukkan tindakan merendahkan tubuh sebagai penghormatan. Dalam konteks perundingan dengan orang Het, “membungkuk” menyampaikan gerak hormat tanpa menyiratkan penyembahan kepada Allah.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara idiomatis berarti berada atau bertindak di depan dan dalam kehadiran pihak lain; “di hadapan” alami serta tepat dalam bahasa Indonesia.
- source_word: עַם הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada masyarakat setempat yang hadir sebagai pihak dan saksi transaksi. “Penduduk negeri itu” lebih alami daripada terjemahan harfiah “rakyat negeri itu” dan mempertahankan rujukan lokalnya.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada bentuk wayyiqtol meneruskan urutan narasi; “Lalu” menyatakan perkembangan tindakan secara alami dalam bahasa Indonesia modern.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Nama diri ini mengikuti bentuk baku yang lazim dalam tradisi Alkitab bahasa Indonesia.
theological_decisions: []
