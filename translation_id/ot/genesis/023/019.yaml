  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: id
  text: Sesudah itu, Abraham menguburkan Sara, istrinya, di dalam gua di ladang Makhpela, berhadapan dengan Mamre[a] (yaitu Hebron), di tanah Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan Mamre.” Ungkapan Ibrani menunjukkan lokasi yang berada di depan atau berhadapan dengan Mamre.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan ini menjadi peralihan waktu dalam narasi. “Sesudah itu” alami dalam bahasa Indonesia dan mempertahankan urutan kejadian tanpa menambah rincian.
- source_word: קָבַר
  choice: menguburkan
  rationale: Verba qal ini secara langsung berarti menguburkan; bentuk aktif sesuai dengan sintaksis Ibrani dan bahasa Indonesia baku.
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: Sara, istrinya
  rationale: Urutan nama lalu keterangan hubungan mengikuti teks Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: אֶל מְעָרַת
  choice: di dalam gua
  rationale: Walaupun אֶל pada dasarnya dapat berarti “ke/ke dalam,” dalam konteks penguburan bahasa Indonesia secara idiomatis memakai lokasi “di dalam gua.”
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: gua di ladang Makhpela
  rationale: Rangkaian konstruksi menunjukkan hubungan gua dengan ladang. “Gua di ladang Makhpela” jelas dan alami, tanpa memaksakan apakah Makhpela menamai ladang atau kawasan tersebut.
- source_word: הַמַּכְפֵּלָה
  choice: Makhpela
  rationale: Nama tempat ditransliterasikan dengan bentuk Indonesia yang lazim; artikel Ibrani tidak perlu dinyatakan pada nama diri.
- source_word: עַל פְּנֵי מַמְרֵא
  choice: di seberang Mamre
  rationale: Ungkapan spasial ini menunjukkan lokasi di hadapan atau berhadapan dengan Mamre. “Di seberang” mempertahankan hubungan ruang tanpa menetapkan arah mata angin tertentu.
- source_word: הִוא חֶבְרוֹן
  choice: (yaitu Hebron)
  rationale: Frasa ini mengidentifikasi atau menjelaskan lokasi dengan nama Hebron; bentuk dalam kurung merupakan penjelasan geografis yang alami.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Kata אֶרֶץ dipertahankan sebagai “tanah,” sehingga bentuk geografis eksplisit dalam teks Ibrani tetap hadir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk yang umum dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
