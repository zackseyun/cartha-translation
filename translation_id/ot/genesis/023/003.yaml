    issue: “dari sisi jenazah istrinya” untuk מֵעַל פְּנֵי
    rationale: Ungkapan Ibrani secara idiomatis berarti beranjak “dari hadapan/presensi” orang mati itu. “Dari sisi” mungkin dalam konteks, tetapi menambahkan pembatasan posisi yang tidak dinyatakan sumber.
  - severity: low
    issue: “berbicara kepada keturunan Het[a], katanya,”
    rationale: Konstruksi ini kurang mulus dalam bahasa Indonesia modern. Karena לֵאמֹר hanya memperkenalkan isi ujaran pada ayat selanjutnya, “berkata kepada ...:” menyampaikan fungsi wacananya dengan lebih idiomatis.
