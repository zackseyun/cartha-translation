  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: id
  text: 'Kemudian Abraham bangkit dari hadapan jenazah istrinya, lalu berkata kepada keturunan Het[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Het”; secara harfiah, “anak-anak lelaki Het.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: Kemudian ... bangkit
  rationale: Bentuk wayyiqtol memajukan alur cerita; “kemudian” menyatakan urutan naratif secara alami, sedangkan “bangkit” mempertahankan tindakan berdiri dan beranjak.
- source_word: מֵעַל פְּנֵי
  choice: dari sisi
  rationale: Ungkapan ini secara harfiah menunjuk pada beranjak dari hadapan atau dekat seseorang; dalam konteks jenazah, “dari sisi” alami dalam bahasa Indonesia dan tetap menggambarkan Abraham meninggalkan tempatnya di dekat jenazah.
- source_word: מֵתוֹ
  choice: jenazah istrinya
  rationale: Secara harfiah berarti “orang matinya,” dengan akhiran milik orang ketiga maskulin tunggal. Konteks dengan jelas merujuk kepada Sara; “jenazah istrinya” menyampaikan rujukan itu secara wajar dan bermartabat.
- source_word: וַיְדַבֵּר אֶל
  choice: dan berbicara kepada
  rationale: דבר dengan אֶל lazim berarti berbicara kepada seseorang. Pilihan ini juga mempertahankan pembedaan dengan לֵאמֹר yang menyusul.
- source_word: בְּנֵי חֵת
  choice: keturunan Het
  rationale: Ungkapan harfiahnya “anak-anak lelaki Het,” tetapi berfungsi sebagai sebutan bagi kelompok keturunannya. “Keturunan Het” lebih alami daripada “anak-anak Het” dalam bahasa Indonesia dan tidak mengaburkan nama leluhur tersebut.
- source_word: לֵאמֹר
  choice: katanya,
  rationale: Infinitif ini memperkenalkan isi ucapan pada ayat berikutnya. “Katanya,” merupakan penghubung wacana yang alami dalam bahasa Indonesia.
