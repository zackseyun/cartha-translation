  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: id
  text: “Dengarkanlah kami, Tuanku. Engkau adalah seorang pemimpin Allah[a] di tengah-tengah kami. Kuburkanlah orang yang telah meninggal itu di makam terbaik yang kami miliki. Tidak seorang pun dari kami akan menahan makamnya darimu sehingga engkau tidak dapat menguburkan orang yang telah meninggal itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang pemimpin besar di tengah-tengah kami.” Secara harfiah, “seorang pemimpin Allah”; frasa Ibrani ini dapat berfungsi sebagai ungkapan superlatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: Dengarkanlah kami
  rationale: Bentuk imperatif dengan sufiks orang pertama jamak; ungkapan ini menyampaikan permohonan langsung dan tetap wajar dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada Abraham; mempertahankan nuansa penghormatan sosial tanpa menyiratkan bahwa para penutur benar-benar menjadi hambanya.
- source_word: נְשִׂיא אֱלֹהִים
  choice: pemimpin yang dikaruniai Allah
  rationale: Secara harfiah berarti 'pemimpin Allah', tetapi konstruksi dengan אֱלֹהִים dapat menandakan kebesaran luar biasa atau kaitan dengan Allah. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan kemungkinan bahwa kedudukan Abraham dipandang sebagai karunia Allah; alternatif superlatif dicatat dalam catatan kaki.
- source_word: בְּתוֹכֵנוּ
  choice: di tengah-tengah kami
  rationale: Padanan alami yang mempertahankan latar komunal dari pernyataan itu.
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: di makam terbaik yang kami miliki
  rationale: מִבְחַר menyatakan pilihan atau mutu terbaik. Frasa kepemilikan dibuat eksplisit secara wajar untuk menerangkan bentuk jamak posesif Ibrani.
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: Kuburkanlah orangmu yang telah meninggal
  rationale: Dalam konteks ini מֵתֶךָ menunjuk kepada mendiang yang menjadi tanggungan Abraham, yaitu Sara. Terjemahan ini lebih alami dan bermartabat daripada 'orang matimu'.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Tidak seorang pun dari kami
  rationale: Dalam konstruksi negatif distributif, frasa ini berarti bahwa tak satu pun anggota kelompok akan menolak.
- source_word: אֶת־קִבְרוֹ
  choice: makamnya
  rationale: Bentuk tunggal posesif bersifat distributif, yakni makam milik masing-masing orang; 'makam' sesuai dengan konteks tempat penguburan.
- source_word: לֹא יִכְלֶה מִמְּךָ
  choice: tidak ... akan menahan ... darimu
  rationale: כּלה dalam konteks ini bermakna menahan atau menolak memberikan akses; susunan ini mempertahankan unsur formal teks sumber.
- source_word: מִקְּבֹר מֵתֶךָ
  choice: sehingga engkau tidak dapat menguburkan orangmu yang telah meninggal
  rationale: מִן dengan infinitif menyatakan tindakan yang dicegah. Rumusan ini mengungkapkan daya preventif konstruksi tersebut secara jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Makna נְשִׂיא אֱלֹהִים
  choice: pemimpin yang dikaruniai Allah
  alternative: pemimpin yang sangat besar
  rationale: Konstruksi itu dapat dipahami sebagai hubungan dengan Allah atau sebagai idiom superlatif. Teks utama tidak mengubahnya menjadi gelar keagamaan tertentu, sedangkan catatan kaki mempertahankan kemungkinan superlatif.
translation_notes:
  register: Bahasa Indonesia modern, sopan, dan bermartabat. Bentuk -lah dipakai pada permohonan dan perintah agar nada perundingan yang santun tetap terasa. Pengulangan mengenai orang yang meninggal dipertahankan karena terdapat dalam teks Ibrani.
