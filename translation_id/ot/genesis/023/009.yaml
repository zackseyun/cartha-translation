base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: id
  text: Hendaklah ia memberikan kepadaku gua Makhpela[a], miliknya, yang terletak di ujung[b] ladangnya. Dengan harga penuh dalam perak[c], hendaklah ia memberikannya kepadaku di antara kamu sebagai hak milik untuk penguburan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gua di Makhpela.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tepi.” Kata Ibrani ini dapat berarti ujung, tepi, atau bagian terluar dari ladang.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dengan perak penuh,” sebuah ungkapan yang berarti dengan membayar harga penuh dalam perak.'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “sebagai milik untuk tempat penguburan.” Ungkapan Ibrani menekankan hak kepemilikan atas tempat itu, bukan hanya hak untuk menggunakannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: hendaklah ia memberikan
  rationale: Bentuk imperfek dalam konteks permohonan menyatakan permintaan, bukan sekadar masa depan; “hendaklah” mempertahankan daya permohonannya dengan ragam yang bermartabat.
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: gua Makhpela
  rationale: Rangkaian konstruksi dengan nama diri diterjemahkan secara alami; nama Ibrani ditransliterasikan sebagai Makhpela.
- source_word: אֲשֶׁר לוֹ
  choice: yang menjadi miliknya
  rationale: Menyatakan kepemilikan secara jelas dan mempertahankan nuansa hukum dalam perundingan tanah.
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: yang terletak di ujung ladangnya
  rationale: קָצֶה dapat berarti ujung, tepi, atau bagian terluar; “ujung” mempertahankan keluasan makna spasial tanpa penjelasan berlebihan.
- source_word: בְּכֶסֶף מָלֵא
  choice: dengan pembayaran perak sepenuhnya
  rationale: Ungkapan ini menunjuk pada pembayaran penuh dengan perak; terjemahan menghindari kesan bahwa tanah tersebut diminta sebagai pemberian cuma-cuma.
- source_word: יִתְּנֶנָּה
  choice: hendaklah ia menyerahkannya
  rationale: נתן secara harfiah berarti memberi, tetapi dalam transaksi berbayar di sini menunjuk pada penyerahan hak atas properti; “menyerahkan” tetap netral tanpa mengganti kata itu dengan “menjual”.
- source_word: בְּתוֹכְכֶם
  choice: di tengah-tengah kamu
  rationale: Mempertahankan ungkapan komunitas dan kemungkinan nuansa transaksi yang disaksikan serta diakui oleh orang Het.
- source_word: לַאֲחֻזַּת קָבֶר
  choice: menjadi tanah milik untuk pekuburan
  rationale: אֲחֻזָּה menandakan milik atau hak kepemilikan yang tetap, bukan sekadar izin memakai tempat tersebut untuk menguburkan.
