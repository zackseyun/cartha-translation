  text: וַ/תָּ֣מָת שָׂרָ֗ה בְּ/קִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יָּבֹא֙ אַבְרָהָ֔ם לִ/סְפֹּ֥ד לְ/שָׂרָ֖ה וְ/לִ/בְכֹּתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: id
  text: Sara meninggal di Kiryat-Arba, yaitu Hebron, di tanah Kanaan. Lalu Abraham datang untuk meratapi Sara dan menangisinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּמָת
  choice: meninggal
  rationale: Kata kerja מות secara langsung menyatakan kematian. Dalam bahasa Indonesia modern, “meninggal” tetap lugas sekaligus sesuai dengan ragam narasi yang bermartabat.
- source_word: בְּקִרְיַת אַרְבַּע
  choice: di Kiryat-Arba
  rationale: Nama tempat ditransliterasikan. Bentuk “Kiryat-Arba” cukup dekat dengan bentuk Ibrani dan tanda hubung memperlihatkan bahwa unsur-unsurnya membentuk satu nama tempat.
- source_word: הִוא חֶבְרוֹן
  choice: yaitu Hebron
  rationale: Frasa ini mengidentifikasi Kiryat-Arba sebagai Hebron. “Yaitu Hebron” menyampaikan fungsi penjelasannya secara alami tanpa menambahkan informasi.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Kata אֶרֶץ dinyatakan secara eksplisit, sehingga “tanah Kanaan” mempertahankan bentuk lengkap ungkapan sumber.
- source_word: וַיָּבֹא
  choice: Lalu Abraham datang
  rationale: בוא dapat berarti datang atau pergi menurut sudut pandang. “Datang” mempertahankan sudut pandang naratif yang lazim dan tidak menyiratkan tindakan memasuki tempat tertentu.
- source_word: לִסְפֹּד לְשָׂרָה
  choice: untuk meratapi Sara
  rationale: ספד menunjuk pada tindakan berkabung atau meratap, sering kali sebagai ungkapan duka yang nyata. “Meratapi” paling tepat dalam konstruksi transitif bahasa Indonesia dan membedakannya dari tindakan menangis pada frasa berikutnya.
- source_word: וְלִבְכֹּתָהּ
  choice: dan menangisinya
  rationale: בכה berarti menangis, dan sufiks objek feminin merujuk kepada Sara. “Menangisinya” mengungkapkan objek dukacita secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan khidmat. Nama-nama ditransliterasikan sebagai Sara, Kiryat-Arba, Hebron, Kanaan, dan Abraham. Tidak diperlukan catatan kaki karena identifikasi Kiryat-Arba dengan Hebron sudah dinyatakan langsung dalam teks, sedangkan rentang makna verba dukacita dapat disampaikan secara memadai melalui “meratapi” dan “menangisinya”.
