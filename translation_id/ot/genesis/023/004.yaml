base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: id
  text: Aku ini pendatang dan penduduk sementara di antara kamu. Berikanlah kepadaku sebidang tanah untuk tempat pemakaman[a] di antara kamu, supaya aku dapat menguburkan orangku yang telah meninggal dari pandanganku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga mengandung arti tanah pegangan atau tanah milik untuk pemakaman, bukan sekadar tempat menggali kubur.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari hadapanku”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּר
  choice: pendatang
  rationale: Kata ini menunjuk kepada orang yang tinggal di luar tanah dan kelompok kerabat asalnya tanpa kedudukan penuh sebagai warga pemilik tanah. “Pendatang” alami dalam bahasa Indonesia dan mempertahankan status Abraham sebagai orang luar.
- source_word: וְתוֹשָׁב
  choice: penduduk sementara
  rationale: Kata ini melengkapi גֵּר dengan menekankan keberadaan sebagai penghuni tanpa hak milik atau status pribumi penuh. “Penduduk sementara” jelas dan tidak terlalu teknis.
- source_word: עִמָּכֶם
  choice: di antara kamu
  rationale: Walaupun secara harfiah berarti “bersama kamu”, dalam konteks sosial ini frasa tersebut menyatakan keberadaan di tengah komunitas mereka. “Di antara kamu” alami untuk kedua kemunculannya.
- source_word: תְּנוּ לִי
  choice: Berikanlah kepadaku
  rationale: Bentuk imperatif dari נתן menyampaikan permintaan langsung. Pilihan ini tidak menentukan apakah pemberian itu cuma-cuma atau melalui transaksi yang kemudian dirundingkan.
- source_word: אֲחֻזַּת קֶבֶר
  choice: sebidang tanah untuk tempat pemakaman
  rationale: אֲחֻזָּה mengandung gagasan tanah milik atau pegangan tetap, bukan sekadar sebuah lubang kubur. “Sebidang tanah” mempertahankan unsur properti, sedangkan “tempat pemakaman” terdengar alami dalam bahasa Indonesia.
- source_word: וְאֶקְבְּרָה
  choice: supaya aku dapat menguburkan
  rationale: Bentuk kohortatif sesudah permintaan menyatakan tujuan atau hasil yang dikehendaki. Susunan ini menyampaikan nuansa tersebut dengan wajar.
- source_word: מֵתִי
  choice: orangku yang telah meninggal
  rationale: Bahasa Ibrani memakai bentuk tunggal dengan akhiran orang pertama untuk seorang anggota keluarga yang meninggal. Pilihan ini lebih alami daripada “orang matiku” dan tidak menambahkan nama Sara yang tidak disebut dalam ayat.
- source_word: מִלְּפָנַי
  choice: jauh dari pandanganku
  rationale: Secara harfiah frasa ini berarti “dari hadapanku”. Dalam konteks penguburan, pilihan ini mempertahankan gambaran jenazah yang disingkirkan dari hadapan atau pandangan Abraham.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pasangan “pendatang dan penduduk sementara” mempertahankan dua istilah sosial yang berbeda. Bentuk tunggal “kamu” dipakai karena Abraham berbicara kepada suatu komunitas sebagai kelompok, selaras dengan kebiasaan naratif Indonesia.
