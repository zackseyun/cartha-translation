  to: Lalu Abraham berbicara kepada Efron di hadapan penduduk negeri itu, katanya, “Kalau saja engkau mau mendengarkan aku![a] Aku memberikan uang perak untuk ladang itu; terimalah itu dariku,[b] supaya aku dapat menguburkan jenazah anggota keluargaku di sana.”
