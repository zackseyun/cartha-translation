  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: id
  text: Lalu Abraham berbicara kepada Efron di hadapan penduduk negeri itu, katanya, “Kalau saja engkau mau mendengarkan aku![a] Aku memberikan uang perak untuk ladang itu; terimalah itu dariku,[b] supaya aku dapat menguburkan jenazah anggota keluargaku di sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih idiomatis, “Tolong dengarkan aku.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Aku telah memberikan uang perak untuk ladang itu; ambillah dariku.” Bentuk perfektif Ibrani di sini kemungkinan menyatakan penawaran resmi dalam perundingan; dapat juga dipahami, “Aku akan memberikan uang perak untuk ladang itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu Abraham berbicara
  rationale: Kata kerja דּבר diterjemahkan secara formal sebagai “berbicara”. Nama Abraham disebut untuk memperjelas subjek yang tersirat dari konteks tanpa mengubah rujukannya.
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: dengan didengar oleh penduduk negeri itu
  rationale: Ungkapan harfiah “di telinga rakyat negeri” menyatakan bahwa percakapan berlangsung secara terbuka dan dapat didengar masyarakat setempat; bentuk ini alami dalam bahasa Indonesia dan mempertahankan latar hukum-publiknya.
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: Kalau saja engkau mau mendengarkan aku!
  rationale: Rangkaian partikel ini bersifat eliptis dan mengungkapkan permohonan yang sungguh-sungguh. “Kalau saja” mempertahankan nuansa לוּ, sedangkan “mau mendengarkan” lebih idiomatis daripada terjemahan harfiah “mendengar” dalam konteks permohonan.
- source_word: נָתַתִּי כֶּסֶף הַשָּׂדֶה
  choice: Aku menyerahkan uang perak untuk ladang itu
  rationale: Bentuk perfektif נָתַתִּי dapat berfungsi performatif dalam transaksi, yaitu sebagai penawaran resmi yang sedang dilakukan. “Uang perak” mempertahankan bahan pembayaran sekaligus menjelaskan fungsi ekonominya.
- source_word: קַח מִמֶּנִּי
  choice: terimalah dariku
  rationale: Secara dasar berarti “ambillah dariku”, tetapi dalam perundingan jual-beli “terimalah” secara alami menyampaikan permintaan agar Efron menerima pembayaran tanpa menambah gagasan baru.
- source_word: וְאֶקְבְּרָה
  choice: supaya aku dapat menguburkan
  rationale: Bentuk kohortatif mengungkapkan maksud atau hasil yang diinginkan Abraham; “supaya” menyatakan hubungan tujuan itu secara wajar.
- source_word: מֵתִי
  choice: jenazah keluargaku
  rationale: Secara harfiah ungkapan ini berarti “orang matiku” dan secara idiomatis menunjuk anggota keluarga yang telah meninggal. Pilihan ini menghindari kesan keliru bahwa “jenazahku” adalah tubuh Abraham sendiri, tanpa menyebut Sarah secara eksplisit.
- source_word: שָׁמָּה
  choice: di sana
  rationale: Padanan lokatif langsung dan alami untuk menunjuk ladang atau tempat yang sedang dirundingkan.
