id: GEN.23.10
reference: Genesis 23:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: id
  text: Efron sedang duduk di antara keturunan Het[a], lalu Efron, orang Het itu, menjawab Abraham di hadapan keturunan Het, di hadapan semua orang yang masuk melalui pintu gerbang kotanya[b], katanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “anak-anak Het”; dapat juga diterjemahkan “orang-orang Het”. Demikian juga pada penyebutan berikutnya dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Pintu gerbang kota merupakan tempat umum untuk menangani urusan hukum dan perdagangan di hadapan para saksi.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Bentuk partisip menunjukkan keadaan Efron yang sedang berlangsung dalam adegan itu, bukan sekadar tindakan lampau.
- source_word: בְּתוֹךְ
  choice: di antara
  rationale: Dalam konteks pertemuan masyarakat, ungkapan ini menyatakan kehadiran Efron di tengah kelompok yang berkumpul.
- source_word: בְּנֵי חֵת
  choice: keturunan Het
  rationale: Pilihan ini mempertahankan unsur kekerabatan dalam ungkapan Ibrani secara wajar dalam bahasa Indonesia dan membedakannya dari sebutan etnis הַחִתִּי.
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Padanan langsung dan alami untuk verba yang memperkenalkan tanggapan dalam percakapan.
- source_word: הַחִתִּי
  choice: orang Het itu
  rationale: Artikel definit Ibrani dipertahankan dengan 'itu', yang mengidentifikasi Efron sebagai orang Het yang sudah dikenal dalam adegan.
- source_word: בְּאָזְנֵי
  choice: dengan didengar oleh
  rationale: Idiom ini menyatakan bahwa perkataan disampaikan secara terbuka dalam pendengaran para saksi.
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: dan semua orang yang datang ke pintu gerbang kotanya
  rationale: Frasa ini mengidentifikasi semua orang yang hadir atau berlalu di gerbang kota sebagai saksi publik; koordinasi dengan kelompok sebelumnya mencerminkan cakupan לְכֹל.
- source_word: שַׁעַר עִירוֹ
  choice: pintu gerbang kotanya
  rationale: Padanan ini mempertahankan konstruksi Ibrani dengan jelas dan menunjuk tempat umum untuk urusan hukum dan niaga.
- source_word: לֵאמֹר
  choice: Katanya,
  rationale: Rumusan naratif alami dalam bahasa Indonesia untuk mengantar perkataan langsung pada ayat berikutnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keturunan Het' dipakai agar ungkapan kekerabatan Ibrani tetap terlihat tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak kecil. Susunan kalimat dipecah secukupnya demi kejelasan, sambil mempertahankan fungsi ayat sebagai pengantar perkataan langsung pada ayat berikutnya.
