  naturalness: '"Di hadapan keturunan Het, di hadapan semua orang yang masuk melalui pintu gerbang kotanya" lebih alami dan jelas dalam bahasa Indonesia baku daripada konstruksi pasif "dengan didengar oleh". Bentuk "katanya," tetap berfungsi sebagai pengantar ujaran langsung pada ayat berikutnya.'
  terminology: '"Keturunan Het" merupakan padanan yang wajar bagi בְּנֵי־חֵת dan tetap dibedakan dari sebutan etnis "orang Het itu" untuk הַחִתִּי. Nama Efron, Abraham, dan Het konsisten. Catatan a tetap menjelaskan alternatif literal dan etnis; catatan b tetap terpasang pada "pintu gerbang kotanya".'
