  yaml_path: translation/ot/genesis/028/007.yaml
  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: id
  text: dan bahwa Yakub mendengarkan ayah dan ibunya[a], lalu pergi ke Padan-Aram.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menaati ayah dan ibunya.” Kata kerja Ibrani yang dipakai di sini dapat berarti mendengar sekaligus mengindahkan atau menaati dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengarkan
  rationale: Dengan preposisi אֶל, verba שׁמע di sini berarti mendengarkan atau mengindahkan seseorang. Dalam konteks ini Yakub menanggapi arahan orang tuanya; 'mendengarkan' mempertahankan nuansa mendengar sekaligus menaati tanpa mempersempit maknanya.
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: ayah dan ibunya
  rationale: Bahasa Indonesia secara alami cukup memakai satu penanda kepunyaan pada unsur terakhir dalam pasangan ini. Frasa tersebut tetap menyatakan kedua orang tua Yakub secara eksplisit.
- source_word: וַיֵּלֶךְ
  choice: lalu pergi
  rationale: Verba הלך secara langsung berarti pergi atau berjalan. 'Pergi' paling wajar dalam konteks perjalanan, sedangkan 'lalu' menyampaikan urutan naratif waw konsekutif.
- source_word: פַּדֶּנָה אֲרָם
  choice: ke Padan-Aram
  rationale: Ini nama tempat sehingga ditransliterasikan, bukan diterjemahkan. Akhiran penunjuk arah pada פַּדֶּנָה diterjemahkan dengan 'ke'; ejaan 'Padan-Aram' mengikuti bentuk Indonesia yang ringkas dan jelas.
- source_word: וַ
  choice: dan
  rationale: Waw pada awal ayat meneruskan konstruksi yang bergantung pada pernyataan sebelumnya; 'dan bahwa' mempertahankan hubungan sintaktis itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pembukaan 'dan bahwa' dipertahankan karena ayat ini secara sintaktis melanjutkan kalimat sebelumnya.
