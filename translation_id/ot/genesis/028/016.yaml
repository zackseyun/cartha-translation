  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: id
  text: Lalu Yakub terbangun dari tidurnya dan berkata, “Sungguh, Yahweh ada di tempat ini, dan aku tidak mengetahuinya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: terbangun
  rationale: Verba ini menyatakan bangun dari tidur; “terbangun” alami dalam narasi Indonesia dan tidak mengharuskan makna pasif.
- source_word: מִשְּׁנָתוֹ
  choice: dari tidurnya
  rationale: Menerjemahkan secara langsung dan idiomatis frasa yang menunjukkan keadaan tidur yang baru berakhir.
- source_word: אָכֵן
  choice: Sungguh
  rationale: Partikel ini menandai penegasan sekaligus kesadaran yang tiba-tiba; “Sungguh” mempertahankan kedua nuansa itu dalam bahasa Indonesia yang wajar.
- source_word: יֵשׁ
  choice: ada
  rationale: Partikel eksistensial ini di sini menyatakan keberadaan atau kehadiran Yahweh di tempat tersebut; “ada” menjaga bentuk pernyataan Ibrani tanpa memperjelasnya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בַּמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: Ungkapan ini menunjuk lokasi tertentu tempat Yakub tidur dan menerima mimpi; “di tempat ini” adalah padanan Indonesia yang alami.
- source_word: וְאָנֹכִי
  choice: tetapi aku
  rationale: Konjungsi waw dapat menyatakan hubungan kontras dalam konteks. Bentuk pronomina mandiri menekankan pertentangan antara kehadiran Yahweh dan ketidaktahuan Yakub.
- source_word: לֹא יָדָעְתִּי
  choice: aku tidak mengetahuinya
  rationale: Bentuk perfektif menunjuk pada ketidaktahuan Yakub sebelumnya. Akhiran “-nya” secara alami merujuk pada kenyataan bahwa Yahweh ada di tempat itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna kehadiran dalam יֵשׁ יְהוָה בַּמָּקוֹם הַזֶּה
  choice: Yahweh ada di tempat ini
  alternative: Yahweh hadir di tempat ini
  rationale: “Ada” mempertahankan ungkapan eksistensial sumber dan membiarkan cakupan makna kehadiran tetap terbuka, sedangkan “hadir” akan menafsirkan maknanya dengan lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Aku” dipakai karena merupakan ucapan langsung pribadi, sedangkan “Sungguh” menyampaikan keterkejutan dan penegasan tanpa terdengar usang.
