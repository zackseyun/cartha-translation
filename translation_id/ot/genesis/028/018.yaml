base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: id
  text: Yakub bangun pagi-pagi, mengambil batu yang telah diletakkannya di dekat kepalanya, menegakkannya sebagai tugu batu[a], lalu menuangkan minyak ke atasnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: batu tegak.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: di atas kepalanya, yaitu bagian paling atas tugu batu itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: Keesokan paginya, Yakub bangun pagi-pagi
  rationale: Konstruksi ini menyatakan bahwa Yakub bangun pada pagi hari, dengan penekanan bahwa ia bangun dini. 'Keesokan paginya' menghubungkan tindakan ini secara alami dengan peristiwa malam sebelumnya.
- source_word: הָאֶבֶן
  choice: batu
  rationale: Nomina tunggal definit; konteks sudah mengidentifikasi batu tersebut sehingga bentuk tanpa penggolong terdengar alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: yang telah diletakkannya di dekat kepalanya
  rationale: מְרַאֲשֹׁתָיו menunjuk lokasi pada bagian kepala atau di dekat kepala. Pilihan ini mempertahankan ketidakpastian posisi dan tidak mempersempitnya menjadi 'di bawah kepalanya'.
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: mendirikannya sebagai tugu batu
  rationale: מַצֵּבָה adalah batu yang ditegakkan sebagai penanda atau tugu. 'Tugu batu' lebih konkret daripada sekadar 'tiang' dan tidak memasukkan fungsi peringatan yang tidak dinyatakan secara eksplisit.
- source_word: וַיִּצֹק שֶׁמֶן
  choice: menuangkan minyak
  rationale: Ibrani secara langsung menyatakan tindakan menuangkan minyak. Terjemahan ini menghindari tafsiran tambahan seperti 'mengurapi' dan tidak menentukan jenis minyak yang tidak disebutkan.
- source_word: עַל רֹאשָׁהּ
  choice: ke atasnya
  rationale: Secara harfiah berarti 'di atas kepalanya', yakni pada bagian paling atas batu. 'Ke atasnya' alami dalam bahasa Indonesia dan makna harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Kemungkinan makna kultis מַצֵּבָה dan tindakan menuangkan minyak
  choice: Menggambarkan tindakan Yakub tanpa memberi penilaian teologis atau fungsi ritual tambahan
  alternative: Menerjemahkan secara interpretatif sebagai 'batu peringatan' atau 'mengurapinya dengan minyak'
  rationale: Ayat ini hanya menuturkan bahwa Yakub menegakkan batu dan menuangkan minyak di atasnya. Terjemahan tidak seharusnya mendahului narasi dengan menilai tindakan itu ataupun menetapkan makna ritual yang tidak dinyatakan oleh kata-kata Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang lancar. Rangkaian verba Ibrani disampaikan dalam beberapa klausa singkat agar mudah dibaca tanpa menghilangkan urutan tindakannya. Istilah 'tugu batu' bersifat konkret, bermartabat, dan tidak terlalu teknis.
