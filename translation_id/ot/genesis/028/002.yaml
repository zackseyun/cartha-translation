  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: id
  text: Bangunlah, pergilah ke Padan-Aram, ke rumah Betuel, ayah ibumu, dan ambillah dari sana seorang istri bagimu dari antara anak-anak perempuan Laban, saudara laki-laki ibumu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih idiomatis, “kakekmu dari pihak ibu” dan “pamanmu”. Teks utama mempertahankan ungkapan kekerabatan Ibrani dengan lebih eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם
  choice: Bangunlah
  rationale: Imperatif קום berarti bangun atau berdiri. “Bangunlah” alami dalam bahasa Indonesia dan mempertahankan daya perintah sebelum “pergilah”.
- source_word: לֵךְ֙
  choice: pergilah
  rationale: Imperatif umum dari הלך. “Pergilah” merupakan padanan lugas dan wajar.
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: ke Padan-Aram
  rationale: Nama tempat ditransliterasikan, sedangkan akhiran penunjuk arah dinyatakan dengan “ke”.
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: ke rumah Betuel
  rationale: Bentuk ini menyatakan gerak menuju rumah atau keluarga Betuel; “ke rumah Betuel” mempertahankan struktur dan makna tujuan.
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: ayah ibumu
  rationale: Terjemahan langsung ungkapan kekerabatan Ibrani, tanpa menggantinya dalam teks utama dengan istilah yang lebih ringkas, “kakekmu dari pihak ibu”.
- source_word: וְ/קַח לְ/ךָ֤
  choice: dan ambillah ... bagimu
  rationale: לקח berarti “mengambil”, dan לְךָ menandai kepentingan pribadi. Susunan “ambillah ... bagimu” mempertahankan kedua unsur itu secara alami.
- source_word: מִ/שָּׁם֙
  choice: dari sana
  rationale: Preposisi מן dinyatakan secara eksplisit dengan “dari”.
- source_word: אִשָּׁ֔ה
  choice: seorang istri
  rationale: Dalam konteks perintah mencari pasangan nikah, arti kontekstualnya ialah “istri”, bukan sekadar “perempuan”.
- source_word: מִ/בְּנ֥וֹת לָבָ֖ן
  choice: dari antara anak-anak perempuan Laban
  rationale: מן bersifat partitif; “dari antara” memperjelas bahwa satu istri harus dipilih dari kalangan anak-anak perempuan Laban.
- source_word: אֲחִ֥י אִמֶּֽ/ךָ
  choice: saudara laki-laki ibumu
  rationale: Terjemahan eksplisit ungkapan kekerabatan Ibrani; istilah idiomatis “pamanmu” dicatat sebagai alternatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk imperatif berakhiran -lah mempertahankan nada perintah. Ungkapan kekerabatan sumber dipertahankan dalam teks utama, sedangkan padanan Indonesia yang lebih idiomatis diberikan dalam catatan kaki.
