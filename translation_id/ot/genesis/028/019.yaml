  text: וַ/יִּקְרָ֛א אֶת שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֵּֽית אֵ֑ל וְ/אוּלָ֛ם ל֥וּז שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/019.yaml
  text: And he called the name of that place Bethel[a], but formerly the name of the city was Luz.
translation:
  language: id
  text: Ia menamai tempat itu Betel[a], tetapi sebelumnya nama kota itu adalah Lus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Betel berarti “rumah Allah.”
    reason: Menjelaskan makna nama Ibrani בֵּית אֵל tanpa mengganti nama diri dalam teks utama.
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם
  choice: Ia menamai
  rationale: Ungkapan Ibrani harfiah 'memanggil nama' dalam konteks ini berarti memberi nama; 'menamai' menyampaikan tindakan tersebut secara alami dalam bahasa Indonesia modern.
- source_word: הַמָּקוֹם הַהוּא
  choice: tempat itu
  rationale: Mencerminkan nomina מָקוֹם dan penunjuk הַהוּא secara langsung dan wajar.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Nama tempat ditransliterasikan menurut bentuk baku bahasa Indonesia; maknanya dijelaskan dalam catatan kaki.
- source_word: וְאוּלָם
  choice: tetapi
  rationale: Partikel ini menandai kontras atau klarifikasi antara nama baru tempat itu dan nama kota sebelumnya.
- source_word: לוּז
  choice: Lus
  rationale: Mengikuti bentuk baku nama tempat ini dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: שֵׁם הָעִיר
  choice: nama kota itu
  rationale: Konstruksi status constructus diterjemahkan secara alami; 'itu' memperjelas bahwa kota yang dimaksud terkait dengan tempat tersebut.
- source_word: לָרִאשֹׁנָה
  choice: sebelumnya
  rationale: Dalam konteks penamaan kota, adverbia ini menunjuk pada nama yang dipakai pada masa terdahulu.
