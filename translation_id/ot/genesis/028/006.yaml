source:
  edition: WLC
  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: id
  text: Esau melihat bahwa Ishak telah memberkati Yakub dan mengutusnya ke Padan-Aram untuk mengambil seorang istri dari sana bagi dirinya sendiri, dan bahwa ketika Ishak memberkatinya, ia memerintahkannya dengan berkata, “Jangan mengambil istri dari putri-putri Kanaan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari perempuan-perempuan Kanaan.” Secara harfiah, bahasa Ibrani berbunyi “dari putri-putri Kanaan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: Esau melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; bentuk lampau dipahami secara alami dari konteks narasi bahasa Indonesia tanpa perlu penanda tambahan.
- source_word: כִּי בֵרַךְ יִצְחָק אֶת־יַעֲקֹב
  choice: bahwa Ishak telah memberkati Yakub
  rationale: Kata 'telah' memperjelas bahwa pemberkatan itu terjadi sebelum Esau mengetahuinya.
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: dan mengutusnya ke Padan-Aram
  rationale: '''Mengutus'' menyampaikan tindakan Ishak menyuruh Yakub pergi dengan tujuan tertentu; nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca.'
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: untuk mengambil seorang istri bagi dirinya dari sana
  rationale: Mempertahankan klausa tujuan, unsur refleksif לוֹ, dan keterangan asal מִשָּׁם.
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: ketika memberkatinya
  rationale: Kata depan בְּ dipahami secara temporal atau sirkumstansial dan diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: Ishak memerintahkannya dengan berkata
  rationale: Subjek 'Ishak' diulang agar rujukan pronomina tidak kabur dalam kalimat Indonesia; 'dengan berkata' mempertahankan unsur pengantar kutipan לֵאמֹר.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Jangan mengambil istri
  rationale: Bentuk negatif ini berfungsi sebagai larangan langsung; 'jangan' paling alami dan tetap mempertahankan daya perintahnya.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: dari antara putri-putri Kanaan
  rationale: Mencerminkan ungkapan Ibrani secara dekat sambil tetap dapat dipahami; alternatif idiomatis dicantumkan dalam catatan kaki.
