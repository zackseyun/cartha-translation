  to: Esau melihat bahwa Ishak telah memberkati Yakub dan mengutusnya ke Padan-Aram untuk mengambil seorang istri dari sana bagi dirinya sendiri, dan bahwa ketika Ishak memberkatinya, ia memerintahkannya dengan berkata, “Jangan mengambil istri dari putri-putri Kanaan[a].”
