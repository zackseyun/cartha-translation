id: GEN.28.13
reference: Genesis 28:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: id
  text: Lihatlah, Yahweh berdiri di atas tangga itu[a] dan berfirman, “Akulah Yahweh, Allah Abraham, bapamu, dan Allah Ishak. Tanah tempat engkau berbaring ini akan Kuberikan kepadamu dan kepada keturunanmu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atasnya.” Kata ganti Ibrani itu dapat merujuk kepada tangga, tetapi dapat juga dipahami sebagai “di dekat Yakub” atau “di atas Yakub.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “benihmu”; kata Ibrani ini merupakan bentuk tunggal yang dapat menyatakan keturunan secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana dan daya hidup partikel Ibrani dengan ungkapan Indonesia yang jelas dan khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: נִצָּב
  choice: berdiri
  rationale: Partisip Ibrani menggambarkan keadaan yang sedang tampak dalam penglihatan; dalam konteks ini, bentuk Indonesia 'berdiri' sudah alami tanpa penanda aspek tambahan.
- source_word: עָלָיו
  choice: di atas tangga itu
  rationale: Mengambil pronomina maskulin tunggal sebagai rujukan kepada tangga dalam konteks terdekat. Kemungkinan bahwa pronomina itu merujuk kepada Yakub tetap dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Allah Abraham, bapamu
  rationale: Mengikuti susunan Ibrani dan mempertahankan penyebutan Abraham sebagai 'bapamu' dalam arti leluhur, tanpa mengubahnya menjadi parafrasa.
- source_word: וֵאלֹהֵי יִצְחָק
  choice: dan Allah Ishak
  rationale: Terjemahan langsung dari frasa konstruksi yang dikoordinasikan.
- source_word: הָאָרֶץ
  choice: Tanah
  rationale: Dalam konteks janji kepada para leluhur, kata ini menunjuk kepada wilayah yang dijanjikan, bukan hanya permukaan tanah di bawah Yakub.
- source_word: שֹׁכֵב עָלֶיהָ
  choice: tempat engkau berbaring ini
  rationale: Menyampaikan tindakan yang sedang berlangsung dan hubungan tempat secara alami dalam bahasa Indonesia.
- source_word: לְךָ אֶתְּנֶנָּה
  choice: akan Kuberikan kepadamu
  rationale: Bentuk imperfek dalam konteks janji paling wajar dipahami sebagai tindakan pada masa mendatang; objeknya sudah dinyatakan sebagai 'tanah'.
- source_word: וּלְזַרְעֶךָ
  choice: dan kepada keturunanmu
  rationale: '''Keturunan'' merupakan padanan Indonesia alami yang dapat mempertahankan makna kolektif dari זֶרַע.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Rujukan pronomina עָלָיו dalam penglihatan
  choice: di atas tangga itu
  alternative: di dekat Yakub atau di atas Yakub
  rationale: Anteseden terdekat dalam konteks adalah tangga, tetapi bentuk Ibrani juga dapat dipahami sebagai rujukan kepada Yakub. Kemungkinan lain tidak dihapus, melainkan dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Engkau' dan bentuk terikat 'Kuberikan' mempertahankan keluhuran tuturan ilahi tanpa memakai susunan yang terlalu arkais. Semua penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
