  text: וַ/יִּשְׁלַ֤ח יִצְחָק֙ אֶֽת יַעֲקֹ֔ב וַ/יֵּ֖לֶךְ פַּדֶּ֣נָֽ/ה אֲרָ֑ם אֶל לָבָ֤ן בֶּן בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְ/עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: id
  text: Lalu Ishak menyuruh Yakub pergi, dan Yakub berangkat ke Padan-Aram, kepada Laban, anak Betuel, orang Aram, saudara laki-laki Ribka, ibu Yakub dan Esau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: menyuruh ... pergi
  rationale: Dalam konteks ini שׁלח berarti mengutus atau menyuruh seseorang pergi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa Ishak melepas Yakub untuk berangkat.
- source_word: וַיֵּלֶךְ
  choice: berangkat
  rationale: הלך adalah verba umum untuk pergi; dalam rangkaian naratif ini, 'berangkat' secara alami menyatakan tindakan Yakub sesudah disuruh pergi.
- source_word: פַּדֶּנָה אֲרָם
  choice: ke Padan-Aram
  rationale: Nama tempat ditransliterasikan, sedangkan akhiran penunjuk arah pada פַּדֶּנָה diterjemahkan dengan 'ke'.
- source_word: אֶל לָבָן
  choice: menemui Laban
  rationale: Preposisi אֶל menunjukkan arah atau tujuan menuju seseorang. 'Menemui Laban' menyampaikan tujuan perjalanan secara alami tanpa mengubah identitas tujuannya.
- source_word: בֶּן בְּתוּאֵל
  choice: anak Betuel
  rationale: Konstruksi patronimik ini secara wajar diterjemahkan 'anak Betuel'; bahasa Indonesia tidak memerlukan kata penghubung seperti 'dari'.
- source_word: הָאֲרַמִּי
  choice: orang Aram itu
  rationale: Istilah ini menunjuk identitas etnis atau geografis sebagai orang Aram. 'Orang Aram' lebih tepat secara historis daripada sebutan tradisional 'orang Siria', dan kata sandang Ibrani dicerminkan secara alami dengan 'itu'.
- source_word: אֲחִי רִבְקָה
  choice: saudara Ribka
  rationale: Bahasa Indonesia memakai 'saudara' tanpa menandai gender dalam bentuk dasarnya; konteks Laban sudah menunjukkan bahwa yang dimaksud adalah saudara laki-laki Ribka.
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: ibu Yakub dan Esau
  rationale: Frasa ini mempertahankan keterangan eksplisit tentang Ribka dan kedua anaknya dengan susunan Indonesia yang ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama פַּדַּן אֲרָם ditulis 'Padan-Aram' agar kedua unsur nama tetap jelas. Tidak diperlukan catatan kaki karena 'orang Aram' dapat diterjemahkan langsung dan tepat dalam bahasa Indonesia.
