id: GEN.28.15
reference: Genesis 28:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: id
  text: Lihatlah, Aku menyertai engkau. Aku akan menjagamu[a] ke mana pun engkau pergi dan akan membawamu kembali ke tanah ini. Sebab, Aku tidak akan meninggalkanmu[b] sampai Aku melakukan apa yang telah Kukatakan kepadamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan mengawasimu” atau “akan melindungimu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak akan membiarkanmu” atau “tidak akan menelantarkanmu.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “apa yang telah Kukatakan kepadamu”; sejumlah terjemahan menafsirkannya sebagai “apa yang telah Kujanjikan kepadamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan fungsi penanda wacana yang menarik perhatian dan memberi daya hidup pada ucapan ilahi, tanpa menambah penegasan yang tidak tersurat.
- source_word: אָנֹכִי עִמָּךְ
  choice: Aku menyertai engkau
  rationale: Mengungkapkan kehadiran pribadi Allah secara alami dan bermartabat. Pronomina mandiri Ibrani memberi penekanan, tetapi tidak perlu diperberat menjadi 'Aku sendiri'.
- source_word: וּשְׁמַרְתִּיךָ
  choice: Aku akan menjagamu
  rationale: שׁמר mencakup menjaga, melindungi, dan mengawasi. 'Menjagamu' alami dalam bahasa Indonesia serta tetap cukup luas untuk mempertahankan nuansa perlindungan.
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: ke mana pun engkau pergi
  rationale: Padanan idiomatis yang menyampaikan cakupan setiap tempat perjalanan Yakub.
- source_word: וַהֲשִׁבֹתִיךָ
  choice: akan membawamu kembali
  rationale: 'Bentuk kausatif dari שוב dipertahankan: Allah bukan sekadar menyatakan Yakub akan kembali, melainkan bahwa Ia akan membawanya kembali.'
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: ke tanah ini
  rationale: אֲדָמָה secara langsung berarti tanah atau daratan. 'Tanah ini' alami dan tetap memuat dimensi geografis dari janji kepada Yakub.
- source_word: כִּי
  choice: Sebab
  rationale: Menandai dasar atau jaminan bagi rangkaian janji sebelumnya.
- source_word: לֹא אֶעֱזָבְךָ
  choice: Aku tidak akan meninggalkanmu
  rationale: Padanan luas dan alami bagi עזב yang mempertahankan janji kehadiran tanpa mempersempitnya menjadi istilah teologis khusus.
- source_word: עַד אֲשֶׁר אִם
  choice: sampai
  rationale: Gabungan partikel ini secara idiomatis menandai batas tercapainya tindakan yang dijanjikan; 'sampai' menyampaikannya tanpa kekakuan.
- source_word: עָשִׂיתִי
  choice: Aku melakukan
  rationale: Bentuk perfektif sesudah עַד mengacu pada tindakan yang kelak tuntas. Bahasa Indonesia tidak memerlukan bentuk future perfect khusus.
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: apa yang telah Kukatakan kepadamu
  rationale: Tetap mengikuti arti langsung דבר, yaitu mengatakan atau berbicara, dan tidak secara diam-diam menggantinya dengan 'menjanjikan', meskipun isi ucapan itu memang berupa janji.
theological_decisions:
- issue: Kehadiran, perlindungan, dan kesetiaan perjanjian
  choice: Menyampaikan janji kehadiran, penjagaan, kepulangan, dan pelaksanaan firman Allah dengan istilah langsung yang tidak memperluas cakupan teologis teks.
  alternative: Memakai ungkapan tradisional seperti 'tidak akan meninggalkan ataupun membiarkan engkau' atau menafsirkan 'Kukatakan' sebagai 'Kujanjikan'.
  rationale: Teks menegaskan bahwa Allah sendiri menyertai dan menjaga Yakub serta akan menuntaskan ucapan-Nya. Terjemahan mempertahankan seluruh unsur itu tanpa memasukkan rumusan dari bagian Alkitab lain atau memperjelas secara berlebihan sifat ucapan tersebut.
- issue: Batas waktu dalam ungkapan 'sampai Aku melakukan'
  choice: Mempertahankan kata 'sampai' sebagaimana struktur teks.
  alternative: Mengubahnya menjadi 'dan Aku pasti melakukan' agar tidak terkesan bahwa Allah akan meninggalkan Yakub sesudah janji terlaksana.
  rationale: Ungkapan Ibrani menyatakan jaminan setidaknya sampai penggenapan, tetapi tidak secara eksplisit menyatakan berakhirnya kehadiran Allah sesudah itu. Ketegangan bahasa tersebut sebaiknya tidak diselesaikan melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai karena tuturan bersifat langsung dan khidmat; bentuk klitik seperti 'menjagamu' menjaga kelancaran. Kalimat Ibrani yang panjang dibagi agar mudah dipahami tanpa mengubah hubungan antargagasan. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia.
