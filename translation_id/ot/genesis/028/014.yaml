    issue: Preposisi בְּ diterjemahkan “melalui” dalam teks utama.
    rationale: “Melalui” merupakan penafsiran perantaraan yang mungkin, tetapi bentuk sumber secara harfiah dan rumusannya menyatakan “di dalam.” Menggunakan “di dalam” menjaga keterbukaan makna tanpa menentukan mekanisme berkat.
  - severity: high
    issue: Catatan kaki menambahkan “dengan menyebut.”
    rationale: Alternatif refleksif/medial hanya mendukung pengertian bahwa semua kaum akan memberkati diri mereka sendiri di dalam/oleh engkau dan keturunanmu. Frasa “dengan menyebut” tidak dinyatakan oleh teks Ibrani ayat ini dan mempersempit alternatif secara tidak perlu.
