source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: id
  text: Keturunanmu akan menjadi seperti debu tanah, dan engkau akan meluas ke barat, ke timur, ke utara, dan ke selatan. Di dalam engkau dan keturunanmu, semua kaum di bumi akan diberkati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua kaum di bumi akan memberkati diri mereka sendiri di dalam engkau dan keturunanmu.” Kata kerja Ibrani itu juga dapat dipahami dalam arti refleksif atau medial.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: Keturunanmu akan menjadi
  rationale: Bentuk verba dalam konteks janji bermakna futur, sedangkan זֶרַע adalah nomina kolektif yang secara alami diterjemahkan 'keturunan' dalam bahasa Indonesia.
- source_word: כַּעֲפַר הָאָרֶץ
  choice: seperti debu tanah
  rationale: Ungkapan ini mempertahankan perumpamaan Ibrani tentang jumlah yang sangat besar; 'debu tanah' alami dan dekat dengan citra sumber.
- source_word: וּפָרַצְתָּ
  choice: engkau akan meluas
  rationale: פרץ mengandung gagasan menerobos atau berkembang keluar; dalam rangkaian arah geografis, 'meluas' menyampaikan ekspansi dengan jelas tanpa menambahkan objek yang tidak disebutkan.
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: ke barat, ke timur, ke utara, dan ke selatan
  rationale: Akhiran direktif menyatakan gerak atau perluasan menuju empat penjuru; נֶגֶב dalam rangkaian ini menunjuk arah selatan.
- source_word: וְנִבְרֲכוּ
  choice: akan diberkati
  rationale: Nifal ברך paling wajar dibaca secara pasif dalam rumusan janji leluhur, sementara kemungkinan makna refleksif dipertahankan dalam catatan kaki.
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: Melalui engkau dan keturunanmu
  rationale: Preposisi ב di sini menyatakan perantaraan atau lingkup berkat. 'Melalui' menghasilkan bahasa Indonesia yang jelas, sambil tetap membiarkan cara perantaraan itu tidak dijelaskan lebih lanjut.
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: semua kaum di bumi
  rationale: מִשְׁפָּחוֹת menunjuk kelompok kekerabatan atau kaum, bukan hanya keluarga inti; הָאֲדָמָה dalam rumusan universal ini menunjuk bumi.
theological_decisions:
- issue: Makna Nifal ברך dalam rumusan berkat leluhur
  choice: 'pasif: ''semua kaum di bumi akan diberkati'''
  alternative: 'refleksif/medial: ''semua kaum di bumi akan memberkati diri dengan menyebut engkau dan keturunanmu'''
  rationale: Bentuk Ibrani dapat dibahas sebagai pasif atau refleksif/medial. Bacaan pasif paling langsung dalam konteks janji ini, tetapi alternatif yang berpengaruh pada pemahaman teologis tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata 'engkau' mempertahankan sapaan tunggal dalam konteks ilahi; 'kaum' dipilih untuk kelompok-kelompok kekerabatan. Penanda catatan kaki ditempatkan setelah klausa yang memiliki ambiguitas.
