  verdict: revise
  source_fidelity: 'Teks utama secara umum mengikuti Ibrani dengan baik: זַרְעֲךָ dipahami sebagai nomina kolektif, empat arah dipertahankan, dan נִבְרֲכוּ diterjemahkan secara pasif. Namun, “melalui engkau” menafsirkan בְּ secara lebih spesifik daripada yang diperlukan; “di dalam engkau” lebih dekat dengan rumusan Ibrani dan tetap dapat dipahami dalam register Alkitabiah. Catatan kaki juga menambahkan unsur “dengan menyebut,” yang tidak terdapat dalam ayat ini maupun dalam alternatif yang dicatat jejak audit Inggris.'
  naturalness: Bahasa teksnya baku dan jelas. “Di dalam engkau dan keturunanmu” sedikit lebih formal daripada “melalui,” tetapi wajar dalam gaya khidmat modern dan mempertahankan rumusan janji. “Keturunanmu akan menjadi seperti debu tanah” dapat dipertahankan sebagai ungkapan idiomatis mengenai jumlah yang sangat besar.
  terminology: “Keturunan,” “debu tanah,” “kaum,” dan “bumi” sesuai untuk konteks ini. Terjemahan pasif “akan diberkati” tepat sebagai teks utama. Alternatif refleksif/medial perlu dicatat tanpa memasukkan penjelasan tradisi atau ungkapan tambahan yang tidak ada dalam sumber.
  issues:
