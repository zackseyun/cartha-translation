  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: id
  text: Dan batu ini, yang telah kudirikan sebagai tugu, akan menjadi rumah Allah,[a] dan dari segala sesuatu yang Kauberikan kepadaku, aku pasti akan memberikan sepersepuluhnya kepada-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “akan menjadi suatu rumah Allah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצֵּבָה
  choice: tugu
  rationale: Menunjuk pada batu yang didirikan sebagai penanda atau monumen. “Tugu” mempertahankan gambaran konkretnya dan lebih alami dalam bahasa Indonesia daripada “pilar” untuk konteks ini.
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: akan menjadi rumah Allah
  rationale: Menerjemahkan frasa konstruksi Ibrani secara alami sambil mempertahankan pernyataan bahwa batu atau tempat itu akan menjadi rumah Allah, tanpa menambahkan gagasan tentang Bait Allah pada masa kemudian.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks nazar Yakub, kata ini menunjuk kepada Allah yang telah menjumpainya, bukan kepada suatu ilah secara umum.
- source_word: תִּתֶּן לִי
  choice: Kauberikan kepadaku
  rationale: Menyampaikan bentuk imperfek sebagai pemberian Allah yang akan datang dalam konteks nazar.
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: aku pasti akan memberikan sepersepuluhnya
  rationale: Infinitif absolut bersama verba finit memberi penegasan. “Pasti” mempertahankan penekanan itu, sedangkan “memberikan sepersepuluhnya” jelas bagi pembaca modern dan tidak mengimpor istilah kelembagaan kemudian.
- source_word: לָךְ
  choice: kepada-Mu
  rationale: Menandai Allah secara langsung sebagai penerima sepersepuluh yang dinazarkan.
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: batu ini, yang telah kudirikan
  rationale: “Kudirikan” sesuai dengan tindakan menegakkan batu sebagai tugu dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat nazar Yakub mengenai batu itu
  choice: Mempertahankan pernyataan bahwa batu itu akan menjadi “rumah Allah” sebagai tempat atau penanda kudus.
  alternative: Menafsirkan batu itu sendiri sebagai tempat ibadah yang lengkap, atau sebagai nubuat langsung tentang Bait Allah kemudian.
  rationale: Teks Ibrani menyatakan bahwa batu yang didirikan Yakub akan menjadi rumah Allah. Terjemahan mempertahankan ketegangan ungkapan tersebut tanpa perluasan teologis di luar konteks perjumpaan ilahi di tempat itu.
- issue: Ungkapan tentang sepersepuluh
  choice: Menerjemahkannya sebagai janji tegas untuk memberikan sepersepuluh kepada Allah.
  alternative: Menggunakan istilah teknis “persepuluhan” yang dapat menyiratkan pranata keagamaan pada masa kemudian.
  rationale: Teks berbicara tentang bagian sepersepuluh yang dinazarkan dari semua yang Allah berikan kepada Yakub. Rumusan ini mempertahankan isi dan penegasannya tanpa membaca sistem hukum atau gerejawi kemudian ke dalam nas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk sapaan ilahi memakai huruf kapital. Koma sebelum klausa kedua dipertahankan untuk memperjelas dua unsur nazar Yakub.
