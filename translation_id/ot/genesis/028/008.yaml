  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: id
  text: Lalu Esau melihat bahwa perempuan-perempuan Kanaan itu buruk di mata Ishak, ayahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jahat di mata Ishak, ayahnya.” Kata sifat Ibrani ini dapat berarti “buruk” atau “jahat”; dalam konteks ini kemungkinan besar ungkapan tersebut menunjukkan penilaian Ishak yang tidak baik terhadap perempuan-perempuan Kanaan sebagai calon istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Lalu ... melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan verba ראה secara dasar berarti “melihat”. Konteks menyiratkan bahwa Esau memahami keadaan itu, tetapi terjemahan tidak perlu mengganti verba tersebut dengan “menyadari”.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang sudah baku dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang dilihat atau diketahui Esau, bukan menyatakan sebab.
- source_word: רָעוֹת
  choice: buruk
  rationale: Adjektiva ini dapat berarti “buruk” atau “jahat”. Dalam konstruksi “di mata” dan konteks pemilihan pasangan hidup, “buruk” mempertahankan penilaian negatif tanpa memastikan bahwa yang dimaksud adalah kejahatan moral.
- source_word: בְּנוֹת כְּנָעַן
  choice: perempuan-perempuan Kanaan
  rationale: Ungkapan ini merujuk pada para perempuan dari Kanaan. Pilihan ini alami dalam bahasa Indonesia dan menghindari kesan bahwa mereka secara harfiah adalah anak-anak perempuan dari seseorang bernama Kanaan.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Ungkapan idiomatis Ibrani ini menyatakan penilaian atau pandangan seseorang dan memiliki padanan yang jelas serta alami dalam bahasa Indonesia.
- source_word: יִצְחָק אָבִיו
  choice: Ishak, ayahnya
  rationale: Pilihan ini mempertahankan urutan informasi dalam bahasa Ibrani sekaligus memakai tanda baca agar hubungan aposisionalnya jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Idiom Ibrani “di mata” dipertahankan karena mudah dipahami dalam bahasa Indonesia, sedangkan “perempuan-perempuan Kanaan” dipilih sebagai padanan alami bagi ungkapan etnis Ibrani.
