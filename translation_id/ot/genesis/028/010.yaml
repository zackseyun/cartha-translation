  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: id
  text: Yakub berangkat dari Bersyeba dan pergi ke Haran[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “ke/menuju Haran”; nama “Haran” memakai akhiran yang menunjukkan arah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: berangkat
  rationale: Bentuk dari יצא menyatakan keluar atau meninggalkan suatu tempat. Dalam konteks awal perjalanan, “berangkat” alami dalam bahasa Indonesia dan tetap menyampaikan tindakan meninggalkan Bersyeba.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: מִבְּאֵר שָׁבַע
  choice: dari Bersyeba
  rationale: Preposisi מִן menandai asal, sedangkan בְּאֵר שָׁבַע adalah nama tempat; “Bersyeba” merupakan bentuk Indonesia yang baku.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: הלך adalah verba umum untuk pergi atau berjalan. “Pergi” merupakan padanan langsung dan tidak menambahkan nuansa perjalanan yang tidak dinyatakan secara khusus.
- source_word: חָרָנָה
  choice: ke Haran
  rationale: Akhiran penunjuk arah -ָה menyatakan gerak menuju Haran. Preposisi Indonesia “ke” mengungkapkan arah atau tujuan itu secara alami tanpa memastikan bahwa Yakub telah tiba.
