  yaml_path: translation/ot/genesis/028/020.yaml
  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: id
  text: Lalu Yakub mengucapkan nazar[a] dengan berkata, “Jika Allah menyertai aku, menjaga aku dalam perjalanan ini yang sedang kutempuh[b], serta memberiku roti[c] untuk dimakan dan pakaian untuk dikenakan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bernazar.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di/dalam jalan ini yang sedang aku jalani”; dalam konteksnya, perjalanan Yakub.
    reason: lexical_alternative
  - marker: c
    text: “Roti” juga dapat dipakai dalam arti yang lebih luas, yaitu makanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: Lalu Yakub mengucapkan nazar
  rationale: Konstruksi verba dan nomina serumpun menyatakan tindakan bernazar secara resmi. ‘Mengucapkan nazar’ alami dalam bahasa Indonesia dan tetap menyatakan nazar itu secara eksplisit.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan isi nazar dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk syarat dalam bahasa Ibrani tanpa mengubahnya menjadi kepastian ataupun keraguan yang lebih kuat.
- source_word: אֱלֹהִים עִמָּדִי
  choice: Allah menyertai aku
  rationale: Menyampaikan kehadiran ilahi secara alami; dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang menampakkan diri kepada Yakub.
- source_word: וּשְׁמָרַנִי
  choice: menjaga aku
  rationale: שׁמר di sini menyatakan penjagaan atau perlindungan selama perjalanan.
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: dalam perjalanan yang sedang kutempuh ini
  rationale: דֶּרֶךְ secara harfiah berarti jalan, tetapi dalam konteks perjalanan Yakub, ‘perjalanan’ menyampaikan maksudnya secara alami. Klausa relatif dan aspek gerak yang sedang berlangsung tetap dipertahankan.
- source_word: וְנָתַן לִי
  choice: serta memberiku
  rationale: Melanjutkan rangkaian syarat secara lancar dalam bahasa Indonesia.
- source_word: לֶחֶם לֶאֱכֹל
  choice: makanan untuk dimakan
  rationale: לֶחֶם dapat berarti roti secara khusus atau makanan secara lebih luas. Dalam pasangan dengan pakaian sebagai kebutuhan pokok, ‘makanan’ paling alami dalam bahasa Indonesia.
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: dan pakaian untuk dikenakan
  rationale: Menerjemahkan pasangan nomina dan infinitif secara jelas serta bermartabat.
theological_decisions:
- issue: Sifat bersyarat nazar Yakub
  choice: Jika Allah menyertai aku
  alternative: Ketika Allah menyertai aku / Karena Allah akan menyertai aku
  rationale: Partikel אִם secara wajar berarti ‘jika’. Terjemahan mempertahankan ketegangan teks mengenai sikap Yakub tanpa menafsirkannya sebagai kepastian ataupun keraguan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Aku’ dipakai sesuai tuturan langsung Alkitabiah yang tetap umum dipahami. Kalimat sengaja berakhir dengan koma karena ayat ini hanya memuat bagian awal nazar yang berlanjut pada ayat berikutnya.
