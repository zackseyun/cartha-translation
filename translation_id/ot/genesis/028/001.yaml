  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: id
  text: Kemudian Ishak memanggil Yakub, memberkatinya, dan memerintahkannya, “Janganlah engkau mengambil istri dari antara perempuan Kanaan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִצְחָק אֶל יַעֲקֹב
  choice: Kemudian Ishak memanggil Yakub
  rationale: קרא אל dengan orang sebagai objek berarti memanggil atau menyuruh datang. “Memanggil” alami dalam narasi Indonesia dan tidak menambahkan tingkat formalitas.
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: memberkatinya
  rationale: ברך secara langsung berarti “memberkati”; akhiran objek merujuk kepada Yakub.
- source_word: וַיְצַוֵּהוּ
  choice: dan memerintahkannya
  rationale: צוה menyatakan perintah yang berwibawa. “Memerintahkannya” mempertahankan daya perintah ayah kepada anaknya.
- source_word: וַיֹּאמֶר לוֹ
  choice: tidak diterjemahkan secara terpisah sebelum kutipan langsung
  rationale: Rangkaian “memerintahkannya dan berkata kepadanya” terasa berulang dalam bahasa Indonesia. Tanda baca dan kutipan langsung secara alami menjalankan fungsi pengantar ujaran tanpa menghilangkan isi.
- source_word: לֹא תִקַּח אִשָּׁה
  choice: Janganlah engkau mengambil istri
  rationale: Bentuk negatif ini merupakan larangan langsung. “Janganlah engkau” dignified dan tegas; dalam konteks perkawinan, אשה berarti “istri,” sedangkan לקח mempertahankan ungkapan sumber “mengambil istri.”
- source_word: מִבְּנוֹת כְּנָעַן
  choice: dari antara perempuan Kanaan
  rationale: Secara harfiah “dari anak-anak perempuan Kanaan,” tetapi ungkapan itu menunjuk kepada perempuan dari penduduk Kanaan. “Perempuan Kanaan” menyampaikan makna idiomatis secara alami tanpa mengubahnya menjadi nama denominasi atau penafsiran tambahan.
