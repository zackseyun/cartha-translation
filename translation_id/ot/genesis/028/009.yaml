  text: וַ/יֵּ֥לֶךְ עֵשָׂ֖ו אֶל יִשְׁמָעֵ֑אל וַ/יִּקַּ֡ח אֶֽת מָחֲלַ֣ת בַּת יִשְׁמָעֵ֨אל בֶּן אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל נָשָׁ֖י/ו ל֥/וֹ לְ/אִשָּֽׁה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: id
  text: Lalu Esau pergi kepada Ismael dan mengambil Mahalat, anak perempuan Ismael, anak Abraham, dan saudara perempuan Nebayot, sebagai istrinya di samping istri-istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas istri-istrinya”; dalam konteks ini maksudnya ialah bahwa Mahalat menjadi istri tambahan di samping istri-istri Esau yang sudah ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Lalu ... pergi
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi; “lalu” dan “pergi” menyampaikannya secara wajar tanpa menambah penekanan.
- source_word: אֶל יִשְׁמָעֵאל
  choice: kepada Ismael
  rationale: Preposisi אֶל menunjukkan arah gerak menuju seseorang. Ungkapan ini dipertahankan tanpa menganggap bahwa Ismael sendiri pasti masih hidup atau bahwa yang dimaksud hanyalah kaumnya.
- source_word: וַיִּקַּח
  choice: dan mengambil
  rationale: לקח secara harfiah berarti “mengambil”; frasa berikutnya, “menjadi istrinya,” memperjelas bahwa tindakan itu adalah perkawinan.
- source_word: מָחֲלַת
  choice: Mahalat
  rationale: Nama diri ditransliterasikan ke bentuk yang wajar dalam bahasa Indonesia.
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: anak perempuan Ismael bin Abraham
  rationale: Rangkaian konstruksi ini menyatakan silsilah Mahalat secara ringkas dan jelas.
- source_word: אֲחוֹת נְבָיוֹת
  choice: saudara perempuan Nebayot
  rationale: Frasa aposisional ini mengidentifikasi Mahalat lebih lanjut dengan hubungan keluarganya.
- source_word: עַל נָשָׁיו
  choice: di samping istri-istrinya yang sudah ada
  rationale: 'Dalam konteks ini עַל menyatakan penambahan: Mahalat menjadi istri tambahan, bukan pengganti istri-istri Esau sebelumnya. Kata “yang sudah ada” membuat hubungan temporal itu jelas dalam bahasa Indonesia.'
- source_word: לוֹ לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Ungkapan Ibrani ini menyatakan tujuan atau hasil pengambilan Mahalat, yakni sebagai istri bagi Esau; bentuk Indonesia ini alami sekaligus mempertahankan nuansa kepemilikan לוֹ.
