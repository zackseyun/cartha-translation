id: GEN.28.4
reference: Genesis 28:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: id
  text: Kiranya Dia memberikan kepadamu berkat Abraham, kepadamu dan kepada keturunanmu yang bersamamu[a], supaya engkau memiliki negeri tempat engkau tinggal sebagai pendatang[b], yang telah Allah berikan kepada Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu yang bersamamu”; kata Ibrani yang diterjemahkan “keturunan” berbentuk tunggal, tetapi bermakna kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “supaya engkau mewarisi negeri tempat engkau tinggal sebagai pendatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִתֶּן
  choice: Kiranya Dia memberikan
  rationale: Bentuk yusif dalam konteks pemberkatan menyatakan harapan atau doa. Kata sambung וְ dipahami sebagai kelanjutan alur berkat dan tidak perlu diterjemahkan secara kaku dengan “dan”.
- source_word: בִּרְכַּת אַבְרָהָם
  choice: berkat Abraham
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan tetap mempertahankan kaitannya dengan janji perjanjian kepada Abraham.
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: kepadamu dan kepada keturunanmu yang bersamamu
  rationale: Ungkapan “yang bersamamu” dipertahankan karena terdapat dalam teks Ibrani, meskipun terdengar tidak lazim, dan menghubungkan garis keturunan Yakub dengannya.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע berbentuk tunggal tetapi dapat bermakna kolektif. “Keturunanmu” merupakan padanan alami dalam bahasa Indonesia tanpa membatasi jumlah.
- source_word: לְרִשְׁתְּךָ
  choice: supaya engkau memiliki
  rationale: Infinitif dengan לְ menyatakan tujuan atau hasil. “Memiliki” menyampaikan gagasan memperoleh dan memegang negeri itu, sedangkan “mewarisi” tetap merupakan kemungkinan kontekstual.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: negeri tempat engkau tinggal sebagai pendatang
  rationale: מָגוּר menunjuk pada tempat tinggal sementara sebagai orang asing atau pendatang. Rumusan ini lebih jelas dan alami daripada terjemahan nominal yang kaku.
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: yang telah Allah berikan kepada Abraham
  rationale: Klausa relatif diterjemahkan langsung; aspek selesai dari tindakan pemberian dinyatakan secara alami dengan “telah”.
theological_decisions:
- issue: Nuansa perjanjian dalam berkat Abraham dan pemberian negeri
  choice: Mempertahankan ungkapan “berkat Abraham” dan bahasa kepemilikan negeri tanpa menguraikannya sebagai kemakmuran umum.
  alternative: “berkat yang dijanjikan kepada Abraham” dan “supaya engkau mewarisi negeri”
  rationale: Teks secara langsung mengaitkan berkat atas Yakub dengan janji kepada Abraham. Terjemahan menjaga kaitan itu sekaligus tidak menambahkan penjelasan teologis yang tidak dinyatakan.
- issue: Rujukan subjek pada וְיִתֶּן
  choice: Dia
  alternative: Allah
  rationale: Teks Ibrani memakai bentuk verba orang ketiga yang merujuk kepada Allah yang disebut dalam konteks sebelumnya. Kata ganti mempertahankan hubungan antarayat tanpa mengganti subjek tersirat dengan nomina.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai sesuai konteks berkat langsung seorang ayah kepada anaknya. Struktur yang agak tidak lazim pada “yang bersamamu” sengaja dipertahankan untuk mencerminkan teks sumber, sementara “tinggal sebagai pendatang” menjelaskan motif menetap sebagai orang asing secara alami.
