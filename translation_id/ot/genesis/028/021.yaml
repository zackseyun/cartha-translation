source:
  edition: WLC
  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: id
  text: dan aku kembali dengan selamat ke rumah ayahku[a], dan Yahweh akan menjadi Allahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam damai.” Ungkapan Ibrani ini juga dapat berarti pulang dengan selamat atau dalam keadaan sejahtera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: dan aku kembali
  rationale: Berasal dari שׁוב, 'kembali'. Dalam rangkaian syarat nazar Yakub yang dimulai pada ayat sebelumnya, bentuk ini secara alami menyatakan kepulangan yang masih diharapkan.
- source_word: בְשָׁלוֹם
  choice: dengan selamat
  rationale: שָׁלוֹם mencakup damai, kesejahteraan, keutuhan, dan keselamatan. Dalam konteks perjalanan pulang, 'dengan selamat' menyampaikan maksud kontekstual secara alami, sementara cakupan harfiahnya dicatat dalam catatan kaki.
- source_word: אֶל בֵּית אָבִי
  choice: ke rumah ayahku
  rationale: Ungkapan konstruksi ini menunjuk pada rumah atau rumah tangga ayah Yakub; 'ke rumah ayahku' alami dan dekat dengan bentuk Ibrani.
- source_word: וְהָיָה
  choice: dan ... akan menjadi
  rationale: Konjungsi וְ diterjemahkan langsung sebagai 'dan', sedangkan bentuk היה dalam rangkaian nazar berorientasi ke masa depan. Ini mempertahankan hubungan dengan syarat sebelumnya tanpa menambahkan kata 'maka' yang tidak tersurat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לִי לֵאלֹהִים
  choice: menjadi Allahku
  rationale: Secara harfiah, 'menjadi bagiku sebagai Allah'; bentuk posesif Indonesia menyampaikan relasi dan pengakuan yang dimaksud secara wajar.
theological_decisions:
- issue: Apakah pernyataan Yakub menyiratkan penerimaan bersyarat terhadap Yahweh atau sekadar pengakuan dalam nazar
  choice: Mempertahankan bentuk 'dan Yahweh akan menjadi Allahku' dalam rangkaian syarat dari ayat sebelumnya.
  alternative: Membuat akibat syarat itu eksplisit dengan 'maka Yahweh akan menjadi Allahku', atau mengubahnya menjadi pengakuan tanpa nuansa bersyarat.
  rationale: Teks Ibrani memakai konjungsi 'dan' dan berada dalam rangkaian nazar bersyarat. Terjemahan ini mempertahankan ketegangan tersebut tanpa mempertegas ataupun meniadakannya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Dengan selamat' dipilih karena paling idiomatis untuk konteks kepulangan, dengan nuansa lebih luas dari שָׁלוֹם dipertahankan melalui catatan kaki.
