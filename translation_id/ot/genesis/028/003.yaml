base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: id
  text: Kiranya Allah Yang Mahakuasa memberkati engkau[a], membuat engkau subur, dan memperbanyak keturunanmu, sehingga engkau menjadi himpunan bangsa-bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: El Syaddai; secara tradisional diterjemahkan “Allah Yang Mahakuasa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi dengan padanan Indonesia yang mapan dan alami; bentuk Ibraninya dicantumkan dalam catatan kaki.
- source_word: יְבָרֵךְ
  choice: Kiranya ... memberkati
  rationale: Bentuk imperfek berfungsi sebagai jusif dalam konteks berkat, sehingga 'kiranya' menyampaikan doa atau harapan, bukan sekadar pernyataan masa depan.
- source_word: וְיַפְרְךָ
  choice: membuat engkau beranak cucu
  rationale: Bentuk Hifil bersifat kausatif. Dalam konteks berkat leluhur, ungkapan ini secara alami menunjuk pada hadirnya keturunan.
- source_word: וְיַרְבֶּךָ
  choice: menjadikan keturunanmu banyak
  rationale: Bentuk Hifil menyatakan pertambahan jumlah. Penyebutan 'keturunanmu' membuat maksud idiomatisnya jelas dalam bahasa Indonesia tanpa mengubah arah berkat.
- source_word: וְהָיִיתָ
  choice: sehingga engkau menjadi
  rationale: Dalam rangkaian berkat ini, bentuk tersebut paling alami dipahami sebagai hasil dari tindakan-tindakan sebelumnya.
- source_word: לִקְהַל עַמִּים
  choice: sekumpulan bangsa
  rationale: קהל menunjuk pada kelompok atau himpunan, sedangkan bentuk jamak עמים dipertahankan sebagai 'bangsa', bukan sekadar banyak orang.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  alternative: El Syaddai
  rationale: Gelar diterjemahkan agar langsung dipahami pembaca Indonesia, sementara bentuk transliterasinya dipertahankan dalam catatan kaki tanpa memaksakan penjelasan etimologis yang tidak pasti.
- issue: Cakupan berkat pertambahan
  choice: membuat engkau beranak cucu, dan menjadikan keturunanmu banyak
  alternative: membuat engkau berbuah dan memperbanyak engkau
  rationale: Konteks berkat kepada Yakub mengarah pada keturunan; pilihan idiomatis ini menyampaikan makna tersebut tanpa memasukkan rincian doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'engkau' dipakai sesuai konteks tutur langsung dalam berkat leluhur; struktur dibuat alami tanpa menghilangkan nuansa doa pada bentuk jusif.
