  terminology: “Allah Yang Mahakuasa” merupakan padanan yang wajar untuk אֵל שַׁדַּי dan catatan kaki mempertahankan bentuk Ibraninya. “Bangsa-bangsa” mempertahankan bentuk jamak עַמִּים dengan lebih jelas daripada “bangsa.”
