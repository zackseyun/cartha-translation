base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: id
  text: Ia takut lalu berkata, “Alangkah dahsyatnya tempat ini![a] Ini tidak lain adalah rumah Allah, dan inilah gerbang surga.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Betapa menggentarkannya tempat ini!” Kata Ibrani yang digunakan dapat mengungkapkan rasa takut, gentar, atau takjub penuh hormat.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “gerbang langit-langit.” Dalam bahasa Indonesia, “surga” dipakai di sini untuk ranah ilahi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: Ia takut
  rationale: Bentuk naratif dari ירא menyatakan reaksi Yakub berupa rasa takut. Pilihan ini lugas dan tidak membatasi maknanya hanya pada sikap hormat.
- source_word: מַה נּוֹרָא
  choice: Alangkah dahsyatnya
  rationale: נוֹרָא dapat menunjuk pada sesuatu yang menimbulkan rasa takut sekaligus takjub dan hormat. Dalam bahasa Indonesia, “dahsyat” mempertahankan ketegangan makna itu, sedangkan “menakjubkan” cenderung menghilangkan unsur takut.
- source_word: הַמָּקוֹם הַזֶּה
  choice: tempat ini
  rationale: Padanan langsung dan alami bagi frasa penunjuk Ibrani tersebut.
- source_word: אֵין זֶה כִּי אִם
  choice: Ini tidak lain adalah
  rationale: Ungkapan ini menyatakan identifikasi yang tegas dan eksklusif; “tidak lain adalah” mempertahankan penekanannya dalam bahasa Indonesia yang wajar.
- source_word: בֵּית אֱלֹהִים
  choice: rumah Allah
  rationale: Padanan transparan bagi frasa konstruksi Ibrani, dengan nada sakral tanpa menyiratkan bahwa bangunan tempat ibadah sudah berdiri di lokasi itu.
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: gerbang surga
  rationale: Dalam konteks penglihatan dan kehadiran ilahi, שָׁמַיִם menunjuk pada ranah surgawi. “Gerbang surga” alami bagi pembaca Indonesia dan mempertahankan gambaran jalan masuk antara bumi dan ranah ilahi.
theological_decisions:
- issue: Makna אֱלֹהִים dalam konteks dengan rujukan tunggal
  choice: Allah
  alternative: ilah-ilah
  rationale: Walaupun bentuk katanya secara morfologis jamak, konteks penglihatan dan perjanjian dengan Yakub dengan jelas menunjuk kepada Allah yang tunggal.
- issue: Nuansa נוֹרָא dalam suasana sakral
  choice: dahsyat
  alternative: menakjubkan; menggentarkan
  rationale: Ayat ini menyatukan rasa takut dan ketakjuban di hadapan kehadiran ilahi. “Dahsyat” membiarkan kedua nuansa itu tetap hadir tanpa mereduksinya menjadi teror semata atau kekaguman biasa.
- issue: Rujukan שָׁמַיִם
  choice: surga
  alternative: langit; langit-langit
  rationale: Konteks tangga, malaikat, dan kehadiran Allah menunjukkan ranah ilahi, bukan semata-mata langit yang terlihat. Catatan kaki mempertahankan bentuk ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Alangkah” mempertahankan bentuk seruan, sedangkan “dahsyat” cukup alami bagi pembaca umum dan menjaga perpaduan rasa takut serta takjub dalam teks Ibrani.
