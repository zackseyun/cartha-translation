  text: וַ/יִּפְגַּ֨ע בַּ/מָּק֜וֹם וַ/יָּ֤לֶן שָׁם֙ כִּי בָ֣א הַ/שֶּׁ֔מֶשׁ וַ/יִּקַּח֙ מֵ/אַבְנֵ֣י הַ/מָּק֔וֹם וַ/יָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑י/ו וַ/יִּשְׁכַּ֖ב בַּ/מָּק֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: id
  text: Ia tiba di suatu tempat dan bermalam di sana[a], karena matahari telah terbenam. Ia mengambil salah satu batu dari tempat itu[b], menaruhnya di bawah kepalanya[c], lalu berbaring di tempat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tempat itu” pada penyebutan pertama. “Di suatu tempat” dipakai agar alami dalam bahasa Indonesia, sementara konteks selanjutnya menunjukkan bahwa tempat itu penting.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Ia mengambil beberapa batu dari tempat itu.” Ungkapan Ibrani memakai bentuk partitif dengan kata benda jamak dan dapat dipahami sebagai satu batu dari antara batu-batu atau sebagai beberapa batu.
    reason: alternative_reading
  - marker: c
    text: Atau, “di dekat kepalanya” atau “sebagai alas kepalanya.” Istilah Ibrani menunjuk tempat di bagian kepala atau alas kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע
  choice: sampai
  rationale: Dalam konteks perjalanan, פגע dengan penanda tempat menyatakan tiba atau sampai di suatu lokasi; pilihan ini alami dan tidak menambahkan kesan kebetulan yang tidak harus ada.
- source_word: בַּמָּקוֹם
  choice: di suatu tempat
  rationale: Teks Ibrani secara harfiah memakai bentuk tertentu, 'di tempat itu/tersebut', tetapi ini adalah penyebutan pertama. 'Di suatu tempat' alami dalam bahasa Indonesia, sementara pengulangan selanjutnya tetap menandai pentingnya lokasi tersebut.
- source_word: וַיָּלֶן
  choice: bermalam
  rationale: לון berarti tinggal semalam; 'bermalam' ringkas, alami, dan tepat dalam narasi perjalanan.
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: karena matahari telah terbenam
  rationale: בוא ketika digunakan tentang matahari merupakan ungkapan bagi terbenamnya matahari. 'Telah terbenam' memperjelas bahwa hal itu menjadi alasan ia berhenti.
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: Ia mengambil sebuah dari antara batu-batu di tempat itu
  rationale: מִן dengan bentuk jamak bersifat partitif. Terjemahan ini mempertahankan bentuk jamak 'batu-batu' sekaligus menyampaikan pembacaan lazim bahwa satu batu diambil, tanpa menutupi kemungkinan pembacaan lain.
- source_word: מְרַאֲשֹׁתָיו
  choice: di bawah kepalanya
  rationale: Kata ini menunjuk tempat di bagian kepala atau alas kepala. Dalam konteks ini, 'di bawah kepalanya' merupakan ungkapan Indonesia yang alami bagi fungsi batu tersebut.
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Kata kerja ini menyatakan tindakan merebahkan diri. 'Berbaring' tidak melampaui teks dengan secara eksplisit menyatakan bahwa ia langsung tidur.
- source_word: בַּמָּקוֹם הַהוּא
  choice: di tempat itu
  rationale: Pengulangan 'tempat' dipertahankan karena lokasi tersebut penting bagi perkembangan narasi.
