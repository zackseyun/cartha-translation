  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: id
  text: 'Lalu ia bermimpi: tampaklah sebuah tangga[a] berdiri di bumi, dan puncaknya mencapai langit. Tampaklah malaikat-malaikat Allah naik dan turun di atasnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat menunjuk secara lebih umum kepada sarana atau bangunan untuk naik; bentuknya tidak harus berupa tangga berpalang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “padanya” atau “di atasnya”; kata ganti Ibrani itu mungkin juga dipahami sebagai “pada dia,” yakni pada Yakub, meskipun dalam konteks ini acuan yang paling alami adalah tangga.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: Lalu ia bermimpi
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara wajar dalam bahasa Indonesia tanpa menambahkan isi.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini menghadirkan pemandangan mimpi secara hidup. “Tampaklah” mempertahankan daya retorisnya dalam ragam Indonesia yang bermartabat.
- source_word: סֻלָּם
  choice: tangga
  rationale: Istilah Ibrani menunjuk sarana atau bangunan untuk naik dan turun, tetapi bentuk tepatnya tidak pasti. “Tangga” merupakan padanan Indonesia yang alami dan tidak mengharuskan gambaran tangga bertingkat tertentu.
- source_word: מֻצָּב אַרְצָה
  choice: berdiri di bumi
  rationale: Partisip pasif נצב menggambarkan sesuatu yang ditempatkan dan berada tegak; frasa ini menyampaikan keadaan tersebut sekaligus mempertahankan kontras kosmis antara bumi dan langit.
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: dan puncaknya mencapai langit
  rationale: “Puncak” merupakan padanan idiomatis bagi רֹאשׁ ketika merujuk bagian teratas suatu benda, sedangkan bentuk berarah הַשָּׁמָיְמָה menyatakan jangkauan ke langit.
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: malaikat-malaikat Allah
  rationale: Dalam konteks penglihatan ini yang dimaksud adalah makhluk surgawi, sehingga “malaikat-malaikat Allah” lebih tepat daripada istilah umum “utusan-utusan Allah.”
- source_word: עֹלִים וְיֹרְדִים
  choice: naik dan turun
  rationale: Kedua partisip menggambarkan gerakan yang berlangsung dalam mimpi; bentuk Indonesia ini ringkas dan alami.
- source_word: בּוֹ
  choice: melaluinya
  rationale: Akhiran maskulin tunggal paling wajar mengacu kepada סֻלָּם. “Melaluinya” menyatakan gerakan dengan atau pada sarana itu tanpa memaksakan rincian fisik yang tidak disebutkan.
theological_decisions:
- issue: Gambaran סֻלָּם
  choice: tangga
  alternative: undak-undakan; tangga bersusun
  rationale: Kata Ibrani tidak memastikan apakah sarana itu berupa tangga berpalang, tangga batu, atau bangunan pendakian lain. Istilah umum “tangga” mempertahankan keterbukaan gambaran tersebut.
- issue: Acuan בּוֹ
  choice: melaluinya, mengacu kepada tangga
  alternative: padanya, mengacu kepada Yakub
  rationale: Secara gramatikal, akhiran pronominal dapat diterjemahkan “padanya,” tetapi anteseden terdekat dan paling alami dalam konteks ialah tangga. Kemungkinan acuan kepada Yakub tetap dicatat agar ambiguitas asli tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Tampaklah” dipakai untuk mempertahankan vividitas וְהִנֵּה tanpa memakai bentuk arkais “sesungguhnya.” Kedua kemunculan partikel itu diterjemahkan. Penanda catatan kaki [a] dan [b] ditempatkan tepat pada unsur yang diterangkan.
