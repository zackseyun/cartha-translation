  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: id
  text: 'Inilah jumlah tahun kehidupan Ismael: seratus tiga puluh tujuh tahun. Lalu ia mengembuskan napas terakhir[a] dan mati, dan dikumpulkan kepada kaumnya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia mengembuskan napasnya yang terakhir.” Kata kerja Ibrani di sini berbeda dari kata berikutnya, “mati”; karena itu, keduanya dipertahankan dalam terjemahan.
    reason: lexical_alternative
  - marker: b
    text: “Dikumpulkan kepada kaumnya” adalah ungkapan Ibrani dalam pemberitahuan kematian. Ungkapan ini dapat merujuk pada perhimpunan dengan para pendahulu, penguburan bersama sanak keluarga, atau keduanya.
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: Inilah jumlah tahun kehidupan Ismael
  rationale: Ungkapan ini memperkenalkan rangkuman usia Ismael. Kata “jumlah” membuat idiom Ibrani tentang tahun-tahun kehidupan terasa wajar dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: seratus tiga puluh tujuh tahun
  rationale: Susunan bilangan Ibrani dialihkan ke bentuk bilangan baku dan alami dalam bahasa Indonesia dengan mempertahankan jumlah tepatnya.
- source_word: וַיִּגְוַע
  choice: ia mengembuskan napas terakhir
  rationale: Pilihan ini mempertahankan nuansa גוע sebagai berakhirnya napas atau hayat dan membedakannya dari kata kerja berikutnya, וַיָּמָת, “mati”.
- source_word: וַיָּמָת
  choice: dan mati
  rationale: Kata kerja kematian yang kedua tetap diterjemahkan secara tersendiri agar pengulangan bermakna dalam teks Ibrani tidak dihilangkan.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: dan dikumpulkan kepada kaumnya
  rationale: Rumusan kematian Ibrani dipertahankan sebagai idiom, termasuk ketaksaan apakah yang dimaksud ialah penguburan bersama sanak keluarga, perhimpunan dengan para pendahulu setelah kematian, atau keduanya.
theological_decisions:
- issue: Makna rumusan kematian “dikumpulkan kepada kaumnya”
  choice: Mempertahankan ungkapan idiomatis tanpa menentukan satu penafsiran khusus
  alternative: Menafsirkannya secara eksplisit sebagai dikuburkan bersama leluhur atau bersatu kembali dengan leluhur setelah kematian
  rationale: Bahasa Ibrani tidak memastikan apakah ungkapan itu hanya menunjuk pada penguburan, pada perhimpunan anumerta dengan kaum terdahulu, atau pada keduanya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Ismael” mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Pengulangan dua kata kerja kematian dipertahankan, sedangkan idiom penutup sengaja tidak diperjelas secara teologis.
