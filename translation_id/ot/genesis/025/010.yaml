  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: id
  text: ladang yang dibeli Abraham dari keturunan Het itu—di sanalah Abraham dan Sara, istrinya, dikuburkan[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "orang Het" untuk "keturunan Het". Ungkapan Ibraninya secara harfiah berarti "anak-anak lelaki Het" dan dapat menunjuk kepada kelompok etnis Het.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, verba "dikuburkan" berbentuk tunggal dan mendahului "Abraham dan Sara, istrinya"; susunan ini lazim dalam bahasa Ibrani dan mengacu kepada keduanya.
    reason: source_grammar
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: ladang
  rationale: Nomina definit yang menunjuk kembali kepada tanah milik yang dijadikan tempat pemakaman; 'ladang' merupakan padanan langsung dan wajar dalam konteks.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif yang memperkenalkan klausa penjelas bagi 'ladang'.
- source_word: קָנָה
  choice: dibeli
  rationale: Dalam konteks transaksi tanah, verba ini menyatakan pembelian; bentuk pasif membuat frasa relatif alami dalam bahasa Indonesia.
- source_word: מֵאֵת
  choice: dari
  rationale: Preposisi ini menandai pihak asal dalam transaksi; 'dari' menyampaikan maknanya secara idiomatis.
- source_word: בְּנֵי חֵת
  choice: keturunan Het
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak lelaki Het', tetapi dalam konteks ini menunjuk kelompok keturunan atau etnis; 'keturunan Het' mempertahankan hubungan dengan nama Het tanpa terdengar janggal.
- source_word: שָׁמָּה
  choice: di sanalah
  rationale: Adverbia lokatif merujuk secara tegas kepada ladang tersebut; partikel '-lah' menandai fokus lokatif dalam konstruksi topik.
- source_word: קֻבַּר
  choice: dikuburkan
  rationale: Bentuk pasif dari verba 'menguburkan'; predikat tunggal Ibrani mendahului subjek majemuk, sedangkan bahasa Indonesia dapat menerapkannya secara alami kepada Abraham dan Sara bersama-sama.
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: dan Sara, istrinya
  rationale: Mengikuti urutan unsur Ibrani sambil memakai tanda koma agar aposisi kepemilikan jelas dan alami.
