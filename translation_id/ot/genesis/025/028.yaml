base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: id
  text: Ishak mengasihi Esau karena hasil buruan ada di mulutnya[a], tetapi Ribka mengasihi Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “karena hasil buruan ada di mulutnya.” Ungkapan ini kemungkinan berarti Ishak lebih menyukai Esau karena ia menikmati hasil buruan yang disediakan Esau.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: mengasihi
  rationale: Bentuk Qal wayyiqtol dari אָהַב menyatakan tindakan atau keadaan dalam narasi lampau. Bahasa Indonesia tidak wajib menandai kala pada verba; konteks naratif sudah menunjukkan waktunya.
- source_word: אֶת עֵשָׂו
  choice: Esau
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan Ishak mengasihi Esau.
- source_word: צַיִד
  choice: hasil buruan
  rationale: צַיִד menunjuk pada hewan atau makanan yang diperoleh melalui berburu. 'Hasil buruan' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi daging rusa.
- source_word: בְּפִיו
  choice: ada di mulutnya
  rationale: Ungkapan Ibrani secara harfiah berarti 'di mulutnya'. Terjemahan mempertahankan gambaran konkret dan ambiguitas rujukan pronomina, sementara catatan kaki menjelaskan makna yang paling mungkin.
- source_word: וְרִבְקָה
  choice: tetapi Ribka
  rationale: 'Walaupun וְ secara dasar berarti ''dan'', hubungan antarklausa bersifat kontras: Ishak mengasihi Esau, sedangkan Ribka mengasihi Yakub. ''Tetapi'' menyatakan kontras itu secara alami.'
- source_word: אֹהֶבֶת
  choice: mengasihi
  rationale: Partisipel ini dapat menyatakan keadaan atau tindakan yang berlangsung atau menjadi ciri. Dalam narasi Indonesia, 'mengasihi' alami dan sejajar dengan klausa pertama.
- source_word: אֶת יַעֲקֹב
  choice: Yakub
  rationale: Penanda objek langsung אֶת tidak diterjemahkan; nama diri memakai bentuk Indonesia yang lazim.
