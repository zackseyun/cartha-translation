  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: id
  text: Yakub memberikan roti dan rebusan kacang lentil[a] kepada Esau. Esau pun makan dan minum, lalu bangkit dan pergi. Demikianlah Esau meremehkan[b] hak kesulungan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “masakan kacang lentil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “memandang rendah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן
  choice: memberikan
  rationale: Padanan umum dan langsung untuk tindakan Yakub, tanpa menambahkan gagasan pertukaran yang tidak dinyatakan oleh verba itu sendiri.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna konkret 'roti' paling sesuai karena disebut berdampingan dengan hidangan kacang lentil.
- source_word: נְזִיד עֲדָשִׁים
  choice: rebusan kacang lentil
  rationale: Frasa konstruksi ini menunjuk pada hidangan yang dimasak dari kacang lentil; pilihan ini mempertahankan jenis bahan dan bentuk hidangannya tanpa menganggapnya sebagai sup encer.
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: Esau pun makan dan minum, lalu bangkit dan pergi
  rationale: Rangkaian verba tindakan tetap disajikan secara singkat dan berurutan. Nama Esau diulang agar rujukan pronomina jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּבֶז
  choice: meremehkan
  rationale: Verba ini menyatakan sikap memandang rendah atau tidak menghargai. 'Meremehkan' kuat, ringkas, dan wajar dalam bahasa Indonesia modern.
- source_word: הַבְּכֹרָה
  choice: hak kesulungan itu
  rationale: Istilah ini menunjuk pada kedudukan beserta hak istimewa anak sulung yang sedang dibicarakan; 'itu' mencerminkan bentuk tertentu dalam konteks.
theological_decisions:
- issue: Penilaian narator terhadap sikap Esau kepada hak kesulungan
  choice: Demikianlah Esau meremehkan hak kesulungan itu
  alternative: Dengan demikian, Esau memandang rendah hak kesulungan itu
  rationale: '''Demikianlah'' mempertahankan fungsi kalimat penutup sebagai simpulan dari tindakan Esau, sedangkan ''meremehkan'' menyampaikan penilaian moral teks tanpa menjelaskan motif yang tidak disebutkan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Susunan tindakan dibuat ringkas untuk mempertahankan laju cepat teks Ibrani, dengan tingkat keformalan yang tetap mudah dipahami.
