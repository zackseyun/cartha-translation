  text: Hadad, Tema, Yetur, Nafish, dan Kedma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: Hadad
  rationale: Nama diri ditransliterasikan sesuai bentuk konsonantal teks Ibrani.
- source_word: תֵימָא
  choice: Tema
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami dan lazim dibaca dalam bahasa Indonesia; alef akhir tidak perlu diwakili dengan huruf tambahan.
- source_word: יְטוּר
  choice: Yetur
  rationale: Yod awal diwakili dengan 'Y', sesuai kaidah transliterasi nama Ibrani ke dalam bahasa Indonesia.
- source_word: נָפִישׁ
  choice: Nafis
  rationale: Pe di sini tidak berdages dilafalkan sebagai /f/, sedangkan syin diwakili dengan 's' agar bentuk nama mudah dibaca dalam ejaan Indonesia.
- source_word: קֵדְמָה
  choice: Kedma
  rationale: Nama diri ditransliterasikan secara ringkas sesuai pelafalan Ibrani; he akhir tidak perlu ditampilkan karena berfungsi sebagai penanda vokal akhir.
- source_word: וְ / וָ
  choice: dan
  rationale: Konjungsi Ibrani menghubungkan unsur-unsur dalam daftar; dalam bahasa Indonesia digunakan koma dan 'dan' sebelum nama terakhir.
theological_decisions: []
translation_notes:
  register: Daftar nama disajikan secara ringkas dengan ejaan Indonesia modern. Tidak ditambahkan catatan alternatif 'Temah' karena itu merupakan persoalan transliterasi bahasa Inggris, bukan varian dalam teks Ibrani.
