  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: id
  text: Kata Yakub, “Juallah kepadaku hak kesulunganmu hari ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai hari ini” atau “pada hari ini,” yang menekankan transaksi yang segera dan mengikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia modern, “Kata Yakub” menyampaikan fungsi naratifnya secara alami tanpa harus menerjemahkan waw secara harfiah.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi ini memakai bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מִכְרָה
  choice: Juallah
  rationale: Imperatif dari מכר berarti “jual.” Partikel -lah membuat perintah langsung ini alami dan tegas dalam bahasa Indonesia.
- source_word: כַיּוֹם
  choice: hari ini
  rationale: Ungkapan ini dapat berarti “hari ini” atau “mulai hari ini/pada hari ini,” dengan penekanan pada transaksi yang segera dan mengikat. “Hari ini” adalah padanan utama yang ringkas dan alami; nuansa alternatif dicatat dalam catatan kaki.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: אֶת menandai objek langsung tertentu dan tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: בְּכֹרָתְךָ
  choice: hak kesulunganmu
  rationale: בְּכֹרָה menunjuk pada hak dan kedudukan sebagai anak sulung. “Hak kesulungan” merupakan istilah Indonesia yang mapan, tepat, dan sesuai konteks.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi לִי menunjukkan penerima transaksi. Dengan verba “jual,” bentuk “juallah kepadaku” alami dan mempertahankan penekanan eksplisit bahwa hak itu dialihkan kepada Yakub.
