  naturalness: Teks umumnya alami dan berregister baik. “Di dalam kandungannya” lebih idiomatis dan jelas dalam bahasa Indonesia modern, sedangkan “ia pergi untuk meminta petunjuk” memperbaiki kelancaran konstruksi penutup.
  terminology: “Yahweh” tepat untuk יהוה sesuai kebijakan yang diberikan. “Meminta petunjuk kepada” secara memadai menyampaikan דרש dalam konteks meminta jawaban ilahi.
