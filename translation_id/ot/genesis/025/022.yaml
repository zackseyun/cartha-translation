    rationale: Ungkapan Ibrani memang eliptis dan dapat dibaca lebih harfiah “mengapa aku?”, tetapi parafrasa tersebut melangkah lebih jauh daripada alternatif yang perlu dipertahankan. Catatan direvisi untuk menyatakan ambiguitas tanpa memutuskan penafsiran.
