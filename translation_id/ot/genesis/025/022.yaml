base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: id
  text: Anak-anak itu saling berdesakan di dalam kandungannya. Lalu ia berkata, “Jika demikian, mengapa aku begini?”[a] Maka ia pergi untuk meminta petunjuk kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengapa aku demikian?” Ungkapan Ibrani ini eliptis dan secara lebih harfiah dapat diterjemahkan, “mengapa aku?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: saling bergumul
  rationale: Bentuk hitpael menyatakan gerakan timbal balik dan intensif antara kedua anak. “Saling bergumul” mempertahankan nuansa konflik tanpa melebih-lebihkannya.
- source_word: הַבָּנִים
  choice: anak-anak itu
  rationale: Kata ini secara harfiah dapat berarti “anak-anak lelaki”, tetapi pada tahap sebelum kelahiran, “anak-anak” lebih wajar dalam bahasa Indonesia; jenis kelamin mereka dinyatakan dalam ayat berikutnya.
- source_word: בְּקִרְבָּהּ
  choice: di dalam dirinya
  rationale: Ungkapan Ibrani secara harfiah menunjuk ke bagian dalam dirinya. Terjemahan ini mempertahankan cakupan ungkapan sumber tanpa secara eksplisit menambahkan “rahim”.
- source_word: אִם כֵּן
  choice: Jika demikian
  rationale: Ungkapan bersyarat ini menjadi tanggapan Ribka terhadap pergumulan yang terjadi di dalam dirinya dan terdengar alami dalam tuturan bahasa Indonesia.
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: mengapa aku begini?
  rationale: Ungkapan Ibrani ini eliptis dan sulit. Pilihan ini menyampaikan keluhan Ribka dalam konteks kehamilannya sambil mempertahankan ketidaklengkapan makna melalui catatan kaki.
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Dalam konstruksi ini, דרש berarti mencari jawaban atau petunjuk ilahi, bukan sekadar mencari keberadaan seseorang. Pilihan ini jelas dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
theological_decisions:
- issue: Makna keluhan Ribka yang eliptis
  choice: mengapa aku begini?
  alternative: mengapa aku? / untuk apa aku hidup?
  rationale: Teks Ibrani tidak menyebutkan secara eksplisit objek atau akibat yang dimaksud. Terjemahan utama sesuai dengan konteks penderitaan kehamilan, sedangkan catatan kaki mempertahankan kemungkinan pembacaan yang lebih harfiah atau eksistensial.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Teks sumber memakai nama diri ilahi. “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar atau bentuk alternatif.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Ia” dipakai dalam narasi, sedangkan susunan ujaran langsung dibuat alami tanpa menghilangkan ambiguitas teks Ibrani.
