- from: Esau berkata kepada Yakub, “Tolong, biarkan aku melahap sedikit dari yang merah itu, yang merah itu[a], sebab aku kelelahan.” Itulah sebabnya namanya disebut Edom[b].
  to: Esau berkata kepada Yakub, “Tolong, biarkan aku melahap sedikit dari yang merah, yang merah itu[a], sebab aku kelelahan.” Itulah sebabnya namanya disebut Edom[b].
