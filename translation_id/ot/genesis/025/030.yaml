base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: id
  text: Esau berkata kepada Yakub, “Tolong, biarkan aku melahap sedikit dari yang merah, yang merah itu[a], sebab aku kelelahan.” Itulah sebabnya namanya disebut Edom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani mengulang kata “merah” tanpa menyebut makanannya secara langsung. Banyak terjemahan menambahkan “masakan.”
    reason: lexical_alternative
  - marker: b
    text: Nama Edom terdengar seperti kata Ibrani yang berarti “merah”; ayat ini mengandung permainan kata.
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: biarkan aku melahap
  rationale: Bentuk Hifil imperatif dengan akhiran orang pertama tunggal menggambarkan makan atau menelan dengan lahap. Ungkapan ini mempertahankan nada Esau yang mendesak tanpa menjadi kaku seperti terjemahan harfiah 'suapi aku'.
- source_word: נָא
  choice: tolong
  rationale: Partikel permohonan ini paling wajar diungkapkan dengan 'tolong' dalam bahasa Indonesia modern.
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: sedikit dari yang merah itu, yang merah itu
  rationale: Teks Ibrani mengulang kata 'merah' dan tidak menyebut jenis makanannya. Terjemahan mempertahankan penghilangan nomina dan pengulangan yang mencerminkan ucapan Esau yang spontan, tanpa menambahkan 'bubur' ke dalam teks utama.
- source_word: כִּי עָיֵף אָנֹכִי
  choice: sebab aku kelelahan
  rationale: '''Kelelahan'' menyampaikan keadaan sangat letih secara alami tanpa memperkuatnya menjadi hampir pingsan.'
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini secara alami memperkenalkan penjelasan tentang pemberian nama.
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: namanya disebut Edom
  rationale: Pilihan ini mempertahankan rumusan penamaan Ibrani dan ketidakjelasan pelaku pada verba orang ketiga tunggal, sambil tetap wajar dalam bahasa Indonesia.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama diri ditransliterasikan; kaitannya dengan kata Ibrani untuk 'merah' dijelaskan dalam catatan kaki.
