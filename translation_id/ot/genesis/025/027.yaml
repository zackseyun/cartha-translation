base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: id
  text: Ketika kedua anak itu tumbuh dewasa, Esau menjadi pemburu yang terampil, seorang yang biasa hidup di padang terbuka[a], sedangkan Yakub adalah seorang yang tenang[b] dan tinggal di kemah-kemah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang/lelaki padang”; ungkapan ini menunjuk kepada seseorang yang kehidupannya berkaitan dengan padang atau kawasan terbuka.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tenang” juga dapat berarti “tulus,” “tidak bercela,” “sederhana,” “tidak bersalah,” atau “utuh,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: kedua anak itu tumbuh dewasa
  rationale: Dalam konteks kedua putra Ishak yang beranjak menuju kedewasaan, frasa ini menyatakan pertumbuhan mereka. Kata 'kedua' memperjelas bahwa yang dimaksud ialah Esau dan Yakub tanpa menambah informasi asing dari konteks.
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: seorang yang pandai berburu
  rationale: Ungkapan harfiahnya, 'seorang yang mengenal perburuan,' menunjukkan kecakapan yang telah terlatih. 'Pandai berburu' menyampaikan makna itu dengan wajar dalam bahasa Indonesia.
- source_word: אִישׁ שָׂדֶה
  choice: seorang yang hidup di padang
  rationale: שָׂדֶה berarti padang atau kawasan terbuka. Ungkapan ini menggambarkan lingkungan dan pola hidup Esau serta mempertahankan kontras dengan Yakub yang tinggal di kemah-kemah.
- source_word: אִישׁ תָּם
  choice: seorang yang tenang
  rationale: Dalam konteks kontras antara kehidupan Esau di padang dan kehidupan Yakub di kemah, 'tenang' merupakan ungkapan Indonesia yang alami. Karena תָּם juga dapat menunjuk pada keutuhan, kelurusan, kesederhanaan, atau ketidakbersalahan, kemungkinan makna lain dicatat dalam catatan kaki.
- source_word: יֹשֵׁב אֹהָלִים
  choice: tinggal di kemah-kemah
  rationale: Bentuk partisip ini menggambarkan kebiasaan atau pola hidup. Bentuk jamak 'kemah-kemah' mempertahankan bentuk אֹהָלִים dan kontras naratif dengan kehidupan di padang.
theological_decisions:
- issue: Makna תָּם sebagai gambaran tentang Yakub
  choice: tenang, dengan ambiguitas leksikal dicatat
  alternative: tulus; tidak bercela; sederhana; tidak bersalah; utuh
  rationale: Konteks langsung terutama mengontraskan pola hidup kedua saudara itu, sehingga 'tenang' cocok tanpa menetapkan penilaian moral yang lebih kuat daripada yang dituntut konteks. Catatan kaki mempertahankan rentang makna Ibrani dan tidak menutup kemungkinan nuansa integritas atau keutuhan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Susunan kalimat mempertahankan kontras antara Esau yang hidup di padang dan Yakub yang tinggal di kemah-kemah, sambil menjelaskan istilah Ibrani yang ambigu melalui catatan kaki.
