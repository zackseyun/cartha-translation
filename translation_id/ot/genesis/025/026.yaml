base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: id
  text: Sesudah itu, saudaranya keluar dengan tangannya memegang tumit Esau; lalu ia dinamai Yakub.[a] Ishak berumur enam puluh tahun ketika mereka dilahirkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yakub berbunyi mirip dengan kata Ibrani untuk “tumit”. Nama itu juga menjadi permainan kata dengan kata Ibrani yang dapat berarti “menyerobot” atau “menggantikan”.
    reason: Menjelaskan permainan bunyi dan asosiasi leksikal Ibrani yang tidak dapat dipertahankan sepenuhnya dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Menandai urutan waktu setelah kelahiran Esau secara alami dan dekat dengan ungkapan Ibrani.
- source_word: יָצָא אָחִיו
  choice: keluarlah saudaranya
  rationale: Mempertahankan gambaran hidup tentang bayi yang keluar dari rahim tanpa menambahkan kata 'kembar', yang tidak terdapat dalam frasa ini.
- source_word: וְיָדוֹ אֹחֶזֶת
  choice: tangannya sedang memegang
  rationale: Mencerminkan konstruksi partisipial yang menggambarkan tindakan yang berlangsung ketika Yakub keluar.
- source_word: בַּעֲקֵב עֵשָׂו
  choice: tumit Esau
  rationale: Padanan langsung dan alami untuk hubungan konstruksi Ibrani.
- source_word: וַיִּקְרָא שְׁמוֹ יַעֲקֹב
  choice: Karena itu, ia dinamai Yakub
  rationale: Rumus penamaan diterjemahkan secara pasif dan hubungan naratif dengan tindakan memegang tumit dibuat jelas tanpa menentukan siapa pemberi nama, sebab subjek Ibraninya tidak dinyatakan secara eksplisit.
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה
  choice: Ishak berumur enam puluh tahun
  rationale: Ungkapan usia Ibrani dialihkan ke bentuk Indonesia yang baku dan alami.
- source_word: בְּלֶדֶת אֹתָם
  choice: ketika mereka dilahirkan
  rationale: Menyatakan waktu kelahiran kedua anak itu tanpa menambahkan subjek ibu yang tidak disebutkan dalam frasa Ibrani.
