base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: id
  text: Ishak berumur empat puluh tahun ketika ia memperistri Ribka[a]—anak perempuan Betuel, orang Aram dari Padan-Aram, serta saudara perempuan Laban, orang Aram[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ketika ia mengambil Ribka ... menjadi istrinya.”'
    reason: lexical_alternative
  - marker: b
    text: “Orang Aram” lebih tepat daripada terjemahan tradisional lama “orang Siria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: Ishak berumur empat puluh tahun
  rationale: Ungkapan Ibrani harfiah 'anak empat puluh tahun' merupakan idiom usia; bentuk Indonesia ini alami dan tepat.
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: ketika ia memperistri
  rationale: Dalam konteks perkawinan, לקח dengan לְאִשָּׁה berarti mengambil seorang perempuan menjadi istri. 'Memperistri' menyampaikan keseluruhan formula dengan ringkas dan alami.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: בַּת בְּתוּאֵל
  choice: anak perempuan Betuel
  rationale: Menyampaikan hubungan kekerabatan secara langsung dan mempertahankan gaya silsilah.
- source_word: הָאֲרַמִּי
  choice: orang Aram
  rationale: Etnonim Ibrani אֲרַמִּי menunjuk kepada orang Aram; ini lebih tepat daripada sebutan tradisional 'orang Siria'.
- source_word: מִפַּדַּן אֲרָם
  choice: dari Padan-Aram
  rationale: Nama tempat ditransliterasikan; ejaan ini alami dalam bahasa Indonesia.
- source_word: אֲחוֹת לָבָן
  choice: saudara perempuan Laban
  rationale: Mempertahankan keterangan hubungan keluarga secara eksplisit.
