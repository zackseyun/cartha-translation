  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָ/ה לִּ/י֙ כַּ/יּ֔וֹם וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּמְכֹּ֥ר אֶת בְּכֹרָת֖/וֹ לְ/יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: id
  text: Lalu Yakub berkata, “Bersumpahlah kepadaku hari ini.[a]” Maka ia bersumpah kepada Yakub dan menjual hak kesulungannya[b] kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari ini” atau “mulai hari ini.”
    reason: lexical_alternative
  - marker: b
    text: “Hak kesulungan” adalah hak dan kedudukan yang dimiliki anak laki-laki sulung.
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה
  choice: Bersumpahlah
  rationale: Bentuk imperatif ini menyampaikan tuntutan langsung untuk mengikat diri dengan sumpah; bentuk berimbuhan -lah wajar dan tegas dalam bahasa Indonesia.
- source_word: לִּי
  choice: kepadaku
  rationale: Preposisi ל dengan akhiran orang pertama menandai pihak yang menerima sumpah.
- source_word: כַּיּוֹם
  choice: hari ini
  rationale: Ungkapan waktu ini secara idiomatis berarti ‘hari ini’ atau ‘pada hari ini’; pilihan utama ringkas dan alami.
- source_word: וַיִּשָּׁבַע
  choice: ia bersumpah
  rationale: Mempertahankan hubungan verbal dengan perintah Yakub dan urutan narasi Ibrani tanpa menambahkan nama subjek yang tidak dinyatakan dalam ayat.
- source_word: וַיִּמְכֹּר
  choice: menjual
  rationale: Kata מכר secara langsung menyatakan tindakan menjual dan mempertahankan sifat transaksional tindakan itu.
- source_word: בְּכֹרָתוֹ
  choice: hak kesulungannya
  rationale: Istilah ini menunjuk pada kedudukan serta hak yang melekat pada anak sulung; ‘hak kesulungan’ merupakan padanan Indonesia yang mapan dan tepat.
- source_word: לְיַעֲקֹב
  choice: kepada Yakub
  rationale: Preposisi ל menandai Yakub sebagai penerima dalam transaksi tersebut; nama disebut pada klausa pertama agar rujukan pronomina berikutnya tetap jelas.
theological_decisions:
- issue: Sifat pengalihan בְּכֹרָה oleh Esau
  choice: menjual hak kesulungannya
  alternative: menjual haknya sebagai anak sulung
  rationale: Ayat ini menggambarkan pelepasan konkret atas hak dan kedudukan anak sulung melalui transaksi, tanpa menambahkan penafsiran teologis tentang nilai atau akibatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mengikuti gerak narasi Ibrani, sementara pengulangan ‘kepada Yakub ... kepadanya’ dipakai untuk memperjelas dua rujukan pronominal tanpa menambahkan nama Esau yang tersirat dalam teks sumber.
