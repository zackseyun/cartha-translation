  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: id
  text: 'Inilah riwayat keturunan Ishak[a], anak Abraham: Abraham memperanakkan Ishak.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “riwayat” atau “silsilah”. Kata Ibrani toledot merupakan istilah judul yang berulang dalam Kitab Kejadian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan bagian baru. “Inilah” alami dalam bahasa Indonesia dan menyampaikan fungsi penunjuk serta pembuka tanpa menambahkan unsur waktu yang tidak ada dalam teks sumber.
- source_word: תּוֹלְדֹת
  choice: riwayat keturunan
  rationale: Istilah Ibrani ini menjadi rumusan judul yang berulang dalam Kitab Kejadian dan dapat mencakup asal-usul, garis keluarga, serta kisah yang berkembang dari seseorang. “Riwayat keturunan” mempertahankan fungsi sastranya tanpa membatasinya hanya pada daftar keturunan.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בֶּן אַבְרָהָם
  choice: anak Abraham
  rationale: Menerjemahkan hubungan genealogis secara langsung dan jelas.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk kausatif dari ילד di sini menyatakan tindakan menjadi ayah atau memperanakkan dalam konteks silsilah. “Memperanakkan” tepat, ringkas, dan sesuai dengan ragam bahasa Alkitab yang bermartabat.
- source_word: אֶת יִצְחָק
  choice: Ishak
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; objeknya dinyatakan dengan nama “Ishak”.
theological_decisions:
- issue: Penerjemahan rumusan toledot dalam Kitab Kejadian
  choice: riwayat keturunan
  alternative: riwayat; silsilah; keturunan
  rationale: Rumusan ini berfungsi sebagai judul struktural yang berulang. “Riwayat keturunan” mempertahankan cakupan yang luas dan tidak memutuskan secara sempit bahwa bagian berikutnya hanya merupakan biografi, silsilah, atau daftar keturunan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk judul genealogis yang ringkas; istilah “memperanakkan” dipakai karena ketepatannya dalam konteks silsilah.
