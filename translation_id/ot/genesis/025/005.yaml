  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kata 'segala' mempertahankan nuansa menyeluruh dari כָּל, sedangkan 'miliknya' mengungkapkan relasi kepunyaan dalam אֲשֶׁר לוֹ tanpa kekakuan.
