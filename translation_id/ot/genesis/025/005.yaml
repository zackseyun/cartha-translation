lexical_decisions:
- source_word: וַיִּתֵּן
  choice: memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan lampau berurutan dalam narasi. Bahasa Indonesia tidak menandai kala secara morfologis, sehingga 'memberikan' secara alami menyampaikan tindakan itu.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung dalam bahasa Ibrani; fungsinya sudah tercermin dalam susunan kalimat Indonesia.
- source_word: כָּל אֲשֶׁר לוֹ
  choice: segala miliknya
  rationale: Secara harfiah berarti 'semua yang merupakan kepunyaannya.' 'Segala miliknya' ringkas, wajar, dan mempertahankan cakupan menyeluruh dari frasa Ibrani.
- source_word: לְיִצְחָק
  choice: kepada Ishak
  rationale: Preposisi לְ menandai penerima; 'kepada Ishak' merupakan padanan Indonesia yang jelas dan alami.
