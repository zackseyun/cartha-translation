  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: id
  text: Putra-putra Midian ialah Efa, Efer, Henokh[a], Abida, dan Eldaa. Semua ini adalah putra-putra Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Hanokh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: Anak-anak lelaki Midian
  rationale: Bentuk jamak konstruksi בְּנֵי menunjuk secara khusus kepada putra-putra dalam daftar silsilah. Kata sambung pembuka tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan daftar dari ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: עֵיפָה
  choice: Efa
  rationale: Transliterasi nama diri Ibrani yang mengikuti bentuk baku dan mudah dibaca dalam bahasa Indonesia.
- source_word: וָעֵפֶר
  choice: Efer
  rationale: Transliterasi nama diri עֵפֶר dengan bentuk yang lazim dan alami dalam bahasa Indonesia; prefiks penghubung diwujudkan melalui tanda baca dan kata 'dan' sebelum unsur terakhir dalam daftar.
- source_word: וַחֲנֹךְ
  choice: Henok
  rationale: Bentuk nama yang telah dikenal dalam bahasa Indonesia dan mewakili nama Ibrani חֲנֹךְ; catatan kaki menjelaskan bentuk sumbernya.
- source_word: וַאֲבִידָע
  choice: Abida
  rationale: Transliterasi langsung nama diri Ibrani yang sesuai dengan pola ejaan Indonesia.
- source_word: וְאֶלְדָּעָה
  choice: Eldaa
  rationale: Transliterasi nama diri dengan mempertahankan dua vokal akhir yang mencerminkan bentuk Ibrani.
- source_word: כָּל אֵלֶּה
  choice: Mereka semua
  rationale: Ungkapan ini merangkum semua nama yang baru disebutkan dan terdengar alami dalam bahasa Indonesia modern.
- source_word: בְּנֵי קְטוּרָה
  choice: anak-anak lelaki Ketura
  rationale: Terjemahan ini mempertahankan rumusan silsilah Ibrani dan penandaan gender pada בְּנֵי, tanpa mengubahnya menjadi istilah kekerabatan yang lebih spesifik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur daftar dibuat alami, sedangkan rumusan silsilah 'anak-anak lelaki' dipertahankan dekat dengan teks Ibrani. Penanda catatan kaki ditempatkan pada nama Henok, sesuai kata Ibrani yang dijelaskan; penempatannya sesudah Efa dalam lapisan konsultasi Inggris tampaknya merupakan kekeliruan.
