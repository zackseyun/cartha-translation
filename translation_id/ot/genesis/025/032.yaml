base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: id
  text: Esau berkata, “Lihat, aku akan segera mati; jadi, apa gunanya hak kesulungan ini bagiku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kata
  rationale: Bentuk wayyiqtol naratif dari אמר; dalam narasi Indonesia modern, “kata Esau” menyampaikan ujaran secara alami tanpa harus menerjemahkan waw secara tersendiri.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama pribadi ditulis menurut bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru deiktis ini menarik perhatian pada pernyataan berikutnya; “Lihat” mempertahankan dayanya dalam bahasa Indonesia modern tanpa kesan arkais.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina orang pertama mandiri memberi penekanan. “Aku” cocok dengan ujaran langsung antarsaudara dan tetap wajar dalam narasi bermartabat.
- source_word: הוֹלֵךְ לָמוּת
  choice: hampir mati
  rationale: Gabungan הלך dengan infinitif menyatakan gerak menuju hasil atau keadaan yang segera terjadi. Dalam konteks ini ungkapan tersebut bersifat idiomatis, bukan gerakan harfiah.
- source_word: וְלָמָּה
  choice: Jadi, apa gunanya
  rationale: Pertanyaan retoris ini menarik kesimpulan dari klaim Esau bahwa ia hampir mati. Bentuk Indonesia ini mengungkapkan daya pragmatisnya secara alami.
- source_word: זֶּה
  choice: ini
  rationale: Kata tunjuk proksimal merujuk pada hak kesulungan yang sedang dibicarakan.
- source_word: לִי
  choice: bagiku
  rationale: Dativus keuntungan atau kepentingan pribadi diterjemahkan secara alami sebagai “bagiku” dalam ungkapan “apa gunanya ... bagiku?”
- source_word: בְּכֹרָה
  choice: hak kesulungan
  rationale: Istilah ini secara ringkas dan lazim menunjuk status serta hak-hak anak sulung dalam konteks hukum dan sosial.
theological_decisions:
- issue: Daya interpretatif pernyataan Esau bahwa ia akan mati
  choice: Diterjemahkan sebagai klaim bahwa kematian sudah dekat tanpa menentukan apakah Esau benar-benar berada di ambang kematian atau sedang melebih-lebihkan kelaparannya.
  alternative: Memahaminya secara khusus sebagai kematian harfiah yang segera terjadi, atau sebagai keluhan hiperbolis akibat sangat lapar.
  rationale: Teks Ibrani hanya menyajikan ucapan Esau bahwa ia sedang menuju kematian. Terjemahan mempertahankan ketegangan naratif dan tidak menetapkan penilaian yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Ujaran langsung memakai “aku” karena sesuai dengan konteks percakapan pribadi. Tidak diperlukan catatan kaki karena alternatif “aku akan mati” tidak menambahkan ambiguitas penting yang belum terwakili oleh “aku hampir mati”.
