  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadanya, “Dua bangsa berada dalam rahimmu, dan dua kaum akan terpisah dari dalam rahimmu. Satu kaum akan lebih kuat daripada kaum yang lain, dan yang tua akan melayani yang muda.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang besar akan melayani yang kecil.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: שְׁנֵי גיים
  choice: dua bangsa
  rationale: גוי menunjuk pada bangsa atau kelompok etnis; “bangsa” sesuai dengan cakupan politis-etnis nubuat ini.
- source_word: בְּבִטְנֵךְ
  choice: dalam rahimmu
  rationale: Dalam konteks kehamilan, בטן secara alami dan tepat diterjemahkan “rahim”.
- source_word: שְׁנֵי לְאֻמִּים
  choice: dua suku bangsa
  rationale: לְאֻמִּים menunjuk pada kelompok masyarakat; “suku bangsa” membedakannya dari גיים sambil mempertahankan paralelisme.
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: akan terpisah dari dalam dirimu
  rationale: Ungkapan ini mempertahankan arah “dari dalam dirimu” serta nuansa pasif/intransitif Niphal יִפָּרֵדוּ dalam bahasa Indonesia yang wajar.
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: suku bangsa yang satu akan lebih kuat daripada yang lain
  rationale: Konstruksi perbandingan antarkelompok dan makna kekuatan pada אמץ disampaikan secara jelas tanpa menentukan bagaimana kekuatan itu diwujudkan.
- source_word: רַב ... צָעִיר
  choice: yang tua ... yang muda
  rationale: Dalam konteks anak kembar, pasangan ini paling alami merujuk pada urutan usia; bentuk tanpa nomina juga mempertahankan keringkasan teks Ibrani.
- source_word: יַעֲבֹד
  choice: akan melayani
  rationale: עבד berarti melayani atau mengabdi; “melayani” mempertahankan keluasan makna tanpa mempersempitnya menjadi bentuk ketundukan tertentu.
theological_decisions:
- issue: Makna וְרַב יַעֲבֹד צָעִיר
  choice: yang tua akan melayani yang muda
  alternative: yang besar akan melayani yang kecil
  rationale: Konteks anak kembar mendukung pengertian usia, tetapi רַב dan צָעִיר juga dapat menyatakan kebesaran/status dan kekecilan. Alternatif yang lebih harfiah dipertahankan dalam catatan kaki agar ambiguitas asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. “Berfirman” dipakai untuk ujaran ilahi; paralelisme Ibrani dipertahankan melalui “bangsa” dan “suku bangsa”. Penanda catatan kaki ditempatkan langsung setelah bagian ayat yang berkaitan.
