  text: When her days to give birth were fulfilled, behold, there were twins in her womb.
translation:
  language: id
  text: Ketika genap waktunya untuk melahirkan, ternyata ada anak kembar dalam kandungannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ
  choice: genap waktunya
  rationale: Ungkapan Ibrani harfiah ‘hari-harinya telah penuh’ menyatakan bahwa masa kehamilan sampai persalinan telah selesai. ‘Genap waktunya’ mempertahankan idiom itu secara alami dalam bahasa Indonesia modern.
- source_word: לָלֶדֶת
  choice: untuk melahirkan
  rationale: Infinitif ילד di sini menunjuk pada tindakan melahirkan; padanan ini langsung dan wajar.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Penanda wacana ini menarik perhatian kepada fakta yang penting atau mengejutkan. ‘Ternyata’ menyampaikan daya pengungkapan tersebut dengan alami dalam narasi Indonesia.
- source_word: תוֹמִם
  choice: anak kembar
  rationale: Nomina jamak ini berarti anak kembar. Penambahan ‘anak’ menghasilkan ungkapan Indonesia yang jelas dan alami tanpa mengubah makna.
- source_word: בְּבִטְנָהּ
  choice: dalam kandungannya
  rationale: Dalam konteks kehamilan dan persalinan, בטן menunjuk pada kandungan atau rahim; ‘dalam kandungannya’ adalah padanan yang alami dan tepat.
