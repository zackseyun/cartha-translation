  text: וַ/יִּקְבְּר֨וּ אֹת֜/וֹ יִצְחָ֤ק וְ/יִשְׁמָעֵאל֙ בָּנָ֔י/ו אֶל מְעָרַ֖ת הַ/מַּכְפֵּלָ֑ה אֶל שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן צֹ֨חַר֙ הַֽ/חִתִּ֔י אֲשֶׁ֖ר עַל פְּנֵ֥י מַמְרֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: id
  text: Anak-anaknya, Ishak dan Ismael, menguburkan dia di dalam gua Makhpela, di ladang milik Efron bin Zohar, orang Het. Ladang itu terletak berhadapan dengan Mamre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berada di depan Mamre” atau “terletak di seberang Mamre.” Ungkapan Ibrani ini dapat menunjukkan lokasi di depan atau berhadapan dengan suatu tempat yang menjadi patokan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: menguburkan dia
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa dalam narasi, sedangkan objek tunggal maskulin merujuk kepada Abraham dari ayat sebelumnya. Bahasa Indonesia tidak perlu mempertahankan kata sambung awal.
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: Anak-anaknya, Ishak dan Ismael
  rationale: Susunan ini menyampaikan hubungan aposisional secara alami dan mempertahankan rujukan akhiran pronominal kepada Abraham.
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: di gua Makhpela
  rationale: Walaupun אֶל biasanya menyatakan arah, dalam konteks penguburan bahasa Indonesia secara idiomatis memakai 'di'. Makhpela dipertahankan sebagai nama tempat.
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: di ladang Efron
  rationale: Frasa ini memperinci lokasi gua; 'di' sesuai dengan idiom penguburan dan konstruksi kepemilikan diterjemahkan secara langsung.
- source_word: בֶּן צֹחַר
  choice: bin Zohar
  rationale: '''Bin'' merupakan bentuk genealogis yang baku dan ringkas dalam bahasa Indonesia untuk menyatakan ''anak laki-laki Zohar''.'
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Gentilik ini diterjemahkan dengan sebutan etnis yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: yang berhadapan dengan Mamre
  rationale: Dalam keterangan geografis, עַל־פְּנֵי dapat berarti berada di depan, di seberang, atau berhadapan dengan suatu tempat. Pilihan ini alami dan tidak menambahkan arah mata angin yang tidak dinyatakan teks.
