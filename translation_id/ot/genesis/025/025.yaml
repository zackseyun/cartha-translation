  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: id
  text: Yang pertama keluar berwarna kemerah-merahan; seluruh tubuhnya seperti jubah dari bulu. Mereka menamainya Esau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Kata kerja umum untuk keluar; dalam konteks ini menggambarkan kelahiran secara konkret dan wajar dalam bahasa Indonesia.
- source_word: הָרִאשׁוֹן
  choice: yang pertama
  rationale: Menunjukkan anak kembar yang lahir lebih dahulu.
- source_word: אַדְמוֹנִי
  choice: dengan tubuh kemerah-merahan
  rationale: Menggambarkan penampilan atau warna tubuh yang kemerahan tanpa mempersempitnya secara pasti menjadi warna kulit; ungkapan ini juga mempertahankan kaitan bunyi yang kelak muncul dengan Edom tanpa menjelaskannya secara berlebihan.
- source_word: כֻּלּוֹ
  choice: seluruh tubuhnya
  rationale: Menegaskan bahwa gambaran berikut berlaku pada sekujur tubuhnya dan terdengar alami dalam bahasa Indonesia.
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: seperti jubah berbulu
  rationale: Mempertahankan perumpamaan Ibrani dengan אַדֶּרֶת, yaitu jubah atau mantel, dan שֵׂעָר, yaitu bulu/rambut, tanpa menggantinya dengan parafrasa interpretatif.
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: mereka menamainya
  rationale: Padanan Indonesia yang alami untuk rumus penamaan harfiah 'mereka menyebut namanya'.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
