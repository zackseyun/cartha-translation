lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan ringkasan umur Abraham; “Inilah” alami dalam bahasa Indonesia dan tetap mencerminkan unsur penunjuk Ibrani.
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם אֲשֶׁר חָי
  choice: seluruh masa hidup Abraham
  rationale: Secara harfiah rangkaian ini berbunyi “hari-hari dari tahun-tahun kehidupan Abraham yang dijalaninya.” Terjemahan ini menyampaikan maksudnya, yaitu keseluruhan rentang hidup Abraham, tanpa pengulangan yang janggal dalam bahasa Indonesia.
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: seratus tujuh puluh lima tahun
  rationale: Bilangan Ibrani disusun secara aditif, 100 + 70 + 5; bentuk angka utuh ini merupakan ungkapan baku dan tepat dalam bahasa Indonesia.
