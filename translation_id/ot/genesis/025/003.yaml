revisions:
- from: Yoksan memperanakkan Syeba dan Dedan. Anak-anak lelaki Dedan ialah orang Asyur[a], orang Letus, dan orang Leum.
  to: Yoksan menjadi ayah bagi Syeba dan Dedan. Putra-putra Dedan ialah Asyurim[a], Letusim, dan Leumim.
  rationale: Revisi mempertahankan transliterasi nama-nama Ibrani secara utuh dan menghindari identifikasi yang terlalu dini dengan “orang Asyur.” Istilah “putra-putra” mencerminkan בְנֵי, sedangkan catatan kaki menjaga ambiguitas yang wajar mengenai apakah Asyurim, Letusim, dan Leumim adalah individu atau kelompok keturunan. Susunan kalimat juga dibuat lebih alami untuk bahasa Indonesia baku modern.
