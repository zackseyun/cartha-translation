  text: וְ/יָקְשָׁ֣ן יָלַ֔ד אֶת שְׁבָ֖א וְ/אֶת דְּדָ֑ן וּ/בְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם וּ/לְטוּשִׁ֖ים וּ/לְאֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: id
  text: Yoksan menjadi ayah bagi Syeba dan Dedan. Putra-putra Dedan ialah Asyurim[a], Letusim, dan Leumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, ketiga nama ini mungkin nama-nama kaum.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: Yoksan
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia yang wajar.
- source_word: יָלַד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk ini secara ringkas menyatakan bahwa tokoh laki-laki tersebut menjadi leluhur langsung, tanpa memakai ungkapan yang arkais.
- source_word: שְׁבָא
  choice: Syeba
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: דְּדָן
  choice: Dedan
  rationale: Nama diri dipertahankan melalui transliterasi.
- source_word: בְנֵי
  choice: anak-anak lelaki
  rationale: Mencerminkan bentuk jamak maskulin Ibrani secara formal, sambil membiarkan kemungkinan bahwa nama-nama berikut menunjuk kelompok keturunan.
- source_word: הָיוּ
  choice: ialah
  rationale: Kopula ini secara alami memperkenalkan identitas anak-anak atau kelompok keturunan yang disebutkan.
- source_word: אַשּׁוּרִם
  choice: orang Asyur
  rationale: Bentuk jamak ini kemungkinan merupakan nama kelompok atau kaum; padanan ini mempertahankan sifat kolektifnya.
- source_word: לְטוּשִׁים
  choice: orang Letus
  rationale: Kemungkinan nama kelompok keturunan; ditransliterasikan dan diberi penanda kolektif Indonesia.
- source_word: לְאֻמִּים
  choice: orang Leum
  rationale: Dalam konteks silsilah diperlakukan sebagai nama kelompok, bukan diterjemahkan sebagai kata umum 'bangsa-bangsa'.
theological_decisions:
- issue: Apakah tiga nama terakhir adalah individu atau kelompok keturunan
  choice: Teks utama memakai bentuk kolektif 'orang ...'
  alternative: Asyurim, Letusim, dan Leumim sebagai nama pribadi atau nama kaum yang ditransliterasikan penuh
  rationale: Akhiran jamak Ibrani dan konteks etnonim mendukung pembacaan sebagai kelompok, tetapi ketidakpastian dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Nama-nama ditulis dengan ejaan yang mudah dibaca oleh pembaca Indonesia; kemungkinan bahwa daftar terakhir berisi nama kaum dinyatakan tanpa menutup alternatif transliterasi.
