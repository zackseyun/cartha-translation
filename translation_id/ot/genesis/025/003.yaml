review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena bentuk utama “orang Asyur, orang Letus, dan orang Leum” tidak mempertahankan nama-nama Ibrani אַשּׁוּרִם, לְטוּשִׁים, dan לְאֻמִּים secara memadai, khususnya dengan mengubahnya menjadi bentuk yang dapat terbaca sebagai etnonim umum atau bentuk tunggal. Teks Ibrani menyebut mereka sebagai בְנֵי דְדָן (“putra-putra/anak-anak lelaki Dedan”), tetapi status tiga nama terakhir sebagai nama pribadi atau nama kaum tetap tidak pasti.
  naturalness: “Yoksan memperanakkan” dapat dipahami, tetapi kurang alami dalam bahasa Indonesia baku modern untuk silsilah. “Yoksan menjadi ayah bagi Syeba dan Dedan” lebih idiomatis dan tetap menyampaikan relasi genealogis. “Putra-putra Dedan” dengan jelas mencerminkan bentuk maskulin jamak tanpa mengharuskan penafsiran bahwa ketiganya pasti individu.
  terminology: Nama diri Yoksan, Syeba, dan Dedan dapat dipertahankan. Asyurim, Letusim, dan Leumim sebaiknya ditransliterasikan utuh dalam teks utama. Catatan kaki perlu menyatakan kemungkinan bahwa ketiganya adalah nama kaum, bukan mengubah bentuk utama menjadi “orang Asyur” dan sebagainya.
  issues:
  - severity: medium
    issue: Tiga nama terakhir diubah menjadi “orang Asyur, orang Letus, dan orang Leum.”
    rationale: Ini tidak setia pada bentuk nama yang diberikan sumber dan “Asyur” dapat mengarahkan pembaca kepada Asyur/Assyria, padahal teks memuat אַשּׁוּרִם (Asyurim). Bentuk Letus dan Leum juga menghilangkan unsur akhir nama Ibrani.
  - severity: low
    issue: Kata kerja “memperanakkan” kurang alami dalam register Indonesia modern.
    rationale: Dalam silsilah modern, “menjadi ayah bagi” lebih lazim, jelas, dan tidak mengubah makna genealogis.
  - severity: low
    issue: Catatan kaki saat ini membingungkan karena teks utama sudah memberi bentuk kolektif, sementara catatan menawarkan transliterasi penuh.
    rationale: 'Catatan sebaiknya langsung menjelaskan ambiguitas referen: ketiganya mungkin nama kaum, bukan nama orang.'
  revised_text: Yoksan menjadi ayah bagi Syeba dan Dedan. Putra-putra Dedan ialah Asyurim[a], Letusim, dan Leumim.
  revised_footnotes:
  - marker: a
    text: Atau, ketiga nama ini mungkin nama-nama kaum.
    reason: lexical_alternative
