  text: וַ/יֹּ֧סֶף אַבְרָהָ֛ם וַ/יִּקַּ֥ח אִשָּׁ֖ה וּ/שְׁמָ֥/הּ קְטוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: id
  text: Abraham mengambil istri lagi[a], dan namanya Ketura.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Abraham mengambil istri lain.” Dalam bahasa Ibrani, secara harfiah: “Abraham menambahkan dan mengambil seorang istri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: lagi
  rationale: Dalam rangkaian וַיֹּסֶף ... וַיִּקַּח, verba יסף memberi nuansa penambahan atau pengulangan. Frasa 'mengambil seorang istri lagi' menyampaikan nuansa itu secara wajar dalam bahasa Indonesia.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: לקח bersama אִשָּׁה merupakan idiom Ibrani untuk mengambil seseorang sebagai istri. 'Mengambil' mempertahankan bentuk ungkapan sumber, sementara konteks 'istri' memperjelas makna perkawinannya.
- source_word: אִשָּׁה
  choice: seorang istri
  rationale: Walaupun אִשָּׁה dapat berarti 'perempuan' atau 'istri', konstruksinya dengan לקח di sini menunjuk kepada istri.
- source_word: וּשְׁמָהּ
  choice: dan namanya
  rationale: Pilihan ini menerjemahkan klausa penamaan Ibrani yang sederhana secara langsung dan alami.
- source_word: קְטוּרָה
  choice: Ketura
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Cara menyatakan daya aditif atau repetitif וַיֹּסֶף ketika Abraham mengambil istri
  choice: Abraham mengambil seorang istri lagi
  alternative: Abraham mengambil istri lain; secara harfiah, Abraham menambahkan dan mengambil seorang istri
  rationale: Kata 'lagi' mempertahankan nuansa pengulangan atau penambahan tanpa menentukan lebih jauh status Ketura maupun kronologi pernikahan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Ungkapan 'mengambil seorang istri' dipertahankan agar dekat dengan idiom Ibrani, sedangkan 'lagi' mengungkapkan daya aditif וַיֹּסֶף tanpa membuat konstruksi Indonesia terasa kaku.
