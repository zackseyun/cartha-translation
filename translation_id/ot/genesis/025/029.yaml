  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: id
  text: Yakub sedang memasak masakan[a], lalu Esau datang dari padang dalam keadaan letih[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yakub sedang merebus masakan.” Kata kerja Ibraninya secara khusus mengacu pada memasak dengan cara merebus.
    reason: lexical_alternative
  - marker: b
    text: Atau “lelah” atau “kehabisan tenaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּזֶד
  choice: sedang memasak
  rationale: Dalam konteks ini, verba זיד merujuk pada menyiapkan makanan dengan merebus. 'Sedang memasak' merupakan ungkapan Indonesia yang alami dan mempertahankan aspek kegiatan yang sedang berlangsung.
- source_word: נָזִיד
  choice: semur
  rationale: נָזִיד menunjuk pada masakan berkuah atau rebusan. 'Semur' mudah dipahami dalam bahasa Indonesia modern, meskipun istilah ini dapat mengesankan jenis masakan tertentu; karena itu, alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיָּבֹא
  choice: pulang
  rationale: בוא berarti datang atau masuk. Dalam konteks Esau datang dari padang ke tempat Yakub, 'pulang' menyampaikan gerak kembali secara alami tanpa perlu menyatakan lokasi tujuan yang hanya tersirat.
- source_word: מִן הַשָּׂדֶה
  choice: dari padang
  rationale: שָׂדֶה dapat berarti ladang, padang, atau daerah terbuka. Karena Esau adalah pemburu dan baru kembali dari luar, 'padang' paling sesuai dengan konteks.
- source_word: וְהוּא עָיֵף
  choice: dalam keadaan sangat letih
  rationale: Konstruksi pronomina dan adjektiva menyatakan keadaan Esau. 'Sangat letih' menyampaikan kekuatan עָיֵף secara alami dan menyiapkan permintaannya pada ayat berikutnya.
