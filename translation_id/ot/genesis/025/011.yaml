base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: id
  text: Setelah Abraham meninggal, Allah memberkati Ishak, anak Abraham. Ishak tinggal di dekat Beer-Lahai-Roi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi adalah nama sebuah sumur; nama Ibrani ini telah diperkenalkan dalam Kejadian 16:14.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי
  choice: Setelah ...
  rationale: Dalam rangkaian narasi ini, bentuk tersebut mengantar peristiwa berikutnya. Bahasa Indonesia modern tidak perlu menerjemahkannya secara harfiah sebagai “dan terjadilah”; klausa waktu berikutnya dapat langsung membuka kalimat dengan alami.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: Setelah Abraham meninggal
  rationale: Ungkapan ini menyatakan waktu sesudah kematian Abraham. Bentuk verbal “meninggal” lebih alami dalam bahasa Indonesia modern daripada “setelah kematian Abraham” tanpa mengubah maknanya.
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: Allah memberkati
  rationale: Kata kerja ברך berarti “memberkati”, dan אֱלֹהִים dalam konteks ini menunjuk kepada Allah.
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: Ishak, anak Abraham
  rationale: Pronomina Ibrani merujuk kepada Abraham. Nama Abraham diulangi agar frasa Indonesia tidak disalahpahami sebagai menyebut Ishak anak Allah.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam ringkasan naratif ini, ישב menyatakan keberdiaman atau tempat tinggal; “tinggal” adalah padanan modern yang alami.
- source_word: עִם
  choice: dekat
  rationale: Di depan nama tempat, עִם menyatakan kedekatan lokasi. “Dekat” lebih jelas daripada arti dasarnya “dengan” dalam bahasa Indonesia.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Nama tempat ini ditransliterasikan secara konsisten sebagai nama sumur yang telah diperkenalkan sebelumnya.
theological_decisions:
- issue: Rujukan pronomina dalam “Ishak, anaknya”
  choice: Ishak, anak Abraham
  alternative: Ishak, anaknya
  rationale: Akhiran pronominal Ibrani merujuk kepada Abraham, bukan kepada Allah sebagai subjek klausa utama. Pengulangan nama Abraham mencegah ambiguitas teologis yang tidak terdapat dalam konteks sumber.
- issue: Penerjemahan אֱלֹהִים dalam narasi
  choice: Allah
  alternative: Tuhan
  rationale: “Allah” adalah padanan baku bahasa Indonesia untuk אֱלֹהִים ketika menunjuk kepada satu-satunya Allah; ayat ini tidak menampilkan polemik atau ketegangan teologis yang memerlukan bentuk lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Struktur dua kalimat menjaga kejernihan alur serta menghindari rangkaian klausa yang terasa berat. Penanda catatan kaki ditempatkan sesudah nama Beer-Lahai-Roi karena catatan menjelaskan nama tempat tersebut.
