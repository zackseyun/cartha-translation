  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: id
  text: Namun, kepada putra-putra gundiknya, Abraham memberi sejumlah hadiah. Selagi ia masih hidup, ia mengirim mereka pergi dari Ishak, anaknya, ke timur, ke tanah di sebelah timur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ke negeri di sebelah timur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: Namun, kepada anak-anak lelaki
  rationale: Kata sambung dalam konteks ini mengontraskan pemberian kepada anak-anak para gundik dengan warisan yang diberikan kepada Ishak pada ayat sebelumnya; 'namun' menyatakan kontras itu, sedangkan 'kepada' mempertahankan hubungan datif.
- source_word: הַפִּילַגְשִׁים אֲשֶׁר לְאַבְרָהָם
  choice: para gundiknya
  rationale: '''Gundik'' adalah istilah ringkas bagi perempuan yang diakui dalam hubungan perkawinan tetapi berkedudukan lebih rendah; akhiran ''-nya'' secara alami merujuk kepada Abraham yang disebut segera sesudahnya.'
- source_word: נָתַן ... מַתָּנֹת
  choice: memberikan hadiah-hadiah
  rationale: Pilihan ini mempertahankan pasangan verba-objek Ibrani serta bentuk jamak מַתָּנֹת dengan bahasa Indonesia yang jelas.
- source_word: וַיְשַׁלְּחֵם מֵעַל יִצְחָק בְּנוֹ
  choice: ia menyuruh mereka pergi menjauh dari Ishak, anaknya
  rationale: Ungkapan ini menyampaikan tindakan mengirim pergi sekaligus pemisahan mereka dari Ishak, tanpa memperluas maksud teks.
- source_word: בְּעוֹדֶנּוּ חַי
  choice: Selagi masih hidup
  rationale: Ungkapan waktu ini menegaskan bahwa Abraham mengambil tindakan tersebut sebelum kematiannya.
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: ke arah timur, ke negeri Timur
  rationale: '''Ke arah timur'' mencerminkan bentuk direktif קֵדְמָה, sedangkan ''negeri Timur'' mempertahankan ungkapan geografis אֶרֶץ קֶדֶם dan pengulangan unsur ''timur'' dalam bahasa sumber.'
