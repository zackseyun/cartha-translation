  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: id
  text: Inilah keturunan Ismael[a], anak Abraham, yang Hagar, perempuan Mesir, budak perempuan Sara[b], lahirkan bagi Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan inilah keturunan Ismael.” Kata Ibrani תּוֹלְדוֹת (toledot) merupakan formula judul yang berulang dalam Kitab Kejadian dan juga dapat diterjemahkan “riwayat” atau “garis keturunan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “hamba perempuan Sara.” Kata Ibrani שִׁפְחָה mengacu pada seorang budak perempuan atau hamba perempuan; “budak perempuan” menyatakan status terikatnya dengan lebih jelas daripada “pelayan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Bentuk ini memperkenalkan judul silsilah secara alami dalam bahasa Indonesia; daya penghubung waw dapat tersirat dalam konteks tanpa harus selalu diterjemahkan dengan “dan”.
- source_word: תֹּלְדֹת
  choice: keturunan
  rationale: Dalam konteks ini istilah toledot membuka daftar garis keturunan Ismael. “Keturunan” alami dan tepat, sementara catatan kaki mempertahankan jangkauan formula khas Kitab Kejadian.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Nama pribadi mengikuti bentuk baku yang umum dalam Alkitab bahasa Indonesia.
- source_word: בֶּן אַבְרָהָם
  choice: anak Abraham
  rationale: Relasi konstruksi Ibrani diterjemahkan langsung dan alami.
- source_word: אֲשֶׁר יָלְדָה
  choice: yang dilahirkan Hagar
  rationale: Bentuk verba feminin tunggal menempatkan Hagar sebagai ibu yang melahirkan; susunan pasif ini alami dalam bahasa Indonesia dan tetap menyatakannya secara eksplisit.
- source_word: הָגָר הַמִּצְרִית
  choice: Hagar, perempuan Mesir
  rationale: Sebutan kebangsaan/etnis dinyatakan secara jelas dan idiomatis.
- source_word: שִׁפְחַת שָׂרָה
  choice: hamba perempuan Sara
  rationale: Pilihan ini mempertahankan jenis kelamin dan status terikat yang terkandung dalam שִׁפְחָה, tanpa melembutkannya menjadi sekadar pembantu.
- source_word: לְאַבְרָהָם
  choice: bagi Abraham
  rationale: Preposisi ל dalam konstruksi kelahiran ini menunjukkan bahwa anak itu dilahirkan bagi Abraham dalam kedudukannya sebagai ayah.
