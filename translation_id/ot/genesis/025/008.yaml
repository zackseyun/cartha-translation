base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: id
  text: Abraham mengembuskan napas terakhir dan mati dalam usia tua yang baik, tua dan puas[a]. Lalu ia dikumpulkan kepada kaumnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kenyang” atau “penuh”. Kata Ibrani ini menggambarkan keadaan telah mencapai kepenuhan atau kepuasan, tetapi tidak secara eksplisit menyebut “hari-hari”.
    reason: lexical_alternative
  - marker: b
    text: “Dikumpulkan kepada kaumnya” adalah rumusan kematian tradisional dalam bahasa Ibrani. Ungkapan ini dapat menyiratkan bergabung dengan sanak yang telah meninggal, tetapi tidak menjelaskan secara pasti bagaimana hal itu terjadi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: mengembuskan napas terakhir
  rationale: Mengungkapkan idiom kematian גוע secara wajar dan tetap membedakannya dari kata kerja berikutnya, וַיָּמָת.
- source_word: וַיָּמָת
  choice: mati
  rationale: Padanan langsung bagi מות, tanpa memperhalus pernyataan Ibrani dengan eufemisme.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: pada usia lanjut yang baik
  rationale: Mempertahankan unsur usia lanjut serta penilaian positif טוֹבָה, meskipun ungkapannya sengaja bernuansa khidmat.
- source_word: זָקֵן
  choice: dalam keadaan tua
  rationale: Menampilkan זָקֵן sebagai keterangan tersendiri dan mempertahankan penumpukan deskripsi dalam bahasa Ibrani.
- source_word: וְשָׂבֵעַ
  choice: dan puas
  rationale: שָׂבֵעַ berarti kenyang, penuh, atau puas. 'Puas' alami dalam bahasa Indonesia dan tidak menambahkan kata 'hari' yang tidak terdapat dalam teks.
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: Lalu ia dikumpulkan kepada kaumnya
  rationale: Mempertahankan bentuk pasif dan rumusan kematian tradisional Ibrani tanpa menentukannya sebagai penguburan saja atau sebagai uraian terperinci tentang keadaan sesudah mati.
- source_word: עַמָּיו
  choice: kaumnya
  rationale: '''Kaumnya'' menjaga pengertian kolektif dan relasional dari עַם tanpa mempersempitnya menjadi leluhur saja.'
theological_decisions:
- issue: Makna 'dikumpulkan kepada kaumnya'
  choice: Mempertahankan rumusan kematian sebagai idiom yang terbuka maknanya.
  alternative: Menafsirkannya secara khusus sebagai penguburan dalam makam keluarga atau sebagai perjumpaan sadar dengan leluhur setelah kematian.
  rationale: Ayat ini dapat membangkitkan gagasan bergabung dengan sanak yang telah meninggal, tetapi rumusannya sendiri tidak menjelaskan cara atau keadaan persisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan deskriptif yang bertumpuk dipertahankan sejauh masih wajar, sedangkan dua catatan kaki menjaga alternatif leksikal dan ambiguitas teologis rumusan kematian.
