  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: id
  text: 'Inilah anak-anak Ismael, dan inilah nama mereka menurut permukiman dan perkemahan mereka[a]: dua belas pemimpin[b] menurut suku bangsa mereka.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di desa-desa dan di perkemahan mereka.”'
    reason: Bahasa Ibrani dapat dibaca secara distributif (“menurut”) atau secara lokatif (“di”); חָצֵר juga dapat berarti “desa.”
  - marker: b
    text: 'Atau: “kepala-kepala” atau “pangeran-pangeran.”'
    reason: נְשִׂיאִם mencakup arti pemimpin, kepala, atau pangeran dalam lingkungan kesukuan.
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: Inilah anak-anak Ismael
  rationale: Ungkapan demonstratif dan pronominal ini memperkenalkan rangkuman daftar. “Anak-anak” dipertahankan karena konteks langsung menyebut putra-putra Ismael, bukan keturunannya secara umum.
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: dan inilah nama mereka
  rationale: Terjemahan langsung yang mempertahankan pengulangan אֵלֶּה dan gaya pengenalan daftar.
- source_word: בְּחַצְרֵיהֶם וּבְטִירֹתָם
  choice: menurut permukiman dan perkemahan mereka
  rationale: בְּ dapat dipahami secara distributif, yakni nama-nama itu dicatat menurut tempat tinggal kelompok masing-masing. חָצֵר menunjuk permukiman atau desa, sedangkan טִירָה dapat menunjuk perkemahan atau tempat tinggal berkubu. Alternatif lokatif dicatat dalam catatan kaki.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: dua belas pemimpin
  rationale: נָשִׂיא berarti orang yang ditinggikan sebagai pemimpin, kepala, atau penguasa. “Pemimpin” alami dalam bahasa Indonesia dan tidak menyiratkan gelar monarki secara berlebihan.
- source_word: לְאֻמֹּתָם
  choice: menurut suku bangsa mereka
  rationale: אֻמָּה menunjuk kelompok masyarakat atau bangsa. “Suku bangsa” sesuai dengan konteks kelompok-kelompok keturunan Ismael dan tetap mempertahankan unsur identitas kolektif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “inilah” mempertahankan bentuk rangkuman genealogis Ibrani, sedangkan “permukiman dan perkemahan” menjaga kontras antara tempat tinggal menetap dan semi-nomaden.
