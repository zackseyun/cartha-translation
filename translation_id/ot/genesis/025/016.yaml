  source_fidelity: 'Terjemahan secara akurat mencerminkan konstruksi Ibrani: pengulangan demonstratif, “anak-anak Ismael,” nama-nama yang dikaitkan dengan permukiman dan perkemahan mereka, dua belas נְשִׂיאִים, dan pengelompokan menurut אֻמֹּתָם. “Menurut” merupakan pemakaian Indonesia yang wajar untuk fungsi distributif/klasifikator frasa בְּחַצְרֵיהֶם וּבְטִירֹתָם.'
