  text: וְ/אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּ/שְׁמֹתָ֖/ם לְ/תוֹלְדֹתָ֑/ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְ/קֵדָ֥ר וְ/אַדְבְּאֵ֖ל וּ/מִבְשָֽׂם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: id
  text: Inilah nama anak-anak Ismael, menurut nama mereka dan garis keturunan mereka:[a] anak sulung Ismael ialah Nebayot, Kedar, Adbeel, dan Mibsam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut generasi mereka.” Istilah Ibrani ini dapat menunjuk pada keturunan atau garis keluarga dalam konteks silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Membuka daftar baru secara alami dalam bahasa Indonesia; unsur penghubung Ibrani dipahami dari kesinambungan konteks tanpa harus diterjemahkan kaku sebagai “Dan”.
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: nama anak-anak Ismael
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara langsung dan mempertahankan gaya silsilah.
- source_word: בִּשְׁמֹתָם
  choice: menurut nama mereka
  rationale: Mempertahankan pengulangan formula Ibrani sambil tetap dapat dipahami dalam bahasa Indonesia modern.
- source_word: לְתוֹלְדֹתָם
  choice: garis keturunan mereka
  rationale: Dalam konteks silsilah, תוֹלְדוֹת menunjuk pada keturunan atau garis keluarga; pilihan ini lebih alami daripada “generasi-generasi mereka” dan tidak mempersempit maknanya menjadi suku.
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: anak sulung Ismael
  rationale: Padanan langsung yang dengan jelas menunjukkan kedudukan Nebayot.
- source_word: נְבָיֹת
  choice: Nebayot
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan dekat dengan bentuk Ibrani.
- source_word: קֵדָר
  choice: Kedar
  rationale: Transliterasi baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: אַדְבְּאֵל
  choice: Adbeel
  rationale: Transliterasi yang mempertahankan bentuk nama Ibrani secara wajar.
- source_word: מִבְשָׂם
  choice: Mibsam
  rationale: Transliterasi langsung dan lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa silsilah dipertahankan dengan nada formal tetapi tetap alami. Kopula “ialah” ditambahkan untuk memperjelas bahwa Nebayot adalah anak sulung, sebagaimana tersirat dalam susunan nominal Ibrani. “Kemudian” mengantar nama-nama berikutnya tanpa menyiratkan urutan waktu yang kuat.
