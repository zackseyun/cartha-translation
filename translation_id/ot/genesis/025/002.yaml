  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: id
  text: 'Ia melahirkan anak-anak bagi Abraham: Zimran, Yoksan, Medan, Midian, Isybak, dan Suah.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Ia melahirkan
  rationale: Bentuk Qal wayyiqtol orang ketiga feminin tunggal dari ילד mengisahkan kelahiran sebagai peristiwa lampau; “melahirkan” menyatakan peran ibu secara alami dalam bahasa Indonesia.
- source_word: לוֹ
  choice: bagi Abraham
  rationale: Preposisi ל dengan sufiks maskulin tunggal menunjukkan pihak laki-laki yang baginya anak-anak itu dilahirkan. Nama “Abraham” dipakai untuk memperjelas rujukan pronomina dari ayat sebelumnya tanpa mengubah hubungan yang dinyatakan teks.
- source_word: אֶת
  choice: tidak diterjemahkan tersendiri
  rationale: Partikel ini menandai objek langsung pada setiap nama dan tidak mempunyai padanan tersendiri dalam tata bahasa Indonesia.
- source_word: זִמְרָן
  choice: Zimran
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: יָקְשָׁן
  choice: Yoksan
  rationale: Nama pribadi ditransliterasikan menurut kebiasaan bahasa Indonesia; yod awal menjadi “Y” dan vokal tanpa tekanan direpresentasikan secara wajar.
- source_word: מְדָן
  choice: Medan
  rationale: Nama pribadi ditransliterasikan langsung; bentuk ini sama dengan ejaan nama tersebut dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִדְיָן
  choice: Midian
  rationale: Nama pribadi yang juga terkait nama suatu bangsa/wilayah dipertahankan dalam bentuk Indonesia yang sudah dikenal.
- source_word: יִשְׁבָּק
  choice: Isybak
  rationale: Nama pribadi ditransliterasikan dengan “sy” untuk שׁ, sesuai konvensi ejaan Indonesia.
- source_word: שׁוּחַ
  choice: Suah
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim; konsonan akhir ח tidak dieja tersendiri agar bentuknya alami dan konsisten dengan tradisi nama Alkitab Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat, dengan gaya silsilah yang alami. Subjek feminin diterjemahkan “Ia” karena identitas Ketura sudah jelas dari ayat sebelumnya; “bagi Abraham” membuat rujukan לוֹ jelas bagi pembaca Indonesia.
