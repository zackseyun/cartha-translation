id: GEN.25.21
reference: Genesis 25:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: id
  text: Ishak memohon kepada Yahweh bagi istrinya[a], sebab istrinya mandul. Yahweh mengabulkan permohonannya[b], lalu Ribka, istrinya, mengandung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan” atau “berhadapan dengan istrinya”; dalam konteks ini dapat berarti bahwa Ishak berdoa berkenaan dengan atau demi istrinya.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai akar kata yang sama dalam kedua klausa: Ishak “memohon”, dan Yahweh “berkenan dimohon” olehnya.'
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר (עתר)
  choice: memohon / mengabulkan permohonannya
  rationale: 'Kedua bentuk berasal dari akar Ibrani yang sama dan membentuk permainan kata: Ishak memohon, lalu Yahweh berkenan menerima permohonannya. Pasangan ungkapan ini alami dalam bahasa Indonesia dan tetap memperlihatkan hubungan leksikal kedua klausa.'
- source_word: לַיהוָה / יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan membedakannya dari gelar umum seperti “Tuhan”.
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: bagi istrinya
  rationale: Dalam konteks doa, frasa ini paling wajar dipahami sebagai permohonan berkenaan dengan atau demi istrinya, sementara arti spasial harfiahnya dicatat dalam catatan kaki.
- source_word: עֲקָרָה
  choice: mandul
  rationale: Istilah Indonesia yang ringkas dan tepat untuk keadaan tidak dapat mengandung; lebih spesifik daripada sekadar “tidak mempunyai anak”.
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Padanan yang alami dan bermartabat untuk menyatakan bahwa Ribka mulai hamil.
- source_word: רִבְקָה
  choice: Ribka
  rationale: Mengikuti bentuk nama yang mapan dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan bentuk Ibraninya.
theological_decisions:
- issue: Hubungan antara permohonan Ishak dan tanggapan Yahweh dalam pengulangan akar עתר
  choice: “Ishak memohon ... Yahweh mengabulkan permohonannya”
  alternative: “Ishak memohon ... Yahweh berkenan dimohon olehnya”
  rationale: Terjemahan utama menyampaikan tanggapan ilahi secara alami tanpa memberi kesan bahwa doa bekerja secara mekanis. Catatan kaki mempertahankan bentuk dan permainan kata Ibraninya.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian dalam teks sumber ditampilkan sebagai nama diri, bukan diganti dengan gelar, tanpa menambahkan penafsiran teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Memohon” dipilih agar hubungan dengan “permohonannya” tetap terdengar, sedangkan “mandul” dan “mengandung” mempertahankan ketepatan serta kelugasan teks.
