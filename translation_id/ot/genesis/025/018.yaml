id: GEN.25.18
reference: Genesis 25:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: id
  text: Mereka menetap dari Hawila sampai Syur, yang berhadapan dengan Mesir dalam perjalanan ke arah Asyur[b]. Ia menetap berhadapan dengan semua saudaranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia hidup bermusuhan dengan semua saudaranya.” Ungkapan Ibrani ini bersifat idiomatis dan dapat menggambarkan lokasi, bukan permusuhan.
    reason: alternative_reading
  - marker: b
    text: Asyur juga dapat diterjemahkan “Asiria.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: Mereka menetap
  rationale: Bentuk jamak dari שׁכן menyatakan tinggal atau menetap; “menetap” sesuai dengan uraian wilayah tempat tinggal keturunan Ismael.
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: dari Hawila sampai Syur
  rationale: Rumus rentang geografis ini secara langsung menunjukkan batas wilayah permukiman.
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: yang berhadapan dengan Mesir
  rationale: Ungkapan עַל־פְּנֵי secara harfiah menunjuk posisi di hadapan atau berseberangan; “berhadapan dengan” mempertahankan sifat geografis tanpa menetapkan arah mata angin yang tidak dinyatakan secara eksplisit.
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: ke arah Asyur
  rationale: Bentuk verba dengan akhiran penunjuk arah menyatakan gerakan menuju Asyur; frasa ringkas ini alami dalam bahasa Indonesia dan tidak memaksakan identifikasi lebih lanjut.
- source_word: עַל־פְּנֵי כָּל־אֶחָיו
  choice: berhadapan dengan semua saudaranya
  rationale: Pilihan ini mempertahankan ungkapan spasial Ibrani dan membiarkan kemungkinan nuansa pertentangan tetap terbuka.
- source_word: נָפָל
  choice: Ia menetap
  rationale: Walaupun arti lazim נפל adalah “jatuh”, dalam konteks ini bentuk tunggal tersebut kemungkinan merupakan ungkapan tentang Ismael yang menetap atau menempatkan diri sebagai wakil garis keturunannya. Terjemahan harfiah “jatuh” akan kabur dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ungkapan עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: Ia menetap berhadapan dengan semua saudaranya
  alternative: Ia hidup bermusuhan dengan semua saudaranya; Ia jatuh di hadapan semua saudaranya
  rationale: Bahasa Ibraninya bersifat idiomatis dan diperdebatkan. Terjemahan utama mempertahankan gambaran lokasi serta kemungkinan nada pertentangan, sedangkan catatan kaki mengakui tafsiran permusuhan yang mungkin terkait dengan Kejadian 16:12 tanpa menjadikannya satu-satunya arti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama tempat mengikuti bentuk Alkitab Indonesia yang dikenal luas. Susunan catatan kaki ditempatkan pada frasa yang diterangkannya agar rujukannya jelas.
