  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: id
  text: Emas dari negeri itu bermutu baik. Di sana terdapat bedolah[a] dan batu oniks[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “damar beraroma”; zat yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau mungkin batu berharga lain, seperti “beril”; jenis batu yang dimaksud oleh kata Ibrani שֹׁהַם tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב הָאָרֶץ הַהִוא
  choice: Emas dari negeri itu
  rationale: Ungkapan ini merujuk kembali kepada negeri Hawila pada ayat sebelumnya. Konjungsi וּ dapat tersirat secara alami dalam bahasa Indonesia karena kalimat ini melanjutkan uraian yang sama.
- source_word: טוֹב
  choice: bermutu baik
  rationale: Dalam konteks emas, טוֹב menilai kualitasnya. 'Bermutu baik' menyampaikan maksud itu secara alami tanpa menambahkan tingkat kemurnian yang tidak dinyatakan teks.
- source_word: שָׁם
  choice: Di sana terdapat
  rationale: שָׁם berarti 'di sana' dan memperkenalkan dua benda yang ditemukan di negeri tersebut.
- source_word: הַבְּדֹלַח
  choice: bedolah
  rationale: Identitas zat yang dimaksud tidak pasti. Bentuk transliterasi tradisional dipertahankan agar terhindar dari kepastian semu, dengan alternatif dijelaskan dalam catatan kaki.
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: dan batu oniks
  rationale: אֶבֶן berarti 'batu', sedangkan שֹׁהַם menunjuk pada suatu batu berharga yang identitas mineralnya tidak pasti. 'Oniks' mempertahankan identifikasi tradisional, sementara ketidakpastiannya dicatat.
