base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: id
  text: Lalu Allah memberkati hari ketujuh dan menguduskannya[a], karena pada hari itu Ia berhenti[b] dari seluruh pekerjaan-Nya, yang telah Allah ciptakan untuk dilakukan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetapkannya sebagai hari kudus.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “berhenti” juga dapat diterjemahkan “beristirahat” dan berkaitan dengan kata “Sabat.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang telah Allah ciptakan untuk dilakukan.” Frasa terakhir ini sulit; frasa itu juga dipahami sebagai “yang telah Allah ciptakan dan jadikan” atau “yang telah Allah ciptakan dengan membuatnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: memberkati
  rationale: Bentuk piel dari ברך menyatakan bahwa Allah menganugerahkan berkat kepada hari itu; “memberkati” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini kata tersebut, dengan verba tunggal, menunjuk kepada Allah yang esa; “Allah” adalah padanan baku dalam Alkitab bahasa Indonesia.
- source_word: יוֹם הַשְּׁבִיעִי
  choice: hari ketujuh
  rationale: Padanan formal dan alami bagi nomina dengan bilangan tingkat tertentu.
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: menguduskannya
  rationale: Bentuk piel dari קדש berarti menjadikan atau menetapkan sesuatu sebagai kudus. “Menguduskannya” ringkas, bermartabat, dan mempertahankan bahasa kekudusan.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan Allah memberkati dan menguduskan hari ketujuh.
- source_word: בּוֹ
  choice: pada hari itu
  rationale: Antecedennya adalah hari ketujuh; pengulangan “hari itu” lebih jelas dan alami daripada pronomina “padanya”.
- source_word: שָׁבַת
  choice: berhenti
  rationale: Makna dasar verba ini ialah berhenti atau tidak melanjutkan pekerjaan. Pilihan ini tidak menyiratkan kelelahan ilahi, sementara hubungan leksikal dengan Sabat dijelaskan dalam catatan kaki.
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: dari seluruh pekerjaan-Nya
  rationale: מְלָאכָה mencakup pekerjaan atau karya; “seluruh pekerjaan-Nya” alami dan mempertahankan cakupan total frasa Ibrani.
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: yang telah Allah ciptakan untuk dikerjakan
  rationale: Terjemahan ini mempertahankan konstruksi relatif dan infinitif Ibrani yang sulit tanpa mengubahnya secara diam-diam menjadi dua verba sejajar.
theological_decisions:
- issue: Makna שָׁבַת dan kaitannya dengan Sabat
  choice: berhenti
  alternative: beristirahat
  rationale: “Berhenti” paling langsung menyatakan dihentikannya karya penciptaan dan menghindari kesan bahwa Allah letih. Catatan kaki mempertahankan alternatif tradisional “beristirahat” serta kaitan kata ini dengan Sabat.
- issue: Makna וַיְקַדֵּשׁ אֹתוֹ
  choice: menguduskannya
  alternative: menetapkannya sebagai hari kudus
  rationale: Pilihan utama mempertahankan kosakata kekudusan tanpa menambahkan penjelasan tentang mekanisme pengkhususannya.
- issue: Konstruksi sulit לַעֲשׂוֹת setelah בָּרָא
  choice: untuk dikerjakan
  alternative: dan jadikan; dengan membuatnya
  rationale: Teks utama mempertahankan bentuk infinitif dan ketegangan sintaksis sumber. Berbagai pemahaman yang mungkin dicatat tanpa menetapkan salah satunya sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lancar bagi pembaca umum, sementara frasa penutup yang sulit tetap diterjemahkan cukup dekat dengan bentuk Ibrani dan dijelaskan melalui catatan kaki.
