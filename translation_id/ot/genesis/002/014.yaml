id: GEN.2.14
reference: Genesis 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שֵׁ֨ם הַ/נָּהָ֤ר הַ/שְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽ/הֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְ/הַ/נָּהָ֥ר הָֽ/רְבִיעִ֖י ה֥וּא פְרָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: id
  text: Nama sungai yang ketiga adalah Hidekel[a]. Sungai itu mengalir di sebelah timur Asyur[b]. Sungai yang keempat adalah Efrat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hidekel secara tradisional diidentifikasi sebagai Sungai Tigris.
    reason: alternative_reading
  - marker: b
    text: 'Atau “di sebelah timur Asiria”; bahasa Ibrani: “di sebelah timur Asyur.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: nama
  rationale: Makna baku kata Ibrani ini dan wajar dalam rumusan penamaan sungai.
- source_word: נָּהָר
  choice: sungai
  rationale: Padanan langsung dan sesuai konteks untuk aliran air besar.
- source_word: שְּׁלִישִׁי
  choice: yang ketiga
  rationale: Menerjemahkan bilangan bertingkat secara langsung dan alami dalam bahasa Indonesia.
- source_word: חִדֶּקֶל
  choice: Hidekel
  rationale: Mentransliterasikan bentuk nama Ibrani, sementara identifikasi tradisionalnya dicantumkan dalam catatan kaki.
- source_word: הוּא הַהֹלֵךְ
  choice: Sungai itu mengalir
  rationale: Partisip הלך secara harfiah berarti 'berjalan/pergi', tetapi untuk sungai, 'mengalir' menyampaikan maksudnya secara alami tanpa mengubah acuan.
- source_word: קִדְמַת
  choice: di sebelah timur
  rationale: Dalam konteks geografis, bentuk ini paling wajar dipahami sebagai penunjuk lokasi di sebelah timur.
- source_word: אַשּׁוּר
  choice: Asyur
  rationale: Mempertahankan nama Ibrani dalam bentuk yang lazim di Indonesia; nama itu dapat merujuk kepada Asyur atau wilayah Asiria, sehingga alternatifnya dijelaskan dalam catatan.
- source_word: רְבִיעִי
  choice: yang keempat
  rationale: Menerjemahkan bilangan bertingkat secara langsung.
- source_word: פְרָת
  choice: Efrat
  rationale: Menggunakan bentuk nama sungai yang sudah lazim dalam tradisi Alkitab bahasa Indonesia dan mewakili nama Ibrani Perat/Efrat, yang dikenal sebagai Efrat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami dengan mengulang 'sungai' sebagai acuan, sambil mempertahankan urutan serta ambiguitas geografis nama Asyur.
