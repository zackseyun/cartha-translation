id: GEN.2.8
reference: Genesis 2:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: id
  text: Lalu Yahweh Allah menanam sebuah taman di Eden, di sebelah timur,[a] dan di sana Ia menempatkan manusia yang telah dibentuk-Nya itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah timur.” Frasa Ibrani ini dapat menunjukkan lokasi di sebelah timur ataupun arah menuju timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: menanam
  rationale: Kata kerja נטע paling wajar menggambarkan tindakan menanam; pilihan ini mempertahankan gambaran konkret tentang taman.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah', sesuai fungsi gabungan sebutan ilahi ini.
- source_word: גַּן בְעֵדֶן
  choice: sebuah taman di Eden
  rationale: גַּן berarti taman atau kawasan bertanam yang terlindung, dan עֵדֶן merupakan nama tempat. Artikel tak tentu 'sebuah' membuat frasa alami dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מִקֶּדֶם
  choice: di sebelah timur
  rationale: Dalam konteks ini frasa tersebut paling mungkin menyatakan lokasi di kawasan timur, tetapi kemungkinan makna arah tetap dicatat dalam catatan kaki.
- source_word: וַיָּשֶׂם שָׁם
  choice: di sana Ia menempatkan
  rationale: שׂים berarti menaruh atau menempatkan; 'menempatkan' sesuai untuk seseorang dan berpadu alami dengan penunjuk lokasi שָׁם.
- source_word: הָאָדָם
  choice: manusia ... itu
  rationale: Bentuk berartikel ini menunjuk kepada manusia tertentu yang baru saja dibentuk. 'Manusia ... itu' mempertahankan kaitan naratif tanpa memaksakan nama diri 'Adam' pada tahap ini.
- source_word: אֲשֶׁר יָצָר
  choice: yang telah dibentuk-Nya
  rationale: יצר berarti membentuk atau membentuk dengan terampil. Bentuk 'telah dibentuk-Nya' memperjelas bahwa tindakan itu mendahului penempatannya di taman.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Acuan הָאָדָם
  choice: manusia ... itu
  alternative: laki-laki itu
  rationale: Dalam konteks ini frasa itu menunjuk individu yang telah dibentuk, tetapi kata אָדָם tetap berkaitan dengan manusia sebagai makhluk. Pilihan ini mempertahankan acuan individual tanpa mempersempit nuansanya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur naratif Ibrani, dengan kelancaran alami dalam bahasa Indonesia. Huruf kapital pada 'Ia' dipakai sebagai bentuk penghormatan yang lazim, bukan untuk menambahkan informasi gramatikal.
