revisions:
- from: Lalu TUHAN Allah membentuk[a] dari tanah segala binatang di padang dan segala burung di langit. Ia membawa semuanya kepada manusia itu[b] untuk melihat nama apa yang akan diberikannya kepada mereka. Apa pun nama yang diberikan manusia itu kepada setiap makhluk hidup, itulah namanya.
  to: TUHAN Allah membentuk[a] dari tanah segala binatang di padang dan segala burung di langit, lalu Ia membawa semuanya kepada manusia itu[b] untuk melihat nama apa yang akan diberikan manusia itu kepada mereka. Apa pun nama yang diberikan manusia itu kepada setiap makhluk hidup, itulah namanya.
  rationale: Revisi hanya memperjelas bahwa manusia itu, bukan Allah, ialah pelaku pemberian nama. Kata penghubung awal “Lalu” dihilangkan karena waw naratif tidak mengharuskan penanda waktu eksplisit pada awal ayat; “lalu” tetap digunakan untuk menghubungkan tindakan membawa dengan pembentukan dalam alur kalimat. Catatan kaki dipertahankan karena secara memadai menyajikan alternatif yang didukung konteks tanpa memaksakan pembacaan tertentu.
