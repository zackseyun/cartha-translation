id: GEN.2.19
reference: Genesis 2:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: id
  text: TUHAN Allah membentuk[a] dari tanah segala binatang di padang dan segala burung di langit, lalu Ia membawa semuanya kepada manusia itu[b] untuk melihat nama apa yang akan diberikan manusia itu kepada mereka. Apa pun nama yang diberikan manusia itu kepada setiap makhluk hidup, itulah namanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah membentuk.” Bentuk kata kerja Ibrani dapat diterjemahkan sebagai tindakan lampau biasa; konteks juga memungkinkan tindakan itu dipahami telah terjadi sebelum binatang-binatang tersebut dibawa kepada manusia.
    reason: alternative_reading
  - marker: b
    text: Atau “Adam.” Dalam bahasa Ibrani tertulis ha’adam, secara harfiah “manusia itu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: Lalu ... membentuk
  rationale: Bentuk wayyiqtol biasanya melanjutkan alur narasi. Kata “membentuk” menerjemahkan יצר secara langsung, sedangkan “lalu” menyampaikan fungsi penghubung וַ tanpa menambahkan penanda waktu seperti “sekarang.” Kemungkinan hubungan waktu yang lebih dahulu tetap dicatat dalam catatan kaki.
- source_word: יְהוָה אֱלֹהִים
  choice: TUHAN Allah
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk konvensional “TUHAN,” dan אֱלֹהִים sebagai “Allah.”
- source_word: מִן הָאֲדָמָה
  choice: dari tanah
  rationale: אֲדָמָה berarti tanah atau permukaan tanah dan mempertahankan kaitan leksikal dengan הָאָדָם, “manusia itu.”
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: segala binatang di padang
  rationale: Ungkapan ini secara harfiah menunjuk pada binatang di padang atau wilayah terbuka. Pilihan ini tidak mempersempit maknanya hanya kepada binatang liar.
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: segala burung di langit
  rationale: עוֹף dalam konteks ini paling wajar dipahami sebagai burung, sedangkan הַשָּׁמַיִם diterjemahkan “langit.”
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: Ia membawa semuanya kepada manusia itu
  rationale: Objek jamak tersirat dari kelompok binatang dan burung sebelumnya, sehingga “semuanya” diperlukan dalam bahasa Indonesia. הָאָדָם masih berfungsi paling alami sebagai nomina umum tertentu.
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: untuk melihat nama apa yang akan diberikannya kepada mereka
  rationale: קרא dengan ל dapat berarti memanggil atau memberi nama. Susunan “nama apa yang akan diberikannya” alami dalam bahasa Indonesia dan mempertahankan tujuan tindakan Allah.
- source_word: וְכֹל אֲשֶׁר יִקְרָא לוֹ הָאָדָם נֶפֶשׁ חַיָּה
  choice: Apa pun nama yang diberikan manusia itu kepada setiap makhluk hidup
  rationale: כֹל אֲשֶׁר menyatakan cakupan terbuka, sedangkan נֶפֶשׁ חַיָּה di sini berarti makhluk hidup, bukan “jiwa” dalam pengertian teologis yang lebih kemudian.
- source_word: הוּא שְׁמוֹ
  choice: itulah namanya
  rationale: Klausa nominal Ibrani ini diterjemahkan secara ringkas dan alami, dengan rujukan kepada masing-masing makhluk yang dinamai.
theological_decisions:
- issue: Hubungan waktu וַיִּצֶר dengan penciptaan binatang dalam Kejadian 1
  choice: membentuk
  alternative: telah membentuk
  rationale: Bentuk Ibraninya lazim melanjutkan narasi dan tidak secara morfologis menandai kala lampau sempurna. Namun, konteks dapat mendukung tindakan yang telah berlangsung sebelumnya; alternatif itu dicatat tanpa memaksakan harmonisasi kronologis ke dalam teks utama.
- issue: Status הָאָדָם sebagai nomina umum atau nama diri
  choice: manusia itu
  alternative: Adam
  rationale: Artikel pada הָאָדָם dan permainan kata dengan אֲדָמָה mendukung arti harfiah “manusia itu.” Tradisi membacanya sebagai nama diri tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pemilihan “manusia itu” mempertahankan kaitan kata antara manusia (adam) dan tanah (adamah), sementara pengulangan ungkapan “nama yang diberikan” menyampaikan tindakan penamaan secara alami.
