  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: id
  text: Nama sungai yang pertama ialah Pison. Sungai itu mengelilingi[a] seluruh tanah Hawila, tempat terdapat emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "mengitari" atau "mengalir mengelilingi". Partisip Ibrani dapat berarti "mengelilingi" atau "mengitari"; terjemahan "mengalir mengelilingi" membuat gambaran sungai lebih eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: Nama sungai yang pertama
  rationale: Secara harfiah, frasa ini berarti 'nama yang pertama'. Dalam konteks daftar empat sungai, הָאֶחָד berfungsi secara ordinal; penambahan 'sungai' memperjelas rujukannya secara alami dalam bahasa Indonesia.
- source_word: פִּישׁוֹן
  choice: Pison
  rationale: Nama diri sungai ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: הוּא הַסֹּבֵב
  choice: Sungai itu mengalir mengelilingi
  rationale: הוּא merujuk kembali kepada Pison, sedangkan partisip סבב menyatakan gerak mengitari atau mengelilingi. 'Mengalir' membuat konteks sungai eksplisit, dan 'mengelilingi' mempertahankan makna geografis verba tersebut.
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: seluruh tanah Hawila
  rationale: כָּל dipertahankan sebagai 'seluruh', dan אֶרֶץ menunjuk wilayah bernama, sehingga 'tanah' tepat tanpa menyiratkan seluruh bumi.
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: tempat terdapat emas
  rationale: Frasa relatif-lokatif ini menerangkan tanah Hawila. 'Tempat terdapat emas' menyampaikan keberadaan emas dengan alami tanpa mempertahankan artikel Ibrani secara kaku.
