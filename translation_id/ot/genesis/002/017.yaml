id: GEN.2.17
reference: Genesis 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: id
  text: tetapi dari pohon pengetahuan tentang yang baik dan yang jahat itu janganlah kaumakan, sebab pada hari engkau memakannya[a], engkau pasti mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “pada hari engkau memakannya” juga dapat berarti “ketika engkau memakannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: tetapi dari pohon
  rationale: Konjungsi ו dengan מִן secara harfiah berarti 'dan dari', tetapi dalam konteks ini menyatakan kontras dengan izin luas pada ayat sebelumnya; 'tetapi dari pohon' mempertahankan fungsi wacananya.
- source_word: הַדַּעַת טוֹב וָרָע
  choice: pengetahuan tentang yang baik dan yang jahat
  rationale: דַּעַת menunjuk pada pengetahuan atau pengenalan, sedangkan pasangan טוֹב וָרָע dipertahankan sebagai 'yang baik dan yang jahat' agar bobot moral dan keluasan ungkapannya tidak dipersempit.
- source_word: לֹא תֹאכַל
  choice: janganlah kaumakan
  rationale: Bentuk negatif ini merupakan larangan. 'Janganlah kaumakan' terdengar alami, tegas, dan khidmat dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak tersurat.
- source_word: בְּיוֹם אֲכָלְךָ מִמֶּנּוּ
  choice: pada hari engkau memakannya
  rationale: Terjemahan ini mempertahankan unsur harfiah 'pada hari' dan tidak langsung mengubahnya menjadi 'ketika', sehingga nuansa temporal serta ketegangan dalam narasi tetap terbuka.
- source_word: מוֹת תָּמוּת
  choice: engkau pasti mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian. 'Pasti mati' menyampaikan penekanan itu secara jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Daya temporal frasa 'pada hari engkau memakannya' dan hubungannya dengan penggenapan kematian
  choice: Mempertahankan ungkapan 'pada hari' tanpa menjelaskan jenis atau waktu penggenapan kematian
  alternative: Menerjemahkan secara dinamis 'ketika engkau memakannya' atau menafsirkan frasa itu sebagai kematian jasmani seketika
  rationale: Bahasa Ibrani memungkinkan ungkapan temporal yang dapat dipahami lebih luas daripada satu hari kalender. Terjemahan utama mempertahankan bentuk dan ketegangan teks tanpa memilih tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kaumakan' mempertahankan sapaan tunggal dan membuat larangan ringkas serta alami. Susunan topik Ibrani yang mengulang 'darinya' tidak ditiru secara kaku karena akan terasa janggal dalam bahasa Indonesia; objeknya tetap jelas melalui '-nya' pada 'memakannya'.
