  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: id
  text: Lalu manusia itu memberi nama kepada semua ternak, kepada burung-burung di langit, dan kepada setiap binatang liar. Tetapi manusia itu[a] tidak menemukan seorang penolong yang sepadan dengannya.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Adam.”'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “yang cocok baginya.”'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tetapi bagi manusia itu tidak ditemukan seorang penolong yang sepadan dengannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: manusia itu / bagi manusia itu
  rationale: Kata ini memakai artikel pada kemunculan pertama dan menunjuk kepada individu dalam kisah, bukan umat manusia secara umum. 'Manusia itu' mempertahankan fungsi kata benda umum tanpa terlalu dini menjadikannya nama diri 'Adam'.
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: memberi nama
  rationale: Ungkapan Ibrani ini berarti menetapkan atau memberikan nama; 'memberi nama' alami dalam bahasa Indonesia dan mencerminkan objek jamak שֵׁמוֹת.
- source_word: הַבְּהֵמָה
  choice: semua ternak
  rationale: Dalam rangkaian yang dikontraskan dengan binatang liar, istilah ini menunjuk pada hewan peliharaan atau ternak sebagai kelompok.
- source_word: עוֹף הַשָּׁמַיִם
  choice: burung-burung di langit
  rationale: Pilihan ini mempertahankan gambaran langit dan terdengar alami dalam bahasa Indonesia modern.
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: setiap binatang liar
  rationale: Frasa ini menunjuk pada binatang darat yang tidak dipelihara; 'binatang liar' menyampaikan kontrasnya dengan ternak secara jelas.
- source_word: עֵזֶר
  choice: seorang penolong
  rationale: Dalam konteks ini kata tersebut menunjuk kepada pribadi yang memberikan pertolongan. 'Penolong' tidak dengan sendirinya menyiratkan kedudukan yang lebih rendah.
- source_word: כְּנֶגְדּוֹ
  choice: yang sepadan dengannya
  rationale: Ungkapan ini mengandung gagasan berada di hadapan dan bersesuaian dengannya. 'Sepadan dengannya' mempertahankan relasi kecocokan tanpa mempersempitnya menjadi sekadar berguna atau cocok.
- source_word: לֹא מָצָא
  choice: tidak ditemukan
  rationale: Bentuk Ibraninya secara harfiah aktif, 'ia tidak menemukan', tetapi konstruksi pasif Indonesia menyatakan hasil pencarian secara alami dan menjaga fokus pada tidak adanya penolong yang sepadan. Bentuk aktif dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan אָדָם dalam Kejadian 2:20
  choice: manusia itu
  alternative: Adam
  rationale: Ayat ini berbicara tentang individu manusia dalam taman, tetapi artikel pada kemunculan pertama masih menonjolkan arti kata bendanya. 'Manusia itu' menjaga perkembangan sastra sebelum istilah tersebut tampil lebih jelas sebagai nama diri; 'Adam' tetap mungkin dan dicatat sebagai alternatif.
- issue: Makna relasional כְּנֶגְדּוֹ
  choice: yang sepadan dengannya
  alternative: yang cocok baginya
  rationale: Pilihan utama menjaga gagasan korespondensi atau kesejajaran tanpa memasukkan anggapan bahwa penolong itu lebih rendah. Alternatif 'cocok baginya' sah, tetapi sedikit lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami, sedangkan pengulangan 'manusia itu' mempertahankan rujukan Ibrani. Semua alternatif penting mengenai bentuk aktif/pasif, nama Adam, dan nuansa כְּנֶגְדּוֹ dipertahankan melalui catatan kaki.
