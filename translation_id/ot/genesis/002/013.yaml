  terminology: “Gihon” dan “Kush” dipertahankan sebagai nama diri/transliterasi, sehingga tidak mengidentifikasikan Kush secara anahronistis sebagai negara modern. Catatan kaki budaya ringkas, akurat, dan penandanya ditempatkan tepat pada “Kush.”
