translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. “Ialah” dipakai untuk memperkenalkan nama sungai, sedangkan “sungai itulah” mempertahankan penegasan pronomina Ibrani. Penanda catatan kaki ditempatkan setelah nama Kush karena catatan menerangkan nama tempat tersebut.
