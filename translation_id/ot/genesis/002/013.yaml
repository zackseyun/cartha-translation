base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: id
  text: Nama sungai yang kedua ialah Gihon; sungai itulah yang mengelilingi seluruh tanah Kush.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kush adalah nama tempat kuno yang biasanya dikaitkan dengan wilayah di sebelah selatan Mesir; teks Ibrani mempertahankan nama kuno itu sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: Nama sungai yang kedua
  rationale: Ungkapan ini meneruskan daftar sungai. Dalam bahasa Indonesia, hubungan naratifnya tetap jelas tanpa harus menerjemahkan וְ secara tersendiri dengan “dan”.
- source_word: גִּיחוֹן
  choice: Gihon
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan tidak diterjemahkan.
- source_word: הוּא הַ/סּוֹבֵב
  choice: sungai itulah yang mengelilingi
  rationale: Pengulangan “sungai” membuat rujukan הוּא jelas dan alami, sedangkan bentuk “itulah” mempertahankan daya identifikasinya. סבב dapat berarti mengelilingi atau mengitari.
- source_word: אֵת כָּל אֶרֶץ
  choice: seluruh tanah
  rationale: Menerjemahkan cakupan כָּל secara alami dan tetap mempertahankan אֶרֶץ sebagai wilayah atau tanah.
- source_word: כּוּשׁ
  choice: Kush
  rationale: Nama tempat kuno dipertahankan dalam transliterasi; menerjemahkannya sebagai Etiopia akan mempersempit identifikasi geografis yang tidak dipastikan oleh ayat ini.
