source:
  edition: WLC
  text: וְ/אֵ֖ד יַֽעֲלֶ֣ה מִן הָ/אָ֑רֶץ וְ/הִשְׁקָ֖ה אֶֽת כָּל פְּנֵֽי הָֽ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: id
  text: Namun, kabut naik dari bumi dan membasahi seluruh permukaan tanah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aliran air” atau “air yang memancar”; istilah Ibrani ini langka dan mungkin menunjuk pada air yang muncul dari dalam tanah, bukan kabut di udara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: Namun, kabut
  rationale: אֵד adalah kata yang langka dan maknanya diperdebatkan. “Kabut” sesuai dengan verba “naik,” sedangkan וְ diterjemahkan “Namun” untuk menandai kontras dengan ketiadaan hujan pada ayat sebelumnya.
- source_word: יַעֲלֶה
  choice: naik
  rationale: Bentuk imperfek Qal dari עלה menyatakan gerakan naik. Dalam konteks uraian keadaan masa lampau, bahasa Indonesia tidak perlu menandai aspek kebiasaan secara eksplisit.
- source_word: מִן הָ/אָ֑רֶץ
  choice: dari bumi
  rationale: אֶרֶץ di sini cocok dipahami sebagai “bumi” dalam konteks penciptaan yang luas dan tetap dibedakan dari אֲדָמָה pada akhir ayat.
- source_word: וְ/הִשְׁקָה
  choice: dan membasahi
  rationale: Bentuk Hifil dari שקה berarti memberi minum atau mengairi. “Membasahi” alami untuk kabut sebagai subjek dan menyampaikan bahwa air mencapai tanah tanpa memakai istilah teknis.
- source_word: אֶת כָּל פְּנֵי
  choice: seluruh permukaan
  rationale: Ungkapan Ibrani harfiah “seluruh muka” secara idiomatis menunjuk pada keseluruhan permukaan.
- source_word: הָֽ/אֲדָמָֽה
  choice: tanah
  rationale: אֲדָמָה menunjuk pada tanah atau lahan dan dibedakan dari אֶרֶץ, yang diterjemahkan “bumi” dalam ayat ini.
theological_decisions:
- issue: Penafsiran אֵד
  choice: kabut
  alternative: aliran air atau air yang memancar dari dalam tanah
  rationale: Gerakan “naik” mendukung pengertian kabut, tetapi karena istilah Ibraninya langka dan dapat menunjuk pada air yang muncul dari tanah, alternatif hidrologis dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Namun” menghubungkan ayat ini dengan ketiadaan hujan dalam ayat sebelumnya. Perbedaan antara אֶרֶץ (“bumi”) dan אֲדָמָה (“tanah”) dipertahankan.
