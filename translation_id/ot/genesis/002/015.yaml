  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: id
  text: Kemudian Yahweh Allah mengambil manusia itu dan menempatkannya di Taman Eden untuk mengusahakannya dan menjaganya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk mengolahnya dan mengawasinya.” Kata-kata kerja Ibrani ini dapat berarti “mengerjakan/mengolah” dan “menjaga/mengawasi.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “menempatkannya” juga dapat berarti “membuatnya beristirahat” atau “membuatnya menetap di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar אֱלֹהִים.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam bahasa Indonesia, 'Allah' merupakan padanan baku bagi sebutan umum untuk God dan berpadu secara wajar dalam ungkapan 'Yahweh Allah'.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Bentuk dengan artikel menunjuk kepada manusia tertentu yang sebelumnya dibentuk; 'manusia itu' mempertahankan hubungan leksikal dengan אָדָם tanpa menjadikannya nama diri.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna langsung לקח dalam konteks naratif ini ialah mengambil; terjemahan ini tidak memperluas tindakan secara spekulatif.
- source_word: וַיַּנִּחֵהוּ
  choice: menempatkannya
  rationale: Bentuk hifil dari נוח dalam konteks pemindahan ke taman secara wajar berarti menempatkan atau menetapkan di suatu tempat, sementara nuansa 'membuat beristirahat' dicatat dalam catatan kaki.
- source_word: בְּגַן עֵדֶן
  choice: di Taman Eden
  rationale: Ungkapan alami dalam bahasa Indonesia untuk frasa konstruksi Ibrani ini; kapitalisasi menandai nama tempat yang dikenal.
- source_word: לְעָבְדָהּ
  choice: untuk mengusahakan
  rationale: Dengan taman sebagai objek, עבד menyatakan mengerjakan atau mengolahnya. 'Mengusahakan' cukup luas untuk mencakup pengelolaan tanpa membatasi makna hanya pada bercocok tanam.
- source_word: וּלְשָׁמְרָהּ
  choice: dan menjaganya
  rationale: שמר mencakup menjaga, memelihara, dan mengawasi. 'Menjaga' mempertahankan kemungkinan unsur perawatan maupun perlindungan.
theological_decisions:
- issue: Fungsi tugas manusia di Eden
  choice: Ayat ini menyatakan panggilan manusia untuk mengusahakan dan menjaga taman tanpa menetapkannya secara khusus sebagai tugas pertanian saja atau pelayanan keimaman.
  alternative: Menerjemahkan pasangan verba sebagai istilah teknis bagi pelayanan dan penjagaan tempat kudus, atau semata-mata sebagai pengolahan pertanian.
  rationale: עבד dan שמר dapat memiliki gema pertanian maupun, dalam konteks lain, pelayanan dan penjagaan tempat suci. Konteks ayat ini tidak memaksa salah satu penafsiran khusus, sehingga terjemahan mempertahankan keluasan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama ilahi dan keluasan makna kedua verba tugas tetap dipertahankan.
