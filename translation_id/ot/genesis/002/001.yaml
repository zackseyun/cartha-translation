translation:
  language: id
  text: Demikianlah langit dan bumi serta seluruh isinya telah diselesaikan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah dirampungkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: selesai dijadikan
  rationale: Bentuk pasif dari כלה menyatakan bahwa seluruh karya penciptaan telah mencapai penyelesaian. Dalam bahasa Indonesia, “selesai dijadikan” mempertahankan hasil pasif sekaligus memperjelas konteks penciptaan tanpa mengubahnya menjadi tindakan aktif.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam pasangan merismatis “langit dan bumi,” bentuk Indonesia yang alami ialah “langit,” yang mencakup ranah di atas dan bukan hanya cuaca atau cakrawala yang tampak.
- source_word: וְהָאָרֶץ
  choice: dan bumi
  rationale: Dalam konteks penciptaan, אֶרֶץ menunjuk pada bumi sebagai ranah daratan, bukan suatu negeri tertentu.
- source_word: וְכָל צְבָאָם
  choice: beserta segala isinya
  rationale: צָבָא secara harfiah dapat berarti bala tentara, barisan, atau kumpulan. Di sini ungkapan tersebut merangkum segala sesuatu yang memenuhi langit dan bumi; “segala isinya” menyampaikan cakupan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan frasa וְכָל צְבָאָם
  choice: Segala sesuatu yang mengisi atau termasuk dalam langit dan bumi
  alternative: Bala tentara mereka; seluruh barisannya; khususnya benda-benda langit
  rationale: Konteks penutup kisah penciptaan mendukung cakupan menyeluruh. Terjemahan tidak membatasi rujukannya hanya pada bintang atau makhluk surgawi, tetapi juga tidak menambahkan daftar isi yang tidak dinyatakan oleh teks.
- issue: Nuansa penyelesaian dalam וַיְכֻלּוּ
  choice: Penciptaan telah mencapai keadaan selesai
  alternative: Langit dan bumi dibawa kepada kesempurnaan
  rationale: Kata kerja menekankan rampungnya pekerjaan. “Selesai dijadikan” mempertahankan keadaan hasil tersebut tanpa memasukkan gagasan kesempurnaan metafisis yang tidak harus terkandung dalam kata Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan “langit dan bumi beserta segala isinya” menghindari istilah “bala tentara” yang dalam pemakaian Indonesia masa kini mudah dipahami secara terlalu militer, sambil tetap menyampaikan cakupan kolektif צְבָאָם.
