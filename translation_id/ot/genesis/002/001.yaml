- from: Demikianlah langit dan bumi beserta segala isinya selesai dijadikan.[a]
  to: Demikianlah langit dan bumi serta seluruh isinya telah diselesaikan.[a]
  rationale: Revisi menghapus penambahan “dijadikan” dan memakai pasif “telah diselesaikan” untuk mencerminkan וַיְכֻלּוּ. Padanan “seluruh isinya” tetap mempertahankan rujukan menyeluruh dari וְכָל־צְבָאָם secara alami dalam bahasa Indonesia.
