  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: id
  text: 'Lalu manusia itu berkata, “Akhirnya, inilah dia: tulang dari tulangku dan daging dari dagingku. Dia akan disebut perempuan[a], karena dia diambil dari laki-laki.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani terdapat permainan bunyi antara ʼishah, “perempuan,” dan ʼish, “laki-laki.”
    reason: wordplay
lexical_decisions:
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Dalam narasi Kejadian 2, bentuk definit הָאָדָם masih wajar diterjemahkan sebagai 'manusia itu'; pembedaan berdasarkan jenis kelamin kemudian dinyatakan secara khusus melalui אִשָּׁה dan אִישׁ. Pilihan ini mempertahankan kesinambungan pemakaian אָדָם tanpa mengaburkan konteks laki-laki pada ayat ini.
- source_word: זֹאת הַפַּעַם
  choice: Inilah dia
  rationale: Ungkapan ini menandai pengenalan yang penuh penegasan setelah rangkaian sebelumnya. 'Inilah dia' alami dalam bahasa Indonesia dan menyampaikan daya seru serta rasa akhirnya ditemukan, tanpa menerjemahkan הַפַּעַם secara kaku sebagai 'kali ini'.
- source_word: עֶצֶם מֵעֲצָמַי וּבָשָׂר מִבְּשָׂרִי
  choice: tulang dari tulangku dan daging dari dagingku
  rationale: Kata depan מִן diterjemahkan 'dari', sesuai dengan gambaran asal-usul dalam teks dan paralel dengan klausa penutup, sambil mempertahankan kesejajaran puitis.
- source_word: לְזֹאת יִקָּרֵא
  choice: Dia akan disebut
  rationale: Dalam bahasa Indonesia, 'dia' secara alami merujuk kembali kepada perempuan yang baru dihadirkan. Bentuk pasif 'akan disebut' mempertahankan formula penamaan Niphal.
- source_word: אִשָּׁה ... אִישׁ
  choice: perempuan ... laki-laki
  rationale: Pasangan ini menyampaikan pembedaan jenis kelamin secara tepat dalam bahasa Indonesia. Permainan bunyi Ibrani tidak dapat dipertahankan secara alami dalam terjemahan sehingga dijelaskan dalam catatan kaki.
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: karena dia diambil dari laki-laki
  rationale: '''Karena'' mempertahankan hubungan sebab, sedangkan bentuk pasif feminin diterjemahkan secara alami dengan ''dia diambil''. Demonstratif akhir tidak diulang secara kaku karena rujukannya sudah jelas.'
theological_decisions:
- issue: Makna אָדָם dalam konteks
  choice: manusia itu
  alternative: laki-laki itu
  rationale: Walaupun tokoh tersebut jelas laki-laki dalam konteks ini, leksem אָדָם berbeda dari אִישׁ yang muncul pada permainan kata berikutnya. 'Manusia itu' menjaga perbedaan leksikal tersebut dan tidak memaksakan klaim antropologis di luar ayat.
- issue: Permainan kata אִשָּׁה / אִישׁ
  choice: perempuan ... laki-laki, dengan catatan kaki
  alternative: wanita ... pria tanpa penjelasan
  rationale: Bahasa Indonesia tidak memiliki permainan kata sepadan yang alami. Terjemahan utama menyampaikan makna leksikal, sedangkan catatan kaki mempertahankan informasi sastra yang penting tanpa menciptakan etimologi Indonesia yang palsu.
- issue: Daya ungkapan זֹאת הַפַּעַם
  choice: Inilah dia
  alternative: Kali ini, inilah
  rationale: Pilihan utama menyampaikan seruan pengenalan atau pemenuhan yang tersirat dalam konteks, sedangkan alternatif yang lebih harfiah terdengar berulang dan kaku dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-puitis yang lugas. Pengulangan 'tulang ... tulangku' dan 'daging ... dagingku' dipertahankan untuk menjaga bentuk puisi Ibrani; tanda seru tidak ditambahkan agar tingkat emosi tidak ditentukan melebihi teks.
