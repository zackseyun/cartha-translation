  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּן֙ יַֽעֲזָב אִ֔ישׁ אֶת אָבִ֖י/ו וְ/אֶת אִמּ֑/וֹ וְ/דָבַ֣ק בְּ/אִשְׁתּ֔/וֹ וְ/הָי֖וּ לְ/בָשָׂ֥ר אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: id
  text: Itulah sebabnya seorang laki-laki akan meninggalkan ayahnya dan ibunya, lalu berpaut pada istrinya[a], dan mereka akan menjadi satu daging[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berpegang erat pada” atau “bersatu dengan”. Kata kerja Ibrani ini menggambarkan keterikatan atau kelekatan yang kuat.
    reason: lexical_alternative
  - marker: b
    text: “Satu daging” adalah ungkapan Ibrani yang mencakup persatuan jasmani dan terbentuknya ikatan kekerabatan baru.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menandai kesimpulan yang ditarik dari kisah sebelumnya dengan ungkapan Indonesia yang alami dan tetap mempertahankan daya penjelasnya.
- source_word: יַעֲזָב
  choice: akan meninggalkan
  rationale: Bentuk yiqtol di sini menyatakan prinsip umum yang berorientasi ke depan. Pilihan ini mempertahankan sifat normatif-peribahasanya tanpa mengubahnya menjadi perintah langsung.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk tunggal maskulin yang secara representatif merujuk kepada pihak laki-laki dalam perkawinan.
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: ayahnya dan ibunya
  rationale: Ibrani menyebut kedua orang tua secara tersendiri; terjemahan ini mempertahankan bentuk dan penekanannya.
- source_word: וְדָבַק
  choice: lalu berpaut pada
  rationale: Kata kerja דבק menggambarkan keterikatan yang kuat. 'Berpaut pada' terasa wajar dan bermartabat serta mempertahankan daya gambarnya tanpa menjadi terlalu teknis.
- source_word: בְּאִשְׁתּוֹ
  choice: istrinya
  rationale: Dalam konteks ini אִשָּׁה dengan sufiks posesif berarti istri, bukan sekadar seorang perempuan.
- source_word: וְהָיוּ
  choice: dan mereka akan menjadi
  rationale: Subjek jamaknya tersirat dalam bentuk verba. 'Menjadi' menyampaikan hasil atau perubahan menuju kesatuan yang dinyatakan oleh predikat.
- source_word: לְבָשָׂר אֶחָד
  choice: satu daging
  rationale: Mempertahankan metafora Ibrani secara langsung beserta jangkauan maknanya, yang mencakup persatuan jasmani dan ikatan kekerabatan baru, tanpa mempersempitnya menjadi hanya 'satu tubuh'.
theological_decisions:
- issue: Bahasa representatif bergender dalam rumusan perkawinan
  choice: seorang laki-laki
  alternative: seseorang
  rationale: Teks Ibrani secara eksplisit memakai bentuk tunggal maskulin אִישׁ; terjemahan mempertahankannya tanpa menggeneralisasi secara netral-gender.
- issue: Sifat pernyataan
  choice: prinsip umum dengan bentuk 'akan meninggalkan ... akan menjadi'
  alternative: perintah langsung atau gambaran kebiasaan masa lampau semata
  rationale: Bentuk verbal Ibrani menyajikan prinsip umum yang didasarkan pada kisah penciptaan, bukan imperatif langsung maupun sekadar laporan tentang masa lampau.
- issue: Cakupan ungkapan 'satu daging'
  choice: mempertahankan ungkapan metaforis tanpa membatasi maknanya
  alternative: satu tubuh atau satu keluarga
  rationale: Ungkapan Ibrani mengandung dimensi persatuan jasmani sekaligus terbentuknya ikatan kekerabatan baru; salah satu parafrasa alternatif akan mempersempit ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Itulah sebabnya' lebih luwes daripada 'oleh karena itu' dalam alur naratif. 'Berpaut' mempertahankan gambaran kelekatan yang kuat, sedangkan catatan kaki menyajikan padanan alternatif. Urutan penanda catatan kaki mengikuti kemunculannya dalam teks.
