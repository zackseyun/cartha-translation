  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: id
  text: Lalu TUHAN Allah membuat laki-laki itu tertidur lelap, dan ia pun tidur. Kemudian Dia mengambil salah satu tulang rusuknya[a], lalu menutup tempat itu dengan daging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “salah satu sisinya.” Kata Ibrani yang dipakai dapat berarti sisi atau bagian samping, selain tulang rusuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל ... תַּרְדֵּמָה
  choice: membuat ... tertidur lelap
  rationale: Bentuk kausatif verba נפל bersama תַּרְדֵּמָה menyatakan bahwa Allah menyebabkan tidur yang sangat dalam; ungkapan ini alami dalam bahasa Indonesia tanpa menghilangkan unsur kausatif.
- source_word: יְהוָה אֱלֹהִים
  choice: TUHAN Allah
  rationale: Nama perjanjian יהוה diterjemahkan menurut konvensi Alkitab bahasa Indonesia sebagai TUHAN, sedangkan אֱלֹהִים diterjemahkan Allah.
- source_word: הָאָדָם
  choice: laki-laki itu
  rationale: Dalam konteks langsung, kata ini menunjuk kepada pribadi laki-laki tertentu, bukan umat manusia secara umum; pilihan ini juga membedakannya secara jelas dari perempuan yang akan dibentuk.
- source_word: וַיִּישָׁן
  choice: ketika ia tidur
  rationale: Secara harfiah berarti 'dan ia tidur'. Dalam bahasa Indonesia, klausa waktu menghubungkan keadaan tidurnya dengan tindakan berikutnya secara alami tanpa mengubah urutan peristiwa.
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: salah satu tulang rusuknya
  rationale: צֵלָע dapat berarti tulang rusuk atau sisi. Gambaran pengambilan bagian tubuh dan penutupan tempatnya dengan daging mendukung 'tulang rusuk', sementara alternatif 'sisi' dipertahankan dalam catatan kaki.
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: lalu menutup tempat itu dengan daging
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang menutup daging pada tempat bagian yang diambil. Terjemahan ini menyampaikan tindakan penutupan lokasi tersebut secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna הָאָדָם dalam konteks ini
  choice: laki-laki itu
  alternative: manusia itu
  rationale: Ayat ini mengisahkan seorang pribadi laki-laki yang darinya perempuan akan dibentuk pada ayat berikutnya. Namun, istilah Ibraninya sendiri juga dapat berarti manusia dalam konteks lain.
- issue: Makna צֵלָע
  choice: tulang rusuk
  alternative: sisi
  rationale: Makna anatomis 'tulang rusuk' sesuai dengan tindakan mengambil bagian tubuh dan menutup bekasnya dengan daging. Karena 'sisi' tetap merupakan kemungkinan leksikal yang nyata, alternatif itu dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat dibuat alami untuk narasi, dengan nama ilahi ditulis “TUHAN Allah” sesuai konvensi umum Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang diterangkannya.
