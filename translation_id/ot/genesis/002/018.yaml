  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: id
  text: Lalu Yahweh Allah berfirman, “Tidak baik kalau manusia itu seorang diri. Aku akan menjadikan baginya seorang penolong yang sepadan dengannya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang penolong yang cocok baginya,” “seorang penolong yang bersesuaian dengannya,” atau “seorang penolong yang sepadan baginya.” Ungkapan Ibrani ini menyatakan seseorang yang berkorespondensi atau cocok dengan manusia itu, bukan sekadar seorang asisten.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi Yahweh dan gelar generik אֱלֹהִים dengan padanan Indonesia yang baku, Allah.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita; 'lalu' menyatakan urutan naratif, sedangkan 'berfirman' merupakan pilihan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: Tidak baik manusia itu seorang diri
  rationale: Menyampaikan penilaian predikatif secara langsung. 'Manusia itu' menunjuk kepada individu yang telah dibentuk dalam konteks, tanpa mengubahnya menjadi umat manusia secara abstrak.
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: Aku akan menjadikan baginya
  rationale: Bentuk imperfek orang pertama menyatakan maksud ilahi, dan לּוֹ dipertahankan sebagai 'baginya'.
- source_word: עֵזֶר
  choice: seorang penolong
  rationale: Nomina ini menunjuk kepada sosok yang memberikan pertolongan; kata itu sendiri tidak menyatakan kedudukan yang lebih rendah.
- source_word: כְּנֶגְדּוֹ
  choice: yang sepadan dengannya
  rationale: Ungkapan ini menggambarkan sosok yang berhadapan dengan, bersesuaian dengan, atau menjadi pasangan yang cocok bagi manusia itu. 'Sepadan dengannya' menjaga gagasan korespondensi tanpa menetapkan hierarki.
theological_decisions:
- issue: Cakupan הָאָדָם dalam konteks
  choice: manusia itu
  alternative: laki-laki itu; umat manusia
  rationale: Konteks menunjuk kepada manusia tertentu yang sebelumnya dibentuk. 'Manusia itu' mempertahankan acuan individual dan kaitan leksikal dengan אָדָם, sementara jenis kelaminnya menjadi jelas dalam perkembangan narasi.
- issue: Kemungkinan kesan hierarkis dalam עֵזֶר כְּנֶגְדּוֹ
  choice: seorang penolong yang sepadan dengannya
  alternative: penolong yang cocok baginya; penolong yang berhadapan dengannya
  rationale: Bahasa Ibrani menyatakan pertolongan dan korespondensi, tetapi tidak secara tersurat menetapkan inferioritas atau superioritas. Pilihan ini mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan khidmat. 'Yahweh Allah' mempertahankan nama diri ilahi. Struktur kalimat dibuat mudah dipahami tanpa menghilangkan nuansa korespondensi dalam כְּנֶגְדּוֹ.
