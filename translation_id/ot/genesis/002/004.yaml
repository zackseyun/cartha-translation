  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: id
  text: Inilah riwayat[a] langit dan bumi ketika keduanya diciptakan, pada waktu Yahweh Allah menjadikan bumi dan langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani toledot sering diterjemahkan “keturunan”; dalam judul-judul bagian Kitab Kejadian kata ini juga dapat berarti “asal-usul,” “riwayat,” atau “catatan.” Nama ilahi dalam teks Ibrani adalah YHWH, yang di sini diterjemahkan “Yahweh”; secara tradisional juga diterjemahkan “TUHAN.” Ungkapan “pada waktu” secara harfiah berbunyi “pada hari,” suatu ungkapan Ibrani yang dapat berarti “ketika.”
    reason: Menjelaskan rentang makna formula תוֹלְדוֹת, alternatif tradisional untuk nama ilahi, dan idiom temporal בְּיוֹם.
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: Inilah riwayat
  rationale: Ungkapan pembuka ini merupakan formula pembagian dalam Kitab Kejadian. 'Inilah riwayat' alami dalam bahasa Indonesia dan menyampaikan fungsi תוֹלְדוֹת sebagai catatan atau sejarah mengenai apa yang selanjutnya berasal dari pokok yang disebutkan.
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan Indonesia yang lazim untuk keseluruhan ciptaan; 'langit' secara alami dapat mencakup bentuk Ibrani yang secara morfologis jamak.
- source_word: בְּהִבָּרְאָם
  choice: ketika semuanya diciptakan
  rationale: Menyampaikan nilai temporal preposisi ב dan bentuk pasif Niphal. 'Semuanya' menjelaskan bahwa sufiks jamak merujuk kepada langit dan bumi tanpa pengulangan yang kaku.
- source_word: בְּיוֹם עֲשׂוֹת
  choice: pada waktu ... menjadikan
  rationale: בְּיוֹם dipakai secara idiomatis dengan arti 'ketika/pada waktu', bukan harus menunjuk satu hari kalender; konstruksi infinitif עֲשׂוֹת dinaturalkan menjadi verba finit.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi YHWH secara langsung dan membedakannya dari gelar אֱלֹהִים.
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: bumi dan langit
  rationale: Mempertahankan pembalikan urutan dari frasa sebelumnya, suatu ciri sastra yang nyata dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama pribadi ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama tersebut secara transparan; tradisi Indonesia lazim memakai 'TUHAN', sehingga alternatif itu dicatat dalam catatan kaki tanpa mengubah teks utama.
- issue: Cakupan ungkapan בְּיוֹם
  choice: pada waktu
  alternative: pada hari
  rationale: Dalam konstruksi ini, ungkapan Ibrani lazim berfungsi temporal secara umum. Terjemahan tidak memaksakan kesimpulan mengenai panjang atau sifat periode penciptaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula pembuka dibuat alami sebagai judul naratif, sementara urutan 'langit dan bumi' lalu 'bumi dan langit' dipertahankan. Satu penanda catatan kaki [a] ditempatkan pada titik yang tidak mengganggu kelancaran ayat.
