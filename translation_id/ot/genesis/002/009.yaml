id: GEN.2.9
reference: Genesis 2:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: id
  text: Yahweh Allah menumbuhkan dari tanah segala pohon yang sedap dipandang dan baik untuk dimakan, juga pohon kehidupan di tengah-tengah taman, serta pohon pengetahuan tentang yang baik dan yang jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “pengetahuan tentang yang baik dan yang jahat” dipertahankan secara harfiah. Para penafsir berbeda pendapat apakah ungkapan ini secara khusus menunjuk pada kemampuan membedakan secara moral, kedewasaan, atau pengetahuan yang menyeluruh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: menumbuhkan
  rationale: Bentuk hifil menyatakan tindakan kausatif; dalam bahasa Indonesia, “menumbuhkan” secara alami menyampaikan bahwa Yahweh Allah menyebabkan pohon-pohon tumbuh.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהִים diterjemahkan “Allah” sesuai penggunaan baku Alkitab bahasa Indonesia.
- source_word: מִן הָאֲדָמָה
  choice: dari tanah
  rationale: אֲדָמָה menunjuk pada tanah tempat tumbuh-tumbuhan bertumbuh; “tanah” tepat, ringkas, dan alami.
- source_word: כָּל עֵץ
  choice: segala pohon
  rationale: Ungkapan tunggal kolektif sesudah כָּל dipertahankan dengan bentuk distributif yang wajar dalam register Alkitab Indonesia.
- source_word: נֶחְמָד לְמַרְאֶה
  choice: sedap dipandang
  rationale: Ungkapan ini menyatakan sesuatu yang menarik atau menyenangkan bagi penglihatan; “sedap dipandang” alami, bermartabat, dan tidak menambah tafsiran.
- source_word: וְטוֹב לְמַאֲכָל
  choice: dan baik untuk dimakan
  rationale: Menyampaikan nilai pohon-pohon itu sebagai makanan dengan konstruksi Indonesia yang jelas dan dekat dengan bahasa sumber.
- source_word: וְעֵץ הַחַיִּים
  choice: juga pohon kehidupan
  rationale: “Pohon kehidupan” merupakan padanan langsung konstruksi genitif Ibrani; “juga” menghubungkannya secara alami dengan kelompok sebelumnya.
- source_word: בְּתוֹךְ הַגָּן
  choice: di tengah-tengah taman
  rationale: Padanan ini mempertahankan makna lokasi di bagian tengah atau di dalam lingkungan taman tanpa memastikan ketepatan geometris yang tidak dituntut teks.
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: serta pohon pengetahuan tentang yang baik dan yang jahat
  rationale: Terjemahan ini mempertahankan ungkapan sumber secara transparan dan tidak mempersempit “pengetahuan” menjadi satu tafsiran tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menyebut nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan fungsi nama diri dan sejalan dengan lapisan konsultasi yang telah diselaraskan.
- issue: Makna הַדַּעַת טוֹב וָרָע
  choice: pengetahuan tentang yang baik dan yang jahat
  alternative: pengetahuan moral; pengetahuan tentang segala sesuatu; pengetahuan tentang yang bermanfaat dan yang merugikan
  rationale: Ungkapan ini memiliki beberapa kemungkinan cakupan makna. Teks utama dibiarkan literal, sedangkan catatan mengakui perbedaan penafsiran tanpa menyelesaikannya secara sepihak.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan sifat kausatif verba pertama maupun ambiguitas teologis ungkapan penutup. Penanda catatan [a] ditempatkan langsung sesudah ungkapan yang dijelaskan.
