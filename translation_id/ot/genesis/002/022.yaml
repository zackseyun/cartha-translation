translation:
  language: id
  text: Lalu TUHAN Allah membangun seorang perempuan dari rusuk yang telah diambil-Nya dari manusia itu, dan membawa perempuan itu kepada manusia itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן (wayyiḇen)
  choice: membangun
  rationale: Mempertahankan metafora Ibrani yang secara harfiah berarti ‘membangun’, bukan sekadar ‘membuat’.
- source_word: הַצֵּלָע (haṣṣēlāʿ)
  choice: rusuk
  rationale: Dalam konteks ini secara tradisional dan wajar dipahami sebagai ‘rusuk’, meskipun kata Ibrani juga dapat berarti ‘sisi’ dalam konteks lain.
- source_word: יְהוָה אֱלֹהִים (YHWH ʾĕlōhîm)
  choice: TUHAN Allah
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian YHWH dan sebutan Allah.
- source_word: הָאָדָם (hāʾāḏām)
  choice: manusia itu
  rationale: Artikel tertentu dipertahankan, dan istilah ini masih berfungsi sebagai sebutan bagi manusia tersebut dalam konteks narasi.
- source_word: לְאִשָּׁה (ləʾiššāh)
  choice: menjadi seorang perempuan
  rationale: Menyatakan hasil tindakan membangun secara alami dalam bahasa Indonesia tanpa menambahkan gagasan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Makna metaforis tindakan Allah terhadap rusuk
  choice: membangun rusuk ... menjadi seorang perempuan
  alternative: membuat rusuk ... menjadi seorang perempuan
  rationale: Kata kerja sumber secara eksplisit adalah ‘membangun’; mempertahankannya menjaga citra sastra dan kemungkinan nuansa teologis tanpa menafsirkannya lebih lanjut.
- issue: Identifikasi הָאָדָם sebagai nama diri atau sebutan umum
  choice: manusia itu
  alternative: Adam
  rationale: Pada ayat ini bentuk Ibrani memakai artikel tertentu, sehingga terjemahan sebagai sebutan umum lebih dekat pada bentuk sumber dan tidak memaksakan peralihan menjadi nama diri.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan dalam bahasa Ibrani, dengan pengulangan ‘perempuan itu’ untuk memperjelas objek pronomina dalam bahasa Indonesia.
