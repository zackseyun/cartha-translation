    rationale: Dalam bahasa Indonesia, ‘membangun’ lazim mengambil hasil atau bangunan sebagai objek. Menyatakan perempuan sebagai yang dibangun ‘dari rusuk’ menyampaikan relasi sumber dan hasil secara lebih jelas, tanpa menghilangkan metafora kata kerja Ibrani.
