  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: id
  text: Di bumi belum ada semak di ladang[a], dan belum ada tumbuhan di ladang yang bertunas, sebab Yahweh Allah belum menurunkan hujan ke bumi, dan belum ada manusia[b] untuk menggarap tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perdu di ladang.”'
    reason: Alternatif leksikal untuk שִׂיחַ, yang dapat menunjuk pada semak atau perdu.
  - marker: b
    text: 'Atau: “seorang manusia.”'
    reason: Bahasa Ibrani memakai אָדָם dalam bentuk tunggal generik; alternatif ini menonjolkan bentuk tunggal tersebut.
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: semak di ladang
  rationale: שִׂיחַ menunjuk pada semak atau perdu, bukan tumbuhan secara umum. Ungkapan ini dibedakan dari עֵשֶׂב pada klausa berikutnya; 'di ladang' menyampaikan hubungan konstruksi Ibrani secara alami.
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: belum ada ... di bumi
  rationale: טֶרֶם menyatakan keadaan yang belum terjadi, sedangkan יִהְיֶה dengan בָאָרֶץ menyatakan keberadaan. 'Di bumi' sesuai dengan konteks penciptaan yang luas.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: tumbuhan di ladang
  rationale: עֵשֶׂב menunjuk secara luas pada tumbuhan herba. 'Tumbuhan' mudah dipahami dan tetap dibedakan dari 'semak'.
- source_word: טֶרֶם יִצְמָח
  choice: belum ... bertunas
  rationale: צמח berarti tumbuh keluar atau bertunas; 'bertunas' mempertahankan gambaran awal pertumbuhan.
- source_word: כִּי
  choice: sebab
  rationale: כִּי di sini memperkenalkan alasan bagi belum adanya pertumbuhan tersebut.
- source_word: הִמְטִיר
  choice: menurunkan hujan
  rationale: Bentuk hiphil מטר bersifat kausatif. Dalam bahasa Indonesia, 'menurunkan hujan' secara alami menyatakan bahwa Allah menyebabkan hujan turun.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהִים diterjemahkan 'Allah'.
- source_word: וְאָדָם אַיִן
  choice: belum ada manusia
  rationale: אָדָם di sini menunjuk pada manusia sebagai pelaku yang akan menggarap tanah. 'Manusia' mempertahankan cakupan leksikal tanpa menetapkan jenis kelamin lebih daripada yang dituntut konteks.
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: untuk menggarap tanah
  rationale: עבד dalam konteks ini berarti mengerjakan atau membudidayakan, dan אֲדָמָה adalah tanah yang digarap. 'Menggarap tanah' jelas dan idiomatis.
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: bumi / tanah
  rationale: Pilihan berbeda ini mempertahankan pembedaan Ibrani antara אֶרֶץ, dunia atau daratan secara luas, dan אֲדָמָה, tanah yang dapat digarap.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi יְהוָה. 'Yahweh' mempertahankan statusnya sebagai nama dan mengikuti lapisan konsultasi yang telah direvisi.
- issue: Cakupan אָדָם dalam konteks
  choice: manusia
  alternative: laki-laki
  rationale: Dalam klausa ini, אָדָם menyatakan belum adanya seorang manusia yang menggarap tanah. 'Manusia' menjaga sifat generik istilah itu dan tidak mempersempitnya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa mempertahankan dua keadaan 'belum' beserta alasan yang menyusul. Istilah 'bumi' dan 'tanah' dibedakan untuk mencerminkan dua nomina Ibrani yang berbeda.
