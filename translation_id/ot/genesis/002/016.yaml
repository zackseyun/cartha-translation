base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: id
  text: Lalu Yahweh Allah memberi perintah kepada manusia itu, “Engkau boleh makan dengan bebas dari setiap pohon di taman itu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “engkau sungguh-sungguh boleh makan.” Bahasa Ibrani memakai infinitif absolut bersama verba finit dari akar yang sama untuk memberi penegasan; dalam konteks ini penegasan itu dapat dinyatakan sebagai izin untuk makan dengan bebas.
    reason: Menjelaskan secara tepat konstruksi infinitif absolut dengan verba finit dan kemungkinan terjemahan penekanannya.
lexical_decisions:
- source_word: וַיְצַו
  choice: memberi perintah
  rationale: Kata צוה menyatakan perintah yang berwibawa. Ungkapan ini jelas dan wajar dalam bahasa Indonesia, sekaligus cocok untuk memperkenalkan isi perintah yang berbentuk izin.
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהִים diterjemahkan “Allah”, sehingga sebutan gabungannya tetap terpelihara.
- source_word: עַל הָאָדָם
  choice: kepada manusia itu
  rationale: Dengan צוה, עַל menandai penerima perintah. הָאָדָם menunjuk kepada manusia tertentu yang baru dibentuk dan ditempatkan di taman; “manusia itu” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan אָדָם tanpa secara keliru mengartikannya sebagai umat manusia secara umum.
- source_word: לֵאמֹר
  choice: '[dinyatakan melalui tanda petik langsung]'
  rationale: Bentuk ini memperkenalkan ujaran langsung. Dalam bahasa Indonesia modern, fungsi “dengan berkata” sudah dinyatakan secara alami oleh koma dan kutipan langsung, sehingga terjemahan harfiah yang kaku tidak diperlukan.
- source_word: מִכֹּל עֵץ הַגָּן
  choice: dari setiap pohon di taman ini
  rationale: מן menyatakan sumber makanan, כֹּל memperluas izin kepada setiap pohon, dan bentuk “di taman ini” lebih alami daripada konstruksi nominal yang kaku sambil tetap mempertahankan acuannya kepada taman dalam konteks.
- source_word: אָכֹל תֹּאכֵל
  choice: boleh makan dengan bebas
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan makan. Dalam konteks ini, nuansanya adalah izin yang luas, bukan kewajiban untuk makan; “boleh makan dengan bebas” menyampaikan modalitas dan penekanannya secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi יהוה. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Acuan הָאָדָם
  choice: manusia itu
  alternative: laki-laki itu atau umat manusia
  rationale: Dalam narasi ini הָאָדָם adalah individu tertentu, tetapi istilah Ibraninya pada dasarnya berarti manusia. “Manusia itu” menjaga kekhususan referen sekaligus hubungan leksikalnya tanpa memperluasnya menjadi seluruh umat manusia atau mempersempit istilahnya secara tidak perlu.
- issue: Daya אָכֹל תֹּאכֵל
  choice: 'izin yang ditegaskan: “boleh makan dengan bebas”'
  alternative: “pasti akan makan” atau “harus makan”
  rationale: Konstruksi Ibrani bersifat emphatik, tetapi konteks sebelum larangan pada ayat berikut menunjukkan pemberian izin. Terjemahan tidak mengubahnya menjadi nubuat atau kewajiban.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Memberi perintah” mempertahankan wibawa ujaran, sedangkan kutipan langsung menghindari terjemahan kaku untuk לֵאמֹר. Pronomina “engkau” dipakai karena ujaran ditujukan kepada satu orang dan sesuai dengan ragam naratif kitab suci.
