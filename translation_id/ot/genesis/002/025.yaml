  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: id
  text: Laki-laki itu dan istrinya, keduanya telanjang[a] dan tidak merasa malu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka berdua telanjang, laki-laki itu dan istrinya”; susunan Ibrani menekankan bahwa kedua anggota pasangan itu sama-sama tidak berpakaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Keduanya ...
  rationale: Bentuk naratif היה menghubungkan ayat ini dengan konteks sebelumnya dan, bersama predikat adjektival, menyatakan keadaan pada masa lampau. Dalam bahasa Indonesia, keadaan itu dapat dinyatakan secara alami tanpa kopula eksplisit.
- source_word: שְׁנֵיהֶם
  choice: Keduanya
  rationale: Menegaskan bahwa keadaan tersebut berlaku pada dua anggota pasangan itu bersama-sama.
- source_word: עֲרוּמִּים
  choice: telanjang
  rationale: Padanan modern yang langsung dan tepat untuk keadaan tanpa pakaian; lebih sesuai daripada ungkapan yang sekadar berarti terbuka atau tidak tertutup.
- source_word: הָאָדָם
  choice: laki-laki itu
  rationale: Dalam konteks ini, referennya ialah manusia laki-laki yang dipasangkan dengan istrinya, bukan umat manusia secara umum.
- source_word: וְאִשְׁתּוֹ
  choice: dan istrinya
  rationale: 'Nomina dengan sufiks orang ketiga maskulin tunggal secara alami menyatakan hubungan perkawinan: ''istrinya''.'
- source_word: וְלֹא
  choice: tetapi ... tidak
  rationale: Secara leksikal וְ adalah penghubung dan לֹא adalah negasi. 'Tetapi' mengungkapkan pertentangan wacana yang alami dalam bahasa Indonesia antara ketelanjangan dan ketiadaan rasa malu.
- source_word: יִתְבֹּשָׁשׁוּ
  choice: merasa malu
  rationale: Bentuk verba ini menyatakan mengalami malu. 'Merasa malu' alami dalam bahasa Indonesia dan tidak memperlema maknanya menjadi sekadar kikuk.
theological_decisions:
- issue: Makna הָאָדָם dalam konteks
  choice: laki-laki itu
  alternative: manusia itu / manusia
  rationale: Penyebutan 'istrinya' menunjukkan bahwa ayat ini merujuk secara khusus kepada individu laki-laki, bukan kepada manusia sebagai golongan. Pilihan ini mempertahankan kekhususan narasi tanpa menambahkan klaim antropologis.
- issue: Hubungan antara ketelanjangan dan rasa malu
  choice: tetapi mereka tidak merasa malu
  alternative: dan mereka tidak merasa malu
  rationale: Konjungsi Ibrani tetap dapat membawa hubungan kontras menurut konteks. 'Tetapi' menyatakan ketegangan yang tersirat tanpa menjelaskan penyebabnya atau memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dengan tanda pisah mempertahankan penekanan Ibrani pada 'keduanya', lalu mengidentifikasi pasangan tersebut. Penanda catatan kaki [a] ditempatkan pada frasa yang dijelaskan.
