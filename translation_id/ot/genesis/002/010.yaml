id: GEN.2.10
reference: Genesis 2:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: id
  text: Sebuah sungai mengalir dari Eden untuk mengairi taman itu. Dari sana sungai itu terbagi menjadi empat cabang utama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “empat kepala.” Istilah Ibrani ini di sini menunjuk pada empat bagian utama sungai tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: Sebuah sungai
  rationale: נָהָר berarti 'sungai'. Konjungsi וְ tidak perlu dinyatakan tersendiri pada awal kalimat karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
- source_word: יֹצֵא מֵעֵדֶן
  choice: mengalir dari Eden
  rationale: Partisipel יֹצֵא menggambarkan aliran yang keluar atau berasal dari Eden. 'Mengalir dari Eden' alami bagi sungai dan tetap menyatakan asalnya.
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: untuk mengairi taman itu
  rationale: Infinitif לְהַשְׁקוֹת menyatakan tujuan. 'Mengairi' tepat dalam konteks aliran sungai, sedangkan artikel pada הַגָּן merujuk kepada taman yang sudah disebut.
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: Dari sana sungai itu terbagi
  rationale: מִשָּׁם menandai tempat percabangan. Bentuk nifal יִפָּרֵד dapat berarti 'terbagi' atau 'berpisah'; 'terbagi' paling alami untuk satu sungai yang kemudian memiliki beberapa bagian.
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: menjadi empat cabang utama
  rationale: Secara harfiah רָאשִׁים berarti 'kepala-kepala', tetapi dalam konteks ini menunjuk pada empat bagian utama sungai. 'Cabang utama' jelas bagi pembaca modern tanpa memaksakan gagasan bahwa semuanya adalah sumber sungai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kalimat dipecah menjadi dua agar hubungan lokasi dan percabangan mudah dipahami. Penanda catatan ditempatkan setelah frasa yang dijelaskannya.
