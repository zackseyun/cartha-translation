base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: id
  text: Ketika hari ketujuh tiba, Allah telah menyelesaikan pekerjaan-Nya yang telah Ia lakukan[a], dan pada hari ketujuh itu Ia berhenti dari segala pekerjaan-Nya yang telah Ia lakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Pada hari ketujuh Allah menyelesaikan pekerjaan-Nya yang telah Ia lakukan.” Teks utama menyatakan pengertian kontekstual bahwa pekerjaan itu telah selesai ketika hari ketujuh tiba.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: telah menyelesaikan
  rationale: Verba כלה berarti menyelesaikan atau menuntaskan. Bentuk 'telah menyelesaikan' menyatakan bahwa pekerjaan itu sudah selesai ketika hari ketujuh tiba, sambil tetap dekat dengan bentuk Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjuk kepada Allah yang esa; 'Allah' adalah padanan baku dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Ini mempertahankan arti formal frasa Ibrani. Aspek perfektif dalam bahasa Indonesia disampaikan melalui 'telah menyelesaikan' agar konteks menunjukkan pekerjaan sudah tuntas, tanpa mengubah frasa temporal menjadi 'menjelang' atau 'sebelum'.
- source_word: מְלַאכְתּוֹ
  choice: pekerjaan yang dilakukan-Nya
  rationale: מְלָאכָה berarti pekerjaan atau kegiatan kerja. 'Pekerjaan' merupakan padanan Indonesia yang alami dan luas, sedangkan klausa relatif mempertahankan אֲשֶׁר עָשָׂה.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang dilakukan-Nya
  rationale: עשה adalah verba luas yang berarti melakukan atau membuat. 'Dilakukan-Nya' cocok dengan nomina 'pekerjaan' dan tidak mempersempit makna hanya pada pembuatan benda.
- source_word: וַיִּשְׁבֹּת
  choice: Ia berhenti
  rationale: Makna dasar שבת ialah berhenti atau tidak melanjutkan suatu kegiatan. 'Berhenti' menegaskan penghentian pekerjaan dan tidak menyiratkan bahwa Allah perlu memulihkan tenaga karena kelelahan.
- source_word: מִכָּל
  choice: dari segala
  rationale: Gabungan מן dan כָּל menunjukkan bahwa Allah berhenti dari keseluruhan pekerjaan-Nya; 'dari segala' alami dan mencakup semuanya.
theological_decisions:
- issue: Apakah Allah masih bekerja pada hari ketujuh
  choice: Frasa temporal diterjemahkan secara langsung sebagai 'Pada hari ketujuh', sedangkan 'telah menyelesaikan' menunjukkan pekerjaan itu sudah tuntas ketika hari tersebut tiba.
  alternative: '''Menjelang hari ketujuh Allah sudah menyelesaikan'' atau ''Pada hari ketujuh Allah menyelesaikan''.'
  rationale: Teks Masoret secara formal berbunyi 'pada hari ketujuh'. Terjemahan mempertahankan ungkapan itu, tetapi memakai 'telah' untuk menyampaikan hubungan kontekstual dengan pernyataan berikutnya bahwa pada hari yang sama Allah berhenti. Catatan kaki menjaga keterbukaan mengenai bentuk harfiah dan cara lain memahami hubungan waktunya.
- issue: Makna Allah 'beristirahat'
  choice: Diterjemahkan 'berhenti dari segala pekerjaan'.
  alternative: '''Beristirahat dari segala pekerjaan''.'
  rationale: שבת pada dasarnya berarti berhenti. Pilihan ini mempertahankan gagasan penghentian kegiatan tanpa menimbulkan kesan bahwa Allah lelah, sekaligus tidak menyangkal asosiasi istirahat yang berkembang dari konteks hari ketujuh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina bagi Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Pengulangan 'pada hari ketujuh' dan 'pekerjaan yang telah dilakukan-Nya' dipertahankan untuk mencerminkan struktur serta penekanan teks Ibrani.
