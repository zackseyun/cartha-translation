  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: id
  text: Kemudian Yahweh Allah membentuk manusia itu dari debu tanah[a]. Ia mengembuskan napas kehidupan ke dalam lubang hidungnya, dan manusia itu menjadi makhluk hidup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “debu dari tanah.”
    reason: Menunjukkan susunan sumber yang menempatkan “debu” dan “tanah” secara berdekatan, sekaligus mempertahankan redaksi utama yang lebih alami dalam bahasa Indonesia.
  - marker: b
    text: Atau “makhluk yang hidup”; secara tradisional, “jiwa yang hidup.”
    reason: Mencatat ragam terjemahan נֶפֶשׁ חַיָּה sambil mempertahankan cakupannya bagi makhluk bernyawa secara utuh dan tanpa memasukkan pandangan antropologis tertentu ke dalam teks utama.
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: Yahweh Allah
  rationale: Mempertahankan nama ilahi Yahweh dan menerjemahkan gelar umum אֱלֹהִים sebagai Allah; susunan ini alami dalam bahasa Indonesia.
- source_word: וַיִּיצֶר
  choice: membentuk
  rationale: Mengungkapkan tindakan membentuk atau menjadikan suatu wujud, dengan tetap mempertahankan gambaran konkret seperti pekerjaan seorang penjunan.
- source_word: הָאָדָם
  choice: manusia itu
  rationale: Dalam konteks ini menunjuk kepada manusia individual yang dibentuk Allah. Pilihan ini juga memungkinkan gaung hubungan אָדָם–אֲדָמָה tetap terdengar melalui kata manusia dan tanah, tanpa terlalu cepat menjadikannya nama diri.
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: dari debu tanah
  rationale: Terjemahan ringkas dan alami untuk bahan pembentukan manusia; 'debu' mempertahankan gambaran kefanaan, sedangkan 'tanah' menerjemahkan אֲדָמָה.
- source_word: בְּאַפָּיו
  choice: ke dalam lubang hidungnya
  rationale: Mempertahankan kekonkretan tubuh dalam teks Ibrani dan menyatakan arah tindakan dengan jelas.
- source_word: נִשְׁמַת חַיִּים
  choice: napas kehidupan
  rationale: Ungkapan Indonesia yang alami bagi konstruksi Ibrani ini; bentuk jamak חַיִּים berfungsi secara abstrak/intensif dan tidak perlu diterjemahkan sebagai 'kehidupan-kehidupan'.
- source_word: וַיְהִי ... לְנֶפֶשׁ חַיָּה
  choice: menjadi makhluk hidup
  rationale: היה dengan לְ menyatakan peralihan keadaan. 'Makhluk hidup' menggambarkan keseluruhan pribadi yang bernyawa dan tidak menyempitkan נֶפֶשׁ menjadi unsur rohani yang terpisah dari tubuh.
theological_decisions:
- issue: Makna הָאָדָם sebelum nama Adam tampil secara jelas
  choice: manusia itu
  alternative: laki-laki itu; Adam
  rationale: Bentuk berartikel menunjuk kepada manusia individual dalam narasi, tetapi kata ini masih membawa arti leksikal 'manusia'. Terjemahan ini mempertahankan hal itu tanpa menutup kemungkinan perkembangan referen dalam konteks berikutnya.
- issue: Makna לְנֶפֶשׁ חַיָּה
  choice: makhluk hidup
  alternative: pribadi yang hidup; jiwa yang hidup
  rationale: Frasa Ibrani menunjuk pada keseluruhan makhluk bernyawa dan juga dipakai bagi hewan. 'Jiwa yang hidup' berisiko menyiratkan bahwa teks sedang menjelaskan komponen tak berwujud yang terpisah, sesuatu yang tidak dituntut oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar mudah dibaca tanpa mengubah urutan tindakan. Nama Yahweh ditransliterasikan; 'Allah' dipakai sebagai gelar ilahi yang lazim. Semua penanda catatan kaki [a] dan [b] hadir dalam teks utama.
