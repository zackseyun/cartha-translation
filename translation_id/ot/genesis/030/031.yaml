base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: id
  text: Ia berkata, “Apa yang harus kuberikan kepadamu?” Yakub menjawab, “Jangan berikan apa pun kepadaku. Jika engkau melakukan hal ini untukku, aku akan kembali[a] menggembalakan kawanan ternakmu dan menjaganya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan menggembalakan lagi kawanan ternakmu dan menjaganya.” Kata kerja Ibrani ini dapat berarti kembali atau mulai lagi/melanjutkan pekerjaan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: Apa yang harus kuberikan kepadamu?
  rationale: Kata tanya מָה dengan bentuk orang pertama אֶתֶּן menanyakan pemberian atau upah yang patut diberikan. “Harus” menyampaikan nuansa tawaran dengan wajar dalam bahasa Indonesia.
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: Jangan berikan apa pun kepadaku
  rationale: Dalam konteks ini, לֹא dengan bentuk imperfek menyatakan penolakan langsung terhadap pemberian, sedangkan מְאוּמָה dalam kalimat negatif berarti “apa pun”.
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Jika engkau melakukan hal ini untukku
  rationale: Terjemahan ini mempertahankan bentuk syarat dan frasa demonstratif הַדָּבָר הַזֶּה tanpa mengubahnya secara tafsiriah menjadi “permintaan” atau “kesepakatan”.
- source_word: אָשׁוּבָה
  choice: aku akan kembali
  rationale: Kata שׁוּב dapat menunjuk pada kembali secara harfiah atau kembali melakukan pekerjaan, yakni melanjutkan atau mengulanginya. “Kembali” mempertahankan keluwesan makna itu.
- source_word: אֶרְעֶה צֹאנְךָ
  choice: menggembalakan kawanan ternakmu
  rationale: רעה berarti menggembalakan atau memelihara ternak, sedangkan צֹאן adalah kelompok ternak kecil, terutama domba dan kambing. “Kawanan ternak” cukup alami dan tidak mempersempitnya hanya menjadi domba.
- source_word: אֶשְׁמֹר
  choice: menjaganya
  rationale: שׁמר melengkapi tindakan menggembalakan dengan gagasan mengawasi dan melindungi. Akhiran “-nya” mengacu pada kawanan ternak sebagai satu kesatuan.
theological_decisions: []
