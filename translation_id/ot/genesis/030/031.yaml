  register: Bahasa Indonesia baku modern dengan dialog yang langsung dan wajar. Kata ganti “engkau” dipakai untuk percakapan tunggal dalam narasi Alkitab, sementara susunan kalimat tetap dekat dengan bentuk Ibrani tanpa menjadi kaku.
