  text: וַ/תֵּ֗לֶד זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה לְ/יַעֲקֹ֥ב בֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/010.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a son.
translation:
  language: id
  text: Zilpa, hamba perempuan Lea, melahirkan seorang anak laki-laki bagi Yakub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk wayyiqtol dari ילד meneruskan rangkaian peristiwa dalam narasi; bahasa Indonesia secara alami memakai 'melahirkan' dengan objek anak yang dilahirkan.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: שִׁפְחַת
  choice: hamba perempuan
  rationale: שִׁפְחָה menunjuk kepada perempuan berstatus bawahan dalam rumah tangga, sebagai hamba atau budak. 'Hamba perempuan' mempertahankan unsur gender dan status tersebut tanpa menyiratkan usia tertentu.
- source_word: לֵאָה
  choice: Lea
  rationale: Hubungan konstruksi Ibrani diterjemahkan secara alami sebagai 'hamba perempuan Lea'.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi ל dalam konstruksi kelahiran ini menandai Yakub sebagai ayah atau pihak yang baginya anak itu dilahirkan; 'bagi Yakub' mempertahankan nuansa preposisional sumber dengan wajar.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Nomina tunggal ini berarti 'anak laki-laki/putra'; 'seorang anak laki-laki' alami dalam konteks kelahiran dan tidak memerlukan penjelasan tambahan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan susunan kalimat naratif yang ringkas dan bermartabat. Konjungsi וַ pada awal ayat tidak diterjemahkan secara tersendiri karena kesinambungan naratif sudah jelas dalam bahasa Indonesia; status sosial Zilpa tetap dinyatakan dengan 'hamba perempuan'.
