  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: id
  text: Sesudah itu, ia melahirkan seorang anak perempuan dan menamainya Dina.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Ungkapan temporal ini menandai urutan setelah kelahiran-kelahiran sebelumnya; 'Sesudah itu' alami dalam bahasa Indonesia dan mempertahankan alur narasi.
- source_word: יָלְדָה
  choice: ia melahirkan
  rationale: Bentuk Qal perfektum orang ketiga feminin tunggal dari ילד menyatakan tindakan melahirkan; padanan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: בַּת
  choice: seorang anak perempuan
  rationale: Nomina tunggal ini menjadi objek dari 'melahirkan'; 'seorang anak perempuan' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: וַתִּקְרָא אֶת־שְׁמָהּ
  choice: dan menamainya
  rationale: Idiom Ibrani harfiah 'memanggil namanya' secara alami dinyatakan sebagai 'menamainya' dalam bahasa Indonesia, tanpa mengubah makna.
- source_word: דִּינָה
  choice: Dina
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi dan ejaan Alkitab bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan naratif dipertahankan, sedangkan idiom penamaan Ibrani dialihkan secara alami.
