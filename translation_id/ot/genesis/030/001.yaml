  text: וַ/תֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְ/יַעֲקֹ֔ב וַ/תְּקַנֵּ֥א רָחֵ֖ל בַּ/אֲחֹתָ֑/הּ וַ/תֹּ֤אמֶר אֶֽל יַעֲקֹב֙ הָֽבָ/ה לִּ֣/י בָנִ֔ים וְ/אִם אַ֖יִן מֵתָ֥ה אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: id
  text: Ketika Rahel melihat bahwa ia tidak melahirkan anak bagi Yakub, ia menjadi iri kepada saudarinya. Lalu ia berkata kepada Yakub, “Berilah aku anak-anak! Kalau tidak, aku akan mati!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika Rahel melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; 'ketika' secara alami menghubungkan apa yang Rahel lihat dengan reaksi berikutnya.
- source_word: כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: bahwa ia tidak melahirkan anak bagi Yakub
  rationale: יָלַד dalam qal dengan perempuan sebagai subjek berarti 'melahirkan'. Objek yang tersirat dinyatakan sebagai 'anak', sedangkan לְ dipertahankan secara alami dengan 'bagi'.
- source_word: וַתְּקַנֵּא
  choice: ia menjadi iri
  rationale: קנא dalam konteks ini menyatakan rasa iri terhadap kesuburan saudaranya; 'menjadi iri' menangkap perkembangan emosi dalam narasi.
- source_word: בַּאֲחֹתָהּ
  choice: kepada kakaknya
  rationale: אחות berarti saudara perempuan. Konteks sebelumnya mengidentifikasinya sebagai Lea, kakak Rahel; 'kakaknya' alami dalam bahasa Indonesia dan mempertahankan istilah kekerabatan.
- source_word: הָבָה לִּי בָנִים
  choice: Berilah aku anak-anak
  rationale: בנים secara bentuk berarti 'anak-anak lelaki', tetapi dalam konteks keinginan untuk memperoleh keturunan dapat merujuk pada anak secara umum. Bentuk jamak 'anak-anak' mempertahankan tuntutan Rahel.
- source_word: וְאִם אַיִן
  choice: Kalau tidak
  rationale: Ungkapan ini memperkenalkan akibat apabila tuntutan sebelumnya tidak terpenuhi; 'kalau tidak' lugas dan idiomatis.
- source_word: מֵתָה אָנֹכִי
  choice: aku akan mati
  rationale: Ungkapan langsung dan intens ini dapat menyatakan akibat yang dipandang segera atau pasti. 'Aku akan mati' mempertahankan daya desaknya tanpa menjelaskan apakah itu hiperbola.
theological_decisions:
- issue: Kemampuan Yakub untuk memberikan anak
  choice: Tuntutan Rahel diterjemahkan secara langsung tanpa penjelasan teologis tambahan.
  alternative: Memparafrasakan permintaan itu sebagai doa atau permohonan agar Yakub meminta kepada Allah.
  rationale: Teks menampilkan kata-kata Rahel yang ditujukan langsung kepada Yakub; penerjemahan tidak boleh meredakan ketegangan yang kemudian dijawab Yakub dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan nama Rahel yang kedua dialihkan menjadi pronomina agar alami; kalimat dipisah menjadi dua untuk kelancaran narasi. Tidak diperlukan catatan kaki karena pilihan leksikal dapat disampaikan dengan jelas dalam teks utama.
