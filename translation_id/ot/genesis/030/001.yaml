  to: Ketika Rahel melihat bahwa ia tidak melahirkan anak bagi Yakub, ia menjadi iri kepada saudarinya. Lalu ia berkata kepada Yakub, “Berilah aku anak-anak! Kalau tidak, aku akan mati!”
  rationale: Revisi terbatas pada penggantian "kakaknya" dengan "saudarinya" agar makna אֲחֹתָהּ dipertahankan tanpa menambahkan urutan usia. Struktur, ketegasan ucapan Rahel, dan pilihan leksikal lainnya dipertahankan.
