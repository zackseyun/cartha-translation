review_pass:
  verdict: revise
  source_fidelity: Frasa "kepada kakaknya" tidak setia sepenuhnya pada אֲחֹתָהּ, yang berarti "saudari perempuannya" tanpa menyatakan urutan usia. Selain itu, hubungan dengan קנא lebih tepat dinyatakan sebagai iri "kepada/terhadap" seseorang daripada unsur arah yang dapat terbaca dari "kepada" saja; dalam kalimat ini tetap jelas melalui verba "iri".
  naturalness: Teks pada dasarnya lancar dan berregister modern. "Saudarinya" adalah pilihan yang alami dan jelas untuk mempertahankan gender serta hubungan kekerabatan tanpa menambahkan bahwa Lea lebih tua.
  terminology: '"Melahirkan anak", "iri", dan "Berilah aku anak-anak" menyampaikan makna naratif secara langsung. Tidak ada istilah teologis yang memerlukan penyesuaian.'
  issues:
  - severity: medium
    issue: '"kakaknya" menambahkan informasi usia yang tidak dinyatakan dalam ayat ini.'
    rationale: אֲחֹתָהּ hanya menyebut "saudari perempuannya". Walaupun Lea diketahui sebagai kakak Rahel dari konteks sebelumnya, terjemahan ayat ini sebaiknya tidak mengganti istilah relasional sumber dengan istilah yang lebih spesifik.
  revised_text: Ketika Rahel melihat bahwa ia tidak melahirkan anak bagi Yakub, ia menjadi iri kepada saudarinya. Lalu ia berkata kepada Yakub, “Berilah aku anak-anak! Kalau tidak, aku akan mati!”
