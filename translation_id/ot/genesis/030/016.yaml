base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: id
  text: Ketika Yakub pulang dari ladang pada petang hari, Lea keluar menyongsongnya dan berkata, “Engkau harus datang kepadaku, sebab aku telah menyewa engkau[a] dengan buah mandragora anakku.” Lalu Yakub tidur dengan Lea pada malam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab aku benar-benar telah menyewa engkau dengan buah mandragora anakku.” Bahasa Ibrani mengulang akar kata yang berarti “menyewa” untuk menegaskan klaim Lea; buah mandragora itu merupakan harga atau sarana kesepakatan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: pulang dari ladang
  rationale: Kata בוא berarti datang atau masuk. Dalam konteks Yakub kembali dari ladang menuju tempat tinggal keluarganya, “pulang dari ladang” menyampaikan arah gerak itu secara alami dalam bahasa Indonesia.
- source_word: בָּעֶרֶב
  choice: pada petang hari
  rationale: Padanan waktu yang alami dan bermartabat untuk waktu menjelang malam.
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: keluar menyongsongnya
  rationale: Ungkapan ini mempertahankan gerak Lea ke luar untuk menemui Yakub, bukan sekadar kebetulan bertemu.
- source_word: אֵלַי תָּבוֹא
  choice: Engkau harus datang kepadaku
  rationale: Mempertahankan idiom sumber dan ketegasan tuntutan Lea tanpa menggantinya dengan ungkapan seksual yang lebih eksplisit daripada bahasa Ibrani.
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: aku telah menyewa engkau
  rationale: Akar שׂכר menyatakan penyewaan atau perolehan dengan bayaran. Terjemahan utama dibuat alami, sedangkan penegasan dari pengulangan akar kata dicatat dalam catatan kaki.
- source_word: בְּדוּדָאֵי בְּנִי
  choice: dengan buah mandragora anakku
  rationale: Preposisi ב menunjukkan sarana atau harga dalam kesepakatan tersebut. “Mandragora” adalah padanan modern bagi identifikasi tradisional דודאים.
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: Yakub tidur dengan Lea
  rationale: “Tidur dengan” merupakan eufemisme Indonesia yang jelas bagi hubungan seksual dan sepadan dengan idiom Ibrani. Nama tokoh diulang agar rujukannya jelas.
- source_word: בַּלַּיְלָה הוּא
  choice: pada malam itu
  rationale: Menyampaikan penunjukan waktu secara idiomatis; kata ganti הוּא tercakup dalam “itu”.
