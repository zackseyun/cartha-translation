  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: id
  text: Kemudian Allah mengingat Rahel[a]. Allah mendengarkan dia[b] dan membuka rahimnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperhatikan Rahel” atau “mengindahkan Rahel.” Dalam ungkapan Alkitab, Allah “mengingat” berarti Ia menaruh perhatian khusus lalu bertindak, bukan bahwa Ia sebelumnya lupa.
    reason: lexical_alternative
  - marker: b
    text: Atau “mendengar dia” atau “mengindahkannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: mengingat
  rationale: Mempertahankan idiom alkitabiah Ibrani זכר, yang dalam konteks naratif ini menunjuk pada perhatian Allah yang berkenan dan berlanjut dalam tindakan, bukan bahwa Allah sebelumnya lupa.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini disertai bentuk-bentuk verba tunggal dan di sini jelas merujuk kepada Allah yang esa; 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: אֶת רָחֵל
  choice: Rahel
  rationale: אֶת menandai Rahel sebagai objek langsung; nama tersebut dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: mendengarkan dia
  rationale: שׁמע dengan אֶל menyatakan tindakan mendengar dengan perhatian atau mengindahkan. 'Mendengarkan dia' mempertahankan nuansa relasional tanpa menafsirkannya secara berlebihan sebagai 'menjawab doanya'.
- source_word: וַיִּפְתַּח
  choice: membuka
  rationale: Padanan konkret ini mempertahankan gambaran langsung dari verba Ibrani פתח.
- source_word: רַחְמָהּ
  choice: kandungannya
  rationale: רֶחֶם berarti rahim atau kandungan. 'Membuka kandungannya' mempertahankan idiom Ibrani tentang Allah yang memampukan seorang perempuan untuk mengandung.
- source_word: וַ
  choice: Kemudian / dan
  rationale: Waw konsekutif pertama memajukan alur sehingga diterjemahkan 'Kemudian'; pada klausa berikutnya, 'dan' mempertahankan hubungan koordinatif dengan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa antropomorfis bahwa Allah 'mengingat' Rahel
  choice: Mempertahankan 'mengingat' dalam teks utama sebagai idiom alkitabiah bagi perhatian Allah yang berkenan dan menghasilkan tindakan.
  alternative: memperhatikan Rahel; mengindahkan Rahel
  rationale: Bahasa Ibrani tidak menyiratkan bahwa Allah sebelumnya lupa, tetapi mengganti idiom dalam teks utama akan menghilangkan pola ungkapan alkitabiah yang penting. Dua tindakan berikutnya—mendengarkan dan membuka kandungan—menjelaskan dampak dari tindakan 'mengingat' itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan subjek 'Allah' dalam teks Ibrani. Idiom 'membuka kandungannya' dipertahankan karena jelas dalam konteks dan menjaga kekonkretan teks sumber.
