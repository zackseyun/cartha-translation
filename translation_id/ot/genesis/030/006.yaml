  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: id
  text: Lalu Rahel berkata, “Allah telah menghakimi perkaraku[a]. Ia juga telah mendengar suaraku dan memberiku seorang anak laki-laki.” Karena itu, ia menamainya Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Dan berbunyi mirip dengan kata kerja Ibrani yang berarti “menghakimi” atau “telah menghakimi.”
    reason: Menjelaskan permainan kata Ibrani antara nama דָּן dan verba דָּנַנִּי.
lexical_decisions:
- source_word: דָּנַנִּי
  choice: telah menghakimi perkaraku
  rationale: Bentuk dari דין dengan akhiran orang pertama tunggal menyatakan tindakan yudisial terhadap perkara Rahel. Ungkapan ini mempertahankan nuansa hukum tanpa memperkuatnya menjadi 'membenarkan' atau 'membela'.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba yang menyertainya tunggal dan dalam narasi ini merujuk kepada Allah.
- source_word: שָׁמַע בְּקֹלִי
  choice: telah mendengar suaraku
  rationale: Mempertahankan unsur harfiah 'suaraku' dalam ungkapan Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּתֶּן לִי בֵּן
  choice: memberiku seorang anak laki-laki
  rationale: Menerjemahkan objek בן secara khusus sebagai anak laki-laki, bukan istilah umum 'anak'.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan sebab-akibat yang alami dalam bahasa Indonesia dan memperkenalkan penjelasan pemberian nama.
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: ia menamainya Dan
  rationale: Padanan Indonesia yang alami untuk idiom Ibrani 'memanggil namanya', sementara permainan kata dijelaskan dalam catatan kaki.
- source_word: דָּן
  choice: Dan
  rationale: Transliterasi baku nama Ibrani yang terkait dengan verba דין, 'menghakimi'.
theological_decisions:
- issue: Pernyataan Rahel mengenai tindakan Allah dalam rumusan pemberian nama
  choice: Allah telah menghakimi perkaraku
  alternative: Allah telah menghakimi aku; Allah telah membela aku
  rationale: Pilihan ini mempertahankan metafora yudisial dan memungkinkan makna bahwa Allah telah memutuskan perkara Rahel, tanpa menyatakan secara berlebihan suatu doktrin pembenaran atau pembelaan khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, dengan nuansa yudisial dan permainan kata nama tetap dipertahankan melalui catatan kaki.
