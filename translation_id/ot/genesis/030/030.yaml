  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: id
  text: Sebab, harta milikmu sebelum aku datang hanya sedikit, tetapi telah bertambah hingga berlimpah. Yahweh telah memberkatimu ketika aku datang[a]. Sekarang, kapan aku juga akan mengusahakan sesuatu bagi rumah tanggaku sendiri?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada kakiku”; ungkapan Ibrani ini mungkin berarti “ketika aku datang” atau “karena aku.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “kapan aku juga akan berbuat sesuatu bagi rumah tanggaku sendiri?”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶׁר הָיָה לְךָ לְפָנַי
  choice: apa yang kaumiliki sebelum aku datang hanya sedikit
  rationale: Menyampaikan jumlah kecil milik Laban secara alami; לְפָנַי secara bentuk berarti ‘di hadapanku/sebelum aku’, tetapi dalam konteks menunjuk pada masa sebelum Yakub datang.
- source_word: וַיִּפְרֹץ לָרֹב
  choice: telah bertambah menjadi sangat banyak
  rationale: פרץ menggambarkan pertambahan yang meluas atau melonjak, sedangkan לָרֹב menunjukkan hasil yang berlimpah; ungkapan ini mempertahankan keduanya dalam bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara eksplisit terdapat dalam teks Ibrani.
- source_word: לְרַגְלִי
  choice: sejak kedatanganku
  rationale: Secara harfiah berkaitan dengan ‘kaki/langkahku’, tetapi di sini merupakan ungkapan yang dapat menunjuk pada kedatangan Yakub atau berkat yang terjadi karena dia; pilihan utama cocok dengan kontras waktu dalam ayat tanpa meniadakan kemungkinan kausal yang dicatat dalam catatan kaki.
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: kapan aku juga akan mengusahakan sesuatu bagi rumah tanggaku sendiri?
  rationale: Mempertahankan pertanyaan waktu, penekanan גַם אָנֹכִי (‘aku juga’), dan keluasan makna עשה (‘berbuat/mengusahakan’) sambil menyatakan bahwa בֵּית menunjuk pada rumah tangga.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: ‘Yahweh’ menyajikan nama diri dalam teks sumber dan tidak menggantinya dengan gelar; tidak ada persoalan teologis lain dalam ayat ini yang perlu diputuskan secara interpretatif.
- issue: Hubungan berkat Yahweh dengan kehadiran Yakub dalam לְרַגְלִי
  choice: sejak kedatanganku
  alternative: karena aku
  rationale: Ungkapan Ibrani memungkinkan nuansa temporal dan kausal. Teks utama memakai nuansa temporal yang cocok dengan perbandingan sebelum dan sesudah kedatangan Yakub, sedangkan kemungkinan kausal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan klausa pertama diatur secara alami agar kontras antara keadaan semula yang sedikit dan pertambahan besar mudah dipahami. Bentuk ‘engkau’ dipakai untuk menjaga register naratif Alkitab yang luhur namun tetap jelas.
