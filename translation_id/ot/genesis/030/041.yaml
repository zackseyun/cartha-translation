base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: id
  text: Setiap kali ternak yang lebih kuat dikawinkan,[a] Yakub menaruh tongkat-tongkat itu di depan mata ternak di palung air,[b] supaya mereka kawin dengan tongkat-tongkat itu di hadapan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ternak yang lebih kokoh” atau “ternak yang lebih sehat”; istilah Ibrani ini menunjuk pada hewan yang lebih kuat, berbeda dengan yang lemah pada ayat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “di saluran-saluran air” atau “di palung-palung”; istilah Ibrani ini menunjuk pada tempat ternak datang untuk minum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל
  choice: Setiap kali
  rationale: Gabungan ini memperkenalkan keadaan yang berulang dalam narasi; “setiap kali” menyampaikan aspek kebiasaan secara alami.
- source_word: יַחֵם
  choice: sedang berahi
  rationale: Kata ini menunjuk pada keadaan birahi hewan. Pilihan ini lebih tepat daripada “mengandung” dan membedakannya dari tindakan kawin pada akhir ayat.
- source_word: הַצֹּאן
  choice: ternak
  rationale: צאן adalah istilah kolektif bagi ternak kecil, yang dapat mencakup domba dan kambing; “ternak” tidak membatasi jenisnya.
- source_word: הַמְקֻשָּׁרוֹת
  choice: yang lebih kuat
  rationale: Dalam konteks, istilah ini berlawanan dengan hewan yang lemah pada ayat berikutnya dan menunjuk pada hewan yang lebih kokoh atau kuat.
- source_word: וְשָׂם
  choice: Yakub menaruh
  rationale: שׂים berarti menaruh atau menempatkan; konteks berulang sudah dinyatakan oleh “setiap kali”.
- source_word: הַמַּקְלוֹת
  choice: batang-batang
  rationale: Istilah ini merujuk pada potongan kayu atau ranting yang telah Yakub siapkan; “batang-batang” alami dalam konteks dan tidak mengesankan tongkat untuk berjalan.
- source_word: לְעֵינֵי הַצֹּאן
  choice: di depan mata ternak
  rationale: Mempertahankan ungkapan Ibrani dan penekanan visualnya dalam bahasa Indonesia yang tetap mudah dipahami.
- source_word: בָּרֳהָטִים
  choice: di dalam palung-palung air
  rationale: רהטים menunjuk pada palung atau saluran tempat ternak minum; “palung-palung air” menjelaskan latarnya tanpa menentukan bentuknya secara berlebihan.
- source_word: לְיַחְמֶנָּה
  choice: supaya mereka kawin
  rationale: Prefiks ל menyatakan tujuan. Dalam konteks peternakan, “kawin” menyampaikan kegiatan reproduksi secara lugas tanpa menyatakan bahwa batang-batang itu pasti menjadi penyebabnya.
- source_word: בַּמַּקְלוֹת
  choice: di antara batang-batang itu
  rationale: Preposisi ב dapat bernuansa lokatif atau sirkumstansial; pilihan ini mempertahankan gambaran bahwa batang-batang itu berada di tempat ternak kawin.
