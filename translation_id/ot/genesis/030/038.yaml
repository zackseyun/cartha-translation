  terminology: “Palung-palung,” “batang-batang,” dan “berahi” sesuai konteks peternakan dan makna leksikal. Catatan alternatif untuk verba “menjadi berahi” tepat dan tidak memaksakan makna “kawin” sebagai makna utama.
