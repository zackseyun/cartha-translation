base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: id
  text: Ia menempatkan batang-batang yang telah dikupasnya itu di palung-palung, di tempat-tempat minum[a] tempat kawanan ternak datang untuk minum, di hadapan kawanan itu; kawanan itu menjadi berahi[b] ketika datang untuk minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua istilah lokasi yang berdekatan maknanya, yaitu “palung-palung” dan “tempat-tempat minum”. Keduanya mungkin menggambarkan satu kawasan tempat minum secara lebih lengkap, bukan dua tempat yang sama sekali terpisah.
    reason: lexical_alternative
  - marker: b
    text: Atau, menurut maksud yang tersirat dalam konteks, “kawanan itu kawin”. Secara lebih harfiah, verba Ibrani menyatakan bahwa hewan-hewan itu menjadi panas atau berahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: Ia menempatkan
  rationale: Bentuk kausatif ini menyatakan tindakan menaruh atau memasang sesuatu pada posisi tertentu; “menempatkan” alami dan mempertahankan unsur kesengajaan.
- source_word: הַמַּקְלוֹת
  choice: batang-batang
  rationale: Kata ini menunjuk pada potongan kayu atau dahan yang telah disiapkan Yakub. “Batang-batang” sesuai dengan konteks pengupasan kulit kayu dan lebih alami daripada “tongkat-tongkat”.
- source_word: אֲשֶׁר פִּצֵּל
  choice: yang telah dikupasnya
  rationale: Dalam konteks ayat sebelumnya, Yakub mengupas kulit batang untuk menampakkan bagian putih. Bentuk lampau “telah dikupasnya” menunjukkan tindakan yang sudah dilakukan.
- source_word: בָּרֳהָטִים
  choice: di palung-palung
  rationale: Istilah ini dapat menunjuk pada palung atau saluran di tempat ternak diberi minum. “Palung-palung” mempertahankan gambaran konkret tempat minum ternak.
- source_word: בְּשִׁקֲתוֹת הַמָּיִם
  choice: di bak-bak air minum
  rationale: Frasa ini secara konkret menunjuk pada wadah atau tempat air minum ternak. Pengulangan bersama “palung-palung” dipertahankan karena teks Ibrani memakai dua ungkapan lokasi yang berkaitan.
- source_word: אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת
  choice: tempat kawanan ternak datang untuk minum
  rationale: צֹאן adalah istilah kolektif untuk ternak kecil, terutama domba dan kambing; “kawanan ternak” menjaga cakupan itu tanpa membatasinya pada salah satu jenis.
- source_word: לְנֹכַח הַצֹּאן
  choice: tepat di hadapan kawanan itu
  rationale: Ungkapan tersebut menyatakan posisi berhadapan atau tepat di depan kawanan. “Tepat di hadapan” jelas dan mempertahankan penekanan lokasional.
- source_word: וַיֵּחַמְנָה
  choice: kawanan itu menjadi berahi
  rationale: Makna lebih harfiahnya ialah menjadi panas atau berahi. Terjemahan ini mempertahankan keadaan biologis yang dinyatakan verba, tanpa mengubahnya langsung menjadi tindakan kawin yang hanya tersirat oleh konteks.
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: ketika datang untuk minum
  rationale: Konstruksi ini menyatakan waktu atau keadaan yang menyertai; “ketika” merupakan padanan Indonesia yang alami dan tepat.
