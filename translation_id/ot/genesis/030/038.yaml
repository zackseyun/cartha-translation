revisions:
- from: Ia menempatkan batang-batang yang telah dikupasnya itu di palung-palung, di bak-bak air minum[a] tempat kawanan ternak datang untuk minum, tepat di hadapan kawanan itu; kawanan itu menjadi berahi[b] ketika datang untuk minum.
  to: Ia menempatkan batang-batang yang telah dikupasnya itu di palung-palung, di tempat-tempat minum[a] tempat kawanan ternak datang untuk minum, di hadapan kawanan itu; kawanan itu menjadi berahi[b] ketika datang untuk minum.
  rationale: Revisi terbatas pada kealamian bahasa Indonesia dan ketepatan nuansa. “Tempat-tempat minum” menghindari ungkapan yang janggal sambil mempertahankan dua istilah lokasi dalam sumber. “Di hadapan” menerjemahkan hubungan spasial tanpa penegasan tambahan yang tidak eksplisit dalam Ibrani. Makna verba utama tetap “menjadi berahi,” dengan alternatif kontekstual dicatat dalam catatan kaki.
