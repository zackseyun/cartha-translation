  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Pengulangan “kawanan” dipertahankan agar rujukan dan penekanan teks Ibrani tetap jelas. Istilah peternakan dipilih agar mudah dipahami pembaca umum tanpa menghilangkan rincian konkret sumber.
