  to: Pada hari itu, Laban memisahkan kambing-kambing jantan yang belang dan bertutul, serta semua kambing betina yang berbintik-bintik dan bertutul—setiap ekor yang memiliki warna putih—dan setiap anak domba yang berwarna cokelat tua.[a] Ia menyerahkan hewan-hewan itu kepada anak-anaknya.[b]
