  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: id
  text: Pada hari itu, Laban memisahkan kambing-kambing jantan yang belang dan bertutul, serta semua kambing betina yang berbintik-bintik dan bertutul—setiap ekor yang memiliki warna putih—dan setiap anak domba yang berwarna cokelat tua.[a] Ia menyerahkan hewan-hewan itu kepada anak-anaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berwarna gelap”; kata Ibrani חוּם menunjuk warna cokelat atau gelap.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “memberikan ke dalam tangan anak-anaknya,” yaitu menempatkan hewan-hewan itu di bawah tanggung jawab mereka.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיָּסַר
  choice: Laban memisahkan
  rationale: Bentuk kausatif verba סור menyatakan tindakan menyingkirkan atau memisahkan hewan-hewan itu dari kawanan. Subjek tersirat diperjelas sebagai Laban berdasarkan konteks langsung agar rujukan pronomina tidak kabur dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu juga
  rationale: Ungkapan ini mempertahankan penanda waktu Ibrani dan dengan 'juga' menyampaikan kesegeraan tindakan dalam alur cerita secara alami.
- source_word: הַתְּיָשִׁים
  choice: kambing-kambing jantan
  rationale: תיש secara khusus menunjuk kambing jantan; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: הָעֲקֻדִּים
  choice: belang
  rationale: Kata ini menunjuk corak berupa jalur atau pita. 'Belang' merupakan istilah Indonesia yang alami untuk pola warna semacam itu tanpa terlalu menentukan bentuk teknisnya.
- source_word: הַטְּלֻאִים
  choice: berbintik
  rationale: Istilah ini menunjukkan corak bercak atau tutul. 'Berbintik' mudah dipahami dan dibedakan dari 'belang'.
- source_word: הָעִזִּים
  choice: kambing betina
  rationale: Walaupun עזים dapat berarti kambing secara umum, kontras dengan תישים sebelumnya mendukung penyebutan betina secara eksplisit.
- source_word: הַנְּקֻדּוֹת וְהַטְּלֻאֹת
  choice: berbintik-bintik dan bertutul
  rationale: Dua istilah berbeda dipertahankan untuk mencerminkan pembedaan antara titik-titik kecil dan bercak yang lebih besar dalam bahasa Ibrani.
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: setiap ekor yang memiliki warna putih
  rationale: Terjemahan ini mempertahankan daya distributif כֹּל dan menyatakan secara alami bahwa warna putih terdapat pada tubuh hewan tersebut.
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: dan setiap anak domba yang berwarna cokelat tua
  rationale: חוּם menunjuk warna cokelat atau gelap; 'cokelat tua' mempertahankan unsur warna sekaligus kegelapannya. כְּשָׂבִים dapat menunjuk domba muda, sehingga diterjemahkan 'anak domba'.
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: Ia menyerahkan semuanya kepada anak-anaknya untuk dipelihara
  rationale: Idiom harfiah 'memberikan ke dalam tangan' berarti menempatkan di bawah kuasa, tanggung jawab, atau pemeliharaan seseorang. Pilihan ini menyampaikan makna idiom secara wajar.
