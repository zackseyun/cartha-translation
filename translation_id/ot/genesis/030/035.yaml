translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Istilah pola bulu dibuat cukup konkret serta dibedakan sejauh dimungkinkan oleh kosakata sumber. Nama Laban dipakai untuk memperjelas subjek yang dalam bahasa Ibrani hanya dinyatakan oleh bentuk verba.
