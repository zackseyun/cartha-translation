  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: id
  text: Pada musim panen gandum, Ruben pergi dan menemukan dudaim[a] di ladang. Ia membawa dudaim itu kepada ibunya, Lea. Kemudian Rahel berkata kepada Lea, “Tolong berikan kepadaku sebagian dari dudaim anakmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dudaim (Ibrani דּוּדָאִים) secara tradisional diidentifikasi sebagai mandrake, yang kadang disebut “apel cinta”. Tumbuhan ini dikaitkan dengan kesuburan dalam kisah di sekitarnya, tetapi identifikasi botaninya tidak sepenuhnya pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: Pada musim panen gandum
  rationale: Frasa ini menunjukkan masa berlangsungnya panen gandum. Ungkapan Indonesia ini alami dan mempertahankan latar waktunya tanpa meniru idiom Ibrani secara kaku.
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif dari הלך berarti 'pergi'; unsur 'keluar' tidak dinyatakan secara eksplisit.
- source_word: דּוּדָאִים
  choice: buah dudaim
  rationale: Identifikasi botaninya tidak sepenuhnya pasti. Transliterasi mempertahankan ketidakpastian itu, sedangkan keterangan tentang identifikasi tradisional sebagai mandrake diberikan dalam catatan kaki.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: שָׂדֶה dalam konteks pertanian ini secara wajar berarti ladang.
- source_word: וַיָּבֵא אֹתָם
  choice: Ia membawanya
  rationale: Bentuk Hifil dari בוא berarti 'membawa'. Dalam bahasa Indonesia, pronomina -nya tidak membedakan tunggal dan jamak dan secara alami merujuk pada buah dudaim yang ditemukan.
- source_word: אֶל לֵאָה אִמּוֹ
  choice: kepada Lea, ibunya
  rationale: Terjemahan ini mempertahankan nama Lea diikuti keterangannya sebagai ibu Ruben dengan susunan Indonesia yang jelas.
- source_word: תְּנִי נָא לִי
  choice: Tolong berikan kepadaku
  rationale: Partikel נָא memberi nuansa permohonan sopan, yang disampaikan dengan 'tolong'.
- source_word: מִדּוּדָאֵי
  choice: sebagian buah dudaim
  rationale: Preposisi מִן bersifat partitif, sehingga 'sebagian' menyatakan bahwa Rahel meminta sejumlah dari buah-buah itu.
- source_word: בְּנֵךְ
  choice: anakmu itu
  rationale: Bentuk ini merujuk kepada anak laki-laki Lea, yaitu Ruben. Dalam konteks yang sudah menyebut Ruben, 'anakmu itu' terdengar alami dan tetap jelas.
theological_decisions:
- issue: Kaitan buah dudaim dengan kesuburan
  choice: Tidak menyatakan dalam teks utama bahwa tanaman itu menyebabkan atau menjamin kesuburan
  alternative: Menjelaskan buah itu sebagai tanaman penyubur atau afrodisiak
  rationale: Ayat hanya menceritakan penemuan dan permintaan atas buah tersebut. Makna atau khasiat teologis maupun biologisnya tidak dinyatakan secara eksplisit dan tidak boleh dimasukkan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama 'Ruben', 'Lea', dan 'Rahel' mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Istilah 'dudaim' dipertahankan untuk menjaga ketidakpastian leksikal sumber, dengan penjelasan pada catatan kaki.
