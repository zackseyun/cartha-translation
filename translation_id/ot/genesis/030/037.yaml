translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Bagi dirinya' mempertahankan nuansa לֹו tanpa memberi tekanan berlebihan. Nama-nama pohon yang kurang pasti dijelaskan melalui catatan kaki, sedangkan tindakan mengupas dirumuskan secara konkret dan mudah dibayangkan.
