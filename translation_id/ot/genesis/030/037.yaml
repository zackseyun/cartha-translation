base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: id
  text: Kemudian Yakub mengambil bagi dirinya cabang-cabang segar dari pohon poplar[a], pohon badam[b], dan pohon platanus[c]. Pada cabang-cabang itu ia mengupas kulitnya hingga tampak garis-garis putih, dengan menyingkapkan bagian putih pada cabang-cabang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pohon damar wangi”; jenis pohon yang dimaksud oleh kata Ibrani לִבְנֶה tidak dapat dipastikan, meskipun “pohon poplar” merupakan terjemahan yang umum.
    reason: lexical_alternative
  - marker: b
    text: Sebagian terjemahan lama memakai nama “pohon hazel”, tetapi “pohon badam” lebih mungkin.
    reason: lexical_alternative
  - marker: c
    text: Sebagian terjemahan lama menerjemahkannya “pohon kastanye”, tetapi “pohon platanus” lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: cabang-cabang
  rationale: Dalam konteks ini, kata tersebut menunjuk pada potongan cabang kayu yang baru dipotong. 'Cabang-cabang' lebih konkret dan alami daripada 'tongkat-tongkat' untuk benda yang kulitnya dikupas.
- source_word: לִבְנֶה לַח
  choice: cabang-cabang segar dari pohon hawar
  rationale: לַח menunjukkan kayu yang masih segar atau berair. Identifikasi לִבְנֶה tidak sepenuhnya pasti; 'pohon hawar' dipakai sebagai padanan umum bagi poplar, dengan ketidakpastian dicatat dalam catatan kaki.
- source_word: לוּז
  choice: badam
  rationale: Istilah Ibrani ini lebih mungkin menunjuk pada pohon badam daripada hazel; nama pohonnya dinyatakan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: עֶרְמוֹן
  choice: berangan
  rationale: Dipakai sebagai nama Indonesia yang lazim untuk plane tree, bukan pohon kastanye sebagaimana dalam sebagian tradisi terjemahan lama.
- source_word: וַיְפַצֵּל
  choice: mengupas
  rationale: Kata kerja ini dalam konteks menggambarkan pembuangan sebagian kulit cabang agar kayu putih di bawahnya terlihat.
- source_word: פְּצָלוֹת לְבָנוֹת
  choice: bagian-bagian putih
  rationale: Frasa ini menggambarkan pola atau bidang putih yang dihasilkan melalui pengupasan. Pilihan ini tidak terlalu menentukan apakah bentuknya tepat berupa garis atau belang.
- source_word: מַחְשֹׂף הַלָּבָן
  choice: sehingga menampakkan bagian putihnya
  rationale: Menyampaikan hasil tindakan pengupasan, yakni tersingkapnya kayu putih di bawah kulit, dalam susunan bahasa Indonesia yang alami.
- source_word: אֲשֶׁר עַל הַמַּקְלוֹת
  choice: pada cabang-cabang itu
  rationale: Mempertahankan hubungan lokatif עַל sambil menghindari ungkapan kaku 'putih yang ada di atas cabang-cabang'.
