  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: id
  text: Ia mengandung dan melahirkan seorang anak laki-laki. Ia berkata, “Allah telah mengangkat aibku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “celaanku,” “kehinaanku,” atau “rasa maluku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: Ia mengandung
  rationale: Kata kerja הרה menyatakan mulai hamil atau mengandung; bentuk ini ringkas, alami, dan sesuai dengan urutan narasi.
- source_word: וַתֵּלֶד בֵּן
  choice: dan melahirkan seorang anak laki-laki
  rationale: ילד bersama בֵּן secara langsung menyatakan kelahiran seorang anak laki-laki; terjemahan ini alami dalam bahasa Indonesia modern.
- source_word: וַתֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol melanjutkan narasi. Kalimat baru dengan subjek tersurat terdengar jelas dan alami dalam bahasa Indonesia.
- source_word: אָסַף
  choice: telah menyingkirkan
  rationale: Dalam konteks ini אסף berarti mengangkat atau menyingkirkan sesuatu yang memalukan; 'telah menyingkirkan' mempertahankan nuansa hasil yang kini dirasakan.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuknya secara morfologis jamak, kata ini disertai verba tunggal dan merujuk kepada Allah yang esa.
- source_word: חֶרְפָּתִי
  choice: aibku
  rationale: חֶרְפָּה mencakup cela, kehinaan, dan rasa malu dalam ranah sosial. 'Aibku' menyampaikan dimensi publik tersebut secara ringkas dan wajar.
theological_decisions:
- issue: Makna tunggal אֱלֹהִים
  choice: Allah
  alternative: allah-allah
  rationale: Kesesuaian verba tunggal אָסַף dan konteks menuntut rujukan tunggal; tidak diperlukan perluasan teologis di luar tata bahasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Aib' dipilih untuk mempertahankan dimensi sosial חֶרְפָּה, sementara catatan kaki mencatat alternatif maknanya.
