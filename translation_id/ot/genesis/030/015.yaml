base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: id
  text: Namun Lea berkata kepadanya, “Belum cukupkah engkau mengambil suamiku? Apakah engkau juga hendak mengambil buah dudaim anakku?” Rahel berkata, “Kalau begitu, malam ini ia boleh tidur denganmu sebagai ganti buah dudaim anakmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: Belum cukupkah
  rationale: Ungkapan retoris ini secara harfiah berarti ‘apakah terlalu kecil/sedikit’; dalam konteks tuduhan Lea, ‘Belum cukupkah’ menyampaikan daya retorisnya secara alami.
- source_word: דּוּדָאִים
  choice: buah dudaim
  rationale: Istilah Ibrani menunjuk tumbuhan/buah yang lazim diidentifikasi sebagai mandragora. Bentuk ‘dudaim’ mempertahankan istilah khas dan menghindari kepastian botani yang berlebihan.
- source_word: יִשְׁכַּב עִמָּךְ
  choice: ia boleh tidur denganmu
  rationale: Menyampaikan ungkapan hubungan seksual secara wajar dan bermartabat tanpa menghilangkan maksud konteks.
- source_word: תַּחַת
  choice: sebagai ganti
  rationale: 'Menandai pertukaran: waktu bersama Yakub diberikan sebagai imbalan atas buah dudaim.'
theological_decisions:
- issue: Subjek perempuan pada awal ayat
  choice: Namun Lea berkata kepadanya
  alternative: Namun ia berkata kepadanya
  rationale: Bahasa sumber hanya memakai bentuk feminin ‘ia berkata’, tetapi konteks langsung mengidentifikasi penuturnya sebagai Lea. Penyebutan nama memperjelas rujukan tanpa mengubah isi.
- issue: Tuduhan bahwa Rahel ‘mengambil’ suami Lea
  choice: engkau mengambil suamiku
  alternative: engkau telah mengambil suamiku
  rationale: Mempertahankan tuduhan tajam Lea sebagaimana teks, tanpa mencoba menyelaraskan atau menjelaskan hubungan perkawinan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog mempertahankan ketegangan antarsaudari serta pola pertukaran dalam teks. Istilah ‘buah dudaim’ dipilih sebagai transliterasi yang mudah dibaca karena identifikasi tumbuhannya tidak sepenuhnya pasti.
