  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָלְדָ֥ה רָחֵ֖ל אֶת יוֹסֵ֑ף וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל לָבָ֔ן שַׁלְּחֵ֨/נִי֙ וְ/אֵ֣לְכָ֔ה אֶל מְקוֹמִ֖/י וּ/לְ/אַרְצִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/025.yaml
  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: id
  text: Setelah Rahel melahirkan Yusuf, Yakub berkata kepada Laban, “Izinkanlah aku pergi, supaya aku pulang ke tempat dan negeriku sendiri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Setelah
  rationale: Dalam konteks naratif, ungkapan ini menandai waktu sesudah kelahiran Yusuf; bentuk alami bahasa Indonesia tidak perlu mempertahankan formula harfiah ‘dan terjadilah ketika’.
- source_word: שַׁלְּחֵנִי
  choice: Izinkanlah aku pergi
  rationale: Bentuk piel imperatif dari שלח dengan sufiks orang pertama meminta Laban melepaskan atau mengizinkan Yakub berangkat; pilihan ini alami dan tetap menunjukkan bahwa keberangkatannya memerlukan persetujuan Laban.
- source_word: וְאֵלְכָה
  choice: supaya aku pulang
  rationale: Bentuk kohortatif menyatakan maksud yang mengikuti permintaan untuk dilepas. ‘Pulang’ menangkap gerak menuju tempat dan negeri Yakub sendiri tanpa menambah tujuan yang asing dari konteks.
- source_word: אֶל מְקוֹמִי וּלְאַרְצִי
  choice: ke tempat dan negeriku sendiri
  rationale: Dua unsur Ibrani dipertahankan, sedangkan ‘sendiri’ menyampaikan tekanan posesif idiomatis bahwa Yakub hendak kembali ke tempat asal dan negerinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Formula naratif Ibrani disampaikan secara idiomatis, sementara permintaan Yakub dan dua tujuan paralelnya tetap dipertahankan.
