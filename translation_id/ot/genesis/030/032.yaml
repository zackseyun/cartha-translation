  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: id
  text: Biarlah aku melewati seluruh kawanan ternakmu hari ini, sambil memisahkan dari sana setiap hewan yang berbintik-bintik dan berbelang-belang, setiap hewan yang berwarna gelap[a] di antara domba, serta setiap hewan yang berbelang-belang dan berbintik-bintik[b] di antara kambing; itulah upahku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cokelat”. Kata Ibrani חוּם menunjuk pada warna gelap atau cokelat pada domba.
    reason: lexical_alternative
  - marker: b
    text: Istilah yang diterjemahkan “berbintik-bintik” (נָקֹד) dan “berbelang-belang” (טָלוּא) sama-sama menggambarkan pola warna pada bulu hewan, dan perbedaan tepat di antara keduanya tidak pasti. Yang kedua juga dapat diterjemahkan “bertampal-tampal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר בְּכָל צֹאנְךָ
  choice: Biarlah aku memeriksa seluruh kawanan ternakmu
  rationale: Secara harfiah, עבר berarti ‘melewati/menyusuri’. Dalam konteks pemilahan ternak, ‘memeriksa seluruh kawanan’ menyampaikan tindakan menyusuri kawanan untuk menyeleksi hewan, sedangkan ‘biarlah’ mempertahankan nuansa volitif dalam usul Yakub.
- source_word: הָסֵר מִשָּׁם
  choice: dan memisahkan dari sana
  rationale: Bentuk dari סור menyatakan penyingkiran atau pemisahan hewan-hewan tertentu dari kawanan; ‘memisahkan’ paling alami dalam konteks ini.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: Nomina kolektif ini mencakup ternak kecil, terutama domba dan kambing; ‘kawanan ternak’ tidak membatasinya hanya pada salah satu jenis.
- source_word: נָקֹד
  choice: berbintik-bintik
  rationale: Istilah ini menunjuk pada pola berupa bintik-bintik kecil pada bulu hewan.
- source_word: טָלוּא
  choice: berbelang-belang
  rationale: Istilah ini menunjuk pada warna bercorak, bertampal, atau berbidang; ‘berbelang-belang’ membedakannya secara wajar dari נָקֹד tanpa mengklaim perbedaan yang terlalu pasti.
- source_word: חוּם
  choice: berwarna gelap
  rationale: Kata ini mengacu pada warna gelap atau cokelat. ‘Berwarna gelap’ mempertahankan keluasan maknanya.
- source_word: בַּכְּשָׂבִים
  choice: domba
  rationale: Dalam konteks kawanan, bentuk jamak ini menunjuk pada kelompok domba dan dikontraskan dengan kambing.
- source_word: בָּעִזִּים
  choice: kambing
  rationale: Bentuk jamak עִזִּים secara alami diterjemahkan sebagai kelompok kambing tanpa penentuan jenis kelamin yang tidak diperlukan.
- source_word: וְהָיָה שְׂכָרִי
  choice: Itulah yang akan menjadi upahku
  rationale: שָׂכָר berarti upah atau bayaran. Bentuk ini jelas dan alami dalam konteks perundingan kerja Yakub dengan Laban.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan jenis hewan dan pola warna mengikuti teks Ibrani; istilah warna dibuat alami tanpa menghilangkan ketidakpastian leksikal.
