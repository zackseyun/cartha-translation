  text: Lalu ia berkata, “Tentukanlah upahmu yang harus kubayar, dan aku akan membayarnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan gerak berurutan itu secara alami dalam bahasa Indonesia.
- source_word: נָקְבָה
  choice: Sebutkan
  rationale: Dalam konteks ini נקב berarti menetapkan atau menyatakan dengan jelas. “Sebutkan” wajar untuk permintaan agar Yakub menyatakan besarnya upah.
- source_word: שְׂכָרְךָ
  choice: upahmu
  rationale: שָׂכָר di sini menunjuk pada imbalan atas pekerjaan; “upahmu” tepat dan lugas dalam konteks hubungan kerja.
- source_word: עָלַי
  choice: kepadaku
  rationale: Secara harfiah berarti “atas-ku”, tetapi dalam konstruksi idiomatis ini menandai pihak kepada siapa upah itu disebutkan; “kepadaku” mempertahankan unsur yang nyata dalam teks Ibrani tanpa kekakuan.
- source_word: וְאֶתֵּנָה
  choice: dan aku akan memberikannya
  rationale: נתן berarti “memberi”. Akhiran “-nya” memasok objek yang dipahami, yakni upah yang baru disebutkan, dan bentuk tunggal sesuai dengan שְׂכָרְךָ yang secara gramatikal tunggal.
