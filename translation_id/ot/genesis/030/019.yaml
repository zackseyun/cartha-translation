  text: Leah conceived again and bore Jacob a sixth son.
translation:
  language: id
  text: Lea mengandung lagi dan melahirkan anak laki-laki yang keenam bagi Yakub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Verba הרה dalam bentuk naratif qal berarti mengandung; padanan ini langsung, alami, dan lazim dalam kisah kelahiran.
- source_word: עוֹד
  choice: lagi
  rationale: 'Dalam rangkaian naratif ini, עוֹד menyatakan pengulangan: Lea kembali mengandung.'
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Verba ילד dalam bentuk ini berarti melahirkan; padanan ini merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: בֵּן
  choice: anak laki-laki
  rationale: בֵּן berarti anak laki-laki atau putra; dalam konteks kelahiran, 'anak laki-laki' terdengar paling alami dan jelas.
- source_word: שִׁשִּׁי
  choice: yang keenam
  rationale: Bilangan tingkat ini menerangkan anak laki-laki tersebut sebagai anak keenam Lea bagi Yakub; konstruksi 'yang keenam' alami dalam bahasa Indonesia.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi לְ menyatakan hubungan atau kepentingan dalam ungkapan 'melahirkan seorang anak bagi Yakub'; 'bagi Yakub' mempertahankan nuansa sumber tanpa terasa janggal.
