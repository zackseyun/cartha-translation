base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: id
  text: Berikanlah kepadaku istri-istriku dan anak-anakku, yang untuk mereka aku telah bekerja untukmu,[a] supaya aku dapat pergi; sebab engkau tahu pekerjaan yang telah kukerjakan untukmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” dapat dipahami dengan rujukan yang lebih khusus kepada istri-istri Yakub, bukan kepada seluruh keluarga yang baru disebut.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “pekerjaanku yang telah kukerjakan untukmu.” Kata benda dan kata kerja Ibrani berasal dari akar yang sama; keduanya juga dapat diterjemahkan “pelayanan” dan “melayani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: Serahkanlah kepadaku
  rationale: Imperatif נתן meminta Laban menyerahkan keluarga Yakub kepadanya; 'serahkanlah kepadaku' lebih tepat dan alami daripada sekadar 'berikanlah kepadaku', sebab mereka bukan milik Laban.
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: istri-istriku dan anak-anakku
  rationale: Bentuk jamak bersufiks orang pertama secara jelas menunjuk kepada para istri dan anak Yakub.
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָהֵן
  choice: yang demi mereka aku telah bekerja padamu
  rationale: בָהֵן berbentuk feminin jamak dan paling langsung merujuk kepada para istri, tetapi klausa relatif dapat terdengar berkaitan dengan keluarga yang baru disebut. 'Demi mereka' mempertahankan hubungan sebab atau imbalan tanpa memaksakan cakupan rujukannya.
- source_word: וְאֵלֵכָה
  choice: lalu biarkanlah aku pergi
  rationale: Bentuk kohortatif menyatakan kehendak Yakub untuk berangkat; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya volitifnya.
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: Sebab, engkau tahu
  rationale: כִּי memperkenalkan alasan, sedangkan pronomina eksplisit אַתָּה memberi sedikit penekanan pada 'engkau'.
- source_word: אֶת עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: bagaimana aku telah bekerja untukmu
  rationale: Bahasa Indonesia yang alami mengungkapkan objek internal Ibrani sebagai 'bagaimana aku telah bekerja'. Kata 'bekerja' dipakai kembali agar pengulangan akar עבד tetap terasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Aku/engkau' sesuai dengan dialog naratif. Pengulangan akar עבד dipertahankan sejauh wajar melalui 'bekerja', sedangkan konstruksi objek internal dibuat idiomatis.
