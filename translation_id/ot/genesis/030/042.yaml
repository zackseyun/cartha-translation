base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: id
  text: Namun, ketika kawanan ternak itu lemah[a], Yakub tidak memasang batang-batang itu[b]. Dengan demikian, ternak yang lemah menjadi milik Laban, sedangkan yang kuat[c] menjadi milik Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurang kuat.” Istilah Ibrani ini dapat menunjuk pada ternak yang lemah; sebagian orang memahaminya secara lebih khusus sebagai ternak yang lambat berkembang biak atau bermutu lebih rendah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia tidak menaruh.” Yang dimaksud ialah Yakub tidak menaruh batang-batang itu di depan ternak, seperti dalam ayat-ayat sebelumnya.
    reason: cross_reference
  - marker: c
    text: Atau “yang kokoh” atau “yang bertenaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: ketika kawanan ternak itu lemah
  rationale: Prefiks ב pada bentuk infinitif membentuk anak kalimat waktu. Dalam konteks pembiakan ini, akar עטף menunjuk pada ternak yang lemah, meskipun nuansa tepatnya—misalnya lambat berkembang biak atau bermutu lebih rendah—tidak sepenuhnya pasti.
- source_word: הַצֹּאן
  choice: kawanan ternak
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil, terutama domba dan kambing. 'Kawanan ternak' alami dalam bahasa Indonesia dan tidak mempersempitnya hanya kepada domba.
- source_word: לֹא יָשִׂים
  choice: Yakub tidak memasang batang-batang itu
  rationale: Kata kerja שׂים berarti 'menaruh, menempatkan, memasang'. Subjek dan objek tidak dinyatakan secara eksplisit dalam klausa Ibrani, tetapi konteks ayat-ayat sebelumnya menunjukkan bahwa Yakub tidak memasang batang-batang tersebut di depan ternak.
- source_word: וְהָיָה
  choice: Dengan demikian, ... menjadi milik
  rationale: 'Bentuk ini menyatakan keadaan atau hasil yang timbul: kelompok ternak yang lemah jatuh menjadi milik Laban dan yang kuat menjadi milik Yakub.'
- source_word: הָעֲטֻפִים
  choice: ternak yang lemah
  rationale: Bentuk dari akar עטף ini mengacu kepada kelompok ternak yang lebih lemah dan mempertahankan kaitan leksikal dengan klausa pertama.
- source_word: לְלָבָן ... לְיַעֲקֹב
  choice: menjadi milik Laban ... menjadi milik Yakub
  rationale: Preposisi ל di sini menunjukkan kepemilikan atau pembagian kepada masing-masing pihak.
- source_word: וְהַקְּשֻׁרִים
  choice: sedangkan yang kuat
  rationale: Walaupun bentuk Ibraninya tidak lazim, kontras dengan הָעֲטֻפִים dalam konteks ini menunjuk kepada ternak yang kuat atau sehat. 'Kuat' menyampaikan kontras itu tanpa menambahkan rincian fisiologis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Nama 'Yakub' disebut untuk memperjelas subjek yang tersirat, sedangkan 'batang-batang itu' dipulihkan dari konteks langsung dan dijelaskan dalam catatan kaki. Kontras lemah–kuat dipertahankan tanpa memastikan secara berlebihan nuansa teknis pembiakan.
