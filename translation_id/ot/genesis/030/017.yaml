  text: וַ/יִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל לֵאָ֑ה וַ/תַּ֛הַר וַ/תֵּ֥לֶד לְ/יַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: id
  text: Allah mendengarkan Lea[a]; lalu Lea mengandung dan melahirkan anak laki-laki kelima bagi Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengar Lea.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: mendengarkan
  rationale: Gabungan שׁמע dengan אֶל di sini menyiratkan perhatian yang disertai tanggapan, bukan sekadar mendengar bunyi. 'Mendengarkan' mempertahankan nuansa relasional itu tanpa menyatakan lebih daripada teks.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam narasi ini אֱלֹהִים menunjuk kepada satu-satunya Allah; 'Allah' adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: לֵאָה
  choice: Lea
  rationale: Nama ini mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Padanan ringkas, wajar, dan tepat bagi הרה dalam kisah kelahiran.
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Padanan langsung dan alami bagi ילד dalam konteks ini.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi לְ menandai relasi anak yang dilahirkan bagi Yakub. Ungkapan ini mempertahankan unsur tersebut secara alami dalam bahasa Indonesia.
- source_word: בֵּן חֲמִישִׁי
  choice: anak laki-laki kelima
  rationale: בֵּן berarti anak laki-laki atau putra, dan חֲמִישִׁי menerangkan urutannya. Bentuk ini jelas dan alami bagi pembaca modern.
theological_decisions:
- issue: Tanggapan ilahi yang tersirat dalam שׁמע אֶל
  choice: Allah 'mendengarkan' Lea, yang menyiratkan perhatian dan tanggapan yang baik.
  alternative: Allah 'mendengar' Lea.
  rationale: Bahasa Ibrani memungkinkan terjemahan lebih formal 'mendengar', tetapi konstruksi dengan אֶל dalam konteks ini lazim menyampaikan perhatian yang menghasilkan tanggapan. Terjemahan utama mempertahankan nuansa itu, sedangkan catatan kaki menjaga alternatif formalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Tanda titik koma membantu memperlihatkan tanggapan naratif sesudah Allah mendengarkan Lea tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
