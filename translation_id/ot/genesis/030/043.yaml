  text: וַ/יִּפְרֹ֥ץ הָ/אִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽ/יְהִי ל/וֹ֙ צֹ֣אן רַבּ֔וֹת וּ/שְׁפָחוֹת֙ וַ/עֲבָדִ֔ים וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: id
  text: Maka orang itu menjadi sangat-sangat makmur dan memiliki banyak kawanan domba dan kambing, budak perempuan dan budak laki-laki, unta, dan keledai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: menjadi sangat makmur
  rationale: Kata kerja פרץ secara harfiah menggambarkan gerak menerobos atau meluas; dalam konteks pertambahan harta, ungkapan ini secara idiomatis menunjuk pada kemajuan dan kemakmuran yang luar biasa.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Mempertahankan kata benda umum Ibrani yang merujuk kepada Yakub dalam konteks, tanpa mengganti secara eksplisit dengan namanya.
- source_word: מְאֹד מְאֹד
  choice: sangat
  rationale: Pengulangan מְאֹד memberi penekanan kuat. Bahasa Indonesia alami memakai 'sangat' bersama 'makmur'; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיְהִי לוֹ
  choice: ia memiliki
  rationale: Konstruksi ini menyatakan bahwa semua itu kemudian menjadi miliknya. 'Ia memiliki' menyampaikan hasil kepemilikan secara alami dalam bahasa Indonesia.
- source_word: צֹאן רַבּוֹת
  choice: banyak kawanan kambing domba
  rationale: צֹאן adalah ternak kecil kolektif, terutama domba dan kambing; 'kambing domba' mencakup kedua jenis itu, sedangkan 'banyak kawanan' mencerminkan רַבּוֹת.
- source_word: שְׁפָחוֹת
  choice: budak perempuan
  rationale: Istilah ini menunjuk pada perempuan dalam status perhambaan rumah tangga. 'Budak' mempertahankan kenyataan status sosialnya dan 'perempuan' mempertahankan pembedaan gender.
- source_word: עֲבָדִים
  choice: budak laki-laki
  rationale: Dalam pasangan dengan שְׁפָחוֹת dan daftar kepemilikan ini, istilah tersebut menunjuk pada laki-laki berstatus budak; terjemahan ini mempertahankan status dan gender.
- source_word: גְמַלִּים
  choice: unta
  rationale: Padanan baku dalam bahasa Indonesia modern.
- source_word: חֲמֹרִים
  choice: keledai
  rationale: Padanan baku dalam bahasa Indonesia modern.
theological_decisions:
- issue: Apakah שְׁפָחוֹת dan עֲבָדִים diterjemahkan sebagai pelayan atau budak
  choice: budak perempuan dan budak laki-laki
  alternative: pelayan perempuan dan pelayan laki-laki
  rationale: Kedua istilah dapat mencakup pelayanan rumah tangga, tetapi dalam ayat ini orang-orang tersebut dicantumkan dalam daftar kepemilikan Yakub. 'Budak' lebih jelas mempertahankan kenyataan ikatan sosial yang dinyatakan teks tanpa melunakkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan rangkaian kumulatif teks Ibrani, tetapi memakai tanda koma yang wajar dalam daftar bahasa Indonesia. 'Maka' membawa alur naratif וַ tanpa menghasilkan pengulangan 'dan' yang kaku.
