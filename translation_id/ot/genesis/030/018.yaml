base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: id
  text: Lalu Lea berkata, “Allah telah memberikan upahku[a], karena aku telah memberikan hamba perempuanku kepada suamiku.” Lalu ia menamai anak itu Isakhar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Isakhar terdengar berkaitan dengan kata Ibrani yang berarti “upah” atau “ganjaran”, sesuai dengan penjelasan Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: Allah telah memberikan
  rationale: Bentuk perfektif Ibrani menyatakan tindakan yang telah selesai dengan hasil yang kini diakui Lea; bentuk 'telah memberikan' alami dalam penjelasan penamaan ini.
- source_word: שְׂכָרִי
  choice: upahku
  rationale: Kata שָׂכָר dapat berarti upah atau ganjaran. 'Upahku' mempertahankan nuansa transaksional dan kaitan bunyi dengan nama Isakhar.
- source_word: אֲשֶׁר
  choice: karena
  rationale: Dalam susunan ini partikel relatif tersebut berfungsi menjelaskan alasan yang Lea berikan.
- source_word: נָתַתִּי
  choice: aku telah memberikan
  rationale: Bentuk ini merujuk pada tindakan Lea yang sudah terjadi dan berkaitan langsung dengan penjelasannya sekarang.
- source_word: שִׁפְחָתִי
  choice: hambaku perempuan
  rationale: שִׁפְחָה menunjuk kepada perempuan berstatus hamba; pilihan ini mempertahankan jenis kelamin dan status sosial tanpa menyiratkan usia tertentu.
- source_word: לְאִישִׁי
  choice: kepada suamiku
  rationale: Dalam konteks hubungan Lea dengan Yakub, אִישִׁי berarti 'suamiku'.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Maka ia menamai anak itu
  rationale: Ungkapan Ibrani ini merupakan idiom pemberian nama; 'anak itu' memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: יִשָּׂשכָר
  choice: Isakhar
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang dekat dengan ejaan Ibrani dan lazim dikenali; permainan katanya diterangkan dalam catatan kaki.
theological_decisions:
- issue: Penjelasan Lea mengenai tindakan Allah dan kelahiran anak itu sebagai upah
  choice: Ucapan Lea diterjemahkan langsung sebagai pengakuannya bahwa Allah memberinya upah.
  alternative: Memakai 'ganjaranku' untuk mengurangi kesan transaksional.
  rationale: Ayat ini melaporkan penafsiran Lea sendiri atas peristiwa tersebut tanpa menyetujui ataupun mengecam teologinya; nuansa שָׂכָר perlu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. 'Hambaku perempuan' dipilih untuk menyatakan status dan jenis kelamin secara transparan; 'Maka' menjaga alur akibat/urutan penamaan. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
