id: GEN.30.40
reference: Genesis 30:40
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: id
  text: Yakub memisahkan anak-anak domba itu[a], lalu membuat kawanan itu menghadap kepada yang berbelang[b] dan semua yang berwarna gelap di antara kawanan Laban[c]. Kemudian ia menempatkan kawanan-kawanan miliknya secara terpisah dan tidak menempatkannya bersama kawanan Laban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “domba-domba muda”.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang bergaris-garis”; istilah Ibraninya menunjuk pada hewan yang bertanda belang atau jalur.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang berasal dari kawanan Laban”.
    reason: source_ambiguity
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: anak-anak domba
  rationale: Istilah כֶּשֶׂב menunjuk pada domba muda atau anak domba; pilihan ini mempertahankan kekhususan istilah dibandingkan kata umum 'domba'.
- source_word: הִפְרִיד
  choice: memisahkan
  rationale: Bentuk Hifil dari פרד secara langsung menyatakan tindakan memisahkan atau membuat terpisah.
- source_word: וַיִּתֵּן פְּנֵי הַצֹּאן
  choice: membuat kawanan itu menghadap
  rationale: Ungkapan harfiahnya adalah 'menempatkan muka kawanan'. Terjemahan ini menyampaikan tindakan mengarahkan hewan-hewan itu dengan bahasa Indonesia yang alami.
- source_word: עָקֹד
  choice: yang berbelang
  rationale: Kata ini menggambarkan hewan yang memiliki tanda berupa jalur, lingkaran, atau belang; 'berbelang' jelas dan alami dalam konteks warna ternak.
- source_word: כָל חוּם
  choice: semua yang berwarna gelap
  rationale: חוּם dapat menunjuk pada warna cokelat atau gelap. 'Berwarna gelap' tidak mempersempit maknanya secara berlebihan.
- source_word: בְּצֹאן לָבָן
  choice: di antara kawanan Laban
  rationale: Preposisi ב paling langsung dibaca secara lokatif sebagai 'di dalam/di antara'. Kemungkinan makna asal, 'dari kawanan Laban', dicatat agar ketegangan naratif dan ambiguitas sumber tidak diselesaikan secara diam-diam.
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: ia menempatkan kawanan-kawanan miliknya secara terpisah
  rationale: Terjemahan ini mencakup tindakan menempatkan, kepentingan atau kepemilikan Yakub, dan keadaan kawanan yang terpisah.
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: tidak menempatkannya bersama kawanan Laban
  rationale: Kata ganti objek mengacu pada kawanan-kawanan yang baru disebut, sedangkan עַל dalam konteks ini menyatakan penempatan bersama atau berdampingan.
theological_decisions:
- issue: Hubungan hewan berbelang dan berwarna gelap dengan kawanan Laban
  choice: di antara kawanan Laban
  alternative: yang berasal dari kawanan Laban
  rationale: Bacaan lokatif paling langsung mencerminkan konstruksi Ibrani, tetapi dapat tampak tegang dengan 30:35–36. Bacaan asal juga mungkin; karena persoalannya bersifat tekstual-leksikal dan bukan sesuatu yang harus diharmoniskan, alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan tubuh Ibrani 'muka kawanan' dialihkan menjadi 'membuat kawanan itu menghadap' agar alami tanpa menghilangkan arah tindakan. Semua alternatif yang penting bagi makna sumber dicatat secara ringkas.
