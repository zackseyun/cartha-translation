  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: id
  text: Lalu Yakub menjadi marah kepada Rahel dan berkata[a], “Apakah aku ini pengganti Allah? Dialah yang menahan buah kandungan[b] darimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “amarah Yakub menyala terhadap Rahel.”
    reason: lexical_alternative
  - marker: b
    text: “Buah kandungan” adalah ungkapan Ibrani untuk anak atau keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: menjadi marah
  rationale: Ungkapan Ibrani secara harfiah menggambarkan amarah yang menyala. 'Menjadi marah' menyampaikan daya ungkapan itu secara wajar dalam bahasa Indonesia modern; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בְּרָחֵל
  choice: kepada Rahel
  rationale: Preposisi ini menandai Rahel sebagai sasaran kemarahan Yakub. 'Marah kepada Rahel' alami dan jelas dalam bahasa Indonesia.
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: Apakah aku ini pengganti Allah?
  rationale: תַחַת di sini menyatakan penggantian atau kedudukan sebagai wakil, bukan lokasi di bawah. Bentuk ini mempertahankan pertanyaan retoris Yakub dengan bahasa yang alami.
- source_word: אֲשֶׁר מָנַע
  choice: Dialah yang menahan
  rationale: Klausa relatif menunjuk kepada Allah sebagai pelaku yang mencegah hadirnya keturunan. 'Dialah' memperjelas anteseden tanpa mengubah klaim sumber.
- source_word: מִמֵּךְ
  choice: darimu
  rationale: Preposisi מן menyatakan pemisahan atau penolakan sesuatu dari Rahel.
- source_word: פְּרִי בָטֶן
  choice: buah kandungan
  rationale: Pilihan ini mempertahankan metafora konkret Ibrani bagi anak atau keturunan dan tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Peran Allah dalam kemandulan Rahel
  choice: Yakub menyatakan bahwa Allah menahan keturunan dari Rahel.
  alternative: Menganggap perkataan itu semata-mata retoris tanpa menyatakan peran ilahi.
  rationale: Klausa אֲשֶׁר מָנַע secara langsung menjadikan Allah subjek yang menahan buah kandungan. Terjemahan mempertahankan ketegangan teologis ini tanpa memperlunaknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pertanyaan retoris dibuat alami, metafora sumber dipertahankan, dan semua penanda catatan kaki dicantumkan dalam teks utama.
