  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: id
  text: Lalu Lea berkata, “Betapa bahagianya aku! Sebab para perempuan[b] akan menyebut aku berbahagia.” Lalu ia menamainya Asyer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Asyer merupakan permainan kata dengan kata-kata Ibrani yang berarti “bahagia” dan “menyebut berbahagia” dalam ucapan Lea.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak perempuan”; kata ini dapat dipakai secara idiomatis untuk perempuan pada umumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: Betapa bahagianya aku!
  rationale: Ungkapan seruan ini menyampaikan kebahagiaan atau keberuntungan Lea secara alami dalam bahasa Indonesia serta mempertahankan kaitannya dengan kata kerja berikut dan nama Asyer.
- source_word: אִשְּׁרוּנִי
  choice: akan menyebut aku berbahagia
  rationale: Bentuk Piel dari אשר berarti menyatakan atau menyebut seseorang berbahagia. Pilihan ini mempertahankan pengulangan akar kata dalam ucapan Lea.
- source_word: בָּנוֹת
  choice: para perempuan
  rationale: Secara harfiah berarti 'anak-anak perempuan', tetapi dalam konteks ini dapat dipakai secara idiomatis bagi kaum perempuan pada umumnya; 'para perempuan' menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: Maka ia menamai anak itu Asyer
  rationale: Ini merupakan padanan Indonesia yang alami bagi rumus penamaan Ibrani 'memanggil namanya', tanpa mengubah pelaku maupun objeknya.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan keterkaitan maknanya dijelaskan melalui ucapan Lea serta catatan kaki.
