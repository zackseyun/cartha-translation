id: GEN.30.9
reference: Genesis 30:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: id
  text: Ketika Lea melihat bahwa ia telah berhenti melahirkan anak[a], ia mengambil Zilpa, hamba perempuannya[b], lalu memberikannya kepada Yakub sebagai istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah berhenti beranak”; secara harfiah dalam bahasa Ibrani, “telah berhenti dari melahirkan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “budak perempuannya” atau “pelayan perempuannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; konstruksi “Ketika ...” menyatakan hubungan waktu dengan tindakan utama secara alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi pengamatan Lea, bukan alasan tindakannya.
- source_word: עָמְדָה מִלֶּדֶת
  choice: telah berhenti melahirkan anak
  rationale: Ungkapan עמד dengan מן dan infinitif berarti berhenti melakukan sesuatu. “Melahirkan anak” menyampaikan konteks ילד dengan jelas dan wajar.
- source_word: שִׁפְחָתָהּ
  choice: hamba perempuannya
  rationale: שִׁפְחָה menunjuk kepada hamba atau budak perempuan. Pilihan ini mempertahankan jenis kelamin dan kedudukan bawahannya tanpa menyiratkan usia tertentu.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Frasa ini merupakan ungkapan pemberian dalam perkawinan dan mempertahankan bahasa perkawinan yang eksplisit pada teks Ibrani.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְיַעֲקֹב
  choice: kepada Yakub
  rationale: Preposisi לְ menyatakan penerima dalam konstruksi ini.
theological_decisions:
- issue: Kedudukan Zilpa dalam rumah tangga dan bahasa perkawinan
  choice: Menerjemahkan שִׁפְחָה sebagai “hamba perempuan” dan לְאִשָּׁה sebagai “sebagai istri” tanpa melunakkan salah satunya.
  alternative: Memakai “budak perempuan” atau “pelayan perempuan” untuk statusnya, atau “gundik” untuk hubungan perkawinannya.
  rationale: Teks menyebut Zilpa sebagai שִׁפְחָה milik Lea sekaligus mengatakan bahwa ia diberikan kepada Yakub לְאִשָּׁה. Terjemahan mempertahankan kedua unsur tersebut dan tidak memasukkan kategori teknis “gundik” yang tidak terdapat dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Lalu” memperjelas kelanjutan tindakan tanpa menambah hubungan sebab-akibat. Penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
