  yaml_path: translation/ot/genesis/030/011.yaml
  text: And Leah said[a], “Good fortune!” So she called his name Gad.
translation:
  language: id
  text: Lalu Lea berkata, “Keberuntungan!”[a] Maka ia menamai anak itu Gad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani בגד sulit dipahami. Ungkapan ini mungkin merupakan seruan yang berarti “Keberuntungan!”; menurut penafsiran tradisional lain, artinya “Pasukan!” Nama Gad berbunyi mirip dengan kata Ibrani yang menjadi dasar permainan kata ini.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan tindakan dalam narasi; “Lalu” menyatakannya secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: לֵאָה
  choice: Lea
  rationale: Bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: בגד
  choice: Mujur!
  rationale: Ungkapan Ibrani ini sulit ditafsirkan, tetapi kemungkinan merupakan seruan yang berkaitan dengan גד, yakni keberuntungan atau kemujuran. “Mujur!” terdengar alami sebagai seruan singkat dan tetap mendukung permainan bunyi dengan nama Gad.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: Maka ia menamai anak itu
  rationale: Dalam konteks pemberian nama, idiom harfiah “memanggil namanya” diungkapkan secara wajar dalam bahasa Indonesia sebagai “menamai anak itu”; “Maka” mempertahankan alur dari seruan Lea kepada pemberian nama.
- source_word: גָּד
  choice: Gad
  rationale: Transliterasi nama Ibrani yang lazim dan mempertahankan kaitan bunyi dengan seruan sebelumnya.
