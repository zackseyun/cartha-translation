source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: id
  text: Lalu Laban berkata kepadanya, “Jika aku berkenan di matamu, tinggallah[a]. Aku telah mengetahui melalui tenung[b] bahwa Yahweh telah memberkati aku karena engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “tinggallah” tidak tertulis dalam teks Ibrani, tetapi tersirat dari konteks.
    reason: supplied_ellipsis
  - marker: b
    text: Atau, “Aku telah menenung.” Kata Ibrani ini dapat menunjuk pada tenung atau pembacaan pertanda; sebagian orang memahaminya sebagai “aku telah mengetahui berdasarkan pengalaman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Jika aku berkenan di matamu, tinggallah
  rationale: Ungkapan Ibrani ‘mendapat kasih karunia di matamu’ menyatakan bahwa seseorang berkenan kepada orang lain. Bentuk ‘berkenan di matamu’ mempertahankan citra Ibrani dengan bahasa Indonesia yang wajar. Partikel נָא menyampaikan permohonan sopan, sedangkan ‘tinggallah’ dipasok dari konteks karena permintaannya dibiarkan eliptis dalam teks Ibrani.
- source_word: נִחַשְׁתִּי
  choice: Aku telah mengetahui melalui tenung
  rationale: Dalam bentuk piel, kata kerja נחשׁ biasanya menunjuk pada praktik mencari pengetahuan melalui pertanda atau tenung. Terjemahan ini mempertahankan makna kuat tersebut sekaligus menghasilkan kalimat Indonesia yang jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיְבָרֲכֵנִי
  choice: memberkati aku
  rationale: Kata kerja ברך berarti ‘memberkati’. Dalam konstruksi dengan ‘telah mengetahui’, bentuk ini secara alami menyatakan kenyataan yang diketahui Laban.
- source_word: בִּגְלָלֶךָ
  choice: karena engkau
  rationale: Frasa ini menyatakan sebab atau alasan. ‘Karena engkau’ merupakan padanan Indonesia yang langsung dan alami.
- source_word: לָבָן
  choice: Laban
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cara Laban memperoleh pengetahuan
  choice: melalui tenung
  alternative: berdasarkan pengalaman
  rationale: Kata נִחַשְׁתִּי paling kuat menunjuk pada tenung atau pembacaan pertanda. Terjemahan tidak melunakkan praktik tersebut ataupun menyatakan bahwa Yahweh menyetujui caranya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra ‘di matamu’ dipertahankan karena masih mudah dipahami. ‘Tenung’ dipilih untuk menjaga nuansa praktik mencari pertanda dalam teks sumber. Semua unsur tambahan yang diperlukan untuk melengkapi elipsis Ibrani ditandai dengan catatan kaki.
