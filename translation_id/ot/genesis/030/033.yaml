id: GEN.30.33
reference: Genesis 30:33
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: id
  text: 'Kelak[b] kejujuranku akan memberi kesaksian bagiku[a], ketika engkau datang memeriksa upahku: setiap kambing yang tidak berbintik-bintik ataupun belang, dan setiap domba yang tidak berwarna gelap[c], jika didapati padaku, harus dianggap sebagai curian.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kebenaranku akan menjawab bagiku”; dapat juga diterjemahkan “kelurusanku akan bersaksi bagiku.” Di sini yang dimaksud ialah kejujuran Yakub yang dapat dibuktikan dalam pengaturan upah tersebut.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada hari esok”; ungkapan ini dapat berarti “besok” atau, seperti di sini, “di kemudian hari” ketika Laban memeriksa kawanan itu.
    reason: lexical_alternative
  - marker: c
    text: Atau “cokelat.” Kata Ibraninya menunjuk pada domba yang warnanya gelap.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “itu curian padaku.” Maksudnya, setiap hewan yang tidak memiliki ciri yang disepakati tetapi didapati pada Yakub akan diperhitungkan sebagai curian.
    reason: clarity
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: akan memberi kesaksian bagiku
  rationale: Dalam konteks ini, ענה dengan ב menyatakan jawaban atau kesaksian yang membela Yakub. Ungkapan ini mempertahankan gambaran hukum dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: צִדְקָתִי
  choice: kejujuranku
  rationale: Di dalam perjanjian upah ini, kata tersebut menunjuk pada kelurusan dan kejujuran Yakub yang dapat dibuktikan, bukan secara khusus pada status teologis atau forensik.
- source_word: בְּיוֹם מָחָר
  choice: kelak
  rationale: Secara harfiah ungkapan ini berarti 'pada hari esok', tetapi dalam konteksnya dapat menunjuk pada waktu pemeriksaan di kemudian hari, tidak harus hari kalender berikutnya.
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: ketika engkau datang memeriksa upahku
  rationale: Klausa ini menggambarkan Laban yang datang untuk memeriksa hewan-hewan yang menjadi upah Yakub. Unsur לְפָנֶיךָ tersirat secara alami karena Laban sendiri melakukan pemeriksaan.
- source_word: נָקֹד וְטָלוּא
  choice: berbintik-bintik ataupun belang
  rationale: נָקֹד menunjuk pada bintik-bintik kecil, sedangkan טָלוּא menunjuk pada bercak atau pola belang. Dalam cakupan penyangkalan, 'tidak ... ataupun ...' menyatakan bahwa kambing yang tidak termasuk salah satu dari kedua corak itu tidak sah berada pada Yakub.
- source_word: חוּם
  choice: berwarna gelap
  rationale: Kata ini menunjukkan warna gelap, mungkin cokelat. Pilihan yang lebih luas ini tidak memastikan corak warna secara berlebihan.
- source_word: בַּכְּשָׂבִים
  choice: setiap domba
  rationale: כֶּשֶׂב dapat menunjuk pada domba atau anak domba; dalam konteks penggolongan kawanan, 'domba' adalah istilah Indonesia yang paling alami dan tidak terlalu membatasi umur hewan.
- source_word: גָּנוּב הוּא אִתִּי
  choice: jika didapati padaku, harus dianggap sebagai curian
  rationale: 'Bahasa Ibrani menyatakannya dengan ringkas, ''itu curian padaku''. Terjemahan ini menjelaskan implikasi hukumnya: hewan yang tidak memenuhi ciri upah Yakub akan diperhitungkan sebagai hasil curian.'
theological_decisions:
- issue: Makna צִדְקָתִי dalam pernyataan Yakub
  choice: kejujuranku
  alternative: kebenaranku; kelurusanku
  rationale: Konteks langsungnya adalah keterbukaan dan pembuktian dalam pengaturan upah. 'Kejujuran' menyampaikan nilai etis kata itu tanpa meniadakan kemungkinan harfiah 'kebenaran/kelurusan', yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah sehari-hari yang jelas dipilih untuk pengaturan upah dan corak hewan, sedangkan metafora kesaksian dalam teks Ibrani dipertahankan.
