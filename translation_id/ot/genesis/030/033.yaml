  terminology: '"Kejujuranku" tepat secara kontekstual untuk צִדְקָתִי dan alternatif yang lebih harfiah dicatat dengan baik. Pembedaan "berbintik-bintik" dan "belang" memadai untuk kedua istilah corak Ibrani. "Domba" merupakan pilihan umum yang wajar bagi כְּשָׂבִים dalam konteks kawanan.'
