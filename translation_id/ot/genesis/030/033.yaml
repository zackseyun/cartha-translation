  source_fidelity: 'Terjemahan menyampaikan struktur dan makna utama teks Ibrani dengan baik: integritas Yakub menjadi saksi baginya pada pemeriksaan mendatang; kambing tanpa corak yang disepakati dan domba tanpa warna gelap diperlakukan sebagai curian bila ditemukan padanya. "Kelak" secara tepat mempertahankan keluasan idiom בְּיוֹם מָחָר, dan "berwarna gelap" tidak terlalu mempersempit חוּם menjadi satu warna tertentu.'
