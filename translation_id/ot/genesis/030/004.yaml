  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: id
  text: Lalu Rahel memberikan Bilha, hamba perempuannya[a], kepada Yakub untuk menjadi istrinya, dan Yakub menghampiri Bilha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk kepada seorang pelayan perempuan yang berkedudukan lebih rendah; dapat juga diterjemahkan “budak perempuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Lalu ... memberikan
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: לּוֹ
  choice: kepada Yakub
  rationale: Pronomina maskulin tunggal merujuk kepada Yakub; nama disebut agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: בִּלְהָה
  choice: Bilha
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שִׁפְחָתָהּ
  choice: hamba perempuannya
  rationale: Istilah ini menunjuk kepada pelayan perempuan yang berkedudukan sosial lebih rendah. Pilihan ini mempertahankan unsur gender dan status tanpa menentukan secara berlebihan bentuk perhambaannya.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Konstruksi ini menyatakan bahwa Bilha diberikan dalam hubungan perkawinan; terjemahan ini alami dan mempertahankan fungsi relasional אִשָּׁה dalam konteks.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: bersetubuh dengan Bilha
  rationale: Ungkapan Ibrani “datang kepada” merupakan eufemisme baku untuk hubungan seksual. Terjemahan maknawi ini jelas bagi pembaca modern dan tidak membiarkan idiom Ibrani disalahpahami secara harfiah.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama pribadi menggunakan bentuk baku bahasa Indonesia.
theological_decisions:
- issue: Status hubungan Bilha dengan Yakub
  choice: untuk menjadi istrinya
  alternative: sebagai gundiknya
  rationale: Teks memakai אִשָּׁה, “perempuan/istri,” bukan istilah khusus untuk gundik. Karena itu, terjemahan tidak mengganti sebutan teks dengan kategori relasional lain meskipun konteks sosialnya tidak sama dengan perkawinan modern.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Nama Rahel dan Bilha diulang untuk menghindari pronomina yang dapat terasa kabur. Eufemisme Ibrani diterjemahkan menurut maknanya agar jelas bagi pembaca modern.
