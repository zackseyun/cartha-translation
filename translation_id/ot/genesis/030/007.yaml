  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: id
  text: Bilha, budak perempuan Rahel, kembali mengandung dan melahirkan seorang anak laki-laki kedua bagi Yakub.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Verba הרה menyatakan menjadi hamil atau mengandung; dalam urutan kisah kelahiran ini, “mengandung” alami dan ringkas.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini עוֹד menandai pengulangan peristiwa.
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk qal ילד dengan objek berarti melahirkan; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: שִׁפְחַת
  choice: hamba perempuan
  rationale: שִׁפְחָה menunjuk perempuan berstatus hamba atau budak. “Hamba perempuan” mempertahankan status sosial yang rendah dan terikat tanpa memakai ungkapan yang terdengar terlalu teknis.
- source_word: בֵּן שֵׁנִי
  choice: anak laki-laki kedua
  rationale: Ungkapan ini secara langsung berarti anak laki-laki yang kedua.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi לְ menyatakan relasi atau peruntukan; “bagi Yakub” mempertahankan nuansa gramatikal itu dengan wajar.
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: Bilha, hamba perempuan Rahel,
  rationale: Susunan aposisional Ibrani mengidentifikasi Bilha melalui kedudukannya terhadap Rahel; tanda koma menjadikannya jelas dalam bahasa Indonesia.
