base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: id
  text: Maka kawanan itu kawin di depan batang-batang tersebut, lalu melahirkan anak-anak yang berbelang[a], berbintik-bintik[b], dan bertompok-tompok.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bergaris”; arti עֲקֻדִּים berkaitan dengan tanda berupa belang, jalur, atau gelang.
    reason: lexical_alternative
  - marker: b
    text: Perbedaan antara “berbintik-bintik” (נְקֻדִּים) dan “bertompok-tompok” (טְלֻאִים) bersifat perkiraan; kata yang kedua juga dapat diterjemahkan “berbercak-bercak” atau “belang-belang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: kawin
  rationale: Dalam konteks pembiakan ternak, verba יחם menunjuk pada keadaan berahi dan tindakan kawin. 'Kawin' menyampaikan tindakan reproduktif secara jelas tanpa mengharuskan makna 'mengandung'.
- source_word: הַצֹּאן
  choice: kawanan itu
  rationale: צאן adalah nomina kolektif bagi ternak kecil, terutama domba dan kambing. 'Kawanan itu' mempertahankan sifat kolektifnya; pada klausa kedua subjeknya tersirat secara alami dalam bahasa Indonesia.
- source_word: אֶל הַמַּקְלוֹת
  choice: di depan batang-batang tersebut
  rationale: Walaupun אֶל biasanya berarti 'ke/ke arah', konteks penempatan batang-batang sebagai objek yang terlihat oleh ternak mendukung pengertian situasional 'di depan'. Bentuk jamak 'batang-batang' mencerminkan הַמַּקְלוֹת.
- source_word: וַתֵּלַדְןָ
  choice: melahirkan anak-anak
  rationale: Verba ילד berarti melahirkan. Karena teks Ibrani langsung memberikan kata-kata sifat tanpa nomina eksplisit bagi keturunannya, 'anak-anak' ditambahkan agar kalimat alami dan jelas.
- source_word: עֲקֻדִּים
  choice: berbelang
  rationale: Istilah ini menggambarkan tanda berupa jalur atau gelang pada tubuh hewan. 'Berbelang' merupakan padanan Indonesia yang alami, sementara alternatif 'bergaris' dicatat dalam catatan kaki.
- source_word: נְקֻדִּים
  choice: berbintik-bintik
  rationale: Kata ini menunjuk pada tanda-tanda kecil seperti titik atau bintik. Pilihan ini membantu membedakannya dari טְלֻאִים.
- source_word: וּטְלֻאִים
  choice: bertompok-tompok
  rationale: Kata ini menunjuk pada corak berupa bercak atau bidang warna yang lebih besar. 'Bertompok-tompok' mempertahankan perbedaan perkiraan dengan 'berbintik-bintik'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Pengulangan eksplisit 'kawanan itu' pada klausa kedua tidak dipertahankan karena terdengar kaku dalam bahasa Indonesia, tetapi kesinambungan subjek tetap jelas. Penanda catatan kaki ditempatkan langsung sesudah istilah yang diterangkan.
