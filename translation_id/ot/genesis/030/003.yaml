  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: id
  text: Lalu Rahel berkata, “Inilah Bilha, hamba perempuanku. Tidurlah dengannya, agar ia melahirkan di pangkuanku[a] dan aku pun memperoleh keturunan melalui dia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melahirkan di atas lututku”. Ungkapan ini mungkin mengacu pada kebiasaan budaya yang dengannya anak yang dilahirkan oleh seorang hamba perempuan diterima secara simbolis sebagai anak sang istri.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “aku pun dibangun melalui dia”. Bahasa Ibrani memakai metafora tentang terbentuknya atau berkembangnya keluarga melalui keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: hambaku
  rationale: Kata אמה menunjuk kepada seorang hamba perempuan. Dalam konteks ini, “hambaku” ringkas, wajar, dan tetap menyatakan kedudukan sosial Bilha tanpa memakai istilah yang terasa kuno.
- source_word: בֹּא אֵלֶיהָ
  choice: Hampirilah dia
  rationale: Ungkapan Ibrani ini merupakan eufemisme baku untuk hubungan seksual. “Hampirilah dia” mempertahankan sifat eufemistis dan terdengar lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “masuklah kepadanya”.
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: supaya dia melahirkan di atas lututku
  rationale: Terjemahan ini mempertahankan gambaran budaya yang khas dan kemungkinan tindakan simbolis menerima anak hamba itu sebagai anak Rahel; catatan kaki menjelaskannya tanpa menghapus ungkapan sumber.
- source_word: וְאִבָּנֶה
  choice: aku pun dibangun
  rationale: Bentuk pasif dari בנה secara harfiah berarti “dibangun” dan di sini menjadi metafora bagi terbentuk atau berkembangnya keluarga melalui keturunan. Metafora sumber dipertahankan dan maknanya dijelaskan dalam catatan kaki.
- source_word: מִמֶּנָּה
  choice: melalui dia
  rationale: Preposisi ini menunjukkan Bilha sebagai perantara yang melaluinya Rahel berharap memperoleh keturunan dan membangun keluarganya.
- source_word: גַם אָנֹכִי
  choice: aku pun
  rationale: Ungkapan ini menekankan bahwa Rahel juga berharap ikut memperoleh hasil tersebut meskipun ia sendiri mandul.
theological_decisions:
- issue: Status anak yang dilahirkan Bilha dan metafora keluarga
  choice: Mempertahankan “melahirkan di atas lututku” dan “aku pun dibangun” dalam teks utama
  alternative: Menafsirkan langsung sebagai “supaya anak itu menjadi anakku dan aku memperoleh keturunan melalui dia”
  rationale: Teks Ibrani memakai ungkapan budaya dan metafora yang tidak sepenuhnya dijelaskan. Mempertahankannya menghindari penetapan mekanisme hukum atau teologis yang lebih khusus daripada yang dinyatakan teks, sementara catatan kaki memberi penjelasan yang diperlukan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama WLC בלה ditulis “Bilha” menurut bentuk yang lazim dalam Alkitab bahasa Indonesia. Eufemisme hubungan seksual dan kedua gambaran khas Ibrani dipertahankan sejauh tetap dapat dipahami, dengan catatan kaki untuk konteks budaya dan makna idiomatis.
