  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: id
  text: Lalu Rahel berkata, “Dengan pergulatan Allah[a] aku telah bergulat dengan saudara perempuanku, dan aku pun menang.” Maka ia menamai anak itu Naftali.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan pergulatan-pergulatan Allah.” Ungkapan Ibrani ini dapat berarti “dengan pergulatan ilahi” atau, sebagai ungkapan penguat, “dengan pergulatan yang dahsyat.”'
    reason: lexical_alternative
  - marker: b
    text: Nama Naftali berkaitan bunyi dengan kata Ibrani yang diterjemahkan “bergulat.”
    reason: wordplay
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: dengan pergulatan Allah
  rationale: Terjemahan ini mempertahankan bentuk konstruksi Ibrani yang tidak biasa dan tidak menutup kemungkinan bahwa אֱלֹהִים menunjuk langsung kepada Allah, menyatakan sifat ilahi, atau berfungsi sebagai penguat bermakna ‘dahsyat’.
- source_word: נִפְתַּלְתִּי
  choice: aku telah bergulat
  rationale: ‘Bergulat’ mempertahankan gambaran konkret serta permainan kata dengan נַפְתָּלִי (Naftali).
- source_word: עִם אֲחֹתִי
  choice: dengan saudara perempuanku
  rationale: Menerjemahkan עִם secara langsung sebagai ‘dengan’; nuansa persaingannya sudah tampak dari kata ‘bergulat’ dan konteks.
- source_word: גַּם יָכֹלְתִּי
  choice: dan aku pun menang
  rationale: Dalam konteks persaingan ini, יכל menyatakan keberhasilan atau kemenangan, bukan sekadar kemampuan.
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: Maka ia menamai anak itu Naftali
  rationale: Ungkapan Indonesia yang alami untuk formula pemberian nama, dengan ‘anak itu’ memperjelas rujukan pronomina maskulin Ibrani tanpa menambah tafsiran teologis.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia; catatan kaki menjelaskan permainan katanya dengan akar נפתל.
theological_decisions:
- issue: Apakah אֱלֹהִים menyebut Allah secara langsung atau berfungsi sebagai penguat
  choice: Mempertahankan ungkapan harfiah ‘pergulatan Allah’ dalam teks dan menjelaskan ambiguitasnya dalam catatan kaki
  alternative: ‘pergulatan ilahi’ atau ‘pergulatan yang dahsyat’
  rationale: Susunan Ibrani memungkinkan lebih dari satu pemahaman. Terjemahan utama tidak seharusnya diam-diam menentukan salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘pergulatan Allah’ sengaja dipertahankan sebagai ungkapan tidak biasa karena mencerminkan ambiguitas teks Ibrani; catatan kaki memberi kemungkinan maknanya. ‘Menang’ dipilih daripada ‘berhasil mengatasi’ agar wajar bagi pembaca umum dan sesuai dengan konteks persaingan.
