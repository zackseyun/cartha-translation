base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/012.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: id
  text: Kemudian Zilpa, hamba perempuan Lea,[a] melahirkan anak laki-laki kedua bagi Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak perempuan Lea.” Kata Ibrani ini secara khusus menunjuk kepada seorang hamba atau budak perempuan yang menjadi milik atau berada di bawah kuasa Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: Kemudian ... melahirkan
  rationale: Bentuk wayyiqtol dari ילד melanjutkan rangkaian peristiwa dalam narasi; “kemudian” menandai urutan tersebut secara alami, dan “melahirkan” merupakan padanan Indonesia yang langsung.
- source_word: זִלְפָּה
  choice: Zilpa
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שִׁפְחַת לֵאָה
  choice: hamba perempuan Lea
  rationale: Frasa konstruksi ini menunjukkan status Zilpa dalam hubungan dengan Lea. “Hamba perempuan” mempertahankan unsur gender dan status ketergantungan dalam שִׁפְחָה tanpa menentukan secara berlebihan nuansa hukumnya.
- source_word: בֵּן שֵׁנִי
  choice: anak laki-laki kedua
  rationale: Padanan ini mempertahankan arti harfiah bahwa inilah anak laki-laki kedua yang dilahirkan Zilpa bagi Yakub.
- source_word: לְיַעֲקֹב
  choice: bagi Yakub
  rationale: Preposisi ל menandai Yakub sebagai ayah atau pihak yang menerima anak dalam rumusan kelahiran; “bagi Yakub” mempertahankan relasi itu secara wajar dalam bahasa Indonesia.
