base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: id
  text: Lalu Lea berkata, “Allah telah mengaruniakan kepadaku karunia yang baik. Kali ini suamiku akan menghormati aku[a], karena aku telah melahirkan enam anak laki-laki baginya.” Maka ia menamai anak itu Zebulon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan tinggal bersamaku.” Kata kerja Ibrani ini langka dan berkaitan melalui permainan bunyi dengan nama Zebulon; maknanya mungkin mencakup gagasan menghormati maupun tinggal atau tetap bersama Lea.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב
  choice: Allah telah mengaruniakan kepadaku karunia yang baik
  rationale: Ungkapan ini mempertahankan pengulangan akar זבד melalui pasangan ‘mengaruniakan–karunia’, sekaligus tetap wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: הַפַּעַם
  choice: Sekarang
  rationale: Dalam konteks ucapan Lea setelah kelahiran ini, ‘Sekarang’ secara alami menyatakan harapannya bahwa keadaan akan berubah kali ini.
- source_word: יִזְבְּלֵנִי
  choice: akan menghormati aku
  rationale: Kata kerja Ibrani ini langka dan maknanya tidak pasti. ‘Menghormati aku’ cocok dengan harapan Lea akan perubahan sikap suaminya, sedangkan kemungkinan ‘akan tinggal bersamaku’ dipertahankan dalam catatan kaki.
- source_word: אִישִׁי
  choice: suamiku
  rationale: Dalam konteks perkawinan, ini merupakan padanan Indonesia yang jelas dan alami.
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: aku telah melahirkan enam anak laki-laki baginya
  rationale: Terjemahan ini mempertahankan tindakan melahirkan, jumlah anak, dan unsur tidak langsung לוֹ, ‘baginya’.
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: Maka ia menamai anak itu Zebulon
  rationale: Bentuk ini menyampaikan rumus penamaan Ibrani dengan bahasa Indonesia yang alami. ‘Zebulon’ mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
