  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: id
  text: Lalu ia memberinya nama Yusuf[a], katanya, “Kiranya Yahweh menambahkan seorang anak laki-laki lagi bagiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yusuf terdengar seperti kata kerja Ibrani yang berarti “kiranya ia menambahkan” atau “ia menambahkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: Lalu ia menamai anak itu
  rationale: Ungkapan Ibrani harfiah ‘memanggil namanya’ merupakan rumus pemberian nama. Dalam bahasa Indonesia modern, ‘menamai anak itu’ menyampaikan tindakan tersebut secara alami tanpa mengaburkan hubungan dengan nama Yusuf.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Menggunakan bentuk baku nama tokoh ini dalam tradisi dan bahasa Indonesia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Memperkenalkan ucapan langsung secara ringkas dan alami sebagai padanan penanda kutipan Ibrani.
- source_word: יֹסֵף
  choice: Kiranya ... menambahkan
  rationale: Bentuk hiphil dari יסף berarti ‘menambah’. Dalam konteks penamaan ini, bentuk tersebut paling wajar dipahami sebagai harapan atau doa, sekaligus mempertahankan permainan bunyi dengan nama Yusuf.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: לִי
  choice: bagiku
  rationale: Preposisi ל dapat menandai kepentingan atau penerima manfaat; ‘bagiku’ alami dalam permohonan ini.
- source_word: בֵּן אַחֵר
  choice: seorang anak laki-laki lagi
  rationale: 'בן secara khusus berarti anak laki-laki, sedangkan אחר dalam konteks ini menyatakan tambahan: satu lagi.'
theological_decisions:
- issue: Cara menerjemahkan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat nama ilahi YHWH secara langsung. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa verbal יֹסֵף
  choice: 'Harapan atau doa: ‘Kiranya ... menambahkan’'
  alternative: 'Pernyataan: ‘Yahweh akan menambahkan’ atau ‘Yahweh telah menambahkan’'
  rationale: Konteks ucapan Rahel sesudah penamaan mendukung nuansa keinginan mengenai kelahiran anak berikutnya. Namun, bentuk Ibrani tanpa penandaan modal yang eksplisit memungkinkan nuansa pernyataan; ketegangan ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Anak laki-laki’ dipakai untuk mempertahankan kekhususan makna בֵּן, sedangkan ‘lagi’ menghasilkan susunan yang alami. Permainan kata Ibrani tidak dapat dipertahankan sepenuhnya dalam teks utama sehingga dijelaskan melalui catatan kaki.
