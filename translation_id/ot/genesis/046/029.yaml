  text: וַ/יֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔/וֹ וַ/יַּ֛עַל לִ/קְרַֽאת יִשְׂרָאֵ֥ל אָבִ֖י/ו גֹּ֑שְׁנָ/ה וַ/יֵּרָ֣א אֵלָ֗י/ו וַ/יִּפֹּל֙ עַל צַוָּארָ֔י/ו וַ/יֵּ֥בְךְּ עַל צַוָּארָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: id
  text: Lalu Yusuf menyiapkan keretanya dan pergi menemui Israel, ayahnya, di Gosyen. Ia menampakkan diri kepadanya,[a] lalu memeluk leher ayahnya dan menangis lama dalam pelukannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “tampil di hadapannya” atau “memperlihatkan diri kepadanya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jatuh pada lehernya dan menangis pada lehernya terus.” Kata Ibrani terakhir dapat berarti “lagi,” “masih,” atau “terus”; dalam konteks ini, kemungkinan besar kata itu menunjukkan bahwa Yusuf menangis berkepanjangan sambil memeluk ayahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: memasang kuda pada keretanya
  rationale: Kata אָסַר secara harfiah berarti 'mengikat'; ketika berobjek kereta, ungkapan ini menunjuk pada menyiapkan kereta dengan memasang atau menambatkan kudanya. Bentuk ini mempertahankan gambaran konkret dan alami dalam bahasa Indonesia.
- source_word: וַיַּעַל לִקְרַאת
  choice: pergi menemui
  rationale: Walaupun עָלָה secara harfiah dapat berarti 'naik/pergi naik', di sini arah geografis tidak menjadi pokok dan terjemahan harfiah 'naik' terasa janggal. 'Pergi menemui' menyampaikan gerak dan tujuan dengan wajar.
- source_word: יִשְׂרָאֵל אָבִיו
  choice: Israel, ayahnya
  rationale: Nama Israel dipertahankan sebagaimana teks Ibrani, tanpa menggantinya dengan Yakub; aposisi 'ayahnya' dibuat alami dalam bahasa Indonesia.
- source_word: גֹּשְׁנָה
  choice: di Gosyen
  rationale: Akhiran penunjuk arah dapat mendukung arti 'ke Gosyen', tetapi dalam susunan ini frasa tersebut juga secara alami menunjukkan lokasi pertemuan. 'Di Gosyen' menghasilkan kalimat Indonesia yang jelas.
- source_word: וַיֵּרָא אֵלָיו
  choice: menampakkan diri kepadanya
  rationale: Bentuk nifal dari ראה menyatakan bahwa Yusuf membuat dirinya terlihat atau hadir di hadapan ayahnya. Pilihan ini mempertahankan bentuk ungkapan Ibrani dan ambiguitasnya tanpa memberi kesan penampakan adikodrati dalam konteks ini.
- source_word: וַיִּפֹּל עַל־צַוָּארָיו
  choice: memeluk leher ayahnya
  rationale: Secara harfiah, 'jatuh pada lehernya'; ini idiom Ibrani untuk pelukan emosional. Terjemahan idiomatis menghindari kesan bahwa Yusuf benar-benar terjatuh, sementara unsur 'leher' dipertahankan.
- source_word: וַיֵּבְךְּ עַל־צַוָּארָיו עוֹד
  choice: lama menangis dalam pelukannya
  rationale: Pengulangan 'pada lehernya' dan kata עוֹד menggambarkan tangisan yang berlanjut selama pelukan. Bahasa Indonesia alami mengungkapkannya sebagai tangisan lama dalam pelukan, dengan catatan kaki untuk bentuk harfiah dan kemungkinan nuansa עוֹד.
