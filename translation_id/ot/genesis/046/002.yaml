base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: id
  text: Allah berfirman kepada Israel dalam penglihatan-penglihatan pada malam hari dan berfirman, “Yakub, Yakub!” Ia menjawab, “Aku di sini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman / kata-Nya / menjawab
  rationale: Kata kerja אמר berarti ‘berkata’. Dalam konteks Allah, ‘berfirman’ sesuai dengan ragam Alkitab Indonesia; kemunculan kedua diterjemahkan ‘kata-Nya’ untuk memperkenalkan sapaan langsung, sedangkan kemunculan ketiga diterjemahkan ‘menjawab’ karena perkataan Yakub jelas merupakan tanggapan. Perbedaan ini membuat bahasa alami tanpa mengubah alur ujaran.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang esa dan digunakan dengan pengertian tunggal. ‘Allah’ adalah padanan baku dan alami dalam bahasa Indonesia.
- source_word: לְיִשְׂרָאֵל
  choice: kepada Israel
  rationale: Teks secara eksplisit memakai nama Israel dalam narasi. Nama ini dipertahankan dan tidak diselaraskan dengan sapaan ‘Yakub’ berikutnya.
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: dalam penglihatan-penglihatan pada malam hari
  rationale: Bentuk jamak מַרְאֹת dipertahankan sebagai ‘penglihatan-penglihatan’, dan הַלַּיְלָה menyatakan waktu atau suasana malam. Ungkapan ini alami serta tetap dekat dengan struktur Ibrani.
- source_word: יַעֲקֹב יַעֲקֹב
  choice: Yakub, Yakub
  rationale: Pengulangan nama dipertahankan untuk menyampaikan tekanan dan sifat pribadi dalam panggilan Allah.
- source_word: הִנֵּנִי
  choice: Ya, aku di sini
  rationale: הִנֵּנִי merupakan jawaban konvensional yang menyatakan kehadiran dan kesiapsediaan. ‘Ya, aku di sini’ menyampaikan fungsi responsif itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pergantian nama Israel dan Yakub
  choice: Mempertahankan ‘Israel’ dalam narasi dan ‘Yakub’ dalam sapaan Allah
  alternative: Menyeragamkan keduanya menjadi ‘Yakub’ atau ‘Israel’
  rationale: Pergantian nama terdapat dalam teks Ibrani dan mungkin memiliki bobot sastra atau teologis. Terjemahan mempertahankannya tanpa memberikan penafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Berfirman’ mempertahankan register Alkitab yang lazim bagi perkataan Allah. Susunan kalimat menjaga dua verba ujaran dalam teks sumber, tetapi memakai ‘kata-Nya’ dan ‘menjawab’ agar tidak terasa kaku.
