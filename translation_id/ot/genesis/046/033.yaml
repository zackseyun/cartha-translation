  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: id
  text: Ketika Firaun memanggil kalian dan berkata, “Apa pekerjaan kalian?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Ungkapan Ibrani ini memperkenalkan keadaan yang akan terjadi. Dalam bahasa Indonesia, “Ketika” menyampaikan fungsi temporalnya secara alami tanpa mempertahankan idiom “dan akan terjadi bahwa” secara kaku.
- source_word: יִקְרָא לָכֶם
  choice: memanggil kalian
  rationale: Kata קרא dengan ל dapat berarti memanggil atau menyuruh datang. “Memanggil kalian” tetap dekat dengan bentuk Ibrani dan sesuai dengan konteks istana.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: וְאָמַר
  choice: dan berkata
  rationale: Terjemahan ini mempertahankan verba umum אמר tanpa mengubahnya menjadi verba yang lebih interpretatif seperti “bertanya”; bentuk kini dalam anak kalimat temporal terdengar alami dalam bahasa Indonesia.
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: Apa pekerjaan kalian?
  rationale: Dalam konteks ini, מַעֲשֵׂיכֶם menunjuk pada pekerjaan atau mata pencaharian. “Pekerjaan” merupakan padanan modern yang jelas, umum, dan tidak terlalu sempit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Pronomina jamak “kalian” dipakai untuk memperjelas bahwa bentuk Ibraninya jamak. Konjungsi pembuka tidak dipertahankan karena “Ketika” sudah menghubungkan ayat ini secara alami dengan kelanjutan tuturan sebelumnya.
