  text: כָּל הַ֠/נֶּפֶשׁ הַ/בָּאָ֨ה לְ/יַעֲקֹ֤ב מִצְרַ֨יְמָ/ה֙ יֹצְאֵ֣י יְרֵכ֔/וֹ מִ/לְּ/בַ֖ד נְשֵׁ֣י בְנֵי יַעֲקֹ֑ב כָּל נֶ֖פֶשׁ שִׁשִּׁ֥ים וָ/שֵֽׁשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: id
  text: Semua orang yang datang bersama Yakub ke Mesir, yakni keturunan biologisnya[a], tidak termasuk istri anak-anak Yakub, seluruhnya berjumlah enam puluh enam orang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka yang keluar dari pahanya,” sebuah ungkapan Ibrani untuk keturunan biologis.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “orang” secara harfiah dapat berarti “jiwa” atau “nyawa”; di sini kata itu dipakai untuk menghitung orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: Semua orang
  rationale: Dalam konteks silsilah dan penghitungan, נֶפֶשׁ menunjuk kepada orang, bukan hanya unsur batin yang disebut “jiwa”.
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: yang termasuk keluarga Yakub dan datang ke Mesir
  rationale: Ungkapan ini mengidentifikasi orang-orang dari pihak atau rumah tangga Yakub yang datang ke Mesir. Pilihan ini mencerminkan hubungan yang ditandai לְ tanpa membatasinya secara tegas pada tindakan menemani Yakub secara fisik.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: keturunan kandungnya
  rationale: Secara harfiah ungkapan ini berarti mereka yang keluar dari paha Yakub, sebuah idiom Ibrani bagi keturunan biologis. “Keturunan kandungnya” menyampaikan maksud idiom itu dengan jelas dalam bahasa Indonesia modern.
- source_word: מִלְּבַד
  choice: tidak termasuk
  rationale: Kata ini menandai kelompok yang dikecualikan dari jumlah enam puluh enam.
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: istri anak-anak Yakub
  rationale: Bentuk ini jelas dan alami serta mempertahankan hubungan kepemilikan dalam frasa Ibrani.
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: seluruhnya berjumlah enam puluh enam orang
  rationale: Rumusan ini menyajikan jumlah keseluruhan secara alami sambil menerjemahkan נֶפֶשׁ secara konsisten sebagai “orang”.
