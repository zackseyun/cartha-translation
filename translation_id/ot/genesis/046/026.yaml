- from: Semua orang yang termasuk keluarga Yakub dan datang ke Mesir, yaitu keturunan kandungnya[a], tidak termasuk istri anak-anak Yakub, seluruhnya berjumlah enam puluh enam orang.[b]
  to: Semua orang yang datang bersama Yakub ke Mesir, yakni keturunan biologisnya[a], tidak termasuk istri anak-anak Yakub, seluruhnya berjumlah enam puluh enam orang[b].
  rationale: Revisi mengganti istilah “keluarga” yang terlalu luas dengan “datang bersama Yakub,” selaras dengan pembacaan kontekstual frasa Ibrani, dan memakai “keturunan biologisnya” untuk idiom “yang keluar dari pahanya.” Penanda catatan b juga dipindahkan agar menempel pada kata “orang” yang dijelaskannya. Pengecualian para istri dan jumlah enam puluh enam dipertahankan.
