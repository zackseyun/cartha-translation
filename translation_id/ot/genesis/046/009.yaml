  yaml_path: translation/ot/genesis/046/009.yaml
  text: 'And the sons of Reuben: Hanoch[a], Pallu, Hezron, and Carmi.'
translation:
  language: id
  text: Anak-anak Ruben ialah Henokh[a], Palu, Hezron, dan Karmi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Hanokh; nama ini juga sering ditulis Henokh dalam bahasa Indonesia.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus בְנֵי diterjemahkan secara wajar sebagai “anak-anak ...”. Dalam konteks daftar silsilah, kopula “ialah” memperkenalkan nama-nama dengan jelas. Konjungsi וּ melanjutkan daftar, tetapi tidak perlu dinyatakan dengan “dan” pada awal kalimat dalam bahasa Indonesia.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: “Ruben” adalah bentuk nama yang sudah mapan dalam tradisi Alkitab bahasa Indonesia dan mewakili nama Ibrani רְאוּבֵן secara jelas.
- source_word: חֲנוֹךְ
  choice: Henokh
  rationale: “Henokh” mengikuti bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia, sambil mempertahankan bunyi akhir kh dari nama Ibrani.
- source_word: וּ/פַלּוּא
  choice: Palu
  rationale: Nama פַלּוּא ditransliterasikan secara alami menurut ejaan Indonesia sebagai “Palu”; konjungsi prefiksnya diwakili oleh struktur daftar.
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: “Hezron” adalah bentuk transliterasi yang mapan dalam penggunaan Alkitab bahasa Indonesia; konjungsi prefiksnya diserap ke dalam tanda baca daftar.
- source_word: וְ/כַרְמִי
  choice: Karmi
  rationale: “Karmi” menyesuaikan huruf awal nama dengan ejaan Indonesia; konjungsi prefiks diterjemahkan sebagai “dan” sebelum unsur terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa silsilah dibuat ringkas, formal, dan alami bagi pembaca Indonesia modern. Nama-nama memakai bentuk yang lazim dalam Alkitab bahasa Indonesia, dengan catatan untuk bentuk transliterasi yang lebih langsung pada חֲנוֹךְ.
