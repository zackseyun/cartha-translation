revisions:
- from: Inilah anak-anak lelaki Lea yang dilahirkannya bagi Yakub di Padan-Aram, juga Dina, anak perempuan Yakub. Jumlah seluruh anak laki-laki dan anak perempuan Yakub itu tiga puluh tiga orang.[a]
  to: Inilah anak-anak lelaki Lea yang ia lahirkan bagi Yakub di Padan-Aram, juga Dina, anak perempuan Yakub. Jumlah seluruh orang dari anak-anak lelaki dan anak-anak perempuan Yakub itu tiga puluh tiga.[a]
  rationale: Revisi ini memperjelas Lea sebagai pelaku “melahirkan” dan menata klausa jumlah agar lebih setia kepada idiom penghitungan Ibrani serta tetap wajar dalam bahasa Indonesia. Angka tiga puluh tiga dipertahankan tanpa upaya menyelesaikan ketegangan penghitungan dalam daftar silsilah.
