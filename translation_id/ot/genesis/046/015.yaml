base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: id
  text: Inilah anak-anak lelaki Lea yang ia lahirkan bagi Yakub di Padan-Aram, juga Dina, anak perempuan Yakub. Jumlah seluruh orang dari anak-anak lelaki dan anak-anak perempuan Yakub itu tiga puluh tiga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh jiwa dari anak-anak lelakinya dan anak-anak perempuannya”; dalam konteks ini, “jiwa” adalah idiom Ibrani untuk orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: anak-anak lelaki Lea
  rationale: בְּנֵי secara eksplisit berbentuk maskulin jamak dan menjadi judul silsilah; karena itu diterjemahkan sebagai “anak-anak lelaki”, bukan istilah umum “anak-anak” atau “keturunan”.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: yang dilahirkannya bagi Yakub
  rationale: Dengan subjek perempuan, יָלַד berarti melahirkan. Ungkapan “bagi Yakub” mempertahankan hubungan gramatikal dengan לְיַעֲקֹב secara wajar dalam bahasa Indonesia.
- source_word: בְּפַדַּן אֲרָם
  choice: di Padan-Aram
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan.
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: juga Dina, anak perempuan Yakub
  rationale: “Juga” menyatakan bahwa Dina ditambahkan sesudah judul “anak-anak lelaki Lea”. Nama Yakub diulang untuk memperjelas acuan pronomina tanpa mengubah makna.
- source_word: כָּל נֶפֶשׁ
  choice: jumlah seluruh ... orang
  rationale: Dalam konteks penghitungan silsilah, נֶפֶשׁ menunjuk kepada orang, bukan kepada “jiwa” sebagai konsep teologis. Bentuk idiomatis Indonesia menyatakan jumlah keseluruhan.
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: anak laki-laki dan anak perempuan Yakub
  rationale: Pembedaan eksplisit antara anak laki-laki dan anak perempuan dipertahankan; acuan sufiks orang ketiga diperjelas sebagai Yakub.
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: tiga puluh tiga
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
theological_decisions:
- issue: Ketegangan antara jumlah tiga puluh tiga dan nama-nama yang tercantum dalam kelompok Lea
  choice: Mempertahankan angka “tiga puluh tiga” tanpa menyelaraskan atau menjelaskan cara penghitungannya di dalam teks utama.
  alternative: Mengubah angka atau menambahkan anggota tertentu secara eksplisit agar jumlah daftar tampak selaras.
  rationale: Teks Masoret secara jelas menyatakan tiga puluh tiga. Terjemahan harus mempertahankan data dan ketegangan tekstual yang ada, bukan menyelesaikannya melalui dugaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anak-anak lelaki” dipakai pada awal ayat untuk mengikuti judul silsilah Ibrani, sedangkan “anak laki-laki dan anak perempuan” dipakai dalam pernyataan jumlah agar terdengar alami dan tetap mempertahankan kedua kategori dalam sumber.
