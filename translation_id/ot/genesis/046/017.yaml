base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: id
  text: Putra-putra Asyer ialah Yimna[a], Yiswa, Yiswi, dan Beria; dan Serah, saudara perempuan mereka[b]. Putra-putra Beria ialah Heber dan Malkiel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yimna juga ditulis Jimna dalam sejumlah terjemahan.
    reason: lexical_alternative
  - marker: b
    text: Nama Serah juga dapat ditransliterasikan Serakh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: Anak-anak Asyer ialah
  rationale: בְּנֵי secara harfiah berarti 'anak-anak lelaki', tetapi dalam daftar silsilah bahasa Indonesia, 'anak-anak' terdengar alami dan tetap tepat karena nama-nama lelaki disebutkan lalu saudara perempuan mereka dicatat tersendiri. Kopula 'ialah' memperjelas struktur daftar tanpa mengubah isinya.
- source_word: יִמְנָה
  choice: Yimna
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani; yod awal direpresentasikan dengan Y sesuai kebiasaan ejaan Indonesia.
- source_word: וְיִשְׁוָה
  choice: Yiswa
  rationale: Transliterasi yang disesuaikan dengan ejaan Indonesia; שׁ diwakili oleh sy dan bunyi akhir ה tidak dipaksakan sebagai konsonan tersendiri.
- source_word: וְיִשְׁוִי
  choice: Yiswi
  rationale: Nama diri ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia sambil mempertahankan perbedaan dari Yiswa.
- source_word: וּבְרִיעָה
  choice: dan Beria
  rationale: Nama diri ditransliterasikan secara wajar dalam bahasa Indonesia, dan konjungsi dipertahankan sebagai penghubung unsur terakhir daftar.
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: juga Serah, saudara perempuan mereka
  rationale: Frasa Ibrani bersifat aposisional, secara harfiah 'dan Serah, saudara perempuan mereka'. 'Juga' menyambungkan catatan tentang Serah dengan lancar tanpa menambahkan kata kerja yang tidak terdapat dalam sumber.
- source_word: וּבְנֵי בְרִיעָה
  choice: Anak-anak Beria ialah
  rationale: Ini membuka subdaftar baru. Bahasa Indonesia tidak memerlukan 'dan' pada awal kalimat, sedangkan 'ialah' membuat susunan genealogis jelas.
- source_word: חֶבֶר
  choice: Heber
  rationale: Nama diri dipertahankan dalam bentuk transliterasi Alkitabiah yang lazim dan mudah dikenali.
- source_word: וּמַלְכִּיאֵל
  choice: dan Malkiel
  rationale: Nama ditransliterasikan dengan khaf sebagai k dalam ejaan Indonesia yang sederhana; konjungsi waw diterjemahkan 'dan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas dengan susunan daftar silsilah yang jelas. Nama-nama ditransliterasikan menurut kebiasaan bunyi dan ejaan Indonesia, bukan disalin dari bentuk Inggris. Aposisi 'saudara perempuan mereka' dipertahankan tanpa menyisipkan kata kerja agar dekat dengan struktur Ibrani.
