  - severity: low
    issue: “Nenek moyang kami” dapat diringkaskan menjadi “leluhur kami.”
    rationale: אָבוֹת secara idiomatis mengacu pada leluhur/para pendahulu dalam garis keturunan. “Leluhur” lebih alami dalam konstruksi ini dan tetap mempertahankan kesinambungan antargenerasi.
  revised_text: maka katakanlah, ‘Hamba-hambamu telah beternak sejak masa muda kami sampai sekarang, baik kami maupun leluhur kami,’ supaya kalian dapat tinggal di tanah Gosyen, sebab setiap gembala dianggap menjijikkan oleh orang Mesir.
