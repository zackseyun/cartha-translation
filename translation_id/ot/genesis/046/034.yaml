  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: id
  text: maka katakanlah, ‘Hamba-hambamu telah beternak sejak masa muda kami sampai sekarang, baik kami maupun leluhur kami,’ supaya kalian dapat tinggal di tanah Gosyen, sebab setiap gembala dianggap menjijikkan oleh orang Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: maka katakanlah
  rationale: Waw dengan bentuk perfektif melanjutkan rangkaian petunjuk Yusuf; bentuk ini menyampaikan urutan sekaligus daya perintah secara wajar.
- source_word: אַנְשֵׁי מִקְנֶה
  choice: telah beternak
  rationale: Ungkapan ini menunjuk pada orang yang pekerjaannya memelihara ternak. Bentuk verbal alami dalam bahasa Indonesia dan tidak membatasi jenis ternaknya.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam percakapan dengan Firaun, istilah ini merupakan sebutan diri yang merendah dan tidak perlu dipahami sebagai penegasan status perbudakan.
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: sejak masa muda kami sampai sekarang
  rationale: Menyampaikan rentang waktu yang dimulai pada masa muda dan berlanjut hingga saat berbicara.
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: baik kami maupun nenek moyang kami
  rationale: Pasangan 'baik ... maupun ...' mempertahankan penekanan גַּם ... גַּם; 'nenek moyang' wajar untuk para leluhur laki-laki dalam konteks kesinambungan pekerjaan lintas generasi.
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: supaya kalian dapat tinggal
  rationale: בַּעֲבוּר menyatakan tujuan, sedangkan ישׁב di sini berarti tinggal atau menetap di suatu wilayah.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Mempertahankan unsur אֶרֶץ secara alami dalam bahasa Indonesia.
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: dianggap menjijikkan oleh orang Mesir
  rationale: Konstruksi Ibrani menyatakan penilaian sangat negatif dari pihak Mesir; bentuk ini jelas, kuat, dan alami tanpa menjadikannya penilaian narator.
- source_word: כָּל רֹעֵה צֹאן
  choice: setiap gembala kambing domba
  rationale: צֹאן menunjuk pada ternak kecil, terutama domba dan kambing. 'Gembala kambing domba' mempertahankan cakupan tersebut tanpa redundansi 'gembala domba'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak dibedakan dengan 'kalian', sedangkan bentuk hormat kepada Firaun dipertahankan dalam ungkapan 'hamba-hambamu'. Penilaian kebencian ditempatkan secara eksplisit pada orang Mesir agar tidak terdengar sebagai penilaian moral narator.
