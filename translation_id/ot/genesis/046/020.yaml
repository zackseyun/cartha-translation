  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: id
  text: Bagi Yusuf lahirlah Manasye dan Efraim di tanah Mesir, yang dilahirkan Asnat, anak perempuan Potifera, imam di On, baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On adalah kota di Mesir yang kemudian dikenal dalam bahasa Yunani sebagai Heliopolis.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: Bagi Yusuf lahirlah
  rationale: Bentuk Nifal dari ילד menyatakan kelahiran secara pasif, sedangkan לְ menandai pihak yang memperoleh anak-anak itu. Susunan ini mempertahankan penonjolan Yusuf dan tetap wajar dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Menerjemahkan אֶרֶץ secara eksplisit sebagai “tanah” sambil mempertahankan urutan sumber.
- source_word: אֲשֶׁר יָלְדָה לּוֹ אָסְנַת
  choice: yang dilahirkan baginya oleh Asnat
  rationale: Klausa relatif merujuk kepada kedua anak dan mempertahankan tindakan Asnat sebagai ibu serta relasi “baginya” kepada Yusuf.
- source_word: בַּת פּוֹטִי פֶרַע
  choice: anak perempuan Potifera
  rationale: Frasa konstruksi ini mengidentifikasi Asnat sebagai anak perempuan Potifera; nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: כֹּהֵן אֹן
  choice: imam di On
  rationale: כֹּהֵן berarti imam. Preposisi “di” secara alami menyatakan bahwa Potifera merupakan imam yang bertugas di kota On, tanpa mengganti nama Ibraninya dengan nama Yunani kota tersebut.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: Manasye dan Efraim
  rationale: Penanda objek אֶת tidak diterjemahkan; kedua nama diberikan dalam bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel “-lah” membantu membuat konstruksi kelahiran pasif yang mendahului dua nama tetap alami. Catatan varian bahasa Inggris tentang susunan kata tidak dipertahankan karena tidak mencerminkan varian teks sumber dan tidak diperlukan dalam terjemahan Indonesia.
