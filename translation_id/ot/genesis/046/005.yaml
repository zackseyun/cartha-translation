base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: id
  text: Lalu Yakub berangkat dari Bersyeba[a], dan putra-putra Israel[b] membawa Yakub, ayah mereka, beserta anak-anak mereka yang masih kecil dan istri-istri mereka dengan kereta-kereta yang telah dikirim Firaun untuk mengangkutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangkit dari Bersyeba.” Dalam konteks perjalanan, kata Ibrani ini berfungsi secara idiomatis dengan arti “berangkat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “anak-anak Israel.” Dalam konteks ini ungkapan tersebut secara khusus menunjuk kepada putra-putra Yakub.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: berangkat
  rationale: Secara dasar verba ini berarti ‘bangkit’, tetapi dengan מִן dan nama tempat dalam kisah perjalanan, verba tersebut secara idiomatis menyatakan keberangkatan.
- source_word: מִבְּאֵר שָׁבַע
  choice: dari Bersyeba
  rationale: Preposisi מִן diterjemahkan langsung sebagai ‘dari’, dan ‘Bersyeba’ adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וַיִּשְׂאוּ
  choice: membawa
  rationale: נשׂא berarti membawa atau mengangkut; ‘membawa’ alami dalam kalimat ini dan sarana pengangkutannya kemudian disebutkan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: putra-putra Israel
  rationale: Dalam konteks langsung ini frasa tersebut menunjuk secara khusus kepada anak-anak lelaki Yakub, bukan kepada bangsa Israel secara umum.
- source_word: אֲבִיהֶם
  choice: ayah mereka
  rationale: Terjemahan langsung konstruksi posesif yang mengidentifikasi Yakub sebagai ayah mereka.
- source_word: טַפָּם
  choice: anak-anak mereka yang masih kecil
  rationale: טַף terutama menunjuk kepada anak-anak kecil atau anggota keluarga yang masih kecil; pilihan ini mempertahankan nuansa usia tanpa memakai ungkapan yang kaku.
- source_word: נְשֵׁיהֶם
  choice: istri-istri mereka
  rationale: Dalam konteks perjalanan keluarga, makna yang tepat dan alami ialah para istri mereka.
- source_word: בָּעֲגָלוֹת
  choice: dengan kereta-kereta
  rationale: עגלה adalah kereta atau gerobak. Preposisi בְּ di sini menyatakan sarana; ‘dengan kereta-kereta’ alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: yang telah dikirim Firaun
  rationale: Bentuk ‘telah dikirim’ memperjelas bahwa pengiriman kereta mendahului perjalanan, sesuai urutan narasi Ibrani.
- source_word: לָשֵׂאת אֹתוֹ
  choice: untuk mengangkutnya
  rationale: Infinitif ini menyatakan tujuan, dan sufiks tunggal maskulin paling wajar merujuk kepada Yakub; ‘mengangkut’ sesuai dengan penggunaan kereta.
