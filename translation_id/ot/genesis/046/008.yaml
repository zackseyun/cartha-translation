  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: id
  text: Inilah nama anak-anak Israel yang datang ke Mesir—Yakub dan anak-anaknya. Anak sulung Yakub ialah Ruben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan bagian silsilah atau daftar baru. “Inilah” alami dalam bahasa Indonesia dan menyampaikan fungsi penunjuknya; unsur penghubung וְ tidak harus diterjemahkan secara tersendiri.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Bentuk jamak konstruksi ini memperkenalkan daftar nama. Dalam frasa Indonesia “Inilah nama ...”, bentuk “nama” sudah wajar tanpa pengulangan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Konteks langsung menyebut putra-putra Yakub, tetapi bentuk ini juga merupakan sebutan genealogis. “Anak-anak Israel” mempertahankan hubungan keturunan serta nama Israel sebagai nama Yakub.
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: yang datang ke Mesir
  rationale: Partisip berartikel berfungsi sebagai keterangan bagi kelompok tersebut, sedangkan akhiran arah pada מִצְרַיְמָה menunjukkan gerak menuju Mesir.
- source_word: יַעֲקֹב וּבָנָיו
  choice: Yakub dan anak-anaknya
  rationale: Frasa ini dipertahankan sebagai keterangan aposisional yang menjelaskan kelompok yang datang ke Mesir, tanpa mengubahnya menjadi klausa penjelas yang lebih tegas daripada teks Ibrani.
- source_word: בְּכֹר יַעֲקֹב
  choice: anak sulung Yakub
  rationale: Frasa konstruksi ini menyatakan urutan kelahiran dan kepunyaan atau hubungan keluarga secara ringkas dan alami.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Nama pribadi ini memakai bentuk Indonesia yang lazim dalam tradisi penerjemahan Alkitab.
theological_decisions:
- issue: Hubungan sintaksis frasa יַעֲקֹב וּבָנָיו dengan pengantar daftar
  choice: Menampilkannya sebagai aposisi di antara tanda pisah dan titik dua
  alternative: 'Memutusnya menjadi kalimat tersendiri: “Yakub dan anak-anaknya. Anak sulung Yakub ialah Ruben.”'
  rationale: Teks Ibrani menempatkan “Yakub dan anak-anaknya” sesudah kelompok yang datang ke Mesir, lalu langsung memulai daftar dengan Ruben. Tanda baca utama mempertahankan kepadatan dan ketegangan struktur itu tanpa menyatakan secara berlebihan apakah frasa tersebut merupakan seluruh daftar atau penjelasan aposisional.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif-silsilah yang ringkas dan bermartabat. Tanda pisah menandai aposisi, sedangkan titik dua mengantar nama pertama dalam daftar.
