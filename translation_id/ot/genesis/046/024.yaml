  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: id
  text: 'Dan putra-putra Naftali: Yahzeel, Guni, Yezer, dan Syilem.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak lelaki
  rationale: בְּנֵי adalah bentuk jamak konstruktus dari 'anak laki-laki/putra'. Dalam daftar silsilah ini, 'anak-anak lelaki' menyampaikan jenis kelamin para keturunan secara alami. Konjungsi וּ tidak diterjemahkan sebagai 'dan' karena ayat ini berupa satu butir dalam rangkaian daftar, dan pembukaan tanpa 'dan' lebih wajar dalam bahasa Indonesia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: יַחְצְאֵל
  choice: Yahzeel
  rationale: Transliterasi ini mempertahankan bunyi awal yod sebagai 'Y', ח sebagai 'h', dan unsur צ sebagai 'z', dalam bentuk yang cukup mudah dibaca oleh pembaca Indonesia.
- source_word: וְגוּנִי
  choice: Guni
  rationale: Nama diri ditransliterasikan secara langsung; prefiks penghubung diwakili oleh susunan daftar dan tanda baca bahasa Indonesia.
- source_word: וְיֵצֶר
  choice: Yezer
  rationale: Nama diri ditransliterasikan dengan yod awal sebagai 'Y' dan צ sebagai 'z', sesuai pola transliterasi yang mudah dibaca dalam bahasa Indonesia.
- source_word: וְשִׁלֵּם
  choice: Syilem
  rationale: Nama diri ditransliterasikan dengan שׁ sebagai 'Sy' dan mempertahankan dua suku kata yang jelas; penggandaan konsonan Ibrani tidak perlu dipaksakan dalam ejaan Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Nama-nama ditransliterasikan dengan pola yang mudah dibaca pembaca Indonesia tanpa bergantung pada ejaan Inggris.
