base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/013.yaml
  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: id
  text: Anak-anak Isakhar ialah Tola, Pua[a], Ayub[b], dan Simron.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Pua juga ditransliterasikan sebagai Puvah.
    reason: lexical_alternative
  - marker: b
    text: Dalam 1 Tawarikh 7:1, namanya tertulis Yasyub, bukan Ayub.
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי יִשָׂשכָר
  choice: Anak-anak Isakhar ialah
  rationale: Bentuk jamak konstruksi בְנֵי dalam daftar silsilah secara langsung berarti “anak-anak ...”. Kopula “ialah” membuat pengantar daftar nama terasa wajar dalam bahasa Indonesia, sementara kesinambungan וּ dengan konteks daftar tetap tersirat.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nama diri dalam silsilah; ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וּ/פֻוָּה
  choice: Pua
  rationale: Nama diri פֻוָּה disajikan dalam bentuk Indonesia yang ringkas dan lazim. Bentuk transliterasi yang lebih eksplisit, “Puvah”, dicatat sebagai alternatif.
- source_word: וְ/י֥וֹב
  choice: Ayub
  rationale: Teks Masoret pada ayat ini berbunyi יוֹב. “Ayub” adalah bentuk nama tersebut yang sudah mapan dalam bahasa Indonesia; bacaan berbeda di 1 Tawarikh 7:1 dipertahankan dalam catatan kaki.
- source_word: וְ/שִׁמְרֽוֹן
  choice: dan Simron
  rationale: Nama diri ditransliterasikan sebagai “Simron”, dan kata sambung וְ diterjemahkan “dan” pada unsur terakhir daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Ejaan nama mengikuti bentuk yang mudah dikenali pembaca Indonesia, dengan varian tekstual dan transliterasi penting dipertahankan dalam catatan kaki.
