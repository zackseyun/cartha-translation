base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/014.yaml
  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: id
  text: 'Dan putra-putra Zebulon: Sered, Elon, dan Yahleel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yahleel juga dapat ditransliterasikan sebagai “Yakhleel”.
    reason: Alternatif “Yakhleel” merepresentasikan konsonan Ibrani ח secara lebih eksplisit, sedangkan “Yahleel” lebih sederhana dan lazim dibaca dalam bahasa Indonesia.
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Dan anak-anak
  rationale: Bentuk jamak konstruktus בְּנֵי berarti “anak-anak laki-laki/putra-putra dari”; dalam daftar silsilah, “anak-anak” terdengar alami dalam bahasa Indonesia, sedangkan prefiks וּ dipertahankan sebagai “Dan” untuk menjaga kesinambungan daftar.
- source_word: זְבוּלֻן
  choice: Zebulon
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: סֶרֶד
  choice: Sered
  rationale: Nama diri ini ditransliterasikan langsung sebagai “Sered”.
- source_word: וְ/אֵלוֹן
  choice: Elon
  rationale: Kata ini berfungsi sebagai nama orang, bukan nomina umum yang dapat berarti sejenis pohon; prefiks וְ dinyatakan melalui “dan” dalam rangkaian nama.
- source_word: וְ/יַחְלְאֵל
  choice: Yahleel
  rationale: Nama diri ditransliterasikan dengan Y untuk yod awal, sesuai kebiasaan bahasa Indonesia; prefiks וְ dinyatakan sebagai “dan” sebelum nama terakhir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Tanda titik dua mempertahankan bentuk daftar nominal dalam teks Ibrani. Semua nama diperlakukan sebagai nama diri, bukan diterjemahkan menurut kemungkinan arti leksikalnya.
