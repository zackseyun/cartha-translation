  terminology: “Seisi rumah ayahnya/ayahku” secara wajar menyampaikan בֵּית אָבִיו/בֵּית אָבִי sebagai satuan keluarga atau rumah tangga. “Firaun” dan “tanah Kanaan” sudah tepat.
