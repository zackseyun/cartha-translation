base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: id
  text: Lalu Yusuf berkata kepada saudara-saudaranya dan seisi rumah ayahnya[a], “Aku akan pergi menghadap Firaun dan memberitahukan kepadanya. Aku akan berkata kepadanya, ‘Saudara-saudaraku dan seisi rumah ayahku, yang tadinya berada di tanah Kanaan, telah datang kepadaku.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah ayahnya”; ungkapan Ibrani ini menunjuk kepada keluarga atau rumah tangga ayahnya, bukan hanya bangunan tempat tinggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: אֶל אֶחָיו
  choice: kepada saudara-saudaranya
  rationale: Dalam konteks ini אַח merujuk kepada saudara-saudara laki-laki Yusuf; bentuk Indonesia “saudara-saudara” wajar dan cukup jelas dari konteks.
- source_word: וְאֶל בֵּית אָבִיו
  choice: dan seisi rumah ayahnya
  rationale: בֵּית אָבִיו di sini menunjuk kepada kelompok keluarga atau rumah tangga ayahnya, bukan sekadar bangunan tempat tinggal.
- source_word: אֶעֱלֶה
  choice: Aku akan menghadap
  rationale: Secara harfiah berarti “aku akan naik”, tetapi dalam konteks audiensi kerajaan, “menghadap” menyampaikan gerak menuju Firaun secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: dan melaporkan kepadanya
  rationale: Bentuk Hifil נגד berarti memberitahukan atau melaporkan; “melaporkan” sesuai dengan konteks resmi di hadapan Firaun. Pronomina “kepadanya” menghindari pengulangan yang kaku setelah Firaun disebut.
- source_word: וְאֹמְרָה אֵלָיו
  choice: Aku akan berkata kepadanya
  rationale: Ungkapan ini mempertahankan maksud Yusuf untuk menyampaikan perkataan berikut secara langsung kepada Firaun.
- source_word: אַחַי
  choice: Saudara-saudaraku
  rationale: Merujuk secara khusus kepada saudara-saudara Yusuf yang telah datang dari Kanaan.
- source_word: וּבֵית אָבִי
  choice: dan seisi rumah ayahku
  rationale: Ungkapan ini menunjuk kepada unit keluarga ayah Yusuf; pilihan tersebut konsisten dengan kemunculan sebelumnya.
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: yang dahulu tinggal di tanah Kanaan
  rationale: Bahasa Ibrani tidak memuat verba eksplisit dalam klausa relatif ini. “Dahulu tinggal” secara alami menyatakan lokasi mereka sebelum datang kepada Yusuf tanpa mengubah hubungan waktunya.
- source_word: בָּאוּ אֵלַי
  choice: telah datang kepadaku
  rationale: Bentuk perfek menyatakan tindakan yang sudah selesai dan tetap relevan pada saat Yusuf berbicara.
theological_decisions: []
