  text: Itulah anak-anak lelaki Rahel yang dilahirkan bagi Yakub, seluruhnya empat belas orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh jiwa/orang, empat belas”—ungkapan Ibrani yang berarti jumlah keseluruhannya empat belas orang.'
