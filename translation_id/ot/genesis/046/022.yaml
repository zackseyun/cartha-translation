lexical_decisions:
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Dalam konteks penutup daftar silsilah, bentuk ini secara alami menunjuk kembali kepada nama-nama yang baru disebutkan.
- source_word: בְּנֵי רָחֵל
  choice: anak-anak lelaki Rahel
  rationale: Menjaga makna harfiah bentuk jamak maskulin בְּנֵי dan sesuai dengan daftar keturunan laki-laki dalam konteks ini.
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: yang lahir bagi Yakub
  rationale: Menyampaikan bentuk pasif ילד serta relasi keturunan yang ditandai oleh לְ; 'bagi Yakub' mempertahankan corak genealogis tanpa memakai ungkapan Indonesia yang janggal.
- source_word: כָּל נֶפֶשׁ
  choice: seluruhnya ... orang
  rationale: Dalam penghitungan silsilah, נֶפֶשׁ berarti pribadi/orang. Susunan 'seluruhnya ... orang' menyampaikan fungsi idiomatisnya dengan jelas dan wajar.
- source_word: אַרְבָּעָה עָשָׂר
  choice: empat belas
  rationale: Padanan langsung untuk bilangan kardinal Ibrani.
