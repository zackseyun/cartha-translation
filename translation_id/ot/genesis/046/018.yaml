  source_fidelity: 'Teks draf pada dasarnya setia pada Ibrani: klausa relatif menerangkan Zilpa, Zilpa menjadi subjek ‘melahirkan’, dan jumlahnya enam belas נפש dalam arti orang. Namun, pengulangan ‘Zilpa’ serta ‘mereka bagi Yakub’ kurang mengikuti kelancaran rumus silsilah Indonesia, dan transliterasi istilah Ibrani dalam catatan kaki perlu diperbaiki.'
