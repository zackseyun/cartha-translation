translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan dipecah menjadi dua kalimat agar rujukan subjek feminin jelas tanpa mengubah hubungan antarklausa; tanda pisah menandai jumlah rangkuman.
