base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: id
  text: 'Inilah anak-anak Zilpa, yang diberikan Laban kepada Lea, putrinya, dan ia melahirkan anak-anak ini bagi Yakub: enam belas orang.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “enam belas jiwa.” Kata Ibrani nefesh di sini merupakan ungkapan untuk menghitung orang.
    reason: Menjelaskan makna idiomatis נֶפֶשׁ sekaligus mempertahankan padanan harfiahnya sebagai alternatif.
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: Inilah anak-anak Zilpa
  rationale: Ungkapan ini memperkenalkan rangkuman kelompok keturunan Zilpa. “Anak-anak” mempertahankan istilah kekerabatan בְּנֵי secara wajar dalam bahasa Indonesia dan dapat mencakup garis keturunan yang baru saja disebutkan.
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: yang diberikan Laban kepada Lea, anak perempuannya
  rationale: Klausa relatif ini menerangkan Zilpa. Bentuk pasif alami dalam bahasa Indonesia menjaga Laban sebagai pelaku dan Lea sebagai penerima tanpa memperluas informasi sumber.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Zilpa melahirkan mereka bagi Yakub
  rationale: Nama Zilpa diulangi untuk memperjelas subjek feminin yang tersirat dalam verba Ibrani. “Melahirkan ... bagi Yakub” mempertahankan rumusan silsilah dan fungsi preposisi לְ.
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: semuanya enam belas orang
  rationale: Dalam konteks penghitungan silsilah, נֶפֶשׁ secara idiomatis berarti seorang pribadi atau orang. “Semuanya” memperjelas bahwa angka tersebut merupakan jumlah kelompok yang disebutkan.
