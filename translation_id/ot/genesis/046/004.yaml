base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: id
  text: Aku sendiri akan turun bersamamu ke Mesir, dan Aku sendiri juga pasti akan membawa engkau naik; Yusuf akan menaruh tangannya pada matamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Yusuf akan menutup matamu,” yang berarti Yusuf akan hadir ketika Yakub meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנֹכִי
  choice: Aku sendiri
  rationale: Kata ganti mandiri ini muncul dua kali dan bersifat menegaskan; “Aku sendiri” mempertahankan penekanan tersebut secara alami dalam bahasa Indonesia.
- source_word: אֵרֵד
  choice: akan turun
  rationale: Kata ירד menyatakan gerak turun dan merupakan ungkapan arah yang lazim bagi perjalanan ke Mesir.
- source_word: עִמְּךָ
  choice: bersamamu
  rationale: Padanan langsung dan alami untuk preposisi komitatif dengan akhiran orang kedua tunggal.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Mesir; “ke Mesir” adalah bentuk Indonesia yang wajar.
- source_word: אַעַלְךָ
  choice: akan membawa engkau naik kembali
  rationale: Bentuk Hifil dari עלה bersifat kausatif. “Membawa ... naik kembali” mempertahankan gambaran arah sekaligus memperjelas gerak kembali dari Mesir tanpa menentukan cara penggenapannya.
- source_word: גַם עָלֹה
  choice: juga pasti
  rationale: גַם mempertahankan unsur tambahan, sedangkan infinitif absolut עָלֹה menegaskan kepastian tindakan.
- source_word: וְיוֹסֵף
  choice: Yusuf
  rationale: Nama diri disajikan dalam bentuk Indonesia yang sudah mapan; hubungan antarklausa diungkapkan secara alami dengan tanda titik koma.
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: akan menaruh tangannya pada matamu
  rationale: Terjemahan ini mempertahankan gambaran konkret dan preposisi Ibrani, sementara makna idiomatisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Cakupan janji bahwa Allah akan membawa Yakub naik kembali dari Mesir
  choice: Mempertahankan janji langsung kepada Yakub tanpa menentukan apakah yang dimaksud ialah dirinya, jenazahnya untuk dimakamkan, atau keturunannya dalam peristiwa keluaran.
  alternative: Menafsirkannya secara khusus sebagai kepulangan Yakub semasa hidup, pemulangan jenazahnya ke Kanaan, atau keluarnya keturunannya dari Mesir.
  rationale: Teks Ibrani ringkas dan memungkinkan lebih dari satu lapisan penggenapan. Terjemahan tidak boleh menutup ketegangan teologis tersebut.
- issue: Tindakan Yusuf pada mata Yakub
  choice: Mempertahankan ungkapan konkret dalam teks utama dan menjelaskan rujukannya kepada kematian dalam catatan kaki.
  alternative: Menerjemahkan langsung secara idiomatis sebagai “Yusuf akan menutup matamu.”
  rationale: Ungkapan harfiah menjaga citra teks sumber, sedangkan catatan kaki membantu pembaca memahami bahwa Yusuf akan hadir saat Yakub meninggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “Aku sendiri” mempertahankan penegasan ilahi; “engkau” dipakai agar register tetap luhur dan sesuai dengan sapaan tunggal.
