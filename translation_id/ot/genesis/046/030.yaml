  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: id
  text: Lalu Israel berkata kepada Yusuf[a], “Sekarang aku dapat mati, karena aku telah melihat wajahmu dan engkau masih hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan susunan yang lebih dekat pada bahasa Ibrani, “Sekarang aku dapat mati, setelah aku melihat wajahmu, karena engkau masih hidup.” Bentuk Ibrani “aku dapat mati” adalah kohortatif yang dalam konteks ini menyatakan kesiapan atau ketetapan hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan fungsi tersebut secara wajar dalam bahasa Indonesia modern.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani secara eksplisit memakai nama Israel, bukan Yakub, sehingga nama itu dipertahankan.
- source_word: אָמ֣וּתָה הַפָּעַם
  choice: Sekarang aku dapat mati
  rationale: Kohortatif menyatakan kesiapan atau ketetapan hati dalam konteks emosional ini, bukan permintaan izin untuk mati. “Dapat mati” mengungkapkan bahwa Israel kini merasa hidupnya telah tergenapi.
- source_word: אַחֲרֵי רְאוֹתִי
  choice: karena aku sudah melihat
  rationale: Secara harfiah berarti “setelah aku melihat,” tetapi dalam konteks ini hubungan temporal itu sekaligus menjadi dasar bagi pernyataan sebelumnya; “karena” menghasilkan bahasa Indonesia yang alami.
- source_word: אֶת־פָּנֶיךָ
  choice: wajahmu
  rationale: Ungkapan konkret “wajahmu” dipertahankan dan tidak diratakan menjadi sekadar “engkau”.
- source_word: כִּי עוֹדְךָ חָי
  choice: dan tahu bahwa engkau masih hidup
  rationale: כִּי dapat memperkenalkan penjelasan atau isi yang tersirat dari perjumpaan itu. Penambahan “tahu” membuat hubungan antarklausa alami dalam bahasa Indonesia, sementara “masih hidup” tepat menyatakan keberlanjutan yang ditandai עוֹד.
