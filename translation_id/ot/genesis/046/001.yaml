  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: id
  text: Lalu Israel berangkat dengan semua yang menjadi miliknya[a] dan tiba di Bersyeba. Di sana ia mempersembahkan kurban kepada Allah ayahnya, Ishak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan segala yang ada padanya.” Ungkapan Ibrani ini dapat mencakup secara luas seluruh rumah tangganya dan harta bendanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: berangkat
  rationale: Dalam narasi perjalanan, נסע menunjuk pada tindakan meninggalkan tempat dan mulai menempuh perjalanan. “Berangkat” alami dalam bahasa Indonesia dan mempertahankan nuansa awal perjalanan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub; pilihan penamaan narator ini dipertahankan.
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: beserta segala yang ada padanya
  rationale: Ungkapan ini dapat mencakup seluruh lingkup rumah tangga Israel, baik orang maupun harta. Rumusan ini cukup luas dan tidak membatasinya hanya pada barang milik.
- source_word: וַיָּבֹא
  choice: tiba
  rationale: בוא dengan tujuan tempat di sini secara alami menyatakan bahwa Israel sampai di Bersyeba.
- source_word: בְּאֵרָה שָּׁבַע
  choice: di Bersyeba
  rationale: Akhiran penunjuk arah dalam bahasa Ibrani telah diungkapkan oleh verba “tiba”; “Bersyeba” adalah bentuk nama tempat yang lazim dalam bahasa Indonesia.
- source_word: וַיִּזְבַּח זְבָחִים
  choice: mempersembahkan kurban-kurban
  rationale: Konstruksi verba dan objek serumpun menyatakan tindakan mempersembahkan kurban. Bentuk ini lebih wajar daripada terjemahan harfiah yang mengulang kata “mengurbankan kurban” dan tetap mencerminkan bentuk jamak.
- source_word: לֵאלֹהֵי
  choice: kepada Allah
  rationale: Preposisi ל menandai penerima persembahan dalam konteks ibadah ini.
- source_word: אָבִיו יִצְחָק
  choice: Ishak, ayahnya
  rationale: Susunan ini mempertahankan Ishak sebagai ayah Israel dan, bersama “Allah”, menyampaikan ungkapan “Allah Ishak, ayahnya” tanpa memperluasnya menjadi para leluhur.
theological_decisions:
- issue: Sebutan khusus “Allah Ishak, ayahnya”
  choice: Mempertahankan rujukan khusus kepada Ishak.
  alternative: Allah nenek moyangnya
  rationale: Teks Ibrani secara khusus menyebut Ishak. Pengkhususan ini menjaga kesinambungan dengan Ishak dan kaitannya dengan Bersyeba tanpa menggeneralisasikannya kepada semua leluhur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Di sana” ditambahkan sebagai penghubung wacana yang alami tanpa mengubah urutan peristiwa. Bentuk “Allah Ishak, ayahnya” mempertahankan rumusan patriarkal yang khusus sekaligus menghindari perluasan teologis.
