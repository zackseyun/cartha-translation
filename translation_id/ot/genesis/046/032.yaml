  source_fidelity: Revisi diperlukan karena "sudah biasa beternak" melemahkan predikasi profesi dalam אַנְשֵׁי מִקְנֶה הָיוּ. Teks Ibrani menyatakan bahwa mereka adalah orang-orang yang pekerjaannya memelihara ternak, bukan sekadar bahwa mereka lazim melakukan kegiatan beternak. Selain itu, "kambing domba" tidak secara jelas menyampaikan cakupan kolektif צֹאן, yang dapat mencakup domba dan kambing.
  naturalness: '"Peternak" adalah padanan baku dan alami untuk orang yang mata pencahariannya memelihara ternak. Susunan "ternak kambing dan domba mereka, sapi mereka" jelas, modern, dan mempertahankan pembedaan antara צֹאן dan בָּקָר.'
  terminology: '"Gembala" tepat untuk רֹעֵי צֹאן; "peternak" tepat untuk אַנְשֵׁי מִקְנֶה. "Ternak kambing dan domba" menyampaikan kategori ternak kecil secara komunikatif, sedangkan "sapi" mempertahankan arti khusus בָּקָר.'
