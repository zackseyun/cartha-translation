  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: id
  text: Orang-orang itu adalah gembala, sebab mereka adalah peternak. Mereka telah membawa ternak kambing dan domba mereka, sapi mereka, serta segala milik mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: Orang-orang itu
  rationale: Bentuk jamak definit menunjuk kepada saudara-saudara Yusuf yang sedang dibicarakan; kata sambung awal tidak perlu ditampilkan dalam kalimat Indonesia ini.
- source_word: רֹעֵי צֹאן
  choice: gembala
  rationale: Ungkapan konstruksi ini secara idiomatis berarti orang yang menggembalakan ternak kecil, terutama domba dan kambing.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan penjelasan mengenai pekerjaan mereka.
- source_word: אַנְשֵׁי מִקְנֶה הָיוּ
  choice: mereka sudah biasa beternak
  rationale: Ungkapan itu menyatakan bahwa pemeliharaan ternak merupakan pekerjaan tetap mereka; pilihan ini alami dalam bahasa Indonesia dan tidak membatasi מִקְנֶה hanya pada sapi.
- source_word: וְצֹאנָם
  choice: kawanan kambing domba mereka
  rationale: צֹאן adalah sebutan kolektif bagi ternak kecil, khususnya domba dan kambing; 'kambing domba' mempertahankan cakupan tersebut.
- source_word: וּבְקָרָם
  choice: kawanan sapi mereka
  rationale: בָּקָר secara khusus menunjuk pada ternak sapi, sehingga istilah ini mempertahankan pembedaan dari צֹאן.
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: serta segala milik mereka
  rationale: Ungkapan ini mencakup seluruh kepunyaan mereka secara ringkas dan alami.
- source_word: הֵבִיאוּ
  choice: Mereka telah membawa
  rationale: Bentuk perfektif menyatakan tindakan yang sudah selesai dan hasilnya relevan dalam situasi kedatangan mereka sekarang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Istilah 'kambing domba' dipakai untuk cakupan ternak kecil dalam צֹאן, sedangkan 'sapi' mempertahankan arti khusus בָּקָר. Aspek perfektif diterjemahkan secara kontekstual tanpa catatan karena bahasa Indonesia tidak menuntut pembedaan bentuk verba seperti bahasa Inggris.
