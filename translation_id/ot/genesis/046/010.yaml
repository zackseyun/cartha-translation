base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/010.yaml
  text: 'And the sons of Simeon: Jemuel[a], Jamin, Ohad, Jachin, Zohar, and Shaul, the son of the Canaanite woman.'
translation:
  language: id
  text: Anak-anak Simeon ialah Yemuel, Yamin, Ohad, Yakhin, Zohar, dan Shaul, anak dari perempuan Kanaan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Anak-anak Simeon ialah
  rationale: Frasa ini melanjutkan daftar silsilah. Dalam bahasa Indonesia, tanpa konjungsi pembuka terdengar lebih alami, sedangkan 'ialah' memperjelas pengantar daftar.
- source_word: יְמוּאֵל
  choice: Yemuel
  rationale: Transliterasi ini mencerminkan bunyi awal yod Ibrani dan sesuai dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Nama diri ditransliterasikan langsung dari bahasa Ibrani dengan bunyi awal yod.
- source_word: וְאֹהַד
  choice: Ohad
  rationale: Nama diri ditransliterasikan secara langsung dan alami dalam ejaan Indonesia.
- source_word: וְיָכִין
  choice: Yakhin
  rationale: Transliterasi mempertahankan bunyi awal yod serta membedakan huruf khaf melalui 'kh'.
- source_word: וְצֹחַר
  choice: Zohar
  rationale: Bentuk ini merupakan transliterasi yang jelas dan lazim bagi pembaca Indonesia.
- source_word: וְשָׁאוּל
  choice: dan Shaul
  rationale: Transliterasi 'Shaul' mencerminkan konsonan dan vokal nama Ibrani secara lebih langsung daripada bentuk perantara bahasa lain.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: anak dari perempuan Kanaan itu
  rationale: Bentuk feminin dengan artikel menunjuk kepada seorang perempuan Kanaan tertentu. Ungkapan ini mempertahankan jenis kelamin rujukan dan sifat definitnya dalam bahasa Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama ditransliterasikan sedekat mungkin dengan bahasa Ibrani sambil memakai ejaan yang mudah dibaca; struktur daftar dibuat alami tanpa menghilangkan informasi sumber.
