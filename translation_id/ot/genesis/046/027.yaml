base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: id
  text: Dan putra-putra Yusuf yang lahir baginya di Mesir berjumlah dua orang.[a] Seluruh anggota keluarga Yakub yang datang ke Mesir berjumlah tujuh puluh orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dua jiwa”. Dalam konteks penghitungan keluarga, kata Ibrani נֶפֶשׁ berarti orang atau individu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: Anak-anak Yusuf
  rationale: Dalam konteks ini bentuk jamak בֵּן menunjuk kepada kedua putra Yusuf yang telah disebutkan. Bahasa Indonesia lazim memakai bentuk netral “anak-anak” ketika menyebut keturunan seseorang; konteks tetap memperjelas bahwa mereka laki-laki.
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: yang lahir baginya
  rationale: Bentuk pasif ילד dengan ל mempertahankan ungkapan Ibrani “lahir baginya” tanpa mengubahnya menjadi konstruksi aktif seperti “yang diperanakkannya”.
- source_word: בְמִצְרַיִם
  choice: di Mesir
  rationale: Pemakaian lokatif langsung dari preposisi ב.
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: berjumlah dua orang
  rationale: נֶפֶשׁ dalam konteks silsilah dan penghitungan berarti individu atau orang. “Berjumlah dua orang” menyampaikan konstruksi penghitungan itu secara alami dalam bahasa Indonesia.
- source_word: כָּל הַנֶּפֶשׁ
  choice: seluruh anggota
  rationale: Dalam klausa ini נֶפֶשׁ kembali berfungsi sebagai istilah penghitungan orang. “Seluruh anggota” menjadi alami bersama frasa “keluarga Yakub” dan tidak memberi kesan pernyataan antropologis tentang jiwa.
- source_word: לְבֵית יַעֲקֹב
  choice: keluarga Yakub
  rationale: בַּיִת di sini menunjuk kepada rumah tangga atau kelompok keluarga Yakub. “Keluarga Yakub” lebih jelas bagi pembaca Indonesia modern daripada terjemahan harfiah “rumah Yakub”.
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: yang datang ke Mesir
  rationale: Partisip berartikel diterjemahkan sebagai klausa relatif kolektif, sedangkan akhiran arah pada מִצְרַיְמָה dinyatakan dengan “ke”.
- source_word: שִׁבְעִים
  choice: berjumlah tujuh puluh orang
  rationale: Klausa nominal Ibrani menyatakan jumlah keseluruhan. Kata “berjumlah” membuat fungsi angka itu jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks penghitungan keluarga
  choice: orang/anggota
  alternative: jiwa
  rationale: Ayat ini menghitung anggota keluarga Yakub, bukan mengajarkan pembagian hakikat manusia. Terjemahan “orang/anggota” mempertahankan fungsi idiomatis kata tersebut dan menghindari muatan teologis yang menyesatkan.
- issue: Cakupan jumlah tujuh puluh
  choice: mempertahankan pernyataan ringkas teks Masoret tanpa menyelaraskannya dengan tradisi angka lain
  alternative: menjelaskan atau mengganti jumlah berdasarkan tradisi tekstual lain
  rationale: WLC secara eksplisit berbunyi “tujuh puluh”. Terjemahan mengikuti sumber yang ditetapkan dan tidak menyelesaikan perbedaan tekstual atau cara penghitungan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berjumlah” dipakai agar kedua klausa penghitungan mengalir wajar. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskan.
