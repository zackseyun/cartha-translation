  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: id
  text: Anak-anak Benyamin ialah Bela, Beker[a], Asybel, Gera, Naaman, Ehi[b], Rosy, Mupim[c], Hupim, dan Ard[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah terjemahan Inggris tradisional mengeja nama בֶּכֶר sebagai “Becher”.
    reason: lexical_alternative
  - marker: b
    text: Dalam Bilangan 26:38, silsilah paralel suku Benyamin memuat nama “Ahiram” pada posisi yang berkaitan dengan “Ehi” dalam ayat ini.
    reason: cross_reference
  - marker: c
    text: Beberapa tradisi silsilah paralel memuat bentuk lain, seperti “Supim”, untuk “Mupim”; terjemahan ini mengikuti Teks Masoret ayat ini.
    reason: textual_variant
  - marker: d
    text: Dalam silsilah suku Benyamin, 1 Tawarikh 8:3 memuat bentuk nama terkait, “Adar”; ayat ini berbunyi “Ard”.
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus dari בֵּן membuka daftar keturunan. Dalam bahasa Indonesia, kopula “ialah” membuat daftar panjang ini alami dan jelas; waw dipahami sebagai kelanjutan daftar dari konteks sebelumnya tanpa harus diterjemahkan secara kaku sebagai “dan” di awal ayat.
- source_word: בִנְיָמִן
  choice: Benyamin
  rationale: Mengikuti bentuk nama Ibrani yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בֶּלַע
  choice: Bela
  rationale: Transliterasi nama diri Ibrani yang alami dalam ejaan Indonesia.
- source_word: בֶּכֶר
  choice: Beker
  rationale: Transliterasi langsung nama diri menurut bentuk Masoret; huruf כ di sini bersuara /k/.
- source_word: אַשְׁבֵּל
  choice: Asybel
  rationale: Transliterasi nama diri dengan “sy” sebagai padanan Indonesia yang lazim untuk bunyi שׁ.
- source_word: גֵּרָא
  choice: Gera
  rationale: Transliterasi nama diri menurut bentuk Masoret.
- source_word: נַעֲמָן
  choice: Naaman
  rationale: Bentuk nama yang wajar dalam bahasa Indonesia; vokal berurutan dipertahankan tanpa menambahkan tanda khusus.
- source_word: אֵחִי
  choice: Ehi
  rationale: Mengikuti tepat bentuk nama dalam teks Masoret ayat ini, tanpa menggantinya dengan nama dari silsilah paralel.
- source_word: רֹאשׁ
  choice: Ros
  rationale: Dalam konteks daftar nama, kata ini diperlakukan sebagai nama diri, bukan diterjemahkan sebagai nomina umum “kepala”; “sy” tidak diperlukan karena שׁ di akhir direpresentasikan secara sederhana dalam bentuk nama Indonesia ini.
- source_word: מֻפִּים
  choice: Mupim
  rationale: Transliterasi bentuk Masoret; konsonan rangkap tidak perlu dipertahankan dalam ejaan Indonesia.
- source_word: חֻפִּים
  choice: Hupim
  rationale: Transliterasi nama dengan “h” sebagai bentuk praktis dan terbaca bagi pembaca Indonesia; konsonan rangkap disederhanakan.
- source_word: אָרְדְּ
  choice: Ard
  rationale: Mengikuti nama sebagaimana terbaca dalam teks Masoret ayat ini, bukan bentuk terkait dalam silsilah paralel.
