  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: id
  text: Lalu Dia berfirman, “Akulah Allah, Allah ayahmu. Jangan takut pergi ke Mesir,[a] sebab di sanalah Aku akan menjadikanmu bangsa yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jangan takut untuk turun ke Mesir.” Bahasa Ibrani memakai kata “takut” dengan bentuk infinitif “turun”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Allah
  rationale: Dalam pengenalan diri ilahi ini, bentuk berartikel menegaskan identitas Sang Pembicara. 'Akulah Allah' alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Allah ayahmu
  rationale: Menerjemahkan rangkaian konstruksi secara ringkas dan mempertahankan bentuk tunggal 'ayahmu', tanpa memperluasnya menjadi 'nenek moyangmu'.
- source_word: אַל תִּירָא מֵרְדָה
  choice: Jangan takut pergi
  rationale: Ungkapan Ibrani memakai verba 'takut' dengan infinitif yang secara idiomatis berarti jangan takut melakukan tindakan tersebut.
- source_word: מִצְרַיְמָה
  choice: ke Mesir
  rationale: Akhiran direktif menyatakan gerak menuju Mesir; 'ke Mesir' merupakan padanan Indonesia yang alami.
- source_word: לְגוֹי גָּדוֹל אֲשִׂימְךָ
  choice: Aku akan menjadikanmu bangsa yang besar
  rationale: 'Konstruksi שׂים dengan ל bersifat resultatif: Allah akan membentuk keturunan Yakub menjadi suatu bangsa besar.'
- source_word: שָׁם
  choice: di sanalah
  rationale: Adverbia ini menunjuk Mesir sebagai tempat penggenapan janji; partikel '-lah' mempertahankan fokus lokatif yang diletakkan di depan dalam klausa Ibrani.
theological_decisions:
- issue: Sebutan leluhur dalam pengenalan diri Allah
  choice: Allah ayahmu
  alternative: Allah nenek moyangmu
  rationale: Teks Ibrani menggunakan bentuk tunggal 'ayahmu'. Terjemahan mempertahankannya agar hubungan langsung dengan Ishak dan kesinambungan perjanjian tidak diperluas secara interpretatif.
- issue: Rujukan pronomina tunggal dalam janji menjadi bangsa besar
  choice: menjadikanmu bangsa yang besar
  alternative: menjadikan keturunanmu bangsa yang besar
  rationale: Objek Ibrani adalah 'engkau' dalam bentuk tunggal. Terjemahan mempertahankan ungkapan korporatif yang menyatukan Yakub dengan bangsa yang akan berasal darinya, tanpa menyisipkan 'keturunanmu' ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Berfirman' dipakai untuk tuturan langsung Allah. 'Pergi ke Mesir' dipilih dalam teks utama agar alami bagi pembaca umum, sedangkan metafora geografis harfiah 'turun ke Mesir' dipertahankan dalam catatan kaki.
