  naturalness: Istilah kekerabatan dan susunan kalimatnya baku serta mudah dipahami. Penggunaan “bersamanya” lebih alami dan lebih jelas daripada “bersama dia” dalam konteks subjek yang sama, serta memungkinkan kedua kemunculan frasa Ibrani itu tercermin.
  terminology: “Anak-anak laki-laki/perempuan,” “cucu-cucu laki-laki/perempuan,” dan “seluruh keturunannya” adalah padanan yang tepat dalam bahasa Indonesia modern. Catatan “benihnya” dengan tepat mempertahankan alternatif harfiah untuk זַרְעוֹ.
