  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: id
  text: Anak-anak laki-lakinya dan cucu-cucu laki-lakinya[a] bersamanya, anak-anak perempuannya dan cucu-cucu perempuannya[b], serta seluruh keturunannya[c] dibawanya bersamanya ke Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki dari anak-anak laki-lakinya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak perempuan dari anak-anak laki-lakinya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “seluruh benihnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: anak-anak laki-lakinya
  rationale: Kata ini menunjuk secara khusus kepada keturunan laki-laki dan dibedakan dari anak-anak perempuan dalam ayat yang sama.
- source_word: וּבְנֵי בָנָיו
  choice: dan cucu-cucu laki-lakinya
  rationale: Secara harfiah berarti 'anak-anak laki-laki dari anak-anak laki-lakinya'; padanan Indonesia yang wajar dan tepat secara silsilah ialah 'cucu-cucu laki-lakinya'.
- source_word: אִתּוֹ
  choice: bersama dia
  rationale: Menyatakan penyertaan; dalam susunan 'dibawanya bersama dia' ungkapan ini mempertahankan bahwa Yakub membawa keluarganya menyertai dirinya.
- source_word: בְּנֹתָיו
  choice: anak-anak perempuannya
  rationale: Padanan langsung untuk keturunan perempuan, yang dikontraskan dengan anak-anak laki-laki.
- source_word: וּבְנוֹת בָּנָיו
  choice: dan cucu-cucu perempuannya
  rationale: Secara harfiah berarti 'anak-anak perempuan dari anak-anak laki-lakinya'; 'cucu-cucu perempuannya' merupakan padanan Indonesia yang alami.
- source_word: וְכָל זַרְעוֹ
  choice: serta seluruh keturunannya
  rationale: Dalam konteks perpindahan keluarga, זֶרַע bermakna kolektif 'keturunan'; pilihan ini jelas dan alami tanpa memakai arti harfiah 'benih'.
- source_word: הֵבִיא
  choice: dibawanya
  rationale: Bentuk Hifil dari בוא berarti 'membawa'. Susunan inversi ini mempertahankan urutan dan fokus sumber pada seluruh anggota keluarga yang dibawa Yakub.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran direktif menyatakan gerak menuju Mesir; 'ke Mesir' adalah padanan Indonesia yang tepat dan idiomatis.
