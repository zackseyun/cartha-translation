base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: id
  text: Itulah anak-anak lelaki Bilha, yang diberikan Laban kepada Rahel, anak perempuannya. Bilha melahirkan mereka bagi Yakub—seluruhnya tujuh orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua jiwa, tujuh”—ungkapan Ibrani yang berarti seluruhnya tujuh orang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי בִלְהָה
  choice: Itulah anak-anak lelaki Bilha
  rationale: Frasa penunjuk ini merangkum orang-orang yang baru disebutkan. 'Anak-anak lelaki' mempertahankan makna spesifik בְּנֵי dalam daftar silsilah.
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: yang diberikan Laban kepada Rahel, anak perempuannya
  rationale: Klausa relatif secara gramatikal menerangkan Bilha, bukan anak-anaknya. Bentuk pasif dalam bahasa Indonesia menjaga acuan itu tetap jelas dan alami; 'anak perempuannya' menyatakan sufiks posesif Ibrani secara eksplisit.
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: Bilha melahirkan mereka bagi Yakub
  rationale: Nama 'Bilha' diulangi agar subjek feminin tersirat dalam verba Ibrani tidak rancu dalam bahasa Indonesia. 'Bagi Yakub' mempertahankan relasi yang ditandai ל dalam rumus kelahiran tanpa menyiratkan bahwa Yakub adalah penerima fisik bayi-bayi itu.
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: seluruhnya tujuh orang
  rationale: נֶפֶשׁ dalam konteks penghitungan berarti orang atau pribadi. Ungkapan ini diterjemahkan secara idiomatis sebagai jumlah keseluruhan, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif-silsilah yang ringkas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Bilha, Rahel, Laban, dan Yakub. Penanda catatan kaki ditempatkan tepat setelah klausa jumlah yang dijelaskannya.'
