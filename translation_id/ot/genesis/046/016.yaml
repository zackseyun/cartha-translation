  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: id
  text: Dan anak-anak Gad ialah Zifyon[a], Hagi, Syuni, Ezbon, Eri, Arodi, dan Areli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Zifyon. Dalam Bilangan 26:15 nama ini muncul dalam bentuk Zefon.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: Dan anak-anak Gad ialah
  rationale: Kata וּ mempertahankan kesinambungan daftar dengan “Dan”; bentuk konstruksi בְנֵי secara langsung berarti “anak-anak,” sedangkan “ialah” membuat pengantar daftar ini alami dalam bahasa Indonesia.
- source_word: צִפְיוֹן
  choice: Zifyon
  rationale: Nama ini dialihaksarakan dari bentuk Ibrani yang terdapat dalam ayat ini; ejaan “fy” mencerminkan rangkaian konsonan dan vokal nama tersebut dalam bentuk Masoret.
- source_word: וְחַגִּי
  choice: Hagi
  rationale: Nama diri dialihaksarakan dengan ejaan Indonesia yang wajar; konsonan rangkap dalam teks Ibrani tidak perlu digandakan dalam ejaan Indonesia.
- source_word: שׁוּנִי
  choice: Syuni
  rationale: Nama diri dialihaksarakan menurut kebiasaan bahasa Indonesia, dengan “sy” untuk bunyi שׁ.
- source_word: וְאֶצְבֹּן
  choice: Ezbon
  rationale: Nama diri dialihaksarakan secara langsung dan memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֵרִי
  choice: Eri
  rationale: Nama diri dialihaksarakan secara langsung ke dalam ejaan Indonesia.
- source_word: וַאֲרוֹדִי
  choice: Arodi
  rationale: Nama diri dialihaksarakan secara langsung; kata penghubungnya dinyatakan melalui struktur dan tanda baca daftar bahasa Indonesia.
- source_word: וְאַרְאֵלִי
  choice: Areli
  rationale: Nama diri dialihaksarakan secara langsung; kata penghubung diterjemahkan sebagai “dan” sebelum unsur terakhir daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat, dengan struktur daftar yang alami. Nama-nama dialihaksarakan sesuai kebiasaan ejaan Indonesia sambil mempertahankan bentuk teks Ibrani ayat ini.
