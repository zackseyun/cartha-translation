  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: id
  text: Yakub mengutus Yehuda mendahuluinya untuk menemui Yusuf dan menunjukkan jalan menuju Gosyen.[a] Kemudian mereka tiba di negeri Gosyen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani pada bagian ini ringkas dan dapat juga dipahami sebagai “untuk memberi petunjuk di hadapannya menuju Gosyen” atau “untuk memperoleh petunjuk mengenai jalan ke Gosyen.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: mengutus
  rationale: Kata kerja ini berarti mengirim atau mengutus. Dalam konteks penugasan Yehuda, “mengutus” alami dan tepat.
- source_word: לְפָנָיו
  choice: mendahuluinya
  rationale: Ungkapan ini menunjukkan bahwa Yehuda dikirim lebih dahulu daripada Yakub, baik secara waktu maupun tempat.
- source_word: לְהוֹרֹת
  choice: menunjukkan jalan
  rationale: Bentuk Hifil dari ירה dapat berarti memberi petunjuk, mengarahkan, atau menunjukkan. Dalam konteks perjalanan menuju Gosyen, “menunjukkan jalan” mempertahankan nuansa pengarahan praktis tanpa memperluasnya menjadi persiapan logistik.
- source_word: גֹּשְׁנָה
  choice: menuju Gosyen
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerakan ke arah Gosyen; “menuju” mengungkapkan fungsi tersebut secara alami.
- source_word: וַיָּבֹאוּ
  choice: Kemudian mereka tiba
  rationale: Bentuk naratif dari בוא menyatakan kedatangan. “Tiba” lebih alami dalam bahasa Indonesia pada akhir rangkaian perjalanan.
- source_word: אַרְצָה גֹּשֶׁן
  choice: di negeri Gosyen
  rationale: Frasa ini menunjuk pada kawasan atau wilayah Gosyen sebagai tujuan kedatangan. “Negeri Gosyen” mempertahankan nuansa teritorial אֶרֶץ.
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: Yehuda / Yusuf / Gosyen
  rationale: Nama-nama ditransliterasikan memakai bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions: []
