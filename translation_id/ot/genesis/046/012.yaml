base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: id
  text: Dan anak-anak Yehuda ialah Er, Onan, Syela, Peres, dan Zerah. Tetapi Er dan Onan mati di tanah Kanaan. Anak-anak Peres ialah Hezron dan Hamul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: Anak-anak Yehuda
  rationale: Frasa konstruksi menyatakan anak-anak langsung Yehuda; hubungan dengan daftar sebelumnya tetap jelas dalam bahasa Indonesia tanpa harus menerjemahkan waw secara mekanis.
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: Er, Onan, Syela, Peres, dan Zerah
  rationale: Nama-nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Walaupun bentuk verba Ibraninya tunggal karena mendahului subjek majemuk, maknanya mencakup Er dan Onan; verba bahasa Indonesia tidak membedakan jumlah.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, 'tanah/negeri', dengan ungkapan Indonesia yang wajar.
- source_word: וַיִּהְיוּ בְנֵי פֶרֶץ
  choice: Anak-anak Peres ialah
  rationale: Dalam konteks silsilah, היה mengidentifikasi anak-anak Peres; 'ialah' menghasilkan kalimat nominal yang alami dan jelas.
- source_word: חֶצְרוֹן וְחָמוּל
  choice: Hezron dan Hamul
  rationale: Nama-nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
