  verdict: revise
  source_fidelity: Teks Ibrani menyusun daftar anak-anak Yehuda, lalu menyatakan bahwa Er dan Onan mati di tanah Kanaan, kemudian menyebut anak-anak Peres. Terjemahan draf pada dasarnya setia, tetapi kata penghubung awal וְ dan peralihan naratif berikutnya lebih baik dipertahankan secara eksplisit. Verba Ibrani yang berbentuk tunggal sebelum subjek majemuk menyatakan bahwa kedua orang itu mati; bahasa Indonesia tidak memerlukan catatan khusus untuk hal ini.
  naturalness: '"Dan anak-anak Yehuda ialah ..." serta "tetapi Er dan Onan mati ..." tetap baku, jelas, dan alami dalam gaya silsilah Alkitab bahasa Indonesia. "Mati" lebih langsung mencerminkan verba sumber daripada eufemisme "meninggal", tanpa menjadi tidak pantas dalam register ini.'
  terminology: Bentuk nama Er, Onan, Syela, Peres, Zerah, Hezron, dan Hamul konsisten dengan penggunaan Alkitab bahasa Indonesia yang lazim. "Tanah Kanaan" mempertahankan unsur אֶרֶץ dengan baik.
