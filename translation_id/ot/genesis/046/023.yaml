translation:
  language: id
  text: 'Anak-anak laki-laki Dan: Husim.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani ringkas: secara harfiah, “Dan anak-anak laki-laki: Husim.” Walaupun “anak-anak laki-laki” berbentuk jamak, Husim adalah nama diri; di bagian lain dalam silsilah ini ia muncul sebagai satu-satunya keturunan Dan yang disebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: mempunyai anak laki-laki
  rationale: Dalam daftar silsilah ini, bentuk jamak konstruktus בְנֵי secara harfiah berarti “anak-anak laki-laki dari”. Namun, bahasa Indonesia alami lebih jelas dengan konstruksi kepemilikan “mempunyai anak laki-laki”, sambil tetap mempertahankan bentuk tunggal yang tersirat oleh hanya satu nama yang disebut. Konjungsi וּ tidak diterjemahkan secara tersendiri karena hubungan tambahan sudah jelas dari susunan daftar.
- source_word: דָן
  choice: Dan
  rationale: Nama diri ini dipertahankan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֻשִׁים
  choice: Husim
  rationale: Nama diri Ibrani חֻשִׁים ditransliterasikan menjadi “Husim” sesuai kebiasaan ejaan Indonesia; walaupun bentuknya tampak seperti bentuk jamak, dalam konteks ini kata tersebut berfungsi sebagai nama seorang keturunan Dan.
