  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: id
  text: Anak-anak Lewi ialah Gerson, Kehat, dan Merari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus בְנֵי diterjemahkan secara wajar sebagai “anak-anak [dari]”; dalam konteks silsilah ini yang dimaksud ialah anak laki-laki. Kopula “ialah” memperkenalkan daftar nama secara alami, sedangkan waw penghubung tidak dinyatakan tersendiri karena ayat ini merupakan butir lanjutan dalam rangkaian daftar dan bahasa Indonesia tidak memerlukannya.
- source_word: לֵוִי
  choice: Lewi
  rationale: Nama diri ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: גֵּרְשׁוֹן
  choice: Gerson
  rationale: Nama Ibrani גֵּרְשׁוֹן dibedakan dari גֵּרְשֹׁם (Gersom); “Gerson” merupakan bentuk Indonesia yang lazim untuk nama dalam ayat ini.
- source_word: קְהָת
  choice: Kehat
  rationale: Bentuk “Kehat” mengikuti transliterasi nama Alkitab yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וּ/מְרָרִי
  choice: dan Merari
  rationale: Waw sebelum nama terakhir diterjemahkan “dan” untuk menandai unsur terakhir dalam deret; nama diri dipertahankan sebagai “Merari”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat untuk daftar silsilah. Nama-nama mengikuti bentuk yang lazim dalam tradisi penerjemahan Alkitab bahasa Indonesia, sambil tetap membedakan Gerson dari Gersom.
