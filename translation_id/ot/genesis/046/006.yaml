  text: וַ/יִּקְח֣וּ אֶת מִקְנֵי/הֶ֗ם וְ/אֶת רְכוּשָׁ/ם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יָּבֹ֖אוּ מִצְרָ֑יְמָ/ה יַעֲקֹ֖ב וְ/כָל זַרְע֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: id
  text: Mereka membawa ternak dan harta benda yang telah mereka peroleh di tanah Kanaan, lalu tiba di Mesir—Yakub dan seluruh keturunannya[a] bersama dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihnya.” Kata Ibrani ini dapat berarti anak atau keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Mereka membawa
  rationale: Bentuk naratif dari לקח berarti “mengambil.” Dalam konteks perpindahan menuju Mesir, “membawa” secara alami menyatakan bahwa ternak dan harta benda itu dibawa serta.
- source_word: מִקְנֵיהֶם
  choice: ternak
  rationale: מִקְנֶה mencakup hewan peliharaan sebagai milik, termasuk kawanan besar maupun kecil; “ternak” merupakan padanan Indonesia modern yang luas.
- source_word: רְכוּשָׁם
  choice: harta benda
  rationale: רְכוּשׁ menunjuk pada barang atau kekayaan yang dimiliki. “Harta benda” jelas dan tetap dibedakan dari ternak yang disebut sebelumnya.
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: yang telah mereka peroleh
  rationale: Klausa ini menerangkan harta benda yang diperoleh sebelumnya di Kanaan; bentuk “telah ... peroleh” mempertahankan hubungan waktunya.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: di tanah Kanaan
  rationale: Padanan ini mempertahankan unsur אֶרֶץ dan kekonkretan geografis frasa Ibrani.
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: lalu tiba di Mesir
  rationale: בוא dengan akhiran penunjuk arah pada מִצְרַיִם menyatakan gerak menuju Mesir. “Tiba di” alami dalam narasi Indonesia tanpa memperinci tindakan memasuki perbatasan.
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: Yakub dan seluruh keturunannya bersama dia
  rationale: זֶרַע secara harfiah berarti “benih” dan dapat menunjuk pada anak, keturunan, atau garis keturunan. Dalam konteks keluarga Yakub yang ikut pindah, “keturunannya” paling jelas dan wajar.
theological_decisions: []
