  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: id
  text: Lalu malaikat Yahweh berkata kepadanya, “Kembalilah kepada nyonyamu dan tundukkanlah dirimu di bawah kekuasaannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat. Dalam konteks perjumpaan ilahi ini, “malaikat” paling wajar, sedangkan nama pribadi יְהוָה dipertahankan sebagai “Yahweh”.
- source_word: שׁוּבִי
  choice: Kembalilah
  rationale: Bentuk imperatif feminin tunggal dari שוב menyampaikan perintah langsung untuk kembali.
- source_word: גְּבִרְתֵּךְ
  choice: nyonyamu
  rationale: Istilah ini menunjuk pada perempuan yang berkedudukan sebagai majikan atas Hagar; “nyonya” menyampaikan hubungan sosial tersebut secara alami dalam bahasa Indonesia.
- source_word: וְהִתְעַנִּי
  choice: tundukkanlah dirimu
  rationale: Bentuk Hitpael imperatif ini menyatakan penerimaan posisi rendah atau takluk. Pilihan ini mempertahankan unsur refleksif dan kaitannya dengan ketundukan kepada pihak yang berwenang.
- source_word: תַּחַת יָדֶיהָ
  choice: di bawah kekuasaannya
  rationale: Secara harfiah berarti “di bawah tangannya,” sebuah idiom Ibrani untuk berada di bawah kuasa atau wewenang seseorang. Padanan idiomatis Indonesia menghindari kesan fisik yang keliru.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Arti מַלְאַךְ dalam ungkapan מַלְאַךְ יְהוָה
  choice: malaikat
  alternative: utusan
  rationale: Kata ini memang dapat berarti “utusan,” tetapi konteks perjumpaan ilahi mendukung “malaikat” tanpa menetapkan lebih jauh identitas teologis tokoh tersebut.
- issue: Nuansa וְהִתְעַנִּי dalam konteks perlakuan Sarai terhadap Hagar
  choice: tundukkanlah dirimu
  alternative: biarkan dirimu ditindas
  rationale: Bentuk dan konteksnya dapat memuat nuansa merendahkan diri atau menerima perlakuan keras. Terjemahan utama menyatakan ketundukan yang diperintahkan tanpa secara tegas menjadikan penindasan sebagai perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Nyonyamu” dipakai untuk menandai kedudukan majikan perempuan dalam rumah tangga kuno; “di bawah kekuasaannya” menerjemahkan idiom Ibrani secara alami.
