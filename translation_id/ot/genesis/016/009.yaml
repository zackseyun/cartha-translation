  terminology: “Yahweh” konsisten dengan keputusan untuk mempertahankan nama ilahi. “Malaikat” merupakan pilihan yang wajar bagi מַלְאָךְ dalam konteks ini dan tidak memaksakan identitas teologis tertentu. Istilah ketundukan tidak melampaui ambiguitas semantis ענה dalam bentuk Hitpael.
