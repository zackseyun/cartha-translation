  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: id
  text: Maka Sarai, istri Abram, mengambil Hagar, perempuan Mesir yang menjadi budaknya, setelah Abram tinggal sepuluh tahun di tanah Kanaan, lalu memberikannya kepada Abram, suaminya, untuk menjadi istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “memberikannya kepada Abram, suaminya, baginya sebagai istri.”'
    reason: Menunjukkan bentuk harfiah konstruksi לוֹ לְאִשָּׁה dan menegaskan bahwa teks sumber memakai kata “istri/perempuan”, bukan istilah khusus untuk “gundik”.
lexical_decisions:
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: Bentuk naratif dari לקח lazim berarti “mengambil”; pilihan ini mempertahankan tindakan aktif Sarai tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: Sarai, istri Abram,
  rationale: Konstruksi aposisional mengidentifikasi Sarai melalui hubungannya dengan Abram; tanda koma menghasilkan bahasa Indonesia yang wajar.
- source_word: הָגָר הַמִּצְרִית
  choice: Hagar, perempuan Mesir
  rationale: Adjektiva gentiliks menandai asal atau identitas kebangsaan Hagar; “perempuan Mesir” jelas dan alami dalam bahasa Indonesia.
- source_word: שִׁפְחָתָהּ
  choice: yang menjadi budaknya
  rationale: שִׁפְחָה menunjuk pada budak perempuan atau hamba perempuan. “Budaknya” mempertahankan status keterikatan sosial yang nyata dalam teks dan tidak melunakkannya menjadi sekadar pelayan.
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: setelah Abram tinggal sepuluh tahun di tanah Kanaan
  rationale: Ungkapan temporal tersebut menandai genapnya masa sepuluh tahun sejak Abram tinggal di Kanaan; susunan ini jelas dan idiomatis dalam bahasa Indonesia.
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: lalu memberikannya kepada Abram, suaminya,
  rationale: “Lalu” melanjutkan rangkaian naratif, sedangkan aposisi “suaminya” mempertahankan identifikasi hubungan yang terdapat dalam Ibrani.
- source_word: לוֹ לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Konstruksi ini menyatakan peran atau hasil, yaitu Hagar diberikan kepada Abram dalam kedudukan sebagai istri. Bentuk Indonesia ini alami tanpa mengubahnya menjadi istilah “gundik” yang tidak dipakai dalam teks sumber.
theological_decisions:
- issue: Status Hagar dalam hubungannya dengan Abram
  choice: Mempertahankan sekaligus sebutan Hagar sebagai budak Sarai dan pemberiannya kepada Abram untuk menjadi istrinya.
  alternative: Menerjemahkan statusnya sebagai “gundik Abram” atau melunakkan שִׁפְחָה menjadi “pelayan”.
  rationale: Teks Ibrani secara eksplisit menyebut Hagar sebagai שִׁפְחָה milik Sarai dan memakai אִשָּׁה untuk kedudukannya terhadap Abram. Kedua realitas sosial itu dipertahankan tanpa diselaraskan atau dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Budak” dipilih demi ketepatan sosial-historis, sementara “untuk menjadi istrinya” menyampaikan konstruksi Ibrani secara alami. Penanda catatan kaki [a] ditempatkan langsung pada klausa yang dijelaskan.
