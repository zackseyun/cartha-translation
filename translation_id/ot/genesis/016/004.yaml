  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: id
  text: Abram menghampiri Hagar dan menggaulinya, lalu Hagar mengandung. Ketika Hagar melihat bahwa ia mengandung, nyonyanya menjadi rendah dalam pandangannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hagar memandang rendah nyonyanya.” Secara harfiah, nyonyanya “menjadi rendah dalam pandangannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: Abram menghampiri Hagar
  rationale: Idiom בוא אל dalam konteks ini merupakan ungkapan halus untuk hubungan seksual. “Menghampiri” mempertahankan kesantunan narasi dan lazim dipahami dalam ragam Alkitabiah Indonesia; nama Abram dijelaskan dari konteks sebagai subjek verba maskulin tunggal.
- source_word: וַתַּהַר / הָרָתָה
  choice: mengandung / mengandung
  rationale: Pengulangan akar הרה dipertahankan dengan kata yang sama. “Mengandung” terdengar alami dan bermartabat dalam bahasa Indonesia serta dapat menyatakan mulai atau keadaan hamil sesuai konteks.
- source_word: וַתֵּרֶא כִּי
  choice: Ketika Hagar menyadari bahwa
  rationale: Secara harfiah berarti “dan ia melihat bahwa”, tetapi di sini ראה menunjuk pada kesadaran akan kehamilan. Nama Hagar diulang agar rujukan pronomina tidak rancu dalam bahasa Indonesia.
- source_word: וַתֵּקַל ... בְּעֵינֶיהָ
  choice: ia memandang rendah ...
  rationale: Bentuk וַתֵּקַל secara gramatikal menempatkan “nyonyanya” sebagai subjek yang menjadi ringan atau hina dalam pandangan Hagar. Ungkapan Indonesia “memandang rendah” menyampaikan penilaian Hagar secara alami tanpa menyatakan bahwa nilai sang nyonya benar-benar berubah.
- source_word: גְּבִרְתָּהּ
  choice: nyonyanya
  rationale: גברת menunjuk perempuan yang berkedudukan sebagai atasan atau majikan Hagar. “Nyonya” paling alami dalam konteks rumah tangga ini dan mempertahankan hubungan sosial tersebut.
