  - severity: low
    issue: Kata “tetapi” menambahkan hubungan kontras yang tidak dinyatakan secara eksplisit.
    rationale: Teks Ibrani memakai waw penghubung biasa; “dan” lebih netral dan lebih setia pada urutan keluhan Sarai.
