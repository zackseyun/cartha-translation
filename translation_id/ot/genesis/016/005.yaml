  terminology: “Budak perempuan” secara tepat mencerminkan status perhambaan yang ditandai oleh שִׁפְחָה. “Pelukanmu” adalah padanan idiomatis yang wajar untuk בְּחֵיקֶךָ dalam konteks ini. “Yahweh” konsisten dengan keputusan proyek untuk יהוה.
