  source_fidelity: 'Draf umumnya setia pada Ibrani: bentuk jussif יִשְׁפֹּט diterjemahkan tepat sebagai seruan, nama יהוה dipertahankan sebagai “Yahweh,” dan klausa tentang Sarai yang menjadi hina di mata Hagar tersampaikan. Namun, וַתֵּרֶא (“ia melihat”) tidak sebaiknya diganti dengan “ia menyadari,” dan waw penghubung tidak memerlukan kontras eksplisit “tetapi.”'
