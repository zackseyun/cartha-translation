  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: id
  text: Lalu Sarai berkata kepada Abram, “Ketidakadilan yang kualami adalah tanggung jawabmu.[a] Aku menyerahkan budak perempuanku ke dalam pelukanmu,[b] dan ketika ia melihat bahwa ia telah mengandung, aku menjadi hina di matanya. Biarlah Yahweh menghakimi antara aku dan engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Ketidakadilanku ada padamu.” Ungkapan ini juga dapat diterjemahkan “Kesalahanku ada padamu,” tetapi dalam konteksnya Sarai menuduh Abram bertanggung jawab atas ketidakadilan yang dialaminya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke dalam dadamu” atau “ke dalam pangkuanmu,” sebuah ungkapan halus untuk penerimaan yang intim.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: Ketidakadilan yang kualami menjadi tanggung jawabmu
  rationale: חָמָס dapat berarti kekerasan, kesalahan, atau ketidakadilan; sufiks orang pertama paling wajar menunjuk pada ketidakadilan yang dialami Sarai. עָלֶיךָ membebankan tanggung jawab kepada Abram.
- source_word: שִׁפְחָתִי
  choice: hambaku perempuan
  rationale: שִׁפְחָה menunjuk pada perempuan dalam status perhambaan. Ungkapan ini mempertahankan kenyataan sosial tersebut tanpa memakai istilah yang terlalu arkais.
- source_word: בְּחֵיקֶךָ
  choice: ke dalam pelukanmu
  rationale: Secara harfiah berarti 'ke dalam dada/pangkuanmu', tetapi di sini merupakan ungkapan halus untuk penerimaan intim. 'Ke dalam pelukanmu' mempertahankan metaforanya.
- source_word: הָרָתָה
  choice: telah mengandung
  rationale: Bentuk perfektif menyatakan bahwa pembuahan sudah terjadi; dalam konteks, Hagar menyadari keadaan itu.
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: aku menjadi hina di matanya
  rationale: Ungkapan ini menyatakan bahwa kedudukan Sarai menjadi rendah atau remeh menurut penilaian Hagar. Idiom 'di matanya' tetap jelas dalam bahasa Indonesia.
- source_word: יִשְׁפֹּט יְהוָה
  choice: Biarlah Yahweh menghakimi
  rationale: Bentuk jussif menyampaikan seruan agar Allah bertindak sebagai hakim; nama יהוה ditransliterasikan 'Yahweh'.
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: antara aku dan engkau
  rationale: Mempertahankan seruan langsung dan tegas kepada Abram serta struktur dua pihak dalam bahasa Ibrani.
theological_decisions:
- issue: Makna חֲמָסִי dalam tuduhan Sarai
  choice: Ketidakadilan yang kualami
  alternative: Kesalahanku
  rationale: Bentuk Ibrani secara harfiah dapat dibaca 'ketidakadilanku/kesalahanku', tetapi konteks dan עָלֶיךָ menunjukkan bahwa Sarai menuntut Abram bertanggung jawab atas perlakuan salah yang dialaminya. Alternatif literal dicatat agar ambiguitas tetap terlihat.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; 'Yahweh' mempertahankannya sebagai nama diri dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Daya ujar יִשְׁפֹּט
  choice: Biarlah Yahweh menghakimi
  alternative: Yahweh akan menghakimi
  rationale: Bentuknya paling wajar dipahami sebagai jussif, yakni seruan kepada penghakiman ilahi, bukan semata-mata ramalan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Engkau' dipakai dalam ujaran langsung untuk mempertahankan ketegasan dan nuansa sastra tanpa menjadi sukar dipahami; status perhambaan Hagar dinyatakan secara eksplisit.
