  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: id
  text: Lalu ia berkata, “Hagar, budak perempuan[a] Sarai, dari mana engkau datang dan ke mana engkau pergi?” Ia menjawab, “Aku sedang melarikan diri dari hadapan[b] Sarai, nyonyaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “hamba perempuan” atau “pelayan perempuan”; kata Ibrani ini menunjuk kepada seorang perempuan yang berstatus diperbudak atau berada dalam pengabdian terikat di bawah Sarai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari hadapan”; dalam konteks ini berarti melarikan diri atau menjauh dari Sarai.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: budak perempuan
  rationale: Istilah Ibrani ini menunjuk kepada seorang perempuan yang berstatus diperbudak atau berada dalam pengabdian terikat. Pilihan ini mempertahankan jenis kelamin dan ketimpangan status sosialnya tanpa memperhalusnya menjadi sekadar pelayan.
- source_word: אֵי מִזֶּה
  choice: dari mana engkau datang
  rationale: Ungkapan ini menanyakan tempat asal atau titik keberangkatan; bentuk ini alami dalam bahasa Indonesia dan dekat dengan susunan Ibraninya.
- source_word: וְאָנָה תֵלֵכִי
  choice: dan ke mana engkau pergi
  rationale: אָנָה bersama kata kerja pergi menanyakan tujuan. Bentuk kini dalam bahasa Indonesia sesuai dengan tindakan yang sedang dituju tanpa menutup nuansa mendatang.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Secara harfiah berarti 'dari hadapan/wajah'. Ungkapan ini dipertahankan dalam teks untuk mencerminkan bentuk sumber, sementara catatan menjelaskan makna kontekstualnya, yaitu menjauh atau melarikan diri dari seseorang.
- source_word: גְּבִרְתִּי
  choice: nyonyaku
  rationale: Bentuk feminin ini menyebut perempuan yang berkedudukan sebagai atasan atau pemilik. 'Nyonyaku' menyampaikan hubungan hierarkis tersebut secara ringkas dan wajar dalam ujaran langsung.
- source_word: בֹּרַחַת
  choice: Aku sedang melarikan diri
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung; 'sedang melarikan diri' mempertahankan aspek duratif dan keseriusan pelarian itu.
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Subjeknya diketahui dari ayat sebelumnya, tetapi ayat ini hanya memakai bentuk verbal maskulin tunggal. Pronomina 'ia' tidak mengulang identitas pembicara yang tidak disebut ulang dalam teks ayat ini.
- source_word: שָׂרַי
  choice: Sarai
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָגָר
  choice: Hagar
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Penyajian status sosial Hagar
  choice: budak perempuan
  alternative: hamba perempuan; pelayan perempuan
  rationale: Ayat ini mengidentifikasi Hagar melalui statusnya yang terikat dan berada di bawah kuasa Sarai. Terjemahan tidak memperhalus hubungan tersebut, tetapi catatan tetap menyebut padanan tradisional yang mungkin dijumpai pembaca.
- issue: Apakah identitas pembicara sebagai malaikat TUHAN perlu disebut ulang
  choice: Lalu ia berkata
  alternative: Lalu malaikat TUHAN berkata
  rationale: Konteks ayat sebelumnya menjelaskan antesedennya, tetapi teks Ibrani ayat ini tidak mengulang gelar itu. Terjemahan mempertahankan rujukan pronominal agar tidak menambahkan keterangan ke dalam ayat.
- issue: Nuansa מִפְּנֵי dalam jawaban Hagar
  choice: dari hadapan
  alternative: dari; menjauh dari
  rationale: Bentuk harfiahnya dipertahankan karena dapat menyiratkan baik keberadaan di hadapan Sarai maupun tindakan menjauh dari kuasanya. Catatan menerangkan fungsi idiomatisnya tanpa menghapus citra sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan 'engkau' dipakai untuk ujaran langsung yang serius; 'nyonyaku' mempertahankan bentuk feminin dan hubungan hierarkis. Susunan kalimat dibuat alami tanpa menghilangkan citra penting dari bahasa Ibrani.
