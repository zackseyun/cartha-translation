id: GEN.16.10
reference: Genesis 16:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: id
  text: Kemudian malaikat Yahweh berkata kepadanya[a], “Aku akan membuat keturunanmu menjadi sangat banyak, sehingga tidak dapat dihitung karena begitu banyak jumlahnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “Kemudian” menyampaikan urutan naratif secara alami dalam bahasa Indonesia modern.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti “utusan” atau “malaikat”; dalam rumusan berulang di Kitab Kejadian, “malaikat Yahweh” merupakan padanan yang wajar, sementara alternatif leksikalnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: הַרְבָּה אַרְבֶּה
  choice: Aku akan membuat ... menjadi sangat banyak
  rationale: Gabungan infinitif absolut dan verba finit menegaskan peningkatan besar dalam jumlah. Rumusan ini menyampaikan intensifikasi secara alami tanpa mengalihkannya menjadi penekanan pada kepastian.
- source_word: זַרְעֵךְ
  choice: keturunanmu
  rationale: זֶרַע merupakan nomina kolektif; “keturunan” adalah padanan Indonesia yang alami dan dapat menunjuk keseluruhan garis keturunan.
- source_word: וְלֹא יִסָּפֵר
  choice: sehingga tidak dapat dihitung
  rationale: Bentuk Nifal menyatakan tidak dapat dihitung; “sehingga” mengungkapkan hubungan akibat yang tersirat dalam konteks.
- source_word: מֵרֹב
  choice: karena begitu banyak jumlahnya
  rationale: מִן dengan רֹב menyatakan alasan, yakni karena jumlah yang sangat besar; rumusan Indonesia ini jelas dan idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: “Malaikat” sesuai dengan pemakaian tradisional dan konteks tokoh surgawi, tetapi arti dasar “utusan” tetap mungkin dan dicatat tanpa menetapkan identitas tokoh itu lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur kalimat mempertahankan alur naratif, penegasan besarnya pertambahan keturunan, serta ambiguitas leksikal מַלְאַךְ.
