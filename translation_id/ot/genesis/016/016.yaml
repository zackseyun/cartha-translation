  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: id
  text: Abram berumur delapan puluh enam tahun ketika Hagar melahirkan Ismael bagi Abram.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk Abram.” Dalam konteks ini, preposisi Ibrani tersebut dapat diterjemahkan dengan kedua cara itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: Abram
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: berumur ... tahun
  rationale: Dalam rumusan usia, בֶּן menyatakan umur, bukan hubungan sebagai anak; ungkapan Indonesia yang alami ialah 'berumur ... tahun'.
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: delapan puluh enam tahun
  rationale: Bilangan Ibrani gabungan ini menyatakan usia delapan puluh enam tahun dan diterjemahkan menurut susunan bilangan Indonesia modern.
- source_word: בְּ/לֶדֶת
  choice: ketika ... melahirkan
  rationale: Preposisi בְּ dengan infinitif konstruk ילד membentuk keterangan waktu; klausa 'ketika ... melahirkan' menyampaikan maknanya dengan wajar.
- source_word: הָגָר
  choice: Hagar
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶת יִשְׁמָעֵאל
  choice: Ismael
  rationale: Penanda objek langsung אֶת tidak diterjemahkan, sedangkan nama יִשְׁמָעֵאל memakai bentuk Indonesia yang lazim.
- source_word: לְ/אַבְרָם
  choice: bagi Abram
  rationale: Preposisi לְ menunjukkan hubungan kelahiran anak itu dengan Abram. 'Bagi Abram' alami dalam bahasa Indonesia, sementara kemungkinan 'untuk Abram' dicatat karena cakupan preposisinya.
