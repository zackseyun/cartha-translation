  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: id
  text: Lalu Abram berkata kepada Sarai, “Lihat, budak perempuanmu ada dalam kuasamu. Berbuatlah kepadanya apa yang baik di matamu.” Lalu Sarai memperlakukan dia dengan keras[a], dan perempuan itu melarikan diri dari hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyengsarakannya,” “merendahkannya,” atau “menindasnya.” Kata kerja Ibrani ini dapat menunjuk pada penderitaan yang ditimpakan, penghinaan, atau perlakuan keras.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Penanda wacana modern yang mempertahankan daya penunjuk dan penekanan dalam ucapan Abram tanpa memakai bentuk arkais.
- source_word: שִׁפְחָתֵךְ
  choice: budak perempuanmu
  rationale: Menunjukkan secara terbuka status terikat Hagar dalam rumah tangga dan tidak melunakkannya menjadi sekadar pelayan.
- source_word: בְּיָדֵךְ
  choice: ada dalam kuasamu
  rationale: Menyampaikan makna idiom Ibrani ‘dalam tanganmu’ secara wajar dalam bahasa Indonesia, yaitu berada di bawah wewenang atau kendali Sarai.
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: Berbuatlah kepadanya apa yang baik di matamu
  rationale: Mempertahankan idiom evaluatif Ibrani ‘baik di matamu’ sekaligus tetap dapat dipahami pembaca modern.
- source_word: וַתְּעַנֶּהָ
  choice: menindasnya
  rationale: Bentuk piel dari ענה menyatakan tindakan yang menyebabkan penderitaan, penghinaan, atau perlakuan keras. ‘Menindasnya’ mempertahankan bobot tindakan dan ketimpangan kuasa tanpa menentukan bentuk perlakuannya secara lebih rinci.
- source_word: וַתִּבְרַח
  choice: melarikan diri
  rationale: Ungkapan Indonesia yang alami dan serius untuk tindakan meninggalkan tempat karena ancaman atau tekanan.
- source_word: מִפָּנֶיהָ
  choice: dari hadapannya
  rationale: Mempertahankan gambaran ungkapan Ibrani secara cukup dekat dalam ragam naratif yang bermartabat.
theological_decisions:
- issue: Status sosial Hagar
  choice: budak perempuan
  alternative: hamba perempuan; pelayan perempuan
  rationale: Konteks menonjolkan hierarki kuasa dalam rumah tangga. ‘Budak perempuan’ mempertahankan kenyataan status terikat Hagar dan tidak mengaburkannya sebagai pelayanan sukarela.
- issue: Kerasnya perlakuan Sarai dalam וַתְּעַנֶּהָ
  choice: menindasnya
  alternative: memperlakukannya dengan keras; menyengsarakannya; merendahkannya
  rationale: Kata Ibrani menunjukkan penderitaan atau perlakuan yang merendahkan, tetapi ayat ini tidak menyebut bentuk tindakan itu. Terjemahan utama menyatakan bobotnya tanpa menambahkan rincian, sedangkan keluasan maknanya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Struktur ‘apa yang baik di matamu’ serta ‘dari hadapannya’ dipertahankan untuk menjaga warna ungkapan Ibrani, sedangkan ‘dalam kuasamu’ dipilih agar makna idiom kekuasaan tetap jelas dan alami.
