translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Dua klausa dipisahkan menjadi dua kalimat agar rujukan subjek tetap jelas bagi pembaca umum. Pengulangan nama Abram dan Sarai menghindari ambiguitas pronomina tanpa mengubah hubungan yang dinyatakan teks sumber.
