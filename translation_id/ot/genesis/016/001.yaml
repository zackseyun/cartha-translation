  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: id
  text: Sarai, istri Abram, tidak melahirkan anak bagi Abram, dan ia mempunyai seorang perempuan budak[a] Mesir bernama Hagar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pelayan perempuan.” Kata Ibrani שִׁפְחָה menunjuk pada perempuan yang menjadi budak atau pelayan rumah tangga dalam status terikat; “perempuan budak” dipakai di sini untuk mempertahankan kenyataan status sosialnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: Sarai
  rationale: Nama diri ditransliterasikan sebagai “Sarai”. Konjungsi וְ tidak dinyatakan secara tersendiri karena ayat ini membuka latar narasi dan bahasa Indonesia tidak memerlukannya.
- source_word: אֵשֶׁת אַבְרָם
  choice: istri Abram
  rationale: Rangkaian konstruksi ini secara langsung menyatakan hubungan perkawinan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: לֹא יָלְדָה לוֹ
  choice: belum melahirkan anak bagi Abram
  rationale: Kata יָלַד dalam konteks ini menunjuk pada melahirkan keturunan bagi suami. “Anak” dibuat eksplisit agar ungkapannya lengkap dalam bahasa Indonesia, sedangkan “belum” cocok dengan keadaan latar yang masih berlangsung pada titik narasi ini.
- source_word: וְלָהּ
  choice: Sarai mempunyai
  rationale: Konstruksi kepunyaan harfiah “dan padanya ada” dialihkan menjadi ungkapan kepunyaan yang alami. Nama “Sarai” diulang untuk menghindari kerancuan rujukan.
- source_word: שִׁפְחָה
  choice: perempuan budak
  rationale: Istilah ini menunjuk pada perempuan dalam status budak atau pelayan rumah tangga yang terikat. “Perempuan budak” mempertahankan kenyataan status sosial tersebut tanpa menghaluskannya menjadi sekadar pekerja.
- source_word: מִצְרִית
  choice: Mesir
  rationale: Kata sifat ini menerangkan asal atau kebangsaan perempuan itu; “perempuan budak Mesir” merupakan susunan yang alami.
- source_word: וּשְׁמָהּ הָגָר
  choice: bernama Hagar
  rationale: Ungkapan ringkas ini menyampaikan identifikasi nama secara lengkap dan alami; “Hagar” dipertahankan sebagai transliterasi nama diri.
