id: GEN.16.12
reference: Genesis 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: id
  text: Ia akan menjadi orang yang bagaikan keledai liar[a]. Tangannya akan melawan semua orang, dan tangan semua orang akan melawan dia. Ia akan tinggal berhadapan[b] dengan semua saudaranya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani menghubungkannya dengan keledai liar. Gambaran ini menyiratkan kebebasan yang tidak terkekang, bukan sekadar menyebutnya sebagai orang yang 'liar'.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani juga dapat diterjemahkan 'di hadapan' atau 'berseberangan dengan'; ungkapan itu dapat menunjukkan tempat tinggal di depan, berseberangan, atau dalam sikap menentang.
    reason: lexical_alternative
  - marker: c
    text: '''Saudara'' juga dapat mencakup sanak saudara atau bangsa-bangsa yang berkerabat, bukan hanya saudara kandung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: orang yang bagaikan keledai liar
  rationale: פֶּרֶא secara khusus berarti keledai liar, bukan sekadar sifat liar. Ungkapan ini mempertahankan gambaran binatang yang hidup bebas dan sukar dikekang, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: אָדָם
  choice: orang
  rationale: Di sini אָדָם menunjuk kepada Ismael sebagai seorang individu, bukan kepada umat manusia secara umum. 'Orang' alami dalam konstruksi perbandingan ini.
- source_word: יָדוֹ בַכֹּל
  choice: Tangannya akan melawan semua orang
  rationale: Kata 'tangan' menggambarkan tindakan atau kekuatan yang diarahkan melawan pihak lain. Bentuk ini mempertahankan citra dan kesejajaran Ibrani.
- source_word: וְיַד כֹּל בּוֹ
  choice: dan tangan semua orang akan melawan dia
  rationale: Terjemahan ini mempertahankan kesejajaran dengan klausa sebelumnya dan menyampaikan permusuhan timbal balik tanpa menghilangkan citra 'tangan'.
- source_word: וְעַל־פְּנֵי
  choice: berhadapan dengan
  rationale: Ungkapan ini dapat menyatakan posisi di depan, berseberangan, atau hubungan yang bersifat menentang. 'Berhadapan dengan' mempertahankan cakupan spasial-relasional tanpa menetapkan arah mata angin atau sikap menantang secara mutlak.
- source_word: כָּל־אֶחָיו
  choice: semua saudaranya
  rationale: אָח terutama berarti saudara, tetapi dapat meluas kepada sanak saudara atau kelompok kerabat. Arti dasarnya dipertahankan dalam teks utama dan cakupan yang lebih luas dijelaskan dalam catatan kaki.
- source_word: יִשְׁכֹּן
  choice: akan tinggal
  rationale: שׁכן berarti tinggal, menetap, atau berdiam. 'Akan tinggal' jelas, alami, dan sesuai dengan bentuk prediktif ayat ini.
theological_decisions:
- issue: Penggambaran Ismael melalui metafora פֶּרֶא אָדָם
  choice: Mempertahankan perbandingan dengan keledai liar secara eksplisit
  alternative: Menerjemahkannya hanya sebagai 'orang liar'
  rationale: Teks Ibrani memakai gambaran konkret tentang keledai liar. Mempertahankannya menghindari penyempitan menjadi penilaian moral umum dan tetap membuka nuansa kebebasan yang tidak terkekang serta konflik yang menyertainya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Metafora keledai liar dan kesejajaran 'tangan ... tangan' dipertahankan, sementara bentuk 'bagaikan' membuat hubungan metaforisnya alami dalam bahasa Indonesia. Ambiguitas וְעַל־פְּנֵי dan cakupan אָח dijaga melalui catatan kaki.
