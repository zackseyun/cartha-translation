  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: id
  text: Kemudian malaikat Yahweh berkata kepadanya[a], “Sesungguhnya, engkau sedang mengandung dan akan melahirkan seorang anak laki-laki. Engkau akan menamainya Ismael, karena Yahweh telah mendengar penderitaanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti ‘utusan’ atau ‘malaikat’. Dalam konteks ini, ‘malaikat’ merupakan sebutan alami bagi utusan surgawi, sedangkan nama ilahi יְהוָה dipertahankan sebagai ‘Yahweh’.
- source_word: הִנָּךְ הָרָה
  choice: Sesungguhnya, engkau sedang mengandung
  rationale: הִנָּךְ menandai perhatian dalam suatu pengumuman khidmat; ‘Sesungguhnya’ wajar dalam ragam Alkitab Indonesia. הָרָה menyatakan keadaan Hagar secara langsung sebagai sedang mengandung.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: dan akan melahirkan seorang anak laki-laki
  rationale: Ungkapan ini mengumumkan kelahiran pada masa mendatang. ‘Melahirkan seorang anak laki-laki’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: וְקָרָאת שְׁמוֹ
  choice: Engkau harus menamainya
  rationale: Idiom Ibrani harfiahnya ‘engkau akan memanggil namanya’. Dalam bahasa Indonesia, ‘harus menamainya’ menyampaikan formula penamaan sekaligus daya instruktif bentuk tersebut secara alami.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. Makna nama itu diterangkan oleh klausa alasan sesudahnya, bukan dimasukkan ke dalam nama.
- source_word: כִּי שָׁמַע יְהוָה
  choice: karena Yahweh telah mendengar
  rationale: כִּי memperkenalkan alasan pemberian nama. Bentuk perfektif שָׁמַע mempunyai relevansi kini, sehingga ‘telah mendengar’ tepat.
- source_word: עָנְיֵךְ
  choice: penderitaanmu
  rationale: עֳנִי mencakup kesengsaraan, penindasan, dan keadaan menderita. ‘Penderitaan’ cukup luas dan mudah dipahami tanpa mempersempit maknanya pada rasa malu atau emosi saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Terjemahan mempertahankan ungkapan Ibrani tanpa menambahkan identifikasi teologis yang lebih khusus, seperti menyatakannya secara eksplisit sebagai penampakan pra-inkarnasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Sesungguhnya’ mempertahankan daya pengumuman הִנָּךְ, sementara susunan kalimat dibagi agar alami dan mudah dibaca. Pronomina ‘engkau’ dipakai untuk menjaga register naratif Alkitab yang bermartabat.
