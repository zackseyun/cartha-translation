  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: id
  text: Itulah sebabnya sumur itu disebut Beer-Lahai-Roi.[a] Lihatlah, sumur itu terletak di antara Kadesh dan Bered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beer-Lahai-Roi kemungkinan berarti “Sumur milik Yang Hidup yang melihat aku.” Makna tepat nama Ibrani ini tidak pasti.
    reason: Nama Ibrani בְּאֵר לַחַי רֹאִי merupakan ungkapan padat yang terkait dengan perkataan Hagar pada ayat sebelumnya; catatan memberikan pengertian utama tanpa menghilangkan ketidakpastian bentuknya.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Mengungkapkan hubungan sebab-akibat secara alami dalam bahasa Indonesia modern.
- source_word: קָרָא לַבְּאֵר
  choice: sumur itu disebut
  rationale: Bentuk Ibrani secara harfiah dapat berarti 'ia menyebut/menamai sumur itu', tetapi pelakunya tidak dinyatakan; bentuk pasif Indonesia mempertahankan ketidakjelasan itu.
- source_word: בְּאֵר לַחַי רֹאִי
  choice: Beer-Lahai-Roi
  rationale: Nama tempat ditransliterasikan karena permainan makna dan bentuk nama telah dibangun dalam ayat sebelumnya.
- source_word: הִנֵּה
  choice: Sumur itu terletak
  rationale: Partikel penunjuk mengarahkan perhatian pada lokasi sumur; dalam bahasa Indonesia, informasi geografis ini lebih alami dinyatakan secara langsung daripada dengan seruan 'Lihatlah'.
- source_word: בֵין קָדֵשׁ וּבֵין בָּרֶד
  choice: di antara Kadesh dan Bered
  rationale: Menerjemahkan konstruksi lokasi secara langsung dan mempertahankan kedua nama tempat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama-nama tempat mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Penunjuk הִנֵּה diserap ke dalam pernyataan lokasi agar tidak terdengar kaku, sementara fungsinya untuk menyoroti lokasi tetap dipertahankan.
