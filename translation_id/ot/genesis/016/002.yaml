  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: id
  text: Lalu Sarai berkata kepada Abram, “Lihatlah, Yahweh telah mencegah aku melahirkan anak. Tolong datangilah budak perempuanku; mungkin aku akan dibangun melalui dia.[a]” Lalu Abram mendengarkan perkataan Sarai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “aku akan dibangun melalui dia” dapat berarti “aku akan memperoleh anak melalui dia” atau “keluargaku akan dibangun melalui dia.” Bahasa Ibraninya secara harfiah mempertahankan gambaran tentang dibangun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” memberi alur naratif yang alami.
- source_word: הִנֵּה נָא
  choice: Lihatlah
  rationale: Ungkapan ini menarik perhatian kepada keadaan yang sedang dikemukakan. “Lihatlah” tetap bermartabat dan wajar dalam bahasa Indonesia.
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: Yahweh telah mencegah aku melahirkan anak
  rationale: Menjaga pernyataan eksplisit Sarai bahwa Yahweh menghalanginya dari melahirkan, tanpa menambahkan penjelasan teologis.
- source_word: בֹּא נָא אֶל
  choice: Tolong hampirilah
  rationale: Mempertahankan ungkapan halus Ibrani untuk hubungan seksual. Dalam konteks ini “menghampiri” dapat dipahami tanpa menjadi terlalu eksplisit.
- source_word: שִׁפְחָתִי
  choice: budak perempuanku
  rationale: Menunjukkan status terikat yang terkandung dalam שִׁפְחָה dan tidak memperhalusnya menjadi sekadar pelayan.
- source_word: אוּלַי אִבָּנֶה מִמֶּנָּה
  choice: mungkin aku akan dibangun melalui dia
  rationale: Mempertahankan metafora pasif dari akar בנה serta kemungkinan makna pembentukan keluarga melalui anak yang dilahirkan budak perempuan itu.
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: Abram pun mendengarkan perkataan Sarai
  rationale: Ungkapan Ibrani harfiahnya “mendengarkan suara”; “mendengarkan perkataan” alami dalam bahasa Indonesia dan masih menjaga gagasan bahwa Abram menerima apa yang Sarai katakan.
theological_decisions:
- issue: Peran Yahweh dalam keadaan Sarai yang tidak mempunyai anak
  choice: Yahweh telah mencegah aku melahirkan anak
  alternative: Yahweh belum mengizinkan aku melahirkan anak
  rationale: Teks mengaitkan keadaan itu secara langsung dengan tindakan Yahweh. Terjemahan tidak melunakkan klaim tersebut.
- issue: Tingkat kejelasan ungkapan untuk hubungan seksual
  choice: Tolong hampirilah budak perempuanku
  alternative: Tolong berhubunganlah dengan budak perempuanku
  rationale: Sumber memakai eufemisme konvensional. Pilihan utama mempertahankan register halusnya, sementara konteks menjelaskan maksudnya.
- issue: Metafora Sarai tentang memperoleh keluarga melalui budaknya
  choice: mungkin aku akan dibangun melalui dia
  alternative: mungkin aku akan memperoleh anak melalui dia
  rationale: Pilihan utama mempertahankan metafora Ibrani dan ketegangan maknanya; arti idiomatis dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama ilahi ditransliterasikan sebagai “Yahweh.” Eufemisme seksual dan metafora “dibangun” dipertahankan sejauh masih dapat dipahami; catatan kaki menerangkan makna idiomatis tanpa menghapus ambiguitas sumber.
