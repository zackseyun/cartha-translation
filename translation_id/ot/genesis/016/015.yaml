  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: id
  text: Hagar melahirkan seorang anak laki-laki bagi Abram, lalu Abram menamai anaknya yang dilahirkan Hagar itu Ismael.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Dalam bentuk Qal dengan subjek perempuan, ילד berarti ‘melahirkan’; pilihan ini alami dan jelas dalam bahasa Indonesia modern.
- source_word: לְאַבְרָם
  choice: bagi Abram
  rationale: 'Preposisi ל menyatakan hubungan atau penerima manfaat: anak itu dilahirkan sebagai anak bagi Abram.'
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Nomina Ibrani tanpa artikel ini menyatakan seorang anak laki-laki; bentuk Indonesia ini alami sesudah ‘melahirkan’.
- source_word: וַיִּקְרָא ... שֵׁם
  choice: menamai
  rationale: Ungkapan Ibrani harfiah ‘memanggil nama’ secara idiomatis berarti memberi nama; ‘menamai’ mempertahankan makna dengan bahasa Indonesia yang wajar.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Akhiran pronominal menunjukkan bahwa anak tersebut adalah anak Abram.
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: yang dilahirkan Hagar itu
  rationale: Klausa relatif ini mengidentifikasi anak yang baru disebut dan mempertahankan penyebutan Hagar secara eksplisit.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Menggunakan bentuk nama yang sudah mapan dalam bahasa Indonesia.
