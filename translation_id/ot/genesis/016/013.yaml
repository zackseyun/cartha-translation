reference: Genesis 16:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: id
  text: Maka ia menamai Yahweh yang telah berbicara kepadanya, “Engkaulah Allah yang melihat aku,”[a] sebab katanya, “Benarkah di sini aku telah melihat Dia setelah Dia melihat aku?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkaulah Allah yang melihat,” atau, “Engkaulah Allah penglihatan.”
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir dalam bahasa Ibrani sulit dipahami. Mungkin artinya, “Benarkah di sini aku telah melihat Dia dan tetap hidup setelah Dia melihat aku?”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: ia menyebut Yahweh
  rationale: Ungkapan Ibrani harfiah 'memanggil/menyebut nama Yahweh' di sini berarti Hagar menyematkan sebutan kepada Yahweh. Bentuk Indonesia ini alami dan tidak menimbulkan kesan bahwa ia sekadar mengucapkan nama ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar TUHAN.
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: yang telah berbicara kepadanya
  rationale: Klausa relatif ini secara wajar mengidentifikasi Yahweh sebagai Dia yang berbicara kepada Hagar dalam peristiwa tersebut.
- source_word: אַתָּה אֵל רֳאִי
  choice: Engkaulah Allah yang melihat aku
  rationale: רֳאִי sulit ditafsirkan dan dapat berkaitan dengan 'melihat' atau 'yang melihat aku'. Terjemahan ini sesuai dengan konteks perhatian Allah kepada Hagar, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: כִּי אָֽמְרָה
  choice: sebab katanya
  rationale: כִּי memperkenalkan alasan atau penjelasan bagi sebutan yang baru diberikan.
- source_word: הֲגַם הֲלֹם
  choice: Benarkah di sini
  rationale: Gabungan partikel pertanyaan dan penegasan mengungkapkan keterkejutan Hagar bahwa perjumpaan itu terjadi bahkan di tempat ini.
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: aku telah melihat Dia setelah Dia melihat aku
  rationale: Frasa Ibrani ini sangat sulit dan padat. Terjemahan mempertahankan urutan gagasan 'melihat ... setelah ... melihat aku' tanpa memasukkan secara diam-diam penafsiran bahwa Hagar tetap hidup.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi Yahweh mempertahankan fungsi nama tersebut.
- issue: Makna gelar אֵל רֳאִי
  choice: Allah yang melihat aku
  alternative: Allah yang melihat; Allah penglihatan
  rationale: Pilihan utama menonjolkan bahwa Allah memperhatikan Hagar, sesuai konteks, tetapi tidak meniadakan ketidakpastian bentuk Ibraninya; alternatif dicatat.
- issue: Makna klausa akhir רָאִיתִי אַחֲרֵי רֹאִי
  choice: aku telah melihat Dia setelah Dia melihat aku
  alternative: aku telah melihat Dia dan tetap hidup setelah Dia melihat aku
  rationale: Teks Ibrani terkenal sulit. Teks utama menjaga ketegangan antara Hagar melihat Allah dan dirinya telah dilihat oleh Allah, sedangkan penafsiran tentang tetap hidup ditempatkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kata ganti 'ia' dipakai bagi Hagar, sedangkan 'Engkau' dan 'Dia' dikapitalisasi ketika merujuk kepada Allah. Susunan akhir dijaga cukup dekat dengan bahasa Ibrani agar ambiguitas aslinya tidak hilang.
