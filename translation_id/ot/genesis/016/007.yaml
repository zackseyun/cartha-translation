  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: id
  text: Malaikat Yahweh[a] menemukannya di dekat sebuah mata air di padang belantara, di dekat mata air yang berada di jalan menuju Syur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Utusan Yahweh.” Kata Ibrani yang digunakan dapat berarti “malaikat” atau “utusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: menemukan Hagar
  rationale: Bentuk verba מצא berarti 'menemukan'; sufiks objek feminin tunggal merujuk kepada Hagar. Nama Hagar dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti 'utusan' atau 'malaikat'. Dalam konteks utusan ilahi, 'malaikat' merupakan padanan Indonesia yang lazim, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: עַל עֵין הַמַּיִם
  choice: di dekat sebuah mata air
  rationale: עַיִן bersama הַמַּיִם jelas menunjuk pada sumber air; עַל di sini menyatakan lokasi dan secara alami diterjemahkan 'di dekat'.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk pada wilayah liar, gersang, atau stepa, tidak selalu gurun pasir; 'padang belantara' mempertahankan cakupan tersebut.
- source_word: עַל הָעַיִן
  choice: yaitu mata air
  rationale: Pengulangan frasa melokalisasi mata air sebelumnya. 'Yaitu' membuat hubungan penjelas itu alami tanpa mengubah acuannya.
- source_word: בְּדֶרֶךְ שׁוּר
  choice: di jalan menuju Syur
  rationale: דֶּרֶךְ berarti jalan atau rute, dan konstruksi ini menunjukkan lokasi pada rute yang mengarah ke Syur.
theological_decisions:
- issue: Identitas dan sebutan מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  alternative: Utusan Yahweh
  rationale: Terjemahan utama memakai sebutan tradisional dan kontekstual 'malaikat', tetapi catatan kaki mempertahankan kemungkinan leksikal 'utusan' tanpa menetapkan lebih jauh identitas tokoh tersebut.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi 'Yahweh' mempertahankan nama ilahi yang secara eksplisit hadir dalam teks sumber, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan urutan naratif Ibrani sambil menghindari pengulangan lokatif yang terasa kaku. Nama tempat שׁוּר ditulis 'Syur' sesuai ejaan Indonesia.
