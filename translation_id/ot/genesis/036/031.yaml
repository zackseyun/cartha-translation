id: GEN.36.31
reference: Genesis 36:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: id
  text: Inilah raja-raja yang memerintah di tanah Edom sebelum seorang raja memerintah atas keturunan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebelum seorang raja memerintah bagi orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “sebelum seorang raja memerintah bagi/atas keturunan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini memperkenalkan daftar baru. 'Inilah' menyampaikan fungsi presentasional secara alami dalam bahasa Indonesia tanpa harus mempertahankan kata sambung Ibrani secara kaku.
- source_word: הַמְּלָכִים
  choice: raja-raja
  rationale: Bentuk jamak merujuk kepada para raja yang kemudian didaftarkan; konstruksi 'Inilah raja-raja' secara alami menyampaikan sifat definitnya.
- source_word: אֲשֶׁר מָלְכוּ
  choice: yang memerintah
  rationale: Kata kerja מלך dalam konteks ini berarti menjalankan pemerintahan sebagai raja. 'Memerintah' lebih alami daripada 'bertakhta' dan tetap tepat.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Mempertahankan unsur אֶרֶץ dan nuansa kewilayahan yang eksplisit dalam bahasa Ibrani.
- source_word: לִפְנֵי
  choice: sebelum
  rationale: Preposisi ini jelas dipakai dalam arti temporal.
- source_word: מְלָךְ מֶלֶךְ
  choice: seorang raja memerintah
  rationale: Mempertahankan kata benda tunggal tak tentu dalam bahasa Ibrani tanpa menambahkan gagasan 'raja mana pun'.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: atas keturunan Israel
  rationale: '''Keturunan Israel'' merupakan padanan Indonesia yang alami bagi nama kolektif בְּנֵי יִשְׂרָאֵל, sedangkan ''atas'' menyatakan hubungan pemerintahan yang tersirat oleh konteks.'
theological_decisions:
- issue: Padanan בְּנֵי יִשְׂרָאֵל sebagai sebutan kolektif
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Keturunan Israel'' mempertahankan hubungan genealogis dalam ungkapan Ibrani sekaligus mencakup umat itu secara kolektif dan terdengar wajar dalam bahasa Indonesia modern.'
- issue: Hubungan yang dinyatakan oleh לְ dalam לִבְנֵי יִשְׂרָאֵל
  choice: atas
  alternative: bagi
  rationale: Dalam konteks seorang raja yang memerintah, 'atas' menyampaikan hubungan kekuasaan secara idiomatis. Namun, karena preposisi Ibrani secara harfiah dapat dipahami sebagai 'bagi', alternatif itu dicatat dalam catatan kaki agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lugas untuk mengantar daftar raja. Istilah 'keturunan Israel' mempertahankan corak genealogis sumber tanpa terdengar kaku; catatan kaki menjaga kemungkinan makna preposisi Ibrani.
