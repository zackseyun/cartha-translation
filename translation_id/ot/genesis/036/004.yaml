base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: id
  text: Ada melahirkan Elifas bagi Esau, dan Basmat melahirkan Rehuel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: melahirkan
  rationale: Kedua bentuk berasal dari ילד, yang berarti ‘melahirkan’. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan para ibu sebagai subjek.
- source_word: לְעֵשָׂו
  choice: bagi Esau
  rationale: Preposisi ל dalam silsilah menandai hubungan anak yang dilahirkan dengan ayahnya; ‘bagi Esau’ mempertahankan nuansa tersebut tanpa menambah penafsiran.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Penanda objek langsung ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya terwakili oleh susunan kalimat.
- source_word: אֱלִיפָז
  choice: Elifas
  rationale: Nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim dan dekat dengan bentuk Ibrani.
- source_word: בָשְׂמַת
  choice: Basmat
  rationale: Transliterasi ringkas yang mencerminkan bentuk Masoret בָשְׂמַת dan sesuai dengan kebiasaan penamaan dalam Alkitab bahasa Indonesia.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Transliterasi ini mencerminkan bunyi Ibrani רְעוּאֵל dengan jelas bagi pembaca Indonesia.
- source_word: וּ
  choice: dan
  rationale: Kata sambung koordinatif sederhana yang menghubungkan kedua berita kelahiran.
