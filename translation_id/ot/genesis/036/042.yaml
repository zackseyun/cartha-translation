translation:
  language: id
  text: pemimpin Kenas[a], pemimpin Teman, pemimpin Mibzar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala kaum” untuk setiap kemunculan kata “pemimpin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin
  rationale: Dalam daftar keturunan dan kelompok Edom pada Kejadian 36, istilah ini menunjuk kepada seorang pemimpin suku atau kaum. “Pemimpin” ringkas, wajar dalam bahasa Indonesia modern, dan mempertahankan pola pengulangan teks Ibrani tanpa menambahkan “suku” atau “kaum” ke dalam teks utama.
- source_word: קְנַז
  choice: Kenas
  rationale: Nama diri atau nama kaum; ditransliterasikan sesuai pelafalan Ibrani dan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: תֵּימָן
  choice: Teman
  rationale: Di sini kata tersebut berfungsi sebagai nama dalam daftar para pemimpin Edom, bukan sebagai kata yang berarti “selatan” atau “tangan kanan”; karena itu ditransliterasikan.
- source_word: מִבְצָר
  choice: Mibzar
  rationale: Nama diri atau nama kaum; ditransliterasikan, bukan diterjemahkan menurut makna leksikal katanya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Pengulangan “pemimpin” dipertahankan untuk mencerminkan struktur daftar dalam teks Ibrani. Tanda baca dan huruf kecil mengikuti bentuk ayat yang merupakan kelanjutan daftar.
