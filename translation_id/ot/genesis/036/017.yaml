base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: id
  text: 'Dan inilah anak-anak Rehuel, anak Esau: kepala kaum[a] Nahat, kepala kaum Zerah, kepala kaum Syama, dan kepala kaum Miza. Inilah para kepala kaum Rehuel di tanah Edom. Inilah anak-anak Basmat, istri Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemimpin kaum”; istilah Ibrani ini menunjuk seorang pemimpin kelompok kekerabatan atau suku di Edom.
    reason: Menjelaskan cakupan istilah אַלּוּף dan mempertahankan kemungkinan padanan leksikal lain tanpa menentukan struktur sosial Edom secara lebih sempit daripada teks.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dan inilah
  rationale: Mempertahankan penghubung naratif sekaligus rumus pengantar silsilah dalam bahasa Indonesia yang wajar.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Daftar ini menyebut keturunan laki-laki secara langsung; padanan ini dekat dengan bentuk Ibrani dan alami dalam konteks silsilah.
- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: Rehuel, anak Esau
  rationale: Mempertahankan hubungan genealogis secara langsung, dengan tanda koma untuk memperjelas aposisi.
- source_word: אַלּוּף
  choice: kepala kaum
  rationale: Dalam konteks Edom, istilah ini menunjuk pemimpin kelompok kekerabatan atau suku. 'Kepala kaum' cukup jelas, ringkas, dan tidak memakai gelar feodal yang anakronistis.
- source_word: נַחַת
  choice: Nahat
  rationale: Transliterasi nama pribadi yang sesuai dengan ejaan Indonesia.
- source_word: זֶרַח
  choice: Zerah
  rationale: Transliterasi nama pribadi yang sesuai dengan kebiasaan ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: שַׁמָּה
  choice: Syama
  rationale: Transliterasi nama pribadi dengan 'sy' untuk bunyi konsonan Ibrani שׁ dan tanpa penggandaan konsonan yang tidak lazim dalam ejaan Indonesia.
- source_word: מִזָּה
  choice: Miza
  rationale: Transliterasi nama pribadi yang alami dalam ejaan Indonesia; penggandaan konsonan Ibrani tidak perlu ditampilkan.
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: Mereka inilah para kepala kaum Rehuel
  rationale: Merangkum kembali daftar sebelumnya sambil mempertahankan hubungan dengan Rehuel; 'mereka' memperjelas bahwa demonstratif menunjuk orang-orang yang baru disebut.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Mempertahankan unsur eksplisit 'tanah' dalam teks Ibrani.
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: Basmat, istri Esau
  rationale: Menyampaikan aposisi yang mengidentifikasi garis ibu secara jelas dan alami.
