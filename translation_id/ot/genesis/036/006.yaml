id: GEN.36.6
reference: Genesis 36:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: id
  text: Esau membawa istri-istrinya, anak-anak lelakinya, anak-anak perempuannya, dan semua orang dalam rumah tangganya, juga ternaknya, segala hewan miliknya, serta seluruh harta miliknya yang telah diperolehnya di tanah Kanaan. Lalu ia pergi ke suatu negeri[a] karena Yakub, saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “ke suatu negeri”. Sejumlah naskah dan terjemahan kuno mendukung bacaan “ke tanah Seir”; banyak terjemahan menerjemahkan frasa ini secara kontekstual sebagai “ke negeri lain”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks perpindahan tempat tinggal, bentuk harfiah 'mengambil' kurang alami dalam bahasa Indonesia; 'membawa' menyatakan bahwa Esau mengikutsertakan orang dan barang yang disebutkan.
- source_word: נָשָׁיו
  choice: istri-istrinya
  rationale: Bentuk jamak ini secara jelas merujuk kepada para istri Esau.
- source_word: בָּנָיו / בְּנֹתָיו
  choice: anak-anak lelakinya, anak-anak perempuannya
  rationale: Pembedaan antara anak lelaki dan anak perempuan dalam teks Ibrani dipertahankan.
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: semua orang dalam rumah tangganya
  rationale: Dalam ungkapan ini נֶפֶשׁ menunjuk kepada orang, bukan 'jiwa' sebagai istilah teologis; 'rumah tangga' mencakup seluruh anggota rumahnya.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: מִקְנֶה lazim menunjuk kepada ternak sebagai kekayaan bergerak.
- source_word: כָּל בְּהֶמְתּוֹ
  choice: segala hewan miliknya
  rationale: בְּהֵמָה merupakan istilah luas bagi hewan; pilihan ini mempertahankan pembedaan dari מִקְנֶה tanpa pengulangan 'ternak'.
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: seluruh harta miliknya yang telah diperolehnya
  rationale: קִנְיָן menunjuk kepada milik atau harta yang diperoleh, sedangkan רָכַשׁ menekankan tindakan memperolehnya.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur אֶרֶץ dan bentuk geografis sumber secara alami.
- source_word: אֶל אֶרֶץ
  choice: ke suatu negeri
  rationale: Teks Masoret berbunyi tak tentu, 'ke suatu negeri'; terjemahan tidak menambahkan 'lain' atau 'Seir' ke dalam teks utama.
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: karena Yakub, saudaranya
  rationale: מִפְּנֵי dapat menyatakan sebab maupun gerak menjauh dari hadapan seseorang. Konteks ayat berikutnya mendukung nuansa sebab, tetapi susunan ini tetap ringkas dan tidak menguraikan sebab tersebut.
theological_decisions:
- issue: 'Nuansa מִפְּנֵי: sebab atau arah menjauh'
  choice: karena Yakub, saudaranya
  alternative: menjauh dari Yakub, saudaranya
  rationale: Preposisi ini memungkinkan nuansa kausal dan spasial. Konteks Kejadian 36:7 menjelaskan tekanan yang menyebabkan perpisahan, sehingga nuansa kausal dipilih tanpa menyalahkan Yakub atau menambahkan motif yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kalimat sumber yang panjang dibagi menjadi dua agar mudah dipahami, sementara urutan perpindahan dan daftar anggota rumah tangga serta harta tetap dipertahankan.
