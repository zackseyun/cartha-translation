  yaml_path: translation/ot/genesis/036/020.yaml
  text: 'These are the sons of Seir the Horite[a], the inhabitants of the land: Lotan, Shobal, Zibeon, and Anah.'
translation:
  language: id
  text: 'Inilah anak-anak Seir, orang Hori, penduduk negeri itu[a]: Lotan, Syobal, Zibeon, dan Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang mendiami negeri itu.”
    reason: Alternatif leksikal untuk frasa partisipial Ibrani יֹשְׁבֵי הָאָרֶץ.
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk presentatif ini alami dalam bahasa Indonesia untuk memperkenalkan daftar silsilah.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Konteks langsung menyebut para putra laki-laki Seir; pilihan ini mempertahankan istilah kekerabatan Ibrani tanpa memperluasnya menjadi 'keturunan'.
- source_word: שֵׂעִיר הַחֹרִי
  choice: Seir, orang Hori
  rationale: Kata הַחֹרִי merupakan sebutan etnis tunggal yang menerangkan Seir; koma membuat hubungan aposisional itu jelas dan wajar dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: yang mendiami negeri itu
  rationale: Partisipel jamak ini menerangkan anak-anak Seir sebagai orang-orang yang menetap di wilayah yang sedang dibicarakan. 'Negeri itu' menjaga penunjukan definit dari הָאָרֶץ secara alami.
- source_word: לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה
  choice: Lotan, Syobal, Zibeon, dan Ana
  rationale: Nama-nama diri dialihaksarakan menurut bentuk yang lazim dan ejaan Indonesia; huruf שׁ pada Syobal diwakili dengan 'sy'.
