  terminology: “anak-anak” mempertahankan בְנֵי dalam gaya silsilah; “orang Hori” tepat untuk הַחֹרִי sebagai sebutan etnis bagi Seir. Bentuk nama Lotan, Syobal, Zibeon, dan Ana konsisten dengan transliterasi Indonesia yang lazim. Catatan kaki disediakan untuk alternatif partisipial yang dicatat dalam jejak audit bahasa Inggris.
