base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: id
  text: Pemimpin Magdiel, pemimpin Iram. Inilah para pemimpin Edom menurut tempat-tempat kediaman mereka di tanah milik mereka.[a] Itulah Esau, leluhur orang Edom.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri yang mereka miliki.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak Edom.”
    reason: literal_rendering
lexical_decisions:
- source_word: אַלּוּף / אַלּוּפֵי
  choice: pemimpin / para pemimpin
  rationale: Dalam konteks daftar orang Edom, istilah ini menunjuk kepada pemimpin kelompok suku atau kaum. “Pemimpin” alami dalam bahasa Indonesia modern dan tidak memasukkan gelar feodal yang tidak terdapat dalam konteks.
- source_word: מַגְדִּיאֵל
  choice: Magdiel
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: עִירָם
  choice: Iram
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: לְמֹשְׁבֹתָם
  choice: menurut tempat-tempat kediaman mereka
  rationale: Prefiks לְ menyatakan pengelompokan atau penataan menurut tempat tinggal; bentuk ini mempertahankan hubungan dengan daftar para pemimpin.
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: di tanah milik mereka
  rationale: אֲחֻזָּה menunjuk kepada milik atau tanah pegangan. Ungkapan ini ringkas, wajar, dan tetap mempertahankan gagasan kepemilikan.
- source_word: הוּא עֵשָׂו
  choice: Itulah Esau
  rationale: הוּא berfungsi sebagai pengenal penutup yang merangkum silsilah sebelumnya. “Itulah” menghindari kesan bahwa kata ganti tersebut hanya menunjuk kepada Iram.
- source_word: אֲבִי אֱדֹם
  choice: leluhur orang Edom
  rationale: אָב di sini bersifat genealogis dan menunjuk kepada nenek moyang suatu bangsa. “Leluhur orang Edom” menyampaikan maksud itu dengan jelas bagi pembaca Indonesia.
theological_decisions:
- issue: Sebutan genealogis bagi Esau dalam hubungannya dengan Edom
  choice: leluhur orang Edom
  alternative: bapak Edom
  rationale: Frasa tersebut mengidentifikasi Esau sebagai nenek moyang bangsa Edom, bukan semata-mata ayah langsung seseorang. Pilihan ini menjelaskan maksud etnis-genealogis tanpa menambahkan klaim teologis lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “pemimpin” mempertahankan corak daftar Ibrani, sedangkan “Itulah Esau” memberi penutup rangkuman yang jelas.
