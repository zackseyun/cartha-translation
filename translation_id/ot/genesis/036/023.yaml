  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat yang sesuai untuk daftar silsilah. Nama-nama ditransliterasikan menurut ejaan Indonesia, dan semua penanda catatan kaki dicantumkan tepat setelah nama terkait.
