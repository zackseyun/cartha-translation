  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: id
  text: 'Inilah anak-anak Syobal: Alwan[a], Manahat, Ebal, Syefo[b], dan Onam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi Alwan; silsilah paralel dalam 1 Tawarikh 1:40 berbunyi Alian.
    reason: alternative_reading
  - marker: b
    text: Teks Ibrani di sini berbunyi Syefo; silsilah paralel dalam 1 Tawarikh 1:40 berbunyi Syefi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Rumus ini memperkenalkan daftar silsilah berikutnya. “Inilah” menyampaikan fungsi demonstratifnya secara alami dalam bahasa Indonesia; waw tidak perlu diterjemahkan secara tersendiri.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Konteksnya adalah daftar keturunan laki-laki langsung. Dalam bahasa Indonesia, “anak-anak” wajar dan tidak perlu diberi penanda gender karena semua nama dalam daftar menunjukkan anak laki-laki.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani dengan ejaan Indonesia; שׁ direpresentasikan sebagai “sy”.
- source_word: עַלְוָן
  choice: Alwan
  rationale: Nama diri ditransliterasikan dari bentuk teks Masoret; konsonan ו di sini direpresentasikan sebagai “w” menurut kebiasaan ejaan Indonesia.
- source_word: וּ/מָנַחַת
  choice: Manahat
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani; konjungsi diwujudkan melalui tata tanda baca daftar Indonesia.
- source_word: וְ/עֵיבָל
  choice: Ebal
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: שְׁפוֹ
  choice: Syefo
  rationale: Nama diri mengikuti bentuk teks Masoret ayat ini, dengan שׁ sebagai “sy”; bentuk berbeda dalam silsilah paralel dicatat dalam catatan kaki.
- source_word: וְ/אוֹנָם
  choice: dan Onam
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani, dan konjungsi dipertahankan sebagai “dan” sebelum unsur terakhir dalam daftar.
