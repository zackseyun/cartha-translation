  text: אֵ֖לֶּה אַלּוּפֵ֣י הַ/חֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: id
  text: 'Inilah para pemimpin orang Hori: pemimpin Lotan[a], pemimpin Syobal, pemimpin Zibeon, dan pemimpin Ana.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala kaum” atau “kepala suku”; istilah Ibrani ini dapat menunjuk kepada kepala suatu kaum atau suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk penunjuk jamak ini memperkenalkan daftar; "Inilah" merupakan ungkapan Indonesia yang alami dan mencakup kopula yang tersirat.
- source_word: אַלּוּפֵי / אַלּוּף
  choice: para pemimpin / pemimpin
  rationale: Dalam konteks Kejadian 36, istilah ini menunjuk kepada kepala kelompok kekerabatan atau suku. "Pemimpin" jelas dalam bahasa Indonesia modern, sementara pengulangan bentuk tunggal sebelum setiap nama dipertahankan.
- source_word: הַחֹרִי
  choice: orang Hori
  rationale: Walaupun secara morfologis berbentuk gentilik tunggal dengan kata sandang, istilah ini berfungsi kolektif sebagai sebutan kelompok etnis; "orang Hori" alami dalam bahasa Indonesia.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שׁוֹבָל
  choice: Syobal
  rationale: Nama pribadi ditransliterasikan dengan ejaan Indonesia yang lazim, memakai "sy" untuk bunyi Ibrani shin.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֲנָה
  choice: Ana
  rationale: Nama pribadi ditransliterasikan secara wajar ke dalam bahasa Indonesia tanpa mempertahankan huruf akhir h yang tidak dibunyikan.
