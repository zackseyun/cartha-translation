  source_fidelity: Teks menerjemahkan אֵלֶּה secara idiomatis sebagai “Inilah” dan dengan tepat memperkenalkan daftar para אַלּוּפֵי (pemimpin) orang Hori. Pengulangan “pemimpin” sebelum tiap nama mempertahankan penekanan dan struktur sumber Ibrani. Nama-nama Lotan, Syobal, Zibeon, dan Ana sesuai dengan bentuk Indonesia yang lazim dan merepresentasikan nama Ibrani dengan baik.
  naturalness: Bahasa Indonesia baku, jelas, dan alami. “Inilah para pemimpin orang Hori” diikuti daftar berulang merupakan gaya yang wajar untuk teks silsilah atau daftar kuno. Penambahan “dan” sebelum nama terakhir memperlancar daftar dalam bahasa Indonesia tanpa mengubah makna.
