  source_fidelity: 'Teks Indonesia dengan setia mencerminkan urutan nama dan rumus identifikasi dalam Ibrani: Disyon, Ezer, dan Disyan; kemudian para pemimpin kelompok Hori yang merupakan keturunan Seir di tanah Edom. Frasa “keturunan Seir” merupakan padanan yang wajar bagi בְּנֵי־שֵׂעִיר tanpa memaksakan pembacaan biologis yang terlalu sempit.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. “Mereka inilah para kepala suku orang Hori” merupakan pengungkapan idiomatis untuk demonstratif plural diikuti predikat nominal, sementara “di tanah Edom” mempertahankan nuansa geografis teks sumber.
  terminology: Pembedaan Disyon (דִּישׁוֹן) dan Disyan (דִּישָׁן) dipertahankan dengan baik. “Kepala suku” secara memadai mengungkapkan אַלּוּפֵי dalam konteks struktur kelompok/kekerabatan; catatan kaki secara tepat menyediakan alternatif yang menonjolkan fungsi kepemimpinan sosial.
