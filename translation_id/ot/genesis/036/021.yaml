id: GEN.36.21
reference: Genesis 36:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/דִשׁ֥וֹן וְ/אֵ֖צֶר וְ/דִישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַ/חֹרִ֛י בְּנֵ֥י שֵׂעִ֖יר בְּ/אֶ֥רֶץ אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: id
  text: dan Disyon, Ezer, dan Disyan. Mereka inilah para kepala suku[a] orang Hori, keturunan Seir, di tanah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin kaum”; istilah Ibrani ini menunjuk pada kepala kelompok sosial atau kekerabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: Disyon
  rationale: Nama diri ditransliterasikan dengan bentuk yang wajar dalam ejaan Indonesia dan dibedakan dari דִישָׁן (Disyan).
- source_word: אֵצֶר
  choice: Ezer
  rationale: Nama diri ditransliterasikan secara langsung dalam bentuk yang mudah dibaca dalam bahasa Indonesia.
- source_word: דִישָׁן
  choice: Disyan
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia, sambil mempertahankan perbedaannya dari Disyon.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Mengungkapkan rumus identifikasi demonstratif jamak secara alami dan tegas dalam bahasa Indonesia.
- source_word: אַלּוּפֵי
  choice: para kepala suku
  rationale: Dalam konteks Edom dan orang Hori, istilah ini menunjuk pada para pemimpin kelompok kekerabatan atau suku, bukan sekadar orang-orang terkemuka.
- source_word: הַחֹרִי
  choice: orang Hori
  rationale: Bentuk tunggal berartikel berfungsi secara kolektif sebagai sebutan etnis; bahasa Indonesia secara alami memakai 'orang Hori' tanpa penanda jamak tambahan.
- source_word: בְּנֵי שֵׂעִיר
  choice: keturunan Seir
  rationale: Menyampaikan hubungan genealogis yang dimaksud oleh ungkapan harfiah 'anak-anak Seir' dengan jelas dalam bahasa Indonesia modern.
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: di tanah Edom
  rationale: Mempertahankan unsur geografis eksplisit 'tanah' dari teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata penghubung “dan” pada awal ayat dipertahankan karena ayat ini melanjutkan daftar dari konteks sebelumnya; susunan nama dibuat alami dalam bahasa Indonesia.
