base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/036.yaml
  text: And Hadad died[a], and Samlah from Masrekah reigned in his place.
translation:
  language: id
  text: Hadad meninggal, lalu Samla dari Masreka[a] memerintah menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Samla, orang Masreka.” Kata depan Ibrani dapat menunjukkan asal atau kaitan seseorang dengan suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol dari מות menyatakan peristiwa berikutnya dalam rangkaian narasi; “meninggal” wajar dan bermartabat untuk kematian seorang raja.
- source_word: הֲדָד
  choice: Hadad
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: וַיִּמְלֹךְ
  choice: memerintah
  rationale: Dalam rumusan pergantian raja ini, מלך berarti menjalankan pemerintahan sebagai raja; “memerintah” ringkas dan alami dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: תחת dengan sufiks pronominal menandai penggantian kedudukan; pilihan ini mempertahankan makna suksesi dengan lebih jelas daripada sekadar “sesudah dia”.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Nama Ibrani ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: מִמַּשְׂרֵקָה
  choice: dari Masreka
  rationale: Prefiks מן paling langsung menyatakan asal dari suatu tempat, tetapi dalam rumusan seperti ini juga dapat menunjukkan kaitan dengan tempat tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Konjungsi kedua diterjemahkan “lalu” agar urutan peristiwa terasa alami. Penanda catatan kaki ditempatkan sesudah “Masreka” karena catatan itu menerangkan frasa Ibrani מִמַּשְׂרֵקָה.
