  source_fidelity: Teks Indonesia dengan setia mereproduksi tiga kali pengulangan אַלּוּף diikuti nama Oholibama, Ela, dan Pinon. “Pemimpin kaum” secara tepat menyampaikan fungsi sosial-politik אַלּוּף dalam daftar para pemimpin Edom, tanpa memasukkan makna feodal yang tidak ada dalam teks.
