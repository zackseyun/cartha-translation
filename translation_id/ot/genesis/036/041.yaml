  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan gelar dipertahankan sesuai susunan daftar dalam teks Ibrani; huruf awal dibuat kecil karena ayat ini melanjutkan daftar dari konteks sebelumnya.
