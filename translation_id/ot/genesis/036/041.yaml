  text: אַלּ֧וּף אָהֳלִיבָמָ֛ה אַלּ֥וּף אֵלָ֖ה אַלּ֥וּף פִּינֹֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/041.yaml
  text: Chief Oholibamah[a], chief Elah, chief Pinon.
translation:
  language: id
  text: pemimpin kaum Oholibama[a], pemimpin kaum Ela, pemimpin kaum Pinon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepala kaum”; kata Ibrani אַלּוּף menunjuk kepada pemimpin kelompok kekerabatan atau kaum Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin kaum
  rationale: Dalam daftar pemimpin Edom di Kejadian 36, istilah ini menunjuk kepada pemimpin suatu kelompok kekerabatan atau kaum. Pilihan ini jelas dalam bahasa Indonesia modern serta mempertahankan gaya daftar yang ringkas.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Nama diri dialihaksarakan dari bahasa Ibrani dengan bentuk yang alami dalam ejaan Indonesia.
- source_word: אֵלָה
  choice: Ela
  rationale: Di sini kata tersebut berfungsi sebagai nama diri, bukan sebagai sebutan atau kata benda umum.
- source_word: פִּינֹן
  choice: Pinon
  rationale: Nama diri dialihaksarakan langsung dari bentuk konsonantal Ibrani dengan ejaan Indonesia yang ringkas.
theological_decisions: []
