- from: Baal-Hanan anak Akhbor mati, lalu Hadar[a] memerintah sebagai penggantinya. Nama kotanya ialah Pau[b], dan nama istrinya ialah Mehetabel, anak perempuan Matred, anak perempuan Mezahab.[c]
  to: Baal-Hanan anak Akhbor mati, lalu Hadar[a] menjadi raja menggantikannya. Nama kotanya ialah Pau[b], dan nama istrinya ialah Mehetabel, anak perempuan Matred, yang adalah anak perempuan Mezahab.[c]
  rationale: Revisi menyatakan secara eksplisit bahwa Hadar menjadi raja, sesuai dengan verba Ibrani מלך, dan memperjelas bahwa keterangan “anak perempuan Mezahab” menerangkan Matred. Catatan kaki mempertahankan bentuk harfiah serta kemungkinan cakupan istilah kekerabatan tanpa menetapkan penafsiran tambahan.
