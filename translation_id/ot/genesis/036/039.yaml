  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: id
  text: Baal-Hanan anak Akhbor mati, lalu Hadar[a] menjadi raja menggantikannya. Nama kotanya ialah Pau[b], dan nama istrinya ialah Mehetabel, anak perempuan Matred, yang adalah anak perempuan Mezahab.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani di sini berbunyi “Hadar”; beberapa tradisi naskah dan 1 Tawarikh 1:50 berbunyi “Hadad”.
    reason: textual_variant
  - marker: b
    text: Teks Ibrani di sini berbunyi “Pau”; 1 Tawarikh 1:50 berbunyi “Pai”.
    reason: textual_variant
  - marker: c
    text: 'Secara harfiah: “anak perempuan Matred, anak perempuan Mezahab.” Pengulangan “anak perempuan” dapat juga menunjuk pada garis keturunan yang lebih luas.'
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk verba dari מות secara langsung menyatakan kematian; “mati” merupakan padanan Indonesia yang lugas tanpa eufemisme.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Nama diri ditransliterasikan; tanda hubung mempertahankan bentuk nama majemuk dan membantu keterbacaan.
- source_word: בֶּן עַכְבּוֹר
  choice: anak Akhbor
  rationale: Dalam silsilah dan narasi Indonesia, “anak Akhbor” secara alami menyampaikan hubungan yang dinyatakan frasa konstruksi Ibrani.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: lalu Hadar memerintah sebagai penggantinya
  rationale: מלך berarti memerintah atau menjadi raja, sedangkan תחתיו menunjukkan suksesi; frasa ini menyampaikan keduanya secara wajar.
- source_word: הֲדַר
  choice: Hadar
  rationale: Teks Masoret yang diberikan berbunyi Hadar; varian Hadad dicatat dalam catatan kaki.
- source_word: וְשֵׁם עִירוֹ
  choice: Nama kotanya ialah
  rationale: Padanan formula Ibrani yang formal tetapi tetap alami dalam bahasa Indonesia modern.
- source_word: פָּעוּ
  choice: Pau
  rationale: Nama tempat ditransliterasikan sesuai vokalisasi Teks Masoret; bentuk Pai pada 1 Tawarikh 1:50 dicatat.
- source_word: וְשֵׁם אִשְׁתּוֹ
  choice: dan nama istrinya ialah
  rationale: Mencerminkan formula Ibrani dengan susunan yang alami dan jelas.
- source_word: מְהֵיטַבְאֵל
  choice: Mehetabel
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dibaca.
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: anak perempuan Matred, anak perempuan Mezahab
  rationale: Pengulangan בת dipertahankan agar struktur genealogis dan kemungkinan cakupan istilah kekerabatan tidak ditafsirkan secara berlebihan.
