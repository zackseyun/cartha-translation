base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: id
  text: 'Inilah para kepala suku[a] keturunan Esau. Yaitu anak-anak Elifas, anak sulung Esau: kepala suku Teman, kepala suku Omar, kepala suku Zefo, dan kepala suku Kenas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kepala suku” dapat menunjuk kepada pemimpin suatu kaum atau suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: para kepala suku / kepala suku
  rationale: Dalam daftar para pemimpin Edom, istilah ini menunjuk kepada seorang pemimpin kaum atau suku. “Kepala suku” mempertahankan fungsi gelarnya dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: בְנֵי עֵשָׂו
  choice: keturunan Esau
  rationale: Walaupun secara harfiah berarti “anak-anak Esau”, pada bagian pembuka yang mencakup daftar beberapa garis keluarga, “keturunan Esau” menyampaikan cakupan genealogisnya dengan lebih wajar.
- source_word: בְנֵי אֱלִיפַז
  choice: anak-anak Elifas
  rationale: Frasa ini dipertahankan secara lebih harfiah karena langsung memperkenalkan nama-nama dalam garis Elifas.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Padanan baku yang mempertahankan urutan kelahiran serta kemungkinan kedudukan yang terkait dengannya.
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Bentuk pengantar tanpa verba ini secara alami berfungsi untuk memperkenalkan daftar.
- source_word: עֵשָׂו / אֱלִיפַז / תֵּימָן / אוֹמָר / צְפוֹ / קְנַז
  choice: Esau / Elifas / Teman / Omar / Zefo / Kenas
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
