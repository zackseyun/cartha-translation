base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: id
  text: Lalu Husyam meninggal, dan Hadad anak Bedad menjadi raja menggantikan Husyam, yang memukul Midian di wilayah Moab[a]. Nama kotanya ialah Awit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di ladang Moab”; kata Ibrani yang diterjemahkan “wilayah” juga dapat berarti “negeri” atau “daerah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol dari מות secara langsung menyatakan kematian; 'meninggal' merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: menjadi raja menggantikan dia
  rationale: Ungkapan ini menyatakan pemerintahan sekaligus pergantian kedudukan; rumusan tersebut alami dalam bahasa Indonesia modern.
- source_word: הֲדַד בֶּן בְּדַד
  choice: Hadad anak Bedad
  rationale: Nama diri ditransliterasikan, sedangkan בן dalam keterangan silsilah diterjemahkan secara langsung sebagai 'anak'.
- source_word: הַמַּכֶּה
  choice: yang mengalahkan
  rationale: Partisipel Hifil dari נכה menyebut tindakan Hadad terhadap Midian. Dalam konteks konflik antarkelompok, 'mengalahkan' menyampaikan maksud dengan alami tanpa memakai ungkapan Indonesia yang janggal seperti 'memukul Midian'.
- source_word: אֶת מִדְיָן
  choice: Midian
  rationale: Objeknya adalah nama diri Midian; bentuk ini mempertahankan kemungkinan bahwa nama tersebut menunjuk bangsa atau kelompok tanpa memperluasnya menjadi 'orang Midian'.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: di wilayah Moab
  rationale: שָׂדֶה secara harfiah dapat berarti 'ladang', tetapi dalam ungkapan geografis dapat berarti daerah, negeri, atau wilayah. 'Wilayah Moab' paling alami dalam konteks ini; alternatif harfiahnya dicatat.
- source_word: וְשֵׁם עִירוֹ
  choice: Nama kotanya ialah
  rationale: Ini menerjemahkan formula penamaan Ibrani secara ringkas dan alami sambil mempertahankan gaya pemberitahuan naratif.
- source_word: עֲוִית
  choice: Awit
  rationale: Nama tempat ditransliterasikan menurut pola ejaan Indonesia; waw direpresentasikan dengan 'w' dan konsonan akhir taw dengan 't'.
