  register: Bahasa Indonesia baku, ringkas, dan bermartabat dengan gaya silsilah. Tanda titik koma memisahkan dua pasangan nama dan keterangan ibu, sementara pengulangan 'istri Esau' dipertahankan demi kesetiaan pada susunan Ibrani.
