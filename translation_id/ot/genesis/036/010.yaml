  text: אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: id
  text: 'Inilah nama putra-putra Esau: Elifas, putra Ada, istri Esau; Rehuel, putra Basmat, istri Esau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת
  choice: Inilah nama
  rationale: Bentuk presentatif ini alami dalam bahasa Indonesia dan mempertahankan fungsi frasa Ibrani sebagai pengantar sebuah daftar.
- source_word: בְּנֵי עֵשָׂו
  choice: putra-putra Esau
  rationale: Bentuk jamak בְּנֵי dalam konteks ini menunjuk kepada keturunan laki-laki yang disebutkan; 'putra-putra' ringkas, jelas, dan sesuai dengan gaya silsilah.
- source_word: אֱלִיפַז
  choice: Elifas
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בֶּן עָדָה
  choice: putra Ada
  rationale: בֶּן menyatakan hubungan anak laki-laki; susunan ini alami sebagai aposisi genealogis dalam bahasa Indonesia.
- source_word: אֵשֶׁת עֵשָׂו
  choice: istri Esau
  rationale: Frasa konstruksi ini berarti 'istri Esau'. Pengulangannya setelah nama kedua ibu dipertahankan sesuai dengan teks Ibrani.
- source_word: רְעוּאֵל
  choice: Rehuel
  rationale: Transliterasi Indonesia yang mencerminkan bentuk Ibrani רְעוּאֵל dan membedakannya dengan jelas sebagai nama pribadi.
- source_word: בֶּן בָּשְׂמַת
  choice: putra Basmat
  rationale: Konstruksi filial yang sama diterjemahkan secara konsisten.
- source_word: בָּשְׂמַת
  choice: Basmat
  rationale: Bentuk transliterasi yang lazim dan ringkas dalam bahasa Indonesia untuk nama Ibrani ini.
