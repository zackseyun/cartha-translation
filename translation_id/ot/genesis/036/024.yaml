base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: id
  text: 'Inilah anak-anak laki-laki Zibeon: Aya dan Ana. Ana inilah yang menemukan yemim[a] di padang belantara ketika ia sedang menggembalakan keledai-keledai untuk Zibeon, ayahnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani yemim tidak pasti. Kata ini dipahami sebagai “mata air panas” atau, dalam sejumlah penafsiran kuno dan kemudian, “bagal”. Teks utama mempertahankan istilah Ibraninya karena bukti leksikal tidak memberikan kepastian.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam silsilah ini istilah tersebut menunjuk kepada anak laki-laki, tetapi bahasa Indonesia lazim memakai 'anak-anak' ketika nama-nama yang menyusul sudah memperjelas rujukannya.
- source_word: צִבְעוֹן
  choice: Zibeon
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַיָּה
  choice: Aya
  rationale: Transliterasi Indonesia yang wajar untuk nama Ibrani ini.
- source_word: עֲנָה
  choice: Ana
  rationale: Nama pribadi ditransliterasikan secara konsisten dengan ejaan Indonesia.
- source_word: הוּא עֲנָה
  choice: Ana inilah
  rationale: Susunan ini menyampaikan fungsi identifikasi dan penegasan dari pronomina Ibrani secara alami.
- source_word: מָצָא
  choice: menemukan
  rationale: Padanan langsung dan alami bagi verba umum yang berarti menemukan.
- source_word: הַיֵּמִם
  choice: yemim
  rationale: Makna kata Ibrani yang langka ini tidak pasti; bentuk Ibraninya dipertahankan agar tafsiran yang diperdebatkan tidak dipaksakan ke dalam teks utama.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Padanan alami yang mencakup wilayah liar dan tidak dihuni tanpa membatasinya pada gurun pasir.
- source_word: בִּרְעֹתוֹ
  choice: ketika ia menggembalakan
  rationale: Bentuk infinitif berpreposisi menunjukkan tindakan yang berlangsung bersamaan; 'menggembalakan' wajar dipakai untuk menjaga hewan ternak.
- source_word: הַחֲמֹרִים
  choice: keledai-keledai
  rationale: Padanan modern dan jelas; pengulangan menyatakan jamak secara alami.
- source_word: לְצִבְעוֹן אָבִיו
  choice: milik Zibeon, ayahnya
  rationale: Dalam konteks ini frasa tersebut paling alami dipahami bahwa keledai-keledai itu kepunyaan ayahnya, Zibeon, sambil mempertahankan aposisi hubungan keluarga.
