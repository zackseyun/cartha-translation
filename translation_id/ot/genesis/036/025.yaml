base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/025.yaml
  text: 'And these were the sons of Anah: Dishon and Oholibamah daughter of Anah.'
translation:
  language: id
  text: 'Inilah anak-anak Ana: Disyon dan Oholibama, anak perempuan Ana.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי (venei)
  choice: anak-anak
  rationale: Bentuk jamak ini secara leksikal dapat berarti 'anak-anak' atau 'anak-anak lelaki'. Karena daftar tersebut secara eksplisit mencakup Oholibama sebagai anak perempuan, 'anak-anak' paling alami dan tepat dalam bahasa Indonesia tanpa menghilangkan informasi gender yang dinyatakan sesudahnya.
- source_word: דִּשֹׁן (Dishon)
  choice: Disyon
  rationale: Transliterasi nama Ibrani yang wajar dalam ejaan Indonesia, dengan שׁ direpresentasikan sebagai 'sy'.
- source_word: אָהֳלִיבָמָה (Oholivamah)
  choice: Oholibama
  rationale: Mengikuti bentuk nama yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּת עֲנָה (bat Anah)
  choice: anak perempuan Ana
  rationale: Menerjemahkan penandaan gender feminin secara eksplisit dan mempertahankan pengulangan nama Ana dalam teks sumber.
theological_decisions:
- issue: Bentuk jamak maskulin בְנֵי diikuti nama seorang anak perempuan
  choice: Menerjemahkan sebagai 'anak-anak' dan mempertahankan 'anak perempuan' pada Oholibama
  alternative: '''anak-anak lelaki'' atau ''putra-putra'''
  rationale: Alternatif maskulin terasa bertentangan dalam bahasa Indonesia ketika Oholibama langsung disebut sebagai anak perempuan. Pilihan ini mempertahankan cakupan daftar dan ketegangan tekstual tanpa mengubah hubungan kekerabatan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Struktur daftar serta pengulangan 'Ana' dipertahankan sesuai teks Ibrani.
