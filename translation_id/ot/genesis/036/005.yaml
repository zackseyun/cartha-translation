base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/005.yaml
  text: And Oholibamah bore Jeush, Jalam, and Korah. These are the sons of Esau who were born to him in the land of Canaan.
translation:
  language: id
  text: Oholibama melahirkan Yeush, Yaelam, dan Korah. Mereka inilah anak-anak lelaki Esau yang lahir baginya di tanah Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Nama pribadi ditransliterasikan ke bentuk yang alami dalam ejaan bahasa Indonesia, tanpa menerjemahkan maknanya.
- source_word: יָלְדָה
  choice: melahirkan
  rationale: Bentuk feminin dengan Oholibama sebagai subjek diterjemahkan secara langsung dan wajar dalam konteks silsilah.
- source_word: יעיש
  choice: Yeush
  rationale: Transliterasi nama Ibrani yang mempertahankan bunyi konsonan awal yod dan bentuk nama sumber.
- source_word: יַעְלָם
  choice: Yaelam
  rationale: Transliterasi mengikuti bentuk Ibrani dan mudah dibaca oleh pembaca Indonesia.
- source_word: קֹרַח
  choice: Korah
  rationale: Bentuk transliterasi yang lazim dan sesuai dengan ejaan Indonesia.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Ungkapan ini menyampaikan penunjukan sekaligus penegasan dalam kalimat rangkuman silsilah.
- source_word: בְּנֵי
  choice: anak-anak lelaki
  rationale: Kata Ibrani secara khusus merujuk kepada keturunan laki-laki yang baru saja disebutkan, sehingga pembedaan gender dipertahankan.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: yang lahir baginya
  rationale: Mempertahankan konstruksi pasif dan relasi kepada Esau tanpa menambahkan subjek ibu ke dalam klausa relatif.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur אֶרֶץ secara eksplisit dengan frasa Indonesia yang ringkas dan bermartabat.
