  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: id
  text: 'Dan inilah nama para kepala kaum Esau menurut kaum mereka, menurut tempat mereka, dan berdasarkan nama mereka: Kepala Kaum Timna[a], Kepala Kaum Alwa[b], dan Kepala Kaum Yetet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai “Timnah”.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “Alwa”; bandingkan bentuk terkait “Alya” dalam 1 Tawarikh 1:51.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar berikutnya. Dalam bahasa Indonesia, “Inilah” menyampaikan fungsi penunjukan dan pengantar daftar dengan lugas; hubungan dengan konteks tetap tersirat.
- source_word: שְׁמוֹת אַלּוּפֵי עֵשָׂו
  choice: nama para kepala kaum Esau
  rationale: Bentuk jamak konstruk berarti “nama para pemimpin Esau.” “Kepala kaum” sesuai dengan konteks kepemimpinan kelompok suku atau marga Edom dan menghindari gelar kebangsawanan yang anakronistis.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti. “Kaum” alami dalam konteks silsilah dan kesukuan.
- source_word: לִמְקֹמֹתָם
  choice: menurut tempat mereka
  rationale: Terjemahan ini mempertahankan arti luas מָקוֹם dan tidak mempersempitnya menjadi “permukiman” atau “wilayah,” meskipun nuansa teritorial mungkin dimaksudkan.
- source_word: בִּשְׁמֹתָם
  choice: menurut nama mereka
  rationale: Frasa ini menunjukkan bahwa para kepala kaum tersebut didaftarkan berdasarkan nama. Pengulangan “menurut” mempertahankan susunan paralel teks Ibrani.
- source_word: אַלּוּף
  choice: Kepala Kaum
  rationale: Gelar yang diulang sebelum setiap nama menunjuk pada pemimpin kelompok suku atau marga. “Kepala Kaum” jelas bagi pembaca modern dan dipertahankan secara konsisten.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliterasi ringkas yang sesuai dengan bentuk Ibrani; bentuk “Timnah” dicatat sebagai alternatif.
- source_word: עַלְוָה
  choice: Alwa
  rationale: Transliterasi Indonesia dari bentuk Masoret עַלְוָה. Bentuk terkait dalam 1 Tawarikh 1:51 dicatat tanpa menyelaraskan teks ayat ini.
- source_word: יְתֵת
  choice: Yetet
  rationale: Transliterasi langsung yang mengikuti bentuk Ibrani dalam ayat ini dan tidak menyamakannya dengan nama lain yang serupa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur daftar serta kesejajaran tiga frasa klasifikasi dipertahankan, sementara istilah “kepala kaum” dipilih agar jabatan Edom itu jelas tanpa kesan gelar bangsawan Eropa. Penanda catatan kaki ditempatkan langsung pada nama yang diterangkannya.
