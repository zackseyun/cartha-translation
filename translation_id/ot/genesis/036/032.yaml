  text: וַ/יִּמְלֹ֣ךְ בֶּ/אֱד֔וֹם בֶּ֖לַע בֶּן בְּע֑וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/032.yaml
  text: Bela son of Beor reigned in Edom[a], and the name of his city was Dinhabah.
translation:
  language: id
  text: Bela anak Beor menjadi raja di Edom[a], dan nama kotanya ialah Dinhaba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “atas Edom.” Secara harfiah, bahasa Ibrani berbunyi “di Edom”; preposisinya menandai lokasi, tetapi dalam konteks kerajaan frasa itu juga dapat dipahami sebagai wilayah yang diperintah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam konteks daftar raja, bentuk ini menyatakan naiknya Bela sebagai raja dan pemerintahannya. Ungkapan “menjadi raja” alami dalam bahasa Indonesia dan sesuai dengan formula pergantian raja pada ayat-ayat sekitar.
- source_word: בֶּאֱדוֹם
  choice: di Edom
  rationale: Preposisi ב secara langsung menandai lokasi. “Di Edom” mempertahankan bentuk Ibrani, sedangkan “atas Edom” menyatakan wilayah kekuasaan secara lebih eksplisit.
- source_word: בֶּלַע
  choice: Bela
  rationale: Nama diri orang ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן בְּעוֹר
  choice: anak Beor
  rationale: Konstruksi silsilah Ibrani ini secara wajar diterjemahkan “anak Beor” dalam bahasa Indonesia.
- source_word: וְשֵׁם עִירוֹ
  choice: dan nama kotanya ialah
  rationale: Terjemahan ini mempertahankan konjungsi, unsur “nama”, dan sufiks orang ketiga tunggal pada “kotanya”, sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: דִּנְהָבָה
  choice: Dinhaba
  rationale: Nama tempat ditransliterasikan, bukan diterjemahkan, dengan bentuk Indonesia yang mengikuti bunyi nama Ibrani.
