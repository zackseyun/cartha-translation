  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: id
  text: Demikianlah Esau menetap di daerah pegunungan Seir[a]; Esau adalah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di pegunungan Seir” atau “di Gunung Seir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: Bentuk naratif dari ישׁב menyatakan bahwa Esau tinggal dan membangun kediamannya di wilayah itu; “menetap” alami dalam bahasa Indonesia dan sesuai dengan konteks.
- source_word: בְּהַר
  choice: di daerah pegunungan
  rationale: הַר dapat menunjuk pada gunung maupun kawasan bergunung. Karena Seir merupakan suatu wilayah, “daerah pegunungan” menyampaikan makna geografisnya tanpa membatasi rujukan pada satu puncak.
- source_word: שֵׂעִיר
  choice: Seir
  rationale: Nama tempat dipertahankan dengan bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama diri digunakan dalam bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: הוּא אֱדוֹם
  choice: Esau adalah Edom
  rationale: Menerjemahkan secara langsung klausa identifikasi tanpa verba dan mempertahankan kaitan genealogis antara Esau dan Edom.
