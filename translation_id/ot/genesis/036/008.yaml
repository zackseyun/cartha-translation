  source_fidelity: 'Teks Indonesia menerjemahkan וַיֵּשֶׁב dengan tepat sebagai “menetap” dan memahami בְּהַר שֵׂעִיר secara wajar sebagai kawasan pegunungan Seir. Klausa identifikasi עֵשָׂו הוּא אֱדוֹם dipertahankan langsung dan lengkap: “Esau adalah Edom.”'
