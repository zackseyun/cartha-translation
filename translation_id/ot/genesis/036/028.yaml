lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan daftar silsilah. Dalam bahasa Indonesia, “Inilah” secara alami mewakili rumus Ibrani tanpa verba tersebut.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk pada anak laki-laki langsung; bahasa Indonesia lazim memakai “anak-anak” sebelum dua nama laki-laki yang disebutkan.
- source_word: דִישָׁן
  choice: Disyan
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia; שׁ diwakili oleh “sy”.
- source_word: עוּץ
  choice: Us
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang lazim, dengan צ diwakili oleh “s”.
- source_word: וַאֲרָן
  choice: dan Aran
  rationale: Konjungsi ו diterjemahkan “dan”, sedangkan nama diri אֲרָן ditransliterasikan sebagai “Aran”.
