base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: id
  text: Kepala kaum Korah, kepala kaum Gatam, dan kepala kaum Amalek. Mereka adalah para kepala kaum keturunan Elifas di tanah Edom; mereka adalah keturunan Ada.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף (ʾallûf)
  choice: kepala kaum
  rationale: Dalam silsilah para pemimpin Edom, istilah ini menunjuk kepala kelompok kekerabatan atau kaum, bukan sekadar gelar umum; terjemahan ini lebih jelas daripada hanya 'kepala' dan tidak mengimpor struktur kebangsawanan tertentu.
- source_word: גַּעְתָּם (Gaʿtām)
  choice: Gatam
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani dan selaras dengan ejaan nama Alkitab Indonesia yang lazim.
- source_word: בְּנֵי (bənê)
  choice: keturunan
  rationale: Secara harfiah berarti 'anak-anak lelaki/anak-anak', tetapi dalam konteks silsilah dapat mencakup keturunan; 'keturunan' menghindari kesan bahwa semua nama sebelumnya adalah anak langsung Ada.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan istilah Ibrani dipertahankan, sementara hubungan sintaksis diperjelas dengan pemenggalan kalimat. Nama-nama mengikuti bentuk Indonesia yang dekat dengan sumber Ibrani.
