  register: Bahasa naratif yang ringkas, modern, dan bermartabat. Rumusan “menjadi raja menggantikannya” menyampaikan pola suksesi secara alami dalam bahasa Indonesia, sedangkan nama-nama ditransliterasikan dekat dengan bentuk Ibrani.
