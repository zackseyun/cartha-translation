  yaml_path: translation/ot/genesis/036/038.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: id
  text: Lalu Shaul[a] meninggal, dan Baal-Hanan anak Akbor menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah terjemahan memakai ejaan tradisional “Saul” untuk nama ini. Di sini digunakan bentuk “Shaul”, yang lebih dekat dengan bahasa Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Bentuk wayyiqtol Qal dari מות menyatakan kematian secara langsung dalam alur narasi. “Meninggal” merupakan padanan baku dan wajar dalam bahasa Indonesia modern.
- source_word: שָׁאוּל
  choice: Shaul
  rationale: Nama ini ditransliterasikan mendekati bentuk Ibrani, bukan memakai bentuk tradisional “Saul” yang dipengaruhi bahasa perantara.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumusan pergantian kerajaan, verba מלך menyatakan bahwa seseorang mulai memerintah sebagai raja. “Menjadi raja” alami dalam bahasa Indonesia dan tetap mempertahankan makna suksesi.
- source_word: תַּחְתָּיו
  choice: menggantikannya
  rationale: Dalam konteks suksesi, תחת dengan sufiks pronominal berarti mengambil kedudukan orang sebelumnya; “menggantikannya” menyampaikan hal itu secara ringkas dan idiomatis.
- source_word: בַּעַל חָנָן
  choice: Baal-Hanan
  rationale: Nama majemuk Ibrani ditransliterasikan dengan tanda hubung agar kedua unsurnya tetap terlihat dan mudah dibaca.
- source_word: בֶּן
  choice: anak
  rationale: Konstruksi ini menyatakan hubungan keturunan langsung. “Anak” merupakan padanan Indonesia yang alami untuk silsilah dan identifikasi patronimik.
- source_word: עַכְבּוֹר
  choice: Akbor
  rationale: Transliterasi ini mendekati bentuk Ibrani dan sesuai dengan pola ejaan nama yang mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
