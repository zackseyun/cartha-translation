  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: id
  text: Inilah putra-putra Esau, dan inilah para kepala suku mereka[a]. Dialah Edom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin mereka.” Kata Ibrani אַלּוּפִים menunjuk kepada para kepala kelompok kekerabatan atau suku di Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Kata tunjuk jamak ini memperkenalkan rangkuman silsilah; bentuk tanpa verba dalam bahasa Ibrani wajar diterjemahkan dengan rumus identifikasi kini dalam bahasa Indonesia.
- source_word: בְנֵי
  choice: anak-anak
  rationale: Dalam konteks silsilah ini kata tersebut menunjuk kepada anak-anak laki-laki Esau yang baru saja disebutkan; bahasa Indonesia lazim memakai 'anak-anak' tanpa harus menambahkan 'laki-laki'.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: וְאֵלֶּה
  choice: dan inilah
  rationale: Pengulangan ini mempertahankan kesejajaran struktur Ibrani dan menghubungkan klausa identifikasi kedua.
- source_word: אַלּוּפֵיהֶם
  choice: para kepala suku mereka
  rationale: Dalam Kejadian 36, אַלּוּף menunjuk kepada pemimpin kelompok kekerabatan atau suku di Edom; 'kepala suku' menyampaikan fungsi sosial-politiknya secara jelas dan wajar.
- source_word: הוּא
  choice: Dialah
  rationale: Kata ganti tunggal ini kembali menunjuk kepada Esau dan menegaskan identitas pribadinya dengan Edom.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Bentuk nama yang baku; dalam konteks ini nama tersebut mengidentifikasikan Esau sebagai Edom, leluhur yang namanya terkait dengan bangsa Edom.
