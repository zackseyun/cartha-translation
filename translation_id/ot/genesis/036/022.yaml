  text: וַ/יִּהְי֥וּ בְנֵי לוֹטָ֖ן חֹרִ֣י וְ/הֵימָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: id
  text: Anak-anak lelaki Lotan ialah Hori dan Hemam[a], dan saudara perempuan Lotan ialah Timna.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam teks Ibrani ayat ini tertulis “Hemam”; daftar sejajar dalam 1 Tawarikh 1:39 menuliskan “Homam”.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam daftar silsilah ini, bentuk היה berfungsi sebagai kopula sederhana. “Ialah” menyajikan hubungan identitas secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: בְנֵי
  choice: anak-anak lelaki
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada keturunan laki-laki, sebagaimana ditegaskan oleh dua nama laki-laki yang mengikutinya.
- source_word: לוֹטָן
  choice: Lotan
  rationale: Nama orang ditransliterasikan sesuai bentuk Ibraninya dan kelaziman dalam bahasa Indonesia.
- source_word: חֹרִי
  choice: Hori
  rationale: Nama orang ditransliterasikan, bukan diterjemahkan.
- source_word: הֵימָם
  choice: Hemam
  rationale: Vokalisasi teks Ibrani pada ayat ini mendukung bentuk “Hemam”; perbedaan dalam daftar sejajar dicatat dalam catatan kaki.
- source_word: וַאֲחוֹת
  choice: dan saudara perempuan ... ialah
  rationale: Kata אֲחוֹת berarti “saudara perempuan”; kopula “ialah” ditambahkan agar susunan kalimat alami dalam bahasa Indonesia.
- source_word: תִּמְנָע
  choice: Timna
  rationale: Transliterasi “Timna” mencerminkan bentuk Ibrani pada ayat ini secara langsung.
theological_decisions: []
