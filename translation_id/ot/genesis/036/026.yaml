  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: id
  text: 'Dan inilah putra-putra Disyan: Hemdan, Esyban, Yitran, dan Keran.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Gabungan konjungsi dan kata penunjuk memperkenalkan daftar silsilah. Dalam bahasa Indonesia, “Inilah” menyampaikan fungsi tersebut secara alami tanpa perlu menambahkan kopula yang tidak ada dalam bahasa Ibrani.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk konstruksi ini secara harfiah berarti anak-anak lelaki, tetapi dalam bahasa Indonesia “anak-anak” lazim dipakai dalam daftar silsilah dan nama-nama yang menyusul menunjukkan bahwa yang dimaksud adalah putra-putra.
- source_word: דִישָׁן
  choice: Disyan
  rationale: Nama diri dialihaksarakan menurut kebiasaan ejaan Indonesia; שׁ diwakili oleh “sy”.
- source_word: חֶמְדָּן
  choice: Hemdan
  rationale: Nama diri dialihaksarakan secara dekat dari bentuk Ibrani Masoret.
- source_word: וְ/אֶשְׁבָּן
  choice: Esyban
  rationale: Nama diri dialihaksarakan dengan “sy” untuk שׁ; konjungsi pada unsur daftar ditangani oleh tanda baca dan “dan” sebelum unsur terakhir.
- source_word: וְ/יִתְרָן
  choice: Yitran
  rationale: Nama diri dialihaksarakan langsung; yod awal diwakili oleh “Y” sesuai pelafalan Ibrani.
- source_word: וּ/כְרָן
  choice: dan Keran
  rationale: Konjungsi dinyatakan sebelum unsur terakhir, sedangkan kaf diwakili oleh “K”, sehingga bentuknya transparan terhadap teks Ibrani.
