source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: id
  text: Inilah anak-anak laki-laki Oholibama, anak perempuan Ana, anak perempuan Zibeon, istri Esau. Ia melahirkan anak-anak bagi Esau, yaitu Yeush, Yalam, dan Korah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Dalam pemberitahuan silsilah, bentuk ini secara alami memperkenalkan daftar sambil mempertahankan daya tunjuk אֵלֶּה; hubungan dengan konteks tetap tersirat dalam alur bahasa Indonesia.
- source_word: הָיוּ בְּנֵי
  choice: anak-anak lelaki
  rationale: Kopula lampau tidak perlu dinyatakan secara terpisah dalam bahasa Indonesia; בְּנֵי menunjuk kepada tiga laki-laki yang langsung disebutkan.
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: anak perempuan Ana, anak perempuan Zibeon
  rationale: Pengulangan harfiah relasi 'anak perempuan' mempertahankan susunan genealogis dan kemungkinan apposisi dalam teks Ibrani, tanpa mengubahnya menjadi 'cucu perempuan'.
- source_word: אֵשֶׁת עֵשָׂו
  choice: istri Esau
  rationale: Bentuk konstruksi Ibrani diterjemahkan dengan hubungan kepemilikan yang ringkas dan wajar dalam bahasa Indonesia.
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: Ia melahirkan bagi Esau
  rationale: Kata 'bagi' mempertahankan nuansa relasional preposisi לְ, sedangkan 'melahirkan' merupakan padanan alami untuk ילד dalam konteks ini.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: יעיש
  choice: Yeush
  rationale: Transliterasi mempertahankan bunyi awal yod Ibrani dan membedakan nama ini dari bentuk yang dimulai dengan J dalam tradisi bahasa lain.
- source_word: יַעְלָם
  choice: Yalam
  rationale: Transliterasi langsung mempertahankan bunyi awal yod Ibrani.
- source_word: קֹרַח
  choice: Korah
  rationale: Transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur silsilah Ibrani dipertahankan tanpa memperhalus 'anak perempuan Zibeon' menjadi 'cucu perempuan Zibeon'. Tanda titik memisahkan identifikasi Oholibama dari pernyataan kelahiran agar kalimat mudah dipahami.
