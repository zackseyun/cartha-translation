base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: id
  text: 'Dan inilah anak-anak Oholibama, istri Esau: kepala kaum[a] Yeush, kepala kaum Yaelam, dan kepala kaum Korah. Inilah para kepala kaum Oholibama, anak perempuan Ana, istri Esau.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemimpin kaum.” Istilah Ibrani ini menunjuk kepada para pemimpin kelompok atau kaum Edom.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Bentuk jamak maskulin ini menunjuk kepada para putra Oholibama yang disebutkan satu per satu; dalam bahasa Indonesia, “anak-anak” wajar dan tidak memperluasnya menjadi keturunan jauh.
- source_word: אֵשֶׁת עֵשָׂו
  choice: istri Esau
  rationale: Padanan idiomatis dan ringkas bagi frasa konstruksi Ibrani; diterapkan secara konsisten pada kedua kemunculannya.
- source_word: אַלּוּף
  choice: kepala kaum
  rationale: Dalam konteks Edom di Kejadian 36, istilah ini menunjuk kepada pemimpin suatu kelompok kekerabatan atau kaum. “Kepala kaum” mempertahankan unsur kepemimpinan dan konteks sosialnya tanpa memakai gelar feodal yang anakronistis.
- source_word: יְעוּשׁ
  choice: Yeush
  rationale: Alih aksara nama Ibrani yang sesuai dengan pola ejaan nama Alkitab dalam bahasa Indonesia.
- source_word: יַעְלָם
  choice: Yaelam
  rationale: Alih aksara yang mencerminkan bentuk nama Ibrani dan mudah dibaca dalam bahasa Indonesia.
- source_word: קֹרַח
  choice: Korah
  rationale: Bentuk nama yang lazim dalam tradisi ejaan Alkitab bahasa Indonesia.
- source_word: אֵלֶּה אַלּוּפֵי
  choice: Inilah para kepala kaum
  rationale: Menerjemahkan ungkapan penunjuk dan bentuk konstruksi secara dekat tanpa menambahkan gagasan “keturunan dari,” yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: בַּת עֲנָה
  choice: anak perempuan Ana
  rationale: Menyatakan hubungan keluarga secara langsung dan jelas, sekaligus membedakannya dari kata jamak “anak-anak” pada awal ayat.
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: Inilah ... Inilah
  rationale: Pengulangan demonstratif Ibrani dipertahankan sebagai bingkai formal bagi catatan silsilah; bahasa Ibrani tidak menyatakan kopula atau kala secara eksplisit.
