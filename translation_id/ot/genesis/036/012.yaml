id: GEN.36.12
reference: Genesis 36:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: id
  text: Timna adalah gundik Elifas, anak Esau. Ia melahirkan Amalek bagi Elifas. Inilah keturunan Ada[a], istri Esau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Ada”; dalam silsilah, kata Ibrani ini juga dapat berarti keturunan, termasuk cucu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתִמְנַע הָיְתָה
  choice: Timna adalah
  rationale: Kata kerja היה berfungsi sebagai kopula yang menyatakan keadaan atau status Timna; bentuk kini dalam bahasa Indonesia alami untuk paparan silsilah.
- source_word: פִילֶגֶשׁ
  choice: gundik
  rationale: Istilah ini menunjuk pada perempuan dalam ikatan perkawinan atau seksual yang diakui tetapi berkedudukan lebih rendah daripada istri utama; 'gundik' mempertahankan pembedaan sosial tersebut secara ringkas.
- source_word: לֶאֱלִיפַז בֶּן עֵשָׂו
  choice: Elifas, anak Esau
  rationale: Preposisi ל menyatakan hubungan Timna dengan Elifas, sedangkan rangkaian konstruksi berikutnya mengidentifikasi Elifas sebagai anak Esau.
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: Ia melahirkan Amalek bagi Elifas
  rationale: Bentuk naratif ילד berarti 'melahirkan', dan ל setelahnya menandai Elifas sebagai ayah menurut ungkapan silsilah Ibrani. 'Bagi Elifas' mempertahankan bentuk relasional itu tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: Mereka inilah keturunan Ada
  rationale: בְּנֵי secara harfiah berarti 'anak-anak lelaki', tetapi dalam silsilah dapat mencakup keturunan lebih lanjut. Konteks menyebut anak-anak Elifas, sehingga 'keturunan' mempertahankan cakupan istilah tanpa menciptakan pertentangan genealogis.
- source_word: אֵשֶׁת עֵשָׂו
  choice: istri Esau
  rationale: Rangkaian konstruksi ini mengidentifikasi Ada sebagai istri Esau; bentuk posesif tersebut alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan genealogis בְּנֵי bagi hubungan Ada dengan nama-nama yang disebut
  choice: keturunan Ada
  alternative: anak-anak lelaki Ada
  rationale: Bahasa Ibrani Alkitab memakai בֵּן/בָּנִים bukan hanya untuk anak langsung, tetapi juga untuk anggota garis keturunan. Terjemahan 'keturunan' menjaga maksud silsilah dan tidak memaksakan bahwa mereka semua anak langsung Ada.
translation_notes:
  register: 'Bahasa Indonesia baku, ringkas, dan bermartabat. Nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim: Timna, Elifas, Esau, Amalek, dan Ada. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar jelas bagi pembaca modern tanpa mengubah urutan informasinya.'
