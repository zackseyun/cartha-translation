  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Ibrani: Timna sebagai gundik Elifas, Elifas sebagai anak Esau, kelahiran Amalek, dan hubungan silsilah dengan Ada. “Keturunan” merupakan pemakaian yang dapat dibenarkan bagi בְּנֵי dalam rumusan silsilah ini, mengingat kelompok yang dirujuk mencakup keturunan Ada melalui Elifas.'
  naturalness: “Gundik” dan “melahirkan Amalek bagi Elifas” sesuai dengan register silsilah yang formal. Namun, “Mereka inilah” dapat secara wajar dipahami pembaca Indonesia sebagai merujuk kepada Timna dan Amalek dalam kalimat-kalimat sebelumnya, padahal Timna tidak termasuk kelompok keturunan Ada yang dimaksud oleh rumusan ini. Menghilangkan pronomina itu membuat rujukan formula silsilah kembali kepada daftar yang lebih luas.
  terminology: Nama-nama Timna, Elifas, Esau, Amalek, dan Ada sudah lazim dan konsisten dalam bahasa Indonesia. “Gundik” dengan tepat membedakan פילגש dari “istri.” Istilah “keturunan” menjaga keluasan genealogis בני tanpa memaksakan hubungan anak langsung.
  issues:
