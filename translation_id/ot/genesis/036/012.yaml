    issue: Rujukan “Mereka” berpotensi keliru
    rationale: Dalam susunan Indonesia saat ini, anteseden terdekat bagi “Mereka” adalah Timna dan Amalek. Formula Ibrani אֵלֶּה בְנֵי עָדָה merujuk kepada kelompok silsilah yang telah didaftarkan, bukan kepada Timna sebagai individu.
  revised_text: Timna adalah gundik Elifas, anak Esau. Ia melahirkan Amalek bagi Elifas. Inilah keturunan Ada[a], istri Esau.
