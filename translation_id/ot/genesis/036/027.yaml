- source_word: אֵצֶר
  choice: Etser
  rationale: Transliterasi ini mempertahankan bunyi konsonan Ibrani tsade secara lebih tepat daripada bentuk 'Ezer'.
- source_word: בִּלְהָן
  choice: Bilhan
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani.
- source_word: זַעֲוָן
  choice: Zaawan
  rationale: Bentuk ini mencerminkan rangkaian vokal dan konsonan nama Ibrani secara wajar dalam ejaan Indonesia.
- source_word: עֲקָן
  choice: Akan
  rationale: Nama diri ditransliterasikan secara sederhana dan alami dalam ejaan Indonesia.
- source_word: בְּנֵי
  choice: anak-anak
  rationale: Dalam daftar silsilah ini, bentuk jamak konstruktus berarti para anak laki-laki atau keturunan langsung; 'anak-anak' merupakan padanan Indonesia yang alami dan tidak berlebihan.
