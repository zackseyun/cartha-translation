    rationale: רָב מִשֶּׁבֶת menyatakan bahwa harta mereka terlalu besar/banyak untuk tinggal bersama. Bentuk "terlalu banyak untuk tinggal bersama-sama" lebih padat dan setia tanpa mengubah arti.
