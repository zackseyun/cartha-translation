  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tinggal bersama-sama' dipilih agar alami; 'menetap sebagai pendatang' mempertahankan motif kediaman sementara; 'menanggung' menjaga metafora Ibrani, dengan alternatif yang lebih idiomatis dalam catatan kaki.
