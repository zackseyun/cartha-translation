base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: id
  text: Sebab harta milik mereka terlalu banyak untuk tinggal bersama-sama, dan tanah tempat mereka tinggal sebagai pendatang[a] tidak sanggup menanggung mereka[b] karena ternak mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tanah persinggahan mereka”; ungkapan Ibrani ini menunjuk pada tempat tinggal sementara sebagai pendatang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak dapat memikul mereka”; atau, “tidak dapat menopang mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan perpisahan Esau dari Yakub dalam konteks sebelumnya.
- source_word: רְכוּשָׁם
  choice: harta milik mereka
  rationale: Istilah ini mencakup harta benda atau milik yang dikumpulkan, termasuk dalam konteks kekayaan bergerak.
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: terlalu banyak sehingga mereka tidak dapat tinggal bersama-sama
  rationale: Konstruksi dengan מִן dan infinitif menyatakan jumlah yang melampaui kapasitas untuk hidup bersama di wilayah yang sama.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: tanah tempat mereka menetap sebagai pendatang
  rationale: Ungkapan ini mempertahankan gagasan tempat tinggal sementara dan status sebagai pendatang, tetapi tetap alami dalam bahasa Indonesia modern.
- source_word: לָשֵׂאת אֹתָם
  choice: menanggung mereka
  rationale: Terjemahan ini mempertahankan metafora sumber bahwa tanah tidak mampu 'memikul' atau menampung mereka beserta kebutuhan mereka.
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: karena ternak mereka
  rationale: מִפְּנֵי menyatakan sebab, sedangkan מִקְנֶה menunjuk secara luas kepada ternak, bukan hanya sapi.
