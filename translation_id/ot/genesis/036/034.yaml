  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: id
  text: Yobab mati, lalu Husyam dari tanah Teman[a] menjadi raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dari tanah orang Teman.” Bentuk gentilik dalam bahasa Ibrani ini dapat menunjuk pada wilayah Teman atau pada orang Teman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מות menyatakan peristiwa lampau yang berurutan; “mati” merupakan padanan langsung dan wajar dalam daftar pergantian raja.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ini ditransliterasikan sesuai kaidah dan kelaziman bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian pemerintahan ini, מלך menunjuk pada naiknya seseorang menjadi raja; “menjadi raja” menyampaikan pergantian kedudukan dengan jelas dan alami.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: תחת dengan sufiks pronominal di sini menyatakan penggantian dalam jabatan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna suksesi.
- source_word: חֻשָׁם
  choice: Husyam
  rationale: Nama diri ini ditransliterasikan ke dalam ejaan Indonesia, dengan “sy” untuk bunyi שׁ.
- source_word: מֵאֶרֶץ
  choice: dari negeri
  rationale: Gabungan מן dan אֶרֶץ menunjukkan asal geografis; “dari negeri” ringkas dan wajar dalam konteks ini.
- source_word: הַתֵּימָנִי
  choice: orang Teman
  rationale: Bentuk gentilik ini berkaitan dengan Teman. Sesudah “negeri”, “orang Teman” mempertahankan nuansa gentilik tanpa menghasilkan susunan yang kaku.
