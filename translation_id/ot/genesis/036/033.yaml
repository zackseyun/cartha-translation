  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: id
  text: Bela mati, lalu Yobab anak Zerah dari Bozra[a] menjadi raja menggantikannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Bozra.” Preposisi Ibrani yang dipakai dapat menunjukkan asal atau keterkaitan dengan kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: mati
  rationale: Bentuk wayyiqtol dari מוּת menyampaikan peristiwa berikutnya dalam urutan narasi; subjeknya, Bela, disebut secara eksplisit agar alami dalam bahasa Indonesia.
- source_word: בָּלַע
  choice: Bela
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּמְלֹךְ
  choice: menjadi raja
  rationale: Dalam rumus pergantian penguasa, מלך menyatakan bahwa seseorang naik dan mulai memegang kedudukan sebagai raja. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: תחת dengan akhiran pronominal menunjukkan suksesi ke dalam kedudukan penguasa sebelumnya.
- source_word: יוֹבָב
  choice: Yobab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן זֶרַח
  choice: anak Zerah
  rationale: Rangkaian konstruksi ini mengidentifikasi Yobab berdasarkan nama ayahnya; 'anak Zerah' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מִבָּצְרָה
  choice: dari Bozra
  rationale: Preposisi מִן paling langsung menyatakan asal, meskipun dalam daftar raja juga dapat menunjukkan keterkaitan dengan kota tersebut.
