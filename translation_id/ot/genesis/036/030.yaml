base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: id
  text: Pemimpin suku Dishon, pemimpin suku Ezer, dan pemimpin suku Dishan. Inilah para pemimpin orang Hori menurut kelompok-kelompok mereka[a] di tanah Seir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menurut para pemimpin mereka. Kata Ibrani yang sama dapat menunjuk kepada pemimpin suku ataupun kelompok yang dipimpinnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: pemimpin suku
  rationale: Dalam konteks Kejadian 36, istilah ini menunjuk kepada pemimpin kelompok kekerabatan atau suku. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan pengulangan daftar Ibrani.
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: Dishon / Ezer / Dishan
  rationale: Nama-nama diri ditransliterasikan dan perbedaan antara Dishon dan Dishan dipertahankan.
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Klausa Ibrani tidak memakai verba; 'Inilah' wajar sebagai rumusan rangkuman daftar dalam bahasa Indonesia.
- source_word: אַלּוּפֵי הַחֹרִי
  choice: para pemimpin orang Hori
  rationale: הַחֹרִי menunjuk kepada kelompok bangsa Hori; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: לְאַלֻּפֵיהֶם
  choice: menurut kelompok-kelompok mereka
  rationale: Di sini bentuk jamak אַלּוּף dapat menunjuk bukan hanya kepada para pemimpin, tetapi juga kepada kelompok atau wilayah kepemimpinan yang mereka wakili. Terjemahan ini menyampaikan fungsi pengelompokan dan menghindari ungkapan tautologis, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: di tanah Seir
  rationale: Ungkapan geografis ini mempertahankan arti formal אֶרֶץ dan tetap alami dalam bahasa Indonesia.
