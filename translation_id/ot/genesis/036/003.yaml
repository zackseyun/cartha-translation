  text: וְ/אֶת בָּשְׂמַ֥ת בַּת יִשְׁמָעֵ֖אל אֲח֥וֹת נְבָיֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: id
  text: dan Basmat, anak perempuan Ismael, saudara perempuan Nebayot[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini juga dapat ditransliterasikan sebagai “Nebaiot”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: dan
  rationale: וְ menambahkan satu nama lagi dalam daftar istri Esau, sedangkan אֵת adalah penanda objek langsung yang tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: בָּשְׂמַת
  choice: Basmat
  rationale: Nama diri ini ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּת
  choice: anak perempuan
  rationale: Kata ini menyatakan hubungan keturunan dan secara khusus menunjukkan jenis kelamin perempuan.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Bentuk nama yang lazim digunakan dalam bahasa Indonesia.
- source_word: אֲחוֹת
  choice: saudara perempuan
  rationale: Kata benda konstruksi ini menyatakan hubungan saudara kandung perempuan tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: נְבָיוֹת
  choice: Nebayot
  rationale: Transliterasi ini mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia dan cukup dekat dengan bentuk Ibraninya.
theological_decisions: []
