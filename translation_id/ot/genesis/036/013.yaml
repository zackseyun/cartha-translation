  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: id
  text: 'Inilah putra-putra Rehuel: Nahat, Zerah, Syama, dan Miza. Mereka adalah keturunan Basmat, istri Esau.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Memperkenalkan unsur berikutnya dalam silsilah secara alami. Hubungan dengan konteks tetap tersirat tanpa perlu menerjemahkan וְ secara kaku sebagai “dan”.
- source_word: בְּנֵי רְעוּאֵל
  choice: anak-anak Rehuel
  rationale: Nama-nama yang disebut adalah putra langsung Rehuel; “anak-anak” merupakan ungkapan silsilah yang alami dalam bahasa Indonesia dan konteks memperjelas bahwa semuanya laki-laki.
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: Nahat, Zerah, Syama, dan Miza
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; konjungsi terakhir mempertahankan struktur daftar secara alami.
- source_word: אֵלֶּה הָיוּ
  choice: Mereka adalah
  rationale: Merujuk kembali kepada orang-orang yang baru disebut dan menyampaikan rumusan identifikasi silsilah dengan wajar dalam bahasa Indonesia.
- source_word: בְּנֵי בָשְׂמַת
  choice: keturunan Basmat
  rationale: בְּנֵי dapat menunjuk anggota garis keturunan, bukan hanya putra langsung. Menurut konteks, mereka adalah putra-putra Rehuel sekaligus keturunan Basmat; pilihan ini menghindari kesan kontradiksi tanpa menambahkan tingkat kekerabatan yang tidak dinyatakan secara eksplisit oleh kata Ibrani.
- source_word: אֵשֶׁת עֵשָׂו
  choice: istri Esau
  rationale: Menerjemahkan frasa konstruksi secara ringkas dan alami sambil mempertahankan identifikasi Basmat melalui hubungannya dengan Esau.
