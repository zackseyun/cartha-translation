id: GEN.36.1
reference: Genesis 36:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: id
  text: Inilah keturunan Esau (yaitu[a] Edom).
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan inilah keturunan Esau; dia adalah Edom.”'
    reason: Alternatif ini mempertahankan kata penghubung וְ dan bentuk pronominal הוּא secara lebih harfiah.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini membuka bagian baru. “Inilah” alami dalam bahasa Indonesia dan menyampaikan fungsi penunjuk serta pengantar tanpa menambahkan penanda waktu yang tidak terdapat dalam sumber.
- source_word: תֹּלְדוֹת
  choice: keturunan
  rationale: Istilah tōledot merupakan formula penyusun penting dalam Kitab Kejadian. “Keturunan” mempertahankan kaitan genealogisnya, walaupun istilah Ibrani ini juga dapat menunjuk pada riwayat atau silsilah yang menyusul.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama diri dipertahankan menurut bentuk baku bahasa Indonesia.
- source_word: הוּא
  choice: yaitu
  rationale: Kata ganti ini dapat dipahami secara apositif sebagai penjelasan bahwa Esau adalah Edom. “Yaitu” merupakan ungkapan Indonesia yang alami; terjemahan lebih harfiah dicatat dalam catatan kaki.
- source_word: אֱדוֹם
  choice: Edom
  rationale: Nama diri dipertahankan dan di sini mengidentifikasi Esau dengan Edom.
theological_decisions:
- issue: Cakupan formula תֹּלְדוֹת dalam judul bagian Kejadian
  choice: keturunan
  alternative: riwayat; silsilah
  rationale: Pilihan ini sesuai dengan isi bagian yang terutama memuat garis keturunan Esau, tetapi tidak dimaksudkan untuk meniadakan fungsi formula tersebut sebagai judul sastra.
- issue: Hubungan Esau dan Edom dalam הוּא אֱדוֹם
  choice: yaitu Edom
  alternative: dia adalah Edom
  rationale: Bacaan apositif menyampaikan identifikasi tanpa menjelaskan lebih jauh apakah Edom di sini terutama nama lain, leluhur bangsa, atau keduanya; bentuk harfiah tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Formula pembuka dibuat alami bagi pembaca umum, sedangkan ambiguitas bentuk Ibrani dipertahankan melalui catatan kaki.
