source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: id
  text: 'Esau mengambil istri-istrinya dari antara anak-anak perempuan Kanaan: Ada, anak perempuan Elon, orang Het, dan Oholibama, anak perempuan Ana, anak perempuan Zibeon, orang Hewi.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “orang Hewi.” Sebagian penafsir menyelaraskannya dengan silsilah-silsilah terkait dan memahami garis keturunannya secara berbeda, termasuk “orang Hori.”'
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: mengambil
  rationale: Mempertahankan makna dasar verba Ibrani. Dalam konteks ini, frasa tersebut secara alami berarti mengambil sebagai istri tanpa menggantinya dengan penjelasan interpretatif seperti 'menikahi'.
- source_word: נָשָׁיו
  choice: istri-istrinya
  rationale: Dalam konteks silsilah ini, bentuk jamak אִשָּׁה dengan sufiks milik jelas merujuk kepada istri-istri Esau.
- source_word: מִבְּנוֹת כְּנָעַן
  choice: dari antara perempuan-perempuan Kanaan
  rationale: Ungkapan idiomatis Ibrani harfiahnya 'dari anak-anak perempuan Kanaan'. Dalam bahasa Indonesia modern, 'perempuan-perempuan Kanaan' menyampaikan rujukan kepada kaum perempuan dari Kanaan secara lebih alami.
- source_word: בַּת
  choice: anak perempuan / cucu perempuan
  rationale: Pada hubungan langsung diterjemahkan 'anak perempuan'. Kemunculan kedua dalam rangkaian 'anak perempuan Ana, anak perempuan Zibeon' diterjemahkan 'cucu perempuan Zibeon' agar hubungan silsilah alami dalam bahasa Indonesia tanpa mengubah strukturnya.
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Ini adalah sebutan etnis baku dalam tradisi Alkitab bahasa Indonesia untuk חִתִּי.
- source_word: אָהֳלִיבָמָה
  choice: Oholibama
  rationale: Transliterasi Indonesia yang jelas dan dekat dengan bentuk Ibrani.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Teks Masoret berbunyi חִוִּי, yaitu 'orang Hewi'. Ketegangan dengan keterangan silsilah terkait tidak diselaraskan secara diam-diam.
theological_decisions:
- issue: Sebutan etnis/silsilah pada klausa terakhir
  choice: 'Mengikuti Teks Masoret: ''orang Hewi''.'
  alternative: Sebagian penafsir, berdasarkan Kejadian 36:20 dan keterangan silsilah terkait, memahami atau membaca garis keturunan ini secara berbeda, termasuk 'orang Hori'.
  rationale: Teks utama mengikuti sumber Ibrani yang diterima, sedangkan ketegangan silsilah yang nyata dipertahankan dalam catatan kaki dan tidak diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mengambil istri-istrinya' mempertahankan bentuk Ibrani namun tetap dapat dipahami. Nama dan etnonim disesuaikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia. Penanda catatan kaki [a] ditempatkan langsung setelah sebutan yang dipersoalkan.
