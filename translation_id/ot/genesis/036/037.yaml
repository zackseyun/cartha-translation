  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: id
  text: Lalu Samla mati, dan Saul dari Rehobot di tepi Sungai[a] memerintah sebagai raja menggantikan dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani, “Rehobot-Sungai”; kemungkinan besar yang dimaksud ialah Rehobot yang terletak di dekat sungai tertentu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: Lalu ... mati
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: שַׂמְלָה
  choice: Samla
  rationale: Nama pribadi ditransliterasikan secara ringkas dan sesuai dengan bentuk Ibrani.
- source_word: וַיִּמְלֹךְ
  choice: memerintah sebagai raja
  rationale: Kata מלך dalam rumus pergantian raja menyatakan pemerintahan sebagai raja; ungkapan ini mempertahankan makna tersebut tanpa membuat kalimat kaku.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Dalam konteks suksesi, idiom ini berarti mengambil kedudukan penguasa sebelumnya.
- source_word: שָׁאוּל
  choice: Saul
  rationale: “Saul” adalah bentuk nama yang sudah mapan dan mudah dikenali dalam bahasa Indonesia, serta mewakili nama Ibrani שָׁאוּל.
- source_word: מֵרְחֹבוֹת
  choice: dari Rehobot
  rationale: Preposisi מִן menunjukkan asal atau hubungan dengan suatu tempat; Rehobot diperlakukan sebagai nama tempat.
- source_word: הַנָּהָר
  choice: di tepi Sungai
  rationale: Frasa ini menjadi penjelas geografis bagi Rehobot. “Di tepi Sungai” alami dalam bahasa Indonesia, sementara bentuk Ibrani yang lebih harfiah dijelaskan dalam catatan kaki.
