  yaml_path: translation/ot/genesis/036/011.yaml
  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: id
  text: Anak-anak laki-laki Elifas ialah Teman, Omar, Zefo[a], Gaetam, dan Kenas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebagian versi memakai bentuk nama “Zepo”. Teks Ibrani Masoret di sini memberi vokalisasi “Zefo”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ialah
  rationale: Dalam daftar silsilah, bentuk היה dengan waw berfungsi sebagai kopula yang memperkenalkan identitas keturunan; “ialah” menyajikan daftar itu secara alami tanpa menyiratkan proses menjadi.
- source_word: בְּנֵי
  choice: anak-anak laki-laki
  rationale: Bentuk jamak maskulin Ibrani secara khusus berarti anak-anak lelaki dalam konteks silsilah, sehingga unsur gender dipertahankan.
- source_word: אֱלִיפָז
  choice: Elifas
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: תֵּימָן
  choice: Teman
  rationale: Dalam konteks ini kata tersebut adalah nama diri dan karena itu ditransliterasikan, bukan diterjemahkan berdasarkan kemungkinan makna atau kaitannya dengan nama tempat.
- source_word: אוֹמָר
  choice: Omar
  rationale: Nama diri ditransliterasikan secara langsung.
- source_word: צְפוֹ
  choice: Zefo
  rationale: Vokalisasi Masoret mendukung bentuk Zefo; ejaan ini juga menyesuaikan bunyi frikatif פ dengan “f” dalam bahasa Indonesia.
- source_word: גַעְתָּם
  choice: Gaetam
  rationale: Nama diri ditransliterasikan dengan mempertahankan urutan vokal yang ditunjukkan oleh teks Masoret.
- source_word: קְנַז
  choice: Kenas
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang wajar; “K” dipakai untuk ק dan “s” untuk bunyi akhir ז sebagaimana bentuk nama yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Bentuk nama mengikuti kebiasaan transliterasi Indonesia sambil berpijak pada teks Ibrani Masoret.
