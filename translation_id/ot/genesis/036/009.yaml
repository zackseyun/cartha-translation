  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: id
  text: Dan inilah silsilah Esau, leluhur Edom, di pegunungan Seir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Gunung Seir” atau “di daerah perbukitan Seir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Dalam bahasa Indonesia, “Inilah” merupakan pembuka rumusan silsilah yang alami dan tetap menghubungkan bagian ini dengan konteks sebelumnya tanpa perlu mempertahankan וְ secara kaku sebagai “dan”.
- source_word: תֹּלְדוֹת
  choice: keturunan
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada garis keturunan atau para keturunan Esau. “Keturunan” alami bagi pembaca Indonesia, meski istilah Ibrani itu juga dapat mencakup riwayat keluarga.
- source_word: עֵשָׂו
  choice: Esau
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֲבִי אֱדֹום
  choice: bapak leluhur Edom
  rationale: אֲבִי secara harfiah berarti “bapak,” tetapi di sini menyatakan asal-usul genealogis bangsa Edom. “Bapak leluhur” mempertahankan metafora kekerabatan sekaligus memperjelas maksudnya.
- source_word: בְּהַר שֵׂעִיר
  choice: di pegunungan Seir
  rationale: הַר dalam ungkapan geografis dapat menunjuk pada daerah pegunungan, bukan hanya satu puncak. Pilihan ini sesuai dengan Seir sebagai kawasan, sambil mencatat alternatif yang lebih harfiah.
