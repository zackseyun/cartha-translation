  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: id
  text: Mereka juga membunuh Hamor dan anaknya, Sikhem, dengan pedang[a]. Mereka mengambil Dina dari rumah Sikhem lalu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “menurut mulut pedang,” sebuah ungkapan yang berarti dibunuh dengan pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: Mereka juga membunuh Hamor dan Sikhem, anaknya
  rationale: Rangkaian konjungsi dan penanda objek melanjutkan tindakan pada ayat sebelumnya serta menambahkan Hamor dan Sikhem sebagai korban. Frasa aposisional 'anaknya' mempertahankan hubungan Sikhem dengan Hamor tanpa kerancuan dalam bahasa Indonesia.
- source_word: הָרְגוּ
  choice: membunuh
  rationale: Padanan langsung dan wajar bagi הרג dalam prosa naratif modern.
- source_word: לְפִי חָרֶב
  choice: dengan pedang
  rationale: Ungkapan Ibrani harfiah 'dengan mulut pedang' merupakan idiom yang berarti membunuh dengan pedang; terjemahan utama menyampaikan maknanya secara alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּקְחוּ אֶת דִּינָה מִבֵּית שְׁכֶם
  choice: Lalu mereka membawa Dina keluar dari rumah Sikhem
  rationale: לקח secara dasar berarti 'mengambil', tetapi dengan objek orang dan gerak dari sebuah rumah, 'membawa ... keluar' lebih alami serta menyatakan arah yang tersirat oleh מן dan tindakan berikutnya tanpa memberi nuansa kekerasan tambahan.
- source_word: וַיֵּצֵאוּ
  choice: dan pergi
  rationale: יצא berarti keluar atau pergi. Karena tindakan membawa Dina 'keluar' sudah dinyatakan dalam klausa sebelumnya, 'pergi' menghindari pengulangan yang kaku sambil mempertahankan gerak meninggalkan tempat itu.
