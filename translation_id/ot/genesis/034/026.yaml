translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Nama חמור ditulis 'Hamor' dan שכם ditulis 'Sikhem' mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
