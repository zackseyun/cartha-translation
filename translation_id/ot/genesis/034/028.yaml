base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: id
  text: Mereka mengambil kambing dan domba mereka, sapi mereka, keledai-keledai mereka, serta segala sesuatu yang ada di kota dan segala sesuatu yang ada di ladang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: kawanan kambing domba mereka
  rationale: צֹאן adalah kata benda kolektif untuk ternak kecil, khususnya kambing dan domba. Ungkapan ini menyampaikan cakupan maknanya dengan jelas dalam bahasa Indonesia.
- source_word: בְּקָרָם
  choice: kawanan sapi mereka
  rationale: בָּקָר menunjuk pada sapi sebagai ternak besar dan dapat bermakna kolektif; 'kawanan sapi' mempertahankan pengertian tersebut.
- source_word: חֲמֹרֵיהֶם
  choice: keledai-keledai mereka
  rationale: Bentuk jamak ini secara langsung menunjuk pada keledai milik mereka.
- source_word: אֲשֶׁר בָּעִיר
  choice: segala sesuatu yang ada di kota
  rationale: Konstruksi relatif ini mencakup secara luas apa pun yang terdapat di dalam kota sebagai objek yang diambil.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: yang ada di ladang
  rationale: שָׂדֶה dapat berarti ladang atau tanah terbuka; 'ladang' merupakan padanan langsung dan wajar dalam konteks ini.
- source_word: לָקָחוּ
  choice: Mereka mengambil
  rationale: לָקַח secara dasar berarti 'mengambil'. Pilihan ini tetap dekat dengan teks Ibrani tanpa menambahkan nuansa 'menjarah' atau 'merampas' yang hanya tersirat oleh konteks.
