base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: id
  text: Anak-anak Yakub datang dari ladang ketika mereka mendengar hal itu. Mereka sangat sedih dan sangat marah karena Sikhem telah melakukan perbuatan keji di Israel dengan meniduri anak perempuan Yakub. Hal seperti itu tidak boleh dilakukan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: sangat sedih
  rationale: Kata kerja ini menyatakan rasa sedih atau pedih hati; unsur intensitas dipadukan dengan מְאֹד yang juga mencakup kemarahan mereka.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: marah
  rationale: Ungkapan idiomatis ini berarti amarah mereka berkobar hebat; bersama klausa sebelumnya diterjemahkan secara alami sebagai 'sangat sedih dan marah'.
- source_word: נְבָלָה
  choice: perbuatan keji
  rationale: Istilah ini menunjuk tindakan yang amat tercela dan melanggar norma moral, bukan sekadar kebodohan atau aib.
- source_word: לִשְׁכַּב אֶת
  choice: dengan meniduri
  rationale: Menerjemahkan eufemisme Ibrani bagi hubungan seksual secara jelas namun tetap wajar dalam bahasa Indonesia modern.
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: Hal seperti itu tidak boleh dilakukan
  rationale: Menjaga daya normatif ungkapan Ibrani bahwa tindakan demikian tidak patut dan terlarang.
theological_decisions:
- issue: Ungkapan 'di Israel' sebelum bangsa Israel terbentuk
  choice: mempertahankan 'di Israel'
  alternative: di antara keluarga Israel
  rationale: Teks Ibrani memakai בְיִשְׂרָאֵל secara langsung; nuansa proleptik atau identitas komunalnya dibiarkan tetap terbuka.
- issue: Pelaku dalam klausa alasan
  choice: menyebut 'Sikhem'
  alternative: mempertahankan pronomina 'ia'
  rationale: Subjek maskulin tunggal tersirat dari konteks ayat sebelumnya; penyebutan nama menghindari ketidakjelasan dalam bahasa Indonesia tanpa menambah penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan penilaian moral yang kuat dalam teks sumber.
