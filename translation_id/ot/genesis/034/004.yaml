  text: Lalu Sikhem berkata kepada Hamor, ayahnya, “Ambilkan gadis ini bagiku sebagai istri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַח לִי
  choice: Ambilkan ... bagiku
  rationale: Imperatif לקח dengan penerima לִי menyatakan permintaan kepada Hamor agar memperoleh gadis itu bagi Sikhem; bentuk ini mempertahankan kelugasan dan nada transaksional ujaran sumber.
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: gadis ini
  rationale: Dalam konteks ini יַלְדָּה menunjuk perempuan muda; “gadis” alami dalam bahasa Indonesia dan tidak menambahkan penentuan umur yang tidak dinyatakan teks.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan ini menyatakan tujuan perkawinan, yakni mengambil perempuan tersebut menjadi istri.
