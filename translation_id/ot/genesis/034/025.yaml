base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: id
  text: Pada hari ketiga, ketika mereka masih kesakitan, dua orang anak Yakub, yaitu Simeon dan Lewi, saudara-saudara Dina, masing-masing mengambil pedangnya. Mereka datang menyerang kota itu ketika kota itu merasa aman[a], lalu membunuh semua laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Mereka datang menyerang kota itu dengan percaya diri.” Kata Ibrani בֶּטַח dapat menerangkan cara mereka mendatangi kota itu atau keadaan kota yang merasa aman dan tidak bersiaga.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Ungkapan waktu ditempatkan di awal secara alami dalam narasi Indonesia; fungsi pengantar וַיְהִי tersampaikan oleh alur kalimat tanpa rumusan arkais seperti 'terjadilah'.
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: ketika mereka masih kesakitan
  rationale: Menyatakan keadaan yang berlangsung bersamaan. 'Masih' wajar dalam konteks hari ketiga dan tidak memperinci penyebab rasa sakit melebihi teks ayat.
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: dua orang anak Yakub
  rationale: Menunjukkan dua dari antara anak-anak Yakub dengan ungkapan Indonesia yang alami.
- source_word: שִׁמְעוֹן וְלֵוִי
  choice: Simeon dan Lewi
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲחֵי דִינָה
  choice: saudara-saudara Dina
  rationale: Keterangan aposisional yang menyatakan hubungan Simeon dan Lewi dengan Dina.
- source_word: אִישׁ חַרְבּוֹ
  choice: masing-masing mengambil pedangnya
  rationale: אִישׁ berfungsi distributif, dan sufiks posesif menunjukkan pedang masing-masing.
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: Mereka mendatangi kota itu
  rationale: בוא על menyatakan gerak menuju atau terhadap kota; konteks berikutnya membuat maksud bermusuhannya jelas tanpa harus menambahkan kata 'menyerang' sebelum tindakan pembunuhan disebutkan.
- source_word: בֶּטַח
  choice: ketika kota itu merasa aman
  rationale: Dipahami sebagai keadaan kota yang aman dan tidak bersiaga. Ambiguitas sintaksisnya dipertahankan dalam catatan kaki.
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: lalu membunuh semua laki-laki
  rationale: הרג berarti membunuh, sedangkan כָּל זָכָר secara harfiah mencakup setiap orang berjenis kelamin laki-laki; 'semua laki-laki' adalah padanan Indonesia yang jelas dan alami.
