  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang sumber dibagi menjadi dua agar jelas tanpa mengubah urutan peristiwa. Ambiguitas בֶּטַח tidak diselesaikan secara diam-diam, tetapi dicatat sebagai alternatif.
