  terminology: Nama Simeon, Lewi, dan Dina sesuai penggunaan Alkitab Indonesia yang lazim. “Saudara-saudara Dina” dan “masing-masing mengambil pedangnya” tepat. Catatan kaki perlu memperbaiki alternatif “dengan aman,” yang dalam bahasa Indonesia dapat disalahpahami sebagai perjalanan yang selamat, bukan cara bertindak dengan percaya diri/aman.
