  source_fidelity: 'Teks utama pada dasarnya setia: בני יעקב, kedua objek (Sikhem dan Hamor), בְּמִרְמָה, dan טִמֵּא diterjemahkan dengan baik. Namun, pemisahan menjadi dua kalimat dan frasa “Mereka berkata demikian” agak mengaburkan rangkaian dua verba Ibrani serta hubungan sebabnya. “Ayahnya” juga berpotensi tidak jelas dalam bahasa Indonesia, meskipun dalam Ibrani acuan tersebut adalah Sikhem.'
  naturalness: “Anak-anak Yakub” dan “dengan tipu daya” alami dalam ragam Indonesia modern. Susunan satu kalimat dengan “dan berkata” lebih langsung, mempertahankan alur sumber, dan menghindari “demikian” yang kurang memiliki rujukan leksikal jelas.
  terminology: “Menajiskan” tepat untuk טִמֵּא dan patut dipertahankan sebagai istilah utama. Catatan alternatif sebelumnya, “melanggar kehormatan,” terlalu menafsirkan dan kurang mempertahankan medan makna verba Ibrani; “menodai” merupakan alternatif Indonesia yang lebih dekat tanpa menggantikan terjemahan utama.
