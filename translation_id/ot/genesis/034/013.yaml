base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: id
  text: Anak-anak Yakub menjawab Sikhem dan Hamor, ayah Sikhem, dengan tipu daya[a], dan berkata demikian karena Sikhem telah menajiskan[b] Dina, saudara perempuan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kelicikan” atau “dengan penipuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah menodai Dina, saudara perempuan mereka.” Teks Ibrani memakai kata “menajiskan,” yang mempertahankan nuansa moral dan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: menjawab
  rationale: Dalam konteks ini, verba ענה memperkenalkan tanggapan terhadap usul sebelumnya; 'menjawab' alami dan tepat.
- source_word: בְנֵי יַעֲקֹב
  choice: Anak-anak Yakub
  rationale: Menerjemahkan frasa konstruksi secara alami dalam bahasa Indonesia dan tetap mempertahankan identitas keluarga.
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: Sikhem dan Hamor, ayahnya
  rationale: Mempertahankan kedua objek langsung dan menjadikan Hamor sebagai ayah Sikhem, sesuai hubungan sintaksis teks Ibrani.
- source_word: בְּמִרְמָה
  choice: dengan tipu daya
  rationale: Nomina מִרְמָה yang didahului ב berfungsi secara adverbial; ungkapan ini alami dalam bahasa Indonesia dan dekat dengan bentuk sumber.
- source_word: וַיְדַבֵּרוּ
  choice: Mereka berkata demikian
  rationale: דבר menandai tindakan berbicara. 'Berkata demikian' menghindari pengulangan janggal sesudah 'menjawab' sambil menghubungkannya dengan alasan yang menyusul.
- source_word: אֲשֶׁר
  choice: karena
  rationale: Dalam susunan ini partikel tersebut paling wajar dipahami memperkenalkan alasan bagi jawaban penuh tipu daya.
- source_word: טִמֵּא
  choice: telah menajiskan
  rationale: Bentuk piel dari טמא berarti membuat najis atau menajiskan; pilihan ini mempertahankan bobot moral dan kenajisan dalam istilah sumber tanpa menggantinya dengan tafsiran kontekstual.
- source_word: אֲחֹתָם
  choice: saudara perempuan mereka
  rationale: Menyatakan hubungan keluarga secara jelas; bentuk lengkap lebih mudah dipahami daripada hanya 'saudari mereka' bagi pembaca umum.
theological_decisions:
- issue: Subjek tersirat pada טִמֵּא
  choice: Sikhem telah menajiskan
  alternative: ia telah menajiskan
  rationale: Bahasa Ibrani memakai subjek maskulin tunggal yang secara kontekstual menunjuk kepada Sikhem. Menyebut namanya menghindari ambiguitas pronominal dalam bahasa Indonesia tanpa mengubah acuan.
- issue: Makna moral-ritual טִמֵּא dalam konteks pelanggaran seksual
  choice: menajiskan
  alternative: melanggar kehormatan / memperkosa
  rationale: '''Menajiskan'' mempertahankan medan makna istilah Ibrani dan tidak mempersempitnya menjadi satu istilah interpretatif, sedangkan catatan kaki menjelaskan alternatif kontekstual.'
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Urutan tindakan Ibrani dipertahankan, tetapi kalimat kedua dibuat eksplisit agar hubungan sebab dan subjeknya jelas. Semua penanda catatan kaki terdapat dalam teks utama.
