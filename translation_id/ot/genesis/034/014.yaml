translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan ‘mereka ... kepada mereka’ dipertahankan karena mencerminkan bentuk jamak dalam sumber, sementara ‘yaitu’ memperjelas hubungan penjelas antara ‘hal ini’ dan tindakan memberikan saudara perempuan mereka.
