  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: id
  text: Lalu mereka berkata kepada mereka, “Kami tidak dapat melakukan hal ini, yaitu memberikan saudara perempuan kami kepada seorang laki-laki yang tidak bersunat[a], sebab hal itu merupakan aib bagi kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang mempunyai kulup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: Lalu mereka berkata kepada mereka
  rationale: Bentuk naratif וַיֹּאמְרוּ memperkenalkan ujaran berikutnya, sedangkan אֲלֵיהֶם mempertahankan objek tak langsung jamak, ‘kepada mereka’.
- source_word: לֹא נוּכַל
  choice: Kami tidak dapat
  rationale: Bentuk Qal dari יכל menyatakan kemampuan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan klaim ketidakmampuan.
- source_word: לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: melakukan hal ini
  rationale: Terjemahan ini mempertahankan unsur דבר sebagai ‘hal’ sambil menggunakan susunan yang wajar dalam bahasa Indonesia modern.
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: memberikan saudara perempuan kami
  rationale: נתן berarti ‘memberikan’. Konteks pernikahan sudah jelas, sehingga frasa ‘untuk dinikahi’ tidak ditambahkan ke teks utama.
- source_word: לְאִישׁ
  choice: kepada seorang laki-laki
  rationale: איש adalah sebutan umum untuk laki-laki; pilihan ini tidak mempersempit maknanya menjadi ‘suami’.
- source_word: אֲשֶׁר לוֹ עָרְלָה
  choice: yang berkulup
  rationale: Ungkapan Ibrani secara harfiah berarti ‘yang mempunyai kulup’. ‘Yang berkulup’ mempertahankan gambaran konkret sumber dengan bentuk Indonesia yang ringkas; makna kontekstual ‘tidak bersunat’ dicatat dalam catatan kaki.
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: sebab hal itu merupakan aib bagi kami
  rationale: חֶרְפָּה menunjuk pada aib, cela, atau kehinaan sosial. ‘Aib’ menyampaikan dimensi malu dan kehormatan secara alami dan bermartabat.
