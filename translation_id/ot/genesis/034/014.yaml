  to: Lalu mereka berkata kepada mereka, “Kami tidak dapat melakukan hal ini, yaitu memberikan saudara perempuan kami kepada seorang laki-laki yang tidak bersunat[a], sebab hal itu merupakan aib bagi kami.”
