  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: id
  text: Namun, mereka berkata[a], “Haruskah ia memperlakukan saudara perempuan kami seperti pelacur?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Haruskah ia membuat saudara perempuan kami seperti pelacur?” Kata kerja Ibrani secara harfiah berarti “melakukan/membuat”, tetapi di sini kemungkinan bermakna “memperlakukan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Namun, mereka berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan narasi dan memperkenalkan jawaban yang berlawanan dengan teguran Yakub pada ayat sebelumnya. “Namun” menyampaikan daya adversatif konteks dengan wajar.
- source_word: הַכְזוֹנָה
  choice: seperti pelacur
  rationale: Gabungan partikel tanya ה, preposisi כ, dan nomina זונה membentuk perbandingan retoris, “seperti pelacur?” Istilah “pelacur” jelas dan lazim dalam bahasa Indonesia modern.
- source_word: יַעֲשֶׂה
  choice: Haruskah ia memperlakukan
  rationale: עשה secara harfiah luas artinya, “melakukan/membuat.” Dengan penanda objek dan objek berupa orang dalam konteks ini, “memperlakukan” paling alami, tetapi alternatif harfiahnya tetap dicatat karena bentuk Ibrani dapat dipahami sebagai “membuat ... seperti.”
- source_word: אֶת
  choice: tidak diterjemahkan tersendiri
  rationale: אֶת adalah penanda objek langsung; fungsinya tercermin dalam frasa objek “saudara perempuan kami.”
- source_word: אֲחוֹתֵנוּ
  choice: saudara perempuan kami
  rationale: Terjemahan ini mempertahankan hubungan keluarga yang menjadi inti jawaban saudara-saudara Dina dan menghindari kemungkinan ketaksaan “saudari” dalam pemakaian modern.
