  terminology: Nama ‘Hemor’ dan ‘Sikhem’ sesuai pemakaian Indonesia yang lazim. Istilah ‘anak perempuan’, ‘istri’, dan bentuk sapaan jamak ‘kalian’ tepat. Catatan kaki dengan tepat memberi alternatif bagi idiom Ibrani tanpa memaksakan penafsiran tambahan.
