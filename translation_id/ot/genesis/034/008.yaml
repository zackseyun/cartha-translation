  source_fidelity: 'Teks secara setia mencerminkan unsur-unsur Ibrani: Hemor berbicara kepada/bersama mereka; Sikhem disebut sebagai anaknya; idiom חָשְׁקָה נַפְשׁוֹ disampaikan sebagai keinginan yang kuat; ‘anak perempuan kalian’ mempertahankan nomina tunggal dengan sufiks jamak; dan permintaan sopan untuk menyerahkan dia kepada Sikhem sebagai istri tersampaikan dengan jelas.'
