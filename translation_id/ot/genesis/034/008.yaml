  text: וַ/יְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣/ם לֵ/אמֹ֑ר שְׁכֶ֣ם בְּנִ֗/י חָֽשְׁקָ֤ה נַפְשׁ/וֹ֙ בְּ/בִתְּ/כֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛/הּ ל֖/וֹ לְ/אִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/008.yaml
  text: And Hamor spoke with them[a], saying, “My son Shechem longs for your daughter. Please give her to him as a wife.”
translation:
  language: id
  text: Lalu Hemor berbicara dengan mereka, katanya, “Sikhem, anak saya, sangat menginginkan anak perempuan kalian.[a] Tolong berikanlah dia kepadanya untuk menjadi istrinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwanya sangat melekat kepada anak perempuan kalian”; dapat juga diterjemahkan, “sangat merindukan anak perempuan kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Kata kerja ini lazim berarti berbicara atau menyampaikan perkataan; bentuk ini juga mempertahankan pembedaan dari לֵאמֹר, “katanya”.
- source_word: אִתָּם
  choice: dengan mereka
  rationale: Preposisi אֵת di sini paling wajar menunjukkan bahwa Hemor berbicara dengan mereka, bukan sekadar menyampaikan sesuatu kepada mereka.
- source_word: שְׁכֶם בְּנִי
  choice: Sikhem, anak saya
  rationale: Susunan aposisional ini alami dalam bahasa Indonesia dan mempertahankan penekanan bahwa Sikhem adalah anak Hemor.
- source_word: חָשְׁקָה נַפְשׁוֹ
  choice: sangat menginginkan
  rationale: Ungkapan harfiahnya menyatakan bahwa jiwa atau hasrat Sikhem melekat kuat pada Dina. Pilihan ini menyampaikan intensitas keinginan tanpa memasukkan penilaian moral yang tidak dinyatakan oleh ungkapan tersebut.
- source_word: בְּבִתְּכֶם
  choice: anak perempuan kalian
  rationale: Nomina Ibrani berbentuk tunggal dan merujuk kepada Dina, sedangkan sufiks orang kedua berbentuk jamak karena Hemor berbicara kepada keluarga itu.
- source_word: תְּנוּ נָא
  choice: Tolong berikanlah
  rationale: Imperatif jamak dengan partikel נָא menyatakan permintaan yang sopan atau sungguh-sungguh.
- source_word: אֹתָהּ לוֹ לְאִשָּׁה
  choice: dia kepadanya untuk menjadi istrinya
  rationale: Terjemahan ini menyatakan dengan alami maksud pemberian dalam perkawinan serta mempertahankan rujukan kepada Dina dan Sikhem.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Bentuk “kalian” mempertahankan orang kedua jamak dalam bahasa Ibrani, sedangkan “anak perempuan” tetap tunggal karena merujuk kepada Dina.
