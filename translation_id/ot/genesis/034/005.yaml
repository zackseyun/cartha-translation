  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: id
  text: Yakub mendengar bahwa Sikhem telah menodai[a] Dina, putri Yakub. Anak-anak lelaki Yakub sedang berada di padang bersama ternaknya, sehingga Yakub tetap diam sampai mereka datang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah mencemarkan Dina, putri Yakub.” Kata kerja Ibrani secara harfiah berarti “menajiskan” atau “membuat najis”; dalam konteks ini, kata itu mengacu pada penodaan seksual terhadap Dina.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: mendengar
  rationale: Secara langsung menyatakan bahwa Yakub menerima kabar; 'mendengar' alami dan dekat dengan bentuk Ibrani.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi kabar yang didengar Yakub.
- source_word: טִמֵּא
  choice: telah menodai
  rationale: Bentuk piel dari טמא berarti menajiskan atau membuat najis. Dalam konteks ini, 'menodai' mempertahankan bobot moral dan sosial dari istilah sumber tanpa menjadikannya istilah teknis ritual atau mengganti verba Ibrani dengan penafsiran yang terlalu khusus.
- source_word: בִתּוֹ
  choice: anak perempuannya
  rationale: Menerjemahkan nomina dengan sufiks kepunyaan secara jelas dan alami dalam bahasa Indonesia.
- source_word: וּבָנָיו
  choice: Anak-anak lelaki Yakub
  rationale: Pengulangan nama Yakub menghindari kemungkinan sesaat bahwa akhiran 'nya' merujuk kepada Sikhem, yang menjadi subjek tersirat dalam kalimat sebelumnya. Hubungan antarklausa disampaikan secara alami tanpa menambahkan penanda waktu yang tidak ada.
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: sedang berada di padang bersama ternaknya
  rationale: Menjaga pernyataan sumber tentang lokasi mereka bersama ternak tanpa menambahkan tindakan 'menggembalakan' yang tidak dinyatakan secara eksplisit.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: מִקְנֶה menunjuk pada ternak secara kolektif; 'ternak' luas, tepat, dan lazim.
- source_word: וְהֶחֱרִשׁ
  choice: tetap diam
  rationale: Menyampaikan tindakan menahan diri untuk tidak berbicara atau bertindak secara verbal sampai anak-anaknya datang.
- source_word: עַד בֹּאָם
  choice: sampai mereka datang
  rationale: Menerjemahkan secara idiomatis tanpa menambahkan gagasan 'kembali', yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Identitas subjek tersirat pada טִמֵּא
  choice: Sikhem disebut secara eksplisit
  alternative: mempertahankan pronomina tersirat sebagai 'ia' atau '-nya'
  rationale: Bahasa Ibrani menandai subjek maskulin tunggal pada verba, dan konteks ayat sebelumnya mengidentifikasinya sebagai Sikhem. Menyebut namanya menghilangkan ambiguitas rujukan yang tidak disengaja dalam bahasa Indonesia tanpa mengubah pelaku dalam narasi.
- issue: Nuansa טִמֵּא dalam konteks kekerasan seksual
  choice: menodai, dengan catatan alternatif 'mencemarkan' dan penjelasan konteks
  alternative: melanggar kehormatan seksual atau memperkosa
  rationale: Istilah sumber secara leksikal berarti menajiskan atau membuat najis dan dalam konteks ini menunjuk pada pencemaran seksual Dina. Terjemahan tidak mengganti verba tersebut dengan istilah yang lebih spesifik daripada leksimanya, tetapi catatan menjelaskan daya kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. 'Padang' dipilih sebagai padanan alami untuk wilayah terbuka tempat ternak berada. Struktur kalimat menghindari penambahan 'Lalu' atau 'Adapun' yang tidak diperlukan, sekaligus memperjelas rujukan pelaku dan kepemilikan.
