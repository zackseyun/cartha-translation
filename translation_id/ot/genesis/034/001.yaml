id: GEN.34.1
reference: Genesis 34:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: id
  text: Dina, anak perempuan Lea yang dilahirkannya bagi Yakub, pergi keluar untuk melihat perempuan-perempuan di negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengunjungi perempuan-perempuan di negeri itu.” Secara harfiah, bahasa Ibrani berbunyi “melihat anak-anak perempuan negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: pergi keluar
  rationale: Bentuk wayyiqtol qal dari יצא menyatakan tindakan keluar atau pergi. 'Pergi keluar' mempertahankan gerak naratif tanpa menambahkan tempat asal yang tidak disebutkan.
- source_word: דִינָה
  choice: Dina
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: בַּת לֵאָה
  choice: anak perempuan Lea
  rationale: Frasa konstruksi ini mengidentifikasi Dina melalui garis keturunan ibunya; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: yang dilahirkannya bagi Yakub
  rationale: Klausa relatif ini menerangkan Dina sebagai anak yang dilahirkan Lea bagi Yakub. Akhiran '-nya' merujuk kepada Lea, dan 'bagi Yakub' mempertahankan fungsi preposisi ל tanpa mengaburkan bahwa Yakub adalah ayahnya.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif konstruksi ראה secara langsung berarti 'melihat'. Kemungkinan makna sosial 'mengunjungi' tidak dimasukkan ke teks utama, tetapi dicatat sebagai alternatif.
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: perempuan-perempuan di negeri itu
  rationale: Secara harfiah frasa ini berarti 'anak-anak perempuan negeri itu', tetapi dalam konteks menunjuk para perempuan setempat. Pilihan ini alami dalam bahasa Indonesia, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan klausa dipertahankan cukup dekat dengan bahasa Ibrani, tetapi idiom 'anak-anak perempuan negeri itu' dibuat lebih alami dalam teks utama; ambiguitas tujuan 'melihat/mengunjungi' dijaga melalui catatan kaki.
