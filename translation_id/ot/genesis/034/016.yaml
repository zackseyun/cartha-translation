  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: id
  text: maka kami akan memberikan putri-putri kami kepada kalian, dan kami akan mengambil putri-putri kalian untuk kami sendiri. Kami akan tinggal bersama kalian dan menjadi satu bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kami akan menjadi satu bangsa.” Secara harfiah, “dan kami akan ada bagi satu bangsa”; konstruksi Ibrani ini dapat menyatakan keadaan hasil, “menjadi satu bangsa,” atau secara lebih formal, “menjadi satu bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ
  choice: maka kami akan memberikan
  rationale: Bentuk perfek dengan waw berada dalam rangkaian hasil dari syarat yang disebut sebelumnya; “maka ... akan” menyatakan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: בְּנֹתֵינוּ / בְּנֹתֵיכֶם
  choice: anak-anak perempuan kami / anak-anak perempuanmu
  rationale: Padanan langsung yang mempertahankan hubungan keluarga dan kesejajaran timbal balik dalam usulan perkawinan tersebut.
- source_word: נִקַּח לָנוּ
  choice: mengambil ... bagi kami
  rationale: “Mengambil” mempertahankan ungkapan Ibrani; konteksnya menunjukkan mengambil sebagai istri, sedangkan “bagi kami” mewakili לָנוּ tanpa menambahkan penjelasan ke dalam teks.
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: Kami akan tinggal bersamamu
  rationale: ישׁב dalam konteks ini berarti tinggal atau menetap; “tinggal” merupakan ungkapan modern dan wajar.
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: dan menjadi satu bangsa
  rationale: עם menunjuk pada kelompok masyarakat, bukan secara khusus negara politik. “Menjadi” menyampaikan keadaan yang dihasilkan oleh perkawinan dan kehidupan bersama, sementara catatan kaki mencatat bentuk Ibrani yang lebih formal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan tunggal dipakai karena bentuk Ibrani pada “kepadamu” dan “bersamamu” mengacu kepada lawan bicara sebagai satu kelompok dengan bentuk jamak; dalam bahasa Indonesia bentuk “-mu” dapat merujuk secara kolektif sesuai konteks.
