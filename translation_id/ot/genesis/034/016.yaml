  naturalness: Teksnya umumnya lugas, tetapi “anak-anak perempuan” kurang alami daripada “putri-putri” dalam register perundingan antarkelompok ini. “Kepada kalian” dan “bersama kalian” secara jelas dan alami mempertahankan lawan bicara jamak.
  terminology: “Satu bangsa” dapat dipertahankan untuk לְעַם אֶחָד, yang menunjuk pada satu kelompok bangsa/masyarakat dan bukan harus negara modern. Catatan kaki perlu diperbaiki karena “ada sebagai satu bangsa” bukan penjelasan literal yang tepat untuk konstruksi לְעַם.
  issues:
