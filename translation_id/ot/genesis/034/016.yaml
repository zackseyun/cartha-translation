    rationale: Bentuk Ibrani לָכֶם dan אִתְּכֶם adalah orang kedua jamak. Walaupun -mu kadang dapat dipakai secara kolektif, “kalian” lebih jelas dalam bahasa Indonesia modern dan menghindari penyempitan kepada satu individu.
  - severity: low
