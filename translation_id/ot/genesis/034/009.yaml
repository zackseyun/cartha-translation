  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: id
  text: Jalinlah hubungan perkawinan dengan kami:[a] berikanlah anak-anak perempuan kalian kepada kami untuk kami nikahi, dan ambillah anak-anak perempuan kami untuk kalian nikahi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Berbesanlah dengan kami.” Kata kerja Ibrani menyatakan pembentukan hubungan perkawinan secara timbal balik antara kedua kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: Menikahlah dengan kaum kami
  rationale: Bentuk hitpael dari חתן menyatakan hubungan timbal balik melalui perkawinan. Frasa ini alami dalam bahasa Indonesia dan, dengan kata 'kaum', menunjukkan perkawinan antara kedua kelompok, bukan satu tindakan perkawinan saja.
- source_word: בְּנֹתֵיכֶם
  choice: anak-anak perempuanmu
  rationale: Bentuk jamak dengan sufiks orang kedua jamak maskulin. Dalam bahasa Indonesia, '-mu' dapat menyapa pihak kolektif dan menjaga kejelasan tanpa ungkapan yang kaku.
- source_word: תִּתְּנוּ לָנוּ
  choice: berikanlah ... kepada kami untuk menjadi istri
  rationale: נתן dalam konteks ini berarti memberikan anak perempuan dalam perkawinan. Tambahan 'untuk menjadi istri' menjelaskan maksud budaya ungkapan tersebut secara alami.
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: dan ambillah anak-anak perempuan kami untuk menjadi istri kalian
  rationale: לקח dengan objek 'anak-anak perempuan' dalam konteks ini berarti mengambil mereka dalam perkawinan. Terjemahan mempertahankan kesejajaran kata 'berikanlah' dan 'ambillah', sambil menjelaskan makna perkawinannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'untuk menjadi istri' memperjelas bahwa 'memberikan' dan 'mengambil' merujuk pada perkawinan, bukan kepemilikan biasa; penanda catatan kaki [a] ditempatkan sesudah klausa pertama yang memerlukan penjelasan.
