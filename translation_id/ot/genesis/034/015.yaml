  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: id
  text: Kami hanya akan setuju dengan kalian jika kalian menjadi seperti kami—yaitu, setiap laki-laki di antara kalian disunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Hanya dengan syarat ini
  rationale: אַךְ membatasi persetujuan pada satu ketentuan, sedangkan בְּזֹאת secara kontekstual memperkenalkan syarat yang segera dijelaskan.
- source_word: נֵאוֹת לָכֶם
  choice: kami akan setuju dengan kalian
  rationale: Bentuk Niphal dari אוה menyatakan kesediaan atau persetujuan; bahasa Indonesia secara alami memakai konstruksi 'setuju dengan'.
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: jika kalian menjadi seperti kami
  rationale: Dalam klausa bersyarat ini, היה menunjuk pada masuknya mereka ke dalam keadaan atau praktik yang sama dengan pihak penutur.
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: dengan menyunat setiap laki-laki di antara kalian
  rationale: Infinitif Niphal menjelaskan cara mereka menjadi seperti para penutur. Ungkapan aktif tak tentu dalam bahasa Indonesia alami, tetapi dapat terkesan mengaburkan bentuk pasif Ibrani; karena itu alternatif pasif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada negosiasi yang tegas. Kata ganti jamak 'kalian' dipakai karena pihak yang disapa berjumlah jamak. Terjemahan utama mengutamakan kelancaran, sementara catatan kaki mempertahankan bentuk pasif teks Ibrani.
