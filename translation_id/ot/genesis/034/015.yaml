  source_fidelity: Terjemahan draft menangkap pembatasan persetujuan, klausa syarat, dan cakupan “setiap laki-laki”. Namun, “dengan menyunat” mengubah infinitif Niphal לְהִמֹּל menjadi tindakan aktif yang pelakunya tidak dinyatakan dalam teks Ibrani. Bentuk pasif Indonesia lebih setia dan tidak menambahkan pelaku.
