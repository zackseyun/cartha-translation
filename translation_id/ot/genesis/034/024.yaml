  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: id
  text: Semua orang yang keluar dari gerbang kotanya mendengarkan[a] Hemor dan Sikhem, anaknya. Lalu setiap laki-laki—semua orang yang keluar dari gerbang kotanya[b]—disunat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengindahkan”. Ungkapan Ibrani ini dapat berarti bukan hanya mendengar, tetapi juga menanggapi dengan baik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “semua yang keluar dari gerbang kotanya”. Ungkapan ini menunjuk kepada warga laki-laki yang ikut dalam kehidupan umum kota.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: mendengarkan
  rationale: Konstruksi ini berarti mendengarkan atau mengindahkan seseorang. Dalam konteks ini mereka menerima usulan Hemor dan Sikhem; “mendengarkan” mempertahankan gambaran Ibrani tanpa memperkuatnya menjadi “menaati”.
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: semua orang yang keluar melalui gerbang kotanya
  rationale: Terjemahan ini mempertahankan ungkapan konkret dan pengulangannya dalam bahasa Ibrani. “Melalui” membuat gerak keluar dari gerbang terdengar wajar dalam bahasa Indonesia, sementara catatan kaki menjelaskan fungsi sosial ungkapan tersebut.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Keterangan hubungan keluarga yang langsung merujuk kepada Sikhem sebagai anak Hemor.
- source_word: וַיִּמֹּלוּ
  choice: disunat
  rationale: Bentuk Nifal dapat menyatakan tindakan pasif atau refleksif. Bentuk pasif Indonesia “disunat” alami dan tidak menentukan siapa yang melakukan penyunatan.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: Ungkapan ini mempertahankan cakupan distributif כָּל dengan nomina tunggal זָכָר. Dalam bahasa Indonesia, “setiap laki-laki ... disunat” tetap alami meskipun verba Ibrani berbentuk jamak.
- source_word: חֲמוֹר ... שְׁכֶם
  choice: Hemor ... Sikhem
  rationale: Menggunakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
