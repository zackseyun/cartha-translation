  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: id
  text: Lalu Yakub berkata kepada Simeon dan Lewi, “Kalian telah mendatangkan kesusahan kepadaku dan membuat aku berbau busuk[a] di antara penduduk negeri ini, di kalangan orang Kanaan dan orang Feris. Aku ini hanya sedikit jumlahnya; mereka akan berkumpul melawan aku dan menyerang aku, lalu aku akan dimusnahkan, aku dan seisi rumahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat aku berbau busuk”; maksudnya, membuat aku dibenci atau dipandang menjijikkan oleh penduduk negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲכַרְתֶּם
  choice: Kalian telah mendatangkan kesusahan kepadaku
  rationale: Bentuk verba ini menyatakan bahwa Simeon dan Lewi telah menimpakan kesusahan atau bencana kepada Yakub. Ungkapan ini alami dalam bahasa Indonesia tanpa mempersempit akibatnya.
- source_word: לְהַבְאִישֵׁנִי
  choice: membuat aku berbau busuk
  rationale: Hifil dari באש secara harfiah berarti ‘membuat berbau busuk’ dan di sini merupakan metafora bagi rusaknya nama atau timbulnya kebencian. Citra Ibrani dipertahankan, sedangkan makna idiomatis dijelaskan dalam catatan kaki.
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: di antara penduduk negeri ini
  rationale: Partisipel tunggal dipakai secara kolektif untuk populasi yang mendiami negeri itu. ‘Penduduk negeri ini’ jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: yaitu orang Kanaan dan orang Feris
  rationale: Kedua kelompok ini menjelaskan siapa yang dimaksud dengan penduduk negeri tersebut. ‘Yaitu’ menyampaikan hubungan aposisional yang tersirat dalam konstruksi Ibrani.
- source_word: מְתֵי מִסְפָּר
  choice: Jumlah orangku hanya sedikit
  rationale: Idiom Ibrani ini berarti suatu kelompok yang kecil secara jumlah. Penambahan ‘orangku’ secara kontekstual mengacu kepada kelompok atau rumah tangga Yakub dan menghasilkan bahasa Indonesia yang alami.
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: Jika mereka berkumpul untuk melawan aku
  rationale: Nifal menyatakan bahwa kelompok-kelompok itu berhimpun melawan Yakub. Dalam rangkaian wacana, waw konsekutif setelah klausa keadaan menyampaikan konsekuensi yang secara alami dapat dirender sebagai kondisi ‘jika’, tanpa mengubah ancaman yang dibayangkan Yakub.
- source_word: וְהִכּוּנִי
  choice: dan menyerang aku
  rationale: נכה mencakup memukul, menyerang, atau mengalahkan. ‘Menyerang aku’ cocok dengan ancaman kolektif dan tidak mendahului hasil akhir yang dinyatakan oleh verba berikutnya.
- source_word: וְנִשְׁמַדְתִּי
  choice: aku akan dimusnahkan
  rationale: שמד menyatakan kehancuran atau pemusnahan. Bentuk pasif ‘dimusnahkan’ mempertahankan kekuatan dan bentuk verba sumber.
- source_word: בֵּיתִי
  choice: seisi rumahku
  rationale: בַּיִת di sini menunjuk kepada seluruh unit rumah tangga Yakub, bukan bangunannya saja. ‘Seisi rumahku’ merupakan ungkapan Indonesia yang alami dan mencakup keluarga serta anggota rumah tangga.
