  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: id
  text: Lalu Sikhem berkata kepada ayah gadis itu dan saudara-saudaranya, “Kiranya aku mendapat perkenanan di mata kalian. Apa pun yang kalian katakan kepadaku[a], akan kuberikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa pun yang kalian minta dariku akan kuberikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “lalu” menyampaikan urutan itu secara wajar dalam bahasa Indonesia modern.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: kepada ayah gadis itu dan saudara-saudaranya
  rationale: Akhiran pronomina feminin merujuk kepada Dina. Penyebutan “gadis itu” menghindari kemungkinan bahwa akhiran “-nya” secara keliru dipahami merujuk kepada Sikhem, sedangkan “saudara-saudara” mempertahankan bentuk jamak maskulin Ibrani.
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: Kiranya aku mendapat kemurahan hati di mata kalian
  rationale: Ungkapan permohonan ini mempertahankan metafora Ibrani “di mata kalian” dan menyampaikan חֵן sebagai penerimaan atau kemurahan hati.
- source_word: וַאֲשֶׁר
  choice: Apa pun
  rationale: Klausa relatif tak tentu ini menyatakan cakupan yang terbuka; hubungan dengan kalimat sebelumnya tetap jelas tanpa perlu menerjemahkan waw secara tersendiri.
- source_word: תֹּאמְרוּ אֵלַי
  choice: yang kalian katakan kepadaku
  rationale: Terjemahan ini mempertahankan arti langsung אָמַר אֶל, tanpa mempersempitnya menjadi “yang kalian minta dariku,” meskipun konteks perundingan memungkinkan nuansa itu.
- source_word: אֶתֵּן
  choice: akan kuberikan
  rationale: Arti dasar נָתַן adalah “memberikan.” “Membayar” akan mempersempit makna berdasarkan konteks mas kawin dan pemberian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kata ganti jamak “kalian” dipakai karena Sikhem berbicara kepada ayah Dina dan saudara-saudaranya. Metafora sumber “di mata kalian” dipertahankan karena tetap mudah dipahami.
