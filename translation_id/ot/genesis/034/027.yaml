  terminology: '"Dicemari" mempertahankan cakupan istilah טמא, termasuk nuansa pelanggaran sosial-moral, tanpa mempersempitnya menjadi satu penafsiran. "Saudara perempuan mereka" tepat dan tidak menambahkan informasi usia. Penanda catatan kaki ditempatkan pada unsur yang relevan.'
