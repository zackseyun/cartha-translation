  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur utama Ibrani: putra-putra Yakub datang kepada/atas orang-orang yang telah terbunuh, lalu menjarah kota itu. Klausa "kota tempat saudara perempuan mereka telah dicemari" merupakan cara yang wajar untuk menangkap klausa relatif Ibrani yang padat. Penggunaan pasif dengan tepat menghindari kesan keliru bahwa putra-putra Yakub adalah pelaku pencemaran, tanpa secara eksplisit menambahkan pelaku.'
