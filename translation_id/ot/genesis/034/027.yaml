id: GEN.34.27
reference: Genesis 34:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: id
  text: Anak-anak lelaki Yakub mendatangi orang-orang yang terbunuh itu[a] lalu menjarah kota tempat saudara perempuan mereka telah dicemari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendatangi orang-orang yang tewas itu.” Ungkapan Ibraninya dapat menyatakan gerakan kepada atau atas mereka yang telah terbunuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: Anak-anak lelaki Yakub
  rationale: Menerjemahkan bentuk konstruksi secara jelas dan mempertahankan penekanan naratif pada putra-putra Yakub sebagai satu kelompok.
- source_word: בָּאוּ עַל
  choice: mendatangi
  rationale: Ungkapan ini secara harfiah menyatakan gerakan datang kepada atau atas suatu objek. Karena objeknya adalah orang-orang yang sudah terbunuh, 'mendatangi' tidak menambahkan gagasan serangan baru.
- source_word: הַחֲלָלִים
  choice: orang-orang yang terbunuh
  rationale: חֲלָלִים menunjuk kepada korban yang tewas akibat kekerasan; pilihan ini lebih tepat daripada sekadar 'orang-orang mati' dan lebih alami daripada bentuk nominal yang kaku.
- source_word: וַיָּבֹזּוּ
  choice: lalu menjarah
  rationale: בזז berarti merampas barang sebagai jarahan. 'Menjarah' merupakan padanan Indonesia modern yang jelas dan sesuai dengan konteks sesudah pembantaian.
- source_word: הָעִיר
  choice: kota
  rationale: Padanan lazim dan langsung bagi עִיר.
- source_word: אֲשֶׁר
  choice: tempat
  rationale: Partikel relatif ini menghubungkan kota dengan pencemaran saudara perempuan mereka. 'Tempat' mempertahankan hubungan relatif/lokatif tanpa mengubahnya secara tegas menjadi hubungan sebab-akibat.
- source_word: טִמְּאוּ
  choice: telah dicemari
  rationale: Bentuk pasif alami dalam bahasa Indonesia menghindari kesan keliru bahwa anak-anak lelaki Yakublah pelakunya, sambil mempertahankan cakupan moral dan sosial dari verba טמא dalam konteks ini.
- source_word: אֲחוֹתָם
  choice: saudara perempuan mereka
  rationale: Padanan langsung yang tidak menentukan apakah saudara itu lebih tua atau lebih muda.
theological_decisions:
- issue: Pelaku yang mencemari saudara perempuan mereka tidak disebutkan secara eksplisit dalam klausa Indonesia
  choice: Menggunakan bentuk pasif, 'telah dicemari'
  alternative: karena mereka telah mencemari saudara perempuan mereka
  rationale: Bahasa Ibrani memakai subjek jamak tersirat yang merujuk pada pihak di kota itu, tetapi terjemahan aktif dengan 'mereka' dalam bahasa Indonesia akan paling mudah disalahpahami sebagai merujuk kepada anak-anak lelaki Yakub. Bentuk pasif menjaga maksud naratif tanpa menambahkan pelaku yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Anak-anak lelaki Yakub' mempertahankan bentuk sumber; 'saudara perempuan' menghindari penentuan usia yang tidak terdapat dalam teks. Klausa relatif dengan 'tempat' mempertahankan kaitan kota dengan pencemaran tanpa menimbulkan ambiguitas pelaku.
