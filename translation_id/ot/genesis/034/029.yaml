  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: id
  text: Mereka membawa pergi semua harta benda, serta menawan semua anak-anak kecil dan istri-istri mereka; mereka juga menjarah segala sesuatu yang ada di rumah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang ada dalam rumah tangga”; kata Ibrani untuk “rumah” juga dapat menunjuk rumah tangga beserta miliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: semua harta benda mereka
  rationale: חַיִל dapat berarti kekayaan, sumber daya, atau milik. 'Harta benda' cukup luas untuk konteks penjarahan dan tidak membatasinya pada ternak atau kekuatan militer.
- source_word: טַפָּם
  choice: semua anak kecil mereka
  rationale: טַף lazim menunjuk anak-anak kecil atau anggota rumah tangga yang masih bergantung; 'anak kecil' mempertahankan penekanan usia dengan bahasa Indonesia yang alami.
- source_word: נְשֵׁיהֶם
  choice: istri-istri mereka
  rationale: אִשָּׁה dapat berarti perempuan atau istri. Dalam daftar anggota keluarga dengan sufiks posesif, makna relasional 'istri-istri mereka' paling wajar.
- source_word: שָׁבוּ
  choice: menawan
  rationale: שָׁבָה berarti menangkap atau membawa sebagai tawanan. 'Menawan' mempertahankan tindakan pengambilan tawanan secara ringkas.
- source_word: וַיָּבֹזּוּ
  choice: lalu menjarah
  rationale: בזז berarti menjarah atau mengambil sebagai rampasan. 'Menjarah' mempertahankan nuansa kekerasan dalam konteks ini.
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: segala sesuatu yang ada di rumah
  rationale: Terjemahan ini mengikuti bentuk tunggal בַּבָּיִת secara dekat sambil tetap alami; 'rumah' juga dapat dipahami secara kolektif atau metonimis dalam konteksnya.
