revisions:
- from: Mereka menawan semua harta benda mereka, semua anak kecil mereka, dan istri-istri mereka, lalu menjarah segala sesuatu yang ada di rumah.[a]
  to: Mereka membawa pergi semua harta benda, serta menawan semua anak-anak kecil dan istri-istri mereka; mereka juga menjarah segala sesuatu yang ada di rumah.[a]
  rationale: Revisi memisahkan pengambilan harta benda dari penawanan manusia agar terjemahan Indonesia tetap idiomatis dan setia pada cakupan daftar Ibrani. "Membawa pergi" menyampaikan pengambilan harta dalam konteks penyerbuan, sedangkan "menawan" secara eksplisit menerjemahkan tindakan terhadap anak-anak kecil dan para istri. Catatan tentang "rumah" dipertahankan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:07:42Z'
review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena "menawan semua harta benda" tidak wajar secara semantis dalam bahasa Indonesia. Kata Ibrani שָׁבָה terutama menyatakan tindakan membawa pergi/menawan; dalam rangkaian ini harta benda perlu dirender dengan verba yang dapat mencakup pengambilan barang, sedangkan anak-anak dan para istri tetap dinyatakan sebagai tawanan. Susunan revisi mempertahankan semua unsur sumber dan membiarkan "rumah" tetap tunggal, sambil menyediakan alternatif "rumah tangga" dalam catatan.
  naturalness: Teks draf tidak alami karena harta benda diperlakukan sebagai objek "menawan". "Membawa pergi semua harta benda ... serta menawan ..." jelas dan baku tanpa melunakkan kekerasan tindakan tersebut.
  terminology: '"Harta benda", "anak-anak kecil", "istri-istri", "menawan", dan "menjarah" sesuai untuk Bahasa Indonesia modern baku. Bentuk "istri-istri" mempertahankan jamak yang tampak dalam sumber; "anak-anak kecil" merepresentasikan טַף tanpa memperluasnya menjadi semua anak.'
