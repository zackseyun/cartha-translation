translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan objek dipertahankan sedekat mungkin dengan bahasa Ibrani, termasuk kejanggalan semantis bahwa 'harta benda' berada dalam rangkaian objek kata 'menawan'; hal ini menjaga sintaksis sumber tanpa diam-diam memindahkannya menjadi objek 'menjarah'.
