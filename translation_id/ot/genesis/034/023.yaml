  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: id
  text: Bukankah ternak, harta milik, dan semua hewan mereka akan menjadi milik kita? Asal kita mau bersepakat dengan mereka,[a] mereka akan tinggal bersama kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “asal kita bersedia kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: ternak mereka
  rationale: מִקְנֶה menunjuk pada hewan ternak sebagai kekayaan; “ternak” luas, alami, dan sesuai dengan konteks ekonomi.
- source_word: קִנְיָנָם
  choice: harta milik mereka
  rationale: קִנְיָן berarti milik atau harta yang diperoleh. “Harta milik” mempertahankan cakupan materialnya tanpa membatasinya pada barang bergerak.
- source_word: וְכָל בְּהֶמְתָּם
  choice: dan semua hewan mereka
  rationale: בְּהֵמָה merupakan istilah luas bagi hewan, khususnya hewan peliharaan. “Semua hewan” mempertahankan keluasan כָל dan membedakannya dari מִקְנֶה.
- source_word: הֲלוֹא לָנוּ הֵם
  choice: Bukankah ... akan menjadi milik kita?
  rationale: הֲלוֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan. Bentuk “Bukankah ...?” menyampaikan daya bujuknya secara wajar dalam bahasa Indonesia.
- source_word: אַךְ
  choice: hanya perlu
  rationale: אַךְ membatasi syarat yang harus dipenuhi. Dalam susunan Indonesia, “hanya perlu” secara alami menegaskan bahwa persetujuan itulah satu-satunya tindakan yang diperlukan.
- source_word: נֵאֹותָה לָהֶם
  choice: kita ... menyetujui permintaan mereka
  rationale: Bentuk dari אוה dalam Nifal menyatakan kesediaan atau persetujuan. Objek pronominal “kepada mereka” dibuat alami sebagai “permintaan mereka” sesuai konteks perundingan, tanpa mengubah inti tindak tutur.
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: lalu mereka akan tinggal bersama kita
  rationale: יָשַׁב mencakup tinggal atau menetap. “Tinggal bersama kita” mempertahankan gagasan hidup berdampingan yang sedang diajukan.
