  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: id
  text: Lalu Hamor dan Sikhem, anaknya, datang ke gerbang kota mereka dan berbicara kepada para lelaki kota mereka[a], dengan berkata:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada para lelaki kota mereka.” Yang dimaksud tampaknya para lelaki warga kota yang berkumpul untuk bermusyawarah di gerbang.'
    reason: cultural_note
  - marker: b
    text: 'Ibrani: “dengan berkata”; ini adalah formula yang mengantar ucapan berikutnya.'
    reason: translation_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא menggerakkan alur narasi; 'datang' wajar dengan tujuan yang disebutkan.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: וּשְׁכֶם בְּנוֹ
  choice: dan Sikhem, anaknya
  rationale: Mempertahankan hubungan anak dengan Hamor sekaligus memakai susunan Indonesia yang alami.
- source_word: אֶל שַׁעַר עִירָם
  choice: ke gerbang kota mereka
  rationale: Menerjemahkan secara dekat unsur 'gerbang', konstruksi kepunyaan, dan sufiks jamak 'mereka'; gerbang kota juga merupakan tempat musyawarah umum.
- source_word: וַיְדַבְּרוּ
  choice: berbicara kepada
  rationale: דבר dengan אֶל berarti berbicara kepada atau menyapa; pilihan ini sesuai dengan suasana pidato umum.
- source_word: אֶל אַנְשֵׁי עִירָם
  choice: kepada para lelaki kota itu
  rationale: אַנְשֵׁי secara harfiah menunjuk para lelaki; 'kota itu' menghindari kesan bahwa seluruh penduduk bersama-sama memiliki kota tersebut, sambil tetap merujuk kota Hamor dan Sikhem.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Ungkapan pengantar ujaran diterjemahkan secara idiomatis dalam narasi Indonesia; bentuk tunggal kolektif 'katanya' merangkum ucapan kedua tokoh.
