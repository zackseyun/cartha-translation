lexical_decisions:
- source_word: וַיִּיטְבוּ
  choice: dipandang baik
  rationale: Dalam idiom dengan בְּעֵינֵי, bentuk ini menyatakan penilaian positif atau persetujuan. “Dipandang baik” alami dalam bahasa Indonesia serta mempertahankan unsur evaluatif teks Ibrani.
- source_word: דִבְרֵיהֶם
  choice: perkataan mereka
  rationale: Menerjemahkan bentuk jamak דָּבָר dengan sufiks orang ketiga jamak secara cukup langsung, tanpa mempersempit artinya menjadi “usul mereka”.
- source_word: בְּעֵינֵי
  choice: oleh
  rationale: Secara harfiah berarti “di mata,” tetapi dalam konstruksi “dipandang baik,” kata “oleh” menyampaikan pihak yang memberi penilaian dengan wajar dalam bahasa Indonesia.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שְׁכֶם
  choice: Sikhem
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן חֲמוֹר
  choice: anak Hamor
  rationale: Menyampaikan hubungan keturunan secara langsung dan alami. Dalam konteks ini בֵּן menunjuk kepada anak laki-laki, tetapi “anak Hamor” merupakan identifikasi naratif yang ringkas dan tidak kaku.
