base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: id
  text: Jiwanya terpaut kepada Dina[a], anak perempuan Yakub. Ia mengasihi perempuan muda itu dan berbicara dengan lembut kepadanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Jiwanya melekat pada Dina.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berbicara kepada hati perempuan muda itu”; ungkapan Ibrani ini dapat berarti berbicara dengan lembut, menenangkan, atau membujuk.'
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ
  choice: Jiwanya terpaut
  rationale: Gabungan דבק dan נפש menggambarkan batin atau diri seseorang yang melekat kuat secara emosional. “Jiwanya terpaut” mempertahankan gambaran Ibrani sekaligus tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בְּדִינָה
  choice: kepada Dina
  rationale: Dengan verba דבק, preposisi ב menunjukkan pribadi yang menjadi tempat keterikatan; “kepada Dina” merupakan padanan Indonesia yang alami.
- source_word: בַּת יַעֲקֹב
  choice: anak perempuan Yakub
  rationale: Menerjemahkan aposisi Ibrani secara langsung dan jelas tanpa mengubah hubungan kekeluargaan yang dinyatakan.
- source_word: וַיֶּאֱהַב
  choice: Ia mengasihi
  rationale: אהב adalah verba umum untuk mengasihi atau mencintai. “Mengasihi” melaporkan perasaan yang dinyatakan teks tanpa menambah nuansa romantis atau hasrat yang tidak dinyatakan secara eksplisit.
- source_word: הַנַּעֲרָ
  choice: perempuan muda itu
  rationale: נַעֲרָה menunjuk seorang gadis atau perempuan muda. Pilihan ini jelas, modern, dan tidak bernada merendahkan.
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: berbicara dengan lembut kepadanya
  rationale: Ungkapan harfiah “berbicara kepada hati” merupakan idiom untuk berbicara dengan lembut, menenangkan, atau membujuk. Terjemahan utama menyampaikan fungsi idiom secara alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Bahasa perasaan Sikhem setelah kekerasan dalam konteks sebelumnya
  choice: Mempertahankan pernyataan ayat tentang keterikatan, kasih, dan tutur lembut tanpa menjadikannya pembenaran atas tindakannya.
  alternative: Menambahkan bahasa bernada kecaman atau, sebaliknya, memperkuat nuansa romantis dalam teks terjemahan.
  rationale: Ayat ini melaporkan keadaan batin dan perkataan tokoh secara lugas. Terjemahan tidak boleh menghapus ketegangan naratif dengan membenarkan ataupun menghakimi melalui tambahan yang tidak terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Jiwanya terpaut” mempertahankan daya gambar teks sumber, sedangkan klausa terakhir diterjemahkan secara idiomatis agar mudah dipahami. Kata ganti “kepadanya” menghindari pengulangan yang kaku tanpa mengaburkan rujukannya.
