base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: id
  text: 'Hanya dengan syarat ini laki-laki itu akan setuju dengan kita untuk tinggal bersama kita dan menjadi satu bangsa: setiap laki-laki di antara kita harus disunat, sebagaimana mereka disunat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: Hanya dengan syarat ini
  rationale: Gabungan partikel pembatas dan frasa preposisional memperkenalkan satu-satunya syarat bagi persetujuan; bentuk ini jelas dan wajar dalam bahasa Indonesia.
- source_word: יֵאֹתוּ לָנוּ
  choice: akan setuju dengan kita
  rationale: Bentuk Nifal dari אוה menyatakan kesediaan atau persetujuan dalam konteks perundingan. Frasa ini mempertahankan makna relasional tanpa menentukan lebih jauh nuansanya.
- source_word: הָאֲנָשִׁים
  choice: orang-orang itu
  rationale: Nomina maskulin jamak menunjuk kepada kelompok laki-laki yang sedang dibicarakan; 'orang-orang itu' alami dalam konteks, sementara tuntutan pada bagian akhir secara eksplisit memakai 'setiap laki-laki'.
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: untuk tinggal bersama kita
  rationale: ישב di sini menyatakan hidup atau menetap bersama; 'tinggal bersama' merupakan ungkapan Indonesia yang alami dan tidak terlalu menafsirkan lamanya pemukiman.
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: menjadi satu bangsa
  rationale: Frasa ini menyatakan pembentukan satu kesatuan sosial. 'Bangsa' menyampaikan עַם secara wajar dalam konteks penggabungan dua kelompok, tanpa menyiratkan negara modern.
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: setiap laki-laki di antara kita harus disunat
  rationale: Infinitif dengan בְּ menyatakan syarat. 'Harus' membuat fungsi persyaratan jelas, dan 'setiap laki-laki' mempertahankan cakupan זָכָר yang tidak terbatas pada pria dewasa.
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: sama seperti mereka sudah disunat
  rationale: Klausa perbandingan menunjuk pada keadaan kelompok tersebut sebagai orang-orang bersunat. 'Sudah disunat' alami dalam bahasa Indonesia dan menyatakan keadaan hasil tanpa menambahkan pelaku.
