id: GEN.34.21
reference: Genesis 34:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: id
  text: “Orang-orang ini hidup damai dengan kita[a]. Biarlah mereka tinggal di negeri ini dan berdagang di dalamnya[b]. Lihatlah, negeri ini cukup luas bagi mereka[c]. Kita akan mengambil anak-anak perempuan mereka menjadi istri kita, dan kita akan memberikan anak-anak perempuan kita kepada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersahabat dengan kita” atau “berhubungan baik dengan kita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berdagang melintasinya.” Bahasa Ibrani dapat menunjuk pada kegiatan perdagangan di dalam negeri itu atau perjalanan niaga melalui wilayahnya.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “negeri ini—lihatlah—luas tangan di hadapan mereka,” sebuah ungkapan yang berarti bahwa negeri itu lapang atau menyediakan cukup ruang bagi mereka.'
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים
  choice: hidup damai
  rationale: Dalam hubungan dengan אִתָּנוּ, kata sifat ini menyatakan keadaan damai atau hubungan baik. 'Hidup damai dengan kita' alami dalam bahasa Indonesia dan tidak melebihkan maknanya menjadi keakraban.
- source_word: וְיֵשְׁבוּ
  choice: Biarlah mereka tinggal
  rationale: Bentuk imperfek ini berfungsi sebagai ajakan atau izin dalam pidato kepada warga kota. 'Biarlah' mempertahankan daya hortatifnya.
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: dan berdagang di dalamnya
  rationale: סחר menunjuk pada kegiatan niaga, sedangkan pronomina feminin merujuk kepada negeri itu. 'Di dalamnya' menyatakan negeri sebagai lingkup perdagangan sambil mencatat kemungkinan arti 'melintasinya' dalam catatan kaki.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata ini mengarahkan perhatian pendengar kepada alasan yang menyusul. 'Lihatlah' jelas, bermartabat, dan lebih wajar daripada padanan yang arkais.
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: negeri ini cukup luas bagi mereka
  rationale: Ungkapan harfiah 'luas tangan di hadapan mereka' merupakan idiom tentang kelapangan atau ruang yang tersedia. Terjemahan ini menyampaikan maknanya secara alami.
- source_word: אֶת בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים
  choice: Kita akan mengambil anak-anak perempuan mereka menjadi istri kita
  rationale: Bentuk imperfek menyatakan usul atau niat. 'Menjadi istri kita' mempertahankan unsur לָנוּ dan idiom perkawinan tanpa menambah gagasan yang tidak ada dalam teks.
- source_word: וְאֶת בְּנֹתֵינוּ נִתֵּן לָהֶם
  choice: dan kita akan memberikan anak-anak perempuan kita kepada mereka
  rationale: Terjemahan ini mempertahankan kesejajaran dan timbal balik pengaturan perkawinan dalam klausa sebelumnya.
