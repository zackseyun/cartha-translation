  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'biarlah' mempertahankan nuansa ajakan, sedangkan 'lihatlah' menyampaikan penanda perhatian הִנֵּה tanpa gaya yang terlalu arkais.
