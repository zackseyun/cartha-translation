  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: id
  text: Lalu Hamor, ayah Sikhem, keluar menemui Yakub untuk berbicara dengannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lalu ... pergi menemui
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita, sedangkan verba יצא menyatakan gerak keluar/pergi. Dalam bahasa Indonesia, konteks tujuan personal dengan אֶל paling alami diungkapkan sebagai 'pergi menemui' tanpa menghilangkan gerak menuju Yakub.
- source_word: חֲמוֹר
  choice: Hamor
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲבִי שְׁכֶם
  choice: ayah Sikhem
  rationale: Rangkaian konstruksi Ibrani secara langsung menyatakan hubungan 'ayah Sikhem'; susunan ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֶל יַעֲקֹב
  choice: menemui Yakub
  rationale: Preposisi אֶל menandai arah gerak menuju seseorang. Dalam konteks ini, 'menemui Yakub' merupakan padanan Indonesia yang alami.
- source_word: לְדַבֵּר אִתּוֹ
  choice: untuk berbicara dengannya
  rationale: Infinitif berpreposisi menyatakan tujuan. 'Berbicara dengannya' mempertahankan nuansa percakapan dua arah; pronomina tersebut paling wajar merujuk kepada Yakub.
- source_word: וַ
  choice: Lalu
  rationale: Waw pada wayyiqtol memajukan rangkaian narasi; 'Lalu' menyampaikan urutan itu secara alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk 'pergi menemui' dipilih agar arah gerak dan tujuan pertemuan terdengar alami; tidak diperlukan catatan kaki.
