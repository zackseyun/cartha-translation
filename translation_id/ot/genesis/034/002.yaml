  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: id
  text: Ketika Sikhem, anak Hemor, orang Hewi, pemimpin negeri itu, melihatnya, ia mengambilnya, menidurinya, dan merendahkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “merendahkannya” juga dapat berarti “menindasnya” atau “mempermalukannya”; dalam konteks tindakan seksual ini, kata itu juga dapat menunjuk pada pelanggaran seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: melihat dia
  rationale: Makna naratif dasar ראה dipertahankan. Pronomina feminin diterjemahkan sebagai “dia”; acuannya adalah Dina dari ayat sebelumnya.
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: Sikhem, anak Hemor, orang Hewi
  rationale: Nama diri dan nama kelompok etnis ditransliterasikan menurut bentuk Indonesia yang lazim; hubungan konstruksi diterjemahkan secara alami.
- source_word: נְשִׂיא הָאָרֶץ
  choice: pemimpin negeri itu
  rationale: נָשִׂיא menunjuk kepada pemimpin atau kepala. “Pemimpin” mempertahankan status sosial-politiknya tanpa menyiratkan sistem kerajaan secara lebih khusus daripada teks.
- source_word: וַיִּקַּח אֹתָהּ
  choice: Sikhem mengambilnya
  rationale: לקח pada dasarnya berarti “mengambil”. Pengulangan nama “Sikhem” menghindari rentetan pronomina yang kabur dalam bahasa Indonesia, sedangkan unsur paksaan dinyatakan dengan jelas oleh penutup rangkaian tindakan.
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: menidurinya
  rationale: Dalam konteks ini, idiom שׁכב אֶת menyatakan hubungan seksual. “Menidurinya” alami, ringkas, dan tetap bernada serius.
- source_word: וַיְעַנֶּהָ
  choice: memerkosanya
  rationale: Bentuk piel ענה dapat berarti menindas, merendahkan, atau mempermalukan. Dalam rangkaian tindakan seksual ini, kata tersebut menyatakan pelanggaran seksual dengan unsur paksaan; “memerkosanya” menyampaikan maksud kontekstual itu secara jelas dan tidak menutupi kekerasannya.
theological_decisions:
- issue: Mengungkapkan kekerasan seksual tanpa memperhalusnya atau melebihi bukti konteks Ibrani
  choice: menidurinya, dan memerkosanya
  alternative: menidurinya, dan merendahkannya
  rationale: Makna leksikal ענה lebih luas daripada “memerkosa”, tetapi gabungannya dengan “mengambil” dan “meniduri” di sini menunjukkan pelanggaran seksual yang bersifat memaksa. Teks utama menyatakannya dengan gamblang, sementara catatan kaki mempertahankan keluasan makna harfiah kata Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “memerkosa” dipilih agar kekerasan seksual tidak tersamarkan oleh ungkapan yang dapat disalahpahami sebagai hubungan suka sama suka; catatan kaki tetap memperlihatkan rentang makna kata Ibrani.
