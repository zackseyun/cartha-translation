  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: id
  text: Pemuda itu tidak menunda untuk melakukan hal itu[a], sebab ia menginginkan putri Yakub[b], dan dialah yang paling dihormati di seluruh keluarga ayahnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tidak ragu-ragu untuk melakukan hal itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyukai putri Yakub” atau “berkenan kepada putri Yakub.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “ia lebih dihormati daripada semua orang dalam keluarga ayahnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵחַר
  choice: tidak menunda
  rationale: Kata kerja ini terutama menyatakan keterlambatan atau penangguhan. Dalam konteks ini, frasa tersebut menekankan bahwa Sikhem segera bertindak.
- source_word: הַנַּעַר
  choice: pemuda itu
  rationale: Mengacu kepada Sikhem; 'pemuda' wajar dalam narasi Indonesia modern dan tidak menyiratkan bahwa ia masih anak-anak.
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: untuk melakukan hal itu
  rationale: Ungkapan ini merujuk kembali kepada tindakan yang diminta dalam ayat sebelumnya. 'Hal itu' mempertahankan acuan umum bahasa Ibrani sekaligus lebih alami daripada 'perkara itu'.
- source_word: כִּי
  choice: sebab
  rationale: Kata penghubung ini memperkenalkan alasan mengapa Sikhem tidak menunda.
- source_word: חָפֵץ
  choice: menginginkan
  rationale: Dalam konteks hubungan Sikhem dengan putri Yakub, kata ini menyatakan hasrat atau keinginan kuat. Pilihan ini mempertahankan cakupan maknanya tanpa menambahkan penilaian moral yang tidak dinyatakan oleh kata tersebut.
- source_word: בְּבַת יַעֲקֹב
  choice: putri Yakub
  rationale: Objek חָפֵץ dengan preposisi בְ dapat diterjemahkan secara idiomatis sebagai sesuatu atau seseorang yang diinginkan. 'Putri Yakub' alami dalam bahasa Indonesia dan mengikuti cara narator menyebut Dina di sini.
- source_word: נִכְבָּד
  choice: yang paling dihormati
  rationale: Partisipel Nifal dari כבד menyatakan bahwa seseorang dihormati atau terpandang. Bersama מִכֹּל, konstruksi ini secara alami dapat dinyatakan sebagai superlatif dalam bahasa Indonesia.
- source_word: מִכֹּל בֵּית אָבִיו
  choice: di seluruh keluarga ayahnya
  rationale: בֵּית אָבִיו menunjuk rumah tangga atau keluarga besar ayahnya, bukan semata-mata bangunan rumah. מִכֹּל bersama kata sifat mendukung arti 'paling ... di antara seluruh' kelompok itu.
theological_decisions:
- issue: Nuansa חָפֵץ terhadap putri Yakub
  choice: menginginkan
  alternative: menyukai / berkenan kepada
  rationale: Konteks mendukung keinginan kuat, tetapi kata Ibrani juga dapat mengandung nuansa kesukaan atau kesenangan. Teks utama memakai ungkapan yang alami tanpa mempersempitnya secara khusus menjadi hasrat seksual; alternatif dicatat.
- issue: Bentuk perbandingan נִכְבָּד מִכֹּל
  choice: yang paling dihormati di seluruh keluarga ayahnya
  alternative: lebih dihormati daripada semua orang dalam keluarga ayahnya
  rationale: Konstruksi Ibrani dapat diungkapkan sebagai superlatif atau perbandingan eksplisit. Keduanya secara makna sepadan; bentuk superlatif lebih alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Keluarga ayahnya' dipilih untuk בית אביו agar pembaca tidak memahaminya hanya sebagai bangunan rumah. Penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
