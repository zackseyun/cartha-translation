base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: id
  text: “Mintalah dariku pembayaran perkawinan[a] dan pemberian dalam jumlah yang sangat besar, dan aku akan memberikan apa pun yang kalian katakan kepadaku. Berikan saja perempuan muda itu kepadaku untuk menjadi istriku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani מֹהַר secara khusus menunjuk pada pembayaran yang diberikan oleh calon suami atau keluarganya kepada keluarga calon istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: Mintalah dariku ... yang sangat besar
  rationale: Bentuk imperatif jamak menyuruh para pendengar menetapkan tuntutan yang tinggi kepada pembicara. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan מְאֹד.
- source_word: מֹהַר
  choice: mas kawin
  rationale: Istilah ini menunjuk pada pembayaran dari pihak laki-laki kepada keluarga perempuan dalam rangka perkawinan. 'Mas kawin' merupakan padanan Indonesia yang umum, meski adat yang dimaksud tidak sepenuhnya identik dengan pemakaian modern.
- source_word: וּמַתָּן
  choice: dan pemberian
  rationale: Kata benda ini menunjuk pada pemberian tambahan yang menyertai pembayaran perkawinan; bentuk tunggal sumber dipertahankan.
- source_word: וְאֶתְּנָה
  choice: dan aku akan memberikan
  rationale: Bentuk kohortatif menyatakan kesediaan atau tekad pembicara, yang secara alami disampaikan dengan bentuk futur dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: apa pun yang kalian katakan kepadaku
  rationale: Frasa ini menyatakan kesediaan memenuhi berapa pun jumlah atau syarat yang mereka sebutkan, tanpa membatasi tuntutan itu.
- source_word: וּתְנוּ לִי
  choice: Berikan saja ... kepadaku
  rationale: Kata 'saja' secara alami menampilkan permohonan utama yang menjadi puncak tawaran, tanpa menambahkan syarat baru.
- source_word: הַנַּעֲרָ
  choice: perempuan muda itu
  rationale: Istilah ini menunjuk pada seorang perempuan muda yang sudah berada dalam konteks perkawinan; pilihan ini lebih tepat daripada 'gadis' jika status keperawanannya tidak hendak ditegaskan.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istriku
  rationale: Ungkapan perkawinan Ibrani ini paling jelas dan alami diterjemahkan demikian dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa langsung, modern, dan bermartabat. Pronomina jamak 'kalian' memperjelas bahwa perintah ditujukan kepada lebih dari satu orang. Istilah 'mas kawin' dipakai karena dikenal luas, dengan catatan kaki untuk menjelaskan adat pembayaran dalam konteks Ibrani kuno.
