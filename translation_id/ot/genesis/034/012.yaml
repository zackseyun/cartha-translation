  - severity: low
    issue: Penanda catatan kaki ditempatkan setelah “besar”, bukan setelah istilah yang dijelaskan.
    rationale: Catatan menjelaskan מֹהַר, sehingga jangkar sebaiknya langsung mengikuti padanan istilah tersebut.
