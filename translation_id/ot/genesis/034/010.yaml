  verdict: revise
  source_fidelity: Teks secara umum setia pada undangan untuk tinggal, ketersediaan tanah, menetap, berdagang, dan memperoleh kepemilikan. Namun, “perolehlah tanah milik” kurang idiomatis dan dapat dipahami sebagai jenis tanah tertentu, bukan perolehan hak/pegangan atas tanah sebagaimana kemungkinan makna bentuk Niphal הֵאָחֲזוּ.
  naturalness: Bahasa baku dan jelas. “Kalian” tepat untuk bentuk jamak. Mengganti frasa terakhir dengan “perolehlah hak milik di negeri ini” membuat rangkaian imperatif lebih alami dalam bahasa Indonesia modern.
  terminology: “Negeri” layak untuk הָאָרֶץ dalam konteks wilayah tanah. “Terbuka bagi kalian” menyampaikan idiom “ada di hadapan kalian” sebagai ketersediaan tanpa menghilangkan catatan harfiahnya. “Hak milik” tepat untuk nuansa pegangan atau hak atas tanah dan tidak menyiratkan perebutan paksa.
