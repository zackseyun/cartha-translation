  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: id
  text: Kalian boleh tinggal bersama kami, dan negeri ini terbuka bagi kalian.[a] Menetaplah di negeri ini, berdaganglah di sana, dan perolehlah hak milik di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri itu akan ada di hadapan kalian,” yaitu tersedia bagi kalian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “dapatkanlah milik di sana” atau “ambillah hak milik di sana.” Ungkapan Ibrani ini kemungkinan merujuk pada memperoleh tanah atau hak kepemilikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: Kalian boleh tinggal bersama kami
  rationale: Bentuk imperfek dalam konteks undangan ini menyampaikan izin atau tawaran. “Tinggal bersama kami” mempertahankan makna kediaman dari יָשַׁב dalam bahasa Indonesia yang wajar.
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: dan negeri ini terbuka bagi kalian
  rationale: Ungkapan harfiah “negeri itu akan ada di hadapan kalian” menyatakan bahwa negeri tersebut tersedia dan dapat dimanfaatkan. “Terbuka bagi kalian” menyampaikan fungsi idiom itu secara alami tanpa membatasi cakupannya hanya pada tempat tinggal.
- source_word: שְׁבוּ
  choice: Menetaplah di negeri ini
  rationale: Imperatif dari יָשַׁב di sini mengundang mereka untuk mengambil tempat tinggal tetap. Penyebutan “negeri ini” memperjelas rujukan sufiks feminin pada rangkaian perintah berikutnya.
- source_word: וּסְחָרוּהָ
  choice: berdaganglah di sana
  rationale: Kata kerja סחר menunjuk pada kegiatan perdagangan. “Berdaganglah” ringkas, tepat, dan lazim dalam bahasa Indonesia modern.
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: dan perolehlah tanah milik di sana
  rationale: Bentuk Niphal dari אָחַז dalam konteks ini kemungkinan menunjuk pada memperoleh pegangan atau hak milik atas tanah. “Perolehlah tanah milik” mengungkapkan dimensi kepemilikan tanpa menyiratkan perebutan dengan kekerasan.
