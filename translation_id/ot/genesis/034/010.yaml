  register: Bahasa Indonesia baku modern dengan sapaan jamak “kalian,” sesuai dengan bentuk jamak dalam bahasa Ibrani. Nada undangan dan rangkaian perintah dipertahankan dengan gaya yang jelas serta bermartabat.
