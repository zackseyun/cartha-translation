  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: id
  text: Namun, jika kalian tidak mengindahkan kami dalam hal disunat[a], kami akan mengambil anak perempuan kami lalu pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “mendengarkan kami untuk disunat.” Frasa infinitif Ibrani ini dapat dipahami sebagai isi dari hal yang harus mereka indahkan, yakni kesediaan untuk disunat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: Namun, jika
  rationale: Konjungsi ini menghubungkan syarat tersebut dengan tawaran sebelumnya sekaligus menyatakan pertentangan; “Namun, jika” wajar dalam bahasa Indonesia.
- source_word: לֹא תִשְׁמְעוּ אֵלֵינוּ
  choice: kalian tidak mau mendengarkan kami
  rationale: שׁמע dengan אֶל berarti “mendengarkan” atau “mengindahkan.” Dalam konteks syarat yang menyangkut kesediaan, “tidak mau mendengarkan” menyampaikan maksud tanpa memperkuatnya menjadi “menaati.”
- source_word: לְ/הִמּוֹל
  choice: dan disunat
  rationale: Infinitif nifal menyatakan tindakan yang menjadi isi atau bukti pengindahan mereka. Koordinasi dengan “mendengarkan kami” menghasilkan bahasa Indonesia yang alami sambil mempertahankan makna pasif “disunat.”
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: kami akan mengambil anak perempuan kami
  rationale: Bentuk perfektum berwaw dalam akibat syarat memiliki makna mendatang. “Anak perempuan kami” menerjemahkan sufiks orang pertama jamak secara langsung; dalam konteks, yang dimaksud ialah Dina.
- source_word: וְ/הָלָכְנוּ
  choice: lalu pergi
  rationale: הלך di sini berarti pergi atau beranjak dari tempat itu. “Lalu pergi” menyatakan kelanjutan tindakan secara alami.
