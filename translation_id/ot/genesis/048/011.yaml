  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖י/ךָ לֹ֣א פִלָּ֑לְתִּי וְ/הִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛/י אֱלֹהִ֖ים גַּ֥ם אֶת זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: id
  text: Israel berkata kepada Yusuf, “Aku tidak menyangka akan melihat wajahmu, dan ternyata Allah bahkan telah memperlihatkan keturunanmu kepadaku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; dalam bahasa Indonesia, urutan peristiwa sudah jelas tanpa harus selalu menambahkan kata penghubung.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub, sehingga nama itu dipertahankan.
- source_word: רְאֹה פָנֶיךָ
  choice: melihat wajahmu lagi
  rationale: Ungkapan konkret Ibrani 'melihat wajahmu' dipertahankan; 'lagi' menyatakan implikasi konteks bahwa Israel sebelumnya mengira Yusuf telah tiada.
- source_word: לֹא פִלָּלְתִּי
  choice: Aku tidak menyangka
  rationale: Dalam konteks ini, verba פלל menyatakan perkiraan atau harapan, bukan doa. 'Tidak menyangka' alami dalam bahasa Indonesia dan menyampaikan keterkejutan Israel.
- source_word: וְהִנֵּה
  choice: tetapi lihatlah
  rationale: Partikel ini menandai kejutan dan peralihan yang kuat; 'lihatlah' mempertahankan daya retorisnya, sedangkan 'tetapi' membuat kontrasnya jelas dan alami.
- source_word: הֶרְאָה אֹתִי
  choice: telah memperlihatkan ... kepadaku
  rationale: Bentuk kausatif dari ראה diterjemahkan secara langsung dan wajar, yakni bahwa Allah membuat atau mengizinkan Israel melihat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Ini adalah gelar ilahi umum dalam bahasa Ibrani; 'Allah' merupakan padanan baku dan alami dalam Alkitab bahasa Indonesia.
- source_word: גַּם
  choice: bahkan
  rationale: 'Kata ini menekankan berkat tambahan yang melampaui dugaan Israel: bukan hanya Yusuf, melainkan juga keturunannya.'
- source_word: זַרְעֶךָ
  choice: keturunanmu
  rationale: Kata זרע adalah nomina kolektif. 'Keturunanmu' mempertahankan keluasan maknanya dan sesuai dengan Efraim serta Manasye yang hadir dalam konteks.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים dalam kisah para leluhur
  choice: Allah
  alternative: Tuhan
  rationale: Teks memakai gelar umum אֱלֹהִים, bukan nama perjanjian YHWH. 'Allah' mempertahankan pembedaan leksikal tersebut tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ungkapan konkret 'melihat wajahmu' dipertahankan, sementara susunan kalimat disesuaikan agar jelas bagi pembaca umum.
