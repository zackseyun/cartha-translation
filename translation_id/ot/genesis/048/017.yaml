  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: id
  text: Ketika Yusuf melihat bahwa ayahnya meletakkan tangan kanannya di atas kepala Efraim, hal itu tidak berkenan di matanya[a]. Lalu ia memegang tangan ayahnya untuk memindahkannya dari atas kepala Efraim ke atas kepala Manasye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih lancar, “hal itu tidak menyenangkan hatinya.” Secara harfiah, ungkapan Ibrani berarti “hal itu buruk/tidak berkenan di matanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: Ketika Yusuf melihat bahwa
  rationale: Bentuk naratif וַיַּרְא melanjutkan peristiwa, sedangkan כִּי memperkenalkan isi yang dilihat Yusuf. Susunan ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporal serta isi penglihatan.
- source_word: יָשִׁית
  choice: meletakkan
  rationale: Verba ini berarti menaruh atau menempatkan. Bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia karena urutan waktunya jelas dari konteks.
- source_word: יַד יְמִינוֹ
  choice: tangan kanannya
  rationale: Padanan Indonesia yang langsung dan alami, sekaligus mempertahankan pentingnya tangan kanan dalam tindakan pemberkatan.
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: hal itu tidak berkenan di matanya
  rationale: Mempertahankan citra idiom Ibrani 'buruk/tidak menyenangkan di matanya' tanpa memberi kesan bahwa tindakan tersebut secara moral jahat.
- source_word: וַיִּתְמֹךְ
  choice: ia memegang
  rationale: Dalam konteks ini תמך menunjuk pada tindakan memegang tangan ayahnya untuk mengarahkannya, tanpa harus menyiratkan kekerasan seperti 'merenggut'.
- source_word: לְהָסִיר אֹתָהּ
  choice: untuk memindahkannya
  rationale: הסיר dapat berarti menyingkirkan atau mengalihkan. 'Memindahkannya' paling jelas menggambarkan maksud Yusuf mengalihkan tangan itu dari satu kepala ke kepala lainnya.
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: dari atas kepala Efraim ke atas kepala Manasye
  rationale: Mengungkapkan arah perpindahan dengan jelas serta mempertahankan pengulangan konkret 'kepala' dan relasi עַל.
