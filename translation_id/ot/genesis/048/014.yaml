base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: id
  text: Lalu Israel mengulurkan tangan kanannya dan meletakkannya di atas kepala Efraim, meskipun Efraim lebih muda, serta meletakkan tangan kirinya di atas kepala Manasye, dengan sengaja menyilangkan kedua tangannya[a], sebab Manasye adalah anak sulung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengatur posisi tangannya dengan cermat.” Ungkapan Ibrani dapat menekankan pengaturan tangan yang disengaja dan terampil; konteks menunjukkan bahwa tangan-tangan itu disilangkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengulurkan
  rationale: Dalam konteks gerakan tangan, verba ini berarti mengulurkan, bukan mengirim; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: וַיָּשֶׁת
  choice: meletakkannya
  rationale: Verba ini menunjukkan tindakan menaruh tangan di atas kepala secara sengaja.
- source_word: יְמִינוֹ
  choice: tangan kanannya
  rationale: Menyatakan 'tangan' secara eksplisit sesuai teks Ibrani dan memperjelas gerakan pemberkatan.
- source_word: וְהוּא הַצָּעִיר
  choice: walaupun ia yang lebih muda
  rationale: 'Klausa ini berfungsi konsesif dalam konteks: Efraim menerima tangan kanan meskipun ia lebih muda.'
- source_word: שְׂמֹאלוֹ
  choice: tangan kirinya
  rationale: Bentuk lengkap menjaga kesejajaran dengan 'tangan kanannya' dan sesuai dengan makna Ibrani.
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: Ia menyilangkan tangannya dengan sengaja
  rationale: Konteks menunjukkan penempatan tangan yang bersilang dan disengaja, tetapi ungkapan Ibrani juga dapat menekankan pengaturan tangan secara cermat; catatan kaki mempertahankan nuansa tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan penjelasan mengenai penempatan tangan yang tidak lazim.
- source_word: הַבְּכֹר
  choice: anak sulung
  rationale: Mempertahankan arti dan bobot budaya urutan kelahiran dalam konteks pemberkatan.
theological_decisions:
- issue: Makna שִׂכֵּל אֶת יָדָיו
  choice: Israel sengaja menyilangkan tangannya ketika memberkati Efraim dan Manasye.
  alternative: Israel mengatur atau mengarahkan tangannya dengan cermat tanpa menyatakan secara eksplisit bahwa kedua tangannya bersilang.
  rationale: Tangan kanan ditempatkan pada Efraim yang lebih muda dan tangan kiri pada Manasye yang sulung, sehingga konteks sangat mendukung gerakan menyilang yang disengaja. Catatan kaki tetap mengakui keluasan ungkapan Ibraninya tanpa menambahkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama 'Israel' dipertahankan sesuai teks sumber. Pengulangan 'tangan' menjaga kejelasan dan kesejajaran, sedangkan 'dengan sengaja' menampilkan unsur kesengajaan yang terkandung dalam ungkapan Ibrani.
