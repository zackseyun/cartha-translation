  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: id
  text: Malaikat yang telah menebus aku dari segala malapetaka[a], kiranya memberkati kedua anak ini. Kiranya mereka menyandang namaku dan nama nenek moyangku, Abraham dan Ishak[b], dan kiranya mereka bertambah banyak di tengah negeri[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari segala kejahatan”, “dari segala bahaya”, atau “dari setiap kesusahan”. Kata Ibrani dapat menunjuk baik kepada kejahatan moral maupun kepada kemalangan atau bencana.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kiranya namaku dan nama nenek moyangku, Abraham dan Ishak, disebut atas mereka”; dapat juga dipahami, “kiranya mereka disebut dengan namaku.”
    reason: lexical_alternative
  - marker: c
    text: Kata kerja Ibrani yang langka ini menggambarkan pertambahan yang sangat banyak dan mungkin membangkitkan gambaran ikan yang berkembang biak dengan limpah.
    reason: lexical_alternative
  - marker: d
    text: Atau “di tengah bumi”. Kata Ibrani dapat berarti “negeri”, “tanah”, atau “bumi”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: Malaikat
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat. Dalam konteks perlindungan ilahi yang dikenang Yakub, “Malaikat” merupakan padanan Indonesia yang alami tanpa menentukan lebih jauh identitas ontologisnya.
- source_word: הַגֹּאֵל אֹתִי
  choice: yang telah menebus aku
  rationale: Partisip גאל menggambarkan pribadi yang bertindak sebagai penebus atau pembebas. Bentuk lampau sesuai dengan tinjauan Yakub atas pemeliharaan sepanjang hidupnya, sedangkan “menebus” mempertahankan bobot istilah sumber.
- source_word: מִכָּל רָע
  choice: dari segala malapetaka
  rationale: רָע mencakup kejahatan, kemalangan, bahaya, atau bencana. Dalam kesaksian tentang pemeliharaan hidup Yakub, “malapetaka” menyampaikan kemalangan yang mengancam tanpa menyiratkan bahwa ia ditebus dari kesalahan moralnya sendiri.
- source_word: יְבָרֵךְ אֶת הַנְּעָרִים
  choice: kiranya memberkati kedua anak ini
  rationale: Bentuk yiqtol berfungsi sebagai harapan dalam berkat. הַנְּעָרִים menunjuk kepada Efraim dan Manasye; “kedua anak ini” alami dalam konteks langsung dan menyatakan rujukan ganda dengan jelas.
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: Kiranya namaku dan nama nenek moyangku ... tetap hidup dalam diri mereka
  rationale: Ungkapan harfiah “nama ... disebut atas/dalam mereka” menandakan bahwa mereka menyandang dan meneruskan identitas keluarga. Padanan ini menyampaikan idiom tersebut secara wajar, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲבֹתַי
  choice: nenek moyangku
  rationale: Karena Abraham dan Ishak masing-masing adalah kakek dan ayah Yakub, “nenek moyang” lebih tepat dan alami daripada “bapa-bapaku” dalam bahasa Indonesia modern.
- source_word: וְיִדְגּוּ לָרֹב
  choice: kiranya mereka bertambah banyak
  rationale: Verba langka דגה menyatakan perkembangbiakan berlimpah dan mungkin membangkitkan citra ikan. Terjemahan utama menyampaikan hasil idiomatisnya; nuansa citra itu dipertahankan dalam catatan kaki.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: di tengah negeri
  rationale: אֶרֶץ dapat berarti negeri, tanah, atau bumi. Konteks keturunan dan warisan leluhur mendukung “negeri”, sambil mempertahankan kemungkinan “bumi” dalam catatan kaki.
theological_decisions:
- issue: Identitas “Malaikat” dalam berkat Yakub
  choice: Mempertahankan sebutan “Malaikat” tanpa mengidentifikasinya secara ontologis.
  alternative: Memahaminya sebagai penampakan Allah, atau sebagai malaikat ciptaan yang bertindak atas nama Allah.
  rationale: Teks menghubungkan Malaikat itu secara erat dengan karya penyelamatan Allah, tetapi tidak menjelaskan identitas ontologisnya. Terjemahan tidak menyelesaikan ketegangan teologis yang dibiarkan terbuka oleh teks.
- issue: Makna nama Yakub, Abraham, dan Ishak atas kedua anak itu
  choice: Menyatakan kelangsungan nama dan identitas keluarga dalam diri mereka.
  alternative: Menerjemahkan secara formal, “kiranya namaku ... disebut atas mereka,” atau “kiranya mereka disebut dengan namaku.”
  rationale: Idiom Ibrani dapat mencakup penyandangan nama, keterikatan keluarga, dan penerusan garis perjanjian. Rumusan utama dibuat jelas tanpa mempersempitnya hanya menjadi pemberian nama pribadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kiranya” mempertahankan corak berkat tanpa terdengar usang. Tanda koma dan pemenggalan kalimat dipakai untuk memperjelas rangkaian permohonan, sedangkan catatan kaki menjaga idiom serta ambiguitas leksikal sumber.
