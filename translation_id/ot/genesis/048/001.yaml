base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa itu, seseorang berkata kepada Yusuf, “Ayahmu sakit.” Lalu Yusuf membawa serta kedua putranya, Manasye dan Efraim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah peristiwa-peristiwa itu
  rationale: Ungkapan ini membuka perkembangan narasi berikutnya. 'Peristiwa-peristiwa' menyampaikan דְּבָרִים secara alami dalam konteks naratif tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: seseorang berkata kepada Yusuf
  rationale: Subjek orang ketiga tunggal maskulin tidak disebutkan identitasnya. 'Seseorang' mempertahankan ketidakpastian itu secara wajar dalam bahasa Indonesia, tanpa memasok tokoh tertentu.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian Yusuf kepada kabar yang segera disampaikan. 'Ketahuilah' terdengar bermartabat dan alami dalam pemberitahuan langsung, tanpa nuansa arkais dari 'lihatlah' yang kurang idiomatis untuk kabar tentang orang yang tidak hadir.
- source_word: אָבִיךָ חֹלֶה
  choice: ayahmu sedang sakit
  rationale: Partisipel חֹלֶה menyatakan keadaan yang sedang berlangsung; 'sedang sakit' mengungkapkan kondisi kini secara jelas.
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: Lalu Yusuf membawa kedua anaknya bersamanya
  rationale: Dalam konteks perjalanan menemui ayahnya, לקח paling alami diterjemahkan 'membawa'. Nama 'Yusuf' diulang untuk menjernihkan rujukan subjek setelah ucapan orang yang tidak dikenal.
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: yaitu Manasye dan Efraim
  rationale: Nama-nama baku Indonesia dipakai, dan 'yaitu' menandai bahwa keduanya menjelaskan 'kedua anaknya'.
theological_decisions:
- issue: Identitas orang yang menyampaikan kabar kepada Yusuf
  choice: Dibiarkan tidak diketahui dengan 'seseorang'
  alternative: Diterjemahkan secara impersonal, 'Yusuf diberi tahu'
  rationale: Teks Ibrani memakai verba orang ketiga tunggal tanpa menyebut identitas pembicara. Terjemahan tidak boleh menentukan siapa pembawa kabar itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena ketidakpastian subjek dapat dipertahankan langsung dalam teks utama.
