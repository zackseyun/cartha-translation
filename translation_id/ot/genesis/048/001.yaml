revisions:
- from: Sesudah peristiwa-peristiwa itu, seseorang berkata kepada Yusuf, “Ketahuilah, ayahmu sedang sakit.” Lalu Yusuf membawa kedua anaknya bersamanya, yaitu Manasye dan Efraim.
  to: Sesudah peristiwa-peristiwa itu, seseorang berkata kepada Yusuf, “Ayahmu sakit.” Lalu Yusuf membawa serta kedua putranya, Manasye dan Efraim.
  rationale: Revisi mempertahankan subjek pembawa berita yang tidak dikenal serta urutan naratif Ibrani. Partikel הִנֵּה tidak diterjemahkan secara leksikal karena padanan harfiahnya tidak alami dalam konteks Indonesia ini; fungsi komunikatifnya tercakup dalam penyampaian kabar langsung. "Membawa serta kedua putranya" memperjelas bahwa yang dimaksud adalah dua anak laki-laki Yusuf dan menyampaikan עִמּוֹ secara idiomatis.
