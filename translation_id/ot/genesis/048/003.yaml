base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: id
  text: Lalu Yakub berkata kepada Yusuf, “Allah Yang Mahakuasa[a] menampakkan diri kepadaku di Lus, di tanah Kanaan, dan memberkati aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “El Shaddai.” Secara tradisional diterjemahkan “Allah Yang Mahakuasa”; arti tepat Shaddai masih diperdebatkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan urutan narasi. “Lalu” menyampaikan kesinambungan peristiwa secara alami dalam bahasa Indonesia modern.
- source_word: אֶל יוֹסֵף
  choice: kepada Yusuf
  rationale: Preposisi אֶל menunjukkan arah tuturan kepada Yusuf; “kepada” adalah padanan Indonesia yang wajar.
- source_word: אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  rationale: Ungkapan ini merupakan gelar ilahi. Padanan tradisional dan mudah dipahami ini dipakai dalam teks utama, sementara bentuk Ibraninya serta ketidakpastian nuansa שַׁדַּי dijelaskan dalam catatan kaki.
- source_word: נִרְאָה אֵלַי
  choice: menampakkan diri kepadaku
  rationale: Bentuk Niphal dari ראה di sini menyatakan penampakan ilahi. Ungkapan ini alami dalam bahasa Indonesia dan tidak menentukan lebih jauh wujud penampakan tersebut.
- source_word: בְּלוּז
  choice: di Lus
  rationale: Preposisi בְּ dengan nama tempat menunjukkan lokasi terjadinya penampakan; “di” adalah padanan langsung dan alami.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Terjemahan mempertahankan unsur eksplisit אֶרֶץ, “tanah/negeri,” sekaligus memakai bentuk geografis yang wajar dalam bahasa Indonesia.
- source_word: וַיְבָרֶךְ אֹתִי
  choice: dan memberkati aku
  rationale: Subjeknya tetap Allah dari klausa sebelumnya. Bahasa Indonesia tidak memerlukan pengulangan pronomina subjek, sehingga bentuk ini ringkas dan setia.
theological_decisions:
- issue: Penerjemahan gelar ilahi אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  alternative: El Shaddai
  rationale: Gelar diterjemahkan agar dipahami pembaca umum, tetapi karena nuansa tepat שַׁדַּי masih diperdebatkan, bentuk Ibrani dan ketidakpastian leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur narasi Ibrani tanpa terasa kaku; istilah geografis dan gelar ilahi dibuat mudah dipahami, dengan ambiguitas leksikal yang nyata dijaga melalui catatan kaki.
