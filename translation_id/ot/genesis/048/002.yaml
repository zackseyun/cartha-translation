base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: id
  text: Lalu diberitahukan kepada Yakub, “Lihat, anakmu Yusuf telah datang kepadamu.” Israel[a] menguatkan dirinya dan duduk di atas tempat tidur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani beralih dari nama “Yakub” pada awal ayat menjadi “Israel” di sini.
    reason: Menunjukkan pergantian nama dalam teks sumber tanpa menafsirkannya.
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: Lalu seseorang memberi tahu Yakub, katanya
  rationale: Subjek kedua verba tidak disebutkan dalam bahasa Ibrani. Kata “seseorang” menyatakan pelaku yang tak tentu secara alami dalam bahasa Indonesia, sedangkan “katanya” tetap mewakili verba ujaran kedua tanpa menghasilkan susunan pasif yang kaku.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada berita yang segera disampaikan; “Lihat” mempertahankan fungsinya dalam bahasa Indonesia modern.
- source_word: בִּנְךָ יוֹסֵף
  choice: anakmu Yusuf
  rationale: Terjemahan langsung dan alami dari frasa nomina posesif tersebut.
- source_word: בָּא אֵלֶיךָ
  choice: telah datang kepadamu
  rationale: Bentuk qatal menyatakan kedatangan yang sudah terjadi dan relevan pada saat laporan diberikan.
- source_word: וַיִּתְחַזֵּק
  choice: menguatkan dirinya
  rationale: Bentuk Hitpael dari חזק bersifat refleksif dan di sini menggambarkan Israel mengerahkan kekuatan dalam keadaan sakit; pilihan ini juga tidak membatasi maknanya hanya pada keberanian atau tenaga jasmani.
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: duduk di atas tempat tidur
  rationale: Terjemahan ini mempertahankan arti dasar ישב dan lokasi yang dinyatakan oleh frasa preposisional, tanpa menambahkan gerakan yang tidak disebutkan secara eksplisit.
theological_decisions:
- issue: Pergantian nama dari Yakub menjadi Israel dalam ayat yang sama
  choice: Mempertahankan kedua nama sesuai teks Ibrani
  alternative: Menggunakan nama Yakub secara konsisten demi kelancaran gaya
  rationale: Pergantian nama dapat memiliki fungsi sastra atau teologis. Terjemahan mempertahankannya tanpa menetapkan tafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan pembuka dibuat alami sambil tetap mewakili kedua verba Ibrani, dan pergantian nama Yakub–Israel dipertahankan.
