base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: id
  text: 'Lalu Yusuf membawa kedua anaknya: Efraim di tangan kanannya, di sebelah kiri Israel, dan Manasye di tangan kirinya, di sebelah kanan Israel. Ia mendekatkan mereka kepada Israel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks ini Yusuf mengambil serta menempatkan kedua anaknya untuk didekatkan kepada Israel; 'membawa' menyampaikan tindakan itu secara alami dalam bahasa Indonesia.
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: di sebelah kiri Israel / di sebelah kanan Israel
  rationale: Preposisi מִן di sini menunjukkan posisi relatif ketika Yusuf mengatur kedua anak itu di hadapan Israel, bukan gerakan menjauh dari sisi tersebut.
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: Ia mendekatkan mereka kepada Israel
  rationale: Bentuk kausatif וַיַּגֵּשׁ berarti membuat atau membawa mendekat. Nama 'Israel' dipakai untuk memperjelas rujukan pronomina tanpa mengubah makna.
