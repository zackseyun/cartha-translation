base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: id
  text: 'Pada hari itu ia memberkati mereka dengan berkata, “Dengan menyebut namamu, Israel akan mengucapkan berkat: ‘Kiranya Allah menjadikan engkau seperti Efraim dan seperti Manasye.’” Lalu ia menempatkan Efraim di depan Manasye.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: ia memberkati mereka
  rationale: Bentuk Piel dari ברך berarti ‘memberkati’; akhiran objek jamak mengacu kepada Efraim dan Manasye.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu yang mempertahankan kekhususan hari tersebut dan alami dalam bahasa Indonesia.
- source_word: בְּךָ
  choice: Dengan menyebut kamu
  rationale: 'Preposisi ב dengan akhiran tunggal di sini menunjukkan sarana atau acuan: nama kedua anak itu dipakai dalam rumusan berkat. Terjemahan ini menyampaikan fungsi idiom tersebut dengan jelas.'
- source_word: יְבָרֵךְ יִשְׂרָאֵל
  choice: Israel akan memberkati
  rationale: Bentuk imperfek menyatakan tindakan pada masa mendatang atau kebiasaan. ‘Israel’ dipertahankan tanpa diperluas agar cakupan leluhur dan umat tidak dipersempit.
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: Kiranya Allah menjadikan engkau
  rationale: Dalam konteks rumusan berkat, verba ini menyatakan harapan; ‘kiranya’ secara alami mengungkapkan nuansa jussif.
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: seperti Efraim dan seperti Manasye
  rationale: Pengulangan kata pembanding כ dipertahankan untuk menjaga irama dan penekanan teks.
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: Demikianlah ia menempatkan Efraim di depan Manasye
  rationale: Ungkapan שׂים ... לִפְנֵי secara harfiah menggambarkan penempatan di depan dan dalam konteks ini juga menyiratkan kedudukan yang didahulukan. ‘Demikianlah’ menunjukkan bahwa urutan dalam rumusan berkat menetapkan keutamaan tersebut.
theological_decisions:
- issue: Acuan ‘Israel’ dalam rumusan berkat
  choice: Israel
  alternative: Yakub; umat Israel
  rationale: Teks Ibrani hanya menyebut ‘Israel’. Nama itu dibiarkan tanpa penjelasan dalam teks utama agar dapat membawa gema pribadi Yakub sekaligus arti kolektif umat keturunannya.
- issue: Makna kedudukan Efraim ‘di depan’ Manasye
  choice: menempatkan Efraim di depan Manasye
  alternative: mengutamakan Efraim daripada Manasye
  rationale: Terjemahan mempertahankan gambaran konkret bahasa Ibrani sambil membiarkan konteks menyampaikan implikasi keutamaan, tanpa mengubahnya menjadi tafsiran eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai dalam rumusan berkat tunggal, sedangkan ‘kamu’ pada frasa pengantar mewakili bentuk Ibrani tunggal kolektif yang mengacu kepada kedua nama sebagai formula; parafrasa ringan ‘dengan menyebut’ diperlukan agar idiom בְּךָ dapat dipahami pembaca umum.
