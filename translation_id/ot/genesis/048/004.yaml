  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: id
  text: Ia berkata kepadaku, ‘Lihatlah, Aku akan membuatmu beranak cucu dan bertambah banyak. Aku akan menjadikanmu sekumpulan bangsa, dan Aku akan memberikan negeri ini kepada keturunanmu sesudah engkau sebagai milik untuk selama-lamanya.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: Lihatlah, Aku akan
  rationale: Ungkapan penunjuk yang menarik perhatian dan memperkenalkan pernyataan ilahi; bentuk ini alami sekaligus mempertahankan tekanannya.
- source_word: מַפְרְךָ וְהִרְבִּיתִךָ
  choice: membuatmu beranak cucu dan bertambah banyak
  rationale: 'Mempertahankan dua unsur Ibrani: menghasilkan keturunan dan menjadi banyak.'
- source_word: לִקְהַל עַמִּים
  choice: sekumpulan bangsa
  rationale: קהל menunjuk kumpulan atau perhimpunan, sedangkan עמים berbentuk jamak dan paling wajar diterjemahkan 'bangsa' dalam konteks keturunan.
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: kepada keturunanmu sesudah engkau
  rationale: זֶרַע merupakan nomina kolektif yang di sini secara alami diterjemahkan 'keturunan'.
- source_word: אֲחֻזַּת עוֹלָם
  choice: milik untuk selama-lamanya
  rationale: אֲחֻזָּה menyatakan tanah milik atau pegangan tetap; frasa ini menyampaikan kepemilikan berkelanjutan tanpa menambahkan tafsir.
theological_decisions:
- issue: Cakupan temporal עוֹלָם
  choice: untuk selama-lamanya
  alternative: milik yang kekal
  rationale: Terjemahan ini mempertahankan kekuatan duratif ungkapan Ibrani tanpa menjelaskan lebih jauh cara atau batas penggenapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Huruf kapital pada ‘Aku’ mengikuti rujukan kepada Allah di dalam kutipan. Struktur janji berulang dipertahankan, tetapi kalimat dipecah agar mudah dibaca.
