base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: id
  text: Lalu ia memberkati Yusuf dan berkata, “Allah yang di hadapan-Nya nenek moyangku Abraham dan Ishak menjalani hidup mereka, Allah yang telah menggembalakan aku sejak awal hidupku sampai hari ini,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: Lalu ia memberkati Yusuf
  rationale: Mempertahankan objek eksplisit Ibrani, yaitu Yusuf, meskipun dalam konteks berkat itu diucapkan atas anak-anak Yusuf.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam bahasa Indonesia, nama sebutan 'Allah' secara alami sudah definit dan sesuai untuk seruan khidmat ini; pengulangan struktur Ibrani tetap dipertahankan.
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: yang di hadapan-Nya nenek moyangku ... menjalani hidup mereka
  rationale: Mengungkapkan idiom hidup di hadapan Allah secara alami tanpa mempersempitnya hanya menjadi ketaatan atau tindakan mengikuti.
- source_word: אַבְרָהָם וְיִצְחָק
  choice: Abraham dan Ishak
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: הָרֹעֶה אֹתִי
  choice: yang telah menggembalakan aku
  rationale: Mempertahankan metafora gembala dan daya verbal aktif partisip Ibrani, sekaligus menyatakan pemeliharaan yang berlangsung hingga saat berbicara.
- source_word: מֵעוֹדִי
  choice: sejak awal hidupku
  rationale: Menunjuk tahap paling awal keberadaan Yakub tanpa mempersempit ungkapan itu secara khusus menjadi masa muda atau peristiwa kelahiran.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan Indonesia yang alami untuk rentang waktu yang berlanjut hingga saat ini.
theological_decisions:
- issue: Idiom para leluhur hidup di hadapan Allah
  choice: yang di hadapan-Nya nenek moyangku Abraham dan Ishak menjalani hidup mereka
  alternative: yang diikuti nenek moyangku Abraham dan Ishak; yang di hadapan-Nya nenek moyangku Abraham dan Ishak berjalan
  rationale: Pilihan ini mempertahankan dimensi relasional dan kesadaran hidup dalam hadirat Allah tanpa menafsirkannya secara sempit sebagai kepatuhan saja; sekaligus lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'berjalan'.
- issue: Metafora Allah sebagai gembala
  choice: Allah, yang telah menggembalakan aku
  alternative: Allah, yang telah menjadi gembalaku; Allah, yang telah memelihara aku
  rationale: Metafora pastoral yang penting dipertahankan, demikian pula sifat aktif dan berkelanjutan dari bentuk partisip Ibrani, tanpa mereduksinya hanya menjadi penyediaan kebutuhan.
translation_notes:
  register: Bahasa Indonesia baku, modern, khidmat, dan mudah dipahami. Struktur seruan berulang 'Allah ... Allah ...' serta kalimat yang berlanjut ke ayat berikutnya dipertahankan. Tidak ditambahkan catatan kaki karena alternatif leksikal utama dapat didokumentasikan dalam keputusan penerjemahan tanpa mengganggu teks.
