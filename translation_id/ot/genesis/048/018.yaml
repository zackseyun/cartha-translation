  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: id
  text: Lalu Yusuf berkata kepada ayahnya, “Bukan begitu, Ayah, sebab anak ini adalah anak sulung. Letakkanlah tangan kanan Ayah di atas kepalanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam narasi Indonesia modern tanpa memberi nuansa pertentangan yang tidak dinyatakan secara eksplisit.
- source_word: אֶל אָבִיו
  choice: kepada ayahnya
  rationale: Menerjemahkan אֶל sebagai arah tutur dan mempertahankan sufiks orang ketiga tunggal secara alami.
- source_word: לֹא כֵן
  choice: Jangan begitu
  rationale: Ungkapan ini merupakan koreksi terhadap tindakan Yakub. “Jangan begitu” menyampaikan protes langsung namun tetap hormat dan sesuai dengan tindakan yang sedang berlangsung.
- source_word: אָבִי
  choice: Ayah
  rationale: Sapaan kekerabatan ini secara alami menyatakan “ayahku” dalam bahasa Indonesia; kapitalisasi menandai sapaan langsung yang hormat.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan Yusuf mengoreksi ayahnya.
- source_word: זֶה
  choice: anak inilah
  rationale: Demonstratif ini menunjuk secara langsung kepada anak yang dimaksud; penambahan “anak” memperjelas rujukan dari konteks tanpa mengubah makna, sedangkan partikel -lah mempertahankan tekanan deiktis.
- source_word: הַבְּכוֹר
  choice: yang sulung
  rationale: “Sulung” merupakan istilah kekerabatan Indonesia yang alami untuk anak pertama dan dalam konteks ini tetap mengandung relevansi status kelahiran.
- source_word: שִׂים
  choice: Letakkanlah
  rationale: Imperatif diterjemahkan dengan bentuk perintah yang langsung tetapi tetap santun dalam tuturan seorang anak kepada ayahnya.
- source_word: יְמִינְךָ
  choice: tangan kanan Ayah
  rationale: ימין dalam konteks peletakan tangan menunjuk tangan kanan; pengulangan “Ayah” mengungkapkan sufiks orang kedua tunggal secara alami dan menghindari sapaan “kamu” yang kurang sesuai.
- source_word: עַל רֹאשׁוֹ
  choice: di atas kepalanya
  rationale: Menyampaikan lokasi gerakan pemberkatan secara jelas dan idiomatis.
theological_decisions:
- issue: Istilah status kelahiran dalam konteks berkat
  choice: yang sulung
  alternative: anak yang pertama lahir; anak sulung
  rationale: בכור menunjuk urutan kelahiran sekaligus status keluarga yang relevan dengan berkat. “Yang sulung” mempertahankan makna itu dengan bahasa Indonesia yang alami, tanpa menambahkan penafsiran tentang hak waris.
translation_notes:
  register: Bahasa Indonesia baku-modern, alami, dan bermartabat. Sapaan “Ayah” mempertahankan rasa hormat Yusuf, sementara “Jangan begitu” menyampaikan koreksi terhadap gerakan tangan Yakub secara langsung tanpa terdengar kasar.
