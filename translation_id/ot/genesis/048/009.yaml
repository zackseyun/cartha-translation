  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: id
  text: Yusuf berkata kepada ayahnya, “Mereka adalah putra-putraku, yang telah Allah karuniakan kepadaku di sini.[a]” Ayahnya berkata, “Bawalah mereka kepadaku, dan aku akan memberkati mereka.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tempat ini.” Ungkapan Ibrani ini dapat menunjuk lebih khusus kepada tempat Yusuf berada.
    reason: lexical_alternative
  - marker: b
    text: Atau “Ambillah mereka, kumohon, kepadaku, supaya aku memberkati mereka.” Dalam konteks ini, maksudnya adalah membawa mereka mendekat kepada sang ayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל־אָבִיו
  choice: Yusuf berkata kepada ayahnya
  rationale: Bentuk naratif Ibrani diterjemahkan secara wajar dengan verba lampau yang dipahami dari konteks; hubungan keluarga dan nada naratif dipertahankan.
- source_word: בָּנַי הֵם
  choice: Mereka adalah anak-anakku
  rationale: Ungkapan ini mengidentifikasi kedua laki-laki itu sebagai anak Yusuf. Bahasa Indonesia lazim memakai “anak-anakku”; konteks sudah menunjukkan bahwa mereka laki-laki.
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: yang telah Allah karuniakan kepadaku
  rationale: “Karuniakan” menyampaikan bahwa anak-anak itu dipandang sebagai pemberian Allah, sedangkan “telah” menunjukkan tindakan lampau dengan hasil yang tetap nyata.
- source_word: בָּזֶה
  choice: di sini
  rationale: Ungkapan penunjuk ini secara alami menunjuk pada tempat atau keadaan Yusuf saat itu, yakni Mesir. Alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: קָחֶם נָא אֵלַי
  choice: Tolong bawa mereka kepadaku
  rationale: Dalam konteks ini, לָקַח berarti membawa orang-orang itu kepada pembicara; “tolong” mencerminkan partikel permohonan נָא.
- source_word: וַאֲבָרֲכֵם
  choice: agar aku memberkati mereka
  rationale: Bentuk ini sesudah permintaan menyatakan tujuan atau kehendak pembicara; “agar” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam perkataan Yusuf
  choice: Allah, yaitu Allah yang disembah keluarga Israel, sebagai pemberi anak-anak Yusuf
  alternative: allah atau dewa-dewa dalam arti umum
  rationale: Konteks kisah para leluhur dengan jelas menunjukkan bahwa Yusuf mengakui Allah sebagai pemberi anak-anaknya; bentuk dan konteks tidak mendukung rujukan kepada banyak dewa.
- issue: Nuansa pemberian dalam נָתַן
  choice: karuniakan
  alternative: berikan
  rationale: Pilihan ini mempertahankan pengakuan Yusuf bahwa anak-anaknya merupakan pemberian Allah tanpa menambahkan ajaran khusus di luar makna tuturan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Allah” mengikuti pemakaian Indonesia yang mapan untuk אֱלֹהִים dalam konteks ini. Susunan dialog dibuat alami tanpa menghilangkan permohonan halus maupun tujuan pemberkatan.
