  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: id
  text: Kemudian Yusuf mengeluarkan kedua anaknya dari dekat lutut Yakub[a], lalu ia sujud dengan mukanya sampai ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari antara lutut Yakub.” Ungkapan Ibrani dapat menggambarkan posisi kedua anak itu di sisi atau sangat dekat dengan Yakub dalam adegan pemberkatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: menarik ... dari
  rationale: 'Bentuk Hifil dari יצא bersifat kausatif: Yusuf membuat kedua anaknya keluar dari posisi mereka di dekat Yakub. Dalam adegan ini, ''menarik ... dari'' menyatakan tindakan memindahkan mereka dengan alami tanpa memberi kesan bahwa mereka berjalan sendiri.'
- source_word: אֹתָם
  choice: kedua anaknya
  rationale: Pronomina objek jamak merujuk kepada Efraim dan Manasye. Penyebutan eksplisit 'kedua anaknya' memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: מֵעִם בִּרְכָּיו
  choice: dari antara lutut Yakub
  rationale: Ungkapan Ibrani secara harfiah menunjukkan posisi bersama atau di dekat lututnya. 'Dari antara lutut' paling jelas menggambarkan kedekatan kedua anak itu dengan Yakub dalam adegan pemberkatan, sedangkan nama 'Yakub' memperjelas rujukan sufiks yang secara kontekstual paling mungkin.
- source_word: וַיִּשְׁתַּחוּ
  choice: ia sujud
  rationale: Bentuk verba שׁחה menyatakan tindakan membungkuk atau bersujud sebagai penghormatan. 'Sujud' alami dan tepat karena frasa berikutnya menjelaskan bahwa muka Yusuf mengarah sampai ke tanah.
- source_word: לְאַפָּיו
  choice: dengan mukanya
  rationale: Secara harfiah 'ke mukanya'; bersama אָרְצָה, frasa ini menggambarkan postur bersujud dengan muka mengarah ke tanah.
- source_word: אָרְצָה
  choice: sampai ke tanah
  rationale: Bentuk berarah dari אֶרֶץ berarti menuju tanah. 'Sampai ke tanah' secara wajar menggambarkan dalamnya penghormatan dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan akhiran milik pada 'lututnya'
  choice: lutut Yakub
  alternative: lutut Yusuf
  rationale: Konteks menunjukkan bahwa Yusuf memindahkan anak-anaknya dari posisi dekat Yakub sesudah Yakub memeluk dan menempatkan mereka untuk diberkati. Rujukan kepada Yakub paling alami, tetapi ini merupakan keputusan kontekstual-pronominal, bukan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan khidmat. 'Sujud dengan mukanya sampai ke tanah' mempertahankan gambaran fisik penghormatan, sementara nama Yakub digunakan untuk menghindari ambiguitas pronomina yang terasa janggal dalam bahasa Indonesia.
