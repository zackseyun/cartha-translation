  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: id
  text: Kemudian Israel berkata kepada Yusuf, “Lihatlah, aku akan segera mati, tetapi[a] Allah akan menyertai kalian[b] dan membawa kalian kembali ke tanah nenek moyang kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, “dan”. Kata sambung Ibrani itu dapat dipahami sebagai penanda kontras di sini: Israel akan mati, tetapi Allah akan tetap menyertai mereka.'
    reason: lexical_alternative
  - marker: b
    text: Kata ganti dalam “menyertai kalian”, “membawa kalian kembali”, dan “nenek moyang kalian” berbentuk jamak dalam bahasa Ibrani; dengan demikian, janji ini melampaui Yusuf seorang diri kepada keluarga atau keturunannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan alur cerita; “kemudian” menyampaikan urutan itu secara alami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub, sehingga bentuk nama dalam sumber dipertahankan.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian pendengar kepada pernyataan berikutnya. “Ketahuilah” mempertahankan fungsi tersebut dalam ragam Indonesia yang alami dan bermartabat.
- source_word: אָנֹכִי מֵת
  choice: aku akan segera mati
  rationale: Konstruksi partisipial ini menyatakan kematian yang sudah dekat, bukan bahwa Israel telah mati. “Akan segera mati” menyampaikan makna imminen dengan jelas.
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: tetapi Allah akan menyertai kalian
  rationale: Walaupun waw secara bentuk berarti “dan”, konteksnya menunjukkan kontras antara kematian Israel dan kehadiran Allah yang tetap berlangsung. “Menyertai” merupakan ungkapan Indonesia yang wajar untuk kehadiran Allah bersama mereka.
- source_word: עִמָּכֶם
  choice: kalian
  rationale: Akhiran pronominalnya jamak. “Kalian” menampakkan bahwa janji ini melampaui Yusuf sebagai seorang individu.
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: dan membawa kalian kembali
  rationale: 'Bentuk hifil dari שׁוב bersifat kausatif: Allah menyebabkan mereka kembali. Frasa ini mempertahankan unsur kausatif secara alami.'
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: ke negeri nenek moyang kalian
  rationale: Ungkapan ini menunjuk kepada negeri leluhur yang terkait dengan para bapa leluhur. “Nenek moyang” merupakan padanan Indonesia yang alami tanpa mengubah cakupan leluhurnya.
theological_decisions:
- issue: Rujukan kata ganti jamak dalam janji Israel
  choice: Memakai “kalian” untuk mempertahankan bentuk jamak dan cakupan janji kepada Yusuf beserta keluarga atau keturunannya.
  alternative: Memakai “engkau” seolah-olah janji hanya ditujukan kepada Yusuf secara individual.
  rationale: Semua akhiran orang kedua dalam bagian janji ini berbentuk jamak. Terjemahan perlu mempertahankan cakupan itu tanpa menentukan lebih sempit apakah rujukannya khusus keluarga, keturunan, atau kelompok yang bersama Yusuf.
- issue: Daya wacana waw sebelum pernyataan tentang penyertaan Allah
  choice: Menerjemahkannya dengan “tetapi”.
  alternative: Menerjemahkannya secara formal dengan “dan”.
  rationale: 'Kontras kontekstualnya jelas: Israel akan mati, tetapi Allah tetap menyertai mereka. Catatan kaki mempertahankan bentuk formal Ibraninya agar ambiguitas hubungan antarklausa tetap terlihat.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Aku” dipakai dalam tuturan langsung seorang bapa kepada anaknya; “kalian” sengaja dipakai untuk menampilkan bentuk jamak sumber. Penanda “Ketahuilah” menghindari ungkapan arkais sekaligus mempertahankan daya perhatian הִנֵּה.
