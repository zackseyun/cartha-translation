  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: id
  text: Adapun aku, ketika aku datang dari Padan, Rahel meninggal di sisiku[a] di tanah Kanaan, dalam perjalanan, sementara masih ada suatu jarak yang harus ditempuh untuk sampai ke Efrata[b]. Aku menguburkannya di sana, di jalan menuju Efrata, yaitu Betlehem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “meninggal atasku/padaku.” Ungkapan Ibrani ini dapat menekankan bahwa Rahel meninggal dekat dengan Yakub atau beratnya kematian itu secara pribadi bagi Yakub.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “suatu jarak” menunjuk suatu bentang perjalanan; jarak tepatnya tidak diketahui.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: Mengenai aku
  rationale: Kata sambung bersama pronomina mandiri menandai peralihan topik dan penekanan pada kenangan pribadi Yakub.
- source_word: בְּבֹאִי
  choice: ketika aku datang
  rationale: Infinitif dengan preposisi dan sufiks orang pertama tunggal berfungsi temporal; terjemahan ini alami dalam bahasa Indonesia.
- source_word: מִפַּדָּן
  choice: dari Padan
  rationale: Teks Ibrani ayat ini hanya menyebut Padan, bukan bentuk lengkap Padan-Aram, sehingga tidak diharmonisasikan dengan ayat lain.
- source_word: מֵתָה עָלַי
  choice: meninggal di sisiku
  rationale: Ungkapan harfiahnya kira-kira 'meninggal atasku/padaku'. Pilihan ini mempertahankan dimensi kedekatan pribadi tanpa membatasi maknanya semata-mata pada dukacita; ambiguitas idiom dijelaskan dalam catatan.
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan penyebutan geografis lengkap dari teks sumber.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: Padanan alami untuk konteks perjalanan pada penyebutan pertama.
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: sementara masih ada suatu jarak yang harus ditempuh untuk sampai ke Efrata
  rationale: כברת ארץ menunjuk suatu bentang atau jarak yang ukurannya tidak pasti; terjemahan menghindari ketepatan semu.
- source_word: וָאֶקְבְּרֶהָ שָׁם
  choice: Aku menguburkannya di sana
  rationale: Menyampaikan urutan naratif dan mempertahankan penunjuk tempat.
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: di jalan menuju Efrata
  rationale: Mengungkapkan lokasi makam pada rute menuju Efrata dengan bahasa Indonesia yang jelas.
- source_word: הִוא בֵּית לָחֶם
  choice: yaitu Betlehem
  rationale: Pronomina ini berfungsi sebagai penjelasan identitas Efrata dengan Betlehem.
theological_decisions:
- issue: Makna idiom מֵתָה עָלַי
  choice: meninggal di sisiku, disertai catatan tentang ambiguitas
  alternative: meninggal sehingga mendatangkan dukacita bagiku
  rationale: Teks dapat menonjolkan kedekatan peristiwa dengan Yakub dan/atau beban pribadi kematian Rahel. Terjemahan utama tidak menutup salah satu nuansa secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama tempat mengikuti bentuk Indonesia yang lazim. Kalimat panjang sumber dibagi secara ringan agar mudah dipahami tanpa menghilangkan hubungan antarklausa.
