  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: id
  text: Aku sendiri memberikan kepadamu satu bagian lebih daripada saudara-saudaramu[a], yang telah kuambil dari tangan orang Amori dengan pedangku dan busurku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שְׁכֶם (syekhem) dapat berarti “bagian”, tetapi juga “bahu” atau “lereng”, dan mungkin menggemakan nama tempat Sikhem. Kalimat ini mungkin sengaja menunjuk sekaligus pada bagian tambahan bagi Yusuf dan pada tempat yang kemudian dikaitkan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Aku sendiri
  rationale: Pronomina mandiri אֲנִי memberi penekanan karena subjek sudah terkandung dalam verba; 'Aku sendiri' mempertahankan penekanan itu secara alami.
- source_word: נָתַתִּי
  choice: memberikan
  rationale: Bentuk perfektif ini dalam pernyataan wasiat dapat berfungsi sebagai tindakan pemberian yang sedang dinyatakan; bentuk kini bahasa Indonesia menyampaikan daya performatifnya.
- source_word: שְׁכֶם אַחַד
  choice: satu bagian
  rationale: Dalam konteks pembagian warisan, שְׁכֶם paling mungkin menunjuk pada bagian atau jatah tambahan. Namun, kata itu juga dapat berarti bahu atau lereng dan menggemakan nama tempat Sikhem; ambiguitas tersebut dipertahankan dalam catatan kaki.
- source_word: עַל אַחֶיךָ
  choice: lebih daripada saudara-saudaramu
  rationale: עַל di sini menyatakan kelebihan atau tambahan. Ungkapan ini jelas dan alami dalam bahasa Indonesia serta menunjukkan satu bagian ekstra.
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: yang telah kuambil
  rationale: Menerjemahkan klausa relatif dan verba לקח secara langsung, dengan aspek lampau yang sesuai bagi tindakan yang dirujuk.
- source_word: מִיַּד הָאֱמֹרִי
  choice: dari tangan orang Amori
  rationale: Mempertahankan idiom Ibrani 'dari tangan' sebagai gambaran kuasa atau kepemilikan, serta bentuk tunggal kolektif 'orang Amori'.
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: dengan pedangku dan busurku
  rationale: Menerjemahkan kedua senjata secara harfiah dan mempertahankan citra peperangan.
theological_decisions:
- issue: Makna שְׁכֶם dan kaitannya dengan nama tempat Sikhem serta bagian warisan tambahan bagi Yusuf
  choice: Menerjemahkan makna kontekstual sebagai 'satu bagian' dalam teks utama dan mencatat kemungkinan permainan kata dengan Sikhem.
  alternative: '''satu lereng'' atau ''Sikhem, satu bagian'''
  rationale: Konteks mendukung arti jatah warisan tambahan, sedangkan bentuk Ibraninya mungkin sengaja menggemakan nama Sikhem dan makna topografis 'bahu/lereng'. Catatan kaki mempertahankan ketaksaan itu tanpa menjadikan nama tempat sebagai satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat dan mudah dipahami. Bentuk 'Aku' sesuai dengan tuturan langsung seorang leluhur; enklitik pada 'kuambil', 'pedangku', dan 'busurku' menjaga kelancaran tanpa mengurangi martabat.
