lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ... melihat
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; konstruksi temporal ini alami dalam bahasa Indonesia dan menghubungkan penglihatan Israel dengan ucapannya.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Teks Ibrani memakai nama Israel, bukan Yakub, sehingga nama yang tercantum dalam sumber dipertahankan.
- source_word: אֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini menandai objek langsung dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: בְּנֵי יוֹסֵף
  choice: anak-anak Yusuf
  rationale: Rangkaian konstruksi ini secara harfiah berarti 'anak-anak lelaki Yusuf'; dalam konteks ini, 'anak-anak Yusuf' adalah ungkapan Indonesia yang alami dan tepat.
- source_word: וַיֹּאמֶר
  choice: ia berkata
  rationale: Ungkapan ini merupakan pengantar naratif baku bagi ucapan langsung; 'ia berkata' mempertahankan urutan cerita secara alami.
- source_word: מִי אֵלֶּה
  choice: Siapakah mereka ini?
  rationale: מִי menanyakan identitas dan אֵלֶּה menunjuk kepada orang-orang yang hadir. 'Siapakah mereka ini?' merupakan pertanyaan identitas yang alami dan jelas dalam bahasa Indonesia.
