base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: id
  text: Namun, ayahnya menolak dan berkata, “Aku tahu, anakku, aku tahu. Dia juga akan menjadi suatu bangsa, dan dia juga akan menjadi besar. Meskipun demikian, saudara laki-lakinya yang lebih muda akan menjadi lebih besar daripada dia, dan keturunannya akan menjadi kepenuhan bangsa-bangsa[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “banyak bangsa.” Secara lebih harfiah, bahasa Ibrani berbunyi “kepenuhan bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: menolak
  rationale: Kata kerja מאן menyatakan penolakan yang disengaja, sesuai dengan tindakan Yakub yang tidak menerima upaya Yusuf mengubah posisi tangannya.
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: Aku tahu, anakku, aku tahu
  rationale: Pengulangan yang bersifat penegasan dipertahankan secara alami dalam bahasa Indonesia.
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: Dia juga akan menjadi suatu bangsa
  rationale: עָם berarti suatu kelompok masyarakat atau bangsa; 'suatu bangsa' terdengar alami dalam konteks keturunan yang berkembang menjadi kelompok besar.
- source_word: וְגַם הוּא יִגְדָּל
  choice: dan dia juga akan menjadi besar
  rationale: Bentuk verbal menyatakan perkembangan menuju kebesaran atau kedudukan penting.
- source_word: וְאוּלָם
  choice: Meskipun demikian
  rationale: Ungkapan ini mempertahankan kontras kuat antara masa depan Manasye dan keunggulan Efraim.
- source_word: אָחִיו הַקָּטֹן
  choice: adiknya
  rationale: Dalam urutan kelahiran, הַקָּטֹן menunjuk kepada saudara yang lebih muda; 'adiknya' adalah padanan Indonesia yang ringkas dan alami.
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: akan menjadi lebih besar daripada dia
  rationale: Mempertahankan nuansa perkembangan pada יִגְדַּל dan perbandingan yang dinyatakan oleh מִן.
- source_word: וְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע merupakan bentuk tunggal kolektif yang dalam konteks ini secara alami menunjuk kepada seluruh keturunannya.
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: akan menjadi kepenuhan bangsa-bangsa
  rationale: Terjemahan ini mempertahankan kata מְלֹא, 'kepenuhan', dan keambiguan ungkapan Ibraninya tanpa menyederhanakannya menjadi 'banyak bangsa'.
theological_decisions:
- issue: Makna מְלֹא הַגּוֹיִם
  choice: kepenuhan bangsa-bangsa
  alternative: sejumlah besar bangsa; kepenuhan bangsa-bangsa itu
  rationale: Ungkapan Ibrani dapat dipahami secara idiomatis sebagai banyak bangsa, tetapi pemakaian 'kepenuhan' mempertahankan bentuk dan kemungkinan resonansi teologisnya tanpa menetapkan satu penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'dia' dipakai secara konsisten; struktur pengulangan dan kontras sumber dipertahankan.
