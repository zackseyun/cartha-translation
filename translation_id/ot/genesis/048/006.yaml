  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: id
  text: Tetapi anak-anakmu yang kauperanakkan sesudah mereka akan menjadi milikmu[a]; mereka akan disebut menurut nama saudara-saudara mereka dalam warisan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, mereka tidak akan menerima warisan suku tersendiri, tetapi akan dihitung di bawah Efraim dan Manasye.
    reason: cross_reference
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: keturunan yang kauperoleh
  rationale: Kata ini menunjuk kepada anak atau keturunan yang lahir bagi Yusuf; frasa Indonesia ini alami dan mempertahankan cakupan ungkapan Ibrani tanpa menentukan jumlah atau jarak generasi secara berlebihan.
- source_word: הוֹלַדְתָּ
  choice: kauperoleh
  rationale: Bentuk Hifil dari ילד dalam sapaan kepada seorang ayah berarti memperanakkan atau memperoleh anak. 'Kauperoleh' menyampaikan sudut pandang paternal secara wajar dalam bahasa Indonesia modern tanpa memakai kata yang terlalu teknis.
- source_word: אַחֲרֵיהֶם
  choice: sesudah mereka
  rationale: Secara langsung merujuk kepada keturunan yang lahir setelah Efraim dan Manasye.
- source_word: לְךָ יִהְיוּ
  choice: akan menjadi milikmu
  rationale: Menyatakan hubungan keluarga dan status hukum mereka sebagai anak-anak Yusuf, berbeda dengan Efraim dan Manasye yang baru saja diangkat Yakub sebagai anak-anaknya sendiri.
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: menurut nama saudara-saudara mereka
  rationale: Mempertahankan unsur 'nama' dan menunjukkan bahwa keturunan berikutnya akan dihitung di bawah identitas suku saudara-saudara mereka.
- source_word: אֲחֵיהֶם
  choice: saudara-saudara mereka
  rationale: Menerjemahkan istilah kekeluargaan Ibrani secara langsung tanpa menambahkan nama Efraim dan Manasye ke dalam teks utama.
- source_word: יִקָּרְאוּ
  choice: akan disebut
  rationale: Padanan langsung bagi bentuk pasif קרא, sekaligus dapat memuat nuansa 'dihitung' atau 'digolongkan' dalam konteks warisan.
- source_word: בְּנַחֲלָתָם
  choice: dalam hal warisan mereka
  rationale: Ungkapan ini lebih jelas dalam bahasa Indonesia daripada 'dalam warisan mereka' dan tetap mempertahankan kaitan pronomina jamak yang dapat merujuk kepada saudara-saudara mereka.
theological_decisions:
- issue: Status keturunan Yusuf yang lahir kemudian
  choice: Teks menyatakan bahwa mereka tetap menjadi milik Yusuf dan disebut menurut nama saudara-saudara mereka dalam urusan warisan.
  alternative: Menjelaskan secara langsung bahwa mereka tidak menerima bagian suku tersendiri.
  rationale: Penjelasan eksplisit tersebut merupakan kesimpulan kontekstual yang tepat, tetapi bukan bunyi harfiah ayat; karena itu nuansa hukum warisan dipertahankan tanpa memperluas teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kauperoleh' dipilih agar alami bagi pembaca umum; susunan klausa terakhir diperjelas tanpa menghapus nuansa penamaan dan penggolongan dalam warisan.
