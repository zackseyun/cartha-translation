  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: id
  text: Sekarang, kedua anakmu yang lahir bagimu di tanah Mesir sebelum aku datang kepadamu di Mesir adalah milikku; Efraim dan Manasye akan menjadi milikku, seperti Ruben dan Simeon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “milikku” menyatakan bahwa Efraim dan Manasye diperhitungkan sebagai milik Yakub, dengan kedudukan seperti Ruben dan Simeon.
    reason: Menjelaskan implikasi status kekeluargaan dari ungkapan kepunyaan Ibrani tanpa menggantikan ungkapan itu dalam teks utama atau memasukkan istilah hukum teknis.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai perkembangan baru yang tegas dalam perkataan Yakub; bentuk ini alami dalam bahasa Indonesia tanpa harus mempertahankan konjungsi secara kaku.
- source_word: שְׁנֵי בָנֶיךָ
  choice: kedua anakmu
  rationale: Menyampaikan jumlah dan kepemilikan secara ringkas serta alami.
- source_word: הַנּוֹלָדִים לְךָ
  choice: yang lahir bagimu
  rationale: Mempertahankan unsur לְךָ dan hubungan mereka dengan Yusuf, dengan ungkapan Indonesia yang tetap cukup formal.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan kata אֶרֶץ yang dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: sebelum aku datang kepadamu di Mesir
  rationale: Dalam konteks, עַד membatasi anak-anak yang dimaksud sebagai mereka yang lahir sebelum kedatangan Yakub; lokasi Mesir tetap dipertahankan secara eksplisit.
- source_word: לִי הֵם
  choice: adalah anak-anakku
  rationale: Secara harfiah berarti 'mereka adalah milikku', tetapi konteks perbandingan dengan Ruben dan Simeon menunjukkan pengakuan sebagai anak; ungkapan ini mengomunikasikan status itu tanpa memakai istilah hukum teknis 'mengadopsi'.
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: Efraim dan Manasye
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: sama seperti Ruben dan Simeon
  rationale: Awalan כְּ menyatakan perbandingan status; 'sama seperti' menyampaikan daya bandingnya dengan jelas.
- source_word: יִהְיוּ לִי
  choice: akan menjadi anak-anakku
  rationale: Menyampaikan bentuk imperfek sebagai pernyataan status ke depan dan memperjelas hubungan filial yang ditentukan oleh konteks.
theological_decisions:
- issue: Hakikat klaim Yakub atas Efraim dan Manasye
  choice: Menyatakan bahwa mereka menjadi anak-anak Yakub tanpa menggunakan istilah teknis 'mengadopsi'.
  alternative: Menerjemahkan secara lebih harfiah, 'mereka adalah milikku ... akan menjadi milikku,' atau secara eksplisit, 'aku mengangkat mereka menjadi anak.'
  rationale: Bahasa Ibrani memakai ungkapan kepunyaan, bukan istilah teknis untuk adopsi. Konteks dan perbandingan dengan Ruben serta Simeon menunjukkan status sebagai anak, tetapi mekanisme hukumnya tidak perlu ditentukan lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'di Mesir' dipertahankan karena lokasi itu dinyatakan dua kali dalam teks Ibrani. Tanda titik dua membantu menunjukkan bahwa Efraim dan Manasye adalah kedua anak yang baru disebut.
