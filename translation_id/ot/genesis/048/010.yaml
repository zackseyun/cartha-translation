  text: וְ/עֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִ/זֹּ֔קֶן לֹ֥א יוּכַ֖ל לִ/רְא֑וֹת וַ/יַּגֵּ֤שׁ אֹתָ/ם֙ אֵלָ֔י/ו וַ/יִּשַּׁ֥ק לָ/הֶ֖ם וַ/יְחַבֵּ֥ק לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: id
  text: Mata Israel telah kabur karena usia lanjut[a], sehingga ia tidak dapat melihat. Maka Yusuf mendekatkan keduanya kepada Israel[b], lalu Israel mencium dan memeluk mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Mata Israel telah menjadi berat karena usia lanjut.” Ungkapan ini berarti bahwa penglihatannya telah kabur.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara harfiah berbunyi, “Ia mendekatkan mereka kepadanya.” Nama Yusuf dan Israel dijelaskan dari konteks; bentuk Ibraninya sendiri tidak menyebut nama subjek pada bagian ini.
    reason: referent_clarification
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: Mata Israel
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara alami sebagai kepunyaan; nama “Israel” dipertahankan karena itulah nama yang dipakai teks sumber.
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: telah kabur karena usia lanjut
  rationale: כָּבְדוּ secara harfiah berarti “menjadi berat”, tetapi dalam konteks mata merupakan idiom bagi penglihatan yang melemah. מִן menyatakan sebab atau sumber keadaan itu.
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: ia tidak dapat melihat
  rationale: Padanan langsung dan alami bagi ungkapan ketidakmampuan melihat.
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: Maka Yusuf mendekatkan keduanya kepada Israel
  rationale: Bentuk kausatif נגשׁ berarti “mendekatkan”. Subjek dan penerima disebutkan secara eksplisit dalam bahasa Indonesia agar rangkaian pronomina tidak menyesatkan; konteks ayat 9 dan 13 menunjuk kepada Yusuf sebagai orang yang membawa kedua anak itu mendekat kepada Israel.
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: lalu Israel mencium dan memeluk mereka
  rationale: Kedua tindakan penuh kasih itu diterjemahkan dengan verba Indonesia yang wajar. Nama “Israel” diulang untuk mencegah subjeknya disalahpahami sebagai Yusuf.
theological_decisions:
- issue: Identitas subjek וַיַּגֵּשׁ dan rangkaian pronomina
  choice: Yusuf mendekatkan kedua anak itu kepada Israel; kemudian Israel mencium dan memeluk mereka
  alternative: Ia mendekatkan mereka kepadanya, lalu mencium dan memeluk mereka
  rationale: Teks Ibrani tidak menyebut nama subjek verba pertama, sehingga bentuk harfiahnya dapat terasa ambigu. Namun konteks dekat menyebut Yusuf sebagai orang yang membawa anak-anaknya kepada ayahnya. Kejelasan rujukan diperlukan dalam bahasa Indonesia, sementara bentuk sumber dan kemungkinan pembacaan lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Keduanya” dipakai untuk Efraim dan Manasye, sedangkan “memeluk” dipilih sebagai ungkapan kasih yang alami. Hubungan sebab antara usia lanjut, penglihatan kabur, dan ketidakmampuan melihat dinyatakan secara lancar tanpa menambahkan penanda wacana yang tidak ada dalam sumber.
