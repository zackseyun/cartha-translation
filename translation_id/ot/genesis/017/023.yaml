  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: id
  text: Lalu Abraham mengambil Ismael, anaknya, semua orang yang lahir dalam rumah tangganya, dan semua orang yang dibelinya dengan uangnya[a]—setiap laki-laki di antara orang-orang dalam rumah tangga Abraham—dan menyunat daging kulit khatan mereka pada hari itu juga[b], tepat seperti yang telah difirmankan Allah kepadanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua yang dibeli dengan peraknya”; yang dimaksud ialah orang-orang yang diperoleh melalui pembelian untuk masuk ke dalam rumah tangga Abraham.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani menekankan bahwa Abraham melakukannya tepat pada hari yang sama.
    reason: idiom_explanation
  - marker: c
    text: Frasa Ibrani juga dapat dipahami, “tepat seperti yang telah dibicarakan Allah dengannya.”
    reason: preserved_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengumpulkan
  rationale: Secara dasar berarti ‘mengambil’, tetapi dalam konteks ini Abraham membawa bersama semua laki-laki rumah tangganya untuk disunat. ‘Mengumpulkan’ menyampaikan tindakan tersebut secara alami tanpa mengubah urutan narasi.
- source_word: יְלִידֵי בֵיתוֹ
  choice: semua orang yang lahir di rumahnya
  rationale: Mempertahankan gambaran Ibrani tentang orang-orang yang lahir dalam rumah tangga Abraham tanpa menambahkan status sosial yang tidak dinyatakan secara eksplisit dalam frasa ini.
- source_word: מִקְנַת כַּסְפּוֹ
  choice: semua orang yang dibelinya dengan uangnya
  rationale: Frasa ini menunjuk kepada orang-orang yang diperoleh melalui pembelian. ‘Uang’ alami dalam bahasa Indonesia modern, sedangkan arti harfiahnya ‘perak’ dicatat dalam catatan kaki.
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: setiap laki-laki di antara orang-orang dalam rumah tangga Abraham
  rationale: ‘Setiap laki-laki’ mempertahankan penandaan jenis kelamin yang eksplisit, sedangkan ‘orang-orang dalam rumah tangga’ menghindari pengulangan janggal ‘laki-laki di antara kaum laki-laki’.
- source_word: בְּשַׂר עָרְלָתָם
  choice: daging kulit khatan mereka
  rationale: Mempertahankan ungkapan tubuh yang konkret dan istilah perjanjian dalam bahasa sumber, meskipun ungkapannya lebih formal daripada bahasa percakapan.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: pada hari itu juga
  rationale: Ungkapan Ibrani menegaskan bahwa tindakan itu dilakukan tepat pada hari yang sama; pilihan ini alami dan kuat dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: tepat seperti yang telah difirmankan Allah kepadanya
  rationale: ‘Difirmankan Allah kepadanya’ merupakan ungkapan Indonesia yang wajar bagi tuturan ilahi. Bentuk ‘telah’ memperjelas bahwa firman itu mendahului tindakan Abraham.
theological_decisions:
- issue: Sebutan אֱלֹהִים dalam konteks perjanjian
  choice: Allah
  alternative: Tuhan
  rationale: אֱלֹהִים di sini menunjuk kepada Allah yang berbicara kepada Abraham. ‘Allah’ adalah padanan baku dan tidak menambahkan nama perjanjian yang berbeda.
- issue: Hubungan gramatikal dalam דִּבֶּר אִתּוֹ
  choice: difirmankan Allah kepadanya
  alternative: dibicarakan Allah dengannya
  rationale: Preposisi אִתּוֹ dapat mendukung nuansa ‘dengan dia’, tetapi konstruksi ini secara idiomatis juga berarti berbicara kepada seseorang. Teks utama memakai bahasa Indonesia yang alami, sementara kemungkinan nuansa dialogis dipertahankan dalam catatan kaki.
- issue: Cakupan sunat dalam rumah tangga Abraham
  choice: setiap laki-laki di antara orang-orang dalam rumah tangga Abraham
  alternative: setiap laki-laki dari kaum laki-laki di rumah Abraham
  rationale: Terjemahan mempertahankan cakupan laki-laki secara eksplisit tanpa menetralkan jenis kelamin atau mengimpor penjelasan teologis tentang status anggota rumah tangga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah membantu memperjelas bahwa ‘setiap laki-laki’ merangkum kelompok-kelompok yang disebut sebelumnya. Istilah ‘daging kulit khatan’ sengaja dipertahankan karena penting dalam kosakata perjanjian pasal ini.
