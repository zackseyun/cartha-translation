- from: Lalu Abraham mengumpulkan Ismael, anaknya, semua orang yang lahir di rumahnya, dan semua orang yang dibelinya dengan uangnya[a]—setiap laki-laki di antara orang-orang dalam rumah tangga Abraham—dan menyunat daging kulit khatan mereka pada hari itu juga[b], tepat seperti yang telah difirmankan Allah kepadanya.[c]
  to: Lalu Abraham mengambil Ismael, anaknya, semua orang yang lahir dalam rumah tangganya, dan semua orang yang dibelinya dengan uangnya[a]—setiap laki-laki di antara orang-orang dalam rumah tangga Abraham—dan menyunat daging kulit khatan mereka pada hari itu juga[b], tepat seperti yang telah difirmankan Allah kepadanya[c].
