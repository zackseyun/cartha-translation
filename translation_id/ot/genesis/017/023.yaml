  source_fidelity: 'Terjemahan pada umumnya setia kepada susunan dan cakupan teks Ibrani: Ismael, mereka yang lahir dalam rumah tangga, mereka yang diperoleh dengan pembelian, dan setiap laki-laki semuanya tercakup. Namun, וַיִּקַּח terutama berarti “mengambil,” bukan “mengumpulkan.” Dalam konteks ini “mengumpulkan” merupakan penafsiran tindakan Abraham dan menggeser verba naratif sumber secara tidak perlu.'
  naturalness: Bahasa terjemahan umumnya baku dan jelas. “Mengambil” dapat dipakai secara wajar dalam register naratif Alkitab, terutama dengan rangkaian objek yang menyusul. “Dalam rumah tangganya” lebih jelas daripada “di rumahnya,” karena mencerminkan idiom בית sebagai rumah tangga, bukan semata-mata bangunan.
  terminology: “Allah,” “menyunat,” dan “daging kulit khatan mereka” tepat untuk register Alkitab dan mempertahankan kekonkretan istilah Ibrani. “Setiap laki-laki di antara orang-orang dalam rumah tangga Abraham” secara tepat menjaga cakupan maskulin tanpa pengulangan yang janggal.
