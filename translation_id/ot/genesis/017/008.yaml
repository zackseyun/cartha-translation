  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: id
  text: Aku akan memberikan kepadamu dan kepada keturunanmu sesudah engkau negeri tempat engkau tinggal sebagai pendatang[a], yaitu seluruh negeri Kanaan, sebagai milik untuk selama-lamanya[b]; dan Aku akan menjadi Allah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri tempat-tempat tinggalmu sebagai pendatang.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “menjadi milik untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Aku akan memberikan
  rationale: Bentuk perfektum dengan waw dalam tuturan perjanjian paling wajar dipahami sebagai janji yang berorientasi ke masa depan.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: dan kepada keturunanmu sesudah engkau
  rationale: זֶרַע adalah nomina kolektif; 'keturunanmu' alami dalam bahasa Indonesia dan tetap dapat menunjuk pada keturunan secara kolektif. 'Sesudah engkau' mempertahankan gagasan suksesi.
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: negeri tempat engkau tinggal sebagai pendatang
  rationale: מְגוּרִים menunjuk pada tempat tinggal seseorang yang berstatus pendatang atau orang asing; terjemahan ini lebih jelas dan alami daripada bentuk nominal yang kaku.
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: yaitu seluruh negeri Kanaan
  rationale: Frasa ini merupakan aposisi yang memperjelas negeri yang baru disebut; 'seluruh' mempertahankan cakupan כָּל.
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: sebagai milik untuk selama-lamanya
  rationale: אֲחֻזָּה berarti milik atau tanah pegangan, sedangkan עוֹלָם menyatakan keberlangsungan yang tidak berkesudahan dalam janji perjanjian. Susunan ini alami dalam bahasa Indonesia.
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: dan Aku akan menjadi Allah mereka
  rationale: Ini adalah rumusan hubungan perjanjian yang lazim; terjemahan tersebut mempertahankan bentuk dan resonansinya tanpa menyiratkan perubahan hakikat Allah.
theological_decisions:
- issue: Penerjemahan rumusan perjanjian tanpa memasukkan penafsiran doktrinal yang lebih kemudian
  choice: Aku akan menjadi Allah mereka
  alternative: Aku akan menjadi Allah bagi mereka
  rationale: Keduanya mungkin secara gramatikal, tetapi bentuk terpilih lebih alami dan mempertahankan rumusan relasional perjanjian. Ungkapan ini tidak menyatakan bahwa Allah mengalami perubahan ontologis.
- issue: Daya cakup עוֹלָם dalam janji kepemilikan tanah
  choice: untuk selama-lamanya
  alternative: untuk waktu yang tidak terbatas
  rationale: Terjemahan utama mempertahankan bobot temporal dan teologis kata Ibrani tanpa menentukan dari dalam terjemahan bagaimana janji itu harus diselaraskan dengan perkembangan kanonik atau penafsiran eskatologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dipakai untuk sapaan tunggal kepada Abraham, sedangkan 'Aku' mengikuti konvensi penulisan untuk tuturan ilahi. 'Negeri' dipilih untuk wilayah Kanaan, dan status Abraham sebagai pendatang dinyatakan secara eksplisit agar nuansa מְגוּרִים tidak hilang.
