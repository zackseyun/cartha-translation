base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: id
  text: Aku akan memberkatinya, bahkan Aku akan memberikan kepadamu seorang anak laki-laki darinya. Aku akan memberkatinya, dan ia akan menjadi asal bagi bangsa-bangsa[a]; raja-raja berbagai kaum akan berasal darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ia akan menjadi bangsa-bangsa.” Ungkapan Ibrani juga dapat dipahami sebagai “ia akan menjadi ibu bangsa-bangsa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: Aku akan memberkatinya / Aku akan memberkatinya
  rationale: Kata ברך diterjemahkan secara langsung sebagai 'memberkati' untuk mempertahankan bobot perjanjian dan teologisnya. Pengulangan dalam bahasa Ibrani dipertahankan sebagai penegasan.
- source_word: וְגַם
  choice: bahkan
  rationale: Partikel ini menambahkan penegasan, bukan sekadar menghubungkan dua klausa. 'Bahkan' alami dalam bahasa Indonesia dan menampilkan daya tambah tersebut.
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: Aku akan memberikan kepadamu seorang anak laki-laki darinya
  rationale: Walaupun נָתַתִּי berbentuk qatal, dalam konteks janji ilahi bentuk ini mengacu kepada tindakan yang akan datang. 'Darinya' mempertahankan keterangan asal maternal tanpa memperluas makna.
- source_word: וְהָיְתָה לְגוֹיִם
  choice: ia akan menjadi asal bangsa-bangsa
  rationale: Ungkapan Ibrani secara harfiah berarti 'ia akan menjadi bangsa-bangsa' atau 'ia akan menjadi bagi bangsa-bangsa'. Penambahan minimal 'asal' menghasilkan bahasa Indonesia yang wajar sambil mempertahankan gambaran bahwa banyak bangsa berasal dari Sara; bentuk yang lebih harfiah dicatat dalam catatan kaki.
- source_word: מַלְכֵי עַמִּים
  choice: raja-raja berbagai kaum
  rationale: Kata עַמִּים dibedakan dari גוֹיִם dalam klausa sebelumnya. 'Berbagai kaum' mengungkapkan bentuk jamak secara alami dan mempertahankan perbedaan leksikal itu.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: akan berasal darinya
  rationale: Terjemahan ini mempertahankan makna asal-usul atau garis keturunan dari ungkapan harfiah 'akan ada dari dia' dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Janji bahwa bangsa-bangsa akan berasal dari Sara
  choice: ia akan menjadi asal bangsa-bangsa
  alternative: ia akan menjadi bangsa-bangsa; ia akan menjadi ibu bangsa-bangsa
  rationale: Pilihan ini menyampaikan cakupan kolektif dan genealogis janji tanpa menyisipkan gelar 'ibu', yang tersirat tetapi tidak dinyatakan dalam teks Ibrani. Catatan kaki mempertahankan bentuk Ibrani yang mencolok dan ambigu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi 'Aku' ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur pengulangan dipertahankan, sedangkan ungkapan yang sangat janggal jika diterjemahkan mentah diberi padanan alami dengan catatan kaki.
