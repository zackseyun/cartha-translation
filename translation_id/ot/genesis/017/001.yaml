  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: id
  text: Ketika Abram berumur sembilan puluh sembilan tahun, Yahweh menampakkan diri kepadanya dan berfirman, “Akulah Allah Yang Mahakuasa[a]. Berjalanlah di hadapan-Ku dan jadilah tak bercela.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: El Shaddai. Secara tradisional ungkapan ini juga ditransliterasikan, bukan diterjemahkan; nuansa tepat kata Shaddai masih diperdebatkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: Ketika Abram berumur sembilan puluh sembilan tahun
  rationale: Ungkapan umur Ibrani dan pembuka naratif dialihkan ke bentuk temporal yang alami dalam bahasa Indonesia modern.
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Niphal dengan Yahweh sebagai pelaku menyatakan bahwa Ia memperlihatkan diri kepada Abram; ungkapan ini alami dan mempertahankan unsur penyataan diri.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  rationale: Gelar ini diterjemahkan agar maknanya langsung dipahami, sementara bentuk Ibraninya dan ketidakpastian nuansa Shaddai dicatat dalam catatan kaki.
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: Berjalanlah di hadapan-Ku
  rationale: Metafora berjalan sebagai cara menjalani hidup dipertahankan bersama nuansa hidup dalam hadirat dan pengawasan Allah.
- source_word: וֶהְיֵה תָמִים
  choice: dan jadilah tak bercela
  rationale: Pilihan ini menyampaikan tuntutan akan keutuhan dan integritas moral tanpa menyiratkan kesempurnaan mutlak tanpa dosa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian itu secara langsung; transliterasi Yahweh mempertahankannya sebagai nama diri.
- issue: Penerjemahan אֵל שַׁדַּי
  choice: Allah Yang Mahakuasa
  alternative: El Shaddai
  rationale: Terjemahan gelar dipakai dalam teks utama demi kejelasan, tetapi bentuk tradisionalnya dicantumkan karena arti tepat Shaddai masih diperdebatkan.
- issue: Cakupan makna תָמִים
  choice: tak bercela
  alternative: utuh hati atau sempurna
  rationale: Tak bercela mempertahankan bobot etis dan perjanjian tanpa menutup kemungkinan nuansa keutuhan, serta menghindari kesan tuntutan akan kesempurnaan metafisis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “berfirman” sesuai untuk ujaran ilahi; metafora “berjalan di hadapan-Ku” dipertahankan agar corak perjanjian teks sumber tidak hilang. Penanda catatan kaki ditempatkan sesudah gelar yang dijelaskannya.
