revisions:
- from: Mengenai Ismael, Aku telah mendengarkan permintaanmu. Sesungguhnya, Aku telah memberkatinya. Aku akan membuatnya beranak cucu dan menjadikannya sangat banyak. Ia akan menurunkan dua belas pemimpin, dan Aku akan menjadikannya bangsa yang besar.
  to: Mengenai Ismael, Aku telah mendengarkanmu. Sesungguhnya, Aku telah memberkatinya. Aku akan membuatnya beranak cucu dan sangat memperbanyak keturunannya. Ia akan menurunkan dua belas pemimpin, dan Aku akan menjadikannya bangsa yang besar.
  rationale: Revisi menghapus objek yang tidak dinyatakan dalam sumber pada שְׁמַעְתִּיךָ dan memperjelas secara idiomatis akibat janji pelipatgandaan tanpa mengubah cakupan berkat bagi Ismael. Tidak ada catatan kaki yang diperlukan atau didukung oleh persoalan tekstual dalam ayat ini.
