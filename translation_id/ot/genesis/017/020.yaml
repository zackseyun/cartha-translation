  text: וּֽ/לְ/יִשְׁמָעֵ֘אל שְׁמַעְתִּי/ךָ֒ הִנֵּ֣ה בֵּרַ֣כְתִּי אֹת֗/וֹ וְ/הִפְרֵיתִ֥י אֹת֛/וֹ וְ/הִרְבֵּיתִ֥י אֹת֖/וֹ בִּ/מְאֹ֣ד מְאֹ֑ד שְׁנֵים עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּ/נְתַתִּ֖י/ו לְ/ג֥וֹי גָּדֽוֹל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: id
  text: Mengenai Ismael, Aku telah mendengarkanmu. Sesungguhnya, Aku telah memberkatinya. Aku akan membuatnya beranak cucu dan sangat memperbanyak keturunannya. Ia akan menurunkan dua belas pemimpin, dan Aku akan menjadikannya bangsa yang besar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְיִשְׁמָעֵאל
  choice: Mengenai Ismael
  rationale: 'Preposisi לְ di sini menandai peralihan topik: ''mengenai'' atau ''tentang'' Ismael.'
- source_word: שְׁמַעְתִּיךָ
  choice: Aku telah mendengarkan permintaanmu
  rationale: Secara harfiah berarti 'Aku telah mendengarkanmu'; konteks permohonan Abraham bagi Ismael pada ayat 18 membuat objek tersiratnya, yaitu permintaan Abraham, wajar dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Penanda wacana ini menarik perhatian dan menegaskan pernyataan berikut; 'sesungguhnya' mempertahankan nada khidmat tanpa terdengar janggal.
- source_word: וְהִפְרֵיתִי אֹתוֹ
  choice: Aku akan membuatnya beranak cucu
  rationale: Bentuk perfektum profetis dalam rangkaian janji diterjemahkan sebagai masa depan; verba פרה menyatakan menjadi berbuah atau menghasilkan banyak keturunan.
- source_word: וְהִרְבֵּיתִי אֹתוֹ בִּמְאֹד מְאֹד
  choice: dan menjadikannya sangat banyak
  rationale: Ungkapan intensif מְאֹד מְאֹד menyatakan pelipatgandaan yang luar biasa; 'sangat banyak' alami dan tepat dalam bahasa Indonesia.
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: dua belas pemimpin
  rationale: נָשִׂיא menunjuk kepala, pemimpin, atau penguasa kelompok; 'pemimpin' menghindari konotasi gelar kebangsawanan Eropa dari 'pangeran'.
- source_word: יוֹלִיד
  choice: Ia akan menurunkan
  rationale: Bentuk Hifil dari ילד berarti memperanakkan atau menjadi leluhur dari; 'menurunkan' menyampaikan bahwa dua belas pemimpin akan berasal darinya.
- source_word: וּנְתַתִּיו לְגוֹי גָּדוֹל
  choice: Aku akan menjadikannya bangsa yang besar
  rationale: נתן dengan konstruksi לְ di sini berfungsi dalam arti menetapkan atau menjadikan; גּוֹי berarti bangsa.
theological_decisions:
- issue: Hubungan janji bagi Ismael dengan perjanjian melalui Ishak
  choice: Menerjemahkan berkat bagi Ismael secara penuh tanpa menambahkan atau mengurangi status perjanjiannya
  alternative: Menambahkan penjelasan bahwa berkat ini berada di luar garis perjanjian
  rationale: Ayat ini menyatakan berkat dan kebangsaan Ismael, sedangkan pembedaan garis perjanjian dijelaskan dalam ayat 21; memasukkannya ke ayat ini akan melampaui teks.
- issue: Aspek kata kerja perfektum dalam janji ilahi
  choice: Menggunakan bentuk masa depan untuk tindakan yang dijanjikan
  alternative: 'Menerjemahkan seluruhnya sebagai tindakan yang sudah selesai: ''telah membuatnya beranak cucu'''
  rationale: Walau beberapa verba berbentuk perfektum, konteks dan kelanjutan ayat mengacu pada pemenuhan yang akan datang; bahasa Indonesia perlu menyatakan orientasi waktunya secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi kata ganti ilahi mengikuti kebiasaan luas penerjemahan Alkitab Indonesia. Kalimat dipecah secukupnya agar mudah dibaca tanpa mengubah struktur janji.
