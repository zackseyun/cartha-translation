base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: id
  text: 'Lalu Allah berfirman kepada Abraham, “Mengenai engkau, engkau harus memegang perjanjian-Ku: engkau dan keturunanmu sesudah engkau, dari generasi ke generasi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk waw-konsekutif melanjutkan alur narasi. “Lalu” wajar dalam narasi Indonesia, sedangkan “berfirman” merupakan padanan bermartabat yang lazim ketika Allah menjadi subjek.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada Allah yang mengikat perjanjian dengan Abraham; “Allah” adalah padanan baku dalam bahasa Indonesia.
- source_word: אֶל־אַבְרָהָם
  choice: kepada Abraham
  rationale: Teks Ibrani menggunakan nama Abraham setelah penggantian namanya dalam konteks terdekat; preposisi אֶל secara langsung berarti “kepada”.
- source_word: וְאַתָּה
  choice: Mengenai engkau
  rationale: Pronomina yang dikedepankan bersifat emfatis dan mengalihkan perhatian kepada kewajiban Abraham. “Mengenai engkau” mempertahankan penekanan wacana itu secara alami dan formal.
- source_word: אֶת־בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Nomina dengan akhiran orang pertama tunggal secara langsung berarti “perjanjian-Ku” dan mempertahankan istilah perjanjian yang sentral dalam konteks.
- source_word: תִשְׁמֹר
  choice: harus memegang
  rationale: שׁמר dapat berarti menjaga, memegang, atau menaati. Dalam konteks perjanjian, “memegang perjanjian” mengungkapkan kewajiban untuk tetap setia dan menaatinya tanpa mempersempit makna menjadi satu tindakan tertentu.
- source_word: אַתָּה וְזַרְעֲךָ
  choice: engkau dan keturunanmu
  rationale: זֶרַע secara harfiah berarti “benih”, tetapi di sini merupakan nomina kolektif bagi garis keturunan. “Keturunanmu” adalah ungkapan Indonesia yang alami dan tetap dapat berfungsi secara kolektif.
- source_word: אַחֲרֶיךָ
  choice: sesudah engkau
  rationale: Frasa ini menunjukkan penerusan dalam garis keturunan; “sesudah engkau” mempertahankan susunan dan makna dasarnya.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan keberlanjutan melalui generasi-generasi berikutnya. “Turun-temurun” adalah idiom Indonesia yang ringkas dan alami untuk makna tersebut.
theological_decisions:
- issue: Mengungkapkan kewajiban perjanjian tanpa menambahkan nuansa hukum atau sakramental tertentu
  choice: engkau harus memegang perjanjian-Ku
  alternative: engkau harus menaati perjanjian-Ku
  rationale: “Memegang” mempertahankan metafora luas dari שׁמר dan bahasa perjanjian, sedangkan “menaati” dapat terdengar lebih terbatas pada perintah-perintah. Pilihan ini menyatakan kewajiban Abraham dan keturunannya tanpa memasukkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” mempertahankan sapaan tunggal dan pengulangan emfatis dalam teks Ibrani; “turun-temurun” menyampaikan kesinambungan antargenerasi secara idiomatis.
