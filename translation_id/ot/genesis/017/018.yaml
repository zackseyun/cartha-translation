  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: id
  text: Lalu Abraham berkata kepada Allah, “Ah, sekiranya Ismael hidup di hadapan-Mu![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup dalam hadirat-Mu” atau “hidup di bawah perkenanan-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia dan tetap menunjukkan urutan tindakan.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Preposisi אֶל bersama verba berbicara berarti “kepada”; הָאֱלֹהִים menunjuk kepada Allah yang sudah jelas dalam konteks.
- source_word: לוּ
  choice: Ah, sekiranya
  rationale: Partikel ini menyatakan harapan kuat, bukan syarat biasa. Ungkapan tersebut mempertahankan nada emosional Abraham dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יִשְׁמָעֵאל
  choice: Ismael
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: יִחְיֶה
  choice: hidup
  rationale: Bentuk imperfek setelah partikel harapan menyatakan kehidupan yang sangat diharapkan Abraham; dalam konstruksi “sekiranya,” bentuk “hidup” menyampaikan daya optatif secara alami.
- source_word: לְפָנֶיךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah berarti “di depan wajah-Mu/di hadapan-Mu.” Pilihan ini mempertahankan nuansa relasional yang mungkin mencakup kehadiran atau perkenanan Allah tanpa mempersempit artinya.
theological_decisions:
- issue: Nuansa harapan Abraham mengenai kedudukan Ismael di hadapan Allah
  choice: di hadapan-Mu
  alternative: dalam hadirat-Mu; di bawah perkenanan-Mu
  rationale: Bahasa Ibrani dapat menyiratkan kehidupan dalam hadirat dan perkenanan Allah, tetapi ayat ini tidak menjelaskan cakupan teologisnya. Terjemahan utama mempertahankan kepadatan dan ketegangan ungkapan sumber tanpa menambahkan konsep berkat atau status perjanjian secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Seruan “Ah, sekiranya” mempertahankan kuatnya harapan Abraham tanpa memakai bentuk yang terlalu arkais. Huruf kapital pada “-Mu” mengikuti kebiasaan ejaan religius Indonesia untuk sapaan kepada Allah.
