base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: id
  text: Pada umur delapan hari,[a] setiap laki-laki di antara kamu harus disunat dari generasi ke generasi, baik yang lahir dalam rumah tangga maupun yang dibeli dengan perak dari orang asing mana pun yang bukan keturunanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak laki-laki berumur delapan hari.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari setiap anak orang asing yang bukan dari benihmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: Pada umur delapan hari
  rationale: Ungkapan Ibrani harfiah 'anak laki-laki berumur delapan hari' menyatakan umur ketika sunat harus dilakukan. Bentuk temporal ini alami dalam bahasa Indonesia dan mempertahankan ketentuan waktunya.
- source_word: יִמּוֹל
  choice: harus disunat
  rationale: Bentuk Nifal di sini bersifat pasif dan berfungsi sebagai perintah. 'Harus disunat' menyampaikan kewajiban dengan jelas dalam bahasa Indonesia modern.
- source_word: לָכֶם כָּל זָכָר
  choice: setiap laki-laki di antara kamu
  rationale: Frasa ini mencakup setiap orang berjenis kelamin laki-laki dalam lingkungan umat yang disapa; 'di antara kamu' mengungkapkan fungsi לָכֶם secara idiomatis.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini secara ringkas dan wajar menyatakan keberlakuan bagi generasi-generasi berikutnya.
- source_word: יְלִיד בָּיִת
  choice: yang lahir dalam rumah tangga
  rationale: Frasa tersebut menunjuk kepada orang yang lahir dalam lingkup rumah tangga, bukan sekadar di dalam sebuah bangunan.
- source_word: וּמִקְנַת כֶּסֶף
  choice: yang dibeli dengan perak
  rationale: Terjemahan ini mempertahankan gambaran ekonomi konkret dari כֶּסֶף ('perak'), yang juga dapat berfungsi sebagai alat pembayaran.
- source_word: מִכֹּל בֶּן נֵכָר
  choice: dari orang asing mana pun
  rationale: Secara harfiah frasa ini berbunyi 'dari setiap anak orang asing', tetapi merupakan ungkapan yang menunjuk kepada orang asing; terjemahan ini menyampaikan maknanya secara alami.
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: yang bukan keturunanmu
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi dalam konteks ini menunjuk kepada garis keturunan. 'Keturunanmu' jelas dan alami.
theological_decisions:
- issue: Cakupan perintah sunat dalam rumah tangga perjanjian Abraham
  choice: Perintah mencakup setiap laki-laki dalam rumah tangga, termasuk yang lahir di dalamnya dan yang dibeli dari orang asing, bukan hanya keturunan biologis Abraham.
  alternative: Membatasi perintah terutama atau hanya kepada keturunan biologis Abraham.
  rationale: Teks Ibrani secara eksplisit menyebut orang yang lahir dalam rumah tangga dan orang yang dibeli dari pihak asing yang bukan keturunan Abraham. Terjemahan mempertahankan cakupan tersebut tanpa menarik kesimpulan teologis lanjutan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan ketentuan umur, keberlakuan turun-temurun, serta cakupan rumah tangga yang dinyatakan teks Ibrani.
