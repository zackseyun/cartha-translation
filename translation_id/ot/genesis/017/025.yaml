  yaml_path: translation/ot/genesis/017/025.yaml
  text: And Ishmael his son was thirteen years old when the flesh of his foreskin was circumcised[a].
translation:
  language: id
  text: Ismael, anaknya, berumur tiga belas tahun ketika daging kulit khatannya disunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  choice: Ismael
  rationale: Nama diri mengikuti bentuk baku bahasa Indonesia; waw naratif tidak perlu diterjemahkan tersendiri karena ayat ini melanjutkan kalimat dan alur dari ayat sebelumnya.
- source_word: בְּנ֔/וֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal diterjemahkan langsung dan alami.
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: berumur tiga belas tahun
  rationale: Ungkapan usia Ibrani dialihkan ke bentuk idiomatis bahasa Indonesia.
- source_word: בְּ/הִמֹּל/וֹ
  choice: ketika ... disunat
  rationale: Preposisi dengan infinitif konstruk dan sufiks menyatakan waktu; bentuk Nifal dipertahankan sebagai pasif.
- source_word: אֵת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: בְּשַׂר עָרְלָת/וֹ
  choice: daging kulit khatannya
  rationale: Terjemahan konkret ini mempertahankan objek eksplisit dan ungkapan tubuh dalam teks Ibrani, meskipun sedikit lebih formal daripada sekadar 'ia disunat'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa mempertahankan perincian konkret teks sumber tanpa menambahkan penafsiran teologis. Tidak digunakan catatan kaki karena tidak ada ambiguitas yang perlu dijelaskan kepada pembaca; catatan kaki Inggris tampaknya hanya merekam versi sebelumnya dan mengulang teks yang sama.
