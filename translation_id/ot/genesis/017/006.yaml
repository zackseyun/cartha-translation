  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: id
  text: Aku akan membuatmu sangat, sangat subur[a]. Aku akan menjadikanmu leluhur berbagai bangsa, dan raja-raja akan berasal darimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku akan membuatmu berbuah sangat, sangat banyak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: Aku akan membuat engkau ... beranak cucu
  rationale: Bentuk Hifil dari פרה bersifat kausatif, yakni membuat seseorang menghasilkan keturunan atau bertambah melalui keturunan. Dalam konteks janji kepada Abraham, 'beranak cucu' menyampaikan gagasan itu secara alami.
- source_word: בִּמְאֹד מְאֹד
  choice: sangat, sangat
  rationale: Pengulangan מְאֹד memberi penegasan kuat. Pengulangan 'sangat' mempertahankan bentuk dan tekanan bahasa Ibrani dengan tetap jelas dalam bahasa Indonesia.
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: Aku akan menjadikan engkau asal berbagai bangsa
  rationale: 'נתן dengan ל di sini menyatakan hasil: Abraham akan menjadi asal atau leluhur bangsa-bangsa. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Abraham sendiri secara harfiah berubah menjadi bangsa-bangsa.'
- source_word: לְגוֹיִם
  choice: berbagai bangsa
  rationale: גּוֹיִם menunjuk kepada sejumlah bangsa atau kelompok bangsa, bukan secara khusus orang non-Yahudi. 'Berbagai bangsa' menyampaikan bentuk jamak dengan wajar.
- source_word: וּמְלָכִים
  choice: dan raja-raja
  rationale: מְלָכִים secara langsung berarti 'raja-raja'; padanan yang lebih umum seperti 'penguasa' kurang tepat.
- source_word: מִמְּךָ יֵצֵאוּ
  choice: akan berasal darimu
  rationale: Secara harfiah יצא berarti 'keluar', tetapi dalam konteks silsilah frasa ini menyatakan asal keturunan. 'Berasal darimu' alami sekaligus mempertahankan gagasan sumber atau asal.
theological_decisions:
- issue: Cakupan bangsa-bangsa dan raja-raja yang dijanjikan kepada Abraham
  choice: Ayat ini menyatakan bahwa Abraham akan menjadi asal berbagai bangsa dan raja-raja melalui keturunannya.
  alternative: Frasa tentang bangsa-bangsa dapat dipahami lebih abstrak sebagai penetapan kedudukan Abraham di antara bangsa-bangsa.
  rationale: Konteks langsung perjanjian menekankan keturunan, dan klausa berikutnya menyebut raja-raja yang berasal dari Abraham. Terjemahan genealogis paling sesuai tanpa memasukkan sistem teologis kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perjanjian yang lugas dan bermartabat. Kata ganti 'Aku' dan 'engkau' mempertahankan tuturan ilahi tunggal serta sapaan tunggal kepada Abraham. Pengulangan 'sangat, sangat' sengaja dipertahankan untuk mencerminkan intensitas teks Ibrani.
