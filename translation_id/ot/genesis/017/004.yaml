  text: אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖/י אִתָּ֑/ךְ וְ/הָיִ֕יתָ לְ/אַ֖ב הֲמ֥וֹן גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: id
  text: '“Dari pihak-Ku[a], inilah perjanjian-Ku dengan engkau: engkau akan menjadi bapa sejumlah besar bangsa-bangsa.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku—lihatlah, perjanjian-Ku dengan engkau.” Pronomina pembuka dan partikel sesudahnya bersifat emfatis dalam bahasa Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Atau, “engkau akan menjadi seorang bapa bagi sejumlah besar bangsa-bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Mengenai Aku
  rationale: Pronomina mandiri ini bersifat emfatis. Ungkapan ini mempertahankan penonjolan pada pihak Allah di awal pernyataan.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel deiktis ini mengarahkan perhatian kepada pernyataan berikutnya; 'lihatlah' mempertahankan daya langsung dan khidmatnya dalam bahasa Indonesia modern.
- source_word: בְרִיתִי
  choice: perjanjian-Ku
  rationale: '''Perjanjian'' adalah padanan baku dan tepat bagi istilah perjanjian dalam kisah Abraham.'
- source_word: אִתָּךְ
  choice: dengan engkau
  rationale: Padanan ini mengikuti arti langsung preposisi dan tidak memperluasnya menjadi 'antara Aku dan engkau'.
- source_word: וְהָיִיתָ
  choice: dan engkau akan menjadi
  rationale: Bentuk ini memiliki daya mendatang atau resultatif dalam pernyataan perjanjian dan menyatakan perubahan menuju peran yang dijanjikan.
- source_word: לְאָב
  choice: bapa
  rationale: '''Bapa'' mempertahankan metafora kekeluargaan teks sumber dan cocok dengan register Alkitab yang bermartabat.'
- source_word: הֲמוֹן
  choice: sejumlah besar
  rationale: Ungkapan ini menyampaikan banyaknya bangsa secara alami, sambil menghindari kata 'banyak' yang kurang mencerminkan nomina kolektif Ibrani.
- source_word: גּוֹיִם
  choice: bangsa
  rationale: Istilah ini menunjuk kepada bangsa-bangsa atau kelompok-kelompok bangsa secara umum, bukan kepada 'bangsa bukan Yahudi' dalam pengertian teknis yang lebih kemudian.
theological_decisions:
- issue: Rumusan perjanjian dan peran Abraham
  choice: perjanjian-Ku ada dengan engkau, dan engkau akan menjadi bapa sejumlah besar bangsa
  alternative: Aku mengadakan perjanjian-Ku dengan engkau; engkau akan menjadi leluhur banyak bangsa
  rationale: Pilihan ini mempertahankan pernyataan relasional dan hasil yang dijanjikan tanpa menambahkan tindakan 'mengadakan' yang tidak dinyatakan oleh verba dalam teks, serta mempertahankan metafora 'bapa'.
translation_notes:
  register: Bahasa Indonesia baku, khidmat, dan mudah dipahami. 'Engkau' dipakai untuk sapaan tunggal dalam wacana ilahi; 'Aku' dan sufiks '-Ku' dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki [a] dan [b] keduanya dicantumkan dalam teks utama.
