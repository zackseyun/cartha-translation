  source_fidelity: 'Teks Indonesia setia kepada Ibrani: waw dipahami secara kontras secara wajar dalam konteks, בְּרִיתִי diterjemahkan “perjanjian-Ku,” dan אָקִים sebagai “akan meneguhkan” sesuai pemakaian verba ini dalam konteks perjanjian. “Dengan Ishak” merupakan penyesuaian idiomatis yang tepat bagi relasi perjanjian. Klausa “yang akan dilahirkan Sara bagimu” menyampaikan bahwa Sara akan melahirkan Ishak bagi Abraham, dan “pada waktu ini tahun depan” memadai untuk לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת.'
