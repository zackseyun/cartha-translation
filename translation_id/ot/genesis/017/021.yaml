id: GEN.17.21
reference: Genesis 17:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: id
  text: Namun, Aku akan meneguhkan perjanjian-Ku dengan Ishak[a], yang akan dilahirkan Sara bagimu pada waktu ini tahun depan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Aku akan meneguhkan perjanjian-Ku dengan Ishak.” Kata penghubung Ibrani dapat diterjemahkan hanya sebagai “dan”, tetapi konteks mendukung makna kontras dengan janji mengenai Ismael pada ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Namun
  rationale: Waw pada awal ayat secara leksikal dapat berarti “dan”, tetapi dalam konteks ini menandai kontras antara berkat bagi Ismael pada ayat sebelumnya dan peneguhan perjanjian dengan Ishak.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku dan wajar bagi בְּרִית dengan sufiks orang pertama tunggal dalam konteks perjanjian Allah.
- source_word: אָקִים
  choice: Aku akan meneguhkan
  rationale: Bentuk hifil dari קום dalam konteks perjanjian menyatakan tindakan membuat atau mempertahankan sesuatu sebagai kukuh; “meneguhkan” alami dalam bahasa Indonesia dan tidak mengesankan bahwa perjanjian itu baru pertama kali dibuat di sini.
- source_word: אֶת יִצְחָק
  choice: dengan Ishak
  rationale: Walaupun אֶת secara bentuk adalah penanda objek langsung, konstruksi perjanjian dalam bahasa Indonesia paling alami memakai “dengan” untuk menyatakan pihak yang menerima perjanjian.
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: yang akan dilahirkan Sara bagimu
  rationale: Klausa relatif tetap mengacu kepada Ishak; bentuk pasif menghasilkan susunan Indonesia yang alami sambil mempertahankan Sara sebagai ibu dan לְךָ sebagai “bagimu”.
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: pada waktu ini tahun depan
  rationale: מוֹעֵד menunjuk waktu yang ditetapkan, tetapi dalam gabungan dengan “tahun berikutnya” ungkapan ini secara idiomatis berarti waktu yang sama pada tahun depan. Pilihan ini dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Garis perjanjian melalui Ishak, bukan Ismael
  choice: Ayat ini menyatakan bahwa Allah akan meneguhkan perjanjian-Nya dengan Ishak.
  alternative: Membuat pernyataan ini mencabut berkat yang baru dijanjikan kepada Ismael.
  rationale: Teks membedakan perjanjian dengan Ishak dari berkat bagi Ismael, tetapi tidak membatalkan berkat bagi Ismael yang disebut pada ayat sebelumnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Nama יִצְחָק dan שָׂרָה ditulis menurut bentuk Indonesia yang lazim: Ishak dan Sara.'
