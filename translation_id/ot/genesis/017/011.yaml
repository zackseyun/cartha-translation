source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: id
  text: Kalian harus menyunat kulit khatan kalian, dan itu akan menjadi tanda[a] perjanjian antara Aku dan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: penanda.'
    reason: Alternatif leksikal bagi אוֹת; “penanda” menonjolkan sesuatu yang menandai perjanjian tanpa mengubah hubungan sintaksisnya.
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: Kalian harus menyunat
  rationale: Bentuk Qal perfektum dengan waw dalam ketetapan perjanjian memiliki daya perintah. “Harus menyunat” menyampaikan kewajiban itu secara alami dan mempertahankan bentuk aktif.
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: kulit khatan kalian
  rationale: Dalam konteks anatomis ini, עָרְלָה menunjuk pada kulit khatan. Ungkapan harfiah “daging kulit khatan” terasa janggal dalam bahasa Indonesia modern, sehingga unsur בָּשָׂר disampaikan melalui ungkapan anatomis yang lazim tanpa mengubah tindakan yang diperintahkan. “Kalian” mempertahankan bentuk orang kedua jamak.
- source_word: וְהָיָה
  choice: dan itu akan menjadi
  rationale: Kata ganti “itu” secara alami merujuk pada penyunatan yang baru diperintahkan, sedangkan “akan menjadi” menyampaikan fungsi kopulatif/futural bentuk Ibrani.
- source_word: לְאוֹת
  choice: tanda
  rationale: אוֹת lazim berarti tanda, penanda, atau bukti. “Tanda” paling transparan dan netral dalam konteks perjanjian.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Konteks membuat perjanjian tertentu yang sedang Allah tetapkan ini definit meskipun bahasa Indonesia tidak memakai kata sandang definit.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: antara Aku dan kalian
  rationale: Terjemahan ini mempertahankan kedua pihak relasional dan bentuk orang kedua jamak tanpa memperluasnya secara eksplisit menjadi keturunan, yang dijelaskan dalam konteks sekitar.
theological_decisions:
- issue: Hakikat sunat sebagai tanda perjanjian
  choice: tanda perjanjian
  alternative: penanda perjanjian
  rationale: Terjemahan menyatakan fungsi sunat sebagaimana teks menyatakannya, tanpa menentukan apakah tanda itu semata-mata simbolis, sakramental, atau memiliki rumusan teologis lain yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. “Kalian” dipakai untuk memperlihatkan bahwa sapaan Ibrani berbentuk jamak. “Kulit khatan” dipilih karena lebih santun dan lazim dalam konteks keagamaan daripada “kulup”, namun tetap jelas secara anatomis.
