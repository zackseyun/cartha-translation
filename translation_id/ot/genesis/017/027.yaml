  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: id
  text: Dan semua laki-laki dalam rumah tangganya—baik yang lahir di rumahnya maupun yang dibeli dengan uang dari orang asing[a]—disunat bersama dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak orang asing”, suatu ungkapan yang berarti “orang asing” atau “orang luar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Semua
  rationale: Konjungsi וְ melanjutkan narasi sebelumnya, sedangkan כָּל menyatakan keseluruhan. Dalam bahasa Indonesia, kesinambungan itu tetap jelas tanpa harus memakai "dan" pada awal kalimat.
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: laki-laki dalam rumah tangganya
  rationale: Frasa ini merujuk kepada para anggota laki-laki dari rumah tangga Abraham. "Rumah tangga" menyampaikan cakupan sosial בַּיִת lebih tepat daripada sekadar bangunan rumah.
- source_word: יְלִיד בָּיִת
  choice: yang lahir di rumahnya
  rationale: Ungkapan ini menunjuk kepada orang yang lahir di dalam lingkup rumah tangga tersebut. Bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan latar sosialnya.
- source_word: וּמִקְנַת כֶּסֶף
  choice: maupun yang dibeli dengan uang
  rationale: Frasa konstruksi ini menunjuk kepada orang-orang yang diperoleh melalui pembelian. "Dibeli dengan uang" mempertahankan unsur transaksional teks secara jelas.
- source_word: מֵאֵת בֶּן נֵכָר
  choice: dari orang asing
  rationale: בֶּן נֵכָר secara harfiah berbentuk "anak orang/daerah asing", tetapi berfungsi sebagai idiom bagi orang asing atau orang luar.
- source_word: נִמֹּלוּ
  choice: disunat
  rationale: Bentuk Nifal paling tepat dipahami sebagai pasif dalam konteks ini, tanpa menyiratkan bahwa mereka menyunat diri sendiri.
- source_word: אִתּוֹ
  choice: bersama-sama dengan dia
  rationale: Preposisi ini menyatakan penyertaan dengan Abraham dalam peristiwa sunat; pengulangan "bersama-sama" membuat relasi itu jelas dan alami.
