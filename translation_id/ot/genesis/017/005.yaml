  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: id
  text: Namamu tidak akan lagi disebut Abram, melainkan Abraham, karena Aku telah menjadikan engkau bapa bagi banyak bangsa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Aku telah memberikan engkau sebagai bapa bagi banyak bangsa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקָּרֵא
  choice: akan ... disebut
  rationale: Bentuk Nifal dari קרא dalam rumusan pemberian nama bersifat pasif. 'Akan disebut' merupakan padanan Indonesia yang alami.
- source_word: לֹא ... עוֹד
  choice: tidak akan lagi
  rationale: Gabungan ini menyatakan penghentian sejak saat itu dan diterjemahkan secara idiomatis.
- source_word: שִׁמְךָ
  choice: namamu
  rationale: Padanan langsung dan alami bagi bentuk dengan sufiks orang kedua tunggal.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְהָיָה שִׁמְךָ
  choice: melainkan Abraham
  rationale: Klausa Ibrani secara harfiah berarti 'dan namamu akan menjadi Abraham'; 'melainkan' menyampaikan pertentangan dalam formula penggantian nama secara ringkas dan alami.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi nama baru.
- source_word: אַב
  choice: bapa
  rationale: '''Bapa'' mempertahankan arti dasar dan register luhur yang lazim dalam teks Alkitab Indonesia tanpa mengubahnya menjadi istilah yang lebih luas seperti ''leluhur''.'
- source_word: הֲמוֹן
  choice: banyak
  rationale: Dalam frasa 'bapa bagi banyak bangsa', 'banyak' menyampaikan kelimpahan secara alami; nuansa nominal 'sekumpulan besar' dicatat dalam catatan kaki melalui terjemahan yang lebih harfiah.
- source_word: גּוֹיִם
  choice: bangsa
  rationale: Dalam konteks perjanjian di Kitab Kejadian, istilah ini menunjuk kepada bangsa-bangsa secara luas, bukan khusus kepada orang non-Yahudi.
- source_word: נְתַתִּיךָ
  choice: Aku telah menjadikan engkau
  rationale: Secara leksikal berarti 'Aku telah memberikan/menetapkan engkau', tetapi dalam konstruksi predikatif ini 'menjadikan' merupakan ungkapan Indonesia yang alami. Bentuk perfektif dipertahankan dengan 'telah'.
theological_decisions:
- issue: Aspek selesai dalam pernyataan ilahi tentang pengangkatan Abraham
  choice: Aku telah menjadikan engkau bapa bagi banyak bangsa
  alternative: Aku akan menjadikan engkau bapa bagi banyak bangsa
  rationale: Teks Ibrani memakai bentuk perfektif נְתַתִּיךָ. Terjemahan mempertahankan janji yang dinyatakan sebagai kenyataan yang telah ditetapkan, alih-alih meratakannya menjadi bentuk masa depan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dan 'bapa' dipakai untuk mempertahankan nada sastra Alkitab yang mudah dipahami. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
