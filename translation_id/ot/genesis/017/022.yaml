base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: id
  text: Setelah Ia selesai berbicara dengan Abraham, Allah naik meninggalkan Abraham.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Allah naik dari atas Abraham.” Bahasa Ibrani menggambarkan berakhirnya penampakan Allah dengan istilah gerak naik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר
  choice: Setelah selesai berbicara
  rationale: Bentuk wayyiqtol dari כלה diikuti infinitif דבר membentuk ungkapan ‘selesai berbicara’. ‘Setelah’ menyatakan hubungan waktu dengan tindakan utama secara alami dalam bahasa Indonesia.
- source_word: אִתּוֹ
  choice: dengan Abraham
  rationale: Preposisi את dengan sufiks menyatakan interaksi, yakni ‘berbicara dengan’. Nama Abraham dipakai untuk memperjelas rujukan pronomina dan menghindari dua kata ‘dia’ yang berdekatan.
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata עלה berarti ‘naik’. Pilihan ini mempertahankan gambaran vertikal konkret tentang berakhirnya penampakan ilahi.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan Allah yang esa; ‘Allah’ adalah padanan baku dalam bahasa Indonesia.
- source_word: מֵעַל אַבְרָהָם
  choice: meninggalkan dia
  rationale: מֵעַל secara harfiah berarti ‘dari atas/dari atasnya’. Dalam konteks berakhirnya penampakan, ‘meninggalkan dia’ menyampaikan perpisahan dari Abraham secara alami, sementara verba ‘naik’ tetap mempertahankan arah spasialnya.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Gambaran antropomorfis tentang kepergian Allah
  choice: Mempertahankan bahasa spasial ‘Allah naik’
  alternative: Allah pergi meninggalkan Abraham; Allah menarik diri dari Abraham
  rationale: Teks Ibrani memakai kata konkret untuk gerak naik. Mempertahankannya menjaga cara narasi menggambarkan berakhirnya kehadiran Allah yang tampak tanpa menyimpulkan bahwa hakikat Allah dibatasi oleh ruang.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama ‘Abraham’ menggantikan pronomina pertama demi kejelasan, sedangkan ‘naik’ mempertahankan gambaran konkret teks Ibrani.
