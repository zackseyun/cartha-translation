base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: id
  text: Lalu Abraham bersujud dan tertawa. Ia berkata dalam hatinya, “Mungkinkah seorang anak laki-laki lahir bagi orang yang berumur seratus tahun? Mungkinkah Sara, yang berumur sembilan puluh tahun, melahirkan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָהָם עַל־פָּנָיו
  choice: Abraham bersujud
  rationale: Ungkapan harfiahnya ialah Abraham ‘jatuh pada wajahnya’ dan menggambarkan tindakan merendahkan diri dengan wajah ke tanah. ‘Bersujud’ menyampaikan postur itu secara alami dalam bahasa Indonesia.
- source_word: וַיִּצְחָק
  choice: tertawa
  rationale: Kata צחק berarti ‘tertawa’; pilihan netral ini juga mempertahankan kaitan naratif dengan nama Ishak tanpa menentukan motif tawanya.
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: Ia berkata dalam hatinya
  rationale: Terjemahan ini mempertahankan idiom Ibrani sekaligus menjelaskan bahwa perkataan tersebut bersifat batiniah dan tidak diucapkan kepada orang lain.
- source_word: הַלְּבֶן
  choice: Mungkinkah seorang anak laki-laki
  rationale: בן secara khusus berarti ‘anak laki-laki’ atau ‘putra’. Interogatif הֲ dalam konteks ini membentuk pertanyaan retoris mengenai kemungkinan terjadinya kelahiran.
- source_word: מֵאָה שָׁנָה
  choice: yang berumur seratus tahun
  rationale: Ini merupakan padanan Indonesia yang alami bagi ungkapan usia Ibrani tersebut.
- source_word: וְאִם
  choice: Mungkinkah
  rationale: Dalam rangkaian pertanyaan retoris ini, אם memperkenalkan pertanyaan kedua. Mengulangi ‘Mungkinkah’ menyampaikan hubungan dan daya retorisnya secara alami.
- source_word: הֲבַת תִּשְׁעִים שָׁנָה
  choice: yang berumur sembilan puluh tahun
  rationale: Secara harfiah, idiom ini berbunyi ‘anak perempuan dari sembilan puluh tahun’; klausa relatif ini menyampaikan makna usianya tanpa menambahkan nomina yang tidak terdapat dalam teks.
- source_word: תֵּלֵד
  choice: melahirkan
  rationale: Dengan subjek perempuan, bentuk Qal dari ילד berarti melahirkan; ‘melahirkan’ merupakan padanan modern dan langsung.
theological_decisions:
- issue: Makna tawa Abraham
  choice: Diterjemahkan secara netral sebagai ‘tertawa’.
  alternative: ‘tertawa karena tidak percaya’ atau ‘tertawa dengan sukacita’
  rationale: Ayat ini tidak secara eksplisit menyatakan apakah tawa Abraham berasal dari ketidakpercayaan, keterkejutan, atau sukacita. Terjemahan tidak seharusnya menuntaskan ketegangan naratif tersebut.
- issue: Daya pertanyaan batin Abraham
  choice: Menggunakan ‘Mungkinkah’ sebagai pertanyaan retoris.
  alternative: ‘Apakah ... akan’
  rationale: Bentuk Ibrani dapat diterjemahkan sebagai pertanyaan tentang apa yang akan terjadi, tetapi konteks dan usia yang disebutkan memberi pertanyaan itu nuansa keheranan terhadap kemungkinannya. ‘Mungkinkah’ mempertahankan nuansa itu tanpa secara eksplisit menuduh Abraham tidak percaya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Bersujud’ dipilih daripada ungkapan harfiah yang kaku ‘jatuh pada wajahnya’. Pertanyaan dibuat ringkas dan alami, sedangkan ungkapan ‘berkata dalam hatinya’ dipertahankan karena mudah dipahami serta dekat dengan bentuk sumber.
