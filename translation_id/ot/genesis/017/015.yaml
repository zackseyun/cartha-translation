base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: id
  text: Kemudian Allah berfirman kepada Abraham, “Mengenai Sarai, istrimu, jangan engkau menyebut namanya Sarai, sebab namanya Sarah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Waw-konsekutif melanjutkan alur cerita. ‘Kemudian’ menyampaikan urutan secara alami, sedangkan ‘berfirman’ merupakan padanan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku dalam Alkitab bahasa Indonesia bagi אֱלֹהִים ketika menunjuk kepada Allah yang esa dalam konteks ini.
- source_word: אֶל אַבְרָהָם
  choice: kepada Abraham
  rationale: Menyatakan orang yang menjadi tujuan firman secara langsung.
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: Mengenai Sarai, istrimu
  rationale: Mempertahankan topik yang didahulukan dalam bahasa Ibrani, tetapi menyusunnya secara alami dalam bahasa Indonesia.
- source_word: לֹא תִקְרָא אֶת שְׁמָהּ שָׂרָי
  choice: jangan lagi engkau menyebut namanya Sarai
  rationale: Bentuk imperfek dalam firman langsung berfungsi sebagai larangan. ‘Jangan lagi’ mengungkapkan secara idiomatis bahwa nama lama tidak boleh terus digunakan; ‘namanya’ mempertahankan unsur formula penamaan.
- source_word: כִּי
  choice: ;
  rationale: Dalam konteks deklarasi penamaan ini, hubungan penjelas antara kedua klausa dapat disampaikan secara alami dengan tanda titik koma tanpa memaksakan arti kausal yang lebih sempit.
- source_word: שָׂרָה שְׁמָהּ
  choice: Sarah adalah namanya
  rationale: Klausa nominal Ibrani menempatkan ‘Sarah’ di depan untuk penekanan. Susunan ini mempertahankan penekanan dan tidak menambahkan penanda waktu mendatang yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Rumusan penggantian nama
  choice: “jangan lagi engkau menyebut namanya Sarai; Sarah adalah namanya”
  alternative: “jangan menyebut namanya Sarai, sebab namanya Sarah” atau “namanya haruslah Sarah”
  rationale: Terjemahan mempertahankan larangan dan deklarasi nama baru sebagai dua unsur formal, sambil menghindari penambahan modalitas ‘haruslah’ atau kala mendatang yang tidak eksplisit dalam klausa nominal Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan ‘Sarah adalah namanya’ sengaja dipertahankan untuk mencerminkan penekanan Ibrani, sedangkan ‘jangan lagi’ membuat implikasi penggantian nama jelas dan alami bagi pembaca masa kini.
