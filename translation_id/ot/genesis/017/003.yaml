  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: id
  text: 'Lalu Abram tersungkur dengan wajahnya ke tanah, dan Allah berfirman kepadanya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל ... עַל־פָּנָיו
  choice: sujud dengan muka sampai ke tanah
  rationale: Secara harfiah menggambarkan Abram jatuh pada mukanya; ungkapan Indonesia ini menyampaikan tindakan merendahkan diri dengan jelas dan alami tanpa kehilangan citra tubuhnya.
- source_word: אַבְרָם
  choice: Abram
  rationale: Nama dipertahankan sebagai Abram karena perubahan namanya menjadi Abraham baru dinyatakan kemudian dalam pasal ini.
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk Piel dari דבר dalam konteks ini berarti 'berbicara'; pilihan ini juga membedakannya dari formula pengantar לֵאמֹר.
- source_word: אִתּוֹ
  choice: dengannya
  rationale: Menerjemahkan preposisi אֵת secara langsung sebagai 'dengan'; bentuk ini tetap wajar dalam bahasa Indonesia dan mempertahankan nuansa relasional teks.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal dan konteks menunjukkan bahwa yang dimaksud adalah Allah yang esa.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Formula Ibrani ini memperkenalkan ucapan langsung. 'Kata-Nya' alami dalam narasi Indonesia, menghindari susunan kaku 'berbicara ... dengan berkata', dan mempersiapkan kelanjutan pada ayat berikutnya.
- source_word: וַ
  choice: Lalu
  rationale: Menandai urutan peristiwa dalam narasi secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Jumlah dan rujukan אֱלֹהִים
  choice: Allah (tunggal)
  alternative: allah-allah (jamak secara morfologis saja)
  rationale: Verba yang menyertainya berbentuk tunggal, dan konteks perjanjian menunjukkan satu pribadi ilahi yang berbicara kepada Abram; terjemahan jamak tidak sesuai dengan tata bahasa maupun konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'sujud dengan muka sampai ke tanah' mudah dipahami pembaca umum serta mempertahankan gambaran konkret bahasa Ibrani. Tanda koma akhir menunjukkan bahwa ucapan Allah berlanjut pada ayat berikutnya.
