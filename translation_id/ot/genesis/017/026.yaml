  text: On that very day Abraham and his son Ishmael were circumcised.
translation:
  language: id
  text: Pada hari itu juga, Abraham dan Ismael, anaknya, disunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Pada hari itu juga
  rationale: Ungkapan ini menegaskan bahwa peristiwa tersebut terjadi tepat pada hari yang telah disebutkan. Frasa Indonesia ini mempertahankan penekanan waktunya secara alami.
- source_word: נִמּוֹל
  choice: disunat
  rationale: Bentuk Nifal menyatakan tindakan pasif. Walaupun verba Ibrani berbentuk tunggal dan mendahului subjek majemuk, bahasa Indonesia tidak menandai kesesuaian jumlah pada verba.
- source_word: אַבְרָהָם
  choice: Abraham
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וְיִשְׁמָעֵאל
  choice: dan Ismael
  rationale: Konjungsi diterjemahkan langsung, dan nama itu memakai bentuk baku bahasa Indonesia.
- source_word: בְּנוֹ
  choice: anaknya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal menyatakan bahwa Ismael adalah anak Abraham. Bentuk ini alami dan mempertahankan hubungan tersebut.
