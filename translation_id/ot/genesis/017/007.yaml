  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: id
  text: Aku akan menegakkan perjanjian-Ku antara Aku dan engkau, serta antara Aku dan keturunanmu[b] sesudah engkau, dari generasi ke generasi, sebagai perjanjian kekal, untuk menjadi Allah bagimu[a] dan bagi keturunanmu sesudah engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “untuk menjadi Allahmu.”
    reason: lexical_alternative
  - marker: b
    text: Kata “keturunan” menerjemahkan kata Ibrani berbentuk tunggal kolektif yang juga dapat diterjemahkan “benih” atau “keturunan”; kata ini dapat menunjuk kepada anak cucu sebagai satu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: Aku akan menegakkan
  rationale: Dalam kaitannya dengan בְּרִית, verba ini berarti menetapkan, meneguhkan, atau memberlakukan perjanjian. 'Menegakkan' mempertahankan nuansa tindakan Allah yang membuat perjanjian itu berlaku tanpa membatasinya pada sekadar pemeliharaan.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku untuk בְּרִית dengan akhiran kepunyaan orang pertama tunggal.
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: antara Aku dan engkau serta
  rationale: Menjaga para pihak dalam perjanjian sambil mengungkapkan pengulangan konstruksi Ibrani secara alami dalam bahasa Indonesia.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע adalah bentuk tunggal kolektif yang dapat menunjuk kepada keturunan sebagai satu kelompok. 'Keturunanmu' alami dalam bahasa Indonesia dan tetap dapat dipahami secara kolektif; catatan kaki menjelaskan bentuk sumbernya.
- source_word: אַחֲרֶיךָ
  choice: sesudah engkau
  rationale: Mempertahankan ungkapan temporal-genealogis yang menunjuk kepada generasi yang menyusul Abraham.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlangsungan melalui generasi-generasi mereka.
- source_word: לִבְרִית עוֹלָם
  choice: sebagai perjanjian kekal
  rationale: עוֹלָם dalam konteks ini menyatakan keberlangsungan tetap atau abadi; 'kekal' merupakan padanan yang ringkas, lazim, dan bermartabat.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: Aku akan menjadi Allah bagimu
  rationale: Menjaga bentuk relasional formula perjanjian Ibrani, yang secara harfiah menyatakan bahwa Allah akan menjadi Allah bagi Abraham, daripada langsung menghaluskannya menjadi bentuk posesif.
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: dan bagi keturunanmu sesudah engkau
  rationale: Mengulang secara konsisten cakupan janji kepada keturunan Abraham.
theological_decisions:
- issue: Bahasa perjanjian mengenai זֶרַע Abraham
  choice: keturunanmu
  alternative: benihmu; anak cucumu
  rationale: Bentuk Ibrani adalah tunggal kolektif dan dapat mencakup dimensi korporatif tanpa menentukan apakah acuannya harus dipahami hanya sebagai jamak atau sebagai seorang wakil tertentu. Teks utama memakai ungkapan Indonesia yang alami, sedangkan catatan kaki mempertahankan informasi bentuk sumber.
- issue: Rumusan relasi perjanjian
  choice: Aku akan menjadi Allah bagimu
  alternative: Aku akan menjadi Allahmu
  rationale: Pilihan ini lebih dekat dengan konstruksi Ibrani dan mempertahankan tekanan relasional dalam formula perjanjian tanpa menambahkan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina 'Aku' dan bentuk '-Ku' dikapitalisasi karena merujuk kepada Allah, sedangkan 'engkau' dipakai untuk sapaan tunggal kepada Abraham. Susunan kalimat mengikuti alur Ibrani tetapi memakai 'serta' dan 'turun-temurun' agar wajar dan mudah dipahami.
