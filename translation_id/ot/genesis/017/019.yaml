  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: id
  text: Lalu Allah berfirman, “Tidak, tetapi Sara, istrimu, akan melahirkan seorang anak laki-laki bagimu. Engkau akan menamainya Ishak.[a] Aku akan meneguhkan perjanjian-Ku dengannya sebagai perjanjian untuk selama-lamanya bagi keturunannya sesudah dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ishak terdengar seperti kata kerja Ibrani yang berarti “ia tertawa” atau “ia akan tertawa.”
    reason: Menjelaskan permainan bunyi pada nama יִצְחָק yang tidak tampak dalam bahasa Indonesia.
lexical_decisions:
- source_word: אֲבָל
  choice: Tidak, tetapi
  rationale: Dalam konteks ini Allah menanggapi permohonan Abraham sebelumnya mengenai Ismael. Ungkapan ini mempertahankan daya korektif sekaligus nuansa pertentangan dari kata Ibrani tersebut.
- source_word: יֹלֶדֶת לְךָ בֵּן
  choice: akan melahirkan seorang anak laki-laki bagimu
  rationale: Partisip Ibrani berfungsi sebagai prediksi dalam konteks janji ini. Bentuk futur dengan 'akan' alami dalam bahasa Indonesia, sedangkan 'bagimu' mempertahankan unsur relasional לְךָ.
- source_word: וְקָרָאתָ אֶת־שְׁמוֹ
  choice: Engkau harus menamainya
  rationale: Ungkapan ini menyampaikan formula pemberian nama sebagai perintah ilahi dengan bahasa Indonesia yang alami dan jelas.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Mengikuti bentuk nama baku dalam tradisi Alkitab bahasa Indonesia; permainan bunyinya dengan kata kerja Ibrani dijelaskan dalam catatan kaki.
- source_word: וַהֲקִמֹתִי
  choice: Aku akan meneguhkan
  rationale: Dalam konteks perjanjian, bentuk ini menyatakan tindakan Allah membuat perjanjian itu berdiri dan tetap berlaku. 'Meneguhkan' sesuai dengan kesinambungan perjanjian yang sudah dinyatakan kepada Abraham.
- source_word: בְּרִיתִי אִתּוֹ
  choice: perjanjian-Ku dengannya
  rationale: Mempertahankan relasi perjanjian langsung dengan Ishak tanpa mengubahnya menjadi sekadar manfaat bagi Ishak.
- source_word: לִבְרִית עוֹלָם
  choice: sebagai perjanjian untuk selama-lamanya
  rationale: Menyampaikan fungsi atau penetapan perjanjian tersebut serta sifatnya yang terus berlaku, tanpa memaksakan nuansa filosofis tambahan pada עוֹלָם.
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: bagi keturunannya sesudah dia
  rationale: '''Keturunan'' mempertahankan makna kolektif זֶרַע dan terdengar wajar dalam bahasa Indonesia modern; ''sesudah dia'' menjaga unsur kesinambungan antargenerasi.'
theological_decisions:
- issue: Cakupan dan kesinambungan janji perjanjian
  choice: Perjanjian dinyatakan diteguhkan dengan Ishak dan berlaku bagi keturunannya sesudah dia.
  alternative: Menafsirkan janji ini secara eksklusif sebagai janji etnis-nasional, atau langsung menjadikannya rumusan teologi perjanjian Kristen di kemudian hari.
  rationale: Teks Ibrani sendiri menyatakan relasi perjanjian dengan Ishak dan kesinambungannya bagi keturunannya. Terjemahan mempertahankan pernyataan itu tanpa mempersempit atau memperluas cakupan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dan akhiran '-Ku' dipakai sesuai register narasi ilahi yang lazim, sedangkan kalimat panjang Ibrani dibagi secara ringan agar mudah dipahami tanpa mengubah hubungan maknanya.
