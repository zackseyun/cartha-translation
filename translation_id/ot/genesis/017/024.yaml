  yaml_path: translation/ot/genesis/017/024.yaml
  text: And Abraham was ninety-nine years old when the flesh of his foreskin was circumcised.
translation:
  language: id
  text: Abraham berumur sembilan puluh sembilan tahun ketika daging kulupnya disunat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: Abraham
  rationale: Konjungsi ו melanjutkan alur narasi dan tidak perlu diterjemahkan secara eksplisit dalam bahasa Indonesia karena ayat ini wajar dibuka langsung dengan subjek.
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: berumur sembilan puluh sembilan tahun
  rationale: Ungkapan Ibrani harfiah 'anak sembilan puluh sembilan tahun' dialihkan ke idiom usia yang alami dalam bahasa Indonesia.
- source_word: בְּ/הִמֹּלוֹ
  choice: ketika ... disunat
  rationale: Preposisi ב dengan bentuk infinitif dan sufiks pronominal menyatakan keadaan temporal; bentuk pasif mempertahankan struktur maknanya secara alami.
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: daging kulupnya
  rationale: Terjemahan ini mempertahankan rujukan jasmani yang konkret dan susunan konstruksi Ibrani, tanpa menyederhanakannya menjadi hanya 'ia disunat'.
