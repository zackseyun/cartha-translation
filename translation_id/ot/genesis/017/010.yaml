base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: id
  text: 'Inilah perjanjian-Ku yang harus kamu pegang: perjanjian antara Aku dan kamu serta antara Aku dan keturunanmu sesudah engkau. Setiap laki-laki di antara kamu harus disunat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: Inilah perjanjian-Ku
  rationale: Konstruksi demonstratif dengan kopula tersirat diperjelas secara alami dengan “Inilah”; “perjanjian” mempertahankan istilah baku bagi בְּרִית dalam konteks hubungan yang Allah tetapkan.
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: yang harus kamu pegang
  rationale: Bentuk jamak Ibrani merujuk kepada Abraham beserta komunitas yang diwakilinya; bahasa Indonesia memakai “kamu” tanpa membedakan tunggal-jamak. “Memegang perjanjian” secara alami menyatakan menaati dan mempertahankan kewajiban perjanjian.
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: antara Aku dan kamu serta keturunanmu sesudah engkau
  rationale: “Keturunan” menerjemahkan זֶרַע sebagai nomina kolektif dan sesuai dengan kesinambungan antargenerasi. Pergeseran dari “kamu” jamak ke sufiks tunggal “-mu” pada Abraham tidak dapat ditampilkan sepenuhnya dalam pronomina Indonesia, sedangkan “engkau” menandai rujukan tunggal pada Abraham dalam frasa terakhir.
- source_word: הִמּוֹל לָכֶם כָּל זָכָר
  choice: setiap laki-laki di antara kamu harus disunat
  rationale: Infinitif absolut הִמּוֹל berfungsi sebagai ketetapan atau keharusan. Susunan pasif “harus disunat” wajar dalam bahasa Indonesia dan mempertahankan fokus pada “setiap laki-laki”; לָכֶם dinyatakan idiomatis sebagai “di antara kamu”.
theological_decisions:
- issue: Cakupan khusus laki-laki dalam tanda perjanjian
  choice: setiap laki-laki di antara kamu harus disunat
  alternative: kamu semua harus disunat
  rationale: Teks Ibrani secara eksplisit memakai כָּל זָכָר, “setiap laki-laki/jantan”; karena itu cakupannya tidak digeneralisasi kepada semua orang.
- issue: Makna tindakan menjaga perjanjian
  choice: yang harus kamu pegang
  alternative: yang harus kamu taati
  rationale: “Pegang” mempertahankan citra semantis שׁמר dalam ungkapan perjanjian sekaligus menyiratkan ketaatan, tanpa mempersempitnya hanya menjadi pelaksanaan satu perintah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi “Aku” dan sufiks “-Ku” dipakai untuk rujukan kepada Allah. “Kamu” dipertahankan karena dapat merujuk tunggal maupun jamak dalam bahasa Indonesia; “engkau” pada bagian akhir membantu menandai Abraham sebagai anteseden tunggal.
