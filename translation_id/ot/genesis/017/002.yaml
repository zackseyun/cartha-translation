  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: id
  text: Aku akan mengadakan perjanjian-Ku antara Aku dan engkau[a], dan Aku akan membuat engkau bertambah banyak, sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku akan memberikan/menempatkan perjanjian-Ku antara Aku dan engkau.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: Aku akan mengadakan
  rationale: Secara harfiah נתן berarti ‘memberikan/menempatkan’, tetapi bersama בְּרִית ungkapan ini menyatakan tindakan mengadakan atau menetapkan perjanjian. ‘Mengadakan’ alami dalam bahasa Indonesia dan tetap dekat dengan konteks pembuatan perjanjian.
- source_word: בְרִיתִי
  choice: perjanjian-Ku
  rationale: ‘Perjanjian’ mempertahankan bobot formal dan teologis בְּרִית, sedangkan sufiks orang pertama tunggal dinyatakan dengan ‘-Ku’.
- source_word: בֵּינִי וּבֵינֶךָ
  choice: antara Aku dan engkau
  rationale: Menerjemahkan kedua unsur relasional secara langsung. ‘Engkau’ cocok dengan sapaan tunggal dalam register Kitab Suci yang bermartabat.
- source_word: וְאַרְבֶּה
  choice: dan Aku akan membuat ... bertambah banyak
  rationale: Bentuk Hifil dari רבה menyatakan pertambahan secara kausatif. Rumusan ini lebih jelas dalam bahasa Indonesia daripada ‘melipatgandakan engkau’ dan tidak secara eksplisit mengganti objek tunggal dengan ‘keturunanmu’.
- source_word: אֹתְךָ
  choice: engkau
  rationale: Objeknya adalah orang kedua maskulin tunggal yang langsung menunjuk kepada Abram. Implikasi tentang keturunan tidak dimasukkan secara eksplisit ke dalam teks utama.
- source_word: בִּמְאֹד מְאֹד
  choice: sangat banyak
  rationale: Pengulangan מְאֹד memberi penegasan kuat. ‘Sangat banyak’ menyampaikan intensitas itu secara alami, sementara gagasan jumlah sudah hadir dalam ‘bertambah banyak’.
theological_decisions:
- issue: Ungkapan perjanjian dengan נתן + ברית
  choice: mengadakan perjanjian-Ku
  alternative: memberikan/menempatkan perjanjian-Ku
  rationale: ‘Mengadakan’ menyampaikan tindakan ilahi dalam membentuk atau menetapkan hubungan perjanjian tanpa menimbulkan kesan bahwa perjanjian sekadar benda yang dipindahkan. Alternatif yang lebih harfiah dicatat agar nuansa leksikal sumber tetap terlihat.
- issue: Cakupan janji dalam אֹתְךָ
  choice: engkau
  alternative: keturunanmu
  rationale: Bahasa Ibrani secara langsung menyapa Abram dalam bentuk tunggal. Walaupun konteksnya mencakup pertambahan melalui keturunan, terjemahan tidak mempersempit atau menjelaskan objek itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Aku’ dan ‘engkau’ mempertahankan sapaan tunggal serta wacana langsung ilahi; kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Susunan kalimat dijaga dekat dengan teks Ibrani tanpa menjadi kaku.
