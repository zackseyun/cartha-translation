base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: id
  text: Laki-laki yang tidak bersunat, yang tidak disunat pada daging kulit khatannya, orang itu harus diputuskan dari antara bangsanya.[a][b] Ia telah melanggar perjanjian-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwa itu harus diputuskan dari antara bangsanya.” Kata Ibrani yang dipakai dapat berarti “jiwa”, “nyawa”, atau “orang”.
    reason: lexical_alternative
  - marker: b
    text: “Diputuskan” adalah ungkapan sanksi perjanjian yang berat. Sesuai konteks, ungkapan ini dapat mencakup pengucilan dari umat atau kematian; ayat ini tidak menjelaskannya lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: Laki-laki yang tidak bersunat
  rationale: עָרֵל bersama זָכָר menunjuk kepada seorang laki-laki yang tidak bersunat. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penanda perjanjian.
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: yang tidak disunat
  rationale: Bentuk Niphal dari מול bersifat pasif atau refleksif; bentuk pasif Indonesia paling dekat dengan konstruksi Ibrani dan sesuai dengan ketentuan hukum umum.
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: pada daging kulit khatannya
  rationale: Terjemahan ini mempertahankan kekonkretan dan kekhususan anatomis frasa Ibrani, bukan sekadar mengulang bahwa ia tidak bersunat.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: orang itu harus dilenyapkan
  rationale: נפש di sini berarti pribadi atau orang yang dikenai sanksi perjanjian. 'Dilenyapkan' mempertahankan bobot idiom כרת tanpa menentukan secara sempit bentuk hukumannya.
- source_word: מֵעַמֶּיהָ
  choice: dari antara bangsanya
  rationale: עם menunjuk kepada kelompok umat atau bangsa yang bersangkutan. Akhiran feminin secara gramatikal merujuk kepada נפש, tetapi secara makna merujuk kepada laki-laki tersebut.
- source_word: אֶת בְּרִיתִי
  choice: perjanjian-Ku
  rationale: ברית adalah istilah utama untuk ikatan perjanjian dalam Kejadian 17; 'perjanjian' mempertahankan konsistensi dan bobot teologisnya.
- source_word: הֵפַר
  choice: Ia telah melanggar
  rationale: הפר dapat berarti merusak, melanggar, atau membatalkan suatu perjanjian. 'Melanggar' paling alami dalam bahasa Indonesia untuk tindakan terhadap perjanjian tanpa kehilangan daya hukumnya.
theological_decisions:
- issue: Makna sanksi perjanjian כרת ('dilenyapkan')
  choice: Mempertahankan ungkapan 'harus dilenyapkan dari antara bangsanya' tanpa menentukan lebih lanjut bentuk sanksinya.
  alternative: Dikucilkan dari umat perjanjian; dihukum mati.
  rationale: Ayat ini sendiri tidak menjelaskan apakah sanksi tersebut berupa pengucilan, kematian, atau bentuk penghakiman ilahi lainnya. Terjemahan mempertahankan ketegangan dan ketidakjelasan asli.
- issue: Penerjemahan נפש
  choice: orang
  alternative: jiwa
  rationale: Dalam konteks hukum perjanjian ini, נפש menunjuk kepada individu secara utuh, bukan secara khusus unsur nonjasmani manusia. 'Orang' menghindari masuknya antropologi teologis yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan gaya ketentuan hukum serta kekonkretan bahasa Ibrani, dengan istilah 'kulit khatan' yang tepat secara anatomis dan lazim dalam register Alkitab.
