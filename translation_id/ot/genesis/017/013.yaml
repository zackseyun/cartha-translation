revisions:
- from: Orang yang lahir di rumahmu dan orang yang dibeli dengan uangmu harus sungguh-sungguh disunat[a][b][c]. Dengan demikian, perjanjian-Ku akan ada dalam daging kalian sebagai perjanjian kekal.
  to: Orang yang lahir di rumahmu dan orang yang dibeli dengan uangmu haruslah disunat[a][b][c]. Dan perjanjian-Ku akan ada dalam daging kalian sebagai perjanjian kekal.
  rationale: Revisi ini mempertahankan seluruh makna leksikal dan teologis teks, sambil menghindari kesan bahwa sunat harus dilakukan “secara sungguh-sungguh” sebagai cara tindakan. Penggantian “Dengan demikian” dengan “Dan” juga menghindari penambahan relasi kausal yang terlalu tegas. Catatan a diperbaiki agar alternatifnya tetap menyatakan kewajiban.
