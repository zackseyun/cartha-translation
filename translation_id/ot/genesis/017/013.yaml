base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: id
  text: Orang yang lahir di rumahmu dan orang yang dibeli dengan uangmu haruslah disunat[a][b][c]. Dan perjanjian-Ku akan ada dalam daging kalian sebagai perjanjian kekal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus benar-benar disunat.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “yang lahir di rumah” dan “yang dibeli dengan uang” merujuk kepada anggota rumah tangga Abraham, termasuk mereka yang lahir di sana dan mereka yang diperoleh melalui pembelian.
    reason: cultural_note
  - marker: c
    text: 'Terjemahan lebih harfiah: “Yang lahir di rumahmu dan yang dibeli dengan uangmu.”'
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: harus sungguh-sungguh disunat
  rationale: Gabungan infinitif absolut dan verba finit dari מול memberi penegasan. Dalam konteks perintah ini, frasa tersebut menyampaikan baik keharusan maupun daya tekan bentuk Ibrani.
- source_word: יְלִיד בֵּיתְךָ
  choice: orang yang lahir di rumahmu
  rationale: Secara harfiah berarti orang yang lahir dalam rumah tangga. Terjemahan ini mempertahankan acuan pada anggota rumah tangga tanpa menambahkan status budak yang tidak dinyatakan langsung oleh frasa ini.
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: orang yang dibeli dengan uangmu
  rationale: Ungkapan ini menunjuk kepada seseorang yang diperoleh melalui pembelian. 'Uang' merupakan padanan Indonesia yang wajar untuk כֶּסֶף dalam konteks transaksi, meski arti dasarnya dapat berupa 'perak'.
- source_word: בְרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku bagi בְּרִית dengan sufiks orang pertama; istilah perjanjian dipertahankan secara eksplisit.
- source_word: בִּבְשַׂרְכֶם
  choice: dalam daging kalian
  rationale: Preposisi ב paling langsung diterjemahkan 'dalam'. Bentuk jamak 'kalian' mencerminkan sufiks orang kedua jamak dan menjaga hubungan jasmani yang dinyatakan teks.
- source_word: לִבְרִית עוֹלָם
  choice: sebagai perjanjian kekal
  rationale: Preposisi ל di sini menyatakan fungsi atau hasil, sedangkan עוֹלָם diterjemahkan 'kekal' sesuai ungkapan perjanjian dalam konteks.
theological_decisions:
- issue: Hubungan tanda sunat pada tubuh dengan perjanjian
  choice: Mempertahankan pernyataan langsung bahwa perjanjian Allah akan ada dalam daging mereka sebagai perjanjian kekal.
  alternative: Menjelaskan tanda jasmani itu hanya sebagai lambang, atau sebaliknya menyatakannya sebagai identik secara sakramental dengan keanggotaan perjanjian.
  rationale: Teks Ibrani menghubungkan perjanjian dan daging secara langsung tanpa menjabarkan sistem teologisnya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Hubungan sintaksis וְהָיְתָה dengan perintah sunat
  choice: Dengan demikian, perjanjian-Ku akan ada
  alternative: dan perjanjian-Ku akan ada
  rationale: Bentuk wayyiqtol/wəqatal setelah perintah dapat menyampaikan akibat atau kelanjutan. 'Dengan demikian' membuat kaitan hasilnya alami dalam bahasa Indonesia tanpa memperluas makna teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Rumah' dipertahankan untuk mencerminkan idiom Ibrani, sementara catatan menjelaskan arti rumah tangga. 'Daging kalian' sengaja mempertahankan bentuk jamak dan keterusterangan jasmani teks sumber.
