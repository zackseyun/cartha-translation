base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: id
  text: Kemudian mereka menggali sumur lain, dan mereka juga bertengkar mengenai sumur itu. Maka ia menamai sumur itu Sitna[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Sitna berkaitan dengan kata Ibrani yang berarti “permusuhan” atau “perlawanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: mereka menggali
  rationale: Bentuk Qal wayyiqtol jamak dari חפר menyatakan tindakan menggali dalam urutan narasi; “mereka menggali” merupakan padanan Indonesia yang langsung dan alami.
- source_word: בְּאֵר אַחֶרֶת
  choice: sumur lain
  rationale: בְּאֵר berarti “sumur,” sedangkan אַחֶרֶת berarti “lain” atau “yang lain”; frasa ini menunjukkan sumur berikutnya yang berbeda dari sumur sebelumnya.
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: mereka juga bertengkar mengenai sumur itu
  rationale: ריב mengungkapkan pertengkaran atau perselisihan. “Juga” mewakili גַּם, sedangkan “mengenai sumur itu” menyampaikan fungsi עַל dan memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: ia menamai sumur itu
  rationale: Ungkapan Ibrani harfiahnya adalah “ia menyebut namanya.” Dalam bahasa Indonesia, “ia menamai sumur itu” menyampaikan rumus penamaan dengan alami tanpa mengubah pelaku tunggal yang dinyatakan teks.
- source_word: שִׂטְנָה
  choice: Sitna
  rationale: Kata ini adalah nama sumur dan karena itu ditransliterasikan. Bentuk “Sitna” sesuai dengan ejaan Indonesia, sementara kaitannya dengan permusuhan atau perlawanan dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang jelas dan bermartabat. Kata ganti “ia” dipertahankan agar tidak menambahkan nama pelaku yang tidak disebut secara eksplisit dalam ayat ini.
