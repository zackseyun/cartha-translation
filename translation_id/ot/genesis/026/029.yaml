id: GEN.26.29
reference: Genesis 26:29
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם תַּעֲשֵׂ֨ה עִמָּ֜/נוּ רָעָ֗ה כַּ/אֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּ/ךָ וְ/כַ/אֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּ/ךָ֙ רַק ט֔וֹב וַ/נְּשַׁלֵּֽחֲ/ךָ֖ בְּ/שָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: id
  text: bahwa engkau tidak akan berbuat jahat kepada kami[a], sama seperti kami tidak menyentuhmu[b], dan sama seperti kami hanya berbuat baik kepadamu serta menyuruhmu pergi dengan damai[c]. Sekarang engkau diberkati Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “jika engkau berbuat jahat kepada kami.” Dalam rumusan sumpah, kata Ibrani yang berarti “jika” dapat memperkenalkan tindakan yang harus dihindari, sementara akibat kutuknya tidak diucapkan.
    reason: lexical_alternative
  - marker: b
    text: “Menyentuh” di sini juga dapat berarti “menyakiti” atau “mengganggu.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dengan selamat.” Kata Ibrani שָׁלוֹם dapat mencakup kedamaian maupun keselamatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: bahwa ... tidak akan
  rationale: Dalam konteks permintaan sumpah pada ayat sebelumnya, אִם berfungsi sebagai rumusan sumpah yang menyatakan larangan, bukan sekadar syarat biasa. Bentuk ini menyampaikan maksudnya secara wajar dalam bahasa Indonesia, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: engkau tidak akan berbuat jahat kepada kami
  rationale: Ungkapan עשה ... רעה berarti melakukan kejahatan atau mendatangkan celaka. 'Berbuat jahat kepada kami' mempertahankan unsur moral dan relasional dalam perjanjian untuk tidak saling menyerang.
- source_word: נְגַעֲנוּךָ
  choice: kami tidak menyentuhmu
  rationale: נגע secara dasar berarti 'menyentuh', tetapi dalam konteks ini dapat menyiratkan menyakiti atau mengganggu. Teks utama mempertahankan gambaran konkret Ibrani dan catatan kaki menjelaskan nuansanya.
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: kami hanya berbuat baik kepadamu
  rationale: רַק menegaskan bahwa, menurut pengakuan para pembicara, mereka berbuat 'hanya' yang baik. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanannya.
- source_word: וַנְּשַׁלֵּחֲךָ
  choice: serta menyuruhmu pergi
  rationale: שלח dalam konteks keberangkatan dapat berarti menyuruh atau mengutus pergi. 'Menyuruhmu pergi' mempertahankan kenyataan bahwa mereka meminta Ishak meninggalkan tempat itu, tanpa melunakkan pernyataan mereka menjadi sekadar 'membiarkan'.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: שָׁלוֹם di sini dapat menunjuk pada keberangkatan tanpa permusuhan sekaligus keadaan selamat. 'Dengan damai' mempertahankan nuansa hubungan perjanjian; alternatifnya dicatat.
- source_word: בְּרוּךְ יְהוָה
  choice: diberkati Yahweh
  rationale: בְּרוּךְ adalah bentuk partisip pasif, dan יְהוָה merupakan nama ilahi. Terjemahan ini menyatakan bahwa berkat itu berasal dari Yahweh tanpa mengganti nama tersebut dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Daya rumusan sumpah dengan אִם
  choice: bahwa engkau tidak akan berbuat jahat kepada kami
  alternative: jika engkau berbuat jahat kepada kami
  rationale: Dalam konteks sumpah, אִם dapat memperkenalkan hal yang dilarang dengan akibat kutuk yang tidak diucapkan. Teks utama menyampaikan fungsi pragmatisnya, sedangkan catatan kaki mempertahankan bentuk harfiah dan ketegangan rumusannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipakai agar sesuai dengan percakapan naratif Alkitab dan bentuk tunggal dalam sumber. Struktur paralel 'sama seperti ... dan sama seperti ...' dipertahankan secara cukup dekat, sementara 'serta' menghubungkan dua tindakan lampau dengan lancar.
