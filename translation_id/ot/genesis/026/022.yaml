base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: id
  text: Ia pindah dari sana dan menggali sumur yang lain. Mereka tidak bertengkar mengenai sumur itu. Maka ia menamainya Rehobot[a] dan berkata, “Sekarang Yahweh telah memberi kita ruang, dan kita akan berkembang biak di negeri itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Rehobot terdengar seperti kata Ibrani yang berarti “tempat-tempat lapang” atau “ruang yang luas”. Penjelasan Ishak memainkan makna itu: “Yahweh telah memberi kita ruang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: Ia pindah dari sana
  rationale: Kata kerja עתק dalam konteks ini menyatakan perpindahan Ishak dari tempat sebelumnya; 'pindah' alami dalam bahasa Indonesia tanpa menambahkan cara perpindahannya.
- source_word: בְּאֵר אַחֶרֶת
  choice: sumur yang lain
  rationale: Padanan langsung dan wajar untuk frasa yang menunjuk kepada satu sumur tambahan.
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: Mereka tidak bertengkar mengenai sumur itu
  rationale: ריב menyatakan pertengkaran atau perselisihan; penyebutan ulang 'sumur itu' memperjelas rujukan sufiks feminin Ibrani dalam bahasa Indonesia.
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: Maka ia menamainya Rehobot
  rationale: Rumus penamaan Ibrani disampaikan secara alami; nama tempat רְחֹבוֹת ditransliterasikan sebagai 'Rehobot'.
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: Sekarang Yahweh telah memberi kita ruang
  rationale: Bentuk kausatif רחב berarti menyediakan kelapangan atau ruang; ungkapan ini mempertahankan permainan kata dengan nama Rehobot.
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: dan kita akan beranak cucu di negeri ini
  rationale: פרה secara harfiah berkaitan dengan berbuah dan dalam konteks manusia menyatakan berkembang melalui keturunan. 'Beranak cucu' alami serta mempertahankan gema berkat dalam Kitab Kejadian; 'negeri ini' menunjukkan wilayah tempat Ishak berada.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna וּפָרִינוּ
  choice: kita akan beranak cucu
  alternative: kita akan berkembang atau kita akan berbuah
  rationale: Pilihan ini mempertahankan makna pertambahan keturunan dan gema bahasa berkat, tetapi tidak mempersempitnya menjadi kemakmuran material.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina 'ia' dipakai untuk narasi, sedangkan bentuk langsung 'kita' mempertahankan cakupan orang pertama jamak dari teks Ibrani.
