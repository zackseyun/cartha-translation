  to: Ia pindah dari sana dan menggali sumur yang lain. Mereka tidak bertengkar mengenai sumur itu. Maka ia menamainya Rehobot[a] dan berkata, “Sekarang Yahweh telah memberi kita ruang, dan kita akan berkembang biak di negeri itu.”
