base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/033.yaml
  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: id
  text: Ia menamai sumur itu Syibah[a]. Itulah sebabnya kota itu bernama Bersyeba sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Syibah terdengar seperti kata Ibrani untuk ‘tujuh’ dan berkaitan dengan permainan kata pada nama Bersyeba, yang dapat dipahami sebagai ‘Sumur Tujuh’ atau ‘Sumur Sumpah’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: Ia menamai sumur itu
  rationale: Dalam konteks pemberian nama, קרא dengan objek langsung berarti ‘menamai’. Acuan pronomina feminin diperjelas sebagai ‘sumur itu’ agar alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: שִׁבְעָה
  choice: Syibah
  rationale: Bentuk ini diperlakukan sebagai nama sumur dan ditransliterasikan. Permainan katanya dengan kata Ibrani untuk ‘tujuh’ dan kaitannya dengan ‘sumpah’ dijelaskan dalam catatan kaki, bukan diratakan dalam teks utama.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini secara alami menyatakan hubungan sebab-akibat antara penamaan sumur dan nama kota.
- source_word: שֵׁם הָעִיר בְּאֵר שֶׁבַע
  choice: kota itu bernama Bersyeba
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan fungsi frasa Ibrani yang menjelaskan nama kota.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan idiomatis dan baku bagi ungkapan waktu dalam narasi Ibrani.
