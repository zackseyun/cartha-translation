  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: id
  text: Terjadi kelaparan di negeri itu, selain kelaparan pertama yang terjadi pada zaman Abraham. Maka Ishak pergi kepada Abimelekh, raja orang Filistin, di Gerar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke Gerar.” Bentuk Ibrani Gerarah memakai akhiran penunjuk arah yang dapat secara eksplisit menandai gerakan menuju Gerar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב
  choice: Terjadi kelaparan
  rationale: Bentuk naratif וַיְהִי memperkenalkan keadaan baru. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak tersurat.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: אֶרֶץ menunjuk pada wilayah setempat dalam narasi, bukan seluruh bumi. Bentuk definit Ibrani dinyatakan secara alami dengan 'itu'.
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai bahwa kelaparan ini berbeda dari kelaparan terdahulu yang disebut sesudahnya.
- source_word: הָרָעָב הָרִאשׁוֹן
  choice: kelaparan pertama
  rationale: Mempertahankan nilai ordinal רִאשׁוֹן tanpa mengubahnya menjadi sekadar 'kelaparan terdahulu'.
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: yang terjadi pada zaman Abraham
  rationale: Mengidentifikasi kelaparan pertama dengan merujuk pada masa hidup Abraham dalam bahasa Indonesia yang wajar.
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: Maka Ishak pergi
  rationale: '''Maka'' meneruskan alur narasi dan menghubungkan tindakan Ishak dengan keadaan kelaparan tanpa menyatakan sebab secara terlalu tegas.'
- source_word: אֶל אֲבִימֶּלֶךְ
  choice: menemui Abimelekh
  rationale: Dalam konstruksi dengan verba 'pergi', אֶל menandai arah kepada seseorang. 'Pergi menemui' lebih alami daripada 'pergi kepada' dalam bahasa Indonesia modern.
- source_word: מֶלֶךְ פְּלִשְׁתִּים
  choice: raja orang Filistin
  rationale: Menyatakan hubungan konstruksi secara jelas sebagai raja atas kelompok etnis tersebut.
- source_word: גְּרָרָה
  choice: di Gerar
  rationale: Dalam susunan kalimat, bentuk ini secara alami dapat menyatakan lokasi Abimelekh, sementara akhiran arah pada bentuk Ibrani juga memungkinkan arti tujuan; alternatif itu dicatat dalam catatan kaki.
theological_decisions:
- issue: Sebutan historis-etnis פְּלִשְׁתִּים
  choice: orang Filistin
  alternative: bangsa Filistin
  rationale: Ini adalah sebutan etnis-politik biasa, bukan gelar teologis. 'Orang Filistin' jelas dan lazim dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum sambil mempertahankan urutan narasi, penyebutan kelaparan pertama, dan kemungkinan arah yang terkandung dalam גְּרָרָה.
