  text: Dari sana Ishak pergi ke Bersyeba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “naik ke Bersyeba”; ungkapan Ibrani ini dapat menyiratkan perjalanan menuju tempat yang lebih tinggi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: pergi ke
  rationale: Secara harfiah berarti ‘naik/pergi naik’. Dalam konteks perjalanan, verba ini dapat menyatakan perjalanan menuju tempat lain, mungkin juga mengisyaratkan kenaikan tempat. Ungkapan ‘pergi ke’ paling alami dalam bahasa Indonesia, sedangkan nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Frasa ini secara langsung menunjukkan keberangkatan dari lokasi sebelumnya dan alami dalam bahasa Indonesia modern.
- source_word: בְּאֵר שָׁבַע
  choice: Bersyeba
  rationale: Nama tempat ditransliterasikan dengan bentuk Indonesia yang lazim dipakai dalam tradisi penerjemahan Alkitab.
- source_word: וַיַּעַל (subjek tersirat)
  choice: Ishak
  rationale: Bahasa Ibrani hanya menyatakan ‘ia’, dengan subjek yang dipahami dari konteks sebelumnya. Penyebutan ‘Ishak’ memperjelas rujukan dalam bahasa Indonesia tanpa mengubah makna.
