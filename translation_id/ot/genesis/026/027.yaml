  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑/י וְ/אַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔/י וַ/תְּשַׁלְּח֖וּ/נִי מֵ/אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: id
  text: Ishak berkata kepada mereka[a], “Mengapa kalian datang kepadaku, padahal kalian membenci aku dan menyuruh aku pergi dari antara kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kalian membenci aku serta menyuruh aku pergi dari kalian.” Kata penghubung Ibrani secara lebih harfiah dapat diterjemahkan “dan”, tetapi di sini kemungkinan menyatakan pertentangan atau keadaan yang melatarbelakangi pertanyaan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif standar dari אמר; ujaran langsung berikutnya memang berupa pertanyaan, tetapi verba sumber tetap berarti ‘berkata’.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Menandai pihak yang disapa secara langsung dan alami dalam bahasa Indonesia.
- source_word: יִצְחָק
  choice: Ishak
  rationale: Mengikuti bentuk nama yang lazim dan mapan dalam bahasa Indonesia.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan interogatif sebab yang lugas dan alami.
- source_word: בָּאתֶם אֵלַי
  choice: kalian datang kepadaku
  rationale: Bahasa Indonesia tidak perlu membedakan kala perfektif seperti bahasa Inggris; konteks menunjukkan bahwa kedatangan itu baru terjadi.
- source_word: וְאַתֶּם
  choice: padahal kalian
  rationale: 'Konjungsi וְ di sini wajar dipahami secara adversatif atau sirkumstansial: kedatangan mereka berlawanan dengan sikap mereka sebelumnya.'
- source_word: שְׂנֵאתֶם אֹתִי
  choice: kalian membenci aku
  rationale: Mempertahankan kekuatan makna שנא dan tidak melunakkannya menjadi sekadar ‘bersikap tidak ramah’.
- source_word: וַתְּשַׁלְּחוּנִי
  choice: menyuruh aku pergi
  rationale: Menyampaikan tindakan mengirim atau menyuruh seseorang pergi tanpa memperkuatnya menjadi ‘mengusir’, yang tidak diwajibkan oleh verba itu sendiri.
- source_word: מֵאִתְּכֶם
  choice: dari tengah-tengah kalian
  rationale: Mempertahankan nuansa pemisahan dari lingkungan atau kebersamaan mereka, bukan hanya gerak menjauh secara umum.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. ‘Kalian’ dipakai karena semua bentuk orang kedua dalam ayat ini berbentuk jamak; ‘aku’ sesuai dengan tuturan langsung Ishak. Penanda catatan kaki [a] dicantumkan dalam teks utama.
