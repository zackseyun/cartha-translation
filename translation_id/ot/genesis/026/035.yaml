  yaml_path: translation/ot/genesis/026/035.yaml
  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: id
  text: Kedua perempuan itu menjadi kepahitan batin bagi Ishak dan Ribka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menjadi kepahitan roh bagi Ishak dan bagi Ribka.” Ungkapan Ibrani ini menyatakan kejengkelan atau dukacita batin yang mendalam.'
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: Kedua perempuan itu membuat
  rationale: Bentuk feminin jamak merujuk kepada kedua istri Esau dalam ayat sebelumnya. Dalam gabungan dengan ungkapan berikutnya, bahasa Indonesia alami menyatakan bahwa mereka menyebabkan kepahitan batin.
- source_word: מֹרַת רוּחַ
  choice: hati ... sangat getir
  rationale: Ungkapan Ibrani harfiah 'kepahitan roh' menyatakan kejengkelan atau dukacita batin yang mendalam. 'Hati sangat getir' mempertahankan citra kepahitan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: Ishak dan Ribka
  rationale: Preposisi ל menandai kedua orang yang terkena dampaknya; fungsi itu sudah tersampaikan secara alami sebagai objek dalam konstruksi 'membuat hati ...'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Rujukan feminin jamak diperjelas menjadi 'kedua perempuan itu' berdasarkan ayat sebelumnya; idiom Ibrani dipertahankan melalui citra 'getir' dengan penjelasan harfiah dalam catatan kaki.
