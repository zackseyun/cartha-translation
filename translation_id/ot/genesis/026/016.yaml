base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/016.yaml
  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: id
  text: Lalu Abimelekh berkata kepada Ishak, “Pergilah dari kami, karena engkau telah menjadi jauh lebih kuat daripada kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan gerak cerita secara alami dalam bahasa Indonesia modern.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia dengan mempertahankan bunyi konsonan akhir Ibrani.
- source_word: אֶל־יִצְחָק
  choice: kepada Ishak
  rationale: Preposisi אֶל memperkenalkan orang yang menjadi tujuan perkataan; “kepada” merupakan padanan Indonesia yang wajar.
- source_word: לֵךְ מֵעִמָּנוּ
  choice: Pergilah dari tengah-tengah kami
  rationale: Imperatif לֵךְ memerintahkan kepergian, sedangkan מֵעִמָּנוּ secara harfiah menunjuk pemisahan dari keberadaan bersama mereka. Ungkapan ini alami dan mempertahankan unsur “dari antara/bersama kami” tanpa sekadar mereduksinya menjadi “tinggalkan kami”.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan bagi perintah Abimelekh; “karena” jelas dan alami dalam bahasa Indonesia modern.
- source_word: עָצַמְתָּ
  choice: engkau telah menjadi ... lebih kuat
  rationale: Kata kerja עצם di sini menyatakan menjadi kuat atau perkasa. Bentuk perfektif diterjemahkan “telah menjadi,” dan konstruksi komparatif berikutnya paling alami diungkapkan dengan “lebih kuat.”
- source_word: מִמֶּנּוּ
  choice: daripada kami
  rationale: מן berfungsi secara komparatif sesudah עצם; sufiks orang pertama jamak merujuk kepada kelompok Abimelekh.
- source_word: מְאֹד
  choice: jauh
  rationale: Adverbia ini menguatkan perbandingan. Dalam bahasa Indonesia, “jauh lebih kuat” merupakan ungkapan alami untuk ‘much stronger’ dan menyampaikan intensitas מְאֹד.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai dalam dialog naratif untuk menjaga nada sastra tanpa menjadi kuno. Ambiguitas semantis עצם antara ‘kuat’ dan ‘perkasa’ dipertahankan pada arti umum ‘kuat’; konteks tidak dipersempit menjadi kekuatan militer atau politik.
