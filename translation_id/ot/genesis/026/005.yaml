  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: id
  text: karena Abraham mendengarkan suara-Ku dan memelihara kewajiban-Ku, perintah-perintah-Ku, ketetapan-ketetapan-Ku, dan hukum-hukum-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Atau “ajaran-ajaran-Ku” atau “petunjuk-petunjuk-Ku.” Kata Ibrani torah dapat berarti hukum, ajaran, atau petunjuk, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: karena
  rationale: Kata ini menyatakan alasan bagi berkat dalam konteks sekitarnya; “karena” alami dan tepat dalam bahasa Indonesia modern.
- source_word: שָׁמַע ... בְּקֹלִי
  choice: mendengarkan suara-Ku
  rationale: Ungkapan Ibrani ini menyiratkan mendengar dengan taat. Terjemahan ini mempertahankan gambaran suara sekaligus, dalam konteks, mengandung makna ketaatan.
- source_word: וַיִּשְׁמֹר
  choice: menaati
  rationale: Kata שׁמר dapat berarti menjaga, memelihara, atau menaati. Dengan objek berupa kewajiban dan ketentuan ilahi, “menaati” paling wajar dalam bahasa Indonesia.
- source_word: מִשְׁמַרְתִּי
  choice: apa yang Kuperintahkan kepadanya
  rationale: מִשְׁמֶרֶת menunjuk pada tanggung jawab atau kewajiban yang dipercayakan untuk dijalankan. Ungkapan ini lebih jelas bagi pembaca umum daripada “tugas penjagaan-Ku” dan tetap dibedakan dari istilah hukum yang menyusul.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: Padanan baku dan jelas bagi מִצְוָה dalam konteks kovenantal.
- source_word: חֻקּוֹתַי
  choice: ketetapan-ketetapan-Ku
  rationale: Padanan ini mempertahankan istilah hukum tersendiri dan membedakannya dari perintah serta hukum.
- source_word: וְתוֹרֹתָי
  choice: dan hukum-hukum-Ku
  rationale: Bentuk jamak תּוֹרֹת dalam rangkaian istilah legal paling wajar diterjemahkan “hukum-hukum”; cakupan makna “ajaran/petunjuk” dicatat dalam catatan kaki.
theological_decisions:
- issue: Rangkaian istilah hukum sebelum pemberian Taurat di Sinai
  choice: 'Mempertahankan semua unsur dalam rangkaian: kewajiban, perintah, ketetapan, dan hukum.'
  alternative: Meringkasnya menjadi “segala perintah dan hukum-Ku” atau memakai “petunjuk-petunjuk-Ku” untuk תּוֹרֹתָי.
  rationale: Teks Ibrani sengaja menumpuk beberapa istilah yang berdekatan maknanya untuk menegaskan keluasan ketaatan Abraham. Terjemahan tidak menyelesaikan ketegangan teologis mengenai hubungan istilah-istilah ini dengan Taurat di Sinai.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Bentuk jamak dipertahankan untuk mencerminkan rangkaian istilah Ibrani, sedangkan מִשְׁמַרְתִּי dijelaskan secara alami agar tidak menghasilkan frasa Indonesia yang kaku.
