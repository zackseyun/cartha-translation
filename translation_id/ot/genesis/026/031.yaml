  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: id
  text: Pagi-pagi sekali mereka bangun dan saling bersumpah; kemudian Ishak melepas mereka, dan mereka pergi meninggalkannya dengan damai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: Keesokan harinya, pagi-pagi sekali, mereka bangun
  rationale: Verba שׁכם bentuk Hifil menyatakan bangun atau bertindak pagi-pagi; בַבֹּקֶר menegaskan waktu pagi. 'Keesokan harinya' menyampaikan urutan naratif yang tersirat tanpa mengubah peristiwa.
- source_word: וַיִּשָּׁבְעוּ
  choice: bersumpah
  rationale: Bentuk Nifal dari שׁבע berarti bersumpah atau mengikat diri dengan sumpah. Dalam bahasa Indonesia, 'bersumpah' sudah mengandung gagasan mengucapkan sumpah.
- source_word: אִישׁ לְאָחִיו
  choice: saling
  rationale: Secara harfiah, 'seorang kepada saudaranya'; dalam konteks ini idiom tersebut menunjukkan tindakan timbal balik. 'Saling' menyampaikan makna itu secara alami tanpa menyiratkan bahwa mereka saudara kandung.
- source_word: וַיְשַׁלְּחֵם
  choice: melepas mereka
  rationale: Bentuk Piel dari שׁלח dengan akhiran objek berarti menyuruh pergi atau melepas. 'Melepas mereka' sesuai dengan konteks tuan rumah yang mengizinkan rombongan berangkat.
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: mereka pergi meninggalkannya
  rationale: הלך dengan מֵאֵת menunjukkan gerak menjauh dari seseorang. Ungkapan ini alami dalam bahasa Indonesia dan tetap menyatakan keberangkatan dari Ishak.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: שָׁלוֹם di sini mencakup keadaan damai dan keberangkatan tanpa permusuhan; 'dengan damai' mempertahankan nuansa relasional tersebut.
