  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Idiom Ibrani אִישׁ לְאָחִיו diterjemahkan menurut fungsinya sebagai tindakan timbal balik; tidak diperlukan catatan kaki karena terjemahan utama menyampaikan maksudnya secara langsung.
