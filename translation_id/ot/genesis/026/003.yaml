  terminology: “Pendatang,” “negeri,” “keturunan,” “memberkati,” dan “meneguhkan sumpah” sesuai register Alkitab bahasa Indonesia dan cukup setia pada istilah Ibrani. “Kuikrarkan” mempertahankan daya sumpah tanpa mengubahnya menjadi sekadar janji biasa.
