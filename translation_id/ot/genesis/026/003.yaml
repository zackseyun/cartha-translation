  to: Tinggallah sebagai pendatang di negeri ini[a]. Aku akan menyertaimu dan memberkatimu, sebab kepadamu dan kepada keturunanmu[b] akan Kuberikan semua negeri ini. Aku akan meneguhkan[c] sumpah yang telah Kuikrarkan kepada Abraham, ayahmu.
