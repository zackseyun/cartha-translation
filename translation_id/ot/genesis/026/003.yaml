language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: id
  text: Tinggallah sebagai pendatang di negeri ini[a]. Aku akan menyertaimu dan memberkatimu, sebab kepadamu dan kepada keturunanmu[b] akan Kuberikan semua negeri ini. Aku akan meneguhkan[c] sumpah yang telah Kuikrarkan kepada Abraham, ayahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Menetaplah sementara di negeri ini.” Kata Ibrani yang dipakai dapat berarti tinggal sebagai pendatang atau orang asing.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “benihmu”; istilah Ibrani ini dipakai secara kolektif untuk keturunan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “menetapkan” atau “menggenapi.” Kata Ibrani ini dapat menyatakan peneguhan atau pelaksanaan sumpah yang telah diikrarkan.
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: Tinggallah sebagai pendatang
  rationale: Kata kerja ini menunjuk pada tinggal sebagai pendatang atau orang asing, biasanya tanpa status kepemilikan tetap. Ungkapan ini mempertahankan nuansa tersebut sambil tetap wajar dalam bahasa Indonesia modern.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: di negeri ini
  rationale: Dalam konteks geografis dan janji tanah, אֶרֶץ paling tepat diterjemahkan 'negeri'; bentuk tunggal ini dibedakan secara alami dari bentuk jamak yang muncul kemudian.
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: Aku akan menyertai
  rationale: Ungkapan ini menyatakan kehadiran ilahi bersama Ishak. 'Menyertai' merupakan padanan Indonesia yang alami dan tetap mempertahankan daya relasionalnya.
- source_word: וַאֲבָרְכֶךָ
  choice: dan memberkatimu
  rationale: Bentuk verba melanjutkan rangkaian janji ilahi; subjek dan penanda waktu tidak perlu diulang dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan dasar bagi perintah dan janji sebelumnya. 'Sebab' mempertahankan hubungan penjelasannya.
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: kepadamu dan kepada keturunanmu
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi di sini berfungsi sebagai nomina kolektif bagi garis keturunan. 'Keturunan' alami dalam bahasa Indonesia dan tidak memaksakan jumlah tunggal atau jamak.
- source_word: אֶתֵּן
  choice: akan Kuberikan
  rationale: Menyampaikan janji masa depan dengan jelas; inversi ringan menonjolkan penerima janji tanpa mengubah makna.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: semua negeri ini
  rationale: Bentuk jamak menunjuk pada seluruh wilayah yang dimaksud. Dalam bahasa Indonesia, 'semua negeri ini' dapat menyatakan jamak secara alami dan mempertahankan hubungan leksikal dengan אֶרֶץ sebelumnya.
- source_word: וַהֲקִמֹתִי
  choice: Aku akan meneguhkan
  rationale: Bentuk Hifil dari קום dalam konteks sumpah berarti membuatnya tetap berlaku atau memastikan keberlakuannya. 'Meneguhkan' mempertahankan bobot perjanjian tanpa menyatakan secara berlebihan bahwa sumpah baru dibuat.
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: sumpah yang telah Kuucapkan
  rationale: Nomina dan verba Ibrani berasal dari akar yang sama. Bahasa Indonesia menghindari ungkapan janggal 'sumpah yang telah Kusumpahkan' dengan memakai 'Kuucapkan', sambil mempertahankan sifatnya sebagai sumpah.
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: kepada Abraham, ayahmu
  rationale: Menunjukkan penerima sumpah terdahulu dan hubungan Abraham dengan Ishak secara langsung.
theological_decisions:
- issue: Makna וַהֲקִמֹתִי dalam hubungan dengan sumpah kepada Abraham
  choice: Aku akan meneguhkan sumpah
  alternative: Aku akan menggenapi sumpah / Aku akan menetapkan sumpah
  rationale: '''Meneguhkan'' mencakup tindakan memastikan sumpah yang telah diucapkan tetap berlaku, tanpa memutuskan secara sempit apakah penekanannya pada konfirmasi atau penggenapan.'
- issue: Sifat kolektif זֶרַע
  choice: keturunanmu
  alternative: benihmu
  rationale: Dalam konteks langsung, istilah itu menunjuk kepada garis keturunan Ishak secara kolektif. Catatan kaki mempertahankan bentuk harfiahnya agar potensi keluasan maknanya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan kapital sesuai konvensi umum penerbitan Alkitab Indonesia. Struktur kalimat dipecah agar mudah dibaca, tanpa menghilangkan hubungan logis antarklausa.
