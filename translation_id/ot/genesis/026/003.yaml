  - severity: medium
    issue: “Yang telah Kuucapkan” terlalu umum bagi verba נִשְׁבַּעְתִּי.
    rationale: Verba tersebut berarti bersumpah. “Kuikrarkan” menyampaikan tindakan pengikraran yang bersifat sumpah dengan bahasa Indonesia yang alami, sedangkan “Kuucapkan” dapat merujuk pada ucapan biasa.
