base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: id
  text: Kemudian Ishak menggali kembali[a] sumur-sumur yang telah digali pada zaman Abraham, ayahnya, yang telah ditutup oleh orang Filistin setelah Abraham meninggal. Ia menamai sumur-sumur itu dengan nama-nama yang sama seperti yang dahulu diberikan ayahnya kepada sumur-sumur itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “Ishak kembali dan menggali.” Kata kerja Ibrani dapat secara eksplisit berarti “kembali”, tetapi dalam susunan ini kemungkinan besar menandai tindakan yang dilakukan lagi: “menggali kembali”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: menggali kembali
  rationale: Konstruksi dengan שׁוב diikuti verba lain menyatakan pengulangan atau dimulainya kembali tindakan. Ungkapan ini alami dalam bahasa Indonesia dan tidak memberi kesan keliru bahwa yang terutama dimaksud ialah perjalanan pulang.
- source_word: בְּאֵרֹת הַמַּיִם
  choice: sumur-sumur air
  rationale: Mempertahankan penekanan ungkapan Ibrani bahwa sumur-sumur tersebut merupakan sumber air, dengan bentuk yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: yang telah digali pada zaman Abraham, ayahnya
  rationale: Verba jamak memiliki pelaku yang tidak disebutkan; bentuk pasif Indonesia mempertahankan ketidakjelasan itu. 'Pada zaman' menyampaikan idiom temporal בִּימֵי secara wajar.
- source_word: וַיְסַתְּמוּם
  choice: telah ditutup
  rationale: סתם berarti menyumbat atau menutup. 'Ditutup' sesuai untuk sumur tanpa menambahkan bahan atau cara penutupannya.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku bahasa Indonesia untuk kelompok bangsa tersebut.
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: sesudah Abraham meninggal
  rationale: Ungkapan alami dalam bahasa Indonesia modern yang mempertahankan hubungan waktunya.
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת
  choice: Ia menamai sumur-sumur itu
  rationale: Menyampaikan tindakan memberi atau memanggil dengan nama secara ringkas dan idiomatis.
- source_word: כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: dengan nama-nama yang dahulu diberikan ayahnya kepada sumur-sumur tersebut
  rationale: Prefiks כ menyatakan kesesuaian dengan nama-nama sebelumnya. Rumusan ini mempertahankan rujukan eksplisit kepada nama yang diberikan sang ayah tanpa menambahkan penafsiran.
