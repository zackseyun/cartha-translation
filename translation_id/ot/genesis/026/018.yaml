  to: Kemudian Ishak menggali kembali[a] sumur-sumur yang telah digali pada zaman Abraham, ayahnya, yang telah ditutup oleh orang Filistin setelah Abraham meninggal. Ia menamai sumur-sumur itu dengan nama-nama yang sama seperti yang dahulu diberikan ayahnya kepada sumur-sumur itu.
