base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: id
  text: Lalu Abimelekh memanggil Ishak dan berkata, “Ternyata dia istrimu! Jadi, bagaimana mungkin kamu berkata, ‘Dia saudara perempuanku’?” Ishak menjawab, “Sebab aku berkata, ‘Jangan-jangan aku mati karena dia.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih tersurat dapat dipahami, “jangan-jangan aku mati oleh karena dia,” yaitu orang-orang mungkin membunuhku karena dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: memanggil Ishak
  rationale: Dalam konstruksi dengan לְ dan orang, קרא berarti memanggil atau menyuruh seseorang datang. “Memanggil” alami dan tetap dekat dengan bentuk naratif Ibrani.
- source_word: אַךְ הִנֵּה
  choice: Ternyata
  rationale: Gabungan partikel ini menegaskan kenyataan yang baru disadari Abimelekh. “Ternyata” menyampaikan penemuan dan penegasan itu secara alami tanpa mengubah pernyataan tersebut menjadi pertanyaan.
- source_word: אִשְׁתְּךָ הִוא
  choice: dia istrimu
  rationale: Terjemahan langsung dan wajar dari pernyataan bahwa perempuan itu adalah istri Ishak.
- source_word: וְאֵיךְ
  choice: Jadi, bagaimana mungkin
  rationale: Pertanyaan ini bernada teguran dan keheranan. “Jadi, bagaimana mungkin” menyampaikan hubungan logis serta ketidakpercayaan Abimelekh.
- source_word: אֲחֹתִי הִוא
  choice: Dia saudara perempuanku
  rationale: אחות secara langsung berarti saudara perempuan; konteks tidak menuntut perluasan menjadi kerabat perempuan.
- source_word: כִּי אָמַרְתִּי
  choice: Sebab aku berkata dalam hati
  rationale: כִּי memperkenalkan alasan Ishak. Penambahan idiom “dalam hati” menjelaskan bahwa perkataan ini mengungkapkan pertimbangannya, sebagaimana lazimnya penggunaan אמר dalam konteks seperti ini.
- source_word: פֶּן אָמוּת
  choice: Jangan-jangan aku mati
  rationale: פֶּן menyatakan kekhawatiran terhadap kemungkinan buruk. “Jangan-jangan” alami dalam bahasa Indonesia dan mempertahankan sifat hasil yang ditakuti, bukan kepastian.
- source_word: עָלֶיהָ
  choice: karena dia
  rationale: Dalam idiom ini, עַל menunjukkan sebab atau alasan. “Karena dia” ringkas dan mempertahankan keluasan ungkapan Ibrani, sementara konteks mengisyaratkan bahwa Ishak takut dibunuh untuk mendapatkan Ribka.
theological_decisions:
- issue: Cara kematian yang ditakuti Ishak
  choice: Teks utama mempertahankan ungkapan umum “aku mati karena dia.”
  alternative: “Orang-orang akan membunuhku untuk mendapatkan dia.”
  rationale: Bahasa Ibrani menyatakan akibat yang ditakuti dan penyebabnya, tetapi tidak secara eksplisit menyebut pelaku atau tujuan pembunuhan dalam ayat ini. Penjelasan kontekstual ditempatkan dalam catatan kaki agar ketegangan dan keluasan ungkapan sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan gaya naratif yang lugas dan bermartabat. “Ternyata” menghindari tumpukan partikel penegas yang kaku, sedangkan “jangan-jangan” menyampaikan kekhawatiran secara alami. Nama אֲבִימֶלֶךְ ditulis “Abimelekh” untuk mencerminkan konsonan akhir Ibrani.
