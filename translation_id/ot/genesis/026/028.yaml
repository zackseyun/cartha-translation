source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: id
  text: Lalu mereka berkata, “Kami telah melihat dengan jelas bahwa Yahweh telah menyertai engkau. Maka kami berkata, ‘Kiranya ada sumpah[a] di antara kita, antara kami dan engkau, dan marilah kita mengadakan perjanjian dengan engkau.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “sumpah” dapat juga berarti sumpah yang disertai kutuk terhadap pihak yang melanggarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “lalu” menyatakannya secara alami tanpa memberi penekanan waktu yang berlebihan.
- source_word: רָאוֹ רָאִינוּ
  choice: Kami sudah melihat dengan jelas
  rationale: Infinitif absolut yang diikuti verba finit menguatkan pernyataan; frasa ini menyampaikan penegasan tersebut dalam bahasa Indonesia yang wajar.
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: bahwa Yahweh menyertai engkau
  rationale: Bentuk perfektif הָיָה menunjuk pada keadaan yang telah terbukti dan masih relevan. “Menyertai” mengungkapkan kehadiran yang mendukung, sedangkan “engkau” mempertahankan sapaan tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַנֹּאמֶר
  choice: Karena itu, kami berkata
  rationale: Hubungan inferensial antara pengamatan mereka dan usulan berikutnya dibuat jelas secara alami.
- source_word: תְּהִי נָא
  choice: Kiranya ada
  rationale: Jusif dengan נָא menyatakan permohonan sopan; “kiranya” mempertahankan nuansa volitif dengan ragam yang bermartabat.
- source_word: אָלָה
  choice: sumpah
  rationale: Dalam konteks perjanjian, kata ini paling jelas diterjemahkan “sumpah,” sambil mencatat kemungkinan unsur kutuk dalam catatan kaki.
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: di antara kita, antara kami dan engkau
  rationale: Pengulangan formal dalam bahasa Ibrani dipertahankan sejauh masih dapat dipahami. “Kita” bersifat inklusif, lalu diperjelas sebagai “kami dan engkau.”
- source_word: וְנִכְרְתָה בְרִית
  choice: dan marilah kita mengadakan perjanjian
  rationale: Ungkapan harfiahnya “memotong perjanjian,” tetapi idiom Indonesia yang tepat adalah “mengadakan perjanjian.” Bentuk kohortatif diterjemahkan dengan “marilah kita.”
- source_word: עִמָּךְ
  choice: dengan engkau
  rationale: Frasa preposisional ini ditujukan kepada Ishak sebagai orang kedua tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi “Yahweh” mempertahankan fungsi itu tanpa menggantinya dengan gelar.
- issue: Nuansa אָלָה dalam konteks perjanjian
  choice: sumpah dalam teks utama, dengan kemungkinan unsur kutuk dijelaskan dalam catatan kaki
  alternative: sumpah kutuk
  rationale: Kata tersebut dapat menunjuk pada sumpah yang disertai kutuk bila dilanggar, tetapi konteks ini tidak menuntut agar unsur itu dinyatakan secara eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dan membedakannya dari “kita/kami.” Pengulangan formal teks Ibrani dipertahankan tanpa menjadikannya terlalu kaku.
