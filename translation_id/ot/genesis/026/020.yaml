  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: id
  text: Kemudian para gembala Gerar bertengkar dengan para gembala Ishak dan berkata, “Air ini milik kami.” Maka Ishak menamai sumur itu Esek[a], karena mereka telah berselisih dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Esek terdengar seperti kata Ibrani yang berarti “perselisihan” atau “sengketa.”
    reason: Menjelaskan permainan kata antara nama sumur עֵשֶׂק dan kata kerja serumpun dalam alasan penamaannya.
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: bertengkar
  rationale: Kata ריב menyatakan pertengkaran atau perselisihan. “Bertengkar” alami dalam bahasa Indonesia dan sesuai dengan konflik langsung mengenai kepemilikan air.
- source_word: רֹעֵי גְרָר
  choice: para gembala Gerar
  rationale: רֹעִים menunjuk kepada orang-orang yang menggembalakan kawanan ternak; “para gembala” merupakan padanan langsung dan lazim dalam konteks ini.
- source_word: עִם רֹעֵי יִצְחָק
  choice: dengan para gembala Ishak
  rationale: Mempertahankan kesejajaran dengan “para gembala Gerar” serta menyatakan hubungan mereka dengan Ishak secara alami.
- source_word: לֵאמֹר לָנוּ הַמָּיִם
  choice: dan berkata, “Air ini milik kami.”
  rationale: Ungkapan Ibrani harfiahnya ringkas, “bagi kami air itu,” dan menyampaikan klaim kepemilikan. “Air ini milik kami” jelas dan wajar dalam konteks perebutan sumur tertentu.
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: Maka Ishak menamai sumur itu
  rationale: Idiom Ibrani “memanggil nama sumur” diterjemahkan secara alami sebagai “menamai sumur itu.” Nama Ishak dinyatakan untuk memperjelas subjek tersirat tanpa mengubah makna.
- source_word: עֵשֶׂק
  choice: Esek
  rationale: Nama sumur ditransliterasikan, sementara kaitan bunyinya dengan gagasan perselisihan dijelaskan dalam catatan kaki.
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: karena mereka telah berselisih dengannya
  rationale: Bentuk kata ini berkerabat dengan nama עֵשֶׂק. “Berselisih” mempertahankan kaitan semantis tersebut, sedangkan “dengannya” menjaga rujukan tunggal kepada Ishak.
