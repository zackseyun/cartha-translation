base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/013.yaml
  text: And the man became great[a], and he continued to grow greater until he became very great.
translation:
  language: id
  text: Orang itu menjadi besar[a] dan terus bertambah besar sampai ia menjadi sangat besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertambah makmur.” Kata Ibrani dapat menunjuk pada pertumbuhan dalam kedudukan, kekuatan, atau kemakmuran; konteks ayat sebelumnya menonjolkan kekayaan Ishak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: menjadi besar
  rationale: Makna dasar גדל ialah menjadi besar atau bertumbuh dalam kedudukan, kekuatan, maupun kemakmuran. Pilihan ini mempertahankan pengulangan akar kata Ibrani dan tidak mempersempitnya menjadi kaya saja.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: האיש menunjuk secara khusus kepada Ishak. Dalam bahasa Indonesia, 'orang itu' alami dalam konteks naratif dan tetap merujuk kepada tokoh laki-laki yang sudah dikenal.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדֵל
  choice: terus bertambah besar
  rationale: Rangkaian verba hingga infinitif absolut dan partisip menyatakan tindakan progresif yang berkelanjutan. Ungkapan Indonesia ini menyampaikan peningkatan terus-menerus tanpa mempertahankan unsur 'berjalan' secara kaku dan menyesatkan.
- source_word: עַד כִּי
  choice: sampai
  rationale: Frasa ini menandai puncak proses peningkatan dan secara alami diterjemahkan 'sampai'.
- source_word: גָדַל מְאֹד
  choice: ia menjadi sangat besar
  rationale: Terjemahan ini mempertahankan pengulangan גדל serta intensifikasi מאוד, tanpa membatasi kebesaran itu hanya pada kekayaan materi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'besar' dipertahankan untuk mencerminkan retorika teks Ibrani, sementara idiom verbal Ibrani diungkapkan secara alami sebagai 'terus bertambah besar'.
