  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַ/יִּקְרָא֙ בְּ/שֵׁ֣ם יְהוָ֔ה וַ/יֶּט שָׁ֖ם אָהֳל֑/וֹ וַ/יִּכְרוּ שָׁ֥ם עַבְדֵי יִצְחָ֖ק בְּאֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: id
  text: Lalu ia membangun sebuah mazbah di sana dan memanggil nama Yahweh[a]. Ia mendirikan kemahnya di sana, dan hamba-hamba Ishak menggali sebuah sumur di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyerukan nama Yahweh.” Ungkapan Ibrani ini dapat berarti memanggil nama-Nya dalam doa atau memberitakan nama-Nya; konteks mazbah lebih mendukung makna pertama.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Padanan naratif yang lazim bagi בנה dan sesuai dengan objek 'mazbah'.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah Alkitab Indonesia yang mapan untuk bangunan tempat persembahan atau ibadah.
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: berseru kepada nama Yahweh
  rationale: Ungkapan ini paling wajar menunjuk pada pemanggilan atau doa kepada Yahweh dalam konteks pendirian mazbah, sambil tetap mengakui kemungkinan makna proklamasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֶּט ... אָהֳלוֹ
  choice: mendirikan kemahnya
  rationale: Padanan Indonesia yang alami bagi idiom memasang atau membentangkan kemah.
- source_word: וַיִּכְרוּ
  choice: menggali
  rationale: Padanan langsung dan lazim bagi tindakan menggali sumur.
- source_word: עַבְדֵי יִצְחָק
  choice: hamba-hamba Ishak
  rationale: עבד dapat berarti budak atau hamba; konteks ini menyoroti anggota rumah tangga yang bekerja, tanpa menentukan status mereka lebih jauh.
- source_word: בְּאֵר
  choice: sebuah sumur
  rationale: Padanan standar dalam kisah para leluhur; bentuk tak tentu dinyatakan secara alami dengan 'sebuah'.
- source_word: שָׁם
  choice: di sana
  rationale: Ketiga pengulangan dipertahankan untuk menjaga penekanan teks Ibrani pada lokasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: berseru kepada nama Yahweh
  alternative: menyerukan nama Yahweh
  rationale: Konteks pendirian mazbah lebih mendukung pemanggilan Yahweh dalam ibadah, tetapi kemungkinan arti proklamasi dicatat agar ambiguitas idiom Ibrani tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Urutan tindakan serta pengulangan 'di sana' dipertahankan. 'Mazbah' dipilih sebagai istilah Alkitab Indonesia yang ringkas dan mapan; 'hamba-hamba' tidak menetapkan status sosial lebih khusus daripada yang dituntut konteks.
