  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: id
  text: Ishak menabur benih di negeri itu, dan pada tahun itu ia memperoleh hasil seratus kali lipat[a]. Yahweh memberkatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia mendapati seratus שְׁעָרִים (se'arim).” Ungkapan Ibrani ini dapat juga diterjemahkan “seratus takaran” dan menunjuk pada hasil panen yang luar biasa melimpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: menabur benih
  rationale: Kata kerja זרע dalam konteks pertanian berarti menabur benih. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran pertanian.
- source_word: בָּאָרֶץ הַהִוא
  choice: di negeri itu
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. Dalam konteks tempat Ishak menetap dan bercocok tanam, 'negeri itu' jelas tanpa menyiratkan negara modern.
- source_word: וַיִּמְצָא
  choice: ia memperoleh hasil
  rationale: Makna dasar מצא ialah 'menemukan' atau 'mendapati', tetapi bersama ungkapan hasil panen di sini kata itu menunjuk pada hasil yang diperoleh. Pilihan ini alami sekaligus tidak mempersempitnya menjadi tindakan menuai.
- source_word: בַּשָּׁנָה הַהִוא
  choice: pada tahun itu
  rationale: Padanan langsung dan alami untuk keterangan waktu Ibrani tersebut.
- source_word: מֵאָה שְׁעָרִים
  choice: hasil seratus kali lipat
  rationale: Ungkapan Ibrani ini menggambarkan hasil panen yang luar biasa besar, lazim dipahami sebagai seratus kali jumlah benih yang ditabur. Catatan kaki mempertahankan ketidakpastian ungkapan harfiahnya.
- source_word: וַיְבָרֲכֵהוּ
  choice: memberkatinya
  rationale: ברך adalah kata kerja baku untuk 'memberkati'; pilihan ini mempertahankan pernyataan teologis bahwa kemakmuran Ishak berasal dari berkat ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan merupakan transliterasi ilmiah yang lazim.
- issue: Hubungan hasil panen Ishak dengan berkat ilahi
  choice: Hasil panen dinyatakan terlebih dahulu, lalu secara eksplisit dikaitkan dengan tindakan Yahweh yang memberkati Ishak.
  alternative: Menggabungkannya menjadi 'Yahweh membuat panennya berhasil seratus kali lipat'.
  rationale: Mempertahankan dua klausa sumber menghindari penyempitan berkat hanya menjadi keberhasilan material, sambil tetap membiarkan kaitan naratif keduanya terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Menabur benih' memperjelas tindakan pertanian; 'memperoleh hasil' mempertahankan nuansa kata dasar 'mendapati' tanpa menghasilkan ungkapan Indonesia yang janggal.
