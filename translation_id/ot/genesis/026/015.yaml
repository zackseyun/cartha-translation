  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: id
  text: Semua sumur yang telah digali oleh hamba-hamba[a] ayahnya pada zaman Abraham, ayahnya, disumbat oleh orang Filistin dan diisi dengan tanah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “hamba-hamba” juga dapat berarti “pelayan-pelayan” atau “budak-budak”; konteks ini tidak memastikan status mereka.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tanah” juga dapat berarti “debu” atau “tanah gembur”, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: Semua sumur
  rationale: כָל mempertahankan cakupan menyeluruh. Konjungsi וְ menghubungkan ayat ini dengan konteks sebelumnya, tetapi tidak perlu dinyatakan dengan kata pembuka tersendiri dalam bahasa Indonesia.
- source_word: אֲשֶׁר חָפְרוּ
  choice: yang telah digali
  rationale: Konstruksi relatif menerangkan sumur-sumur tersebut; 'telah digali' secara wajar menunjukkan bahwa penggalian mendahului tindakan orang Filistin.
- source_word: עַבְדֵי אָבִיו
  choice: hamba-hamba ayahnya
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau budak. 'Hamba-hamba' mempertahankan hubungan ketergantungan tanpa memastikan status perbudakan yang tidak ditonjolkan konteks.
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: pada zaman Abraham, ayahnya itu
  rationale: Ungkapan temporal harfiah 'pada hari-hari' secara idiomatis menjadi 'pada zaman'; keterangan 'ayahnya itu' mempertahankan pengulangan hubungan keluarga dalam bahasa Ibrani dan memperjelas bahwa Abraham adalah ayah yang dimaksud.
- source_word: סִתְּמוּם פְּלִשְׁתִּים
  choice: ditutup oleh orang Filistin
  rationale: סתם berarti menyumbat atau menutup. Bentuk pasif menghasilkan susunan Indonesia yang alami sesudah klausa relatif panjang sambil tetap menyebut pelakunya.
- source_word: וַיְמַלְאוּם עָפָר
  choice: dan ditimbun dengan tanah
  rationale: Secara konkret, sumur dibuat tidak dapat digunakan dengan memasukkan tanah ke dalamnya. 'Ditimbun dengan tanah' alami dalam bahasa Indonesia dan mempertahankan objek serta bahan pengisinya.
