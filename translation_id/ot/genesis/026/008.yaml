base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: id
  text: Ketika Ishak sudah lama tinggal di sana, Abimelekh, raja orang Filistin, memandang ke luar melalui jendela. Ia melihat, dan ternyata Ishak sedang bercanda mesra[a] dengan Ribka, istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini berkaitan dengan nama Ishak dan dapat berarti tertawa, bermain-main, bersenda gurau, atau bercumbu. Di sini perilaku itu memperlihatkan bahwa Ribka adalah istrinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: Setelah Ishak lama tinggal di sana
  rationale: Ungkapan Ibrani ini menyatakan bahwa waktu tinggalnya di sana telah berlangsung lama. Nama Ishak disebut agar rujukan pronomina jelas dan kalimat Indonesia tetap alami.
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: memandang ke luar melalui jendela
  rationale: Kata kerja tersebut menggambarkan tindakan memandang dari suatu tempat melalui atau ke luar jendela; terjemahan ini alami dalam bahasa Indonesia dan tidak menambahkan keterangan arah yang tidak pasti.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Ia melihat bahwa ternyata
  rationale: Kata 'ternyata' menyampaikan daya naratif הִנֵּה sebagai penanda penemuan atau kesadaran mendadak tanpa memakai seruan yang terasa kaku dalam bahasa Indonesia modern.
- source_word: מְצַחֵק
  choice: sedang bercanda mesra
  rationale: Bentuk partisipel dari צחק dapat menunjuk pada tertawa, bermain-main, atau perilaku intim. 'Bercanda mesra' mempertahankan unsur bermain atau tertawa sekaligus menjelaskan mengapa perilaku itu menyingkapkan hubungan mereka sebagai suami istri.
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: dengan Ribka, istrinya
  rationale: Walaupun אֵת biasanya menandai objek langsung, konstruksi dengan מְצַחֵק di sini paling alami diungkapkan memakai 'dengan'; aposisi 'istrinya' dipertahankan.
theological_decisions:
- issue: Tingkat keintiman tindakan Ishak terhadap Ribka
  choice: bercanda mesra
  alternative: bersenda gurau dengan; bercumbu dengan
  rationale: Teks mengharuskan perilaku yang dapat dikenali sebagai khas pasangan suami istri, tetapi kata Ibraninya sendiri tetap luas. Pilihan ini tidak mengecilkannya menjadi sekadar tertawa dan tidak pula mempersempitnya menjadi tindakan seksual tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat dipecah menjadi dua agar rangkaian narasi Ibrani tetap mudah dipahami. Nama 'Abimelekh' mencerminkan bentuk Ibrani אֲבִימֶלֶךְ; 'orang Filistin' dipakai secara idiomatis untuk bentuk jamak etnonim.
