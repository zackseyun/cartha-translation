  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: id
  text: Lalu Ishak mengadakan perjamuan bagi mereka[a], dan mereka makan dan minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jamuan”; istilah Ibrani ini dapat merujuk pada perjamuan dengan minum sebagai unsur yang menonjol.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: mengadakan
  rationale: Dengan objek מִשְׁתֶּה, verba עשה secara idiomatis menyatakan tindakan menyelenggarakan atau menyediakan perjamuan, bukan sekadar 'membuat'.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Preposisi ל menandai pihak yang menerima manfaat; 'bagi mereka' alami dan tepat dalam konteks ini.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: Kata ini menunjuk pada jamuan atau pesta makan-minum, dengan kegiatan minum sebagai unsur yang menonjol. 'Perjamuan' bernada wajar dan bermartabat, sementara unsur makan dan minum dinyatakan secara eksplisit sesudahnya.
- source_word: וַיֹּאכְלוּ
  choice: dan mereka makan
  rationale: Terjemahan langsung yang mempertahankan urutan tindakan dalam narasi Ibrani.
- source_word: וַיִּשְׁתּוּ
  choice: dan minum
  rationale: Terjemahan langsung; subjek tidak perlu diulang dalam bahasa Indonesia karena kedua verba terkoordinasi dengan jelas.
