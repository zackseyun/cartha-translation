translation_notes:
  register: Bahasa Indonesia baku yang alami dan bermartabat. Nama 'Ishak' dinyatakan untuk memperjelas rujukan pronomina orang ketiga dalam ayat yang berdiri sendiri, tanpa mengubah makna konteks.
