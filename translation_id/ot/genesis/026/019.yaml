  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: id
  text: Kemudian, hamba-hamba Ishak menggali di wadi[a] itu dan menemukan di sana sebuah sumur dengan air yang hidup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lembah” atau “alur sungai”; istilah Ibrani ini sering menunjuk kepada wadi, yaitu alur air yang biasanya hanya dialiri air pada musim tertentu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “air yang hidup,” yaitu air segar atau air yang mengalir dari mata air, bukan air yang tergenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: menggali
  rationale: Bentuk Qal wayyiqtol dari חפר menyatakan tindakan menggali dalam urutan narasi; “menggali” adalah padanan Indonesia yang langsung dan alami.
- source_word: עַבְדֵי יִצְחָק
  choice: hamba-hamba Ishak
  rationale: Frasa konstruksi ini menunjuk kepada orang-orang yang melayani Ishak. “Hamba-hamba” mempertahankan cakupan עבד tanpa memastikan status hukum mereka secara lebih khusus.
- source_word: בַּנָּחַל
  choice: di wadi itu
  rationale: נחל dalam konteks geografis ini kemungkinan menunjuk kepada alur air musiman. “Wadi” lebih tepat daripada sekadar “lembah,” sedangkan unsur definit pada bahasa Ibrani dipertahankan dengan “itu.”
- source_word: וַיִּמְצְאוּ שָׁם
  choice: dan menemukan
  rationale: Urutan naratif diterjemahkan secara alami. שָׁם tidak diungkapkan sebagai kata tersendiri karena lokasi penemuan sudah jelas melalui “di wadi itu,” sehingga pengulangan “di sana” terasa kaku dalam bahasa Indonesia.
- source_word: בְּאֵר
  choice: sebuah sumur
  rationale: בְּאֵר berarti sumur; frasa sesudahnya menjelaskan jenis air yang terdapat di dalamnya.
- source_word: מַיִם חַיִּים
  choice: air yang hidup
  rationale: Terjemahan dekat ini mempertahankan ungkapan khas Ibrani serta gaung alkitabiahnya; catatan kaki menjelaskan bahwa ungkapan itu menunjuk kepada air segar atau mengalir.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Istilah geografis “wadi” dipertahankan karena presisi maknanya, lalu dijelaskan dalam catatan kaki. Ungkapan “air yang hidup” dipertahankan untuk menjaga bentuk idiom Ibrani dan resonansi antarteks.
