base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: id
  text: Kemudian Ishak pergi dari sana, lalu berkemah di Lembah Gerar[a] dan menetap di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di wadi Gerar.” Istilah Ibrani ini dapat merujuk pada alur sungai musiman, jurang, atau lembah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: pergi dari sana
  rationale: Ungkapan ini menyatakan bahwa Ishak meninggalkan tempat sebelumnya. Pilihan ini alami dalam bahasa Indonesia dan tidak menambahkan motif yang tidak dinyatakan dalam ayat.
- source_word: וַיִּחַן
  choice: berkemah
  rationale: Kata חנה lazim berarti mendirikan atau menempati perkemahan. 'Berkemah' merupakan padanan modern, ringkas, dan jelas.
- source_word: בְּנַחַל גְּרָר
  choice: di Lembah Gerar
  rationale: נַחַל dapat menunjuk pada lembah, jurang, atau alur sungai musiman. 'Lembah Gerar' paling mudah dipahami sebagai nama geografis, sedangkan cakupan makna istilah Ibraninya dipertahankan dalam catatan kaki.
- source_word: וַיֵּשֶׁב
  choice: menetap
  rationale: ישב dapat berarti tinggal atau menetap. Sesudah 'berkemah', 'menetap' secara alami menyampaikan bahwa Ishak tinggal di lokasi itu tanpa menentukan berapa lama.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini merujuk kembali kepada Lembah Gerar dan diterjemahkan secara langsung.
