  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: id
  text: Kemudian Abimelekh pergi dari Gerar kepadanya bersama Ahuzat, sahabatnya,[a] dan Pikhol, panglima tentaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rekannya” atau “pendampingnya.” Istilah Ibrani ini dapat menunjuk seorang sahabat pribadi maupun rekan atau pendamping istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: Kemudian Abimelekh
  rationale: Waw naratif diterjemahkan secara idiomatis sebagai “Kemudian” untuk melanjutkan alur; nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: הָלַךְ אֵלָי/ו
  choice: datang kepadanya
  rationale: Secara leksikal berarti “pergi kepadanya”, tetapi dalam narasi Indonesia “datang kepadanya” wajar untuk gerak menuju tokoh yang sedang menjadi pusat adegan, tanpa mengubah tujuan geraknya.
- source_word: מִ/גְּרָר
  choice: dari Gerar
  rationale: Preposisi מִן menyatakan asal, sedangkan Gerar dipertahankan sebagai nama tempat.
- source_word: וַ/אֲחֻזַּת
  choice: bersama Ahuzat
  rationale: Waw di sini secara alami menyatakan orang yang menyertai Abimelekh; “bersama” memperjelas hubungan sintaksis itu dalam bahasa Indonesia.
- source_word: מֵֽרֵעֵ/הוּ
  choice: sahabatnya
  rationale: מֵרֵעַ dapat menunjuk sahabat, rekan, atau pendamping. “Sahabatnya” mempertahankan arti leksikal langsung tanpa menetapkan jabatan resmi yang tidak dinyatakan secara eksplisit.
- source_word: וּ/פִיכֹל
  choice: dan Pikhol
  rationale: Nama diri ditransliterasikan, dan waw diterjemahkan sebagai penghubung “dan”.
- source_word: שַׂר צְבָא/וֹ
  choice: panglima tentaranya
  rationale: שַׂר berarti pemimpin atau panglima, dan צָבָא dalam konteks ini adalah pasukan militer; frasa ini alami dan jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Pronomina Ibrani dipertahankan sebagai “kepadanya” karena rujukannya kepada Ishak jelas dari konteks. Ambiguitas peran Ahuzat tidak dipersempit menjadi “penasihat” dalam teks utama.
