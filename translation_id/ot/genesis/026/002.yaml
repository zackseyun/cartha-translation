  source_fidelity: 'Perlu revisi: אֲשֶׁר אֹמַר אֵלֶיךָ berarti ‘yang akan Kukatakan kepadamu’ (secara idiomatis juga dapat ‘yang akan Kuberitahukan kepadamu’), bukan ‘yang akan Kutunjukkan kepadamu’. Kata ‘menunjukkan’ menambahkan gagasan visual yang tidak ada dalam verba אמר (‘mengatakan’). Selebihnya, larangan ‘Jangan pergi ke Mesir’ merupakan padanan Indonesia yang wajar bagi ‘Jangan turun ke Mesir’, dengan nuansa arah tersedia dalam catatan kaki.'
  naturalness: Teksnya baku, modern, dan mengalir. ‘Menampakkan diri’, ‘berfirman’, dan ‘Tinggallah’ sesuai register naratif kitab suci tanpa terdengar kuno secara berlebihan.
  terminology: ‘Yahweh’ setia pada יהוה. ‘Berfirman’ tepat untuk ujaran ilahi dan tidak menambah klaim teologis. ‘Negeri’ dapat dipakai untuk הארץ dalam konteks wilayah; tidak perlu diubah.
