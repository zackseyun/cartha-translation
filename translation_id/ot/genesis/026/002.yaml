  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: id
  text: Lalu Yahweh menampakkan diri kepadanya dan berfirman, “Jangan pergi ke Mesir.[a] Tinggallah di negeri yang akan Kukatakan kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Jangan turun ke Mesir.”'
    reason: Mempertahankan nuansa arah dalam verba Ibrani תֵּרֵד (‘turun’), sementara ‘pergi ke Mesir’ merupakan padanan modern yang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה di sini menyatakan penampakan ilahi. ‘Menampakkan diri’ alami dalam bahasa Indonesia dan tidak menentukan cara penampakan itu terjadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks ucapan langsung Allah, ‘berfirman’ merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: Jangan pergi ke Mesir
  rationale: אַל dengan bentuk imperfek menyampaikan larangan. Secara harfiah תֵּרֵד berarti ‘turun’, tetapi dalam bahasa Indonesia modern ‘pergi ke Mesir’ lebih alami; nuansa arah dicatat dalam catatan kaki.
- source_word: שְׁכֹן
  choice: Tinggallah
  rationale: Imperatif dari שכן memerintahkan Ishak untuk tinggal atau menetap. ‘Tinggallah’ jelas, alami, dan tidak melebihkan gagasan menetap permanen.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: אֶרֶץ dalam konteks ini menunjuk wilayah atau negeri tempat Ishak harus tinggal, bukan bumi secara umum.
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: yang akan Kutunjukkan kepadamu
  rationale: Secara harfiah ungkapan ini berarti ‘yang akan Kukatakan kepadamu’. Dalam konteks pengarahan menuju suatu negeri, ‘Kutunjukkan’ menyampaikan fungsi ujaran itu secara alami tanpa menghilangkan acuan pada petunjuk yang akan diberikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. ‘Yahweh’ mempertahankan nama tersebut dan membedakannya dari gelar.
- issue: Cara penampakan ilahi
  choice: menampakkan diri
  alternative: kelihatan; menyatakan diri
  rationale: Terjemahan ini menegaskan bahwa Yahweh hadir dalam suatu penampakan, tetapi tidak berspekulasi tentang bentuk atau medianya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘Kutunjukkan’ mengikuti kaidah penulisan enklitik persona pada ujaran ilahi. Nama Yahweh dipertahankan sebagai nama diri.
