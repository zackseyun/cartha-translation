  revision_rationale: Revisi terbatas pada penghapusan demonstratif yang tidak ada dalam bahasa Ibrani dan pada perumusan ulang akibat אָשָׁם agar alami dalam bahasa Indonesia serta tetap menandakan tanggungan moral komunitas. Modalitas potensial/counterfaktual dalam “bisa saja” dan “akan membuat” tetap dipertahankan, demikian pula alternatif leksikal untuk כִּמְעַט dalam catatan kaki.
