source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: id
  text: Lalu Abimelekh berkata, “Apa yang telah kaulakukan terhadap kami? Salah seorang dari rakyat bisa saja dengan mudah[a] tidur dengan istrimu, dan engkau akan membuat kami menanggung kesalahan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Salah seorang dari rakyat nyaris tidur dengan istrimu.”
    reason: כִּמְעַט dapat dipahami sebagai penanda kejadian yang hampir berlangsung (“nyaris”) atau, dalam konteks ini, sebagai kemungkinan yang dengan mudah dapat terjadi.
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Apa yang telah kaulakukan terhadap kami?
  rationale: Mengungkapkan seruan teguran Ibrani secara alami sambil mempertahankan objek komunal ‘terhadap kami’.
- source_word: כִּמְעַט
  choice: bisa saja dengan mudah
  rationale: Dalam konteks ini menyatakan bahwa kejadian tersebut nyaris atau sangat mungkin terjadi. Pilihan ini mempertahankan unsur bahaya yang dekat tanpa memastikan bahwa tindakan itu benar-benar hampir dilakukan oleh orang tertentu; alternatif harfiah dicatat dalam catatan kaki.
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: tidur dengan istrimu
  rationale: Ungkapan Indonesia ini mempertahankan idiom hubungan seksual dalam bahasa sumber dengan bahasa yang alami, jelas dalam konteks, dan tidak kasar.
- source_word: אַחַד הָעָם
  choice: salah seorang dari rakyat ini
  rationale: Mempertahankan bentuk tunggal tak tentu dan nomina kolektif tanpa mempersempit הָעָם menjadi ‘laki-laki’, meskipun konteksnya menyiratkan pelaku laki-laki.
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: dan engkau akan mendatangkan kesalahan atas kami
  rationale: Menjaga gambaran tindakan yang mendatangkan tanggungan moral kepada komunitas, bukan sekadar celaan atau kerusakan nama baik.
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: Lalu Abimelekh berkata
  rationale: Menyajikan wayyiqtol naratif secara wajar dalam bahasa Indonesia modern sebagai kelanjutan peristiwa.
theological_decisions:
- issue: Makna אָשָׁם dalam konteks ini
  choice: kesalahan
  alternative: cela; pelanggaran
  rationale: Istilah ini menunjuk pada keadaan bersalah atau tanggungan moral yang akan menimpa komunitas akibat hubungan seksual yang tidak semestinya. ‘Kesalahan’ mempertahankan daya moral-religiusnya tanpa memasukkan terminologi korban penebus salah dari konteks lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Bentuk ‘kaulakukan’ dipakai sesuai ejaan baku; ‘tidur dengan’ mempertahankan ungkapan halus namun jelas untuk hubungan seksual.
