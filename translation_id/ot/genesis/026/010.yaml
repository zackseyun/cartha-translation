revisions:
- from: Lalu Abimelekh berkata, “Apa yang telah kaulakukan terhadap kami? Salah seorang dari rakyat ini bisa saja dengan mudah[a] tidur dengan istrimu, dan engkau akan mendatangkan kesalahan atas kami.”
  to: Lalu Abimelekh berkata, “Apa yang telah kaulakukan terhadap kami? Salah seorang dari rakyat bisa saja dengan mudah[a] tidur dengan istrimu, dan engkau akan membuat kami menanggung kesalahan.”
  rationale: Revisi terbatas pada penghapusan demonstratif yang tidak ada dalam bahasa Ibrani dan pada perumusan ulang akibat אָשָׁם agar alami dalam bahasa Indonesia serta tetap menandakan tanggungan moral komunitas. Modalitas potensial/counterfaktual dalam “bisa saja” dan “akan membuat” tetap dipertahankan, demikian pula alternatif leksikal untuk כִּמְעַט dalam catatan kaki.
