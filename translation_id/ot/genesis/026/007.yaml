revisions:
- from: Ketika laki-laki di tempat itu bertanya kepadanya tentang istrinya, ia berkata, “Dia saudariku.” Ia takut mengatakan, “Dia istriku,” karena berpikir, “Jangan-jangan laki-laki di tempat ini membunuh aku karena Ribka,”[a] sebab Ribka cantik rupanya.
  to: Ketika laki-laki di tempat itu bertanya tentang istrinya, ia berkata, “Dia saudariku,” sebab ia takut berkata, “Dia istriku,” jangan-jangan laki-laki di tempat itu membunuhnya karena Ribka, sebab Ribka cantik rupanya.
  rationale: Revisi menghapus tambahan interpretatif “karena berpikir” dan menyatakan פחד + פן secara langsung sebagai ketakutan Ishak akan akibat jika ia mengatakan bahwa Ribka adalah istrinya. Penggunaan “membunuhnya” mengikuti rujukan orang ketiga dalam narasi Indonesia, sementara tetap mempertahankan bahwa Ishaklah yang takut dibunuh. Catatan kaki dihapus karena alternatifnya tidak lagi diperlukan.
