base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: id
  text: Ketika laki-laki di tempat itu bertanya tentang istrinya, ia berkata, “Dia saudariku,” sebab ia takut berkata, “Dia istriku,” jangan-jangan laki-laki di tempat itu membunuhnya karena Ribka, sebab Ribka cantik rupanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ ... לְאִשְׁתּוֹ
  choice: bertanya kepadanya tentang istrinya
  rationale: Kata kerja שׁאל dengan ל di sini menyatakan pertanyaan mengenai sang istri. “Kepadanya” dibuat eksplisit sebagai sasaran pertanyaan yang tersirat agar kalimat Indonesia jelas dan alami.
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: laki-laki di tempat itu
  rationale: אַנְשֵׁי secara khusus merujuk kepada para laki-laki, bukan masyarakat setempat secara umum; ungkapan ini mempertahankan rujukan maskulin dengan bahasa Indonesia yang wajar.
- source_word: אֲחֹתִי הִוא
  choice: Dia saudariku
  rationale: Susunan predikatif Ibrani dialihkan ke urutan Indonesia yang alami. “Saudariku” mempertahankan jenis kelamin perempuan pada אֲחוֹת.
- source_word: כִּי יָרֵא לֵאמֹר
  choice: Ia takut mengatakan
  rationale: כִּי memberikan alasan bagi ucapan Ishak, sedangkan infinitif לֵאמֹר menyatakan hal yang takut ia katakan.
- source_word: פֶּן יַהַרְגֻנִי
  choice: Jangan-jangan ... membunuh aku
  rationale: פֶּן memperkenalkan akibat yang dikhawatirkan. “Jangan-jangan” secara alami mempertahankan nuansa kekhawatiran, sementara הרג diterjemahkan netral sebagai “membunuh,” tanpa menambahkan kategori hukum seperti “membunuh dengan sengaja.”
- source_word: עַל רִבְקָה
  choice: karena Ribka
  rationale: עַל menyatakan sebab atau alasan dalam konteks ini. Bentuk nama “Ribka” mengikuti pemakaian baku Alkitab bahasa Indonesia dan cukup dekat dengan רִבְקָה.
- source_word: טוֹבַת מַרְאֶה
  choice: cantik rupanya
  rationale: Ungkapan ini menyatakan bahwa penampilannya elok. “Cantik rupanya” ringkas, alami, dan mempertahankan fokus pada penampilan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Ucapan batin dibuat eksplisit dengan “karena berpikir” untuk menjelaskan peralihan alami dari narasi orang ketiga ke bentuk “aku” dalam teks Ibrani, tanpa mengubah isi ketakutan Ishak.
