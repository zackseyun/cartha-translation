  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: id
  text: Pada malam itu Yahweh menampakkan diri kepadanya dan berfirman, “Akulah Allah Abraham, ayahmu. Jangan takut, sebab Aku menyertaimu; Aku akan memberkatimu dan memperbanyak keturunanmu[a] oleh karena Abraham, hamba-Ku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”; kata Ibrani ini dipakai secara kolektif untuk keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֵּרָא אֵלָיו
  choice: menampakkan diri kepadanya
  rationale: Bentuk Niphal dari ראה dalam konteks ini menyatakan penampakan atau penyataan diri secara langsung; ungkapan ini alami dalam bahasa Indonesia.
- source_word: בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Menyampaikan keterangan waktu dan daya tunjuk הַהוּא secara jelas dan alami.
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: Akulah Allah Abraham, ayahmu
  rationale: Menjaga penekanan אָנֹכִי melalui bentuk 'Akulah' serta mempertahankan hubungan gramatikal bahwa Abraham adalah ayah/leluhur Ishak.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Padanan langsung, wajar, dan bermartabat bagi larangan yang sekaligus memberi penghiburan.
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: sebab Aku menyertai engkau
  rationale: כִּי memberikan alasan bagi larangan untuk takut. 'Menyertai' merupakan ungkapan Indonesia yang alami bagi kehadiran ilahi tanpa menambah gagasan di luar teks.
- source_word: וּבֵרַכְתִּיךָ
  choice: Aku akan memberkati engkau
  rationale: Dalam konteks janji, bentuk verba ini secara alami menyatakan tindakan yang akan dilakukan.
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: dan memperbanyak keturunanmu
  rationale: Hiphil רבה berarti membuat banyak atau memperbanyak, sedangkan זֶרַע di sini merupakan nomina kolektif yang menunjuk kepada keturunan.
- source_word: בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: demi Abraham, hamba-Ku
  rationale: '''Demi'' menyampaikan dasar benefaktif atau kausal dari בַּעֲבוּר dengan ringkas; ''hamba'' sesuai dengan kedudukan perjanjian Abraham dalam konteks ini.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan janji kepada Ishak dengan Abraham dalam בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: demi Abraham, hamba-Ku
  alternative: karena Abraham, hamba-Ku; oleh karena Abraham, hamba-Ku
  rationale: Terjemahan ini mempertahankan kaitan janji tersebut dengan Abraham tanpa merinci mekanisme teologis yang tidak dinyatakan oleh ayat.
- issue: Makna אָבִיךָ ketika Abraham disebut ayah Ishak
  choice: ayahmu
  alternative: leluhurmu
  rationale: Ishak adalah anak langsung Abraham, sehingga arti biasa 'ayahmu' tepat dan tidak memerlukan perluasan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang khidmat tetapi mudah dipahami. Pronomina ilahi memakai huruf kapital sesuai konvensi umum. Bentuk 'engkau' dipilih untuk sapaan tunggal dalam ujaran ilahi; 'berfirman' dipakai untuk tuturan Allah.
