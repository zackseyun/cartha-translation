base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: id
  text: Terjadilah pada hari itu[a] bahwa para hamba Ishak datang dan memberitahukan kepadanya tentang sumur yang telah mereka gali. Mereka berkata kepadanya, “Kami telah menemukan air.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “pada hari itu” juga dapat dipahami sebagai “pada hari yang sama,” yaitu hari terjadinya perjanjian yang diceritakan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan waktu ini menunjuk pada hari berlangsungnya peristiwa-peristiwa sebelumnya. Dalam bahasa Indonesia, formula וַיְהִי tidak perlu diterjemahkan secara terpisah karena urutan naratif sudah tersampaikan secara alami.
- source_word: עַבְדֵי יִצְחָק
  choice: para hamba Ishak
  rationale: עֶבֶד dapat berarti hamba, pelayan, atau budak. Dalam konteks ini mereka adalah pekerja rumah tangga Ishak; “hamba” mempertahankan keluasan istilah tanpa menonjolkan status sosial yang tidak menjadi fokus ayat.
- source_word: וַיַּגִּדוּ לוֹ
  choice: memberi tahu dia
  rationale: Bentuk Hifil dari נגד berarti menyampaikan atau melaporkan informasi; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַל אֹדוֹת הַבְּאֵר
  choice: tentang sumur
  rationale: עַל אֹדוֹת berarti “tentang” atau “mengenai”; “tentang” merupakan padanan langsung dan alami.
- source_word: אֲשֶׁר חָפָרוּ
  choice: yang telah mereka gali
  rationale: Kata “telah” memperjelas bahwa penggalian mendahului laporan, tanpa mengubah isi klausa relatif Ibrani.
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Mereka berkata kepadanya
  rationale: Mempertahankan pengantar ujaran eksplisit dalam teks Ibrani, tetapi memulai kalimat baru agar alurnya wajar dalam bahasa Indonesia.
- source_word: מָצָאנוּ מָיִם
  choice: Kami telah menemukan air
  rationale: Ungkapan ini mengumumkan hasil penemuan yang baru dan masih relevan; “telah menemukan” menyampaikan aspek hasil tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif Ibrani dipertahankan sejauh alami; pengulangan pengantar ujaran tetap hadir. Catatan tentang kemungkinan arti “budak” tidak ditambahkan karena tidak diperlukan untuk memahami ayat dan akan terlalu menonjolkan nuansa sosial yang tidak menjadi fokus konteks.
