  terminology: “Para hamba Ishak” merupakan pilihan yang dapat diterima untuk עַבְדֵי יִצְחָק dan tidak perlu diberi catatan yang menonjolkan kemungkinan “budak”. “Sumur,” “menggali,” dan “air” tepat.
