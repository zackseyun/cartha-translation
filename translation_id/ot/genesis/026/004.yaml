  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: id
  text: Aku akan membuat keturunanmu sebanyak bintang-bintang di langit, dan Aku akan memberikan semua negeri ini kepada keturunanmu. Di dalam keturunanmu, semua bangsa di bumi akan diberkati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di dalam keturunanmu, semua bangsa di bumi akan memberkati diri mereka sendiri.” Kata kerja Ibrani dapat dipahami secara refleksif, meskipun makna pasif cocok dengan konteks janji perjanjian ini.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: Aku akan membuat ... menjadi banyak
  rationale: Bentuk Hifil dari רבה menyatakan tindakan kausatif untuk memperbanyak; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan langsung Allah.
- source_word: זַרְעֲךָ
  choice: keturunanmu
  rationale: זֶרַע adalah nomina kolektif yang dapat menunjuk kepada garis keturunan. 'Keturunanmu' alami dalam bahasa Indonesia serta tidak memaksakan bentuk tunggal atau jamak.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: seperti bintang-bintang di langit
  rationale: Mempertahankan perbandingan eksplisit dengan כ dan menyampaikan ungkapan Ibrani secara alami dalam bahasa Indonesia modern.
- source_word: וְנָתַתִּי
  choice: dan Aku akan memberikan
  rationale: נתן secara langsung berarti 'memberikan'; pilihan ini mempertahankan bentuk janji ilahi.
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: seluruh negeri ini
  rationale: Bentuk jamak Ibrani menunjuk kepada kawasan-kawasan yang sedang dibicarakan. Dalam bahasa Indonesia, 'seluruh negeri ini' lebih alami daripada 'semua negeri ini' dan tetap mempertahankan penunjukan deiktis הָאֵל.
- source_word: וְהִתְבָּרֲכוּ
  choice: akan diberkati
  rationale: Makna pasif paling sesuai dengan konteks janji perjanjian, sementara kemungkinan refleksif tetap dicatat dalam catatan kaki.
- source_word: בְזַרְעֲךָ
  choice: melalui keturunanmu
  rationale: ב dapat menyatakan sarana atau perantaraan dalam rumusan berkat ini. 'Melalui' menyampaikan hubungan tersebut secara alami, tanpa menentukan apakah keturunan itu dipahami secara individual atau kolektif.
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: גּוֹיִם menunjuk kepada bangsa-bangsa atau kelompok-kelompok masyarakat; 'semua bangsa di bumi' adalah padanan baku dan jelas.
theological_decisions:
- issue: Makna rumusan וְהִתְבָּרֲכוּ בְזַרְעֲךָ
  choice: Melalui keturunanmu, semua bangsa di bumi akan diberkati
  alternative: Dengan keturunanmu, semua bangsa di bumi akan memberkati diri mereka sendiri
  rationale: Bentuk Hitpael dapat dipahami secara pasif atau refleksif. Bacaan pasif sesuai dengan konteks janji berkat, tetapi bacaan refleksif merupakan kemungkinan nyata dalam bahasa Ibrani dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Aku' menandai Allah sebagai pembicara. Struktur kalimat dibagi menjadi dua untuk keterbacaan tanpa mengubah urutan pokok janji.
