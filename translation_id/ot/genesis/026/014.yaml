  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: id
  text: Ia mempunyai kawanan kambing dan domba, kawanan sapi, dan banyak pekerja[a]. Orang-orang Filistin iri kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pelayanan/pekerjaan yang banyak”; frasa ini mungkin menunjuk kepada sejumlah besar pelayan atau pekerja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ia mempunyai
  rationale: Konstruksi eksistensial היה + ל menyatakan kepemilikan; “mempunyai” merupakan padanan Indonesia yang alami.
- source_word: מִקְנֵה צֹאן
  choice: kawanan kambing domba
  rationale: צֹאן mencakup ternak kecil, khususnya domba dan kambing; “kawanan kambing domba” mempertahankan cakupan itu dalam ungkapan Indonesia yang lazim.
- source_word: וּמִקְנֵה בָקָר
  choice: kawanan sapi
  rationale: בָקָר menunjuk ternak besar jenis lembu/sapi; bentuk kolektif diterjemahkan dengan “kawanan sapi”.
- source_word: וַעֲבֻדָּה רַבָּה
  choice: dan banyak pekerja
  rationale: Dalam konteks kekayaan berupa ternak, frasa ini kemungkinan besar menunjuk banyaknya orang yang melakukan pekerjaan atau pelayanan bagi Ishak. Catatan kaki mempertahankan bentuk harfiahnya dan ketidakpastian apakah yang ditekankan ialah tenaga kerja atau kegiatan kerja.
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: pun iri kepadanya
  rationale: קנא di sini menyatakan rasa iri yang diarahkan kepada Ishak karena kemakmurannya. “Pun” menghubungkan tanggapan orang Filistin dengan uraian sebelumnya tanpa menyatakan hubungan sebab-akibat secara lebih tegas daripada teks.
- source_word: פְּלִשְׁתִּים
  choice: orang-orang Filistin
  rationale: Ini adalah sebutan baku dalam bahasa Indonesia bagi kelompok bangsa tersebut.
