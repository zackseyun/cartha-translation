  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: id
  text: Ketika Esau berumur empat puluh tahun, ia memperistri Yudit, putri Beeri, orang Het, dan Basmat, putri Elon, orang Het.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah, “ia mengambil seorang istri: Yudit ... dan Basmat ...”. Teks Ibrani memakai bentuk tunggal “istri/perempuan” sebelum menyebut kedua perempuan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: Ketika Esau berumur empat puluh tahun
  rationale: Bentuk naratif וַיְהִי memperkenalkan latar waktu, sedangkan ungkapan harfiah 'anak empat puluh tahun' adalah idiom Ibrani untuk menyatakan umur. Terjemahan ini alami dalam bahasa Indonesia modern.
- source_word: וַיִּקַּח אִשָּׁה
  choice: ia mengambil sebagai istri
  rationale: Kata kerja לקח dengan אִשָּׁה dalam konteks ini menyatakan tindakan mengambil perempuan dalam perkawinan. Rumusan ini mempertahankan citra leksikal teks tanpa menjadi sekadar 'mengambil perempuan'.
- source_word: יְהוּדִית
  choice: Yudit
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בַּת
  choice: anak
  rationale: Dalam identifikasi silsilah ini, בַּת berarti 'anak perempuan'. Bahasa Indonesia lazim memakai 'anak' karena jenis kelamin sudah jelas dari nama dan konteks.
- source_word: בְּאֵרִי
  choice: Beeri
  rationale: Transliterasi nama pribadi yang mempertahankan bentuk sumber dan sesuai dengan kelaziman Indonesia.
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Gentilik dengan artikel ini mengidentifikasi Beeri dan Elon sebagai anggota bangsa Het; 'orang Het' merupakan ungkapan Indonesia yang alami.
- source_word: בָּשְׂמַת
  choice: Basmat
  rationale: Transliterasi ringkas nama pribadi berdasarkan bentuk Ibrani בָּשְׂמַת dan kelaziman Alkitab bahasa Indonesia.
- source_word: אֵילֹן
  choice: Elon
  rationale: Nama pribadi ditransliterasikan sebagai 'Elon', bentuk yang jelas dan lazim dalam bahasa Indonesia.
