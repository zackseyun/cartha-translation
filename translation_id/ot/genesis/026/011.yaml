  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: id
  text: Kemudian Abimelekh memerintahkan seluruh rakyat dengan berkata, “Siapa pun yang menyentuh orang ini atau istrinya pasti dihukum mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Bentuk piel dari צוה menyatakan pemberian perintah yang berwenang; 'memerintahkan' mempertahankan daya tersebut dalam bahasa Indonesia modern.
- source_word: כָּל הָעָם
  choice: seluruh rakyatnya
  rationale: עם di sini menunjuk kepada seluruh rakyat yang berada di bawah kekuasaan Abimelekh. Sufiks '-nya' memperjelas hubungan kontekstual tanpa mengubah cakupan frasa Ibrani.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif kutipan ini memperkenalkan isi perintah; 'katanya' merupakan ungkapan naratif yang alami dan ringkas.
- source_word: הַנֹּגֵעַ
  choice: siapa pun yang menyentuh
  rationale: Partisipel berartikel berfungsi secara umum, yakni 'orang yang menyentuh' atau 'siapa pun yang menyentuh'. 'Menyentuh' mempertahankan arti leksikal tanpa memperkuatnya menjadi tindakan menyerang.
- source_word: בָּאִישׁ הַזֶּה
  choice: orang ini
  rationale: Preposisi ב menandai objek verba נגע. Dalam bahasa Indonesia, objek langsung sesudah 'menyentuh' tidak memerlukan preposisi.
- source_word: וּבְאִשְׁתּוֹ
  choice: atau istrinya
  rationale: 'Dalam larangan yang berlaku distributif, waw secara idiomatis dinyatakan dengan ''atau'': baik orang itu maupun istrinya tidak boleh disentuh. אשה dengan sufiks di konteks ini berarti ''istrinya''.'
- source_word: מוֹת יוּמָת
  choice: pasti dihukum mati
  rationale: Infinitif absolut yang disertai bentuk hofal/imperfect menguatkan kepastian hukuman. Bentuk pasif 'dihukum mati' mempertahankan makna bahwa kematian itu dijatuhkan sebagai sanksi, bukan sekadar bahwa pelanggar akan mati.
