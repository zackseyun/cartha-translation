  language: id
  text: Jadi, seluruh umur Enos adalah sembilan ratus lima tahun, lalu ia meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: seluruh umur ... adalah
  rationale: Ungkapan genealogis ini menyatakan jumlah keseluruhan masa hidup. Terjemahan ini alami dalam bahasa Indonesia sekaligus mempertahankan cakupan כָּל.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: Bentuk nama 'Enos' mengikuti ejaan baku yang sudah dikenal luas dalam Alkitab bahasa Indonesia, sambil tetap merujuk pada nama Ibrani אֱנוֹשׁ.
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: sembilan ratus lima tahun
  rationale: Susunan bilangan Ibrani secara harfiah menempatkan lima sebelum sembilan ratus; urutannya disesuaikan dengan idiom bahasa Indonesia tanpa mengubah jumlah 905.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: Wayyiqtol penutup melanjutkan urutan narasi. 'Lalu' menyampaikan kesinambungan tersebut, dan 'meninggal' merupakan ungkapan Indonesia yang wajar dan bermartabat.
