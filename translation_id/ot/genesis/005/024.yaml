  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: id
  text: Henokh berjalan bersama Allah, dan ia tidak ada lagi[a], karena Allah mengambilnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan ia tidak ada.” Ungkapan Ibrani ini menunjukkan bahwa Henokh tidak lagi hadir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: berjalan
  rationale: Bentuk hitpael dari הלך menggambarkan tindakan atau pola hidup yang berkelanjutan. “Berjalan” mempertahankan kiasan Ibrani tanpa membatasinya pada gerak jasmani.
- source_word: אֶת הָאֱלֹהִים
  choice: bersama Allah
  rationale: Dengan kata kerja הלך, אֶת menyatakan penyertaan. “Bersama Allah” menyampaikan makna relasionalnya secara alami dalam bahasa Indonesia.
- source_word: וְאֵינֶנּוּ
  choice: dan ia tidak ada lagi
  rationale: Ungkapan ini secara harfiah berarti “dan ia tidak ada,” yakni Henokh tidak lagi hadir. Pilihan ini mempertahankan ketegasan sekaligus kehematan teks tanpa menjelaskan cara kepergiannya.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memperkenalkan alasan mengapa Henokh tidak ada lagi.
- source_word: לָקַח אֹתוֹ
  choice: mengambilnya
  rationale: לקח pada dasarnya berarti “mengambil.” Terjemahan ini tidak menambahkan tujuan atau cara pengambilan yang tidak dinyatakan oleh ayat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, אֱלֹהִים merujuk kepada Allah yang esa.
theological_decisions:
- issue: Apakah perlu dinyatakan secara eksplisit bahwa Henokh tidak mati atau diangkat ke surga
  choice: 'Mempertahankan rumusan ringkas: “ia tidak ada lagi, karena Allah mengambilnya.”'
  alternative: “Ia tidak mati”; “Allah mengangkatnya ke surga”; atau “Allah memindahkannya.”
  rationale: Ayat ini menyiratkan tindakan ilahi yang luar biasa, tetapi teks Ibrani sendiri tidak menyebut surga dan tidak secara eksplisit berkata bahwa Henokh tidak mati. Rumusan yang tertahan menjaga ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berjalan bersama Allah” mempertahankan kiasan sumber sambil tetap mudah dipahami; tanda catatan kaki ditempatkan langsung sesudah ungkapan yang diterangkannya.
