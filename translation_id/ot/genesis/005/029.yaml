  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: id
  text: Ia menamai anak itu Nuh[a], katanya, “Anak ini akan memberi kita kelegaan dari pekerjaan kita dan dari jerih payah tangan kita, yang berasal dari tanah yang telah dikutuk Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menghibur kita.” Dalam bahasa Ibrani, kata ini membentuk permainan bunyi dengan nama Nuh, yang juga dikaitkan dengan gagasan “istirahat” atau “kelegaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: Ia menamai anak itu
  rationale: Dalam konteks pemberian nama, konstruksi ini secara alami berarti ‘menamai’; ‘anak itu’ memperjelas objek tanpa mengubah maksud.
- source_word: נֹחַ
  choice: Nuh
  rationale: Mengikuti bentuk nama yang baku dalam Alkitab berbahasa Indonesia.
- source_word: זֶה
  choice: Anak ini
  rationale: Mempertahankan daya tunjuk demonstratif sambil menjadikan rujukannya wajar dan jelas dalam bahasa Indonesia.
- source_word: יְנַחֲמֵנוּ
  choice: akan menghibur kita
  rationale: Menerjemahkan makna lazim akar נחם, yaitu menghibur atau memberi penghiburan, dan mempertahankan permainan bunyi dengan nama Nuh melalui catatan kaki.
- source_word: מִמַּעֲשֵׂנוּ וּמֵעִצְּבוֹן יָדֵינוּ
  choice: dalam pekerjaan kita dan dalam jerih payah tangan kita
  rationale: Preposisi מן di sini dapat menyatakan keadaan yang darinya penghiburan atau kelegaan diperoleh; ‘jerih payah’ menyampaikan unsur kesusahan dalam עִצָּבוֹן dan menggemakan Kejadian 3.
- source_word: מִן־הָאֲדָמָה
  choice: karena tanah
  rationale: 'Dalam rangkaian ini מן dapat dipahami secara kausal: jerih payah itu timbul karena tanah yang dikutuk. Pilihan ini menghindari ungkapan Indonesia yang kabur seolah-olah penghiburan datang ‘dari tanah’.'
- source_word: אֲשֶׁר אֵרְרָהּ יְהוָה
  choice: yang telah dikutuk Yahweh
  rationale: Mempertahankan klausa relatif dan nama ilahi sebagai Yahweh; bentuk perfektum diterjemahkan sebagai tindakan lampau yang hasilnya masih berlaku.
theological_decisions:
- issue: Permainan kata antara nama נֹחַ dan verba יְנַחֲמֵנוּ
  choice: Teks utama memakai ‘akan menghibur kita’, dengan hubungan bunyi dan gagasan istirahat/kelegaan dijelaskan dalam catatan kaki.
  alternative: akan memberi kita kelegaan; akan memberi kita istirahat
  rationale: Verba tersebut berasal dari נחם, bukan dari akar nama נֹחַ secara ketat. Karena itu terjemahan utama mengikuti arti leksikal ‘menghibur’, sedangkan catatan mempertahankan permainan nama yang disengaja tanpa menyamakannya dengan etimologi formal.
- issue: Hubungan frasa מִן־הָאֲדָמָה dengan jerih payah
  choice: Diterjemahkan secara kausal sebagai ‘karena tanah’.
  alternative: dari tanah; yang berasal dari tanah
  rationale: Bahasa Ibrani memungkinkan keterkaitan frasa ini dengan pekerjaan dan jerih payah yang disebabkan oleh tanah terkutuk. Terjemahan kausal paling alami dalam bahasa Indonesia, tetapi tidak menambahkan klaim teologis di luar konteks kutuk Kejadian 3.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Jerih payah tangan kita’ mempertahankan gambaran konkret Ibrani, sedangkan susunan kalimat disesuaikan agar alami bagi pembaca umum.
