  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah memperanakkan Nuh, Lamekh hidup 595 tahun lagi, dan ia memperanakkan anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Dalam rumus silsilah Kejadian 5, verba חיה menyatakan lamanya kehidupan setelah peristiwa yang disebutkan; “hidup” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Preposisi ini menandai waktu sesudah kelahiran Nuh.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk Hifil ילד dengan subjek laki-laki dalam silsilah berarti menjadi ayah atau menghasilkan keturunan. “Memperanakkan” mempertahankan nuansa paternal dan sesuai dengan gaya silsilah yang bermartabat.
- source_word: נֹחַ
  choice: Nuh
  rationale: Mengikuti bentuk nama yang lazim dan baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 595 tahun
  rationale: Bahasa Ibrani menyatakan 95 + 500 tahun; urutannya dinaturalkan menjadi 595 sesuai kebiasaan bahasa Indonesia tanpa mengubah jumlah.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Menggunakan padanan yang sama dengan kemunculan sebelumnya untuk menjaga konsistensi leksikal dan nuansa paternal.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Teks Ibrani menyebut kedua jenis keturunan secara eksplisit; terjemahan ini tidak meratakannya menjadi sekadar “anak-anak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan keterangan waktu ditempatkan di awal, dan “lagi” memperjelas bahwa 595 tahun itu merupakan masa hidup Lamekh sesudah memperanakkan Nuh. Angka ditulis dengan numeralia agar silsilah mudah dibaca.
