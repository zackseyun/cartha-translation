base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah Lamekh, Metusalah hidup 782 tahun lagi dan menjadi ayah bagi anak-anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah, bentuk ini menyatakan lamanya Metusalah tetap hidup sesudah kelahiran anak yang disebutkan; kata 'lagi' membuat hubungan waktunya alami dalam bahasa Indonesia.
- source_word: מְתוּשֶׁלַח
  choice: Metusalah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Kata depan temporal ini menandai masa sesudah Lamekh diperanakkan.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dengan subjek laki-laki menyatakan bahwa Metusalah menjadi ayah Lamekh; 'memperanakkan' mempertahankan nuansa kausatif dan sesuai dengan ragam silsilah.
- source_word: אֶת לֶמֶךְ
  choice: Lamekh
  rationale: Penanda objek langsung tidak diterjemahkan; nama tersebut dialihaksarakan sebagai 'Lamekh' agar mencerminkan konsonan akhir Ibrani.
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 782 tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah dua dan delapan puluh, lalu tujuh ratus; angka 782 menyampaikan jumlah yang sama secara wajar dan jelas.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Pengulangan verba ילד dipertahankan secara konsisten dengan bentuk sebelumnya dalam rumus silsilah.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Ungkapan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan, bukan menggeneralisasikannya menjadi 'anak-anak' saja.
