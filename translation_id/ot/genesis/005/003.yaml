  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: id
  text: Ketika Adam berumur seratus tiga puluh tahun, ia memperanakkan seorang anak laki-laki yang serupa dengan dirinya, menurut gambarnya[a], lalu menamainya Set.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “serupa dengan dirinya, menurut gambarnya” menggemakan Kejadian 1:26–27.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: Ketika Adam berumur
  rationale: Dalam rumus silsilah ini, verba חיה menyatakan usia Adam pada saat peristiwa berikutnya. Ungkapan Indonesia ini alami dan mempertahankan hubungan waktunya.
- source_word: אָדָם
  choice: Adam
  rationale: Di sini אָדָם berfungsi sebagai nama diri dalam silsilah, bukan sebutan umum bagi manusia.
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: seratus tiga puluh tahun
  rationale: Ini adalah padanan baku dan jelas bagi angka Ibrani tersebut.
- source_word: וַיּוֹלֶד
  choice: ia memperanakkan seorang anak laki-laki
  rationale: Bentuk Hifil ילד dengan subjek laki-laki berarti memperanakkan atau menjadi ayah. Objek anak laki-laki tersirat dari konteks penamaan Set dan dibuat eksplisit agar alami dalam bahasa Indonesia.
- source_word: בִּדְמוּתוֹ
  choice: yang serupa dengan dirinya
  rationale: דְּמוּת menyatakan keserupaan. Rumusan ini alami dalam bahasa Indonesia sekaligus mempertahankan gema Kejadian 1:26.
- source_word: כְּצַלְמוֹ
  choice: menurut gambarnya
  rationale: צֶלֶם diterjemahkan 'gambar', sedangkan prefiks כ־ dipertahankan sebagai 'menurut', sehingga perbedaan ungkapan dengan דְּמוּת tidak diratakan.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: lalu menamainya Set
  rationale: Ini menyampaikan idiom harfiah 'memanggil namanya Set' secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: שֵׁת
  choice: Set
  rationale: Nama diri ini ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hubungan anak Adam dengan keserupaan dan gambar Adam
  choice: Frasa diterjemahkan sebagai keserupaan dengan Adam sambil mempertahankan gema istilah Kejadian 1:26–27.
  alternative: Menafsirkannya sebagai bukti bahwa gambar Allah telah berkurang atau hilang sesudah kejatuhan, atau menganggap pengulangan itu tanpa makna teologis.
  rationale: Ayat ini menggemakan bahasa penciptaan, tetapi tidak menerangkan seluruh implikasi teologisnya. Terjemahan tidak menyelesaikan ketegangan tersebut secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan waktu dibuat idiomatis; istilah keserupaan dan gambar tetap dibedakan untuk menjaga pola teks Ibrani.
