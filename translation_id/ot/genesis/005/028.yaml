base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/028.yaml
  text: And Lamech lived one hundred and eighty-two years, and fathered a son.
translation:
  language: id
  text: Ketika Lamekh berumur 182 tahun, ia menjadi ayah dari seorang anak laki-laki.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Ketika ... berumur
  rationale: Dalam rumus silsilah ini, verba חיה menyatakan usia yang telah dicapai sebelum peristiwa berikutnya. Konstruksi temporal ini menyampaikan hubungan sintaksisnya secara alami dalam bahasa Indonesia.
- source_word: לֶמֶךְ
  choice: Lamekh
  rationale: Nama Ibrani לֶמֶךְ ditransliterasikan ke dalam bentuk Indonesia yang mempertahankan bunyi konsonan akhir kh.
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 182 tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah dua dan delapan puluh serta seratus; angka ditata menurut kebiasaan bahasa Indonesia dan ditulis dengan angka agar rumus silsilah ringkas serta mudah dibaca.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil ילד dengan subjek laki-laki berarti menjadi ayah atau memperanakkan. 'Memperanakkan' ringkas, sesuai konteks silsilah, dan mempertahankan tindakan ayah sebagai subjek.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: בֵּן berarti anak laki-laki atau putra. Karena anak tersebut belum disebut namanya, 'seorang anak laki-laki' alami dan tidak menjadikannya tertentu.
