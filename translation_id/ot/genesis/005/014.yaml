lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Jadi, ... adalah
  rationale: Bentuk wayyiqtol melanjutkan rangkaian silsilah; “Jadi” menyatakan kesinambungan secara alami dalam bahasa Indonesia.
- source_word: כָּל יְמֵי
  choice: seluruh umur
  rationale: Secara harfiah berarti “seluruh hari-hari,” tetapi dalam rumus silsilah ini menunjuk pada keseluruhan masa hidup. “Seluruh umur” alami dan tetap mempertahankan gagasan totalitas.
- source_word: קֵינָן
  choice: Kenan
  rationale: Transliterasi “Kenan” mengikuti bentuk Ibrani secara langsung dan sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: sembilan ratus sepuluh tahun
  rationale: Urutan bilangan Ibrani dinyatakan menurut susunan bilangan yang wajar dalam bahasa Indonesia.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: “Lalu” meneruskan urutan narasi, sedangkan “ia meninggal” menyampaikan penutup baku silsilah dengan bahasa Indonesia yang lugas dan bermartabat.
