  text: So all the days of Adam that he lived were nine hundred and thirty years[a], and he died.
translation:
  language: id
  text: Seluruh umur Adam adalah sembilan ratus tiga puluh tahun[a], dan ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani Adam dalam konteks lain dapat berarti “manusia” atau “umat manusia”, tetapi di sini merujuk kepada Adam sebagai individu dalam silsilah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי ... אֲשֶׁר חַי
  choice: seluruh umur ... adalah
  rationale: Ungkapan ini menyampaikan jumlah keseluruhan hari kehidupan secara wajar dalam bahasa Indonesia, tanpa mempertahankan idiom Ibrani secara kaku.
- source_word: אָדָם
  choice: Adam
  rationale: Dalam konteks silsilah ini, kata tersebut menunjuk kepada nama pribadi Adam, bukan manusia atau umat manusia secara umum.
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: sembilan ratus tiga puluh tahun
  rationale: Bilangan ditulis lengkap agar sesuai dengan ragam sastra silsilah dan bentuk teks sumber.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Kata 'mati' mempertahankan rumusan penutup yang lugas dan berulang dalam Kejadian 5; 'lalu' menyatakan kelanjutan narasi secara alami tanpa memperhalus kematian.
theological_decisions:
- issue: Makna אָדָם
  choice: Adam sebagai nama pribadi
  alternative: manusia atau umat manusia
  rationale: Konteks silsilah secara jelas merujuk kepada individu bernama Adam, walaupun kata Ibrani yang sama dapat berarti manusia atau umat manusia dalam konteks lain.
- issue: Rumusan kematian
  choice: lalu ia mati
  alternative: kemudian meninggallah ia
  rationale: Terjemahan ini menjaga penegasan kematian yang singkat dan tegas dalam rumusan silsilah, tanpa eufemisme.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. 'Seluruh umur' dipilih daripada terjemahan harfiah 'seluruh hari-hari' agar alami bagi pembaca umum, sementara pola ringkas silsilah tetap terpelihara.
