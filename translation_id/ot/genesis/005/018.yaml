  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: id
  text: Ketika Yared berumur 162 tahun, ia memperanakkan Henokh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: Ketika ... berumur
  rationale: Dalam rumus silsilah ini, verba חיה memperkenalkan usia tokoh sebelum kelahiran keturunannya. Ungkapan idiomatis Indonesia 'ketika ... berumur' menyampaikan hubungan waktunya secara alami.
- source_word: יֶרֶד
  choice: Yared
  rationale: Nama Ibrani יֶרֶד ditransliterasikan sebagai 'Yared', bentuk yang dekat dengan pelafalan sumber dan lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: 162 tahun
  rationale: Urutan bilangan Ibrani secara harfiah menyebut dua dan enam puluh serta seratus; dalam bahasa Indonesia modern jumlah itu dinyatakan secara wajar sebagai '162 tahun'.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk kausatif ילד menyatakan bahwa seorang laki-laki menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, bermartabat, dan mempertahankan fungsi genealogisnya.
- source_word: אֶת חֲנוֹךְ
  choice: Henokh
  rationale: Penanda objek langsung אֶת tidak diterjemahkan. Nama חֲנוֹךְ ditransliterasikan sebagai 'Henokh', bentuk yang dekat dengan bahasa Ibrani dan dikenal oleh pembaca Indonesia.
