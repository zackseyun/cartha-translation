  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: id
  text: Ketika Nuh berumur lima ratus tahun, ia memperanakkan Sem, Ham, dan Yafet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urutan “Sem, Ham, dan Yafet” mengikuti teks Ibrani. Urutan ini tidak harus menunjukkan urutan kelahiran atau berarti bahwa ketiganya lahir pada tahun yang sama.
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי נֹחַ בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: Ketika Nuh berumur lima ratus tahun
  rationale: Konstruksi ini menyatakan keadaan waktu dan usia. Bentuk 'ketika ... berumur' alami dalam bahasa Indonesia serta mempertahankan fungsi temporal teks Ibrani.
- source_word: וַיּוֹלֶד
  choice: ia memperanakkan
  rationale: Bentuk Hifil dari ילד dengan subjek laki-laki berarti menjadi ayah atau memperanakkan. 'Memperanakkan' tepat dan cukup dignified dalam konteks silsilah, sedangkan 'mempunyai anak' kurang spesifik.
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: Sem, Ham, dan Yafet
  rationale: Penanda objek langsung tidak diterjemahkan. Nama-nama dipertahankan dalam urutan Ibrani dan memakai bentuk yang lazim dalam tradisi bahasa Indonesia.
- source_word: נֹחַ
  choice: Nuh
  rationale: Bentuk nama yang mapan dan mudah dikenali dalam bahasa Indonesia.
- source_word: שֵׁם
  choice: Sem
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: חָם
  choice: Ham
  rationale: Transliterasi nama yang lazim dalam bahasa Indonesia.
- source_word: יָפֶת
  choice: Yafet
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions:
- issue: Implikasi urutan kelahiran dalam daftar Sem, Ham, dan Yafet
  choice: Mempertahankan urutan nama dalam teks Ibrani tanpa menyatakan bahwa urutan itu pasti merupakan urutan kelahiran atau bahwa ketiganya lahir pada tahun yang sama.
  alternative: Mengurutkan nama berdasarkan perkiraan urutan kelahiran atau merumuskan ayat seolah-olah ketiganya lahir ketika Nuh tepat berumur lima ratus tahun.
  rationale: Teks menyebut usia Nuh lalu merangkum bahwa ia memperanakkan ketiga putranya. Rumusannya tidak mengharuskan daftar itu menunjukkan urutan kelahiran ataupun kelahiran ketiganya dalam satu tahun; ambiguitas tersebut patut dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Memperanakkan' dipilih sebagai istilah silsilah yang lebih tepat daripada ungkapan umum 'mempunyai anak'. Pronomina 'ia' menghindari pengulangan nama Nuh yang terasa kaku dalam bahasa Indonesia.
