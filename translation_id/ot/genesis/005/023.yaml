lexical_decisions:
- source_word: וַיְהִי
  choice: Jadi, ... adalah
  rationale: Bentuk wayyiqtol dari היה memperkenalkan rangkuman dalam silsilah. 'Jadi' menyampaikan hubungan naratif dan sifat rangkumannya secara wajar dalam bahasa Indonesia.
- source_word: כָּל יְמֵי
  choice: seluruh umur
  rationale: Secara harfiah berarti 'seluruh hari-hari', tetapi dalam rumus silsilah ungkapan ini menunjuk pada keseluruhan masa hidup. 'Seluruh umur' alami dan jelas dalam bahasa Indonesia modern.
- source_word: חֲנוֹךְ
  choice: Henokh
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: tiga ratus enam puluh lima
  rationale: Urutan unsur bilangan Ibrani disusun menurut tata bilangan Indonesia yang alami tanpa mengubah nilainya.
- source_word: שָׁנָה ... שָׁנָה
  choice: tahun
  rationale: Kedua kemunculan bentuk tunggal Ibrani merupakan bagian dari konstruksi bilangan; bahasa Indonesia secara idiomatis memakai 'tahun' satu kali setelah keseluruhan bilangan.
