  text: וַֽ/יְחִי שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/007.yaml
  text: After he fathered Enosh, Seth lived eight hundred and seven years and fathered sons and daughters.
translation:
  language: id
  text: Setelah ia menjadi ayah Enos, Set hidup delapan ratus tujuh tahun lagi dan menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, verba חיה menyatakan lamanya Set tetap hidup sesudah kelahiran Enos; kata “lagi” memperjelas bahwa masa tersebut mengikuti peristiwa itu.
- source_word: אֲחֲרֵי הוֹלִידוֹ אֶת־אֱנוֹשׁ
  choice: Setelah memperanakkan Enos
  rationale: Ungkapan temporal dan bentuk Hifil ילד diterjemahkan secara ringkas dan alami, dengan tetap mempertahankan Set sebagai ayah dalam silsilah.
- source_word: שֶׁבַע שָׁנִים וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus tujuh tahun
  rationale: Urutan bilangan disesuaikan dengan tata bahasa Indonesia tanpa mengubah jumlah keseluruhan, yaitu 807 tahun.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Pilihan ini mempertahankan arti kausatif-genealogis ילד serta konsisten dengan pemakaiannya pada awal ayat.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan, bukan meratakannya menjadi sekadar “anak-anak”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Nama אֱנוֹשׁ ditulis “Enos” sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Istilah “memperanakkan” dipilih karena tepat untuk konteks silsilah dan masih mudah dipahami, meskipun bernuansa formal.
