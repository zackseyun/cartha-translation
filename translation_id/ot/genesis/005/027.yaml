  text: So all the days of Methuselah were nine hundred sixty-nine years, and he died.
translation:
  language: id
  text: Jadi, seluruh umur Metusalah adalah 969 tahun, lalu ia meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: seluruh umur ... adalah
  rationale: Ungkapan harfiah “seluruh hari-hari” merangkum panjang hidup seseorang. Dalam bahasa Indonesia modern, “seluruh umur” menyampaikan maksudnya secara alami sambil mempertahankan bentuk rangkuman silsilah.
- source_word: מְתוּשֶׁלַח
  choice: Metusalah
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: תֵּשַׁע וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 969 tahun
  rationale: Susunan bilangan Ibrani menyebut enam puluh sembilan lalu sembilan ratus; angka ditata menurut kebiasaan Indonesia modern tanpa mengubah jumlahnya.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. “Meninggal” merupakan ungkapan Indonesia yang alami dan bermartabat untuk kematian seseorang.
