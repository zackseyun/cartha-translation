lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Dalam rumus silsilah, bentuk ini menyatakan usia yang telah dijalani sebelum peristiwa berikutnya; 'hidup' alami dan setia pada makna sumber.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleel
  rationale: Nama diri ditransliterasikan, dengan bentuk yang telah lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: enam puluh lima tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'lima tahun dan enam puluh tahun'; susunan dibalik agar sesuai dengan bahasa Indonesia modern tanpa mengubah nilainya.
- source_word: וַיּוֹלֶד
  choice: lalu memperanakkan
  rationale: Dalam silsilah, ילד bentuk kausatif menyatakan tindakan seorang laki-laki memperoleh atau menjadi ayah dari seorang anak. 'Memperanakkan' mempertahankan nuansa genealogis dengan ringkas, sedangkan 'lalu' menandai kelanjutan naratif וַ־.
- source_word: אֶת יָרֶד
  choice: Yared
  rationale: Penanda objek langsung אֶת tidak perlu diterjemahkan; nama יָרֶד ditransliterasikan sebagai 'Yared', bentuk yang lazim dalam bahasa Indonesia.
