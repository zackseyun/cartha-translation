  text: Seluruh umur Set adalah sembilan ratus dua belas tahun, dan ia meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: seluruh umur ... adalah
  rationale: Ungkapan Ibrani ini merangkum jumlah seluruh hari kehidupan seseorang. Dalam bahasa Indonesia, “seluruh umur ... adalah” menyampaikan maknanya secara alami tanpa menghilangkan fungsi formula silsilah.
- source_word: שֵׁת
  choice: Set
  rationale: Nama ini memakai bentuk baku yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: sembilan ratus dua belas tahun
  rationale: Teks Ibrani menyebut dua belas lalu sembilan ratus; susunan bilangan dibalik agar sesuai dengan tata bilangan Indonesia, dengan jumlah yang tetap sama, yaitu 912 tahun.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: Kata penghubung naratif menandai kejadian penutup dalam formula silsilah. “Lalu ia meninggal” alami dalam bahasa Indonesia dan mempertahankan urutan serta nada lugas teks.
