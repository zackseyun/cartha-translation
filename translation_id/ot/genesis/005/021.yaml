  text: Henokh berumur enam puluh lima tahun, lalu ia memperanakkan Metusalah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: ketika ... berumur
  rationale: Dalam rumus silsilah ini, verba חיה disertai jumlah tahun menyatakan usia tokoh ketika anak yang disebut berikutnya lahir. Bentuk temporal ini alami dalam bahasa Indonesia dan mempertahankan hubungan dengan peristiwa memperanakkan.
- source_word: חֲנוֹךְ
  choice: Henokh
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: enam puluh lima tahun
  rationale: Urutan bilangan disesuaikan dengan tata bilangan bahasa Indonesia modern tanpa mengubah nilainya.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dengan subjek laki-laki dalam silsilah, ילד kausatif berarti menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, tepat, dan sesuai dengan ragam silsilah yang bermartabat.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan tersendiri yang diperlukan dalam bahasa Indonesia.
- source_word: מְתוּשָׁלַח
  choice: Metusalah
  rationale: Nama diri ditransliterasikan memakai bentuk yang lazim dalam Alkitab bahasa Indonesia.
