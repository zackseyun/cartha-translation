  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah Kenan menjadi ayah bagi Mahalalel, ia hidup delapan ratus empat puluh tahun lagi dan menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup
  rationale: Dalam rumus silsilah Kejadian, kata ini menyatakan lamanya seseorang hidup; bentuk Indonesia yang alami ialah “hidup”.
- source_word: קֵינָן
  choice: Kenan
  rationale: Mengikuti bentuk nama Ibrani dan ejaan baku yang lazim dalam bahasa Indonesia.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: setelah memperanakkan
  rationale: אַחֲרֵי menandai waktu sesudah kelahiran, sedangkan bentuk Hifil ילד dengan subjek laki-laki berarti menyebabkan lahir atau menjadi ayah; “memperanakkan” ringkas dan tepat dalam konteks silsilah.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Transliterasi langsung nama pribadi Ibrani yang juga lazim dalam tradisi Indonesia.
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus empat puluh tahun lagi
  rationale: Urutan bilangan disesuaikan dengan tata bahasa Indonesia tanpa mengubah jumlah; “lagi” memperjelas bahwa ini adalah masa hidup sesudah kelahiran Mahalalel.
- source_word: וַיּוֹלֶד
  choice: Ia memperanakkan
  rationale: Mempertahankan makna kausatif dan konsistensi dengan הוֹלִידוֹ sambil memulai kalimat kedua secara alami.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Ibrani menyebut kedua jenis keturunan secara eksplisit; terjemahan ini mempertahankan rincian tersebut.
