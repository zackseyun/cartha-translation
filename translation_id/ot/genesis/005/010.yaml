base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah Enos menjadi ayah bagi Kenan[a][b], ia hidup delapan ratus lima belas tahun lagi[c] dan menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperanakkan Kenan.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: Kenan; bentuk tradisional yang dipengaruhi bahasa Yunani sering ditulis “Kainan.”'
    reason: alternative_reading
  - marker: c
    text: 'Secara lebih harfiah: “Enos hidup, setelah ia menjadi ayah bagi Kenan, delapan ratus lima belas tahun.”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְחִי
  choice: ia hidup
  rationale: Bentuk naratif dari חיה dalam rumus silsilah ini menyatakan bahwa Enos terus hidup selama jangka waktu yang disebutkan.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: Bentuk nama yang sudah dikenal dan wajar dalam bahasa Indonesia dipakai untuk nama Ibrani Enosh.
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: setelah ... memperanakkan
  rationale: Frasa ini menyatakan waktu sesudah Enos menjadi ayah Kenan; susunan klausa diubah secara wajar dalam bahasa Indonesia tanpa mengubah hubungan waktunya.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti menjadi ayah atau menghasilkan keturunan. Pilihan ini mempertahankan sudut pandang garis keturunan laki-laki dan digunakan secara konsisten pada kedua kemunculannya.
- source_word: קֵינָן
  choice: Kenan
  rationale: Nama ini dialihaksarakan langsung dari bentuk Ibrani; bentuk Kainan terutama dipengaruhi tradisi Yunani.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus lima belas tahun
  rationale: Ungkapan Ibrani menyebut lima belas ditambah delapan ratus tahun; urutannya disesuaikan dengan cara penyebutan bilangan yang alami dalam bahasa Indonesia.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan, bukan meringkasnya menjadi 'anak-anak' saja.
