base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: id
  text: Setelah Adam menjadi ayah bagi Set, ia hidup[a] selama delapan ratus tahun dan menjadi ayah bagi anak-anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari-hari Adam ... adalah delapan ratus tahun” setelah ia menjadi ayah bagi Set.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: Adam hidup
  rationale: Ungkapan Ibrani ini secara harfiah menyatakan bahwa 'hari-hari Adam ... berjumlah/ada', tetapi dalam bahasa Indonesia masa hidup seseorang secara alami diungkapkan dengan 'Adam hidup'.
- source_word: אָדָם
  choice: Adam
  rationale: Dalam konteks silsilah ini, kata tersebut merupakan nama pribadi, bukan sebutan umum bagi manusia.
- source_word: אַחֲרֵי
  choice: Setelah
  rationale: Kata depan ini menyatakan urutan waktu secara langsung dan alami.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk kausatif dari ילד di sini berarti menjadi ayah atau menghasilkan keturunan; 'memperanakkan' mempertahankan makna genealogis dan pelaku laki-lakinya.
- source_word: אֶת שֵׁת
  choice: Set
  rationale: אֶת adalah penanda objek langsung yang tidak perlu diterjemahkan, sedangkan שֵׁת ditransliterasikan sebagai nama pribadi 'Set' menurut bentuk baku bahasa Indonesia.
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: delapan ratus tahun
  rationale: Terjemahan langsung dan wajar bagi ungkapan bilangan yang menunjukkan lamanya waktu.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Berasal dari akar ילד yang sama seperti sebelumnya; pengulangan 'memperanakkan' menjaga konsistensi leksikal dan nuansa silsilah.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Teks Ibrani secara khusus menyebut keturunan laki-laki dan perempuan, sehingga keduanya dipertahankan dan tidak diringkas menjadi sekadar 'anak-anak'.
theological_decisions:
- issue: Makna אָדָם
  choice: Adam sebagai nama pribadi
  alternative: manusia
  rationale: Konteks silsilah menunjuk kepada individu bernama Adam, bukan umat manusia secara umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'memperanakkan' dipilih karena tepat untuk konteks silsilah serta mempertahankan tindakan seorang ayah, meskipun bernuansa lebih formal daripada 'mempunyai anak'.
