  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah Yared, Mahalaleel masih hidup delapan ratus tiga puluh tahun dan menjadi ayah bagi anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: hidup ... lagi
  rationale: Dalam rumus silsilah ini, bentuk verba tersebut menyatakan kelanjutan hidup sesudah kelahiran anak yang disebutkan; 'lagi' memperjelas masa lanjutan itu secara alami dalam bahasa Indonesia.
- source_word: מַהֲלַלְאֵל
  choice: Mahalaleel
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dikenal dalam tradisi Alkitab bahasa Indonesia sambil tetap mencerminkan nama Ibrani.
- source_word: אַחֲרֵי
  choice: Setelah
  rationale: Preposisi temporal ini menandai masa sesudah Yared diperanakkan.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dengan subjek laki-laki berarti menyebabkan lahir atau menjadi ayah dari; 'memperanakkan' tepat dan sesuai dengan gaya silsilah yang bermartabat.
- source_word: יֶרֶד
  choice: Yared
  rationale: Transliterasi ini dekat dengan pelafalan Ibrani dan lazim dalam bahasa Indonesia.
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus tiga puluh tahun
  rationale: Urutan bilangan disesuaikan dengan idiom bahasa Indonesia tanpa mengubah jumlah 830 tahun.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Pilihan ini mempertahankan konsistensi leksikal dengan bentuk sebelumnya dari akar ילד serta peran ayah dalam silsilah.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Bahasa Ibrani secara eksplisit menyebut keturunan laki-laki dan perempuan; frasa ini mempertahankan kedua kategori tersebut dengan bahasa Indonesia yang jelas.
