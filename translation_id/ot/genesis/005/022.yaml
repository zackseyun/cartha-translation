id: GEN.5.22
reference: Genesis 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah menjadi ayah dari Metusalah, Henok berjalan bersama Allah[a] selama tiga ratus tahun dan menjadi ayah dari anak-anak laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup dalam persekutuan dengan Allah.” Ungkapan Ibraninya secara harfiah berarti “berjalan bersama Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ ... אֶת הָאֱלֹהִים
  choice: berjalan bersama Allah
  rationale: Mempertahankan metafora relasional dalam idiom Ibrani dan memakai bentuk Indonesia yang wajar tanpa mempersempit maknanya menjadi sekadar kesalehan atau persekutuan.
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: Setelah menjadi ayah dari Metusalah ... selama tiga ratus tahun
  rationale: Susunan ini menjelaskan bahwa tiga ratus tahun adalah lamanya Henok berjalan bersama Allah sesudah kelahiran Metusalah, sesuai hubungan sintaksis dalam bahasa Ibrani.
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  choice: menjadi ayah dari
  rationale: Mengungkapkan peran orang tua laki-laki dari bentuk kausatif ילד dengan bahasa Indonesia modern dan alami; lebih mudah dipahami daripada 'memperanakkan'.
- source_word: מְתוּשֶׁלַח
  choice: Metusalah
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak laki-laki dan perempuan
  rationale: Mempertahankan penyebutan eksplisit keturunan laki-laki dan perempuan dalam teks Ibrani.
theological_decisions:
- issue: Makna hubungan Henok dengan Allah dalam idiom 'berjalan bersama Allah'
  choice: Metafora 'berjalan bersama Allah' dipertahankan dalam teks utama.
  alternative: hidup dalam persekutuan dengan Allah; hidup setia di hadapan Allah
  rationale: Metafora Ibrani memiliki daya teologis dan keluasan makna yang tidak sebaiknya dibatasi pada satu penafsiran seperti persekutuan atau kesetiaan saja.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Klausa waktu ditempatkan di awal agar cakupan 'selama tiga ratus tahun' tidak ambigu, sedangkan metafora utama dari bahasa Ibrani tetap dipertahankan.
