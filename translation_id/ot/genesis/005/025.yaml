base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/025.yaml
  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: id
  text: Metusalah berusia seratus delapan puluh tujuh tahun ketika ia menjadi ayah Lamekh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, חיה menyatakan usia tokoh ketika anak berikutnya lahir. Ungkapan Indonesia 'ketika ... berumur' menyampaikan fungsi itu secara alami bersama klausa berikutnya.
- source_word: מְתוּשֶׁלַח
  choice: Metusalah
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: seratus delapan puluh tujuh tahun
  rationale: Urutan bilangan Ibrani secara harfiah adalah 'tujuh dan delapan puluh ... dan seratus'; susunan bilangan Indonesia yang wajar adalah 'seratus delapan puluh tujuh tahun'.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Bentuk Hifil ילד dalam silsilah berarti menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas dan mempertahankan corak silsilah, sedangkan alternatif yang lebih natural dicatat dalam catatan kaki.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya terwakili oleh susunan kalimat.
- source_word: לָמֶךְ
  choice: Lamekh
  rationale: Nama pribadi ditransliterasikan langsung dari bentuk Ibrani לֶמֶךְ, dengan kh untuk konsonan akhir כ.
