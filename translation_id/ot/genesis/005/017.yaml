lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: seluruh umur ... adalah
  rationale: Ungkapan Ibrani harfiahnya berarti 'seluruh hari-hari ... adalah', tetapi dalam konteks rangkuman silsilah menunjuk pada seluruh masa hidup. 'Seluruh umur' mempertahankan cakupan כָּל sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Nama pribadi ditransliterasikan secara langsung dan bentuk 'Mahalalel' sudah lazim dalam Alkitab bahasa Indonesia.
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus sembilan puluh lima tahun
  rationale: 'Susunan bilangan disesuaikan dengan tata bilangan Indonesia, sementara nilainya tetap tepat: 895 tahun.'
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: Wayyiqtol penutup menyatakan kejadian berikutnya dalam formula silsilah. 'Lalu ia meninggal' menjaga alur dan pengulangan khidmat dengan ungkapan Indonesia yang wajar.
