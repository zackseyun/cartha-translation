  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: id
  text: Ketika Set berumur 105 tahun, ia memperanakkan Enos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “menjadi ayah Enos.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, verba חיה bersama jumlah tahun menyatakan usia tokoh ketika peristiwa berikutnya terjadi. Ungkapan Indonesia 'ketika ... berumur' menyampaikan hubungan itu secara alami.
- source_word: שֵׁת
  choice: Set
  rationale: Nama Ibrani שֵׁת ditampilkan dalam bentuk Indonesia yang sudah lazim, yaitu 'Set'.
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 105 tahun
  rationale: Susunan harfiah 'lima tahun dan seratus tahun' adalah cara Ibrani menyatakan 105 tahun; angka Arab jelas dan alami bagi pembaca modern.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam silsilah, bentuk hiphil ילד berarti menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, lazim dalam gaya silsilah Alkitab Indonesia, dan tidak mengandung arti bahwa sang ayah melahirkan.
- source_word: אֶת אֱנוֹשׁ
  choice: Enos
  rationale: Partikel penanda objek אֶת tidak diterjemahkan. Nama אֱנוֹשׁ ditampilkan sebagai 'Enos', bentuk Indonesia yang lazim dan tetap dekat dengan pelafalan Ibrani.
