  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: id
  text: Inilah kitab keturunan Adam. Pada waktu Allah menciptakan manusia[a], Dia menjadikannya dalam keserupaan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “manusia” berbentuk tunggal maskulin dan dipakai secara representatif untuk umat manusia. Pada pemakaian sebelumnya dalam ayat ini, kata yang sama merupakan nama diri, “Adam”.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: Inilah kitab
  rationale: Ungkapan ini berfungsi sebagai judul atau pengantar sebuah catatan tertulis; “Inilah kitab” mempertahankan bentuk resmi teks Ibrani sekaligus wajar dalam bahasa Indonesia.
- source_word: תּוֹלְדֹת
  choice: keturunan
  rationale: Dalam konteks silsilah berikutnya, istilah ini menunjuk pada garis keturunan atau catatan keturunan. Pilihan ini mempertahankan istilah struktural penting dalam Kitab Kejadian tanpa mempersempitnya menjadi sekadar daftar nama.
- source_word: אָדָם (pertama)
  choice: Adam
  rationale: Dalam judul silsilah ini, kata tersebut paling tepat dipahami sebagai nama leluhur yang silsilahnya akan dipaparkan.
- source_word: בְּיוֹם בְּרֹא
  choice: Pada waktu ... menciptakan
  rationale: Secara idiomatis frasa Ibrani “pada hari menciptakan” dapat menyatakan waktu secara umum, yaitu “ketika/pada waktu”; terjemahan ini alami dan tidak mengharuskan arti satu hari kalender tertentu.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dengan verba tunggal dalam konteks ini, אֱלֹהִים merujuk kepada Allah.
- source_word: אָדָם (kedua)
  choice: manusia
  rationale: Pemakaian kedua menggemakan kisah penciptaan dan bersifat generik, menunjuk kepada manusia, meskipun bentuk Ibraninya tunggal dan dapat pula dipahami secara representatif sebagai laki-laki.
- source_word: בִּדְמוּת
  choice: menurut keserupaan dengan
  rationale: דְּמוּת berarti keserupaan atau kemiripan. Pilihan ini tidak mencampurkannya dengan צֶלֶם, “gambar”, yang tidak muncul dalam ayat ini.
- source_word: עָשָׂה אֹתוֹ
  choice: Dia menjadikannya
  rationale: Verba עשה lebih luas daripada “menciptakan” dan tepat diterjemahkan “menjadikan”; akhiran objek tunggal dipertahankan melalui “-nya”.
theological_decisions:
- issue: Dua pemakaian אָדָם dalam ayat yang sama
  choice: “Adam” sebagai nama diri pada judul, lalu “manusia” sebagai sebutan generik dalam klausa penciptaan
  alternative: “Adam” pada kedua pemakaian, atau “laki-laki” pada pemakaian kedua
  rationale: Konteks silsilah mendukung nama diri pada pemakaian pertama, sedangkan gema kisah penciptaan mendukung arti generik pada pemakaian kedua. Catatan kaki menjaga kemungkinan nuansa tunggal representatif tanpa memaksakan salah satu penafsiran.
- issue: Hubungan דְּמוּת dengan bahasa penciptaan dalam Kejadian
  choice: Mempertahankan “keserupaan”, bukan menggantinya dengan “gambar”
  alternative: “menurut gambar Allah”
  rationale: Teks memakai דְּמוּת, bukan צֶלֶם. Pembedaan leksikal ini dipertahankan agar nuansa teks sumber tidak diharmoniskan secara diam-diam.
- issue: Rujukan pronomina dalam “Dia menjadikannya”
  choice: Mempertahankan objek tunggal yang merujuk kepada manusia
  alternative: Mengulang “manusia” atau memakai bentuk jamak “mereka”
  rationale: Bentuk Ibrani memakai objek tunggal maskulin. Bahasa Indonesia memungkinkan bentuk “-nya” yang mempertahankan ketunggalan tanpa menambah penandaan gender yang tidak wajib secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Inilah kitab keturunan Adam” mempertahankan gaya judul yang formal. “Pada waktu” menyampaikan idiom temporal Ibrani secara alami, sedangkan “keserupaan” menjaga perbedaan leksikal dari istilah “gambar” dalam bagian penciptaan lainnya.
