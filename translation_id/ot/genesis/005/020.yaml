  text: So all the days of Yered were nine hundred and sixty-two years[a], and he died.
translation:
  language: id
  text: Seluruh umur Yered[a] adalah 962 tahun, lalu ia meninggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Yered; dalam banyak terjemahan Alkitab bahasa Indonesia, Yared.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Jadi, ... adalah
  rationale: Bentuk wayyiqtol dari היה memperkenalkan rangkuman dalam silsilah. “Jadi” menyampaikan kesinambungan sekaligus simpulan naratif secara wajar dalam bahasa Indonesia.
- source_word: כָּל יְמֵי
  choice: seluruh umur
  rationale: Ungkapan harfiah “seluruh hari-hari” merujuk pada keseluruhan masa hidup; “seluruh umur” lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: יֶרֶד
  choice: Yered
  rationale: Transliterasi “Yered” mencerminkan bentuk Ibrani יֶרֶד secara langsung dan sesuai dengan kebijakan transliterasi nama sumber.
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 962 tahun
  rationale: Susunan bilangan Ibrani dinyatakan menurut urutan baku bahasa Indonesia. Dua unsur bilangan digabungkan menjadi jumlah keseluruhan, dan kata “tahun” cukup disebut sekali.
- source_word: וַיָּמֹת
  choice: lalu ia meninggal
  rationale: “Lalu” mengungkapkan kelanjutan naratif dari wayyiqtol, sedangkan “ia meninggal” mempertahankan rumusan penutup silsilah dengan bahasa yang alami dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Ungkapan idiomatis “seluruh umur” dipilih daripada terjemahan harfiah “seluruh hari-hari”. Nama Yered ditransliterasikan langsung dari teks Ibrani; catatan kaki bahasa Inggris tentang bentuk tradisional “Jared” tidak diperlukan untuk pembaca Indonesia karena “Yared” juga dikenal dalam tradisi Indonesia, sedangkan teks proyek mengikuti transliterasi sumber.
