lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah ini, חיה menyatakan usia Kenan ketika anak yang disebut berikutnya lahir. Gabungan alami bahasa Indonesia 'ketika ... berumur' menyampaikan fungsi temporalnya dengan jelas.
- source_word: קֵינָן
  choice: Kenan
  rationale: Nama ini ditransliterasikan langsung dari bentuk Ibrani dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: שִׁבְעִים שָׁנָה
  choice: tujuh puluh tahun
  rationale: Frasa ini menyatakan usia Kenan pada saat memperanakkan Mahalalel.
- source_word: וַיּוֹלֶד
  choice: memperanakkan
  rationale: Dalam konteks silsilah, bentuk kausatif ילד berarti menjadi ayah atau menghasilkan keturunan; 'memperanakkan' mempertahankan hubungan genealogis laki-laki secara ringkas dan formal.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan tersendiri yang diperlukan dalam bahasa Indonesia.
- source_word: מַהֲלַלְאֵל
  choice: Mahalalel
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani מַהֲלַלְאֵל.
