  text: Kenan lived seventy years and fathered Mahalalel[a].
translation:
  language: id
  text: Ketika Kenan berusia tujuh puluh tahun, ia menjadi ayah dari Mahalalel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “Kenan memperanakkan Mahalalel.”
