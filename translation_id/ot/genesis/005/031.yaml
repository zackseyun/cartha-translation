  text: וַֽ/יְהִי֙ כָּל יְמֵי לֶ֔מֶךְ שֶׁ֤בַע וְ/שִׁבְעִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: id
  text: Jadi, seluruh umur Lamekh adalah tujuh ratus tujuh puluh tujuh tahun[a], lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani mengurutkan bilangan ini sebagai “tujuh dan tujuh puluh tahun, dan tujuh ratus tahun,” yaitu 777 tahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל יְמֵי
  choice: Jadi, seluruh umur ... adalah
  rationale: Rangkaian ini merangkum keseluruhan masa hidup Lamekh. 'Jadi' menyampaikan kesinambungan naratif, sedangkan 'seluruh umur' merupakan ungkapan Indonesia yang alami dan jelas bagi idiom Ibrani 'seluruh hari-hari'.
- source_word: לֶמֶךְ
  choice: Lamekh
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang mencerminkan konsonan akhir Ibrani כ (kh).
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: tujuh ratus tujuh puluh tujuh
  rationale: Susunan bilangan Ibrani menyebut satuan, puluhan, lalu ratusan, tetapi jumlahnya secara idiomatis adalah 777; urutan bilangan disesuaikan dengan bahasa Indonesia modern.
- source_word: שָׁנָה
  choice: tahun
  rationale: Bahasa Indonesia memakai bentuk 'tahun' tanpa perubahan bentuk setelah bilangan.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: '''Lalu'' menyatakan urutan peristiwa dari waw-konsekutif dan mempertahankan penutup formula silsilah secara lugas.'
theological_decisions:
- issue: Rumus masa hidup dalam silsilah Kejadian 5
  choice: Menyajikan angka itu secara langsung sebagai ringkasan masa hidup Lamekh.
  alternative: Menafsirkan atau menandai angka tersebut sebagai simbolis dalam teks terjemahan.
  rationale: Teks Ibrani menyampaikan jumlah umur dan kematian secara langsung; terjemahan tidak menambahkan penilaian historis atau simbolis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Seluruh umur' dipilih daripada terjemahan harfiah 'seluruh hari-hari' agar alami bagi pembaca umum, sementara catatan kaki mempertahankan informasi tentang susunan bilangan Ibrani.
