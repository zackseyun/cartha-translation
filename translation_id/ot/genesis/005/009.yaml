source:
  edition: WLC
  text: וַֽ/יְחִ֥י אֱנ֖וֹשׁ תִּשְׁעִ֣ים שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת קֵינָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/009.yaml
  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: id
  text: Ketika Enos berumur sembilan puluh tahun, ia menjadi ayah Kenan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama ini kadang ditulis “Kainan” menurut bentuk Yunani; teks Ibrani berbunyi Kenan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחִי
  choice: berumur
  rationale: Dalam rumus silsilah yang diikuti keterangan usia, חיה menyatakan usia yang telah dicapai. Ungkapan Indonesia yang alami ialah “berumur ... tahun”.
- source_word: אֱנוֹשׁ
  choice: Enos
  rationale: Bentuk “Enos” sudah mapan dalam tradisi Alkitab bahasa Indonesia dan tetap cukup dekat dengan nama Ibrani Enosh.
- source_word: תִּשְׁעִים שָׁנָה
  choice: sembilan puluh tahun
  rationale: Ini adalah padanan idiomatis dan tepat bagi keterangan usia dalam bahasa Indonesia.
- source_word: וַיּוֹלֶד
  choice: menjadi ayah
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki memperanakkan keturunan. “Menjadi ayah” alami dalam bahasa Indonesia modern dan menghindari kata “memperanakkan” yang lebih kaku.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: קֵינָן
  choice: Kenan
  rationale: “Kenan” langsung mencerminkan bentuk nama dalam teks Ibrani; bentuk “Kainan” terutama mencerminkan tradisi Yunani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Rumus usia disusun sebagai anak kalimat agar hubungan waktunya jelas. Istilah “menjadi ayah” dipilih sebagai padanan genealogis yang mudah dipahami tanpa memakai ungkapan arkais.
