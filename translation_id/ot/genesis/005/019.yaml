base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: id
  text: Setelah Yered[a] menjadi ayah Hanokh, ia hidup delapan ratus tahun lagi dan mempunyai anak-anak lelaki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk nama yang lazim dalam terjemahan Alkitab bahasa Indonesia adalah “Yared” dan “Henokh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: ia hidup ... lagi
  rationale: Dalam rumus silsilah, חיה menyatakan kelanjutan hidup selama jangka waktu yang disebutkan; kata 'lagi' secara alami menyampaikan bahwa masa itu berlangsung sesudah kelahiran Henokh.
- source_word: יֶרֶד
  choice: Yered
  rationale: Transliterasi ini mencerminkan bentuk Ibrani יֶרֶד secara langsung; bentuk tradisional Indonesia dicatat dalam catatan kaki.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Preposisi temporal ini menandai masa sesudah peristiwa memperanakkan anak yang disebutkan.
- source_word: הוֹלִידוֹ
  choice: memperanakkan
  rationale: Bentuk hifil ילד dengan subjek laki-laki dalam silsilah berarti menjadi ayah dari atau menghasilkan keturunan; 'memperanakkan' ringkas, tepat, dan sesuai dengan gaya silsilah.
- source_word: אֶת חֲנוֹךְ
  choice: Henokh
  rationale: Nama ini ditransliterasikan dari חֲנוֹךְ dengan e untuk vokal hataf segol dan kh untuk konsonan akhir; bentuk ini dekat dengan bahasa sumber sekaligus mudah dibaca dalam bahasa Indonesia.
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: delapan ratus tahun
  rationale: Frasa bilangan ini menyatakan lamanya masa hidup.
- source_word: וַיּוֹלֶד
  choice: dan memperanakkan
  rationale: Pengulangan verba ילד dipertahankan agar peran Yered sebagai ayah tetap eksplisit dan kaitan dengan rumus silsilah tidak hilang.
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit kedua kelompok keturunan, bukan meratakannya menjadi 'anak-anak' saja.
