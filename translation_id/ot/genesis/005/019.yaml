translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan susunan kalimat alami. 'Memperanakkan' dipertahankan sebagai istilah silsilah yang tepat dan masih dipahami luas. Nama Yered mengikuti bentuk Ibrani, sedangkan Henokh sudah sangat dekat dengan bentuk Ibrani dan lazim dalam bahasa Indonesia.
