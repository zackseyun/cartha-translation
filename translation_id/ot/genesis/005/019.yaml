revisions:
- from: Setelah Yered memperanakkan Henokh[a], ia hidup delapan ratus tahun lagi dan memperanakkan anak-anak lelaki dan perempuan.
  to: Setelah Yered[a] menjadi ayah Hanokh, ia hidup delapan ratus tahun lagi dan mempunyai anak-anak lelaki dan perempuan.
  rationale: Revisi memakai transliterasi “Hanokh” yang lebih dekat dengan חֲנוֹךְ dan memperbaiki fungsi catatan kaki. Susunan kalimat tetap menyatakan bahwa masa delapan ratus tahun itu berlangsung sesudah Yered menjadi ayah Hanokh. “Mempunyai anak-anak lelaki dan perempuan” mempertahankan penyebutan eksplisit kedua jenis kelamin, sementara “menjadi ayah” menghindari kekuranglaziman “memperanakkan” bagi subjek laki-laki dalam bahasa Indonesia modern.
