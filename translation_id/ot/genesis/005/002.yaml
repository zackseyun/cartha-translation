base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: id
  text: Laki-laki dan perempuan diciptakan-Nya; Ia memberkati mereka dan memberi mereka nama “manusia”[a] pada hari mereka diciptakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai kata ’adam. Kata ini dapat berarti “manusia” atau “umat manusia” secara kolektif, dan juga merupakan nama diri Adam.
    reason: Menjaga keluasan makna dan ambiguitas asli istilah אָדָם.
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: Laki-laki dan perempuan
  rationale: Mempertahankan pasangan istilah jenis kelamin dalam bahasa Ibrani secara langsung dan alami dalam bahasa Indonesia.
- source_word: בְּרָאָם
  choice: Dia menciptakan mereka
  rationale: Bentuk perfek Qal dengan akhiran jamak merujuk pada tindakan Allah menciptakan keduanya; bentuk lampau dipahami dari konteks narasi.
- source_word: וַיְבָרֶךְ אֹתָם
  choice: lalu Dia memberkati mereka
  rationale: Terjemahan lugas dan idiomatis yang mempertahankan tindakan berkat ilahi.
- source_word: וַיִּקְרָא אֶת שְׁמָם
  choice: dan menamai mereka
  rationale: Ungkapan harfiah 'memanggil nama mereka' paling wajar disampaikan sebagai 'menamai mereka'; objek jamak tetap menunjukkan bahwa satu sebutan diberikan kepada keduanya.
- source_word: אָדָם
  choice: “manusia”
  rationale: Dalam konteks ini אָדָם menjadi nama/sebutan kolektif bagi laki-laki dan perempuan bersama-sama. 'Manusia' mempertahankan cakupan kolektif tersebut tanpa membatasinya pada individu laki-laki.
- source_word: בְּיוֹם הִבָּרְאָם
  choice: pada hari mereka diciptakan
  rationale: Mempertahankan ungkapan temporal dan bentuk pasif sumber secara alami.
theological_decisions:
- issue: Makna אָדָם sebagai sebutan kolektif sekaligus bentuk yang dapat menjadi nama diri
  choice: “manusia” dalam teks utama
  alternative: “Adam”
  rationale: Konteks langsung menyatakan bahwa laki-laki dan perempuan bersama-sama menerima satu sebutan, sehingga makna kolektif adalah yang utama. Catatan kaki mempertahankan ambiguitas karena bentuk Ibrani yang sama juga dipakai sebagai nama diri Adam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi 'Dia' dipakai secara konsisten untuk rujukan kepada Allah. Tanda petik pada 'manusia' menandai bahwa kata itu diberikan sebagai nama atau sebutan kolektif.
