  text: וַ/יֹּ֤אמֶר רְאוּבֵן֙ אֶל אָבִ֣י/ו לֵ/אמֹ֔ר אֶת שְׁנֵ֤י בָנַ/י֙ תָּמִ֔ית אִם לֹ֥א אֲבִיאֶ֖/נּוּ אֵלֶ֑י/ךָ תְּנָ֤/ה אֹת/וֹ֙ עַל יָדִ֔/י וַ/אֲנִ֖י אֲשִׁיבֶ֥/נּוּ אֵלֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/037.yaml
  text: Then Reuben said to his father[a], “You may put my two sons to death if I do not bring him back to you. Put him in my hand, and I myself will bring him back to you.”
translation:
  language: id
  text: Lalu Ruben berkata kepada ayahnya, “Bunuhlah kedua anakku jika aku tidak membawa dia kembali kepadamu. Serahkanlah dia ke dalam tanggung jawabku,[a] dan aku sendiri akan membawanya kembali kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Taruhlah dia di atas tanganku.”
    reason: Ungkapan Ibrani memakai citra tangan untuk menyatakan bahwa seseorang dipercayakan ke dalam tanggung jawab orang lain.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” menyampaikan gerak naratif itu secara alami dalam bahasa Indonesia.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: אֶל אָבִיו
  choice: kepada ayahnya
  rationale: Padanan relasional yang langsung dan wajar.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam bahasa Indonesia modern, unsur pengantar ujaran ini sudah terwakili oleh “berkata” dan tanda petik.
- source_word: אֶת שְׁנֵי בָנַי תָּמִית
  choice: Bunuhlah kedua anakku
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. Imperatif bahasa Ibrani dipertahankan secara langsung, sesuai kerasnya jaminan yang Ruben tawarkan.
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: jika aku tidak membawa dia kembali kepadamu
  rationale: אִם לֹא menyatakan syarat negatif; “kembali” dijelaskan oleh konteks bahwa Benyamin harus dibawa pulang kepada Yakub.
- source_word: תְּנָה אֹתוֹ עַל יָדִי
  choice: Serahkanlah dia ke dalam tanggung jawabku
  rationale: Ungkapan harfiah “taruhlah dia di atas tanganku” merupakan idiom penyerahan tanggung jawab. Terjemahan utama dibuat alami sambil mempertahankan citra harfiahnya dalam catatan kaki.
- source_word: וַאֲנִי
  choice: dan aku sendiri
  rationale: Pronomina eksplisit memberi penekanan pada tanggung jawab pribadi Ruben.
- source_word: אֲשִׁיבֶנּוּ אֵלֶיךָ
  choice: akan membawanya kembali kepadamu
  rationale: Bentuk Hifil dari שוב berarti menyebabkan kembali, sehingga “membawanya kembali” tepat secara leksikal dan kontekstual.
