  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: id
  text: Utuslah seorang dari antara kalian, dan biarlah dia membawa saudara kalian[a], sementara kalian tetap ditahan[b], supaya perkataan kalian diuji, apakah kebenaran ada pada kalian[c]. Namun, jika tidak, demi hidup Firaun[d], kalian benar-benar mata-mata.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mengambil saudara kalian”. Kata kerja Ibrani ini biasanya berarti “mengambil”, tetapi di sini maksudnya ialah menjemput saudara itu dan membawanya kembali.
    reason: lexical_alternative
  - marker: b
    text: Atau “kalian harus diikat” atau “kalian tetap berada dalam tahanan”. Kata kerja Ibrani ini dapat berarti diikat atau ditahan dalam penjagaan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “apakah kebenaran ada pada kalian”, yaitu apakah kalian mengatakan yang benar.
    reason: lexical_alternative
  - marker: d
    text: “Demi hidup Firaun” merupakan rumusan sumpah yang mengacu pada hidup Firaun.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: Utuslah seorang dari antara kalian
  rationale: Bentuk imperatif jamak שִׁלְחוּ memerintahkan kelompok itu untuk mengirim satu orang dari antara mereka. “Utuslah” menyampaikan tindakan mengirim dengan tujuan tertentu secara ringkas dan wajar.
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: dan biarlah dia membawa saudara kalian
  rationale: לָקַח pada dasarnya berarti “mengambil”, tetapi dalam konteks ini orang tersebut harus menjemput saudara mereka lalu membawanya kepada Yusuf. “Membawa” menyatakan arah yang dimaksud tanpa mengaburkan arti harfiahnya, yang dicatat dalam catatan kaki.
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: sementara kalian tetap ditahan
  rationale: Imperatif Nifal dari אָסַר menyatakan bahwa mereka harus berada dalam keadaan terikat atau ditahan. “Tetap ditahan” wajar dalam bahasa Indonesia dan “sementara” memperjelas hubungan situasional dengan pengutusan satu orang.
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: supaya perkataan kalian diuji
  rationale: Bentuk Nifal יִבָּחֲנוּ berarti diuji atau diperiksa. “Perkataan kalian” mempertahankan ungkapan Ibrani tanpa mempersempitnya menjadi “cerita” atau “pengakuan”.
- source_word: הַאֱמֶת אִתְּכֶם
  choice: apakah kebenaran ada pada kalian
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani, secara harfiah “apakah kebenaran bersama/pada kalian”, sambil tetap dapat dipahami sebagai pertanyaan apakah ucapan mereka benar.
- source_word: וְאִם לֹא
  choice: Namun, jika tidak
  rationale: Frasa ini memperkenalkan hasil sebaliknya apabila pengujian tidak membenarkan perkataan mereka. “Namun” menyampaikan peralihan adversatif dengan alami.
- source_word: חֵי פַרְעֹה
  choice: demi hidup Firaun
  rationale: Ini adalah rumusan sumpah yang secara harfiah mengacu pada hidup Firaun. Bentuk ini mempertahankan ciri budaya dan kekuatan sumpah dalam teks sumber.
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: kalian benar-benar mata-mata
  rationale: כִּי di sini bersifat menegaskan dalam kesimpulan tuduhan Yusuf. “Benar-benar” menyampaikan penegasan itu tanpa menambahkan kepastian teologis yang tidak ada dalam teks.
