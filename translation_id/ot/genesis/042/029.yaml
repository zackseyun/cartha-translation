  text: Then they came to Jacob their father in the land of Canaan and told him all that had happened to them[a], saying,
translation:
  language: id
  text: 'Kemudian mereka sampai kepada Yakub, ayah mereka, di tanah Kanaan, lalu menceritakan kepadanya segala sesuatu yang telah menimpa mereka, dengan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian mereka sampai
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; 'kemudian' menyatakan perkembangan narasi secara alami, sedangkan 'sampai' cocok untuk kedatangan di tujuan.
- source_word: אֶל יַעֲקֹב אֲבִיהֶם
  choice: kepada Yakub, ayah mereka
  rationale: Preposisi אֶל menunjukkan arah kepada seseorang; aposisi 'ayah mereka' mempertahankan hubungan kekeluargaan dalam teks.
- source_word: אַרְצָה כְּנָעַן
  choice: di tanah Kanaan
  rationale: Akhiran direktif secara harfiah menyatakan gerak menuju tanah Kanaan. Namun, sesudah tujuan personal 'kepada Yakub', bahasa Indonesia alami menempatkan Yakub 'di tanah Kanaan' tanpa mengubah lokasi atau hasil geraknya.
- source_word: וַיַּגִּידוּ לוֹ
  choice: lalu menceritakan kepadanya
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. Dalam konteks mereka menguraikan pengalaman, 'menceritakan' adalah padanan Indonesia yang alami.
- source_word: אֵת כָּל הַקֹּרֹת אֹתָם
  choice: segala sesuatu yang telah menimpa mereka
  rationale: Partisip dari קרה menunjuk pada hal-hal yang terjadi atau menimpa seseorang; 'telah menimpa' mempertahankan nuansa bahwa peristiwa-peristiwa itu dialami oleh mereka.
- source_word: לֵאמֹר
  choice: Kata mereka,
  rationale: Bentuk ini memperkenalkan perkataan langsung pada ayat berikutnya. 'Kata mereka,' lebih alami daripada bentuk partisipial kaku dalam bahasa Indonesia dan tetap menandai kelanjutan kutipan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan urutan narasi atau keterangan geografis. Tidak diperlukan catatan kaki karena peralihan dari arah harfiah 'ke tanah Kanaan' menjadi lokasi idiomatis 'di tanah Kanaan' tidak menimbulkan perbedaan makna yang cukup penting dalam bahasa Indonesia.
