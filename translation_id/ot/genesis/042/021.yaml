  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו אֲבָל֮ אֲשֵׁמִ֣ים אֲנַחְנוּ֮ עַל אָחִי/נוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛/וֹ בְּ/הִתְחַֽנְנ֥/וֹ אֵלֵ֖י/נוּ וְ/לֹ֣א שָׁמָ֑עְנוּ עַל כֵּן֙ בָּ֣אָה אֵלֵ֔י/נוּ הַ/צָּרָ֖ה הַ/זֹּֽאת־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/021.yaml
  text: Then they said to one another[a], “Indeed, we are guilty concerning our brother, because we saw the distress of his soul when he pleaded with us, and we did not listen[b]. Therefore this distress has come upon us.”
translation:
  language: id
  text: Lalu mereka berkata satu sama lain, “Sungguh, kita bersalah terhadap saudara kita, karena kita melihat kesesakan jiwanya[a] ketika ia memohon-mohon kepada kita, dan kita tidak mengindahkannya. Itulah sebabnya kesesakan ini[b] menimpa kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kesesakan jiwanya,” yaitu penderitaan batin yang mendalam.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata yang sama untuk “kesesakan” Yusuf dan “kesesakan” yang kini dialami saudara-saudaranya, sehingga menghubungkan kekejaman mereka dahulu dengan penderitaan mereka sekarang.
    reason: wordplay
lexical_decisions:
- source_word: וַיֹּאמְרוּ אִישׁ אֶל־אָחִיו
  choice: Lalu berkatalah mereka seorang kepada yang lain
  rationale: Ungkapan distributif Ibrani menyatakan bahwa saudara-saudara itu berbicara di antara mereka; bentuk ini alami, bermartabat, dan mempertahankan nuansa timbal balik.
- source_word: אֲבָל
  choice: Sungguh
  rationale: Di sini kata tersebut menegaskan pengakuan yang sungguh-sungguh, bukan menyatakan pertentangan.
- source_word: אֲשֵׁמִים אֲנַחְנוּ עַל־אָחִינוּ
  choice: kita bersalah terhadap saudara kita
  rationale: אֲשֵׁמִים menyatakan kesalahan atau tanggung jawab moral, sedangkan עַל dalam konteks ini menunjuk kepada orang yang menjadi sasaran kesalahan mereka.
- source_word: צָרַת נַפְשׁוֹ
  choice: kesesakan jiwanya
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani secara transparan sekaligus menyampaikan penderitaan batin yang mendalam.
- source_word: בְּהִתְחַנְנוֹ אֵלֵינוּ
  choice: ketika ia memohon-mohon kepada kita
  rationale: Bentuk verba menyampaikan permohonan yang sungguh-sungguh; pengulangan 'memohon-mohon' mengungkapkan intensitas tanpa menambahkan objek yang tidak disebutkan.
- source_word: וְלֹא שָׁמָעְנוּ
  choice: tetapi kita tidak mendengarkannya
  rationale: שׁמע di sini berarti mengindahkan, bukan hanya mendengar secara fisik; 'tetapi' menyatakan kontras alami antara permohonannya dan tanggapan mereka.
- source_word: עַל־כֵּן
  choice: Itulah sebabnya
  rationale: Frasa ini menandai akibat yang menurut mereka timbul dari kesalahan terdahulu.
- source_word: בָּאָה אֵלֵינוּ הַצָּרָה הַזֹּאת
  choice: kesesakan ini menimpa kita
  rationale: Pemakaian 'kesesakan' mempertahankan kaitan leksikal dengan צָרַת sebelumnya, sedangkan 'menimpa kita' menyampaikan idiom kedatangan malapetaka secara alami.
theological_decisions:
- issue: Hubungan antara kesalahan masa lalu dan penderitaan sekarang
  choice: Mempertahankan kesimpulan para saudara dengan 'Itulah sebabnya'
  alternative: Menyatakannya sebagai penilaian narator atau hukuman ilahi yang eksplisit
  rationale: Ayat ini mencatat penafsiran para saudara atas keadaan mereka; teks tidak secara eksplisit menyebut Allah sebagai pelaku dalam kalimat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'kita' dipakai karena para pembicara mengakui kesalahan bersama kepada sesama anggota kelompok. Pengulangan 'kesesakan' disengaja untuk mempertahankan gema leksikal teks Ibrani.
