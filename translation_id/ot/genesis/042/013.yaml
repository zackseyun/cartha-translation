  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: id
  text: Lalu kata mereka, “Kami, hamba-hambamu ini, dua belas bersaudara, anak-anak lelaki dari satu ayah di tanah Kanaan. Sekarang, yang bungsu bersama ayah kami, dan yang seorang lagi sudah tidak ada.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang seorang lagi tidak ada”; ungkapan halus yang dapat berarti “telah pergi/hilang” atau menyiratkan bahwa ia sudah meninggal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu kata mereka
  rationale: Menyampaikan kelanjutan narasi wayyiqtol secara alami dalam bahasa Indonesia tanpa memberi urutan waktu yang berlebihan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam konteks ini ungkapan tersebut merupakan bentuk merendahkan diri di hadapan penguasa, bukan pernyataan bahwa mereka benar-benar budak.
- source_word: שְׁנֵים עָשָׂר ... אַחִים אֲנַחְנוּ
  choice: kami ... dua belas bersaudara
  rationale: Mengungkapkan jumlah dan hubungan persaudaraan mereka dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: anak-anak lelaki dari satu ayah
  rationale: Mempertahankan rujukan maskulin dan menegaskan bahwa mereka semua berasal dari ayah yang sama; ungkapan ini lebih alami daripada terjemahan harfiah 'anak-anak lelaki dari satu orang laki-laki'.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur eksplisit אֶרֶץ, 'tanah/negeri', dalam bentuk Indonesia yang ringkas dan wajar.
- source_word: וְהִנֵּה
  choice: Sekarang
  rationale: Dalam konteks penjelasan langsung ini, הִנֵּה menyoroti keadaan terkini. 'Sekarang' alami dalam bahasa Indonesia dan menghindari seruan kaku seperti 'lihatlah'.
- source_word: הַקָּטֹן
  choice: yang bungsu
  rationale: Konteks keluarga menunjukkan saudara paling muda, bukan sekadar orang yang kecil.
- source_word: אֶת אָבִינוּ
  choice: bersama ayah kami
  rationale: אֶת di sini menyatakan kebersamaan, bukan penanda objek langsung.
- source_word: הַיּוֹם
  choice: sekarang
  rationale: Dalam tuturan ini הַיּוֹם menyatakan keadaan pada waktu mereka berbicara; 'sekarang' lebih alami daripada 'hari ini' tanpa mengubah acuannya.
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: dan yang seorang lagi sudah tidak ada
  rationale: Mempertahankan ungkapan halus dan ambigu dalam bahasa Ibrani, yang dapat menunjuk pada ketidakhadiran atau menyiratkan kematian.
theological_decisions:
- issue: Bahasa kekerabatan bergender
  choice: anak-anak lelaki dari satu ayah
  alternative: anak-anak dari satu ayah
  rationale: Teks Ibrani secara khusus memakai bentuk maskulin dan narasi merujuk kepada putra-putra Yakub, sehingga penghalusan menjadi netral tidak diperlukan.
- issue: Ambiguitas keadaan Yusuf dalam אֵינֶנּוּ
  choice: sudah tidak ada
  alternative: sudah meninggal
  rationale: Ucapan para saudara bersifat eufemistis dan tidak secara tegas menyatakan kematian. Terjemahan mempertahankan ketegangan antara tidak hadir, hilang, dan dianggap mati.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'hamba-hambamu' mempertahankan kesantunan merendah dalam tuturan istana. Penanda presentasional וְהִנֵּה dipadukan secara alami dengan keterangan waktu הַיּוֹם menjadi 'Sekarang', sedangkan ambiguitas akhir ayat dipertahankan dan dijelaskan dalam catatan kaki.
