  yaml_path: translation/ot/genesis/042/018.yaml
  text: On the third day Joseph said to them[a], “Do this and live, for I fear God.
translation:
  language: id
  text: Pada hari ketiga Yusuf berkata kepada mereka, “Lakukanlah ini dan hiduplah[a], sebab aku takut akan Allah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lakukanlah ini supaya kalian hidup”; bahasa Ibrani dapat menyatakan perintah langsung yang diikuti akibatnya atau hasil yang tersirat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: Yusuf berkata kepada mereka
  rationale: Bentuk naratif וַיֹּאמֶר secara wajar diterjemahkan 'berkata'; אֲלֵהֶם menyatakan pihak yang diajak bicara.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Ungkapan waktu Ibrani ini paling alami dan tepat diterjemahkan demikian dalam bahasa Indonesia modern.
- source_word: זֹאת עֲשׂוּ
  choice: Lakukanlah ini
  rationale: Mempertahankan demonstrativa dan bentuk perintah secara ringkas dan alami.
- source_word: וִחְיוּ
  choice: dan tetaplah hidup
  rationale: Bentuk imperatif yang dirangkaikan dengan perintah sebelumnya dapat menyatakan perintah beserta akibat atau hasilnya. 'Tetaplah hidup' sesuai dengan konteks penyelamatan nyawa, sementara catatan kaki mempertahankan kemungkinan nuansa hasil.
- source_word: אֶת הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi Kejadian, bentuk definit ini menunjuk kepada Allah yang esa; bahasa Indonesia secara alami memakai 'Allah' tanpa artikel.
- source_word: אֲנִי יָרֵא
  choice: sebab aku takut akan
  rationale: Partisip predikatif dengan pronomina eksplisit menyatakan sikap hormat yang mencirikan Yusuf. 'Sebab' mengungkapkan hubungan penjelas dalam konteks, dan 'takut akan Allah' merupakan ungkapan Indonesia yang wajar untuk rasa gentar dan hormat kepada-Nya.
theological_decisions:
- issue: Makna pengakuan אֶת הָאֱלֹהִים אֲנִי יָרֵא
  choice: Yusuf menyatakan bahwa ia takut akan Allah sebagai dasar bagi perlakuannya yang menjaga kehidupan mereka.
  alternative: Yusuf sekadar menyebut rasa takut kepada suatu ilah dalam lingkungan istana Mesir.
  rationale: Konteks Kejadian menggambarkan Yusuf mengakui dan melayani Allah. Namun, teks utama tidak menambahkan penjelasan teologis di luar pengakuan ringkas bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk 'kalian' hanya dipakai dalam catatan untuk memperjelas bahwa verba Ibrani berbentuk jamak; teks utama mempertahankan ungkapan ringkas. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskan.
