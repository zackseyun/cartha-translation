  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: id
  text: 'Dengan ini kalian akan diuji: Demi hidup Firaun,[a] kalian tidak akan pergi dari sini kecuali adik laki-laki kalian yang paling bungsu datang ke sini.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bagian berikutnya berbunyi “jika kalian pergi dari sini”; dalam rumus sumpah ini, “jika” menyatakan penegasan negatif yang kuat: “kalian tidak akan pergi dari sini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Dengan cara inilah
  rationale: Preposisi instrumental ב dengan demonstrativa זאת menunjukkan cara atau tolok ukur pengujian; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: תִּבָּחֵנוּ
  choice: kalian akan diuji
  rationale: Bentuk nifal dari בחן menyatakan bahwa mereka akan diuji atau diperiksa untuk membuktikan kebenaran pengakuan mereka.
- source_word: חֵי פַרְעֹה
  choice: Demi hidup Firaun
  rationale: Ini mempertahankan bentuk dan daya ungkapan sumpah Ibrani yang menyerukan hidup Firaun sebagai jaminan.
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: kalian tidak akan pergi dari sini
  rationale: Sesudah rumus sumpah, אִם berfungsi sebagai penegasan negatif eliptis, bukan sebagai syarat biasa; terjemahan ini menyampaikan larangan atau kepastian negatif tersebut.
- source_word: כִּי אִם
  choice: kecuali
  rationale: Gabungan partikel ini memperkenalkan satu-satunya pengecualian terhadap pernyataan negatif sebelumnya.
- source_word: בְּבוֹא
  choice: datang
  rationale: Infinitif dengan ב menyatakan keadaan atau syarat terjadinya keberangkatan; verba finit sesudah 'kecuali' lebih alami dalam bahasa Indonesia.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: adik bungsu kalian
  rationale: Dalam konteks hubungan saudara, הַקָּטֹן menunjuk saudara laki-laki yang paling muda, yaitu Benyamin; 'adik bungsu' paling idiomatis.
- source_word: הֵנָּה
  choice: ke sini
  rationale: Adverbia ini memiliki nuansa arah menuju tempat pembicara, sehingga 'ke sini' lebih tepat daripada sekadar 'di sini'.
