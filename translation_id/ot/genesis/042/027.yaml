  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּפְתַּ֨ח הָ/אֶחָ֜ד אֶת שַׂקּ֗/וֹ לָ/תֵ֥ת מִסְפּ֛וֹא לַ/חֲמֹר֖/וֹ בַּ/מָּל֑וֹן וַ/יַּרְא֙ אֶת כַּסְפּ֔/וֹ וְ/הִנֵּה ה֖וּא בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: id
  text: Kemudian salah seorang dari mereka membuka karungnya untuk memberi makan keledainya di tempat mereka bermalam. Ia melihat uang peraknya[a]; ternyata uang itu ada di mulut kantongnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Uang perak ini adalah uang yang telah dibayarkannya untuk membeli gandum.
    reason: cultural_note
  - marker: b
    text: Atau, “di bukaan kantongnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: membuka
  rationale: Padanan langsung verba פתח dalam bentuk naratif; alami untuk tindakan membuka karung.
- source_word: הָאֶחָד
  choice: salah seorang dari mereka
  rationale: Secara harfiah berarti 'yang satu'; konteks menunjukkan salah seorang dari saudara-saudara itu.
- source_word: שַׂקּוֹ
  choice: karungnya
  rationale: שַׂק menunjuk pada karung untuk membawa muatan dan dibedakan dari אַמְתַּחַת pada akhir ayat.
- source_word: לָתֵת מִסְפּוֹא
  choice: untuk memberi makan
  rationale: מִסְפּוֹא adalah pakan ternak; ungkapan 'memberi makan' paling alami dalam bahasa Indonesia ketika penerimanya disebutkan.
- source_word: לַחֲמֹרוֹ
  choice: keledainya
  rationale: Lamed menandai penerima; bersama 'memberi makan' bentuk ini alami dan jelas.
- source_word: בַּמָּלוֹן
  choice: di tempat mereka bermalam
  rationale: מָלוֹן adalah tempat singgah atau bermalam dan tidak harus berarti penginapan komersial.
- source_word: וַיַּרְא אֶת־כַּסְפּוֹ
  choice: Ia melihat uang peraknya
  rationale: כֶּסֶף secara konkret berarti perak dan dalam konteks ini merupakan uang pembayaran; 'uang perak' mempertahankan kedua unsur makna.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Menandai penemuan yang mengejutkan; 'ternyata' menyampaikan daya naratifnya secara alami dalam bahasa Indonesia modern.
- source_word: בְּפִי
  choice: di mulut
  rationale: Mempertahankan metafora Ibrani 'mulut' untuk bukaan wadah, dengan catatan yang menjelaskan artinya.
- source_word: אַמְתַּחְתּוֹ
  choice: kantongnya
  rationale: Istilah wadah yang berbeda dari שַׂק; 'kantong' mempertahankan pembedaan leksikal dari 'karung'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan pembedaan antara שַׂק ('karung') dan אַמְתַּחַת ('kantong'). Metafora Ibrani 'mulut kantong' dipertahankan dalam teks dan dijelaskan dalam catatan.
