base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/009.yaml
  text: Then Joseph remembered the dreams that he had dreamed about them[a], and he said to them, “You are spies; you have come to see the nakedness of the land.”
translation:
  language: id
  text: Lalu Yusuf teringat pada mimpi-mimpi yang pernah dimimpikannya tentang mereka. Ia berkata kepada mereka, “Kalian mata-mata! Kalian datang untuk melihat bagian-bagian negeri ini yang terbuka[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketelanjangan negeri,” yaitu bagian-bagian negeri yang terbuka, lemah, atau tidak terlindungi dari serangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: teringat
  rationale: Bentuk wayyiqtol dari זכר menuturkan bahwa pada saat itu mimpi-mimpi tersebut muncul kembali dalam ingatan Yusuf; “teringat” alami dalam narasi Indonesia.
- source_word: הַחֲלֹמוֹת אֲשֶׁר חָלַם
  choice: mimpi-mimpi yang pernah dimimpikannya
  rationale: Ungkapan ini mempertahankan pengulangan akar חלם secara wajar dalam bahasa Indonesia, sedangkan “pernah” menandai bahwa mimpi itu terjadi sebelumnya.
- source_word: לָהֶם
  choice: tentang mereka
  rationale: Dalam konteks ini mimpi-mimpi Yusuf berkaitan dengan saudara-saudaranya; “tentang mereka” menyampaikan hubungan tersebut tanpa memaksakan arti harfiah datif.
- source_word: מְרַגְּלִים
  choice: mata-mata
  rationale: Partisipel dari רגל di sini menunjuk kepada orang yang melakukan kegiatan pengintaian rahasia; “mata-mata” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini secara langsung berarti “melihat”; terjemahan tersebut mempertahankan susunan Ibrani sementara konteks tuduhan memberi nuansa mengintai atau memeriksa.
- source_word: עֶרְוַת הָאָרֶץ
  choice: bagian-bagian negeri ini yang terbuka
  rationale: Secara harfiah frasa ini berarti “ketelanjangan negeri,” tetapi secara idiomatis menunjuk kepada bagian yang terbuka, lemah, atau tidak terlindungi. Teks utama menyampaikan maksud idiom secara alami, sementara catatan kaki mempertahankan citra Ibraninya.
- source_word: בָּאתֶם
  choice: kalian datang
  rationale: Bentuk perfek dalam tuduhan langsung ini menyatakan tindakan kedatangan yang telah terjadi dan kini menjadi dasar tuduhan; “kalian datang” paling alami dalam dialog Indonesia.
