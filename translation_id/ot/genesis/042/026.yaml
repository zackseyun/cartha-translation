  text: Then they loaded their grain onto their donkeys and went from there[a].
translation:
  language: id
  text: Kemudian mereka memuat gandum mereka ke atas keledai mereka, lalu berangkat dari sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bekal mereka” atau “gandum yang mereka beli.” Istilah Ibrani ini dapat berarti persediaan makanan, tetapi dalam konteks ini paling wajar menunjuk pada gandum yang diperoleh di Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: mereka memuat
  rationale: Kata kerja נשׂא secara dasar berarti mengangkat atau membawa, tetapi dalam konteks menempatkan barang pada hewan angkut, “memuat” menyampaikan makna idiomatisnya secara alami.
- source_word: שִׁבְרָם
  choice: gandum mereka
  rationale: Dalam kisah Yusuf, שֶׁבֶר lazim menunjuk pada gandum yang diperoleh atau dibeli pada masa kelaparan. Ungkapan ini ringkas dan sesuai dengan konteks.
- source_word: עַל חֲמֹרֵיהֶם
  choice: ke atas keledai-keledai mereka
  rationale: Dengan kata kerja pemuatan, עַל menyatakan penempatan muatan pada hewan. Bentuk ulang “keledai-keledai” mempertahankan jamak Ibrani secara jelas.
- source_word: וַיֵּלְכוּ
  choice: lalu berangkat
  rationale: הלך adalah verba gerak umum; dalam konteks meninggalkan suatu tempat setelah memuat barang, “berangkat” terdengar alami dan menyatakan keberangkatan tanpa menambahkan tujuan.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan deiktis langsung yang jelas dan alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Lalu berangkat” dipilih untuk menghindari ungkapan kurang alami “pergi dari sana,” sedangkan penanda urutan naratif tetap dipertahankan.
