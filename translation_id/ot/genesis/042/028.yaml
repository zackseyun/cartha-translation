base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: id
  text: Ia berkata kepada saudara-saudaranya, “Perakku telah dikembalikan! Lihat, perak itu bahkan ada di dalam karungku!” Lalu hati mereka ciut[a], dan mereka gemetar. Setiap orang berkata kepada saudaranya[b], “Apa ini yang Allah lakukan terhadap kita?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hati mereka keluar”; atau, “keberanian mereka lenyap.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “satu sama lain.” Secara harfiah, “setiap orang kepada saudaranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: telah dikembalikan
  rationale: Bentuk Hofal dari שוב menyatakan tindakan pasif; bentuk ‘telah dikembalikan’ cocok dengan ujaran langsung tentang keadaan yang baru diketahui.
- source_word: כַּסְפִּי
  choice: perakku
  rationale: כֶּסֶף secara harfiah berarti ‘perak’ dan dalam konteks ini menunjuk pada alat pembayaran; ‘perak’ mempertahankan gambaran konkret dan latar kuno.
- source_word: אַמְתַּחַת
  choice: karung
  rationale: Kata ini menunjuk pada wadah untuk membawa gandum atau bekal; ‘karung’ alami dalam konteks perjalanan para saudara Yusuf.
- source_word: וְגַם הִנֵּה
  choice: Lihat, perak itu bahkan ada
  rationale: ‘Lihat’ menyampaikan daya deiktis הִנֵּה, sedangkan ‘bahkan’ mempertahankan penekanan dan keterkejutan dari גַם.
- source_word: וַיֵּצֵא לִבָּם
  choice: hati mereka ciut
  rationale: Ungkapan harfiahnya ‘hati mereka keluar’; idiom Indonesia ‘hati mereka ciut’ menyampaikan hilangnya keberanian sambil mempertahankan citra hati.
- source_word: וַיֶּחֶרְדוּ
  choice: mereka gemetar
  rationale: חרד menggambarkan gemetar karena takut atau cemas; terjemahan ini mempertahankan unsur jasmani dan emosional tanpa menambahkan penafsiran.
- source_word: אִישׁ אֶל אָחִיו
  choice: seorang kepada saudaranya
  rationale: Terjemahan ini mempertahankan bentuk distributif dan hubungan saudara laki-laki dalam teks sumber; catatan kaki memberikan padanan Indonesia yang lebih idiomatis.
- source_word: מַה זֹּאת
  choice: Apa ... ini?
  rationale: Bentuk pertanyaan seruan ini diterjemahkan langsung dan tidak diubah menjadi pertanyaan ‘mengapa’, sehingga ketegangan maknanya tetap terjaga.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Sintaksis dan konteks narasi menunjuk kepada satu Allah; ‘Allah’ merupakan sebutan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam pertanyaan penuh ketakutan para saudara Yusuf
  choice: Allah
  alternative: allah atau ilah-ilah
  rationale: Walaupun bentuk katanya secara morfologis jamak, sintaksis dan konteks mendukung rujukan tunggal kepada Allah. Terjemahan ini mengakui bahwa mereka melihat peristiwa itu sebagai tindakan ilahi tanpa menjelaskan lebih jauh maksud tindakan tersebut.
- issue: Ungkapan relasional bergender אִישׁ אֶל אָחִיו
  choice: seorang kepada saudaranya
  alternative: satu sama lain
  rationale: Teks sumber memakai bentuk maskulin tunggal secara distributif dan berbicara tentang saudara-saudara laki-laki Yusuf; pilihan utama mempertahankan rincian itu, sementara alternatif idiomatis dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Ujaran langsung dibuat hidup tanpa menghilangkan pengulangan dan keterkejutan teks Ibrani. Citra ‘hati’ dipertahankan melalui idiom Indonesia, sedangkan arti harfiahnya dicatat. Semua penanda catatan kaki ditempatkan tepat pada frasa yang diterangkan.
