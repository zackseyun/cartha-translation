    issue: “Apa yang telah Allah lakukan ...” lebih interpretatif dari aspek sumber.
    rationale: 'Perfektif Indonesia “telah” menampilkan tindakan sebagai sudah rampung. Pertanyaan Ibrani dapat mempertahankan ketakjuban langsung tanpa penandaan aspek tambahan: “Apa ini yang Allah lakukan terhadap kita?”'
