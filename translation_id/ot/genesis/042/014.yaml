  text: Joseph said to them[a], “It is as I said to you, saying[b], ‘You are spies.’”
translation:
  language: id
  text: 'Yusuf berkata kepada mereka, “Memang seperti yang telah kukatakan kepada kalian: ‘Kalian adalah mata-mata.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi; dalam bahasa Indonesia modern, konjungsi waw tidak perlu diterjemahkan secara kaku.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Menerjemahkan preposisi אֶל dengan sufiks orang ketiga jamak secara langsung dan alami.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Mengikuti bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: הוּא אֲשֶׁר
  choice: Memang seperti yang
  rationale: Ungkapan penegas ini meneguhkan kembali perkataan Yusuf sebelumnya; 'memang seperti yang' menyampaikan penekanan itu secara wajar.
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: telah kukatakan kepada kalian
  rationale: Dalam konteks ujaran yang dikutip, דבר paling alami diterjemahkan 'mengatakan'; bentuk perfektif menunjuk kepada pernyataan Yusuf yang sudah disampaikan.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif ini memperkenalkan isi ucapan. Tanda titik dua menjalankan fungsi tersebut secara alami tanpa menghasilkan ungkapan berulang 'mengatakan ... demikian'.
- source_word: מְרַגְּלִים
  choice: mata-mata
  rationale: Partisipel dari רגל di sini menunjuk kepada orang yang mengintai; 'mata-mata' adalah padanan Indonesia yang jelas dan idiomatis.
- source_word: אַתֶּם
  choice: kalian adalah
  rationale: Pronomina mandiri orang kedua maskulin jamak memberi penegasan pada subjek; 'kalian' tepat untuk sekelompok saudara Yusuf, sedangkan kopula diperlukan agar kalimat Indonesia jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur Ibrani yang harfiah dan berulang (‘yang telah kukatakan ... dengan mengatakan’) dialihkan menjadi titik dua, sementara daya penegas הוּא אֲשֶׁר dipertahankan melalui kata ‘memang’.
