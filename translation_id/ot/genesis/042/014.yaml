  source_fidelity: Terjemahan ini setia pada Ibrani. הוּא אֲשֶׁר דִּבַּרְתִּי ... לֵאמֹר diterjemahkan secara idiomatis sebagai “Memang seperti yang telah kukatakan kepada kalian:”, dengan titik dua yang secara tepat memperkenalkan isi tuduhan. “Kalian adalah mata-mata” merepresentasikan מְרַגְּלִים אַתֶּם dengan jelas.
  naturalness: Bahasa Indonesia modernnya lancar, lugas, dan sesuai register naratif-dialogis. “Kepada mereka,” “kepada kalian,” serta kutipan langsungnya terdengar alami tanpa menghilangkan penegasan ujaran Yusuf.
  terminology: “Yusuf” adalah bentuk nama yang lazim dan baku dalam penggunaan Alkitab bahasa Indonesia. “Mata-mata” merupakan padanan yang tepat bagi מְרַגְּלִים dalam konteks ini. Pemakaian “kalian” tepat untuk lawan bicara jamak dan konsisten dengan nada konfrontatif percakapan.
