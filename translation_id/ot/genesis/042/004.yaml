  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: id
  text: Namun, Yakub tidak menyuruh Benyamin, saudara Yusuf, pergi bersama saudara-saudaranya, sebab katanya, “Jangan-jangan ia ditimpa malapetaka.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kemalangan menimpanya.”
    reason: Alternatif leksikal untuk אָסוֹן dan ungkapan יִקְרָאֶנּוּ אָסוֹן; mempertahankan cakupan makna yang mungkin tanpa mempersempit jenis bahaya.
lexical_decisions:
- source_word: וְ/אֶת
  choice: Namun
  rationale: 'Konjungsi וְ menghubungkan ayat ini dengan ayat sebelumnya sekaligus menandai kontras: saudara-saudara yang lain pergi, tetapi Benyamin tidak. Penanda objek אֶת tidak diterjemahkan tersendiri.'
- source_word: בִּנְיָמִין
  choice: Benyamin
  rationale: Bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: אֲחִי יוֹסֵף
  choice: saudara Yusuf
  rationale: Menerjemahkan rangkaian konstruksi secara langsung dan alami serta secara khusus mengaitkan Benyamin dengan Yusuf.
- source_word: לֹא שָׁלַח
  choice: tidak menyuruh ... pergi
  rationale: Dalam konteks pengutusan bersama rombongan, ungkapan ini menyampaikan makna שׁלח secara alami dalam bahasa Indonesia dan menghindari kesan bahwa Yakub sekadar mengirim barang.
- source_word: אֶת אֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Konteks menuntut pengertian bahwa Benyamin tidak diikutsertakan bersama saudara-saudaranya; 'bersama' membuat relasi itu jelas dalam bahasa Indonesia.
- source_word: כִּי אָמַר
  choice: sebab katanya
  rationale: כִּי memberikan alasan, sedangkan אָמַר tetap diterjemahkan sebagai ujaran, bukan ditafsirkan sebagai pikiran.
- source_word: פֶּן
  choice: Jangan-jangan
  rationale: Ungkapan ini secara alami menyatakan kemungkinan yang dikhawatirkan dalam bahasa Indonesia modern.
- source_word: יִקְרָאֶנּוּ
  choice: ia ditimpa
  rationale: Dalam gabungan dengan אָסוֹן, bentuk ini secara idiomatis berarti suatu malapetaka terjadi atau menimpa dirinya.
- source_word: אָסוֹן
  choice: malapetaka
  rationale: Kata ini mencakup kemalangan atau bahaya serius tanpa menentukan secara sempit apakah yang dimaksud ialah cedera atau kematian.
