  to: Jika kalian jujur[a], biarlah salah seorang saudara kalian ditahan di tempat penahanan kalian[b], sedangkan kalian, pergilah dan bawalah gandum bagi kelaparan rumah tangga kalian.
  rationale: Revisi menghilangkan penegasan dan perluasan makna yang tidak diperlukan, memakai istilah domestik yang lebih dekat dengan teks sumber, serta memperbaiki keluwesan frasa penahanan. "Sedangkan kalian" menyampaikan kontras pragmatis antara saudara yang ditahan dan mereka yang diperintahkan pergi, tanpa mengubah makna dasar konjungsi Ibrani.
