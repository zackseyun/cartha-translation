base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/019.yaml
  text: If you are honest[a], let one of your brothers be confined in your place of custody, and you[c][b], go and bring grain for the famine of your households.
translation:
  language: id
  text: Jika kalian jujur[a], biarlah salah seorang saudara kalian ditahan di tempat penahanan kalian[b], sedangkan kalian, pergilah dan bawalah gandum bagi kelaparan rumah tangga kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika kalian berkata benar.” Kata Ibrani ini juga dapat diterjemahkan “benar” atau “dapat dipercaya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di rumah penahanan kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּנִים
  choice: memang jujur
  rationale: Dalam konteks pemeriksaan oleh Yusuf, kata ini menilai kebenaran pengakuan mereka. 'Jujur' alami dalam bahasa Indonesia, sedangkan 'memang' membantu menyampaikan penegasan pada ungkapan Ibrani.
- source_word: אֲחִיכֶם אֶחָד
  choice: seorang dari antara saudara-saudara kalian
  rationale: Menyatakan satu orang yang dipilih dari kelompok saudara itu dan mempertahankan nuansa partitif.
- source_word: יֵאָסֵר
  choice: ditahan
  rationale: Bentuk pasif dari אסר dapat berarti diikat atau dipenjarakan. 'Ditahan' sesuai dengan konteks penjagaan tanpa memastikan adanya pengikatan fisik.
- source_word: בְּבֵית מִשְׁמַרְכֶם
  choice: di tempat kalian ditahan
  rationale: Secara harfiah berarti 'di rumah/tempat penahanan kalian'. Terjemahan ini alami serta mempertahankan kemungkinan bahwa sufiksnya menunjuk pada tempat mereka sendiri sedang ditahan.
- source_word: וְאַתֶּם לְכוּ
  choice: Lalu kalian yang lain, pergilah
  rationale: Pronomina mandiri menonjolkan perbedaan antara satu saudara yang tinggal dan saudara-saudara lainnya yang pergi. 'Yang lain' membuat kontras tersirat itu jelas tanpa mengubah tindakan yang diperintahkan.
- source_word: הָבִיאוּ
  choice: bawalah
  rationale: Hifil בוא di sini menyatakan membawa gandum kembali kepada keluarga mereka.
- source_word: שֶׁבֶר
  choice: gandum
  rationale: Dalam kisah Yusuf, kata ini lazim menunjuk pada biji-bijian yang diperoleh untuk menghadapi bencana kelaparan; 'gandum' merupakan padanan Indonesia yang wajar dalam konteks ini.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: untuk mengatasi kelaparan keluarga-keluarga kalian
  rationale: Ungkapan Ibrani padat dan secara formal dapat dibaca 'kelaparan rumah tangga kalian'. Pilihan ini menyampaikan bahwa gandum diperlukan karena kelaparan yang menimpa rumah tangga mereka, tanpa menggambarkan rumah secara fisik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian', sesuai karena Yusuf berbicara kepada sekelompok saudara. Susunan dipecah menjadi dua kalimat agar perintah tetap jelas dan bermartabat. Semua penanda catatan kaki ditempatkan langsung dalam teks utama.
