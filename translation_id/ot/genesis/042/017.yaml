  text: And he put them in custody for three days[a].
translation:
  language: id
  text: Lalu Yusuf menahan mereka selama tiga hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu ia menempatkan mereka dalam tahanan selama tiga hari.” Kata kerja Ibrani itu secara harfiah berarti “mengumpulkan”, tetapi dalam ungkapan ini bermakna menempatkan atau mengurung dalam tahanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: menahan
  rationale: Secara harfiah verba אסף berarti “mengumpulkan”, tetapi bersama אֶל מִשְׁמָר ungkapan ini secara idiomatis berarti memasukkan atau menempatkan orang dalam tahanan. “Menahan” alami dalam bahasa Indonesia dan menyampaikan tindakan pengurungan tanpa mengartikannya terlalu spesifik sebagai pemenjaraan formal.
- source_word: אֹתָם
  choice: mereka
  rationale: Pronomina objek langsung maskulin jamak ini merujuk kepada saudara-saudara Yusuf.
- source_word: אֶל מִשְׁמָר
  choice: menahan
  rationale: Gabungan preposisi אֶל dengan מִשְׁמָר menunjukkan penempatan ke dalam keadaan atau tempat penjagaan. Dalam bahasa Indonesia, maknanya tersampaikan secara alami melalui verba “menahan”.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Frasa ini menyatakan rentang waktu; “selama tiga hari” merupakan ungkapan Indonesia yang alami dan tepat.
