  - severity: low
    issue: Letak “dari sana” kurang idiomatis dalam frasa pembelian.
    rationale: “Belilah gandum bagi kita dari sana” secara harfiah dapat dipahami, tetapi susunan “belilah gandum untuk kita di sana” lebih wajar dalam bahasa Indonesia. Dalam konteks ini, lokasi pembelian secara memadai menyatakan sumber gandum dari Mesir.
