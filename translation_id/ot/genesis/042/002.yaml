base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: id
  text: Katanya, “Lihat, aku telah mendengar bahwa ada gandum di Mesir. Turunlah ke sana dan belilah gandum untuk kita di sana, supaya kita tetap hidup dan tidak mati.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel wacana ini menarik perhatian kepada berita yang menyusul; “Lihat” mempertahankan daya langsungnya dalam bahasa Indonesia modern.
- source_word: שָׁמַעְתִּי
  choice: aku telah mendengar
  rationale: Bentuk perfektif menyatakan informasi yang sudah diterima dan masih relevan; bentuk ini wajar dan mempertahankan nuansa tersebut.
- source_word: שֶׁבֶר
  choice: gandum
  rationale: Dalam konteks kelaparan dan perdagangan di Mesir, kata ini menunjuk pada biji-bijian yang tersedia untuk dibeli; “gandum” merupakan padanan alami dalam konteks naratif Indonesia.
- source_word: רְדוּ
  choice: Pergilah ke sana
  rationale: Kata kerja secara harfiah menyatakan gerak turun menuju Mesir. Dalam bahasa Indonesia, “pergilah ke sana” lebih alami; nuansa geografis turun tidak menentukan makna perintah dalam konteks ini.
- source_word: וְשִׁבְרוּ
  choice: belilah gandum
  rationale: Dalam konteks ini verba שׁבר secara khusus berarti membeli biji-bijian. Objek dieksplisitkan agar maknanya jelas dan alami.
- source_word: לָנוּ
  choice: bagi kita
  rationale: Dativus keuntungan menyatakan bahwa pembelian itu dilakukan demi seluruh keluarga, termasuk penutur.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Preposisi מן dinyatakan secara eksplisit dan menunjukkan sumber gandum itu, yakni Mesir.
- source_word: וְנִחְיֶה
  choice: supaya kita tetap hidup
  rationale: Bentuk ini menyatakan tujuan atau hasil yang diharapkan. “Tetap hidup” terdengar alami dalam konteks bertahan melewati kelaparan.
- source_word: וְלֹא נָמוּת
  choice: dan tidak mati
  rationale: 'Terjemahan koordinatif mempertahankan kesejajaran dan urgensi ungkapan Ibrani: hidup dan tidak mati.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan keluarga memakai “aku/kita” agar alami dalam tuturan Yakub kepada anak-anaknya. Pengulangan “ke sana ... dari sana” dipertahankan karena kedua unsur arah dan sumber hadir dalam teks Ibrani.
