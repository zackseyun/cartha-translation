  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan 'yang seorang ... yang bungsu' mempertahankan kesejajaran dalam bahasa sumber, sedangkan 'sudah tidak ada' menjaga ambiguitas idiom Ibraninya.
