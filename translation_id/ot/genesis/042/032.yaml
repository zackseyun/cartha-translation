  yaml_path: translation/ot/genesis/042/032.yaml
  text: We are twelve brothers[a], sons of our father. One is no more[b], and the youngest is with our father today in the land of Canaan.
translation:
  language: id
  text: Kami dua belas saudara laki-laki, putra-putra ayah kami. Yang seorang tidak ada[a], sedangkan yang bungsu bersama ayah kami hari ini di tanah Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang seorang tidak ada.” Ungkapan Ibrani ini dapat berarti bahwa orang tersebut hilang, tidak berada di tempat, atau dianggap sudah meninggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵים עָשָׂר אֲנַחְנוּ אַחִים
  choice: Kami dua belas bersaudara
  rationale: Menyampaikan klausa nominal Ibrani secara alami dalam bahasa Indonesia dan tetap menegaskan jumlah dua belas saudara laki-laki.
- source_word: בְּנֵי אָבִינוּ
  choice: anak-anak ayah kami
  rationale: Mempertahankan keterangan aposisional bahwa mereka semua adalah putra dari ayah yang sama, tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: הָאֶחָד אֵינֶנּוּ
  choice: Yang seorang sudah tidak ada
  rationale: 'Ungkapan ini mempertahankan idiom Ibrani dan ketidakpastiannya: saudara itu tidak hadir dan dianggap telah tiada, tetapi teks tidak secara eksplisit mengatakan bahwa ia mati.'
- source_word: וְהַקָּטֹן
  choice: sedangkan yang bungsu
  rationale: Dalam konteks urutan saudara, kata yang secara harfiah berarti 'yang kecil/muda' menunjuk kepada saudara termuda.
- source_word: הַיּוֹם אֶת אָבִינוּ
  choice: hari ini bersama ayah kami
  rationale: הַיּוֹם diterjemahkan langsung sebagai 'hari ini', dan אֶת di sini menyatakan kebersamaan, bukan penanda objek langsung.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Mempertahankan unsur 'tanah/negeri' dalam frasa Ibrani dengan ungkapan Indonesia yang wajar.
