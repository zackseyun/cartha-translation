  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: id
  text: Ketika Yakub melihat bahwa ada gandum di Mesir, ia berkata kepada putra-putranya, “Mengapa kalian berpandang-pandangan saja?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mengapa kalian memperlihatkan diri?” Kata kerja Ibrani ini dapat dipahami secara berbeda, tetapi dalam konteks ini kemungkinan besar menunjuk pada mereka yang berpandang-pandangan dalam keraguan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika ... mengetahui
  rationale: Secara harfiah berarti ‘melihat’, tetapi di sini menunjuk pada diketahuinya kabar bahwa gandum tersedia di Mesir. ‘Ketika ... mengetahui’ menyampaikan persepsi itu secara alami dan menghubungkannya dengan perkataan berikutnya.
- source_word: כִּי יֶשׁ
  choice: bahwa ada
  rationale: כִּי memperkenalkan isi yang diketahui Yakub, sedangkan יֵשׁ menyatakan keberadaan atau ketersediaan.
- source_word: שֶׁבֶר
  choice: gandum
  rationale: Dalam kisah Yusuf, kata ini mengacu pada biji-bijian yang tersedia untuk dibeli pada masa kelaparan; ‘gandum’ merupakan padanan Indonesia yang alami dalam konteks ini.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Mempertahankan fungsi lokatif biasa dari preposisi בְּ.
- source_word: לְבָנָיו
  choice: kepada anak-anaknya
  rationale: Dalam konteks ini yang dimaksud ialah putra-putra Yakub. Bahasa Indonesia lazim menyebut putra seseorang sebagai ‘anak-anaknya’ ketika rujukannya sudah jelas dari narasi.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya sebab.
- source_word: תִּתְרָאוּ
  choice: kalian hanya berpandang-pandangan
  rationale: 'Bentuk hitpael ini paling mungkin bersifat timbal balik: saudara-saudara itu saling memandang dalam kebimbangan tanpa bertindak. Kata ‘hanya’ mengungkapkan teguran terhadap sikap pasif yang tersirat oleh konteks.'
