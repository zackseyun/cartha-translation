base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: id
  text: Kami semua adalah putra dari satu ayah. Kami orang jujur[a]; hamba-hambamu bukan mata-mata.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang tulus”, “orang lurus”, atau “orang yang dapat dipercaya”. Kata Ibrani ini mempertentangkan ketulusan mereka dengan tuduhan bahwa mereka mata-mata.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tidak pernah menjadi mata-mata” atau “bukan orang yang memata-matai”. Konstruksi Ibraninya dapat menyatakan keadaan atau kegiatan mereka tanpa harus ditampilkan dengan penanda waktu tertentu dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: kami semua
  rationale: Menyatakan keseluruhan kelompok yang sedang berbicara; susunan ini alami dalam bahasa Indonesia dan tetap memberi penekanan pada semua anggota kelompok.
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: anak laki-laki dari satu orang ayah
  rationale: Secara harfiah menyatakan bahwa mereka adalah putra-putra dari satu laki-laki. 'Anak laki-laki' mempertahankan rujukan maskulin, sedangkan 'ayah' menyampaikan hubungan keluarga yang jelas dalam konteks ini.
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: kami ... kami
  rationale: Kedua pronomina mandiri dalam bahasa Ibrani bersifat tegas. Pengulangan 'kami' dipertahankan agar pembelaan mereka tetap terasa kuat.
- source_word: כֵּנִים
  choice: orang jujur
  rationale: Dalam konteks tuduhan sebagai mata-mata, kata ini menggambarkan orang yang dapat dipercaya, tulus, atau berkata benar. 'Orang jujur' merupakan ungkapan Indonesia yang alami tanpa mempersempit maknanya secara berlebihan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Di hadapan penguasa, istilah ini berfungsi sebagai sebutan merendahkan diri dan penuh hormat, bukan terutama sebagai penegasan status perbudakan.
- source_word: מְרַגְּלִים
  choice: mata-mata
  rationale: Kata ini menunjuk pada orang yang diam-diam menyelidiki suatu negeri; 'mata-mata' adalah padanan Indonesia yang paling jelas dalam konteks tuduhan tersebut.
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: bukan mata-mata
  rationale: Konstruksi dengan הָיוּ dan partisip dapat menyatakan keadaan atau peranan mereka. Bentuk 'bukan mata-mata' alami dalam bahasa Indonesia dan tidak memaksakan nuansa waktu tertentu.
