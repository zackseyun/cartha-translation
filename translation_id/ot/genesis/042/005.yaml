translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan 'bersama orang-orang lain yang juga datang' menyampaikan bahwa putra-putra Yakub datang sebagai bagian dari arus orang yang menuju Mesir, tanpa mempertahankan pengulangan akar kata Ibrani secara kaku.
