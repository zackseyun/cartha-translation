  text: So the sons of Israel came to buy grain among those who were coming[b][a], because the famine was in the land of Canaan.
translation:
  language: id
  text: Maka putra-putra Israel datang untuk membeli gandum di antara orang-orang yang datang, sebab terjadi kelaparan di tanah Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan rangkaian narasi dan menggambarkan kedatangan mereka ke Mesir.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Dalam konteks langsung, ungkapan ini menunjuk kepada putra-putra Yakub. Bahasa Indonesia lazim memakai 'anak-anak Israel', dan konteks sudah memperjelas bahwa mereka semua laki-laki.
- source_word: לִשְׁבֹּר
  choice: untuk membeli gandum
  rationale: Secara dasar berarti 'membeli', tetapi dalam konteks bencana kelaparan dan kisah Yusuf, barang yang dimaksud adalah gandum atau bahan pangan; penyebutan 'gandum' membuat maksudnya jelas.
- source_word: בְּתוֹךְ הַבָּאִים
  choice: bersama orang-orang lain yang juga datang
  rationale: Ungkapan ini menyatakan bahwa mereka berada di tengah rombongan orang yang berdatangan. Terjemahan ini menghindari susunan Indonesia yang kaku sambil mempertahankan makna kelompok tersebut.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan kedatangan mereka dan sesuai dengan ragam naratif yang bermartabat.
- source_word: הָיָה הָרָעָב
  choice: kelaparan melanda
  rationale: Terjemahan idiomatis ini menyampaikan keadaan bencana kelaparan secara alami dalam bahasa Indonesia tanpa mengubah hubungan sebab-akibat.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: Mempertahankan ungkapan geografis konkret dalam bahasa Ibrani dan bentuk yang lazim dalam bahasa Indonesia.
