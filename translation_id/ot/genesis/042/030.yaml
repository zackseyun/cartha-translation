  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: id
  text: Orang itu, penguasa negeri itu, berbicara kasar kepada kami dan menganggap kami sebagai mata-mata yang mengintai negeri itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: Orang itu
  rationale: Menunjuk kepada tokoh laki-laki yang sudah diketahui dalam konteks; bentuk ini alami dalam bahasa Indonesia tanpa menambah nama atau jabatan.
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: penguasa negeri itu
  rationale: אֲדֹנֵי berbentuk konstruksi dan di sini berarti orang yang berkuasa atas negeri tersebut; 'penguasa' lebih alami dan tepat daripada gelar sapaan 'tuan'.
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: berbicara keras kepada kami
  rationale: קָשׁוֹת secara idiomatis menyatakan perkataan yang keras atau kasar; 'kepada kami' merupakan padanan Indonesia yang alami bagi אִתָּנוּ dalam konstruksi ini.
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: dan menganggap kami sebagai mata-mata
  rationale: Secara harfiah 'menempatkan/menjadikan kami sebagai mata-mata'; dalam konteks tuduhan dan perlakuan, 'menganggap' menyampaikan fungsi idiomatis tanpa menyatakan bahwa mereka sungguh mata-mata.
- source_word: מְרַגְּלִים אֶת הָאָרֶץ
  choice: mata-mata yang mengintai negeri itu
  rationale: Konstruksi dengan penanda objek אֶת menunjukkan kegiatan memata-matai atau mengintai negeri; perluasan relatif ini menghasilkan bahasa Indonesia yang jelas dan alami.
