  source_fidelity: 'Teks Indonesia mengikuti urutan dan isi Ibrani dengan setia: wayyiqtol diterjemahkan sebagai kelanjutan narasi (“Lalu kami berkata”), אֵלָיו sebagai “kepadanya,” כֵּנִים sebagai “orang-orang jujur,” dan penyangkalan bahwa mereka adalah מְרַגְּלִים sebagai “kami bukan mata-mata.” Bentuk kini “bukan” adalah cara Indonesia yang idiomatis untuk menyatakan penyangkalan status/kegiatan yang dalam Ibrani dirumuskan dengan היה + partisip.'
