  yaml_path: translation/ot/genesis/042/031.yaml
  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: id
  text: Lalu kami berkata kepadanya, ‘Kami ini orang-orang jujur; kami bukan mata-mata.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: Lalu kami berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks orang ketiga tunggal maskulin secara langsung berarti “kepadanya”.
- source_word: כֵּנִים
  choice: orang-orang jujur
  rationale: Dalam konteks bantahan terhadap tuduhan sebagai pengintai, kata ini menggambarkan orang yang tulus, dapat dipercaya, atau tidak menipu. “Orang-orang jujur” alami dan jelas dalam bahasa Indonesia.
- source_word: אֲנָחְנוּ
  choice: kami ini
  rationale: Pronomina mandiri memberi penekanan pada identitas para saudara; “kami ini” mempertahankan penekanan tersebut secara wajar.
- source_word: לֹא הָיִינוּ מְרַגְּלִים
  choice: kami bukan mata-mata
  rationale: Konstruksi negatif dengan הָיָה dan partisip menyangkal status atau kegiatan mereka sebagai pengintai. Dalam konteks ujaran langsung, “kami bukan mata-mata” adalah padanan Indonesia yang lugas dan alami.
