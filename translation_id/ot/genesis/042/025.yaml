revisions:
- from: Lalu Yusuf memerintahkan agar wadah-wadah mereka diisi dengan biji-bijian, uang perak mereka dikembalikan, masing-masing ke dalam karungnya[a][b], dan mereka diberi bekal untuk perjalanan. Semua itu pun dilakukan bagi mereka.[c]
  to: Lalu Yusuf memerintahkan supaya wadah-wadah mereka[a] diisi dengan biji-bijian, uang perak setiap orang[b] dikembalikan ke dalam karungnya, dan mereka diberi bekal untuk perjalanan. Hal itu pun dilakukan bagi mereka.[c]
  rationale: Revisi hanya memperjelas konstruksi distributif אִישׁ אֶל־שַׂקּוֹ (“setiap orang ke dalam karungnya”), memperbaiki kelancaran koordinasi perintah Yusuf, dan memindahkan jangkar catatan kaki ke istilah yang dibahas. Ambiguitas mengenai pelaku pada kalimat penutup tetap dipertahankan melalui bentuk pasif.
