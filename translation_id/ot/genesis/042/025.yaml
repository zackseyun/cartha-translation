base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: id
  text: Lalu Yusuf memerintahkan supaya wadah-wadah mereka[a] diisi dengan biji-bijian, uang perak setiap orang[b] dikembalikan ke dalam karungnya, dan mereka diberi bekal untuk perjalanan. Hal itu pun dilakukan bagi mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “wadah-wadah” lebih luas maknanya daripada “karung”; untuk “karung” dipakai kata Ibrani yang berbeda dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perak mereka”; dalam konteks ini perak itu digunakan sebagai uang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “Ia melakukan demikian bagi mereka.” Bahasa Ibrani memakai kata kerja tunggal tanpa menyebutkan pelakunya secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah; bentuk ini alami dalam bahasa Indonesia dan cocok dengan rangkaian perintah tidak langsung sesudahnya.
- source_word: כְּלֵיהֶם
  choice: wadah-wadah mereka
  rationale: כְּלִי adalah istilah umum bagi wadah atau perkakas. Pilihan ini mempertahankan perbedaannya dari שַׂק, yang secara khusus berarti karung dan muncul kemudian dalam ayat.
- source_word: בָּר
  choice: biji-bijian
  rationale: בָּר di sini menunjuk pada hasil pangan berupa bulir secara umum; 'biji-bijian' tidak mempersempit maknanya menjadi gandum saja.
- source_word: כַּסְפֵּיהֶם
  choice: uang perak mereka
  rationale: כֶּסֶף secara harfiah berarti perak dan dalam konteks ini berfungsi sebagai uang. 'Uang perak' mempertahankan unsur konkret sekaligus menjelaskan fungsinya.
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: masing-masing ke dalam karungnya
  rationale: אִישׁ dipakai secara distributif, sedangkan שַׂק secara khusus berarti karung. 'Masing-masing' alami dalam bahasa Indonesia dan jelas merujuk kepada saudara-saudara Yusuf.
- source_word: צֵדָה לַדָּרֶךְ
  choice: bekal untuk perjalanan
  rationale: צֵדָה menunjuk pada persediaan makanan atau kebutuhan untuk bepergian; 'bekal untuk perjalanan' ringkas dan idiomatis.
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: Semua itu pun dilakukan bagi mereka
  rationale: Bentuk pasif Indonesia tidak menetapkan pelaku secara eksplisit dan mempertahankan fokus pada terlaksananya perintah Yusuf.
