  text: וְ/הֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַ/מֵּלִ֖יץ בֵּינֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/023.yaml
  text: But they did not know that Joseph was listening[a], because the interpreter was between them.
translation:
  language: id
  text: Namun, mereka tidak tahu bahwa Yusuf memahami perkataan mereka,[a] sebab ada seorang penerjemah di antara mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendengarkan mereka”; dalam konteks ini maksudnya Yusuf mengerti apa yang mereka katakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵם
  choice: Namun, mereka
  rationale: Konjungsi dan pronomina menandai kontras dengan konteks sebelumnya; 'Namun, mereka' mengungkapkannya secara alami.
- source_word: לֹא יָדְעוּ
  choice: tidak tahu
  rationale: Bentuk qatal dari ידע di sini menyatakan tidak adanya pengetahuan.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי pertama memperkenalkan isi yang tidak mereka ketahui.
- source_word: שֹׁמֵעַ
  choice: memahami perkataan mereka
  rationale: Makna dasar שמע adalah mendengar, tetapi dalam konteks penggunaan penerjemah, pokoknya ialah Yusuf mengerti bahasa mereka; penambahan 'perkataan mereka' membuat maksud tersebut alami dan jelas dalam bahasa Indonesia sambil mempertahankan alternatif harfiahnya dalam catatan kaki.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Menggunakan bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי kedua memberikan alasan mengapa mereka tidak mengetahui bahwa Yusuf memahami mereka.
- source_word: הַמֵּלִיץ
  choice: seorang penerjemah
  rationale: Dalam konteks percakapan lintas bahasa, מליץ menunjuk kepada perantara yang menerjemahkan ucapan. Artikel Ibrani tidak harus diterjemahkan secara definit dalam bahasa Indonesia karena tokoh ini baru disebut.
- source_word: בֵּינֹתָם
  choice: di antara mereka
  rationale: Frasa ini menyatakan posisi atau fungsi perantara antara Yusuf dan saudara-saudaranya.
