revisions:
- from: Yusuf adalah penguasa atas negeri itu; dialah yang menjual gandum kepada seluruh rakyat negeri itu. Saudara-saudara Yusuf datang dan sujud di hadapannya[a] dengan wajah sampai ke tanah.
  to: Yusuflah penguasa atas negeri itu; dialah yang menjual gandum kepada seluruh rakyat negeri itu. Saudara-saudara Yusuf datang dan bersujud kepadanya[a] dengan wajah mereka ke tanah.
  rationale: Revisi ini memperjelas bahwa penghormatan itu ditujukan kepada Yusuf (“kepadanya”) dan mengganti ungkapan postur yang kurang alami dengan padanan Indonesia modern yang menyampaikan arti harfiah secara lebih tepat. Pilihan “bersujud” tetap membiarkan cakupan verba Ibrani—membungkuk dalam-dalam hingga tersungkur—diterangkan dalam catatan kaki, tanpa memaksakan makna penyembahan ilahi.
