base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: id
  text: Yusuflah penguasa atas negeri itu; dialah yang menjual gandum kepada seluruh rakyat negeri itu. Saudara-saudara Yusuf datang dan bersujud kepadanya[a] dengan wajah mereka ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membungkuk dalam-dalam kepadanya.” Kata kerja Ibrani ini dapat berarti membungkuk dalam-dalam atau tersungkur sebagai tanda hormat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט
  choice: penguasa
  rationale: Kata ini menunjuk kepada orang yang menjalankan kekuasaan. “Penguasa” menyatakan kedudukan Yusuf tanpa menetapkan gelar jabatan yang tidak disebutkan dalam teks.
- source_word: עַל הָאָרֶץ
  choice: atas negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk kepada negeri yang sedang dibicarakan, yakni Mesir, bukan seluruh bumi. “Negeri itu” alami dalam bahasa Indonesia dan mempertahankan acuan kontekstualnya.
- source_word: הַמַּשְׁבִּיר
  choice: yang menjual gandum
  rationale: Partisipel Hifil dari שׁבר dalam kisah bencana kelaparan ini merujuk pada tindakan menjual bahan pangan. Objek “gandum” tersirat jelas dari konteks dan perlu dinyatakan agar maknanya alami.
- source_word: לְכָל עַם הָאָרֶץ
  choice: kepada seluruh rakyat negeri itu
  rationale: עַם merupakan nomina kolektif dan di sini paling wajar diterjemahkan “rakyat”; הָאָרֶץ tetap mengacu kepada negeri Mesir dalam konteks langsung.
- source_word: אֲחֵי יוֹסֵף
  choice: Saudara-saudara Yusuf
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara alami, dan bentuk ulang “saudara-saudara” menyatakan saudara kandung laki-laki dalam konteks ini.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: sujud di hadapannya
  rationale: Kata kerja שׁחה dapat menggambarkan membungkuk dalam-dalam atau merebahkan diri sebagai penghormatan. “Sujud di hadapannya” sesuai dengan postur yang diperjelas oleh frasa berikutnya tanpa menyebut tindakan itu sebagai penyembahan kepada Allah.
- source_word: אַפַּיִם אָרְצָה
  choice: dengan wajah sampai ke tanah
  rationale: Ungkapan ini menggambarkan posisi merendahkan diri sepenuhnya. Terjemahan ini mempertahankan gambaran fisiknya dalam bahasa Indonesia yang jelas dan alami.
- source_word: וְ
  choice: dan
  rationale: Konjungsi ini menghubungkan serta melanjutkan narasi tanpa menambahkan penanda waktu yang tidak ada secara eksplisit dalam teks sumber.
theological_decisions:
- issue: Tindakan saudara-saudara Yusuf terhadap Yusuf
  choice: sujud di hadapannya
  alternative: membungkuk dalam-dalam kepadanya; menyembahnya
  rationale: Adegan ini menggambarkan penyerahan diri dan penghormatan sosial yang juga berkaitan dengan mimpi Yusuf sebelumnya. Pilihan ini mempertahankan kekuatan gerak tubuh tersebut tanpa mengartikannya secara berlebihan sebagai penyembahan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “dialah yang” mempertahankan penekanan pada Yusuf sebagai orang yang secara langsung mengatur penjualan gandum. Istilah “negeri itu” dipilih untuk acuan lokal kepada Mesir, sedangkan “sujud di hadapannya” menyampaikan penghormatan mendalam tanpa memasukkan pengertian ibadah secara otomatis.
