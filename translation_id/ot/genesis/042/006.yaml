  terminology: “Penguasa”, “negeri”, “gandum”, dan “rakyat” tepat dalam konteks ini. “Bersujud kepadanya” dengan keterangan postur mempertahankan tindakan penghormatan mendalam tanpa menerjemahkannya secara sempit sebagai ibadah. Catatan kaki mempertahankan kemungkinan leksikal membungkuk dalam-dalam atau tersungkur.
