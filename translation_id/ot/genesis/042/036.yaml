base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/036.yaml
  text: 'And Jacob their father said to them[a], “You have bereaved me: Joseph is no more, and Simeon is no more, and you would take Benjamin[b]. All these things have come against me.”'
translation:
  language: id
  text: Lalu Yakub, ayah mereka, berkata kepada mereka, “Kalian telah membuat aku kehilangan anak-anak[a]. Yusuf sudah tidak ada, Simeon pun sudah tidak ada, dan kalian hendak membawa Benyamin. Semua ini berbalik melawan aku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah membuat aku kehilangan anak-anakku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכַּלְתֶּם
  choice: telah membuat aku kehilangan anak-anak
  rationale: Bentuk Piel menyatakan menyebabkan seseorang kehilangan anak atau menjadi tanpa anak. Ungkapan ini mempertahankan daya emosional keluhan Yakub dan terdengar alami dalam bahasa Indonesia.
- source_word: אֵינֶנּוּ
  choice: sudah tidak ada
  rationale: Dalam konteks ini idiom tersebut menyatakan ketiadaan atau kehilangan, bukan sekadar negasi keberadaan; pilihan ini wajar untuk Yusuf maupun Simeon tanpa menentukan apakah Simeon telah mati.
- source_word: תִּקָּחוּ
  choice: sekarang kalian hendak membawa
  rationale: Bentuk imperfek mengacu pada tindakan yang dimaksudkan atau akan dilakukan. 'Hendak membawa' menangkap keberatan Yakub terhadap rencana membawa Benyamin, sementara 'sekarang' memperjelas perkembangan ratapannya secara alami.
- source_word: עָלַי הָיוּ כֻלָּנָה
  choice: Semua ini menimpa aku
  rationale: Frasa ini menggambarkan seluruh keadaan tersebut sebagai beban buruk yang jatuh atas Yakub. 'Menimpa aku' mempertahankan nuansa kumulatif dan adversatif עָלַי secara idiomatis.
- source_word: אֹתִי
  choice: aku
  rationale: Objek orang pertama dipertahankan secara eksplisit karena penempatannya di depan dalam bahasa Ibrani menekankan Yakub sebagai pihak yang menanggung kehilangan.
- source_word: יַעֲקֹב אֲבִיהֶם
  choice: Yakub, ayah mereka
  rationale: Mengikuti urutan Ibrani dengan aposisi yang jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti 'aku/kalian' sesuai dengan tuturan langsung seorang ayah kepada anak-anaknya. Pengulangan 'sudah tidak ada' dipertahankan untuk membawa irama ratapan teks Ibrani. Tidak ditambahkan penjelasan bahwa Yusuf atau Simeon telah mati.
