base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/038.yaml
  text: But he said[a], “My son will not go down with you, because his brother is dead, and he alone is left. If harm should happen to him on the journey on which you go[b], then you would bring my gray hair down to Sheol in sorrow.”
translation:
  language: id
  text: Tetapi ia berkata, “Putraku tidak akan turun bersama kalian, sebab saudaranya sudah mati dan hanya dialah yang tersisa. Jika malapetaka[a] menimpanya dalam perjalanan yang kalian tempuh, kalian akan membawa rambutku yang beruban turun ke Syeol[b] dalam dukacita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika bencana menimpanya di jalan yang kalian lalui.”
    reason: lexical_alternative
  - marker: b
    text: Syeol adalah istilah Ibrani untuk dunia orang mati; dapat juga diterjemahkan “kubur.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: tidak akan turun
  rationale: Mempertahankan makna harfiah ‘turun’, yang dalam kisah Kejadian secara konsisten menggambarkan perjalanan dari Kanaan ke Mesir.
- source_word: בְּנִי
  choice: anakku
  rationale: Padanan langsung dan alami untuk ‘anakku laki-laki’; konteks telah menunjukkan bahwa yang dimaksud ialah Benyamin.
- source_word: אָחִיו מֵת
  choice: saudaranya sudah mati
  rationale: Menyatakan keadaan Yusuf menurut keyakinan Yakub, bukan sekadar peristiwa kematiannya pada masa lampau.
- source_word: לְבַדּוֹ נִשְׁאָר
  choice: hanya dialah yang tersisa
  rationale: Mempertahankan penekanan pada Benyamin sebagai satu-satunya yang masih tinggal dari anak-anak Rahel menurut sudut pandang Yakub.
- source_word: וּקְרָאָהוּ אָסוֹן
  choice: jika malapetaka menimpanya
  rationale: Klausa ini bersifat kondisional dalam konteks. ‘Malapetaka’ menyampaikan kemalangan atau bahaya berat yang terkandung dalam אָסוֹן.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: dalam perjalanan yang kalian tempuh
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern sekaligus mempertahankan gagasan jalan atau perjalanan yang mereka jalani.
- source_word: וְהוֹרַדְתֶּם
  choice: kalian akan membawa ... turun
  rationale: Mempertahankan bentuk kausatif dari ירד dan menggambarkan akibat yang Yakub khawatirkan.
- source_word: שֵׂיבָתִי
  choice: rambutku yang beruban
  rationale: Mempertahankan gambaran konkret rambut beruban sebagai lambang usia tua, alih-alih mengabstraksikannya menjadi ‘masa tuaku’.
- source_word: בְּיָגוֹן
  choice: dalam dukacita
  rationale: Padanan yang wajar dan bermartabat untuk keadaan sedih atau berduka yang dimaksud.
- source_word: שְׁאֹלָה
  choice: ke Syeol
  rationale: Transliterasi istilah Ibrani mempertahankan cakupan maknanya sebagai ranah orang mati tanpa mempersempitnya menjadi kubur fisik.
theological_decisions:
- issue: Penerjemahan שְׁאוֹל sebagai Syeol atau kubur
  choice: Syeol
  alternative: kubur; dunia orang mati
  rationale: Istilah Ibrani dapat menunjuk pada ranah orang mati dan tidak selalu identik dengan sebuah kubur fisik. Mempertahankan ‘Syeol’ menjaga keterbukaan makna sumber; catatan kaki memberi penjelasan bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti jamak ‘kalian’ memperjelas bahwa Yakub berbicara kepada beberapa anaknya. Susunan ‘membawa rambutku yang beruban turun’ sengaja mempertahankan gambaran konkret dan kuat dari bahasa Ibrani.
