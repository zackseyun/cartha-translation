base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: id
  text: Ketika Yusuf melihat saudara-saudaranya, ia mengenali mereka, tetapi ia bersikap seolah-olah tidak mengenal mereka[a] dan berbicara dengan kasar kepada mereka. Ia bertanya kepada mereka, “Dari mana kalian datang?” Mereka menjawab, “Dari tanah Kanaan, untuk membeli makanan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia menampilkan diri sebagai orang asing bagi mereka” atau “ia membuat dirinya tidak dikenali oleh mereka.” Bahasa Ibrani dapat menunjuk pada sikap seolah-olah ia orang asing atau tidak dikenal oleh mereka, bukan dengan pasti pada penyamaran fisik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “membeli gandum.” Dalam konteks kelaparan ini, kata kerja Ibraninya sering menunjuk secara khusus pada pembelian gandum, meskipun kata benda yang digunakan di sini lebih luas, yaitu “makanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: Ketika Yusuf melihat saudara-saudaranya
  rationale: Rangkaian waw-konsekutif melanjutkan narasi; bentuk “ketika” menghubungkan tindakan melihat dengan tindakan mengenali secara alami dalam bahasa Indonesia.
- source_word: וַיַּכִּרֵם
  choice: ia mengenali mereka
  rationale: Bentuk Hifil dari נכר di sini berarti mengenali atau mengidentifikasi orang yang telah dikenal.
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: ia bersikap seolah-olah tidak mengenal mereka
  rationale: Bentuk Hitpael menyatakan bahwa Yusuf menampilkan diri sebagai orang asing atau tidak dikenal bagi mereka; pilihan ini mempertahankan nuansa relasional tanpa menetapkan bahwa ia mengubah penampilan secara fisik.
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: dan berbicara dengan keras kepada mereka
  rationale: קָשׁוֹת menerangkan cara Yusuf berbicara, yakni secara keras atau tajam. Ungkapan ini wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: מֵאַיִן בָּאתֶם
  choice: Dari mana kalian datang?
  rationale: Terjemahan ini mempertahankan pertanyaan tentang tempat asal sekaligus menghasilkan dialog Indonesia yang alami; “kalian” sesuai karena lawan bicara berjumlah jamak.
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: Dari tanah Kanaan
  rationale: “Tanah Kanaan” mencerminkan frasa geografis Ibrani אֶרֶץ כְּנַעַן dengan bentuk yang lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: לִשְׁבָּר אֹכֶל
  choice: untuk membeli makanan
  rationale: שבר dalam konteks kelaparan berarti membeli persediaan, kerap kali gandum, sedangkan אֹכֶל sendiri lebih luas dan berarti makanan; teks utama tidak mempersempit acuannya.
