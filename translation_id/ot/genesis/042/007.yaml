translation_notes:
  register: Bahasa Indonesia baku modern dengan narasi yang jelas dan dialog alami. Pronomina “ia” menjaga ragam tulis yang bermartabat, sedangkan “kalian” menyampaikan bentuk jamak secara eksplisit tanpa kekakuan. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
