translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora Ibrani dialihkan secara transparan menjadi “bagian-bagian ... yang terbuka” agar dapat dipahami pembaca umum tanpa menghilangkan gagasan kerentanan wilayah. Tidak diperlukan catatan kaki karena makna metaforis sudah dinyatakan dalam teks utama.
