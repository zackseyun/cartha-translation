  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Tidak! Kalian datang untuk melihat ketelanjangan negeri ini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketelanjangan negeri ini.” Ungkapan ini adalah metafora untuk bagian-bagian wilayah yang terbuka atau rentan dan dapat dimanfaatkan oleh penyusup atau mata-mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, ia berkata
  rationale: Waw-konsekutif melanjutkan narasi, sedangkan “Namun” menyatakan pertentangan dengan bantahan saudara-saudara Yusuf pada ayat sebelumnya.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Padanan langsung bagi preposisi dengan sufiks pronominal yang menandai pihak yang diajak bicara.
- source_word: לֹא
  choice: Bukan!
  rationale: Dalam konteks ini לֹא merupakan penolakan tegas atas pengakuan mereka; “Bukan!” alami dalam bahasa Indonesia dan mempertahankan ketegasannya.
- source_word: כִּי
  choice: (tidak diterjemahkan tersendiri)
  rationale: Partikel ini memperkenalkan koreksi terhadap pernyataan sebelumnya. Dalam bahasa Indonesia, hubungan korektif tersebut sudah jelas melalui penolakan tegas yang langsung diikuti tuduhan.
- source_word: עֶרְוַת הָאָרֶץ
  choice: bagian-bagian negeri ini yang terbuka
  rationale: Secara harfiah berarti “ketelanjangan negeri,” tetapi di sini merupakan metafora bagi bagian-bagian wilayah yang terekspos atau rentan. Padanan ini mempertahankan citra keterbukaan sambil menyampaikan maknanya secara wajar.
- source_word: בָּאתֶם
  choice: kalian datang
  rationale: Bentuk perfektif menyatakan tindakan kedatangan yang telah terjadi dan kini menjadi dasar tuduhan Yusuf. “Kalian” cocok untuk sekelompok saudara dalam percakapan langsung.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Mempertahankan arti dasar ראה, “melihat,” tanpa menggantinya dengan verba khusus “memata-matai,” sehingga pilihan kata sumber dan nuansa tuduhannya tetap terjaga.
