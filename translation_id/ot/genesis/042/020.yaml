  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: id
  text: “Bawalah adik bungsu kalian kepadaku, supaya perkataan kalian terbukti benar[a] dan kalian tidak akan mati.” Lalu mereka berbuat demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya perkataan kalian diteguhkan” atau “dipercaya.” Kata kerja Ibrani ini dapat berarti ditetapkan sebagai benar atau diterima sebagai dapat dipercaya; dalam konteks ini, makna pembuktian lebih sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: adik bungsumu
  rationale: Dalam konteks hubungan saudara dan kisah tentang Benyamin, הַקָּטֹן menunjuk kepada saudara yang paling muda; ‘adik bungsumu’ alami dan tepat dalam bahasa Indonesia.
- source_word: תָּבִיאוּ אֵלַי
  choice: bawalah ... kepadaku
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’; ‘kepadaku’ menerjemahkan אֵלַי secara langsung.
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: supaya perkataanmu terbukti benar
  rationale: Bentuk Nifal dari אמן dapat berarti diteguhkan sebagai benar atau dipercaya. Dalam konteks Yusuf menguji pengakuan saudara-saudaranya, ‘terbukti benar’ menyampaikan gagasan verifikasi sambil mempertahankan perkataan mereka sebagai subjek.
- source_word: וְלֹא תָמֻתוּ
  choice: dan kamu tidak mati
  rationale: Terjemahan ini mempertahankan koordinasi Ibrani dan daya ancaman sekaligus jaminan yang mengikuti ketaatan mereka.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Lalu mereka berbuat demikian
  rationale: Ungkapan naratif ini menyatakan bahwa mereka menaati perintah tersebut; ‘berbuat demikian’ mempertahankan bentuk formula sumber secara wajar.
