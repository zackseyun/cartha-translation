translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina tunggal kolektif ‘-mu/kamu’ mengikuti kebiasaan bahasa Indonesia ketika menyapa satu kelompok, sedangkan ‘adik bungsumu’ menyampaikan hubungan keluarga dan urutan kelahiran secara alami.
