base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: id
  text: Lalu Ruben menjawab mereka, “Bukankah sudah kukatakan kepada kalian, ‘Jangan berbuat dosa terhadap anak itu’? Tetapi kalian tidak mendengarkan. Dan sekarang, lihatlah, darahnya dituntut.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶחֶטְאוּ בַיֶּלֶד
  choice: berbuat dosa terhadap anak itu
  rationale: Mempertahankan bahasa moral yang kuat dari kata kerja חטא serta relasi yang ditandai preposisi ב.
- source_word: דָּמוֹ
  choice: darahnya
  rationale: Mempertahankan ungkapan Ibrani tentang darah sebagai lambang nyawa yang ditumpahkan dan kesalahan atas kematian.
- source_word: נִדְרָשׁ
  choice: dituntut
  rationale: Bentuk pasif ini menyatakan bahwa pertanggungjawaban atas darah Yusuf sedang diminta, tanpa menambahkan pelaku yang tidak disebutkan secara eksplisit.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Menjaga penanda perhatian yang menekankan akibat yang kini nyata di hadapan mereka.
theological_decisions:
- issue: Pelaku yang menuntut darah Yusuf tidak disebutkan
  choice: darahnya dituntut
  alternative: Allah menuntut pertanggungjawaban atas darahnya
  rationale: Teks Ibrani memakai bentuk pasif tanpa menyebut Allah secara eksplisit; terjemahan mempertahankan ketakterusterangan dan kemungkinan nuansa pasif ilahi.
- issue: Status Yusuf dalam perkataan Ruben
  choice: anak itu
  alternative: anak muda itu
  rationale: הַיֶּלֶד menunjuk Yusuf sebagai anak/anak lelaki dalam konteks keluarga; pilihan ini mempertahankan kontras antara kerentanannya dahulu dan kesalahan saudara-saudaranya.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan formula לֵאמֹר yang kedua tidak diterjemahkan secara harfiah karena tidak alami dalam dialog Indonesia, sedangkan isi dan penekanannya tetap dipertahankan.
