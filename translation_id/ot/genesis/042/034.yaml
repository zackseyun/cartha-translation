base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: id
  text: “Bawalah adik bungsu kalian kepadaku, supaya aku tahu bahwa kalian bukan mata-mata, melainkan orang-orang jujur. Lalu aku akan mengembalikan saudara kalian kepada kalian, dan kalian boleh berdagang di negeri ini[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian boleh bepergian di negeri ini.” Kata kerja Ibrani yang digunakan dapat dipahami secara lebih luas sebagai bergerak atau bepergian berkeliling, meskipun arti komersialnya, “berdagang,” paling sesuai dengan konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: Bawalah
  rationale: Bentuk Hifil imperatif dari בוא menyampaikan perintah langsung; partikel -lah memberi nada perintah yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: adik bungsu kalian
  rationale: Dalam konteks hubungan antarsaudara, הַקָּטֹן menunjuk saudara yang paling muda; 'adik bungsu' merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Menyampaikan arah menuju pembicara secara langsung.
- source_word: וְאֵדְעָה
  choice: supaya aku tahu
  rationale: Bentuk kohortatif sesudah perintah menyatakan tujuan atau hasil yang dimaksud; 'supaya' memperjelas hubungan wacananya tanpa mengubah makna.
- source_word: כִּי לֹא מְרַגְּלִים אַתֶּם
  choice: bahwa kalian bukan mata-mata
  rationale: מְרַגְּלִים di sini berfungsi sebagai sebutan bagi para pengintai rahasia; 'mata-mata' adalah padanan Indonesia yang lazim.
- source_word: כִּי כֵנִים אַתֶּם
  choice: melainkan orang-orang jujur
  rationale: כֵנִים menyatakan kejujuran atau keterandalan dan dikontraskan dengan tuduhan sebagai mata-mata.
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: aku akan menyerahkan kembali saudara kalian kepada kalian
  rationale: Konteks menunjukkan saudara mereka sedang ditahan; 'kembali' menyatakan pemulangan yang tersirat, sedangkan 'menyerahkan' lebih alami daripada terjemahan harfiah 'memberikan'.
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: kalian boleh berdagang di negeri ini
  rationale: סחר lazim berkaitan dengan perdagangan; dalam kisah kelaparan dan pembelian bahan pangan, arti komersial paling sesuai, sementara bentuknya dalam konteks ini menyampaikan izin.
