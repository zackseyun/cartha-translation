translation:
  language: id
  text: Yusuf mengenali saudara-saudaranya, tetapi mereka tidak mengenalinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: mengenali
  rationale: Bentuk Hifil dari נכר dalam konteks ini berarti mengenali orang yang sudah pernah dikenal; pilihan ini juga mempertahankan pengulangan kata dengan verba pada klausa kedua.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
- source_word: אֶת־אֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk jamak אָח dengan sufiks orang ketiga tunggal maskulin merujuk pada saudara-saudara laki-laki Yusuf; dalam konteks narasi ini, bentuk Indonesia tersebut jelas dan alami.
- source_word: וְהֵם
  choice: tetapi mereka
  rationale: Walaupun ו pada dasarnya dapat berarti 'dan', hubungan antarklausa di sini bersifat kontras, sehingga 'tetapi' mengungkapkan pertentangan naratif secara wajar.
- source_word: לֹא הִכִּרֻהוּ
  choice: tidak mengenalinya
  rationale: Menggunakan kembali verba 'mengenali' untuk mempertahankan pengulangan נכר dan ironi naratif; sufiks objek merujuk kepada Yusuf.
