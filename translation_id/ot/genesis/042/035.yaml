  to: Ketika mereka sedang mengosongkan karung-karung mereka, ternyata bungkusan uang perak masing-masing ada di dalam karungnya.[a] Mereka dan ayah mereka melihat bungkusan-bungkusan uang perak mereka, lalu menjadi takut.
  rationale: Revisi mempertahankan hubungan waktu, kejutan penemuan, bentuk distributif “masing-masing ... karungnya,” serta bentuk jamak pada pengamatan kolektif. Perubahan utama memastikan bahwa ayah mereka juga termasuk dalam reaksi takut, sebagaimana ditunjukkan oleh susunan subjek dalam teks Ibrani.
