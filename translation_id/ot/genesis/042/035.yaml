  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: id
  text: Ketika mereka sedang mengosongkan karung-karung mereka, ternyata bungkusan uang perak masing-masing ada di dalam karungnya.[a] Mereka dan ayah mereka melihat bungkusan-bungkusan uang perak mereka, lalu menjadi takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kantong uangnya”. Kata Ibrani yang dipakai menunjuk pada sesuatu yang diikat atau dibungkus menjadi satu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: Ketika mereka sedang mengosongkan
  rationale: Gabungan bentuk naratif וַיְהִי dan partisipel מְרִיקִים menyatakan keadaan yang sedang berlangsung ketika penemuan terjadi. Susunan ini menyampaikan hubungan waktunya secara alami dalam bahasa Indonesia tanpa mempertahankan ungkapan pembuka yang kaku.
- source_word: שַׂקֵּיהֶם
  choice: karung-karung mereka
  rationale: שַׂק menunjuk pada wadah untuk gandum atau barang. 'Karung' mempertahankan gambaran konkret dunia kuno dan lebih khusus daripada 'tas'.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Partikel ini menandai penemuan yang mengejutkan. Dalam narasi Indonesia modern, 'ternyata' menyampaikan perubahan sudut pandang dan unsur keterkejutan dengan wajar.
- source_word: אִישׁ ... בְּשַׂקּוֹ
  choice: di dalam karung masing-masing
  rationale: אִישׁ dipakai secara distributif, sedangkan bentuk tunggal בְּשַׂקּוֹ merujuk pada karung setiap orang. 'Masing-masing' menyatakan hubungan itu secara jelas dan alami.
- source_word: צְרוֹר כַּסְפּוֹ
  choice: bungkusan uang peraknya
  rationale: צְרוֹר adalah sesuatu yang diikat atau dibungkus, sedangkan כֶּסֶף dalam konteks ini adalah perak yang berfungsi sebagai uang. Pilihan ini mempertahankan bentuk bendanya sekaligus menjelaskan fungsinya.
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: Mereka dan ayah mereka
  rationale: Frasa penegas ini secara eksplisit menyebut para saudara dan ayah mereka sebagai pihak yang melihat. Susunan langsung mempertahankan penekanan Ibrani.
- source_word: וַיִּירָאוּ
  choice: lalu mereka menjadi takut
  rationale: Kata kerja naratif ini menyatakan reaksi ketakutan setelah penemuan. 'Lalu' memperjelas urutan narasi, dan 'menjadi takut' mengungkapkan timbulnya reaksi tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan 'bungkusan-bungkusan uang perak' dipertahankan karena teks Ibrani beralih dari penemuan distributif dalam bentuk tunggal kepada pengamatan kolektif dalam bentuk jamak.
