  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: id
  text: Namun mereka berkata kepadanya, “Tidak, Tuanku. Hamba-hambamu datang untuk membeli makanan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Namun mereka berkata
  rationale: Waw konsekutif melanjutkan narasi, sedangkan “Namun” secara alami menyatakan pertentangan dengan tuduhan Yusuf dalam ayat sebelumnya.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks pronominal menunjukkan bahwa jawaban itu ditujukan kepada Yusuf.
- source_word: לֹא
  choice: Tidak
  rationale: Negasi ini berfungsi sebagai bantahan tegas dalam percakapan langsung.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat ini mempertahankan jarak sosial dan sikap tunduk saudara-saudara Yusuf kepada seorang pejabat tinggi.
- source_word: וַעֲבָדֶיךָ
  choice: Hamba-hambamu
  rationale: Dalam bahasa istana, עֶבֶד merupakan sebutan diri yang merendah, bukan pernyataan bahwa mereka berstatus budak.
- source_word: בָּאוּ
  choice: datang
  rationale: Bentuk perfektif menyatakan kedatangan yang telah terjadi dan menjadi dasar keberadaan mereka di sana; bahasa Indonesia cukup menyatakannya secara alami dengan “datang”.
- source_word: לִשְׁבָּר
  choice: untuk membeli
  rationale: Dalam konteks persediaan pada masa kelaparan, verba ini berarti membeli bahan pangan; konstruksi infinitif menyatakan tujuan kedatangan.
- source_word: אֹכֶל
  choice: makanan
  rationale: Kata ini secara leksikal berarti makanan secara umum. Walaupun konteksnya kemungkinan menunjuk pada gandum, terjemahan yang lebih luas mempertahankan cakupan kata Ibrani.
