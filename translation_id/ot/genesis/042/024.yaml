  register: Bahasa naratif modern, jelas, dan bermartabat. Rangkaian tindakan dibagi menjadi tiga kalimat agar alami dalam bahasa Indonesia, sambil mempertahankan urutan peristiwa dalam teks Ibrani. Catatan kaki pada lapisan konsultasi bahasa Inggris tidak dipertahankan karena tidak mencerminkan ambiguitas atau varian yang nyata dalam teks sumber ayat ini.
