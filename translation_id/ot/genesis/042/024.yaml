  text: וַ/יִּסֹּ֥ב מֵֽ/עֲלֵי/הֶ֖ם וַ/יֵּ֑בְךְּ וַ/יָּ֤שָׁב אֲלֵ/הֶם֙ וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם וַ/יִּקַּ֤ח מֵֽ/אִתָּ/ם֙ אֶת שִׁמְע֔וֹן וַ/יֶּאֱסֹ֥ר אֹת֖/וֹ לְ/עֵינֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/024.yaml
  text: He turned away from them and wept[a]. Then he returned to them and spoke to them[b], and he took Simeon from among them and bound him before their eyes.
translation:
  language: id
  text: Ia berpaling dari mereka lalu menangis. Kemudian ia kembali kepada mereka dan berbicara kepada mereka. Ia mengambil Simeon dari antara mereka dan mengikatnya di depan mata mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסֹּב מֵעֲלֵיהֶם
  choice: Ia berpaling dari mereka
  rationale: Ungkapan ini menyatakan bahwa Yusuf membalikkan diri atau menjauh dari hadapan saudara-saudaranya. “Berpaling dari mereka” alami dalam bahasa Indonesia dan tidak menambahkan bahwa ia meninggalkan ruangan.
- source_word: וַיֵּבְךְּ
  choice: lalu menangis
  rationale: Kata בכה secara langsung berarti menangis. “Lalu” menyampaikan urutan tindakan dalam narasi Ibrani tanpa membuat susunan kalimat terasa kaku.
- source_word: וַיָּשָׁב אֲלֵהֶם
  choice: Kemudian ia kembali kepada mereka
  rationale: שׁוב berarti kembali; frasa ini menunjukkan bahwa Yusuf mendatangi mereka lagi setelah berpaling untuk menangis.
- source_word: וַיְדַבֵּר אֲלֵהֶם
  choice: dan berbicara kepada mereka
  rationale: Terjemahan langsung dan wajar bagi tindakan berbicara yang ditujukan kepada saudara-saudaranya.
- source_word: וַיִּקַּח מֵאִתָּם אֶת שִׁמְעוֹן
  choice: Ia mengambil Simeon dari antara mereka
  rationale: מֵאִתָּם menunjukkan Simeon dipisahkan atau dipilih dari kelompok saudara-saudaranya; “dari antara mereka” mempertahankan nuansa itu.
- source_word: וַיֶּאֱסֹר אֹתוֹ
  choice: dan mengikatnya
  rationale: אָסַר pada dasarnya berarti mengikat atau membelenggu. “Mengikatnya” mempertahankan tindakan konkret dan tidak mempersempit makna menjadi pemenjaraan.
- source_word: לְעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Ungkapan harfiah ini wajar dalam bahasa Indonesia dan menegaskan bahwa mereka menyaksikan sendiri tindakan tersebut.
