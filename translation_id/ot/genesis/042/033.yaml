base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: id
  text: 'Lalu orang itu, penguasa negeri itu, berkata kepada kami, ‘Dengan cara ini aku akan mengetahui bahwa kalian orang jujur: tinggalkanlah salah seorang saudara kalian bersamaku, bawalah bahan makanan[a] untuk keluarga kalian yang sedang kelaparan, lalu pergilah.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bawalah kelaparan keluarga kalian.” Maksudnya ialah membawa bahan makanan untuk keluarga yang sedang mengalami kelaparan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: orang itu, penguasa negeri itu
  rationale: הָאִישׁ berarti ‘orang itu’, sedangkan אֲדֹנֵי הָאָרֶץ menjelaskan kedudukannya secara aposisional. ‘Penguasa’ menyampaikan otoritas tinggi secara alami dalam bahasa Indonesia.
- source_word: בְּזֹאת
  choice: Dengan cara ini
  rationale: Frasa ini menunjuk pada tindakan berikut sebagai cara atau tolok ukur yang dengannya kejujuran mereka akan diketahui.
- source_word: אֵדַע
  choice: aku akan mengetahui
  rationale: Bentuk yiqtol di sini menyatakan hasil mendatang yang bergantung pada dipenuhinya perintah tersebut.
- source_word: כֵנִים
  choice: orang jujur
  rationale: Dalam kisah ini kata tersebut menggambarkan orang yang dapat dipercaya dan bukan mata-mata; ‘orang jujur’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: אֲחִיכֶם הָאֶחָד
  choice: salah seorang saudara kalian
  rationale: Ungkapan Ibrani menunjuk satu saudara dari antara kelompok mereka; bentuk ini paling idiomatis dalam bahasa Indonesia.
- source_word: הַנִּיחוּ אִתִּי
  choice: Tinggalkanlah ... bersamaku
  rationale: Bentuk Hifil dari נוח di sini berarti membiarkan seseorang tetap tinggal bersama si pembicara.
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: bahan makanan untuk mengatasi kelaparan keluarga kalian
  rationale: Secara harfiah objeknya adalah ‘kelaparan keluarga kalian’, sebuah ungkapan eliptis. Konteks pembelian gandum mendukung pemaknaan sebagai bahan makanan yang diperlukan selama kelaparan, tanpa membatasi terjemahan pada satu jenis bahan pangan.
- source_word: קְחוּ וָלֵכוּ
  choice: bawalah ... lalu pergilah
  rationale: Dua bentuk imperatif dipertahankan dengan urutan tindakan yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘aku/kalian’ dipakai dalam percakapan langsung agar alami, sedangkan bentuk perintah ‘-lah’ mempertahankan nada tegas. Penjelasan elipsis pada רַעֲבוֹן ditempatkan dalam catatan kaki.
