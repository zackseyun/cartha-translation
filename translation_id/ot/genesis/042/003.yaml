  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: id
  text: Maka kesepuluh saudara Yusuf turun ke Mesir untuk membeli biji-bijian dari sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk membeli biji-bijian di Mesir.” Bahasa Ibrani secara harfiah menyatakan “dari Mesir,” yang menandakan asal biji-bijian itu.
    reason: Menjelaskan fungsi sumber pada מִמִּצְרַיִם dan mencatat alternatif idiomatis tanpa mengubah makna.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: pergi ke Mesir
  rationale: Kata kerja ירד secara harfiah berarti 'turun/pergi turun' dan lazim dipakai untuk perjalanan ke Mesir. Dalam bahasa Indonesia modern, 'pergi ke Mesir' lebih alami; arah tujuan tetap jelas dari konteks.
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: kesepuluh saudara Yusuf
  rationale: Frasa ini menyatakan bahwa sepuluh saudara Yusuf pergi. Bentuk 'kesepuluh saudara Yusuf' alami dan menegaskan bahwa jumlah mereka sepuluh.
- source_word: לִשְׁבֹּר
  choice: untuk membeli
  rationale: Dalam kisah kelaparan ini, שׁבר berarti memperoleh bahan pangan dengan membelinya.
- source_word: בָּר
  choice: gandum
  rationale: בָּר menunjuk pada biji-bijian sebagai bahan pangan. 'Gandum' merupakan padanan umum dan mudah dipahami dalam konteks ini, meskipun istilah Ibraninya dapat mencakup biji-bijian secara lebih luas.
- source_word: מִמִּצְרָיִם
  choice: dari sana
  rationale: Preposisi מן menyatakan sumber, yaitu Mesir. Karena Mesir sudah disebut sebagai tujuan, 'dari sana' mempertahankan gagasan sumber tanpa menghasilkan susunan Indonesia yang kaku.
