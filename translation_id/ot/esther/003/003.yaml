  text: Then the king’s servants who were at the king’s gate said to Mordecai[a], “Why are you transgressing the king’s command?”
translation:
  language: id
  text: Lalu para pegawai raja yang berada di gerbang istana berkata kepada Mordekhai, “Mengapa engkau melanggar perintah raja?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian peristiwa; “lalu” menghasilkan alur narasi Indonesia yang alami.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: para pegawai raja
  rationale: עֶבֶד dapat berarti hamba atau pelayan, tetapi dalam konteks gerbang istana mereka berfungsi sebagai aparatur kerajaan. “Pegawai raja” menyampaikan fungsi itu tanpa menyiratkan secara pasti status perbudakan.
- source_word: אֲשֶׁר בְּשַׁעַר הַמֶּלֶךְ
  choice: yang berada di gerbang istana raja
  rationale: Ungkapan ini menunjukkan lokasi mereka. “Gerbang istana raja” menjelaskan secara wajar bahwa yang dimaksud ialah gerbang kompleks kerajaan, bukan gerbang yang dimiliki raja dalam arti umum.
- source_word: לְמָרְדֳּכָי
  choice: kepada Mordekhai
  rationale: Preposisi לְ menandai pihak yang menjadi sasaran perkataan; “kepada” merupakan padanan Indonesia yang langsung.
- source_word: מַדּוּעַ אַתָּה
  choice: Mengapa engkau
  rationale: מַדּוּעַ menanyakan alasan, sedangkan אַתָּה adalah pronomina orang kedua tunggal maskulin. “Engkau” sesuai untuk sapaan langsung dalam register Alkitab yang modern dan bermartabat.
- source_word: עוֹבֵר אֵת מִצְוַת הַמֶּלֶךְ
  choice: melanggar perintah raja
  rationale: Dalam konstruksi ini, עוֹבֵר berarti melewati batas atau melanggar suatu ketetapan. “Melanggar” mempertahankan gambaran pelanggaran batas dengan lebih dekat daripada sekadar “tidak menaati”, sementara מִצְוָה secara kontekstual berarti perintah kerajaan.
