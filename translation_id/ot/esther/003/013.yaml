source:
  edition: WLC
  text: וְ/נִשְׁל֨וֹחַ סְפָרִ֜ים בְּ/יַ֣ד הָ/רָצִים֮ אֶל כָּל מְדִינ֣וֹת הַ/מֶּלֶךְ֒ לְ/הַשְׁמִ֡יד לַ/הֲרֹ֣ג וּ/לְ/אַבֵּ֣ד אֶת כָּל הַ֠/יְּהוּדִים מִ/נַּ֨עַר וְ/עַד זָקֵ֜ן טַ֤ף וְ/נָשִׁים֙ בְּ/י֣וֹם אֶחָ֔ד בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֣דֶשׁ אֲדָ֑ר וּ/שְׁלָלָ֖/ם לָ/בֽוֹז־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/013.yaml
  text: Letters were sent by the hand of the couriers to all the provinces of the king[a], to destroy, to kill, and to annihilate all the Jews, from young man to old man, children and women, in one day, on the thirteenth day of the twelfth month, that is, the month Adar[d][c][b], and to plunder their spoil.
translation:
  language: id
  text: Surat-surat dikirim melalui para kurir ke seluruh provinsi raja, dengan perintah untuk membinasakan, membunuh, dan memusnahkan semua orang Yahudi—dari yang muda sampai yang tua, anak-anak dan perempuan—dalam satu hari, yaitu pada hari ketiga belas bulan kedua belas, yakni bulan Adar, serta merampas harta benda mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir berbunyi “dan jarahan mereka untuk dijarah”; pengulangan kata ini menegaskan penjarahan harta mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁלוֹחַ סְפָרִים
  choice: Surat-surat dikirim
  rationale: Bentuk pasif dan nomina jamak diterjemahkan secara langsung dan alami; dalam konteks administrasi Persia, סְפָרִים menunjuk pada surat atau dokumen resmi.
- source_word: בְּיַד הָרָצִים
  choice: melalui para kurir
  rationale: Ungkapan harfiah 'dengan tangan para pelari' menyatakan perantaraan; 'melalui para kurir' menyampaikan fungsi mereka secara wajar dalam bahasa Indonesia modern.
- source_word: אֶל כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: ke seluruh provinsi raja
  rationale: Menjaga cakupan total כָּל dan hubungan kepemilikan tanpa membuat frasa Indonesia terasa kaku.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: untuk membinasakan, membunuh, dan memusnahkan
  rationale: Tiga verba yang bertumpuk dipertahankan untuk menyampaikan intensifikasi dan sifat menyeluruh dari titah tersebut.
- source_word: אֶת כָּל הַיְּהוּדִים
  choice: semua orang Yahudi
  rationale: Terjemahan langsung yang mempertahankan cakupan total dari כָּל.
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: dari yang muda sampai yang tua
  rationale: Bentuk tunggal Ibrani berfungsi distributif sebagai merisme usia; ungkapan Indonesia ini alami dan tidak keliru membatasi frasa kepada laki-laki saja, terutama karena perempuan disebut secara eksplisit sesudahnya.
- source_word: טַף וְנָשִׁים
  choice: anak-anak dan perempuan
  rationale: טַף menunjuk anak-anak atau anak kecil; pilihan ini jelas dan mempertahankan penyebutan khusus kelompok nonkombatan.
- source_word: בְּיוֹם אֶחָד
  choice: dalam satu hari
  rationale: Mempertahankan penekanan bahwa seluruh kekerasan itu direncanakan berlangsung dalam satu hari.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר לְחֹדֶשׁ שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: pada hari ketiga belas bulan kedua belas, yakni bulan Adar
  rationale: Mengikuti rumusan tanggal Ibrani dan menerjemahkan aposisi הוּא secara alami dengan 'yakni'.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: serta merampas harta benda mereka
  rationale: Menangkap izin untuk menjarah milik para korban. Repetisi etimologis Ibrani tidak dapat dipertahankan secara alami tanpa menghasilkan bahasa Indonesia yang janggal.
