translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mempertahankan bentuk administratif titah, sedangkan tanda pisah membantu memperjelas daftar kelompok korban. Penanda catatan kaki [a] ditempatkan setelah klausa yang dijelaskannya.
