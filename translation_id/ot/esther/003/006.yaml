translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Ahasyweros mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Tanda pisah mempertahankan aposisi penutup dan penekanan pengulangan dalam teks Ibrani.
