revisions:
- from: Namun, Haman memandang terlalu remeh jika hanya menyerang Mordekhai seorang diri, sebab orang telah memberitahukan kepadanya bangsa asal Mordekhai.[a] Karena itu, Haman berusaha memusnahkan semua orang Yahudi di seluruh Kerajaan Ahasyweros—bangsa Mordekhai.
  to: Namun, Haman menganggap sebagai sesuatu yang terlalu remeh untuk menyerang Mordekhai saja, sebab mereka telah memberitahukan kepadanya dari bangsa mana Mordekhai berasal.[a] Karena itu, Haman berusaha memusnahkan semua orang Yahudi di seluruh kerajaan Ahasyweros—kaum Mordekhai.
  rationale: Revisi memperjelas bahwa penghinaan Haman tertuju pada keterbatasan sasaran tindakannya—Mordekhai saja—seraya mempertahankan urutan sebab-akibat, cakupan seluruh orang Yahudi dalam kerajaan Ahasyweros, dan pengulangan aposisional ‘kaum Mordekhai’ dari teks Ibrani.
