  text: וַ/יִּ֣בֶז בְּ/עֵינָ֗י/ו לִ/שְׁלֹ֤ח יָד֙ בְּ/מָרְדֳּכַ֣י לְ/בַדּ֔/וֹ כִּֽי הִגִּ֥ידוּ ל֖/וֹ אֶת עַ֣ם מָרְדֳּכָ֑י וַ/יְבַקֵּ֣שׁ הָמָ֗ן לְ/הַשְׁמִ֧יד אֶת כָּל הַ/יְּהוּדִ֛ים אֲשֶׁ֛ר בְּ/כָל מַלְכ֥וּת אֲחַשְׁוֵר֖וֹשׁ עַ֥ם מָרְדֳּכָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/006.yaml
  text: But it seemed contemptible in his eyes to lay a hand on Mordecai alone[a], because they had told him what people Mordecai belonged to. So Haman sought to destroy all the Jews throughout the whole kingdom of Ahasuerus—the people of Mordecai.
translation:
  language: id
  text: Namun, Haman menganggap sebagai sesuatu yang terlalu remeh untuk menyerang Mordekhai saja, sebab mereka telah memberitahukan kepadanya dari bangsa mana Mordekhai berasal.[a] Karena itu, Haman berusaha memusnahkan semua orang Yahudi di seluruh kerajaan Ahasyweros—kaum Mordekhai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bangsa Mordekhai”, yaitu bangsa atau kaum tempat Mordekhai berasal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶז בְּעֵינָיו
  choice: Haman memandang terlalu remeh
  rationale: Ungkapan Ibrani menyatakan penilaian yang diliputi penghinaan. Terjemahan ini alami dalam bahasa Indonesia dan menunjukkan bahwa Mordekhai seorang diri dianggap sasaran yang terlalu kecil.
- source_word: לִשְׁלֹחַ יָד בְּ
  choice: menyerang
  rationale: Idiom harfiahnya adalah ‘mengulurkan tangan terhadap’ dan mengacu pada tindakan kekerasan. ‘Menyerang’ mempertahankan maknanya tanpa memakai idiom Indonesia yang dapat disalahartikan.
- source_word: לְבַדּוֹ
  choice: seorang diri
  rationale: Menegaskan bahwa Haman tidak puas jika sasarannya hanya Mordekhai, berlawanan dengan rencananya terhadap seluruh bangsa Yahudi.
- source_word: כִּי הִגִּידוּ לוֹ
  choice: sebab orang telah memberitahukan kepadanya
  rationale: Klausa ini menjelaskan alasan Haman memperluas sasarannya. Bentuk ‘telah memberitahukan’ mencerminkan tindakan yang mendahului keputusannya.
- source_word: אֶת עַם מָרְדֳּכָי
  choice: bangsa asal Mordekhai
  rationale: Frasa harfiah ‘bangsa Mordekhai’ menunjuk pada kelompok etnis atau bangsa tempat Mordekhai berasal. Penambahan ‘asal’ memperjelas hubungan itu dalam bahasa Indonesia.
- source_word: וַיְבַקֵּשׁ
  choice: berusaha
  rationale: Kata ini menyatakan maksud dan upaya yang disengaja tanpa menyiratkan bahwa rencana tersebut sudah berhasil.
- source_word: לְהַשְׁמִיד
  choice: memusnahkan
  rationale: Bentuk kausatif שׁמד menyatakan penghancuran menyeluruh. ‘Memusnahkan’ menyampaikan kadar kekerasannya secara jelas dan wajar.
- source_word: כָּל הַיְּהוּדִים
  choice: semua orang Yahudi
  rationale: Dalam konteks Ester, istilah ini menunjuk pada orang Yahudi di diaspora Persia, bukan hanya penduduk wilayah Yehuda.
- source_word: אֲשֶׁר בְּכָל מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: di seluruh Kerajaan Ahasyweros
  rationale: Menyampaikan cakupan geografis seluruh wilayah kekuasaan raja dengan susunan Indonesia yang ringkas dan alami.
- source_word: עַם מָרְדֳּכָי
  choice: bangsa Mordekhai
  rationale: Pengulangan yang lebih harfiah dipertahankan sebagai aposisi sesudah ‘semua orang Yahudi’, sehingga penekanan retoris teks sumber tetap tampak.
