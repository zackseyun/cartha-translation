source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָֽ/עַמִּ֑ים לִ/הְי֥וֹת עֲתִדִ֖ים לַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/014.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made known to all the peoples[b], so that they would be ready for this day.
translation:
  language: id
  text: Salinan surat keputusan itu harus dikeluarkan sebagai hukum di tiap-tiap provinsi[a] dan diumumkan kepada semua suku bangsa, supaya mereka bersiap menghadapi hari itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di setiap provinsi dan provinsi.” Bahasa Ibrani mengulang kata “provinsi” secara distributif untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hari ini,” yakni hari tertentu yang ditetapkan dalam surat keputusan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: salinan surat itu
  rationale: Kata serapan Persia פַּתְשֶׁגֶן menunjuk pada salinan atau transkrip resmi, sedangkan הַכְּתָב berarti tulisan atau dokumen. Dalam konteks surat keputusan kerajaan, “salinan surat itu” jelas, alami, dan tidak menjadikan דָּת sebagai keputusan untuk kedua kalinya.
- source_word: לְהִנָּתֵן דָּת
  choice: harus ditetapkan sebagai hukum
  rationale: Bentuk pasif infinitif נתן menyatakan pemberlakuan atau penerbitan resmi, dan דָּת menunjuk pada ketetapan yang mengikat secara hukum. Ungkapan ini menyampaikan fungsi administratifnya dalam bahasa Indonesia yang wajar.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: di tiap-tiap provinsi
  rationale: Pengulangan distributif kata “provinsi” dalam bahasa Ibrani diteruskan secara alami melalui bentuk ulang “tiap-tiap,” yang menegaskan bahwa tidak satu provinsi pun dikecualikan.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: diumumkan kepada semua bangsa
  rationale: גָּלוּי menyatakan bahwa isi surat dibuat terbuka atau diketahui umum. “Diumumkan” cocok dengan konteks penerbitan resmi, dan “semua bangsa” menunjuk pada berbagai kelompok masyarakat dalam kekaisaran.
- source_word: לִהְיוֹת עֲתִדִים
  choice: supaya mereka bersiap
  rationale: Gabungan infinitif dan kata sifat ini menyatakan tujuan, yakni agar semua pihak berada dalam keadaan siap.
- source_word: לַיּוֹם הַזֶּה
  choice: menghadapi hari itu
  rationale: Secara bentuk berarti “untuk hari ini,” tetapi dalam alur narasi menunjuk kepada hari tertentu yang telah disebutkan dalam surat. “Menghadapi hari itu” merupakan ungkapan Indonesia yang alami untuk kesiapan terhadap hari yang ditentukan, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku dan modern dengan ragam naratif yang bermartabat. Bentuk “tiap-tiap” mempertahankan penekanan distributif sumber tanpa menghasilkan susunan yang kaku; istilah administratif dibuat jelas bagi pembaca umum.
