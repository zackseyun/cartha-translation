  text: אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִכָּתֵ֖ב לְ/אַבְּדָ֑/ם וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים כִּכַּר כֶּ֗סֶף אֶשְׁקוֹל֙ עַל יְדֵי֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה לְ/הָבִ֖יא אֶל גִּנְזֵ֥י הַ/מֶּֽלֶךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/009.yaml
  text: If it seems good to the king[a], let it be written that they be destroyed, and I will weigh out ten thousand talents of silver into the hands of those who do the work[c][b], to bring it into the king’s treasuries.
translation:
  language: id
  text: Jika raja berkenan[a], hendaklah ditulis agar mereka dibinasakan. Aku akan menimbang sepuluh ribu talenta perak[b] untuk diserahkan kepada orang-orang yang melaksanakan pekerjaan itu[c], agar mereka membawanya ke perbendaharaan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jika hal itu baik bagi raja”; maksudnya, “Jika raja menganggapnya baik” atau “Jika hal itu menyenangkan raja.”
    reason: lexical_alternative
  - marker: b
    text: Talenta adalah satuan berat yang besar. Teks Ibrani menyebut “sepuluh ribu talenta perak,” jumlah yang sangat besar dan diukur menurut berat, bukan berupa nilai mata uang logam tertentu.
    reason: cultural_note
  - marker: c
    text: Ungkapan Ibrani juga dapat berarti “melalui tangan orang-orang yang melaksanakan pekerjaan itu,” yakni melalui perantaraan para pelaksana tugas tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan istana ini menyatakan persetujuan atau kerelaan raja; 'berkenan' alami dan bermartabat dalam bahasa Indonesia.
- source_word: יִכָּתֵב
  choice: hendaklah ditulis
  rationale: Mempertahankan bentuk pasif harfiah verba כתב sekaligus menyiratkan penetapan tertulis resmi dalam konteks istana.
- source_word: לְאַבְּדָם
  choice: bahwa mereka harus dimusnahkan
  rationale: Menyatakan isi ketetapan dan maksud mematikan verba אבד tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: כִּכַּר כֶּסֶף
  choice: talenta perak
  rationale: כִּכָּר adalah satuan berat besar; istilah 'talenta' dipertahankan dan dijelaskan dalam catatan agar tidak diberi konversi modern yang spekulatif.
- source_word: אֶשְׁקוֹל
  choice: Aku akan menimbang
  rationale: Verba שקל secara konkret berarti menimbang; pilihan ini mempertahankan praktik pembayaran logam mulia berdasarkan berat.
- source_word: עַל יְדֵי
  choice: ke tangan
  rationale: Mempertahankan citra idiom Ibrani, yang dalam konteks ini dapat menyatakan penyerahan kepada atau pelaksanaan melalui para petugas.
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: orang-orang yang melaksanakan pekerjaan itu
  rationale: Menjaga cakupan rujukan tetap luas seperti teks Ibrani dan tidak langsung menentukan bahwa mereka adalah pejabat tertentu.
- source_word: לְהָבִיא
  choice: untuk dibawa
  rationale: Mengungkapkan tujuan tindakan dengan wajar; benda yang dibawa dipahami dari perak yang baru disebutkan.
- source_word: גִּנְזֵי הַמֶּלֶךְ
  choice: perbendaharaan-perbendaharaan raja
  rationale: Mempertahankan bentuk jamak גִּנְזֵי, meskipun bahasa Indonesia lazim pula memakai bentuk kolektif tunggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan nada permohonan resmi di istana. Istilah teknis kuno 'talenta' dipertahankan dengan penjelasan catatan kaki; identitas עֹשֵׂי הַמְּלָאכָה sengaja tidak dipersempit menjadi 'pejabat'.
