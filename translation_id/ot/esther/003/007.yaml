base_translation:
  language: en
  yaml_path: translation/ot/esther/003/007.yaml
  text: In the first month[a], that is, the month of Nisan, in the twelfth year of King Ahasuerus, Pur—that is, the lot—was cast before Haman, from day to day and from month to month, until the twelfth month, that is, the month of Adar.
translation:
  language: id
  text: Pada bulan pertama, yaitu bulan Nisan, pada tahun kedua belas pemerintahan Raja Ahasyweros, Pur—yakni undi—dibuang di hadapan Haman, dari hari ke hari dan dari bulan ke bulan, hingga bulan kedua belas, yaitu bulan Adar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dari hari ke hari dan dari bulan ke bulan, dua belas, yaitu bulan Adar.” Susunan Ibrani yang padat ini dipahami sebagai urutan pengundian yang berlanjut hingga bulan kedua belas.'
    reason: Kata “hingga” menjelaskan hubungan yang tersirat dalam susunan Ibrani, tanpa menambahkan tujuan pengundian atau cara hasilnya diperoleh.
lexical_decisions:
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: Pada bulan pertama
  rationale: Ungkapan waktu dengan בְּ paling alami diterjemahkan “pada,” sambil mempertahankan penanggalan kalender.
- source_word: הוּא חֹדֶשׁ נִיסָן
  choice: yaitu bulan Nisan
  rationale: הוּא memperkenalkan keterangan penjelas yang menyebut nama bulan.
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: pada tahun kedua belas pemerintahan Raja Ahasyweros
  rationale: Tambahan “pemerintahan” menyampaikan secara alami bahwa ini adalah tahun pemerintahan raja, sebagaimana tersirat dalam rumusan penanggalan Ibrani.
- source_word: הִפִּיל פּוּר
  choice: orang membuang Pur
  rationale: Bentuk verba Ibrani adalah aktif dengan subjek tak tentu. “Orang” mempertahankan ketaktentuan pelaku tanpa mengubahnya menjadi bentuk pasif.
- source_word: פּוּר הוּא הַגּוֹרָל
  choice: Pur—yaitu undi—
  rationale: Istilah pinjaman Persia dipertahankan dan langsung dijelaskan oleh padanan Ibraninya; “undi” alami dalam konteks membuang undi.
- source_word: לִפְנֵי הָמָן
  choice: di hadapan Haman
  rationale: Menyatakan bahwa tindakan itu dilakukan dalam kehadiran Haman tanpa memastikan bahwa Haman sendiri pelakunya.
- source_word: מִיּוֹם לְיוֹם וּמֵחֹדֶשׁ לְחֹדֶשׁ
  choice: dari hari ke hari dan dari bulan ke bulan
  rationale: Mempertahankan paralelisme dan gerak berurutan dalam teks Ibrani.
- source_word: שְׁנֵים עָשָׂר הוּא חֹדֶשׁ אֲדָר
  choice: sampai bulan kedua belas, yaitu bulan Adar
  rationale: “Sampai” menjelaskan tujuan urutan waktu yang tersirat dalam konteks, sedangkan catatan kaki mempertahankan bentuk harfiahnya yang sukar.
