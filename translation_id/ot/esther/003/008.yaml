  text: וַ/יֹּ֤אמֶר הָמָן֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ יֶשְׁנ֣/וֹ עַם אֶחָ֗ד מְפֻזָּ֤ר וּ/מְפֹרָד֙ בֵּ֣ין הָֽ/עַמִּ֔ים בְּ/כֹ֖ל מְדִינ֣וֹת מַלְכוּתֶ֑/ךָ וְ/דָתֵי/הֶ֞ם שֹׁנ֣וֹת מִ/כָּל עָ֗ם וְ/אֶת דָּתֵ֤י הַ/מֶּ֨לֶךְ֙ אֵינָ֣/ם עֹשִׂ֔ים וְ/לַ/מֶּ֥לֶךְ אֵין שֹׁוֶ֖ה לְ/הַנִּיחָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/008.yaml
  text: Then Haman said to King Ahasuerus[a], “There is a certain people, scattered and separated among the peoples in all the provinces of your kingdom. Their laws are different from those of every other people, and they do not keep the king’s laws, so it is not in the king’s interest to let them remain.”
translation:
  language: id
  text: Lalu Haman berkata kepada Raja Ahasyweros, “Ada suatu bangsa yang tercerai-berai dan terpisah di antara bangsa-bangsa di semua provinsi kerajaan Baginda. Hukum-hukum mereka berbeda dari hukum semua bangsa lain, dan mereka tidak menaati hukum-hukum raja. Karena itu, tidak ada gunanya bagi raja untuk membiarkan mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membiarkan mereka saja” atau “membiarkan mereka hidup tanpa gangguan.” Kata kerja Ibrani dapat berarti membiarkan atau meninggalkan seseorang tanpa mengusiknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶשְׁנוֹ עַם אֶחָד
  choice: Ada suatu bangsa
  rationale: Ungkapan ini memperkenalkan satu kelompok tertentu tanpa menyebut namanya. “Suatu bangsa” mempertahankan nada Haman yang sengaja samar dan menyudutkan.
- source_word: מְפֻזָּר וּמְפֹרָד
  choice: tercerai-berai dan terpisah
  rationale: Kedua partisip Ibrani dipertahankan. Pilihan ini menyampaikan penumpukan retoris tanpa menafsirkan kata kedua sebagai perpecahan internal.
- source_word: בֵּין הָעַמִּים
  choice: di antara bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok bangsa dalam kekaisaran, bukan negara-negara berdaulat dalam pengertian modern.
- source_word: בְּכֹל מְדִינוֹת מַלְכוּתֶךָ
  choice: di seluruh provinsi kerajaan Baginda
  rationale: מְדִינוֹת dalam Ester menunjuk pada wilayah administratif. “Baginda” merupakan sapaan Indonesia yang wajar dan hormat ketika berbicara langsung kepada raja.
- source_word: דָתֵיהֶם שֹׁנוֹת מִכָּל עָם
  choice: Hukum-hukum mereka berbeda dari hukum setiap bangsa lain
  rationale: דָּת memiliki daya hukum dalam konteks istana Persia. Pengulangan “hukum” memperjelas bahwa yang dibandingkan ialah hukum kelompok itu dengan hukum bangsa-bangsa lain.
- source_word: וְאֶת דָּתֵי הַמֶּלֶךְ אֵינָם עֹשִׂים
  choice: dan mereka tidak menaati hukum-hukum raja
  rationale: עָשָׂה dengan objek “hukum” berarti menjalankan atau menaati. “Menaati” alami dalam bahasa Indonesia dan mempertahankan sifat tuduhan Haman.
- source_word: וְלַמֶּלֶךְ אֵין שֹׁוֶה
  choice: Karena itu, tidak menguntungkan bagi Baginda
  rationale: Ungkapan ini menyatakan tidak adanya manfaat atau keuntungan bagi raja. “Karena itu” mengungkapkan hubungan kesimpulan yang tersirat dalam rangkaian tuduhan Haman.
- source_word: לְהַנִּיחָם
  choice: untuk membiarkan mereka tetap ada
  rationale: Bentuk kausatif dari נוח di sini berarti membiarkan, meninggalkan tanpa gangguan, atau mengizinkan tetap berlangsung. Terjemahan utama menyampaikan desakan Haman agar bangsa itu tidak dibiarkan terus berada dalam kerajaan, sementara alternatifnya dicatat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Baginda” dipakai untuk akhiran orang kedua yang ditujukan kepada raja, sedangkan “raja” dipertahankan ketika Haman menyebut jabatan itu. Penanda catatan kaki ditempatkan pada frasa yang benar-benar diterangkannya, bukan setelah nama Ahasyweros.
