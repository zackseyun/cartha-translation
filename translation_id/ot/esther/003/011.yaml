  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom “baik di matamu” dipertahankan karena mudah dimengerti serta mencerminkan ungkapan sumber. Bentuk “kauperlakukan” dipilih agar kalimat tetap ringkas dan alami.
