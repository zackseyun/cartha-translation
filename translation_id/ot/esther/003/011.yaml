  yaml_path: translation/ot/esther/003/011.yaml
  text: Then the king said to Haman[a], “The silver is given to you, and the people also[b], to do with them as seems good in your eyes.”
translation:
  language: id
  text: Lalu raja berkata kepada Haman, “Perak itu[a] diberikan kepadamu, dan rakyat itu pun diberikan kepadamu, untuk kauperlakukan sebagaimana yang kauanggap baik.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Uang itu.” Kata Ibrani כֶּסֶף dapat berarti “perak” secara harfiah atau “uang” sebagai perluasan makna.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “lalu” menyatakan urutan secara wajar dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Menerjemahkan nomina tentu secara langsung tanpa menggantinya dengan nama khusus, karena teks Ibrani memakai gelar.
- source_word: לְהָמָן
  choice: kepada Haman
  rationale: Preposisi menandai pihak yang disapa; nama diri ditransliterasikan dalam bentuk yang lazim.
- source_word: הַכֶּסֶף
  choice: Perak itu
  rationale: כֶּסֶף secara harfiah berarti “perak” dan, melalui perluasan makna, dapat berarti “uang.” “Perak” mempertahankan bentuk konkret teks sambil mencatat alternatif kontekstual dalam catatan kaki.
- source_word: נָתוּן לָךְ
  choice: diberikan kepadamu
  rationale: Konstruksi partisip pasif menyatakan bahwa perak atau uang tersebut diberikan atau ditempatkan dalam kuasa Haman, tanpa menentukan lebih jauh apakah ia harus menyimpannya atau memakainya.
- source_word: וְהָעָם
  choice: demikian juga rakyat itu
  rationale: Konjungsi menambahkan rakyat sebagai hal kedua yang diserahkan kepada Haman. “Demikian juga” membuat hubungan ini jelas dan alami.
- source_word: לַעֲשׂוֹת בּוֹ
  choice: untuk kauperlakukan
  rationale: Infinitif menyatakan tujuan, sedangkan ungkapan “memperlakukan” menyampaikan tindakan Haman terhadap rakyat secara alami. Pronomina Ibrani berbentuk tunggal karena merujuk kepada nomina kolektif הָעָם.
- source_word: כַּטּוֹב בְּעֵינֶיךָ
  choice: menurut apa yang baik di matamu
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang apa yang dipandang baik atau patut oleh seseorang, namun tetap dapat dipahami dalam bahasa Indonesia.
