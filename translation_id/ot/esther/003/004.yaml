base_translation:
  language: en
  yaml_path: translation/ot/esther/003/004.yaml
  text: And when they spoke to him day after day and he would not listen to them[a], they told Haman, to see whether Mordecai’s words would stand, for he had told them that he was a Jew.
translation:
  language: id
  text: Ketika mereka berbicara kepadanya hari demi hari dan ia tidak mau mendengarkan mereka, mereka melaporkan hal itu kepada Haman untuk melihat apakah perkataan Mordekhai akan bertahan,[a] sebab Mordekhai telah memberi tahu mereka bahwa ia seorang Yahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “apakah perkataan Mordekhai akan berdiri.” Ungkapan ini dapat merujuk pada apakah alasan yang ia nyatakan akan bertahan atau pada apakah pendiriannya akan tetap teguh di bawah tekanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְאָמְרָם אֵלָיו
  choice: Ketika mereka berbicara kepadanya
  rationale: Rumus naratif וַיְהִי dengan ב dan infinitif menandai keadaan waktu. 'Ketika' menyampaikannya secara alami dalam bahasa Indonesia tanpa mempertahankan ungkapan kaku 'terjadilah ketika'.
- source_word: יוֹם וָיוֹם
  choice: hari demi hari
  rationale: Ungkapan ini menunjukkan tindakan yang berulang setiap hari dan menonjolkan kegigihan mereka.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  choice: tetapi ia tidak mau mendengarkan mereka
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. 'Tidak mau' menyatakan penolakan yang terus berlangsung dalam konteks tindakan berulang.
- source_word: וַיַּגִּידוּ לְהָמָן
  choice: mereka memberitahukannya kepada Haman
  rationale: Bentuk Hifil נגד berarti memberi tahu atau melaporkan. Akhiran '-nya' secara alami merujuk pada perkara atau sikap Mordekhai yang baru disebutkan.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan tindakan mereka.
- source_word: הֲיַעַמְדוּ דִּבְרֵי מָרְדֳּכַי
  choice: apakah perkataan Mordekhai akan tetap berlaku
  rationale: Secara harfiah frasa ini menanyakan apakah 'perkataan Mordekhai akan berdiri'. 'Tetap berlaku' mempertahankan gagasan bahwa perkataan atau alasan itu akan bertahan atau diakui, tanpa menentukan satu nuansa saja.
- source_word: כִּי הִגִּיד לָהֶם
  choice: sebab Mordekhai telah memberi tahu mereka
  rationale: כִּי memberikan alasan bagi laporan mereka kepada Haman. 'Telah memberi tahu' menunjukkan bahwa pemberitahuan Mordekhai mendahului laporan tersebut; nama diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר הוּא יְהוּדִי
  choice: bahwa ia seorang Yahudi
  rationale: יְהוּדִי merupakan sebutan identitas etnoreligius; bentuk nominal 'seorang Yahudi' sesuai dengan konstruksi predikatif Ibrani dan lazim dalam bahasa Indonesia.
