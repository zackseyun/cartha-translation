translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama מָרְדֳּכַי ditulis 'Mordekhai' agar lebih dekat dengan bentuk Ibrani. Metafora Ibrani pada דִּבְרֵי ... יַעַמְדוּ dijelaskan dalam catatan kaki karena terjemahan harfiahnya kurang alami dalam teks utama.
