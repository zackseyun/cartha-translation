  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar daftar administratif panjang tetap mudah dipahami. Istilah teknis “satrap” dipertahankan untuk membedakan jabatan Persia itu dari “gubernur”; ejaan nama “Ahasyweros” mengikuti bentuk Indonesia yang lazim dalam tradisi Alkitab.
