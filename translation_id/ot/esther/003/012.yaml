source:
  edition: WLC
  text: וַ/יִּקָּרְאוּ֩ סֹפְרֵ֨י הַ/מֶּ֜לֶךְ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֗וֹן בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֣ר יוֹם֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה הָמָ֡ן אֶ֣ל אֲחַשְׁדַּרְפְּנֵֽי הַ֠/מֶּלֶךְ וְֽ/אֶל הַ/פַּח֞וֹת אֲשֶׁ֣ר עַל מְדִינָ֣ה וּ/מְדִינָ֗ה וְ/אֶל שָׂ֤רֵי עַם֙ וָ/עָ֔ם מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשׁוֹנ֑/וֹ בְּ/שֵׁ֨ם הַ/מֶּ֤לֶךְ אֲחַשְׁוֵרֹשׁ֙ נִכְתָּ֔ב וְ/נֶחְתָּ֖ם בְּ/טַבַּ֥עַת הַ/מֶּֽלֶךְ־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/012.yaml
  text: Then the king’s scribes were summoned in the first month[a], on the thirteenth day of it, and it was written exactly as Haman commanded to the king’s satraps, to the governors who were over each province, and to the officials of each people, to every province in its own script and to every people in its own language[b]. It was written in the name of King Ahasuerus and sealed with the king’s signet ring.
translation:
  language: id
  text: 'Kemudian, pada bulan pertama[a], pada hari ketiga belas bulan itu, para juru tulis raja dipanggil. Ditulislah kepada para satrap raja, kepada para gubernur yang mengepalai setiap provinsi, dan kepada para pejabat dari setiap bangsa, sesuai dengan segala yang diperintahkan Haman: kepada setiap provinsi menurut aksaranya dan kepada setiap bangsa menurut bahasanya[b]. Hal itu ditulis atas nama Raja Ahasyweros dan dimeteraikan dengan cincin meterai raja.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bulan pertama adalah bulan Nisan (lihat ayat 7), sekitar Maret–April.
    reason: cultural_note
  - marker: b
    text: “Aksara” adalah sistem tulisan yang digunakan di setiap provinsi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: para juru tulis raja dipanggil
  rationale: Bentuk pasif Niphal dipertahankan, sedangkan “juru tulis raja” menyampaikan jabatan resmi istana secara jelas.
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: pada bulan pertama, pada hari ketiga belas bulan itu
  rationale: Mengikuti urutan dan rujukan waktu dalam bahasa Ibrani dengan ungkapan Indonesia yang wajar.
- source_word: וַיִּכָּתֵב כְּכָל אֲשֶׁר צִוָּה הָמָן
  choice: Segala sesuatu yang diperintahkan Haman dituliskan
  rationale: Mempertahankan konstruksi pasif tanpa menambahkan kata benda eksplisit seperti “titah”; כְּכָל menyatakan kesesuaian menyeluruh.
- source_word: אֲחַשְׁדַּרְפְּנֵי הַמֶּלֶךְ
  choice: para satrap raja
  rationale: “Satrap” mempertahankan gelar administratif Persia dan membedakannya dari para gubernur yang disebut sesudahnya.
- source_word: הַפַּחוֹת אֲשֶׁר עַל מְדִינָה וּמְדִינָה
  choice: para gubernur yang mengepalai setiap provinsi
  rationale: Pengulangan distributif diterjemahkan sebagai “setiap provinsi”; “mengepalai” menyatakan wewenang administratif tanpa melebihkan maknanya.
- source_word: שָׂרֵי עַם וָעָם
  choice: para pemimpin setiap suku bangsa
  rationale: שָׂרִים dapat berarti pejabat atau pemimpin; “pemimpin” alami dalam daftar penerima yang mewakili tiap kelompok etnis.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: setiap provinsi menurut aksaranya
  rationale: כְּתָב menunjuk pada sistem tulisan; “aksara” tepat dan ringkas dalam konteks kekaisaran multibahasa.
- source_word: וְעַם וָעָם כִּלְשׁוֹנוֹ
  choice: setiap suku bangsa menurut bahasanya
  rationale: לָשׁוֹן berarti bahasa di sini, sedangkan pengulangan Ibrani menyatakan masing-masing kelompok.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ נִכְתָּב
  choice: Surat itu ditulis atas nama Raja Ahasyweros
  rationale: “Atas nama” secara tepat menyampaikan otoritas resmi raja. “Surat” diperjelas dari konteks dokumen kerajaan dan memungkinkan rujukan alami dalam bahasa Indonesia.
- source_word: וְנֶחְתָּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: dimeteraikan dengan cincin meterai raja
  rationale: Menyampaikan tindakan pengesahan dengan cincin cap resmi secara alami dan tepat.
