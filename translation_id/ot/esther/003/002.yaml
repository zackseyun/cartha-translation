  text: וְ/כָל עַבְדֵ֨י הַ/מֶּ֜לֶךְ אֲשֶׁר בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ כֹּרְעִ֤ים וּ/מִֽשְׁתַּחֲוִים֙ לְ/הָמָ֔ן כִּי כֵ֖ן צִוָּה ל֣/וֹ הַ/מֶּ֑לֶךְ וּ/מָ֨רְדֳּכַ֔י לֹ֥א יִכְרַ֖ע וְ/לֹ֥א יִֽשְׁתַּחֲוֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/002.yaml
  text: And all the king’s servants who were at the king’s gate were bowing down and paying homage to Haman[a], for the king had so commanded concerning him[b]. But Mordecai would not bow down or pay homage.
translation:
  language: id
  text: Semua pegawai raja yang berada di gerbang istana berlutut dan sujud memberi hormat kepada Haman[a], sebab demikianlah yang diperintahkan raja mengenai dia[b]. Namun, Mordekhai tidak mau berlutut ataupun sujud memberi hormat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bersujud di hadapan Haman"; kata kerja Ibrani yang digunakan di sini juga dapat diterjemahkan "menyembah" apabila yang menjadi objeknya adalah Allah.
    reason: lexical_alternative
  - marker: b
    text: Atau "sebab demikianlah raja memerintahkan kepadanya"; tetapi kata ganti itu lebih mungkin merujuk kepada Haman, yakni bahwa perintah tersebut menyangkut penghormatan yang harus diberikan kepadanya.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: pegawai raja
  rationale: Dalam konteks istana, frasa ini menunjuk kepada orang-orang yang melayani raja. 'Pegawai raja' terdengar alami dalam bahasa Indonesia dan tidak menyiratkan status budak.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: di gerbang istana
  rationale: Ungkapan ini menunjuk pada gerbang kompleks kerajaan sebagai tempat kegiatan resmi. 'Gerbang istana' lebih alami daripada bentuk harfiah 'gerbang raja' dalam bahasa Indonesia.
- source_word: כֹּרְעִים
  choice: berlutut
  rationale: Partisip Ibrani menggambarkan tindakan yang lazim atau berulang. Dalam rangkaian dengan tindakan sujud, 'berlutut' mempertahankan unsur jasmani yang berbeda tanpa mempersempit makna keseluruhan penghormatan.
- source_word: וּמִשְׁתַּחֲוִים
  choice: sujud memberi hormat
  rationale: Kata kerja ini dapat berarti bersujud, memberi penghormatan, atau menyembah, bergantung pada objek dan konteks. Karena objeknya Haman, pilihan ini mempertahankan gerak tubuh dan makna penghormatan tanpa secara tidak perlu menetapkannya sebagai ibadah.
- source_word: כִּי כֵן צִוָּה לוֹ הַמֶּלֶךְ
  choice: sebab demikianlah yang diperintahkan raja mengenai dia
  rationale: 'Pronomina לוֹ paling wajar dipahami merujuk kepada Haman: perintah raja berkenaan dengan penghormatan yang harus diberikan kepadanya. Namun, kemungkinan bahwa Hamanlah yang diperintah dicatat dalam catatan kaki.'
- source_word: לֹא יִכְרַע וְלֹא יִשְׁתַּחֲוֶה
  choice: tidak mau berlutut ataupun sujud memberi hormat
  rationale: Bentuk imperfek dalam konteks ini menyatakan penolakan Mordekhai yang disengaja dan terus-menerus. 'Tidak mau' menyampaikan unsur kehendak tersebut.
theological_decisions:
- issue: Apakah הִשְׁתַּחֲוָה harus diterjemahkan dengan istilah keagamaan yang tegas, yaitu 'menyembah'
  choice: sujud memberi hormat
  alternative: menyembah; bersujud
  rationale: Kata Ibrani ini dapat dipakai untuk penyembahan kepada Allah maupun penghormatan kepada manusia. Konteks menyebut Haman sebagai penerima tindakan itu, sehingga 'menyembah' akan memasukkan klaim teologis yang tidak diwajibkan teks. 'Sujud memberi hormat' mempertahankan ketegangan antara gerak jasmani dan penghormatan yang mendalam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Mordekhai' mengikuti transliterasi yang lebih dekat dengan bentuk Ibrani. Pasangan 'berlutut' dan 'sujud memberi hormat' mempertahankan dua kata kerja sumber serta menghindari penafsiran keagamaan yang terlalu tegas.
