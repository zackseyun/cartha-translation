  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣רְא הָמָ֔ן כִּי אֵ֣ין מָרְדֳּכַ֔י כֹּרֵ֥עַ וּ/מִֽשְׁתַּחֲוֶ֖ה ל֑/וֹ וַ/יִּמָּלֵ֥א הָמָ֖ן חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/005.yaml
  text: When Haman saw that Mordecai was neither bowing down nor prostrating himself before him[a], Haman was filled with rage.
translation:
  language: id
  text: Ketika Haman melihat bahwa Mordekhai tidak berlutut ataupun bersujud di hadapannya[a], Haman dipenuhi amarah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak membungkuk ataupun memberi hormat kepadanya.” Bahasa Ibrani memakai dua kata kerja yang berkaitan tetapi berbeda untuk tindakan merendahkan diri sebagai penghormatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika Haman melihat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; dalam konteks ini, klausa temporal dengan 'ketika' menghasilkan narasi Indonesia yang alami.
- source_word: כִּי אֵין מָרְדֳּכַי
  choice: bahwa Mordekhai tidak
  rationale: אֵין bersama bentuk partisip menyatakan tindakan berkelanjutan yang dinegasikan; susunan ini merupakan ungkapan Indonesia yang wajar.
- source_word: כֹּרֵעַ
  choice: berlutut
  rationale: כרע menunjuk pada menekuk lutut atau merendahkan tubuh. 'Berlutut' mempertahankan tindakan jasmani yang konkret dan membedakannya dari verba berikutnya.
- source_word: וּמִשְׁתַּחֲוֶה
  choice: ataupun bersujud
  rationale: השתחוה lazim menunjuk pada tindakan merebahkan atau merendahkan diri sebagai penghormatan. 'Bersujud' alami dalam bahasa Indonesia dan mempertahankan tindakan jasmani tanpa menjadikannya ibadah secara eksplisit.
- source_word: לוֹ
  choice: di hadapannya
  rationale: Secara harfiah berarti 'kepadanya', tetapi dengan kedua gerak penghormatan ini, 'di hadapannya' lebih alami dan menyampaikan arah tindakan tersebut.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: Haman dipenuhi amarah
  rationale: Mempertahankan idiom Ibrani 'dipenuhi' dan menyampaikan kemarahan yang sangat kuat dengan ungkapan Indonesia yang bermartabat serta alami.
- source_word: חֵמָה
  choice: amarah
  rationale: '''Amarah'' mengungkapkan kemarahan hebat dalam register naratif yang kuat tanpa membatasi istilah itu pada murka ilahi.'
theological_decisions:
- issue: Apakah השתחוה harus diterjemahkan sebagai penyembahan atau penghormatan sosial-politik
  choice: bersujud
  alternative: memberi hormat
  rationale: Teks menggambarkan tindakan penghormatan jasmani di lingkungan istana, tetapi kata Ibrani dapat dipakai dalam konteks yang lebih luas. 'Bersujud' mempertahankan tindakan konkret dan ketegangan maknanya tanpa secara teologis menetapkannya sebagai ibadah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama מָרְדֳּכַי ditulis 'Mordekhai' agar cukup dekat dengan bentuk Ibrani sekaligus mudah dibaca. Pasangan 'berlutut' dan 'bersujud' mempertahankan dua tindakan yang berbeda, sedangkan catatan kaki memberi alternatif fungsional dalam konteks penghormatan istana.
