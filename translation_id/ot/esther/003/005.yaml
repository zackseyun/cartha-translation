  terminology: Nama “Mordekhai” konsisten dengan transliterasi yang dekat dengan Ibrani dan tetap mudah dibaca. “Amarah” memadai untuk חֵמָה dalam konteks ini. Catatan kaki secara berguna menjelaskan bahwa dua verba Ibrani berkaitan namun tidak identik; alternatifnya tidak menghapus perbedaan utama dalam teks.
