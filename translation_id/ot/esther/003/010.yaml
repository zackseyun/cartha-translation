base_translation:
  language: en
  yaml_path: translation/ot/esther/003/010.yaml
  text: So the king took his signet ring from his hand and gave it to Haman son of Hammedatha the Agagite[a], the enemy of the Jews.
translation:
  language: id
  text: Lalu raja menanggalkan cincin meterainya dari tangannya dan memberikannya kepada Haman anak Hamedata, orang Agag, musuh orang Yahudi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Yehuda.” Kata Ibrani יְהוּדִים dapat menunjuk kepada orang Yahudi secara luas atau, dalam konteks tertentu, kepada orang dari Yehuda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: menanggalkan
  rationale: Kata kerja ini berarti melepaskan atau mengambil dari tempatnya. Dalam konteks cincin yang sedang dikenakan pada tangan, “menanggalkan” menyatakan tindakan itu secara alami dan tepat.
- source_word: טַבַּעְתּוֹ
  choice: cincin meterainya
  rationale: Dalam lingkungan istana, cincin ini membawa meterai resmi kerajaan, bukan sekadar perhiasan. “Cincin meterai” menjelaskan fungsi politiknya tanpa menambahkan tafsiran yang tidak dinyatakan.
- source_word: מֵעַל יָדוֹ
  choice: dari tangannya
  rationale: Terjemahan langsung dan wajar yang mempertahankan gambaran Ibrani.
- source_word: וַיִּתְּנָהּ
  choice: memberikannya
  rationale: Bentuk dengan pronomina objek merujuk kembali kepada cincin meterai; “memberikannya” dekat dengan teks sumber dan alami dalam bahasa Indonesia.
- source_word: לְהָמָן
  choice: kepada Haman
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן הַמְּדָתָא
  choice: anak Hamedata
  rationale: Konstruksi patronimik diterjemahkan secara langsung, dengan nama yang ditransliterasikan.
- source_word: הָאֲגָגִי
  choice: orang Agag itu
  rationale: Sebutan ini menunjukkan asal-usul atau garis keturunan yang berkaitan dengan Agag. Bentuk ini mempertahankan kaitan naratif tanpa menjabarkannya secara spekulatif.
- source_word: צֹרֵר
  choice: musuh
  rationale: Partisip ini menunjuk kepada orang yang memusuhi atau menentang; “musuh” merupakan padanan yang lugas dan kuat dalam konteks.
- source_word: הַיְּהוּדִים
  choice: orang Yahudi
  rationale: Dalam kitab Ester, istilah ini menunjuk kepada kelompok etnis yang menjadi sasaran Haman. “Orang Yahudi” adalah sebutan baku dan mudah dipahami, sementara kemungkinan arti “orang Yehuda” dicatat dalam catatan kaki.
- source_word: וַ
  choice: Lalu
  rationale: Waw naratif melanjutkan rangkaian peristiwa. “Lalu” menyampaikan kelanjutan tindakan secara alami tanpa memaksakan hubungan sebab-akibat yang lebih kuat daripada teks.
