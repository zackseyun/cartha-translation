  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה גִּדַּל֩ הַ/מֶּ֨לֶךְ אֲחַשְׁוֵר֜וֹשׁ אֶת הָמָ֧ן בֶּֽן הַמְּדָ֛תָא הָ/אֲגָגִ֖י וַֽ/יְנַשְּׂאֵ֑/הוּ וַ/יָּ֨שֶׂם֙ אֶת כִּסְא֔/וֹ מֵ/עַ֕ל כָּל הַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/001.yaml
  text: After these things[a], King Ahasuerus promoted Haman son of Hammedatha the Agagite, exalted him[c][b], and set his throne above all the officials who were with him.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa itu, Raja Ahasyweros memajukan Haman, anak Hamedata, orang Agag[a], meninggikannya, dan menempatkan takhtanya[b] lebih tinggi daripada semua pejabat yang menyertai raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan Ibrani ini dapat menunjukkan garis keturunan, kaum, atau hubungan dengan Agag.
    reason: cultural_note
  - marker: b
    text: Atau, “kursinya.” Kata Ibrani ini dapat berarti takhta, kursi, atau kursi jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah peristiwa-peristiwa itu
  rationale: Ungkapan ini merupakan formula waktu yang mengantar perkembangan narasi berikutnya. 'Peristiwa-peristiwa' menyampaikan makna דְּבָרִים secara alami dalam konteks ini tanpa mengharuskannya berarti perkataan.
- source_word: גִּדַּל
  choice: mengangkat ... ke kedudukan yang tinggi
  rationale: Dalam konteks istana, kata kerja ini menunjuk pada peningkatan status atau pangkat. Pilihan ini jelas dalam bahasa Indonesia dan tetap mempertahankan gambaran peninggian.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Urutan gelar lalu nama alami dalam bahasa Indonesia; ejaan Ahasyweros mempertahankan bentuk nama Ibrani yang lazim dikenali.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Haman anak Hamedata
  rationale: Nama diri dan patronimik dialihaksarakan, sementara hubungan anak dipertahankan secara eksplisit.
- source_word: הָאֲגָגִי
  choice: orang Agag
  rationale: Bentuk ini mempertahankan sebutan Ibrani sebagai penanda garis keturunan, kaum, atau hubungan dengan Agag tanpa menetapkan tafsiran historis tertentu.
- source_word: וַיְנַשְּׂאֵהוּ
  choice: ke kedudukan yang tinggi
  rationale: Kata kerja ini melanjutkan gagasan peninggian Haman. Dalam bahasa Indonesia, penggabungannya dengan 'mengangkat' menghindari pengulangan kaku sambil mempertahankan nuansa kehormatan dan kenaikan pangkat.
- source_word: וַיָּשֶׂם אֶת כִּסְאוֹ
  choice: menempatkan kursinya
  rationale: כִּסֵּא dapat berarti takhta atau kursi sebagai lambang jabatan. 'Kursinya' mempertahankan kemungkinan bahwa yang dimaksud ialah kedudukan resmi, bukan takhta kerajaan Haman sendiri.
- source_word: מֵעַל כָּל הַשָּׂרִים
  choice: lebih tinggi daripada semua pejabat
  rationale: Ungkapan ini menyatakan keunggulan pangkat. 'Pejabat' merupakan padanan modern yang sesuai untuk para pembesar istana Persia.
- source_word: אֲשֶׁר אִתּוֹ
  choice: yang menyertai raja
  rationale: Acuan pronomina paling wajar adalah raja. Menyebut 'raja' memperjelas rujukan yang dapat terasa kabur dalam bahasa Indonesia tanpa mengubah hubungan antartokoh.
