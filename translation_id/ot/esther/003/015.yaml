  text: הָֽ/רָצִ֞ים יָצְא֤וּ דְחוּפִים֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֑ה וְ/הַ/מֶּ֤לֶךְ וְ/הָמָן֙ יָשְׁב֣וּ לִ/שְׁתּ֔וֹת וְ/הָ/עִ֥יר שׁוּשָׁ֖ן נָבֽוֹכָה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/003/015.yaml
  text: The couriers went out[a], hurried by the king’s command, and the decree was issued in Susa the citadel. And the king and Haman sat down to drink[b], but the city of Susa was thrown into confusion.
translation:
  language: id
  text: Para kurir berangkat dengan tergesa-gesa atas perintah raja, dan ketetapan itu[a] dikeluarkan di Susan, kota benteng itu. Raja dan Haman duduk untuk minum, tetapi kota Susan dilanda kebingungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hukum itu diberikan di Susan, kota benteng itu.” Kata kerja Ibraninya secara harfiah berarti “diberikan”, dan דָּת dapat diterjemahkan “hukum” atau “ketetapan” dalam konteks pemerintahan Persia.
    reason: lexical_alternative
  - marker: b
    text: Atau “kota Susan menjadi bingung” atau “berada dalam kekacauan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: para kurir
  rationale: Dalam konteks pemerintahan Persia, kata ini menunjuk kepada para pembawa berita resmi kerajaan. “Kurir” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia modern.
- source_word: דְחוּפִים
  choice: dengan segera, didesak
  rationale: Ungkapan ini mempertahankan baik unsur urgensi maupun nuansa bahwa para kurir didorong atau didesak untuk bertindak cepat.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: oleh perintah raja
  rationale: דָּבָר di sini berarti titah atau perintah yang berwenang, bukan sekadar perkataan.
- source_word: הַדָּת
  choice: ketetapan
  rationale: Dalam lingkungan administratif Persia, דָּת menunjuk kepada ketetapan resmi yang memiliki kekuatan hukum. “Ketetapan” terdengar formal tanpa menyiratkan keseluruhan kitab hukum.
- source_word: נִתְּנָה
  choice: dikeluarkan
  rationale: Walaupun arti harfiahnya “diberikan”, dalam konteks administratif kata ini menyatakan penerbitan resmi suatu ketetapan.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: benteng Susan
  rationale: בִּירָה menunjuk kepada kompleks istana berbenteng atau benteng kerajaan di Susan, yang dibedakan dari kota Susan secara lebih luas pada akhir ayat.
- source_word: יָשְׁבוּ לִשְׁתּוֹת
  choice: duduk untuk minum
  rationale: Terjemahan langsung dan alami ini mempertahankan kontras tajam antara tindakan raja dan Haman dengan reaksi penduduk kota.
- source_word: נָבוֹכָה
  choice: dilanda kebingungan
  rationale: Bentuk Nifal ini menggambarkan keadaan bingung, gelisah, atau kacau. “Dilanda kebingungan” mempertahankan nuansa resultatifnya.
- source_word: וְ
  choice: tetapi
  rationale: Konjungsi Ibrani secara bentuk berarti “dan”, tetapi di sini menghubungkan dua keadaan yang sangat berlawanan; “tetapi” mengungkapkan daya kontras naratif itu secara wajar dalam bahasa Indonesia.
