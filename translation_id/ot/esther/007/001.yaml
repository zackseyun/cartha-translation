lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu ... datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan alur cerita. 'Datang' mempertahankan arti umum verba tanpa menambahkan gagasan 'masuk' yang tidak dinyatakan secara eksplisit; 'lalu' menyampaikan urutan naratif secara alami.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan baku bagi מֶלֶךְ dengan artikel; konteks telah menunjukkan raja yang dimaksud, dan bahasa Indonesia lazim tidak memerlukan penanda definit terpisah.
- source_word: וְהָמָן
  choice: dan Haman
  rationale: Konjungsi diterjemahkan langsung, sedangkan nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: לִשְׁתּוֹת
  choice: untuk minum
  rationale: Infinitif konstruk dari שׁתה berarti 'minum'. Walaupun konteksnya jamuan, teks tidak secara eksplisit menyebut anggur atau memakai verba yang lebih luas untuk berpesta.
- source_word: עִם
  choice: bersama
  rationale: Padanan alami untuk preposisi yang menyatakan penyertaan.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Mengikuti bentuk nama yang baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Susunan Ibrani secara harfiah ialah 'Ester sang ratu', tetapi dalam bahasa Indonesia gelar sebelum nama lebih alami dan tidak mengubah makna.
