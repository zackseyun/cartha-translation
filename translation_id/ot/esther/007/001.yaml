  text: So the king and Haman came to drink with Queen Esther[a].
translation:
  language: id
  text: Lalu raja dan Haman datang untuk minum bersama Ratu Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “bersama Ester sang ratu.”
