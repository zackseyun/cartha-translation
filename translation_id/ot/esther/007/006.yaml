  yaml_path: translation/ot/esther/007/006.yaml
  text: And Esther said, “A hostile and enemy man—this evil Haman!” Then Haman was terrified before the king and the queen.
translation:
  language: id
  text: Ester berkata, “Seorang lawan dan musuh—Haman yang jahat ini!” Haman pun gemetar ketakutan di hadapan raja dan ratu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ צַר וְאוֹיֵב
  choice: Orang yang memusuhi dan menjadi lawan
  rationale: Mempertahankan unsur אִישׁ (‘orang/laki-laki’) serta dua sebutan paralel צַר dan אוֹיֵב tanpa meleburkannya menjadi satu istilah; bentuk verbal-relasional ini lebih alami dalam bahasa Indonesia modern.
- source_word: הָמָן הָרָע הַזֶּה
  choice: Haman yang jahat ini
  rationale: Menyampaikan penunjukan langsung dan keras terhadap Haman, termasuk demonstratif הַזֶּה (‘ini’) dan sifat הָרָע (‘yang jahat’).
- source_word: נִבְעַת
  choice: diliputi ketakutan
  rationale: Bentuk nifal menyatakan bahwa Haman menjadi sangat takut atau dicekam kengerian; ‘diliputi ketakutan’ menjaga intensitas tanpa ungkapan yang kaku.
- source_word: מִלִּפְנֵי הַמֶּלֶךְ וְהַמַּלְכָּה
  choice: di hadapan raja dan ratu
  rationale: Ungkapan idiomatis ini mempertahankan latar kehadiran dan tatapan raja serta ratu; sumber ketakutan tersirat dari konteks dan tidak diperluas secara tafsiriah.
