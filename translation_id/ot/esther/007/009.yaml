source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חַ֠רְבוֹנָה אֶחָ֨ד מִן הַ/סָּרִיסִ֜ים לִ/פְנֵ֣י הַ/מֶּ֗לֶךְ גַּ֣ם הִנֵּה הָ/עֵ֣ץ אֲשֶׁר עָשָׂ֪ה הָמָ֟ן לְֽ/מָרְדֳּכַ֞י אֲשֶׁ֧ר דִּבֶּר ט֣וֹב עַל הַ/מֶּ֗לֶךְ עֹמֵד֙ בְּ/בֵ֣ית הָמָ֔ן גָּבֹ֖הַּ חֲמִשִּׁ֣ים אַמָּ֑ה וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ תְּלֻ֥/הוּ עָלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/007/009.yaml
  text: Then Harbonah[a], one of the eunuchs before the king, said, “Also, behold, the gallows that Haman made for Mordecai, who spoke good for the king, is standing at Haman’s house, fifty cubits high.” And the king said[c][b], “Hang him on it.”
translation:
  language: id
  text: Kemudian Harbona, salah seorang sida-sida yang berada di hadapan raja, berkata, “Lihat, ada juga tiang gantungan[a] yang dibuat Haman untuk Mordekhai, yang telah berbicara demi kebaikan raja.[b] Tiang itu berdiri di rumah Haman, setinggi lima puluh hasta.” Raja berkata, “Gantunglah[c] dia pada tiang itu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pohon” atau “kayu” (הָעֵץ); di sini yang dimaksud ialah suatu struktur kayu untuk pelaksanaan hukuman mati.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang telah berbicara baik tentang raja” atau “yang telah berbicara untuk kepentingan raja.”
    reason: lexical_alternative
  - marker: c
    text: Atau mungkin “Pancangkanlah dia pada tiang itu.” Istilah Ibrani dapat menunjuk secara lebih luas kepada menggantungkan atau memajang seseorang pada struktur kayu, bukan secara khusus kepada tiang gantungan model kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַרְבוֹנָה
  choice: Harbona
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: הַסָּרִיסִים
  choice: sida-sida
  rationale: Dalam lingkungan istana Persia, סָרִיס paling langsung menunjuk kepada sida-sida istana, meskipun kata itu juga dapat dipakai lebih luas untuk pejabat istana.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: yang berada di hadapan raja
  rationale: Mempertahankan ungkapan kehadiran dan pelayanan dalam lingkungan resmi istana tanpa mempersempitnya menjadi jabatan tertentu.
- source_word: גַּם הִנֵּה
  choice: Lihat, ada juga
  rationale: Menyampaikan sekaligus unsur penunjukan yang kuat dan unsur tambahan dalam ungkapan Ibrani.
- source_word: הָעֵץ
  choice: tiang gantungan
  rationale: Secara harfiah berarti pohon atau kayu, tetapi dalam konteks ini menunjuk kepada sarana hukuman mati. 'Tiang gantungan' mudah dipahami, sedangkan catatan kaki mempertahankan keluasan istilah sumber.
- source_word: עָשָׂה ... לְמָרְדֳּכַי
  choice: dibuat Haman untuk Mordekhai
  rationale: Mengikuti arti umum verba 'membuat' serta mempertahankan tujuan jahat yang ditandai oleh preposisi לְ.
- source_word: דִּבֶּר טוֹב עַל הַמֶּלֶךְ
  choice: telah berbicara demi kebaikan raja
  rationale: Mengungkapkan bahwa perkataan Mordekhai menguntungkan raja tanpa secara eksplisit menambahkan rincian tentang pembongkaran persekongkolan.
- source_word: עֹמֵד בְּבֵית הָמָן
  choice: berdiri di rumah Haman
  rationale: Partisipel menyatakan keadaan yang sedang berlaku; 'berdiri' mempertahankan gambaran konkret dari teks sumber.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: setinggi lima puluh hasta
  rationale: Mempertahankan satuan ukuran kuno dalam teks utama demi kesetiaan formal.
- source_word: תְּלֻהוּ עָלָיו
  choice: Gantunglah dia pada tiang itu
  rationale: Terjemahan alami dari perintah tersebut, sambil menyadari bahwa istilah Ibrani dapat mencakup pemajangan atau penancapan pada struktur kayu.
theological_decisions:
- issue: Cara pelaksanaan hukuman mati
  choice: Teks utama memakai 'gantunglah' dan 'tiang gantungan', dengan catatan yang menjelaskan keluasan istilah Ibrani.
  alternative: Pancangkanlah dia pada tiang itu.
  rationale: Bukti leksikal tidak memastikan mekanisme hukuman secara sempit. Pilihan utama mengikuti ungkapan yang jelas bagi pembaca Indonesia, sedangkan catatan menjaga ambiguitas historisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan nuansa resmi istana, penekanan deiktis, satuan kuno, atau ketidakpastian mengenai bentuk sarana dan cara pelaksanaan hukuman mati.
