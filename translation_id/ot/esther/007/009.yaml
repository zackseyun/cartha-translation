  terminology: Transliterasi "Harbona" dan "Mordekhai" konsisten dengan pemakaian Indonesia yang lazim. "Sida-sida," "hasta," dan "tiang gantungan" sesuai konteks; catatan kaki menangani alternatif leksikal penting tanpa membebani teks utama.
