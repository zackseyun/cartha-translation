  source_fidelity: Teks dengan tepat mencakup Harbona sebagai salah seorang sida-sida di hadapan raja, unsur tambahan dan penunjukan dalam גַּם הִנֵּה, sarana yang Haman buat untuk Mordekhai, tindakan Mordekhai yang menguntungkan raja, lokasi dan tinggi struktur itu, serta perintah raja. "Tiang gantungan" adalah penafsiran kontekstual yang wajar untuk הָעֵץ, sementara catatan a dan c secara memadai menjaga cakupan harfiah dan historis istilah Ibrani tersebut.
