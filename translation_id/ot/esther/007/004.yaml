translation_notes:
  register: Bahasa dibuat modern, lugas, dan tetap bermartabat untuk tuturan resmi di hadapan raja. Sapaan orang pertama tunggal memakai ‘aku’ sesuai narasi langsung, sedangkan ‘bangsaku’ menegaskan identitas kolektif Ester. Pengulangan tiga kata kerja dipertahankan demi tekanan retoris.
