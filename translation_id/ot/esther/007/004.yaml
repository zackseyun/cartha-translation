base_translation:
  language: en
  yaml_path: translation/ot/esther/007/004.yaml
  text: For we have been sold[a], I and my people, to be destroyed, to be killed, and to perish. But if we had been sold as male servants and female servants, I would have kept silent, for the adversary is not worth the damage to the king.
translation:
  language: id
  text: Sebab kami telah dijual, aku dan bangsaku, untuk dimusnahkan, dibunuh, dan dibinasakan. Sekiranya kami dijual sebagai budak laki-laki dan budak perempuan, aku tentu akan berdiam diri, sebab lawan itu tidak sebanding dengan kerugian raja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kerusakan terhadap raja.” Ungkapan Ibrani ini dapat menunjuk pada kerugian finansial, kerusakan, atau dampak merugikan bagi raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִמְכַּרְנוּ
  choice: kami telah dijual
  rationale: Bentuk pasif dari מכר secara alami berarti ‘dijual’. Pilihan ini mempertahankan metafora jual-beli dan menyiapkan kontras dengan penjualan sebagai budak dalam klausa berikutnya.
- source_word: עַמִּי
  choice: bangsaku
  rationale: עַם di sini menunjuk pada kelompok etnis atau kebangsaan Ester. ‘Bangsaku’ terdengar alami dalam konteks ancaman terhadap seluruh kelompok dan mempertahankan identifikasi Ester dengan mereka.
- source_word: לְהַשְׁמִיד לַהֲרֹג וּלְאַבֵּד
  choice: untuk dimusnahkan, dibunuh, dan dibinasakan
  rationale: Tiga infinitif yang hampir bersinonim dipertahankan untuk menjaga daya retoris teks. Bentuk pasif sesuai dengan sudut pandang mereka yang menjadi sasaran, sedangkan ‘dibinasakan’ menyampaikan akibat kehilangan hidup secara menyeluruh.
- source_word: וְאִלּוּ
  choice: Sekiranya
  rationale: Kata ini memperkenalkan keadaan hipotetis yang berlawanan dengan kenyataan. ‘Sekiranya’ menyampaikan nuansa kontrafaktual secara wajar dalam bahasa Indonesia.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: sebagai budak laki-laki dan budak perempuan
  rationale: Pasangan kata Ibrani membedakan bentuk maskulin dan feminin serta jelas menunjuk pada perbudakan, bukan sekadar pelayanan sukarela. Terjemahan ini mempertahankan pembedaan tersebut.
- source_word: הֶחֱרַשְׁתִּי
  choice: aku akan berdiam diri
  rationale: Bentuk perfek berfungsi sebagai akibat dalam pernyataan hipotetis. Ungkapan ini berarti tidak menyampaikan keberatan atau permohonan kepada raja.
- source_word: הַצָּר
  choice: lawan itu
  rationale: Nomina ini menunjuk pada pihak yang memusuhi atau mendatangkan kesesakan. ‘Lawan itu’ sesuai dengan suasana istana, jelas menunjuk kepada pihak yang sedang Ester tuduhkan, dan tidak mempersempit makna melebihi teks.
- source_word: שֹׁוֶה
  choice: tidak sebanding
  rationale: Partisip dari שוה menyatakan kesetaraan atau nilai yang sepadan. ‘Tidak sebanding’ mempertahankan gagasan perbandingan tanpa memaksakan apakah perbandingan itu terutama bersifat finansial atau politis.
- source_word: בְּנֵזֶק הַמֶּלֶךְ
  choice: dengan kerugian yang ditanggung raja
  rationale: נזק dapat berarti kerugian, kerusakan, atau cedera. ‘Kerugian yang ditanggung raja’ alami dalam bahasa Indonesia dan tetap cukup luas untuk mencakup dampak finansial maupun dampak lain terhadap raja.
