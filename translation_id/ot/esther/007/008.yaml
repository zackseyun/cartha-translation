base_translation:
  language: en
  yaml_path: translation/ot/esther/007/008.yaml
  text: The king returned from the palace garden to the house of the wine feast, and Haman was falling on the couch where Esther was. Then the king said, “Will he even assault the queen while I am in the house?” As the word went out from the king’s mouth, they covered Haman’s face.
translation:
  language: id
  text: Raja kembali dari taman istana ke ruang perjamuan anggur. Saat itu Haman sedang menjatuhkan diri[a] ke atas dipan tempat Ester berada. Raja berkata, “Apakah dia bahkan hendak menyerang[b] ratu sementara aku ada di dalam rumah ini?” Begitu perkataan itu keluar dari mulut raja, wajah Haman pun ditutupi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sedang jatuh; kata Ibraninya juga dapat menggambarkan tindakan merebahkan atau menjatuhkan diri untuk memohon.'
    reason: Menjaga ambiguitas tindakan partisip נֹפֵל dan konteks permohonan Haman.
  - marker: b
    text: Kata Ibrani yang diterjemahkan ‘menyerang’ secara harfiah dapat berarti ‘menaklukkan’ atau ‘menguasai’; dalam konteks ini ucapan raja dapat menyiratkan serangan seksual.
    reason: Menjelaskan cakupan semantik לִכְבּוֹשׁ tanpa menjadikan implikasi kontekstual sebagai arti leksikal tunggal.
lexical_decisions:
- source_word: בֵּית מִשְׁתֵּה הַיַּיִן
  choice: ruang perjamuan anggur
  rationale: Secara harfiah berarti ‘rumah/ruang perjamuan anggur’; dalam konteks istana, ‘ruang’ lebih alami dalam bahasa Indonesia tanpa menghilangkan unsur anggur.
- source_word: נֹפֵל
  choice: sedang menjatuhkan diri
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung. Ungkapan ini dapat menunjuk pada Haman yang merebahkan atau menjatuhkan diri dalam permohonan, tanpa memastikan sikap tubuhnya secara berlebihan.
- source_word: הַמִּטָּה
  choice: dipan
  rationale: Dalam konteks perjamuan Persia, kata ini menunjuk tempat berbaring atau dipan perjamuan, bukan terutama ranjang untuk tidur.
- source_word: לִכְבּוֹשׁ
  choice: menyerang
  rationale: Kata dasarnya berarti menaklukkan atau menguasai dan dalam ucapan raja mengandung tuduhan bernuansa seksual. ‘Menyerang’ mempertahankan ancaman itu tanpa menetapkan secara sempit tindakan tertentu.
- source_word: עִמִּי בַּבָּיִת
  choice: di rumah ini, di hadapanku
  rationale: Secara bentuk berarti ‘bersamaku di rumah’; dalam konteks seruan raja, maksud kehadiran raja disampaikan secara alami sebagai ‘di hadapanku’, sementara lokasi tetap dipertahankan.
- source_word: וּפְנֵי הָמָן חָפוּ
  choice: wajah Haman pun ditutupi
  rationale: Bentuk Ibrani menggambarkan tertutupnya wajah Haman tanpa menyebut pelaku secara eksplisit; bentuk pasif Indonesia mempertahankan hal itu.
theological_decisions:
- issue: Sifat tindakan Haman terhadap Ester menurut tuduhan raja
  choice: menyerang
  alternative: memperkosa / mencabuli / menaklukkan
  rationale: Teks menyajikan tuduhan marah raja dengan kata yang luas dan bernuansa penguasaan paksa. Terjemahan tidak mempersempitnya menjadi tindakan seksual tertentu yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur naratif dibuat alami bagi pembaca umum, dengan ambiguitas penting pada gerak Haman dan kata tuduhan raja dipertahankan melalui catatan kaki.
