base_translation:
  language: en
  yaml_path: translation/ot/esther/007/007.yaml
  text: Then the king rose in his wrath from the wine banquet and went into the palace garden[a], but Haman remained to beg Queen Esther for his life[c][b], for he saw that the evil against him had been determined by the king.
translation:
  language: id
  text: Lalu raja bangkit dengan murka dari perjamuan anggur dan pergi ke taman istana.[a] Namun, Haman tetap tinggal untuk memohon kepada Ratu Ester agar nyawanya diselamatkan,[b] sebab ia melihat bahwa raja telah menetapkan malapetaka atas dirinya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini juga dapat diterjemahkan “taman paviliun” atau “taman kompleks istana.”
    reason: cultural_note
  - marker: b
    text: 'Secara lebih harfiah: “Haman berdiri untuk memohon mengenai nyawanya dari Ester sang ratu.” Dalam konteks ini, ia tetap berada di tempat itu untuk memohon agar hidupnya diselamatkan.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “malapetaka terhadap dirinya telah menjadi pasti dari pihak raja.” Kata yang diterjemahkan “malapetaka” juga dapat berarti “kejahatan,” “kemalangan,” atau “bencana.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲמָתוֹ
  choice: dengan murka
  rationale: חֵמָה menyatakan kemarahan yang menyala dan kuat. “Dengan murka” mempertahankan intensitasnya dalam ragam naratif yang wajar.
- source_word: מִמִּשְׁתֵּה הַיַּיִן
  choice: dari perjamuan anggur
  rationale: מִשְׁתֶּה adalah perjamuan, kerap dengan penekanan pada minum-minum; unsur הַיַּיִן menyebut anggur secara eksplisit.
- source_word: גִּנַּת הַבִּיתָן
  choice: taman istana
  rationale: גִּנָּה berarti “taman,” sedangkan בִּיתָן dapat menunjuk istana, paviliun, atau kompleks istana. “Taman istana” paling jelas dan alami dalam konteks istana Persia, sementara alternatifnya dicatat.
- source_word: עָמַד
  choice: tetap tinggal
  rationale: Secara harfiah berarti “berdiri,” tetapi dalam kontras dengan raja yang meninggalkan ruangan, bentuk ini secara wajar menyatakan bahwa Haman tetap berada di sana.
- source_word: לְבַקֵּשׁ עַל נַפְשׁוֹ
  choice: memohon ... agar nyawanya diselamatkan
  rationale: Ungkapan ini secara harfiah berbicara tentang mencari atau memohon mengenai nyawanya; terjemahan ini menyampaikan maksud idiomatis dan keadaan Haman yang terdesak.
- source_word: מֵאֶסְתֵּר הַמַּלְכָּה
  choice: kepada Ratu Ester
  rationale: Urutan gelar sebelum nama merupakan bentuk yang alami dalam bahasa Indonesia dan tetap mempertahankan isi sumber.
- source_word: כִּי רָאָה
  choice: sebab ia melihat
  rationale: כִּי memperkenalkan alasan Haman memohon, dan רָאָה di sini menyatakan bahwa ia menyadari atau melihat keadaan yang sudah jelas baginya.
- source_word: כִּי כָלְתָה אֵלָיו הָרָעָה
  choice: bahwa ... telah menetapkan malapetaka atas dirinya
  rationale: כָלְתָה dalam konstruksi ini menunjukkan bahwa perkara tersebut telah menjadi pasti atau final. הָרָעָה dapat berarti kejahatan, bencana, kemalangan, atau malapetaka; “malapetaka” sesuai dengan ancaman yang kini pasti menimpa Haman tanpa mengubahnya menjadi istilah hukum yang tidak eksplisit.
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: raja telah menetapkan
  rationale: מֵאֵת menandai asal atau pihak sumber. Pengubahan menjadi konstruksi aktif menghasilkan bahasa Indonesia yang alami dan menyatakan bahwa ketetapan itu berasal dari raja.
