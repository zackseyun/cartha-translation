base_translation:
  language: en
  yaml_path: translation/ot/esther/007/002.yaml
  text: And the king said to Esther on the second day also[a], at the banquet of wine, “What is your petition, Queen Esther? It will be granted to you. And what is your request? Even to half the kingdom[b], it shall be done.”
translation:
  language: id
  text: Pada hari kedua, saat jamuan anggur, raja kembali berkata kepada Ester, “Apa permohonanmu, Ratu Ester? Permohonan itu akan dikabulkan kepadamu. Apa permintaanmu? Bahkan sampai setengah kerajaan pun[a], permintaan itu akan dipenuhi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “sampai setengah kerajaan” merupakan tawaran seorang raja yang menyatakan kemurahan hati luar biasa; ungkapan ini tidak harus dipahami sebagai janji harfiah untuk membagi kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם בַּיּוֹם הַשֵּׁנִי
  choice: Pada hari kedua ... kembali
  rationale: גַּם menghubungkan perkataan raja dengan peristiwa serupa sebelumnya. Dalam bahasa Indonesia, “kembali berkata” menyampaikan kelanjutan atau pengulangan itu dengan lebih alami daripada “pada hari kedua juga”.
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: saat jamuan anggur
  rationale: Mempertahankan penyebutan anggur dan latar jamuan, sekaligus memakai susunan yang wajar dalam bahasa Indonesia modern.
- source_word: מַה שְּׁאֵלָתֵךְ
  choice: Apa permohonanmu
  rationale: “Permohonan” sesuai dengan suasana resmi istana dan makna permintaan yang diajukan kepada raja.
- source_word: וְתִנָּתֵן לָךְ
  choice: Permohonan itu akan dikabulkan kepadamu
  rationale: Secara harfiah berarti “akan diberikan kepadamu”; “dikabulkan” menyampaikan makna kontekstual sebuah permohonan yang diterima oleh raja.
- source_word: בַּקָּשָׁתֵךְ
  choice: permintaanmu
  rationale: Menggunakan istilah yang berdekatan tetapi tidak identik dengan “permohonan” untuk mencerminkan variasi kata dalam bahasa Ibrani.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Bahkan sampai setengah kerajaan pun
  rationale: Mempertahankan batas yang dinyatakan dalam bahasa Ibrani dan daya tekan tawaran raja tanpa menambahkan kata “milikku”, yang tidak dinyatakan secara eksplisit.
- source_word: וְתֵעָשׂ
  choice: permintaan itu akan dipenuhi
  rationale: Secara harfiah, “akan dilakukan”; dalam konteks permintaan kerajaan, “dipenuhi” terdengar alami dan mempertahankan arti bahwa hal yang diminta akan dilaksanakan.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Urutan gelar sebelum nama merupakan bentuk yang alami dan terhormat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat, dengan nada resmi sesuai percakapan di istana. Pengulangan kata benda pada “permohonan itu” dan “permintaan itu” dipakai untuk memperjelas rujukan tanpa menghapus variasi leksikal teks Ibrani.
