base_translation:
  language: en
  yaml_path: translation/ot/esther/007/010.yaml
  text: So they hanged Haman on the gallows that he had prepared for Mordecai[a], and the king’s wrath subsided.
translation:
  language: id
  text: Maka mereka menggantung Haman pada tiang kayu yang telah disiapkannya bagi Mordekhai.[a] Lalu murka raja pun reda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyulakan Haman pada pancang yang telah disiapkannya bagi Mordekhai.” Kata Ibrani yang diterjemahkan “tiang kayu” dapat berarti pohon, kayu, atau pancang, sedangkan kata kerjanya secara umum berarti menggantung atau menaruh tubuh dalam keadaan tergantung. Cara pelaksanaan hukuman yang tepat tidak dapat dipastikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְלוּ
  choice: mereka menggantung
  rationale: Kata kerja תלה berarti menggantung atau menaruh dalam keadaan tergantung. Pilihan ini mempertahankan makna dasarnya tanpa memastikan secara berlebihan cara pelaksanaan hukuman.
- source_word: הָמָן
  choice: Haman
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַל הָעֵץ
  choice: pada tiang kayu
  rationale: עֵץ dapat berarti pohon, kayu, atau benda dari kayu. Dalam konteks ini, ungkapan tersebut menunjuk pada alat hukuman yang disiapkan Haman; 'tiang kayu' cukup alami dalam bahasa Indonesia dan tidak membatasi maknanya menjadi tiang gantungan modern.
- source_word: אֲשֶׁר הֵכִין לְמָרְדֳּכָי
  choice: yang telah disiapkannya bagi Mordekhai
  rationale: הכין berarti menyiapkan atau membuat siap. Bentuk ini mempertahankan ironi bahwa Haman menerima hukuman yang telah ia rancang bagi Mordekhai.
- source_word: וַחֲמַת הַמֶּלֶךְ
  choice: Lalu murka raja
  rationale: חֵמָה menyatakan kemarahan yang hebat. 'Murka' merupakan padanan Indonesia yang ringkas, kuat, dan tetap bermartabat.
- source_word: שָׁכָכָה
  choice: pun reda
  rationale: שׁכך berarti mereda, surut, atau menjadi tenang. 'Reda' merupakan ungkapan Indonesia yang alami untuk kemarahan yang berkurang.
theological_decisions:
- issue: Cara Haman dihukum mati
  choice: Teks utama memakai 'menggantung ... pada tiang kayu' tanpa merinci mekanismenya.
  alternative: Haman disulakan pada pancang atau digantung pada tiang gantungan.
  rationale: Gabungan תלה dan עֵץ tidak menentukan secara pasti apakah hukumannya berupa penggantungan, penyulaan, atau tubuh yang dipajang pada suatu alat kayu. Ambiguitas historis dan leksikal dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Tiang kayu' dipilih daripada 'tiang gantungan' agar pembaca tidak langsung membayangkan mekanisme hukuman gantung modern. Partikel 'pun' mempertahankan kelancaran narasi dan hubungan akibat.
