base_translation:
  language: en
  yaml_path: translation/ot/esther/007/005.yaml
  text: Then King Ahasuerus said to Esther the queen[a], “Who is he, and where is he[b], who has filled his heart to do this?”
translation:
  language: id
  text: Lalu Raja Ahasyweros berkata kepada Ratu Ester, “Siapakah orang itu, dan di manakah dia[b], yang berani melakukan hal ini[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang telah memenuhi hatinya untuk melakukan hal ini”; ungkapan Ibrani ini berarti “yang telah berani” atau “yang telah lancang” melakukan hal semacam itu.
    reason: lexical_alternative
  - marker: b
    text: Atau, meskipun kurang mungkin, “dan yang manakah dia?” jika ungkapan itu dipahami sebagai permintaan untuk menunjukkan orangnya, bukan menanyakan keberadaannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Lalu Raja Ahasyweros berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menghasilkan alur naratif Indonesia yang wajar. Nama raja ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: וַיֹּאמֶר לְאֶסְתֵּר הַמַּלְכָּה
  choice: berkata kepada Ratu Ester
  rationale: Susunan gelar sebelum nama lebih alami dalam bahasa Indonesia daripada mempertahankan aposisi harfiah “kepada Ester, sang ratu”.
- source_word: מִי הוּא זֶה
  choice: Siapakah orang itu
  rationale: Pertanyaan ini menuntut identitas pelaku secara tegas. “Orang itu” menyampaikan penunjukan זֶה secara alami tanpa menentukan identitas lebih jauh.
- source_word: וְאֵי זֶה הוּא
  choice: dan di manakah dia
  rationale: אֵי paling wajar dipahami sebagai pertanyaan tentang tempat. Kemungkinan bahwa ungkapan ini meminta penentuan orang yang dimaksud dicatat dalam catatan kaki.
- source_word: אֲשֶׁר מְלָאוֹ לִבּוֹ
  choice: yang berani
  rationale: Ungkapan Ibrani yang melibatkan “hati” merupakan idiom tentang memberanikan diri atau lancang melakukan sesuatu. Padanan “berani” menyampaikan maknanya secara alami; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: לַעֲשׂוֹת כֵּן
  choice: melakukan hal ini
  rationale: כֵּן menunjuk kembali pada tindakan yang baru saja diungkapkan Ester; “hal ini” jelas dan wajar dalam konteks.
