base_translation:
  language: en
  yaml_path: translation/ot/esther/007/003.yaml
  text: Then Queen Esther answered and said[a], “If I have found favor in your eyes, O king, and if it pleases the king, let my life be given me at my petition, and my people at my request.”
translation:
  language: id
  text: Lalu Ratu Ester menjawab, “Jika aku mendapat perkenanan di mata Baginda, ya Raja, dan jika raja berkenan, biarlah nyawaku diberikan kepadaku atas permohonanku, dan bangsaku atas permintaanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַן ... וַתֹּאמַר
  choice: menjawab
  rationale: Dalam rangkaian naratif ini, kedua verba memperkenalkan tanggapan Ester. Bahasa Indonesia alami cukup memakai satu verba ujaran, ‘menjawab’, tanpa bentuk ganda yang kaku seperti ‘menjawab dan berkata’.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Susunan gelar sebelum nama merupakan bentuk alami dalam bahasa Indonesia dan tetap mempertahankan kedudukan kerajaan Ester.
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: Jika aku mendapat perkenanan di mata Tuanku Raja
  rationale: ‘Mendapat perkenanan’ menyampaikan idiom חֵן secara wajar, sedangkan ‘di mata’ mempertahankan citra Ibrani. Sapaan hormat ‘Tuanku Raja’ memperjelas fungsi vokatif הַמֶּלֶךְ.
- source_word: וְאִם עַל הַמֶּלֶךְ טוֹב
  choice: dan jika Tuanku Raja berkenan
  rationale: Ungkapan Ibrani ini menyatakan bahwa sesuatu dipandang baik atau menyenangkan oleh raja; ‘berkenan’ merupakan padanan istana yang alami dan ringkas.
- source_word: תִּנָּתֶן לִי נַפְשִׁי
  choice: biarlah nyawaku dikaruniakan kepadaku
  rationale: Bentuk pasif Niphal dipertahankan melalui ‘dikaruniakan’, sementara נֶפֶשׁ dalam ancaman kematian berarti ‘nyawa’, bukan jiwa dalam arti nonjasmani.
- source_word: בִּשְׁאֵלָתִי
  choice: sebagai permohonanku
  rationale: Preposisi ב menandai hal yang diajukan dalam petisi. ‘Sebagai permohonanku’ menyatakan bahwa keselamatan nyawa Ester adalah isi permohonannya dan terdengar alami dalam tuturan resmi.
- source_word: וְעַמִּי בְּבַקָּשָׁתִי
  choice: dan bangsaku sebagai permintaanku
  rationale: ‘Bangsaku’ mempertahankan ikatan etnis-komunal עַם, sedangkan ‘permintaanku’ menjaga variasi leksikal antara שְׁאֵלָה dan בַּקָּשָׁה.
theological_decisions: []
translation_notes:
  register: Bahasa istana yang modern, khidmat, dan mudah dipahami. Kata ganti ‘aku’ mengikuti ujaran langsung Ester, sedangkan ‘Tuanku Raja’ menyatakan penghormatan kepada raja tanpa memakai bentuk Indonesia yang terlalu arkais. Paralelisme antara nyawa Ester dan bangsanya dipertahankan.
