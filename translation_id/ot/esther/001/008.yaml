base_translation:
  language: en
  yaml_path: translation/ot/esther/001/008.yaml
  text: 'And the drinking was according to the law: there was no compulsion[c][b][a], for so the king had instructed every official of his household to do according to the desire of each man.'
translation:
  language: id
  text: 'Kegiatan minum berlangsung menurut peraturan: tidak ada paksaan[a]. Sebab raja telah menetapkan bahwa setiap pejabat istananya harus bertindak menurut keinginan setiap orang[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada paksaan”; maksudnya, tidak seorang pun dipaksa untuk minum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut keinginan masing-masing orang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁתִיָּה
  choice: Minum anggur dilakukan
  rationale: Nomina ini menunjuk pada kegiatan minum dalam perjamuan. Penambahan 'anggur' dibuat eksplisit dari konteks dekat agar ungkapan alami dalam bahasa Indonesia, tanpa memperluasnya menjadi seluruh perjamuan.
- source_word: כַדָּת
  choice: menurut peraturan
  rationale: דָּת dapat berarti hukum, ketetapan, atau peraturan; dalam konteks tata cara perjamuan, 'peraturan' paling alami dan tetap mempertahankan nuansa formal.
- source_word: אֵין אֹנֵס
  choice: tidak seorang pun dipaksa
  rationale: Mengungkapkan secara alami bahwa tidak ada pemaksaan, khususnya dalam hal minum.
- source_word: כִּי כֵן יִסַּד הַמֶּלֶךְ
  choice: Sebab, raja telah menetapkan
  rationale: יִסַּד secara harfiah berkaitan dengan menetapkan atau meletakkan dasar; dalam konteks administratif, frasa ini menyatakan kebijakan yang ditetapkan raja.
- source_word: עַל כָּל רַב בֵּיתוֹ
  choice: kepada setiap pejabat istananya
  rationale: רַב menunjuk kepada orang yang berkedudukan atau bertanggung jawab dalam rumah tangga kerajaan; 'pejabat istana' jelas dan sesuai dengan latar kerajaan.
- source_word: לַעֲשׂוֹת כִּרְצוֹן אִישׁ וָאִישׁ
  choice: agar melayani setiap orang menurut keinginannya
  rationale: Secara harfiah, 'berbuat menurut keinginan setiap orang'. Dalam konteks pejabat yang mengatur minuman, 'melayani' menyampaikan tindakan yang tersirat, sedangkan bentuk distributif אִישׁ וָאִישׁ diterjemahkan 'setiap orang'.
