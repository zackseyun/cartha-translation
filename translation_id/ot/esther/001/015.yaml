  text: כְּ/דָת֙ מַֽה לַּ/עֲשׂ֔וֹת בַּ/מַּלְכָּ֖ה וַשְׁתִּ֑י עַ֣ל אֲשֶׁ֣ר לֹֽא עָשְׂתָ֗ה אֶֽת מַאֲמַר֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ בְּ/יַ֖ד הַ/סָּרִיסִֽים־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/015.yaml
  text: According to the law[c][b][a], what is to be done with Queen Vashti because she did not carry out the command of King Ahasuerus delivered by the eunuchs?
translation:
  language: id
  text: “Menurut hukum, apa yang harus dilakukan terhadap Ratu Wasti karena ia tidak melaksanakan perintah Raja Ahasweros yang disampaikan melalui para sida-sida[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini juga dapat berarti para pejabat istana, tetapi “sida-sida” merupakan terjemahan yang lebih langsung.
    reason: cultural_note
lexical_decisions:
- source_word: כְּדָת
  choice: Menurut hukum
  rationale: Dalam konteks istana Persia di kitab Ester, דָּת menunjuk pada hukum atau ketetapan resmi; frasa ini mempertahankan corak yuridis pertanyaan.
- source_word: מַה לַּעֲשׂוֹת
  choice: apa yang harus dilakukan
  rationale: Konstruksi infinitif ini menyatakan pertimbangan mengenai tindakan yang patut diambil dan tetap mempertahankan nada impersonal-formal.
- source_word: בַּמַּלְכָּה וַשְׁתִּי
  choice: terhadap Ratu Wasti
  rationale: Preposisi ב dengan עשה di sini mengacu pada tindakan atau perlakuan mengenai seseorang; 'terhadap' alami dalam bahasa Indonesia dan tidak menambahkan nuansa permusuhan secara berlebihan.
- source_word: עַל אֲשֶׁר לֹא עָשְׂתָה
  choice: karena ia tidak melaksanakan
  rationale: Frasa עַל אֲשֶׁר menyatakan alasan, sedangkan 'melaksanakan' dekat dengan makna dasar 'melakukan' ketika objeknya adalah perintah, tanpa memperkuatnya menjadi 'tidak menaati'.
- source_word: מַאֲמַר
  choice: perintah
  rationale: Dalam konteks kerajaan, מַאֲמַר adalah perkataan yang berdaya perintah; 'perintah' menyampaikan daya otoritatifnya dengan jelas.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasweros
  rationale: Gelar diterjemahkan dan nama pribadi ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בְּיַד הַסָּרִיסִים
  choice: yang disampaikan melalui para sida-sida
  rationale: Secara harfiah berarti 'melalui tangan para sida-sida' dan merupakan ungkapan untuk perantaraan atau keagenan. 'Disampaikan melalui' mengungkapkan fungsi mereka secara alami.
