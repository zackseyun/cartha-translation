  text: while he displayed the riches of the glory of his kingdom and the splendor of the honor of his greatness for many days—one hundred and eighty days.
translation:
  language: id
  text: Selama berhari-hari—seratus delapan puluh hari—ia memperlihatkan kekayaan kemuliaan kerajaannya serta kemegahan keindahan kebesarannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּהַרְאֹתוֹ
  choice: ia memamerkan
  rationale: Bentuk infinitif dengan sufiks subjek menyatakan tindakan raja dalam rangkaian perjamuan; “memamerkan” secara alami menyampaikan tindakan memperlihatkan kemegahan dengan sengaja.
- source_word: עֹשֶׁר כְּבוֹד מַלְכוּתוֹ
  choice: kekayaan dan kemuliaan kerajaannya
  rationale: Rangkaian nomina Ibrani bersifat padat dan dapat dipahami sebagai kekayaan mulia atau kekayaan beserta kemuliaan kerajaan. Penggunaan “dan” mempertahankan kedua unsur tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: יְקָר תִּפְאֶרֶת גְּדוּלָּתוֹ
  choice: kehormatan dan semarak kebesarannya
  rationale: יְקָר menunjuk kehormatan atau kemuliaan yang bernilai tinggi, sedangkan תִּפְאֶרֶת menunjuk keindahan, semarak, atau kemegahan. Pilihan ini membedakan kedua unsur dan menghindari pengulangan “kemuliaan”.
- source_word: יָמִים רַבִּים שְׁמוֹנִים וּמְאַת יוֹם
  choice: Selama berhari-hari—seratus delapan puluh hari—
  rationale: 'Urutan dan aposisi sumber dipertahankan: ungkapan umum “berhari-hari” kemudian dijelaskan secara tepat sebagai 180 hari.'
