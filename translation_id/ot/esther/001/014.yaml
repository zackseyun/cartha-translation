  text: וְ/הַ/קָּרֹ֣ב אֵלָ֗י/ו כַּרְשְׁנָ֤א שֵׁתָר֙ אַדְמָ֣תָא תַרְשִׁ֔ישׁ מֶ֥רֶס מַרְסְנָ֖א מְמוּכָ֑ן שִׁבְעַ֞ת שָׂרֵ֣י פָּרַ֣ס וּ/מָדַ֗י רֹאֵי֙ פְּנֵ֣י הַ/מֶּ֔לֶךְ הַ/יֹּשְׁבִ֥ים רִאשֹׁנָ֖ה בַּ/מַּלְכֽוּת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/014.yaml
  text: And those closest to him were Carshena[a], Shethar, Admatha, Tarshish, Meres, Marsena, and Memucan[b], the seven officials of Persia and Media who saw the king’s face and sat first in the kingdom.
translation:
  language: id
  text: Orang-orang yang paling dekat dengannya ialah Karsyena, Setar, Admata, Tarsis, Meres, Marsena, dan Memukan, yaitu tujuh pejabat Persia dan Media yang melihat wajah raja[a] dan duduk di tempat terdepan dalam kerajaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “melihat wajah raja” berarti memiliki hak untuk menghadap dan berada langsung di hadapan raja.
    reason: cultural_note
  - marker: b
    text: Atau “memegang kedudukan tertinggi dalam kerajaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקָּרֹב אֵלָיו
  choice: Orang-orang yang paling dekat dengannya ialah
  rationale: Walaupun הַקָּרֹב berbentuk tunggal, frasa ini memperkenalkan tujuh orang dan berfungsi secara kolektif. Bentuk jamak menghasilkan bahasa Indonesia yang alami tanpa mengubah acuannya.
- source_word: כַּרְשְׁנָא שֵׁתָר אַדְמָתָא תַרְשִׁישׁ מֶרֶס מַרְסְנָא מְמוּכָן
  choice: Karsena, Setar, Admata, Tarsis, Meres, Marsena, dan Memukan
  rationale: Nama-nama pribadi ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: שִׁבְעַת שָׂרֵי
  choice: ketujuh pejabat
  rationale: שָׂרֵי menunjuk kepada para pemegang jabatan tinggi. 'Pejabat' menyampaikan fungsi pemerintahan dengan jelas tanpa mengesankan bahwa mereka pasti pangeran berdasarkan keturunan.
- source_word: פָּרַס וּמָדַי
  choice: Persia dan Media
  rationale: Frasa ini menyebut dua unsur wilayah politik kekaisaran dan diterjemahkan dengan nama geografis yang lazim dalam bahasa Indonesia.
- source_word: רֹאֵי פְּנֵי הַמֶּלֶךְ
  choice: yang melihat wajah raja
  rationale: Terjemahan ini mempertahankan gambaran konkret ungkapan istana dalam bahasa sumber; catatan kaki menjelaskan bahwa ungkapan itu menunjuk pada hak menghadap raja secara langsung.
- source_word: הַיֹּשְׁבִים רִאשֹׁנָה בַּמַּלְכוּת
  choice: dan duduk di tempat terdepan dalam kerajaan
  rationale: Pilihan ini mempertahankan metafora duduk dan gagasan keutamaan atau peringkat tertinggi, sambil tetap dapat dipahami dalam bahasa Indonesia.
