  text: וְ/הַשְׁקוֹת֙ בִּ/כְלֵ֣י זָהָ֔ב וְ/כֵלִ֖ים מִ/כֵּלִ֣ים שׁוֹנִ֑ים וְ/יֵ֥ין מַלְכ֛וּת רָ֖ב כְּ/יַ֥ד הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/007.yaml
  text: Drinks were served in vessels of gold, with vessels differing from vessel to vessel, and royal wine in abundance, according to the king’s bounty.
translation:
  language: id
  text: Minuman disajikan dalam bejana-bejana emas, dengan bejana yang berbeda satu dari yang lain, dan anggur kerajaan tersedia dengan berlimpah, sesuai dengan kemurahan hati raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשְׁקוֹת
  choice: Minuman disajikan
  rationale: Bentuk infinitif ini melanjutkan gambaran perjamuan; ungkapan pasif alami dalam bahasa Indonesia menyampaikan tindakan menyuguhkan minuman tanpa menambahkan pelaku yang tidak disebutkan.
- source_word: בִּכְלֵי זָהָב
  choice: dalam bejana-bejana emas
  rationale: Menerjemahkan כְּלִי secara cukup formal sebagai 'bejana' dan mempertahankan bentuk jamak.
- source_word: וְכֵלִים מִכֵּלִים שׁוֹנִים
  choice: dengan bejana yang berbeda satu dari yang lain
  rationale: Mempertahankan pengulangan dan gagasan bahwa masing-masing bejana tidak seragam, tetapi menyusunnya secara wajar dalam bahasa Indonesia.
- source_word: וְיֵין מַלְכוּת
  choice: dan anggur kerajaan
  rationale: Konstruksi ini menunjuk pada anggur milik atau khas kerajaan; 'anggur kerajaan' mempertahankan ungkapan ringkas sumber.
- source_word: רָב
  choice: tersedia dengan berlimpah
  rationale: Menyatakan jumlah besar dalam konteks penyediaan anggur tanpa mengubahnya menjadi penilaian mutu.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: sesuai dengan kemurahan hati raja
  rationale: Secara harfiah 'menurut tangan raja'; dalam konteks ini idiom tersebut menyatakan kelimpahan atau kemurahan yang sepadan dengan kemampuan dan kebesaran raja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Istilah 'bejana' dipilih untuk menjaga nuansa resmi perjamuan istana, sedangkan 'kemurahan hati raja' menerjemahkan idiom Ibrani secara alami tanpa memasukkan penafsiran teologis.
