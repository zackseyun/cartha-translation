  rationale: Revisi menghilangkan penambahan “hal yang sama,” menggantinya dengan “demikian” yang mempertahankan ketidakjelasan isi ujaran dalam teks, dan menerjemahkan klausa eliptis dengan bahasa baku yang dekat pada gagasan “cukup/banyak.” Catatan kaki diperhalus tanpa mengubah fungsi atau penandanya.
