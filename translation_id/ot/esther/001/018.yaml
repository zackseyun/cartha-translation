  text: וְֽ/הַ/יּ֨וֹם הַ/זֶּ֜ה תֹּאמַ֣רְנָה שָׂר֣וֹת פָּֽרַס וּ/מָדַ֗י אֲשֶׁ֤ר שָֽׁמְעוּ֙ אֶת דְּבַ֣ר הַ/מַּלְכָּ֔ה לְ/כֹ֖ל שָׂרֵ֣י הַ/מֶּ֑לֶךְ וּ/כְ/דַ֖י בִּזָּי֥וֹן וָ/קָֽצֶף׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/018.yaml
  text: And today the noblewomen of Persia and Media who have heard the queen’s word will say the same to all the king’s officials[c][b][a], and there will be enough contempt and wrath.
translation:
  language: id
  text: Pada hari ini juga, para perempuan bangsawan Persia dan Media yang telah mendengar perkataan sang ratu akan berkata demikian kepada semua pejabat raja[a][b], dan akan cukup banyak penghinaan serta kemarahan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para perempuan pembesar Persia dan Media”. Istilah Ibrani ini menunjuk kepada perempuan berpangkat tinggi dan tidak harus berarti putri raja.
    reason: lexical_alternative
  - marker: b
    text: “Perkataan sang ratu” juga dapat berarti “apa yang dikatakan sang ratu” atau “perkara mengenai sang ratu”.
    reason: lexical_alternative
  - marker: c
    text: Klausa terakhir berbentuk eliptis dalam bahasa Ibrani, secara harfiah kira-kira, “dan cukup penghinaan serta kemarahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיּוֹם הַזֶּה
  choice: Hari ini juga
  rationale: Ungkapan waktu ini menekankan bahwa dampaknya akan segera tampak; 'Hari ini juga' alami dalam bahasa Indonesia dan mempertahankan tekanan pada hari yang sama.
- source_word: תֹּאמַרְנָה
  choice: akan mengatakan hal yang sama
  rationale: Bentuk imperfek feminin jamak berarti 'akan mengatakan'. Objek tersirat dipasok sebagai 'hal yang sama' berdasarkan konteks, yakni perkataan atau sikap seperti sang ratu.
- source_word: שָׂרוֹת
  choice: para perempuan bangsawan
  rationale: Istilah ini menunjuk perempuan berpangkat tinggi. Pilihan ini tidak menyiratkan bahwa mereka pasti putri raja, sekaligus lebih tepat daripada sapaan umum 'nyonya-nyonya'.
- source_word: פָּרַס וּמָדַי
  choice: Persia dan Media
  rationale: Menggunakan nama geografis baku dalam bahasa Indonesia.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: yang telah mendengar
  rationale: Bentuk perfektif menggambarkan tindakan yang telah terjadi dan relevan bagi ramalan akibat selanjutnya.
- source_word: אֶת דְּבַר הַמַּלְכָּה
  choice: perkataan sang ratu
  rationale: דָּבָר dapat berarti perkataan, perkara, atau kabar tentang suatu tindakan. 'Perkataan' menjaga bentuk ringkas teks, sedangkan catatan kaki mempertahankan keluasan maknanya.
- source_word: לְכֹל שָׂרֵי הַמֶּלֶךְ
  choice: kepada semua pejabat raja
  rationale: שָׂרִים menunjuk para pemimpin atau pejabat istana; 'pejabat' jelas dan tidak memberi kesan bahwa mereka semua pangeran berdasarkan keturunan.
- source_word: וּכְדַי
  choice: Akibatnya, akan ada ... yang tak tanggung-tanggung
  rationale: Klausa Ibrani eliptis menyatakan kecukupan atau kelimpahan. Ungkapan Indonesia ini melengkapi klausa secara wajar dan menyampaikan jumlah atau tingkat yang lebih dari cukup.
- source_word: בִּזָּיוֹן
  choice: penghinaan
  rationale: Nomina ini dapat menunjuk sikap meremehkan atau perlakuan menghina. 'Penghinaan' sesuai dengan tindakan tidak hormat yang dikhawatirkan dalam konteks.
- source_word: וָקָצֶף
  choice: dan kemarahan
  rationale: קֶצֶף berarti amarah atau murka. 'Kemarahan' alami dalam bahasa Indonesia dan tidak menentukan secara tidak perlu siapa yang marah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada resmi sesuai suasana istana. 'Sang ratu' dipakai untuk rujukan terhormat dan alami. Struktur dibagi menjadi dua kalimat agar hubungan akibat pada klausa eliptis jelas tanpa menghapus ambiguitas leksikal yang dicatat.
