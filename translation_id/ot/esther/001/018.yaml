  - severity: low
    issue: “Akibatnya” dan “yang tak tanggung-tanggung” bersifat penafsiran/idiomatis berlebih.
    rationale: Klausa penutup memang eliptis dan menyatakan kecukupan atau kelimpahan penghinaan serta kemarahan, tetapi waw tidak perlu diterjemahkan sebagai penanda sebab-akibat yang tegas, dan idiom tersebut kurang formal.
  - severity: low
    issue: Alternatif catatan kaki b “perkara tentang sang ratu” kurang mencerminkan keluasan makna דְּבַר secara idiomatis.
    rationale: “Perkara mengenai sang ratu” atau “peristiwa yang menyangkut sang ratu” lebih alami dan tidak menyempitkan acuan.
  revised_text: Pada hari ini juga, para perempuan bangsawan Persia dan Media yang telah mendengar perkataan sang ratu akan berkata demikian kepada semua pejabat raja[a][b], dan akan cukup banyak penghinaan serta kemarahan.[c]
