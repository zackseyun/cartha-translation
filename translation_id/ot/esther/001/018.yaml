  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani dengan baik: perempuan-perempuan berpangkat dari Persia dan Media, yang telah mendengar perkara/perkataan ratu, dipandang akan berbicara kepada semua pejabat raja. Namun, “hal yang sama” menambahkan objek yang tidak dinyatakan secara eksplisit dalam teks, dan “Akibatnya” membuat hubungan sebab-akibat lebih eksplisit daripada waw Ibrani. Ungkapan “tak tanggung-tanggung” juga menggeser gagasan “cukup/banyak” ke idiom intensif yang lebih bebas.'
