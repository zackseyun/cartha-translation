  terminology: “Perempuan bangsawan,” “Persia dan Media,” “sang ratu,” “pejabat raja,” “penghinaan,” dan “kemarahan” merupakan pilihan yang baik. “Perkara tentang sang ratu” dalam catatan kaki kurang tepat daripada “perkara mengenai sang ratu” atau “peristiwa yang menyangkut sang ratu,” karena דְּבַר dapat merujuk pada perkara/kejadian yang berkaitan dengan ratu.
