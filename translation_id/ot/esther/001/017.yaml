  text: כִּֽי יֵצֵ֤א דְבַר הַ/מַּלְכָּה֙ עַל כָּל הַ/נָּשִׁ֔ים לְ/הַבְז֥וֹת בַּעְלֵי/הֶ֖ן בְּ/עֵינֵי/הֶ֑ן בְּ/אָמְרָ֗/ם הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֡וֹשׁ אָמַ֞ר לְ/הָבִ֨יא אֶת וַשְׁתִּ֧י הַ/מַּלְכָּ֛ה לְ/פָנָ֖י/ו וְ/לֹא בָֽאָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/017.yaml
  text: For the queen’s matter will go out to all women, causing them to despise their husbands in their eyes, when they say, ‘King Ahasuerus said to bring Queen Vashti before him, but she did not come.’
translation:
  language: id
  text: Sebab perkara tentang ratu itu akan tersebar kepada semua perempuan sehingga mereka memandang rendah suami mereka sendiri, ketika mereka berkata, ‘Raja Ahasyweros mengatakan agar Ratu Wasti dibawa menghadapnya, tetapi ia tidak datang.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר הַמַּלְכָּה
  choice: perkara tentang ratu itu
  rationale: דָּבָר dapat berarti perkataan, perkara, atau laporan. Dalam konteks ini yang tersebar ialah kabar mengenai peristiwa yang menyangkut sang ratu; pilihan ini mempertahankan keluasan maknanya tanpa mempersempitnya menjadi sekadar perilaku.
- source_word: יֵצֵא ... עַל כָּל הַנָּשִׁים
  choice: akan tersebar kepada semua perempuan
  rationale: Ungkapan harfiah 'akan keluar kepada/atas' secara idiomatis menunjuk pada perkara atau kabar yang menjadi luas diketahui.
- source_word: לְהַבְזוֹת בַּעְלֵיהֶן בְּעֵינֵיהֶן
  choice: sehingga mereka memandang rendah suami mereka sendiri
  rationale: הבז berarti meremehkan atau memandang hina; 'di mata mereka' dinyatakan alami melalui idiom Indonesia 'memandang rendah', sedangkan 'sendiri' memperjelas sufiks posesif tanpa menambah gagasan baru.
- source_word: אָמַר לְהָבִיא
  choice: mengatakan agar ... dibawa
  rationale: Teks memakai 'berkata/mengatakan', bukan verba eksplisit 'memerintahkan'. Konstruksi infinitif kausatif pasif dipertahankan sebagai 'agar ... dibawa'.
- source_word: לְפָנָיו
  choice: menghadap dia
  rationale: Secara harfiah 'ke hadapannya'; 'menghadap dia' merupakan ungkapan Indonesia yang alami dalam konteks istana dan tetap mencerminkan relasi arah dalam teks.
theological_decisions:
- issue: Apakah ucapan Ahasyweros harus diterjemahkan sebagai perintah eksplisit
  choice: mengatakan agar Ratu Wasti dibawa
  alternative: memerintahkan supaya Ratu Wasti dibawa
  rationale: Walaupun konteks menyiratkan otoritas kerajaan, verba sumber hanya אָמַר ('berkata/mengatakan'). Terjemahan tidak memperkerasnya menjadi verba 'memerintahkan'.
- issue: Penilaian narator terhadap kekhawatiran para pejabat
  choice: disajikan sebagai isi alasan yang dikemukakan, tanpa pengesahan tambahan
  alternative: merumuskan akibat itu sebagai fakta moral yang didukung narator
  rationale: Ayat ini berada dalam pidato Memukan. Terjemahan mempertahankan pernyataannya tanpa menambahkan persetujuan atau penolakan narator.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama mengikuti bentuk Indonesia yang lazim: Ahasyweros dan Wasti. Struktur kutipan dan hubungan sebab-akibat dibuat jelas bagi pembaca umum, sambil mempertahankan ketegangan antara makna leksikal ''mengatakan'' dan fungsi pragmatisnya sebagai titah raja.'
