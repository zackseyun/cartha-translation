  text: ח֣וּר כַּרְפַּ֣ס וּ/תְכֵ֗לֶת אָחוּז֙ בְּ/חַבְלֵי ב֣וּץ וְ/אַרְגָּמָ֔ן עַל גְּלִ֥ילֵי כֶ֖סֶף וְ/עַמּ֣וּדֵי שֵׁ֑שׁ מִטּ֣וֹת זָהָ֣ב וָ/כֶ֗סֶף עַ֛ל רִֽצְפַ֥ת בַּהַט וָ/שֵׁ֖שׁ וְ/דַ֥ר וְ/סֹחָֽרֶת׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/006.yaml
  text: There were hangings of white cotton and blue[a], fastened with cords of fine linen and purple to silver rings and marble pillars, and couches of gold and silver on a pavement of alabaster, marble, mother-of-pearl[c][b], and precious stones.
translation:
  language: id
  text: Ada tirai-tirai dari katun putih dan biru[a], yang diikat dengan tali-tali lenan halus dan ungu pada cincin-cincin perak[b] dan tiang-tiang pualam. Ada dipan-dipan[c] dari emas dan perak di atas lantai yang terbuat dari alabaster, pualam, kulit mutiara, dan batu-batu berharga.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Warna yang dimaksud dapat berkisar dari biru sampai biru-ungu.
    reason: lexical_alternative
  - marker: b
    text: Atau “batang-batang perak”; istilah Ibraninya dapat menunjuk perlengkapan perak yang bundar atau tergulung.
    reason: lexical_alternative
  - marker: c
    text: “Dipan-dipan” adalah tempat duduk panjang untuk berbaring santai dalam perjamuan, bukan tempat tidur biasa.
    reason: cultural_note
  - marker: d
    text: Jenis bahan-bahan lantai yang disebut dalam bahasa Ibrani tidak dapat dipastikan. Sebutan “alabaster”, “pualam”, “kulit mutiara”, dan “batu-batu berharga” mengikuti identifikasi yang umum; beberapa di antaranya juga diterjemahkan “porfiri”, “pualam putih”, atau “batu gelap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: חוּר כַּרְפַּס וּתְכֵלֶת
  choice: tirai-tirai dari katun putih dan biru
  rationale: חוּר paling mungkin menyatakan warna putih, כַּרְפַּס menunjuk kain katun mewah, dan תְכֵלֶת adalah warna biru hingga biru-ungu. Kata 'tirai-tirai' disediakan oleh konteks dekorasi dan diperlukan agar rangkaian nominal ini alami dalam bahasa Indonesia.
- source_word: אָחוּז
  choice: diikat
  rationale: Partisip pasif ini menggambarkan kain-kain yang ditahan atau dipasangkan; 'diikat' konkret dan sesuai dengan tali yang disebut sesudahnya.
- source_word: חַבְלֵי בוּץ וְאַרְגָּמָן
  choice: tali-tali lenan halus dan tali-tali ungu
  rationale: Terjemahan ini mempertahankan dua unsur bahan/warna tanpa memutuskan bahwa lenan itu sendiri pasti berwarna ungu. Pengulangan 'tali-tali' membuat susunan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: גְּלִילֵי כֶסֶף
  choice: gelang-gelang perak
  rationale: גְּלִילִים menunjuk benda yang bundar atau tergulung. Dalam konteks pemasangan tirai, 'gelang-gelang' paling mudah dipahami, meskipun bentuk tepat perlengkapan itu tidak pasti.
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: tiang-tiang pualam
  rationale: Di sini שֵׁשׁ menunjuk batu putih, bukan lenan. 'Pualam' merupakan istilah arsitektural Indonesia yang wajar untuk marmer, walaupun jenis batu persisnya tidak pasti.
- source_word: מִטּוֹת זָהָב וָכֶסֶף
  choice: dipan-dipan dari emas dan perak
  rationale: Dalam suasana perjamuan, מִטּוֹת adalah tempat duduk panjang untuk berbaring santai, bukan tempat tidur biasa. 'Dipan' menyampaikan bentuk perabot itu secara ringkas.
- source_word: רִצְפַת
  choice: lantai berlapis
  rationale: Kata ini menunjuk permukaan lantai yang dibuat dari bahan-bahan yang kemudian disebut. 'Lantai berlapis' alami dalam bahasa Indonesia dan tidak terlalu menentukan bahwa susunannya pasti mosaik.
- source_word: בַּהַט וָשֵׁשׁ וְדַר וְסֹחָרֶת
  choice: alabaster, pualam, kulit mutiara, dan batu-batu berharga
  rationale: Keempat istilah menunjuk bahan lantai yang mewah, tetapi beberapa identifikasinya tidak pasti. Pilihan ini mengikuti identifikasi ilmiah yang lazim sambil menyatakan ketidakpastian itu dalam catatan kaki.
