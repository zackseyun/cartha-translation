id: EST.1.21
reference: Esther 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּיטַב֙ הַ/דָּבָ֔ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יַּ֥עַשׂ הַ/מֶּ֖לֶךְ כִּ/דְבַ֥ר מְמוּכָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/021.yaml
  text: The matter pleased the king and the officials[b][a], and the king did according to the word of Memucan.
translation:
  language: id
  text: Hal itu dipandang baik oleh raja dan para pejabat, lalu raja bertindak sesuai dengan perkataan Memukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan nasihat Memukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב ... בְּעֵינֵי
  choice: dipandang baik oleh
  rationale: Ungkapan Ibrani harfiah 'baik di mata' menyatakan penilaian atau persetujuan. 'Dipandang baik oleh' alami dalam bahasa Indonesia dan mempertahankan nuansa evaluatifnya.
- source_word: הַדָּבָר
  choice: hal itu
  rationale: דָּבָר memiliki cakupan luas, seperti 'perkataan, hal, perkara'. Di sini ungkapan tersebut menunjuk pada usul yang baru disampaikan Memukan; 'hal itu' cukup luas dan tidak terlalu menafsirkan.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung מֶלֶךְ dalam konteks ini.
- source_word: וְהַשָּׂרִים
  choice: dan para pejabat
  rationale: שָׂרִים menunjuk para pemimpin atau pejabat tinggi istana. 'Para pejabat' jelas, modern, dan cocok dengan lingkungan istana Persia.
- source_word: וַיַּעַשׂ
  choice: lalu raja bertindak
  rationale: עָשָׂה berarti 'melakukan/membuat'. 'Bertindak' menghasilkan kalimat Indonesia yang alami, sementara frasa berikutnya menyatakan dasar tindakannya.
- source_word: כִּדְבַר
  choice: sesuai dengan perkataan
  rationale: Secara dekat berarti 'menurut/sesuai dengan perkataan'. Pilihan ini mempertahankan keluasan דָּבָר dan tidak secara diam-diam membatasinya menjadi 'nasihat', meskipun itulah maksud kontekstualnya.
- source_word: מְמוּכָן
  choice: Memukan
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa mempertahankan secara kaku idiom Ibrani 'baik di mata', sedangkan ambiguitas דָּבָר pada frasa penutup dipertahankan dalam teks utama dan dijelaskan melalui alternatif kontekstual di catatan kaki.
