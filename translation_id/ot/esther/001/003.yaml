base_translation:
  language: en
  yaml_path: translation/ot/esther/001/003.yaml
  text: In the third year of his reign[a], he gave a banquet for all his officials and servants—the army of Persia and Media, the nobles[c][b], and the officials of the provinces before him.
translation:
  language: id
  text: Pada tahun ketiga pemerintahannya, ia mengadakan perjamuan[a] bagi semua pembesar dan pegawainya, yakni pasukan Persia dan Media[b], para bangsawan, serta para pembesar provinsi yang hadir di hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat berarti pesta atau jamuan yang ditandai dengan minum dan perayaan.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kekuatan Persia dan Media.” Kata Ibrani yang dipakai dapat menunjuk kepada pasukan, kekuatan militer, atau kekuatan secara lebih umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: Pada tahun ketiga pemerintahannya
  rationale: Ungkapan waktu ini menunjuk pada tahun ketiga masa pemerintahannya; bentuk Indonesia ini alami dan mempertahankan penanda kronologis.
- source_word: עָשָׂה מִשְׁתֶּה
  choice: ia mengadakan perjamuan
  rationale: Secara idiomatis, עָשָׂה bersama מִשְׁתֶּה berarti mengadakan jamuan. 'Perjamuan' sesuai dengan konteks istana, sementara unsur minum dan perayaan dijelaskan dalam catatan kaki.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: bagi semua pembesar dan pegawainya
  rationale: שָׂרִים menunjuk kepada pejabat atau orang berkedudukan tinggi, sedangkan עֲבָדִים dalam konteks istana dapat berarti para pelayan atau pegawai raja. 'Pembesar dan pegawai' menyampaikan kedudukan mereka tanpa menyiratkan perbudakan secara tidak perlu.
- source_word: חֵיל פָּרַס וּמָדַי
  choice: pasukan Persia dan Media
  rationale: חֵיל dapat berarti kekuatan, angkatan, atau pasukan. Dalam daftar kalangan pemerintahan dan istana ini, 'pasukan' mempertahankan makna militernya tanpa mempersempitnya menjadi satu jenis kesatuan tentara.
- source_word: הַפַּרְתְּמִים
  choice: para bangsawan
  rationale: Kata serapan Persia ini menunjuk kepada golongan terpandang atau bangsawan berpangkat tinggi.
- source_word: וְשָׂרֵי הַמְּדִינוֹת
  choice: serta para pembesar provinsi
  rationale: Ungkapan ini menunjuk kepada pejabat tinggi wilayah. 'Pembesar provinsi' cukup luas dan tidak menetapkan jabatan khusus seperti gubernur yang tidak disebutkan oleh teks.
- source_word: לְפָנָיו
  choice: hadir di hadapannya
  rationale: Secara harfiah berarti 'di hadapannya' dan dalam konteks istana menyatakan bahwa mereka hadir di hadapan raja. Penambahan 'hadir' menghasilkan kalimat Indonesia yang jelas tanpa menghilangkan citra istananya.
