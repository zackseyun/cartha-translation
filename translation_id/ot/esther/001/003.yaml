translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-istana yang bermartabat. Struktur klausa mempertahankan jeda antara para pembesar dan pegawai yang menerima perjamuan dengan kelompok-kelompok yang disebut hadir di hadapan raja, sesuai pembagian sintaksis teks Masoret tanpa memaksakan bahwa semua unsur merupakan satu daftar aposisional.
