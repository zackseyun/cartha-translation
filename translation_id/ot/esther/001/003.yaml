  to: Pada tahun ketiga pemerintahannya, ia mengadakan perjamuan[a] bagi semua pembesar dan pegawainya, yakni pasukan Persia dan Media[b], para bangsawan, serta para pembesar provinsi yang hadir di hadapannya.
