  text: וַ/תְּמָאֵ֞ן הַ/מַּלְכָּ֣ה וַשְׁתִּ֗י לָ/בוֹא֙ בִּ/דְבַ֣ר הַ/מֶּ֔לֶךְ אֲשֶׁ֖ר בְּ/יַ֣ד הַ/סָּרִיסִ֑ים וַ/יִּקְצֹ֤ף הַ/מֶּ֨לֶךְ֙ מְאֹ֔ד וַ/חֲמָת֖/וֹ בָּעֲרָ֥ה בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/012.yaml
  text: But Queen Vashti refused to come at the king’s command by the hand of the eunuchs[a], and the king became very angry[b], and his wrath burned within him.
translation:
  language: id
  text: Namun, Ratu Wasti menolak datang atas perintah raja yang disampaikan melalui para sida-sida[a]. Raja pun menjadi sangat marah, dan murkanya berkobar dalam dirinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melalui tangan para sida-sida,” yaitu perintah itu disampaikan dengan perantaraan mereka.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “amarahnya menyala-nyala dalam dirinya.” Bahasa Ibrani menggambarkan kemarahan sebagai api yang berkobar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמָאֵן
  choice: menolak
  rationale: Kata kerja מאן menyatakan penolakan atau ketidaksediaan yang disengaja; “menolak” langsung, alami, dan mempertahankan kekuatan ungkapannya.
- source_word: הַמַּלְכָּה וַשְׁתִּי
  choice: Ratu Wasti
  rationale: Susunan gelar dan nama ini alami dalam bahasa Indonesia serta mempertahankan jabatan dan identitas tokoh.
- source_word: לָבוֹא
  choice: datang
  rationale: Dalam konteks pemanggilan oleh raja, בוא paling alami diterjemahkan “datang”.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: atas perintah raja
  rationale: דבר di sini menunjuk pada titah atau perintah raja, bukan sekadar perkataan; “atas perintah” menyampaikan fungsi frasa secara idiomatis.
- source_word: אֲשֶׁר בְּיַד הַסָּרִיסִים
  choice: yang disampaikan melalui para sida-sida
  rationale: Ungkapan “melalui tangan” menandai perantaraan; terjemahan ini menjelaskan bahwa para sida-sida menyampaikan perintah tanpa menghilangkan peran mereka sebagai perantara.
- source_word: וַיִּקְצֹף מְאֹד
  choice: menjadi sangat marah
  rationale: קצף menyatakan kemarahan hebat dan מְאֹד memperkuatnya; frasa ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַחֲמָתוֹ בָּעֲרָה בוֹ
  choice: murkanya berkobar dalam dirinya
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang murka yang menyala sekaligus menyampaikan bahwa kemarahan itu berkecamuk di dalam diri raja.
theological_decisions: []
