  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sida-sida” dipertahankan sebagai istilah historis bagi pejabat istana yang dikebiri. Struktur kalimat dibuat alami, sementara metafora api dalam teks Ibrani tetap dipertahankan.
