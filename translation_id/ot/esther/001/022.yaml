base_translation:
  language: en
  yaml_path: translation/ot/esther/001/022.yaml
  text: And he sent letters to all the provinces of the king[a], to each province in its own script and to each people in its own language[d][c][b], that every man should be master in his own house and speak the language of his own people.
translation:
  language: id
  text: Lalu ia mengirimkan surat-surat ke seluruh provinsi kerajaan, kepada tiap-tiap provinsi menurut aksaranya dan kepada tiap-tiap bangsa menurut bahasanya, supaya setiap laki-laki berkuasa dalam rumah tangganya[a] dan berbicara dalam bahasa bangsanya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya setiap suami memerintah dalam rumah tangganya.” Teks Ibrani secara harfiah menyebut “setiap laki-laki,” tetapi konteksnya menyangkut kedudukan suami dalam rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Klausa terakhir secara harfiah berbunyi “dan berbicara menurut bahasa bangsanya.” Maksudnya dapat berupa kewajiban bagi laki-laki itu untuk memakai bahasa bangsanya, atau, secara lebih luas, agar tata rumah tangga mengikuti identitas bahasa sang suami.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: Lalu ia mengirimkan surat-surat
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sehingga “Lalu” wajar dalam narasi Indonesia. סְפָרִים dalam konteks pemerintahan menunjuk pada surat atau dokumen resmi; “surat-surat” mempertahankan bentuk jamak tanpa mempersempitnya menjadi istilah teknis tertentu.
- source_word: כָּל מְדִינוֹת הַמֶּלֶךְ
  choice: seluruh provinsi kerajaan
  rationale: Frasa konstruksi ini menunjuk pada semua provinsi yang berada di bawah kekuasaan raja. “Provinsi kerajaan” lebih alami dalam bahasa Indonesia daripada “provinsi-provinsi milik raja,” sambil mempertahankan hubungan dengan ranah kerajaan.
- source_word: אֶל מְדִינָה וּמְדִינָה כִּכְתָבָהּ
  choice: kepada tiap-tiap provinsi menurut aksaranya
  rationale: Pengulangan nomina memberi makna distributif, yakni setiap provinsi secara tersendiri. כְּתָב menunjuk pada sistem tulisan atau aksara yang digunakan di provinsi tersebut.
- source_word: וְאֶל עַם וָעָם כִּלְשׁוֹנוֹ
  choice: dan kepada tiap-tiap bangsa menurut bahasanya
  rationale: Pengulangan עַם bersifat distributif. “Bangsa” di sini menunjuk pada kelompok etnolinguistik dalam kekaisaran, sedangkan לָשׁוֹן secara alami diterjemahkan “bahasa.”
- source_word: לִהְיוֹת כָּל אִישׁ שֹׂרֵר בְּבֵיתוֹ
  choice: supaya setiap laki-laki berkuasa dalam rumah tangganya
  rationale: Infinitif לִהְיוֹת menyatakan maksud atau isi ketetapan. אִישׁ secara harfiah berarti laki-laki, tetapi dalam konteks ini merujuk pada suami atau kepala rumah tangga. Partisip שֹׂרֵר menyatakan tindakan memerintah atau menjalankan kekuasaan; “berkuasa” menyampaikan hal itu tanpa gelar tambahan.
- source_word: וּמְדַבֵּר כִּלְשׁוֹן עַמּוֹ
  choice: dan berbicara dalam bahasa bangsanya sendiri
  rationale: Secara gramatikal, partisip “berbicara” paling langsung melanjutkan ketetapan tentang setiap laki-laki. “Bahasa bangsanya sendiri” mempertahankan acuan pronominal maskulin tunggal dan kaitannya dengan identitas kelompoknya.
