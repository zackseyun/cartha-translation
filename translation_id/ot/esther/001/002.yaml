translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur anak kalimat serta koma penutup dipertahankan karena ayat ini berlanjut secara sintaktis ke ayat berikutnya. Ungkapan konkret 'duduk di takhta' dipilih daripada parafrasa 'bertakhta' agar citra teks Ibrani tetap terlihat.
