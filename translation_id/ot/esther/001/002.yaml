lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Ungkapan waktu naratif ini diterjemahkan secara alami dalam bahasa Indonesia sambil mempertahankan daya tunjuk הָהֵם.
- source_word: כְּשֶׁבֶת
  choice: ketika ... duduk
  rationale: Preposisi כְּ dengan infinitif konstruk יָשַׁב membentuk anak kalimat waktu. Bentuk ini mempertahankan gambaran raja yang duduk di takhta tanpa mengubahnya menjadi sekadar verba abstrak 'memerintah'.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Gelar ditempatkan sebelum nama sesuai tata bahasa Indonesia, dan 'Ahasyweros' merupakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: di takhta kerajaannya
  rationale: Terjemahan ini mempertahankan unsur כִּסֵּא, מַלְכוּת, dan sufiks posesifnya. Preposisi 'di' lebih alami daripada 'di atas' dalam ungkapan Indonesia 'duduk di takhta'.
- source_word: אֲשֶׁר
  choice: yang berada
  rationale: Kata relatif ini memperkenalkan keterangan lokasi bagi takhta. Penambahan 'berada' membuat hubungan tersebut jelas dan alami tanpa menambah makna substantif.
- source_word: בְּשׁוּשַׁן
  choice: di ... Susa
  rationale: '''Susa'' adalah bentuk geografis modern yang umum untuk nama tempat שׁוּשַׁן; bentuk yang lebih dekat dengan transliterasi Ibraninya dicatat dalam catatan kaki.'
- source_word: הַבִּירָה
  choice: benteng
  rationale: Dalam konteks ini בִּירָה menunjuk pada kompleks kota atau istana yang diperkuat. 'Benteng' mempertahankan nuansa pertahanan dan lebih tepat daripada 'ibu kota'.
