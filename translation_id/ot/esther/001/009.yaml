translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Perjamuan' mempertahankan cakupan מִשְׁתֶּה sebagai pesta makan-minum tanpa mempersempitnya menjadi acara minum saja; 'istana' dipilih sebagai padanan kontekstual yang alami.
