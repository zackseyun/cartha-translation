  text: Queen Vashti also gave a feast for the women in the royal house that belonged to King Ahasuerus[a][b].
translation:
  language: id
  text: Ratu Wasti juga mengadakan perjamuan bagi para perempuan di istana[a] milik Raja Ahasyweros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah kerajaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Menandai tambahan pada kisah perjamuan raja dalam ayat sebelumnya.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Ratu Wasti
  rationale: Susunan gelar diikuti nama terdengar alami dalam bahasa Indonesia; nama ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: עָשְׂתָה מִשְׁתֵּה
  choice: mengadakan perjamuan
  rationale: Secara harfiah verba berarti 'membuat/melakukan', tetapi kolokasi Indonesia yang alami untuk suatu perjamuan adalah 'mengadakan perjamuan'.
- source_word: נָשִׁים
  choice: bagi para perempuan
  rationale: Menunjukkan kelompok peserta perjamuan tanpa memakai sebutan sosial yang tidak terdapat dalam teks sumber.
- source_word: בֵּית הַמַּלְכוּת
  choice: istana
  rationale: Ungkapan harfiah 'rumah kerajaan' dalam konteks ini secara alami menunjuk pada istana; nuansa literal dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: milik Raja Ahasweros
  rationale: Menyampaikan relasi kepemilikan dalam klausa Ibrani secara ringkas dan alami.
