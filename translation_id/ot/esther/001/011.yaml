base_translation:
  language: en
  yaml_path: translation/ot/esther/001/011.yaml
  text: to bring Queen Vashti before the king with the royal crown[a], to show the peoples and the officials her beauty[c][b], for she was beautiful in appearance.
translation:
  language: id
  text: untuk membawa Ratu Wasti menghadap raja dengan mengenakan mahkota kerajaan[a], guna memperlihatkan kecantikannya kepada bangsa-bangsa dan para pejabat, sebab ia elok dipandang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan mahkota kerajaan.” Kata depan Ibrani dapat menyatakan keadaan penyerta; terjemahan “dengan mengenakan” memperjelas dalam bahasa Indonesia bahwa mahkota itu dikenakan oleh Wasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִיא
  choice: untuk membawa
  rationale: 'Infinitif Hifil dari בוא menyatakan gerak kausatif: para sida-sida diperintahkan untuk membawa Wasti datang menghadap raja.'
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Ratu Wasti
  rationale: Gelar yang beraposisi dengan nama diri disusun menurut ungkapan Indonesia yang wajar.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: menghadap raja
  rationale: לִפְנֵי berarti berada di hadapan atau dalam kehadiran seseorang; 'menghadap raja' alami dalam konteks istana dan menyatakan kedatangan ke hadapan raja.
- source_word: בְּכֶתֶר מַלְכוּת
  choice: dengan mahkota kerajaan
  rationale: Mempertahankan keluasan makna preposisi ב sebagai keadaan penyerta tanpa secara eksplisit menambahkan bahwa mahkota itu dikenakan.
- source_word: לְהַרְאוֹת
  choice: guna memperlihatkan
  rationale: Infinitif Hifil dari ראה berarti 'membuat melihat' atau 'memperlihatkan' dan menyatakan tujuan.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak dipertahankan dan dalam konteks kekaisaran Persia menunjuk pada beragam kelompok bangsa yang tunduk kepadanya.
- source_word: וְהַשָּׂרִים
  choice: dan para pejabat
  rationale: שָׂרִים menunjuk para penguasa atau pejabat tinggi; 'para pejabat' jelas dan tidak menyiratkan bahwa mereka putra raja.
- source_word: אֶת יָפְיָהּ
  choice: kecantikannya
  rationale: Nomina abstrak dengan sufiks feminin tunggal diterjemahkan langsung dan alami.
- source_word: כִּי טוֹבַת מַרְאֶה הִיא
  choice: sebab ia elok dipandang
  rationale: Ungkapan Ibrani harfiah 'baik dalam penampilan' menyatakan kecantikan jasmani; 'elok dipandang' mempertahankan fokus visual dengan bahasa Indonesia yang alami dan bermartabat.
