  register: Bahasa Indonesia baku, modern, dan bernuansa naratif istana. Bentuk jamak 'bangsa-bangsa' dipertahankan, sedangkan idiom Ibrani tentang penampilan diterjemahkan secara alami. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang dijelaskan.
