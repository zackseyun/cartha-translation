  text: וּ/בִ/מְל֣וֹאת הַ/יָּמִ֣ים הָ/אֵ֗לֶּה עָשָׂ֣ה הַ/מֶּ֡לֶךְ לְ/כָל הָ/עָ֣ם הַ/נִּמְצְאִים֩ בְּ/שׁוּשַׁ֨ן הַ/בִּירָ֜ה לְ/מִ/גָּ֧דוֹל וְ/עַד קָטָ֛ן מִשְׁתֶּ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּ/חֲצַ֕ר גִּנַּ֥ת בִּיתַ֖ן הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/005.yaml
  text: And when these days were completed[a], the king gave a banquet for all the people who were present in Susa the citadel, from great to small, for seven days[d][c][b], in the court of the garden of the king’s palace.
translation:
  language: id
  text: Ketika hari-hari itu berakhir, raja mengadakan perjamuan[a] selama tujuh hari bagi semua orang yang berada di Susan, kota benteng[b], dari yang besar sampai yang kecil[c], di pelataran taman istana[d] raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesta”; istilah Ibrani ini sering menunjuk pada jamuan yang disertai minum-minum.
    reason: lexical_alternative
  - marker: b
    text: Atau “di benteng Susan.”
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini berarti orang-orang dari segala tingkat kedudukan.
    reason: idiom_clarification
  - marker: d
    text: Kata ini juga dapat diterjemahkan “paviliun” atau “bangunan”; “istana” paling sesuai dengan konteks kerajaan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִמְלֹאות הַיָּמִים הָאֵלֶּה
  choice: Setelah hari-hari itu berakhir
  rationale: Konstruksi ב dengan infinitif מלא menyatakan waktu, yakni ketika rangkaian hari yang disebut sebelumnya telah selesai. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: עָשָׂה ... מִשְׁתֶּה
  choice: mengadakan perjamuan
  rationale: Secara harfiah עשה berarti 'membuat', tetapi bersama מִשְׁתֶּה idiom ini berarti mengadakan jamuan. 'Perjamuan' sesuai dengan suasana kerajaan tanpa menghilangkan kemungkinan adanya penekanan pada minum-minum.
- source_word: לְכָל הָעָם הַנִּמְצְאִים
  choice: bagi seluruh rakyat yang berada
  rationale: עָם di sini menunjuk secara luas kepada penduduk atau orang-orang yang ada di ibu kota, sedangkan bentuk partisipel Niphal הַנִּמְצְאִים berarti mereka yang berada atau hadir di sana.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: di Susan, kota benteng
  rationale: בִּירָה menunjuk pada kota berkubu atau kawasan benteng kerajaan. Bentuk aposisional ini mempertahankan susunan Ibrani sekaligus jelas bagi pembaca Indonesia.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: dari yang besar sampai yang kecil
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang merangkum orang dari segala tingkat kedudukan tanpa mempersempitnya menjadi usia atau golongan tertentu.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Frasa durasi ini diterjemahkan secara langsung dan alami.
- source_word: בַּחֲצַר גִּנַּת
  choice: di pelataran taman
  rationale: חָצֵר adalah pelataran atau halaman, dan bentuk konstruk גִּנַּת menghubungkannya dengan taman. 'Pelataran taman' menyampaikan hubungan ruang itu secara ringkas.
- source_word: בִּיתַן הַמֶּלֶךְ
  choice: istana raja
  rationale: Kata pinjaman Persia בִּיתַן dapat berarti istana, paviliun, atau bangunan. 'Istana' paling sesuai dengan konteks kerajaan, sementara ketidakpastian leksikal dipertahankan dalam catatan kaki.
