  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama שׁוּשַׁן ditulis “Susan” menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Susunan kalimat dibuat alami tanpa menghapus rincian tempat, durasi, atau cakupan sosial dalam teks Ibrani.
