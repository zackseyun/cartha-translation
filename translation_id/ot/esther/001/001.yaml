  text: וַ/יְהִ֖י בִּ/ימֵ֣י אֲחַשְׁוֵר֑וֹשׁ ה֣וּא אֲחַשְׁוֵר֗וֹשׁ הַ/מֹּלֵךְ֙ מֵ/הֹ֣דּוּ וְ/עַד כּ֔וּשׁ שֶׁ֛בַע וְ/עֶשְׂרִ֥ים וּ/מֵאָ֖ה מְדִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/001.yaml
  text: It happened in the days of Ahasuerus—the Ahasuerus who reigned from India to Cush[b][a], over one hundred twenty-seven provinces—
translation:
  language: id
  text: Terjadilah pada zaman Ahasyweros[a]—yaitu Ahasyweros yang memerintah dari India sampai Kus[b], atas seratus dua puluh tujuh provinsi—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Xerxes,” jika nama ini dipahami sebagai raja Persia yang diidentifikasi dalam sejarah, alih-alih ditransliterasikan langsung dari bentuk Ibraninya.
    reason: alternative_reading
  - marker: b
    text: “Kus” adalah nama kawasan kuno; sebagian terjemahan memakai “Etiopia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada zaman
  rationale: Bentuk pembuka narasi ini menyatu dengan keterangan waktu בִּימֵי. Dalam bahasa Indonesia, pembukaan “Pada zaman ...” menyampaikan peralihan naratif secara alami tanpa menambahkan kata waktu yang tidak eksplisit dalam sumber.
- source_word: בִּימֵי
  choice: pada zaman
  rationale: Ungkapan temporal Ibrani ini secara wajar berarti “pada zaman” atau “pada masa.” “Pada zaman” dekat dengan bentuk sumber dan sesuai dengan ragam narasi yang bermartabat.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasyweros
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani dan mengikuti bentuk yang mudah dibaca dalam ejaan Indonesia. Identifikasi historis “Xerxes” dicantumkan sebagai alternatif dalam catatan kaki, bukan dimasukkan ke teks utama.
- source_word: הוּא אֲחַשְׁוֵרוֹשׁ
  choice: yaitu Ahasyweros
  rationale: Kata ganti yang diikuti pengulangan nama mengidentifikasi Ahasyweros yang dimaksud. “Yaitu Ahasyweros” mempertahankan fungsi penjelas dan pengulangan nama dengan bahasa Indonesia yang alami.
- source_word: הַמֹּלֵךְ
  choice: yang memerintah
  rationale: Partisip Ibrani menggambarkan Ahasyweros berdasarkan wilayah kekuasaannya; klausa relatif merupakan padanan Indonesia yang alami.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: dari India sampai Kus
  rationale: הֹדּוּ lazim dipahami sebagai India. כּוּשׁ dipertahankan sebagai nama kawasan kuno “Kus,” sehingga tidak menimbulkan kesan bahwa yang dimaksud pasti negara Etiopia modern.
- source_word: שֶׁבַע וְעֶשְׂרִים וּמֵאָה
  choice: seratus dua puluh tujuh
  rationale: Urutan bilangan disesuaikan dengan tata bahasa Indonesia tanpa mengubah nilainya.
- source_word: מְדִינָה
  choice: provinsi
  rationale: Dalam konteks pemerintahan Persia, “provinsi” adalah istilah administratif yang mapan, jelas, dan mudah dipahami.
