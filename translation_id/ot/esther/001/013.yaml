  yaml_path: translation/ot/esther/001/013.yaml
  text: Then the king said to the wise men who knew the times—for this was the king’s procedure before all who knew law and judgment—
translation:
  language: id
  text: Lalu raja berkata kepada orang-orang bijaksana yang mengetahui waktu-waktu—sebab demikianlah urusan raja ditangani di hadapan semua orang yang mengetahui hukum dan peradilan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹדְעֵי הָעִתִּים
  choice: yang memahami keadaan zaman
  rationale: Secara harfiah berarti ‘yang mengetahui zaman/waktu’; dalam konteks istana, ungkapan ini menunjuk pada orang yang memahami keadaan, kesempatan, dan tata cara yang sesuai pada masa itu, tanpa mempersempitnya menjadi ahli nujum.
- source_word: כִּי כֵן דְּבַר הַמֶּלֶךְ
  choice: sebab demikianlah perkara raja dibicarakan
  rationale: דְּבַר dapat berarti perkataan, perkara, atau urusan. Dalam konstruksi ini, maksudnya ialah prosedur penanganan perkara raja; bentuk pasif alami dalam bahasa Indonesia mempertahankan kaitannya dengan frasa ‘di hadapan’.
- source_word: דָּת וָדִין
  choice: hukum dan tata peradilan
  rationale: דָּת adalah hukum/ketetapan, sedangkan דִּין menunjuk pada penghakiman atau proses peradilan. ‘Tata peradilan’ membedakan kedua unsur tanpa memberi kesan bahwa para penasihat itu sendiri adalah keadilan abstrak.
theological_decisions:
- issue: Identitas orang-orang yang ‘memahami keadaan zaman’
  choice: Tidak mengidentifikasi mereka sebagai ahli nujum atau kelompok keagamaan tertentu
  alternative: ‘ahli perbintangan’ atau ‘ahli nujum’
  rationale: Teks Ibrani hanya menyatakan bahwa mereka mengetahui atau memahami הָעִתִּים; identifikasi yang lebih khusus tidak dituntut oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bernada naratif-istana. Tanda pisah mempertahankan ayat sebagai sisipan penjelas yang berlanjut ke ayat berikutnya.
