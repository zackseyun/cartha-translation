revisions:
- from: Lalu raja berkata kepada orang-orang bijaksana yang memahami keadaan zaman—sebab demikianlah perkara raja dibicarakan di hadapan semua orang yang mengetahui hukum dan tata peradilan—
  to: Lalu raja berkata kepada orang-orang bijaksana yang mengetahui waktu-waktu—sebab demikianlah urusan raja ditangani di hadapan semua orang yang mengetahui hukum dan peradilan—
  rationale: Revisi ini mempertahankan ambiguitas “waktu-waktu,” menyampaikan fungsi prosedural frasa tentang urusan raja tanpa membatasi maknanya pada pembicaraan, dan memakai pasangan istilah hukum yang lebih dekat dengan dua nomina Ibrani. Tanda pisah penutup dipertahankan karena sisipan kalimat berlanjut ke ayat berikutnya.
  reviewer_model: gpt-5.6-terra
