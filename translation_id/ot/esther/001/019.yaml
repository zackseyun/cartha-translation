  text: אִם עַל הַ/מֶּ֣לֶךְ ט֗וֹב יֵצֵ֤א דְבַר מַלְכוּת֙ מִ/לְּ/פָנָ֔י/ו וְ/יִכָּתֵ֛ב בְּ/דָתֵ֥י פָֽרַס וּ/מָדַ֖י וְ/לֹ֣א יַעֲב֑וֹר אֲשֶׁ֨ר לֹֽא תָב֜וֹא וַשְׁתִּ֗י לִ/פְנֵי֙ הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וּ/מַלְכוּתָ/הּ֙ יִתֵּ֣ן הַ/מֶּ֔לֶךְ לִ/רְעוּתָ֖/הּ הַ/טּוֹבָ֥ה מִמֶּֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/019.yaml
  text: 'If it seems good to the king[a], let a royal decree go out from before him and be written among the laws of Persia and Media, so that it may not be revoked: that Vashti is not to come before King Ahasuerus[c][b], and let the king give her royal position to another woman better than she.'
translation:
  language: id
  text: Jika raja berkenan[a], hendaklah suatu titah kerajaan dikeluarkan atas perintahnya dan dituliskan dalam undang-undang Persia dan Media sehingga tidak dapat dicabut kembali[b], yaitu bahwa Wasti tidak boleh menghadap Raja Ahasyweros. Hendaklah raja memberikan kedudukan Wasti sebagai ratu[c] kepada perempuan lain yang lebih baik daripadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika hal itu dipandang baik oleh raja.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak dapat diubah” atau “tidak boleh dilanggar.” Ungkapan Ibrani menekankan kekuatan hukum titah yang tetap.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kerajaannya”; dalam konteks ini menunjuk pada kedudukan atau jabatan Wasti sebagai ratu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan istana yang sopan ini menyatakan persetujuan atau perkenanan raja; bentuk Indonesia ini alami dan tetap mencerminkan idiom Ibrani.
- source_word: יֵצֵא דְבַר מַלְכוּת מִלְּפָנָיו
  choice: hendaklah suatu titah kerajaan dikeluarkan atas perintahnya
  rationale: דְבַר מַלְכוּת adalah ketetapan resmi kerajaan, sedangkan מִלְּפָנָיו menunjukkan bahwa titah itu keluar dari hadapan atau kewenangan raja. 'Atas perintahnya' menyampaikan fungsi idiomatisnya secara wajar.
- source_word: וְיִכָּתֵב בְּדָתֵי פָרַס וּמָדַי
  choice: dituliskan dalam undang-undang Persia dan Media
  rationale: Menunjukkan pencatatan resmi ke dalam kumpulan hukum yang diakui, sambil mempertahankan urutan nama dalam teks Ibrani.
- source_word: וְלֹא יַעֲבוֹר
  choice: sehingga tidak dapat dicabut kembali
  rationale: Dalam konteks hukum, ungkapan ini menyatakan bahwa titah tersebut tidak dapat ditiadakan atau ditarik kembali; catatan kaki mempertahankan kemungkinan makna harfiahnya.
- source_word: אֲשֶׁר לֹא תָבוֹא וַשְׁתִּי לִפְנֵי הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: yaitu bahwa Wasti tidak boleh lagi menghadap Raja Ahasyweros
  rationale: Klausa ini menyatakan isi larangan. 'Lagi' wajar dalam bahasa Indonesia karena larangan itu berkaitan dengan akses Wasti selanjutnya ke hadapan raja, tanpa menyiratkan bahwa kata tersebut berdiri tersendiri dalam teks Ibrani.
- source_word: וּמַלְכוּתָהּ
  choice: kedudukan Wasti sebagai ratu
  rationale: Dalam konteks ini מַלְכוּת menunjuk pada status atau jabatan kerajaan Wasti, bukan wilayah kerajaan. Penyebutan nama memperjelas pemilik sufiks tanpa ambiguitas.
- source_word: לִרְעוּתָהּ הַטּוֹבָה מִמֶּנָּה
  choice: kepada perempuan lain yang lebih baik daripadanya
  rationale: רְעוּתָהּ menunjuk pada perempuan lain yang akan menggantikannya, sedangkan perbandingan 'lebih baik' dipertahankan tanpa menentukan secara tambahan dalam hal apa ia lebih baik.
