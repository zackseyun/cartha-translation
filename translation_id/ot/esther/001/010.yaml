base_translation:
  language: en
  yaml_path: translation/ot/esther/001/010.yaml
  text: On the seventh day[a], when the king’s heart was merry with wine, he told Mehuman, Biztha, Harbona, Bigtha, Abagtha, Zethar[b], and Karkas—the seven eunuchs who attended King Ahasuerus—
translation:
  language: id
  text: Pada hari ketujuh, ketika hati raja menjadi riang karena anggur[a], ia berkata kepada Mehuman, Bizta, Harbona, Bigta, Abagta, Zetar, dan Karkas—tujuh sida-sida itu[b] yang melayani di hadapan Raja Ahasyweros—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika hati raja menjadi baik karena anggur,” yaitu ketika anggur membuatnya riang. Ungkapan Ibrani ini tidak secara tegas menyatakan bahwa ia mabuk.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “sida-sida” dalam konteks tertentu dapat pula menunjuk secara lebih luas kepada pejabat istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Ungkapan waktu ini diterjemahkan secara langsung dan alami tanpa menambahkan 'perjamuan', yang tidak dinyatakan dalam ayat ini.
- source_word: כְּטוֹב לֵב הַמֶּלֶךְ בַּיָּיִן
  choice: ketika hati raja menjadi riang karena anggur
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani tentang hati yang menjadi riang karena anggur tanpa menyimpulkan secara berlebihan bahwa raja mabuk.
- source_word: אָמַר
  choice: ia berkata kepada
  rationale: Kata kerja umum untuk 'berkata' dipertahankan; isi perkataannya baru muncul pada ayat berikutnya, sehingga tidak diterjemahkan sebagai 'memerintahkan'.
- source_word: לִמְהוּמָן בִּזְּתָא חַרְבוֹנָא בִּגְתָא וַאֲבַגְתָא זֵתַר וְכַרְכַּס
  choice: Mehuman, Bizta, Harbona, Bigta, Abagta, Zetar, dan Karkas
  rationale: Nama-nama diri ditransliterasikan ke ejaan yang mudah dibaca dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: שִׁבְעַת הַסָּרִיסִים
  choice: ketujuh sida-sida
  rationale: סָרִיס paling langsung berarti sida-sida dalam lingkungan istana, meskipun dalam konteks tertentu dapat dipakai lebih luas bagi pejabat istana.
- source_word: הַמְשָׁרְתִים אֶת פְּנֵי
  choice: yang melayani di hadapan
  rationale: Frasa ini menggambarkan pelayanan pribadi dalam kehadiran raja; bentuk Indonesia mempertahankan citra 'di hadapan' sekaligus terdengar wajar.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Gelar dan nama disusun menurut urutan alami dalam bahasa Indonesia.
