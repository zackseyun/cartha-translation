base_translation:
  language: en
  yaml_path: translation/ot/esther/001/016.yaml
  text: Then Memucan said before the king and the officials[a], “Queen Vashti has done wrong not against the king alone, but against all the officials and all the peoples who are in all the provinces of King Ahasuerus.”
translation:
  language: id
  text: Lalu Memukan berkata di hadapan raja dan para pejabat, “Ratu Wasti telah berbuat salah bukan hanya terhadap raja, melainkan juga terhadap semua pejabat dan semua bangsa yang ada di semua provinsi Raja Ahasweros.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: מומכן
  choice: Memukan
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia dengan mempertahankan bentuk Ibrani sedekat mungkin.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini menyatakan bahwa Memukan berbicara dalam kehadiran raja dan para pejabat.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: Istilah ini menunjuk kepada para penguasa atau pejabat tinggi istana; “para pejabat” jelas dan wajar dalam konteks pemerintahan Persia.
- source_word: לֹא עַל הַמֶּלֶךְ לְבַדּוֹ ... כִּי עַל
  choice: bukan hanya terhadap raja, melainkan juga terhadap
  rationale: 'Konstruksi ini menyatakan perluasan korektif: kesalahan itu dinilai bukan hanya tertuju kepada raja, tetapi juga kepada kelompok-kelompok lain.'
- source_word: עָוְתָה
  choice: telah berbuat salah
  rationale: Kata kerja ini menyatakan tindakan yang salah atau menyimpang secara moral tanpa mempersempitnya menjadi sekadar penghinaan pribadi.
- source_word: וַשְׁתִּי הַמַּלְכָּה
  choice: Ratu Wasti
  rationale: Penempatan gelar sebelum nama merupakan susunan yang alami dalam bahasa Indonesia.
- source_word: כָּל הָעַמִּים
  choice: semua bangsa
  rationale: Bentuk jamak עַמִּים dipertahankan dan sesuai dengan sifat multietnis Kekaisaran Persia.
- source_word: בְּכָל מְדִינוֹת
  choice: di seluruh provinsi
  rationale: Ungkapan ini secara alami menyatakan persebaran di segenap wilayah administratif kerajaan.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasweros
  rationale: Nama raja ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
