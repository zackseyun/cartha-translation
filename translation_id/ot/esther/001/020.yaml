source:
  edition: WLC
  text: וְ/נִשְׁמַע֩ פִּתְגָ֨ם הַ/מֶּ֤לֶךְ אֲשֶֽׁר יַעֲשֶׂה֙ בְּ/כָל מַלְכוּת֔/וֹ כִּ֥י רַבָּ֖ה הִ֑יא וְ/כָל הַ/נָּשִׁ֗ים יִתְּנ֤וּ יְקָר֙ לְ/בַעְלֵי/הֶ֔ן לְ/מִ/גָּד֖וֹל וְ/עַד קָטָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/001/020.yaml
  text: And when the king’s decree that he makes is heard throughout all his kingdom—for it is vast—all the women will give honor to their husbands[b][a], from great to small.
translation:
  language: id
  text: Apabila titah yang dikeluarkan raja terdengar di seluruh kerajaannya—karena kerajaannya itu sangat luas—semua perempuan akan menghormati suami mereka[a], dari yang berkedudukan tinggi sampai yang rendah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “akan memberikan kehormatan kepada suami mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַע
  choice: Apabila ... terdengar
  rationale: Bentuk Nifal menyampaikan gagasan pasif. Dalam konteks ini, klausa tersebut paling alami dipahami sebagai keadaan yang mendahului hasil berikutnya.
- source_word: פִּתְגָם הַמֶּלֶךְ אֲשֶׁר יַעֲשֶׂה
  choice: titah yang dikeluarkan raja
  rationale: פִּתְגָם dalam lingkungan istana Persia menunjuk pada pernyataan resmi kerajaan. 'Titah' alami dan bermartabat dalam bahasa Indonesia, sedangkan 'dikeluarkan' menyampaikan fungsi עשה dalam kolokasi ini.
- source_word: בְּכָל מַלְכוּתוֹ
  choice: di seluruh kerajaannya
  rationale: Ungkapan ini menunjukkan penyebaran ke segenap wilayah kekuasaan raja.
- source_word: כִּי רַבָּה הִיא
  choice: karena kerajaannya itu sangat luas
  rationale: Kata ganti feminin merujuk pada kerajaan. Penyebutan ulang 'kerajaannya' mencegah ketaksaan dalam bahasa Indonesia, dan 'sangat luas' menyampaikan ukuran wilayah.
- source_word: וְכָל הַנָּשִׁים
  choice: semua perempuan
  rationale: Pilihan ini mempertahankan bentuk jamak umum dalam bahasa Ibrani; hubungan perkawinan dijelaskan oleh frasa berikutnya.
- source_word: יִתְּנוּ יְקָר
  choice: akan menghormati
  rationale: Idiom harfiahnya berarti 'memberikan kehormatan'. Dalam bahasa Indonesia modern, 'menghormati' menyampaikan makna itu secara alami tanpa mengurangi kekuatannya.
- source_word: לְבַעְלֵיהֶן
  choice: suami mereka
  rationale: Walaupun בַּעַל dapat berarti pemilik atau tuan, konteks rumah tangga bersama הַנָּשִׁים menuntut arti 'suami'.
- source_word: לְמִגָּדוֹל וְעַד קָטָן
  choice: dari yang berkedudukan tinggi sampai yang rendah
  rationale: Idiom ini mencakup seluruh rentang status sosial. Penambahan 'berkedudukan' memperjelas bahwa yang dimaksud bukan ukuran tubuh atau usia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Titah' mempertahankan suasana kerajaan tanpa terasa terlalu kuno. Tanda pisah mempertahankan klausa sisipan penjelas dalam bahasa Ibrani.
