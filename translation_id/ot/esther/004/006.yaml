  text: So Hathach went out to Mordecai[a], to the open square of the city that was in front of the king's gate.
translation:
  language: id
  text: Lalu Hatah keluar untuk menemui Mordekhai di lapangan kota[a] yang berada di depan gerbang raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "alun-alun kota"; istilah Ibrani ini menunjuk pada ruang terbuka publik yang luas di kota, tidak harus jalan dalam pengertian modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Lalu ... pergi
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi lampau. Dalam bahasa Indonesia, “lalu ... pergi” menyampaikan tindakan keluar menuju tempat yang disebutkan tanpa ungkapan yang kaku.
- source_word: הֲתָךְ
  choice: Hatah
  rationale: Nama Ibrani ditransliterasikan secara wajar ke dalam ejaan Indonesia; huruf akhir ךְ mewakili bunyi kh.
- source_word: אֶל מָרְדֳּכָי
  choice: menemui Mordekhai
  rationale: Preposisi אֶל menunjukkan arah atau tujuan. Dalam konteks seorang utusan yang mendatangi seseorang, “menemui” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan tujuannya.
- source_word: אֶל רְחוֹב הָעִיר
  choice: di lapangan kota
  rationale: רְחוֹב di sini menunjuk pada ruang publik perkotaan yang luas dan terbuka, bukan jalan dalam pengertian modern. “Lapangan kota” menyampaikan lokasi pertemuan secara alami.
- source_word: אֲשֶׁר לִפְנֵי
  choice: yang terletak di depan
  rationale: Frasa ini memperkenalkan klausa relatif yang menjelaskan letak lapangan tersebut. “Terletak di depan” jelas dan idiomatis dalam bahasa Indonesia modern.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: gerbang istana raja
  rationale: Secara harfiah frasa ini adalah “gerbang raja”. Dalam konteks kitab Ester, gerbang itu merupakan gerbang kompleks kerajaan; tambahan “istana” mencegah salah pengertian bahwa raja secara pribadi memiliki sebuah gerbang dan menghasilkan ungkapan Indonesia yang alami.
