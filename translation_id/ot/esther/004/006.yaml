translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan alur narasi serta keterangan lokasi dari teks Ibrani. Tidak diperlukan catatan kaki karena “lapangan kota” sudah mengungkapkan makna רְחוֹב dengan jelas.
