base_translation:
  language: en
  yaml_path: translation/ot/esther/004/010.yaml
  text: Then Esther spoke to Hathach and commanded him to go to Mordecai[a].
translation:
  language: id
  text: Lalu Ester berbicara kepada Hatah dan memerintahkannya untuk pergi kepada Mordekhai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Lalu Ester berkata kepada Hatah dan memerintahkannya kepada Mordekhai.” Bahasa Ibrani menyiratkan bahwa Ester menyuruh Hatah pergi kepada Mordekhai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berbicara
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sehingga diterjemahkan dengan “Lalu”. Verba אמר secara dasar berarti “berkata”, tetapi “berbicara kepada” terdengar alami sebelum penyebutan orang yang menerima perintah.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Nama diri ditransliterasikan menurut bentuk baku yang lazim dalam bahasa Indonesia.
- source_word: לַהֲתָךְ
  choice: kepada Hatah
  rationale: Preposisi ל menandai orang yang menjadi tujuan perkataan Ester; nama הֲתָךְ ditransliterasikan sebagai “Hatah”.
- source_word: וַתְּצַוֵּהוּ
  choice: dan memerintahkannya
  rationale: Bentuk piel dari צוה menyatakan pemberian perintah. Akhiran pronominal orang ketiga tunggal maskulin merujuk kepada Hatah.
- source_word: אֶל
  choice: untuk pergi kepada
  rationale: Preposisi ini secara harfiah berarti “kepada/ke arah”. Sesudah verba “memerintahkan”, bahasa Indonesia memerlukan pelengkap tindakan; “untuk pergi” merupakan penambahan kontekstual minimal yang membuat arah perintah itu jelas dan alami.
- source_word: מָרְדֳּכָי
  choice: Mordekhai
  rationale: Nama diri ditransliterasikan secara dekat dari bentuk Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan gerak naratif teks Ibrani, sementara frasa “untuk pergi” ditambahkan secara minimal agar konstruksi perintah berarah itu alami dalam bahasa Indonesia.
