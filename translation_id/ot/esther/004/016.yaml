  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֵךְ֩ כְּנ֨וֹס אֶת כָּל הַ/יְּהוּדִ֜ים הַֽ/נִּמְצְאִ֣ים בְּ/שׁוּשָׁ֗ן וְ/צ֣וּמוּ עָ֠לַ/י וְ/אַל תֹּאכְל֨וּ וְ/אַל תִּשְׁתּ֜וּ שְׁלֹ֤שֶׁת יָמִים֙ לַ֣יְלָה וָ/י֔וֹם גַּם אֲנִ֥י וְ/נַעֲרֹתַ֖/י אָצ֣וּם כֵּ֑ן וּ/בְ/כֵ֞ן אָב֤וֹא אֶל הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר לֹֽא כַ/דָּ֔ת וְ/כַ/אֲשֶׁ֥ר אָבַ֖דְתִּי אָבָֽדְתִּי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/016.yaml
  text: Go[a], gather all the Jews who are found in Susa, and fast for me. Do not eat or drink for three days[b], night and day. I and my young women also will fast in the same way. Then I will go to the king, though it is not according to the law; and if I perish[e][d][c], I perish.
translation:
  language: id
  text: “Pergilah, kumpulkanlah semua orang Yahudi yang berada di Susan[a], dan berpuasalah untukku[b]. Jangan makan atau minum selama tiga hari, baik malam maupun siang. Aku dan para dayangku[c] juga akan berpuasa demikian. Setelah itu, aku akan menghadap raja, meskipun hal itu tidak sesuai dengan hukum[d]. Kalau aku binasa, aku binasa[e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “semua orang Yahudi yang didapati” atau “yang hadir di Susan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berpuasalah demi aku” atau “berpuasalah untuk kepentinganku.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “para pelayan perempuanku” atau “para perempuan muda yang mendampingiku.”'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “bertentangan dengan hukum.”'
    reason: lexical_alternative
  - marker: e
    text: 'Atau: “Dan apabila aku binasa, aku binasa.” Ungkapan Ibraninya singkat dan tegas serta menyatakan kesediaan Ester menerima risiko.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ כְּנוֹס
  choice: Pergilah, kumpulkanlah
  rationale: Kedua bentuk imperatif diterjemahkan sebagai perintah langsung kepada Mordekhai. Partikel -lah menjaga nada tegas sekaligus wajar dalam bahasa Indonesia.
- source_word: כָּל הַיְּהוּדִים הַנִּמְצְאִים בְּשׁוּשָׁן
  choice: semua orang Yahudi yang berada di Susan
  rationale: Bentuk partisip הַנִּמְצְאִים berarti ‘yang didapati/berada/hadir’. ‘Yang berada’ menyampaikan cakupan kelompok itu secara alami tanpa menghilangkan nuansa keberadaan mereka di Susan.
- source_word: וְצוּמוּ עָלַי
  choice: dan berpuasalah untukku
  rationale: Preposisi עַל dengan pronomina orang pertama menunjukkan bahwa puasa itu dilakukan berkenaan dengan Ester atau demi kepentingannya. ‘Untukku’ ringkas dan alami.
- source_word: וְאַל תֹּאכְלוּ וְאַל תִּשְׁתּוּ
  choice: Jangan makan atau minum
  rationale: Dua larangan sejajar dipadukan secara idiomatis dengan ‘atau’ dalam kalimat negatif Indonesia, tanpa mengurangi cakupannya.
- source_word: שְׁלֹשֶׁת יָמִים לַיְלָה וָיוֹם
  choice: selama tiga hari, baik malam maupun siang
  rationale: Terjemahan ini mempertahankan durasi tiga hari dan penekanan bahwa puasa berlangsung pada malam maupun siang.
- source_word: גַּם אֲנִי וְנַעֲרֹתַי
  choice: Aku dan para dayangku juga
  rationale: Dalam lingkungan istana, נַעֲרוֹתַי menunjuk para perempuan muda yang melayani atau mendampingi Ester. ‘Para dayangku’ alami dalam konteks kerajaan dan tidak searkais ‘hamba-hamba perempuanku’.
- source_word: אָצוּם כֵּן
  choice: akan berpuasa demikian
  rationale: כֵּן merujuk kembali pada cara puasa yang baru dijelaskan. ‘Demikian’ mempertahankan rujukan itu secara ringkas.
- source_word: וּבְכֵן אָבוֹא אֶל הַמֶּלֶךְ
  choice: Setelah itu, aku akan menghadap raja
  rationale: וּבְכֵן menandai langkah yang menyusul sesudah puasa. Dalam konteks istana, ‘menghadap raja’ lebih alami daripada ‘pergi kepada raja’ dan tepat menggambarkan tindakan mendatangi raja.
- source_word: אֲשֶׁר לֹא כַדָּת
  choice: meskipun hal itu tidak sesuai dengan hukum
  rationale: Klausa ini menjelaskan bahwa tindakan Ester tidak mengikuti ketentuan hukum. ‘Meskipun’ menyampaikan hubungan konsesif yang tersirat oleh konteks.
- source_word: וְכַאֲשֶׁר אָבַדְתִּי אָבָדְתִּי
  choice: Kalau aku binasa, aku binasa
  rationale: Ungkapan singkat dengan pengulangan kata kerja dipertahankan untuk membawa ketegasan dan penerimaan Ester terhadap risikonya, tanpa menambahkan kepastian atau maksud teologis yang tidak dinyatakan.
theological_decisions:
- issue: Tingkat kepastian dalam pernyataan penutup Ester
  choice: Kalau aku binasa, aku binasa
  alternative: 'Dan apabila aku binasa, aku binasa; atau: Jika aku harus binasa, biarlah aku binasa'
  rationale: כַאֲשֶׁר dapat dipahami secara kondisional atau temporal dalam konteks ini, sedangkan pengulangan אָבַדְתִּי bersifat padat dan tegas. Terjemahan utama mempertahankan risiko yang diterima Ester tanpa memastikan bahwa kebinasaan pasti terjadi atau mengubah klausa kedua menjadi doa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan orang pertama ‘aku’ sesuai dengan dialog langsung dan kedekatan hubungan Ester dengan Mordekhai. Nama tempat ditulis ‘Susan’, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Struktur penutup sengaja dibuat ringkas untuk mempertahankan daya tekan teks Ibrani.
