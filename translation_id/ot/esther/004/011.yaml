revisions:
- from: '“Semua pegawai raja dan rakyat di provinsi-provinsi kerajaan tahu bahwa bagi setiap laki-laki atau perempuan yang menghadap raja di pelataran dalam tanpa dipanggil[a], hanya ada satu hukum: ia harus dihukum mati. Satu-satunya pengecualian ialah orang yang kepadanya raja mengulurkan tongkat kerajaan dari emas, sehingga ia tetap hidup. Namun, sudah tiga puluh hari ini aku tidak dipanggil untuk menghadap raja.”'
  to: '“Semua pegawai raja dan rakyat di provinsi-provinsi raja tahu bahwa bagi setiap laki-laki atau perempuan yang menghadap raja di pelataran dalam tanpa dipanggil[a], hanya ada satu hukum: ia harus dihukum mati, kecuali orang yang kepadanya raja mengulurkan tongkat emas, agar ia hidup. Namun, aku tidak dipanggil untuk menghadap raja selama tiga puluh hari ini.”'
  rationale: Revisi mempertahankan seluruh isi dan urutan logis teks sumber, sambil menghapus nuansa tambahan pada 'tetap hidup', membuat pengecualian lebih langsung, dan memakai padanan yang lebih alami untuk tongkat emas. Catatan kaki tetap ditambatkan pada 'dipanggil' dan menjelaskan nuansa protokol istana tanpa menambah makna pada teks utama.
