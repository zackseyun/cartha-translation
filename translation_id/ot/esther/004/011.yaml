source:
  edition: WLC
  text: כָּל עַבְדֵ֣י הַ/מֶּ֡לֶךְ וְ/עַם מְדִינ֨וֹת הַ/מֶּ֜לֶךְ יֽוֹדְעִ֗ים אֲשֶׁ֣ר כָּל אִ֣ישׁ וְ/אִשָּׁ֡ה אֲשֶׁ֣ר יָבֽוֹא אֶל הַ/מֶּלֶךְ֩ אֶל הֶ/חָצֵ֨ר הַ/פְּנִימִ֜ית אֲשֶׁ֣ר לֹֽא יִקָּרֵ֗א אַחַ֤ת דָּת/וֹ֙ לְ/הָמִ֔ית לְ֠/בַד מֵ/אֲשֶׁ֨ר יֽוֹשִׁיט ל֥/וֹ הַ/מֶּ֛לֶךְ אֶת שַׁרְבִ֥יט הַ/זָּהָ֖ב וְ/חָיָ֑ה וַ/אֲנִ֗י לֹ֤א נִקְרֵ֨אתי֙ לָ/ב֣וֹא אֶל הַ/מֶּ֔לֶךְ זֶ֖ה שְׁלוֹשִׁ֥ים יֽוֹם־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/011.yaml
  text: 'All the king’s servants and the people of the king’s provinces know that for any man or woman who goes to the king in the inner court without being summoned[a], there is one law for him: to be put to death, except for the one to whom the king extends the golden scepter, so that he may live. But as for me[b], I have not been summoned to go in to the king these thirty days.'
translation:
  language: id
  text: '“Semua pegawai raja dan rakyat di provinsi-provinsi raja tahu bahwa bagi setiap laki-laki atau perempuan yang menghadap raja di pelataran dalam tanpa dipanggil[a], hanya ada satu hukum: ia harus dihukum mati, kecuali orang yang kepadanya raja mengulurkan tongkat emas, agar ia hidup. Namun, aku tidak dipanggil untuk menghadap raja selama tiga puluh hari ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanpa dipanggil secara resmi.” Kata kerja pasif Ibrani menunjuk pada panggilan untuk masuk menghadap menurut tata cara istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: pegawai raja
  rationale: Dalam konteks istana Persia, frasa ini mencakup orang-orang yang bertugas dalam pelayanan raja; 'pegawai raja' lebih wajar daripada 'hamba' dan tidak menyiratkan status budak.
- source_word: וְעַם מְדִינוֹת הַמֶּלֶךְ
  choice: dan rakyat di provinsi-provinsi kerajaan
  rationale: Menunjuk kepada penduduk luas di seluruh wilayah administratif raja; 'provinsi' merupakan padanan baku bagi מְדִינָה dalam Kitab Ester.
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: setiap laki-laki atau perempuan
  rationale: Mempertahankan penyebutan eksplisit kedua jenis kelamin dan daya distributif כָּל.
- source_word: יָבוֹא אֶל הַמֶּלֶךְ אֶל הֶחָצֵר הַפְּנִימִית
  choice: menghadap raja di pelataran dalam
  rationale: Mengungkapkan tindakan mendatangi raja melalui area dalam istana yang aksesnya terbatas dengan bahasa Indonesia yang alami.
- source_word: אֲשֶׁר לֹא יִקָּרֵא
  choice: tanpa dipanggil
  rationale: Bentuk pasif קרא menyatakan bahwa orang itu tidak menerima panggilan resmi; 'dipanggil' mempertahankan bentuk sumber, sedangkan catatan menjelaskan nuansa protokol istana.
- source_word: אַחַת דָּתוֹ
  choice: hanya ada satu hukum
  rationale: Mempertahankan idiom Ibrani tentang satu ketentuan tetap, tanpa mengaburkan bahwa akibat hukumnya dijelaskan sesudahnya.
- source_word: לְהָמִית
  choice: ia harus dihukum mati
  rationale: Infinitif ini menyatakan hukuman yang dijatuhkan, bukan sekadar kematian alami.
- source_word: לְבַד מֵאֲשֶׁר
  choice: satu-satunya pengecualian ialah orang yang
  rationale: Menegaskan bahwa penguluran tongkat kerajaan merupakan satu-satunya pengecualian terhadap ketentuan tersebut.
- source_word: יוֹשִׁיט לוֹ
  choice: mengulurkan
  rationale: Hifil dari יָשַׁט menggambarkan raja mengulurkan tongkat ke arah orang itu.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: tongkat kerajaan dari emas
  rationale: '''Tongkat kerajaan'' menyampaikan fungsi seremonial dan lambang kewenangan benda tersebut; ''dari emas'' menyatakan bahannya secara jelas.'
- source_word: וְחָיָה
  choice: sehingga ia tetap hidup
  rationale: 'Menyatakan hasil dari perkenanan raja: orang tersebut tidak jadi menjalani hukuman mati.'
- source_word: זֶה שְׁלוֹשִׁים יוֹם
  choice: sudah tiga puluh hari ini
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan bahwa keadaan tersebut telah berlangsung selama tiga puluh hari hingga saat berbicara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum serta istana dibuat jelas bagi pembaca umum tanpa menghilangkan susunan sebab, ketentuan, pengecualian, dan kekhawatiran Ester dalam teks Ibrani.
