  terminology: '''Pegawai raja'', ''pelataran dalam'', ''dipanggil'', dan ''dihukum mati'' sesuai dengan register istana dan hukum. ''Tongkat emas'' menerjemahkan שַׁרְבִיט הַזָּהָב secara langsung; konteksnya sudah cukup menunjukkan bahwa ini adalah lambang perkenanan raja.'
