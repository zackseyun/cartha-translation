  text: So Hathach came and told Esther the words of Mordecai[a].
translation:
  language: id
  text: Lalu Hatah datang dan menyampaikan kepada Ester kata-kata Mordekhai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesan Mordekhai” atau “apa yang dikatakan Mordekhai.” Secara harfiah, teks Ibrani berbunyi “kata-kata Mordekhai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: kembali
  rationale: Kata בוא pada dasarnya berarti 'datang/pergi'. Dalam konteks ini Hatah datang kembali kepada Ester setelah menemui Mordekhai; 'kembali' menyatakan arah narasi secara alami tanpa perlu menerjemahkannya secara kaku sebagai 'datang'.
- source_word: הֲתָךְ
  choice: Hatah
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַיַּגֵּד
  choice: menyampaikan
  rationale: Bentuk Hifil dari נגד berarti 'memberitahukan, menceritakan, melaporkan'. 'Menyampaikan' alami ketika seseorang membawa perkataan atau pesan kepada orang lain.
- source_word: לְאֶסְתֵּר
  choice: kepada Ester
  rationale: Preposisi לְ menandai penerima pemberitahuan dan secara alami diterjemahkan 'kepada'.
- source_word: אֵת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya terwakili oleh susunan kalimat.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Bentuk konstruksi jamak dari דָּבָר secara harfiah berarti 'perkataan-perkataan/kata-kata'. 'Perkataan' mempertahankan kedekatan dengan bentuk Ibrani dan tetap alami; dalam konteks ini dapat pula dipahami sebagai pesan atau apa yang dikatakan.
- source_word: מָרְדֳּכָי
  choice: Mordekhai
  rationale: Nama pribadi ditransliterasikan dengan bentuk Indonesia yang mencerminkan konsonan akhir Ibrani.
