  text: Then Mordecai said to reply to Esther, “Do not imagine that you alone of all the Jews will escape in the king’s house.
translation:
  language: id
  text: Lalu Mordekhai menyuruh orang menjawab Ester, “Jangan mengira bahwa di istana raja engkau akan lolos, sedangkan semua orang Yahudi lainnya tidak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מָרְדֳּכַי לְהָשִׁיב
  choice: Lalu Mordekhai menyuruh orang menjawab
  rationale: Secara harfiah konstruksi ini berbunyi ‘Mordekhai berkata untuk menjawab’, tetapi dalam konteks komunikasi melalui perantara, ungkapan Indonesia ini menyampaikan fungsi kausatif/praktisnya secara alami tanpa menambahkan identitas pembawa pesan.
- source_word: אַל תְּדַמִּי בְנַפְשֵׁךְ
  choice: Jangan mengira
  rationale: Ungkapan idiomatis Ibrani ‘jangan membayangkan dalam jiwamu’ secara wajar berarti ‘jangan mengira’ atau ‘jangan berpikir dalam hati’.
- source_word: לְהִמָּלֵט
  choice: akan luput
  rationale: Infinitif nifal ini menyatakan lolos atau terhindar dari bahaya; ‘luput’ sesuai dengan ancaman pembinasaan dalam konteks.
- source_word: בֵּית הַמֶּלֶךְ
  choice: di istana raja
  rationale: Secara harfiah ‘rumah raja’; dalam konteks kediaman dan lingkungan kerajaan, padanan alami bahasa Indonesia ialah ‘istana raja’.
- source_word: מִכָּל הַיְּהוּדִים
  choice: tidak seperti semua orang Yahudi lainnya
  rationale: מִן komparatif menyatakan bahwa Ester tidak akan memiliki peluang lolos yang lebih besar daripada orang Yahudi lain. Rumusan ini mempertahankan perbandingan tersebut dan menghindari kesan keliru bahwa ia satu-satunya orang Yahudi yang akan luput.
theological_decisions:
- issue: Apakah kedudukan Ester di istana menjamin keselamatannya
  choice: Teks menyatakan bahwa keberadaannya di istana tidak membuatnya luput berbeda dari orang Yahudi lainnya.
  alternative: ‘Engkau sendiri dari antara semua orang Yahudi akan luput di istana raja.’
  rationale: Bentuk alternatif dapat terdengar seolah-olah Mordekhai sedang menyebut kemungkinan Ester menjadi satu-satunya yang selamat, padahal larangan dan frasa komparatif Ibrani menolak anggapan bahwa istana memberinya pengecualian atau keuntungan keselamatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ‘Mordekhai’ mengikuti transliterasi yang lebih dekat dengan bentuk Ibrani. Tuturan memakai ‘engkau’ agar selaras dengan register naratif Kitab Suci.
