  text: And they told Mordecai Esther’s words[a].
translation:
  language: id
  text: Lalu mereka menyampaikan kepada Mordekhai perkataan Ester.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pesan Ester" atau "jawaban Ester".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: Lalu mereka menyampaikan
  rationale: Bentuk Hifil wayyiqtol dari נגד melanjutkan rangkaian narasi dan memiliki subjek jamak yang tidak disebutkan. 'Menyampaikan' wajar dalam konteks pembawa pesan serta tidak seformal 'memberitahukan' atau 'melaporkan'.
- source_word: לְמָרְדֳּכָי
  choice: kepada Mordekhai
  rationale: Preposisi לְ menandai penerima atau objek tak langsung, sehingga diterjemahkan secara eksplisit dengan 'kepada'. Nama tersebut ditransliterasikan sebagai 'Mordekhai', bentuk yang mencerminkan konsonan Ibrani dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: אֵת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan fungsinya sudah terwakili oleh susunan kalimat bahasa Indonesia.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Bentuk konstruksi jamak dari דָּבָר dapat berarti 'perkataan', 'pesan', atau secara kontekstual 'jawaban'. 'Perkataan' paling dekat dengan bentuk sumber dan mempertahankan rujukan kepada apa yang Ester katakan.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Nama pribadi ini mengikuti bentuk yang lazim dalam bahasa Indonesia. Hubungan konstruksi dengan דִּבְרֵי dinyatakan secara alami melalui urutan 'perkataan Ester'.
