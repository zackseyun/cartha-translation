  source_fidelity: 'Terjemahan dengan setia menyampaikan urutan tindakan dalam teks Ibrani: Ester memanggil Hatakh, seorang sida-sida raja yang ditugaskan untuk melayaninya; kemudian ia memberi perintah berkaitan dengan Mordekhai agar diketahui apa yang terjadi dan alasannya. Subjek tersirat dari “telah ditugaskan” secara wajar dijelaskan sebagai raja. Perincian pertanyaan “apa yang sedang terjadi dan mengapa hal itu terjadi” menangkap perbedaan antara מַה זֶּה dan וְעַל מַה זֶּה tanpa penafsiran berlebihan.'
