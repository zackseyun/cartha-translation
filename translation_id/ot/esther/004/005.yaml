  text: וַ/תִּקְרָא֩ אֶסְתֵּ֨ר לַ/הֲתָ֜ךְ מִ/סָּרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר הֶעֱמִ֣יד לְ/פָנֶ֔י/הָ וַ/תְּצַוֵּ֖/הוּ עַֽל מָרְדֳּכָ֑י לָ/דַ֥עַת מַה זֶּ֖ה וְ/עַל מַה זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/005.yaml
  text: Then Esther called for Hathach[a], one of the king’s eunuchs, whom he had appointed to attend her, and commanded him concerning Mordecai, to learn what this was and why it was.
translation:
  language: id
  text: 'Lalu Ester memanggil Hatakh[a], salah seorang sida-sida raja yang telah ditugaskan raja untuk melayaninya. Ester memerintahkannya untuk mencari tahu tentang Mordekhai: apa yang sedang terjadi dan mengapa hal itu terjadi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “salah seorang pejabat istana raja.” Istilah Ibraninya dapat secara khusus berarti sida-sida atau, dalam konteks tertentu, pejabat kerajaan secara lebih umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא
  choice: Lalu Ester memanggil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” alami dalam bahasa Indonesia, sedangkan “memanggil” menyampaikan tindakan menyuruh seseorang datang.
- source_word: לַהֲתָךְ
  choice: Hatakh
  rationale: Nama Ibrani ditransliterasikan secara langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: מִסָּרִיסֵי הַמֶּלֶךְ
  choice: salah seorang sida-sida raja
  rationale: סָרִיס lazimnya menunjuk kepada sida-sida dalam lingkungan istana, walaupun dapat pula berarti pejabat istana secara lebih umum; alternatif itu dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר הֶעֱמִיד לְפָנֶיהָ
  choice: yang telah ditugaskan raja untuk melayaninya
  rationale: Subjek tersirat paling alami adalah raja. Ungkapan ini menyampaikan penugasan resmi untuk hadir dan melayani Ester tanpa mengikuti idiom Ibrani secara kaku.
- source_word: וַתְּצַוֵּהוּ עַל מָרְדֳּכָי
  choice: Ester memerintahkannya untuk mencari tahu tentang Mordekhai
  rationale: “Memerintahkan” mempertahankan kekuatan צוה, sedangkan עַל מָרְדֳּכָי menyatakan perkara yang harus diselidiki. Subjek “Ester” diulang demi kejelasan rujukan dalam bahasa Indonesia.
- source_word: לָדַעַת
  choice: untuk mencari tahu
  rationale: Infinitif ini menyatakan tujuan penyelidikan; “mencari tahu” lebih alami daripada “mengetahui” dalam konteks pengutusan seorang pelayan.
- source_word: מַה זֶּה
  choice: apa yang sedang terjadi
  rationale: Ungkapan terbuka ini menanyakan hakikat keadaan yang tampak pada Mordekhai; bentuk Indonesia ini jelas tanpa membatasi pertanyaan hanya pada makna simbolis.
- source_word: וְעַל מַה זֶּה
  choice: dan mengapa hal itu terjadi
  rationale: עַל מַה secara idiomatis menanyakan alasan atau sebab. Terjemahan ini mempertahankan perbedaan antara pertanyaan tentang apa yang terjadi dan mengapa itu terjadi.
