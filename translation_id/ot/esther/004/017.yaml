  text: So Mordecai went away and did according to all that Esther had commanded him[a].
translation:
  language: id
  text: Lalu Mordekhai pergi dan melakukan segala yang diperintahkan Ester kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “beranjak” atau “melintas”. Kata Ibrani ini secara harfiah berarti “melewati/melintas”, tetapi di sini kemungkinan menunjuk pada kepergian Mordekhai untuk melakukan apa yang diperintahkan Ester.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: pergi
  rationale: Kata kerja עבר secara harfiah dapat berarti ‘melewati’ atau ‘melintas’, tetapi dalam konteks narasi ini kemungkinan menunjukkan bahwa Mordekhai beranjak untuk melaksanakan petunjuk Ester. ‘Pergi’ alami dalam bahasa Indonesia tanpa menentukan arah atau tempat yang tidak disebutkan.
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja umum עשה berarti ‘melakukan/membuat’. Di sini ‘melakukan’ mempertahankan gaya narasi yang lugas dan sesuai dengan tindakan menaati perintah.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Ungkapan ini menyatakan kesesuaian menyeluruh dengan perintah Ester. Dalam konstruksi Indonesia, ‘melakukan segala yang ...’ secara alami menyampaikan baik gagasan ‘sesuai dengan’ maupun cakupan כֹּל.
- source_word: צִוְּתָה
  choice: diperintahkan
  rationale: Kata צוה berarti ‘memerintahkan’. Bentuk pasif dalam konstruksi ‘segala yang diperintahkan Ester kepadanya’ alami dan tetap mempertahankan Ester sebagai pemberi perintah.
- source_word: עָלָיו
  choice: kepadanya
  rationale: Dengan צוה, preposisi על menandai orang yang menerima perintah. ‘Kepadanya’ adalah padanan Indonesia yang idiomatis.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Nama ini memakai bentuk baku yang lazim dalam bahasa Indonesia.
