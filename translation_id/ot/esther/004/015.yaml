  text: Then Esther told them to reply to Mordecai:[a]
translation:
  language: id
  text: Lalu Ester menyuruh agar jawaban disampaikan kepada Mordekai:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Lalu Ester berkata untuk menjawab kepada Mordekai.” Ungkapan ini berarti bahwa ia menyuruh agar jawaban dikirim kembali kepada Mordekai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... menyuruh
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. Dalam konstruksi dengan infinitif לְהָשִׁיב, 'menyuruh' mengungkapkan bahwa Ester memberikan instruksi agar jawaban disampaikan.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לְהָשִׁיב
  choice: menyampaikan jawaban
  rationale: Infinitif Hifil dari שוב secara harfiah menyatakan tindakan membuat sesuatu kembali; dalam konteks komunikasi, maknanya ialah mengirimkan atau menyampaikan jawaban kembali.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah atau penerima jawaban, dan secara alami diterjemahkan 'kepada'.
- source_word: מָרְדֳּכָי
  choice: Mordekai
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
