  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י אִם הַחֲרֵ֣שׁ תַּחֲרִישִׁי֮ בָּ/עֵ֣ת הַ/זֹּאת֒ רֶ֣וַח וְ/הַצָּלָ֞ה יַעֲמ֤וֹד לַ/יְּהוּדִים֙ מִ/מָּק֣וֹם אַחֵ֔ר וְ/אַ֥תְּ וּ/בֵית אָבִ֖י/ךְ תֹּאבֵ֑דוּ וּ/מִ֣י יוֹדֵ֔עַ אִם לְ/עֵ֣ת כָּ/זֹ֔את הִגַּ֖עַתְּ לַ/מַּלְכֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/014.yaml
  text: For if you remain silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father's house will perish. And who knows whether you have come to your royal position for a time like this?
translation:
  language: id
  text: Sebab jika engkau tetap diam pada saat ini, kelegaan dan pembebasan akan datang bagi orang-orang Yahudi dari tempat lain, tetapi engkau dan keluarga ayahmu akan binasa. Siapa tahu, untuk saat seperti inilah engkau telah mencapai kedudukan sebagai ratu?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Mempertahankan fungsi penjelas sekaligus bersyarat dari ungkapan Ibrani dan menghubungkannya dengan ayat sebelumnya.
- source_word: הַחֲרֵשׁ תַּחֲרִישִׁי
  choice: engkau tetap diam
  rationale: Konstruksi infinitif absolut menguatkan tindakan berdiam diri; 'tetap diam' menyampaikan pilihan untuk terus tidak bersuara secara alami.
- source_word: בָּעֵת הַזֹּאת
  choice: pada saat ini
  rationale: Merujuk pada masa krisis yang sedang berlangsung dengan ungkapan Indonesia yang jelas dan wajar.
- source_word: רֶוַח וְהַצָּלָה
  choice: kelegaan dan pembebasan
  rationale: '''Kelegaan'' menyampaikan kelonggaran dari tekanan, sedangkan ''pembebasan'' menyampaikan penyelamatan dari ancaman kebinasaan tanpa meleburkan kedua nomina.'
- source_word: יַעֲמוֹד
  choice: akan datang
  rationale: Walaupun arti dasarnya 'berdiri', dalam konteks ini verba tersebut menyatakan muncul atau tersedianya pertolongan; 'akan datang' alami dalam bahasa Indonesia.
- source_word: לַיְּהוּדִים
  choice: bagi orang-orang Yahudi
  rationale: Dalam Kitab Ester istilah ini menunjuk kepada bangsa Yahudi dalam diaspora Persia.
- source_word: מִמָּקוֹם אַחֵר
  choice: dari tempat lain
  rationale: Mempertahankan ketidakpastian sumber pertolongan dalam teks Ibrani dan tidak menyebut Allah secara eksplisit.
- source_word: וְאַתְּ וּבֵית אָבִיךְ
  choice: tetapi engkau dan keluarga ayahmu
  rationale: '''Keluarga ayahmu'' menyampaikan ungkapan kekerabatan Ibrani tentang rumah tangga atau garis keluarga pihak ayah secara jelas bagi pembaca modern.'
- source_word: תֹּאבֵדוּ
  choice: akan binasa
  rationale: Mencakup nuansa kematian maupun kehancuran dalam peringatan yang khidmat ini.
- source_word: וּמִי יוֹדֵעַ אִם
  choice: Dan siapa tahu, apakah
  rationale: Mempertahankan bentuk retoris dan ketidakpastian yang disengaja, tanpa mengubahnya menjadi pernyataan pasti tentang maksud ilahi.
- source_word: הִגַּעַתְּ לַמַּלְכוּת
  choice: engkau telah mencapai kedudukan sebagai ratu
  rationale: Menyatakan sampainya Ester pada kedudukan kerajaan secara alami dan jelas dalam konteks, tanpa ungkapan kaku seperti 'mencapai kerajaan'.
theological_decisions:
- issue: Penyelenggaraan ilahi yang tersirat dalam 'dari tempat lain' dan 'untuk saat seperti ini'
  choice: Mempertahankan bahasa tidak langsung tanpa menyebut Allah secara eksplisit
  alternative: Menjelaskan bahwa pertolongan akan datang dari Allah atau bahwa Ester ditempatkan sebagai ratu oleh penyelenggaraan Allah
  rationale: Ayat ini kuat menyiratkan penyelenggaraan ilahi, tetapi teks Ibrani tidak menyebut Allah. Terjemahan menjaga ketegangan teologis dan keterbukaan retoris sumber.
- issue: Kepastian tujuan Ester menjadi ratu
  choice: Mempertahankan pertanyaan terbuka dengan 'siapa tahu, apakah'
  alternative: Menyatakan bahwa Ester pasti menjadi ratu khusus untuk krisis ini
  rationale: Ungkapan וּמִי יוֹדֵעַ אִם menyampaikan kemungkinan, bukan kepastian yang dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' yang sesuai dengan percakapan langsung dan bernada khidmat. Susunan kalimat dijaga dekat dengan alur retoris Ibrani, tetapi dibuat alami bagi pembaca umum.
