  to: Sebab jika engkau tetap diam pada saat ini, kelegaan dan pembebasan akan datang bagi orang-orang Yahudi dari tempat lain, tetapi engkau dan keluarga ayahmu akan binasa. Siapa tahu, untuk saat seperti inilah engkau telah mencapai kedudukan sebagai ratu?
