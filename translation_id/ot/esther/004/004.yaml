base_translation:
  language: en
  yaml_path: translation/ot/esther/004/004.yaml
  text: Esther’s young women and her eunuchs came and told her[a], and the queen was greatly distressed. She sent garments to clothe Mordecai and to remove his sackcloth from him[c][b], but he did not accept them.
translation:
  language: id
  text: Para pelayan perempuan Ester dan para sida-sidanya datang lalu memberitahukan hal itu kepadanya. Sang ratu pun sangat terguncang. Ia mengirim pakaian agar Mordekhai mengenakannya dan menanggalkan kain kabungnya[a], tetapi Mordekhai tidak mau menerimanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kain kabung ialah kain kasar yang dikenakan sebagai tanda perkabungan, kesedihan, atau kehinaan.
    reason: cultural_note
lexical_decisions:
- source_word: נַעֲרוֹת אֶסְתֵּר
  choice: para pelayan perempuan Ester
  rationale: Dalam lingkungan istana, bentuk jamak נַעֲרוֹת menunjuk pada perempuan-perempuan muda yang melayani Ester. Pilihan ini menyampaikan fungsi mereka secara alami tanpa memakai istilah yang kuno.
- source_word: וְסָרִיסֶיהָ
  choice: dan para sida-sidanya
  rationale: סָרִיס dalam konteks istana paling mungkin berarti laki-laki yang dikebiri dan bertugas di lingkungan kerajaan. 'Sida-sida' mempertahankan pengertian historis yang spesifik, meskipun kata itu kadang juga dapat berarti pejabat istana.
- source_word: וַיַּגִּידוּ לָהּ
  choice: lalu memberitahukan hal itu kepadanya
  rationale: Kata kerja ini menyatakan pelaporan kepada Ester. 'Hal itu' melengkapi objek yang tersirat dalam bahasa Ibrani dan merujuk pada keadaan Mordekhai yang baru diketahui para pelayannya.
- source_word: וַתִּתְחַלְחַל ... מְאֹד
  choice: sangat terguncang
  rationale: Ungkapan ini menggambarkan keguncangan atau keresahan yang hebat. 'Sangat terguncang' mempertahankan intensitasnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: בְּגָדִים
  choice: pakaian
  rationale: '''Pakaian'' merupakan padanan modern dan bermartabat yang sesuai dengan konteks, tanpa kekakuan yang tidak perlu.'
- source_word: לְהַלְבִּישׁ אֶת מָרְדֳּכַי
  choice: untuk dikenakan kepada Mordekhai
  rationale: Infinitif ini menyatakan tujuan pengiriman pakaian, yakni agar Mordekhai dipakaikan pakaian tersebut sebagai pengganti kain kabungnya.
- source_word: וּלְהָסִיר שַׂקּוֹ מֵעָלָיו
  choice: dan untuk menanggalkan kain kabungnya
  rationale: Terjemahan ini mempertahankan tindakan konkret melepas kain kabung dari Mordekhai sekaligus menghasilkan susunan Indonesia yang alami.
- source_word: וְלֹא קִבֵּל
  choice: tetapi Mordekhai tidak mau menerimanya
  rationale: Subjek dan objek yang tersirat dijelaskan demi kelancaran. 'Tidak mau menerima' menyampaikan penolakan, bukan sekadar kegagalan untuk menerima.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Sebutan 'sang ratu' menandai peralihan dari Ester sebagai pribadi kepada kedudukannya sebagai ratu. Istilah budaya 'sida-sida' dan 'kain kabung' dipertahankan karena tepat secara historis; istilah kedua dijelaskan dalam catatan kaki.
