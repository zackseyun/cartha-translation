base_translation:
  language: en
  yaml_path: translation/ot/esther/004/007.yaml
  text: Mordecai told him everything that had happened to him[a], and the exact amount of money that Haman had said he would weigh out into the king’s treasuries for the destruction of the Jews.
translation:
  language: id
  text: Mordekhai memberitahukan kepada Hatah segala yang telah menimpanya, serta jumlah uang yang tepat yang Haman katakan akan ia timbang untuk dimasukkan ke dalam perbendaharaan raja untuk membinasakan orang Yahudi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ
  choice: memberitahukan kepada Hatah
  rationale: Bentuk Hifil dari נגד berarti membuat diketahui atau memberitahukan. Nama Hatah, yang menjadi acuan pronomina dalam konteks, dinyatakan agar rujukannya jelas dalam bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר קָרָהוּ
  choice: segala yang telah menimpanya
  rationale: Ungkapan ini mencakup semua yang terjadi atas Mordekhai; 'menimpanya' mempertahankan sufiks objek dan cocok dengan kemalangan yang sedang diceritakan.
- source_word: פָּרָשַׁת הַכֶּסֶף
  choice: jumlah tepat uang
  rationale: פָּרָשָׁה di sini menunjuk pada rincian atau jumlah yang telah ditentukan, yakni jumlah yang disebutkan Haman dalam Ester 3:9.
- source_word: אָמַר הָמָן לִשְׁקוֹל
  choice: yang dikatakan Haman akan ditimbangnya
  rationale: Terjemahan ini mempertahankan unsur perkataan serta gambaran konkret pembayaran logam berdasarkan berat.
- source_word: עַל גִּנְזֵי הַמֶּלֶךְ
  choice: untuk dimasukkan ke dalam perbendaharaan raja
  rationale: Frasa tersebut menggambarkan uang yang disetorkan ke tempat penyimpanan harta kerajaan; bentuk tunggal kolektif 'perbendaharaan' alami dalam bahasa Indonesia.
- source_word: ביהודיים לְאַבְּדָם
  choice: sebagai imbalan untuk membinasakan orang Yahudi
  rationale: Frasa ini menyatakan kaitan pembayaran dengan tindakan yang ditujukan kepada orang Yahudi. 'Sebagai imbalan untuk' membuat hubungan transaksional dalam konteks jelas tanpa mengubah sasaran tindakan.
