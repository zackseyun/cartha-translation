revisions:
- from: Mordekhai memberitahukan kepada Hatah segala yang telah menimpanya dan jumlah tepat uang yang dikatakan Haman akan ditimbangnya untuk dimasukkan ke dalam perbendaharaan raja sebagai imbalan untuk membinasakan orang Yahudi.
  to: Mordekhai memberitahukan kepada Hatah segala yang telah menimpanya, serta jumlah uang yang tepat yang Haman katakan akan ia timbang untuk dimasukkan ke dalam perbendaharaan raja untuk membinasakan orang Yahudi.
  rationale: Revisi menghapus tambahan interpretatif "sebagai imbalan" sambil mempertahankan hubungan antara pembayaran yang dijanjikan Haman dan pembinasaan orang Yahudi. Revisi juga memperbaiki kelaziman frasa Indonesia tanpa mengurangi unsur "jumlah yang tepat" dan tindakan konkret menimbang uang.
