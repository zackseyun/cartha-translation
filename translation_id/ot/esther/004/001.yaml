  to: Ketika Mordekhai mengetahui segala yang telah dilakukan, ia mengoyakkan pakaiannya dan mengenakan kain kabung serta abu. Lalu ia keluar ke tengah kota dan berseru dengan seruan yang nyaring dan pedih.[a]
