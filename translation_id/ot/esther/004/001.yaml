  text: וּ/מָרְדֳּכַ֗י יָדַע֙ אֶת כָּל אֲשֶׁ֣ר נַעֲשָׂ֔ה וַ/יִּקְרַ֤ע מָרְדֳּכַי֙ אֶת בְּגָדָ֔י/ו וַ/יִּלְבַּ֥שׁ שַׂ֖ק וָ/אֵ֑פֶר וַ/יֵּצֵא֙ בְּ/ת֣וֹךְ הָ/עִ֔יר וַ/יִּזְעַ֛ק זְעָקָ֥ה גְדֹלָ֖ה וּ/מָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/001.yaml
  text: When Mordecai learned all that had been done[a], Mordecai tore his clothes and put on sackcloth and ashes. Then he went out into the midst of the city and cried out with a great and bitter cry.
translation:
  language: id
  text: Ketika Mordekhai mengetahui segala yang telah dilakukan, ia mengoyakkan pakaiannya dan mengenakan kain kabung serta abu. Lalu ia keluar ke tengah kota dan berseru dengan seruan yang nyaring dan pedih.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berseru suatu seruan yang besar dan pahit.” Bahasa Ibrani memakai kata kerja dan kata benda yang serumpun untuk memberi penekanan.'
    reason: Menjelaskan penegasan melalui verba dan nomina serumpun dalam bahasa Ibrani serta memberi padanan yang lebih dekat untuk kata sifatnya.
lexical_decisions:
- source_word: יָדַע
  choice: mengetahui
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa Mordekhai telah memperoleh pengetahuan tentang tindakan dan ketetapan yang baru terjadi. Bahasa Indonesia secara alami memakai 'mengetahui' tanpa harus menambahkan cara ia memperoleh kabar itu.
- source_word: כָּל אֲשֶׁר נַעֲשָׂה
  choice: segala yang telah dilakukan
  rationale: Pilihan ini mempertahankan bentuk pasif Ibrani dan urutan waktu narasi, tanpa mengubahnya menjadi ungkapan yang lebih umum seperti 'segala yang telah terjadi'.
- source_word: וַיִּקְרַע ... אֶת־בְּגָדָיו
  choice: mengoyakkan pakaiannya
  rationale: Ungkapan ini menyampaikan tindakan perkabungan secara jelas dalam bahasa Indonesia modern dan tetap dekat dengan bentuk sumber.
- source_word: שַׂק וָאֵפֶר
  choice: kain kabung serta abu
  rationale: Pasangan istilah ini dipertahankan sebagai lambang perkabungan dan perendahan diri. 'Serta' membuat rangkaian benda yang dikenakan terdengar sedikit lebih alami tanpa menentukan tindakan terhadap abu yang tidak dijelaskan oleh teks.
- source_word: בְּתוֹךְ הָעִיר
  choice: ke tengah kota
  rationale: Terjemahan ini mempertahankan arah gerak dan makna spasial בְּתוֹךְ, tanpa menafsirkannya secara khusus sebagai pusat administratif kota.
- source_word: וַיִּזְעַק זְעָקָה גְדֹלָה וּמָרָה
  choice: menjerit dengan jeritan yang nyaring dan pedih
  rationale: Kata kerja dan nomina serumpun dipertahankan untuk membawa penekanan bentuk Ibrani. Dalam konteks suara, גְדֹלָה paling alami disampaikan sebagai 'nyaring', sedangkan 'pedih' mengungkapkan kepahitan emosional מָרָה secara wajar.
- source_word: וַ
  choice: lalu
  rationale: Kata ini secara alami menandai kelanjutan rangkaian tindakan dalam narasi Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Istilah tradisional 'kain kabung' dipertahankan karena merupakan sebutan baku bagi pakaian perkabungan dalam konteks Alkitab. Pengulangan nama Mordekhai pada sumber dialihkan menjadi pronomina 'ia' agar narasi alami dalam bahasa Indonesia tanpa mengubah pelaku.
