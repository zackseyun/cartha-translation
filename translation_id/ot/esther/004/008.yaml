translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mempertahankan rangkaian tujuan dalam teks Ibrani, tetapi objek tersirat dijelaskan seperlunya agar mudah dipahami. Istilah istana 'menghadap raja' dan 'mengajukan permohonan di hadapannya' mempertahankan suasana resmi tanpa memakai ungkapan yang kaku.
