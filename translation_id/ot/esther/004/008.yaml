source:
  edition: WLC
  text: וְ/אֶת פַּתְשֶׁ֣גֶן כְּתָֽב הַ֠/דָּת אֲשֶׁר נִתַּ֨ן בְּ/שׁוּשָׁ֤ן לְ/הַשְׁמִידָ/ם֙ נָ֣תַן ל֔/וֹ לְ/הַרְא֥וֹת אֶת אֶסְתֵּ֖ר וּ/לְ/הַגִּ֣יד לָ֑/הּ וּ/לְ/צַוּ֣וֹת עָלֶ֗י/הָ לָ/ב֨וֹא אֶל הַ/מֶּ֧לֶךְ לְ/הִֽתְחַנֶּן ל֛/וֹ וּ/לְ/בַקֵּ֥שׁ מִ/לְּ/פָנָ֖י/ו עַל עַמָּֽ/הּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/004/008.yaml
  text: He also gave him a copy[a] of the written decree issued in Susa for their destruction, to show it to Esther and explain it to her, and to charge her to go to the king, implore his favor, and plead before him on behalf of her people.
translation:
  language: id
  text: Ia juga memberikan kepadanya salinan[a] ketetapan tertulis yang dikeluarkan di Susan untuk memusnahkan mereka, untuk memperlihatkannya kepada Ester dan menjelaskannya kepadanya, serta untuk menyuruhnya menghadap raja, memohon kemurahannya, dan mengajukan permohonan di hadapannya demi bangsanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata serapan Persia yang diterjemahkan “salinan” juga dapat merujuk pada teks sebuah dokumen resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְשֶׁגֶן כְּתָב
  choice: salinan surat ketetapan
  rationale: Kata serapan Persia פַּתְשֶׁגֶן dapat menunjuk pada salinan atau teks suatu dokumen resmi. Frasa ini diterjemahkan secara alami dalam bahasa Indonesia, sementara cakupan maknanya dicatat dalam catatan kaki.
- source_word: הַדָּת
  choice: surat ketetapan
  rationale: Dalam konteks istana Persia di kitab Ester, kata ini menunjuk pada ketetapan resmi kerajaan; 'surat ketetapan' sesuai dengan dokumen tertulis yang diumumkan di Susan.
- source_word: נִתַּן
  choice: dikeluarkan
  rationale: Dalam konteks administratif, bentuk pasif ini menyatakan bahwa ketetapan tersebut telah diterbitkan atau diberlakukan secara resmi.
- source_word: בְּשׁוּשָׁן
  choice: di Susan
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan keterangan tempat sumber.
- source_word: לְהַשְׁמִידָם
  choice: untuk memusnahkan mereka
  rationale: Infinitif dengan akhiran pronominal menyatakan tujuan atau isi ketetapan tersebut dan mempertahankan maksud pemusnahannya secara langsung.
- source_word: לְהַרְאוֹת אֶת אֶסְתֵּר וּלְהַגִּיד לָהּ
  choice: supaya salinan itu diperlihatkan kepada Ester dan dijelaskan kepadanya
  rationale: Objek dokumen dinyatakan kembali agar hubungan antarklausa jelas dalam bahasa Indonesia. הִגִּיד di sini berarti memberitahukan atau menjelaskan isi dokumen kepada Ester.
- source_word: וּלְצַוּוֹת עָלֶיהָ
  choice: serta supaya disampaikan perintah kepadanya
  rationale: Terjemahan ini mempertahankan daya perintah צוה sekaligus memperjelas bahwa pesan Mordekhai disampaikan kepada Ester melalui utusan.
- source_word: לָבוֹא אֶל הַמֶּלֶךְ
  choice: agar menghadap raja
  rationale: '''Menghadap raja'' merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks akses resmi ke hadapan penguasa.'
- source_word: לְהִתְחַנֶּן לוֹ
  choice: memohon belas kasihan raja
  rationale: Bentuk ini menyatakan permohonan sungguh-sungguh untuk memperoleh kemurahan atau belas kasihan; penyebutan 'raja' memperjelas rujukan pronomina.
- source_word: וּלְבַקֵּשׁ מִלְּפָנָיו עַל עַמָּהּ
  choice: dan mengajukan permohonan di hadapannya demi bangsanya
  rationale: Terjemahan ini mempertahankan suasana resmi istana dari idiom 'dari hadapannya' dalam bentuk Indonesia yang wajar, dan על dipahami sebagai tindakan bagi kepentingan bangsanya.
