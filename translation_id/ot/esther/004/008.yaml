  verdict: revise
  source_fidelity: 'Draf menangkap isi utama ayat, termasuk salinan ketetapan, penerbitannya di Susan, tujuan pemusnahan, dan permohonan bagi bangsa Ester. Namun, bentuk pasif pada tiga infinitif tujuan mengaburkan pelaku yang tersirat: Mordekhai memberikan dokumen itu kepada Hatah agar Hatah memperlihatkannya kepada Ester, memberitahukan/menjelaskannya kepadanya, dan menyuruhnya. Bentuk aktif diperlukan untuk mempertahankan relasi sintaktis tersebut.'
  naturalness: Kalimat revisi mempertahankan gaya baku dan resmi, tetapi memakai verba aktif yang lebih langsung dan alami. “Ketetapan tertulis” menyampaikan “written decree” tanpa kesan bahwa “salinan” itu sendiri adalah sebuah surat.
  terminology: “Susan,” “Ester,” “raja,” dan “menghadap raja” tepat. “Kemurahan” lebih dekat dengan nuansa permohonan akan perkenanan/favor pada התחנן daripada “belas kasihan,” tanpa menghilangkan kesungguhan permohonan. Catatan kaki secara tepat mempertahankan keluasan makna פַּתְשֶׁגֶן.
  issues:
  - severity: medium
    issue: 'Klausa tujuan diterjemahkan secara pasif: “supaya salinan itu diperlihatkan ... serta supaya disampaikan perintah.”'
    rationale: Bahasa Ibrani memakai rangkaian infinitif yang bergantung pada tindakan Mordekhai memberi dokumen kepada Hatah. Hatah adalah pelaku tersirat yang harus memperlihatkan dokumen, menjelaskannya, dan menyuruh Ester. Pasif mengaburkan hubungan ini dan melemahkan daya langsung dari צוה.
  - severity: low
    issue: “Memohon belas kasihan raja” kurang presisi bagi להתחנן לו.
    rationale: Kata itu menandai permohonan sungguh-sungguh untuk memperoleh perkenanan/kemurahan. “Memohon kemurahannya” mempertahankan nuansa ini tanpa mempersempitnya pada belas kasihan.
