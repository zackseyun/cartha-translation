  text: He came as far as the front of the king’s gate[b][a], because no one could enter the king’s gate clothed in sackcloth.
translation:
  language: id
  text: Ia datang sampai di depan gerbang raja[a], sebab tidak seorang pun dapat memasuki gerbang raja dengan mengenakan kain kabung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sampai ke hadapan gerbang raja.” Ungkapan Ibrani menekankan bahwa ia hanya mendekat hingga tempat di depan gerbang itu.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “sebab tidak ada yang dapat masuk ke gerbang raja dengan pakaian kain kabung.” Dalam konteks ini, maksudnya ialah bahwa masuk dengan pakaian perkabungan tidak diizinkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Ia datang
  rationale: Bentuk wayyiqtol dari בוא melanjutkan narasi tentang pergerakan Mordekhai menuju gerbang; 'datang' wajar dalam narasi Indonesia dan sesuai dengan sudut pandang pendekatan.
- source_word: עַד לִפְנֵי
  choice: sampai ke depan
  rationale: Gabungan ini menyatakan batas gerak hingga tempat di hadapan gerbang tanpa memasukinya; pilihan ini mempertahankan unsur batas sekaligus lokasi.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: gerbang istana raja
  rationale: Secara harfiah berarti 'gerbang raja'. Penambahan 'istana' memperjelas bahwa yang dimaksud ialah gerbang kompleks kerajaan, bukan sebuah gerbang milik pribadi, tanpa mengubah latar istana.
- source_word: כִּי אֵין לָבוֹא
  choice: sebab ... tidak diperbolehkan masuk
  rationale: אין dengan infinitif menyatakan bahwa tindakan itu tidak dapat dilakukan; dalam konteks ini, alasan Mordekhai berhenti menunjukkan larangan masuk, bukan ketidakmampuan jasmani.
- source_word: אֶל שַׁעַר הַמֶּלֶךְ
  choice: masuk melalui gerbang itu
  rationale: אֶל dapat berarti 'ke' atau 'ke dalam'. Dalam konteks gerbang, bahasa Indonesia alami memakai 'masuk melalui'; 'itu' menghindari pengulangan panjang sambil tetap merujuk pada gerbang raja.
- source_word: בִּלְבוּשׁ שָׂק
  choice: mengenakan kain kabung
  rationale: Frasa ini secara formal berarti 'dengan pakaian kain kabung'. 'Mengenakan kain kabung' adalah ungkapan Indonesia yang alami dan tetap mempertahankan pakaian perkabungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kain kabung' dipertahankan sebagai istilah Alkitab yang umum untuk pakaian perkabungan. Struktur sebab-akibat dibuat alami tanpa menghilangkan batas pendekatan Mordekhai ke gerbang.
