base_translation:
  language: en
  yaml_path: translation/ot/esther/004/003.yaml
  text: And in every province[a], wherever the king’s word and his decree reached, there was great mourning among the Jews, with fasting and weeping and lamentation; sackcloth and ashes were spread out for many.
translation:
  language: id
  text: Di setiap provinsi, di setiap tempat yang menerima titah raja dan ketetapannya, terjadi perkabungan besar di antara orang-orang Yahudi, disertai puasa, tangisan, dan ratapan. Kain kabung dan abu dihamparkan bagi banyak orang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kain kabung dan abu dipakai oleh banyak orang.” Ungkapan Ibrani pada bagian akhir ayat ini sangat ringkas dan dapat menunjuk pada benda-benda perkabungan yang dihamparkan bagi banyak orang atau pada penggunaannya oleh banyak orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מְדִינָה וּמְדִינָה
  choice: Di setiap provinsi
  rationale: 'Pengulangan distributif harfiah ‘provinsi demi provinsi’ secara alami menyatakan cakupan menyeluruh: ‘di setiap provinsi’.'
- source_word: מְקוֹם אֲשֶׁר
  choice: di mana pun
  rationale: Ungkapan ini menunjukkan setiap tempat yang memenuhi keadaan berikutnya; ‘di mana pun’ mempertahankan daya distributifnya dalam bahasa Indonesia yang wajar.
- source_word: דְּבַר הַמֶּלֶךְ
  choice: titah raja
  rationale: דָּבָר secara dasar berarti ‘perkataan/perkara’, tetapi dalam konteks penyebaran keputusan kerajaan menunjuk pada titah resmi. ‘Titah raja’ alami dan tetap membedakannya dari ketetapan hukum yang disebut sesudahnya.
- source_word: וְדָתוֹ
  choice: dan ketetapannya
  rationale: Dalam Kitab Ester, דָּת lazim menunjuk pada ketentuan atau keputusan resmi kerajaan. ‘Ketetapan’ menyampaikan kekuatan hukumnya tanpa menyamakannya dengan hukum secara umum.
- source_word: מַגִּיעַ
  choice: sampai
  rationale: Partisip ini menggambarkan titah dan ketetapan kerajaan yang mencapai berbagai tempat. ‘Sampai’ ringkas dan idiomatis dalam konteks penyebaran berita resmi.
- source_word: אֵבֶל גָּדוֹל לַיְּהוּדִים
  choice: orang-orang Yahudi berkabung dengan sangat
  rationale: Ungkapan nominal ‘perkabungan besar bagi/di antara orang Yahudi’ dialihkan menjadi konstruksi verbal yang alami, tanpa mengurangi intensitas dan sifat komunal perkabungan itu.
- source_word: וְצוֹם וּבְכִי וּמִסְפֵּד
  choice: disertai puasa, tangisan, dan ratapan
  rationale: Ketiga nomina ini menjabarkan bentuk-bentuk perkabungan. ‘Ratapan’ mempertahankan nuansa ungkapan dukacita yang terdengar atau dilakukan secara terbuka.
- source_word: שַׂק וָאֵפֶר
  choice: kain kabung dan abu
  rationale: Ini merupakan pasangan lambang perkabungan yang dikenal dalam konteks Alkitab; ‘kain kabung’ lebih jelas bagi pembaca Indonesia daripada hanya ‘kabung’.
- source_word: יֻצַּע לָרַבִּים
  choice: dihamparkan bagi banyak orang
  rationale: Bentuk pasif יֻצַּע secara harfiah berarti ‘dihamparkan/dibentangkan’. Terjemahan utama mempertahankan gambaran konkret dan hubungan לָרַבִּים yang ringkas, sedangkan kemungkinan bahwa banyak orang memakainya dicatat dalam catatan kaki.
