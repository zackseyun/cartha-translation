  yaml_path: translation/ot/esther/008/016.yaml
  text: For the Jews there was light and gladness and joy and honor[a].
translation:
  language: id
  text: Bagi orang Yahudi ada terang, kegembiraan, sukacita, dan kehormatan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang Yahudi memiliki terang, kegembiraan, sukacita, dan kehormatan.” Susunan bahasa Ibrani dapat dipahami secara eksistensial (“ada”) atau sebagai kepemilikan (“memiliki”).
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְּהוּדִים
  choice: Bagi orang Yahudi
  rationale: Prefiks ל menyatakan pihak yang mengalami atau memiliki hal-hal berikut. Frasa ini mempertahankan susunan Ibrani secara alami dalam bahasa Indonesia tanpa langsung mengubahnya menjadi konstruksi kepemilikan.
- source_word: הָיְתָה
  choice: ada
  rationale: Dengan frasa datif yang ditempatkan di depan, bentuk היה dapat diungkapkan secara eksistensial sebagai 'ada'. Ini ringkas, alami, dan tetap membuka kemungkinan nuansa kepemilikan.
- source_word: אוֹרָה
  choice: terang
  rationale: Kata ini secara harfiah berarti 'terang' dan di sini berfungsi sebagai gambaran pembebasan serta keadaan yang baik. 'Terang' mempertahankan metafora sumber.
- source_word: שִׂמְחָה
  choice: kegembiraan
  rationale: Pilihan ini membedakannya dari שָׂשׂוֹן sambil mempertahankan penumpukan dua istilah sukacita dalam teks Ibrani.
- source_word: שָׂשׂוֹן
  choice: sukacita
  rationale: Kata ini menunjuk pada kegirangan atau sukacita yang meluap. 'Sukacita' alami dan bermartabat, serta berpasangan baik dengan 'kegembiraan'.
- source_word: יְקָר
  choice: kehormatan
  rationale: Dalam konteks pembalikan nasib orang Yahudi, kata ini terutama menunjuk pada martabat dan penghargaan sosial. 'Kehormatan' lebih tepat daripada istilah yang menekankan kemegahan visual.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan bermartabat. Deretan empat nomina dipertahankan untuk mencerminkan irama serta penekanan teks Ibrani; metafora 'terang' tidak ditafsirkan secara eksplisit di dalam teks utama.
