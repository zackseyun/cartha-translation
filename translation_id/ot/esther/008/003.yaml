  text: וַ/תּ֣וֹסֶף אֶסְתֵּ֗ר וַ/תְּדַבֵּר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וַ/תִּפֹּ֖ל לִ/פְנֵ֣י רַגְלָ֑י/ו וַ/תֵּ֣בְךְּ וַ/תִּתְחַנֶּן ל֗/וֹ לְ/הַֽעֲבִיר֙ אֶת רָעַת֙ הָמָ֣ן הָֽ/אֲגָגִ֔י וְ/אֵת֙ מַֽחֲשַׁבְתּ֔/וֹ אֲשֶׁ֥ר חָשַׁ֖ב עַל הַ/יְּהוּדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/003.yaml
  text: Then Esther spoke again before the king. She fell before his feet[a], wept, and pleaded with him to avert the evil of Haman the Agagite and his scheme that he had devised against the Jews.
translation:
  language: id
  text: Kemudian Ester kembali berbicara di hadapan raja. Ia menjatuhkan diri di kaki raja, menangis, dan memohon kepadanya agar menyingkirkan[a] kejahatan Haman, orang Agag, serta rencana yang telah dirancang Haman terhadap orang Yahudi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggagalkan” atau “membuat berlalu”; verba Ibrani ini menyatakan tindakan membuat kejahatan dan rencana Haman berlalu atau disingkirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף אֶסְתֵּר וַתְּדַבֵּר
  choice: Kemudian Ester kembali berbicara
  rationale: Konstruksi יסף yang diikuti verba finit menyatakan pengulangan atau kelanjutan. “Kembali berbicara” menyampaikan makna itu secara wajar tanpa menerjemahkan secara kaku sebagai “menambahkan dan berbicara”.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: Ungkapan ini menunjukkan tempat sekaligus suasana resmi istana; “di hadapan raja” mempertahankan kedua nuansa tersebut.
- source_word: וַתִּפֹּל לִפְנֵי רַגְלָיו
  choice: Ia menjatuhkan diri di kaki raja
  rationale: Frasa ini menggambarkan tindakan merendahkan diri secara jasmani dalam permohonan. Penyebutan “raja” memperjelas acuan pronomina dan terdengar alami dalam bahasa Indonesia.
- source_word: וַתֵּבְךְּ
  choice: menangis
  rationale: בכה berarti menangis atau meratap; “menangis” sesuai dengan konteks emosional dan ragam narasi yang bermartabat.
- source_word: וַתִּתְחַנֶּן לוֹ
  choice: memohon kepadanya
  rationale: Bentuk hitpael dari חנן menyatakan permohonan sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan.
- source_word: לְהַעֲבִיר
  choice: agar menyingkirkan
  rationale: Bentuk hiphil dari עבר berarti menyebabkan sesuatu berlalu atau disingkirkan. “Menyingkirkan” dapat berlaku secara alami pada kejahatan maupun rencana tanpa secara khusus membatasi tindakan raja pada pencabutan surat keputusan.
- source_word: אֶת רָעַת הָמָן
  choice: kejahatan Haman
  rationale: רָעָה dapat berarti kejahatan, malapetaka, atau bahaya. “Kejahatan Haman” mempertahankan dimensi moralnya serta tidak meleburkannya dengan מַחֲשַׁבְתּוֹ, “rencananya”, yang disebut secara terpisah.
- source_word: הָאֲגָגִי
  choice: orang Agag itu
  rationale: Sebutan ini mengidentifikasi Haman sebagai orang Agag. Bentuk “orang Agag” lebih mudah dipahami pembaca Indonesia daripada transliterasi adjektival “Agagit”.
- source_word: וְאֵת מַחֲשַׁבְתּוֹ אֲשֶׁר חָשַׁב
  choice: serta rencana yang telah dirancang Haman
  rationale: Pasangan nomina-verba dari akar חשב menekankan tindakan merancang. Pengulangan nama Haman menghindari ketidakjelasan acuan dan tetap menyampaikan permainan akar itu tanpa pengulangan yang kaku.
- source_word: עַל הַיְּהוּדִים
  choice: terhadap orang Yahudi
  rationale: Dalam konteks rencana bermusuhan, עַל mengarahkan rencana itu kepada orang Yahudi sebagai sasaran. “Terhadap” mempertahankan daya adversatif yang sudah jelas dari konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti urutan narasi Ibrani, tetapi memakai ungkapan yang alami bagi pembaca umum. Pembedaan antara “kejahatan” (רָעָה) dan “rencana” (מַחֲשָׁבָה) sengaja dipertahankan.
