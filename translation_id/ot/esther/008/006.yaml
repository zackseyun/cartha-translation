  source_fidelity: Terjemahan dengan tepat menyampaikan pertanyaan retoris ganda dalam Ibrani. “Sebab” mempertahankan fungsi kausal כִּי; “bagaimana mungkin aku sanggup melihat” secara alami menyampaikan אֵיכָכָה אוּכַל וְרָאִיתִי tanpa mengubahnya menjadi sekadar kemampuan netral. “Malapetaka yang akan menimpa bangsaku” mencerminkan בָּרָעָה אֲשֶׁר יִמְצָא אֶת־עַמִּי, dan “kebinasaan kaum kerabatku” mempertahankan perbedaan antara עַמִּי dan מוֹלַדְתִּי.
