  text: כִּ֠י אֵיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בָּ/רָעָ֖ה אֲשֶׁר יִמְצָ֣א אֶת עַמִּ֑/י וְ/אֵֽיכָכָ֤ה אוּכַל֙ וְֽ/רָאִ֔יתִי בְּ/אָבְדַ֖ן מוֹלַדְתִּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/006.yaml
  text: For how could I bear to see the disaster that will come upon my people? And how could I bear to see the destruction of my kindred?[a]
translation:
  language: id
  text: Sebab, bagaimana mungkin aku sanggup melihat malapetaka yang akan menimpa bangsaku? Bagaimana mungkin aku sanggup melihat kebinasaan kaum kerabatku?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebinasaan orang-orang yang seasal denganku” atau “sanak keluargaku.” Kata Ibrani מוֹלַדְתִּי dapat menunjuk pada orang-orang yang terkait melalui kelahiran atau kekerabatan, bukan hanya pada tempat kelahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperlihatkan bahwa pertanyaan retoris ini menjadi alasan bagi permohonan Ester dalam konteks sebelumnya.
- source_word: אֵיכָכָה אוּכַל
  choice: bagaimana mungkin aku sanggup
  rationale: Mengungkapkan ketidakmampuan emosional dalam pertanyaan retoris, sambil tetap mempertahankan arti dasar יכל, yaitu mampu atau sanggup.
- source_word: וְרָאִיתִי
  choice: melihat
  rationale: Dalam konstruksi ini, bahasa Indonesia secara alami memakai verba pelengkap setelah 'sanggup'; maknanya ialah menyaksikan bencana itu terjadi.
- source_word: בָּרָעָה
  choice: malapetaka
  rationale: רָעָה di sini menunjuk pada bencana atau celaka yang menimpa suatu bangsa, bukan kejahatan moral.
- source_word: אֲשֶׁר יִמְצָא
  choice: yang akan menimpa
  rationale: Ungkapan Ibrani harfiah 'yang akan menemukan' secara idiomatis berarti sesuatu yang akan menimpa seseorang.
- source_word: עַמִּי
  choice: bangsaku
  rationale: Dalam konteks Ester, עַם menunjuk pada komunitas etnis Yahudi yang diakuinya sebagai bangsanya.
- source_word: בְּאָבְדַן
  choice: kebinasaan
  rationale: Nomina dari אבד menyatakan keadaan binasa atau penghancuran; 'kebinasaan' mempertahankan cakupan makna tanpa secara khusus menegaskan pemusnahan total.
- source_word: מוֹלַדְתִּי
  choice: kaum kerabatku
  rationale: Istilah ini dapat menunjuk pada orang-orang yang terkait melalui kelahiran, yakni sanak atau kelompok asal Ester, dan bukan hanya tempat kelahirannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan pertanyaan retoris dipertahankan untuk menyampaikan desakan emosional Ester. 'Bangsa' dipakai untuk עַם, sedangkan 'kaum kerabat' mempertahankan perbedaan leksikal pada מוֹלַדְתִּי.
