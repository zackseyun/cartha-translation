  - severity: low
    issue: “Apa hubungan Mordekhai dengannya” sedikit lebih interpretatif daripada ungkapan sumber.
    rationale: מַה־הוּא לָהּ secara harfiah menanyakan siapa/apakah Mordekhai bagi Ester. Revisi mempertahankan keterbukaan ungkapan itu tanpa menentukan bentuk relasinya.
  revised_text: Pada hari itu, Raja Ahasyweros memberikan kepada Ratu Ester harta milik Haman, musuh orang Yahudi. Mordekhai pun datang menghadap raja, karena Ester telah memberitahukan siapa Mordekhai bagi dirinya.
