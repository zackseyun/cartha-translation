base_translation:
  language: en
  yaml_path: translation/ot/esther/008/001.yaml
  text: On that day King Ahasuerus gave Queen Esther the house of Haman, the enemy of the Jews, and Mordecai came before the king, because Esther had told what he was to her.
translation:
  language: id
  text: Pada hari itu, Raja Ahasyweros memberikan kepada Ratu Ester harta milik Haman, musuh orang Yahudi. Mordekhai pun datang menghadap raja, karena Ester telah memberitahukan siapa Mordekhai bagi dirinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית הָמָן
  choice: seluruh harta milik Haman
  rationale: Secara harfiah berarti 'rumah Haman', tetapi dalam konteks penyerahan oleh raja menunjuk pada rumah tangga atau seluruh harta bendanya; ungkapan ini dibuat jelas dalam bahasa Indonesia alami.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: musuh orang Yahudi
  rationale: Partisip Ibrani צֹרֵר menggambarkan Haman sebagai orang yang memusuhi atau menindas orang Yahudi; 'musuh' ringkas dan tepat dalam konteks.
- source_word: בָּא לִפְנֵי הַמֶּלֶךְ
  choice: datang menghadap raja
  rationale: Ungkapan istana ini bukan sekadar hadir secara fisik di depan raja, melainkan memperoleh akses untuk menghadapnya.
- source_word: מַה הוּא לָהּ
  choice: apa hubungan Mordekhai dengannya
  rationale: Ungkapan harfiah 'apa dia baginya' menyatakan hubungan antara Mordekhai dan Ester. Nama Mordekhai diulang agar rujukannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan sebab akibat yang diperkenalkan oleh כִּי
  choice: karena Ester telah memberitahukan
  alternative: sebab Ester telah memberitahukan
  rationale: כִּי paling alami dipahami sebagai alasan Mordekhai dapat menghadap raja; 'karena' mempertahankan hubungan kausal tanpa menambahkan penafsiran.
translation_notes:
  register: 'Bahasa Indonesia modern, wajar, dan bermartabat. Nama mengikuti bentuk Indonesia yang lazim: Ahasyweros, Ester, dan Mordekhai. Struktur ayat dibagi menjadi dua kalimat agar mudah dipahami tanpa mengubah alur narasi.'
