  text: וַ֠/תֹּאמֶר אִם עַל הַ/מֶּ֨לֶךְ ט֜וֹב וְ/אִם מָצָ֧אתִי חֵ֣ן לְ/פָנָ֗י/ו וְ/כָשֵׁ֤ר הַ/דָּבָר֙ לִ/פְנֵ֣י הַ/מֶּ֔לֶךְ וְ/טוֹבָ֥ה אֲנִ֖י בְּ/עֵינָ֑י/ו יִכָּתֵ֞ב לְ/הָשִׁ֣יב אֶת הַ/סְּפָרִ֗ים מַחֲשֶׁ֜בֶת הָמָ֤ן בֶּֽן הַמְּדָ֨תָא֙ הָ/אֲגָגִ֔י אֲשֶׁ֣ר כָּתַ֗ב לְ/אַבֵּד֙ אֶת הַ/יְּהוּדִ֔ים אֲשֶׁ֖ר בְּ/כָל מְדִינ֥וֹת הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/005.yaml
  text: And she said[a], “If it seems good to the king, and if I have found favor before him, and if the matter is proper before the king, and if I am pleasing in his eyes, let it be written to revoke the letters devised by Haman son of Hammedatha the Agagite[b], which he wrote to destroy the Jews who are in all the provinces of the king.”
translation:
  language: id
  text: Ia berkata, “Jika raja berkenan, jika aku mendapat kemurahan di hadapannya, jika perkara ini dipandang patut oleh raja, dan jika aku berkenan di matanya, hendaklah ditulis untuk membatalkan[a] surat-surat yang memuat rancangan Haman[b] bin Hamedata, orang Agag itu, yang ditulisnya untuk membinasakan orang Yahudi di seluruh provinsi raja.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menarik kembali” atau “untuk membalikkan”; kata Ibrani ini pada dasarnya berarti membuat sesuatu kembali atau berbalik, dan di sini dipakai dalam konteks administratif.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “surat-surat, rancangan Haman”; maksudnya dapat dipahami sebagai surat-surat yang memuat atau mewujudkan rancangan Haman.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Jika hal ini baik bagi raja
  rationale: Mempertahankan rumusan sopan dalam permohonan di lingkungan istana, sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: מָצָאתִי חֵן לְפָנָיו
  choice: aku mendapat kemurahan di hadapannya
  rationale: חֵן dalam konteks permohonan kepada raja menunjuk pada kemurahan atau perkenanan; frasa ini juga mempertahankan unsur לְפָנָיו.
- source_word: וְכָשֵׁר הַדָּבָר לִפְנֵי הַמֶּלֶךְ
  choice: jika perkara ini dipandang patut oleh raja
  rationale: כָשֵׁר berarti patut, layak, atau sesuai. Bentuk 'dipandang patut' menyampaikan penilaian raja secara alami tanpa mengubah perkara menjadi usul secara eksplisit.
- source_word: וְטוֹבָה אֲנִי בְּעֵינָיו
  choice: jika aku berkenan di matanya
  rationale: Menjaga citra idiomatis 'di matanya' dan membedakannya dari ungkapan sebelumnya tentang mendapat kemurahan.
- source_word: יִכָּתֵב
  choice: hendaklah ditulis perintah
  rationale: Bentuk pasif permohonan dipertahankan. Kata 'perintah' disisipkan agar konstruksi administratif dengan tujuan membatalkan surat-surat dapat dipahami secara wajar dalam bahasa Indonesia.
- source_word: לְהָשִׁיב
  choice: untuk membatalkan
  rationale: Dalam konteks administratif, verba ini berarti membuat ketetapan terdahulu berbalik atau tidak berlaku; 'membatalkan' paling jelas dalam bahasa Indonesia, sementara kemungkinan harfiah 'menarik kembali/membalikkan' dicatat.
- source_word: הַסְּפָרִים
  choice: surat-surat
  rationale: Dalam Kitab Ester, istilah ini merujuk pada komunikasi tertulis resmi kerajaan yang dikirim ke berbagai provinsi.
- source_word: מַחֲשֶׁבֶת הָמָן
  choice: yang memuat rancangan Haman
  rationale: Konstruksi Ibrani secara harfiah menghubungkan 'surat-surat' dengan 'rancangan Haman'. 'Memuat' menyatakan bahwa surat itu mewujudkan rancangannya tanpa menjadikannya sekadar surat yang ia karang.
- source_word: לְאַבֵּד
  choice: untuk membinasakan
  rationale: Menyampaikan tindakan menyebabkan kebinasaan atau kehancuran total dalam konteks rencana pemusnahan.
- source_word: הַיְּהוּדִים אֲשֶׁר בְּכָל מְדִינוֹת הַמֶּלֶךְ
  choice: orang Yahudi di seluruh provinsi raja
  rationale: Terjemahan distributif yang alami dan tetap mencakup semua wilayah administratif di bawah raja.
