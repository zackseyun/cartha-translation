  text: וַ/יִּקָּרְא֣וּ סֹפְרֵֽי הַ/מֶּ֣לֶךְ בָּֽ/עֵת הַ֠/הִיא בַּ/חֹ֨דֶשׁ הַ/שְּׁלִישִׁ֜י הוּא חֹ֣דֶשׁ סִיוָ֗ן בִּ/שְׁלוֹשָׁ֣ה וְ/עֶשְׂרִים֮ בּ/וֹ֒ וַ/יִּכָּתֵ֣ב כְּֽ/כָל אֲשֶׁר צִוָּ֣ה מָרְדֳּכַ֣י אֶל הַ/יְּהוּדִ֡ים וְ/אֶ֣ל הָ/אֲחַשְׁדַּרְפְּנִֽים וְ/הַ/פַּחוֹת֩ וְ/שָׂרֵ֨י הַ/מְּדִינ֜וֹת אֲשֶׁ֣ר מֵ/הֹ֣דּוּ וְ/עַד כּ֗וּשׁ שֶׁ֣בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מְדִינָ֤ה וּ/מְדִינָה֙ כִּ/כְתָבָ֔/הּ וְ/עַ֥ם וָ/עָ֖ם כִּ/לְשֹׁנ֑/וֹ וְ/אֶ֨ל הַ/יְּהוּדִ֔ים כִּ/כְתָבָ֖/ם וְ/כִ/לְשׁוֹנָֽ/ם־־־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/009.yaml
  text: Then the king’s scribes were summoned at that time[a], in the third month, that is, the month of Sivan, on its twenty-third day; and it was written exactly as Mordecai commanded, to the Jews and to the satraps, the governors, and the officials of the provinces from India to Cush, one hundred and twenty-seven provinces, to each province in its own script, to each people in its own language[b], and also to the Jews in their own script and their own language.
translation:
  language: id
  text: Pada waktu itu para juru tulis raja dipanggil, pada bulan ketiga, yaitu bulan Siwan, pada hari kedua puluh tiga bulan itu. Lalu ditulislah, sesuai dengan segala yang diperintahkan Mordekhai, kepada orang Yahudi, kepada para satrap, para gubernur, dan para pejabat provinsi di seluruh seratus dua puluh tujuh provinsi, dari India sampai Kus[a], kepada setiap provinsi menurut aksaranya, kepada setiap bangsa menurut bahasanya, dan kepada orang Yahudi menurut aksara dan bahasa mereka sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kus adalah nama wilayah kuno di sebelah selatan Mesir; secara tradisional nama ini juga diterjemahkan “Etiopia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּרְאוּ סֹפְרֵי הַמֶּלֶךְ
  choice: para juru tulis raja dipanggil
  rationale: Bentuk Nifal menyatakan bahwa mereka dipanggil; 'juru tulis raja' mempertahankan hubungan konstruksi dan cocok dengan lingkungan istana.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Menerjemahkan penanda waktu secara eksplisit dan wajar dalam bahasa Indonesia.
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי הוּא חֹדֶשׁ סִיוָן
  choice: pada bulan ketiga, bulan Siwan
  rationale: Mempertahankan urutan bulan dan nama Ibrani dalam bentuk transliterasi Indonesia yang lazim.
- source_word: בִּשְׁלוֹשָׁה וְעֶשְׂרִים בּוֹ
  choice: pada hari kedua puluh tiga bulan itu
  rationale: Membuat rujukan pronominal kepada bulan menjadi jelas dan alami tanpa menambah informasi.
- source_word: וַיִּכָּתֵב
  choice: Lalu ditulislah
  rationale: Mempertahankan bentuk pasif tunggal tanpa memasok pelaku yang tidak disebutkan.
- source_word: כְּכָל אֲשֶׁר צִוָּה מָרְדֳּכַי
  choice: segala sesuatu tepat seperti yang diperintahkan Mordekhai
  rationale: Mengungkapkan cakupan penuh כְּכָל serta kesesuaian tulisan dengan perintah Mordekhai.
- source_word: הָאֲחַשְׁדַּרְפְּנִים
  choice: para satrap
  rationale: Istilah historis baku untuk pejabat tinggi dalam tata pemerintahan Persia.
- source_word: הַפַּחוֹת
  choice: para gubernur
  rationale: Padanan administratif yang jelas dan mudah dipahami bagi pembaca modern.
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: para pejabat provinsi
  rationale: Menyampaikan fungsi administratif שָׂרִים dalam konteks kekaisaran tanpa menyiratkan status kerajaan.
- source_word: מֵהֹדּוּ וְעַד כּוּשׁ
  choice: dari India sampai Kus
  rationale: הֹדּוּ dikenali sebagai India, sedangkan transliterasi 'Kus' mempertahankan nama geografis kuno dan menghindari penyamaan yang terlalu pasti dengan Etiopia modern.
- source_word: מְדִינָה וּמְדִינָה כִּכְתָבָהּ וְעַם וָעָם כִּלְשֹׁנוֹ
  choice: kepada setiap provinsi menurut aksaranya dan kepada setiap bangsa menurut bahasanya
  rationale: Ungkapan distributif Ibrani diterjemahkan dengan 'setiap'; כְּתָב menunjuk sistem tulisan atau aksara, bukan sekadar sebuah tulisan.
- source_word: וְאֶל הַיְּהוּדִים כִּכְתָבָם וְכִלְשׁוֹנָם
  choice: serta kepada orang Yahudi menurut aksara dan bahasa mereka sendiri
  rationale: Kata 'serta' menyampaikan tambahan kelompok penerima; 'mereka sendiri' menegaskan bentuk pronominal tanpa mengubah makna.
