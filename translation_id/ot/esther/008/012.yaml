  text: בְּ/י֣וֹם אֶחָ֔ד בְּ/כָל מְדִינ֖וֹת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ בִּ/שְׁלוֹשָׁ֥ה עָשָׂ֛ר לְ/חֹ֥דֶשׁ שְׁנֵים עָשָׂ֖ר הוּא חֹ֥דֶשׁ אֲדָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/012.yaml
  text: on one day in all the provinces of King Ahasuerus, on the thirteenth day of the twelfth month, that is, the month Adar.
translation:
  language: id
  text: pada satu hari di seluruh provinsi Raja Ahasyweros, yaitu pada hari ketiga belas bulan kedua belas, yakni bulan Adar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם אֶחָד
  choice: pada satu hari
  rationale: Preposisi ב menandai waktu, sedangkan אֶחָד dipertahankan sebagai “satu”; ungkapan ini menyatakan bahwa pelaksanaannya terjadi pada satu hari tertentu.
- source_word: בְּכָל מְדִינוֹת
  choice: di seluruh provinsi
  rationale: מְדִינוֹת menunjuk pada wilayah administratif kerajaan; “di seluruh provinsi” alami dalam bahasa Indonesia dan mencakup semua provinsi tanpa menambah gagasan lain.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Rangkaian ini mengidentifikasi provinsi-provinsi milik Raja Ahasyweros. Ejaan “Ahasyweros” mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר
  choice: pada hari ketiga belas
  rationale: Bilangan pokok Ibrani berfungsi sebagai tanggal; “hari ketiga belas” merupakan bentuk tanggal yang jelas dan wajar dalam bahasa Indonesia.
- source_word: לְחֹדֶשׁ שְׁנֵים עָשָׂר
  choice: bulan kedua belas
  rationale: Secara harfiah frasa ini menyebut “bulan dua belas”; bentuk ordinal Indonesia diperlukan dalam rumusan tanggal.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: yakni bulan Adar
  rationale: הוּא berfungsi menjelaskan nama bulan kedua belas. “Yakni” mempertahankan fungsi penjelas itu dalam bahasa Indonesia yang ringkas dan resmi.
theological_decisions: []
