reference: Esther 8:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר֩ נָתַ֨ן הַ/מֶּ֜לֶךְ לַ/יְּהוּדִ֣ים אֲשֶׁ֣ר בְּ/כָל עִיר וָ/עִ֗יר לְ/הִקָּהֵל֮ וְ/לַ/עֲמֹ֣ד עַל נַפְשָׁ/ם֒ לְ/הַשְׁמִיד֩ וְ/לַ/הֲרֹ֨ג וּ/לְ/אַבֵּ֜ד אֶת כָּל חֵ֨יל עַ֧ם וּ/מְדִינָ֛ה הַ/צָּרִ֥ים אֹתָ֖/ם טַ֣ף וְ/נָשִׁ֑ים וּ/שְׁלָלָ֖/ם לָ/בֽוֹז׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/011.yaml
  text: that the king granted the Jews in every single city to assemble and to stand for their lives[a], to destroy, to kill, and to annihilate every armed force of any people or province that might attack them, including children and women[b], and to plunder their spoil.
translation:
  language: id
  text: bahwa raja mengizinkan orang-orang Yahudi di setiap kota untuk berkumpul dan mempertahankan nyawa mereka, untuk memusnahkan, membunuh, dan membinasakan setiap pasukan bersenjata dari bangsa atau provinsi mana pun yang memusuhi mereka[a], termasuk anak-anak dan perempuan[b], serta merampas harta mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menyerang mereka.” Kata Ibrani ini dapat menunjuk pada orang-orang yang bertindak sebagai musuh terhadap mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak dan perempuan.” Menurut susunan kalimat, mereka tercakup dalam kelompok musuh yang disebutkan dalam surat keputusan itu.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר נָתַן
  choice: bahwa raja memberikan ... hak
  rationale: Klausa relatif ini melanjutkan isi surat keputusan dari ayat sebelumnya. Penambahan 'hak' secara alami menyatakan makna pemberian wewenang kerajaan yang tersirat dalam נָתַן.
- source_word: בְּכָל עִיר וָעִיר
  choice: di setiap kota
  rationale: Pengulangan distributif Ibrani menegaskan cakupan menyeluruh; 'di setiap kota' menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: לְהִקָּהֵל
  choice: untuk berkumpul
  rationale: Bentuk Nifal menyatakan berhimpun bersama; 'berkumpul' jelas dan alami.
- source_word: וְלַעֲמֹד עַל נַפְשָׁם
  choice: dan mempertahankan nyawa mereka
  rationale: Secara harfiah berarti 'berdiri demi/atas nyawa mereka'. Ungkapan Indonesia ini menyampaikan maksud mempertahankan hidup tanpa menghasilkan susunan yang janggal.
- source_word: לְהַשְׁמִיד וְלַהֲרֹג וּלְאַבֵּד
  choice: untuk memusnahkan, membunuh, dan membinasakan
  rationale: Ketiga verba kekerasan yang bersifat kumulatif dipertahankan semuanya dan dibedakan secara leksikal.
- source_word: כָּל חֵיל
  choice: setiap pasukan bersenjata
  rationale: Dalam konteks ini חֵיל menunjuk pada kekuatan atau kelompok militer, bukan kekayaan.
- source_word: עַם וּמְדִינָה
  choice: dari bangsa atau provinsi mana pun
  rationale: Pasangan ini mencakup kelompok etnis-politis di seluruh wilayah kekaisaran; 'mana pun' menyatakan cakupan tak tentu dan menyeluruh.
- source_word: הַצָּרִים אֹתָם
  choice: yang memusuhi mereka
  rationale: Partisip dari צרר dapat berarti bertindak sebagai musuh atau menunjukkan permusuhan. Terjemahan ini mempertahankan keluasan makna tanpa membatasi tindakan itu hanya pada serangan langsung.
- source_word: טַף וְנָשִׁים
  choice: termasuk anak-anak dan perempuan
  rationale: טַף menunjuk pada anak-anak atau tanggungan. 'Termasuk' memperjelas bahwa frasa ini tercakup dalam kelompok sasaran menurut susunan kalimat.
- source_word: וּשְׁלָלָם לָבוֹז
  choice: serta merampas barang jarahan mereka
  rationale: Frasa infinitif ini memberikan wewenang untuk mengambil harta sebagai jarahan; bentuk Indonesia ini jelas dan tidak bertautologi.
theological_decisions:
- issue: Bahasa kekerasan dalam surat keputusan kerajaan
  choice: Ketiga verba penghancuran diterjemahkan secara langsung, sementara konteks pembelaan hidup tetap tampak.
  alternative: Melunakkan menjadi 'mengalahkan' atau merangkum semuanya sebagai 'membela diri'.
  rationale: Teks Ibrani secara eksplisit memakai tiga verba kekerasan dan mengizinkan tindakan mematikan serta perampasan. Ketegangan teks tidak boleh disamarkan.
- issue: Cakupan frasa 'anak-anak dan perempuan'
  choice: Frasa itu disajikan sebagai bagian dari kelompok musuh yang menjadi sasaran keputusan.
  alternative: Mengaburkan, menghilangkan, atau menafsirkan frasa tersebut sebagai objek yang terpisah dari pasukan musuh.
  rationale: Secara sintaksis, frasa itu paling wajar dipahami sebagai keterangan aposisional dalam kelompok sasaran. Terjemahan mempertahankan kesulitan moral teks.
- issue: Makna הַצָּרִים אֹתָם
  choice: yang memusuhi mereka
  alternative: yang mungkin menyerang mereka
  rationale: Partisip Ibrani menyatakan sikap atau tindakan bermusuhan, tetapi tidak dengan sendirinya menentukan modalitas 'mungkin'. Pilihan ini menjaga ambiguitas antara permusuhan dan serangan aktif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada resmi yang sesuai dengan surat keputusan kerajaan. Istilah kekerasan dipertahankan secara lugas; susunan yang terlalu harfiah dan janggal dihindari.
