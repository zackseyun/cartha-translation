  text: הָ/רָצִ֞ים רֹכְבֵ֤י הָ/רֶ֨כֶשׁ֙ הָֽ/אֲחַשְׁתְּרָנִ֔ים יָֽצְא֛וּ מְבֹהָלִ֥ים וּ/דְחוּפִ֖ים בִּ/דְבַ֣ר הַ/מֶּ֑לֶךְ וְ/הַ/דָּ֥ת נִתְּנָ֖ה בְּ/שׁוּשַׁ֥ן הַ/בִּירָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/014.yaml
  text: The couriers[a], mounted on the royal steeds, went out hastened and pressed on by the king’s command, and the decree was issued in Susa the citadel.
translation:
  language: id
  text: Para kurir yang menunggang kuda kerajaan[a] berangkat dengan tergesa-gesa, didorong oleh perintah raja, dan ketetapan itu dikeluarkan di benteng Susan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kuda dari peternakan kerajaan”; istilah-istilah Ibrani untuk hewan tunggangan ini jarang dipakai, sehingga arti tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָצִים
  choice: para kurir
  rationale: Secara harfiah berkaitan dengan orang-orang yang berlari, tetapi dalam lingkungan kekaisaran Persia istilah ini menunjuk kepada para pembawa pesan resmi yang menggunakan jaringan angkutan kerajaan.
- source_word: רֹכְבֵי
  choice: yang menunggang
  rationale: Partisip ini menerangkan para kurir sebagai pengendara dan diterjemahkan secara langsung serta wajar dalam bahasa Indonesia.
- source_word: הָרֶכֶשׁ הָאֲחַשְׁתְּרָנִים
  choice: kuda kerajaan
  rationale: Gabungan istilah ini menunjuk kepada hewan tunggangan pilihan untuk layanan kerajaan, tetapi jenis atau sifat persisnya tidak pasti. Terjemahan ini mempertahankan konteks resmi tanpa memastikan identifikasi zoologis yang tidak jelas.
- source_word: יָצְאוּ
  choice: berangkat
  rationale: Dalam konteks para kurir yang memulai perjalanan, 'berangkat' menyampaikan gerak keluar secara alami.
- source_word: מְבֹהָלִים וּדְחוּפִים
  choice: segera ... dengan tergesa-gesa, dipacu
  rationale: Kedua partisip pasif menekankan desakan dan tekanan dari luar. Susunan ini mempertahankan intensitas ganda sambil tetap alami dalam bahasa Indonesia.
- source_word: בִּדְבַר הַמֶּלֶךְ
  choice: oleh perintah raja
  rationale: דבר di sini adalah perkataan yang berwibawa, yakni perintah raja; preposisi בְּ menyatakan dasar atau daya pendorong tindakan tersebut.
- source_word: וְהַדָּת
  choice: ketetapan itu
  rationale: Dalam konteks pemerintahan Persia di kitab Ester, דת menunjuk kepada ketetapan resmi yang mempunyai kekuatan hukum.
- source_word: נִתְּנָה
  choice: dikeluarkan
  rationale: Bentuk pasif ini secara harfiah berarti 'diberikan', tetapi dalam konteks administratif berarti ketetapan itu diterbitkan atau diundangkan secara resmi.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: di benteng Susan
  rationale: הבירה menunjuk kepada kompleks benteng atau pusat pemerintahan berbenteng di Susan; frasa ini ringkas dan lazim dalam bahasa Indonesia.
theological_decisions: []
