  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָרְדֳּכַ֞י יָצָ֣א מִ/לִּ/פְנֵ֣י הַ/מֶּ֗לֶךְ בִּ/לְב֤וּשׁ מַלְכוּת֙ תְּכֵ֣לֶת וָ/ח֔וּר וַ/עֲטֶ֤רֶת זָהָב֙ גְּדוֹלָ֔ה וְ/תַכְרִ֥יךְ בּ֖וּץ וְ/אַרְגָּמָ֑ן וְ/הָ/עִ֣יר שׁוּשָׁ֔ן צָהֲלָ֖ה וְ/שָׂמֵֽחָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/015.yaml
  text: And Mordecai went out from the presence of the king in royal clothing of blue and white[a], with a large crown of gold and a robe of fine linen and purple[e][d][c][b]; and the city of Susa shouted and rejoiced.
translation:
  language: id
  text: Mordekhai keluar dari hadapan raja dengan mengenakan pakaian kerajaan berwarna biru[a] dan putih, mahkota emas yang besar, serta jubah[b] dari linen halus dan kain ungu. Kota Susan pun bersorak dan bersukacita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biru-ungu.” Istilah Ibrani ini menunjuk pada warna atau bahan celup mewah dalam rentang biru hingga biru-ungu.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “jubah” dapat juga menunjuk pada mantel atau pakaian yang membungkus tubuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצָא מִלִּפְנֵי הַמֶּלֶךְ
  choice: keluar dari hadapan raja
  rationale: Ungkapan ini secara harfiah menggambarkan Mordekhai keluar dari hadapan raja; terjemahan ini mempertahankan latar istana sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: לְבוּשׁ מַלְכוּת
  choice: pakaian kerajaan
  rationale: Frasa ini menunjuk pada busana yang berkaitan dengan kedudukan kerajaan. Pilihan ini jelas, alami, dan mencakup rincian warna yang mengikutinya.
- source_word: תְּכֵלֶת
  choice: biru
  rationale: Kata ini menunjuk pada warna atau bahan celup mewah dalam rentang biru hingga biru-ungu. 'Biru' merupakan padanan ringkas dan jelas, sementara ketidakpastian coraknya dicatat dalam catatan kaki.
- source_word: חוּר
  choice: putih
  rationale: Dalam pasangan warna ini, kata tersebut paling wajar dipahami sebagai warna putih atau kain putih.
- source_word: עֲטֶרֶת זָהָב גְּדוֹלָה
  choice: mahkota emas yang besar
  rationale: Terjemahan ini mempertahankan jenis benda, bahannya, dan ukurannya tanpa menambahkan penafsiran tentang bentuk khusus mahkota tersebut.
- source_word: תַכְרִיךְ
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar yang membungkus tubuh. 'Jubah' sesuai dengan konteks busana resmi, sedangkan kemungkinan 'mantel' atau 'kain pembungkus' dicatat dalam catatan kaki.
- source_word: בּוּץ
  choice: linen halus
  rationale: Istilah ini menunjuk pada linen bermutu tinggi dan mewah; 'linen halus' mempertahankan nuansa mutunya.
- source_word: אַרְגָּמָן
  choice: kain ungu
  rationale: Kata ini dapat menunjuk pada warna ungu, bahan celup ungu, atau kain yang diwarnai ungu. Dalam rangkaian bahan pakaian, 'kain ungu' terdengar alami.
- source_word: הָעִיר שׁוּשָׁן
  choice: Kota Susan
  rationale: '''Susan'' adalah bentuk nama kota yang telah dikenal dalam tradisi Alkitab bahasa Indonesia, dan penyebutan ''kota'' mempertahankan unsur eksplisit dalam teks Ibrani.'
- source_word: צָהֲלָה וְשָׂמֵחָה
  choice: bersorak dan bersukacita
  rationale: 'Kedua verba dipertahankan sebagai tindakan berbeda: yang pertama menonjolkan luapan sukacita yang terdengar, sedangkan yang kedua menyatakan kegembiraan.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan rincian busana dibuat mengalir secara alami, sedangkan dua respons kota—sorak yang terdengar dan sukacita—tetap dibedakan.
