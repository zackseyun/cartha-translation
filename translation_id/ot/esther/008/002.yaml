base_translation:
  language: en
  yaml_path: translation/ot/esther/008/002.yaml
  text: Then the king removed his signet ring[a], which he had taken away from Haman, and gave it to Mordecai. And Esther appointed Mordecai over the house of Haman.
translation:
  language: id
  text: Kemudian raja melepaskan cincin meterainya yang telah diambil dari Haman, lalu memberikannya kepada Mordekhai. Ester mengangkat Mordekhai untuk mengurus harta milik Haman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah Haman”; ungkapan ini juga dapat berarti “rumah tangga Haman” atau “harta kekayaan Haman.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: melepaskan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyingkirkan atau melepaskan sesuatu; dalam konteks cincin yang dikenakan raja, 'melepaskan' alami dalam bahasa Indonesia.
- source_word: טַבַּעְתּוֹ
  choice: cincin meterainya
  rationale: טַבַּעַת secara dasar berarti cincin, tetapi dalam konteks istana Persia cincin ini dipakai untuk mengesahkan titah kerajaan; 'cincin meterai' menyatakan fungsinya dengan jelas.
- source_word: אֲשֶׁר הֶעֱבִיר מֵהָמָן
  choice: yang telah diambilnya kembali dari Haman
  rationale: Hifil עבר dapat berarti memindahkan atau mengambil dari seseorang. 'Diambilnya kembali' sesuai dengan konteks bahwa cincin kerajaan sebelumnya diberikan kepada Haman lalu ditarik darinya.
- source_word: וַיִּתְּנָהּ לְמָרְדֳּכָי
  choice: lalu memberikannya kepada Mordekhai
  rationale: נתן lazim berarti 'memberikan', dan sufiks feminin merujuk kepada cincin.
- source_word: וַתָּשֶׂם אֶסְתֵּר אֶת מָרְדֳּכַי עַל
  choice: Ester mengangkat Mordekhai untuk mengurus
  rationale: שׂוּם dengan עַל menyatakan penempatan atau pengangkatan seseorang atas suatu bidang tanggung jawab; bentuk ini menyampaikan fungsi administratif secara wajar.
- source_word: בֵּית הָמָן
  choice: harta milik Haman
  rationale: בַּיִת dapat menunjuk rumah, rumah tangga, atau keseluruhan harta/estate. Karena 8:1 menyebut pemberian milik Haman kepada Ester, 'harta milik Haman' paling jelas dalam konteks, sementara cakupan alternatif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Mengangkat ... untuk mengurus' dipilih agar hubungan administratif שׂוּם עַל terdengar alami. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
