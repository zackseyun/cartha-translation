review_pass:
  verdict: revise
  source_fidelity: 'Draf menangkap unsur-unsur utama ayat dengan baik: salinan dokumen resmi, pemberlakuan di seluruh provinsi, pengumuman kepada semua kelompok bangsa, kesiapan orang Yahudi pada hari yang ditentukan, dan pembalasan terhadap musuh. Namun, “harus ditetapkan sebagai hukum” kurang tepat untuk tindakan penerbitan sebuah salinan dekret dan kurang alami dalam bahasa Indonesia. “Bersiap untuk hari itu” juga lebih longgar daripada predikatif “siap pada hari itu” dalam teks Ibrani.'
  naturalness: Bahasa draf umumnya baku dan jelas. Revisi memakai “dikeluarkan sebagai ketetapan” untuk tindakan administratif dan “siap pada hari itu” untuk susunan yang lebih langsung dan alami. “Bangsa-bangsa” menyampaikan jamak עַמִּים tanpa membatasi maknanya pada kategori suku.
  terminology: “Ketetapan” cocok bagi דָּת dalam konteks dekret kerajaan. “Membalas dendam terhadap” mempertahankan daya נקם tanpa mengubahnya menjadi “membela diri.” Istilah “orang Yahudi” dipertahankan sebagai padanan kontekstual yang lazim untuk הַיְּהוּדִים.
  issues:
  - severity: medium
    issue: “harus ditetapkan sebagai hukum”
    rationale: Frasa ini dapat menyiratkan penetapan isi dokumen menjadi sistem hukum, padahal לְהִנָּתֵן דָּת mengacu pada penerbitan atau pemberlakuan dekret resmi. “Dikeluarkan sebagai ketetapan” lebih setia pada fungsi administratifnya.
  - severity: low
    issue: “bersiap untuk hari itu”
    rationale: Teks menyatakan bahwa orang Yahudi harus “siap pada hari itu”; bentuk “bersiap untuk” sedikit menggeser keadaan siap menjadi proses persiapan.
  - severity: low
    issue: “semua suku bangsa”
    rationale: Padanan ini dapat diterima, tetapi “semua bangsa-bangsa”/“semua bangsa” lebih langsung mencerminkan עַמִּים sebagai berbagai bangsa atau kelompok penduduk dalam kekaisaran.
  revised_text: Salinan dokumen tertulis itu harus dikeluarkan sebagai ketetapan di setiap provinsi dan diumumkan kepada semua bangsa, supaya orang Yahudi siap pada hari itu untuk membalas dendam terhadap musuh-musuh mereka.[a]
  revised_footnotes:
  - marker: a
    text: Atau “menuntut pembalasan terhadap musuh-musuh mereka.” Kata kerja Ibrani yang dipakai secara khusus berarti membalas atau menuntut pembalasan, bukan hanya membela diri.
    reason: alternative_reading
  revision_rationale: 'Revisi memperjelas bahwa yang dimaksud ialah salinan suatu dokumen tertulis resmi yang dikeluarkan sebagai dekret/ketetapan. Revisi juga mempertahankan urutan dan daya semantis teks Ibrani: pengumuman umum itu bertujuan agar orang Yahudi siap pada hari yang telah ditetapkan untuk melakukan pembalasan terhadap musuh mereka.'
