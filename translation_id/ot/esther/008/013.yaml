revisions:
- from: Salinan surat itu harus ditetapkan sebagai hukum di setiap provinsi dan diumumkan kepada semua suku bangsa, supaya orang Yahudi bersiap untuk hari itu guna membalas dendam kepada musuh-musuh mereka.[a]
  to: Salinan dokumen tertulis itu harus dikeluarkan sebagai ketetapan di setiap provinsi dan diumumkan kepada semua bangsa, supaya orang Yahudi siap pada hari itu untuk membalas dendam terhadap musuh-musuh mereka.[a]
  rationale: 'Revisi memperjelas bahwa yang dimaksud ialah salinan suatu dokumen tertulis resmi yang dikeluarkan sebagai dekret/ketetapan. Revisi juga mempertahankan urutan dan daya semantis teks Ibrani: pengumuman umum itu bertujuan agar orang Yahudi siap pada hari yang telah ditetapkan untuk melakukan pembalasan terhadap musuh mereka.'
