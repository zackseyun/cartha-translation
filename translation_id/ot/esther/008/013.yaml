source:
  edition: WLC
  text: פַּתְשֶׁ֣גֶן הַ/כְּתָ֗ב לְ/הִנָּ֤תֵֽן דָּת֙ בְּ/כָל מְדִינָ֣ה וּ/מְדִינָ֔ה גָּל֖וּי לְ/כָל הָ/עַמִּ֑ים וְ/לִ/הְי֨וֹת ה/יהודיים עתודים לַ/יּ֣וֹם הַ/זֶּ֔ה לְ/הִנָּקֵ֖ם מֵ/אֹיְבֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/008/013.yaml
  text: A copy of the written decree was to be issued as law in every province and province[a], being made public to all the peoples[d][c][b], and so that the Jews would be ready on that day to avenge themselves on their enemies.
translation:
  language: id
  text: Salinan dokumen tertulis itu harus dikeluarkan sebagai ketetapan di setiap provinsi dan diumumkan kepada semua bangsa, supaya orang Yahudi siap pada hari itu untuk membalas dendam terhadap musuh-musuh mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menuntut pembalasan terhadap musuh-musuh mereka.” Kata kerja Ibrani yang dipakai secara khusus berarti membalas atau menuntut pembalasan, bukan hanya membela diri.
    reason: alternative_reading
lexical_decisions:
- source_word: פַּתְשֶׁגֶן הַכְּתָב
  choice: salinan surat itu
  rationale: Kata serapan Persia פַּתְשֶׁגֶן menunjuk pada salinan resmi, sedangkan הַכְּתָב menunjuk pada tulisan atau surat yang memuat ketetapan. Dalam konteks administrasi kerajaan, 'salinan surat itu' jelas dan wajar dalam bahasa Indonesia.
- source_word: לְהִנָּתֵן דָּת
  choice: harus ditetapkan sebagai hukum
  rationale: Ungkapan ini menyatakan bahwa isi surat tersebut diberlakukan sebagai ketetapan yang mengikat. 'Ditetapkan sebagai hukum' mempertahankan daya legal דָּת dan fungsi bentuk infinitif dalam konstruksi ini.
- source_word: בְּכָל מְדִינָה וּמְדִינָה
  choice: di setiap provinsi
  rationale: Pengulangan harfiah 'provinsi dan provinsi' merupakan ungkapan distributif Ibrani. Bahasa Indonesia menyampaikannya secara alami dengan 'di setiap provinsi' tanpa kehilangan cakupan menyeluruh.
- source_word: גָּלוּי לְכָל הָעַמִּים
  choice: diumumkan kepada semua suku bangsa
  rationale: גָּלוּי berarti dibuat terbuka atau diketahui umum; dalam konteks surat kerajaan, 'diumumkan' menyatakan publikasi resmi. Bentuk jamak עַמִּים menunjuk pada beragam kelompok etnis dalam kekaisaran, sehingga 'semua suku bangsa' mempertahankan nuansa tersebut.
- source_word: וְלִהְיוֹת הַיְּהוּדִים עֲתוּדִים
  choice: supaya orang Yahudi bersiap
  rationale: Konstruksi infinitif menyatakan tujuan, sementara עֲתוּדִים berarti siap atau dipersiapkan. Bentuk verbal 'bersiap' menghasilkan kalimat Indonesia yang alami.
- source_word: לַיּוֹם הַזֶּה
  choice: untuk hari itu
  rationale: Secara harfiah berarti 'untuk hari ini/itu' dan mengacu pada tanggal yang telah ditentukan dalam titah. 'Hari itu' mengikuti sudut pandang narasi Indonesia.
- source_word: לְהִנָּקֵם מֵאֹיְבֵיהֶם
  choice: guna membalas dendam kepada musuh-musuh mereka
  rationale: Bentuk Niphal נקם berarti membalas dendam atau menuntut pembalasan bagi diri sendiri. Terjemahan ini mempertahankan daya leksikalnya dan tidak memperlunaknya menjadi sekadar 'membela diri'.
theological_decisions:
- issue: Kemungkinan memperlunak bahasa pembalasan yang keras
  choice: membalas dendam kepada musuh-musuh mereka
  alternative: membela diri terhadap musuh-musuh mereka
  rationale: Konteks lebih luas memang mencakup perlindungan diri, tetapi kata kerja נקם dalam ayat ini secara khusus menyatakan tindakan membalas atau menuntut pembalasan. Terjemahan tidak boleh menghapus ketegangan moral dan teologis dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat administratif dipertahankan tetapi dibuat alami. Ungkapan distributif Ibrani diterjemahkan secara idiomatis sebagai 'setiap provinsi'; bahasa pembalasan dipertahankan tanpa diperhalus.
