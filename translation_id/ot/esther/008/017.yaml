revisions:
- from: Di setiap provinsi dan di setiap kota, di mana pun titah raja dan ketetapannya sampai, orang-orang Yahudi bersukacita dan bergembira, mengadakan perjamuan dan merayakan hari raya. Banyak orang dari berbagai bangsa di negeri itu menjadi orang Yahudi[a], sebab mereka telah diliputi ketakutan terhadap orang Yahudi.
  to: Di setiap provinsi dan di setiap kota, di mana pun titah raja dan ketetapannya sampai, ada sukacita dan kegembiraan bagi orang-orang Yahudi, perjamuan dan hari perayaan. Banyak orang dari bangsa-bangsa di negeri itu menjadi orang Yahudi[a], sebab ketakutan terhadap orang-orang Yahudi telah menimpa mereka.
  rationale: Revisi ini mempertahankan penghalusan distributif Ibrani sebagai "di setiap", tetapi membatasi penambahan makna, menghindari kemungkinan penyempitan "hari raya", dan mencerminkan rangkaian nominal teks sumber dengan lebih dekat. Catatan kaki tetap diperlukan karena makna tepat מִתְיַהֲדִים diperdebatkan secara leksikal dan konteks tidak merinci bentuk pengidentifikasian diri tersebut.
