base_translation:
  language: en
  yaml_path: translation/ot/esther/008/017.yaml
  text: And in every province and province, and in every city and city, wherever the king’s word and his decree reached, there was joy and gladness for the Jews, a feast and a good day. And many from the peoples of the land were becoming Jews, because the fear of the Jews had fallen on them.
translation:
  language: id
  text: Di setiap provinsi dan di setiap kota, di mana pun titah raja dan ketetapannya sampai, ada sukacita dan kegembiraan bagi orang-orang Yahudi, perjamuan dan hari perayaan. Banyak orang dari bangsa-bangsa di negeri itu menjadi orang Yahudi[a], sebab ketakutan terhadap orang-orang Yahudi telah menimpa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat berarti bahwa mereka menjadikan diri atau mengaku sebagai orang Yahudi; teks tidak menjelaskan proses maupun ketulusan tindakan mereka.
    reason: Menjaga ambiguitas bentuk מִתְיַהֲדִים dan menghindari asumsi tentang pertobatan atau prosedur formal.
lexical_decisions:
- source_word: מְדִינָה וּמְדִינָה / עִיר וָעִיר
  choice: di setiap provinsi / di setiap kota
  rationale: Pengulangan distributif Ibrani secara alami menyatakan ‘setiap’; mempertahankan maknanya tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: titah raja dan ketetapannya
  rationale: דבר dalam konteks kerajaan berarti titah atau perintah resmi, sedangkan דת menunjuk ketetapan atau dekret.
- source_word: מִשְׁתֶּה וְיוֹם טוֹב
  choice: mengadakan perjamuan dan merayakan hari raya
  rationale: Mengungkapkan secara idiomatis pesta perjamuan dan hari perayaan; יוֹם טוֹב secara harfiah ‘hari baik’ tetapi dalam konteks ini merupakan hari perayaan.
- source_word: מִתְיַהֲדִים
  choice: menjadi orang Yahudi
  rationale: Bentuk hitpael denominatif ini paling langsung menyatakan bahwa mereka menjadikan diri atau tampil sebagai orang Yahudi; nuansa tepatnya tetap dijelaskan dalam catatan kaki.
- source_word: נָפַל פַּחַד הַיְּהוּדִים עֲלֵיהֶם
  choice: mereka telah diliputi ketakutan terhadap orang Yahudi
  rationale: Idiom ‘ketakutan jatuh atas mereka’ dialihkan secara wajar ke bahasa Indonesia sambil mempertahankan sebab tindakan mereka.
theological_decisions:
- issue: Makna tindakan מִתְיַהֲדִים
  choice: menjadi orang Yahudi
  alternative: mengaku sebagai orang Yahudi / berpihak kepada orang Yahudi
  rationale: Kata tersebut dapat menunjuk pengidentifikasian diri sebagai Yahudi, mungkin karena takut, tanpa teks merinci ketulusan, proses, atau isi perpindahan agama. Terjemahan utama mengikuti arti leksikal langsung dan catatan kaki menjaga ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur distributif Ibrani dinaturalkan menjadi ‘setiap’, sementara pasangan ‘bersukacita dan bergembira’ mempertahankan gaya perayaan teks. Semua penanda catatan kaki dalam teks memiliki catatan yang sesuai.
