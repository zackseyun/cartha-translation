base_translation:
  language: en
  yaml_path: translation/ot/esther/008/010.yaml
  text: He wrote in the name of King Ahasuerus[a], sealed it with the king’s signet ring, and sent letters by couriers on horses, riding the royal steeds bred from swift stock.
translation:
  language: id
  text: Ia menulis atas nama Raja Ahasyweros, memeteraikannya dengan cincin meterai raja, dan mengirim surat-surat melalui para kurir berkuda yang menunggang kuda-kuda tunggangan, akhasyteranim, keturunan ramakhim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk hewan tunggangan dalam frasa ini langka dan maknanya tidak pasti. Secara lebih harfiah, frasa itu berbunyi, “kuda-kuda tunggangan, akhasyteranim, keturunan ramakhim.” Istilah-istilah tersebut mungkin menunjuk pada hewan dari peternakan kerajaan atau layanan pos kerajaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Ia menulis
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; bentuk lampau dalam bahasa Ibrani wajar diterjemahkan dengan verba naratif bahasa Indonesia tanpa penanda waktu tambahan.
- source_word: בְּשֵׁם הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: atas nama Raja Ahasyweros
  rationale: Ungkapan בְּשֵׁם menunjukkan bahwa tindakan itu dilakukan dengan memakai wewenang resmi raja; “atas nama” merupakan padanan Indonesia yang alami.
- source_word: וַיַּחְתֹּם בְּטַבַּעַת הַמֶּלֶךְ
  choice: memeteraikan surat-surat itu dengan cincin meterai raja
  rationale: Dalam lingkungan kerajaan, טַבַּעַת adalah cincin yang digunakan untuk membubuhkan meterai. Objek dijelaskan sebagai surat-surat yang disebut sesudahnya; bentuk tunggal Ibrani dapat memandang dokumen keputusan itu secara kolektif.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: lalu mengirimkannya
  rationale: סְפָרִים menunjuk pada surat atau dokumen resmi. Pronomina “-nya” merujuk kembali kepada “surat-surat itu” agar kalimat tidak berulang.
- source_word: בְּיַד הָרָצִים בַּסּוּסִים
  choice: melalui para pesuruh berkuda
  rationale: בְּיַד menyatakan perantaraan, sedangkan הָרָצִים dalam konteks ini adalah pembawa pesan kerajaan. “Pesuruh berkuda” menyampaikan fungsi mereka dan sarana perjalanannya secara alami.
- source_word: רֹכְבֵי הָרֶכֶשׁ
  choice: yang menunggang kuda-kuda kerajaan
  rationale: רֹכְבֵי adalah partisip yang menerangkan para pesuruh. רֶכֶשׁ merupakan istilah langka bagi hewan tunggangan pilihan; konteks istana mendukung “kuda-kuda kerajaan” tanpa memastikan jenis hewan secara berlebihan.
- source_word: הָאֲחַשְׁתְּרָנִים בְּנֵי הָרַמָּכִים
  choice: hasil pembiakan dari kuda-kuda betina pilihan
  rationale: Kedua istilah ini langka dan sukar dipastikan. בְּנֵי secara harfiah berarti “anak-anak/keturunan,” dan רַמָּכִים kemungkinan menunjuk pada kuda betina atau ternak pembiakan. Terjemahan ini mempertahankan gagasan keturunan sambil menandai mutu hewan dalam konteks layanan kerajaan.
