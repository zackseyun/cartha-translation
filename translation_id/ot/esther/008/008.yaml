translation_notes:
  register: Bahasa Indonesia baku, modern, dan berwibawa. Bentuk “kalian” dipakai untuk memperlihatkan bahwa sapaan Ibrani berbentuk jamak. Istilah administratif “dokumen,” “atas nama raja,” dan “cincin meterai” dipilih agar jelas bagi pembaca masa kini tanpa menghilangkan warna kerajaan kuno.
