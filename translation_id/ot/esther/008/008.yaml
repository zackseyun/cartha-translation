  naturalness: '"Memeteraikan" adalah bentuk baku yang tepat, tetapi imperatif "meteraikanlah itu" kurang alami dalam ragam Indonesia modern. "Bubuhilah meterai ... pada surat itu" lebih idiomatis dalam konteks administrasi kuno dan tetap menyatakan tindakan yang sama.'
  terminology: '"Orang Yahudi", "atas nama raja", "cincin meterai raja", dan "ditarik kembali" sesuai dengan konteks dan istilah sumber. "Surat" pada perintah pertama wajar sebagai objek tersirat dari tindakan menulis dan pemeteraian; pada prinsip umum, "dokumen" mempertahankan keluasan כְּתָב.'
