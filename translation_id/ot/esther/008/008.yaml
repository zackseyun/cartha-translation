revisions:
- from: Namun, tulislah mengenai orang Yahudi apa yang kalian pandang baik,[a] atas nama raja, lalu meteraikanlah itu dengan cincin meterai raja. Sebab, dokumen yang ditulis atas nama raja dan dimeteraikan dengan cincin meterai raja tidak dapat ditarik kembali.[b]
  to: Namun, tulislah tentang orang Yahudi menurut apa yang kalian anggap baik, atas nama raja, lalu bubuhilah meterai raja pada surat itu dengan cincin meterai raja. Sebab, dokumen yang ditulis atas nama raja dan dimeteraikan dengan cincin meterai raja tidak dapat ditarik kembali.[a]
  rationale: Revisi memperjelas bahwa idiom Ibrani menyatakan pertimbangan atau keleluasaan pihak yang disapa, bukan mutu isi tulisan tentang orang Yahudi. Ungkapan pemeteraian juga dibuat lebih alami tanpa mengubah makna. Catatan a pada draft dihapus karena keterangan tentang idiom tersebut kini cukup jelas dalam teks utama; catatan yang tersisa dipindahkan ke penanda a dan menjelaskan alternatif untuk 'tidak dapat ditarik kembali'.
