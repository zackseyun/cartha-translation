base_translation:
  language: en
  yaml_path: translation/ot/esther/008/008.yaml
  text: But you may write concerning the Jews as seems good in your eyes[a], in the king’s name, and seal it with the king’s signet ring[b], for a document that is written in the king’s name and sealed with the king’s signet ring cannot be revoked.
translation:
  language: id
  text: Namun, tulislah tentang orang Yahudi menurut apa yang kalian anggap baik, atas nama raja, lalu bubuhilah meterai raja pada surat itu dengan cincin meterai raja. Sebab, dokumen yang ditulis atas nama raja dan dimeteraikan dengan cincin meterai raja tidak dapat ditarik kembali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak dapat dibatalkan.” Secara harfiah, ungkapan Ibraninya berarti bahwa dokumen kerajaan semacam itu tidak dapat ditarik kembali atau dibatalkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Namun, ... kalian
  rationale: Konjungsi dan pronomina jamak yang eksplisit menandai kontras dengan ketetapan sebelumnya; “Namun” menyatakan daya adversatif secara wajar, sedangkan “kalian” mempertahankan orang kedua jamak.
- source_word: כִּתְבוּ
  choice: tulislah
  rationale: Bentuk imperatif jamak dipertahankan sebagai perintah sekaligus pemberian wewenang kerajaan.
- source_word: עַל הַיְּהוּדִים
  choice: mengenai orang Yahudi
  rationale: Preposisi עַל memperkenalkan pokok yang ditulis; “mengenai” mempertahankan keluasan makna tanpa mempersempitnya menjadi semata-mata “demi” mereka.
- source_word: כַּטּוֹב בְּעֵינֵיכֶם
  choice: apa yang kalian pandang baik
  rationale: Ungkapan ini mempertahankan citra penglihatan dari idiom Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּשֵׁם הַמֶּלֶךְ
  choice: atas nama raja
  rationale: Ungkapan Indonesia yang lazim untuk tindakan resmi berdasarkan nama dan kewenangan raja.
- source_word: וְחִתְמוּ
  choice: lalu meteraikanlah itu
  rationale: Verba berarti membubuhkan meterai; objek “itu” merujuk secara alami kepada dokumen yang diperintahkan untuk ditulis.
- source_word: בְּטַבַּעַת הַמֶּלֶךְ
  choice: dengan cincin meterai raja
  rationale: Dalam konteks administrasi kerajaan, טַבַּעַת adalah cincin yang digunakan untuk membubuhkan meterai resmi.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dengan hubungan logis yang jelas.
- source_word: כְתָב
  choice: dokumen
  rationale: Istilah ini cukup umum untuk tulisan resmi dan tidak mempersempit makna menjadi “maklumat” atau “dekret”.
- source_word: אֲשֶׁר נִכְתָּב ... וְנַחְתּוֹם
  choice: yang ditulis ... dan dimeteraikan
  rationale: Dua bentuk pasif yang sejajar dipertahankan untuk menyampaikan prinsip hukum umum.
- source_word: אֵין לְהָשִׁיב
  choice: tidak dapat ditarik kembali
  rationale: Ungkapan harfiahnya menyatakan bahwa dokumen itu tidak dapat dibuat kembali atau dibatalkan; “ditarik kembali” sesuai dengan konteks dokumen resmi dan mempertahankan gagasan penarikan.
