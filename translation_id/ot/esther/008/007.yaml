  to: Kemudian Raja Ahasyweros berkata kepada Ratu Ester dan kepada Mordekhai, orang Yahudi itu, “Lihatlah, rumah Haman telah kuberikan kepada Ester, dan Haman telah mereka gantung pada tiang kayu[a] karena ia mengulurkan tangannya terhadap orang-orang Yahudi.”
