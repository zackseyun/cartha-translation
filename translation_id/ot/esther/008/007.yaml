translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ucapan raja memakai bentuk terikat “kuberi-” yang alami tanpa menjadi terlalu resmi. Terjemahan mempertahankan pelaku jamak tak tentu pada tindakan menggantung dan tidak memastikan bentuk sarana eksekusi melebihi keterangan teks Ibrani.
