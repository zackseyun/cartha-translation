base_translation:
  language: en
  yaml_path: translation/ot/esther/008/007.yaml
  text: Then King Ahasuerus said to Queen Esther and to Mordecai the Jew[a], “Look, I have given Haman’s house to Esther, and they have hanged him on the gallows because he stretched out his hand against the Jews.”
translation:
  language: id
  text: Kemudian Raja Ahasyweros berkata kepada Ratu Ester dan kepada Mordekhai, orang Yahudi itu, “Lihatlah, rumah Haman telah kuberikan kepada Ester, dan Haman telah mereka gantung pada tiang kayu[a] karena ia mengulurkan tangannya terhadap orang-orang Yahudi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada pohon/kayu.” Yang dimaksud ialah sarana eksekusi, tetapi bentuk tepatnya tidak dijelaskan dalam teks Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menyampaikan alur itu secara alami dalam bahasa Indonesia.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרֹשׁ
  choice: Raja Ahasyweros
  rationale: Susunan gelar sebelum nama wajar dalam bahasa Indonesia; ejaan nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: kepada Ratu Ester
  rationale: Menyampaikan gelar kerajaan secara lengkap dengan susunan Indonesia yang alami.
- source_word: וּלְמָרְדֳּכַי הַיְּהוּדִי
  choice: dan Mordekhai, orang Yahudi itu
  rationale: Sebutan ini mengidentifikasi Mordekhai sebagai orang Yahudi yang sudah dikenal dalam narasi; “orang Yahudi” lebih alami dan cukup luas daripada “orang Yudea” dalam konteks ini.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan daya penunjuk dan penegasan kata Ibrani dalam ragam modern yang tetap bermartabat.
- source_word: בֵית הָמָן
  choice: rumah Haman
  rationale: Menerjemahkan frasa konstruksi secara dekat. Dalam konteks, “rumah” dapat mencakup harta milik atau rumah tangga Haman tanpa mempersempitnya secara tidak perlu.
- source_word: נָתַתִּי
  choice: telah kuberikan
  rationale: Perfek menyatakan tindakan yang sudah selesai dan hasilnya masih berlaku; bentuk ini alami dalam ucapan langsung bahasa Indonesia.
- source_word: וְאֹתוֹ תָּלוּ
  choice: Haman telah mereka gantung
  rationale: Bahasa Ibrani memakai orang ketiga jamak dengan pelaku yang tidak disebutkan. Susunan ini mempertahankan pelaku tak tentu sekaligus memperjelas rujukan pronomina.
- source_word: עַל הָעֵץ
  choice: pada tiang kayu[a]
  rationale: עֵץ secara dasar berarti pohon atau kayu. Dalam konteks ini yang dimaksud ialah sarana eksekusi, tetapi bentuk tepatnya tidak dinyatakan; “tiang kayu” lebih netral daripada “tiang gantungan”.
- source_word: עַל אֲשֶׁר
  choice: karena
  rationale: Gabungan ini memperkenalkan alasan hukuman dan paling jelas disampaikan dengan “karena”.
- source_word: שָׁלַח יָדוֹ
  choice: ia mengulurkan tangannya untuk mencelakakan
  rationale: Mempertahankan gambaran idiom Ibrani sambil menjelaskan arah tindakan bermusuhan agar mudah dipahami.
- source_word: ביהודיים
  choice: orang-orang Yahudi
  rationale: Sebutan etnis ini konsisten dengan pemakaiannya dalam kitab Ester dan alami dalam bahasa Indonesia.
