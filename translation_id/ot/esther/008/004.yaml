translation:
  language: id
  text: Kemudian raja mengulurkan tongkat kerajaan emas kepada Ester, lalu Ester bangkit dan berdiri di hadapan raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשֶׁט
  choice: mengulurkan
  rationale: Kata kerja ini menyatakan tindakan merentangkan atau mengarahkan suatu benda kepada seseorang. “Mengulurkan” alami dalam bahasa Indonesia dan tepat untuk tindakan raja dengan tongkat kerajaan.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: tongkat emasnya
  rationale: Frasa ini menunjuk pada tongkat kerajaan dari emas atau berpenampilan keemasan. Akhiran “-nya” secara alami menandai bahwa tongkat tersebut milik raja, sesuai konteks, tanpa perlu mengulang “kerajaan” yang tidak dinyatakan secara eksplisit dalam frasa Ibrani.
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Kata ini berarti bangun atau berdiri dari posisi sebelumnya. “Bangkit” mempertahankan gaya naratif yang ringkas dan membedakannya dari kata kerja berikutnya, “berdiri”.
- source_word: וַתַּעֲמֹד לִפְנֵי הַמֶּלֶךְ
  choice: berdiri di hadapan raja
  rationale: Ungkapan לִפְנֵי berarti “di hadapan” atau “dalam kehadiran”. Terjemahan ini alami, bermartabat, dan mempertahankan suasana resmi istana.
- source_word: וַ
  choice: Kemudian ... lalu
  rationale: Waw konsekutif menggerakkan urutan narasi. “Kemudian” dan “lalu” menyampaikan rangkaian tindakan secara wajar dalam bahasa Indonesia modern.
- source_word: לְאֶסְתֵּר
  choice: kepada Ester
  rationale: Preposisi ini menandai arah atau penerima tindakan raja. “Kepada Ester” merupakan padanan Indonesia yang alami.
