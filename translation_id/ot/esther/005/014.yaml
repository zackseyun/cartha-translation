base_translation:
  language: en
  yaml_path: translation/ot/esther/005/014.yaml
  text: Then Zeresh his wife and all his friends said to him[a], “Let a gallows fifty cubits high be made, and in the morning tell the king to have Mordecai hanged on it. Then go with the king to the banquet rejoicing.” The matter pleased Haman[c][b], and he made the gallows.
translation:
  language: id
  text: Kemudian Zeres, istrinya, dan semua sahabatnya berkata kepadanya, “Hendaklah dibuat sebuah tiang gantungan[a] setinggi lima puluh hasta[b]. Pada pagi hari, katakanlah kepada raja agar Mordekhai digantung[c] pada tiang itu. Lalu pergilah bersama raja ke perjamuan dengan gembira.” Usul itu dipandang baik oleh Haman, lalu ia membuat tiang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pancang” atau “tiang kayu.” Kata Ibrani עֵץ dapat berarti kayu, pohon, tiang, atau struktur kayu untuk pelaksanaan hukuman; bentuk tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Lima puluh hasta kira-kira 23 meter.
    reason: cultural_note
  - marker: c
    text: Atau “Mordekhai ditusukkan pada tiang itu.” Struktur kayu dan cara pelaksanaan hukuman yang dimaksud dalam konteks ini tidak pasti; kemungkinan penggantungan atau pemancangan diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֲבָיו
  choice: semua sahabatnya
  rationale: Secara harfiah berarti ‘orang-orang yang mengasihinya’, tetapi dalam konteks pergaulan istana menunjuk kepada para sahabat atau rekan dekat Haman. ‘Sahabatnya’ alami dalam bahasa Indonesia modern.
- source_word: יַעֲשׂוּ
  choice: Suruhlah orang membuat
  rationale: Bentuk jamak dengan pelaku yang tidak disebut menyampaikan suatu usul. Ungkapan ini mempertahankan ketidakjelasan pelaku sambil terdengar alami dalam bahasa Indonesia.
- source_word: עֵץ
  choice: tiang gantungan
  rationale: Kata ini dapat berarti pohon, kayu, tiang, atau bangunan kayu. Dalam konteks ini jelas merupakan sarana penghukuman dan pameran jasad, tetapi bentuk tepatnya tidak pasti; alternatif dijelaskan dalam catatan kaki.
- source_word: גָּבֹהַּ חֲמִשִּׁים אַמָּה
  choice: setinggi lima puluh hasta
  rationale: Satuan kuno dipertahankan dalam teks utama, sedangkan perkiraan metrik diberikan dalam catatan kaki agar tidak menimbulkan kesan ketepatan semu.
- source_word: וּבַבֹּקֶר
  choice: Pada pagi hari
  rationale: Menerjemahkan keterangan waktu secara langsung tanpa menambahkan ‘besok’, yang tersirat oleh alur tetapi tidak dinyatakan secara eksplisit.
- source_word: אֱמֹר לַמֶּלֶךְ
  choice: katakanlah kepada raja
  rationale: Mempertahankan arti dasar verba ‘berkata/mengatakan’ tanpa mengubahnya secara interpretatif menjadi ‘meminta’.
- source_word: וְיִתְלוּ אֶת־מָרְדֳּכַי עָלָיו
  choice: agar Mordekhai digantung pada tiang itu
  rationale: Bentuk pasif alami dalam bahasa Indonesia untuk tindakan oleh pelaksana yang tidak disebut. Kemungkinan bahwa tindakan itu berupa pemancangan dipertahankan dalam catatan kaki.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: Istilah ini cocok untuk jamuan kerajaan dan tetap wajar serta bermartabat dalam bahasa Indonesia modern.
- source_word: שָׂמֵחַ
  choice: dengan gembira
  rationale: Adjektiva ini berfungsi secara adverbial dan menggambarkan keadaan hati Haman ketika pergi ke perjamuan.
- source_word: וַיִּיטַב הַדָּבָר לִפְנֵי הָמָן
  choice: Usul itu dipandang baik oleh Haman
  rationale: Menyampaikan idiom Ibrani bahwa gagasan tersebut baik atau berkenan dalam pandangan Haman, tanpa menambah intensitas emosional.
- source_word: וַיַּעַשׂ הָעֵץ
  choice: ia membuat tiang tersebut
  rationale: Mengikuti bentuk aktif sederhana dalam sumber dan tidak memastikan apakah Haman mengerjakannya sendiri atau mengatur agar orang lain mengerjakannya.
theological_decisions:
- issue: Cara tepat pelaksanaan hukuman
  choice: digantung pada tiang itu
  alternative: dipancangkan atau ditusukkan pada tiang itu
  rationale: Verba תלה menyatakan menggantungkan atau menaruh dalam keadaan tergantung, sedangkan konteks Persia dan kata עֵץ memungkinkan pemancangan. Teks utama memakai padanan yang paling langsung dan lazim, sementara ketidakpastian historis-leksikal dijaga dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama diri mengikuti bentuk Indonesia yang lazim: Zeres dan Mordekhai. Struktur kalimat dibuat alami tanpa menghilangkan pengulangan ‘tiang’ yang penting bagi alur dan ironi narasi.'
