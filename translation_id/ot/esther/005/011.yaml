  text: וַ/יְסַפֵּ֨ר לָ/הֶ֥ם הָמָ֛ן אֶת כְּב֥וֹד עָשְׁר֖/וֹ וְ/רֹ֣ב בָּנָ֑י/ו וְ/אֵת֩ כָּל אֲשֶׁ֨ר גִּדְּל֤/וֹ הַ/מֶּ֨לֶךְ֙ וְ/אֵ֣ת אֲשֶׁ֣ר נִשְּׂא֔/וֹ עַל הַ/שָּׂרִ֖ים וְ/עַבְדֵ֥י הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/011.yaml
  text: And Haman told them of the glory of his wealth[a], and the multitude of his sons, and all that the king had done to make him great[d][c][b], and how he had exalted him above the officials and servants of the king.
translation:
  language: id
  text: Lalu Haman menceritakan kepada mereka tentang kemegahan kekayaannya[a], banyaknya putra-putranya[b], segala sesuatu yang telah dilakukan raja untuk menjadikannya orang besar[c], dan bagaimana raja mengangkatnya di atas para pejabat dan para pelayan raja[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemuliaan kekayaannya.” Ungkapan Ibrani ini menekankan kemegahan yang berkaitan dengan kekayaan Haman.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara khusus menyebut putra-putra, bukan anak-anak secara umum.
    reason: lexical_clarification
  - marker: c
    text: Atau “segala yang telah dilakukan raja untuk membesarkan kedudukannya” atau “segala yang telah dilakukan raja untuk mengangkatnya menjadi orang besar.”
    reason: lexical_alternative
  - marker: d
    text: Atau “meninggikannya di atas para pejabat dan para pelayan raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: menceritakan kepada mereka
  rationale: Bentuk wayyiqtol dari ספר menyatakan bahwa Haman menuturkan atau memaparkan hal-hal itu kepada para pendengarnya. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa pelaporan.
- source_word: כְּבוֹד עָשְׁרוֹ
  choice: kemegahan kekayaannya
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau kemegahan; ketika dikaitkan dengan kekayaan, frasa ini menonjolkan kebesaran dan kesan mengagumkan dari kekayaan Haman.
- source_word: רֹב בָּנָיו
  choice: banyaknya anak laki-lakinya
  rationale: רֹב menyatakan jumlah atau kelimpahan, sedangkan בָּנָיו secara khusus berarti anak-anak laki-lakinya, bukan anak-anak secara umum.
- source_word: גִּדְּלוֹ
  choice: menjadikannya besar
  rationale: 'Bentuk Piel dari גדל di sini bersifat kausatif: raja membuat Haman menjadi besar atau terkemuka. Terjemahan ini mempertahankan ungkapan Ibrani tanpa membatasi maknanya hanya pada kenaikan jabatan formal.'
- source_word: נִשְּׂאוֹ עַל
  choice: mengangkatnya lebih tinggi daripada
  rationale: נשא dengan עַל dalam konteks ini menggambarkan pengangkatan dalam kedudukan sehingga Haman berada di atas orang-orang lain.
- source_word: הַשָּׂרִים
  choice: para pejabat
  rationale: שָׂרִים dapat menunjuk para penguasa, pembesar, atau pejabat. Dalam lingkungan istana Persia, 'para pejabat' jelas dan tidak menyiratkan bahwa mereka pasti bangsawan berdasarkan keturunan.
- source_word: עַבְדֵי הַמֶּלֶךְ
  choice: pelayan raja
  rationale: Frasa ini secara harfiah menunjuk orang-orang yang melayani raja. 'Pelayan raja' mempertahankan hubungan pelayanan tanpa secara tidak perlu menentukan status mereka sebagai budak atau pegawai administratif.
