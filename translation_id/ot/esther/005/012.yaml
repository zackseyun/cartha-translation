base_translation:
  language: en
  yaml_path: translation/ot/esther/005/012.yaml
  text: Then Haman said[a], “Indeed, Queen Esther brought no one with the king to the banquet she prepared except me[b]; and tomorrow also I am invited by her together with the king.”
translation:
  language: id
  text: Lalu Haman berkata, “Bahkan Ratu Ester tidak membawa seorang pun selain aku bersama raja ke perjamuan yang diadakannya. Besok pun aku diundang olehnya bersama raja.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אַף לֹא
  choice: Bahkan ... tidak ... seorang pun
  rationale: Gabungan ini memberi penekanan pada kebanggaan Haman bahwa Ester tidak menyertakan orang lain.
- source_word: הֵבִיאָה
  choice: mengundang ... untuk menyertai
  rationale: Secara harfiah berarti “membawa/menyebabkan datang,” tetapi dalam konteks perjamuan, rumusan ini menyampaikan tindakan mengundang sekaligus mempertahankan gagasan datang bersama raja.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Urutan gelar sebelum nama paling alami dalam bahasa Indonesia dan mempertahankan kedudukannya.
- source_word: עִם הַמֶּלֶךְ
  choice: menyertai raja / bersama raja
  rationale: Kedua rumusan menyatakan kehadiran Haman bersama raja; variasi dipakai agar kalimat alami tanpa mengubah hubungan maknanya.
- source_word: אֶל הַמִּשְׁתֶּה
  choice: ke perjamuan
  rationale: מִשְׁתֶּה menunjuk pada jamuan makan-minum; “perjamuan” sesuai dengan latar istana dan register naratif yang bermartabat.
- source_word: אֲשֶׁר עָשָׂתָה
  choice: yang diadakannya
  rationale: Secara harfiah “yang dibuatnya”; untuk sebuah perjamuan, “diadakan” merupakan ungkapan Indonesia yang idiomatis dan tetap menunjukkan Ester sebagai penyelenggara.
- source_word: כִּי אִם אוֹתִי
  choice: selain aku
  rationale: Konstruksi ini menyatakan pengecualian atau eksklusivitas dan berpasangan alami dengan “tidak ... seorang pun.”
- source_word: וְגַם לְמָחָר
  choice: Besok pun
  rationale: “Pun” mempertahankan daya tambah וְגַם dan menonjolkan kelanjutan kebanggaan Haman.
- source_word: קָרוּא
  choice: diundang
  rationale: Secara harfiah “dipanggil,” tetapi dalam konteks perjamuan bentuk ini secara idiomatis berarti “diundang.”
- source_word: לָהּ
  choice: olehnya
  rationale: Dalam konstruksi ini lamed menunjukkan Ester sebagai pihak yang mengeluarkan undangan; “olehnya” menyatakannya dengan jelas.
