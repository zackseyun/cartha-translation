id: EST.5.8
reference: Esther 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם מָצָ֨אתִי חֵ֜ן בְּ/עֵינֵ֣י הַ/מֶּ֗לֶךְ וְ/אִם עַל הַ/מֶּ֨לֶךְ֙ ט֔וֹב לָ/תֵת֙ אֶת שְׁאֵ֣לָתִ֔/י וְ/לַ/עֲשׂ֖וֹת אֶת בַּקָּשָׁתִ֑/י יָב֧וֹא הַ/מֶּ֣לֶךְ וְ/הָמָ֗ן אֶל הַ/מִּשְׁתֶּה֙ אֲשֶׁ֣ר אֶֽעֱשֶׂ֣ה לָ/הֶ֔ם וּ/מָחָ֥ר אֶֽעֱשֶׂ֖ה כִּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/008.yaml
  text: If I have found favor in the eyes of the king[a], and if it pleases the king to grant my petition and fulfill my request, let the king and Haman come to the banquet that I will prepare for them[b], and tomorrow I will do according to the king’s word.
translation:
  language: id
  text: Jika aku mendapat perkenanan di mata raja,[a] dan jika raja berkenan mengabulkan permohonanku dan memenuhi permintaanku, hendaklah raja dan Haman datang ke perjamuan yang akan kuadakan bagi mereka. Besok aku akan melakukan sesuai dengan perkataan raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “Jika raja berkenan kepadaku.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini agak eliptis. Kemungkinan maksudnya ialah bahwa Ester akan memenuhi permintaan raja dengan menyampaikan permohonannya pada hari berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֵי
  choice: mendapat perkenanan di mata
  rationale: Mempertahankan gambaran idiom Ibrani tentang penilaian yang baik dalam konteks istana. “Perkenanan” lebih sesuai daripada “anugerah” karena konteksnya tidak secara langsung teologis.
- source_word: עַל הַמֶּלֶךְ טוֹב
  choice: raja berkenan
  rationale: Ungkapan ini menyatakan sesuatu yang baik atau menyenangkan bagi raja. “Raja berkenan” alami dalam bahasa Indonesia dan mempertahankan nada hormat.
- source_word: לָתֵת אֶת שְׁאֵלָתִי
  choice: mengabulkan permohonanku
  rationale: Secara harfiah berarti “memberikan permohonanku,” tetapi dalam bahasa Indonesia permohonan lazimnya “dikabulkan.”
- source_word: וְלַעֲשׂוֹת אֶת בַּקָּשָׁתִי
  choice: memenuhi permintaanku
  rationale: Kata kerja Ibrani berarti “melakukan,” tetapi “memenuhi permintaan” merupakan padanan Indonesia yang wajar sekaligus mempertahankan variasi dari frasa sebelumnya.
- source_word: שְׁאֵלָתִי / בַּקָּשָׁתִי
  choice: permohonan / permintaan
  rationale: Dua kata yang berdekatan maknanya diterjemahkan dengan dua istilah berbeda agar variasi dalam teks Ibrani tetap tampak.
- source_word: יָבֹא
  choice: hendaklah ... datang
  rationale: Bentuk imperfek ini berfungsi sebagai jusif, yakni undangan atau permintaan yang sopan kepada raja dan Haman.
- source_word: הַמִּשְׁתֶּה
  choice: perjamuan
  rationale: Istilah ini menunjuk pada pesta makan-minum; “perjamuan” sesuai dengan suasana resmi istana tanpa menonjolkan unsur minum secara berlebihan.
- source_word: אֲשֶׁר אֶעֱשֶׂה לָהֶם
  choice: yang akan kuadakan bagi mereka
  rationale: Kata Ibrani dasarnya berarti “membuat/melakukan,” tetapi perjamuan secara alami “diadakan” dalam bahasa Indonesia.
- source_word: וּמָחָר אֶעֱשֶׂה כִּדְבַר הַמֶּלֶךְ
  choice: Besok aku akan melakukan sesuai dengan perkataan raja
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani yang agak eliptis dan tidak mempersempit maknanya menjadi “menjawab” atau “menyampaikan permohonan.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan nada hormat yang sesuai bagi percakapan di istana. Citra sumber dipertahankan pada “di mata raja,” sedangkan frasa-frasa lain dibuat alami tanpa menghilangkan keambiguan pada bagian penutup.
