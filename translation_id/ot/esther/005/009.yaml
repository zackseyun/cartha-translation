  text: וַ/יֵּצֵ֤א הָמָן֙ בַּ/יּ֣וֹם הַ/ה֔וּא שָׂמֵ֖חַ וְ/ט֣וֹב לֵ֑ב וְ/כִ/רְאוֹת֩ הָמָ֨ן אֶֽת מָרְדֳּכַ֜י בְּ/שַׁ֣עַר הַ/מֶּ֗לֶךְ וְ/לֹא קָם֙ וְ/לֹא זָ֣ע מִמֶּ֔/נּוּ וַ/יִּמָּלֵ֥א הָמָ֛ן עַֽל מָרְדֳּכַ֖י חֵמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/009.yaml
  text: Haman went out that day joyful and glad of heart. But when Haman saw Mordecai in the king’s gate[a], and that he did not rise or tremble before him, Haman was filled with rage against Mordecai.
translation:
  language: id
  text: Pada hari itu Haman keluar dengan gembira dan hati yang senang. Namun, ketika Haman melihat Mordekhai di gerbang istana raja, Mordekhai tidak berdiri ataupun gemetar di hadapannya[a]. Maka, Haman dipenuhi amarah terhadap Mordekhai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak berdiri ataupun menunjukkan rasa takut kepadanya.”
    reason: Kata Ibrani זָע dapat menunjuk pada gemetar atau pada reaksi takut; konteksnya memungkinkan terjemahan yang lebih idiomatis ini.
lexical_decisions:
- source_word: שָׂמֵחַ וְטוֹב לֵב
  choice: dengan gembira dan senang hati
  rationale: Ungkapan berpasangan ini menyatakan suasana hati yang sangat riang. Terjemahan ini mempertahankan unsur kegembiraan dan idiom hati dalam bahasa Indonesia yang wajar.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Mempertahankan penunjuk waktu yang spesifik dan mengalir alami dalam narasi Indonesia.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: di gerbang istana raja
  rationale: Secara harfiah berarti 'di gerbang raja'; penambahan 'istana' memperjelas bahwa yang dimaksud ialah kompleks gerbang kerajaan, bukan gerbang milik pribadi raja.
- source_word: וְלֹא קָם
  choice: tidak bangkit
  rationale: Kata kerja ini menggambarkan tindakan berdiri sebagai penghormatan. 'Bangkit' ringkas dan mempertahankan nuansa sikap hormat tersebut.
- source_word: וְלֹא זָע מִמֶּנּוּ
  choice: ataupun gemetar di hadapannya
  rationale: Kata זוע dapat berarti gemetar, terguncang, atau bergerak karena takut. Pilihan ini mempertahankan gambaran konkret dan ketegangan leksikal sumber.
- source_word: וַיִּמָּלֵא ... חֵמָה
  choice: dipenuhi amarah
  rationale: Mempertahankan konstruksi Ibrani 'dipenuhi' dan menyampaikan kemarahan yang kuat dengan ungkapan Indonesia yang alami.
- source_word: עַל מָרְדֳּכַי
  choice: terhadap Mordekhai
  rationale: Dengan istilah kemarahan, עַל menandai sasaran amarah; 'terhadap' menyatakannya dengan jelas dan alami.
