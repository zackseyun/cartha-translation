  source_fidelity: 'Makna pokok diterjemahkan dengan setia: Haman keluar dalam keadaan gembira, melihat Mordekhai di gerbang raja, tidak menerima sikap hormat yang diharapkannya, lalu dipenuhi amarah terhadap Mordekhai. Namun, frasa kedua “melihat bahwa” menambahkan pengulangan tindakan melihat yang tidak ada dalam teks Ibrani dan mengaburkan struktur kalimatnya.'
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. “Tidak bangkit” dapat dipahami, tetapi “tidak berdiri” lebih lazim dan jelas dalam bahasa Indonesia modern untuk tindakan berdiri sebagai penghormatan. Kalimat direvisi agar subjek Mordekhai pada kedua tindakan negatif jelas tanpa menambahkan tindakan melihat lagi.
  terminology: Nama “Haman” dan “Mordekhai” konsisten. “Gerbang istana raja” merupakan penjelasan yang dapat diterima bagi gerbang raja dalam konteks kompleks kerajaan. “Amarah terhadap” menyampaikan sasaran kemarahan dengan baik. Catatan kaki mempertahankan alternatif leksikal yang sah untuk זָע.
