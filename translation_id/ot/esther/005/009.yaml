  to: Pada hari itu Haman keluar dengan gembira dan hati yang senang. Namun, ketika Haman melihat Mordekhai di gerbang istana raja, Mordekhai tidak berdiri ataupun gemetar di hadapannya[a]. Maka, Haman dipenuhi amarah terhadap Mordekhai.
  rationale: Revisi menghapus pengulangan verba “melihat” yang tidak dituntut oleh teks sumber, memperjelas bahwa Mordekhai adalah subjek dari kedua tindakan negatif, dan mengganti “bangkit” dengan “berdiri” demi pemakaian modern yang lebih alami. Catatan kaki diselaraskan dengan teks utama yang direvisi dan tetap menjaga alternatif makna yang mungkin.
