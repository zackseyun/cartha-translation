  yaml_path: translation/ot/esther/005/007.yaml
  text: Then Esther answered and said[a], “My petition and my request are:”
translation:
  language: id
  text: Lalu Ester menjawab dan berkata,[a] “Permohonan dan permintaan saya ialah:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lalu Ester menjawab dan berkata, ‘Pertanyaan dan permintaan saya ialah:’” Bahasa Ibrani memakai pasangan resmi dua kata yang maknanya berdekatan untuk menyatakan permohonan Ester.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: Lalu ... menjawab
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan kesinambungan peristiwa secara alami, sedangkan “menjawab” mempertahankan makna verba ענה dalam konteks tanggapan lisan.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַתֹּאמַר
  choice: dan berkata
  rationale: Mempertahankan kedua verba dalam ungkapan Ibrani formal “menjawab dan berkata”, tanpa meleburkannya menjadi satu verba.
- source_word: שְׁאֵלָתִי
  choice: permohonan saya
  rationale: Dalam konteks Ester mengajukan perkara kepada raja, nomina ini lebih tepat dipahami sebagai permohonan daripada pertanyaan, sambil tetap mengakui kemungkinan leksikal lainnya dalam catatan kaki.
- source_word: וּבַקָּשָׁתִי
  choice: dan permintaan saya
  rationale: “Permintaan” menyampaikan arti בקשה sebagai permintaan atau desakan dan menjaga pembedaan halus dari שאלה yang diterjemahkan “permohonan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pasangan verba “menjawab dan berkata” serta nomina “permohonan dan permintaan” dipertahankan untuk mencerminkan gaya formal teks Ibrani. Kata ganti “saya” dipilih karena sufiks Ibrani hanya menyatakan orang pertama dan tidak secara eksplisit memuat nuansa merendahkan diri seperti “hamba”.
