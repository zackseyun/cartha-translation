  text: וַ/יְהִי֩ כִ/רְא֨וֹת הַ/מֶּ֜לֶךְ אֶת אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה עֹמֶ֨דֶת֙ בֶּֽ/חָצֵ֔ר נָשְׂאָ֥ה חֵ֖ן בְּ/עֵינָ֑י/ו וַ/יּ֨וֹשֶׁט הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֗ר אֶת שַׁרְבִ֤יט הַ/זָּהָב֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/תִּקְרַ֣ב אֶסְתֵּ֔ר וַ/תִּגַּ֖ע בְּ/רֹ֥אשׁ הַ/שַּׁרְבִֽיט־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/002.yaml
  text: And when the king saw Esther the queen standing in the court[a], she found favor in his sight, and the king extended to Esther the golden scepter that was in his hand[c][b]. Then Esther came near and touched the top of the scepter.
translation:
  language: id
  text: Ketika raja melihat Ratu Ester berdiri di pelataran[a], Ester mendapat perkenanan di mata raja[b]. Raja pun mengulurkan kepada Ester tongkat kerajaan dari emas yang ada di tangannya. Lalu Ester mendekat dan menyentuh ujung tongkat itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “halaman istana”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia membawa perkenanan di matanya”, sebuah ungkapan yang berarti bahwa raja memandangnya dengan baik.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani: “kepala tongkat itu”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹת
  choice: Ketika ... melihat
  rationale: Konstruksi וַיְהִי dengan infinitif membentuk klausa waktu dalam alur cerita. “Ketika” menyampaikannya secara wajar tanpa terjemahan kaku “terjadilah ketika”.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Walaupun bahasa Ibrani menempatkan nama sebelum gelar, “Ratu Ester” adalah susunan yang alami dalam bahasa Indonesia dan tetap menyampaikan aposisi yang sama.
- source_word: עֹמֶדֶת בֶּחָצֵר
  choice: berdiri di pelataran
  rationale: Partisip עֹמֶדֶת menyatakan posisi Ester, sedangkan חָצֵר dalam konteks istana menunjuk pada pelataran atau halaman istana.
- source_word: נָשְׂאָה חֵן בְּעֵינָיו
  choice: Ester mendapat perkenanan di mata raja
  rationale: Ungkapan ini secara harfiah menggambarkan Ester membawa atau memperoleh perkenanan di mata raja. Pilihan ini mempertahankan citra idiom Ibrani sekaligus tetap dapat dipahami.
- source_word: וַיּוֹשֶׁט
  choice: mengulurkan
  rationale: Kata kerja ini menyatakan tindakan mengulurkan sesuatu ke arah seseorang; “mengulurkan” tepat dan alami dalam konteks ini.
- source_word: שַׁרְבִיט הַזָּהָב
  choice: tongkat kerajaan dari emas
  rationale: שַׁרְבִיט menunjuk pada tongkat lambang kewibawaan raja. “Tongkat kerajaan” lebih mudah dipahami daripada istilah serapan, dan “dari emas” menyatakan bahannya dengan jelas.
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: yang ada di tangannya
  rationale: Klausa relatif ini menjelaskan tongkat yang sedang berada dalam tangan raja tanpa menambahkan tindakan yang tidak dinyatakan sumber.
- source_word: וַתִּקְרַב
  choice: Lalu Ester mendekat
  rationale: Kata kerja ini menyatakan gerakan Ester ke arah raja atau tongkat; “lalu” menandai urutan naratif secara alami.
- source_word: וַתִּגַּע בְּרֹאשׁ הַשַּׁרְבִיט
  choice: menyentuh ujung tongkat itu
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi ketika merujuk pada benda seperti tongkat, “ujung” merupakan padanan Indonesia yang alami dan tidak mengharuskan bentuk tertentu.
