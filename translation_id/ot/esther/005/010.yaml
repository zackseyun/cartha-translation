  text: But Haman restrained himself and went to his house[b][a]. Then he sent and brought in his friends and Zeresh his wife.
translation:
  language: id
  text: Namun, Haman mengendalikan diri[a], lalu pulang ke rumahnya[b]. Kemudian ia mengirim utusan untuk mendatangkan sahabat-sahabatnya dan Zeresh, istrinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menahan diri” atau “mengekang dirinya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “pergi ke rumahnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַפַּק
  choice: menahan dirinya
  rationale: Bentuk hitpael dari אפק menyatakan pengendalian diri, dalam konteks ini terhadap kemarahan Haman. Pilihan ini mempertahankan nuansa refleksif dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: pulang ke rumahnya
  rationale: Ungkapan ini secara harfiah menyatakan gerak menuju rumahnya. 'Pulang ke rumahnya' alami dalam bahasa Indonesia dan sesuai dengan konteks, sementara catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: וַיִּשְׁלַח
  choice: menyuruh orang memanggil
  rationale: Objek pengutusan tersirat dan tindakan berikutnya menjelaskan tujuannya, yaitu mendatangkan orang-orang itu. Bahasa Indonesia memerlukan ungkapan yang lebih lengkap agar rangkaian tindakan tersebut jelas dan alami.
- source_word: וַיָּבֵא
  choice: memanggil
  rationale: Bentuk hiphil dari בוא berarti menyebabkan datang atau mendatangkan. Dalam gabungan dengan וַיִּשְׁלַח, 'menyuruh orang memanggil' menyampaikan bahwa Haman mengutus seseorang agar mereka datang.
- source_word: אֹהֲבָיו
  choice: sahabat-sahabatnya
  rationale: Walaupun berasal dari akar 'mengasihi', bentuk nominal jamak ini menunjuk kepada para sahabat atau rekan dekat. 'Sahabat-sahabatnya' merupakan padanan kontekstual yang alami.
- source_word: זֶרֶשׁ אִשְׁתּוֹ
  choice: Zeresh, istrinya
  rationale: Urutan nama lalu keterangan hubungan dipertahankan, dengan tanda koma agar aposisi jelas dalam bahasa Indonesia.
- source_word: וַ
  choice: Namun
  rationale: 'Waw naratif pertama memiliki nuansa pertentangan dalam konteks: meskipun Haman dipenuhi amarah, ia menahan diri. ''Namun'' menyatakan kontras itu tanpa menghilangkan alur narasi.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Ungkapan 'menyuruh orang memanggil' dipilih sebagai padanan idiomatis bagi rangkaian singkat verba Ibrani 'mengutus lalu mendatangkan'.
