  text: Yet all this is worth nothing to me whenever I see Mordecai the Jew sitting at the king’s gate[a][b].
translation:
  language: id
  text: Namun, semua ini tidak berarti apa-apa bagiku setiap kali aku melihat Mordekhai, orang Yahudi itu, duduk di gerbang raja.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan semua ini tidak bernilai bagiku setiap kali aku melihat Mordekhai, orang Yahudi itu, duduk di gerbang raja.”
    reason: lexical_alternative
  - marker: b
    text: “Orang Yahudi” juga dapat diterjemahkan “orang Yudea”; di sini istilah itu kemungkinan besar menekankan identitas etnis Yahudi Mordekhai dalam lingkungan istana Persia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל זֶה
  choice: Namun, semua ini
  rationale: וְ dapat berarti “dan”, tetapi dalam konteks ini mengontraskan seluruh kehormatan yang baru saja dibanggakan Haman dengan kejengkelannya terhadap Mordekhai. “Namun” menyatakan daya adversatif itu secara alami.
- source_word: אֵינֶנּוּ שֹׁוֶה לִי
  choice: tidak berarti apa-apa bagiku
  rationale: Ungkapan ini menyatakan bahwa semua kehormatan tersebut tidak bernilai dalam penilaian Haman. Pilihan ini wajar dalam bahasa Indonesia modern dan tidak mengartikannya secara harfiah sebagai “tidak setara denganku”.
- source_word: בְּ/כָל עֵת אֲשֶׁר
  choice: setiap kali
  rationale: Frasa ini secara harfiah berarti “pada setiap waktu ketika” dan menunjukkan kejadian yang berulang.
- source_word: רֹאֶה
  choice: aku melihat
  rationale: Partisipel bersama אֲנִי menyatakan tindakan yang berlangsung atau berulang; bentuk ini cocok dengan “setiap kali”.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: הַיְּהוּדִי
  choice: orang Yahudi itu
  rationale: Dalam latar diaspora Persia di kitab Ester, istilah ini terutama menandai identitas etnis Mordekhai. Kata tunjuk “itu” secara alami menyampaikan bentuk definit dalam bahasa Indonesia.
- source_word: יוֹשֵׁב
  choice: duduk
  rationale: Partisipel ini menggambarkan postur atau keberadaan Mordekhai di gerbang dan mempertahankan gambaran konkret teks.
- source_word: בְּ/שַׁעַר הַמֶּלֶךְ
  choice: di gerbang raja
  rationale: Frasa ini menunjuk kawasan gerbang yang berkaitan dengan istana dan pemerintahan kerajaan; “di gerbang raja” alami serta dekat dengan bentuk sumber.
