  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֗י וַ/תִּלְבַּ֤שׁ אֶסְתֵּר֙ מַלְכ֔וּת וַֽ/תַּעֲמֹ֞ד בַּ/חֲצַ֤ר בֵּית הַ/מֶּ֨לֶךְ֙ הַ/פְּנִימִ֔ית נֹ֖כַח בֵּ֣ית הַ/מֶּ֑לֶךְ וְ֠/הַ/מֶּלֶךְ יוֹשֵׁ֞ב עַל כִּסֵּ֤א מַלְכוּת/וֹ֙ בְּ/בֵ֣ית הַ/מַּלְכ֔וּת נֹ֖כַח פֶּ֥תַח הַ/בָּֽיִת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/005/001.yaml
  text: On the third day[a], Esther put on her royal robes and stood in the inner court of the king’s palace, opposite the king’s house, while the king was sitting on his royal throne in the royal house[b], opposite the entrance of the house.
translation:
  language: id
  text: Pada hari ketiga, Ester mengenakan pakaian kebesaran kerajaan[a] dan berdiri di pelataran dalam istana raja, berhadapan dengan istana raja. Sedangkan raja sedang duduk di atas takhta kerajaannya di dalam istana kerajaan[b], berhadapan dengan pintu masuk istana itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengenakan kebesaran kerajaan,” yaitu pakaian atau lambang kebesaran kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang di sini diterjemahkan “istana” secara harfiah berarti “rumah” atau “bangunan,” tetapi dalam lingkungan kerajaan juga dapat berarti istana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: (tidak diterjemahkan secara tersendiri)
  rationale: Bentuk ini menggerakkan alur narasi. Dalam bahasa Indonesia modern, fungsi tersebut sudah tersampaikan secara alami oleh pembukaan keterangan waktu tanpa perlu menambahkan “maka terjadilah”.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Padanan langsung dan alami untuk keterangan waktu dalam teks Ibrani.
- source_word: וַתִּלְבַּשׁ אֶסְתֵּר מַלְכוּת
  choice: Ester mengenakan pakaian kebesaran kerajaan
  rationale: Secara harfiah frasa ini menyatakan bahwa Ester “mengenakan kebesaran/kerajaan”; dalam konteksnya, yang dimaksud ialah pakaian atau tanda kebesaran kerajaan. Catatan kaki mempertahankan bentuk ungkapan Ibraninya.
- source_word: וַתַּעֲמֹד
  choice: lalu berdiri
  rationale: “Berdiri” merupakan padanan langsung; “lalu” menyampaikan urutan tindakan dalam narasi.
- source_word: בַּחֲצַר בֵּית־הַמֶּלֶךְ הַפְּנִימִית
  choice: di pelataran dalam istana raja
  rationale: “Pelataran dalam” mempertahankan letak ruang, sedangkan בֵּית־הַמֶּלֶךְ dalam konteks lingkungan kerajaan secara alami berarti istana raja.
- source_word: נֹכַח בֵּית הַמֶּלֶךְ
  choice: menghadap bangunan istana raja
  rationale: נֹכַח menunjukkan orientasi berhadapan atau menghadap. “Bangunan istana” memperjelas bahwa Ester berada di pelataran dan menghadap bagian bangunan tempat raja berada, tanpa menghilangkan citra ruang dalam teks.
- source_word: וְהַמֶּלֶךְ יוֹשֵׁב
  choice: Raja sedang duduk
  rationale: Aspek keadaan yang berlangsung bersamaan disampaikan dengan “sedang”; kalimat baru menjaga uraian ruang tetap mudah diikuti.
- source_word: עַל כִּסֵּא מַלְכוּתוֹ
  choice: di atas takhta kerajaannya
  rationale: Padanan ini mempertahankan hubungan harfiah antara takhta dan pemerintahan atau kebesaran raja, tanpa mereduksinya sekadar menjadi “takhta raja”.
- source_word: בְּבֵית הַמַּלְכוּת
  choice: di dalam istana kerajaan
  rationale: בַּיִת dapat berarti rumah, bangunan, atau istana sesuai konteks. “Istana kerajaan” alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan מַלְכוּת.
- source_word: נֹכַח פֶּתַח הַבָּיִת
  choice: menghadap pintu masuk bangunan itu
  rationale: “Menghadap” mempertahankan orientasi ruang, sedangkan “pintu masuk” merupakan padanan alami untuk פֶּתַח. “Bangunan itu” menghindari pengulangan yang kaku sambil tetap merujuk pada istana.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ruang dibuat jelas bagi pembaca umum, sementara pengulangan konsep “istana/bangunan” dan orientasi “menghadap” tetap mencerminkan teks Ibrani. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
