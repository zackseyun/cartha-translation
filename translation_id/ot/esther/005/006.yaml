base_translation:
  language: en
  yaml_path: translation/ot/esther/005/006.yaml
  text: And the king said to Esther at the wine banquet[a], “What is your petition? It will be granted to you. And what is your request? Even up to half the kingdom[b], it will be done.”
translation:
  language: id
  text: Kemudian raja berkata kepada Ester dalam perjamuan anggur itu, “Apakah permohonanmu? Itu akan dikabulkan bagimu.[a] Apakah permintaanmu? Bahkan sampai setengah kerajaan pun, itu akan dilaksanakan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan itu akan diberikan kepadamu.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “sampai setengah kerajaan”; teks Ibrani tidak secara eksplisit mengatakan “kerajaanku”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִשְׁתֵּה הַיַּיִן
  choice: pada perjamuan anggur
  rationale: מִשְׁתֶּה menunjuk pada perjamuan yang disertai minum, dan הַיַּיִן secara khusus menyebut anggur. 'Perjamuan anggur' ringkas, alami, dan mempertahankan latar peristiwa.
- source_word: שְּׁאֵלָתֵךְ
  choice: permohonanmu
  rationale: Dalam konteks istana, kata ini menunjuk pada sesuatu yang dimohonkan, bukan pertanyaan biasa. 'Permohonan' juga memungkinkan pembedaan halus dari בַּקָּשָׁה.
- source_word: וְיִנָּתֵן לָךְ
  choice: Itu akan diberikan kepadamu
  rationale: Bentuk Nifal dari נתן secara harfiah menyatakan bahwa apa yang dimohonkan akan diberikan. Terjemahan ini mempertahankan citra leksikal sumber tanpa kehilangan makna jaminan raja.
- source_word: בַּקָּשָׁתֵךְ
  choice: permintaanmu
  rationale: בַּקָּשָׁה berarti sesuatu yang diminta atau dicari. 'Permintaan' alami dalam bahasa Indonesia dan mempertahankan sedikit variasi dari 'permohonan'.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Bahkan sampai setengah kerajaan pun
  rationale: Bahasa Ibrani tidak memuat kata ganti posesif 'kerajaanku'. Ungkapan 'bahkan ... pun' menyampaikan daya retoris tawaran kerajaan itu sambil mempertahankan 'kerajaan' tanpa posesif tambahan.
- source_word: וְתֵעָשׂ
  choice: itu akan dilaksanakan
  rationale: Bentuk pasif ini dalam konteks menunjuk pada pelaksanaan permintaan Ester. 'Dilaksanakan' lebih jelas dan alami daripada 'dilakukan' untuk sebuah permintaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan pertanyaan dan jaminan paralel dipertahankan, demikian juga perbedaan halus antara 'permohonan' dan 'permintaan'. Semua kata ganti untuk manusia ditulis dengan huruf kecil.
