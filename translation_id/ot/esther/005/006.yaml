  source_fidelity: 'Makna pokok telah setia pada Ibrani: raja berbicara kepada Ester dalam perjamuan anggur, membedakan שְׁאֵלָה dan בַּקָּשָׁה secara wajar, serta tidak menambahkan posesif pada “kerajaan.” Namun, catatan a tidak lagi berfungsi sebagai alternatif bagi terjemahan utama, karena terjemahan utama sudah memakai “diberikan kepadamu.”'
