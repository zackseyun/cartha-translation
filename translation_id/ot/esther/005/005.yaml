base_translation:
  language: en
  yaml_path: translation/ot/esther/005/005.yaml
  text: Then the king said[a], "Hurry, bring Haman, so that Esther's word may be done." So the king and Haman came to the banquet that Esther had prepared.
translation:
  language: id
  text: Lalu raja berkata, “Segera panggil Haman supaya permintaan Ester dilaksanakan.[a]” Maka raja dan Haman datang ke perjamuan yang telah disiapkan Ester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “supaya perkataan Ester dilakukan.” Kata Ibrani yang diterjemahkan “permintaan” dapat menunjuk pada perkataan, perkara, permintaan, atau instruksi yang telah Ester sampaikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֲרוּ אֶת־הָמָן
  choice: Segera panggil Haman
  rationale: Bentuk perintah jamak מַהֲרוּ ditujukan kepada para pelayan dan menuntut tindakan cepat terhadap Haman. Dalam konteks istana, “segera panggil Haman” mengungkapkan tindakan tersirat secara alami tanpa menghilangkan unsur urgensi.
- source_word: לַעֲשׂוֹת אֶת־דְּבַר אֶסְתֵּר
  choice: supaya permintaan Ester dilaksanakan
  rationale: Secara harfiah frasa ini berarti “untuk melakukan perkataan/perkara Ester.” Dalam konteks ini דָּבָר menunjuk pada hal yang telah Ester nyatakan kepada raja, sehingga “permintaan” merupakan padanan kontekstual yang jelas; bentuk “dilaksanakan” mempertahankan fokus pada terlaksananya hal tersebut.
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata בוא dapat berarti “datang” atau “pergi” menurut sudut pandang narasi. “Datang ke perjamuan” wajar dalam bahasa Indonesia dan sesuai dengan adegan kedatangan mereka di tempat perjamuan.
- source_word: הַמִּשְׁתֶּה
  choice: perjamuan
  rationale: מִשְׁתֶּה adalah jamuan atau pesta makan-minum. “Perjamuan” sesuai dengan suasana kerajaan dan merupakan istilah Indonesia yang bermartabat serta mudah dipahami.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: yang telah disiapkan Ester
  rationale: עשה bersama מִשְׁתֶּה berarti mengadakan atau menyiapkan perjamuan. “Telah disiapkan” alami dalam bahasa Indonesia dan menunjukkan bahwa persiapannya mendahului kedatangan mereka.
