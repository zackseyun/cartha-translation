base_translation:
  language: en
  yaml_path: translation/ot/esther/005/003.yaml
  text: Then the king said to her[a], “What is it[c][b], Queen Esther? And what is your request? Up to half the kingdom—it will be given to you.”
translation:
  language: id
  text: Lalu raja berkata kepadanya, “Ada apa, Ratu Ester?[a] Apa permintaanmu?[b] Sampai setengah kerajaan pun akan diberikan kepadamu.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang meresahkanmu, Ratu Ester?” Ungkapan Ibraninya secara harfiah berbunyi, “Apa bagimu?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Apa permohonanmu?”
    reason: lexical_alternative
  - marker: c
    text: Ini adalah ungkapan resmi kerajaan yang menyatakan kemurahan hati yang besar, bukan selalu tawaran harfiah untuk membagi kerajaan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menghasilkan alur bahasa Indonesia yang alami.
- source_word: לָהּ
  choice: kepadanya
  rationale: Mencerminkan preposisi ל dengan sufiks pronominal feminin tunggal.
- source_word: הַמֶּלֶךְ
  choice: raja
  rationale: Padanan langsung untuk nomina definit; dalam konteks ini bahasa Indonesia tidak memerlukan penanda definit tersendiri.
- source_word: מַה לָּךְ
  choice: Ada apa
  rationale: Ungkapan Ibrani harfiah berarti “apa bagimu/ada apa denganmu” dan menanyakan hal yang menjadi perhatian Ester. “Ada apa” alami serta tidak secara berlebihan menyimpulkan bahwa Ester sedang mengalami kesusahan.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Bahasa Indonesia secara alami menempatkan gelar di depan nama, sambil mempertahankan gelar kerajaan dan nama pribadinya.
- source_word: וּמַה בַּקָּשָׁתֵךְ
  choice: Apa permintaanmu
  rationale: בַּקָּשָׁה berarti permintaan atau permohonan. “Permintaan” jelas dan alami, sedangkan “permohonan” dicatat sebagai alternatif.
- source_word: עַד חֲצִי הַמַּלְכוּת
  choice: Sampai setengah kerajaan pun
  rationale: Menunjukkan batas luasnya janji raja. Partikel “pun” menyampaikan daya tekan ungkapan kerajaan itu secara alami.
- source_word: וְיִנָּתֵן לָךְ
  choice: akan diberikan kepadamu
  rationale: Bentuk nifal imperfek נתן berfungsi sebagai janji pasif. Objeknya dipahami dari permintaan yang baru disebutkan dan tidak perlu ditambahkan secara eksplisit dalam bahasa Indonesia.
