base_translation:
  language: en
  yaml_path: translation/ot/esther/005/004.yaml
  text: Esther said[a], “If it pleases the king[b], let the king and Haman come today to the banquet that I have prepared for him.”
translation:
  language: id
  text: Kata Ester, “Jika raja berkenan, hendaklah raja dan Haman datang hari ini ke perjamuan yang telah kusiapkan baginya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “baginya”; bentuknya tunggal dan tampaknya secara khusus merujuk kepada raja, meskipun Haman juga diundang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan ini menyampaikan permohonan penuh hormat di lingkungan istana. ‘Jika raja berkenan’ alami dalam bahasa Indonesia modern dan mempertahankan nuansa persetujuan raja.
- source_word: יָבוֹא
  choice: hendaklah ... datang
  rationale: Bentuk imperfek ini berfungsi secara yusif dalam konteks permohonan. ‘Hendaklah ... datang’ mempertahankan daya volitif yang sopan tanpa mengubahnya menjadi pernyataan biasa.
- source_word: הַמֶּלֶךְ וְהָמָן
  choice: raja dan Haman
  rationale: Teks Ibrani mengulangi gelar ‘raja’ dan menyebut Haman; nama pribadi raja tidak ditambahkan.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan langsung yang mempertahankan kesegeraan undangan.
- source_word: הַמִּשְׁתֶּה
  choice: perjamuan
  rationale: Kata ini menunjuk pada jamuan atau pesta makan, sering dengan minuman. ‘Perjamuan’ sesuai dengan suasana kerajaan dan tetap bermartabat.
- source_word: אֲשֶׁר עָשִׂיתִי לוֹ
  choice: yang telah kusiapkan baginya
  rationale: Dalam hubungan dengan perjamuan, עָשָׂה secara idiomatis berarti ‘menyiapkan’. Pronomina tunggal לוֹ dipertahankan dengan ‘baginya’ dan paling wajar merujuk kepada raja.
