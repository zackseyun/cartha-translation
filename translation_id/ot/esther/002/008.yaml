  text: וַ/יְהִ֗י בְּ/הִשָּׁמַ֤ע דְּבַר הַ/מֶּ֨לֶךְ֙ וְ/דָת֔/וֹ וּֽ/בְ/הִקָּבֵ֞ץ נְעָר֥וֹת רַבּ֛וֹת אֶל שׁוּשַׁ֥ן הַ/בִּירָ֖ה אֶל יַ֣ד הֵגָ֑י וַ/תִּלָּקַ֤ח אֶסְתֵּר֙ אֶל בֵּ֣ית הַ/מֶּ֔לֶךְ אֶל יַ֥ד הֵגַ֖י שֹׁמֵ֥ר הַ/נָּשִֽׁים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/008.yaml
  text: And when the king’s command and his decree were heard[a], and when many young women were gathered to Susa the citadel into the custody of Hegai, Esther also was taken into the king’s house, into the custody of Hegai[b], keeper of the women.
translation:
  language: id
  text: Ketika perintah raja dan ketetapannya didengar, dan ketika banyak perempuan muda dikumpulkan di Susan, kota benteng, di bawah pengawasan Hegai[a], Ester pun dibawa ke istana raja[b], di bawah pengawasan Hegai, penjaga para perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke tangan Hegai.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר הַמֶּלֶךְ וְדָתוֹ
  choice: perintah raja dan ketetapannya
  rationale: Dalam konteks istana Persia, דְּבַר menunjuk pada perintah resmi, sedangkan דָת menunjuk pada ketetapan atau dekret. Ungkapan ini mempertahankan pembedaan kedua istilah itu dalam bahasa Indonesia yang alami.
- source_word: נְעָרוֹת רַבּוֹת
  choice: banyak perempuan muda
  rationale: נְעָרוֹת menyatakan perempuan muda, tanpa dengan sendirinya menyebut mereka perawan; רַבּוֹת berarti banyak.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: Benteng Susan
  rationale: הַבִּירָה di sini menunjuk pada kawasan berbenteng atau kompleks kerajaan di Susan. 'Benteng Susan' ringkas, jelas, dan sesuai dengan konteks.
- source_word: אֶל יַד הֵגָי
  choice: di bawah pengawasan Hegai
  rationale: Secara harfiah ungkapan ini berarti 'ke tangan Hegai', tetapi secara idiomatis menyatakan bahwa para perempuan ditempatkan di bawah kewenangan dan pengawasannya.
- source_word: וַתִּלָּקַח אֶסְתֵּר
  choice: Ester pun dibawa
  rationale: Bentuk pasif mempertahankan bahwa Ester bukan pelaku yang memprakarsai tindakan tersebut. 'Dibawa' alami dalam narasi Indonesia dan tidak melebih-lebihkan kadar paksaan yang tidak dinyatakan secara eksplisit.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti 'rumah raja', tetapi dalam konteks ini menunjuk pada kompleks kediaman kerajaan; 'istana raja' menyampaikan acuannya secara alami.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: penjaga para perempuan
  rationale: Partisip שֹׁמֵר menyebut orang yang menjaga atau mengawasi. 'Penjaga' dekat dengan bentuk Ibrani dan tidak menambahkan kesan perlindungan yang terlalu positif.
- source_word: וַיְהִי בְּהִשָּׁמַע ... וּבְהִקָּבֵץ
  choice: Ketika ... didengar, dan ketika ... dikumpulkan
  rationale: Kedua konstruksi infinitif membentuk latar waktu yang sejajar. Pengulangan 'ketika' mempertahankan susunan dan alur narasi Ibrani.
