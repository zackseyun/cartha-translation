translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. Struktur kalimat mempertahankan kesejajaran temporal teks Ibrani, sedangkan idiom yang tidak alami dialihkan ke padanan Indonesia yang jelas. Bentuk pasif pada tindakan terhadap Ester tetap dipertahankan.
