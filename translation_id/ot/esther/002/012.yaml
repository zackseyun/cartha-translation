base_translation:
  language: en
  yaml_path: translation/ot/esther/002/012.yaml
  text: 'When the turn of each young woman came to go in to King Ahasuerus, after she had been under the regulation for the women for twelve months—for in this way the days of their beauty treatments were completed: six months with oil of myrrh, and six months with spices and with the cosmetics for women—'
translation:
  language: id
  text: 'Ketika tiba giliran setiap gadis untuk menghadap Raja Ahasyweros, setelah ia menjalani ketentuan bagi para perempuan selama dua belas bulan—sebab demikianlah masa perawatan kecantikan mereka menjadi genap: enam bulan dengan minyak mur dan enam bulan dengan rempah-rempah serta kosmetik bagi para perempuan—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּר נַעֲרָה וְנַעֲרָה
  choice: giliran setiap gadis
  rationale: Ungkapan distributif Ibrani berarti giliran masing-masing perempuan muda; 'setiap gadis' alami dalam bahasa Indonesia dan sesuai konteks.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: menghadap Raja
  rationale: Secara harfiah 'datang/masuk kepada raja'; 'menghadap' merupakan ungkapan Indonesia yang wajar bagi kedatangan resmi ke hadapan raja tanpa memperinci lebih dari teks.
- source_word: כְּדָת הַנָּשִׁים
  choice: ketentuan bagi para perempuan
  rationale: דָּת menunjuk ketetapan atau peraturan; 'ketentuan' mempertahankan nuansa tata cara yang diwajibkan.
- source_word: יְמֵי מְרוּקֵיהֶן
  choice: masa perawatan kecantikan mereka
  rationale: מְרוּקִים merujuk pada proses pemurnian/perawatan kosmetik; pilihan ini jelas dalam konteks dan tidak membatasi makna hanya pada satu jenis kosmetik.
- source_word: שֶׁמֶן הַמֹּר
  choice: minyak mur
  rationale: Padanan lazim dan tepat bagi minyak yang dibuat atau diberi wewangian dari mur.
- source_word: בַּבְּשָׂמִים וּבְתַמְרוּקֵי הַנָּשִׁים
  choice: dengan rempah-rempah serta kosmetik bagi para perempuan
  rationale: Membedakan bahan harum/rempah dari produk atau sarana perawatan perempuan, sambil mempertahankan bentuk konstruksi Ibrani.
