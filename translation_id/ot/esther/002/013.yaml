base_translation:
  language: en
  yaml_path: translation/ot/esther/002/013.yaml
  text: 'And in this way the young woman went to the king: whatever she said would be given to her to take with her from the house of the women to the king’s house[a][b].'
translation:
  language: id
  text: 'Dengan cara inilah perempuan muda itu datang kepada raja: apa pun yang ia minta[a] akan diberikan kepadanya untuk dibawa bersamanya dari tempat tinggal para perempuan[b] sampai ke istana raja[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “segala yang ia katakan.” Dalam konteks ini, yang dimaksud ialah apa yang ia minta untuk dibawa bersamanya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah para perempuan,” yaitu tempat tinggal khusus bagi para perempuan di lingkungan istana.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “sampai ke rumah raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָזֶה
  choice: Dengan cara demikianlah
  rationale: Ungkapan ב dengan kata tunjuk זֶה memperkenalkan tata cara yang baru saja dijelaskan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan fungsi peralihannya.
- source_word: הַנַּעֲרָה
  choice: perempuan muda itu
  rationale: נַעֲרָה menunjuk perempuan berusia muda. Pilihan ini modern dan netral, tanpa kesan terlalu kanak-kanak atau arkais.
- source_word: בָּאָה אֶל־הַמֶּלֶךְ
  choice: menghadap raja
  rationale: Secara harfiah berarti datang/pergi kepada raja; dalam konteks audiensi kerajaan, 'menghadap raja' merupakan padanan Indonesia yang wajar dan tepat.
- source_word: אֵת כָּל אֲשֶׁר תֹּאמַר
  choice: apa pun yang dimintanya
  rationale: Secara harfiah, 'segala yang dikatakannya', tetapi konteks menunjukkan bahwa ucapannya berupa permintaan atas barang yang hendak dibawa. Makna kontekstual dinyatakan dalam teks, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יִנָּתֵן לָהּ
  choice: akan diberikan kepadanya
  rationale: Bentuk pasif imperfek menyatakan prosedur atau kebiasaan yang berlaku; 'akan diberikan' menyampaikan daya prospektif-prosedural tersebut.
- source_word: לָבוֹא עִמָּהּ
  choice: untuk dibawanya
  rationale: Secara bentuk berarti 'untuk pergi/masuk bersamanya'. Karena yang menyertai perempuan itu adalah barang yang diberikan, 'untuk dibawanya' menyatakan maksudnya secara alami.
- source_word: מִבֵּית הַנָּשִׁים
  choice: dari balai para perempuan
  rationale: בֵּית dapat berarti rumah, bangunan, atau bagian kediaman. 'Balai para perempuan' mempertahankan ungkapan sumber sambil menunjukkan tempat khusus bagi mereka tanpa memasukkan istilah interpretatif 'harem'.
- source_word: עַד בֵּית הַמֶּלֶךְ
  choice: ke istana raja
  rationale: Secara harfiah 'sampai rumah raja'; dalam konteks kerajaan, 'istana raja' adalah ungkapan Indonesia yang paling jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan penjelasan prosedural ayat sumber, sementara istilah kelembagaan dibuat mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan langsung dalam teks.
