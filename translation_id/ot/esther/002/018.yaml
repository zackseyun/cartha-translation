base_translation:
  language: en
  yaml_path: translation/ot/esther/002/018.yaml
  text: Then the king gave a great banquet for all his officials and servants—the banquet of Esther—and he granted relief to the provinces and gave gifts according to the king’s bounty[a][b].
translation:
  language: id
  text: Kemudian raja mengadakan perjamuan besar bagi semua pejabat dan pegawainya, yaitu perjamuan Ester. Ia memberikan keringanan kepada provinsi-provinsi[a] dan membagikan hadiah sesuai dengan kemurahan hati raja.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan waktu istirahat kepada provinsi-provinsi” atau “memberikan pembebasan kepada provinsi-provinsi.” Istilah Ibrani ini dapat menunjuk secara luas pada kelegaan, perhentian, atau pembebasan dari suatu kewajiban.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut tangan raja,” yaitu pemberian dalam ukuran yang sesuai dengan kemampuan atau kemurahan hati raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתֶּה גָדוֹל
  choice: perjamuan besar
  rationale: מִשְׁתֶּה menunjuk pada perjamuan yang mencakup kegiatan minum; 'perjamuan' alami dalam konteks istana dan גָדוֹל diterjemahkan langsung sebagai 'besar'.
- source_word: לְכָל שָׂרָיו וַעֲבָדָיו
  choice: bagi semua pejabat dan pegawainya
  rationale: שָׂרִים dalam lingkungan istana Persia berarti para pejabat tinggi, sedangkan עֲבָדִים secara harfiah berarti hamba tetapi di sini mencakup para pelayan atau petugas kerajaan; 'pegawai' menyampaikan fungsi itu tanpa kesan perbudakan yang belum tentu dimaksudkan.
- source_word: אֵת מִשְׁתֵּה אֶסְתֵּר
  choice: yaitu perjamuan Ester
  rationale: Frasa konstruksi ini secara harfiah adalah 'perjamuan Ester' dan kemungkinan berarti perjamuan yang dikaitkan dengan atau diadakan untuk menghormati Ester. 'Yaitu' memperjelas bahwa ini memberi nama pada perjamuan besar tadi, bukan perjamuan kedua.
- source_word: וַהֲנָחָה לַמְּדִינוֹת עָשָׂה
  choice: Ia memberikan keringanan kepada provinsi-provinsi
  rationale: הֲנָחָה dapat berarti kelegaan, perhentian, atau pembebasan/keringanan. 'Keringanan' mempertahankan keluasan makna dan dapat mencakup pengurangan kewajiban tanpa memastikan bahwa yang dimaksud adalah pajak atau hari libur.
- source_word: מַשְׂאֵת
  choice: hadiah
  rationale: Dalam konteks pemberian kerajaan, מַשְׂאֵת menunjuk pada pemberian atau hadiah; 'hadiah' merupakan padanan Indonesia yang wajar dan cukup luas.
- source_word: כְּיַד הַמֶּלֶךְ
  choice: sesuai dengan kemurahan hati seorang raja
  rationale: Secara harfiah frasa ini berarti 'menurut tangan raja', suatu ungkapan tentang ukuran pemberian yang sepadan dengan kemampuan atau kemurahan seorang raja. Bentuk 'seorang raja' mempertahankan nuansa ukuran yang layak bagi martabat kerajaan.
- source_word: וַיַּעַשׂ
  choice: mengadakan
  rationale: Walaupun arti dasarnya 'membuat/melakukan', dalam kolokasi dengan perjamuan bahasa Indonesia secara alami memakai 'mengadakan'.
