base_translation:
  language: en
  yaml_path: translation/ot/esther/002/023.yaml
  text: When the matter was investigated and found to be so[a], both of them were hanged on a tree, and it was written in the book of the chronicles in the presence of the king.
translation:
  language: id
  text: Ketika perkara itu diselidiki dan didapati benar, keduanya digantung pada pohon[a]. Peristiwa itu dicatat dalam kitab catatan sejarah di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada pohon/kayu.” Hukuman Persia yang dimaksud mungkin berupa pemancangan pada tiang atau penggantungan untuk dipertontonkan; kata Ibraninya tidak menentukan caranya dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבֻקַּשׁ הַדָּבָר
  choice: Setelah perkara itu diselidiki
  rationale: Bentuk pasif בקש dalam konteks ini menunjuk pada penyelidikan resmi terhadap laporan tentang persekongkolan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa yudisialnya.
- source_word: וַיִּמָּצֵא
  choice: dan terbukti benar
  rationale: Dalam alur ini, bentuk tersebut menyatakan bahwa laporan itu didapati benar atau terverifikasi, bukan sekadar ditemukan secara fisik.
- source_word: וַיִּתָּלוּ
  choice: digantung
  rationale: תלה berarti menggantung atau menggantungkan. Terjemahan ini tidak menetapkan metode hukuman Persia secara lebih spesifik daripada yang dinyatakan teks Ibrani.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Bentuk ini secara tegas merujuk kepada kedua orang yang bersekongkol dan diterjemahkan secara ringkas serta alami.
- source_word: עַל עֵץ
  choice: pada tiang kayu
  rationale: עֵץ dapat berarti pohon atau kayu, dan dalam konteks penghukuman menunjuk pada benda atau struktur dari kayu. 'Tiang kayu' lebih alami daripada 'pohon' dalam bahasa Indonesia sambil tidak memastikan apakah caranya digantung atau ditusuk.
- source_word: וַיִּכָּתֵב
  choice: dicatat
  rationale: Secara harfiah berarti 'ditulis', tetapi dalam konteks arsip istana, 'dicatat' menyampaikan fungsi administratifnya dengan jelas.
- source_word: בְּסֵפֶר דִּבְרֵי הַיָּמִים
  choice: dalam kitab catatan sejarah
  rationale: Frasa ini menunjuk pada kitab resmi berisi kejadian-kejadian atau riwayat pemerintahan. Pilihan ini jelas bagi pembaca modern tanpa menghilangkan sifatnya sebagai kitab catatan.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapan raja
  rationale: לִפְנֵי berarti 'di depan' atau 'di hadapan'. Terjemahan ini mempertahankan gambaran bahwa pencatatan dilakukan dalam kehadiran atau di bawah pengawasan raja.
