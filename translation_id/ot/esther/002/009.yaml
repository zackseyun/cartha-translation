base_translation:
  language: en
  yaml_path: translation/ot/esther/002/009.yaml
  text: The young woman pleased him and found favor before him[a], and he quickly provided her with her beauty treatments and her portions, and with seven young women suitable to be given to her from the king’s palace; and he transferred her and her young women to the best place in the women’s house.
translation:
  language: id
  text: Perempuan muda itu menyenangkan hati Hegai dan mendapat perkenanan di hadapannya. Hegai segera memberikan kepadanya perawatan kecantikan dan jatahnya, serta tujuh perempuan muda dari istana raja yang layak diberikan kepadanya. Kemudian Hegai menempatkan perempuan muda itu dan para pelayannya di bagian terbaik dari kediaman para perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tempat tinggal terbaik di kediaman para perempuan.” Frasa ini menunjuk pada bagian yang lebih baik di dalam kediaman perempuan istana, yang sering dipahami sebagai harem.
    reason: Mencatat alternatif yang dekat bagi susunan לְטוֹב בֵּית הַנָּשִׁים serta menjelaskan latar tempat tanpa memakai istilah interpretatif “harem” dalam teks utama.
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: perempuan muda itu
  rationale: Menunjukkan seorang perempuan yang masih muda tanpa kesan kekanak-kanakan dari 'gadis' atau nuansa arkais.
- source_word: וַתִּיטַב ... בְעֵינָיו
  choice: menyenangkan hatinya
  rationale: Mengungkapkan idiom harfiah 'baik di matanya' secara alami dalam bahasa Indonesia tanpa menambahkan nuansa romantis atau seksual.
- source_word: וַתִּשָּׂא חֶסֶד לְפָנָיו
  choice: mendapat perkenanan di hadapannya
  rationale: Mempertahankan citra kehadiran di hadapan pejabat istana sekaligus menyampaikan bahwa perempuan itu menerima perlakuan yang baik.
- source_word: חֶסֶד
  choice: perkenanan
  rationale: Dalam konteks hubungan di lingkungan istana ini, kata tersebut menunjuk pada sikap dan perlakuan yang menguntungkan, bukan secara khusus kasih setia perjanjian.
- source_word: וַיְבַהֵל
  choice: segera memberikan
  rationale: Menyampaikan unsur ketergesaan pada verba itu serta hubungannya dengan tindakan memberikan berbagai keperluan.
- source_word: תַּמְרוּקֶיהָ
  choice: perawatan kecantikan
  rationale: Istilah ini mengacu pada bahan atau proses perawatan kosmetik dalam persiapan para perempuan; pilihan ini jelas bagi pembaca modern.
- source_word: מָנוֹתֶיהָ
  choice: jatah yang menjadi bagiannya
  rationale: מָנוֹת menunjuk pada bagian atau perbekalan yang dialokasikan, kemungkinan besar termasuk makanan; terjemahan ini tidak mempersempit maknanya hanya kepada makanan.
- source_word: שֶׁבַע הַנְּעָרוֹת הָרְאֻיוֹת
  choice: tujuh perempuan muda yang layak ditugaskan untuk melayaninya
  rationale: Menggabungkan arti dasar perempuan-perempuan muda yang dianggap sesuai dengan fungsi mereka sebagai pelayan yang diberikan kepadanya dalam konteks istana.
- source_word: מִבֵּית הַמֶּלֶךְ
  choice: dari istana raja
  rationale: Dalam konteks kerajaan, 'istana' menyampaikan arti institusional בֵּית secara lebih wajar daripada 'rumah raja'.
- source_word: וַיְשַׁנֶּהָ
  choice: ia memindahkan perempuan muda itu
  rationale: Bentuk verba ini menyatakan perubahan atau pemindahan keadaan/tempat; 'memindahkan' sesuai dengan perpindahan administratif di dalam kediaman para perempuan tanpa melebih-lebihkan sebagai kenaikan pangkat.
- source_word: לְטוֹב בֵּית הַנָּשִׁים
  choice: ke bagian terbaik di kediaman para perempuan
  rationale: Menunjukkan lokasi yang lebih baik di dalam kawasan tempat para perempuan tinggal, sambil menghindari kata 'harem' yang lebih interpretatif.
