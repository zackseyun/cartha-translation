revisions:
- from: Perempuan muda itu menyenangkan hatinya dan mendapat perkenanan di hadapannya. Ia segera memberikan kepadanya perawatan kecantikan dan jatah yang menjadi bagiannya, juga tujuh perempuan muda yang layak ditugaskan untuk melayaninya dari istana raja. Kemudian ia memindahkan perempuan muda itu beserta para pelayannya ke bagian terbaik di kediaman para perempuan.[a]
  to: Perempuan muda itu menyenangkan hati Hegai dan mendapat perkenanan di hadapannya. Hegai segera memberikan kepadanya perawatan kecantikan dan jatahnya, serta tujuh perempuan muda dari istana raja yang layak diberikan kepadanya. Kemudian Hegai menempatkan perempuan muda itu dan para pelayannya di bagian terbaik dari kediaman para perempuan.[a]
  rationale: Revisi memperjelas pelaku yang dimaksud konteks (Hegai), menghilangkan redundansi, dan mengembalikan klausa tentang tujuh perempuan muda lebih dekat kepada bentuk sumber. "Menempatkan" menyampaikan perubahan/relokasi dalam kediaman para perempuan tanpa menyiratkan kenaikan status yang tidak dinyatakan.
