id: EST.2.14
reference: Esther 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֶ֣רֶב הִ֣יא בָאָ֗ה וּ֠/בַ/בֹּקֶר הִ֣יא שָׁבָ֞ה אֶל בֵּ֤ית הַ/נָּשִׁים֙ שֵׁנִ֔י אֶל יַ֧ד שַֽׁעֲשְׁגַ֛ז סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/פִּֽילַגְשִׁ֑ים לֹא תָב֥וֹא עוֹד֙ אֶל הַ/מֶּ֔לֶךְ כִּ֣י אִם חָפֵ֥ץ בָּ֛/הּ הַ/מֶּ֖לֶךְ וְ/נִקְרְאָ֥ה בְ/שֵֽׁם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/014.yaml
  text: In the evening she would go in[a], and in the morning she would return to the second house of the women, into the care of Shaashgaz, the king’s eunuch, keeper of the concubines[b]. She would not go in again to the king unless the king delighted in her and she was summoned by name.
translation:
  language: id
  text: Pada petang hari perempuan itu masuk[a], dan pada pagi hari ia kembali ke rumah kedua bagi para perempuan[b], di bawah tanggung jawab Saasgaz, sida-sida raja yang menjaga para gundik. Ia tidak lagi masuk menghadap raja, kecuali jika raja berkenan kepadanya dan ia dipanggil dengan namanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “masuk” dalam konteks ini berarti masuk ke kamar atau hadirat raja; konteksnya menyiratkan hubungan seksual tanpa menyatakannya secara langsung.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih interpretatif, “harem yang kedua.” Secara harfiah teks Ibrani berbunyi “rumah kedua bagi para perempuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֶרֶב
  choice: Pada petang hari
  rationale: Mengungkapkan keterangan waktu secara alami dan jelas dalam bahasa Indonesia modern.
- source_word: בָאָה
  choice: perempuan itu masuk
  rationale: Secara harfiah verba ini berarti datang, tetapi dalam konteks menunjuk pada masuk ke tempat atau hadirat raja. Kata 'masuk' mempertahankan ungkapan yang tidak menyatakan hubungan seksual secara eksplisit.
- source_word: וּבַבֹּקֶר
  choice: dan pada pagi hari
  rationale: Mempertahankan urutan waktu dengan konjungsi sederhana tanpa menambahkan pertentangan.
- source_word: שָׁבָה
  choice: ia kembali
  rationale: Padanan langsung dan alami untuk tindakan kembali; keseluruhan konteks menunjukkan pola yang berlaku bagi setiap perempuan.
- source_word: בֵּית הַנָּשִׁים שֵׁנִי
  choice: rumah perempuan yang kedua
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah menyebut rumah perempuan kedua, yaitu tempat tinggal yang berbeda dari tempat persiapan sebelumnya.
- source_word: אֶל יַד
  choice: di bawah pengawasan
  rationale: Ungkapan harfiah 'ke tangan' menyatakan penempatan di bawah tanggung jawab atau wewenang seseorang.
- source_word: שַׁעֲשְׁגַז
  choice: Saasgas
  rationale: Transliterasi nama pribadi yang mudah dibaca dalam bahasa Indonesia dan sejalan dengan bentuk yang telah dikenal.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: sida-sida raja
  rationale: Dalam lingkungan istana Persia, istilah ini kemungkinan besar menunjuk pada sida-sida, bukan sekadar pejabat umum.
- source_word: שֹׁמֵר הַפִּילַגְשִׁים
  choice: yang bertugas menjaga para gundik
  rationale: Menyampaikan fungsi orang yang menjaga dan bertanggung jawab atas para gundik dalam bahasa Indonesia yang alami.
- source_word: לֹא תָבוֹא עוֹד אֶל הַמֶּלֶךְ
  choice: Ia tidak akan masuk lagi menghadap raja
  rationale: Mempertahankan idiom masuk kepada raja sambil membuat arah tindakan jelas dalam bahasa Indonesia; 'lagi' menerjemahkan עוֹד.
- source_word: כִּי אִם
  choice: kecuali jika
  rationale: Menyatakan satu-satunya pengecualian terhadap ketentuan sebelumnya.
- source_word: חָפֵץ בָּהּ
  choice: raja berkenan kepadanya
  rationale: Mencakup arti menyukai, menginginkan, atau merasa senang terhadap perempuan itu tanpa mempersempitnya hanya menjadi hasrat seksual.
- source_word: וְנִקְרְאָה בְשֵׁם
  choice: dan ia dipanggil dengan namanya
  rationale: Mengikuti ungkapan sumber yang menekankan bahwa perempuan itu dipanggil secara khusus dengan menyebut namanya.
theological_decisions:
- issue: Implikasi seksual dari ungkapan masuk menghadap raja
  choice: Implikasinya dibiarkan tersirat dalam teks utama.
  alternative: Menyatakan secara eksplisit bahwa perempuan itu tidur atau berhubungan seksual dengan raja.
  rationale: Bahasa Ibrani memakai ungkapan masuk atau datang kepada raja. Konteksnya memberi implikasi seksual, tetapi teks tidak mengatakannya secara langsung; terjemahan tidak boleh memperjelas melebihi sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah istana seperti 'sida-sida' dan 'gundik' dipertahankan karena tepat bagi konteks, sedangkan struktur kalimat dibuat mudah dipahami oleh pembaca umum.
