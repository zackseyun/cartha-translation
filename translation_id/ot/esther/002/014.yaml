revisions:
- from: Pada petang hari perempuan itu masuk[a], dan pada pagi hari ia kembali ke rumah perempuan yang kedua[b], di bawah pengawasan Saasgas, sida-sida raja yang bertugas menjaga para gundik. Ia tidak akan masuk lagi menghadap raja, kecuali jika raja berkenan kepadanya dan ia dipanggil dengan namanya.
  to: Pada petang hari perempuan itu masuk[a], dan pada pagi hari ia kembali ke rumah kedua bagi para perempuan[b], di bawah tanggung jawab Saasgaz, sida-sida raja yang menjaga para gundik. Ia tidak lagi masuk menghadap raja, kecuali jika raja berkenan kepadanya dan ia dipanggil dengan namanya.
  rationale: Revisi mempertahankan urutan dan ambiguitas idiomatis teks Ibrani, memperbaiki transliterasi nama Saasgaz, menghindari nuansa masa depan yang berlebihan, serta memperjelas konstruksi “rumah perempuan kedua” dalam bahasa Indonesia modern. Penanda catatan kaki tetap melekat pada “masuk” dan “rumah kedua bagi para perempuan.”
