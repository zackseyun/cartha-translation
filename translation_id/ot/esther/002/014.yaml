review_pass:
  verdict: revise
  source_fidelity: 'Revisi diperlukan terutama pada bentuk waktu/aspek. Ibrani menggambarkan pola yang berlaku: perempuan itu masuk pada petang dan kembali pada pagi, lalu tidak masuk lagi kecuali dipanggil. “Tidak akan masuk lagi” terdengar sebagai masa depan absolut dalam bahasa Indonesia; “tidak lagi masuk” lebih tepat untuk ketentuan/pola naratif tersebut. Nama שַׁעֲשְׁגַז juga perlu mempertahankan konsonan akhir z: “Saasgaz,” bukan “Saasgas.”'
  naturalness: Teks revisi memakai bahasa Indonesia baku dan jelas. “Rumah kedua bagi para perempuan” menghindari ambiguitas “rumah perempuan yang kedua,” yang dapat dibaca sebagai rumah milik seorang perempuan kedua, sambil tetap mempertahankan ungkapan sumber yang literal.
  terminology: “Sida-sida,” “gundik,” dan “berkenan kepadanya” sesuai dengan konteks istana dan cakupan makna Ibrani. “Masuk” tetap membiarkan implikasi konteks tersirat; catatan budaya menjelaskannya tanpa menjadikannya eksplisit dalam teks utama.
  issues:
  - severity: medium
    issue: “Ia tidak akan masuk lagi” menyatakan masa depan secara lebih tegas daripada pola/kebiasaan yang digambarkan oleh verba Ibrani.
    rationale: Dalam konteks ini, bentuk Ibrani menyatakan bahwa sesudah itu perempuan tersebut tidak lagi datang kepada raja, kecuali raja menghendakinya dan memanggilnya. “Ia tidak lagi masuk” menyampaikan ketentuan tersebut secara lebih alami tanpa menggeser fokus ke masa depan.
  - severity: medium
    issue: Nama “Saasgas” tidak mencerminkan konsonan akhir ז (zayin).
    rationale: שַׁעֲשְׁגַז berakhir dengan bunyi z; transliterasi “Saasgaz” mempertahankannya.
  - severity: low
    issue: “Rumah perempuan yang kedua” berpotensi ambigu dalam bahasa Indonesia.
    rationale: “Rumah kedua bagi para perempuan” secara alami menunjukkan sebuah tempat tinggal/ruang perempuan yang kedua, bukan rumah milik perempuan kedua.
