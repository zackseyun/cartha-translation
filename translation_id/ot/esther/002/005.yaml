base_translation:
  language: en
  yaml_path: translation/ot/esther/002/005.yaml
  text: There was a Jewish man in Susa the citadel[a], and his name was Mordecai son of Jair, son of Shimei, son of Kish[c][b], a Benjaminite.
translation:
  language: id
  text: Di benteng Susan[b] ada seorang Yahudi[a]. Namanya Mordekhai, anak Yair, anak Simei, anak Kish[c], seorang dari suku Benyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang Yudea.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di Susan, kota benteng itu.”
    reason: lexical_alternative
  - marker: c
    text: Dalam konteks silsilah, kata Ibrani yang diterjemahkan “anak” juga dapat menunjuk kepada keturunan yang lebih jauh.
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ יְהוּדִי
  choice: seorang Yahudi
  rationale: Dalam latar diaspora Persia, frasa ini terutama menyatakan identitas orang tersebut sebagai bagian dari bangsa Yahudi. Pilihan ini alami dalam bahasa Indonesia, sementara kemungkinan arti geografis-etnis ‘orang Yudea’ dicatat dalam catatan kaki.
- source_word: הָיָה
  choice: ada
  rationale: Bentuk ini memperkenalkan tokoh baru secara eksistensial dan sesuai dengan fungsi הָיָה dalam pembukaan narasi.
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: di Susan, kota benteng itu
  rationale: Terjemahan ini mempertahankan susunan aposisional Ibrani dan menyampaikan bahwa Susan yang dimaksud adalah pusat kerajaan yang berbenteng, bukan sekadar kota secara umum.
- source_word: וּשְׁמוֹ
  choice: Namanya
  rationale: Ungkapan ringkas dan wajar dalam narasi Indonesia untuk memperkenalkan nama tokoh, tanpa mengubah hubungan koordinatif dalam teks.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Nama ditransliterasikan dengan bentuk Indonesia yang cukup dekat dengan bunyi Ibrani dan lazim dikenali pembaca Alkitab.
- source_word: בֶּן יָאִיר בֶּן שִׁמְעִי בֶּן קִישׁ
  choice: anak Yair, anak Simei, anak Kish
  rationale: Kata בֶּן diterjemahkan secara transparan sebagai ‘anak’. Karena dalam silsilah kata itu juga dapat menunjuk keturunan yang lebih jauh, kemungkinan tersebut dipertahankan melalui catatan kaki.
- source_word: אִישׁ יְמִינִי
  choice: seorang dari suku Benyamin
  rationale: Dalam konteks silsilah, frasa ini menyatakan afiliasi kesukuan. Bentuk ini lebih jelas dan alami bagi pembaca Indonesia daripada istilah turunan yang kurang lazim.
