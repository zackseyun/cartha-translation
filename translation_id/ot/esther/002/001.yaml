  text: אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה כְּ/שֹׁ֕ךְ חֲמַ֖ת הַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֑וֹשׁ זָכַ֤ר אֶת וַשְׁתִּי֙ וְ/אֵ֣ת אֲשֶׁר עָשָׂ֔תָה וְ/אֵ֥ת אֲשֶׁר נִגְזַ֖ר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/001.yaml
  text: After these things[a], when the anger of King Ahasuerus had subsided, he remembered Vashti, what she had done[b], and what had been decreed against her.
translation:
  language: id
  text: Sesudah peristiwa-peristiwa itu, ketika amarah Raja Ahasyweros telah mereda, ia mengingat Wasti, apa yang telah dilakukannya, dan apa yang telah ditetapkan terhadapnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: Sesudah peristiwa-peristiwa itu
  rationale: Ungkapan waktu ini membuka adegan berikutnya. “Peristiwa-peristiwa” menyampaikan maksud idiom Ibrani secara wajar dalam bahasa Indonesia modern.
- source_word: כְּשֹׁךְ חֲמַת
  choice: ketika amarah ... telah mereda
  rationale: שׁכך menyatakan surut atau tenangnya kemarahan; bentuk temporal dan aspek “telah” sesuai dengan kilas balik naratif.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Gelar ditempatkan sebelum nama menurut kebiasaan bahasa Indonesia, dan bentuk nama mengikuti transliterasi Alkitab Indonesia yang lazim.
- source_word: זָכַר אֶת וַשְׁתִּי
  choice: ia teringat kepada Wasti
  rationale: זכר berarti mengingat atau membawa kembali ke dalam pikiran; “teringat kepada” alami untuk konstruksi dengan orang sebagai objek.
- source_word: וְאֵת אֲשֶׁר עָשָׂתָה
  choice: kepada apa yang telah dilakukannya
  rationale: Klausa relatif diterjemahkan langsung, sedangkan “telah” menunjukkan bahwa tindakan Wasti mendahului saat raja mengingatnya.
- source_word: וְאֵת אֲשֶׁר נִגְזַר עָלֶיהָ
  choice: dan kepada apa yang telah ditetapkan terhadapnya
  rationale: Bentuk pasif נִגְזַר menunjuk pada keputusan resmi yang telah ditetapkan. “Terhadapnya” mempertahankan arah עָלֶיהָ dan nuansa bahwa keputusan itu berdampak buruk bagi Wasti tanpa menambah penafsiran.
