  verdict: revise
  source_fidelity: Teks draft menangkap urutan tindakan dan atribusi laporan kepada Mordekai dengan baik. Namun, “perkara itu diketahui Mordekai” kurang idiomatis dalam bahasa Indonesia modern dan tidak sejelas konstruksi Ibrani Nifal yang menyatakan bahwa perkara itu sampai ke pengetahuan Mordekai, tanpa menyebut pihak yang memberi tahu.
  naturalness: “Sampai kepada pengetahuan Mordekai” adalah ungkapan modern-baku yang lebih lancar dan secara tepat menjaga nuansa pasif/inchoatif. “Memberitahukannya” lebih netral daripada “melaporkannya” dan lebih langsung mencerminkan kedua verba pengungkapan dalam ayat ini.
  terminology: “Ratu Ester,” “raja,” dan “atas nama Mordekai” tepat. Frasa terakhir dipertahankan karena mencerminkan בְּשֵׁם dan tidak memutuskan secara berlebihan apakah maknanya terutama atribusi sumber atau tindakan sebagai wakilnya.
