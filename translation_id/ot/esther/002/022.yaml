base_translation:
  language: en
  yaml_path: translation/ot/esther/002/022.yaml
  text: When the matter became known to Mordecai[a], he told Queen Esther[c][b], and Esther told the king in Mordecai's name.
translation:
  language: id
  text: Ketika perkara itu sampai kepada pengetahuan Mordekai[a], ia memberitahukannya kepada Ratu Ester, lalu Ester memberitahukannya kepada raja atas nama Mordekai[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkara itu diberitahukan kepada Mordekai.” Bentuk pasif Ibrani dapat menekankan bahwa perkara itu sampai kepada pengetahuannya atau bahwa seseorang memberitahukannya.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menunjukkan bahwa Ester menyampaikan laporan itu sebagai laporan yang berasal dari Mordekai; dapat juga diterjemahkan “dalam nama Mordekai” atau “dengan menyebut nama Mordekai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּדַע
  choice: diketahui
  rationale: 'Bentuk Nifal dari ידע bersifat pasif: perkara itu sampai kepada pengetahuan Mordekai. ''Diketahui Mordekai'' mempertahankan kepasifan tanpa menentukan siapa yang memberitahunya.'
- source_word: הַדָּבָר
  choice: perkara itu
  rationale: דבר bersifat luas, tetapi dalam konteks langsung menunjuk pada rencana pembunuhan yang baru disebutkan. 'Perkara itu' alami dan tidak lebih menafsirkan daripada teks.
- source_word: לְמָרְדֳּכַי
  choice: Mordekai
  rationale: Preposisi ל dengan verba pasif menandai orang yang menerima pengetahuan tersebut; dalam bahasa Indonesia hal ini dapat dinyatakan secara alami dengan 'diketahui Mordekai'.
- source_word: וַיַּגֵּד
  choice: ia melaporkannya
  rationale: Hifil נגד berarti memberitahukan atau melaporkan. Dalam konteks rencana terhadap raja, 'melaporkannya' terdengar alami dan objek '-nya' merujuk pada perkara itu.
- source_word: לְאֶסְתֵּר הַמַּלְכָּה
  choice: kepada Ratu Ester
  rationale: Ungkapan Ibrani secara harfiah berbentuk aposisi, 'kepada Ester, sang ratu'; 'Ratu Ester' adalah susunan gelar yang alami dalam bahasa Indonesia.
- source_word: וַתֹּאמֶר
  choice: menyampaikannya
  rationale: אמר pada konteks ini menggambarkan Ester menyampaikan laporan kepada raja. 'Menyampaikannya' menghindari bentuk kurang alami 'berkata kepada raja' tanpa menambahkan isi baru.
- source_word: לַמֶּלֶךְ
  choice: kepada raja
  rationale: Mencerminkan langsung frasa berpreposisi dan mempertahankan latar istana.
- source_word: בְּשֵׁם מָרְדֳּכָי
  choice: atas nama Mordekai
  rationale: בשם berarti 'dalam/atas nama'. Di sini Ester mengaitkan laporan tersebut dengan Mordekai sebagai sumbernya; 'atas nama Mordekai' mempertahankan ungkapan tersebut, dengan penjelasan dalam catatan kaki.
