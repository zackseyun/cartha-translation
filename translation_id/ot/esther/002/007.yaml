translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Nama Ibrani ditransliterasikan sebagai 'Mordekhai' dan 'Hadasa'. Deskripsi fisik diterjemahkan dengan dua ungkapan berbeda untuk mempertahankan kesejajaran יְפַת תֹּאַר dan טוֹבַת מַרְאֶה. Semua penanda catatan kaki muncul dalam teks utama.
