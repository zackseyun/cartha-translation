  text: וַ/יְהִ֨י אֹמֵ֜ן אֶת הֲדַסָּ֗ה הִ֤יא אֶסְתֵּר֙ בַּת דֹּד֔/וֹ כִּ֛י אֵ֥ין לָ֖/הּ אָ֣ב וָ/אֵ֑ם וְ/הַ/נַּעֲרָ֤ה יְפַת תֹּ֨אַר֙ וְ/טוֹבַ֣ת מַרְאֶ֔ה וּ/בְ/מ֤וֹת אָבִ֨י/הָ֙ וְ/אִמָּ֔/הּ לְקָחָ֧/הּ מָרְדֳּכַ֛י ל֖/וֹ לְ/בַֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/007.yaml
  text: He was bringing up Hadassah—that is[a], Esther—the daughter of his uncle, because she had neither father nor mother. The young woman was beautiful in form and attractive in appearance, and when her father and her mother died[b], Mordecai took her as his own daughter.
translation:
  language: id
  text: Mordekhai mengasuh Hadasa, yaitu Ester, anak perempuan pamannya[a], sebab ia tidak mempunyai ayah maupun ibu. Perempuan muda itu elok perawakannya dan cantik parasnya. Ketika ayah dan ibunya meninggal, Mordekhai mengambilnya sebagai anak perempuannya sendiri.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan pamannya”; maksudnya, sepupu Mordekhai.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Mordekhai mengangkatnya sebagai anak perempuan.” Secara lebih harfiah, teks Ibrani mengatakan bahwa Mordekhai “mengambilnya bagi dirinya sebagai anak perempuan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמֵן
  choice: mengasuh
  rationale: Bentuk partisip ini menggambarkan peran Mordekhai yang terus berlangsung dalam merawat dan membesarkan Ester. 'Mengasuh' alami dalam bahasa Indonesia dan tidak membatasi perannya pada status wali resmi.
- source_word: הֲדַסָּה הִיא אֶסְתֵּר
  choice: Hadasa, yaitu Ester
  rationale: Pronomina הִיא bersifat aposisional dan menjelaskan bahwa kedua nama itu menunjuk kepada orang yang sama.
- source_word: בַּת דֹּדוֹ
  choice: anak perempuan pamannya
  rationale: Terjemahan ini mempertahankan ungkapan kekerabatan Ibrani secara eksplisit. Hubungan yang dimaksud adalah sepupu Mordekhai, tetapi kata Ibrani דּוֹד dapat berarti paman tanpa merinci dari pihak ayah atau ibu.
- source_word: כִּי אֵין לָהּ אָב וָאֵם
  choice: sebab ia sudah tidak mempunyai ayah maupun ibu
  rationale: Mengungkapkan secara langsung bahwa kedua orang tuanya tidak ada, sebagaimana teks Ibrani, alih-alih meringkasnya dengan kata 'yatim piatu'.
- source_word: הַנַּעֲרָה
  choice: perempuan muda
  rationale: נַעֲרָה dapat berarti gadis atau perempuan muda. Pilihan ini sesuai dengan konteks dan terdengar alami serta bermartabat dalam bahasa Indonesia modern.
- source_word: יְפַת תֹּאַר
  choice: elok perawakannya
  rationale: Frasa ini menyoroti keindahan bentuk atau perawakan tubuh. Pilihan tersebut mempertahankan nuansa fisiknya tanpa terdengar kaku.
- source_word: טוֹבַת מַרְאֶה
  choice: cantik parasnya
  rationale: Frasa ini menyatakan penampilan yang menyenangkan dan melengkapi keterangan tentang perawakan. 'Paras' menjaga pembedaan alami antara kedua unsur deskripsi.
- source_word: וּבְמוֹת אָבִיהָ וְאִמָּהּ
  choice: setelah ayah dan ibunya meninggal
  rationale: Ungkapan בְּ dengan bentuk infinitif menandai keadaan waktu. 'Setelah' sesuai dengan urutan logis tindakan Mordekhai dan alami dalam bahasa Indonesia.
- source_word: לְקָחָהּ מָרְדֳּכַי לוֹ לְבַת
  choice: Mordekhai mengambilnya sebagai anaknya sendiri
  rationale: Mencerminkan secara dekat ungkapan Ibrani 'mengambilnya bagi dirinya sebagai anak perempuan' tanpa memasukkan kategori hukum formal yang belum tentu dimaksudkan oleh kata 'mengadopsi'.
