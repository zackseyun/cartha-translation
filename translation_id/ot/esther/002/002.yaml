  text: וַ/יֹּאמְר֥וּ נַעֲרֵֽי הַ/מֶּ֖לֶךְ מְשָׁרְתָ֑י/ו יְבַקְשׁ֥וּ לַ/מֶּ֛לֶךְ נְעָר֥וֹת בְּתוּל֖וֹת טוֹב֥וֹת מַרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/002.yaml
  text: Then the king’s young men who attended him said[b][a], “Let young virgins beautiful in appearance be sought for the king.”
translation:
  language: id
  text: Lalu para pemuda raja yang melayaninya berkata, “Hendaklah dicari bagi raja gadis-gadis muda yang masih perawan dan elok rupanya.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perempuan-perempuan muda, perawan-perawan, baik rupanya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, dengan mempertahankan bentuk aktif bahasa Ibrani, “Hendaklah mereka mencari bagi raja gadis-gadis muda yang masih perawan dan elok rupanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Waw konsekutif melanjutkan urutan narasi; “lalu” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: para pemuda raja
  rationale: נַעַר dapat berarti pemuda atau pelayan. Karena מְשָׁרְתָיו sudah secara khusus menyatakan fungsi mereka sebagai pelayan, “para pemuda raja” mempertahankan perbedaan leksikal itu.
- source_word: מְשָׁרְתָיו
  choice: yang melayaninya
  rationale: Partisip dari שׁרת menggambarkan orang-orang yang melayani atau mendampingi raja; klausa relatif ini alami dan jelas dalam bahasa Indonesia.
- source_word: יְבַקְשׁוּ
  choice: Hendaklah dicari
  rationale: Bentuk Ibrani secara morfologis aktif jamak, tetapi pelakunya tidak disebutkan. Bentuk pasif dalam bahasa Indonesia menyampaikan usulan atau perintah itu secara alami tanpa menambahkan pelaku tertentu.
- source_word: לַמֶּלֶךְ
  choice: bagi raja
  rationale: Mengungkapkan datif kepentingan atau tujuan secara ringkas tanpa menambahkan gagasan seperti “untuk dipakai raja”.
- source_word: נְעָרוֹת בְּתוּלוֹת
  choice: gadis-gadis muda yang masih perawan
  rationale: נְעָרוֹת menunjukkan perempuan muda, sedangkan בְּתוּלוֹת secara khusus menyatakan bahwa mereka perawan. Terjemahan ini mempertahankan kedua unsur tersebut dengan bahasa modern yang mudah dipahami.
- source_word: טוֹבוֹת מַרְאֶה
  choice: elok rupanya
  rationale: Ungkapan Ibrani secara harfiah berarti “baik dalam penampilan” dan menunjuk pada keelokan fisik; “elok rupanya” ringkas, wajar, dan cukup dekat dengan bentuk ungkapan sumber.
theological_decisions: []
