  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat mempertahankan dua pernyataan tentang ketaatan Ester, sementara istilah kekerabatan dan pengasuhan dibiarkan cukup luas sesuai cakupan bahasa Ibrani.
