base_translation:
  language: en
  yaml_path: translation/ot/esther/002/020.yaml
  text: Esther had not made known her family line or her people[a], just as Mordecai had commanded her; and Esther kept doing what Mordecai said[b], as when she was under his care.
translation:
  language: id
  text: Ester belum memberitahukan asal-usul ataupun bangsanya[a], tepat seperti yang diperintahkan Mordekhai kepadanya. Ester tetap melakukan apa yang dikatakan Mordekhai, seperti ketika ia masih diasuh olehnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “garis keturunan ataupun bangsanya.” Kata Ibrani yang diterjemahkan “asal-usul” dapat merujuk pada kelahiran, garis keturunan, atau kaum kerabat.
    reason: lexical_alternative
  - marker: b
    text: Atau “seperti ketika ia dibesarkan olehnya.” Bahasa Ibrani mengingatkan pada masa Ester berada dalam pengasuhan Mordekhai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... מַגֶּדֶת
  choice: belum memberitahukan
  rationale: Gabungan penyangkalan dengan partisip menunjukkan bahwa sampai pada titik cerita ini Ester tidak mengungkapkannya; 'belum' menyampaikan nuansa tersebut secara alami dalam narasi Indonesia.
- source_word: מוֹלַדְתָּהּ
  choice: asal-usulnya
  rationale: Kata ini dapat menunjuk pada kelahiran, garis keturunan, atau kaum kerabat. 'Asal-usul' cukup luas, wajar dalam bahasa Indonesia modern, dan tidak mempersempit maknanya hanya menjadi silsilah.
- source_word: עַמָּהּ
  choice: bangsanya
  rationale: Dalam konteks ini עַם menunjuk pada identitas umat atau bangsa Ester; 'bangsanya' jelas dan alami tanpa memakai kategori etnis modern yang lebih sempit.
- source_word: כַּאֲשֶׁר צִוָּה עָלֶיהָ
  choice: tepat seperti yang diperintahkan Mordekhai kepadanya
  rationale: '''Diperintahkan'' mempertahankan daya צוה yang lebih kuat daripada sekadar nasihat, sedangkan ''tepat seperti'' mencerminkan כַּאֲשֶׁר.'
- source_word: מַאֲמַר מָרְדֳּכַי
  choice: apa yang dikatakan Mordekhai
  rationale: מַאֲמַר dapat berarti perkataan, ucapan, atau perintah. Pilihan ini mempertahankan keluasan makna dan menghindari pengulangan 'perintah' setelah צוה.
- source_word: עֹשָׂה
  choice: tetap melakukan
  rationale: Bentuk partisip menggambarkan tindakan yang berlanjut atau menjadi kebiasaan; 'tetap melakukan' menyatakan pola ketaatan Ester secara alami.
- source_word: בְאָמְנָה אִתּוֹ
  choice: ketika ia masih diasuh olehnya
  rationale: Ungkapan ini mengenang masa Ester dibesarkan atau berada dalam pengasuhan Mordekhai. 'Diasuh olehnya' mempertahankan unsur pengasuhan tanpa menentukan secara berlebihan status hukum hubungan itu.
