id: EST.2.6
reference: Esther 2:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁ֤ר הָגְלָה֙ מִ/יר֣וּשָׁלַ֔יִם עִם הַ/גֹּלָה֙ אֲשֶׁ֣ר הָגְלְתָ֔ה עִ֖ם יְכָנְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/006.yaml
  text: who had been taken into exile from Jerusalem with the exiles who had been taken into exile with Jeconiah king of Judah[a], whom Nebuchadnezzar king of Babylon had taken into exile.
translation:
  language: id
  text: yang telah dibawa ke pembuangan dari Yerusalem bersama orang-orang buangan yang telah dibawa ke pembuangan bersama Yekhonya, raja Yehuda[a], yang dibawa ke pembuangan oleh Nebukadnezar, raja Babel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, kata “yang” dapat mengacu kepada Kish, leluhur Mordekhai, bukan kepada Mordekhai sendiri, sebab pembuangan Yekhonya terjadi beberapa generasi sebelumnya.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia yang alami; dalam alur permukaan ayat ini mengacu kepada Mordekhai, sambil tetap memungkinkan persoalan anteseden dijelaskan dalam catatan kaki.
- source_word: הָגְלָה
  choice: telah dibawa ke pembuangan
  rationale: Menyampaikan tindakan deportasi yang dipaksakan dan mempertahankan pengulangan akar גלה dalam ayat ini.
- source_word: מִירוּשָׁלַיִם
  choice: dari Yerusalem
  rationale: Padanan langsung bagi preposisi dan nama tempat.
- source_word: עִם הַגֹּלָה
  choice: bersama orang-orang buangan
  rationale: Nomina kolektif ini menunjuk kepada kelompok orang yang dibuang, bukan hanya keadaan pembuangan secara abstrak.
- source_word: אֲשֶׁר הָגְלְתָה
  choice: yang telah dibawa ke pembuangan
  rationale: Verba feminin tunggal bersesuaian dengan nomina kolektif הַגֹּלָה; bentuk jamak semantis dalam bahasa Indonesia mengungkapkan kelompok itu secara alami.
- source_word: יְכָנְיָה
  choice: Yekhonya
  rationale: Transliterasi Indonesia yang dekat dengan bentuk Ibrani pada ayat ini, tanpa menggantinya dengan bentuk nama kerajaan lain yang diselaraskan.
- source_word: מֶלֶךְ יְהוּדָה
  choice: raja Yehuda
  rationale: Padanan baku bagi konstruksi status constructus.
- source_word: אֲשֶׁר הֶגְלָה
  choice: yang dibawa ke pembuangan oleh
  rationale: Bentuk pasif Indonesia mempertahankan kelompok orang buangan sebagai sasaran tindakan, sedangkan Nebukadnezar dinyatakan sebagai pelakunya; pengulangan 'dibawa ke pembuangan' mencerminkan pengulangan גלה.
- source_word: נְבוּכַדְנֶאצַּר
  choice: Nebukadnezar
  rationale: Bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: מֶלֶךְ בָּבֶל
  choice: raja Babel
  rationale: Padanan baku bagi konstruksi Ibrani dan nama tempat yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Anteseden klausa relatif dalam Ester 2:6
  choice: Teks utama mengikuti alur sintaksis terdekat dengan memahami klausa itu sebagai keterangan tentang Mordekhai.
  alternative: Klausa itu mungkin mengacu kepada Kish, leluhur Mordekhai, karena pembuangan Yekhonya terjadi beberapa generasi sebelumnya.
  rationale: Susunan permukaan bahasa Ibrani paling dekat mengaitkan klausa relatif dengan Mordekhai dalam ayat 5, tetapi pertimbangan kronologis membuat rujukan kepada Kish sungguh mungkin. Ambiguitas ini dipertahankan melalui catatan kaki, bukan diputuskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan frasa “dibawa ke pembuangan” sengaja dipertahankan untuk mencerminkan pengulangan akar גלה dalam teks Ibrani. Tanda koma membantu memperjelas gelar raja tanpa menghapus rantai klausa relatif sumber.
