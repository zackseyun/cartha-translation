  text: וּ/בְ/כָל י֣וֹם וָ/י֔וֹם מָרְדֳּכַי֙ מִתְהַלֵּ֔ךְ לִ/פְנֵ֖י חֲצַ֣ר בֵּית הַ/נָּשִׁ֑ים לָ/דַ֨עַת֙ אֶת שְׁל֣וֹם אֶסְתֵּ֔ר וּ/מַה יֵּעָשֶׂ֖ה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/011.yaml
  text: And every single day Mordecai would walk back and forth in front of the courtyard of the women’s house, to learn how Esther was doing and what would be done with her.
translation:
  language: id
  text: Setiap hari, Mordekhai berjalan mondar-mandir di depan pelataran tempat tinggal para perempuan untuk mengetahui keadaan Ester dan apa yang akan dilakukan terhadapnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל יוֹם וָיוֹם
  choice: Setiap hari
  rationale: Ungkapan distributif Ibrani menekankan tindakan yang berlangsung hari demi hari; bentuk ini paling alami dalam bahasa Indonesia tanpa kehilangan maknanya.
- source_word: מִתְהַלֵּךְ
  choice: berjalan mondar-mandir
  rationale: Bentuk partisipel hitpael menggambarkan kegiatan berjalan berulang atau hilir-mudik, bukan sekadar satu kali berjalan.
- source_word: בֵּית הַנָּשִׁים
  choice: tempat tinggal para perempuan
  rationale: Secara harfiah berarti 'rumah para perempuan'; dalam konteks istana, frasa ini menunjuk tempat mereka ditempatkan. Pilihan ini alami dan tidak menambahkan istilah teknis yang tidak ada dalam teks.
- source_word: אֶת שְׁלוֹם אֶסְתֵּר
  choice: keadaan Ester
  rationale: Konstruksi idiomatis ini menanyakan kesejahteraan atau keadaan seseorang. 'Keadaan Ester' menyampaikan cakupan maknanya secara alami.
- source_word: וּמַה יֵּעָשֶׂה בָּהּ
  choice: dan apa yang akan dilakukan terhadapnya
  rationale: Mempertahankan bentuk pasif dan ketidakpastian teks mengenai tindakan yang akan dikenakan kepada Ester.
