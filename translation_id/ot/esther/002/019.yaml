  source_fidelity: Terjemahan dengan tepat mencerminkan klausa waktu וּבְהִקָּבֵץ, bentuk pasif Nifal dalam “dikumpulkan,” penanda eksplisit בְּתוּלוֹת dalam “para perawan,” serta שֵׁנִית dalam “untuk kedua kalinya.” “Sedang duduk” secara memadai menyampaikan nilai keadaan berlangsung dari partisipel יֹשֵׁב. “Di gerbang raja” setia pada lokasi yang disebut teks, tanpa mempersempitnya secara tidak perlu.
  naturalness: Kalimatnya baku, jelas, dan mengalir alami dalam bahasa Indonesia modern. “Mordekhai” dan “gerbang raja” dapat dipahami dengan baik dalam register naratif Alkitab.
  terminology: Istilah “perawan” mempertahankan makna leksikal sumber yang lebih khusus daripada sekadar perempuan muda. Bentuk nama “Mordekhai” lazim dan konsisten dengan transliterasi Indonesia. Catatan untuk “gerbang raja” secara tepat memberi konteks administratif-istana tanpa menjadikannya bagian dari terjemahan utama.
