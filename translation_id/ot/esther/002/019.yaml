  text: וּ/בְ/הִקָּבֵ֥ץ בְּתוּל֖וֹת שֵׁנִ֑ית וּ/מָרְדֳּכַ֖י יֹשֵׁ֥ב בְּ/שַֽׁעַר הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/019.yaml
  text: When the virgins were gathered a second time[b][a], Mordecai was sitting at the king's gate.
translation:
  language: id
  text: Ketika para perawan dikumpulkan untuk kedua kalinya[a], Mordekhai sedang duduk di gerbang raja[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lagi”. Secara harfiah, teks Ibrani berbunyi “untuk kedua kalinya”.
    reason: lexical_alternative
  - marker: b
    text: “Gerbang raja” kemungkinan besar menunjuk pada kawasan gerbang istana kerajaan, tempat yang berkaitan dengan pelayanan resmi dan urusan pemerintahan.
    reason: cultural_note
lexical_decisions:
- source_word: וּבְהִקָּבֵץ
  choice: Ketika ... dikumpulkan
  rationale: Preposisi בְּ dengan infinitif konstruk memperkenalkan anak kalimat waktu, sedangkan bentuk Nifal mempertahankan makna pasif “dikumpulkan”. Konjungsi וּ tidak perlu diterjemahkan tersendiri karena hubungan naratifnya sudah alami dalam bahasa Indonesia.
- source_word: בְּתוּלוֹת
  choice: para perawan
  rationale: Kata ini secara langsung menunjukkan perempuan yang masih perawan; “para perempuan muda” akan menghilangkan unsur makna tersebut dalam konteks pemilihan perempuan di istana.
- source_word: שֵׁנִית
  choice: untuk kedua kalinya
  rationale: Ungkapan ini mempertahankan arti harfiah “kedua kalinya” dan lebih tegas daripada “lagi”.
- source_word: וּמָרְדֳּכַי
  choice: Mordekhai
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Partisipel Qal menggambarkan keadaan yang sedang berlangsung; “sedang duduk” mempertahankan aspek duratif itu.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: di gerbang raja
  rationale: Preposisi dan nomina menunjuk lokasi di kawasan gerbang milik raja. Terjemahan ini dekat dengan bentuk Ibrani, sementara cakupan tempatnya dijelaskan dalam catatan.
