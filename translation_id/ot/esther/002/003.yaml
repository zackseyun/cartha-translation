  text: וְ/יַפְקֵ֨ד הַ/מֶּ֣לֶךְ פְּקִידִים֮ בְּ/כָל מְדִינ֣וֹת מַלְכוּת/וֹ֒ וְ/יִקְבְּצ֣וּ אֶת כָּל נַעֲרָֽה בְ֠תוּלָה טוֹבַ֨ת מַרְאֶ֜ה אֶל שׁוּשַׁ֤ן הַ/בִּירָה֙ אֶל בֵּ֣ית הַ/נָּשִׁ֔ים אֶל יַ֥ד הֵגֶ֛א סְרִ֥יס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וְ/נָת֖וֹן תַּמְרוּקֵי/הֶֽן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/003.yaml
  text: Let the king appoint officers in all the provinces of his kingdom[a], and let them gather every young virgin of beautiful appearance to Susa the citadel, to the house of the women, into the custody of Hegai the king’s eunuch, keeper of the women[b]; and let their cosmetics be given to them.
translation:
  language: id
  text: Hendaklah raja mengangkat para pejabat di seluruh provinsi kerajaannya. Hendaklah mereka mengumpulkan setiap perempuan muda yang masih perawan dan berparas cantik ke benteng Susan, ke rumah para perempuan[a], di bawah pengawasan Hegai, sida-sida raja yang bertugas menjaga para perempuan. Hendaklah diberikan kepada mereka bahan-bahan kecantikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harem”. Secara lebih harfiah, bahasa Ibraninya berbunyi “rumah para perempuan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “perawatan kecantikan”. Istilah Ibrani ini dapat merujuk pada bahan kosmetik maupun perawatan untuk mempercantik diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַפְקֵד
  choice: mengangkat
  rationale: Bentuk hiphil dari פקד dalam konteks administrasi kerajaan berarti menunjuk atau mengangkat seseorang untuk suatu tugas.
- source_word: פְּקִידִים
  choice: para pejabat
  rationale: Merujuk kepada petugas kerajaan yang diberi tanggung jawab administratif; 'pejabat' tidak menyiratkan pangkat militer.
- source_word: מְדִינוֹת מַלְכוּתוֹ
  choice: seluruh provinsi kerajaannya
  rationale: Istilah administratif yang wajar untuk wilayah-wilayah dalam kekaisaran Persia.
- source_word: וְיִקְבְּצוּ
  choice: hendaklah mereka mengumpulkan
  rationale: Mempertahankan rangkaian bentuk perintah tidak langsung dalam usulan para pelayan raja.
- source_word: כָּל נַעֲרָה בְתוּלָה
  choice: setiap perempuan muda yang masih perawan
  rationale: 'Menyampaikan kedua unsur sumber: usia muda dan keperawanan.'
- source_word: טוֹבַת מַרְאֶה
  choice: berparas cantik
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan penekanan pada penampilan fisik.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: benteng Susan
  rationale: הבירה menunjuk pada kompleks kerajaan berbenteng; 'benteng Susan' ringkas dan lazim dalam konteks kitab Ester.
- source_word: בֵּית הַנָּשִׁים
  choice: tempat para perempuan
  rationale: Mengungkapkan arti harfiah 'rumah para perempuan' secara alami tanpa langsung memasukkan istilah interpretatif 'harem'.
- source_word: אֶל יַד הֵגֶא
  choice: di bawah pengawasan Hegai
  rationale: Idiom 'ke dalam tangan' menyatakan wewenang, tanggung jawab, atau pengawasan seseorang.
- source_word: סְרִיס
  choice: sida-sida
  rationale: Arti leksikal utama sesuai dengan konteks tempat tinggal para perempuan di lingkungan istana.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: yang bertugas menjaga para perempuan
  rationale: Menyampaikan fungsi partisipial Hegai dalam bahasa Indonesia modern dan jelas.
- source_word: וְנָתוֹן תַּמְרוּקֵיהֶן
  choice: hendaklah para perempuan itu diberi perlengkapan kecantikan
  rationale: Menyampaikan penyediaan bahan atau sarana untuk mempercantik diri, dengan konstruksi pasif yang alami dalam bahasa Indonesia.
