  to: Hendaklah raja mengangkat para pejabat di seluruh provinsi kerajaannya. Hendaklah mereka mengumpulkan setiap perempuan muda yang masih perawan dan berparas cantik ke benteng Susan, ke rumah para perempuan[a], di bawah pengawasan Hegai, sida-sida raja yang bertugas menjaga para perempuan. Hendaklah diberikan kepada mereka bahan-bahan kecantikan[b].
