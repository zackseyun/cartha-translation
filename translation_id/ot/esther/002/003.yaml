    issue: “tempat para perempuan” tidak memelihara metafora/leksikon בית secara penuh.
    rationale: בית הנשים secara harfiah berarti “rumah para perempuan.” Karena catatan kaki juga mengontraskan “harem” dengan ungkapan harfiah itu, teks utama sebaiknya memakai “rumah para perempuan.”
  - severity: low
    issue: “perlengkapan kecantikan” dapat terdengar seperti alat atau peralatan.
    rationale: תמרוקים menunjuk pada persiapan kosmetik, ramuan, atau perawatan kecantikan. “Bahan-bahan kecantikan” menyampaikan kategori benda yang disediakan tanpa membatasi makna hanya pada kosmetik modern atau hanya pada perawatan.
