translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'hendaklah' mempertahankan nada usulan resmi. Kalimat sumber yang panjang dibagi agar mudah dipahami tanpa mengubah hubungan antargagasannya.
