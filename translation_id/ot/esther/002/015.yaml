  text: וּ/בְ/הַגִּ֣יעַ תֹּר אֶסְתֵּ֣ר בַּת אֲבִיחַ֣יִל דֹּ֣ד מָרְדֳּכַ֡י אֲשֶׁר֩ לָקַֽח ל֨/וֹ לְ/בַ֜ת לָ/ב֣וֹא אֶל הַ/מֶּ֗לֶךְ לֹ֤א בִקְשָׁה֙ דָּבָ֔ר כִּ֠י אִ֣ם אֶת אֲשֶׁ֥ר יֹאמַ֛ר הֵגַ֥י סְרִיס הַ/מֶּ֖לֶךְ שֹׁמֵ֣ר הַ/נָּשִׁ֑ים וַ/תְּהִ֤י אֶסְתֵּר֙ נֹשֵׂ֣את חֵ֔ן בְּ/עֵינֵ֖י כָּל רֹאֶֽי/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/015.yaml
  text: When Esther’s turn came—the daughter of Abihail[a], the uncle of Mordecai, who had taken her as his own daughter—to go in to the king, she asked for nothing except what Hegai, the king’s eunuch, keeper of the women, advised[b]. And Esther was gaining favor in the eyes of all who saw her.
translation:
  language: id
  text: Ketika tiba giliran Ester—anak Abihail, paman Mordekhai—yang telah diambil Mordekhai sebagai anaknya sendiri[a] untuk menghadap raja, ia tidak meminta apa pun selain yang disarankan Hegai, sida-sida raja[b] yang bertugas menjaga para perempuan. Ester mendapat perkenanan di mata semua orang yang melihatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambilnya sebagai anak perempuan.” Ungkapan Ibrani ini berarti Mordekhai menerima Ester dalam pemeliharaannya sebagai seorang anak.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini kadang-kadang dapat berarti “pejabat istana”, tetapi konteks tempat tinggal para perempuan di sini mendukung arti yang lebih khusus, “sida-sida”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַגִּיעַ תֹּר
  choice: Ketika tiba giliran
  rationale: Gabungan preposisi dan infinitif membentuk anak kalimat waktu, sedangkan תֹּר menunjuk pada giliran Ester dalam urutan para perempuan yang menghadap raja.
- source_word: דֹּד מָרְדֳּכַי
  choice: paman Mordekhai
  rationale: Dalam konteks silsilah yang telah diberikan di Ester 2:7, דֹּד menyatakan hubungan Abihail sebagai paman Mordekhai.
- source_word: לָקַח לוֹ לְבַת
  choice: telah mengambil Ester sebagai anaknya sendiri
  rationale: Ungkapan ini menyatakan bahwa Mordekhai menerima dan memelihara Ester dalam hubungan sebagai ayah dan anak, tanpa harus menyiratkan prosedur adopsi resmi.
- source_word: לָבוֹא אֶל־הַמֶּלֶךְ
  choice: untuk menghadap raja
  rationale: Ungkapan Indonesia ini alami untuk memasuki hadirat seorang raja dan tetap mempertahankan cara penyampaian Ibrani yang tidak menjelaskan lebih jauh konteks perjumpaan itu.
- source_word: לֹא בִקְשָׁה דָּבָר
  choice: ia tidak meminta apa pun
  rationale: Terjemahan langsung dan alami yang menyatakan bahwa Ester tidak meminta barang atau perlengkapan tambahan.
- source_word: כִּי אִם אֵת אֲשֶׁר יֹאמַר
  choice: selain yang disarankan
  rationale: Konstruksi כִּי אִם menandai pengecualian. Dalam konteks persiapan untuk menghadap raja, perkataan Hegai berfungsi sebagai saran, tetapi benda yang disarankan tetap tidak disebutkan sebagaimana dalam teks Ibrani.
- source_word: סְרִיס הַמֶּלֶךְ
  choice: sida-sida raja
  rationale: Makna khusus 'sida-sida' paling sesuai dengan lingkungan tempat tinggal para perempuan kerajaan, meskipun kata itu juga dapat dipakai lebih umum bagi pejabat istana.
- source_word: שֹׁמֵר הַנָּשִׁים
  choice: yang bertugas menjaga para perempuan
  rationale: Frasa partisipial ini menjelaskan tanggung jawab Hegai atas para perempuan di lingkungan kerajaan.
- source_word: וַתְּהִי אֶסְתֵּר נֹשֵׂאת חֵן
  choice: Ester mendapat perkenanan
  rationale: Ungkapan harfiah 'membawa perkenanan' merupakan idiom untuk memperoleh atau menikmati perkenanan; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: בְּעֵינֵי כָּל רֹאֶיהָ
  choice: di mata semua orang yang melihatnya
  rationale: Terjemahan ini mempertahankan idiom sumber yang juga mudah dipahami dalam bahasa Indonesia.
