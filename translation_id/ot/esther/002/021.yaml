id: EST.2.21
reference: Esther 2:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מָרְדֳּכַ֖י יֹשֵׁ֣ב בְּ/שַֽׁעַר הַ/מֶּ֑לֶךְ קָצַף֩ בִּגְתָ֨ן וָ/תֶ֜רֶשׁ שְׁנֵֽי סָרִיסֵ֤י הַ/מֶּ֨לֶךְ֙ מִ/שֹּׁמְרֵ֣י הַ/סַּ֔ף וַ/יְבַקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵֽרֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/021.yaml
  text: In those days[a], while Mordecai was sitting at the king’s gate, Bigthan and Teresh, two of the king’s eunuchs from those who guarded the threshold[b], became angry and sought to lay hands on King Ahasuerus.
translation:
  language: id
  text: Pada waktu itu, ketika Mordekhai sedang duduk di gerbang raja, Bigtan dan Teresh, dua sida-sida[a] raja yang termasuk para penjaga ambang pintu, menjadi marah dan berusaha menyerang[b] Raja Ahasyweros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pejabat istana”; istilah Ibrani ini dapat menunjuk secara lebih luas kepada pejabat kerajaan, meskipun “sida-sida” mungkin lebih tepat dalam konteks istana ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “mengulurkan tangan terhadap”; maksudnya, menyerang atau membunuh raja.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada waktu itu
  rationale: Ungkapan pembingkai waktu naratif ini diterjemahkan secara alami tanpa menentukan rentang waktu yang tidak dinyatakan teks.
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Bentuk partisip menunjukkan keadaan yang sedang berlangsung; makna konkret 'duduk' sesuai dengan adegan di gerbang raja.
- source_word: בְּשַׁעַר הַמֶּלֶךְ
  choice: di gerbang raja
  rationale: Mempertahankan gambaran konkret sekaligus konteks gerbang sebagai kawasan administrasi kerajaan.
- source_word: קָצַף
  choice: menjadi marah
  rationale: Menyampaikan perubahan keadaan emosi tanpa melebihkan tingkat kemarahan; verba tunggal yang mendahului subjek majemuk dipahami berlaku bagi kedua orang itu.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: sida-sida raja
  rationale: Dalam lingkungan istana Persia, istilah ini kemungkinan besar menunjuk kepada sida-sida, meskipun dapat juga dipakai lebih luas untuk pejabat istana; kemungkinan itu dicatat dalam catatan kaki.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: yang termasuk para penjaga ambang pintu
  rationale: Menerjemahkan fungsi mereka dan mempertahankan citra konkret ambang pintu, yakni kawasan pintu masuk kerajaan.
- source_word: וַיְבַקְשׁוּ
  choice: berusaha
  rationale: Dalam konteks maksud bermusuhan, kata ini menunjukkan upaya atau niat yang diarahkan pada tindakan tanpa menambahkan rincian tentang persekongkolan.
- source_word: לִשְׁלֹחַ יָד
  choice: menyerang
  rationale: Ungkapan Ibrani harfiah 'mengulurkan tangan terhadap' menyatakan tindakan kekerasan. 'Menyerang' alami dalam bahasa Indonesia dan tidak mempersempitnya secara pasti menjadi pembunuhan.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasyweros
  rationale: Mentransliterasikan bentuk nama Ibrani dalam ejaan Indonesia, bukan menggantinya dengan identifikasi historis 'Xerxes'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah historis 'sida-sida' dipertahankan karena paling mungkin dalam konteks, dengan alternatif leksikal dijelaskan dalam catatan kaki. Penanda catatan kaki ditempatkan pada kata yang benar-benar dijelaskannya.
