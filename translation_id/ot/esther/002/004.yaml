  text: וְ/הַֽ/נַּעֲרָ֗ה אֲשֶׁ֤ר תִּיטַב֙ בְּ/עֵינֵ֣י הַ/מֶּ֔לֶךְ תִּמְלֹ֖ךְ תַּ֣חַת וַשְׁתִּ֑י וַ/יִּיטַ֧ב הַ/דָּבָ֛ר בְּ/עֵינֵ֥י הַ/מֶּ֖לֶךְ וַ/יַּ֥עַשׂ כֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/002/004.yaml
  text: And let the young woman who pleases the king become queen instead of Vashti[a]. The proposal pleased the king[c][b], and he did so.
translation:
  language: id
  text: Dan biarlah perempuan muda yang berkenan di mata raja itu menjadi ratu menggantikan Wasti.[a] Usul itu dipandang baik oleh raja,[b] lalu ia melaksanakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memerintah menggantikan Wasti.” Dalam konteks ini, maksudnya ialah menjadi ratu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Hal itu baik di mata raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעֲרָה
  choice: perempuan muda
  rationale: נַעֲרָה menunjuk pada seorang perempuan yang masih muda. Pilihan ini alami dalam bahasa Indonesia modern dan tidak memberi kesan usia terlalu belia seperti 'gadis' dalam sebagian konteks.
- source_word: אֲשֶׁר תִּיטַב בְּעֵינֵי הַמֶּלֶךְ
  choice: yang berkenan di mata raja
  rationale: Ungkapan ini menyatakan bahwa perempuan tersebut dinilai baik atau menyenangkan oleh raja. 'Berkenan di mata raja' mempertahankan citra idiom Ibrani sekaligus tetap wajar dan mudah dipahami.
- source_word: תִּמְלֹךְ
  choice: menjadi ratu
  rationale: Secara harfiah verba מלך berarti 'memerintah' atau 'menjadi raja/ratu'. Dalam konteks pemilihan pengganti Wasti, 'menjadi ratu' menyampaikan fungsi bentuk feminin dan maksud konteks secara alami.
- source_word: תַּחַת וַשְׁתִּי
  choice: menggantikan Wasti
  rationale: תַּחַת di sini menyatakan penggantian atau substitusi, bukan posisi ruang. 'Menggantikan Wasti' jelas dan alami dalam bahasa Indonesia.
- source_word: וַיִּיטַב הַדָּבָר בְּעֵינֵי הַמֶּלֶךְ
  choice: Usul itu dipandang baik oleh raja
  rationale: דָּבָר di sini merujuk pada gagasan atau usul yang baru diajukan. Bentuk 'dipandang baik' mempertahankan hubungan leksikal dengan idiom 'baik di mata' tanpa terdengar kaku.
- source_word: וַיַּעַשׂ כֵּן
  choice: lalu ia melaksanakannya
  rationale: Formula naratif ini berarti raja bertindak sesuai dengan usul tersebut. 'Melaksanakannya' lebih jelas daripada 'berbuat demikian' dan tetap ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Idiom 'di mata raja' dipertahankan pada klausa pertama karena alami dalam bahasa Indonesia, sedangkan pengulangannya pada klausa kedua dibuat lebih lancar sebagai 'dipandang baik oleh raja'. Nama וַשְׁתִּי ditransliterasikan sebagai 'Wasti', sesuai kebiasaan ejaan Alkitab bahasa Indonesia.
