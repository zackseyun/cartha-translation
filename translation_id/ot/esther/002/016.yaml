base_translation:
  language: en
  yaml_path: translation/ot/esther/002/016.yaml
  text: So Esther was taken to King Ahasuerus[a], into his royal palace, in the tenth month, which is the month Tebeth[b], in the seventh year of his reign.
translation:
  language: id
  text: Maka Ester dibawa menghadap Raja Ahasyweros[a] ke istana raja pada bulan kesepuluh, yaitu bulan Tebet[b], pada tahun ketujuh pemerintahannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibawa kepada Raja Ahasyweros.” Kata kerja Ibraninya berbentuk pasif, yang menekankan bahwa Ester dikenai tindakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “bulan Tebet,” nama Babilonia untuk bulan kesepuluh.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּלָּקַח
  choice: dibawa
  rationale: 'Bentuk Nifal mempertahankan makna pasif: Ester dikenai tindakan, bukan bertindak atas prakarsanya sendiri. Dalam konteks menghadap raja, ''dibawa'' lebih alami daripada ''diambil''.'
- source_word: אֶל הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: menghadap Raja Ahasyweros
  rationale: Kata אֶל menunjukkan gerak menuju raja. 'Dibawa menghadap' merupakan ungkapan Indonesia yang alami dalam konteks istana tanpa menghilangkan arah geraknya.
- source_word: אֶל בֵּית מַלְכוּתוֹ
  choice: ke istana kerajaannya
  rationale: Secara harfiah berarti 'ke rumah kerajaannya/kerajaan beliau'; dalam konteks ini menunjuk pada kediaman resmi raja. 'Istana kerajaannya' jelas dan mempertahankan nuansa kerajaan.
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי
  choice: pada bulan kesepuluh
  rationale: Padanan temporal yang langsung, alami, dan formal dalam bahasa Indonesia.
- source_word: הוּא חֹדֶשׁ טֵבֵת
  choice: yaitu bulan Tebet
  rationale: Kata 'yaitu' menyampaikan fungsi penjelas dari frasa Ibrani yang mengidentifikasi nama bulan kesepuluh.
- source_word: טֵבֵת
  choice: Tebet
  rationale: Transliterasi nama bulan Ibrani yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בִּשְׁנַת שֶׁבַע לְמַלְכוּתוֹ
  choice: pada tahun ketujuh pemerintahannya
  rationale: Ini adalah rumusan tahun pemerintahan raja; 'pemerintahannya' merupakan padanan Indonesia yang alami bagi מַלְכוּתוֹ dalam konstruksi temporal ini.
