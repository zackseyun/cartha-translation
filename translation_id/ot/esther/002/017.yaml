translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “Wasti” mengikuti ejaan nama yang lazim dalam Alkitab bahasa Indonesia. Struktur kalimat dibagi agar hubungan perbandingan tetap mudah dipahami, sementara perbedaan antara “perempuan” dan “gadis perawan” dipertahankan.
