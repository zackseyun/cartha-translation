base_translation:
  language: en
  yaml_path: translation/ot/esther/002/017.yaml
  text: The king loved Esther more than all the women[a], and she found favor and kindness before him more than all the virgins[b]. So he placed the royal crown on her head and made her queen instead of Vashti.
translation:
  language: id
  text: Raja mengasihi Ester lebih daripada semua perempuan. Ester mendapat perkenanan dan kebaikan[a] di hadapan raja, melebihi semua gadis perawan[b]. Lalu raja meletakkan mahkota kerajaan di atas kepala Ester dan mengangkatnya menjadi ratu menggantikan Wasti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi “membawa perkenanan dan kebaikan di hadapannya,” sebuah ungkapan yang berarti mendapat perkenanan dan kebaikan.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai istilah yang lebih khusus daripada kata “perempuan” pada kalimat sebelumnya, yaitu “gadis perawan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: mengasihi
  rationale: Kata kerja אהב menyatakan kasih atau afeksi, bukan sekadar pilihan atau kesukaan; “mengasihi” mempertahankan makna langsung itu dalam ragam yang bermartabat.
- source_word: מִכָּל הַנָּשִׁים
  choice: lebih daripada semua perempuan itu
  rationale: Konstruksi perbandingan מִן + כָּל diterjemahkan secara eksplisit; נָשִׁים adalah istilah umum untuk perempuan, dan kata “itu” menunjukkan kelompok perempuan dalam konteks istana.
- source_word: וַתִּשָּׂא חֵן וָחֶסֶד
  choice: mendapat perkenanan dan kebaikan
  rationale: 'Ungkapan Ibrani secara harfiah memakai kata kerja “membawa/mengangkat,” tetapi secara idiomatis berarti memperoleh atau mendapat. Dua nomina tetap dibedakan: חֵן sebagai perkenanan dan חֶסֶד di sini sebagai kebaikan hati.'
- source_word: לְפָנָיו
  choice: di hadapan raja
  rationale: Secara harfiah berarti “di hadapannya.” Penyebutan “raja” menghindari ketidakjelasan rujukan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: מִכָּל הַבְּתוּלֹת
  choice: melebihi semua gadis perawan
  rationale: בְּתוּלֹת lebih khusus daripada נָשִׁים dan menunjuk kepada para perawan; perbedaan leksikal dalam teks Ibrani dipertahankan.
- source_word: וַיָּשֶׂם כֶּתֶר מַלְכוּת
  choice: mengenakan mahkota kerajaan
  rationale: Frasa itu secara harfiah berarti menaruh mahkota kerajaan pada kepalanya. “Mengenakan” alami dalam bahasa Indonesia dan konteks kepala disebut secara eksplisit.
- source_word: וַיַּמְלִיכֶהָ
  choice: mengangkatnya menjadi ratu
  rationale: Bentuk kausatif dari מלך berarti menjadikan seseorang raja atau ratu; dalam konteks ini padanan alaminya ialah “mengangkatnya menjadi ratu.”
- source_word: תַּחַת וַשְׁתִּי
  choice: menggantikan Wasti
  rationale: Dalam konteks suksesi, תַּחַת berarti mengambil tempat seseorang; “menggantikan Wasti” menyampaikan makna tersebut secara ringkas dan alami.
