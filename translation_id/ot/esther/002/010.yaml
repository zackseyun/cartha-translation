  yaml_path: translation/ot/esther/002/010.yaml
  text: Esther had not disclosed her people or her kindred[a], because Mordecai had commanded her not to disclose it.
translation:
  language: id
  text: Ester tidak memberitahukan bangsanya dan asal-usulnya[a], sebab Mordekhai telah memerintahkannya supaya ia tidak memberitahukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum kerabatnya” atau “garis keturunannya.” Kata Ibrani ini dapat menunjuk pada kelahiran, kelompok kekerabatan, garis keturunan, atau tempat asal; di sini kemungkinan besar berkaitan dengan asal atau keturunan Ester.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידָה
  choice: tidak memberitahukan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau menyatakannya. Dalam konteks penyembunyian identitas Ester, “memberitahukan” alami dan mempertahankan pengulangan akar yang sama pada akhir ayat.
- source_word: עַמָּהּ
  choice: asal bangsanya
  rationale: עַם menunjuk pada kelompok etnis atau bangsa Ester. “Asal bangsanya” memperjelas bahwa yang dirahasiakan adalah identitas kebangsaannya, bukan kepemilikan atas suatu bangsa.
- source_word: מוֹלַדְתָּהּ
  choice: asal-usul keluarganya
  rationale: מוֹלֶדֶת dapat menunjuk pada kekerabatan, garis keturunan, atau asal kelahiran. Dalam pasangan dengan עַם, “asal-usul keluarganya” menjaga pembedaan sekaligus tidak mempersempit maknanya secara berlebihan.
- source_word: צִוָּה עָלֶיהָ
  choice: telah memerintahkannya
  rationale: צוה adalah verba perintah yang kuat; bentuk lampau “telah memerintahkan” menunjukkan bahwa perintah Mordekhai mendahului tindakan Ester dalam latar narasi.
- source_word: אֲשֶׁר לֹא תַגִּיד
  choice: untuk tidak memberitahukan hal itu
  rationale: Klausa ini menyatakan isi perintah. “Hal itu” merujuk kembali kepada asal bangsa dan asal-usul keluarga Ester, sementara pengulangan “memberitahukan” mencerminkan pengulangan verba Ibrani.
- source_word: אֶסְתֵּר
  choice: Ester
  rationale: Mengikuti bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Transliterasi ini cukup dekat dengan bentuk Ibrani dan tetap mudah dikenali oleh pembaca Indonesia.
