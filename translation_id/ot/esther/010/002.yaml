  to: Segala tindakan raja yang menunjukkan kekuasaan dan keperkasaannya, serta uraian lengkap tentang kebesaran Mordekhai, yang telah diangkat raja ke kedudukan tinggi, bukankah semuanya itu tertulis dalam Kitab Catatan Sejarah Raja-Raja Media dan Persia?[a]
