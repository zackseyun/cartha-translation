base_translation:
  language: en
  yaml_path: translation/ot/esther/010/002.yaml
  text: And all the acts of his power and might[a], and the full account of the greatness of Mordecai, to which the king raised him—are they not written in the Book of the Chronicles of the Kings of Media and Persia?
translation:
  language: id
  text: Segala tindakan raja yang menunjukkan kekuasaan dan keperkasaannya, serta uraian lengkap tentang kebesaran Mordekhai, yang telah diangkat raja ke kedudukan tinggi, bukankah semuanya itu tertulis dalam Kitab Catatan Sejarah Raja-Raja Media dan Persia?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kitab Tawarikh Raja-Raja Media dan Persia.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂה תָקְפּוֹ וּגְבוּרָתוֹ
  choice: segala perbuatan yang menunjukkan kekuasaan dan keperkasaan raja
  rationale: Ungkapan ini merangkum tindakan yang memperlihatkan daya kekuasaan dan keperkasaan raja. Penambahan eksplisit “raja” memperjelas rujukan pronomina orang ketiga dalam bahasa Indonesia tanpa mengubah makna.
- source_word: וּפָרָשַׁת
  choice: serta uraian lengkap
  rationale: Nomina ini menunjuk pada pemaparan atau catatan yang terperinci; “uraian lengkap” alami dalam bahasa Indonesia dan mempertahankan nuansa resmi.
- source_word: גְּדֻלַּת מָרְדֳּכַי
  choice: kedudukan tinggi Mordekhai
  rationale: Dalam konteks istana, “kebesaran” Mordekhai terutama merujuk pada status atau pangkatnya yang ditinggikan. “Kedudukan tinggi” menyampaikan hal itu dengan jelas tanpa menyiratkan kebesaran moral.
- source_word: אֲשֶׁר גִּדְּלוֹ הַמֶּלֶךְ
  choice: yang diberikan raja kepadanya
  rationale: Bentuk piel dari גדל menyatakan tindakan membuat besar atau meninggikan. Frasa ini menghubungkan kedudukan Mordekhai dengan pengangkatan oleh raja secara alami dalam bahasa Indonesia.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: bukankah semuanya itu tertulis
  rationale: Mempertahankan bentuk pertanyaan retoris khas ringkasan historiografis Ibrani; “semuanya itu” menjelaskan subjek jamak yang merujuk pada seluruh hal sebelumnya.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: Kitab Catatan Sejarah
  rationale: Ungkapan ini menunjuk pada sumber resmi berupa kronik atau tarikh kerajaan. “Kitab Catatan Sejarah” jelas bagi pembaca modern dan tetap bernada formal.
- source_word: לְמַלְכֵי מָדַי וּפָרָס
  choice: Raja-Raja Media dan Persia
  rationale: Dalam judul sumber ini, preposisi לְ menyatakan catatan yang berkaitan dengan atau menjadi milik raja-raja Media dan Persia; struktur judul Indonesia paling alami tanpa menerjemahkan preposisi secara terpisah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. Istilah “kedudukan tinggi” dipilih untuk menerangkan makna istana dari גְּדֻלָּה, sedangkan bentuk pertanyaan retoris sumber dipertahankan. Penanda catatan kaki [a] ditempatkan langsung setelah judul sumber yang diterangkannya.
