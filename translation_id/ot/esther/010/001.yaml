base_translation:
  language: en
  yaml_path: translation/ot/esther/010/001.yaml
  text: King Ahasuerus imposed tribute on the land and the islands of the sea[a][b].
translation:
  language: id
  text: Raja Ahasyweros memberlakukan upeti atas daratan dan pulau-pulau di laut[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daerah-daerah pesisir” untuk “pulau-pulau di laut.” Istilah Ibraninya dapat menunjuk pulau-pulau atau wilayah pesisir.
    reason: lexical_alternative
  - marker: b
    text: Atau “pajak” atau “pungutan.” Dalam konteks tertentu, kata Ibrani ini juga dapat berarti kerja wajib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: memberlakukan
  rationale: Dalam ungkapan שׂוּם מַס עַל, verba ini menyatakan tindakan menetapkan atau membebankan kewajiban. 'Memberlakukan' alami dalam bahasa Indonesia untuk tindakan administratif tersebut.
- source_word: הַמֶּלֶךְ אחשרש
  choice: Raja Ahasyweros
  rationale: Gelar diikuti nama diri diterjemahkan secara wajar tanpa kata sandang. 'Ahasyweros' merupakan bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מַס
  choice: upeti
  rationale: Kata ini dapat berarti upeti, pajak, pungutan, atau kerja wajib. Dalam konteks kekuasaan raja atas wilayah luas dan daerah maritim, 'upeti' mempertahankan nuansa imperial tanpa menutup alternatif leksikal.
- source_word: הָאָרֶץ
  choice: daratan
  rationale: Sebagai pasangan kontras dengan wilayah maritim, 'daratan' menyampaikan wilayah kontinental kekuasaan raja dan menghindari pengertian seluruh bumi.
- source_word: וְאִיֵּי הַיָּם
  choice: dan pulau-pulau di laut
  rationale: Terjemahan ini mempertahankan ungkapan geografis Ibrani. Nomina אִיִּים juga dapat menunjuk daerah pesisir, sehingga alternatif itu dicatat dalam catatan kaki.
