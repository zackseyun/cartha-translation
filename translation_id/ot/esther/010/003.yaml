  text: כִּ֣י מָרְדֳּכַ֣י הַ/יְּהוּדִ֗י מִשְׁנֶה֙ לַ/מֶּ֣לֶךְ אֲחַשְׁוֵר֔וֹשׁ וְ/גָדוֹל֙ לַ/יְּהוּדִ֔ים וְ/רָצ֖וּי לְ/רֹ֣ב אֶחָ֑י/ו דֹּרֵ֥שׁ טוֹב֙ לְ/עַמּ֔/וֹ וְ/דֹבֵ֥ר שָׁל֖וֹם לְ/כָל זַרְעֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/010/003.yaml
  text: For Mordecai the Jew was second to King Ahasuerus[a], great among the Jews, and favored by the multitude of his brothers[c][b], seeking good for his people and speaking peace to all his offspring.
translation:
  language: id
  text: Sebab Mordekhai, orang Yahudi itu, adalah orang kedua setelah Raja Ahasyweros. Ia terpandang di antara orang Yahudi dan disukai oleh sebagian besar saudara sebangsanya.[a] Ia mengusahakan kebaikan bagi bangsanya dan menyampaikan damai sejahtera kepada seluruh keturunannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “oleh banyak saudara sebangsanya.” Kata Ibrani yang digunakan dapat menunjuk kepada mayoritas ataupun sejumlah besar orang. “Saudara” di sini berarti sesama orang Yahudi, bukan hanya saudara kandung laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “keturunannya” secara harfiah berarti “benihnya” dan merupakan istilah kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung yang memberikan alasan atau penjelasan bagi rangkuman sebelumnya.
- source_word: הַיְּהוּדִי
  choice: orang Yahudi itu
  rationale: Menunjukkan identitas etnis-keagamaan Mordekhai dalam lingkungan Persia; bentuk ini alami dalam bahasa Indonesia.
- source_word: מִשְׁנֶה לַמֶּלֶךְ
  choice: menduduki peringkat kedua setelah Raja Ahasyweros
  rationale: Mengungkapkan bahwa Mordekhai berada pada tingkat kedua sesudah raja tanpa memasukkan nama jabatan khusus yang tidak terdapat dalam bahasa Ibrani.
- source_word: וְגָדוֹל לַיְּהוּדִים
  choice: terpandang di antara orang Yahudi
  rationale: Mengomunikasikan kedudukan dan pengaruh sosialnya secara wajar, bukan ukuran fisik.
- source_word: וְרָצוּי
  choice: disukai
  rationale: Bentuk pasif ini menyatakan penerimaan atau perkenanan dari komunitas.
- source_word: לְרֹב אֶחָיו
  choice: oleh sebagian besar saudara sebangsanya
  rationale: רֹב dapat berarti mayoritas atau kumpulan besar. Teks utama memakai pengertian mayoritas, sedangkan catatan kaki mempertahankan kemungkinan lainnya; אֶחָיו dalam konteks ini menunjuk kepada sesama orang Yahudi, bukan hanya saudara kandung laki-laki.
- source_word: דֹּרֵשׁ טוֹב לְעַמּוֹ
  choice: mengusahakan kebaikan bagi bangsanya
  rationale: Menyampaikan usaha aktif Mordekhai untuk mendatangkan hal yang baik bagi bangsanya dengan ungkapan Indonesia yang alami.
- source_word: וְדֹבֵר שָׁלוֹם
  choice: menyuarakan damai sejahtera
  rationale: שָׁלוֹם mencakup kedamaian, kesejahteraan, dan keutuhan; 'damai sejahtera' mempertahankan keluasan maknanya, sementara 'menyuarakan' mengungkapkan tindakan berbicara secara alami.
- source_word: לְכָל זַרְעוֹ
  choice: kepada seluruh keturunannya
  rationale: זֶרַע merupakan istilah kolektif bagi keturunan. Bentuk posesif tunggal pada teks Ibrani tetap dipertahankan tanpa mempersempit siapa yang dimaksud.
