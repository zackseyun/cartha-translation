revisions:
- from: Sebab Mordekhai, orang Yahudi itu, menduduki peringkat kedua setelah Raja Ahasyweros. Ia terpandang di antara orang Yahudi dan disukai oleh sebagian besar saudara sebangsanya.[a] Ia mengusahakan kebaikan bagi bangsanya dan menyuarakan damai sejahtera kepada seluruh keturunannya.[b]
  to: Sebab Mordekhai, orang Yahudi itu, adalah orang kedua setelah Raja Ahasyweros. Ia terpandang di antara orang Yahudi dan disukai oleh sebagian besar saudara sebangsanya.[a] Ia mengusahakan kebaikan bagi bangsanya dan menyampaikan damai sejahtera kepada seluruh keturunannya.[b]
  rationale: Revisi terbatas pada dua ungkapan agar terjemahan lebih idiomatis dan lebih dekat pada daya ujar teks Ibrani. Pilihan “sebagian besar” tetap diberi alternatif “banyak” dalam catatan kaki, sehingga ambiguitas רֹב tidak dihilangkan. Catatan kaki dan penandanya tetap sesuai dengan kata yang dijelaskan.
