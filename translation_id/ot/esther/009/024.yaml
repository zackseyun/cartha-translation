translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami tanpa menghilangkan hubungan sebab-akibat atau pengulangan penting dalam teks.
