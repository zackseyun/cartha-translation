id: EST.9.24
reference: Esther 9:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ הָמָ֨ן בֶּֽן הַמְּדָ֜תָא הָֽ/אֲגָגִ֗י צֹרֵר֙ כָּל הַ/יְּהוּדִ֔ים חָשַׁ֥ב עַל הַ/יְּהוּדִ֖ים לְ/אַבְּדָ֑/ם וְ/הִפִּ֥יל פּוּר֙ ה֣וּא הַ/גּוֹרָ֔ל לְ/הֻמָּ֖/ם וּֽ/לְ/אַבְּדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/024.yaml
  text: For Haman son of Hammedatha the Agagite[a], the enemy of all the Jews, had plotted against the Jews to destroy them, and had cast Pur—that is[b], the lot—to crush them and to destroy them.
translation:
  language: id
  text: Sebab Haman bin Hamedata, orang Agag, musuh semua orang Yahudi, telah merancang melawan orang-orang Yahudi untuk membinasakan mereka, dan telah melemparkan Pur[a], yaitu undi, untuk menimbulkan kekacauan di antara mereka[b] dan membinasakan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pur adalah kata pinjaman yang dijelaskan dalam ayat ini sebagai “undi”. Istilah itu dipertahankan agar kaitannya dengan nama Purim dalam bagian ini tetap terlihat.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “membuat mereka panik”, “membingungkan mereka”, atau “menghancurkan mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi ketetapan yang dibahas dalam konteks sekitarnya.
- source_word: הָמָן בֶּן הַמְּדָתָא הָאֲגָגִי
  choice: Haman bin Hamedata, orang Agag
  rationale: Nama-nama ditransliterasikan dalam bentuk yang lazim di Alkitab bahasa Indonesia; הָאֲגָגִי dipertahankan sebagai sebutan asal atau wangsa.
- source_word: צֹרֵר כָּל הַיְּהוּדִים
  choice: musuh semua orang Yahudi
  rationale: צֹרֵר menunjuk kepada orang yang memusuhi atau menindas; terjemahan ini alami serta mempertahankan cakupan כָּל.
- source_word: חָשַׁב עַל הַיְּהוּדִים לְאַבְּדָם
  choice: telah merancang untuk membinasakan orang-orang Yahudi
  rationale: Dalam konteks ini, חָשַׁב עַל menyatakan rancangan jahat yang ditujukan terhadap orang Yahudi, sedangkan bentuk kausatif אבד berarti membinasakan.
- source_word: וְהִפִּיל פּוּר
  choice: Ia telah melemparkan Pur
  rationale: Istilah pinjaman פּוּר dipertahankan agar hubungannya dengan nama Purim tetap tampak; tindakan melempar undi dinyatakan secara langsung.
- source_word: הוּא הַגּוֹרָל
  choice: yaitu undi
  rationale: Frasa ini merupakan penjelasan dalam teks terhadap istilah asing Pur.
- source_word: לְהֻמָּם
  choice: untuk membuat mereka panik
  rationale: המם dapat berarti menimbulkan kekacauan, kebingungan, atau kepanikan. Pilihan ini jelas dalam bahasa Indonesia dan tetap mempertahankan keluasan makna melalui catatan kaki.
- source_word: וּלְאַבְּדָם
  choice: dan membinasakan mereka
  rationale: Pengulangan gagasan membinasakan dipertahankan sebagaimana dalam teks Ibrani.
