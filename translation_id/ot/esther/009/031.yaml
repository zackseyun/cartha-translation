  source_fidelity: Terjemahan dengan tepat mempertahankan tujuan infinitif לְקַיֵּם, waktu-waktu yang ditetapkan, penetapan oleh Mordekhai dan Ester, serta penerapan kewajiban bagi komunitas dan keturunan mereka. “Ketentuan tentang puasa-puasa dan seruan mereka” merupakan padanan yang memadai bagi דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם.
  naturalness: Sebagian besar kalimat baku dan jelas. Namun, “mengikatkan kepada diri mereka sendiri dan keturunan mereka ketentuan” tidak idiomatis dalam bahasa Indonesia modern. Bentuk “mengikat diri ... pada ketentuan” lebih alami dan tetap menyatakan nuansa kewajiban yang dikenakan pada diri sendiri dan keturunan.
  terminology: “Purim”, “Mordekhai”, “orang Yahudi itu”, “Ratu Ester”, “puasa-puasa”, dan “seruan” sesuai dengan register Alkitab bahasa Indonesia yang modern dan baku. Catatan a dan b relevan; penanda b ditempatkan langsung pada “seruan mereka”, yakni unsur yang dijelaskannya.
