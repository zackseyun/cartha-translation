source:
  edition: WLC
  text: לְ/קַיֵּ֡ם אֵת יְמֵי֩ הַ/פֻּרִ֨ים הָ/אֵ֜לֶּה בִּ/זְמַנֵּי/הֶ֗ם כַּ/אֲשֶׁר֩ קִיַּ֨ם עֲלֵי/הֶ֜ם מָרְדֳּכַ֤י הַ/יְּהוּדִי֙ וְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֔ה וְ/כַ/אֲשֶׁ֛ר קִיְּמ֥וּ עַל נַפְשָׁ֖/ם וְ/עַל זַרְעָ֑/ם דִּבְרֵ֥י הַ/צֹּמ֖וֹת וְ/זַעֲקָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/031.yaml
  text: to establish these days of Purim at their appointed times[a], just as Mordecai the Jew and Esther the queen had established for them[b], and just as they had established for themselves and for their offspring the matters of the fasts and their cry.
translation:
  language: id
  text: untuk menetapkan hari-hari Purim ini pada waktu-waktu yang telah ditentukan[a], sebagaimana Mordekhai, orang Yahudi itu, dan Ratu Ester telah menetapkannya bagi mereka, dan sebagaimana mereka telah mengikat diri mereka sendiri dan keturunan mereka pada ketentuan tentang puasa-puasa dan seruan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menetapkan” juga dapat diterjemahkan “mengukuhkan”; maksudnya ialah menetapkan atau mengesahkan perayaan itu secara resmi.
    reason: lexical_alternative
  - marker: b
    text: “Seruan mereka” juga dapat diterjemahkan “teriakan mereka” atau “ratapan mereka”. Kemungkinan besar ungkapan ini menunjuk pada seruan umat yang menyertai puasa-puasa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: untuk menetapkan
  rationale: Bentuk piel dari קום di sini menyatakan tindakan menetapkan atau mengesahkan perayaan secara resmi. “Menetapkan” jelas dan wajar dalam konteks administratif ini.
- source_word: יְמֵי הַפֻּרִים הָאֵלֶּה
  choice: hari-hari Purim ini
  rationale: Terjemahan langsung yang mempertahankan penunjuk pada hari-hari raya tertentu yang sedang dibicarakan.
- source_word: בִּזְמַנֵּיהֶם
  choice: pada waktu-waktu yang telah ditentukan
  rationale: זְמָן menunjuk pada waktu yang ditetapkan; bentuk jamaknya dipertahankan karena perayaan berlangsung pada hari-hari yang telah dijadwalkan.
- source_word: כַּאֲשֶׁר קִיַּם עֲלֵיהֶם
  choice: sebagaimana ... telah menetapkannya bagi mereka
  rationale: Ungkapan ini menunjukkan bahwa Mordekhai dan Ester sebelumnya telah menetapkan kewajiban itu bagi komunitas, tanpa harus menyiratkan pemaksaan.
- source_word: מָרְדֳּכַי הַיְּהוּדִי
  choice: Mordekhai, orang Yahudi itu
  rationale: Mempertahankan nama dalam bentuk Indonesia yang lazim serta gelar etnis yang berfungsi sebagai aposisi.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ratu Ester
  rationale: Susunan ini merupakan bentuk Indonesia yang alami untuk gelar kerajaan dan tetap menyampaikan aposisi Ibrani.
- source_word: וְכַאֲשֶׁר קִיְּמוּ עַל נַפְשָׁם וְעַל זַרְעָם
  choice: dan sebagaimana mereka telah mengikatkan kepada diri mereka sendiri dan keturunan mereka
  rationale: Dengan עַל נַפְשָׁם, kata kerja ini bernuansa menerima atau mengikatkan suatu kewajiban pada diri sendiri. Pilihan ini menyampaikan nuansa refleksif tersebut dengan lebih alami daripada mengulang “menetapkan”.
- source_word: זַרְעָם
  choice: keturunan mereka
  rationale: Dalam konteks kesinambungan antargenerasi, זֶרַע secara alami berarti keturunan.
- source_word: דִּבְרֵי הַצֹּמוֹת וְזַעֲקָתָם
  choice: ketentuan mengenai puasa-puasa serta seruan mereka
  rationale: דִּבְרֵי dalam prosa administratif dapat berarti perkara atau ketentuan; זַעֲקָה adalah seruan kuat yang berkaitan dengan puasa, tanpa dipersempit secara pasti menjadi doa atau ratapan.
