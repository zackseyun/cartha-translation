  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכּ֤וּ הַ/יְּהוּדִים֙ בְּ/כָל אֹ֣יְבֵי/הֶ֔ם מַכַּת חֶ֥רֶב וְ/הֶ֖רֶג וְ/אַבְדָ֑ן וַ/יַּֽעֲשׂ֥וּ בְ/שֹׂנְאֵי/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/005.yaml
  text: So the Jews struck all their enemies with the stroke of the sword[a], and with slaughter and destruction[b], and they did to those who hated them as they pleased.
translation:
  language: id
  text: Maka orang-orang Yahudi memukul semua musuh mereka dengan pedang, membunuh dan membinasakan mereka, lalu memperlakukan orang-orang yang membenci mereka sesuka hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut kehendak mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: menewaskan
  rationale: Dalam konteks rangkaian מַכַּת חֶרֶב וְהֶרֶג וְאַבְדָן, verba נכה menyatakan serangan yang mematikan. 'Menewaskan' alami dalam bahasa Indonesia dan tidak searkais 'memukul kalah'.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Dalam kitab Ester, istilah ini menunjuk kepada umat Yahudi sebagai kelompok etnis-keagamaan dalam diaspora Persia.
- source_word: בְּכָל אֹיְבֵיהֶם
  choice: semua musuh mereka
  rationale: Mempertahankan cakupan menyeluruh yang dinyatakan oleh כָּל dan menerjemahkan אֹיֵב secara alami.
- source_word: מַכַּת חֶרֶב וְהֶרֶג וְאַבְדָן
  choice: dengan pedang, membunuh dan membinasakan mereka
  rationale: 'Ungkapan Ibrani menumpuk istilah kekerasan: secara harfiah ''pukulan pedang, pembunuhan, dan kebinasaan''. Susunan verbal Indonesia ini mempertahankan daya ungkapnya tanpa menghasilkan frasa nominal yang kaku.'
- source_word: בְשֹׂנְאֵיהֶם
  choice: orang-orang yang membenci mereka
  rationale: Mempertahankan perbedaan leksikal dari אֹיְבֵיהֶם, 'musuh mereka', pada bagian awal ayat.
- source_word: כִּרְצוֹנָם
  choice: sesuka hati
  rationale: Padanan Indonesia yang alami untuk 'menurut kehendak/keinginan mereka' dan menyampaikan kebebasan bertindak dalam konteks ini.
theological_decisions:
- issue: Penggambaran kekerasan yang mematikan
  choice: Mempertahankan secara lugas tindakan dengan pedang, pembunuhan, dan pembinasaan
  alternative: Melunakkannya menjadi 'mengalahkan', atau meningkatkannya menjadi 'memusnahkan sama sekali'
  rationale: Teks Ibrani sengaja menumpuk istilah kekerasan. Terjemahan tidak boleh mengaburkan kekerasannya ataupun menambahkan gagasan pemusnahan total yang tidak dinyatakan secara pasti.
- issue: Arti כִּרְצוֹנָם
  choice: sesuka hati
  alternative: menurut kehendak mereka
  rationale: Keduanya dimungkinkan. 'Sesuka hati' lebih wajar dalam bahasa Indonesia modern, tetapi tetap menyisakan ketegangan moral dari kebebasan bertindak yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kekerasan dalam teks tidak diperhalus, tetapi susunan nominal Ibrani disesuaikan menjadi bentuk verbal agar alami dan mudah dipahami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
