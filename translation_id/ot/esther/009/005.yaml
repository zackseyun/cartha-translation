  rationale: Revisi tunggal mengganti “menewaskan” dengan “memukul” untuk mempertahankan keluasan verba נכה, sementara unsur pembunuhan dan kebinasaan tetap dinyatakan secara lugas sebagaimana dalam rangkaian istilah Ibrani. Struktur, register, nama kelompok, dan penanda catatan kaki dipertahankan.
