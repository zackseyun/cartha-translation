source:
  edition: WLC
  text: וּ/שְׁאָ֣ר הַ/יְּהוּדִ֡ים אֲשֶׁר֩ בִּ/מְדִינ֨וֹת הַ/מֶּ֜לֶךְ נִקְהֲל֣וּ וְ/עָמֹ֣ד עַל נַפְשָׁ֗/ם וְ/נ֨וֹחַ֙ מֵ/אֹ֣יְבֵי/הֶ֔ם וְ/הָרֹג֙ בְּ/שֹׂ֣נְאֵי/הֶ֔ם חֲמִשָּׁ֥ה וְ/שִׁבְעִ֖ים אָ֑לֶף וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָֽׁלְח֖וּ אֶת יָדָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/016.yaml
  text: And the rest of the Jews who were in the king’s provinces gathered themselves together and stood for their lives[a], and had relief from their enemies, and killed seventy-five thousand of those who hated them[b]; but they did not lay a hand on the plunder.
translation:
  language: id
  text: Dan orang-orang Yahudi lainnya yang berada di provinsi-provinsi kerajaan berkumpul dan mempertahankan hidup mereka[a]; mereka mendapat kelegaan dari musuh-musuh mereka dan membunuh tujuh puluh lima ribu orang yang membenci mereka. Namun, mereka tidak mengambil barang rampasan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri demi nyawa mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jarahan perang itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הַיְּהוּדִים
  choice: Dan orang-orang Yahudi lainnya
  rationale: שְׁאָר menunjuk kepada kelompok selebihnya, berbeda dari orang Yahudi di Susan pada ayat sebelumnya. 'Orang-orang Yahudi lainnya' alami dalam bahasa Indonesia dan mempertahankan hubungan naratif itu.
- source_word: בִּמְדִינוֹת הַמֶּלֶךְ
  choice: yang berada di provinsi-provinsi kerajaan
  rationale: מְדִינוֹת adalah wilayah administratif kekaisaran. 'Provinsi-provinsi kerajaan' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: נִקְהֲלוּ
  choice: berkumpul
  rationale: Bentuk ini menyatakan tindakan bersama untuk berhimpun. 'Berkumpul' ringkas, alami, dan selaras dengan pemakaian berulang dalam pasal ini.
- source_word: וְעָמֹד עַל נַפְשָׁם
  choice: dan mempertahankan nyawa mereka
  rationale: Ungkapan harfiahnya adalah 'berdiri demi/atas nyawa mereka' dan dalam konteks menyatakan tindakan membela diri agar tetap hidup. Pilihan ini menyampaikan maksud idiom secara alami tanpa menghilangkan bingkai pertahanan diri.
- source_word: וְנוֹחַ מֵאֹיְבֵיהֶם
  choice: Mereka mendapat kelegaan dari musuh-musuh mereka
  rationale: נוּחַ di sini berarti memperoleh ketenangan atau kelegaan dari tekanan musuh. 'Mendapat kelegaan' menyampaikan hasil konflik secara jelas.
- source_word: וְהָרֹג בְּשֹׂנְאֵיהֶם
  choice: dan membunuh ... orang yang membenci mereka
  rationale: Frasa ini melaporkan pembunuhan terhadap pihak yang membenci mereka. Bentuk 'orang yang membenci mereka' langsung dan tidak menambahkan penilaian yang tidak terdapat dalam teks.
- source_word: חֲמִשָּׁה וְשִׁבְעִים אָלֶף
  choice: tujuh puluh lima ribu
  rationale: Urutan bilangan disesuaikan dengan tata bilangan Indonesia modern.
- source_word: וּבַבִּזָּה לֹא שָׁלְחוּ אֶת יָדָם
  choice: Namun, mereka tidak mengambil barang rampasan itu
  rationale: Ungkapan 'tidak mengulurkan tangan pada' merupakan idiom untuk tidak mengambil atau merampas. 'Tidak mengambil' menyampaikan maknanya secara alami, sedangkan 'Namun' menunjukkan kontras dengan pembunuhan yang baru disebutkan.
theological_decisions:
- issue: Bingkai moral tindakan orang Yahudi
  choice: mempertahankan nyawa mereka
  alternative: membela diri; berdiri demi nyawa mereka
  rationale: Teks Ibrani secara eksplisit mengaitkan tindakan mereka dengan kelangsungan nyawa. Terjemahan ini mempertahankan bingkai pertahanan diri tanpa memperhalus kenyataan bahwa mereka membunuh musuh-musuh mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat Ibrani yang panjang dibagi agar mudah dibaca. Istilah 'barang rampasan' dipilih sebagai ungkapan umum untuk hasil rampasan perang; alternatifnya dicatat dalam catatan kaki.
