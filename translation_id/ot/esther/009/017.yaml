lexical_decisions:
- source_word: בְּיוֹם שְׁלֹשָׁה עָשָׂר
  choice: pada hari ketiga belas
  rationale: Preposisi ב menandai waktu, sedangkan bilangan tiga belas berfungsi sebagai bilangan bertingkat dalam rumus penanggalan.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: bulan Adar
  rationale: Mempertahankan Adar sebagai nama bulan dan menyajikan rumus tanggal secara alami dalam bahasa Indonesia.
- source_word: וְנוֹחַ
  choice: mereka beristirahat
  rationale: Bentuk dari נוח menyatakan berhenti dari pertempuran atau memperoleh kelegaan; bentuk finit dengan subjek tersirat dari konteks paling alami dalam bahasa Indonesia.
- source_word: בְּאַרְבָּעָה עָשָׂר בּוֹ
  choice: Pada hari keempat belas bulan itu
  rationale: Pronomina בּוֹ merujuk kembali kepada bulan Adar. Penyebutan 'bulan itu' memperjelas rujukan tanpa menambahkan informasi baru.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: dan menjadikannya
  rationale: Ungkapan ini menyatakan bahwa hari tersebut dijadikan atau diperingati sebagai hari tertentu; 'menjadikannya' mempertahankan objek pronominal dan hubungan tindakannya.
- source_word: יוֹם מִשְׁתֶּה
  choice: hari perjamuan
  rationale: מִשְׁתֶּה menunjuk pada pesta atau perjamuan, sering kali dengan makan dan minum; 'perjamuan' merupakan padanan yang alami dan bermartabat.
- source_word: וְשִׂמְחָה
  choice: dan sukacita
  rationale: שִׂמְחָה menyatakan kegembiraan perayaan; 'sukacita' mempertahankan bentuk nomina dan cocok dengan konteks perayaan.
