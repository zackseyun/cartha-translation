  yaml_path: translation/ot/esther/009/032.yaml
  text: And Esther’s command confirmed these matters of Purim[b][a], and it was written in the book.
translation:
  language: id
  text: Perintah Ester mengukuhkan hal-hal ini mengenai Purim,[a] dan hal itu dituliskan dalam kitab.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkataan-perkataan tentang Purim ini”; kata Ibrani yang diterjemahkan “hal-hal” juga dapat berarti perkara, urusan, atau ketentuan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dicatat dalam kitab.” Kata Ibrani untuk “kitab” juga dapat berarti gulungan atau catatan tertulis.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲמַר
  choice: perintah
  rationale: Dalam konteks penetapan perayaan Purim, kata ini menunjuk pada pernyataan Ester yang berdaya resmi, bukan sekadar ucapan biasa.
- source_word: קִיַּם
  choice: mengukuhkan
  rationale: Bentuk verba ini menyatakan tindakan membuat sesuatu tetap berlaku atau teguh; “mengukuhkan” sesuai dengan konteks administratif dan tidak melebihkan makna menjadi penciptaan perayaan baru.
- source_word: דִּבְרֵי הַפֻּרִים הָאֵלֶּה
  choice: hal-hal mengenai Purim ini
  rationale: דִּבְרֵי secara harfiah berkaitan dengan “perkataan,” tetapi dalam konteks administratif dapat berarti perkara, urusan, atau ketentuan. Ungkapan ini mempertahankan keluasan maknanya tanpa membatasi pada peraturan tertentu.
- source_word: וְנִכְתָּב
  choice: dan hal itu dituliskan
  rationale: Bentuk pasif Ibrani dipertahankan. “Hal itu” membiarkan rujukannya tetap cukup terbuka, sebagaimana teks sumber, antara perintah Ester dan perkara-perkara Purim yang baru disebutkan.
- source_word: בַּסֵּפֶר
  choice: dalam kitab
  rationale: סֵפֶר dapat berarti kitab, gulungan, atau catatan tertulis. “Kitab” adalah padanan langsung dan tidak menentukan identitas dokumen yang tidak dijelaskan ayat ini.
