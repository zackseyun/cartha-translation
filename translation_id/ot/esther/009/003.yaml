  text: וְ/כָל שָׂרֵ֨י הַ/מְּדִינ֜וֹת וְ/הָ/אֲחַשְׁדַּרְפְּנִ֣ים וְ/הַ/פַּח֗וֹת וְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁ֣ר לַ/מֶּ֔לֶךְ מְנַשְּׂאִ֖ים אֶת הַ/יְּהוּדִ֑ים כִּֽי נָפַ֥ל פַּֽחַד מָרְדֳּכַ֖י עֲלֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/003.yaml
  text: And all the officials of the provinces[a], the satraps, the governors, and those doing the king’s work were supporting the Jews, because the fear of Mordecai had fallen on them.
translation:
  language: id
  text: Semua pejabat provinsi, para satrap, para gubernur, dan orang-orang yang melaksanakan tugas raja mendukung orang Yahudi[a], sebab rasa takut terhadap Mordekhai telah menimpa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membantu orang Yahudi”; kata kerja Ibrani juga dapat mengandung arti “mengangkat” atau “memihak kepada” mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמְּדִינוֹת
  choice: pejabat provinsi
  rationale: שָׂרִים menunjuk para penguasa atau pejabat. “Pejabat provinsi” alami dalam bahasa Indonesia modern dan sesuai dengan daftar jabatan pemerintahan yang mengikutinya.
- source_word: אֲחַשְׁדַּרְפְּנִים
  choice: wali negeri
  rationale: Kata serapan administratif Persia ini menunjuk penguasa wilayah besar. “Wali negeri” mempertahankan pembedaan dari פַּחוֹת sekaligus lebih mudah dipahami pembaca umum daripada “satrap”.
- source_word: פַּחוֹת
  choice: gubernur
  rationale: Gelar administratif daerah yang berbeda dari אֲחַשְׁדַּרְפְּנִים; “gubernur” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: עֹשֵׂי הַמְּלָאכָה אֲשֶׁר לַמֶּלֶךְ
  choice: orang-orang yang melaksanakan tugas raja
  rationale: Secara harfiah berarti orang-orang yang mengerjakan pekerjaan milik raja. Pilihan ini tetap dekat dengan bahasa Ibrani tanpa mempersempit rujukannya menjadi golongan pejabat tertentu.
- source_word: מְנַשְּׂאִים אֶת־הַיְּהוּדִים
  choice: mendukung orang Yahudi
  rationale: Bentuk Hifil dari נָשָׂא dapat berarti mengangkat, menopang, atau mendukung. Dalam konteks konflik ini, “mendukung” menyampaikan bantuan atau keberpihakan praktis tanpa menyatakan secara berlebihan bahwa orang Yahudi ditinggikan kedudukannya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan para pejabat mendukung orang Yahudi; “sebab” jelas, alami, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: נָפַל פַּחַד מָרְדֳּכַי עֲלֵיהֶם
  choice: rasa takut terhadap Mordekhai telah menimpa mereka
  rationale: Ungkapan ini secara harfiah menggambarkan rasa takut yang jatuh ke atas mereka. “Telah menimpa mereka” mempertahankan gambaran Ibrani dalam bentuk Indonesia yang alami, sedangkan “terhadap Mordekhai” menjelaskan objek rasa takut tanpa menghilangkan daya ungkapnya.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab berbahasa Indonesia dan cukup dekat dengan bentuk Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Daftar jabatan dipertahankan untuk mencerminkan susunan administratif teks Ibrani, sementara ungkapan “telah menimpa mereka” menjaga citraan idiomatis sumber. Penanda catatan kaki ditempatkan pada frasa yang benar-benar dijelaskannya.
