source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ ה/יהודיים אֲשֶׁר בְּ/שׁוּשָׁ֗ן גַּ֠ם בְּ/י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר וַ/יַּֽהַרְג֣וּ בְ/שׁוּשָׁ֔ן שְׁלֹ֥שׁ מֵא֖וֹת אִ֑ישׁ וּ/בַ֨/בִּזָּ֔ה לֹ֥א שָׁלְח֖וּ אֶת יָדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/015.yaml
  text: The Jews who were in Susa also assembled on the fourteenth day of the month of Adar[a], and they killed three hundred men in Susa; but they did not lay a hand on the plunder.
translation:
  language: id
  text: Orang-orang Yahudi yang ada di Susan juga berkumpul pada hari keempat belas bulan Adar. Mereka membunuh tiga ratus orang di Susan, tetapi tidak mengambil barang rampasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak mengulurkan tangan mereka kepada barang rampasan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ
  choice: berkumpul
  rationale: Bentuk verba dari קהל menyatakan bahwa mereka berhimpun sebagai satu kelompok; 'berkumpul' alami dan mempertahankan makna kolektifnya.
- source_word: הַיְּהוּדִים
  choice: Orang-orang Yahudi
  rationale: Dalam kitab Ester, istilah ini menunjuk kepada bangsa Yahudi dalam diaspora Persia, bukan sekadar penduduk wilayah Yehuda.
- source_word: אֲשֶׁר בְּשׁוּשָׁן
  choice: yang ada di Susan
  rationale: Klausa ini membatasi rujukan kepada orang-orang Yahudi yang berada di kota Susan; 'Susan' adalah bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: גַּם
  choice: juga
  rationale: Kata ini menandai bahwa tindakan tersebut merupakan tambahan pada peristiwa hari sebelumnya.
- source_word: בְּיוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: pada hari keempat belas bulan Adar
  rationale: Ungkapan ini mempertahankan tanggal dan nama bulan secara lengkap, tetapi tetap wajar dalam bahasa Indonesia.
- source_word: וַיַּהַרְגוּ
  choice: Mereka membunuh
  rationale: הרג adalah verba langsung untuk tindakan membunuh; pilihan ini jelas, modern, dan tidak memperhalus kekerasan teks.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: tiga ratus orang
  rationale: Sesudah bilangan, אִישׁ menghitung individu; dalam bahasa Indonesia, 'orang' merupakan padanan penghitung manusia yang alami tanpa menambahkan informasi gender yang tidak perlu bagi konstruksi ini.
- source_word: וּבַבִּזָּה
  choice: tetapi ... barang rampasan
  rationale: בִּזָּה berarti barang hasil rampasan. Konjungsi diterjemahkan secara adversatif karena klausa ini mengontraskan pembunuhan dengan penolakan mengambil harta.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: tidak mengambil
  rationale: Idiom harfiahnya adalah 'tidak mengulurkan tangan mereka'; dalam konteks barang rampasan, maksudnya mereka tidak mengambilnya. Terjemahan alami ditempatkan dalam teks, sedangkan bentuk idiomatis sumber dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar mudah dipahami. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
