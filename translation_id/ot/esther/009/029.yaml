  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/תִּכְתֹּב אֶסְתֵּ֨ר הַ/מַּלְכָּ֧ה בַת אֲבִיחַ֛יִל וּ/מָרְדֳּכַ֥י הַ/יְּהוּדִ֖י אֶת כָּל תֹּ֑קֶף לְ/קַיֵּ֗ם אֵ֣ת אִגֶּ֧רֶת הַ/פּוּרִ֛ים הַ/זֹּ֖את הַ/שֵּׁנִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/029.yaml
  text: Then Esther the queen[a], daughter of Abihail, and Mordecai the Jew wrote with full authority to confirm this second letter of Purim.
translation:
  language: id
  text: Kemudian Ester, sang ratu, anak perempuan Abihail, dan Mordekhai, orang Yahudi itu, menulis dengan wewenang penuh[a] untuk meneguhkan surat Purim yang kedua ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan segenap kewibawaan” atau “dengan kekuatan penuh.” Ungkapan Ibrani ini menekankan kekuatan atau daya berlaku resmi surat tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְתֹּב
  choice: Kemudian ... menulis
  rationale: Bentuk waw-konsekutif melanjutkan alur narasi. Bahasa Indonesia tidak menandai kala lampau pada verba, dan “kemudian” menyampaikan perkembangan naratifnya.
- source_word: אֶסְתֵּר הַמַּלְכָּה
  choice: Ester, sang ratu
  rationale: Mempertahankan susunan identifikasi Ibrani yang menempatkan nama lebih dahulu, dengan aposisi yang alami dalam bahasa Indonesia.
- source_word: בַת אֲבִיחַיִל
  choice: anak perempuan Abihail
  rationale: Menerjemahkan ungkapan silsilah secara langsung dan jelas.
- source_word: וּמָרְדֳּכַי הַיְּהוּדִי
  choice: dan Mordekhai, orang Yahudi itu
  rationale: יְהוּדִי dalam latar Persia menunjuk identitas etnis; “orang Yahudi” lebih alami dan tidak mempersempit makna menjadi asal geografis Yudea.
- source_word: אֶת כָּל תֹּקֶף
  choice: dengan wewenang penuh
  rationale: תֹּקֶף dapat berarti kekuatan, daya berlaku, atau kewibawaan. Dalam konteks surat resmi, frasa ini paling wajar dipahami sebagai penegasan wewenang resmi, bukan kekuatan fisik.
- source_word: לְקַיֵּם
  choice: untuk meneguhkan
  rationale: Infinitif ini menyatakan tujuan penulisan. “Meneguhkan” mempertahankan nuansa menetapkan atau mengukuhkan sesuatu agar tetap berlaku.
- source_word: אֵת אִגֶּרֶת הַפּוּרִים הַזֹּאת הַשֵּׁנִית
  choice: surat Purim yang kedua ini
  rationale: Menyampaikan hubungan konstruksi “surat Purim” secara ringkas serta mempertahankan demonstratif dan urutan kedua yang dinyatakan teks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Aposisi “sang ratu” dan “orang Yahudi itu” mempertahankan identifikasi formal dalam teks Ibrani, sedangkan “wewenang penuh” mengungkapkan konteks administratif surat secara alami.
