translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-istana yang bermartabat. Dua istilah yang berdekatan, “permohonan” dan “permintaan,” dipertahankan untuk mencerminkan dua nomina Ibrani. Penanda catatan kaki [a] dicantumkan pada pertanyaan yang mengandung nuansa inferensial.
