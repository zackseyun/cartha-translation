  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/אֶסְתֵּ֣ר הַ/מַּלְכָּ֗ה בְּ/שׁוּשַׁ֣ן הַ/בִּירָ֡ה הָרְגוּ֩ הַ/יְּהוּדִ֨ים וְ/אַבֵּ֜ד חֲמֵ֧שׁ מֵא֣וֹת אִ֗ישׁ וְ/אֵת֙ עֲשֶׂ֣רֶת בְּנֵֽי הָמָ֔ן בִּ/שְׁאָ֛ר מְדִינ֥וֹת הַ/מֶּ֖לֶךְ מֶ֣ה עָשׂ֑וּ וּ/מַה שְּׁאֵֽלָתֵ/ךְ֙ וְ/יִנָּ֣תֵֽן לָ֔/ךְ וּ/מַה בַּקָּשָׁתֵ֥/ךְ ע֖וֹד וְ/תֵעָֽשׂ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/012.yaml
  text: Then the king said to Esther the queen[a], “In Susa the citadel the Jews have killed and destroyed five hundred men, along with the ten sons of Haman. What then have they done in the rest of the king’s provinces? Now what is your petition? It will be granted to you. And what is your further request? It will be done.”
translation:
  language: id
  text: Lalu raja berkata kepada Ratu Ester, “Di benteng Susan, orang-orang Yahudi telah membunuh dan membinasakan lima ratus laki-laki, beserta sepuluh putra Haman. Kalau begitu, apa yang telah mereka lakukan di provinsi-provinsi raja yang lain?[a] Sekarang, apa permohonanmu? Itu akan dikabulkan kepadamu. Apa lagi permintaanmu? Itu akan dilaksanakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa yang telah mereka lakukan di provinsi-provinsi raja yang lain?” Pertanyaan Ibrani dapat dibaca lebih sederhana; frasa “Kalau begitu” dalam teks utama menampilkan kesimpulan tersirat raja berdasarkan laporan dari Susan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּשַׁן הַבִּירָה
  choice: Di benteng Susan
  rationale: בִּירָה menunjuk pada kompleks kerajaan yang berkubu atau benteng; “benteng Susan” ringkas, alami, dan sesuai dengan latar kekaisaran Persia.
- source_word: הָרְגוּ ... וְאַבֵּד
  choice: telah membunuh dan membinasakan
  rationale: Kedua verba dipertahankan untuk menyampaikan daya kumulatif ungkapan Ibrani; “membinasakan” mencerminkan אבד dalam konteks penghancuran musuh.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: lima ratus laki-laki
  rationale: אִישׁ dipakai secara distributif setelah bilangan dan secara langsung berarti laki-laki; pilihan ini mempertahankan ketepatan gender dalam konteks tersebut.
- source_word: וְאֵת עֲשֶׂרֶת בְּנֵי הָמָן
  choice: juga kesepuluh anak laki-laki Haman
  rationale: “Juga” menyatakan penambahan objek langsung, sedangkan “anak laki-laki” mempertahankan makna gender בֵּן.
- source_word: בִּשְׁאָר מְדִינוֹת הַמֶּלֶךְ
  choice: di provinsi-provinsi raja lainnya
  rationale: מְדִינוֹת tepat diterjemahkan “provinsi-provinsi” dalam tata pemerintahan Persia, dan שְׁאָר menyatakan wilayah lain atau sisanya.
- source_word: מֶה עָשׂוּ
  choice: Apa pula yang telah mereka lakukan
  rationale: “Pula” menyampaikan nuansa inferensial-retoris berdasarkan laporan dari Susan tanpa mengubah kalimat menjadi kepastian eksplisit.
- source_word: שְּׁאֵלָתֵךְ
  choice: permohonanmu
  rationale: Dalam konteks istana di kitab Ester, שְׁאֵלָה adalah permohonan resmi kepada raja.
- source_word: וְיִנָּתֵן לָךְ
  choice: Itu akan dikabulkan kepadamu
  rationale: Bentuk pasif נתן secara idiomatis berarti bahwa permohonan akan dikabulkan; “kepadamu” mempertahankan unsur לָךְ.
- source_word: בַּקָּשָׁתֵךְ עוֹד
  choice: Apa lagi permintaanmu?
  rationale: “Lagi” mewakili עוֹד sebagai permintaan tambahan, sementara “permintaan” membedakan secara ringan sinonim ini dari שְׁאֵלָה.
- source_word: וְתֵעָשׂ
  choice: Itu akan dilaksanakan
  rationale: Dalam konteks ini, verba tersebut berarti permintaan akan dikerjakan atau dilaksanakan; pilihan ini alami untuk titah kerajaan.
