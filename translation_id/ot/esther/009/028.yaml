  to: Hari-hari ini dikenang dan dirayakan[a] dalam setiap generasi, setiap keluarga, setiap provinsi, dan setiap kota[b]. Hari-hari Purim ini tidak akan lenyap dari tengah-tengah orang Yahudi, dan kenangan akan hari-hari itu tidak akan lenyap dari keturunan mereka[c].
