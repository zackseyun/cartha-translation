  text: וְ/הַ/יָּמִ֣ים הָ֠/אֵלֶּה נִזְכָּרִ֨ים וְ/נַעֲשִׂ֜ים בְּ/כָל דּ֣וֹר וָ/ד֗וֹר מִשְׁפָּחָה֙ וּ/מִשְׁפָּחָ֔ה מְדִינָ֥ה וּ/מְדִינָ֖ה וְ/עִ֣יר וָ/עִ֑יר וִ/ימֵ֞י הַ/פּוּרִ֣ים הָ/אֵ֗לֶּה לֹ֤א יַֽעַבְרוּ֙ מִ/תּ֣וֹךְ הַ/יְּהוּדִ֔ים וְ/זִכְרָ֖/ם לֹא יָס֥וּף מִ/זַּרְעָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/028.yaml
  text: And these days are remembered and observed in every generation[a], every family, every province, and every city; and these days of Purim shall not pass away from among the Jews[c][b], and their remembrance shall not cease from their offspring.
translation:
  language: id
  text: Hari-hari ini dikenang dan dirayakan[a] dalam setiap generasi, setiap keluarga, setiap provinsi, dan setiap kota[b]. Hari-hari Purim ini tidak akan lenyap dari tengah-tengah orang Yahudi, dan kenangan akan hari-hari itu tidak akan lenyap dari keturunan mereka[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dikenang dan dilakukan.” Dalam konteks hari raya, “dilakukan” berarti peringatannya dilaksanakan dalam praktik.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari generasi ke generasi, keluarga demi keluarga, provinsi demi provinsi, dan kota demi kota.” Bahasa Ibrani mengulang nomina tunggal untuk memberi penekanan distributif.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dan peringatan akan hari-hari itu tidak akan berhenti dari keturunan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִזְכָּרִים
  choice: harus dikenang
  rationale: Bentuk Nifal menyatakan bahwa hari-hari itu terus diingat. Dalam konteks ketetapan yang mengikat pada ayat ini, 'harus dikenang' menyampaikan daya normatif sekaligus makna pasifnya secara wajar dalam bahasa Indonesia.
- source_word: וְנַעֲשִׂים
  choice: dan dirayakan
  rationale: Secara harfiah verba ini berarti 'dilakukan', tetapi untuk hari raya menunjuk pada pelaksanaan peringatannya. 'Dirayakan' alami dalam bahasa Indonesia dan sesuai dengan praktik Purim, tanpa merinci bentuk perayaannya.
- source_word: בְּכָל דּוֹר וָדוֹר
  choice: dalam setiap generasi
  rationale: Pengulangan nomina tunggal memberi tekanan distributif, yakni tiap-tiap generasi secara berurutan.
- source_word: מִשְׁפָּחָה וּמִשְׁפָּחָה
  choice: setiap keluarga
  rationale: Menyampaikan daya distributif pengulangan Ibrani dalam susunan Indonesia yang alami.
- source_word: מְדִינָה וּמְדִינָה
  choice: setiap provinsi
  rationale: Dalam Kitab Ester, מְדִינָה menunjuk pada wilayah administratif Kekaisaran Persia; 'provinsi' mempertahankan latar pemerintahan itu.
- source_word: וְעִיר וָעִיר
  choice: dan setiap kota
  rationale: Mewakili pengulangan distributif Ibrani dengan jelas dan ringkas.
- source_word: יְמֵי הַפּוּרִים
  choice: Hari-hari Purim
  rationale: Mempertahankan hubungan konstruksi Ibrani dan nama perayaan yang sudah dikenal dalam bahasa Indonesia.
- source_word: לֹא יַעַבְרוּ מִתּוֹךְ הַיְּהוּדִים
  choice: tidak akan lenyap dari tengah-tengah orang Yahudi
  rationale: עבר dengan מִתּוֹךְ di sini menyatakan hilang atau berlalu dari kehidupan komunitas. 'Lenyap dari tengah-tengah' mempertahankan citra sumber dan terdengar wajar.
- source_word: וְזִכְרָם
  choice: dan kenangan akan hari-hari itu
  rationale: Akhiran pronominal merujuk pada hari-hari Purim. Penyebutan eksplisit 'hari-hari itu' mencegah ambiguitas rujukan dalam bahasa Indonesia.
- source_word: לֹא יָסוּף מִזַּרְעָם
  choice: tidak akan berakhir di antara keturunan mereka
  rationale: יסוף berarti berhenti atau berakhir, sedangkan זרע dalam konteks ini berarti keturunan. Preposisi 'di antara' menyampaikan bahwa peringatan itu tidak akan berhenti dalam komunitas keturunan mereka.
