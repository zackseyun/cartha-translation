  text: So the Jews accepted what they had begun to do[a], and what Mordecai had written to them.
translation:
  language: id
  text: Maka orang-orang Yahudi menerima apa yang telah mereka mulai lakukan[a], dan apa yang telah Mordekhai tulis kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengambil sebagai kewajiban apa yang telah mereka mulai lakukan.” Kata kerja Ibrani dapat berarti menerima atau mengambil sesuatu sebagai kewajiban atas diri sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבֵּל
  choice: menerima
  rationale: Dalam konteks penetapan perayaan Purim, verba קבל menyatakan menerima atau mengambil suatu kewajiban atas diri sendiri. 'Menerima' mempertahankan keluasan makna itu tanpa membuat unsur kesukarelaan terlalu tegas.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Padanan Indonesia yang alami dan tepat bagi sebutan kelompok dengan artikel tertentu.
- source_word: אֵת אֲשֶׁר הֵחֵלּוּ לַעֲשׂוֹת
  choice: apa yang telah mulai mereka lakukan
  rationale: Menyatakan hal yang menjadi objek 'menerima', yakni praktik yang sebelumnya sudah mulai mereka jalankan; bentuk 'telah mulai' memperjelas urutan narasi.
- source_word: וְאֵת אֲשֶׁר
  choice: dan apa yang
  rationale: Mempertahankan kesejajaran dua objek dari verba 'menerima' dalam susunan Indonesia yang wajar.
- source_word: כָּתַב
  choice: telah ditulis
  rationale: Bentuk pasif alami dalam konstruksi relatif Indonesia dan menunjukkan bahwa surat Mordekhai mendahului penerimaan mereka.
- source_word: מָרְדֳּכַי
  choice: Mordekhai
  rationale: Transliterasi nama Ibrani yang lazim dan dekat dengan bentuk sumber.
- source_word: אֲלֵיהֶם
  choice: kepada mereka
  rationale: Preposisi אֶל menunjukkan arah komunikasi; 'kepada mereka' merupakan padanan langsung dan alami.
