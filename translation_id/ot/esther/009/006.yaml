  text: And in Susa the citadel[a], the Jews killed and destroyed five hundred men.
translation:
  language: id
  text: Di benteng Susan[a], orang Yahudi membunuh dan membinasakan lima ratus orang laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istana berbenteng”. Istilah Ibrani ini dapat menunjuk pada kompleks istana berbenteng atau sitadel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/שׁוּשַׁן
  choice: Di ... Susan
  rationale: Preposisi tempat diterjemahkan secara alami sebagai “di”, sedangkan waw dipahami sebagai penghubung naratif yang tidak perlu selalu dinyatakan dalam bahasa Indonesia. “Susan” ialah bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הַ/בִּירָה
  choice: benteng
  rationale: בִּירָה menunjuk pada kawasan berkubu atau kompleks benteng pemerintahan; “benteng” jelas dan alami, sambil mempertahankan alternatif “kubu” dalam catatan kaki.
- source_word: הָרְגוּ
  choice: membunuh
  rationale: Bentuk dari הרג secara langsung berarti menyebabkan kematian; “membunuh” merupakan padanan modern yang lugas.
- source_word: הַ/יְּהוּדִים
  choice: orang Yahudi
  rationale: Dalam konteks Ester, istilah ini menunjuk pada kelompok etnoreligius Yahudi; bentuk kolektif Indonesia “orang Yahudi” alami dan tidak membatasinya secara geografis pada Yudea.
- source_word: וְ/אַבֵּד
  choice: dan membinasakan
  rationale: Bentuk piel dari אבד menyatakan menyebabkan binasa. Kata ini diterjemahkan terpisah dari “membunuh” untuk mempertahankan ungkapan dua verba dalam bahasa Ibrani.
- source_word: חֲמֵשׁ מֵאוֹת אִישׁ
  choice: lima ratus orang laki-laki
  rationale: אִישׁ adalah nomina maskulin dalam ungkapan bilangan ini; “orang laki-laki” mempertahankan rujukan gendernya dan tetap jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan dua verba kekerasan yang terdapat dalam teks Ibrani.
