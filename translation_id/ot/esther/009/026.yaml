source:
  edition: WLC
  text: עַל כֵּ֡ן קָֽרְאוּ֩ לַ/יָּמִ֨ים הָ/אֵ֤לֶּה פוּרִים֙ עַל שֵׁ֣ם הַ/פּ֔וּר עַל כֵּ֕ן עַל כָּל דִּבְרֵ֖י הָ/אִגֶּ֣רֶת הַ/זֹּ֑את וּ/מָֽה רָא֣וּ עַל כָּ֔כָה וּ/מָ֥ה הִגִּ֖יעַ אֲלֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/026.yaml
  text: Therefore they called these days Purim[a], after the name of Pur. Therefore, because of all the words of this letter, and what they had seen concerning this matter, and what had happened to them[b],
translation:
  language: id
  text: Oleh karena itu, mereka menamai hari-hari ini Purim[a], menurut nama Pur. Oleh karena itu, karena segala perkataan dalam surat ini, apa yang telah mereka lihat mengenai hal itu, dan apa yang telah menimpa mereka[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: dinamakan menurut Pur. Secara harfiah, bahasa Ibrani berbunyi “menurut nama Pur”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: apa yang telah datang atas mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לַיָּמִים הָאֵלֶּה
  choice: hari-hari tersebut mereka namakan
  rationale: Bentuk aktif orang ketiga jamak dipertahankan. Kata "namakan" alami dalam konteks pemberian nama, sedangkan "tersebut" menunjuk pada hari-hari raya yang baru saja dibicarakan.
- source_word: פּוּרִים
  choice: Purim
  rationale: Nama perayaan ditransliterasikan sebagai nama diri yang sudah lazim.
- source_word: עַל שֵׁם הַפּוּר
  choice: berdasarkan nama Pur
  rationale: Mempertahankan unsur "nama" dalam ungkapan Ibrani dan kaitan etimologis antara Purim dan Pur.
- source_word: עַל כֵּן
  choice: Oleh sebab itu
  rationale: Mengungkapkan hubungan sebab-akibat dan mempertahankan pengulangan ungkapan ini pada kedua kemunculannya.
- source_word: עַל כָּל דִּבְרֵי הָאִגֶּרֶת הַזֹּאת
  choice: sehubungan dengan segala isi surat ini
  rationale: דִּבְרֵי dapat berarti perkataan atau hal-hal/isi. Dalam konteks surat, "segala isi" terdengar alami tanpa menghilangkan cakupannya; "sehubungan dengan" menjaga konstruksi yang berlanjut ke ayat berikutnya.
- source_word: וּמָה רָאוּ עַל כָּכָה
  choice: dengan apa yang telah mereka lihat mengenai perkara itu
  rationale: Arti dasar רָאוּ, "mereka lihat", dipertahankan, sedangkan עַל כָּכָה diterjemahkan secara idiomatis sebagai "mengenai perkara itu".
- source_word: וּמָה הִגִּיעַ אֲלֵיהֶם
  choice: dan dengan apa yang telah menimpa mereka
  rationale: Ungkapan ini secara idiomatis berarti sesuatu yang sampai kepada atau menimpa seseorang. "Menimpa mereka" alami dan tetap dekat dengan gambaran sumber.
