base_translation:
  language: en
  yaml_path: translation/ot/esther/009/025.yaml
  text: But when she came before the king[a], he commanded by letter that his evil scheme which he had devised against the Jews should return on his own head[b], and they hanged him and his sons on the gallows.
translation:
  language: id
  text: Namun, ketika Ester menghadap raja, raja memerintahkan melalui surat keputusan[a] agar rencana jahat yang telah Haman rancang terhadap orang Yahudi berbalik menimpa kepalanya sendiri. Lalu Haman dan anak-anaknya digantung pada tiang kayu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ia berkata dengan surat/dokumen”; maksudnya, raja mengeluarkan perintah tertulis.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani juga dapat dipahami sebagai “dipancang pada tiang”; bentuk persis hukuman dan struktur kayunya tidak dinyatakan dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְבֹאָהּ
  choice: ketika Ester menghadap
  rationale: Akhiran feminin tunggal paling wajar merujuk kepada Ester dalam konteks. Nama Ester dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: menghadap raja
  rationale: Ungkapan ini berarti datang ke hadapan atau hadir di hadapan raja; 'menghadap raja' merupakan idiom Indonesia yang alami dan tepat.
- source_word: אָמַר עִם הַסֵּפֶר
  choice: raja memerintahkan melalui surat keputusan
  rationale: Teks Ibrani bersifat padat, secara harfiah kira-kira 'ia berkata dengan surat/dokumen'. Dalam konteks, raja mengeluarkan ketetapan tertulis; terjemahan ini menyampaikan maksudnya sambil mempertahankan unsur dokumen.
- source_word: יָשׁוּב
  choice: berbalik menimpa
  rationale: Kata kerja ini menggambarkan pembalikan rencana Haman sehingga akibatnya kembali mengenai dirinya sendiri.
- source_word: מַחֲשַׁבְתּוֹ הָרָעָה אֲשֶׁר חָשַׁב
  choice: rencana jahat yang telah Haman rancang
  rationale: Nomina dan verba berakar sama dan menunjuk pada rancangan yang disengaja, bukan sekadar pikiran. Nama Haman memperjelas pelaku dalam kalimat Indonesia.
- source_word: עַל הַיְּהוּדִים
  choice: terhadap orang Yahudi
  rationale: Preposisi עַל dalam konteks permusuhan menyatakan sasaran rencana jahat.
- source_word: עַל רֹאשׁוֹ
  choice: menimpa kepalanya sendiri
  rationale: Mempertahankan idiom pembalasan Ibrani sekaligus membuat sifat refleksifnya jelas.
- source_word: וְתָלוּ אֹתוֹ וְאֶת־בָּנָיו עַל הָעֵץ
  choice: Haman dan anak-anaknya digantung pada tiang kayu
  rationale: תלה berarti menggantungkan dan dapat mencakup pemajangan atau penusukan pada struktur kayu. עֵץ secara harfiah berarti pohon atau kayu dan dalam konteks menunjuk pada sarana hukuman; 'tiang kayu' menghindari gambaran anakronistis tentang tiang gantungan modern.
