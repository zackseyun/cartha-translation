  text: וַ/יִּשְׁלַ֨ח סְפָרִ֜ים אֶל כָּל הַ/יְּהוּדִ֗ים אֶל שֶׁ֨בַע וְ/עֶשְׂרִ֤ים וּ/מֵאָה֙ מְדִינָ֔ה מַלְכ֖וּת אֲחַשְׁוֵר֑וֹשׁ דִּבְרֵ֥י שָׁל֖וֹם וֶ/אֱמֶֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/030.yaml
  text: And he sent letters to all the Jews in the one hundred twenty-seven provinces of the kingdom of Ahasuerus[a], words of peace and truth[c][b],
translation:
  language: id
  text: Lalu ia mengirim surat-surat kepada semua orang Yahudi di seratus dua puluh tujuh provinsi kerajaan Ahasyweros[c], dengan kata-kata damai dan kebenaran[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan pesan damai dan kebenaran.” Secara harfiah, bahasa Ibraninya berbunyi “kata-kata damai dan kebenaran.”
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks ini, “kebenaran” juga dapat dipahami sebagai “kesetiaan” atau “keterandalan.”
    reason: lexical_alternative
  - marker: c
    text: Ahasyweros adalah bentuk Ibrani nama raja ini; sebagian orang mengidentifikasikannya secara historis dengan Xerxes I.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ia mengirim
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan cerita secara wajar tanpa menambahkan nuansa waktu yang tidak tersurat.
- source_word: סְפָרִים
  choice: surat-surat
  rationale: Dalam konteks administrasi Persia, bentuk jamak ini menunjuk pada komunikasi tertulis yang dikirim ke seluruh kerajaan; “surat-surat” merupakan padanan Indonesia yang alami dan tepat.
- source_word: אֶל כָּל הַיְּהוּדִים
  choice: kepada semua orang Yahudi
  rationale: Ungkapan ini bersifat kolektif dan mencakup seluruh orang Yahudi yang menjadi penerima.
- source_word: אֶל שֶׁבַע וְעֶשְׂרִים וּמֵאָה מְדִינָה
  choice: di seratus dua puluh tujuh provinsi
  rationale: אֶל kedua menyatakan jangkauan geografis para penerima. “Di” memperjelas bahwa orang-orang Yahudi itu berada di seluruh provinsi tersebut, bukan bahwa provinsi-provinsinya sendiri menjadi penerima surat.
- source_word: מְדִינָה
  choice: provinsi
  rationale: Dalam kitab Ester, kata ini menunjuk pada wilayah administratif dalam Kekaisaran Persia; “provinsi” adalah padanan Indonesia yang jelas dan lazim.
- source_word: מַלְכוּת אֲחַשְׁוֵרוֹשׁ
  choice: dalam kerajaan Ahasyweros
  rationale: Frasa ini menyatakan bahwa provinsi-provinsi tersebut termasuk wilayah kerajaan Ahasyweros. “Dalam kerajaan” alami dalam bahasa Indonesia dan tidak menambahkan gelar yang tidak muncul dalam frasa Ibrani.
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: Ahasyweros
  rationale: Nama ini ditransliterasikan dari bentuk Ibrani dengan ejaan yang lazim dan mudah dikenali oleh pembaca Alkitab berbahasa Indonesia, tanpa menggantinya dengan identifikasi historis tertentu.
- source_word: דִּבְרֵי שָׁלוֹם וֶאֱמֶת
  choice: dengan kata-kata damai dan kebenaran
  rationale: Terjemahan ini mempertahankan unsur harfiah “kata-kata” dan nada resminya. “Damai” mewakili שָׁלוֹם, sedangkan “kebenaran” adalah padanan langsung bagi אֱמֶת; kemungkinan nuansa “kesetiaan” atau “keterandalan” dicatat dalam catatan kaki.
