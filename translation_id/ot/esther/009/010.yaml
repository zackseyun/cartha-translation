  text: the ten sons of Haman son of Hammedatha[a], the enemy of the Jews, they killed; but they did not lay a hand on the plunder.
translation:
  language: id
  text: Kesepuluh anak laki-laki Haman bin Hamedata, musuh orang Yahudi, mereka bunuh. Namun, mereka tidak mengambil barang rampasan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: jarahan.'
    reason: Alternatif leksikal bagi בִּזָּה; baik "barang rampasan" maupun "jarahan" menyatakan harta yang diambil dari pihak yang dikalahkan.
lexical_decisions:
- source_word: עֲשֶׂרֶת בְּנֵי
  choice: kesepuluh anak laki-laki
  rationale: Bentuk bilangan dalam konstruksi dengan 'anak-anak Haman' menunjuk kepada kelompok tertentu yang baru saja disebutkan satu per satu. 'Anak laki-laki' menyampaikan בְּנֵי secara tepat dalam konteks ini.
- source_word: הָמָן בֶּן הַמְּדָתָא
  choice: Haman bin Hamedata
  rationale: Nama-nama pribadi ditransliterasikan, sedangkan 'bin' merupakan bentuk Indonesia yang ringkas dan wajar untuk hubungan genealogis.
- source_word: צֹרֵר הַיְּהוּדִים
  choice: musuh orang Yahudi
  rationale: צֹרֵר menunjuk kepada orang yang memusuhi atau mendatangkan kesesakan. 'Musuh' jelas, alami, dan mempertahankan fungsi frasa ini sebagai keterangan tentang Haman.
- source_word: הָרָגוּ
  choice: mereka bunuh
  rationale: Bentuk qatal orang ketiga jamak dari הרג berarti membunuh. Susunan ini mempertahankan penempatan objek di depan untuk penekanan sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וּבַבִּזָּה
  choice: Namun, ... barang rampasan
  rationale: בִּזָּה berarti harta atau barang yang dirampas. Kata sambung diterjemahkan secara adversatif karena klausa ini mengontraskan pembunuhan musuh dengan tindakan tidak mengambil milik mereka.
- source_word: לֹא שָׁלְחוּ אֶת יָדָם
  choice: mereka tidak menjamah
  rationale: Ungkapan harfiah 'tidak mengulurkan tangan mereka' merupakan idiom untuk tidak mengambil atau menguasai sesuatu. 'Tidak menjamah' mempertahankan citra tangan secara alami dan, bersama objeknya, menyiratkan bahwa barang itu tidak diambil.
