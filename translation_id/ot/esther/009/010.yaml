  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan subjek 'mereka' dipertahankan setelah objek yang ditempatkan di depan agar penekanan dan struktur Ibrani tetap terasa tanpa mengaburkan makna.
