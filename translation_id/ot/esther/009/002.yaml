  text: נִקְהֲל֨וּ הַ/יְּהוּדִ֜ים בְּ/עָרֵי/הֶ֗ם בְּ/כָל מְדִינוֹת֙ הַ/מֶּ֣לֶךְ אֳחַשְׁוֵר֔וֹשׁ לִ/שְׁלֹ֣חַ יָ֔ד בִּ/מְבַקְשֵׁ֖י רָֽעָתָ֑/ם וְ/אִישׁ֙ לֹא עָמַ֣ד לִ/פְנֵי/הֶ֔ם כִּֽי נָפַ֥ל פַּחְדָּ֖/ם עַל כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/002.yaml
  text: The Jews assembled in their cities throughout all the provinces of King Ahasuerus to lay hands on those seeking their harm[a], and no one could stand before them[c][b], because the fear of them had fallen on all the peoples.
translation:
  language: id
  text: Orang-orang Yahudi berkumpul di kota-kota mereka di seluruh provinsi Raja Ahasyweros untuk menyerang orang-orang yang berusaha mencelakakan mereka[a]. Tidak seorang pun sanggup bertahan menghadapi mereka[b], sebab rasa takut terhadap mereka telah melanda semua suku bangsa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengulurkan tangan terhadap”; dalam konteks ini berarti menyerang.
    reason: lexical_alternative
  - marker: b
    text: Atau “mampu melawan mereka.”
    reason: lexical_alternative
  - marker: c
    text: “Suku bangsa” menunjuk pada berbagai kelompok bangsa atau penduduk dalam kekaisaran.
    reason: cultural_note
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari קהל menyatakan tindakan berkumpul; pilihan ini alami dan tetap mempertahankan sifat kolektifnya.
- source_word: בְּעָרֵיהֶם
  choice: di kota-kota mereka
  rationale: עִיר berarti kota, dan akhiran pronominal jamak diterjemahkan secara langsung sebagai 'mereka'.
- source_word: בְּכָל מְדִינוֹת הַמֶּלֶךְ אֳחַשְׁוֵרוֹשׁ
  choice: di seluruh provinsi Raja Ahasyweros
  rationale: מְדִינוֹת menunjuk pada wilayah administratif Kekaisaran Persia; 'di seluruh' menyampaikan cakupan distributifnya dengan wajar.
- source_word: לִשְׁלֹחַ יָד
  choice: untuk menyerang
  rationale: Secara harfiah ungkapan ini berarti 'mengulurkan tangan', tetapi dalam konteks ini menyatakan tindakan bermusuhan. 'Menyerang' menyampaikan maksud tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: בִּמְבַקְשֵׁי רָעָתָם
  choice: orang-orang yang berniat mencelakakan mereka
  rationale: Frasa ini secara harfiah menunjuk kepada pihak yang 'mencari keburukan/malapetaka mereka'. 'Berniat mencelakakan' mempertahankan maksud permusuhan yang aktif tanpa terdengar kaku.
- source_word: וְאִישׁ לֹא עָמַד לִפְנֵיהֶם
  choice: Tidak seorang pun sanggup bertahan menghadapi mereka
  rationale: Ungkapan 'berdiri di hadapan' dalam konteks konflik berarti mampu melawan atau bertahan. Terjemahan ini alami dan tidak menambahkan rincian yang tidak terdapat dalam teks.
- source_word: כִּי נָפַל פַּחְדָּם
  choice: sebab rasa takut terhadap mereka telah melanda
  rationale: פַּחַד berarti rasa takut atau kengerian. 'Melanda' mempertahankan gambaran bahwa ketakutan itu datang dan menguasai banyak orang, sambil terdengar alami dalam bahasa Indonesia.
- source_word: עַל כָּל הָעַמִּים
  choice: semua suku bangsa
  rationale: Bentuk jamak עַמִּים menunjuk pada berbagai kelompok bangsa atau penduduk di wilayah kekaisaran, bukan hanya satu bangsa.
- source_word: אֳחַשְׁוֵרוֹשׁ
  choice: Ahasyweros
  rationale: Nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
