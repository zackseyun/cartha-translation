base_translation:
  language: en
  yaml_path: translation/ot/esther/009/021.yaml
  text: to establish among them that they should observe the fourteenth day of the month Adar[a], and the fifteenth day of it, year after year,
translation:
  language: id
  text: untuk menetapkan kewajiban bagi mereka untuk merayakan hari keempat belas bulan Adar dan hari kelima belas bulan itu, tahun demi tahun[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pada setiap tahun dan tahun”; pengulangan kata “tahun” dalam bahasa Ibrani menegaskan bahwa perayaan itu dilakukan setiap tahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקַיֵּם
  choice: untuk menetapkan
  rationale: Bentuk infinitif Piel dari קום di sini menyatakan penetapan atau pengukuhan suatu kewajiban atau kebiasaan; “menetapkan” sesuai dengan konteks surat yang mengatur perayaan.
- source_word: עֲלֵיהֶם
  choice: bagi mereka
  rationale: Secara harfiah berarti “atas mereka”, dengan nuansa kewajiban yang dikenakan kepada komunitas. Dalam bahasa Indonesia, “bagi mereka” menyampaikan sasaran penetapan secara wajar tanpa meniadakan konteks kewajibannya.
- source_word: לִהְיוֹת עֹשִׂים
  choice: bahwa mereka harus merayakan
  rationale: Secara bentuk berarti “untuk menjadi orang-orang yang melakukan”. Karena objeknya adalah hari-hari peringatan, “merayakan” merupakan padanan Indonesia yang alami; “harus” menyampaikan daya normatif dari penetapan tersebut.
- source_word: אֵת יוֹם אַרְבָּעָה עָשָׂר לְחֹדֶשׁ אֲדָר
  choice: hari keempat belas bulan Adar
  rationale: Ungkapan tanggal Ibrani diterjemahkan dengan susunan penanggalan Indonesia yang alami dan tetap formal.
- source_word: וְאֵת יוֹם חֲמִשָּׁה עָשָׂר בּוֹ
  choice: dan hari kelima belas bulan itu
  rationale: Pronomina בּוֹ mengacu kembali kepada bulan Adar. Pengulangan “bulan” membuat acuannya jelas dalam bahasa Indonesia.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: tahun demi tahun
  rationale: Pengulangan kata “tahun” dalam bahasa Ibrani bersifat distributif dan menekankan keberulangan tahunan. “Tahun demi tahun” mempertahankan penekanan itu secara idiomatis.
