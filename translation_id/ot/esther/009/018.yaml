base_translation:
  language: en
  yaml_path: translation/ot/esther/009/018.yaml
  text: But the Jews who were in Susa assembled on the thirteenth day of it and on the fourteenth day of it[a], and rested on the fifteenth day of it[b], and made it a day of feasting and gladness.
translation:
  language: id
  text: Namun, orang-orang Yahudi yang berada di Susan berkumpul pada hari ketiga belas dan hari keempat belas bulan itu, lalu beristirahat pada hari kelima belas[a] dan menjadikannya hari perjamuan dan sukacita.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani mengulang, “pada hari ketiga belas di dalamnya ... pada hari keempat belas di dalamnya ... pada hari kelima belas di dalamnya”; kata “di dalamnya” mengacu pada bulan itu berdasarkan konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau, “hari pesta dan kegembiraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: Namun, orang-orang Yahudi yang berada di Susan
  rationale: Waw menandai kontras dengan orang-orang Yahudi di daerah-daerah dalam ayat sebelumnya; 'Namun' mengungkapkan peralihan itu secara alami. 'Susan' adalah bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: נִקְהֲלוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari קהל menyatakan tindakan berkumpul tanpa menambahkan motif atau tujuan yang tidak dinyatakan di sini.
- source_word: בִּשְׁלֹשָׁה עָשָׂר בּוֹ וּבְאַרְבָּעָה עָשָׂר בּוֹ
  choice: pada hari ketiga belas dan hari keempat belas bulan itu
  rationale: Akhiran pronominal pada בּוֹ mengacu pada bulan yang dipahami dari konteks. Menyebut 'bulan itu' sekali menghasilkan bahasa Indonesia yang alami sambil mempertahankan kedua tanggal.
- source_word: וְנוֹחַ בַּחֲמִשָּׁה עָשָׂר בּוֹ
  choice: lalu beristirahat pada hari kelima belas
  rationale: נוח menunjukkan berhentinya kegiatan atau konflik. 'Lalu' menyatakan urutan naratif dengan wajar, sedangkan acuan kepada bulan tetap jelas dari frasa sebelumnya.
- source_word: וְעָשֹׂה אֹתוֹ
  choice: dan menjadikannya
  rationale: Konstruksi עשה dengan pronomina objek berarti memperlakukan atau menetapkan hari tersebut sebagai hari dengan sifat tertentu; 'menjadikannya' mempertahankan idiom itu secara ringkas.
- source_word: יוֹם מִשְׁתֶּה וְשִׂמְחָה
  choice: hari perjamuan dan sukacita
  rationale: מִשְׁתֶּה menunjuk pada jamuan atau pesta, sering kali melibatkan minuman, dan שִׂמְחָה berarti sukacita. Pilihan ini alami, bermartabat, dan tidak mempersempit makna secara berlebihan.
theological_decisions: []
