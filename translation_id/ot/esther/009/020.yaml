base_translation:
  language: en
  yaml_path: translation/ot/esther/009/020.yaml
  text: Then Mordecai wrote these things and sent letters to all the Jews who were in all the provinces of King Ahasuerus[a], both near and far.
translation:
  language: id
  text: Kemudian Mordekhai menuliskan hal-hal ini[a] dan mengirimkan surat-surat kepada semua orang Yahudi di seluruh provinsi Raja Ahasyweros, baik yang dekat maupun yang jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kata-kata ini.” Kata Ibrani yang dipakai dapat menunjuk kepada perkara atau peristiwa yang baru diceritakan, ataupun kepada kata-kata yang ditulis Mordekhai tentangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: menuliskan
  rationale: Bentuk naratif dari כתב menyatakan tindakan menulis. 'Menuliskan' terdengar alami ketika objeknya adalah hal-hal yang dicatat dan tetap mempertahankan urutan narasi.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: hal-hal ini
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal. 'Hal-hal ini' mempertahankan cakupan luasnya dan memungkinkan rujukan kepada peristiwa yang baru diceritakan maupun isi yang ditulis Mordekhai.
- source_word: וַיִּשְׁלַח סְפָרִים
  choice: mengirimkan surat
  rationale: Dalam konteks administrasi kerajaan, סְפָרִים menunjuk pada komunikasi tertulis. 'Surat' merupakan padanan Indonesia yang alami; bentuk tunggal kolektif lazim setelah verba ini dan tidak mengubah fakta bahwa surat dikirim kepada para penerima di banyak provinsi.
- source_word: כָּל הַיְּהוּדִים
  choice: semua orang Yahudi
  rationale: Ungkapan ini secara langsung menunjuk kepada seluruh komunitas Yahudi yang dimaksud.
- source_word: בְּכָל מְדִינוֹת
  choice: di seluruh provinsi
  rationale: מְדִינוֹת adalah wilayah-wilayah administratif kerajaan. 'Di seluruh provinsi' alami dalam bahasa Indonesia dan menyampaikan cakupan menyeluruh.
- source_word: הַמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Susunan ini secara alami diterjemahkan dengan gelar sebelum nama. 'Ahasyweros' adalah transliterasi Indonesia yang lazim untuk nama Ibrani tersebut.
- source_word: הַקְּרוֹבִים וְהָרְחוֹקִים
  choice: baik yang dekat maupun yang jauh
  rationale: Kedua adjektiva berfungsi substantival dan membentuk merisme yang mencakup para penerima di seluruh wilayah. Rumusan ini jelas dan alami.
- source_word: וַ
  choice: Kemudian
  rationale: Waw konsekutif melanjutkan rangkaian narasi; 'Kemudian' menyampaikan perkembangan berurutan dengan alami dalam bahasa Indonesia modern.
