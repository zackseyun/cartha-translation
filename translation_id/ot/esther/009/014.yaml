  yaml_path: translation/ot/esther/009/014.yaml
  text: So the king said that it should be done so. A decree was issued in Susa[a], and the ten sons of Haman were hanged.
translation:
  language: id
  text: Lalu raja berkata agar hal itu dilakukan. Sebuah titah dikeluarkan di Susan, dan kesepuluh anak laki-laki Haman digantung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipancangkan pada tiang”. Kata Ibrani ini dapat merujuk pada orang yang digantung atau dipajang pada kayu maupun tiang, dan tidak selalu berarti hukuman gantung dengan jerat di leher seperti dalam pengertian modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Kata kerja אָמַר pada dasarnya berarti “berkata”. Dalam konteks ini perkataan raja memberi persetujuan resmi, tetapi terjemahan tidak perlu memperkuatnya menjadi “memerintahkan”.
- source_word: לְהֵעָשׂוֹת כֵּן
  choice: agar hal itu dilakukan
  rationale: Konstruksi infinitif ini menyatakan bahwa permintaan Ester harus dilaksanakan. Bentuk ini mempertahankan nuansa pasif dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַתִּנָּתֵן דָּת
  choice: Sebuah titah dikeluarkan
  rationale: Gabungan נָתַן dan דָּת merupakan ungkapan administratif. “Titah dikeluarkan” menyampaikan keputusan resmi kerajaan secara alami dan lebih tepat dalam konteks ini daripada “hukum diberikan”.
- source_word: בְּשׁוּשָׁן
  choice: di Susan
  rationale: “Susan” adalah bentuk nama kota שׁוּשָׁן yang lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: kesepuluh anak laki-laki Haman
  rationale: Frasa konstruksi ini secara langsung berarti sepuluh anak laki-laki Haman; “kesepuluh” mengacu pada kelompok yang telah disebutkan sebelumnya.
- source_word: תָּלוּ
  choice: digantung
  rationale: Kata תלה berarti menggantung atau menggantungkan pada kayu maupun tiang. “Digantung” mempertahankan istilah utama secara ringkas, sedangkan kemungkinan bahwa mayat mereka dipajang pada tiang dijelaskan dalam catatan kaki.
