base_translation:
  language: en
  yaml_path: translation/ot/esther/009/004.yaml
  text: For Mordecai was great in the king’s house[a], and the report about him was spreading through all the provinces[b], for the man Mordecai was becoming greater and greater.
translation:
  language: id
  text: Sebab Mordekhai memiliki kedudukan tinggi di istana raja, dan kabar tentang dirinya terus menyebar di seluruh provinsi.[a] Sebab Mordekhai sendiri, kedudukannya makin tinggi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “namanya semakin terkenal di seluruh provinsi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “orang itu, Mordekhai, terus berjalan dan menjadi besar,” sebuah ungkapan Ibrani yang menunjukkan bahwa kebesaran atau kedudukannya terus bertambah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Konjungsi ini menjelaskan alasan bagi keadaan yang disebutkan dalam konteks sebelumnya. “Sebab” mempertahankan fungsi penjelasnya secara wajar dalam bahasa Indonesia.
- source_word: גָדוֹל ... בְּבֵית הַמֶּלֶךְ
  choice: memiliki kedudukan tinggi di istana raja
  rationale: Dalam konteks ini גָדוֹל menunjuk pada kebesaran, kedudukan, atau keutamaan Mordekhai dalam lingkungan kerajaan. Ungkapan ini menyampaikan makna tersebut secara alami tanpa membatasinya hanya pada kekuasaan politik.
- source_word: שָׁמְעוֹ
  choice: kabar tentang dirinya
  rationale: Kata benda ini dapat berarti kabar, laporan, nama baik, atau kemasyhuran. “Kabar tentang dirinya” mempertahankan keluasan makna dan cocok dengan gambaran kabar yang menyebar.
- source_word: הוֹלֵךְ בְּכָל הַמְּדִינוֹת
  choice: terus tersebar ke seluruh provinsi
  rationale: Partisipel הוֹלֵךְ menggambarkan proses yang sedang berlanjut. Ketika subjeknya ialah kabar, “terus tersebar” merupakan ungkapan Indonesia yang alami; מְדִינוֹת merujuk pada provinsi-provinsi dalam pemerintahan Persia.
- source_word: הָאִישׁ מָרְדֳּכַי
  choice: Mordekhai sendiri
  rationale: Bahasa Ibrani memakai “orang itu, Mordekhai” untuk memberi penekanan. “Mordekhai sendiri” mempertahankan penekanan itu tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: הוֹלֵךְ וְגָדוֹל
  choice: semakin lama semakin berpengaruh
  rationale: Gabungan הוֹלֵךְ dengan וְגָדוֹל merupakan idiom yang menyatakan pertambahan terus-menerus dalam kebesaran atau kedudukan. “Semakin lama semakin berpengaruh” menyampaikan perkembangan tersebut secara alami sesuai konteks.
