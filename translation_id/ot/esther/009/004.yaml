  source_fidelity: 'Draf pada umumnya setia pada makna ayat: status Mordekhai di lingkungan kerajaan, tersiar luasnya kabar tentang dia, dan peningkatan kebesarannya tersampaikan dengan baik. Namun, כִּי kedua yang memulai klausa terakhir tidak tercermin. Dalam bahasa Indonesia, pengulangan “Sebab” tetap wajar dan mempertahankan hubungan penjelas yang eksplisit dalam teks Ibrani.'
  naturalness: Bahasanya modern dan lancar. “Kabar tentang dirinya terus menyebar di seluruh provinsi” lebih idiomatis daripada “terus tersebar ke seluruh provinsi” dan menampilkan tindakan berkelanjutan dari partisipel Ibrani. “Semakin lama semakin berpengaruh” cukup alami, tetapi mempersempit ‘menjadi besar’ terutama menjadi pengaruh; “kedudukannya makin tinggi” lebih langsung dalam konteks istana.
  terminology: “Mordekhai,” “istana raja,” dan “provinsi” sesuai untuk register modern serta latar administratif Persia. “Kedudukan tinggi”/“kedudukannya makin tinggi” menyampaikan גָּדוֹל tanpa memasukkan tafsiran teologis atau sektarian.
