  text: וַ/תֹּ֤אמֶר אֶסְתֵּר֙ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב יִנָּתֵ֣ן גַּם מָחָ֗ר לַ/יְּהוּדִים֙ אֲשֶׁ֣ר בְּ/שׁוּשָׁ֔ן לַ/עֲשׂ֖וֹת כְּ/דָ֣ת הַ/יּ֑וֹם וְ/אֵ֛ת עֲשֶׂ֥רֶת בְּנֵֽי הָמָ֖ן יִתְל֥וּ עַל הָ/עֵֽץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/013.yaml
  text: Esther said[a], “If it pleases the king, let it be granted to the Jews who are in Susa to do tomorrow also according to today’s decree, and let Haman’s ten sons be hanged on the gallows.”
translation:
  language: id
  text: Kata Ester, “Jika raja berkenan, kiranya orang Yahudi yang ada di Susan diizinkan agar besok juga bertindak sesuai dengan ketetapan hari ini, dan hendaklah kesepuluh putra Haman digantungkan pada tiang kayu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “digantungkan pada pohon” atau “dipancangkan pada tiang.” Kata Ibrani secara harfiah berarti “kayu/pohon” dan dalam konteks ini dapat menunjuk pada pohon, tiang, atau struktur kayu untuk eksekusi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Jika raja berkenan
  rationale: Ungkapan istana ini menyatakan perkenanan atau persetujuan raja, bukan penilaian moral bahwa sesuatu itu baik.
- source_word: יִנָּתֵן
  choice: kiranya ... diizinkan
  rationale: Bentuk pasif dengan nuansa permohonan menyampaikan permintaan Ester agar raja memberikan izin resmi.
- source_word: גַּם מָחָר
  choice: besok juga
  rationale: Frasa ini memperluas izin yang berlaku hari itu agar berlaku pula pada hari berikutnya.
- source_word: לַיְּהוּדִים אֲשֶׁר בְּשׁוּשָׁן
  choice: orang Yahudi yang ada di Susan
  rationale: Terjemahan ini mempertahankan kelompok penerima izin dan klausa relatif Ibrani dengan bahasa Indonesia yang wajar.
- source_word: לַעֲשׂוֹת כְּדָת הַיּוֹם
  choice: bertindak sesuai dengan ketetapan hari ini
  rationale: Kata kerja umum עשה tidak diperinci melebihi teks, sedangkan דת dalam konteks istana Persia menunjuk pada ketetapan resmi.
- source_word: דָּת
  choice: ketetapan
  rationale: Dalam kitab Ester, istilah ini lazim menunjuk pada peraturan atau maklumat resmi kerajaan; 'ketetapan' sesuai dengan register istana dan alami dalam bahasa Indonesia.
- source_word: עֲשֶׂרֶת בְּנֵי הָמָן
  choice: kesepuluh anak Haman
  rationale: Bentuk ini secara alami menyampaikan frasa konstruksi Ibrani dan menunjukkan bahwa yang dimaksud ialah sepuluh anak Haman yang telah disebutkan.
- source_word: יִתְלוּ עַל־הָעֵץ
  choice: digantung pada tiang kayu
  rationale: תלה berarti menggantung, sedangkan עץ secara harfiah berarti pohon atau kayu dan dalam konteks ini menunjuk pada sarana hukuman. 'Tiang kayu' menjaga bentuk konkret tanpa memastikan secara berlebihan apakah sarana itu tiang gantungan atau tiang untuk pemancungan/penyulaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan register permohonan resmi di hadapan raja. Susunan kalimat dibuat alami tanpa menghilangkan nuansa permohonan pada bentuk-bentuk Ibrani. Penanda catatan kaki [a] ditempatkan langsung pada frasa yang diterangkan.
