- from: Kata Ester, “Jika raja berkenan, kiranya orang Yahudi yang ada di Susan diizinkan untuk besok juga bertindak sesuai dengan ketetapan hari ini, dan kiranya kesepuluh anak Haman digantung pada tiang kayu[a].”
