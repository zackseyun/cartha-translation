  text: וּ/בִ/שְׁנֵים֩ עָשָׂ֨ר חֹ֜דֶשׁ הוּא חֹ֣דֶשׁ אֲדָ֗ר בִּ/שְׁלוֹשָׁ֨ה עָשָׂ֥ר יוֹם֙ בּ֔/וֹ אֲשֶׁ֨ר הִגִּ֧יעַ דְּבַר הַ/מֶּ֛לֶךְ וְ/דָת֖/וֹ לְ/הֵעָשׂ֑וֹת בַּ/יּ֗וֹם אֲשֶׁ֨ר שִׂבְּר֜וּ אֹיְבֵ֤י הַ/יְּהוּדִים֙ לִ/שְׁל֣וֹט בָּ/הֶ֔ם וְ/נַהֲפ֣וֹךְ ה֔וּא אֲשֶׁ֨ר יִשְׁלְט֧וּ הַ/יְּהוּדִ֛ים הֵ֖מָּה בְּ/שֹׂנְאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/001.yaml
  text: 'In the twelfth month[a], that is, the month Adar, on the thirteenth day of it, when the king’s word and his decree were to be carried out, on the day when the enemies of the Jews had hoped to rule over them, the opposite happened: the Jews themselves ruled over those who hated them.'
translation:
  language: id
  text: Pada bulan kedua belas, yaitu bulan Adar, pada hari ketiga belas bulan itu, tibalah saatnya titah raja dan ketetapannya dilaksanakan. Pada hari ketika musuh-musuh orang Yahudi berharap dapat menguasai mereka, keadaan justru berbalik:[a] orang Yahudilah yang menguasai orang-orang yang membenci mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terjadi kebalikan” atau “hal itu berbalik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: Pada bulan kedua belas
  rationale: Menerjemahkan penanda waktu secara langsung; waw naratif tidak perlu diungkapkan dengan kata pembuka tersendiri dalam bahasa Indonesia.
- source_word: הוּא חֹדֶשׁ אֲדָר
  choice: yaitu bulan Adar
  rationale: Mengungkapkan keterangan aposisional yang menjelaskan nama bulan kedua belas.
- source_word: בִּשְׁלוֹשָׁה עָשָׂר יוֹם בּוֹ
  choice: pada hari ketiga belas bulan itu
  rationale: Mempertahankan rujukan pronominal kepada bulan dengan bentuk Indonesia yang alami.
- source_word: אֲשֶׁר הִגִּיעַ דְּבַר הַמֶּלֶךְ וְדָתוֹ לְהֵעָשׂוֹת
  choice: tibalah saatnya titah raja dan ketetapannya dilaksanakan
  rationale: הִגִּיעַ secara harfiah menyatakan 'tiba/mencapai'; dalam konteks ini, waktunya tiba untuk pelaksanaan. 'Titah' dan 'ketetapan' mempertahankan pembedaan antara דְּבַר dan דָת.
- source_word: שִׂבְּרוּ
  choice: berharap
  rationale: Kata kerja ini menyatakan harapan atau pengharapan, sesuai dengan ironi naratif yang menyusul.
- source_word: לִשְׁלֹט בָּהֶם
  choice: dapat menguasai mereka
  rationale: שׁלט berarti memegang kuasa atau menguasai; 'dapat' menyatakan sasaran yang diharapkan para musuh dalam konstruksi Indonesia yang wajar.
- source_word: וְנַהֲפוֹךְ הוּא
  choice: keadaan justru berbalik
  rationale: Menangkap ungkapan pembalikan secara alami sekaligus mempertahankan penekanan kontrasnya.
- source_word: אֲשֶׁר יִשְׁלְטוּ הַיְּהוּדִים הֵמָּה
  choice: orang Yahudilah yang menguasai
  rationale: Partikel -lah mempertahankan penekanan pada הֵמָּה dan kontras bahwa justru orang Yahudi menjadi pihak yang menguasai.
- source_word: בְּשֹׂנְאֵיהֶם
  choice: orang-orang yang membenci mereka
  rationale: Mempertahankan daya verbal partisipel שֹׂנְאֵי, bukan meratakannya menjadi sekadar 'musuh'.
