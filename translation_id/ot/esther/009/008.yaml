  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ayat ini melanjutkan daftar anak-anak lelaki Haman dari ayat sebelumnya; kata kerja “membunuh” dipahami dari Ester 9:7.
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אֵת
  choice: dan / tidak dinyatakan
  rationale: Partikel וְ melanjutkan daftar dan diterjemahkan dengan "dan" bila alami dalam bahasa Indonesia, sedangkan אֵת sebagai penanda objek langsung tidak memiliki padanan tersendiri. Pengulangan penuh "dan" pada setiap nama dihindari agar daftar terdengar alami, tanpa mengubah hubungan sintaksisnya.
- source_word: פּוֹרָתָא
  choice: Porata
  rationale: Nama orang ditransliterasikan menurut bentuk Ibrani ke ejaan Indonesia; huruf akhir ה di sini menghasilkan bentuk Porata.
- source_word: אֲדַלְיָא
  choice: Adalya
  rationale: Nama orang ditransliterasikan ke ejaan Indonesia; rangkaian bunyi -yā diwakili dengan "-ya".
- source_word: אֲרִידָתָא
  choice: Aridata
  rationale: Nama orang ditransliterasikan menurut bentuk Ibrani ke ejaan Indonesia.
