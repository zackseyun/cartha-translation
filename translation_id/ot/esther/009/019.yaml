id: EST.9.19
reference: Esther 9:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֞ן הַ/יְּהוּדִ֣ים ה/פרוזים הַ/יֹּשְׁבִים֮ בְּ/עָרֵ֣י הַ/פְּרָזוֹת֒ עֹשִׂ֗ים אֵ֠ת י֣וֹם אַרְבָּעָ֤ה עָשָׂר֙ לְ/חֹ֣דֶשׁ אֲדָ֔ר שִׂמְחָ֥ה וּ/מִשְׁתֶּ֖ה וְ/י֣וֹם ט֑וֹב וּ/מִשְׁל֥וֹחַ מָנ֖וֹת אִ֥ישׁ לְ/רֵעֵֽ/הוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/019.yaml
  text: Therefore the Jews of the villages[a], who live in the rural towns, make the fourteenth day of the month of Adar a day of gladness and feasting and a holiday, and of sending portions[b], each man to his neighbor.
translation:
  language: id
  text: Karena itu, orang-orang Yahudi yang tinggal di daerah terbuka, yakni di kota-kota tanpa tembok[a], merayakan hari keempat belas bulan Adar sebagai hari sukacita dan perjamuan, sebagai hari raya, serta sebagai hari untuk mengirim bingkisan[b], seorang kepada sesamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang Yahudi di perkampungan, yang tinggal di permukiman terbuka.” Istilah Ibrani menunjuk pada kota atau permukiman yang tidak bertembok.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagian-bagian”; kemungkinan besar bagian makanan atau pemberian untuk perjamuan.
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menyatakan kesimpulan atau akibat dari kisah sebelumnya dan terdengar alami dalam bahasa Indonesia modern.
- source_word: הַיְּהוּדִים
  choice: orang-orang Yahudi
  rationale: Dalam konteks Ester, istilah ini menunjuk kepada bangsa Yahudi di wilayah kekuasaan Persia, bukan hanya penduduk Yehuda.
- source_word: הפרוזים ... הַיֹּשְׁבִים בְּעָרֵי הַפְּרָזוֹת
  choice: yang tinggal di daerah terbuka, yakni di kota-kota tanpa tembok
  rationale: Terjemahan ini mempertahankan penekanan geografis pada permukiman yang tidak berbenteng, yang dikontraskan dengan Susan sebagai kota bertembok, sekaligus menghindari ungkapan Indonesia yang kaku.
- source_word: עֹשִׂים אֵת יוֹם אַרְבָּעָה עָשָׂר
  choice: merayakan hari keempat belas
  rationale: Dalam kaitannya dengan suatu hari, עשה berarti memperingati atau merayakannya; 'merayakan' paling alami dalam konteks pesta ini.
- source_word: לְחֹדֶשׁ אֲדָר
  choice: bulan Adar
  rationale: Bentuk ini menyampaikan rumus penanggalan Ibrani secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: שִׂמְחָה וּמִשְׁתֶּה
  choice: sukacita dan perjamuan
  rationale: '''Sukacita'' mempertahankan bentuk nomina, sedangkan ''perjamuan'' menyampaikan pesta makan dan minum tanpa mempersempitnya hanya pada minuman beralkohol.'
- source_word: וְיוֹם טוֹב
  choice: hari raya
  rationale: Secara idiomatis frasa ini berarti hari yang dirayakan atau hari pesta, bukan sekadar hari yang baik.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: untuk mengirim bingkisan
  rationale: '''Bingkisan'' alami dalam bahasa Indonesia untuk sesuatu yang dikirim sebagai bagian perayaan; catatan kaki mempertahankan arti harfiahnya, yaitu ''bagian-bagian'', yang kemungkinan besar berupa makanan.'
- source_word: אִישׁ לְרֵעֵהוּ
  choice: seorang kepada sesamanya
  rationale: Ungkapan distributif ini mempertahankan bentuk tunggal dan hubungan antaranggota masyarakat tanpa membuat kalimat Indonesia terasa janggal.
theological_decisions:
- issue: Ungkapan distributif maskulin אִישׁ לְרֵעֵהוּ
  choice: seorang kepada sesamanya
  alternative: setiap orang kepada sesamanya; satu sama lain
  rationale: Bahasa Indonesia tidak menandai gender pada 'seorang' atau 'sesamanya'. Pilihan ini mempertahankan konstruksi distributif tunggal Ibrani tanpa menambahkan pembatasan bahwa hanya laki-laki yang terlibat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan paralel 'sebagai hari ...' mempertahankan deretan unsur perayaan dalam teks Ibrani, sementara istilah geografis dijelaskan secara alami dan arti harfiah מָנוֹת dijaga dalam catatan kaki.
