  footnotes:
  - marker: a
    text: Ketiga nama ini adalah nama-nama pertama dalam daftar anak-anak lelaki Haman. Daftar ini melanjutkan pernyataan pada ayat sebelumnya bahwa orang-orang Yahudi membunuh mereka.
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵת
  choice: tidak diterjemahkan secara tersendiri; dinyatakan melalui koma dan kata “dan”
  rationale: Partikel אֵת menandai objek langsung, sedangkan וְ menghubungkan setiap nama dalam daftar yang melanjutkan verba dari ayat sebelumnya. Dalam bahasa Indonesia, susunan daftar secara alami menyampaikan fungsi ini tanpa menerjemahkan penanda objek tersebut.
- source_word: פַּרְשַׁנְדָּתָא
  choice: Parsandata
  rationale: Nama diri yang kemungkinan berasal dari bahasa Persia; dialihaksarakan sesuai bentuk yang wajar dalam bahasa Indonesia, tanpa mempertahankan digraf Inggris “th” untuk huruf ת.
- source_word: דַּלְפוֹן
  choice: Dalfon
  rationale: Nama diri dialihaksarakan ke dalam ejaan Indonesia; huruf פ di sini direpresentasikan sebagai “f”.
- source_word: אַסְפָּתָא
  choice: Aspata
  rationale: Nama diri dialihaksarakan sesuai bentuk yang wajar dalam bahasa Indonesia, dengan ת sebagai “t” dan akhiran vokal dipertahankan.
