  text: קִיְּמ֣וּ ו/קבל הַ/יְּהוּדִים֩ עֲלֵי/הֶ֨ם וְ/עַל זַרְעָ֜/ם וְ/עַ֨ל כָּל הַ/נִּלְוִ֤ים עֲלֵי/הֶם֙ וְ/לֹ֣א יַעֲב֔וֹר לִ/הְי֣וֹת עֹשִׂ֗ים אֵ֣ת שְׁנֵ֤י הַ/יָּמִים֙ הָ/אֵ֔לֶּה כִּ/כְתָבָ֖/ם וְ/כִ/זְמַנָּ֑/ם בְּ/כָל שָׁנָ֖ה וְ/שָׁנָֽה׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/027.yaml
  text: 'the Jews established and accepted for themselves[a], for their offspring, and for all who joined them, that it should not fail: to observe these two days according to what was written for them and at their appointed time[b], year after year.'
translation:
  language: id
  text: Orang-orang Yahudi menetapkan dan menerima bagi diri mereka sendiri[a], bagi keturunan mereka, dan bagi semua orang yang bergabung dengan mereka[b], kewajiban untuk terus[c] melaksanakan kedua hari ini sesuai dengan ketentuan tertulisnya dan pada waktu yang telah ditetapkan, tahun demi tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks konsonantal Ibrani mempunyai bentuk tunggal, “menerima”, sedangkan tradisi pembacaan Masoret memakai bentuk jamak, “menerima”, dengan orang-orang Yahudi sebagai subjek.
    reason: textual_variant
  - marker: b
    text: Dapat juga diterjemahkan “semua orang yang melekatkan diri kepada mereka.” Ungkapan Ibrani menunjuk kepada orang-orang yang bergabung atau mengaitkan diri dengan orang-orang Yahudi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan tidak berlalu.” Dalam konteks ini ungkapan tersebut menyatakan bahwa pelaksanaan itu tidak boleh terhenti, terlewat, atau terabaikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קִיְּמוּ
  choice: menetapkan
  rationale: Bentuk kausatif dari קום di sini menyatakan tindakan membuat suatu ketentuan tetap berlaku; “menetapkan” sesuai dengan konteks pelembagaan perayaan.
- source_word: וְקִבֵּל / וְקִבְּלוּ
  choice: dan menerima kewajiban ini
  rationale: Ungkapan קבל על menyatakan menerima atau memikul suatu kewajiban. Penambahan “kewajiban ini” membuat hubungan sintaksisnya wajar dalam bahasa Indonesia tanpa mengubah isi kewajiban yang dijelaskan sesudahnya.
- source_word: זַרְעָם
  choice: keturunan mereka
  rationale: Dalam konteks antargenerasi, “keturunan” merupakan padanan alami dan tepat bagi זרע.
- source_word: כָּל הַנִּלְוִים עֲלֵיהֶם
  choice: semua orang yang menggabungkan diri dengan mereka
  rationale: Partisip dari לוה menggambarkan orang-orang yang melekatkan atau menggabungkan diri dengan komunitas Yahudi. Bentuk refleksif mempertahankan unsur tindakan sukarela.
- source_word: וְלֹא יַעֲבוֹר
  choice: mereka tidak boleh lalai
  rationale: Secara harfiah ungkapan ini berarti bahwa hal itu tidak boleh berlalu; dalam konteks kewajiban yang berulang, maksudnya ialah perayaan tersebut tidak boleh terlewat atau terabaikan.
- source_word: לִהְיוֹת עֹשִׂים
  choice: merayakan
  rationale: Secara harfiah “terus melakukan”; dalam konteks dua hari raya, “merayakan” menyampaikan tindakan pelaksanaan berulang secara alami.
- source_word: כִּכְתָבָם
  choice: sesuai dengan apa yang tertulis tentang hari-hari tersebut
  rationale: Padanan ini mempertahankan acuan kepada ketentuan tertulis tanpa menentukan secara berlebihan dokumen atau rincian yang dimaksud.
- source_word: וְכִזְמַנָּם
  choice: pada waktu yang telah ditetapkan bagi keduanya
  rationale: זמן menunjuk pada waktu yang ditentukan. Akhiran pronominalnya mengacu pada kedua hari tersebut.
- source_word: בְּכָל שָׁנָה וְשָׁנָה
  choice: tahun demi tahun
  rationale: Ungkapan berulang ini menekankan pelaksanaan setiap tahun secara terus-menerus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi menjadi dua agar kewajiban tahunan mudah dipahami, sambil mempertahankan urutan unsur utama teks Ibrani. “Orang-orang Yahudi” dipakai sebagai sebutan komunitas, dan “tahun demi tahun” mempertahankan daya iteratif ungkapan sumber.
