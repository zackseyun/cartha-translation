  naturalness: Teks revisi tetap baku dan alami. Susunan “menetapkan dan menerima ... kewajiban untuk” menyampaikan dua verba Ibrani tanpa memecah hubungan sintaksis antara penerimaan kewajiban dan pelaksanaan tahunan.
  terminology: “Orang-orang Yahudi,” “keturunan,” dan “orang yang bergabung dengan mereka” tepat dan netral. “Melaksanakan” lebih dekat dengan לִהְיוֹת עֹשִׂים daripada “merayakan,” yang dapat menambahkan nuansa perayaan yang tidak dinyatakan oleh verba itu sendiri.
  issues:
