revisions:
- from: Orang-orang Yahudi menetapkan dan menerima kewajiban ini[a] bagi diri mereka sendiri, bagi keturunan mereka, dan bagi semua orang yang menggabungkan diri dengan mereka.[b] Mereka tidak boleh lalai[c] merayakan kedua hari itu sesuai dengan apa yang tertulis tentang hari-hari tersebut dan pada waktu yang telah ditetapkan bagi keduanya, tahun demi tahun.
  to: Orang-orang Yahudi menetapkan dan menerima bagi diri mereka sendiri[a], bagi keturunan mereka, dan bagi semua orang yang bergabung dengan mereka[b], kewajiban untuk terus[c] melaksanakan kedua hari ini sesuai dengan ketentuan tertulisnya dan pada waktu yang telah ditetapkan, tahun demi tahun.
  rationale: Revisi memperbaiki acuan frasa “sesuai dengan tulisan/ketentuan tertulisnya,” mengganti verba yang terlalu spesifik dengan “melaksanakan,” dan menempatkan catatan tentang “tidak berlalu” pada unsur “terus,” yang menyampaikan fungsi frasa tersebut dalam kalimat Indonesia. Catatan varian ketiv-qere dipertahankan.
