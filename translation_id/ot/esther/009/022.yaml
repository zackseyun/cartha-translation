  text: כַּ/יָּמִ֗ים אֲשֶׁר נָ֨חוּ בָ/הֶ֤ם הַ/יְּהוּדִים֙ מֵ/א֣וֹיְבֵי/הֶ֔ם וְ/הַ/חֹ֗דֶשׁ אֲשֶׁר֩ נֶהְפַּ֨ךְ לָ/הֶ֤ם מִ/יָּגוֹן֙ לְ/שִׂמְחָ֔ה וּ/מֵ/אֵ֖בֶל לְ/י֣וֹם ט֑וֹב לַ/עֲשׂ֣וֹת אוֹתָ֗/ם יְמֵי֙ מִשְׁתֶּ֣ה וְ/שִׂמְחָ֔ה וּ/מִשְׁל֤וֹחַ מָנוֹת֙ אִ֣ישׁ לְ/רֵעֵ֔/הוּ וּ/מַתָּנ֖וֹת לָֽ/אֶבְיוֹנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/009/022.yaml
  text: as the days on which the Jews had rest from their enemies[a], and as the month that had been turned for them from sorrow to gladness and from mourning to a good day, to make them days of feasting and gladness, and of sending portions, each man to his neighbor[c][b], and gifts to the poor.
translation:
  language: id
  text: sebagai hari-hari ketika orang Yahudi mendapat kelegaan dari musuh-musuh mereka, dan sebagai bulan yang telah berubah bagi mereka dari dukacita menjadi sukacita, serta dari perkabungan menjadi hari perayaan[a], untuk menjadikan hari-hari itu hari-hari perjamuan dan sukacita, serta untuk mengirimkan bagian-bagian[b], masing-masing kepada kawannya[c], dan memberikan pemberian kepada orang-orang miskin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi hari yang baik”; ungkapan ini juga dapat diterjemahkan “menjadi hari raya” atau “menjadi hari perayaan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mengirim bagian-bagian.” Bagian-bagian ini kemungkinan berupa makanan untuk perayaan.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “masing-masing orang kepada kawannya,” suatu ungkapan distributif untuk pemberian kepada sesama.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחוּ
  choice: mendapat kelegaan
  rationale: Kata kerja נוח menyatakan keadaan mendapat ketenangan atau kelegaan. Dalam konteks ancaman musuh yang telah berlalu, “mendapat kelegaan” terdengar alami dan mempertahankan gagasan bebas dari tekanan mereka.
- source_word: מֵאֹיְבֵיהֶם
  choice: dari musuh-musuh mereka
  rationale: Preposisi מִן menandai pemisahan atau sumber; kelegaan itu dialami setelah terlepas dari ancaman para musuh.
- source_word: נֶהְפַּךְ
  choice: telah berubah
  rationale: Bentuk Nifal dari הפך menyatakan perubahan atau pembalikan keadaan. “Telah berubah” mempertahankan hasil pembalikan yang sudah terjadi tanpa menentukan pelaku yang tidak disebutkan.
- source_word: יָגוֹן
  choice: dukacita
  rationale: יָגוֹן berarti kesedihan atau dukacita. “Dukacita” membentuk kontras yang jelas dan bermartabat dengan “sukacita”.
- source_word: שִׂמְחָה
  choice: sukacita
  rationale: Nomina ini menyatakan kegembiraan, khususnya dalam suasana perayaan. “Sukacita” sesuai pada kedua kemunculannya dan menjaga pengulangan sumber.
- source_word: אֵבֶל
  choice: perkabungan
  rationale: אֵבֶל menunjuk pada perkabungan atau ratapan, sehingga dibedakan dari יָגוֹן yang diterjemahkan “dukacita”.
- source_word: לְיוֹם טוֹב
  choice: menjadi hari perayaan
  rationale: Secara harfiah frasa ini berarti “menjadi hari yang baik,” tetapi dalam konteks pesta dan sukacita ungkapan itu merujuk pada hari perayaan. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: לַעֲשׂוֹת אוֹתָם
  choice: Mereka harus menjadikan hari-hari itu
  rationale: Infinitif “menjadikan” menyatakan tujuan ketetapan dalam konteks ayat sebelumnya. Subjek tersirat dibuat eksplisit agar kalimat Indonesia dapat berdiri dengan jelas, tanpa mengubah rujukannya.
- source_word: יְמֵי מִשְׁתֶּה
  choice: hari perjamuan
  rationale: מִשְׁתֶּה menunjuk pada jamuan atau pesta, sering kali dengan minuman. “Perjamuan” menyampaikan perayaan bersama tanpa mempersempitnya pada minuman.
- source_word: וּמִשְׁלוֹחַ מָנוֹת
  choice: saling mengirim bagian makanan
  rationale: מָנוֹת secara leksikal berarti “bagian-bagian”; dalam kebiasaan perayaan ini kemungkinan besar berupa bagian makanan. Kata “saling” secara alami merangkum ungkapan distributif yang mengikutinya.
- source_word: אִישׁ לְרֵעֵהוּ
  choice: kepada sesama
  rationale: Secara harfiah ungkapan distributif ini berbunyi “seseorang kepada kawannya.” Dalam konteks pemberian timbal balik, “kepada sesama” bersama “saling” menyampaikan fungsi ungkapan itu secara alami dan inklusif.
- source_word: מַתָּנוֹת לָאֶבְיוֹנִים
  choice: memberikan pemberian kepada orang miskin
  rationale: אֶבְיוֹנִים menunjuk pada orang miskin atau berkekurangan. “Orang miskin” ringkas dan mempertahankan penekanan sosial-etis teks.
theological_decisions:
- issue: Ungkapan distributif maskulin אִישׁ לְרֵעֵהוּ
  choice: saling ... kepada sesama
  alternative: masing-masing orang kepada kawannya
  rationale: Bentuk maskulin tunggal berfungsi distributif dan mewakili anggota masyarakat secara umum. Bahasa Indonesia tidak memerlukan penandaan gender di sini; terjemahan ini menjaga makna timbal balik tanpa menyatakan bahwa hanya laki-laki yang terlibat.
- issue: Pelaku perubahan dalam נֶהְפַּךְ
  choice: telah berubah
  alternative: telah diubah
  rationale: Teks memakai bentuk pasif tetapi tidak menyebutkan pelaku. “Telah berubah” mempertahankan keterbukaan itu dan tidak memasukkan pelaku ilahi secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur awal “sebagai hari-hari” dipertahankan karena ayat ini melanjutkan ketetapan pada ayat sebelumnya; kalimat kemudian dipecah agar rangkaian panjang bahasa Ibrani tetap mudah dipahami. Istilah “perjamuan,” “sukacita,” dan “perkabungan” menjaga corak perayaan yang khidmat tanpa terasa kuno.
