  language: id
  text: Pada hari itu, jumlah orang yang terbunuh di benteng Susan sampai ke hadapan raja.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan alami dan langsung bagi ungkapan waktu Ibrani.
- source_word: מִסְפַּר הַהֲרוּגִים
  choice: jumlah orang yang terbunuh
  rationale: מִסְפַּר berarti jumlah, sedangkan bentuk pasif הֲרוּגִים menunjuk kepada mereka yang telah dibunuh atau terbunuh.
- source_word: שׁוּשַׁן הַבִּירָה
  choice: benteng Susan
  rationale: הַבִּירָה di sini menunjuk pada kompleks benteng atau pusat pemerintahan Susan; susunan ini alami dalam bahasa Indonesia.
- source_word: בָּא ... לִפְנֵי הַמֶּלֶךְ
  choice: sampai ke hadapan raja
  rationale: Mempertahankan gambaran harfiah bahwa jumlah atau laporan tersebut 'datang' ke hadapan raja, tanpa secara eksplisit menambahkan pelaku pasif seperti 'dilaporkan'.
