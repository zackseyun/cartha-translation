  text: עוֹדָ/ם֙ מְדַבְּרִ֣ים עִמּ֔/וֹ וְ/סָרִיסֵ֥י הַ/מֶּ֖לֶךְ הִגִּ֑יעוּ וַ/יַּבְהִ֨לוּ֙ לְ/הָבִ֣יא אֶת הָמָ֔ן אֶל הַ/מִּשְׁתֶּ֖ה אֲשֶׁר עָשְׂתָ֥ה אֶסְתֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/014.yaml
  text: While they were still speaking with him[b][a], the king’s eunuchs arrived and hurried to bring Haman to the banquet that Esther had prepared.
translation:
  language: id
  text: Sementara mereka masih berbicara dengannya, para sida-sida raja[a] tiba, lalu bergegas[b] membawa Haman ke perjamuan yang telah disiapkan Ester.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabat istana raja”; istilah Ibrani ini dapat menunjuk kepada pejabat istana maupun sida-sida.
    reason: lexical_alternative
  - marker: b
    text: Atau “segera”; kata kerja Ibrani di sini menyatakan kecepatan yang mendesak.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדָם מְדַבְּרִים
  choice: sementara mereka masih berbicara
  rationale: Gabungan adverbia dan partisip menunjukkan tindakan yang sedang berlangsung dan belum selesai ketika peristiwa berikutnya terjadi.
- source_word: עִמּוֹ
  choice: dengannya
  rationale: Preposisi עִם secara langsung menyatakan kebersamaan; “berbicara dengannya” alami dalam bahasa Indonesia dan mempertahankan hubungan dalam teks Ibrani.
- source_word: סָרִיסֵי הַמֶּלֶךְ
  choice: para sida-sida raja
  rationale: סָרִיס dapat berarti sida-sida maupun pejabat istana. Makna yang lebih konkret dipertahankan dalam teks, sedangkan kemungkinan umum dicatat dalam catatan kaki.
- source_word: הִגִּיעוּ
  choice: tiba
  rationale: Kata kerja ini menyatakan bahwa mereka sampai di tempat kejadian; “tiba” ringkas dan alami dalam narasi.
- source_word: וַיְבַהִלוּ
  choice: lalu bergegas
  rationale: Bentuk Hifil dari בהל dalam konstruksi ini menyampaikan tindakan dengan kecepatan mendesak. “Bergegas” mempertahankan urgensi tanpa harus menyiratkan kepanikan.
- source_word: לְהָבִיא אֶת־הָמָן
  choice: membawa Haman
  rationale: Infinitif menyatakan tujuan tindakan mereka, yakni membawa Haman ke perjamuan.
- source_word: הַמִּשְׁתֶּה
  choice: perjamuan
  rationale: מִשְׁתֶּה menunjuk pada jamuan atau pesta, biasanya dengan minuman anggur; “perjamuan” sesuai dengan suasana istana dan konsisten dengan narasi Ester.
- source_word: אֲשֶׁר עָשְׂתָה אֶסְתֵּר
  choice: yang telah disiapkan Ester
  rationale: Walaupun עשה secara harfiah berarti “membuat” atau “melakukan”, “menyiapkan perjamuan” merupakan ungkapan Indonesia yang alami. “Telah” menunjukkan bahwa perjamuan itu sudah tersedia sebelumnya.
