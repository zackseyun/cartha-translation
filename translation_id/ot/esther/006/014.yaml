  source_fidelity: Teks Indonesia dengan setia menyampaikan kesinambungan tindakan dalam עוֹדָם מְדַבְּרִים עִמּוֹ (“sementara mereka masih berbicara dengannya”), kedatangan para סָרִיסֵי הַמֶּלֶךְ, dan tindakan mendesak mereka untuk membawa Haman ke perjamuan Ester. “Yang telah disiapkan Ester” adalah padanan idiomatis yang tepat untuk perjamuan yang sudah dipersiapkan sebelumnya.
