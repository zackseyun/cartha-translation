revisions:
- from: Lalu Haman mengambil jubah dan kuda itu,[a] mengenakan jubah itu kepada Mordekhai, lalu membawa Mordekhai yang menunggang kuda melintasi alun-alun kota sambil berseru di depannya, “Beginilah dilakukan kepada orang yang berkenan dihormati oleh raja!”
  to: Lalu Haman mengambil jubah dan kuda itu,[a] mengenakan jubah itu kepada Mordekhai, lalu membawa Mordekhai menunggang kuda itu melintasi alun-alun kota dan berseru di depannya, “Beginilah dilakukan bagi orang yang raja ingin hormati!”
  rationale: Revisi memperjelas bahwa raja, bukan orang yang dihormati, adalah subjek yang menginginkan pemberian kehormatan. Susunan tindakan juga dibuat lebih langsung dan netral, sambil tetap mempertahankan sifat kausatif dari verba Ibrani melalui terjemahan utama dan catatan kaki.
