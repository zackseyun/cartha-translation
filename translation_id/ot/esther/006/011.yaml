base_translation:
  language: en
  yaml_path: translation/ot/esther/006/011.yaml
  text: So Haman took the robe and the horse[a], clothed Mordecai, led him on horseback through the city square, and proclaimed before him, “Thus shall it be done for the man whom the king delights to honor.”
translation:
  language: id
  text: Lalu Haman mengambil jubah dan kuda itu,[a] mengenakan jubah itu kepada Mordekhai, lalu membawa Mordekhai menunggang kuda itu melintasi alun-alun kota dan berseru di depannya, “Beginilah dilakukan bagi orang yang raja ingin hormati!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “lalu membuat Mordekhai menunggang kuda itu melintasi alun-alun kota.” Kata kerja Ibrani berbentuk kausatif: Haman menyebabkan Mordekhai menunggang dalam arak-arakan umum itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְּבוּשׁ
  choice: jubah itu
  rationale: Nomina tunggal tentu ini merujuk kembali pada pakaian kebesaran yang telah disebutkan; “jubah” alami dan bermartabat dalam konteks kerajaan.
- source_word: הַסּוּס
  choice: kuda itu
  rationale: Teks Ibrani hanya menyebut “kuda itu”; kaitannya dengan raja sudah jelas dari konteks sehingga “kerajaan” tidak perlu ditambahkan.
- source_word: וַיַּלְבֵּשׁ אֶת מָרְדֳּכָי
  choice: mengenakan jubah itu kepada Mordekhai
  rationale: Bentuk kausatif dari לבש berarti mengenakan pakaian kepada seseorang. Objek “jubah itu” diulangi agar konstruksinya jelas dan alami dalam bahasa Indonesia.
- source_word: וַיַּרְכִּיבֵהוּ
  choice: membawa Mordekhai yang menunggang kuda
  rationale: Bentuk kausatif dari רכב menyatakan bahwa Haman membuat Mordekhai berkendara. Ungkapan ini alami dalam narasi Indonesia dan menyampaikan peran Haman dalam arak-arakan tanpa menyatakan secara berlebihan bahwa ia menuntun tali kekang.
- source_word: בִּרְחוֹב הָעִיר
  choice: melintasi alun-alun kota
  rationale: רְחוֹב di sini menunjuk pada ruang terbuka umum atau lapangan kota, bukan sekadar jalan biasa; “alun-alun kota” sesuai dengan suasana publik tersebut.
- source_word: וַיִּקְרָא לְפָנָיו
  choice: sambil berseru di depannya
  rationale: קרא dalam konteks ini adalah seruan pengumuman di muka umum. “Di depannya” mempertahankan keterangan ruang tanpa menentukan lebih jauh posisi persis Haman.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Beginilah dilakukan
  rationale: Terjemahan ini mempertahankan daya demonstratif כָּכָה dan bentuk pasif יֵעָשֶׂה, sekaligus terdengar sebagai rumusan maklumat resmi.
- source_word: לָאִישׁ
  choice: kepada orang
  rationale: Bahasa Indonesia tidak perlu menandai gender gramatikal di sini; “orang” mempertahankan makna tunggal generik tanpa menghilangkan rujukan pada Mordekhai.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: berkenan dihormati
  rationale: חפץ menyatakan kesenangan atau perkenanan, sedangkan יקר menunjuk pada kehormatan yang diberikan. Susunan ini ringkas dan mempertahankan bahwa raja berkenan orang tersebut menerima penghormatan.
