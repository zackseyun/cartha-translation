base_translation:
  language: en
  yaml_path: translation/ot/esther/006/009.yaml
  text: And let the robe and the horse be entrusted to the hand of one of the king’s noble officials, and let them clothe the man whom the king delights to honor, and let them mount him on the horse through the open square of the city, and proclaim before him, ‘Thus shall it be done for the man whom the king delights to honor.’
translation:
  language: id
  text: Biarlah pakaian dan kuda itu dipercayakan kepada salah seorang pejabat terkemuka raja. Hendaklah orang yang raja ingin hormati itu dipakaikan pakaian tersebut, lalu dinaikkan ke atas kuda dan dibawa melalui alun-alun kota. Hendaklah orang-orang berseru di depannya, ‘Beginilah dilakukan kepada orang yang raja ingin hormati.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפַּרְתְּמִים
  choice: pejabat terkemuka
  rationale: Istilah Persia ini menunjuk pada kalangan bangsawan atau pejabat tinggi kerajaan; pilihan ini menyampaikan kedudukan resmi dan kehormatan mereka tanpa menganggapnya sebagai gelar teknis tertentu.
- source_word: חָפֵץ בִּיקָרוֹ
  choice: ingin dihormati
  rationale: Secara harfiah menyatakan bahwa raja berkenan atau menginginkan kehormatan bagi orang itu. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan raja sebagai pihak yang menentukan penghormatan.
- source_word: בִּרְחוֹב הָעִיר
  choice: melalui alun-alun kota
  rationale: רְחוֹב menunjuk pada ruang terbuka atau lapangan umum di dalam kota, bukan sekadar jalan biasa.
- source_word: וְהִרְכִּיבֻהוּ עַל הַסּוּס
  choice: menaikkannya ke atas kuda dan membawanya
  rationale: Bentuk kausatif berarti membuat orang itu menunggang; tambahan 'membawanya' tersirat dari gerak melalui alun-alun dalam klausa berikutnya dan menghasilkan bahasa Indonesia yang jelas.
- source_word: וְקָרְאוּ לְפָנָיו
  choice: berseru di depannya
  rationale: Mempertahankan gambaran bentara yang berjalan di depan orang yang dihormati sambil mengumumkan penghormatan itu.
