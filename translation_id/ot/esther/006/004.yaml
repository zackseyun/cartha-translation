base_translation:
  language: en
  yaml_path: translation/ot/esther/006/004.yaml
  text: And the king said[a], “Who is in the court?” Now Haman had come into the outer court of the king’s palace to speak to the king about hanging Mordecai on the gallows that he had prepared for him.
translation:
  language: id
  text: Lalu raja berkata, “Siapa yang ada di pelataran?” Saat itu Haman telah masuk ke pelataran luar istana raja untuk berbicara kepada raja tentang menggantung Mordekhai pada tiang kayu[a] yang telah disiapkannya bagi Mordekhai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani עֵץ secara harfiah berarti “pohon” atau “kayu”; di sini kata itu menunjuk pada sarana eksekusi, yang mungkin berupa tiang untuk menggantung atau memancangkan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶחָצֵר / לַחֲצַר
  choice: di pelataran / ke pelataran
  rationale: חָצֵר menunjuk pada halaman atau ruang terbuka yang dikelilingi bangunan. “Pelataran” alami dalam konteks istana dan mempertahankan pengulangan nomina Ibrani.
- source_word: וְהָמָן בָּא
  choice: Saat itu Haman telah masuk
  rationale: Klausa ini memberi informasi latar bagi pertanyaan raja. Bentuk “telah masuk” menunjukkan bahwa kedatangan Haman mendahului atau menjadi keadaan yang melatarbelakangi pertanyaan itu, sedangkan “saat itu” menandai peralihan adegan secara alami.
- source_word: בֵּית הַמֶּלֶךְ
  choice: istana raja
  rationale: Secara harfiah berarti “rumah raja”, tetapi dalam konteks kerajaan merujuk pada istana; pilihan ini jelas dan wajar bagi pembaca modern.
- source_word: הַחִיצוֹנָה
  choice: luar
  rationale: Adjektiva ini membedakan pelataran tersebut dari pelataran dalam.
- source_word: לֵאמֹר לַמֶּלֶךְ
  choice: untuk berbicara kepada raja
  rationale: Infinitif אמר di sini menyatakan tujuan kedatangan Haman untuk menghadap dan menyampaikan permintaan kepada raja tanpa mempersempit isi ucapannya.
- source_word: לִתְלוֹת
  choice: tentang menggantung
  rationale: Bentuk ini bergantung pada tujuan berbicara kepada raja. “Tentang menggantung” merupakan susunan Indonesia yang alami dan tetap menyatakan tindakan yang dimaksud secara eksplisit.
- source_word: הָעֵץ
  choice: tiang kayu
  rationale: עֵץ secara leksikal berarti pohon atau kayu dan di sini menunjuk pada sarana eksekusi yang disiapkan Haman. “Tiang kayu” mempertahankan keluasan istilah Ibrani serta cocok dengan kemungkinan pemancangan atau penggantungan, tanpa membayangkan konstruksi tiang gantungan modern secara terlalu spesifik.
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: yang telah disiapkannya bagi Mordekhai
  rationale: Pronomina Ibrani secara harfiah berarti “baginya” dan dalam konteks paling alami merujuk kepada Mordekhai. Menyebut nama Mordekhai menghindari ketaksaan pronomina Indonesia mengenai siapa yang menyiapkan dan bagi siapa sarana itu dibuat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Pelataran” serta “istana” menjaga suasana kerajaan tanpa terdengar kuno. “Tiang kayu” dipilih daripada “tiang gantungan” agar bentuk sarana eksekusi tidak ditentukan melebihi bukti istilah Ibrani.
