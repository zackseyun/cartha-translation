base_translation:
  language: en
  yaml_path: translation/ot/esther/006/007.yaml
  text: And Haman said to the king[a], “For the man whom the king delights to honor—”
translation:
  language: id
  text: Lalu Haman berkata kepada raja, “Bagi orang[a] yang kepadanya raja berkenan memberikan kehormatan—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “seorang laki-laki.” Kata Ibrani אִישׁ berbentuk tunggal maskulin, tetapi dalam konteks ini menyatakan seseorang yang belum disebutkan namanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw memajukan rangkaian peristiwa; “lalu” alami dalam narasi bahasa Indonesia.
- source_word: הָמָן
  choice: Haman
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל הַמֶּלֶךְ
  choice: kepada raja
  rationale: Preposisi אֶל menandai pihak yang diajak bicara, sedangkan nomina berartikel diterjemahkan sebagai gelar tertentu dalam konteks.
- source_word: אִישׁ
  choice: orang
  rationale: אִישׁ berbentuk tunggal maskulin dan secara harfiah dapat berarti “seorang laki-laki”; dalam jawaban umum Haman, “orang” terdengar lebih alami dalam bahasa Indonesia tanpa meniadakan rujukan tunggalnya. Bentuk harfiah dicatat dalam catatan kaki.
- source_word: אֲשֶׁר
  choice: yang kepadanya
  rationale: Konstruksi relatif ini memperjelas bahwa orang tersebut adalah penerima kehormatan.
- source_word: חָפֵץ
  choice: berkenan
  rationale: Kata ini menyatakan kesenangan atau kehendak, bukan sekadar tindakan netral; “berkenan” sesuai dengan ragam bahasa istana dan mempertahankan nuansa kesukaan raja.
- source_word: בִּיקָרוֹ
  choice: memberikan kehormatan
  rationale: יְקָר menunjuk pada kehormatan, penghargaan, atau kemuliaan. Ungkapan verbal ini alami dalam bahasa Indonesia dan tidak meninggikan maknanya menjadi pemuliaan ilahi.
