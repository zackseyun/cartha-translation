translation_notes:
  register: Bahasa naratif modern dan bermartabat. Susunan “yang kepadanya raja berkenan memberikan kehormatan” menghindari ketaksaan tentang siapa yang berkehendak memberi kehormatan. Tanda pisah mempertahankan kalimat yang belum selesai dan berlanjut pada ayat berikutnya.
