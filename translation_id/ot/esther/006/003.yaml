base_translation:
  language: en
  yaml_path: translation/ot/esther/006/003.yaml
  text: Then the king said[a], “What honor and greatness has been bestowed on Mordecai for this?” The king’s young men who attended him said, “Nothing has been done for him.”
translation:
  language: id
  text: Lalu raja bertanya, “Kehormatan dan kebesaran apa yang telah diberikan kepada Mordekhai karena hal ini?” Para pemuda raja yang melayaninya menjawab, “Belum ada sesuatu pun yang dilakukan baginya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה נַּעֲשָׂה
  choice: apa yang telah diberikan
  rationale: Bentuk pasif dari עשה menanyakan tindakan yang telah dilakukan; bersama nomina ‘kehormatan dan kebesaran’, ‘telah diberikan’ merupakan ungkapan Indonesia yang alami dan tetap mempertahankan makna pasif.
- source_word: יְקָר
  choice: kehormatan
  rationale: Dalam konteks istana, kata ini menunjuk pada penghormatan atau penghargaan yang diberikan kepada seseorang, bukan nilai material.
- source_word: וּגְדוּלָּה
  choice: kebesaran
  rationale: Pilihan ini mempertahankan makna dasar ‘kebesaran’ dan ketegangan ungkapan sumber tanpa mempersempitnya menjadi promosi atau kedudukan tertentu.
- source_word: לְמָרְדֳּכַי
  choice: kepada Mordekhai
  rationale: Preposisi ל menandai penerima atau pihak yang mendapat manfaat; ‘diberikan kepada’ adalah konstruksi Indonesia yang wajar.
- source_word: עַל זֶה
  choice: karena hal ini
  rationale: Frasa ini merujuk pada tindakan Mordekhai yang dicatat sebelumnya dan menyatakan alasan pemberian penghormatan.
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: para pemuda raja
  rationale: Terjemahan ini mempertahankan arti leksikal נערים sebagai ‘para pemuda’, sedangkan fungsi pelayanan mereka dinyatakan oleh kata berikutnya.
- source_word: מְשָׁרְתָיו
  choice: yang melayaninya
  rationale: Partisipel dari שרת menunjukkan orang-orang yang melayani atau menghadiri raja secara pribadi di lingkungan istana.
- source_word: לֹא נַעֲשָׂה עִמּוֹ דָּבָר
  choice: Belum ada sesuatu pun yang dilakukan baginya
  rationale: Ungkapan idiomatis ini berarti tidak ada tindakan yang telah diambil demi Mordekhai. ‘Belum’ sesuai dengan konteks pertanyaan tentang penghargaan yang semestinya sudah diberikan.
theological_decisions: []
