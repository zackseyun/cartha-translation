  text: Then Mordecai returned to the king’s gate[a], but Haman hurried to his house[b], mourning and with his head covered.
translation:
  language: id
  text: Lalu Mordekhai kembali ke pintu gerbang raja, sedangkan Haman bergegas ke rumahnya[a] dalam keadaan berkabung dan dengan kepala terselubung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terdesak ke rumahnya,” untuk mempertahankan nuansa pasif kata kerja Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Menyelubungi kepala merupakan tanda budaya yang menyatakan dukacita, kehinaan, atau perkabungan.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk naratif dari שׁוּב menyatakan bahwa Mordekhai kembali ke tempat atau kedudukannya semula; “kembali” alami dan tepat dalam bahasa Indonesia.
- source_word: שַׁעַר הַמֶּלֶךְ
  choice: pintu gerbang raja
  rationale: Frasa konstruksi ini secara langsung berarti gerbang yang berkaitan dengan raja, yakni gerbang kompleks kerajaan; terjemahan mempertahankan ungkapan konkret Ibrani tanpa menambahkan keterangan yang tidak tersurat.
- source_word: נִדְחַף
  choice: bergegas
  rationale: Bentuk Nifal dari דחף dapat mengandung nuansa didorong atau terdesak. Dalam konteks, “bergegas” menyampaikan gerak Haman yang cepat setelah dipermalukan, sementara nuansa pasifnya dipertahankan dalam catatan kaki.
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Padanan langsung bagi nomina dengan akhiran posesif orang ketiga tunggal dan sesuai dengan ragam naratif.
- source_word: אָבֵל
  choice: dalam keadaan berkabung
  rationale: Kata sifat ini menggambarkan keadaan duka atau ratapan Haman; frasa ini jelas dan alami dalam bahasa Indonesia.
- source_word: חֲפוּי רֹאשׁ
  choice: dengan kepala terselubung
  rationale: Terjemahan mempertahankan gambaran konkret tentang kepala yang ditutupi, alih-alih menggantinya dengan tafsiran seperti “karena malu”.
