base_translation:
  language: en
  yaml_path: translation/ot/esther/006/006.yaml
  text: So Haman came in[a], and the king said to him, “What should be done for the man whom the king delights to honor?” And Haman said in his heart, “Whom would the king delight to honor more than me?”
translation:
  language: id
  text: Maka Haman masuk. Raja berkata kepadanya, “Apa yang harus dilakukan bagi orang yang ingin raja hormati?” Haman berkata dalam hatinya[a], “Siapa yang lebih ingin raja hormati daripada aku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Haman berkata kepada dirinya sendiri.” Secara harfiah, bahasa Ibrani berbunyi, “berkata dalam hatinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבוֹא הָמָן
  choice: Maka Haman masuk
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sedangkan “masuk” secara alami menggambarkan Haman memasuki hadirat raja.
- source_word: וַיֹּאמֶר לוֹ הַמֶּלֶךְ
  choice: lalu raja berkata kepadanya
  rationale: Mempertahankan arti dasar אָמַר, “berkata,” meskipun ujaran berikutnya berbentuk pertanyaan.
- source_word: מַה לַעֲשׂוֹת בָּאִישׁ
  choice: Apa yang harus dilakukan bagi orang
  rationale: Konstruksi infinitif menyatakan tindakan yang patut dilakukan; “bagi orang” menyampaikan fungsi idiomatis preposisi ב dalam konteks ini.
- source_word: אֲשֶׁר הַמֶּלֶךְ חָפֵץ בִּיקָרוֹ
  choice: yang kepadanya raja berkenan memberikan kehormatan
  rationale: “Berkenan” mempertahankan unsur kesenangan atau kerelaan dalam חָפֵץ, sedangkan “memberikan kehormatan” menyampaikan יְקָר sebagai kehormatan yang dianugerahkan raja tanpa menimbulkan ambiguitas sintaksis yang tidak ada dalam maksud konteks.
- source_word: וַיֹּאמֶר הָמָן בְּלִבּוֹ
  choice: Haman berkata dalam hatinya
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani mengenai ujaran batin dan tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: לְמִי יַחְפֹּץ הַמֶּלֶךְ לַעֲשׂוֹת יְקָר
  choice: Kepada siapa raja akan lebih berkenan memberikan kehormatan
  rationale: Mengulang “berkenan memberikan kehormatan” menjaga konsistensi leksikal dengan klausa sebelumnya dan menyampaikan penganugerahan kehormatan oleh raja.
- source_word: יוֹתֵר מִמֶּנִּי
  choice: daripada kepadaku
  rationale: Bentuk ini melengkapi konstruksi komparatif secara wajar dan menegaskan kesombongan dalam monolog batin Haman.
