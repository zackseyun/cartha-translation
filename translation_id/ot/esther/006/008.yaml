base_translation:
  language: en
  yaml_path: translation/ot/esther/006/008.yaml
  text: Let them bring a royal robe that the king has worn[a], and a horse on which the king has ridden, and on whose head a royal crown has been placed.
translation:
  language: id
  text: Hendaklah dibawa jubah kerajaan yang pernah dikenakan raja, dan seekor kuda yang pernah ditunggangi raja dan yang di atas kepalanya[a] telah diletakkan mahkota kerajaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “dan yang di atas kepalanya telah diletakkan sebuah mahkota kerajaan.” Kata ganti “-nya” paling alami merujuk kepada kuda, meskipun sebagian pembaca memahaminya sebagai merujuk kepada raja.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבִיאוּ
  choice: Hendaklah dibawa
  rationale: Bentuk Hifil imperfek orang ketiga jamak menyampaikan perintah atau usul dalam tuturan langsung. Bentuk pasif impersonal ini alami dalam bahasa Indonesia dan tidak menambahkan pelaku yang tidak disebutkan.
- source_word: לְבוּשׁ מַלְכוּת
  choice: jubah kerajaan
  rationale: Frasa konstruksi ini menunjuk pakaian yang berkaitan dengan martabat raja. “Jubah kerajaan” ringkas, wajar, dan sesuai dengan benda kehormatan tertentu dalam konteks.
- source_word: אֲשֶׁר לָבַשׁ בּוֹ הַמֶּלֶךְ
  choice: yang pernah dikenakan raja
  rationale: Klausa ini menegaskan bahwa jubah tersebut benar-benar pernah dipakai oleh raja. “Dikenakan” sesuai untuk pakaian dan “pernah” menyatakan pengalaman lampau yang relevan tanpa memaksakan aspek yang terlalu khusus.
- source_word: וְסוּס
  choice: dan seekor kuda
  rationale: Nomina tanpa artikel ini memperkenalkan benda kedua yang diminta. Penggolong “seekor” merupakan bentuk Indonesia yang alami.
- source_word: אֲשֶׁר רָכַב עָלָיו הַמֶּלֶךְ
  choice: yang pernah ditunggangi raja
  rationale: Terjemahan pasif idiomatis ini tetap menyatakan bahwa raja sendiri pernah menunggang kuda itu.
- source_word: וַאֲשֶׁר נִתַּן כֶּתֶר מַלְכוּת בְּרֹאשׁוֹ
  choice: serta yang kepalanya telah dipasangi mahkota kerajaan
  rationale: Susunan ini menyampaikan konstruksi pasif dan, sesuai rujukan sintaksis yang paling dekat, memahami sufiks orang ketiga maskulin tunggal sebagai kuda. Ketaksaan rujukannya tetap dicatat dalam catatan kaki.
- source_word: כֶּתֶר מַלְכוּת
  choice: mahkota kerajaan
  rationale: Frasa ini menyebut mahkota yang berhubungan dengan kedudukan raja. Bahasa Indonesia tidak memerlukan penanda takrif atau ketaktakrifan seperti bahasa Inggris.
- source_word: בְּרֹאשׁוֹ
  choice: kepalanya
  rationale: Sufiks orang ketiga maskulin tunggal paling alami merujuk kepada kuda sebagai anteseden terdekat, tetapi secara bentuk dapat dipahami berbeda; karena itu penanda catatan ditempatkan langsung pada unsur ini.
