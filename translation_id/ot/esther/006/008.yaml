  naturalness: Kalimatnya pada dasarnya baku, tetapi rangkaian “serta yang kepalanya telah dipasangi” kurang luwes dan “dipasangi” dapat memberi kesan mahkota itu dilekatkan secara permanen. Susunan yang direvisi lebih langsung mencerminkan penempatan mahkota di atas kepala kuda.
  terminology: “Jubah kerajaan,” “kuda,” dan “mahkota kerajaan” tepat serta konsisten dengan register naratif yang bermartabat. Catatan kaki perlu diperbaiki karena susunan kutipan harfiahnya tidak alami dalam bahasa Indonesia.
  issues:
