base_translation:
  language: en
  yaml_path: translation/ot/esther/006/001.yaml
  text: On that night the king could not sleep[a], so he ordered the book of records, the chronicles, to be brought[b], and they were read before the king.
translation:
  language: id
  text: Pada malam itu raja tidak dapat tidur[a]. Lalu ia memerintahkan agar kitab catatan sejarah[b] dibawa dan dibacakan di hadapan raja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidur raja pergi.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kitab kenangan, yaitu catatan peristiwa-peristiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Frasa temporal ini menunjuk pada malam tertentu dalam alur cerita; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kekhususan kata penunjuk Ibrani.
- source_word: נָדְדָה שְׁנַת הַמֶּלֶךְ
  choice: raja tidak dapat tidur
  rationale: Secara harfiah, 'tidur raja menjauh/terusir.' Ungkapan Indonesia ini menyampaikan maknanya secara wajar, sementara citra harfiahnya dicatat dalam catatan kaki.
- source_word: וַיֹּאמֶר
  choice: Lalu ia memerintahkan
  rationale: Walaupun bentuk dasarnya berarti 'berkata,' dalam konteks ini kata tersebut memperkenalkan perintah kepada para pelayan. 'Memerintahkan' menyatakan fungsi tutur itu dengan jelas.
- source_word: לְהָבִיא
  choice: agar ... dibawa
  rationale: Infinitif ini menyatakan isi perintah. Bentuk pasif sesuai karena orang yang membawa kitab itu tidak disebutkan.
- source_word: סֵפֶר הַזִּכְרֹנוֹת דִּבְרֵי הַיָּמִים
  choice: kitab catatan peristiwa-peristiwa kerajaan
  rationale: Dua frasa ini menerangkan arsip pengingat berupa catatan kejadian atau tarikh istana. 'Kerajaan' dibuat tersurat dari konteks arsip raja agar ungkapannya jelas dan alami, tanpa mengubah rujukannya.
- source_word: וַיִּהְיוּ נִקְרָאִים
  choice: dan dibacakan
  rationale: Bentuk pasif menunjukkan bahwa catatan itu dibaca dengan suara keras bagi raja. 'Dibacakan' lebih tepat daripada sekadar 'dibaca' dalam konteks audiensi kerajaan.
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: di hadapannya
  rationale: Secara harfiah berarti 'di hadapan raja.' Pronomina menghindari pengulangan yang kaku dan tetap mempertahankan arti pembacaan dalam kehadiran raja.
