  naturalness: Bahasa umumnya baku dan jelas. Akan tetapi, rangkaian "para penjaga pintu masuk, yang telah berusaha" secara sintaktis dapat membuat klausa terakhir tampak menerangkan para penjaga secara keseluruhan, bukan Bigtana dan Teresh. Memisahkan klausa terakhir dengan "Keduanya" menghilangkan ambiguitas ini secara alami.
  terminology: '"Sida-sida raja" secara leksikal dapat dipertahankan, dengan alternatif "pejabat istana raja" pada catatan kaki untuk keluasan makna סָרִיס. "Bigtana," "Teresh," "Mordekhai," dan "Ahasyweros" konsisten dengan bentuk yang dipilih dan dengan teks sumber. "Mencelakai" menyampaikan maksud bermusuhan dari idiom "mengulurkan tangan" tanpa menentukan bentuk serangannya.'
