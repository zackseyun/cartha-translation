  text: וַ/יִּמָּצֵ֣א כָת֗וּב אֲשֶׁר֩ הִגִּ֨יד מָרְדֳּכַ֜י עַל בִּגְתָ֣נָא וָ/תֶ֗רֶשׁ שְׁנֵי֙ סָרִיסֵ֣י הַ/מֶּ֔לֶךְ מִ/שֹּׁמְרֵ֖י הַ/סַּ֑ף אֲשֶׁ֤ר בִּקְשׁוּ֙ לִ/שְׁלֹ֣חַ יָ֔ד בַּ/מֶּ֖לֶךְ אֲחַשְׁוֵרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/002.yaml
  text: And it was found written that Mordecai had reported concerning Bigthana and Teresh[a], two of the king’s eunuchs, among those who guarded the threshold[b], who had sought to lay a hand on King Ahasuerus.
translation:
  language: id
  text: Lalu ditemukan catatan bahwa Mordekhai telah melaporkan tentang Bigtana dan Teresh[a], dua sida-sida raja[b] yang termasuk kelompok penjaga pintu masuk. Keduanya telah berusaha mencelakai Raja Ahasyweros.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam ayat ini, teks Ibrani memakai bentuk nama Bigtana; di tempat lain nama itu muncul sebagai Bigtan.
    reason: alternative_reading
  - marker: b
    text: Atau “dua pejabat istana raja”; istilah Ibrani ini dapat berarti sida-sida secara khusus atau pejabat kerajaan secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּצֵא כָתוּב
  choice: ditemukan catatan
  rationale: Ungkapan ini menyampaikan konstruksi pasif dan konteks arsip secara alami dalam bahasa Indonesia; secara harfiah, 'ditemukan tertulis'.
- source_word: הִגִּיד
  choice: telah melaporkan
  rationale: Dalam konteks catatan resmi istana, 'melaporkan' tepat untuk tindakan memberitahukan atau menyatakan perkara tersebut.
- source_word: עַל
  choice: tentang (tersirat sebagai objek 'melaporkan')
  rationale: Preposisi ini menandai pokok laporan. Dalam susunan Indonesia, maknanya tersampaikan secara alami dengan menjadikan kedua nama itu objek langsung dari 'melaporkan'.
- source_word: בִּגְתָנָא וָתֶרֶשׁ
  choice: Bigtana dan Teresh
  rationale: Bigtana mengikuti bentuk nama בִּגְתָנָא dalam ayat ini; variasi bentuknya dijelaskan dalam catatan kaki.
- source_word: שְׁנֵי סָרִיסֵי הַמֶּלֶךְ
  choice: dua sida-sida raja
  rationale: סָרִיס dapat berarti sida-sida secara khusus atau pejabat istana secara lebih luas. Makna konkret dipakai dalam teks, sedangkan alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: מִשֹּׁמְרֵי הַסַּף
  choice: yang termasuk para penjaga pintu masuk
  rationale: מִן bersifat partitif dan menunjukkan bahwa keduanya merupakan anggota kelompok penjaga; 'pintu masuk' menyampaikan fungsi סַף secara lebih alami daripada 'ambang' dalam konteks ini.
- source_word: בִּקְשׁוּ
  choice: telah berusaha
  rationale: Kata kerja ini berarti mencari atau mengupayakan; dalam konteks persekongkolan, 'berusaha' menyatakan maksud menuju tindakan tanpa menyiratkan keberhasilan.
- source_word: לִשְׁלֹחַ יָד
  choice: mencelakai
  rationale: Idiom harfiah 'mengulurkan tangan' menyatakan tindakan bermusuhan. 'Mencelakai' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi cara serangan tertentu.
- source_word: בַּמֶּלֶךְ אֲחַשְׁוֵרוֹשׁ
  choice: Raja Ahasyweros
  rationale: Nama raja menjadi sasaran idiom tindakan bermusuhan; ejaan Ahasyweros mengikuti bentuk Indonesia yang dekat dengan nama Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan nuansa penemuan dalam arsip serta rangkaian klausa sumber, sambil memakai ungkapan Indonesia yang wajar. Semua penanda catatan kaki muncul dalam teks utama.
