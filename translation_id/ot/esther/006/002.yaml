  to: Lalu ditemukan catatan bahwa Mordekhai telah melaporkan tentang Bigtana dan Teresh[a], dua sida-sida raja[b] yang termasuk kelompok penjaga pintu masuk. Keduanya telah berusaha mencelakai Raja Ahasyweros.
  rationale: Revisi menambahkan "tentang" untuk menerjemahkan fungsi עַל sebagai penanda pokok laporan dan mengganti klausa relatif terakhir dengan kalimat bersubjek "Keduanya" agar pelaku upaya mencelakai raja tidak ambigu. Catatan kaki yang ada sudah tepat dan semua penandanya tetap terpasang.
