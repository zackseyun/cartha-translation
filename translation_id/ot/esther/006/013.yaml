  - severity: low
    issue: '''Orang-orang bijaknya'' kurang idiomatis'
    rationale: '''Para orang bijaknya'' lebih alami dalam bahasa Indonesia modern untuk חֲכָמָיו, sambil tetap mempertahankan gambaran ''orang-orang bijak'' milik Haman.'
