  terminology: Nama Zeresh dan Mordekhai konsisten. 'Keturunan orang Yahudi' menyampaikan makna זֶרַע dengan baik; catatan kaki secara tepat mencatat metafora harfiahnya. 'Engkau' sesuai dengan register sastra naratif.
