  text: וַ/יְסַפֵּ֨ר הָמָ֜ן לְ/זֶ֤רֶשׁ אִשְׁתּ/וֹ֙ וּ/לְ/כָל אֹ֣הֲבָ֔י/ו אֵ֖ת כָּל אֲשֶׁ֣ר קָרָ֑/הוּ וַ/יֹּ֩אמְרוּ֩ ל֨/וֹ חֲכָמָ֜י/ו וְ/זֶ֣רֶשׁ אִשְׁתּ֗/וֹ אִ֣ם מִ/זֶּ֣רַע הַ/יְּהוּדִ֡ים מָרְדֳּכַ֞י אֲשֶׁר֩ הַחִלּ֨וֹתָ לִ/נְפֹּ֤ל לְ/פָנָי/ו֙ לֹא תוּכַ֣ל ל֔/וֹ כִּֽי נָפ֥וֹל תִּפּ֖וֹל לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/013.yaml
  text: Then Haman told Zeresh his wife and all his friends everything that had happened to him. Then his wise men and Zeresh his wife said to him[a], “If Mordecai, before whom you have begun to fall, is from the seed of the Jews, you will not prevail against him, for you will surely fall before him.”
translation:
  language: id
  text: Lalu Haman menceritakan kepada Zeresh, istrinya, dan semua sahabatnya segala sesuatu yang telah terjadi padanya. Para orang bijaknya dan Zeresh, istrinya, berkata kepadanya, “Jika Mordekhai, yang di hadapannya engkau sudah mulai jatuh, berasal dari keturunan orang Yahudi[a], engkau tidak akan sanggup mengalahkannya, sebab engkau pasti akan jatuh di hadapannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berasal dari benih orang Yahudi.”
    reason: Menunjukkan metafora Ibrani זֶרַע, “benih”, yang dalam konteks ini berarti garis keturunan.
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: menceritakan
  rationale: Bentuk naratif ini menyatakan bahwa Haman menuturkan kembali peristiwa yang dialaminya; “menceritakan” alami dalam bahasa Indonesia dan tetap memuat gagasan pelaporan.
- source_word: אֹהֲבָיו
  choice: semua sahabatnya
  rationale: Secara leksikal menunjuk kepada orang-orang yang mengasihi atau dekat dengannya; dalam konteks sosial istana, “sahabat” lebih tepat daripada istilah yang dapat menyiratkan pasangan romantis.
- source_word: כָּל אֲשֶׁר קָרָהוּ
  choice: segala sesuatu yang telah menimpanya
  rationale: Konstruksi ini mengacu pada semua hal yang terjadi atas Haman. “Telah menimpanya” mempertahankan nuansa bahwa kejadian tersebut dialami olehnya.
- source_word: חֲכָמָיו
  choice: orang-orang bijaknya
  rationale: Terjemahan ini mempertahankan arti dasar kata Ibrani dan cocok bagi para tokoh berhikmat yang memberi nasihat dalam lingkungan istana Persia.
- source_word: אִם מִזֶּרַע הַיְּהוּדִים
  choice: jika ... berasal dari keturunan orang Yahudi
  rationale: זֶרַע secara harfiah berarti “benih”, tetapi dalam konteks ini menunjuk pada garis keturunan. “Berasal dari keturunan” menyampaikan maknanya secara alami tanpa menghilangkan unsur asal-usul.
- source_word: הַחִלּוֹתָ לִנְפֹּל לְפָנָיו
  choice: yang di hadapannya engkau sudah mulai jatuh
  rationale: Ungkapan ini menyatakan awal kejatuhan Haman dalam hubungannya dengan Mordekhai. Kata “jatuh” dipertahankan agar pengulangannya dengan klausa penutup tetap terdengar.
- source_word: לֹא תוּכַל לוֹ
  choice: engkau tidak akan sanggup mengalahkannya
  rationale: יכל dengan ל menyatakan ketidakmampuan untuk berhasil melawan seseorang; dalam konteks ini, “tidak akan sanggup mengalahkannya” jelas dan idiomatis.
- source_word: נָפוֹל תִּפּוֹל
  choice: engkau pasti akan jatuh
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan kuat pada kepastian tindakan; “pasti” membawa daya tekan tersebut secara alami.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Frasa yang diulang ini menggambarkan kejatuhan atau kekalahan Haman dalam kaitannya dengan Mordekhai; pengulangan yang sama dipertahankan.
theological_decisions:
- issue: Hubungan antara syarat “jika Mordekhai ... berasal dari keturunan orang Yahudi” dan kepastian kejatuhan Haman
  choice: Mempertahankan bentuk syarat sekaligus pernyataan kepastian tanpa menjelaskan alasan teologisnya
  alternative: Menafsirkan ucapan itu secara eksplisit sebagai nubuat atau sebagai pernyataan tentang perlindungan ilahi atas orang Yahudi
  rationale: Teks hanya mencatat kesimpulan para orang bijak dan Zeresh. Terjemahan tidak menambahkan sumber pengetahuan, mekanisme ilahi, atau doktrin yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan “engkau” dipakai dalam kutipan langsung untuk menjaga nada sastra. Struktur pengulangan “jatuh ... jatuh” dan “di hadapannya” dipertahankan karena penting bagi daya retoris ayat.
