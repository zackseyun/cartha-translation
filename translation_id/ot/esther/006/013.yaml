  verdict: revise
  source_fidelity: 'Makna utama diterjemahkan dengan setia: Haman melaporkan semua yang terjadi kepadanya; para orang bijak dan Zeresh menyimpulkan bahwa bila Mordekhai berasal dari keturunan Yahudi, Haman tidak akan mampu mengalahkannya dan pasti jatuh di hadapannya. Bentuk bersyarat, pengulangan ''jatuh'', dan penegasan infinitif absolut נָפוֹל תִּפּוֹל telah dipertahankan. Namun, ''telah menimpanya'' dapat memberi nuansa malapetaka yang tidak secara leksikal dinyatakan oleh כָּל אֲשֶׁר קָרָהוּ (''segala yang terjadi padanya'').'
