  text: וַ/יֹּ֨אמְר֜וּ נַעֲרֵ֤י הַ/מֶּ֨לֶךְ֙ אֵלָ֔י/ו הִנֵּ֥ה הָמָ֖ן עֹמֵ֣ד בֶּ/חָצֵ֑ר וַ/יֹּ֥אמֶר הַ/מֶּ֖לֶךְ יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/005.yaml
  text: The king’s attendants said to him[a], “Look, Haman is standing in the court.” And the king said, “Let him come in.”
translation:
  language: id
  text: Para pelayan raja berkata kepadanya, “Lihat, Haman sedang berdiri di pelataran[a].” Raja berkata, “Biarkan dia masuk.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “halaman istana.”
    reason: Alternatif leksikal bagi חָצֵר; kata itu dapat diterjemahkan sebagai pelataran atau halaman dalam kompleks istana.
lexical_decisions:
- source_word: נַעֲרֵי הַמֶּלֶךְ
  choice: para pelayan raja
  rationale: Dalam lingkungan istana, נַעַר dapat menunjuk kepada orang muda, hamba, atau pelayan. “Para pelayan raja” menyampaikan fungsi mereka secara alami tanpa memastikan usia mereka.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian kepada keadaan yang sedang berlangsung. “Lihat” mempertahankan daya penunjuknya dalam bahasa Indonesia modern.
- source_word: עֹמֵד
  choice: sedang berdiri
  rationale: Bentuk partisip ini menggambarkan keadaan yang tengah berlangsung. Terjemahan ini mempertahankan makna postur secara langsung dan tidak menafsirkannya sebagai “menunggu”.
- source_word: בֶּחָצֵר
  choice: di pelataran
  rationale: חָצֵר berarti area terbuka atau halaman dalam suatu kompleks. “Pelataran” sesuai dengan konteks istana dan menghindari kebingungan dengan “pengadilan”.
- source_word: יָבֹא
  choice: Biarkan dia masuk
  rationale: Bentuk ini menyatakan perintah atau izin dari raja. “Biarkan dia masuk” mempertahankan daya direktif sekaligus gerak masuk ke hadapan raja.
- source_word: הָמָן
  choice: Haman
  rationale: Nama pribadi ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
