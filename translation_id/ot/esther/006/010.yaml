  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ לְ/הָמָ֗ן מַ֠הֵר קַ֣ח אֶת הַ/לְּב֤וּשׁ וְ/אֶת הַ/סּוּס֙ כַּ/אֲשֶׁ֣ר דִּבַּ֔רְתָּ וַֽ/עֲשֵׂה כֵן֙ לְ/מָרְדֳּכַ֣י הַ/יְּהוּדִ֔י הַ/יּוֹשֵׁ֖ב בְּ/שַׁ֣עַר הַ/מֶּ֑לֶךְ אַל תַּפֵּ֣ל דָּבָ֔ר מִ/כֹּ֖ל אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/esther/006/010.yaml
  text: Then the king said to Haman[a], “Hurry, take the robe and the horse, just as you have said, and do so for Mordecai the Jew, who sits at the king’s gate[b]. Leave out nothing from all that you have said.”
translation:
  language: id
  text: Lalu raja berkata kepada Haman, “Cepat, ambillah jubah dan kuda itu, tepat seperti yang telah kaukatakan, lalu lakukanlah demikian bagi Mordekhai, orang Yahudi yang duduk di gerbang istana raja. Jangan lewatkan satu hal pun dari semua yang telah kaukatakan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Jangan biarkan satu hal pun jatuh dari semua yang telah kaukatakan,” sebuah ungkapan yang berarti jangan menghilangkan apa pun.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: Cepat
  rationale: Imperatif ini menuntut tindakan segera; “Cepat” alami dalam perintah langsung bahasa Indonesia modern.
- source_word: קַח
  choice: ambillah
  rationale: Padanan langsung untuk imperatif לקח, dengan partikel -lah yang sesuai bagi perintah tegas dalam register naratif yang bermartabat.
- source_word: הַלְּבוּשׁ
  choice: jubah
  rationale: Dalam konteks ayat sebelumnya, yang dimaksud ialah pakaian kerajaan; “jubah” lebih spesifik dan alami daripada “pakaian” tanpa menambahkan kata “kerajaan” yang tidak muncul pada ayat ini.
- source_word: הַסּוּס
  choice: kuda itu
  rationale: Nomina Ibrani menyebut kuda tertentu yang sudah dibicarakan; “itu” menyampaikan definiteness tanpa menambahkan sifat “kerajaan” pada ayat ini.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: tepat seperti yang telah kaukatakan
  rationale: Mempertahankan hubungan eksplisit dan bernada ironis antara perintah raja dan usul Haman sendiri.
- source_word: וַעֲשֵׂה כֵן
  choice: lalu lakukanlah demikian
  rationale: Padanan ringkas dan wajar bagi perintah untuk melaksanakan hal yang baru saja diuraikan.
- source_word: לְמָרְדֳּכַי
  choice: bagi Mordekhai
  rationale: 'Preposisi לְ berfungsi benefaktif: penghormatan itu harus dilakukan bagi Mordekhai.'
- source_word: הַיְּהוּדִי
  choice: orang Yahudi
  rationale: Dalam kisah Ester, sebutan ini terutama menandai identitas etnis-keagamaan Mordekhai, bukan sekadar asal geografis dari Yehuda.
- source_word: הַיּוֹשֵׁב בְּשַׁעַר הַמֶּלֶךְ
  choice: yang duduk di gerbang istana raja
  rationale: Partisipel tersebut mengenali Mordekhai melalui kedudukan atau keberadaannya yang lazim di kompleks gerbang kerajaan. Penambahan “istana” membuat fungsi gerbang jelas secara alami dalam bahasa Indonesia.
- source_word: אַל תַּפֵּל דָּבָר מִכֹּל אֲשֶׁר דִּבַּרְתָּ
  choice: Jangan lewatkan satu hal pun dari semua yang telah kaukatakan
  rationale: Ungkapan harfiahnya berbicara tentang tidak membiarkan satu hal “jatuh”, tetapi secara idiomatis berarti tidak menghilangkan bagian apa pun.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “kaukatakan” menjaga kelancaran dialog dan ketegasan perintah raja. Penanda catatan kaki [a] ditempatkan sesudah kalimat yang menjelaskan idiom Ibrani.
