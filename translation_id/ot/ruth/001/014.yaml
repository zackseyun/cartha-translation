  text: Then they lifted up their voices and wept again. Orpah kissed her mother-in-law[a], but Ruth clung to her.
translation:
  language: id
  text: Lalu mereka menangis lagi dengan suara nyaring. Orpa mencium ibu mertuanya, tetapi Rut tetap berpaut kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Rut berpaut kepadanya.” Kata penghubung Ibrani dapat diterjemahkan secara sederhana sebagai “dan”, tetapi konteks menunjukkan kontras antara ciuman Orpa dan keterikatan Rut yang berlanjut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשֶּׂנָה קוֹלָן
  choice: dengan suara nyaring
  rationale: Ungkapan Ibrani harfiah berarti “mengangkat suara mereka” dan dalam konteks ratapan menyatakan tangisan yang terdengar keras. Ungkapan “menangis ... dengan suara nyaring” alami dalam bahasa Indonesia tanpa kehilangan daya emosionalnya.
- source_word: וַתִּבְכֶּינָה
  choice: menangis
  rationale: Kata kerja ini menunjuk pada tindakan menangis; pilihan ini jelas, alami, dan sesuai dengan nada naratif.
- source_word: עוֹד
  choice: lagi
  rationale: Adverbia ini menyatakan pengulangan tangisan yang telah disebut sebelumnya.
- source_word: וַתִּשַּׁק
  choice: mencium
  rationale: Kata kerja ini secara langsung berarti “mencium” dan tidak memerlukan perluasan.
- source_word: לַחֲמוֹתָהּ
  choice: ibu mertuanya
  rationale: Nomina ini secara khusus berarti ibu mertua, dan sufiks orang ketiga feminin tunggal merujuk kepada Orpa.
- source_word: דָּבְקָה בָּהּ
  choice: tetap berpaut kepadanya
  rationale: דבק menyatakan keterikatan yang erat atau tindakan berpegang teguh. “Berpaut” mempertahankan kekuatan relasionalnya, sedangkan “tetap” memperjelas keberlanjutan tindakan dalam konteks tanpa menambahkan gagasan teologis khusus.
- source_word: וְ
  choice: tetapi
  rationale: Walaupun konjungsi ini pada dasarnya dapat berarti “dan”, konteks menampilkan kontras antara ciuman Orpa dan keterikatan Rut.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: רוּת
  choice: Rut
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
