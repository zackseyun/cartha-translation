  text: הֲ/לָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲ/לָהֵן֙ תֵּֽעָגֵ֔נָה לְ/בִלְתִּ֖י הֱי֣וֹת לְ/אִ֑ישׁ אַ֣ל בְּנֹתַ֗/י כִּֽי מַר לִ֤/י מְאֹד֙ מִ/כֶּ֔ם כִּֽי יָצְאָ֥ה בִ֖/י יַד יְהוָֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/013.yaml
  text: Would you wait for them until they were grown? Would you refrain from belonging to a man for them? No[a], my daughters, for it is much more bitter for me than for you, because the hand of Yahweh has gone out against me.
translation:
  language: id
  text: Apakah kalian akan menunggu mereka sampai mereka dewasa? Apakah kalian akan tetap tidak bersuami demi mereka[a]? Tidak, anak-anakku, sebab keadaanku jauh lebih pahit daripada keadaan kalian, karena tangan Yahweh telah bertindak melawan aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah kalian akan menahan diri untuk tidak menikah demi mereka?” Verba Ibrani yang dipakai di sini langka dan tampaknya menunjuk pada menahan diri dari pernikahan sambil menunggu calon suami pada masa mendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשַׂבֵּרְנָה
  choice: akan menantikan
  rationale: Kata dari akar שׂבר menyatakan menunggu atau mengharapkan. Dalam konteks anak-anak lelaki yang dibayangkan akan lahir, “menantikan” menyampaikan tindakan menunggu mereka hingga dewasa.
- source_word: עַד אֲשֶׁר יִגְדָּלוּ
  choice: sampai mereka dewasa
  rationale: Frasa ini menunjuk pada tercapainya usia yang memungkinkan anak-anak lelaki hipotetis itu menikah; “dewasa” alami dan ringkas dalam bahasa Indonesia.
- source_word: תֵּעָגֵנָה לְבִלְתִּי הֱיוֹת לְאִישׁ
  choice: akan tetap tidak bersuami
  rationale: עגן adalah verba langka, dan frasa penjelas sesudahnya secara harfiah berarti tidak menjadi milik seorang laki-laki. Dalam konteks ini maksudnya menahan diri dari perkawinan atau tetap tidak bersuami.
- source_word: אַל־בְּנֹתַי
  choice: Jangan, anak-anakku
  rationale: Partikel אַל menyatakan penolakan atau larangan emosional terhadap kemungkinan yang baru disebutkan. “Jangan” mempertahankan bentuk larangannya dan terdengar wajar dalam seruan Naomi.
- source_word: כִּי מַר־לִי מְאֹד מִכֶּם
  choice: sebab keadaanku jauh lebih pahit daripada keadaanmu
  rationale: מַר־לִי menggambarkan keadaan atau nasib Naomi sebagai pahit, sedangkan מִכֶּם dipahami secara komparatif. Penyebutan “keadaan” membuat perbandingan itu jelas dan alami dalam bahasa Indonesia.
- source_word: יָצְאָה בִי יַד יְהוָה
  choice: tangan Yahweh telah bertindak melawan aku
  rationale: Ungkapan ini menggambarkan tindakan ilahi yang menimpa Naomi. “Bertindak melawan aku” mempertahankan citra tangan serta daya adversatif בִי tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Pernyataan Naomi tentang tindakan ilahi dalam penderitaannya
  choice: karena tangan Yahweh telah bertindak melawan aku
  alternative: karena tangan Yahweh telah terulur melawan aku
  rationale: Teks secara langsung menghubungkan penderitaan Naomi dengan tangan Yahweh. Terjemahan mempertahankan pengakuan dan ketegangan teologis itu tanpa melunakkan atau menjelaskannya secara sistematis.
- issue: Hubungan kepahitan Naomi dengan keadaan Rut dan Orpa
  choice: keadaanku jauh lebih pahit daripada keadaanmu
  alternative: aku sangat berduka karena kamu
  rationale: מִכֶּם dapat dipahami sebagai pembanding, sesuai konteks kehilangan Naomi yang lebih luas. Alternatif kausal tetap mungkin secara gramatikal, tetapi bacaan komparatif dipilih karena alur argumentasi menekankan bahwa kedua menantunya masih dapat menikah kembali.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk jamak orang kedua diterjemahkan dengan “kamu” karena Naomi berbicara kepada kedua menantunya secara langsung; konteks menjadikan jumlah jamaknya jelas. Istilah “tidak bersuami” dipilih karena ringkas dan sesuai dengan konteks perkawinan kuno, sementara catatan kaki menyajikan ungkapan alternatif yang lebih eksplisit.
