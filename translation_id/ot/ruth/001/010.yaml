  yaml_path: translation/ot/ruth/001/010.yaml
  text: But they said to her[a], “No, we will return with you to your people.”
translation:
  language: id
  text: Namun mereka berkata kepadanya[a], “Tidak! Kami akan kembali bersamamu kepada bangsamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau secara lebih harfiah: “Sebab kami akan kembali bersamamu kepada bangsamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Namun mereka berkata
  rationale: Bentuk feminin jamak menunjuk kepada kedua menantu Naomi. Konjungsi naratif diterjemahkan “Namun” untuk menyatakan pertentangan dengan desakan Naomi dalam konteks sebelumnya.
- source_word: לָּהּ
  choice: kepadanya
  rationale: Preposisi ל dengan sufiks feminin tunggal menandai penerima perkataan, yaitu Naomi.
- source_word: כִּי
  choice: Tidak!
  rationale: Dalam jawaban langsung ini, כִּי menyatakan bantahan atau penegasan terhadap permintaan Naomi. “Tidak!” menyampaikan daya penolakannya secara alami dalam bahasa Indonesia; nilai harfiahnya dicatat dalam catatan kaki.
- source_word: אִתָּךְ
  choice: bersamamu
  rationale: Preposisi dengan sufiks feminin tunggal menyatakan penyertaan bersama Naomi.
- source_word: נָשׁוּב
  choice: kami akan kembali
  rationale: Kata שׁוּב berarti kembali atau berbalik. “Kembali” mempertahankan pengulangan motif penting dalam Rut 1.
- source_word: לְעַמֵּךְ
  choice: kepada bangsamu
  rationale: עַם di sini menunjuk pada kelompok etnis dan komunitas Naomi. “Bangsa” lebih jelas daripada “kaum” untuk cakupan tersebut dan tetap wajar dalam bahasa Indonesia.
