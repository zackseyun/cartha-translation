  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔/י לָ֥/מָּה תֵלַ֖כְנָה עִמִּ֑/י הַֽ/עֽוֹד לִ֤/י בָנִים֙ בְּֽ/מֵעַ֔/י וְ/הָי֥וּ לָ/כֶ֖ם לַ/אֲנָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/011.yaml
  text: But Naomi said[a], “Turn back, my daughters. Why would you go with me? Do I still have sons in my womb, that they may become husbands for you?”
translation:
  language: id
  text: Tetapi Naomi berkata, “Pulanglah, anak-anakku.[a] Mengapa kalian hendak pergi bersamaku? Masih adakah anak laki-laki dalam kandunganku yang dapat menjadi suami kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putri-putriku”; Naomi menyapa kedua menantunya dengan kasih sayang sebagai anggota keluarganya sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Tetapi Naomi berkata
  rationale: Waw konsekutif melanjutkan kisah, tetapi dalam konteks ini ucapan Naomi berlawanan dengan tekad kedua menantunya untuk ikut, sehingga “Tetapi” menyampaikan hubungan wacana secara alami.
- source_word: שֹׁבְנָה
  choice: Pulanglah
  rationale: Bentuk imperatif feminin jamak dari שׁוב menyuruh kedua perempuan itu kembali. “Pulanglah” alami dalam bahasa Indonesia dan sesuai dengan permintaan Naomi agar mereka kembali ke tempat asal.
- source_word: בְנֹתַי
  choice: anak-anakku
  rationale: Secara harfiah berarti “putri-putriku”. Sapaan “anak-anakku” terdengar alami dan penuh kasih dalam bahasa Indonesia ketika seorang ibu mertua menyapa para menantunya; rincian feminin dan hubungan kontekstual dijelaskan dalam catatan kaki.
- source_word: לָמָּה תֵלַכְנָה עִמִּי
  choice: Mengapa kalian hendak pergi bersamaku?
  rationale: Bentuk imperfek feminin jamak menyatakan tindakan yang diniatkan atau akan dilakukan. “Hendak pergi” mempertahankan nuansa prospektif dalam pertanyaan retoris Naomi.
- source_word: הַעוֹד לִי בָנִים בְּמֵעַי
  choice: Masih adakah anak laki-laki dalam kandunganku
  rationale: Pertanyaan keberadaan dengan עוֹד diterjemahkan secara alami sebagai “Masih adakah”. בָנִים dipertahankan khusus sebagai “anak laki-laki” karena jenis kelamin mereka penting bagi logika perkawinan dalam ayat ini, sedangkan בְּמֵעַי dalam konteks melahirkan paling alami berarti “dalam kandunganku”.
- source_word: וְהָיוּ לָכֶם לַאֲנָשִׁים
  choice: yang dapat menjadi suami kalian
  rationale: אֲנָשִׁים di sini berarti “suami”, bukan sekadar “laki-laki”. “Dapat menjadi” menyampaikan hasil hipotetis yang berada dalam cakupan pertanyaan retoris tanpa mengubahnya menjadi pernyataan pasti.
theological_decisions:
- issue: Latar perkawinan yang tersirat dalam pertanyaan Naomi
  choice: Mempertahankan rujukan langsung kepada anak laki-laki yang dapat menjadi suami mereka tanpa menambahkan penjelasan hukum dalam teks utama
  alternative: Menjelaskan secara eksplisit perkawinan levirat atau kewajiban kerabat
  rationale: Ayat Ibrani hanya mengemukakan kemungkinan anak-anak lelaki Naomi menjadi suami kedua menantunya. Menambahkan sistem hukum tertentu akan melampaui apa yang dinyatakan ayat ini dan berpotensi menyelesaikan latar sosial-teologis secara terlalu spesifik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Bentuk “kalian” cocok karena Naomi berbicara kepada dua perempuan. “Kandungan” dipilih daripada “rahim” agar pertanyaan retoris terdengar alami tanpa kehilangan makna reproduktif teks sumber.
