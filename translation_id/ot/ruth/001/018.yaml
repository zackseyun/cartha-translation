translation:
  language: id
  text: Ketika Naomi melihat bahwa Rut bertekad untuk pergi bersamanya, ia berhenti berbicara kepada Rut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika Naomi melihat
  rationale: Bentuk naratif dengan waw memajukan cerita; 'ketika ... melihat' secara alami menyatakan hubungan waktu. Nama Naomi dijelaskan agar kedua pronomina feminin dalam bahasa Ibrani tidak membingungkan pembaca Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang dilihat atau disadari Naomi, bukan terutama alasan sebab-akibat.
- source_word: מִתְאַמֶּצֶת
  choice: bertekad
  rationale: Bentuk Hitpael dari אמץ menggambarkan penguatan diri atau keteguhan hati; 'bertekad' menyampaikan keteguhan keputusan Rut dengan wajar.
- source_word: הִיא
  choice: Rut
  rationale: Pronomina mandiri menonjolkan subjek. Nama Rut dipakai demi kejelasan karena bahasa Indonesia tidak membedakan 'ia' menurut gender.
- source_word: לָלֶכֶת
  choice: untuk pergi
  rationale: Dalam konteks perjalanan, הלך berarti 'pergi', bukan secara khusus 'berjalan kaki'.
- source_word: אִתָּהּ
  choice: bersamanya
  rationale: Menunjukkan bahwa Rut berniat menyertai Naomi.
- source_word: וַתֶּחְדַּל
  choice: ia berhenti
  rationale: חדל berarti berhenti atau tidak melanjutkan suatu tindakan; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: לְדַבֵּר אֵלֶיהָ
  choice: membujuknya
  rationale: Secara harfiah berarti 'berbicara kepadanya'. Dalam konteks ayat-ayat sebelumnya, pembicaraan Naomi bertujuan mendesak Rut agar kembali, sehingga 'membujuknya' mengungkapkan maksud kontekstual tanpa menentukan isi tambahan.
