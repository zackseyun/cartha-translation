    rationale: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף secara harfiah menyatakan “Kiranya Yahweh melakukan demikian kepadaku, dan menambahkan demikian,” tanpa menyebut bentuk hukuman. Fungsi kutuk diri dapat dijelaskan dalam catatan kaki, tetapi tidak perlu dipersempit dalam teks utama.
