revisions:
- from: Di mana engkau mati, di situ aku akan mati dan dikuburkan. Kiranya Yahweh menghukum aku, bahkan lebih berat lagi,[a] jika sesuatu selain maut memisahkan aku dari engkau.[b]
  to: Di mana engkau mati, di sana aku akan mati, dan di sana aku akan dikuburkan. Kiranya Yahweh melakukan demikian kepadaku, dan bahkan lebih daripada itu,[a] jika sesuatu selain maut memisahkan aku darimu.[b]
  rationale: Revisi memperjelas konstruksi pasif dan lokasi penguburan, menghilangkan penambahan makna “menghukum,” serta membetulkan catatan alternatif agar lebih dekat dengan susunan Ibrani. Makna idiomatis sumpah—bahwa selain maut tidak boleh ada yang memisahkan Rut dari Naomi—tetap dipertahankan dalam teks utama dan didukung catatan kaki.
