  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/אֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְ/שָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִ/י֙ וְ/כֹ֣ה יֹסִ֔יף כִּ֣י הַ/מָּ֔וֶת יַפְרִ֖יד בֵּינִ֥/י וּ/בֵינֵֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/017.yaml
  text: Where you die[a], I will die, and there I will be buried. May Yahweh do so to me, and more also[b], if anything but death separates me from you.
translation:
  language: id
  text: Di mana engkau mati, di sana aku akan mati, dan di sana aku akan dikuburkan. Kiranya Yahweh melakukan demikian kepadaku, dan bahkan lebih daripada itu,[a] jika sesuatu selain maut memisahkan aku darimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Kiranya Yahweh melakukan demikian kepadaku, dan demikian pula Ia menambahkan.” Ini adalah rumusan sumpah Ibrani yang memohon malapetaka ilahi atas diri pengucap jika sumpahnya dilanggar.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “jika maut memisahkan antara aku dan engkau.” Dalam rumusan sumpah ini, ungkapan tersebut lazim dipahami bahwa hanya maut yang boleh memisahkan mereka.'
    reason: ambiguity
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: Di mana
  rationale: Gabungan preposisi בְּ dan אֲשֶׁר menunjuk tempat, secara harfiah ‘di tempat di mana’. ‘Di mana’ menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: תָּמוּתִי / אָמוּת
  choice: engkau mati / aku akan mati
  rationale: Pengulangan akar מות membentuk kesejajaran ikrar yang khidmat. Bentuk pertama merujuk pada kematian Naomi, sedangkan bentuk kedua menyatakan tekad Rut.
- source_word: וְשָׁם אֶקָּבֵר
  choice: di situ aku akan ... dikuburkan
  rationale: וְשָׁם melanjutkan penunjukan tempat, dan bentuk Nifal אֶקָּבֵר bermakna pasif, ‘aku akan dikuburkan’.
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף
  choice: Kiranya Yahweh menghukum aku, bahkan lebih berat lagi
  rationale: Ini adalah rumusan sumpah yang memohon hukuman ilahi atas diri sendiri. Terjemahan ini menyampaikan fungsi ungkapan tersebut dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: כִּי הַמָּוֶת יַפְרִיד
  choice: jika sesuatu selain maut memisahkan
  rationale: Dalam konteks rumusan sumpah, כִּי memperkenalkan keadaan yang akan mendatangkan kutuk. Terjemahan utama mengungkapkan pemahaman idiomatis bahwa hanya maut yang boleh memisahkan mereka; susunan Ibraninya yang lebih ringkas dan ambigu dipertahankan dalam catatan kaki.
- source_word: בֵּינִי וּבֵינֵךְ
  choice: memisahkan aku dari engkau
  rationale: Secara bentuk berarti ‘antara aku dan antara engkau’, tetapi bahasa Indonesia secara alami memakai pola ‘memisahkan aku dari engkau’.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan syarat dalam sumpah Rut
  choice: jika sesuatu selain maut memisahkan aku dari engkau
  alternative: jika maut memisahkan aku dari engkau
  rationale: Ungkapan Ibrani secara formal hanya menyebut maut, tetapi dalam rumusan sumpah lazim dipahami bahwa Rut memohon hukuman jika penyebab apa pun selain maut memisahkan mereka. Karena susunan Ibrani tetap memungkinkan pembacaan yang lebih harfiah, alternatif itu dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Pronomina ‘engkau’ dipakai untuk menjaga nada pribadi dan agung tanpa terdengar terlalu sehari-hari. ‘Menghukum aku’ menjelaskan fungsi rumusan sumpah, sedangkan bentuk idiom Ibraninya disediakan dalam catatan kaki.
