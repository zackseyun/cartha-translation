id: RUT.1.21
reference: Ruth 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְ/רֵיקָ֖ם הֱשִׁיבַ֣/נִי יְהוָ֑ה לָ֣/מָּה תִקְרֶ֤אנָה לִ/י֙ נָעֳמִ֔י וַֽ/יהוָה֙ עָ֣נָה בִ֔/י וְ/שַׁדַּ֖י הֵ֥רַֽע לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/021.yaml
  text: I went away full[a], but Yahweh has brought me back empty. Why do you call me Naomi[b], when Yahweh has testified against me and the Almighty has brought calamity on me?
translation:
  language: id
  text: Aku pergi dalam keadaan penuh, tetapi Yahweh membawa aku pulang dengan tangan hampa. Mengapa kalian memanggil aku Naomi, padahal Yahweh telah bersaksi melawan aku[a] dan Yang Mahakuasa telah mendatangkan malapetaka kepadaku[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah menjawab melawan aku.” Kata kerja Ibrani ini dapat berarti menjawab atau bersaksi melawan seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “telah berbuat buruk terhadapku.” Ungkapan Ibrani ini menunjuk pada kemalangan atau malapetaka yang didatangkan atas Naomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָה
  choice: dengan penuh
  rationale: Mempertahankan gambaran keadaan Naomi dahulu dan pertentangannya dengan 'dengan tangan hampa'; ungkapan ini juga membiarkan kepenuhan itu tetap tidak dirinci.
- source_word: הָלַכְתִּי
  choice: Aku pergi
  rationale: Padanan langsung dan alami untuk verba 'pergi'; konteks sudah menunjukkan keberangkatan Naomi dari tempat ini.
- source_word: וְרֵיקָם
  choice: dengan tangan hampa
  rationale: Mengungkap fungsi adverbial רֵיקָם secara alami dalam bahasa Indonesia, yakni kembali tanpa apa-apa, sambil mempertahankan kontras dengan keadaan 'penuh'.
- source_word: הֱשִׁיבַנִי
  choice: membawa aku pulang
  rationale: Bentuk Hifil bersifat kausatif; pilihan ini mempertahankan Yahweh sebagai pelaku yang menyebabkan Naomi kembali.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: לָמָּה תִקְרֶאנָה לִי נָעֳמִי
  choice: Mengapa kalian memanggil aku Naomi
  rationale: Bentuk verba feminin jamak ditujukan kepada para perempuan Betlehem; 'kalian' membuat sasaran jamaknya jelas dalam bahasa Indonesia modern.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Nama diri ditransliterasikan; makna namanya tidak disisipkan ke dalam teks utama.
- source_word: עָנָה בִי
  choice: telah bersaksi melawan aku
  rationale: Konstruksi ini dapat bernuansa forensik, 'bersaksi melawan'; pilihan tersebut dipertahankan tanpa meleburkannya ke dalam klausa berikut tentang malapetaka.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Menerjemahkan gelar ilahi ke dalam bentuk Indonesia yang lazim dan bermartabat.
- source_word: הֵרַע לִי
  choice: telah mendatangkan malapetaka kepadaku
  rationale: Menyampaikan tindakan yang menyebabkan kemalangan atau bencana tanpa menuduhkan kejahatan moral kepada Allah.
theological_decisions:
- issue: Pernyataan Naomi tentang tindakan Allah dalam penderitaannya
  choice: 'Mempertahankan tindakan ilahi secara langsung: Yahweh ''telah bersaksi melawan aku'' dan Yang Mahakuasa ''telah mendatangkan malapetaka kepadaku''.'
  alternative: Melunakkan menjadi 'telah membiarkan malapetaka menimpaku' atau menafsirkan עָנָה sebagai 'telah menindas aku'.
  rationale: Teks Ibrani mengaitkan pengalaman pahit Naomi langsung dengan Yahweh dan Shaddai. Terjemahan mempertahankan ketegangan teologis itu, tetapi memakai 'malapetaka' alih-alih bahasa yang dapat menyiratkan kejahatan moral pada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina 'aku' sesuai dengan ucapan pribadi Naomi, sedangkan 'kalian' mencerminkan sapaan feminin jamak kepada para perempuan Betlehem. Kontras 'penuh' dan 'dengan tangan hampa' dipertahankan sejelas mungkin.
