base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/004.yaml
  text: And they took for themselves Moabite wives. The name of the one was Orpah[a], and the name of the other was Ruth. And they lived there about ten years.
translation:
  language: id
  text: Mereka mengambil perempuan Moab sebagai istri mereka.[a] Yang seorang bernama Orpa, dan yang kedua bernama Rut. Mereka tinggal di sana kira-kira sepuluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka menikahi perempuan Moab.” Secara harfiah, bahasa Ibrani berbunyi, “mereka mengambil bagi diri mereka perempuan-perempuan Moab sebagai istri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ לָהֶם
  choice: Mereka mengambil ... menjadi istri mereka
  rationale: Ungkapan ini mempertahankan gambaran idiom Ibrani ‘mengambil bagi diri mereka’ sekaligus menyatakan makna perkawinannya dengan jelas dan alami dalam bahasa Indonesia.
- source_word: נָשִׁים מֹאֲבִיּוֹת
  choice: perempuan-perempuan Moab menjadi istri mereka
  rationale: Menunjukkan asal atau identitas Moab para perempuan itu serta status mereka sebagai istri, tanpa memakai bentuk ‘istri-istri Moab’ yang kurang alami.
- source_word: שֵׁם הָאַחַת
  choice: Nama yang seorang ialah
  rationale: Mempertahankan rumusan penamaan dan kontras bilangan feminin dalam teks Ibrani, dengan susunan Indonesia yang tetap dapat dipahami.
- source_word: עָרְפָּה
  choice: Orpa
  rationale: Transliterasi nama pribadi yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: dan nama yang kedua ialah
  rationale: Menerjemahkan bentuk ordinal ‘yang kedua’ secara langsung dan mempertahankan kesejajaran dengan rumusan sebelumnya.
- source_word: רוּת
  choice: Rut
  rationale: Transliterasi nama pribadi yang lazim dalam bahasa Indonesia.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: Mereka tinggal di sana
  rationale: ‘Tinggal’ merupakan padanan modern dan alami untuk menetap atau hidup di suatu tempat dalam jangka waktu panjang.
- source_word: כְּעֶשֶׂר שָׁנִים
  choice: kira-kira sepuluh tahun
  rationale: Awalan כְּ menyatakan perkiraan; ‘kira-kira’ menjaga nuansa tersebut.
