base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/019.yaml
  text: So the two of them went on until they came to Bethlehem. And when they came to Bethlehem[a], the whole town was stirred because of them, and the women said, “Is this Naomi?”
translation:
  language: id
  text: Lalu keduanya berjalan terus sampai tiba di Betlehem. Ketika mereka tiba di Betlehem, seluruh kota menjadi gempar karena mereka, dan para perempuan berkata[a], “Apakah ini Naomi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata kerja “berkata” berbentuk feminin jamak, yang menunjukkan bahwa para penuturnya adalah perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלַכְנָה שְׁתֵּיהֶם
  choice: Lalu keduanya berjalan terus
  rationale: Bentuk naratif dari הלך menunjukkan kelanjutan perjalanan, sedangkan שְׁתֵּיהֶם menegaskan Naomi dan Rut sebagai satu pasangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan kedua unsur tersebut.
- source_word: עַד בֹּאנָה
  choice: sampai tiba
  rationale: עַד bersama בוא menandai titik akhir perjalanan. 'Sampai tiba' menyampaikan fungsi itu dengan ringkas dan alami.
- source_word: בֵּית לָחֶם
  choice: Betlehem
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, bukan diterjemahkan secara harfiah.
- source_word: וַיְהִי כְּבֹאנָה
  choice: Ketika mereka tiba
  rationale: Formula naratif ini terutama menyatakan waktu terjadinya peristiwa berikutnya. Terjemahan ini mempertahankan hubungan temporal tanpa ungkapan Indonesia yang kaku seperti 'dan terjadilah ketika'.
- source_word: וַתֵּהֹם כָּל הָעִיר
  choice: seluruh kota menjadi gempar
  rationale: Kata kerja dari המה menggambarkan kegaduhan atau kegemparan bersama. 'Menjadi gempar' mempertahankan kuatnya reaksi komunal tanpa menentukan apakah reaksinya gembira atau cemas.
- source_word: עֲלֵיהֶן
  choice: karena mereka
  rationale: Preposisi עַל di sini menyatakan sebab atau alasan kegemparan kota, yakni kedatangan Naomi dan Rut.
- source_word: וַתֹּאמַרְנָה
  choice: para perempuan berkata
  rationale: Bentuk verba ini adalah feminin jamak, sehingga para penuturnya adalah perempuan. Hal itu dinyatakan secara eksplisit agar informasi gramatikal Ibrani tidak hilang dalam bahasa Indonesia.
- source_word: הֲזֹאת נָעֳמִי
  choice: Apakah ini Naomi?
  rationale: Partikel tanya dan kata tunjuk membentuk pertanyaan pengenalan yang bernada heran. Terjemahan langsung ini tidak menambahkan penekanan seperti 'benarkah' yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Kota' dipertahankan sebagai padanan langsung עִיר, sedangkan 'menjadi gempar' menjaga intensitas reaksi tanpa menafsirkan jenis emosinya.
