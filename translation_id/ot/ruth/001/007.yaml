translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Nama Naomi tidak ditambahkan karena teks Ibrani memakai pronomina. Susunan kalimat dibuat alami tanpa menghilangkan gerak keluar, kebersamaan ketiga perempuan, perjalanan, dan tujuan kembali ke Yehuda.
