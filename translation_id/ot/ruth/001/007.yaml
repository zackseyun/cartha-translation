  text: So she went out from the place where she had been[a], and her two daughters-in-law with her, and they went on the way to return to the land of Judah.
translation:
  language: id
  text: Lalu ia keluar dari tempat ia berada, bersama kedua menantunya, dan mereka menempuh perjalanan untuk kembali ke tanah Yehuda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: Lalu ia keluar
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, dan “keluar” mempertahankan gerak konkret verba יָצָא tanpa mengubahnya menjadi “meninggalkan”.
- source_word: מִן־הַמָּקוֹם אֲשֶׁר הָיְתָה שָׁמָּה
  choice: dari tempat tinggalnya
  rationale: Ungkapan ini secara alami menyampaikan “dari tempat di mana ia berada/tinggal”; konteks menunjukkan tempat kediaman Naomi sebelum keberangkatannya.
- source_word: וּשְׁתֵּי כַלֹּתֶיהָ עִמָּהּ
  choice: bersama kedua menantunya
  rationale: כַּלָּה dalam konteks keluarga ini berarti menantu perempuan. Dalam bahasa Indonesia, “menantu” sudah wajar dan tidak ambigu dalam konteks kedua perempuan tersebut.
- source_word: וַתֵּלַכְנָה בַדֶּרֶךְ
  choice: dan mereka menempuh perjalanan
  rationale: Gabungan verba “pergi” dan frasa “di jalan” diterjemahkan secara idiomatis sebagai perjalanan yang sedang ditempuh, tanpa mengharuskan arti khusus “berjalan kaki”.
- source_word: לָשׁוּב
  choice: untuk kembali
  rationale: Mempertahankan arti dasar שׁוּב serta motif penting “kembali” dalam Rut 1.
- source_word: אֶל־אֶרֶץ יְהוּדָה
  choice: ke tanah Yehuda
  rationale: אֶרֶץ dipertahankan sebagai “tanah” karena teks secara eksplisit menyebut wilayah Yehuda, bukan hanya nama Yehuda.
