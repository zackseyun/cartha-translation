  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan urutan naratif וַיָּמָת melalui “Kemudian ... meninggal,” hubungan “suami Naomi,” serta hasil kehilangan itu: Naomi dan kedua putranya tetap tinggal/tersisa. “Tinggallah Naomi bersama kedua anak laki-lakinya” merupakan cara idiomatis dan cukup dekat untuk mengungkapkan konstruksi Ibrani “ia dan kedua putranya.”'
