base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/003.yaml
  text: Then Elimelech[a], Naomi’s husband, died, and she was left, and her two sons.
translation:
  language: id
  text: Kemudian Elimelekh, suami Naomi, meninggal. Tinggallah Naomi bersama kedua anak laki-lakinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Kemudian” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: אֱלִימֶלֶךְ
  choice: Elimelekh
  rationale: Nama diri ditransliterasikan dengan ejaan Indonesia yang mencerminkan konsonan akhir Ibrani.
- source_word: אִישׁ נָעֳמִי
  choice: suami Naomi
  rationale: Dalam konstruksi dengan nama seorang perempuan, אִישׁ di sini menyatakan hubungan perkawinan, sehingga “suami Naomi” merupakan padanan yang jelas dan alami.
- source_word: וַתִּשָּׁאֵר
  choice: Tinggallah
  rationale: Kata kerja שׁאר menunjukkan keadaan tetap tinggal atau tersisa setelah suatu kehilangan. Bentuk inversi “Tinggallah” menyampaikan hasil peristiwa itu secara ringkas dan wajar.
- source_word: הִיא וּשְׁנֵי בָנֶיהָ
  choice: Naomi bersama kedua anak laki-lakinya
  rationale: Ungkapan ini mempertahankan Naomi dan kedua putranya sebagai pihak-pihak yang tetap tinggal. Nama “Naomi” dipakai kembali agar rujukan jelas, sedangkan “bersama” menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan sintaksis dasarnya.
